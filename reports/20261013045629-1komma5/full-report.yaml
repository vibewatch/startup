      - number: '6.2'
        title: Adoption Trajectory and Deployment Scale
        blocks:
          - type: paragraph
            body: >-
              The operating footprint of 1KOMMA5° has scaled across approximately 80 operating locations in seven
              international markets, supported by the integration of more than 300,000 decentralized, controllable
              energy assets into field operations. A substantial driver of domestic deployment volume in Germany has
              been residential heating electrification: company disclosures verify over 10,000 heat pump installations
              completed in Germany over a 24-month span, with 2025 installation volume roughly quadrupling relative to
              the previous year. Concurrently, adoption of the software layer has expanded, with Heartbeat AI actively
              orchestrating more than 40,000 residential systems to execute dynamic electricity trading, grid
              stabilization, and automated self-consumption. Nevertheless, from an investment diligence perspective,
              significant denominator gaps persist across published figures. Reported metrics do not disclose total
              unique multi-asset households versus gross cumulative equipment units, nor do they separate standard
              standalone solar installations from fully connected Heartbeat virtual power plant subscribers.
            claimRefs:
              - CU004
              - CU005
