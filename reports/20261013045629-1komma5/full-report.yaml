          - type: callout
            title: Unverified Private Unit Economics and Working Capital Drag
            body: >-
              Despite guidance of €40 million in core hardware EBITDA and €700 million in 2026 revenue, lack of audited
              disclosures regarding hardware gross margins, warranty liabilities, and branch acquisition integration
              costs limits underwriting certainty.
            calloutType: risk
            claimRefs:
