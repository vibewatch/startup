      - number: '6.4'
        title: Retention Durability, Software Monetization, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              While 1KOMMA5° demonstrates rapid hardware deployment momentum, the durability and expansion economics of
              its installed base remain unverified by audited recurring-revenue benchmarks. The business model depends
              on transitioning one-off residential hardware buyers into perpetual participants in its virtual power
              plant through Heartbeat AI's flat software fee and dynamic power tariff optimization. However, 1KOMMA5°
              has disclosed neither net revenue retention (NRR) nor annual customer churn rates for Heartbeat software
              subscriptions. In addition, customer acquisition concentration is heavily tied to single-family
              residential owner-occupiers in Germany, leaving the company exposed to shifts in domestic German
              subsidies, changing rooftop feed-in tariff policies, and construction supply-chain capacity. Customer
              cross-selling across the four primary asset categories (solar, storage, heat pumps, and EV wallboxes) is
              supported by regional showroom events and marketing bundles, but empirical fleet-wide attach rates across
              multi-product households remain a key diligence gap.
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU013
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Hardware Turnkey Bundle vs Software Orchestration Gap
            body: >-
              1KOMMA5° has achieved rapid hardware distribution by acquiring regional master craftsmen and offering €1
              billion in zero-upfront financing, but its long-term enterprise valuation depends on whether residential
              hardware buyers remain sticky, paying subscribers of Heartbeat AI. With 40,000 systems actively managed
              out of more than 300,000 installed devices, converting existing hardware customers into active virtual
              power plant participants is the central operational hurdle.
            calloutType: insight
            claimRefs:
              - CU001
              - CU004
              - CU006
              - CU007
          - type: callout
            title: Customer Service Friction Across Acquired Regional Craftsmen
            body: >-
              Third-party customer review evidence indicates that while hardware and technical craftsmanship maintain
              solid ratings (4.3–4.5/5), customer service and value perception lag at 4.2/5, with nearly 19% of
              Australian reviewers awarding 3 stars or fewer. Rapid regional acquisitions create handoff frictions in
              warranty service, rebate filing, and customer support responsiveness that threaten brand equity.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU012
