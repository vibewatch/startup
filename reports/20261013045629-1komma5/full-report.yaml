            claimRefs:
              - CR005
              - CR008
              - CR011
              - CR012
      - number: '7.3'
        title: Counterparty, Hardware Supplier, and Market Dependencies
        blocks:
          - type: paragraph
            body: >-
              1KOMMA5°'s product architecture introduces critical upstream hardware dependencies on a concentrated set
              of manufacturing partners. In residential heating, the company relies on established heating original
              equipment manufacturers such as Daikin and Stiebel Eltron for heat pump hardware supply. For energy
              storage, while the proprietary stackable battery casing is German-engineered, the underlying prismatic
              lithium iron phosphate (LFP) cells originate from Asian chemical and battery manufacturers subject to
              geopolitical and shipping friction. Furthermore, 1KOMMA5°'s expansion strategy across seven international
              jurisdictions—including Germany, Australia, Denmark, Spain, Finland, the Netherlands, and Sweden—is built
              upon acquiring regional craftsman businesses through equity stakes and growth financing. This federated
              structure isolates customer service and warranty obligations within regional operating legal entities, but
              exposes the parent company to local key-person departures and regional integration frictions if acquired
              founder-craftsmen transition out of active management.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR006
              - CR007
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
      - number: '7.4'
        title: Financial Exposure, Margin Compression, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              From a financial perspective, 1KOMMA5°'s rapid roll-up of physical installation businesses carries
              substantial working capital commitments and long-tail balance sheet exposures. Offering 30-year warranties
              on glass-glass TOPCon solar modules and 12-year warranties on home battery systems creates contingent
              liabilities that could burden future earnings if original hardware manufacturers dispute defect claims or
              insolvency occurs upstream. Concurrently, secondary share trading on private platforms such as EquityZen
              reflects informal liquidity mechanisms for early employees, but provides no transparency into consolidated
              net margins, debt covenants, or preferred share liquidation preferences. Core thesis-break triggers for
              investors include: (1) a legislative feed-in tariff cancellation in 2027 that leads to residential solar
              cancellation rates exceeding 25%; (2) secondary hardware tariff spikes that compress installation gross
              margins below 20%; (3) an inability to convert hardware buyers into high-margin recurring Heartbeat AI
              software subscribers; or (4) widespread warranty claims resulting from acquired branch craftsmanship
              defects that overwhelm regional reserves.
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR010
              - CR012
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Impending 2027 Feed-in Tariff Cliff and Hardware Tariff Squeeze
            body: >-
              The confluence of German draft legislation eliminating EEG feed-in tariffs for residential solar under 25
              kW by 2027 and escalating international trade tariffs on solar modules and battery cells threatens to
              squeeze installer margins while simultaneously reducing homeowner standalone solar payback, making
              software-driven self-consumption and battery pairing an existential requirement rather than an optional
              upsell.
            calloutType: risk
            claimRefs:
              - CR005
              - CR010
              - CR012
          - type: callout
            title: 'Diligence Imperative: Audit Branch-Level Integration and Warranty Liabilities'
            body: >-
              Prospective pre-IPO investors must insist on branch-level financial audits across 1KOMMA5°'s 50+ German
              locations and acquired international entities, specifically verifying local craftsman retention
              agreements, warranty reserve provisions for 30-year PV module and 12-year battery guarantees, and actual
              gross margins post-2025 hardware price adjustments.
            calloutType: recommendation
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Entry Discipline
        blocks:
          - type: paragraph
            body: >
              The evidence supports a research-more recommendation rather than a buy decision. Trending Topics reports a
              €70 million financing at a company-stated $1.35 billion valuation, while Multiples records the same
              October 2026 event as $79 million at $1.4 billion. Those reports establish a reference mark, not an
              investable common-equity price: neither public source supplies the post-money share count, liquidation
              stack, anti-dilution rights, or round documents. Price discipline therefore has to start with verified
              security terms and a normalized enterprise-value bridge. The held IPO and the earlier revenue-target miss
              make the absence of those inputs material rather than procedural, so confidence remains medium and risk
              remains high.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV010
              - CV016
