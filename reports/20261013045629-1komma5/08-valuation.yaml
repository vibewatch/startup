  - id: "TV003"
    title: "Bull, Base, and Bear Scenario Framework"
    columns:
      - "Scenario"
      - "Explicit assumptions"
      - "Valuation / return logic"
      - "Key risks and downside trigger"
      - "Probability signal"
    rows:
      - - "Bull"
        - "Revenue and €40M hardware EBITDA guidance are met; Heartbeat grows beyond its €30M run-rate with verified recurring margins."
        - "A premium above the $1.35B-$1.4B reference mark is supportable only after software quality and fully diluted terms are verified."
        - "Trigger fails if reported growth does not convert into cash or software retention."
        - "Unscored: public evidence is insufficient for a defensible probability."
      - - "Base"
        - "Revenue approaches €700M, hardware EBITDA is near guidance, and software grows without demonstrated premium economics."
        - "The latest $1.35B-$1.4B mark remains the reference; no reliable upside range or target return can be calculated."
        - "Another guidance miss or prolonged listing delay removes the limited execution premium."
        - "Best aligned with current guidance, but not assigned a numeric probability."
      - - "Bear"
        - "Revenue or EBITDA misses guidance, Heartbeat conversion stalls, or liquidity remains unavailable."
        - "Value falls below the latest reference mark; the floor and common-equity recovery are indeterminate without preference terms."
        - "A down round or senior preference overhang becomes the thesis-break event."
        - "Material downside case; no probability estimate is supported."
    notes: "Scenario boundaries use the latest reported financing mark and management guidance. Numeric probabilities, target returns, and a downside valuation floor are omitted because ownership, net debt, and preference terms are unavailable."
    claimRefs:
