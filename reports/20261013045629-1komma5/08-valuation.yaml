company:
  name: "1KOMMA5°"
chapter:
  number: 8
  title: "Valuation"
  summary: "The latest reported financing sets a $1.35 billion to $1.4 billion reference mark, but public evidence does not disclose preference terms or independently verify management's 2026 forecasts. The appropriate stance is research-more with medium confidence, high risk, and no underwritten numeric return range."
sections:
  - id: "recommendation-and-entry-discipline"
    title: "Recommendation and Entry Discipline"
    body: >
      The evidence supports a research-more recommendation rather than a buy decision. Trending
      Topics reports a €70 million financing at a company-stated $1.35 billion valuation, while
      Multiples records the same October 2026 event as $79 million at $1.4 billion. Those reports
      establish a reference mark, not an investable common-equity price: neither public source
      supplies the post-money share count, liquidation stack, anti-dilution rights, or round
      documents. Price discipline therefore has to start with verified security terms and a
      normalized enterprise-value bridge. The held IPO and the earlier revenue-target miss make
      the absence of those inputs material rather than procedural, so confidence remains medium
      and risk remains high.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV009"
      - "CV010"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "operating-proof-and-valuation-quality"
    title: "Operating Proof and Valuation Quality"
    body: >
      Management's current case combines a €700 million 2026 revenue forecast, 35% to 40% growth,
      roughly €40 million of hardware EBITDA, and about €30 million of annualized Heartbeat AI
      revenue. This is meaningful operating evidence, but it mixes a forward hardware forecast
      with a software run-rate and does not disclose audited segment gross margin, retention, or
      cash conversion. The company also says annual software research and development of about
      €35 million will be funded from operating cash flow and that customer-segment financing
      facilities leave the corporate balance sheet debt-free. Those claims improve the thesis,
      but do not by themselves justify a software multiple for the consolidated installer-heavy
      business.
    claimRefs:
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV011"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV002"
  - id: "scenarios-without-false-precision"
    title: "Bull, Base, and Bear Cases Without False Precision"
    body: >
      Scenario work should use the latest reported $1.35 billion to $1.4 billion financing mark
      as a reference, not as proof of fair value. A bull case requires delivery of the revenue and
      EBITDA guidance plus independently verified recurring software economics; only then would
      a premium to the reference mark be analytically supportable. The base case is execution near
      guidance with limited evidence for multiple expansion. The bear case is another material
      target miss, delayed liquidity, or weak Heartbeat conversion, with downside magnified by
      unknown preferences. Public inputs cannot support probability percentages, a valuation
      floor, or target returns, so the table records signals and decision rules instead of invented
      precision.
    claimRefs:
      - "CV002"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV009"
      - "CV010"
      - "CV012"
      - "CV016"
    tableRefs:
      - "TV003"
  - id: "exit-readiness-and-final-diligence"
    title: "Exit Readiness and Final Diligence"
    body: >
      The company has pre-IPO positioning and an EquityZen page describing potential shareholder
      liquidity, but neither proves an active executable market at a disclosed price. Trending
      Topics reports that the planned listing remains on hold and depends on future performance.
      Final diligence should obtain the October 2026 financing documents, a fully diluted cap
      table, liquidation and participation terms, audited 2025 results, current 2026 management
      accounts, and Heartbeat cohort economics. Thesis-break triggers are a repeat material miss
      against the €700 million guide, failure to substantiate hardware EBITDA and operating cash
      flow, or financing terms that leave common equity with poor recovery near the latest
      reported mark.
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV013"
      - "CV016"
