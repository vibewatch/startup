      - number: '4.2'
        title: 交钥匙定价、变现结构和客户回本
        blocks:
          - type: paragraph
            body: >-
              住宅电气化定价遵循资本密集型交钥匙项目模式。在德国，标准住宅 10 kWp 光伏系统加储能的交钥匙标价约为 25,000 euros，即每安装 kilowatt-peak 约 1,000 至 1,800
              euros。客户经济性高度依赖能源账单节省：用现场生产、有效成本为每千瓦时 5 cents 的太阳能，替代超过每千瓦时 35 cents 的电网用电。向电网输送的剩余太阳能可在 20 年内获得法定 EEG
              电价；对于低于 10 kWp 的系统，该电价为每千瓦时 7.78 cents，预计客户回本期为 7 至 12 年。Heartbeat AI
              会在负价或低价时段自动购电，并在电价高峰时放电，以改善回本表现。不过，由于立法拟逐步取消 2026 年之后系统的上网补贴，长期消费者采用将越来越取决于算法驱动的市场套利，而非有保障的公共上网收入。
