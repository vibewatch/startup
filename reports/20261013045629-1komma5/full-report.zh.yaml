              - CV016
      - number: '8.2'
        title: 经营验证与估值质量
        blocks:
          - type: paragraph
            body: >
              管理层当前的说法包括：2026 年收入预测为 €700m，增长 35% 至 40%，硬件 EBITDA 约 €40m，以及 Heartbeat AI 年化收入约
              €30m。这些经营数据有参考价值，但把硬件的前瞻预测与软件收入跑率混在一起，也没有披露经审计的分部毛利率、留存率或现金转化率。公司还称，约 €35m
              的软件年度研发费用将由经营现金流承担，面向客户的融资工具不会给公司资产负债表留下债务。这些说法能改善投资逻辑，却不足以单独为这家安装业务占主导的合并公司套用软件倍数。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
      - number: '8.3'
        title: 不制造虚假精度的乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >
              情景分析应把最新报道的 $1.35b 至 $1.4b 融资估值作为参考，而不是公允价值证明。乐观情景要求公司兑现收入和 EBITDA
              指引，并由独立方验证可重复的软件经济性；只有这样，参考估值之上的溢价才有分析依据。基准情景是执行接近指引，但支持倍数扩张的证据有限。悲观情景则是再次大幅未达目标、流动性延后或 Heartbeat
              转化疲弱，而未知的优先权会进一步放大下行。公开信息不足以支持概率、估值底线或目标回报率，因此表格记录信号和决策规则，不编造精确数字。
            claimRefs:
              - CV002
