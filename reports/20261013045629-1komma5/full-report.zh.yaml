              - CV016
      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >
              公司处于 IPO 前定位，EquityZen 页面也描述了股东潜在的流动性，但两者都不能证明存在按披露价格可实际执行的活跃市场。Trending Topics
              报道称，拟议上市仍处于暂停状态，取决于未来业绩。最终尽调应取得 2026 年 10 月融资文件、完全摊薄股权结构表、清算及参与条款、经审计的 2025 年业绩、2026 年最新管理账目和 Heartbeat
              用户群经济性。若再次大幅低于 €700m 指引、无法证明硬件 EBITDA 和经营现金流，或融资条款导致普通股在最新报道估值附近回收率很低，都将破坏投资逻辑。
            claimRefs:
              - CV003
