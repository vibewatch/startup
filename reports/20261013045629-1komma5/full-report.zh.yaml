      - number: '6.3'
        title: 客户验证、评价记录和部署摩擦
        blocks:
          - type: paragraph
            body: >-
              终端用户采用和运营可靠性的证据，在标准化企业基础设施与本地化消费者安装流程之间明显分化。企业端使用 Google Cloud BigQuery 和 Cloud Run，接收其联网逆变器、电池和热泵车队的实时
              IoT 遥测数据，并将收购来的不同区域业务集中到共同的操作系统中。消费者零售市场的第三方评分显示初始客户满意度中等偏强，但也存在明显运营摩擦。在独立的澳大利亚平台 SolarQuotes
              上，包含悉尼和墨尔本收购的 Solaray Energy 分支在内，1KOMMA5° 获得 742 条客户评价，综合评分为
              4.2/5。分项评分显示，系统质量（4.5/5）和安装（4.3/5）得分较高，但客户服务（4.2/5）和性价比（4.2/5）较低，其中 139 条评价为 3
              星或更低。客户反馈反复提到安装后的摩擦点，包括服务响应时间过长、安装后补贴或返款文件处理延迟，以及中央销售代表与分散安装团队之间的沟通交接缺口。
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU012
              - CU014
              - CU015
