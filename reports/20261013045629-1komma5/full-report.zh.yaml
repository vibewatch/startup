            body: >-
              1KOMMA5°
              通过一套成套硬件为住宅提供家庭电气化方案，包括屋顶光伏组件、模块化磷酸铁锂（LFP）储能系统、热泵、电动车墙盒充电器和强制安装的智能电表网关。在核心德国市场，公司安装全黑玻璃—玻璃双面太阳能组件，采用
              TOPCon N 型电池，额定功率最高 470 Wp、组件效率 23.5%，并提供 30 年性能质保。在储能层，1KOMMA5° 销售自有模块化电池架构，采用棱柱形 LFP 化学体系，可扩展至 41.9
              kWh，持续充放电功率最高 20.16 kW。电池固件采用 Micro-Cycle 技术，执行高频微充放电，以降低批发市场电力套利期间的热应力。不同于纯软件聚合商，1KOMMA5°
              要求每次太阳能安装都配套智能电表，直接绕过德国配电系统运营商（DSO）的部署延迟，建立执行动态电价所需的低延迟边缘测量基线。
