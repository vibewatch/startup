        - 贸易禁运、关键矿产出口配额或运输中断
        - High
        - 兼容替代电芯规格的可堆叠模块化架构
        - 若必须确保获得不受关税影响的电池电芯供应，硬件成本将上升
      - - 区域工匠负责人
        - 被收购公司的工匠负责人创始人
        - 本地分支管理和持牌工种执行
        - 各本地辖区均为 High
        - 创始人离任或收购后的文化冲突
        - Medium
        - 创始人持股参与和成长资本激励
        - 关键工匠负责人离任后，本地分支执行速度放缓
      - - IPO 前股东二级交易平台
        - EquityZen 与二级基金
        - 促进早期员工和股东股份流动性
        - Moderate
        - 不受监管的二级市场定价扭曲 IPO 前估值预期
        - Medium
        - 公司与二级交易估值保持独立、非关联立场
        - 若公开发行定价低于私人二级交易标记，估值将承压
    notes: 上游硬件、本地安装商和平台交易对手的关键依赖；按严重程度排序。
    claimRefs:
      - CR001
      - CR002
      - CR007
      - CR008
  - id: TV001
    title: 建议摘要
    columns:
      - 决策字段
      - 当前判断
      - 证据基础
      - 决策含义
    rows:
      - - 建议
        - Research-more
        - 据报道存在一项融资估值标记，但证券条款和经审计的当前业绩均不可得。
        - 在数据室证据到位前，不要评估入场投资。
      - - 信心
        - Medium
        - 两个独立来源描述了最新一轮融资；运营指引仍由公司提供。
        - 将该标记视为参考值，而非经独立验证的公允价值。
      - - 风险评级
        - High
        - IPO 暂停，先前收入目标未达成，且优先股堆叠不可得。
        - 要求开展下行情景瀑布和现金转化尽调。
      - - 估值立场
        - 估值偏高 / 未纳入投资判断
        - 最新报道的标记为 $1.35B-$1.4B，但支撑溢价所需的软件经济性尚未披露。
        - 仅凭公开记录不应支付溢价倍数。
      - - 入场纪律
        - Terms-first
        - 标题估值无法揭示持股、稀释或清算优先级。
        - 只有在核实完全稀释后的股权结构表和优先权瀑布后，才能定价。
    notes: 判断采用最新融资报道和公司指引；留存证据中没有公开可得的当前股价、股权结构表、优先权瀑布或经审计的 2026 年财务报表。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV009
      - CV010
      - CV013
      - CV016
  - id: TV002
    title: 论点与反论点
    columns:
      - 方向
      - 论点
      - 公开证据
      - 哪些信息会改变判断
    rows:
      - - 论点
        - 一体化硬件和 Heartbeat 栈创造了多个变现入口。
        - 产品组合包括可扩容储能和兼容 Heartbeat 的控制系统。
        - 核实附加率、队列留存、经常性毛利率和客户节省金额。
      - - 论点
        - 管理层预计 2026 年实现显著增长和硬件 EBITDA 为正。
        - 预计 2026 年收入为 €700M，硬件 EBITDA 为 €40M。
        - 结合经审计业绩和软件研发后的现金转化情况确认。
      - - 论点
        - 这套运营模式可以通过本地企业配置资本和运营支持。
        - B2B 页面介绍了股权投资、成长融资和运营项目。
        - 展示收购层面的回报，以及各队列的有机表现。
      - - 反论点
        - 先前一次重大目标未达成，削弱了执行可信度。
        - 独立报道显示 2024 年收入为 €520M-€540M，而计划最高达到 €750M。
        - 连续两个报告期达到或超过指引，可缓解这一担忧。
      - - 反论点
        - 已披露的单位经济性尚不足以支撑软件溢价。
        - 软件年化收入约为 €30M，但利润率和留存率未披露。
        - 提供经审计的分部收入、毛利率、流失率和现金贡献。
    notes: 公司指标明确按管理层口径处理；2024 年数据来自公司初步业绩报道，留存出版物之间相差 €20M。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV007
      - CV009
      - CV010
      - CV011
      - CV014
      - CV015
  - id: TV003
    title: 乐观、基准与悲观情景框架
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 关键风险和下行触发因素
      - 概率信号
    rows:
      - - 乐观
        - 收入和 €40M 硬件 EBITDA 指引达成；Heartbeat 在经验证的经常性利润率支撑下，收入超过 €30M 的运行速率。
        - 只有在软件质量和完全稀释条款得到核实后，$1.35B-$1.4B 参考标记之上的溢价才有依据。
        - 若报道的增长未转化为现金或软件留存，触发条件即告失败。
        - 未评分：公开证据不足以支持可辩护的概率判断。
      - - 基准
        - 收入接近 €700M，硬件 EBITDA 接近指引；软件增长，但尚未展现溢价经济性。
        - 最新的 $1.35B-$1.4B 标记仍是参考值；无法计算可靠的上行区间或目标回报。
        - 再次错过指引或上市长期延迟，将抹去有限的执行溢价。
        - 与当前指引最为一致，但未赋予数值概率。
      - - 悲观
        - 收入或 EBITDA 未达指引，Heartbeat 转化停滞，或流动性仍不可得。
        - 价值跌破最新参考标记；在缺少优先权条款的情况下，底价和普通股回收额无法确定。
        - 下轮融资或高级优先权悬置成为击穿论点的事件。
        - 重大下行情景；没有证据支持概率估计。
    notes: 情景边界采用最新报道的融资标记和管理层指引。由于持股、净债务和优先权条款不可得，未列出数值概率、目标回报和下行估值底价。
    claimRefs:
      - CV001
