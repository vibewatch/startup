      - number: '3.3'
        title: 差异化机制、动态电价和转换成本
        blocks:
          - type: paragraph
            body: >-
              住宅能源技术的商业差异化正在从硬件安装明确转向软件优化和动态批发能源交易。1KOMMA5° 将 Heartbeat AI 定位为核心技术资产，计划在 2027 年投入超过 €100 million
              软件研发经费，用于自动化电力交易、实时计量和家庭能量平衡。借助 Dynamic Pulse 电价和强制配套的智能电表安装，1KOMMA5° 让住宅电池在低价或负价时段从电网充电，并在批发电价高峰时放电。IKEA
              和 Svea Solar 则以 Svea Strom 电价回应，提供现货市场价格、每千瓦时 2 cent
              的采购费和较低的月度管理费。不过，与专用能源网关相比，零售导流模式的多资产自动编排能力有限。房主的转换成本主要来自实体资产锁定：一旦安装了专有逆变器、储能单元和控制网关，切换至其他虚拟电厂供应商就会遇到软件不兼容和多平台使用摩擦，从而基本保护了初始安装商的持续软件关系。
