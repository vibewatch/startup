chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、创始人和商业模式
        blocks:
          - type: paragraph
            body: >-
              1KOMMA5° 是一家总部位于汉堡的清洁技术企业，由清洁能源高管 Philipp Schröder、Micha Grüber 和 Jannik Schall 于 2021
              年创立。公司的明确商业使命，是通过打造家庭电气化一站式整合服务，加速住宅脱碳。它既不是纯数字软件平台，也不是传统区域分包商，而是把本地化硬件安装——包括屋顶光伏、储能系统、热泵和电动车墙盒——与自有的
              Heartbeat AI 能源智能引擎结合。该软件把分散的住宅设备接入统一的虚拟电厂，并与批发电力交易所动态交互。1KOMMA5° 的运营策略核心，是程序化收购并整合区域电气和暖通
              Meisterbetriebe，从而在德国、斯堪的纳维亚、西班牙、荷兰和澳大利亚直接获得交付能力。管理层由曾领导 Sonnen 和 Tesla Germany 的 CEO Philipp Schröder、CFO
              Micha Grüber 及 CPO Jannik Schall 组成，创始团队与清洁能源硬件部署、软件优化之间高度契合。
            claimRefs:
              - CO001
              - CO002
