      - number: '7.3'
        title: 交易对手、硬件供应商和市场依赖
        blocks:
          - type: paragraph
            body: >-
              1KOMMA5° 的产品架构使其在上游硬件上依赖一组集中的制造合作伙伴。在住宅供暖领域，公司依赖 Daikin、Stiebel Eltron 等成熟供暖 OEM
              供应热泵硬件。在储能领域，专有可堆叠电池外壳虽由德国设计，但底层棱柱形磷酸铁锂（LFP）电芯来自受地缘政治和运输摩擦影响的亚洲化工及电池制造商。此外，1KOMMA5°
              在七个司法辖区——德国、澳大利亚、丹麦、西班牙、芬兰、荷兰和瑞典——的扩张战略，建立在通过股权投资和增长融资收购区域工匠企业之上。这种联邦式结构把客户服务和保修义务隔离在各区域运营法人内，但如果被收购企业的创始工匠退出日常管理，母公司就会暴露于当地关键人员离职和区域整合摩擦。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR006
              - CR007
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
      - number: '7.4'
        title: 财务敞口、利润率压缩和论点失效触发因素
        blocks:
          - type: paragraph
            body: >-
              从财务角度看，1KOMMA5° 快速收购线下安装企业，需要投入大量营运资金，也会把一系列长期资产负债表风险带进来。玻璃-玻璃 TOPCon 光伏组件提供 30 年质保、家用电池系统提供 12
              年质保；如果原始硬件厂商对缺陷索赔提出异议，或上游发生破产，这些或有负债可能拖累未来利润。同时，EquityZen
              等私有平台上的老股交易，也显示早期员工存在非正式流动性渠道，但无法让投资者看清合并净利率、债务契约或优先股清算优先权。投资者需要关注的核心论点破坏触发器包括：（1）2027
              年立法取消上网电价，导致居民光伏取消率超过 25%；（2）二级硬件关税飙升，将安装毛利率压到 20% 以下；（3）无法把硬件买家转化为高毛利、可重复的 Heartbeat AI
              软件订阅客户；（4）被收购分支的施工缺陷引发大范围质保索赔，耗尽区域储备。
            claimRefs:
              - CR004
              - CR005
              - CR008
              - CR010
              - CR012
              - CR014
      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 2027 年上网电价悬崖与硬件关税挤压将至
            body: >-
              德国拟议立法计划在 2027 年前取消 25 kW 以下居民光伏的 EEG
              上网电价，国际贸易关税也在推高光伏组件和电池电芯成本。两者叠加会挤压安装商利润、拉长家庭单独配置光伏的回本周期，使软件驱动的自发自用和电池配套从可选增售变成生存必需。
            calloutType: risk
            claimRefs:
              - CR005
              - CR010
              - CR012
          - type: callout
            title: 尽调重点：审计分支整合与质保负债
            body: >-
              潜在 IPO 前投资者应坚持对 1KOMMA5° 在德国的 50+ 个网点及被收购的海外实体进行分支级财务审计，重点核实当地工匠留任协议、30 年光伏组件和 12 年电池质保对应的准备金，以及 2025
              年硬件调价后的实际毛利率。
            calloutType: recommendation
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR009
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >
              现有证据支持“继续研究”，而不是直接买入。Trending Topics 报道了一笔 €70m 融资，公司自报估值为 $1.35b；Multiples 则把同一笔 2026 年 10 月交易记为 $79m，估值
              $1.4b。这些报道只能提供参考锚点，不能代表可投资的普通股价格：两个公开来源都没有披露融资后股数、清算顺位、反稀释权或融资文件。因此，定价纪律必须从核实证券条款、搭建标准化企业价值桥接开始。IPO
              搁置、此前又未达成收入目标，使这些输入缺失成为实质问题而非流程瑕疵；因此置信度维持中等，风险仍高。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV009
              - CV010
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
