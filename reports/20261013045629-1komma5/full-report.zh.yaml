              1KOMMA5° 的运营足迹已扩展到七个国际市场、约 80 个运营地点，并将超过 300,000 个可控分布式能源设备纳入现场运营。德国国内部署量的重要驱动因素是住宅供暖电气化：公司披露证实，24
              个月内在德国完成超过 10,000 台热泵安装，2025 年安装量约为前一年的四倍。与此同时，软件层采用率也在上升，Heartbeat AI 正积极编排超过 40,000
              套住宅系统，以执行动态电力交易、电网稳定和自动自用。然而，从投资尽调角度看，公开数据仍存在重要分母缺口：已披露指标没有区分独立的多资产家庭总数与设备累计总量，也没有把标准独立太阳能安装与完整接入
              Heartbeat 虚拟电厂的订阅用户分开。
            claimRefs:
              - CU004
