            body: >-
              1KOMMA5° 所称的核心技术差异化，是由其剥离的软件子公司 Heartbeat AI GmbH 开发并维护的能源管理和市场优化平台 Heartbeat AI。Heartbeat
              采用混合边缘云架构：本地边缘控制器（自有 Heartbeat box
              和嵌入式网关固件）通过本地协议连接住宅逆变器、电池管理系统、热泵控制器和电动车墙盒，同时与中央云平台保持安全遥测连接。根据技术披露，Heartbeat 每天执行约 4.8 million
              次自动优化决策，吸收数值天气预报、历史用电曲线、日前及日内现货电价，以安排电池充电、热储能预热和电动车充电周期。聚合后的住宅端点被汇入住宅虚拟电厂（VPP）；公司称该电厂在 2026 年 5 月达到 1 GW
              灵活容量，长期路线图目标是 2030 年达到 20 GW。在瑞典等市场，Heartbeat 已获得监管资格，可提供快速频率备用（FCR-D）辅助电网服务，说明该软件具备参与高速频率稳定的能力。
