              - CU014
              - CU015
      - number: '6.4'
        title: 留存耐久性、软件变现和集中度风险
        blocks:
          - type: paragraph
            body: >-
              1KOMMA5° 的硬件部署很快，但经审计的经常性收入基准尚未证明其安装基数具备持久性和扩张经济性。商业模式靠 Heartbeat AI
              的固定软件费和动态电价优化，把一次性住宅硬件买家转化为虚拟电厂的长期参与者。然而，1KOMMA5° 既未披露 Heartbeat
              软件订阅的净收入留存率（NRR），也未披露年度客户流失率。获客又高度集中于德国独栋住宅自住业主，公司因此暴露于德国国内补贴变化、屋顶上网电价政策调整和建筑供应链产能变化。区域展厅活动和营销套装推动太阳能、储能、热泵和电动车墙盒四类主要资产之间的交叉销售，但全车队多产品家庭的实际附着率仍是关键尽调缺口。
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU013
              - CU016
      - number: '6.5'
        title: 展示
        blocks:
          - type: callout
            title: 硬件交钥匙套装与软件编排之间的缺口
            body: >-
              1KOMMA5° 通过收购区域 Meisterbetriebe 并提供 €1 billion 零首付融资，实现了硬件的快速分发；但其长期企业估值取决于住宅硬件买家是否会持续留在 Heartbeat AI
              中并付费订阅。在超过 300,000 台已安装设备中，目前只有 40,000 套系统处于主动管理状态；能否把现有硬件客户转化为活跃的虚拟电厂参与者，是运营上的核心难题。
            calloutType: insight
            claimRefs:
              - CU001
              - CU004
              - CU006
              - CU007
          - type: callout
            title: 收购区域工匠后的客户服务摩擦
            body: >-
              第三方客户评价显示，硬件和技术工艺评分尚可（4.3–4.5/5），但客户服务和价值感知落后至 4.2/5；约 19% 的澳大利亚评价为 3
              星或更低。快速区域收购让保修服务、返款申报和客户支持响应都出现交接摩擦，威胁品牌资产。
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU014
              - CU015
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、政策和补贴转型风险
        blocks:
          - type: paragraph
            body: >-
              1KOMMA5° 的住宅电气化增长模式与各国脱碳补贴及德国能源立法密切相关。关键立法风险来自联邦经济事务部（BMWK）正在推进的法律草案：拟从 2027 年起彻底取消 25 kW
              以下新建住宅光伏系统的国家上网电价（EEG-Vergütung）。对标准独栋住宅安装而言，这项改革可能导致法定 20 年运营期内最高 €12,500
              的保障上网收入损失。此外，围绕建筑能源法（GEG）的持续政治争议和修订，已令德国供暖市场的消费者明显犹豫；德国热泵协会（BWP）警告，尽管 2025 年市场销量增长
              55%，反复无常的政治信号仍可能成为投资刹车。德国法定智能电表网关部署长期延迟，也迫使 1KOMMA5° 捆绑自有计量基础设施，才能参与 Heartbeat AI 的批发市场。
            claimRefs:
              - CR005
              - CR010
              - CR011
              - CR013
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR010
              - CR011
              - CR013
      - number: '7.2'
        title: 供应链波动、关税和运营执行
        blocks:
          - type: paragraph
            body: >-
              全球硬件供应链重组、美国与欧盟及中国之间不断升级的贸易争端，正给 1KOMMA5° 的运营带来明显逆风。亚洲太阳能组件和电池生产商多年严重产能过剩、价格通缩后，制造商削减产量，加上新征关税，促使 1KOMMA5°
              将设备价目表整体提价 2.5% 至 5.0%。管理层把不断升级的报复性进口关税网络描述为类似重大地缘政治海上封锁的系统性运营中断。在德国国内，公司安装速度受制于持证电气和管道工匠的严重短缺。尽管 1KOMMA5°
              已在德国超过 50 个分支地点建立分布式网络，安装执行仍高度依赖获得许可的区域
              Meisterbetriebe。若无法稳定维持高端交钥匙定价和软件经常性费用，既要满足更高的法定安装标准、又要吸收熟练工人工资上涨，就会威胁分支毛利。
            claimRefs:
              - CR003
              - CR009
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
