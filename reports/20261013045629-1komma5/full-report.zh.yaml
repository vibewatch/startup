  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局：直接挑战者、零售合作和现状
        blocks:
          - type: paragraph
            body: >-
              欧洲住宅电气化和太阳能转型市场由三类竞争者组成：垂直整合的技术供应商、大众零售合作伙伴，以及传统的分散型工匠安装商。随着独栋住宅业主寻求对冲高企的零售电价并推进供暖和交通电气化，竞争边界已从独立屋顶光伏组件扩展到完整同步的家庭能源管理系统，组合了光伏板、磷酸铁锂电池、热泵和电动车墙盒。在这一市场中，德国清洁技术独角兽
              Enpal 是最直接的综合型同业，率先推出零首付太阳能租赁合同，并扩张资产支持证券化融资引擎。与此同时，大型零售商 IKEA 与瑞典安装商 Svea Solar
              商业合作进入德国市场，借助零售客流营销标准化动态电价和硬件套装。另有数千家独立本地电气和供暖承包商构成现状在位者。传统工匠拥有本地消费者信任和地理便利，但缺少自有软件平台、动态批发电力市场接入和大宗采购规模经济。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
      - number: '3.2'
        title: 直接同业画像：资本规模、融资结构和资产交付
        blocks:
          - type: paragraph
            body: >-
              比较主要同业的相对规模和资本结构，可以看出它们在资产所有权、资产负债表敞口和安装交付这几件事上走的是不同路线。1KOMMA5° 累计获得约 €400 million 股权融资，近期投后估值达到 $1.35
              billion，并计划在七个国际市场实现约 $750 million 的 2026 财年收入。不同于纯软件编排商或轻资产平台，1KOMMA5°
              采取收购型滚动整合模式，通过购买成熟区域工贸企业（Meisterbetriebe）的运营股权，锁定稀缺的安装劳动力。直接竞争对手 Enpal 则已将约 250,000 个分布式能源设备整合到超过 80,000
              户家庭，依托消费者贷款和租赁引擎将太阳能付款应收账款证券化。Enpal 获欧洲投资银行和欧洲投资基金支持的 €100 million
              公开资产证券化，证明了机构债务市场的认可，但也凸显出高资本强度和再融资敏感性。Svea Solar 则借助 IKEA 的全球品牌知名度和客户忠诚度计划降低获客费用，无需承担企业工匠团队的直接薪资。
