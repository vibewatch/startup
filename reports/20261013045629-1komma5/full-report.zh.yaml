      - number: '3.4'
        title: 护城河耐久性：VPP 聚合、监管变化和利润率风险
        blocks:
          - type: paragraph
            body: >-
              欧洲住宅清洁技术竞争护城河的长期耐久性，正受到硬件商品化、监管演变和在位公用事业抵制的严重冲击。标准光伏组件和住宅储能电芯持续全球供给过剩，侵蚀非捆绑设备销售的毛利，也让独立安装业务越来越脆弱。此外，德国联邦经济事务部的法律草案拟从
              2027 年起终止 25 kW 以下新太阳能系统的 EEG 上网电价。在现行监管下，10 kWp 系统可在 20 年内获得每千瓦时 7.78 cents 的保障收入，终身补贴收入最高达
              €12,500。即将取消这一底线补贴，将迫使房主通过智能储能、动态热泵运行和虚拟电厂灵活性交易最大化本地自用。为保护去中心化模式，1KOMMA5° 已向欧盟委员会对德国为 20 GW
              燃气调峰电厂提供补贴提出正式竞争投诉，称集中式化石能源补贴扭曲电力市场，损害分布式虚拟电厂能力。
