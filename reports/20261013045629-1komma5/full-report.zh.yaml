figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 1KOMMA5° 从 2021 年成立到 2026 年的发展轨迹中，公司、融资、产品和规模的关键里程碑。
    data:
      items:
        - label: 在汉堡注册公司
          date: 2021-07
          detail: Philipp Schröder、Micha Grüber 和 Jannik Schall 在汉堡共同创立公司，致力于推动住宅能源脱碳。
        - label: Heartbeat 能源平台上线
          date: 2022-04
          detail: 推出自研 Heartbeat AI 能源管理软件，打通太阳能、电池和热泵。
        - label: 达到独角兽估值
          date: 2023-06
          detail: 在获得欧洲及全球气候投资者参与的 B 轮股权融资后，估值达到 €1B+，成为独角兽。
        - label: 首轮 €150M IPO 前融资
          date: 2024-12
          detail: 获得由 CalSTRS 领投、G2VP、2150、Norrsken 和现有股东参与的 €150M IPO 前投资。
        - label: PowerHarvester 电池上线
          date: 2025-04
          detail: 为没有屋顶太阳能的家庭推出独立电池储能，借助 Heartbeat 实现动态电价套利。
        - label: 与 Sabanci 扩展 IPO 前融资
          date: 2025-07
          detail: Sabanci Climate Ventures 参与扩展 IPO 前轮融资，公司员工接近 2,500 人、客户达到 120,000 名。
        - label: 热泵安装突破 10,000 台
          date: 2026-01
          detail: 两年内在德国完成超过 10,000 台热泵安装，年度本土安装量增长至四倍。
        - label: €1B 客户融资工具
          date: 2026-06
          detail: 联合欧洲主要银行筹集 €1B 融资工具，免除客户购买清洁家庭能源系统的前期资本支出。
    approximationNotes: 里程碑日期来自公开新闻报道和公司新闻稿；季度和月份为约数。
