      - number: '2.3'
        title: 买方细分、预算分配和采用路径
        blocks:
          - type: paragraph
            body: >-
              1KOMMA5° 的目标客户涵盖三类核心住宅细分市场，同时拥有一条运营型 B2B 收购渠道。郊区独栋住宅业主数量最多，通常会评估屋顶光伏和储能，以抵御每千瓦时超过 35 cents
              的电网零售电价对家庭运营预算的冲击。第二类是供暖转型用户，他们受联邦更换补贴和 10-cent 电价保障带来的运营成本平价驱动，用热泵替换老旧燃油或燃气锅炉。第三类是技术导向的
              prosumer，他们通过动态电价优化电动车和家庭电池充电，以利用电力交易所的负电价。商业供给侧则包括区域 Meisterbetriebe 和电气安装企业主；他们加入 1KOMMA5°
              的滚动整合网络，以获得增长融资、企业 IT 系统和集中采购的硬件。
            claimRefs:
              - CM001
              - CM003
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM011
      - number: '2.4'
        title: 增长驱动、监管逆风和尽调缺口
        blocks:
          - type: paragraph
            body: >-
              宏观脱碳要求、热泵硬件成本下降，以及可再生能源发电扩大并频繁将日间现货电价推入负值区间，都在推动市场加速。但短期增长仍面临实质性的监管和运营逆风。德国太阳能协会（BSW-Solar）警告称，《可再生能源法》（EEG）草案拟从
              2027 年起取消新建 25 kW 以下光伏装置的上网电价补偿，造成严重不确定性。现有 20 年合同的固定上网补偿仍锁定在每千瓦时 7.78
              cents，但取消未来上网电价会压缩独立屋顶光伏的回报。提前采购或许能暂时支撑 2026 年需求，但可持续的经济性需要智能自用和电池循环。关键尽调缺口仍在于：初始硬件安装补贴到期后，1KOMMA5°
              能否把已收购的硬件客户转化为持久且高毛利的软件订阅用户。
            claimRefs:
              - CM004
              - CM005
              - CM007
              - CM009
              - CM010
              - CM014
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 住宅太阳能收缩与 EEG 上网电价取消
            body: 2026 年第一季度德国住宅光伏安装量同比下降 21%，叠加《可再生能源法》草案拟从 2027 年起取消 25 kW 以下系统的上网补偿，将对硬件安装形成明显的近期需求逆风。
            calloutType: risk
            claimRefs:
