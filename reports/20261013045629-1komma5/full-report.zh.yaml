    title: Heartbeat AI 多层运营架构
    type: stack
    summary: 展示 1KOMMA5° 住宅能源编排平台从本地边缘 IoT 网关到批发电力市场接口的分层架构。
    data:
      layers:
        - label: 能源市场与电网结算层
          detail: 对接 EPEX SPOT 日前和日内批发即期市场、Nord Pool 以及 TSO 辅助服务市场（如瑞典 FCR-D 快速频率储备）。
        - label: 云端优化与 VPP 聚合引擎
          detail: Heartbeat AI 中央云执行集群每天运行 4.8M 次自动优化，覆盖价格预测、太阳能发电模型和用电画像。
        - label: 安全 IoT 连接骨干
          detail: 通过蜂窝 WAN 和家庭宽带连接边缘硬件的双向遥测流，负责设备群健康状态和远程配置。
        - label: Heartbeat 边缘控制器与电表网关
          detail: Heartbeat box IoT 控制器和智能电表网关执行亚秒级调度决策，并维持离线故障安全计划。
        - label: 分布式能源资源资产
          detail: 住宅实体设备：双面 TOPCon 光伏组件（最高 470 Wp）、模块化 LFP 电池（最高 41.9 kWh）、热泵和电动车墙盒。
        - label: 消费者移动应用与动态电价层
          detail: 用户界面展示 Dynamic Pulse 电价、自发自用遥测、资产充电覆盖设置和财务节省跟踪。
    approximationNotes: 基于 Heartbeat AI 公开披露和 FlexEnergy Hub 技术概览的逻辑架构抽象。
