      - number: '2.2'
        title: 市场规模、TAM/SAM/SOM 层级和细分市场增长
        blocks:
          - type: paragraph
            body: >-
              评估欧洲住宅清洁能源转型规模时，必须把不受约束的政策目标与近期安装能力分开。欧洲数千万套独栋住宅构成理论上的 Total Addressable Market，但 2026 年 Serviceable
              Addressable Market 的细分趋势分化明显。在公司的基础市场德国，2026 年第一季度太阳能光伏新增装机达到 3.51 GW，同比下降 6%。住宅屋顶细分市场尤其疲弱，同比下降 21% 至 850
              MW，原因包括早期采用者趋于饱和、利率上升和消费者犹豫。商用屋顶太阳能也下降 33% 至 600 MW，只有地面集中式太阳能还在增长。相反，住宅热泵采用快速扩大，1KOMMA5° 报告称 2024 年销售量增长
              1,300% 至约 4,000 台。德国固定式储能也迅速增长，2026 年第一季度新增投运量达到 2 GWh，但扩张主要由大型系统推动。可服务 SOM 仍受 Heartbeat 软件 attach rate
              未披露的限制。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM008
              - CM013
