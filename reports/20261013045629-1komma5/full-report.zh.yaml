      - number: '1.3'
        title: 规模指标、收入表现和融资工具
        blocks:
          - type: paragraph
            body: >-
              1KOMMA5° 的运营规模表现为强大的实体部署能力与不断扩大的软件连接规模并存。截至 2025 年 7 月，公司在全球拥有近 2,500 名员工，管理着超过 120,000 户家庭的活跃安装客户基数。2024
              财年收入达到 €540 million；尽管欧洲住宅光伏和热泵市场经历剧烈周期性下滑，底层硬件安装业务仍保持盈利，但这一结果低于管理层最初最高 €750 million
              的目标。为降低潜在住宅买家的前置资本压力，公司于 2026 年 6 月与欧洲银行设立 €1 billion 分期购买工具，让家庭无需首付即可购买光伏和热泵系统，并将付款与 Heartbeat AI
              产生的动态电费节省挂钩。热泵安装量表明产品已有市场牵引力：截至 2026 年 1 月，德国累计安装量超过 10,000 台，2025 年同比增长四倍。相比之下，公司于 2025 年 4 月推出的独立
              PowerHarvester 电池系统暴露了经济性约束：独立测评指出，该系统虽能进行动态电力套利，但家庭年用电量必须极高（>10,000 kWh）才能实现可接受的六年回本期。
