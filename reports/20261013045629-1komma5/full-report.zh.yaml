        title: 展示材料
        blocks:
          - type: callout
            title: 标题估值不等于普通股价值
            body: 保留的公开来源没有披露完全摊薄持股、清算优先权、参与权或反稀释条款，因此无法把报道的融资估值换算成投资者回报。
            calloutType: risk
            claimRefs:
