  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、产品架构和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              1KOMMA5°
              所服务的住宅脱碳市场涵盖去中心化能源发电、固定式储能、热能转型设备和住宅电动车充电。市场不再把光伏板、家用电池和热泵视为彼此孤立的消费采购，而是越来越需要统一的家庭电气化套装。现状替代方案仍然高度分散：传统化石燃料供暖系统（天然气和燃油锅炉）、受波动零售电价影响且缺乏管理的电网用电，以及由本地工匠交付、没有智能能源协调的独立太阳能安装。1KOMMA5°
              将实体设备部署与自有 Heartbeat AI
              能源管理平台结合，把分散的住宅硬件连接成协调运行的虚拟电厂。该软件架构区别于纯硬件分销商：它通过批发价格波动获利，在低价或负价时段自动进行电力套利，并向房主提供动态电价保障。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
