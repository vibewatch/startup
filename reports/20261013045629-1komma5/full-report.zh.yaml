      - number: '1.2'
        title: 资本化、融资历史和所有权结构
        blocks:
          - type: paragraph
            body: >-
              自 2021 年成立以来，1KOMMA5° 持续激进调动资本，直接筹集约 €400 million 股权、累计融资超过 €500 million，同时保持控股公司无债。2022 和 2023
              年收入快速增长后，公司于 2023 年 6 月以超过 €1 billion 的投后估值成为独角兽。2024 年 12 月，公司获得 €150 million IPO 前融资，投资方包括美国机构投资者
              CalSTRS、Hamilton Lane、G2 Venture Partners、Norrsken VC、2150、Eurazeo 及现有家族办公室。2025 年 7 月，1KOMMA5° 引入 Sabanci
              Climate Ventures 作为新增战略股东，延长该轮 IPO 前融资，以支持其在南欧和全球市场扩张。股权结构表显示，核心股东较为稳定，主要包括 Haniel 家族办公室（约 12%）、Porsche
              Ventures（6%）、Eurazeo（5%）和 G2 Venture Partners（5%）。不过，商业报道显示，公司在 2024 年末融资中的估值提升幅度很小，反映欧洲太阳能行业更广泛的市场逆风，也压低了
              IPO 前估值倍数。早期股东还通过 EquityZen 等面向合格投资者的 IPO 前交易平台获得了流动性。
            claimRefs:
              - CO005
              - CO006
