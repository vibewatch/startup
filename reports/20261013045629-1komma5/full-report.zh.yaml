      - number: '1.4'
        title: 时间线里程碑和战略展望
        blocks:
          - type: paragraph
            body: >-
              1KOMMA5° 在欧洲 CleanTech 生态中的机构化扩张推进很快，可分为四个阶段：创立与初步滚动整合（2021–2022）、独角兽扩张与软件拓展（2023）、IPO
              前资本化与产品多元化（2024–2025），以及上市前的客户融资扩张（2026）。公司于 2021 年 7 月在汉堡注册成立，并于 2022 年 4 月推出 Heartbeat AI
              能源智能引擎，把分散的能源资源整合为活跃的住宅虚拟电厂。2023 年 6 月估值突破 €1 billion 后，公司于 2024 年 12 月注入 €150 million IPO 前资金，并于 2025 年 7
              月与 Sabanci 延长融资，目标是在 2026 年上市。硬件产品从标准太阳能套装拓展到热泵规模化部署——德国安装量于 2026 年 1 月超过 10,000 台——以及独立 PowerHarvester
              电池系统。随着 2026 年年中启用 €1 billion 银行支持的分期融资工具，1KOMMA5° 希望降低订单管线对监管补贴波动的敏感度，并将 Heartbeat AI 直销定位为长期经常性收入驱动因素。
