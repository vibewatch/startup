callouts:
  - calloutType: "insight"
    title: "VPP Aggregation Hinges on Edge Interoperability and Regulatory Prequalification"
    body: "Heartbeat AI's long-term commercial upside depends entirely on transforming passive solar and battery owners into a monetizable virtual power plant. While achieving 1 GW of pooled capacity demonstrates impressive customer acquisition, real monetization through grid stabilization (such as Sweden's FCR-D) requires sub-second response times, stringent availability guarantees, and resilient edge hardware capable of operating through local internet outages."
    claimRefs:
      - "CE008"
      - "CE010"
      - "CE011"
  - calloutType: "risk"
    title: "High Operational Drag and Total Absence of Public Developer Signal"
    body: "Unlike software-first energy tech scaleups, 1KOMMA5° bears substantial operational overhead from regional master craftsman organizations, vehicle fleets, and direct installation logistics. Furthermore, the complete absence of a public developer surface, published API specifications, or open-source community contributions means technical diligence must rely on proprietary vendor claims rather than peer-reviewed engineering scrutiny."
    claimRefs:
      - "CE012"
      - "CE014"
      - "CE016"
