callouts:
  - calloutType: risk
    title: Impending 2027 Feed-in Tariff Cliff and Hardware Tariff Squeeze
    body: >-
      The confluence of German draft legislation eliminating EEG feed-in tariffs for residential solar under 25 kW by
      2027 and escalating international trade tariffs on solar modules and battery cells threatens to squeeze installer
      margins while simultaneously reducing homeowner standalone solar payback, making software-driven self-consumption
      and battery pairing an existential requirement rather than an optional upsell.
    claimRefs:
      - CR005
      - CR010
      - CR012
  - calloutType: recommendation
    title: 'Diligence Imperative: Audit Branch-Level Integration and Warranty Liabilities'
    body: >-
      Prospective pre-IPO investors must insist on branch-level financial audits across 1KOMMA5°'s 50+ German locations
      and acquired international entities, specifically verifying local craftsman retention agreements, warranty reserve
      provisions for 30-year PV module and 12-year battery guarantees, and actual gross margins post-2025 hardware price
      adjustments.
    claimRefs:
      - CR002
      - CR004
      - CR006
      - CR009
