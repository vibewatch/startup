chapter:
  number: 7
  title: Risks
  summary: >-
    1KOMMA5° faces material legislative risks from Germany's proposed 2027 feed-in tariff elimination and Building
    Energy Act uncertainty, compounded by escalating international hardware tariffs and regional craftsman labor
    bottlenecks that threaten installation margins across its decentralized branch network.
sections:
  - id: regulatory-legal-policy-risks
    title: Regulatory, Policy, and Subsidy Transition Risks
    body: >-
      1KOMMA5°'s residential electrification growth model operates in close proximity to national decarbonization
      subsidies and German energy legislation. A pivotal legislative exposure is an active draft law from the Federal
      Ministry for Economic Affairs (BMWK) proposing the complete abolition of state feed-in tariffs (EEG-Vergütung) for
      new residential photovoltaic systems under 25 kilowatts starting in 2027. For a standard single-family home
      installation, this reform represents a potential financial loss of up to €12,500 in guaranteed feed-in revenue
      over the statutory 20-year operational period. Furthermore, ongoing political disputes and revisions surrounding
      the Building Energy Act (GEG) have injected substantial consumer hesitation into the German heating market, where
      industry bodies such as the German Heat Pump Association (BWP) warn that erratic political signals risk becoming
      an investment brake despite 55% market unit growth in 2025. Additionally, persistent national delays in Germany's
      statutory smart meter gateway rollout force 1KOMMA5° to bundle its own metering infrastructure to enable Heartbeat
      AI wholesale market participation.
    claimRefs:
      - CR005
      - CR010
      - CR011
      - CR013
      - CR015
    tableRefs:
      - TR001
  - id: operational-supply-chain-execution-risks
    title: Supply Chain Volatility, Tariffs, and Operational Execution
    body: >-
      On the operational front, 1KOMMA5° faces significant headwinds from global hardware supply chain realignments and
      escalating trade disputes among the United States, the European Union, and China. Following years of severe
      manufacturer overcapacities and deflationary pricing across Asian solar module and battery producers, manufacturer
      output curtailments and newly imposed tariffs prompted 1KOMMA5° to institute a 2.5% to 5.0% price increase across
      its equipment price lists. Management has characterized the spiraling web of retaliatory import tariffs as a
      systemic operational disruption comparable to major geopolitical maritime blockades. Domestically, the company's
      installation velocity is constrained by acute shortages of certified electrical and plumbing craftsmen. While
      1KOMMA5° has assembled a distributed network across more than 50 German branch locations, installation execution
      relies heavily on licensed regional master craftsmen. Meeting heightened statutory installation standards while
      absorbing skilled trade wage increases threatens branch gross margins unless premium turnkey pricing and software
      recurring fees can be reliably sustained.
    claimRefs:
      - CR003
      - CR009
      - CR012
    tableRefs:
      - TR002
    figureRefs:
      - FR001
  - id: counterparty-partner-platform-dependencies
    title: Counterparty, Hardware Supplier, and Market Dependencies
    body: >-
      1KOMMA5°'s product architecture introduces critical upstream hardware dependencies on a concentrated set of
      manufacturing partners. In residential heating, the company relies on established heating original equipment
      manufacturers such as Daikin and Stiebel Eltron for heat pump hardware supply. For energy storage, while the
      proprietary stackable battery casing is German-engineered, the underlying prismatic lithium iron phosphate (LFP)
      cells originate from Asian chemical and battery manufacturers subject to geopolitical and shipping friction.
      Furthermore, 1KOMMA5°'s expansion strategy across seven international jurisdictions—including Germany, Australia,
      Denmark, Spain, Finland, the Netherlands, and Sweden—is built upon acquiring regional craftsman businesses through
      equity stakes and growth financing. This federated structure isolates customer service and warranty obligations
      within regional operating legal entities, but exposes the parent company to local key-person departures and
      regional integration frictions if acquired founder-craftsmen transition out of active management.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR006
      - CR007
    tableRefs:
      - TR003
  - id: financial-model-risks-thesis-break-triggers
    title: Financial Exposure, Margin Compression, and Thesis-Break Triggers
    body: >-
      From a financial perspective, 1KOMMA5°'s rapid roll-up of physical installation businesses carries substantial
      working capital commitments and long-tail balance sheet exposures. Offering 30-year warranties on glass-glass
      TOPCon solar modules and 12-year warranties on home battery systems creates contingent liabilities that could
      burden future earnings if original hardware manufacturers dispute defect claims or insolvency occurs upstream.
      Concurrently, secondary share trading on private platforms such as EquityZen reflects informal liquidity
      mechanisms for early employees, but provides no transparency into consolidated net margins, debt covenants, or
      preferred share liquidation preferences. Core thesis-break triggers for investors include: (1) a legislative
      feed-in tariff cancellation in 2027 that leads to residential solar cancellation rates exceeding 25%; (2)
      secondary hardware tariff spikes that compress installation gross margins below 20%; (3) an inability to convert
      hardware buyers into high-margin recurring Heartbeat AI software subscribers; or (4) widespread warranty claims
      resulting from acquired branch craftsmanship defects that overwhelm regional reserves.
    claimRefs:
      - CR004
      - CR005
      - CR008
      - CR010
      - CR012
      - CR014
