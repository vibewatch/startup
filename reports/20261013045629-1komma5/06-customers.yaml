callouts:
  - calloutType: "insight"
    title: "Hardware Turnkey Bundle vs Software Orchestration Gap"
    body: "1KOMMA5° has achieved rapid hardware distribution by acquiring regional master craftsmen and offering €1 billion in zero-upfront financing, but its long-term enterprise valuation depends on whether residential hardware buyers remain sticky, paying subscribers of Heartbeat AI. With 40,000 systems actively managed out of more than 300,000 installed devices, converting existing hardware customers into active virtual power plant participants is the central operational hurdle."
    claimRefs:
      - "CU001"
      - "CU004"
      - "CU006"
      - "CU007"
  - calloutType: "risk"
    title: "Customer Service Friction Across Acquired Regional Craftsmen"
    body: "Third-party customer review evidence indicates that while hardware and technical craftsmanship maintain solid ratings (4.3–4.5/5), customer service and value perception lag at 4.2/5, with nearly 19% of Australian reviewers awarding 3 stars or fewer. Rapid regional acquisitions create handoff frictions in warranty service, rebate filing, and customer support responsiveness that threaten brand equity."
    claimRefs:
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU014"
      - "CU015"
