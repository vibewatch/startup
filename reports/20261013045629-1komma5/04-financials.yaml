chapter:
  number: 4
  title: Financials
  summary: 1KOMMA5° projects full-year 2026 revenue of approximately 750 million US
    dollars (around 700 million euros) with 40 million euros in core hardware EBITDA,
    supported by an annualized Heartbeat AI run rate of 30 million euros. While the
    company maintains an unencumbered balance sheet and zero net debt via 1.5 billion
    euros in customer and public financing facilities, private software gross margins,
    cohort retention, and installer working capital requirements remain primary diligence
    gaps.
sections:
- id: section-revenue-streams
  title: Revenue Architecture and Software Monetization
  body: 1KOMMA5° generates revenue through a hybrid commercial model combining decentralized
    hardware installation with software-driven energy orchestration. The primary revenue
    engine comprises turnkey residential installations across rooftop solar photovoltaic
    systems, battery storage units, heat pumps, air conditioning, and EV charging
    wallboxes. In parallel, the company has built out its proprietary energy management
    software under the Heartbeat AI brand. Heartbeat AI connects installed residential
    assets to wholesale electricity exchanges, aggregating over 1 GW of flexibility
    capacity into a unified residential virtual power plant. The software monetizes
    through flat-rate subscriptions and dynamic electricity tariff optimization under
    the Dynamic Pulse brand. In August 2026, the AI software division attained an
    annualized revenue run rate of approximately 30 million euros, nearly doubling
    year-over-year. Beyond residential consumers, the company has expanded into business-to-government
    (B2G) and municipal real estate contracts, diversifying revenue across institutional
    buyers.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: section-pricing-unit-economics
  title: Turnkey Pricing, Monetization Structure, and Customer Payback
  body: Residential electrification pricing follows a capital-intensive turnkey project
    model. In Germany, a standard residential 10 kWp photovoltaic system combined
    with battery storage commands a turnkey list price of approximately 25,000 euros,
    translating to 1,000 to 1,800 euros per kilowatt-peak installed. Customer economics
    rely heavily on energy bill savings achieved by displacing grid electricity costing
    over 35 cents per kWh with on-site solar generation produced at an effective cost
    from 5 cents per kWh. Surplus solar power fed into the grid captures a guaranteed
    20-year statutory EEG tariff of 7.78 cents per kWh for sub-10 kWp systems, resulting
    in an estimated customer payback horizon of 7 to 12 years. Heartbeat AI enhances
    these payback dynamics by automatically purchasing power during negative or low-cost
    pricing windows and discharging storage during peak tariff periods. However, because
    feed-in subsidies face legislative phase-out proposals for post-2026 systems,
    long-term consumer adoption will increasingly hinge on algorithmic market arbitrage
    rather than guaranteed public feed-in revenue.
  claimRefs:
  - CI006
  - CI007
  - CI008
  tableRefs:
  - TI002
- id: section-traction-cost-structure
  title: Commercial Scaling, Margin Structure, and Operating Profitability
  body: '1KOMMA5° has demonstrated resilient revenue growth across fluctuating European
    clean-energy cycles. In 2024, the company recorded 520 million euros in total
    revenue, driven by organic sales expansion of 36 percent to 490 million euros
    amidst broader sector contraction. Through the first nine months of 2026, organic
    revenue grew 30 percent year-on-year, positioning the firm toward full-year guidance
    of approximately 750 million US dollars (700 million euros). In its core hardware
    business, management projects full-year 2026 operating profit (EBITDA) of approximately
    40 million euros. Nonetheless, cost pressures persist: 1KOMMA5° sources European
    polysilicon from German manufacturers at a significant cost premium over Asian
    commodity supply, while localized sales expenses and regional installer integration
    require sustained operational discipline. The company supports ongoing technology
    differentiation by reinvesting around 35 million euros annually into Heartbeat
    AI research and development entirely out of operating cash flow.'
  claimRefs:
  - CI009
  - CI010
  - CI011
  - CI012
  tableRefs:
  - TI003
- id: section-capital-adequacy-diligence
  title: Capital Adequacy, Financing Facilities, and Diligence Verdict
  body: From a capitalization and balance-sheet standpoint, 1KOMMA5° maintains an
    uncommon liquidity structure for a high-growth cleantech operator. Since its founding
    in 2021, the company has raised nearly 400 million euros in equity capital while
    maintaining zero corporate debt. A 100 million euro revolving bank credit line
    established in 2023 remains completely undrawn. To finance massive hardware installations
    without levering its corporate balance sheet, 1KOMMA5° secured structured project
    facilities with leading banks, including up to 500 million euros dedicated to
    B2G public contracts and up to 1.0 billion euros for residential consumer project
    financing. Secondary market transactions through platforms like EquityZen provide
    modest pre-IPO shareholder liquidity. From an underwriting perspective, while
    top-line revenue scale and debt-free status provide near-term solvency, institutional
    diligence must examine unverified branch-level gross margins, post-acquisition
    installer working capital turnover, and stand-alone Heartbeat AI unit retention
    before ratifying pre-IPO valuation multiples.
  claimRefs:
  - CI013
  - CI014
