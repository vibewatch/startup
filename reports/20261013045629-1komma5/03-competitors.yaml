    title: "Software Layer as the Long-Term Differentiator"
    body: "While hardware components (PV modules, heat pumps, batteries) face severe price deflation and commoditization, software orchestration platforms like Heartbeat AI and Enpal.One capture value through dynamic tariff arbitrage and virtual power plant flexibility trading."
    claimRefs:
      - "CP002"
      - "CP003"
      - "CP007"
  - calloutType: "risk"
    title: "Impending Elimination of EEG Feed-In Tariffs Reshapes Unit Economics"
    body: "The German government's planned 2027 elimination of feed-in tariffs for residential PV under 25 kW will erode guaranteed export income, accelerating the shift toward full self-consumption, battery storage, and dynamic trading, while increasing competitive pressure on installers without software integration."
