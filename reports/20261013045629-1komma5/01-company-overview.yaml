company:
  name: 1KOMMA5°
chapter:
  number: 1
  title: Company Overview
  summary: Hamburg-based CleanTech enterprise combining regional craft installation of solar, storage, and heat pumps with the Heartbeat AI virtual power plant platform. Capitalized with over €400 million in direct equity from investors including CalSTRS, Haniel, and Porsche Ventures, 1KOMMA5° employs nearly 2,500 staff across 120,000 customer households while mobilizing a €1 billion bank financing facility ahead of a planned 2026 IPO.
sections:
  - id: corporate-identity-and-business-model
    title: Corporate Identity, Founders, and Business Model
    body: 1KOMMA5° is a Hamburg-based clean technology enterprise established in 2021 by clean energy executives Philipp Schröder, Micha Grüber, and Jannik Schall. The venture was formed with the explicit commercial mandate of accelerating residential decarbonization by creating an integrated one-stop-shop for household electrification. Rather than acting purely as a digital software platform or a conventional regional subcontractor, 1KOMMA5° pairs localized hardware installation—encompassing rooftop photovoltaics, battery storage systems, heat pumps, and electric vehicle wallboxes—with its proprietary Heartbeat AI energy intelligence engine. This software connects distributed residential assets into a cohesive virtual power plant that interacts dynamically with wholesale electricity exchanges. Central to 1KOMMA5°’s operational strategy is the programmatic acquisition and consolidation of regional electrical and heating master craft businesses (Meisterbetriebe), providing the enterprise with direct execution capacity across Germany, Scandinavia, Spain, the Netherlands, and Australia. Executive leadership is steered by CEO Philipp Schröder, who previously led Sonnen and Tesla Germany, CFO Micha Grüber, and CPO Jannik Schall, creating deep founder-market alignment across clean energy hardware rollout and software optimization.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO006
    tableRefs:
      - TO002
  - id: capitalization-and-shareholder-structure
    title: Capitalization, Financing History, and Ownership Structure
    body: 1KOMMA5° has executed an aggressive capital mobilization strategy since its 2021 inception, raising approximately €400 million in direct equity capital and over €500 million in cumulative financing while maintaining a debt-free holding corporate structure. Following rapid revenue expansion across 2022 and 2023, the enterprise attained unicorn status in June 2023 at a post-money valuation exceeding €1 billion. In December 2024, the company secured a €150 million pre-IPO financing round backed by US institutional investor CalSTRS, Hamilton Lane, G2 Venture Partners, Norrsken VC, 2150, Eurazeo, and existing family office backers. In July 2025, 1KOMMA5° extended this pre-IPO round by bringing Sabanci Climate Ventures on board as an additional strategic shareholder to support expansion across Southern Europe and global markets. The corporate cap table exhibits a stable core of industrial and institutional stakeholders, including the Haniel family office (holding approximately 12%), Porsche Ventures (6%), Eurazeo (5%), and G2 Venture Partners (5%). Nevertheless, commercial reporting indicates that the firm’s valuation step-up in the late 2024 round was minimal, reflecting broader market headwinds across the European solar sector and tempering pre-IPO valuation multiples. Liquidity for early stakeholders has concurrently been established through accredited pre-IPO marketplaces such as EquityZen.
    claimRefs:
      - CO005
      - CO006
      - CO007
      - CO008
      - CO015
    tableRefs:
      - TO003
  - id: scale-metrics-and-commercial-traction
    title: Scale Metrics, Revenue Performance, and Financing Vehicles
    body: 'Operational scale at 1KOMMA5° is characterized by substantial physical deployment capacity paired with growing software connectivity. As of July 2025, the enterprise deployed nearly 2,500 employees globally and managed an active customer installation base of more than 120,000 households. The company achieved €540 million in revenue for fiscal year 2024, maintaining profitability in its underlying hardware installation division despite a sharp cyclical downturn across European residential solar and heat pump markets; this outturn nonetheless represented a shortfall against management’s initial target of up to €750 million. To combat upfront capital friction for prospective residential buyers, 1KOMMA5° structured a €1 billion installment purchase vehicle with European banks in June 2026, enabling households to acquire solar and heat pump systems without initial equity outlays and linking payments to dynamic electricity savings generated by Heartbeat AI. Product-level commercial traction is demonstrated by heat pump installations, which surpassed 10,000 cumulative units in Germany by January 2026 after quadrupling year-over-year in 2025. In contrast, the company’s launch of the PowerHarvester standalone battery system in April 2025 highlights economic constraints: independent trade reviews note that while the system enables dynamic power arbitrage, it requires exceptionally high annual household electricity consumption (>10,000 kWh) to achieve an acceptable six-year payback.'
    claimRefs:
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
      - CO014
    tableRefs:
      - TO001
  - id: corporate-milestones-and-strategic-trajectory
    title: Chronological Milestones and Strategic Outlook
    body: 'The historical evolution of 1KOMMA5° reflects rapid institutional scaling within the European CleanTech ecosystem across four distinct phases: founding and initial roll-up (2021–2022), unicorn scaling and software expansion (2023), pre-IPO capitalization and product diversification (2024–2025), and customer financing expansion ahead of public listing (2026). Incorporating in Hamburg in July 2021, the venture launched its Heartbeat AI energy intelligence engine in April 2022 to unify disparate distributed energy resources into an active residential virtual power plant. After crossing the €1 billion valuation mark in June 2023, the enterprise fortified its capital base with a €150 million pre-IPO injection in December 2024 and an extension with Sabanci in July 2025, targeting an IPO window in 2026. Hardware offerings evolved from standard solar packages to dedicated heat pump scaling—surpassing 10,000 German units by January 2026—and the PowerHarvester standalone battery system. With its €1 billion bank-backed installment financing vehicle mobilized in mid-2026, 1KOMMA5° seeks to insulate its order pipeline from regulatory subsidy volatility while positioning Heartbeat AI direct marketing as a long-term recurring revenue driver.'
