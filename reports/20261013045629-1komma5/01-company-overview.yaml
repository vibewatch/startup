    - type: missing-source
      severity: material
      topic: audited-financial-statements
      missingEvidence: Complete audited balance sheet and cash flow statements for fiscal year 2025, including operating cash burn and regional EBITDA margins.
      whyItMatters: Public revenue figures (such as €540M in 2024) do not reveal gross margins, craft acquisitions integration costs, or cash runway.
      diligencePath: Review audited Bundesanzeiger filings when posted or request management accounts under NDA.
      relatedTableRefs:
