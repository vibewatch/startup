    - type: private-evidence-only
      severity: material
      topic: governance-and-voting-control
      missingEvidence: Detailed board composition, shareholder voting agreements, and liquidation preference hierarchy for pre-IPO investors.
      whyItMatters: Without formal cap table disclosures, investor control rights and founder key-person dependencies cannot be fully evaluated ahead of an IPO.
      diligencePath: Request confidential cap table and shareholder agreement disclosures during confirmatory legal diligence.
      relatedQuestionRefs:
