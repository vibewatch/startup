callouts:
  - calloutType: strength
    title: Integrated Hardware-Software Model and Capital Mobilization
    body: 1KOMMA5° has differentiated itself from pure software startups and regional solar installers by combining local acquisition of master craft businesses with the Heartbeat AI platform. This operational backbone is further bolstered by its €1 billion bank-backed installment purchase vehicle, removing upfront capital barriers for European homeowners.
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO011
  - calloutType: risk
    title: Valuation Plateau and Standalone Product Economics
    body: Despite reaching a unicorn valuation in 2023, 1KOMMA5° experienced minimal valuation step-up in its December 2024 pre-IPO round after 2024 revenue (€540M) fell short of its €750M target. Additionally, standalone products such as the PowerHarvester battery face payback hurdles exceeding six years for households consuming below 10,000 kWh annually.
    claimRefs:
      - CO008
      - CO010
      - CO013
      - CO014
