  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-estimate
    missingEvidence: Audited ARR, net revenue retention, and gross margin, plus a reconciliation of the conflicting ~$128M and ~$262M revenue estimates.
    whyItMatters: Without a fixed revenue base, the implied entry multiple swings between roughly 5-6x and 11-12x, which is the single biggest driver of the valuation call.
    diligencePath: Request a CFO-level KPI package with audited revenue, ARR, retention, and margin, and reconcile it against third-party estimates.
    relatedQuestionRefs:
    - QV032
  - type: private-evidence-only
    severity: material
    topic: deal-structure
    missingEvidence: Liquidation preferences, ratchets, and the primary-versus-secondary split of the February 2025 recapitalization.
    whyItMatters: A heavy preference stack or a mostly-secondary deal would mean the ~$1.5 billion headline overstates the value transferable to new common equity.
    diligencePath: Conduct a counsel-led cap-table and term-sheet review of the 2025 transaction before underwriting the mark.
    relatedQuestionRefs:
    - QV033
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue share by regulated vertical and top-customer concentration.
    whyItMatters: The durability thesis and bundling exposure both depend on how concentrated Egnyte's revenue is across verticals and accounts.
    diligencePath: Request a customer-by-vertical revenue bridge and top-account concentration schedule during live diligence.
    relatedQuestionRefs:
    - QV034
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table coverage
    missingEvidence: A broader private-round and M&A comp set with disclosed terms for content-collaboration, EFSS, and governance software companies.
    whyItMatters: The comparable table brackets valuation directionally, but the private market has limited disclosed pricing, so the comp basket cannot claim exhaustiveness.
    diligencePath: Expand the set with broker data, secondary marks, and private financing term sheets during live diligence.
    relatedTableRefs:
    - TV004
