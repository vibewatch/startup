- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Type / status
  - Valuation or multiple snapshot
  - Why relevant
  - Key limitation
  rows:
  - - Box, Inc.
    - Public content-collaboration pure-play
    - ~$3.86B market cap on ~$1.2B revenue; ~3.3x revenue; 10-K filed March 2026
    - Closest scaled public proxy for Egnyte's core market
    - Broader horizontal footprint and public-company scale differ from Egnyte's niche
  - - Dropbox
    - Public file-sync and collaboration incumbent
    - ~$6.2-6.7B market cap on ~$2.5B revenue; ~3.4x revenue; sub-10x forward P/E
    - Shows how a mature, no-growth content business is repriced
    - Consumer-heavy mix and stalled growth make it an imperfect enterprise comp
  - - DocuSign
    - Public agreement / content workflow peer
    - ~$8.7-8.8B market cap on ~$3.2-3.3B revenue; ~2.3-2.9x sales
    - Adjacent document-centric SaaS valuation anchor
    - Signature-led mix differs from Egnyte's governance and storage model
  - - ShareFile (Progress Software)
    - Private-to-strategic content-collaboration carve-out
    - $875M cash deal on >$240M revenue (~3.6x); ~86,000 customers
    - Recent M&A print for a directly comparable content asset
    - Carve-out synergies and control premium inflate the headline multiple
  - - 2026 enterprise-SaaS index
    - Analyst-market-data framing reference
    - Median ~3.3x EV/revenue, down from ~4.9x in late 2025
    - Anchors why disciplined multiples matter in 2026 conditions
    - A basket is context, not a company-specific comp
  - - Egnyte (secondary market)
    - Private secondary reference for the subject company
    - ~83% share appreciation since Aug 2024; indicative bids near $20/share
    - Direct read on private demand for Egnyte equity
    - Thin, illiquid prints and no disclosed share count limit precision
  notes: The comparable set mixes public pure-plays, adjacent SaaS, a recent M&A carve-out, sector framing, and Egnyte's own secondary prints to bracket valuation rather than force a single-multiple answer; multiples are 2026 snapshots and move with markets.
