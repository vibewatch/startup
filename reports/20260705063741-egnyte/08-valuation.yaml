- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Bundling-driven commoditization
    - Microsoft/Google materially undercut content-collaboration pricing or win share
    - Growth and exit multiple compress simultaneously
    - Reset fair value toward public-peer ~3x and hold
  - - Revenue conflict resolves low
    - Audited data confirms revenue nearer the ~$128M estimate than ~$262M
    - Implied entry multiple shifts into clearly stretched territory
    - Do not add capital at or above the 2025 mark
  - - Heavy preference stack
    - Recapitalization reveals stacked liquidation preferences or ratchets
    - Headline enterprise value overstates transferable common-equity value
    - Treat the mark as structurally inflated
  - - Retention or churn deterioration
    - Regulated-vertical net revenue retention falls below expansion levels
    - The durability pillar of the thesis weakens
    - Apply a durability discount or move to pass
  - - Exit window closes
    - IPO market stays shut and strategic appetite for content assets fades
    - Liquidity timeline lengthens and IRR erodes
    - Require a lower entry to compensate for illiquidity
  notes: Triggers are monitorable diligence thresholds that convert a private, opaque story into explicit go / no-go conditions; thresholds are analyst-set, not company-disclosed.
