- id: TV002
  title: Thesis and anti-thesis table
  columns:
  - Frame
  - Supporting evidence
  - Why it matters
  - What would change the view
  rows:
  - - Thesis
    - Deep regulated-vertical focus across AEC, life sciences, and financial services
    - Compliance-driven stickiness supports durable, defensible recurring revenue
    - Net revenue retention and vertical concentration data would confirm durability
  - - Thesis
    - Current financing by two blue-chip PE firms at a ~$1.5B mark
    - External validation from disciplined sponsors reduces going-concern risk
    - Disclosure of the deal's primary-versus-secondary split would confirm growth intent
  - - Thesis
    - Management targets a ~$500M ARR milestone under private-equity ownership
    - A credible path to scale could justify a re-rate above the entry mark
    - Audited ARR and a growth trajectory would validate the ambition
  - - Anti-thesis
    - Third-party revenue estimates conflict badly (~$128M vs ~$262M)
    - The entry multiple cannot be underwritten from public evidence alone
    - A CFO KPI package reconciling the estimates would close most of the gap
  - - Anti-thesis
    - SaaStr frames Egnyte as an 18-year steady compounder, not a premium grower
    - Steady mid-teens growth rarely supports a double-digit revenue multiple
    - Evidence of accelerating growth would weaken this objection
  - - Anti-thesis
    - Microsoft and Google bundling pressures content-collaboration pricing
    - Commoditization can compress both growth and exit multiples at once
    - Pricing power and win-rate data against bundled suites would reduce the discount
  notes: Pairs the core upside case with the specific evidence gaps and competitive pressures that keep the recommendation at track rather than buy.
