      - number: '7.5'
        title: People and execution risk
        blocks:
          - type: paragraph
            body: >-
              Egnyte's leadership continuity is unusual and cuts both ways. Vineet Jain has led the company as chief
              executive for roughly nineteen years since founding, and all four co-founders reportedly retained senior
              roles and rolled equity through the 2025 recapitalization. That continuity is a genuine strength for
              institutional knowledge and customer relationships, but it concentrates dependence on a very small group
              and elevates key-person risk if any of them exits. Private-equity ownership adds a specific post-buyout
              retention risk: sponsors typically drive toward an eventual exit or public listing, and the incentive
              changes, liquidity events, and pace pressure that accompany that path can trigger founder or executive
              departures before a deeper, publicly visible bench is established. Execution is also multi-threaded —
              Egnyte must simultaneously scale AI product development, maintain compliance certifications across
              multiple regulated verticals, defend against bundling, and integrate a new ownership operating model. No
              public evidence of 2026 layoffs or executive departures was found, which is reassuring, but the depth of
              the bench below the founders is not disclosed and remains a diligence question rather than a settled fact.
            claimRefs:
              - CR038
              - CR039
              - CR040
