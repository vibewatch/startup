      - number: '3.2'
        title: 'Competitor Profiles: Scale, Funding, and Direction'
        blocks:
          - type: paragraph
            body: >-
              The competitor set spans hyperscale platforms and focused specialists, and their funding and scale shape
              how aggressively each can price and invest. Microsoft and Google are trillion-dollar platform owners that
              fold storage and collaboration into Microsoft 365 and Workspace, subsidizing content features with suite
              economics. Box reported roughly $1.18 billion in fiscal-2026 revenue, about eight percent annual growth,
              and more than 100,000 paying organizations including a large share of the Fortune 500, and is pushing an
              AI-driven Enterprise Advanced tier. Dropbox, also public, monetizes tens of millions of users and is
              moving upmarket into team governance while defending a simplicity-led brand. Among specialists, iManage
              serves more than 4,000 organizations and over one million legal and professional-services users at an
              estimated ~$257 million revenue under founder and private-equity ownership; Veeva Vault dominates
              life-sciences regulated content with a specialized public-company franchise; Autodesk ranks among the top
              construction-software vendors for AEC document control; and Citrix ShareFile, Nextcloud, and DocuWare
              address secure exchange, self-hosted open source, and document automation respectively. Against Box's
              100,000-plus organizations, Egnyte's installed base is roughly an order of magnitude smaller, positioning
              it as a focused mid-market and regulated-vertical challenger rather than a horizontal incumbent, and
              unlike public Box, Dropbox, and Veeva it is privately held under private-equity control.
            claimRefs:
              - CP008
