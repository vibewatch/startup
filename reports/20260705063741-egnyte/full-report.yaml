      - number: '2.2'
        title: Market Sizing Across Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              No single number captures Egnyte's opportunity, so we triangulate five lenses for 2026. The broad
              enterprise content management market is estimated between $44.29 billion (Mordor Intelligence) and $76.42
              billion (Global Growth Insights), with mid-range readings near $57-60 billion from Fortune Business
              Insights and MarketsandMarkets. The wider content services platform market is larger, around $88-93
              billion in 2026 per Precedence Research and The Business Research Company. The content collaboration /
              EFSS market closest to Egnyte's core is far smaller, roughly $15.7 billion (GMI Insights) to $19.3 billion
              (MarketsandMarkets). Two governance adjacencies frame the security pull: data governance near $6.3-6.8
              billion and content-centric data loss prevention near $4.1-4.7 billion, both growing above 22% CAGR.
              Applying a TAM/SAM/SOM lens, we treat content services platforms (~$93 billion) as TAM, regulated
              mid-market content collaboration plus governance (~$20 billion) as SAM, and near-term reachable regulated
              content-cloud spend (~$3 billion) as SOM. Against this, Egnyte's roughly $128 million revenue footprint
              implies well under 1% of the content-services TAM, underscoring a long expansion runway rather than
              saturation.
