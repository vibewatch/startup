  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk
        blocks:
          - type: paragraph
            body: >-
              Egnyte deliberately sells into heavily regulated verticals, and that go-to-market choice converts its
              customers' compliance obligations into Egnyte's own operational and contractual risk. Life-sciences
              customers rely on the platform to help satisfy FDA 21 CFR Part 11 electronic-records and
              electronic-signature controls, including audit trails and validation; financial-services broker-dealers
              rely on it to preserve books and records for at least six years in non-rewriteable (WORM) or approved
              audit-trail form under SEC Rule 17a-4 and FINRA Rule 4511. In privacy, GDPR restricts transfers of EU
              personal data outside the EEA (Article 44) absent an adequacy decision or safeguards such as standard
              contractual clauses, and it mandates breach notification to the supervisory authority within 72 hours
              (Article 33); HIPAA obligates Egnyte, as a business associate, to safeguard ePHI and notify on breaches,
              while CCPA/CPRA grants California consumers rights the company must honor. The EU-US Data Privacy
              Framework underpins lawful trans-Atlantic transfers but remains legally contestable, a live data-transfer
              risk. Egnyte is also a recurring target of file-synchronization patent suits — Topia Technology's claims
              survived an early invalidity challenge, and Data Resonance's suit ended in a stipulated dismissal — a
              persistent legal-cost distraction. No material regulatory enforcement action or fine against Egnyte itself
              was found in public sources as of 2026-07-05.
            claimRefs:
