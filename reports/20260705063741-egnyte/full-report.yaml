              positive since 2016. Per-seat contribution is a function of blended net price (below the $22-$48 list
              after discounts) against cloud-hosting, hybrid "Turbo" caching, support, and channel-margin costs; against
              public content-platform comps this implies a healthy but not best-in-class software gross margin.
              Retention signals are indirect: expansion into regulated verticals, 23,000+ accounts, and land-and-expand
              add-on selling point to solid net retention, but adverse reviews cite renewal price increases and
              difficult cancellations that could pressure logo retention among smaller customers. Sales efficiency
