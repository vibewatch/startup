      - number: '3.4'
        title: Pricing and Packaging Comparison
        blocks:
          - type: paragraph
            body: >-
              Pricing structures diverge sharply and define much of the competitive pressure on Egnyte. The bundled
              suites are the most dangerous on price: SharePoint and OneDrive ship inside Microsoft 365 plans that many
              buyers already pay for, and Google Drive inside Workspace, so the marginal cost of the status-quo
              alternative can appear to be zero. Among pure plays, Dropbox Business lists Standard at about $15 per user
              per month with 3 TB pooled storage and Advanced at about $24 with 15 TB, while Box runs a per-seat tiered
              model from roughly $15 up to quote-based Enterprise and Enterprise Advanced. Citrix ShareFile publishes
              advanced and premium per-user tiers plus a high-security virtual-data-room option, Nextcloud sells
              self-hosted enterprise subscriptions around €71–€205 per user per year with no vendor lock-in, and
              DocuWare is quote-based. Egnyte lists in a comparable mid-to-premium per-seat band but is repeatedly
              criticized in reviews for a-la-carte add-on pricing and steep renewal increases that make total cost
              unpredictable for long-tenured customers. The net implication is that Egnyte cannot win on headline price
              against bundled suites and must justify a premium through governance, hybrid, and vertical-compliance
              value.
