      - number: '1.2'
        title: Leadership, Founders, and Governance
        blocks:
          - type: paragraph
            body: >-
              Egnyte is distinguished by unusual founder continuity: all four original co-founders remain in senior
              executive roles nearly two decades after the 2007 founding. Vineet Jain serves as Founder and Chief
              Executive Officer and is the company's most visible leader, having steered it through eight venture rounds
              and the 2025 private-equity recapitalization while retaining operational control. Amrit Jassal serves as
              Chief Technology Officer, Kris Lahiri as Chief Security Officer, and Rajesh Ram in a chief growth and
              strategy capacity. This durable founding team is a governance strength but also concentrates key-person
              dependence on Vineet Jain, who has personified the company's strategy and fundraising for eighteen-plus
              years. Following the February 2025 majority investment, GI Partners and TA Associates hold board-level
              control, shifting ultimate governance from a venture syndicate to private-equity sponsors even as the
              founders and management retain significant minority equity and day-to-day leadership. That transition
              introduces the classic tension of PE ownership — pressure for margin expansion and disciplined capital
              allocation — layered onto a still founder-run operating team. Public disclosure of the full executive
              bench, board composition, and any post-deal leadership changes remains limited, reflecting Egnyte's status
              as a private, financially opaque company.
