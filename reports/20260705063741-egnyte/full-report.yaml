  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Pricing, and Monetization
        blocks:
          - type: paragraph
            body: >-
              Egnyte's revenue is overwhelmingly recurring subscription income from its Content Cloud platform, sold on
              a per-seat, annually contracted basis rather than on consumption or transaction volume. Published list
              pricing spans five tiers — Team at $10 per user/month, Business at $22, Enterprise Lite at $39, Elite at
              $48, and a custom-quoted Ultimate/Enterprise tier — with storage, governance, threat detection, and AI
              capabilities gated by tier. Monetization layers on top of the seat price through vertical bundles for Life
              Sciences (GxP/21 CFR Part 11), AEC, and Financial Services, plus add-ons such as Egnyte Copilot AI, DLP,
              e-discovery, and additional storage that procurement advisors say can add 20-40% to an annual contract.
              Realized pricing diverges materially from list: procurement sources report typical deals of roughly
              $15,000-$75,000 per year with a median near $37,000, and large buyers negotiating 9-30% discounts, so list
              rates overstate net per-seat economics. The company sells across a wide deal-size band — from sub-$10K
              self-service SMB transactions to $1M-plus enterprise agreements — supporting a multi-motion go-to-market.
              Egnyte does not break out revenue by tier, vertical, or geography publicly, so the mix among Team/Business
              SMB seats and high-ACV regulated-industry enterprise accounts remains an estimation exercise rather than a
              disclosed fact.
