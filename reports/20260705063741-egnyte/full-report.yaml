            body: >-
              Forward capital adequacy, not the historical round-by-round chronology covered in Company Overview, is the
              underwriting question here. Egnyte's cumulative pre-2025 venture equity funding of roughly $138M is small
              relative to its revenue base, and its self-described cash-flow-positive status since 2016 implies limited
              structural dependence on external financing to fund operations. The defining 2026-relevant event is the
              February 2025 GI Partners and TA Associates majority recapitalization, reported at an implied enterprise
              value near $1.5B, which provided liquidity to founders, management, and early venture backers while
              injecting growth capital. Deal size and any associated debt or credit facilities were not disclosed, and
              private-equity control typically layers in leverage and a defined return timeline, so the post-recap
              balance sheet — cash on hand, any acquisition debt, and covenant obligations — is a material unknown.
              Egnyte's stated liquidity path is an eventual IPO rather than repeated primary raises, consistent with a
              business that funds itself from operations. On the evidence available, financing dependency looks low for
              operating continuity but the use of PE leverage, next-round or refinancing triggers, and any project or
