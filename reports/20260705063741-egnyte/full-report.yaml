        - Pause and demand root-cause analysis and remediation before any commitment
      - - Compliance-posture loss
        - Certification registries, audit reports, and regulator actions
        - Loss of ISO/SOC/Part 11 posture or a FINRA/SEC recordkeeping finding
        - Treat as thesis-threatening for the regulated-vertical strategy
      - - Trans-Atlantic transfer disruption
        - EU court and Data Privacy Framework rulings
        - DPF invalidation without a working SCC/residency fallback
        - Reassess EU revenue exposure and transfer architecture
      - - PE repricing and churn
        - Renewal pricing trends and customer-review sentiment
        - Sharp renewal increases coupled with a measurable churn spike
        - Reduce valuation tolerance and demand cohort retention evidence
      - - Bundling displacement
        - Competitive win/loss and pricing intelligence
        - Accelerating losses to Microsoft 365 or Google Workspace
        - Cut growth assumptions and re-underwrite the moat
      - - Key-person exit
        - Leadership announcements and executive-tenure signals
        - CEO or co-founder departure before a visible succession plan
        - Pause until succession and operating accountability are clear
    notes: >-
      These kill criteria are underwriting tools rather than predictions; the goal is to detect the moment
      category-level risk becomes company-specific impairment, and each trigger pairs with a concrete diligence ask.
