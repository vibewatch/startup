      - number: '2.6'
        title: Estimate Divergence and Sizing Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Market-sizing evidence for this category is noisy, and we preserve rather than paper over the
              contradictions. For enterprise content management alone, 2026 estimates span from $44 billion to $76
              billion, a spread of over 70%, because publishers disagree on whether the category includes legacy records
              management, capture and imaging services, or overlapping content-services and governance spend. The
              content collaboration, content services, DLP, and data-governance lenses each count a different basket, so
              summing them would double-count. On the company side, Egnyte's own revenue scale is disputed: GetLatka
              estimates roughly $128 million annualized, while another third-party tracker headlines an ARR figure near
              $300 million, leaving Egnyte's true market share uncertain. Because Egnyte is private and does not
              disclose segment revenue, its precise serviceable and obtainable market within regulated mid-market
              content collaboration cannot be isolated from public data. We therefore treat the sizing as a range
              bounded by source-backed estimates, flag the divergent revenue figures as a conflicting-data gap, and
              record the missing segment disclosure as a diligence path rather than resolving it with a single confident
              number.
            claimRefs:
              - CM038
              - CM039
              - CM040
              - CM041
              - CM042
          - type: figure
            figureRef: FM002
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM038
      - number: '2.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Governed, Regulated-Vertical Niche Defends Premium
            body: >-
              By concentrating on regulated verticals such as AEC, life sciences, and financial services, where
              compliance, large files, and external collaboration intersect, Egnyte occupies a slice of a
              multi-billion-dollar market where bundled generalists are structurally weak, letting it defend price
              against Microsoft and Google.
            calloutType: strength
            claimRefs:
              - CM019
              - CM021
              - CM036
          - type: callout
            title: Bundling Commoditizes the Horizontal Core
            body: >-
              Microsoft 365 and Google Workspace bundle file sharing at near-zero marginal cost and have closed much of
              the basic feature gap, compressing the standalone content-collaboration opportunity and forcing
              specialists continually up the value chain to justify a premium.
            calloutType: risk
            claimRefs:
              - CM036
              - CM011
          - type: callout
            title: Sizing Divergence Demands a Range, Not a Number
            body: >-
              Because 2026 ECM estimates span $44-76 billion and Egnyte's own revenue is reported at both ~$128 million
              and ~$300 million, any single TAM-times-share valuation is unreliable; the defensible output is a bounded
              range with preserved contradictions.
            calloutType: insight
            claimRefs:
