  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Every buyer Egnyte targets can solve the same content-collaboration job in at least six ways, and Egnyte
              must win against all of them. Bundled incumbents Microsoft 365 (SharePoint and OneDrive) and Google
              Workspace (Drive) arrive effectively free inside productivity suites the customer already owns, making
              them the default that Egnyte must displace or coexist with. Direct pure plays Box and Dropbox Business
              compete head-to-head on secure file sharing and content management, with Box now a roughly $1.18 billion
              revenue public company and Dropbox a public consumer-to-enterprise franchise. Adjacent and substitute
              vendors solve narrower slices: Citrix ShareFile for secure exchange, the open-source Nextcloud for
              self-hosted control, DocuWare for document workflow, iManage for legal knowledge work, Autodesk for AEC
              document control, and Veeva Vault for life-sciences GxP content. Beneath all of them sits the status quo
              of on-premises file servers and network-attached storage, often extended by hybrid-cloud filers Nasuni and
              Panzura, plus the perennial option for a large IT organization to build and self-host. Egnyte's
              positioning is deliberately in the seam: a single hybrid platform that behaves like a local file server
              yet layers cloud governance, security, and AI across regulated verticals where the horizontal suites are
              weak on granular control.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
          - type: table
            tableRef: TP001
