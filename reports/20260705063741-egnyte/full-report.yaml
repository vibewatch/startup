      - number: '3.5'
        title: Switching Costs, Lock-in, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Switching costs and distribution power cut in opposite directions for Egnyte. On the defensive side, once
              an organization maps Egnyte as its hybrid file system, embeds it in AEC or life-sciences workflows, and
              accumulates governed data with retention and permission structures, data gravity and re-permissioning make
              migration slow and costly, which raises retention. Deep vertical integrations and compliance
              configurations deepen that lock-in in regulated segments. On the offensive side, however, distribution
              power favors the incumbents: Microsoft and Google reach the same buyers through pre-installed, pre-paid
              suites and enterprise agreements, and can bundle new AI and governance features at near-zero incremental
              price, a channel advantage Egnyte cannot match. Multi-homing is common, with Egnyte frequently deployed
              alongside Microsoft 365 rather than replacing it, which caps wallet share. Egnyte's countervailing
              distribution levers are its MSP and reseller channel and its vertical partner ecosystems in AEC and life
              sciences, but these are narrower than the hyperscalers' installed base. The practical result is strong
              per-account stickiness offset by weaker top-of-funnel distribution than the bundled platforms enjoy.
