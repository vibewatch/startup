        title: Milestones and Corporate Trajectory
        blocks:
          - type: paragraph
            body: >-
              Egnyte's corporate history spans a 2007 founding, a long venture-funded build-out, and a 2025 pivot to
              private-equity ownership. Key milestones include the 2007 founding in Mountain View; early GV, Polaris,
              and Kleiner Perkins backing; a 2013 Series D of about $29.5 million; reaching cash-flow positive status in
              2016; the $75 million Goldman Sachs Series E in October 2018; steady expansion into regulated verticals;
              the February 2025 GI Partners and TA Associates majority investment at a roughly $1.5 billion valuation;
              and, in 2026, the launch of AI Safeguards and the Egnyte Copilot AI Assistant that embed governed
              generative AI directly into the Content Cloud. The trajectory reflects a deliberate, capital-efficient
              "steady wins" strategy rather than blitzscaling — an approach that delivered durable growth and a $1.5B
              outcome but also left the company opaque on financials and now exposed to private-equity pressure on
              pricing, renewals, and roadmap. Adverse threads run alongside the growth story: recurring customer
              complaints about desktop-sync performance and pricing, renewal friction, and analyst warnings that PE
              ownership may squeeze smaller customers and channel partners. The timeline therefore serves as the single
