        title: Customer complaints and adverse signals
        blocks:
          - type: paragraph
            body: >-
              The adverse customer evidence is concentrated in independent review platforms and centers on product
              experience, pricing, and lock-in rather than mass defection. The most consistent complaint is slow
              synchronization of large files, which surfaces across Capterra, SoftwareAdvice, and aggregated review
              summaries and matters because large files are precisely the AEC and media use cases Egnyte markets to.
              Reviewers also cite desktop-application limitations and Microsoft Office co-editing friction that feels
              less seamless than Microsoft's native tooling, a meaningful risk given Microsoft 365 bundling pressure. On
              commercials, scattered reviews report unexpected renewal price increases and difficulty cancelling or
              downgrading, with some users saying terms were not clearly disclosed — a procurement and trust concern
              that a private-equity owner focused on monetization could amplify. When customers do weigh leaving, the
              alternatives they name are Microsoft SharePoint, Dropbox, and Google Drive, underlining that Egnyte
              competes against bundled incumbents on both price and integration. None of this evidences a churn crisis,
              and satisfaction scores remain solidly above four out of five, but the pattern — sync performance, desktop
              friction, and renewal-pricing surprises — is exactly the kind of erosion risk that logo-and-outcome
              diligence tends to miss.
