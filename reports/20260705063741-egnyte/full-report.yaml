          - type: callout
            title: Private-equity control is both stabilizer and stressor
            body: >-
              GI Partners and TA Associates fund growth and retain the founders, but their return timeline can pressure
              pricing, leverage, and retention in ways outside underwriters cannot see because the financials are
              undisclosed.
            calloutType: assumption
            claimRefs:
