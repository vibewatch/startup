      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, do not chase
            body: >-
              Egnyte is investable in principle, but the conflicting revenue base and undisclosed terms make the ~$1.5B
              mark impossible to underwrite as attractive on public evidence alone.
            calloutType: recommendation
            claimRefs:
              - CV006
              - CV031
              - CV034
          - type: callout
            title: The anti-thesis is bundling plus opacity
            body: >-
              Microsoft and Google bundling can compress Egnyte's growth and multiple at once, while private-equity
              opacity hides whether the headline mark is transferable.
            calloutType: risk
            claimRefs:
              - CV029
              - CV043
              - CV044
          - type: callout
            title: A data room could move the call quickly
            body: >-
              Egnyte does not need a new narrative to earn a better recommendation; it needs audited ARR, retention, and
              term-sheet disclosure to fix the entry multiple.
            calloutType: assumption
            claimRefs:
              - CV005
              - CV042
              - CV043
