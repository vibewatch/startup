          label: Evaluation vs bundled incumbents
          detail: Buyers weigh Egnyte against SharePoint, Dropbox, and Google Drive on price and integration
          tone: warning
        - id: purchase
          label: Purchase (often via partner / MSP)
          detail: Deals frequently route through the 1,000+ partner channel and MSP packages
          tone: neutral
        - id: migration
          label: Migration and deployment
          detail: Data is cut over to Egnyte's hybrid cloud, sometimes with professional services
          tone: positive
        - id: production
          label: Production collaboration
          detail: Named accounts run live workflows across sites, partners, and regulated content
          tone: positive
        - id: expansion
          label: Expansion and module upsell
          detail: Accounts standardize enterprise-wide and add governance, ransomware, and AI modules
          tone: positive
      edges:
        - from: discovery
          to: evaluation
          label: shortlist
        - from: evaluation
          to: purchase
          label: selected
        - from: purchase
          to: migration
          label: contracted
        - from: migration
          to: production
          label: cut over
        - from: production
          to: expansion
          label: outcomes justify
