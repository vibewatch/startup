      - number: '7.4'
        title: Financial and model risk
        blocks:
          - type: paragraph
            body: >-
              Egnyte is privately held and does not publish audited financials, so leverage, margins, retention, and
              customer concentration are opaque to outside underwriters — an information risk that compounds every other
              risk in this chapter. Third-party revenue estimates are wide and unreconciled, which limits the confidence
              any external party can place on the growth story. The most structural model risk is commoditization
              pressure from the productivity suites: in 2026 Microsoft retired standalone SharePoint plans and folded
              the capability into Microsoft 365, and Google bundled its Gemini AI across Workspace, intensifying
              "good-enough" bundling that compresses margins for standalone file-sharing vendors and pushes them toward
              compliance-heavy and vertical niches to defend pricing. Because the February 2025 deal terms are
              undisclosed, the post-buyout debt load and covenant structure are unknown, and private-equity ownership
              can translate into renewal price increases that lift churn — a dynamic reviewers already associate with
              Egnyte's renewals. Churn and net revenue retention are not disclosed, leaving the durability of the
              subscription base unverifiable from public evidence and dependent on diligence access to internal cohorts.
