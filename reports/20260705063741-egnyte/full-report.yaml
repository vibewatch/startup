              - CV007
              - CV024
              - CV027
              - CV037
              - CV044
      - number: '8.3'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              Scenario framing brackets the outcome band around the current mark rather than pretending to a single
              answer. The bull case assumes Egnyte executes toward its stated ~$500 million ARR ambition, sustains
              regulated-vertical retention, and re-rates toward a growth-software multiple; that path supports roughly
              $2.4-3.6 billion, well above the entry mark. The base case assumes the ~$1.5 billion PE mark simply holds
              — steady mid-teens growth, no multiple re-rate, and gradual margin expansion under private-equity
              ownership keep value near $1.3-1.8 billion. The bear case assumes Microsoft and Google bundling
              accelerates content-collaboration commoditization, growth decelerates, and Egnyte's multiple compresses
              toward the ~3x revenue level where public content peers trade on the lower ARR base — implying roughly
              $0.6-1.0 billion. The sensitivity analysis shows that the largest positive lever is reaching the $500M ARR
              milestone and re-rating, while the largest negative levers are bundling-driven compression and
              confirmation that the lower ~$128M revenue base is the accurate one.
            claimRefs:
              - CV004
              - CV007
              - CV024
              - CV027
              - CV030
