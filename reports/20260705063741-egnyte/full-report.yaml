        - Treat the mark as structurally inflated
      - - Retention or churn deterioration
        - Regulated-vertical net revenue retention falls below expansion levels
        - The durability pillar of the thesis weakens
        - Apply a durability discount or move to pass
      - - Exit window closes
        - IPO market stays shut and strategic appetite for content assets fades
        - Liquidity timeline lengthens and IRR erodes
        - Require a lower entry to compensate for illiquidity
    notes: >-
      Triggers are monitorable diligence thresholds that convert a private, opaque story into explicit go / no-go
      conditions; thresholds are analyst-set, not company-disclosed.
    claimRefs:
      - CV006
      - CV018
      - CV024
      - CV029
      - CV037
      - CV043
      - CV044
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
      - Threshold for comfort
    rows:
      - - Audited ARR and growth
        - Audited ARR, year-over-year growth, and a reconciliation of the ~$128M vs ~$262M estimates
        - The entry multiple cannot be underwritten until the revenue base is fixed
        - CFO packet plus auditor confirmation
        - A single defensible revenue figure inside a supportable multiple band
      - - Net revenue retention and margin
        - Net revenue retention, gross margin, and contribution margin by segment
        - Separates durable economics from headline scale
        - Finance and operations review
        - Retention above expansion thresholds and healthy gross margin
      - - Financing structure
        - Liquidation preferences, ratchets, and the primary-versus-secondary split of the 2025 deal
        - Headline mark can overstate common-equity transfer value
        - Counsel-led cap-table and term-sheet review
        - Clean enough structure to trust the headline enterprise value
      - - Customer concentration
        - Revenue share by regulated vertical and top-customer concentration
        - Tests the durability thesis and bundling exposure directly
        - Revenue analytics and reference calls
        - No single vertical or account dominates economics
      - - Competitive win-rate
        - Win/loss and pricing data versus Microsoft 365 and Google Workspace bundles
        - Directly probes the commoditization anti-thesis
        - Sales and product review
        - Evidence of durable pricing power and stable win rates
      - - Exit and liquidity plan
        - PE sponsors' hold horizon, IPO readiness, and secondary policy
        - Determines realistic return timing and path
        - Sponsor and board materials review
        - A credible, milestone-linked liquidity plan
    notes: >-
      Asks are ordered by what most changes underwriting quality; each maps to a monitorable threshold rather than to
      what is easiest for management to provide.
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV038
      - CV042
      - CV043
      - CV044
      - CV045
