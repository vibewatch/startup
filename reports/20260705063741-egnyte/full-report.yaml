      - number: '6.4'
        title: Retention, satisfaction, and durability
        blocks:
          - type: paragraph
            body: >-
              Durability is where the public customer case thins out sharply. Egnyte discloses no net revenue retention,
              gross retention, logo churn, renewal rate, or contract length, so investors cannot underwrite customer
              stickiness from open sources. What exists instead are proxies of two kinds. First, satisfaction signals:
              review-platform scores are moderately positive (G2 around 4.4, Capterra around 4.5, and high Gartner Peer
              Insights marks), which indicate contentment but are not retention guarantees. Second, outcome-backed
              durability proxies: the named case studies show cost savings, ransomware recovery, and utilization gains
              that make renewal plausible because switching away from an embedded content platform is costly. To frame
              the missing metrics, 2026 industry benchmarks put enterprise SaaS median NRR near 118%, SMB near 97%, and
              blended private SaaS near 101%, implying Egnyte's mix-dependent number is unknown but likely healthy on
              the enterprise side and weaker in SMB. The adverse counterweight is that public customer counts themselves
              disagree — the company says 23,000+ while TrustRadius cites 16,000+ — which is a caution against treating
              any single durability proxy as settled. Formal diligence must request cohort NRR/GRR, renewal history, and
              satisfaction instruments (NPS/CSAT) by segment.
