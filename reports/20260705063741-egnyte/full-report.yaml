              - CR033
              - CR044
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and underwriting frame
        blocks:
          - type: paragraph
            body: >-
              Egnyte clears the bar for serious institutional attention because it is a real, cash-generative,
              18-year-old category player that just completed a current financing event rather than carrying a stale
              venture mark. In February 2025 GI Partners and TA Associates led a majority private-equity
              recapitalization, and independent commentary places the implied enterprise value at roughly $1.5 billion.
              The underwriting problem is not whether Egnyte is a durable business; it is whether that price already
              prices in growth the public record cannot confirm. The single most consequential gap is revenue itself —
              GetLatka estimates about $128 million of annualized revenue while Growjo estimates roughly $262 million,
              and the two figures imply wildly different entry multiples. Founder-CEO Vineet Jain frames the deal as
              growth capital toward a $500 million ARR milestone, not an imminent exit. That combination — real scale,
              current financing, but unresolved revenue and undisclosed terms — supports a track / research-more call,
              medium confidence, high risk, and a fair-to-stretched valuation stance rather than a buy.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV028
              - CV029
              - CV030
