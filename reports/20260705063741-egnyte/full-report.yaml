      - number: '2.3'
        title: Vertical Market Pools and Regulatory Pull
        blocks:
          - type: paragraph
            body: >-
              Egnyte's go-to-market concentrates on regulated verticals where content governance is a compliance
              requirement rather than a convenience, and these vertical software pools are sizeable in their own right.
              The architecture, engineering, and construction (AEC) software market is estimated near $12.04 billion in
              2026 growing around 8-11% annually, driven by BIM mandates, large-file CAD collaboration, and distributed
              jobsite teams that horizontal suites handle poorly. The life sciences software market is estimated near
              $22-24 billion in 2026 at roughly 11% CAGR, with a GxP-specific electronic quality and document-management
              sub-segment near $1.6-3.0 billion. Regulatory frameworks such as the U.S. FDA's 21 CFR Part 11 rules on
              electronic records and signatures create durable, non-discretionary demand for validated, auditable
              content systems in pharma, biotech, and medical devices. Financial services adds a further pool where
              retention, audit, and data-residency obligations favor governed content platforms. These vertical pools do
              not simply add to the horizontal TAM; they explain why Egnyte can defend price and win against bundled
              generalists inside a subset of the market where compliance, large files, and external collaboration
              intersect.
            claimRefs:
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
              - CM024
      - number: '2.4'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              The buying structure for governed content collaboration is multi-stakeholder. The economic buyer is
              typically enterprise IT leadership (CIO or CISO) with security, compliance, and infrastructure budgets,
              but line-of-business owners frequently trigger and co-fund purchases: a virtual design-and-construction or
              BIM manager in AEC, a quality or regulatory-affairs lead in life sciences, or an operations lead in
              financial services. Users span internal knowledge workers plus a large population of external partners,
              contractors, and auditors who must access content without full seats in the buyer's productivity suite.
              The payer and budget owner shift by segment: centralized IT security budget in large enterprises,
              departmental or project budgets in AEC and media, and validated-systems budgets in regulated pharma.
              Adoption is triggered by concrete events, a compliance mandate or audit, a ransomware scare, the limits of
              Microsoft 365 for large-file or external collaboration, or a cloud-migration of an aging file server. The
              adoption path runs from a departmental or vertical beachhead to enterprise governance standardization,
              which is why Egnyte pairs horizontal collaboration with vertical compliance packaging to convert a
              single-team win into an organization-wide platform.
            claimRefs:
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
