chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Founding, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Egnyte, Inc. is a cloud content management, collaboration, and data-governance company headquartered in
              Mountain View, California, with an additional engineering hub in Spokane, Washington. The company was
              founded in 2007 by Vineet Jain alongside co-founders Rajesh Ram, Amrit Jassal, and Kris Lahiri, and it
              remains privately held and founder-led nearly two decades later. Egnyte sells a unified platform it
              markets as the "Content Cloud" — an AI-powered system that combines file collaboration (Egnyte Connect),
              data security and governance (Egnyte Protect), and generative-AI capabilities (Egnyte Copilot). Its
              Connect product is designed to work like a local file server while syncing to the cloud, supporting hybrid
              on-premises and cloud deployments favored by regulated industries. The business model is subscription
              SaaS, sold per user and per plan tier with custom enterprise pricing; published entry pricing sits around
              $8–$10 per user per month, rising sharply for governance and AI features. Egnyte targets mid-market and
              enterprise buyers in regulated verticals such as architecture, engineering and construction, life
              sciences, financial services, media, and legal, and integrates with Microsoft 365, Google Workspace,
              Slack, and Salesforce. The company competes against Microsoft SharePoint and OneDrive, Google Drive, Box,
              and Dropbox.
