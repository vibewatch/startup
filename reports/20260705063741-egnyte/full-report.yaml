      - number: '8.2'
        title: Current financing context and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The central valuation question is whether the ~$1.5 billion mark is disciplined or generous, and the
              honest answer is that public evidence cannot settle it. At GetLatka's ~$128 million ARR estimate, the deal
              implies roughly 11-12x revenue, a growth-software multiple that is hard to justify for a steady,
              mid-teens-growth compounder. At Growjo's ~$262 million revenue estimate, the same mark implies only about
              5-6x, which is defensible against 2026 software comparables. The truth almost certainly sits between, but
              the spread is wide enough that entry discipline demands treating the multiple as a range rather than a
              point. Two structural facts reinforce caution. First, the transaction was a recapitalization with heavy
              secondary components, so the headline enterprise value may overstate the transfer value available to any
              new common-equity buyer if preferences are stacked. Second, Egnyte's private secondary shares have
              appreciated meaningfully — PM Insights reports roughly 83% since August 2024, and Forge lists indicative
              bids near $20 per share — which signals demand but also that entry is no longer cheap.
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV043
          - type: figure
            figureRef: FV002
            claimRefs:
