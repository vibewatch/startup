  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Module Map
        blocks:
          - type: paragraph
            body: >-
              Egnyte presents itself as an "AI-Powered Content Cloud," but in customer workflow terms it is best
              understood as one governed repository that a company can point every content-heavy job at instead of
              stitching together separate file-sharing, security, and AI tools. The official product surface groups the
              offering into five pillars: Collaboration, Intelligence, Governance, Platform, and Integrations.
              Collaboration (historically branded Egnyte Connect) lets distributed teams work on mission-critical files
              from an office, home, or field site with desktop, web, and mobile access that behaves like a familiar
              shared drive. Governance (the Secure & Govern / Protect module) layers sensitive-data discovery,
              classification, ransomware detection, permissions monitoring, and multi-cloud data management on top of
              the same content. Intelligence (Copilot / AI Assistant) applies generative AI to that private,
              permissioned content for summarization, knowledge-base Q&A, and extraction. Because all three pillars read
              and write the same repository under one permission model, Egnyte can position collaboration and governance
              as a unified purchase rather than a bolt-on — the core of its differentiation versus point tools.
            claimRefs:
