      - number: '4.6'
        title: 'Financial Verdict: Revenue Quality, Margin Path, and Diligence Blockers'
        blocks:
          - type: paragraph
            body: >-
              On revenue quality, Egnyte scores well: income is recurring, subscription-based, contractually annual,
              diversified across tens of thousands of accounts and multiple regulated verticals, and anchored by sticky
              governance and compliance workflows that resist rip-and-replace. On margin path, the comp-based read is
              constructive — a mature content-platform peer earns ~82% gross and ~28% operating margins, and Egnyte's
              cash-flow-positive, capital-efficient history suggests it operates profitably, if likely a few points
              below Box on gross margin due to hybrid architecture and channel mix. On capital intensity, the business
              is light: software delivery with modest edge-hardware and no heavy capex or inventory, funded largely from
              operations rather than serial dilution. The decisive weakness is disclosure. The absence of audited
              revenue, growth, gross margin, NRR, CAC/payback, cash, and burn — compounded by a two-fold public ARR
              conflict and PE-deal terms that were never released — means the investment case rests on estimates and
              comparables. Adverse signals (renewal-price complaints, difficult cancellations, and a "steady, not
              premium" ~5-6x ARR PE multiple) temper the growth narrative. The verdict: a financially healthy,
              capital-efficient private compounder whose quality is credible but whose exact economics are unauditable
              from outside, making data-room access the gating condition for any valuation or underwriting conclusion.
