  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >-
              Egnyte sells to organizations that must collaborate on large, sensitive, or regulated content, not to
              self-serve consumers. Its own industry pages present five explicit vertical practices — AEC, financial
              services, life sciences, media & entertainment, and public sector — and third-party account-tracking data
              shows live deployments reaching further into construction, manufacturing, oil & gas, law practice,
              architecture, and events services. The buyer is typically IT, technology, or compliance leadership; the
              daily users are project teams, clinicians and research staff, advisors, attorneys, and external partners
              such as CROs, subcontractors, and clients; and the payer is the organization's IT or program budget. The
              base ranges from small firms under 50 employees to enterprises of 1,000–5,000+ employees, so the
              segmentation spans SMB through enterprise rather than a single archetype. Vertical depth is the
              differentiator: life sciences leans on GxP, 21 CFR Part 11, ICH E6(R3), and eTMF workflows, while AEC
              leans on massive-file collaboration and hybrid file-server replacement across dispersed jobsites. This mix
              matters for underwriting because it implies an IT-led enterprise sale with strong compliance pull in
              regulated verticals but also exposure to horizontal price competition in less-regulated segments.
