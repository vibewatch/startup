            body: >-
              With no disclosed Egnyte P&L, the cost structure is best framed against Box, the closest public pure play
              in cloud content management. In fiscal 2026 Box reported about $1.18B revenue growing near 8-9%, a
              non-GAAP gross margin around 82%, and a non-GAAP operating margin near 28% — a useful ceiling for what a
              mature, subscription content platform can earn. Egnyte's gross-margin drivers are similar: cloud
              infrastructure and storage, hybrid edge caching appliances, customer support, security and compliance
              tooling, and third-party integration maintenance. Two structural differences likely pull Egnyte's margin
              profile below Box's. First, Egnyte's hybrid on-prem/Turbo architecture and heavy regulated-vertical
              support carry more service-delivery and infrastructure cost per seat than a pure-cloud peer. Second,
              meaningful channel/reseller distribution shifts some gross margin to partners. Offsetting these, Egnyte's
              smaller absolute scale and disciplined "profitable growth" posture — it has publicly targeted $500M ARR
              while remaining cash generative — suggest operating margins that are positive rather than the deep losses
              common among growth-stage SaaS. The net read is a plausible gross margin in the low-to-mid-70s to low-80s
              percent and modestly positive operating/free-cash-flow margin, but every figure here is a comp-derived
              estimate, not an Egnyte disclosure, and should be confirmed against audited statements in diligence.
