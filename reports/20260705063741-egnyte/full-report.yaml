              dates in May–June 2026, evidence of continued additions, while TrustRadius describes the base as "more
              than 16,000 organizations" — a materially lower number that shows public counts are not reconciled.
              Distribution scale is also visible: Egnyte reports a channel community of more than 1,000 partners. Where
