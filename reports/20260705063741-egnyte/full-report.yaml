      - number: '8.5'
        title: Exit readiness, thesis-breaks, and final diligence
        blocks:
          - type: paragraph
            body: >-
              Egnyte is not IPO-ready today, and management has signaled no imminent public offering; the most plausible
              medium-term exit is a private-equity-driven strategic sale or a later-cycle IPO once the $500 million ARR
              milestone is closer, while secondary marketplaces already provide partial liquidity for early holders. The
              path from track to buy is evidence-dependent. The first thesis-break condition is competitive — if
              Microsoft and Google bundling accelerates commoditization, Egnyte's growth and multiple both compress. The
              second is disclosure — without audited ARR, net revenue retention, and gross margin, the implied multiple
              cannot be pinned, and the conflicting ~$128M versus ~$262M revenue estimates must be reconciled. The third
              is structure — the 2025 recapitalization's preference stack and secondary-versus-primary split determine
              how much of the headline mark is transferable. Final diligence therefore centers on a CFO-level KPI
              package, a reconciliation of the revenue estimates, the term sheet, and customer-concentration data by
              regulated vertical. Those gaps do not break the story; they explain why the disciplined posture is to
              track, request the data room, and upgrade only on proof.
            claimRefs:
              - CV004
              - CV029
