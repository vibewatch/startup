      - number: '7.6'
        title: Mitigation, monitoring, and thesis-break criteria
        blocks:
          - type: paragraph
            body: >-
              The right underwriting conclusion is high residual risk with explicit, monitorable kill criteria rather
              than an immediate thesis break. Egnyte's mitigations are real: compliance certifications and a Data
              Protection Addendum that incorporates standard contractual clauses and CCPA terms, published status and
              incident communications, founder equity rollover for continuity, and a hybrid architecture that supports
              EU data residency. What converts category risk into company-specific impairment is measurable, so the
              monitoring plan tracks discrete triggers. A confirmed breach of production or customer data — as opposed
              to a synthetic QA site — would be thesis-threatening for a trust-based vendor; the loss of a compliance
              certification or a FINRA/SEC recordkeeping finding would undercut the regulated-vertical strategy;
              invalidation of the EU-US Data Privacy Framework without a working fallback would reprice EU exposure;
              sharp renewal price hikes coupled with a churn spike would signal that private-equity monetization is
              damaging retention; accelerating competitive losses to Microsoft 365 or Google Workspace would break the
              growth case; and a founder or co-founder departure before a visible succession plan would raise execution
              risk. Each maps to a diligence ask that a buyer should resolve before committing capital.
            claimRefs:
