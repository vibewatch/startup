      - number: '1.3'
        title: Funding History, Valuation, and Investors
        blocks:
          - type: paragraph
            body: >-
              Egnyte raised approximately $138 million of venture equity across roughly eight rounds before its 2025
              private-equity deal. Early and growth-stage backers included Google Ventures (GV), Polaris Partners,
              Kleiner Perkins, Seagate Technology, Northgate Capital, and Floodgate. After a 2013 Series D of about
              $29.5 million, the company went five years without raising, remaining cash-flow positive from 2016, before
              Goldman Sachs Private Capital Investing led a $75 million Series E in October 2018 — the round most often
              cited as fuel for an eventual IPO that never materialized. The defining capital event came in February
              2025, when private-equity firms GI Partners and TA Associates led a majority growth investment implying a
              valuation of roughly $1.5 billion. The transaction was a recapitalization rather than a full buyout:
              founders, management, and select existing investors including Springcoast, GV, Polaris, and Kleiner
              Perkins retained meaningful minority stakes, and financial terms were not officially disclosed.
              Commentators pegged the deal at roughly 5–6x annual recurring revenue, positioning it as a steady,
              capital-efficient outcome rather than an ultra-premium unicorn exit. Because Egnyte does not publish
              audited financials, exact round-by-round valuations, any debt or credit facilities, and the precise 2025
              deal size remain undisclosed and form a core diligence gap.
