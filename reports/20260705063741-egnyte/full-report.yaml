  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      Egnyte stays at track because genuine scale and current financing are offset by a conflicting revenue base,
      undisclosed terms, and bundling-driven multiple risk.
    approximationNotes: >-
      The flow is qualitative rather than probabilistic and maps the decision chain supported by retained public
      evidence as of 2026-07-05.
    data:
      nodes:
        - id: financing
          label: Current financing signal
          detail: Feb 2025 GI Partners and TA Associates majority recap at a ~$1.5B implied mark
          type: input
        - id: scale
          label: Real operating scale
          detail: 18-year category player with regulated-vertical depth and secondary demand
          type: input
        - id: revenue
          label: Revenue conflict
          detail: GetLatka ~$128M ARR versus Growjo ~$262M revenue implies 11-12x or 5-6x
          type: process
        - id: comps
          label: Comparable discipline
          detail: Public content peers trade 2.3-3.6x revenue in 2026
          type: process
        - id: risk
          label: Competitive and structural risk
          detail: Microsoft/Google bundling and undisclosed preference stack
          type: process
        - id: rec
          label: 'Recommendation: track'
          detail: Fair-to-stretched; upgrade only on audited ARR and clean terms
          type: output
      edges:
        - from: financing
          to: revenue
          label: sets the headline mark
        - from: scale
          to: comps
          label: frames peer multiples
        - from: revenue
          to: risk
          label: multiple hinges on unproven base
        - from: comps
          to: risk
          label: caps defensible multiple
        - from: risk
          to: rec
          label: keeps call at track
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV024
      - CV029
      - CV031
      - CV044
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Value sensitivity shows the $500M ARR re-rate is the biggest upside lever while bundling compression and a
      confirmed low revenue base are the biggest downside levers.
    approximationNotes: >-
      Bars show directional value deltas in USD millions around an illustrative ~$1.5B anchor; they are not additive and
      only illustrate leverage to key underwriting variables.
    data:
      items:
        - label: Reaches ~$500M ARR and re-rates to a growth multiple
          value: 1200
        - label: Multiple re-rate toward premium SaaS on execution
          value: 600
        - label: Regulated-vertical retention premium confirmed
          value: 300
        - label: Microsoft and Google bundling compresses pricing
          value: -500
        - label: Multiple compresses to public-peer ~3x revenue
          value: -700
        - label: Lower ~$128M revenue base confirmed as accurate
          value: -400
    claimRefs:
      - CV004
      - CV007
      - CV024
      - CV027
      - CV037
      - CV044
  - id: FV003
    title: Valuation return range
    type: range
    layout: standard
    summary: >-
      Bear, base, and bull ranges straddle the ~$1.5B entry mark and show the outcome hinges on the revenue conflict and
      bundling pressure.
    approximationNotes: >-
      Ranges are analyst estimates in USD billions based on public comparables and scenario assumptions rather than a
      full DCF or liquidation waterfall.
    data:
      items:
        - label: Bear case valuation
          low: 0.6
          base: 0.8
          high: 1
          unit: $B
        - label: Base case valuation
          low: 1.3
          base: 1.5
          high: 1.8
          unit: $B
        - label: Bull case valuation
          low: 2.4
          base: 3
          high: 3.6
          unit: $B
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV044
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      IC-style scoring supports a 5.5/10 read: solid market position and exit optionality, but weak downside-protection
      clarity and evidence quality.
    approximationNotes: >-
      Scores use a 1-10 editorial scale based on retained public evidence as of 2026-07-05; they are analyst judgments,
      not management-provided KPIs.
    data:
      items:
        - label: Entry discipline score
          value: 5
          unit: /10
          note: Defensible only on the higher revenue estimate; stretched on the lower one.
        - label: Market-position strength
          value: 7
          unit: /10
          note: Deep regulated-vertical niche across AEC, life sciences, and financial services.
        - label: Growth re-rate potential
          value: 6
          unit: /10
          note: A ~$500M ARR ambition exists but the growth pace is unproven publicly.
        - label: Downside protection clarity
          value: 3
          unit: /10
          note: Preference stack and secondary-versus-primary split are undisclosed.
        - label: Comparable-multiple support
          value: 5
          unit: /10
          note: Public content peers trade near 3x versus an 11x headline on the low base.
        - label: Exit optionality
          value: 6
          unit: /10
          note: PE sale, later IPO, and secondary liquidity all remain open paths.
        - label: Evidence quality
          value: 4
          unit: /10
          note: Private company with conflicting third-party revenue estimates.
    claimRefs:
      - CV004
      - CV009
      - CV030
      - CV032
      - CV034
      - CV038
      - CV043
