  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Boundaries
        blocks:
          - type: paragraph
            body: >-
              Egnyte's addressable market sits at the intersection of cloud content management, content collaboration
              (the category Gartner renamed from enterprise file synchronization and sharing to content collaboration
              platforms), and the governance and security layer applied to unstructured corporate content. Included
              spend covers subscriptions for hybrid file collaboration, external file sharing, content services platform
              capabilities, data governance, and content-centric data loss prevention. Excluded spend covers structured
              database and ERP systems, pure consumer cloud storage, and horizontal productivity suites purchased
              primarily for email, chat, or office documents. Adjacent markets include cloud object storage, data
              security posture management, e-signature, e-discovery, and backup. The dominant status-quo substitutes are
              the bundled Microsoft 365 stack (SharePoint and OneDrive), Google Workspace Drive, and legacy on-premises
              file servers or network-attached storage. Egnyte's boundary logic is therefore narrower than the headline
              content-services number: it is the slice of that spend where regulated, distributed teams need one
              governed system of record spanning cloud and on-premises content. Defining this boundary before sizing is
              essential because each analyst lens counts a materially different basket of spend.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
