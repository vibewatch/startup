  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-account and vertical revenue-share data showing whether a small number of customers or a single vertical dominates Egnyte's revenue.
    whyItMatters: Concentration is a core underwriting risk, but Egnyte's headline customer count does not reveal whether revenue is diversified or fragile.
    diligencePath: Request top-ten account exposure, revenue by vertical, and cohort retention before underwriting a follow-on position.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: retention-opacity
    missingEvidence: Disclosed net revenue retention, gross churn, renewal terms, and evidence on whether post-buyout price increases are lifting churn.
    whyItMatters: The durability of Egnyte's subscription base cannot be verified from public evidence, and PE monetization could damage retention.
    diligencePath: Request cohort NRR/GRR, renewal-rate history, and price-increase impact analysis in diligence.
    relatedQuestionRefs:
    - QR031
  - type: private-evidence-only
    severity: material
    topic: leverage-opacity
    missingEvidence: The post-buyout capital structure, including any acquisition debt, covenants, and preference terms from the February 2025 transaction.
    whyItMatters: Undisclosed leverage changes the downside case and the sponsor's incentive to reprice customers or push an exit.
    diligencePath: Request the capitalization table, debt schedule, and covenant package as part of financial diligence.
    relatedQuestionRefs:
    - QR024
  - type: missing-source
    severity: minor
    topic: enforcement-history
    missingEvidence: A complete regulatory and legal register covering any confidential audits, regulator inquiries, or settlements behind the public risk set for the regulatory / legal risk register.
    whyItMatters: The regulatory and legal table is intentionally partial because the public record cannot reveal every private audit, appeal, or contract-level obligation.
    diligencePath: Request the internal compliance register, audit findings, and outside-counsel litigation summaries to convert the table to a diligence-complete register.
    relatedTableRefs:
    - TR001
