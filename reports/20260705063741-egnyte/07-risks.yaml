- id: operational-security-and-reliability-risk
  title: Operational, security, and reliability risk
  body: >-
    As a content-security vendor, Egnyte's franchise depends on trust, which makes security and reliability incidents
    disproportionately damaging. In May 2026 the INC Ransom threat-actor group publicly claimed a breach of Egnyte; the
    company responded that no ransomware was deployed and that the incident was isolated to a quality-assurance test site
    containing only synthetic data, with no customer or production data compromised. That claim is credible but has not
    been independently confirmed, leaving residual uncertainty. Separately, a customer — Fulcrum Real Estate Services —
    disclosed unauthorized access to files stored on its Egnyte platform, a reminder that the shared-responsibility model
    exposes end customers even when the core platform is intact. On reliability, Egnyte suffered a major Secure & Govern
    outage across EU and US regions on June 1, 2026, and an intermittent Web UI (US-East) outage on June 16, 2026; it also
    runs scheduled maintenance windows, and its own help documentation acknowledges recurring desktop-app synchronization
    errors that reviewers repeatedly flag. Underlying all of this is dependence on hyperscaler cloud infrastructure, which
    concentrates availability and blast-radius risk on providers Egnyte does not control. Public sources do not disclose
    durability, RPO, or SLA-credit detail.
  claimRefs:
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  - CR022
