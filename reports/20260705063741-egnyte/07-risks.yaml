- id: partner-and-dependency-risk
  title: Partner and dependency risk
  body: >-
    Egnyte's dependency map is concentrated in a small number of external actors rather than a single hardware supplier.
    Its hybrid architecture rests on hyperscaler cloud platforms (AWS, GCP, Azure), so a provider outage or price change
    propagates directly into Egnyte's availability and cost base. Capital control shifted in February 2025 when GI
    Partners and TA Associates took majority ownership; the same sponsors that funded growth now hold decisive influence
    over pricing, roadmap, and financing, and 2026 leveraged-buyout leverage multiples rebounded toward roughly 5.5–6x
    EBITDA under covenant-lite terms, raising the baseline risk profile of private-equity-owned software. Egnyte reaches
    much of its market through more than a thousand channel partners and managed service providers, whose economics can be
    squeezed if the sponsor prioritizes direct enterprise growth. It also depends on Microsoft and Google as both
    integration surfaces and existential competitors, and on regulators and cross-border transfer frameworks whose rule
    changes can disrupt the value proposition. Key-customer concentration by vertical is undisclosed, a genuine diligence
    gap rather than a confirmed problem.
  claimRefs:
  - CR025
  - CR026
  - CR027
  - CR028
  - CR029
