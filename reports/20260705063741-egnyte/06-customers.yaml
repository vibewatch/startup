callouts:
- calloutType: strength
  title: Named customer proof is production-grade and quantified across verticals
  body: >-
    Egnyte publishes named, executive-endorsed case studies with hard numbers — Yamaha's 100+ TB migration, Balfour
    Beatty's $5M savings and 2,500+ collaborators, Red Bull's 300+ offices, and MOMA Therapeutics' regulated CRO
    collaboration — proof that spans AEC, life sciences, financial services, and media rather than a single vertical.
  claimRefs:
  - CU014
  - CU015
  - CU016
  - CU018
  - CU040
- calloutType: risk
  title: Retention and concentration are entirely undisclosed
  body: >-
    Egnyte publishes no NRR, gross retention, churn, renewal terms, or top-account share, and public customer counts
    even disagree (23,000+ vs TrustRadius's 16,000+). Durability and concentration therefore cannot be underwritten
    from open sources and require cohort-level private diligence.
  claimRefs:
  - CU023
  - CU026
  - CU032
- calloutType: risk
  title: Product and pricing complaints plus channel dependence are the erosion risks
  body: >-
    Reviewers repeatedly flag slow large-file sync, desktop-app limits, and renewal price increases, and customers name
    SharePoint, Dropbox, and Google Drive as alternatives. Combined with heavy reliance on a 1,000+ partner channel,
    these are the subtle risks that logo-and-outcome diligence tends to miss.
  claimRefs:
  - CU034
  - CU036
  - CU037
  - CU028
