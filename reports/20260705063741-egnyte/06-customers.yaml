  - TU003
  figureRefs:
  - FU003
- id: retention-and-durability
  title: Retention, satisfaction, and durability
  body: >-
    Durability is where the public customer case thins out sharply. Egnyte discloses no net revenue retention, gross
    retention, logo churn, renewal rate, or contract length, so investors cannot underwrite customer stickiness from
    open sources. What exists instead are proxies of two kinds. First, satisfaction signals: review-platform scores are
    moderately positive (G2 around 4.4, Capterra around 4.5, and high Gartner Peer Insights marks), which indicate
    contentment but are not retention guarantees. Second, outcome-backed durability proxies: the named case studies
    show cost savings, ransomware recovery, and utilization gains that make renewal plausible because switching away
    from an embedded content platform is costly. To frame the missing metrics, 2026 industry benchmarks put enterprise
    SaaS median NRR near 118%, SMB near 97%, and blended private SaaS near 101%, implying Egnyte's mix-dependent number
    is unknown but likely healthy on the enterprise side and weaker in SMB. The adverse counterweight is that public
    customer counts themselves disagree — the company says 23,000+ while TrustRadius cites 16,000+ — which is a caution
    against treating any single durability proxy as settled. Formal diligence must request cohort NRR/GRR, renewal
    history, and satisfaction instruments (NPS/CSAT) by segment.
  claimRefs:
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU033
  tableRefs:
  - TU004
  figureRefs:
  - FU004
- id: expansion-concentration-and-channel
  title: Expansion, concentration, and channel dependence
  body: >-
    Egnyte's expansion logic is intuitive and visible in its own case studies: customers frequently start by replacing
    a file server or a single-office workflow and then standardize Egnyte enterprise-wide, as Balfour Beatty and Red
    Bull did, and they layer on additional modules such as governance, ransomware detection, and third-party AI
    add-ons (Pure Financial Advisors' LEA integration is a clear ecosystem-led expansion example). Concentration risk
    cuts two ways. On one hand, a fragmented base of 23,000+ SMB-to-enterprise accounts structurally limits dependence
    on any single logo; on the other, Egnyte publishes no top-customer revenue share or account-level ARR, so real
    concentration cannot be measured externally. The most important structural dependence is the channel: Egnyte
    reaches customers through a three-tier partner program built on an Impartner portal with co-selling and deal
    registration, plus a dedicated managed-service-provider motion and an annual MSP Summit serving a community of more
    than 1,000 partners. That distribution leverage accelerates reach but concentrates acquisition and pricing
    influence in partners, and it can complicate direct renewal control. Procurement friction is real too:
    professional-services-heavy deployments and compliance validation in regulated verticals lengthen sales cycles even
    where product fit is strong.
  claimRefs:
  - CU028
  - CU029
  - CU030
  - CU031
  - CU032
  - CU033
  - CU038
  tableRefs:
  - TU005
- id: customer-complaints-and-adverse-signals
  title: Customer complaints and adverse signals
  body: >-
    The adverse customer evidence is concentrated in independent review platforms and centers on product experience,
    pricing, and lock-in rather than mass defection. The most consistent complaint is slow synchronization of large
    files, which surfaces across Capterra, SoftwareAdvice, and aggregated review summaries and matters because large
    files are precisely the AEC and media use cases Egnyte markets to. Reviewers also cite desktop-application
    limitations and Microsoft Office co-editing friction that feels less seamless than Microsoft's native tooling, a
    meaningful risk given Microsoft 365 bundling pressure. On commercials, scattered reviews report unexpected renewal
    price increases and difficulty cancelling or downgrading, with some users saying terms were not clearly disclosed —
    a procurement and trust concern that a private-equity owner focused on monetization could amplify. When customers do
    weigh leaving, the alternatives they name are Microsoft SharePoint, Dropbox, and Google Drive, underlining that
    Egnyte competes against bundled incumbents on both price and integration. None of this evidences a churn crisis, and
    satisfaction scores remain solidly above four out of five, but the pattern — sync performance, desktop friction, and
    renewal-pricing surprises — is exactly the kind of erosion risk that logo-and-outcome diligence tends to miss.
  claimRefs:
  - CU034
  - CU035
  - CU036
  - CU037
  - CU038
