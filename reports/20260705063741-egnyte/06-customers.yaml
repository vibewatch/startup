- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Metric
  - Public value
  - Evidence quality
  - What it means
  - Diligence ask
  rows:
  - - Net revenue retention (NRR)
    - null
    - Low
    - No public NRR disclosure was found
    - Request trailing four-quarter NRR by segment and vertical
  - - Gross retention / logo churn
    - null
    - Low
    - No public GRR or churn disclosure was found
    - Request logo churn, revenue churn, and downgrade history
  - - Contract length / renewal cadence
    - null
    - Low
    - Case studies do not disclose term length or renewal windows
    - Request standard term, notice periods, and renewal rates
  - - Customer satisfaction (review proxy)
    - G2 ~4.4; Capterra ~4.5; Gartner Peer Insights high
    - Medium
    - Positive sentiment, but a proxy for satisfaction, not retention
    - Request NPS/CSAT and formal reference-pool size
  - - Segment NRR benchmark (context)
    - Enterprise ~118%; SMB ~97%; blended ~101%
    - Medium
    - External 2026 SaaS benchmark to frame the missing figure
    - Confirm Egnyte's enterprise/SMB mix to locate its blended NRR
  - - Outcome-backed durability proxy
    - Cost savings, ransomware recovery, utilization gains
    - Medium
    - Makes renewal plausible but is not renewal data
    - Request renewal history for accounts with published outcomes
  notes: >-
    Null means the metric is not publicly disclosed in the reviewed source set; benchmark and review-proxy rows are
