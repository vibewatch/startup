  evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table roster completeness
    missingEvidence: A dated, exhaustive list of Egnyte customers by vertical, size, region, deployment status, and production-versus-reference state.
    whyItMatters: Public sources name only a marketing subset of the 23,000+ base, so adoption breadth and referenceability cannot be fully reconciled from open evidence.
    diligencePath: Request the full customer roster with vertical, seat count, region, launch date, and status, including inactive accounts.
    relatedQuestionRefs:
    - QU013
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics-gap
    missingEvidence: NRR, gross retention, logo churn, renewal rate, contract length, and satisfaction instruments (NPS/CSAT) by segment.
    whyItMatters: The chapter can show strong proof of use and outcomes but cannot underwrite customer durability without actual retention metrics.
    diligencePath: Request customer-cohort retention reporting, renewal history, and account-level expansion timelines by segment.
    relatedQuestionRefs:
    - QU015
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-data-gap
    missingEvidence: Top-customer revenue share, account-level ARR, and net-dollar concentration thresholds.
    whyItMatters: A small number of large accounts could dominate revenue undetected, but public sources do not quantify concentration.
    diligencePath: Request the top-10 customer list with revenue share, seat share, and net-dollar concentration.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: channel-revenue-share-gap
    missingEvidence: The share of Egnyte revenue sourced or influenced by channel partners and MSPs versus direct sales.
    whyItMatters: Heavy channel dependence concentrates acquisition and pricing influence and can complicate direct renewal control.
    diligencePath: Request partner-sourced vs direct revenue split, deal-registration coverage, and renewal ownership by channel.
    relatedQuestionRefs:
    - QU026
    relatedTableRefs:
    - TU005
  - type: conflicting-data
    severity: minor
    topic: customer-count-discrepancy
    missingEvidence: A reconciliation of the 23,000+ company figure against the 16,000+ count published on TrustRadius.
    whyItMatters: Inconsistent public customer counts undermine confidence in any single adoption or scale claim.
    diligencePath: Request the current audited active-account count and the definition and vintage behind each published figure.
    relatedQuestionRefs:
    - QU018
    relatedTableRefs:
    - TU002
