    - High-value regulated segment with strong compliance lock-in
    - MOMA Therapeutics
    - Few individually named production case studies are public
  - - Financial services
    - Buyer = IT and compliance; users = advisors and planners; payer = firm operating budget
    - Secure client-document workflows and regulatory data governance
    - Regulated, document-intensive accounts with AI-automation upside
    - Pure Financial Advisors, Bay Point Advisors
    - No disclosed ARR or seat counts by vertical
  - - Media, entertainment, and brands
    - Buyer = IT; users = creative and marketing teams; payer = enterprise IT budget
    - Large multimedia-asset collaboration and controlled external sharing
    - Marquee brand logos that validate scale and reliability
    - Yamaha, Red Bull
    - Some media users report file-size and large-file sync limits
  - - Legal and professional services
    - Buyer = IT / managing partners; users = attorneys and staff; payer = firm budget
    - Governed document management and secure client collaboration
    - Steady regulated demand but lower public visibility
    - Lutz, Bobo & Telfair, P.A.
    - Thin published legal-vertical case evidence
  - - Manufacturing and other
    - Buyer = IT / operations; users = distributed operational teams; payer = enterprise IT budget
    - Hybrid file access and content governance across sites
    - Broadens the base beyond core verticals
    - MP Materials, Tarkett Sports
    - Deployment depth per account is not public
  notes: >-
    Rows are derived from Egnyte's own industry pages plus third-party account-tracking data; strategic value reflects
    analytical judgment of importance to Egnyte, not disclosed contract size, and named examples are illustrative not
