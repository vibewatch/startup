- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / friction risk
  - Impact
  - Current public signal
  - Diligence path
  rows:
  - - File-server replacement to enterprise-wide standardization
    - Value depends on repeatable land-and-expand across sites
    - Grows seat count and wallet share within an account
    - Balfour Beatty and Red Bull standardized enterprise-wide after initial deployments
    - Request seat-expansion and site-rollout cohorts by account
  - - Module upsell (governance, ransomware, AI)
    - Attach rates and AI monetization are unproven publicly
    - Raises ARR per account without new logo acquisition
    - Egnyte markets governance, ransomware detection, and AI add-ons on the same platform
    - Request module attach rate and AI add-on adoption by cohort
  - - Ecosystem / partner AI add-ons
    - Third-party dependence can dilute Egnyte's share of value
    - Extends use cases and stickiness inside accounts
    - Pure Financial Advisors layered the LEA AI partner onto Egnyte
    - Request revenue split and dependency map for ecosystem add-ons
  - - Channel and MSP distribution
    - Partners can own the customer relationship and pricing
    - Accelerates reach but concentrates acquisition influence
    - Egnyte reports 1,000+ partners on a three-tier Impartner-based program
    - Request partner-sourced revenue share and direct-vs-channel renewal control
  - - Top-account concentration (unknown)
    - A few large accounts could dominate revenue undetected
    - Undisclosed concentration is an underwriting blind spot
    - Egnyte publishes no top-customer revenue share or account ARR
    - Request top-10 account revenue share and net-dollar concentration
  - - Procurement and compliance friction
    - Long, services-heavy cycles slow expansion
    - Can make growth lumpy despite strong product fit
    - Regulated verticals require GxP/21 CFR Part 11 validation and professional services
    - Request average sales cycle, implementation time, and services attach
  notes: >-
    This table separates plausible expansion levers from the frictions that can throttle them; impacts are analytical
    judgments rather than disclosed management figures, and null-signal rows mark data Egnyte does not publish.
