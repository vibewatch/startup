  - - AEC and construction
    - Buyer = IT / technology leadership; users = project teams and subcontractors; payer = IT and project budgets
    - Massive-file collaboration and hybrid file-server replacement across dispersed jobsites
    - Flagship vertical with the deepest public case-study evidence
    - Balfour Beatty, Choate Construction, KL Engineering, Skyline Construction
    - No public revenue or account split by vertical
  - - Life sciences (pharma / biotech)
    - Buyer = IT and quality leadership; users = research staff and CRO partners; payer = R&D / IT budgets
