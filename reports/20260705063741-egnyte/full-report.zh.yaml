      - number: '8.5'
        title: 退出就绪度、打破论点因素与最终尽调
        blocks:
          - type: paragraph
            body: >-
              Egnyte 今天还没有 IPO 就绪，管理层也没有释放即将上市的信号；中期最可能的退出，是由私募股权推动的战略出售，或等 $500M ARR 里程碑更近后进入后周期
              IPO，同时二级市场已经为早期持有人提供部分流动性。从跟踪升级到买入，取决于证据。第一项打破论点条件是竞争：如果 Microsoft 和 Google 套件化加速商品化，Egnyte
              的增长和倍数会同时被压缩。第二项是披露：没有经审计 ARR、净收入留存和毛利率，就无法钉住隐含倍数；约 $128M 与约 $262M 的冲突收入估算也必须对齐。第三项是结构：2025
              年资本重组中的优先权结构以及二级 / 一级资金拆分，决定头部估值有多少可以转移给新买方。因此最终尽调应围绕 CFO 级 KPI
              包、收入估算对账、条款清单，以及按受监管垂直行业拆分的客户集中度数据展开。这些缺口不打破故事；它们解释了为什么有纪律的姿态是跟踪、索取数据室，并且只在证据出现后上调判断。
