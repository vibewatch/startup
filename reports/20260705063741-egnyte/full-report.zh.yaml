      - number: '5.5'
        title: 信任、安全与合规
        blocks:
          - type: paragraph
            body: >-
              信任是 Egnyte 公开材料中写得最充分的一维，这也符合它面向受监管买家的定位。其信息安全管理体系通过 ISO/IEC 27001:2022 认证，并发布独立 SOC 2 SSAE 18 Type 2
              鉴证。合规覆盖面明确延伸到保护健康信息的 HIPAA、欧盟数据保护的 GDPR、Cyber Essentials、国防供应链的 CMMC/NIST 800-171、金融记录保存的 FINRA 和 SEC Rule
              17a-4，以及生命科学的 GxP / 21 CFR Part 11。管理控制包括可配置认证、密码和锁定策略、MFA、离线访问控制、审计日志；2026 年 AI Safeguards
              层又加上细粒度、可审计的控制，限定 AI 可以触达哪些用户、组、文件和位置，直接回应企业生成式 AI 的「黑箱」质疑。尽调里还有两个重要缺口。第一，Egnyte 的公开合规页面未列出 FedRAMP
              授权，联邦云就绪度不清楚，需要直接确认。第二，Egnyte 发布了实时状态页，也披露了 2026 年 5 月一次多区域性能下降事件，但没有公布合同化正常运行时间 SLA
              或可靠性指标，因此量化可靠性必须在尽调中索取。
