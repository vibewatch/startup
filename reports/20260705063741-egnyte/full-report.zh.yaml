              IT、技术或合规负责人；日常用户是项目团队、临床和研究人员、顾问、律师，以及 CRO、分包商和客户等外部伙伴；付款方则是组织的 IT 或项目预算。客户从 50 人以下的小公司到 1,000–5,000+
