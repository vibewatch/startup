      - number: '3.2'
        title: 竞争者画像：规模、融资与方向
        blocks:
          - type: paragraph
            body: >-
              竞争集合横跨超大规模平台和聚焦型专业厂商，融资与规模决定了各自定价和投入的激进程度。Microsoft 和 Google 是万亿美元级平台所有者，将存储与协作折入 Microsoft 365 和
              Workspace，用套件经济补贴内容功能。Box 报告 2026 财年收入约 $1.18B，年增长约 8%，付费组织超过 100,000 家，其中包括大量 Fortune 500，并在推进 AI 驱动的
              Enterprise Advanced 层级。Dropbox 同样上市，货币化数千万用户，正上移到团队治理，同时守住以简单性为核心的品牌。专业厂商中，iManage 服务超过 4,000 家组织和 100
              多万法律及专业服务用户，估计收入约 ~$257M，处于创始人和私募股权所有权下；Veeva Vault 以专业上市公司形态主导生命科学受监管内容；Autodesk 是 AEC
              文档控制领域的头部施工软件厂商之一；Citrix ShareFile、Nextcloud 和 DocuWare 分别覆盖安全交换、自托管开源和文档自动化。相对于 Box 的 100,000+ 家组织，Egnyte
              的安装基础大约小一个数量级，因此它是聚焦中端市场和受监管垂直行业的挑战者，而非横向既有厂商；与上市的 Box、Dropbox 和 Veeva 不同，Egnyte 是受私募股权控制的私人公司。
