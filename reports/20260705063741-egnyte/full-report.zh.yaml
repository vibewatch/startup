  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流、定价与货币化
        blocks:
          - type: paragraph
            body: >-
              Egnyte 的收入几乎全部来自 Content Cloud 平台的经常性订阅，按席位、按年合约销售，而不是按使用量或交易量收费。公开标价横跨五个层级——Team 每用户 / 月 $10，Business
              $22，Enterprise Lite $39，Elite $48，以及定制报价的 Ultimate / Enterprise 层级——存储、治理、威胁检测和 AI
              能力随层级解锁。货币化在席位价格之上继续叠加：面向生命科学（GxP / 21 CFR Part 11）、AEC 和金融服务的垂直包，以及 Egnyte Copilot
              AI、DLP、电子发现、额外存储等插件；采购顾问称这些项目可让年度合同增加 20-40%。实际价格与标价差异明显：采购来源报告，典型合同约每年 $15,000-$75,000，中位数接近
              $37,000，大买家可谈下 9-30% 折扣，因此标价高估了净席位经济性。公司覆盖很宽的交易规模带——从低于 $10K 的自助 SMB 交易，到超过 $1M 的企业协议——支撑多路径销售。Egnyte
              不公开按层级、垂直行业或地域拆分收入，因此 Team/Business SMB 席位和高 ACV 受监管行业企业账户之间的组合仍是估算题，而非披露事实。
