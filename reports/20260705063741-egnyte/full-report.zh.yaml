      - number: '3.5'
        title: 转换成本、锁定与分销力
        blocks:
          - type: paragraph
            body: >-
              Egnyte 面临的转换成本和分销力方向相反。防守侧，一旦组织把 Egnyte 映射为混合文件系统，嵌入 AEC
              或生命科学工作流，并积累带留存和权限结构的受治理数据，数据重力和重新授权会让迁移变慢且成本高，从而提高留存。深度垂直集成和合规配置会在受监管细分市场进一步加深锁定。进攻侧，分销力却偏向既有厂商：Microsoft
              和 Google 靠预装、预付费套件和企业协议触达同一批买家，并能以近零增量价格打包新的 AI 和治理功能，这种渠道优势 Egnyte 难以匹配。多平台并用很常见，Egnyte 经常与 Microsoft 365
              并行部署，而非替代它，这限制了钱包份额。Egnyte 的反向分销杠杆是 MSP 与经销商渠道，以及 AEC
              和生命科学里的垂直伙伴生态，但这些杠杆窄于超大规模厂商的安装基础。实际结果是，单账户粘性强，但漏斗顶部分销弱于打包平台。
            claimRefs:
              - CP032
              - CP033
              - CP034
              - CP035
              - CP036
              - CP037
