      - number: '2.5'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求侧驱动很强。企业非结构化内容量持续复合增长；混合与分布式工作已经常态化；勒索软件和数据外泄风险把治理推上 IT 议程；各行业监管范围扩大；新一波需求聚焦生成式 AI 如何触碰敏感内容，Egnyte 在
              2026 年用 AI Safeguards 和内嵌 AI Assistant 回应了这一点。顺风之下也有真实约束。最严峻的是 Microsoft 365 和 Google Workspace
              的商品化压力；它们以很低的边际成本打包 SharePoint、OneDrive 和
              Drive，并缩小了基础文件共享功能差距，迫使独立厂商沿价值链上移，转向垂直合规和治理。转换成本和既有地位双向作用：保护已安装厂商，也拖慢新替换。本地到云端的惯性在保守行业拉长销售周期，宏观 IT
              预算审查则提高了单点解决方案门槛。净结果是市场结构性增长，但专业厂商必须不断证明自己比「够用」的打包替代品更值溢价；每个驱动因素都要绑定具体预算所有者和采用触发点，而不能只泛泛宣称市场很大。
