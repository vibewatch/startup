      - number: '6.4'
        title: 留存、满意度与耐久性
        blocks:
          - type: paragraph
            body: >-
              公开客户案例在耐久性这一项上明显变薄。Egnyte
              不披露净收入留存、总留存、客户流失、续约率或合同期限，投资人无法仅靠公开来源判断客户粘性。现有材料只提供两类代理指标。第一类是满意度信号：评论平台评分中等偏正面（G2 约 4.4，Capterra 约
              4.5，Gartner Peer Insights
              分数也高），说明客户大体满意，但不是留存保证。第二类是有结果支撑的耐久性代理：具名案例显示成本节省、勒索软件恢复和使用率提升，让续约变得合理，因为从一个已经嵌入的内容平台迁出成本很高。为了给缺失指标定框，2026
              年行业基准显示，企业 SaaS NRR 中位数约 118%，SMB 约 97%，混合型私人 SaaS 约 101%；这意味着 Egnyte 的数字取决于客群结构，外部并不知道，但企业端可能健康，SMB
              端较弱。反向证据是公开客户数量本身不一致——公司称 23,000+，TrustRadius 写 16,000+——提醒尽调不能把任何单一耐久性代理当成定论。正式尽调必须按分层索取分群
              NRR/GRR、续约历史和满意度工具（NPS/CSAT）。
