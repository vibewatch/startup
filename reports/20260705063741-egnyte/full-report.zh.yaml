chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、创立与商业模式
        blocks:
          - type: paragraph
            body: >-
              Egnyte, Inc. 是一家总部位于加利福尼亚 Mountain View 的云内容管理、协作和数据治理公司，并在华盛顿州 Spokane 设有工程中心。公司由 Vineet Jain 与联合创始人
              Rajesh Ram、Amrit Jassal、Kris Lahiri 于 2007 年创立；近二十年后仍为私人持股，并由创始人领导。Egnyte 销售一个统一平台，并将其称为「Content
              Cloud」——这套 AI 驱动系统把文件协作（Egnyte Connect）、数据安全与治理（Egnyte Protect）和生成式 AI 能力（Egnyte Copilot）放在一起。Connect
              产品设计成像本地文件服务器一样工作，同时同步到云端，支持受监管行业偏好的本地与云混合部署。商业模式是订阅式 SaaS，按用户和套餐层级销售，企业定价定制；公开入门价格约每用户每月 $8–$10，治理和 AI
              功能会显著抬高价格。Egnyte 面向建筑、工程与施工、生命科学、金融服务、媒体和法律等受监管垂直行业的中端市场和企业级买家，并接入 Microsoft 365、Google Workspace、Slack 和
              Salesforce。公司竞争对手包括 Microsoft SharePoint 与 OneDrive、Google Drive、Box 和 Dropbox。
