    title: 投资逻辑破裂与否决触发因素表
    columns:
      - 触发因素
      - 阈值
      - 对投资逻辑的传导
      - 操作含义
    rows:
      - - 捆绑驱动的商品化
        - Microsoft / Google 明显压低内容协作定价或抢走份额
        - 增长和退出倍数同时压缩
        - 把公允价值重设到上市同业 ~3x 附近并持有观望
      - - 收入冲突落向低值
        - 经审计数据确认收入更接近 ~$128M 估计，而不是 ~$262M
        - 隐含入场倍数转入明显偏高区间
        - 不要在 2025 标记或更高价格追加资本
      - - 厚重优先股堆叠
        - 资本重组披露叠加清算优先权或棘轮条款
        - 表面企业价值高估了可转让普通股价值
        - 将该标记视为结构性虚高
      - - 留存或流失恶化
        - 受监管垂直行业的净收入留存跌破扩张水平
        - 投资逻辑中的韧性支柱被削弱
        - 施加韧性折价，或转为放弃
      - - 退出窗口关闭
        - IPO 市场持续关闭，战略买家对内容资产的兴趣降温
        - 流动性时间表拉长，IRR 被侵蚀
        - 要求更低入场价来补偿流动性不足
    notes: 这些触发因素是可监测的尽调阈值，把一个私有且不透明的故事转成明确的推进 / 否决条件；阈值由分析师设定，并非公司披露。
    claimRefs:
      - CV006
      - CV018
      - CV024
      - CV029
      - CV037
      - CV043
      - CV044
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
      - 安心阈值
    rows:
      - - 经审计 ARR 与增长
        - 经审计 ARR、同比增长，以及 ~$128M 与 ~$262M 两组估计的调和
        - 收入基数未定，就无法支撑入场倍数
        - CFO 数据包加审计师确认
        - 一个可辩护的收入数字，且落在可支撑的倍数区间内
      - - 净收入留存与利润率
        - 按细分披露的净收入留存、毛利率和贡献利润率
        - 区分业务韧性与表面规模
        - 财务与运营审查
        - 留存高于扩张阈值，毛利率健康
      - - 融资结构
        - 清算优先权、棘轮条款，以及 2025 年交易中新股与老股比例
        - 表面标记可能高估普通股可转让价值
        - 由律师主导审查股权结构表和条款清单
        - 结构足够干净，表面企业价值才可信
      - - 客户集中度
        - 按受监管垂直行业划分的收入占比，以及头部客户集中度
        - 直接检验韧性逻辑和捆绑风险敞口
        - 收入分析和客户背调电话
        - 没有单一垂直行业或账户主导经济性
      - - 竞争赢单率
        - 相对 Microsoft 365 和 Google Workspace 捆绑套件的赢 / 输与定价数据
        - 直接检验商品化反向逻辑
        - 销售与产品审查
        - 有证据显示定价权持久、赢单率稳定
      - - 退出与流动性计划
        - PE 资方持有期限、IPO 准备度和老股政策
        - 决定现实可行的回报时点与路径
        - 资方与董事会材料审查
        - 一份可信且绑定里程碑的流动性计划
    notes: 尽调问题按对投资测算质量的影响排序；每一项都对应可监测阈值，而不是管理层最容易提供的材料。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV038
      - CV042
      - CV043
      - CV044
      - CV045
