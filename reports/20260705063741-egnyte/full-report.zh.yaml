      - number: '1.3'
        title: 融资历史、估值与投资者
        blocks:
          - type: paragraph
            body: >-
              2025 年私募股权交易前，Egnyte 约 8 轮获得大约 $138M 风险股权。早期和成长期支持方包括 Google Ventures（GV）、Polaris Partners、Kleiner
              Perkins、Seagate Technology、Northgate Capital 和 Floodgate。2013 年约 $29.5M Series D 之后，公司五年没有融资，并从 2016
              年起保持现金流转正；直到 2018 年 10 月 Goldman Sachs Private Capital Investing 领投 $75M Series E——这轮融资最常被视为最终 IPO 的燃料，但
              IPO 并未发生。决定性的资本事件出现在 2025 年 2 月，私募股权公司 GI Partners 与 TA Associates 领投多数股权成长投资，隐含估值约
              $1.5B。这是一场资本重组，而非完整收购：创始人、管理层以及 Springcoast、GV、Polaris、Kleiner Perkins
              等部分既有投资者保留了有意义的少数股权，财务条款未获官方披露。评论者将该交易估在年经常性收入的约 5–6x，显示它是一个稳健、资本效率高的结果，而非超高溢价独角兽退出。由于 Egnyte
              不发布审计财务，逐轮准确估值、任何债务或信贷安排，以及 2025 年交易精确规模仍未披露，构成核心尽调缺口。
