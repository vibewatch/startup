  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              Egnyte 的可服务市场位于云内容管理、内容协作（Gartner
              将企业文件同步与共享更名为内容协作平台的类别），以及施加在企业非结构化内容上的治理与安全层三者交叉处。纳入的支出包括混合文件协作、外部文件共享、内容服务平台能力、数据治理，以及以内容为中心的数据丢失防护订阅。排除的支出包括结构化数据库和
              ERP 系统、纯消费者云存储，以及主要为邮箱、聊天或办公文档购买的横向生产力套件。相邻市场包括云对象存储、数据安全姿态管理、电子签名、电子发现和备份。主导性的现状替代品是打包的 Microsoft 365
              堆栈（SharePoint 和 OneDrive）、Google Workspace Drive，以及传统本地文件服务器或网络附加存储。因此，Egnyte
              的边界逻辑比泛称的内容服务市场规模更窄：它针对的是那部分支出，即受监管、分布式团队需要一个横跨云端和本地内容的受治理记录系统。先定义边界再估算规模至关重要，因为每个分析师视角计入的支出篮子都明显不同。
