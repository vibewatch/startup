      - number: '4.2'
        title: GTM 效率与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Egnyte 的获客与销售结合低成本内勤销售、垂直行业现场销售、伙伴 / 经销商渠道和自助服务；创始人认为正是这套结构让公司用适度风险资金做到九位数 ARR。由于公司不披露
              CAC、回收期、净收入留存率和毛利率，单位经济只能靠代理指标交叉推断。最强锚点是资本效率：Egnyte 用约 $138M 累计风险股权做到估计 $100M 以及后来 $200M+
              ARR，相比风险融资内容协作同行，烧钱倍数异常低；公司还称自己自 2016 年起现金流转正。席位贡献取决于混合净价格（折扣后低于 $22-$48
              标价）对云托管、混合「Turbo」缓存、支持和渠道利润成本的关系；对照上市内容平台，这意味着软件毛利健康，但未必是同类最佳。留存信号是间接的：向受监管垂直行业扩张、23,000+
              账户、先落地再扩张的插件销售都指向扎实的净留存；但负面评测提到续约涨价和取消困难，可能压迫小客户留存。因此，从资本效率看，销售效率结构性健康；但在承保真正需要的 CAC / 回收期和 NRR 视角上，仍无法验证。
