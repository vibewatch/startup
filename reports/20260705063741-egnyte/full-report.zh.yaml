      - number: '5.3'
        title: 架构、部署与集成
        blocks:
          - type: paragraph
            body: >-
              Egnyte 的技术底座，是一个共享的集中式内容库，外面包着治理、智能和集成层。它最关键的架构选择是混合部署：企业保留本地缓存 / 设备，让热点数据能快速本地访问；权威副本和元数据同步到 Egnyte
              云端，而云端本身也可横跨多个公有云，以满足数据驻留和韧性要求。这种「控制数据存放位置」的能力，是金融服务、医疗和欧盟等受监管客户采用它的原因。围绕内容库，Egnyte
              开放了公共开发者界面：developers.egnyte.com 的开发者门户、要求注册 OAuth 应用的文档化 REST API，以及官方维护的 Python 和 JavaScript
              SDK，合作伙伴用这些能力构建集成。开箱即用的连接器把内容库接到 Microsoft 365、Google Workspace、Slack、Salesforce 和 Autodesk Construction
              Cloud；Microsoft 365 Copilot 连接器则把 Egnyte 文件索引进 Microsoft Search。2026 年新增的开放标准 Model Context
              Protocol（MCP）服务器和 AI Safeguards，让 ChatGPT、Claude、Microsoft Copilot 等外部 AI 助手可以实时查询 Egnyte
              内容，无需复制或重新索引；每次请求仍执行 Egnyte 既有权限模型。
