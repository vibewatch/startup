      - number: '8.2'
        title: 当前融资背景与进入纪律
        blocks:
          - type: paragraph
            body: >-
              估值的核心问题，是约 $1.5B 的标记到底克制还是慷慨；诚实答案是，公开证据无法定论。如果按 GetLatka 约 $128M ARR 估算，这笔交易约等于 11-12x
              收入，对一家稳定、十几个百分点增长的复合型软件公司而言很难辩护。如果按 Growjo 约 $262M 收入估算，同一估值只有约 5-6x，对照 2026
              年软件可比公司仍说得过去。真实数字几乎肯定落在中间，但区间足够宽，进入纪律要求把倍数当成范围而非点估计。两个结构性事实进一步强化谨慎。第一，交易是带有大量二级出售成分的资本重组，因此如果优先权结构层层叠加，头部企业价值可能高估新普通股买方可获得的转让价值。第二，Egnyte
              私人二级市场股份已明显升值——PM Insights 报告自 2024 年 8 月以来约涨 83%，Forge 列出的指示性买价接近每股 $20——这说明有需求，也说明进入已经不便宜。
