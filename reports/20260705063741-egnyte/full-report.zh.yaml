      - number: '2.2'
        title: 多视角市场规模估算
        blocks:
          - type: paragraph
            body: >-
              单一数字无法概括 Egnyte 的机会，因此我们用五个视角校准 2026 年市场。广义企业内容管理市场估计在 $44.29B（Mordor Intelligence）到 $76.42B（Global Growth
              Insights）之间，Fortune Business Insights 和 MarketsandMarkets 给出的中位读数约 $57-60B。更宽的内容服务平台市场更大，Precedence
              Research 和 The Business Research Company 认为 2026 年约 $88-93B。最接近 Egnyte 核心的内容协作 / EFSS 市场小得多，约 $15.7B（GMI
              Insights）到 $19.3B（MarketsandMarkets）。两个治理相邻市场体现安全拉力：数据治理约 $6.3-6.8B，以内容为中心的数据丢失防护约 $4.1-4.7B，两者 CAGR 均高于
              22%。套用 TAM/SAM/SOM 视角，我们将内容服务平台（~$93B）视为 TAM，受监管中端市场内容协作加治理（~$20B）视为 SAM，近期可触达的受监管内容云支出（~$3B）视为
              SOM。相较之下，Egnyte 约 $128M 的收入足迹意味着它在内容服务 TAM 中远低于 1%，这说明扩张跑道仍长，而不是市场已饱和。
