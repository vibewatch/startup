      - number: '4.3'
        title: 成本结构、毛利驱动因素与可比公司
        blocks:
          - type: paragraph
            body: >-
              Egnyte 没有披露 P&L，因此成本结构最好对照 Box——云内容管理中最接近的上市纯软件公司。2026 财年，Box 报告收入约 $1.18B，增长约 8-9%，non-GAAP 毛利率约
              82%，non-GAAP 经营利润率约 28%；这为成熟订阅内容平台可赚取的水平提供了有用上限。Egnyte
              的毛利驱动因素相似：云基础设施和存储、混合边缘缓存设备、客户支持、安全与合规工具，以及第三方集成维护。两个结构性差异可能把 Egnyte 的利润率拉到 Box 之下。第一，Egnyte 的混合本地 / Turbo
              架构和重度受监管垂直支持，使每席位服务交付和基础设施成本高于纯云同行。第二，有意义的渠道 / 经销商分销把一部分毛利让给伙伴。抵消这些因素的是，Egnyte
              绝对规模较小且坚持「盈利增长」姿态——公司公开目标是在保持现金生成的同时达到 $500M ARR——这暗示其经营利润率为正，而不是成长期 SaaS 常见的深度亏损。净判断是，毛利率可能在 70% 出头至中段到
              80% 出头，经营 / 自由现金流利润率小幅为正；但这里每个数字都由可比公司推导，并非 Egnyte 披露，尽调中应与审计报表核对。
