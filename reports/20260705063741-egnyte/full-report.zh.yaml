  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Egnyte 有意进入高度受监管垂直行业，这个销售打法选择把客户的合规义务转化为 Egnyte 自身的运营和合同风险。生命科学客户依赖平台协助满足 FDA 21 CFR Part 11
              对电子记录和电子签名的控制要求，包括审计轨迹和验证；金融服务 broker-dealer 依赖它依据 SEC Rule 17a-4 和 FINRA Rule
              4511，把账簿和记录至少保存六年，并采用不可重写（WORM）或获批审计轨迹形式。隐私方面，GDPR 限制欧盟个人数据在缺少充分性决定或标准合同条款等保障时转出 EEA（Article 44），并要求在 72
              小时内向监管机构通报数据泄露（Article 33）；HIPAA 要求 Egnyte 作为 business associate 保护 ePHI 并在泄露时通知；CCPA/CPRA
              则赋予加州消费者公司必须兑现的权利。EU-US Data Privacy Framework 支撑合法跨大西洋传输，但仍可能遭遇法律挑战，这是活的传输风险。Egnyte
              也反复成为文件同步专利诉讼目标——Topia Technology 的主张挺过了早期无效挑战，Data Resonance 的诉讼以约定驳回结束——会持续分散法律成本。公开来源截至 2026-07-05
              未发现针对 Egnyte 本身的重大监管执法或罚款。
