companyProfile:
  summary: >-
    Egnyte 是一家位于加利福尼亚 Mountain View 的企业软件公司，成立于 2007 年，运营「Content Cloud」。该平台把安全文件协作、数据治理与安全，以及基于客户非结构化内容的生成式 AI
    统一起来。同代公司中，Egnyte 不常见的一点是盈利且资本效率高：终身风险股权融资约 $138M，2016 年就实现现金流转正。2025 年 2 月，私募股权公司 GI Partners 与 TA Associates
    领投多数股权投资，隐含估值约 $1.5B；创始人、管理层和现有投资者保留重要少数股权。Egnyte 服务 112 个国家的 23,000+ 家企业，在建筑 / 工程 / 施工、生命科学、金融服务等受监管且文档密集的垂直行业优势集中。
