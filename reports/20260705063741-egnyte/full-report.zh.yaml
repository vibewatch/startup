        - Pure Financial Advisors、Bay Point Advisors 等案例
        - 未披露按垂直行业拆分的 ARR 或席位数
      - - 媒体、娱乐和品牌
        - 买方 = IT；用户 = 创意和营销团队；付款方 = 企业 IT 预算
        - 大型多媒体资产协作和受控外部共享
        - 头部品牌 Logo 验证规模和可靠性
        - Yamaha、Red Bull
        - 部分媒体用户反馈文件大小和大文件同步限制
