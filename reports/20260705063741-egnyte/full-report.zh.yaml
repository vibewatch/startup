      - number: '6.5'
        title: 扩张、集中度与渠道依赖
        blocks:
          - type: paragraph
            body: >-
              Egnyte 的扩张逻辑直观，也能在自家案例中看到：客户常从替换文件服务器或单办公室工作流开始，随后像 Balfour Beatty 和 Red Bull 一样在企业范围内标准化
              Egnyte，并叠加治理、勒索软件检测、第三方 AI 插件等模块（Pure Financial Advisors 的 LEA 集成就是清晰的生态驱动扩张案例）。集中度风险有两面。一方面，23,000+ 个 SMB
              到企业账户构成分散客户基础，结构上限制了对单一客户的依赖；另一方面，Egnyte 不披露头部客户收入占比或账户级 ARR，真实集中度无法从外部衡量。最重要的结构性依赖是渠道：Egnyte
              通过三层合作伙伴计划触达客户，该计划基于 Impartner 门户，包含联合销售和商机注册；公司还设有专门的托管服务提供商打法，并举办年度 MSP Summit，服务超过 1,000
              家合作伙伴的社区。这种分销杠杆扩大触达，但也把获客和定价影响力集中到合作伙伴手里，并可能让直接续约控制更复杂。采购摩擦同样真实：专业服务占比高的部署，以及受监管垂直行业里的合规验证，即便产品契合也会拉长销售周期。
