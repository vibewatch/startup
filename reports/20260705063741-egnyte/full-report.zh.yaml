      - number: '4.6'
        title: 财务结论：收入质量、利润率路径与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              收入质量上，Egnyte
              得分较高：收入经常性、基于订阅、年度合约化，分散在数万账户和多个受监管垂直行业中，并由粘性强的治理和合规工作流锚定，抵御拔除替换。利润率路径上，可比公司读数偏正面——成熟内容平台同行毛利率约
              ~82%、经营利润率约 ~28%，Egnyte 现金流转正且资本效率高的历史说明它可能盈利运营，即便因混合架构和渠道组合，毛利率可能比 Box
              低几个点。资本强度上，业务较轻：软件交付只需要适度边缘硬件，没有重资本开支或库存，主要由运营资金而非连续稀释支撑。决定性弱点是披露。审计收入、增长、毛利率、NRR、CAC / 回收期、现金和烧钱均缺失；公开
              ARR 又有两倍冲突，PE 交易条款也从未发布，这意味着投资案例依赖估计和可比公司。负面信号（续约涨价投诉、取消困难，以及约 ~5-6x ARR 的「稳健但非溢价」PE 倍数）压低了增长叙事。结论：Egnyte
              是一家财务健康、资本效率高的私人复利型公司，质量可信，但从外部无法审计精确经济性；任何估值或承保结论都以数据室访问为门槛。
