  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块图谱
        blocks:
          - type: paragraph
            body: >-
              Egnyte 将自己定位为「AI 驱动的 Content Cloud」，但从客户工作流看，它最好被理解为一个受治理的存储库；企业可以把所有内容密集型任务指向它，而不是拼接文件共享、安全和 AI
              工具。官方产品矩阵把产品分成五个支柱：协作、智能、治理、平台和集成。协作（历史品牌为 Egnyte
              Connect）让分布式团队在办公室、家中或现场处理关键任务文件，提供桌面、网页和移动访问，体验像熟悉的共享盘。治理（Secure & Govern / Protect
              模块）在同一内容之上叠加敏感数据发现、分类、勒索软件检测、权限监控和多云数据管理。智能（Copilot / AI Assistant）把生成式 AI
              应用到这些私有且带权限的内容上，用于摘要、知识库问答和提取。三大支柱都在同一权限模型下读写同一个存储库，因此 Egnyte 能把协作和治理包装成统一采购，而不是外挂功能——这正是它相对单点工具的差异化核心。
