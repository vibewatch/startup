        - id: financing
          label: 当前融资信号
          detail: 2025 年 2 月，GI Partners 与 TA Associates 完成多数股权资本重组，隐含估值约 $1.5B
          type: input
        - id: scale
          label: 真实运营规模
          detail: 深耕 18 年的品类玩家，在受监管垂直行业有深度，也有二级市场需求
          type: input
        - id: revenue
          label: 收入冲突
          detail: GetLatka 约 $128M ARR，对比 Growjo 约 $262M 收入，对应 11-12x 或 5-6x
          type: process
        - id: comps
          label: 可比公司约束
          detail: 2026 年，上市内容管理同业交易在收入的 2.3-3.6x
          type: process
        - id: risk
          label: 竞争与结构风险
          detail: Microsoft / Google 打包，以及未披露的优先权堆栈
          type: process
        - id: rec
          label: 建议：继续跟踪
          detail: 合理到偏紧；只有审计 ARR 和干净条款落地才上调
          type: output
      edges:
        - from: financing
          to: revenue
          label: 定下表面估值锚
        - from: scale
          to: comps
          label: 框定同业倍数
        - from: revenue
          to: risk
          label: 倍数取决于未证实基数
        - from: comps
          to: risk
          label: 压住可辩护倍数
        - from: risk
          to: rec
          label: 让结论维持跟踪
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV024
      - CV029
      - CV031
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 估值敏感性显示，ARR 达到 $500M 后重估是最大的上行杠杆；打包竞争压缩和低收入基数被证实，是最大的下行杠杆。
    approximationNotes: 条形展示以示意性的 ~$1.5B 锚点为中心、按百万美元计的方向性价值变化；它们不能相加，只说明关键投资承销变量的杠杆。
    data:
      items:
        - label: 达到 ~$500M ARR，并重估到增长型倍数
          value: 1200
        - label: 执行兑现后，倍数向高溢价 SaaS 重估
          value: 600
        - label: 受监管垂直行业留存溢价获证实
          value: 300
        - label: Microsoft 与 Google 打包压缩定价
          value: -500
        - label: 倍数压缩至上市同业约 3x 收入
          value: -700
        - label: 较低的 ~$128M 收入基数被确认准确
          value: -400
    claimRefs:
      - CV004
      - CV007
      - CV024
      - CV027
      - CV037
      - CV044
  - id: FV003
    title: 估值回报区间
    type: range
    layout: standard
    summary: 熊、基准、牛三种区间横跨 ~$1.5B 入场估值，说明结果取决于收入冲突和打包压力。
    approximationNotes: 区间是分析师估算，单位为十亿美元，基于公开可比公司和情景假设，而不是完整 DCF 或清算瀑布。
    data:
      items:
        - label: 熊市情景估值
          low: 0.6
          base: 0.8
          high: 1
          unit: $B
        - label: 基准情景估值
          low: 1.3
          base: 1.5
          high: 1.8
          unit: $B
        - label: 牛市情景估值
          low: 2.4
          base: 3
          high: 3.6
          unit: $B
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV044
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: IC 风格评分给出 5.5/10：市场地位和退出可选性扎实，但下行保护清晰度与证据质量偏弱。
    approximationNotes: 评分使用 1-10 的编辑尺度，基于截至 2026-07-05 保留的公开证据；这是分析师判断，不是管理层披露的 KPI。
    data:
      items:
        - label: 入场纪律评分
          value: 5
          unit: /10
          note: 只有按较高收入估算才说得通；若按较低估算则偏紧。
        - label: 市场地位强度
          value: 7
          unit: /10
          note: 在 AEC、生命科学和金融服务等受监管垂直行业里扎得深。
        - label: 增长重估潜力
          value: 6
          unit: /10
          note: 公司有 ~$500M ARR 目标，但公开证据尚未证明增长节奏。
        - label: 下行保护清晰度
          value: 3
          unit: /10
          note: 优先权堆栈，以及二级转让与一级融资的拆分都未披露。
        - label: 可比倍数支撑
          value: 5
          unit: /10
          note: 上市内容管理同业约 3x；若按低基数，名义倍数约 11x。
        - label: 退出可选性
          value: 6
          unit: /10
          note: 出售给 PE、未来 IPO、二级流动性都还走得通。
        - label: 证据质量
          value: 4
          unit: /10
          note: 私营公司，第三方收入估算互相冲突。
    claimRefs:
      - CV004
      - CV009
      - CV030
      - CV032
      - CV034
      - CV038
      - CV043
