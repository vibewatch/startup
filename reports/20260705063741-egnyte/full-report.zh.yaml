      - number: '1.4'
        title: 规模、牵引力与封面指标
        blocks:
          - type: paragraph
            body: >-
              Egnyte 官方首页称服务 112 个国家的 23,000+ 家企业，这一数字支撑其规模叙事；客户案例页面引用的则是略有差异的「22,000+
              家企业」，属于值得记录的小不一致。收入方面，第三方追踪方分歧很大：GetLatka 将年化收入放在约 $128M，而其他追踪方和评论称 2025–2026 年 ARR 约
              $250–$300M。公开来源没有调和这个两倍差距，本文将其视为冲突指标，而非确定事实。员工数同样未由公司披露；独立数据库估计约 1,000–1,281 人，本分析采用约 1,000
              人这一单一估计，以避免传播未验证数字。Egnyte 将自己描述为资本效率高且盈利，私募股权投资逻辑建立在历史上约 20% 出头到 25%
              左右的稳健增长之上；但公司不发布增长率、毛利率或净收入留存率。这些缺口意味着封面指标必须区分三类内容：公司发布的硬指标（客户和国家）、第三方估计（收入、员工数）以及完全未披露指标（利润率、留存率、精确估值），每一类都带有自己的置信度和尽调路径。
