      - number: '8.4'
        title: 可比估值视角
        blocks:
          - type: paragraph
            body: >-
              可比公司集合要求保持纪律。Box 是最接近的规模化公开内容协作纯标的，市值约 $3.86B，收入约 $1.2B，2026 年交易倍数约 3.3x 收入，这一锚点来自 2026 年 3 月向 SEC 提交的
              Form 10-K。Dropbox 约以 3.4x 收入交易，远期 P/E 低于 10x，并被广泛描述为成熟、无增长的现金牛。更宽的协议管理同行 DocuSign，销售倍数约
              2.3-2.9x。私人和并购侧，Progress Software 以 $875M 现金收购 Citrix 的 ShareFile——后者收入超过 $240M、约 86,000 名客户——对战略性剥离业务隐含约
              3.6x 收入。与此同时，2026 年公开企业 SaaS 中位数重估到约 3.3x，低于 2025 年末约 4.9x，只有 AI 和安全公司还能维持双位数倍数。对照这个 2.3-3.6x 区间，Egnyte 的约
              $1.5B 标记如果用较高收入估算，看起来合理；如果用较低收入估算，则明显偏贵。
