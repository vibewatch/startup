      - number: '7.3'
        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Egnyte 的依赖图集中在少数外部参与者身上，而不是单一硬件供应商。其混合架构建立在大型云厂商平台（AWS、GCP、Azure）之上，因此供应商故障或涨价会直接传导到 Egnyte
              的可用性和成本基础。资本控制权在 2025 年 2 月发生变化，GI Partners 和 TA Associates 取得多数股权；同一批资助增长的私募股权投资方现在对定价、路线图和融资拥有决定性影响力，而
              2026 年杠杆收购的杠杆倍数在 covenant-lite 条款下回升到约 5.5–6x EBITDA，抬高了私募股权控股软件公司的基线风险。Egnyte
              通过一千多家渠道伙伴和托管服务提供商触达大量市场；如果投资方优先推动直销企业增长，这些伙伴的经济账可能被挤压。公司还依赖 Microsoft 和 Google
              这两个既是集成界面又是生存级竞争对手的生态，也依赖监管者和跨境传输框架；规则变化会打断价值主张。按垂直行业划分的关键客户集中度未披露，这是实质尽调缺口，而不是已经确认的问题。
