  - id: TV002
    title: 投资逻辑与反向逻辑表
    columns:
      - 框架
      - 支撑证据
      - 重要性
      - 改变判断的证据
    rows:
      - - 投资逻辑
        - 深耕 AEC、生命科学和金融服务等受监管垂直行业
        - 合规需求带来粘性，支撑更有韧性、可防守的经常性收入
        - 净收入留存和垂直行业集中度数据将验证这种韧性
      - - 投资逻辑
        - 两家一线 PE 机构以 ~$1.5B 估值标记完成当前融资
        - 纪律性资方给出外部背书，降低持续经营风险
        - 披露交易中新股与老股比例，才能确认这是否真是为增长融资
      - - 投资逻辑
        - 管理层在 PE 控股下瞄准 ~$500M ARR 里程碑
        - 如果规模化路径可信，估值可在入场标记之上重定价
        - 经审计 ARR 和增长轨迹将验证这一目标
      - - 反向逻辑
        - 第三方收入估计严重冲突（~$128M 对 ~$262M）
        - 仅靠公开证据，无法支撑入场倍数
        - CFO 提供可调和两组估计的 KPI 包，才能补上大部分证据缺口
      - - 反向逻辑
        - SaaStr 把 Egnyte 定位为经营 18 年的稳健复利型公司，而非高溢价增长股
        - 稳定的 mid-teens 增长通常撑不起两位数收入倍数
        - 增长加速的证据会削弱这一反对意见
      - - 反向逻辑
        - Microsoft 和 Google 的捆绑销售挤压内容协作定价
        - 一旦商品化，增长和退出倍数会同时被压缩
        - 相对捆绑套件的定价权和赢单率数据，将降低折价
    notes: 本表把核心上行逻辑，与让建议停留在观察而非买入的具体证据缺口和竞争压力配对。
