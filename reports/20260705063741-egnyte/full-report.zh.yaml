      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              这里的承保问题是前瞻资本充足性，而不是公司概览已经覆盖的历史逐轮融资年表。Egnyte 在 2025 年前累计风险股权融资约 $138M，相对于其收入基础较小；公司自称自 2016
              年起现金流转正，说明运营资金对外部融资的结构性依赖有限。2026 年需要关注的决定性事件是 2025 年 2 月 GI Partners 与 TA Associates 多数股权资本重组，报道中的隐含企业价值接近
              $1.5B；交易为创始人、管理层和早期风险投资者提供流动性，同时注入成长资本。交易规模以及任何配套债务或信贷安排未披露，而私募股权控制通常会叠加杠杆和明确回报周期，因此重组后的资产负债表——手头现金、任何收购债务和契约义务——是重大未知数。Egnyte
              对外表述的流动性路径是最终 IPO，而不是反复一级融资，这与一项可用运营现金自我供血的业务一致。基于现有证据，维持运营的融资依赖看起来较低；但 PE
              杠杆使用、下一轮或再融资触发因素，以及任何项目债或风险债，都无法从公开来源确认，构成核心资本结构尽调事项。
