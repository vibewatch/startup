      - number: '3.4'
        title: 定价与打包对比
        blocks:
          - type: paragraph
            body: >-
              定价结构分化明显，也定义了 Egnyte 面临的大部分竞争压力。打包套件在价格上最危险：SharePoint 和 OneDrive 随许多买家已经付费的 Microsoft 365 计划一起交付，Google
              Drive 则嵌在 Workspace 内，因此现状替代方案的边际成本看上去可以是零。纯软件厂商中，Dropbox Business Standard 标价约每用户每月 $15，提供 3 TB
              共享存储；Advanced 约 $24，提供 15 TB。Box 采用按席位分层模型，从约 $15 到报价制 Enterprise 和 Enterprise Advanced。Citrix ShareFile
              公布高级和尊享按用户层级，并提供高安全虚拟数据室选项；Nextcloud 销售自托管企业订阅，约每用户每年 €71–€205，且无供应商锁定；DocuWare 采用报价制。Egnyte
              标价处在类似的中高端按席位区间，但评测反复批评它插件单独收费、续约涨幅陡峭，让长期客户难以预测总成本。净结论是，Egnyte 不能靠标价赢过打包套件，必须用治理、混合和垂直合规价值证明溢价。
