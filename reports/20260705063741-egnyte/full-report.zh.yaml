      - number: '2.4'
        title: 买家、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              受治理内容协作的购买结构由多方参与。经济买家通常是企业 IT 领导层（CIO 或 CISO），预算来自安全、合规和基础设施；但业务线负责人经常触发购买并共同出资：AEC 中的虚拟设计与施工或 BIM
              经理、生命科学中的质量或监管事务负责人、金融服务中的运营负责人。用户包括内部知识员工，也包括大量外部伙伴、承包商和审计人员；他们必须访问内容，却不能都拿到买方生产力套件的完整席位。付款方和预算所有者随细分市场变化：大型企业里是集中式
              IT 安全预算，AEC 和媒体里是部门或项目预算，受监管制药里是已验证系统预算。具体事件会触发采用：合规要求或审计、勒索软件惊吓、Microsoft 365
              在大文件或外部协作上的边界，或老旧文件服务器云迁移。采用路径通常从部门或垂直行业滩头阵地起步，再走向企业级治理标准化；这也解释了 Egnyte 为什么把横向协作与垂直合规打包，试图把单个团队胜利转成组织级平台。
