      - number: '7.2'
        title: 运营、安全与可靠性风险
        blocks:
          - type: paragraph
            body: >-
              作为内容安全厂商，Egnyte 的基本盘靠信任维系，因此安全和可靠性事件会造成不成比例的伤害。2026 年 5 月，INC Ransom 威胁行为者组织公开声称入侵
              Egnyte；公司回应称没有部署勒索软件，事件仅限于一个只含合成数据的质量保证测试站点，没有客户或生产数据受损。这个说法可信，但尚未得到独立确认，仍留下残余不确定性。另一起事件里，客户 Fulcrum Real
              Estate Services 披露其 Egnyte 平台上存储的文件遭到未授权访问，提醒我们即便核心平台完好，共同责任模型仍会让终端客户暴露。可靠性方面，Egnyte 在 2026 年 6 月 1
              日经历了横跨欧盟和美国区域的重大 Secure & Govern 故障，6 月 16 日又发生间歇性 Web
              UI（US-East）故障；公司也会安排计划维护窗口，其帮助文档承认桌面应用同步错误反复出现，评论者也不断提到这一点。所有问题底下还有一层：对大型云厂商基础设施的依赖，把可用性和故障半径风险集中到 Egnyte
              无法控制的供应商身上。公开来源没有披露持久性、RPO 或 SLA 赔付细节。
