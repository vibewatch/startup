  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Egnyte 面向的每个买家，都至少有六种方式完成同一项内容协作任务，Egnyte 必须逐一赢下。打包既有厂商 Microsoft 365（SharePoint 和 OneDrive）与 Google
              Workspace（Drive）实际上免费嵌在客户已经购买的生产力套件里，因此成为 Egnyte 必须替换或共存的默认选项。直接纯软件厂商 Box 和 Dropbox Business
              在安全文件共享和内容管理上正面竞争；Box 如今是收入约 $1.18B 的上市公司，Dropbox 则是从消费者走向企业的上市业务。相邻和替代厂商解决更窄切片：Citrix ShareFile 做安全交换，开源
              Nextcloud 做自托管控制，DocuWare 做文档工作流，iManage 做法律知识工作，Autodesk 做 AEC 文档控制，Veeva Vault 做生命科学 GxP
              内容。所有方案之下，是本地文件服务器和网络附加存储的现状方案，常由 Nasuni 和 Panzura 这类混合云文件系统延展；大型 IT 组织也始终可以自建、自托管。Egnyte
              有意站在缝隙里：单一混合平台既像本地文件服务器一样工作，又在受监管垂直行业叠加云治理、安全和 AI，而横向套件在这些行业的细粒度控制上偏弱。
