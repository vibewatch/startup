      - number: '1.5'
        title: 里程碑与公司轨迹
        blocks:
          - type: paragraph
            body: >-
              Egnyte 的公司历史横跨 2007 年创立、长期风险融资驱动的建设，以及 2025 年转向私募股权所有权。关键里程碑包括：2007 年在 Mountain View 创立；早期获得 GV、Polaris 和
              Kleiner Perkins 支持；2013 年完成约 $29.5M Series D；2016 年实现现金流转正；2018 年 10 月完成 $75M Goldman Sachs Series
              E；持续扩张到受监管垂直行业；2025 年 2 月 GI Partners 与 TA Associates 以约 $1.5B 估值领投多数股权投资；以及 2026 年推出 AI Safeguards 和
              Egnyte Copilot AI Assistant，把受治理的生成式 AI 直接嵌入 Content Cloud。这条轨迹体现的是刻意选择的资本效率型「稳扎稳打」战略，而非闪电扩张——它带来了持久增长和
              $1.5B 结果，也让公司财务不透明，并在定价、续约和路线图上暴露于私募股权压力。增长故事旁边也有负面线索：客户反复抱怨桌面同步性能和价格、续约摩擦，分析师警告 PE
              所有权可能挤压小客户和渠道伙伴。因此，这条时间线成为后续章节复用的唯一正式年表。
