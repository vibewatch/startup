      - number: '2.3'
        title: 垂直市场池与监管拉力
        blocks:
          - type: paragraph
            body: >-
              Egnyte 的获客与销售集中在受监管垂直行业；在这些行业里，内容治理是合规要求，而非便利功能。这些垂直软件池本身也很可观。建筑、工程与施工（AEC）软件市场 2026 年估计接近 $12.04B，年增长约
              8-11%，由 BIM 要求、大型 CAD 文件协作和分布式工地团队推动，而横向套件难以很好承接这些需求。生命科学软件市场 2026 年估计接近 $22-24B，CAGR 约 11%，其中 GxP
              专用电子质量和文档管理子板块约 $1.6-3.0B。美国 FDA 关于电子记录和签名的 21 CFR Part 11
              等监管框架，为制药、生物技术和医疗器械中的已验证、可审计内容系统创造了持久刚需。金融服务又增加了一个市场池，留存、审计和数据驻留义务都偏向受治理内容平台。这些垂直市场池不能简单叠加到横向 TAM
              上；它们解释了为什么在合规、大文件和外部协作交叉的一部分市场里，Egnyte 能守住价格，并战胜打包的通用型厂商。
