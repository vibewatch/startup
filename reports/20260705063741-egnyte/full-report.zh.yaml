      - number: '2.6'
        title: 估算分歧与规模尽调缺口
        blocks:
          - type: paragraph
            body: >-
              这一类别的市场规模证据噪声很大，我们选择保留矛盾，而不是抹平矛盾。仅企业内容管理一项，2026 年估计就从 $44B 到 $76B，跨度超过
              70%，因为发布方对该类别是否包括传统记录管理、采集与影像服务，或重叠的内容服务和治理支出并无共识。内容协作、内容服务、DLP 和数据治理视角各自计入不同篮子，直接相加会重复计算。公司侧，Egnyte
              自身收入规模也有争议：GetLatka 估计年化约 $128M，而另一家第三方追踪方打出接近 $300M 的 ARR，导致 Egnyte 真实市场份额不确定。由于 Egnyte
              是私人公司，且不披露分部收入，公开数据无法分离出它在受监管中端市场内容协作中的精确可服务和可获得市场。因此，我们将规模估算处理为由来源支持的区间，标记收入数字分歧这一冲突数据缺口，并把缺失的分部披露记录为尽调路径，而不是用一个自信的单点数字解决。
