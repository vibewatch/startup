      - number: '8.3'
        title: 牛、基准与熊情景
        blocks:
          - type: paragraph
            body: >-
              情景框架应围绕当前估值标记给出结果区间，而不是假装存在唯一答案。牛市情景假设 Egnyte 朝其声明的约 $500M ARR 目标执行，维持受监管垂直行业留存，并重新定价到增长型软件倍数；这条路径支持约
              $2.4-3.6B，明显高于进入估值。基准情景假设约 $1.5B 的 PE 标记基本守住——十几个百分点的稳定增长、没有倍数重估、私募股权所有权下利润率逐步扩张，使价值维持在约 $1.3-1.8B。熊市情景假设
              Microsoft 和 Google 套件化加速内容协作商品化，增长放缓，Egnyte 倍数压缩到公开内容同行在较低 ARR 基础上交易的约 3x 收入水平——意味着约
              $0.6-1.0B。敏感性分析显示，最大正向杠杆是达成 $500M ARR 里程碑并获得重估；最大负向杠杆则是套件化驱动的压缩，以及确认较低的约 $128M 收入基础才是准确数字。
