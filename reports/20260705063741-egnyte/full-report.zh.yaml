      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >-
              Egnyte 罕见之处在于创始团队连续性极强：2007 年创立近二十年后，四位原始联合创始人仍全部担任高级管理职务。Vineet Jain
              担任创始人兼首席执行官，是公司最外显的领导者；他带领公司完成八轮风险融资和 2025 年私募股权资本重组，同时保留运营控制。Amrit Jassal 担任首席技术官，Kris Lahiri
              担任首席安全官，Rajesh Ram 负责增长与战略。这个稳定的创始团队是治理优势，也把关键人物依赖集中到 Vineet Jain 身上；18+ 年来，他几乎代表了公司的战略和融资。2025 年 2
              月多数股权投资完成后，GI Partners 与 TA Associates 获得董事会层面控制，最终治理权从风险投资财团转向私募股权赞助方；创始人和管理层仍保留重要少数股权，并继续掌管日常运营。上述转变引入
              PE 所有权的典型张力——利润率扩张压力和更严格的资本配置——叠加在一个仍由创始人运营的团队上。完整高管梯队、董事会构成以及交易后任何领导层变化的公开披露仍然有限，反映了 Egnyte
              作为私人且财务不透明公司的状态。
