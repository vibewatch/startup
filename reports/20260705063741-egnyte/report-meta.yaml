  foundingLocation: "Mountain View, California, United States"
  headquarters: "Mountain View, California, United States"
  productSummary: >-
    The Egnyte Content Cloud combines Egnyte Connect (hybrid file collaboration that works like a
    local file server with on-prem caching), Egnyte Protect / Governance (data security posture,
    permissions, DLP, ransomware detection, and compliance), and Egnyte Copilot / Intelligence
    (AI search and generative Q&A over governed private content), with deep vertical templates and
    integrations to Microsoft 365, Google Workspace, and industry tools.
  customerFocus: >-
    Mid-market and enterprise organizations in document-intensive, regulated verticals — AEC/
    construction, life sciences (GxP/FDA 21 CFR Part 11), financial services, media, legal, and
    manufacturing.
  businessModel: >-
    Per-seat/per-package SaaS subscriptions (published entry pricing ~$8-$10 per user per month
    plus custom enterprise tiers), sold direct and through channel partners, with expansion via
    added governance, security, and AI modules.
  stage: "Late-stage private; PE majority-owned (GI Partners & TA Associates, Feb 2025)"
  fundingStatus: >-
