companyProfile:
  summary: >-
    Egnyte is a Mountain View, California enterprise software company founded in 2007 that operates
    the "Content Cloud," a platform unifying secure file collaboration, data governance and
    security, and generative AI over a customer's unstructured content. It is unusual among its
    cohort for being profitable and capital-efficient, having reached cash-flow positive status in
    2016 on roughly $138M of lifetime venture equity. In February 2025, private-equity firms GI
    Partners and TA Associates led a majority investment implying an approximately $1.5B valuation,
    while founders, management, and existing investors retained significant minority ownership.
    Egnyte serves 23,000+ businesses across 112 countries, with concentrated strength in regulated
    and document-intensive verticals such as architecture/engineering/construction, life sciences,
    and financial services.
  foundedDate: '2007-01-01'
