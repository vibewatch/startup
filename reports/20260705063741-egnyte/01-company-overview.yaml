company:
  name: Egnyte
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Egnyte is a Mountain View-based cloud content management and governance company founded in 2007 by
    Vineet Jain and three co-founders. After raising roughly $138M of venture equity — capped by a $75M
    Series E led by Goldman Sachs in 2018 — it took a majority private-equity investment from GI Partners
    and TA Associates in February 2025 at an implied valuation of about $1.5B, while remaining founder-led
    and serving 23,000+ businesses across 112 countries.
sections:
  - id: identity-and-model
    title: "Identity, Founding, and Business Model"
    body: >-
      Egnyte, Inc. is a cloud content management, collaboration, and data-governance company headquartered
      in Mountain View, California, with an additional engineering hub in Spokane, Washington. The company
      was founded in 2007 by Vineet Jain alongside co-founders Rajesh Ram, Amrit Jassal, and Kris Lahiri,
      and it remains privately held and founder-led nearly two decades later. Egnyte sells a unified
      platform it markets as the "Content Cloud" — an AI-powered system that combines file collaboration
      (Egnyte Connect), data security and governance (Egnyte Protect), and generative-AI capabilities
      (Egnyte Copilot). Its Connect product is designed to work like a local file server while syncing to
      the cloud, supporting hybrid on-premises and cloud deployments favored by regulated industries. The
      business model is subscription SaaS, sold per user and per plan tier with custom enterprise pricing;
      published entry pricing sits around $8–$10 per user per month, rising sharply for governance and AI
      features. Egnyte targets mid-market and enterprise buyers in regulated verticals such as
      architecture, engineering and construction, life sciences, financial services, media, and legal,
      and integrates with Microsoft 365, Google Workspace, Slack, and Salesforce. The company competes
      against Microsoft SharePoint and OneDrive, Google Drive, Box, and Dropbox.
    claimRefs: [CO001, CO002, CO003, CO004, CO025, CO026, CO030, CO031, CO032, CO040]
    tableRefs: [TO001]
    figureRefs: [FO002]
  - id: leadership-governance
    title: "Leadership, Founders, and Governance"
    body: >-
      Egnyte is distinguished by unusual founder continuity: all four original co-founders remain in
      senior executive roles nearly two decades after the 2007 founding. Vineet Jain serves as Founder and
      Chief Executive Officer and is the company's most visible leader, having steered it through eight
      venture rounds and the 2025 private-equity recapitalization while retaining operational control.
      Amrit Jassal serves as Chief Technology Officer, Kris Lahiri as Chief Security Officer, and Rajesh
      Ram in a chief growth and strategy capacity. This durable founding team is a governance strength but
      also concentrates key-person dependence on Vineet Jain, who has personified the company's strategy
      and fundraising for eighteen-plus years. Following the February 2025 majority investment, GI Partners
      and TA Associates hold board-level control, shifting ultimate governance from a venture syndicate to
      private-equity sponsors even as the founders and management retain significant minority equity and
      day-to-day leadership. That transition introduces the classic tension of PE ownership — pressure for
      margin expansion and disciplined capital allocation — layered onto a still founder-run operating
      team. Public disclosure of the full executive bench, board composition, and any post-deal leadership
      changes remains limited, reflecting Egnyte's status as a private, financially opaque company.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO010, CO039]
    tableRefs: [TO002]
  - id: funding-valuation
    title: "Funding History, Valuation, and Investors"
    body: >-
      Egnyte raised approximately $138 million of venture equity across roughly eight rounds before its
      2025 private-equity deal. Early and growth-stage backers included Google Ventures (GV), Polaris
      Partners, Kleiner Perkins, Seagate Technology, Northgate Capital, and Floodgate. After a 2013 Series
      D of about $29.5 million, the company went five years without raising, remaining cash-flow positive
      from 2016, before Goldman Sachs Private Capital Investing led a $75 million Series E in October 2018
      — the round most often cited as fuel for an eventual IPO that never materialized. The defining
      capital event came in February 2025, when private-equity firms GI Partners and TA Associates led a
      majority growth investment implying a valuation of roughly $1.5 billion. The transaction was a
      recapitalization rather than a full buyout: founders, management, and select existing investors
      including Springcoast, GV, Polaris, and Kleiner Perkins retained meaningful minority stakes, and
      financial terms were not officially disclosed. Commentators pegged the deal at roughly 5–6x annual
      recurring revenue, positioning it as a steady, capital-efficient outcome rather than an
      ultra-premium unicorn exit. Because Egnyte does not publish audited financials, exact round-by-round
      valuations, any debt or credit facilities, and the precise 2025 deal size remain undisclosed and
      form a core diligence gap.
    claimRefs: [CO011, CO012, CO013, CO014, CO015, CO016, CO017, CO018, CO037, CO038]
    tableRefs: [TO003]
  - id: scale-metrics
    title: "Scale, Traction, and Cover Metrics"
    body: >-
      Egnyte reports serving 23,000+ businesses across 112 countries on its official homepage, a figure
      that anchors its scale narrative; its customer case-study page cites a slightly different "22,000+
      businesses," a minor inconsistency worth noting. On revenue, third-party trackers disagree
      materially: GetLatka places annualized revenue near $128 million, while other trackers and
      commentary cite roughly $250–$300 million in annual recurring revenue as of 2025–2026. That two-fold
      spread is unreconciled in public sources and is treated here as a conflicting metric rather than a
      settled fact. Headcount is likewise undisclosed by the company; independent databases estimate
      roughly 1,000–1,281 employees, and this analysis carries a single estimated headcount figure of
      about 1,000 to avoid propagating an unverified number. Egnyte characterizes itself as capital
      efficient and profitable, and the private-equity thesis rests on steady growth in the low-to-mid
      twenties percent range historically, though the company does not publish growth, gross margin, or net
      revenue retention. These gaps mean the cover metrics must separate the one hard, company-published
      figure (customers and countries) from third-party estimates (revenue, headcount) and fully
      undisclosed figures (margins, retention, exact valuation), each carrying its own confidence and
      diligence path.
    claimRefs: [CO020, CO021, CO022, CO023, CO024, CO033, CO034, CO035, CO036]
    figureRefs: [FO003]
  - id: milestones-trajectory
    title: "Milestones and Corporate Trajectory"
    body: >-
      Egnyte's corporate history spans a 2007 founding, a long venture-funded build-out, and a 2025 pivot
      to private-equity ownership. Key milestones include the 2007 founding in Mountain View; early GV,
      Polaris, and Kleiner Perkins backing; a 2013 Series D of about $29.5 million; reaching cash-flow
      positive status in 2016; the $75 million Goldman Sachs Series E in October 2018; steady expansion
      into regulated verticals; the February 2025 GI Partners and TA Associates majority investment at a
      roughly $1.5 billion valuation; and, in 2026, the launch of AI Safeguards and the Egnyte Copilot AI
      Assistant that embed governed generative AI directly into the Content Cloud. The trajectory reflects
      a deliberate, capital-efficient "steady wins" strategy rather than blitzscaling — an approach that
      delivered durable growth and a $1.5B outcome but also left the company opaque on financials and now
      exposed to private-equity pressure on pricing, renewals, and roadmap. Adverse threads run alongside
      the growth story: recurring customer complaints about desktop-sync performance and pricing, renewal
      friction, and analyst warnings that PE ownership may squeeze smaller customers and channel partners.
      The timeline therefore serves as the single chronology of record that later chapters reuse.
    claimRefs: [CO001, CO014, CO015, CO010, CO011, CO028, CO042, CO033]
    tableRefs: [TO004]
    figureRefs: [FO001]
