callouts:
  - calloutType: strength
    title: "Rare Founder Continuity and Capital Efficiency"
    body: >-
      All four co-founders remain in senior roles nearly two decades on, and the company reached
      cash-flow positive by 2016 on roughly $138M of venture equity — an unusually disciplined,
      capital-efficient profile that culminated in a ~$1.5B private-equity valuation.
    claimRefs: [CO007, CO011, CO017]
  - calloutType: risk
    title: "Private-Equity Ownership Pressures Customers and Roadmap"
    body: >-
      With GI Partners and TA Associates now holding majority control, analysts warn of margin-driven
      pricing hikes, tighter renewal terms, and possible deprioritization of smaller customers and
      channel partners — compounding existing complaints about sync performance and cost.
    claimRefs: [CO010, CO033, CO034]
  - calloutType: insight
    title: "Financial Opacity Is the Core Diligence Gap"
    body: >-
      Egnyte publishes only customer and country counts; revenue estimates diverge two-fold (~$128M vs
      ~$250–300M), headcount is a third-party estimate, and margins, retention, and the exact 2025 deal
      size are undisclosed, forcing careful separation of hard facts from estimates.
    claimRefs: [CO020, CO024, CO038]
