callouts:
  - calloutType: strength
    title: "Hybrid Plus Governance Is the Defensible Seam"
    body: >-
      Egnyte's combination of local-file-server behavior with edge caching and cloud governance across
      regulated verticals is the position horizontal suites replicate most slowly, anchoring retention.
    claimRefs: [CP017, CP038]
  - calloutType: risk
    title: "Bundling and AI Parity Compress Pricing Power"
    body: >-
      Microsoft 365 and Google Workspace fold comparable storage, collaboration, and Copilot-style AI into
      suites at near-zero marginal price, steadily raising the good-enough bar and pressuring Egnyte renewals.
    claimRefs: [CP040, CP042]
  - calloutType: insight
    title: "Strong Lock-in, Weak Distribution"
    body: >-
      Egnyte enjoys high per-account switching costs but competes for top-of-funnel demand against incumbents
      that reach the same buyers through pre-paid, pre-installed suites and enterprise agreements.
    claimRefs: [CP032, CP035]
