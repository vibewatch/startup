  rows:
  - - Collaboration (Egnyte Connect)
    - Distributed knowledge and field teams
    - Mature core; desktop, web, mobile access documented in helpdesk guides
    - Works like a familiar shared drive with hybrid local caching for large files
    - Independent reviews cite sync slowness on very large file sets
  - - Governance (Secure & Govern / Protect)
    - IT, security, and compliance teams
    - Mature; sensitive-data discovery, ransomware detection, multi-cloud management
    - Governance runs on the same repository as collaboration, not a separate silo
    - No public precision/recall figures for classification or ransomware detection
  - - Intelligence (Copilot / AI Assistant)
    - Knowledge workers in regulated functions
    - Newer; Copilot GA 2024, built-in AI Assistant added 2026
    - Generative AI grounded in private, permissioned content inside the platform
    - Shorter production track record than the collaboration core
  - - Platform (shared repository + hybrid architecture)
    - Platform administrators
    - Mature; centralized repository with on-prem cache and multi-cloud sync
    - Customer control over data residency across on-prem and multiple clouds
    - Turbo/edge-cache internals not fully disclosed on public pages
  - - Integrations and developer surface
    - Partners and integration engineers
    - Active; REST API, Python/JS SDKs, M365/Google/Slack/Salesforce/Autodesk connectors
    - Open developer portal plus 2026 MCP server for external AI assistants
    - API rate limits and SLA terms not published on the public portal
  - - AI Safeguards and MCP governance
    - Security and AI-governance owners
    - New in 2026; granular, auditable control over AI access to content
    - Treats AI access control as a platform layer, not a feature bolt-on
    - Effectiveness and adoption not yet independently benchmarked
