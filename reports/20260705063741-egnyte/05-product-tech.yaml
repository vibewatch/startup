- id: architecture-and-deployment
  title: Architecture, Deployment, and Integrations
  body: 'Egnyte''s technology foundation is a shared, centralized content repository wrapped by governance, intelligence, and integration layers. Its defining architectural choice is hybrid deployment: enterprises keep an on-premises cache/appliance for fast local access to hot data while the authoritative copy and metadata sync to Egnyte''s cloud, which can itself span multiple public clouds for residency and resilience. This "control over where data resides" is the reason regulated customers in financial services, healthcare, and the EU adopt it. Around the repository, Egnyte exposes a public developer surface — a developer portal at developers.egnyte.com, a documented REST API requiring registered OAuth applications, and officially maintained Python and JavaScript SDKs — that partners use to build integrations. Out-of-the-box connectors bind the repository to Microsoft 365, Google Workspace, Slack, Salesforce, and Autodesk Construction Cloud, and a Microsoft 365 Copilot connector indexes Egnyte files into Microsoft Search. The 2026 additions — an open-standard Model Context Protocol (MCP) server plus AI Safeguards — let external AI assistants such as ChatGPT, Claude, and Microsoft Copilot query Egnyte content live without duplicating or re-indexing it, while Egnyte''s existing permission model is enforced on every request.'
