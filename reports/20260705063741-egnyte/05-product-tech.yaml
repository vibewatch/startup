- id: trust-security-compliance
  title: Trust, Security, and Compliance
  body: 'Trust is Egnyte''s most heavily documented dimension, which fits a vendor selling into regulated buyers. Its information-security management system is certified to ISO/IEC 27001:2022, and it publishes an independent SOC 2 SSAE 18 Type 2 attestation. The compliance surface explicitly extends to HIPAA for protected health information, GDPR for EU data protection, Cyber Essentials, CMMC/NIST 800-171 for defense supply chains, FINRA and SEC Rule 17a-4 for financial recordkeeping, and GxP / 21 CFR Part 11 for life sciences. Administrative controls include configurable authentication, password and lockout policies, MFA, offline-access controls, and audit logging, and the 2026 AI Safeguards layer adds granular, auditable control over which users, groups, files, and locations AI can touch — directly targeting the "black box" objection to enterprise generative AI. Two gaps remain material for diligence. First, Egnyte''s public compliance page does not list a FedRAMP authorization, so federal-cloud readiness is unclear and should be confirmed directly. Second, Egnyte publishes a live status page and disclosed a multi-region performance-degradation incident in May 2026, but does not publish contractual uptime SLAs or reliability metrics, so quantitative reliability must be requested under diligence.'
