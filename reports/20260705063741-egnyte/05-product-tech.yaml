callouts:
- calloutType: strength
  title: Unifying collaboration and governance on one repository is a real structural advantage
  body: Because Egnyte Connect, Secure & Govern, and the AI Assistant all read and write the same permission-aware repository, buyers can retire separate file-sharing, DLP, and archiving tools rather than integrating them. That unification, not any single feature, is the durable differentiator against both hyperscaler bundles and point governance vendors.
  claimRefs:
  - CE001
  - CE025
  - CE026
- calloutType: strength
  title: Governance-first AI is well matched to Egnyte's regulated buyers
  body: AI Safeguards and the MCP server let regulated customers use ChatGPT, Claude, or Copilot on private content while enforcing existing permissions and producing an audit trail. Positioning AI access control as a platform layer directly answers the "black box" objection that slows enterprise generative-AI adoption.
  claimRefs:
  - CE015
  - CE016
  - CE017
- calloutType: risk
  title: Reliability and federal readiness are under-disclosed
  body: Egnyte publishes a live status page and openly logged a multi-region degradation incident in May 2026, but it does not publish contractual uptime SLAs or reliability metrics, and its public compliance page lists no FedRAMP authorization. Both gaps must be closed directly before underwriting mission-critical or federal workloads.
  claimRefs:
  - CE036
  - CE038
- calloutType: risk
  title: Sync performance friction hits the large-file customers Egnyte targets
  body: Independent reviews repeatedly flag slow desktop sync and limited in-app search on very large file sets. That friction is most acute for the media-heavy AEC and life-sciences teams Egnyte courts, so hybrid-cache performance is a diligence priority rather than a cosmetic complaint.
  claimRefs:
  - CE037
  - CE004
