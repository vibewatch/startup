  evidenceGaps:
  - type: missing-source
    severity: material
    topic: fedramp-gap
    missingEvidence: A FedRAMP authorization listing, agency ATO, or Egnyte statement clarifying federal-cloud (GovCloud) readiness and status.
    whyItMatters: Egnyte courts regulated buyers, but the absence of a public FedRAMP authorization limits its addressable federal market and leaves a compliance question open for public-sector diligence.
    diligencePath: Ask Egnyte directly for FedRAMP status, StateRAMP/agency ATO evidence, and the roadmap and timeline for any in-process authorization.
    relatedQuestionRefs:
    - QE023
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: reliability-transparency
    missingEvidence: Contractual uptime SLAs, historical availability percentages, and quantitative reliability metrics for the Content Cloud and sync fabric.
    whyItMatters: A disclosed May 2026 multi-region incident and recurring sync complaints make reliability a live risk, yet Egnyte publishes only a status page without SLA or uptime figures.
    diligencePath: Request the master service agreement SLA schedule, trailing 12-month uptime reports, incident post-mortems, and sync-performance benchmarks under NDA.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: minor
    topic: ai-assistant
    missingEvidence: Independent benchmarks of Egnyte AI Assistant answer quality, hallucination rates, and retrieval precision over private content.
    whyItMatters: Egnyte's AI differentiation depends on trustworthy answers, but no public third-party evaluation quantifies accuracy, so AI quality cannot be underwritten from public evidence.
    diligencePath: Request internal evaluation scorecards, red-team results, and reference-customer accuracy data for the AI Assistant and Copilot.
    relatedQuestionRefs:
    - QE008
    relatedTableRefs:
    - TE002
