callouts:
  - calloutType: strength
    title: "Governed, Regulated-Vertical Niche Defends Premium"
    body: >-
      By concentrating on regulated verticals such as AEC, life sciences, and financial services, where
      compliance, large files, and external collaboration intersect, Egnyte occupies a slice of a
      multi-billion-dollar market where bundled generalists are structurally weak, letting it defend
      price against Microsoft and Google.
    claimRefs: [CM019, CM021, CM036]
  - calloutType: risk
    title: "Bundling Commoditizes the Horizontal Core"
    body: >-
      Microsoft 365 and Google Workspace bundle file sharing at near-zero marginal cost and have closed
      much of the basic feature gap, compressing the standalone content-collaboration opportunity and
      forcing specialists continually up the value chain to justify a premium.
    claimRefs: [CM036, CM011]
  - calloutType: insight
    title: "Sizing Divergence Demands a Range, Not a Number"
    body: >-
      Because 2026 ECM estimates span $44-76 billion and Egnyte's own revenue is reported at both ~$128
      million and ~$300 million, any single TAM-times-share valuation is unreliable; the defensible
      output is a bounded range with preserved contradictions.
    claimRefs: [CM038, CM039, CM040]
