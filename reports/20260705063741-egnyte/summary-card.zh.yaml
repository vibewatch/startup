  topStrengths:
    - 自 2016 年起现金流为正，累计融资仅约 $138M，盈利能力和资本效率都有验证
    - 18+ 年后四位联合创始人仍在高管岗位，创始人团队连续性强
    - 在 AEC、生命科学、金融服务等受监管垂直行业做得深，差异化清晰
    - 同一平台覆盖协作、治理 / 安全，以及私有内容上的 AI
    - 覆盖 112 个国家的 23,000+ 家企业，装机盘广且黏性强
  topRisks:
    - Microsoft 365（SharePoint / OneDrive）和 Google Workspace 的捆绑形成结构性挤压
    - 私有财务不透明，收入估计相差约 2 倍（$128M 对比约 $250M-$300M）
    - 私募股权控股之后，续费价格可能上调，产品路线图优先级也可能重排
    - 对长期任职的创始人兼 CEO Vineet Jain 存在关键人依赖
    - 客户仍持续抱怨桌面同步性能和续费摩擦
  unresolvedGaps:
    - 经审计 ARR、收入增速、毛利率、NRR / 流失率尚未披露
    - 2025 年 2 月交易规模、股权拆分和优先股堆叠尚未披露
    - 官方当前员工数和客户数口径仍需核对（23,000+ 对比 22,000+ / 16,000+）
    - 客户 / 垂直行业收入集中度和净留存仍未知
