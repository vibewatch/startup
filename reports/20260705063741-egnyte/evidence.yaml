evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: revenue
    missingEvidence: >-
      A reconciled, authoritative ARR figure for Egnyte; estimates range from ~$128M (GetLatka) to ~$250-300M (SaaStr,
      ARR Club).
    whyItMatters: The two-fold ARR spread swings any revenue multiple and valuation assessment materially.
    diligencePath: Request audited financials or management ARR disclosure in a data room; triangulate with seat counts and pricing.
    relatedQuestionRefs:
      - QO009
      - QO020
      - QO024
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: Exact 2025 deal size, ownership percentages, and the 2018 Series E post-money valuation.
    whyItMatters: Undisclosed valuation history prevents precise dilution and return modeling.
    diligencePath: Request cap table and transaction documents from the company or sponsors.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: debt and credit facilities
    missingEvidence: Whether Egnyte carries venture debt or credit facilities beyond equity.
    whyItMatters: Affects total capitalization and leverage under PE ownership.
    diligencePath: Request debt schedule and UCC filings; check lender disclosures.
    relatedQuestionRefs:
      - QO023
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Officially confirmed employee count; third-party estimates span ~1,000-1,281.
    whyItMatters: Headcount informs efficiency and cost structure under PE margin pressure.
    diligencePath: Request HR headcount from company or corroborate via payroll/records in diligence.
    relatedQuestionRefs:
      - QO011
      - QO024
  - type: enumeration-incomplete
    severity: minor
    topic: leadership and governance (TO002)
    missingEvidence: Full executive bench and post-2025 board composition beyond founders and PE sponsors.
    whyItMatters: Complete leadership depth is needed to assess key-person risk fully.
    diligencePath: Request org chart and board roster from the company.
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: ECM market size divergence
    missingEvidence: A reconciled definition of what the ECM/CSP category includes to explain the >70% spread across 2026 estimates.
    whyItMatters: TAM-based valuation multiples are unreliable while publishers disagree on category boundaries by tens of billions.
    diligencePath: >-
      Request methodology and inclusion criteria from each analyst firm and normalize to a common content-collaboration
      boundary.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: Egnyte revenue estimate conflict
    missingEvidence: An authoritative revenue figure reconciling the ~$128M GetLatka and ~$300M ARR-tracker estimates.
    whyItMatters: Egnyte's market share and any revenue-multiple valuation swing materially depending on which figure is correct.
    diligencePath: >-
      Seek audited or management-confirmed revenue, or triangulate via headcount, customer count, and average contract
      value.
    relatedQuestionRefs:
      - QM025
      - QM026
  - type: private-evidence-only
    severity: material
    topic: Egnyte SAM/SOM isolation
    missingEvidence: >-
      Segment-level revenue and pipeline disclosure to isolate Egnyte's serviceable and obtainable market within
      regulated mid-market content collaboration.
    whyItMatters: Without segment data, SOM is an estimate and cannot anchor a bottom-up valuation.
    diligencePath: Request Egnyte's segment revenue split and regulated-vertical mix under NDA during diligence.
    relatedQuestionRefs:
      - QM027
  - type: private-evidence-only
    severity: material
    topic: Egnyte competitive win rates
    missingEvidence: No public head-to-head win/loss data for Egnyte against Box, Microsoft, or vertical incumbents.
    whyItMatters: Without win rates the true competitive position and displacement threat cannot be quantified.
    diligencePath: Request anonymized deal win/loss data from Egnyte or interview channel partners and buyers.
    relatedQuestionRefs:
      - QP025
  - type: private-evidence-only
    severity: material
    topic: Egnyte retention and churn
    missingEvidence: Egnyte's gross and net revenue retention and churn-to-competitor rates are undisclosed.
    whyItMatters: Retention data is the direct test of the switching-cost moat thesis versus the pricing-pressure risk.
    diligencePath: Obtain cohort retention figures under NDA or triangulate from partner and reseller churn signals.
    relatedQuestionRefs:
      - QP026
  - type: stale
    severity: minor
    topic: Incumbent hybrid roadmap
    missingEvidence: Current-quarter detail on how fast Microsoft and Box are closing the hybrid and granular-permission gap.
    whyItMatters: The pace of incumbent parity determines how long Egnyte's hybrid wedge remains defensible.
    diligencePath: Track Microsoft and Box release notes and analyst briefings each quarter for hybrid/permission features.
    relatedQuestionRefs:
      - QP027
  - type: conflicting-data
    severity: blocking
    topic: Absolute ARR and revenue
    missingEvidence: Audited absolute ARR/revenue reconciling the $128M GetLatka figure with the $250-300M third-party estimate.
    whyItMatters: A two-fold revenue spread makes any valuation multiple, growth, or margin analysis unreliable.
    diligencePath: Request audited annual revenue by year and product line from the data room.
    relatedQuestionRefs:
      - QI014
      - QI015
    relatedTableRefs:
      - TI005
  - type: private-evidence-only
    severity: blocking
    topic: Unit economics and margins
    missingEvidence: Gross margin, NRR, gross churn, CAC, and payback period.
    whyItMatters: These determine profitability, durability, and sales efficiency central to underwriting.
    diligencePath: Request cohort retention, S&M spend by new-ARR cohort, and audited COGS/gross-margin schedules.
    relatedQuestionRefs:
      - QI007
      - QI008
      - QI012
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: Post-recap capital structure
    missingEvidence: Current cash balance, any acquisition/venture debt, credit facilities, and covenants.
    whyItMatters: Determines runway, fixed charges, and financing dependency under PE ownership.
    diligencePath: Request transaction agreement, debt schedule, and current balance sheet.
    relatedQuestionRefs:
      - QI016
      - QI017
    relatedTableRefs:
      - TI004
  - type: missing-source
    severity: minor
    topic: Revenue mix
    missingEvidence: Revenue split across SMB seats versus high-ACV enterprise, and channel versus direct.
    whyItMatters: Mix drives blended margin, concentration risk, and growth durability.
    diligencePath: Request revenue breakdown by tier, vertical, geography, and channel.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: fedramp-gap
    missingEvidence: >-
      A FedRAMP authorization listing, agency ATO, or Egnyte statement clarifying federal-cloud (GovCloud) readiness and
      status.
    whyItMatters: >-
      Egnyte courts regulated buyers, but the absence of a public FedRAMP authorization limits its addressable federal
      market and leaves a compliance question open for public-sector diligence.
    diligencePath: >-
      Ask Egnyte directly for FedRAMP status, StateRAMP/agency ATO evidence, and the roadmap and timeline for any
      in-process authorization.
    relatedQuestionRefs:
      - QE023
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: reliability-transparency
    missingEvidence: >-
      Contractual uptime SLAs, historical availability percentages, and quantitative reliability metrics for the Content
      Cloud and sync fabric.
    whyItMatters: >-
      A disclosed May 2026 multi-region incident and recurring sync complaints make reliability a live risk, yet Egnyte
      publishes only a status page without SLA or uptime figures.
    diligencePath: >-
      Request the master service agreement SLA schedule, trailing 12-month uptime reports, incident post-mortems, and
      sync-performance benchmarks under NDA.
    relatedQuestionRefs:
      - QE025
    relatedTableRefs:
      - TE005
  - type: missing-source
    severity: minor
    topic: ai-assistant
    missingEvidence: >-
      Independent benchmarks of Egnyte AI Assistant answer quality, hallucination rates, and retrieval precision over
      private content.
    whyItMatters: >-
      Egnyte's AI differentiation depends on trustworthy answers, but no public third-party evaluation quantifies
      accuracy, so AI quality cannot be underwritten from public evidence.
    diligencePath: >-
      Request internal evaluation scorecards, red-team results, and reference-customer accuracy data for the AI
      Assistant and Copilot.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE002
  - type: enumeration-incomplete
    severity: material
    topic: named customer proof table roster completeness
    missingEvidence: >-
      A dated, exhaustive list of Egnyte customers by vertical, size, region, deployment status, and
      production-versus-reference state.
    whyItMatters: >-
      Public sources name only a marketing subset of the 23,000+ base, so adoption breadth and referenceability cannot
      be fully reconciled from open evidence.
    diligencePath: >-
      Request the full customer roster with vertical, seat count, region, launch date, and status, including inactive
      accounts.
    relatedQuestionRefs:
      - QU013
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics-gap
    missingEvidence: >-
      NRR, gross retention, logo churn, renewal rate, contract length, and satisfaction instruments (NPS/CSAT) by
      segment.
    whyItMatters: >-
      The chapter can show strong proof of use and outcomes but cannot underwrite customer durability without actual
      retention metrics.
    diligencePath: Request customer-cohort retention reporting, renewal history, and account-level expansion timelines by segment.
    relatedQuestionRefs:
      - QU015
    relatedTableRefs:
      - TU004
  - type: private-evidence-only
    severity: material
    topic: concentration-data-gap
