schemaVersion: "report-v2"
artifact: financials
slug: egnyte
runDate: '2026-07-05'
company:
  name: Egnyte
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Egnyte monetizes secure content collaboration through per-seat annual subscriptions ($10-$48 list per
    user/month plus custom enterprise and vertical bundles), and third-party trackers place annualized
    revenue between roughly $128M (GetLatka) and a conflicting $250-$300M estimate, against a ~$1.5B 2025
    private-equity recapitalization. Because Egnyte is private and declines to disclose audited financials
    — a stance visible as far back as its 2011 SEC Form D — margins, burn, retention, and CAC payback are
    unavailable and modeled here from public comps (Box) with explicit diligence paths.
sections:
  - id: revenue-model
    title: "Revenue Streams, Pricing, and Monetization"
    body: >-
      Egnyte's revenue is overwhelmingly recurring subscription income from its Content Cloud platform, sold
      on a per-seat, annually contracted basis rather than on consumption or transaction volume. Published
      list pricing spans five tiers — Team at $10 per user/month, Business at $22, Enterprise Lite at $39,
      Elite at $48, and a custom-quoted Ultimate/Enterprise tier — with storage, governance, threat
      detection, and AI capabilities gated by tier. Monetization layers on top of the seat price through
      vertical bundles for Life Sciences (GxP/21 CFR Part 11), AEC, and Financial Services, plus add-ons
      such as Egnyte Copilot AI, DLP, e-discovery, and additional storage that procurement advisors say can
      add 20-40% to an annual contract. Realized pricing diverges materially from list: procurement sources
      report typical deals of roughly $15,000-$75,000 per year with a median near $37,000, and large buyers
      negotiating 9-30% discounts, so list rates overstate net per-seat economics. The company sells across
      a wide deal-size band — from sub-$10K self-service SMB transactions to $1M-plus enterprise agreements
      — supporting a multi-motion go-to-market. Egnyte does not break out revenue by tier, vertical, or
      geography publicly, so the mix among Team/Business SMB seats and high-ACV regulated-industry
      enterprise accounts remains an estimation exercise rather than a disclosed fact.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI006, CI007, CI025]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: gtm-unit-economics
    title: "GTM Efficiency and Unit Economics Proxies"
    body: >-
      Egnyte's go-to-market blends low-cost inside sales, vertical field sales, partner/reseller channels,
      and self-service, a structure the founder credits for reaching nine-figure ARR on modest venture
      funding. Because the company withholds CAC, payback, net revenue retention, and gross margin, unit
      economics must be triangulated from proxies. The strongest anchor is capital efficiency: Egnyte
      reached an estimated $100M and later $200M-plus ARR on roughly $138M of cumulative venture equity,
      an unusually low burn multiple versus venture-funded content-collaboration peers, and it has described
      itself as cash-flow positive since 2016. Per-seat contribution is a function of blended net price
      (below the $22-$48 list after discounts) against cloud-hosting, hybrid "Turbo" caching, support, and
      channel-margin costs; against public content-platform comps this implies a healthy but not best-in-class
      software gross margin. Retention signals are indirect: expansion into regulated verticals, 23,000+
      accounts, and land-and-expand add-on selling point to solid net retention, but adverse reviews cite
      renewal price increases and difficult cancellations that could pressure logo retention among smaller
      customers. Sales efficiency therefore looks structurally sound on the capital-efficiency lens yet
      remains unverifiable on the CAC/payback and NRR lenses that underwriting actually requires.
    claimRefs: [CI008, CI009, CI010, CI011, CI012, CI013, CI014, CI026]
    tableRefs: [TI003]
    figureRefs: [FI002]
  - id: cost-margin
    title: "Cost Structure, Gross Margin Drivers, and Comparables"
    body: >-
      With no disclosed Egnyte P&L, the cost structure is best framed against Box, the closest public pure
      play in cloud content management. In fiscal 2026 Box reported about $1.18B revenue growing near 8-9%,
      a non-GAAP gross margin around 82%, and a non-GAAP operating margin near 28% — a useful ceiling for
      what a mature, subscription content platform can earn. Egnyte's gross-margin drivers are similar:
      cloud infrastructure and storage, hybrid edge caching appliances, customer support, security and
      compliance tooling, and third-party integration maintenance. Two structural differences likely pull
      Egnyte's margin profile below Box's. First, Egnyte's hybrid on-prem/Turbo architecture and
      heavy regulated-vertical support carry more service-delivery and infrastructure cost per seat than a
      pure-cloud peer. Second, meaningful channel/reseller distribution shifts some gross margin to partners.
      Offsetting these, Egnyte's smaller absolute scale and disciplined "profitable growth" posture — it has
      publicly targeted $500M ARR while remaining cash generative — suggest operating margins that are
      positive rather than the deep losses common among growth-stage SaaS. The net read is a plausible
      gross margin in the low-to-mid-70s to low-80s percent and modestly positive operating/free-cash-flow
      margin, but every figure here is a comp-derived estimate, not an Egnyte disclosure, and should be
      confirmed against audited statements in diligence.
    claimRefs: [CI015, CI016, CI017, CI018, CI019, CI027]
    tableRefs: [TI006]
    figureRefs: [FI003]
  - id: capital-adequacy
    title: "Capital Adequacy and Financing Dependency"
    body: >-
      Forward capital adequacy, not the historical round-by-round chronology covered in Company Overview,
      is the underwriting question here. Egnyte's cumulative pre-2025 venture equity funding of roughly
      $138M is small relative to its revenue base, and its self-described cash-flow-positive status since
      2016 implies limited structural dependence on external financing to fund operations. The defining
      2026-relevant event is the February 2025 GI Partners and TA Associates majority recapitalization,
      reported at an implied enterprise value near $1.5B, which provided liquidity to founders, management,
      and early venture backers while injecting growth capital. Deal size and any associated debt or
      credit facilities were not disclosed, and private-equity control typically layers in leverage and a
      defined return timeline, so the post-recap balance sheet — cash on hand, any acquisition debt, and
      covenant obligations — is a material unknown. Egnyte's stated liquidity path is an eventual IPO rather
      than repeated primary raises, consistent with a business that funds itself from operations. On the
      evidence available, financing dependency looks low for operating continuity but the use of PE leverage,
      next-round or refinancing triggers, and any project or venture debt cannot be confirmed from public
      sources and form the core capital-structure diligence items.
    claimRefs: [CI020, CI021, CI022, CI023, CI024, CI028, CI029]
    tableRefs: [TI004]
    figureRefs: [FI004]
  - id: disclosure-gaps
    title: "Public Traction Versus Private-Metric Gaps"
    body: >-
      Egnyte publishes only a narrow band of hard operating metrics — 23,000-plus business customers across
      112 countries on its homepage (its customer-stories page cites a slightly lower 22,000-plus) — while
      the financial figures that matter for underwriting are either third-party estimates or wholly
      undisclosed. Revenue is the clearest conflict: GetLatka estimates about $128M annualized as of
      September 2025, while other trackers and self-reported commentary claim Egnyte crossed $300M ARR, a
      roughly two-fold spread this analysis treats as an unresolved conflicting metric rather than a settled
      number. Growth is not officially reported; the most credible external anchor remains a 2023 estimate
      of a "$200M company growing around 25% a year," now stale. Gross margin, net revenue retention, CAC,
      payback, burn, cash balance, and churn are entirely private. Headcount is likewise unconfirmed:
      workforce trackers put staff at roughly 1,000-1,300 people, which the company does not publish. The
      throughline is a long-standing disclosure posture — Egnyte marked "Decline to Disclose" on revenue in
      its 2011 SEC Form D and has never filed audited public financials — so each missing metric below
      carries a specific data-room diligence path rather than a public answer.
    claimRefs: [CI030, CI031, CI032, CI033, CI034, CI035, CI036, CI025]
    tableRefs: [TI005]
  - id: financial-verdict
    title: "Financial Verdict: Revenue Quality, Margin Path, and Diligence Blockers"
    body: >-
      On revenue quality, Egnyte scores well: income is recurring, subscription-based, contractually annual,
      diversified across tens of thousands of accounts and multiple regulated verticals, and anchored by
      sticky governance and compliance workflows that resist rip-and-replace. On margin path, the comp-based
      read is constructive — a mature content-platform peer earns ~82% gross and ~28% operating margins, and
      Egnyte's cash-flow-positive, capital-efficient history suggests it operates profitably, if likely a
      few points below Box on gross margin due to hybrid architecture and channel mix. On capital intensity,
      the business is light: software delivery with modest edge-hardware and no heavy capex or inventory,
      funded largely from operations rather than serial dilution. The decisive weakness is disclosure. The
      absence of audited revenue, growth, gross margin, NRR, CAC/payback, cash, and burn — compounded by a
      two-fold public ARR conflict and PE-deal terms that were never released — means the investment case
      rests on estimates and comparables. Adverse signals (renewal-price complaints, difficult
      cancellations, and a "steady, not premium" ~5-6x ARR PE multiple) temper the growth narrative. The
      verdict: a financially healthy, capital-efficient private compounder whose quality is credible but
      whose exact economics are unauditable from outside, making data-room access the gating condition for
      any valuation or underwriting conclusion.
    claimRefs: [CI037, CI038, CI039, CI040, CI017, CI013, CI032]
    figureRefs: []
