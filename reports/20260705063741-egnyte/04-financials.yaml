callouts:
  - calloutType: strength
    title: "Capital-Efficient, Cash-Generative Compounder"
    body: >-
      Reaching an estimated $100M-$200M+ ARR on ~$138M of venture equity while claiming cash-flow-positive
      operations since 2016 is a rare efficiency profile that lowers financing dependency and dilution risk.
    claimRefs: [CI013, CI022]
  - calloutType: risk
    title: "Two-Fold Revenue Conflict and Zero Audited Disclosure"
    body: >-
      A $128M-vs-$300M ARR spread and the total absence of audited revenue, margin, retention, and cash data
      mean the financial case rests on estimates; the exact economics are unauditable from public sources.
    claimRefs: [CI030, CI031]
  - calloutType: risk
    title: "PE Control and Renewal-Pricing Pressure"
    body: >-
      Private-equity majority ownership plus documented complaints about renewal price increases and difficult
      cancellations create a risk that monetization is pushed harder on customers post-recapitalization.
    claimRefs: [CI023, CI026]
  - calloutType: assumption
    title: "Margins Are Box-Comp Proxies, Not Disclosures"
    body: >-
      Gross and operating margin ranges are inferred from Box's public financials; Egnyte's hybrid architecture
      and channel mix likely place it a few points lower, but this must be confirmed in a data room.
    claimRefs: [CI016, CI017]
