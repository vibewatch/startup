  topStrengths:
    - Profitable and capital-efficient — cash-flow positive since 2016 on only ~$138M raised
    - Founder-led continuity with all four co-founders still in senior roles after 18+ years
    - Differentiated depth in regulated verticals (AEC, life sciences, financial services)
    - Unified platform spanning collaboration, governance/security, and AI over private content
    - 23,000+ businesses across 112 countries provide a broad, sticky installed base
  topRisks:
    - Structural bundling pressure from Microsoft 365 (SharePoint/OneDrive) and Google Workspace
    - Opaque private financials with a 2x-conflicting revenue estimate ($128M vs ~$250-300M)
    - Private-equity control may raise renewal pricing and reprioritize roadmap post-buyout
    - Key-person dependence on long-tenured founder-CEO Vineet Jain
    - Persistent customer complaints on desktop-sync performance and renewal friction
  unresolvedGaps:
    - Audited ARR, revenue growth, gross margin, and NRR/churn are undisclosed
    - February 2025 deal size, ownership split, and preference stack are undisclosed
    - Official current headcount and customer count reconciliation (23,000+ vs 22,000+/16,000+)
    - Customer/vertical revenue concentration and net retention are unknown
