summary:
  headline: >-
    Egnyte is a rare profitable, founder-led content platform with durable regulated-vertical niches, but its ~$1.5B
    PE-era valuation, opaque financials, and structural exposure to Microsoft/Google bundling warrant close monitoring
    rather than conviction.
