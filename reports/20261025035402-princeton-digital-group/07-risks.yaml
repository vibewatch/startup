      rows:
        - label: "Cyber intrusion or APT"
          values: ["High", "High", "Medium", "High"]
        - label: "Singapore licensing and efficiency rules"
          values: ["High", "High", "Low to medium", "High"]
        - label: "Outage or continuity failure"
          values: ["Medium", "High", "Medium", "Medium"]
        - label: "Project financing and covenant stress"
          values: ["Medium", "High", "Low", "High"]
        - label: "Power, permitting, and energization delay"
          values: ["Medium", "High", "Medium", "Medium to high"]
        - label: "Certification or control-scope gap"
          values: ["Medium", "Medium", "Low", "Medium"]
    claimRefs: [CR003, CR009, CR011, CR012, CR014, CR015]

callouts:
  - calloutType: risk
    title: Highest-conviction risk
    body: Regulatory and cyber obligations are becoming more prescriptive in Singapore, while PDG-specific licensing scope, incident history, and recovery performance remain unverified in public sources.
    claimRefs: [CR009, CR011, CR012, CR014]
  - calloutType: recommendation
    title: Diligence gate before underwriting
    body: Require site-level licences, audit reports, uptime and incident logs, project-finance covenants, and preference terms before treating expansion capital as evidence of durable risk-adjusted returns.
    claimRefs: [CR006, CR009, CR014, CR015]

