callouts:
  - calloutType: strength
    title: Institutional backing and scale
    body: "The evidence supports a sponsor-backed platform with more than 1.1 GW described in a 2025 Stonepeak announcement and a USD 1.3 billion preferred-equity investment closed in August 2025."
    claimRefs: [CO003, CO008]
  - calloutType: risk
    title: Financing and information risk
    body: "The proposed USD 5 billion debt program and capital-intensive campus pipeline increase the importance of obtaining leverage, covenant, utilization, customer, and realized-economics data before relying on headline scale."
    claimRefs: [CO015, CO017]
  - calloutType: recommendation
    title: Underwrite the private terms, not the headline metrics
    body: "Treat the platform identity and financing history as established, but make valuation and recommendation contingent on lender-quality financials, the cap table, preferred-equity terms, and tenant-level operating evidence."
    claimRefs: [CO008, CO009, CO017]
