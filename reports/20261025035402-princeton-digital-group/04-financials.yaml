schemaVersion: "report-v2"
artifact: financials
slug: princeton-digital-group
runDate: 2026-10-25
company:
  name: Princeton Digital Group
chapter:
  number: 4
  title: Financials
  summary: >-
    Princeton Digital Group has disclosed large financing and project-capacity figures, but not
    realized revenue, pricing, profitability, occupancy, cash, or leverage. The underwriting case
    therefore rests on a plausible long-duration infrastructure model whose revenue quality and
    capital adequacy cannot yet be verified from public evidence.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      PDG supplies the physical space, power, and cooling needed for large-scale cloud and AI
      computing, with public descriptions positioning hyperscalers and enterprises as the customer
      base. Industry reporting describes the wholesale model as leasing capacity under long-term
      contracts, often 10 to 12 years, which can make cash flows financeable; that tenor is an
      industry observation, not a disclosed PDG contract term. The retained sources do not reveal
      PDG's realized price per MW, kW, rack, or campus, nor revenue mix, escalation clauses,
      discounts, pass-through power charges, or recognition policy. Revenue quality is therefore
      plausible but unverified: physical capacity and long contracts can support recurring revenue,
      yet the public record cannot establish contracted backlog, customer concentration, or
      collectability.
    claimRefs: [CI001, CI002, CI005, CI016]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: capital-intensity-and-financing
    title: Capital intensity and financing dependency
    body: >-
      PDG's buildout is capital intensive before it is revenue producing. The 120 MW JC3 campus was
      announced with USD 1 billion of investment, implying roughly USD 8.3 million per announced MW
      before adjusting for land, phasing, financing, fit-out scope, or timing. In 2025 the company
      said it raised USD 2.5 billion across preferred equity and debt, while Stonepeak later reported
      closing its USD 1.3 billion preferred investment. In 2026, reporting said PDG planned as much
      as USD 5 billion of additional debt, with more than USD 4 billion potentially tied to specific
      assets and roughly USD 750 million at parent level. These are financing amounts or intentions,
      not cash-on-hand, available runway, or evidence that each facility will earn its cost of
      capital.
    claimRefs: [CI003, CI004, CI006, CI007, CI008, CI009, CI010, CI011]
    tableRefs: [TI003]
  - id: public-traction-proxies
    title: Public traction proxies are capacity, not utilization
    body: >-
      Public traction is expressed mainly through portfolio and facility capacity rather than
      financial output. MLQ tracks 10 facilities totaling about 0.5 GW across six countries,
      explicitly combining operational, under-construction, and planned sites. Baxtel describes more
      than 20 facilities and reports power growth of 164% since 2022, while other reporting cites a
      portfolio exceeding 1.8 GW. These measures have different coverage and development-status
      denominators, so they should not be combined or treated as occupied capacity. Tracxn separately
      reports USD 2.16 billion of total funding over six rounds and a May 2026 debt round with the
      amount withheld. Capacity expansion and financing access demonstrate scale, but neither proves
      revenue, utilization, or positive unit economics.
    claimRefs: [CI003, CI012, CI013, CI014]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The financial profile is consistent with a long-duration infrastructure platform: potentially
      contracted revenue sits against large upfront development costs, operating expenses, and debt
      service. The main risk is timing. An industry analysis notes that PDG has committed USD 2.5
      billion to India and frames future occupancy as the test of whether hyperscaler demand arrives
      on schedule. That risk becomes more consequential alongside the planned 2026 debt program.
      Without campus-level occupancy, contracted MW, tenant concentration, revenue, EBITDA, power
      pass-throughs, maintenance capex, cash, net debt, covenants, and recourse waterfalls, investors
      cannot calculate gross margin, debt-service coverage, payback, burn, or runway. The appropriate
      verdict is financially credible but not underwriteable from public metrics alone.
    claimRefs: [CI003, CI004, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Revenue quality
      - Diligence ask
    rows:
      - [Hyperscale capacity leasing, "Physical space, power, and cooling for large-scale compute", "MW, kW, rack, or contracted campus", "Core model supported; realized mix undisclosed", "Potentially recurring under long-term contracts; PDG tenor unverified", "Provide contracted MW, tenant schedule, term, escalators, and renewal rights"]
      - [Enterprise colocation, "Data-center capacity for enterprise workloads", "Rack, cage, suite, or kW", "Enterprise customer segment named; contribution undisclosed", "Unknown because pricing and customer mix are private", "Provide enterprise revenue, churn, utilization, and average contract value"]
      - [Power and cooling pass-throughs, "Utility and cooling inputs billed within or alongside capacity", "kWh, kW, or contractual pass-through", "No retained source discloses PDG treatment", "Unknown margin and commodity exposure", "Provide tariff formula, hedging, pass-through lag, and gross-margin treatment"]
      - [Interconnection or ancillary services, "Potential connectivity and facility services", "Port, cross-connect, service, or fixed fee", "No retained source verifies a separate PDG stream", "Unverified; excluded from the base case", "Provide product list, pricing, attach rate, and revenue contribution"]
    notes: >-
      Partial public-evidence map as of 2026-10-25; unknown rows are not assumed to be zero, and
      industry contract characteristics are not presented as PDG-specific terms.
    claimRefs: [CI001, CI002, CI005, CI016]
  - id: TI002
    title: Pricing and monetization disclosure
    columns:
      - Pricing item
      - Public value
      - List vs. realized
      - Discounts / unknowns
      - Underwriting implication
    rows:
      - ["Capacity price per MW or kW", null, "Neither list nor realized pricing disclosed", "Geography, density, term, and power-cost adjustments unknown", "Cannot derive revenue from announced MW"]
      - ["Rack, cage, or suite price", null, "No public PDG rate card retained", "Volume and anchor-tenant discounts unknown", "Enterprise colocation contribution cannot be modeled"]
      - ["Contract tenor and escalation", null, "Industry reporting cites 10-12 years, not a PDG term", "Renewal, CPI, power, and minimum-commit terms unknown", "Revenue durability and inflation protection remain unverified"]
      - ["Backlog or contracted capacity", null, "No disclosed contracted-revenue value", "Cancellation rights and commencement dates unknown", "Pipeline capacity cannot be treated as booked revenue"]
    notes: >-
      Null means unavailable in the assigned retained sources, not zero; the 10-12 year observation
      describes sector financing practice and is not a PDG pricing disclosure.
    claimRefs: [CI005, CI016]
  - id: TI003
    title: Unit economics and capital adequacy
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Specific diligence ask
    rows:
      - ["JC3 announced capex per announced MW", "Approximately USD 8.3M/MW", Medium, "Project-level capital-intensity proxy only", "Reconcile land, shell, MEP, fit-out, financing, phase timing, and customer contributions"]
      - ["Revenue or ARR", null, Low, "Required to connect capacity to financial traction", "Provide audited revenue by country, campus, and service for 2024-2026"]
      - ["Gross margin and EBITDA margin", null, Low, "Required to test power pass-through and operating leverage", "Provide campus contribution margin, corporate EBITDA, and normalization bridge"]
      - ["Occupancy / contracted utilization", null, Low, "Determines whether developed capacity earns a return", "Provide live, contracted, reserved, and available MW by campus with service dates"]
      - ["Cash, burn, and runway", null, Low, "Funding raised is not cash available", "Provide unrestricted cash, committed equity, monthly corporate burn, and 24-month sources-and-uses"]
      - ["Net debt, debt service, and covenants", null, Low, "Required to assess parent and project solvency", "Provide debt schedule, rates, maturities, DSCR covenants, guarantees, recourse, and cash waterfalls"]
    notes: >-
      The USD 8.3M/MW figure is a simple USD 1B divided by 120 MW estimate; all nulls are
      undisclosed, not zero, and financing announcements do not establish liquidity or runway.
    claimRefs: [CI003, CI004, CI006, CI007, CI009, CI011, CI014, CI015, CI016]
figures:
  - id: FI001
    title: Revenue-to-cash bridge requiring private inputs
    type: flow
    summary: >-
      The operating bridge is structurally plausible, but public evidence stops before realized
      pricing, utilization, cost, and debt-service outcomes.
    data:
      nodes:
        - id: demand
          label: Hyperscaler and enterprise demand
          detail: Customer demand is identified publicly, but concentration is not.
        - id: contracting
          label: Contracted capacity
          detail: Contracted MW, tenor, backlog, and commencement schedule are undisclosed.
        - id: development
          label: Development capex
          detail: Campus construction precedes service; JC3 was announced at USD 1B for 120 MW.
        - id: delivery
          label: Space, power, and cooling
          detail: PDG delivers the physical infrastructure required for large-scale computing.
        - id: revenue
          label: Recurring lease revenue
          detail: Realized pricing, escalators, discounts, and revenue recognition are undisclosed.
        - id: operating-cost
          label: Power and operating costs
          detail: Power pass-through, staffing, maintenance, and gross margin are undisclosed.
        - id: financing
          label: Debt service and residual cash
          detail: Parent and project debt terms, covenants, and distributable cash are undisclosed.
      edges:
        - from: demand
          to: contracting
        - from: contracting
          to: development
        - from: development
          to: delivery
        - from: delivery
          to: revenue
        - from: revenue
          to: operating-cost
        - from: operating-cost
          to: financing
    approximationNotes: >-
      Analytical sequence only; it does not quantify PDG conversion rates, margins, cumulative cash,
      or contract terms.
    claimRefs: [CI001, CI003, CI004, CI009, CI010, CI011]
callouts:
  - calloutType: risk
    title: Funding is not runway
    body: >-
      Equity and debt announcements evidence access to capital, but they do not disclose unrestricted
      cash, undrawn commitments, project-level restrictions, burn, or the timing of customer receipts.
    claimRefs: [CI003, CI004, CI006, CI007, CI016]
  - calloutType: recommendation
    title: Underwrite at campus level
    body: >-
      Require a campus-by-campus sources-and-uses, contracted-MW schedule, tenant concentration,
      contribution margin, debt package, and downside occupancy case before assigning a valuation.
    claimRefs: [CI009, CI010, CI015, CI016]
