company:
  name: Princeton Digital Group
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    PDG sells physical digital-infrastructure capacity and related facility services rather than
    a software product. Public evidence supports specific power, cooling, connectivity, security,
    and liquid-cooling capabilities at named sites, but the wider portfolio mixes operating and
    pre-operational assets and lacks site-by-site performance disclosure.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      PDG's product is a facility-and-operations service for hyperscalers and enterprises that need
      power, cooling, physical space, network access, and on-site support. The Open Compute Project
      listing for SG1 enumerates hyperscale data center, wholesale colocation, build-to-suit,
      on-demand data center, colocation, technical, connectivity, and workplace services, and
      describes the facility as carrier- and cloud-neutral. That breadth gives PDG several ways to
      package capacity, from a tailored large deployment to a supported colocation footprint, but
      the public material does not disclose product-level pricing, contracted megawatts, occupancy,
      service-level performance, or attach rates for ancillary services. Portfolio boundaries also
      vary by tracker: ArusGrid counts nine active projects in four countries, while DC Atlas counts
      23 facilities across 16 markets in seven countries. These are useful operating maps, not a
      reconciled asset register or evidence that every listed facility has the same product scope.
    claimRefs: [CE001, CE002, CE003, CE004, CE005]
    tableRefs: [TE001, TE002]
  - id: operating-architecture
    title: Facility architecture and technical differentiation
    body: >-
      The clearest technical evidence is site-specific. SG1 is described with two diverse 22 kV
      utility supplies, N+1 diesel generation for IT load, distributed redundant UPS, water-cooled
      chillers, CRAC units on 2N power, two fiber-entry vaults separated by 180 metres, biometric
      access, continuous guards, alarm monitoring, fire suppression, and on-site engineers. Its
      listed accreditations include SOC1 Type 2, SOC2 Type 2, ISO 9001, ISO 27001, ISO 45001, and
      TVRA. Structure Research adds a separate proof point: TY1 in Tokyo earned NVIDIA DGX-Ready
      partner certification for liquid-cooling capability. DataM Intelligence describes planned
      AI-ready capacity at MU1 and CH1, but planned capacity is not commissioned capacity. The
      defensible differentiation is therefore execution around scarce land, power, cooling, fiber,
      and facility operations; the available evidence does not establish proprietary hardware,
      software, or a fleet-wide technical specification.
    claimRefs: [CE006, CE007, CE008, CE009, CE010, CE011, CE012]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-dependencies
    title: Maturity, deployment dependencies, and diligence risks
    body: >-
      Public trackers show why pipeline and operating product must be separated. ArusGrid reports
      1,146 MW of planned IT load but only 80 MW of disclosed running capacity across its nine-project
      scope; it classifies two projects as operational, one as operational and expanding, two under
      construction, one at land and permitting, and three as announced. It also reports confirmed
      AI workloads at three sites and explicitly says that undisclosed tenants reveal nothing about
      occupancy. DC Atlas reports a broader 450+ MW of live capacity but flags 14% of that live
      capacity as estimated, demonstrating a material methodology gap rather than a clean conflict.
      Mingtiandi's report that PDG opened a 96 MW first Japan campus adds evidence of delivery, while
      Stonepeak's description of greenfield development and M&A shows that integration and build
      execution remain central dependencies. Current Singapore vacancies for critical-facilities
      maintenance and building-management-system engineering are a practitioner-signal proxy, not
      proof of staffing sufficiency, uptime, or incident performance.
    claimRefs: [CE003, CE004, CE005, CE013, CE014, CE015, CE016]
