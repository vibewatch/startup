      whyItMatters: >-
        Inconsistent boundaries can cause double counting or the treatment of announced and estimated
        capacity as commissioned product.
      diligencePath: >-
        Reconcile every campus against a company asset schedule with ownership, IT load, contracted
        power, commissioning date, operating status, and tracker aliases.
      relatedQuestionRefs: [QE002, QE008]
    - type: missing-source
      severity: minor
      topic: practitioner-signal
      missingEvidence: >-
        Public engineering talks, operating papers, technical repositories, or practitioner-community
