      - ["On-demand and standard colocation", "Enterprise and regional infrastructure buyers", "Named as an SG1 offering", "Flexible capacity plus facility operations", "Minimum commitments, utilization, renewal, and realized service levels"]
      - ["Connectivity and technical services", "Tenants needing network and operational support", "Named as SG1 offerings", "Diverse fiber entry and on-site engineering", "Carrier mix, cross-connect economics, and response-time results"]
      - ["AI-ready and liquid-cooled capacity", "AI and high-performance-computing users", "Certified at TY1 and planned or confirmed at selected sites", "Named liquid-cooling certification and high-density positioning", "Portfolio-wide rack density, thermal performance, and commissioned capacity"]
    notes: >-
      Status is based on named-site descriptions and third-party portfolio trackers; no row implies
      uniform availability across the portfolio, and the diligence-gap column records unavailable data.
    claimRefs: [CE001, CE002, CE010, CE011, CE013]
  - id: TE002
    title: Customer workflow and use-case table
    columns: [user job, current workflow, PDG solution, measurable public signal, limitation]
    rows:
      - ["Secure data-center capacity", "Select market, power envelope, space, and commissioning date", "Wholesale, build-to-suit, or colocation capacity", "Multiple operating and planned facilities appear in independent trackers", "Tracker scope differs and contracted occupancy is undisclosed"]
      - ["Connect production workloads", "Provision diverse carrier and fiber routes", "Carrier-neutral facilities and connectivity services", "SG1 lists two fiber-entry vaults with 180 m separation", "Portfolio-wide carrier routes and network SLAs are unavailable"]
      - ["Maintain power continuity", "Operate grid feeds, UPS, and backup generation", "Redundant facility power systems", "SG1 lists two diverse 22 kV supplies, distributed redundant UPS, and N+1 generators", "Independent uptime and failover-test results are unavailable"]
      - ["Cool high-density compute", "Match rack density to thermal and water constraints", "Water-cooled, CRAC, and selected liquid-cooling capability", "TY1 has a named NVIDIA DGX-Ready liquid-cooling certification", "Certification does not establish fleet-wide density or operating efficiency"]
      - ["Operate and support the facility", "Monitor building systems and maintain critical equipment", "On-site engineers, guards, alarms, and technical services", "Current Singapore maintenance and BMS-engineer vacancies indicate active operating functions", "Vacancies do not establish staffing levels or service outcomes"]
    notes: >-
      Public signals describe design or operating functions, not verified customer benefits; missing
      tenant-level outcomes, SLA attainment, and incident data remain diligence items.
    claimRefs: [CE003, CE006, CE007, CE008, CE010, CE016]
  - id: TE003
    title: Technology and operating architecture table
    columns: [layer or process, role, disclosed dependency, principal risk]
    rows:
      - ["Site and grid", "Provide location and primary power", "Land, permits, grid connection, and contracted supply", "Announced or permitting capacity may not reach service on schedule"]
      - ["Power continuity", "Maintain IT load through utility disruption", "Diverse feeds, UPS, generators, fuel, and maintenance", "SG1 design cannot be generalized to every site"]
      - ["Cooling", "Remove heat from conventional and high-density workloads", "Chillers, CRAC, liquid-cooling equipment, water, and operator expertise", "Portfolio PUE, water use, and thermal limits are not disclosed"]
      - ["Connectivity", "Provide resilient network access", "Fiber routes, carriers, meet-me infrastructure, and local rights-of-way", "Route diversity and SLA performance are site-specific"]
      - ["Physical and safety controls", "Protect access and respond to fire or alarms", "Guards, biometrics, monitoring, suppression, and tested procedures", "Public incident and remediation history is unavailable"]
      - ["Operations and compliance", "Run facilities and maintain control frameworks", "Engineers, BMS processes, audits, and certification scope", "Named SG1 credentials do not prove portfolio-wide control coverage"]
    notes: >-
      SG1 supplies the detailed architecture evidence, TY1 supplies the liquid-cooling certification,
      and tracker data supplies project stages; dependencies and risks are analytical implications.
    claimRefs: [CE004, CE006, CE007, CE008, CE009, CE010, CE016]
figures:
  - id: FE001
    title: Disclosed product and facility architecture
    type: stack
    summary: >-
      The public operating stack connects scarce site inputs to resilient facility systems and
      customer-facing capacity, with evidence strength varying by named site.
    data:
      layers:
        - label: Site and permits
          detail: Physical location and development authority
          modules:
            - "Inputs: land, permitting, campus design, and commissioning milestones"
            - "Evidence boundary: tracker stages range from operational to announced"
        - label: Grid and primary power
          detail: Utility capacity for IT load
          modules:
            - "Inputs: grid connection, substations, and contracted energy"
            - "Named proof: SG1 lists two diverse and redundant 22 kV supplies"
        - label: Resilience systems
          detail: Continuity through power or equipment failure
          modules:
            - "Systems: distributed redundant UPS and N+1 diesel generation at SG1"
            - "Evidence boundary: independent failover and uptime results are not public"
        - label: Cooling and density
          detail: Thermal support for conventional and AI workloads
          modules:
            - "Systems: water-cooled chillers and CRAC are listed at SG1"
            - "Named proof: TY1 has NVIDIA DGX-Ready liquid-cooling certification"
        - label: Connectivity and controls
          detail: Network access, physical protection, and safety
          modules:
            - "Systems: diverse fiber, biometrics, guards, alarms, and fire suppression"
            - "Evidence boundary: the detailed control set is site-specific"
        - label: Customer capacity and services
          detail: Sellable infrastructure and operational support
          modules:
            - "Products: wholesale, build-to-suit, on-demand, and colocation capacity"
            - "Services: connectivity, technical support, and workplace services"
    approximationNotes: >-
      This is a conceptual ordering of disclosed components, not a claim that every PDG facility
      contains every module or that the layers represent a proprietary technical stack.
    claimRefs: [CE001, CE002, CE006, CE008, CE010, CE016]
callouts:
  - calloutType: strength
    title: Named-site technical proof
    body: >-
      SG1 has unusually concrete public facility specifications, while TY1 contributes a separate,
      named liquid-cooling certification.
    claimRefs: [CE006, CE007, CE008, CE009, CE010]
  - calloutType: risk
    title: Pipeline is not operating maturity
    body: >-
      Planned megawatts, announced projects, and design claims should not be treated as commissioned,
      occupied, or SLA-performing capacity.
    claimRefs: [CE003, CE004, CE005, CE013]
