      missingEvidence: >-
        Site-level commissioned capacity, occupancy, uptime, PUE, water use, outage history,
        incident remediation, and service-level attainment.
      whyItMatters: >-
        Design redundancy and planned megawatts do not establish realized reliability, efficiency,
        customer adoption, or revenue-generating maturity.
      diligencePath: >-
        Obtain three years of campus-level commissioning, capacity, occupancy, uptime, PUE, water,
        outage, root-cause, remediation, and SLA-credit records.
      relatedQuestionRefs: [QE004, QE007, QE008]
    - type: missing-source
      severity: material
      topic: security-and-compliance
      missingEvidence: >-
        Current certificate scope, control exceptions, penetration-test results, cyber incidents,
        data-residency terms, and disaster-recovery tests for each operating legal entity and campus.
      whyItMatters: >-
        SG1's listed controls and accreditations cannot be generalized to facilities in other
        countries or to assets obtained through development and M&A.
      diligencePath: >-
        Review current SOC reports, ISO certificates and scope statements, penetration summaries,
        incident logs, recovery tests, and customer security schedules by site.
      relatedQuestionRefs: [QE006, QE007]
    - type: enumeration-incomplete
      severity: material
      topic: portfolio-maturity
      missingEvidence: >-
        A reconciled asset register explaining tracker differences in site count, country coverage,
