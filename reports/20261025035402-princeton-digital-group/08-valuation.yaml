      severity: blocking
      topic: valuation
      missingEvidence: "Current post-money valuation, cap table, preferred-equity conversion, dividend, liquidation preference, and governance terms."
      whyItMatters: "The USD 1.3 billion preferred investment cannot be translated into common-equity value or downside protection without its terms."
      diligencePath: "Obtain the executed Stonepeak investment agreement, capitalization table, investor-rights agreement, and latest board valuation."
      relatedQuestionRefs: [QV003, QV007]
    - type: private-evidence-only
      severity: blocking
      topic: operating-economics
      missingEvidence: "Campus-level contracted MW, occupancy, revenue, EBITDA, pricing, customer concentration, and renewal profile."
      whyItMatters: "Capacity and capital raised are not revenue or cash flow, so public scale claims cannot support a valuation multiple."
      diligencePath: "Request audited financial statements and a campus-by-campus operating KPI schedule with customer and contract-tenor detail."
      relatedQuestionRefs: [QV002, QV004, QV005, QV008]
    - type: missing-source
      severity: material
      topic: exit
      missingEvidence: "Evidence of a credible exit route, recent secondary pricing, IPO preparation, or strategic-sale process."
      whyItMatters: "Illiquidity and exit timing materially affect a private infrastructure investment's target return."
      diligencePath: "Ask sponsors for exit scenarios, recent secondary marks, sale comparables, and any board-approved liquidity plan."
      relatedQuestionRefs: [QV006]
    - type: missing-source
      severity: material
      topic: debt
      missingEvidence: "Project-level debt covenants, recourse, DSCR thresholds, maturity schedule, and parent-level sustainability-linked loan terms."
      whyItMatters: "The planned debt program can transfer construction and lease-up risk to common equity if cash flows lag."
      diligencePath: "Review financing commitments, covenant packages, security documents, hedging, and downside cases for each major campus."
      relatedQuestionRefs: [QV003, QV007, QV008]
