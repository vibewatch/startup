company:
  name: Princeton Digital Group
chapter:
  number: 8
  title: Valuation
  summary: "Public evidence supports PDG as a scaled, capital-backed APAC hyperscale infrastructure platform, but it does not disclose the operating economics or current transaction price needed for a narrow valuation. The appropriate stance is research-more: preserve upside exposure to AI-led demand while requiring occupancy, leverage, preference, and cash-flow evidence before underwriting."
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      PDG's investment case is an infrastructure-scale growth thesis rather than a software-multiple thesis. The
      company describes a six-country operating footprint, while independent and industry sources describe more than
      20 assets and a wholesale model serving hyperscalers. Stonepeak's completed USD 1.3 billion preferred-equity
      investment and PDG's reported USD 1.2 billion debt financing show institutional willingness to fund expansion,
      but they do not disclose revenue, EBITDA, occupancy, or the liquidation-preference economics that determine
      common-equity value. The 500 MW powered-land acquisition and the Jakarta 120 MW campus demonstrate a
      substantial development pipeline, yet also increase execution and financing exposure. The anti-thesis is
      therefore concrete: a large capital program can create value only if hyperscaler demand converts into contracted,
      occupied capacity at returns above the cost of capital. The available evidence does not yet verify that conversion.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
    tableRefs: [TV001, TV002]
  - id: valuation-discipline
    title: Price discovery and entry discipline
    body: >-
      The public price signal is incomplete. Mingtiandi reports that earlier discussions contemplated a transaction
      potentially valuing PDG at about USD 4 billion, but the source describes that figure as a reported potential
      transaction value rather than a completed valuation. The later Stonepeak release confirms the USD 1.3 billion
      preferred investment but gives no post-money valuation, conversion terms, dividend or liquidation preference.
      Comparing PDG with listed infrastructure operators is also constrained because PDG does not publish a revenue
      base in the retained evidence. Equinix's October 2026 TTM price-to-sales page reports a P/S ratio of 9.46 in
      its headline, while another line on the same page reports 6.44 as current; that internal inconsistency makes it
      a directional market reference, not a clean multiple input. Entry discipline should therefore be staged:
      require the cap table and preferred terms, then test contracted MW, occupancy, revenue and project-level leverage
      before accepting any implied valuation.
    claimRefs: [CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV003]
  - id: scenarios-and-triggers
    title: Scenarios, exit readiness, and thesis-break triggers
    body: >-
      Scenario analysis should be anchored to capacity conversion and financing, not invented revenue forecasts. In
      the bull case, the 500 MW expansion and 120 MW Jakarta campus reach service on schedule, hyperscaler contracts
      absorb the powered capacity, and long-duration infrastructure financing supports attractive equity returns. The
      base case assumes demand remains strong but commissioning and occupancy occur in stages, requiring disciplined
      leverage and continued sponsor support. The bear case is a timing and capital-structure problem: PDG raises
      substantial debt against projects whose contracted demand or cash flow is delayed, leaving capital tied up while
      preferred claims and interest reduce common-equity optionality. Exit readiness is not publicly demonstrated;
      the company remains private and the evidence does not establish a sale, IPO, or transparent secondary market.
      The thesis should break if contracted MW, occupancy, project-level debt service, or commissioning milestones
      miss agreed thresholds. Those are diligence asks, not facts inferred from the public record.
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
    figureRefs: [FV001]
callouts:
  - calloutType: recommendation
    title: Research-more at a price-sensitive entry
    body: Public evidence supports scale and sponsor access, but not a sufficiently verified price, earnings base, or preference stack for a buy recommendation.
    claimRefs: [CV007, CV008, CV009, CV016]
  - calloutType: risk
    title: Capital conversion is the gating risk
    body: The central underwriting question is whether funded and planned MW becomes contracted, occupied cash-generating capacity before leverage and preferred claims constrain equity returns.
    claimRefs: [CV005, CV012, CV014, CV015]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence boundary, Decision implication]
    rows:
      - [Recommendation, research-more, "Scale and financing are evidenced; current price and operating economics are not.", "Proceed only with price and cap-table diligence."]
      - [Confidence, medium, "Multiple sources corroborate financing and capacity, but private-company disclosure is limited.", "Do not treat the public record as a complete underwriting file."]
      - [Risk rating, high, "Execution, leverage, occupancy, and preference exposure remain material.", "Require milestone and debt-service monitoring."]
      - [Valuation stance, unknown, "A potential USD 4 billion transaction value was reported, not confirmed as a completed valuation.", "No precise entry price should be endorsed."]
      - [Decision implication, track, "Institutional backing and APAC demand merit continued diligence.", "Reassess when audited KPIs and terms are available."]
    notes: "Based on retained public sources through 2026-10-25; null or undisclosed operating metrics are not treated as zero."
    claimRefs: [CV001, CV007, CV008, CV009, CV010, CV016]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view, Current implication]
    rows:
      - ["APAC hyperscale demand can support growth", "Stonepeak and PDG describe expansion across APAC; PDG has six-country presence.", "Signed tenant contracts and occupancy by campus.", "Positive but not yet cash-flow verified."]
      - ["Institutional capital validates financing access", "Stonepeak closed USD 1.3 billion of preferred equity; 2025 capital raised was reported at USD 2.5 billion including debt.", "Full preferred terms, covenants, and cash-flow waterfall.", "Financing access is a strength, not proof of common value."]
      - ["Powered land creates an option on AI growth", "PDG announced 500 MW of powered land and a USD 5 billion investment program.", "Permits, contracted power, construction budget, and tenant commitments.", "Pipeline expands upside and execution risk together."]
      - ["Scale can outrun demand conversion", "The India analysis says 1 GW would require hyperscaler absorption and notes timing risk.", "Occupancy, contracted MW, and realized pricing over the next two to three years.", "Bear case remains material."]
      - ["Public-market multiples are not directly portable", "PDG revenue is undisclosed; Equinix P/S data is internally inconsistent on the retained page.", "Comparable revenue, EBITDA, growth, and leverage definitions.", "Use comparables only as a sensitivity range."]
    notes: "Rows separate company or investor assertions from independent observations; each change condition is a diligence requirement rather than an observed fact."
    claimRefs: [CV002, CV003, CV004, CV005, CV006, CV010, CV012, CV013, CV014, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Explicit assumptions, Valuation / return logic, Key risks, Probability signal]
    rows:
      - [Bull, "500 MW expansion and JC3 commission on schedule; hyperscaler contracts convert planned capacity into high occupancy; leverage remains asset-backed.", "Value supported by contracted cash flow and infrastructure-like exit multiples; exact return is unavailable without revenue and terms.", "Construction delay, power delivery, tenant concentration.", "Upside case; evidence-supported directionally, not quantified."]
      - [Base, "Demand grows, but commissioning and occupancy ramp in stages; additional debt is raised selectively and sponsor support continues.", "Value depends on achieved occupancy, project-level DSCR, and preferred-equity seniority; no precise range is supportable.", "Refinancing, slower lease-up, margin compression.", "Most defensible pending KPI disclosure."]
      - [Bear, "Demand or commissioning slips while debt and preferred claims accrue against partially utilized assets.", "Common-equity value can be impaired by delayed cash generation, leverage, and preference overhang.", "Down-round, covenant pressure, stranded powered land.", "Material downside; timing risk is explicitly identified in retained analysis."]
      - [Exit-readiness gate, "A sale, IPO, or transparent secondary market is not established in the retained evidence.", "No liquidity discount or target return can be calculated responsibly.", "Opaque cap table and limited disclosure.", "Open diligence question."]
    notes: "Scenarios are qualitative because public sources do not provide verified revenue, EBITDA, occupancy, cap-table terms, or a completed current valuation."
    claimRefs: [CV005, CV007, CV008, CV009, CV012, CV014, CV015, CV016]
