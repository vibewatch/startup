      - [Status quo/self-build, "Internal campus development or incumbent colocation", "Unrelated real estate", "Customer infrastructure organization", "Substitute that limits PDG pricing power"]
    notes: >-
      Boundary is an analytical classification based on PDG's facility-service
      descriptions; it is not a reported company revenue segmentation and does
      not imply that every listed service is separately monetized.
    claimRefs: [CM001, CM002, CM003, CM004]
  - id: TM002
    title: Sizing lenses and limits
    columns: [Publisher/lens, Year, Geography, Value, CAGR or growth, Methodology, Confidence, Limitation]
    rows:
      - [Deloitte, "2026", "Asia Pacific", "$800bn investment expected through 2030", "Investment outlook; no CAGR stated", "Regional sector analysis", medium, "Not PDG revenue or serviceable share"]
      - [Deloitte, "2026", "Asia Pacific", "Data-center electricity demand up to 5x by mid-2030s", "Up to five-fold", "Energy-system and sector analysis", medium, "Demand units differ from dollars and capacity"]
      - [Ontario Teachers' Pension Plan, "Undated current profile", "Six Asian countries", "1 GW portfolio built in under seven years", "No CAGR stated", "Investor portfolio description", medium, "Capacity is not utilization or revenue"]
      - [Stonepeak, "2025", "PDG/APAC", "$1.3bn preferred-equity investment", "Not a market estimate", "Transaction announcement", high, "Financing is not revenue or cash available"]
    notes: >-
      Values are kept in their source units and periods. The lenses are not
      additive: regional investment, electricity demand, PDG capacity, and
      financing measure different denominators.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
  - id: TM003
    title: Buyer and adoption map
    columns: [Segment, Buyer, User, Payer/budget owner, Workflow, Adoption trigger]
    rows:
      - [Global hyperscaler, "Cloud infrastructure procurement", "Cloud and AI platform teams", "Hyperscale infrastructure capex", "Reserve and expand regional capacity", "AI/cloud growth and localization"]
      - [Regional enterprise, "Enterprise IT and facilities", "Internal applications and data teams", "Enterprise IT or digital-transformation budget", "Colocation and connectivity deployment", "Reliability and faster deployment"]
      - [AI-intensive deployment, "AI infrastructure program", "GPU/accelerator workloads", "AI or compute infrastructure budget", "High-density campus rollout", "Power, cooling, and contiguous MW"]
      - [Operator/partner ecosystem, "Utility, carrier, or infrastructure partner", "Network and energy operations", "Project or infrastructure budget", "Power, fiber, and service integration", "Grid access and resilient delivery"]
    notes: >-
      Buyer roles are an evidence-constrained workflow model, not a disclosed
      PDG customer list. Public sources do not identify named tenants, budget
      owners, contract tenor, or renewal rates.
    claimRefs: [CM003, CM004, CM010, CM012, CM014, CM015]
figures:
