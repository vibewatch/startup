company:
  name: Princeton Digital Group
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    PDG participates in the APAC data-center infrastructure market, serving
    hyperscalers and enterprises through wholesale, build-to-suit, and
    carrier-neutral capacity. External evidence supports strong regional demand
    and large investment requirements, but public sources do not isolate PDG's
    SAM, SOM, occupancy, pricing, or realized unit economics.
sections:
  - id: market-boundary
    title: Market boundary and customer job
    body: >-
      The relevant market is physical digital infrastructure: data-center
      development, wholesale colocation, build-to-suit hyperscale capacity,
      connectivity, and operating services in APAC digital economies. PDG's
      OCP facility listing describes both hyperscale and wholesale colocation,
      alongside build-to-suit, on-demand colocation, technical services,
      connectivity, and workplace services. This boundary excludes cloud
      software, semiconductors, and end-customer applications, while retaining
      the power, land, cooling, fiber, and operations required to deliver
      contracted capacity. The buyer is typically a hyperscaler or enterprise;
      the user is its cloud or compute platform; and the economic payer is the
      infrastructure budget owner under a long-term capacity agreement. Status
      quo substitutes include self-built campuses, alternative colocation
      operators, carrier facilities, and delaying deployment. PDG's advantage is
      local execution across multiple jurisdictions, but that advantage is
      exposed to power availability, permitting, construction, and talent.
    claimRefs: [CM001, CM002, CM003, CM004]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Multiple sizing lenses and capital intensity
    body: >-
      The market is large, but the available estimates describe different
      populations and should not be added together. Deloitte estimates
      approximately $800 billion of APAC data-center investment through 2030,
      while its electricity lens says regional data-center demand could expand
      up to five-fold by the mid-2030s. Those figures describe regional
      investment and electricity demand rather than PDG revenue or addressable
      capacity. PDG-specific disclosures provide a narrower operating lens:
      Ontario Teachers' reports a portfolio of 1 gigawatt built in less than
      seven years, and the same source says the company owns 21 data centers in
      six countries. A market-size bridge from APAC investment to PDG SOM cannot
      be calculated without country-level capacity, contracted-versus-available
      MW, pricing, utilization, capex, and financing terms. The $1.3 billion
      Stonepeak preferred-equity investment is financing, not market revenue or
      cash available for deployment.
    claimRefs: [CM005, CM006, CM007, CM008, CM009]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: adoption-drivers-constraints
    title: Adoption drivers, buyers, and constraints
    body: >-
      Cloud adoption, AI workloads, data localization, and digital
      transformation support demand for regional capacity. PDG's Tokyo, Mumbai,
      and Johor projects were described as together exceeding 400 MW, while
      W.Media's account of PDG's company release describes Jakarta JC3 as a 120
      MW AI-ready campus with dual-grid feeds and contracted full power
      capacity. These are deployment indicators, not proof of customer take-up.
      ISI Markets attributes regional demand to cloud, AI, and mobile
      connectivity, while DC Pulse's project directory shows the breadth and
      mixed maturity of PDG's footprint. Adoption depends on a buyer's need for
      speed-to-market, reliable power, connectivity, and a trusted operator
      across jurisdictions. Constraints are equally material: Deloitte
      identifies grid congestion and price volatility risks, and PDG's CEO says
      delivery delays and downtime are unacceptable for mission-critical
      customers. Power procurement, renewable availability, land, permits,
      modular construction, direct-to-chip cooling, and specialized talent can
      therefore shift both timing and returns. Public evidence does not disclose
      customer concentration, contract tenor, renewal rates, price per MW, or
      campus-level occupancy, leaving the adoption-to-revenue bridge unresolved.
    claimRefs: [CM010, CM011, CM012, CM013, CM014, CM015, CM016]
    tableRefs: [TM003]
  - id: diligence-gaps
    title: Sizing and adoption diligence gaps
    body: >-
      The strongest conclusion is directional rather than a precise TAM/SAM/SOM
      estimate: APAC digital-infrastructure demand is expanding, and PDG has
      assembled a multi-country power and capacity platform, but public sources
      do not establish its share of regional demand or the economics of turning
      planned MW into revenue. Investor materials and trade coverage emphasize
      strategic growth and financing, whereas facility directories provide
      partial technical snapshots. The key diligence work is to reconcile the
      project pipeline with energized and contracted MW, tenant commitments,
      utilization, pricing, power costs, capex per delivered MW, debt service,
      and renewable-power obligations. Until that evidence is available,
      valuation should be tested against scenario ranges for build timing,
      occupancy, pricing, and financing rather than a single market multiple.
    claimRefs: [CM005, CM008, CM009, CM014, CM016]
callouts:
  - calloutType: strength
    title: Regional demand tailwind
    body: >-
      Independent market analysis points to substantial APAC investment and
      electricity-demand growth, while cloud, AI, and connectivity demand
      provide a directional adoption tailwind.
    claimRefs: [CM005, CM006, CM015]
  - calloutType: risk
    title: Market size is not company revenue
    body: >-
      Public evidence does not connect regional investment forecasts or planned
      MW to PDG occupancy, pricing, revenue, or cash returns.
    claimRefs: [CM008, CM009, CM014]
