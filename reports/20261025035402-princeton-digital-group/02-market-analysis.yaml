    title: Market sizing lenses
    type: pyramid
    summary: >-
      A layered view separates the broad APAC opportunity from PDG's disclosed
      capacity and financing lenses without implying a calculated SOM.
    data:
      nodes:
        - label: "APAC data-center investment outlook"
          value: "$800bn through 2030"
          valueNote: "Deloitte regional estimate; not PDG revenue"
        - label: "APAC data-center electricity demand"
          value: "Up to 5x by mid-2030s"
          valueNote: "Demand lens; not dollar market size"
        - label: "PDG disclosed platform capacity"
          value: "1 GW built in under seven years"
          valueNote: "Investor description; capacity is not utilization"
        - label: "PDG disclosed footprint"
          value: "21 data centers in six countries"
          valueNote: "Ontario Teachers' profile; date not stated"
        - label: "PDG growth project example"
          value: "400+ MW across Mumbai, Tokyo, and Johor"
          valueNote: "Project capacity; not contracted revenue"
        - label: "PDG financing lens"
          value: "$1.3bn preferred equity"
          valueNote: "Stonepeak transaction; financing is not market revenue"
    approximationNotes: >-
      Nodes are ordered from broad market lenses to company-specific disclosed
      indicators; the diagram is not proportional and does not derive TAM, SAM,
      SOM, conversion, or share.
    claimRefs: [CM005, CM006, CM007, CM008, CM009, CM010]
