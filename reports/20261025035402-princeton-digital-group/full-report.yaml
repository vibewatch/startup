      - CI004
      - CI009
      - CI010
      - CI011
  - id: FE001
    title: Disclosed product and facility architecture
    type: stack
    summary: >-
      The public operating stack connects scarce site inputs to resilient facility systems and customer-facing capacity,
      with evidence strength varying by named site.
    data:
      layers:
        - label: Site and permits
          detail: Physical location and development authority
          modules:
            - 'Inputs: land, permitting, campus design, and commissioning milestones'
            - 'Evidence boundary: tracker stages range from operational to announced'
        - label: Grid and primary power
          detail: Utility capacity for IT load
          modules:
            - 'Inputs: grid connection, substations, and contracted energy'
            - 'Named proof: SG1 lists two diverse and redundant 22 kV supplies'
        - label: Resilience systems
          detail: Continuity through power or equipment failure
          modules:
            - 'Systems: distributed redundant UPS and N+1 diesel generation at SG1'
            - 'Evidence boundary: independent failover and uptime results are not public'
        - label: Cooling and density
          detail: Thermal support for conventional and AI workloads
          modules:
            - 'Systems: water-cooled chillers and CRAC are listed at SG1'
            - 'Named proof: TY1 has NVIDIA DGX-Ready liquid-cooling certification'
        - label: Connectivity and controls
          detail: Network access, physical protection, and safety
          modules:
            - 'Systems: diverse fiber, biometrics, guards, alarms, and fire suppression'
            - 'Evidence boundary: the detailed control set is site-specific'
        - label: Customer capacity and services
          detail: Sellable infrastructure and operational support
          modules:
            - 'Products: wholesale, build-to-suit, on-demand, and colocation capacity'
            - 'Services: connectivity, technical support, and workplace services'
    approximationNotes: >-
      This is a conceptual ordering of disclosed components, not a claim that every PDG facility contains every module
      or that the layers represent a proprietary technical stack.
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE008
      - CE010
      - CE016
  - id: FU001
    title: Evidence-backed customer journey and disclosure breakpoints
    type: journey-map
    summary: >-
      Public evidence is strongest through facility procurement and market deployment, then weakens at account economics
      and renewal.
    data:
      nodes:
        - id: demand-category
          label: Hyperscaler or enterprise demand
          detail: Cloud, AI, colocation, connectivity, or continuity requirements initiate procurement.
          touchpoints:
            - Regional capacity need
            - Power and connectivity requirements
        - id: service-selection
          label: Capacity format selection
          detail: PDG offers hyperscale capacity, wholesale colocation, build-to-suit, and related services.
          touchpoints:
            - SG1 service catalogue
            - Carrier- and cloud-neutral facility
        - id: technical-diligence
          label: Facility diligence
          detail: >-
            Power redundancy, fiber diversity, physical security, operational support, and certifications support
            procurement review.
          touchpoints:
            - OCP Ready facility record
            - SOC and ISO accreditations
        - id: regional-deployment
          label: Regional deployment
          detail: PDG develops campuses in markets such as Jakarta and Greater Seoul for hyperscale and AI workloads.
          touchpoints:
            - JC3 planned first phase
            - SE1 planned entry
        - id: named-account-proof
          label: Named-account evidence
          detail: A 2022 trade profile attributes recognizable platform customers, without campus or contract detail.
          touchpoints:
            - Third-party customer list
            - No customer-authored confirmation
        - id: durability
          label: Renewal and expansion
          detail: Occupancy, contract tenor, renewal, expansion, and concentration are not disclosed in the retained evidence.
          touchpoints:
            - NDA contract schedule
            - Customer cohort and concentration review
