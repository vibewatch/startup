  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          500 MW expansion and JC3 commission on schedule; hyperscaler contracts convert planned capacity into high
          occupancy; leverage remains asset-backed.
        - >-
          Value supported by contracted cash flow and infrastructure-like exit multiples; exact return is unavailable
          without revenue and terms.
        - Construction delay, power delivery, tenant concentration.
        - Upside case; evidence-supported directionally, not quantified.
      - - Base
        - >-
          Demand grows, but commissioning and occupancy ramp in stages; additional debt is raised selectively and
          sponsor support continues.
        - >-
          Value depends on achieved occupancy, project-level DSCR, and preferred-equity seniority; no precise range is
          supportable.
        - Refinancing, slower lease-up, margin compression.
        - Most defensible pending KPI disclosure.
      - - Bear
        - Demand or commissioning slips while debt and preferred claims accrue against partially utilized assets.
        - Common-equity value can be impaired by delayed cash generation, leverage, and preference overhang.
        - Down-round, covenant pressure, stranded powered land.
        - Material downside; timing risk is explicitly identified in retained analysis.
      - - Exit-readiness gate
        - A sale, IPO, or transparent secondary market is not established in the retained evidence.
        - No liquidity discount or target return can be calculated responsibly.
        - Opaque cap table and limited disclosure.
        - Open diligence question.
    notes: >-
      Scenarios are qualitative because public sources do not provide verified revenue, EBITDA, occupancy, cap-table
      terms, or a completed current valuation.
    claimRefs:
      - CV005
      - CV007
      - CV008
      - CV009
      - CV012
      - CV014
      - CV015
      - CV016
