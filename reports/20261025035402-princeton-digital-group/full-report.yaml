chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, business model, and scale
        blocks:
          - type: paragraph
            body: >-
              Princeton Digital Group (PDG) develops and operates internet infrastructure and data centers for
              hyperscalers and enterprises in Asian digital economies. Stonepeak's July 2025 announcement identifies
              Singapore as headquarters and lists operations in Singapore, Japan, India, Indonesia, China, and Malaysia;
              its description says the portfolio supports hyperscalers and enterprises. The same announcement reports a
              portfolio of more than 1.1 gigawatts across six countries. DC Atlas separately tracked 23 facilities
              across seven countries and more than 450 megawatts of live capacity, while flagging 14% of that live
              capacity as estimated. The two measures use different portfolio and operating-status boundaries, so they
              should not be treated as directly comparable. Open Compute's SG1 profile adds a concrete example of the
              model: carrier- and cloud-neutral wholesale colocation, build-to-suit, on-demand data-center,
              connectivity, and technical services. PDG's identity and regional footprint are therefore well
              established, but current customer count, headcount, revenue/run-rate, occupancy, and utilization are not
              publicly supported in this pool.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO011
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO008
              - CO009
              - CO017
      - number: '1.2'
        title: Leadership, sponsors, and financing
        blocks:
          - type: paragraph
            body: >-
              Rangu Salgame is identified by Stonepeak and Mingtiandi as PDG's co-founder, chairman, and chief executive
              officer. W Media's syndicated company announcement identifies Varoon Raghavan as co-founder and chief
              operating officer in connection with the JC3 campus. The evidence confirms senior operating leadership,
              but it does not provide a complete executive roster, board composition, voting rights, or succession plan.
              PDG's capital position is clearer: Stonepeak announced a USD 1.3 billion preferred-equity investment in
              July 2025, following USD 1.2 billion of debt financing, which the company described as USD 2.5 billion
              raised during 2025 across equity and debt. Mingtiandi reports a Mubadala-led USD 505 million equity raise
              in 2022, while Warburg Pincus remained the largest shareholder after the Stonepeak transaction. These
              figures describe financing raised, not cash on hand, revenue, or enterprise value; the reported possible
              USD 4 billion valuation was a transaction discussion rather than a completed valuation disclosure.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO012
              - CO016
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO008
              - CO009
              - CO012
              - CO017
      - number: '1.3'
        title: Milestones, execution, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The milestone record shows a shift from regional platform formation to AI-oriented capacity expansion.
              Mingtiandi dates the company to 2017 and reports institutional financing milestones, including the
              Mubadala-led 2022 equity raise. W Media's syndicated company announcement says PDG broke ground in
              November 2025 on a USD 1 billion, 120-megawatt AI-ready JC3 campus in Greater Jakarta, with first-phase
              service expected in the fourth quarter of 2026 and total Indonesian capacity expected to reach 230
              megawatts. Asian Morning and Yahoo's reproduced GuruFocus article describe a March 2026 plan to raise as
              much as USD 5 billion of debt, but those accounts are not equivalent to completed financing. The evidence
              also contains a concrete adverse diligence issue: the financing plan implies significant leverage and
              asset-level execution exposure, while public sources do not disclose net leverage, covenants, contract
              tenor, customer concentration, realized revenue, or incident history. The company has meaningful
              institutional backing and a visible delivery pipeline, but the economic and governance terms needed for
              underwriting remain private.
            claimRefs:
              - CO013
              - CO014
              - CO015
              - CO016
              - CO017
          - type: figure
            figureRef: FO001
            claimRefs:
              - CO013
              - CO014
