          detail: "Occupancy, contract tenor, renewal, expansion, and concentration are not disclosed in the retained evidence."
          touchpoints: ["NDA contract schedule", "Customer cohort and concentration review"]
    approximationNotes: "The nodes describe an evidence sequence, not a measured conversion funnel; no conversion rate or time-to-stage is inferred."
    claimRefs: [CU002, CU003, CU012, CU013, CU014, CU015]
callouts:
  - calloutType: strength
    title: Recognizable demand categories and accounts
    body: "PDG targets hyperscalers and enterprises, and one independent 2022 profile attributes major e-commerce, cloud, and content platforms to its customer base."
