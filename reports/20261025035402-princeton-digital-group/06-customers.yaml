company:
  name: Princeton Digital Group
chapter:
  number: 6
  title: Customers
  summary: >-
    PDG's public customer evidence supports a wholesale data-center proposition aimed at
    hyperscalers and enterprises, plus a large regional capacity build. Named-account evidence
    is limited to one 2022 trade publication, while occupancy, retention, contract tenor, and
    concentration remain material diligence gaps.
sections:
  - id: customer-segments
    title: Customer segments and buying proposition
    body: >-
      PDG is positioned as a wholesale infrastructure supplier to global hyperscalers and large
      enterprises rather than as a mass-market hosting provider. Company-originated descriptions
      identify those two demand groups, while the SG1 facility listing makes the offer more
      concrete: hyperscale data-center capacity, wholesale colocation, build-to-suit, on-demand
      colocation, connectivity, technical support, and workplace services. This makes cloud and
      AI platforms the likely anchor buyers for large blocks of power and space, with enterprises
      representing a second colocation and connectivity segment. The public materials do not
      allocate contracted capacity or revenue between these groups. Geography is broad, but
      geographic presence is not itself evidence of a diversified customer mix or of realized
      demand in each country.
    claimRefs: [CU001, CU002, CU014]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Capacity growth is visible; customer adoption is not
    body: >-
      The clearest longitudinal evidence is physical portfolio expansion, not customer usage.
      A 2022 industry publication described 20 data centers with more than 600 MW of potential
      power and roughly half operational; July 2025 reporting described more than 20 assets and a
      1 GW-plus platform; November 2025 reporting described more than 1.2 GW of IT capacity across
      more than 20 campuses in seven countries. An April 2026 analysis then described a 1 GW India
      portfolio target within 1.8 GW of operating and planned global capacity. These figures use
      different definitions and include pipeline, so they cannot be read as occupied MW, active
      accounts, or revenue. They show supply-side scale and expansion ambition while leaving the
      commercial conversion rate unresolved.
    claimRefs: [CU007, CU008, CU009, CU010, CU011, CU012, CU013]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named accounts are attributed, but not independently confirmed by customers
    body: >-
      Dgtl Infra's 2022 profile is the only retained source that names customers. It attributes
      Amazon, Alibaba, Pinduoduo, and Lazada in e-commerce; Microsoft Azure, Google Cloud, Alibaba
      Cloud, and IBM Cloud among cloud providers; and Facebook, now Meta, in content. This is more
      useful than a generic hyperscaler label, but the assigned evidence does not contain a
      customer-authored announcement, campus mapping, contracted MW, production-versus-pilot
      status, or measured outcome for any name. The table therefore presents the names as dated
      third-party attributions, not as verified current tenants. Facility certifications and
      resilience features may support procurement, but they do not establish that a named account
      is deployed or retained.
    claimRefs: [CU003, CU004, CU005, CU006, CU014]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Durability and concentration remain the underwriting gaps
    body: >-
      No retained source provides NRR, GRR, churn, renewal rates, contract lengths, cohort
      behavior, occupied capacity, or customer-level revenue concentration. Those quantities are
      treated as gaps rather than estimated. Stonepeak identifies greenfield development and M&A
      as growth paths, and PDG's Jakarta and South Korea projects show how geographic and campus
      expansion could follow hyperscaler demand. The adverse case is equally important: an
      independent 2026 analysis argues that the India investment depends on hyperscaler demand
      absorbing 1 GW at adequate returns. Until signed capacity, occupancy, renewal schedules,
      termination rights, and top-customer exposure are reviewed, portfolio growth should not be
      interpreted as durable customer expansion.
    claimRefs: [CU011, CU012, CU013, CU015, CU016]
