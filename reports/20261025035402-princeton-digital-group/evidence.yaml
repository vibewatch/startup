evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Current revenue, EBITDA, occupancy, utilization, customer count, headcount, and customer concentration by campus
      or country.
    whyItMatters: Headline capacity and financing do not establish realized demand, cash generation, or operating leverage.
    diligencePath: >-
      Request audited financial statements, lender reporting, operating KPI packs, tenant schedule, contract tenor,
      renewal, and concentration analysis.
    relatedQuestionRefs:
      - QO002
      - QO007
      - QO010
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Complete cap table, preferred-equity economics, board composition, voting rights, liquidation preferences, and
      succession plan.
    whyItMatters: Sponsor backing is not equivalent to control, economic priority, or minority-investor protection.
    diligencePath: >-
      Obtain the shareholders agreement, preferred-equity subscription documents, board materials, and current
      governance schedule.
    relatedQuestionRefs:
      - QO004
      - QO005
      - QO008
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: capacity
    missingEvidence: >-
      A reconciled current capacity schedule distinguishing operational, construction, planned, and prospective
      megawatts.
    whyItMatters: >-
      The 1.1 GW company description and project announcements use different capacity and timing boundaries that may not
      be directly comparable.
