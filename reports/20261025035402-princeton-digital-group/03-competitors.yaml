callouts:
  - calloutType: strength
    title: Coverage and execution are the clearest differentiators
    body: PDG combines a six-country operating footprint with documented carrier/cloud-neutral infrastructure and institutional capital support, but the public record does not yet prove superior economics or customer lock-in.
    claimRefs: [CP001, CP004, CP008]
  - calloutType: risk
    title: Capital and power competition can compress differentiation
    body: APAC supply is expanding while power access, grid timing and construction cost are binding constraints; larger incumbents and hyperscalers can compete for the same scarce inputs.
    claimRefs: [CP009, CP010, CP011, CP016]
  - calloutType: recommendation
    title: Underwrite the moat as execution plus access, not price
    body: The evidence supports PDG's coverage, delivery and capital-access narrative, but a defensible competitive conclusion requires a customer-level bid set and peer operating metrics before assuming pricing power or lock-in.
    claimRefs: [CP004, CP008, CP012, CP014]
