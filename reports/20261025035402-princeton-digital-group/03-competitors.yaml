company:
  name: Princeton Digital Group
chapter:
  number: 3
  title: Competitors
  summary: PDG competes in a capital-intensive APAC data-centre market where hyperscalers, specialist platforms, colocation providers and internal builds can solve overlapping capacity needs. Reviewed public evidence supports PDG's multi-market footprint, carrier/cloud-neutral offer and execution scale, but does not provide like-for-like public pricing or operating metrics for named peers; the durable edge therefore rests on power access, delivery record, customer fit and financing rather than a proven low-price position.
sections:
  - id: landscape
    title: Competitive landscape and buyer alternatives
    body: >-
      The relevant competitive set is broader than other branded operators. PDG sells hyperscale and wholesale-colocation capacity, build-to-suit delivery, colocation, technical services and connectivity solutions at SG1, while the APAC market also includes hyperscaler self-build, enterprise on-premise capacity, carrier-neutral specialists, specialist AI or neocloud providers and the status quo of delaying or reallocating workloads. PDG's disclosed footprint spans China, Singapore, India, Malaysia, Indonesia and Japan, and Baxtel carries a company description of more than 20 data centres across those six economies. DC Atlas independently tracks 23 facilities across seven countries and more than 450 MW of live capacity, while labeling 14% of that live capacity as estimated. These scale and coverage signals use different bases and do not establish that PDG wins on realized price, occupancy, contract tenor or customer concentration.
    claimRefs: [CP001, CP002, CP003, CP004, CP006]
    tableRefs: [TP001]
  - id: capability
    title: Capability, trust and distribution comparison
    body: >-
      The strongest documented buying criteria are power and delivery certainty, technical flexibility, connectivity, security controls, certifications and the ability to serve customers across markets. SG1 lists two diverse redundant 22kV supplies, N+1 generators and distributed-redundant UPS alongside SOC1 Type 2, SOC2 Type 2 and ISO certifications. Frost & Sullivan's paid release says PDG works with customers on capacity planning and adapts technical requirements to local market conditions, while CBRE and JLL identify power availability, construction cost and grid connection delays as structural constraints. These sources support a plausible execution and access proposition, not a verified peer benchmark; competitor capabilities and service-level outcomes remain mostly unreported here.
    claimRefs: [CP004, CP005, CP007, CP011, CP015]
    tableRefs: [TP002]
    figureRefs: [FP001]
  - id: durability
    title: Moat durability, switching and displacement risk
    body: >-
      PDG's potential moat is cumulative rather than a single proprietary feature: land and power positions, multi-country operating experience, financing relationships, repeatable campus delivery and customer-specific technical adaptation. Stonepeak's 2025 announcement confirms a USD 1.3 billion preferred-equity investment and continued support from Warburg Pincus, Ontario Teachers' Pension Plan and Mubadala, while the announced 120 MW JC3 development illustrates continued investment in Indonesia. The counterweight is equally important. JLL reports that 78% of 4.8 GW of APAC supply expected by 2027 is already preleased, Mingtiandi reports that Digital Edge raised more than USD 1.6 billion, and CBRE identifies neocloud growth and rising build constraints; well-capitalized platforms, hyperscaler self-build and specialist providers can intensify competition for power, customers and equipment.
    claimRefs: [CP008, CP009, CP010, CP011, CP012, CP013]
    tableRefs: [TP003]
  - id: diligence
    title: Competitive diligence conclusion
    body: >-
      PDG appears best positioned where a customer values APAC coverage, carrier and cloud neutrality, capacity planning and a delivered campus rather than a single-site commodity lease. The evidence does not support a claim that PDG has lower pricing, superior uptime, higher occupancy, better customer retention or a stronger security posture than named peers. A buyer could multi-home across operators or retain hyperscaler and internal-build options, so switching costs are likely highest after site, power, network and technical design commitments are embedded. The next underwriting step is a comparable bid set covering price per contracted megawatt, power and grid timing, PUE, uptime, service credits, contract tenor, renewal and expansion rights, tenant concentration, and financing terms.
    claimRefs: [CP012, CP013, CP014, CP015, CP016]
