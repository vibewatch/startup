  - id: FE001
    title: 产品架构图
    type: stack
    summary: 覆盖物理执行、边缘计算、传感器融合感知、行为规划和车队远程操作的分层自动驾驶技术栈。
    data:
      layers:
        - label: 车队远程操作与任务调度
          detail: 基于云的车队调度、路线优化、远程异常协助及 Uber API 市场集成。
          modules:
            - 需求与行程匹配网关
            - 远程操作员控制台
            - 车队路线与再平衡优化器
        - label: 仿真与持续学习流水线
          detail: 云规模场景回放、合成边界案例生成，以及 OTA 部署前的回归指标验证。
          modules:
            - 日志回放场景合成器
            - 高吞吐云仿真器
            - 回归验证与发布门禁
        - label: 行为预测与运动规划
          detail: 多智能体意图预测、合规路径生成、轨迹平滑及碰撞规避算法。
          modules:
            - 多智能体行为预测网络
            - 代价地图轨迹规划器
            - 动态障碍规避控制器
        - label: 定位与高精地图
          detail: 融合实时激光雷达里程计、高精地图先验和 GNSS/IMU 传感器输入的厘米级空间定位。
          modules:
            - 厘米级精度高精矢量地图层
            - 激光雷达点云扫描匹配
            - 多传感器卡尔曼滤波融合
        - label: 多模态感知与传感器融合
          detail: 同步处理 360 度激光雷达、语义摄像头和测速雷达，并生成深度学习边界框。
          modules:
            - 360 度激光雷达空间点云
            - 语义视觉与交通信号灯分类器
            - 雷达多普勒速度跟踪器
        - label: 边缘计算与失效可运行控制
          detail: 汽车级车载计算，提供低延迟执行、实时执行器控制和故障安全停车逻辑。
          modules:
            - 加固型多温度边缘计算单元
            - 线控转向与制动接口
            - 最小风险机动故障安全回退
        - label: 车辆与机器人实体平台
          detail: Hyundai IONIQ 5 电动车线控底盘及定制四轮人行道配送机器人硬件。
          modules:
            - Hyundai IONIQ 5 EV 乘客平台
            - IP66 人行道配送机器人四轮底盘
            - 可更换电池与锁闭货舱门
    approximationNotes: null
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
  - id: FU001
    title: 客户旅程与自动订单履约流程
    type: journey-map
    summary: 涵盖发现、下单、人行道自动通行、路边移动解锁和平台结算的六阶段客户与商户运营旅程。
    data:
      items:
        - label: 1. 商户接入与菜单发现
          summary: Restaurants onboard menus through Uber Eats or campus dining portals (Grubhub/Sodexo).
          touchpoints:
            - Uber Eats 商户门户
            - 校园餐饮 POS 集成
        - label: 2. 消费者下单
          summary: Customer selects meals on mobile app and opts for autonomous delivery where available.
          touchpoints:
            - Uber Eats 移动应用
            - Grubhub 校园移动应用
        - label: 3. 厨房履约与配送机器人装载
          summary: Merchant prepares food order and loads package into secure rover compartment at curb.
          touchpoints:
            - 商户厨房提醒平板
            - 配送机器人实体货舱门
        - label: 4. 人行道自动导航
          summary: Rover navigates sidewalks at up to 5 mph using onboard lidar, cameras, and remote supervision.
          touchpoints:
            - 行人通道路线规划
            - 远程操作监控
        - label: 5. 路边到达与客户解锁
          summary: Customer receives arrival push notification and unlocks cargo door using mobile app button.
          touchpoints:
            - 移动推送通知
            - 基于应用的蓝牙 / 蜂窝网络解锁
        - label: 6. 交易结算与反馈
          summary: Order is completed, customer rates delivery, delivery fee is billed, and platform settles revenue.
          touchpoints:
            - 消费者应用内评分提示
            - 平台收入结算
    approximationNotes: 旅程图综合了 Jersey City、Austin 及大学校园活跃部署中的标准运营流程。
    claimRefs:
      - CU004
      - CU010
      - CU011
      - CU012
