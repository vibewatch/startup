      - number: '3.4'
        title: 图表
        blocks:
          - type: callout
            title: Uber 多合作伙伴模式对伙伴驱动自动化的悖论
            body: >-
              Avride 与 Uber 的合作让公司无需承担直接获客成本，就能迅速触达数百万活跃城市乘客和用餐者。但 Uber 有意采取多伙伴策略，在 11 个城市部署来自 6 家不同机器人和自动化公司的自动驾驶车辆，使
              Avride 无法建立排他性。Uber 更像开放的出行清算平台，而非封闭分销商，因此 Avride 容易受到平台费率压缩和竞争对手自动驾驶调度优先级影响。
