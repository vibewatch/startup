      - number: '3.2'
        title: 竞争者画像、规模差距与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              Avride 的主要竞争者在资本规模、运营覆盖和架构重点上差异显著。乘客出行领域中，Waymo 是商业标杆，在主要都市市场运营完全无人驾驶的商业
              Robotaxi，每周完成数十万次付费乘客行程。自动化配送领域中，Serve Robotics 和 Starship Technologies
              已在城市街区、大学校园和商业走廊扩大专用人行道机器人规模，借助低成本底盘设计实现更有利的配送单元经济性。Avride 通过资本效率更高的平台模式应对规模优势：依托 Hyundai 的 OEM 车辆制造规模和
              Uber 每月超过 180 million 的活跃用户入口，公司避开了拖累此前自动驾驶企业的高昂获客成本和资本开支。不过，这种结构性依赖也带来重大战略脆弱性。Avride 并不独占 Uber 网络；Uber
              正积极维持多伙伴自动驾驶策略，在 11 个城市部署自动驾驶车辆，至少合作 Waymo、WeRide、Serve Robotics、Cartken、Coco 和 Nuro 六家机构。
