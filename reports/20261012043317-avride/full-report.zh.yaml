      - number: '2.2'
        title: 从宏观、细分和运营维度测算可触达市场
        blocks:
          - type: paragraph
            body: >-
              评估 Avride 的商业机会，需要把自上而下的行业预测与受证据约束的运营里程碑放在一起看。从宏观市场看，Uber
              管理层把自动化交通描述为仅美国就有万亿美元规模的市场机会，反映个人车辆支出和零工司机报酬向自动化网络重新分配的巨大潜力。更广泛的交通行业模型预计，全球自动驾驶汽车行业到 2030 年将达到 $214.32
              billion；专门的 Robotaxi 服务则预计从 2024 年的 $1.95 billion 增至 2030 年的 $43.76 billion，复合年增长率为 73.5%。但 Avride
              的可触达现实更受合同制伙伴融资和地理围栏运营约束。公司已从 Uber 和母公司 Nebius Group 获得最高 $375 million 的战略资本及商业承诺，同时把 Dallas 的商业 Robotaxi
              覆盖范围从最初的 9 平方英里扩大到 31 平方英里。
