              Avride 车辆的实体和计算架构强调多模态传感器融合与边缘计算功能安全。配送机器人配备一体化传感器套件，包括无论环境光线如何都能探测最远 60 米障碍物的高频
              lidar、用于颜色识别和红绿灯分类的多角度语义摄像头，以及障碍物突然出现时立即触发紧急制动的超声波传感器。乘客 Robotaxi 配置了 5 个高分辨率 lidar，配合 radar 和摄像头，覆盖车辆周围完整
              360 度视野。传感器流由加固型车载计算单元处理，执行神经网络推理、与专有高清地图匹配定位和轨迹规划，不依赖实时云连接。机器人硬件还包括 IP66 防水外壳、可快速更换且续航最高 50 公里
