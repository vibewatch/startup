      - number: '3.3'
        title: 分销力量、平台锁定与商品化风险
        blocks:
          - type: paragraph
            body: >-
              Avride 面临的核心战略风险是平台商品化和渠道集中。由于几乎完全依赖第三方聚合商——主要是 Uber、Uber Eats 以及与 Grubhub
              的校园合作——公司与终端客户关系有限，消费者品牌没有锁定力，乘客和用餐者的切换成本也极低。在 Uber 平台上，自动驾驶车辆调度算法依据运营可用性、地理围栏和价格分配行程，而不是乘客对 Avride
              软件栈的偏好。此外，WeRide 等竞争者已展示出大幅加速收入的能力，在收入增速超过 Avride 的同时，还获得了 Uber
              的直接投资和分销承诺。在人行道物流领域，配送机器人虽然理论单元经济性有吸引力，预计回本期为 18 至 36
              个月，但现场运营仍然劳动密集，需要本地服务技术员每日校准传感器、维护机械部件、校正车轮并完成夜间充电。叠加 NHTSA 等联邦监管审查后，Avride
              维持技术差异化、守住运营利润率并对抗规模更大且资金更充裕的同行，仍是未解决的尽调问题。
