        title: 管理层与技术治理
        blocks:
          - type: paragraph
            body: >-
              Avride 的管理团队由首席执行官 Dmitry Polishchuk 领导；他在公司重组前曾主导 Yandex 的自动驾驶部门。Polishchuk 与创始工程团队把核心技术资产和运营方法迁移到
              Avride。技术与运营团队覆盖硬件工程、机器人服务维护，以及得州现场枢纽和国际工程中心的持续数据质量验证。管理层凭借多年共同的自动化工程经历保持技术协同，但公司对 Polishchuk
              及其创始软件团队的关键人物依赖仍然突出。战略治理由 Nebius Group 和 Uber Technologies 这两大机构利益相关方主导，它们通过资本承诺、平台分销权和商业整合协议施加重大治理影响。
