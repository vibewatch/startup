      - number: '7.2'
        title: 运营脆弱性、软件能力与车队控制
        blocks:
          - type: paragraph
            body: >-
              除公开披露的监管文件外，Avride
              的运营风险还暴露出传感器感知、物体规避和驾驶监督机制的关键弱点。事故记录显示车辆与移动车辆和静止物体均发生碰撞，包括撞上垃圾箱和停靠皮卡车的敞开车门，后者造成旁观者受伤。更令人担忧的是，坐在驾驶位的安全监控员只在
              16 起记录碰撞中的 1 起进行干预，干预率仅 6.25%，暴露出严重的被动监督疲劳。Avride
              拒绝解释监控员为何未采取行动，转而依靠事后软件缓解措施，并声称单位里程事故频率下降，却未披露支持性的里程基线。配送机器人方面，人行道单元受 1 至 2 英里
              最佳运营半径限制，也容易受到中等降水和降雪影响。此外，车队可用性需要劳动密集型现场运营，技术助理在分布式车库每日执行电池供电循环、车轮校准和实体传感器校准，以防硬件退化。
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR009
              - CR011
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
