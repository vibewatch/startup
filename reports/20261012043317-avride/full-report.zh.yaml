  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Avride 将商业运营边界定义为伙伴促成的自动化交通，而非垂直整合的直达消费者车队运营。在乘客出行领域，公司运营搭载自研 Level 4 自动驾驶技术栈的 Hyundai Ioniq 5
              改装电动车，业务包括城市网约车和市中心点到点交通，但明确排除个人汽车销售、消费者私人持有车辆和重型长途城际运输。在人行道物流领域，Avride
              部署专用轮式配送机器人，面向高密度城市餐厅送餐和校园餐饮流程。这些领域的主要现状替代方案仍是标准调度网络上的零工配送员和网约车司机。Avride
              将两种车辆形态放在共享的机器学习与传感器架构上，试图承接平台支出，同时不承担直接营销和获客负担。
            claimRefs:
              - CM001
              - CM004
              - CM006
