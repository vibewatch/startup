        title: 安全记录、监管审查与工程缺口
        blocks:
          - type: paragraph
            body: >-
              Avride 的技术扩张受到实质性监管审查和运营挑战，削弱了公开宣传的商业里程碑的含金量。到 2026 年年中，公司已在 Dallas 完成超过 60,000 次商业行程、累计 1.3 million
              英里自动驾驶里程，但联邦安全监管机构已对系统能力提出实质疑虑。2026 年 5 月 6 日，NHTSA 缺陷调查办公室启动初步评估 PE26003，覆盖 Dallas 和 Austin 的 16
              起低速碰撞。监管机构特别指出行为缺陷，包括不当变道、未向静止车辆让行，以及过度激进但能力不足的运营特征。此外，商业 Robotaxi 行程仍依赖车内安全专家；Avride
              尚未公布标准化脱离接管指标、平均干预间隔，也没有正式汽车网络安全认证，使商业扩张能力和无人驾驶安全论证的关键部分仍未得到 潜在投资者 的公开验证。
