              - CR013
      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 联邦缺陷调查威胁商业部署前景
            body: >-
              NHTSA 对 Avride 自动驾驶系统的初步评估直接挑战其 Robotaxi 上线的商业前提。如果监管机构认定反复变道碰撞和撞击静止障碍物构成不合理安全风险，Avride 可能面临强制软件召回或运营削减，原定
              500 辆车的车队扩张将被拖延。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: 安全员不作为凸显关键运营风险
            body: >-
              安全监控员只在 16 起碰撞中的 1 起进行干预（干预率
              6.25%），这一发现暴露出人机协同监督的危险失灵。受监督测试中的人工监控员非但没有成为有效防线，反而表现出严重的被动疲劳和接管延迟，说明仅有硬件在场无法替代自动化系统能力。
            calloutType: insight
            claimRefs:
              - CR004
              - CR005
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Avride 的核心投资论点是：在统一 AI 架构下，以资本高效的方式同时部署乘客 Robotaxi 和人行道配送机器人。通过与主要需求聚合商合作——主要是 Uber、Uber Eats，以及大学校园的
              Grubhub——Avride 绕开了拖累早期自动驾驶运营商的高昂获客成本。包括 Uber 上超过 100,000
              次自动驾驶行程和多个都市市场运营部署在内的商业里程碑，证明公司具备有意义的现实执行力。反论点则是：公司严重集中依赖 Uber 平台，公开披露的最高 $375 million
              融资方案中的财务承诺未量化，联邦安全调查仍在进行，并且还面临 Waymo 等资金雄厚的现有企业的激烈竞争。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV008
      - number: '8.2'
        title: 建议立场与融资背景
        blocks:
          - type: paragraph
            body: >-
              我们给 Avride 的建议是观察，置信度中等，风险评级高，估值立场偏贵。2025 年 10 月，Avride 从母公司 Nebius Group 和商业伙伴 Uber 获得总额最高 $375 million
              的战略投资与商业承诺。虽然对外宣传为大型融资轮，但官方公告将交易描述为战略投资和商业承诺的组合，而非纯粹的定价股权融资。投前估值、股权与里程碑或商业授信挂钩的债务、清算优先权、少数股东治理权等关键交易条款均未披露。在缺乏经审计收入运行率、毛利率披露以及每单配送和每次
              Robotaxi 行程单元经济性的情况下，为私人市场溢价估值提供投资判断，存在显著下行风险。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV011
