  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 联邦安全调查与监管执法
        blocks:
          - type: paragraph
            body: >-
              NHTSA 是 Avride 面临的首要生存风险来源。该机构的缺陷调查办公室在 2025 年 12 月至 2026 年 3 月期间得州发生 16 起报告的 Robotaxi 碰撞和 1
              起轻伤后，启动了正式初步评估。所有事故都涉及 Avride 的 Hyundai Ioniq 5
              车队，自动驾驶系统在安全监控员名义监督下运行。联邦调查人员发现核心驾驶任务反复出现系统性失误，具体包括自动驾驶车辆直接变道到相邻车辆行驶路径、未对慢行或静止交通减速，以及撞上部分阻塞车道的静止障碍物。监管机构称车辆行为过度激进且能力不足，并警告这些模式可能构成交通安全违规。Avride
              报告自测试开始以来 Austin 共发生 17 起碰撞，但 Dallas 商业运营头 4 个月集中出现 16 起，说明在宽松得州框架下快速部署的速度已超过自动驾驶技术栈的成熟度。
            claimRefs:
