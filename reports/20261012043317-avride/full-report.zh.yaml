      - number: '2.4'
        title: 采用约束、监管障碍与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              尽管在得州和大学校园已有明确部署里程碑，Avride 仍面临决定采用时点和估值倍数的严重结构性逆风。最关键的是，商业乘客 Robotaxi
              仍要求车内有人类安全操作员，无法实现无人驾驶带来的人工成本节省。公司的安全状况正接受监管审查：截至 2026 年 8 月 17 日，National Highway Traffic Safety
              Administration 记录了涉及 Avride 车辆的 80 起自动驾驶模式碰撞事件，并于 2026 年 5 月启动针对驾驶能力的正式联邦缺陷调查。这些安全挑战和运营约束也体现在独立基准评估中：The
              Road to Autonomy Robotaxi Index 将 Avride 排名第 11，综合得分为 35.7/100；自动化运营和安全得分分别仅为 15/100 和
              31/100。要扩大到受监督的伙伴试点之外，Avride 必须解决这些安全调查并证明车辆可在无人辅助下运行。
            claimRefs:
              - CM011
              - CM012
      - number: '2.5'
        title: 图表
        blocks:
          - type: callout
            title: 合作伙伴渠道集中与监管依赖
            body: Avride 的商业触达几乎完全依赖 Uber 的平台分发和第三方校园聚合商。虽然这消除了直接获客摩擦，却让业务暴露于平台替代风险；一旦持续的联邦安全调查阻碍伙伴驱动车队扩张，脆弱性会被进一步放大。
            calloutType: risk
            claimRefs:
              - CM005
