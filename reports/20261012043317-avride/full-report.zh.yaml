  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源与合作伙伴变现模式
        blocks:
          - type: paragraph
            body: >-
              Avride 通过乘客 Robotaxi 和人行道配送机器人的商业合作，将自动驾驶技术变现。在与 Uber Technologies 的多年战略协议下，公司在 Jersey City、Austin 和
              Dallas 部署机器人履行 Uber Eats 订单，同时准备在 Dallas 的 Uber 网络上推出商业 Robotaxi 行程。Avride
              不运营面向消费者的直接调度应用，而是作为专门的自动化车队伙伴，按完成的行程佣金和配送履约费获得收入。通过 Grubhub 为 Ohio State University
              提供校园配送，又把变现延伸到签约教育餐饮客户。但公开披露没有分别报告配送和 Robotaxi 业务的收入、总预订额或抽成比例。
