  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览与结构定位
        blocks:
          - type: paragraph
            body: >-
              自动化出行与配送生态已分化为两种运营范式：垂直整合的车队运营商，以及轻资产技术伙伴。Alphabet 旗下 Waymo、Amazon 旗下 Zoox 和 General Motors
              等在城市乘客运输中部署了资本投入高、专门打造或深度整合的传感器平台。另一边，Nuro、Serve Robotics、Kiwibot、Starship Technologies 和 Cartken
              等专业配送自动化公司，直接争夺人行道物流、校园配送网络和餐厅合作。Avride 以少见的双形态运营定位切入，在统一自动化技术栈下同时部署乘客 Robotaxi
              和人行道配送机器人。但其商业策略与全栈运营商明显不同：它不自建专属消费者需求层、自有网约车网络或封闭式车辆制造，而是作为技术和车队伙伴接入 Uber、Uber Eats 等第三方需求平台，并改装 Hyundai
              Ioniq 5 电动车提供乘客 Robotaxi 服务。
