        title: 统一自动化架构与产品形态
        blocks:
          - type: paragraph
            body: >-
              Avride 运营双形态自动化交通业务，把 Level 4 自动驾驶技术用于乘客 Robotaxi 和最后一公里人行道配送机器人。不同于只做乘客出行或商用卡车的自动驾驶开发商，Avride 在两种形态上共用 AI
              自动化栈，再针对不同速度范围和运营域调整核心软件模块。其技术基础源于 Yandex 自动驾驶部门 2017 年启动的七年自动驾驶研究，随后公司分拆并在 Austin 设立总部。乘客业务使用改装后的全电动
              Hyundai IONIQ 5 提供商业网约车服务；同时，公司生产紧凑型四轮人行道机器人，面向高密度食品和包裹配送。这套共享栈让感知和预测建模的工程改进同时惠及两类车辆，但商业乘客部署仍由车载受训安全专家陪同。
