chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司沿革与结构演变
        blocks:
          - type: paragraph
            body: >-
              Avride Inc. 开发乘用车和最后一公里配送机器人的自动驾驶技术。团队 2017 年在 Yandex 内部开始研发自动驾驶汽车，2020 年组建为独立公司分拆实体。母公司 Nebius Group 于
              2024 年 7 月重组并剥离俄罗斯资产后，Avride 成为留在 Nebius Group 旗下、独立运营的西方实体。历史公司备案和企业目录记录的注册地是马萨诸塞州
              Newburyport，但公司把运营总部、工程团队和车辆设施设在得克萨斯州奥斯汀。Avride 打造双形态自动化系统，让乘客 Robotaxi
              与人行道配送机器人共用核心软件算法和硬件组件；城市人行道配送积累的运营经验与传感器数据，可直接反哺乘用车导航系统。
