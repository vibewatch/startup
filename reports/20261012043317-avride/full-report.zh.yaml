      - number: '1.3'
        title: 资本结构、商业车队规模与监管审查
        blocks:
          - type: paragraph
            body: >-
              Avride 的资本化以一项最高 $375 million 的战略融资方案为核心，由 Uber Technologies 与母公司 Nebius Group 支持。招聘摘要和私人聚合数据库给出的总融资额在
              $375 million 至 $425 million 之间，但公开披露很少涉及各轮具体 分期、投前估值基准和少数股东治理保护。运营上，Avride 将配备定制 lidar、radar 和摄像头传感器套件的
              Hyundai Ioniq 5 改装电动车部署到 Uber 平台，在 Dallas 提供 Robotaxi 服务。人行道物流方面，公司在 Austin、Dallas 和 Jersey City
              运营配送机器人，并在 Ohio State University 等高校校园部署。不过，扩张已引发审查：National Highway Traffic Safety Administration 在记录到 80
              起自动驾驶车辆事故后，启动了正式安全调查（PE26003）。
