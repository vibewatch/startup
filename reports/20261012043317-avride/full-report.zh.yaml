  - id: FP001
    title: 竞争定位矩阵：自动驾驶范围 vs. 商业自动驾驶独立性
    type: quadrant
    summary: 从自动驾驶模态广度和商业分发独立性评估自动驾驶出行竞争者。
    approximationNotes: 评分是根据商业备案、合作伙伴披露及运营规模推导的序数定位。
    data:
      points:
        - label: Avride
          x: 4.8
          'y': 2.2
          detail: 覆盖乘客与配送两条业务线，但高度依赖 Uber 平台。
        - label: Waymo
          x: 2.5
          'y': 4.6
          detail: 专注乘客 robotaxi 的领军者，拥有独立 Waymo One 应用和深厚品牌资产。
        - label: Zoox
          x: 2.2
          'y': 3.8
          detail: 定制乘用车平台，背靠 Amazon，具备封闭需求潜力。
        - label: WeRide
          x: 4.2
          'y': 3.5
          detail: 覆盖 robotaxi、无人巴士和道路清扫车的多车型产品组合。
        - label: Serve Robotics
          x: 1.8
          'y': 2.5
          detail: 专注人行道配送，通过 Uber Eats 和零售合作伙伴扩张。
        - label: Nuro
          x: 2
          'y': 3.2
          detail: 专用货物配送舱，并开展独立 B2B 配送车队试点。
        - label: Starship Technologies
          x: 1.6
          'y': 3
          detail: 人行道配送先驱，运营封闭式校园配送网络。
        - label: Cartken
          x: 1.7
          'y': 2.1
          detail: 轻资产自动配送机器人平台，通过第三方合作伙伴部署。
