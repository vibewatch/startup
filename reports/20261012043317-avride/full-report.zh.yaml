              - CR014
              - CR015
      - number: '7.3'
        title: 平台依赖、资本结构与商业集中
        blocks:
          - type: paragraph
            body: >-
              Avride 的商业模式几乎完全依赖 Uber Technologies 生成需求、获客和提供调度基础设施，带来严重伙伴集中风险。在 Dallas Robotaxi 和 Jersey City
              人行道配送中，Avride 是平台供应商，声誉和乘客量都与 Uber 市场紧密绑定。这使公司容易受到平台竞争影响，因为 Uber 正积极测试 Waymo、Nuro 和 Volkswagen 的竞争性
              Robotaxi，限制 Avride 的定价权和伙伴防御力。资本端，Avride 仍依赖 Uber 与控股股东 Nebius Group 提供最高 $375 million 的战略承诺方案，以实现扩张到 500
              辆车的目标。如果公司关系恶化、Nebius 将资本配置转向 AI 基础设施，或 Uber 在监管执法后因声誉压力撤退，Avride 可能背负高额车辆硬件承诺，却没有足够的独立现金流支持持续的自动驾驶研发。
            claimRefs:
              - CR001
              - CR006
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR012
              - CR013
      - number: '7.4'
        title: 剩余敞口热力图与论点破坏触发因素
        blocks:
          - type: paragraph
            body: >-
              综合 Avride 的风险版图，可以看到两种击穿投资论点的失败模式：监管执法叫停商业 Robotaxi 部署，以及 Uber 因客户安全争议退出合作。Avride 已将招聘扩大到 76
              个岗位，包括完善评估指标的高级测试工程师，但缺乏透明的干预间隔里程数据，无法独立验证其声称的安全改善。投资者必须关注明确的论点破坏触发因素：NHTSA 初步评估升级为正式工程分析或召回令；Austin 或
              Dallas 交通部门暂停或限制市政许可；以及 Avride 在 Uber 平台上的 Robotaxi 调度选项减少或暂停。在 Avride
              提供经审计的安全脱离数据，并明确商业伙伴协议中的乘客责任赔偿前，其风险水平仍然偏高，相比自动化出行龙头需要显著估值折价。
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR009
              - CR010
              - CR012
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
