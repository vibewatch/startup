      - number: '2.3'
        title: 买方分层、预算归属与合作伙伴采用流程
        blocks:
          - type: paragraph
            body: >-
              Avride 的商业进入结构采用中间商 B2B2C 分销模式，买方分布在大型数字调度平台、机构餐饮运营商和汽车 OEM 之间。城市乘客出行的主要企业交易对手是 Uber
              的自动化出行部门，由其管理车队充电、维护车库和终端乘客匹配，并按与人工司机相当的价格定价。这一结构让 Avride 在安全员监督下完成的 Dallas 乘客行程超过 100,000
              次。在最后一公里配送中，Avride 通过 Grubhub、Sodexo Campus 和 Chartwells 合作，面向机构校园餐饮负责人，在超过 25
              个大学校园部署自动化机器人，以缓解长期存在的餐饮用工约束。采购评估显示，Avride 的商业条款依赖可变的伙伴收入分成，而非透明的软件许可费或公布的每英里车队费率；现场扩张则靠在 10 个州持续招聘。
            claimRefs:
              - CM003
