              - CM012
          - type: callout
            title: 双平台架构作为差异化利用对冲
            body: 在统一技术架构下同时运营人行道配送机器人和乘客 Robotaxi，让 Avride 能收集高密度运营遥测数据，并依靠大学餐饮合同支撑现金流；与此同时，资本密集型乘客自动驾驶业务仍受安全员和地理围栏设计域限制。
            calloutType: insight
