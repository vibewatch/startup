              - CV008
      - number: '8.3'
        title: 情景分析、退出准备度与尽调要求
        blocks:
          - type: paragraph
            body: >-
              评估 Avride 需要对乐观、基准和悲观运营路径进行有纪律的情景建模。乐观情景下，公司将配送机器人扩大到 1,000 台以上、Robotaxi 扩大到 500
              辆，实现正的单元贡献利润，在不受运营限制的情况下解决监管调查，从而可能分拆或上市退出。基准情景下，人行道配送在校园和城市网络稳步扩张，但 Robotaxi
              部署仍受监管监督和人工安全司机开支约束，估值倍数扩张受限。悲观情景假设联邦执法或客户责任事故限制车队运营，触发伙伴重新谈判或资本收缩。近期尽调重点包括获取经审计的股权结构表、与 Nebius Group
              的关联方协议，以及单元层面的经济性。
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV008
              - CV011
              - CV012
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 投资纪律：股权与监管明确前维持观察立场
            body: >-
              Avride 的双形态工程和与 Uber、Nebius 的高知名度合作验证了技术可行性，但机构投资者仍必须保持纪律。$375 million
              融资方案的构成尚未得到验证，联邦安全调查也未解决，因此应维持观察立场，而不是过早投入成长股权。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV007
