callouts:
  - calloutType: "risk"
    title: "Federal Defect Probe Threatens Commercial Deployment Horizon"
    body: "NHTSA's preliminary evaluation into Avride's automated driving system directly challenges the commercial premise of its robotaxi rollout. If regulators determine that recurring lane-change collisions and stationary obstacle impacts constitute an unreasonable safety risk, Avride faces mandatory software recalls or operational curtailment that would stall its planned 500-vehicle fleet expansion."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
  - calloutType: "insight"
    title: "Safety Monitor Inaction Highlights Critical Operational Risk"
    body: "The finding that safety monitors intervened in only one of sixteen collisions (a 6.25% intervention rate) exposes a dangerous breakdown in human-in-the-loop oversight. Rather than serving as an effective safeguard, human monitors in supervised testing exhibited severe passive fatigue and slow takeover latency, demonstrating that hardware presence alone cannot substitute for autonomous system competence."
    claimRefs:
      - "CR004"
      - "CR005"
