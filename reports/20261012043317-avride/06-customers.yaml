company:
  name: "Avride"
chapter:
  number: 6
  title: "Customers"
  summary: "Avride monetizes its dual-modality autonomous vehicle stack primarily through platform partnerships with Uber, Grubhub, and Sodexo Campus rather than direct consumer acquisition. While sidewalk delivery robots have established commercial operations across college campuses and select urban centers, robotaxi deployment remains concentrated in early Dallas pilots with Uber, leaving the company heavily exposed to partner platform roadmaps, contract terms, and regulatory approvals."
sections:
  - id: "customer-segmentation-and-buyer-dynamics"
    title: "Customer Base Segmentation and Platform Distribution Channels"
    body: "Avride structures its commercial strategy around a dual-modality autonomous vehicle architecture, deploying sidewalk delivery robots alongside passenger robotaxis through third-party demand platforms rather than proprietary consumer applications. In the delivery vertical, the primary commercial customers are food delivery aggregators and enterprise campus dining operators, including Uber Eats, Grubhub, and Sodexo Campus. These corporate counterparties act as distribution channels and billing aggregators, embedding Avride rovers directly into existing student and consumer workflows. In mobility, Avride's customer relationship is intermediated through Uber's ride-hail network, where riders in initial launch markets such as Dallas are matched with autonomous vehicles on qualifying trips. This B2B2C distribution posture allows Avride to bypass the substantial capital expenditure required to establish consumer brand recognition and customer acquisition funnels, but it structurally separates the company from end-payer relationships and leaves transaction pricing under platform control."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU005"
      - "CU015"
    tableRefs:
      - "TU001"
  - id: "commercial-adoption-and-fleet-deployment"
    title: "Adoption Trajectory, Fleet Scale, and Urban Delivery Operations"
    body: "Operational metrics across Avride's delivery segment indicate substantial cumulative activity, with company rovers having completed more than 600,000 autonomous commercial deliveries across domestic and international markets as of mid-2025. Sidewalk delivery operations are optimized for short-distance micro-logistics, featuring rovers that travel at pedestrian-adjacent speeds of up to five miles per hour with a total battery range of 31 miles and an effective operating radius of one to two miles per trip. In urban environments, Avride launched commercial operations on Uber Eats in downtown Jersey City, establishing service across a one-square-mile zone spanning Hamilton Park, Historic Downtown, and the Waterfront. When placing qualifying orders on Uber Eats within active zones, consumers are given an explicit option between human courier delivery and an autonomous Avride robot. Once dispatched, users track rover transit in real time through the aggregator's mobile interface and unlock the cargo bay upon curbside arrival, illustrating an integrated dispatch and fulfillment loop that operates without human driving personnel."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-customer-proof-and-campus-rollouts"
    title: "Named Customer Proof, University Deployments, and Contract Terms"
    body: "The clearest evidence of repeatable commercial adoption exists within higher education dining, where closed pedestrian campus layouts provide favorable operating environments for sidewalk rovers. Avride has established active deployments at Ohio State University, Indiana University Bloomington, the University of Arizona, and Salisbury University. At Ohio State, Avride rovers operate daily from 7 a.m. to 10 p.m. with a reported fleet exceeding 100 robots fulfilling dining orders through Grubhub at a flat fee of $2.50 per delivery. Similarly, at Indiana University Bloomington, a dedicated fleet of 24 Avride rovers launched in June 2024 through IU Dining and Hospitality and Grubhub, assessing a $3.50 delivery fee per order. To accelerate expansion across higher education, Avride signed a master commercial agreement with Sodexo Campus, providing a framework to deploy autonomous fleets across Sodexo's network of approximately 425 partner colleges and universities nationwide. On-site operational reliability across these campuses is maintained by dedicated technician assistants who handle charging, sensor calibration, and routine mechanical maintenance."
    claimRefs:
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU012"
    tableRefs:
      - "TU003"
  - id: "concentration-risks-and-partnership-durability"
    title: "Channel Concentration, Seasonal Demand, and Contract Durability"
    body: "Despite meaningful operational milestones, Avride faces acute customer and partner concentration risks that create vulnerability for long-term revenue durability. The company's commercial volume is almost entirely dependent on Uber for urban ride-hail and food delivery, and Grubhub or Sodexo for collegiate dining. This reliance concentrates counterparty risk, leaving Avride vulnerable if platform partners renegotiate revenue splits, alter dispatch algorithms, or introduce multi-partner competition—as Sodexo has done by also contracting with Kiwibot and Starship Technologies. Furthermore, campus dining contracts exhibit severe seasonal demand fluctuations, effectively generating revenue for only seven months of the academic year during active student enrollment. Macroeconomic and industry headwinds highlighted by platform leadership—including high vehicle sensor outfitting costs, complex municipal regulations, and harsh winter operating conditions—further constrain unit economics and slow geographic expansion."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU013"
      - "CU014"
      - "CU016"
