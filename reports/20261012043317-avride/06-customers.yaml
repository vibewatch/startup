callouts:
  - calloutType: "risk"
    title: "Platform Intermediation and Campus Seasonality Threaten Terminal Revenue Durability"
    body: "Avride's commercial model relies almost exclusively on third-party aggregators (Uber, Grubhub) and food service contractors (Sodexo) for order origination and campus access. While this outsourced GTM approach drastically reduces direct customer acquisition costs, it concentrates volume risk in a handful of key partners and subjects operations to steep academic calendar seasonality, where campus fleets sit largely idle during summer and winter breaks without disclosed minimum volume guarantees."
    claimRefs:
      - "CU001"
      - "CU013"
      - "CU014"
