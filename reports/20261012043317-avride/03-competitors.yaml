callouts:
  - calloutType: "insight"
    title: "The Uber Multi-Partner Paradox for Partner-Led Autonomy"
    body: "Avride’s partnership with Uber grants rapid distribution across millions of active urban riders and diners without direct customer acquisition costs. However, Uber's deliberate multi-partner strategy—deploying AVs across 11 cities with six distinct robotics and autonomy companies—prevents Avride from establishing exclusivity. Uber functions as an open mobility clearinghouse rather than a captive distributor, leaving Avride vulnerable to platform fee compression and rival AV dispatch prioritization."
