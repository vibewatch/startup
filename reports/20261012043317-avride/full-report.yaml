      - number: '1.2'
        title: Executive Leadership and Technical Governance
        blocks:
          - type: paragraph
            body: >-
              The leadership team at Avride is led by Chief Executive Officer Dmitry Polishchuk, who previously
              spearheaded the autonomous driving division at Yandex prior to the corporate reorganization. Polishchuk
              and the founding engineering cadre transitioned the core technical assets and operational playbooks to
              Avride. The technical and operational roster spans hardware engineering, robotics service maintenance, and
              continuous data quality validation across field hubs in Texas and international engineering centers. The
              executive team maintains strong technical cohesion rooted in shared multi-year autonomy engineering
              experience, but key-person dependence remains acute around Polishchuk and his founding software
              leadership. Strategic governance is anchored by primary institutional stakeholders Nebius Group and Uber
              Technologies, who exercise material governance leverage through capital commitments, platform distribution
              rights, and commercial integration agreements.
