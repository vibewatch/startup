      - number: '4.2'
        title: Pricing Mechanisms and Channel Economics
        blocks:
          - type: paragraph
            body: >-
              Avride's go-to-market structure is platform-dependent, relying on Uber and Grubhub to capture consumer
              demand and route trips to autonomous units. This wholesale partner-led motion eliminates direct customer
              acquisition costs, sales marketing overhead, and local rider app promotion budgets. In exchange, realized
              pricing is governed by the host platform's marketplace dispatch algorithms and prevailing dynamic fare
              schedules rather than an independent Avride tariff. Procurement analysis indicates that autonomous driving
              platform contracts typically encounter pricing escalation when expanding across operating design domains
              and service geographies. Additionally, potential platform fees, software support tiers, and data telemetry
              charges represent significant variable deductions from gross transaction revenues.
