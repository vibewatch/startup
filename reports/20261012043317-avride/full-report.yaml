      - number: '5.4'
        title: Safety Record, Regulatory Review, and Engineering Gaps
        blocks:
          - type: paragraph
            body: >-
              Avride's technical expansion faces meaningful regulatory scrutiny and operational challenges that temper
              headline commercial milestones. While the company completed over 60,000 commercial trips and accumulated
              1.3 million autonomous miles in Dallas by mid-2026, federal safety regulators have raised substantive
              concerns regarding system competence. On May 6, 2026, NHTSA's Office of Defects Investigation opened
              preliminary evaluation PE26003 covering 16 low-speed collisions in Dallas and Austin. The regulator
              specifically cited behavioral deficiencies including improper lane-change maneuvers, failure to yield to
              stationary vehicles, and an operating profile characterized by excessive assertiveness combined with
              insufficient capability. Furthermore, commercial robotaxi trips remain dependent on in-vehicle safety
              specialists, and Avride has not published standardized disengagement metrics,
              mean-time-between-interventions figures, or formal automotive cybersecurity certifications, leaving key
              aspects of its commercial scalability and driverless safety case uncorroborated for prospective investors.
            claimRefs:
              - CE011
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Cross-Modal Autonomy Leverage
            body: >-
              Avride's dual-modality architecture enables continuous sharing of perception and behavioral learning
              models between high-speed urban robotaxis and high-frequency pedestrian sidewalk couriers, accelerating
              algorithmic validation while amortizing core engineering R&D across two revenue streams.
            calloutType: insight
            claimRefs:
              - CE001
              - CE002
          - type: callout
            title: Regulatory Scrutiny and Safety Driver Dependency
            body: >-
              The opening of NHTSA preliminary evaluation PE26003 following 16 low-speed collisions highlights
              behavioral edge-case vulnerabilities in dense urban traffic, emphasizing that Avride's commercial
              passenger service remains tethered to in-vehicle safety specialists rather than fully driverless
              economics.
            calloutType: risk
            claimRefs:
              - CE011
              - CE012
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Platform Distribution Channels
        blocks:
          - type: paragraph
            body: >-
              Avride structures its commercial strategy around a dual-modality autonomous vehicle architecture,
              deploying sidewalk delivery robots alongside passenger robotaxis through third-party demand platforms
              rather than proprietary consumer applications. In the delivery vertical, the primary commercial customers
              are food delivery aggregators and enterprise campus dining operators, including Uber Eats, Grubhub, and
              Sodexo Campus. These corporate counterparties act as distribution channels and billing aggregators,
              embedding Avride rovers directly into existing student and consumer workflows. In mobility, Avride's
              customer relationship is intermediated through Uber's ride-hail network, where riders in initial launch
              markets such as Dallas are matched with autonomous vehicles on qualifying trips. This B2B2C distribution
              posture allows Avride to bypass the substantial capital expenditure required to establish consumer brand
              recognition and customer acquisition funnels, but it structurally separates the company from end-payer
              relationships and leaves transaction pricing under platform control.
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
      - number: '6.2'
        title: Adoption Trajectory, Fleet Scale, and Urban Delivery Operations
        blocks:
          - type: paragraph
            body: >-
              Operational metrics across Avride's delivery segment indicate substantial cumulative activity, with
              company rovers having completed more than 600,000 autonomous commercial deliveries across domestic and
              international markets as of mid-2025. Sidewalk delivery operations are optimized for short-distance
              micro-logistics, featuring rovers that travel at pedestrian-adjacent speeds of up to five miles per hour
              with a total battery range of 31 miles and an effective operating radius of one to two miles per trip. In
              urban environments, Avride launched commercial operations on Uber Eats in downtown Jersey City,
              establishing service across a one-square-mile zone spanning Hamilton Park, Historic Downtown, and the
              Waterfront. When placing qualifying orders on Uber Eats within active zones, consumers are given an
              explicit option between human courier delivery and an autonomous Avride robot. Once dispatched, users
              track rover transit in real time through the aggregator's mobile interface and unlock the cargo bay upon
              curbside arrival, illustrating an integrated dispatch and fulfillment loop that operates without human
              driving personnel.
            claimRefs:
              - CU003
              - CU004
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU003
              - CU004
              - CU008
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU004
              - CU010
              - CU011
              - CU012
      - number: '6.3'
        title: Named Customer Proof, University Deployments, and Contract Terms
        blocks:
          - type: paragraph
            body: >-
              The clearest evidence of repeatable commercial adoption exists within higher education dining, where
              closed pedestrian campus layouts provide favorable operating environments for sidewalk rovers. Avride has
              established active deployments at Ohio State University, Indiana University Bloomington, the University of
              Arizona, and Salisbury University. At Ohio State, Avride rovers operate daily from 7 a.m. to 10 p.m. with
              a reported fleet exceeding 100 robots fulfilling dining orders through Grubhub at a flat fee of $2.50 per
              delivery. Similarly, at Indiana University Bloomington, a dedicated fleet of 24 Avride rovers launched in
              June 2024 through IU Dining and Hospitality and Grubhub, assessing a $3.50 delivery fee per order. To
              accelerate expansion across higher education, Avride signed a master commercial agreement with Sodexo
              Campus, providing a framework to deploy autonomous fleets across Sodexo's network of approximately 425
              partner colleges and universities nationwide. On-site operational reliability across these campuses is
              maintained by dedicated technician assistants who handle charging, sensor calibration, and routine
              mechanical maintenance.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU005
      - number: '6.4'
        title: Channel Concentration, Seasonal Demand, and Contract Durability
        blocks:
          - type: paragraph
            body: >-
              Despite meaningful operational milestones, Avride faces acute customer and partner concentration risks
              that create vulnerability for long-term revenue durability. The company's commercial volume is almost
              entirely dependent on Uber for urban ride-hail and food delivery, and Grubhub or Sodexo for collegiate
              dining. This reliance concentrates counterparty risk, leaving Avride vulnerable if platform partners
              renegotiate revenue splits, alter dispatch algorithms, or introduce multi-partner competition—as Sodexo
              has done by also contracting with Kiwibot and Starship Technologies. Furthermore, campus dining contracts
              exhibit severe seasonal demand fluctuations, effectively generating revenue for only seven months of the
              academic year during active student enrollment. Macroeconomic and industry headwinds highlighted by
              platform leadership—including high vehicle sensor outfitting costs, complex municipal regulations, and
              harsh winter operating conditions—further constrain unit economics and slow geographic expansion.
            claimRefs:
              - CU001
              - CU002
              - CU013
              - CU014
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform Intermediation and Campus Seasonality Threaten Terminal Revenue Durability
            body: >-
              Avride's commercial model relies almost exclusively on third-party aggregators (Uber, Grubhub) and food
              service contractors (Sodexo) for order origination and campus access. While this outsourced GTM approach
              drastically reduces direct customer acquisition costs, it concentrates volume risk in a handful of key
              partners and subjects operations to steep academic calendar seasonality, where campus fleets sit largely
              idle during summer and winter breaks without disclosed minimum volume guarantees.
            calloutType: risk
            claimRefs:
              - CU001
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Federal Safety Probes and Regulatory Enforcement
        blocks:
          - type: paragraph
            body: >-
              The primary existential risk facing Avride centers on regulatory scrutiny from the National Highway
              Traffic Safety Administration (NHTSA), whose Office of Defects Investigation opened a formal preliminary
              evaluation following 16 reported robotaxi crashes and one minor injury across Texas between December 2025
              and March 2026. All incidents involved Avride's fleet of Hyundai Ioniq 5 vehicles operating with automated
              driving systems engaged under the nominal oversight of safety monitors. Federal investigators identified
              repeated systemic failures in core driving tasks, specifically noting instances where autonomous vehicles
              changed lanes directly into the path of adjacent vehicles, failed to decelerate for slow-moving or
              stationary traffic, and struck stationary obstacles partially obstructing the travel lane. Regulators
              described the vehicle behavior as displaying excessive assertiveness and insufficient capability, warning
              that these patterns may constitute traffic safety violations. While Avride reported 17 total collisions in
              Austin since testing began, the clustering of 16 incidents in the first four months of Dallas commercial
              operations demonstrates that rapid deployment under permissive Texas frameworks has outpaced the
              technological maturity of the self-driving stack.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR007
              - CR008
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR007
              - CR008
              - CR010
      - number: '7.2'
        title: Operational Vulnerabilities, Software Competence, and Fleet Controls
        blocks:
          - type: paragraph
            body: >-
              Beyond headline regulatory filings, Avride's operational risk profile reveals critical weaknesses in
              sensor perception, object avoidance, and driver oversight mechanisms. Crash records indicate collisions
              with both moving vehicles and stationary objects, including a dumpster and the open door of a parked
              pickup truck that injured a bystander. Most alarmingly, safety monitors seated in the driver's seat
              intervened in only one of the sixteen recorded crashes, yielding an intervention rate of just 6.25% and
              exposing severe passive supervision fatigue. Avride declined to explain why monitors failed to act,
              relying instead on post-incident software mitigations and claims of declining incident frequency per mile
              without disclosing supporting mileage baselines. On the delivery robotics side, sidewalk units are
              physically constrained by an optimal operating radius of one to two miles and vulnerable to moderate
              precipitation and snow. Furthermore, fleet readiness requires labor-intensive field operations, with
              technician assistants performing daily battery power cycles, wheel alignments, and physical sensor
              calibrations across distributed depots to prevent hardware degradation.
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR009
              - CR011
              - CR014
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR004
              - CR005
              - CR006
              - CR011
              - CR014
              - CR015
      - number: '7.3'
        title: Platform Dependence, Capital Structure, and Commercial Concentration
        blocks:
          - type: paragraph
            body: >-
              Avride's commercial model introduces severe partner concentration risks through its near-total reliance on
              Uber Technologies for demand generation, customer acquisition, and dispatch infrastructure. In Dallas
              robotaxi operations and Jersey City sidewalk delivery, Avride functions as a platform supplier whose
              reputation and passenger volume are tightly coupled to Uber's marketplace. This arrangement leaves Avride
              vulnerable to platform competition, as Uber actively tests competing robotaxis from Waymo, Nuro, and
              Volkswagen, limiting Avride's pricing power and partner defensibility. On the capital front, Avride
              remains dependent on an up-to-$375 million strategic commitment package from Uber and controlling
              shareholder Nebius Group to fund its goal of expanding to 500 vehicles. Any deterioration in corporate
              relations, shift in Nebius's capital allocation toward AI infrastructure, or reputation-driven retreat by
              Uber following regulatory enforcement could leave Avride with high vehicle hardware commitments and
              insufficient standalone cash flow to support ongoing autonomous R&D.
            claimRefs:
              - CR001
              - CR006
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR012
              - CR013
      - number: '7.4'
        title: Residual Exposure Heatmap and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Synthesizing Avride's risk landscape highlights two thesis-breaking failure modes: regulatory enforcement
              halting commercial robotaxi deployments, and partner disengagement by Uber in response to customer safety
              controversies. While Avride has expanded hiring to 76 positions—including senior test engineers to refine
              evaluation metrics—the lack of transparent miles-between-intervention data prevents independent validation
              of its claimed safety improvements. Investors must monitor explicit thesis-break triggers: escalation of
              NHTSA's preliminary evaluation into a formal engineering analysis or recall order; municipal permitting
              pauses or restrictions imposed by Austin or Dallas transportation authorities; and any reduction or
              suspension of Avride robotaxi dispatch options on the Uber platform. Until Avride provides audited safety
              disengagement data and clarifies passenger liability indemnification in its commercial partner agreements,
              its risk posture remains elevated, requiring a significant valuation discount relative to autonomous
              mobility leaders.
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR009
              - CR010
              - CR012
              - CR013
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR004
              - CR010
              - CR012
              - CR013
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Federal Defect Probe Threatens Commercial Deployment Horizon
            body: >-
              NHTSA's preliminary evaluation into Avride's automated driving system directly challenges the commercial
              premise of its robotaxi rollout. If regulators determine that recurring lane-change collisions and
              stationary obstacle impacts constitute an unreasonable safety risk, Avride faces mandatory software
              recalls or operational curtailment that would stall its planned 500-vehicle fleet expansion.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: callout
            title: Safety Monitor Inaction Highlights Critical Operational Risk
            body: >-
              The finding that safety monitors intervened in only one of sixteen collisions (a 6.25% intervention rate)
              exposes a dangerous breakdown in human-in-the-loop oversight. Rather than serving as an effective
              safeguard, human monitors in supervised testing exhibited severe passive fatigue and slow takeover
              latency, demonstrating that hardware presence alone cannot substitute for autonomous system competence.
            calloutType: insight
            claimRefs:
              - CR004
              - CR005
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The core investment thesis for Avride centers on its capital-efficient dual-modality deployment across
              autonomous passenger robotaxis and sidewalk delivery robots under a unified AI architecture. By partnering
              with leading demand aggregators, primarily Uber and Uber Eats alongside Grubhub on college campuses,
              Avride bypasses the immense customer acquisition costs that hindered earlier autonomous vehicle operators.
              Commercial milestones including over 100,000 autonomous rides on Uber and operational deployments across
              multiple metropolitan markets demonstrate meaningful real-world execution. Conversely, the anti-thesis
              highlights severe counterparty concentration on Uber's platform, unquantified financial commitments within
              the headline up-to-$375 million financing package, ongoing active regulatory scrutiny from federal safety
              investigations, and intense competition from well-capitalized incumbents such as Waymo.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV008
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV006
              - CV008
      - number: '8.2'
        title: Recommendation Stance and Financing Context
        blocks:
          - type: paragraph
            body: >-
              We assign Avride a track recommendation with medium confidence, a high risk rating, and a stretched
              valuation stance. In October 2025, Avride secured strategic investments and commercial commitments
              totaling up to $375 million from parent Nebius Group and commercial partner Uber. While publicized as a
              major funding round, official releases frame the transaction as a combination of strategic investments and
              commercial commitments rather than pure, priced equity. Crucial transaction terms—such as pre-money
              valuation, equity versus milestone-contingent debt or commercial credits, liquidation preferences, and
              minority shareholder governance rights—remain undisclosed. In the absence of audited revenue run-rates,
              gross margin disclosures, or unit economics per delivery and robotaxi ride, underwriting a premium private
              market valuation poses substantial downside risk.
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV011
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV008
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV007
              - CV008
      - number: '8.3'
        title: Scenario Analysis, Exit Readiness, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Evaluating Avride requires disciplined scenario modeling across bull, base, and bear operating pathways.
              In the bull case, Avride scales beyond 1,000 delivery bots and 500 robotaxis, achieving positive unit
              contribution margins while resolving regulatory inquiries without operational restrictions, positioning
              the business for a potential spin-off or public exit. The base case sees steady sidewalk delivery
              expansion on campus and city networks, but robotaxi deployment remains gated by regulatory oversight and
              human safety-driver overhead, limiting multiple expansion. The bear case models federal enforcement
              actions or customer liability incidents that restrict fleet operations, triggering partner renegotiations
              or capital curtailment. Immediate diligence priorities include obtaining audited cap table breakdowns,
              intercompany agreements with Nebius Group, and unit-level economics.
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV009
              - CV010
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV008
              - CV011
              - CV012
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Investment Discipline: Maintain Track Stance Pending Equity and Regulatory Clarity'
            body: >-
              While Avride's dual-modality engineering and high-profile partnerships with Uber and Nebius validate
              technological viability, institutional investors must remain disciplined. The unverified composition of
              the $375 million financing package and unresolved federal safety inquiries necessitate holding a track
              posture rather than committing early growth equity.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV008
