        title: Cost Structure and Field Operations Overhead
        blocks:
          - type: paragraph
            body: >-
              The company's operational cost structure reflects substantial hardware capitalization and ongoing local
              depot support requirements. Sensor packages comprising lidar, radar, cameras, and compute units add
              significant capital costs to retrofitted Hyundai Ioniq 5 electric vehicles and custom delivery robots.
              Beyond vehicle depreciation, service delivery requires continuous manual labor. Field technician personnel
              are deployed at local depots to conduct nightly battery charging, mechanical maintenance, sensor
              recalibrations, and physical cleaning to preserve fleet readiness. Ongoing recruitment across more than 70
              engineering and technician openings underscores continuous operational expenditure to sustain commercial
              deployments in launch markets.
