      - number: '1.3'
        title: Capitalization Structure, Commercial Fleet Scale, and Regulatory Scrutiny
        blocks:
          - type: paragraph
            body: >-
              Avride's capitalization is anchored by a strategic financing package of up to $375 million in investments
              and commercial commitments backed by Uber Technologies and parent entity Nebius Group. While recruitment
              summaries and private aggregator databases cite total funding numbers ranging between $375 million and
              $425 million, public disclosure remains sparse regarding exact round tranches, pre-money valuation
              benchmarks, and minority governance protections. Operationally, Avride deploys retrofitted Hyundai Ioniq 5
              electric vehicles equipped with custom lidar, radar, and camera sensor suites for robotaxi rides on Uber's
              platform in Dallas. In sidewalk logistics, Avride operates delivery robots across Austin, Dallas, and
              Jersey City, in addition to higher-education campus deployments at institutions such as Ohio State
              University. However, operational expansion has attracted scrutiny: the National Highway Traffic Safety
              Administration opened a formal safety probe (PE26003) following 80 logged autonomous vehicle incidents.
