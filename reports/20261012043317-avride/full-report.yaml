      - number: '2.4'
        title: Adoption Constraints, Regulatory Hurdles, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Despite demonstrable deployment milestones across Texas and university campuses, Avride faces severe
              structural headwinds that govern adoption timing and valuation multiples. Most critically, commercial
              passenger robotaxi operations remain subject to human safety operator requirements behind the wheel,
              preventing the realization of driverless labor cost savings. The company's safety profile is under active
              regulatory scrutiny: through August 17, 2026, the National Highway Traffic Safety Administration recorded
              80 autonomous mode collision events involving Avride vehicles, prompting a formal federal defect
              investigation into driving competence in May 2026. These safety challenges and operational constraints are
              reflected in independent benchmark evaluations; The Road to Autonomy Robotaxi Index ranks Avride #11 with
              a composite score of 35.7 out of 100, heavily penalized by scores of 15/100 in autonomous operations and
              31/100 in safety. Addressing these safety inquiries and proving unassisted driver-out capabilities
              represent non-negotiable hurdles before Avride can expand beyond supervised partner pilots.
            claimRefs:
              - CM011
              - CM012
