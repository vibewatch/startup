      - number: '5.3'
        title: Sensor Suite, Edge Compute, and Operating Stack
        blocks:
          - type: paragraph
            body: >-
              The physical and computing architecture of Avride's vehicles emphasizes multi-modal sensor fusion and
              edge-computed functional safety. The delivery robot utilizes an integrated sensor suite comprising
              high-frequency lidar capable of detecting obstacles up to 60 meters away regardless of ambient lighting,
              multi-angle semantic cameras for color recognition and traffic-light classification, and ultrasonic
              sensors that initiate immediate emergency stopping if obstacles abruptly appear. Its passenger robotaxi
              configuration deploys five high-resolution lidars alongside radar units and cameras to maintain complete
              360-degree field-of-view coverage around the vehicle. Sensor streams are processed by ruggedized onboard
              computing units that execute neural network inference, localization matching against proprietary
              high-definition maps, and trajectory planning without requiring real-time cloud connectivity. The robot
              hardware incorporates an IP66 water-resistant enclosure, an easily swappable battery providing up to 50
              kilometers of driving range, and a locked 25-kilogram cargo compartment with multi-order partitions.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
