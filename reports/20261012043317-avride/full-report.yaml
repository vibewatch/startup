chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Lineage and Structural Evolution
        blocks:
          - type: paragraph
            body: >-
              Avride Inc. develops autonomous driving technology for passenger cars and last-mile delivery robots. The
              team began developing autonomous vehicles within Yandex in 2017 before forming as a dedicated corporate
              spin-off in 2020. Following the corporate restructuring and divestment of Russian assets by parent Nebius
              Group in July 2024, Avride emerged as an independent Western operating entity retained under Nebius Group.
              While historical corporate filings and corporate directories record a registered location in Newburyport,
              Massachusetts, the company maintains its operational headquarters, engineering footprint, and vehicle
              facilities in Austin, Texas. The company develops a dual-modality autonomous system where passenger
              robotaxis and sidewalk delivery robots share core software algorithms and hardware components. This
              cross-platform approach enables operational learnings and sensor data gathered from urban sidewalk
              deliveries to directly inform passenger vehicle navigation systems.
