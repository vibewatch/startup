  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Avride defines its commercial operational boundary around partner-facilitated autonomous transit rather
              than vertically integrated direct-to-consumer fleet operations. In the passenger mobility domain, the
              company operates retrofitted Hyundai Ioniq 5 electric vehicles integrated with its proprietary Level 4
              autonomous driving technology stack. Commercial operations in this category encompass urban ride-hail
              trips and downtown point-to-point transit, while explicitly excluding personal automotive vehicle sales,
              private consumer vehicle ownership, and heavy long-haul intercity transit. Within sidewalk logistics,
              Avride deploys specialized wheeled delivery robots targeting dense urban restaurant meal drop-offs and
              campus dining workflows. The primary status-quo substitutes across these domains remain human gig-economy
              couriers and human rideshare drivers operating on standard dispatch networks. By pairing both vehicle
              modalities on a shared machine-learning and sensor architecture, Avride seeks to capture platform spend
              without assuming direct consumer marketing and customer acquisition burdens.
            claimRefs:
              - CM001
              - CM004
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM004
              - CM006
              - CM007
      - number: '2.2'
        title: Addressable Market Sizing Across Macro, Segment, and Operating Lenses
        blocks:
          - type: paragraph
            body: >-
              Evaluating the commercial market opportunity for Avride requires reconciling top-down industry projections
              with evidence-constrained operational milestones. At the macroeconomic tier, Uber leadership has
              characterized autonomous transportation as a trillion-dollar market opportunity in the United States
              alone, reflecting the massive potential reallocation of personal vehicle expenditure and gig-economy
              driver compensation into autonomous networks. Broader transportation analyst models project the global
              autonomous vehicle industry to reach $214.32 billion by 2030, with dedicated robotaxi services forecast to
              grow from $1.95 billion in 2024 to $43.76 billion by 2030 at a 73.5% compound annual growth rate. However,
              Avride's addressable reality is anchored more conservatively by contracted partner financing and
              geographically geofenced operations. The company has secured up to $375 million in strategic capital and
              commercial commitments from Uber and parent company Nebius Group, while expanding its commercial robotaxi
              footprint across Dallas from an initial nine square miles to 31 square miles.
            claimRefs:
              - CM002
              - CM008
              - CM009
              - CM010
