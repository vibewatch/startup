      - number: '2.3'
        title: Buyer Segmentation, Budget Ownership, and Partner Adoption Workflows
        blocks:
          - type: paragraph
            body: >-
              Avride's commercial go-to-market structure is distinguished by an intermediary B2B2C distribution model
              that segments buyers across major digital dispatch platforms, institutional food service operators, and
              automotive OEMs. For urban passenger transit, the primary enterprise counterparty is Uber's autonomous
              mobility division, which manages fleet charging, maintenance depots, and end-user rider matching while
              pricing rides at parity with human drivers. This structure has enabled Avride to surpass 100,000 completed
              Dallas passenger rides under safety driver supervision. In last-mile delivery, Avride targets
              institutional campus dining directors through partnerships with Grubhub, Sodexo Campus, and Chartwells,
              deploying autonomous bots across more than 25 university campuses to resolve persistent dining labor
              constraints. Procurement evaluations indicate that Avride's commercial terms rely on variable partner
              revenue-share agreements rather than transparent software licensing fees or published per-mile fleet
              rates, while field expansion is sustained by active workforce hiring across ten states.
            claimRefs:
              - CM003
