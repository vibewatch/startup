      - number: '5.2'
        title: Commercial Workflows and Last-Mile Integration
        blocks:
          - type: paragraph
            body: >-
              Avride scales its commercial operations through platform-centric partnerships rather than building
              consumer-facing passenger or delivery applications from scratch. Under a multi-year strategic agreement
              with Uber, Avride integrates its autonomous fleet directly into the Uber and Uber Eats ecosystems across
              Dallas, Austin, and Jersey City. When consumers place orders or request rides in geofenced operational
              zones, the partner platform automatically dispatches an Avride vehicle or delivery robot when suitable
              routes and fleet capacity permit. For sidewalk delivery, robots navigate pedestrian pathways and
              crosswalks within an optimal one-to-two-mile radius, alerting the customer upon arrival so they can unlock
              the secured cargo hatch via their smartphone application. Physical fleet turnaround is supported by local
              depot operations where technicians perform daily power management, battery charging cycles, sensor
              cleanings, and mechanical wheel alignments to ensure continuous vehicle readiness across morning and
              evening delivery shifts.
            claimRefs:
              - CE005
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE002
