      - number: '4.4'
        title: Capital Adequacy and Financial Diligence Verdict
        blocks:
          - type: paragraph
            body: >-
              Avride's capital adequacy centers on the up-to-$375 million strategic transaction announced with Uber and
              Nebius Group. This financing package is structured around performance-linked milestones rather than an
              upfront cash transfer, aligning capital releases with operational thresholds such as scaling toward 500
              vehicles. While backing from an anchor platform investor and parent company Nebius provides strategic
              validation, lack of transparency regarding net cash, burn rate, and capital milestone triggers creates
              significant underwriting uncertainty. Evaluating forward capital adequacy requires verifying whether unit
              contribution margins turn positive before milestone capital is exhausted.
            claimRefs:
              - CI001
              - CI003
              - CI011
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Partner-Led Capital Leverage Versus Platform Dependency
            body: >-
              Avride's commercial model relies heavily on distribution partnerships with Uber and Grubhub to avoid
              direct consumer acquisition overhead. While this dramatically lowers marketing burn and provides immediate
              access to high-density order volume across Texas, New Jersey, and university campuses, it creates severe
              customer concentration. Under this structure, Avride acts as a capacity supplier rather than an
              independent network operator, leaving realized pricing, fleet dispatch priority, and long-term gross
              margin progression subject to platform partner renegotiations.
            calloutType: risk
            claimRefs:
              - CI002
              - CI007
              - CI008
          - type: callout
            title: Milestone-Linked Capital Tranches Create Execution Hurdle
            body: >-
              The headline $375 million financing package from Uber and Nebius consists of strategic investments and
              commercial commitments tied to performance milestones rather than an immediate lump-sum balance sheet
              injection. Continued capital drawdowns depend on commercial deployment gates, including scaling fleets
              toward 500 vehicles and successfully operationalizing robotaxi passenger services in Dallas. Private
              financing dependency and undefined milestone criteria remain critical diligence gating items for
              underwriting forward runway.
            calloutType: insight
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI011
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Unified Autonomy Architecture and Product Modalities
        blocks:
          - type: paragraph
            body: >-
              Avride operates a dual-modality autonomous transportation business that deploys Level 4 self-driving
              technology across passenger robotaxis and last-mile sidewalk delivery robots. Unlike autonomous vehicle
              developers that focus exclusively on passenger mobility or commercial trucking, Avride leverages a common
              AI autonomy stack across both form factors, adapting core software modules for differing speed envelopes
              and operational domains. The company traces its technical foundations to seven years of self-driving
              research initiated in 2017 within Yandex's autonomous driving division before spinning out and
              establishing headquarters in Austin, Texas. In the passenger segment, Avride deploys all-electric Hyundai
              IONIQ 5 retrofitted vehicles in commercial ride-hailing services. Simultaneously, the company produces
              compact four-wheeled sidewalk robots tailored for high-density food and package deliveries. This
              shared-stack strategy allows engineering improvements in perception and predictive modeling to benefit
              both vehicle categories, although commercial passenger deployments continue to operate with on-board
              trained safety specialists.
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE013
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
