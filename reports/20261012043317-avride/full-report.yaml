        - Uber termination, non-renewal, or shift of volume allocation to competing platforms like Waymo.
      - - Anti-Thesis (Bear)
        - Regulatory and safety liability
        - Federal safety investigations into autonomous vehicle collision incidents create operational freeze risk.
        - Formal NHTSA recall, enforcement decree, or municipal operating permit revocation.
      - - Anti-Thesis (Bear)
        - Capital opacity and parent dependency
        - Financing package blends commercial commitments with investment; Nebius intercompany terms undisclosed.
        - Audited stand-alone financial disclosure confirming multi-year cash runway and independent governance.
    notes: Thesis evaluation balances operational milestones against documented governance and regulatory vulnerabilities.
    claimRefs:
      - CV001
      - CV003
      - CV004
      - CV006
      - CV008
  - id: TV003
    title: Valuation Scenarios and Downside Triggers
    columns:
      - Scenario
      - Operating & Scale Assumptions
      - Implied Valuation Logic
      - Probability Signal
      - Downside Triggers & Diligence Asks
    rows:
      - - Bull Case
        - Rapid fleet scaling to 500+ robotaxis and 1,000+ sidewalk delivery bots; positive unit economics.
        - Premium autonomous technology multiple reflecting high growth and dominant campus market share.
        - Low to Moderate
        - Contingent on clean closure of federal probe and proven sub-dollar cost per delivery mile.
      - - Base Case
        - Gradual sidewalk bot expansion in university campuses; robotaxis remain limited with safety drivers.
        - Hardware-enabled services multiple with substantial discount for partner concentration.
        - Moderate to High
        - Slow regulatory approvals in target metropolitan areas and prolonged safety driver requirements.
      - - Bear Case
        - Adverse regulatory findings restrict robotaxi permits; Uber reduces commitment or prioritizes rivals.
        - Distressed asset or liquidation value of IP and hardware fleet.
        - Moderate
        - Enforcement action by federal regulators, severe crash liability, or parent capital retrenchment.
    notes: >-
      Scenario probability signals reflect current public evidence as of October 2026; valuations remain qualitative due
      to unpriced round terms.
