  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Layered autonomy stack spanning physical actuation, edge computing, sensor fusion perception, behavioral planning,
      and fleet teleoperation.
    data:
      layers:
        - label: Fleet Teleoperation & Mission Dispatch
          detail: >-
            Cloud-based fleet dispatching, routing optimization, remote exception assistance, and Uber API marketplace
            integration.
          modules:
            - Demand & trip matching gateway
            - Remote teleoperation operator console
            - Fleet routing & rebalancing optimizer
        - label: Simulation & Continuous Learning Pipeline
          detail: >-
            Cloud-scale scenario replay, synthetic edge-case generation, and regression metrics validation prior to OTA
            deployment.
          modules:
            - Log replay scenario synthesizer
            - High-throughput cloud simulator
            - Regression validation & release gate
        - label: Behavior Prediction & Motion Planning
          detail: >-
            Multi-agent intent forecasting, rule-compliant path generation, trajectory smoothing, and collision
            avoidance algorithms.
          modules:
            - Multi-agent behavioral prediction network
            - Cost-map trajectory planner
            - Dynamic obstacle avoidance controller
        - label: Localization & High-Definition Mapping
          detail: >-
            Centimeter-level spatial positioning integrating real-time lidar odometry, HD map priors, and GNSS/IMU
            sensor inputs.
          modules:
            - Centimeter-accurate HD vector map layer
            - Lidar point-cloud scan matching
            - Multi-sensor Kalman filter fusion
        - label: Multi-Modal Perception & Sensor Fusion
          detail: >-
            Synchronized processing of 360-degree lidars, semantic cameras, and velocity radar with deep learning
            bounding boxes.
          modules:
            - 360-degree lidar spatial point cloud
            - Semantic vision & traffic-light classifier
            - Radar Doppler velocity tracker
        - label: Edge Compute & Fail-Operational Control
          detail: >-
            Automotive-grade onboard computing with low-latency execution, real-time actuator control, and fail-safe
            stop logic.
          modules:
            - Ruggedized multi-temperature edge compute unit
            - Drive-by-wire steering & brake interface
            - Minimal-risk maneuver fail-safe fallback
        - label: Vehicle & Robotic Physical Platforms
          detail: Hyundai IONIQ 5 electric vehicle drive-by-wire chassis and custom 4-wheel sidewalk delivery robot hardware.
          modules:
            - Hyundai IONIQ 5 EV passenger platform
            - IP66 sidewalk courier 4-wheel chassis
            - Swappable battery & locked cargo hatch
