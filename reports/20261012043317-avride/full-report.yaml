  - id: FU001
    title: Customer Journey and Autonomous Order Fulfillment Flow
    type: journey-map
    summary: >-
      Six-stage customer and merchant operational journey across discovery, ordering, sidewalk autonomous transit,
      curbside mobile unlock, and platform settlement.
    data:
      items:
        - label: 1. Merchant Integration & Menu Discovery
          summary: Restaurants onboard menus through Uber Eats or campus dining portals (Grubhub/Sodexo).
          touchpoints:
            - Uber Eats merchant portal
            - Campus dining POS integration
        - label: 2. Consumer Order Placement
          summary: Customer selects meals on mobile app and opts for autonomous delivery where available.
          touchpoints:
            - Uber Eats mobile application
            - Grubhub campus mobile app
        - label: 3. Kitchen Fulfillment & Rover Loading
          summary: Merchant prepares food order and loads package into secure rover compartment at curb.
          touchpoints:
            - Merchant kitchen alert tablet
            - Rover physical cargo hatch
        - label: 4. Autonomous Sidewalk Navigation
          summary: Rover navigates sidewalks at up to 5 mph using onboard lidar, cameras, and remote supervision.
          touchpoints:
            - Pedestrian walkway routing
            - Remote teleoperation monitoring
        - label: 5. Curbside Arrival & Customer Unlock
          summary: Customer receives arrival push notification and unlocks cargo door using mobile app button.
          touchpoints:
            - Mobile push notification
            - App-based Bluetooth/cellular unlock
        - label: 6. Transaction Settlement & Feedback
          summary: Order is completed, customer rates delivery, delivery fee is billed, and platform settles revenue.
          touchpoints:
            - Consumer in-app rating prompt
            - Platform revenue settlement
    approximationNotes: >-
      Journey map synthesizes standard operating procedures across active deployments in Jersey City, Austin, and
      university campuses.
    claimRefs:
      - CU004
      - CU010
      - CU011
      - CU012
