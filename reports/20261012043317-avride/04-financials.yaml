callouts:
  - calloutType: "risk"
    title: "Partner-Led Capital Leverage Versus Platform Dependency"
    body: "Avride's commercial model relies heavily on distribution partnerships with Uber and Grubhub to avoid direct consumer acquisition overhead. While this dramatically lowers marketing burn and provides immediate access to high-density order volume across Texas, New Jersey, and university campuses, it creates severe customer concentration. Under this structure, Avride acts as a capacity supplier rather than an independent network operator, leaving realized pricing, fleet dispatch priority, and long-term gross margin progression subject to platform partner renegotiations."
    claimRefs:
      - "CI002"
      - "CI007"
      - "CI008"
  - calloutType: "insight"
    title: "Milestone-Linked Capital Tranches Create Execution Hurdle"
    body: "The headline $375 million financing package from Uber and Nebius consists of strategic investments and commercial commitments tied to performance milestones rather than an immediate lump-sum balance sheet injection. Continued capital drawdowns depend on commercial deployment gates, including scaling fleets toward 500 vehicles and successfully operationalizing robotaxi passenger services in Dallas. Private financing dependency and undefined milestone criteria remain critical diligence gating items for underwriting forward runway."
    claimRefs:
      - "CI001"
      - "CI003"
      - "CI004"
      - "CI011"
