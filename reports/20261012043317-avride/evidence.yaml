evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-and-revenue
    missingEvidence: >-
      Audited financial statements, equity valuation benchmarks, and product-level ARR/revenue run-rate disclosures for
      Avride.
    whyItMatters: >-
      Prevents independent calculation of enterprise valuation multiples, cash burn velocity, and gross unit margins
      between robotaxi and delivery lines.
    diligencePath: >-
      Review parent Nebius Group statutory financial segment filings or confidential private placement memoranda under
      NDA.
    relatedQuestionRefs:
      - QO008
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table-scope
    missingEvidence: Full board of directors roster, independent committee seats, and secondary executive officer listings.
    whyItMatters: >-
      Limits assessment of fiduciary oversight, audit committee independence, and minority governance controls outside
      Nebius.
    diligencePath: Inspect Delaware state corporate entity annual reports and parent Nebius Group governance disclosures.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-or-investor-map-scope
    missingEvidence: >-
      Complete capitalization table listing minority equity holders, secondary transaction participants, and venture
      debt lenders.
    whyItMatters: >-
      Obscures exact shareholder dilution, liquidation preference seniority, and intercompany debt covenants with
      Nebius.
    diligencePath: Obtain certified cap table and Series E investor rights agreements during formal corporate diligence.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited gross margins, driver-out cost-per-mile benchmarks, and software revenue-share splits between Avride and
      dispatch partners like Uber.
    whyItMatters: >-
      Without verified unit economics and software take rates, valuation models cannot determine whether Avride can
      achieve cash flow independence from Nebius subsidies.
    diligencePath: >-
      Request confidential partner schedule attachments from the Uber commercial agreement and audited management
      accounts detailing hardware depreciation vs. cloud compute expenses.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: regulatory-clearance
    missingEvidence: >-
      Formal safety resolution and intervention telemetry following NHTSA's 2026 defect investigation into autonomous
      driving competence and 80 recorded collision events.
    whyItMatters: >-
      Safety regulator enforcement represents a binary adoption constraint that could restrict ODD expansion or pause
      commercial ride matching in Texas.
    diligencePath: >-
      Subpoena or review NHTSA Standing General Order incident filings, TxDMV permit status filings, and disengagement
      logs across Dallas test fleets.
    relatedQuestionRefs:
      - QM007
  - type: private-evidence-only
    severity: material
    topic: competitor-contract-terms
    missingEvidence: >-
      Granular revenue share splits, minimum ride volume commitments, and dispatch exclusivity terms between Uber and
      competing AV developers.
    whyItMatters: >-
      Without knowing whether Uber prioritizes certain AV partners or charges differentiated platform take rates,
      Avride's unit margin defensibility cannot be confirmed.
    diligencePath: Request review of Uber-Avride Master Services Agreement and commercial dispatch priority schedules.
    relatedQuestionRefs:
      - QP004
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: comparative-intervention-rates
    missingEvidence: >-
      Audited mean miles between disengagements or critical interventions for Avride compared to Waymo and WeRide in
      shared testing markets.
    whyItMatters: >-
      Safety and intervention metrics determine operational readiness for transitioning from safety-driver supervision
      to fully driverless commercial scaling.
    diligencePath: Obtain state DMV autonomous vehicle testing reports and NHTSA incident remediation disclosures.
    relatedQuestionRefs:
      - QP003
      - QP006
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: blocking
    topic: unit-economics
    missingEvidence: >-
