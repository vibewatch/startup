callouts:
  - calloutType: "risk"
    title: "Partner Channel Concentration and Regulatory Dependency"
    body: "Avride's commercial reach is almost entirely dependent on Uber's platform distribution and third-party campus aggregators. While this eliminates direct consumer acquisition friction, it exposes the business to platform substitution risk and magnified vulnerability if ongoing federal safety inquiries impede partner-driven fleet scaling."
    claimRefs:
      - "CM005"
      - "CM011"
      - "CM012"
  - calloutType: "insight"
    title: "Dual-Platform Architecture as a Differentiated Utilization Hedge"
    body: "Operating sidewalk delivery robots alongside passenger robotaxis under a unified technical architecture allows Avride to harvest high-density operational telemetry and support cash flow across university dining contracts while capital-intensive passenger AV operations remain constrained by safety operators and geofenced design domains."
    claimRefs:
      - "CM004"
      - "CM006"
      - "CM007"
