companyProfile:
  summary: >-
    Avride is a Yandex self-driving spinout retained under Nebius Group that now operates as an Austin-based autonomous
    mobility company spanning robotaxis and sidewalk delivery robots. Its products run on a shared autonomy stack and
    are commercialized through partner platforms such as Uber, Uber Eats, and Grubhub, while the company remains in
    active federal safety scrutiny and keeps core financial terms undisclosed.
  foundedDate: '2020-01-01'
  headquarters: Austin, TX, USA
  productSummary: >-
    A shared autonomy stack that powers Hyundai Ioniq 5 robotaxis and sidewalk delivery robots for partner-led mobility
    and last-mile delivery.
  customerFocus: Ride-hail platforms, restaurant delivery marketplaces, and university dining operators
  businessModel: Partner-led revenue shares, delivery fulfillment fees, and fleet service agreements
  stage: Venture-backed commercial launch
