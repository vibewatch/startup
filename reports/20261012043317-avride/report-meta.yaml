  topStrengths:
    - Commercial deployments are already live across Uber Eats, Uber robotaxi pilots, and university delivery networks.
    - The shared autonomy stack lets Avride reuse software and hardware across robotaxis and sidewalk delivery robots.
    - Uber and Nebius provide strategic backing and distribution that would be difficult to replicate independently.
  topRisks:
    - NHTSA's PE26003 probe and crash record create meaningful regulatory and liability risk.
    - Uber is the dominant channel partner, so Avride has limited direct customer control and weak pricing power.
    - The financing package and unit economics remain opaque, making valuation and runway hard to underwrite.
  unresolvedGaps:
    - Exact equity content, dilution, and governance terms inside the up-to-$375 million Uber/Nebius package.
    - Audited revenue, margin, burn, runway, and unit contribution economics for robotaxis versus delivery robots.
    - PE26003 remediation evidence, post-mitigation safety performance, and any operating restrictions that follow.
    - >-
      Customer concentration, contract duration, revenue share, and renewal behavior across Uber, Grubhub, and campus
      channels.
