chapter:
  number: 1
  title: "Company Overview"
  summary: "Avride is an autonomous mobility company operating retrofitted robotaxis and sidewalk delivery robots through partner-led platforms including Uber, Uber Eats, and Grubhub. Spun out from Yandex and retained under Nebius Group, the company is headquartered in Austin and Newburyport with backing from Uber and Nebius, operating commercial fleets alongside an active NHTSA safety probe."
sections:
  - id: "corporate-identity-and-lineage"
    title: "Corporate Lineage and Structural Evolution"
    body: "Avride Inc. develops autonomous driving technology for passenger cars and last-mile delivery robots. The team began developing autonomous vehicles within Yandex in 2017 before forming as a dedicated corporate spin-off in 2020. Following the corporate restructuring and divestment of Russian assets by parent Nebius Group in July 2024, Avride emerged as an independent Western operating entity retained under Nebius Group. While historical corporate filings and corporate directories record a registered location in Newburyport, Massachusetts, the company maintains its operational headquarters, engineering footprint, and vehicle facilities in Austin, Texas. The company develops a dual-modality autonomous system where passenger robotaxis and sidewalk delivery robots share core software algorithms and hardware components. This cross-platform approach enables operational learnings and sensor data gathered from urban sidewalk deliveries to directly inform passenger vehicle navigation systems."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
      - "CO006"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Executive Leadership and Technical Governance"
    body: "The leadership team at Avride is led by Chief Executive Officer Dmitry Polishchuk, who previously spearheaded the autonomous driving division at Yandex prior to the corporate reorganization. Polishchuk and the founding engineering cadre transitioned the core technical assets and operational playbooks to Avride. The technical and operational roster spans hardware engineering, robotics service maintenance, and continuous data quality validation across field hubs in Texas and international engineering centers. The executive team maintains strong technical cohesion rooted in shared multi-year autonomy engineering experience, but key-person dependence remains acute around Polishchuk and his founding software leadership. Strategic governance is anchored by primary institutional stakeholders Nebius Group and Uber Technologies, who exercise material governance leverage through capital commitments, platform distribution rights, and commercial integration agreements."
    claimRefs:
      - "CO007"
      - "CO008"
      - "CO009"
    tableRefs:
      - "TO002"
    figureRefs:
      - "FO001"
  - id: "capitalization-and-scale"
    title: "Capitalization Structure, Commercial Fleet Scale, and Regulatory Scrutiny"
    body: "Avride's capitalization is anchored by a strategic financing package of up to $375 million in investments and commercial commitments backed by Uber Technologies and parent entity Nebius Group. While recruitment summaries and private aggregator databases cite total funding numbers ranging between $375 million and $425 million, public disclosure remains sparse regarding exact round tranches, pre-money valuation benchmarks, and minority governance protections. Operationally, Avride deploys retrofitted Hyundai Ioniq 5 electric vehicles equipped with custom lidar, radar, and camera sensor suites for robotaxi rides on Uber's platform in Dallas. In sidewalk logistics, Avride operates delivery robots across Austin, Dallas, and Jersey City, in addition to higher-education campus deployments at institutions such as Ohio State University. However, operational expansion has attracted scrutiny: the National Highway Traffic Safety Administration opened a formal safety probe (PE26003) following 80 logged autonomous vehicle incidents."
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
      - "CO016"
    tableRefs:
