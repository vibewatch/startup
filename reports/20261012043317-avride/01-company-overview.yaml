callouts:
  - calloutType: "risk"
    title: "Platform Concentration and Regulatory Headwinds"
    body: "Avride's commercial model depends heavily on Uber for passenger ride-hail distribution in Dallas and sidewalk deliveries across Jersey City and Austin. While this asset-light platform distribution circumvents direct consumer acquisition expenses, it concentrates demand risk with a single partner that concurrently deploys rival fleets. Concurrently, the active NHTSA safety probe (PE26003) regarding 80 logged autonomous incidents elevates regulatory and operational risk across core Texas operating areas."
    claimRefs:
      - "CO010"
      - "CO014"
      - "CO015"
      - "CO016"
