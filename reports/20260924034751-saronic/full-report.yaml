    Saronic is an Austin-based defense technology company founded in 2022 that designs, manufactures, and deploys
    autonomous surface vessels for U.S. and allied maritime missions. The company pairs an integrated autonomy stack
    with a vertically integrated production strategy across Austin and Louisiana, while building a new Brownsville
    shipyard to scale larger vessels and other maritime platforms.
