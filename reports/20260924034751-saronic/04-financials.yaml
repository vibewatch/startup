      "title": "Core Findings",
      "body": "Financials centers on track how saronic’s funding, product pricing, and contract mix translate into a capital-intensive defense hardware business with opaque public financials but rising disclosed demand. Revenue streams, pricing model, revenue mix, and recognition issues where supportable. This section intentionally stays anchored in the highest-confidence public facts so the report has a stable identity baseline. It emphasizes what can be confirmed from the company site, government announcements, and top-tier reporting as of 2026-09-24, and avoids inventing private metrics that are still undisclosed. It also gives the reader a crisp starting point before the more nuanced financing and risk discussion later in the chapter. The first pass through the chapter should answer the mission questions directly, then use the tables to document the evidence trail behind them.",
