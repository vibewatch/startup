    {
      "id": "open-questions-and-risks",
      "title": "Open Questions and Risks",
      "body": "Public traction (revenue, ARR, GMV, units, locations, utilization, active users) versus private-metric gaps. Capital adequacy and financing dependency — cash on hand, burn, runway, planned use of funds, next-round trigger, and debt/project-finance obligations. Historical round-by-round chronology lives in Company Overview; refer to that chronology in prose, but do not copy Company Overview claim ids; if Financials needs a funding fact, mint a local Financials claim with its own sourceRefs. The chapter keeps unresolved questions explicit so the report can distinguish confirmed facts from diligence gaps and recent procurement risk. This helps preserve a clean separation between what the market can already observe and what remains a background diligence question for the next refresh. The closing section keeps the unanswered items visible, especially where the refresh still depends on private data or on procurement outcomes that have not fully resolved.",
