    {
      "id": "evidence-and-structure",
      "title": "Evidence and Structure",
      "body": "GTM motion and sales efficiency proxies (cycle, CAC/payback or proxy, channel economics). Cost structure, gross margin drivers, working capital, capex, and service-delivery costs. The public record is strongest around the company’s founding team, financing rounds, production footprint, and major customer awards, while exact private metrics remain undisclosed. That means the refresh can verify leadership, capital, and scale milestones, but should still treat board detail, unit economics, and revenue quality as partial evidence rather than audited fact. The middle section should connect the claims to the tables so the reader can see how each fact is supported by source material rather than by narrative alone.",
