      "title": "Core Findings",
      "body": "Market Analysis centers on define the autonomous maritime market as a procurement-led defense and dual-use category, with the navy and allied fleets driving demand while adoption remains budget- and certification-constrained. Market boundary, included/excluded spend, adjacencies, and status-quo substitutes. This section intentionally stays anchored in the highest-confidence public facts so the report has a stable identity baseline. It emphasizes what can be confirmed from the company site, government announcements, and top-tier reporting as of 2026-09-24, and avoids inventing private metrics that are still undisclosed. It also gives the reader a crisp starting point before the more nuanced financing and risk discussion later in the chapter. The first pass through the chapter should answer the mission questions directly, then use the tables to document the evidence trail behind them.",
