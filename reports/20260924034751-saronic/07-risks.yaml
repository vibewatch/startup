      ]
    },
    {
      "id": "open-questions-and-risks",
      "title": "Open Questions and Risks",
      "body": "Partner/dependency risk — supplier, distributor, cloud/platform, capital provider, regulator, key customer concentration. Financial/model risk — burn, capital intensity, credit/loss exposure, fraud, working capital, margin compression. The chapter keeps unresolved questions explicit so the report can distinguish confirmed facts from diligence gaps and recent procurement risk. This helps preserve a clean separation between what the market can already observe and what remains a background diligence question for the next refresh. The closing section keeps the unanswered items visible, especially where the refresh still depends on private data or on procurement outcomes that have not fully resolved.",
