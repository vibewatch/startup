  topStrengths:
    - Oratomic's 10,000-20,000 qubit thesis is differentiated and could materially compress the path to useful fault-tolerant quantum computing if validated.
    - The founding team combines Caltech-linked expertise in neutral atoms, quantum error correction, AI, and optical engineering.
    - The $300M Series A and blue-chip investor set provide unusual early capital strength for a newly launched hardware company.
    - Monarch adds an explicit productization and manufacturing narrative, making the commercialization story more credible than a pure lab spinout.
    - Cryptography relevance and post-quantum migration urgency give the company a strategically important long-term demand backdrop.
  topRisks:
    - No public revenue, named customers, backlog, pricing, or access-channel metrics currently support the reported valuation.
    - The company is explicitly skipping NISQ, which removes a natural early bridge to customer proof and monetization.
    - Productization and manufacturing concentration around Monarch is high in the public record.
    - Export-control, IP-rights, and security-compliance questions can slow both sensitive-customer adoption and future strategic financings.
    - Valuation support is highly sensitive to future proof points; a flat/down round before benchmark or buyer evidence would be damaging.
  unresolvedGaps:
    - Full cap table, preference stack, anti-dilution protections, and other downside terms for the current and future financings.
    - Burn, runway, capex, and the bridge from current capital to the next externally meaningful benchmark.
    - Rights chain and licensing terms for academic-origin neutral-atom inventions relevant to Oratomic's architecture.
    - Buyer pipeline, commercial packaging, pricing logic, and any non-public design-partner or lighthouse-customer evidence.
