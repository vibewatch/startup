- id: deployment-integration-and-roadmap
  title: Deployment, integration, and roadmap
  body: 'The deployment surface is almost entirely future-facing. Oratomic has not published a current access route analogous to Amazon Braket, a premium guided-access program, or an on-prem install package. Instead, the company asks the market to underwrite a roadmap. The roadmap is anchored by the claim that the core components for a useful fault-tolerant machine have been experimentally demonstrated at smaller scale, by the neutral-atom category''s visible progress on logical qubits and gate fidelity, and by a partnership meant to industrialize photonic control. That combination suggests a plausible future hybrid-HPC deployment path even though it is not yet public in product form. Peer materials from QuEra, NVIDIA, AWS, and Classiq are therefore useful not because they prove Oratomic has those same capabilities today, but because they show the surrounding ecosystem a successful neutral-atom company eventually needs: simulator tooling, decoder acceleration, hybrid orchestration, and institutional
    or sovereign deployment routes. Oratomic is directionally aligned with that end state, but still earlier than the ecosystem leaders on execution surfaces.'
