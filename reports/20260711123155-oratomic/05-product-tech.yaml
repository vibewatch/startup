- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer / component
  - role
  - key dependency
  - key risk
  rows:
  - - Neutral-atom register
    - Physical qubit substrate for the proposed system
    - Stable trapping, cooling, and atom loading in optical tweezers
    - Loading, lifetime, or coherence bottlenecks cap usable scale
  - - Reconfigurable geometry layer
    - Changes connectivity and enables movement during computation
    - Reliable transport while preserving coherence and calibration
    - Movement complexity becomes a scaling or serviceability bottleneck
  - - Rydberg interaction layer
    - Creates entangling operations and interaction-based logic
    - Laser stability, calibration, and blockade control
    - Control noise directly degrades algorithm and QEC performance
  - - Error-correction architecture
    - Compresses physical-to-logical overhead and supports fault tolerance
    - Decoder performance, syndrome extraction, and layout control
    - QEC may fail to scale economically even if bare hardware scales
  - - Photonic control stack
    - Routes, stabilizes, and potentially industrializes optical control
    - PIC design, packaging, and manufacturing maturity
    - Optics and packaging can dominate capex or support burden
  - - Classical simulation / decoding layer
    - Reduces iteration cost and supports future real-time correction
    - GPU acceleration, simulators, and algorithm tooling
    - Software latency or weak simulators can slow technical progress
  - - Hybrid orchestration layer
    - Connects QPUs to HPC, AI, and research pipelines
    - Partner ecosystem, schedulers, and secure integration
    - Productization can lag if orchestration is harder than the QPU roadmap implies
  notes: This table mixes hardware, software, and operating layers because Oratomic's differentiation depends on the full stack rather than on a single QPU specification.
