- id: architecture-and-operating-model
  title: Architecture and operating model
  body: 'Oratomic''s technical core is specific, not generic: neutral atoms are trapped in optical tweezers, dynamically rearranged, and used in a reconfigurable architecture intended to improve connectivity and quantum error correction. The Caltech and IQIM materials link the thesis directly to cryptographically relevant fault tolerance with far fewer physical qubits than older assumptions, while the launch materials connect that thesis to broad simulation and AI workloads. Category benchmarks from QuEra, AWS, Nature, and IEEE fill in the operating-model context. They show how modern neutral-atom systems are programmed, why Rydberg interactions matter, what high-fidelity gate performance now looks like, and why developers usually need substantial classical simulation and control tooling around the hardware. Oratomic does not yet publish that software-and-operations layer publicly, so the company can be underwritten today as a strong hardware-and-architecture thesis, but not yet as a fully
    surfaced developer platform.'
