company:
  name: Oratomic
chapter:
  number: 5
  title: Product & Technology
  summary: 'Oratomic''s public product story is still architecture-first rather than access-first. The company has no live cloud route or public SDK, but it does expose a specific technical thesis: reconfigurable neutral-atom arrays controlled by optical tweezers, a fault-tolerant design that may need only 10,000 to 20,000 physical qubits, and a scaling path that links Caltech research, error correction, and photonic control industrialization. Public evidence is strongest on the physics and roadmap logic; it is weaker on software tooling, operating metrics, and enterprise readiness.'
sections:
- id: product-definition-and-module-map
  title: Product definition and module map
  body: 'In user-workflow terms, Oratomic is not yet selling a finished commercial appliance. The public product is better understood as a future system architecture wrapped in a small number of visible modules: a neutral-atom hardware core, a qubit-rearrangement and error-correction thesis, a photonic-control and manufacturing path signaled by the Monarch Quantum partnership, and an application story focused on simulation, chemistry, AI, physics, and cryptography. That is materially earlier than peers such as QuEra, which already expose access paths and developer tooling. Oratomic therefore has a sharper but thinner product surface. The sharpness comes from the specific promise—skip NISQ, go straight to utility-scale fault tolerance. The thinness comes from everything that is not yet public: there is no cloud route, no public runtime API, no public SDK, and no published deployment handbook. From a diligence perspective, the chapter is about whether the technical module map is coherent enough
    to justify that absence, not about whether Oratomic already has a mature product catalog.'
