  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Oratomic’s visible journey starts with scientific credibility and partner assembly, then points toward a future
      lighthouse-programme sale rather than immediate self-serve usage.
    data:
      nodes:
        - id: science
          label: Scientific credibility
          description: Public launch and research narrative establish why the architecture matters.
        - id: security
          label: Strategic urgency
          description: Responsible-disclosure messaging frames cryptography and national-capability stakes.
        - id: partner
          label: Integration partner buildout
          description: Monarch adds photonics integration, productization, and manufacturing support.
        - id: lighthouse
          label: First lighthouse programme
          description: Most plausible first win is a sovereign, HPC, pharma, or security-sensitive pilot or deployment.
        - id: managed-access
          label: Managed access / co-design
          description: Any early usage is more likely to be proposal-gated or partner-mediated than fully self-serve.
        - id: expand
          label: Expansion
          description: >-
            Repeat demand would likely come through follow-on phases, training, hybrid integration, or broader site
            programmes.
