      - - Burn, cash, and capex bridge
        - Tests whether current capital truly reaches the next proof point
        - Insufficient runway would imply earlier dilution risk
        - Monthly burn bridge, cash balance, capex plan, and hiring ramp
      - - IP rights chain
        - Determines whether scientific differentiation is actually ownable
        - Weak rights would lower terminal value and raise financing friction
        - Licenses, assignments, prosecution summaries, and counsel memo
      - - Buyer pipeline and commercial packaging
        - Distinguishes curiosity from monetizable demand
        - Named proof can materially support the current mark
        - LOIs, pilot structures, pricing logic, and partner/channel map
      - - Milestone dashboard
        - The whole upside case depends on credible sequencing
        - Delayed or vague milestones lower the mark fast
        - Board-approved roadmap with external proof gates
      - - Compliance packet
        - Sensitive buyers and strategic investors may require it early
        - Missing packet delays both revenue and capital paths
        - ECCN map, reporting readiness, and buyer-security questionnaire responses
    notes: >-
      These asks are ordered by what most directly changes downside underwriting; items 1-3 are blocking before any
      conviction investment.
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV041
