      - number: '1.3'
        title: Financing, investor syndicate, and disclosed scale metrics
        blocks:
          - type: paragraph
            body: >-
              The July 2026 financing is the single most important business event in the public record so far. Oratomic
              announced a $300 million Series A co-led by ARCH Venture Partners, Spark Capital, and Khosla Ventures,
              with broad participation from blue-chip venture firms, notable individual backers, and strategic quantum
              investor Infleqtion. Multiple independent outlets corroborate the round size and lead investors, while one
              retained source reports an approximate $1.5 billion post-money valuation. Even so, the disclosure surface
              is lopsided: the company and sympathetic coverage speak clearly about capital raised and intended use of
              funds, but retained sources do not publish dependable current revenue, customer-count, or full-company
              headcount figures. The result is a company that is easy to underwrite on scientific ambition and investor
              quality, but still hard to underwrite on classic operating KPIs. The financing therefore validates access
              to capital and deep-tech investor conviction more than it validates near-term commercial traction.
