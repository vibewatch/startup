        - id: dep3
          label: Developer and simulation stack
          detail: >-
            A still-missing public SDK and simulator layer must eventually reduce iteration cost and support logical
            workflows
          tone: positive
        - id: dep4
          label: Hybrid orchestration partners
          detail: HPC, photonics, AI, and institutional partners help operationalize access and integration
          tone: neutral
        - id: dep5
          label: Decoders and classical acceleration
          detail: Logical computing depends on scalable decoders, GPU simulation, and AI-accelerated QEC workflows
          tone: warning
        - id: dep6
          label: Enterprise assurance surface
          detail: Security controls, SLAs, pricing, and status transparency remain under-disclosed publicly
          tone: adverse
        - id: dep7
          label: Roadmap execution
          detail: Utility-scale adoption depends on the 10k-20k-qubit thesis surviving real implementation milestones
          tone: warning
