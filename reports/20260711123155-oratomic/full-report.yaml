      - number: '2.4'
        title: Growth drivers, budget logic, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Near-term demand is being sustained less by broad enterprise ROI than by public funding, strategic
              urgency, and proof-oriented experimentation. The UK strategy, NQIRA reauthorization push, DOE Quantum
              Genesis, and DARPA benchmarking efforts all show that governments are underwriting capability build-out,
              testbeds, workforce, and validation. On the buyer side, QuEra’s market research suggests that
              organizations still expect quantum to matter, but they are becoming more disciplined about budgets,
              sovereignty, and procurement. This increases the importance of named benchmarks, secure workflows, and
              modality credibility. Cost, ROI ambiguity, talent shortages, and the gap between pilots and production
              remain the main constraints. That combination means Oratomic benefits from strategic tailwinds, but it
              still faces a market where even interested buyers demand hard evidence before large-scale conversion.
