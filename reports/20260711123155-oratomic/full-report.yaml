  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public monetization status
        blocks:
          - type: paragraph
            body: >-
              Oratomic's public revenue picture is undeclared rather than merely early. The company launched in March
              2026 and raised $300 million in July, but retained sources do not disclose recognized revenue, customer
              count, backlog, or any signed contract value. What public materials do reveal is the likely shape of the
              future model. Oratomic is building toward utility-scale fault-tolerant neutral-atom systems and explicitly
              says it will not sell NISQ products, which pushes monetization away from immediate cloud-time sales and
              toward longer-cycle channels such as strategic design partnerships, government or national-lab programs,
              future direct system sales, and eventually cloud or reserved-capacity access once hardware is available.
              In that sense, the company's economics look more like frontier infrastructure procurement than software
              self-service. The distinction matters because public sources support the existence of a large financing
              event and a credible product thesis, but not any present recurring revenue base.
