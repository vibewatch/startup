      - number: '3.4'
        title: Moat durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              Oratomic's moat is credible but conditional. Its strongest public advantage is not distribution or
              packaging; it is the scientific claim that neutral-atom error correction may reach useful systems with
              roughly 10,000 to 20,000 reconfigurable atomic qubits rather than the millions often assumed elsewhere. If
              true, that would be strategically important. But the adverse evidence matters. IEEE Spectrum's 2026
              framing is that the first error-corrected machines represent scientific progress rather than broad
              commercial advantage, which limits how much moat value should be granted before public workloads exist.
              Neutral atoms also face acknowledged trade-offs: maneuverability and parallelism are strong, but
              operations are slower than in superconducting systems. Meanwhile the direct peer set is getting denser as
              Atom, QuEra, and Pasqal scale access routes and financing, and broader incumbents can outspend Oratomic on
              ecosystems, channels, and customer education. The balanced read is that Oratomic has a differentiated
              thesis worth taking seriously, but its durability depends on landing evidence of customer pull faster than
