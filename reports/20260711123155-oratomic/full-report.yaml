  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              Oratomic’s highest-severity risk is the gap between scientific plausibility and product proof. Public
              materials show a breakthrough architecture, a launch narrative, a responsible-disclosure position, and a
              manufacturing-oriented partnership. They do not yet show an integrated public system benchmark, a dated
              delivery plan, or customer usage proof. That matters because the rest of the risk stack compounds around
              the same gap. If technical progress slips, there is no public cloud or design-partner funnel to cushion
              the downside. If export-control or compliance work slows talent access or collaboration, the same delay
              pushes buyer proof and financing out. If Monarch becomes a bottleneck, technical and commercial risk move
              together because productization concentration is already high. The heatmap therefore weights schedule
              compression, dependency concentration, regulatory friction, and capital opacity above more routine startup
              uncertainty. This is not a scandal-risk story. It is a thesis-execution story in which several
              individually manageable risks can become correlated if the company stays narrative-heavy for too long.
            claimRefs:
              - CR001
              - CR002
              - CR006
