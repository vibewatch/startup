  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and incumbent substitutes
        blocks:
          - type: paragraph
            body: >-
              The first analytical task is to define a market boundary strict enough to be decision-useful. Oratomic is
              not a generic AI, semiconductor, or cybersecurity company, and it should not inherit the full spend pool
              attached to the phrase “quantum technology.” The relevant market is the narrower layer where neutral-atom
              quantum compute capacity is bought, accessed, integrated, or code-signed into real workflows: hardware
              systems, cloud machine time, hybrid HPC integration, and application-development engagements tied directly
              to the hardware. That boundary excludes most sensing, networking, and post-quantum cryptography migration
              spend, even though those areas can create urgency or adjacent budgets. It also forces a realistic
              incumbent comparison. Oratomic does not merely compete against other quantum startups; it must eventually
              beat well-funded classical HPC clusters, GPU-heavy AI systems, classical optimization stacks, and
              software-only risk-mitigation programs that already solve most buyer needs well enough today.
            claimRefs:
              - CM001
