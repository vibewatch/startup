  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Recommendation and Thesis
        blocks:
          - type: paragraph
            body: >-
              Oratomic should be treated as a high-upside, high-fragility option on fault-tolerant neutral-atom quantum
              computing rather than as a normal late-stage growth investment. The positive side of the case is real: the
              company has just raised $300 million, has a blue-chip investor set, claims a meaningful scientific
              step-change in physical-qubit requirements, and has begun building a manufacturability story with Monarch.
              The anti-thesis is equally important. Public evidence still does not show revenue, customers, backlog, or
              pricing; the company is explicitly skipping NISQ; and 2026 buyer evidence across the sector says
              procurement now demands proof instead of vision. Those facts make the current mark investable only for
              funds that explicitly want long-duration deeptech optionality. Recommendation: Track / conditional only.
              Confidence: medium. Risk rating: high. Valuation stance: stretched on public evidence, fair only as
              strategic option value.
