      - number: '3.3'
        title: Switching costs, distribution power, and partner access
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence against a durable winner-take-all outcome is how standardized the access layer has
              already become. AWS Braket places multiple hardware vendors on one control plane, while Azure publishes
              partner-specific offers from IonQ, Quantinuum, Rigetti, and Pasqal. Open tooling reinforces the same
              dynamic: Google pushes Cirq, Quantinuum pushes pytket, IonQ supports the major SDKs, and NVIDIA argues
              that useful quantum will emerge inside an accelerated hybrid stack rather than inside an isolated box.
              This keeps software-side switching costs moderate. Lock-in still exists, but it is mostly
              hardware-specific and workflow-specific rather than app-layer exclusive. Distribution power therefore
              tilts toward brokers and incumbents that already own enterprise support models, cloud relationships, or
