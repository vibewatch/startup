      - number: '8.2'
        title: Financing Context, Entry Discipline, and Scenarios
        blocks:
          - type: paragraph
            body: >-
              The current valuation context is directionally understandable but still too opaque for false precision.
              The $300 million Series A and ~$1.5 billion post-money mark are now widely reported, yet public sources do
              not disclose preference terms, anti-dilution, burn, or a capex bridge. That combination matters more than
              the headline itself. A company with no public revenue and no bridge product can still earn a high mark if
              the market believes the scientific discontinuity is big enough. But in a proof-driven 2026 environment,
              investors should assume that the next round’s terms and the first real buyer or benchmark proof will do
              more to determine realized value than this first headline round. At the current entry, the bull case can
              work, but only if Oratomic produces benchmarked system evidence and early lighthouse accounts on a
              relatively clean financing path. The base case leaves only modest upside after dilution, while the bear
              case still implies severe capital impairment if proof slips or the next round resets terms.
