      - number: '8.4'
        title: Final Diligence Asks and Thesis-Break Criteria
        blocks:
          - type: paragraph
            body: >-
              The remaining work is mostly financial, commercial, and contractual diligence, not basic technology
              awareness. Public evidence is sufficient to say that Oratomic is well financed, scientifically serious,
              and early. It is not sufficient to say what a new investor actually owns in a downside case or how quickly
              the company can convert today’s science into price-supporting proof. The blocking asks are
              straightforward: cap table and preferences; burn, runway, and capex path; the rights chain to
              academic-origin IP; the commercial packaging strategy; and real buyer-pipeline evidence. These are not
              cosmetic gaps. They determine whether the current mark is cheap option value or simply under-disclosed
              risk. The thesis should be treated as broken if Oratomic reaches the next major financing or competitive
              milestone without a public benchmark, named buyer proof, or clearer rights and compliance packets. Until
              then, the correct stance is to keep diligence warm, insist on price discipline, and avoid underwriting
              upside solely from narrative momentum.
