companyProfile:
  summary: >-
    Oratomic is a Pasadena-based, Caltech-linked quantum computing company that launched publicly in March 2026 with a
    mission to build utility-scale fault-tolerant quantum computers by the end of the decade. The company's thesis is
    that reconfigurable neutral-atom arrays and more efficient error correction can reduce the physical-qubit burden for
    useful quantum computing to roughly 10,000-20,000 qubits rather than the millions often assumed elsewhere. In April
    2026 Oratomic added Monarch Quantum as a photonics systems integrator for productization and manufacturing support,
    and in July 2026 it announced a $300 million Series A reportedly at about a $1.5 billion post-money valuation. What
    remains much less visible is the commercial layer: public sources do not disclose revenue, customer count, backlog,
    financing terms, or a clear bridge from research milestones to repeatable product revenue.
