      - number: '1.2'
        title: Founding team, academic roots, and founder-market fit
        blocks:
          - type: paragraph
            body: >-
              Founder-market fit is the core asset behind Oratomic’s credibility. CEO Dolev Bluvstein, CTO Hsin-Yuan
              Huang, co-founder Manuel Endres, and founding-team member John Preskill all come directly from the Caltech
              and Harvard research networks that produced the company’s central scientific claim. Public launch
              materials describe a 14-person initial team spanning Caltech, Berkeley, Harvard, Amazon, Google, and
              adjacent labs, while university and local reporting add role clarity: Bluvstein brings neutral-atom
              research and Harvard training, Huang is on leave from Caltech to lead technology, Endres anchors the
              neutral-atom experimental program, and Preskill provides decades of fault-tolerance theory leadership. The
              public record is much weaker on formal board composition and committee structure, so diligence should
              distinguish very strong scientific founder-market fit from still-limited governance transparency. In
              short, Oratomic’s people story is unusually strong for science and technical legitimacy, but still
              concentrated in a small number of academic founders and founding researchers.
