- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Technology
    - 10,000-20,000 qubit thesis and reconfigurable arrays could be a real architecture discontinuity
    - No integrated public system proof yet connects the science to a commercial machine
    - Independent benchmark evidence on integrated system behavior
  - - Manufacturability
    - Monarch adds credible productization and manufacturing support
    - One named partner does not equal a diversified commercial stack
    - Evidence of second-source or broader packaging/integration ecosystem
  - - Customers
    - Cryptography and chemistry use cases create strategic relevance
    - No named customers, pricing, or access channel exist publicly today
    - A named design partner, pilot, or lighthouse programme
  - - Financials
    - $300M Series A provides unusual early runway
    - Burn, capex, and preference stack remain undisclosed
    - A runway bridge plus clean next-round terms
  - - Competition
    - Current mark is well below Quantinuum and some sovereign-backed FTQC stories
    - IQM, Xanadu, and public peers disclose more operating reality than Oratomic does
    - Clear reason why Oratomic deserves a premium despite less disclosure
  - - Market timing
    - PQC migration and strategic urgency support long-term demand
    - 2026 buyers increasingly want measurable proof rather than vision
    - Proof-led customer activity or a benchmark that changes buyer confidence
  notes: The anti-thesis is not that Oratomic lacks technical ambition; it is that current price requires investors to prepay for milestones that are still largely undisclosed.
