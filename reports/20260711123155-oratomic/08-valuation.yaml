- id: TV004
  title: Comparable valuation table
  columns:
  - Company
  - Current / recent valuation context
  - Proof level
  - Why it matters
  - Why it is not a perfect comp
  rows:
  - - Quantinuum
    - ~$10B pre-money private round (2025)
    - Commercial systems and broader enterprise momentum
    - Upper-anchor quantum private mark
    - Much stronger customer and product disclosure than Oratomic
  - - IQM
    - ~$1.8B listing context with €31M revenue and €67M backlog (2026)
    - Commercial systems, backlog, and cloud / on-prem disclosure
    - Lower but more commercial bridge near Oratomic’s current mark
    - Different modality and more mature commercial surface
  - - Xanadu
    - ~$3B public-market context with disclosed cash and Q1 revenue (2026)
    - Public-market financial disclosure but still early revenue
    - Shows what investors expect above $1B when disclosure exists
    - Photonic modality and post-SPAC dynamics differ
  - - PsiQuantum
    - ~A$940M public-support package / very large sovereign option-value story
    - Government-backed utility-scale FTQC ambition
    - Proves FTQC narratives can support huge value
    - Public support and site-buildout structure are unlike Oratomic
  - - Atom Computing
    - '>$300M private financing for neutral-atom deployment'
    - Large neutral-atom capital appetite
    - Supports modality-level investor demand
    - No direct public valuation multiple disclosed
  - - Pasqal
    - 2026 public-listing transaction / new financing phase
    - Neutral-atom peer with public-market bridge
    - Provides European neutral-atom context
    - Disclosure set and market structure differ
  - - IonQ
    - Public quantum revenue and SEC disclosure in 2026
    - Listed pure-play option value with real filings
    - Shows public capital can support quantum optionality with disclosure
    - Different architecture and public-market liquidity effects
  notes: Comparable selection balances public pure-plays, private mega-rounds, and modality-relevant peers rather than pretending one multiple set fits every quantum company.
  enumerationScope:
    coverage: partial
    basis: Covers the most relevant public and recently disclosed private quantum comparables with retained evidence on valuation context; many private rounds remain undisclosed or too opaque to enumerate cleanly.
