  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-and-preferences
    missingEvidence: Full cap table, note/SAFE conversion terms, liquidation preferences, anti-dilution protections, and investor rights tied to the current and future rounds.
    whyItMatters: Without the downside terms, the public $1.5B mark does not reveal what a new investor actually owns or how much dilution sits ahead.
    diligencePath: Request investor-ready cap table, financing documents, and counsel summary of preference stack and conversion mechanics.
    relatedQuestionRefs:
    - QV009
    - QV024
    - QV029
    - QV030
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: runway-and-capex
    missingEvidence: Current cash balance, monthly burn, capex schedule, hiring plan, and runway bridge from the Series A to the next externally meaningful milestone.
    whyItMatters: A large first round can still be insufficient for utility-scale hardware if burn and capex are high; without the bridge, dilution risk cannot be sized.
    diligencePath: Request CFO bridge, operating plan, and scenario analysis showing how long current capital lasts under bull, base, and delayed cases.
    relatedQuestionRefs:
    - QV009
    - QV024
    - QV030
    relatedTableRefs:
    - TV001
    - TV006
  - type: private-evidence-only
    severity: material
    topic: ip-rights-chain
    missingEvidence: Exclusive-license terms, assignment history, and outside-counsel FTO analysis covering academic-origin inventions relevant to Oratomic’s architecture.
    whyItMatters: The public research and academic pedigree are positives only if investors can verify that the resulting IP is ownable and commercially defensible by Oratomic.
    diligencePath: Request license agreements, patent-family map, and FTO memo for the core architecture and manufacturing stack.
    relatedQuestionRefs:
    - QV024
    - QV025
    - QV030
    relatedTableRefs:
    - TV005
    - TV006
  - type: missing-source
    severity: material
    topic: buyer-proof-and-packaging
    missingEvidence: Named buyer references, LOIs, pilot structures, commercial packaging, and pricing logic that show how Oratomic will monetize before broad fault-tolerant deployment.
    whyItMatters: Without buyer proof, the current mark remains a pure option on science and financing rather than on an emerging business model.
    diligencePath: Request partner/customer pipeline, pilot budget examples, commercial packaging roadmap, and planned access model.
    relatedQuestionRefs:
    - QV008
    - QV024
    - QV030
    relatedTableRefs:
    - TV002
    - TV006
  - type: missing-source
    severity: minor
    topic: comparable-valuation-table-coverage
    missingEvidence: Many relevant private quantum rounds still do not disclose full valuation terms, dilution protections, or standardized revenue quality, so the comparable set is necessarily partial.
    whyItMatters: Without fuller private-round disclosure, the comparable table can bound valuation context but cannot produce a clean market multiple for Oratomic.
    diligencePath: Request private-market comp packs, investor presentations, and term summaries for the most relevant undeclared peer rounds.
    relatedQuestionRefs:
    - QV012
    - QV013
    - QV030
    relatedTableRefs:
    - TV004
