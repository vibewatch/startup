- id: comparable-context-and-exit-readiness
  title: Comparable Context and Exit Readiness
  body: 'Comparable work argues for discipline rather than enthusiasm. Quantinuum’s $10 billion pre-money round is an upper anchor because it comes with commercially available systems and stronger customer disclosure. IQM’s roughly $1.8 billion listing is a lower but far more commercial bridge, with public revenue and backlog metrics. Xanadu’s public-market disclosure shows that even a company around the $3 billion level can still be early on revenue but at least offers investors real cash and operating-loss disclosure. PsiQuantum shows how utility-scale quantum stories can command huge option value when governments underwrite milestones, while Atom and Pasqal show that neutral-atom capital appetite remains strong. Public U.S. quantum comps such as IonQ further reinforce the point: quantum markets will finance long-duration optionality, but they do so against increasing disclosure. For Oratomic, the most plausible exit path remains another private round or strategic-capital event rather
    than a near-term IPO, because the company is not yet public-market ready on disclosure depth.'
