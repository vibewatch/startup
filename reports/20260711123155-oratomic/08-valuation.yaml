- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Why it matters
  - Probability signal
  - Action implication
  rows:
  - - No public benchmark beyond theory before next financing or major competitive milestone
    - Valuation support is already narrative-heavy
    - Medium
    - Pause enthusiasm and re-base to bear case
  - - No named buyer / design-partner proof
    - Confirms demand discovery remains unproven
    - Medium-high
    - Treat commercial upside as deferred rather than progressing
  - - Punitive next-round terms or flat/down mark
    - Shows market is repricing risk faster than proof is improving
    - Medium
    - Assume current round overpaid for timing
  - - Weak IP-rights or licensing packet
    - Undermines moat and strategic diligence confidence
    - Low-to-medium but high severity
    - Escalate legal review before any new capital is committed
  - - Compliance or export-control packet not ready for sensitive buyers
    - Can delay both sales and strategic capital
    - Medium
    - Reduce assumed conversion speed for sovereign or security buyers
  - - Peer proof accelerates while Oratomic stays opaque
    - Relative valuation support weakens even if science remains interesting
    - Medium-high
    - Demand greater price discipline or step aside
  notes: Kill triggers are designed to be monitorable. They focus on proof, terms, and readiness rather than on speculative narrative shifts.
