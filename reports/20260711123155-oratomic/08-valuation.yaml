chapter:
  number: 8
  title: Valuation
  summary: 'Oratomic’s roughly $1.5 billion post-money Series A is best understood as high-conviction option value on fault-tolerant neutral-atom leadership rather than as a revenue-backed growth-company mark. The upside can justify a multi-billion-dollar outcome if the company translates its 10,000-20,000 qubit thesis into public system proof and wins early lighthouse programmes, but today’s public record still shows no revenue, no named customers, no term-sheet detail, and no benchmarked commercial system. Comparable work argues for discipline: Quantinuum and IQM show what higher-disclosure quantum marks look like, while proof-driven 2026 procurement and skeptical market commentary cap conviction. Recommendation: Track / conditional only, with medium confidence and high risk.'
sections:
- id: investment-recommendation-and-thesis
  title: Investment Recommendation and Thesis
  body: 'Oratomic should be treated as a high-upside, high-fragility option on fault-tolerant neutral-atom quantum computing rather than as a normal late-stage growth investment. The positive side of the case is real: the company has just raised $300 million, has a blue-chip investor set, claims a meaningful scientific step-change in physical-qubit requirements, and has begun building a manufacturability story with Monarch. The anti-thesis is equally important. Public evidence still does not show revenue, customers, backlog, or pricing; the company is explicitly skipping NISQ; and 2026 buyer evidence across the sector says procurement now demands proof instead of vision. Those facts make the current mark investable only for funds that explicitly want long-duration deeptech optionality. Recommendation: Track / conditional only. Confidence: medium. Risk rating: high. Valuation stance: stretched on public evidence, fair only as strategic option value.'
