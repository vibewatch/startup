  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Integrated-system schedule risk
    - Public benchmark progression
    - No public benchmark beyond theory or subsystem claims by next financing or major competitive milestone
    - Pause aggressive underwriting and require a re-baselined execution plan
  - - Commercial proof risk
    - First named design partner or customer
    - No named buyer or partner expansion despite ongoing funding narrative
    - Treat valuation as narrative-led rather than commercially grounded
  - - Compliance readiness risk
    - Export / IP packet availability
    - Management cannot show ECCN, reporting, and core IP-rights map in sensitive diligence
    - Escalate legal diligence before strategic introductions
  - - Partner concentration risk
    - Second-source or alternate integration path
    - No public diversification beyond Monarch as the product stack matures
    - Treat partner concentration as thesis-critical rather than manageable
  - - Capital adequacy risk
    - Runway and capex visibility
    - Management cannot show a credible bridge from current capital to first product milestone
    - Tighten downside financing assumptions and dilution math
  - - Talent execution risk
    - Critical-hire fill rate
    - QEC and productization bottleneck roles remain open through major milestone windows
    - Assume slower delivery and reduce confidence in timeline claims
  notes: Kill criteria focus on monitorable public or diligence-ask signals, not on speculative worst cases.
