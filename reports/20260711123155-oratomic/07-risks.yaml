  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital-plan-and-runway
    missingEvidence: Monthly burn, cash on hand, capex schedule, gross-margin assumptions, and milestone-linked runway bridge for Oratomic’s current plan.
    whyItMatters: Without a capital bridge, investors cannot size whether the Series A actually reaches first product proof or merely funds the next financing ask.
    diligencePath: Request detailed monthly burn bridge, capex plan, and downside financing scenarios tied to technical milestones.
    relatedQuestionRefs:
    - QR021
