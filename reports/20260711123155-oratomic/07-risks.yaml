- id: technical-and-operational-risks
  title: Technical and operational risks
  body: The technical question is not whether neutral atoms are promising. Independent sources say they are one of the most scalable modalities. The problem is that scale does not remove the rest of the engineering burden. Neutral atoms remain slower than superconducting systems, still lag some rival modalities on fidelity and readiness metrics, and need a full system stack that includes optical control, packaging, error correction, and reliable operations. Oratomic’s public materials are strongest on architecture and mission, not on integrated delivery evidence. The 10,000-qubit thesis and reconfigurable-array design are compelling, but public proof still lives at the level of research and ambition. Productization risk also bleeds directly into operations because Monarch is the only named partner handling photonics integration and manufacturing support. The company has not yet shown public serviceability, field reliability, or uptime evidence. That means the key operational risk is not
    a known failure. It is the absence of public proof that the stack can be turned into a supportable product on a predictable timetable.
