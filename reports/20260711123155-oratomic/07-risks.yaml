- id: partner-people-and-capital-risks
  title: Partner, people, and capital risks
  body: 'Execution risk is not just about physics; it is about whether Oratomic can assemble the organization and balance sheet required to ship a first real system. The human problem is unusually sharp because QEC talent is scarce, specialized, and slow to develop. Riverlane and The Quantum Insider both treat real-time QEC and decoder capability as industry bottlenecks, which is exactly the layer where Oratomic claims advantage. At the same time, the company’s public dependency map is narrow. Monarch is the most visible commercialization node, while the rest of the stack still appears to depend on academic-origin know-how, strategic capital, and future policy-sensitive buyers. Financially, the Series A is huge, but the public record still does not disclose burn, runway, capex, or commercial gross-margin assumptions. Peer evidence cuts both ways here: the sector can attract enormous capital, yet even better-known peers keep raising or using public markets while still navigating heavy engineering
    bills. That means Oratomic should be read as well funded but still financially opaque, with future funding risk linked tightly to whether technical and commercial milestones emerge quickly enough to justify the next valuation step.'
