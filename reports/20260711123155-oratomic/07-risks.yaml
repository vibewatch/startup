    severity: material
    topic: ip-rights-and-licenses
    missingEvidence: Exclusive-license terms, assignment history, patent prosecution strategy, and outside-counsel FTO analysis covering academic-origin neutral-atom inventions relevant to Oratomic.
    whyItMatters: The public patent perimeter points to academic institutions, so moat quality and commercialization freedom cannot be underwritten from public records alone.
    diligencePath: Request license agreements, prosecution summaries, and claim-chart/FTO opinions for the highest-value patent families.
