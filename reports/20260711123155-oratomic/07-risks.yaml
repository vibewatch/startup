- id: regulatory-legal-and-policy-risks
  title: Regulatory, legal, and policy risks
  body: 'Quantum computing now sits in a visibly tighter legal and policy perimeter than most ordinary software businesses. BIS has imposed controls on quantum computers and related items, and legal commentary makes clear that the relevant quantum ECCNs, deemed-export rules, and annual reporting duties are detailed enough to matter in day-to-day operations. OMB and NIST materials also show why this matters commercially: the U.S. government is actively migrating vulnerable cryptography and expects agencies to inventory and prioritize systems exposed to future CRQC risk. That creates eventual demand, but it also means buyers will be compliance-conscious and security-sensitive. NSA’s position on QKD goes further, warning that the security of quantum-cryptography systems is implementation-dependent and not guaranteed by physics. For Oratomic, which explicitly highlights Shor-capable systems and responsible disclosure, the result is a double-edged sword. Cryptographic relevance increases strategic
    importance while also raising the standard for evidence, security claims, and export-control hygiene. Legal visibility is also incomplete on IP. The public patent perimeter around a core neutral-atom invention points back to Caltech, MIT, and Harvard, not clearly to Oratomic itself, which makes licensing and FTO a live diligence question rather than a solved moat.'
