  evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current public board roster, committee map, and any disclosed governance rights tied to the July 2026 Series A.
    whyItMatters: Board composition and control rights determine whether scientific founders, lead investors, or strategic backers truly govern capital allocation and commercialization pacing.
    diligencePath: Request the post-Series A board list, financing term summary, and any observer or protective-rights schedule from the company or lead investors.
    relatedQuestionRefs:
    - QO004
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: customers
    missingEvidence: A current disclosed customer count, named design partners, or contracted pilot pipeline.
    whyItMatters: Without customer visibility, it is impossible to tell whether the financing reflects market pull, purely technical conviction, or both.
    diligencePath: Ask management for a customer pipeline breakdown by design partner, funded collaboration, and any cloud-access or government-contract user cohort.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Any signed disclosure of current revenue, ARR, or non-dilutive grant/contract income attributable to operations.
    whyItMatters: Valuation discipline and burn analysis depend on whether Oratomic has any early monetization versus being a pure R&D burn story.
    diligencePath: Request current booked revenue, deferred revenue, grant income, and twelve-month commercialization forecast as part of a management data room.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A current org chart or at minimum a department-level employee count after the July 2026 fundraise.
    whyItMatters: Hiring pace is a leading indicator for whether the $300 million round is being deployed into hardware build-out or held as strategic runway.
    diligencePath: Request current headcount by physics, optics, hardware, software, G&A, and recruiting plan for the next twelve months.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO001
