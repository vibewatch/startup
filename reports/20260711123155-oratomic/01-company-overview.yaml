company:
  name: Oratomic
chapter:
  number: 1
  title: Company Overview
  summary: Oratomic is a Pasadena-based Caltech spinout that launched publicly in March 2026 to build utility-scale fault-tolerant quantum computers with reconfigurable neutral-atom arrays and optical tweezer control. Its $300 million July 2026 Series A created unusual early-stage capital depth and an approximate $1.5 billion mark, but public disclosure on customers, revenue, headcount, and formal governance remains thin enough that later chapters should treat operating scale as an active diligence topic rather than a settled fact.
sections:
- id: identity-stage-and-product-thesis
  title: Identity, stage, headquarters, and product thesis
  body: 'Oratomic emerged from stealth on 2026-03-31 as a Caltech-linked startup with a narrowly defined mission: build utility-scale fault-tolerant quantum computers by the end of the decade rather than sell interim noisy intermediate-scale quantum systems. The company presents itself as a Pasadena business built around light and atoms, while local reporting ties its operating base to Caltech’s 91125 ZIP and describes the startup as a Pasadena homegrown spinout. The best-supported stage description is a private Series A quantum-hardware company that is science-forward, capitalized well ahead of normal seed-stage hardware peers, and still pre-commercial on ordinary software startup metrics such as revenue, customer count, and broad operating footprint. That matters for the rest of the report because Oratomic is not selling a broad platform or consulting story today: it is underwriting one very specific product thesis around neutral-atom fault tolerance, with commercial proof expected later
    than the financing headline might suggest.'
  claimRefs:
