  figureRefs: []
- id: sizing-lenses-not-one-tam
  title: Sizing requires multiple lenses rather than one headline TAM
  body: 'The public market data is directionally useful but not cleanly additive. McKinsey and QED-C both show a small but growing global revenue market in the 2025 to 2028 window, while BCG keeps a much more conservative stance on technical utility today and pushes the largest provider-revenue outcomes far into the fault-tolerant era. Those numbers are not directly contradictory so much as they measure different layers: current vendor revenue, long-run provider revenue, economic value at stake, and public-program enablement budgets. For Oratomic, that distinction matters more than the absolute size of any one number. A startup trying to sell a fault-tolerant end state cannot treat a trillion-dollar “value at stake” figure as near-term spendable TAM. The credible near-term market lens is the smaller one: low-single-digit billions for the full quantum segment, with a still smaller modality-relevant slice and no public neutral-atom-specific SAM or SOM dataset.'
