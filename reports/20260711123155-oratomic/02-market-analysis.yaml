- id: contradictions-and-diligence-gaps
  title: Contradictions, adverse evidence, and remaining diligence gaps
  body: The largest market risk is timing, not the existence of theoretical demand. Bulls can cite McKinsey, DOE, and venture enthusiasm to argue that useful systems are coming into view, while bears can point to BCG, Moody’s, ORF, and IBM’s validation framing to argue that the market is still years away from broad practical utility and must clear a much higher proof bar than promotional narratives imply. For Oratomic, that contradiction is amplified by its own strategy. By declining to sell NISQ systems, the company avoids low-value prototype revenue but also forgoes some near-term learning loops and customer-proof surfaces that peers already use to build market share. The biggest unresolved questions are therefore not abstract TAM math alone; they are buyer-specific conversion economics, willingness to pay, and whether Oratomic can secure named design partners before fault-tolerant milestones are reached.
