  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Oratomic-specific pricing, contract structure, willingness to pay, and pilot-to-production conversion data.
    whyItMatters: Without pricing and conversion evidence, the report can size strategic demand but not forecast monetization quality or near-term revenue capture.
    diligencePath: Request management pipeline data, design-partner terms, and any internal pricing or budget-conversion evidence.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: material
    topic: neutral-atom-som
    missingEvidence: A public neutral-atom-specific SAM or SOM for Oratomic rather than broad quantum market ranges.
    whyItMatters: The absence of modality-specific sizing forces the chapter to rely on proxy lenses, which weakens precision in later valuation work.
    diligencePath: Build a bottoms-up SOM from named sovereign programs, HPC centers, and disclosed design-partner categories instead of searching for a single missing market report.
    relatedQuestionRefs:
    - QM006
    - QM025
    relatedTableRefs:
    - TM002
    relatedFigureRefs:
    - FM001
  - type: enumeration-incomplete
    severity: material
    topic: design-partners
    missingEvidence: Named Oratomic design partners, lighthouse users, or access programs that show who will buy before fault tolerance is fully proven.
    whyItMatters: Buyer segmentation is more reliable when specific counterparties are public; without them, the market story remains inferential.
    diligencePath: Ask Oratomic for a partner list, pilot status by segment, and stage-gated milestones for any strategic users.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM003
    relatedFigureRefs:
    - FM004
  - type: conflicting-data
    severity: minor
    topic: market-size
    missingEvidence: A single reconciled methodology that bridges McKinsey, QED-C, and BCG market definitions.
    whyItMatters: The estimates are still usable, but they measure different layers and can be misread as direct contradictions.
    diligencePath: Preserve the lens table and request methodology notes from future diligence packets rather than forcing a false single-number TAM.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM002
    relatedFigureRefs:
    - FM002
