- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication for Oratomic
  - Diligence ask
  rows:
  - - Sovereign quantum funding and testbeds
    - Tailwind
    - Active now through 2030+
    - Keeps near-term demand alive before broad enterprise ROI is proven; likely the best fit with Oratomic's current market profile.
    - Map Oratomic's outreach and design-partner pipeline by sovereign program, not only by generic TAM narrative.
  - - Post-quantum cryptography and strategic urgency
    - Tailwind
    - 2026-2035 migration window
    - Creates urgency for quantum-readiness budgets in government and critical infrastructure, even if not all of that spend converts directly into hardware revenue.
    - Separate adjacent PQC budgets from true hardware-conversion assumptions.
  - - Simulation-first use-case concentration
    - Tailwind
    - Near-term
    - Chemistry, materials, and biology align with Oratomic's own application narrative and with the strongest public demand signals.
    - Request benchmark evidence tied to a buyer KPI rather than only a technical demonstration.
  - - Hybrid HPC and cloud integration
    - Tailwind
    - Near-term to medium-term
    - Public buyer proof suggests neutral-atom systems are easiest to buy as part of a hybrid compute stack rather than as a standalone environment.
    - Test whether Oratomic has a credible access and integration plan while it pursues fault-tolerant milestones.
  - - Hardware readiness and timeline uncertainty
    - Headwind
    - Immediate and ongoing
    - If utility-scale fault tolerance slips materially, the addressable bull case shifts right while classical alternatives improve.
    - Commission an external architecture review of milestone dependencies, especially error correction and systems engineering.
  - - Classical AI and HPC competition
    - Headwind
    - Immediate and ongoing
    - Oratomic must beat a moving target in simulation, optimization, and AI-assisted discovery, not a static incumbent.
    - Benchmark against named classical baselines instead of generic “intractable problem” language.
  - - Talent shortage and supply-chain fragility
    - Headwind
    - Immediate and ongoing
    - Scaling hardware, photonics, and error-correction teams will stay difficult even after a large Series A.
    - Inspect hiring plan, component dependencies, and partner concentration risk.
  - - ROI proof and procurement discipline
    - Headwind
    - Immediate and ongoing
    - Buyers increasingly require validated economics, benchmarks, and workflow proof before large commitments.
    - Request pricing, willingness-to-pay, and conversion evidence from any early design partners or strategic users.
  notes: Direction is from Oratomic's perspective. Tailwinds increase buyer willingness or funding availability; headwinds raise the proof burden, stretch timelines, or reduce willingness to convert pilots into production commitments.
