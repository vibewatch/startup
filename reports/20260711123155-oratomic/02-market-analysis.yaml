chapter:
  number: 2
  title: Market Analysis
  summary: Oratomic is pursuing a market that is strategically important but still pre-commercial on most conventional enterprise software metrics. The best public evidence shows a small 2025-2028 revenue base for quantum computing, heavy dependence on sovereign and research funding, and a buyer journey that begins with cloud access, hybrid HPC, and co-design rather than mass production. That context matters for Oratomic because its decision to skip NISQ narrows the near-term revenue surface to a smaller set of deep-pocketed, simulation-driven, proof-oriented buyers who can tolerate long timelines and technical uncertainty.
sections:
- id: market-boundary-and-incumbent-stack
  title: Market boundary, adjacencies, and incumbent substitutes
  body: 'The first analytical task is to define a market boundary strict enough to be decision-useful. Oratomic is not a generic AI, semiconductor, or cybersecurity company, and it should not inherit the full spend pool attached to the phrase “quantum technology.” The relevant market is the narrower layer where neutral-atom quantum compute capacity is bought, accessed, integrated, or code-signed into real workflows: hardware systems, cloud machine time, hybrid HPC integration, and application-development engagements tied directly to the hardware. That boundary excludes most sensing, networking, and post-quantum cryptography migration spend, even though those areas can create urgency or adjacent budgets. It also forces a realistic incumbent comparison. Oratomic does not merely compete against other quantum startups; it must eventually beat well-funded classical HPC clusters, GPU-heavy AI systems, classical optimization stacks, and software-only risk-mitigation programs that already solve
    most buyer needs well enough today.'
