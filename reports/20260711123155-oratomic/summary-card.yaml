      Full cap table, preference stack, anti-dilution protections, and other downside terms for the current and future
      financings.
    - Burn, runway, capex, and the bridge from current capital to the next externally meaningful benchmark.
    - Rights chain and licensing terms for academic-origin neutral-atom inventions relevant to Oratomic's architecture.
    - >-
