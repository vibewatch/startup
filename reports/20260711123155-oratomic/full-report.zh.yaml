      - number: '5.2'
        title: 架构与运营模型
        blocks:
          - type: paragraph
            body: >-
              Oratomic 的技术核心很具体，不是泛泛量子：中性原子被困在光镊中，动态重排，并用于一种可重构架构，意在提升连接性和量子纠错。Caltech 和 IQIM 材料把该论点直接连接到
              密码学相关容错，并声称所需物理量子比特远少于旧假设；发布材料则把它连接到广泛模拟和 AI 工作负载。QuEra、AWS、Nature 和 IEEE 的品类基准补齐了运营模型背景。
              它们说明现代中性原子系统如何编程、Rydberg 相互作用为何重要、高保真门性能现在是什么水平，以及为什么开发者通常需要在硬件周围配置大量经典模拟和控制工具。 Oratomic
              尚未公开发布这层软件和运营能力，所以今天可以把公司承销为强硬件和架构论点，但还不能承销为完整浮出水面的开发者平台。
