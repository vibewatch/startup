      - number: '7.2'
        title: 技术与运营风险
        blocks:
          - type: paragraph
            body: >-
              技术问题不在于中性原子有没有前景。独立来源已经把它列为最具扩展性的路线之一。问题在于，规模本身不能抹掉其余工程负担。中性原子系统仍比超导系统慢，在保真度和就绪度指标上也落后于部分竞品路线，还需要完整系统栈：光学控制、封装、纠错和可靠运营。Oratomic
              的公开材料最强的是架构和使命，而不是一体化交付证据。10,000 量子位论证和可重构阵列设计很有吸引力，但公开证明仍停在研究和雄心层面。产品化风险也直接传导到运营，因为 Monarch
              是唯一被点名负责光子集成和制造支持的合作伙伴。公司尚未公开证明可维护性、现场可靠性或正常运行时间。因此，关键运营风险不是某个已知故障，而是缺少公开证据：这套栈能否按可预测时间表变成可支持的产品。
