      - number: '2.4'
        title: 增长驱动、预算逻辑与采用约束
        blocks:
          - type: paragraph
            body: >-
              近期需求的支撑，更多来自公共资金、战略紧迫感和以证明为导向的实验，而不是广泛企业 ROI。英国战略、NQIRA 重新授权推动、DOE Quantum Genesis 和 DARPA
              基准测试都表明，政府正在为能力建设、测试床、人才和验证买单。买家侧，QuEra 的市场研究显示，机构仍预期量子会重要， 但在预算、主权和采购上更有纪律。这让具名基准、安全工作流和模态可信度更关键。成本、ROI
              模糊、人才短缺，以及试点到生产之间的落差， 仍是主要约束。组合起来，Oratomic 受益于战略顺风，但它面对的市场里，即使有兴趣的买家也会在大规模转化前要求硬证据。
