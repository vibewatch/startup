  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 供应商 / 路径
      - 公开定价信号
      - 合同模式
      - 包含能力
      - 未知项 / 注意事项
      - 买方影响
    rows:
      - - Oratomic
        - 没有保留公开定价
        - 未公开披露；没有保留公开云或本地报价
        - 未来实用规模中性原子系统；没有公开 NISQ 路径
        - 商业条款、访问模式和折扣均未知
        - 评估摩擦上升，因为买方还不能具体做预算或比较报价
      - - QuEra / Amazon Braket
        - 免费 Open 计划；$96/分钟 PAYG；$72/分钟 Flex；$48/分钟 Premium；本地部署仅报价
        - 自助式入口，加上合同计划和专用本地服务
        - 量子计算访问、Qiskit Runtime、平台工具和可选加速器服务
        - 实际企业折扣和本地部署定价不公开
        - 同组里包装透明度最佳，采购清晰度最快
      - - IonQ / Azure 和直接云
        - Azure 发布门 shot 定价和最低执行费用；直接定价仍以报价为主
        - 按需、预留、直接云和 Forte Enterprise 部署
        - 多个 SDK、模拟器、直接支持和机架式企业硬件
        - 非 Azure 直接条款和预留容量折扣不公开
        - 对想要实时访问加企业路径的买方而言，与 QuEra 高度重叠
      - - Quantinuum / Azure 和直接订阅
        - Azure Standard $125,000/月，Premium $175,000/月，用于 H2 访问
        - 月度订阅、排队访问、直接云和本地 Helios 可用性
        - H2 硬件、仿真器、软件栈、Azure 采购选项
        - 非 Azure 直接定价、谈判折扣和利用率经济性不公开
        - 已具备企业就绪度，但价格足以压窄买方范围
      - - Rigetti / Azure 或 Novera
        - Azure 基于时间计费，并有直接硬件销售信号；这里没有保留 Rigetti 广泛公开云清单价。
        - 经纪式运行时按用量付费，Novera 直接采购
        - 混合云访问、本地 9 量子比特 QPU、深度硬件控制
        - 从 Novera 扩展到更广泛生产项目的真实成本仍不透明
        - 吸引更看重控制和集成、而非交钥匙托管访问的实验室
      - - Google Willow
        - 没有保留公开价格信号
        - 面向入选研究伙伴、通过提案门控的早期访问
        - 面向获批提案的最先进硬件访问，加上 Cirq 生态
        - 商业条款、容量和未来目录计划未知
        - 竞争威胁来自战略和生态，而不是近期价格
      - - D-Wave Leap / Advantage2
        - 保留的 D-Wave 页面上没有简单公开费率卡
        - 云访问、混合求解器和本地系统采购
        - 退火系统、混合求解器，以及企业级正常运行时间 / 安全姿态
        - 即便系统销售有公开引用，具体商业清单价仍不公开
        - 适合买方今天就需要可运营量子工作流的替代路径
      - - 经纪式云 / 混合 HPC 现状
        - 超大云厂商或 GPU 消耗能透明计量，但人力成本被藏住
        - 云市场用量加内部工程时间
        - 多厂商试验、仿真、混合工作流，以及推迟硬件承诺
        - 工程负担和工作负载可迁移性的限制，很少体现在标价里
        - 为任何专用硬件厂商划出实际价格地板
    notes: 这张表把明确公开的价目表，与合同驱动或经济性未知的模式拆开。保留下来的样本里，Oratomic 的商业界面最不透明；IBM、Azure 和 Braket 提供了最清晰的对照锚点。
