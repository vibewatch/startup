  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与投资逻辑
        blocks:
          - type: paragraph
            body: >-
              Oratomic 不应被当作普通后期成长投资，而应被视作押注容错中性原子量子计算的高上行、高脆弱性期权。正向逻辑是真实的：公司刚刚融得 $300
              million，投资人阵容一线，声称在物理量子位需求上实现重要科学跃迁，并已开始借 Monarch 讲出可制造性故事。反向逻辑同样重要。公开证据仍没有显示收入、客户、积压订单或定价；公司明确跳过
              NISQ；2026 年全行业买方证据也表明，采购如今要证明，不要愿景。这些事实意味着，当前估值只适合明确想要长周期深科技期权的基金。建议：观察 /
              仅有条件参与。信心：中。风险评级：高。估值态度：公开证据下偏高，只有作为战略期权价值才算合理。
