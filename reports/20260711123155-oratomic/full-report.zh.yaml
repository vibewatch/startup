    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 对 Oratomic 的影响
      - 尽调问题
    rows:
      - - 主权量子资金和试验平台
        - 顺风
        - 当前已启动，并延续至 2030 年后
        - 在广泛企业 ROI 得到证明之前，它让近期需求保持活跃；也很可能最契合 Oratomic 当前的市场画像。
        - 按主权项目梳理 Oratomic 的外联和设计伙伴管线，而不只看笼统 TAM 叙事。
      - - 后量子密码学和战略紧迫性
        - 顺风
        - 2026–2035 迁移窗口
        - 即便这些支出并不都会直接转化为硬件收入，政府和关键基础设施仍会为量子准备度预算产生紧迫感。
        - 将相邻 PQC 预算与真正转化为硬件的假设拆开。
      - - 模拟优先用例集中
        - 顺风
        - 近期
        - 化学、材料和生物学与 Oratomic 自身应用叙事一致，也对应最强的公开需求信号。
        - 要求拿出与买方 KPI 绑定的基准证据，而不只是技术演示。
      - - 混合 HPC 和云集成
        - 顺风
        - 近期至中期
        - 公开买方证据显示，买方最容易把中性原子系统作为混合计算栈的一部分采购，而不是单独采购一个独立环境。
        - 测试 Oratomic 在追逐容错里程碑的同时，是否有可信的访问和集成计划。
      - - 硬件准备度和时间线不确定性
        - 逆风
        - 当下且持续
        - 如果实用规模容错明显推迟，可触达的乐观情景会后移，而经典替代方案会继续进步。
        - 委托外部做一次架构评审，重点看里程碑依赖，尤其是纠错和系统工程。
      - - 经典 AI 和 HPC 竞争
        - 逆风
        - 当下且持续
        - Oratomic 要打败的是模拟、优化和 AI 辅助发现里不断移动的目标，而不是静态在位者。
        - 用具名经典基线做基准测试，不要只讲笼统的「难以处理的问题」。
      - - 人才短缺和供应链脆弱性
        - 逆风
        - 当下且持续
        - 即使完成大额 Series A，扩张硬件、光子学和纠错团队仍会很难。
