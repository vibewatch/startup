        title: 买家分层与最可能的采用路径
        blocks:
          - type: paragraph
            body: >-
              最强的公开买家证明来自政府、国家实验室、超算中心和重模拟研究生态。NERSC、AIST、ICSC、AWS Braket 和 Pawsey 展示的是同一套商业逻辑的
              不同版本：先提供访问，再辅导和开发工作流，等问题匹配更清楚后，再走混合或本地基础设施。商业细分存在，但不均衡。制药、生物、材料、
              化学和能源最契合公开用例证据，因为这些领域依赖模拟和发现工作流，经典方法在边缘问题上明显吃力。金融服务仍有战略兴趣，但公开证据指向 教育、试验和安全准备，而非广泛生产部署。因此，Oratomic
              近期应被看作服务高价值但狭窄的买家集，而不是广泛跨企业市场。
