            body: >-
              今天 Oratomic 最好的直接证明面，不是客户推荐，而是商业化伙伴。Monarch Quantum 真实、具名，并与系统进入可部署形态所需的产品化工作绑定。这有价值，
              但没有回答客户尽调的核心问题：谁已经在付费使用 Oratomic？公开记录中的答案仍是没有人。要框定未来需求的可能范围，次优证据来自中性原子类比。QuEra 与 AIST 的关系显示，
              室温中性原子系统可以在广泛企业采用前落地主权 HPC 买家。NERSC 显示，早期访问可以通过提案周期、培训和混合工作流支持来组织。Merck、Amgen、Deloitte、Cinfo 和 R 显示，
              今天的企业证明可以存在于狭窄、问题特定的试点中，尤其在生命科学和基础设施优化领域，但未必转化为广泛经常性收入。这组类比重要，因为它缩窄了 Oratomic 首批客户的合理范围。 它并不能让我们声称这些客户已经为
