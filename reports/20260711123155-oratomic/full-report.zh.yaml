            body: >-
              剩余工作主要是财务、商业和合同尽调，不是基础技术认知。公开证据足以说明 Oratomic
              资金充足、科学上严肃且仍处早期；但不足以说明新投资人在下行情景下实际拥有什么，或公司能多快把今天的科学转成支撑价格的证明。阻塞性问题很直接：股权结构表和优先权；烧钱速度、现金跑道和资本开支路径；学术源头 IP
              的权利链；商业化打包策略；以及真实买方管线证据。这些不是表面缺口。它们决定当前估值到底是便宜的期权价值，还是只是披露不足的风险。如果 Oratomic
              到下一次重大融资或竞争里程碑时仍没有公开基准、具名买方证据，或更清楚的权利和合规材料包，投资逻辑应视为破裂。在此之前，正确姿态是保持尽调温度、坚持价格纪律，避免只靠叙事动能承销上行。
