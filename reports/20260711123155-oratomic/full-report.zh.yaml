              按用户工作流看，Oratomic 尚未销售成品商业设备。公开产品更像一套未来系统架构，外面包着少数可见模块：中性原子硬件核心、量子比特重排和纠错论点、 Monarch Quantum
              合作所指向的光子控制与制造路径，以及围绕模拟、化学、AI、物理和密码学的应用故事。这比 QuEra 等同业早得多，后者已经暴露访问路径和开发者工具。 因此，Oratomic
              的产品面更尖，但也更薄。尖来自一个具体承诺——跳过 NISQ，直奔实用规模容错。薄来自所有尚未公开的部分：没有云路径、没有公开运行时 API、没有公开 SDK，
              也没有发布部署手册。从尽调角度，本章要判断的是，技术模块地图是否足够自洽，足以解释这些缺席，而不是判断 Oratomic 是否已经拥有成熟产品目录。
