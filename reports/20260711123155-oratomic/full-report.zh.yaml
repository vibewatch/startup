      - CV031
      - CV032
      - CV034
      - CV035
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 相对当前 $1.5B 标称估值，低、基准、高三种价值结果分别对应熊市、基准和牛市情形。
    approximationNotes: 所有数值均为分析师估算，单位为十亿美元。回报框架假设有效入场价格约为公开 ~$1.5B 估值，并排除未知优先权包袱。
    data:
      items:
        - label: 熊市情形价值（$B）
          low: 0.3
          base: 0.5
          high: 0.8
        - label: 基准情形价值（$B）
          low: 1.5
          base: 2.2
          high: 3
        - label: 牛市情形价值（$B）
          low: 5
          base: 7
          high: 10
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV033
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 以 IC 风格评估 Oratomic，维度聚焦今天评估私有容错量子投资头寸最关键的事项。
    approximationNotes: 评分是基于公开证据的 0-10 分方向性分析师判断，不是管理层提供的内部 IC 框架。
    data:
      items:
        - label: 市场机会
          value: 8
          note: PQC 紧迫性和量子兴趣仍然真实存在，即便采购很挑剔。
        - label: 技术优势
          value: 8
          note: 10k-20k 量子位论点有差异化，但仍处于产品前阶段。
        - label: 商业证据
          value: 2
          note: 未披露公开客户、收入或待交付订单。
        - label: 财务披露
          value: 2
          note: 烧钱速度、资本开支、优先权和现金续航期仍未公开。
        - label: 竞争地位
          value: 6
          note: 科学路线有希望，但同行公开披露的进展更多。
        - label: 估值支撑
          value: 3
          note: 当前估值标记主要由期权价值支撑，而不是运营指标。
        - label: 证据质量
          value: 5
          note: 融资和科学证据扎实；经济性证据偏弱。
        - label: 退出准备度
          value: 2
          note: 披露成熟之前，再融一轮私募比 IPO 更可能。
