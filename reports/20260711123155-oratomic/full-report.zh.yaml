            body: >-
              当前估值背景方向上说得通，但仍过于不透明，不能假装精确。$300 million A 轮和 ~$1.5 billion
              投后估值如今已被广泛报道，但公开来源没有披露优先权条款、反稀释、烧钱速度或资本开支桥接安排。这组缺口比标题数字本身更重要。即便没有公开收入、也没有过渡产品，只要市场相信科学断点足够大，公司仍能拿到高估值。但在
              2026 年证明驱动的环境里，投资者应假设下一轮条款，以及第一个真实买方或基准证明，比这第一轮标题融资更能决定实现价值。以当前进入价看，乐观情景能跑通，但前提是 Oratomic
