              Oratomic 还不能按当前账户数量或收入区间分层，因为公开界面没有显示具名终端客户、公开云访问计划，甚至没有原型访问动作。今天诚实划分客户群的方式， 是按可见的交易对手和买家问题来分。第一层是直接商业化层，由
              Monarch Quantum 等伙伴构成，后者明确负责光子集成、产品化和制造支持。第二层是研究验证层， 植根于公司的发布故事、Caltech 关联科学基础和安全披露姿态。第三层是潜在买家群，可从
              Oratomic 公开点名的问题，以及中性原子同业早期需求落地方式推断： 主权或 HPC
              中心、制药或化学研究团队，以及安全敏感或混合计算项目。这种分层更面向未来而非回顾过去，但仍比假装公司已经有广泛客户名册更站得住。 关键结论是，Oratomic
              可见的客户图景其实是一张可能首批买家和关键渠道伙伴地图，而不是实时装机基础的证明。
