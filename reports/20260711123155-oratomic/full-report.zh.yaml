        title: 创始团队、学术根基与创始人—市场匹配
        blocks:
          - type: paragraph
            body: >-
              创始人—市场匹配是 Oratomic 可信度背后的核心资产。CEO Dolev Bluvstein、CTO Hsin-Yuan Huang、 联合创始人 Manuel Endres 和创始团队成员 John
              Preskill 都直接来自孕育公司核心科学主张的 Caltech 与 Harvard 研究网络。公开发布材料称，初始团队 14 人，覆盖
              Caltech、Berkeley、Harvard、Amazon、Google 及相邻实验室；大学和本地报道进一步明确角色：Bluvstein 带来中性原子研究和 Harvard 训练，Huang 从
              Caltech 休假主导技术，Endres 锚定中性原子实验项目，Preskill 则提供数十年的容错理论领导力。公开记录对正式董事会组成
              和委员会结构的披露弱得多，因此尽调应把极强的科学创始人—市场匹配，与仍有限的治理透明度分开看。简言之，Oratomic 的人员故事在科学和技术合法性上异常强，但仍集中在少数学院派创始人和创始研究者身上。
