        - 光镊中的稳定俘获、冷却和原子装载
        - 装载、寿命或相干性瓶颈会限制可用规模
      - - 可重构几何层
        - 改变连通性，并支持计算过程中移动
        - 在保持相干性和校准的同时可靠搬运
        - 移动复杂度会成为扩展或可维护性的瓶颈
      - - Rydberg 相互作用层
        - 生成纠缠操作和基于相互作用的逻辑
        - 激光稳定性、校准和阻塞控制
        - 控制噪声会直接拉低算法和 QEC 表现
      - - 纠错架构
        - 压低物理到逻辑的开销，并支撑容错
        - 解码器性能、症状提取和布局控制
        - 即便裸硬件规模上去，QEC 也可能无法以经济方式扩展
      - - 光子控制栈
        - 对光学控制做路由、稳定，并可能推向工业化
        - PIC 设计、封装和制造成熟度
        - 光学和封装可能吃掉大部分资本开支或支持负担
      - - 经典仿真 / 解码层
        - 降低迭代成本，并支撑未来实时纠错
        - GPU 加速、仿真器和算法工具
        - 软件延迟或仿真器能力不足会拖慢技术进展
      - - 混合编排层
        - 将 QPU 接入 HPC、AI 和研究流水线
        - 伙伴生态、调度器和安全集成
        - 如果编排难度高于 QPU 路线图暗示，产品化可能滞后
    notes: 本表把硬件、软件和运行层放在一起，因为 Oratomic 的差异化取决于全栈，而不是某一项 QPU 规格。
