companyProfile:
  summary: >-
    Oratomic 是一家位于 Pasadena、与 Caltech 关联的量子计算公司，2026 年 3 月公开亮相，使命是在本十年末前
    造出实用规模的容错量子计算机。公司的核心论点是，可重构中性原子阵列加上更高效的纠错，可以把有用量子计算 所需的物理量子比特负担降到约 10,000-20,000 个，而不是外界常假设的数百万个。2026 年 4 月，Oratomic
    引入 Monarch Quantum 作为光子系统集成商，支持产品化和制造；2026 年 7 月，公司宣布完成 $300 million Series A，据报道投后估值约 $1.5
    billion。更不透明的是商业层：公开来源没有披露收入、客户数量、订单储备、 融资条款，也没有给出从研究里程碑走向可重复产品收入的清晰桥梁。
  foundedDate: '2026-03-31'
  founders:
    - name: Dolev Bluvstein
      role: 联合创始人兼 CEO
      background: 受 Harvard 训练的量子物理学家，也是 Caltech 访问副研究员，主导 Oratomic 的公司组建和容错策略。
