  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻领域与在位替代方案
        blocks:
          - type: paragraph
            body: >-
              首要分析任务，是把市场边界划到足够严格，才能服务决策。Oratomic 不是泛 AI、半导体或网络安全公司，也不应继承“量子技术”
              这个词背后的全部支出池。相关市场是更窄的一层：中性原子量子计算能力被购买、访问、集成，或以代码签入真实工作流的地方—— 硬件系统、云端机器时间、混合 HPC
              集成，以及与硬件直接绑定的应用开发项目。这个边界排除了大多数传感、网络和后量子密码迁移支出， 尽管这些领域可以制造紧迫感或相邻预算。它也迫使我们做现实的在位者比较。Oratomic
              不只是与其他量子初创公司竞争；它最终还必须 胜过资金充足的经典 HPC 集群、GPU 密集型 AI 系统、经典优化栈，以及今天已经足以解决多数买家需求的软件化风险缓释方案。
