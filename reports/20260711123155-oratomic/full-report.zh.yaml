chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段、总部与产品论点
        blocks:
          - type: paragraph
            body: >-
              Oratomic 于 2026-03-31 走出隐身，作为一家与 Caltech 关联的初创公司，任务定义很窄：在本十年末前
              造出实用规模容错量子计算机，而不是销售过渡性的有噪声中等规模量子系统。公司把自己描述为一家围绕光和原子搭建的 Pasadena 企业；本地报道则把其运营基地系到 Caltech 的 91125 邮编，并称其为
              Pasadena 本土孵化的 spinout。 最有支撑的阶段描述是：一家私有 Series A 量子硬件公司，科学叙事靠前，资本化程度远高于正常种子期硬件同侪，
              但按收入、客户数量、运营覆盖面等普通软件创业指标看仍处于商业化前阶段。后续分析需要把这一点放在前面，因为 Oratomic
              今天卖的不是宽平台或咨询故事；它押注的是围绕中性原子容错的一条非常具体的产品论点，商业证明预计会 晚于融资头条所暗示的时间。
