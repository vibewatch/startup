      - number: '2.2'
        title: 市场规模需要多重视角，而不是一个头条 TAM
        blocks:
          - type: paragraph
            body: >-
              公开市场数据有方向价值，但不能干净相加。McKinsey 和 QED-C 都显示，2025 到 2028 年窗口内全球收入市场小但在增长； BCG
              则对当下技术效用保持更保守立场，并把最大的供应商收入结果推到遥远的容错时代。这些数字并非直接矛盾，更多是在测量不同层面： 当前厂商收入、长期供应商收入、处于风险中的经济价值，以及公共项目赋能预算。对
              Oratomic 而言，这一区分比任何单一数字的绝对规模更重要。 试图销售容错终态的初创公司，不能把万亿美元级“处于风险中的价值”当作近期可花费 TAM。可信的近期市场视角更小：整个量子细分市场是
              低个位数十亿美元，对应中性原子等模态的切片更小，且没有公开的中性原子专属 SAM 或 SOM 数据集。
