      - number: '8.3'
        title: 可比背景与退出就绪度
        blocks:
          - type: paragraph
            body: >-
              可比分析给出的信号是纪律，而不是兴奋。Quantinuum $10 billion 投前轮是上沿锚，因为它已有可商用系统，也披露了更强的客户信息。IQM 约 $1.8 billion
              上市是较低、但商业化程度高得多的桥，已经有公开收入和积压订单指标。Xanadu 的公开市场披露显示，即便公司估值在 $3 billion
              左右，收入仍可处早期；但至少投资者能看到真实现金和经营亏损披露。PsiQuantum 说明，当政府承销里程碑时，公用事业规模量子故事可以获得巨大期权价值；Atom 和 Pasqal
              则说明中性原子方向的资本胃口仍强。IonQ 等美国公开量子可比公司进一步强化同一点：量子市场会为长周期期权融资，但融资会伴随越来越多披露。对 Oratomic
              而言，最可能的退出路径仍是另一轮私募或战略资本事件，而非近期 IPO，因为公司在披露深度上尚未准备好进入公开市场。
