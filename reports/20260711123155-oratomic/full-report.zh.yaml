        - 说明市场重估风险的速度快于验证改善
        - 中
        - 假设本轮为时间窗口支付了过高价格
      - - IP 权利或许可材料包薄弱
        - 削弱护城河和战略尽调信心
        - 低至中，但严重性高
        - 追加任何新资本前，先升级法律审查
      - - 面向敏感买方的合规或出口管制材料包未就绪
        - 可能同时拖慢销售和战略资本
        - 中
        - 下调主权或安全买方的假设转化速度
      - - 同行验证提速，而 Oratomic 仍不透明
        - 即便科学仍有吸引力，相对估值支撑也会变弱
        - 中高
        - 要求更强价格纪律，否则退出
    notes: 终止触发项设计成可监测，聚焦验证、条款和就绪度，而非投机性叙事变化。
    claimRefs:
      - CV035
      - CV040
      - CV041
      - CV042
  - id: TV006
    title: 最终尽调索取清单
    columns:
      - 索取项
      - 为什么重要
      - 估值含义
      - 所需证据
    rows:
      - - 股权结构表和优先权
        - 决定下行情景所有权和有效入场价
        - 优先级未知可能抹掉表面上行
        - 可供投资人使用的股权结构表、SAFEs/票据和优先权摘要
      - - 烧钱、现金和资本开支桥表
        - 检验当前资本能否真正撑到下一个验证点
        - 现金跑道不足意味着更早的稀释风险
        - 月度烧钱桥表、现金余额、资本开支计划和招聘爬坡
      - - IP 权利链
        - 判断科学差异化是否真正可拥有
        - 权利薄弱会拉低终值并增加融资摩擦
        - 许可、转让、专利审查摘要和律师备忘录
      - - 买方管线和商业包装
        - 区分好奇心和可变现需求
        - 具名验证可实质支撑当前估值
        - 意向书、试点结构、定价逻辑和合作伙伴 / 渠道图谱
      - - 里程碑看板
        - 整个上行案例取决于可信的排序
        - 里程碑延后或含糊，会迅速拉低估值
        - 董事会批准的路线图，并设置外部验证关口
      - - 合规材料包
        - 敏感买方和战略投资人可能很早就要求
        - 材料包缺失会同时拖慢收入和资本路径
        - ECCN 图谱、报告准备度和买方安全问卷回复
    notes: 这些索取项按最直接改变下行投资测算的程度排序；第 1-3 项是形成高确信投资前的前置阻塞项。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
      - CV041
      - CV042
