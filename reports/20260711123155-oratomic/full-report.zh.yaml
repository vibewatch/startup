      - number: '2.5'
        title: 矛盾、反向证据与剩余尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最大的市场风险是时间，而不是理论需求是否存在。多头可以引用 McKinsey、DOE 和风投热情，主张有用系统正在进入视野；空头则可以指向 BCG、Moody’s、ORF 和 IBM
              的验证框架，认为市场距离广泛实用效用仍有多年，而且必须跨过比宣传叙事所暗示更高的证明门槛。对 Oratomic 而言，自身策略放大了这一矛盾。公司拒绝销售 NISQ
              系统，避开了低价值原型收入，但也放弃了一些近端学习循环和客户证明面，而同业已经用这些 来建立市场份额。因此，最大未解问题不只是抽象 TAM 算术；更是具体到买家的转化经济性、支付意愿，以及 Oratomic
              能否在容错里程碑到来前 拿下具名设计伙伴。
