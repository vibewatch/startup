  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              Oratomic 严重度最高的风险，是科学可行性与产品证明之间的缺口。公开材料展示了突破性架构、发布叙事、负责任披露立场和制造导向合作，但还没有展示集成后的公开系统基准、
              注明日期的交付计划或客户使用证明。这很关键，因为其余风险栈都围绕同一个缺口叠加。技术进展一旦滑坡，没有公开云或设计伙伴漏斗来缓冲下行。出口管制或合规工作如果拖慢人才获取或协作，
              同样的延迟会把买家证明和融资推后。Monarch 如果成为瓶颈，技术风险和商业风险会一起移动，因为产品化集中度已经很高。因此，热力图把进度压缩、依赖集中、监管摩擦和资本不透明，
              放在更常规创业不确定性之上。这不是丑闻风险故事，而是论点执行故事：如果公司长期停留在重叙事状态，几个单独可管理的风险可能变得高度相关。
