        - 高
        - 直接同业已经开放云端或本地部署路径，IBM、IonQ 和 Quantinuum 则给出更宽的企业入口
        - 要求说明当前胜负单原因、10k-20k 量子比特论点的独立验证，以及面向具体工作负载、相对同业的证明
      - - 资本厚度和科学背景支撑买方信心
        - 与 QuEra、IBM、Azure 关联竞争者和 D-Wave 相比，Oratomic 没有公开定价、接入路径或客户证明
        - 高
        - 买方今天能为许多替代方案做预算和测试，但仅凭公开材料无法对 Oratomic 这样做
        - 要求一份商业化路线图，覆盖接入、试点和采购包装，而不只是技术里程碑
      - - 跳过 NISQ 可能避开低价值弯路
        - 对手可借早期接入计划更快学习，并积累灯塔客户
        - 高
        - QuEra、IonQ、Quantinuum、Pasqal 和 D-Wave 都已经暴露更早期的评估界面
        - 要求证明设计伙伴学习闭环可以替代公共接入计划通常产生的市场数据
      - - 容错路线图让 Oratomic 区别于原型优先叙事
        - Google、IonQ、Quantinuum 以及整个品类都在提出相互竞争的 FTQC 主张，而怀疑仍然很强
        - 高
        - Willow、Helios、IonQ 路线图和 IEEE 的质疑共同限制了买方应为路线图价值背书的程度
        - 要求提供独立里程碑标准，并绑定客户可用的工作负载，而不只是内部路线图标签
      - - 实用规模工作负载可能值得获得高规格战略关注
        - D-Wave 以及混合 AI/HPC 替代方案可满足近期优化或仿真需求，无需被 Oratomic 特定方案锁定
        - 中
        - Leap、混合求解器和 CUDA-Q 强化了维持现状的替代选项：推迟专用硬件决策
        - 针对 Oratomic 预计能在求解时间或结果质量上击败混合经典基线的具体工作负载做基准测试
    notes: 严重性衡量的是 Oratomic 定价权和进入候选名单位置所受风险，而不是量子计算这个品类失败的概率；这份登记表强调的是在 2026 年采购周期中最直接削弱差异化耐久性的威胁。
