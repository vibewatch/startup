    layout: standard
    summary: 相对当前 $1.5B 基准估值标记，最重要公开敏感性驱动因素会带来的估算股权价值方向性变化。
    approximationNotes: 敏感性数值是分析师基于公开证据估算、以十亿美元计的美元值；它们展示方向和相对幅度，不是管理层预测。
    data:
      items:
        - label: 首个具名灯塔客户 / 设计伙伴
