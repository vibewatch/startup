              因为这些公司都追求同一个大方向：由单个可控原子组成、可扩展的阵列。下一层更宽、资本更厚：IBM 和 Google 做超导系统，IonQ 和 Quantinuum 做囚禁离子，PsiQuantum
              做光子。硬件厂商之上还有一层替代方案。AWS Braket 和 Azure Quantum 让买家在同一采购界面比较多个后端；NVIDIA CUDA-Q 等混合 AI/HPC
