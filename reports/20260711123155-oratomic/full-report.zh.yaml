      - number: '7.4'
        title: 合作伙伴、人员与资本风险
        blocks:
          - type: paragraph
            body: >-
              执行风险不只是物理问题，还在于 Oratomic 能否拼出交付首个真实系统所需的组织和资产负债表。人是格外尖锐的问题，因为量子纠错（QEC）人才稀缺、专门化强、培养慢。Riverlane 和 The
              Quantum Insider 都把实时 QEC 和解码器能力视作行业瓶颈，而这正是 Oratomic 声称有优势的层。与此同时，公司公开的依赖图很窄。Monarch
              是最显眼的商业化节点，其余栈看起来仍依赖学术源头专有知识、战略资本和未来受政策影响的买方。财务上，A
              轮规模很大，但公开记录仍没有披露烧钱速度、现金跑道、资本开支或商业毛利率假设。同业证据在这里两面切：这个赛道能吸引巨额资本，但更知名的同行也仍在继续融资或使用公开市场，同时扛着沉重工程账单。因此，Oratomic
              应被理解为资金充足但财务不透明；未来融资风险与技术和商业里程碑能否足够快出现、支撑下一步估值紧密绑定。
