      - number: '7.3'
        title: 监管、法律与政策风险
        blocks:
          - type: paragraph
            body: >-
              量子计算如今处在比多数普通软件业务明显更收紧的法律和政策边界内。BIS 已对量子计算机及相关物项实施管制；法律评论也说得很清楚，相关量子 ECCN、视同出口规则和年度报告义务细到会进入日常运营。OMB 和
              NIST 材料也说明了商业上的影响：美国政府正在迁移易受攻击的密码体系，并要求各机构盘点、排序暴露在未来 CRQC 风险下的系统。这会带来最终需求，但也意味着买方会更看重合规和安全。NSA 对 QKD
              的立场更进一步，警告量子密码系统的安全取决于实现方式，物理规律本身并不保证安全。Oratomic 明确强调可运行 Shor
              算法的系统和负责任披露，因此这是一把双刃剑。密码相关性抬高战略重要性，同时也抬高了证据、安全声明和出口管制治理的门槛。IP 的法律可见度同样不完整。围绕一项核心中性原子发明的公开专利边界指向
              Caltech、MIT 和 Harvard，而非清楚指向 Oratomic 本身；因此，许可和自由实施（FTO）仍是待尽调的问题，不是已经坐实的护城河。
