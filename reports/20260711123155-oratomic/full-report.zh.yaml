              有用容错机器的核心组件已在较小规模得到实验展示；中性原子品类在逻辑量子比特和门保真度上取得可见进展；一项合作意在工业化光子控制。组合起来，即使尚未以产品形式公开， 也暗示未来存在一条可行的混合 HPC
