  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 替代方案
      - 类别
      - 规模 / 融资信号
      - 目标买方
      - 产品 / 访问范围
      - 差异化和限制
    rows:
      - - Oratomic
        - 直接中性原子新进入者
        - 2026 年 7 月 $300M Series A；尚无公开商业系统
        - 主权项目、国家实验室、HPC 中心和长周期企业设计伙伴
        - 实用规模容错中性原子系统；没有公开 NISQ 产品或商业访问路径
        - 差异化来自量子比特效率和容错论点；限制在于当前没有公开定价、云访问或客户证据。
      - - Atom Computing
        - 直接中性原子竞争对手
        - 2025 年融资 >$230M；云加本地访问
        - 追求大型门基中性原子系统和逻辑量子比特项目的组织
        - 直接中性原子系统，以及与 Microsoft 相关的超算路径
        - 已有中性原子产品上线 Braket，提供高级直接访问和本地部署路径；生态仍小于 IBM 或离子阱头部厂商。
      - - Pasqal
        - 直接中性原子竞争对手
        - 2026 年宣布 1,200+ 全连接量子比特，并融资 $300M+
        - 工业优化、金融、HPC 和云买方
        - Pasqal Cloud、本地系统、Google Cloud 和 Azure 路径
        - 工业和云姿态强；具体经济性和容错成熟度仍在演进。
      - - IBM Quantum
        - 在位通用硬件平台
        - 30+ 套超过 100 量子比特的系统，2,300+ 可用量子比特，97% 正常运行时间
        - 企业、HPC、研究机构和本地部署买方
        - 通过 IBM Quantum Platform 提供开放、按用量付费、flex、高级和本地计划
        - 企业包装最透明、机队最广；低温超导栈和纠错开销仍是真实约束。
      - - Google Quantum AI
        - 在位 R&D 对手
        - Alphabet 支持的 Willow 项目，已取得 105 量子比特基准结果
        - 顶尖研究合作者和旗舰科学伙伴
        - 选择性 Willow Early Access，加上 Cirq 软件生态
        - 生态引力高、技术品牌强；但访问不公开，近期采购界面弱。
      - - IonQ
        - 商业化离子阱对手
        - 上市公司，2026 年 Q1 收入 $64.7M，并有激进的 2026–2030 路线图
        - 企业、政府、云和数据中心运营商
        - 直接云、预留、主要 SDK 支持，以及 Forte Enterprise 本地系统
        - 商业重叠和渠道广度都很强；路线图雄心领先于当前 36 量子比特产品规模。
      - - Quantinuum
        - 商业化离子阱对手
        - Honeywell 支持的 Helios 平台，提供 Azure 和直接订阅
        - 企业、政府、制药、金融和先进 R&D 买方
        - 直接订阅、云服务、Azure 分销和本地 Helios 访问
        - 高保真全栈产品，并有公开经纪式定价；偏企业的经济性可能拖慢更广泛的试验。
      - - PsiQuantum
        - 长周期光子对手
        - 政府支持的芝加哥和澳大利亚实用规模建设
        - 主权、战略和长周期企业买方
        - 今天没有广泛公开计算；平台和软件故事瞄准实用规模 FTQC
        - 深制造论点和资本强度让它具备战略重要性；近期买方可访问性有限。
      - - Rigetti
        - 超导挑战者
        - 全栈 Fab-1 制造商，有 108Q 云系统历史和 Novera 产品
        - 研究、政府、接入 HPC 的实验室、硬件试验平台
        - 混合云服务，加上可立即交付的 9 量子比特本地 Novera QPU
        - 吸引需要硬件控制和低延迟混合工作流的买方；商业规模小于 IBM 或离子阱头部厂商。
      - - D-Wave
        - 相邻 / 替代方案
        - $20M FAU 系统协议，以及生产级 Leap 服务
        - 优化密集型企业、公共部门、物流、制造
        - Leap 量子云、混合求解器、本地 Advantage2 系统和门模型 R&D
        - 今天最适合优化任务、运营准备度最高的替代方案；不是一一对应的通用门模型竞争对手。
      - - AWS / Azure 经纪商 + 混合 HPC 现状
        - 云经纪和内部自建替代方案
        - 超大云厂商分销，加上按用量付费市场和经典 GPU 资产
        - 探索型买方、平台团队，以及试图推迟硬件承诺的预算负责人
        - 经纪式访问多种 QPU，加上 CUDA-Q 等混合开发栈
        - 多供应商并行和对比的最简单方式；但不能消除不同模态之间的性能差异。
    notes: 各行覆盖直接中性原子同行、在位通用硬件平台、相邻替代方案，以及 2026 年买方能够现实比较的经纪式现状路径；规模信号混合融资、机队和商业化证据，而不是单一标准化指标。
    enumerationScope:
      coverage: partial
      basis: >-
        The table covers the most decision-relevant named rivals and substitute routes evidenced by retained 2026
