- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Primary threat
  - Severity
  - Current evidence
  - Mitigation / diligence ask
  rows:
  - - Neutral-atom architecture plus qubit-efficiency thesis
    - Direct peer crowding from QuEra, Atom, and Pasqal plus better-capitalized trapped-ion and superconducting rivals
    - High
    - Direct peers already expose cloud or on-prem routes while IBM, IonQ, and Quantinuum offer broader enterprise surfaces
    - Ask for current win/loss reasoning, independent validation of the 10k-20k qubit thesis, and workload-specific proof versus peers
  - - Capital depth and scientific pedigree support buyer confidence
    - No public pricing, access route, or customer proof compared with QuEra, IBM, Azure-linked rivals, and D-Wave
    - High
    - Buyers can budget and test many alternatives today but cannot do so with Oratomic from public materials
    - Request a commercialization roadmap that covers access, pilots, and procurement packaging rather than only technical milestones
  - - Skipping NISQ may avoid low-value detours
    - Rivals can use early access programs to learn faster and accumulate lighthouse customers
    - High
    - QuEra, IonQ, Quantinuum, Pasqal, and D-Wave all expose earlier evaluation surfaces
    - Request evidence that design-partner learning loops can replace the market data that public access programs normally generate
  - - Fault-tolerant roadmap differentiates Oratomic from prototype-first stories
    - Google, IonQ, Quantinuum, and the full category are making competing FTQC claims while skepticism stays high
    - High
    - Willow, Helios, IonQ roadmaps, and IEEE skepticism all bound how much roadmap value buyers should underwrite
    - Demand independent milestone criteria tied to customer-usable workloads, not just internal roadmap labels
  - - Utility-scale workloads could justify premium strategic attention
    - D-Wave and hybrid AI/HPC substitutes can satisfy near-term optimization or simulation needs without Oratomic-specific lock-in
    - Medium
    - Leap, hybrid solvers, and CUDA-Q strengthen the status-quo alternative of delaying a dedicated hardware decision
    - Benchmark exact workloads where Oratomic expects to beat hybrid classical baselines on time-to-solution or result quality
  notes: Severity rates the risk to Oratomic’s pricing power and shortlist position, not the probability that quantum computing as a category fails; the register emphasizes the threats that most directly weaken differentiation durability in 2026 buying cycles.
