chapter:
  number: 3
  title: Competitors
  summary: Oratomic enters the 2026 competitor set with unusually strong science and capital for a newly launched startup, but a much thinner commercial surface than its leading peers. Direct neutral-atom rivals already expose cloud access, on-prem systems, or named industrial programs, while IBM, IonQ, and Quantinuum set a higher bar on procurement transparency and customer proof. That means Oratomic's differentiation depends less on modality choice alone and more on proving its qubit-efficiency thesis, landing lighthouse partners, and converting a fault-tolerant narrative into buyer trust before better-distributed rivals lock in early workloads.
sections:
- id: landscape-and-solution-classes
  title: Landscape and solution classes
  body: 'Oratomic is not entering a single tidy peer group. The direct peer set is the neutral-atom cohort—QuEra, Atom Computing, and Pasqal first, with Infleqtion adjacent—because those companies are pursuing the same broad promise of scalable arrays of individually controlled atoms. The next layer is broader and better capitalized: IBM and Google in superconducting systems, IonQ and Quantinuum in trapped ions, and PsiQuantum in photonics. A substitute layer sits above the hardware vendors. AWS Braket and Azure Quantum let buyers compare multiple backends on one procurement surface, while hybrid AI/HPC platforms such as NVIDIA CUDA-Q and classical-quantum workflows delay any hard commitment to one modality. For Oratomic, the practical implication is clear: it must beat direct neutral-atom peers on technical credibility while also convincing buyers not to keep experimenting through more accessible clouds, trapped-ion offers, or purely classical hybrid stacks.'
