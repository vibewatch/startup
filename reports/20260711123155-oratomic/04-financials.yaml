- id: unit-economics
  title: Unit economics and public benchmark corridor
  body: 'Direct unit economics are not publicly calculable. Oratomic''s long-run thesis is attractive on paper: a smaller qubit count target, reconfigurable neutral-atom arrays, and photonic control integration could eventually improve the economics of fault-tolerant systems if the architecture works. But that remains a thesis. The best public benchmark corridor still comes from quantum companies that already disclose real revenue and real losses. IonQ shows that even a company with more than $100 million of annual revenue can still post hundreds of millions of dollars of losses. D-Wave shows that QCaaS, system sales, and enterprise licenses can create measurable revenue and strong gross margin while losses and operating expense still remain large. Rigetti shows that even a vendor with on-prem orders and cloud operations can remain deeply unprofitable at a single-digit-million revenue scale. These are imperfect modality comps, but they are still the best public evidence for how much revenue
    quantum companies generate before scale and how persistent losses remain after commercialization begins.'
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
