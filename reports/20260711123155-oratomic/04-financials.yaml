- id: TI005
  title: Public Financial Gaps Table
  columns:
  - Missing input
  - Why it matters
  - Best public proxy today
  - Exact diligence path
  rows:
  - - Cash on hand
    - Determines survival between technical milestones
    - None
    - Request current cash, short-term investments, restricted cash, and any equipment-finance obligations
  - - Monthly burn / quarterly operating cash flow
    - Needed for runway and next-round timing
    - Peer public losses only
    - Request trailing-quarter cash-flow statement and budgeted monthly burn
  - - Revenue recognition by source
    - Separates grants, pilots, and commercial-quality revenue
    - No public Oratomic contract or revenue split retained
    - Request split of any contract revenue, pilot revenue, and deferred revenue
  - - Gross margin / cost of revenue
    - Needed to test the economics of a neutral-atom build-out
    - Peer public quantum companies still loss-making
    - Request gross margin bridge by product or service line
  - - Capex budgets by milestone
    - Determines adequacy of the current round
    - No public equipment, facility, or photonics budget retained
    - Request phased capex model through next architecture milestone
  - - Pricing and contract terms
    - Needed to forecast revenue bridge
    - No public rate card or contract form retained
    - Request price cards, reserved-capacity terms, and paid pilot agreements
  - - Customer backlog / pipeline
    - Determines whether financing is matched by demand
    - No public backlog or named paid design partners
    - Request signed backlog, LOIs, and stage-weighted pipeline
  - - Working capital / supplier terms
    - Hardware projects can consume cash before revenue recognition
    - No public inventory or payables data
    - Request inventory policy, vendor lead times, and milestone-payment schedule
  notes: These are the minimum missing inputs required to turn the public financing narrative into an investable revenue, margin, and runway model.
