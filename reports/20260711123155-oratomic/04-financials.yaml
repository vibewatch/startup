  - FI002
- id: capital-adequacy
  title: Capital adequacy and capital intensity
  body: 'Capital support is visible; adequacy is not. The main disclosed input is the $300 million Series A, plus the presence of investors known for funding long-horizon deep tech. Public sources also show that comparable neutral-atom or broader quantum companies continue to raise very large sums: Atom Computing announced more than $300 million in 2026, Pasqal announced at least €340 million heading into its public-listing path, QuEra raised more than $230 million in 2025, and public peers such as IonQ and D-Wave maintain very large balance sheets even after commercial launch. All of this points to a category where capital intensity remains structurally high. What outside investors still cannot see for Oratomic is the denominator: current cash, monthly burn, hiring pace, equipment commitments, vendor prepayments, and whether $300 million is enough to reach the company''s next truly value-inflecting milestone without another financing round.'
  claimRefs:
  - CI002
  - CI008
  - CI009
  - CI016
