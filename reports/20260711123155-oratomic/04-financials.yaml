- id: verdict-gaps
  title: Underwriting gaps and financial verdict
  body: 'The underwriting conclusion is straightforward: Oratomic looks very well financed for its age, but still opaque as an operating business. Public evidence supports the quality of the round, the scientific credibility of the founding thesis, and the fact that neutral-atom competitors are spending heavily to reach commercialization. The same evidence set also shows why the company remains hard to model. Management would need to disclose at least six things to make the business normally underwritable: current cash, monthly burn, recognized revenue by source, pricing or contract structure, hardware or facility capex budgets, and gross margin or cost-of-service data. Until then, the financial verdict is not “weak” so much as “capitalized but unmodeled”: the business may be strategically important and unusually well backed, yet public materials support only a capital-intensity thesis, not a dependable operating model.'
  claimRefs:
  - CI018
  - CI020
