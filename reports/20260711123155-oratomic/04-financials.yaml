- id: pricing-gtm
  title: Pricing transparency, GTM motion, and traction proxies
  body: 'Pricing transparency is effectively absent. Oratomic does not publish a cloud tariff, reserved-capacity rate, hardware list price, or software subscription price. That suggests a negotiated sovereign or strategic-enterprise sales motion rather than self-serve quantum commerce, but even that is not public in concrete terms because the company has not named customers, pilot programs, or channel partners for compute access. Public traction proxies are therefore indirect: the blue-chip investor list, the unusually large Series A, the Caltech pedigree, and peer behavior elsewhere in the market. By contrast, IonQ, D-Wave, IBM, Azure-linked providers, and some neutral-atom peers already expose public pricing or at least named monetization paths. Oratomic may still be taking the right strategic path for a fault-tolerant end state, but traditional SaaS-style underwriting tools such as CAC, NRR, payback, and utilization cannot be estimated from public materials today.'
  claimRefs:
  - CI003
  - CI005
  - CI007
  - CI018
  - CI020
