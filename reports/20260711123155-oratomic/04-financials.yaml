company:
  name: Oratomic
chapter:
  number: 4
  title: Financials
  summary: Oratomic's public financial story is dominated by financing rather than operating disclosure. Official and independent sources corroborate the July 2026 $300 million Series A and the company's strategic ambition, but they do not disclose revenue, cash on hand, burn, gross margin, backlog, or pricing. The underwriting question is therefore not whether Oratomic can raise capital—it clearly can—but whether public evidence is rich enough to convert that capital story into a credible revenue, margin, and runway model; today it is not.
sections:
- id: revenue-model
  title: Revenue model and public monetization status
  body: Oratomic's public revenue picture is undeclared rather than merely early. The company launched in March 2026 and raised $300 million in July, but retained sources do not disclose recognized revenue, customer count, backlog, or any signed contract value. What public materials do reveal is the likely shape of the future model. Oratomic is building toward utility-scale fault-tolerant neutral-atom systems and explicitly says it will not sell NISQ products, which pushes monetization away from immediate cloud-time sales and toward longer-cycle channels such as strategic design partnerships, government or national-lab programs, future direct system sales, and eventually cloud or reserved-capacity access once hardware is available. In that sense, the company's economics look more like frontier infrastructure procurement than software self-service. The distinction matters because public sources support the existence of a large financing event and a credible product thesis, but not any present
    recurring revenue base.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI018
  - CI026
  - CI039
