- id: retention-and-durability
  title: Retention, Repeat Usage, and Durability Signals
  body: 'Public durability evidence for Oratomic is almost nonexistent in the standard SaaS or hardware-vendor sense. There is no NRR, GRR, churn, contract term, active-seat, satisfaction, or renewal disclosure because there are no named public customer accounts to measure. The only continuity evidence visible today is strategic rather than economic: the company launched publicly, framed a responsible-disclosure narrative around cryptographic urgency, partnered with Monarch for productization, and then closed a large Series A. Those are meaningful indicators that the business is progressing. They are not substitutes for repeat usage or repeat spend. Peer evidence provides a partial proxy. Neutral-atom companies that are further along often show continuity through access expansion, training programmes, staged proposal cycles, or follow-on memoranda. That at least tells us what to look for next from Oratomic. Until the company exposes some equivalent signal, durability has to be underwritten
    as unknown rather than assumed. This is one of the chapter’s most material diligence gaps.'
