- id: adoption-trajectory
  title: 'Adoption Trajectory: Corporate Milestones, Not Yet Usage Metrics'
  body: 'The public trajectory is visible, but it is a corporate-readiness timeline rather than a deployment curve. In 2026 Oratomic moved from public launch to a manufacturing-oriented partnership with Monarch Quantum and then to a $300 million Series A. Those events matter because they show that the company is assembling the inputs needed for commercialization: technical credibility, systems integration, and financing. What they do not show is customer activity. There are no public user counts, proposal statistics, machine hours, live locations, or named pilots. TechCrunch makes the gap even starker by saying Oratomic does not plan to build or sell NISQ systems, which means there is no obvious near-term bridge product to create usage metrics ahead of fault-tolerant milestones. Peer neutral-atom histories show what future adoption proof could look like: AIST-style sovereign deployment, NERSC-style proposal-gated access, Pawsey-style private cloud programmes, or Roadrunner-style staged testbeds.
    Oratomic is not there publicly yet. The correct interpretation is that adoption evidence exists at the level of organizational preparedness and market interest, but not yet at the level of observable customer usage.'
  claimRefs:
  - CU007
  - CU008
  - CU010
  - CU021
