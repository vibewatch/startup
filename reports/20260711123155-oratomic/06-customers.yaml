- id: named-proof-and-neutral-atom-analogs
  title: 'Named Proof: Direct Counterparties Versus Neutral-Atom Buyer Analogs'
  body: 'The best direct proof surface for Oratomic today is not a customer reference but a commercialization partner. Monarch Quantum is real, named, and tied to productization work that matters for getting systems into deployable form. That is valuable, yet it does not answer the main customer diligence question: who is already paying to use Oratomic? The answer remains nobody in the public record. To bound likely future demand, the next-best evidence comes from neutral-atom analogs. QuEra’s AIST relationship shows that room-temperature neutral-atom systems can land a sovereign HPC buyer before broad enterprise adoption. NERSC shows that early access can be structured through proposal cycles, training, and hybrid workflow support. Merck, Amgen, Deloitte, Cinfo, and R show that enterprise proof today can exist in narrow problem-specific pilots, especially in life sciences and infrastructure optimization, without translating into broad recurring revenue. That analog set matters because it
    narrows the range of plausible first Oratomic customers. It does not let us claim those customers already exist for Oratomic. The diligence stance should therefore separate direct counterparties from modality analogs and give much more weight to the former when judging commercialization maturity.'
