- id: expansion-and-concentration
  title: Expansion Paths, Concentration Risk, and Procurement Friction
  body: If Oratomic converts its science into customer demand, the first expansion path is likely to be partner-led and highly concentrated. Monarch could help convert technical promise into an integration-ready system, but the first paying programme is still likely to be a single sovereign, HPC, pharma, or security-focused account with outsized signalling value. That creates concentration risk from day one. Procurement friction will also be high. The 2026 market evidence reviewed here says buyers want proof, not just vision, and that hardware readiness remains a bottleneck. Sovereign programmes bring additional requirements around security, export controls, and hybrid integration. Pharma and chemistry buyers may be willing to experiment earlier, but peer examples still look pilot-heavy and use-case-specific. Put differently, Oratomic has a plausible land-and-expand map, but every visible lane today requires patient counterparties, multi-party coordination, and strong evidence of technical
    readiness. The commercial upside is real if the first lighthouse account lands; the underwriting risk is that customer concentration, long cycles, and hardware skepticism delay that moment well beyond the current funding headlines.
