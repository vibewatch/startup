- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Visible proof
  - Current use case
  - Strategic value
  - Gap
  rows:
  - - Photonics / systems integration partners
    - 'Buyer+payer: Oratomic; user: engineering and manufacturing teams; partner: Monarch Quantum'
    - Named partner and productization role are public
    - Scale optical-control subsystems and manufacturing readiness
    - Strongest direct commercialization surface today
    - Not an end-customer or recurring usage account
  - - Research and academic validators
    - 'User: founding scientists, academic collaborators, and future early-access researchers; payer undisclosed'
    - Launch materials and Caltech-linked research origin
    - Validate architecture, error correction, and cryptographic relevance
    - Scientific legitimacy for future buyer diligence
    - Validation is not the same as customer conversion
  - - Sovereign / national HPC buyers
    - 'Buyer+payer: governments, national labs, or HPC centres; user: researchers and platform teams'
    - Peer analogs include AIST, NERSC, NQCC, and Roadrunner
    - Hybrid quantum-classical infrastructure and secure experimentation
    - Most plausible path to an early marquee contract
    - No direct Oratomic sovereign programme is disclosed
  - - Pharma / chemistry R&D teams
    - 'Buyer/user: pharma R&D, quantum specialists, scientific computing groups; payer often pilot or innovation budget'
    - Peer analogs include Merck and Amgen with QuEra
    - Simulation, molecular prediction, and small-data scientific workflows
    - High-value lighthouse vertical if technical claims hold
    - No direct Oratomic case study or buyer name is public
  - - Security / cryptography programmes
    - 'Buyer: public-sector or security-sensitive organisations; user: crypto, infra, or research teams'
    - Oratomic highlights Shor-capable systems and responsible disclosure
    - Post-quantum urgency and cryptography-relevant planning
    - Strong strategic urgency if hardware matures
    - No public programme, contract, or procurement record found
  - - AI / hybrid compute programmes
    - 'Buyer/user: frontier labs, advanced research groups, and HPC operators; payer undisclosed'
    - Application language plus peer hybrid-HPC deployments
    - Quantum simulation and hybrid workloads
    - Fits the company’s stated mission and partner-led buildout
    - No public workload, benchmark, or deployment evidence
  notes: The table segments Oratomic by visible counterparties and plausible first-buyer problems because public evidence does not support segmentation by active accounts, ARR, or deployment footprint.
