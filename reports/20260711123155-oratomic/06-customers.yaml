company:
  name: Oratomic
chapter:
  number: 6
  title: Customers
  summary: 'Oratomic does not yet have public customer proof in the normal startup sense: no named end customers, cloud users, pilots, or government contracts were disclosed across the company site, launch material, or 2026 funding coverage. The strongest direct commercialization signal is the Monarch Quantum partnership, which adds productization and manufacturing depth but is still a partner relationship, not a buyer. Neutral-atom peer evidence suggests the most plausible first buyers are sovereign or HPC programmes, pharma and chemistry R&D teams, and security-sensitive research users, but those are still analogs rather than Oratomic wins. Until the company discloses at least one lighthouse deployment, active-access programme, or paid co-design account, the customer case should be underwritten as strategically credible but commercially unproven.'
sections:
- id: customer-base-segmentation
  title: Customer Base Segmentation and Current Buyer Visibility
  body: 'Oratomic cannot yet be segmented by current account count or revenue band because its public surface does not show named end customers, a public cloud access programme, or even a prototype-access motion. The honest way to segment the customer base today is by the counterparties and buyer problems that are visible. First, there is a direct commercialization layer made up of partners such as Monarch Quantum, which is explicitly responsible for photonics integration, productization, and manufacturing support. Second, there is a research-validation layer rooted in the company’s launch story, Caltech-linked science base, and security-disclosure posture. Third, there are prospective buyer groups inferred from the problems Oratomic names publicly and from how neutral-atom peers have landed early demand: sovereign or HPC centres, pharma or chemistry research teams, and security-sensitive or hybrid-compute programmes. This segmentation is more forward-looking than retrospective, but it is
    still more defensible than pretending the company already has a broad customer roster. The key takeaway is that Oratomic’s visible customer picture is really a map of likely first buyers and critical channel partners rather than proof of a live installed base.'
