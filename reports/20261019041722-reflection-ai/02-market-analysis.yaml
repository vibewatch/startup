          tone: "neutral"
        - label: "Initial enterprise land"
          displayValue: "$75k-$500k"
          unit: "annual team contract"
          note: "Derived from Sacra's $15k-$25k per user annual pricing and 5-20 engineer initial deployment range."
          tone: "neutral"
    approximationNotes: "Layers move from broad infrastructure and sovereign-demand signals down to account-level land economics; they are not a cumulative TAM/SAM/SOM bridge."
    claimRefs: ["CM005", "CM008", "CM010", "CM012", "CM014"]
