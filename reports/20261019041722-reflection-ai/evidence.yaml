evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cover-metrics-gap
    missingEvidence: Current revenue or ARR, named customer count, current headcount, and any public margin or burn disclosure.
    whyItMatters: >-
      Later commercial, financial, and valuation judgments cannot convert public ambition into operating proof without
      scale and unit-economics metrics.
    diligencePath: Request the current board deck, KPI pack, and cohort or customer summary used in the latest financing.
    relatedQuestionRefs:
      - QO006
  - type: missing-source
    severity: material
    topic: governance-gap
    missingEvidence: >-
      Current board composition, board observers, protective provisions, liquidation terms, and investor-rights details
      from the 2026 financing.
    whyItMatters: >-
      Control rights and governance protections shape downside protection, follow-on financing leverage, and founder
      dependency risk.
    diligencePath: >-
      Request the cap table, board minutes summary, financing term sheet, and investor-rights agreement for the 2026
      round.
    relatedQuestionRefs:
      - QO005
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder or investor map
    missingEvidence: A full current cap table and the complete list of material commercial or infrastructure counterparties.
    whyItMatters: >-
      The stakeholder map can identify visible investors and compute providers, but it cannot prove ownership
      concentration or hidden dependency without the full underlying records.
    diligencePath: Request a fully diluted cap table, side-letter summary, and vendor concentration schedule.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent TAM/SAM/SOM model with geography, methodology, and any defensible growth rate for secure
      open-weight coding and agentic deployments.
    whyItMatters: >-
      Without a market model, valuation has to rest on strategic narrative and account economics rather than a clearly
      bounded market opportunity.
    diligencePath: >-
      Request investor materials or third-party analyst work that isolates secure open-weight enterprise and sovereign
      deployment spend instead of general AI software demand.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-traction
    missingEvidence: Named customers, deployment counts, segment mix, and expansion data by buyer type.
    whyItMatters: >-
      Buyer maps and land-value estimates are much more credible when tied to observed customer adoption and budget
      ownership rather than positioning alone.
    diligencePath: >-
      Request customer references, cohort metrics, pipeline segmentation, and deployment case studies split across
      enterprise, government, and sovereign channels.
    relatedQuestionRefs:
      - QM003
      - QM008
    relatedTableRefs:
      - TM003
  - type: stale
    severity: minor
    topic: independent-validation
    missingEvidence: >-
      Independent post-launch benchmarks and public proof that Beam reached broad availability beyond curated early
      access.
    whyItMatters: >-
      The adoption case depends on whether the claimed efficiency and capability translate into trusted production use,
      not just launch-day positioning.
    diligencePath: >-
      Recheck third-party benchmark trackers, customer references, and public release artifacts after general
      availability.
    relatedQuestionRefs:
      - QM006
  - type: missing-source
    severity: material
    topic: benchmark-positioning
    missingEvidence: >-
      Independent third-party benchmark results for Beam versus DeepSeek, Qwen, GLM, and Kimi after public weight
      release.
    whyItMatters: >-
      Reflection's current moat depends heavily on efficiency claims that remain self-reported in the retained launch
      evidence.
    diligencePath: >-
      Collect post-release evaluations from neutral benchmark trackers or enterprise pilots that compare Beam against
      the cited Chinese open-model leaders.
    relatedQuestionRefs:
      - QP003
      - QP006
  - type: private-evidence-only
    severity: material
    topic: packaging
    missingEvidence: Public list pricing, support tiers, hosted-service terms, or named enterprise contract structure for Beam.
    whyItMatters: Buyers cannot compare total switching cost against APIs or self-hosted substitutes without real commercial terms.
    diligencePath: >-
      Obtain a current pricing sheet, partner resale terms, or customer procurement example from Reflection or a
      disclosed distributor.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: regulated-customer-proof
    missingEvidence: >-
