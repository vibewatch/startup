      - [DeepSeek family, Direct open-weight leader, "Reference point for open-weight price/performance in multiple retained sources", Developers and enterprises willing to adopt Chinese-origin weights, "Strong open-model capability and cost credibility", "Security and sovereignty concerns for sensitive Western buyers"]
      - [Qwen family, Direct open-weight leader, "Repeatedly cited as a leading Chinese open family", Broad developer and enterprise workloads, "Open availability and broad adoption momentum", "Chinese-origin trust constraint for regulated U.S. workloads"]
      - [GLM / Z.ai, Direct coding and reasoning comparator, "GLM-5.2 is the best-documented benchmark comparator in launch coverage", Buyers prioritizing coding and reasoning efficiency, "Published comparison point for Beam's efficiency claim", "Available evidence shows Beam claims lower compute but not a higher raw score"]
      - [Kimi / Moonshot, Adjacent high-capability open rival, "Cited as ahead on raw capability in Reflection's own launch framing", Buyers prioritizing best open capability over domicile, "High-capability open benchmark", "Less aligned with Reflection's U.S. sovereign positioning"]
      - ["Closed U.S. APIs (OpenAI / Anthropic / Google)", Incumbent substitute, "Top closed-model capability in retained commentary", Teams prioritizing managed frontier performance, "Fastest production path when self-hosting is not required", "API-only posture blocks full ownership on retained evidence"]
    notes: Public evidence mixes funding, compute, and packaging signals because comparable revenue and customer disclosures are not available across this set.
    claimRefs: [CP001, CP002, CP003, CP004, CP007, CP012, CP015]
  - id: TP002
    title: Feature / capability matrix
    columns:
      - Buying criterion
      - Reflection Beam
      - Chinese open-weight leaders
      - Closed U.S. API incumbents
      - Western open alternatives
    rows:
      - [Downloadable weights / self-hosting, "Yes; Apache 2.0 path with staged rollout", Yes, No, "Mixed; available but not a U.S. sovereign story"]
      - [Coding and agentic specialization, "Explicit product focus", "Strong but broader open-model mix", "Strong capability but not positioned as downloadable weights", "Mixed by model line"]
      - [Independent benchmark depth, "Limited at launch; core scores were self-reported", "Stronger market visibility from already released models", "Strong closed-model reputation but not open-weight comparable", "Partial depending on model and benchmark"]
      - [Sovereignty fit for sensitive U.S. buyers, High, "Constrained by Chinese-origin trust concerns", "Constrained by API and data-control limits", Moderate]
      - [Immediate deployability in retained October evidence, "Improving but initially waitlist-first", High, "High via API only", Medium]
    notes: Unknown or mixed cells mark where retained sources do not give a directly comparable public answer rather than implying feature parity.
    claimRefs: [CP003, CP005, CP006, CP007, CP010, CP011, CP016]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Option
      - Price / unit / contract model
      - Included capabilities
      - Unknowns / discounts
      - Implication
    rows:
      - [Reflection Beam, "No public list price; Apache 2.0 weights plus self-host infrastructure and partner-led distribution", "Coding reasoning and agentic workloads with model artifacts and open-source integrations promised", "Support tiers hosted options SLAs and enterprise discounts undisclosed", "Low structural lock-in if weights land, but procurement diligence remains unfinished"]
      - [Chinese open-weight leaders, "Downloadable weights with infrastructure cost borne by the buyer", "Current public open-model capability leaders in the retained comparison set", "Commercial support and compliance posture vary by vendor", "Best open capability today, but trust concerns can outweigh cost advantages"]
      - ["Closed U.S. APIs", "Metered API or subscription-style access", "Managed frontier capability", "No downloadable frontier weights on retained evidence", "Fastest activation path when data-sovereignty rules are loose, but lock-in is highest"]
      - [Internal build on downloaded weights, "Internal infrastructure and MLOps cost rather than a public vendor list price", "Maximum control over deployment fine-tuning and integration", "Capability and maintenance depend on chosen base model and internal team quality", "Viable substitute for buyers willing to trade convenience for ownership"]
    notes: Public sources describe packaging and deployment posture far better than realized pricing, so the comparison focuses on what buyers can actually procure and control today.
    claimRefs: [CP006, CP008, CP009, CP011, CP014, CP016]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Reflection now occupies the U.S. sovereign open-weight corner, but the strongest documented open-model capability still sits with Chinese incumbents and closed U.S. APIs retain the performance benchmark.
    data:
      xAxis:
        label: Deployment control / self-hostability
        min: 1
        max: 5
        low: Closed and vendor-controlled
        high: Downloadable and self-hostable
        description: Ordinal placement from cited packaging and deployment posture rather than a measured benchmark.
        scale: ordinal
      yAxis:
        label: Documented coding + agentic capability
        min: 1
        max: 5
        low: Limited or weakly documented
        high: Best documented performance in retained sources
        description: Ordinal placement reflects evidence breadth and disclosed benchmark context, not a unified leaderboard.
        scale: ordinal
      points:
        - label: Reflection Beam
          x: 4.8
          y: 3.4
          detail: Open-weight packaging and coding focus are explicit, but launch-day evidence was still self-reported.
        - label: DeepSeek family
          x: 5
          y: 4.8
          detail: Repeatedly cited as the open-weight benchmark and cost reference point.
        - label: Qwen family
          x: 4.9
          y: 4.5
          detail: Treated in retained sources as another leading downloadable Chinese family.
        - label: GLM-5.2
          x: 4.7
          y: 4.4
          detail: Best-documented direct comparator for Beam's efficiency claim.
        - label: Kimi K3
          x: 4.6
          y: 4.9
          detail: Reflection's own launch post says Kimi remains ahead on raw capability.
        - label: Western open alternatives
          x: 4.2
          y: 3.6
          detail: Open and usable, but not the same U.S. sovereign positioning thesis.
        - label: Closed U.S. APIs
          x: 1.4
          y: 5
          detail: Capability benchmark stays high, but self-hostability is weakest in this set.
    approximationNotes: Ordinal coordinates summarize retained evidence on deployment posture and documented capability; they are not an implied benchmark average or market-share score.
    claimRefs: [CP001, CP005, CP006, CP007, CP010, CP012, CP013, CP015]
callouts:
  - calloutType: strength
    title: Reflection now has a real lane
    body: Reflection is no longer just a funding story; Beam gives it a concrete U.S. open-weight position that neither closed U.S. APIs nor Chinese-origin open models fully replicate for regulated buyers.
    claimRefs: [CP003, CP007, CP012]
  - calloutType: risk
    title: The proof gap is still material
    body: Reflection's competitive case still depends on self-reported efficiency, sparse commercial disclosure, and a launch sequence that initially lagged the already-downloadable Chinese alternatives it wants to displace.
    claimRefs: [CP005, CP010, CP011, CP014, CP016]
  - calloutType: insight
    title: Ownership is the real pricing wedge
    body: The strongest public rationale for choosing Reflection over closed APIs is not headline model performance; it is the combination of self-hosting, auditability, and lower structural lock-in if the open-weight distribution matures.
    claimRefs: [CP006, CP008, CP009, CP016]
