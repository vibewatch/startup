  evidenceGaps:
    - type: missing-source
      severity: material
      topic: durability-gap
      missingEvidence: Signed-customer counts, active deployments, NRR, GRR, churn, renewal rates, and top-customer share.
      whyItMatters: Customer durability and concentration determine whether Reflection has a repeatable business beyond launch attention and strategic partnerships.
      diligencePath: Request a cohort bridge by product and customer segment with logos, ARR, renewal dates, and top-10 customer concentration.
      relatedQuestionRefs: [QU004, QU005, QU006]
    - type: enumeration-incomplete
      severity: material
      topic: named customer proof table
      missingEvidence: An exhaustive list of named customers or referenceable production deployments with dates, contract stage, and measurable outcomes.
      whyItMatters: The public record currently supports only a partial named-proof table, which is not enough to judge breadth or reference quality.
      diligencePath: Ask management for a customer reference list plus public-safe summaries separating partners, pilots, production accounts, and expired trials.
      relatedQuestionRefs: [QU003, QU008]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: production-status
      missingEvidence: Contract documents or reference calls that clarify whether DOE, Shinsegae, and Dell relationships are pilot, production, channel, or strategic only.
      whyItMatters: Named organizations create strong signaling value, but the relationship type determines whether the proof supports revenue durability or only market narrative.
      diligencePath: Obtain SOWs, deployment timelines, and two customer or partner reference calls covering usage, expansion, and renewal intent.
      relatedQuestionRefs: [QU002, QU003]
    - type: missing-source
      severity: material
