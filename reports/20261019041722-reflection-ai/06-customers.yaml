schemaVersion: report-v2
artifact: customers
slug: reflection-ai
runDate: 2026-10-19
company:
  name: Reflection AI
chapter:
  number: 6
  title: Customers
  summary: >-
    Reflection's public customer story is still a go-to-market narrative rather than a
    mature account base: official and independent coverage consistently targets enterprise,
    government, and developer buyers, but named proof remains limited to partners and
    program relationships such as DOE/Genesis Mission and Shinsegae. Beam only moved from
    early access to released weights in October 2026, so the public record still lacks
    customer counts, retention metrics, pricing transparency, and verified production
    outcomes.
sections:
  - id: segment-mix
    title: Segment mix points to regulated enterprise and sovereign buyers first
    body: >-
      Reflection's public materials position Beam and the surrounding deployment stack for
      enterprise coding workflows, public-sector programs, and developers rather than for
      mass-market consumer chat. The official Beam launch calls the model a workhorse for
      enterprise coding and agentic workloads, AI Engineer describes the company as building
      for developers, enterprises, and public-sector organizations, and Tech Insider says
      the pitch is aimed at enterprises, governments, and developers. That mix implies a
      buyer base led by engineering organizations, procurement teams, and regulated
      institutions that care about self-hosting, sovereignty, and control. It also means
      the likely payer is not an individual seat buyer but an organization funding
      infrastructure, model deployment, and internal developer productivity.
    claimRefs: [CU001, CU002, CU003, CU004, CU015, CU016]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Public adoption proof is launch-stage and still thin on production evidence
    body: >-
      Reflection had a shipped product before Beam, but the public progression still looks
      early. AI Engineer says Asimov launched in 2025 as a code-comprehension product,
      while Startup Fortune wrote just before Beam's debut that Asimov was the company's
      only shipped product and that Reflection still had no public model or independent
      benchmark. Beam then opened early access on October 5, 2026, and Layer3 says the
      weights went public on October 16, 2026. That sequence is meaningful because it shows
      public availability only just began during this refresh window. Layer3 also says the
      API beta was free to start while posting no per-token rates, and Startup Fortune's
      launch coverage said the benchmark claims were not independently verifiable against a
      public checkpoint until the weights landed, so procurement-grade proof still trails
      the company's capital and compute story.
    claimRefs: [CU005, CU006, CU010, CU011, CU012, CU014]
    tableRefs: [TU002]
  - id: durability-and-concentration
    title: Durability and concentration remain the central diligence gap
    body: >-
      The strongest named-organization proof in the retained sources comes from partner and
      program disclosures, not from customer cohorts or outcome-heavy case studies. Layer3
      says Reflection's own site names Dell, the U.S. Department of Energy, and Shinsegae
      Group as partners, while Sequoia says Reflection signed a memorandum with Shinsegae to
      build a 250-megawatt AI factory for Korean enterprises and agencies and partnered with
      the Department of Energy on the Genesis Mission across the 17 national labs. Those
      references show strategic relevance, but they do not establish renewal, production
      breadth, or account economics. The retained public sources do not disclose customer
      counts, NRR, GRR, churn, top-customer share, or signed-customer concentration, which
      leaves the current customer base most consistent with a sovereign-and-regulated
      enterprise thesis that could scale well but may also be concentrated, slow to close,
      and difficult to diligence without private data.
    claimRefs: [CU007, CU008, CU009, CU013, CU015]
    tableRefs: [TU003]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Use case
      - Public proof
      - Strategic value
      - Gap
    rows:
      - - Developers and model evaluators
        - Engineering users; experimentation budgets or platform teams as payers
        - Test Beam via API beta or downloaded weights for coding and agentic workloads
        - Official Beam launch plus third-party launch coverage
        - Seeds ecosystem adoption and tooling feedback
        - No public active-user, conversion, or retention data
      - - Regulated enterprises
        - CTO/CIO or platform leaders; internal engineering and compliance users
        - Self-hosted open model for enterprise coding, reasoning, and agent workflows
        - Reflection launch language and enterprise-control framing
        - Likely core monetization path for large contracts
        - No named production contract value or deployment scale
      - - Governments and national labs
        - Agency or lab buyers; researchers and technical operators as users
        - Sovereign model deployment and mission-specific model-provider programs
        - DOE Genesis Mission reference in Sequoia profile
        - High strategic validation if productionized
        - Public sources do not show contract size, rollout status, or outcomes
      - - Korean enterprises and agencies
        - Shinsegae-led infrastructure sponsors; enterprise and agency end users
        - Regional AI factory capacity serving enterprise and public-sector workloads
        - Shinsegae memorandum cited by Sequoia
        - Signals international expansion ambition
        - Memorandum is not the same as end-customer adoption proof
    notes: Public segmentation is inferred from launch language and partner disclosures; null customer counts and spend reflect non-disclosure in retained sources.
    claimRefs: [CU004, CU008, CU009, CU015, CU016]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - - Beam availability milestone
        - Early access opened at launch
        - "2026-10-05"
        - Reflection
        - High
        - Public commercialization only started this month
        - No waitlist size, trial volume, or paid-conversion data
      - - Beam distribution milestone
        - Weights public on launch page update
        - "2026-10-16"
        - Layer3 Labs
        - High
        - Lowers friction for enterprise evaluation and self-hosting
        - No download, active deployment, or customer count disclosed
      - - Prior shipped product
        - Asimov released as code-comprehension product
        - 2025 to 2026-07 public references
        - AI Engineer and Startup Fortune
        - Medium
        - Reflection had product surface before Beam
        - No customer logos, renewal data, or expansion metrics
      - - Pricing transparency
        - API beta free to start; no posted token rates
        - "2026-10-16"
        - Layer3 Labs
        - Medium
        - Eases trials but weakens revenue-model visibility
        - No pricing ladder, contract terms, or gross-margin proxy
      - - Independent validation status
        - Benchmarks not yet independently verifiable at launch
        - 2026-10
        - Startup Fortune
        - Medium
        - Buyer diligence still depends on internal evaluation
        - No external benchmark replication or production references
    notes: This table tracks public commercial milestones and missing denominators, not customer-count growth; Reflection does not disclose cohort metrics in retained sources.
    claimRefs: [CU005, CU006, CU010, CU011, CU012]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / organization
      - Segment
      - Deployment or use case
      - Production vs pilot
      - Outcome or strategic value
      - Limitation
    rows:
      - - U.S. Department of Energy / Genesis Mission
        - Public sector
        - Reflection identified as a model provider for a mission spanning 17 national labs
        - Program affiliation disclosed; production status unclear
        - Strong sovereign-reference quality if live
        - No contract value, usage data, or measured outcomes
      - - Shinsegae Group
        - Enterprise and agency infrastructure program
        - Memorandum for a 250-megawatt AI factory serving Korean enterprises and agencies
        - Memorandum rather than verified production account
        - Signals regional expansion and infrastructure demand
        - No revenue, deployment timing, or end-customer list
      - - Dell
        - Partner / channel ecosystem
        - Named partner on Reflection's own site
        - Relationship disclosed without production detail
        - Could support enterprise distribution or integration credibility
        - No published deployment, customer, or outcome proof
    notes: Named proof is partial and based on public partner or program disclosures rather than an exhaustive customer roster or audited case-study set.
    enumerationScope:
      coverage: partial
      basis: Public named-organization proof was checked against the retained official and third-party materials in this pool and only three organizations were described with enough specificity to table without inventing deployment detail.
    claimRefs: [CU007, CU008, CU009, CU013, CU015]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Reflection's visible customer path runs from developer evaluation into sovereign and regulated enterprise procurement, with expansion still gated by pricing and proof gaps.
    data:
      items:
        - label: Developer discovery
          actor: Developers
          tone: neutral
          touchpoints:
            - AI Engineer and Tech Insider frame Beam for developers as well as enterprise buyers.
            - Initial engagement is through product awareness rather than public customer references.
        - label: Controlled evaluation
          actor: Engineering teams
          tone: opportunity
          touchpoints:
            - Reflection opened early access at Beam launch.
            - Layer3 says the API beta was free to start.
        - label: Procurement and validation
          actor: Enterprise and government procurement teams
          tone: risk
          touchpoints:
            - Startup Fortune said launch benchmarks were not independently verifiable at a public checkpoint.
            - Public sources do not disclose token pricing, NRR, or signed-customer counts.
        - label: Self-hosted deployment design
          actor: Regulated enterprises and sovereign users
          tone: positive
          touchpoints:
            - Official and third-party coverage emphasize open weights, control, and sovereign deployment.
            - The likely buyer values ownership and compliance more than low-friction self-serve usage.
        - label: Public-sector reference expansion
          actor: National labs and government programs
          tone: opportunity
          touchpoints:
            - Sequoia says Reflection is a model provider for the Genesis Mission across 17 national labs.
            - This is strategic proof, but public production detail is missing.
        - label: Regional enterprise scale-up
          actor: Korean enterprises and agencies
          tone: opportunity
          touchpoints:
            - Sequoia says Reflection signed a memorandum with Shinsegae for a 250-megawatt AI factory.
            - The expansion loop remains memorandum-led rather than case-study-led.
    approximationNotes: Public journey stages are inferred from launch timing, buyer language, and named program references rather than from disclosed funnel conversion data.
    claimRefs: [CU004, CU006, CU009, CU012, CU015, CU016]
callouts:
  - calloutType: insight
    title: Buyer thesis is strategic control, not bottoms-up virality
    body: >-
      The strongest audience evidence centers on self-hosted enterprise and sovereign buyers
      that care about domestic control and regulatory posture, not on broad consumer or
      seat-based product adoption.
    claimRefs: [CU004, CU015, CU016]
  - calloutType: risk
    title: Customer quality is not yet matched by customer durability proof
    body: >-
      Public references to DOE, Shinsegae, and Dell are strategically useful, but the
      retained sources still do not show customer counts, renewals, pricing, or measured
      outcomes that would underwrite a durable commercial base.
    claimRefs: [CU007, CU008, CU009, CU012, CU013]
