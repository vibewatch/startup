callouts:
  - calloutType: "strength"
    title: "Beam is the first concrete proof that Reflection’s thesis is no longer just a recruiting story"
    body: >-
      The combination of a named model, a published architecture summary, and unusually detailed RL
      infrastructure disclosures gives Reflection a real product/technology surface for diligence,
      even if commercial proof still trails the technical narrative.
    claimRefs: ["CE001", "CE002", "CE004"]
  - calloutType: "risk"
    title: "Commercial readiness still depends on artifacts the public launch had not delivered yet"
    body: >-
      At fetch time the company was still pointing readers to future weights, a future model card,
      and future developer artifacts, while outside launch coverage said the headline benchmarks
      remained self-reported.
    claimRefs: ["CE006", "CE012"]
  - calloutType: "insight"
    title: "Public evidence skews toward control and infrastructure, not repeatable deployment proof"
    body: >-
      Reflection’s strongest external signals are around sovereign positioning, compute access, and
      policy-facing partnerships; they are not yet a substitute for visible customer adoption,
      compliance packaging, or developer-ecosystem traction.
    claimRefs: ["CE010", "CE013", "CE014"]
