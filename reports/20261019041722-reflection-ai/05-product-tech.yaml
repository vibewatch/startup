  - id: "TE003"
    title: "Technology / operating architecture table"
    columns:
      - "Layer / process / component"
      - "Role"
      - "Dependency"
      - "Risk"
    rows:
      - ["Sparse MoE base model", "Core reasoning/coding engine", "501B total parameters with 23B active per token", "Performance and efficiency remain substantially company-reported until outsiders can run the weights"]
      - ["Pretraining corpus", "Builds base capability before RL", "23.8T curated web + proprietary licensed tokens", "Dataset composition, rights boundaries, and contamination controls are not public in the assigned evidence"]
      - ["High-compute RL system", "Improves coding, reasoning, and agentic behavior", "10.5K GB300 GPUs over 4 weeks generating 100M+ rollouts", "Commercial feasibility depends on maintaining very large compute access"]
      - ["Asynchronous training / inference control plane", "Keeps rollouts, evaluation, and model updates synchronized", "Policy-version tracking, fast model updates, and replayable records", "Few independent details exist on how this stack performs outside launch disclosures"]
      - ["Safety / evaluation loop", "Checks reward integrity and launch readiness", "Independent judges, red-teaming, and ongoing evaluations", "Public model card and external safety audit artifacts were not yet available in the assigned evidence"]
    notes: >-
      All operational metrics in this table are public disclosures from Reflection’s launch
      materials unless otherwise noted; they should be treated as company-reported until an
      external evaluator can reproduce them.
    claimRefs: ["CE002", "CE003", "CE004", "CE005", "CE015"]
