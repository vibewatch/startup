runDate: "2026-10-19"
company:
  name: "Reflection AI"
chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    Reflection has finally turned its frontier-model thesis into a concrete product with Beam, a
    501B-parameter open-weight MoE aimed at coding, reasoning, and agentic workloads, but the
    public evidence still shows a launch-stage platform rather than a fully proven enterprise
    software stack. The strongest disclosures are the company’s own technical details around
    training scale, RL infrastructure, and planned artifact release; the biggest gaps are
    independent benchmark validation, public compliance/security packaging, and observable
    practitioner adoption.
sections:
  - id: "product-surface-and-workflows"
    title: "Product surface and buyer workflow"
    body: >-
      Reflection’s public product surface now has two distinct layers. The legacy wedge was Asimov,
      a code-research / code-comprehension agent positioned around understanding enterprise
      codebases and organizational memory rather than just generating snippets. The October 2026
      Beam launch adds the first publicly described foundation-model asset: an open-weight model for
      coding, reasoning, and agentic workloads that the company intends to sell into developers,
      regulated enterprises, and sovereign buyers. That is a meaningful maturity step, but the
      public stack is still asymmetric: Beam is concrete enough to discuss, while deployment
      software, downloadable artifacts, and evidence of day-to-day customer usage remain mostly
      promised rather than observable.
    claimRefs: ["CE001", "CE006", "CE008", "CE009", "CE011", "CE013"]
    tableRefs: ["TE001", "TE002"]
  - id: "architecture-and-operating-model"
    title: "Architecture and operating model"
    body: >-
      The company’s technical disclosures describe Beam as a sparse MoE base model wrapped in a
      heavy reinforcement-learning system rather than a simple post-trained wrapper on someone
      else’s API. Reflection says Beam combines 501 billion total parameters with 23 billion active
      parameters, 23.8 trillion pretraining tokens, and a four-week RL run on 10.5K NVIDIA GB300
      GPUs that generated more than 100 million rollouts. The operating model is equally important:
      Reflection describes asynchronous rollout/training coordination, policy-version tracking,
      replayable records, and independent judge checks for verifier exploits. That design supports
      the company’s core thesis that efficiency and controllable tool use, not just raw parameter
      count, are the differentiators it wants buyers to pay for.
    claimRefs: ["CE002", "CE003", "CE004", "CE005", "CE007", "CE015"]
    tableRefs: ["TE003"]
    figureRefs: ["FE001"]
  - id: "maturity-differentiation-and-risk"
    title: "Maturity, differentiation, and technical risk"
    body: >-
      Reflection’s differentiation thesis is coherent: self-hosted open weights should let large
      buyers control model behavior, protect sensitive data, and avoid the pricing power of closed
      APIs. The problem is that the proof set still lags the ambition. Independent launch coverage
      says Beam’s benchmark claims were still self-reported at release, while mid-2026 outside
      reporting described Reflection’s openness evidence as thin and the public artifact surface as
      sparse. The official newsroom also skews toward compute, policy, and government-adjacent
      milestones rather than public technical docs or reference deployments. For diligence, that
      means the product story is now real enough to underwrite technical follow-up, but not yet
      strong enough to treat maturity, security packaging, or enterprise deployment repeatability as
      proven.
    claimRefs: ["CE006", "CE010", "CE012", "CE013", "CE014"]
