  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与替代类别
        blocks:
          - type: paragraph
            body: >-
              与上一版报告相比，Reflection 如今处在更清晰的竞争赛道上：Beam 给买家提供了一个有名称的美国开放权重选项，但有充分记录的强劲对手仍是 DeepSeek、Qwen、GLM 和 Kimi
              等中国开放模型家族，以及 Mistral 等相邻的西方开放选项，另有封闭式美国前沿 API 这一持久替代方案。实际竞争格局因此横跨可下载开放权重的直接同行、优先考虑托管性能的买家所面对的封闭 API
              巨头，以及团队继续在自有基础设施中包装现有开放模型而不押注新实验室的内部自建/现状路径。Reflection 的利基不是“整体最佳模型”，而是为拒绝封闭 API
              和中国来源权重的企业及政府买家提供“可信的美国主权开放模型”。
