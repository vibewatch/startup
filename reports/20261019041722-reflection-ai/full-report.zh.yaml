  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: Reflection 可见的客户路径，从开发者评估走向主权客户和受监管企业采购，但扩张仍受定价和证据缺口限制。
    data:
      items:
        - label: 开发者发现
          actor: 开发者
          tone: neutral
          touchpoints:
            - AI Engineer 和 Tech Insider 将 Beam 定位为同时面向开发者和企业买方。
            - 初次接触来自产品认知，而不是公开客户背书。
        - label: 受控评估
          actor: 工程团队
          tone: opportunity
          touchpoints:
            - Reflection 在 Beam 发布时开放了早期访问。
            - Layer3 称，API 测试版起步时免费。
        - label: 采购与验证
          actor: 企业和政府采购团队
          tone: risk
          touchpoints:
            - Startup Fortune 称，在一个公开检查节点，发布基准尚无法独立验证。
            - 公开来源未披露 token 定价、NRR 或已签约客户数量。
        - label: 自行托管部署设计
          actor: 受监管企业和主权用户
          tone: positive
          touchpoints:
            - 官方和第三方报道都强调开放权重、控制权和主权部署。
            - 可能的买方更看重所有权与合规，而不是低摩擦的自助使用。
        - label: 公共部门参考扩张
          actor: 国家实验室和政府项目
          tone: opportunity
          touchpoints:
            - Sequoia 称，Reflection 是 Genesis Mission 覆盖 17 家国家实验室的模型提供商。
            - 这是战略性证明，但公开生产细节仍缺失。
        - label: 区域企业扩张
          actor: 韩国企业和机构
          tone: opportunity
          touchpoints:
            - Sequoia 称，Reflection 已与 Shinsegae 签署备忘录，建设 250 兆瓦 AI 工厂。
            - 扩张循环仍由备忘录推动，而不是由案例研究推动。
    approximationNotes: 公开旅程阶段是根据发布时点、买方措辞和点名的项目引用推断的，而不是来自披露的漏斗转化数据。
