      - number: '3.2'
        title: 能力、产品包装与可比性
        blocks:
          - type: paragraph
            body: >-
              Beam 显著改善了 Reflection 的竞争叙事，因为它把抽象的主权论点变成了一个真正的模型，明确聚焦编程和智能体，但不同竞争者之间的证据门槛仍不一致。Reflection 的官方材料和发布报道支持
              501B/23B MoE 架构、Apache 2.0 路径，以及 Beam 的定位主张：它的性能可与 GLM 5.2 竞争，接近 Qwen 3.8-Max，但原始能力仍落后于 Kimi
              K3。同一组证据尚未提供针对当前中国领先模型的公开、同口径第三方评分卡。这一点很关键，因为 Reflection
              要求买家放弃一个已经可用的开放生态，转而采用一个刚发布的模型，而其最强差异化是效率和可部署性，而不是已有记录的基准领先。
