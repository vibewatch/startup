      - number: '8.3'
        title: 情景、退出与最终尽调
        blocks:
          - type: paragraph
            body: >-
              根据指定证据，能够支撑的估值方法是参考点法，而不是收入倍数或贴现现金流。公开记录给出一个已确认的融资估值、一个存在争议的更高融资叙事，以及一个基准主张仍需独立验证的初始产品发布。因此，乐观情景不是抽象地说“Reflection
              是一家优秀的 AI 公司”，而是由美国控制的开放权重模型变得足够重要，让政府和受监管企业愿意为大规模部署付费。悲观情景是 Beam
              仍只是一个技术上有趣的发布，而定价、客户和条款继续不透明，使任何新投资人暴露于倍数压缩或偏好权重很高的融资之下。在这些缺口补齐之前，审慎的退出姿态是等待更清晰的轮次条款和采用证据，而不是硬算目标回报率。
