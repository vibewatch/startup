  - id: TV002
    title: 正 / 反论点表
    columns:
      - 观察角度
      - 支持的观点
      - 哪些事实会改变观点
    rows:
      - - 战略定位
        - 由美国控制的开放权重模型，可能对不想依赖中国模型或封闭模型的受监管及主权买方有价值。
        - 具名部署、采购胜出或已披露的续约行为，会把这套论点从叙事变成证据。
      - - 产品证明
        - Beam 给 Reflection 带来了真正的发布成果，而不再只是产品发布前的承诺。
        - 独立基准复现与使用数据将显示这次发布是否具有商业意义。
      - - 资本与计算
        - Nvidia 的支持加上多年计算预留，可能形成坚实的供给侧壁垒。
        - 如果计算义务跑在变现前面，或需要结构化纾困融资，论点就会转弱。
      - - 商业化
        - 公开披露仍更多强调融资、基础设施与模型主张，而不是客户经济性。
        - 已披露的收入质量、利润率与标杆客户，将为更窄的估值区间提供依据。
    notes: 本表区分叙事强度与投资判断强度；后者仍取决于指定来源池中尚未公开的证据。
