    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与产品论点
        blocks:
          - type: paragraph
            body: >-
              Reflection 的自有材料把公司定位在“开放智能”上，而不是单一 API 产品。在指定证据池中，官网称 Reflection 为企业、政府和主权实体构建 AI
              系统，并将这一使命与开放权重模型、开源软件、包括私有云和气隙部署在内的基础设施选择，以及帮助客户落地应用的前置部署团队结合起来。第三方报道则把这一运营模式与创始人围绕自主编程、推理和智能体工作负载的理念联系起来。由此形成的身份不只是“又一家模型实验室”：它是一个垂直打包的开放模型供应商，试图向不愿依赖封闭模型房东的组织出售控制权、可审计性和部署灵活性。公开地点证据比产品叙事更薄弱；指定证据池中的第三方摘要支持其“总部位于纽约”的身份，但池中的官网没有发布总部信息。
