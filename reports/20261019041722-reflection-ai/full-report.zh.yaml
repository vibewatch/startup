        title: 单位经济性代理指标与局限
        blocks:
          - type: paragraph
            body: >-
              公开的单位经济性证据主要是代理证据。Reflection 的 Beam 官方文章称，该模型在高级推理上可以匹敌 GLM-5.2，同时所需推理算力少 3-4x；外部报道反复强调这一效率叙事，因为更低的 token
              成本应有助于企业毛利率。这一方向是有帮助的，但仍是公司主导的主张，等待更广泛的第三方验证，而且没有回答最重要的投资判断问题：客户实际支付多少，自托管交易配套多少支持或部署人力，算力成本是转嫁给客户还是打包在价格中，以及企业或政府销售周期有多长。换句话说，Reflection
              的公开材料说明了产品为什么可能有较好的变现能力，却没有说明它是否已经做到。
