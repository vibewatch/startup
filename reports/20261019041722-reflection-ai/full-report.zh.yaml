  - id: FV001
    title: 建议逻辑
    type: flow
    summary: Beam 改善了产品证据点，但融资和商业化证据仍未解决，建议维持跟踪。
    data:
      nodes:
        - id: n1
          label: 已确认的资本基础
          detail: October 2025 以 $8B 估值融资 $2B。
        - id: n2
          label: 首个产品发布
          detail: Beam 为 Reflection 带来了一款已发布的开放权重模型，并提出了明确的效率逻辑。
        - id: n3
          label: 战略需求叙事
          detail: 该推介面向希望获得美国控制的开放模型的政府和受监管企业。
        - id: n4
          label: 验证缺口
          detail: 发布基准和效率主张仍在等待独立验证，也在等待更广泛的公开权重。
        - id: n5
          label: 资本结构压力
          detail: 据报道的融资跃升和多年算力义务，可能快于已披露的商业化证据。
        - id: n6
          label: 建议
          detail: 在融资条款和客户采用情况更加清晰前，维持跟踪；当前风险高，估值立场昂贵。
      edges:
        - from: n1
          to: n2
        - from: n2
          to: n3
        - from: n3
          to: n4
        - from: n4
          to: n5
        - from: n5
          to: n6
    approximationNotes: 这条流程是逻辑性的而非量化的，因为指定的公开证据不足以支持精确的回报模型。
