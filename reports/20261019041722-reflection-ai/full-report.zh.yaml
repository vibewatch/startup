  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - Beam 的效率主张得到第三方验证；受监管企业与主权买方转化为具名部署；2026 年估值上调轮次以干净条款完成。
        - 由于公司将拥有稀缺且有战略需求的美国开放权重资产，价值可以达到或超过报道中的约 $25B 融资叙事。
        - 执行延期、地缘政治降温，或竞争对手缩小效率差距。
        - 需要已披露的客户证明与独立基准支持。
      - - 基准
        - Beam 发布确实落地，但商业化仍处早期；公开证据仍围绕融资与计算，而非经济性。
        - 仅将报道中的 $20B-$25B 区间作为目标参考带，而不是由基本面确认的公允价值。
        - 该轮融资的定价可能跑在证明之前，几乎没有容错空间。
        - 与当前公开记录最为吻合。
      - - 悲观
        - 存疑的 2026 年融资难以完成，或带着很重的优先条款完成；计算支出上升的同时，产品采用仍未得到证明。
        - 估值可能回落至最近确认的融资锚点，而不是更高的报道估值。
        - 下轮融资、倍数压缩或资本结构包袱。
        - 若条款、客户与软件经济性持续不透明，就可能出现这一结果。
    notes: 情景表述有意保持定性，因为指定公开证据没有披露构建可靠现金流或收入倍数模型所需的 KPI。
