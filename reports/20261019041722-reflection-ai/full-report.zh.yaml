  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              相关市场边界比抽象意义上的“前沿 AI”更窄。Reflection 自己的 Beam 发布材料把产品定位在编程、推理和智能体工作负载上；第三方报道及早期公司产品描述则显示，公司正从 Asimov
              式代码理解软件走向开放权重模型授权和部署，服务于希望掌握运营控制权的企业、政府和开发者。因此，纳入的支出是开发者生产力、自托管智能体部署、后训练和安全模型运营，而不是大众聊天机器人订阅或通用 API
              转售。真正的替代品不只是其他模型实验室，还包括封闭 API 供应商、DeepSeek、Qwen 和 GLM 等中国开放权重模型家族，以及受监管组织内部依赖大量人工的软件工程现状。
