      - number: '3.3'
        title: 买方取舍、切换成本与分发能力
        blocks:
          - type: paragraph
            body: >-
              核心购买取舍是所有权与便利性的对立。保留的来源一致认为，封闭式美国 API
              是获得前沿性能最容易的路径，却最不利于自托管、可审计性和锁定控制；中国开放权重仍是公开可下载的最强替代品，但会给敏感的西方工作负载带来信任和主权摩擦。Reflection
              的方案处于两者之间：开放权重、美国注册地、编程重点和合作伙伴主导的分发。这通过让客户能够自托管和微调，而不是永久租用按量计费的
              API，降低了一种切换成本，但并没有消除执行风险。买家仍需要明确支持、托管选项、集成条款，以及 Beam 的发布包装能否成熟为可重复的采购流程。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
              - CP016
