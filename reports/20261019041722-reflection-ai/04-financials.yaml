company:
  name: Reflection AI
chapter:
  number: 4
  title: Financials
  summary: Reflection AI's public financial story is still dominated by capital formation rather than disclosed operating results. Management and partner sources describe a revenue model built around enterprise and sovereign ownership of open-weight models, but the public record still lacks verified pricing, ARR, gross margin, burn, and customer-retention data while reported compute commitments already run into the billions.
sections:
  - id: revenue-model-and-public-traction
    title: Revenue model and public traction
    body: >-
      Reflection is not pitching a broad consumer subscription business. The public commercial
      narrative instead centers on selling control: TechCrunch reported that researchers would be
      able to use the models freely while revenue should come from large enterprises and
      governments building sovereign AI systems, and Sequoia's profile frames ownership,
      self-hosting, and predictable economics as the core buyer benefit rather than a seat-based
      SaaS motion. That positioning is strategically coherent for regulated buyers, but the proof
      remains thin. Public sources still do not show executed pricing tiers, customer count, ACV,
      or renewals. The one public revenue datapoint in this pool is a Medium post citing GetLatka
      at roughly $4.6 million of 2025 revenue and explicitly warning that the figure should be
      treated cautiously.
    claimRefs: [CI001, CI002, CI003, CI005, CI011]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: capital-intensity-and-cost-structure
    title: Capital intensity and cost structure
    body: >-
      The clearest public financial evidence is on the cost side. Reflection's October 2025
      financing put $2 billion into the company at an $8 billion valuation, and 2026 coverage
      says the company later pursued financing above a $20 billion valuation or around a $25
      billion pre-money mark. More important for underwriting, multiple 2026 articles describe a
      Nebius commitment above $1 billion through 2029 plus a SpaceX-related compute agreement that
      could total $6.3 billion. The company also says Beam's training required 23.8 trillion
      tokens and a four-week reinforcement-learning run on 10.5 thousand GB300 GPUs. Even if
      those contracts are usage-based rather than fully prepaid, they show a business model whose
      near-term economics depend on very large infrastructure reservation decisions before public
      revenue proof is available.
    claimRefs: [CI001, CI006, CI007, CI008, CI012, CI013]
    tableRefs: [TI003]
  - id: unit-economics-proxies-and-limitations
    title: Unit-economics proxies and limitations
    body: >-
      Public unit-economics evidence is mostly proxy evidence. Reflection's official Beam post
      says the model can match GLM-5.2 on advanced reasoning while using 3-4x less inference
      compute, and outside coverage repeats that efficiency framing because lower token cost
      should matter to enterprise gross margin. That is directionally helpful, but it is still a
      company-led claim pending broader third-party validation, and it does not answer the
      underwriting questions that matter most: what customers actually pay, how much support or
      deployment labor accompanies self-hosted deals, whether compute is passed through or
      bundled, and how long enterprise or government sales cycles run. Put differently,
      Reflection's public materials describe why the product could monetize well, but not whether
      it already does.
    claimRefs: [CI002, CI009, CI010, CI011, CI012, CI014]
  - id: financial-verdict
    title: Financial verdict
    body: >-
      The financial verdict is that Reflection looks like a frontier-AI capital project with a
      plausible monetization thesis but insufficient public evidence for conventional software
      underwriting. The company has assembled exceptional financing momentum and can articulate
      why banks, regulated enterprises, and sovereign buyers might prefer open-weight ownership to
      rented API access. At the same time, the public record still lacks verified realized
      pricing, revenue mix, margins, burn, and runway, while the disclosed compute scale implies
      a cost base that can outrun early commercial proof. For diligence, the key question is not
      whether Reflection can raise money again; it is whether Beam and related enterprise
      deployments convert into contracted revenue quickly enough to support those infrastructure
      commitments without another step-function financing round.
    claimRefs: [CI002, CI006, CI007, CI009, CI010, CI012, CI013, CI014]
