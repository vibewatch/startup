  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: realized-pricing
      missingEvidence: Realized enterprise and government pricing, contract length, minimum commitments, and support attach rates.
      whyItMatters: Monetization quality cannot be underwritten from ownership rhetoric alone; contract structure drives revenue durability and gross margin.
      diligencePath: Request current pricing schedules, executed order forms, and a cohort view of contract values and renewal mechanics.
      relatedQuestionRefs: [QI001, QI003, QI009]
      relatedTableRefs: [TI001, TI002]
    - type: private-evidence-only
      severity: material
      topic: unit-economics
      missingEvidence: Gross margin, hosting versus self-hosted cost split, CAC, payback period, and customer retention metrics.
      whyItMatters: Efficiency claims only matter if they survive actual deployment support costs and customer-acquisition economics.
      diligencePath: Request monthly gross margin by product, CAC and payback analysis, and logo plus dollar retention by cohort.
      relatedQuestionRefs: [QI004, QI009]
      relatedTableRefs: [TI003]
    - type: private-evidence-only
      severity: material
      topic: runway
      missingEvidence: Cash balance, monthly burn, payment schedule for compute reservations, and any debt or covenant obligations.
      whyItMatters: Reported compute commitments suggest a large fixed-cost base, but runway cannot be assessed without cash and liability detail.
      diligencePath: Obtain the latest cash bridge, board package, contract payment schedule, and financing plan through 2027.
      relatedQuestionRefs: [QI006, QI008, QI009]
      relatedTableRefs: [TI003]
    - type: missing-source
      severity: minor
      topic: customer-proof
