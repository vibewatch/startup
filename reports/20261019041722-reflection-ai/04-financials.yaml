      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - ["Open-weight enterprise deployments", "Paid self-hosted model deployments and support", "Enterprise contract", "Commercial intent is public; realized pricing is not", "Strategic logic is clear but booked revenue is not disclosed", "Share signed contracts, ACV, gross margin, and renewal structure"]
      - ["Government / sovereign AI systems", "Customized deployments on customer-controlled infrastructure", "Program / deployment", "Management names governments as target payers but not contract values", "Potentially large contracts but procurement timing and obligations are opaque", "Provide signed contracts, payment timing, and delivery milestones"]
      - ["Developer / researcher access", "Free or waitlisted model access feeding later enterprise demand", "Download / access program", "Company says researchers can use the models freely", "Good adoption wedge but weak direct revenue proof", "Show conversion from developer adoption into paid enterprise usage"]
      - ["Autonomous coding / agentic software", "Asimov or related code-comprehension tooling for developers", "Contract / seat unknown", "Public description exists but no customer count or revenue split is disclosed", "Current shipped-product proof is weaker than valuation momentum", "Provide product revenue split, active users, and churn or retention"]
    notes: Public evidence distinguishes commercial intent from booked revenue; null or undisclosed economics should be treated as diligence asks rather than zeros.
    claimRefs: [CI002, CI003, CI005, CI010, CI011, CI014]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer / signal
      - Price / unit / contract
      - List vs realized
      - Discounts / unknowns
      - Source
    rows:
      - ["Beam weights and artifacts", "No public price disclosed; waitlist first and Apache 2.0 release promised later", "Public evidence covers availability not paid pricing", "No public API rate card or enterprise minimum commitment", "Reflection blog; Tech-Insider"]
      - ["Enterprise deployments", "Revenue expected from large enterprises building on Reflection models", "Realized pricing unknown", "Unknown ACV, term length, support mix, and infra pass-through", "TechCrunch; Sequoia"]
      - ["Government / sovereign AI deployments", "Revenue expected from governments developing sovereign AI systems", "Realized pricing unknown", "Unknown procurement cycle, compliance cost, and payment timing", "TechCrunch; Sequoia"]
      - ["Efficiency-led economic pitch", "Company claims Beam uses 3-4x less inference compute than GLM-5.2", "Economic positioning rather than published price", "Independent validation remained pending at launch", "Reflection blog; Startup Fortune; Tech-Insider"]
    notes: This table separates monetization claims from actual list or realized pricing, which remain largely undisclosed in the public record.
    claimRefs: [CI002, CI009, CI010, CI011]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value / public proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - ["Revenue / ARR", "~$4.6M 2025 revenue cited by Medium from GetLatka; ARR not disclosed", "Low", "Needed to test whether valuation rests on shipped revenue or mainly frontier optionality", "Provide monthly revenue, ARR, and product or customer mix"]
      - ["Gross margin / inference margin", "No public gross margin; Beam claims 3-4x lower inference compute than GLM-5.2", "Low-to-medium", "Margin depends on GPU cost, support burden, and self-hosted deployment mix", "Provide hosted versus self-hosted gross margin and cost per workload"]
      - ["Cash burn / runway", "No public burn or cash balance; public evidence instead shows multibillion-dollar compute commitments and a fresh-capital push", "Medium", "Runway determines whether the roadmap requires another large round before commercial proof", "Provide cash, burn, capex or prepayment schedule, and covenant detail"]
      - ["Sales efficiency / payback", "No CAC, payback, sales-cycle, or retention data disclosed", "Low", "Enterprise and government motions can be efficient or very long-cycle depending on procurement", "Provide CAC payback win rates and expansion or renewal data"]
      - ["Compute capacity / capex proxy", "23.8T pretraining tokens; 10.5K GPUs for four RL weeks; >$7B reported Nebius and SpaceX commitments", "Medium", "This is the strongest public proxy for cost intensity and capacity planning", "Break out reserved capacity payment schedule utilization assumptions and debt exposure"]
    notes: Public proxies are not substitutes for disclosed unit economics; undisclosed metrics remain open diligence items rather than negative evidence.
    claimRefs: [CI005, CI007, CI009, CI012, CI013]
figures:
  - id: FI001
    title: Public revenue model bridge
    type: flow
    summary: The public bridge runs from free or open access into enterprise and sovereign ownership economics, with compute efficiency and infrastructure commitments determining whether revenue becomes gross profit.
    data:
      nodes:
        - label: Open weights / early access
          value: Waitlist first, weights and artifacts promised later
          note: Researchers can use the models freely; direct public pricing is absent.
        - label: Enterprise ownership demand
          value: Self-hosting, control, customization
          note: Large enterprises are the clearest named commercial target in public sources.
        - label: Government / sovereign demand
          value: Domestic or controlled AI deployments
          note: Governments are named as a paying category but contract values are not public.
        - label: Compute-efficient inference claim
          value: 3-4x less compute versus GLM-5.2
          note: Helpful for margin if validated, but still led by company disclosures.
        - label: Revenue realization
          value: Contract value undisclosed
          note: No public ACV, usage price, or support attach rate is disclosed.
        - label: Gross profit and runway
          value: Depends on GPU commitments and service cost
          note: Compute contracts and training scale imply a high fixed-cost base before public revenue proof.
    approximationNotes: This figure is a source-backed commercial logic chain, not a quantified revenue forecast.
    claimRefs: [CI002, CI007, CI009, CI010, CI011, CI012]
callouts:
  - calloutType: risk
    title: Capital need still outruns public proof
    body: Public evidence supports large financing and compute access, but it still does not show the revenue, margin, or runway data needed to underwrite those commitments conventionally.
    claimRefs: [CI006, CI007, CI012, CI013]
  - calloutType: insight
    title: Reflection is selling ownership, not just model access
    body: The business case is strongest where customers value control of model weights, infrastructure, and data enough to justify large bespoke contracts rather than commodity API spend.
    claimRefs: [CI002, CI011]
