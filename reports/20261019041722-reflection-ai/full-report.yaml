chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and product thesis
        blocks:
          - type: paragraph
            body: >-
              Reflection's own materials position the company around "open intelligence" rather than a single API
              product. In the assigned pool, the official site says Reflection builds AI systems for enterprises,
              governments, and sovereign entities, then pairs that mission with open-weight models, open-source
              software, infrastructure choices that include private cloud and air-gapped deployment, and a
              forward-deployed team that helps customers implement applications. Third-party coverage ties that
              operating model to a founder thesis around autonomous coding, reasoning, and agentic workloads. The
              resulting identity is not just "another model lab": it is a vertically packaged open-model vendor trying
              to sell control, auditability, and deployment flexibility to organizations that do not want to depend on a
              closed-model landlord. Public location evidence is thinner than the product story; the assigned pool
              supports a New York-based identity via third-party summaries, but the official site in this pool does not
              publish a headquarters line. 
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO010
