          - type: figure
            figureRef: FU001
            claimRefs:
              - CU004
              - CU006
              - CU009
              - CU012
              - CU015
              - CU016
      - number: '6.2'
        title: Public adoption proof is launch-stage and still thin on production evidence
        blocks:
          - type: paragraph
            body: >-
              Reflection had a shipped product before Beam, but the public progression still looks early. AI Engineer
              says Asimov launched in 2025 as a code-comprehension product, while Startup Fortune wrote just before
              Beam's debut that Asimov was the company's only shipped product and that Reflection still had no public
              model or independent benchmark. Beam then opened early access on October 5, 2026, and Layer3 says the
              weights went public on October 16, 2026. That sequence is meaningful because it shows public availability
              only just began during this refresh window. Layer3 also says the API beta was free to start while posting
              no per-token rates, and Startup Fortune's launch coverage said the benchmark claims were not independently
              verifiable against a public checkpoint until the weights landed, so procurement-grade proof still trails
              the company's capital and compute story.
            claimRefs:
              - CU005
              - CU006
              - CU010
              - CU011
              - CU012
              - CU014
          - type: table
            tableRef: TU002
            claimRefs:
