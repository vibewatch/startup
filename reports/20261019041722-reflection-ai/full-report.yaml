figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      The public record shows unusually fast progression from founding to multi-billion-dollar capitalization and a
      first open-weight launch, but key commercialization details still lag the financing curve.
    data:
      items:
        - date: Mar 2024
          label: Founded by two ex-DeepMind researchers
          detail: Public coverage says Misha Laskin and Ioannis Antonoglou formed Reflection in March 2024.
          tone: positive
          claimRefs:
            - CO003
        - date: Mar 2025
          label: Stealth exit and first disclosed funding
          detail: Medium summary says Reflection emerged publicly with $130M across a $25M seed and $105M Series A.
          tone: positive
          claimRefs:
            - CO006
        - date: Apr 3, 2025
          label: Investor narrative becomes public
          detail: >-
            Sequoia publishes a founder profile that frames Reflection as an open frontier-model bet rather than a thin
            application layer.
          tone: neutral
          claimRefs:
            - CO003
            - CO015
        - date: Oct 2025
          label: Series B step-change
          detail: >-
            Public reporting says Reflection raised $2B at an $8B valuation with Nvidia and existing investors
            participating.
          tone: positive
          claimRefs:
            - CO007
        - date: Apr 23, 2026
          label: Pre-money valuation resets higher
          detail: >-
            Startup Fortune says Misha Laskin described a newly closed financing at a $25B pre-money valuation, but the
            assigned evidence does not disclose round size or rights.
          tone: warning
          claimRefs:
            - CO008
        - date: Jul 1, 2026
          label: Large compute obligations begin
          detail: Coverage says Reflection's SpaceX Colossus 2 payments start in July under a contract that could total $6.3B.
          tone: warning
          claimRefs:
            - CO012
        - date: Oct 5, 2026
          label: Beam is announced
          detail: Reflection introduces Beam as its first open-weight model for coding, reasoning, and agentic workloads.
          tone: positive
          claimRefs:
