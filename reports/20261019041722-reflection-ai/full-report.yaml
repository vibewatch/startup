              - CI013
      - number: '4.3'
        title: Unit-economics proxies and limitations
        blocks:
          - type: paragraph
            body: >-
              Public unit-economics evidence is mostly proxy evidence. Reflection's official Beam post says the model
              can match GLM-5.2 on advanced reasoning while using 3-4x less inference compute, and outside coverage
              repeats that efficiency framing because lower token cost should matter to enterprise gross margin. That is
              directionally helpful, but it is still a company-led claim pending broader third-party validation, and it
              does not answer the underwriting questions that matter most: what customers actually pay, how much support
              or deployment labor accompanies self-hosted deals, whether compute is passed through or bundled, and how
              long enterprise or government sales cycles run. Put differently, Reflection's public materials describe
              why the product could monetize well, but not whether it already does.
            claimRefs:
              - CI002
              - CI009
              - CI010
              - CI011
              - CI012
              - CI014
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is that Reflection looks like a frontier-AI capital project with a plausible
              monetization thesis but insufficient public evidence for conventional software underwriting. The company
              has assembled exceptional financing momentum and can articulate why banks, regulated enterprises, and
              sovereign buyers might prefer open-weight ownership to rented API access. At the same time, the public
              record still lacks verified realized pricing, revenue mix, margins, burn, and runway, while the disclosed
              compute scale implies a cost base that can outrun early commercial proof. For diligence, the key question
              is not whether Reflection can raise money again; it is whether Beam and related enterprise deployments
              convert into contracted revenue quickly enough to support those infrastructure commitments without another
              step-function financing round.
            claimRefs:
              - CI002
              - CI006
              - CI007
              - CI009
              - CI010
              - CI012
              - CI013
              - CI014
