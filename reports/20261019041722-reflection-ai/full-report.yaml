              - CU006
              - CU010
              - CU011
              - CU012
      - number: '6.3'
        title: Durability and concentration remain the central diligence gap
        blocks:
          - type: paragraph
            body: >-
              The strongest named-organization proof in the retained sources comes from partner and program disclosures,
              not from customer cohorts or outcome-heavy case studies. Layer3 says Reflection's own site names Dell, the
              U.S. Department of Energy, and Shinsegae Group as partners, while Sequoia says Reflection signed a
              memorandum with Shinsegae to build a 250-megawatt AI factory for Korean enterprises and agencies and
              partnered with the Department of Energy on the Genesis Mission across the 17 national labs. Those
              references show strategic relevance, but they do not establish renewal, production breadth, or account
              economics. The retained public sources do not disclose customer counts, NRR, GRR, churn, top-customer
              share, or signed-customer concentration, which leaves the current customer base most consistent with a
              sovereign-and-regulated enterprise thesis that could scale well but may also be concentrated, slow to
              close, and difficult to diligence without private data.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU013
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
