              - CU015
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Buyer thesis is strategic control, not bottoms-up virality
            body: >-
              The strongest audience evidence centers on self-hosted enterprise and sovereign buyers that care about
              domestic control and regulatory posture, not on broad consumer or seat-based product adoption.
            calloutType: insight
            claimRefs:
              - CU004
              - CU015
              - CU016
          - type: callout
            title: Customer quality is not yet matched by customer durability proof
            body: >-
              Public references to DOE, Shinsegae, and Dell are strategically useful, but the retained sources still do
              not show customer counts, renewals, pricing, or measured outcomes that would underwrite a durable
              commercial base.
            calloutType: risk
            claimRefs:
