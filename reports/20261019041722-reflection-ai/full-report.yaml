  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market boundary is narrower than "frontier AI" in the abstract. Reflection's own Beam launch
              materials frame the product around coding, reasoning, and agentic workloads, while third-party coverage
              and earlier company-product descriptions show a path from Asimov-style code-comprehension software into
              open-weight model licensing and deployment for enterprises, governments, and developers that want
              operational control. That means the included spend is developer productivity, self-hosted agent
              deployments, post-training, and secure model operations rather than mass-market chatbot subscriptions or
              generic API resale. The meaningful substitutes are not just other model labs; they include closed API
              vendors, Chinese open-weight families such as DeepSeek, Qwen, and GLM, and the status quo of human-heavy
              software engineering workflows inside regulated organizations.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM007
              - CM013
              - CM014
      - number: '2.2'
        title: Sizing has to rely on constrained lenses
        blocks:
          - type: paragraph
            body: >-
              The public record does not disclose a defensible independent TAM/SAM/SOM for Reflection's served market,
              so the chapter relies on narrower lenses that can actually be supported. At the account level, Sacra
              describes enterprise pricing as $15,000-$25,000 per user annually with first deployments of 5-20
              engineers, which implies a relatively high-value but trust-dependent initial land motion. At the
              infrastructure level, Reflection and its backers are positioning the company as a domestic open-weight
              alternative for buyers that care about sovereignty, with reported multi-year compute commitments above $7
              billion and a Korean AI-factory memorandum. The result is a market thesis built on large account economics
              and strategic infrastructure demand, not on a broad public seat or consumption estimate that can be
              independently verified today.
            claimRefs:
              - CM005
              - CM008
              - CM009
              - CM010
              - CM012
              - CM014
