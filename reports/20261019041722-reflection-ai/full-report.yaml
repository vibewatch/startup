      - number: '3.3'
        title: Buyer tradeoffs, switching costs, and distribution power
        blocks:
          - type: paragraph
            body: >-
              The central buying tradeoff is ownership versus convenience. Retained sources consistently frame closed
              U.S. APIs as the easiest path to frontier performance but the worst path for self-hosting, auditability,
              and lock-in control, while Chinese open weights remain the strongest public downloadable alternatives but
              create trust and sovereignty friction for sensitive Western workloads. Reflection's pitch sits in the
              middle: open weights, U.S. domicile, coding emphasis, and partner-led distribution. That reduces one form
              of switching cost because customers can self-host and fine-tune instead of renting a permanently metered
              API, but it does not eliminate execution risk. Buyers still need clarity on support, hosted options,
              integration terms, and whether Beam's launch packaging matures into a repeatable procurement motion.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP011
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP008
              - CP009
              - CP011
              - CP014
              - CP016
      - number: '3.4'
        title: Durability, commoditization risk, and the adverse view
        blocks:
          - type: paragraph
            body: >-
              Reflection's moat is plausible but not yet durable. The strongest bullish case is that it may be the only
              U.S.-based open-weights frontier lab with this funding and compute profile, which matters if governments
              and regulated enterprises want a domestic alternative they can actually own. The adverse view is equally
              clear in the retained sources: Chinese open models already set the public pace, Beam's headline efficiency
              numbers were still self-reported at launch, and even sympathetic coverage warns that the practical choice
              for teams needing something downloadable immediately was still Qwen or DeepSeek. That means Reflection is
              differentiated today by positioning and potential supply access more than by a locked-in product lead, so
              commoditization and incumbent response remain live risks rather than edge cases.
            claimRefs:
              - CP005
              - CP010
              - CP012
              - CP013
              - CP014
