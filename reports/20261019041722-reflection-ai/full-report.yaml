        title: Leadership, governance, and key-person risk
        blocks:
          - type: paragraph
            body: >-
              Publicly named leadership in the assigned evidence is still overwhelmingly founder-centric. Sequoia's
              profile and multiple third-party summaries identify Misha Laskin as CEO and Ioannis Antonoglou as
              president and CTO, with both founders carrying Google DeepMind pedigrees and Antonoglou repeatedly linked
              to AlphaGo. That matters because Reflection's public differentiation depends heavily on frontier
              reinforcement-learning credibility and founder narrative rather than on a broad, publicly documented
              management bench. The same source set does not identify a current board slate, independent directors, or
              the governance and investor-rights package that accompanied the 2026 financing. For diligence purposes,
              that leaves meaningful key-person dependency on the two founders and a governance disclosure gap that
              later chapters will need to treat as unresolved rather than assumed away.
