  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and alternative classes
        blocks:
          - type: paragraph
            body: >-
              Reflection now competes in a clearer lane than it did in the prior report: Beam gives buyers a named U.S.
              open-weight option, but the strongest documented rivals remain Chinese open-model families such as
              DeepSeek, Qwen, GLM, and Kimi, plus adjacent Western open options like Mistral and the enduring substitute
              of closed U.S. frontier APIs. The practical landscape therefore spans direct peers in downloadable open
              weights, incumbent closed APIs for buyers who prioritize raw managed performance, and an
              internal-build/status-quo path where teams keep wrapping existing open models inside their own
              infrastructure instead of betting on a new lab. Reflection's niche is not "best model overall"; it is
              "credible U.S. sovereign open model" for enterprises and government buyers that reject both closed APIs
              and Chinese-origin weights.
