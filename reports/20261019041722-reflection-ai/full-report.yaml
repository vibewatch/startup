      - number: '4.2'
        title: Capital intensity and cost structure
        blocks:
          - type: paragraph
            body: >-
              The clearest public financial evidence is on the cost side. Reflection's October 2025 financing put $2
              billion into the company at an $8 billion valuation, and 2026 coverage says the company later pursued
              financing above a $20 billion valuation or around a $25 billion pre-money mark. More important for
              underwriting, multiple 2026 articles describe a Nebius commitment above $1 billion through 2029 plus a
              SpaceX-related compute agreement that could total $6.3 billion. The company also says Beam's training
              required 23.8 trillion tokens and a four-week reinforcement-learning run on 10.5 thousand GB300 GPUs. Even
              if those contracts are usage-based rather than fully prepaid, they show a business model whose near-term
              economics depend on very large infrastructure reservation decisions before public revenue proof is
              available.
            claimRefs:
              - CI001
              - CI006
