        title: Exhibits
        blocks:
          - type: callout
            title: The investable market is narrower, but potentially higher value per account
            body: >-
              Reflection's public thesis points to fewer, larger, trust-heavy accounts that care about ownership,
              sovereignty, and secure deployment, rather than a broad seat-volume market.
            calloutType: insight
            claimRefs:
