  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Capital commitments outrun public commercialization proof
        blocks:
          - type: paragraph
            body: >-
              The sharpest underwriting risk is not that Reflection lacks ambition; it is that the company has already
              disclosed multi-year compute obligations and sovereign-scale infrastructure relationships before the
              public record shows broad customer proof, independent benchmark validation, or durable software revenue.
              Turing Post's March 2026 critique centered on the company still not having released its frontier
              open-weight model and on monetization questions, while October 2026 coverage shows Beam finally launched
              but with weights, model card, and broader third-party testing still pending at announcement. That leaves
              investors underwriting a capital-intensive infrastructure build against a demand thesis that still leans
              heavily on future regulated-enterprise and government adoption rather than on disclosed production
              deployments.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR008
              - CR009
              - CR011
              - CR014
              - CR016
          - type: table
