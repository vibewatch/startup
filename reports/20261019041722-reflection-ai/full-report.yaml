  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and buyer workflow
        blocks:
          - type: paragraph
            body: >-
              Reflection’s public product surface now has two distinct layers. The legacy wedge was Asimov, a
              code-research / code-comprehension agent positioned around understanding enterprise codebases and
              organizational memory rather than just generating snippets. The October 2026 Beam launch adds the first
              publicly described foundation-model asset: an open-weight model for coding, reasoning, and agentic
              workloads that the company intends to sell into developers, regulated enterprises, and sovereign buyers.
              That is a meaningful maturity step, but the public stack is still asymmetric: Beam is concrete enough to
              discuss, while deployment software, downloadable artifacts, and evidence of day-to-day customer usage
              remain mostly promised rather than observable.
            claimRefs:
