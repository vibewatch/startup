        title: Capitalization, scale signals, and milestones
        blocks:
          - type: paragraph
            body: >-
              The assigned pool clearly supports a rapid financing staircase, but not a clean read on current operating
              scale. Public reporting says Reflection emerged from stealth in March 2025 with $130 million raised, then
              added a reported $2 billion round in October 2025 at an $8 billion valuation. By April 2026, Misha Laskin
