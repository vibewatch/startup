      - number: '3.2'
        title: Capability, packaging, and comparability
        blocks:
          - type: paragraph
            body: >-
              Beam materially improves Reflection's competitive story because it turns an abstract sovereignty thesis
              into an actual model with declared coding and agentic focus, but the evidence bar is still uneven across
              competitors. Reflection's official materials and launch coverage support a 501B/23B MoE architecture, an
              Apache 2.0 path, and a positioning claim that Beam is competitive with GLM 5.2 and approaching Qwen
              3.8-Max while remaining behind Kimi K3 on raw capability. What the same evidence does not yet provide is a
              published, apples-to-apples third-party scorecard against the current Chinese leaders. That matters
              because Reflection is asking buyers to trade an already available open ecosystem for a newly launched
              model whose strongest differentiation is efficiency and deployability rather than a documented benchmark
              lead.
