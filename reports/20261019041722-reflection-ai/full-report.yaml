        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The company’s technical disclosures describe Beam as a sparse MoE base model wrapped in a heavy
              reinforcement-learning system rather than a simple post-trained wrapper on someone else’s API. Reflection
              says Beam combines 501 billion total parameters with 23 billion active parameters, 23.8 trillion
              pretraining tokens, and a four-week RL run on 10.5K NVIDIA GB300 GPUs that generated more than 100 million
              rollouts. The operating model is equally important: Reflection describes asynchronous rollout/training
              coordination, policy-version tracking, replayable records, and independent judge checks for verifier
              exploits. That design supports the company’s core thesis that efficiency and controllable tool use, not
              just raw parameter count, are the differentiators it wants buyers to pay for.
            claimRefs:
