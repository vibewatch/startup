  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and public traction
        blocks:
          - type: paragraph
            body: >-
              Reflection is not pitching a broad consumer subscription business. The public commercial narrative instead
              centers on selling control: TechCrunch reported that researchers would be able to use the models freely
              while revenue should come from large enterprises and governments building sovereign AI systems, and
              Sequoia's profile frames ownership, self-hosting, and predictable economics as the core buyer benefit
              rather than a seat-based SaaS motion. That positioning is strategically coherent for regulated buyers, but
              the proof remains thin. Public sources still do not show executed pricing tiers, customer count, ACV, or
              renewals. The one public revenue datapoint in this pool is a Medium post citing GetLatka at roughly $4.6
              million of 2025 revenue and explicitly warning that the figure should be treated cautiously.
            claimRefs:
