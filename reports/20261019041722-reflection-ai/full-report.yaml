      - number: '5.3'
        title: Maturity, differentiation, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Reflection’s differentiation thesis is coherent: self-hosted open weights should let large buyers control
              model behavior, protect sensitive data, and avoid the pricing power of closed APIs. The problem is that
              the proof set still lags the ambition. Independent launch coverage says Beam’s benchmark claims were still
              self-reported at release, while mid-2026 outside reporting described Reflection’s openness evidence as
              thin and the public artifact surface as sparse. The official newsroom also skews toward compute, policy,
              and government-adjacent milestones rather than public technical docs or reference deployments. For
              diligence, that means the product story is now real enough to underwrite technical follow-up, but not yet
              strong enough to treat maturity, security packaging, or enterprise deployment repeatability as proven.
            claimRefs:
