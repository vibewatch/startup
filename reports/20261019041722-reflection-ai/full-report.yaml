      - number: '2.3'
        title: Buyer map, budget owners, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Three buyer groups recur across the available evidence. First are regulated enterprise engineering
              organizations that want coding agents or code-comprehension systems inside their own cloud or appliance
              footprint. Second are government, national-lab, and defense-adjacent programs that value a U.S.-controlled
              open-weight option over a foreign model family. Third are sovereign or quasi-sovereign infrastructure
              operators that care about domestic AI factories and downstream deployment control. Each segment points to
              different budget owners, but all of them share two gating issues: buyers must trust a first-generation
              public model whose benchmark advantages were still awaiting broader independent verification at launch,
              and public evidence still does not show named scaled customers or conversion metrics by segment.
            claimRefs:
              - CM006
              - CM009
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
