            title: Commercial readiness still depends on artifacts the public launch had not delivered yet
            body: >-
              At fetch time the company was still pointing readers to future weights, a future model card, and future
              developer artifacts, while outside launch coverage said the headline benchmarks remained self-reported.
            calloutType: risk
            claimRefs:
              - CE006
              - CE012
          - type: callout
            title: Public evidence skews toward control and infrastructure, not repeatable deployment proof
            body: >-
              Reflection’s strongest external signals are around sovereign positioning, compute access, and
              policy-facing partnerships; they are not yet a substitute for visible customer adoption, compliance
              packaging, or developer-ecosystem traction.
            calloutType: insight
            claimRefs:
              - CE010
              - CE013
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Segment mix points to regulated enterprise and sovereign buyers first
        blocks:
          - type: paragraph
            body: >-
              Reflection's public materials position Beam and the surrounding deployment stack for enterprise coding
              workflows, public-sector programs, and developers rather than for mass-market consumer chat. The official
              Beam launch calls the model a workhorse for enterprise coding and agentic workloads, AI Engineer describes
              the company as building for developers, enterprises, and public-sector organizations, and Tech Insider
              says the pitch is aimed at enterprises, governments, and developers. That mix implies a buyer base led by
              engineering organizations, procurement teams, and regulated institutions that care about self-hosting,
              sovereignty, and control. It also means the likely payer is not an individual seat buyer but an
              organization funding infrastructure, model deployment, and internal developer productivity.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU015
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
