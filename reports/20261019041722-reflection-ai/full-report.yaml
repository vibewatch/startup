        - id: n3
          label: Strategic demand narrative
          detail: The pitch targets governments and regulated enterprises that want a US-controlled open model.
        - id: n4
          label: Validation gap
          detail: Launch benchmarks and efficiency claims were still awaiting independent validation and wider public weights.
        - id: n5
          label: Capital-structure overhang
          detail: Reported financing step-up and multi-year compute obligations can outrun disclosed commercialization proof.
