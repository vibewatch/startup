        title: Exhibits
        blocks:
          - type: callout
            title: Reflection now has a real lane
            body: >-
              Reflection is no longer just a funding story; Beam gives it a concrete U.S. open-weight position that
              neither closed U.S. APIs nor Chinese-origin open models fully replicate for regulated buyers.
            calloutType: strength
            claimRefs:
