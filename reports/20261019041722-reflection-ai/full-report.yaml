  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Reflection's visible customer path runs from developer evaluation into sovereign and regulated enterprise
      procurement, with expansion still gated by pricing and proof gaps.
    data:
      items:
        - label: Developer discovery
          actor: Developers
          tone: neutral
          touchpoints:
            - AI Engineer and Tech Insider frame Beam for developers as well as enterprise buyers.
            - Initial engagement is through product awareness rather than public customer references.
        - label: Controlled evaluation
          actor: Engineering teams
          tone: opportunity
          touchpoints:
            - Reflection opened early access at Beam launch.
            - Layer3 says the API beta was free to start.
        - label: Procurement and validation
          actor: Enterprise and government procurement teams
          tone: risk
          touchpoints:
            - Startup Fortune said launch benchmarks were not independently verifiable at a public checkpoint.
            - Public sources do not disclose token pricing, NRR, or signed-customer counts.
        - label: Self-hosted deployment design
          actor: Regulated enterprises and sovereign users
          tone: positive
          touchpoints:
            - Official and third-party coverage emphasize open weights, control, and sovereign deployment.
            - The likely buyer values ownership and compliance more than low-friction self-serve usage.
        - label: Public-sector reference expansion
          actor: National labs and government programs
          tone: opportunity
          touchpoints:
            - Sequoia says Reflection is a model provider for the Genesis Mission across 17 national labs.
            - This is strategic proof, but public production detail is missing.
        - label: Regional enterprise scale-up
          actor: Korean enterprises and agencies
          tone: opportunity
          touchpoints:
            - Sequoia says Reflection signed a memorandum with Shinsegae for a 250-megawatt AI factory.
            - The expansion loop remains memorandum-led rather than case-study-led.
    approximationNotes: >-
