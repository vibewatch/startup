        - label: Enterprise ownership demand
          value: Self-hosting, control, customization
          note: Large enterprises are the clearest named commercial target in public sources.
        - label: Government / sovereign demand
          value: Domestic or controlled AI deployments
          note: Governments are named as a paying category but contract values are not public.
        - label: Compute-efficient inference claim
          value: 3-4x less compute versus GLM-5.2
