artifact: "company-overview"
slug: "reflection-ai"
runDate: "2026-10-19"
company:
  name: "Reflection AI"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Reflection AI presents itself as an open-intelligence lab for enterprises, governments, and sovereign buyers, pairing open-weight models with deployment software, infrastructure options, and forward-deployed services. The assigned evidence supports a steep capital and valuation climb from $130 million at emergence in 2025 to a reported $25 billion pre-money financing in 2026, but it still leaves revenue, customer scale, board composition, and the full terms of the 2026 round unverified."
sections:
  - id: "identity-and-product-thesis"
    title: "Identity and product thesis"
    body: |-
      Reflection's own materials position the company around "open intelligence" rather than a single API product. In the assigned pool, the official site says Reflection builds AI systems for enterprises, governments, and sovereign entities, then pairs that mission with open-weight models, open-source software, infrastructure choices that include private cloud and air-gapped deployment, and a forward-deployed team that helps customers implement applications. Third-party coverage ties that operating model to a founder thesis around autonomous coding, reasoning, and agentic workloads. The resulting identity is not just "another model lab": it is a vertically packaged open-model vendor trying to sell control, auditability, and deployment flexibility to organizations that do not want to depend on a closed-model landlord. Public location evidence is thinner than the product story; the assigned pool supports a New York-based identity via third-party summaries, but the official site in this pool does not publish a headquarters line. 
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO010
    tableRefs:
      - TO001
  - id: "leadership-governance-and-key-person-risk"
    title: "Leadership, governance, and key-person risk"
    body: |-
      Publicly named leadership in the assigned evidence is still overwhelmingly founder-centric. Sequoia's profile and multiple third-party summaries identify Misha Laskin as CEO and Ioannis Antonoglou as president and CTO, with both founders carrying Google DeepMind pedigrees and Antonoglou repeatedly linked to AlphaGo. That matters because Reflection's public differentiation depends heavily on frontier reinforcement-learning credibility and founder narrative rather than on a broad, publicly documented management bench. The same source set does not identify a current board slate, independent directors, or the governance and investor-rights package that accompanied the 2026 financing. For diligence purposes, that leaves meaningful key-person dependency on the two founders and a governance disclosure gap that later chapters will need to treat as unresolved rather than assumed away.
    claimRefs:
      - CO003
      - CO004
      - CO005
      - CO014
      - CO015
    tableRefs:
      - TO002
  - id: "capitalization-scale-and-milestones"
    title: "Capitalization, scale signals, and milestones"
    body: |-
      The assigned pool clearly supports a rapid financing staircase, but not a clean read on current operating scale. Public reporting says Reflection emerged from stealth in March 2025 with $130 million raised, then added a reported $2 billion round in October 2025 at an $8 billion valuation. By April 2026, Misha Laskin was quoted as saying a new financing had closed at a $25 billion pre-money valuation, but the assigned evidence does not disclose that round's size or terms. At the same time, October 2026 coverage described Beam as Reflection's first open-weight model and highlighted more than $7 billion of disclosed SpaceX and Nebius compute commitments made before a public frontier model had fully landed. That combination makes capital availability a strength and commercial proof a gap: the pool supports ambition, infrastructure access, and launch activity, but it does not verify revenue, customer count, or current headcount.
    claimRefs:
      - CO006
      - CO007
      - CO008
      - CO009
      - CO011
      - CO012
      - CO013
    tableRefs:
      - TO003
    figureRefs:
      - FO001
