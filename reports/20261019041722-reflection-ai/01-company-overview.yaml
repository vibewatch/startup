      - ["Sequoia Capital", "Early investor and narrative amplifier", "Sequoia appears in the seed financing history and also publishes a founder profile that reinforces the long-horizon strategic story.", "Request board or observer rights and any protective provisions from early rounds."]
      - ["Lightspeed / CRV", "Recurring venture backers", "Public sources place CRV in the early financing and Lightspeed in the Series A and later syndicate, implying continuity across financing stages.", "Request exact round-by-round ownership, pro rata rights, and liquidation preferences."]
