      - ["Nebius", "Secondary compute counterparty", "Coverage says Reflection committed more than $1B through 2029, giving the company a second major capacity relationship beyond SpaceX.", "Check whether committed spend is cancellable, fungible, or dependent on fundraising milestones."]
