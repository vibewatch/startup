  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: valuation
      missingEvidence: Signed closing documents or a board-approved financing summary showing whether the reported 2026 step-up round actually closed, at what valuation, and on what terms.
      whyItMatters: The recommendation is explicitly price-sensitive, so unresolved round status and cap-table terms prevent a fair-value judgment.
      diligencePath: Request the executed round documents, a cap-table snapshot, and management confirmation of liquidation preferences, participation, and any investor protections.
      relatedQuestionRefs: [QV001, QV008]
    - type: private-evidence-only
      severity: material
      topic: commercialization
      missingEvidence: Current revenue, gross margin, customer concentration, renewal behavior, and named reference deployments for Beam or precursor products.
      whyItMatters: Without operating KPIs, investors cannot tell whether the compute and capital base are converting into durable software economics.
      diligencePath: Request the latest KPI dashboard, customer reference calls, and cohort data for production users.
      relatedQuestionRefs: [QV003, QV006, QV008]
    - type: private-evidence-only
      severity: material
      topic: beam
      missingEvidence: Independent benchmark replication, model card detail, and post-launch deployment evidence for Beam.
      whyItMatters: Beam is now central to the valuation story, but self-reported launch metrics do not prove durable competitive advantage.
      diligencePath: Wait for independent third-party testing, review the model card and technical report, and test the released weights against target enterprise workloads.
      relatedQuestionRefs: [QV002, QV007]
