      - ["Launch benchmarks fail external replication", "Tech Insider and Startup Fortune both note that Beam's launch metrics were self-reported and that the weights were not yet broadly available at announcement.", "Medium", "High", "Early", "Beam is at least shipped and scheduled for a fuller artifact release.", "Independent benchmark runs, red-team outputs, and enterprise workload results were not yet public in the assigned evidence."]
      - ["Execution drift from product wedge to base-model program", "Turing Post reported that Reflection's original autonomous-coding promise had shifted to 'all hands on deck' on model building, with applications following later.", "High", "High", "Early", "Beam launch shows the company can now ship a flagship model, not just talk about one.", "Public evidence still lacks named production customers, disclosed retention, or monetization proof for the broader platform."]
    notes: "This register mixes company-disclosed operational metrics with independent launch skepticism; mitigation maturity is a synthesis of what the sources say Reflection has already built versus what still waits on external proof."
    claimRefs: ["CR001", "CR002", "CR003", "CR004", "CR005", "CR006", "CR007"]
