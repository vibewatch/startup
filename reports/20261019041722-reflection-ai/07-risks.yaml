      - "Residual exposure"
      - "Diligence path"
    rows:
      - ["Beam weight release and model-card package", "Global enterprise, developer, and government users", "Reflection's launch post said the weights, technical report, model card, and developer artifacts would arrive later in October 2026, so launch-day diligence still lacked the final documentation package.", "High", "High", "Company publicly committed to an Apache-2.0-style release and supporting artifacts.", "Procurement, legal, and safety review stay gated until the final package is public and reproducible.", "Review the released model card, technical report, safety notes, and benchmark replication guidance before underwriting deployment."]
      - ["Open-weight commercial terms", "Global commercial users", "Wikipedia says Reflection reportedly plans revenue-sharing licenses with its large language models, which is less settled than a plain permissive open-source posture.", "Medium", "Medium", "Beam messaging emphasizes open weights and enterprise control.", "Commercial restrictions or indemnity gaps could narrow who can deploy the model at scale.", "Obtain the final license text, usage restrictions, indemnities, and any revenue-share triggers."]
      - ["Sovereign / federal procurement posture", "US federal, national-lab, and regulated-enterprise buyers", "Sequoia and Wikipedia link Reflection to the Genesis Mission and sovereign-AI infrastructure efforts, implying sales into high-review buyers.", "Medium", "High", "Domestic-hosting and national-lab positioning may help with trust and mission fit.", "Security, export-control, and authority-to-operate reviews can lengthen deal cycles versus the capital spend profile.", "Request procurement pipeline detail, security attestations, and export-control counsel memos tied to target agencies."]
      - ["Training-data and provenance disclosures", "Global", "Beam's official post discloses 23.8T curated and licensed tokens, but the assigned launch evidence still points forward to the later technical report and model card for deeper provenance detail.", "High", "High", "Reflection says the missing artifacts are scheduled for release later in the month.", "Incomplete provenance detail can stall enterprise legal review or raise downstream compliance questions.", "Review data-governance, opt-out, provenance, and red-team disclosures once the formal artifacts are published."]
    notes: "Likelihood and severity labels synthesize cited source evidence rather than statutory conclusions; nulls are avoided because each row is an analyst risk judgment with an explicit diligence path."
    enumerationScope:
      coverage: "partial"
      basis: "Covers the public legal and compliance risk themes explicitly surfaced in the assigned fetched launch, partnership, and company-profile sources as of runDate; it is not a court-docket or regulator-registry census."
    claimRefs: ["CR003", "CR010", "CR011", "CR012", "CR015"]
