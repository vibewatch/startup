      - ["Secondary cloud compute", "Nebius / GB300 access through 2029", "Supplementary training and inference supply", "High", "Delivery or pricing problems reduce flexibility and bargaining power.", "High", "Multi-region infrastructure and asynchronous fleet design show some operational flexibility.", "Nebius remains part of the same Nvidia hardware stack, so it diversifies vendor entity more than silicon exposure."]
      - ["Strategic silicon ecosystem", "Nvidia hardware and go-to-market alignment", "Core training hardware plus investor signaling", "Very high", "Roadmap slips, chip scarcity, or economics that favor closed APIs erode Reflection's open-weight cost thesis.", "Critical", "Reflection frames Beam around inference efficiency and sovereign control to preserve buyer demand even in an expensive chip market.", "The assigned evidence does not show an alternative silicon path or a materially different hardware hedge."]
      - ["Early demand concentration", "Governments, national labs, and regulated enterprises", "Target customer segment", "High", "Procurement cycles and proof thresholds lag the pace of capital deployment.", "High", "Domestic open-weight positioning, Genesis Mission participation, and sovereign-compute partnerships may improve strategic fit.", "The assigned evidence still lacks named commercial customers, disclosed deployment counts, or revenue durability metrics."]
    notes: "Severity reflects the dependence structure in the assigned public evidence rather than a forecast probability of default; the register emphasizes concentration, counterparty leverage, and demand timing."
    claimRefs: ["CR008", "CR009", "CR010", "CR011", "CR016"]
