  - calloutType: strength
    title: Institutional Capital Moat and Payer Alignment
    body: Strive Health has assembled one of the most formidable investor syndicates in value-based care, combining Tier-1 venture leadership from NEA, crossover asset management from BlackRock affiliates, non-dilutive debt from Hercules Capital, and commercial distribution from strategic payers like CVS Health Ventures and hospital networks like Ascension.
    claimRefs:
      - CO001
      - CO004
      - CO010
      - CO011
  - calloutType: risk
    title: Public Opacity Around True Top-Line Revenue and Risk Exposure
    body: While Strive reports $5.5 billion in medical spend under management across 165,000 patients, this figure measures aggregate healthcare costs across attributed lives rather than Strive's recognized net revenue. Management discloses no GAAP revenue, gross margin, cash burn, or contract renewal rates, leaving Strive's underlying unit economics and exposure to downside risk corridors unverified in the public record.
    claimRefs:
      - CO003
      - CO005
      - CO013
      - CO014
      - CO015
