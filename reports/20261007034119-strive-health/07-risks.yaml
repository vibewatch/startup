callouts:
  - calloutType: "risk"
    title: "Vulnerability to CMMI Benchmark Resets"
    body: "Strive Health manages roughly $5 billion in annual medical spend across risk-bearing structures. Value-based kidney care economics depend directly on CMMI benchmark calculation rules and payer medical loss ratios. Any regulatory benchmark tightening or adverse risk-adjustment policy could erode operating margins before care management savings materialize."
    claimRefs:
      - "CR001"
      - "CR002"
  - calloutType: "insight"
    title: "Clinical Delivery and Staffing Ratios"
    body: "With 900 patient visits conducted daily by Kidney Heroes teams, clinical execution requires maintaining stringent nurse practitioner-to-patient staffing ratios. In an inflationary clinical labor environment, talent acquisition and retention bottlenecks represent an operational ceiling on patient scaling."
    claimRefs:
      - "CR005"
      - "CR007"
  - calloutType: "recommendation"
    title: "Pre-Investment Balance Sheet and Contract Diligence"
    body: "Investors should demand verified audit trails bridging gross managed spend to net recognized revenue, review historical stop-loss reinsurance attachment points, and analyze liquidation preference waterfalls following the $550 million Series D financing round."
