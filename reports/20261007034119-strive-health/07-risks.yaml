chapter:
  number: 7
  title: "Risks"
  summary: "Comprehensive risk analysis for Strive Health evaluating reimbursement policy vulnerability across Medicare CKCC and commercial contracts, acute medical spend underwriting under capitation, provider and payer counterparty concentration, clinical care escalation liabilities, and capital structure overhang following multiple private funding rounds."
sections:
  - id: "reimbursement-and-regulatory-exposure"
    title: "Reimbursement Policy and Regulatory Risk Architecture"
    body: "Strive Health operates at the center of value-based kidney care delivery, managing over $5 billion in annual medical spend across chronic kidney disease (CKD) and end-stage kidney disease (ESKD) populations (CR001). This massive managed medical spend creates direct vulnerability to federal reimbursement formulas and regulatory rate resets. Strive's clinical deployment expanded under the Center for Medicare and Medicaid Innovation (CMMI) Comprehensive Kidney Care Contracting (CKCC) model starting in Performance Year 2022 as the largest non-large dialysis organization (non-LDO) participant (CR002). Consequently, any downward revision to Medicare benchmark discounts, risk adjustment methodology changes, or quality scoring thresholds immediately compresses net shared savings or triggers shared losses. Furthermore, Strive operates across all 50 states (CR003), subjecting its care teams and CareMultiplier technology to diverse state-level corporate practice of medicine (CPOM) statutes, nurse practitioner scope-of-practice limitations, and healthcare data privacy standards. The regulatory risk register systematically ranks these exposures and identifies required diligence monitoring."
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "operational-and-clinical-execution"
    title: "Operational Reliability, Tech Scalability, and Care Delivery Exposure"
    body: "Operational execution at Strive Health relies heavily on the coordination between its proprietary predictive analytics platform CareMultiplier and frontline multidisciplinary care teams known as Kidney Heroes (CR004). The clinical team conducts an average of 900 patient visits daily, providing care coordination aimed at preventing avoidable emergency admissions and optimizing dialysis transitions (CR005). Although Strive reports substantial clinical improvements—including a 41% reduction in hospitalizations and an 85% increase in optimal dialysis starts (CR006)—the operational architecture remains susceptible to clinical model failure modes. A software outage or algorithmic drift in CareMultiplier patient stratification could delay urgent interventions, leading to emergency department 'crash' dialysis starts that carry severe medical cost spikes. Simultaneously, nationwide nurse practitioner and clinical care coordinator hiring constraints threaten clinical ratio sustainability, while fragmented electronic health record (EHR) integrations across over 6,500 partner providers introduce data pipeline disruption risks."
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR006"
    tableRefs:
      - "TR002"
  - id: "counterparty-and-balance-sheet-dependencies"
    title: "Counterparty Concentration, Partner Dependencies, and Capital Overhang"
    body: "Strive Health's business model depends on deep commercial and clinical partnerships across health plans, health systems, and nephrology provider practices. With over 6,500 contracted provider partners (CR007), counterparty concentration and alignment remain vital concerns. Because value-based enterprise contracts with regional health plans require multi-year reconciliation cycles, termination or non-renewal of a top-three regional payer partnership represents an immediate thesis-break risk for localized care teams. On the capitalization side, Strive completed a $166 million Series C financing led by NEA with strategic backing from CVS Health Ventures and CapitalG (CR008), followed by a massive $550 million Series D funding round in September 2025 (CR009). While this capital base provides operational runway, private secondary marketplace dynamics on platforms like EquityZen highlight that private company investments carry structural illiquidity and substantial loss risks prior to an exit event (CR010). The lack of audited public disclosures regarding debt covenants, contribution margins by line of business, and commercial renewal cohorts necessitates stringent pre-investment diligence."
    claimRefs:
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
    tableRefs:
      - "TR003"
