figures:
  - id: "FU001"
    title: "Customer Journey and Value-Based Care Lifecycle Map"
    type: "journey-map"
    summary: "Six-phase customer and patient journey map illustrating data ingestion, risk stratification, provider alignment, active care delivery, outcome realization, and ongoing program renewal."
    data:
      items:
        - label: "1. Identification & Data Hydration"
          detail: "Health plan contracts trigger claims and eligibility data ingestion into CareMultiplier to flag undiagnosed or progressing CKD patients."
        - label: "2. Provider & Nephrologist Alignment"
          detail: "Strive integrates with community nephrologists and primary care physicians under Strive Care Partners and CKCC frameworks."
        - label: "3. Kidney Hero Care Activation"
          detail: "Multispecialty NP-led care teams engage patients via in-person visits and virtual check-ins for medication management and education."
        - label: "4. Comorbidity & Dialysis Planning"
          detail: "Care teams coordinate complex chronic conditions like heart failure while planning optimal home dialysis or preemptive transplants."
        - label: "5. Clinical & Economic Outcome Realization"
          detail: "Partners achieve reported 41% lower hospitalizations and >20% cost reduction, generating shared-savings distributions."
        - label: "6. Contract Reconciliation & Program Expansion"
          detail: "Annual benchmark performance reconciliation and shared-savings settlements drive multi-year renewal and expansion into additional member cohorts."
    approximationNotes: "Conceptual workflow mapping based on Strive's published clinical care delivery architecture and partner case studies."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU005"
      - "CU006"
      - "CU008"
callouts:
  - calloutType: "insight"
    title: "Dual Payer-Provider Alignment Model"
    body: "Strive Health overcomes the classic value-based healthcare adoption bottleneck by simultaneously aligning commercial payers and independent nephrologists. By acting as a clinical care extender rather than a competing physician practice, Strive gains access to 700+ community nephrologists who actively enroll patients into shared-risk programs."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU006"
      - "CU007"
  - calloutType: "risk"
    title: "Customer Concentration and Post-Contract Durability Uncertainty"
    body: "While Strive reports managing nearly $5 billion in medical spend across over 145,000 patients, it discloses zero verifiable cohort data on logo renewal, Net Revenue Retention (NRR), or individual health plan revenue shares. In value-based healthcare, contract terminations by one or two major payers (such as Humana or Aetna) or CMS benchmark recalibrations represent critical unhedged commercial concentration risks."
    claimRefs:
      - "CU001"
      - "CU004"
      - "CU011"
      - "CU012"
