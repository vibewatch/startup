chapter:
  number: 6
  title: "Customers"
  summary: "Strive Health serves a two-sided healthcare customer ecosystem comprising health plan risk payers and community nephrology provider partners. Operating across commercial and Medicare Advantage lines, health systems, and CMS Kidney Care Choices programs, Strive currently cares for over 145,000 individuals with chronic kidney disease and end-stage renal disease across all 50 states while managing nearly $5 billion in annual medical spend. Key customer and partner deployments include Humana, Aetna, Oak Street Health, Zing Health, Trinity Health, and regional Blues plans, delivering reported outcomes including a 41% reduction in hospitalizations and over $400 million in cumulative partner savings. However, public disclosures omit audited contract duration, logo churn, net revenue retention cohorts, and specific payer revenue concentration."
sections:
  - id: "customer-segmentation-and-commercial-structure"
    title: "Customer Base Segmentation and Payer-Provider Alignment"
    body: "Strive Health operates a dual-sided value-based customer model that aligns risk-bearing health plans with local nephrologists and health systems [CU001, CU006]. The primary commercial payers encompass Medicare Advantage plans, commercial health insurers, state Medicaid managed care organizations, and the Centers for Medicare & Medicaid Services (CMS) Innovation Center through Comprehensive Kidney Care Contracting (CKCC) within the Kidney Care Choices (KCC) model [CU001, CU008]. On the provider side, Strive partners with over 6,500 healthcare providers across all 50 states, including more than 700 community nephrologists who act as lead clinicians in value-based risk arrangements [CU002, CU007]. Commercial arrangements are structured through flexible value-based contracts, ranging from shared-savings programs to full-risk capitation where Strive assumes financial accountability for total cost of care across high-cost chronic kidney disease (CKD) and end-stage renal disease (ESKD) cohorts [CU001, CU006]. Under Strive Care Partners, independent nephrology practices access risk infrastructure, delegated clinical care coordinators, and predictive risk stratification without shouldering unilateral actuarial liabilities [CU006]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU001"
    figureRefs: []
  - id: "adoption-trajectory-and-managed-spend-scale"
    title: "Adoption Trajectory, Managed Spend, and Patient Scaling"
    body: "Strive's commercial adoption trajectory has expanded rapidly across geographic reach, provider networks, and covered patient populations [CU002, CU003]. From serving 80,000 CKD and ESRD patients across 30 states in 2023, the platform expanded its active care base to over 145,000 patients spanning all 50 states, reflecting steady national deployment across Medicare and commercial books of business [CU002, CU003]. Associated annual medical spend under management reached nearly $5 billion, scaling Strive into one of the largest specialized value-based kidney care platforms in the United States [CU002, CU004]. Operational execution is supported by an internal workforce exceeding 700 employees, deploying multidisciplinary Kidney Hero care teams that have conducted more than 1.3 million longitudinal patient touchpoints since company inception [CU002, CU005]. Furthermore, Strive has broadened its commercial scope upstream and across adjacent comorbid populations, extending risk-managed clinical interventions into high-cost conditions such as congestive heart failure (CHF) to capture holistic cost-of-care savings [CU001]."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU002"
    figureRefs:
      - "FU001"
  - id: "named-deployments-outcomes-and-retention-risks"
    title: "Named Customer Proof, Clinical Outcomes, and Concentration Risks"
    body: "Strive has secured enterprise partnerships across major national health plans, regional Medicare Advantage plans, risk-bearing primary care clinic networks, and integrated health systems [CU001, CU009]. Key customer deployments include Humana, Aetna, regional Blue Cross Blue Shield affiliates, Oak Street Health, Zing Health, and Catholic health system Trinity Health [CU001, CU009, CU010]. In clinical and economic outcomes, Strive reports major cost-of-care reductions exceeding 20%, a 41% reduction in hospitalizations, a five-fold increase in preemptive kidney transplants in targeted markets, and cumulative partner cost savings exceeding $400 million [CU005]. In primary care integration, Strive's multi-year contract with Oak Street Health focuses on advanced CKD Stage 4 through ESKD patients across clinic locations [CU009]. In specialized Medicare Advantage, Strive expanded with Zing Health across Ohio, Tennessee, and Mississippi to manage chronically ill populations [CU009]. Despite these reported proof points, Strive does not disclose logo retention, Net Revenue Retention (NRR), Gross Revenue Retention (GRR), or individual payer revenue shares, creating significant diligence uncertainty regarding customer concentration and post-contract durability [CU011, CU012]."
    claimRefs:
      - "CU001"
      - "CU005"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
    tableRefs:
      - "TU003"
    figureRefs: []
