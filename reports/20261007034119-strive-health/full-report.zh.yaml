  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与可服务总支出
        blocks:
          - type: paragraph
            body: >-
              价值型肾脏护理市场覆盖从早期慢性肾病（CKD 3b 期和 4 期）到终末期肾病（ESKD）的进展人群。Strive Health
              的商业方案以管理护理总成本为核心，而不是充当传统按服务收费的透析提供商。该边界明确包括上游护理协调、执业护士主导的多专科护理团队、通过 CareMultiplier
              平台提供的预测型临床决策支持，以及旨在防止可避免再住院和紧急透析启动的护理转衔管理。

              Strive 可服务市场中的纳入支出，包括 Medicare Advantage、商业健康计划、Medicare Shared Savings Programs（MSSP）和 Accountable Care
              Organization（ACO）模式下归属 CKD 和 ESKD
              受益人的医疗总支出。排除项包括独立门诊透析中心设施费、免疫抑制剂和拟钙剂的药品制造成本，以及在没有承担风险安排时未纳入管理的急性医院手术费用。Strive 当前管理 165,000 名患者对应的 $5.5B
              医疗支出，说明其市场覆盖已相当可观，但仍只是美国每年数百亿美元肾脏护理支出的一小部分。现状替代方案仍主要是交易型按服务收费的肾脏科就诊、缺乏协调的初级保健管理，以及现有透析中心网络在晚期阶段被动启动透析。
