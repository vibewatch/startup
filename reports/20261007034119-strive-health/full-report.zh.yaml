      - number: '5.4'
        title: 展示项
        blocks:
          - type: callout
            title: 双核心架构：AWS Data Lakehouse 与 Salesforce Health Cloud
            body: >-
              Strive Health 没有从零构建专有交易型 EHR，而是将企业级 AWS data lakehouse（S3、Redshift、Lambda）与高度定制的 Salesforce Health Cloud
              前端配对。这一设计同时优化了大数据分析建模和 Kidney Heroes 的稳健临床 CRM 工作流，把软件工程重点放在数据治理、预测 ML 和互操作性上。
            calloutType: insight
            claimRefs:
              - CE006
              - CE007
              - CE008
          - type: callout
            title: 异构入站数据延迟与模式波动
            body: >-
              Strive 的预测智能高度依赖涵盖保险索赔（claims）、临床 EHR 和医院 ADT 馈送的多源摄取。由于保险索赔数据经常存在 30 至 90 天的裁决报告延迟，除非医院 ADT 馈送和本地诊所 EHR
              连接保持不间断同步，否则 Strive 的实时干预引擎可能无法及时发现风险。
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
