      - number: '1.3'
        title: 资本化历史、利益相关方协同与财务披露缺口
        blocks:
          - type: paragraph
            body: >-
              Strive Health 通过连续多轮机构融资，累计筹集超过 $680M 股权资本和结构化信贷额度。公司的资本化历史以创始资本合作方 New Enterprise Associates（NEA）为核心；NEA
              联席 CEO Mohamad Makhzoumi 从公司创立起持续支持其多轮增长融资。2023 年 5 月，Strive 获得由 NEA 领投的 $166M C 轮股权融资，并引入战略投资者 CVS Health
              Ventures，以及包括 CapitalG（Alphabet 的独立增长基金）、Echo Health Ventures、Town Hall Ventures、Ascension Ventures 和
              Redpoint Ventures 在内的知名机构和成长型投资者联合体。

              2025 年 9 月，Strive 完成一笔具有里程碑意义的 $550M 融资，包括 $300M D 轮股权融资和 $250M 风险债务融资。股权轮再次由 NEA 领投，CVS Health
              Ventures、CapitalG、Echo Health Ventures、Town Hall Ventures、Redpoint 以及由 BlackRock, Inc.
              关联方管理的新机构账户参与。专业贷款机构 Hercules Capital 承销了 $250M 债务额度，用于支持运营扩张、临床招聘和先进 AI 部署，同时避免股权稀释定价。

              Strive 的外部资本联合为其资产负债表韧性及在主要医疗系统（如 Ascension）和全国性支付方（如 CVS Health/Aetna）中的商业分销提供了强力支撑，但分析性尽调缺口仍然很大。由于
              Strive 仍是私营公司，管理层没有公开披露 GAAP 收入、年度经常性收入（ARR）、毛利率、医疗损失率或现金消耗率。此外，Strive 对外强调的 $5.5B
              管理中医疗支出，代表归属患者群体发生的医疗总支出，而不是 Strive 留存的收入。公开记录也未披露 $250M Hercules 债务额度的利率契约、抵押留置权和到期安排，以及 D 轮之后正式的估值基准。
