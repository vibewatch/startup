  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              价值型肾脏护理交付市场分为四类主要竞争者：专门的价值型肾脏护理风险承担实体、正在转向价值型模式的传统透析提供商、横向人群健康管理平台，以及现状下支付方 / 医疗系统内部的护理运营。Strive Health
              通过在早期 CKD 3 至 5 期和终末期肾病（ESRD）阶段提前介入，延缓透析并减少可避免急诊就诊，从而形成差异化。Somatus 和 Monogram Health
              等专门竞争者也在发展与风险匹配的支付方合作和肾脏科医生网络。与此同时，DaVita 和 Fresenius Medical Care
              等透析巨头掌控门诊诊所的实体基础设施和商业关系；尽管其历史结构高度依赖高量按服务收费的透析疗程，仍拥有巨大的既有分销力量。
