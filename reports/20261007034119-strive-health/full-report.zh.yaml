      - number: '1.2'
        title: 执行层、治理演进与组织深度
        blocks:
          - type: paragraph
            body: >-
              Strive Health 由联合创始人兼 CEO Chris Riopelle 领导；自 2018 年以来，他的战略愿景推动了平台的多州提供商扩张和机构资本联合。随着业务成长，Strive
              从早期护理协调方发展为机构级运营平台，并在总裁 Paul Marchetti 指导下建立成熟的运营和财务治理。2026 年，公司协调扩充
              C-suite，以支持企业规模化、支付方风险签约，以及商业和政府健康计划关系中的临床质量。

              2026 年 6 月，Strive 任命 Dr. Jamie Sharp, M.D. 为首席医疗官，任命 Chris Rigg 为首席财务官。Sharp 博士此前担任痴呆症价值型护理提供商 Rippl 的
              CMO，并在 Aetna（CVS Health 旗下公司）、naviHealth 和 Evolent Health 担任过高级临床领导职务。Rigg 加入 Strive 前曾任 Elevance Health 的
              CFO 和商业健康福利高级副总裁，积累了深厚的管理式护理和资本市场经验；他在那里负责覆盖超过 32M 消费者的商业产品财务战略，此前还曾在 Deutsche Bank 和 Merrill Lynch
              从事股票研究。

              2026 年 10 月，Susan Ray 出任首席运营官，Sarah Berry, Ph.D. 出任首席网络与合作官，Dan Heslin 出任首席增长官，进一步补强了执行团队。Ray 曾任 Rippl
              Care 的 COO，并在 Evolent Health 和 Accolade 担任高级高管，负责集中式临床运营和交付服务。Berry 博士负责 Strive 超过 6,500
              名提供商合作伙伴组成的网络；Heslin 则在 Elevance Health 长期任职后，负责业务开发和健康计划企业增长。技术架构由首席技术官 Tom Hawkes 负责，专业肾脏科护理方案由首席肾脏科医生
              Dr. Keith Bellovich, D.O. 指导。

              尽管价值型运营领域的高管梯队相当充足，关键人物风险仍中度集中于联合创始人兼 CEO Chris Riopelle 和总裁 Paul Marchetti；两人维系着与创始风险投资支持方 NEA
              及主要健康计划合作伙伴的基础关系。
