  - id: TV003
    title: 乐观情景 / 基准情景 / 悲观情景表
    columns:
      - 情景
      - 明确假设
      - 估值区间
      - 回报 / 退出逻辑
      - 关键下行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - 经审计收入和利润率验证运营杠杆；留存持久；债务及优先权安排与投资者利益相容
        - 留存的公开证据不足以支持
        - 核实现金流经济性并能与同类交易基准比较后再定价
        - 临床运营扩大后单位经济性仍未改善
        - 有条件；所需证据缺失
      - - 基准
        - 公司报告的规模延续，但收入、利润率、集中度及资本条款仍属非公开信息
        - 留存的公开证据不足以支持
        - 继续研究；暂无目标回报或持有期
        - 尽调无法将医疗支出与确认收入及回款核对
        - 与当前证据最一致
      - - 悲观情景
        - 行业疗效疑虑持续；抽成率或利润率疲弱；债务优先于新股权受偿
        - 留存的公开证据不足以支持
        - 放弃，或要求能抵御债务及优先权悬置的价格和结构
        - 独立结果无法复现节省，或重大合同未续约
        - 下行具有合理可能；幅度无法量化
    notes: 有意不提供情景区间，因为来源池缺少交易估值、经审计财务基础、债务条款及优先股堆叠。
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV014
      - CV015
      - CV016
figures:
  - id: FO001
    title: Strive Health 公司与里程碑发展时间线
    type: timeline
    summary: 按时间梳理 Strive Health 自 2018 年在丹佛成立以来的发展，包括 Series D 增长融资及 2026 年高管团队扩充。
    data:
      items:
        - label: 2018 年公司成立
          date: '2018-01-15'
          detail: Chris Riopelle 与 NEA 合作在科罗拉多州丹佛创办 Strive Health，打造价值导向的肾脏照护模式。
          tone: positive
        - label: CareMultiplier 平台部署
          date: '2020-06-01'
          detail: 专有 CareMultiplier 机器学习引擎上线，并取得 HITRUST 认证和 NCQA 认可。
          tone: neutral
        - label: Series C 融资
          date: '2023-05-31'
          detail: Strive 获得由 NEA 领投的 $166 million Series C 融资，参与方包括 CVS Health Ventures、CapitalG、Echo、Town Hall 和 Ascension。
          tone: positive
        - label: Series D 增长融资
          date: '2025-09-09'
          detail: Strive 完成 $550 million 融资轮，其中包括 NEA 领投的 $300M 股权融资及 Hercules Capital 提供的 $250M 债务。
          tone: positive
        - label: 网络规模基准
          date: '2025-09-09'
          detail: 公司宣布里程碑：为超过 145,000 名患者及 6,500 名提供者管理近 $5 billion 医疗支出。
          tone: positive
        - label: 临床结果发表
          date: '2026-05-15'
          detail: Journal of Patient Experience 和 AJMC 的同行评议研究验证再入院率降低 42%，eGFR 下降速度放缓 77%。
          tone: positive
        - label: C-suite 领导层增员
          date: '2026-06-16'
          detail: Jamie Sharp 医生获任首席医疗官，Chris Rigg 获任首席财务官，负责指导规模扩张。
          tone: neutral
        - label: 全国规模扩张
          date: '2026-09-17'
          detail: 50 个州的 165,000 名患者及 6,500 个提供者合作伙伴所对应的管理医疗支出达到 $5.5 billion。
          tone: positive
        - label: TIME 顶尖 HealthTech 排名
          date: '2026-09-17'
          detail: Strive 连续第二年入选 TIME 和 Statista 的 World's Top HealthTech Companies 排名。
          tone: positive
        - label: 下一阶段高管扩充
          date: '2026-10-01'
          detail: Susan Ray 加入并担任 COO，Sarah Berry 医生担任 CNEO，Dan Heslin 担任 CGO，分别负责运营、网络及商业增长。
          tone: positive
    approximationNotes: 里程碑时间线综合官方记录中的公司成立、融资、临床发表及高管任命信息。
