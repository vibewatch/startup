  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与临床工作流交付
        blocks:
          - type: paragraph
            body: >-
              Strive Health 通过混合模式提供价值型肾脏护理，将预测分析与慢性肾病（CKD）和终末期肾病（ESKD）连续谱中的专业临床工作流紧密结合 [CE001]。Strive
              的核心方案是协作式护理延伸模式，与社区肾脏科医生和初级保健医生并肩工作，而非取代既有提供商关系 [CE002, CE003]。在客户工作流中，Strive
              找出正向肾衰竭进展的高风险患者，协调早期干预，并管理复杂共病，以防止紧急透析启动和住院 [CE001, CE004]。护理由 Strive 的 Kidney Heroes
              多学科团队在线下和虚拟场景交付，团队包括执业护士、注册护士、营养师和临床社工，负责密集的患者教育、用药管理和营养咨询 [CE002, CE004]。为确保医疗生态各方协同，Strive
              部署专门的提供商整合团队，开展现场工作流评估，并建立标准化临床和沟通协议 [CE003, CE005]。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
