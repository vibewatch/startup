  - id: TV002
    title: 正方 / 反方论据表
    columns:
      - 维度
      - 正方证据
      - 反方论据或限制
      - 哪些信息会改变判断
    rows:
      - - 市场需求
        - 公司援引超过 3,500 万名患肾病的美国成年人，其中约 90% 不知情
        - 需求规模大，不代表可触达收入或获客效率
        - 将独立市场拆分与符合条件的承保人群及合同经济性挂钩
      - - 产品模式
        - 提供者 / 支付方模式将照护团队与预测分析结合
        - 公开页面没有量化自动化杠杆或服务成本
        - 按队列验证人员配比、干预成本及贡献利润
      - - 运营规模
        - 公司报告 145,000+ 名患者、6,500+ 名提供者及近 $5B 年度医疗支出
        - 医疗支出是分母，不是 Strive 的收入、ARR 或现金流
        - 提供从归因支出到收入、节省分成、回款及利润率的经审计桥接表
      - - 资本获取
        - $550M 总融资表明投资者和贷款方支持
        - 报告中的 $250M 债务可能增加优先受偿、契约限制及稀释压力
        - 已签署债务文件、股权结构表、优先权瀑布及备考持股结构
    notes: 公司报告的运营指标作为自述呈现，并非独立审计的业绩；融资构成来自汇总报道。
