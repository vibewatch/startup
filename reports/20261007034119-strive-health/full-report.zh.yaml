              - CR012
      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 易受 CMMI 基准重置影响
            body: >-
              Strive Health 在承担风险的结构下管理每年约 $5B 的医疗支出。价值型肾脏护理经济直接取决于 CMMI
              基准计算规则和支付方医疗损失率。任何监管基准收紧或不利的风险调整政策，都可能在护理管理节省兑现前侵蚀运营利润率。
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: 临床交付与人员配比
            body: Kidney Heroes 团队每天完成 900 次患者就诊，临床执行必须维持严格的执业护士与患者配比。在临床劳动力通胀环境下，人才招募和留存瓶颈构成患者规模化的运营上限。
            calloutType: insight
            claimRefs:
              - CR005
              - CR007
          - type: callout
            title: 投资前资产负债表与合同尽调
            body: 投资者应要求提供把管理中总支出桥接到确认净收入的经核验审计轨迹，审阅历史止损再保险触发点，并分析 $550M D 轮融资后的清算优先权分配瀑布。
            calloutType: recommendation
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与融资背景
        blocks:
          - type: paragraph
            body: >-
              仅基于公开信息的建议是继续研究，分析信心中等，风险高，估值无法定价。Strive 称其在 2025 年 9 月宣布筹资 $550M，而 Parsers.vc 新闻聚合将总额拆分为 $300M D 轮股权和
              $250M
              债务。该融资证明公司具备资本获取能力，但已筹融资不等于可用现金，融资总额也不等于交易估值。保留页面没有提供股价、投后价值、债务定价、到期日、契约、抵押物、清算优先权或稀释条款。因此，无法负责任地用这组证据计算入场价格、目标回报、持有期和退出收益。
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV011
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV014
              - CV016
      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点是：Strive 以支付方和提供商关系、临床团队、预测分析与全国覆盖相结合的模式，解决了巨大的护理需求。公司发布的证据称，其在全部 50 个州支持超过 145,000 人，与超过 6,500
              名提供商合作，管理近 $5B 年度医疗支出，并为合作伙伴创造超过 $400M
              节省。这些数字说明其运营具有重要性，但不是经审计的收入、利润率、留存或现金流指标。因此，反论点落在经济性，而不只是临床效果：庞大的归属支出基础可能与较低的费率或劳动密集型交付并存。2026
              年新闻流还转述了一项批评虚拟 CKD 管理的行业级 PHTI 评估，但保留的摘录并未证明 Strive 是受评产品之一。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV014
      - number: '8.3'
        title: 情景框架与可比项限制
        blocks:
          - type: paragraph
            body: >-
              里程碑门控框架比收入倍数更稳妥，因为指定证据池没有可用的上市公司倍数、私人交易价值或与可比经济性挂钩的并购对价。aVenture 抓取内容只有页面标题，Seedtable 列出 2025 年 1
              月的最近融资日期但没有金额，因此相对于 Strive 后来在 2025 年 9
              月的公告，该记录已经过时。乐观、基准和悲观情景仍可说明哪些条件必须实现，但今天没有任何情景支持数值估值区间。乐观情景需要经审计的单位经济和有利资本条款；基准情景保留规模，但财务可见性仍缺失；悲观情景则叠加薄弱的经济证明、债务优先级和行业疗效审查。价格发现应在核验收入、利润率、留存和股权结构表证据之后进行，而不是之前。
            claimRefs:
              - CV001
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              保留的公开记录尚未证明公司具备退出准备度。没有经审计财务报表、群组留存、合同集中度、贡献利润率、现金消耗，以及股权和债务结构所附权利，IPO
              路径或战略出售价值都无法纳入投资判断。眼下的尽调顺序是：将管理中医疗支出与确认收入和现金回款对账；按支付方、提供商和合同年份检验利润率；审阅债务协议和优先权瀑布；再将所得经济性与按同一承担风险模式选取的同期交易比较。如果经核验经济性显示贡献利润率存在结构性负值、集中客户续约失败、债务条款明显劣后于新股权，或独立结果证据无法复现公司报告的节省，投资论点就会失效。在这些门槛关闭前，不应进行定价投资。
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 投资姿态
            body: 继续研究。只有经审计的经济性和完整融资结构能够支持可接受的入场价格与下行保护时，公司报告的规模才具备可投资性。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV014
              - CV016
          - type: callout
            title: 不要把融资混同于估值
            body: 据报道的 5.5 亿美元由股权和债务构成。这并不能证明投后估值、现金余额或可用于运营的金额。
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV014
