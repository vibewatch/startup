        blocks:
          - type: paragraph
            body: >-
              Strive Health 采用双边价值型客户模式，将承担风险的健康计划与当地肾脏科医生和医疗系统对接 [CU001, CU006]。主要商业支付方包括 Medicare Advantage
              计划、商业健康保险公司、州 Medicaid 管理式护理组织，以及通过 Kidney Care Choices（KCC）模式下 Comprehensive Kidney Care
              Contracting（CKCC）参与的 Centers for Medicare & Medicaid Services（CMS）Innovation Center [CU001,
              CU008]。在提供商一侧，Strive 与全部 50 个州超过 6,500 名医疗保健提供商合作，其中包括超过 700 名社区肾脏科医生，他们在价值型风险安排中担任主诊临床医生 [CU002,
              CU007]。商业安排采用灵活的价值型合同，从共享节余项目到全风险按人头付费不等；在后者中，Strive 对高成本慢性肾病（CKD）和终末期肾病（ESKD）群体的护理总成本承担财务责任 [CU001,
