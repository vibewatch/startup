      - number: '3.3'
        title: 壁垒持久性、转换成本与不利竞争风险
        blocks:
          - type: paragraph
            body: >-
              价值型肾脏护理的差异化依靠三根支柱：预测型临床智能、与区域肾脏科网络的整合深度，以及已证明的护理总成本节省。Strive Health 使用专有 CareMultiplier 平台和执业护士主导的 Kidney
              Heroes 临床团队，推动主动式临床干预，并报告肾脏护理总成本下降 20%。但竞争壁垒也面临明显运营脆弱性。行业 SWOT 评估指出，主要不利威胁包括客户集中在 Humana 和 Regence
              等有限的全国性健康计划名单上、争夺专业临床和数据科学人才的激烈竞争，以及接入复杂支付方 IT 系统时的高运营摩擦。此外，资金充足的 DaVita 和 Fresenius
              与肾脏科诊所及透析接入点保持根深蒂固的关系，使其能够捆绑临床护理，并通过传统按服务收费渠道获取患者转诊。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
              - CP016
