      - number: '4.4'
        title: 融资扩大能力，但不能证明现金跑道
        blocks:
          - type: paragraph
            body: >-
              最新指定证据报告 2025 年 9 月的 $550M 资本方案，包括 $300M D 轮股权和 $250M 债务。Tracxn 另报六轮融资累计 $606M，Ascension Ventures 则确认
              $166M C
              轮。这些数字不应相加：它们的口径和轮次分类不同，而且已筹融资不等于可用现金。指定证据池中的公开证据没有披露现金余额、月度消耗、债务定价、到期日、契约、抵押物、提款状态、营运资金需求或下一轮触发条件。因此，尽管融资规模可观，资本充足性尚未得到证明，尤其对劳动力密集且承担风险的护理模式而言。
