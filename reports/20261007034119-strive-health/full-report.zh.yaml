      - number: '5.2'
        title: 运营架构与技术基础设施
        blocks:
          - type: paragraph
            body: >-
              Strive 的技术架构是一套可扩展的多层数据和护理协调平台，用于处理复杂的医疗数据管道 [CE006, CE007]。在基础层，Strive 运行企业级云数据仓库和 lakehouse 基础设施，采用
              Amazon Web Services（AWS）组件，包括 Amazon S3 对象存储、Redshift 分析仓库和 Lambda 无服务器计算 [CE006,
              CE008]。该基础设施通过批处理、增量、变更数据捕获和流式模式，摄取、清洗并编排来自医疗和药房保险索赔（claims）、资格名册、实验室结果、电子病历（EHR）馈送以及医院入院 / 出院 /
              转院（ADT）警报的多种入站数据流 [CE007, CE008]。建立在该数据基础设施之上的，是 Strive 专有的 CareMultiplier 分析引擎；它将机器学习算法应用于超过 50M
              份公开患者记录，生成预测风险分层、疾病进展建模和个体化患者洞察 [CE009, CE010]。这些分析洞察通过 API 和双向事件流暴露给基于 Salesforce Health Cloud 构建的 Strive
              互动层，Kidney Hero 护理团队在那里执行个性化护理计划、记录患者触点并管理临床协调工作流 [CE006, CE008, CE010]。
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
