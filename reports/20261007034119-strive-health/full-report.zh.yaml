      - number: '3.2'
        title: 竞争者概况与战略规模
        blocks:
          - type: paragraph
            body: >-
              对竞争者规模和资本支持的评估，凸显肾病管理行业中不同的战略方向。Strive Health 已覆盖全部 50 个州，通过与支付方和提供商分担风险的安排，管理 150,000 名受保人对应的每年约 $5B
              医疗支出。Somatus 和 Monogram Health 等专业纯玩家也获得了大量风险投资和成长型股权支持，以便与商业健康计划和 Medicare Advantage 计划签订下行风险安排。随着 CMS
              价值型模式加快，DaVita 和 Fresenius 推出了整合型肾脏护理项目来守住市场份额；但独立行业评估指出，相较这些根基深厚的机构型透析提供商，Strive 的品牌认知度较低。此外，Vytalize
              Health 和 VirtualHealth 等更广泛的人群健康平台，为 Medicare 人群的风险承担型初级保健和护理协调提供技术替代方案。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
