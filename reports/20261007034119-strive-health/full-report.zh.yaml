      - number: '2.2'
        title: 市场规模视角、增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              要量化技术赋能肾脏护理交付的可服务市场，需要同时考察患者群体患病率和受管理医疗支出池。美国患有肾病的成年人中约 90%
              不知道自己患病，形成一个庞大的沉默人群；标准按服务收费模式往往直到急性肾衰竭发生才接触到他们。肾脏相关并发症导致的住院每次最高可花费
              $15,000，为支付方采用延缓疾病进展、减少再住院的价值型护理管理项目提供了强烈经济激励。

              推动市场增长的关键因素包括健康计划高管管理不断上升医疗损失率的压力加快（2026 年有 52% 的健康计划高管将控制成本列为首要运营重点）、Medicare Advantage
              风险模式扩大，以及提供商薪酬转向按护理总成本计算的共享节余。临床验证也在推动采用：同行评审研究显示，Strive 的护理转衔干预可在 7 天时将再住院减少 42%，并使 3b 期 CKD 的 eGFR
              下降速度减缓 77%。

              但关键采用约束限制了市场获取速度。主要约束包括健康计划漫长的 B2B
              销售周期、将第三方执业护士接入既有肾脏科工作流时的提供商网络摩擦、碎片化电子病历（EHR）平台之间的数据互操作摩擦，以及承担双向下行风险的资本密集度。此外，公开披露没有把管理中医疗支出连接到 Strive
              的确认净收入或贡献利润率，整个市场的收入获取率仍未获验证。
