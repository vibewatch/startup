      - number: '4.3'
        title: 临床劳动力和风险转移使利润率披露不可或缺
        blocks:
          - type: paragraph
            body: >-
              Strive 的模式不是纯软件交付系统。公开描述显示，公司拥有执业护士主导的团队、护理协调员及其他临床专业人员、预测技术，以及包括雇主 401(k)
              匹配和健康支持项目在内的广泛员工福利。这些信息证明公司存在服务交付和劳动力成本基础，但没有量化每位成员成本、临床人员生产率、毛利率、贡献利润率或实施成本。公司称其模式已使护理总成本降低 20%，并创造超过
              $400M 节省，但公开材料未披露群组、测量期间、归因方法和 Strive 留存的经济收益。因此，投资判断需要按渠道建立收入和医疗成本桥接，而不能从节省金额主张外推。
