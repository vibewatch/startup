              - CU002
              - CU006
              - CU007
          - type: callout
            title: 客户集中与合同后持久性不确定
            body: >-
              Strive 报告其管理超过 145,000 名患者对应的近 $5B 医疗支出，但未披露任何可验证的客户群数据来说明客户标识续约、净收入留存率（NRR）或单个健康计划收入份额。在价值型医疗中，一两个主要支付方（如
              Humana 或 Aetna）终止合同，或 CMS 重新校准基准，都会构成关键且未对冲的商业集中风险。
            calloutType: risk
            claimRefs:
              - CU001
              - CU004
              - CU011
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 报销政策与监管风险架构
        blocks:
          - type: paragraph
            body: >-
              Strive Health 处于价值型肾脏护理交付的中心，管理 CKD 和 ESKD 人群每年超过 $5B
              的医疗支出（CR001）。如此庞大的管理中医疗支出，使公司直接暴露于联邦报销公式和监管费率重置。Strive 的临床部署自 2022 绩效年度起扩展至 Center for Medicare and
              Medicaid Innovation（CMMI）的 Comprehensive Kidney Care
              Contracting（CKCC）模式，并成为其中最大的非大型透析组织（non-LDO）参与者（CR002）。因此，Medicare
              基准折扣下调、风险调整方法变化或质量评分门槛变化，都会立即压缩净共享节余或触发共享损失。此外，Strive 在全部 50 个州运营（CR003），其护理团队和 CareMultiplier
              技术受到各州公司行医（CPOM）法规、执业护士执业范围限制和医疗数据隐私标准的约束。监管风险登记册系统性地为这些敞口排序，并确定所需的尽调监测。
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR009
              - CR010
              - CR011
      - number: '7.2'
        title: 运营可靠性、技术可扩展性与护理交付敞口
        blocks:
          - type: paragraph
            body: >-
              Strive Health 的运营执行高度依赖专有预测分析平台 CareMultiplier 与前线多学科护理团队 Kidney Heroes 之间的协调（CR004）。临床团队每天平均完成 900
              次患者就诊，提供旨在防止可避免急诊入院并优化透析转衔的护理协调（CR005）。虽然 Strive 报告了显著临床改善，包括住院减少 41% 和最佳透析启动增加
              85%（CR006），但运营架构仍可能出现临床模型失效。CareMultiplier
              中断或患者分层算法漂移，可能延误紧急干预，导致急诊科出现带来严重医疗成本激增的“撞车式”透析启动。同时，全国范围内执业护士和临床护理协调员招聘受限，威胁临床配比的可持续性；超过 6,500
              个合作提供商之间碎片化的 EHR 整合，也带来数据管道中断风险。
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: 交易对手集中、合作伙伴依赖与资本负担
        blocks:
          - type: paragraph
            body: >-
              Strive Health 的商业模式依赖其与健康计划、医疗系统和肾脏科提供商诊所之间深度的商业与临床合作。公司拥有超过 6,500
              个签约提供商合作伙伴（CR007），因此交易对手集中度和协同仍是关键问题。由于区域健康计划的价值型企业合同需要多年对账周期，终止或不续签前三大区域支付方中的一家合作，便会立即对当地护理团队构成打破投资论点的风险。资本方面，Strive
              完成了由 NEA 领投、CVS Health Ventures 和 CapitalG 战略支持的 $166M C 轮融资（CR008），随后在 2025 年 9 月完成巨额 $550M D
              轮融资（CR009）。虽然这套资本基础提供了运营跑道，但 EquityZen
              等平台上的私募二级市场动态表明，私营公司投资在退出事件前存在结构性流动性不足和重大损失风险（CR010）。公司未公开经审计的债务契约、各业务线贡献利润率和商业续约群组，因此投资前必须进行严格尽调。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
