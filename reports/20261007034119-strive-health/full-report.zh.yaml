      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: 透析巨头的既有壁垒与客户集中
            body: >-
              Strive Health 的增长轨迹面临两方面结构性阻力：根基深厚的透析巨头 DaVita 和 Fresenius 控制着广泛的肾脏科医生转诊漏斗，而 Strive
              的收入模式在主要全国性健康计划合作伙伴之间存在明显客户集中。
            calloutType: risk
