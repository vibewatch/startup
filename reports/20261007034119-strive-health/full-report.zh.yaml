      - number: '2.3'
        title: 买方细分、支付方协同与 GTM 策略
        blocks:
          - type: paragraph
            body: >-
              价值型肾脏护理的采用由三类主要利益相关方推动：承担风险的健康计划和支付方、医疗系统及肾脏科提供商集团，以及自保雇主。健康计划是主要经济预算所有者，通过协作式分担风险合同、按成员按月（PMPM）收取的护理协调费，或与医疗成本下降和质量指标挂钩的共享节余池采购
              Strive 服务。

              提供商合作伙伴包括超过 6,500 名肾脏科医生和初级保健医生，是关键把关者。Strive 直接与肾脏科医生协同时，患者临床参与度最高可提升 34%。对提供商而言，Strive 通过 Kidney Heroes
              跨学科团队充当护理延伸方，而不是外部竞争者。自保雇主则是新兴买方群体，受到灾难性透析理赔（claims）驱动，希望在肾衰竭前用整合的心肺代谢方案处理糖尿病和高血压等慢性共病。

              Strive 的内部市场进入结构反映了这些不同的买方路径：设立专门的产品生命周期管理、面向健康计划的 B2B 营销、拓展临床网络的提供商营销，以及确保受益人持续参与的患者获客和激活活动。
