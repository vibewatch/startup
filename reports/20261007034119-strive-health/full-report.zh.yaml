chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、使命与护理交付模式
        blocks:
          - type: paragraph
            body: >-
              Strive Health 由首席执行官 Chris Riopelle 与创始资本合作方 New Enterprise Associates（NEA）于 2018
              年在科罗拉多州丹佛创立，目标是改造碎片化、被动响应的美国肾脏护理体系。作为一家后期私营医疗企业，Strive
              在灾难性肾衰竭发生前提前介入，处理慢性肾病（CKD）和终末期肾病（ESKD）。其核心运营模式将先进的临床工作流技术与专业跨学科护理团队结合，协调从早期 CKD 3b 期到透析和肾移植阶段的患者管理。

              Strive 不运营交易型门诊血液透析中心，也不按服务收费模式收取设施费，而是通过承担风险和共享节余的安排，与商业支付方、Medicare Advantage 健康计划、Medicare Shared
              Savings Program（MSSP）责任医疗组织及区域医疗系统签约。Strive 的专有 CareMultiplier 技术平台通过 HITRUST 认证，并获 National Committee for
              Quality Assurance（NCQA）授予病例管理和人群健康项目认证。平台把预测型人工智能和临床洞察接入当地初级保健医生与肾脏科医生，减缓疾病进展，管理高血压和糖尿病共病，并预防非计划住院。

              到 2026 年末，Strive 的全国覆盖已扩展至全部 50 个美国州，与超过 6,500 名医疗保健提供商合作，并管理超过 165,000 名归属患者每年 $5.5B
              的医疗支出。凭借技术整合和临床规模，Strive 于 2026 年 9 月连续第二年入选 TIME 和 Statista 评选的 World's Top HealthTech Companies。
