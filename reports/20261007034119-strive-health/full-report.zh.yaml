  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入机制基于风险，但合同经济属于非公开信息
        blocks:
          - type: paragraph
            body: >-
              Strive
              通过与健康计划、Medicare、医疗系统和医生签订灵活的价值型支付安排运营，其中包括承担护理总成本风险的安排。其交付模式把预测分析与高接触、多学科临床团队结合起来，因此经济主张是降低可避免使用率，同时管理归属肾脏患者群体。这解释了机制，却没有建立会计桥梁：审阅的来源没有披露合同单位、风险区间、基准方法、共享节余比例、医疗损失分配或收入确认时点。因此，管理中医疗支出和声称的节余应视为运营敞口和结果指标，而不是收入、ARR、毛利或现金创造。
            claimRefs:
              - CI001
