        - 共享节省分成降低后不续约或重新签约
        - 严重
        - 扩展至 50 个州以分散收入来源
        - 核心区域支付方终止合同时出现局部收入断崖
      - - 透析提供者基础设施
        - 中心内及居家透析机构
        - 高（DaVita 和 Fresenius 主导的 LDO 寡头）
        - 拒绝支持居家透析或及时安排患者
        - 高
        - 不依赖特定提供者的照护协调及居家启动临床倡导
        - ESKD 转换依赖实体透析诊所的可用性
      - - 肾脏科医生网络参与度
        - 独立肾脏科医生及 Strive Care Partners 诊所
        - 覆盖 6,500 名提供者，中等
        - 医生退出参与或抵制协议变更
        - 中
        - 由肾脏科医生主导治理，并以共享节省对齐激励
        - 患者归因爬坡缓慢，协议采用不理想
      - - 资本提供者及债务分层
        - 机构成长股权投资者及私人贷款方（NEA、CVS、CapitalG、Hercules）
        - 股权优先权悬置较高
        - 盈亏平衡前的流动性约束或高额偿债成本
        - 高
        - 2025 年末募集的 $550M Series D 提供了充足流动性缓冲
        - 普通股次级受偿，退出估值门槛提高
    notes: 按交易对手关键程度及商业、临床和金融交易对手的结构性集中风险排序。
