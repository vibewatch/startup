  title: "Product & Technology"
  summary: "Strive Health pairs its proprietary CareMultiplier machine learning and data platform with specialized Kidney Hero clinical care teams to deliver value-based kidney care. Operating atop an enterprise AWS data lakehouse and Salesforce Health Cloud backbone, Strive ingests diverse payer and clinical feeds to predict CKD progression, coordinate multi-specialty interventions, and facilitate home dialysis transitions while managing key integration, compliance, and interoperability risks."
sections:
  - id: "product-definition-and-clinical-workflow"
    title: "Product Definition and Clinical Workflow Delivery"
    body: "Strive Health delivers value-based kidney care through a hybrid model that tightly integrates predictive analytics with specialized clinical workflows across the chronic kidney disease (CKD) and end-stage kidney disease (ESKD) continuum [CE001]. At the core of Strive's offering is a collaborative care-extension model that operates alongside community nephrologists and primary care physicians rather than replacing existing provider relationships [CE002, CE003]. In customer workflow terms, Strive identifies at-risk patients who are progressing toward renal failure, coordinates early interventions, and manages complex comorbidities to prevent emergency dialysis starts and inpatient admissions [CE001, CE004]. Care is delivered on the ground and virtually by Strive's Kidney Heroes multidisciplinary care teams, comprising nurse practitioners, registered nurses, dietitians, and clinical social workers who provide intensive patient education, medication management, and nutritional counseling [CE002, CE004]. To ensure alignment across the healthcare ecosystem, Strive deploys dedicated provider integration teams that conduct on-site workflow assessments and establish standardized clinical and communication protocols [CE003, CE005]."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
      - "CE004"
      - "CE005"
    tableRefs:
      - "TE002"
    figureRefs: []
  - id: "architecture-data-platform-and-tech-stack"
    title: "Operating Architecture and Technology Infrastructure"
    body: "Strive's technical architecture is organized into a scalable, multi-tier data and care coordination platform designed to handle complex healthcare data pipelines [CE006, CE007]. At the foundation layer, Strive operates an enterprise cloud data warehouse and lakehouse infrastructure leveraging Amazon Web Services (AWS) components including Amazon S3 object storage, Redshift analytical warehousing, and Lambda serverless compute [CE006, CE008]. This infrastructure ingests, cleanses, and orchestrates diverse inbound data streams across medical and pharmacy claims, eligibility rosters, laboratory results, electronic health record (EHR) feeds, and hospital Admit, Discharge, Transfer (ADT) alerts using batch, incremental, change-data-capture, and streaming patterns [CE007, CE008]. Resting on this data infrastructure is Strive's proprietary CareMultiplier analytics engine, which applies machine learning algorithms trained on over 50 million public patient records to generate predictive risk stratification, disease progression modeling, and individualized patient insights [CE009, CE010]. These analytical insights are exposed via APIs and bidirectional event streams into Strive's engagement layer, built on Salesforce Health Cloud, where Kidney Hero care teams execute personalized care plans, log patient touchpoints, and manage clinical coordination workflows [CE006, CE008, CE010]."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
  - id: "deployment-integration-governance-and-differentiation"
    title: "Deployment, Interoperability, Governance, and Differentiation"
    body: "Deploying Strive's platform within complex healthcare systems requires extensive integration across disparate EHR platforms, payer claim files, and clearinghouse interfaces [CE003, CE007]. Strive addresses interoperability through HL7, FHIR, and standardized data exchange interfaces, backed by dedicated data governance frameworks that enforce lineage tracking, data contracts, and automated schema reconciliation [CE007, CE008]. Technical differentiation stems from the company's proprietary longitudinal kidney disease datasets, specialized predictive feature pipelines, and deep operational integration between automated algorithmic triggers and human clinical teams [CE002, CE009]. However, because kidney care relies heavily on sensitive Protected Health Information (PHI) across multi-tenant payer and provider networks, architecture and operations are strictly governed by HIPAA and HITRUST compliance standards [CE006, CE007]. Technical and operational risks center on claims data latency, EHR fragmentation among independent nephrology practices, and the continuous engineering burden of maintaining reliable data observability across hundreds of heterogeneous inbound partner streams [CE007, CE008]."
    claimRefs:
      - "CE002"
      - "CE003"
      - "CE006"
      - "CE007"
      - "CE008"
      - "CE009"
    tableRefs:
      - "TE001"
    figureRefs: []
