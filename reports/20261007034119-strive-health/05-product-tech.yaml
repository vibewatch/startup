callouts:
  - calloutType: "insight"
    title: "Dual Core Architecture: AWS Data Lakehouse and Salesforce Health Cloud"
    body: "Strive Health avoids building a proprietary transactional EHR from scratch. Instead, it pairs an enterprise AWS data lakehouse (S3, Redshift, Lambda) with a heavily customized Salesforce Health Cloud frontend. This design optimizes both big-data analytical modeling and robust clinical CRM workflows for Kidney Heroes while concentrating software engineering on data governance, predictive ML, and interoperability."
    claimRefs:
      - "CE006"
      - "CE007"
      - "CE008"
  - calloutType: "risk"
    title: "Heterogeneous Inbound Data Latency and Schema Volatility"
    body: "Strive's predictive intelligence relies critically on multi-source ingestion spanning claims, clinical EHRs, and hospital ADT feeds. Because claims data frequently exhibits 30- to 90-day adjudicated reporting lags, Strive's real-time intervention engine faces risks of delayed detection unless hospital ADT feeds and local practice EHR connections maintain uninterrupted synchronization."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE011"
