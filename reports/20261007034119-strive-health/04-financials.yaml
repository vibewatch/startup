schemaVersion: "report-v2"
artifact: financials
slug: strive-health
runDate: 2026-10-07
company:
  name: Strive Health
chapter:
  number: 4
  title: Financials
  summary: >-
    Strive's public financial profile is defined more clearly by at-risk medical-spend
    exposure, care-delivery scale, and recent financing than by recognized revenue or
    margin disclosure. The evidence supports a scaled value-based care model, but
    pricing, revenue recognition, gross margin, cash, burn, runway, and debt terms
    remain material underwriting gaps.
sections:
  - id: revenue-mechanics
    title: Revenue mechanics are risk-based, but contract economics are private
    body: >-
      Strive operates through flexible value-based payment arrangements with health
      plans, Medicare, health systems, and physicians, including arrangements where
      it assumes total cost-of-care risk. Its delivery model combines predictive
      analytics with high-touch, multidisciplinary clinical teams, so the economic
      proposition is to lower avoidable utilization while managing attributed kidney
      populations. That establishes the mechanism but not the accounting bridge:
      the reviewed sources do not disclose contract units, risk corridors, benchmark
      methodology, shared-savings percentages, medical-loss allocation, or the timing
      of revenue recognition. Consequently, managed medical spend and claimed savings
      should be treated as operating exposure and outcome indicators, not as revenue,
      ARR, gross profit, or cash generation.
    claimRefs: [CI001, CI002, CI015, CI016]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: traction-and-monetization
    title: Scale is visible; monetization quality is not
    body: >-
      The strongest current scale disclosure is company-issued: more than 145,000
      supported people, over 6,500 provider partners, nearly $5 billion of annual
      medical spend under management, and roughly 900 patient visits per day. A 2022
      customer announcement provides an earlier external anchor, describing an Ohio
      deployment for nearly 8,000 patients and stating that Strive then managed more
      than 50,000 patients. These measures show meaningful delivery and distribution
      breadth, but none is a recognized-revenue denominator. AskCyborg reports $147
      million of revenue without a period, accounting basis, or methodology in the
      reviewed preview, so that figure is directional third-party data rather than an
      underwritable run rate.
    claimRefs: [CI003, CI004, CI005, CI006, CI011, CI012, CI013, CI016]
    tableRefs: [TI002]
  - id: cost-and-unit-economics
    title: Clinical labor and risk transfer make margin disclosure essential
    body: >-
      Strive's model is not a pure software delivery system. Public descriptions show
      nurse-practitioner-led teams, care coordinators and other clinical disciplines,
      predictive technology, and a broad employee-benefits package that includes an
      employer 401(k) match and health-support programs. These are evidence of a
      service-delivery and labor cost base, but they do not quantify cost per member,
      clinician productivity, gross margin, contribution margin, or implementation
      cost. The company says its model has reduced total cost of care by 20% and
      generated more than $400 million of savings, but public materials omit cohort,
      measurement period, attribution method, and Strive's retained economics.
      Underwriting therefore requires channel-level revenue and medical-cost bridges,
      not extrapolation from savings claims.
    claimRefs: [CI002, CI007, CI014, CI015, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Financing expands capacity but does not establish runway
    body: >-
      The latest assigned evidence reports a September 2025 capital package of $550
      million, comprising $300 million of Series D equity and $250 million of debt.
      Tracxn separately reports $606 million raised across six rounds, while Ascension
      Ventures confirms a $166 million Series C. These figures should not be summed:
      they use different scopes and round classifications, and funding raised is not
      cash available. Public evidence in the assigned pool does not disclose cash on
      hand, monthly burn, debt pricing, maturity, covenants, collateral, draw status,
      working-capital needs, or a next-round trigger. Capital adequacy therefore
      remains unproven despite substantial financing, particularly for a labor- and
      risk-bearing care model.
    claimRefs: [CI008, CI009, CI010, CI016]
tables:
  - id: TI001
    title: Revenue streams and economic mechanisms
    columns:
      - Stream
      - Mechanism
      - Public unit or status
      - Revenue quality
      - Priority diligence ask
    rows:
      - - Health-plan arrangements
        - Flexible value-based payment, including total cost-of-care risk
        - Contract unit not disclosed
        - Mechanism supported; recognized revenue and risk corridor unknown
        - Obtain contracts, benchmark formulas, risk caps, and revenue-recognition policy
      - - Medicare and CKCC participation
        - Kidney-population management under public-program participation
        - CKCC participation disclosed; economics not disclosed
        - Program participation is not evidence of retained savings or margin
        - Reconcile benchmark, quality gates, attribution, and settlement timing
      - - Health-system and provider partnerships
        - Integrated clinical care and population-health services
        - Nearly 8,000 patients in the 2022 Bon Secours Mercy Health launch
        - Customer deployment supported; price and contract duration unavailable
        - Obtain PMPM, case-rate, shared-savings, or other realized contract terms
      - - Care delivery and analytics
        - Multidisciplinary teams supported by predictive analytics
        - More than 145,000 people supported in the 2025 company disclosure
        - Operating scale is visible but cannot be converted to revenue
        - Bridge attributed lives and visits to billable or risk-adjusted revenue
    notes: >-
      Partial public view as of 2026-10-07; mechanisms and operating scale are sourced,
      while contract pricing, realized rates, recognition timing, and mix are not disclosed.
    claimRefs: [CI001, CI002, CI004, CI011]
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Channel
      - Public price or unit
      - List versus realized
      - What the evidence establishes
      - Missing underwriting input
    rows:
      - - Commercial and Medicare Advantage payors
        - Not disclosed
        - Neither list nor realized pricing is public
        - Flexible value-based arrangements can include total cost-of-care risk
        - PMPM, percentage of savings, downside-risk cap, and contract duration
      - - Health systems and physicians
        - Not disclosed
        - Realized economics are private
        - A customer source confirms a deployed population-health relationship
        - Implementation fees, ongoing service price, renewals, and concentration
      - - Public-program participation
        - Not disclosed
        - Benchmark and settlement economics are unavailable
        - Company history confirms CKCC participation
        - Attribution, benchmark discount, quality adjustment, and settlement lag
    notes: >-
      No public list-price schedule or realized contract rate appeared in the assigned
      evidence; "not disclosed" is a gap, not a zero value.
    claimRefs: [CI001, CI011, CI012]
  - id: TI003
    title: Unit-economics and capital inputs
    columns:
      - Metric
      - Public value or status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Reported revenue
        - $147 million, with no period or methodology in the reviewed preview
        - Low
        - Cannot be treated as ARR or a current run rate
        - Obtain audited revenue by period, channel, and recognition method
      - - Annual medical spend managed
        - Nearly $5 billion, company-claimed for 2025
        - Medium
        - Measures risk exposure, not recognized revenue
        - Bridge spend under management to at-risk share and recognized revenue
      - - Supported population
        - More than 145,000 people, company-claimed for 2025
        - Medium
        - Potential denominator for revenue and care-delivery intensity
        - Provide attributed-member months, eligibility churn, and revenue per member
      - - Patient visits
        - Average of 900 per day, company-claimed for 2025
        - Medium
        - Proxy for clinical utilization and labor intensity
        - Provide visits per clinical FTE and fully loaded cost per visit
      - - Partner savings
        - More than $400 million, company-claimed cumulative amount
        - Medium
        - Supports buyer value but not Strive's retained economics
        - Provide cohort, baseline, period, validation, and Strive's economic share
      - - Total cost-of-care reduction
        - 20%, company-claimed and repeated by an analyst preview
        - Medium
        - Central to performance economics and renewal quality
        - Provide matched cohorts, measurement window, attribution, and contract impact
      - - Cash, burn, runway, gross margin, and debt terms
        - Not disclosed in the assigned evidence
        - Low
        - Prevents capital-adequacy and contribution-margin underwriting
        - Obtain audited statements, cash bridge, forecast, debt agreement, and covenants
    notes: >-
      Values are public claims or third-party reports, not audited results. Medical spend,
      patient counts, visits, savings, and funding must not be substituted for revenue,
      gross profit, cash, burn, or runway.
    claimRefs: [CI003, CI004, CI006, CI007, CI008, CI013, CI015, CI016]
figures:
  - id: FI001
    title: Revenue model bridge and disclosure break
    type: flow
    summary: >-
      Public evidence describes the operating pathway through savings, but the bridge
      from contract activity to recognized revenue and gross profit remains undisclosed.
    data:
      nodes:
        - id: contract
          label: Payor or provider contract
          detail: Flexible value-based terms; public unit pricing is unavailable.
        - id: population
          label: Attributed kidney population
          detail: More than 145,000 people supported in the 2025 company disclosure.
        - id: spend
          label: Medical-spend responsibility
          detail: Nearly $5 billion in annual medical spend managed; this is not revenue.
        - id: intervention
          label: Clinical and analytics delivery
          detail: High-touch multidisciplinary teams use predictive analytics.
        - id: outcomes
          label: Utilization and savings outcomes
          detail: Company claims 20% lower total cost of care and more than $400 million in savings.
        - id: accounting
          label: Recognized revenue and gross profit
          detail: Contract rates, recognition, risk settlement, and contribution margin are undisclosed.
    approximationNotes: >-
      Ordered conceptual flow only; it does not imply proportional values, timing, or a
      disclosed accounting formula.
    claimRefs: [CI001, CI002, CI003, CI007, CI015, CI016]
callouts:
  - calloutType: risk
    title: Managed spend is not revenue
    body: >-
      Nearly $5 billion of annual medical spend is an exposure denominator. Without
      contract economics and recognition policy, it cannot support a revenue, ARR,
      gross-profit, or valuation-multiple calculation.
    claimRefs: [CI003, CI016]
  - calloutType: recommendation
    title: Gate underwriting on a channel-level financial bridge
    body: >-
      Require audited revenue, gross margin, medical-cost performance, retained savings,
      cash, burn, and debt terms by channel before treating scale or financing as evidence
      of durable unit economics.
    claimRefs: [CI001, CI008, CI013, CI016]
