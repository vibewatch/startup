company:
  name: "Strive Health"
chapter:
  number: 8
  title: "Valuation"
  summary: "Strive Health reports meaningful national scale and a September 2025 capital raise, but the retained public evidence does not disclose a transaction valuation, audited revenue, margins, debt terms, or preference stack. The evidence supports a research-more recommendation, high risk rating, and an unpriceable valuation stance rather than a fabricated entry range."
sections:
  - id: "recommendation-and-financing"
    title: "Recommendation and Financing Context"
    body: |-
      The public-only recommendation is research-more, with medium analytical confidence, high risk, and an unpriceable valuation stance. Strive says it announced a $550 million capital raise in September 2025, while the Parsers.vc news aggregation separates that total into $300 million of Series D equity and $250 million of debt. That financing demonstrates access to capital, but funding raised is not cash available and the total financing amount is not a transaction valuation. The retained pages provide no share price, post-money value, debt pricing, maturity, covenants, collateral, liquidation preferences, or dilution terms. Entry price, target return, hold period, and exit proceeds therefore cannot be responsibly calculated from this evidence set.
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV010"
      - "CV011"
      - "CV014"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "thesis-and-anti-thesis"
    title: "Thesis and Anti-Thesis"
    body: |-
      The thesis is that Strive addresses a large care need with a model that combines payer and provider relationships, clinical teams, predictive analytics, and national reach. Company-issued evidence says it supports more than 145,000 people in all 50 states, works with more than 6,500 providers, manages nearly $5 billion of annual medical spend, and has generated more than $400 million of savings for partners. Those figures indicate operating relevance, but they are not audited revenue, margin, retention, or cash-flow measures. The anti-thesis is therefore economic rather than purely clinical: a large attributed-spend base can coexist with weak take rates or labor-intensive delivery. A 2026 news feed also relays a sector-level PHTI assessment critical of virtual CKD management, but the retained excerpt does not establish that Strive was one of the evaluated products.
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV009"
      - "CV014"
      - "CV015"
    tableRefs:
      - "TV002"
  - id: "scenarios-and-comparables"
    title: "Scenario Framework and Comparable Limits"
    body: |-
      A milestone-gated framework is more defensible than a revenue multiple because the assigned evidence pool contains no usable public-company multiple, private transaction value, or M&A consideration tied to comparable economics. The aVenture fetch contains only its page title, and Seedtable lists a January 2025 last-funding date without an amount, making that record stale against Strive's later September 2025 announcement. Bull, base, and bear cases can still identify what must become true, but none supports a numeric valuation range today. The bull case requires audited unit economics and favorable capital terms; the base case preserves scale while financial visibility remains absent; the bear case combines weak economic proof, debt seniority, and sector efficacy scrutiny. Price discovery should follow, not precede, verified revenue, margin, retention, and cap-table evidence.
    claimRefs:
      - "CV001"
      - "CV012"
      - "CV013"
      - "CV014"
      - "CV015"
      - "CV016"
    tableRefs:
      - "TV003"
  - id: "exit-readiness-and-diligence"
    title: "Exit Readiness and Final Diligence"
    body: |-
      Exit readiness is not established by the retained public record. Neither an IPO path nor a strategic sale value can be underwritten without audited financial statements, cohort retention, contract concentration, contribution margin, cash burn, and the rights attached to the equity and debt stack. The immediate diligence sequence is to reconcile managed medical spend to recognized revenue and cash collections; test margins by payer, provider, and contract vintage; review the debt agreement and preference waterfall; and compare the resulting economics with contemporaneous transactions selected on the same risk-bearing model. The thesis breaks if verified economics show structurally negative contribution margins, concentrated renewals fail, debt terms materially subordinate new equity, or independent outcome evidence does not reproduce company-reported savings. A priced investment should wait until those gates are closed.
    claimRefs:
      - "CV005"
      - "CV006"
      - "CV009"
      - "CV014"
      - "CV015"
      - "CV016"
