callouts:
  - calloutType: insight
    title: Upstream Intervention as an Economic Decoupling Strategy
    body: Value-based kidney care fundamentally decouples healthcare spending from dialysis machine hours. By deploying multidisciplinary teams upstream to slow eGFR decline by up to 77% in Stage 3b CKD, Strive Health aims to preserve residual kidney function and compress acute hospital readmissions, transforming high-cost catastrophic episodes into managed outpatient care.
    claimRefs:
      - CM001
      - CM008
      - CM010
