  title: Market Analysis
  summary: Strive Health operates at the intersection of value-based kidney care delivery, population health management, and cardiometabolic risk-bearing arrangements across commercial, Medicare Advantage, and Medicare populations. The company addresses a large addressable market constrained by fragmented provider workflows, silent disease progression, and complex payer-provider risk-sharing dynamics, managing $5.5 billion in medical spend across 165,000 patients and 6,500 provider partners.
sections:
  - id: market-boundary-and-scope
    title: Market Boundary and Total Addressable Spend
    body: |
      The market for value-based kidney care targets patients progressing along the continuum from early Chronic Kidney Disease (CKD Stage 3b and Stage 4) to End-Stage Kidney Disease (ESKD). Strive Health structures its commercial offerings around managing total cost of care rather than serving as a conventional fee-for-service dialysis provider. This boundary explicitly encompasses upstream care coordination, nurse-practitioner-led multispecialty care teams, predictive clinical decision support via its CareMultiplier platform, and transitions of care management designed to prevent avoidable hospital readmissions and emergency dialysis starts.

      Included spend within Strive's serviceable market comprises total medical spend for attributed CKD and ESKD beneficiaries across Medicare Advantage, commercial health plans, Medicare Shared Savings Programs (MSSP), and Accountable Care Organization (ACO) models. Excluded spend includes standalone outpatient dialysis center facility fees, pharmaceutical manufacturing costs for immunosuppressants and calcimimetics, and unmanaged acute hospital surgical fees where risk-bearing arrangements are absent. Strive currently manages $5.5 billion in medical spend under management across 165,000 patients, demonstrating substantial market footprint while remaining a fraction of the tens of billions in total annual U.S. kidney care expenditure. Status-quo substitutes remain predominantly transactional fee-for-service nephrology visits, uncoordinated primary care management, and late-stage reactive dialysis initiation by incumbent dialysis center networks.
    claimRefs:
      - CM001
      - CM002
      - CM004
      - CM007
      - CM011
      - CM014
    tableRefs:
      - TM001
    figureRefs:
      - FM001
  - id: sizing-lenses-and-market-dynamics
    title: Sizing Lenses, Growth Drivers, and Adoption Constraints
    body: |
      Quantifying the addressable market for technology-enabled kidney care delivery requires examining patient population prevalence alongside managed medical spend pools. Approximately 90% of U.S. adults with kidney disease remain unaware of their condition, creating a massive silent cohort that standard fee-for-service models fail to engage until acute renal failure occurs. Hospital admissions for kidney-related complications can cost up to $15,000 per episode, creating compelling economic incentives for payers to adopt value-based care management programs that delay progression and reduce readmissions.

      Key growth drivers propelling the market include accelerating health plan executive pressure to manage rising medical loss ratios (with 52% of health plan executives citing cost containment as their top operational priority in 2026), expanding Medicare Advantage risk models, and shifting provider compensation toward total cost-of-care shared savings. Clinical validation further drives adoption: peer-reviewed studies show Strive's transitions-of-care intervention reduces hospital readmissions by 42% at 7 days and slows eGFR decline in Stage 3b CKD by 77%.

      However, critical adoption constraints limit the velocity of market capture. Primary constraints include prolonged B2B sales cycles for health plans, provider network friction when integrating third-party nurse practitioners into established nephrology workflows, data interoperability friction across fragmented electronic health record (EHR) platforms, and the capital intensity of taking two-sided downside risk. Furthermore, public disclosures do not bridge managed medical spend to Strive's recognized net revenue or contribution margin, leaving market-wide revenue capture rates unverified.
    claimRefs:
      - CM003
      - CM005
      - CM008
      - CM009
      - CM010
      - CM012
      - CM013
      - CM016
    tableRefs:
      - TM002
  - id: buyer-segmentation-and-procurement
    title: Buyer Segmentation, Payer Alignment, and GTM Strategy
    body: |
      Adoption in value-based kidney care is mediated by three primary stakeholder segments: risk-bearing health plans and payers, health systems and nephrology provider groups, and self-insured employers. Health plans represent the primary economic budget owners, procuring Strive through collaborative shared-risk contracts, administrative per-member-per-month (PMPM) care coordination fees, or shared savings pools tied to medical cost reduction and quality metrics.

      Provider partners, encompassing over 6,500 nephrologists and primary care physicians, act as essential gatekeepers. When Strive aligns directly with nephrologists, patient clinical engagement increases by up to 34%. For providers, Strive operates as a care extender via its Kidney Heroes interdisciplinary teams rather than an external competitor. Self-insured employers represent an emerging buyer segment driven by catastrophic dialysis claims, seeking integrated cardio-pulmonary-metabolic solutions that address chronic comorbidities like diabetes and hypertension before renal failure.

      Strive's internal go-to-market structure reflects these distinct buyer journeys, maintaining dedicated product lifecycle management, B2B marketing targeting health plans, provider marketing to expand clinical networks, and patient acquisition and activation campaigns to secure sustained beneficiary participation.
    claimRefs:
      - CM002
      - CM006
      - CM007
      - CM010
