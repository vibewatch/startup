        - Medicare Advantage, ESRD Seamless Care Organizations (ESCOs)
        - High-cost catastrophic spend pool managed under risk-sharing agreements
      - - Technology & Clinical Decision Support
        - CareMultiplier machine-learning platform licenses, risk stratification data services
        - General hospital EHR licensing, consumer wearable hardware
        - Integrated health systems, payer medical management divisions
        - Proprietary analytics foundation enabling clinical workflow integration
