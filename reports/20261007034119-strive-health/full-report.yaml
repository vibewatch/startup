  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Total Addressable Spend
        blocks:
          - type: paragraph
            body: >
              The market for value-based kidney care targets patients progressing along the continuum from early Chronic
              Kidney Disease (CKD Stage 3b and Stage 4) to End-Stage Kidney Disease (ESKD). Strive Health structures its
              commercial offerings around managing total cost of care rather than serving as a conventional
              fee-for-service dialysis provider. This boundary explicitly encompasses upstream care coordination,
              nurse-practitioner-led multispecialty care teams, predictive clinical decision support via its
              CareMultiplier platform, and transitions of care management designed to prevent avoidable hospital
              readmissions and emergency dialysis starts.


              Included spend within Strive's serviceable market comprises total medical spend for attributed CKD and
              ESKD beneficiaries across Medicare Advantage, commercial health plans, Medicare Shared Savings Programs
              (MSSP), and Accountable Care Organization (ACO) models. Excluded spend includes standalone outpatient
              dialysis center facility fees, pharmaceutical manufacturing costs for immunosuppressants and
              calcimimetics, and unmanaged acute hospital surgical fees where risk-bearing arrangements are absent.
              Strive currently manages $5.5 billion in medical spend under management across 165,000 patients,
              demonstrating substantial market footprint while remaining a fraction of the tens of billions in total
              annual U.S. kidney care expenditure. Status-quo substitutes remain predominantly transactional
              fee-for-service nephrology visits, uncoordinated primary care management, and late-stage reactive dialysis
              initiation by incumbent dialysis center networks.
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM007
              - CM011
              - CM014
