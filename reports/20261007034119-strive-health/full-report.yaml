      - number: '3.3'
        title: Moat Durability, Switching Costs, and Adverse Competitive Risks
        blocks:
          - type: paragraph
            body: >-
              Differentiation in value-based kidney care relies on three core pillars: predictive clinical intelligence,
              integration depth with regional nephrology networks, and demonstrated total cost-of-care savings. Strive
              Health utilizes its proprietary CareMultiplier platform and nurse practitioner-led Kidney Heroes clinical
              teams to drive proactive clinical interventions and reported 20% reductions in total kidney care costs.
              However, competitive moats face meaningful operational vulnerabilities. Industry SWOT assessments identify
              significant adverse threats, including customer concentration across a limited roster of national health
              plans such as Humana and Regence, intense competition for specialized clinical and data science personnel,
              and heavy operational friction in onboarding complex payer IT systems. Furthermore, well-capitalized
              dialysis conglomerates DaVita and Fresenius possess entrenched relationships with nephrology practices and
              dialysis access points, enabling them to bundle clinical care and capture patient referrals across
              traditional fee-for-service channels.
