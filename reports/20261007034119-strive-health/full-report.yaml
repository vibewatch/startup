      - - Operating scale
        - Company reports 145,000+ people, 6,500+ providers, and nearly $5B of annual medical spend
        - Medical spend is a denominator, not Strive revenue, ARR, or cash flow
        - Audited bridge from attributed spend to revenue, savings share, collections, and margin
      - - Capital access
        - $550M total financing indicates investor and lender support
        - $250M of reported debt may add seniority, covenants, and dilution pressure
        - Executed debt documents, cap table, preference waterfall, and pro forma ownership
