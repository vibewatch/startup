            management and education.
        - label: 4. Comorbidity & Dialysis Planning
          detail: >-
            Care teams coordinate complex chronic conditions like heart failure while planning optimal home dialysis or
            preemptive transplants.
        - label: 5. Clinical & Economic Outcome Realization
          detail: >-
