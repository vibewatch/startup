      - number: '5.3'
        title: Deployment, Interoperability, Governance, and Differentiation
        blocks:
          - type: paragraph
            body: >-
              Deploying Strive's platform within complex healthcare systems requires extensive integration across
              disparate EHR platforms, payer claim files, and clearinghouse interfaces [CE003, CE007]. Strive addresses
              interoperability through HL7, FHIR, and standardized data exchange interfaces, backed by dedicated data
              governance frameworks that enforce lineage tracking, data contracts, and automated schema reconciliation
              [CE007, CE008]. Technical differentiation stems from the company's proprietary longitudinal kidney disease
              datasets, specialized predictive feature pipelines, and deep operational integration between automated
              algorithmic triggers and human clinical teams [CE002, CE009]. However, because kidney care relies heavily
              on sensitive Protected Health Information (PHI) across multi-tenant payer and provider networks,
              architecture and operations are strictly governed by HIPAA and HITRUST compliance standards [CE006,
              CE007]. Technical and operational risks center on claims data latency, EHR fragmentation among independent
              nephrology practices, and the continuous engineering burden of maintaining reliable data observability
              across hundreds of heterogeneous inbound partner streams [CE007, CE008].
            claimRefs:
              - CE002
              - CE003
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE001
            claimRefs:
              - CE003
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Dual Core Architecture: AWS Data Lakehouse and Salesforce Health Cloud'
            body: >-
              Strive Health avoids building a proprietary transactional EHR from scratch. Instead, it pairs an
              enterprise AWS data lakehouse (S3, Redshift, Lambda) with a heavily customized Salesforce Health Cloud
              frontend. This design optimizes both big-data analytical modeling and robust clinical CRM workflows for
              Kidney Heroes while concentrating software engineering on data governance, predictive ML, and
              interoperability.
            calloutType: insight
            claimRefs:
              - CE006
              - CE007
              - CE008
          - type: callout
            title: Heterogeneous Inbound Data Latency and Schema Volatility
            body: >-
              Strive's predictive intelligence relies critically on multi-source ingestion spanning claims, clinical
              EHRs, and hospital ADT feeds. Because claims data frequently exhibits 30- to 90-day adjudicated reporting
              lags, Strive's real-time intervention engine faces risks of delayed detection unless hospital ADT feeds
              and local practice EHR connections maintain uninterrupted synchronization.
            calloutType: risk
            claimRefs:
              - CE007
              - CE008
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Payer-Provider Alignment
        blocks:
          - type: paragraph
            body: >-
              Strive Health operates a dual-sided value-based customer model that aligns risk-bearing health plans with
              local nephrologists and health systems [CU001, CU006]. The primary commercial payers encompass Medicare
              Advantage plans, commercial health insurers, state Medicaid managed care organizations, and the Centers
              for Medicare & Medicaid Services (CMS) Innovation Center through Comprehensive Kidney Care Contracting
              (CKCC) within the Kidney Care Choices (KCC) model [CU001, CU008]. On the provider side, Strive partners
              with over 6,500 healthcare providers across all 50 states, including more than 700 community nephrologists
              who act as lead clinicians in value-based risk arrangements [CU002, CU007]. Commercial arrangements are
              structured through flexible value-based contracts, ranging from shared-savings programs to full-risk
              capitation where Strive assumes financial accountability for total cost of care across high-cost chronic
              kidney disease (CKD) and end-stage renal disease (ESKD) cohorts [CU001, CU006]. Under Strive Care
              Partners, independent nephrology practices access risk infrastructure, delegated clinical care
              coordinators, and predictive risk stratification without shouldering unilateral actuarial liabilities
              [CU006].
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU009
              - CU010
      - number: '6.2'
        title: Adoption Trajectory, Managed Spend, and Patient Scaling
        blocks:
          - type: paragraph
            body: >-
              Strive's commercial adoption trajectory has expanded rapidly across geographic reach, provider networks,
              and covered patient populations [CU002, CU003]. From serving 80,000 CKD and ESRD patients across 30 states
              in 2023, the platform expanded its active care base to over 145,000 patients spanning all 50 states,
              reflecting steady national deployment across Medicare and commercial books of business [CU002, CU003].
              Associated annual medical spend under management reached nearly $5 billion, scaling Strive into one of the
              largest specialized value-based kidney care platforms in the United States [CU002, CU004]. Operational
              execution is supported by an internal workforce exceeding 700 employees, deploying multidisciplinary
              Kidney Hero care teams that have conducted more than 1.3 million longitudinal patient touchpoints since
              company inception [CU002, CU005]. Furthermore, Strive has broadened its commercial scope upstream and
              across adjacent comorbid populations, extending risk-managed clinical interventions into high-cost
              conditions such as congestive heart failure (CHF) to capture holistic cost-of-care savings [CU001].
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU007
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU008
      - number: '6.3'
        title: Named Customer Proof, Clinical Outcomes, and Concentration Risks
        blocks:
          - type: paragraph
            body: >-
              Strive has secured enterprise partnerships across major national health plans, regional Medicare Advantage
              plans, risk-bearing primary care clinic networks, and integrated health systems [CU001, CU009]. Key
              customer deployments include Humana, Aetna, regional Blue Cross Blue Shield affiliates, Oak Street Health,
              Zing Health, and Catholic health system Trinity Health [CU001, CU009, CU010]. In clinical and economic
              outcomes, Strive reports major cost-of-care reductions exceeding 20%, a 41% reduction in hospitalizations,
              a five-fold increase in preemptive kidney transplants in targeted markets, and cumulative partner cost
              savings exceeding $400 million [CU005]. In primary care integration, Strive's multi-year contract with Oak
              Street Health focuses on advanced CKD Stage 4 through ESKD patients across clinic locations [CU009]. In
              specialized Medicare Advantage, Strive expanded with Zing Health across Ohio, Tennessee, and Mississippi
              to manage chronically ill populations [CU009]. Despite these reported proof points, Strive does not
              disclose logo retention, Net Revenue Retention (NRR), Gross Revenue Retention (GRR), or individual payer
              revenue shares, creating significant diligence uncertainty regarding customer concentration and
              post-contract durability [CU011, CU012].
            claimRefs:
              - CU001
              - CU005
              - CU009
              - CU010
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
              - CU009
              - CU010
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Dual Payer-Provider Alignment Model
            body: >-
              Strive Health overcomes the classic value-based healthcare adoption bottleneck by simultaneously aligning
              commercial payers and independent nephrologists. By acting as a clinical care extender rather than a
              competing physician practice, Strive gains access to 700+ community nephrologists who actively enroll
              patients into shared-risk programs.
            calloutType: insight
            claimRefs:
              - CU001
              - CU002
              - CU006
              - CU007
          - type: callout
            title: Customer Concentration and Post-Contract Durability Uncertainty
            body: >-
              While Strive reports managing nearly $5 billion in medical spend across over 145,000 patients, it
              discloses zero verifiable cohort data on logo renewal, Net Revenue Retention (NRR), or individual health
              plan revenue shares. In value-based healthcare, contract terminations by one or two major payers (such as
              Humana or Aetna) or CMS benchmark recalibrations represent critical unhedged commercial concentration
              risks.
            calloutType: risk
            claimRefs:
              - CU001
              - CU004
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Reimbursement Policy and Regulatory Risk Architecture
        blocks:
          - type: paragraph
            body: >-
              Strive Health operates at the center of value-based kidney care delivery, managing over $5 billion in
              annual medical spend across chronic kidney disease (CKD) and end-stage kidney disease (ESKD) populations
              (CR001). This massive managed medical spend creates direct vulnerability to federal reimbursement formulas
              and regulatory rate resets. Strive's clinical deployment expanded under the Center for Medicare and
              Medicaid Innovation (CMMI) Comprehensive Kidney Care Contracting (CKCC) model starting in Performance Year
              2022 as the largest non-large dialysis organization (non-LDO) participant (CR002). Consequently, any
              downward revision to Medicare benchmark discounts, risk adjustment methodology changes, or quality scoring
              thresholds immediately compresses net shared savings or triggers shared losses. Furthermore, Strive
              operates across all 50 states (CR003), subjecting its care teams and CareMultiplier technology to diverse
              state-level corporate practice of medicine (CPOM) statutes, nurse practitioner scope-of-practice
              limitations, and healthcare data privacy standards. The regulatory risk register systematically ranks
              these exposures and identifies required diligence monitoring.
            claimRefs:
              - CR001
              - CR002
              - CR003
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR010
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR009
              - CR010
              - CR011
      - number: '7.2'
        title: Operational Reliability, Tech Scalability, and Care Delivery Exposure
        blocks:
          - type: paragraph
            body: >-
              Operational execution at Strive Health relies heavily on the coordination between its proprietary
              predictive analytics platform CareMultiplier and frontline multidisciplinary care teams known as Kidney
              Heroes (CR004). The clinical team conducts an average of 900 patient visits daily, providing care
              coordination aimed at preventing avoidable emergency admissions and optimizing dialysis transitions
              (CR005). Although Strive reports substantial clinical improvements—including a 41% reduction in
              hospitalizations and an 85% increase in optimal dialysis starts (CR006)—the operational architecture
              remains susceptible to clinical model failure modes. A software outage or algorithmic drift in
              CareMultiplier patient stratification could delay urgent interventions, leading to emergency department
              'crash' dialysis starts that carry severe medical cost spikes. Simultaneously, nationwide nurse
              practitioner and clinical care coordinator hiring constraints threaten clinical ratio sustainability,
              while fragmented electronic health record (EHR) integrations across over 6,500 partner providers introduce
              data pipeline disruption risks.
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR002
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: Counterparty Concentration, Partner Dependencies, and Capital Overhang
        blocks:
          - type: paragraph
            body: >-
              Strive Health's business model depends on deep commercial and clinical partnerships across health plans,
              health systems, and nephrology provider practices. With over 6,500 contracted provider partners (CR007),
              counterparty concentration and alignment remain vital concerns. Because value-based enterprise contracts
              with regional health plans require multi-year reconciliation cycles, termination or non-renewal of a
              top-three regional payer partnership represents an immediate thesis-break risk for localized care teams.
              On the capitalization side, Strive completed a $166 million Series C financing led by NEA with strategic
              backing from CVS Health Ventures and CapitalG (CR008), followed by a massive $550 million Series D funding
              round in September 2025 (CR009). While this capital base provides operational runway, private secondary
              marketplace dynamics on platforms like EquityZen highlight that private company investments carry
              structural illiquidity and substantial loss risks prior to an exit event (CR010). The lack of audited
              public disclosures regarding debt covenants, contribution margins by line of business, and commercial
              renewal cohorts necessitates stringent pre-investment diligence.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Vulnerability to CMMI Benchmark Resets
            body: >-
              Strive Health manages roughly $5 billion in annual medical spend across risk-bearing structures.
              Value-based kidney care economics depend directly on CMMI benchmark calculation rules and payer medical
              loss ratios. Any regulatory benchmark tightening or adverse risk-adjustment policy could erode operating
              margins before care management savings materialize.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Clinical Delivery and Staffing Ratios
            body: >-
              With 900 patient visits conducted daily by Kidney Heroes teams, clinical execution requires maintaining
              stringent nurse practitioner-to-patient staffing ratios. In an inflationary clinical labor environment,
              talent acquisition and retention bottlenecks represent an operational ceiling on patient scaling.
            calloutType: insight
            claimRefs:
              - CR005
              - CR007
          - type: callout
            title: Pre-Investment Balance Sheet and Contract Diligence
            body: >-
              Investors should demand verified audit trails bridging gross managed spend to net recognized revenue,
              review historical stop-loss reinsurance attachment points, and analyze liquidation preference waterfalls
              following the $550 million Series D financing round.
            calloutType: recommendation
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and Financing Context
        blocks:
          - type: paragraph
            body: >-
              The public-only recommendation is research-more, with medium analytical confidence, high risk, and an
              unpriceable valuation stance. Strive says it announced a $550 million capital raise in September 2025,
              while the Parsers.vc news aggregation separates that total into $300 million of Series D equity and $250
              million of debt. That financing demonstrates access to capital, but funding raised is not cash available
              and the total financing amount is not a transaction valuation. The retained pages provide no share price,
              post-money value, debt pricing, maturity, covenants, collateral, liquidation preferences, or dilution
              terms. Entry price, target return, hold period, and exit proceeds therefore cannot be responsibly
              calculated from this evidence set.
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV011
              - CV014
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV006
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV014
              - CV016
      - number: '8.2'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that Strive addresses a large care need with a model that combines payer and provider
              relationships, clinical teams, predictive analytics, and national reach. Company-issued evidence says it
              supports more than 145,000 people in all 50 states, works with more than 6,500 providers, manages nearly
              $5 billion of annual medical spend, and has generated more than $400 million of savings for partners.
              Those figures indicate operating relevance, but they are not audited revenue, margin, retention, or
              cash-flow measures. The anti-thesis is therefore economic rather than purely clinical: a large
              attributed-spend base can coexist with weak take rates or labor-intensive delivery. A 2026 news feed also
              relays a sector-level PHTI assessment critical of virtual CKD management, but the retained excerpt does
              not establish that Strive was one of the evaluated products.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV007
              - CV008
              - CV009
              - CV014
      - number: '8.3'
        title: Scenario Framework and Comparable Limits
        blocks:
          - type: paragraph
            body: >-
              A milestone-gated framework is more defensible than a revenue multiple because the assigned evidence pool
              contains no usable public-company multiple, private transaction value, or M&A consideration tied to
              comparable economics. The aVenture fetch contains only its page title, and Seedtable lists a January 2025
              last-funding date without an amount, making that record stale against Strive's later September 2025
              announcement. Bull, base, and bear cases can still identify what must become true, but none supports a
              numeric valuation range today. The bull case requires audited unit economics and favorable capital terms;
              the base case preserves scale while financial visibility remains absent; the bear case combines weak
              economic proof, debt seniority, and sector efficacy scrutiny. Price discovery should follow, not precede,
              verified revenue, margin, retention, and cap-table evidence.
            claimRefs:
              - CV001
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV005
              - CV006
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exit Readiness and Final Diligence
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is not established by the retained public record. Neither an IPO path nor a strategic sale
              value can be underwritten without audited financial statements, cohort retention, contract concentration,
              contribution margin, cash burn, and the rights attached to the equity and debt stack. The immediate
              diligence sequence is to reconcile managed medical spend to recognized revenue and cash collections; test
              margins by payer, provider, and contract vintage; review the debt agreement and preference waterfall; and
              compare the resulting economics with contemporaneous transactions selected on the same risk-bearing model.
              The thesis breaks if verified economics show structurally negative contribution margins, concentrated
              renewals fail, debt terms materially subordinate new equity, or independent outcome evidence does not
              reproduce company-reported savings. A priced investment should wait until those gates are closed.
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Investment posture
            body: >-
              Research more. Company-reported scale is investable only if audited economics and the complete financing
              stack support an acceptable entry price and downside structure.
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV005
              - CV014
              - CV016
          - type: callout
            title: Do not confuse financing with valuation
            body: >-
              The reported $550 million combines equity and debt. It does not establish a post-money valuation, cash
              balance, or amount available for operations.
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV014
