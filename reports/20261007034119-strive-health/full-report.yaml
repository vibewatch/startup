  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Clinical Workflow Delivery
        blocks:
          - type: paragraph
            body: >-
              Strive Health delivers value-based kidney care through a hybrid model that tightly integrates predictive
              analytics with specialized clinical workflows across the chronic kidney disease (CKD) and end-stage kidney
              disease (ESKD) continuum [CE001]. At the core of Strive's offering is a collaborative care-extension model
              that operates alongside community nephrologists and primary care physicians rather than replacing existing
              provider relationships [CE002, CE003]. In customer workflow terms, Strive identifies at-risk patients who
              are progressing toward renal failure, coordinates early interventions, and manages complex comorbidities
              to prevent emergency dialysis starts and inpatient admissions [CE001, CE004]. Care is delivered on the
              ground and virtually by Strive's Kidney Heroes multidisciplinary care teams, comprising nurse
              practitioners, registered nurses, dietitians, and clinical social workers who provide intensive patient
              education, medication management, and nutritional counseling [CE002, CE004]. To ensure alignment across
              the healthcare ecosystem, Strive deploys dedicated provider integration teams that conduct on-site
              workflow assessments and establish standardized clinical and communication protocols [CE003, CE005].
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE007
