  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation range
      - Return / exit logic
      - Key downside trigger
      - Probability signal
    rows:
      - - Bull
        - >-
          Audited revenue and margins validate operating leverage; retention is durable; debt and preferences are
          investor-compatible
        - Not supportable from the retained public evidence
        - Price only after verified cash-flow economics can be benchmarked to like-for-like transactions
        - Unit economics fail to improve as clinical operations scale
        - Conditional; required evidence is absent
      - - Base
        - Company-reported scale persists, but revenue, margin, concentration, and capital terms remain private
        - Not supportable from the retained public evidence
        - Research-more; no target return or hold period
        - Diligence cannot reconcile medical spend to recognized revenue and collections
        - Most consistent with the current evidence
      - - Bear
        - Sector efficacy concerns persist; take rates or margins are weak; debt ranks ahead of new equity
        - Not supportable from the retained public evidence
        - Decline or require a price and structure that protect against debt and preference overhang
        - Independent outcomes fail to reproduce savings or a major contract does not renew
        - Plausible downside; magnitude cannot be quantified
    notes: >-
      Scenario ranges are deliberately withheld because the source pool lacks a transaction valuation, audited financial
      base, debt terms, and preference stack.
    claimRefs:
      - CV002
      - CV005
      - CV006
      - CV014
      - CV015
      - CV016
figures:
  - id: FO001
    title: Strive Health Corporate and Milestone Development Timeline
    type: timeline
    summary: >-
      Chronological development of Strive Health from its 2018 founding in Denver through Series D growth and executive
      expansion in 2026.
    data:
      items:
        - label: 2018 Corporate Founding
          date: '2018-01-15'
          detail: >-
            Strive Health founded in Denver, Colorado, by Chris Riopelle in partnership with NEA to build a value-based
            kidney care model.
          tone: positive
        - label: CareMultiplier Platform Deployment
          date: '2020-06-01'
          detail: >-
            Proprietary CareMultiplier machine-learning engine deployed, achieving HITRUST certification and NCQA
            accreditation.
          tone: neutral
        - label: Series C Capital Raise
          date: '2023-05-31'
          detail: >-
            Strive secures $166 million Series C financing led by NEA with CVS Health Ventures, CapitalG, Echo, Town
            Hall, and Ascension.
          tone: positive
        - label: Series D Growth Capital Raise
          date: '2025-09-09'
          detail: >-
            Strive closes $550 million financing round, comprising $300M equity led by NEA and $250M debt from Hercules
            Capital.
          tone: positive
        - label: Network Scale Benchmark
          date: '2025-09-09'
          detail: >-
            Company announces milestone of managing nearly $5 billion in medical spend for over 145,000 patients with
            6,500 providers.
          tone: positive
        - label: Clinical Outcomes Publications
          date: '2026-05-15'
          detail: >-
            Peer-reviewed studies in Journal of Patient Experience and AJMC validate 42% lower readmissions and 77%
            slower eGFR decline.
          tone: positive
        - label: C-Suite Leadership Additions
          date: '2026-06-16'
          detail: >-
            Dr. Jamie Sharp appointed Chief Medical Officer and Chris Rigg appointed Chief Financial Officer to guide
            scaling.
          tone: neutral
        - label: Nationwide Scale Expansion
          date: '2026-09-17'
          detail: >-
            Medical spend under management reaches $5.5 billion across 165,000 patients in all 50 states with 6,500
            provider partners.
          tone: positive
        - label: TIME Top HealthTech Ranking
          date: '2026-09-17'
          detail: Strive named to TIME and Statista's World's Top HealthTech Companies ranking for a second consecutive year.
          tone: positive
        - label: Executive Expansion for Next Phase
          date: '2026-10-01'
          detail: >-
            Susan Ray joins as COO, Dr. Sarah Berry as CNEO, and Dan Heslin as CGO to lead operations, network, and
            commercial growth.
          tone: positive
