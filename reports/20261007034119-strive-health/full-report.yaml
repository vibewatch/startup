      - number: '5.2'
        title: Operating Architecture and Technology Infrastructure
        blocks:
          - type: paragraph
            body: >-
              Strive's technical architecture is organized into a scalable, multi-tier data and care coordination
              platform designed to handle complex healthcare data pipelines [CE006, CE007]. At the foundation layer,
              Strive operates an enterprise cloud data warehouse and lakehouse infrastructure leveraging Amazon Web
              Services (AWS) components including Amazon S3 object storage, Redshift analytical warehousing, and Lambda
              serverless compute [CE006, CE008]. This infrastructure ingests, cleanses, and orchestrates diverse inbound
              data streams across medical and pharmacy claims, eligibility rosters, laboratory results, electronic
              health record (EHR) feeds, and hospital Admit, Discharge, Transfer (ADT) alerts using batch, incremental,
              change-data-capture, and streaming patterns [CE007, CE008]. Resting on this data infrastructure is
              Strive's proprietary CareMultiplier analytics engine, which applies machine learning algorithms trained on
              over 50 million public patient records to generate predictive risk stratification, disease progression
              modeling, and individualized patient insights [CE009, CE010]. These analytical insights are exposed via
              APIs and bidirectional event streams into Strive's engagement layer, built on Salesforce Health Cloud,
              where Kidney Hero care teams execute personalized care plans, log patient touchpoints, and manage clinical
              coordination workflows [CE006, CE008, CE010].
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
          - type: table
            tableRef: TE003
            claimRefs:
