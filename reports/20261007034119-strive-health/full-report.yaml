      - number: '2.2'
        title: Sizing Lenses, Growth Drivers, and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              Quantifying the addressable market for technology-enabled kidney care delivery requires examining patient
              population prevalence alongside managed medical spend pools. Approximately 90% of U.S. adults with kidney
              disease remain unaware of their condition, creating a massive silent cohort that standard fee-for-service
              models fail to engage until acute renal failure occurs. Hospital admissions for kidney-related
              complications can cost up to $15,000 per episode, creating compelling economic incentives for payers to
              adopt value-based care management programs that delay progression and reduce readmissions.


              Key growth drivers propelling the market include accelerating health plan executive pressure to manage
              rising medical loss ratios (with 52% of health plan executives citing cost containment as their top
              operational priority in 2026), expanding Medicare Advantage risk models, and shifting provider
              compensation toward total cost-of-care shared savings. Clinical validation further drives adoption:
              peer-reviewed studies show Strive's transitions-of-care intervention reduces hospital readmissions by 42%
              at 7 days and slows eGFR decline in Stage 3b CKD by 77%.


              However, critical adoption constraints limit the velocity of market capture. Primary constraints include
              prolonged B2B sales cycles for health plans, provider network friction when integrating third-party nurse
              practitioners into established nephrology workflows, data interoperability friction across fragmented
              electronic health record (EHR) platforms, and the capital intensity of taking two-sided downside risk.
              Furthermore, public disclosures do not bridge managed medical spend to Strive's recognized net revenue or
              contribution margin, leaving market-wide revenue capture rates unverified.
            claimRefs:
              - CM003
              - CM005
