    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Mission, and Care Delivery Model
        blocks:
          - type: paragraph
            body: >
              Strive Health was founded in 2018 in Denver, Colorado, by Chief Executive Officer Chris Riopelle and
              founding capital partner New Enterprise Associates (NEA) to transform the fragmented and reactive U.S.
              kidney care delivery system. Operating as a late-stage private healthcare enterprise, Strive addresses
              chronic kidney disease (CKD) and end-stage kidney disease (ESKD) by intervening upstream before
              catastrophic renal failure occurs. The company's core operating model pairs advanced clinical workflow
              technology with specialized, interdisciplinary care teams to coordinate patient management across
              early-stage CKD Stage 3b through dialysis and kidney transplantation.


              Rather than operating transactional outpatient hemodialysis centers or billing fee-for-service facility
              fees, Strive contracts with commercial payers, Medicare Advantage health plans, Medicare Shared Savings
              Program (MSSP) Accountable Care Organizations, and regional health systems through risk-bearing and
              shared-savings arrangements. Strive's proprietary CareMultiplier technology platform is HITRUST-certified
              and accredited by the National Committee for Quality Assurance (NCQA) for case management and population
              health programs. By integrating predictive artificial intelligence and clinical insights with local
              primary care physicians and nephrologists, Strive slows disease progression, manages hypertension and
              diabetic comorbidities, and prevents unplanned hospital admissions.


              By late 2026, Strive's nationwide footprint had expanded to cover all 50 U.S. states, partnering with more
              than 6,500 healthcare providers and managing $5.5 billion in annual medical spend across more than 165,000
              attributed patients. In recognition of its technological integration and clinical scale, Strive was named
              one of the World's Top HealthTech Companies by TIME and Statista for a second consecutive year in
              September 2026.
