      - number: '2.3'
        title: Buyer Segmentation, Payer Alignment, and GTM Strategy
        blocks:
          - type: paragraph
            body: >
              Adoption in value-based kidney care is mediated by three primary stakeholder segments: risk-bearing health
              plans and payers, health systems and nephrology provider groups, and self-insured employers. Health plans
              represent the primary economic budget owners, procuring Strive through collaborative shared-risk
              contracts, administrative per-member-per-month (PMPM) care coordination fees, or shared savings pools tied
              to medical cost reduction and quality metrics.


              Provider partners, encompassing over 6,500 nephrologists and primary care physicians, act as essential
              gatekeepers. When Strive aligns directly with nephrologists, patient clinical engagement increases by up
              to 34%. For providers, Strive operates as a care extender via its Kidney Heroes interdisciplinary teams
              rather than an external competitor. Self-insured employers represent an emerging buyer segment driven by
              catastrophic dialysis claims, seeking integrated cardio-pulmonary-metabolic solutions that address chronic
              comorbidities like diabetes and hypertension before renal failure.


              Strive's internal go-to-market structure reflects these distinct buyer journeys, maintaining dedicated
              product lifecycle management, B2B marketing targeting health plans, provider marketing to expand clinical
              networks, and patient acquisition and activation campaigns to secure sustained beneficiary participation.
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM010
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM006
              - CM007
              - CM009
              - CM010
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Upstream Intervention as an Economic Decoupling Strategy
            body: >-
              Value-based kidney care fundamentally decouples healthcare spending from dialysis machine hours. By
              deploying multidisciplinary teams upstream to slow eGFR decline by up to 77% in Stage 3b CKD, Strive
              Health aims to preserve residual kidney function and compress acute hospital readmissions, transforming
              high-cost catastrophic episodes into managed outpatient care.
            calloutType: insight
            claimRefs:
              - CM001
              - CM008
              - CM010
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              The market for value-based kidney care delivery divides into four principal competitor classes: dedicated
              value-based kidney care risk-bearing entities, legacy dialysis providers undergoing value-based
              transformation, horizontal population health management platforms, and status-quo payer/health-system
              internal care operations. Strive Health differentiates itself by intervening upstream across early-stage
              Chronic Kidney Disease (CKD) stages 3 through 5 and End-Stage Renal Disease (ESRD) to delay dialysis and
              reduce avoidable emergency room visits. Dedicated rivals such as Somatus and Monogram Health also pursue
              risk-aligned payer partnerships and nephrologist networks. Meanwhile, dialysis incumbents DaVita and
              Fresenius Medical Care control physical infrastructure and commercial relationships across outpatient
              clinics, representing massive entrenched distribution power despite their historical structural dependence
              on high-volume fee-for-service dialysis sessions.
