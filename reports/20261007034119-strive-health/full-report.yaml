  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue mechanics are risk-based, but contract economics are private
        blocks:
          - type: paragraph
            body: >-
              Strive operates through flexible value-based payment arrangements with health plans, Medicare, health
              systems, and physicians, including arrangements where it assumes total cost-of-care risk. Its delivery
              model combines predictive analytics with high-touch, multidisciplinary clinical teams, so the economic
              proposition is to lower avoidable utilization while managing attributed kidney populations. That
              establishes the mechanism but not the accounting bridge: the reviewed sources do not disclose contract
              units, risk corridors, benchmark methodology, shared-savings percentages, medical-loss allocation, or the
              timing of revenue recognition. Consequently, managed medical spend and claimed savings should be treated
              as operating exposure and outcome indicators, not as revenue, ARR, gross profit, or cash generation.
