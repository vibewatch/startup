    rows:
      - - Market need
        - Company cites more than 35M US adults with kidney disease and about 90% unaware
        - A large need does not establish addressable revenue or acquisition efficiency
        - Independent market segmentation tied to eligible covered lives and contract economics
      - - Product model
        - Provider/payor model combines care teams with predictive analytics
        - Public pages do not quantify automation leverage or cost to serve
