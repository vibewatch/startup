        title: Competitor Profiles and Strategic Scale
        blocks:
          - type: paragraph
            body: >-
              Evaluating competitor scale and capital backing highlights divergent strategic vectors across the kidney
              disease management sector. Strive Health has expanded its patient reach across all 50 states, managing
              approximately $5 billion in annual medical spend across 150,000 covered lives through risk-sharing payer
              and provider arrangements. Specialized pure-play peers Somatus and Monogram Health also command
              significant venture and growth equity backing to underwrite downside risk arrangements with commercial and
              Medicare Advantage health plans. Incumbents DaVita and Fresenius have introduced integrated kidney care
              programs to defend market share as CMS value-based models accelerate, although independent industry
              evaluations note Strive faces lower brand recognition relative to these entrenched institutional dialysis
              providers. Additionally, broader population health platforms such as Vytalize Health and VirtualHealth
