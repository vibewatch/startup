      - number: '1.2'
        title: Executive Leadership, Governance Evolution, and Organizational Depth
        blocks:
          - type: paragraph
            body: >
              Strive Health is led by Co-Founder and CEO Chris Riopelle, whose strategic vision has driven the
              platform's multi-state provider expansion and institutional capital syndicate since 2018. Over its growth
              lifecycle, Strive has evolved from an early-stage care coordinator to an institutional enterprise
              operating platform, instituting seasoned operational and financial governance under the guidance of
              President Paul Marchetti. In 2026, the company executed a coordinated expansion of its C-suite to support
              enterprise scaling, payer risk contracting, and clinical quality across commercial and government health
              plan relationships.


              In June 2026, Strive appointed Dr. Jamie Sharp, M.D., as Chief Medical Officer and Chris Rigg as Chief
              Financial Officer. Dr. Sharp previously served as CMO at dementia-focused value-based care provider Rippl
              and held senior clinical leadership roles at Aetna (a CVS Health company), naviHealth, and Evolent Health.
              Rigg brought deep managed care and capital markets expertise to Strive after serving as CFO and Senior
              Vice President of Commercial Health Benefits at Elevance Health, where he oversaw financial strategy
              across commercial products covering more than 32 million consumers, preceded by equity research tenures at
              Deutsche Bank and Merrill Lynch.


              The executive team was further augmented in October 2026 with the appointments of Susan Ray as Chief
              Operating Officer, Sarah Berry, Ph.D., as Chief Network & Engagement Officer, and Dan Heslin as Chief
              Growth Officer. Ray, formerly COO of Rippl Care and a senior executive at Evolent Health and Accolade,
              oversees centralized clinical operations and delivery services. Dr. Berry directs Strive's network of over
              6,500 provider partners, while Heslin leads business development and health plan enterprise growth
              following an extensive career at Elevance Health. Technical architecture is directed by Chief Technology
              Officer Tom Hawkes, while specialized nephrology care protocols are guided by Chief Nephrologist Dr. Keith
              Bellovich, D.O.


              Despite substantial executive bench depth across value-based operations, key-person risk remains
              moderately concentrated in Co-Founder and CEO Chris Riopelle and President Paul Marchetti, who maintain
              foundational relationships with founding venture backer NEA and lead health plan partners.
