            body: >-
              The latest assigned evidence reports a September 2025 capital package of $550 million, comprising $300
              million of Series D equity and $250 million of debt. Tracxn separately reports $606 million raised across
              six rounds, while Ascension Ventures confirms a $166 million Series C. These figures should not be summed:
