        title: Clinical labor and risk transfer make margin disclosure essential
        blocks:
          - type: paragraph
            body: >-
              Strive's model is not a pure software delivery system. Public descriptions show nurse-practitioner-led
              teams, care coordinators and other clinical disciplines, predictive technology, and a broad
