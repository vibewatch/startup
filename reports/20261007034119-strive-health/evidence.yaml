evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited GAAP revenue, ARR, gross margin, and medical loss ratio breakdown across commercial and Medicare Advantage
      lines.
    whyItMatters: >-
      Crucial for determining Strive Health's true economic take-rate and assessing operating profitability independent
      of gross medical spend managed.
    diligencePath: >-
      Request audited income statements, P&L by customer segment, and historical ARR bridges under management
      non-disclosure agreements.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: credit-facility
    missingEvidence: >-
      Detailed debt covenant terms, interest rate margins, collateral pledges, and maturity schedule for the $250M
      Hercules Capital facility.
    whyItMatters: >-
      Essential for understanding debt service burdens, senior liquidation preferences ahead of equity holders, and
      operational covenant restrictions.
    diligencePath: >-
      Review the credit agreement, security filings, and debt compliance certificates during management diligence
      sessions.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: executive-leadership
    missingEvidence: >-
      Complete operational leadership directory including regional market operations VPs, medical directors, and data
      science heads.
    whyItMatters: >-
      Evaluates organizational depth below the C-suite level and assesses regional leadership stability across all 50
      states.
    diligencePath: Review detailed corporate organizational charts and regional management roster during commercial diligence.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: diligence-gaps
    missingEvidence: >-
      Channel-by-channel breakdown bridging $5.5 billion in medical spend under management to recognized net revenue,
      gross profit, and cash collection.
    whyItMatters: Prevents reliable calculation of Strive's actual revenue capture rate and unit-level contract economics.
    diligencePath: Request audited income statements, contract take-rate schedules, and payer fee reconciliations under NDA.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: competitor-financials
    missingEvidence: >-
      Audited financial statements, ARR, gross margins, and customer win/loss ratios for private pure-play competitors
      Somatus and Monogram Health.
    whyItMatters: >-
      Direct head-to-head financial performance and margin structures cannot be independently verified from public
      disclosures alone.
    diligencePath: >-
      Request confidential payer contract win/loss rates, gross margin benchmarks, and RFP performance data during
      institutional diligence.
    relatedQuestionRefs:
      - QP001
      - QP005
    relatedTableRefs:
      - TP001
      - TP003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Channel-level contract units, realized prices, risk corridors, benchmarks, discounts, duration, renewals, and
      revenue-recognition policy.
    whyItMatters: >-
      Without contract economics, operating scale cannot be converted into recognized revenue, revenue quality, or
      contribution margin.
    diligencePath: >-
      Review representative payor, Medicare, health-system, and provider contracts alongside the accounting memo and
      recent settlement statements.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Audited cash balance, monthly burn, runway forecast, working-capital profile, debt draw status, interest rate,
      maturity, covenants, and collateral.
    whyItMatters: >-
      Financing raised is not cash available, and undisclosed debt obligations prevent assessment of liquidity and the
      timing of another capital need.
    diligencePath: >-
      Obtain audited statements, current cash and debt schedules, the debt agreement, covenant calculations, and a
      monthly base/downside liquidity forecast.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Revenue, gross margin, medical-cost performance, clinician productivity, implementation cost, retained savings,
      and contribution margin by channel.
    whyItMatters: >-
      Public outcome and scale metrics do not reveal whether growth produces durable gross profit or consumes
      incremental clinical and risk capital.
    diligencePath: >-
      Build a channel cohort bridge from attributed-member months and medical spend through recognized revenue, clinical
      costs, risk settlements, and contribution margin.
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: retention-and-nrr
    missingEvidence: Audited health plan logo retention rates, contract renewal histories, and Net Revenue Retention (NRR) cohorts.
    whyItMatters: >-
      Without renewal and cohort expansion data, long-term durability of Strive's value-based revenue and churn risk
      cannot be independently audited.
    diligencePath: >-
      Request customer cohort renewal matrices, NRR schedules, and multi-year health plan contract renewal terms under
      NDA.
    relatedQuestionRefs:
      - QU006
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: payer-concentration
    missingEvidence: Revenue breakdown and medical spend distribution by top health plan customers (Humana, Aetna, Blues plans).
    whyItMatters: >-
      High customer concentration among top Medicare Advantage payers creates asymmetric downside risk if a single payer
      terminates or renegotiates terms.
    diligencePath: >-
      Review customer revenue concentration schedules and top-5 health plan revenue contributions in confidential data
      room.
    relatedQuestionRefs:
      - QU007
    relatedTableRefs:
      - TU001
  - type: private-evidence-only
    severity: material
    topic: named-customer-contracts-and-TU003-coverage
    missingEvidence: >-
      Comprehensive contract census and financial terms across all 6,500+ partnered providers and commercial health plan
      accounts.
    whyItMatters: >-
      Table TU003 represents a selective public sample of marquee partners; individual contract margins, penalty
      thresholds, and loss-sharing caps remain unverified.
    diligencePath: >-
      Audit master service agreements, ACO risk-sharing schedules, and nephrology practice joint-venture operating
      agreements.
    relatedQuestionRefs:
      - QU003
      - QU006
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: valuation-and-cap-table
    missingEvidence: >-
      Current pre-money and post-money valuation, fully diluted ownership, option pool, liquidation preferences,
      participation rights, anti-dilution provisions, and secondary pricing.
    whyItMatters: These terms determine entry ownership, dilution, downside protection, and whether any target return is achievable.
    diligencePath: >-
      Obtain the executed Series D documents, current cap table, waterfall model, and latest board-approved 409A or
      independent valuation.
    relatedQuestionRefs:
      - QV005
      - QV007
  - type: private-evidence-only
    severity: material
    topic: audited-economics
    missingEvidence: >-
      Audited revenue, gross margin, contribution margin, cash balance, burn, retention, concentration, and realized
      savings-share economics by contract.
    whyItMatters: >-
      Medical spend and patient counts cannot be converted into enterprise value or cash-return expectations without
      recognized economics.
    diligencePath: >-
      Request audited statements and a CFO bridge from attributed medical spend to revenue, collections, gross profit,
      and contribution margin.
    relatedQuestionRefs:
      - QV002
      - QV007
      - QV008
  - type: private-evidence-only
    severity: material
    topic: debt-terms
    missingEvidence: >-
      Interest rate, maturity, draw status, covenants, collateral, amortization, warrants, and change-of-control terms
      for the reported $250 million debt financing.
    whyItMatters: >-
      Debt service and senior claims can reduce runway, constrain operations, and materially change junior equity
      outcomes.
    diligencePath: >-
      Review the executed credit agreement, borrowing base, compliance certificates, draw schedule, and debt payoff
      analysis.
    relatedQuestionRefs:
      - QV005
  - type: missing-source
    severity: material
    topic: comparable-valuations
    missingEvidence: >-
      Contemporaneous transaction values and audited economics for like-for-like risk-bearing kidney-care or
      value-based-care companies.
    whyItMatters: >-
      A comparable multiple is meaningful only when business model, revenue definition, risk exposure, growth, and
      margins are aligned.
    diligencePath: >-
      Build a banker-supported comparable set after Strive's revenue and margin definitions are verified, then normalize
      enterprise values and capital structures.
    relatedQuestionRefs:
      - QV006
