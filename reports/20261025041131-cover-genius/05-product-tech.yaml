        - label: Merchant experience
          modules: [Travel, retail, ticketing, logistics, payments, mobility, and banking journeys]
        - label: Distribution and decisioning
          modules: [Single-API embedding, merchant-specific product design, contextual pricing, presentation optimization]
        - label: Protection supply
          modules: [50+ global insurance carriers, multi-line products, jurisdictional licenses or authorizations]
        - label: Servicing
          modules: [XCover claims portal, document upload, status tracking, payments, automated-claims roadmap]
        - label: Regional extension
          modules: [Friendsurance DACH banking technology, PSD2 open-banking rails, GDPR-oriented framework]
        - label: Governance
          modules: [Privacy, ethics, compliance, security assurance, model validation]
