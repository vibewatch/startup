    claimRefs: [CE001, CE005, CE007, CE013]
callouts:
  - calloutType: strength
    title: Embedded workflow is the core product
    body: XCover's strongest public proof is a repeatable point-of-sale and claims workflow spanning merchants, carriers, and policyholders rather than a standalone insurance catalog.
    claimRefs: [CE001, CE002, CE003]
  - calloutType: risk
    title: Scale is not the same as technical assurance
    body: Partner, policy, and geographic scale is disclosed, but current uptime, security attestations, incident history, and automated-claims accuracy are not retained in the public evidence pool.
    claimRefs: [CE009, CE011, CE012]
  - calloutType: recommendation
    title: Gate expansion on control evidence
    body: Before underwriting the AI and banking roadmap, request architecture, dependency, model-governance, security, and post-acquisition integration evidence with dated operating metrics.
    claimRefs: [CE013, CE014]
