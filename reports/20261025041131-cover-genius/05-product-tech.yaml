      - ["Offer decisioning", "Configure product, price, and presentation for journey and geography", "Product rules, data, carrier terms, and compliance constraints", "Explainability and pricing-control risk as AI expands"]
      - ["Carrier and regulatory layer", "Provide underwriting capacity and jurisdictional permissions", "50+ carriers and licenses or authorizations across 60+ countries", "Regulatory change and cross-border dependency"]
      - ["Claims and payments", "Receive claims, communicate status, and make payments", "Claims operations, payment rails, and policy data", "Reliability, fraud, automation error, and unsupported SLA risk"]
      - ["Regional banking extension", "Support DACH bank distribution using PSD2 and GDPR-oriented architecture", "Friendsurance technology and institutional compliance", "Post-acquisition integration and data-governance risk"]
    notes: "The layers synthesize public product descriptions and an acquisition announcement; the sources do not publish a complete current component inventory or service-level commitments."
    claimRefs: [CE005, CE007, CE008, CE014]
