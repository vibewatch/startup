company:
  name: Cover Genius
chapter:
  number: 1
  title: Company Overview
  summary: Cover Genius is a 2014-founded embedded-protection infrastructure company whose public disclosures support broad global distribution and a July 2026 USD 1.9 billion valuation. The evidence is substantially company- or investor-issued, while audited economics, current governance, legal headquarters, and financing terms remain material diligence gaps.
sections:
  - id: identity-and-operating-model
    title: Identity, footprint, and operating model
    body: >-
      Cover Genius operates as a B2B2C infrastructure layer: digital platforms embed protection into checkout or post-purchase journeys, while XCover connects distribution, insurance capacity, and claims handling. Current financing materials report more than 200 partners, more than 50 global carriers, and activity in over 60 countries and all 50 US states. Those measures describe distribution breadth rather than revenue, recurring revenue, or insured risk retained by Cover Genius. Public location evidence is also incomplete. A 2024 founder interview names New York and Sydney among several offices, and LeadIQ lists a New York address, but the assigned evidence does not establish the current legal headquarters or parent-company domicile.
    claimRefs: [CO001, CO004, CO005, CO015]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Founder leadership and governance visibility
    body: >-
      Gus McDonald remains identified as co-founder and chief executive officer in the July 2026 financing release, while the 2024 founder interview identifies Chris Bayley as the other co-founder. This continuity supports institutional knowledge and a coherent product narrative, but it also leaves visible key-person dependence around McDonald. The assigned sources do not provide a complete current executive roster, board composition, voting rights, ownership percentages, succession plan, or the current operating role of Bayley. Accordingly, the leadership table is deliberately partial: it records only roles supported by fetched text and treats governance depth as a diligence request rather than filling the gaps from stale or indirect profiles.
    claimRefs: [CO002, CO003]
    tableRefs: [TO002]
  - id: capital-and-stakeholders
    title: Financing history and stakeholder map
    body: >-
      Publicly described financing progressed from a USD 70 million Series D led by Dawn Capital in 2022 to an USD 80 million Series E led by Spark Capital in 2024. AlleyWatch reported total funding of USD 245 million at the Series E, but the July 2026 event should not simply be added to that equity total: Cover Genius called it a USD 100 million capital raise backed by Vista Credit Partners, and the fetched materials do not disclose whether the instrument is debt, equity, or a hybrid. The raise carried a reported USD 1.9 billion valuation, with Morgan Stanley acting as placement agent. Control rights, covenants, liquidation preferences, and repayment terms remain unavailable.
    claimRefs: [CO006, CO007, CO008, CO009, CO010]
    tableRefs: [TO003]
  - id: scale-and-disclosure-limits
    title: Scale milestones and limits of public evidence
    body: >-
      The strongest current operating indicators are company-reported: 50% year-over-year revenue growth during 2025, USD 3.2 billion in cumulative gross written sales, 240 million policies, and more than 70 million end customers. These metrics have different denominators and cannot be substituted for audited revenue, ARR, active customers, cash generation, or cash available. An archived Trustpilot summary describes overwhelmingly positive customer experiences while noting that opinions on refunds and payment processes vary; it is a directional review signal, not a measured complaint rate or current service audit. No assigned successful source establishes a current lawsuit, enforcement action, breach, or outage record; that is an evidence gap, not proof that no such event exists.
    claimRefs: [CO011, CO012, CO013, CO014, CO016]
    figureRefs: [FO001]
callouts:
  - calloutType: strength
    title: Global distribution is the clearest supported strength
    body: The July 2026 evidence consistently reports a large partner, carrier, policy, and customer footprint, although the underlying figures remain company-issued and unaudited.
    claimRefs: [CO013, CO014, CO015]
  - calloutType: risk
    title: Scale cannot be translated into cash economics
    body: Gross written sales, policy counts, and customer reach do not disclose revenue level, margin, cash burn, runway, or financing seniority.
    claimRefs: [CO011, CO012, CO013, CO014]
