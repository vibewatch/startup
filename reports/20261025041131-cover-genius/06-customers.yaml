company:
  name: Cover Genius
chapter:
  number: 6
  title: Customers
  summary: >-
    Cover Genius has credible evidence of broad B2B2C distribution through named global platforms and company-reported
    cumulative scale, including 240 million policies by 2026. Public evidence is much weaker on current active accounts,
    production depth, retention definitions, contract durability, and customer concentration.
sections:
  - id: customer-segments
    title: Customer segments and buying motion
    body: >-
      Cover Genius sells embedded-protection infrastructure to digital platforms rather than building a direct
      mass-market acquisition funnel. Public materials identify travel, retail, ticketing, logistics, mobility, payments,
      and other digital commerce journeys as customer segments. In this B2B2C model, a platform or merchant buys and
      integrates the capability, its consumer encounters the protection offer, and an insurance carrier ultimately
      supplies risk capacity. The company reported more than 200 merchant partners and access to more than 50 carriers
      in 2026. A 2024 executive interview further said Cover Genius typically earns revenue shares rather than technology
      license fees, aligning its revenue with partner transaction activity. This segmentation is useful for mapping
      buyers and users, but no retained source provides account-level revenue, active-account counts, or economics by
      vertical.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-durability
    title: Adoption, usage, and durability
    body: >-
      Adoption evidence is strongest on cumulative distribution volume. A July 2026 company release reported more than
      70 million end customers and 240 million policies, while an October 2026 syndicated company release reported more
      than 73 million consumers across the same 240 million-policy total. The latter also reported a 4.5 out of 5
      Trustpilot rating from more than 78,000 verified reviews for XCover. Earlier, Cover Genius said it had reached more
      than 30 million customers and achieved 145% net revenue retention in 2023. These measures have different periods,
      populations, and denominators: cumulative policies do not equal active policies, consumer reviews do not measure
      enterprise renewal, and the NRR disclosure lacks a cohort definition. No retained source reports current GRR,
      churn, contract length, active accounts, or renewal rates.
    claimRefs: [CU005, CU006, CU007, CU008, CU013, CU014]
    tableRefs: [TU002]
  - id: named-proof-and-concentration
    title: Named customer proof and concentration
    body: >-
      Named relationships span recognizable digital platforms. Cover Genius materials identify Booking.com, Priceline,
      Agoda, Turkish Airlines, Uber, Amazon, eBay, Wayfair, Flipkart, Tongcheng Travel, Shopee, Ola, and others. The
      newsroom specifically describes an Ola mobility relationship and a Flipkart signing, which is stronger than an
      unexplained logo wall, but the retained excerpts still omit deployment dates, production volumes, contract terms,
      renewal status, and account economics. An independent pitch-deck analysis identifies partner concentration as a
      risk if early revenue depended on a small number of large platforms; it does not establish that concentration
      actually exists. The evidence therefore supports relationship breadth, not revenue diversification. Investors
      still need a customer-level schedule before concluding that the named logos represent durable, distributed
      production revenue.
    claimRefs: [CU009, CU010, CU011, CU012, CU015]
    tableRefs: [TU003]
    figureRefs: [FU001]
  - id: customer-gaps
    title: Customer diligence gaps
    body: >-
      The assigned evidence supports a real distribution footprint but not a fully underwritten customer franchise.
      The October 2026 agentic product was described as immediately available to AI assistants, commerce platforms,
      enterprise software, and payment providers, yet availability is not adoption and no live customer was identified
      for that offer. Current diligence should separate signed, integrated, live, and terminated accounts; reconcile
      cumulative consumers and policies to monthly active accounts and policies; and bridge reported NRR to GRR, churn,
      price, volume, and cross-sell effects. It should also quantify top-one, top-five, and top-ten concentration by net
      revenue, gross written sales, and policy volume. Until those private operating schedules are supplied, retention,
      expansion, and concentration remain material open questions rather than demonstrated strengths.
    claimRefs: [CU012, CU013, CU014, CU016]
