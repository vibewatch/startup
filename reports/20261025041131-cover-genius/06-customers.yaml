    columns: [Customer or partner, Segment, Deployment or use case, Production versus pilot, Reported outcome, Limitation]
    rows:
      - [Booking.com, Travel, "Embedded protection in a digital booking journey", "Listed as an integration; production scope not stated", "Named among leading digital platforms", "No policy volume, renewal, or account economics"]
      - [Uber, Mobility, "Driver protection and embedded offerings", "Partnership reported; production scope not stated", "Named in a 2026 integration list and company newsroom", "Geography, duration, and utilization not disclosed"]
      - [eBay, Retail and ecommerce, "Protection within a digital marketplace journey", "Integration reported; production scope not stated", "Repeatedly named as an XCover relationship", "No account-level outcomes or concentration data"]
      - [Agoda, Travel, "Travel protection through the booking platform", "Partnership reported; production scope not stated", "Named in company newsroom and 2026 release", "No renewal, attach-rate, or customer-outcome data"]
    enumerationScope:
      coverage: partial
      basis: "Representative named relationships explicitly visible in the assigned 2024-2026 evidence, not a complete customer register."
    notes: "Named relationships do not by themselves prove current production volume; each row preserves the deployment limitations in the public evidence."
    claimRefs: [CU009, CU010, CU011, CU012]
