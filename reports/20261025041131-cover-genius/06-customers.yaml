  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention
      missingEvidence: A current cohort schedule with GRR, NRR, churn, renewal timing, and cohort definitions by customer segment.
      whyItMatters: The only retained NRR figure is a company-reported 2023 value without enough cohort detail to underwrite present durability.
      diligencePath: Request monthly cohort retention, churn, renewal, and expansion data for the last eight quarters.
      relatedQuestionRefs: [QU004, QU005]
    - type: missing-source
      severity: material
      topic: concentration
      missingEvidence: Customer-level net revenue, policy volume, gross written sales, and top-ten account concentration.
      whyItMatters: Large cumulative reach and many logos can still coexist with dependence on a small number of platforms.
      diligencePath: Obtain a redacted top-customer schedule with account tenure, contract terms, and revenue or volume share.
      relatedQuestionRefs: [QU007]
