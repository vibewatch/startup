          detail: "Public evidence does not quantify account retention, concentration, or repeat usage."
    approximationNotes: "Conceptual sequence based on reported operating mechanics; it does not imply measured conversion rates or a complete lifecycle."
    claimRefs: [CU002, CU004, CU013, CU016]
callouts:
  - calloutType: risk
    title: Breadth is better evidenced than durability
    body: >-
      Cover Genius shows broad platform distribution and cumulative consumer reach, but public evidence does not quantify
      active-account retention, top-customer concentration, or production depth by named relationship.
    claimRefs: [CU005, CU009, CU013, CU014, CU015]
