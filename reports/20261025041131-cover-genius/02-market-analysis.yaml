callouts:
  - calloutType: insight
    title: Growth is real but not directly monetizable
    body: "The strongest market evidence supports structural growth in digital distribution, but public estimates span materially different bases and Cover Genius discloses gross written sales rather than audited platform revenue."
    claimRefs: [CM005, CM006, CM008]
  - calloutType: risk
    title: Regulation is part of the product
    body: "Cross-border distribution requires conduct, disclosure, licensing, and data controls; a platform that cannot evidence those controls may not convert market growth into durable partner adoption."
    claimRefs: [CM013, CM014]
