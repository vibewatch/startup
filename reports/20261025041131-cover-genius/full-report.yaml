        title: Exhibits
        blocks:
          - type: callout
            title: Distribution scale is the strongest public financial signal
            body: >-
              The company reports 200-plus partners, 50-plus carriers, more than 70 million customers, 240 million
              policies, and $3.2 billion of gross written sales; these figures support activity scale, but they do not
              substitute for recognized revenue or margin disclosure.
            calloutType: strength
            claimRefs:
              - CI002
              - CI005
              - CI006
          - type: callout
            title: The underwriting bridge remains the core blocker
            body: >-
              Public evidence does not establish take rate, loss ratio, gross margin, cash runway, or account
              concentration. The $1.9 billion valuation is tied to a debt transaction rather than a disclosed priced
              equity round, so the valuation and capital-adequacy conclusion should remain provisional.
            calloutType: risk
            claimRefs:
