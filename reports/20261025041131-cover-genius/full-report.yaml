      - number: '5.2'
        title: Operating architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The evidence indicates a layered operating model: merchant integrations feed a distribution layer; product
              and pricing logic adapts offers to context; carrier connectivity supplies regulated underwriting capacity;
              and XCover claims management handles post-purchase servicing and payments. A third-party review of an
              older investor deck describes a microservices architecture with BrightWrite for pricing and XClaim for
              payments, while current company materials describe hyper-personalization, agentic distribution, automated
              claims infrastructure, and enhanced integration capabilities as investment priorities. The Friendsurance
              acquisition adds a regional architecture incorporating PSD2 open-banking rails and a framework designed
              for GDPR requirements in DACH banking. These are useful architecture signals, but the public sources do
              not establish current component boundaries, service-level objectives, or migration status.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
