      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              The buying decision is likely governed by the ability to launch compliant products across geographies,
              connect enough carrier capacity, preserve the merchant's customer relationship, and resolve claims without
              damaging the partner brand. Cover Genius states that it operates in more than 60 countries and all 50 US
              states, while Qover describes a modular platform covering 32 European countries and bolttech reports 39
              markets. Cover Genius and bolttech both describe single-API or modular orchestration, so integration alone
              is unlikely to be a durable moat. Cover Genius claims end-to-end protection from point of sale through
              claims, and its Turkish Airlines case describes a five-minute filing-to-submission process and instant
              payment options. Those claims are useful product signals, but they are vendor or customer-program evidence
              rather than an independent head-to-head benchmark. Unsupported competitor pricing and SLA cells remain
              unknown rather than being inferred from marketing copy.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP004
              - CP006
              - CP008
              - CP009
              - CP015
      - number: '3.3'
        title: Pricing, switching costs, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Public pricing is not comparable across the retained sources. Cover Genius told AlleyWatch that it
              typically earns revenue shares and sometimes subscription revenue, while Extend markets a portion of
              protection-plan sales as incremental revenue; neither disclosure establishes realized take rate, gross
              margin, implementation cost, or customer lifetime economics. This makes price a diligence gap, not a
              reason to declare a winner. Switching costs can still be meaningful because a platform must rework
              checkout journeys, policy wording, licenses, carrier capacity, claims operations, and customer-support
              flows when changing provider. However, multi-homing is plausible: large platforms can use different
              specialists by vertical or geography, and carriers or incumbents can supply competing capacity. Cover
              Genius's claimed licensing footprint and partner/carrier network may slow displacement, but bolttech's
              220+ microservices and 700+ partners show that scale and product breadth are contested.
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
      - number: '3.4'
        title: Displacement risk and investment implication
        blocks:
          - type: paragraph
            body: >-
              The competitive moat is strongest where regulatory permissions, localized product operations, carrier
              relationships, and claims data compound over time; it is weakest where the product is described as a
              single API, dynamic pricing, or AI automation that rivals can also add. Cover Genius's July 2026 financing
              announcement says capital will fund hyper-personalization, agentic distribution, automated claims
              infrastructure, partner integrations, and selective acquisitions. That strategic direction suggests an
              attempt to widen the moat, but it also signals continued investment needs. The retained competitor
              evidence shows a credible response: bolttech markets a broad platform and global reach, Qover has millions
              of users across Europe, and Extend combines protection with returns, delivery, fraud, and loyalty
              workflows. The underwriting conclusion is therefore conditional: Cover Genius has differentiated
              distribution assets, but public evidence does not establish durable pricing power, low churn, or a
              decisive technology lead.
            claimRefs:
              - CP011
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Cover Genius monetizes embedded protection through partner-distributed insurance rather than a
              conventional software license. In an interview, the company said it typically earns revenue shares from
              clients, with some subscription-based revenue as retailers adopt AppleCare-like protection. A separate
              financial teardown describes commission plus profit-share on premium written and notes that there is no
              public rate card. This distinction matters: the July 2026 company release reports more than $3.2 billion
              in gross written sales and 240 million policies, but those are insurance-flow measures, not the company's
              recognized revenue. The release also reports 50% year-over-year revenue growth in 2025 without disclosing
              the revenue base, revenue recognition policy, or mix by geography and product. The public evidence
              therefore supports a scalable distribution model and strong activity growth, but not a precise revenue
              run-rate or take-rate calculation.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
