  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and adoption logic
        blocks:
          - type: paragraph
            body: >-
              The relevant market is embedded insurance and protection distributed through digital platforms at the
              point of sale or sign-up. Cover Genius describes XCover as an API-driven distribution platform spanning
              travel, retail, ticketing, logistics, mobility, payments, property, and other categories; the company says
              it is active in more than 60 countries and all 50 U.S. states. The boundary should include the premium or
              protection economics attached to a host transaction, the orchestration technology, and policy and claims
              servicing that make the offer usable. It should exclude standalone direct-to-consumer policies, ordinary
              agent-led distribution, and the full underlying commerce value of the host transaction. The practical
              substitutes are a carrier's direct quote flow, a broker or aggregator, a platform-built protection
              product, or no purchase at all. The buying decision is therefore made by a platform or merchant, while the
              end customer is the user and the insurer or capacity provider remains central to risk and regulatory
              accountability.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and market comparability
        blocks:
          - type: paragraph
            body: >-
              Public estimates do not describe one interchangeable market. Mordor Intelligence forecasts embedded
              insurance revenue from USD 13.88 billion in 2025 to USD 18.09 billion in 2026 and USD 68.12 billion in
              2031, while Fortune Business Insights reports USD 143.88 billion in 2025, USD 176.35 billion in 2026, and
              USD 1.464 trillion in 2034. These figures differ by scope, geography, revenue convention, and methodology,
              so they are useful as directional lenses rather than additive TAM claims. A narrower infrastructure lens
              is more relevant to Cover Genius: digital/API distribution, platform and merchant budgets, carrier
              capacity, and the share of transaction-linked protection that can be localized and serviced. The company's
              own 2026 announcement cites Boston Consulting Group's forecast of gross written premiums rising from USD
              13 billion to over USD 70 billion by 2030; gross written premiums are not platform revenue or ARR. The
              market can grow rapidly while monetization, take-rate, loss costs, and partner concentration remain
              unresolved.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: Buyer segmentation and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The primary buyer is a digital platform that owns checkout, account, or post-purchase engagement and wants
              incremental protection revenue, conversion, or retention without becoming a full insurer. The user is the
              platform's customer, while the payer is usually the customer purchasing the embedded protection; carriers,
              MGAs, and reinsurers supply capacity and underwriting controls. Cover Genius says its model typically
              earns revenue shares rather than technology-license fees, making partner transaction volume and attach
              economics more important than a simple software-seat count. Adoption is helped by a contextual offer and
              lower distribution friction, but constrained by local licensing, disclosure, fair-value, consent, and
              data-governance requirements. EIOPA states that the EU Insurance Distribution Directive applies to all
              insurance products and permits member states to impose additional provisions. FCA guidance treats
              activities such as helping complete an application or concluding a contract as regulated arranging or
              dealing in specified cases. These obligations can slow multi-country launches and make compliance
              capability a buyer requirement rather than an optional feature.
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Growth is real but not directly monetizable
            body: >-
              The strongest market evidence supports structural growth in digital distribution, but public estimates
              span materially different bases and Cover Genius discloses gross written sales rather than audited
              platform revenue.
            calloutType: insight
            claimRefs:
