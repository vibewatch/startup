              - CI011
              - CI013
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer workflow and delivered product
        blocks:
          - type: paragraph
            body: >-
              Cover Genius sells protection inside digital transactions rather than sending customers to a separate
              insurer workflow. Its XCover platform is described as enabling a merchant to offer insurance or warranty
              products at the point of sale through a single API call, with bundled and standalone options across
              travel, retail, ticketing, logistics, property, payments, auto, and gig marketplaces. The current company
              description frames the platform as B2B2C: it connects digital partners and insurance carriers, adapts
              product design, pricing, and presentation to a merchant's customer journey and geography, and supports an
              end-to-end experience through claims. This is a concrete workflow advantage, but the public record does
              not expose conversion lift by partner, implementation time, or realized take rates.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE015
