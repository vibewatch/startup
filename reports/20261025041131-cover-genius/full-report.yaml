      - number: '4.2'
        title: Pricing, go-to-market, and sales efficiency
        blocks:
          - type: paragraph
            body: >-
              The commercial motion is B2B2C: digital platforms place protection inside checkout or other customer
              journeys, while Cover Genius supplies product design, distribution technology, carrier connectivity, and
              claims operations. The company describes a revenue-share model rather than a technology-license fee, and
              the 2026 release says capital will deepen enterprise integrations and improve partner conversion rates.
              Its platform was reported as connecting more than 200 partners with more than 50 global carriers. This
              creates distribution leverage because one integration can expose protection across multiple geographies
              and verticals, but partner bargaining power can also compress take rates. Public materials do not provide
              realized prices, renewal cohorts, CAC, payback, sales-cycle duration, partner-level contribution margin,
              or concentration by account. Official site material supplies operational examples, including an 868-claim
              shipping-protection sample, but does not establish realized revenue or margin. Accordingly, pricing and
              sales efficiency remain diligence requests rather than modeled outputs.
            claimRefs:
              - CI006
              - CI009
              - CI012
              - CI017
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI009
              - CI017
      - number: '4.3'
        title: Cost structure and unit economics
        blocks:
          - type: paragraph
            body: >-
              The economic engine combines software and operating costs with insurance-capacity and claims exposure.
              Public descriptions point to pricing optimization, policy administration, claims assessment, and payouts
              across jurisdictions, while the company says it works with more than 50 insurance carriers. That structure
              can scale distribution, but gross margin cannot be inferred from platform activity: carrier or reinsurer
              economics, claims severity and frequency, customer-support expense, regulatory licensing, payment costs,
              and partner revenue shares all sit between gross written sales and distributable earnings. The available
              sources do not disclose gross margin, contribution margin, loss ratio, acquisition cost, payback, or
              service cost per policy. The independent teardown specifically describes loss ratios as a black box and
              warns that reinsurance repricing could squeeze take-rate economics. Unit economics should therefore be
              underwritten with cohort-level policy, claims, capacity, and partner statements, not extrapolated from GWP
              or policy counts.
            claimRefs:
              - CI006
              - CI010
              - CI013
              - CI018
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI010
              - CI011
              - CI016
      - number: '4.4'
        title: Capital adequacy and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The July 2026 Vista Credit Partners transaction is a current financing event, not evidence of cash runway
              or profitability. Business Wire reports a $100 million capital raise backed by Vista Credit Partners at a
              $1.9 billion valuation and says the proceeds will fund enterprise integrations, AI capabilities, platform
              scalability, and selective acquisitions. The same release identifies 50% revenue growth in 2025, more than
              $3 billion of cumulative gross written sales, and 240 million policies. An independent teardown
              characterizes the $1.9 billion figure as a debt-round mark rather than a priced equity round and
              highlights missing cash, burn, runway, loss-ratio, and concentration disclosure. Capital access is
              therefore a conditional strength: structured financing can support growth without proving the company has
              sufficient unrestricted cash or debt headroom. The financial verdict is research-more: growth and
              distribution are credible, but revenue quality, margin path, and financing dependency are not sufficiently
              disclosed for a high-confidence underwriting decision.
            claimRefs:
              - CI002
              - CI003
              - CI005
              - CI012
              - CI013
              - CI016
