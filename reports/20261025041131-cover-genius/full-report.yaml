  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Cover Genius sells infrastructure to digital platforms rather than a standalone consumer policy, so its
              relevant alternatives span more than named insurtech peers. The direct set includes bolttech, Qover, and
              other embedded-distribution platforms; adjacent specialists include Extend, which emphasizes commerce
              protection, returns, and claims automation. Incumbent carriers such as Chubb and Allianz Partners can use
              existing balance sheets, licenses, and enterprise relationships to offer embedded programs, while
              status-quo buyers can keep insurance outside checkout, use a broker, or build an internal orchestration
              layer. Cover Genius's own materials describe a B2B2C platform connecting 200+ partners with 50+ carriers,
              whereas bolttech describes 700+ distribution partners across 39 markets and 7,000+ products. These are
              company-reported comparisons, not a common audited benchmark, so scale should be read as directional
              rather than proof of superior economics. CompaniesMarketCap reported Lemonade at a $3.47 billion market
              capitalization on October 24, 2026, but that is an adjacent public-equity reference rather than a
              like-for-like valuation benchmark for an embedded-distribution platform.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
