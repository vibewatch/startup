    claimRefs: [CV001, CV004, CV005, CV019]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Global distribution moat", "200+ partners, 50+ carriers, 60+ countries and all 50 US states are reported.", "Verify partner retention, concentration, exclusivity, and contribution margin."]
      - ["Embedded model can monetize scale", "AlleyWatch reports revenue-share economics and historical 145% net revenue retention.", "Provide current audited net revenue, take rate, gross margin, and cohort retention."]
      - ["AI creates upside", "October 2026 launch targets conversational commerce and claims deployment in weeks rather than quarters.", "Show paid adoption, conversion lift, claims cost, and regulatory outcomes."]
      - ["Price may be ahead of proof", "USD 1.9B mark is disclosed, while cash, burn, preferences, and audited revenue are not.", "A complete cap table and audited KPI pack could support or disconfirm the mark."]
    notes: "Historical company-provided metrics are retained with their stated period; they are not substituted for current audited performance."
    claimRefs: [CV006, CV007, CV008, CV016, CV017]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Growth remains strong; partner conversion improves; AI lowers servicing cost; audited margins are attractive.", "Current USD 1.9B mark becomes supportable only if verified revenue and margin imply a reasonable multiple.", "Upside is plausible but evidence-dependent.", "Growth requires subsidy or claims costs rise faster than monetization."]
      - [Base, "Policy and partner scale continue, but monetization and margin remain only partly disclosed.", "Hold at the financing mark for tracking; require new evidence before increasing exposure.", "Most consistent with the current public record.", "No disclosure of audited net revenue, cash use, or preference terms."]
      - [Bear, "Multiple compression, partner loss, regulatory friction, or weak agentic adoption.", "Down-round or impaired common-equity value; financing mark no longer represents realizable value.", "Material because key downside denominators are missing.", "Down round, top-partner loss, worsening claims economics, or runway stress."]
      - [Research-more, "Diligence closes cap-table, revenue-recognition, margin, concentration, and cash gaps.", "Re-rate only after evidence supports a model-appropriate multiple and target return.", "Recommended action under incomplete evidence.", "Diligence remains unavailable or contradictory."]
    notes: "Scenarios are qualitative because public sources do not provide a current audited revenue denominator, cash balance, or preference waterfall; they are not probability-weighted valuation outputs."
    claimRefs: [CV001, CV005, CV011, CV019]
