callouts:
  - calloutType: recommendation
    title: Research-more, not buy
    body: The current financing mark is credible as a transaction reference but not sufficiently evidenced as intrinsic value because revenue quality, margins, cash use, and preference terms remain undisclosed.
    claimRefs: [CV001, CV005, CV019]
  - calloutType: risk
    title: Gross written sales are not revenue
    body: Reported policy and gross-written-sales scale demonstrates distribution reach, but it does not establish Cover Genius’s retained economics or common-equity value.
    claimRefs: [CV002, CV003]
  - calloutType: assumption
    title: AI upside requires adoption proof
    body: The agentic launch is a strategic option, not a forecast; paid adoption, conversion lift, claims cost, and consumer-control outcomes still need verification.
    claimRefs: [CV016, CV017]
