  - id: TI001
    title: Revenue streams
    columns: [Stream, Mechanism, Unit or basis, Current public value/status, Quality, Diligence ask]
    rows:
      - [Embedded protection distribution, "Partner revenue share on protection sold in digital journeys", "Premium written / policy activity", "Revenue share described by company; no recognized-revenue amount disclosed", "Company-claimed model; realized revenue unavailable", "Obtain revenue-recognition policy and stream-by-stream P&L"]
      - [Commission and profit-share, "Commission plus profit-share on premium written", "Premium written and loss experience", "Mechanism described by independent teardown; no take-rate or profit-share schedule", "Third-party analysis; terms unavailable", "Obtain carrier, reinsurer, and partner settlement terms"]
      - [Subscription-like protection, "Recurring or subscription-based protection for retailers", "Subscription / renewal cohort", "Company interview says some revenue is subscription-based", "Company-claimed; cohort size and retention unavailable", "Obtain renewal, churn, and cohort contribution data"]
      - [Claims and servicing operations, "Policy administration, claims assessment, and disbursement embedded in the platform", "Claims and service transactions", "Official materials cite an 868-claim shipping-protection sample and multi-currency payouts", "Operational evidence; not a revenue figure", "Reconcile servicing cost, payment fees, and claims expense per policy"]
    notes: Revenue mechanisms combine company statements and third-party analysis; gross written sales and policy counts are not recognized revenue, and unavailable values are left qualitative.
    claimRefs: [CI001, CI004, CI009, CI017]
  - id: TI002
    title: Pricing and monetization
    columns: [Pricing or contract basis, List vs realized, Public evidence, Unknowns, Financial implication]
    rows:
      - [Partner revenue share, "Realized economics; no public list price", "Company says it typically earns revenue shares rather than technology-license fees", "Rate, split, minimums, and renewal terms", "Partner leverage can determine revenue yield per policy"]
      - [Subscription protection, "Potential recurring pricing; realized cohort data unavailable", "Company says some revenue is subscription-based as retailers adopt AppleCare-like solutions", "ARPU, churn, retention, and attach rate", "Recurring mix could improve predictability if cohorts retain"]
      - [Dynamic product pricing, "Customer-facing price is individualized; not Cover Genius revenue", "Business Wire describes real-time adaptation of product design, pricing, and presentation", "Customer price, carrier premium, commission, and discount waterfall", "Dynamic optimization may improve conversion but does not establish margin"]
      - [Shipping protection, "Historical operational sample, not a rate card", "Official site compares claim-resolution timing against published carrier rates and cites an 868-claim sample", "Premium, attach rate, loss ratio, and realized take rate", "A service benchmark cannot be converted into revenue or payback"]
    notes: Public sources describe monetization mechanisms and operational examples, not realized prices; customer-facing premium, gross written sales, commission, and company revenue must be kept separate.
    claimRefs: [CI001, CI009, CI017]
  - id: TI003
    title: Unit economics and capital inputs
    columns: [Metric, Value or null, Confidence, Why it matters, Diligence ask]
    rows:
      - [Revenue growth, "50% year-over-year in 2025", medium, "Signals strong reported momentum but lacks starting revenue and recognition detail", "Provide audited revenue bridge by stream, geography, and period"]
      - [Gross margin, null, low, "Determines whether distribution growth converts into operating leverage", "Provide gross margin and contribution margin by product and partner cohort"]
      - [Loss ratio, null, low, "Determines profit-share durability and reinsurance capacity economics", "Provide incurred and paid loss ratios by product, geography, and vintage"]
      - [CAC and payback, null, low, "Tests whether enterprise distribution growth is capital efficient", "Provide sales and implementation cost, cycle length, CAC, and payback by cohort"]
      - ["Cash, burn, and runway", null, low, "Determines ability to fund platform and claims obligations between financings", "Provide current unrestricted cash, monthly burn, runway, covenants, and debt schedule"]
    notes: Null values mean the assigned public sources did not disclose the metric; the revenue-growth value is a company-reported 2025 figure, not an independently audited rate.
    claimRefs: [CI003, CI010, CI011, CI016]

figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Customer activity enters through partner journeys, becomes premium and policy volume, and converts to Cover Genius revenue only through disclosed commission, revenue-share, and profit-share mechanisms.
    data:
      nodes:
        - id: customer-journey
          label: Partner checkout or digital journey
          detail: "Digital platforms place protection in travel, retail, ticketing, logistics, and other workflows."
        - id: policies
          label: Policies sold
          value: "240 million reported for 2025/2026"
          unit: policies
        - id: gross-written-sales
          label: Gross written sales
          value: "$3.2 billion reported"
          unit: USD
        - id: carrier-and-claims
          label: Carrier capacity and claims operations
          detail: "More than 50 global carriers are reported; loss and service costs are not disclosed."
        - id: partner-economics
          label: Partner revenue share
          detail: "Company says it typically earns revenue shares; some protection is subscription-based."
        - id: recognized-revenue
          label: Company revenue
          detail: "2025 revenue growth was reported at 50% year over year, but the base and recognition bridge are not public."
      edges:
        - [customer-journey, policies]
        - [policies, gross-written-sales]
        - [gross-written-sales, carrier-and-claims]
        - [carrier-and-claims, partner-economics]
        - [partner-economics, recognized-revenue]
      xAxis: Customer activity to company revenue
      yAxis: "Reported values and disclosed mechanisms"
    claimRefs: [CI001, CI003, CI004, CI005, CI006]

callouts:
  - calloutType: strength
    title: Distribution scale is the strongest public financial signal
    body: The company reports 200-plus partners, 50-plus carriers, more than 70 million customers, 240 million policies, and $3.2 billion of gross written sales; these figures support activity scale, but they do not substitute for recognized revenue or margin disclosure.
    claimRefs: [CI002, CI005, CI006]
  - calloutType: risk
    title: The underwriting bridge remains the core blocker
    body: Public evidence does not establish take rate, loss ratio, gross margin, cash runway, or account concentration. The $1.9 billion valuation is tied to a debt transaction rather than a disclosed priced equity round, so the valuation and capital-adequacy conclusion should remain provisional.
    claimRefs: [CI010, CI011, CI013, CI016]

