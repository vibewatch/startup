callouts:
  - calloutType: risk
    title: Regulatory evidence is the gating risk
    body: EIOPA and FCA materials show that insurance distribution carries conduct, transparency, consumer-protection, and jurisdiction-specific obligations; the assigned company evidence does not supply a current permissions matrix.
    claimRefs: [CR005, CR006, CR007]
  - calloutType: risk
    title: Scale increases dependency exposure
    body: A platform connecting 200-plus partners and 50-plus carriers can create meaningful operating leverage, but without concentration, renewal, substitution, and carrier-allocation data the same network can amplify a single-counterparty failure.
    claimRefs: [CR001, CR003, CR011]
  - calloutType: recommendation
    title: Require measurable control evidence before upgrading the thesis
    body: The next diligence package should include licenses, complaints, claims outcomes, uptime, incident history, security assurance, debt terms, cash runway, and partner concentration; absent that package, retain a research-more stance.
    claimRefs: [CR004, CR008, CR012, CR013, CR014]
