    enumerationScope:
      coverage: partial
      basis: "Public regulatory frameworks and company disclosures; not a complete legal-entity or jurisdiction inventory."
    notes: "Rows describe regulatory exposure and evidence status, not findings of non-compliance. National implementation, product type, and legal-entity facts require management confirmation."
    claimRefs: [CR005, CR006, CR007, CR012]
  - id: TR003
    title: "Operational / quality / security risk register"
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Integration failure or partner conversion deterioration, "Medium", "High", "Partial; company says integration investment improves conversion", "High", "No independent uptime, conversion, or failed-integration history"]
      - [Claims-processing delay or inconsistent outcomes, "Medium", "High", "Partial; company describes automated claims investment and review sentiment is positive", "Medium-high", "No distribution of cycle times, denials, appeals, or reserves"]
      - ["Security, privacy, or AI-control failure", "Medium", "High", "Low in public evidence; AI and platform scaling are planned priorities", "High", "No assigned independent assurance scope or incident history"]
      - [Carrier or platform counterparty disruption, "Medium", "High", "Low; counts are disclosed without concentration or termination terms", "High", "No top-counterparty exposure, renewal, exclusivity, or substitution schedule"]
      - ["Consent, suitability, or disclosure failure in transaction-triggered offers", "Medium", "High", "Partial; the commissioned study assumes permission but does not evidence production controls", "High", "No consent withdrawal, model governance, suitability, or disclosure-control evidence"]
    notes: "The table distinguishes stated initiatives from independently verified control maturity; positive review sentiment and commissioned research do not establish operational resilience."
    claimRefs: [CR003, CR008, CR009, CR010, CR013, CR015]
