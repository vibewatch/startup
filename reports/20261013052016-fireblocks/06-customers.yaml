    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / User / Payer
      - Primary Use Case
      - Estimated Scale
      - Revenue / Strategic Value
      - Diligence Gap
    rows:
      - - Tier-1 Custody Banks
        - Chief Risk Officer / Head of Digital Assets
        - Direct custody, sub-custody, and institutional treasury asset servicing
        - Select global custody leaders (e.g., BNY Mellon)
        - Highest strategic lock-in; long enterprise sales cycle with custom integration
        - Production volume and fee schedule under strict NDA
      - - Retail & Neo-Brokers
        - VP Engineering / Head of Product
        - Embedded MPC Wallets-as-a-Service for consumer crypto trading & retail onboarding
        - Major global fintechs (e.g., Revolut)
        - High transaction volume and recurring WaaS license revenue
        - Contract renewal terms and multi-vendor migration risk undisclosed
      - - Global Payment Processors
        - Head of Global Treasury / Settlement Operations
        - Stablecoin orchestration, cross-border payouts, and merchant settlement
        - Tier-1 acquirers and merchant networks (e.g., Worldpay)
        - Fast-growing stablecoin network fees and volume-based revenue capture
        - Merchant stablecoin settlement transaction volumes unverified
      - - Crypto Exchanges & Trading Desks
        - Head of Trading Operations / Head of Security
        - Hot/warm treasury management, automated counterparty routing via Network
        - 1,400+ connected network counterparties globally
        - Network liquidity velocity, foundational counterparty connectivity
        - Exchange counterparty concentration and volume volatility
