        - Streamlined cross-border settlement rails bypassing traditional multi-day banking rails
        - Merchant adoption pace and regulatory constraints on stablecoin settlement
      - - ANZ Bank
        - Tier-1 Regional Bank
        - A$DC stablecoin pilot with Zerocap and Victor Smorgon Group
