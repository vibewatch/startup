figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: Six-stage institutional onboarding, integration, governance setup, and expansion journey from sandbox evaluation to cross-border settlement orchestration.
    data:
      items:
        - label: 1. Technical Evaluation & Cryptographic Audit
          touchpoints:
            - Security architecture assessment
            - MPC-CMP vs multisig comparison
            - SOC 2 Type II and ISO 27001 review
        - label: 2. Governance Policy & Admin Quorum Setup
          touchpoints:
            - Admin quorum policy definition
            - Multi-factor authentication enforcement
            - Role-based approval matrices
        - label: 3. API Sandbox & Wallet Infrastructure Integration
          touchpoints:
            - Developer docs SDK testing
            - Vault account provisioning
            - Automated webhook configuration
        - label: 4. Treasury Launch & Network Counterparty Routing
          touchpoints:
            - Deposit address automation
            - 1,400+ network counterparty connectivity
            - KYT/AML screening with Chainalysis and Elliptic
        - label: 5. Product Line Expansion (WaaS & Embedded Wallets)
          touchpoints:
            - White-label embedded wallet SDK deployment
            - Client direct custody expansion
            - DApp and staking integration
        - label: 6. Global Settlement & Tokenization Orchestration
          touchpoints:
            - Cross-border stablecoin payout network
            - Smart contract tokenization engine
            - Real-world asset secondary trading
    approximationNotes: Journey stages synthesized from Fireblocks enterprise onboarding documentation, bank evaluation criteria, and developer guides.
    claimRefs:
      - CU013
      - CU014
callouts:
  - calloutType: strength
    title: Institutional Reference Quality & Network Density
    body: Fireblocks has achieved Tier-1 institutional validation that few digital asset infrastructure competitors can match, securing live production deployments with foundational financial institutions including BNY Mellon, Revolut, and Worldpay. The density of its 1,400+ counterparty transfer network creates significant switching costs and structural lock-in for enterprise treasuries.
    claimRefs:
      - CU003
      - CU009
      - CU010
      - CU011
  - calloutType: risk
    title: Retention Opacity and Disintermediation Vulnerability
    body: Despite impressive headline counts of 2,200+ organizations and $10 trillion in secured transaction volume, Fireblocks maintains complete opacity regarding net retention rates, customer churn, and contract concentration. Furthermore, independent analysis highlights long-term technological risks where native blockchain security advancements or alternate consensus protocols could reduce enterprise reliance on external MPC layers.
    claimRefs:
      - CU005
      - CU013
      - CU014
