company:
  name: Fireblocks
chapter:
  number: 6
  title: Customers
  summary: Fireblocks has secured tier-one institutional adoption across 2,200+ organizations, including marquee production deployments at BNY Mellon, Revolut, and Worldpay. The platform leverages strong network effects via 1,400+ connected counterparties, though long-term durability faces retention opacity and technological obsolescence risks.
sections:
  - id: customer-segmentation
    title: Institutional Customer Segmentation & Target Personas
    body: 'Fireblocks structures its commercial reach around four distinct institutional customer segments: global custody banks, retail fintech brokers, merchant payment processors, and crypto-native trading venues. Each segment addresses differing operational pain points while sharing a common requirement for enterprise-grade cryptographic key protection and role-based policy enforcement. For global custody banks such as BNY Mellon, the primary driver is enabling client asset servicing and direct custody under strict regulatory and supervisory compliance frameworks. Retail fintechs and neo-brokers such as Revolut leverage Wallets-as-a-Service to embed non-custodial or direct-custody wallets into consumer applications, eliminating friction around seed phrases and manual key backups. Payment processors and merchant acquirers utilize Fireblocks stablecoin rails to bypass legacy correspondent banking settlement delays. Finally, crypto exchanges and liquidity providers rely on the Fireblocks Network to execute automated counterparty transfers across 1,400+ connected entities without the vulnerability of manual deposit address handling.'
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
    tableRefs:
      - TU001
  - id: adoption-trajectory
    title: Adoption Trajectory & Network Connectivity
    body: 'The adoption trajectory of Fireblocks reflects substantial institutional scale, with third-party tracking and platform disclosures reporting more than 2,200 organizations served globally. Platform usage metrics indicate that Fireblocks has secured over $10 trillion in cumulative digital asset transactions across more than 100 supported blockchain protocols. A central competitive moat reinforcing this adoption trajectory is the Fireblocks Network, which connects more than 1,400 institutional counterparties to automate address rotation and deposit whitelisting. By eliminating manual test transfers and mitigating address spoofing risks, the Network generates self-reinforcing network effects: as more liquidity providers and exchanges join the routing layer, incoming institutional customers face compelling commercial incentives to adopt the same rails for seamless settlement. Furthermore, platform expansion across 120+ blockchains ensures that institutional clients can deploy assets across diverse ecosystems without replatforming their core security and governance infrastructure.'
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
    tableRefs:
      - TU002
  - id: named-customer-proof
    title: Enterprise Customer Proof & Production Case Studies
    body: Publicly verifiable enterprise customer deployments confirm that Fireblocks has transitioned from early crypto-native pilots to mission-critical production infrastructure inside established financial institutions. The most prominent institutional proof point is BNY Mellon, the oldest custody bank in the United States, which integrated Fireblocks technology into its Digital Asset Custody Platform to service institutional digital holdings within regulated compliance parameters. In the consumer neo-banking sector, Revolut utilizes Fireblocks MPC infrastructure to deliver scalable digital asset trading to millions of retail end users while preserving enterprise-grade key security. In commercial payments, global merchant acquirer Worldpay leverages Fireblocks for cross-border stablecoin settlement and payout orchestration. Additional institutional experimentation includes ANZ Bank, which completed a pilot transfer of 30 million Australian dollars using its A$DC stablecoin in under ten minutes. These named references demonstrate broad cross-vertical validation across custody, consumer fintech, payments, and banking rails.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
    tableRefs:
      - TU003
  - id: retention-expansion-risks
    title: Customer Durability, Expansion Loops & Concentration Risks
    body: 'While Fireblocks demonstrates strong enterprise adoption and Tier-1 reference customer quality, key diligence gaps surround revenue retention durability, customer churn, and structural technology substitution. The enterprise customer journey typically initiates with sandbox testing and cryptographic audits, expands into treasury vault governance, and subsequently scales into embedded wallets and tokenization engines. This progressive adoption trajectory creates powerful land-and-expand revenue dynamics as customer transaction volume and supported wallet counts grow. However, Fireblocks does not publicly disclose certified net retention rates (NRR), gross retention rates (GRR), or annual logo churn metrics, leaving the durability of smaller customer cohorts unverified. Additionally, independent research emphasizes long-term technology obsolescence risks: if underlying Layer-1 blockchains develop native cryptographic abstractions or advanced account abstraction consensus models that eliminate the necessity of external multi-party computation layers, Fireblocks could face margin compression and disintermediation pressure.'
    claimRefs:
      - CU013
      - CU014
    figureRefs:
      - FU001
tables:
