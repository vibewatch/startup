callouts:
  - calloutType: risk
    title: Critical Dependency on Hardware Enclave Integrity and Multi-Cloud Redundancy
    body: >-
      While Fireblocks multi-party computation architecture ensures private keys are never assembled as a single secret,
      the infrastructure relies heavily on Intel SGX hardware secure enclaves and tier-one cloud data centers. An
      undisclosed architectural vulnerability in enclave memory isolation or a correlated multi-region cloud disruption
      represents the primary catastrophic risk surface requiring ongoing cryptographic and hardware audits.
    claimRefs:
      - CR002
      - CR003
      - CR011
  - calloutType: insight
    title: Governance Quorum Controls Shift Vulnerability from Cryptography to Identity
    body: >-
      Because mathematical key security is robustly handled by MPC-CMP, practical enterprise risk migrates from
      cryptographic attack vectors to organizational governance. Admin Quorums and Transaction Authorization Policies
      protect against rogue administrators, but client operational hygiene, device security, and strict separation of
      duties remain essential to prevent credential compromise and fraudulent transfer authorization.
    claimRefs:
      - CR001
      - CR004
      - CR013
