callouts:
  - calloutType: "insight"
    title: "Commercial Model Shift to Enterprise Infrastructure"
    body: "Fireblocks' revenue model has transitioned from pure key management software to an operating system for digital asset institutions. While entry-level pricing starts at $699 per month on Essentials, true enterprise economics are driven by sales-negotiated custom contracts starting at $18,000 annually, coupled with transaction overages across its transfer network."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
  - calloutType: "risk"
    title: "Underwriting Opacity Around Gross Margins and Unit Retention"
    body: "Although Fireblocks has demonstrated exceptional financial resilience by funding operations without external capital since its $8 billion Series E round in 2022, critical financial metrics including GAAP gross margin, net revenue retention, and software-versus-volume revenue mix remain entirely undisclosed."
    claimRefs:
      - "CI004"
      - "CI007"
      - "CI008"
