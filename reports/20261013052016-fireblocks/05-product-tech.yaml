callouts:
  - calloutType: strength
    title: "Cryptographic Resilience of MPC-CMP vs Legacy Multi-Sig"
    body: "Fireblocks' implementation of the MPC-CMP protocol provides structural advantages over legacy hardware security modules and on-chain multi-sig wallets. By performing threshold signing off-chain and never reconstructing a complete private key, the platform eliminates single points of compromise while avoiding chain-specific smart contract vulnerabilities and high gas overhead across heterogeneous blockchains."
    claimRefs:
      - CE001
      - CE002
      - CE003

  - calloutType: risk
    title: "Hardware Enclave Vulnerabilities and Proprietary Implementation Opacity"
    body: "While Fireblocks maintains third-party certifications including SOC 2 Type II and ISO 27001/27017/27018, its core MPC-CMP cryptographic implementation and developer tooling remain closed-source and proprietary. Furthermore, heavy reliance on Intel SGX for hardware-level isolation exposes the architecture to hardware side-channel risks, necessitating continuous microcode patching and strict operational vigilance."
    claimRefs:
      - CE004
      - CE009
      - CE010
      - CE015

