company:
  name: "Fireblocks"
chapter:
  number: 5
  title: "Product & Technology"
  summary: "Fireblocks delivers institutional digital asset infrastructure combining proprietary MPC-CMP threshold cryptography, Intel SGX hardware enclaves, automated policy governance, and a 1,400+ member counterparty transfer network. While SOC 2 Type II and ISO certifications validate its operational maturity, technical underwriting must account for proprietary cryptographic opacity, Intel SGX hardware side-channel risks, and non-custodial regulatory boundaries."
sections:
  - id: "product-definition-and-modular-footprint"
    title: "Product Definition and Modular Footprint"
    body: "Fireblocks operates as an enterprise-grade digital asset infrastructure platform delivering direct custody, treasury management, and blockchain connectivity for institutional market participants. Unlike retail wallet interfaces or custodial trust companies that assume legal counterparty possession of assets, Fireblocks provides software infrastructure that enables institutions to retain full operational ownership and control of their cryptographic assets without counterparty risk. The platform organizes its commercial footprint across four core operational modules: Treasury Management for enterprise custody and internal fund consolidation; Wallets-as-a-Service (WaaS) for institutional banks, exchanges, and brokers requiring scalable wallet infrastructure; Embedded Wallets for consumer-facing Web3 and fintech applications; and an end-to-end Tokenization Engine supporting asset minting, governance, and secondary market distribution across major public and permissioned blockchains. Together, these modules allow institutions to consolidate previously fragmented custody tools into a unified operating environment governed by strict administrative rules."
    claimRefs:
      - CE001
      - CE007
      - CE008
    tableRefs:
      - TE001

  - id: "cryptographic-architecture-and-defense-in-depth"
    title: "Cryptographic Architecture and Defense-in-Depth Model"
    body: "At the technical core of the Fireblocks platform is its multi-party computation protocol, designated MPC-CMP. Traditional institutional setups historically relied on physical hardware security modules (HSMs) or on-chain multi-signature smart contracts, which introduced physical single points of failure, protocol-specific limitations, and significant on-chain gas expenses. Fireblocks' MPC-CMP distributes cryptographic private key shares across separate tier-1 cloud environments and hardware enclaves, executing transaction signing through threshold mathematical operations without ever assembling a complete private key. The company asserts that this protocol achieves signing velocities up to eight times faster than standard MPC schemes while maintaining support for offline cold storage workflows. Fireblocks wraps this cryptographic engine within a four-layer defense-in-depth security structure: Layer 1 executes MPC-CMP signing; Layer 2 leverages Intel SGX hardware secure enclaves to protect memory space and API keys from rogue administrators or compromised operating systems; Layer 3 implements the Policy Engine to enforce rule evaluation in secure memory; and Layer 4 provides the Fireblocks Network to authenticate counterparties."
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
    figureRefs:
      - FE001
    tableRefs:
      - TE003

  - id: "institutional-counterparty-network-and-api-connectivity"
    title: "Institutional Counterparty Network and API Connectivity"
    body: "Beyond internal custody, a substantial technical differentiator for Fireblocks is the Fireblocks Network, an institutional asset transfer layer connecting more than 1,400 financial institutions, liquidity desks, and cryptocurrency exchanges. In conventional crypto operations, cross-entity transfers require manual copying of hexadecimal deposit addresses, execution of low-value test transfers, and manual address whitelisting—processes highly vulnerable to address spoofing attacks, clipboard hijacking malware, and operator error. The Fireblocks Network automates counterparty identity verification and deposit address rotation, establishing authenticated channels that enable immediate institutional settlement. For programmatic operations, Fireblocks exposes an API-first surface featuring REST APIs, real-time webhooks, and software development kits for Python, JavaScript, and Java. These developer tools allow algorithmic trading firms, payment processors, and exchanges to automate high-volume treasury rebalancing, client withdrawals, and cross-border stablecoin settlements with programmatic policy checks."
    claimRefs:
      - CE006
      - CE011
      - CE012
      - CE013
    tableRefs:
      - TE002

  - id: "governance-controls-compliance-and-technical-risks"
    title: "Governance Controls, Compliance Attestations, and Technical Diligence Risks"
    body: "Enterprise governance is operationalized through Fireblocks' Transaction Authorization Policy (TAP) engine and Admin Quorum framework. Organizations configure granular transfer rules based on amount thresholds, asset types, source vaults, destination allowlists, and multi-user approval hierarchies, effectively preventing rogue employee collusion or unauthorized administrative changes. Compliance is integrated directly into transaction pipelines through automated integrations with AML and transaction screening providers Chainalysis and Elliptic. Fireblocks' security posture is substantiated by annual SOC 2 Type II audits conducted by Ernst & Young, ISO 27001, 27017, and 27018 certifications, and third-party penetration testing by COMSEC and NCC Group. However, key diligence risks remain: deployment requires two to eight weeks of specialized engineering effort; Fireblocks operates as a software provider rather than a qualified custodian; the core MPC-CMP implementation remains proprietary and closed-source; and heavy reliance on Intel SGX hardware enclaves introduces exposure to CPU-level side-channel vulnerabilities that cannot be fully mitigated in software."
    claimRefs:
      - CE005
      - CE009
      - CE010
      - CE013
      - CE014
      - CE015

