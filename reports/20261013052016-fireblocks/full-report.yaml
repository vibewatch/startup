              - CI012
      - number: '4.3'
        title: Unit Economics, Public Traction, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >
              Fireblocks demonstrates verified enterprise adoption scale, reporting more than $10 trillion in cumulative
              lifetime assets secured and serving over 2,400 institutional clients globally, including traditional
              financial institutions such as BNY Mellon and BNP Paribas alongside digital asset leaders such as Revolut.
              Nevertheless, a sharp divide exists between publicly disclosed scale proxies and confidential unit
              economics. Because Fireblocks operates as a privately held enterprise, verified figures for annual
              recurring revenue (ARR), net revenue retention (NRR), customer acquisition cost (CAC) payback, and gross
              margins remain undisclosed. While high switching costs and operational embeddedness suggest favorable
              customer retention characteristics, the absence of management-certified gross margins and
              volume-versus-software revenue mix represents a material diligence gap for institutional underwriters
              assessing long-term software cash flow margins.
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI008
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI006
              - CI008
      - number: '4.4'
        title: Capital Adequacy, Cash Burn, and Financial Verdict
        blocks:
          - type: paragraph
            body: >
              From a capital adequacy perspective, Fireblocks exhibits rare financial independence among growth-stage
              digital asset infrastructure vendors. The company closed a $550 million Series E financing at an $8
              billion post-money valuation in January 2022 and has operated without raising external primary venture
              capital through the subsequent four years. Commercial revenues have supported operating requirements,
              enabling Fireblocks to weather extended digital asset market contractions that impaired competing
              custodial and lending platforms. Furthermore, the company has deployed balance sheet capital into
              programmatic acquisitions, purchasing crypto accounting vendor TRES Finance for $130 million in January
              2026 after acquiring authentication specialist Dynamic in late 2025. Although forward cash balances and
              operating margins remain private, Fireblocks maintains strong capital adequacy, shifting the primary
              diligence focus toward margin expansion and exit readiness rather than near-term solvency.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
