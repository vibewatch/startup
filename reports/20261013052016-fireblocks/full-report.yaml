              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO004
              - CO009
      - number: '1.4'
        title: Commercial Operating Scale, Strategic M&A, and Corporate Milestones
        blocks:
          - type: paragraph
            body: >-
              Fireblocks has expanded its operating footprint to secure over $16 trillion in aggregate transaction
              volume across more than 200 public and permissioned blockchains. The platform serves more than 2,500
              institutional clients, providing automated connectivity to trading desks, liquidity providers, and central
              clearing venues. Fireblocks' corporate evolution demonstrates consistent strategic expansion: following
              early traction, the firm was selected by the Securities Commission of The Bahamas in November 2022 to
              secure digital assets during the collapse of FTX. To broaden its enterprise functionality beyond custody
              into complete financial operations, Fireblocks completed the acquisition of crypto wallet developer
              Dynamic in October 2025 and crypto accounting platform TRES Finance for $130 million in January 2026.
              Furthermore, Fireblocks co-founded the Blockchain Payment Consortium in November 2025 with the Solana
