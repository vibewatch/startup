        title: Executive Leadership, Governance Board, and Key-Person Structure
        blocks:
          - type: paragraph
            body: >-
              Fireblocks is led by co-founder and Chief Executive Officer Michael Shaulov, a seasoned cybersecurity
              entrepreneur who previously founded Lacoon Mobile Security before its acquisition by Check Point Software
              Technologies. The executive leadership team consists of 18 senior managers overseeing engineering,
              product, compliance, and enterprise commercial growth across global financial hubs. Corporate governance
              is reinforced by an experienced board of directors featuring prominent venture capital partners and crypto
              pioneers, including Gili Raanan of Cyberstarts and Sequoia Capital, alongside Fred Ehrsam, co-founder of
              Coinbase and Paradigm. The company's organizational governance reflects a dual heritage of military-grade
              cybersecurity discipline and enterprise software execution. Key-person concentration remains centered on
              CEO Michael Shaulov, whose strategic positioning and deep regulatory credibility have proven essential in
              securing conservative transaction banking partnerships globally.
