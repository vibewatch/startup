      - number: '4.2'
        title: Pricing Dynamics, Packaging, and Enterprise GTM
        blocks:
          - type: paragraph
            body: >
              Fireblocks' go-to-market structure reflects a hybrid commercial model transitioning from developer
              evaluation to high-touch enterprise procurement. At the entry level, the company offers a standardized
              Essentials tier priced at $699 monthly for up to six months, bundling production access, one thousand
              embedded wallets, and $1 million in monthly outbound volume to capture early-stage fintech builders.
              However, the substantial commercial economics reside within custom Pro, Enterprise, and Enterprise+ tiers,
              which commence at an annual baseline of $18,000 and scale upward based on dedicated service level
              agreements, API thresholds, and custom compliance integrations. Channel distribution is expanded via
              enterprise ecosystems such as the Microsoft Commercial Marketplace, accelerating compliance sign-off.
              Enterprise customer commitments introduce meaningful operational lock-in as institutions embed governance
              quorums, multi-admin policy rules, and automated treasury workflows directly into core operations.
            claimRefs:
