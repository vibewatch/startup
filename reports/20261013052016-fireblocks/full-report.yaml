chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Core Mission, and Technological Foundation
        blocks:
          - type: paragraph
            body: >-
              Founded in 2018 and headquartered in New York City, Fireblocks operates as a foundational digital asset
              and stablecoin infrastructure company. The firm was created to solve the critical vulnerability that
              traditional crypto institutions faced when managing digital assets: private key compromise, single points
              of failure, and operational security breakdowns. Rather than functioning as a retail wallet or a
              traditional trust custodian, Fireblocks delivers a direct custody operating system. Its architecture
              merges multi-party computation protocol MPC-CMP with hardware-isolated Intel SGX enclaves and an automated
              policy engine. This technological configuration eliminates single private key assembly, enforces granular
              maker-checker quorum approvals, and integrates real-time anti-money laundering transaction screening. As
              digital asset adoption accelerates across regulated banking institutions, Fireblocks provides the
              enterprise software layer required to operate custody, trading, cross-border stablecoin payments, and
              asset tokenization at institutional scale.
            claimRefs:
              - CO001
              - CO006
              - CO010
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
