      - number: '1.3'
        title: Capitalization History, Valuation Marks, and Stakeholder Ecosystem
        blocks:
          - type: paragraph
            body: >-
              Fireblocks has accumulated more than $1 billion in venture capital backing through institutional financing
              rounds led by premier global investment firms including Sequoia Capital and Paradigm. The company's peak
              public private-market valuation mark reached $8 billion following its Series E round. However, recent
              secondary market data and third-party benchmark evaluations indicate multiple compression across fintech
              and crypto infrastructure assets. On the Hurun Global Unicorn Index 2026, Fireblocks was valued at 54
              billion RMB (approximately $7.5 billion), falling from 58.5 billion RMB and rank 83 in 2025 to rank 112 in
              2026. Despite macroeconomic multiple contraction, Fireblocks maintains a deeply entrenched stakeholder
              ecosystem spanning global transaction banks such as BNY Mellon, tier-one European institutions like ABN
              AMRO, and high-velocity consumer neobanks including Revolut, creating formidable switching barriers and
              network liquidity effects.
            claimRefs:
