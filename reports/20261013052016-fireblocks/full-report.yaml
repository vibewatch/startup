  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Modular Footprint
        blocks:
          - type: paragraph
            body: >-
              Fireblocks operates as an enterprise-grade digital asset infrastructure platform delivering direct
              custody, treasury management, and blockchain connectivity for institutional market participants. Unlike
              retail wallet interfaces or custodial trust companies that assume legal counterparty possession of assets,
              Fireblocks provides software infrastructure that enables institutions to retain full operational ownership
              and control of their cryptographic assets without counterparty risk. The platform organizes its commercial
              footprint across four core operational modules: Treasury Management for enterprise custody and internal
              fund consolidation; Wallets-as-a-Service (WaaS) for institutional banks, exchanges, and brokers requiring
              scalable wallet infrastructure; Embedded Wallets for consumer-facing Web3 and fintech applications; and an
              end-to-end Tokenization Engine supporting asset minting, governance, and secondary market distribution
              across major public and permissioned blockchains. Together, these modules allow institutions to
              consolidate previously fragmented custody tools into a unified operating environment governed by strict
              administrative rules.
            claimRefs:
              - CE001
              - CE007
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE007
              - CE008
      - number: '5.2'
        title: Cryptographic Architecture and Defense-in-Depth Model
        blocks:
          - type: paragraph
            body: >-
              At the technical core of the Fireblocks platform is its multi-party computation protocol, designated
              MPC-CMP. Traditional institutional setups historically relied on physical hardware security modules (HSMs)
              or on-chain multi-signature smart contracts, which introduced physical single points of failure,
              protocol-specific limitations, and significant on-chain gas expenses. Fireblocks' MPC-CMP distributes
              cryptographic private key shares across separate tier-1 cloud environments and hardware enclaves,
              executing transaction signing through threshold mathematical operations without ever assembling a complete
              private key. The company asserts that this protocol achieves signing velocities up to eight times faster
              than standard MPC schemes while maintaining support for offline cold storage workflows. Fireblocks wraps
              this cryptographic engine within a four-layer defense-in-depth security structure: Layer 1 executes
              MPC-CMP signing; Layer 2 leverages Intel SGX hardware secure enclaves to protect memory space and API keys
              from rogue administrators or compromised operating systems; Layer 3 implements the Policy Engine to
              enforce rule evaluation in secure memory; and Layer 4 provides the Fireblocks Network to authenticate
              counterparties.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
