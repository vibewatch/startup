              banks, exchanges, and fintech applications. In parallel, Fireblocks monetizes network activity through its
              Network for Payments, facilitating institutional stablecoin settlement across more than one hundred
              countries and ninety blockchains. Transaction-based fees and volume tiers supplement baseline recurring
              subscription revenue as client transaction velocity expands.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
              - CI013
