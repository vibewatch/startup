  - id: TV001
    title: Recommendation summary table
    columns:
      - Metric / Dimension
      - Stance / Rating
      - Key Evidence & Rationale
      - Decision Implication
    rows:
      - - Recommendation
        - Research-More
        - Institutional scale is proven across 2,000+ clients, but financial opacity obscures fundamental unit economics
        - Do not write new capital at $8B without audited ARR and gross margin disclosure
      - - Confidence
        - Medium
        - >-
          High evidence density on technical architecture and client adoption, but low visibility on financial
          sustainability
        - Sufficient to rule out immediate strong-buy, requires confirmatory financial audit
      - - Risk Rating
        - High
        - Down-round exposure from 2022 Series E valuation overhang and unquantified litigation/secondary dynamics
        - Size positions conservatively and negotiate structured downside protections
      - - Valuation Stance
        - Stretched
        - Historical $8B Series E post-money valuation represents severe multiple compression risk vs current comps
        - Seek entry mark below $4B or target structured convertible terms
    notes: >-
      Synthesized from institutional client adoption evidence, $1.04B capital raised, and private market multiple
      compression benchmarks.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Perspective
      - Core Argument
      - Supporting Evidence
      - What Would Change View
    rows:
      - - 'Bull Thesis: Market Standard'
        - Fireblocks operates as the indispensable infrastructure rail for institutional crypto custody and settlement
        - Over 2,000 institutional clients, $10T+ secured, core banking integrations with Temenos and BNY Mellon
        - Major enterprise client defections to competing custody stacks or systemic MPC protocol vulnerability
      - - 'Bull Thesis: Platform Expansion'
        - Strategic acquisitions expand Fireblocks from custody into full-stack corporate treasury and accounting
        - Acquisitions of TRES Finance for $130M and Dynamic wallet infrastructure in late 2025 / early 2026
        - Inability to cross-sell accounting tools to existing custody client base or high integration churn
      - - 'Anti-Thesis: Valuation Overhang'
        - The $8B valuation set in Jan 2022 reflects peak-cycle multiple euphoria that public markets do not support
        - >-
          Series E closed over 4.5 years ago; Hurun 2026 index marks valuation down to 54B RMB with rank falling to
          112th
        - Disclosure of profitable operations with ARR exceeding $400M at 75%+ software gross margins
      - - 'Anti-Thesis: Enterprise Opacity'
        - Complete absence of public audited ARR, margins, and churn rates prevents rigorous DCF or multiple modeling
        - Public sources report headcount and transaction volume but zero GAAP revenue or cash burn numbers
        - Audited financial disclosure verifying positive cash flow and net revenue retention above 120%
    notes: Core thesis drivers evaluated against verifiable public adoption metrics and private market valuation marks.
    claimRefs:
      - CV001
      - CV003
      - CV006
      - CV007
      - CV008
      - CV009
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability
      - Operating Assumptions
      - Implied Valuation
      - Key Downside Triggers
    rows:
      - - Bull Case
        - 25%
        - Successful enterprise cross-sell of TRES Finance and Dynamic; ARR reaches $400M+ at 8x multiple
        - $3.2B - $4.0B
        - Failure of institutional stablecoin adoption or regulatory restrictions on tokenization rails
      - - Base Case
        - 50%
        - Steady custody SaaS growth with core banking partners (Temenos, BNY); estimated ARR $200M-$250M at 6x multiple
        - $1.2B - $1.5B
        - Pricing pressure from open-source MPC alternatives and commoditization of wallet-as-a-service
      - - Bear Case
        - 25%
        - Multiple compression, customer concentration loss, or secondary liquidation down-round at 4x multiple
        - $600M - $800M
        - Material security breach or severe regulatory action capping institutional digital asset activities
    notes: >-
      Scenario valuation multiples benchmarked against publicly traded digital asset infrastructure and cybersecurity
      comps.
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV010
      - CV011
