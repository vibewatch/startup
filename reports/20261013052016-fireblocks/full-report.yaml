  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Fireblocks multi-layer defense-in-depth architecture spanning client integration, governance policies, MPC
      cryptography, hardware enclaves, settlement networking, and multi-chain execution.
    data:
      layers:
        - label: Client Application & API Integration Layer
          detail: Developer SDKs in Python, JavaScript, and Java; REST APIs; and mobile approval apps
          modules:
            - name: REST API & Webhook Infrastructure
            - name: Developer SDKs & Integration Tooling
        - label: Governance & Transaction Policy Engine
          detail: Admin Quorum and Transaction Authorization Policy (TAP) evaluated inside secure enclaves
          modules:
            - name: Rule Engine (Limits, Allowlists, Roles)
            - name: Admin Quorum & Multi-Party Approvals
        - label: Cryptographic MPC-CMP Protocol
          detail: Off-chain distributed mathematical key share signing without whole private key assembly
          modules:
            - name: MPC-CMP Fast Signing Protocol
            - name: Distributed Key Share Generation & Storage
        - label: Hardware Secure Enclaves
          detail: Intel SGX enclaves isolating cryptographic algorithms, key shares, and API secrets
          modules:
            - name: Intel SGX Memory Isolation
            - name: Exchange API Credential Vaults
        - label: Institutional Counterparty Network
          detail: Authenticated institutional network mitigating deposit address spoofing
          modules:
            - name: Fireblocks Network Counterparty Directory
            - name: Automated Deposit Address Rotation
        - label: Multi-Chain & Smart Contract Layer
          detail: Direct connectivity to 70+ to 120+ blockchain networks and tokenization smart contracts
          modules:
            - name: Layer 1 & Layer 2 Chain Connectors
            - name: Tokenization Engine & DeFi Protocols
    approximationNotes: >-
      Layer hierarchy illustrates the defense-in-depth software and cryptographic boundaries detailed in Fireblocks
      technical documentation.
