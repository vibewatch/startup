callouts:
  - calloutType: "insight"
    title: "Infrastructure Moats Shift from Signing Speed to Regulated Network Density"
    body: "While initial institutional adoption was driven by cryptographic signing performance (MPC-CMP's 8x speed advantage over legacy MPC), current market expansion is anchored in counterparty network connectivity. With over 1,400 connected counterparties and automated deposit address verification, the Fireblocks Network transforms a pure software utility into a two-sided clearing network with high switching barriers."
    claimRefs:
      - "CM008"
      - "CM010"
  - calloutType: "risk"
    title: "Conflation of Gross Transfer Volume with Recurring Software Revenue"
    body: "A persistent analytical challenge in sizing institutional digital asset infrastructure is the divergence between headline transaction scale ($10 trillion cumulative volume and $6 trillion annual stablecoin flows) and actual captured software ARR. Because platform pricing models blend fixed software tiers with volume charges, investors cannot project recurring margin expansion without audited disclosures separating license ARR from throughput fees."
    claimRefs:
      - "CM003"
      - "CM004"
      - "CM014"
