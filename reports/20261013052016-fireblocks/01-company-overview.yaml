company:
  name: Fireblocks
chapter:
  number: 1
  title: Company Overview
  summary: Fireblocks is an institutional digital asset infrastructure and MPC wallet technology provider founded in 2018,
    securing over $16 trillion in transactions across 200+ blockchains for 2,500+ organizations while maintaining private
    financial opacity and facing multiple-driven valuation compression.
sections:
- id: identity-and-mission
  title: Company Identity, Core Mission, and Technological Foundation
  body: 'Founded in 2018 and headquartered in New York City, Fireblocks operates as a foundational digital asset and stablecoin
    infrastructure company. The firm was created to solve the critical vulnerability that traditional crypto institutions
    faced when managing digital assets: private key compromise, single points of failure, and operational security breakdowns.
    Rather than functioning as a retail wallet or a traditional trust custodian, Fireblocks delivers a direct custody operating
    system. Its architecture merges multi-party computation protocol MPC-CMP with hardware-isolated Intel SGX enclaves and
    an automated policy engine. This technological configuration eliminates single private key assembly, enforces granular
    maker-checker quorum approvals, and integrates real-time anti-money laundering transaction screening. As digital asset
    adoption accelerates across regulated banking institutions, Fireblocks provides the enterprise software layer required
    to operate custody, trading, cross-border stablecoin payments, and asset tokenization at institutional scale.'
  claimRefs:
  - CO001
  - CO006
  - CO010
  - CO014
  tableRefs:
  - TO001
- id: governance-and-leadership
  title: Executive Leadership, Governance Board, and Key-Person Structure
  body: Fireblocks is led by co-founder and Chief Executive Officer Michael Shaulov, a seasoned cybersecurity entrepreneur
    who previously founded Lacoon Mobile Security before its acquisition by Check Point Software Technologies. The executive
    leadership team consists of 18 senior managers overseeing engineering, product, compliance, and enterprise commercial
    growth across global financial hubs. Corporate governance is reinforced by an experienced board of directors featuring
    prominent venture capital partners and crypto pioneers, including Gili Raanan of Cyberstarts and Sequoia Capital, alongside
    Fred Ehrsam, co-founder of Coinbase and Paradigm. The company's organizational governance reflects a dual heritage of
    military-grade cybersecurity discipline and enterprise software execution. Key-person concentration remains centered on
    CEO Michael Shaulov, whose strategic positioning and deep regulatory credibility have proven essential in securing conservative
    transaction banking partnerships globally.
  claimRefs:
  - CO002
  - CO003
  - CO014
  tableRefs:
  - TO002
- id: investor-and-stakeholder-map
  title: Capitalization History, Valuation Marks, and Stakeholder Ecosystem
  body: Fireblocks has accumulated more than $1 billion in venture capital backing through institutional financing rounds
    led by premier global investment firms including Sequoia Capital and Paradigm. The company's peak public private-market
    valuation mark reached $8 billion following its Series E round. However, recent secondary market data and third-party
    benchmark evaluations indicate multiple compression across fintech and crypto infrastructure assets. On the Hurun Global
    Unicorn Index 2026, Fireblocks was valued at 54 billion RMB (approximately $7.5 billion), falling from 58.5 billion RMB
    and rank 83 in 2025 to rank 112 in 2026. Despite macroeconomic multiple contraction, Fireblocks maintains a deeply entrenched
    stakeholder ecosystem spanning global transaction banks such as BNY Mellon, tier-one European institutions like ABN AMRO,
    and high-velocity consumer neobanks including Revolut, creating formidable switching barriers and network liquidity effects.
  claimRefs:
  - CO004
  - CO005
  - CO009
  tableRefs:
  - TO003
- id: operational-scale-and-milestones
  title: Commercial Operating Scale, Strategic M&A, and Corporate Milestones
  body: 'Fireblocks has expanded its operating footprint to secure over $16 trillion in aggregate transaction volume across
    more than 200 public and permissioned blockchains. The platform serves more than 2,500 institutional clients, providing
    automated connectivity to trading desks, liquidity providers, and central clearing venues. Fireblocks'' corporate evolution
    demonstrates consistent strategic expansion: following early traction, the firm was selected by the Securities Commission
    of The Bahamas in November 2022 to secure digital assets during the collapse of FTX. To broaden its enterprise functionality
    beyond custody into complete financial operations, Fireblocks completed the acquisition of crypto wallet developer Dynamic
    in October 2025 and crypto accounting platform TRES Finance for $130 million in January 2026. Furthermore, Fireblocks
    co-founded the Blockchain Payment Consortium in November 2025 with the Solana Foundation and TON Foundation, cementing
    its role as the industry standard for enterprise stablecoin infrastructure.'
  claimRefs:
  - CO007
  - CO008
  - CO011
  - CO012
  - CO013
  figureRefs:
  - FO001
