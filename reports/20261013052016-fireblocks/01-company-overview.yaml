figures:
- id: FO001
  title: Company milestone timeline
  type: timeline
  summary: Chronological progression of Fireblocks' corporate founding, major financing milestones, tier-one client integrations,
    ecosystem alliances, and strategic M&A transactions.
  data:
    items:
    - date: '2018-06-01'
      label: Company Foundation
      detail: Fireblocks is founded in New York by Michael Shaulov and team following cybersecurity work at Lacoon Mobile
        Security to solve digital asset private key security.
      tone: positive
      claimRefs:
      - CO001
    - date: '2019-11-01'
      label: Commercial Platform Launch
      detail: Fireblocks reports a 400% surge in institutional customers and reaches $25 billion in monthly digital asset
        transfer volume across connected counterparties.
      tone: positive
      claimRefs:
      - CO008
    - date: '2020-11-20'
      label: Series B & Board Expansion
      detail: Completes $30 million Series B round; Fred Ehrsam, co-founder of Coinbase and Paradigm, joins the board of directors
        to advise on institutional expansion.
      tone: positive
      claimRefs:
      - CO003
    - date: '2022-01-27'
      label: Series E Financing Peak
      detail: Cumulative equity capital raised crosses $1 billion following Series E financing, cementing market leadership
        in institutional wallet software.
      tone: neutral
      claimRefs:
      - CO004
    - date: '2022-11-15'
      label: Bahamas FTX Custody Mandate
      detail: Securities Commission of The Bahamas designates Fireblocks to safeguard digital assets transferred from FTX's
        Bahamian subsidiary during the exchange collapse.
      tone: warning
      claimRefs:
      - CO011
    - date: '2025-06-26'
      label: Hurun Unicorn Index 2025
      detail: Fireblocks is ranked 83rd on the Hurun Global Unicorn Index with an estimated enterprise valuation mark of 58.5
        billion RMB.
      tone: neutral
      claimRefs:
      - CO005
    - date: '2025-11-10'
      label: Blockchain Payment Consortium
      detail: Co-founds the Blockchain Payment Alliance alongside the Solana Foundation and TON Foundation to build unified
        cross-chain stablecoin standards.
      tone: positive
      claimRefs:
      - CO013
    - date: '2026-01-12'
      label: TRES Finance Acquisition
      detail: Acquires crypto accounting and financial intelligence platform TRES Finance for $130 million to deliver integrated
        treasury workflows following Dynamic acquisition.
      tone: positive
      claimRefs:
      - CO012
