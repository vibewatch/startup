evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-reporting-gaps
    missingEvidence: >-
      Audited financial statements confirming FY2025 and FY2026 GAAP revenue, ARR, gross margin, operating margins, cash
      position, and net burn rate.
    whyItMatters: >-
      Without certified financial statements, enterprise valuation multiples and sustainable operating runway cannot be
      verified independently.
    diligencePath: >-
      Request confidential audited financials, cap table, and current management presentation during confirmatory
      investor diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-governance-coverage
    missingEvidence: >-
      Complete executive leadership directory and complete board committee rosters beyond the primary founders and top
      executive officers.
    whyItMatters: Evaluates operational functional depth, key-person risk concentration, and governance committee independence.
    diligencePath: Review full organizational charts and corporate registry filings under confidentiality agreement.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: stakeholder-cap-table-coverage
    missingEvidence: >-
      Full capitalization table detailing all Series A through Series E preferred shareholders, option pool allocation,
      and liquidation preferences.
    whyItMatters: Determines economic waterfall, voting control distribution, and secondary share transaction history.
    diligencePath: Obtain certified cap table and investor rights agreement from company legal counsel.
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Audited breakdown of pure recurring software subscription revenue (ARR) versus volume-based payment fees and
      custodial spread across enterprise tiers.
    whyItMatters: >-
      Market sizing and valuation multiples for infrastructure software cannot be accurately calibrated against
      custodial AUM or cumulative gross transfer volume alone.
    diligencePath: >-
      Request confidential management financial disclosures covering contract ARR, net revenue retention (NRR) by
      cohort, and pricing schedules for Tier-1 banks versus crypto-native clients.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing-transparency
    missingEvidence: >-
      Itemized enterprise contract rate cards, workspace platform fees, and volume overage schedules for Fireblocks,
      Anchorage Digital, and BitGo.
    whyItMatters: >-
      Prevents precise total-cost-of-ownership comparisons between software-first MPC workspace subscriptions and
      chartered custodian basis-point asset-servicing fee models.
    diligencePath: >-
      Request anonymized customer billing schedules, RFP pricing proposals, and enterprise master service agreement rate
      sheets during commercial diligence.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited financial statements confirming FY2025-FY2026 ARR, gross margins, net revenue retention (NRR), and
      customer acquisition cost (CAC) payback periods.
    whyItMatters: >-
      Fireblocks remains private and does not publicly disclose realized margins, NRR, or cash burn, preventing
      independent validation of underlying profitability.
    diligencePath: >-
      Request management presentation and audited financial statements under NDA covering GAAP gross margins, cohort
      retention curves, and detailed revenue breakdown.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash balance, monthly cash burn rate, operating runway, and capitalization table details following recent
      M&A transactions.
    whyItMatters: >-
      While Fireblocks has operated without primary equity fundraising since January 2022 and spent $130M+ on
      acquisitions, forward capital adequacy cannot be underwritten without audited balance sheet data.
    diligencePath: >-
      Review unaudited trailing-twelve-month balance sheet, cash flow statements, and debt facility covenants during
      confidential diligence.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: developer-signal-and-mpc-audit
    missingEvidence: >-
      Public third-party cryptographic audit report verifying the MPC-CMP protocol implementation details and
      independent developer telemetry (GitHub contributions, issue closure velocity, package download volume) for
      Fireblocks SDKs.
    whyItMatters: >-
      While SOC 2 and ISO certifications attest to operational controls, technical underwriters require cryptographic
      proofs and open developer signals to assess supply chain vulnerabilities and long-term maintainability.
    diligencePath: >-
      Request full NCC Group and COMSEC penetration testing and cryptographic review reports under NDA, along with
      private repository commit velocity and developer portal telemetry.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: minor
    topic: hardware-enclave-mitigation
    missingEvidence: >-
      Documentation of architectural failover procedures in the event of hardware-level Intel SGX side-channel exploits
      (e.g., Aepic, Foreshadow) across cloud providers.
    whyItMatters: >-
      Hardware enclave isolation serves as Layer 2 of Fireblocks' defense-in-depth matrix; understanding how key shares
      are protected if SGX memory encryption is breached is vital for institutional risk modeling.
    diligencePath: >-
      Review vendor disaster recovery documentation detailing MPC key share rotation protocols and non-SGX fallback
      infrastructure configurations.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE003
  - type: missing-source
    severity: material
    topic: retention-metrics-and-churn
    missingEvidence: >-
      Audited cohort net retention rate (NRR), gross retention rate (GRR), and annual customer churn rate broken down by
      tier.
    whyItMatters: >-
      Without audited NRR or churn disclosures, institutional customer durability cannot be confirmed independently of
      top-line cumulative logo numbers.
    diligencePath: Request confidential SaaS retention schedules and customer cohort renewal data in management diligence sessions.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: >-
      Comprehensive audit of all 2,200+ institutional customer contracts and deployment statuses distinguishing live
      production vs exploratory pilot accounts.
    whyItMatters: >-
      Public case studies disclose only flagship reference accounts such as BNY Mellon, Revolut, and Worldpay, leaving
      the true proportion of active production versus inactive licenses unverified.
    diligencePath: Review customer contract registry, annual active vault count, and monthly active API signing volumes under NDA.
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: regulatory-litigation-inventory
    missingEvidence: >-
      Comprehensive regulatory enforcement records and historical litigation settlement disclosures covering US and
      global digital asset custody operations.
    whyItMatters: >-
      Unresolved litigation or undisclosed enforcement inquiries could impair enterprise banking relationships and
      impose material contingent liabilities.
    diligencePath: >-
      Request legal docket confirmation, auditor litigation response letters, and regulatory examination history
      directly from management under NDA.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: incident-metrics-and-churn
    missingEvidence: >-
      Audited operational incident logs, mean time to recovery (MTTR) metrics, and enterprise client churn rates tied to
      service level agreements.
    whyItMatters: >-
      Operational reliability and client retention directly govern infrastructure thesis durability and defensible
      enterprise valuation.
    diligencePath: >-
      Review SOC 2 Type II exception logs, customer SLA credit reports, and historical client retention cohorts across
      banking and exchange customers.
    relatedQuestionRefs:
      - QR010
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Audited financial statements detailing ARR, gross margins, operating burn, and revenue breakdown between SaaS
      subscriptions and transaction-based network fees.
    whyItMatters: >-
      Without audited ARR or margins, the current $8B Series E valuation cannot be benchmarked against publicly traded
      custody peers like Coinbase or BitGo with institutional certainty.
    diligencePath: >-
      Request confidential disclosure of audited FY2025 financial statements, board decks, and gross margin waterfalls
      during phase-two diligence.
    relatedQuestionRefs:
      - QV009
  - type: conflicting-data
    severity: material
    topic: valuation-marks
    missingEvidence: Secondary market trade marks and liquidation preference stack details for Fireblocks preferred stock series.
    whyItMatters: >-
      Hurun Global Unicorn Index marked Fireblocks enterprise valuation down to 54 billion RMB in June 2026 from 58.5
      billion RMB in 2025, and public market peer multiples have compressed significantly since Fireblocks 2022 Series E
      round.
    diligencePath: >-
      Obtain recent secondary trading pricing from institutional secondary desks and inspect certificate of
      incorporation for Series E liquidation preferences.
    relatedQuestionRefs:
      - QV010
