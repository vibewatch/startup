callouts:
  - calloutType: recommendation
    title: 'Investment Verdict: Research-More at Current Private Valuation'
    body: Maintain a research-more stance on Fireblocks. While its MPC technology and 2,000+ institutional clients confirm undeniable product-market leadership, the 2022 Series E valuation of $8.0B is disconnected from current cybersecurity and fintech trading multiples, requiring audited financial verification before committing investment capital.
    claimRefs:
      - CV001
      - CV002
      - CV004
  - calloutType: risk
    title: Valuation Overhang and Capital Structure Subordination
    body: Investors face down-round repricing risk if market conditions force Fireblocks to raise growth capital or conduct an IPO below its $8.0B Series E post-money valuation mark, where late-stage liquidation preferences could heavily dilute common and earlier preferred equity holders.
    claimRefs:
      - CV001
      - CV003
      - CV011
