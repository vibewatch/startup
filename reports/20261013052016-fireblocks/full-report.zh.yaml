chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、核心使命与技术基础
        blocks:
          - type: paragraph
            body: >-
              Fireblocks 成立于 2018
              年，总部位于纽约市，是一家数字资产和稳定币底层基础设施公司。公司成立之初，旨在解决传统加密机构管理数字资产时面临的关键漏洞：私钥泄露、单点故障和运营安全失控。Fireblocks
              不做零售钱包，也不是传统信托托管机构，而是提供一套直接托管操作系统。其架构把多方计算协议 MPC-CMP、硬件隔离的 Intel SGX enclave
              和自动化策略引擎结合起来。这套技术不再组装单一私钥，可执行细粒度的 maker-checker 法定人数审批，并接入实时反洗钱交易筛查。随着受监管银行机构加快采用数字资产，Fireblocks
              为机构级托管、交易、跨境稳定币支付和资产代币化补上所需的企业软件层。
