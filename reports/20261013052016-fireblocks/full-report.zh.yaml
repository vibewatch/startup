      - number: '2.3'
        title: 企业买家分层、预算归属与单位经济
        blocks:
          - type: paragraph
            body: >-
              企业采购数字资产基础设施可分为四类客户：受监管的一级银行和托管机构、交易台和经纪商、企业资金部门和支付网络，以及 Web3
              基金会和游戏平台。在每个细分市场，数字资产运营控制权都直接在钱包基础设施层落实，依靠管理法定人数策略和 maker-checker
              规则。买家主要根据安全架构、加密完整性、开发者体验和多链覆盖广度来评估基础设施伙伴，而不是软件席位许可费。在 iGaming
              和消费支付应用等高吞吐量垂直领域，投资回报尤其有吸引力：用运营商自有钱包通道替代传统第三方支付服务商，可以消除 50 至 150 个基点的入金处理费，同时去除交易对手信用风险，并支持将资金自动归集到总账金库。
            claimRefs:
              - CM005
              - CM006
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM009
              - CM013
      - number: '2.4'
        title: 结构性增长驱动、监管要求与采用阻力
        blocks:
          - type: paragraph
            body: >-
              企业对稳定币结算和现实世界资产代币化的需求，加上欧盟《加密资产市场法案》（MiCA）和《数字运营韧性法案》（DORA）等正式监管框架，正在加快机构采用。银行和全球支付服务商要求企业级基础设施伙伴提供云端、混合和本地部署选项，并直接接入现有
              IT 风险框架、反洗钱筛查和 Travel Rule 报告体系。不过，采用约束依然明显。加密 MPC
              基础设施可以降低单一私钥被盗的风险，却无法消除人为治理失误、恶意管理员串通、白名单欺骗或交易策略设计错误。此外，一级金融机构采购周期漫长，还要经过监管检查和内部合规验证，使销售周期延长至 12–18 个月。
            claimRefs:
              - CM011
              - CM012
              - CM013
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 基础设施护城河从签名速度转向受监管网络密度
            body: >-
              机构最初采用 Fireblocks，主要看中其加密签名性能（MPC-CMP 比传统 MPC 快 8 倍）；如今市场扩张更多依靠交易对手网络连接。Fireblocks Network 已连接超过 1,400
              个交易对手，并自动验证入金地址，把单纯的软件工具变成具有高切换壁垒的双边清算网络。
            calloutType: insight
            claimRefs:
              - CM008
              - CM010
          - type: callout
            title: 将总转账量与经常性软件收入混为一谈
            body: >-
              估算机构级数字资产基础设施市场时，一个持续存在的分析难题，是表面交易规模（累计交易量 10 万亿美元、稳定币年度流量 6 万亿美元）与实际捕获的软件 ARR
              之间存在差异。平台定价把固定软件层级与交易量费用混在一起；在没有经审计的披露、无法拆分许可 ARR 和吞吐量费用之前，投资者无法推算经常性利润率的扩张。
            calloutType: risk
            claimRefs:
              - CM003
              - CM004
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与直接托管同业
        blocks:
          - type: paragraph
            body: >-
              机构级数字资产基础设施的竞争格局分为三种架构和监管范式：软件优先的多方计算（MPC）平台、联邦牌照数字资产银行，以及州牌照信托托管机构。Fireblocks 主要属于软件优先的 MPC
              类别，提供非托管式加密密钥分片，让金融机构在不承担第三方托管负债的情况下，保留资产的直接运营所有权。直接机构级同业采用截然不同的托管模式。Anchorage Digital 是美国唯一获得 OCC
              联邦牌照的数字资产银行，使用硬件安全模块（HSM）和传统受托托管，而不是 MPC，服务那些因资本和监管合规而需要明确银行身份的银行及资产管理公司。BitGo 通过纽约和南达科他州信托牌照以及多重签名 HSM
              架构保持合格托管机构地位，主要面向原生加密基金管理和交易所交易产品保管。在欧洲，Copper 将 MPC 托管与其场外结算网络 ClearLoop 结合，并遵循英国 FCA
              监管框架，专门服务机构对冲基金和高频交易台。与持牌托管银行不同，Fireblocks 不把客户余额纳入公司资产负债表，而是把软件定位为适用于多种托管环境的数字资产流转通用操作系统。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP006
      - number: '3.2'
        title: 架构差异与能力比较
        blocks:
          - type: paragraph
            body: >-
              架构评估显示，MPC-CMP 直接托管、硬件绑定信任模型和内部自建之间存在关键取舍。Fireblocks 的专有 MPC-CMP 协议将私钥分片分布在隔离的云端 enclave 中，在 120
              多条区块链上执行链下交易签名，且从不在内存中组装完整私钥。这既消除了单点故障，又保留了僵化硬件安全模块无法匹敌的多链灵活性。相反，内部自建的机构要承担持续的工程开销、多方阈值复杂度、长期密钥管理风险，以及节点和合规集成的持续维护。治理差异集中在
              Fireblocks 的 Policy Engine 和管理员法定人数架构上：它们在签名广播前执行细粒度的 maker-checker 授权流程、基于角色的签名规则和自动交易过滤。Safe
              Wallet、Privy 等外围替代方案面向开发者转化或去中心化社区多重签名，缺少企业风险委员会要求的 SIEM 导出能力、机构级可审计性和 SOC 2 Type 2 认证。此外，Fireblocks
              的场外结算集成让交易公司无需把资产转入中心化交易所即可质押抵押品，从而降低交易对手交易所风险。
            claimRefs:
              - CP005
              - CP008
              - CP009
              - CP010
              - CP014
