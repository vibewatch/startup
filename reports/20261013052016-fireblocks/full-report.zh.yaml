      - number: '3.3'
        title: 商业封装、定价模式与市场进入
        blocks:
          - type: paragraph
            body: >-
              机构级数字资产基础设施的商业封装，反映出直销企业、资产服务和嵌入式开发者接入之间不同的变现策略。Fireblocks
              采用企业工作区订阅模式，并叠加按交易量计费的层级。这种定价让费用与高交易量支付处理商和一级银行的运营吞吐量匹配，但也给早期金融科技公司和种子期创业公司设下很高的进入门槛：它们要面对漫长的企业准入销售周期和较高的年度最低承诺。相反，Anchorage
              Digital 和 BitGo 等持牌托管机构主要按照托管资产（AUC）收取基点费用，并加收行政维护费；这种定价对长期静态资金有吸引力，却会惩罚高速支付流程。Zero Hash 等白标 B2B2C
              平台把全栈执行、清算和超过 50 个美国州的货币传输牌照打包进 turnkey API 使用费，吸引希望同时避开直接基础设施许可和州监管负担的消费金融科技公司。同样，Bridge
              等开发者优先的进入者提供自助沙盒，并为稳定币编排分享储备收益，利用了 Fireblocks 在市场漏斗底部缺少透明自助接入的弱点。
            claimRefs:
              - CP006
              - CP007
              - CP011
