      - - 看空论点：估值高悬
        - 2022 年 1 月设定的 $8B 估值，反映了公开市场并不支持的周期峰值倍数狂热
        - Series E 已完成超过 4.5 年；胡润 2026 指数将估值标记下调至 54B 人民币，排名降至第 112 位
        - 披露已实现盈利、ARR 超过 $400M，且软件毛利率达到 75%+
