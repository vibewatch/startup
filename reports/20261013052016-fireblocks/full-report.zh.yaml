  - id: FP001
    title: 机构治理与开发者可访问性定位图
    type: quadrant
    summary: 从治理控制和开发者可访问性两个维度，展示机构托管与支付基础设施供应商的竞争位置。
    xAxis: 开发者可访问性与自助服务速度
    yAxis: 机构政策与治理控制
    approximationNotes: 定位分数依据已记录的入驻流程、许可模式和治理能力进行序数评分。
