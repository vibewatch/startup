  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块化版图
        blocks:
          - type: paragraph
            body: >-
              Fireblocks 是一家企业级数字资产基础设施平台，为              机构市场参与者提供直接托管、资金管理和区块链连接。零售钱包界面或托管信托公司会代表法律交易对手持有资产；Fireblocks
              提供软件基础设施，让机构在不承担交易对手风险的情况下保留加密资产的完整运营所有权和控制权。平台的商业版图由四个核心运营模块组成：Treasury
              Management，负责企业托管和内部资金归集；Wallets-as-a-Service（WaaS），面向需要可扩展钱包基础设施的机构银行、交易所和经纪商；Embedded Wallets，面向消费者的
              Web3 和金融科技应用；以及端到端 Tokenization
              Engine，支持在主要公开和许可制区块链上铸造资产、实施治理并分发至二级市场。这些模块让机构能够把此前割裂的托管工具整合到统一运营环境中，并以严格的管理规则加以约束。
            claimRefs:
              - CE001
              - CE007
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE007
              - CE008
      - number: '5.2'
        title: 加密架构与纵深防御模型
        blocks:
          - type: paragraph
            body: >-
              Fireblocks 平台的技术核心是多方计算协议 MPC-CMP。传统机构架构过去依赖实体硬件安全模块（HSM）或链上多重签名智能合约，这会引入实体单点故障、协议特定限制和高额链上 gas
              费用。Fireblocks 的 MPC-CMP 将加密私钥分片分布在独立的一级云环境和硬件 enclave
              中，通过阈值数学运算执行交易签名，从不组装完整私钥。公司声称，该协议在支持离线冷存储工作流的同时，签名速度较标准 MPC 方案更快。Fireblocks 将这一加密引擎包裹在四层纵深防御安全结构中：第 1 层执行
              MPC-CMP 签名；第 2 层利用 Intel SGX 硬件安全 enclave，保护内存空间和 API 密钥，防范恶意管理员或遭入侵的操作系统；第 3 层部署 Policy
              Engine，在安全内存中执行规则评估；第 4 层提供 Fireblocks Network，用于认证交易对手。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
              - CE008
              - CE012
      - number: '5.3'
        title: 机构交易对手网络与 API 连接
        blocks:
          - type: paragraph
            body: >-
              除内部托管外，Fireblocks 的一项重要技术差异化能力是 Fireblocks Network。这是一层机构资产转移网络，连接超过 1,400
              家金融机构、流动性台和加密货币交易所。在传统加密运营中，跨实体转账需要人工复制十六进制入金地址、执行低额测试转账并人工加入地址白名单；这些流程很容易受到地址欺骗攻击、剪贴板劫持恶意软件和操作员失误影响。             
              Fireblocks Network 自动化交易对手身份验证和入金地址轮换，建立经过认证的通道，实现即时机构结算。面向程序化运营，Fireblocks 提供 API 优先的接口，包括 REST API、实时
              webhook，以及 Python、JavaScript 和 Java 软件开发工具包。这些开发工具让算法交易公司、支付处理商和交易所能够用程序化策略检查，自动化大规模资金再平衡、客户提现和跨境稳定币结算。
            claimRefs:
              - CE006
              - CE011
              - CE012
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE005
              - CE006
              - CE012
              - CE013
      - number: '5.4'
        title: 治理控制、合规认证与技术尽调风险
        blocks:
          - type: paragraph
            body: >-
              企业治理通过 Fireblocks 的 Transaction Authorization Policy（TAP）引擎和 Admin Quorum
              框架落地。机构可根据金额阈值、资产类型、来源金库、目标白名单和多用户审批层级配置细粒度转账规则，从而有效防止员工串通或未经授权的管理变更。合规能力直接嵌入交易管线，并接入 Chainalysis 和
              Elliptic，自动完成反洗钱及交易筛查。Fireblocks 的安全姿态由 Ernst & Young 每年执行的 SOC 2 Type II 审计、ISO 27001、27017 和 27018 认证，以及
              COMSEC 和 NCC Group 的第三方渗透测试予以支撑。不过，关键尽调风险仍然存在：部署需要两到八周的专业工程投入；Fireblocks 是软件供应商而非合格托管机构；核心 MPC-CMP
              实现仍属专有闭源；而且严重依赖 Intel SGX 硬件 enclave，使系统暴露于无法完全通过软件缓解的 CPU 级侧信道漏洞。
            claimRefs:
              - CE005
              - CE009
              - CE010
              - CE013
              - CE014
              - CE015
      - number: '5.5'
        title: 展示项
        blocks:
          - type: callout
            title: MPC-CMP 相比传统多重签名的加密韧性
            body: >-
              Fireblocks 对 MPC-CMP
              协议的实现，相比传统硬件安全模块和链上多重签名钱包具备结构性优势。平台在链下执行阈值签名，从不重构完整私钥，因此既消除了单点泄露，又避免了异构区块链上的链特定智能合约漏洞和高额 gas 开销。
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
          - type: callout
            title: 硬件 enclave 漏洞与专有实现不透明
            body: >-
              Fireblocks 虽拥有 SOC 2 Type II 和 ISO 27001/27017/27018 等第三方认证，但其核心 MPC-CMP 加密实现和开发者工具仍是闭源专有软件。此外，系统严重依赖
              Intel SGX 进行硬件级隔离，暴露于硬件侧信道风险，因此需要持续修补微码并保持严格的运营警戒。
            calloutType: risk
            claimRefs:
              - CE004
              - CE009
              - CE010
              - CE015
  - number: 6
