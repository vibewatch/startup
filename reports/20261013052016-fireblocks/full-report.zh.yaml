  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、分类法与现有替代方案
        blocks:
          - type: paragraph
            body: >-
              机构级数字资产基础设施占据一个独立的运营层，与面向零售消费者的钱包和通用企业密钥管理不同。企业买家需要多方计算（MPC）钱包架构、可编程策略引擎和专用交易对手结算通道，以满足严格的受托和监管标准。进入数字资产运营的机构必须在自建与采购之间取舍：自行开发加密签名、多链密钥编排、交易所集成和合规筛查，会带来严重的工程复杂度、难以承受的维护负担和更高的运营脆弱性。反过来，依赖人工运营或简单多重签名工具，会引入人为错误、密钥泄露风险和单点故障，无法满足机构治理要求。Fireblocks
              通过提供直接托管技术切入这一市场边界：私钥从不组装成单一秘密，并以覆盖 100 多条区块链的集成控制平面，替代定制脚本和割裂的点状方案。
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM010
      - number: '2.2'
        title: 多视角市场规模与交易量现实
        blocks:
          - type: paragraph
            body: >-
              估算数字资产基础设施市场时，必须把天文数字般的交易吞吐量与实际捕获的软件订阅价值分开。超过 10 万亿美元的累计数字资产交易曾经通过 Fireblocks 基础设施流转，但这个表面规模指标
              反映的是底层资产移动，而不是软件许可支出或资产负债表上的托管规模。支付通道推动市场快速扩张：2025 年稳定币年度结算量约 6 万亿美元，支付网络月度流量超过 2,000
              亿美元。不过，软件市场规模仍受商业变现模式约束。基础设施软件收入只占交易量的一小部分，主要靠年度平台访问费、交易量阶梯，以及附加的合规或合格托管服务变现，尽管总结算量已接近传统银行间网络。Fireblocks
              Trust Company 于 2024 年获得 NYDFS 牌照后，市场进一步扩大，为需要合格托管和纯软件基础设施的机构管理者提供受监管的资产保管服务。
            claimRefs:
              - CM003
              - CM004
              - CM012
              - CM014
