        title: 高管领导、治理董事会与关键人物结构
        blocks:
          - type: paragraph
            body: >-
              Fireblocks 由联合创始人兼 CEO Michael Shaulov 领导。他是一位资深网络安全创业者，曾创办 Lacoon Mobile Security，后者被 Check Point
              Software Technologies 收购。高管团队由 18 名高级管理人员组成，负责全球金融中心的工程、产品、合规和企业商业增长。公司治理还得到经验丰富的董事会支持，成员包括 Cyberstarts 和
              Sequoia Capital 的 Gili Raanan，以及 Coinbase 和 Paradigm 联合创始人 Fred Ehrsam
              等知名风投伙伴和加密行业先驱。公司的组织治理兼具军用级网络安全纪律与企业软件执行力。关键人物风险仍集中在 CEO Michael Shaulov
              身上；他的战略定位和深厚监管信誉，已成为公司在全球获取审慎型交易银行合作关系的关键。
