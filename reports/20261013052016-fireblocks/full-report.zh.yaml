    approximationNotes: 风险评级依据技术架构规格和截至 2026 年的机构监管基准，采用定性多维评分。
    claimRefs:
      - CR001
      - CR004
      - CR008
      - CR012
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策框架从机构采用证明和估值压缩出发，推导出继续研究的建议。
    approximationNotes: 将运营证据与最终估值立场连接起来的逻辑顺序框架。
    claimRefs:
      - CV002
      - CV003
      - CV005
      - CV007
      - CV012
    data:
      nodes:
        - id: scale
          label: 规模与采用（2,000+ 家客户、保障 $10T+ 资产安全）
        - id: tech
          label: 技术壁垒（MPC-CMP 与核心银行集成）
        - id: mna
          label: 并购扩张（收购 TRES Finance 与 Dynamic）
        - id: valuation-gap
          label: 估值悬置（峰值 $8B 标记与胡润下调）
        - id: opacity
          label: 财务不透明（未披露 ARR、现金消耗和利润率）
        - id: recommendation
          label: 结论：继续研究（需要确认性审计）
      edges:
