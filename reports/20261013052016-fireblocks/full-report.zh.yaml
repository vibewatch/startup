      - number: '1.3'
        title: 资本化历史、估值标记与利益相关者生态
        blocks:
          - type: paragraph
            body: >-
              Fireblocks 在 Sequoia Capital、Paradigm 等全球头部投资机构领投的机构融资轮中，累计获得超过 $1B 风投资金。公司在公开私募市场上的估值峰值，是 E 轮融资后达到的
              $8B。不过，近期二级市场数据和第三方基准评估显示，金融科技及加密基础设施资产的估值倍数正在收缩。2026 年胡润全球独角兽榜单将 Fireblocks 估值定为 54B RMB（约 $7.5B
              USD）；2025 年估值为 58.5B RMB、排名第 83，2026 年则降至第 112 名。尽管宏观环境导致估值倍数收缩，Fireblocks 仍拥有深度嵌入的利益相关者生态，覆盖 BNY Mellon
              等全球交易银行、ABN AMRO 等欧洲一级机构，以及 Revolut 等高速增长的消费型新银行，由此形成很高的切换壁垒和网络流动性效应。
