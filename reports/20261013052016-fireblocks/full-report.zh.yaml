      - - 乐观情景
        - 25%
        - TRES Finance 和 Dynamic 成功向企业客户交叉销售；ARR 达到 $400M+，按 8 倍估值倍数计算
        - $3.2B - $4.0B
        - 机构稳定币采用失败，或监管限制代币化轨道
      - - 基准情景
        - 50%
        - 与核心银行伙伴（Temenos、BNY）合作，托管 SaaS 稳步增长；预计 ARR 为 $200M-$250M，按 6 倍估值倍数计算
        - $1.2B - $1.5B
        - 开源 MPC 替代方案带来定价压力，钱包即服务走向商品化
      - - 悲观情景
        - 25%
        - 倍数压缩、客户集中度下降，或以 4 倍估值倍数进行二级清算式下轮融资
        - $600M - $800M
        - 重大安全漏洞或严厉监管行动，限制机构数字资产业务
    notes: 情景估值倍数参照上市数字资产基础设施和网络安全可比公司。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV010
      - CV011
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按时间梳理 Fireblocks 的创立、主要融资里程碑、一线客户集成、生态联盟和战略并购交易。
    data:
      items:
        - date: '2018-06-01'
          label: 公司成立
          detail: Michael Shaulov 与团队在纽约创立 Fireblocks。团队此前在 Lacoon Mobile Security 从事网络安全工作，之后转而解决数字资产私钥安全问题。
          tone: positive
          claimRefs:
            - CO001
        - date: '2019-11-01'
          label: 商业平台发布
          detail: Fireblocks 报告机构客户数增长 400%，并通过已连接的交易对手触达每月 $25B 的数字资产转账量。
          tone: positive
          claimRefs:
            - CO008
        - date: '2020-11-20'
          label: Series B 与董事会扩充
          detail: 完成 $30M Series B 融资；Coinbase 和 Paradigm 联合创始人 Fred Ehrsam 加入董事会，为机构业务扩张提供建议。
          tone: positive
          claimRefs:
            - CO003
        - date: '2022-01-27'
          label: Series E 融资峰值
          detail: Series E 融资后累计股权融资超过 $1B，巩固其在机构钱包软件市场的领先地位。
          tone: neutral
          claimRefs:
            - CO004
        - date: '2022-11-15'
          label: 巴哈马 FTX 托管授权
          detail: 巴哈马证券委员会指定 Fireblocks，在交易所崩溃期间保管从 FTX 巴哈马子公司转出的数字资产。
          tone: warning
          claimRefs:
            - CO011
        - date: '2025-06-26'
          label: 胡润独角兽指数 2025
          detail: Fireblocks 在胡润全球独角兽指数中排名第 83 位，估值标记估算为 58.5B 人民币。
          tone: neutral
          claimRefs:
            - CO005
        - date: '2025-11-10'
          label: 区块链支付联盟
          detail: 与 Solana Foundation 和 TON Foundation 共同创立 Blockchain Payment Alliance，构建统一的跨链稳定币标准。
          tone: positive
          claimRefs:
            - CO013
        - date: '2026-01-12'
          label: 收购 TRES Finance
          detail: 以 $130M 收购加密会计与财务智能平台 TRES Finance；此前已完成对 Dynamic 的收购，此次交易用于提供一体化资金管理工作流。
          tone: positive
          claimRefs:
            - CO012
    approximationNotes: 里程碑日期和交易总额来自公司披露、伙伴公告和第三方指数发布。
    claimRefs:
      - CO011
      - CO012
      - CO013
