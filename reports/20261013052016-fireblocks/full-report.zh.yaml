  - id: FI001
    title: 收入模式桥接图
    type: flow
    summary: 可视化展示机构数字资产活动如何转化为软件订阅、交易费和毛利率。
    data:
      nodes:
        - id: client-onboarding
          label: 机构客户入驻
          description: 银行、交易所和金融科技公司签订年度 SaaS 合同，接入 Fireblocks 平台
        - id: subscription-revenue
          label: SaaS 订阅收入
          description: 经常性平台费用每年至少 $18k，企业级套餐最高可达数百万美元
        - id: asset-operations
          label: 资产与钱包运营
          description: 客户使用 MPC-CMP 金库，在 120+ 条区块链上管理超过 $10T 的累计交易量
        - id: usage-overages
          label: 用量与交易量超额费
          description: 交易路由、API 配额和 Network for Payments 稳定币结算产生的超额费用
        - id: gross-revenue
          label: 合并收入
          description: 经常性许可费与可变交易量变现结合而成的混合收入流
        - id: operating-margin
          label: 毛利与资本路径
          description: 软件交付毛利率支撑公司自筹运营和战略并购
      edges:
        - from: client-onboarding
          to: subscription-revenue
          label: 平台许可
        - from: subscription-revenue
          to: asset-operations
          label: 金库部署
        - from: asset-operations
          to: usage-overages
          label: 活动规模
        - from: usage-overages
          to: gross-revenue
          label: 费用汇总
        - from: gross-revenue
          to: operating-margin
          label: 扣除成本
    approximationNotes: 流程图展示定性收入转化架构；单位费用实现率和云运营成本明细属于非公开信息。
    claimRefs:
      - CI001
      - CI005
      - CI011
      - CI013
      - CI014
  - id: FE001
    title: 产品架构图
    type: stack
    summary: Fireblocks 的纵深防御架构覆盖客户集成、治理策略、MPC 加密、硬件隔离区、结算网络和多链执行。
    data:
      layers:
        - label: 客户应用与 API 集成层
          detail: Python、JavaScript 和 Java 开发者 SDK；REST API；以及移动审批应用
          modules:
            - name: REST API 与 Webhook 基础设施
            - name: 开发者 SDK 与集成工具
        - label: 治理与交易策略引擎
          detail: 在安全隔离区内评估管理员法定人数与交易授权策略（TAP）
          modules:
            - name: 规则引擎（限额、允许列表、角色）
            - name: 管理员法定人数与多方审批
        - label: 加密 MPC-CMP 协议
          detail: 无需组装完整私钥，即可在链下以分布式方式对密钥份额进行签名
          modules:
            - name: MPC-CMP 快速签名协议
            - name: 分布式密钥份额生成与存储
        - label: 硬件安全隔离区
          detail: Intel SGX 隔离区将加密算法、密钥份额和 API 密钥隔离开来
          modules:
            - name: Intel SGX 内存隔离
            - name: 交易所 API 凭证金库
        - label: 机构交易对手网络
          detail: 借助认证机构网络降低存款地址欺骗风险
          modules:
            - name: Fireblocks 网络交易对手目录
            - name: 自动轮换存款地址
        - label: 多链与智能合约层
          detail: 直接连接 70+ 至 120+ 条区块链网络，并接入代币化智能合约
          modules:
            - name: Layer 1 与 Layer 2 链连接器
            - name: 代币化引擎与 DeFi 协议
    approximationNotes: 层级结构体现 Fireblocks 技术文档所述的软件与加密纵深防御边界。
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE006
      - CE008
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 从沙盒评估到跨境结算编排，展示机构客户经历的六阶段接入、集成、治理设置和扩张旅程。
    data:
      items:
        - label: 1. 技术评估与加密审计
          touchpoints:
            - 安全架构评估
            - MPC-CMP 与多重签名对比
            - SOC 2 Type II 和 ISO 27001 审查
        - label: 2. 治理策略与管理员法定人数设置
          touchpoints:
            - 定义管理员法定人数策略
            - 强制多因素认证
            - 基于角色的审批矩阵
        - label: 3. API 沙盒与钱包基础设施集成
          touchpoints:
            - 测试开发者文档和 SDK
            - 配置金库账户
            - 配置自动 Webhook
        - label: 4. 资金管理上线与网络交易对手方路由
          touchpoints:
            - 自动化存款地址
            - 连接 1,400+ 个网络交易对手方
            - 使用 Chainalysis 和 Elliptic 进行 KYT/AML 筛查
        - label: 5. 产品线扩张（WaaS 与嵌入式钱包）
          touchpoints:
            - 部署白标嵌入式钱包 SDK
            - 扩大客户直接托管范围
            - 集成 DApp 和质押
        - label: 6. 全球结算与代币化编排
          touchpoints:
            - 跨境稳定币支付网络
            - 智能合约代币化引擎
            - 现实世界资产二级交易
    approximationNotes: 旅程阶段综合 Fireblocks 企业入驻文档、银行评估标准和开发者指南。
    claimRefs:
      - CU013
      - CU014
