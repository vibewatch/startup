callouts:
  - title: "Structural Moat from Counterparty Settlement Density"
    calloutType: "insight"
    body: "Fireblocks' competitive durability is driven less by proprietary cryptography than by two-sided network density. With over 2,000 participating financial institutions and 30 connected exchange venues, the Fireblocks Network eliminates manual counterparty address verification and counterparty risk. Replicating this peer-to-peer liquidity and settlement mesh requires multi-year onboarding cycles that single-tenant or emerging custody providers cannot compress through price cuts alone."
    claimRefs:
      - "CP012"
      - "CP013"
  - title: "Unbundling Risk from Developer-First Payment Orchestrators"
    calloutType: "risk"
    body: "While Fireblocks maintains dominance in Tier-1 bank custody and institutional treasury vaults, its enterprise-gated sales model and opaque workspace pricing leave entry-level fintechs underserved. Emerging developer-first orchestration platforms like Bridge and embedded licensing layers like Zero Hash provide self-serve sandboxes and turnkey state compliance, threatening Fireblocks with top-of-funnel displacement among next-generation payment applications."
    claimRefs:
      - "CP007"
      - "CP011"
      - "CP014"
