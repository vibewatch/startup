company:
  name: EXU
chapter:
  number: 8
  title: Valuation
  summary: Public evidence confirms a $1.2 billion EXU valuation associated with a $120 million Series B, but operating metrics and transaction terms remain undisclosed. Comparable public-market and regulatory evidence supports a research-more call rather than a precision valuation or buy recommendation.
sections:
  - id: decision
    title: Investment decision and valuation discipline
    body: >-
      EXU's publicly reported financing context is a $120 million Series B at a $1.2 billion valuation, with $160 million of total funding reported by TechCrunch from PitchBook. That establishes a financing mark, not an independently verified fair value, revenue multiple, or cash balance. The evidence set contains no EXU revenue, trading-volume, take-rate, retention, margin, customer, cap-table, liquidation-preference, or debt disclosure. A price-sensitive decision therefore cannot be anchored to an operating multiple. Public-company comparables show that crypto-exchange valuation is exposed to market conditions, liquidity, fees, security, and regulatory compliance, while the regulatory sources show that governance, custody, surveillance, and operational-risk controls are valuation-relevant requirements. The appropriate recommendation is research-more: proceed only after obtaining the cap table, latest management accounts, cohort economics, and evidence that the financing terms do not embed a preference overhang.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-antithesis
    title: Thesis, anti-thesis, and comparables
    body: >-
      The positive thesis is that EXU reached unicorn status in a capital market willing to fund a crypto-trading platform at scale, and that institutional positioning could support high-value transaction and custody economics. The anti-thesis is that the mark may reflect a financing negotiation rather than durable earnings power: no public EXU operating metric allows a revenue, EBITDA, or volume multiple to be tested. Coinbase's disclosed scale and Robinhood's public-market metrics illustrate the information gap rather than prove EXU comparability. Investopedia's 2026 exchange review explicitly evaluates fees, features, products, services, liquidity, security, reputation, and regulatory compliance, which are the diligence dimensions needed before assigning a peer multiple. The comparison set is therefore directional and should not be presented as a like-for-like valuation benchmark.
    claimRefs: [CV007, CV008, CV009, CV010, CV011]
    tableRefs: [TV002]
  - id: scenarios
    title: Scenarios, downside triggers, and diligence asks
    body: >-
      Scenario ranges are intentionally qualitative because the public record lacks the denominators required for a defensible discounted-cash-flow or revenue-multiple model. The bull case requires verified growth in institutional trading activity, defensible take rates, controlled compliance cost, and financing terms without punitive preferences. The base case is a track-or-research-more posture at the reported financing mark until those inputs are delivered. The bear case is a down-round or impaired exit if regulatory controls, custody, market surveillance, or liquidity costs consume the economics, or if crypto-market activity compresses. IOSCO identifies governance, conflicts, custody, reconciliation, assurance, and operational-technology risk as recommended control areas; FinCEN's active guidance cadence reinforces that compliance obligations can change. Diligence should request audited or reviewed financials, monthly volume and revenue bridges, customer concentration, licenses, AML/KYC evidence, incident history, the full preference stack, and an independent 409A or financing-mark support file.
    claimRefs: [CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
