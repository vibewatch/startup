callouts:
  - calloutType: recommendation
    title: Research-more, not buy
    body: The financing mark is visible, but the evidence needed to test price against revenue, volume, margin, risk, and preference terms is not public.
    claimRefs: [CV001, CV002, CV003, CV005]
  - calloutType: risk
    title: Compliance is a valuation input
    body: IOSCO's control recommendations and FinCEN's guidance cadence make licensing, AML/KYC, custody, surveillance, and operational resilience part of the valuation diligence case.
    claimRefs: [CV006, CV012, CV013]
