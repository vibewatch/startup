    notes: "Comparable-company observations are directional and not a like-for-like EXU valuation; the table preserves the source's metric periods and units."
    claimRefs: [CV001, CV007, CV008, CV009, CV010, CV011]
  - id: TV003
    title: Bull, base, and bear scenario
    columns: [Scenario, Explicit assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Institutional volume and take rate are verified; margins scale; licenses and controls are effective; no punitive preference stack", "A valuation above the financing mark could be justified only by a documented earnings or volume multiple", "Low-to-medium until management evidence is provided", "Volume or revenue bridge fails; compliance cost rises faster than gross profit"]
      - [Base, "The $1.2B financing mark remains the only disclosed valuation anchor; operating metrics and terms remain private", "No precise fair value; hold at research-more and require entry discount or stronger evidence", "Medium", "No audited accounts, cap table, or independent mark support"]
      - [Bear, "Market activity compresses and regulatory, custody, surveillance, or security obligations absorb economics", "Down-round, impaired liquidity, or delayed exit becomes plausible; downside cannot be quantified publicly", "Medium-to-high", "License issue, material incident, customer concentration, or preference overhang"]
      - [Diligence gate, "Receive monthly volume, net revenue, take rate, gross margin, burn, cash, debt, customer concentration, and full capitalization schedule", "Rebuild a scenario model using consistent periods and denominators", "Required before investment", "Any material inconsistency between data room and financing narrative"]
    notes: "Scenario values are qualitative because no EXU operating denominators or transaction terms were disclosed in the retained sources; the table does not invent valuation ranges."
    claimRefs: [CV002, CV003, CV004, CV012, CV013, CV014, CV015, CV016]
