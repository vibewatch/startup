  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: adoption-trajectory
      missingEvidence: >-
        Active and funded accounts, transaction volume, assets, utilization, repeat activity,
        and cohort history with explicit periods, populations, geographies, and definitions.
      whyItMatters: >-
        Without comparable denominators, customer adoption and operating momentum cannot be
        distinguished from financing momentum.
      diligencePath: >-
        Obtain monthly cohort exports and reconcile account, customer, volume, asset, and
        revenue definitions to management reporting and bank or custody records.
      relatedQuestionRefs:
        - QU003
      relatedTableRefs:
        - TU002
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: >-
        Named production customers, pilots, failed evaluations, deployment dates, contract
        scope, commercial value, and customer-verified outcomes.
      whyItMatters: >-
        Named references are required to separate live adoption from logos, investor
        relationships, pilots, and unsupported customer-count claims.
      diligencePath: >-
        Request the customer and pilot registry, sample contracts, invoices, and at least
        five independently selected reference calls across segments and geographies.
      relatedQuestionRefs:
        - QU004
      relatedTableRefs:
        - TU003
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: >-
        GRR, NRR, logo and revenue churn, contract duration, repeat-trading cohorts,
        satisfaction, top-customer concentration, and channel-sourced revenue.
      whyItMatters: >-
        Durability, expansion economics, procurement friction, and dependency risk cannot be
        scored without customer-level longitudinal evidence.
      diligencePath: >-
        Review anonymized customer-level monthly revenue and activity data, renewal records,
        top-ten concentration, and channel attribution with finance and customer-success owners.
      relatedQuestionRefs:
        - QU009
