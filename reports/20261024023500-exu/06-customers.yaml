schemaVersion: "report-v2"
artifact: customers
slug: exu
runDate: 2026-10-24
company:
  name: EXU
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence establishes EXU only as a 2025-founded crypto trading platform; it does
    not establish a named customer, active-account count, trading-volume denominator,
    retention rate, or deployment outcome. Peer evidence shows that crypto platforms can
    serve consumers, institutions, and developers, but applying that segmentation to EXU
    remains a hypothesis rather than proof of adoption.
sections:
  - id: customer-base-evidence
    title: Customer identity remains unverified
    body: >-
      The strongest company-specific source describes EXU as a crypto trading platform
      founded in 2025 and reports its financing and valuation, but it does not identify who
      pays, trades, integrates, or holds assets on the platform. Financing is therefore a
      capital-market signal, not customer validation. Across the retained evidence reviewed
      here, no source names an EXU customer, contract, pilot, account cohort, geography,
      channel partner, or production outcome. The analysis cannot responsibly classify EXU
      as institutional, retail, developer-facing, or multi-segment. Each is retained only as
      a diligence hypothesis. This evidence boundary also prevents translating the reported
      $120 million Series B or $160 million total funding into customer scale, revenue,
      liquidity, or retention.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
    tableRefs:
      - TU001
  - id: adoption-and-peer-context
    title: Peer segmentation clarifies the questions, not EXU's answers
    body: >-
      Yahoo Finance describes Coinbase as serving consumers, institutions, and developers,
      with most revenue still generated from retail transaction fees, while adjacent
      expansion includes prime brokerage and data analytics. That peer pattern illustrates
      distinct buyer, user, payer, and expansion motions that should not be collapsed into a
      single customer count. It does not show that EXU serves any of those cohorts. The
      DefiLlama exchange snapshot also places customer acquisition against large incumbent
      venues, displaying Binance, OKX, and Bybit with first-listed seven-day volume figures
      of $171.676 billion, $30.631 billion, and $15.846 billion respectively. EXU has no
      comparable volume, account, or utilization metric in the retained evidence, so market
      presence and adoption trajectory remain unquantified.
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU015
    tableRefs:
      - TU002
  - id: trust-and-adoption-friction
    title: Trust and client protection are adoption prerequisites
    body: >-
      Crypto-platform customer durability depends on more than acquisition. IOSCO says a
      crypto-asset service provider should clearly disclose the legal entity, role, capacity,
      execution model, conflicts, and custody arrangements presented to clients. It also
      calls for protection and accurate records of client assets. These expectations matter
      to both conversion and retention because the FTC warns that cryptocurrency accounts
      are not government-backed like insured bank deposits and that cryptocurrency payments
      are typically irreversible. IOSCO additionally cites a BIS sample of more than 200
      trading apps across more than 95 countries in which a majority of users in nearly all
      economies experienced bitcoin losses during the studied period. None of these sources
      verifies EXU's controls; they define the proof customers and underwriters would need.
    claimRefs:
      - CU010
      - CU011
      - CU012
      - CU013
      - CU014
    figureRefs:
      - FU001
  - id: durability-and-concentration
    title: Durability, expansion, and concentration cannot yet be scored
    body: >-
      There is no retained evidence for EXU's gross or net revenue retention, logo churn,
      repeat trading, funded-account cohorts, contract duration, wallet balances, customer
      satisfaction, or customer concentration. The absence is bounded to this chapter's
      evidence set and is not proof that EXU has no customers. It means durability cannot be
      underwritten from public proof. Coinbase's expansion into prime brokerage and data
      analytics offers a peer example of adjacent monetization, but it is not evidence that
      EXU has a land-and-expand motion. Before attributing strategic value to EXU's customer
      base, investors need cohort-level activity, revenue by segment and geography, top-ten
      concentration, channel attribution, renewal or repeat-use data, and reference calls
      that distinguish pilots from production relationships.
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU016
    tableRefs:
      - TU003
