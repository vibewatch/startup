        - Reported 2026-01-12
        - TechCrunch, citing PitchBook
        - Medium
        - Young operating history; not an adoption metric
        - Customer start date and cohort history
      - - Series B financing
        - "$120 million"
        - Reported 2026-01-12
        - TechCrunch, citing PitchBook
        - Medium
        - Capital raised does not establish commercial traction
        - Revenue, funded accounts, and transaction volume
      - - Total funding
        - "$160 million"
        - Reported 2026-01-12
        - TechCrunch, citing PitchBook
        - Medium
        - Funding is not cash available or customer demand
        - Cash balance, burn, revenue, and customer acquisition efficiency
      - - Customers, active accounts, or EXU trading volume
        - Not disclosed in retained evidence
        - As reviewed 2026-10-24
        - Six relevant retained sources
        - Low
        - Adoption trajectory cannot be measured
        - Exact population, activity definition, geography, and time window
    notes: >-
      Values preserve the source's metric labels and dates. Funding raised is not revenue,
      ARR, cash available, customer count, or trading activity.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU006
