    title: EXU customer-proof journey
    type: journey-map
    summary: >-
      The evidence path from segment identification to durable expansion remains unverified
      at every company-specific stage.
    data:
      nodes:
        - id: segment
          label: Segment identified
          value: Unverified
          detail: No EXU buyer, user, or payer segment is named.
          touchpoints:
            - Public company description
        - id: contracting
          label: Contracting entity and role
          value: Unverified
          detail: No EXU legal entity, agency/principal role, or client contract is evidenced.
          touchpoints:
            - Role and capacity disclosure
        - id: onboarding
          label: Onboarding and suitability
          value: Unverified
          detail: No onboarding funnel, approval rate, or suitability control is evidenced.
          touchpoints:
            - Account opening
            - Customer due diligence
        - id: activation
          label: Funded account and first trade
          value: Unverified
          detail: No funded-account, first-trade, asset, or volume metric is disclosed.
          touchpoints:
            - Funding
            - Trade execution
        - id: retention
          label: Repeat activity and retention
          value: Unverified
          detail: No cohort activity, churn, GRR, NRR, or renewal evidence is available.
          touchpoints:
            - Repeat trading
            - Asset custody
        - id: expansion
          label: Product or account expansion
          value: Unverified
          detail: Peer expansion paths exist, but no EXU cross-sell or channel evidence is available.
          touchpoints:
            - Prime services
            - Data products
    approximationNotes: >-
      This is an evidence-status journey, not a measured conversion funnel; node order does
      not imply observed EXU customer behavior or conversion rates.
    claimRefs:
      - CU006
      - CU007
      - CU009
      - CU010
      - CU011
      - CU014
callouts:
  - calloutType: risk
    title: Customer proof is the central underwriting gap
    body: >-
      Capital raised and valuation do not substitute for named customers, active usage,
      retention, or concentration evidence.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU006
  - calloutType: recommendation
    title: Require cohort and reference evidence before assigning durability
    body: >-
      Obtain segment-level revenue and activity cohorts, top-customer concentration,
      channel attribution, and independent customer references that distinguish production
      use from pilots.
    claimRefs:
      - CU006
      - CU010
      - CU011
