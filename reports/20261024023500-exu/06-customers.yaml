      - - Pilot or evaluation
        - None identified in retained evidence
        - Unknown
        - Unknown
        - Not disclosed
        - No pilot scope, duration, conversion, or failure evidence
      - - Channel or integration relationship
        - None identified in retained evidence
        - Unknown
        - Unknown
        - Not disclosed
        - Investors cannot be treated as customers or distribution partners
    notes: >-
      Partial audit of the six relevant sources retained for this chapter as of 2026-10-24;
      null findings are evidence gaps, not proof that no relationship exists.
