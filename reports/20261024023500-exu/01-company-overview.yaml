  - calloutType: recommendation
    title: "Research more before underwriting"
    body: "Obtain primary financing, corporate, regulatory, and operating evidence before treating the reported $1.2 billion valuation as an investable reference point."
    claimRefs: [CO012, CO013, CO014]

