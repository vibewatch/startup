      - ["Board or governance body", "Not identified", "No retained source describes board composition", "Unassessed", "Disclosure gap"]
      - ["Compliance leadership", "Not identified", "No retained source identifies licensing or compliance owners", "Unassessed", "Disclosure gap"]
    notes: "This is a partial enumeration of leadership disclosures in the assigned sources, not evidence that the roles do not exist."
    claimRefs: [CO005, CO006, CO007, CO012]
  - id: TO003
    title: Stakeholder or investor map
    columns: [Stakeholder, Role, Control or economic importance, Diligence ask]
    enumerationScope:
      coverage: partial
      basis: "Named investors, platform entity, regulators, clients, and market counterparties in retained evidence"
    rows:
      - [EXU, "Platform operator", "Operational and legal control", "Confirm legal entity, licenses, custody, and financial statements"]
      - [Sequoia, Investor, "Reported Series B participant", "Verify commitment, security type, and rights"]
      - ["The Goldman Sachs Group", Investor, "Reported Series B participant", "Verify exact investing entity and terms"]
      - [PitchBook, "Data source cited by TechCrunch", "Source of reported funding and valuation figures", "Obtain underlying round record and methodology"]
      - [IOSCO member regulators, "Regulatory context", "Potential oversight of crypto-asset activities", "Check jurisdiction-specific registrations and permissions"]
      - [Platform clients, "Users and asset owners", "Exposure to custody, execution, and counterparty risk", "Request client-asset segregation and incident controls"]
    notes: "The map distinguishes reported investors and general regulatory stakeholders from verified contractual or control relationships; the retained pool does not establish EXU's exact counterparties or rights."
    claimRefs: [CO008, CO009, CO010, CO012, CO013]

