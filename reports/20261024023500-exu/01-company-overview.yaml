    title: "Identity remains provisional"
    body: "The reported crypto-platform profile and the Hong Kong social-app namesake must not be conflated; legal-entity verification is a gating diligence step."
    claimRefs: [CO003, CO004]
  - calloutType: risk
    title: "Capital is more visible than operations"
    body: "The retained evidence supports reported financing and valuation figures, but not revenue, volume, customers, headcount, governance, or regulatory permissions."
