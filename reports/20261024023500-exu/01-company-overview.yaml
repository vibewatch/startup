schemaVersion: "report-v2"
artifact: company-overview
slug: exu
runDate: 2026-10-24
company:
  name: EXU
chapter:
  number: 1
  title: Company Overview
  summary: "The assigned evidence identifies EXU as a 2025-founded crypto trading platform and reports a $120 million Series B at a $1.2 billion valuation, but it does not establish founders, headquarters, operating metrics, board composition, regulatory status, or a company-specific adverse record."
sections:
  - id: identity-and-business
    title: Identity and business
    body: "The strongest retained company-specific evidence is a TechCrunch unicorn roundup that names EXU as a crypto trading platform, says it was founded in 2025, and reports a $120 million Series B at a $1.2 billion valuation. The same item attributes the funding and investor details to PitchBook rather than presenting a company filing or announcement. A separate consumer-finance explainer identifies a different, Hong Kong-incorporated EXU (HK) LIMITED associated with social-app trademarks; that source is a namesake warning, not confirmation that the fintech platform is the same legal entity. The evidence therefore supports a provisional identity and business description, while product scope, legal entity, headquarters, founders, and licensing remain unresolved."
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: "No assigned source names an EXU founder, chief executive, executive team, board, or governance arrangement. The absence is a limitation of this evidence pack, not proof that the company has no disclosed leadership. It matters because a crypto trading platform depends on accountable control over custody, market operations, compliance, and incident response, while IOSCO's policy framework treats crypto-asset service providers as operating across activities including trading, settlement, market surveillance, and custody. Until a primary company, registry, filing, or regulator source identifies the responsible people and legal entities, key-person dependence and governance quality cannot be scored with confidence."
    claimRefs: [CO005, CO006, CO007]
    tableRefs: [TO002]
  - id: capital-and-milestones
    title: Capital, milestones, and diligence gaps
    body: "The reported financing is substantial but remains a third-party-reported figure: TechCrunch attributes the $120 million Series B, $1.2 billion valuation, Sequoia and The Goldman Sachs Group participation, and $160 million total funding to PitchBook. No retained source supplies revenue, trading volume, customer count, headcount, cash balance, debt, secondary-sale information, or a current valuation update. IOSCO's 2023 recommendations provide a regulatory context rather than evidence about EXU: they emphasize market integrity, investor protection, cross-border supervision, and conflicts across crypto-asset activities. The appropriate conclusion is that capital formation is evidenced, operating scale and regulatory posture are not."
    claimRefs: [CO008, CO009, CO010, CO011]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: diligence-implications
    title: Investment implications
    body: "EXU's provisional profile combines a high reported financing mark with unusually thin company-specific disclosure in the assigned pool. Independent sector benchmarks show why that asymmetry matters: exchange diligence commonly examines regulatory compliance, liquidity, security, reputation, fees, asset visibility, and trading volume, while current enforcement reporting shows that safeguarding failures can carry financial consequences. Those sources do not establish an EXU deficiency or incident. Investors should verify the legal entity behind the platform, obtain the financing announcement and cap table, and request financial, licensing, custody, surveillance, client-asset, and incident evidence before relying on the $1.2 billion mark."
    claimRefs: [CO012, CO013, CO014, CO015, CO016]

