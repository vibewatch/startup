      - [Custody and client-asset protection, "IOSCO recommendations include segregation, reconciliation, independent assurance, and securing client money and assets.", Medium, Critical, "Not publicly evidenced for EXU", High, "Obtain custody contracts, reconciliations, reserve attestations, insurance, and loss-allocation terms."]
