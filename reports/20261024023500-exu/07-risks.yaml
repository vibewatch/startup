company:
  name: EXU
chapter:
  number: 7
  title: Risks
  summary: EXU's principal risks are regulatory perimeter, custody and market-integrity exposure, cyber-enabled fraud, and the opacity of private operating controls. Public evidence confirms the severity of the external risk environment, but does not establish EXU's licensing, reserves, incident history, or control maturity; those unknowns keep residual exposure high.
sections:
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: Crypto trading platforms operate across a fragmented and changing regulatory perimeter. IOSCO's recommendations cover offering, admission to trading, ongoing trading, settlement, market surveillance, custody, and retail distribution, and explicitly emphasize cross-border cooperation, regulatory arbitrage, and investor-protection risks. Treasury's sanctions docket shows that sanctions designations and general-license changes are active and frequent in October 2026. For EXU, the investment-relevant issue is not whether crypto regulation exists, but whether the company has mapped each jurisdiction, asset, customer type, and operating activity to a license and control owner. The public pool does not verify EXU's U.S. money-transmission, MSB, MiCA, sanctions-screening, market-abuse, or custody status. A licensing gap, weak asset listing controls, or a sanctions-screening failure could interrupt market access, trigger enforcement, or strand customer assets. Until management supplies licenses, regulatory opinions, and recent examinations, residual legal exposure should be treated as high rather than inferred from the company's institutional positioning.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operational-security
    title: Operational, cyber, and market-integrity risk
    body: The operating model combines exchange connectivity, automated execution, custody or custody dependencies, identity and transaction controls, and availability during volatile markets. IC3 maintains dedicated cryptocurrency crime reporting and publishes annual reports, while its annual-report page links a 2025 report and cryptocurrency-specific reports; this establishes an active threat and complaint environment, not an EXU incident. Public descriptions of algorithmic trading note that automated systems can react faster than humans, may contribute to volatility, and create accountability questions when failures occur. IOSCO separately calls for management and disclosure of operational and technological risks. EXU has no publicly verified SOC 2 or ISO 27001 evidence, proof-of-reserves result, insurance terms, outage history, recovery-time objective, or independent penetration-test result in the assigned sources. The practical kill criteria are a material outage during stressed markets, an unreconciled customer-asset balance, a security incident without timely containment, or execution defects that create unhedged exposure.
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: dependencies-financial
    title: Dependency, financial, and execution risk
    body: "EXU's public financing signal is not a liquidity statement. TechCrunch reports that EXU raised a $120 million Series B at a $1.2 billion valuation and had raised $160 million in total funding, but the article does not disclose cash balance, burn, runway, revenue, trading volume, take rate, customer concentration, or the terms and restrictions attached to that capital. The broader market context is also competitive: DefiLlama's snapshot shows large centralized exchanges with substantial seven-day volumes and reserves, while Galaxy's research page shows an active and rapidly changing digital-asset research agenda. These sources do not prove EXU's relative share or solvency, but they support stress-testing liquidity, counterparties, and execution economics rather than assuming scale from funding. Key dependencies include banking and fiat rails, liquidity providers, cloud and market-data infrastructure, custodians, sanctions vendors, and key institutional customers. A funding extension without measurable operating traction, a loss of a critical venue or banking partner, or margin compression during a volume downturn would increase financing and continuity risk."
    claimRefs: [CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
  - id: diligence-and-triggers
    title: Monitoring and thesis-break triggers
    body: The current evidence supports a monitoring framework, not a conclusion that EXU has suffered a breach, enforcement action, or customer-asset loss. Management should provide a jurisdiction-by-jurisdiction licensing matrix, sanctions and KYC testing, asset-reconciliation evidence, reserve and insurance documentation, incident and outage logs, material vendor concentration, customer concentration, and a 24-month cash-flow bridge. Investors should monitor regulator actions affecting EXU's markets, changes in sanctions or licensing requirements, uptime and incident severity, unexplained spread or execution deterioration, reserve discrepancies, withdrawal delays, and capital runway. A thesis break occurs if any of these indicators demonstrates that EXU cannot operate compliantly, safeguard customer assets, or fund remediation. Absence of a publicly recorded incident is not evidence that controls are effective; the gap itself is material because the company's operating metrics and control attestations remain private.
    claimRefs: [CR014, CR015, CR016]

