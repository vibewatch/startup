    title: Operational, quality, and security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Cyber-enabled theft or account takeover, High, Critical, "Unverified", High, "No assigned source verifies EXU's controls, insurance, or incident response."]
      - [Trading or API outage during volatility, Medium, Critical, "Unverified", High, "No public uptime, recovery-time, or historical outage evidence."]
      - [Algorithmic execution error or market manipulation, Medium, High, "Unverified", High, "No independent model governance, testing, or surveillance evidence."]
      - [Custody reconciliation failure or withdrawal delay, Medium, Critical, "Unverified", High, "No proof of reserves, segregation, reconciliation, or withdrawal SLA."]
      - [Data or cloud dependency failure, Medium, High, "Unverified", High, "Vendor map, concentration, failover, and recovery tests are undisclosed."]
    notes: "Likelihood and severity are risk-screening judgments informed by the cited external threat and control frameworks; EXU-specific control maturity remains an evidence gap."
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
  - id: TR003
    title: Partner, dependency, and financial risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure, Monitoring indicator]
    rows:
      - [Fiat banking and payment rails, "Banks / payment providers", "Account closure or de-risking interrupts deposits and withdrawals.", Critical, "Diversified rails and documented contingency routing", High, "Bank concentration, failed transfers, and settlement delays."]
      - [Liquidity and trading venues, "Market makers / exchanges", "Liquidity withdrawal widens spreads and impairs execution.", High, "Multiple venues, limits, and stress tests", High, "Depth, slippage, fill rates, and counterparty limits."]
      - [Cloud and market-data stack, "Cloud / data vendors", "Infrastructure or feed outage prevents pricing, risk, or order handling.", High, "Multi-region failover and tested recovery", High, "Error budgets, recovery tests, and feed divergence."]
      - ["KYC, sanctions, and blockchain analytics", "Compliance vendors", "Screening failure permits prohibited activity or false blocks customers.", Critical, "Independent testing and manual escalation", High, "Hit rates, overrides, backlogs, and regulator findings."]
      - [Capital providers and runway, "Investors / lenders", "Burn exceeds available capital before operating traction is demonstrated.", High, "24-month cash plan and financing triggers", High, "Cash balance, burn, runway, revenue, and volume."]
    notes: "EXU does not publicly disclose counterparty concentration, cash runway, or revenue metrics in the assigned evidence; the table therefore records diligence requirements rather than measured exposures."
    claimRefs: [CR010, CR011, CR012, CR013]

