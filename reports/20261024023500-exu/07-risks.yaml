callouts:
  - calloutType: risk
    title: The largest risk is unverified control maturity
    body: The assigned evidence establishes the external regulatory and threat environment, but does not verify EXU's licenses, asset segregation, reserves, security attestations, incident record, or runway. Those omissions should be treated as material diligence gaps rather than as proof of a failure.
    claimRefs: [CR004, CR008, CR013, CR016]
  - calloutType: recommendation
    title: Require control evidence before increasing exposure
    body: Before underwriting a higher exposure, require the licensing matrix, independent control attestations, asset-reconciliation evidence, sanctions testing, incident history, vendor concentration, and a cash-flow bridge with measurable trigger thresholds.
    claimRefs: [CR014, CR015, CR016]

