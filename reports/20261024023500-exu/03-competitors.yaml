artifact: competitors
slug: exu
runDate: 2026-10-24
company:
  name: EXU
chapter:
  number: 3
  title: Competitors
  summary: EXU is described in the retained evidence as a crypto trading platform, but its public product, customer, pricing, and licensing detail is too sparse for a conventional like-for-like competitor ranking. The defensible competitive conclusion is that liquid, regulated, and better-documented exchanges set the buyer reference point while EXU's differentiation remains unverified.
sections:
  - id: landscape
    title: Competitive landscape and reference set
    body: >-
      The evidence supports a broad reference set rather than a verified EXU-specific
      peer list. TechCrunch reports EXU as a crypto trading platform founded in 2025
      that raised a $120 million Series B at a $1.2 billion valuation, but the same
      article provides no product, customer, fee, or market-share detail. Investopedia's
      October 2026 review evaluates 27 exchanges and identifies Kraken, Coinbase,
      Gemini, Crypto.com, Binance, and Uniswap as differentiated reference points.
      DefiLlama's exchange page exposes live comparative fields such as volume,
      assets, inflows/outflows, and volume-to-assets ratios, showing the dimensions
      on which an institutional venue is likely to be screened. EXU cannot be placed
      on those dimensions from the assigned evidence. The name also produces material
      search contamination: two retained pages use “Exu” for Afro-Brazilian religious
      traditions, not a financial company. That ambiguity is itself a discoverability
      and diligence constraint.
    claimRefs: [CP001, CP002, CP003, CP004]
    tableRefs: [TP001]
  - id: buyer-comparison
    title: Capability, pricing, and buyer trade-offs
    body: >-
      Public competitor evidence is strongest on buyer criteria, not on EXU's
      implementation. Investopedia describes regulatory compliance, liquidity,
      security, platform reputation, and fees as important exchange-selection
      factors, and reports Kraken's 0%–0.38% maker fees and 0.05%–0.80% taker fees,
      Coinbase's 0%–0.4% maker fees and 0.4%–0.6% taker fees, and Kraken's coverage
      of more than 190 countries. Those are competitor list or review figures, not
      EXU pricing or realized economics. IOSCO's 2023 recommendations frame custody,
      order handling, market surveillance, operational risk, and retail disclosure
      as core crypto-asset-service-provider controls. EXU's assigned evidence does
      not establish whether it offers those controls, which customer segment it
      targets, or whether it competes on price, execution, custody, or access.
    claimRefs: [CP005, CP006, CP007, CP008]
    tableRefs: [TP002, TP003]
  - id: moat-risk
    title: Switching costs, moat durability, and displacement risk
    body: >-
      Exchange competition is structurally exposed to multi-homing and incumbent
      response. A venue can differentiate through liquidity, security, asset
      breadth, institutional tools, compliance coverage, or distribution, but the
      retained sources do not show EXU's liquidity, uptime, licenses, customer
      concentration, custody model, integrations, or switching costs. IOSCO's
      principles-based framework emphasizes consistent outcomes across jurisdictions
      because cross-border activity creates regulatory-arbitrage and investor-protection
      risks. That raises the cost of a durable moat: any EXU claim to institutional
      advantage would need evidence of controls and regulatory permissions, not only
      financing. CoinDesk's market coverage also illustrates adverse operating
      signals in the sector, including a reported $3.6 million fine against Coinbase
      Ireland for fund-safeguarding failures and reports of exchange security events.
      These are sector comparables, not allegations about EXU, but they make trust
      and control evidence central to displacement risk.
    claimRefs: [CP009, CP010, CP011, CP012]
    figureRefs: [FP001]
  - id: diligence-gaps
    title: Evidence gaps and competitive verdict
    body: >-
      The competitive verdict is research-more rather than a claim that EXU lacks
      differentiation. The assigned pool contains only one source directly naming
      EXU as a trading platform, while the stronger competitor sources describe
      established venues or regulatory expectations. No retained source verifies
      EXU's target customer, fee schedule, supported assets, custody arrangements,
      licenses, security certifications, liquidity, trading volumes, distribution
      partners, or customer references. Until those fields are disclosed or
      independently corroborated, EXU should be underwritten against the
      capabilities and trust standards of established exchanges and against the
      possibility that liquidity and compliance are difficult to replicate.
    claimRefs: [CP013, CP014, CP015, CP016]
callouts:
  - calloutType: risk
    title: Differentiation is unverified
    body: EXU has a reported unicorn financing profile, but the assigned evidence does not establish a product or control advantage over liquid, documented exchanges.
    claimRefs: [CP002, CP013, CP014]
  - calloutType: insight
    title: Trust is a buying criterion
    body: Competitor evidence and IOSCO guidance make security, custody, compliance, and liquidity the most decision-relevant comparison axes; EXU has no retained proof on those axes.
    claimRefs: [CP005, CP009, CP010]
