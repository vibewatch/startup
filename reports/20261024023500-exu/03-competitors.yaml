    notes: "Unknown cells are explicit evidence gaps. Competitor entries summarize the retained Investopedia review and do not establish equivalence or superiority."
    claimRefs: [CP005, CP006, CP007, CP009, CP010, CP014]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Venue, Published or reviewed fee signal, Product packaging, Pricing basis, EXU comparability, Buyer implication]
    rows:
      - [EXU, null, null, "Not disclosed in assigned evidence", "Not comparable", "Request maker/taker schedule, spreads, custody fees, withdrawal fees, and institutional discounts"]
      - [Kraken, "Maker 0%–0.38%; taker 0.05%–0.80%", "Basic, Pro, and Kraken+", "30-day volume, currency pair, maker/taker status; Kraken+ $4.99/month", "Reference only", "Transparent fee architecture can reduce procurement uncertainty"]
      - [Coinbase, "Maker 0%–0.4%; taker 0.4%–0.6%", "Basic and Coinbase Advanced", "Product and order context", "Reference only", "User experience and asset breadth may justify a premium"]
      - [Gemini, null, "Security-oriented positioning", "Not disclosed in retained excerpt", "Reference only", "Obtain fee and insurance details"]
      - [Crypto.com, null, "Mobile and bitcoin positioning", "Not disclosed in retained excerpt", "Reference only", "Obtain fee and product-bundle details"]
      - [Binance, null, "Low-fee positioning in review", "Not disclosed in retained excerpt", "Reference only", "Verify jurisdiction and compliance trade-offs"]
      - [Uniswap, null, "DeFi access", "Protocol or transaction economics differ from centralized exchanges", "Not comparable without a defined use case", "Separate custody, execution, and regulatory assumptions"]
      - [Internal build, null, "Owned trading workflow", "Engineering and operating cost", "Not comparable without cost model", "Quantify control benefit against fixed and variable build cost"]
    notes: "Only Kraken and Coinbase fee figures are present in the retained Investopedia excerpt. EXU and other nulls require primary pricing evidence; funding or valuation is not treated as pricing power."
    claimRefs: [CP006, CP007, CP008, CP013, CP015]
