  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and reference set
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a broad reference set rather than a verified EXU-specific peer list. TechCrunch
              reports EXU as a crypto trading platform founded in 2025 that raised a $120 million Series B at a $1.2
              billion valuation, but the same article provides no product, customer, fee, or market-share detail.
              Investopedia's October 2026 review evaluates 27 exchanges and identifies Kraken, Coinbase, Gemini,
              Crypto.com, Binance, and Uniswap as differentiated reference points. DefiLlama's exchange page exposes
              live comparative fields such as volume, assets, inflows/outflows, and volume-to-assets ratios, showing the
              dimensions on which an institutional venue is likely to be screened. EXU cannot be placed on those
              dimensions from the assigned evidence. The name also produces material search contamination: two retained
              pages use “Exu” for Afro-Brazilian religious traditions, not a financial company. That ambiguity is itself
