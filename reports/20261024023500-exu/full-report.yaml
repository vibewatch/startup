  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer identity remains unverified
        blocks:
          - type: paragraph
            body: >-
              The strongest company-specific source describes EXU as a crypto trading platform founded in 2025 and
              reports its financing and valuation, but it does not identify who pays, trades, integrates, or holds
              assets on the platform. Financing is therefore a capital-market signal, not customer validation. Across
