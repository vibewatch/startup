  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Public capital signal, not operating traction
        blocks:
          - type: paragraph
            body: >-
              TechCrunch, citing PitchBook, reports that EXU was founded in 2025, operates as a crypto trading platform,
              raised a $120 million Series B, includes Sequoia and The Goldman Sachs Group among its investors, and has
              raised $160 million in funding to date. The same report places the company at a $1.2 billion valuation.
              These are financing and valuation signals, not revenue, ARR, GMV, cash, or profitability measures. The
              funding chronology belongs in Company Overview; this chapter uses the local capital facts only to frame
              capital adequacy and the information required for forward underwriting. A valuation multiple cannot be
              calculated without a revenue denominator.
