      - number: '3.2'
        title: Capability, pricing, and buyer trade-offs
        blocks:
          - type: paragraph
            body: >-
              Public competitor evidence is strongest on buyer criteria, not on EXU's implementation. Investopedia
              describes regulatory compliance, liquidity, security, platform reputation, and fees as important
              exchange-selection factors, and reports Kraken's 0%–0.38% maker fees and 0.05%–0.80% taker fees,
              Coinbase's 0%–0.4% maker fees and 0.4%–0.6% taker fees, and Kraken's coverage of more than 190 countries.
              Those are competitor list or review figures, not EXU pricing or realized economics. IOSCO's 2023
              recommendations frame custody, order handling, market surveillance, operational risk, and retail
              disclosure as core crypto-asset-service-provider controls. EXU's assigned evidence does not establish
              whether it offers those controls, which customer segment it targets, or whether it competes on price,
              execution, custody, or access.
