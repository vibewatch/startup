      - number: '6.2'
        title: Peer segmentation clarifies the questions, not EXU's answers
        blocks:
          - type: paragraph
            body: >-
              Yahoo Finance describes Coinbase as serving consumers, institutions, and developers, with most revenue
              still generated from retail transaction fees, while adjacent expansion includes prime brokerage and data
              analytics. That peer pattern illustrates distinct buyer, user, payer, and expansion motions that should
              not be collapsed into a single customer count. It does not show that EXU serves any of those cohorts. The
              DefiLlama exchange snapshot also places customer acquisition against large incumbent venues, displaying
              Binance, OKX, and Bybit with first-listed seven-day volume figures of $171.676 billion, $30.631 billion,
              and $15.846 billion respectively. EXU has no comparable volume, account, or utilization metric in the
              retained evidence, so market presence and adoption trajectory remain unquantified.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU015
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU006
      - number: '6.3'
        title: Trust and client protection are adoption prerequisites
        blocks:
          - type: paragraph
            body: >-
              Crypto-platform customer durability depends on more than acquisition. IOSCO says a crypto-asset service
              provider should clearly disclose the legal entity, role, capacity, execution model, conflicts, and custody
              arrangements presented to clients. It also calls for protection and accurate records of client assets.
              These expectations matter to both conversion and retention because the FTC warns that cryptocurrency
              accounts are not government-backed like insured bank deposits and that cryptocurrency payments are
              typically irreversible. IOSCO additionally cites a BIS sample of more than 200 trading apps across more
              than 95 countries in which a majority of users in nearly all economies experienced bitcoin losses during
              the studied period. None of these sources verifies EXU's controls; they define the proof customers and
              underwriters would need.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU006
              - CU007
              - CU009
              - CU010
              - CU011
              - CU014
      - number: '6.4'
        title: Durability, expansion, and concentration cannot yet be scored
        blocks:
          - type: paragraph
            body: >-
              There is no retained evidence for EXU's gross or net revenue retention, logo churn, repeat trading,
              funded-account cohorts, contract duration, wallet balances, customer satisfaction, or customer
              concentration. The absence is bounded to this chapter's evidence set and is not proof that EXU has no
              customers. It means durability cannot be underwritten from public proof. Coinbase's expansion into prime
              brokerage and data analytics offers a peer example of adjacent monetization, but it is not evidence that
              EXU has a land-and-expand motion. Before attributing strategic value to EXU's customer base, investors
              need cohort-level activity, revenue by segment and geography, top-ten concentration, channel attribution,
              renewal or repeat-use data, and reference calls that distinguish pilots from production relationships.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU001
              - CU006
              - CU007
              - CU010
              - CU011
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Customer proof is the central underwriting gap
            body: >-
              Capital raised and valuation do not substitute for named customers, active usage, retention, or
              concentration evidence.
            calloutType: risk
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU006
          - type: callout
            title: Require cohort and reference evidence before assigning durability
            body: >-
              Obtain segment-level revenue and activity cohorts, top-customer concentration, channel attribution, and
              independent customer references that distinguish production use from pilots.
            calloutType: recommendation
            claimRefs:
              - CU006
              - CU010
              - CU011
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Crypto trading platforms operate across a fragmented and changing regulatory perimeter. IOSCO's
              recommendations cover offering, admission to trading, ongoing trading, settlement, market surveillance,
              custody, and retail distribution, and explicitly emphasize cross-border cooperation, regulatory arbitrage,
              and investor-protection risks. Treasury's sanctions docket shows that sanctions designations and
              general-license changes are active and frequent in October 2026. For EXU, the investment-relevant issue is
              not whether crypto regulation exists, but whether the company has mapped each jurisdiction, asset,
              customer type, and operating activity to a license and control owner. The public pool does not verify
              EXU's U.S. money-transmission, MSB, MiCA, sanctions-screening, market-abuse, or custody status. A
              licensing gap, weak asset listing controls, or a sanctions-screening failure could interrupt market
              access, trigger enforcement, or strand customer assets. Until management supplies licenses, regulatory
              opinions, and recent examinations, residual legal exposure should be treated as high rather than inferred
              from the company's institutional positioning.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational, cyber, and market-integrity risk
        blocks:
          - type: paragraph
            body: >-
              The operating model combines exchange connectivity, automated execution, custody or custody dependencies,
              identity and transaction controls, and availability during volatile markets. IC3 maintains dedicated
              cryptocurrency crime reporting and publishes annual reports, while its annual-report page links a 2025
              report and cryptocurrency-specific reports; this establishes an active threat and complaint environment,
              not an EXU incident. Public descriptions of algorithmic trading note that automated systems can react
              faster than humans, may contribute to volatility, and create accountability questions when failures occur.
              IOSCO separately calls for management and disclosure of operational and technological risks. EXU has no
              publicly verified SOC 2 or ISO 27001 evidence, proof-of-reserves result, insurance terms, outage history,
              recovery-time objective, or independent penetration-test result in the assigned sources. The practical
              kill criteria are a material outage during stressed markets, an unreconciled customer-asset balance, a
              security incident without timely containment, or execution defects that create unhedged exposure.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR006
              - CR008
              - CR013
      - number: '7.3'
        title: Dependency, financial, and execution risk
        blocks:
          - type: paragraph
            body: >-
              EXU's public financing signal is not a liquidity statement. TechCrunch reports that EXU raised a $120
              million Series B at a $1.2 billion valuation and had raised $160 million in total funding, but the article
              does not disclose cash balance, burn, runway, revenue, trading volume, take rate, customer concentration,
              or the terms and restrictions attached to that capital. The broader market context is also competitive:
              DefiLlama's snapshot shows large centralized exchanges with substantial seven-day volumes and reserves,
              while Galaxy's research page shows an active and rapidly changing digital-asset research agenda. These
              sources do not prove EXU's relative share or solvency, but they support stress-testing liquidity,
              counterparties, and execution economics rather than assuming scale from funding. Key dependencies include
              banking and fiat rails, liquidity providers, cloud and market-data infrastructure, custodians, sanctions
              vendors, and key institutional customers. A funding extension without measurable operating traction, a
              loss of a critical venue or banking partner, or margin compression during a volume downturn would increase
              financing and continuity risk.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
      - number: '7.4'
        title: Monitoring and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The current evidence supports a monitoring framework, not a conclusion that EXU has suffered a breach,
              enforcement action, or customer-asset loss. Management should provide a jurisdiction-by-jurisdiction
              licensing matrix, sanctions and KYC testing, asset-reconciliation evidence, reserve and insurance
              documentation, incident and outage logs, material vendor concentration, customer concentration, and a
              24-month cash-flow bridge. Investors should monitor regulator actions affecting EXU's markets, changes in
              sanctions or licensing requirements, uptime and incident severity, unexplained spread or execution
              deterioration, reserve discrepancies, withdrawal delays, and capital runway. A thesis break occurs if any
              of these indicators demonstrates that EXU cannot operate compliantly, safeguard customer assets, or fund
              remediation. Absence of a publicly recorded incident is not evidence that controls are effective; the gap
              itself is material because the company's operating metrics and control attestations remain private.
            claimRefs:
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The largest risk is unverified control maturity
            body: >-
              The assigned evidence establishes the external regulatory and threat environment, but does not verify
              EXU's licenses, asset segregation, reserves, security attestations, incident record, or runway. Those
              omissions should be treated as material diligence gaps rather than as proof of a failure.
            calloutType: risk
            claimRefs:
              - CR004
              - CR008
              - CR013
              - CR016
          - type: callout
            title: Require control evidence before increasing exposure
            body: >-
              Before underwriting a higher exposure, require the licensing matrix, independent control attestations,
              asset-reconciliation evidence, sanctions testing, incident history, vendor concentration, and a cash-flow
              bridge with measurable trigger thresholds.
            calloutType: recommendation
            claimRefs:
              - CR014
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment decision and valuation discipline
        blocks:
          - type: paragraph
            body: >-
              EXU's publicly reported financing context is a $120 million Series B at a $1.2 billion valuation, with
              $160 million of total funding reported by TechCrunch from PitchBook. That establishes a financing mark,
              not an independently verified fair value, revenue multiple, or cash balance. The evidence set contains no
              EXU revenue, trading-volume, take-rate, retention, margin, customer, cap-table, liquidation-preference, or
              debt disclosure. A price-sensitive decision therefore cannot be anchored to an operating multiple.
              Public-company comparables show that crypto-exchange valuation is exposed to market conditions, liquidity,
              fees, security, and regulatory compliance, while the regulatory sources show that governance, custody,
              surveillance, and operational-risk controls are valuation-relevant requirements. The appropriate
              recommendation is research-more: proceed only after obtaining the cap table, latest management accounts,
              cohort economics, and evidence that the financing terms do not embed a preference overhang.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV006
              - CV012
      - number: '8.2'
        title: Thesis, anti-thesis, and comparables
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that EXU reached unicorn status in a capital market willing to fund a
              crypto-trading platform at scale, and that institutional positioning could support high-value transaction
              and custody economics. The anti-thesis is that the mark may reflect a financing negotiation rather than
              durable earnings power: no public EXU operating metric allows a revenue, EBITDA, or volume multiple to be
              tested. Coinbase's disclosed scale and Robinhood's public-market metrics illustrate the information gap
              rather than prove EXU comparability. Investopedia's 2026 exchange review explicitly evaluates fees,
              features, products, services, liquidity, security, reputation, and regulatory compliance, which are the
              diligence dimensions needed before assigning a peer multiple. The comparison set is therefore directional
              and should not be presented as a like-for-like valuation benchmark.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.3'
        title: Scenarios, downside triggers, and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Scenario ranges are intentionally qualitative because the public record lacks the denominators required
              for a defensible discounted-cash-flow or revenue-multiple model. The bull case requires verified growth in
              institutional trading activity, defensible take rates, controlled compliance cost, and financing terms
              without punitive preferences. The base case is a track-or-research-more posture at the reported financing
              mark until those inputs are delivered. The bear case is a down-round or impaired exit if regulatory
              controls, custody, market surveillance, or liquidity costs consume the economics, or if crypto-market
              activity compresses. IOSCO identifies governance, conflicts, custody, reconciliation, assurance, and
              operational-technology risk as recommended control areas; FinCEN's active guidance cadence reinforces that
              compliance obligations can change. Diligence should request audited or reviewed financials, monthly volume
              and revenue bridges, customer concentration, licenses, AML/KYC evidence, incident history, the full
              preference stack, and an independent 409A or financing-mark support file.
            claimRefs:
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more, not buy
            body: >-
              The financing mark is visible, but the evidence needed to test price against revenue, volume, margin,
              risk, and preference terms is not public.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
          - type: callout
            title: Compliance is a valuation input
            body: >-
              IOSCO's control recommendations and FinCEN's guidance cadence make licensing, AML/KYC, custody,
              surveillance, and operational resilience part of the valuation diligence case.
            calloutType: risk
            claimRefs:
              - CV006
              - CV012
              - CV013
