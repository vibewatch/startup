              privacy, and trusted networks and platforms; Hexatrust describes a cybersecurity and trusted-cloud
              association whose members include software publishers, solution providers, and service companies. Neither
              source verifies EXU’s controls. The assigned evidence also does not establish an EXU SOC 2 or ISO 27001
