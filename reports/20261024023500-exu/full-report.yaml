      - number: '5.2'
        title: Operating architecture and dependencies
        blocks:
          - type: paragraph
            body: >-
              A crypto trading venue normally depends on a connected workflow of client access, identity and
              permissions, order handling, execution and market data, asset custody, reconciliation, withdrawals,
              monitoring, and incident response. IOSCO’s 2023 recommendations explicitly cover order handling, trade
              disclosures, market surveillance, custody, client-asset reconciliation, and operational and technological
              risks. Those are control domains to test at EXU, not evidence that EXU has implemented them. Public
              exchange benchmarks show that market platforms expose measurable activity such as volume, liquidity, and
              confidence in reported volume, but the assigned pool contains no EXU-specific activity or reliability
              series. The architecture is consequently best represented as an underwriting map with unverified EXU
              implementation and third-party dependency questions.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
