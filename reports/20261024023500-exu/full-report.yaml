      - number: '4.2'
        title: Monetization mechanics and unit-economics visibility
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not disclose EXU's fee schedule, spread capture, custody or staking economics,
              institutional contract terms, realized take rate, customer acquisition cost, sales cycle, retention, or
              payback. A crypto trading platform may combine exchange, brokerage, market-making, custody, settlement,
              margin, or staking activities, but IOSCO explicitly notes that these functions can sit under one roof and
              should be disclosed by role and capacity. That regulatory framing makes the revenue bridge a diligence
              hypothesis rather than a measured model. List pricing, if later obtained, must remain separate from
              realized net revenue after rebates, liquidity incentives, payment costs, and compliance operations.
            claimRefs:
