      - number: '3.3'
        title: Switching costs, moat durability, and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Exchange competition is structurally exposed to multi-homing and incumbent response. A venue can
              differentiate through liquidity, security, asset breadth, institutional tools, compliance coverage, or
              distribution, but the retained sources do not show EXU's liquidity, uptime, licenses, customer
              concentration, custody model, integrations, or switching costs. IOSCO's principles-based framework
              emphasizes consistent outcomes across jurisdictions because cross-border activity creates
              regulatory-arbitrage and investor-protection risks. That raises the cost of a durable moat: any EXU claim
              to institutional advantage would need evidence of controls and regulatory permissions, not only financing.
              CoinDesk's market coverage also illustrates adverse operating signals in the sector, including a reported
              $3.6 million fine against Coinbase Ireland for fund-safeguarding failures and reports of exchange security
              events. These are sector comparables, not allegations about EXU, but they make trust and control evidence
              central to displacement risk.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP009
              - CP013
              - CP014
      - number: '3.4'
        title: Evidence gaps and competitive verdict
        blocks:
          - type: paragraph
            body: >-
              The competitive verdict is research-more rather than a claim that EXU lacks differentiation. The assigned
              pool contains only one source directly naming EXU as a trading platform, while the stronger competitor
              sources describe established venues or regulatory expectations. No retained source verifies EXU's target
              customer, fee schedule, supported assets, custody arrangements, licenses, security certifications,
              liquidity, trading volumes, distribution partners, or customer references. Until those fields are
              disclosed or independently corroborated, EXU should be underwritten against the capabilities and trust
              standards of established exchanges and against the possibility that liquidity and compliance are difficult
              to replicate.
            claimRefs:
