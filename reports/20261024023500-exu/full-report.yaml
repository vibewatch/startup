        title: Identity and business
        blocks:
          - type: paragraph
            body: >-
              The strongest retained company-specific evidence is a TechCrunch unicorn roundup that names EXU as a
              crypto trading platform, says it was founded in 2025, and reports a $120 million Series B at a $1.2
              billion valuation. The same item attributes the funding and investor details to PitchBook rather than
