  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and competitive substitutes
        blocks:
          - type: paragraph
            body: >-
              This chapter defines the relevant market as crypto-asset trading infrastructure and exchange services:
              centralized order-book or brokerage execution, custody and settlement, institutional liquidity access, and
              adjacent derivatives or wallet services. It excludes the value of the underlying tokens, payments
              unrelated to trading, and broad blockchain software unless those activities directly support trading. The
              boundary matters because a crypto exchange is not a single product: IOSCO notes that a crypto-asset
              service provider may combine exchange trading, brokerage, market-making, margin, custody, and settlement.
              EXU's assigned evidence identifies it as a crypto trading platform but does not establish which of those
              functions it operates. Retail exchanges, institutional venues, brokers, decentralized protocols, and
              internal treasury or prime-broker workflows are therefore status-quo substitutes rather than
              interchangeable peers. Two net-new search results used “EXU” for an unrelated debit-card charge and a
              religious figure, demonstrating that namesake noise must be excluded rather than treated as company or
              market evidence.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM015
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: Sizing lenses and evidence limits
        blocks:
          - type: paragraph
            body: >-
              The available evidence supports a multi-lens sizing approach, not a single headline TAM. A top-down lens
              can use aggregate centralized-exchange assets, volumes, and flows, but the DefiLlama page is a live
              tracker and its extracted text does not provide a dated total or a methodology for summing the displayed
              exchange rows. A bottom-up lens would require EXU's target customer count, average balances, trading
              volume, take rate, and geographic scope; none is disclosed in the assigned pool. A valuation-adjacent lens
              is also incomplete: TechCrunch reports EXU's $1.2 billion valuation and $160 million raised, but those are
              financing facts, not market size or revenue. The defensible conclusion is that SAM and SOM remain
              unisolated. Any investment case should test volume, fee capture, liquidity costs, and compliance spend
              before treating the reported valuation as market-derived. Even the available exchange benchmark needs
              qualification: Investopedia's introduction says it analyzed 27 exchanges, while its methodology says 14,
              so the sample count is internally inconsistent and cannot be treated as a market census.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM013
              - CM014
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM008
      - number: '2.3'
        title: Buyers, adoption drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              Buyer segmentation follows the workflow being purchased. Institutional traders and funds value deep
              liquidity, execution quality, custody, reporting, and operational controls; active retail users prioritize
              access, fees, product breadth, and usability; and decentralized users prioritize permissionless access and
              wallet control. Investopedia's 2026 comparison shows that regulatory compliance, liquidity, security,
              platform reputation, and fees are material exchange-selection criteria, while its reviewed platforms
              differentiate on maker-taker pricing, asset breadth, custody, and product expansion. IOSCO adds the
              adoption constraint that cross-border crypto activity creates regulatory-arbitrage, investor-protection,
              and market-integrity risks. CoinDesk's market headlines also show that hacks, litigation, and protocol
              security issues remain live category risks, including a report of $16 million in suspicious exchange
              outflows. EXU's buyer, payer, geography, and compliance posture are not disclosed, so timing and
              willingness to pay cannot be quantified.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
