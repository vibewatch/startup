      - number: '4.3'
        title: Cost structure, liquidity, and financing dependency
        blocks:
          - type: paragraph
            body: >-
              No assigned source reports EXU cash on hand, monthly burn, gross margin, headcount cost, cloud or
              market-data expense, custody and compliance cost, working capital, capex, debt, credit facilities, or a
              next-round trigger. The $160 million raised is cumulative financing and must not be treated as cash
              available in 2026. Industry evidence shows that centralized crypto-asset businesses can combine multiple
              operational and control functions, which implies a potentially broad cost and governance perimeter, but it
              does not quantify EXU's spend. Capital adequacy therefore remains unresolved: an investor should require a
              current balance sheet, cash-flow bridge, runway calculation, debt schedule, and use-of-funds plan before
              underwriting.
            claimRefs:
              - CI007
              - CI008
              - CI009
