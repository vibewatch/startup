              geography, channel partner, or production outcome. The analysis cannot responsibly classify EXU as
              institutional, retail, developer-facing, or multi-segment. Each is retained only as a diligence
              hypothesis. This evidence boundary also prevents translating the reported $120 million Series B or $160
              million total funding into customer scale, revenue, liquidity, or retention.
            claimRefs:
