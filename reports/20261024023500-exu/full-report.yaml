  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and maturity
        blocks:
          - type: paragraph
            body: >-
              The strongest company-specific description in the assigned pool is a TechCrunch report that calls EXU “a
              crypto trading platform,” identifies a 2025 founding year, and reports a $120 million Series B and $1.2
              billion valuation based on PitchBook. That establishes a product category and financing context, not a
              verified feature set, user workflow, or production maturity. No assigned source names EXU’s order types,
              supported assets, custody model, APIs, settlement rails, customer segments, service-level objectives, or
              deployment footprint. A useful maturity conclusion is therefore bounded: EXU has been externally
              categorized as a trading platform, while the product surface remains private for diligence purposes.
