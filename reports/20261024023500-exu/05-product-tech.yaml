schemaVersion: "report-v2"
artifact: product-tech
slug: exu
runDate: 2026-10-24
company:
  name: EXU
chapter:
  number: 5
  title: Product & Technology
  summary: EXU is publicly described as a crypto trading platform, but the assigned evidence does not disclose its product modules, architecture, integrations, controls, or operating performance. The investable technology question is therefore less whether a trading venue can be built than whether EXU can evidence custody, surveillance, resilience, and security.
sections:
  - id: product-surface
    title: Product surface and maturity
    body: >-
      The strongest company-specific description in the assigned pool is a TechCrunch report that calls EXU “a crypto trading platform,” identifies a 2025 founding year, and reports a $120 million Series B and $1.2 billion valuation based on PitchBook. That establishes a product category and financing context, not a verified feature set, user workflow, or production maturity. No assigned source names EXU’s order types, supported assets, custody model, APIs, settlement rails, customer segments, service-level objectives, or deployment footprint. A useful maturity conclusion is therefore bounded: EXU has been externally categorized as a trading platform, while the product surface remains private for diligence purposes.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001]
  - id: operating-architecture
    title: Operating architecture and dependencies
    body: >-
      A crypto trading venue normally depends on a connected workflow of client access, identity and permissions, order handling, execution and market data, asset custody, reconciliation, withdrawals, monitoring, and incident response. IOSCO’s 2023 recommendations explicitly cover order handling, trade disclosures, market surveillance, custody, client-asset reconciliation, and operational and technological risks. Those are control domains to test at EXU, not evidence that EXU has implemented them. Public exchange benchmarks show that market platforms expose measurable activity such as volume, liquidity, and confidence in reported volume, but the assigned pool contains no EXU-specific activity or reliability series. The architecture is consequently best represented as an underwriting map with unverified EXU implementation and third-party dependency questions.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE002]
    figureRefs: [FE001]
  - id: controls-and-gaps
    title: Trust, security, and technical diligence
    body: >-
      NIST describes cybersecurity and privacy work in terms of risk management, identity and access management, privacy, and trusted networks and platforms; Hexatrust describes a cybersecurity and trusted-cloud association whose members include software publishers, solution providers, and service companies. Neither source verifies EXU’s controls. The assigned evidence also does not establish an EXU SOC 2 or ISO 27001 certification, proof-of-reserves process, insurance, penetration-test program, segregation of duties, withdrawal controls, outage history, incident disclosures, or public developer surface. These are material gaps for a crypto trading platform because a polished interface or financing round does not demonstrate safe custody or resilient execution.
    claimRefs: [CE010, CE011, CE012, CE013, CE014]
    tableRefs: [TE003]
callouts:
  - calloutType: risk
    title: Technology is not yet independently underwritten
    body: >-
      The evidence supports only a category-level description of EXU. Do not assign production maturity until EXU supplies architecture, control attestations, incident history, and operating-performance evidence.
    claimRefs: [CE003, CE012, CE013]
  - calloutType: recommendation
    title: Gate deployment on control evidence
    body: >-
      Before relying on the platform, request an architecture diagram, asset and fiat flow, key-management design, access-control matrix, surveillance coverage, reconciliation evidence, recovery objectives, independent assurance reports, and a dated incident register.
    claimRefs: [CE005, CE006, CE010, CE011]
