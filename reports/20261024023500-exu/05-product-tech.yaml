      - ["Execution and market data", "Trader and risk team", "Not disclosed", null, "Request venues, routing policy, latency/SLA metrics, and market-data provenance"]
      - ["Custody and settlement", "Customer and treasury operations", "Not disclosed", null, "Request custody model, wallet/key controls, reconciliation, and withdrawal approvals"]
      - ["Security and compliance controls", "Customer, risk, and regulator", "Not disclosed", null, "Request independent assurance, certifications, surveillance, and incident evidence"]
    notes: "EXU-specific modules are not publicly documented in the assigned pool; null means no verified differentiation evidence, not that the module does not exist."
    claimRefs: [CE001, CE003, CE005, CE006, CE010, CE012]
  - id: TE002
    title: Workflow and use-case table
    columns: [User job, Current workflow, Company solution, Measurable benefit, Limitation]
    rows:
      - ["Place and manage crypto trades", "Crypto trading workflow; buyer not disclosed", "Trading platform category only", null, "No EXU order-type, execution, or outcome data"]
      - ["Assess liquidity and venue quality", "Compare exchange activity and reported-volume confidence", "Public exchange-ranking methodology offers a benchmark lens", null, "CoinMarketCap data shown is not EXU evidence"]
      - ["Safeguard client assets", "Custody, reconciliation, and withdrawals", "EXU control design not disclosed", null, "IOSCO provides control expectations but does not verify EXU"]
      - ["Operate through incidents and recovery", "Monitoring, response, and restoration", "EXU operating history not disclosed", null, "Request outage register, RTO/RPO, and recovery-test results"]
    notes: "Rows describe diligence-relevant workflows and benchmarks; no row should be read as proof that EXU currently provides the named control or benefit."
    claimRefs: [CE005, CE006, CE007, CE008, CE009, CE013]
  - id: TE003
    title: Technology and operating architecture table
    columns: [Layer or process, Role, Dependency, Risk, Evidence status]
    rows:
      - ["Client and identity layer", "Authenticate users and authorize actions", "Identity provider and privileged-access controls", "Account takeover or unauthorized trading", "EXU implementation not disclosed"]
      - ["Order and execution layer", "Accept, route, match, and report orders", "Venues, liquidity, and market-data feeds", "Execution quality, conflicts, and market abuse", "EXU implementation not disclosed"]
      - ["Custody and settlement layer", "Hold, transfer, and reconcile assets", "Wallet/key infrastructure and banking rails", "Loss, theft, or reconciliation break", "EXU implementation not disclosed"]
      - ["Surveillance and compliance layer", "Detect abusive behavior and manage disclosures", "Regulatory obligations and monitoring systems", "Enforcement or market-integrity failure", "IOSCO control expectation only"]
      - ["Resilience and security layer", "Protect availability, privacy, and recovery", "Cloud, network, vendors, and response teams", "Outage, breach, or data loss", "NIST control domains only"]
      - ["Evidence and assurance layer", "Demonstrate quality to customers and regulators", "Audits, certifications, testing, and incident records", "Unsupported institutional-grade claim", "No EXU evidence in assigned pool"]
    notes: "This is a diligence architecture, not a claim that EXU uses these components. Dependency and risk fields are underwriting questions grounded in the cited control frameworks."
    claimRefs: [CE005, CE006, CE010, CE011, CE012, CE013]
