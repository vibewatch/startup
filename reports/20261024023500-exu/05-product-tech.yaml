  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: product-disclosure
      missingEvidence: "A current EXU product surface covering supported assets, order types, APIs, custody, settlement, integrations, and customer workflows."
      whyItMatters: "Without a verifiable product boundary, investors cannot assess what is actually delivered or separate a trading venue from a broader institutional platform."
      diligencePath: "Request a dated product deck, API documentation, supported-asset matrix, customer workflow, and production deployment references."
      relatedQuestionRefs: [QE002, QE003]
    - type: private-evidence-only
      severity: blocking
      topic: assurance-gap
      missingEvidence: "Independent assurance, certification, penetration-testing, key-management, reconciliation, and proof-of-reserves evidence."
      whyItMatters: "Custody and privileged-access failures can create loss or regulatory exposure even when trading functionality works."
      diligencePath: "Obtain SOC reports or equivalent, certifications, control matrix, wallet/key architecture, reconciliation samples, and an independent assurance letter."
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: product-maturity
      missingEvidence: "EXU-specific reliability, latency, uptime, incident, recovery, and roadmap evidence."
      whyItMatters: "Institutional adoption depends on predictable execution and recoverability, neither of which follows from a financing announcement."
      diligencePath: "Request dated uptime and incident logs, SLA/SLO definitions, RTO/RPO tests, status-page history, and roadmap commitments."
      relatedQuestionRefs: [QE004, QE007]
    - type: access-blocked
      severity: material
      topic: crypto-market-research
      missingEvidence: "A usable copy of the assigned Messari/Blockworks market-research page."
      whyItMatters: "The prefetched page returned a not-found experience, so it cannot support market or technology conclusions."
      diligencePath: "Obtain an accessible original report or replace it with a successful independent market-data source in a future refresh."
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: developer-signal-gap
      missingEvidence: "An EXU-specific public repository, package-registry footprint, API community, engineering presentation, or credible practitioner proxy."
      whyItMatters: "Without a developer or practitioner signal, implementation maturity and ecosystem adoption cannot be independently tested."
      diligencePath: "Request repository and release history, API usage evidence, engineering references, and links to any public technical community."
      relatedQuestionRefs: [QE003, QE005]
