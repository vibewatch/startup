        - id: customer-activity
          label: Customer trading activity
          detail: "Volume and active institutional accounts are not publicly disclosed."
        - id: fee-and-spread
          label: Fees and spreads
          detail: "Fee schedule, rebates, and realized spread are unavailable."
        - id: ancillary-services
          label: Ancillary services
          detail: "Custody, settlement, staking, or other service revenue is unverified."
        - id: gross-revenue
          label: Gross revenue
          detail: "No EXU revenue figure or revenue recognition policy was retained."
        - id: operating-costs
          label: Operating costs
          detail: "Liquidity, compliance, infrastructure, personnel, and support costs are unavailable."
        - id: gross-profit
          label: Gross profit
          detail: "Gross margin and contribution are unavailable; no value is inferred."
