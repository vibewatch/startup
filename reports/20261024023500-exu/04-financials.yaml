    claimRefs: [CI004, CI012, CI015]
callouts:
  - calloutType: risk
    title: Regulatory exposure can alter financial requirements
    body: IOSCO describes non-compliance and inadequate safeguards as recurring market concerns, and the SEC's Coinbase action shows how registration and function-separation issues can affect an exchange business. These are sector and comparator risks, not findings about EXU.
    claimRefs: [CI005, CI006, CI011]
