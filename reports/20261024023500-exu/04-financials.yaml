chapter:
  number: 4
  title: Financials
  summary: Public evidence identifies EXU as a 2025-founded crypto trading platform with a reported $120 million Series B, $160 million raised to date, and a $1.2 billion valuation. Revenue, pricing, margins, liquidity, burn, and runway remain unreported, so underwriting is dependent on obtaining company financials and regulatory diligence rather than extrapolating from funding or sector activity.
sections:
  - id: public-capital-signal
    title: Public capital signal, not operating traction
    body: >-
      TechCrunch, citing PitchBook, reports that EXU was founded in 2025, operates as a crypto trading platform, raised a $120 million Series B, includes Sequoia and The Goldman Sachs Group among its investors, and has raised $160 million in funding to date. The same report places the company at a $1.2 billion valuation. These are financing and valuation signals, not revenue, ARR, GMV, cash, or profitability measures. The funding chronology belongs in Company Overview; this chapter uses the local capital facts only to frame capital adequacy and the information required for forward underwriting. A valuation multiple cannot be calculated without a revenue denominator.
    claimRefs: [CI001, CI002, CI003]
    tableRefs: [TI001]
  - id: monetization-and-unit-economics
    title: Monetization mechanics and unit-economics visibility
    body: >-
      The assigned evidence does not disclose EXU's fee schedule, spread capture, custody or staking economics, institutional contract terms, realized take rate, customer acquisition cost, sales cycle, retention, or payback. A crypto trading platform may combine exchange, brokerage, market-making, custody, settlement, margin, or staking activities, but IOSCO explicitly notes that these functions can sit under one roof and should be disclosed by role and capacity. That regulatory framing makes the revenue bridge a diligence hypothesis rather than a measured model. List pricing, if later obtained, must remain separate from realized net revenue after rebates, liquidity incentives, payment costs, and compliance operations.
    claimRefs: [CI004, CI005, CI006]
    tableRefs: [TI002]
    figureRefs: [FI001]
  - id: cost-structure-and-capital-adequacy
    title: Cost structure, liquidity, and financing dependency
    body: >-
      No assigned source reports EXU cash on hand, monthly burn, gross margin, headcount cost, cloud or market-data expense, custody and compliance cost, working capital, capex, debt, credit facilities, or a next-round trigger. The $160 million raised is cumulative financing and must not be treated as cash available in 2026. Industry evidence shows that centralized crypto-asset businesses can combine multiple operational and control functions, which implies a potentially broad cost and governance perimeter, but it does not quantify EXU's spend. Capital adequacy therefore remains unresolved: an investor should require a current balance sheet, cash-flow bridge, runway calculation, debt schedule, and use-of-funds plan before underwriting.
    claimRefs: [CI007, CI008, CI009, CI010]
    tableRefs: [TI003]
  - id: underwriting-verdict
    title: Financial verdict and diligence blockers
    body: >-
      The strongest public financial conclusion is asymmetric: EXU has a reported institutional funding signal, but the operating inputs needed to test revenue quality and capital efficiency are private or unavailable in the assigned pool. Sector sources provide context, not corroboration of EXU performance. IOSCO documents repeated investor-protection and market-integrity concerns in crypto markets, while the SEC's Coinbase action illustrates how registration, disclosure, and function-separation issues can create financial and regulatory exposure for an exchange model; neither source establishes an EXU violation. The investable verdict is research-more: do not infer ARR, take rate, gross margin, burn, runway, or solvency from valuation, fundraising, or market-wide exchange volumes.
    claimRefs: [CI011, CI012, CI013, CI014, CI015, CI016]
    callouts:
      - calloutType: recommendation
        title: Require operating financials before underwriting
        body: Obtain monthly revenue by stream, realized take rate and rebates, gross-margin bridge, cash and restricted cash, burn and runway, debt terms, customer concentration, and regulatory-cost assumptions before relying on the reported valuation.
        claimRefs: [CI012, CI013, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams table
    columns: [stream, mechanism, unit, current value/status, quality, diligence ask]
    rows:
      - [Trading fees, "Customer trading activity multiplied by fee schedule", "basis points or fixed fee per trade", null, "No EXU pricing or volume disclosed", "Obtain fee tiers, rebates, realized take rate, and volume by customer segment"]
      - [Spread or market-making, "Bid-ask or liquidity economics where EXU acts as intermediary or market maker", "spread / transaction", null, "Not publicly quantified", "Reconcile gross spread, inventory risk, and net contribution after hedging"]
      - ["Custody, settlement, or institutional services", "Contracted service fees for custody, settlement, or related infrastructure", "contract / assets or transactions", null, "Product scope and contract terms unavailable", "Provide contracts, revenue recognition policy, and service-delivery cost allocation"]
      - ["Staking or ancillary yield services", "Customer asset participation and rewards-related economics", "assets or rewards share", null, "No EXU program evidence in assigned sources", "Confirm whether offered, legal entity, customer share, and accounting treatment"]
    notes: "EXU stream values are unavailable in the assigned evidence; null means no public figure was retained, not zero revenue. Mechanisms are diligence categories informed by IOSCO's description of centralized crypto-asset activities."
    claimRefs: [CI004, CI012]
  - id: TI002
    title: Pricing and monetization table
    columns: [metric, value, basis, confidence, implication, diligence ask]
    rows:
      - [Published trading price, null, "Official EXU pricing page not retained", low, "List pricing cannot be assessed", "Obtain current institutional and retail schedules"]
      - [Realized net take rate, null, "Requires revenue divided by comparable trading activity", low, "Revenue quality and sensitivity cannot be tested", "Provide monthly cohorts, rebates, incentives, and denominator definition"]
      - [Contract and channel economics, null, "No partner, reseller, or customer terms retained", low, "Sales efficiency and contribution margin are unknown", "Provide contracts, implementation fees, renewal terms, and channel share"]
    notes: "Nulls denote unavailable public evidence. List price, realized revenue, and margin are separate measures and should not be substituted for one another."
    claimRefs: [CI012, CI014]
  - id: TI003
    title: Unit economics and capital adequacy table
    columns: [metric, value, confidence, why it matters, diligence ask]
    rows:
      - [Customer acquisition cost, null, low, "Tests whether growth consumes disproportionate capital", "Provide fully loaded acquisition spend and new funded or active institutional accounts by cohort"]
      - [Gross margin, null, low, "Separates transaction revenue from liquidity, custody, compliance, and infrastructure cost", "Provide revenue and cost-of-revenue bridge by stream and accounting policy"]
      - [Cash runway and next-round trigger, null, low, "Determines financing dependency and solvency buffer", "Provide current cash, restricted cash, monthly burn, debt maturities, committed uses, and minimum liquidity policy"]
    notes: "All values are unavailable in the assigned evidence; the requested fields are underwriting inputs, not estimates. Cumulative funding is not cash on hand and cannot establish runway."
    claimRefs: [CI002, CI013, CI015, CI016]
