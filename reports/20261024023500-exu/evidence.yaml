  - type: missing-source
    severity: blocking
    topic: identity
    missingEvidence: >-
      A primary corporate or regulatory record linking the EXU platform to its legal entity, jurisdiction, website, and
      headquarters.
    whyItMatters: >-
      The assigned evidence includes unrelated EXU namesakes, so the company identity and applicable regulator cannot be
      treated as settled.
    diligencePath: >-
      Obtain the financing announcement, incorporation record, regulator registration, and verified company domain from
      management or counsel.
