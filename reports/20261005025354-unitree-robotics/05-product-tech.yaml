callouts:
  - calloutType: "strength"
    title: "In-House Component Manufacturing as a Defensible Cost Moat"
    body: "Unitree's capability to independently research, develop, and mass-produce its own PMSM joint motors, cycloidal reducers, motor controllers, and 4D LiDAR sensors enables pricing tiers ($1,600 Go2, $13,500 G1) that Western robotics companies relying on external component supply chains cannot achieve without severe negative gross margins."
    claimRefs:
      - "CE005"
      - "CE006"
      - "CE008"
  - calloutType: "risk"
    title: "Generalization Bottlenecks Restrict Commercial Humanoid Deployments"
    body: "Despite shipping 5,511 humanoid units in 2025, commercial deployments into productive industrial manufacturing remain minimal at 9.0%. Modern embodied AI models perform well on scripted acrobatics but experience steep failure rates when environmental lighting, object orientation, or surface textures shift in unstructured real-world facilities."
    claimRefs:
      - "CE012"
      - "CE013"
      - "CE016"
