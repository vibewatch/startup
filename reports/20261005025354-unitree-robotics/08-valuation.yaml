  evidenceGaps:
    - type: missing-source
      severity: blocking
      topic: capitalization
      missingEvidence: >-
        Primary prospectus, final offer price, current share price, fully diluted share count, option pool,
        preference terms, debt, and net cash.
      whyItMatters: >-
        Without these inputs, the supplied enterprise and equity valuation references cannot be reconciled
        or translated into an investor return.
      diligencePath: >-
        Obtain the Shanghai Stock Exchange prospectus and latest trading or offer documents, then reconcile
        every security and financing term to a fully diluted capitalization table.
      relatedQuestionRefs: [QV002, QV008]
    - type: private-evidence-only
      severity: material
      topic: financial-quality
      missingEvidence: >-
        Audited 2024-2026 income statements, cash-flow statements, balance sheets, segment margins, warranty
        reserves, working capital, and revenue-recognition policies.
      whyItMatters: >-
        Secondary revenue and profit reports do not establish cash generation, margin durability, or the
        correct denominator for a sales multiple.
      diligencePath: >-
        Review audited financial statements and reconcile reported revenue, profit, shipments, cash
        conversion, and segment economics with management and the auditor.
      relatedQuestionRefs: [QV003, QV007]
    - type: private-evidence-only
      severity: material
      topic: industrial-commercialization
      missingEvidence: >-
        Named industrial customer cohorts, paid pilot conversion, repeat purchases, retention, utilization,
        service costs, and realized prices after discounts.
      whyItMatters: >-
        Research-led shipments can demonstrate product access without proving repeatable industrial value or
        durable unit economics.
      diligencePath: >-
        Sample major industrial cohorts, verify invoices and renewals, and calculate deployment-level gross
        margin, uptime, support cost, and expansion.
      relatedQuestionRefs: [QV001, QV006, QV007]
    - type: missing-source
      severity: material
      topic: comparables-and-exit
      missingEvidence: >-
        Primary comparable-company trading data, relevant robotics transactions, lockups, free float, trading
        liquidity, and a documented exit or holding-period return bridge.
      whyItMatters: >-
        A broad mid-teens peer reference is insufficient to select a precise multiple or estimate achievable
        exit proceeds.
      diligencePath: >-
        Build a dated public-comparable and transaction set from exchange filings, normalize revenue and
        margins, and model dilution, liquidity, holding period, and exit sensitivity.
      relatedQuestionRefs: [QV004, QV005, QV008]
