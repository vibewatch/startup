      - [Confidence, Medium-low, "Revenue, profit, and shipment signals are reported, but audited statements are absent", "Treat operating quality and valuation as provisional"]
      - ["Risk and valuation stance", "High risk; unresolved valuation", "High-30s target P/S versus a reported mid-teens robotics peer cluster", "Require a substantial evidence margin before accepting a premium multiple"]
    notes: >-
      Assessments use only the assigned prefetched evidence; valuation references are secondary reports,
      not a verified current market capitalization or fully diluted equity value.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Evidence, What would change the view]
    rows:
      - ["Thesis — visible scale", "More than 5,500 humanoid units reportedly dispatched in 2025", "Audited shipment-to-revenue reconciliation and customer cohort data"]
      - ["Thesis — cost and product breadth", "$4,900 R1, $13,500 G1, internally developed core components, and industrial platform offerings", "Verified gross margins by product and evidence of paid fleet expansion"]
      - ["Anti-thesis — research-heavy demand", "74% research/developer mix versus 9% industrial applications", "Industrial mix above research demand with repeat deployments and service revenue"]
      - ["Anti-thesis — earnings sensitivity", "First-quarter adjusted net profit reportedly halved despite more than 68% revenue growth", "Audited evidence that operating leverage recovers without reducing product investment"]
    notes: >-
      Product prices are company-published list prices excluding any undisclosed discounts, taxes, shipping,
      service, configuration, or channel effects; operating metrics are third-party reports.
    claimRefs: [CV008, CV009, CV010, CV011, CV013, CV014, CV015, CV016]
  - id: TV003
    title: Bull, base, and bear valuation scenarios
    columns: [Scenario, Assumptions, Valuation range or logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Triple-digit growth persists; profitability is audited; industrial mix and repeat deployments rise materially", "High-30s P/S target range described by KraneShares", "Possible, but unsupported by primary filing evidence in the assigned pool", "Growth decelerates or industrial conversion remains near the reported 9% mix"]
      - [Base, "Growth normalizes; research demand remains important; margins absorb sustained R&D and sales investment", "Mid-teens P/S cluster reported for comparable STAR and ChiNext robotics names", "Most defensible relative anchor in the available evidence", "Profit remains compressed or customer-quality evidence does not improve"]
      - [Bear, "Commercialization stalls, multiple compression follows, or safety, security, policy, and dilution risks compound", "Below mid-teens P/S; no supportable lower bound without audited balance-sheet and capitalization data", "Material because current humanoid efficiency and industrial adoption remain limited", "Failed industrial pilots, adverse regulation, a down-round-like repricing, or unexpected financing overhang"]
    notes: >-
      These are evidence-bounded relative scenarios, not price targets or probabilities. The pool lacks a
      verified current share price, fully diluted shares, audited net cash, preference terms, and transaction
      comparables needed for absolute equity-value or return ranges.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV011, CV012]
