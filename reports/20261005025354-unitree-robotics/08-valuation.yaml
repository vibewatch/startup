        - {id: growth, label: Growth proof, detail: "First-quarter revenue reportedly exceeded the prior year by more than 68%"}
        - {id: earnings, label: Earnings pressure, detail: "Adjusted first-quarter net profit reportedly halved"}
        - {id: adoption, label: Adoption constraint, detail: "Only 9% of humanoid sales reportedly went to industrial applications"}
        - {id: readiness, label: Technology constraint, detail: "General factory and warehouse efficiency reportedly remains at 30% to 50% of human performance"}
