slug: unitree-robotics
runDate: 2026-10-05
company:
  name: Unitree Robotics
chapter:
  number: 8
  title: Valuation
  summary: >-
    Unitree shows unusual hardware scale and reported profitability, but the supplied public evidence
    contains conflicting $6 billion and roughly $9 billion IPO valuation references and does not establish
    the current share price, fully diluted capitalization, preference stack, or audited financial base.
    The resulting recommendation is research-more, with a mid-teens sales multiple as the only supported
    public-comparable anchor and no defensible absolute equity-value range yet.
sections:
  - id: decision-and-entry-discipline
    title: Decision and entry discipline
    body: >-
      The current call is research-more, with medium-low confidence and high risk. This is not a negative
      judgment on Unitree's product position; it is a refusal to treat incompatible secondary valuation
      references as a decision-ready price. KraneShares described a roughly $9 billion target and a
      high-30s price-to-sales implication, while TIME described the March filing at $6 billion. The same
      pool says the company intended to issue at least 40.45 million new shares and raise about CNY 6.1
      billion, but it does not provide the final offer price, current trading price, post-offer share count,
      options, preferences, debt, or net cash. Entry discipline therefore requires a primary prospectus,
      cap table, and audited accounts before converting the business thesis into an equity return case.
    claimRefs: [CV001, CV002, CV005, CV006, CV007]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: evidence-for-a-premium
    title: Evidence for a premium, with limits
    body: >-
      There is credible evidence for considering a premium to undifferentiated robotics hardware. One
      secondary source reports CNY 1.71 billion of 2025 revenue and 335% year-over-year growth, while
      Wikipedia lists CNY 288 million of 2025 net income. TIME reports more than 5,500 humanoid units
      dispatched in 2025, and Unitree's own pages show a product ladder from a $4,900 R1 to a $13,500 G1,
      plus internally developed motors, reducers, controllers, and sensors. The company also markets both
      power-inspection solutions and a data-and-training platform able to coordinate hundreds of robots.
      Those signals support scale, cost control, and platform optionality, but they are not substitutes for
      audited segment economics or evidence that industrial customers renew and expand deployments.
    claimRefs: [CV003, CV004, CV010, CV013, CV014, CV015, CV016]
    tableRefs: [TV002]
  - id: anti-thesis-and-downside
    title: Anti-thesis and downside
    body: >-
      The anti-thesis is commercialization quality, not lack of technical visibility. TIME reports that
      74% of humanoid sales went to universities, research institutions, and individual developers, versus
      9% to industrial applications and 17% to commercial venues. It also says current humanoids perform
      at roughly 30% to 50% of human efficiency for general factory and warehouse work. Near-term momentum
      is mixed: first-quarter revenue reportedly rose more than 68% to $62 million, yet adjusted net profit
      halved to $6 million as research-and-development and selling costs increased. A high-30s sales
      multiple would leave little room for slower industrial conversion, continued cost growth, safety or
      security setbacks, export restrictions, or a public-market multiple reset.
    claimRefs: [CV008, CV009, CV011, CV012, CV005]
  - id: scenarios-exit-and-diligence
    title: Scenarios, exit readiness, and final diligence
    body: >-
      The scenario framework uses relative sales-multiple bands because the evidence pool does not support
      a fully diluted absolute valuation. The bull case requires the high-30s multiple to be earned through
      sustained triple-digit growth, durable profitability, and a material shift toward productive
      industrial deployments. The base case uses the reported mid-teens peer cluster while assuming growth
      normalizes and research-led demand remains important. The bear case is below that cluster, with no
      defensible floor until cash, debt, dilution, and customer concentration are disclosed. The reported
      STAR Market process is an exit-readiness signal, but not proof of liquidity or achievable investor
      returns. Final diligence should reconcile the $6 billion and $9 billion references against primary
      filings and test revenue quality, margins, working capital, warranty exposure, and industrial cohort
      retention.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV011, CV012]
    tableRefs: [TV003]
