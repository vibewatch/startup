callouts:
  - calloutType: "insight"
    title: "Cost Engineering as the Primary Disruptive Moat"
    body: "Unitree's competitive differentiation is grounded in manufacturing economics rather than unassisted artificial intelligence breakthroughs. By designing in-house electric joint actuators, PMSMs, reducers, and sensory modules, the company slashed retail prices for quadrupeds to under $2,000 and humanoids to $13,500–$16,000 [CO010, CO011]. This structural cost efficiency enabled Unitree to capture over 25% of global humanoid shipments in 2025 while operating profitably [CO012]."
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
  - calloutType: "risk"
    title: "Dual Geopolitical and Customer Concentration Exposure"
    body: "Despite remarkable public market enthusiasm on the Shanghai STAR Market, Unitree faces two structural vulnerabilities. First, 73.6% of humanoid sales remain concentrated in research institutions rather than autonomous industrial workflows [CO013]. Second, U.S. regulatory scrutiny—spanning cybersecurity vulnerability reports and its June 2026 placement on the Department of Defense military-linked company list—threatens overseas distribution across North America and Europe [CO015, CO016]."
    claimRefs:
      - "CO013"
      - "CO015"
      - "CO016"
