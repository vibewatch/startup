summary:
  headline: >-
    Unitree is a rare profitable public humanoid-robotics platform with visible scale, but research-heavy demand,
    valuation ambiguity, and security/geopolitical risk keep the case at track rather than buy.
  overallScore: 7.2
  recommendation: track
  confidence: medium
