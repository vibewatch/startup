  topStrengths:
    - Public-market liquidity and clearer operating disclosure than most private robotics peers
    - Reported profitability alongside rapid revenue and shipment growth
    - Broad product ladder with unusually transparent list pricing
  topRisks:
    - Research and education demand still dominates the humanoid mix
    - Current valuation and fully diluted capitalization remain unresolved
    - Cybersecurity, policy, and export scrutiny create non-trivial downside
  unresolvedGaps:
    - Current share price, fully diluted capitalization, and preference / debt stack
    - Audited segment economics for 2025-2026 and a clean hardware-versus-services split
    - Named industrial customer cohorts with repeat purchase and retention evidence
