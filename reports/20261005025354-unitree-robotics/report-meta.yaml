companyProfile:
  summary: >-
    Unitree Robotics is a Hangzhou-based robotics manufacturer founded in 2016 by Wang Xingxing that moved from low-cost
    quadruped robot dogs into general-purpose humanoids, then completed a 2026 Shanghai STAR Market listing. The company
    combines visible hardware scale, strong list-price transparency, and reported profitability with heavy reliance on
    research and education buyers, which leaves industrial repeat demand, security posture, and capitalization details
    unresolved.
