evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: executive-officer-disclosure
    missingEvidence: >-
      Complete public disclosure of secondary C-suite executives, independent board directors, and audit committee
      members outside founder Wang Xingxing.
    whyItMatters: >-
      Single-founder operational and key-person risk cannot be independently evaluated without visibility into
      leadership succession and board governance.
    diligencePath: Review Shanghai Stock Exchange post-IPO corporate governance reports and statutory board election disclosures.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: software-recurring-revenue
    missingEvidence: >-
      Audited post-IPO breakdown distinguishing hardware unit sales from recurring software licenses, developer tooling,
      or fleet maintenance contracts.
    whyItMatters: >-
      High dependence on non-recurring hardware transactions leaves revenue vulnerable to lumpy research lab procurement
      cycles.
    diligencePath: >-
      Review subsequent quarterly SSE STAR Market financial disclosures for segment-level ARR and service contract
      disclosures.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: industrial-fleet-retention
    missingEvidence: >-
      Named tier-one industrial factory deployment scale, net retention rates, and daily active operating hours outside
      of pilot benchmarks.
    whyItMatters: >-
      Validates whether humanoids are crossing the generalization gap into autonomous production or remaining lab
      evaluation tools.
    diligencePath: Examine commercial factory customer case studies and partner integrator deployment filings.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: industrial-fleet-repeat-order-rate
    missingEvidence: >-
      Audited retention and expansion figures for commercial enterprise customers transitioning from initial single-unit
      trials to multi-unit industrial fleet operations.
    whyItMatters: >-
      Without repeat procurement rates, it is impossible to verify whether early industrial pilots yield viable unit
      economics and long-term customer lifetime value.
    diligencePath: >-
      Review subsequent Shanghai Stock Exchange periodic disclosures for commercial customer renewal rates and
      industrial segment ARR.
    relatedQuestionRefs:
      - QM006
      - QM007
    relatedTableRefs:
      - TM001
  - type: enumeration-incomplete
    severity: material
    topic: competitor-unit-shipment-breakdown
    missingEvidence: >-
      Granular unit shipment volumes and average selling prices for private competitors including Agility Robotics and
      Boston Dynamics.
    whyItMatters: >-
      Assessing true market share dynamics requires audited sales data from private Western competitors who currently
      disclose fleet figures selectively.
    diligencePath: Consult specialized industrial robotics trade association reports and enterprise procurement benchmark surveys.
    relatedQuestionRefs:
      - QM003
      - QM005
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: industrial-customer-deployment-scale
    missingEvidence: >-
      Audited customer case studies with verified unit deployment counts, recurring service economics, and ROI metrics
      for enterprise industrial customers.
    whyItMatters: >-
      Without verified industrial adoption data, it remains unclear whether Unitree can transition from university labs
      to recurring factory automation deployments.
    diligencePath: >-
      Obtain customer reference call transcripts from industrial inspection and manufacturing pilots in China and
      Europe.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: material
    topic: customer-retention
    missingEvidence: >-
      Audited retention data and multi-year renewal rates for enterprise and industrial customers versus academic
      one-time purchases.
    whyItMatters: >-
      High concentration in academic research grants (70%+) creates lumpy, non-recurring revenue that does not
      demonstrate long-term enterprise software or maintenance lock-in.
    diligencePath: >-
      Request customer cohort retention matrices, contract renewal terms, and recurring software license bookings during
      management diligence.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: unit-cost-breakdown
    missingEvidence: >-
      Granular bill-of-materials (BOM) cost schedule per model, including actuator, sensor, compute, and battery
      subcomponents.
    whyItMatters: >-
      Validating whether the reported ~60% gross margin can withstand semiconductor price fluctuations, tariff
      additions, and customized enterprise integration costs.
    diligencePath: >-
      Conduct formal cost engineering teardown and review audited product-level segment gross margins in underwriting
      materials.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: hardware-reliability
    missingEvidence: >-
      Audited mean-time-between-failures (MTBF) and component failure logs for in-house PMSM joint actuators across
      multi-thousand-hour customer duty cycles.
    whyItMatters: >-
      Validating whether low-cost in-house actuators sustain industrial reliability or experience elevated warranty
      service costs in commercial factory environments.
    diligencePath: >-
      Request customer RMA warranty return logs, actuator stress testing records, and accelerated life testing reports
      during technical diligence.
    relatedQuestionRefs:
      - QE003
      - QE007
    relatedTableRefs:
      - TE002
  - type: missing-source
    severity: material
    topic: embodied-ai-generalization
    missingEvidence: >-
      Independent benchmark evaluation data measuring physical manipulation success rates under novel lighting, object
      textures, and tabletop displacements.
    whyItMatters: >-
      Confirming whether Unitree's embodied AI models achieve generalizable manipulation or remain constrained to
      scripted video demonstrations and academic labs.
    diligencePath: Review standardized LeRobot and Isaac Lab evaluation benchmark results across diverse physical deployment trials.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-expansion
    missingEvidence: >-
      Audited multi-year enterprise cohort retention, churn rates, net revenue retention (NRR), and repeat purchasing
      data across industrial inspection and commercial customers.
    whyItMatters: >-
      Without retention and recurring service figures, it is impossible to verify whether Unitree can transcend one-off
      hardware sales into a sustainable high-margin software/robotics service business.
    diligencePath: >-
      Review detailed customer cohort disclosures and service contract renewals in Shanghai Stock Exchange IPO
      prospectus appendices and investor roadshow materials.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: named-industrial-contract-value
    missingEvidence: >-
      Disclosed commercial contract values, SLA commitments, and production fleet sizes for named industrial utility
      customers such as China Southern Power Grid.
    whyItMatters: >-
      Determines whether enterprise utility deployments represent meaningful commercial production volume or symbolic
      low-volume evaluation pilots.
    diligencePath: >-
      Examine utility procurement announcements and official enterprise customer case study disclosures in upcoming
      Shanghai exchange listing filings.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: conflicting-data
    severity: material
    topic: designation-status
    missingEvidence: >-
      Current primary-source Section 1260H designation, Federal Register history, and binding procurement applicability
      by agency and customer.
    whyItMatters: >-
      Changing or binding status could remove government and sensitive-infrastructure demand and alter export or
      financing risk.
    diligencePath: >-
      Have U.S. trade and procurement counsel verify current DoD, Federal Register, FAR/DFARS, agency, and legislative
      records.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: legal-and-safety-record
    missingEvidence: >-
      Complete recall, litigation, enforcement, product-liability, injury, and near-miss record by model and
      jurisdiction.
    whyItMatters: >-
      Absence from the assigned pool is not evidence of absence, and unknown event frequency prevents liability and
      reliability underwriting.
    diligencePath: >-
      Run primary court, regulator, recall, insurance, and distributor searches and reconcile them to management's
      incident register.
    relatedQuestionRefs:
      - QR010
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: cybersecurity
    missingEvidence: >-
      Independent model- and firmware-specific penetration tests, remediation verification, telemetry defaults, patch
      adoption, and vulnerability disclosure history.
    whyItMatters: >-
      A reported service shutdown and management assurances do not establish that the root cause is closed across the
      supported fleet.
    diligencePath: >-
      Commission independent testing and review architecture, SBOM, data flows, signed-update controls, cloud logs, and
      customer patch coverage.
    relatedQuestionRefs:
      - QR003
      - QR009
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: product-reliability
    missingEvidence: >-
      Installed-base denominator, uptime, MTBF, battery degradation, warranty claims, repair times, injuries, and
      emergency-stop test results.
    whyItMatters: Published specifications and warnings cannot quantify field reliability, support cost, or safety liability.
    diligencePath: Sample fleet telemetry and service tickets by model, customer cohort, geography, and firmware version.
    relatedQuestionRefs:
      - QR004
      - QR005
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: material
    topic: supply-chain
    missingEvidence: >-
      Supplier shares, component origin, substitution lead times, safety stock, quality escapes, and dual-source
      qualification for compute, batteries, sensors, and manufacturing.
    whyItMatters: Internal development of some core parts does not establish resilience for the rest of the bill of materials.
    diligencePath: >-
      Review the BOM, top suppliers, purchase commitments, inventory aging, export classifications, and qualified
      alternates.
    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: financial-pressure
    missingEvidence: >-
      Audited gross margin, operating cash flow, cash burn, working capital, warranty reserve, capital expenditure, and
      runway.
    whyItMatters: >-
      Revenue growth and adjusted profit are not cash generation, and the financing requirement cannot be inferred from
      them.
    diligencePath: >-
      Obtain audited statements and monthly management accounts, then bridge reported profit to cash and unit economics
      by product.
    relatedQuestionRefs:
      - QR008
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: commercialization
    missingEvidence: >-
      Production customer cohorts, repeat orders, utilization, intervention rates, task success, retention, and service
      economics.
    whyItMatters: Reported research-heavy demand does not establish durable industrial adoption or positive customer economics.
    diligencePath: >-
      Validate named production deployments with customer interviews, invoices, telemetry, renewals, and total-cost
      comparisons.
    relatedQuestionRefs:
      - QR007
