callouts:
  - calloutType: "insight"
    title: "Structural Disruption Through Manufacturing Economics"
    body: "Unitree's disruption of the robotics market mirrors historical consumer hardware deflation cycles rather than traditional enterprise software moats. By establishing domestic supply chain sovereignty for permanent magnet motors, gearboxes, and structural links, Unitree reduced humanoid hardware production costs by an order of magnitude [CM005, CM007]. This allows the company to seed thousands of developer platforms globally, establishing de facto hardware standards while competitors remain in low-volume prototype phases [CM008]."
    claimRefs:
      - "CM005"
      - "CM007"
      - "CM008"
  - calloutType: "risk"
    title: "The Industrial Software and Autonomy Chasm"
    body: "The central market barrier facing Unitree is the chasm between hardware availability and autonomous enterprise utility. Academic and developer accounts generate over 70% of humanoid revenues, but scaling into multi-million-dollar industrial recurring contracts requires robust end-effector manipulation, zero-intervention autonomy, and functional safety compliance [CM011, CM012]. Without breakthroughs in embodied intelligence software, hardware shipments risk saturating the educational market [CM010, CM014]."
    claimRefs:
      - "CM010"
      - "CM011"
      - "CM012"
      - "CM014"
