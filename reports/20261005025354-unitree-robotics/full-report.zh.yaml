      - - 反向逻辑——盈利敏感性
        - 据报道，第一季度调整后净利润减半，尽管收入增长超过 68%
        - 经审计的证据证明经营杠杆恢复，同时不削减产品投入
    notes: 产品价格是公司公布的目录价，不含未披露的折扣、税费、运输、服务、 配置或渠道影响；运营指标来自第三方报道。
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV013
      - CV014
      - CV015
      - CV016
  - id: TV003
    title: 乐观、基准与悲观估值情景
    columns:
      - 情景
      - 假设
      - 估值区间或逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 三位数增长持续；盈利能力经审计；工业结构和重复部署显著提升
        - KraneShares 描述的 30 多倍高位市销率目标区间
        - 有可能，但指定证据池中的原始申报文件不支持这一判断
        - 增长放缓，或工业转化仍接近报道中的 9% 结构
      - - 基准
        - 增长恢复常态；研究需求仍重要；利润率消化持续的研发和销售投入
        - 报道中的可比科创板和创业板机器人公司十几倍中段市销率集群
        - 现有证据中最站得住脚的相对锚点
        - 利润仍受压，或客户质量证据没有改善
      - - 悲观
        - 商业化停滞、倍数压缩，或安全、安保、政策和稀释风险 叠加
        - 低于十几倍中段市销率；没有经审计的资产负债表和资本结构数据，就无法支持更低下限
        - 风险重大，因为当前人形机器人效率和工业采用仍有限
        - 工业试点失败、不利监管、类似下轮融资的重新定价，或意外融资压力
    notes: 这些是受证据边界约束的相对情景，不是价格目标或概率。证据池缺少经核实的 当前股价、完全摊薄股数、经审计净现金、优先权条款及交易可比数据，因此无法给出 绝对股权价值或回报区间。
    claimRefs:
      - CV003
      - CV004
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
      - CV011
      - CV012
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Unitree Robotics 从 2013 年学术 XDog 原型，到商业四足机器人 主导、人形机器人扩张，再到 2026 年 8 月上海科创板 IPO 的时间轨迹。
    data:
      items:
        - date: 2013-2016
          label: XDog 原型开发
          detail: Wang Xingxing 在上海大学读研期间设计电驱动四足机器人 XDog。
          tone: neutral
        - date: '2016-08-26'
          label: 公司成立
          detail: Wang 离开 DJI，并以 RMB 2M 天使资金注册杭州宇树科技有限公司。
          tone: positive
        - date: '2017-09-01'
          label: Laikago 发布
          detail: Unitree 发布 Laikago，标志着公司首个商业级四足机器人平台问世。
          tone: neutral
        - date: '2020-01-07'
          label: CES 发布 A1
          detail: A1 四足机器人在 CES 2020 首发，以 3.3 m/s 的速度面向教育和研究机器人市场。
          tone: positive
        - date: '2021-06-01'
          label: Go1 消费级四足机器人
          detail: Unitree 推出低成本 Go1 四足机器人，开启大规模消费端采用。
          tone: positive
        - date: '2024-04-01'
          label: H1 人形机器人演示
          detail: Unitree 发布全尺寸双足人形机器人 H1 的技术演示视频。
          tone: positive
        - date: '2024-08-01'
          label: G1 人形机器人量产
          detail: Unitree 宣布 1.27m 人形机器人 G1 量产，定价激进，为 $16,000。
          tone: positive
        - date: '2025-04-15'
          label: 网络安全后门指控
          detail: 安全研究人员发现 Go1/Go2 云服务存在远程后门风险；Unitree 关闭受影响服务器。
          tone: warning
        - date: '2025-06-30'
          label: $2B 估值的 C 轮融资
          detail: 完成由 Tencent、Alibaba、Ant Group 和 China Mobile Capital 领投的 C 轮融资。
          tone: positive
        - date: '2025-10-15'
          label: H2 人形机器人发布
          detail: 发布旗舰 1.8m 人形机器人 H2，配备 2,070 TOPS 算力，面向工业和高级研究。
          tone: positive
        - date: '2026-06-15'
          label: DoD 军方关联名单
          detail: 美国国防部将 Unitree 列入中国军方关联企业名单。
          tone: critical
        - date: '2026-08-19'
          label: 上海科创板 IPO
          detail: Unitree 在上交所科创板（688836）上市，开盘上涨 629%，收盘上涨 460%，报 845 RMB。
          tone: positive
    approximationNotes: 日期对应公开新闻稿、学术出版物、产品发布和监管公告。
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO007
      - CO009
      - CO010
      - CO011
      - CO014
      - CO015
      - CO016
  - id: FM001
    title: 市场规模视角
    type: pyramid
    summary: 商业四足和人形机器人客户采用的分层路径，展示规模如何从开发者大规模测试 逐步收窄至关键任务工业机群。
    data:
      items:
        - label: 第 1 层：关键任务工业机群
          value: 150
          unit: deployed units
          detail: 汽车装配线和 24/7 自主变电站巡逻部署。
          tone: critical
        - label: 第 2 层：企业试点概念验证
          value: 650
          unit: pilot units
          detail: 评估周期时间、操作能力和安全性的结构化验证试验。
          tone: warning
        - label: 第 3 层：学术与研究开发者
          value: 4050
          unit: active systems
          detail: 使用开放 SDK 的大学实验室和 AI 基础模型研究团队。
          tone: positive
        - label: 第 4 层：企业硬件评估
          value: 8000
          unit: evaluated systems
          detail: 为企业工程评估购买的二次评估设备。
          tone: positive
        - label: 第 5 层：教育与 STEM 机器人
          value: 18000
          unit: educational kits
          detail: 大学机电一体化课程、中学和开发者竞赛。
          tone: neutral
        - label: 第 6 层：消费者与爱好者基础
          value: 35000
          unit: consumer quadrupeds
          detail: 购买入门级 Go 系列的个人爱好者和科技早期采用者。
          tone: neutral
    approximationNotes: 规模分布反映 Unitree 在消费级四足机器人和商业人形机器人上的累计出货披露，并 以 2025 年收入结构为基准。
