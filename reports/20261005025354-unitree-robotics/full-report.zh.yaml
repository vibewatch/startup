      - number: '2.4'
        title: 案例
        blocks:
          - type: callout
            title: 制造经济学带来的结构性颠覆
            body: >-
              Unitree 通过制造经济学重塑机器人市场，更像历史上的消费硬件降价周期，而不是传统企业软件护城河。公司建立永磁电机、齿轮箱和结构连接件的本土供应链控制，将人形机器人硬件生产成本降低了一个数量级 [CM005,
              CM007]。这使公司得以在全球铺开数千个开发者平台，逐渐形成事实上的硬件标准，而竞争对手仍停留在低销量原型阶段 [CM008]。
            calloutType: insight
            claimRefs:
              - CM005
              - CM007
              - CM008
          - type: callout
            title: 工业软件与自主能力鸿沟
            body: >-
              Unitree 面临的核心市场障碍，是硬件可获得性与企业自主使用价值之间的鸿沟。学术和开发者账户贡献了超过 70%
              的人形机器人收入，但要扩展到数百万美元级工业经常性合同，公司还需要可靠的末端执行器操作、零人工干预的自主能力和功能安全合规 [CM011, CM012]。如果具身智能软件没有突破，硬件出货可能会在教育市场触顶
              [CM010, CM014]。
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 替代范式与竞争格局
        blocks:
          - type: paragraph
            body: >-
              Unitree Robotics 的竞争格局横跨三类市场：传统工业与科研机器人厂商、新兴西方人形机器人平台，以及中国本土具身智能竞争者（CP001, CP002）。在四足领域，Unitree 将 Go2 和 B2
              定价在 $1,600–$10,000，取得超过 60% 的全球销量份额，远低于售价约 $75,000 的 Boston Dynamics Spot（CP003, CP004, CP005）。
              在人形机器人领域，Tesla（Optimus）、Figure AI（Figure 02/03）、Boston Dynamics（Atlas）和 Agility
              Robotics（Digit）等西方同业主要瞄准企业仓储试点和汽车装配；其单台系统成本远超 $100,000，2025 年美国同业合计交付仍少于 500 台（CP002, CP006）。相比之下，Unitree
              2025 年交付超过 5,500 台人形机器人，取得全球领先的销量份额（CP001, CP006）。 AgiBot、UBTech Robotics、Fourier Intelligence 和 Xiaomi 的
              CyberOne 等本土厂商，是 Unitree 定价权最直接的威胁，因为它们同样利用珠江三角洲和长江流域的电子供应链（CP002, CP007）。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
