      - number: '1.2'
        title: 融资历程、所有权与公开上市
        blocks:
          - type: paragraph
            body: >-
              Unitree 在完成上市前经历了多轮机构融资，并于 2026 年 8 月 19 日登陆上海证券交易所科创板 [CO007]。早期投资者包括 Sequoia Capital China（2019 年 12 月领投
              Pre-A）、Shunwei Capital（2021 年领投 Series A），以及 Shenzhen Capital Group 与 Matrix Partners China（2022 年 4 月完成
              Series B）[CO008]。 2024 年 2 月，Meituan 领投 10 亿元人民币（约 1B RMB，$139 million）的 Series B2；随后 2024 年 9
              月完成一笔追加融资，2025 年 6 月又完成 Series C。Tencent、Alibaba Group、Ant Group、Geely Capital 和 China Mobile Capital
              等企业及战略投资者参与，投后估值为 $2 billion [CO008]。 2026 年 8 月 19 日，Unitree 成为首家在中国大陆上市的通用人形机器人厂商，发行 40.45 million
              股（约占扩大后股本的 10%），发行价为 150.80 元 [CO009]。散户认购超过八千次，股价首日上涨逾 460%，收盘报 845 元，盘中一度触及 1,100 元 [CO009]。表 TO003
              展示了公众投资者和主要利益相关方。
            claimRefs:
              - CO007
              - CO008
              - CO009
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO007
              - CO008
      - number: '1.3'
        title: 运营规模、产品组合与商业化进展
        blocks:
          - type: paragraph
            body: >-
              Unitree 围绕两大产品支柱运营：四足机器人和通用双足人形机器人 [CO010]。在四足领域，公司通过 Go 系列（Go1、Go2）以及工业级平台（B1、B2、A1、A2），把消费级和工业级四足运动产品化
              [CO011]。在人形机器人领域，Unitree 从 2023—2024 年的早期 H1 原型机加速推进量产，形成 G1（$13,500–$16,000）、教育/消费级 R1（$4,900–$5,566）和旗舰
              H2（$30,000–$68,900）产品，后者搭载最高 2,070 TOPS 的板载算力 [CO010]。2025 年，公司披露收入为 RMB 1.699B（约 $240M）、净利润为 RMB 278M，并交付
              5,511 台人形机器人 [CO012]。但上市文件显示，2025 年初人形机器人收入约 73.6% 来自高校、学术机构和研究开发者，而非持续运营的工业客户 [CO013]。表 TO001
              汇总了核心运营指标和估值指标。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO001
            claimRefs:
              - CO007
              - CO009
              - CO012
              - CO013
      - number: '1.4'
        title: 里程碑演进、负面审查与地缘政治逆风
        blocks:
          - type: paragraph
            body: >-
              Unitree 用十年时间从学生原型成长为上市机器人厂商，期间借助病毒式传播的公开演示，包括 2021 年和 2026 年中国春节联欢晚会上的表演
              [CO014]。与此同时，公司面临不断加剧的地缘政治和网络安全挑战 [CO015]。2025 年 4 月，网络安全研究人员发现影响 Go1 和 Go2 的云基础设施漏洞及远程后门风险，Unitree
              随后终止了存在漏洞的云服务 [CO015]。2025 年 9 月的后续披露指出，G1 人形机器人存在未告知用户的多模态传感器采集，Go2 和 G1 平台还存在基于 BLE 的近距离攻击漏洞 [CO015]。
              此外，在国际视频显示搭载武器的四足平台参与军事演习后，美国众议院对华特别委员会于 2025 年 5 月向监管机构提出申请；美国国防部则于 2026 年 6 月将 Unitree 列入涉华军事关联企业名单
              [CO016]。图 FO001 展示了战略、技术和监管事件的时间线。
            claimRefs:
              - CO014
              - CO015
              - CO016
