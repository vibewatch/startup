  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序与投资门槛
        blocks:
          - type: paragraph
            body: >-
              风险层级首先是网络物理安全，因为 Unitree 机器人同时具备移动能力、摄像头、LiDAR、麦克风和无线连接。美国众议院听证记录和 TIME
              都描述过可能暴露传感器数据或允许远程控制的漏洞；据报道，Unitree 的缓解措施是关闭受影响的云服务并由管理层作出保证，而不是接受独立审计。政策暴露与安全风险同级：公开来源显示美国审查很严，但无法持续确认当前的
              Section 1260H 或采购地位。商业执行是下一项投资逻辑风险，因为 TIME 报道直接面向工业应用的销售仅占 9%，并称 2026
              年第一季度在研发和销售费用上升后，调整后利润腰斩。这些不是精确的失败概率，而是按证据排序的风险暴露，需要可监测的收口条件。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR013
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR008
              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: 网络物理、质量与安全暴露
        blocks:
          - type: paragraph
            body: >-
              连接能力会把软件缺陷变成潜在的物理事件。公开记录描述了对位置和实时摄像头数据的访问、远程控制，以及在附近机器人之间传播的可能性；同一移动平台被用于巡检，并搭载可绘制运营环境的传感器。Unitree 的 G1
              文档也要求用户保持安全距离、谨慎操作并了解人形机器人的局限。产品支持同样需要纳入投资评估：页面列出约 2 小时电池续航，G1 和 G1 EDU 的保修期分别为 8 个月和 18
              个月，但指定证据没有披露机群故障率、保修索赔、人员受伤、召回或补丁支持时长。因此，采购决策应要求按型号和固件进行渗透测试、网络分段、本地数据控制、事故披露，并证明在失去连接时安全措施仍然有效。
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR009
              - CR014
      - number: '7.3'
        title: 监管、法律与市场准入不确定性
        blocks:
          - type: paragraph
            body: >-
              2026 年 3 月的众议院听证表明，Unitree 已成为明确的政策对象，而非泛泛的中国风险代理。相关记录称，Unitree 2 月曾短暂列入 Section 1260H 名单，后在更新中被移除；指定的
              Wikipedia 页面则称其 6 月再次被列入。两组来源都没有提供当前有效的正式认定、Federal Register
              通知、采购规则、出口管制处理方式，或完整的诉讼与执法案卷。在把美国销售视为可持续业务前，必须通过法律顾问和政府一手记录解决这一时间线矛盾。另有一篇信誉较低的商业文章称 Unitree 2025 年收入的 44%
              来自海外市场，并提示贸易限制；这一比例应先核实，不应当作经审计的集中度指标。
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: 执行、财务模型与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Unitree 的纵向整合只是部分缓解措施，不等于供应韧性已获证明。公司称其内部开发了电机、减速器、控制器和部分传感器，但公开材料没有披露电池、计算模块、半导体或代工生产的集中度。需求质量同样尚未验证：TIME
              报道的销售组合仍偏向大学、研究机构和个人开发者；通用人形机器人在日常工厂和仓库工作中的效率，据报道仅为人类的 30%–50%。与此同时，TIME 报道 2026 年第一季度收入增长超过
              68%，但随着研发和销售成本上升，调整后净利润腰斩至 $6 million。如果独立证据无法证明生产部署增加、现场可靠性可接受、零部件供应有韧性、单位经济性改善且不依赖持续外部资本，就应暂停投资逻辑。
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR010
              - CR015
              - CR016
      - number: '7.5'
        title: 案例
        blocks:
          - type: callout
            title: 安全问题收口是融资条件
            body: 应把按型号和固件进行的独立渗透测试、经验证的遥测控制和有记录的补丁采用率，作为交割条件，而不是投后收尾工作。
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR014
          - type: callout
            title: 用投资逻辑破裂触发器，而非无依据的概率
            body: 如果具有约束力的市场限制生效、安全修复未通过独立测试、工业客户队列没有进展、关键部件仍未缓解，或利润压力在没有经审计单位经济性的情况下持续，就应暂停投资或重新定价。
            calloutType: recommendation
            claimRefs:
              - CR008
              - CR013
              - CR015
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 决策与入场纪律
        blocks:
          - type: paragraph
            body: >-
              当前判断为继续研究，置信度中低，风险高。这不是否定 Unitree 的产品地位，而是不接受相互不一致的二手估值资料作为可执行的决策价格。KraneShares 给出的目标约为 $9
              billion，并暗示市销率处于 30 多倍高位；TIME 则称 3 月文件对应估值为 $6 billion。同一组资料称公司计划至少发行 40.45 million 股新股并募资约 CNY 6.1
              billion，但没有提供最终发行价、当前交易价格、发行后股本、期权、优先权、债务或净现金。因此，形成股票回报情景前，必须先取得一手招股说明书、股权结构表和经审计账目。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: figure
