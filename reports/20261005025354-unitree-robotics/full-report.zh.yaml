      - number: '3.2'
        title: 能力、定价与产品组合比较
        blocks:
          - type: paragraph
            body: >-
              Unitree 的首要竞争优势，是通过内部硬件设计大幅优化物料清单，估计制造成本比西方机器人开发商低 75%（CP004, CP007,
              CP008）。公司自研永磁同步电机（PMSM）执行器、行星减速器和高精度传感器，将次紧凑型 R1 人形机器人定价在 $4,290–$4,900，旗舰 G1 起售价为 $13,500（CP004, CP005,
              CP008）。Boston Dynamics 的 Spot 仍约为 $75,000；ANYbotics 的商用轮式或履带式四足替代产品则为 $50,000–$150,000（CP004, CP005）。
              Unitree G1 提供 23–43 个自由度，膝关节扭矩为 90 N.m–120 N.m，但每只手臂的负载约只有 2–3 kg，轻量电池续航约 2 小时，落后于重型工业操作系统（CP008,
              CP009）。此外，Unitree 2025 年人形机器人实际售价均值为 157,818
              元（$23,380），原因是研究开发套装拉高了成交价；不过其零售价仍让双足平台进入高校和实验室的可支配预算，无需经历漫长的企业采购周期（CP001, CP005）。
