              - CV010
              - CV011
              - CV012
              - CV016
      - number: '8.2'
        title: 支持溢价的证据及其边界
        blocks:
          - type: paragraph
            body: >-
              有可信证据支持相对于无差异机器人硬件给予溢价。一份二手来源称 2025 年收入为 CNY 1.71 billion，同比增长 335%；Wikipedia 列出的 2025 年净利润为 CNY 288
              million。TIME 报道 2025 年发出超过 5,500 台人形机器人；Unitree 自有页面展示了从 $4,900 的 R1 到 $13,500 的 G1
              的产品梯度，以及内部开发的电机、减速器、控制器和传感器。公司还同时销售电力巡检方案和可协调数百台机器人的数据与训练平台。这些信号支持规模、成本控制和平台选择权，但不能替代经审计的分部经济性，也不能证明工业客户会续约并扩大部署。
            claimRefs:
              - CV003
              - CV004
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: 反向逻辑与下行风险
        blocks:
          - type: paragraph
            body: >-
              反向逻辑关注的是商业化质量，而不是技术可见性不足。TIME 报道，74% 的人形机器人销售流向大学、研究机构和个人开发者，工业应用占 9%，商业场所占
              17%。报道还称，当前人形机器人在一般工厂和仓储工作中的效率约为人类的 30%–50%。短期动能喜忧参半：据报道，第一季度收入增长超过 68% 至 $62 million，但研发和销售成本上升，调整后净利润腰斩至
              $6 million。若市销率处于 30 多倍高位，工业转化放缓、成本继续增长、安全或网络安全受挫、出口限制，或公开市场估值倍数重置，都几乎没有容错空间。
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV005
      - number: '8.4'
        title: 情景、退出准备度与最终尽调
        blocks:
          - type: paragraph
            body: >-
              由于证据池不支持完全摊薄后的绝对估值，情景框架采用相对市销率区间。乐观情景要求公司靠持续的三位数增长、稳定盈利和向生产型工业部署的实质转移，兑现 30
              多倍高位的估值倍数。基准情景采用报道中的十几倍同业估值群，同时假设增长正常化、研究驱动需求仍然重要。悲观情景低于该估值群，在现金、债务、稀释和客户集中度披露前，不设可辩护的估值底线。已披露的科创板流程是退出准备度信号，但不是流动性或投资者可实现回报的证明。最终尽调应将
              $6 billion 与 $9 billion 两个估值对照一手文件，并检验收入质量、利润率、营运资本、保修风险和工业客户队列留存。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
