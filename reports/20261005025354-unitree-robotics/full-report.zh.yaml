      - number: '1.5'
        title: 案例
        blocks:
          - type: callout
            title: 成本工程是首要颠覆性护城河
            body: >-
              Unitree 的竞争差异化来自制造经济性，而不是未经辅助的人工智能突破。公司自研电动关节执行器、PMSM、电机减速器和传感模块，将四足机器人零售价压到 $2,000 以下，人形机器人压到
              $13,500–$16,000 [CO010, CO011]。这种结构性成本效率帮助 Unitree 在 2025 年占全球人形机器人出货量超过 25%，同时保持盈利 [CO012]。
            calloutType: insight
            claimRefs:
              - CO010
              - CO011
              - CO012
          - type: callout
            title: 地缘政治与客户集中度双重暴露
            body: >-
              尽管上海科创板带来强烈的公开市场热情，Unitree 仍有两项结构性脆弱点。第一，73.6% 的人形机器人销售仍集中在研究机构，而非自主工业工作流 [CO013]。第二，美国监管审查涵盖网络安全漏洞报告，以及
              2026 年 6 月被列入国防部军事关联企业名单，这威胁公司在北美和欧洲的海外分销 [CO015, CO016]。
            calloutType: risk
            claimRefs:
              - CO013
              - CO015
              - CO016
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场格局、分类与可服务需求
        blocks:
          - type: paragraph
            body: >-
              腿式机器人市场分为三个清晰的细分领域：用于工业巡检的商用四足机器人、高性能通用双足人形机器人，以及轻量级消费或教育平台 [CM001]。B2、Boston Dynamics 的 Spot
              等商用四足机器人已服务于电力变电站、矿场和化工厂的工业巡检，用来替代危险环境中的人工巡检团队 [CM002]。相比之下，通用人形机器人仍处于从学术实验室走向结构化工业试点的早期阶段
              [CM003]。RoboStrategy IPO 资料汇总的行业预测显示，全球人形机器人总可用市场（TAM）可能在 2035 年扩大至 $38
              billion；商用四足机器人和早期工业人形机器人的可服务市场（SAM）预计到 2027 年达到 $3.2 billion [CM004]。表 TM001 详列了客户分类、部署标准和各细分市场的可服务支出。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
      - number: '2.2'
        title: 市场定位、价格弹性与竞争护城河
        blocks:
          - type: paragraph
            body: >-
              Unitree 依靠激进定价和自研零部件制造建立差异化，打破了长期由低销量、高成本研究原型主导的行业 [CM005]。Boston Dynamics 以售价超过 $75,000 的液压 Spot
              打开四足机器人市场，证明了工业巡检可行，但也限制了更广泛的采用 [CM006]。Unitree 先以 $2,700 推出 Go1，再以低于 $2,000 的价格推出 Go2，随后量产售价
              $13,500–$16,000 的 G1 人形机器人，把四足运动做成了更具商品属性的产品 [CM005, CM007]。2025 年，Unitree 交付超过 5,500 台人形机器人，在这个新兴市场占据超过
              25% 的全球销量 [CM008]。这一硬件成本护城河来自对自研永磁同步电机、谐波减速器和传感计算板的纵向整合，使公司在 2025 年实现净利润为正 [CM009]。表 TM002
              汇总了市场规模测算、可服务市场指标和披露收入基准。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM008
              - CM009
              - CM011
      - number: '2.3'
        title: 客户采用动态、市场摩擦与结构性逆风
        blocks:
          - type: paragraph
            body: >-
              尽管硬件出货量创纪录，Unitree 的商业扩张仍受到明显市场摩擦和买方采用障碍的制约 [CM010]。行业数据表明，2025 年初约 73.6%
              的人形机器人收入来自学术机构、机器人研究人员和企业评估项目，而不是持续运行的工业工厂部署 [CM011]。工业企业客户需要多班次电池可靠性、企业级机群编排软件、稳健的末端执行器，以及严格的功能安全认证
              [CM012]。地缘政治审查升级也带来跨境市场壁垒：四足机器人参加国防演习的视频曝光后，美国国会调查最终促使国防部于 2026 年 6 月将 Unitree 列入涉华军事关联企业名单 [CM013]。
              与此同时，Fourier Intelligence、Agility Robotics 和 UBTech 等中国及海外机器人厂商正在加快汽车装配等工业试验，进一步加剧价格竞争 [CM014]。表 TM003
              映射了买方工作流、经济付款方和采购触发因素，图 FM001 则呈现分层市场规模模型。
            claimRefs:
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
