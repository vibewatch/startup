  - id: FE001
    title: Unitree Robotics 全栈产品与技术架构
    type: stack
    summary: 涵盖物理机电硬件、嵌入式感知算力、运动控制中间件和具身 AI 学习框架的分层技术架构。
    data:
      layers:
        - label: 应用与部署层
          detail: 覆盖工业巡检、远程操作、学术研究和消费者互动的终端应用。
        - label: 具身 AI 与软件栈
          detail: 开源机器人中间件、基础模型（UnifoLM-WLA 6B）以及 Isaac Lab/MuJoCo 仿真 环境。
        - label: 算力与感知处理
          detail: 双算力架构：专用实时运动控制器与 NVIDIA Jetson Orin NX / Thor 高性能边缘 AI 模块并行。
        - label: 感知与反馈子系统
          detail: Livox MID360 3D LiDAR、Intel RealSense 深度摄像头、双关节编码器和指尖触觉传感器 阵列。
        - label: 执行与电源硬件
          detail: 自研 PMSM 空心轴无刷关节电机（90-360 N.m）、摆线减速器和快拆 9000 mAh 电池组。
        - label: 结构与环境机体
          detail: 6061-T6/7075-T6 铝合金骨架、IP67/IP68 防护密封和可更换高弹性 橡胶脚垫。
    approximationNotes: 结构分层反映 G1、B1 及 GitHub 开发者技术文档所记录的硬件与软件 解耦。
    claimRefs:
      - CE005
      - CE006
      - CE009
      - CE010
      - CE011
  - id: FU001
    title: Unitree 客户旅程与商业扩张生命周期
    type: journey-map
    summary: 展示客户从开发者发现到商业部署障碍的推进路径。
    data:
      items:
        - label: 发现与评估
          stage: 发现与评估
          actor: 学术实验室与开发者
          action: Evaluate accessible hardware via viral media and open GitHub SDK repositories
          touchpoints:
            - 电商门户（shop.unitree.com）
            - 开放 ROS2 GitHub 仓库
            - 学术论文引用
          sentiment: Positive
        - label: 硬件采购
          stage: 硬件采购
          actor: 大学与企业买方
          action: Direct transactional purchase of Go2 ($1.6K-$8.5K) or G1 ($13.5K-$16K)
          touchpoints:
            - 直接在线结账
            - 分销商进口渠道
            - 机构采购资助
          sentiment: Positive
        - label: 开发与研究
          stage: 开发与研究
          actor: 机器人工程师与首席研究员
          action: Train RL locomotion policies and test multimodal AI perception models
          touchpoints:
            - 本地开发环境
            - 仿真到现实工作流
            - 社区论坛
          sentiment: Neutral
        - label: 企业试验与试点
          stage: 企业试验与试点
          actor: 工业自动化负责人
          action: Pilot B2 quadrupeds and G1 humanoids in warehouse or inspection environments
          touchpoints:
            - 工厂现场测试单元
            - 定制载荷集成
            - 人工远程操作控制台
          sentiment: Neutral
        - label: 商业扩张障碍
          stage: 商业扩张障碍
          actor: 采购与安全负责人
          action: Confront 30-50% human efficiency gap, cybersecurity scrutiny, and DoD restrictions
          touchpoints:
            - 企业供应商安全审查
            - 美国出口 / 国防合规审查
            - 总拥有成本评估
          sentiment: Negative
        - label: 机群更新与服务
          stage: 机群更新与服务
          actor: 长期运营方
          action: Seek ongoing spare parts, battery replacement, and software maintenance
          touchpoints:
            - 硬件保修索赔
            - 本地集成商支持
            - 固件安全更新
          sentiment: Negative
    approximationNotes: 旅程触点和摩擦阶段综合自用户社区文档、学术采用模式及企业采购 障碍。
    claimRefs:
      - CU001
      - CU004
      - CU007
      - CU008
      - CU011
      - CU013
      - CU014
  - id: FR001
    title: 投资逻辑破裂触发矩阵
    type: matrix
    summary: 将按证据排序的风险映射到缓释成熟度及可监测条件，这些条件可能暂停或打破 投资逻辑。
    data:
      columns:
        - label: 影响
        - label: 基于证据的可能性信号
        - label: 缓释成熟度
        - label: 投资逻辑破裂触发因素
      rows:
        - label: 网络安全与遥测
          values:
            - label: 严重
              detail: 一旦被攻破，可能暴露数据并带来实体控制风险。
            - label: 据报道存在漏洞
              detail: 众议院听证会和 TIME 描述了远程访问或传感器数据暴露问题。
            - label: 未经验证
              detail: 据报道，服务已关闭且管理层作出保证，但没有独立复测证据。
            - label: 独立复测失败
              detail: 如果当前型号或受支持的固件仍保留未授权访问、失控遥测或在整个机群中传播的能力，应暂停推进。
        - label: 美国政策与采购
          values:
            - label: 严重
              detail: 具有约束力的限制可能让政府和敏感基础设施需求消失。
            - label: 持续审查
              detail: 已点名的众议院听证会和不断变化的认定报告，说明政策层面正在关注。
            - label: 尚不明确
              detail: 现行认定及其对采购的适用性，现有证据尚未厘清。
            - label: 具有约束力且无替代方案的限制
              detail: 如果目标客户在法律上无法采购或运营相关系统，应暂停推进。
        - label: 实体安全与可靠性
          values:
            - label: 高
              detail: 高扭矩移动系统在人员和设备附近运行。
            - label: 公司警示
              detail: G1 文档要求用户保持距离并谨慎操作。
            - label: 部分有记录
              detail: 已发布的警示和规格缺少机群事故及故障率证据。
            - label: 安全论证或保险方拒绝
              detail: 如果独立测试或保险尽调无法验证运行边界，应停止部署。
        - label: 工业商业化
          values:
            - label: 高
              detail: 转化疲弱会让需求继续集中在研究和演示场景。
            - label: 早期结构
              detail: TIME 报道，工业销售占 9%，研究机构和开发者销售占 74%。
            - label: 早期
              detail: 尚未提供生产队列留存或任务经济性证据。
            - label: 队列没有进展
              detail: 如果在尽调期内生产部署、正常运行时间或任务经济性没有改善，应暂停推进。
        - label: 供应商与零部件韧性
          values:
            - label: 高
              detail: 算力、电池或传感器供应中断，可能让发货和服务停摆。
            - label: 集中度未知
              detail: 公司披露了内部零部件开发，但没有披露外部供应商占比。
            - label: 部分缓解
              detail: 垂直整合有所帮助，但不能证明存在双重供应或明确的替代周期。
            - label: 未缓解的单一来源
              detail: 如果关键受控零部件没有合格替代品和充足库存，应暂停推进。
        - label: 财务模型韧性
          values:
            - label: 高
              detail: 不断上升的研发和销售成本可能吞噬增长。
            - label: 据报道利润承压
              detail: TIME 报道，Q1 2026 调整后净利润减半，但收入仍在增长。
            - label: Unknown
              detail: 缺少经审计的利润率、烧钱速度、营运资金和现金跑道数据。
            - label: 持续恶化
              detail: 如果利润和现金转化恶化，且没有经验证的工业队列经济性，应重新评估。
    approximationNotes: 序数标签综合了所引用的公开证据和证据缺口；它们不是数值概率、预测，也不是经独立审计的风险评分。
    claimRefs:
      - CR005
      - CR008
      - CR013
      - CR015
      - CR016
  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 规模和产品证据足以支持继续关注，但商业化和估值证据缺口让分析只能停留在继续研究。
    data:
      nodes:
        - id: scale
          label: 据报道的规模
          detail: 2025 年发出的人形机器人超过 5,500 台
        - id: growth
          label: 增长证据
          detail: 据报道，第一季度收入比上年同期高出 68% 以上
        - id: earnings
          label: 盈利承压
          detail: 据报道，第一季度调整后净利润减半
        - id: adoption
          label: 采用约束
          detail: 据报道，人形机器人销售中仅 9% 用于工业应用
        - id: readiness
          label: 技术约束
          detail: 据报道，通用工厂和仓库的效率仍只有人类表现的 30% 至 50%
        - id: decision
          label: 继续研究
          detail: 定价前，需要核对估值、资本结构、经审计的经济性数据和工业客户留存
    approximationNotes: 这里只呈现按顺序排列的定性逻辑；节点顺序不代表概率、转化率或数值尺度。
    claimRefs:
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV016
