chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司身份、创立与领导层
        blocks:
          - type: paragraph
            body: >-
              Unitree Robotics（官方名称为杭州宇树科技有限公司）由机器人专家王兴兴于 2016 年 8 月 26 日在浙江杭州创立 [CO001]。王兴兴 2013—2016
              年在上海大学读研期间开始研发新型四足运动，并设计出电机驱动的 XDog 原型机 [CO002]。不同于 Boston Dynamics
              推广的昂贵液压系统，他采用商用永磁同步电机（PMSM）和自研控制驱动系统，以更低成本实现灵活运动 [CO003]。在引发媒体关注并短暂任职于无人机厂商 DJI 后，他离职创业，并获得天使投资人 2 million
              RMB（$300,000）支持 [CO004]。王兴兴兼任创始人、首席执行官、首席技术官和董事长，估计持有约三分之一股权
              [CO005]。核心管理层高度依赖单一创始人：王兴兴负责核心架构、执行机构和公司战略，公开资料没有披露其他联合创始人或独立董事会委员会 [CO006]。表 TO002 汇总了公司的运营基础和领导结构。
            claimRefs:
