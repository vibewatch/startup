              Unitree 的计算和自主架构，将模块化嵌入式边缘处理器与开源机器人学习库、多模态传感结合起来。G1 头部集成 Intel RealSense D435i 深度相机和 Livox-MID360
              全向激光雷达，水平视场 360 度、垂直视场 59 度；工作负载则由专用自研运动控制单元和开放给开发者的二级计算单元分担，后者搭载 NVIDIA Jetson Orin NX，也可选配提供 2070 TFLOPS
