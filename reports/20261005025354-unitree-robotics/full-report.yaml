      - number: '6.2'
        title: Adoption Trajectory and Deployment Proof
        blocks:
          - type: paragraph
            body: >-
              The adoption velocity of Unitree hardware has been powered by dramatic hardware cost deflation, moving
              from early quadruped iterations to shipping over 170,000 Go-series units globally and more than 5,500
              humanoid units in 2025 alone. The company's open SDK policy, ROS2 compatibility, and accessible retail
              pricing have fostered an active developer community exceeding 30,000 members, making Unitree quadrupeds
              the most cited commercial legged platform in published academic robotics literature. Nevertheless, named
              commercial deployments remain largely experimental: industrial inspection quadrupeds operate in utility
              and power system pilots, while humanoids operate under strict duration and payload limits, performing
              choreographed demonstrations or short-duration warehouse tasks rather than sustained autonomous shifts.
            claimRefs:
              - CU005
              - CU006
