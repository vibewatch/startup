              - CU015
      - number: '6.3'
        title: Retention Durability, Geopolitical Barriers, and Procurement Friction
        blocks:
          - type: paragraph
            body: >-
              Unitree faces significant structural hurdles in transitioning from transactional hardware box-sales to
              recurring high-retention software or service revenue. Because the company does not disclose net revenue
              retention, cohort churn, or contract renewal rates, customer lifetime value remains unverified.
              Furthermore, procurement friction has escalated sharply in Western markets: the United States Department
              of Defense added Unitree to its list of Chinese military-linked companies in June 2026 following
              legislative scrutiny and third-party military testing of armed Go1 platforms, while published
              cybersecurity research identified remote-access and wormable wireless vulnerabilities across both
              quadruped and humanoid fleets. These headwinds threaten Unitree's international sales footprint, which
              historically represented up to half of overall corporate volume.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Educational and Research Concentration Paradox
            body: >-
              Unitree's volume leadership in humanoid robotics is undisputed, but over 73% of humanoid revenue is
              derived from academic, university, and independent developer customers rather than industrial automation
              workflows. While this seeds future developer ecosystems, academic grant-funded hardware purchases are
              non-recurring and expose the company to market saturation until real-world industrial task generalization
              is achieved.
            calloutType: insight
            claimRefs:
              - CU002
              - CU003
              - CU008
          - type: callout
            title: Western Market Procurement and Security Exclusion
            body: >-
              Designation on the U.S. Department of Defense list of Chinese military-linked companies in June 2026,
              paired with documented BLE and remote-access vulnerabilities across Go2 and G1 fleets, creates severe
              procurement barriers among North American and European corporate enterprise buyers, constraining long-term
              commercial expansion.
            calloutType: risk
            claimRefs:
              - CU013
              - CU014
              - CU015
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture and investment gates
        blocks:
          - type: paragraph
            body: >-
              The risk hierarchy starts with cyber-physical compromise because Unitree robots combine mobility with
              cameras, LiDAR, microphones, and wireless connectivity. A U.S. House hearing record and TIME both
              described vulnerabilities capable of exposing sensor data or enabling remote control, while Unitree's
              mitigation is reported through a shutdown of the affected cloud service and management assurances rather
              than an independent audit. Policy exposure ranks alongside security: public sources show intense U.S.
              scrutiny but do not consistently establish the current Section 1260H or procurement position. Commercial
              execution is the next thesis risk because TIME reported only 9% of sales going directly to industrial
              applications and also reported first-quarter 2026 adjusted profit halving as R&D and sales costs rose.
              These are not precise failure probabilities; they are evidence-ranked exposures that require monitorable
              closing conditions.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR008
              - CR013
              - CR014
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR005
              - CR008
              - CR013
              - CR015
              - CR016
      - number: '7.2'
        title: Cyber-physical, quality, and safety exposure
        blocks:
          - type: paragraph
            body: >-
              Connectivity turns a software defect into a potential physical event. The public record describes access
              to location and live-camera data, remote control, and possible propagation between nearby robots; the same
              mobile platform is sold for inspection and carries sensors that can map operating environments. Unitree's
              G1 documentation itself asks users to maintain a safe distance, use caution, and understand humanoid
              limitations. Product support also deserves underwriting: the page lists about two hours of battery life
              and warranties of eight months for G1 and 18 months for G1 EDU, but the assigned evidence does not
              disclose fleet failure rates, warranty claims, injuries, recalls, or patch-support duration. A purchase
              decision should therefore require model- and firmware-specific penetration testing, network segmentation,
              local data controls, incident disclosure, and evidence that safeguards remain effective under loss of
              connectivity.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR009
              - CR014
      - number: '7.3'
        title: Regulatory, legal, and market-access uncertainty
        blocks:
          - type: paragraph
            body: >-
              The March 2026 House hearing shows that Unitree has become a named policy subject rather than a generic
              China-risk proxy. Its record says Unitree was briefly placed on a Section 1260H list in February before
              the update was removed, while the assigned Wikipedia page reports a June addition. Neither source set
              supplies the current controlling designation, Federal Register notice, procurement rule, export-control
              treatment, or a complete docket of litigation and enforcement. This temporal inconsistency must be
              resolved through counsel and primary government records before treating U.S. sales as durable. A
              low-reputation commercial article separately reports 44% of 2025 revenue from overseas markets and flags
              trade restrictions, so the magnitude should be verified rather than used as an audited concentration
              metric.
            claimRefs:
              - CR001
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.4'
        title: Execution, financial-model, and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Unitree's vertical integration is a partial mitigation, not proof of supply resilience. The company says
              it developed motors, reducers, controllers, and some sensors internally, but public materials do not
              disclose concentration for batteries, compute modules, semiconductors, or contract manufacturing. Demand
              quality is also unproven: TIME's reported sales mix remains weighted toward universities, research
              institutions, and individual developers, while general-purpose humanoids were reported at only 30% to 50%
              of human efficiency for routine factory and warehouse work. At the same time, TIME reported first-quarter
              2026 revenue growth above 68% but adjusted net profit falling by half to $6 million as R&D and selling
              costs increased. The investment case should be paused if independent evidence cannot show rising
              production deployment, acceptable field reliability, resilient component sourcing, and improving unit
              economics without persistent external capital.
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR007
              - CR008
              - CR010
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Security closure is a financing condition
            body: >-
              Treat a model- and firmware-specific independent penetration test, verified telemetry controls, and
              documented patch adoption as closing conditions, not post-investment housekeeping.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR014
          - type: callout
            title: Use thesis-break triggers instead of unsupported probabilities
            body: >-
              Pause or reprice if binding market restrictions apply, security remediation fails independent testing,
              industrial cohorts do not progress, a critical component remains unmitigated, or profit pressure persists
              without audited unit economics.
            calloutType: recommendation
            claimRefs:
              - CR008
              - CR013
              - CR015
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Decision and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The current call is research-more, with medium-low confidence and high risk. This is not a negative
              judgment on Unitree's product position; it is a refusal to treat incompatible secondary valuation
              references as a decision-ready price. KraneShares described a roughly $9 billion target and a high-30s
              price-to-sales implication, while TIME described the March filing at $6 billion. The same pool says the
              company intended to issue at least 40.45 million new shares and raise about CNY 6.1 billion, but it does
              not provide the final offer price, current trading price, post-offer share count, options, preferences,
              debt, or net cash. Entry discipline therefore requires a primary prospectus, cap table, and audited
              accounts before converting the business thesis into an equity return case.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV007
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV016
      - number: '8.2'
        title: Evidence for a premium, with limits
        blocks:
          - type: paragraph
            body: >-
              There is credible evidence for considering a premium to undifferentiated robotics hardware. One secondary
              source reports CNY 1.71 billion of 2025 revenue and 335% year-over-year growth, while Wikipedia lists CNY
              288 million of 2025 net income. TIME reports more than 5,500 humanoid units dispatched in 2025, and
              Unitree's own pages show a product ladder from a $4,900 R1 to a $13,500 G1, plus internally developed
              motors, reducers, controllers, and sensors. The company also markets both power-inspection solutions and a
              data-and-training platform able to coordinate hundreds of robots. Those signals support scale, cost
              control, and platform optionality, but they are not substitutes for audited segment economics or evidence
              that industrial customers renew and expand deployments.
            claimRefs:
              - CV003
              - CV004
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Anti-thesis and downside
        blocks:
          - type: paragraph
            body: >-
              The anti-thesis is commercialization quality, not lack of technical visibility. TIME reports that 74% of
              humanoid sales went to universities, research institutions, and individual developers, versus 9% to
              industrial applications and 17% to commercial venues. It also says current humanoids perform at roughly
              30% to 50% of human efficiency for general factory and warehouse work. Near-term momentum is mixed:
              first-quarter revenue reportedly rose more than 68% to $62 million, yet adjusted net profit halved to $6
              million as research-and-development and selling costs increased. A high-30s sales multiple would leave
              little room for slower industrial conversion, continued cost growth, safety or security setbacks, export
              restrictions, or a public-market multiple reset.
            claimRefs:
              - CV008
              - CV009
              - CV011
              - CV012
              - CV005
      - number: '8.4'
        title: Scenarios, exit readiness, and final diligence
        blocks:
          - type: paragraph
            body: >-
              The scenario framework uses relative sales-multiple bands because the evidence pool does not support a
              fully diluted absolute valuation. The bull case requires the high-30s multiple to be earned through
              sustained triple-digit growth, durable profitability, and a material shift toward productive industrial
              deployments. The base case uses the reported mid-teens peer cluster while assuming growth normalizes and
              research-led demand remains important. The bear case is below that cluster, with no defensible floor until
              cash, debt, dilution, and customer concentration are disclosed. The reported STAR Market process is an
              exit-readiness signal, but not proof of liquidity or achievable investor returns. Final diligence should
              reconcile the $6 billion and $9 billion references against primary filings and test revenue quality,
              margins, working capital, warranty exposure, and industrial cohort retention.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
