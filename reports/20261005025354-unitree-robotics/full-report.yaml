  - id: TV003
    title: Bull, base, and bear valuation scenarios
    columns:
      - Scenario
      - Assumptions
      - Valuation range or logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Triple-digit growth persists; profitability is audited; industrial mix and repeat deployments rise materially
        - High-30s P/S target range described by KraneShares
        - Possible, but unsupported by primary filing evidence in the assigned pool
        - Growth decelerates or industrial conversion remains near the reported 9% mix
      - - Base
        - Growth normalizes; research demand remains important; margins absorb sustained R&D and sales investment
        - Mid-teens P/S cluster reported for comparable STAR and ChiNext robotics names
        - Most defensible relative anchor in the available evidence
        - Profit remains compressed or customer-quality evidence does not improve
      - - Bear
        - >-
          Commercialization stalls, multiple compression follows, or safety, security, policy, and dilution risks
          compound
        - Below mid-teens P/S; no supportable lower bound without audited balance-sheet and capitalization data
        - Material because current humanoid efficiency and industrial adoption remain limited
        - Failed industrial pilots, adverse regulation, a down-round-like repricing, or unexpected financing overhang
    notes: >-
      These are evidence-bounded relative scenarios, not price targets or probabilities. The pool lacks a verified
      current share price, fully diluted shares, audited net cash, preference terms, and transaction comparables needed
      for absolute equity-value or return ranges.
    claimRefs:
