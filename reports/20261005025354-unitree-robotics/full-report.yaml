        - >-
          Require safety cases, emergency-stop evidence, insured operating procedures, training, and site controls;
          residual exposure is unquantified.
        - Request injury, near-miss, warranty, recall, insurance, and product-liability records by model and geography.
      - - Export controls and overseas market access
        - >-
          Cross-border; a low-reputation commercial source reports 44% overseas revenue in 2025 and flags trade-policy
          exposure.
        - >-
          Material exposure is plausible, but the denominator and audited geographic mix are not available in the
          assigned evidence.
        - High
        - >-
          Screen products, components, customers, and destinations; residual exposure depends on verified geographic and
          component mix.
        - >-
          Reconcile audited revenue by country with export classifications, licenses, denied-party controls, and
          component-origin records.
    notes: >-
      Partial public-source enumeration as of 2026-10-05; severity reflects documented consequence and scrutiny, not an
      actuarial probability, and current legal status requires primary-record confirmation.
    enumerationScope:
      coverage: partial
      basis: >-
        Public regulatory, policy, safety, and market-access risks supported by the eight assigned prefetched sources;
        private claims and complete legal dockets are excluded.
    claimRefs:
      - CR001
      - CR002
      - CR004
      - CR010
      - CR011
      - CR012
      - CR013
      - CR014
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Evidence-based likelihood signal
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Unresolved gap
    rows:
      - - Remote access, sensor-data exposure, or fleet propagation
        - >-
          Reported in a House hearing record and TIME; affected models, versions, and fleet prevalence are not fully
          enumerated.
        - Critical
        - Cloud-service shutdown and management assurances are reported, but no independent closure evidence is present.
        - High
        - Model-level exploitability, patch adoption, telemetry defaults, and independent retest results.
      - - Physical contact or unsafe autonomous action
        - >-
          Unitree's own G1 page requires distance and caution; public reporting describes physical-risk incidents
          without a denominator.
        - High
        - >-
          Company cites hardware constraints and safety protections; certification and field validation are not
          supplied.
        - High
        - >-
          Near-miss and injury rates, emergency-stop performance, functional-safety certification, and
          operating-envelope tests.
      - - Generalization or task failure outside controlled settings
        - >-
          TIME reports 30%–50% of human efficiency for general factory and warehouse tasks and sharp success-rate drops
          after environmental changes.
        - High
        - >-
          Developer ecosystem and ongoing model work are visible, but repeatable production performance is not
          quantified.
        - High
        - Customer task success, intervention rate, uptime, cycle time, and total cost versus human or fixed automation.
      - - Battery, service-life, and support shortfall
        - >-
          G1 documentation lists about two hours of battery life and warranties of eight months or 18 months depending
          on model.
        - Medium
        - Published specifications set expectations, but fleet reliability and support-duration evidence is absent.
        - Medium-high
        - >-
          MTBF, battery degradation, repair turnaround, spare-parts availability, warranty claims, and end-of-support
          policy.
    notes: >-
      Likelihood cells report observed public signals rather than numeric probabilities; incident frequency,
      installed-base denominators, firmware coverage, and field reliability remain unavailable.
    claimRefs:
      - CR002
      - CR003
      - CR004
      - CR005
      - CR006
      - CR009
      - CR014
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty or role
      - Public concentration signal
      - Failure scenario
      - Severity
      - Mitigation and residual exposure
    rows:
      - - Policy-permitted access to overseas markets
        - Regulators, customs authorities, government buyers, and local distributors
        - A commercial article reports 44% overseas revenue in 2025; audited geography is unavailable.
        - Restrictions or customer exclusions reduce addressable demand or strand channel inventory.
        - High
        - >-
          Country-level compliance and channel diversification help, but exposure cannot be sized without audited
          revenue and distributor data.
      - - Critical compute, battery, and sensor inputs
        - Undisclosed semiconductor, battery, module, and manufacturing suppliers
        - >-
          Unitree claims internal development of several core parts; supplier shares and substitution times are not
          public.
        - Export controls, shortages, quality escapes, or single-source failure delay shipments and service.
        - High
        - Dual-source qualification and safety stock are diligence conditions; residual exposure is unknown.
      - - Research and developer demand
        - Universities, research institutions, and individual developers
        - TIME reports 74% of humanoid sales to these groups versus 9% directly to industrial applications.
        - Research demand fails to convert into recurring production deployments.
        - High
        - >-
          Track production cohorts, paid renewals, utilization, and service revenue; commercialization evidence remains
          limited.
      - - R&D and selling-cost absorption
        - Internal engineering organization, sales channels, and capital providers
        - >-
          TIME reports Q1 2026 revenue of $62 million, up over 68% year over year, while adjusted net profit halved to
          $6 million.
        - Development and sales spending outpace durable gross-profit expansion.
        - High
        - >-
          Require audited margins, cash flow, burn, and runway; residual financing need cannot be sized from assigned
          sources.
    notes: >-
      Public sources do not provide audited counterparty shares, supplier concentration, channel inventory, gross
      margin, cash burn, or runway; the reported overseas and demand-mix percentages retain their original periods and
      denominators.
    claimRefs:
      - CR007
      - CR008
      - CR010
      - CR015
      - CR016
  - id: TV001
    title: Recommendation summary
    columns:
      - Dimension
      - Assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Research more
        - Conflicting $6 billion and roughly $9 billion IPO valuation references
        - Do not underwrite an entry price until primary offer and capitalization data are reconciled
      - - Confidence
        - Medium-low
        - Revenue, profit, and shipment signals are reported, but audited statements are absent
