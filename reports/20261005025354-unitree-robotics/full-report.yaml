figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Chronological trajectory of Unitree Robotics from academic XDog prototyping in 2013 to commercial quadruped
      dominance, humanoid expansion, and its August 2026 Shanghai STAR Market IPO.
    data:
      items:
        - date: 2013-2016
          label: XDog Prototype Development
          detail: >-
            Wang Xingxing designs the electric-actuated XDog quadruped during postgraduate studies at Shanghai
            University.
          tone: neutral
        - date: '2016-08-26'
          label: Corporate Founding
          detail: Wang quits DJI and registers Hangzhou Yushu Technology Co., Ltd. with 2M RMB angel funding.
          tone: positive
        - date: '2017-09-01'
          label: Laikago Launch
          detail: Unitree releases Laikago, marking the company's first commercial-grade quadruped platform.
          tone: neutral
        - date: '2020-01-07'
          label: A1 Release at CES
          detail: A1 quadruped debuts at CES 2020 targeting educational and research robotics markets at 3.3 m/s.
          tone: positive
        - date: '2021-06-01'
          label: Go1 Consumer Quadruped
          detail: Unitree introduces the low-cost Go1 quadruped, initiating mass consumer adoption.
          tone: positive
        - date: '2024-04-01'
          label: H1 Humanoid Demonstration
          detail: Unitree releases technical demonstration footage of full-sized bipedal humanoid robot H1.
          tone: positive
        - date: '2024-08-01'
          label: G1 Humanoid Mass Production
          detail: Unitree announces mass production of the 1.27m G1 humanoid robot at an aggressive $16,000 price point.
          tone: positive
        - date: '2025-04-15'
          label: Cybersecurity Backdoor Allegations
          detail: >-
            Security researchers identify remote backdoor risks in Go1/Go2 cloud services; Unitree closes affected
            servers.
          tone: warning
        - date: '2025-06-30'
          label: Series C Funding at $2B Valuation
          detail: Closes Series C led by Tencent, Alibaba, Ant Group, and China Mobile Capital.
          tone: positive
        - date: '2025-10-15'
          label: H2 Humanoid Launch
          detail: Unveils flagship 1.8m H2 humanoid robot with 2,070 TOPS computing for industrial and advanced research.
          tone: positive
        - date: '2026-06-15'
          label: DoD Military-Linked Listing
          detail: U.S. Department of Defense places Unitree on its list of Chinese military-linked companies.
          tone: critical
        - date: '2026-08-19'
          label: Shanghai STAR Market IPO
          detail: Unitree lists on the SSE STAR Market (688836), opening 629% higher and closing up 460% at 845 RMB.
          tone: positive
    approximationNotes: Dates correspond to public press releases, academic publications, product launches, and regulatory announcements.
    claimRefs:
      - CO001
      - CO002
      - CO004
      - CO007
      - CO009
      - CO010
      - CO011
      - CO014
      - CO015
      - CO016
