  - id: TV002
    title: Thesis and anti-thesis
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Thesis — visible scale
        - More than 5,500 humanoid units reportedly dispatched in 2025
        - Audited shipment-to-revenue reconciliation and customer cohort data
      - - Thesis — cost and product breadth
        - $4,900 R1, $13,500 G1, internally developed core components, and industrial platform offerings
        - Verified gross margins by product and evidence of paid fleet expansion
      - - Anti-thesis — research-heavy demand
        - 74% research/developer mix versus 9% industrial applications
        - Industrial mix above research demand with repeat deployments and service revenue
      - - Anti-thesis — earnings sensitivity
        - First-quarter adjusted net profit reportedly halved despite more than 68% revenue growth
        - Audited evidence that operating leverage recovers without reducing product investment
