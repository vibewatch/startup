  - id: FE001
    title: Unitree Robotics Full-Stack Product and Technology Architecture
    type: stack
    summary: >-
      Layered technical architecture spanning physical electro-mechanical hardware, embedded sensory compute, motion
      control middleware, and embodied AI learning frameworks.
    data:
      layers:
        - label: Application & Deployment Layer
          detail: >-
            End-user applications spanning industrial inspection, teleoperation, academic research, and consumer
            interaction.
        - label: Embodied AI & Software Stack
          detail: >-
            Open-source robotics middleware, foundation models (UnifoLM-WLA 6B), and Isaac Lab/MuJoCo simulation
            environments.
        - label: Compute & Perception Processing
          detail: >-
            Dual-computing split: dedicated real-time motion controller alongside NVIDIA Jetson Orin NX / Thor
            high-performance edge AI modules.
        - label: Sensing & Feedback Subsystems
          detail: >-
            Livox MID360 3D LiDAR, Intel RealSense depth cameras, dual joint encoders, and tactile fingertip sensor
            arrays.
        - label: Actuation & Power Hardware
          detail: >-
            In-house PMSM hollow-shaft brushless joint motors (90-360 N.m), cycloidal reducers, and quick-release 9000
            mAh battery packs.
        - label: Structural & Environmental Chassis
          detail: >-
            6061-T6/7075-T6 aluminum alloy skeletal frame, IP67/IP68 ingress sealing, and replaceable high-elasticity
            rubber footpads.
    approximationNotes: >-
      Structural layers reflect the hardware and software decoupling documented in G1, B1, and GitHub developer
      technical documentation.
