callouts:
  - calloutType: "strength"
    title: "Structural Actuator Cost Leadership and In-House Supply Integration"
    body: "Unlike Western robotics peers that procure commercial off-the-shelf actuators and harmonic drives at premium pricing, Unitree designs and manufactures its own PMSM motors, cycloidal reducers, and sensory controllers. This vertical integration drives reported ~60% gross margins and enables consumer and research pricing tiers ($1,600 Go2, $13,500 G1) that competitors cannot match without incurring severe gross losses."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI005"
      - "CI006"
  - calloutType: "risk"
    title: "Heavy Revenue Concentration in Non-Industrial Academic Procurements"
    body: "Despite high public shipment numbers of 5,511 humanoid units in 2025, regulatory listing inquiry disclosures reveal that 73.6% of humanoid revenue originated from university research laboratories and academic institutions, with industrial enterprise applications accounting for only 9.0%. Academic sales represent non-recurring capital grant purchases rather than multi-year enterprise automation contracts."
    claimRefs:
      - "CI011"
      - "CI012"
      - "CI013"
