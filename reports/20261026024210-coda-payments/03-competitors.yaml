  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: Realized publisher pricing, take rates, incentives, and net savings versus app-store or gateway alternatives.
      whyItMatters: A promotional half-cost comparison cannot establish contribution margin, customer value capture, or price durability.
      diligencePath: Obtain a product-level pricing schedule and anonymized cohort economics for Codapay, Codashop, and Custom Commerce.
      relatedQuestionRefs: [QP005]
      relatedTableRefs: [TP003]
    - type: missing-source
      severity: material
      topic: moat-durability
      missingEvidence: Publisher renewal, churn, multi-homing, exclusivity, integration replacement cost, and customer concentration data.
      whyItMatters: These measures determine whether local integrations and distribution create lock-in or are readily commoditized.
      diligencePath: Request cohort retention, top-customer concentration, contract terms, and implementation timelines by product and geography.
      relatedQuestionRefs: [QP007]
    - type: enumeration-incomplete
      severity: minor
      topic: competitor-landscape
      missingEvidence: Comparable public evidence for global payment gateways, app stores, internal builds, and likely entrants.
      whyItMatters: The assigned pool supports named alternatives but not a complete market census or comparable pricing benchmark.
      diligencePath: Build a competitor data room covering PSPs, app-store direct billing, publisher webstores, and regional voucher marketplaces.
      relatedQuestionRefs: [QP001, QP003]
      relatedTableRefs: [TP001]
