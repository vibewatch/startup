    title: Regulated Singapore base
    body: "The MAS Major Payment Institution licence gives the Singapore entity an explicit regulatory foundation for merchant acquisition and domestic and cross-border transfers."
    claimRefs: [CO014]
  - calloutType: risk
    title: Financial visibility gap
    body: "The assigned current evidence does not establish revenue, ARR, margins, cash, debt, liquidity, or a refreshed valuation, limiting underwriting confidence despite the reported financing and scale."
    claimRefs: [CO009, CO012, CO013]
  - calloutType: assumption
    title: Leadership chronology requires reconciliation
    body: "Shane Happach is identified as CEO in the later licence release, while Insight’s 2022 account names Philippe Limes as CEO; the current leadership map should not be inferred without company confirmation."
    claimRefs: [CO005, CO007]

