company:
  name: Coda Payments
chapter:
  number: 1
  title: Company Overview
  summary: Coda Payments is a Singapore-headquartered digital-content monetization and payments platform founded in 2011. The refreshed evidence confirms a broad gaming-commerce product set, a Singapore Major Payment Institution licence, and material publisher, market, workforce, and funding disclosures, while combined financial performance, current valuation, and governance detail remain unavailable.
sections:
  - id: identity-and-platform
    title: Identity, headquarters, and operating model
    body: "Coda describes itself as a global digital-content monetization and distribution company headquartered in Singapore. Its operating model combines Codapay for direct publisher payments, Codashop as a consumer marketplace, customized webstores, distribution partnerships, and Merchant of Record services. The product logic is a two-sided network: publishers obtain local payment access and distribution while consumers obtain localized ways to buy digital content. This positioning is consistent across the investor description, the company-issued licence release, and the company’s product explainer, but most scale figures remain company- or investor-reported rather than audited."
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person exposure
    body: Public evidence identifies Shane Happach as chief executive officer and identifies Neil Davidson as executive chairman, Philippe Limes as CEO, and Paul Leishman as president in the 2022 investor account. The different CEO references are not reconciled by the assigned sources and therefore indicate a leadership-history question rather than a clean current org chart. Singapore remains the stated headquarters and a governance center, and the MPI licence places compliance, risk management, security, and operational resilience inside the operating model. A current board roster, ownership/control rights, succession plan, and executive tenure schedule were not disclosed in the retained sources.
    claimRefs: [CO005, CO006, CO007, CO008]
    tableRefs: [TO002]
  - id: financing-and-scale
    title: Funding, valuation, and operating scale
    body: The strongest financing evidence is a reported $690 million fundraise involving Insight Partners, Smash Capital, and GIC; the legal-adviser report corroborates the transaction and describes the investors advised. Insight’s contemporaneous account says the round was co-led by Insight and Smash with GIC and describes more than 100 million unique users and over one billion transactions at that time. The later company-issued licence release reports 550+ Codans, 300+ publishers, 400+ payment methods, and 70+ markets, while a later company release reports 600+ employees and 80+ markets. These are different reporting vintages and company claims; no retained source supplies current revenue, ARR, EBITDA, cash, liquidity, debt, or a refreshed valuation.
    claimRefs: [CO009, CO010, CO011, CO012, CO013]
  - id: milestones-and-open-diligence
    title: Milestones and unresolved diligence
    body: The evidence supports a milestone sequence from founding in 2011, regional scaling, the 2022 financing, the Recharge acquisition, the Singapore MPI licence, and the Unity integration for direct-to-consumer commerce. The licence is strategically material because it covers merchant acquisition and domestic and cross-border money transfers under Singapore’s Payment Services Act. The Unity relationship extends Coda’s infrastructure into a developer workflow and illustrates the direct-commerce expansion thesis. However, the assigned pool contains no primary financial statements, current cap table, detailed board materials, or adverse legal investigation; those remain explicit diligence gaps rather than assumptions.
    claimRefs: [CO014, CO015, CO016]
    tableRefs: [TO003]

