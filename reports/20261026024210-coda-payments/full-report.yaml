  - id: FI001
    title: Revenue-to-cash disclosure bridge
    type: flow
    summary: >-
      The evidence traces licensed payment activity through disclosed revenue categories to accounting and cash
      outcomes, while leaving transaction-level pricing and cost conversion unresolved.
    data:
      nodes:
        - id: licensed-rails
          label: Licensed payment rails
          value: Merchant acquisition and domestic/cross-border transfers
          detail: Regulatory scope is evidenced; activity mix and fees are not disclosed.
        - id: transaction-economics
          label: Transaction economics
          value: Not disclosed
          detail: Volume, average order value, take rate, refunds, and payment-method cost remain unavailable.
        - id: digital-monetisation
          label: Digital content monetisation
          value: $105.2m FY2024
          detail: Reported category revenue, down 8.7%; currency unspecified in the fetched article.
        - id: voucher-sales
          label: Voucher code sales
          value: $63.8m FY2024
          detail: Reported category revenue, up 16.4%; accounting treatment is not explained.
        - id: group-revenue
          label: Group revenue
          value: $167.8m FY2024
          detail: Accounting revenue, down from $169.3m; not ARR or GMV.
        - id: gross-profit
          label: Gross profit
