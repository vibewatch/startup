  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and value pools
        blocks:
          - type: paragraph
            body: >-
              The relevant market is publisher-side gaming commerce infrastructure and distribution: payment acceptance,
              merchant-of-record and compliance operations, direct-to-consumer webstores, player top-up marketplaces,
              and partner-led distribution. It is narrower than global game spending because it excludes game
              development, advertising unrelated to transaction conversion, console hardware, and the full value of
              games sold through platform-controlled billing. Coda's own description separates connectivity, compliance,
              and reach: its guide says a gaming gateway provides connectivity, an MoR provides compliance, and a
              marketplace provides reach. The practical substitute is therefore not only another gateway; it can be
              app-store billing, an incumbent wallet or top-up network, a publisher's internal stack, or a regional
              payment processor. This boundary matters for valuation because transaction volume can grow while platform
              fees, fraud, tax, partner commissions, and localization consume the gross opportunity.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: Sizing lenses and market momentum
        blocks:
          - type: paragraph
            body: >-
              Available evidence is directional rather than a complete market model. BCG's 2025 survey of 2,972
              respondents reports that mobile gaming represents 50% of global gaming revenues, while its industry
              analysis describes app stores opening to external distribution and developers seeking control of their own
              channels. Separately, Xsolla reports that D2C revenue grew 26% in 2025 while the overall mobile gaming
              market grew 0.2%, and that the top 100 mobile titles grew D2C earnings 38% year over year. These are
              competitor-published figures, not independent benchmarks, so they are useful as a directional adoption
              signal rather than as a Coda market-size estimate. Coda's 2024 group revenue of US$167.8 million and gross
              profit of US$43.4 million provide company scale, not a market denominator. Consequently, a precise Coda
              SAM or SOM remains an evidence gap: a defensible model needs publisher transaction volume, take rates,
              regional payment mix, and the share addressable through Coda's channels.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM012
      - number: '2.3'
        title: Buyers, users, payers, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is generally a game or digital-content publisher that owns monetization and wants
              incremental payer reach, direct customer relationships, or lower platform dependence. The operational
              users are payments, finance, tax, fraud, compliance, growth, and live-operations teams; the payer is the
              player using a locally familiar method. The buyer's adoption path can start with one market or title, then
              expand through localized methods, webstore or marketplace distribution, and merchant-of- record coverage.
              Coda's Unity integration illustrates a low-friction channel motion: developers can activate Coda in the
              Unity Dashboard and access more than 400 payment methods across 80-plus markets through one integration.
              An Impact case study reports that Coda's partner program targeted creators, influencers, publishers,
              telcos, e-wallets, and entertainment companies, with performance-based rewards in Indonesia, Malaysia,
              Brazil, and India. Those examples support a multi-stakeholder sale, but they do not disclose conversion,
              retention, or net revenue contribution by segment.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Drivers, constraints, and diligence implications
        blocks:
          - type: paragraph
            body: >-
              Demand is supported by persistent player engagement and by the economic case for owned commerce. BCG
              reports that 55% of surveyed gamers increased gaming time over the prior six months and that 75% said game
              prices affect purchase choices, implying both engagement and affordability sensitivity. The same report
              identifies cloud gaming, user-generated content, generative AI, and app-store opening as structural
              changes that can expand or redistribute value pools. The constraints are equally material: payment
              localization, fraud, tax, regulatory compliance, and discovery must work together; the Coda guide
              explicitly describes gaming transactions as high frequency, low value, fraud-targeted, and regionally
              diverse. Coda's full Singapore Major Payment Institution licence improves its regulatory position, but
              regulation is also an operating obligation rather than a moat by itself. The key diligence questions are
              product-level take rates, gross margins, payer concentration, channel cannibalization, chargeback
              economics, and whether D2C growth persists after app-store rules and publisher incentives normalize.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The investable market is infrastructure plus distribution
            body: >-
              Coda's opportunity is strongest where a publisher needs local payment access, compliance execution, and
              owned or partner distribution together; a generic gaming-spend TAM would overstate the addressable pool.
            calloutType: insight
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: callout
            title: Growth evidence is not yet a Coda-specific sizing model
            body: >-
              D2C growth signals are encouraging, but competitor-reported rates and Coda's company revenue cannot
              establish Coda's addressable market, take rate, or valuation conversion without transaction and margin
              disclosure.
            calloutType: risk
            claimRefs:
              - CM005
              - CM006
              - CM007
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Coda's competitive set is broader than payment gateways. The company sells to digital-content publishers
              that can choose a direct API/payment stack, an independent webstore, a platform ecosystem, or an internal
              build. Coda's 2022 investor announcement described Codashop as a marketplace in more than 50 territories
              and Codapay as a publisher website product using the same payment-method range; a Global Brands profile
              described more than 300 publishers, 65 markets, and three flagship solutions. Those facts position Coda
              between a payment infrastructure vendor and a go-to-market partner. Garena is a relevant competitor or
              substitute at the publisher-ecosystem layer: it develops and publishes games, operates esports, and owns
              player communities across more than 160 markets. UniPin is a direct marketplace alternative for game
              vouchers and top-ups, although the assigned page provides customer-support instructions rather than
              comparable scale or economics. The status quo also includes publisher-owned webstores, app-store billing,
              local acquirers, and internal payment integrations; no assigned source quantifies their comparative price
              or conversion.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP011
      - number: '3.2'
        title: Capability, distribution, and trust comparison
        blocks:
          - type: paragraph
            body: >-
              Coda's strongest evidenced capability is local-market breadth: the company release says Codashop offers
              more than 300 payment methods and that publishers use Codapay for the same range on their own websites.
              Current regulatory reporting says the platform supports more than 400 payment methods in over 70 markets
              and that the full Major Payment Institution licence covers merchant acquisition plus domestic and
              cross-border money transfers. These figures are not necessarily comparable because they come from
              different dates and may reflect different product scope; they should not be read as a verified growth
              rate. Coda also claims compliance, tax, market-insight, marketing, and customer-care support, while Coda's
              claimed Fintech Map profile labels the business B2B and shows an active operating status but marks several
              fields as source-needed. Garena's owned games, esports, and community operations provide distribution
              power that a payments vendor does not replicate. The evidence therefore supports a capability advantage in
              payment localization and publisher enablement, not a blanket advantage in audience ownership or content
              IP.
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
              - CP011
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP009
              - CP011
              - CP015
      - number: '3.3'
        title: Pricing pressure, lock-in, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Coda's moat hypothesis rests on accumulated local payment integrations, compliance knowledge, publisher
              distribution, and a two-sided marketplace rather than on a disclosed proprietary pricing formula. Global
              Brands Magazine reports Coda's claim that its solutions cost half as much as traditional app stores, but
              this is company-originated promotional evidence and does not establish realized take rate, publisher
              savings, or net revenue after incentives. The same source says Coda supports more than 300 publishers and
              that Codacash was available in nine markets two years after launch; these are useful scope signals but not
              retention or switching cost measures. UniPin's support page demonstrates a competing voucher workflow with
              physical vouchers, game identifiers, serials, payment methods, and transaction support, showing that
              localized top-up operations can be offered by another marketplace. Garena and Sea have stronger control of
              game content, player relationships, and owned distribution in their ecosystems. Public evidence does not
              establish exclusive publisher contracts, multi-homing rates, churn, customer concentration, or the cost to
              replace Coda integrations. The durable advantage is therefore plausible but not yet underwritten;
              diligence should prioritize realized pricing, renewal behavior, and the share of volume protected by
              regulatory and operational complexity.
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP011
              - CP012
              - CP014
              - CP015
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Localized monetization is the clearest differentiator
            body: >-
              Coda has evidenced breadth across payment methods, markets, publisher APIs, and consumer webstores, with a
              Singapore MPI licence adding regulated operating capacity.
            calloutType: strength
            claimRefs:
              - CP006
              - CP007
              - CP008
          - type: callout
            title: Moat evidence stops short of switching economics
            body: >-
              The assigned evidence does not disclose realized pricing, take rates, churn, exclusivity, or replacement
              costs, while ecosystem competitors retain control of content and player distribution.
            calloutType: risk
            claimRefs:
              - CP012
              - CP014
              - CP015
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue mix improved in vouchers but weakened in core monetisation
        blocks:
          - type: paragraph
            body: >-
              Segno Pte Ltd, identified in the reporting as Coda's holding company, generated reported FY2024 group
              revenue of $167.8 million, slightly below $169.3 million in FY2023. The composition moved in opposite
              directions: digital content monetisation declined 8.7% to $105.2 million, while voucher code sales
              increased 16.4% to $63.8 million. The source does not identify the currency, and the two category values
              should not be treated as a reconciled revenue bridge because their sum differs from reported group
              revenue. Gross profit declined 9.5% to $43.4 million, implying an approximately 25.9% gross margin when
              the reported gross profit is divided by reported revenue. This is accounting revenue, not ARR or GMV. The
              mix shift toward faster-growing voucher sales is encouraging for diversification, but the simultaneous
              gross-profit decline prevents a conclusion that revenue quality or contribution economics improved.
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
      - number: '4.2'
        title: Public evidence shows accounting outcomes, not transaction economics
        blocks:
          - type: paragraph
            body: >-
              Coda's Singapore licence covers merchant acquisition and domestic and cross-border money transfers,
              establishing a regulated operating base for its payment activity. It does not disclose price per
              transaction, take rate, publisher revenue share, payment-method cost, refunds, fraud losses, or realized
              discounting. Reported FY2024 cost movements were mixed: legal and professional expense fell to $5.4
              million, marketing expense fell to $4.0 million, and employee cost held at $36.8 million, while
              depreciation and amortisation rose to $2.9 million. Lower discretionary expense helped the reported loss
              narrow, but that is not evidence of structurally better unit economics. Public-company comparator pages
              expose recurring filings or financial publications more readily than the Coda-specific evidence set,
              underscoring a disclosure gap rather than providing a directly comparable margin benchmark.
            claimRefs:
              - CI002
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
          - type: table
            tableRef: TI002
            claimRefs:
              - CI004
              - CI005
              - CI014
              - CI015
          - type: figure
            figureRef: FI001
            claimRefs:
              - CI001
              - CI003
              - CI004
              - CI005
              - CI007
              - CI014
      - number: '4.3'
        title: Historical cash coverage is not current runway
        blocks:
          - type: paragraph
            body: >-
              Reported cash and equivalents declined from $112.4 million at end-2023 to $96.8 million at end-2024.
              Operating cash outflow increased from $3.9 million to $9.4 million, while investing and financing outflows
              were also reported. Those figures show a deterioration in cash generation, but dividing end-2024 cash by
              one year's operating outflow would create a misleading runway estimate: it would omit investing needs,
              financing flows, working-capital volatility, acquisition consideration, debt, and post-period changes.
              Total assets of $164.4 million and liabilities of $109.4 million left reported net assets of $55.1 million
              at end-2024, but no current balance sheet or pro forma combined-group bridge appears in the assigned
              evidence. The financial verdict is therefore conditional: Coda has demonstrated meaningful revenue scale
              and loss reduction, while margin resilience, present liquidity, and forward capital adequacy remain
              diligence blockers.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
          - type: table
            tableRef: TI003
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI006
              - CI007
              - CI010
              - CI011
              - CI012
              - CI013
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Loss reduction did not translate into stronger cash generation
            body: >-
              Reported net loss narrowed in FY2024, but operating cash outflow more than doubled and cash declined. The
              divergence requires a working-capital and non-cash bridge before underwriting a margin or runway
              inflection.
            calloutType: risk
            claimRefs:
              - CI002
              - CI006
              - CI007
          - type: callout
            title: Underwrite from audited product economics, not the cash balance
            body: >-
              Require current unrestricted cash, debt and acquisition obligations, product-level gross margins, and
              channel-level take rates before assigning a forward liquidity or valuation conclusion.
            calloutType: recommendation
            claimRefs:
              - CI003
              - CI006
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Coda's product surface is a set of connected commerce routes rather than a single payment widget. Its own
              description identifies Custom Commerce as a customizable web store, Codapay as direct API payments on
              publisher sites, Codashop as a marketplace for in-game content, and Distribution as reach through commerce
              partners. The operating workflow is therefore publisher onboarding, product and entitlement configuration,
              localized checkout or storefront delivery, payment confirmation, and digital-content fulfillment. Unity's
              documentation adds an implementation-level view: Codapay acts as merchant of record, Coda handles
              payment-related operational responsibilities, and publishers must configure redirects, complete business
              verification, connect a title, and choose supported payment methods. The evidence supports a broad product
              surface and a concrete onboarding path, but it does not establish realized conversion, take rate, or
              customer-level implementation success.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE005
              - CE006
              - CE013
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.2'
        title: Architecture and integration model
        blocks:
          - type: paragraph
            body: >-
              The public integration model has three practical layers. At the product layer, publishers can use a ready
              Codashop flow, a custom Coda webstore, or Codapay for direct checkout. At the integration layer, Coda
              describes hosted payment pages, a publisher-hosted component, and direct API integration, while Unity
              exposes Coda through its dashboard as a payment provider. At the operations layer, Coda is positioned as
              merchant of record and handles payment, tax, fraud, compliance, and support responsibilities, subject to
              configuration and verification constraints. The architecture is specific enough to show how Coda reduces
              fragmented payment integrations, but the public sources do not disclose API schemas, data flows, service
              boundaries, failover design, or the evidence needed to independently assess scalability.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE006
              - CE009
              - CE010
              - CE011
              - CE012
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE009
              - CE010
              - CE011
      - number: '5.3'
        title: Maturity, reliability, and trust controls
        blocks:
          - type: paragraph
            body: >-
              Product maturity is best evidenced by operating breadth and integration distribution rather than by
              disclosed engineering artifacts. Coda states that it has more than a decade of operating experience and
              serves more than 300 publishers, while company and independent reporting describe support for more than
              400 payment methods across more than 70 markets. The Unity documentation confirms a production onboarding
              workflow with business verification, sandbox and production environments, payment-method restrictions, and
              order-cancellation behavior when payment confirmation is late. Coda also received a Singapore Major
              Payment Institution licence, with the licence covering merchant acquisition and domestic and cross-border
              money transfers. These are meaningful maturity and control signals, but the pool contains no independent
              penetration-test report, incident history, service-level measurement, or detailed compliance-control
              evidence.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
      - number: '5.4'
        title: Differentiation and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Coda's defensible product claim is integration and localization breadth: one publisher integration can
              expose many local payment methods while Coda provides a managed merchant-of-record layer. The current
              Unity IAP 5.4 launch is an additional adoption surface because developers can activate Coda from an
              existing dashboard. The differentiation is operational and network-oriented, combining local payment
              access, commerce tooling, distribution, and compliance execution; the assigned sources do not prove
              proprietary payment technology, switching costs, or superior economics. A legal-industry report also ties
              prior expansion plans to cross-border payments and alternative app stores, but this historical statement
              is not a current roadmap. Priority diligence should therefore focus on API and data architecture, uptime
              evidence and incident response, payment-method coverage by market, reconciliation and settlement controls,
              security attestations, and implementation time and conversion outcomes by product.
            claimRefs:
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integration breadth is the clearest product strength
            body: >-
              Coda combines local payment access, publisher-facing commerce products, and a merchant-of-record operating
              layer; the Unity connection shows this surface is exposed through a third-party developer workflow.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE007
          - type: callout
            title: Technical transparency is materially incomplete
            body: >-
              The assigned evidence does not disclose API specifications, independent uptime evidence, security
              attestations, incident history, reconciliation performance, or realized customer outcomes.
            calloutType: risk
            claimRefs:
              - CE012
              - CE014
              - CE015
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying motion
        blocks:
          - type: paragraph
            body: >-
              Coda sells primarily into game and digital-content publishers that need alternative payments, webstores,
              distribution, and merchant-of-record support. The customer-side user is the publisher's commerce,
              monetization, or growth team, while the end user is the gamer purchasing content. The company's current
              industry page says it serves 300+ publishers, 600+ brands, and 55m+ active users in 2025, while its
              product proposition spans Codapay, Coda Webstore, Coda Links, Distribution, and consumer platforms. A
              separate Coda announcement describes the Digital Garage relationship as a route for Japanese publishers to
              reach global audiences and for international publishers to enter Japan. These sources establish segment
              breadth and channel strategy, but they do not disclose the denominator, revenue mix, contract length, or
              share of customers in production versus pilot.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU007
              - CU008
      - number: '6.2'
        title: Adoption trajectory and named customer proof
        blocks:
          - type: paragraph
            body: >-
              Public evidence shows multiple customer-facing adoption surfaces rather than only an undifferentiated logo
              list. Coda states that Codashop reaches 120M+ players across 62 markets and that its broader network
              reaches 380M+ through Codashop, Startselect, Recharge, and other platforms; the same page reports 2B+
              processed transactions, 300+ publishers served, and 55m+ active users in 2025. The EA SPORTS FC Mobile
              webstore is a named deployment launched in 60 markets after launches in four initial markets, while
              Digital Garage reports AppPay adoption by more than 40 titles and says Coda supports more than 300
              publishers and over 200 million paying users through Codashop and Custom Commerce webstores. The metrics
              are company or partner disclosures with different definitions and periods, so they demonstrate reach and
              deployment breadth but cannot be combined into a single active-customer or retention funnel.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
          - type: table
            tableRef: TU003
            claimRefs:
              - CU003
              - CU004
              - CU007
              - CU009
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU004
              - CU006
              - CU009
              - CU010
      - number: '6.3'
        title: Durability, expansion, and concentration risks
        blocks:
          - type: paragraph
            body: >-
              Coda's expansion motion is visible in localized webstores, direct-to-consumer checkout, and partner
              distribution. EA's deployment provides concrete evidence of production-like geographic rollout, and
              Digital Garage supplies a channel partnership for Japan; Unity's integration guide shows Coda as a
              selectable third-party payment provider in a sandbox-to-production implementation path. However, the
              assigned evidence does not provide net retention, gross retention, churn, renewal rates, contract
              duration, customer cohort behavior, top-customer revenue shares, or failed-pilot rates. The Fintech Map
              profile also flags several fields as “Source Needed,” including services, capital amount, and
              testimonials, while listing an employee count without an identified source. Investment diligence should
              therefore treat customer durability and concentration as unresolved rather than infer them from publisher
              logos, reach claims, or partner announcements.
            claimRefs:
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad publisher distribution footprint
            body: >-
              Coda has repeated public evidence of serving 300+ publishers and operating across many markets, with named
              customers including EA and platform relationships that extend distribution beyond a single checkout
              channel.
            calloutType: strength
            claimRefs:
              - CU002
              - CU007
              - CU008
          - type: callout
            title: Retention and concentration remain opaque
            body: >-
              No assigned source discloses NRR, GRR, churn, renewal terms, cohort retention, or top-customer revenue
              concentration; those metrics are material diligence gaps for a transaction-volume and publisher-dependent
              business.
            calloutType: risk
            claimRefs:
              - CU010
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              Coda has a meaningful regulatory foundation in Singapore, but a licence is not evidence that every
              jurisdiction, product, or legal entity is compliant on an ongoing basis. The Payment Services Act defines
              a major payment institution and merchant-acquisition activity, while Coda's public licence announcement
              says its Singapore entity is authorised for merchant acquisition and domestic and cross-border transfers.
              That makes regulatory perimeter, safeguarding, reporting, AML, sanctions, consumer-protection, and
              local-licensing execution central diligence items. The public evidence does not establish the scope of
              Coda's licences outside Singapore, the compliance status of Recharge entities, or whether controls scale
              consistently across more than 70 markets. These gaps justify a high residual risk until the
              entity-by-entity map, regulator correspondence, audit findings, and incident history are reviewed.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR008
              - CR009
      - number: '7.2'
        title: Operational, quality, and security exposure
        blocks:
          - type: paragraph
            body: >-
              Payment reliability is a compound operating risk: a failed checkout, delayed webhook, incorrect
              entitlement, fraud event, chargeback, or privacy incident can harm both publishers and end users. Unity's
              integration documentation shows that a successful Coda flow depends on checkout completion, order.paid
              webhook delivery, entitlement refresh, and content availability; it also points integrators to logs, test
              cards, and sandbox testing. Those controls are useful mitigations, but they are documented testing
              mechanisms rather than evidence of production uptime, recovery-time performance, fraud-loss rates, or
              security outcomes. Google and Apple privacy policies also demonstrate that platform environments collect
              and process identifiers, device, activity, and payment-related data, creating a continuing data-governance
              and dependency surface. Coda should provide independent assurance, incident records, penetration-test
              summaries, reconciliation controls, and service-level evidence before this risk is reduced.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR002
              - CR004
              - CR006
              - CR007
              - CR008
              - CR015
      - number: '7.3'
        title: Partner and dependency exposure
        blocks:
          - type: paragraph
            body: >-
              Coda's model depends on a distributed network of publishers, payment channels, app and platform
              ecosystems, and acquired consumer properties. A third-party profile describes more than 300 publishers,
              more than 400 payment channels, and more than 70 markets, while the company release describes 300-plus
              publishers and 400-plus payment methods. The breadth is strategically valuable but makes concentration and
              change-management questions more important: loss of a large publisher, a platform policy change, a
              payment-channel outage, or a failure to integrate Recharge could affect transaction volume and customer
              trust. Public sources do not disclose the largest publishers, channel-level volume shares, contract
              duration, termination rights, or supplier fallback performance. The risk is therefore not that dependency
              exists—public evidence supports that it does—but that its concentration and substitutability remain
              unmeasured.
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR015
              - CR016
      - number: '7.4'
        title: Financial and model risk
        blocks:
          - type: paragraph
            body: >-
              The public evidence supports a large historical financing event and a subsequent acquisition, but it does
              not provide a current combined income statement, cash-flow bridge, liquidity position, margin profile, or
              product-level take rates. A third-party profile records a $690 million Series C at a $2.5 billion
              valuation in April 2022 and a €400 million Recharge acquisition in August 2025; those are transaction
              facts, not current enterprise value or cash available. The combination may increase strategic reach while
              also increasing integration, working-capital, foreign-exchange, fraud, chargeback, and regulatory-capital
              demands. Until management supplies audited or board-level combined financials, the residual model risk is
              high and the prior valuation anchor should not be treated as a current mark.
            claimRefs:
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              Treat the risk posture as a thesis break if Coda cannot demonstrate active licences and compliant
              operating controls for material markets, or if a material outage, security event, fraud-loss spike, or
              Recharge integration failure indicates that controls do not scale with transaction and channel complexity.
            calloutType: risk
            claimRefs:
              - CR002
              - CR005
              - CR006
              - CR015
          - type: callout
            title: Evidence limitation
            body: >-
              Public sources establish licence status, documented integration steps, platform privacy practices,
              historical financing, and acquisition consideration, but they do not establish current uptime, loss rates,
              concentration, liquidity, or combined financial performance.
            calloutType: assumption
            claimRefs:
              - CR003
              - CR006
              - CR008
              - CR014
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment case and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Coda's strongest valuation support is operating scale rather than a disclosed mark. Its July 2025
              acquisition announcement said the combined business had processed more than US$1.75 billion in 2024 sales,
              served over 200 million customers, and operated in more than 180 markets, while also describing the
              transaction as bringing together two profitable regional leaders. The same release describes more than 300
              publisher partners, over 400 local payment channels, and a direct-to-consumer prepaid platform through
              Recharge. These are meaningful strategic assets, but they are company-issued figures and sales processed
              is not revenue. The anti-thesis is therefore material: the public record does not show combined revenue,
              gross margin, EBITDA, cash flow, debt, liquidity, or a current primary or secondary price. A 2022
              private-market data page lists fundraising history but leaves valuation fields blank, so the prior US$2.5
              billion reference should be treated as stale context rather than a current market-clearing price.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV010
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV008
              - CV009
      - number: '8.2'
        title: Financing and comparable context
        blocks:
          - type: paragraph
            body: >-
              The available financing evidence is asymmetric. Caplight identifies Coda Payments as private, shows a last
              round date of 14 April 2022, and lists Series C, Series B, Series A, and seed activity, but its displayed
              valuation fields are blank and institutional access is required for filing detail. Sacra reports US$715.27
              million of funding as of 2022, but the page provides no current valuation or operating denominator.
              Independent market-data pages provide public-company reference points rather than direct comps: PayPal was
              shown at US$49.15 billion market capitalization in October 2026, while the historical record also shows
              meaningful volatility; Shift4's assigned investor page exposes presentations but no directly extracted
              valuation metric. These references can frame market conditions, not support a precise Coda multiple.
              Hurun's 2025 unicorn research also documents that private valuations can be cut or fall below the US$1
              billion threshold, reinforcing entry-price discipline.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV003
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV008
              - CV010
              - CV011
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV012
      - number: '8.3'
        title: Scenarios and decision discipline
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis should be conditional rather than a fabricated point estimate. The bull case requires
              verified post-Recharge revenue growth, durable take rates, margin capture from combined B2B and B2C
              distribution, and a financing price that reflects strategic scale without assuming all processed volume
              becomes Coda revenue. The base case assumes the platform remains strategically valuable but that
              integration, compliance, working-capital, and consumer-acquisition costs absorb part of the synergy
              opportunity. The bear case is a down-round or impaired exit path caused by multiple compression, weak
              combined profitability, regulatory-capital demands, customer concentration, or failure to integrate
              Recharge. Because no assigned source discloses a current Coda price, each scenario uses valuation logic
              and decision gates rather than invented dollar ranges. A research-more recommendation is therefore more
              defensible than buy or avoid.
            claimRefs:
              - CV002
              - CV004
              - CV008
              - CV010
              - CV011
      - number: '8.4'
        title: Exit readiness and diligence asks
        blocks:
          - type: paragraph
            body: >-
              Coda's acquisition expands strategic optionality: the release says Recharge adds a direct-to-consumer
              engine, prepaid expertise, European reach, and more than 16,000 products, while Coda contributes publisher
              relationships and payment infrastructure. That combination could improve exit relevance to payments,
              commerce, gaming, or digital-distribution buyers, but strategic optionality is not liquidity. Before
              underwriting an entry price, request the signed transaction consideration and capitalization impact,
              current cap table and liquidation preferences, consolidated 2024-2026 revenue bridge, gross-margin and
              contribution-margin split by Codapay, Codashop, webstores, and Recharge, debt and cash schedule, customer
              concentration, churn or renewal cohorts, and regulatory-entity map. Thesis-break triggers should include a
              material down-round, inability to demonstrate positive contribution economics after integration, a
              material compliance restriction, or a sustained loss of key publishers or payment channels.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV012
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Recommendation
            body: >-
              Research-more: Coda's strategic scale is credible, but the assigned public evidence cannot establish a
              current valuation or whether the combined business converts processed volume into attractive revenue,
              margin, and cash flow.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
          - type: callout
            title: Primary valuation risk
            body: >-
              The historical US$2.5 billion anchor is not re-verified in the assigned current evidence. A buyer could
              overpay if processed sales, funding raised, or a private-market label is mistaken for revenue, cash value,
              or a current clearing price.
            calloutType: risk
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV009
