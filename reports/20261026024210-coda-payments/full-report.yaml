  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Strategic scale supports further diligence, while missing price and combined economics constrain the
      recommendation.
    data:
      nodes:
        - id: scale
          label: Scale and reach
          detail: 2024 processed sales above US$1.75B; 200M+ customers; 180+ markets, company-issued.
        - id: differentiation
          label: Product and channel fit
          detail: Gaming-native publisher network plus Recharge direct-to-consumer prepaid reach.
        - id: unknowns
          label: Price and economics unknown
          detail: No current Coda valuation, combined revenue, margin, cash-flow, or preference terms in assigned evidence.
        - id: decision
          label: Research-more
          detail: Require current financing and operating diligence before underwriting entry.
        - id: diligence
          label: Diligence gates
          detail: Verify price, cap table, revenue, margin, cash, debt, and retention.
        - id: exit
          label: Exit optionality
          detail: Assess strategic buyers only after combined economics and liquidity are evidenced.
      edges:
        - - scale
          - differentiation
        - - differentiation
          - unknowns
        - - unknowns
          - decision
        - - unknowns
          - diligence
        - - diligence
          - exit
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV005
      - CV012
