          value: "$167.8m FY2024"
          detail: "Accounting revenue, down from $169.3m; not ARR or GMV."
        - id: gross-profit
          label: Gross profit
          value: "$43.4m FY2024"
          detail: "Down 9.5%; the source does not provide product-level gross margins."
        - id: operating-cash
          label: Operating cash flow
          value: "($9.4m) FY2024"
          detail: "Operating outflow increased from $3.9m; this is not a forward runway estimate."
    approximationNotes: >-
      This is a conceptual disclosure sequence, not a numerically reconciled
      waterfall. Currency is unspecified in the fetched financial article, and
      category revenue must not be summed into group revenue without an audited bridge.
    claimRefs: [CI001, CI003, CI004, CI005, CI007, CI014]
callouts:
  - calloutType: risk
    title: Loss reduction did not translate into stronger cash generation
    body: >-
      Reported net loss narrowed in FY2024, but operating cash outflow more than
      doubled and cash declined. The divergence requires a working-capital and
      non-cash bridge before underwriting a margin or runway inflection.
    claimRefs: [CI002, CI006, CI007]
  - calloutType: recommendation
    title: Underwrite from audited product economics, not the cash balance
    body: >-
      Require current unrestricted cash, debt and acquisition obligations,
      product-level gross margins, and channel-level take rates before assigning
      a forward liquidity or valuation conclusion.
    claimRefs: [CI003, CI006, CI015, CI016]
