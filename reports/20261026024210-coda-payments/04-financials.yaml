      - [Domestic money transfer, Licensed payment service, null, null, "Licence scope confirmed; pricing absent", "Obtain fee schedule, average transfer value, and variable cost"]
      - [Cross-border money transfer, Licensed payment service, null, null, "Licence scope confirmed; pricing absent", "Obtain FX spread, corridor mix, settlement cost, and loss rates"]
      - [Digital content monetisation, Reported revenue category, null, "$105.2m FY2024 revenue; currency unspecified", "Accounting revenue reported; contract terms absent", "Obtain publisher share, minimum commitments, refunds, and cohort retention"]
      - [Voucher code sales, Reported sales category, null, "$63.8m FY2024 revenue; currency unspecified", "Accounting revenue reported; principal-versus-agent treatment unclear", "Obtain face value, discounts, breakage, inventory exposure, and gross margin"]
    notes: >-
      Null means the assigned public evidence does not disclose a price, unit,
      or realized unit-economic value. Licensed activities do not establish that
      each activity is currently material to revenue.
    claimRefs: [CI004, CI005, CI014, CI015]
  - id: TI003
    title: Unit economics and capital-adequacy evidence
    columns:
      - Metric
      - Reported or derived value
      - Period
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Revenue, "$167.8m; currency unspecified", FY2024, Medium, "Denominator for reported profitability; not ARR or GMV", "Reconcile to audited statements and product lines"]
      - [Gross profit, "$43.4m; currency unspecified", FY2024, Medium, "Measures profit after reported cost of revenue", "Provide product-level cost of revenue"]
      - [Implied gross margin, "Approximately 25.9%", FY2024, Medium, "Calculated as $43.4m / $167.8m; not directly stated", "Confirm against audited accounting classifications"]
      - [Net loss, "$11.8m; currency unspecified", FY2024, Medium, "Narrowed from $17.95m but is not cash burn", "Bridge net loss to EBITDA and operating cash flow"]
      - [Operating cash outflow, "$9.4m; currency unspecified", FY2024, Medium, "Increased from $3.9m and is not a forward burn forecast", "Provide monthly cash flow, working-capital seasonality, and restricted cash"]
      - [Cash and equivalents, "$96.8m; currency unspecified", "End-2024", Medium, "Historical liquidity anchor only", "Provide current unrestricted cash and minimum regulatory balances"]
      - [Employee cost, "$36.8m; currency unspecified", FY2024, Medium, "Major disclosed operating-cost line", "Provide headcount allocation and fully loaded cost by function"]
      - [Customer acquisition and payback, null, "Not disclosed", Low, "Prevents assessment of sales efficiency", "Provide CAC, sales cycle, cohort contribution, and payback by channel"]
    notes: >-
      Reported values come from Scommerce's account of FY2024 ACRA filings.
      The gross-margin percentage is a calculation from reported revenue and
      gross profit. Null means unavailable, and cash is not converted into runway.
    claimRefs: [CI001, CI002, CI003, CI006, CI007, CI010, CI011, CI012, CI013, CI015]
