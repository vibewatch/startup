company:
  name: Coda Payments
chapter:
  number: 4
  title: Financials
  summary: >-
    Coda's holding company reportedly narrowed its FY2024 net loss, but revenue
    edged down, gross profit fell 9.5%, and operating cash outflow increased.
    End-2024 cash was substantial relative to that single year's operating
    outflow, yet current liquidity, pricing, take rates, customer concentration,
    and post-acquisition obligations remain material underwriting gaps.
sections:
  - id: revenue-mix-and-quality
    title: Revenue mix improved in vouchers but weakened in core monetisation
    body: >-
      Segno Pte Ltd, identified in the reporting as Coda's holding company,
      generated reported FY2024 group revenue of $167.8 million, slightly below
      $169.3 million in FY2023. The composition moved in opposite directions:
      digital content monetisation declined 8.7% to $105.2 million, while voucher
      code sales increased 16.4% to $63.8 million. The source does not identify
      the currency, and the two category values should not be treated as a
      reconciled revenue bridge because their sum differs from reported group
      revenue. Gross profit declined 9.5% to $43.4 million, implying an
      approximately 25.9% gross margin when the reported gross profit is divided
      by reported revenue. This is accounting revenue, not ARR or GMV. The mix
      shift toward faster-growing voucher sales is encouraging for
      diversification, but the simultaneous gross-profit decline prevents a
      conclusion that revenue quality or contribution economics improved.
    claimRefs: [CI001, CI003, CI004, CI005]
    tableRefs: [TI001]
  - id: monetisation-and-cost-structure
    title: Public evidence shows accounting outcomes, not transaction economics
    body: >-
      Coda's Singapore licence covers merchant acquisition and domestic and
      cross-border money transfers, establishing a regulated operating base for
      its payment activity. It does not disclose price per transaction, take
      rate, publisher revenue share, payment-method cost, refunds, fraud losses,
      or realized discounting. Reported FY2024 cost movements were mixed:
      legal and professional expense fell to $5.4 million, marketing expense
      fell to $4.0 million, and employee cost held at $36.8 million, while
      depreciation and amortisation rose to $2.9 million. Lower discretionary
      expense helped the reported loss narrow, but that is not evidence of
      structurally better unit economics. Public-company comparator pages expose
      recurring filings or financial publications more readily than the
      Coda-specific evidence set, underscoring a disclosure gap rather than
      providing a directly comparable margin benchmark.
    claimRefs: [CI002, CI010, CI011, CI012, CI013, CI014, CI015, CI016]
    tableRefs: [TI002]
    figureRefs: [FI001]
  - id: liquidity-and-capital-adequacy
    title: Historical cash coverage is not current runway
    body: >-
      Reported cash and equivalents declined from $112.4 million at end-2023 to
      $96.8 million at end-2024. Operating cash outflow increased from
      $3.9 million to $9.4 million, while investing and financing outflows were
      also reported. Those figures show a deterioration in cash generation, but
      dividing end-2024 cash by one year's operating outflow would create a
      misleading runway estimate: it would omit investing needs, financing
      flows, working-capital volatility, acquisition consideration, debt, and
      post-period changes. Total assets of $164.4 million and liabilities of
      $109.4 million left reported net assets of $55.1 million at end-2024, but
      no current balance sheet or pro forma combined-group bridge appears in the
      assigned evidence. The financial verdict is therefore conditional:
      Coda has demonstrated meaningful revenue scale and loss reduction, while
      margin resilience, present liquidity, and forward capital adequacy remain
      diligence blockers.
    claimRefs: [CI006, CI007, CI008, CI009]
    tableRefs: [TI003]
