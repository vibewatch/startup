company:
  name: Coda Payments
chapter:
  number: 8
  title: Valuation
  summary: Coda has credible scale and a differentiated gaming and digital-content payments position, but public evidence does not establish a current transaction price or combined post-Recharge economics. The appropriate stance is research-more until current financing terms, profitability, and cap-table preferences are verified.
sections:
  - id: investment-case
    title: Investment case and anti-thesis
    body: >-
      Coda's strongest valuation support is operating scale rather than a disclosed mark. Its July 2025 acquisition announcement said the combined business had processed more than US$1.75 billion in 2024 sales, served over 200 million customers, and operated in more than 180 markets, while also describing the transaction as bringing together two profitable regional leaders. The same release describes more than 300 publisher partners, over 400 local payment channels, and a direct-to-consumer prepaid platform through Recharge. These are meaningful strategic assets, but they are company-issued figures and sales processed is not revenue. The anti-thesis is therefore material: the public record does not show combined revenue, gross margin, EBITDA, cash flow, debt, liquidity, or a current primary or secondary price. A 2022 private-market data page lists fundraising history but leaves valuation fields blank, so the prior US$2.5 billion reference should be treated as stale context rather than a current market-clearing price.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001, TV002]
  - id: valuation-context
    title: Financing and comparable context
    body: >-
      The available financing evidence is asymmetric. Caplight identifies Coda Payments as private, shows a last round date of 14 April 2022, and lists Series C, Series B, Series A, and seed activity, but its displayed valuation fields are blank and institutional access is required for filing detail. Sacra reports US$715.27 million of funding as of 2022, but the page provides no current valuation or operating denominator. Independent market-data pages provide public-company reference points rather than direct comps: PayPal was shown at US$49.15 billion market capitalization in October 2026, while the historical record also shows meaningful volatility; Shift4's assigned investor page exposes presentations but no directly extracted valuation metric. These references can frame market conditions, not support a precise Coda multiple. Hurun's 2025 unicorn research also documents that private valuations can be cut or fall below the US$1 billion threshold, reinforcing entry-price discipline.
    claimRefs: [CV005, CV006, CV007, CV008, CV009]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: scenarios-and-decision
    title: Scenarios and decision discipline
    body: >-
      Scenario analysis should be conditional rather than a fabricated point estimate. The bull case requires verified post-Recharge revenue growth, durable take rates, margin capture from combined B2B and B2C distribution, and a financing price that reflects strategic scale without assuming all processed volume becomes Coda revenue. The base case assumes the platform remains strategically valuable but that integration, compliance, working-capital, and consumer-acquisition costs absorb part of the synergy opportunity. The bear case is a down-round or impaired exit path caused by multiple compression, weak combined profitability, regulatory-capital demands, customer concentration, or failure to integrate Recharge. Because no assigned source discloses a current Coda price, each scenario uses valuation logic and decision gates rather than invented dollar ranges. A research-more recommendation is therefore more defensible than buy or avoid.
    claimRefs: [CV002, CV004, CV008, CV010, CV011]
  - id: diligence-and-exit
    title: Exit readiness and diligence asks
    body: >-
      Coda's acquisition expands strategic optionality: the release says Recharge adds a direct-to-consumer engine, prepaid expertise, European reach, and more than 16,000 products, while Coda contributes publisher relationships and payment infrastructure. That combination could improve exit relevance to payments, commerce, gaming, or digital-distribution buyers, but strategic optionality is not liquidity. Before underwriting an entry price, request the signed transaction consideration and capitalization impact, current cap table and liquidation preferences, consolidated 2024-2026 revenue bridge, gross-margin and contribution-margin split by Codapay, Codashop, webstores, and Recharge, debt and cash schedule, customer concentration, churn or renewal cohorts, and regulatory-entity map. Thesis-break triggers should include a material down-round, inability to demonstrate positive contribution economics after integration, a material compliance restriction, or a sustained loss of key publishers or payment channels.
    claimRefs: [CV002, CV003, CV004, CV012]
