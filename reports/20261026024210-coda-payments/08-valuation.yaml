callouts:
  - calloutType: recommendation
    title: Recommendation
    body: >-
      Research-more: Coda's strategic scale is credible, but the assigned public evidence cannot establish a current valuation or whether the combined business converts processed volume into attractive revenue, margin, and cash flow.
    claimRefs: [CV001, CV004, CV005, CV006]
  - calloutType: risk
    title: Primary valuation risk
    body: >-
      The historical US$2.5 billion anchor is not re-verified in the assigned current evidence. A buyer could overpay if processed sales, funding raised, or a private-market label is mistaken for revenue, cash value, or a current clearing price.
    claimRefs: [CV004, CV005, CV006, CV009]
