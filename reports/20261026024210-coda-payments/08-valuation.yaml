      - ["Recharge creates cross-sell and geographic optionality.", "Coda says the combined business spans B2B and B2C, more than 180 markets, and 16,000+ prepaid products.", "Post-close evidence of incremental revenue, margin, and customer acquisition efficiency."]
      - ["The valuation anchor is not investable yet.", "Caplight leaves valuation fields blank; Sacra's funding figure is dated 2022; no current price is disclosed.", "Signed term sheet, secondary transaction, or current investor mark with preference terms."]
      - ["Private-market downside is real.", "Hurun reports valuation cuts and unicorn demotions in its 2025 index.", "Evidence of resilient growth, profitability, and a credible exit path through a full cycle."]
    notes: "This table separates company-issued operating claims from independent valuation context; no row treats a company claim as an independently audited result."
    claimRefs: [CV002, CV003, CV005, CV006, CV008, CV009]
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns: [Scenario, Explicit assumptions, Valuation or return logic, Probability signal, Key risk or trigger]
    rows:
      - [Bull, "Post-Recharge revenue and contribution margin are verified; publisher and consumer retention remain strong; integration creates measurable cross-sell.", "A strategic premium could be justified, but only against verified revenue and margin denominators.", "Low-to-medium until financials are supplied.", "Synergies fail to convert into margin or cash generation."]
      - [Base, "Scale persists, but integration, compliance, working capital, and acquisition costs absorb part of the opportunity.", "Maintain research-more and require a price below a fully optimized strategic case.", "Base case pending current financial package.", "No evidence of durable combined profitability."]
      - [Bear, "Multiple compression, down-round pressure, regulatory constraints, or publisher/customer losses weaken the platform.", "Capital preservation takes priority; avoid an entry based on the stale US$2.5 billion anchor.", "Material downside is plausible but not quantifiable from assigned sources.", "Down-round, compliance restriction, or loss of key relationships."]
      - [Decision gate, "Current valuation, cap table, preferences, revenue, margin, cash, and debt are obtained.", "Move from research-more only if price and downside are supported by primary evidence.", "Unresolved.", "Any material gap remains open at investment committee."]
    notes: "No dollar valuation ranges are fabricated because the assigned evidence does not disclose a current Coda price or combined financial denominator."
    claimRefs: [CV004, CV005, CV006, CV008, CV010, CV011, CV012]
