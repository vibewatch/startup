company:
  name: Coda Payments
chapter:
  number: 2
  title: Market Analysis
  summary: Coda participates in a fragmented gaming-commerce market where local payment access, direct-to-consumer distribution, compliance, and discovery are bundled into an adoption proposition for publishers. Public evidence supports a growing D2C channel and broad gaming demand, but it does not support a defensible standalone TAM/SAM/SOM or Coda-specific take-rate forecast.
sections:
  - id: market-boundary
    title: Market boundary and value pools
    body: >-
      The relevant market is publisher-side gaming commerce infrastructure and
      distribution: payment acceptance, merchant-of-record and compliance
      operations, direct-to-consumer webstores, player top-up marketplaces, and
      partner-led distribution. It is narrower than global game spending because
      it excludes game development, advertising unrelated to transaction
      conversion, console hardware, and the full value of games sold through
      platform-controlled billing. Coda's own description separates connectivity,
      compliance, and reach: its guide says a gaming gateway provides
      connectivity, an MoR provides compliance, and a marketplace provides reach.
      The practical substitute is therefore not only another gateway; it can be
      app-store billing, an incumbent wallet or top-up network, a publisher's
      internal stack, or a regional payment processor. This boundary matters for
      valuation because transaction volume can grow while platform fees,
      fraud, tax, partner commissions, and localization consume the gross
      opportunity.
    claimRefs: [CM001, CM002, CM003]
    tableRefs: [TM001]
  - id: sizing-lenses
    title: Sizing lenses and market momentum
    body: >-
      Available evidence is directional rather than a complete market model.
      BCG's 2025 survey of 2,972 respondents reports that mobile gaming represents
      50% of global gaming revenues, while its industry analysis describes app
      stores opening to external distribution and developers seeking control of
      their own channels. Separately, Xsolla reports that D2C revenue grew 26%
      in 2025 while the overall mobile gaming market grew 0.2%, and that the top
      100 mobile titles grew D2C earnings 38% year over year. These are
      competitor-published figures, not independent benchmarks, so they are
      useful as a directional adoption signal rather than as a Coda market-size
      estimate. Coda's 2024 group revenue of US$167.8 million and gross profit
      of US$43.4 million provide company scale, not a market denominator.
      Consequently, a precise Coda SAM or SOM remains an evidence gap: a
      defensible model needs publisher transaction volume, take rates, regional
      payment mix, and the share addressable through Coda's channels.
    claimRefs: [CM004, CM005, CM006, CM007]
    tableRefs: [TM002]
    figureRefs: [FM001]
  - id: buyers-adoption
    title: Buyers, users, payers, and adoption path
    body: >-
      The economic buyer is generally a game or digital-content publisher that
      owns monetization and wants incremental payer reach, direct customer
      relationships, or lower platform dependence. The operational users are
      payments, finance, tax, fraud, compliance, growth, and live-operations
      teams; the payer is the player using a locally familiar method. The buyer's
      adoption path can start with one market or title, then expand through
      localized methods, webstore or marketplace distribution, and merchant-of-
      record coverage. Coda's Unity integration illustrates a low-friction
      channel motion: developers can activate Coda in the Unity Dashboard and
      access more than 400 payment methods across 80-plus markets through one
      integration. An Impact case study reports that Coda's partner program
      targeted creators, influencers, publishers, telcos, e-wallets, and
      entertainment companies, with performance-based rewards in Indonesia,
      Malaysia, Brazil, and India. Those examples support a multi-stakeholder
      sale, but they do not disclose conversion, retention, or net revenue
      contribution by segment.
    claimRefs: [CM008, CM009, CM010, CM011]
    tableRefs: [TM003]
  - id: drivers-constraints
    title: Drivers, constraints, and diligence implications
    body: >-
      Demand is supported by persistent player engagement and by the economic
      case for owned commerce. BCG reports that 55% of surveyed gamers increased
      gaming time over the prior six months and that 75% said game prices affect
      purchase choices, implying both engagement and affordability sensitivity.
      The same report identifies cloud gaming, user-generated content, generative
      AI, and app-store opening as structural changes that can expand or
      redistribute value pools. The constraints are equally material: payment
      localization, fraud, tax, regulatory compliance, and discovery must work
      together; the Coda guide explicitly describes gaming transactions as high
      frequency, low value, fraud-targeted, and regionally diverse. Coda's full
      Singapore Major Payment Institution licence improves its regulatory
      position, but regulation is also an operating obligation rather than a
      moat by itself. The key diligence questions are product-level take rates,
      gross margins, payer concentration, channel cannibalization, chargeback
      economics, and whether D2C growth persists after app-store rules and
      publisher incentives normalize.
    claimRefs: [CM012, CM013, CM014, CM015]
