callouts:
  - calloutType: insight
    title: "The investable market is infrastructure plus distribution"
    body: "Coda's opportunity is strongest where a publisher needs local payment access, compliance execution, and owned or partner distribution together; a generic gaming-spend TAM would overstate the addressable pool."
    claimRefs: [CM001, CM002, CM003]
  - calloutType: risk
    title: "Growth evidence is not yet a Coda-specific sizing model"
    body: "D2C growth signals are encouraging, but competitor-reported rates and Coda's company revenue cannot establish Coda's addressable market, take rate, or valuation conversion without transaction and margin disclosure."
    claimRefs: [CM005, CM006, CM007]
