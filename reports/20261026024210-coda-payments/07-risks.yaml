    rows:
      - ["Jurisdictional licensing and perimeter", "Medium", "High", "Partial", "High", "Obtain entity-by-entity licence and product-perimeter map for every operating market."]
      - ["AML / sanctions / safeguarding execution", "Medium", "High", "Partial", "High", "Review latest compliance testing, regulator correspondence, safeguarding reconciliations, and material exceptions."]
      - ["Privacy and consumer-protection obligations", "Medium", "High", "Partial", "High", "Review DPA, data-flow map, retention schedule, complaints, and cross-border transfer controls."]
      - ["Regulatory change or enforcement", "Medium", "High", "Partial", "Medium-high", "Obtain legal opinions, open supervisory matters, and the last two years of enforcement or remediation history."]
    notes: "Rows synthesize the Singapore statute, Coda's licence disclosures, and platform privacy documentation; residual exposure is an analytical assessment, not a regulator rating. Nulls are not used because each row names a diligence path."
    enumerationScope:
      coverage: partial
      basis: "Publicly documented Singapore perimeter and selected platform obligations as of 2026-10-26; not a complete global legal-entity inventory."
    claimRefs: [CR001, CR002, CR003, CR004, CR008, CR009]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Checkout or payment-channel failure", "Medium", "High", "Partial", "High", "Production uptime and channel-level fallback evidence are not public."]
      - ["Webhook or entitlement failure", "Medium", "High", "Partial", "Medium-high", "Need incident, reconciliation, retry, and recovery-time history."]
      - ["Fraud, chargeback, or payout loss", "Medium", "High", "Unknown", "High", "Need loss-rate, reserve, dispute, and fraud-control metrics by product."]
      - ["Privacy or security incident", "Medium", "High", "Partial", "High", "Need independent assurance, breach history, and notification evidence."]
    notes: "The Unity integration flow is a technical control description, not a production performance guarantee; Apple and Google policies evidence external data-processing dependencies, not a Coda incident."
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Publisher relationships", "Game and digital-content publishers", "Loss or concentration of a major publisher reduces volume and weakens distribution economics", "High", "Multi-product and multi-publisher distribution", "High"]
      - ["Payment-channel network", "Local and global payment methods", "Channel outage, pricing change, or de-risking interrupts checkout or raises costs", "High", "More than 400 methods and channel diversification are described publicly", "Medium-high"]
      - ["Mobile and app ecosystems", "Apple and Google environments", "Policy, data, or access changes constrain out-of-app conversion or user tracking", "High", "Maintain compliant web and API flows and platform-specific controls", "High"]
      - ["Recharge integration", "Acquired prepaid platform", "Integration or working-capital failure creates service disruption and financial drag", "High", "Integration plan and separate operating controls require diligence", "High"]
    notes: "Public sources establish the existence of publisher, channel, and platform dependencies but do not disclose concentration, contractual protections, or fallback economics."
    claimRefs: [CR010, CR011, CR012, CR013, CR015, CR016]

