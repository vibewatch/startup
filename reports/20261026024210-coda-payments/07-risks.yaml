        - label: Privacy and data governance
          values: [Medium, High, Partial, High]
        - label: Checkout and webhook reliability
          values: [Medium, High, Partial, Medium-high]
        - label: Fraud and chargebacks
          values: [Medium, High, Unknown, High]
        - label: Platform dependency
          values: [Medium, High, Partial, High]
        - label: Recharge integration
          values: [Medium, High, Unknown, High]
    claimRefs: [CR002, CR004, CR006, CR007, CR008, CR015]

callouts:
  - calloutType: risk
    title: Primary thesis-break trigger
    body: Treat the risk posture as a thesis break if Coda cannot demonstrate active licences and compliant operating controls for material markets, or if a material outage, security event, fraud-loss spike, or Recharge integration failure indicates that controls do not scale with transaction and channel complexity.
    claimRefs: [CR002, CR005, CR006, CR015]
  - calloutType: assumption
    title: Evidence limitation
    body: Public sources establish licence status, documented integration steps, platform privacy practices, historical financing, and acquisition consideration, but they do not establish current uptime, loss rates, concentration, liquidity, or combined financial performance.
    claimRefs: [CR003, CR006, CR008, CR014, CR016]

