company:
  name: Coda Payments
chapter:
  number: 7
  title: Risks
  summary: Coda's Singapore payment licence and documented sandbox controls reduce, but do not remove, regulatory and operational exposure. The public record leaves material uncertainty around cross-border compliance execution, platform-data dependencies, integration reliability, and the financial risk of the Recharge combination.
sections:
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >-
      Coda has a meaningful regulatory foundation in Singapore, but a licence is not evidence that every jurisdiction, product, or legal entity is compliant on an ongoing basis. The Payment Services Act defines a major payment institution and merchant-acquisition activity, while Coda's public licence announcement says its Singapore entity is authorised for merchant acquisition and domestic and cross-border transfers. That makes regulatory perimeter, safeguarding, reporting, AML, sanctions, consumer-protection, and local-licensing execution central diligence items. The public evidence does not establish the scope of Coda's licences outside Singapore, the compliance status of Recharge entities, or whether controls scale consistently across more than 70 markets. These gaps justify a high residual risk until the entity-by-entity map, regulator correspondence, audit findings, and incident history are reviewed.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operational-security
    title: Operational, quality, and security exposure
    body: >-
      Payment reliability is a compound operating risk: a failed checkout, delayed webhook, incorrect entitlement, fraud event, chargeback, or privacy incident can harm both publishers and end users. Unity's integration documentation shows that a successful Coda flow depends on checkout completion, order.paid webhook delivery, entitlement refresh, and content availability; it also points integrators to logs, test cards, and sandbox testing. Those controls are useful mitigations, but they are documented testing mechanisms rather than evidence of production uptime, recovery-time performance, fraud-loss rates, or security outcomes. Google and Apple privacy policies also demonstrate that platform environments collect and process identifiers, device, activity, and payment-related data, creating a continuing data-governance and dependency surface. Coda should provide independent assurance, incident records, penetration-test summaries, reconciliation controls, and service-level evidence before this risk is reduced.
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: partner-dependencies
    title: Partner and dependency exposure
    body: >-
      Coda's model depends on a distributed network of publishers, payment channels, app and platform ecosystems, and acquired consumer properties. A third-party profile describes more than 300 publishers, more than 400 payment channels, and more than 70 markets, while the company release describes 300-plus publishers and 400-plus payment methods. The breadth is strategically valuable but makes concentration and change-management questions more important: loss of a large publisher, a platform policy change, a payment-channel outage, or a failure to integrate Recharge could affect transaction volume and customer trust. Public sources do not disclose the largest publishers, channel-level volume shares, contract duration, termination rights, or supplier fallback performance. The risk is therefore not that dependency exists—public evidence supports that it does—but that its concentration and substitutability remain unmeasured.
    claimRefs: [CR010, CR011, CR012, CR013]
    tableRefs: [TR003]
  - id: financial-model-risk
    title: Financial and model risk
    body: >-
      The public evidence supports a large historical financing event and a subsequent acquisition, but it does not provide a current combined income statement, cash-flow bridge, liquidity position, margin profile, or product-level take rates. A third-party profile records a $690 million Series C at a $2.5 billion valuation in April 2022 and a €400 million Recharge acquisition in August 2025; those are transaction facts, not current enterprise value or cash available. The combination may increase strategic reach while also increasing integration, working-capital, foreign-exchange, fraud, chargeback, and regulatory-capital demands. Until management supplies audited or board-level combined financials, the residual model risk is high and the prior valuation anchor should not be treated as a current mark.
    claimRefs: [CR014, CR015, CR016]

