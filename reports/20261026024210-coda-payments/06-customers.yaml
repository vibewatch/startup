company:
  name: Coda Payments
chapter:
  number: 6
  title: Customers
  summary: Coda's customer evidence is strongest for a global B2B gaming-publisher base and named webstore deployments, with meaningful reach claims but limited public disclosure on retention, revenue concentration, and customer-level outcomes.
sections:
  - id: customer-segments
    title: Customer segments and buying motion
    body: Coda sells primarily into game and digital-content publishers that need alternative payments, webstores, distribution, and merchant-of-record support. The customer-side user is the publisher's commerce, monetization, or growth team, while the end user is the gamer purchasing content. The company's current industry page says it serves 300+ publishers, 600+ brands, and 55m+ active users in 2025, while its product proposition spans Codapay, Coda Webstore, Coda Links, Distribution, and consumer platforms. A separate Coda announcement describes the Digital Garage relationship as a route for Japanese publishers to reach global audiences and for international publishers to enter Japan. These sources establish segment breadth and channel strategy, but they do not disclose the denominator, revenue mix, contract length, or share of customers in production versus pilot.
    claimRefs: [CU001, CU002, CU003, CU004]
    tableRefs: [TU001]
  - id: adoption-and-proof
    title: Adoption trajectory and named customer proof
    body: Public evidence shows multiple customer-facing adoption surfaces rather than only an undifferentiated logo list. Coda states that Codashop reaches 120M+ players across 62 markets and that its broader network reaches 380M+ through Codashop, Startselect, Recharge, and other platforms; the same page reports 2B+ processed transactions, 300+ publishers served, and 55m+ active users in 2025. The EA SPORTS FC Mobile webstore is a named deployment launched in 60 markets after launches in four initial markets, while Digital Garage reports AppPay adoption by more than 40 titles and says Coda supports more than 300 publishers and over 200 million paying users through Codashop and Custom Commerce webstores. The metrics are company or partner disclosures with different definitions and periods, so they demonstrate reach and deployment breadth but cannot be combined into a single active-customer or retention funnel.
    claimRefs: [CU005, CU006, CU007, CU008, CU009]
    tableRefs: [TU002, TU003]
    figureRefs: [FU001]
  - id: durability-and-concentration
    title: Durability, expansion, and concentration risks
    body: Coda's expansion motion is visible in localized webstores, direct-to-consumer checkout, and partner distribution. EA's deployment provides concrete evidence of production-like geographic rollout, and Digital Garage supplies a channel partnership for Japan; Unity's integration guide shows Coda as a selectable third-party payment provider in a sandbox-to-production implementation path. However, the assigned evidence does not provide net retention, gross retention, churn, renewal rates, contract duration, customer cohort behavior, top-customer revenue shares, or failed-pilot rates. The Fintech Map profile also flags several fields as “Source Needed,” including services, capital amount, and testimonials, while listing an employee count without an identified source. Investment diligence should therefore treat customer durability and concentration as unresolved rather than infer them from publisher logos, reach claims, or partner announcements.
    claimRefs: [CU010, CU011, CU012]
callouts:
  - calloutType: strength
    title: Broad publisher distribution footprint
    body: Coda has repeated public evidence of serving 300+ publishers and operating across many markets, with named customers including EA and platform relationships that extend distribution beyond a single checkout channel.
    claimRefs: [CU002, CU007, CU008]
  - calloutType: risk
    title: Retention and concentration remain opaque
    body: No assigned source discloses NRR, GRR, churn, renewal terms, cohort retention, or top-customer revenue concentration; those metrics are material diligence gaps for a transaction-volume and publisher-dependent business.
    claimRefs: [CU010, CU011, CU012]
