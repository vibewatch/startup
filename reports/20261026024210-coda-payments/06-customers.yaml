      - ["Digital Garage", "Japanese payment and commerce partner", "AppPay route for Japanese publishers and international publishers entering Japan", "AppPay adopted by more than 40 titles", "Domestic reach plus Coda global MoR and distribution", "Partnership does not disclose Coda customer revenue"]
      - ["Activision Blizzard", "Game publisher", "Named as a Coda publisher customer", "Customer relationship asserted in company and profile materials", "Included in 300+ publisher base", "No deployment detail in assigned sources"]
      - ["Riot Games", "Game publisher", "Named as a Coda publisher customer", "Customer relationship asserted in company and profile materials", "Included in 300+ publisher base", "No deployment detail in assigned sources"]
      - ["Zynga", "Game publisher", "Named as a Coda publisher customer", "Customer relationship asserted in profile materials", "Included in 300+ publisher base", "No deployment detail in assigned sources"]
    notes: "Enumeration is partial and limited to named examples found in the assigned sources; a named logo is not treated as proof of retention, revenue, or continuing production use."
    enumerationScope:
      coverage: partial
      basis: Named customer and partner examples disclosed in the assigned public source set for the 2024-2026 refresh window.
    claimRefs: [CU003, CU004, CU007, CU009]
figures:
  - id: FU001
    title: Customer journey from publisher need to expansion
    type: journey-map
    summary: Coda's public customer motion runs from localized payment access through direct webstores and distribution, but public retention evidence is missing.
    data:
      nodes:
        - id: need
          label: Publisher needs local payment access
          detail: Enter markets and reduce checkout friction.
        - id: integrate
          label: Integrate Codapay or Coda Webstore
          detail: Direct API, webstore, or Merchant of Record workflow.
        - id: launch
          label: Launch localized customer surface
          detail: "Named example: EA SPORTS FC Mobile Webstore in 60 markets."
        - id: distribute
          label: Extend through partners and platforms
          detail: Coda cites Codashop, Startselect, Recharge, and Digital Garage/AppPay.
        - id: engage
          label: Drive repeat engagement
          detail: Offers, loyalty programs, and out-of-app touchpoints are described; retention is not disclosed.
        - id: expand
          label: Expand geography and channel
          detail: Public evidence supports geographic and channel expansion, not a measured renewal loop.
    claimRefs: [CU004, CU006, CU009, CU010]
