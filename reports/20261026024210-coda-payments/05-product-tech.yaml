              detail: 400+ methods claimed across 70+ markets in assigned sources
            - label: Merchant of record
              detail: Payment, tax, fraud, compliance, disputes, and support responsibilities described in Unity documentation
        - label: Governance and controls
          detail: Licensing, verification, environment, and operational-control layer
          items:
            - label: Singapore MPI licence
              detail: Merchant acquisition and domestic and cross-border money transfers
            - label: Verification and environment controls
              detail: Business verification, sandbox or production configuration, redirects, and method restrictions
        - label: Settlement and reconciliation
          detail: Payment confirmation, refunds, settlement, and publisher entitlement reconciliation
          items:
            - label: Payment confirmation
              detail: Confirmation timing affects order completion and refund behavior
            - label: Publisher settlement
              detail: Settlement and reconciliation controls are not publicly detailed
        - label: Support and customer operations
          detail: Verification, customer support, disputes, and operational resilience
          items:
            - label: Business verification
              detail: Unity documents onboarding checks before production use
            - label: Support and disputes
              detail: Coda is described as handling support and dispute responsibilities
    claimRefs: [CE001, CE005, CE006, CE009, CE010, CE011]
callouts:
  - calloutType: strength
    title: Integration breadth is the clearest product strength
    body: Coda combines local payment access, publisher-facing commerce products, and a merchant-of-record operating layer; the Unity connection shows this surface is exposed through a third-party developer workflow.
    claimRefs: [CE005, CE006, CE007]
  - calloutType: risk
    title: Technical transparency is materially incomplete
    body: The assigned evidence does not disclose API specifications, independent uptime evidence, security attestations, incident history, reconciliation performance, or realized customer outcomes.
    claimRefs: [CE012, CE014, CE015]
