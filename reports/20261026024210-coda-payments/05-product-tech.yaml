company:
  name: Coda Payments
chapter:
  number: 5
  title: Product & Technology
  summary: Coda presents a multi-product digital-commerce stack spanning Codapay payments, branded webstores, Codashop distribution, and partner distribution. The strongest evidence supports broad payment reach, merchant-of-record operations, and a Unity integration; public technical detail on reliability measurement, security controls, and implementation outcomes remains limited.
sections:
  - id: product-surface
    title: Product surface and customer workflow
    body: >-
      Coda's product surface is a set of connected commerce routes rather than a single payment widget. Its own description identifies Custom Commerce as a customizable web store, Codapay as direct API payments on publisher sites, Codashop as a marketplace for in-game content, and Distribution as reach through commerce partners. The operating workflow is therefore publisher onboarding, product and entitlement configuration, localized checkout or storefront delivery, payment confirmation, and digital-content fulfillment. Unity's documentation adds an implementation-level view: Codapay acts as merchant of record, Coda handles payment-related operational responsibilities, and publishers must configure redirects, complete business verification, connect a title, and choose supported payment methods. The evidence supports a broad product surface and a concrete onboarding path, but it does not establish realized conversion, take rate, or customer-level implementation success.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: architecture-and-integration
    title: Architecture and integration model
    body: >-
      The public integration model has three practical layers. At the product layer, publishers can use a ready Codashop flow, a custom Coda webstore, or Codapay for direct checkout. At the integration layer, Coda describes hosted payment pages, a publisher-hosted component, and direct API integration, while Unity exposes Coda through its dashboard as a payment provider. At the operations layer, Coda is positioned as merchant of record and handles payment, tax, fraud, compliance, and support responsibilities, subject to configuration and verification constraints. The architecture is specific enough to show how Coda reduces fragmented payment integrations, but the public sources do not disclose API schemas, data flows, service boundaries, failover design, or the evidence needed to independently assess scalability.
    claimRefs: [CE005, CE006, CE007, CE008]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-reliability-and-trust
    title: Maturity, reliability, and trust controls
    body: >-
      Product maturity is best evidenced by operating breadth and integration distribution rather than by disclosed engineering artifacts. Coda states that it has more than a decade of operating experience and serves more than 300 publishers, while company and independent reporting describe support for more than 400 payment methods across more than 70 markets. The Unity documentation confirms a production onboarding workflow with business verification, sandbox and production environments, payment-method restrictions, and order-cancellation behavior when payment confirmation is late. Coda also received a Singapore Major Payment Institution licence, with the licence covering merchant acquisition and domestic and cross-border money transfers. These are meaningful maturity and control signals, but the pool contains no independent penetration-test report, incident history, service-level measurement, or detailed compliance-control evidence.
    claimRefs: [CE009, CE010, CE011, CE012]
  - id: differentiation-and-gaps
    title: Differentiation and diligence gaps
    body: >-
      Coda's defensible product claim is integration and localization breadth: one publisher integration can expose many local payment methods while Coda provides a managed merchant-of-record layer. The current Unity IAP 5.4 launch is an additional adoption surface because developers can activate Coda from an existing dashboard. The differentiation is operational and network-oriented, combining local payment access, commerce tooling, distribution, and compliance execution; the assigned sources do not prove proprietary payment technology, switching costs, or superior economics. A legal-industry report also ties prior expansion plans to cross-border payments and alternative app stores, but this historical statement is not a current roadmap. Priority diligence should therefore focus on API and data architecture, uptime evidence and incident response, payment-method coverage by market, reconciliation and settlement controls, security attestations, and implementation time and conversion outcomes by product.
    claimRefs: [CE013, CE014, CE015, CE016]
    tableRefs: []
    figureRefs: []
