      - ["Codashop", "Consumer purchasing digital content and publisher using a ready distribution route", "Live marketplace described by Coda", "Ready audience and localized payment access", "Active-user denominator, retention, and marketplace economics are undisclosed"]
      - ["Distribution", "Publisher and commerce partner", "Live solution described by Coda", "Extends content reach through commerce partners", "Partner dependency, settlement terms, and incremental demand evidence are undisclosed"]
      - ["Unity IAP connection", "Game developer using Unity Dashboard", "Documented production configuration path", "Existing developer workflow can activate Coda without country-by-country provider integrations", "Unity-specific failure handling and support performance require diligence"]
    notes: "Status and differentiation are based on Coda, Unity, and partner-facing descriptions; public sources do not independently verify deployment scale, economics, or technical performance."
    claimRefs: [CE001, CE002, CE005, CE006, CE013]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow, Coda solution, Measurable benefit, Limitation]
    rows:
      - ["Reach players in new markets", "Build and maintain multiple local payment integrations", "Codapay provides a single integration with local and global methods", "400+ methods and 70+ markets are claimed", "Market-by-market authorization and method availability still require verification"]
      - ["Launch a branded direct channel", "Create storefront, checkout, product logic, and fulfillment independently", "Custom Commerce / Coda Webstore provides a managed branded store", "Faster launch and less operational overhead are positioning claims", "No public launch-time or conversion benchmark"]
      - ["Monetize through a ready marketplace", "Recruit and operate a separate consumer storefront", "Codashop provides a direct top-up marketplace and publisher integration path", "Coda describes lightweight validation and top-up APIs", "Audience size and repeat-purchase quality are not independently measured here"]
      - ["Manage payment operations", "Handle tax, fraud, compliance, support, and disputes across markets", "Codapay acts as merchant of record", "Operational responsibility is centralized with Coda", "Exact control framework, liability allocation, and service levels need diligence"]
      - ["Connect a Unity project", "Configure a provider and redirect URLs in the game-commerce workflow", "Unity Dashboard connects a Unity project to a Coda title", "Existing dashboard workflow reduces integration friction", "Late confirmation can trigger cancellation or refund and unsupported methods must be disabled"]
    notes: "Benefits are claims or workflow observations, not measured customer outcomes; null performance fields require customer references or platform telemetry."
    claimRefs: [CE003, CE005, CE006, CE007, CE008]
  - id: TE003
    title: Technology / operating architecture
    columns: [Layer or process, Role, Dependency, Risk, Evidence gap]
    rows:
      - ["Publisher integration", "Hosted page, embedded component, or direct API", "Connect publisher checkout to Coda payment processing", "Publisher implementation quality and API availability", "Public API schema and resilience evidence are absent"]
      - ["Payment-method orchestration", "Select and process local and global payment methods", "Method availability and confirmation behavior vary by market and method", "Unsupported or late-confirming methods can create refunds or failed fulfillment", "Market coverage and confirmation logic require testing"]
      - ["Merchant-of-record operations", "Handle payment, tax, fraud, compliance, disputes, and support responsibilities", "Coda verification, contracts, and regulatory permissions", "Control effectiveness and liability boundaries require independent review", "Control evidence and liability boundaries are not public"]
      - ["Commerce and fulfillment", "Validate purchases and deliver digital content through Codashop or webstores", "Publisher product catalog and entitlement systems", "Reconciliation, fraud losses, and delivery failure rates are not disclosed", "Fulfillment telemetry and settlement controls require diligence"]
      - ["Distribution layer", "Extend content reach through commerce partners", "Partner network and settlement processes", "Partner concentration and data-sharing dependencies are not disclosed", "Partner dependency and settlement terms require diligence"]
      - ["Regulatory and governance layer", "Permit payment services and operational resilience", "Singapore MPI licence and local legal entities", "Licence scope is not a substitute for group-wide compliance and security evidence", "Group-wide legal-entity and compliance map is unavailable"]
    notes: "This is a public operating-model abstraction, not a disclosed software architecture; components, interfaces, controls, and dependencies should be validated in technical and compliance diligence."
    claimRefs: [CE006, CE009, CE010, CE011, CE012]
