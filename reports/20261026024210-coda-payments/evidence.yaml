    whyItMatters: >-
      PayPal and other public payments companies provide market context but do not establish an appropriate private
      gaming-commerce multiple.
    diligencePath: >-
      Build a comp set spanning gaming payments, digital prepaid commerce, and merchant-of-record transactions using
      dated filings or deal announcements.
    relatedQuestionRefs:
      - QV004
