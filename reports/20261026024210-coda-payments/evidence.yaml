    severity: material
    topic: exit
    missingEvidence: Current customer concentration, renewal or churn cohorts, and integration milestones for the combined platform.
    whyItMatters: A strategic exit thesis depends on durable publisher and consumer relationships rather than headline reach alone.
    diligencePath: Request cohort retention, top-20 customer revenue shares, channel concentration, and post-close synergy tracking.
    relatedQuestionRefs:
      - QV003
      - QV005
  - type: missing-source
