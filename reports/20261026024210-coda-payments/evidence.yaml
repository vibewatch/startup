evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: >-
      Current consolidated revenue, ARR, gross margin, EBITDA, cash flow, debt, liquidity, and balance-sheet bridge for
      Coda and Recharge.
    whyItMatters: >-
      The reported financing and operating scale cannot be translated into quality or sustainability of earnings without
      financial statements.
    diligencePath: >-
      Request audited 2025 financials, 2026 management accounts, cash and debt schedules, and a pro forma Recharge
      consolidation bridge.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: Current primary or secondary pricing and the terms underlying any current valuation anchor.
    whyItMatters: A historical financing amount does not establish current equity value or investor return potential.
    diligencePath: >-
      Obtain the latest preferred-round cap table, 409A or secondary transaction evidence, and liquidation-preference
      schedule.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current board, executive roster, ownership rights, committees, and succession responsibilities.
    whyItMatters: >-
      The CEO references differ by source vintage, and governance quality is material for a regulated cross-border
      payments group.
    diligencePath: >-
      Request the current organization chart, board minutes or committee roster, investor rights summary, and executive
      tenure list.
    relatedQuestionRefs:
      - QO003
      - QO009
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A dated headcount definition reconciling 550+ Codans with 600+ employees.
    whyItMatters: The discrepancy may reflect timing, contractors, or scope changes and affects scale comparisons.
    diligencePath: Request monthly employee and contractor counts by entity from 2024 through 2026.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: customers
    missingEvidence: Publisher concentration, customer retention, top-account economics, and product-level contribution.
    whyItMatters: A publisher count and named logos do not show durability, concentration risk, or monetization quality.
    diligencePath: >-
      Request cohort retention, top-20 revenue share, renewal/churn, take rates, and contribution margin by product and
      geography.
    relatedQuestionRefs:
      - QO005
      - QO008
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: adverse
    missingEvidence: Independent current legal, sanctions, outage, consumer-complaint, and regulatory-enforcement checks.
    whyItMatters: The assigned evidence confirms licensing but does not establish absence of operational or legal incidents.
    diligencePath: >-
      Run dated searches across MAS notices, courts, sanctions lists, outage trackers, and consumer-protection
      databases.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: sizing
    missingEvidence: A Coda-specific SAM/SOM model with transaction volume, take rates, regional mix, and publisher eligibility.
    whyItMatters: >-
      The available industry and competitor growth lenses are not additive and cannot translate into valuation or share
      capture.
    diligencePath: >-
      Request management's bottom-up 2025-2026 TPV, net revenue, take-rate, gross-margin, and eligible-publisher bridge
      by product and geography.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: economics
    missingEvidence: >-
      Product-level gross margins, chargeback losses, fraud costs, and contribution margins across Codapay, Codashop,
      webstores, and Recharge.
    whyItMatters: >-
      Revenue growth and gross profit do not show whether incremental D2C volume creates attractive or durable
      economics.
    diligencePath: >-
      Obtain audited segment economics and a reconciliation from gross merchandise value to net revenue, gross profit,
      and cash generation.
    relatedQuestionRefs:
      - QM007
  - type: conflicting-data
    severity: minor
    topic: market-estimates
    missingEvidence: >-
      A consistent denominator and methodology reconciling global gaming revenue, mobile share, D2C growth, and Coda
      company revenue.
    whyItMatters: >-
      The cited figures describe different populations and units; combining them would create a false funnel or market
      total.
    diligencePath: >-
      Commission a third-party market study using the same geography, period, publisher population, and gross-versus-net
      revenue definitions.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized publisher pricing, take rates, incentives, and net savings versus app-store or gateway alternatives.
    whyItMatters: >-
      A promotional half-cost comparison cannot establish contribution margin, customer value capture, or price
      durability.
    diligencePath: >-
      Obtain a product-level pricing schedule and anonymized cohort economics for Codapay, Codashop, and Custom
      Commerce.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: moat-durability
    missingEvidence: >-
      Publisher renewal, churn, multi-homing, exclusivity, integration replacement cost, and customer concentration
      data.
    whyItMatters: These measures determine whether local integrations and distribution create lock-in or are readily commoditized.
    diligencePath: >-
      Request cohort retention, top-customer concentration, contract terms, and implementation timelines by product and
      geography.
    relatedQuestionRefs:
      - QP007
  - type: enumeration-incomplete
    severity: minor
    topic: competitor-landscape
    missingEvidence: Comparable public evidence for global payment gateways, app stores, internal builds, and likely entrants.
    whyItMatters: The assigned pool supports named alternatives but not a complete market census or comparable pricing benchmark.
    diligencePath: >-
      Build a competitor data room covering PSPs, app-store direct billing, publisher webstores, and regional voucher
      marketplaces.
    relatedQuestionRefs:
      - QP001
      - QP003
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: unit-economics-gaps
    missingEvidence: >-
      Product-level list and realized pricing, take rates, payment-method cost, publisher revenue share, CAC, payback,
      refunds, and customer concentration.
    whyItMatters: >-
      Without transaction and cohort economics, reported revenue and gross profit cannot establish revenue quality,
      sales efficiency, or scalable margin.
    diligencePath: >-
      Obtain audited product P&Ls, contract samples, channel statements, and cohort contribution-margin schedules from
      management and finance.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI002
      - TI003
  - type: stale
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, monthly burn, working-capital seasonality, regulatory minimum balances, debt,
      acquisition obligations, and a post-acquisition pro forma balance sheet.
    whyItMatters: >-
      End-2024 cash and one historical year of operating outflow cannot support a current runway estimate or determine
      the next financing trigger.
    diligencePath: >-
      Request monthly management accounts through September 2026, bank and debt confirmations, regulatory-capital
      schedules, and the acquisition funding bridge.
    relatedQuestionRefs:
      - QI007
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: technical-transparency
    missingEvidence: >-
      Independent API, architecture, security-attestation, uptime, and incident-response evidence for Codapay and the
      connected commerce products.
    whyItMatters: >-
      The product model is broad, but public marketing and partner documentation do not establish resilience, control
      effectiveness, or implementation quality at scale.
    diligencePath: >-
      Request current API documentation, architecture and data-flow diagrams, SOC or PCI evidence, incident logs, uptime
      reports, and reconciliation metrics under NDA.
    relatedQuestionRefs:
      - QE005
      - QE008
  - type: missing-source
    severity: material
    topic: implementation-outcomes
    missingEvidence: >-
      Customer-level evidence on deployment time, conversion, payment success, refunds, and support outcomes by product
      and market.
    whyItMatters: >-
      Payment-method breadth and integration availability are not the same as realized customer value or reliable
      fulfillment.
    diligencePath: >-
      Obtain anonymized cohort telemetry and reference calls covering production deployments, payment success, refunds,
      and support SLAs.
    relatedQuestionRefs:
      - QE004
      - QE008
  - type: missing-source
    severity: minor
    topic: developer-signal
    missingEvidence: >-
      Independent developer-community evidence such as repository activity, package downloads, or practitioner usage
      metrics beyond Unity's partner documentation.
    whyItMatters: >-
      Unity documentation verifies a developer-facing integration path but does not independently corroborate adoption
      or implementation quality.
    diligencePath: >-
      Review Coda developer portals, SDK/package activity, integration forums, and named engineering talks or recruiting
      materials.
    relatedQuestionRefs:
      - QE004
      - QE009
  - type: missing-source
    severity: minor
    topic: external-benchmark
    missingEvidence: Independent technical benchmark or engineering assessment specific to Coda.
    whyItMatters: >-
      The assigned evidence has no product or architecture benchmark, so differentiation remains partly
      company-described.
    diligencePath: >-
      Seek customer references, independent implementation reviews, regulator examination materials, or an agreed
      technical diligence report.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Customer-level NRR, GRR, churn, renewal, contract duration, and cohort retention by product and geography.
    whyItMatters: >-
      Reported reach and publisher counts do not show whether revenue and payment volume persist or expand within
      accounts.
    diligencePath: >-
      Request cohort tables, renewal schedules, churn bridge, and product-level retention definitions for the last 24
      months.
    relatedQuestionRefs:
      - QU004
  - type: private-evidence-only
    severity: material
    topic: concentration
    missingEvidence: Top-10 customer share of revenue, payment volume, gross profit, and active users, with channel-partner dependence.
    whyItMatters: >-
      A publisher or distribution concentration event could materially change volume and margin even if aggregate user
      counts remain high.
    diligencePath: Request anonymized customer concentration bands, revenue cohorts, and counterparty/channel exposure by product.
    relatedQuestionRefs:
      - QU006
  - type: enumeration-incomplete
    severity: minor
    topic: named-customers
    missingEvidence: A complete, current list of named customer deployments with production status, launch date, and measured outcomes.
    whyItMatters: Public logos and selected announcements cannot distinguish durable production use from marketing references.
    diligencePath: >-
      Obtain a customer reference list and validate a sample of deployments with customer-side references or procurement
      records.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: regulatory-gap
    missingEvidence: >-
      A current entity-by-entity regulatory, licensing, safeguarding, AML, sanctions, and consumer-protection map
      covering Coda and Recharge.
    whyItMatters: The Singapore licence does not by itself establish compliant operation across all products, entities, or markets.
    diligencePath: >-
      Request the legal-entity register, licences, regulator correspondence, compliance testing, audit findings, and
      open remediation log.
    relatedQuestionRefs:
      - QR002
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: operational-reliability
    missingEvidence: Independent production uptime, incident, recovery-time, reconciliation, fraud-loss, and chargeback evidence.
    whyItMatters: Documented sandbox tests show intended controls but not scaled production performance or loss outcomes.
    diligencePath: >-
      Request SOC reports, penetration-test summaries, incident register, SLA history, recovery tests, and product-level
