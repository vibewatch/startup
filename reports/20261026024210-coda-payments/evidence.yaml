    relatedQuestionRefs:
      - QV001
      - QV008
  - type: private-evidence-only
    severity: material
    topic: financials
    missingEvidence: Combined 2024-2026 revenue, gross margin, contribution margin, EBITDA, cash flow, cash, and debt after Recharge.
    whyItMatters: >-
      Processed sales and funding raised cannot be converted into a revenue multiple, cash yield, or downside case
      without accounting denominators.
    diligencePath: >-
      Request audited or management-certified consolidated financial statements and a product-level bridge for Codapay,
      Codashop, webstores, and Recharge.
    relatedQuestionRefs:
      - QV006
