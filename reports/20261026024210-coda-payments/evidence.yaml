    relatedQuestionRefs:
      - QR006
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: financial-gap
    missingEvidence: >-
      Current combined audited or board-level revenue, margins, cash flow, liquidity, working capital, and acquisition
