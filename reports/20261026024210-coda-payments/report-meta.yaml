companyProfile:
  summary: >-
    Coda Payments is a Singapore-headquartered digital-content monetization and payments platform founded in 2011. It
    combines publisher-facing payment infrastructure and direct-to-consumer commerce with Codashop, customized
    webstores, distribution partnerships, and the acquired Recharge prepaid network. The evidence shows meaningful
    gaming-native scale and a Singapore Major Payment Institution licence, while current combined financial performance
    and pricing remain undisclosed.
