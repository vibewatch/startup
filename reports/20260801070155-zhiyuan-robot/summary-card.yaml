  topStrengths:
    - >-
      Public evidence supports real shipment and commercialization momentum, including leadership in the China shipment
      narrative and multiple named enterprise proofs.
    - >-
      The company is building a broader platform than a single robot body, combining product breadth, open technical
      assets, models, data, and partner ecosystem positioning.
    - >-
      Named deployment and procurement examples such as Fulin Precision, China Mobile, and Longcheer give Zhiyuan more
      concrete adoption proof than many purely narrative-stage humanoid startups.
    - >-
      Strategic investors and ecosystem partners increase the chance that manufacturing, channel, and commercialization
      support keep compounding.
  topRisks:
    - Public revenue, gross margin, burn, debt, and cap-table detail remain too opaque for clean valuation underwriting.
    - >-
      Customer proof is still concentrated in a narrow cluster of flagship accounts, making narrative and revenue
      concentration risk meaningful.
    - >-
      Hardware-plus-service capital intensity appears structural for the category, raising future dilution and runway
      risk if deployment economics mature slowly.
    - >-
      Operational reliability, safety, and support burden remain only partially disclosed despite the company already
      moving into real industrial environments.
    - >-
      International expansion and partner-led deployment add compliance, quality-control, and governance complexity
      before overseas paying-customer depth is clearly proven.
  unresolvedGaps:
    - Audited 2025-2026 revenue, gross margin, and shipment-to-revenue bridge
    - Current cash balance, debt profile, monthly burn, and downside runway plan
    - Customer cohort table showing live robots, expansions, churn, and service burden by account type
    - Exact 2025 financing terms, cap table, and liquidation preference stack
    - Top-customer concentration, overseas paying-customer count, and field-support KPIs
    - Security, privacy, liability, and incident-control pack expected by large enterprise buyers or IPO investors
