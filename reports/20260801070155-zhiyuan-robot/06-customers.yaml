- id: expansion-and-risks
  title: Expansion and risks
  body: 'The expansion case is credible, but the risk profile remains high. Geographically, the company is still much stronger in China than abroad; partner conferences in London and Melbourne are useful signals, but they are not disclosed overseas customer counts. Segment-wise, structured industrial and procurement workflows are clearly ahead of softer service and interaction use cases. Concentration is the biggest underwriting risk because a handful of logos can drive a large share of narrative momentum in early hardware businesses. The other risk is analytical overreach: shipment leadership and strong logos can tempt investors to assume retention, diversification, and customer economics are already proven. The Wire China’s more skeptical framing is a useful counterweight here. Zhiyuan has crossed the threshold into credible early enterprise adoption, but before a growth-round decision, investors still need active-customer counts, expansion rates, concentration data, and a clear view of
    service burden by customer type.'
