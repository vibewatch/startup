- id: adoption-trajectory
  title: Adoption trajectory
  body: 'The adoption story is still early, but it is no longer purely conceptual. The clearest public arc runs from first on-site deployments to larger follow-on commitments and then to broader commercialization messaging. Fulin Precision provides the best single example: reporting first described four robots actively sorting deliveries and later framed the overall deal at nearly 100 robots. China Mobile provides a different adoption mode, showing that a large institution is willing to run a formal tender at significant size. Longcheer broadens the picture by placing embodied AI into consumer-electronics precision manufacturing, while APC 2026 formalizes the company’s own declaration that large-scale deployment has begun. The important interpretation is not that Zhiyuan has already solved adoption; it is that the company has crossed into a stage where public evidence shows buyers, sites, and rollout pathways. That still falls short of broad market penetration, but it is materially beyond
    pure prototype theater.'
  claimRefs:
  - CU004
  - CU005
  - CU006
