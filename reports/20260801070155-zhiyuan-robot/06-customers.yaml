- id: named-customer-proof
  title: Named customer proof
  body: 'Named-customer proof is the strongest part of the chapter and also one of the clearest places where caution is needed. Fulin Precision and China Mobile are high-value logos because they are accompanied by more than generic name-dropping: public sources describe site tasks, unit counts, or contract value. Tencent News adds Chery to the proof set, and the Longcheer article extends the story into consumer-electronics manufacturing. But the cluster is still narrow. Most of the public case rests on four named logos plus a large ecosystem-partner narrative. That is enough to support a real customer-adoption case, especially for a young humanoid company, yet not enough to declare diversification or repeatability solved. Peer examples are instructive here: Figure benefits from BMW’s own press release, while Apptronik and UBTECH also publicize narrow slices of their best-fit workflows. The right standard for Zhiyuan is therefore not perfection, but more frequent customer-authored or partner-authored
    corroboration across multiple segments.'
  claimRefs:
  - CU003
  - CU004
  - CU008
  - CU010
  - CU011
  - CU012
  - CU028
