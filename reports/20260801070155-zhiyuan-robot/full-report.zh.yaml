  - id: TR005
    title: 缓释措施与否决条件表
    columns:
      - 主题
      - 可见缓释
      - 剩余风险
      - 否决条件
      - 所需证据
    rows:
      - - 安全与运营
        - 已观察到停止行为，加上部署学习
        - 没有事故和正常运行时间数据时仍然偏高
        - 任何未解决的严重安全事故，或旗舰站点反复任务失败
        - 事故日志、危险评审、正常运行时间历史。
      - - 数据与法律合规
        - 中国政策和法律框架可梳理
        - 没有公司控制包时仍为中高
        - 更大范围铺开前，拿不出可审计的隐私 / 安全 / 责任控制
        - 安全架构、隐私地图、法律问责矩阵。
      - - 客户集中度
        - 已披露客户和招标证明需求
        - 客户组合仍窄时风险仍高
        - 一两个旗舰客户流失或不扩张，且没有替代管线
        - 头部客户集中度和客群扩张数据。
      - - 供应商与政策依赖
        - 管理层可以制定应急方案
        - 如果单一来源或出口暴露组件占主导，风险仍高
        - 关键组件没有双供应源或应急路径
        - BOM 集中度和替代采购证明。
      - - 流动性纪律
        - 同行证据提供警示性参照基准
        - Zhiyuan 现金和现金消耗未公开时，风险仍高
        - 无法在下行情景下证明 18+ 个月资金续航期
        - 现金、债务、资金续航期和下行情景融资计划。
    notes: 否决条件刻意以证据为准，而不是叙事为准。
    claimRefs:
      - CR032
      - CR033
      - CR034
      - CR035
      - CR036
      - CR037
  - id: TV001
    title: 建议摘要表
    columns:
      - 字段
      - 当前判断
      - 原因
      - 含义
    rows:
      - - 建议
        - 跟踪
        - 可信的品类领导者，但公开经济性不完整
        - 保持跟进，但推迟激进定价假设。
      - - 置信度
        - 中
        - 证据不是空的，但分母仍不足
        - 如果收入和利润率披露改善，快速更新。
      - - 估值立场
        - 偏贵
        - 公开估值作为叙事锚点可以支撑，但相对已披露基本面偏贵
        - 要求按里程碑测算，而不是只按叙事定价。
      - - 风险评级
        - 高
        - 资本强度、集中度和披露缺口仍然重要
        - 提高信念前，要求硬尽调。
      - - 下一步
        - 深入尽调
        - 管理口径账目和客群披露可能显著改变建议
        - 直接访问数据室后重新测算。
    notes: 本摘要刻意区分公司吸引力与当前公开估值语境的吸引力。
    claimRefs:
      - CV001
      - CV015
      - CV016
      - CV040
  - id: TV002
    title: 投资论点 / 反方论点表
    columns:
      - 立场
      - 要点
      - 证据质量
      - 为何重要
    rows:
      - - 投资论点
        - 在这个品类里，出货和商业化势头异常强
        - 中高
        - 支撑真正的平台潜力，而不是纯概念价值。
      - - 投资论点
        - 工厂和采购环节已有具名客户证据
        - 中
        - 显示真实买方参与，并已嵌入工作流。
      - - 投资论点
        - 产品、模型和生态的宽栈可能配得上平台溢价
        - 中
        - 可支撑超越单一机器人本体的上行空间。
      - - 反方论点
        - 收入和利润率分母仍披露不足
        - 高
        - 在严肃测算下，估值会变脆弱。
      - - 反方论点
        - 客户证明仍集中，资本强度仍是结构性问题
        - 中高
        - 如果旗舰客户停滞或支持成本膨胀，下行风险会上升。
    notes: 反方论点不是理论推演；它直接来自公开来源仍未披露的信息。
    enumerationScope:
