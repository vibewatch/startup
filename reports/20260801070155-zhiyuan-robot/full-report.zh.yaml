      - number: '4.2'
        title: 单位经济性
        blocks:
          - type: paragraph
            body: >-
              公开单位经济性证据不完整，但方向上仍有用。披露最强的案例是 Fulin Precision：一支小型现场机器人队伍在三小时内处理了 800 多个箱子，管理层描述的劳动力替代区间，在常规运行下约等于 0.7
              名工人，全天候使用时最高可达 1.4 到 2 名工人。这个案例不能证明回本，但与当地每名工人每年约 RMB80,000 的人工成本放在一起，可以给出一阶 ROI
              视角。同一篇文章在成本侧同样重要：部署和维护需要技术人员，首次落地可能耗时数月，之后部署才会快得多。公开价格也很混乱。公开资料称 A2-W 可能落在 RMB400,000 到 RMB800,000
              的工业区间，而另一次管理层讨论提到另一型号低得多的入门价格。正确结论是，定价取决于产品和场景，支持经济性可能与机器人 BOM 一样重要。
