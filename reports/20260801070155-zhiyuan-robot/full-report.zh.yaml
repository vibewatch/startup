      - number: '1.2'
        title: 创始人与领导层
        blocks:
          - type: paragraph
            body: >-
              官方领导层披露实质改变了创始人叙事。公司现在公开点名 Deng Taihua 为创始人、董事长兼 CEO，Peng Zhihui 为联合创始人、总裁兼 CTO。相比只围绕 Peng
              互联网名气展开的流行说法，这给出了更正式的控制图景。Peng 仍然极其重要：独立报道把他与 Huawei Genius Youth 计划、早期 OPPO 经历和庞大的创作者关注度联系起来，这些给 Zhiyuan
              带来工业初创公司少见的品牌触达和人才磁力。但已披露的团队显示，公司运营面更宽，覆盖市场、具身业务运营、综合业务、科学和 HR
              等高管角色。公开报道还显示，高管会细致回应定价、供应链选择和商业化节奏，说明领导层优化的不只是机器人 R&D，还包括规模化部署。主要治理缺口不在于高管是谁，而在于董事会控制权、优先权和创始人投票权在幕后如何分配。
