  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan Robot 的正确市场边界，比「所有机器人」窄得多，又比「人形机器人硬件」略宽。官方材料显示，公司销售的不只是机器人本体，还包括具身 AI
              工具、数据服务和开发者基础设施。因此，这里的市场应是一组通用人形机器人系统，加上让机器人可部署的周边具身软件和服务层。同时，公司并没有理由把无关的工业机械臂、纯软件助手或通用自动化都纳入同一个分母。边界应包含人形机器人以及直接附着的栈——模型、工具、数据和运营服务——并排除没有产品重叠的相邻自动化品类。这一点重要，因为宽泛的机器人
              TAM 可以让任何初创公司看起来很大；纪律化的具身人形机器人市场框架，才让 Zhiyuan 的真实可触达市场和举证负担能与 Figure、Unitree、UBTECH、Agility、Apptronik
              等同行比较。
            claimRefs:
              - CM001
              - CM002
