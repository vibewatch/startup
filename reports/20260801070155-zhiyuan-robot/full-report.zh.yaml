        - 质量不一或铺开变慢
        - 高
        - 部署不完全由内部掌控，依赖伙伴执行
        - 要求提供伙伴质量审核流程和升级责任归属。
      - - 渠道 / 区域伙伴
        - 海外品牌一致性不足或服务覆盖弱
        - 中高
        - 伙伴主导的扩张可能跑在运营控制前面
        - 要求提供伙伴认证和区域支持地图。
      - - 已披露旗舰客户
        - 集中度和标杆客户风险
        - 高
        - 少数客户可能承担不成比例的叙事和收入权重
        - 要求提供头部客户集中度和续约状态。
      - - 关键组件 / 供应商
        - 交期或采购冲击
        - 高
        - 出口管制和单一来源部件可能拖累交付
        - 要求提供 BOM 集中度和双供应源准备度。
      - - 跨境政策环境
