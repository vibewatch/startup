              财务风险仍然偏高，主要因为公开记录不对称：野心和部署信号多，现金充足性和单位经济性信号少。UBTECH
              年报在这里有用，因为它证明，即便一家规模更大、已经上市的人形机器人同行收入增长、毛利率改善，也仍会消耗大量现金并持续亏损。这说明品类资本密集度是结构性的，而不是暂时现象。Zhiyuan
              的具体问题是缺少直接披露。投资者没有公开现金、债务、财务约束条款或应收账款数据，无法压力测试下行场景。因此，TrendForce 和 IDC
              的出货领先叙事应读作市场地位信号，而不是资产负债表安慰剂。一家公司可以在单位数上领先，却在流动性韧性上落后。
