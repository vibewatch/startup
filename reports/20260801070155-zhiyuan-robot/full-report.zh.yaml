  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层
        blocks:
          - type: paragraph
            body: >-
              按工作流而不是只按行业标签，最容易理解 Zhiyuan 的公开客户地图。最强的可见细分是结构化工业制造，机器人可以插入分拣、搬运和检测任务，并有可衡量的劳动力或吞吐逻辑。电信或战略采购是第二个可见桶，China
              Mobile 更像掌握预算的买方，而不只是演示东道主。第三个桶是伙伴主导的商业化，APC 2026 以及英国、ANZ
              后续活动暗示，本地伙伴可能帮助把技术转成部署。公司信息中也出现服务、旅游和交互场景，但第三方客户证据轻得多。这意味着 Zhiyuan
              的客户基础并未在各细分之间均衡。目前权重更偏向那些能在结构化企业式工作流中为机器人找到理由的买方，这比消费者炒作更健康，但如果只有少数这类买方真正放量，集中度风险仍会留下。
