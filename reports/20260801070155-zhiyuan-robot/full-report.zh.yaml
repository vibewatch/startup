      - number: '5.4'
        title: 信任与安全
        blocks:
          - type: paragraph
            body: >-
              公开来源中的信任证据有正有负。积极一面，一篇现场报道显示，当有人接近工厂地面上的机器人时，机器人会立即停止；中国标准和政策环境也在走向更明确的人形机器人安全、应用和互操作预期。这些都是有用锚点。但本报告审阅的公开记录，对企业买方想看的具体控制披露很薄：正常运行时间历史、正式事故率、已发布
              SLA、网络安全架构、环境数据的隐私处理，以及点名认证都披露不足。这不是学术问题。具身系统运行在真实工作空间中，采集运营数据，并且越来越依赖云连接的模型和工具层。因此，公司的技术可信度走在公开信任披露前面。正确尽调姿态，是把政策和基准进展视为顺风，同时在假设企业级准备度之前，要求一套具体得多的控制包。
