            body: >-
              公开证据强烈说明，人形机器人公司需要深厚资本池；但对 Zhiyuan 自身资产负债表的说明很弱。Apptronik 的巨额股权融资、Figure 的高产量制造推进，以及 UBTECH
              作为上市公司的大额现金和借款披露，都说明严肃竞争者要同时资助硬件放量、软件迭代和部署支持。UBTECH 是最具体的基准：即便 2025 年收入超过 RMB2.0
              billion、毛利率改善，它仍报告大额净亏损和有意义的经营现金消耗。这个基准重要，因为 Zhiyuan
              还没有以类似细度披露现金、借款或应收账款余额。投资者目前无法直接测算现金续航期，应假设融资依赖会持续，直到商业收入和服务经济性披露得更清楚。下一轮融资的触发点很可能不只是「增长资本」，而是证明部署转化和安装后支持可以扩张，同时不吞掉不成比例的现金。
