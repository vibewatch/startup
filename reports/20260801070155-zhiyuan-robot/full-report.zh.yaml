      - number: '1.5'
        title: 里程碑与未解缺口
        blocks:
          - type: paragraph
            body: >-
              浮现出的战略图景，是一家公司正在从成立快速迈向平台化，但仍要求外部投资者跨过几个关键披露缺口。官方发布给出了可信的里程碑序列：早期注册、数月内推出首个产品、2024 年上海制造落地、2025
              年发布具身模型和工具、2026
              年提出更大的公开出货或展示主张。独立报道又补上了融资、工业订单和商业化压力的证据。但一些最重要的尽调事实仍顽固地停留在私域，或彼此矛盾。公开来源没有给出经审计收入、当前债务、准确员工数或最终轮次文件；2026 年
              IPO
              叙事仍是计划，而非交易所申报文件；版权案件和全栈模式争议等反向信号也说明，公司不会因为可见度高就已经去风险。后续章节的正确结论既不是「只有泡沫」，也不是「赢家已经证明」，而是「真实的类别领导者，但投资判断仍有重大盲区」。
