  - id: TV003
    title: 乐观 / 基准 / 悲观场景表
    columns:
      - 场景
      - 核心假设
      - 示例估值区间（USD bn）
      - 建议含义
      - 关键里程碑
    rows:
      - - 乐观
        - 出货领先转化为企业客户重复扩张、更清晰经济性和海外伙伴变现
        - 2.8-4.0
        - 披露显著改善时选择性投资
        - 多个旗舰客户扩张，收入 / 利润率桥接变得可信。
      - - 基准
        - 商业势头延续，但经济性仍只部分披露
        - 1.6-2.2
        - 跟踪，等待证据
        - 当前估值仍可辩护，但并不明显便宜。
      - - 悲观
        - 订单转化慢、服务负担居高不下，在强经济性出现前又启动一轮融资
        - 0.8-1.3
        - 避免追高
        - 旗舰订单没能转为持久标杆部署。
    notes: 区间是分析估算，不是市场事实；用途是在公开证据下框定投资测算结果。
