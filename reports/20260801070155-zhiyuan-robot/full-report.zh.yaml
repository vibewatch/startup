            body: >-
              公开画像显示，估值领先、部署领先和定价透明度之间分裂明显。Figure 完成估值 $39 billion 的 C 轮融资后，是最显眼的估值异类，也通过 BMW 拿到异常强的点名企业证据。Unitree
              在硬件和组件表面更透明，外部分析师把它与 AgiBot 一起放在中国出货曲线顶端。UBTECH 是严肃的工业竞争者，因为 Walker S 明确围绕工厂场景定位，而不是新奇互动。Agility 和
              Apptronik 还没有展示出与中国领导者相同的公开台数规模，但两者都投入大量精力建设商业化基础设施、设施和伙伴关系，后续可能变得重要。Zhiyuan
