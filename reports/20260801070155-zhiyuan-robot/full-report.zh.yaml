  - id: TV005
    title: 投资逻辑破裂与止损触发因素表
    columns:
      - 触发因素
      - 为何打破投资逻辑
      - 当前可见度
      - 立即动作
    rows:
      - - 旗舰订单未能放大为真实且持久的部署
        - 会直接削弱商业化叙事
        - 中
        - 暂停投资，要求提供部署队列证据。
      - - 下一轮融资窗口已推进，收入 / 毛利率披露仍缺位
        - 估值几乎只能靠叙事支撑
        - 高
        - 没有分母证据，就拒绝溢价定价。
      - - 支持负担或事故显著上升
        - 会同时伤到毛利率和标杆客户质量
        - 低-中
        - 要求审查服务 KPI 和事故日志。
      - - 下一轮融资在证据薄弱或重度稀释下完成
        - 说明经济性跟不上故事
        - 低
        - 重算下行情景下的持股比例和资金需求。
      - - 数据 / 法律治理失灵拖慢企业采用
        - 会同时打击客户信任和退出选择
        - 低
        - 立即升级法律与安全尽调。
    notes: 这些触发因素划出边界：故事再有潜力，到了这些点就不该再享受估值上的宽容。
    claimRefs:
      - CV029
      - CV033
      - CV034
      - CV035
  - id: TV006
    title: 最终尽调索取清单表
    columns:
      - 尽调索取项
      - 为何重要
      - 会改变什么？
    rows:
      - - 月度收入与毛利率桥接表
        - 补上所有严肃估值方法缺失的分母
        - 如果数据强，立场可能从偏高转为合理。
      - - 客户队列 / 扩张表
        - 区分一次性客户标识和持续采用
        - 可能显著提高推荐置信度。
      - - 支持与服务负担指标
        - 检验部署能否以合算成本放大
        - 可能收窄或拉宽合理估值区间。
      - - 现金、烧钱速度、债务和现金跑道资料包
        - 厘清稀释和融资风险
        - 可能实质改变悲观情景的严重程度。
      - - 2025 轮融资条款和股权结构表
        - 决定下行情景经济性和持股路径
        - 可能重塑对公开估值锚点的解读。
    notes: 这些是最可能改变投资决定的最低尽调索取项，不是穷尽清单。
    claimRefs:
      - CV034
      - CV035
      - CV036
      - CV037
      - CV040
