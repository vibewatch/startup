              招标也是有用代理指标，因为正式采购意味着门槛高于随意试用。即便如此，公开记录没有给出流失、续约、SLA
              或正常运行时间分母。因此，耐久性仍是推断，而不是已披露指标。投资者应区分三件很不同的事：机器人出现在现场、客户为更多设备承诺预算、客户实现足够价值并反复续约或扩张。Zhiyuan
