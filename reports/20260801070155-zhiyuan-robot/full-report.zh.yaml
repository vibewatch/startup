  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan 所在的同行集合正在快速成形，但并不是每家机器人公司都同样重要。当前最值得比较的一组包括 Unitree、Figure AI、UBTECH、Agility Robotics 和
              Apptronik，因为它们都公开表达了通用人形机器人野心，并且至少有部分企业商业化路径。格局也要放在现状替代品旁边看：固定自动化、轮式物流机器人，以及更简单的工业系统，在不需要人形灵活性时，往往能更便宜地解决很多任务。这个区分重要，因为人形机器人初创公司不只是在和其他人形机器人竞争，也在和「够用就好」的自动化竞争。在直接同行中，中国玩家目前在硬件规模化节奏和供应链密度上更强，美国同行则在资本市场叙事和高端品牌上更强。因此，核心比较不只是机器人对机器人，而是在不同举证负担下，运营模式对运营模式。
