  - id: TR004
    title: 人员 / 执行风险登记表
    columns:
      - 风险
      - 公开证据
      - 严重性
      - 为何重要
      - 尽调要求
    rows:
      - - 产品线范围蔓延
        - 可见产品组合很宽，模块也在拆分孵化
        - 高
        - 在服务纪律最关键时，过宽布局会削弱焦点
        - 要求提供组织架构、P&L 归属和路线图优先级。
      - - 部署团队扩张
        - 明确需要现场专家
        - 高
        - 客户成功靠执行产能，不只靠硬件质量
        - 要求按部署和支持岗位提供人员数。
      - - 商业化纪律
        - 订单和试点可能跑在可复制流程前面
        - 中高
        - 流程控制弱会伤害利润率和标杆客户
        - 要求提供从试点到规模化铺开的阶段门标准。
      - - 管理层对旗舰叙事的依赖
        - 品类热度会推高激进扩张压力
        - 中
        - 叙事驱动扩张会扭曲运营决策
        - 要求提供董事会层面的风险治理和 KPI 看板。
      - - 财务运营成熟度
        - 虽有规模化野心，但未公开资金管理细节
        - 高
        - 流动性失误会很快变成生死问题
        - 要求提供预算节奏、契约监控和资金管理控制。
    notes: 人员和执行风险叠加了组织设计、商业化流程和财务纪律。
