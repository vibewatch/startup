      - number: '1.3'
        title: 融资与投资方
        blocks:
          - type: paragraph
            body: >-
              即使具体轮次经济性仍不完整，公开融资证据的方向性已经很强。独立 2025 年报道称 Tencent 领投了 2025 年 3 月轮次，JD 以及 Shanghai Embodied Intelligence
              Fund 参与了后续融资；Zhidx 则描述 2025 年 3 月估值约 US$2.07 billion，或约 RMB 14.7-15.0 billion。这个区间足够一致，可以把 Zhiyuan
              视为独角兽，但还不够精确，不能假装公开记录已经给出完整股权结构真相。投资方构成比单个头条数字更关键。公开报道显示，Zhiyuan 同时拿到财务 VC 和战略产业资本，包括 Tencent、JD、SAIC、LG
              Electronics、Mirae Asset，以及 Baidu Ventures、Dinghui、C Capital 等较早投资方。这样的组合支撑一个判断：Zhiyuan
              搭建的不只是融资栈，也是在搭建分销、制造和生态联盟。IPO 讨论仍需谨慎处理：当前公开报道把香港上市计划描述为 2026 年目标或情景，而不是已经完成的融资事件。
