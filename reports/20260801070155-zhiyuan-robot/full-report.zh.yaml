  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 为何重要
      - 公开锚点
      - 估值用途
      - 局限
    rows:
      - - UBTECH
        - 最接近的中国人形机器人公开运营参照基准
        - 2025 年年报及 HKEX 披露的公司更新
        - 最适合判断已披露经济性和资本强度
        - 公开市场倍数不能直接套用到非上市 Zhiyuan。
      - - Figure AI
        - 全球前沿模型 / 旗舰客户溢价参照基准
        - $39B Series C 估值
        - 可用于上限叙事语境
        - 其溢价叙事远厚于 Zhiyuan 当前披露集。
      - - Apptronik
        - 资本强度和企业伙伴参照基准
        - $5B 估值 / >$935M Series A 语境
        - 可用于判断融资胃口和战略客户信号
        - 仍为非上市公司，不是干净的经营倍数可比。
      - - Unitree
        - 硬件透明度和定价语境
        - 公开产品和定价线索
        - 可用于硬件市场语境
        - 留存来源中没有完整披露估值，不能作为完整可比对象。
      - - Zhiyuan 当前估值
        - 2025 私人融资公开媒体锚点
        - ~$2.07B / RMB15B
        - 当前投资测算讨论的参考点
        - 轮次条款和分母仍披露不足。
    notes: 可比对象有意选得不完全同质；重点是做情境三角校验，而不是算一个假精确的平均倍数。
