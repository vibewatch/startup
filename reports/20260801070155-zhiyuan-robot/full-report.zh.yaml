              - CV038
              - CV039
      - number: '8.6'
        title: 退出与尽调
        blocks:
          - type: paragraph
            body: >-
              退出可选项存在，但今天不应高估。公开报道讨论过最终赴港的路径，UBTECH
              等同行也说明，中国人形机器人公司走向公开市场并非不可想象。战略并购或后续交叉轮也有可能。但任何路径都不能用来替代缺失的基本面。在提高确信度之前，投资人应要求一组最能改变投资判断的事实：实际收入、扣除服务负担后的毛利率、头部客户集中度、流动性续航，以及旗舰订单正在变成可复制部署而非孤立新闻的证据。尽调要求不是流程动作。它们决定投资人买到的是强前沿资产，还是包装精美的不确定性。
            claimRefs:
