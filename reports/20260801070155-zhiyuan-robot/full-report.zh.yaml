        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              公开财务结论是有前景但仍不完整。Zhiyuan
              看起来已经从概念期叙事跨入真实商业化，拥有点名企业订单、部署证据，以及比单一机器人销售更宽的变现表面。但公司仍很难用普通成长股权投资框架做投资判断，因为关键分母缺失：按型号实现的
              ASP、按部署类型划分的收入、扣除服务负担后的毛利率、应收账款账龄、库存结构和月度现金消耗。公开同行申报和融资公告说明了这为什么重要。人形机器人里，收入可以很快上升，但亏损和资本需求仍然很大，尤其当支持、数据和制造成本并行扩张时。审慎结论是，Zhiyuan
              正在形成可信收入引擎，但还没有形成公开市场质量的财务模型。下一轮尽调应少看头条估值，多看现金转化、利润率轨迹和可重复部署经济性。
