  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与使命
        blocks:
          - type: paragraph
            body: >-
              理解 Zhiyuan Robot，更合适的框架是上海具身 AI 机器人公司，而不是只做单一人形机器人演示的团队。官方中英文材料持续把中文公司身份 智元创新 与国际品牌 AGIBOT
              放在一起，并把使命表述为「用智能机器创造无限生产力」。这些页面重要，因为它们也界定了公司的经营范围：全栈机器人、智能算法、开放平台，以及更大的应用生态。官方简介给出了目前公开证据中最清晰的成立时间线：2023 年
              2 月公司注册，2023 年 8 月首款 Expedition A1 发布。这条时间线比种子轮语境更精确，也说明公司从注册到公开硬件发布的速度异常快。公开产品面已经覆盖 Expedition
              人形机器人、Lingxi 与 Genie 平台、数据服务和工具链，因此后续章节应把 Zhiyuan 当作平台加产品公司来分析，而不只是一个拿着单一人形机器人原型的研究团队。
