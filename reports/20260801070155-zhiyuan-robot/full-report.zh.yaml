      - number: '2.2'
        title: 市场规模
        blocks:
          - type: paragraph
            body: >-
              公开市场规模估算在方向上一致，在量级上分歧很大。IDC 的 2026 年人形机器人研究是当前最有用的锚点，因为它把品类落在 2025 年的实际出货和收入上：约 18,000 台、约 US$440 million
              收入，中国厂商领先。随后，预测机构把空间放大到远高于这批装机基数：Mordor 估计 2026 年市场为 US$3.93 billion，到 2031 年升至 US$17.8 billion；Global
              Market Insights 则估出更大的 2026 年 US$10.9 billion，以及 2035 年 US$192.7 billion。这些数字都不能不经转换就当成 Zhiyuan
              的近期可触达市场。更合适的解释是三层镜头：长期广义 TAM 很大，近期 SAM 小得多，主要是中国工业 / 商业部署；当前已证明的 SOM 更小，因为只有少数用例有清楚的公开证据。
