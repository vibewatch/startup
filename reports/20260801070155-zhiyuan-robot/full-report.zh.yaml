              - CV029
              - CV034
      - number: '8.5'
        title: 可比公司
        blocks:
          - type: paragraph
            body: >-
              可比公司只有在克制使用时才有价值。Figure 应被看作溢价叙事和前沿模型基准；Apptronik 是资本强度和企业伙伴基准；UBTECH 是最清晰的公开运营基准。Unitree
              提供硬件定价背景，但不是披露完整的公开估值案例。因此，直接算「同行平均倍数」弊大于利：可比组混合了上市公司财务披露、私募巨额融资叙事，以及部署透明度差异很大的公司。更好的用法，是比较每条叙事当前背后有多少证据、披露和资本。按这个标准，Zhiyuan
              强于单纯概念项目，但还弱于那种没有毛利率或收入分母也配得上干净溢价的公司。
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV031
              - CV032
              - CV038
              - CV039
