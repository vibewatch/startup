      - number: '3.4'
        title: 护城河评估
        blocks:
          - type: paragraph
            body: >-
              这个品类中最强的护城河，可能不是某一次演示、某个执行器或某个模型检查点，而是数据采集、部署、服务反馈、供应链深度、制造执行和融资耐力之间的闭环。按这个定义，Zhiyuan
              在中国拥有一个可信护城河，因为它把广泛的公开产品、产业投资方、可见订单和快速放量制造叙事组合在一起。但护城河尚未定型。Figure 拥有更多资本和一个全球共振的企业旗舰客户。Unitree
              的硬件价格可读性可能相当甚至更强。UBTECH 具备上市公司成熟度和工业焦点。Apptronik 与 Agility 的商业化基础设施，未来可能转化为更强的企业耐久性。因此，Zhiyuan
              的护城河论点真实存在，但仍有条件：按中国生态执行衡量时最好看，按全球可比披露质量和重复付费部署衡量时最弱。
