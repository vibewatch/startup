  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险概览
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan 的风险图景不是一个单独的「技术风险」框，而是横跨监管、运营、伙伴和资本的分层投资判断问题。中国政策整体支持机器人和具身
              AI，但同一股政策动能也在提高安全、测试、网络安全和治理标准。公开现场证据显示，公司已经进入真实工厂环境，这在战略上是积极的，但也意味着错误现在会带来物理、商业和法律后果。与此同时，商业化模式依赖一小簇点名客户和不断扩宽的伙伴网络，资产负债表仍不透明。因此，正确的风险框架是双面的：相比许多早期人形机器人初创公司，Zhiyuan
              有更多真实世界牵引力；但牵引力提高了合规、服务纪律和现金管理的重要性，而不是降低这些要求。
