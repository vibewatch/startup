              Mobile 招标显然是项目型收入；Fulin Precision
              工厂证据则显示，公司先把机器人嵌入工作流，再扩大量。因此，收入质量很可能取决于验收里程碑、部署服务和特定站点工作，而不只是出货台数。投资者应把出货头条当作领先指标，而不是收入报表本身。
