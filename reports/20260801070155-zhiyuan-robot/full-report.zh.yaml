      - CR013
      - CR014
      - CR015
      - CR016
      - CR017
      - CR018
  - id: TR003
    title: 合作伙伴 / 依赖风险登记表
    columns:
      - 依赖项
      - 风险
      - 严重性
      - 为何重要
      - 尽调要求
    rows:
