      items:
        - label: APC 伙伴
          value: 2500
          details: APC 2026 称，2,500+ 家伙伴参会。
        - label: 覆盖国家
          value: 30
          details: APC 2026 称，参会方来自 30 多个国家。
        - label: 具名客户 / 采购证明
          value: 4
          details: Fulin、China Mobile、Chery 和 Longcheer 是最清晰的具名公开证明。
        - label: 规模化订单证明
          value: 2
          details: Fulin 近 100 台、China Mobile 大额招标，是最清晰的规模信号。
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 按细分场景和证明深度看，Zhiyuan 当前客户证明最强的位置。
    approximationNotes: 仅为基于公开证据的定性解读。
    claimRefs:
