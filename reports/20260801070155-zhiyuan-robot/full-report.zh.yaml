  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 基于公开证据，按影响和发生可能性梳理最重要的风险簇。
    approximationNotes: 单元格使用从已审阅公开证据综合出的定性评分，不是精算损失历史。
    claimRefs:
      - CR001
      - CR007
      - CR010
      - CR014
      - CR024
      - CR027
      - CR036
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓释成熟度
      rows:
        - label: 安全 / 运营失效
          values:
            - 高
            - 高
            - 中低
        - label: 数据 / 合规失效
          values:
            - 中高
            - 高
            - 中低
        - label: 客户集中
          values:
            - 高
            - 中高
            - 低
        - label: 供应商 / 地缘政治冲击
          values:
            - 中
            - 高
            - 低
        - label: 流动性缺口
          values:
            - 中高
            - 高
            - 低
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 上游合规和执行风险如何传导到客户、利润率和融资结果。
    approximationNotes: 传导链条基于公开证据和法律框架推断。
    claimRefs:
      - CR007
      - CR010
      - CR016
      - CR024
      - CR028
      - CR032
      - CR038
    data:
      nodes:
        - id: n1
          label: 安全 / 可靠性问题
          details: 现场事故、低可用率或场景失败。
        - id: n2
          label: 数据 / 法律不合规
          details: 隐私、网络安全或责任控制缺口。
        - id: n3
          label: 客户扩张放缓
          details: 标杆客户未能扩大规模或续约。
        - id: n4
          label: 利润率压缩
          details: 支持、返工和合规成本上升。
        - id: n5
          label: 融资压力
          details: 证明力度较弱时，资本需求上升。
      edges:
        - from: n1
          to: n3
          details: Poor reliability reduces reference-account expansion.
        - from: n1
          to: n4
          details: Rework and service burden increase cost.
        - from: n2
          to: n3
          details: Compliance concerns slow enterprise buying.
        - from: n2
          to: n5
          details: Legal exposure weakens financing confidence.
        - from: n3
          to: n5
          details: Slower expansion makes fundraising harder.
        - from: n4
          to: n5
          details: Worse margins reduce runway.
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Zhiyuan 放大规模，要靠客户、伙伴、部件和政策条件织成的紧耦合网络。
    approximationNotes: 依赖节点由公开部署、伙伴和法律证据综合而来。
    claimRefs:
      - CR019
      - CR020
      - CR021
      - CR022
      - CR023
      - CR024
      - CR025
      - CR039
      - CR040
    data:
      nodes:
        - id: d1
          label: 标杆客户
          details: Fulin、China Mobile、Chery、Longcheer 及类似客户。
        - id: d2
          label: 集成商 / 伙伴
          details: 部署专家、区域伙伴和渠道。
        - id: d3
          label: 关键部件
          details: 高规格硬件，以及进口或敏感部件。
        - id: d4
          label: 政策环境
          details: 标准、出口管制和数据规则。
        - id: d5
          label: 资本提供方
          details: 支持规模扩张的现有和未来投资者。
      edges:
        - from: d2
          to: d1
          details: Partner quality affects customer success.
        - from: d3
          to: d1
          details: Component availability affects delivery and uptime.
        - from: d4
          to: d2
          details: Policy shapes where and how partners can operate.
        - from: d4
          to: d3
          details: Export-control rules shape component access.
        - from: d1
          to: d5
          details: Customer proof influences financing confidence.
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议来自两股力量的抵消：品类和证明信号很强，但公开经济性弱、风险高。
    approximationNotes: 该流程压缩了本章推理链，并非完整投资备忘录。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV015
      - CV016
      - CV040
    data:
      nodes:
        - label: 强市场与出货叙事
          details: 大 TAM 和可信的中国领先地位，让公司仍具可投性。
        - label: 真实客户与产品证明
          details: 具名部署和多触点平台拓宽上行空间。
        - label: 经济性披露仍不足
          details: 收入、利润率、烧钱速度和集中度仍过于不透明。
        - label: 建议：跟踪
          details: 保持接触；分母数据改善后重新做承销判断。
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 当前估值信心对经济性披露和标杆部署转化最敏感。
    approximationNotes: 条形使用 1-5 的相对敏感性评分，来自公开证据包。
    claimRefs:
      - CV010
      - CV018
      - CV023
      - CV029
      - CV034
    data:
      items:
        - label: 收入 / 利润率披露
          value: 5
          details: 公允价值信心的最大单一摆动因素。
        - label: 标杆客户扩张
          value: 5
          details: 决定部署证明会复利放大，还是停滞。
        - label: 资本强度 / 稀释
          value: 4
          details: 品类资金需求高，可能压缩股权价值。
        - label: 市场增长信心
          value: 3
          details: 重要，但不如公司自身证明那样决定性。
        - label: 退出可选性
          value: 2
          details: 有帮助，但不确定性太高，难以主导当前价值。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 当前视角下乐观、基准和悲观结果的示意估值区间。
    approximationNotes: 区间是基于公开市场位置、风险和同业背景的分析估算，不是市场价格。
    claimRefs:
      - CV004
      - CV006
      - CV023
      - CV024
      - CV025
      - CV026
      - CV027
      - CV028
    data:
      items:
        - label: 悲观情景估值（USD bn）
          low: 0.8
          mid: 1
          high: 1.3
        - label: 基准情景估值（USD bn）
          low: 1.6
          mid: 1.9
          high: 2.2
        - label: 乐观情景估值（USD bn）
          low: 2.8
          mid: 3.4
          high: 4
        - label: 当前公开锚点（USD bn）
          low: 2.07
          mid: 2.07
          high: 2.07
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 投委会视角下的浓缩判断：Zhiyuan 当前哪里得分高，哪里仍缺证明。
    approximationNotes: 定性 KPI 面板，不是量化计分卡。
    claimRefs:
      - CV002
      - CV007
      - CV011
      - CV013
      - CV015
      - CV016
      - CV040
    data:
      items:
        - label: 市场机会
          value: High
          details: 多方资料仍支持品类有较大上行空间。
        - label: 客户证明
          value: Medium-high
          details: 真实客户存在，但证据组合仍然集中。
        - label: 经济性披露质量
          value: Low-medium
          details: 分母数据包仍太薄，难以做扎实的投资测算。
        - label: 资本强度风险
          value: High
          details: 同业申报和融资显示，持续资本需求很重。
        - label: 当前估值吸引力
          value: Medium-low
          details: 公司有意思，但公开证据看不出明显便宜。
        - label: 建议
          value: Track
          details: 在经济性和稀释路径更清楚前，最适合保持跟踪。
