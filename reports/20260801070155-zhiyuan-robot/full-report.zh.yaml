  - id: TR002
    title: 运营 / 质量 / 安全风险登记表
    columns:
      - 风险
      - 信号
      - 严重性
      - 为何重要
      - 尽调要求
    rows:
      - - 近人作业安全风险
        - 工厂报道显示机器人会主动停止，也处在繁忙环境中
        - 高
        - 安全设计必须在真实工业场景里站住，不只是演示
        - 要求提供危险分析、事故和险兆日志。
      - - 模型泛化风险
        - 训练偏重仿真，现场变量仍然存在
        - 高
        - 意外环境会制造故障或服务负担
        - 要求提供故障分类和真实世界再训练闭环指标。
      - - 服务和维护负担
        - 运维需要熟练人员和部署适配
        - 高
        - 现场服务负荷会侵蚀客户经济性和可扩展性
        - 要求按客群提供 MTTR、支持人员配置和问题积压。
      - - 网络安全与遥测风险
        - 机器人和云工具会形成数据攻击面
        - 中高
        - 安全薄弱点可能影响客户和监管方
        - 要求提供安全架构、渗透测试历史和响应手册。
      - - 工作流可靠性风险
        - 工业客户要求任务执行和正常运行时间保持稳定
        - 高
        - 表现不稳会很快打掉标杆客户
        - 要求提供正常运行时间、任务成功率和升级流程。
    notes: 多数关键运营指标未公开，因此本表区分已观察到的风险和缺失的控制证据。
