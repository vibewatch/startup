      - number: '2.5'
        title: 尽调缺口
        blocks:
          - type: paragraph
            body: >-
              本章的主要尽调问题不是缺少乐观，而是缺少分母。公开来源可以展示品类扩张、中国政策支持、同行商业化方向，甚至广泛出货增长。它们还不能展示清晰的 Zhiyuan 专属 SAM 或 SOM、按细分稳健计算的
              ROI，或按客户类型划分的渗透率。预测机构分歧也太大，任何单一报告都不应主导估值讨论。最安全的分析姿态，是保留彼此冲突的估算，而不是把它们平均成虚假的精确。因此，后续章节要把市场规模按区间处理，买方准备度按细分判断，采用时点受举证负担和标准落地约束。Zhiyuan
              显然参与了未来十年最重要的硬件 AI 品类之一，但当前公开记录仍支持一条谨慎、受证据约束的市场论点，而不是简单的「市场巨大，所以赢家必然」结论。
