      - number: '2.4'
        title: 增长驱动与约束
        blocks:
          - type: paragraph
            body: >-
              最强的市场驱动因素已经熟悉，并且在公开研究中越来越可见：人口老龄化、结构化物理工作流里的劳动力短缺、组件成本下降、具身模型表现提升，以及人形机器人无需彻底重建基础设施就能使用人类设计的环境。中国政策也是实实在在的顺风，不只是叙事装饰。机器人计划、人形机器人指引和
              2026
              年标准活动都显示，监管者希望品类走出演示。但市场约束仍然很重。可靠性、泛化、安全、算力依赖、场景集成和客户经济性证明，仍主导采用风险。管理层自己也承认，广泛部署取决于性价比提升和更强模型能力。换句话说，增长故事真实存在，但品类仍在从试点阶段的兴奋，跨向部署阶段的纪律。投资者需要判断这次跨越的速度，而不只是最终
              TAM 的大小。
