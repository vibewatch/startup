              公开缓释图景令人鼓舞但不完整。正向信号包括：现场基本安全行为证据、愿意参与正在形成的标准环境、公开承认部署学习很重要，以及能拓宽市场触达的生态策略。但最强的缓释仍然留在私域：经审计控制包、事故日志、支持
              KPI、供应商应急方案和流动性纪律。正确的尽调回应不是假设公司暴露过度，而是在投入新资本前设下硬证据门槛。如果 Zhiyuan
              不能证明旗舰订单可以转成稳定现场部署，不能产出可辩护的治理和数据控制，或不能显示服务负担可持续扩张，那么即便头条市场叙事仍然火热，这些都应成为否决标准。
