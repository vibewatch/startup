      - number: '3.5'
        title: 竞争风险
        blocks:
          - type: paragraph
            body: >-
              主要竞争风险，是软件和服务护城河完全成形前，硬件先走向商品化。如果多家厂商都能在结构化任务中做到「够用」的移动、操作和可靠性，那么资本、分销和服务经济性可能比任何单一技术突破都更重要。因此，公开定价透明度弱并不是旁注，而是护城河争论的核心。另一个风险是，高额私人估值会遮蔽其他玩家更低调但更持久的客户证据。最后一个风险是战略过度延展。Gasgoo
              对 Zhiyuan
              灵巧手策略的反向分析，凸显了全栈公司可能赢得注意力，却同时面对焦点拉扯。实际结论是，投资者不应只按演示或估值给同行排序，还要看谁正在搭建可重复的部署闭环，谁仍主要依赖品牌热度。按这个标准，赛场仍足够流动，今天的排行榜可能很快改写。
