      - number: '1.4'
        title: 规模与牵引力
        blocks:
          - type: paragraph
            body: >-
              在私人化的人形机器人公司中，Zhiyuan 的公开牵引力证据异常强，但其中混合了出货、试点、订单和营销里程碑，不能混为一谈。官方材料显示，公司在 2025 年累计通用机器人突破 1,000 台，随后声称到
              2026 年中具身机器人达到 15,000 台；Forbes 报道称，2026 年 3 月前总出货 10,000 台，其中单季度出货 5,000 台。TrendForce 另称 AgiBot 和 Unitree
              可能是中国 2026 年人形机器人产量领先者。客户证据也更具体：China Times/Tencent News 的画像提到 China Mobile 和 Chery
              订单，以及其他数百万元级合同；管理层还公开讨论过某一型号低至 RMB 98,000
              的产品定价。即便如此，公开记录仍无法把这些事实换算为经审计收入、装机利用率或清晰员工数。活跃招聘和出货里程碑证明了动能，但还没有证明成熟披露质量。
