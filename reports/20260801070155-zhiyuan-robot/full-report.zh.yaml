      - number: '3.3'
        title: 能力对比
        blocks:
          - type: paragraph
            body: >-
              从买方视角看，最重要的维度不是抽象的「AI 领先」主张，而是形态适配、部署证明、定价透明度、供应链韧性、灵巧操作和可维护性。Zhiyuan
              最清晰的比较优势，是产品组合宽度、中国生态密度和快速规模化叙事。Figure 最清晰的优势，是 BMW 带来的高端企业验证，以及无人匹敌的头条融资。Unitree 在硬件透明度和定价线索上得分较高。UBTECH
              的工业工作流框架较强；Apptronik 和 Agility 则在商业化基础设施和企业伙伴纪律更重要的场景下最强。值得注意的是，灵巧手和具身模型闭环正在成为明确的竞争变量。Gasgoo 对 Zhiyuan
              灵巧手剥离的反向解读也说明，同一个能筑护城河的全栈野心，如果焦点碎片化，也会制造战略拉扯。因此，买方不应把宽度直接等同于持久优势，除非宽度真正转化为部署和服务表现。
