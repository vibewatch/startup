      - number: '2.3'
        title: 买方分层
        blocks:
          - type: paragraph
            body: >-
              买方地图让公司自身故事变得更具体。Zhiyuan 的产品表面和媒体访谈暗示至少五个需求池：工业制造、物流和仓储、服务 /
              接待、科研教育，以及娱乐或品牌激活。每个池子的买方、用户和付款方都不同。工厂和物流运营方掌握劳动生产率预算，关心正常运行时间、载荷和
              ROI。服务场所和电信网点购买的是接待、引导和客户互动。科研买方买的是灵活性和开发者入口，而非近期生产率。娱乐或品牌客户为新奇感、互动和媒体价值付费。家用机器人是最大的长期叙事市场，但近期公开市场最弱，因为它要求最高的安全、可靠性和成本证明。就
              Zhiyuan 而言，最清晰的公开预算证据落在结构化工业和商业部署中，而不是品类故事承诺的广阔家庭市场。
