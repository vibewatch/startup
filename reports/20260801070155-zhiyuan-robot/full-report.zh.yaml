          - type: paragraph
            body: >-
              当前建议是「跟踪」。这不是模糊避险，而是承认真实潜力和证据不足之间存在明确错位。Zhiyuan
              的可信度已经高到不能忽视，尤其是出货位置和客户动能都在加强。但公开记录在收入分母、毛利率、服务负担和资产负债表强度上仍然太薄，还不足以支撑「几乎不问价格、现在就投」的高确信度姿态。投资人还要记住，私有人形机器人估值正处在叙事浓度很高的市场里，全球同行可以靠前沿模型兴奋感和战略可选项交易，而不是靠当期经济性。在这种环境下，纪律比速度重要。跟踪
              Zhiyuan，同时强力推动披露，可能比急着为经济性仍不透明的估值背书，创造更好的入场点。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
              - CV015
              - CV016
              - CV040
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV015
              - CV016
              - CV040
      - number: '8.3'
        title: 估值背景
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan 当前公开估值只能靠不完美但仍有用的锚点交叉校准。最可辩护的当前估值，是 2025 年媒体报道中的约 RMB 150 亿，约 US$2.07B。绝对值看，价格不便宜；但相较 Figure
              等美国最大私营同行叙事，以及 Apptronik 周边的溢价融资背景，它又明显更低。真正的问题不是 Zhiyuan 是否比 Figure
              便宜，而是在经济披露薄得多的前提下，相对溢价同行的折价是否足够大。UBTECH 提供了关键公开基准，因为它把规模化品类经济性摊开了：有真实收入、毛利率改善，但仍然大幅亏损、现金消耗重。UBTECH
              的公开基准说明，在 Zhiyuan 披露更多收入和毛利引擎之前，应先把它的私募估值视为偏贵。
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV004
              - CV006
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
      - number: '8.4'
        title: 情景
        blocks:
          - type: paragraph
            body: >-
              情景框架应围绕里程碑，而不是围绕可比公司倍数打转。牛市情景里，出货领先变成可持续的商业领先：客户案例持续叠加，海外伙伴活动转成付费账户，经济性披露足以支撑平台溢价。基准情景里，商业化继续推进，但公司仍只做到部分透明，投资人只能把它当作有前景但风险未消的成长故事估值。熊市情景里，订单转化慢于预期，支持和部署成本居高不下，未来融资发生在证据足以支撑当前叙事之前。相比点估值，更应强调情景，原因很简单：公开数据包还不足以支撑虚假的精确，但已经足以界定从今天往后，好的路径依赖和坏的路径依赖会长什么样。
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
              - CV033
          - type: table
            tableRef: TV003
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
          - type: figure
