      - number: '4.3'
        title: 成本结构
        blocks:
          - type: paragraph
            body: >-
              成本结构更像资本密集的系统业务，而不像软件公司。Zhiyuan 的公开材料暗示，公司需要同时投入机器人硬件、具身模型研究、数据基础设施、部署团队和方案工程。同行证据让图景更清楚。Figure 的 BotQ
              叙事、Apptronik 的制造和伙伴公告，以及 TrendForce 对规模驱动商业化的框架，都指向同一个机制：规模才能压低单位成本，但要达到规模，必须先砸下严肃的工厂、工具和组织投入。Fulin
              的部署细节又加了一层成本，因为公司需要场景调试、安全验证和集成支持。营运资金也可能是隐藏压力点。企业和国资客户可能按验收周期付款，而不是订单宣布时付款，这会在利润率成熟前制造应收账款和库存压力。因此，应把这个品类建模为硬件
              + 服务 + 数据，多重成本中心都会先于清晰收入能见度爬坡。
