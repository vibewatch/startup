      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              监管和法律风险栈已经具有实质性。人形机器人部署位于产品安全、工作场所互动、数据采集和日益政治化的技术贸易交汇处。中国机器人和人形机器人指引文件，以及正在形成的标准体系，为部署给出更清晰路径，但也抬高了安全和文档门槛。产品责任规则重要，因为机器人现在会在物理工作空间中行动；法律评论强调，制造商、运营方和软件层都可能分担责任。数据安全和隐私风险同样重要：具身系统会在客户设施内采集环境数据，因此《数据安全法》、2026
              年《网络安全法》修订以及更广的隐私框架，都不是抽象的合规背景。地缘政治供应风险又加上一层法律约束，因为出口管制和产业安全规则可能在预警有限的情况下扰乱组件、客户或海外交付义务。
