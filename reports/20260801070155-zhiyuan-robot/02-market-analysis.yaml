    - Enterprise operators, labs, service venues
    - Best fit for Zhiyuan's current public footprint.
  - - Embodied-AI platform tooling
    - Developer tooling, data collection, model training, integration
    - Horizontal enterprise AI not tied to robot deployment
    - Developers, research labs, robot OEM teams
    - Matches Genie Studio and research positioning.
  - - Industrial deployment budgets
    - Workcell labor substitution, handling, logistics, maintenance
    - Consumer gadget demand
    - Factory and logistics operators
    - Likely near-term budget pool with clearest ROI logic.
  - - Service / reception robots
    - Guidance, interaction, branch or venue automation
    - General smart-device marketing spend
    - Telecoms, venues, enterprises
    - Lower proof burden than home robotics.
  - - Home humanoid vision
    - Long-run domestic assistance and companionship
    - Current enterprise-only deployments
    - Consumers / households
    - Strategically large but weakly proven today.
  notes: Boundary logic distinguishes the company's real public product footprint from overbroad robotics TAM definitions.
