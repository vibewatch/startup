company:
  name: Zhiyuan Robot
chapter:
  number: 2
  title: Market Analysis
  summary: 'Zhiyuan Robot is participating in one of the fastest-growing but least standardized hardware-AI categories in the market: general-purpose humanoids plus their embodied-software and deployment stack. Public sources support a large long-run opportunity and unusually strong China-specific policy tailwinds, but they do not justify using broad TAM forecasts as if they were Zhiyuan''s near-term SAM or proven SOM. The right market read is therefore evidence-constrained: China leads commercialization, manufacturing and service use cases lead today, and buyer economics remain much less visible than shipment or valuation headlines.'
sections:
- id: market-definition
  title: Market definition
  body: The correct market boundary for Zhiyuan Robot is much narrower than “all robotics” and slightly broader than “humanoid hardware.” Official materials show the company sells not only robot bodies but also embodied-AI tooling, data services, and developer infrastructure. That makes the relevant market a bundle of general-purpose humanoid systems plus the surrounding embodied-software and service layers that make those robots deployable. At the same time, the company does not justify counting unrelated industrial arms, pure software copilots, or generic automation under the same denominator. The boundary should therefore include human-form robots and the directly attached stack—models, tools, data, and operating services—while excluding adjacent automation categories that lack product overlap. This matters because a broad robotics TAM can make any startup look large, while a disciplined embodied-humanoid market frame makes Zhiyuan’s actual addressability and proof burden more comparable
    to peers such as Figure, Unitree, UBTECH, Agility, and Apptronik.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM027
  - CM032
  tableRefs:
  - TM001
- id: market-sizing
  title: Market sizing
  body: 'Public market-size estimates agree on direction but not on magnitude. IDC’s 2026 humanoid study is the most useful current anchor because it grounds the category in actual 2025 shipments and revenue, describing roughly 18,000 units and about US$440 million of revenue with China vendors leading. Forecast houses then expand far beyond that installed base: Mordor estimates a US$3.93 billion market in 2026 rising to US$17.8 billion by 2031, while Global Market Insights estimates a much larger US$10.9 billion 2026 market and US$192.7 billion by 2035. None of these should be treated as Zhiyuan’s immediate addressable market without translation. The right interpretation is a three-layer lens: broad long-run TAM is large, near-term SAM is much smaller and mainly China industrial/commercial deployments, and currently proven SOM is smaller still because only a narrow set of use cases have clear public proof.'
  claimRefs:
  - CM005
