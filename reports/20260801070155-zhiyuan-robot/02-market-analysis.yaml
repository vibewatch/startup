- id: diligence-gaps
  title: Diligence gaps
  body: The main diligence problem in this chapter is not lack of optimism; it is lack of denominators. Public sources can show category expansion, Chinese policy support, peer commercialization direction, and even broad shipment growth. They cannot yet show a clean Zhiyuan-specific SAM or SOM, robust ROI by segment, or segment penetration rates by customer type. Forecast houses also disagree so widely that no single report should dominate the valuation discussion. The safest analytical posture is to preserve contradictory estimates rather than average them into false precision. For later chapters, that means treating market size as a range, buyer readiness as segment-specific, and adoption timing as constrained by proof burden and standards implementation. Zhiyuan clearly participates in one of the most important hardware-AI categories of the decade, but the current public record still supports a cautious evidence-constrained market thesis rather than a simple “huge market therefore inevitable
    winner” conclusion.
  claimRefs:
  - CM010
  - CM024
  - CM031
  - CM034
  - CM035
  - CM036
  - CM037
