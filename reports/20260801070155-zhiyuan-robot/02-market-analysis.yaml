  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: SAM-SOM denominator
    missingEvidence: Segment-specific deployment counts and budget denominators for Zhiyuan by manufacturing, logistics, service, and research.
    whyItMatters: Open TAM forecasts do not translate into a defensible near-term market share model without segment denominators.
    diligencePath: Request internal pipeline split by segment, geography, and average deployment size.
    relatedQuestionRefs:
    - QM021
    - QM025
  - type: conflicting-data
    severity: material
    topic: market estimate spread
    missingEvidence: Consistent methodology that reconciles IDC shipment economics with broad multi-year forecast houses.
    whyItMatters: Forecast ranges are too wide to use directly for valuation without boundary normalization.
    diligencePath: Rebuild market sizing from bottom-up scenario counts and compare against analyst top-down ranges.
    relatedQuestionRefs:
    - QM003
    - QM024
