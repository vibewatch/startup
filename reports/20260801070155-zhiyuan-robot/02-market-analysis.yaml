- id: buyer-segmentation
  title: Buyer segmentation
  body: 'Buyer mapping is where the company-specific story becomes more concrete. Zhiyuan’s own product surfaces and media interviews imply at least five distinct demand pools: industrial manufacturing, logistics and warehousing, service/reception, research and education, and entertainment or brand activation. The buyer, user, and payer differ across them. Factories and logistics operators own labor-productivity budgets and care about uptime, payload, and ROI. Service venues and telecom branches buy for reception, guidance, and customer interaction. Research buyers purchase flexibility and developer access rather than near-term productivity. Entertainment or brand customers pay for novelty, interaction, and media value. Home robotics is the largest long-run narrative market but still the weakest near-term public market because it demands the highest safety, reliability, and cost proof. For Zhiyuan specifically, the clearest public budget evidence sits in structured industrial and commercial
    deployments, not in the broad home market promised by the category story.'
  claimRefs:
  - CM011
  - CM012
  - CM016
  - CM017
  - CM018
  - CM019
