    severity: material
    topic: ROI proof
    missingEvidence: Actual customer payback, utilization, and labor-substitution metrics for live Zhiyuan deployments.
    whyItMatters: Adoption claims remain much weaker than economic proof.
    diligencePath: Request named case studies with baseline labor cost, deployment cost, uptime, and payback.
    relatedQuestionRefs:
