company:
  name: Zhiyuan Robot
chapter:
  number: 5
  title: Product & Technology
  summary: 'Zhiyuan Robot now presents a genuinely multi-layer product and technology stack: multiple embodied form factors, open-source technical assets, model-layer ambition, and partner ecosystem buildout. The strongest public technical signals come from the X1 docs and GitHub surfaces plus concrete workflow reporting from deployments; the weakest areas remain enterprise trust disclosure, reliability metrics, and formal support commitments.'
sections:
- id: product-overview
  title: Product overview
  body: Zhiyuan’s public portfolio is already broad enough that the core diligence task is classification, not discovery. Official company and product pages show humanoid platforms for industrial, service, and performance scenarios; a large-scenario cleaning product; and data or training-related infrastructure. This breadth matters strategically because it implies the company is trying to own end workflows and data loops, not only a robot body. G1 is pitched as an industrial/commercial workhorse with meaningful manipulation and aisle-compatibility claims, X2 emphasizes anthropomorphic interaction and service-style autonomy, A3 is optimized for performance and multi-robot choreography, and C5 extends the stack into cleaning operations with automated maintenance stations. Even before the model layer, the product story is multi-form-factor. Investors should therefore avoid evaluating Zhiyuan as if it were only a single humanoid demo company; it is already choosing to be a family-of-systems
    company, which increases both upside and execution complexity.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
