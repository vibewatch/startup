  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Reliability and support metrics
    missingEvidence: Uptime, MTBF, failure rates, field-service burden, and SLA terms for deployed Zhiyuan robots.
    whyItMatters: Architecture quality cannot be underwritten from demos and product pages alone.
    diligencePath: Request deployment telemetry, failure logs, response-time commitments, and support staffing by cohort.
    relatedQuestionRefs:
    - QE021
    - QE024
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: Cybersecurity and privacy controls
    missingEvidence: Detailed public controls for robot telemetry, data retention, customer-environment capture, and model-data governance.
    whyItMatters: Embodied-AI deployments gather operational data in sensitive environments, so missing control detail is a real diligence blocker.
    diligencePath: Request security architecture, privacy notices, access controls, on-device/cloud split, and incident-response process.
    relatedQuestionRefs:
    - QE022
    - QE023
    - QE025
    relatedTableRefs:
    - TE004
  - type: enumeration-incomplete
    severity: minor
    topic: Product module / asset matrix coverage
    missingEvidence: More explicit coverage of accessory modules and back-end software assets that are only lightly surfaced publicly.
    whyItMatters: The matrix covers the major public surfaces, but not every accessory or internal platform component.
    diligencePath: Expand with internal product catalog and architecture diagrams.
    relatedQuestionRefs:
    - QE001
    - QE004
    relatedTableRefs:
    - TE001
  - type: conflicting-data
    severity: material
    topic: Open source versus enterprise readiness
    missingEvidence: A clear mapping from open-source X1 assets to the commercial support, warranty, and security posture of enterprise-deployed robots.
    whyItMatters: Open technical artifacts increase credibility, but they do not automatically answer supportability or liability questions.
    diligencePath: Request SKU-level support policy and change-management process between open and commercial stacks.
    relatedQuestionRefs:
    - QE014
    - QE018
    - QE024
    - QE025
