- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Robot bodies and mobility systems
    - Physical execution in different scenarios
    - Mechanical reliability, actuation, batteries, and sensors
    - Hardware complexity can outrun service capacity.
  - - Perception / control / middleware
    - Turns inputs into coordinated action
    - AimRT-style middleware, planning, and control logic
    - Integration bugs or latency degrade workflow trust.
  - - Foundation / world / interaction models
    - Task understanding, reasoning, and multimodal behavior
    - Training data, compute, benchmarks, and continuous iteration
    - Benchmarks may outpace deployment robustness.
  - - Data capture and training stack
    - Collects, labels, and replays real or simulated data
    - Dataset governance, simulator quality, cloud tools
    - Weak data governance or sim mismatch hurts field performance.
  - - Deployment operations
    - Scenario adaptation, service, and maintenance
    - Integrators, specialists, customer sites
    - Labor intensity and support burden can compress margins.
  notes: Architecture is reconstructed from public technical and deployment evidence, not from an internal engineering diagram.
