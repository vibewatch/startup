  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Company solution
  - Measurable benefit
  - Limitation
  rows:
  - - Factory handling / sorting
    - Manual repetitive material movement and sorting
    - G1 / A2-W style humanoid or wheeled deployment with site adaptation
    - Potential labor substitution and continuous operation
    - Needs integration labor and scenario tuning before stable value.
  - - Front-desk / interactive service
    - Human staff or kiosks for guidance and interaction
    - X2 anthropomorphic multimodal interaction
    - Richer engagement and autonomous navigation
    - Limited public proof on reliability and economics.
  - - Stage or event coordination
    - Human performers or custom mechatronics
    - A3 coordinated humanoid performance platform
    - High-visibility showcases and multi-unit control
    - Commercial durability beyond events is unclear.
  - - Large-area facility cleaning
    - Manual or legacy cleaning equipment
    - C5 cleaning robot with workstation automation
    - Lower maintenance burden and digitalized cleaning workflow
    - Needs public proof on deployment scale and support burden.
  - - Developer / data workflow
    - In-house robotics integration and experimentation
    - Open-source X1 plus dataset and platform surfaces
    - Faster experimentation and ecosystem engagement
    - Open artifacts do not equal enterprise support guarantees.
  notes: Benefits are phrased as plausible workflow outcomes from reviewed sources, not as audited customer KPIs.
