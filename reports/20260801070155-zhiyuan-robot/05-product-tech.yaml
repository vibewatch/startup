- id: trust-and-safety
  title: Trust and safety
  body: 'Trust evidence in public sources is mixed. On the positive side, one field report shows immediate stop behavior when a person approached a robot on a factory floor, and China’s standards and policy environment is moving toward explicit humanoid safety, application, and interoperability expectations. Those are helpful anchors. But the reviewed public record is thin on the specific enterprise controls a buyer would want to see: uptime history, formal incident rates, published SLAs, cybersecurity architecture, privacy handling for environment data, and named certifications are all underdisclosed. This is not an academic issue. Embodied systems operate in real workspaces, collect operational data, and increasingly depend on cloud-connected model and tooling layers. The company’s technical credibility is therefore ahead of its public trust disclosure. The right diligence posture is to treat policy and benchmark progress as a tailwind, while still requiring a much more concrete control
    pack before assuming enterprise-grade readiness.'
  claimRefs:
  - CE015
  - CE016
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
  - CE030
  tableRefs:
  - TE004
  figureRefs:
  - FE004
- id: roadmap
  title: Roadmap
  body: The public roadmap signal is unmistakably expansionary. Recent releases combine new product pages, open-source assets, benchmark-model announcements, global partner conferences, and physical-AI thought-leadership events. APC 2026 suggests geographic and channel expansion; WAIC 2026 suggests the company wants to influence the technical agenda; and WITA plus the open-source stack suggest continuing investment in models and developer credibility. That can create a strong flywheel if every new layer makes deployment easier, data richer, and partner adoption faster. It can also create dilution if the organization broadens faster than reliability, supportability, and governance mature. For diligence purposes, the roadmap should be read as bold and coherent in direction, but still short on the service, security, and uptime disclosures that would convert broad ambition into enterprise confidence.
