- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - User
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - G1 humanoid
    - Industrial / commercial operator
    - Public product page with concrete workflow and data claims
    - Factory-oriented manipulation, data capture, and platform angle
    - Need uptime, deployment count, and actual customer mix.
  - - X2 humanoid
    - Service / interaction scenarios
    - Public product page, feature-rich but less commercial proof
    - Multimodal interaction and anthropomorphic behavior
    - Need named production deployments and support metrics.
  - - A3 humanoid
    - Stage / performance / coordinated scenarios
    - Public product page with endurance and group-control claims
    - Choreography and high-visibility coordination use case
    - Need revenue contribution and adjacent commercial relevance.
  - - C5 cleaning system
    - Property / large venue operations
    - Public product page with workflow and workstation detail
    - Non-humanoid workflow expansion and auto-maintenance station
    - Need installed base, ARR/service attach, and margin profile.
  - - Open-source X1 / GitHub assets
    - Developers / researchers / partners
    - Public docs and repositories available
    - Developer credibility and inspectable architecture
    - Need mapping to commercial support and release governance.
  - - WITA / model layer
    - Embodied interaction and reasoning stack
    - Public benchmark and model positioning disclosures
    - Moves differentiation up-stack toward multimodal reasoning
    - Need production metrics, eval methodology, and deployment relevance.
  notes: Matrix covers the major public product and platform surfaces visible in reviewed sources, not every internal program or accessory.
  enumerationScope:
    coverage: partial
    basis: Representative public assets only; accessory modules and internal tools remain only lightly disclosed.
