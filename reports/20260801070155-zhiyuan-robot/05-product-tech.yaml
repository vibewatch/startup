- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / certification / quality metric
  - Status
  - Scope
  - Gap
  rows:
  - - Immediate stop behavior in factory field report
    - Observed
    - Operational safety behavior in one deployment
    - Need broader safety-case documentation, near-miss data, and policy.
  - - China humanoid standards and policy framework
    - Developing / external
    - Industry-level design and deployment expectations
    - Need company-specific mapping to internal controls and compliance ownership.
  - - Public reliability metrics
    - Not disclosed
    - Would cover uptime, MTBF, failure rate, and incident trends
    - Major diligence gap for enterprise readiness.
  - - Cybersecurity / privacy control pack
    - Not disclosed
    - Would cover telemetry, customer data, access control, and retention
    - Major diligence gap for embodied-AI deployments.
  - - Named certifications / audits / SLA terms
    - Not clearly disclosed in reviewed sources
    - Would evidence enterprise-grade quality process
    - Major diligence gap before large enterprise rollout.
  notes: The most important trust rows are still null-like because the reviewed public record does not provide a complete control pack.
