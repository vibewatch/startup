- id: milestones-and-open-gaps
  title: Milestones and open gaps
  body: 'The strategic picture that emerges is a company moving quickly from formation to platformization, but still asking outside investors to bridge several key disclosure gaps. Official releases show a credible sequence of milestones: early registration, a first product within months, Shanghai manufacturing in 2024, embodied-model and tool releases in 2025, and larger public shipment or showcase claims in 2026. Independent reporting adds further proof on fundraising, industrial orders, and commercialization pressure. Yet some of the most important diligence facts remain stubbornly private or contradictory. Public sources do not supply audited revenue, current debt, exact employee count, or final round documents; the 2026 IPO narrative remains a plan rather than an exchange filing; and adverse signals such as a copyright case and debate about the full-stack model show the company is not de-risked simply because it is visible. The right conclusion for later chapters is neither “hype only”
    nor “already proven winner,” but “real category leader with still-material underwriting blind spots.”'
  claimRefs:
  - CO018
  - CO019
  - CO031
  - CO032
  - CO036
  - CO037
