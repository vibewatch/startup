company:
  name: Zhiyuan Robot
chapter:
  number: 1
  title: Company Overview
  summary: 'Zhiyuan Robot, branded internationally as AGIBOT, is a Shanghai humanoid-robotics company whose public record now supports a more specific picture than the seed context: official materials place registration in February 2023, name Deng Taihua as founder-chairman-CEO and Peng Zhihui as co-founder-president-CTO, and show a multi-product, full-stack embodied-AI strategy. Independent coverage corroborates rapid 2025 financing and unusually fast shipment growth, but exact round economics, audited revenue, and current employee count remain less transparent than the headline unicorn narrative.'
sections:
- id: identity-and-mission
  title: Identity and mission
  body: 'Zhiyuan Robot is best understood as a Shanghai-based embodied-AI robotics company rather than as a single-product humanoid demo shop. Official Chinese and English materials consistently pair the Chinese corporate identity 智元创新 with the international brand AGIBOT and describe a mission to “create unlimited productivity via intelligent machines.” Those pages matter because they also define the company’s operating scope: full-stack robots, intelligent algorithms, open platforms, and a broader application ecosystem. The official profile gives the cleanest founding chronology now available in public evidence, showing company registration in February 2023 and the first Expedition A1 launch in August 2023. That timeline is more precise than the seed context and supports a company that moved from registration to public hardware launch unusually quickly. The public product surface already spans Expedition humanoids, Lingxi and Genie platforms, data services, and tooling, which means later
    chapters should analyze Zhiyuan as a platform-and-product company, not merely a research team with one humanoid prototype.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO010
  - CO033
  - CO034
  - CO038
  tableRefs:
  - TO001
  figureRefs:
  - FO002
- id: founders-and-leadership
  title: Founders and leadership
  body: 'Official leadership disclosure materially changes the founder narrative. The company now publicly names Deng Taihua as founder, chairman, and CEO, while Peng Zhihui is named co-founder, president, and CTO. That is a more formal control picture than the popular shorthand that centers only on Peng’s internet fame. Peng still matters enormously: independent reporting ties him to Huawei’s Genius Youth program, earlier work at OPPO, and a large creator following that gives Zhiyuan brand reach and talent magnetism uncommon for an industrial startup. But the disclosed bench shows a much broader operating company, with senior roles for marketing, embodied-business operations, general business, science, and HR. Public reporting also shows executives defending pricing, supply-chain choices, and commercialization sequencing in detail, suggesting leadership is optimizing not just for robotics R&D but for scaled deployment. The main unresolved governance gap is not who the executives are; it
    is how board control, preference rights, and founder voting power are allocated behind the scenes.'
  claimRefs:
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  - CO027
  - CO029
  - CO030
  tableRefs:
  - TO002
- id: funding-and-investors
  title: Funding and investors
  body: 'Public financing evidence is directionally strong even where exact round economics remain incomplete. Independent 2025 coverage says Tencent led a March 2025 round and that JD plus the Shanghai Embodied Intelligence Fund joined a later financing, while Zhidx describes a March 2025 valuation around US$2.07 billion or roughly RMB 14.7-15.0 billion. That range is consistent enough to treat Zhiyuan as a unicorn, but not precise enough to pretend the public record contains a full cap-table truth set. Investor composition matters more than the headline number alone. Public reports show a mix of financial VCs and strategic industrial capital, including Tencent, JD, SAIC, LG Electronics, Mirae Asset, and older investors such as Baidu Ventures, Dinghui, and C Capital. That mix supports the idea that Zhiyuan is building not just a financing stack but a distribution, manufacturing, and ecosystem coalition. The IPO discussion should still be handled carefully: current public reporting frames
    Hong Kong listing plans as a 2026 objective or scenario, not as a completed financing event.'
  claimRefs:
  - CO016
  - CO017
  - CO018
  - CO019
  - CO020
  - CO037
  tableRefs:
  - TO003
  figureRefs:
  - FO003
- id: scale-and-traction
  title: Scale and traction
  body: 'Zhiyuan’s public traction evidence is unusually strong for a private humanoid-robotics company, but it mixes shipments, pilots, orders, and marketing milestones that should not be conflated. Official materials show the company crossed 1,000 cumulative general-purpose robots in 2025 and later claimed 15,000 embodied robots by mid-2026, while Forbes reported 10,000 total shipments by March 2026 after 5,000 units shipped in a single quarter. TrendForce separately described AgiBot and Unitree as the likely leaders in China’s 2026 humanoid output. Customer proof is also becoming more concrete: the China Times/Tencent News profile cites China Mobile and Chery orders plus other multi-million-yuan contracts, and management publicly discussed product pricing as low as RMB 98,000 for one model. Even so, the public record still does not convert these facts into audited revenue, installed-base utilization, or clean headcount. Active hiring and shipment milestones prove momentum, but not yet
    mature disclosure quality.'
  claimRefs:
  - CO013
  - CO021
  - CO022
  - CO023
