- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Why it breaks the case
  - Current visibility
  - Immediate action
  rows:
  - - Flagship orders fail to scale into live durable deployments
    - Would undermine the commercialization narrative directly
    - Medium
    - Pause investment and demand deployment cohort evidence.
  - - Revenue / margin disclosure remains absent deep into next financing window
    - Would leave valuation almost entirely narrative-driven
    - High
    - Refuse premium pricing without denominator evidence.
  - - Support burden or incidents rise materially
    - Would damage both margins and reference-account quality
    - Low-medium
    - Demand service KPI review and incident log.
  - - Next financing occurs under weak proof or heavy dilution
    - Would signal economics lagging the story
    - Low
    - Re-underwrite downside ownership and capital needs.
  - - Data / legal governance failure slows enterprise adoption
    - Would hit both customer trust and exit optionality
    - Low
    - Escalate legal and security diligence immediately.
  notes: These triggers define when a promising story should stop receiving benefit-of-the-doubt valuation treatment.
