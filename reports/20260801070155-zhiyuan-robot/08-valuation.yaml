    sourceRefs:
    - SV024
    - SV025
    - SV029
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV006
  - id: CV014
    statement: The PR Newswire “Deployment Year One” framing adds momentum to the commercialization story, but it remains company-authored and should not be over-weighted alone.
