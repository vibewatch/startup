- id: exit-and-diligence
  title: Exit and diligence
  body: 'Exit optionality exists, but it should not be over-valued today. Public reporting has discussed an eventual Hong Kong path, and peers such as UBTECH show that a public-market route is imaginable for a Chinese humanoid company. Strategic M&A or a later crossover round are also possible. But none of those paths should be used to excuse missing fundamentals. Before increasing conviction, investors should demand the shortest list of facts that would most change the underwriting view: actual revenue, gross margin after service burden, concentration by top customer, liquidity runway, and evidence that flagship orders are becoming repeatable deployments rather than isolated headlines. These diligence asks are not procedural. They are the difference between paying for a strong frontier asset and paying for a beautifully packaged uncertainty.'
