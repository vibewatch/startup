  claims:
  - id: CV001
    statement: Zhiyuan merits a real investment discussion because public evidence now supports non-trivial shipment, customer, and product breadth rather than a concept-stage story.
    type: inferred
    topic: thesis
    sourceRefs:
    - SV003
    - SV004
    - SV024
    - SV025
    - SV028
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV002
    - QV006
  - id: CV002
    statement: The strongest pro-thesis pillars are China shipment leadership, growing named-customer proof, broad product surfaces, and an ecosystem-building posture around embodied AI.
    type: inferred
    topic: thesis
    sourceRefs:
    - SV004
    - SV008
    - SV024
    - SV028
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV002
    - QV006
    - QV011
  - id: CV003
    statement: The strongest anti-thesis pillars are underdisclosed revenue quality, capital intensity, customer concentration, and the possibility that deployment excitement is outrunning durable economics.
    type: inferred
    topic: anti-thesis
    sourceRefs:
    - SV012
    - SV023
    - SV024
    - SV026
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV003
    - QV007
    - QV012
    - QV023
  - id: CV004
    statement: Zhiyuan’s most defensible current valuation anchor remains the roughly RMB15 billion / about US$2.07 billion 2025 mark reported in public media.
    type: third-party-reported
    topic: valuation-anchor
    sourceRefs:
    - SV001
    - SV002
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QV001
    - QV004
  - id: CV005
    statement: That anchor is meaningful because it places Zhiyuan clearly above an ordinary early-stage hardware startup but far below the most inflated global private humanoid narratives.
    type: inferred
    topic: valuation-anchor
    sourceRefs:
    - SV002
    - SV018
    - SV022
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV004
    - QV010
  - id: CV006
    statement: Figure’s US$39 billion Series C valuation and Apptronik’s US$5 billion financing context show how wide the global valuation band is for premium humanoid narratives.
    type: observed
    topic: peer-valuation-band
    sourceRefs:
    - SV018
    - SV022
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV008
    - QV010
  - id: CV007
    statement: Zhiyuan’s public valuation is therefore not extreme by global private-peer standards, but it is stretched relative to its current public disclosure quality.
    type: inferred
    topic: valuation-stance
    sourceRefs:
    - SV002
    - SV012
    - SV026
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV004
    - QV019
  - id: CV008
    statement: TrendForce, IDC, and AGIBOT’s Omdia-backed shipment messaging all support the idea that Zhiyuan is among the category’s shipment leaders in China and possibly globally.
    type: observed
    topic: scale-proof
    sourceRefs:
    - SV004
    - SV005
    - SV008
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QV006
    - QV011
  - id: CV009
    statement: Shipment leadership deserves a valuation premium because it can generate more deployment data, customer references, and manufacturing learning than slower peers receive.
    type: inferred
    topic: scale-premium
    sourceRefs:
    - SV004
    - SV008
    - SV019
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV011
  - id: CV010
    statement: Shipment leadership still fails to prove revenue quality, gross margin durability, or customer retention.
    type: inferred
    topic: scale-limits
    sourceRefs:
    - SV012
    - SV024
    - SV025
    - SV026
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV012
  - id: CV011
    statement: The market case is directionally strong because major analyst houses all model large long-run growth for humanoids, even if the ranges vary wildly.
    type: observed
    topic: market-case
    sourceRefs:
    - SV004
    - SV005
    - SV006
    - SV007
    confidence: high
    freshness: current
    answersQuestionRefs:
