    - Provides the missing denominator for every serious valuation method
    - Could move stance from stretched to fair if strong.
  - - Customer cohort / expansion table
    - Separates one-off logos from durable adoption
    - Could upgrade recommendation confidence materially.
  - - Support and service burden metrics
    - Tests whether deployments scale economically
    - Could compress or widen fair-value range.
  - - Cash, burn, debt, and runway pack
    - Clarifies dilution and financing risk
    - Could materially change bear-case severity.
  - - 2025 round terms and cap table
    - Determines downside economics and ownership path
    - Could reshape interpretation of the headline mark.
  notes: These are the minimum diligence asks most likely to change the investment decision, not an exhaustive list.
