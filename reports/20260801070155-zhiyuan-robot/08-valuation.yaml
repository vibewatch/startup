company:
  name: Zhiyuan Robot
chapter:
  number: 8
  title: Valuation
  summary: Zhiyuan Robot’s public valuation case is serious but not clean. The company has enough shipment, customer, and product proof to justify continued investor attention and a real premium narrative, yet the current public mark still looks stretched against the company’s limited revenue and margin disclosure. The right posture is to track closely, underwrite through milestones, and resist false precision until the denominator improves.
sections:
- id: investment-thesis
  title: Investment thesis
  body: 'Zhiyuan Robot deserves a real investment discussion because the public evidence has crossed a threshold that many humanoid startups never reach: identifiable shipments, named customers, multiple public product surfaces, and ecosystem-building around embodied AI. The strongest positive case rests on three things. First, external analysts and company materials both support a leadership position in China’s shipment narrative. Second, named-customer proof now exists in factory and procurement contexts rather than only on stage. Third, the company is clearly trying to build platform depth through products, models, data, and partners rather than a single demo. Those are not trivial strengths. At the same time, the valuation debate cannot stop at “category leader.” The thesis must be held alongside weak public economics, concentration risk, and structural hardware capital intensity. That is why the chapter’s final stance is constructive but disciplined: the company is worth tracking closely,
    but not yet easy to underwrite at headline valuations.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV008
  - CV013
  - CV015
  - CV016
  tableRefs:
  - TV002
  figureRefs:
  - FV001
- id: recommendation
  title: Recommendation
  body: The current recommendation is track. That choice is not a soft hedge; it reflects a specific mismatch between real promise and incomplete proof. Zhiyuan is credible enough that ignoring it would be a mistake, especially given its shipment positioning and customer momentum. But the public record is still too thin on revenue denominator, gross margin, service burden, and balance-sheet strength to justify a high-conviction “invest now at almost any price” posture. Investors should also remember that private humanoid valuations are being set inside a narrative-rich market where global peers can trade on frontier-model excitement and strategic optionality rather than present-day economics. In that environment, discipline matters more than speed. Tracking Zhiyuan while pushing hard on disclosure may actually create a better entry than racing to validate a mark whose economics remain opaque.
  claimRefs:
  - CV004
  - CV005
  - CV006
  - CV007
  - CV014
  - CV015
  - CV016
  - CV040
  tableRefs:
  - TV001
- id: valuation-context
  title: Valuation context
  body: 'Zhiyuan’s current public valuation context has to be triangulated from imperfect but still useful anchors. The most defensible current mark is the roughly RMB15 billion or about US$2.07 billion valuation reported in 2025 media coverage. That figure is not cheap in absolute terms, but it is also far below the largest U.S. private peer narratives such as Figure and below the premium financing context around Apptronik. The real question is not whether Zhiyuan is cheaper than Figure; it is whether the discount to premium peers is large enough given the much thinner economic disclosure. UBTECH provides a critical public benchmark because it shows what scaled category economics can look like in disclosed form: real revenue and improving margin, yet still large losses and cash intensity. That benchmark argues for treating Zhiyuan’s private mark as stretched until it discloses more of the underlying revenue and margin engine.'
  claimRefs:
  - CV004
  - CV005
  - CV006
  - CV007
  - CV017
  - CV018
  - CV019
  - CV020
  - CV021
  - CV022
  figureRefs:
  - FV003
- id: scenarios
  title: Scenarios
  body: 'The scenario framework should be milestone-based, not comp-multiple-centric. In the bull case, shipment leadership becomes durable commercial leadership: customer references compound, overseas partner activity converts into paying accounts, and economic disclosure improves enough to support a platform premium. In the base case, commercialization keeps moving forward but the company remains only partly transparent, leaving investors to value it as a promising but still risky growth story. In the bear case, orders convert more slowly than expected, support and deployment costs stay high, and future financing happens before proof deepens enough to justify the current narrative. The reason to emphasize scenarios over point estimates is simple: the public data package is not rich enough for false precision, but it is rich enough to define what good and bad path-dependence would look like from here.'
  claimRefs:
  - CV023
  - CV024
  - CV025
  - CV026
  - CV027
  - CV028
  - CV029
  - CV030
