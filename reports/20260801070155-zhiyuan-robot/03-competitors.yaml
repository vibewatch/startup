- id: competitor-profiles
  title: Competitor profiles
  body: 'Public profiles show a sharp split between valuation leadership, deployment leadership, and pricing transparency. Figure is the most obvious valuation outlier after its $39 billion Series C and also has unusually strong named enterprise proof through BMW. Unitree is more transparent on hardware and component surfaces, and external analysts place it alongside AgiBot at the top of China''s shipment curve. UBTECH is a serious industrial competitor because Walker S is positioned squarely around factory scenarios rather than novelty interaction. Agility and Apptronik have not shown the same public unit-scale as the China leaders, but both spend significant energy building commercialization infrastructure, facilities, and partnerships that could matter later. Zhiyuan sits somewhere in between: more visible China scale and ecosystem density than most U.S. peers, but less globally legible financing and revenue quality than investors might want.'
