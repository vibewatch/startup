- id: competitive-risks
  title: Competitive risks
  body: The main competitive risk is commoditization before software and service moats fully form. If several vendors can reach “good enough” mobility, manipulation, and reliability in structured tasks, then capital, distribution, and service economics may matter more than any one technical breakthrough. That is why weak public pricing transparency is not a side note; it is central to the moat debate. Another risk is that high private valuations can overshadow lower but more durable customer proof from other players. A final risk is strategic overreach. Gasgoo's adverse analysis of Zhiyuan's dexterous-hand strategy highlights how a full-stack company can win attention and still face focus strain. The practical conclusion is that investors should rank peers not only by demos or valuations but by who is building repeatable deployment loops and who still relies primarily on brand heat. On that score, the field remains fluid enough that today's leaderboards can change quickly.
  claimRefs:
  - CP018
  - CP019
