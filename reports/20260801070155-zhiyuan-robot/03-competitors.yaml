company:
  name: Zhiyuan Robot
chapter:
  number: 3
  title: Competitors
  summary: 'Zhiyuan Robot belongs in the first global conversation about humanoid-robotics challengers, but the competitive picture is multi-dimensional: Figure dominates valuation and premium enterprise narrative, Unitree and Zhiyuan dominate much of the China shipment story, UBTECH is a serious industrial peer, and Agility plus Apptronik are building commercialization infrastructure with less public unit-scale proof. Zhiyuan''s moat case is strongest when judged on China ecosystem density, broad public product surfaces, and scaling speed, and weakest when judged on globally comparable financial transparency and repeat paying deployments.'
sections:
- id: competitive-landscape
  title: Competitive landscape
  body: Zhiyuan competes in a fast-forming peer set where not every robot maker matters equally. The most relevant group today includes Unitree, Figure AI, UBTECH, Agility Robotics, and Apptronik because each has public ambitions in general-purpose humanoids and at least some enterprise-commercial path. The landscape should also be read against status-quo substitutes such as fixed automation, wheeled logistics robots, and simpler industrial systems that can solve many tasks more cheaply when human-form flexibility is not required. That distinction matters because a humanoid startup is not only fighting other humanoids; it is also fighting “good enough” automation. Within the direct peer set, China-based players currently appear stronger on hardware scaling cadence and supply-chain density, while U.S. peers remain stronger on capital-market narrative and premium branding. The core comparison, then, is not simply robot versus robot, but operating model versus operating model under different
    proof burdens.
  claimRefs:
