              - CV029
              - CV034
      - number: '8.5'
        title: Comparables
        blocks:
          - type: paragraph
            body: >-
              Comparables are helpful here only if used with humility. Figure should be read as a premium narrative and
              frontier-model benchmark, Apptronik as a capital-intensity and enterprise-partnership benchmark, and
              UBTECH as the clearest public operating benchmark. Unitree provides hardware-pricing context but not a
              fully disclosed public valuation case. This is why a raw “peer average multiple” exercise would mislead
              more than it would clarify: the comp set mixes listed financial disclosure, private mega-round
              storytelling, and companies at very different stages of deployment transparency. A better use of comps is
              to compare how much proof, disclosure, and capital each narrative currently carries. By that standard,
              Zhiyuan looks stronger than a mere concept play, but weaker than the kind of company that deserves a clean
              premium without a margin or revenue denominator.
            claimRefs:
              - CV017
              - CV018
