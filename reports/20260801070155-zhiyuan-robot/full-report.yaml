        title: Market sizing
        blocks:
          - type: paragraph
            body: >-
              Public market-size estimates agree on direction but not on magnitude. IDC’s 2026 humanoid study is the
              most useful current anchor because it grounds the category in actual 2025 shipments and revenue,
              describing roughly 18,000 units and about US$440 million of revenue with China vendors leading. Forecast
              houses then expand far beyond that installed base: Mordor estimates a US$3.93 billion market in 2026
              rising to US$17.8 billion by 2031, while Global Market Insights estimates a much larger US$10.9 billion
              2026 market and US$192.7 billion by 2035. None of these should be treated as Zhiyuan’s immediate
              addressable market without translation. The right interpretation is a three-layer lens: broad long-run TAM
              is large, near-term SAM is much smaller and mainly China industrial/commercial deployments, and currently
              proven SOM is smaller still because only a narrow set of use cases have clear public proof.
