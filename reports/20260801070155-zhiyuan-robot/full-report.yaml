      - number: '1.4'
        title: Scale and traction
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan’s public traction evidence is unusually strong for a private humanoid-robotics company, but it
              mixes shipments, pilots, orders, and marketing milestones that should not be conflated. Official materials
              show the company crossed 1,000 cumulative general-purpose robots in 2025 and later claimed 15,000 embodied
              robots by mid-2026, while Forbes reported 10,000 total shipments by March 2026 after 5,000 units shipped
              in a single quarter. TrendForce separately described AgiBot and Unitree as the likely leaders in China’s
              2026 humanoid output. Customer proof is also becoming more concrete: the China Times/Tencent News profile
              cites China Mobile and Chery orders plus other multi-million-yuan contracts, and management publicly
              discussed product pricing as low as RMB 98,000 for one model. Even so, the public record still does not
              convert these facts into audited revenue, installed-base utilization, or clean headcount. Active hiring
              and shipment milestones prove momentum, but not yet mature disclosure quality.
