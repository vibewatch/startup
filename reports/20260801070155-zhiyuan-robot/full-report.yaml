        title: Trust and safety
        blocks:
          - type: paragraph
            body: >-
              Trust evidence in public sources is mixed. On the positive side, one field report shows immediate stop
              behavior when a person approached a robot on a factory floor, and China’s standards and policy environment
              is moving toward explicit humanoid safety, application, and interoperability expectations. Those are
              helpful anchors. But the reviewed public record is thin on the specific enterprise controls a buyer would
              want to see: uptime history, formal incident rates, published SLAs, cybersecurity architecture, privacy
              handling for environment data, and named certifications are all underdisclosed. This is not an academic
              issue. Embodied systems operate in real workspaces, collect operational data, and increasingly depend on
              cloud-connected model and tooling layers. The company’s technical credibility is therefore ahead of its
              public trust disclosure. The right diligence posture is to treat policy and benchmark progress as a
              tailwind, while still requiring a much more concrete control pack before assuming enterprise-grade
              readiness.
