        title: Partner and dependency risks
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan’s route to scale is partner-rich by design, and that creates a distinct dependency profile. On one
              side, integrators and channel partners are helpful because they can speed localization, site adaptation,
              and international reach. On the other, they introduce quality-control, accountability, and
              brand-consistency risk. The same is true for customer concentration: a small number of high-profile logos
              can accelerate conversion while simultaneously increasing exposure if any flagship account disappoints.
              Geopolitical and component dependencies also matter, because a humanoid stack inevitably relies on
              high-spec hardware and a cross-border ecosystem that may be stressed by export rules or
              industrial-security regulations. These are not hypothetical second-order issues; they are direct
              constraints on delivery reliability, gross margin, and the credibility of expansion plans.
