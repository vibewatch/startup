chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and mission
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan Robot is best understood as a Shanghai-based embodied-AI robotics company rather than as a
              single-product humanoid demo shop. Official Chinese and English materials consistently pair the Chinese
              corporate identity 智元创新 with the international brand AGIBOT and describe a mission to “create unlimited
              productivity via intelligent machines.” Those pages matter because they also define the company’s
              operating scope: full-stack robots, intelligent algorithms, open platforms, and a broader application
              ecosystem. The official profile gives the cleanest founding chronology now available in public evidence,
              showing company registration in February 2023 and the first Expedition A1 launch in August 2023. That
              timeline is more precise than the seed context and supports a company that moved from registration to
              public hardware launch unusually quickly. The public product surface already spans Expedition humanoids,
              Lingxi and Genie platforms, data services, and tooling, which means later chapters should analyze Zhiyuan
              as a platform-and-product company, not merely a research team with one humanoid prototype.
