      - number: '4.2'
        title: Unit economics
        blocks:
          - type: paragraph
            body: >-
              Public unit-economics evidence is incomplete but still directionally useful. The strongest disclosed case
              is Fulin Precision, where a small on-site fleet handled more than 800 boxes in three hours and management
              described labor-replacement ranges of roughly 0.7 worker-equivalent in normal operation and as much as 1.4
              to 2 workers in round-the-clock use. That does not prove payback, but paired with local labor cost of
              roughly RMB80,000 per worker annually, it gives a first-order ROI lens. The same article is equally
              important on the cost side: deployment and maintenance require technical staff, and the first rollout can
              take months before later deployments become much faster. Public prices are also messy. A2-W was described
              as likely falling into a RMB400,000 to RMB800,000 industrial range, while another management discussion
              referenced a much lower entry-level price for a different model. The right conclusion is that pricing is
              product- and scenario-dependent, and that support economics probably matter as much as robot BOM.
