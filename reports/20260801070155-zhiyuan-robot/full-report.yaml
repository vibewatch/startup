      - number: '1.3'
        title: Funding and investors
        blocks:
          - type: paragraph
            body: >-
              Public financing evidence is directionally strong even where exact round economics remain incomplete.
              Independent 2025 coverage says Tencent led a March 2025 round and that JD plus the Shanghai Embodied
              Intelligence Fund joined a later financing, while Zhidx describes a March 2025 valuation around US$2.07
              billion or roughly RMB 14.7-15.0 billion. That range is consistent enough to treat Zhiyuan as a unicorn,
              but not precise enough to pretend the public record contains a full cap-table truth set. Investor
              composition matters more than the headline number alone. Public reports show a mix of financial VCs and
              strategic industrial capital, including Tencent, JD, SAIC, LG Electronics, Mirae Asset, and older
              investors such as Baidu Ventures, Dinghui, and C Capital. That mix supports the idea that Zhiyuan is
              building not just a financing stack but a distribution, manufacturing, and ecosystem coalition. The IPO
              discussion should still be handled carefully: current public reporting frames Hong Kong listing plans as a
              2026 objective or scenario, not as a completed financing event.
