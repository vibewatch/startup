  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan competes in a fast-forming peer set where not every robot maker matters equally. The most relevant
              group today includes Unitree, Figure AI, UBTECH, Agility Robotics, and Apptronik because each has public
              ambitions in general-purpose humanoids and at least some enterprise-commercial path. The landscape should
              also be read against status-quo substitutes such as fixed automation, wheeled logistics robots, and
              simpler industrial systems that can solve many tasks more cheaply when human-form flexibility is not
              required. That distinction matters because a humanoid startup is not only fighting other humanoids; it is
              also fighting “good enough” automation. Within the direct peer set, China-based players currently appear
              stronger on hardware scaling cadence and supply-chain density, while U.S. peers remain stronger on
              capital-market narrative and premium branding. The core comparison, then, is not simply robot versus
              robot, but operating model versus operating model under different proof burdens.
