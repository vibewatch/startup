              - CV028
      - number: '8.4'
        title: Scenarios
        blocks:
          - type: paragraph
            body: >-
              The scenario framework should be milestone-based, not comp-multiple-centric. In the bull case, shipment
              leadership becomes durable commercial leadership: customer references compound, overseas partner activity
              converts into paying accounts, and economic disclosure improves enough to support a platform premium. In
              the base case, commercialization keeps moving forward but the company remains only partly transparent,
              leaving investors to value it as a promising but still risky growth story. In the bear case, orders
              convert more slowly than expected, support and deployment costs stay high, and future financing happens
              before proof deepens enough to justify the current narrative. The reason to emphasize scenarios over point
              estimates is simple: the public data package is not rich enough for false precision, but it is rich enough
              to define what good and bad path-dependence would look like from here.
            claimRefs:
              - CV023
