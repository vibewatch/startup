      - number: '4.3'
        title: Cost structure
        blocks:
          - type: paragraph
            body: >-
              The cost structure looks more like a capital-intensive systems business than like a software company.
              Zhiyuan’s public materials imply spending across robot hardware, embodied-model research, data
              infrastructure, deployment teams, and solution engineering. Peer evidence sharpens the picture. Figure’s
              BotQ narrative, Apptronik’s manufacturing and partnership announcements, and TrendForce’s volume-driven
              commercialization framing all point toward the same mechanism: scale is needed to push down unit cost, but
              getting to scale requires serious upfront factory, tooling, and organizational investment. Fulin’s
              deployment details add a second cost layer because the company needs scenario debugging, safety
              validation, and integration support. Working capital is also a likely hidden pressure point. Enterprise
              and state-linked customers may pay on acceptance cycles rather than at order announcement, which can
              create receivable and inventory strain before margins fully mature. The category should therefore be
              modeled as hardware plus service plus data, with multiple cost centers all ramping ahead of clean revenue
              visibility.
