          - type: paragraph
            body: >-
              Financial risk remains elevated mostly because the public record is asymmetric: there are more signals of
              ambition and deployment than there are signals of cash adequacy and unit economics. UBTECH’s annual report
              is useful here because it demonstrates that even a larger, listed humanoid peer with growing revenue and
              improving gross margin can still consume significant cash and remain loss-making. That suggests category
              capital intensity is structural, not a temporary artifact. For Zhiyuan specifically, the problem is lack
              of direct disclosure. Investors do not have public cash, debt, covenant, or receivable data with which to
              stress-test downside cases. Shipment-leadership narratives from TrendForce and IDC therefore should be
              read as market-position signals, not as balance-sheet comfort. A company can be ahead on units and still
              behind on liquidity resilience.
            claimRefs:
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
          - type: table
            tableRef: TR004
            claimRefs:
              - CR018
              - CR027
              - CR028
              - CR031
              - CR039
      - number: '7.6'
        title: Mitigations
        blocks:
          - type: paragraph
            body: >-
              The public mitigation picture is encouraging but incomplete. Positive signals include evidence of basic
              safety behaviors in the field, a willingness to engage the emerging standards environment, open
              acknowledgment that deployment learning matters, and an ecosystem strategy that can widen go-to-market
              reach. Yet the strongest mitigations are still the ones that remain private: audited control packs,
              incident logs, support KPIs, supplier contingency plans, and liquidity discipline. The right diligence
              response is not to assume the company is overexposed, but to set hard evidence thresholds before new
              capital is committed. If Zhiyuan cannot demonstrate conversion from flagship orders to stable live
              deployments, produce defensible governance and data controls, or show that service burden is scaling
              sustainably, those should be treated as kill criteria even if the headline market narrative remains hot.
            claimRefs:
              - CR032
              - CR033
              - CR034
              - CR035
              - CR036
              - CR037
          - type: table
            tableRef: TR005
