            body: >-
              Zhiyuan’s differentiation case rests less on any one specification and more on the interaction among
              breadth, openness, and ecosystem buildout. The open-source X1 assets make the company more legible to
              developers and researchers than many pure-marketing peers. APC 2026 and WAIC 2026 show a deliberate effort
