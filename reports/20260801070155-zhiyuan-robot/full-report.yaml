      - number: '3.3'
        title: Capability comparison
        blocks:
          - type: paragraph
            body: >-
              From a buyer perspective, the most important dimensions are not abstract “AI leadership” claims but
              form-factor fit, deployment proof, pricing transparency, supply-chain resilience, dexterous manipulation,
              and serviceability. Zhiyuan's clearest comparative strengths are portfolio breadth, China ecosystem
              density, and speed of scale narrative. Figure's clearest strength is premium enterprise validation with
              BMW plus unmatched headline financing. Unitree scores well on hardware transparency and pricing clues.
              UBTECH looks strong in industrial workflow framing, while Apptronik and Agility look strongest where
              commercialization infrastructure and enterprise partnership discipline matter. Notably, dexterous hands
              and embodied-model loops are becoming explicit competitive variables. Gasgoo's adverse reading of
              Zhiyuan's dexterous-hand spin-off also shows that the same full-stack ambition that builds a moat can
              create strategic strain if focus fragments. Buyers therefore should not confuse breadth with durable
              advantage unless breadth actually translates into deployments and service performance.
