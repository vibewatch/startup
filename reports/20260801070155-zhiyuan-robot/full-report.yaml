              - CV001
              - CV015
              - CV016
              - CV040
      - number: '8.3'
        title: Valuation context
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan’s current public valuation context has to be triangulated from imperfect but still useful anchors.
              The most defensible current mark is the roughly RMB15 billion or about US$2.07 billion valuation reported
              in 2025 media coverage. That figure is not cheap in absolute terms, but it is also far below the largest
              U.S. private peer narratives such as Figure and below the premium financing context around Apptronik. The
              real question is not whether Zhiyuan is cheaper than Figure; it is whether the discount to premium peers
              is large enough given the much thinner economic disclosure. UBTECH provides a critical public benchmark
              because it shows what scaled category economics can look like in disclosed form: real revenue and
              improving margin, yet still large losses and cash intensity. That benchmark argues for treating Zhiyuan’s
              private mark as stretched until it discloses more of the underlying revenue and margin engine.
            claimRefs:
