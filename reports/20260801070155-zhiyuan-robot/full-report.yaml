            body: >-
              The clearest architecture clues come from the company’s open-source and research surfaces rather than from
              polished marketing pages alone. The X1 docs and GitHub repositories expose a modular stack using AimRT
              middleware and reinforcement-learning-centric training and inference flows, which is a stronger technical
              signal than vague “AI-powered” positioning. AgiBot-World and the G1 page reinforce the importance of data
              operations, while WITA and the WAIC materials show the company is also pushing up the stack toward
              multimodal and world-model-style embodied reasoning. The emerging architecture looks layered: robot body
              and end-effectors; perception, control, and middleware; model and world-model layers; data capture and
              training; and deployment operations. Yicai’s report that one deployment relied on roughly 95% simulated
              data and 5% real-world data is especially useful because it shows how Zhiyuan is trying to bridge lab and
              field. That same report also shows why architecture alone is not enough: field variability still forces
              adaptation, safety handling, and on-site engineering.
