      - number: '7.2'
        title: Regulatory and legal risks
        blocks:
          - type: paragraph
            body: >-
              The regulatory and legal risk stack is already material. Humanoid deployments sit at the intersection of
              product safety, workplace interaction, data collection, and increasingly politicized technology trade.
              China’s robot and humanoid guidance documents plus the emerging standards system create a more legible
              path for deployment, but they also raise the expected bar for safety and documentation. Product-liability
              rules matter because robots now act in physical workspaces, and legal commentary stresses that
              accountability can be shared among manufacturer, operator, and software layers. Data-security and privacy
              risk is equally important: embodied systems gather environmental data inside customer facilities, so the
              Data Security Law, the 2026 Cybersecurity Law amendments, and broader privacy frameworks are not abstract
              compliance background. Geopolitical supply risk adds another legal layer, as export-control and
              industrial-security rules can disrupt components, customers, or overseas delivery obligations with limited
              warning.
