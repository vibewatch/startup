      - number: '2.4'
        title: Growth drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              The strongest market drivers are now familiar and increasingly visible in public research: aging
              demographics, labor scarcity in structured physical workflows, falling component costs, better
              embodied-model performance, and the fact that humanoids can use human-designed environments without total
              infrastructure rebuild. China-specific policy is also a real tailwind, not just narrative decoration. The
              robot plan, humanoid guidance, and 2026 standards activity all show that regulators want the category to
              move beyond demos. But market constraints remain heavy. Reliability, generalization, safety, compute
              dependence, scenario integration, and proof of customer economics still dominate adoption risk. Management
              itself acknowledges that broad deployment depends on price-performance improvement and stronger model
              capability. Put differently, the growth story is real, but the category is still crossing from pilot-stage
              excitement into deployment-stage discipline. Investors should underwrite the speed of this crossing, not
              just the size of eventual TAM.
