            body: >-
              Public retention evidence is thin, so investors need to use careful proxies. The strongest proxy is
              follow-on expansion at Fulin Precision: a move from an initial active fleet toward a much larger announced
              order is not the same as NRR, but it is better than a one-off showcase. China Mobile’s tender is another
              useful proxy because formal procurement implies a higher bar than a casual trial. Even so, the public
              record provides no churn, renewal, SLA, or uptime denominator. That means durability remains an inference
              rather than a disclosed metric. Investors should distinguish among three very different things: a robot
              appearing on a site, a customer committing budget for more units, and a customer realizing enough value to
              renew or expand repeatedly. Zhiyuan has public evidence for the first two categories, but not yet for the
