    Zhiyuan Robot, branded internationally as AGIBOT, is a Shanghai embodied-AI robotics company whose public profile
    now extends well beyond a single humanoid prototype. Official materials and reviewed reporting support a full-stack
    strategy across industrial humanoids, interaction-oriented systems, cleaning and workflow products, developer-facing
    assets, and partner-led commercialization. Public deployment proof is strongest in Chinese manufacturing and
    strategic procurement, while economic disclosure still lags the scale of the company’s narrative and valuation.
