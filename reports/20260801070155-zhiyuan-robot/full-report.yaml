      - number: '3.4'
        title: Moat assessment
        blocks:
          - type: paragraph
            body: >-
              The strongest moat in this category is probably not any one demo, actuator, or model checkpoint. It is the
              closed loop among data collection, deployments, service feedback, supply-chain depth, manufacturing
              execution, and financing stamina. On that definition, Zhiyuan has a plausible moat in China because it
              combines broad public products, industrial investors, visible orders, and a fast-scaling manufacturing
              narrative. But the moat is not settled. Figure has more capital and a globally resonant enterprise
              flagship account. Unitree may have equal or stronger hardware-price legibility. UBTECH has public-company
              maturity and industrial focus. Apptronik and Agility have commercialization infrastructure that could
              convert into stronger enterprise durability later. Zhiyuan's moat case is therefore real but still
              conditional: it looks best when judged on China ecosystem execution and worst when judged on globally
              comparable disclosure quality and repeat paying deployments.
