  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan Robot deserves a real investment discussion because the public evidence has crossed a threshold
              that many humanoid startups never reach: identifiable shipments, named customers, multiple public product
              surfaces, and ecosystem-building around embodied AI. The strongest positive case rests on three things.
              First, external analysts and company materials both support a leadership position in China’s shipment
              narrative. Second, named-customer proof now exists in factory and procurement contexts rather than only on
              stage. Third, the company is clearly trying to build platform depth through products, models, data, and
              partners rather than a single demo. Those are not trivial strengths. At the same time, the valuation
              debate cannot stop at “category leader.” The thesis must be held alongside weak public economics,
              concentration risk, and structural hardware capital intensity. That is why the chapter’s final stance is
              constructive but disciplined: the company is worth tracking closely, but not yet easy to underwrite at
              headline valuations.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV013
              - CV015
              - CV034
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV015
              - CV016
              - CV040
      - number: '8.2'
        title: Recommendation
        blocks:
          - type: paragraph
            body: >-
              The current recommendation is track. That choice is not a soft hedge; it reflects a specific mismatch
              between real promise and incomplete proof. Zhiyuan is credible enough that ignoring it would be a mistake,
              especially given its shipment positioning and customer momentum. But the public record is still too thin
              on revenue denominator, gross margin, service burden, and balance-sheet strength to justify a
              high-conviction “invest now at almost any price” posture. Investors should also remember that private
              humanoid valuations are being set inside a narrative-rich market where global peers can trade on
              frontier-model excitement and strategic optionality rather than present-day economics. In that
              environment, discipline matters more than speed. Tracking Zhiyuan while pushing hard on disclosure may
              actually create a better entry than racing to validate a mark whose economics remain opaque.
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV007
              - CV014
              - CV015
              - CV016
              - CV040
          - type: table
            tableRef: TV001
