  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk overview
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan’s risk picture is not a single “technology risk” box; it is a layered underwriting problem
              spanning regulation, operations, partners, and capital. Policy in China is generally supportive of
              robotics and embodied AI, but the same policy momentum is also raising standards around safety, testing,
              cybersecurity, and governance. Public field evidence shows the company has moved into real factory
              environments, which is strategically positive but also means errors now carry physical, commercial, and
              legal consequences. At the same time, the commercialization model depends on a narrow cluster of named
              customers and a broadening partner network, while the balance sheet remains opaque. The right risk frame
              is therefore two-sided: Zhiyuan has more real-world traction than many early humanoid startups, but that
              traction increases the importance of compliance, service discipline, and cash management rather than
              reducing it.
