        title: Operational risks
        blocks:
          - type: paragraph
            body: >-
              Operational risk becomes real the moment robots leave the lab, and Zhiyuan is already past that point. The
              Fulin site report is instructive because it shows both progress and exposure: the robot can handle boxes,
              stop when a human approaches, and work inside a live industrial setting, but doing so requires maintenance
              expertise, environment-specific tuning, and ongoing algorithm improvement. The company’s apparent reliance
              on heavy simulation plus smaller amounts of real-world data is rational for scaling, yet it leaves
              residual risk around generalization, edge cases, and safety in unfamiliar environments. Public skepticism
              from more critical coverage is useful here because it tempers the instinct to read every deployment as
              fully solved. The practical risk is not that the robots do nothing useful; it is that service burden,
              reliability variance, and scenario-specific engineering could scale faster than margins or customer
              patience.
