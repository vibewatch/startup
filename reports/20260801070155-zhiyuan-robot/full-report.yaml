  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market definition
        blocks:
          - type: paragraph
            body: >-
              The correct market boundary for Zhiyuan Robot is much narrower than “all robotics” and slightly broader
              than “humanoid hardware.” Official materials show the company sells not only robot bodies but also
              embodied-AI tooling, data services, and developer infrastructure. That makes the relevant market a bundle
              of general-purpose humanoid systems plus the surrounding embodied-software and service layers that make
              those robots deployable. At the same time, the company does not justify counting unrelated industrial
              arms, pure software copilots, or generic automation under the same denominator. The boundary should
              therefore include human-form robots and the directly attached stack—models, tools, data, and operating
              services—while excluding adjacent automation categories that lack product overlap. This matters because a
              broad robotics TAM can make any startup look large, while a disciplined embodied-humanoid market frame
              makes Zhiyuan’s actual addressability and proof burden more comparable to peers such as Figure, Unitree,
              UBTECH, Agility, and Apptronik.
