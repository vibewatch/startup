      - number: '4.4'
        title: Capital adequacy
        blocks:
          - type: paragraph
            body: >-
              Public evidence is strong that humanoid companies need deep capital pools, but weak on Zhiyuan’s own
              balance sheet. Apptronik’s giant equity rounds, Figure’s high-volume manufacturing push, and UBTECH’s
              large listed-company cash and borrowing disclosures all show that serious competitors fund hardware
              scale-up, software iteration, and deployment support simultaneously. UBTECH is the most concrete
              benchmark: even with more than RMB2.0 billion in 2025 revenue and improved gross margin, it still reported
              a large net loss and meaningful operating cash burn. That benchmark matters because Zhiyuan has not
              disclosed public cash, borrowings, or receivable balances with comparable specificity. Investors therefore
              cannot yet measure runway directly and should assume financing dependency persists until commercial
              revenue and service economics are disclosed more clearly. The likely next-round trigger is not simply
              “growth capital,” but evidence that deployment conversion and post-installation support can scale without
              consuming disproportionate cash.
