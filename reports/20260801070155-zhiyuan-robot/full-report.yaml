      - number: '1.2'
        title: Founders and leadership
        blocks:
          - type: paragraph
            body: >-
              Official leadership disclosure materially changes the founder narrative. The company now publicly names
              Deng Taihua as founder, chairman, and CEO, while Peng Zhihui is named co-founder, president, and CTO. That
              is a more formal control picture than the popular shorthand that centers only on Peng’s internet fame.
              Peng still matters enormously: independent reporting ties him to Huawei’s Genius Youth program, earlier
              work at OPPO, and a large creator following that gives Zhiyuan brand reach and talent magnetism uncommon
              for an industrial startup. But the disclosed bench shows a much broader operating company, with senior
              roles for marketing, embodied-business operations, general business, science, and HR. Public reporting
              also shows executives defending pricing, supply-chain choices, and commercialization sequencing in detail,
              suggesting leadership is optimizing not just for robotics R&D but for scaled deployment. The main
              unresolved governance gap is not who the executives are; it is how board control, preference rights, and
              founder voting power are allocated behind the scenes.
