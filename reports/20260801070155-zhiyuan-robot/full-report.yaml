    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation
        blocks:
          - type: paragraph
            body: >-
              Zhiyuan’s public customer map is easiest to understand by workflow rather than by industry label alone.
              The strongest visible segment is structured industrial manufacturing, where robots can be inserted into
              sorting, handling, and inspection tasks with measurable labor or throughput logic. Telecom or strategic
              procurement is the second visible bucket, with China Mobile standing out as a budget-owning buyer rather
              than just a demonstration host. A third bucket is partner-led commercialization, where APC 2026 and the UK
              and ANZ follow-on events suggest local partners may help convert technology into deployments. Service,
              tourism, and interaction scenarios appear in company messaging as well, but with much lighter third-party
              customer proof. This means Zhiyuan’s customer base is not balanced across segments. It is currently
              weighted toward buyers who can justify robotics in structured, enterprise-style workflows, which is a
              healthier pattern than consumer hype but still leaves concentration risk if only a handful of such buyers
              scale.
