companyProfile:
  summary: >-
    Zhiyuan Robot, branded internationally as AGIBOT, is a Shanghai embodied-AI robotics company whose
    public profile now extends well beyond a single humanoid prototype. Official materials and reviewed
    reporting support a full-stack strategy across industrial humanoids, interaction-oriented systems,
    cleaning and workflow products, developer-facing assets, and partner-led commercialization. Public
    deployment proof is strongest in Chinese manufacturing and strategic procurement, while economic
    disclosure still lags the scale of the company’s narrative and valuation.
  foundedDate: '2023-02-01'
  founders:
    - name: Deng Taihua
      role: Founder, Chairman, and CEO
      background: >-
        Publicly disclosed founder-chairman-CEO who anchors Zhiyuan’s formal governance and
        commercialization posture.
      claimRefs: [CO005]
    - name: Peng Zhihui
      role: Co-founder, President, and CTO
      background: >-
        Technical co-founder and public-facing robotics builder whose visibility materially strengthens
        talent, brand, and product storytelling.
      claimRefs: [CO006]
  foundingLocation: Shanghai, China
  headquarters: Shanghai, China
  productSummary: >-
    Portfolio spans industrial and wheeled humanoids, service and interaction systems, cleaning
    equipment, developer-facing open-source assets, and embodied-AI model / data infrastructure.
  customerFocus: >-
    Public proof is concentrated in manufacturing, strategic procurement, and partner-led enterprise
    commercialization, with Fulin Precision, China Mobile, Chery mentions, and Longcheer as the clearest
    named signals.
  businessModel: >-
    Mixed model of robot hardware, deployment and integration work, maintenance and support, and longer-
    term platform value through data, tooling, and partner ecosystem expansion.
  stage: private, post-Series B
  fundingStatus: >-
    Public reporting points to 2025 strategic financing rounds involving Tencent and later JD-backed or
    related investors, with a valuation anchor around RMB15 billion / about US$2.07 billion; exact
    round mechanics remain private.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO005, CO006, CO016, CO017, CO018, CO020, CI001, CI019, CU034, CV004]

summary:
  headline: >-
    Track: Zhiyuan is a credible China humanoid frontrunner with real deployment proof, but the current
    public mark already prices in more confidence than the public economics can yet support.
  overallScore: 6.7
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 2070
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: null
    customerCount: null
    headcount: null
  topStrengths:
    - >-
      Public evidence supports real shipment and commercialization momentum, including leadership in the
      China shipment narrative and multiple named enterprise proofs.
    - >-
      The company is building a broader platform than a single robot body, combining product breadth,
      open technical assets, models, data, and partner ecosystem positioning.
    - >-
      Named deployment and procurement examples such as Fulin Precision, China Mobile, and Longcheer give
      Zhiyuan more concrete adoption proof than many purely narrative-stage humanoid startups.
    - >-
      Strategic investors and ecosystem partners increase the chance that manufacturing, channel, and
      commercialization support keep compounding.
  topRisks:
    - >-
      Public revenue, gross margin, burn, debt, and cap-table detail remain too opaque for clean
      valuation underwriting.
    - >-
      Customer proof is still concentrated in a narrow cluster of flagship accounts, making narrative and
      revenue concentration risk meaningful.
    - >-
      Hardware-plus-service capital intensity appears structural for the category, raising future dilution
      and runway risk if deployment economics mature slowly.
    - >-
      Operational reliability, safety, and support burden remain only partially disclosed despite the
      company already moving into real industrial environments.
    - >-
      International expansion and partner-led deployment add compliance, quality-control, and governance
      complexity before overseas paying-customer depth is clearly proven.
  unresolvedGaps:
    - Audited 2025-2026 revenue, gross margin, and shipment-to-revenue bridge
    - Current cash balance, debt profile, monthly burn, and downside runway plan
    - Customer cohort table showing live robots, expansions, churn, and service burden by account type
    - Exact 2025 financing terms, cap table, and liquidation preference stack
    - Top-customer concentration, overseas paying-customer count, and field-support KPIs
    - Security, privacy, liability, and incident-control pack expected by large enterprise buyers or IPO investors

