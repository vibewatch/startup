- id: TR004
  title: People / execution risk register
  columns:
  - Risk
  - Public evidence
  - Severity
  - Why it matters
  - Diligence ask
  rows:
  - - Scope sprawl across product lines
    - Broad portfolio and module spin-outs are visible
    - High
    - Breadth can weaken focus exactly when service discipline matters
    - Request org chart, P&L ownership, and roadmap prioritization.
  - - Deployment-team scaling
    - Field specialists are explicitly required
    - High
    - Customer success depends on execution capacity, not only hardware quality
    - Request headcount by deployment and support role.
  - - Commercialization discipline
    - Orders and pilots may outrun repeatable processes
    - Medium-high
    - Weak process control can damage margins and references
    - Request stage-gate criteria from pilot to scaled rollout.
  - - Leadership dependence on flagship narrative
    - Category hype can pressure aggressive expansion
    - Medium
    - Narrative-led scaling can distort operating decisions
    - Request board-level risk governance and KPI dashboard.
  - - Financial-ops maturity
    - No public treasury detail despite scale ambitions
    - High
    - Liquidity mistakes can become existential quickly
    - Request budgeting cadence, covenant monitoring, and treasury controls.
  notes: People and execution risks combine org design, commercialization process, and finance discipline.
  claimRefs:
  - CR018
  - CR027
  - CR028
  - CR031
  - CR039
- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Topic
  - Visible mitigation
  - Residual risk
  - Kill criterion
  - Required evidence
  rows:
  - - Safety and operations
    - Observed stop behavior plus deployment learning
    - Still high without incident and uptime data
    - Any serious unresolved safety incident or repeated task failure at flagship sites
    - Incident log, hazard review, uptime history.
  - - Data and legal compliance
    - China policy and legal frameworks are knowable
    - Still medium-high without company control pack
    - Inability to produce auditable privacy / security / liability controls before broader rollouts
    - Security architecture, privacy map, legal accountability matrix.
  - - Customer concentration
    - Named logos and tenders prove demand
    - Still high while portfolio remains narrow
    - Loss or non-expansion of one or two flagship accounts with no replacement pipeline
    - Top-customer concentration and cohort expansion data.
  - - Supplier and policy dependence
    - Management can build contingency plans
    - Still high if single-source or export-exposed components dominate
    - No dual-source or contingency path for critical components
    - BOM concentration and alternative sourcing proof.
  - - Liquidity discipline
    - Peer evidence provides cautionary benchmark
    - Still high while Zhiyuan cash/burn remain private
    - Inability to show 18+ months runway under downside assumptions
    - Cash, debt, runway, and downside financing plan.
  notes: Kill criteria are intentionally evidence-based rather than narrative-based.
