  figureRefs:
  - FR002
- id: operational-risks
  title: Operational risks
  body: 'Operational risk becomes real the moment robots leave the lab, and Zhiyuan is already past that point. The Fulin site report is instructive because it shows both progress and exposure: the robot can handle boxes, stop when a human approaches, and work inside a live industrial setting, but doing so requires maintenance expertise, environment-specific tuning, and ongoing algorithm improvement. The company’s apparent reliance on heavy simulation plus smaller amounts of real-world data is rational for scaling, yet it leaves residual risk around generalization, edge cases, and safety in unfamiliar environments. Public skepticism from more critical coverage is useful here because it tempers the instinct to read every deployment as fully solved. The practical risk is not that the robots do nothing useful; it is that service burden, reliability variance, and scenario-specific engineering could scale faster than margins or customer patience.'
  claimRefs:
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
  - CR033
  - CR034
  - CR035
  tableRefs:
  - TR002
- id: partner-dependency-risks
  title: Partner and dependency risks
  body: 'Zhiyuan’s route to scale is partner-rich by design, and that creates a distinct dependency profile. On one side, integrators and channel partners are helpful because they can speed localization, site adaptation, and international reach. On the other, they introduce quality-control, accountability, and brand-consistency risk. The same is true for customer concentration: a small number of high-profile logos can accelerate conversion while simultaneously increasing exposure if any flagship account disappoints. Geopolitical and component dependencies also matter, because a humanoid stack inevitably relies on high-spec hardware and a cross-border ecosystem that may be stressed by export rules or industrial-security regulations. These are not hypothetical second-order issues; they are direct constraints on delivery reliability, gross margin, and the credibility of expansion plans.'
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR036
  - CR037
  - CR040
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: financial-risks
  title: Financial risks
  body: 'Financial risk remains elevated mostly because the public record is asymmetric: there are more signals of ambition and deployment than there are signals of cash adequacy and unit economics. UBTECH’s annual report is useful here because it demonstrates that even a larger, listed humanoid peer with growing revenue and improving gross margin can still consume significant cash and remain loss-making. That suggests category capital intensity is structural, not a temporary artifact. For Zhiyuan specifically, the problem is lack of direct disclosure. Investors do not have public cash, debt, covenant, or receivable data with which to stress-test downside cases. Shipment-leadership narratives from TrendForce and IDC therefore should be read as market-position signals, not as balance-sheet comfort. A company can be ahead on units and still behind on liquidity resilience.'
  claimRefs:
  - CR027
  - CR028
  - CR029
  - CR030
  - CR031
  tableRefs:
  - TR004
- id: mitigations
  title: Mitigations
  body: 'The public mitigation picture is encouraging but incomplete. Positive signals include evidence of basic safety behaviors in the field, a willingness to engage the emerging standards environment, open acknowledgment that deployment learning matters, and an ecosystem strategy that can widen go-to-market reach. Yet the strongest mitigations are still the ones that remain private: audited control packs, incident logs, support KPIs, supplier contingency plans, and liquidity discipline. The right diligence response is not to assume the company is overexposed, but to set hard evidence thresholds before new capital is committed. If Zhiyuan cannot demonstrate conversion from flagship orders to stable live deployments, produce defensible governance and data controls, or show that service burden is scaling sustainably, those should be treated as kill criteria even if the headline market narrative remains hot.'
  claimRefs:
  - CR032
  - CR033
  - CR034
  - CR035
  - CR036
  - CR037
  tableRefs:
  - TR005
tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Risk
  - Why it matters
  - Severity
  - Public signal
  - Diligence ask
  rows:
  - - Product liability and accountability
    - Robots act in physical spaces and can cause injury or operational loss
    - High
    - Legal guidance highlights shared accountability across manufacturer/operator/software layers
    - Request liability allocation, insurance, and incident escalation policy.
  - - Data-security and privacy compliance
    - Embodied systems capture environment and operational data
    - High
    - DSL, CSL amendments, and privacy guides raise compliance obligations
    - Request data map, retention policy, access controls, and cross-border rules.
  - - Humanoid standards conformance
    - Emerging standards shape market access and customer trust
    - Medium-high
    - MIIT / SESEC standardization momentum is visible
    - Request internal standards roadmap and test evidence.
  - - Export-control / industrial-security disruption
    - Rules can restrict components, customers, or cross-border delivery
    - High
    - MOFCOM and legal advisories show fast-changing trade controls
    - Request export-control screening and alternative sourcing plan.
  - - Undisclosed litigation / penalty history
    - Public silence is not proof of absence
    - Medium-high
    - No complete public schedule found
    - Request litigation, penalty, and recall schedule.
  notes: This register emphasizes external compliance and legal exposure rather than pure product bugs.
  enumerationScope:
    coverage: partial
    basis: Rows cover the most material public regulatory and legal exposures visible in reviewed sources, not every statute or jurisdictional nuance.
