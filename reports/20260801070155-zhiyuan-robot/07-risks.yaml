- id: TR002
  title: Operational / quality / security risk register
  columns:
  - Risk
  - Signal
  - Severity
  - Why it matters
  - Diligence ask
  rows:
  - - Human-proximity safety risk
    - Factory reporting shows active stop behavior and busy environments
    - High
    - Safety design must hold in real industrial settings, not just demos
    - Request hazard analysis, incidents, and near-miss logs.
  - - Model generalization risk
    - Simulation-heavy training with residual field variability
    - High
    - Unexpected environments can create failures or support burden
    - Request failure taxonomy and real-world retraining loop metrics.
  - - Service and maintenance burden
    - O&M requires skilled staff and deployment adaptation
    - High
    - Field-service load can erode customer economics and scalability
    - Request MTTR, support staffing, and issue backlog by cohort.
  - - Cybersecurity and telemetry risk
    - Robots and cloud tooling create a data-attack surface
    - Medium-high
    - Security weakness could affect customers and regulators
    - Request security architecture, pentest history, and response playbook.
  - - Workflow reliability risk
    - Industrial customers require consistent task execution and uptime
    - High
    - Inconsistent performance can kill reference accounts quickly
    - Request uptime, task-success rates, and escalation process.
  notes: Most critical operational metrics are private, so the table distinguishes observed risks from missing controls.
  claimRefs:
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  - CR017
  - CR018
- id: TR003
  title: Partner / dependency risk register
  columns:
  - Dependency
  - Risk
  - Severity
  - Why it matters
  - Diligence ask
  rows:
  - - Integrators and deployment specialists
    - Variable quality or slow rollout
    - High
    - Deployment is not purely internal and depends on partner execution
    - Request partner QA process and escalation ownership.
  - - Channel / regional partners
    - Brand inconsistency or weak service coverage overseas
    - Medium-high
    - Partner-led expansion can outpace operating control
    - Request partner certification and regional support map.
  - - Named flagship customers
    - Concentration and reference-account risk
    - High
    - A few logos may drive disproportionate narrative and revenue weight
    - Request top-customer concentration and renewal status.
  - - Critical components / suppliers
    - Lead-time or sourcing shocks
    - High
    - Export controls and single-source parts can impair delivery
    - Request BOM concentration and dual-source readiness.
  - - Cross-border policy environment
    - Trade or procurement restrictions
    - Medium-high
    - Policy shifts can block markets or inputs unexpectedly
    - Request jurisdictional compliance playbook and contingency scenarios.
  notes: 'Dependency risk is commercial as much as technical: the weakest node can slow the whole rollout engine.'
