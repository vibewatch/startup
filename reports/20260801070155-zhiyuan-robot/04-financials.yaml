- id: financial-verdict
  title: Financial verdict
  body: 'The public financial verdict is promising but still incomplete. Zhiyuan appears to have crossed from concept-stage narrative into real commercialization, with named enterprise orders, deployment evidence, and a monetization surface broader than a single robot sale. But the company remains difficult to underwrite like a normal growth equity investment because the crucial denominators are missing: realized ASPs by model, revenue by deployment type, gross margin after service burden, receivable aging, inventory profile, and monthly burn. Public peer filings and financing announcements show why this matters. In humanoids, revenue can rise quickly while losses and capital needs remain large, especially if support, data, and manufacturing costs expand in parallel. The prudent conclusion is that Zhiyuan has a credible revenue engine in formation, but not yet a public-quality financial model. The next diligence round should focus less on headline valuation and more on cash conversion, margin
    trajectory, and repeat deployment economics.'
