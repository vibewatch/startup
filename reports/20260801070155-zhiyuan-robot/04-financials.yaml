  - - Zhiyuan external equity support
    - Strong 2025 fundraising history and strategic backers
    - medium
    - Suggests financing access, but not current runway sufficiency.
    - Request post-round cash bridge and planned use of funds.
  - - Peer liquidity benchmark
    - UBTECH cash and cash equivalents ~RMB4.89bn; borrowings ~RMB1.12bn
    - high
    - Shows the capital stack required for scaled industrial humanoid operations.
    - Benchmark Zhiyuan’s internal balance sheet against listed-peer liquidity needs.
  - - Likely next-round trigger
    - Need to fund manufacturing, deployment support, and model/data iteration until margins and collections mature
    - medium
    - Clarifies why commercialization progress, not just valuation, should drive financing decisions.
    - Request board plan for next financing trigger and downside liquidity case.
  notes: Capital adequacy remains the least transparent part of the Zhiyuan underwriting case in public sources.
