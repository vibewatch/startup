  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Current value / status
  - Quality
  - Diligence ask
  rows:
  - - Robot hardware sales
    - Sell humanoid or wheeled robot units to enterprise buyers
    - Per robot or project bundle
    - Clearly present in public product and deployment record
    - Medium
    - Break out realized ASP by model and share of revenue recognized on delivery versus acceptance.
  - - Deployment / integration services
    - Site adaptation, workflow design, installation, and debugging
    - Per deployment or per site
    - Strongly implied by Fulin and solutions pages
    - Medium
    - Quantify integration fees, implementation margin, and labor burden per site.
  - - Operations / maintenance support
    - Technical support and post-installation optimization
    - Per contract or embedded in project economics
    - Explicitly referenced as a cost driver in public deployment reporting
    - Low-medium
    - Disclose annual service attach rate, renewal terms, and support headcount per active robot.
  - - Data / training / tooling
    - Developer, data, or training infrastructure around embodied AI
    - Per platform, service, or bundled offering
    - Visible in D1 Ultra, research, and solutions surfaces but not financially quantified
    - Low
    - Disclose paying customers, pricing model, and whether revenue is recurring or project-based.
  - - Strategic tenders / large projects
    - Large enterprise or quasi-procurement contracts
    - Per tender / project package
    - China Mobile and Fulin show this as a meaningful channel
    - Medium
    - Map tender value to delivery schedule, payment milestones, and repeatability.
  notes: Public evidence supports the existence of each stream, but not the revenue mix or recognition schedule for any one stream.
