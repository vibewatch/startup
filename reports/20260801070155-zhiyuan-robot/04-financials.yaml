company:
  name: Zhiyuan Robot
chapter:
  number: 4
  title: Financials
  summary: Zhiyuan Robot’s public financial picture shows real commercial emergence but still substantial underwriting blind spots. Enterprise tenders, factory deployments, and broad product surfaces support a mixed hardware-plus-services revenue model, while public peer filings show the category remains capital intensive even at larger scale. The largest unknowns are still Zhiyuan’s own revenue mix, margins, burn, and runway.
sections:
- id: revenue-model
  title: Revenue model
  body: 'Zhiyuan’s public record supports a multi-layer revenue story, but not a clean financial statement. Official product, research, and solutions pages show a company that is selling more than a single humanoid SKU: the public surface includes full-size and wheeled robots, data-collection and training infrastructure, and scenario-specific solutions. That means the monetization architecture likely spans hardware sales, deployment and integration work, maintenance, and eventually software or tooling attachments. The enterprise proof sources reinforce this. The China Mobile tender is clearly project-style revenue, while the Fulin Precision factory evidence shows the company first embedding robots into workflow and only then scaling volumes. In other words, revenue quality likely depends on acceptance milestones, deployment services, and site-specific work, not just units shipped. Investors should therefore read shipment headlines as lead indicators, not as the revenue statement itself.'
  claimRefs:
