- id: cost-structure
  title: Cost structure
  body: 'The cost structure looks more like a capital-intensive systems business than like a software company. Zhiyuan’s public materials imply spending across robot hardware, embodied-model research, data infrastructure, deployment teams, and solution engineering. Peer evidence sharpens the picture. Figure’s BotQ narrative, Apptronik’s manufacturing and partnership announcements, and TrendForce’s volume-driven commercialization framing all point toward the same mechanism: scale is needed to push down unit cost, but getting to scale requires serious upfront factory, tooling, and organizational investment. Fulin’s deployment details add a second cost layer because the company needs scenario debugging, safety validation, and integration support. Working capital is also a likely hidden pressure point. Enterprise and state-linked customers may pay on acceptance cycles rather than at order announcement, which can create receivable and inventory strain before margins fully mature. The category
    should therefore be modeled as hardware plus service plus data, with multiple cost centers all ramping ahead of clean revenue visibility.'
  claimRefs:
  - CI016
  - CI017
  - CI018
  - CI019
  - CI020
  - CI021
  - CI022
  - CI023
  - CI031
  figureRefs:
  - FI004
- id: capital-adequacy
  title: Capital adequacy
  body: 'Public evidence is strong that humanoid companies need deep capital pools, but weak on Zhiyuan’s own balance sheet. Apptronik’s giant equity rounds, Figure’s high-volume manufacturing push, and UBTECH’s large listed-company cash and borrowing disclosures all show that serious competitors fund hardware scale-up, software iteration, and deployment support simultaneously. UBTECH is the most concrete benchmark: even with more than RMB2.0 billion in 2025 revenue and improved gross margin, it still reported a large net loss and meaningful operating cash burn. That benchmark matters because Zhiyuan has not disclosed public cash, borrowings, or receivable balances with comparable specificity. Investors therefore cannot yet measure runway directly and should assume financing dependency persists until commercial revenue and service economics are disclosed more clearly. The likely next-round trigger is not simply “growth capital,” but evidence that deployment conversion and post-installation
    support can scale without consuming disproportionate cash.'
  claimRefs:
  - CI024
  - CI025
  - CI026
  - CI027
  - CI028
