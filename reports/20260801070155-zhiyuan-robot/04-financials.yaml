- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Exact diligence path
  rows:
  - - Monthly revenue by model and scenario
    - Needed to separate pilots, tenders, and durable deployments
    - Request monthly management P&L with contract and acceptance waterfall.
  - - Gross margin after service burden
    - Needed to test whether deployment support erodes hardware economics
    - Request contribution margin by deployment archetype including field-service labor.
  - - Cash, burn, and runway
    - Needed to assess capital adequacy and financing urgency
    - Request treasury schedule, monthly cash flow, and downside runway case.
  - - Receivable and inventory profile
    - Needed to assess working-capital drag and customer payment quality
    - Request AR aging, inventory turns, write-down policy, and acceptance terms.
  - - CAC, conversion, and renewal metrics
    - Needed to judge whether project sales become repeatable growth
    - Request pipeline funnel, win rate, deployment conversion, service renewal, and cohort retention.
  notes: These are not nice-to-have metrics; they are the minimum package required for real underwriting in a capital-intensive hardware business.
