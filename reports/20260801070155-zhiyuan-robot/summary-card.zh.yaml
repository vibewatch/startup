  topStrengths:
    - 公开证据显示，公司已有真实出货和商业化势头，包括在中国出货叙事中的领先位置，以及多个具名企业案例。
    - 公司做的不是单一机器人本体，而是更宽的平台：产品线、开放技术资产、模型、数据和伙伴生态一起铺开。
    - Fulin Precision、China Mobile、Longcheer 等具名部署和采购案例，让 Zhiyuan 比许多仍停留在叙事阶段的人形机器人创业公司有更扎实的采用证据。
    - 战略投资者和生态伙伴提高了制造、渠道、商业化支持持续叠加的概率。
  topRisks:
    - 公开披露的收入、毛利率、烧钱速度、债务和股权结构仍过于不透明，难以干净地做估值承销。
    - 客户证据仍集中在少数旗舰账户，叙事集中和收入集中风险都不低。
    - 硬件加服务的资本强度看起来是该品类的结构性问题；如果部署经济性成熟慢，后续稀释和现金跑道压力会升高。
    - 公司已经进入真实工业场景，但运营可靠性、安全和支持负担仍只披露了一部分。
    - 国际扩张和伙伴主导部署会在海外付费客户深度跑出来之前，先带来合规、质量控制和治理复杂度。
  unresolvedGaps:
