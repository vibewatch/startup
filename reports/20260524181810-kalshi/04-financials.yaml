  - id: trading-volume-and-operating-scale
    title: Trading Volume and Operating Scale
    body: >-
      Kalshi's notional trading volume reached an estimated $50 billion annualized by October 2025,
      as reported by BraveNewCoin at the time of the Series D financing announcement. Weekly volume
      regularly exceeded $1 billion by December 2025, corroborated by Reuters and Crunchbase, and
      climbed above $2 billion per week during major events by early 2026. Super Bowl LX on
      February 9, 2026, drove approximately $1 billion in single-day volume, demonstrating
      concentrated event-day capacity.


      The user base expanded to at least 5 million registered accounts by May 2026, per Time's 100
      Most Influential Companies profile. Headcount grew rapidly from approximately 70 employees in
      October 2025 to 494 by April 2026 according to Tracxn, signaling accelerated investment in
      trading infrastructure, compliance, and market operations. Revenue per registered user,
      computed from 2025 fee revenue and May 2026 user count, is an estimated $52.70—likely
      understated because the user count lags the revenue period.


      An independent volume verification emerged from the Massachusetts AG's enforcement inquiry,
      which documented over $1 billion in sports wagers from 3.4 million individual bets placed on
      Kalshi in the first half of 2025 alone. This regulatory record provides a partial third-party
      audit of volume levels that is not otherwise available from Kalshi's private financial
      disclosures. The $1.5 billion annualized run rate guidance from management implies a 469%
      acceleration from 2025 actuals if sustained through the full year.
    claimRefs:
      - CI011
      - CI012
      - CI013
      - CI014
      - CI015
      - CI016
      - CI017
      - CI018
    tableRefs:
      - TI003
    figureRefs:
      - FI003

  - id: capital-structure-and-funding-history
    title: Capital Structure and Funding History
    body: >-
      Kalshi has raised approximately $2.8 billion in total disclosed equity financing across six
      institutional rounds from 2020 through 2026. The most recent tranche—a $1 billion Series F
      led by Coatue Management in March 2026 at a $22 billion post-money valuation—was supplemented
      by a $200 million add-on from Baillie Gifford in May 2026, extending the effective Series F
      total to $1.2 billion. Prior institutional rounds include: Series C ($185 million at $2
      billion, June 2025), Series D ($300 million at $5 billion, October 2025), and Series E ($1
      billion at $11 billion, December 2025).


      SEC Form D filings provide the most authoritative confirmation of individual raise amounts.
      The December 2025 Form D (accession 0001231919-25-000572, CIK 0001806928) confirmed
      $999,996,557 in Series E proceeds, essentially $1 billion. A prior filing (accession
      0001231919-25-000391, filed October 30, 2025) recorded $124,999,957, representing a formal
      tranche of the Series D round. The Series A was confirmed by Form D 0001806928-21-000001
      filed February 23, 2021. The SEC EDGAR filings index for Kalshi Inc. (CIK 0001806928) shows
      five Form D filings between 2020 and 2025, validating multiple equity financing events.


      At the $22 billion March 2026 valuation against $263.5 million in 2025 fee revenue, Kalshi
      is priced at approximately 84x trailing revenue—an exchange-infrastructure premium reflecting
      investors' view of the platform's regulatory moat and network-effect defensibility rather than
      near-term profitability. Sequoia Capital and Paradigm have led or co-led every institutional
      round through the Series E; Coatue Management led the Series E and F.
    claimRefs:
