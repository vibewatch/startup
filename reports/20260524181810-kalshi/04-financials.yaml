  - id: cost-structure-and-financial-gaps
    title: Cost Structure, Burn Rate, and Financial Disclosure Gaps
    body: >-
      As a privately held CFTC-designated contract market (DCM), Kalshi is not required to file
      audited financial statements publicly. No income statement, balance sheet, or cash flow
      statement is available from any public source. Key undisclosed financial metrics include gross
      margin, operating expense breakdown, EBITDA, net income or loss, and cash burn rate. Exchange-
      comparable businesses (futures exchanges, prediction markets with public analogues) typically
      operate at gross margins of 60–80%, but no Kalshi-specific evidence exists to validate this
      range.


      Observable proxies for the cost base include headcount growth (70 to 494 employees over six
      months), a New York City headquarters at 416 West 13th Street, and active regulatory
      compliance expenditures. Headcount of 494 at an estimated $200,000 per employee implies a
      rough annual labor cost of approximately $99 million, though actual fully-loaded costs
      (benefits, equity, infrastructure) would be higher. Kalshi self-identified Rule 5.17(z)
      violations in early 2026 and incurred CFTC enforcement fines; the monetary amounts are not
      publicly disclosed. The CFTC's April 2026 Van Dyke insider-trading complaint—the first
      ever involving event contracts—confirms the ongoing surveillance infrastructure required for
      regulated event contract markets, adding to Kalshi's compliance cost base.


      The American Gaming Association (AGA) has publicly characterized prediction market platforms
      as competitive threats to regulated sports betting revenues, supporting lobbying efforts that
      could materialize as additional state-level licensing or operational requirements. The
      Massachusetts AG enforcement proceedings and Arizona criminal case (blocked by a federal
      judge in 2025) collectively demonstrate that legal defense costs are a recurring line item.
      A 50% regulatory curtailment of sports volume—the sector generating 89% of Kalshi's 2025
      revenue—would materially impair the income statement under any plausible margin scenario.
    claimRefs:
      - CI030
      - CI031
      - CI032
      - CI033
      - CI034
      - CI035
      - CI036
      - CI037
      - CI038
