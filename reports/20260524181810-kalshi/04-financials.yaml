  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: gross-margin
      missingEvidence: >-
        Audited income statement showing gross profit and gross margin percentage for Kalshi
        Inc.'s fee revenue operations.
      whyItMatters: >-
        Without gross margin data, it is impossible to assess whether Kalshi is currently
        profitable, approaching breakeven, or requiring continued equity subsidies at the current
        operating scale.
      diligencePath: >-
        Request financial statements directly from Kalshi management, review any pre-IPO investor
        materials, or await a future public equity offering that triggers SEC registration
        requirements.
      relatedQuestionRefs:
        - QI008
      relatedTableRefs:
        - TI005

    - type: private-evidence-only
      severity: material
      topic: operating-costs
      missingEvidence: >-
        Audited operating expense breakdown covering technology and infrastructure, compliance,
        sales and marketing, and general and administrative costs.
      whyItMatters: >-
        Operating leverage and path to profitability cannot be assessed without knowing whether
        costs scale sub-linearly with volume (characteristic of exchange businesses) or
        proportionally (more typical of marketplace models).
      diligencePath: >-
        Obtain management presentations or board-level financial summaries; compare headcount
        ratios against public exchange analogues to triangulate.
      relatedQuestionRefs:
        - QI009
      relatedTableRefs:
        - TI005

    - type: private-evidence-only
      severity: material
      topic: cash-burn
      missingEvidence: >-
        Monthly or quarterly cash burn rate and cash runway estimates based on actual bank
        balances and operating cash outflows.
      whyItMatters: >-
        With $2.8 billion raised but no income statement visibility, the company's cash position
        and runway duration are entirely opaque, creating uncertainty around the need for
        additional fundraising.
      diligencePath: >-
        Require balance sheet as part of any due diligence process; note that current rapid growth
        capex could consume capital quickly even if operating margins are positive.
      relatedQuestionRefs:
        - QI014

    - type: private-evidence-only
      severity: minor
      topic: customer-acquisition-cost
      missingEvidence: >-
        Customer acquisition cost (CAC) data segmented by channel (organic, Robinhood, paid
        media, institutional) for retail and institutional trader segments.
      whyItMatters: >-
        Without CAC data, investor efficiency and long-term unit economics cannot be independently
        validated; the Robinhood partnership presumably reduces retail CAC but the magnitude is
        unquantifiable from public sources.
      diligencePath: >-
        Request channel-level marketing spend and cohort acquisition data from management;
        benchmark against public exchange and retail trading platform CAC disclosures.
      relatedQuestionRefs:
        - QI024

    - type: public-evidence-only
      severity: minor
      topic: aga-lobbying-financial-impact
      missingEvidence: >-
        No public financial statement, regulatory filing, or audited disclosure quantifies the
        specific revenue impact, compliance costs, or market-share loss attributable to AGA
        lobbying against prediction markets as of May 2026.
      whyItMatters: >-
        If AGA lobbying succeeds in curtailing CFTC-regulated event contracts, Kalshi's
        addressable market and revenue growth trajectory could be materially impaired; the
        absence of quantified impact makes scenario planning difficult.
      diligencePath: >-
        Review congressional testimony records and CFTC rulemaking dockets for proposed
        restrictions on event contracts; request management's regulatory-risk contingency
        analysis and scenario modelling in the data room.
      relatedQuestionRefs:
        - QI027
