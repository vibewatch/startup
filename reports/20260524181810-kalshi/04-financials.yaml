callouts:
  - calloutType: strength
    title: Revenue at Scale with Multi-Source Corroboration
    body: >-
      Kalshi's $263.5 million in 2025 fee revenue is confirmed by multiple independent sources
      including Time 100 and Bloomberg, corroborated by $50+ billion in traded volume and a
      consistent implied take rate of ~0.53%. This level of independent confirmation is unusual
      for a pre-IPO company and provides high analytical confidence.
    claimRefs:
      - CI001
      - CI002
      - CI011

  - calloutType: risk
    title: Extreme Revenue Concentration in Sports Contracts
    body: >-
      With approximately 89% of 2025 revenue from sports event contracts, Kalshi faces material
      concentration risk. Adverse regulatory or legislative action—such as state AG enforcement,
      AGA lobbying success, or a federal sports-wagering classification reversal—could impair
      the primary revenue driver and substantially alter the financial profile.
    claimRefs:
      - CI003
      - CI036
      - CI037

  - calloutType: insight
    title: Exchange Infrastructure Premium in Valuation
    body: >-
      At approximately 84x trailing 2025 revenue, Kalshi's $22 billion valuation signals investor
      conviction that it is regulated financial infrastructure rather than a consumer application.
      Exchange businesses with regulatory moats (CME, ICE) command durable high multiples; the
      premium reflects Kalshi's unique CFTC DCM designation and network-effect barriers.
    claimRefs:
      - CI024
      - CI028
      - CI011

  - calloutType: risk
    title: Complete Absence of Audited Financial Disclosure
    body: >-
      No income statement, balance sheet, or cash flow statement is publicly available. Gross
      margin, operating burn, and cash runway cannot be independently assessed. All financial
      judgments are based on management guidance and proxy indicators; financial diligence is
      materially constrained by this gap.
    claimRefs:
      - CI030
      - CI031
      - CI032

