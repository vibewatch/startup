    {
      "id": "customer-experience-proof",
      "title": "Customer experience proof",
      "body": "Public user evidence is meaningfully mixed rather than uniformly promotional. The large app-store footprint shows many users find the product easy enough to adopt, and multiple reviewers praise the clean interface, the breadth of markets, and the fact that the product feels simpler than offshore crypto-native alternatives. Independent app reviews reinforce that message: they describe the mobile experience as close to desktop parity, beginner-friendly, and available across both iOS and Android. But the adverse record is also strong. The App Store and Google Play pages include repeated complaints about buggy updates, stale live-market screens, confusing order entry, and slow support. Trustpilot's February 2026 snapshot rated Kalshi just 2.1 out of 5, while PissedConsumer rated it 1.5 stars from 10 reviews. Those complaint surfaces consistently cite withdrawal delays, KYC holds, disputed settlement, and difficulty reaching a human. The result is a customer proof set where product appeal is real but service quality and edge-case handling remain a material risk.",
