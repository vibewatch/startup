    {
      "id": "adoption-trajectory-and-distribution",
      "title": "Adoption trajectory and distribution channels",
      "body": "The strongest public traction proof is not a disclosed active-trader cohort but a combination of broad user count, app-store footprint, and broker-channel volume. TIME said Kalshi had more than 5 million users by April 2026. On 2026-05-24 the iOS app showed 121,000 ratings at 4.7 out of 5 and Google Play showed 23.9 thousand reviews at 4.7, which is unusually large social proof for a niche financial product. Reuters separately reported volumes above $1 billion per week and said Kalshi planned to use fresh capital to accelerate consumer adoption, add brokerages, and deepen media partnerships. Broker distribution is already material. Robinhood's Kalshi-powered product reportedly drove about $1 billion of contract volume in Q2 2025 alone, more than half of Kalshi's quarterly volume, and Robinhood later expanded the partnership into football contracts. Webull adds another large retail channel with more than 20 million registered users globally, even though public evidence still says less about actual Webull conversion than about the partnership itself.",
