  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Kalshi clearly has real customer adoption, but the adoption story is stronger on acquisition and channel reach than on durability. Independent evidence shows more than 5 million users, very large iOS and Android review footprints, and meaningful broker distribution through Robinhood and Webull, while institutional-access partnerships with Tradeweb and Clear Street show the platform is no longer purely retail. The main customer negatives are a severe adverse review footprint around withdrawals, KYC, support, and disputed settlement, plus no public disclosure of retention, channel economics, or concentration beyond sports-heavy and Robinhood-heavy volume anecdotes."
  },
