    {
      "id": "complaints-churn-risks-and-gaps",
      "title": "Complaints, churn risks, and unresolved diligence gaps",
      "body": "The main customer risks are not lack of interest or lack of reach; they are concentration, service reliability, and missing durability evidence. First, monetization is highly concentrated in sports: TIME and Webopedia both say sports drove roughly 89% of 2025 revenue, which means headline engagement and liquidity likely rise and fall with the sports calendar. Second, broker concentration is becoming material. Independent reporting says Robinhood has already represented more than half of Kalshi volume in some periods, creating a meaningful channel-dependence risk if brokerage terms or regulation change. Third, complaint forums repeatedly point to withdrawal delays, KYC loops, support bottlenecks, and settlement disputes — the kinds of edge-case failures that can drive churn even when the core product is compelling. Finally, the public record does not disclose NRR, GRR, renewal rates, channel mix, customer concentration, or enterprise logo retention. An investor can underwrite adoption and distribution; they still cannot underwrite durability with confidence from public materials alone.",
