  - id: FE001
    title: Kalshi 交易所平台架构栈
    type: stack
    layout: standard
    summary: Kalshi 技术架构的分层视图，从用户界面下钻到交易所基础设施和合规控制。
    data:
      layers:
        - label: 用户界面
          detail: 面向消费者的入口，支撑零售和嵌入式交易：Web 平台、移动应用和嵌入券商的枢纽。
          items:
            - Web 平台（kalshi.com / Vercel CDN）
            - 移动应用（iOS / Android——截至 2026 年 5 月，活跃上架未验证）
            - Robinhood Prediction Markets Hub（嵌入式；约 25-35% 体育交易量）
            - Webull 事件合约集成（嵌入式；2025 年）
        - label: API 层
          detail: 面向算法交易者和集成方的程序化访问入口：REST、WebSocket、演示沙盒和机构 FIX 协议。
          items:
            - REST API v3.19.0 接口（external-api.kalshi.com/trade-api/v2）
            - WebSocket API（实时流式传输；已发布 AsyncAPI 规范）
            - 演示 / 沙盒（demo-api.kalshi.co/trade-api/v2）
            - FIX 协议层（Kalshi fork 的 QuickFIX/Go；FIX 4.0–5.0 SP2）
        - label: 交易引擎
          detail: 核心撮合和定价基础设施：中央限价订单簿、订单类型、做市商流动性和费用模型。
          items:
            - 中央限价订单簿（CLOB）；每位用户最多 200K 个未结订单
            - 订单类型：限价、市价、IOC、GTC / expiring-GTT
            - 做市商计划（Susquehanna、Kalshi Trading；自 2025 年 5 月起）
            - 二次方吃单费公式；体育市场收取挂单费
        - label: 结算与预言机
          detail: 自动二元结算层，基于外部预言机数据将合约结算为 $1.00 或 $0.00；包含州级访问控制。
          items:
            - 二元结算引擎（结算时每份合约 $1.00 YES / $0.00 NO）
            - 外部数据预言机（官方统计、新闻通讯社、监管发布）
            - 地理围栏层（基于 IP 的州级市场访问控制）
        - label: 合规与托管
          detail: CFTC DCM 牌照要求的监管和托管控制：市场监控、资金隔离、KYC/AML 和内幕交易执法。
          items:
            - CFTC DCM 牌照（自 2020 年 11 月起；与 CME Group 同级）
            - 市场监控计划（Rule 5.17(z) 内幕交易执法）
            - 资金隔离（CFTC DCM 要求；用户资金单独持有）
            - KYC / AML 处理
        - label: 开发者与集成工具
          detail: 开发者生态层：规范驱动的 SDK、GitHub 仓库和区块链存款通道，支持第三方集成和入金。
          items:
            - OpenAPI 3.0 规范（可从 docs.kalshi.com 下载）
            - AsyncAPI 规范（WebSocket 流式传输）
            - Python SDK（PyPI 上的 kalshi-python v2.1.4；OpenAPI Generator v7.15.0）
            - GitHub 仓库（starter code 94★；tools-and-analysis 19★；QuickFIX fork）
            - 区块链存款通道（Solana ≤$500K、Bitcoin、USDC、Worldcoin）
    approximationNotes: API 层以下技术栈（云服务商、数据库、消息代理、前端框架）根据公开开发者文档和 GitHub 仓库分析推断；没有内部基础设施披露。
