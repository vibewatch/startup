      - number: '7.3'
        title: 市场诚信、KYC 与运营风险
        blocks:
          - type: paragraph
            body: >-
              Kalshi 对市场诚信的公开表态强硬，但可验证性并不均衡。公司称，允许入金交易前会对每个账户做持续交易监控和身份验证，并已与 Solidus Labs 和 Wharton 研究人员成立 Market
              Surveillance Advisory Committee。February 2026，Kalshi 禁止现任国会议员、国会候选人和政治操盘者交易他们可能影响的市场，并把该举措解释为回应内幕交易担忧。CFTC
              March 2026 执法指引强化了一点：反操纵规则适用于事件合约交易；House Oversight 调查和 Finance Magnates 报道也显示，国会正主动追问 Kalshi 的 KYC
              和监控实践是否足够。客户体验层又让问题更复杂：公开应用评测界面继续提示提款延迟和结算争议；Kalshi 服务条款设置强制仲裁，并保留暂停交易、解决市场的广泛裁量权。与 Arizona 相关的 $54
              million Khamenei 争议说明，结算完整性可以迅速转化为刑事式头条、民事风险和集体诉讼弹药。关键在于，Kalshi
              几乎所有市场诚信披露都依赖公司来源，而不是独立审计保证；监控究竟多久触发、争议如何解决，仍留有不确定性。运营 / 质量 / 安全风险登记表量化了这些失效模式和缓释成熟度。
