  - id: FI001
    title: Kalshi 收入模型流
    type: flow
    layout: standard
    summary: 事件合约从交易者买入、二元结算到 Kalshi 收费的生命周期，展示 Kalshi 无论结果如何都能收费的纯交易所模式。
    data:
      nodes:
        - id: trader-buy
          label: |-
            交易者下单
            每份 $0.01–$0.99
          detail: 用户按反映事件结果隐含概率的价格提交买单或卖单。
          tone: neutral
        - id: exchange-match
          label: |-
            Kalshi 交易所撮合
            订单簿
          detail: CFTC 监管的 DCM；作为中央对手方，不承担方向性风险。
          tone: positive
        - id: event-settle
          label: |-
            事件结算
            $1.00（Yes）或 $0.00（No）
          detail: 由可观察事件判定二元结果；采用 CFTC 定义的结算标准。
          tone: neutral
        - id: fee-collect
          label: |-
            Kalshi 收取
            单合约费用
          detail: 扣除交易费；不赚取价差，也不承担庄家头寸亏损。
          tone: positive
        - id: revenue-pool
          label: |-
            2025 年收入
            $263.5M（未经审计）
          detail: 年名义交易量约 $50B 带来累计单合约费用；隐含抽成率约 0.53%。
          tone: positive
      edges:
        - from: trader-buy
          to: exchange-match
          label: 订单提交至中央订单簿
        - from: exchange-match
          to: event-settle
          label: 撮合后的合约持有至到期
        - from: event-settle
          to: fee-collect
          label: 结算时扣费
        - from: fee-collect
          to: revenue-pool
          label: 汇总抽成率约 0.53%
    approximationNotes: 抽成率由分析师根据已报道收入和估计交易量推导；Kalshi 未发布官方费率表。节点数值（$263.5M、0.53%）未经审计。
