              否合约表达对体育、经济、政治、天气、文化和其他新闻驱动结果的看法。应用商店文案明确瞄准体育粉丝、对冲金融风险的投资者、预测者，以及搭建自动化策略的开发者；独立评测则认为，在受监管的美国交易平台中，Kalshi
              的市场选择异常宽。第二层客户来自券商分发。Robinhood 把 Kalshi 支撑的事件合约嵌入既有券商流程，Webull 也宣布了类似合作，这意味着部分用户主要把 Kalshi
              体验为基础设施，而不是独立目的地。第三层是机构或企业用户。Kalshi 现在维护企业账户接入流程和运行中的做市商计划，说明流动性提供者和专业交易实体也在客户集合里，不只是终端消费者交易者。
