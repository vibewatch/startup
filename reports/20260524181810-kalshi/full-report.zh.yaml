  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >-
              受 CFTC 监管的美国事件合约市场，在结构上不同于美国其他任何下注或交易产品。Kalshi 根据《Commodity Exchange Act》作为指定合约市场（DCM）运营，发行价格在 $0.01–$0.99
              之间的二元合约，并根据现实世界结果结算为 $0 或 $1。买卖双方以市场出清价格彼此交易；Kalshi 收费但不与用户对赌——这就是它与体育博彩平台的根本差异。

              2018 年 PASPA
              废除后，美国受监管体育博彩由州博彩委员会管理，采用固定赔率定价，体育博彩平台设定赔率并与投注者持有相反头寸。尽管两者服务的买方意图有重叠——预测体育结果——但两个市场运行在不同监管框架、不同收费模式和不同经济结构下。AGA
              2025 年 $78.72B 商业博彩总收入（GGR）数字不包括事件合约成交量，因为按州法，事件合约并不是商业博彩产品。

              Polymarket 是按估计成交量计算最大的预测市场，它没有美国监管实体，使用 USDC 加密抵押品，并采用自动化做市商模型。ForecastEx 于 2024 年 6 月注册为 CFTC DCM，是唯一与
              Kalshi 具备同等监管地位的直接结构性竞争者。iGaming 产品（在线老虎机和桌面游戏）在州博彩牌照下运营，完全独立于 CFTC 管辖。CME 等传统金融衍生品交易所与 Kalshi 共享 DCM
              监管框架，但买方画像、合约结构和规模不同——2026 年 4 月，仅 CME 利率产品的日均成交额就超过 $14T。
