  - id: FO002
    title: 公司快照逻辑
    type: flow
    layout: standard
    summary: Kalshi 的业务系统把联邦监管身份、产品、分发和资本连在一起；州法律风险则成为横贯全业务的结构性约束。
    data:
      nodes:
        - id: dcm
          label: CFTC DCM 资质
          detail: 联邦指定合约市场资质是核心监管护城河；美国没有竞争对手在事件合约上持有同等身份。该资质打开零售用户接入和机构参与。
          tone: positive
        - id: product
          label: 事件合约
          detail: 真实世界结果的二元掉期，覆盖政治、经济、体育、天气、娱乐等 3,500+ 个市场。按交易收费的营收模型。
          tone: positive
        - id: distribution
          label: 平台与券商入口
          detail: 自有平台叠加 Robinhood 和 Webull 集成（贡献日交易量 25-35%）；支持 USDC 和 crypto 入金；触达 140+ 个国家。
          tone: positive
        - id: capital
          label: 风险资本背书（$2.6B+）
          detail: Paradigm、Sequoia、a16z、Coatue、CapitalG 等；报道估值 $22B（2026 年 3 月）；为技术、监管合规和国际扩张供血。
          tone: positive
        - id: legal_risk
          label: 州法律与立法风险
          detail: >-
            8+ 个州有进行中的诉讼或执法；2026 年 1 月以来提出 10+ 项国会法案；Arizona 刑事起诉（2026 年 5 月获禁令暂缓）； Maryland 法院驳回 Kalshi
            的禁令申请。进入最高法院审查的可能性上升。
          tone: warning
      edges:
