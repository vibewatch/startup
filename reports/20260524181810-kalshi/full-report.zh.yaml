      - number: '2.3'
        title: 买方与用户分层
        blocks:
          - type: paragraph
            body: >-
              Kalshi 的买方分为两大类：零售消费者，以及机构或专业交易者。零售买方中，体育迷是主导群体——2025 年约 89%
              费用收入来自体育事件合约，说明用户基础主要由运用体育知识驱动，而非金融套保。体育买方的采用触发点是重大直播赛事：Super Bowl、March Madness 和 NFL 赛季贡献最高成交量。Kalshi
              披露，到 2025 年底注册用户超过 5 million。

              政治和选举买方构成第二个清晰分层：政治参与度高、希望表达对选举结果观点或对冲政策敞口的消费者。经济指标交易者规模更小但潜在价值更高，包括使用 Kalshi
              围绕美联储决议和经济数据发布做宏观套保或方向性押注的零售投资者与专业交易者。天气和气候合约吸引的是更窄的买方基础。

              分发渠道决定访问模式。Kalshi 直接用户构成注册者大多数，而 Robinhood 的 FCM 接入贡献约 25–35% 日成交量，说明大量活跃交易者来自券商入口。Coinbase 和 Fanatics
              Markets 提供额外分发向量，并对应不同用户画像：Coinbase 带来加密原生用户，Fanatics 带来体育品牌忠诚用户。截至 2026 年 5 月，Kalshi 唯一的 CFTC DCM 竞争者
              ForecastEx 尚未披露用户数或成交量数据。
