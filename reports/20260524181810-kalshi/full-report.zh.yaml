            body: >-
              机构和专业参与已不再停留在纸面上。Kalshi 有运行中的做市商计划、企业接入界面、面向 3,000 多家机构客户的 Tradeweb 合作，以及 Clear Street 合作；后者把首个机构 FCM
              成员带入交易所和清算所。这些证据支撑了真实的流动性提供者和专业用户群，尽管公开资料没有披露具名对冲基金客户或机构收入占比。留存和切换成本方面，证据有提示性但不足以定论。直接 Kalshi
              用户面临真实开户摩擦：他们必须通过 KYC、为独立账户入金，并学习 Kalshi 自己的下单和费率模型。Robinhood
              让用户用既有现金余额和券商凭证交易同一底层合约，消除了许多摩擦，但也只提供更经筛选的一部分市场。这意味着直接 Kalshi
              可能留住更进阶、参与更深的用户，而券商渠道可能最大化获客和便利性。仍缺失的是队列数据：它需要证明任一路径是否真的能随时间留住并扩张用户。
