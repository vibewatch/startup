      - number: '5.3'
        title: 开发者 API 与集成接口
        blocks:
          - type: paragraph
            body: >-
              在 CFTC 监管交易所中，Kalshi 搭出了最易接入的开发者界面之一。docs.kalshi.com 官方 API 文档门户提供完整 OpenAPI 3.0 规范和 WebSocket API 的
              AsyncAPI 规范，两者都可下载用于代码生成。门户包含入门指南、API key 管理演示、demo 环境参考、WebSocket 流式教程、术语表和变更日志——这套专业开发者文档栈可与金融科技 API
              头部公司相比。认证使用 API key 加 RSA 或 ECDSA 私钥签名，请求通过三个请求头签名：kalshiAccessKey、kalshiAccessSignature 和
              kalshiAccessTimestamp。

              速率限制采用按 API 层级划分的 token-bucket 系统；默认每次请求消耗 10 个 token，API 文档通过专用端点（GET /account/limits）暴露各层级限制。更高交易量的机构层级
              可用，该端点会返回包含 usage_tier、read 和 write 限制的结构化响应。API 规范 v3.19.0 覆盖 14
              个功能组：account、api-keys、orders、order-groups、portfolio、communications（RFQ）、multivariate、exchange、live-data、markets、milestone、search、incentive-programs、FCM（futures
              commission merchant 成员端点）、events 和 structured-targets。

              SDK 方面，Kalshi 在 PyPI 发布 kalshi-python（v2.1.4），由 OpenAPI Generator v7.15.0 基于 OpenAPI 规范生成，支持 Python 3.9
              及以上版本。该包包含 KalshiClient，封装对生产端点（https://api.elections.kalshi.com/trade-api/v2）的认证调用。GitHub 上 Kalshi 组织下的
              kalshi-starter-code-python 仓库（本轮研究时 94 stars、69 forks）提供认证 API 访问的最小示例代码；tools-and-analysis（19 stars、10
              forks）托管社区贡献分析，使用 Kalshi 市场数据研究 S&P/CPI 相关性并衡量共识。Kalshi 还 fork 并维护 QuickFIX/Go（原仓库 353 forks），这是领先的开源 Go
              FIX Protocol 库，支持 FIX 4.0 到 FIX 5.0 SP2——明确信号是，Kalshi 正在为高频交易者和算法交易团队建设机构级 FIX 连接能力。

              券商集成方面，Kalshi 的 Series E 公告明确把“add brokerages”列为资本用途优先事项。Robinhood 集成（early 2025 上线）和 Webull
              合作构成公开参考实现。Kalshi 也提供区块链入金通道：最高 $500,000 的 Solana 存款、Bitcoin、USDC 和 Worldcoin。面向第三方应用开发者的开发者资助计划覆盖 Solana
              和 Base（Coinbase 的 L2）。尽管 API 界面强健，移动应用商店存在性仍未能从公开上架信息确认；除 Python 外，Kalshi 没有发布其他语言官方 SDK，Go 和 JavaScript
              开发者只能依赖社区封装或直接用 OpenAPI 生成代码。
