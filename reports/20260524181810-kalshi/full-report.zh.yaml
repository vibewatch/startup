      - - 审计财务
        - FY2025 和 2026 年 Q1 经审计损益表、资产负债表和现金流量表
        - 没有审计就无法验证年化营收和 EBITDA 利润率；优先权堆叠未知
        - 直接向公司索要；审阅 DCM 的 CFTC 财务申报要求
      - - 优先权负担
        - Series A–F 清算优先权、参与权和分配瀑布
        - 已按递增估值募资 $2.8B+；在 $22B 估值下，普通股权益价值可能很低
        - 向法律顾问或公司索要股权结构表；若提交 S-1，审阅其中披露
      - - Robinhood 经济条款
        - 分发协议中的收入分成比例、独家期和终止触发条件
        - 日交易量 25-35% 来自 Robinhood；失去该渠道就是悲观情景触发因素
        - 在 NDA 下索要条款清单或重大合同条款
      - - EBITDA 和人头成本
        - 月度运营开支、人头成本，以及员工数从 70 增至 494 的 EBITDA 桥接
        - 2025-2026 年快速招聘可能已消耗所募 $2.8B 中的 $300-500M；现金续航不清楚
        - 索要董事会批准的经营计划和 2026 年 Q1 管理账
      - - 体育收入地域分布
        - 按州和合约类型（体育 vs. 宏观 / 政治 / 天气）拆分的营收
        - 前 10 大州的诉讼结果决定悲观 vs. 基准情景；集中度不清楚
        - 通过数据室索要；与州监管文件交叉核对
      - - 国际营收
        - 140+ 个国家上线（2025 年 10 月）带来的营收和交易量贡献
        - 国际业务可分散美国州风险；规模未知
        - 按地区索要；检查非美国市场合规架构
    notes: 尽调追问反映截至 2026-05-24 尚未公开的信息；按其对 $22B 估值判断的重要性排序。目前均无法由公开来源确认。
    claimRefs:
      - CV040
      - CV041
      - CV042
      - CV043
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Kalshi 的历史从 2018 年受监管市场构想开始，穿过长期 CFTC 斗争，在 2025 年进入爆发式融资周期，并在 2026 年迎来法律与立法压力汇合。
    data:
      items:
        - date: '2018'
          label: 创立
          detail: Mansour 与 Lopes Lara 在 MIT 创办 Kalshi；一开始就为真实世界结果的事件合约而建。
          tone: positive
        - date: '2019'
          label: Y Combinator 批次
          detail: 加入 YC 2019 冬季批次；完成种子轮；开始与 CFTC 沟通。
          tone: positive
        - date: 2020-11
          label: CFTC DCM 资质
          detail: 成为美国首个获得指定合约市场身份的事件合约交易所。
          tone: positive
        - date: 2021-07
          label: 平台上线
          detail: 公开交易启动；首批市场覆盖经济、天气和金融。
          tone: positive
        - date: 2022-08
          label: CFTC 阻止选举合约
          detail: 监管机构暂停政治事件合约；启动公共利益审查。
          tone: warning
        - date: 2023-11
          label: Kalshi 起诉 CFTC
          detail: CFTC 于 2023 年 9 月否决选举合约后提起诉讼；董事会此前曾建议不要起诉。
          tone: warning
        - date: 2024-09
          label: 选举市场诉讼胜利
          detail: D.C. 地区法院对 Kalshi 作出简易判决；选举合约于 2024 年 10 月上线。
          tone: positive
        - date: 2025-06
          label: Series C 轮 — $185M，估值 $2B
          detail: Paradigm 领投；Sequoia、Multicoin、Peng Zhao 跟投。交易量同比增长 100 倍。
          tone: positive
        - date: 2025-10
          label: Series D 轮 — $300M，估值 $5B；140+ 个国家
          detail: Sequoia 与 a16z 共同领投；全球上线；Robinhood 集成贡献日交易量 25-35%。
          tone: positive
        - date: 2025-12
          label: Series E 轮 — $1B，估值 $11B
          detail: Paradigm 领投；每周 $1B 交易量获确认；瞄准下一批 100M 用户。
          tone: positive
        - date: 2026-03
          label: Arizona 刑事起诉
          detail: 首批针对 CFTC 注册预测市场运营方的刑事指控；共 20 项。
          tone: negative
        - date: 2026-03
          label: 最新一轮 — ~$1B，估值 $22B
          detail: Coatue 领投；总融资超过 $2.5B；估值三个月翻倍。
          tone: positive
        - date: 2026-04
          label: 第三巡回法院维持 CFTC 管辖权
          detail: 首个支持 Kalshi 的联邦上诉裁决；CFTC 就联邦优先权起诉 AZ、CT、IL。
          tone: positive
        - date: 2026-05
          label: Arizona 禁令获准
          detail: 联邦法官阻止刑事执法；认为合约可能构成联邦掉期。
          tone: positive
    approximationNotes: Series D 和 2026 年 3 月轮次的交割日期基于公开报道，可能与实际法律交割日期相差数天到数周。
