            title: 多方交叉验证下的规模化收入
            body: >-
              Kalshi 2025 年 $263.5 million 费用收入得到 Time 100、Bloomberg 等多个独立来源确认，并由 $50+ billion 交易量和约 ~0.53%
              的稳定隐含抽成率交叉印证。对一家未上市公司来说，这种独立确认程度并不常见，分析置信度较高。
