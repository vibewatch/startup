      - number: '4.2'
        title: 交易量与运营规模
        blocks:
          - type: paragraph
            body: >-
              BraveNewCoin 在 Series D 融资公告时报道，Kalshi 的名义交易量到 October 2025 估计已达到年化 $50 billion。到 December 2025，Reuters 和
              Crunchbase 均佐证其周交易量经常超过 $1 billion；到 early 2026，大型事件期间周交易量已升至 $2 billion 以上。February 9, 2026 的 Super Bowl
              LX 带来约 $1 billion 单日交易量，证明平台能承接集中事件日的流量。


              Time 的 100 Most Influential Companies 专题显示，到 May 2026，用户基数已扩至至少 5 million 个注册账户。Tracxn 数据显示，员工数从 October
              2025 的约 70 人快速增至 April 2026 的 494 人，说明公司在交易基础设施、合规和市场运营上加速投入。按 2025 费用收入和 May 2026 用户数测算，每注册用户收入估计为
              $52.70——由于用户数晚于收入期，这一数字可能偏低。


              Massachusetts 州总检察长的执法调查给出了独立交易量验证：仅 2025 上半年，Kalshi 上 3.4 million 笔个人下注就带来超过 $1 billion
              的体育下注额。该监管记录相当于对交易量水平的部分第三方审计，而 Kalshi 的私营财务披露并未提供类似信息。管理层给出的 $1.5 billion 年化运行率指引若能全年维持，意味着较 2025 实际水平加速
              469%。
