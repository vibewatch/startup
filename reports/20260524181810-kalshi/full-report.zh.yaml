  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 最新融资基准：Series F 轮估值 $22 Billion
        blocks:
          - type: paragraph
            body: >-
              June 2025 至 March 2026，Kalshi 完成六轮机构融资，把通常需要多年走完的估值重估压缩到不到十个月。June 2025，Paradigm 领投 $185 million Series
              C，投后估值 $2 billion，公司由此进入独角兽梯队。四个月后，August 2025，Sequoia Capital 和 Andreessen Horowitz 共同领投 $300 million
              Series D，估值 $5 billion——短短四个月上调 150%。December 2025，Paradigm 回归领投 $1 billion Series E，估值 $11 billion。随后在
              March 2026，Coatue Management 又领投第二笔 $1 billion 融资——由 Wall Street Journal 报道，并得到 CNBC、Fintech Global 和
              Yahoo Finance 佐证——投后估值 $22 billion，约九十天内较上一轮标记翻倍以上。自成立以来，Kalshi 在至少六轮机构融资中累计股权融资约 $2.8 billion，另有早期和 Y
              Combinator 种子资本。

              估值重估速度来自多重因素叠加：September 2024 D.C. Circuit 法院胜诉（选举合约）、May 2025 CFTC 撤回上诉、March 2025 启动 Robinhood
              分发合作、December 2025 Paradigm 领投的 $11 billion Series E，以及随后披露的 2025 年 $263.5 million
              费用收入。可比竞争者估值也托住这条轨迹：October 2025，Polymarket 从 Intercontinental Exchange 获得最高 $2 billion 战略投资，投前估值 $8
              billion；据报道，到 January 2026，二级市场交易把 Polymarket 隐含估值推至 $11.6 billion。Yahoo Finance 引述来源称 Series F
              “接近完成”，意味着条款尚未正式确认；投资者应把 $22 billion 视为报道口径，而非公司审计口径。
