      - number: '1.4'
        title: 规模指标、里程碑与不利事件
        blocks:
          - type: paragraph
            body: >
              Kalshi 的运营指标体现出一个直接绑定 2024 年选举合约法律胜利的拐点。到 2025 年 12 月，周交易量突破 $1 billion，同比增长超过 1,000%；2025 年年化成交量预计为 $50
              billion，累计事件合约成交量到 2026 年 3 月超过 $52 billion。公司报告 2025 全年费用收入 $263.5 million；据报道，到 2026 年初收入运行率接近 $1.5
              billion。2025 年收入约 89% 来自体育合约。到 2026 年初，注册用户超过 5 million。2026 年 3–5 月员工数约为 467–500。2025 年 3
              月平台接入后，Robinhood 用户估计贡献 Kalshi 日交易量的 25–35%。TIME 将 Kalshi 列入 2026 年“100 家最具影响力公司”榜单。

              Kalshi 的里程碑时间线同样由法律逆风和产品上线共同定义。2026 年 3 月，Arizona 对 Kalshi 提出 20 项刑事控告——这是任何 CFTC
              注册预测市场运营商遭遇的首起刑事起诉——指控其经营非法赌博业务。2026 年 5 月，一名联邦法官发布初步禁令，认定 Kalshi 合约很可能符合联邦法下的互换定义，从而阻止了该起诉。2026 年 4 月 6
              日，Third Circuit Court of Appeals 维持 CFTC 对体育相关事件合约的排他性管辖权，这是该问题上的首个联邦上诉判决。2026 年 4 月 2 日，CFTC 起诉
              Arizona、Connecticut 和 Illinois，以支持联邦优先管辖。截至 2026 年 5 月，Kalshi 在至少八个州面对进行中的诉讼或执法行动。另自 2026 年 1
              月以来，十多项针对预测市场的国会法案已被提出。Kalshi 合规团队还因交易员利用自身选举候选身份进行内幕交易而采取纪律处分；2026 年 2 月，CFTC 发布史上首份预测市场内幕交易执法提示，并点名
              Kalshi 纪律案例。
