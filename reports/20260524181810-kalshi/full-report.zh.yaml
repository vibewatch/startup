      - number: '3.5'
        title: 未解决的竞争尽调缺口
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 5 月，几个竞争问题仍然悬而未决，并会实质影响对 Kalshi 长期竞争地位的评估。第一，ForecastEx 的实际成交量、用户数和分发合作完全未披露。没有这些数据，就无法判断
              ForecastEx 是一个初生但可能致命的费率竞争威胁，还是一个实质休眠的 DCM。例如，如果 ForecastEx 与 Robinhood 合作，将立刻复制 Kalshi 最重要的分发优势。

              第二，Polymarket 在美国获得监管宽容的持久性并不清楚。当前宽松姿态取决于 Trump 政府的 CFTC 不重新施加同意令限制。未来一届 CFTC 可能重新限制美国访问，让 Polymarket 回到
              2022–2025 年的非美国状态。另一条路径是，Polymarket 在 ICE 机构地位和资本支持下寻求 DCM 牌照。Polymarket 的监管路径结果，将决定它在美国受监管市场中是长期还是短暂竞争威胁。

              第三，PredictIt 的交易所上线（计划于 2025 年 10 月）尚未带来披露的成交量或用户指标。Aristotle International 是否成功从受限的不采取行动函模式扩展到完整交易所，仍未知。

              第四，体育博彩运营商的战略响应无法量化。AGA 的游说努力已有记录，但没有大型体育博彩运营商公开申请 CFTC DCM 牌照，或以会直接竞争 Kalshi
              体育合约业务的方式与事件合约平台合作。运营商入场的概率和时间仍是开放尽调项。

              第五，ForecastEx 的 Incentive Coupon 模型对 Kalshi 定价权的成本和定价影响，还没有在规模化场景下经过检验。如果 ForecastEx 吸引到有意义的流动性，Kalshi
              可能面临降低有效费用的压力，从而压缩 $263.5M 收入基底。
            claimRefs:
              - CP040
              - CP041
              - CP042
              - CP043
