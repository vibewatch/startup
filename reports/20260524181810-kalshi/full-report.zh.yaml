      - number: '2.5'
        title: 证据缺口与规模测算矛盾
        blocks:
          - type: paragraph
            body: >-
              三个结构性矛盾削弱了简单的市场规模测算。第一，AGA 2026 年 1 月联合信将包括 Kalshi 在内的预测市场平台描述为“未受监管”，尽管 Kalshi 拥有有效 CFTC DCM 身份。这反映的是 AGA
              限制该品类的竞争和政治利益，而不是法律认定，但也说明联邦监管者与既有博彩行业之间，对市场定义存在争议。

              第二，没有独立分析师专门为美国 CFTC 监管事件合约测算
              TAM。公开可得的全球预测市场估计来自分析研究公司，采用更宽泛、不可比的市场定义，将受监管与未受监管平台混合统计，并且要么设有付费墙，要么没有披露方法论。任何把这类估计当作 Kalshi TAM
              的投资者模型，都是误用数据。

              第三，Kalshi 2025 年收入 $263.5M，却对应 $22B 估值，隐含 84x 收入倍数。CME Group 的交易倍数约为 20–25 倍利润。Kalshi
              溢价隐含的不只是增长，而是品类创造级规模——而这个市场尚未达到所需规模。增长轨迹是真实的（截至 2026 年 3 月，累计成交量九个月内大致翻倍），但终点没有验证。ForecastEx
              市场份额、国际收入，以及潜在体育合约限制的影响均未披露，仅靠公开信息无法完整界定市场结构。
