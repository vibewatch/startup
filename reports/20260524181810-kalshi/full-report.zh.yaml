  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 热力图按发生可能性（列）和影响程度（行）映射 Kalshi 的主要风险；每个单元格列出该格的主导风险。
    data:
      columns:
        - 低可能性
        - 中等可能性
        - 高可能性
      rows:
        - label: 高影响
          values:
            - CFTC 撤销 DCM/DCO 资格
            - SCOTUS 裁定 CFTC 不具优先效力；重大集体诉讼败诉；Arizona 刑事风险升级
            - 更多核心州对体育合约颁发禁令；部落协议裁决；Robinhood 渠道中断
        - label: 中等影响
          values:
            - 交易所发生网络安全事件
            - 联邦立法限制事件合约；CFTC 依据 Rule 180.1 对大型交易者执法
            - 提现延迟 / 结算争议持续拖累声誉；国会两党施压
        - label: 低影响
          values:
            - 小型产品功能争议
            - 游说小挫；未进入禁令阶段的州级小型调查
            - 围绕体育收入集中度的负面媒体报道持续发酵
    approximationNotes: 单元格位置基于本章法律、监管、运营和客户证据的定性综合；不是定量概率模型。
