companyProfile:
  summary: >-
    Kalshi（KalshiEX LLC）总部位于纽约，是一家 CFTC 指定合约市场，也是美国唯一为零售二元事件合约专门搭建并获得联邦许可的交易所。公司由 MIT 同学 Tarek Mansour（CEO）和 Luana Lopes
    Lara（COO）于 2018 年创立，拿到 DCM 资格前花了两年多做监管准备，2020 年 11 月获批，2021 年 7 月公开上线。交易所让用户交易二元 yes/no 合约——价格在 $0.01–$0.99 之间，结算为
    $1.00 或 $0.00——标的覆盖体育、宏观经济指标（CPI、美联储决议）、政治、天气和娱乐等结果。2024 年 9 月，Kalshi 在选举合约案中赢得 D.C. Circuit 里程碑式胜诉；2025 年 5 月，CFTC
    撤回上诉，增长阀门随之打开：2025 年费用收入达到 $263.5 million，据报道到 2026 年 3 月年化收入运行率已达 $1.5 billion。截至 2026 年 5 月，Kalshi 在至少六轮机构融资中累计融资约
    $2.8 billion，报道估值为 $22 billion，注册用户超过 5 million，并通过 Robinhood（占日成交量 25–35%）、Webull 和机构平台分发。平台同时承受多线法律压力：2025 年约 89%
    收入来自体育事件合约，而这一品类已在至少七个州遭挑战；Kalshi 还面对 Arizona 刑事控告、联邦集体诉讼（Brown v. Kalshi）、部落诉讼，以及十多项瞄准该品类的国会法案。
