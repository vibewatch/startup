      - number: '4.4'
        title: 成本结构、烧钱速度与财务披露缺口
        blocks:
          - type: paragraph
            body: >-
              Kalshi 是一家私有、由 CFTC
              指定的合约市场（DCM），无需公开提交经审计财务报表。任何公开来源都没有提供损益表、资产负债表或现金流量表。尚未披露的关键财务指标包括毛利率、运营费用拆分、EBITDA、净利润或亏损，以及烧钱速度。交易所可比业务（期货交易所、有公开可比对象的预测市场）通常能跑出
              60–80% 毛利率，但没有 Kalshi 特定证据能验证这一范围。


              可观察的成本代理指标包括员工数增长（六个月内从 70 人增至 494 人）、位于 New York City 416 West 13th Street 的总部，以及持续发生的监管合规支出。若按每名员工估计
              $200,000 计算，494 人大致对应约 $99 million 年度人工成本；实际全口径成本（福利、股权、基础设施）还会更高。Kalshi 在 early 2026 自查发现 Rule 5.17(z)
              违规并承担 CFTC 执法罚款；金额未公开。CFTC 在 April 2026 对 Van Dyke 提起的内幕交易投诉，是首个涉及事件合约的此类案件，确认受监管事件合约市场需要持续监控基础设施，也抬高了
              Kalshi 的合规成本底座。


              American Gaming Association（AGA）已公开把预测市场平台称作对受监管体育博彩收入的竞争威胁，并推动游说；这些努力可能落成额外州级牌照或运营要求。Massachusetts
              州总检察长执法程序和 Arizona 刑事案件（2025 年被一名联邦法官阻止）共同说明，法律抗辩成本会反复出现。体育交易量若因监管收缩 50%——该板块贡献 Kalshi 2025 收入的
              89%——无论采用哪种合理利润率假设，都会实质性压伤损益表。
