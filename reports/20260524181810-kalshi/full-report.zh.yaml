      - number: '4.3'
        title: 资本结构与融资历史
        blocks:
          - type: paragraph
            body: >-
              2020 至 2026 年间，Kalshi 完成六轮机构股权融资，累计披露金额约 $2.8 billion。最近一笔是 March 2026 由 Coatue Management 领投的 $1 billion
              Series F，投后估值 $22 billion；May 2026 Baillie Gifford 又追加 $200 million，使有效 Series F 总额扩大到 $1.2
              billion。此前机构轮次包括：Series C（$185 million，估值 $2 billion，June 2025）、Series D（$300 million，估值 $5
              billion，October 2025）和 Series E（$1 billion，估值 $11 billion，December 2025）。


              SEC Form D 文件是确认单轮融资金额的最权威来源。December 2025 的 Form D（accession 0001231919-25-000572，CIK 0001806928）确认
              Series E 募得 $999,996,557，基本就是 $1 billion。此前一份文件（accession 0001231919-25-000391，于 October 30, 2025 提交）记录
              $124,999,957，对应 Series D 轮的一笔正式分批。Series A 由 February 23, 2021 提交的 Form D 0001806928-21-000001 确认。Kalshi
              Inc.（CIK 0001806928）在 SEC EDGAR 的文件索引显示，2020 至 2025 年间共有五份 Form D，验证了多次股权融资事件。


              以 March 2026 的 $22 billion 估值对比 2025 年 $263.5 million 费用收入，Kalshi 的定价约为收入的
              84x——这是交易所基础设施溢价，反映投资者更看重平台的监管护城河和网络效应防御力，而不是短期盈利能力。Sequoia Capital 和 Paradigm 领投或共同领投了截至 Series E
              的每一轮机构融资；Coatue Management 领投了 Series E 和 F。
