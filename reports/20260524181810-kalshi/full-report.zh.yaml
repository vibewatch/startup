      - number: '7.4'
        title: 商业模式、合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Kalshi 的商业风险在两个维度集中，而法律风险会放大这种集中。第一，Sacra 估计 Kalshi 2025 年约 89%
              费用收入来自体育事件合约；这正是州监管机构、部落联盟和集体诉讼原告正在攻击的类别。第二，独立报道把 Robinhood 的预测市场中心描述为 Kalshi
              日合约交易量的非对称来源，分发风险因此集中在单一券商合作伙伴上。Webull 是有意义但规模较小的第二渠道；机构访问栈（Tradeweb、Clear Street）仍高度依赖少数交易对手。政治和政策侧，由
              American Gaming Association 牵头的赌场和部落博彩游说力量正在敦促国会约束预测市场；Kalshi 则成立 Americans for Fair Markets，并在 2026
              年实质性增加联邦游说支出以反击。监管集中（CFTC）、收入集中（体育）、分发集中（Robinhood）和诉讼集中（州级与集体诉讼）叠加，意味着一次不利冲击就能迅速沿商业模式传导。依赖关系图和合作伙伴风险登记表展示了主要交易对手，以及每一方如何贡献这项风险敞口。
