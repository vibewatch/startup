        title: 图表与证据
        blocks:
          - type: callout
            title: DCM + Robinhood 分发构成当前没有竞争者匹配的护城河
            body: >-
              Kalshi 是唯一已验证大规模券商分发的 CFTC DCM：截至 2026 年 5 月，Robinhood 贡献 25–35% 日成交量，这一点没有任何竞争 DCM 能匹配。ForecastEx
              拥有相同监管地位，但没有确认分发；PredictIt 只覆盖政治市场。监管先发地位与券商触达的组合，是支撑 Kalshi 相对 Polymarket 加密模式获得估值溢价的核心竞争优势。
