            title: 监管护城河真实且很深
            body: >-
              Kalshi 的 CFTC DCM 身份并不容易复制：搭建一家联邦许可衍生品交易所，在 2020 年获批前花了两年多与监管沟通，还必须赢下针对 CFTC 本身的里程碑诉讼。截至 2026 年 5
              月，没有美国竞争者在事件合约上持有同等地位；Third Circuit 2026 年 4 月的判决进一步强化了继续仅由联邦监管的法律基础。
