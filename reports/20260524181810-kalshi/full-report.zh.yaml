      - number: '5.4'
        title: 信任、合规与运营控制
        blocks:
          - type: paragraph
            body: >-
              Kalshi 的合规与信任架构建立在 CFTC Designated Contract Market 牌照上，因此需要接受 CFTC 市场监控、规则执行义务和报告要求，监管层级与 CME Group 相同。作为
              DCM，Kalshi 必须监管市场操纵和内幕交易；CFTC 执法主任 David Miller 在 April 2026 的声明中明确把 DCM 定义为“第一道防线”，进一步强化了这项责任。Kalshi
              Exchange Rule 5.17(z) 将内幕交易禁令写入规则，禁止任何属于“决策者”、或对事件结果有直接或间接影响力的交易者交易相关合约。

              April 2026，Kalshi 对参与自身选举市场交易的政治候选人发布三份纪律处分通知，说明即便是小额违规也会触发主动执法（罚款从 $540 到 $6,229 不等）。CFTC
              同时提交首个涉及事件合约的内幕交易投诉。Kalshi 在政策上明确禁止战争市场、暗杀市场和以死亡为条件的合约。early 2026，该政策受到考验：Kalshi 冻结了一个与 Iranian Supreme
              Leader Khamenei 死后状态相关的市场，扣留了押注其会“out”的交易者约 $77 million 奖金。这一结果引发明显用户批评，也暴露合约语言和结算方法的不透明风险。

              地理围栏被用作技术合规机制。January 2026 Massachusetts Superior Court 发布临时禁令后，Kalshi 实施州级地理围栏，阻止 Massachusetts
              居民访问体育相关市场。这项地理围栏能力（由 Wikipedia 对法院命令的引用确认）说明平台可以按地理位置细粒度限制市场访问，但每一次州级法律挑战都可能要求新增过滤规则，从而增加工程开销。

              数据完整性方面，Federal Reserve 在 February 2026 发布的工作论文发现，Kalshi 概率信号在 CPI 和利率预测上追平或优于 Wall Street
              工具，为其提供外部学术可信度。CNN 和 CNBC 在直播报道中采用 Kalshi 数据，进一步佐证市场对其数据质量的认知。不过，包括 Wikipedia 引述学者在内的批评者质疑 Kalshi
              是否能高效聚合信息；The Atlantic March 2026 的文章还明确认为，预测市场把新闻事件金融化，会鼓励内幕交易并侵蚀信任。

              运营上，Kalshi 的资金隔离模式与 CFTC 监管交易所一致：按照 DCM 规则，用户资金与运营资本分开持有。平台按 CFTC 规定设有 KYC/AML 流程，但具体实施细节未公开。公开 uptime
              SLA、历史事故披露和外部安全审计均缺失，这是机构交易对手的重大尽调缺口。
