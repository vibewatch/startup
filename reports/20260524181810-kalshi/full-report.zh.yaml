      - number: '3.3'
        title: 竞争者画像——优势、弱点与响应动态
        blocks:
          - type: paragraph
            body: >-
              按资本和品牌认知度，Polymarket 是 Kalshi 最具威胁的竞争者；按法律地位，它也是最脆弱的一个。$8–9 billion 估值和 ICE
              投资给了它资产负债表火力，也可能搭起通往机构基础设施的桥。Donald Trump Jr. 的顾问角色和 1789 Capital 的投资形成政治掩护，助推了让其重返美国的监管解冻。不过，Polymarket
              的加密原生模式要求用户持有并管理 USDC，给主流零售用户制造摩擦。其过往记录包括 CEO 遭 FBI 调查（2024 年 11 月，2025 年 7 月撤销指控）、多起内幕交易争议、市场操纵指控，以及按 NYT
              审查记录发布数百条虚假社交媒体帖子；这些都会制造声誉和合规风险，使受监管 FCM 合作伙伴难以接受。The Wall Street Journal 将其市场描述为“法律和伦理灰色地带”。如果 Polymarket
              申请 DCM 牌照，或借助 ICE 打通监管路径，竞争威胁会显著升级。近期更可能的 Polymarket 响应，不是复制 Kalshi 的受监管模式，而是在监管环境仍宽松时扩大市场成交量和品牌触达。

              PredictIt 是非对称威胁：它拥有监管凭证（交易所 + 清算所 CFTC 批准，2025 年 9 月），但缺少体育——这占 Kalshi 2025 年收入的 89%。PredictIt
              的非营利根源和政治市场聚焦，意味着其用户基础偏向关心政策的用户，而不是体育迷。取消 5,000 人上限和 $3,500
              持仓上限，让它有空间从此前受限状态扩张，但体育市场需要不同内容、合作伙伴和流动性动态，PredictIt 尚未显示有意进入。主要响应风险是 PredictIt
              扩展到体育，或与体育数据提供商合作，从互补者转为直接竞争者。

              ForecastEx 是最直接的结构性竞争者——相同监管框架、相同 DCM 指定资格——而其激进费率定位（最低费用、利息返还）是在有意挑战 Kalshi 的定价权。不过，截至 2026 年 5
              月，ForecastEx 没有披露成交量、用户数或分发合作。如果 ForecastEx 无法吸引 FCM 合作伙伴，低费率定位就没有意义。风险在于 ForecastEx
              吸引到机构支持者或分发伙伴，获得让费率优势具备竞争力所需的流动性注入。

              体育博彩运营商拥有最大的替代总池子，但结构重叠最低。DraftKings、FanDuel、BetMGM 和 Caesars 从美国用户聚合了超过 $13 billion 年 GGR，这些用户在行为上接近
              Kalshi 的体育合约买方。这些运营商在 38 个州依据固定赔率体育博彩模式持牌运营，与事件合约不同——运营商持有对手方头寸，买方不能在结算前退出头寸。AGA
              将预测市场描述为“未受监管体育博彩”，并游说州和联邦机关限制预测市场平台或对其征收州税，直接威胁 Kalshi
              的税务处理和竞争地位。体育博彩运营商最可能的回应是继续游说，而不是复制产品，但如果监管环境变化，一些运营商（尤其通过 FCM 结构）可能直接进入事件合约市场。
