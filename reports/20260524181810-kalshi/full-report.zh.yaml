            body: >-
              即便联邦压力回落，Kalshi 仍在多条战线应对州级和私人诉讼。Massachusetts 州总检察长在 January 2026 赢得临时禁令，阻止 Kalshi 向 Massachusetts
              居民提供体育事件合约。Maryland 联邦法院在 August 2025 拒绝禁止州监管机构对 Kalshi 执行博彩法；Nevada 联邦法院在 November 2025 命令 Kalshi
              停止在该州提供体育预测合约，Ninth Circuit 又在 February 2026 拒绝中止该禁令。Montana 第二次发布停止令 后，Kalshi 已反诉 Montana；Third Circuit 在
              April 2026 裁定，Kalshi 可在上诉期间继续在 New Jersey 提供体育合约。Ho-Chunk Nation 等部落实体已提起联邦诉讼，主张 Kalshi
              体育市场违反排他性协议；部落联盟也已向 Third Circuit 提交法庭之友意见书。Brown v. Kalshi 是 April 2026 提起的拟议联邦集体诉讼，指称 Kalshi
              打着事件合约旗号运营无牌体育博彩平台。Arizona 针对参与 $54 million Khamenei 争议市场交易者的刑事式执法，又增加了结算完整性维度。到 2026
              年中，至少七个州已发布停止令或提起执法行动；尽管 Kalshi 赢下更广泛的联邦选举合约之争，它在至少两项州导向联邦程序（Nevada 和 Maryland）中已在实体问题上败诉。诉讼登记表列出了
