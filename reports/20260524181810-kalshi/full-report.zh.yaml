      - number: '8.2'
        title: 可比公司集合与估值框架
        blocks:
          - type: paragraph
            body: >-
              Kalshi 的估值可以从三条线看：（1）私募融资可比样本，按各轮融资倍数和私有预测市场估值参照；（2）上市交易所和金融科技可比公司，提供市场可观察的收入倍数和市盈率基准；（3）收入 run rate
              框架，把入场价格同 Kalshi 披露的 $1.5 billion 年化手续费 run rate，以及抽佣率和交易量情景假设连起来。

              在私募融资视角下，Kalshi 的 $22 billion 估值，是管理层 2026 年 3 月引用的 $1.5 billion 年化 run rate 的 14.7x，也是披露的 2025 全年 $263.5
              million 手续费收入的 83.5x。后一项倍数作为历史比率很高，但用来判断前瞻性并不准确，因为 Series C 到 Series F 期间收入增长了 485%。Polymarket 2025 年 10
              月由 ICE 支持的 $9 billion 估值意味着，Kalshi 相对 Polymarket 的 2.4x 溢价，部分由 CFTC 监管身份、Robinhood 分发和美元计价结算解释；但
              Polymarket 当时没有公开披露收入。

              在上市交易所视角下，CME Group 是结构上最相近的受监管交易所，2024 年收入 $6.13 billion，截至 2025 年中市值约 $98.9 billion，隐含收入倍数约 16x。CME
              的交易所模型成熟、高度多元、EBITDA 利润率丰厚，并有机构清算支撑——这些属性 Kalshi 目前都还没有。Nasdaq Inc. 的交易倍数相近。Robinhood
              是最接近的类比：高增长零售交易平台，内嵌事件合约；其 2025 年收入 $4.47 billion，2025 年末市值约 $118 billion，隐含收入倍数约 26x。若把 Robinhood 式倍数套到
              Kalshi 的 $1.5 billion run rate，估值将达到 $39 billion，高于 Series F 的 $22 billion 定价。

              在博彩 / 体育博彩视角下，DraftKings (DKNG) 2026 年 3 月市值 $10.83 billion，对应过去 12 个月收入约 $5.41 billion，收入倍数 2x。Flutter
              Entertainment (FLUT) 市值约 $46.75 billion，对应 2025 年收入 $16.38 billion，倍数 2.9x。若 Kalshi 被重新归类为体育博彩运营商（州监管机构和
              Better Markets 的核心论点），适用倍数会大幅压缩：对 $1.5 billion run-rate 收入套用 2.5x，隐含估值 $3.75 billion，相比 Series F 价格折价约
              94%。这种倍数分叉就是估值矛盾的中心。

              战略选择权视角还为网络效应（5M+ 用户、Robinhood 接入）、作为监管护城河的 CFTC DCM 牌照，以及公司刚起步的 140+ 国家国际扩张加上溢价。CME 2025 年 12 月与 FanDuel
              (Flutter) 启动预测市场合资公司，一方面验证市场机会，另一方面也带来资本充足的竞争对手。
