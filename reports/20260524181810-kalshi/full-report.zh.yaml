      - number: '5.5'
        title: 产品缺口、事件与战略隐忧
        blocks:
          - type: paragraph
            body: >-
              完整评估 Kalshi 平台时，几个结构性产品和技术缺口很关键。第一，Kalshi 没有 NFL、NBA、MLB 的官方联盟数据授权（三者都在 2025 年向 CFTC 提交信函，表达对 Kalshi
              体育市场的担忧），因此不能在市场展示中使用官方球队名称、标志或经验证的实时比分。体育市场只能使用 “Pro Football Champion: Chicago” 等通用城市名，而不是 “Chicago
              Bears win Super Bowl”。DraftKings 和 FanDuel 拥有完整联盟数据协议，在这一维度上形成明显用户体验优势。

              第二，early 2026 的 Khamenei 结算争议暴露合约歧义。Kalshi 反对“death-contingent”合约的政策，并未被押注 Khamenei 是否会“out of
              office”的用户清楚识别；$77 million 冻结赔付造成声誉事件，也呼应了非标准化合约语言内生的结算风险。新型资产类别都会遇到这种结构性挑战：其合约语言没有大宗商品和股票衍生品那种数十年法律解释积累。

              第三，本轮研究无法从 Apple App Store 或 Google Play
              访问到经验证的移动应用上架页面，引发关于应用分发连续性或可能下架的疑问。若得到确认，这将是显著的用户获取和留存缺口，因为在竞争性体育投注 和金融科技市场中，移动端是零售参与者的主要交易界面。

              第四，平台对自身网站限流（研究期间 kalshi.com 返回 429 错误）暗示其 Vercel-based CDN/WAF 配置可能限制可发现性和基于抓取的集成——这是小产品问题，但如果 API
              文档或公开市场数据同样受限，就会影响开发者生态信任。

              第五，截至 May 2026，国会和州级法律风险显著升高。January 2026 以来已提出 10 多项法案，包括两党 PREDICT Act、End Prediction Market Corruption
              Act 和 Prediction Markets Are Gambling Act；任何一项若通过，都可能实质性限制或消除 Kalshi
              的体育市场产品线。至少六个州（Massachusetts、Arizona、Nevada、Ohio、Wisconsin、Michigan）已采取主动法律行动，U.S. Senate 也在 May 2026
              禁止参议员和员工使用预测市场。虽然 Kalshi 的 CFTC DCM 地位提供了联邦优先适用论点，但相互冲突的地区法院裁决（Ohio 在 March 2026 支持反对 Kalshi 的一方；Nevada 发出
              14-day 限制令）制造出拼图式运营环境，要求平台持续更新地理围栏并监控法律进展。
