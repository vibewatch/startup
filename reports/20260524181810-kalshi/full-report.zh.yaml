      - number: '5.2'
        title: 交易所架构与市场机制
        blocks:
          - type: paragraph
            body: >-
              Kalshi 以 November 2020 获批的 CFTC 指定合约市场牌照运营集中限价订单簿（CLOB）交易所。生产环境 REST API 托管在
              external-api.kalshi.com/trade-api/v2（也可通过 api.elections.kalshi.com/trade-api/v2 访问），开发者测试用 demo/sandbox
              环境位于 demo-api.kalshi.co/trade-api/v2。截至本报告，当前 API 版本为 v3.19.0。实时市场数据通过 WebSocket API 推送，并受公开 AsyncAPI
              规范约束，订阅者无需轮询即可接收实时订单簿更新、成交回报和市场状态变化。

              交易所收费模型采用 maker-taker 结构，taker 费用按二次函数计算。taker fee 以合约当前价格为自变量校准，因此中间价格（约 $0.40–
              $0.60）的单股费用最高，接近两端时费用更低。这种设计鼓励真正不确定的中间概率区间形成流动性。Maker fee 于 2025 年春季引入，并在夏季大幅重构，主要适用于体育市场。约 40%
              的全部份额会在市场关闭前两小时内交易，而体育市场通常能在预定事件后一小时内可靠结算，因此平台能从高频体育交易中获取大量费用收入。

              为支撑机构交易量和流动性供给，Kalshi 在 May 2025 推出 Market Maker Program。已知成员包括 Susquehanna Investment Group 和 Kalshi
              Trading LLC；后者是 Kalshi 的关联实体，本身也在平台交易，Financial Times 称这种关系“多少有些争议”。做市商费率表和交易约束写在保密 CFTC
              文件中，而非公开披露；大交易者也有资格获得部分返佣。这种不透明让外部无法独立验证实际费用收益率。

              订单簿机制支持限价单和市价单，time-in-force 选项包括 immediate-or-cancel（IOC）和 good-till-canceled（GTC）。API 还可用过期时间戳创建
              expiring order 变体（GTT，good-till-time），不过 API 文档说明它是内部执行类型，本质是带 expiration_ts 字段的 GTC。每名用户可同时持有最多 200,000
              个未完成订单。平台还为大宗交易提供 RFQ（request-for-quote）端点，并为复杂的相关结果合约支持多变量事件市场。结算是二元且自动的：市场结算时，Kalshi 直接向用户账户计入胜出合约每份
              $1.00、亏损合约每份 $0.00。

              峰值交易量已经证明平台基础设施规模：活跃事件期，Kalshi 每周处理约 $2 billion；February 2026 的 Super Bowl LX 单日处理 $1 billion。公开资料没有
              SLA、正常运行时间数据或事故历史，这是机构交易对手尽调中的一项缺口。
