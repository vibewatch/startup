  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Kalshi 处在三个竞争空间的交叉点：受监管的美国事件合约（直接同业）、加密 / 离岸预测市场（未受监管替代品），以及体育博彩产品（行为替代品）。必须理解每一类，因为 Kalshi
              面对的是结构性、多方向竞争压力——并不只是与单一对手争夺市场份额。

              在受监管美国事件合约领域，截至 2026 年 5 月，Kalshi 是三家 CFTC 指定实体之一。ForecastEx（2024 年 6 月获指定）是唯一另一家活跃的事件合约 DCM。PredictIt
              通过其运营方 Aristotle International，于 2025 年 9 月获得了受监管交易所批准。这三者构成正式的受监管市场结构。Kalshi 拥有最早指定资格（2020 年 11
              月）、覆盖体育、政治、经济、天气和娱乐的最深市场广度，以及唯一经验证的大规模 FCM 分发，合作方包括 Robinhood、Coinbase 和 Fanatics Markets。

              加密 / 离岸领域，Polymarket 按成交量是全球主导平台。Polymarket 由 Shayne Coplan 于 2020 年创立，使用 USDC 抵押品并运行在 Polygon 区块链上。2022 年
              CFTC 同意令禁止美国用户后，Polymarket 从 2022 年到 2025 年 12 月 2 日被挡在美国市场之外；随后 Trump
              政府的监管姿态让美国用户重新获得访问权限。Intercontinental Exchange（ICE）于 2025 年 10 月向 Polymarket 投资最多 $2 billion，对其估值 $8–9
              billion。尽管规模和资本强劲，Polymarket 从未取得 CFTC DCM 牌照，并持续面对内幕交易、市场操纵和内容准确性的质疑。

              Iowa Electronic Markets（IEM）由 University of Iowa Tippie College of Business 自 1988 年运营，是一个学术性非营利前身，依据 CFTC
              不采取行动函运营，每位交易者投资上限为 $5–$500。IEM 不是商业竞争者，但证明了预测市场作为预测工具的学术可信度。

              美国体育博彩运营商——DraftKings、FanDuel、BetMGM 和 Caesars——是行为替代品，而不是结构性竞争者。2018 年 PASPA 废除后，这些平台依据州博彩牌照在 38 个州和
              Washington DC 受监管，采用固定赔率模型，体育博彩平台持有投注者的对手方头寸。它们 2024 年合计 GGR 为 $13.78 billion，构成最大的相邻用户支出池。代表这些运营商的 AGA
              公开把预测市场描述为“未受监管”，并游说反对其扩张，明确框定了竞争威胁。
