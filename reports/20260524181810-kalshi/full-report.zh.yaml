            - label: 落后——Robinhood/体育博彩平台有 4-5★ 已验证应用
            - label: 低——App Store / Play Store 搜索未找到确认列表
            - label: 高——零售以移动端为主；未验证存在构成缺口
        - label: 体育联盟数据授权
          values:
            - label: 0——无官方 NFL/NBA/MLB 协议
            - label: 落后——DraftKings/FanDuel 拥有完整联盟数据协议
            - label: 高——FT 分析、Wikipedia，且无联盟公告
            - label: 高——相较持牌体育博彩平台存在品牌/UX 劣势
        - label: 区块链存款通道
          values:
            - label: 3——Solana、Bitcoin、USDC、Worldcoin 已上线
            - label: 领先传统交易所；与加密原生平台持平
            - label: 中——Bravenewcoin 已确认；托管细节未披露
            - label: 中——托管风险和监管处理不明确
    approximationNotes: 成熟度评分是研究作者基于公开证据作出的定性评估；0 表示确认缺失，5 表示有同类最佳的文档证据。
