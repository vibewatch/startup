  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Kalshi 的客户旅程始于被头条驱动的发现，随后经历 KYC 和入金摩擦，再分化为自有直连、券商和机构三条路径。
    data:
      items:
        - label: 发现
          phase: 发现
          detail: 用户通过应用商店、券商入口，或围绕体育、选举和宏观合约的报道接触 Kalshi。
        - label: 资格与 KYC
          phase: 入驻
          detail: 直连用户必须通过身份验证和州资格要求，才能入金交易。
        - label: 入金路径
          phase: 激活
          detail: Kalshi 直连用户要为单独账户入金，Robinhood 用户则可使用既有现金余额。
        - label: 品类选择
          phase: 参与
          detail: 公开用户注意力主要集中在体育，以及头条经济和政治市场。
        - label: 重复交易或问题升级
          phase: 留存
          detail: 用户要么在大型事件中反复交易，要么迁移到券商渠道，要么升级处理客服和结算问题。
        - label: 机构 / 流动性层
          phase: 扩张
          detail: 高阶用户和机构通过做市、企业入驻、Tradeweb 工作流或 Clear Street 清算参与。
    approximationNotes: 这些阶段根据官方入驻页面、合作伙伴分销文档、应用商店证据和独立评测推断，因为 Kalshi 不发布正式转化地图。
    claimRefs:
      - CU001
      - CU004
      - CU009
      - CU010
      - CU013
      - CU027
      - CU028
      - CU036
      - CU037
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 这是一个定性相对指数漏斗，展示广泛消费者触达如何收窄为公开可证明的少量持久客户结果。
    data:
      items:
        - label: 公开触达与认知
          value: 100
          detail: Kalshi 拥有超过 500 万用户、较大的应用商店足迹，以及拓宽发现入口的券商合作。
        - label: 符合资格 / 已入驻用户
          value: 72
          detail: KYC、州限制和入金步骤会在交易开始前收窄可触达受众。
        - label: 活跃高流动性交易者
          value: 49
          detail: 公开证据显示，大多数重复活动集中在流动性最深的大型体育和宏观市场。
        - label: 券商渠道重复用户
          value: 28
          detail: Robinhood 交易量轶事显示重复交易强劲，但公开留存指标缺失。
        - label: 公开证据支持的长期拥护者
          value: 9
          detail: 应用反馈很多，但公开队列、续约或可作客户背书的企业留存证据很少。
    approximationNotes: 数值以漏斗顶部 100 为指数，不代表已披露客户数。它们可视化的是证据强度，而非经审计转化率。
    claimRefs:
      - CU017
      - CU018
      - CU019
      - CU027
      - CU030
      - CU031
      - CU039
      - CU041
  - id: FU003
    title: 客户验证矩阵
    type: matrix
    layout: wide
    summary: 客户验证在直连零售应用参与和券商分销上最强，在已披露留存和直接企业客户标识上最弱。
    data:
      columns:
        - 获客证明
        - 便利性
        - 流动性可见度
        - 投诉压力
        - 留存可见度
      rows:
        - label: Kalshi 直连应用用户
          values:
            - 高——121K 条 iOS 评分和 23.9K 条 Android 评论
            - 中——需要单独入金和 KYC
            - 中——主要市场强，小众市场较弱
            - 高——客服和结算投诉较多
            - 低——无公开队列或流失数据
        - label: Robinhood 分发用户
          values:
            - 高——集成在大型券商应用中
            - 高——可用既有现金余额，无需单独 Kalshi 账户
            - 中——精选子集，但有大交易量轶事
            - 中——投诉可见度低于 Kalshi 直连应用
            - 低——无公开渠道留存或经济性数据
        - label: Webull 分发用户
          values:
            - 中——通过大型券商宣布合作
            - 高——若已上线，券商分发带来便利
            - 低——尚未披露公开交易量证据
            - 未知——抓取样本中直接用户反馈很少
            - 低——无公开队列数据
        - label: 机构 / 流动性提供方
          values:
            - 中——入驻流程，加上具名的 Tradeweb 和 Clear Street 合作
            - 低 — 尽调与运营搭建要求高于零售
            - 高 — 专门聚焦清算、做市和大宗交易
            - 低 — 未见公开投诉痕迹
            - 低 — 未披露公开客户数或留存
    approximationNotes: 矩阵单元格概括抓取来源集体现的证据质量，不是公司发布的评分卡。“未知”表示公开章节证据未给出可靠答案。
