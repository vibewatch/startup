      - number: '3.4'
        title: Kalshi 的差异化、结构性优势与劣势
        blocks:
          - type: paragraph
            body: >-
              Kalshi 的核心差异化，是监管先发地位与券商分发的组合。作为面向零售事件合约的首个 CFTC DCM（2020 年 11 月获指定），Kalshi 在一个此前不存在的品类中，率先搭起合规基础设施、法律先例和
              FCM 关系。Robinhood 作为 FCM 合作伙伴接入——贡献 Kalshi 日成交量 25–35%——是分发护城河最清晰的证据：Robinhood 拥有 24+ million
              已入金账户，并把相当一部分股票交易用户导入事件合约。截至 2026 年 5 月，没有其他事件合约平台复制了这种分发动态。

              流动性本身就是网络效应护城河。价差紧、深度足的流动市场会吸引更多交易者，进而进一步加深流动性。Kalshi 累计成交量 $52 billion+、周运行率 $1
              billion+，形成了价差和深度，新进入者若没有外部流动性注入或已连接用户基础，结构上很难复制。ForecastEx 和 PredictIt（新交易所结构）都面对冷启动流动性问题，单靠低费率无法解决。

              CFTC 主动捍卫 Kalshi 市场——2026 年 4–5 月起诉六个州（Arizona、Connecticut、Illinois、New
              York、Wisconsin、Minnesota），阻止州博彩执法，并在 Arizona 赢得限制令——通过法律确定性形成了未受监管竞争者无法声称的竞争护城河。Polymarket 没有触发优先管辖的 DCM
              牌照，因此不能依赖 CFTC 优先管辖保护。PredictIt 的新交易所牌照未来可能使其符合优先管辖条件，但仅限于它目前覆盖的政治类别。

              Kalshi 的结构性劣势集中在三个方面。第一，体育收入集中度（2025 年收入 89%）形成单一市场依赖，这是 Polymarket
              和传统体育博彩运营商都没有的；如果规则制定或法院命令限制体育合约范围，Kalshi 收入基底会不成比例地塌缩。第二，Polymarket
              的加密基础设施让加密原生用户能够自托管、低摩擦参与，也支持不受司法辖区许可约束的全球市场。Kalshi 的受监管模式要求身份验证、许多合约类型要求美国居住身份，并需要 FCM
              中介——摩擦更高，限制病毒式增长。第三，Kalshi 没有可与 Polymarket 开放 API 和 CLOB 基础设施（docs.polymarket.com）相比的开发者生态，程序化交易和第三方做市集成弱于
              Polymarket 的去中心化架构。

              关键的多平台使用问题是：预测市场用户已经表现出同时使用多个平台的意愿（用 Polymarket 做全球加密市场，用 Kalshi 做受监管美国市场）。这削弱了 Kalshi 的排他性，但也限制了
              Polymarket 完全替代 Kalshi 的能力。Kalshi 拥有的最强反多平台机制，是 Robinhood 单平台体验带来的分发锁定。
