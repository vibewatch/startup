            body: >-
              截至 2026-05-24，仍有多项风险明确未解，值得正式监控。联邦法是否优先适用于事件合约、从而排除州博彩法，Supreme Court 层面尚无定论；如果没有准予调卷 和实体裁决，Kalshi
              必须逐州诉讼多年。Brown v. Kalshi 原告主张体育事件合约在功能上就是体育博彩，应按体育博彩监管，这直接否定 Kalshi 的联邦管辖抗辩；集体认证或大额和解都会带来真实财务风险。CEO Tarek
              Mansour 是 Kalshi 监管、政治和融资姿态的公众代表；公司正多线作战时，关键人物事件可能实质性削弱执行能力。公开文件没有披露 Kalshi
              的现金跑道或诉讼成本缓冲，这本身就是尽调缺口。缓释和否决标准表设置了可监控触发器（SCOTUS 准予调卷、联邦立法进入审议标记阶段、前五大体育博彩州中关键州的联邦禁令、CFTC 对 Kalshi
              本身的执法行动、关键人物事件以及不利集体认证），并为每一项给出对应行动含义。结合风险热力图和传导图，这些触发器把原本发散的风险面收束成投资者可按季度运行的监控闭环。
