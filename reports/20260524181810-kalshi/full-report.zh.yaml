              American Gaming Association 明确把预测市场框定为“未受监管体育博彩”——尽管 Kalshi 拥有 CFTC DCM
              身份——并在其面向公众的博彩地图上记录州税收损失，这代表了一场资金充足、组织化的努力，旨在通过立法限制预测市场平台或对其征税。它不是直接产品竞争者，但会威胁 Kalshi 商业模式赖以成立的监管环境。AGA 每年
              $329 billion 经济影响和支持 1.8 million 个就业岗位，相比 Kalshi 尚在起步的游说能力，拥有显著政治影响力。
