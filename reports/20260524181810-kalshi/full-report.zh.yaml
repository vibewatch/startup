  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与费用结构
        blocks:
          - type: paragraph
            body: >-
              Kalshi 的收入完全来自事件合约交易的按合约交易费。每份合约价格在 $0.01 到 $0.99 之间，并根据结果是否发生结算为 $1.00 或 $0.00。Kalshi
              充当纯交易所中介——不与用户对赌，不收会员费或订阅费，无论哪种结果获胜都能盈利。因此，平台收入模式把平台激励与市场流动性绑定，而不是与方向性风险绑定。


              2025 年，Kalshi 报告在估计 $50+ billion 年化名义成交量上取得 $263.5 million 费用收入，隐含抽佣率约 0.53%。到 2026 年 3 月，CEO Tarek
              Mansour 提到 $1.5 billion 年化运行率，并称平台在事件高峰期每周处理超过 $2 billion。体育事件合约贡献了 2025 年费用收入约 89%；仅 2026 年 2 月的 Super
              Bowl LX，单日成交量估计就达到 $1 billion。这些事件驱动高峰确认了平台处理集中流量冲击的能力。


              2025 年 3 月上线的 Robinhood 分发合作，显著降低了零售参与者的有效获客成本。到 2025 年 10 月，在活跃体育日，Robinhood 贡献 Kalshi 日交易量约
              25–35%，压缩了触达增量零售交易者的经济成本。NBC News 指出，相比加密同行，Kalshi 以 USD 计价的结算模式扩大了可触达零售基础，也可能进一步支持自然成交量增长。
