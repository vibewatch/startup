      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >
              Tarek Mansour（联合创始人兼 CEO）和 Luana Lopes Lara（联合创始人兼 COO）都是第一代移民——Mansour 来自 Algeria，Lopes Lara 来自
              Brazil——两人在 MIT 攻读数学相关学位时相识。联合创立 Kalshi 前，Mansour 曾在 Goldman Sachs 和 Citadel Securities 担任量化岗位；Lopes Lara
              曾在 Bridgewater Associates 和 Citadel Securities 工作。两人的衍生品和量化金融背景，让他们直接理解搭建交易所而非消费应用所需的监管环境和技术基础设施。

              Lopes Lara 被认为主导了 2023 年 11 月就 CFTC 拒绝选举市场起诉该机构的决定。此前董事会持续反对，建议创始人近两年都把重点放在其他产品上，她推动团队越过了这种阻力。2025 年，Lopes
              Lara 被评为全球最年轻的白手起家女性亿万富豪。两位创始人仍担任执行运营角色，没有领导层交接迹象。关键人物集中风险很高：战略、监管关系、资本获取和公众叙事都经过两位联合创始人，尤其是作为 CEO 的
              Mansour 最为可见。

              除联合创始人外，公开可查的高管团队还包括 Richard Heaslip（总法律顾问兼首席监管官）、Joshua Beardsley（首席合规官）和 Max
              Crowley（业务发展副总裁）。董事会构成并未完全公开；投资者来源确认 Paradigm 和 Sequoia Capital 基于多轮领投位置拥有董事会席位。CNBC 与 Kalshi
              存在商业关系，包括获客合作和少数股权投资，这削弱了 CNBC 作为来源的部分独立性。包含独立董事的完整董事会名单尚未在公开来源中确认，是一个开放尽调项。
