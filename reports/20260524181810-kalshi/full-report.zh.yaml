          - type: callout
            title: 收入极度集中于体育合约
            body: 2025 年约 89% 收入来自体育事件合约，Kalshi 面临重大集中度风险。州总检察长执法、AGA 游说奏效，或联邦层面对体育博彩分类翻转等不利监管或立法动作，都可能削弱核心收入引擎，并大幅改写财务画像。
            calloutType: risk
            claimRefs:
              - CI003
              - CI036
              - CI037
          - type: callout
            title: 估值中的交易所基础设施溢价
            body: >-
              Kalshi $22 billion 估值约等于 2025 年收入的 84x，说明投资者相信它是受监管金融基础设施，而不是消费应用。拥有监管护城河的交易所业务（CME、ICE）能长期维持高倍数；这份溢价来自
              Kalshi 独特的 CFTC DCM 资格和网络效应壁垒。
