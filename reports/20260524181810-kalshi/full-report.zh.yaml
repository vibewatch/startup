      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 89% 收入集中在法律争议中的体育合约
            body: >-
              最重大的单一估值风险是，Kalshi 2025 年手续费收入的 89%
              来自体育事件合约，而至少七个州正积极寻求以无牌赌博为由禁止这些合约。若多州禁令成功，或联邦巡回法院作出不利裁决，收入会崩塌，适用估值倍数也会同步压缩；这种双重压缩可能使内在价值较 $22 billion 标记下降
              85–95%。
            calloutType: risk
            claimRefs:
              - CV033
              - CV034
          - type: callout
            title: 定价要求在法律脆弱收入基础上套用交易所式倍数
            body: >-
              以 $22 billion 估值对应 $1.5 billion run rate，Kalshi 的收入倍数为 14.7x——作为交易所倍数算合理（CME 约 16x），但只有在收入基础像 CME
              多元化、机构清算的衍生品业务一样耐久时才站得住。Kalshi 的收入基础并非如此。按 Series F 条款定价的投资者，实际上等于把体育博彩级法律敞口赋予交易所级耐久性。
            calloutType: insight
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV019
          - type: callout
            title: Run rate 和收入数据由管理层披露，未经审计
            body: >-
              $1.5 billion 年化 run rate（2026 年 3 月）和 2025 年 $263.5 million 手续费收入，都是新闻报道和公司博客引用的管理层披露数据。Kalshi
              尚未提交审计财务报表，CFTC 也不公开 DCM 财务报告。本章所有使用这些数据的估值计算都明确属于近似估算；一旦有独立收入认证，应重新刷新。
            calloutType: assumption
            claimRefs:
              - CV040
              - CV041
