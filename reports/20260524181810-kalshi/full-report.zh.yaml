      - number: '8.4'
        title: 投资论点、反方论点与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              核心投资论点立在五根支柱上：（1）Kalshi 持有一个事实上难以复制的美国监管资产——唯一一个专为零售事件合约打造、获 CFTC 指定的 DCM；（2）预测市场品类已经证明能规模化变现，2025 年手续费收入
              $263.5 million，2026 年 3 月 run rate 达 $1.5 billion，增速可比过去十年扩张最快的金融科技公司；（3）Robinhood
              分发降低获客成本，并为交易量提供飞轮；（4）美联储 2026 年 2 月工作论文发现 Kalshi 预测准确度可媲美传统工具，验证机构采用；（5）当前 run-rate 倍数为 14.7x，入场价格相对
              Robinhood 的成长型金融科技倍数有折扣。

              反方论点同样尖锐：（1）体育合约贡献 89% 收入，直接撞上至少七个州的博彩监管立场；（2）公司已融资 $2.8 billion，却没有审计财报、公开盈利能力数据或经确认的 EBITDA 利润率，run-rate
              说法无法验证；（3）数月内连续融资、每轮估值上跳 2–4x，更像动量定价，而非基本面重估；（4）CME Group 拥有 178 年交易所基础设施，并与 FanDuel/Flutter
              建立预测市场合资公司，正带着 Kalshi 还无法匹配的机构关系入场；（5）参议院听证、民主党国会压力以及非营利组织 Better Markets 都公开主张 CFTC 对体育博彩没有管辖权，抬高联邦立法风险。

              会让乐观情景失效的论点破裂触发器包括：最高法院授予调卷并撤销 CFTC 对事件合约的权限；联邦立法明确禁止 CFTC 监管的体育事件合约；Brown v. Kalshi 出现不利的集体认证；CFTC
              自身达成同意令或采取执法行动；以及 Robinhood 分发合作关系丧失。第 7 章记录实时诉讼清单；投资者应跟踪第三巡回法院关于州与联邦管辖权的裁决（目前在上诉中），这是近端短期信号。
