      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              最重要的单一增长开关，是 CFTC 监管优先管辖。2026 年 4–5 月，CFTC 起诉 Arizona、Connecticut、Illinois、New York、Wisconsin 和
              Minnesota，阻止各州对受监管预测市场实施博彩执法。CFTC 还获得了针对 Arizona 的临时限制令，向 Massachusetts Supreme Judicial Court 和 Sixth
              Circuit 提交法庭之友意见，并与 NHL 签署信息共享 MOU。每一次法律胜利，都会通过移除州层面的刑事和监管敞口，扩大美国可触达用户基础。

              需求侧，PASPA 废除后的体育博彩轨迹提供了有用类比：美国体育博彩从 2018 年接近零增长到 2024 年 $13.78B GGR，最快加速发生在多州合法化消除不确定性之后。如果 CFTC
              优先管辖最终解决州管辖冲突，Kalshi 可能受益于类似的合法性解锁。券商分发是第二个主要增长加速器：Robinhood 贡献 25–35% 日成交量，意味着 Kalshi 不必自建分发层也能获得规模化获客。

              采用约束同样重大。AGA 和互动博彩行业公开反对预测市场，并在 2026 年 1 月联合信中将其描述为“未受监管”，尽管 Kalshi 拥有 CFTC 指定资格——这种叙事可能造成消费者混淆。CFTC-NHL
              MOU 让体育联盟影响合约范围，可能预示未来会出现许可义务。Kalshi 89% 体育收入集中度制造了单一产品线风险：如果未来规则制定或法院命令限制体育合约，收入基底会大幅收缩。ForecastEx
              最低费率的竞争定位表明，随着市场成熟，利润率压缩可能随之而来。
