      - number: '2.2'
        title: 市场规模估算与限制
        blocks:
          - type: paragraph
            body: >-
              没有独立分析师把美国 CFTC 监管事件合约作为独立市场发布过专门 TAM。Grand View Research、Mordor Intelligence 和 Fortune Business Insights
              的全球预测市场报告，把全球受监管和未受监管平台混在一起，因此不能可靠代表 Kalshi 的具体市场。现有最相关的规模证据来自代理基准：相邻市场规模、Kalshi 自身披露指标，以及估值隐含假设。

              美国受监管体育博彩市场是体育合约交易最接近的替代品：2024 年在 $149.90B 投注额上产生 $13.78B GGR，较 2023 年 $11.04B 同比增长 24.8%。美国 iGaming 2024
              年新增 $8.41B GGR（同比 +28.7%）。这些数字确认了 2024 年美国相邻博彩收入池超过 $22B。Kalshi 2025 年费用收入 $263.5M、年化成交量超过 $50B，隐含有效抽佣率约为
              0.5%，明显低于体育博彩平台 5–7% 的运营利润率。

              Kalshi 2026 年 3 月 $22B 估值隐含 84x 收入倍数——这是一个极端溢价，定价了显著的未来市场扩张。全球最大期货交易所 CME Group 的交易倍数约为 20–25 倍利润。Kalshi
              估值内嵌的增长假设没有任何已发布独立市场分析支撑，因此市场规模和轨迹是首要尽调问题。到 2026 年 3 月，累计合约成交量超过 $52B，较 2025 年中大致翻倍，说明增长轨迹真实，即便终局市场规模仍有争议。
