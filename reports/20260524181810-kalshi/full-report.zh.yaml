      - number: '8.3'
        title: 乐观 / 基准 / 悲观情景
        blocks:
          - type: paragraph
            body: >-
              三套情景框架框定未来五年的结果区间。情景锚定公开披露财务和第 7 章详述的诉讼格局；这些数字明确是近似估算，未经审计。

              乐观情景（$45–75 billion，5 年终局）：假设 CFTC 的联邦优先权在巡回法院或最高法院层面获得维持，体育事件合约在 40+ 个州继续存在，收入从 2026 年 3 月 $1.5 billion
              run rate 复合增长，到 FY2028 达到 $5–8 billion（相对 run rate 的 CAGR 约 75–120%）。按 10–15x 收入倍数（与 CME
              或溢价增长型交易所一致），终局价值达到 $50–120 billion。乐观催化剂包括：最高法院作出有利的调卷决定，或联邦立法明确 CFTC 优先地位；国际市场份额提升；Robinhood
              和更多券商接入放大交易量；以及走向公开市场。鉴于当前监管不确定性，赋予概率约 25–30%。

              基准情景（$18–30 billion，5 年）：假设州层面限制部分落地（10–15 个州事实上封堵体育合约），体育收入放缓，但宏观、政治和天气合约分散收入结构。到 FY2027，总收入从 run rate 增至
              $2.5–4 billion，增速 65–165%。按 8–12x 收入倍数，终局价值为 $20–48 billion。只要体育收入不被整体清零，$22 billion 入场点在这条路径上大致算「合理」。概率约
              40–45%。

              悲观情景（$2–7 billion）：假设联邦立法或不利上诉裁决事实上清除美国体育事件合约，收入按 2025 年手续费集中度相应下滑约 89%。剩余非体育收入 $150–350 million 可支撑 5–10x
              倍数，隐含 $750 million 至 $3.5 billion；但已融资 $2.8+ billion 以及优先权悬置，意味着普通股价值会低得多。30 个州立法禁令，或美国最高法院调卷并推翻 CFTC
              权限，将成为触发点。概率 25–30%。

              按 25% 乐观 / 45% 基准 / 30% 悲观（中点）加权，预期价值约 $22 billion，与 Series F
              价格一致，但也意味着按披露价格入场的投资者没有任何风险溢价。缺少稀释数据、分配瀑布假设和优先权悬置细节，无法精确计算每股内在价值。
