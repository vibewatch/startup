      - number: '8.5'
        title: 退出准备度、建议与未解尽调缺口
        blocks:
          - type: paragraph
            body: >-
              退出路径分析高度推测，但三条路线可行：（1）IPO——Kalshi 的 $22 billion 私募估值和 $1.5 billion run rate 会让它跻身过去五年最大的金融科技 IPO
              候选之一；但诉讼悬置、缺少审计财报、法律分类不确定（交易所 vs. 博彩），使其按当前估值进入公开市场的准备度最多只能算不确定；（2）战略收购——CME Group、Nasdaq Inc.
              或大型金融交易所可能会认为 DCM
              牌照和用户基础有战略价值，尤其是在体育合约争议解决之后；（3）二级市场流动性——公司支持者（Paradigm、Sequoia、Coatue）足够成熟，可以通过二级市场交易设计部分退出；Polymarket 到
              2026 年 1 月二级市场隐含估值 $11.6 billion 已经证明这条路。

              建议为继续研究，估值立场偏紧。Series F 支付的价格，把一个法律基础脆弱的 run rate 赋予交易所式倍数。新投资者的入场纪律应要求：（a）至少在第三和第九巡回法院获得体育合约法律清晰度；（b）2025
              年审计财报，或最低限度的 2025 审计意见；（c）EBITDA 利润率可见度——这是判断 $1.5 billion run rate 是接近盈利，还是在消耗已融资 $2.8 billion
              的关键。在这些条件满足之前，新投资者若按 $22 billion 或更高估值进入，应对 Series F 投后标记保持怀疑。

              阻止形成更高确信度判断的未解尽调缺口包括：（1）FY2025 或 2026 年 Q1 期间没有公开审计、CFTC 财务报告或独立收入认证；（2）六轮机构融资中的优先权悬置和分配瀑布结构未披露；（3）员工成本和
              EBITDA 未知——公司六个月内从约 70 人扩张到 494 人，意味着成本曲线大幅拐点；（4）Robinhood 合作经济条款（收入分成、排他性条款、终止触发器）未披露；（5）Paradigm 与
              Coatue 的股权结构表集中度带来董事会层面的治理风险，而上市公司可比样本中没有这一风险。
