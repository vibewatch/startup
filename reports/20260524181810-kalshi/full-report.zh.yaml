  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与用户工作流
        blocks:
          - type: paragraph
            body: >-
              Kalshi 的核心产品是二元事件合约：一份定价在 $0.01 到 $0.99 之间的 Yes 或 No 份额，反映市场对某个现实结果的估计概率。结算时，胜方每份合约支付 $1.00，败方支付
              $0.00。用户主要通过三类界面使用交易所。kalshi.com 提供的网页应用支持浏览市场、下单、管理组合和存取款。iOS 与 Android 移动应用延伸了同一套核心流程；Kalshi
              提到有移动应用，但本轮研究未能访问到经过验证且仍活跃的 App Store 或 Google Play Store 上架页面。第三，公开 REST 和 WebSocket API
              支持算法与程序化交易，形成量化交易者和开发者这一独立用户群。

              典型零售用户旅程从开户注册和 ACH 入金开始，随后浏览六大类事件目录：体育（主导品类，2025 年约贡献 89–95% 费用收入）、宏观经济指标（CPI、Federal Reserve
              利率决议、GDP）、政治、天气、娱乐和加密货币里程碑。用户选择一个市场，查看当前订单簿和概率，再在 Yes 或 No 方下限价单或市价单。订单可以留待成交（good-till- canceled），也可以设为
              immediate-or-cancel。市场结算时，清算自动且即时完成——Kalshi 向每份胜出合约支付 $1.00，不需要用户手动申领。

              到 2025 年，Kalshi 已嵌入两家主要券商平台。Robinhood 在 early 2025 推出 Prediction Markets Hub，以 Kalshi 作为底层交易所；到 October
              2025，在活跃体育交易日，Robinhood 用户占 Kalshi 日交易量的 25–35%。Webull 也把 Kalshi 事件合约接入其零售交易应用。Kalshi 在 Series E 轮募资用途中把券商
              API 策略表述为“add brokerages”，Reuters 也确认这是既定资本配置优先事项。

              市场类别同时覆盖数十个事件。体育合约描述使用通用城市名（例如 “Pro Football Champion: Chicago”），而不是官方球队名称和标志，反映其没有来自 NFL、NBA 和 MLB
              的联盟数据授权。Federal Reserve 和 Federal Reserve Bank 数据流直接支撑宏观经济市场结算。预测准确性方面，Federal Reserve 在 February 2026
              发表的工作论文发现，Kalshi 概率数据在通胀和利率结果上追平或优于传统 Wall Street 预测工具；CNN 和 CNBC 现在也把 Kalshi 概率数据与民调和专家预测并列发布。

              国际化方面，平台在 October 2025 完成 $300 million Series D 后扩展到 140 多个国家，同时限制包括 Canada、United
              Kingdom、France、Singapore 和 Russia 在内的 38 个司法辖区。国际用户使用的功能与美国客户相同。加密货币入金方面，Kalshi 接受最高 $500,000 的 Solana
              存款，并通过区块链合作伙伴集成支持 Bitcoin、USDC 和 Worldcoin。
