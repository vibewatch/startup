  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管姿态与联邦地位
        blocks:
          - type: paragraph
            body: >-
              在 2026 年金融科技公司中，Kalshi 处在诉讼最活跃的监管边界之一。公司在 Commodity Futures Trading Commission 同时注册为 Designated Contract
              Market 和 Derivatives Clearing Organization，这意味着它受 Commodity Exchange Act 核心原则监管，而不是州博彩法监管。September
              2024，D.C. District Court 撤销了 CFTC 对 Kalshi 国会控制权事件合约的否决；May 2025，CFTC
              正式撤回上诉，实际上结束了联邦层面对注册交易所政治预测市场的反对。这一姿态对 Kalshi 产品组合有实质帮助，但也招致 Better Markets 等独立监督机构严厉批评，后者认为 CFTC
              已从选举诚信监管中后退。March 2026，CFTC 发布预测市场执法指引，明确其 Section 6(c)(1) 和 Rule 180.1
              反操纵权力覆盖事件合约交易；即便关乎存亡的选举合约之争已经解决，联邦执法风险仍然存在。民主党议员又在 April 2026 敦促 CFTC 重启对 Kalshi 和 Polymarket 的审查，House
              Oversight 和 Financial Services 两个委员会也在 May 2026 对 KYC 和交易监控实践展开正式调查。因此，联邦地位并非无人管理的风险，但也没有收口：CFTC
              姿态若逆转，或针对官员、体育合约的新立法出现，都会直接打击 Kalshi 的收入基底。
