      - number: '3.2'
        title: 监管地位与产品对比
        blocks:
          - type: paragraph
            body: >-
              预测市场版图中的监管分层，是最关键的竞争轴。CFTC DCM 牌照让 Kalshi 可以对州博彩法主张联邦优先管辖，接入注册期货佣金商（FCM）做分发，并为机构和零售参与提供法律确定性。ForecastEx
              持有相同 DCM 指定资格，但未披露市场广度、成交量或用户数据。PredictIt 新交易所牌照（2025 年 9 月获批）范围更窄——仅限政治市场——其此前不采取行动函在十年内同时限制了持仓规模和参与人数。

              Polymarket 没有 DCM 牌照。2025 年 12 月重返美国用户，源于 Trump 政府的 CFTC 放弃调查，而不是正式监管批准。Polymarket 尚未申请 DCM
              指定资格。它的加密原生架构（Polygon 区块链上的 USDC 抵押）既是技术差异点，也是监管敞口——它在传统金融基础设施之外结算，无法像 Kalshi 那样接入美国 FCM 分发渠道。

              产品广度上，Kalshi 在美国可访问平台中覆盖最宽：体育结果、政治和选举事件、经济指标（CPI、美联储利率决议）、天气、娱乐，以及加密货币里程碑。ForecastEx
              公开材料只提到经济、气候和政治类别——其产品页面未提及体育。PredictIt 受交易所牌照条款限制，结构上只能做政治和选举结果。IEM 只运营选举和经济期货，上限为 $500。

              定价结构差异显著。Kalshi 对每笔交易收取交易费（公司没有发布单一通用费率表，但披露在 $50 billion+ 年化成交量上产生 $263.5 million 费用收入，隐含有效抽佣率约
              0.5%）。ForecastEx 公开宣称“费用低于任何竞争对手”，并且还通过“Incentive Coupon”把抵押品产生的利息返还给会员，在某些场景下形成净负有效费用。Polymarket
              的具体费用结构没有以固定费率形式公开记录；它使用 CLOB 模型并提供做市商激励。

              流动性差异目前很大，但更多是信息性指标。Kalshi 报告累计合约成交量 $52 billion+，到 2025 年 12 月周成交量 $1 billion+。Polymarket 自称是“全球最大预测市场”，仅
              2024 年总统大选就吸引了 $3.3 billion。ForecastEx 和 PredictIt（新交易所）截至 2026 年 5 月没有披露可比成交量数字。
