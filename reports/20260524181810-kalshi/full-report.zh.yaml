      - number: '1.3'
        title: 融资历史、估值与投资者
        blocks:
          - type: paragraph
            body: >
              2024 年选举合约案胜诉后，Kalshi 的资本形成在 2025 年急剧提速。公司 2025 年 6 月完成 $185 million Series C，估值 $2 billion；随后 2025 年 8
              月完成并于 10 月宣布 $300 million Series D，估值 $5 billion；2025 年 12 月完成 $1 billion Series E，估值 $11 billion；据报道，2026
              年 3 月又由 Coatue Management 领投约 $1 billion，估值 $22 billion。按 Crunchbase 数据，Series E 使 Kalshi 已知累计融资超过 $1.6
              billion；按 Yahoo Finance 和 Tracxn（$2.8 billion）报道，2026 年 3 月一轮将累计融资推过 $2.5 billion。

              2025 年前，Kalshi 已通过早期轮次融资约 $230 million，包括 Y Combinator 加速器投资（2019 年）、种子延展轮，以及 2021 年 2 月由 Sequoia Capital
              领投、Charles Schwab、Henry Kravis、SV Angel、Neo 和 Y Combinator 参投的约 $30 million Series A。Paradigm 是最稳定的领投方，出现在
              Series C 和 Series E。Sequoia Capital 与 Andreessen Horowitz 共同领投 Series D，并继续参与 Series E。其他知名投资者包括
              CapitalG（Google/Alphabet 的成长基金）、ARK Invest、IVP、Meritech Capital、Anthos Capital、Coinbase Ventures、Multicoin
              Capital、Spark Capital 和 General Catalyst。Charles Schwab 与投资人 Henry Kravis 是早期支持者。截至 2026 年 5 月，Kalshi
              仍为私有公司，未宣布 IPO 计划；完整股权结构表，包括创始人持股和老股交易，均未公开披露。
