              至少八个州存在进行中的诉讼或执法行动，出现了首起针对 CFTC 监管交易所的刑事起诉，2026 年初又有 10 多项国会法案被提出。这些因素对体育合约收入基底构成真实的运营和生存风险，而该基底贡献了 Kalshi
              2025 年费用收入约 89%。联邦禁令迄今保护了运营，但如果 Supreme Court 作出不利于联邦优先管辖的裁决，Kalshi 可能必须退出多个大州。
