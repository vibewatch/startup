chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >
              Kalshi 以 KalshiEX LLC 注册，是一家总部位于 New York, New York（594 Broadway）的金融交易所。公司由 Tarek Mansour 和 Luana Lopes
              Lara 于 2018 年创立；两人是 MIT 同学，在攻读量化金融相关学位时相识。Kalshi
              将自己的使命描述为，把现实世界事件结果做成一个独立的受监管资产类别，从而建设“地球上最重要的金融市场”。Kalshi 参加了 Y Combinator 2019 年冬季批次，随后花了两年多做监管准备，2020 年
              11 月获得美国商品期货交易委员会（CFTC）的指定合约市场（DCM）资格——这使它成为美国第一家专门为事件合约搭建、并获得完整联邦监管认可的交易所。平台于 2021 年 7 月公开上线。

              产品核心是事件合约：一种二元工具，其价值反映市场对某个现实世界事件发生概率的估计，价格在 $0.01 到 $0.99 之间，到期结算为 $1.00 或
              $0.00。市场类别包括美国宏观经济指标（CPI、美联储利率决议、GDP）、政治和选举结果、体育赛果、天气事件、娱乐，以及加密货币里程碑。Kalshi
              作为受监管交易所，通过每笔交易收取手续费赚钱；不同于体育博彩平台，它不与用户对赌。截至 2026 年 5 月，Kalshi 仍是美国唯一专注事件合约的联邦许可 DCM，法律框架与 CME Group 和 Cboe
              相同，但产品集——与事件挂钩的二元互换——此前没有既有交易所面向零售参与者重点推进。2025 年 10 月，Kalshi 扩展至 140 多个国家，同时限制 Canada、United
              Kingdom、France 等 38 个司法辖区。
