figures:
  - id: FM001
    title: Market sizing pyramid — TAM, SAM, and SOM layers
    type: pyramid
    layout: wide
    summary: >-
      Market sizing layers from the broadest adjacent context (US regulated gaming GGR) down to
      Kalshi's current fee revenue, illustrating the gap between proxy benchmarks and a true TAM.
    data:
      items:
        - label: Adjacent US regulated gaming (TAM proxy)
          value: '$22B+ GGR (2024)'
          detail: >-
            US sports betting GGR $13.78B + iGaming $8.41B = $22.19B in 2024 (AGA State of States
            2025). These are adjacent substitutes for sports and entertainment prediction, not the
            event contract market itself. No standalone event contract TAM exists.
        - label: US CFTC event contract market (SAM proxy — no independent estimate)
          value: '$50B+ annualized volume; no standalone revenue TAM'
          detail: >-
            Estimated serviceable addressable market for CFTC-regulated event contracts. No
            independent analyst TAM exists. Kalshi $50B+ annualized volume and $263.5M fee revenue
            are the best available proxies. ForecastEx and other platforms add undisclosed volume.
        - label: Kalshi current fee revenue (SOM — verified)
          value: '$263.5M (2025)'
          detail: >-
            Bloomberg-reported Kalshi fee revenue for 2025. Represents ~89% sports contracts at an
            implied ~0.5% effective take rate on $50B+ annualized volume. 5M+ registered users.
        - label: Near-term SOM at current growth trajectory (estimated)
          value: '$500M–$1B+ (estimated 2026-2027)'
          detail: >-
            Extrapolation based on 2025 revenue and observed volume doubling through March 2026.
            Not validated by independent analysis. Predicated on continued CFTC preemption success
            and no sports contract scope restrictions.
    approximationNotes: >-
      All values except Kalshi 2025 fee revenue ($263.5M) are proxies, estimates, or extrapolations.
      TAM proxy uses adjacent gaming GGR because no standalone event contract TAM exists. Near-term
      SOM is speculative and should not be used as a market benchmark.
    claimRefs: [CM007, CM008, CM009, CM012, CM013, CM038]

