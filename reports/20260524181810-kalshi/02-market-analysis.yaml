chapter:
  number: 2
  title: Market Analysis
  summary: >-
    The CFTC-regulated US event contract market has no standalone TAM from independent analysts, but
    adjacent benchmarks anchor the opportunity: US sports betting GGR reached $13.78B in 2024 (+24.8%
    YoY) while Kalshi's 2025 fee revenue hit $263.5M on $50B+ annualized volume. Kalshi holds a
    first-mover regulatory position—ForecastEx is the only other CFTC DCM—while Robinhood (25-35% of
    daily volume), Coinbase, and Fanatics Markets expand distribution. Growth is accelerated by CFTC
    federal preemption of 6+ states' gambling laws; the primary risk is 89% sports revenue
    concentration and organized AGA opposition that frames the category as "unregulated" despite
    active CFTC oversight.
sections:
  - id: market-boundary-definitions
    title: Market boundary and definitions
    body: >-
      The CFTC-regulated US event contract market is structurally distinct from every other wagering or
      trading product in the US. Kalshi operates as a Designated Contract Market (DCM) under the
      Commodity Exchange Act, issuing binary contracts priced $0.01–$0.99 that settle at $0 or $1
      depending on real-world outcomes. Buyers and sellers transact with each other at a
      market-clearing price; Kalshi earns a fee but does not take a position against users—the
      fundamental difference from a sportsbook.

      US regulated sports betting, governed by state gaming commissions following the 2018 PASPA
      repeal, uses fixed-odds pricing where the sportsbook sets odds and takes position against
      bettors. Despite addressing overlapping buyer intent—predicting sports outcomes—the two markets
      operate under distinct regulatory frameworks, different fee models, and different economic
      structures. The AGA's $78.72B commercial gaming GGR figure for 2025 does not include event
      contract volume because event contracts are not a commercial gaming product under state law.

      Polymarket, the largest prediction market by estimated volume, operates on USDC crypto
      collateral without a US regulatory entity, using an automated market maker model. ForecastEx,
      registered as a CFTC DCM in June 2024, is the only direct structural competitor to Kalshi with
      equivalent regulatory standing. iGaming products (online slots and table games) operate under
      state gaming licenses entirely separate from CFTC jurisdiction. Traditional financial derivatives
      on CME and similar exchanges share the DCM regulatory framework with Kalshi but differ in buyer
      profile, contract structure, and scale—CME's interest rate ADV alone exceeded $14T per day in
      April 2026.
    claimRefs: [CM001, CM002, CM003, CM004, CM005, CM006]
    tableRefs: [TM001]

  - id: market-sizing-estimates
    title: Market sizing estimates and limitations
    body: >-
      No independent analyst has published a dedicated TAM for US CFTC-regulated event contracts as a
      standalone market. Global prediction market reports from Grand View Research, Mordor
      Intelligence, and Fortune Business Insights aggregate both regulated and unregulated platforms
      worldwide, rendering their figures unreliable as proxies for Kalshi's specific market. The most
      relevant available sizing evidence comes from proxy benchmarks: adjacent market size, Kalshi's
      own disclosed metrics, and valuation-implied assumptions.

      The US regulated sports betting market—the closest substitute for sports contract trading—
      generated $13.78B in GGR in 2024 on $149.90B in handle, a 24.8% year-over-year increase from
      $11.04B in 2023. US iGaming added $8.41B GGR in 2024 (+28.7% YoY). These figures establish a
      $22B+ adjacent US gaming revenue pool in 2024. Kalshi's $263.5M in 2025 fee revenue against
      $50B+ annualized volume implies an effective take rate of approximately 0.5%, well below
      sportsbook operating margins of 5-7%.

      Kalshi's $22B March 2026 valuation implies an 84x revenue multiple—an extreme premium that
      prices in significant future market expansion. The CME Group, the world's largest futures
      exchange, trades at roughly 20-25x earnings. The implied growth assumption embedded in Kalshi's
      valuation is not supported by any published independent market analysis, making size and
      trajectory a primary diligence question. Cumulative contract volume passed $52B by March 2026,
      roughly doubling from mid-2025, suggesting the growth trajectory is real even if the terminal
      market size remains contested.
    claimRefs: [CM007, CM008, CM009, CM010, CM011, CM012, CM013, CM014, CM038]
    tableRefs: [TM002]
    figureRefs: [FM001, FM002]

  - id: buyer-and-user-segmentation
    title: Buyer and user segmentation
    body: >-
      Kalshi's buyers divide into two broad groups: retail consumers and institutional or professional
      traders. Among retail buyers, sports fans represent the dominant segment—approximately 89% of
      2025 fee revenue derived from sports event contracts, reflecting a user base primarily motivated
      by applying sports knowledge rather than financial hedging. The adoption trigger for sports
      buyers is a major live event: Super Bowl, March Madness, and the NFL season drive the highest
      volumes. Kalshi disclosed more than 5 million registered users by end of 2025.

      Political and election buyers form a second distinct segment: politically engaged consumers who
      seek to express views on election outcomes or hedge against policy exposure. Economic indicator
      traders—a smaller but potentially higher-value segment—include retail investors and professional
      traders who use Kalshi for macro hedging or directional positions on Fed decisions and economic
      data releases. Weather and climate contracts appeal to a narrower buyer base.

      Distribution channels define access patterns. Direct Kalshi users constitute the majority of
      registrants, while Robinhood's FCM integration accounts for approximately 25-35% of daily
      volume, suggesting a large portion of active traders arrive via brokerage access. Coinbase and
      Fanatics Markets provide additional distribution vectors with distinct user demographics:
      crypto-native users via Coinbase and sports brand loyalists via Fanatics. As of May 2026,
      ForecastEx, Kalshi's only competing CFTC DCM, had disclosed no user count or volume data.
    claimRefs: [CM015, CM016, CM017, CM018, CM019, CM020, CM021, CM022, CM033, CM039]
    tableRefs: [TM003]
    figureRefs: [FM003]

  - id: growth-drivers-and-constraints
    title: Growth drivers and adoption constraints
    body: >-
      The single most important growth enabler is CFTC regulatory preemption. Between April and May
      2026, the CFTC sued Arizona, Connecticut, Illinois, New York, Wisconsin, and Minnesota to block
      state gambling enforcement against regulated prediction markets. The CFTC also secured a
      temporary restraining order against Arizona, filed amicus briefs with the Massachusetts Supreme
      Judicial Court and the Sixth Circuit, and signed an information-sharing MOU with the NHL. Each
      legal win expands the addressable US user base by removing state-level criminal and regulatory
      exposure.

      On the demand side, sports betting's trajectory since PASPA repeal provides an instructive
      analog: US sports betting grew from near-zero in 2018 to $13.78B in GGR by 2024, with the most
      rapid acceleration occurring once multi-state legalization removed ambiguity. If CFTC preemption
      definitively resolves state jurisdictional conflict, Kalshi could benefit from a comparable
      legitimacy-unlock. Brokerage distribution is the second major growth accelerator: Robinhood's
      25-35% daily volume share represents scale acquisition without Kalshi having to build its own
      distribution layer.

      Adoption constraints are equally material. The AGA and the interactive gaming industry publicly
      oppose prediction markets and characterized them as "unregulated" in a January 2026 joint letter,
      despite Kalshi's CFTC designation—a framing that could create consumer confusion. The CFTC-NHL
      MOU introduces sports league influence over contract scope, potentially prefiguring licensing
      obligations. Kalshi's 89% sports revenue concentration creates a single-product-line risk: if
      sports contracts are restricted by future rulemaking or court order, the revenue base would
      contract significantly. ForecastEx's lowest-fee competitive positioning signals that margin
      compression may follow market maturation.
    claimRefs: [CM023, CM024, CM025, CM026, CM027, CM028, CM029, CM030, CM031, CM032, CM034, CM035, CM036, CM040]
    tableRefs: [TM004]
    figureRefs: [FM004]

  - id: evidence-gaps-and-contradictions
    title: Evidence gaps and sizing contradictions
    body: >-
      Three structural contradictions undermine simple market sizing. First, the AGA January 2026
      joint letter characterized prediction market platforms—including Kalshi—as "unregulated" despite
      Kalshi's active CFTC DCM status. This reflects the AGA's competitive and political interest in
      restricting the category rather than a legal determination, but illustrates that the market
      definition is contested between the federal regulator and the incumbent gaming industry.

      Second, no independent analyst has produced a TAM specifically for US CFTC-regulated event
      contracts. Publicly accessible global prediction market estimates from analyst research firms use
      broader, non-comparable market definitions, aggregate both regulated and unregulated platforms,
      and are either paywalled or lack disclosed methodology. Any investor model relying on such
      estimates as a Kalshi TAM is misusing the data.

      Third, Kalshi's $22B valuation at $263.5M in 2025 revenue implies an 84x revenue multiple. The
      CME Group trades at roughly 20-25x earnings. The Kalshi premium implies not just growth but
      category-creating scale—a market that does not yet exist at the required size. The growth
      trajectory is real (cumulative volume roughly doubled in nine months through March 2026) but the
      endpoint is unverified. ForecastEx's market share, international revenue, and the impact of
      potential sports contract restrictions are all undisclosed, leaving the market structure
      incompletely defined from public information alone.
    claimRefs: [CM010, CM011, CM014, CM030, CM031, CM037, CM038, CM039, CM040]

