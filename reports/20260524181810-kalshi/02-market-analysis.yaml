  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: >-
        An independent analyst report specifically sizing the US CFTC-regulated event contract
        market as a standalone segment with disclosed methodology, geography, and time horizon.
      whyItMatters: >-
        Without a credible standalone TAM, Kalshi's $22B valuation cannot be benchmarked against
        realistic market capture rates, leaving the growth-assumption validation entirely dependent
        on management assertions and implied multiples.
      diligencePath: >-
        Commission a targeted market study from a reputable analyst firm, or request Kalshi
        management to share any internal market sizing analyses conducted for fundraising purposes.
      relatedQuestionRefs: [QM006, QM024]

    - type: private-evidence-only
      severity: material
      topic: competitive-landscape
      missingEvidence: >-
        ForecastEx trading volume, fee revenue, and market share relative to Kalshi as of May 2026.
      whyItMatters: >-
        As the only competing CFTC DCM, ForecastEx's market share determines how defensible
        Kalshi's regulatory first-mover advantage is in practice. Without this data, competitive
        intensity in the core regulated segment is unquantified.
      diligencePath: >-
        Request ForecastEx volume and revenue data through primary diligence, or monitor CFTC
        market surveillance and position reports for DCM-level data disclosures.
      relatedQuestionRefs: [QM024]

    - type: private-evidence-only
      severity: material
      topic: growth-constraints
      missingEvidence: >-
        A quantified estimate of the US user base volume at risk if a federal appellate court rules
        against CFTC preemption in one or more active state lawsuits.
      whyItMatters: >-
        Understanding the maximum downside scenario from a preemption loss is critical to assessing
        the binary regulatory risk embedded in Kalshi's $22B valuation. Population at risk varies
        substantially by state and jurisdiction.
      diligencePath: >-
        Model state-level volume contribution using IP geolocation inference or request Kalshi
        management to provide a state-level volume breakdown in diligence.
      relatedQuestionRefs: [QM023]

    - type: private-evidence-only
      severity: minor
      topic: market-sizing
      missingEvidence: >-
        Kalshi's breakdown of trading volume and fee revenue by international versus US users
        following the 140+ country launch in 2025.
      whyItMatters: >-
        International revenue is entirely unquantified; if substantial, it diversifies regulatory
        risk and expands the market thesis; if negligible, the international launch has not yet
        contributed materially to the growth story.
      diligencePath: >-
        Request international revenue and volume figures from Kalshi management in formal
        diligence; cross-check against any regulatory filings or public disclosures.
      relatedQuestionRefs: [QM027]

    - type: access-blocked
      severity: material
      topic: market-sizing
      missingEvidence: >-
        Grand View Research, Mordor Intelligence, and Fortune Business Insights global prediction
        market TAM reports, which are paywalled or not accessible.
      whyItMatters: >-
        These are the most-cited analyst estimates for prediction market TAM. Their methodology,
        geographic scope definition, and segment inclusions determine whether they can be applied
        as a market benchmark for Kalshi, even as a rough proxy.
      diligencePath: >-
        License the relevant analyst reports, or request Kalshi management to share copies of
        analyst reports they have procured for fundraising or strategy work.
      relatedTableRefs: [TM002]
