callouts:
  - calloutType: insight
    title: No standalone US event contract TAM exists in public research
    body: >-
      Every market sizing figure applied to Kalshi uses a proxy: adjacent gaming GGR, global
      prediction market estimates, or implied valuation multiples. Investors should note that
      publicly available analyst TAM reports capture global regulated and unregulated prediction
      markets, not the US CFTC-regulated market specifically. The most defensible sizing anchor is
      Kalshi's own $263.5M in 2025 fee revenue and $50B+ annualized volume, with upside contingent
      on CFTC preemption court outcomes and a PASPA-analog legitimacy-unlock dynamic.
    claimRefs: [CM010, CM011, CM013, CM014]

  - calloutType: risk
    title: 89% sports revenue concentration amplifies regulatory risk
    body: >-
      Kalshi's 2025 revenue mix—approximately 89% from sports event contracts—creates a
      single-product dependency directly exposed to two simultaneous risks: AGA-lobbied legislative
      restrictions on sports contracts, and CFTC rulemaking changes triggered by the NHL MOU or
      Congressional pressure. ForecastEx's lower-fee model signals that even if sports contracts
      survive unscathed, margin compression is a structurally plausible outcome as competition
      intensifies. Diversification toward economic, political, and international markets is
      strategically important but undemonstrated at comparable revenue scale.
    claimRefs: [CM033, CM034, CM035, CM039]

