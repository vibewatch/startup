  claims:
    - id: CM001
      statement: >-
        CFTC-regulated event contracts are binary financial instruments priced between $0.01 and
        $0.99 that settle at $0 or $1 depending on the outcome of a specified real-world event,
        traded on Designated Contract Markets under the Commodity Exchange Act.
      type: observed
      topic: market-boundary
      sourceRefs: [SM009, SM010]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM001, QM003]

    - id: CM002
      statement: >-
        As of May 2026, KalshiEx LLC and ForecastEx LLC are the only two entities holding both
        DCM and DCO registrations from the CFTC to operate prediction market exchanges in the
        United States.
      type: observed
      topic: market-structure
      sourceRefs: [SM009, SM004]
      confidence: high
      freshness: current
      answersQuestionRefs: [QM001]

    - id: CM003
      statement: >-
        US regulated sports betting operates through fixed-odds sportsbooks that take positions
        against bettors at predetermined odds, whereas CFTC event contracts match buyers and sellers
        at a market-clearing price without the platform taking a position—a fundamental structural
