  - id: regulatory-and-product-comparison
    title: Regulatory Status and Product Comparison
    body: >-
      The regulatory stratification of the prediction market landscape is the single most consequential
      competitive axis. A CFTC DCM license provides Kalshi with federal preemption over state gambling
      laws, access to registered Futures Commission Merchants (FCMs) for distribution, and legal
      certainty for institutional and retail participation. ForecastEx holds the same DCM designation
      but has not disclosed market breadth, volume, or user data. PredictIt's new exchange license
      (granted September 2025) is narrower in scope — political markets only — and its prior no-action
      letter constrained both position sizes and participant count for a decade.

      Polymarket operates without a DCM license. Its return to US users in December 2025 followed the
      Trump administration's CFTC dropping an investigation, not a formal regulatory approval. Polymarket
      has not applied for DCM designation. Its crypto-native architecture (USDC collateral on Polygon
      blockchain) is both its technical differentiator and its regulatory exposure — it settles outside
      traditional financial infrastructure and cannot access US FCM distribution channels the same way
      Kalshi can.

      On product breadth, Kalshi offers the widest category coverage among US-accessible platforms:
      sports outcomes, political and election events, economic indicators (CPI, Fed rate decisions),
      weather, entertainment, and cryptocurrency milestones. ForecastEx's public materials reference
      economic, climate, and political categories only — sports are not mentioned in its product pages.
      PredictIt is structurally limited to political and electoral outcomes by its exchange license
      terms. The IEM operates electoral and economic futures only, capped at $500.

      Pricing structure differs materially. Kalshi charges a transaction fee on each trade (the
      company has not published a single universal fee schedule, but disclosed $263.5 million in fee
      revenue on $50 billion+ annualized volume, implying an effective take rate of approximately
      0.5%). ForecastEx publicly claims "lowest fees than any of the competitors" and also passes
      interest earned on collateral to members via an "Incentive Coupon," creating a net-negative
      effective fee in some scenarios. Polymarket's exact fee structure is not publicly documented
      as a fixed rate; it uses a CLOB model with market-maker incentives.

      Liquidity differences are currently large but informational. Kalshi reports $52 billion+
      cumulative contract volume and $1 billion+ weekly volume by December 2025. Polymarket claimed
      to be the "world's largest prediction market" and attracted $3.3 billion on the 2024
      presidential race alone. ForecastEx and PredictIt (new exchange) have disclosed no comparable
      volume figures as of May 2026.
