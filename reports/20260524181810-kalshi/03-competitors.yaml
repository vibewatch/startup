  - id: unresolved-competitive-diligence-gaps
    title: Unresolved Competitive Diligence Gaps
    body: >-
      Several competitive questions remain open as of May 2026 and materially affect Kalshi's
      long-term competitive position assessment. First, ForecastEx's actual volume, user count,
      and distribution partnerships are entirely undisclosed. Without this data, it is impossible
      to determine whether ForecastEx represents a nascent existential fee-competitive threat or
      an effectively dormant DCM. A ForecastEx-Robinhood partnership, for example, would
      immediately replicate Kalshi's most important distribution advantage.

      Second, the permanence of Polymarket's US regulatory accommodation is unclear. The current
      permissive posture depends on the Trump administration's CFTC not reimposing the consent-
      order restriction. A future CFTC administration could re-restrict US access, reverting
      Polymarket to its 2022–2025 non-US status. Alternatively, Polymarket could seek a DCM
      license, supported by ICE's institutional standing and capital. The outcome of Polymarket's
      regulatory path defines whether it is a permanent or transient competitive threat in the
      US regulated market.

      Third, PredictIt's exchange launch (scheduled October 2025) has not produced disclosed
      volume or user metrics. Whether Aristotle International successfully scaled from the
      constrained no-action letter model to a full exchange is unknown.

      Fourth, sports-betting operator strategic response is unquantified. The AGA's lobbying effort
      is documented, but no major sports-betting operator has publicly filed for a CFTC DCM license
      or partnered with an event contract platform in a way that would directly compete with
      Kalshi's sports contract business. The likelihood and timing of operator market entry remain
      open diligence items.

      Fifth, the cost and pricing impact of ForecastEx's Incentive Coupon model on Kalshi's pricing
      power has not been tested at scale. If ForecastEx attracts meaningful liquidity, Kalshi may
      face pressure to reduce effective fees, compressing the $263.5M revenue base.
    claimRefs:
      - CP040
      - CP041
      - CP042
      - CP043

