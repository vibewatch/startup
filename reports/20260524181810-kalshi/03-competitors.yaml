callouts:
  - calloutType: strength
    title: DCM + Robinhood distribution creates a moat no competitor currently matches
    body: >-
      Kalshi is the only CFTC DCM with demonstrated large-scale brokerage distribution: Robinhood's
      25–35% of daily volume share is unmatched by any competing DCM as of May 2026. ForecastEx has
      the same regulatory standing but zero confirmed distribution; PredictIt covers only political
      markets. This combination — regulatory primacy and brokerage reach — is the core competitive
      advantage that justifies Kalshi's premium valuation relative to Polymarket's crypto model.
    claimRefs: [CP031, CP032, CP034]

  - calloutType: risk
    title: Polymarket's regulatory thaw and ICE backing make it the most dangerous long-term threat
    body: >-
      Polymarket is the only competitor with the capital ($9B valuation, $2B ICE investment),
      global user base, and political connections (Trump Jr. advisory role) to potentially obtain
      regulatory standing in the US market. If Polymarket pursues and obtains a CFTC DCM license
      supported by ICE's institutional infrastructure, it would combine global liquidity with
      regulatory legitimacy — a combination that would challenge Kalshi on every competitive axis
      simultaneously. This risk is not imminent but is structurally plausible within a 2–3 year
      horizon.
    claimRefs: [CP020, CP021, CP022, CP023, CP024]

  - calloutType: risk
    title: AGA lobbying creates a durable external competitive threat via state and federal legislatures
    body: >-
      The American Gaming Association's explicit framing of prediction markets as "unregulated
      sports betting" — despite Kalshi's CFTC DCM status — and its documentation of state tax
      revenue losses on its public-facing gaming map represent a well-funded, organized effort to
      legislatively restrict or tax prediction market platforms. This is not a direct product
      competitor but a structural threat to the regulatory environment that enables Kalshi's
      business model. The AGA's $329 billion annual economic impact figure and 1.8 million jobs
      supported give it significant political influence relative to Kalshi's nascent lobbying
      capacity.
    claimRefs: [CP007, CP008, CP028, CP029, CP038]

