  - id: competitor-strengths-weaknesses
    title: Competitor Profiles — Strengths, Weaknesses, and Response Dynamics
    body: >-
      Polymarket is Kalshi's most threatening competitor by capital and brand recognition but its most
      legally precarious one. Its $8–9 billion valuation and ICE investment give it balance sheet
      firepower and a potential bridge to institutional infrastructure. Donald Trump Jr.'s advisory
      role and 1789 Capital's investment have created political cover that contributed to the
      regulatory thaw enabling US re-entry. However, Polymarket's crypto-native model requires users
      to hold and manage USDC, creating friction for mainstream retail users. Its track record of
      FBI investigation of its CEO (November 2024, charges dropped July 2025), numerous insider
      trading controversies, allegations of market manipulation, and documented publication of
      hundreds of false social media posts (per NYT review) create reputation and compliance risks
      that regulated FCM partners could not accept. The Wall Street Journal described its markets as
      a "legal and ethical grey area." If Polymarket pursues a DCM license or an ICE-facilitated
      regulatory path, the competitive threat escalates significantly. The likely near-term response
      from Polymarket is not to replicate Kalshi's regulated model but to grow market volume and
      brand reach while the regulatory environment remains permissive.

      PredictIt is an asymmetric threat: it has the regulatory credential (exchange + clearinghouse
      CFTC approval, September 2025) but lacks sports — which is 89% of Kalshi's 2025 revenue.
      PredictIt's nonprofit roots and political-market focus mean its user base is self-selected
      toward policy-engaged users rather than sports fans. The removal of the 5,000-person cap and
      the $3,500 position ceiling creates room to grow from its constrained prior state, but the
      sports market requires different content, partnerships, and liquidity dynamics that PredictIt
      has not signaled intent to pursue. The principal response risk is that PredictIt expands into
      sports or partners with a sports-data provider, shifting from complement to direct competitor.

      ForecastEx is the most direct structural competitor — same regulatory framework, same DCM
      designation — and its aggressive fee positioning (lowest fees, interest pass-through) is a
      deliberate challenge to Kalshi's pricing power. However, ForecastEx has disclosed no volume,
      no user count, and no distribution partnerships as of May 2026. If ForecastEx cannot attract
      FCM partners, its low-fee positioning is moot. The risk is that ForecastEx attracts an
      institutional backer or distribution partner that provides the liquidity injection needed to
      make its fee advantage competitive.

      Sports-betting operators present the largest total substitute pool but the lowest structural
      overlap. DraftKings, FanDuel, BetMGM, and Caesars aggregate more than $13 billion in annual
      GGR from US users who are behaviorally adjacent to Kalshi's sports contract buyers. These
      operators are licensed in 38 states under fixed-odds sportsbook models that differ from
      event contracts — the operator takes the counter-position, and the buyer cannot trade out of
      a position before resolution. The AGA has characterized prediction markets as "unregulated
      sports betting" and lobbied state and federal authorities to restrict or impose state taxes
      on prediction market platforms, directly threatening Kalshi's tax treatment and competitive
      position. The most likely response from sports-betting operators is continued lobbying rather
      than product replication, but some operators (notably via FCM structures) could enter the
      event contract space directly if the regulatory environment shifts.
