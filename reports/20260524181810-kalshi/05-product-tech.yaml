  - id: product-gaps-incidents-risks
    title: Product Gaps, Incidents, and Strategic Concerns
    body: >-
      Several structural product and technology gaps are material to a full assessment of
      Kalshi's platform. First, the absence of official league data licenses from the NFL, NBA,
      and MLB (all three submitted letters to the CFTC in 2025 expressing concerns about
      Kalshi's sports markets) means Kalshi cannot use official team names, logos, or verified
      real-time scores in its market displays. Instead, sports markets use generic city names
      such as "Pro Football Champion: Chicago" rather than "Chicago Bears win Super Bowl."
      DraftKings and FanDuel, which have full league data agreements, represent a significant
      user-experience advantage on this dimension.

      Second, the Khamenei settlement controversy in early 2026 exposed contractual ambiguity.
      Kalshi's policy against "death-contingent" contracts was not clearly discerned by users
      who bet on whether Khamenei would be "out of office," and the $77 million frozen payout
      created a reputational incident that echoes the kind of settlement risk inherent in
      non-standardized contract language. This is an endemic challenge for novel asset classes
      where contract language lacks the decades of legal interpretation that commodity and
      equity derivatives carry.

      Third, no verified mobile app listing was accessible from either the Apple App Store or
      Google Play during this research run, raising a question about app distribution
      continuity or possible delisting. If confirmed, this would represent a significant user-
      acquisition and retention gap given that mobile is the primary trading surface for
      retail participants in competitive sportsbook and fintech markets.

      Fourth, the platform's rate-limiting of its own website (kalshi.com returning 429
      errors during research) suggests Vercel-based CDN/WAF configuration that may constrain
      discoverability and scraping-based integrations — a minor product issue but one that
      affects developer-ecosystem trust if API documentation or public market data is
      similarly restricted.

      Fifth, congressional and state-level legal risk is materially elevated as of May 2026.
      More than 10 bills have been introduced since January 2026, including the bipartisan
      PREDICT Act, the End Prediction Market Corruption Act, and the Prediction Markets Are
      Gambling Act — any one of which could materially constrain or eliminate Kalshi's sports
      market product line if enacted. At least six states (Massachusetts, Arizona, Nevada,
      Ohio, Wisconsin, Michigan) have taken active legal action, and the U.S. Senate banned
      senators and staff from using prediction markets in May 2026. While Kalshi's CFTC DCM
      status provides federal preemption arguments, conflicting district court rulings (Ohio
      siding against Kalshi in March 2026; Nevada issuing a 14-day restraining order) create
      a patchwork operating environment that requires ongoing geofencing updates and legal
      monitoring.
    claimRefs:
      - CE023
      - CE029
      - CE032
      - CE033
      - CE040

callouts:
  - calloutType: strength
    title: Mature REST/WebSocket API with Published OpenAPI Specs
    body: >-
      Kalshi's developer documentation at docs.kalshi.com provides OpenAPI 3.0 and AsyncAPI
      specifications, a Python SDK on PyPI, GitHub starter code, a demo environment, and FIX
      protocol support via its QuickFIX/Go fork — a developer surface unusually comprehensive
      for a CFTC-regulated exchange of Kalshi's age, directly enabling algorithmic trading,
      brokerage integrations, and third-party applications.
