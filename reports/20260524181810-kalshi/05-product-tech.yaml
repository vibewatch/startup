  - id: developer-api-integration
    title: Developer API and Integration Surface
    body: >-
      Kalshi has built one of the most accessible developer surfaces of any CFTC-regulated
      exchange. The official API documentation portal at docs.kalshi.com provides a complete
      OpenAPI 3.0 specification and an AsyncAPI specification for the WebSocket API, both
      downloadable for code generation. The portal includes getting-started guides, an API key
      management walkthrough, a demo environment reference, WebSocket streaming tutorials,
      a glossary, and a changelog — a professional developer-documentation stack comparable
      to fintech API leaders. Authentication uses an API key plus RSA or ECDSA private-key
      signature, with the request signed using three headers: kalshiAccessKey,
      kalshiAccessSignature, and kalshiAccessTimestamp.

      Rate limits operate on a per-API-tier token-bucket system; the default cost is 10 tokens
      per request, and the API documentation exposes tier-specific limits via a dedicated
      endpoint (GET /account/limits). Higher-volume institutional tiers are available, and the
      endpoint returns a structured response with usage_tier, read, and write limits. The
      API specification version 3.19.0 covers 14 functional groups: account, api-keys, orders,
      order-groups, portfolio, communications (RFQ), multivariate, exchange, live-data,
      markets, milestone, search, incentive-programs, FCM (futures commission merchant member
      endpoints), events, and structured-targets.

      On the SDK front, Kalshi publishes kalshi-python (v2.1.4) to PyPI, generated from its
      OpenAPI spec using OpenAPI Generator v7.15.0, supporting Python 3.9 and above. The
      package includes a KalshiClient that wraps authenticated calls to the production endpoint
      (https://api.elections.kalshi.com/trade-api/v2). On GitHub under the Kalshi organization,
      the kalshi-starter-code-python repository (94 stars, 69 forks as of this run) provides
      minimal example code for authenticated API access; and tools-and-analysis (19 stars, 10
      forks) hosts community-contributed analyses that use Kalshi market data for S&P/CPI
      correlation studies and consensus measurement. Kalshi also forks and maintains QuickFIX/Go
      (353 forks in the original repo), the leading open-source Go FIX Protocol library,
      supporting FIX 4.0 through FIX 5.0 SP2 — a clear signal that Kalshi is building toward
      institutional-grade FIX connectivity for high-frequency traders and algorithmic desks.

      For brokerage integration, Kalshi's Series E announcement explicitly named "add
      brokerages" as a capital use priority. The Robinhood integration (live from early 2025)
      and Webull partnership serve as public reference implementations. Kalshi also offers
      blockchain deposit rails: Solana deposits up to $500,000, Bitcoin, USDC, and Worldcoin.
      A developer grant program on Solana and Base (Coinbase's L2) targets third-party
      application builders. Despite this robust API surface, the mobile app store presence is
      unconfirmed from public listings, and no official SDK is published for languages other
      than Python, leaving Go and JavaScript developers reliant on community wrappers or
      direct OpenAPI codegen.
