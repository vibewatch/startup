  - id: trust-compliance-operational-controls
    title: Trust, Compliance, and Operational Controls
    body: >-
      Kalshi's compliance and trust architecture rests on its CFTC Designated Contract Market
      license, which subjects it to CFTC market surveillance, rule-enforcement obligations,
      and reporting requirements — the same regulatory tier as CME Group. As a DCM, Kalshi is
      obligated to police market manipulation and insider trading, a responsibility explicitly
      reinforced by CFTC Director of Enforcement David Miller's April 2026 statement designating
      DCMs as the "first line of defense." Kalshi Exchange Rule 5.17(z) codifies the insider
      trading prohibition, barring any trader who is a "decision maker" or who has direct or
      indirect influence over an event's outcome from trading related contracts.

      In April 2026, Kalshi published three disciplinary notices against political candidates
      who traded on their own elections, demonstrating active enforcement even for small-dollar
      violations (penalties ranging from $540 to $6,229). The CFTC simultaneously filed its
      first-ever insider trading complaint involving event contracts. Kalshi explicitly prohibits
      war markets, assassination markets, and death-contingent contracts by policy. In early
      2026, this policy was tested when Kalshi froze a market tied to Iranian Supreme Leader
      Khamenei's status after his death, withholding approximately $77 million in winnings from
      traders who had bet he would be "out" — an outcome that drew significant user criticism
      and illustrates the opacity risks in contract language and resolution methodology.

      Geofencing is deployed as a technical compliance mechanism. Following a January 2026
      Massachusetts Superior Court preliminary injunction, Kalshi implemented state-level
      geofencing to block Massachusetts residents from accessing sports-related markets.
      This geofencing capability (confirmed by Wikipedia's citation of the court order)
      demonstrates the platform's ability to granularly restrict market access by geography
      but adds engineering overhead as each state legal challenge potentially requires a new
      filter rule.

      On data integrity, a Federal Reserve working paper published in February 2026 found
      Kalshi's probability signals matched or outperformed Wall Street tools for CPI and
      interest rate forecasts, lending external academic credibility. CNN and CNBC's adoption
      of Kalshi data in live coverage further corroborates its data-quality perception.
      However, critics including scholars cited in Wikipedia challenge whether Kalshi
      efficiently aggregates information, and The Atlantic's March 2026 piece specifically
      argues that prediction markets encourage insider trading and erode trust by financializing
      news events.

      Operationally, Kalshi's fund-segregation model mirrors a CFTC-regulated exchange: user
      funds are held separately from operational capital, as required by DCM rules. KYC/AML
      processes are in place as required by CFTC regulations, though specific implementation
      details are not publicly disclosed. The absence of public uptime SLAs, historical
      incident disclosures, or external security audits is a material diligence gap for
      institutional counterparties.
