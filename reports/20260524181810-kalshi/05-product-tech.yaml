  - calloutType: risk
    title: No League Data Licenses and Settlement Ambiguity Risk
    body: >-
      The absence of official data agreements with the NFL, NBA, and MLB constrains Kalshi's
      sports UX and keeps it legally exposed; separately, the $77 million frozen Khamenei
      market payout exposed contract-language and settlement-methodology ambiguity that could
      undermine user trust in edge cases — a structural challenge for any binary exchange
      operating in novel territory.
    claimRefs:
      - CE029
      - CE032
      - CE033

  - calloutType: risk
    title: Geofencing Overhead and Multi-State Regulatory Patchwork
    body: >-
      Kalshi is enforcing state-level geofencing following the Massachusetts injunction and
      faces active litigation in at least six states as of May 2026. Each new adverse state
      ruling requires a new geographic filter, adds engineering overhead, and reduces the
      platform's addressable user pool — particularly significant given that California and
      Texas (71 million combined residents) have not been ruled favorably.
    claimRefs:
      - CE023
      - CE034

