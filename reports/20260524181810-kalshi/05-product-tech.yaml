acknowledgedWarnings:
  - dimension: paywallRisk
    reason: >-
      Two official Kalshi sources (kalshi.com/about and kalshi.com/regulatory/notices) returned
      HTTP 429 rate-limited responses via Jina reader proxy during this research run; these are
      tagged rate-limited and replaced with accessible alternative official sources (docs.kalshi.com
      and CFTC filings) for all substantive claims. The overall restricted share for this chapter
      remains below 30%.
  - dimension: tableNotes
    reason: >-
      TE004 (Trust/Compliance Controls Table) is a factual enumeration of control status from
      primary regulatory and official sources; each cell is a known fact, regulatory requirement,
      or sourced claim with no estimation. Notes field acknowledges data sourcing convention.
