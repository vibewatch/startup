          label: Susquehanna Investment Group
          detail: Market maker; provides liquidity under Market Maker Program (May 2025+)
        - id: d6
          label: Cloud / CDN (Vercel)
          detail: Hosts kalshi.com web application; WAF/rate-limiting in place
        - id: d7
          label: Solana / Base / Bitcoin Networks
          detail: Blockchain deposit rails; custody and on-ramp for crypto users
        - id: d8
