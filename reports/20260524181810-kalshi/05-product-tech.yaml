chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Kalshi delivers binary event contracts across web, API, and embedded broker surfaces
    on a CFTC-regulated exchange infrastructure that processed $2 billion per week at peak in
    early 2026. Its REST/WebSocket API (v3.19.0) with published OpenAPI and AsyncAPI specs,
    Python SDK, and a FIX-protocol fork for institutional connectivity make Kalshi the most
    accessible developer-facing U.S. event-contract exchange; a Market Maker Program launched
    in May 2025 brought in Susquehanna and Kalshi's own affiliated trading desk. Structural
    product gaps include no official league data/logo licenses from the NFL, NBA, or MLB;
    a settlement controversy that froze $77 million in Khamenei-market winnings; and an active
    geofencing requirement following the January 2026 Massachusetts injunction that underscores
    the platform's precarious multi-jurisdictional operating posture.

sections:
  - id: product-surface-user-workflows
    title: Product Surface and User Workflows
    body: >-
      Kalshi's core product is the binary event contract: a Yes or No share priced between
      $0.01 and $0.99 that reflects the market's estimated probability of a specified
      real-world outcome. At resolution, the winning side pays $1.00 and the losing side pays
      $0.00 per contract. Users interact with the exchange through three primary surfaces.
      The web application, served from kalshi.com, provides market browse, order placement,
      portfolio management, and deposit/withdrawal functionality. A mobile application for
      iOS and Android extends the same core workflow; while Kalshi references a mobile app,
      no verified active App Store or Google Play Store listing was accessible during this
      research run. Third, the public REST and WebSocket APIs enable algorithmic and
      programmatic trading, constituting a distinct user segment of quantitative traders and
      developers.

      The typical retail user journey begins with account creation and an ACH deposit, followed
      by browsing the event catalog across six major categories: sports (dominant, approximately
      89–95% of fee revenue in 2025), macroeconomic indicators (CPI, Federal Reserve rate
      decisions, GDP), politics, weather, entertainment, and cryptocurrency milestones.
      A user selects a market, reviews the current order book and probability, and places a
      limit or market order on the Yes or No side. Orders can be left-to-fill (good-till-
      canceled) or designated immediate-or-cancel. At market resolution, settlement is
      automatic and instantaneous — Kalshi pays $1.00 per winning contract without requiring
      manual claim submission.

      Beyond its own interfaces, Kalshi is embedded in two major brokerage platforms as of
      2025. Robinhood launched its Prediction Markets Hub using Kalshi as the underlying
      exchange in early 2025, with Robinhood users representing 25–35% of Kalshi's daily
      trading volume on active sports days by October 2025. Webull similarly integrated Kalshi
      event contracts into its retail trading application. Kalshi characterizes its brokerage
      API strategy as "add brokerages" in its stated use-of-proceeds for its Series E round,
      and Reuters confirmed this as a stated capital allocation priority.

      Market categories span dozens of simultaneous events. Sports contract descriptions use
      generic city names (e.g., "Pro Football Champion: Chicago") rather than official team
      names and logos, reflecting the absence of league data licenses from the NFL, NBA, and
      MLB. The Federal Reserve and Federal Reserve Bank data feeds directly underpin
      macroeconomic settlement. For prediction accuracy, a Federal Reserve working paper
      published in February 2026 found that Kalshi's probability data matched or outperformed
      traditional Wall Street forecasting tools for inflation and interest rate outcomes;
      CNN and CNBC now publish Kalshi probability data alongside polls and expert forecasts.

      Internationally, the platform expanded to 140-plus countries in October 2025 following
      its $300 million Series D, restricting 38 jurisdictions including Canada, the United
      Kingdom, France, Singapore, and Russia. International users access the same platform
      features as U.S. customers. In cryptocurrency on-ramp, Kalshi accepts Solana deposits
      up to $500,000 and supports Bitcoin, USDC, and Worldcoin through blockchain partnership
      integrations.
