figures:
  - id: FE001
    title: Kalshi Exchange Platform Architecture Stack
    type: stack
    layout: standard
    summary: >-
      Layered view of Kalshi's technical architecture from user interfaces down through
      exchange infrastructure and compliance controls.
    data:
      layers:
        - label: User Interfaces
          detail: "Consumer-facing surfaces enabling retail and embedded trading: web platform, mobile app, and broker-embedded hubs."
          items:
            - Web platform (kalshi.com / Vercel CDN)
            - Mobile app (iOS / Android — active listing unverified as of May 2026)
            - Robinhood Prediction Markets Hub (embedded; ~25-35% of sports volume)
            - Webull event-contract integration (embedded; 2025)
        - label: API Layer
          detail: "Programmatic access surface for algorithmic traders and integrators: REST, WebSocket, demo sandbox, and institutional FIX protocol."
          items:
            - "REST API v3.19.0 (external-api.kalshi.com/trade-api/v2)"
            - WebSocket API (real-time streaming; AsyncAPI spec published)
            - Demo / sandbox (demo-api.kalshi.co/trade-api/v2)
            - FIX Protocol layer (Kalshi fork of QuickFIX/Go; FIX 4.0–5.0 SP2)
        - label: Exchange Engine
          detail: "Core matching and pricing infrastructure: central limit order book, order types, market-maker liquidity, and fee model."
          items:
            - Central Limit Order Book (CLOB); up to 200K open orders per user
            - "Order types: limit, market, IOC, GTC / expiring-GTT"
            - Market Maker Program (Susquehanna, Kalshi Trading; since May 2025)
            - Quadratic taker-fee formula; maker fees on sports markets
        - label: Settlement and Oracle
          detail: "Automatic binary settlement layer that resolves contracts to $1.00 or $0.00 based on external oracle data; includes state-level access control."
          items:
            - "Binary settlement engine ($1.00 YES / $0.00 NO per contract at resolution)"
            - External data oracles (official stats, news wire, regulatory releases)
            - Geofencing layer (IP-based state market access control)
        - label: Compliance and Custody
          detail: "Regulatory and custody controls required by CFTC DCM license: market surveillance, fund segregation, KYC/AML, and insider-trading enforcement."
          items:
            - CFTC DCM license (since Nov 2020; same tier as CME Group)
            - Market surveillance program (Rule 5.17(z) insider-trading enforcement)
            - Fund segregation (CFTC DCM requirement; user funds held separately)
            - KYC / AML processing
        - label: Developer and Integration Tooling
          detail: "Developer ecosystem layer: spec-driven SDKs, GitHub repos, and blockchain deposit rails enabling third-party integrations and on-ramps."
          items:
            - OpenAPI 3.0 spec (downloadable from docs.kalshi.com)
            - AsyncAPI spec (WebSocket streaming)
            - Python SDK (kalshi-python v2.1.4 on PyPI; OpenAPI Generator v7.15.0)
            - GitHub repos (starter code 94★; tools-and-analysis 19★; QuickFIX fork)
            - Blockchain deposit rails (Solana ≤$500K, Bitcoin, USDC, Worldcoin)
    approximationNotes: >-
      Technology stack below API layer (cloud provider, database, message broker, frontend
      framework) inferred from public developer documentation and GitHub repo analysis;
      no internal infrastructure disclosure available.
    claimRefs:
      - CE002
      - CE003
      - CE005
      - CE007
      - CE009
      - CE011
      - CE012
      - CE013
      - CE019
      - CE027

  - id: FE002
    title: Kalshi Retail User Trading Workflow
    type: flow
    layout: standard
    summary: >-
      End-to-end journey of a retail user from account creation through trade execution and
      settlement on Kalshi.
    data:
      nodes:
        - id: n1
          label: Account Creation & KYC
          detail: Email signup, identity verification, CFTC-required KYC/AML screening
        - id: n2
          label: Fund Deposit
          detail: ACH bank transfer, or crypto rails (Solana ≤$500K, Bitcoin, USDC, Worldcoin)
        - id: n3
          label: Browse Event Catalog
          detail: 6 categories — sports, macroeconomic, politics, weather, entertainment, crypto
        - id: n4
          label: Select Market & Review Order Book
          detail: View Yes/No prices ($0.01–$0.99), current probability, open interest
        - id: n5
          label: Place Order
          detail: Limit or market order; Yes or No side; IOC or GTC time-in-force
        - id: n6
          label: Order Matching
          detail: CLOB matches buyer and seller; maker/taker fee charged on execution
        - id: n7
          label: Position Monitoring
          detail: Portfolio dashboard; real-time updates via WebSocket push
        - id: n8
          label: Market Resolution
          detail: Kalshi resolves based on external oracle (e.g., official game result, data release)
        - id: n9
          label: Automatic Settlement
          detail: Winning side credited $1.00/contract; losing side $0.00; instant payout
        - id: n10
          label: Withdrawal
          detail: USD wire / ACH back to bank; or crypto withdrawal
    claimRefs:
      - CE001
      - CE007
      - CE017
      - CE019
      - CE022

  - id: FE003
    title: Critical Dependency Map for Kalshi's Exchange Operations
    type: dag
    layout: wide
    summary: >-
      Key external dependencies that Kalshi's exchange operations rely on, including
      regulatory, data, technology, and distribution relationships.
    data:
      nodes:
