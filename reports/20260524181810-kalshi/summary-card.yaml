summary:
  headline: >-
    Kalshi's CFTC regulatory moat and explosive revenue trajectory are real, but the $22B Series F price embeds a
    favorable legal outcome for sports event contracts that is not yet in evidence, making the valuation stretched and
    the appropriate posture research-more until key litigation catalysts resolve.
