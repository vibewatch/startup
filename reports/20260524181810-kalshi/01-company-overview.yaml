callouts:
  - calloutType: strength
    title: Regulatory moat is genuine and deep
    body: >-
      Kalshi's CFTC DCM status is not easily replicated: building a federally licensed derivatives
      exchange took over two years of regulatory engagement before 2020 approval and required
      winning a landmark lawsuit against the CFTC itself. As of May 2026, no U.S. competitor holds
      equivalent status for event contracts, and the Third Circuit's April 2026 ruling strengthens
      the legal basis for continued federal-only regulation.
    claimRefs:
      - CO003
      - CO004
      - CO010
      - CO044
  - calloutType: risk
    title: State-legal exposure is material and escalating
    body: >-
      Active litigation or enforcement actions in at least eight states, the first criminal
      prosecution of any CFTC-regulated exchange, and 10+ congressional bills introduced in
      early 2026 represent a genuine operating and existential risk to the sports-contract revenue
      base that produces ~89% of Kalshi's 2025 fee revenue. Federal injunctions have so far
      protected operations, but a Supreme Court ruling against federal preemption could require
      exit from multiple large states.
    claimRefs:
      - CO032
      - CO042
      - CO043
      - CO045
      - CO048
  - calloutType: insight
    title: Revenue concentration in sports contracts is the diligence pivot point
    body: >-
      Kalshi's platform originated as a hedging and information tool for economic and political
      outcomes, but by 2025 approximately 89% of revenue came from sports contracts—the exact
      category that state regulators are challenging as unlicensed sports betting. Diligence must
      separately assess the sports-contract revenue stream and the economic/political stream rather
      than treating the business as monolithic.
    claimRefs:
      - CO031
      - CO032
      - CO042
      - CO045
  - calloutType: assumption
    title: Valuation and revenue run-rate figures are single-source and unconfirmed
    body: >-
      The $22 billion valuation and the $1.5 billion revenue run-rate are drawn from single press
      reports (WSJ via Fintech Global; Yahoo Finance) and have not been confirmed in Kalshi's own
      press releases. These figures should be treated as directional reference points pending
      official company confirmation or data-room disclosure.
    claimRefs:
      - CO028
      - CO031
