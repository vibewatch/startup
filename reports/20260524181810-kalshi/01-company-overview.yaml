          detail: Joins YC winter 2019; raises seed capital; begins CFTC engagement.
          tone: positive
        - date: '2020-11'
          label: CFTC DCM designation
          detail: First U.S. exchange for event contracts to receive Designated Contract Market status.
          tone: positive
        - date: '2021-07'
          label: Platform launch
          detail: Public trading begins; initial markets cover economics, weather, and finance.
          tone: positive
        - date: '2022-08'
          label: CFTC blocks election contracts
          detail: Agency imposes a stay on political event contracts; begins public-interest review.
          tone: warning
        - date: '2023-11'
