  topStrengths:
    - >-
      Kalshi holds an effectively un-replicable U.S. regulatory asset—the only CFTC-designated DCM
      purpose-built for retail event contracts—a moat that took two-plus years of regulatory effort
      and a landmark 2024 court victory to construct and would take years for any competitor to
      replicate.
    - >-
      Revenue trajectory is exceptional: $263.5M in 2025 fee revenue growing to a reported $1.5B
      annualized run rate in approximately nine months represents one of the fastest-scaling fintech
      revenue ramps in recent history, driven by a 1,000%-plus volume increase year-over-year.
    - >-
      The Robinhood distribution partnership drives an estimated 25–35% of daily trading volume,
      dramatically reducing customer acquisition costs and accelerating the path to mainstream retail
      adoption; the Webull partnership and institutional channels (Tradeweb, Clear Street) add
      meaningful diversification.
    - >-
      CFTC federal preemption has prevailed at the circuit level (D.C. Circuit on election contracts;
      Third Circuit on sports contracts in April 2026), providing credible legal footing against
      state gaming regulators even as individual state battles continue.
    - >-
      A 5-million-plus user base, 121,000+ iOS ratings at 4.7 stars, expansion into 140-plus
      countries, and institutional market-maker participation confirm product-market fit across
      multiple customer segments and validate the exchange-grade infrastructure thesis.
  topRisks:
    - >-
      Approximately 89% of 2025 fee revenue came from sports event contracts challenged in at least
      seven states; a wave of state injunctions, adverse federal legislation, or an adverse SCOTUS
      cert grant could eliminate the majority of Kalshi's revenue base and collapse intrinsic value
      to the bear-case range of $1–3B.
    - >-
      The company has raised $2.8B with no disclosed audited financials, EBITDA margin, or cash
      runway; the $1.5B run rate is unverified from primary sources, the preference overhang across
      six institutional rounds at escalating valuations is unknown, and the cost of headcount growth
      from ~70 to 494 employees in six months is unquantified.
    - >-
      Robinhood distribution concentration—roughly 25–35% of daily volume from a single partner
      whose revenue share, exclusivity terms, and termination triggers are undisclosed—creates a
      binary execution risk and an information gap that prevents fully underwriting the distribution
      flywheel's durability.
    - >-
      The Arizona criminal information, Brown v. Kalshi federal class action, tribal lawsuits, and
      a House Oversight/Financial Services probe of KYC and trade-surveillance practices introduce
      direct settlement-integrity, platform-operating, and reputational risks beyond the state
      preemption battles.
    - >-
      Key-person concentration risk is high: CEO Tarek Mansour personifies Kalshi's regulatory
      narrative, investor relationships, and public profile; an unplanned leadership departure at a
      moment of maximum legal complexity and rapid hiring would be materially destabilizing.
  unresolvedGaps:
    - >-
      No audited FY2025 financials or Q1 2026 management accounts are publicly available; EBITDA
      margin, cash runway, and the operating cost impact of hiring from ~70 to 494 employees in
      six months cannot be assessed without this data.
    - >-
      Preference stack, liquidation waterfall, and per-share common-equity value across six
      institutional rounds at escalating valuations are undisclosed; the $2.8B preference overhang
      means common-equity intrinsic value at $22B cannot be calculated.
    - >-
      Robinhood partnership economics—revenue share percentage, exclusivity duration, and
      termination triggers—are not publicly available, making the durability of the primary
      distribution channel unverifiable.
    - >-
      Sports-contract revenue geography (by state and contract type) is not disclosed; sizing the
      bear-case revenue impact requires knowing which top-ten sports-betting states are most
      directly exposed to ongoing injunctions or legislative bans.
    - >-
      Federal preemption of state gaming laws over event contracts is not settled at the Supreme
      Court level; the pending Third Circuit appeal outcome and any SCOTUS cert grant remain the
      proximate binary catalysts that determine whether the bull or bear scenario prevails.
