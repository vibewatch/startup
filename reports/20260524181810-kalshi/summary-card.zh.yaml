summary:
  headline: Kalshi 的 CFTC 监管护城河和爆发式收入曲线都真实存在，但 $22B Series F 价格已经计入体育事件合约的有利法律结局；公开证据尚未支持这一点，因此估值偏高，在关键诉讼催化剂落地前更适合继续研究。
