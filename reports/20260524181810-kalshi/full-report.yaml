              - CV034
          - type: callout
            title: Pricing Requires Exchange-Like Multiple on a Legally Fragile Revenue Base
            body: >-
              At $22 billion against a $1.5 billion run rate, Kalshi prices at 14.7x revenue—a reasonable exchange
              multiple (CME trades at ~16x) but only defensible if the revenue base is as durable as CME's diversified,
              institutionally cleared derivatives business. Kalshi's revenue base is not. Investors pricing at Series F
              terms are implicitly assigning exchange-quality durability to sports-betting-quality legal exposure.
            calloutType: insight
            claimRefs:
              - CV010
              - CV011
              - CV012
