companyProfile:
  summary: >-
    Kalshi (KalshiEX LLC) is a New York-based CFTC Designated Contract Market and the only federally licensed U.S.
    exchange purpose-built for retail binary event contracts. Founded in 2018 by MIT classmates Tarek Mansour (CEO) and
    Luana Lopes Lara (COO), the company spent more than two years in regulatory preparation before receiving its DCM
    designation in November 2020 and publicly launching in July 2021. The exchange lets users trade binary yes/no
    contracts—priced $0.01–$0.99 and settling at $1.00 or $0.00—on outcomes spanning sports, macroeconomic indicators
    (CPI, Fed decisions), politics, weather, and entertainment. A landmark D.C. Circuit court victory on election
    contracts in September 2024 and the CFTC's withdrawal of its appeal in May 2025 unlocked explosive growth: $263.5
    million in fee revenue in 2025 and a reported $1.5 billion annualized run rate by March 2026. As of May 2026, Kalshi
    has raised approximately $2.8 billion across at least six institutional rounds at a reported $22 billion valuation,
    counts more than 5 million registered users, and distributes through Robinhood (25–35% of daily volume), Webull, and
    institutional platforms. The platform operates under sustained multi-front legal pressure: approximately 89% of 2025
    revenue came from sports event contracts challenged in at least seven states, and Kalshi faces an Arizona criminal
    information, a federal class action (Brown v. Kalshi), tribal lawsuits, and more than ten congressional bills
    targeting the category.
