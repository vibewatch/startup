  - id: FO002
    title: Company snapshot logic
    type: flow
    layout: standard
    summary: >-
      Kalshi's operating system connects its federal regulatory status to product, distribution, and capital, with
      state-legal exposure running as a structural constraint across the entire business.
    data:
      nodes:
        - id: dcm
          label: CFTC DCM status
          detail: >-
            Federal Designated Contract Market designation is the core regulatory moat; no U.S. competitor holds
            equivalent status for event contracts. Enables retail access and institutional participation.
          tone: positive
        - id: product
          label: Event contracts
          detail: >-
            Binary swaps on real-world outcomes in 3,500+ markets spanning politics, economics, sports, weather, and
            entertainment. Fee-per-trade revenue model.
          tone: positive
        - id: distribution
          label: Platform and brokerage access
          detail: >-
            Direct platform plus Robinhood and Webull integrations (contributing 25-35% of daily volume); USDC and
            crypto deposits; 140+ country international reach.
          tone: positive
        - id: capital
          label: Venture capital backing ($2.6B+)
          detail: >-
            Paradigm, Sequoia, a16z, Coatue, CapitalG, and others; $22B reported valuation (March 2026); fuels
            technology, regulatory compliance, and international expansion.
          tone: positive
        - id: legal_risk
          label: State-legal and legislative exposure
          detail: >-
            Active litigation or enforcement in 8+ states; 10+ congressional bills introduced since Jan 2026; Arizona
            criminal prosecution (enjoined May 2026); Maryland court denied Kalshi's injunction. Supreme Court review
            increasingly likely.
          tone: warning
      edges:
        - from: dcm
          to: product
        - from: product
          to: distribution
        - from: capital
          to: product
        - from: capital
          to: distribution
        - from: legal_risk
          to: distribution
        - from: legal_risk
          to: dcm
    approximationNotes: null
