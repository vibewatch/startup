      - number: '2.5'
        title: Evidence gaps and sizing contradictions
        blocks:
          - type: paragraph
            body: >-
              Three structural contradictions undermine simple market sizing. First, the AGA January 2026 joint letter
              characterized prediction market platforms—including Kalshi—as "unregulated" despite Kalshi's active CFTC
              DCM status. This reflects the AGA's competitive and political interest in restricting the category rather
              than a legal determination, but illustrates that the market definition is contested between the federal
              regulator and the incumbent gaming industry.

              Second, no independent analyst has produced a TAM specifically for US CFTC-regulated event contracts.
              Publicly accessible global prediction market estimates from analyst research firms use broader,
              non-comparable market definitions, aggregate both regulated and unregulated platforms, and are either
              paywalled or lack disclosed methodology. Any investor model relying on such estimates as a Kalshi TAM is
              misusing the data.

              Third, Kalshi's $22B valuation at $263.5M in 2025 revenue implies an 84x revenue multiple. The CME Group
              trades at roughly 20-25x earnings. The Kalshi premium implies not just growth but category-creating
              scale—a market that does not yet exist at the required size. The growth trajectory is real (cumulative
              volume roughly doubled in nine months through March 2026) but the endpoint is unverified. ForecastEx's
              market share, international revenue, and the impact of potential sports contract restrictions are all
              undisclosed, leaving the market structure incompletely defined from public information alone.
