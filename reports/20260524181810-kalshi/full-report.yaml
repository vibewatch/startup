      - number: '6.4'
        title: Institutional participation, retention clues, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Institutional and professional participation is no longer theoretical. Kalshi has a live market-maker
              program, a business onboarding surface, a Tradeweb partnership aimed at 3,000-plus institutional clients,
              and a Clear Street partnership that brings the first institutional FCM member into the exchange and
              clearing house. That evidence supports a real liquidity-provider and professional-user segment, even
              though the public source set does not disclose named hedge-fund customers or institutional revenue share.
              On retention and switching costs, the evidence is suggestive rather than decisive. Direct Kalshi users
              face real onboarding friction because they must clear KYC, fund a separate account, and learn Kalshi's own
              order-entry and fee model. Robinhood removes much of that friction by letting users trade the same
