      - number: '2.3'
        title: Buyer and user segmentation
        blocks:
          - type: paragraph
            body: >-
              Kalshi's buyers divide into two broad groups: retail consumers and institutional or professional traders.
              Among retail buyers, sports fans represent the dominant segment—approximately 89% of 2025 fee revenue
              derived from sports event contracts, reflecting a user base primarily motivated by applying sports
              knowledge rather than financial hedging. The adoption trigger for sports buyers is a major live event:
              Super Bowl, March Madness, and the NFL season drive the highest volumes. Kalshi disclosed more than 5
              million registered users by end of 2025.

              Political and election buyers form a second distinct segment: politically engaged consumers who seek to
              express views on election outcomes or hedge against policy exposure. Economic indicator traders—a smaller
              but potentially higher-value segment—include retail investors and professional traders who use Kalshi for
              macro hedging or directional positions on Fed decisions and economic data releases. Weather and climate
              contracts appeal to a narrower buyer base.

              Distribution channels define access patterns. Direct Kalshi users constitute the majority of registrants,
              while Robinhood's FCM integration accounts for approximately 25-35% of daily volume, suggesting a large
              portion of active traders arrive via brokerage access. Coinbase and Fanatics Markets provide additional
              distribution vectors with distinct user demographics: crypto-native users via Coinbase and sports brand
              loyalists via Fanatics. As of May 2026, ForecastEx, Kalshi's only competing CFTC DCM, had disclosed no
              user count or volume data.
