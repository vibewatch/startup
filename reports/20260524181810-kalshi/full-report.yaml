      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              Tarek Mansour (Co-founder and CEO) and Luana Lopes Lara (Co-founder and COO) are both first-generation
              immigrants—Mansour from Algeria and Lopes Lara from Brazil—who met at MIT while completing
              mathematics-oriented degrees. Mansour held quantitative roles at Goldman Sachs and Citadel Securities
              before co-founding Kalshi; Lopes Lara worked at Bridgewater Associates and Citadel Securities. Their
              combined derivatives and quant finance backgrounds gave them direct familiarity with the regulatory
              environment and technical infrastructure required to build an exchange rather than a consumer application.

              Lopes Lara is credited with leading the decision to sue the CFTC in November 2023 over the agency's
              rejection of election markets, a move that required overriding sustained board resistance that had advised
              the founders to focus on other products for almost two years. In 2025, Lopes Lara was named the world's
              youngest self-made female billionaire. Both founders retain executive operating roles with no indication
              of leadership transition. Key-person concentration risk is high: strategy, regulatory relationships,
              capital access, and public narrative all flow through the two co-founders and most visibly through Mansour
              as CEO.

              Beyond the co-founders, the publicly documented executive team includes Richard Heaslip (General Counsel
              and Chief Regulatory Officer), Joshua Beardsley (Chief Compliance Officer), and Max Crowley (VP Business
              Development). Board composition is not fully public; investor sources confirm board representation from
              Paradigm and Sequoia Capital based on their lead- investor positions across multiple rounds. CNBC has a
              commercial relationship with Kalshi that includes customer acquisition and a minority investment, creating
              a partial independence concern for CNBC as a source. A full board roster with independent directors has
              not been confirmed in public sources and is an open diligence item.
