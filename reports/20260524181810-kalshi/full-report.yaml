  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Fee Structure
        blocks:
          - type: paragraph
            body: >-
              Kalshi generates revenue exclusively through per-contract transaction fees on event contract trades. Each
              contract is priced between $0.01 and $0.99 per share and settles at either $1.00 (if the outcome occurs)
              or $0.00 (if it does not). Kalshi acts as a pure exchange intermediary—it does not take positions against
              users, charges no membership or subscription fees, and profits regardless of which outcome prevails. The
              platform's revenue model therefore aligns platform incentives with market liquidity rather than
              directional risk.


              In 2025, Kalshi reported $263.5 million in fee revenue against an estimated $50+ billion in annualized
              notional trading volume, implying a take rate of approximately 0.53%. By March 2026, CEO Tarek Mansour
              cited a $1.5 billion annualized run rate and noted the platform was processing more than $2 billion per
              week during peak event periods. Sports event contracts accounted for approximately 89% of 2025 fee
              revenue, with Super Bowl LX in February 2026 alone generating an estimated $1 billion in single-day
              volume. These event-driven peaks confirm the platform's capacity to handle concentrated surges.


              Robinhood's distribution partnership, launched in March 2025, meaningfully reduced effective customer
              acquisition costs for retail participants. By October 2025, Robinhood was contributing approximately
              25–35% of Kalshi's daily trading volume on active sports days, compressing the economics of reaching
              incremental retail traders. NBC News noted that Kalshi's USD-denominated settlement model—in contrast to
              crypto-based peers—broadens the accessible retail base and may further support organic volume growth.
