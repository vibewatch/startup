        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory moat is genuine and deep
            body: >-
              Kalshi's CFTC DCM status is not easily replicated: building a federally licensed derivatives exchange took
              over two years of regulatory engagement before 2020 approval and required winning a landmark lawsuit
              against the CFTC itself. As of May 2026, no U.S. competitor holds equivalent status for event contracts,
              and the Third Circuit's April 2026 ruling strengthens the legal basis for continued federal-only
              regulation.
