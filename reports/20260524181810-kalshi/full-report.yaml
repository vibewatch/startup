  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and definitions
        blocks:
          - type: paragraph
            body: >-
              The CFTC-regulated US event contract market is structurally distinct from every other wagering or trading
              product in the US. Kalshi operates as a Designated Contract Market (DCM) under the Commodity Exchange Act,
              issuing binary contracts priced $0.01–$0.99 that settle at $0 or $1 depending on real-world outcomes.
              Buyers and sellers transact with each other at a market-clearing price; Kalshi earns a fee but does not
              take a position against users—the fundamental difference from a sportsbook.

              US regulated sports betting, governed by state gaming commissions following the 2018 PASPA repeal, uses
              fixed-odds pricing where the sportsbook sets odds and takes position against bettors. Despite addressing
              overlapping buyer intent—predicting sports outcomes—the two markets operate under distinct regulatory
              frameworks, different fee models, and different economic structures. The AGA's $78.72B commercial gaming
              GGR figure for 2025 does not include event contract volume because event contracts are not a commercial
              gaming product under state law.

              Polymarket, the largest prediction market by estimated volume, operates on USDC crypto collateral without
              a US regulatory entity, using an automated market maker model. ForecastEx, registered as a CFTC DCM in
              June 2024, is the only direct structural competitor to Kalshi with equivalent regulatory standing. iGaming
              products (online slots and table games) operate under state gaming licenses entirely separate from CFTC
              jurisdiction. Traditional financial derivatives on CME and similar exchanges share the DCM regulatory
              framework with Kalshi but differ in buyer profile, contract structure, and scale—CME's interest rate ADV
              alone exceeded $14T per day in April 2026.
