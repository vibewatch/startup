chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Headquarters, and Business Model
        blocks:
          - type: paragraph
            body: >
              Kalshi, incorporated as KalshiEX LLC, is a financial exchange headquartered in New York, New York (594
              Broadway). Founded in 2018 by Tarek Mansour and Luana Lopes Lara—two MIT classmates who met while pursuing
              quantitative finance degrees—the company describes its mission as building "the most important financial
              market on the planet" by making real-world event outcomes tradable as a distinct regulated asset class.
              Kalshi participated in Y Combinator's winter 2019 batch and spent more than two years in regulatory
              preparation before receiving Commodity Futures Trading Commission (CFTC) designation as a Designated
              Contract Market (DCM) in November 2020—a distinction that made it the first U.S. exchange built
              specifically for event contracts to achieve full federal regulatory recognition. The platform publicly
              launched in July 2021.

              The product is the event contract: a binary instrument whose value reflects the market's estimated
              probability that a specified real-world event occurs, priced between $0.01 and $0.99 and settling at $1.00
              or $0.00 at resolution. Market categories include U.S. macroeconomic indicators (CPI, Fed rate decisions,
              GDP), political and electoral outcomes, sports results, weather events, entertainment, and cryptocurrency
              milestones. Kalshi generates revenue as a regulated exchange by charging transaction fees on each trade;
              unlike a sportsbook, it does not take a position against users. As of May 2026, Kalshi remains the only
              federally licensed DCM dedicated to event contracts in the United States, operating under the same legal
              framework as CME Group and Cboe but with a product set—binary event-linked swaps—that no incumbent
              exchange previously targeted at retail participants. In October 2025, Kalshi expanded internationally to
              140-plus countries, restricting 38 jurisdictions including Canada, the United Kingdom, and France.
