            title: 89% Revenue Concentration in Legally Contested Sports Contracts
            body: >-
              The single most material valuation risk is that 89% of Kalshi's 2025 fee revenue derived from sports event
              contracts that at least seven states are actively seeking to prohibit as unlicensed gambling. A successful
              multi-state ban or adverse federal circuit ruling would collapse revenue and compress the applicable
              valuation multiple simultaneously—a dual compression that could reduce intrinsic value by 85–95% from the
              $22 billion mark.
            calloutType: risk
            claimRefs:
