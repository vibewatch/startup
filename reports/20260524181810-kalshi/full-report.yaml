  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Kalshi operates at the intersection of three competitive spaces: regulated US event contracts (direct
              peers), crypto/offshore prediction markets (unregulated substitutes), and sports-betting products
              (behavioral substitutes). Understanding each category is essential because the competitive pressure Kalshi
              faces is structural and multi-directional — not simply a fight for market share against a single rival.

              In the regulated US event contract space, Kalshi is one of three CFTC-designated entities as of May 2026.
              ForecastEx (designated June 2024) is the only other active DCM for event contracts. PredictIt won CFTC
              approval for a regulated exchange in September 2025 through its operator Aristotle International. This
              trio constitutes the formal regulated market structure. Kalshi holds the earliest designation (November
              2020), the deepest market breadth across sports, politics, economics, weather, and entertainment, and the
              only demonstrated large-scale FCM distribution with Robinhood, Coinbase, and Fanatics Markets.

              In the crypto/offshore segment, Polymarket is the dominant global platform by volume. Founded in 2020 by
              Shayne Coplan, Polymarket operates on the Polygon blockchain using USDC collateral. Following a CFTC
              consent order in 2022 that barred US users, Polymarket was blocked from the US market from 2022 until
              December 2, 2025, when the Trump administration's regulatory posture allowed US user access to resume.
              Intercontinental Exchange (ICE) invested up to $2 billion in Polymarket in October 2025, valuing it at
              $8–9 billion. Despite its scale and capital, Polymarket has never obtained a CFTC DCM license and faces
              ongoing questions about insider trading, market manipulation, and content accuracy.

              The Iowa Electronic Markets (IEM), operated by the University of Iowa Tippie College of Business since
              1988, is an academic not-for-profit predecessor operating under CFTC no-action letters with a $5–$500
              investment cap per trader. The IEM is not a commercial competitor but establishes the academic credibility
              of prediction markets as forecasting tools.

              US sports-betting operators — DraftKings, FanDuel, BetMGM, and Caesars — are behavioral substitutes rather
              than structural competitors. Regulated in 38 states and Washington DC under state gaming licenses
              following the 2018 PASPA repeal, these platforms use a fixed-odds model where the sportsbook holds the
              counter-position to bettors. Their combined 2024 GGR of $13.78 billion makes them the largest pool of
              adjacent user spend. The AGA, which represents these operators, publicly characterizes prediction markets
              as "unregulated" and lobbies against their expansion, framing the competitive threat explicitly.
