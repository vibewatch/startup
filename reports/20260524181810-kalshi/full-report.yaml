            body: >-
              Kalshi's customer base is visibly multi-layered even though the company does not publish a clean channel
              mix. The direct product speaks to retail traders who want to express views on sports, economics, politics,
              weather, culture, and other news-driven outcomes with simple yes/no contracts. App-store copy explicitly
              targets sports fans, investors hedging financial risk, forecasters, and developers building automated
              strategies, while independent reviews describe the platform as unusually broad on market selection for a
              regulated U.S. venue. A second customer layer comes through broker distribution. Robinhood embeds
              Kalshi-powered event contracts inside its existing brokerage flow, and Webull announced a similar
              partnership, meaning some users experience Kalshi primarily as infrastructure rather than as a standalone
              destination. A third layer is institutional or business users. Kalshi now maintains business-account
              onboarding and a live market-maker program, which means liquidity providers and professional trading
              entities are part of the customer set, not just end-consumer traders.
