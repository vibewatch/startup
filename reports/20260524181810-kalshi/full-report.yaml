      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The single most important growth enabler is CFTC regulatory preemption. Between April and May 2026, the
              CFTC sued Arizona, Connecticut, Illinois, New York, Wisconsin, and Minnesota to block state gambling
              enforcement against regulated prediction markets. The CFTC also secured a temporary restraining order
              against Arizona, filed amicus briefs with the Massachusetts Supreme Judicial Court and the Sixth Circuit,
              and signed an information-sharing MOU with the NHL. Each legal win expands the addressable US user base by
              removing state-level criminal and regulatory exposure.

              On the demand side, sports betting's trajectory since PASPA repeal provides an instructive analog: US
              sports betting grew from near-zero in 2018 to $13.78B in GGR by 2024, with the most rapid acceleration
              occurring once multi-state legalization removed ambiguity. If CFTC preemption definitively resolves state
              jurisdictional conflict, Kalshi could benefit from a comparable legitimacy-unlock. Brokerage distribution
              is the second major growth accelerator: Robinhood's 25-35% daily volume share represents scale acquisition
              without Kalshi having to build its own distribution layer.

              Adoption constraints are equally material. The AGA and the interactive gaming industry publicly oppose
              prediction markets and characterized them as "unregulated" in a January 2026 joint letter, despite
              Kalshi's CFTC designation—a framing that could create consumer confusion. The CFTC-NHL MOU introduces
              sports league influence over contract scope, potentially prefiguring licensing obligations. Kalshi's 89%
              sports revenue concentration creates a single-product-line risk: if sports contracts are restricted by
              future rulemaking or court order, the revenue base would contract significantly. ForecastEx's lowest-fee
              competitive positioning signals that margin compression may follow market maturation.
