      - number: '5.2'
        title: Exchange Architecture and Market Mechanics
        blocks:
          - type: paragraph
            body: >-
              Kalshi operates as a centralized limit-order-book (CLOB) exchange under its CFTC Designated Contract
              Market license issued in November 2020. The production REST API is hosted at
              external-api.kalshi.com/trade-api/v2 (also accessible at api.elections.kalshi.com/trade-api/v2), with a
              demo/sandbox environment at demo-api.kalshi.co/trade-api/v2 for developer testing. The current API version
              as of this report is v3.19.0. Real-time market data is streamed via a WebSocket API governed by a
              published AsyncAPI specification, allowing subscribers to receive live order-book updates, trade fills,
              and market-status changes without polling.

              The exchange's fee model is a maker-taker structure with a quadratic taker-fee formula. The taker fee is
              calibrated as a quadratic function of the contract's current price, which produces the highest per-share
              fees at mid-range prices (approximately $0.40– $0.60) and lower fees near the extremes. This design
              encourages liquidity at middle probabilities where the market has genuine uncertainty. Maker fees were
              introduced in spring 2025 and restructured significantly over the summer, applying primarily to sports
              markets. Because roughly 40% of all shares are traded within two hours of market closing, and sports
              markets resolve reliably within an hour of a scheduled event, the platform generates large fee revenues
              from high-frequency sports trades.

              To support institutional volume and liquidity provision, Kalshi launched a Market Maker Program in May
              2025. Known members include Susquehanna Investment Group and Kalshi Trading LLC, an affiliated entity that
              itself trades on the platform — a relationship the Financial Times has noted as "somewhat controversial."
              Market maker fee schedules and trading constraints are documented in classified CFTC filings rather than
              public disclosures, and large traders also qualify for partial rebates. This opacity makes independently
              verifying realized fee yields impossible.

              Order book mechanics support limit and market order types, with time-in-force options of
              immediate-or-cancel (IOC) and good-till-canceled (GTC). An expiring order variant (GTT, good-till-time) is
              available through the API using an expiration timestamp, though the API documentation notes it is an
              internal execution type and GTC with an expiration_ts field. Each user may have up to 200,000 open orders
              simultaneously. The platform also provides RFQ (request-for-quote) endpoints for block trades and
              multivariate event market support for complex correlated-outcome contracts. Settlement is binary and
              automatic: at market resolution Kalshi credits $1.00 per winning contract and $0.00 per losing contract
              directly to the user's account.

              The platform's peak volume has demonstrated infrastructure scale: Kalshi processed approximately $2
              billion per week during active event periods and $1 billion in a single day during Super Bowl LX in
              February 2026. No public SLA, uptime figure, or incident history is available, representing a diligence
              gap for institutional counterparties.
