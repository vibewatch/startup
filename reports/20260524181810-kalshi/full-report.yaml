          value: $50B+ annualized volume; no standalone revenue TAM
          detail: >-
            Estimated serviceable addressable market for CFTC-regulated event contracts. No independent analyst TAM
            exists. Kalshi $50B+ annualized volume and $263.5M fee revenue are the best available proxies. ForecastEx
            and other platforms add undisclosed volume.
        - label: Kalshi current fee revenue (SOM — verified)
          value: $263.5M (2025)
          detail: >-
            Bloomberg-reported Kalshi fee revenue for 2025. Represents ~89% sports contracts at an implied ~0.5%
            effective take rate on $50B+ annualized volume. 5M+ registered users.
        - label: Near-term SOM at current growth trajectory (estimated)
