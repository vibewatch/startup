  - id: FE001
    title: Kalshi Exchange Platform Architecture Stack
    type: stack
    layout: standard
    summary: >-
      Layered view of Kalshi's technical architecture from user interfaces down through exchange infrastructure and
      compliance controls.
    data:
      layers:
        - label: User Interfaces
          detail: >-
            Consumer-facing surfaces enabling retail and embedded trading: web platform, mobile app, and broker-embedded
            hubs.
          items:
            - Web platform (kalshi.com / Vercel CDN)
            - Mobile app (iOS / Android — active listing unverified as of May 2026)
            - Robinhood Prediction Markets Hub (embedded; ~25-35% of sports volume)
            - Webull event-contract integration (embedded; 2025)
        - label: API Layer
          detail: >-
            Programmatic access surface for algorithmic traders and integrators: REST, WebSocket, demo sandbox, and
            institutional FIX protocol.
          items:
            - REST API v3.19.0 (external-api.kalshi.com/trade-api/v2)
            - WebSocket API (real-time streaming; AsyncAPI spec published)
            - Demo / sandbox (demo-api.kalshi.co/trade-api/v2)
            - FIX Protocol layer (Kalshi fork of QuickFIX/Go; FIX 4.0–5.0 SP2)
        - label: Exchange Engine
          detail: >-
            Core matching and pricing infrastructure: central limit order book, order types, market-maker liquidity, and
            fee model.
          items:
            - Central Limit Order Book (CLOB); up to 200K open orders per user
            - 'Order types: limit, market, IOC, GTC / expiring-GTT'
            - Market Maker Program (Susquehanna, Kalshi Trading; since May 2025)
            - Quadratic taker-fee formula; maker fees on sports markets
        - label: Settlement and Oracle
          detail: >-
            Automatic binary settlement layer that resolves contracts to $1.00 or $0.00 based on external oracle data;
            includes state-level access control.
          items:
            - Binary settlement engine ($1.00 YES / $0.00 NO per contract at resolution)
            - External data oracles (official stats, news wire, regulatory releases)
            - Geofencing layer (IP-based state market access control)
        - label: Compliance and Custody
          detail: >-
            Regulatory and custody controls required by CFTC DCM license: market surveillance, fund segregation,
            KYC/AML, and insider-trading enforcement.
          items:
            - CFTC DCM license (since Nov 2020; same tier as CME Group)
            - Market surveillance program (Rule 5.17(z) insider-trading enforcement)
            - Fund segregation (CFTC DCM requirement; user funds held separately)
            - KYC / AML processing
        - label: Developer and Integration Tooling
          detail: >-
            Developer ecosystem layer: spec-driven SDKs, GitHub repos, and blockchain deposit rails enabling third-party
            integrations and on-ramps.
          items:
            - OpenAPI 3.0 spec (downloadable from docs.kalshi.com)
            - AsyncAPI spec (WebSocket streaming)
            - Python SDK (kalshi-python v2.1.4 on PyPI; OpenAPI Generator v7.15.0)
            - GitHub repos (starter code 94★; tools-and-analysis 19★; QuickFIX fork)
            - Blockchain deposit rails (Solana ≤$500K, Bitcoin, USDC, Worldcoin)
    approximationNotes: >-
