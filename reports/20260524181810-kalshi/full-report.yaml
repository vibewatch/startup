figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Kalshi's history runs from a regulated-market concept in 2018 through a sustained CFTC battle to an explosive
      capital formation cycle in 2025 and converging legal and legislative pressures in 2026.
    data:
      items:
        - date: '2018'
          label: Founded
          detail: Mansour and Lopes Lara start Kalshi at MIT; purpose-built for event contracts on real-world outcomes.
          tone: positive
        - date: '2019'
          label: Y Combinator batch
          detail: Joins YC winter 2019; raises seed capital; begins CFTC engagement.
          tone: positive
        - date: 2020-11
          label: CFTC DCM designation
          detail: First U.S. exchange for event contracts to receive Designated Contract Market status.
          tone: positive
        - date: 2021-07
          label: Platform launch
          detail: Public trading begins; initial markets cover economics, weather, and finance.
          tone: positive
        - date: 2022-08
          label: CFTC blocks election contracts
          detail: Agency imposes a stay on political event contracts; begins public-interest review.
          tone: warning
        - date: 2023-11
          label: Kalshi sues the CFTC
          detail: Filed after CFTC disapproval of election contracts in September 2023; board had advised against lawsuit.
          tone: warning
        - date: 2024-09
          label: Court victory on election markets
          detail: D.C. District Court grants summary judgment for Kalshi; election contracts go live October 2024.
          tone: positive
        - date: 2025-06
          label: Series C — $185M at $2B
          detail: Paradigm leads; Sequoia, Multicoin, Peng Zhao co-invest. Trading volume 100x year-over-year.
          tone: positive
        - date: 2025-10
          label: Series D — $300M at $5B; 140+ countries
          detail: Sequoia and a16z co-lead; global launch; Robinhood integration drives 25-35% of daily volume.
          tone: positive
        - date: 2025-12
          label: Series E — $1B at $11B
          detail: Paradigm leads; $1B weekly trading volume confirmed; targets next 100M users.
          tone: positive
        - date: 2026-03
          label: Arizona criminal prosecution
          detail: First criminal charges filed against a CFTC-registered prediction market operator; 20 counts.
          tone: negative
        - date: 2026-03
          label: Latest round — ~$1B at $22B
          detail: Coatue leads; total funding exceeds $2.5B; valuation doubles in three months.
          tone: positive
        - date: 2026-04
          label: Third Circuit upholds CFTC jurisdiction
          detail: First federal appellate ruling in Kalshi's favor; CFTC sues AZ, CT, IL for preemption.
          tone: positive
        - date: 2026-05
          label: Arizona injunction granted
          detail: Federal judge blocks criminal enforcement; finds contracts likely qualify as federal swaps.
          tone: positive
    approximationNotes: >-
      Round-closing dates for Series D and the March 2026 round are based on public reporting and may differ by days to
      weeks from actual legal-close dates.
