  - id: FI001
    title: Kalshi Revenue Model Flow
    type: flow
    layout: standard
    summary: >-
      Event contract lifecycle from trader purchase through binary settlement to Kalshi fee capture, illustrating the
      pure-exchange model in which Kalshi profits regardless of outcome.
    data:
      nodes:
        - id: trader-buy
          label: |-
            Trader Places Order
            $0.01–$0.99 per share
          detail: User submits buy or sell at a price reflecting implied probability of event outcome.
          tone: neutral
        - id: exchange-match
          label: |-
            Kalshi Exchange Matches
            Order Book
          detail: CFTC-regulated DCM; acts as central counterparty without taking directional risk.
          tone: positive
        - id: event-settle
          label: |-
            Event Settles
            $1.00 (Yes) or $0.00 (No)
          detail: Binary outcome determined by observable event; CFTC-defined resolution criteria.
          tone: neutral
        - id: fee-collect
          label: |-
            Kalshi Collects
            Per-Contract Fee
          detail: Transaction fee deducted; no spread capture, no house position loss.
          tone: positive
        - id: revenue-pool
          label: |-
            2025 Revenue
            $263.5M (unaudited)
          detail: Cumulative per-contract fees across ~$50B annual notional volume; ~0.53% implied take rate.
          tone: positive
      edges:
        - from: trader-buy
          to: exchange-match
          label: Order submitted to central order book
        - from: exchange-match
          to: event-settle
          label: Matched contract held to expiry
        - from: event-settle
          to: fee-collect
          label: Fee deducted upon resolution
        - from: fee-collect
          to: revenue-pool
          label: Aggregated at ~0.53% take rate
    approximationNotes: >-
      Take rate is analyst-derived from reported revenue and estimated volume; Kalshi has not published an official fee
      schedule. Node values ($263.5M, 0.53%) are unaudited.
    claimRefs:
      - CI001
