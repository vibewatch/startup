      - number: '8.3'
        title: Bull / Base / Bear Scenarios
        blocks:
          - type: paragraph
            body: >-
              Three scenario frameworks bracket the range of outcomes over a five-year horizon. The scenarios are
              anchored to publicly reported financials and the litigation landscape detailed in Chapter 7; they are
              explicitly approximated—not audited.

              Bull case ($45–75 billion, 5-year terminal): Assumes CFTC federal preemption is upheld at the circuit or
              Supreme Court level, sports event contracts survive in 40+ states, and revenue compounds from the $1.5
              billion March 2026 run rate to $5–8 billion by fiscal year 2028 (approximate 75–120% CAGR from run rate).
              At a 10–15x revenue multiple consistent with CME or a premium growth exchange, terminal value reaches
              $50–120 billion. Bull-case catalysts: favorable Supreme Court cert or federal legislation clarifying CFTC
              supremacy, international market share gains, Robinhood and additional brokerage integrations scaling
              volume, and a path to public markets. Probability assigned: approximately 25–30% given the current
              regulatory uncertainty.

              Base case ($18–30 billion, 5-year): Assumes partial state restrictions (10–15 states effectively blocked
              for sports contracts), revenue from sports moderates but macro, political, and weather contracts diversify
              the mix. Overall revenue reaches $2.5–4 billion by FY2027 at a 65–165% growth rate from the run rate. At
              an 8–12x revenue multiple, terminal value is $20–48 billion. The $22 billion entry point is roughly "fair"
              on this path if sport revenues are not eliminated wholesale. Probability: approximately 40–45%.

              Bear case ($2–7 billion): Assumes federal legislation or adverse appellate rulings effectively eliminate
              sports event contracts in the U.S., collapsing revenue by approximately 89% (proportional to 2025 fee
              concentration). Residual non-sports revenue of $150–350 million supports a 5–10x multiple implying $750
              million to $3.5 billion, but the $2.8+ billion raised and preference overhang means common equity is worth
              substantially less. A 30-state legislative ban or SCOTUS cert reversing CFTC authority would be the
              trigger. Probability: 25–30%.

              Blended expected value at 25% bull / 45% base / 30% bear (midpoints): approximately $22 billion—consistent
              with the Series F price but implying zero risk premium for investors entering at the reported mark. The
              absence of dilution data, waterfall assumptions, or preference overhang details prevents a precise
              per-share intrinsic value calculation.
