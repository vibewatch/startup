      - number: '1.3'
        title: Funding History, Valuation, and Investors
        blocks:
          - type: paragraph
            body: >
              Kalshi's capital formation accelerated dramatically in 2025 following its 2024 court victory on election
              contracts. The company raised $185 million in a Series C round in June 2025, valuing it at $2 billion;
              then $300 million in a Series D closed in August 2025 and announced in October, valuing it at $5 billion;
              then $1 billion in a Series E in December 2025 at $11 billion; and reportedly approximately $1 billion
              more in March 2026 led by Coatue Management at a $22 billion valuation. The Series E raised Kalshi's total
              known funding past $1.6 billion per Crunchbase, and the March 2026 round reportedly pushed the cumulative
              total past $2.5 billion per Yahoo Finance and Tracxn ($2.8 billion).

              Prior to 2025, Kalshi had raised approximately $230 million across earlier rounds including a Y Combinator
              accelerator investment (2019), a seed extension, and a Series A of approximately $30 million in February
              2021 led by Sequoia Capital with participation from Charles Schwab, Henry Kravis, SV Angel, Neo, and Y
              Combinator. Paradigm has been the most consistent lead investor, appearing in Series C and Series E.
              Sequoia Capital and Andreessen Horowitz co-led Series D and continued into Series E. Other notable
              investors include CapitalG (Google/ Alphabet's growth fund), ARK Invest, IVP, Meritech Capital, Anthos
              Capital, Coinbase Ventures, Multicoin Capital, Spark Capital, and General Catalyst. Charles Schwab and
              investor Henry Kravis were early backers. As of May 2026, Kalshi remains private with no announced IPO
              plans, and the full capitalization table including founder stakes and secondary transactions is not
              publicly disclosed.
