      - number: '3.4'
        title: Kalshi's Differentiation and Structural Advantages and Disadvantages
        blocks:
          - type: paragraph
            body: >-
              Kalshi's primary differentiation is the combination of regulatory primacy and brokerage distribution. As
              the original CFTC DCM for retail event contracts (designated November 2020), Kalshi built the first
              compliance infrastructure, legal precedents, and FCM relationships in a category that did not previously
              exist. Robinhood's integration as an FCM partner — driving 25–35% of Kalshi's daily volume — is the
              clearest evidence of a distribution moat: Robinhood has 24+ million funded accounts and directs a
              meaningful fraction of its equity trading user base into event contracts. No other event contract platform
              has replicated this distribution dynamic as of May 2026.

              Liquidity itself is a network-effect moat. A liquid market with tight spreads attracts more traders, which
              deepens liquidity further. Kalshi's $52 billion+ cumulative volume and weekly run rate of $1 billion+
              create spreads and depth that are structurally difficult for a new entrant to replicate without an
              external liquidity injection or a connected user base. ForecastEx and PredictIt (new exchange structure)
              both face cold-start liquidity problems that lower fees alone cannot resolve.

              The CFTC's active defense of Kalshi's market — suing six states (Arizona, Connecticut, Illinois, New York,
              Wisconsin, Minnesota) to block state gambling enforcement in April–May 2026, and winning a restraining
              order in Arizona — creates a competitive moat through legal certainty that an unregulated competitor
              cannot claim. Polymarket cannot rely on CFTC preemption protection because it lacks the DCM license that
              triggers preemption. PredictIt's new exchange license may eventually qualify it for preemption, but only
              for the political categories it currently covers.

              Kalshi's structural disadvantages are concentrated in three areas. First, sports revenue concentration
              (89% of 2025 revenue) creates a single-market dependency that Polymarket and traditional sports-betting
              operators do not share — if sports contract scope is restricted by rulemaking or court order, Kalshi's
              revenue base collapses disproportionately. Second, Polymarket's crypto infrastructure enables
              self-custodied, frictionless participation for crypto-native users and supports global markets without
              jurisdictional licensing. Kalshi's regulated model requires identity verification, US residency for many
              contract types, and FCM intermediation — higher friction that limits viral growth. Third, Kalshi has no
              developer ecosystem comparable to Polymarket's open API and CLOB infrastructure (docs.polymarket.com),
              limiting programmatic trading and third-party market-making integration relative to Polymarket's
              decentralized architecture.

              The critical multi-homing question: prediction market users have demonstrated willingness to use multiple
              platforms simultaneously (Polymarket for global crypto markets, Kalshi for regulated US markets). This
              reduces Kalshi's exclusivity but also limits Polymarket's ability to fully substitute. Distribution
              lock-in through Robinhood's single-platform experience is the strongest anti-multi-homing mechanism Kalshi
              possesses.
