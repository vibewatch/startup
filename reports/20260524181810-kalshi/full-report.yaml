      - number: '2.2'
        title: Market sizing estimates and limitations
        blocks:
          - type: paragraph
            body: >-
              No independent analyst has published a dedicated TAM for US CFTC-regulated event contracts as a standalone
              market. Global prediction market reports from Grand View Research, Mordor Intelligence, and Fortune
              Business Insights aggregate both regulated and unregulated platforms worldwide, rendering their figures
              unreliable as proxies for Kalshi's specific market. The most relevant available sizing evidence comes from
              proxy benchmarks: adjacent market size, Kalshi's own disclosed metrics, and valuation-implied assumptions.

              The US regulated sports betting market—the closest substitute for sports contract trading— generated
              $13.78B in GGR in 2024 on $149.90B in handle, a 24.8% year-over-year increase from $11.04B in 2023. US
              iGaming added $8.41B GGR in 2024 (+28.7% YoY). These figures establish a $22B+ adjacent US gaming revenue
              pool in 2024. Kalshi's $263.5M in 2025 fee revenue against $50B+ annualized volume implies an effective
              take rate of approximately 0.5%, well below sportsbook operating margins of 5-7%.

              Kalshi's $22B March 2026 valuation implies an 84x revenue multiple—an extreme premium that prices in
              significant future market expansion. The CME Group, the world's largest futures exchange, trades at
              roughly 20-25x earnings. The implied growth assumption embedded in Kalshi's valuation is not supported by
              any published independent market analysis, making size and trajectory a primary diligence question.
              Cumulative contract volume passed $52B by March 2026, roughly doubling from mid-2025, suggesting the
              growth trajectory is real even if the terminal market size remains contested.
