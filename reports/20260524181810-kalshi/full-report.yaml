      - number: '1.4'
        title: Scale Metrics, Milestones, and Adverse Events
        blocks:
          - type: paragraph
            body: >
              Kalshi's operating metrics reflect an inflection tied directly to its 2024 legal victory on election
              contracts. Trading volume surpassed $1 billion per week by December 2025, a 1,000%- plus increase
              year-over-year; annualized volume was projected at $50 billion for 2025, with cumulative event contract
              volume exceeding $52 billion by March 2026. The company reported $263.5 million in fee revenue for
              full-year 2025 and a revenue run rate reportedly approaching $1.5 billion by early 2026. Approximately 89%
              of 2025 revenue was attributable to sports contracts. Registered users exceeded 5 million by early 2026.
              Employee headcount was approximately 467-500 as of March-May 2026. Robinhood users accounted for an
              estimated 25-35% of Kalshi's daily trading volume following the March 2025 platform integration. TIME
              included Kalshi in its 2026 100 Most Influential Companies list.

              Kalshi's milestone chronology is defined as much by legal adversity as by product launches. Arizona filed
              a 20-count criminal information against Kalshi in March 2026—the first criminal prosecution of any
              CFTC-registered prediction market operator—accusing it of running an illegal gambling operation. A federal
              judge blocked this prosecution in May 2026, granting a preliminary injunction finding Kalshi's contracts
              likely qualify as swaps under federal law. On April 6, 2026, the Third Circuit Court of Appeals upheld
              CFTC exclusive jurisdiction over sports-related event contracts, the first federal appellate ruling on the
              question. The CFTC filed suit against Arizona, Connecticut, and Illinois on April 2, 2026 supporting
              preemption. As of May 2026, Kalshi faces active litigation or enforcement actions in at least eight
              states. Separately, since January 2026, more than ten congressional bills targeting prediction markets
              have been introduced. Kalshi's compliance team has also disciplined traders for insider trading related to
              their own election candidacies, and the CFTC issued its first-ever prediction market insider trading
              enforcement advisory in February 2026 highlighting Kalshi disciplinary cases.
