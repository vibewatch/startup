            body: >-
              Kalshi's market-integrity posture is publicly assertive but unevenly verifiable. The company says it runs
              continuous trade surveillance and identity verification on every account before funded trading is allowed,
              and it has launched a Market Surveillance Advisory Committee with Solidus Labs and Wharton researchers. In
