              from trading the markets they can influence, framed as a response to insider-trading concerns. The CFTC's
              March 2026 enforcement advisory reinforces that anti-manipulation rules apply to event-contract trading,
              and the House Oversight probe and Finance Magnates reporting indicate that Congress is actively asking
              whether Kalshi's KYC and surveillance practices are sufficient. The customer-experience layer compounds
