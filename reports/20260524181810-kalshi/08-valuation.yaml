chapter:
  number: 8
  title: Valuation
  summary: >-
    Kalshi's March 2026 Series F at a $22 billion post-money valuation (led by Coatue at ~$1 billion
    invested) implies a 14.7x revenue multiple on the company's $1.5 billion annualized run rate—
    broadly in line with CME Group's ~16x price-to-sales ratio and well below Robinhood's ~26x,
    but entirely dependent on a revenue base that is 89% concentrated in sports event contracts
    currently challenged in at least seven states. The $22 billion price embeds a bull-scenario
    probability that CFTC federal preemption holds, sports contracts survive in enough jurisdictions
    to protect $1B+ in annual fee revenue, and total revenue reaches $3–5 billion by 2028;
    a base scenario with moderate state restrictions and partial revenue erosion returns a fair
    value of $18–28 billion; a bear scenario in which a wave of state injunctions or federal
    legislation eliminates sports-contract revenue collapses intrinsic value to $3–7 billion.
    The valuation stance is stretched: pricing requires material legal-risk resolution that is
    not yet in evidence, and the absence of audited financials or public profitability data
    prevents high-confidence corroboration of the run-rate claim.

sections:
  - id: financing-benchmark
    title: "Latest Financing Benchmark: Series F at $22 Billion"
    body: >-
      Kalshi closed six institutional funding rounds between June 2025 and March 2026, compressing
      what would normally be a multi-year valuation journey into less than ten months. In June 2025,
      Paradigm led a $185 million Series C at a $2 billion post-money valuation—the company's entry
      into the unicorn tier. Four months later, in August 2025, Sequoia Capital and Andreessen
      Horowitz co-led a $300 million Series D at $5 billion—a 150% step-up in just four months.
      In December 2025, Paradigm returned to lead a $1 billion Series E at $11 billion. Then in
      March 2026, Coatue Management led a second $1 billion round—reported by the Wall Street
      Journal and corroborated by CNBC, Fintech Global, and Yahoo Finance—at a $22 billion
      post-money valuation, more than doubling the previous round's mark in roughly ninety days.
      Total equity raised since inception is approximately $2.8 billion across at least six
      institutional rounds, with additional early-stage and Y Combinator seed capital.

      The velocity of the valuation re-ratings reflects compounding factors: the September 2024
      D.C. Circuit court victory (election contracts), the May 2025 CFTC appeal withdrawal,
      the Robinhood distribution partnership launched in March 2025, the Series E Paradigm round
      in December 2025 at $11 billion, and the subsequent $263.5 million 2025 fee revenue
      disclosure. Comparable competitor marks support the trajectory: Polymarket secured up to
      $2 billion in strategic investment from Intercontinental Exchange at an $8 billion pre-money
      valuation in October 2025, and secondary market trading reportedly pushed Polymarket's
      implied valuation to $11.6 billion by January 2026. The Series F's reported status as
      "nearly closed" per sourced Yahoo Finance reporting means terms have not been officially
      confirmed; investors should treat the $22 billion figure as reported, not company-audited.
