  - id: exit-and-gaps
    title: "Exit Readiness, Recommendation, and Unresolved Diligence Gaps"
    body: >-
      Exit pathway analysis is highly speculative but three routes are plausible: (1) IPO—
      Kalshi's $22 billion private valuation and $1.5 billion run rate would place it among the
      largest fintech IPO candidates of the last five years; however, the litigation overhang,
      lack of audited financials, and legal classification uncertainty (exchange vs. gaming)
      make public market readiness at current valuations uncertain at best; (2) strategic
      acquisition—CME Group, Nasdaq Inc., or major financial exchanges could find the DCM license
      and user base strategically valuable, particularly post-sports-contracts resolution; (3)
      secondary liquidity—the company's backers (Paradigm, Sequoia, Coatue) are sophisticated
      enough to engineer partial exits through secondary market transactions, as Polymarket
      demonstrated with its secondary-implied $11.6 billion mark by January 2026.

      The recommendation is research-more with a stretched valuation stance. The price paid in
      the Series F embeds an exchange-like multiple on a run rate that is legally fragile. Entry
      discipline for new investors should require: (a) sports-contract legal clarity in at least
      the Third and Ninth Circuits, (b) audited 2025 financials or at minimum a 2025 audit
      opinion, and (c) visibility into EBITDA margin—critical for distinguishing whether the
      $1.5 billion run rate is approaching profitability or burning through the $2.8 billion
      raised. Until these conditions are met, the Series F post-money mark warrants skepticism
      from new investors at or above $22 billion.

      Unresolved diligence gaps that prevent a higher-conviction judgment include: (1) no
      public audit, CFTC financial report, or independent revenue attestation for FY2025 or
      the Q1 2026 period; (2) preference overhang and waterfall structure across six institutional
      rounds are undisclosed; (3) headcount expense and EBITDA are unknown—the company expanded
      from ~70 to 494 employees in six months, implying a major cost inflection; (4) Robinhood
      partnership economics (revenue share, exclusivity terms, termination triggers) are
      undisclosed; and (5) the cap table concentration among Paradigm and Coatue creates
      board-level governance risk absent from public-company comps.
