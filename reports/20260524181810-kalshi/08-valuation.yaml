  - id: comp-analysis
    title: "Comparable Set and Valuation Framework"
    body: >-
      Kalshi's valuation can be approached through three lenses: (1) private-financing comparables
      using round-by-round multiples and comparable private prediction-market valuations; (2) public
      exchange and fintech comparables providing market-observable price-to-revenue and
      price-to-earnings benchmarks; and (3) a revenue-run-rate framework tying the entry price
      to Kalshi's reported $1.5 billion annualized fee run rate and scenario assumptions on
      take rate and volume.

      On the private-financing lens, Kalshi's $22 billion valuation is a 14.7x multiple of the
      $1.5 billion annualized run rate cited by management in March 2026, and an 83.5x multiple
      of reported 2025 full-year fee revenue of $263.5 million. The latter multiple is
      high as a historical ratio but misleading as a forward indicator given 485% revenue growth
      from Series C to Series F. Polymarket's ICE-backed $9 billion valuation in October 2025
      implies that Kalshi's 2.4x premium over Polymarket is partially explained by CFTC
      regulatory status, Robinhood distribution, and USD-denominated settlement—but Polymarket
      had no public revenue disclosure at the time.

      On the public-exchange lens, CME Group—the most structurally similar regulated exchange—
      reported 2024 revenue of $6.13 billion and carried a market capitalization of approximately
      $98.9 billion as of mid-2025, implying a price-to-revenue multiple of approximately 16x.
      CME's exchange model is mature, highly diversified, EBITDA-margin-rich, and backed by
      institutional clearing—attributes Kalshi does not yet share. Nasdaq Inc. trades at a
      comparable multiple. Robinhood, the closest analog as a high-growth retail trading platform
      with event contracts embedded, reported 2025 revenue of $4.47 billion and carried a market
      capitalization of approximately $118 billion in late 2025, implying a price-to-revenue
      multiple of approximately 26x. Applying a Robinhood-style multiple to Kalshi's $1.5 billion
      run rate would imply a valuation of $39 billion—above the $22 billion Series F price.

      On the gaming/sports-betting lens, DraftKings (DKNG) carried a market capitalization of
      $10.83 billion in March 2026 against trailing-twelve-months revenue of approximately $5.41
      billion—a 2x price-to-revenue multiple. Flutter Entertainment (FLUT) traded at approximately
      $46.75 billion against 2025 revenue of $16.38 billion—a 2.9x multiple. If Kalshi is
      re-classified as a sports-betting operator (the central thesis of state regulators and Better
      Markets), the applicable multiple compresses dramatically: applying a 2.5x multiple to
      $1.5 billion in run-rate revenue implies a $3.75 billion valuation, a ~94% discount to the
      Series F price. This multiple-divergence creates the central valuation tension.

      The strategic-optionality lens adds a premium for network effects (5M+ users, Robinhood
      integration), the CFTC DCM license as a regulatory moat, and the company's nascent
      international expansion into 140+ countries. CME's own launch of a prediction markets
      joint venture with FanDuel (Flutter) in December 2025 validates the market opportunity
      but also introduces a well-capitalized competitor.
