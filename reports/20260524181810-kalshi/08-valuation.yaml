callouts:
  - calloutType: risk
    title: "89% Revenue Concentration in Legally Contested Sports Contracts"
    body: >-
      The single most material valuation risk is that 89% of Kalshi's 2025 fee revenue derived
      from sports event contracts that at least seven states are actively seeking to prohibit
      as unlicensed gambling. A successful multi-state ban or adverse federal circuit ruling would
      collapse revenue and compress the applicable valuation multiple simultaneously—a dual
      compression that could reduce intrinsic value by 85–95% from the $22 billion mark.
    claimRefs:
      - CV033
      - CV034

  - calloutType: insight
    title: "Pricing Requires Exchange-Like Multiple on a Legally Fragile Revenue Base"
    body: >-
      At $22 billion against a $1.5 billion run rate, Kalshi prices at 14.7x revenue—a
      reasonable exchange multiple (CME trades at ~16x) but only defensible if the revenue
      base is as durable as CME's diversified, institutionally cleared derivatives business.
      Kalshi's revenue base is not. Investors pricing at Series F terms are implicitly
      assigning exchange-quality durability to sports-betting-quality legal exposure.
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV019

  - calloutType: assumption
    title: "Run Rate and Revenue Figures Are Management-Reported, Not Audited"
    body: >-
      The $1.5 billion annualized run rate (March 2026) and $263.5 million in 2025 fee revenue
      are management-reported figures cited in press coverage and company blog posts. Kalshi has
      not filed audited financial statements, and the CFTC does not make DCM financial reports
      public. All valuation arithmetic in this chapter that uses these figures is explicitly
      approximated and should be refreshed upon any independent revenue attestation.
    claimRefs:
      - CV040
      - CV041

