  - id: thesis-antithesis
    title: "Investment Thesis, Anti-Thesis, and Thesis-Break Triggers"
    body: >-
      The core investment thesis rests on five pillars: (1) Kalshi holds an effectively
      un-replicable U.S. regulatory asset—the only CFTC-designated DCM purpose-built for retail
      event contracts; (2) the prediction market category is demonstrably monetizable at scale,
      with $263.5 million in 2025 fee revenue and a $1.5 billion run rate by March 2026, growth
      that rivals the fastest-scaling fintechs of the last decade; (3) Robinhood distribution
      reduces customer acquisition costs and provides a flywheel for volume; (4) the Federal
      Reserve working paper in February 2026 finding Kalshi prediction accuracy rivals traditional
      tools validates institutional adoption; and (5) at a 14.7x current run-rate multiple,
      the entry price is at a discount to Robinhood's growth-fintech multiple.

      The anti-thesis is equally sharp: (1) 89% revenue concentration in sports contracts
      directly conflicts with state gaming authority positions in at least seven states; (2) the
      company has raised $2.8 billion with no audited financials, no public profitability data,
      and no confirmed EBITDA margin—making the run-rate claim unverifiable; (3) rapid successive
      financing rounds at 2–4x step-ups in months suggest momentum-driven pricing, not fundamental
      re-rating; (4) CME Group, with 178 years of exchange infrastructure and a FanDuel/Flutter
      prediction markets JV, is entering the space with institutional relationships Kalshi cannot
      yet match; (5) Senate hearings, Democratic congressional pressure, and the Better Markets
      non-profit publicly argue that CFTC lacks jurisdiction over sports betting, increasing
      federal legislative risk.

      Thesis-break triggers that would invalidate the bull case include: any Supreme Court cert
      grant vacating CFTC authority over event contracts; passage of federal legislation explicitly
      prohibiting CFTC-regulated sports event contracts; adverse class certification in Brown v.
      Kalshi; a consent decree or enforcement action from the CFTC itself; and loss of the
      Robinhood distribution partnership. Chapter 7 documents the live litigation register;
      investors should monitor the Third Circuit ruling on state versus federal jurisdiction
      (currently on appeal) as the proximate near-term signal.
