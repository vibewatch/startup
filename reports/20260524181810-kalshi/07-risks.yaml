    {
      "id": "market-integrity-and-operations",
      "title": "Market integrity, KYC, and operational risk",
      "body": "Kalshi's market-integrity posture is publicly assertive but unevenly verifiable. The company says it runs continuous trade surveillance and identity verification on every account before funded trading is allowed, and it has launched a Market Surveillance Advisory Committee with Solidus Labs and Wharton researchers. In February 2026 it banned current members of Congress, congressional candidates, and political operatives from trading the markets they can influence, framed as a response to insider-trading concerns. The CFTC's March 2026 enforcement advisory reinforces that anti-manipulation rules apply to event-contract trading, and the House Oversight probe and Finance Magnates reporting indicate that Congress is actively asking whether Kalshi's KYC and surveillance practices are sufficient. The customer-experience layer compounds the picture: public app-review surfaces continue to flag withdrawal delays and disputed settlements, and Kalshi's terms of service impose mandatory arbitration and reserve broad discretion to suspend trading and resolve markets. The Arizona-linked $54 million Khamenei dispute illustrates how settlement integrity can convert quickly into criminal-style headlines, civil exposure, and class-action ammunition. Crucially, almost all of Kalshi's market-integrity disclosures rely on company sources rather than independently audited assurance, leaving residual uncertainty about how often surveillance actually triggers and how disputes are resolved. The operational/quality/security risk register quantifies these failure modes and the maturity of mitigations.",
