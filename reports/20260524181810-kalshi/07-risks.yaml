      "id": "regulatory-and-legal-status",
      "title": "Regulatory posture and federal status",
      "body": "Kalshi sits inside one of the most actively litigated regulatory perimeters of any 2026 fintech. The company is registered with the Commodity Futures Trading Commission as both a Designated Contract Market and a Derivatives Clearing Organization, which means it is regulated under the Commodity Exchange Act core principles rather than under state gaming law. In September 2024 the D.C. District Court vacated the CFTC's denial of Kalshi's congressional-control event contracts, and in May 2025 the CFTC formally withdrew its appeal, effectively ending federal opposition to political prediction markets traded on a registered exchange. That posture is materially helpful for Kalshi's product set, but it has also drawn sharp criticism from independent watchdogs such as Better Markets, who argue that the CFTC has retreated from election-integrity oversight. In March 2026 the CFTC issued a prediction-markets enforcement advisory clarifying that its Section 6(c)(1) and Rule 180.1 anti-manipulation authority reaches event-contract trading, which keeps federal enforcement risk live even though the existential election-contracts fight is now resolved. Democratic lawmakers separately urged the CFTC in April 2026 to reopen its scrutiny of Kalshi and Polymarket, and the House Oversight and Financial Services committees opened a formal probe in May 2026 of KYC and trade-surveillance practices. Federal status is therefore not an unmanaged risk, but it is also not closed: any reversal of CFTC posture, or any new legislation aimed at officials or sports contracts, would directly hit Kalshi's revenue base.",
