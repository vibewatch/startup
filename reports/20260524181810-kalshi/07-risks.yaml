    {
      "id": "litigation-portfolio",
      "title": "Active litigation portfolio across states, tribes, and class actions",
      "body": "Even with federal pressure receding, Kalshi is fighting a multi-front state and private-litigation campaign. The Massachusetts Attorney General won a preliminary injunction in January 2026 that blocks Kalshi from offering sports event contracts to Massachusetts residents. A Maryland federal court declined in August 2025 to enjoin state regulators from enforcing gaming laws against Kalshi, and a Nevada federal court ordered Kalshi to stop offering its sports prediction contracts in the state in November 2025, with the Ninth Circuit declining to stay the injunction in February 2026. Kalshi has counter-sued Montana after a second cease-and-desist order, and the Third Circuit ruled in April 2026 that Kalshi may continue offering sports contracts in New Jersey during appeal. Tribal entities including the Ho-Chunk Nation have filed federal lawsuits arguing that Kalshi's sports markets violate exclusivity compacts, and tribal coalitions have filed amicus briefs in the Third Circuit. Brown v. Kalshi, a proposed federal class action filed in April 2026, alleges Kalshi runs an unlicensed sports betting platform under the label of event contracts. Arizona criminal-style enforcement against traders involved in a disputed $54 million Khamenei market adds a settlement-integrity dimension. At least seven states have issued cease-and-desist orders or filed enforcement actions by mid-2026, and Kalshi has lost on the merits in at least two state-focused federal proceedings (Nevada and Maryland) even as it has won the broader federal election-contracts fight. The litigation register table enumerates the major matters tracked on 2026-05-24.",
