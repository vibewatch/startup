      "id": "unresolved-risks-and-monitoring",
      "title": "Unresolved risks, monitoring indicators, and kill criteria",
      "body": "Several risks remain explicitly unresolved as of 2026-05-24 and deserve formal monitoring. Federal preemption of state gaming laws over event contracts is not settled at the Supreme Court level; absent a cert grant and merits ruling, Kalshi must litigate state-by-state for years. Plaintiffs in Brown v. Kalshi argue that sports event contracts are functionally sports betting and should be regulated as such, directly contradicting Kalshi's federal-jurisdiction defence, and class certification or a large settlement would create real financial exposure. CEO Tarek Mansour is the public face of Kalshi's regulatory, political, and fundraising posture, so a key-person event could materially impair execution capacity precisely when the company is fighting on many fronts. Public documentation does not disclose Kalshi's cash runway or litigation-cost cushion, which is itself a diligence gap. The mitigation and kill-criteria table sets monitorable triggers (SCOTUS cert grant, federal legislation reaching markup, a key-state federal injunction in a top-five sports-betting state, a CFTC enforcement action against Kalshi itself, key-person events, and adverse class certification) and a corresponding action implication for each. Together with the risk heatmap and transmission map, these triggers turn an otherwise sprawling risk surface into a tractable monitoring loop that an investor can run quarterly.",
