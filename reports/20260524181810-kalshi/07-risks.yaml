    {
      "id": "business-and-dependency-risks",
      "title": "Business-model, partner, and dependency risks",
      "body": "Kalshi's commercial exposure is concentrated in two ways that legal risk amplifies. First, Sacra estimates that roughly 89% of Kalshi's 2025 fee revenue came from sports event contracts, the exact category that state regulators, tribal coalitions, and class-action plaintiffs are attacking. Second, independent coverage describes Robinhood's prediction-markets hub as driving a disproportionate share of Kalshi's daily contract volume, which concentrates distribution risk on a single broker partner. Webull is a meaningful but smaller secondary channel, and the institutional access stack (Tradeweb, Clear Street) is still narrowly counterparty-dependent. On the political and policy side, casino and tribal gaming lobbies, led by the American Gaming Association, are urging Congress to constrain prediction markets, and Kalshi has launched Americans for Fair Markets and materially increased its federal lobbying spend in 2026 to counter that opposition. The combination of regulatory concentration (CFTC), revenue concentration (sports), distribution concentration (Robinhood), and litigation concentration (state and class actions) means that a single adverse shock can transmit quickly through the business model. The dependency map and partner risk register show the principal counterparties and how each contributes to that exposure.",
