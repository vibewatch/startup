    "number": 7,
    "title": "Risks",
    "summary": "Kalshi's risk profile is dominated by an unusually broad legal and regulatory exposure surface: while the federal election-contracts fight is effectively resolved in Kalshi's favour after the CFTC withdrew its appeal in May 2025, the company is simultaneously fighting state injunctions (Massachusetts, Maryland, Nevada, Montana), tribal lawsuits (Ho-Chunk, Third Circuit amicus), a federal class action (Brown v. Kalshi), Arizona criminal-style exposure around a $54M Khamenei market, and a formal House Oversight / Financial Services probe of KYC and surveillance. Roughly 89% of 2025 fee revenue came from the sports-contract category that state regulators and class-action plaintiffs are attacking, and Robinhood's prediction-markets hub concentrates distribution risk on a single broker. Market-integrity disclosures rely on company sources rather than independent audits, and CEO Tarek Mansour personifies regulatory and capital-markets posture. The chapter ranks these risks, maps how they transmit into revenue, customers, and valuation, and sets monitorable kill criteria (SCOTUS cert, federal legislation, key-state injunctions, CFTC action against Kalshi itself, key-person events, and adverse class certification) that an investor can track quarterly."
  },
  "sections": [
