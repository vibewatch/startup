      - - 供应链韧性
        - 晶圆代工、封装、内存和出口管制敞口图
        - 政策敏感型硬件业务可能败在依赖链上
        - 索取运营和法律风险备忘录
      - - 治理和投资者保护
        - 董事会权利、关联方政策、少数股东保护、冲突管理
        - 公平评估 NIO 控制的供应商，必须先看这些安排
        - 索取治理文件和附函摘要
    notes: 如果不完成这些追问，新投资者大多只是在承保可选性，而不是透明经济性。
    claimRefs:
      - CV007
      - CV010
      - CV012
      - CV033
      - CV038
      - CV039
      - CV040
