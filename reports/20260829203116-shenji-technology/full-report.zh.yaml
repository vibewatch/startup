            body: >-
              Shenji 的产品已不再只是单颗旗舰自动驾驶芯片。到 2026 年中，公开证据显示，公司围绕使用场景而不只是单一车型项目，排布出一组相关算力产品。装机重心仍是面向 NIO 和 Onvo 车内辅助驾驶的
              NX9031 / NX9031X，但 WAIC 2026 把可见产品图谱扩展到面向具身智能和先进制造的 NX9031U、面向智能体推理的 NX9031C，以及作为智能感知芯片的
              NX6031。这一点改变了尽调应如何界定业务。Shenji 最适合被理解为一个从 NIO 车载算力基础长出来的领域专用 AI
              硅平台，而不是一个一次性的内部料号。不过，公开表面并不均衡。公告、展示材料和架构宣称反复出现，但还没有面向外部客户的公开商用产品目录，也没有标准化零部件规格、价目表、软件文档或支持 SLA。
