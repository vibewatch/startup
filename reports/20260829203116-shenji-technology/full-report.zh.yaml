      - number: '8.2'
        title: 当前估值背景与证据充分性
        blocks:
          - type: paragraph
            body: >-
              最好的估值锚不是媒体最乐观的简写，而是 2026 年 2 月官方交易。NIO 和 Shenji 披露了 RMB 2.257 billion 的新增现金投资，以及融资后 NIO 持股 62.7%、外部投资人
              27.3%、10% 留作激励结构。CnEVPost 和 AInvest 都明确从这个结构推导出约 RMB 8.27 billion 的隐含投后估值。 Yicai 和其他二级报道把业务四舍五入到近 RMB 10
              billion，或约 $1.5 billion，方向一致但精度较低。这个差异重要，因为它决定入场纪律。 约 RMB 8.27 billion
              的估值看上去还能作为战略资产估值自洽；如果按更高的取整数字买入，投资人就更重地押注平台选择权和未来外部商业化。
              问题在于，公开证据尚未把出货、战略重要性和独立外销芯片经济性串起来。因此，投资人有一个可信估值锚，但还没有足够证据支持激进的倍数扩张。
            claimRefs:
              - CV001
