        title: 牵引力代理指标、集中度与缺口
        blocks:
          - type: paragraph
            body: >-
              Shenji 的公开牵引力数据在方向上有用，但经济含义不完整。出货和部署数字说明芯片项目真实且在放量：截至 2026 年 2 月披露的 NX9031 累计出货超过 150,000 颗，2026 年 4 月
              Onvo L90 上市时超过 200,000 颗，WAIC 2026 时 NX9031X 出货超过 300,000 颗。与此同时，NIO 的交付更新说明这个内部生态仍在增加大量月度整车销量，包括 7 月超过
              35,000 辆、第二季度超过 107,000 辆。ONVO 强劲销量和改款旗舰发布也能吸收更多自研芯片。但这些既是增长信号，也是集中度信号。可见订单簿仍压倒性地绑定 NIO 控制的品牌，公开来源仍没有提供
              Shenji 独立收入、外部客户收入占比、毛利率或经审计员工数。即便 NIO 经审计的 Form 20-F，也只确认母公司层面陈述，而不是 Shenji
              自身账目。对尽调而言，这意味着业务拥有强运营代理指标，但披露质量弱。
