      - number: '6.2'
        title: 采用轨迹与量产证明
        blocks:
          - type: paragraph
            body: >-
              采用轨迹真实存在，但最好通过部署面而不是独立客户数披露来衡量。官方和行业来源显示，截至 2026 年 2 月，NX9031 累计出货超过 150,000 颗；到 2026 年 4 月 Onvo L90
              交付更新时超过 200,000 颗；到 WAIC 2026，NX9031X 在 NIO 和 Onvo 车型上的出货超过 300,000 颗。NIO 的交付更新进一步说明这些里程碑为何重要：2026
              年母公司生态仍在增加大量月度整车销量，包括 7 月超过 35,000 辆、第二季度超过 107,000 辆。Onvo L90 的发布路径尤其有用，因为它带来量产、展厅和试驾证据，而不只是管理层叙述。官方 Onvo
              L90 页面也在产品叙事中确认 Shenji 是标准智能驾驶硬件。这些来源合在一起，强有力地证明 Shenji 已经越过原型阶段，进入规模化、面向客户的部署，即便客户集合仍很窄。
