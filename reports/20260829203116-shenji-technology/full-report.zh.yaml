      - number: '1.4'
        title: 资本化、里程碑与未决风险
        blocks:
          - type: paragraph
            body: >-
              2026 年 2 月融资是 Shenji 从内部实验走向外部定价资产的最清晰证明。NIO 官方披露显示，RMB 2.257 billion 新资金注入 Shenji 新发行股份，NIO 保留 62.7%
              持股，外部投资者获得 27.3%，另留 10% 股权激励池用于留住人才。二级报道把这换算为约 RMB 8.27 billion 投后估值，一些英文报道则把数字四舍五入到 RMB 10 billion 附近，或约
              US$1.5 billion。战略逻辑很直接：一个据报道耗费数十亿人民币的芯片项目，现在可以分担融资压力并寻找外部客户。风险也同样清楚。外部授权到 2025 年底才开始，2026 年 3 月关于与
              Leapmotor、Geely 洽谈的报道仍属前瞻；更怀疑的分析认为，如果收入仍主要由 NIO 内部消化，估值可能跑在独立经济性之前。因此，Shenji
              进入后续章节时呈现出异常强的技术和战略动能，但独立商业证明仍不完整。
