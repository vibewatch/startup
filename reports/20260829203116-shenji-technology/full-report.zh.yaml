      - number: '1.3'
        title: 产品基础、部署与规模信号
        blocks:
          - type: paragraph
            body: >-
              Shenji 档案里最强的证据是产品已经落地。NIO 和多家独立媒体把 NX9031 描述为 5nm 车规级智能驾驶芯片，拥有超过 50 billion 个晶体管、32 核 CPU 架构、LPDDR5x
              支持、546 GB/s 带宽，NIO 称其算力相当于四颗 Nvidia Orin-X。这些说法不只是概念；公开来源把该芯片与 ET9 的真实部署相连，随后又连接到 NIO 和 Onvo
              车型的扩展。规模披露在方向上很重要：NIO 称截至 2026 年 2 月，NX9031 累计出货超过 150,000 颗；WAIC 期间的报道则把 NIO 和 Onvo 车型上 NX9031X 的披露装机量提高到
              300,000 颗以上。Shenji 还把叙事从驾驶扩展到 NX9031U、NX9031C 和 NX6031。这还不能证明广泛的第三方变现，但足以证明 Shenji
              建在真实量产芯片项目之上，而不是只停留在演示文稿里。
