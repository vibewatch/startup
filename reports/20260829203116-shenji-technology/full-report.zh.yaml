      - number: '7.5'
        title: 缓释因素、监测项与否决标准
        blocks:
          - type: paragraph
            body: >-
              Shenji 并非没有缓释因素。外部投资者已经验证这项资产可以融资，NIO
              的全栈组织提供内部部署杠杆，出货里程碑也说明技术已经跨过有意义的真实世界门槛。但缓释成熟度并不均衡。很多缓释因素对内部自用最强，对外售扩张较弱。例如，全栈集成有助于 NIO 车内产品表现，但不能单独解决竞争
              OEM
              对治理的不适。同样，大出货量证明规模，但不能证明外部收入耐久，也不能免疫未来出口限制。有纪律的投资者因此应监测明确否决标准：没有具名第三方量产客户；美国围绕中国关联先进计算的政策姿态恶化；安全或支持文档不足以支撑外部
              OEM；以及 NIO 自身经营优先级挤压 Shenji 路线图。公司的上行空间取决于能否把证明转化为可迁移性；否决标准基本都跟踪这一转化失败。
