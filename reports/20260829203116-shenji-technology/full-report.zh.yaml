      - number: '6.3'
        title: 外部商业化与扩张
        blocks:
          - type: paragraph
            body: >-
              外部商业化已经可见，但仍处早期。最强的公开证明是，NIO 在 2025 年底开始对外进行 Shenji NX9031 技术授权，把至少一部分芯片投入从内部成本中心转成商业产品。到 2026 年 3 月，多家媒体称
              Shenji 和 Axera 正向包括 Leapmotor、Geely 在内的车企推介 M97
              芯片，并预计由合资公司负责出货。这有意义，因为它显示的是上市路径意图，而不只是开放式战略选择权。与此同时，公开记录仍未达到真正的客户多元化里程碑。本报告审阅的来源没有提供已签署的量产定点、量产预测、外部积压订单，或使用
              Shenji 芯片规模化运营的具名 robotaxi 客户。WAIC 2026
              把可触达客户叙事扩展到机器人和智能体工作负载，但那里的公开客户证明仍是管线，而不是采用。因此，投资者应把外部客户活动视为有希望的漏斗顶部进展，而不是成熟扩张收入。
            claimRefs:
