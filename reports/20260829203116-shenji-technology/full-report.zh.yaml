      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求驱动力很扎实。多个市场来源都描述了 AI 算力需求的上升：车辆从传统 ADAS 走向软件定义、传感器更丰富的 L2+、L3，并最终迈向 L4 架构。安全监管、域集中化、更复杂的感知栈，以及 OEM
              对本土供应链的兴趣，都会推动车规级 AI 算力需求。同时，约束同样重要。汽车芯片要经历多年认证周期，流片和验证成本高，在电动车内部还要承受苛刻的热和功耗要求。Nvidia、Mobileye、Horizon
              等既有玩家不只比 TOPS，也比软件工具链、安全认证历史、OEM 集成和支持生态。Shenji 因此享受真实宏观顺风，但市场转化要看其平台能否为 NIO 自身项目之外的买家跨过这些非硅壁垒。这也是为什么公开第三方
              SOM 证据仍是市场分析的主要缺口，而不是原始市场规模本身。
