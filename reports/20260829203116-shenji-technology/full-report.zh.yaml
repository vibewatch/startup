      - number: '8.4'
        title: 可比公司、退出就绪度与最终判断
        blocks:
          - type: paragraph
            body: >-
              可比分析的主要作用，是说明 Shenji 不是什么。它还不是 Mobileye、Nvidia 或 Qualcomm 这样按上市公司方式披露的芯片公司；后者定期提供审计或上市公司文件，
              生态能见度也深得多。它也不只是 NIO 的一个运营部门，因为外部投资人已经给它单独定价。正确结论是：Shenji 应被视为一家战略型私有半导体平台，
              有真实证据，但外销成熟度不完整。这对应的是观察，而不是投资或放弃。放弃会忽视真实资产质量；直接投资则会夸大当前关于经济性和多元化的证据。 退出就绪度也有限：在 Shenji
              披露更清晰的独立指标，或拿下具名外部量产客户之前，没有强公开依据可以假设估值快速上调、IPO 准备就绪或老股流动性容易实现。 下一步信心大概率来自尽调，不来自讲故事。
