      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              到 2026 年，监管和法律风险已经从背景担忧变成现实议题。最明确的催化剂是美国国防部 2026 年 6 月发布 Section 1260H “Chinese military companies”
              清单，其中包括 NIO。NIO 随即回应称该清单不是制裁清单，不会影响业务，并保留采取法律行动的权利。两点可以同时成立。该清单未必直接禁止证券交易或现有运营，但它仍会给任何嵌在 NIO
              战略栈里的业务带来声誉、采购和尽调阻力。与此同时，BIS 及配套法律指引在 2026 年再次确认，针对中国关联实体的先进计算出口规则仍在运行。Shenji
              的具体代工厂和制造链没有公开披露，因此投资者无法清楚标出哪些管制今天适用，哪些只会在未来制度收紧时变得重要。正确结论不是 Shenji 今天被堵住了，而是它的法律和监管暴露很实质，且公开表面只显示了一部分。
