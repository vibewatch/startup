        title: 规模口径：市场很大，定义差异也大
        blocks:
          - type: paragraph
            body: >-
              这一类别的公开市场规模估计差异很大，因为不同发布方测量的东西不同。Future Market Insights 把广义汽车 SoC 市场估为 2026 年约 USD 22.8 billion；DIResearch
              对自动驾驶 SoC 的口径约为 2026 年 USD 33.0 billion；Semiconductor Insight 更窄的自动驾驶 SoC 口径只有 USD 6.8 billion。另一个
              Semiconductor Insight 口径则把 ADAS SoC 子市场估为 2026 年 USD 9.2 billion。这些数字本身并不必然错误，只是范围定义不同。因此，默认情况下不应拿最宽口径数字给
              Shenji 做基准。真正可投资的问题不是汽车算力总量是否巨大，而是未来几年 Shenji 现实能服务哪一块。今天公司明确服务 NIO 和 Onvo 内部的高端 EV 项目，也表达了进入更高算力相邻场景和外部
              OEM 授权的兴趣。公开证据尚不足以支撑干净的自下而上 SOM，因此本章保留区间，而不是制造虚假的精确度。
