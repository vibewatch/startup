  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: Shenji 实际切入的市场边界
        blocks:
          - type: paragraph
            body: >-
              分析 Shenji 时，应把它放在高算力车载 AI 栈里，而不是拿整个汽车半导体市场作参照。边界包括自动驾驶和 ADAS SoC、域控制器、传感器融合算力、具备功能安全能力的车载 AI
              处理器，以及软件定义汽车所需的系统集成逻辑。信息娱乐专用 SoC、电池管理芯片、车身控制器、通用 MCU 和大多数非 AI 车规硅都不在边界内。这个区分很关键，因为宽口径汽车 SoC
              市场报告常把座舱、连接、动力总成和 ADAS 需求混在一个数字里，而 Shenji 目前的产品证明集中在智能驾驶算力，以及相邻的具身智能雄心。NIO
              自身的全栈材料也强化了这一点：公司卖的是系统级承诺，包括自研智能驾驶芯片、高性能感知、域融合和软件集成。因此，Shenji 的可触达市场有意义，但明显窄于泛化的车载芯片 TAM 叙事，并且仍高度取决于中国 OEM
              是否想要 Nvidia 级自动驾驶算力的国产替代。
