  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险框架
        blocks:
          - type: paragraph
            body: >-
              对 Shenji 的最高风险解读，并不是芯片跑不起来。公开证据已经显示真实装车、可观出货和持续投入。更严肃的问题是，Shenji
              能否在政策敏感的供应链、高度集中的客户基础和有限的公开商用供应商披露之间，继续规模化交付先进车载硅。对投资者来说，这些风险传导很快：供应商或出口摩擦可能影响路线图节奏，客户集中会放大任何 NIO
              放缓，薄弱的第三方文档会拖慢外部 OEM 转化。重要的是，风险栈彼此相连。一家公司可以有强内部验证，同时仍让第三方因治理、支持义务或美国政策悬而未决而在商业上犹豫。因此，Shenji
              更不像一个二元技术赌注，更像一层层执行和依赖叠起来的故事；即便证明点在增加，风险负担仍高。
