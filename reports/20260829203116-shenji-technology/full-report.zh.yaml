      - number: '5.5'
        title: 信任、质量与合规面
        blocks:
          - type: paragraph
            body: >-
              信任和质量已有部分证据，但文档并不完整。最具体的公开质量信号是车规级制造表述、量产部署，以及至少一篇报道称 NX9031 符合 ASIL-D 风险和安全要求。NIO
              更广义的官方材料也强调全栈研发、测试中心、高性能感知单元，以及通用平台和自研芯片平台之间同步的软件发布。这些信号支持一个判断：Shenji
              嵌在严肃的系统工程组织里。但这些不能替代产品级文档。本报告审阅的公开材料没有披露详细认证材料、失效率、良率、现场退货统计、公开安全论证文件、网络安全证明，或 Shenji
              作为独立供应商面向外部集成商的支持政策。这意味着产品成熟度足以支撑母公司部署，但外部买家若要把 Shenji 当作多车型半导体供应商依赖，仍需要一座连接安全验证、软件维护和长期支持义务的尽调桥。
