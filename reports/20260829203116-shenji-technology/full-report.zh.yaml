      - number: '6.5'
        title: 集中度、扩张循环与采购摩擦
        blocks:
          - type: paragraph
            body: >-
              客户集中度仍是 Shenji 最大的客户质量弱点。几乎所有可见量产证明都绑定 NIO 控制的品牌，这带来两类相互牵连的风险。第一，Shenji 的需求前景高度依赖 NIO
              自身产品节奏、交付执行，以及继续支持自研芯片路线的意愿。第二，外部 OEM 可能不愿依赖一个由竞争车企控制的供应商，尤其在公开文档、支持政策和治理保护都很薄的情况下。因此，扩张循环清楚但脆弱：先在 NIO
              内部证明价值，再延伸到 Onvo，用量产可信度接触外部 OEM，之后才追逐更广义的具身智能客户。这条链上任何一环断裂——外部转化慢、NIO 产品疲软，或买方对内供式治理不舒服——都会让 Shenji
              卡在集中度很高的准内供模式里。这不否定已经取得的牵引力，但说明客户故事仍更关于验证和集中，而不是广泛客户耐久度。
