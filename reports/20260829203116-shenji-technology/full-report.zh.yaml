  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局：谁真正与 Shenji 竞争
        blocks:
          - type: paragraph
            body: >-
              Shenji 不是在与一个单一的“AI 芯片市场”竞争。它面对的格局至少可以拆成五类有意义的竞争者。第一类是 Nvidia，这个全球既有玩家拥有从训练、仿真到车载算力最完整的端到端栈。第二类是
              Mobileye，它用高度集成、低功耗的 ADAS 和自动驾驶硅，与深厚 OEM 关系竞争。第三类是 Horizon Robotics，中国本土最醒目的车载算力专家，正在把 Journey 6
              系列推向多个算力档位和量产合作。第四类是 Qualcomm，它通过 Snapdragon Ride 和更广义的 Digital Chassis 切入市场，强调跨域集成。第五类是 Black
              Sesame，这家中国挑战者依靠 Huashan 系列推动开放生态，并逐步强化全球化定位。Shenji 与这些玩家并列，但来源是垂直整合的内部项目，目标是把 NIO
              内部成功转化为更广泛的平台可信度。因此，正确比较不只是 TOPS，而是买方信任、验证历史、软件工具链和可规模化 OEM 采用证据。
