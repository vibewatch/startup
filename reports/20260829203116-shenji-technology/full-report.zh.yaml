  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、来源与战略角色
        blocks:
          - type: paragraph
            body: >-
              Shenji Technology 更应被理解为 NIO 多年自动驾驶芯片投入的正式商业化外壳，而不是一家常规从零起步的创业公司。公开报道将主体识别为 Anhui Shenji Technology Co.,
              Ltd.，英文也称 GeniTech，2025 年 6
              月在合肥注册，经营范围围绕集成电路芯片设计和销售。无论官方材料还是独立报道，对这次剥离的战略目的表述基本一致：把一个昂贵的内部芯片项目放进能融资、能做员工股权激励、并最终服务 NIO
              之外买家的结构里。关键在于，芯片项目最初的合理性是纵向整合、控制成本、降低对 Nvidia 的依赖；到 2026 年，叙事已经升级为横跨自动驾驶、具身智能和智能体推理的更广义 AI
              硅平台。因此，公开信息已经支撑后续章节的三个核心身份判断：Shenji 由 NIO 控股，根植于 NIO 车型路线图，并正从隐形研发成本中心转向独立半导体资产。
