  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与价格
        blocks:
          - type: paragraph
            body: >-
              核心估值问题不是 Shenji 是否是真资产——它是。公开资料支持这样一幅图景：这是一家已融资、受 NIO 控制的拆分公司，产品已进入量产部署，
              芯片路线图在拉宽，也有足够外部投资需求给出独立估值。更难的问题是，这个估值今天还能不能给新投资人留下有吸引力的上行空间。一边， Shenji
              拥有多数年轻汽车芯片故事缺少的三件事：真实出货、足够大的母公司生态来消化产品，以及向具身智能和智能体推理扩展平台的可信路径。
              另一边，当前公开估值已经吸收了大部分叙事，却没有给投资人留下独立收入、毛利率、按收入划分的客户集中度、外部合同耐久性等基本投资测算输入。 合理姿态因此不是盲目兴奋，而是盯住价格的持续观察。
