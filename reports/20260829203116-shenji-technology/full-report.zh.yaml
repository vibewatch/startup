      - number: '1.2'
        title: 管理层线索与治理透明度
        blocks:
          - type: paragraph
            body: >-
              管理层能见度既是 Shenji 的强项，也是缺口。公开来源中最明确的具名经营者是白剑，他被识别为 NIO 芯片与智能硬件负责人，也是 Anhui Shenji 的法定代表人。William Li
              仍是战略赞助人，因为 Shenji 仍由 NIO 控股，并反复被放在 NIO 的资本配置和产品战略里解释。NIO 品牌与传播副总裁马麟也在公开场合放大过芯片叙事，尤其围绕 WAIC
              2026。缺失的信息同样重要：本报告审阅的来源没有给出清晰的 Shenji 独立 CEO
              披露、董事会名单、委员会结构，或外部投资者的详细治理权利。对尽调而言，这意味着投资者可以确认技术和公司层面的支持真实存在，但还无法确认治理厚度。Shenji
              因此更像一家被战略性隔离、外部资本化程度上升的子公司，而不是一家完全透明的独立芯片公司。
