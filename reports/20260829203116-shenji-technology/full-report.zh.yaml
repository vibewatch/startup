      - number: '3.3'
        title: 切换成本、分发能力与定价透明度
        blocks:
          - type: paragraph
            body: >-
              这个市场最大的竞争壁垒不是裸硅性能，而是组织切换成本。车载 AI 算力通过漫长设计周期、安全验证、整车平台集成和支持生态销售，买方无法轻易替换。Nvidia
              受益于广泛的软件环境和系统级开发工作流，Mobileye 受益于长期嵌入 OEM 项目，Horizon 受益于中国本土量产和架构宽度，Qualcomm 则受益于跨域汽车关系。Shenji
              的内部渠道给了它一个异常有力的分发机制：不必先赢下外部 RFP，就能被设计进 NIO 和 Onvo
              车型。这让它更容易证明实车运行、成本节省和部署规模。但外部销售仍需要更艰难的跃迁。整个竞争集合的公开定价大多不透明，这本身也很说明问题：买方把 ADAS
              芯片当作长周期平台评估，而不是有货架价格的零部件。少量浮出的公开套件数据，如 Qualcomm 开发硬件，也凸显商业化路径仍然复杂且依赖合作伙伴中介。
