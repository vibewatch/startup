            body: >-
              可见架构以高性能车规级 SoC 为中心，目标是用更集成的算力层替代多芯片辅助驾驶栈。公开描述称 NX9031 采用 5nm 制程，拥有超过 50 billion 个晶体管、32 核 big.LITTLE CPU
              架构、最高 8533 Mbps 的 LPDDR5X 支持、546 GB/s 内存带宽、高动态范围 ISP，以及约 1000 TOPS 算力；NIO 将其呈现为可比四颗 Nvidia Orin-X。NIO
              也把这颗芯片放进更广的全栈架构里，与智能驾驶芯片、操作系统和智能底盘控制结合。实际运行中，芯片只是垂直整合工作流中的一层：感知、认知、规划、跨域任务调度和整车执行都在其上方或周围。系统视角是优势，因为 NIO
              能软硬件一起优化；它也是尽调难点，因为相比公开开发套件、文档或更广泛集成商工具链的竞争生态，Shenji 的公开技术表面更不开放。
