      - number: '4.2'
        title: 单位经济与成本结构
        blocks:
          - type: paragraph
            body: >-
              公开单位经济证据最强的部分在成本和资本，而不是收入质量。多个来源称 NX9031 开发耗费数十亿人民币，Yicai 将数字缩窄到约 RMB 2.3-3.0 billion，William Li
              则把这项投入类比为建设约 1,500 座换电站。对单颗芯片项目而言，这是一笔巨大的资本投入，也解释了 NIO 后来为什么寻求外部投资者。最有利的对冲是 Shenji 宣称的成本优势：Yicai 报道称，相比
              Nvidia Orin-X，单车可节省约 RMB 10,000；如果这种优势能在规模部署中保持，就能显著支撑母公司的整车经济性。缺失的是这两个事实之间的连接。公开来源没有披露 Shenji
              的毛利率、晶圆或封装经济性、良率、折旧处理、内部转移定价模型，或持续软件支持成本。因此，投资者可以说芯片项目可能改善成本结构，但还无法量化累计节省何时能在独立口径上超过累计研发投入。
