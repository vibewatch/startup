      - number: '7.4'
        title: 依赖、财务与商业风险
        blocks:
          - type: paragraph
            body: >-
              商业和财务风险主要由集中度和资本强度主导。需求基础仍压倒性地在 NIO 和 Onvo 内部，这意味着 Shenji
              依赖母公司车型节奏、母公司资本配置，以及母公司继续优先押注自研芯片的意愿。客户问题因此与财务问题无法分开。NIO 在 2026 年以 non-GAAP 经营盈亏平衡为目标，同时推出多个品牌和车型，所以
              Shenji 路线图仍暴露在更广的母公司运营压力下。2026 年 2 月融资轮减轻了即时资本负担，但没有消除未来流片、验证成本或外部客户支持需求继续要钱的风险。商用化风险进一步叠加。外部授权存在，M97
              接触也真实，但本报告审阅的来源没有确认第三方 SOP 定点。如果 Shenji 无法转化外部客户，其经济性就仍会高度依赖单一公司家族和仍不透明的内部转移定价模型。
