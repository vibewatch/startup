      - number: '8.3'
        title: 乐观、基准与悲观情景区间
        blocks:
          - type: paragraph
            body: >-
              在这里，用情景法比假装精确的收入倍数更诚实。悲观情景是假设 Shenji 主要仍服务母公司，无法转化具名外部 OEM，并继续承受政策或供应悬压；
              这时业务应低于当前私有市场估值，因为战略价值仍在，但外销选择权会收缩。基准情景是假设 Shenji 继续扩大内部部署，增加有限授权或试点收入，
              并维持当前政策条件；在这个结果下，当前官方估值大致合理。乐观情景是假设 Shenji 拿下具名外部汽车客户，证明自己具备外销级支持和安全文档能力， 并显示更宽 AI 平台叙事能在 NIO
              之外变现。这种情景可支撑高于当前估值的实质重估，但前提是证据先改善。简言之，当前价格最容易被解释为宽区间的中点， 而不是显然便宜的入场点。
