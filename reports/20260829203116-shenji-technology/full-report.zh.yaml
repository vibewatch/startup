            body: >-
              真实部署部分缓释了运营和质量风险，但披露仍不足。正面看，Shenji
              不只是一颗已流片芯片；它已经装进交付车辆，并经历了旗舰和子品牌车型的量产导入。这降低了纯技术不可行的概率。但几项运营风险仍未解决。公开来源没有披露代工关系、封装安排、良率、退货率或长期零部件承诺。2026 年 4
              月 Onvo L90 报道提醒我们，内存和高性能零部件价格能让整车经济性波动约 RMB 10,000，这意味着即便技术成功，芯片也可能因 BOM 或供应波动在放量时遇阻。公开安全证据也不完整。一个来源提到
              ASIL-D 合规，但报告表面没有公开证书、安全论证或失效率仪表盘。对内部部署而言这也许可接受；对外部 OEM 采用而言，这是实打实的尽调阻塞点。
