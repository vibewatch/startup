      - number: '3.2'
        title: 既有玩家优势与 Shenji 当前位置
        blocks:
          - type: paragraph
            body: >-
              Nvidia 仍是最难跨越的基准，因为它的价值主张在系统层，而不只是芯片层。DRIVE 栈覆盖模型开发、仿真、验证和车载算力，已经被领先车企和 robotaxi 车队选用。Mobileye
              的竞争方式不同，它优先押注高效、可扩展的车规级算力，并拿下可能延伸到未来数千万辆车的大型 OEM 项目。Horizon 在中国与 Shenji 最直接竞争，因为它把本土定位、量产规模、软硬件协同优化和覆盖 10+
              到 560 TOPS 的 Journey 6 路线图结合在一起。Qualcomm 则借 Snapdragon Ride / Digital Chassis 框架内座舱和 ADAS 工作负载的融合施压；Black
              Sesame 以国产开放生态、激进性能宣称和 BYD 线索证明推进。面对这一组对手，Shenji 的核心优势是具体部署：NX9031 系列不是假设，公开来源显示它已在 NIO 和 Onvo
              上真实装车。核心弱点是能见度：与既有玩家相比，它在软件栈成熟度、具名外部客户和量产级封装方面提供的公开证据更少。
