      - number: '4.3'
        title: 资本充足性与母公司语境
        blocks:
          - type: paragraph
            body: >-
              Shenji 2026 年 2 月融资改变了融资叙事，但没有终结融资问题。官方口径下，RMB 2.257 billion 新现金进入 Shenji 新发行股份，NIO 保持 62.7% 控制权并继续财务并表。到
              2026 年 7 月，Shenji 称自成立以来累计融资接近 RMB 3 billion。这显然减轻了 NIO
              独自资助芯片路线图的负担。但这并不意味着公司已经获得长期独立融资。车规级芯片需要反复跨节点迁移、安全验证、软件维护、客户支持，并且可能还要支持 M97 或具身智能芯片等新品。母公司背景很重要，因为 NIO 同时在
              2026 年追求 non-GAAP 经营盈亏平衡、改善整车毛利，并扩大 NIO、ONVO 和 FIREFLY 的交付。这使 Shenji
              即便在自身独立指标可见之前，也具备财务战略意义：它可以作为成本控制资产、估值重估催化剂和资本分担机制。
