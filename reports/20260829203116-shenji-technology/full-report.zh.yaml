      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Shenji 的近端买方版图异常清晰，因为它从一个受控母公司起步。NIO 和 Onvo 车型项目是即时经济锚点，芯片部署与 ET9、L90、L80 等旗舰和改款车型发布绑定。下一层买方是评估国产高算力 ADAS
              芯片的其他中国 OEM 或芯片合作伙伴，Leapmotor、Geely 的接触报道以及 Axera 牵头的 M97 项目体现了这一点。第三层包括机器人、智能体推理和智能计算用户，Shenji 从 NX9031U
              和 WAIC 2026 前后开始讨论这些方向，但从收入证明角度看，这些市场仍偏概念。在三层客户里，经济买方都不是零售车主，而是车型项目负责人、ADAS
              工程、采购、财务和平台软件负责人混合组成的组织，他们关心算力密度、热约束、功能安全、工具链成熟度和供应安全。这使车载 AI 芯片成为周期长、定点重的市场，组织摩擦远高于消费半导体。
