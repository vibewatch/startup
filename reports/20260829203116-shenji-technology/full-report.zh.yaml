            body: >-
              部署证明是 Shenji 最清晰的产品优势。这颗芯片不只是完成流片；它已经进入交付车辆和已宣布车型项目。ET9 是最早的旗舰展示，到 2026 年，NIO 官方和二级报道都称 NX9031 系列已部署或正在导入
              ES9、ES8、ET 系列改款，以及包括 L90、L80 在内的 ONVO 车型。到 WAIC 2026，Shenji 称 NX9031X 在所有 NIO 和 Onvo 车型上的累计出货超过 300,000
              颗。这种规模化路测场景比基准测试幻灯片更有意义，因为它意味着芯片已进入真实 ADAS 工作流、热管理和软件发布验证。路线图也在变宽。Shenji 预览 NX9031U，发布 Ruidong
              和分布式智能体平台，并据报道正与 Axera 开发面向更广外部客户的 M97 芯片。开放问题在于，路线图会变成真正的多客户平台，还是主要停留在以 NIO 为中心、带选择性外部变现的技术树。
