  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现面
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Shenji 目前可能通过两条路径变现，但只有一条被清楚证明。第一条是把芯片部署到 NIO 和 Onvo 车型中，经济价值可能体现为内部转移定价、相对 Nvidia 的 BOM
              节省，以及对更高毛利智能驾驶功能的支撑。第二条是通过授权或向第三方供货实现外部变现，这条路径到 2025 年底才变得可见，披露仍很薄。CarNewsChina 报道称，单项 IP 授权可能价值数百万美元，系统级
              SoC 授权可能达到数亿美元，但这些数字描述的是潜在交易规模，而不是已确认合同收入。这个区分很关键。即便外部商用芯片收入仍小，Shenji
              已经具备经济相关性，因为它影响母公司成本结构和技术控制。但在公开报道把内部经济贡献与外部销售拆开之前，应把这门业务视为一个正在商业化的故事，而不是一家变现透明的外售型半导体公司。
