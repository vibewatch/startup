      - number: '2.5'
        title: 市场证据仍不能证明什么
        blocks:
          - type: paragraph
            body: >-
              现有市场证据足以证明方向，但还不能精确证明变现。它显示软件定义汽车正在提高算力强度，中国 OEM 有战略理由摆脱对外国供应商的依赖，Shenji 也已经通过 NIO 和 Onvo
              拿到相当大的内部基础。它还没有证明 Shenji 能在这个生态之外赢下多大比例的更广义可触达市场，也没有说明未来需求中会有多少留在信息娱乐或低算力安全系统等 Shenji
              甜区之外的场景，更无法证明具身智能和智能体推理相邻业务会在短期内成为收入池，而不是叙事延伸。做估值时，正确结论是有纪律的乐观：用宽口径市场数字说明品类顺风，但用更窄的 ADAS
              和自动驾驶算力切片锚定投资判断。在定点、价格和外部客户转化更清晰之前，Shenji 的市场机会可证明很大，但商业化仍只完成了一部分。
