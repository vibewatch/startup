      - number: '5.4'
        title: 差异化与依赖面
        blocks:
          - type: paragraph
            body: >-
              Shenji 的差异化在车载硅最常卡住的地方最强：量产证明、与真实整车栈集成，以及经济动机。公开来源一贯把 NX9031 描述为 NIO 降低对 Nvidia
              依赖、同时实现高算力密度和更低单车成本的路径。平台叙事也在改善，因为 Shenji
              正把车载算力重新包装进具身智能和智能体推理场景。依赖项仍然很多。公开披露没有说明芯片家族背后的晶圆代工厂、封装或长期供货协议。一些报道称，NIO
              在首颗芯片报道时没有被列入黑名单，因此仍可接触海外制造伙伴；这条信息有参考价值，但不是耐久保证。与 Nvidia、Qualcomm 和 Horizon 相比，Shenji
              公开披露的开发者工具和生态文档也少得多。换句话说，产品在 NIO 栈内看起来很强，但关于可迁移性和第三方赋能的公开证据明显更薄。
