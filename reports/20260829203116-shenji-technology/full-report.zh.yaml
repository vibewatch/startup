  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Shenji 的客户基础应按控制权和变现方式分层，而不只按终端市场分。第一层、也是被压倒性证明的客户，是 NIO 自有生态：使用 Shenji 芯片作为智能驾驶栈一部分的 NIO 品牌旗舰和改款车型。第二层是
              Onvo，它仍受 NIO 控制，但像一个不同的内部渠道，因为它把装机基础扩展到更偏性价比的子品牌。第三层是潜在外部车企客户，例如 Leapmotor 和 Geely；公开证据显示 Shenji
              正积极推介并做平台准备，但还没有确认的量产定点。第四层是相邻的非汽车 AI
              客户，面向具身智能或智能体推理；这些客户属于路线图叙事的一部分，但目前缺少具名量产用户。这个分层很重要，因为业务已经跨过内部部署的证明门槛，却还没跨过能实质降低客户集中度风险的多元化门槛。
            claimRefs:
              - CU001
