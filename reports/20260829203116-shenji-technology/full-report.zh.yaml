      - number: '6.4'
        title: 留存、耐久度与证据质量
        blocks:
          - type: paragraph
            body: >-
              留存能见度很弱，尽管部署能见度很强。由于 Shenji 主要嵌在 NIO 控制的渠道里，合同期限、续约机制、NRR、GRR
              和客户满意度在公开表面上大多不可见。内部耐久度可以从改款车型线的持续导入中推断，但这不等于透明的留存数据。Onvo L90 的首批用户，以及 Shenji 持续向 NIO 和 Onvo
              扩展，表明平台承诺存在；官方产品页面也暗示 Shenji
              没有被当作实验性选项。但本报告审阅的来源没有披露芯片级渗透率、按配置版本划分的搭载率、外部授权续约条款，或第三方买家的现场满意度指标。对尽调而言，关键区分在于内部架构承诺的持续性，和来自外部客户的商业留存证据。Shenji
              在前者上得分高，在后者上披露很差。
