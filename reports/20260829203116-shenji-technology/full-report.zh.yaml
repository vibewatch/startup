      - number: '3.4'
        title: 护城河耐久度、反向证据与 Shenji 可能失手之处
        blocks:
          - type: paragraph
            body: >-
              Shenji 今天的护城河真实存在，但仍有条件。最强的一层是 NIO 生态本身：母公司愿意吸收早期设计风险，车型线能产生活跃部署数据，国产叙事也契合中国提高本土半导体含量的方向。下一层是性能和成本叙事，尤其是
              NX9031 具备四颗 Orin-X 级算力且能节省单车成本的说法。但几类风险会很快侵蚀这条护城河。如果外部 OEM 更愿意在 Horizon、Black Sesame、Qualcomm 和 Nvidia
              之间双源采购，而不是押注一个与 NIO 绑定的供应商，Shenji 的内部优势可能无法外溢。如果买方认为软件成熟度和安全验证工具链比性能更重要，Nvidia 和 Mobileye 仍会占上风。如果 Shenji
              向机器人和智能体推理的扩张主要停留在叙事，它可能被视为一个较窄的内部芯片项目，却按独立平台估值。AI Weekly 的反向评论已经指向这一方向，认为 NIO 自身生态之外，更大平台叙事的证明仍不均衡。
