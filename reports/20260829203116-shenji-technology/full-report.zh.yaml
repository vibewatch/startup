      - number: '4.5'
        title: 财务结论
        blocks:
          - type: paragraph
            body: >-
              因此，财务结论是复杂但仍值得进一步尽调。Shenji 并不像上市半导体公司那样财务清晰。它的财务可读性来自 NIO
              内部战略资产身份：项目有真实规模、沉没成本高、具备真正的降本潜力，也刚完成外部资本分担。这已经不只是叙事。但证据仍不足以支撑独立经济性判断。外部授权真实到值得纳入考量，但披露不足以建模。母公司盈利改善和销量增长带来有利经营背景，但
              Shenji 的精确贡献仍未知。资本充足性已有改善，但如果 Shenji
              要成为外售平台，未来芯片和外部客户支持几乎肯定需要超过首轮外部融资的资金。投资者因此应把公开财务证据视为支持性但不完整，并在形成强投资判断之前，要求数据室级别的桥接，说明芯片出货如何转化为确认收入、毛利率和现金需求。
