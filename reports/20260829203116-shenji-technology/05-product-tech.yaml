- id: deployment-integration-and-roadmap
  title: Deployment, Integration, and Roadmap
  body: Deployment proof is Shenji’s clearest product advantage. The chip is not merely taped out; it has been carried into shipping and announced vehicle programs. The ET9 was the initial flagship showcase, and by 2026 NIO officials and secondary reporting described the NX9031 family as deployed or rolling out across ES9, ES8, ET-series refreshes, and ONVO models including the L90 and L80. By WAIC 2026, Shenji said cumulative NX9031X shipments exceeded 300,000 across all NIO and Onvo models. That kind of scaled field exposure is more meaningful than benchmark slides because it implies validation inside real ADAS workflows, thermals, and software releases. The roadmap also appears to be widening. Shenji previewed NX9031U, launched Ruidong and a distributed agent platform, and was reported to be developing the M97 chip with Axera for broader external customers. The open question is whether the roadmap becomes a genuine multi-customer platform or remains primarily a NIO-centered technology
    tree with selective external monetization.
  claimRefs:
