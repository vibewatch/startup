  rows:
  - - NX9031 / NX9031X assisted-driving SoC
    - NIO and Onvo intelligent-driving stack
    - Mass produced and deployed
    - High compute density in a proven vehicle stack; positioned as replacement for multi-Orin solution
    - No public merchant datasheet, pricing, or external support SLA
  - - NX9031U intelligent computing chip
    - Embodied intelligence / advanced manufacturing developers
    - Previewed publicly at WAIC 2026
    - Up to 800 TOPS with rich interfaces and air cooling for non-vehicle AI scenarios
    - No public customer list or production timeline
  - - NX9031C agent-inference chip
    - Agent / distributed AI workloads
    - Showcased publicly
    - Extends product family beyond driving into agent inference
    - No public specs sheet or deployment proof reviewed
  - - NX6031 sensing chip
    - Vehicle sensing / lower-end edge tasks
    - Shown at WAIC 2026
    - Broadens line beyond high-end AD compute
    - Few public technical details
  - - M97 co-developed chip
    - External OEMs / broader auto customers
    - Tape-out reported; Q3 release target in 2026 reporting
    - Designed for wider customer base and 700+ TOPS class performance
    - Need confirmation of release, SDK, and SOP customers
  notes: Shenji’s product surface now spans multiple chips and platforms, but external productization evidence remains less mature than internal deployment evidence.
