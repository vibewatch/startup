  evidenceGaps:
  - type: missing-source
    severity: material
    topic: standalone governance
    missingEvidence: A primary source naming Shenji's standalone CEO, full executive roster, board composition, and investor governance rights.
    whyItMatters: Without standalone governance disclosure, investors cannot assess key-person risk, board oversight, or whether outside investors have meaningful protective rights.
    diligencePath: Request Shenji's latest shareholder presentation, cap table summary, and board list from management or lead investors.
    relatedQuestionRefs:
    - QO004
    relatedTableRefs:
    - TO002
  - type: private-evidence-only
    severity: material
    topic: standalone economics
    missingEvidence: Standalone revenue, gross margin, external-customer revenue share, and audited headcount for Shenji after the February 2026 round.
    whyItMatters: Valuation can only be judged loosely while the chip business remains embedded in NIO's reporting and most commercial metrics remain undisclosed.
    diligencePath: Ask for board or investor reporting that splits captive NIO revenue from third-party licensing and discloses the standalone P&L.
    relatedQuestionRefs:
    - QO023
    - QO024
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: external commercialization
    missingEvidence: Named external customers, design wins, contract sizes, and timeline conversion for reported talks with Leapmotor, Geely, or other non-NIO buyers.
    whyItMatters: The step from captive deployment to external revenue is central to whether Shenji deserves a semiconductor-platform valuation rather than a cost-sharing spinout valuation.
    diligencePath: Verify whether reported 2026 outreach produced signed evaluation agreements, tape-out support, or commercial licensing contracts.
    relatedQuestionRefs:
    - QO017
    - QO018
    - QO023
    relatedTableRefs:
    - TO004
  - type: conflicting-data
    severity: minor
    topic: valuation rounding
    missingEvidence: A cap-table-quality financing memo that reconciles the official RMB 8.27 billion implied post-money value with press references to nearly RMB 10 billion.
    whyItMatters: The valuation discrepancy is not thesis-breaking, but it affects peer-multiple comparison and should be normalized before investment committee discussion.
    diligencePath: Confirm fully diluted share count and whether any concurrent financing or option-pool adjustments were included in media round-ups.
    relatedQuestionRefs:
    - QO014
