  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base and Segmentation
        blocks:
          - type: paragraph
            body: >-
              Shenji’s customer base should be segmented by control and monetization, not only by end market. The first
              and overwhelmingly proven segment is the captive NIO ecosystem: NIO-branded flagship and refreshed models
              that use Shenji chips as part of the intelligent-driving stack. The second segment is Onvo, which is still
              controlled by NIO but behaves like a distinct internal channel because it broadens the install base across
              a more value-oriented sub-brand. The third segment is prospective external automotive customers such as
              Leapmotor and Geely, where public evidence shows active pitching and platform readiness work but not yet
              confirmed production wins. The fourth segment is adjacent non-auto AI customers for embodied intelligence
              or agent inference, which are part of the roadmap narrative but currently lack named production users.
              This segmentation matters because the business has already crossed the proof threshold for internal
              deployment, yet it has not crossed the diversification threshold that would materially reduce customer
              concentration risk.
