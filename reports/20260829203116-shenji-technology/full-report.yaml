      - number: '5.5'
        title: Trust, Quality, and Compliance Surface
        blocks:
          - type: paragraph
            body: >-
              Trust and quality are partially evidenced, not fully documented. The most concrete public quality signals
              are automotive-grade manufacturing language, mass-production deployment, and at least one report that
              NX9031 complies with ASIL-D risk and safety requirements. NIO’s broader official materials also emphasize
              full-stack R&D, testing centers, high-performance sensing units, and synchronized software releases across
              general-purpose and in-house chip platforms. Those signals support the argument that Shenji is embedded in
              a serious systems-engineering organization. But they are not substitutes for product-specific
              documentation. Public materials reviewed for this report do not disclose detailed certification artifacts,
              failure rates, yield, field-return statistics, public safety case documents, cybersecurity attestations,
              or external integrator support policies for Shenji as a standalone supplier. That means the product
              appears mature enough for parent deployment, but external buyers would still need a diligence bridge on
              safety validation, software maintenance, and long-term support obligations before relying on Shenji as a
              multi-program semiconductor vendor.
