      - number: '1.4'
        title: Capitalization, Milestones, and Open Risks
        blocks:
          - type: paragraph
            body: >-
              The February 2026 financing is the clearest proof that Shenji has moved from internal experiment to
              externally valued asset. Official NIO disclosures show RMB 2.257 billion of new capital going into Shenji
              with NIO retaining 62.7 percent, outside investors receiving 27.3 percent, and a 10 percent
              share-incentive pool left for talent retention. Secondary coverage translated that into a roughly RMB 8.27
              billion post-money value, while some English-language reporting rounded the number toward RMB 10 billion
              or about US$1.5 billion. The strategic case is straightforward: a chip program that reportedly cost
              billions of renminbi can now share funding burden and seek outside customers. The risks are just as clear.
              External licensing only started in late 2025, reported OEM discussions with Leapmotor and Geely were still
              prospective in March 2026, and more skeptical analysis argues the valuation could run ahead of standalone
              economics if revenue remains mostly captive to NIO. Shenji therefore enters later chapters as a company
              with unusually strong technical and strategic momentum, but incomplete standalone commercial proof.
