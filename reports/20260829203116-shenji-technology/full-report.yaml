  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis Versus Price
        blocks:
          - type: paragraph
            body: >-
              The central valuation question is not whether Shenji is a real asset. It is. Public sources support a
              funded, controlled NIO spinoff with production-scale deployment, a widening chip roadmap, and enough
              outside investor demand to establish a standalone mark. The harder question is whether that mark leaves
              attractive upside for a new investor today. On one side, Shenji has three things most young
              automotive-chip stories do not have: real shipments, a parent ecosystem large enough to absorb product,
              and a credible path to platform expansion into embodied intelligence and agent inference. On the other
              side, the current public mark already captures much of that narrative while leaving investors without
              basic underwriting inputs such as standalone revenue, gross margin, customer concentration by revenue, and
              external contract durability. That pushes the appropriate stance away from blind enthusiasm and toward
              price-sensitive monitoring.
            claimRefs:
              - CV001
              - CV002
