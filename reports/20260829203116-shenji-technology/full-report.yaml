      - number: '5.2'
        title: Architecture and Operating Flow
        blocks:
          - type: paragraph
            body: >-
              The visible architecture centers on a high-performance automotive-grade SoC designed to replace multi-chip
              assisted-driving stacks with a more integrated compute layer. Public descriptions of NX9031 cite a 5nm
              process, more than 50 billion transistors, a 32-core big.LITTLE CPU architecture, LPDDR5X support up to
              8533 Mbps, 546 GB/s memory bandwidth, a high-dynamic-range ISP, and about 1000 TOPS of compute—presented
              as comparable to four Nvidia Orin-X chips. NIO also places the chip inside a broader full-stack
              architecture that combines smart-driving chips, operating systems, and smart chassis control. In practice,
              the chip is only one layer in a vertically integrated workflow: sensing, perception, planning,
              cross-domain task scheduling, and vehicle execution all sit above or around it. That systems view is a
              strength because NIO can optimize hardware and software together. It is also a diligence challenge because
              Shenji’s public technical surface is less open than rival ecosystems that expose developer kits,
              documentation, or broader integrator tooling.
