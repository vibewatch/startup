  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Frame
        blocks:
          - type: paragraph
            body: >-
              The highest-risk interpretation of Shenji is not that the chip does not work. Public evidence already
              shows real vehicle deployment, sizable shipments, and continued investment. The more serious question is
              whether Shenji can keep shipping advanced automotive silicon at scale while navigating a policy-sensitive
              supply chain, a concentrated customer base, and limited public merchant-supplier disclosure. For an
              investor, these risks transmit quickly: supplier or export friction can hit roadmap timing, customer
              concentration can amplify any NIO slowdown, and weak third-party documentation can delay external OEM
              conversion. Importantly, the risk stack is interconnected. A company can have strong internal validation
              and still face commercial hesitation from third parties that worry about governance, support obligations,
              or U.S.-linked policy overhang. Shenji therefore looks less like a binary technology bet and more like a
              layered execution-and-dependency story whose risk burden remains high even as proof points accumulate.
            claimRefs:
