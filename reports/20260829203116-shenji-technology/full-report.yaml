  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and SKU Map
        blocks:
          - type: paragraph
            body: >-
              Shenji’s product is no longer just one flagship autonomous-driving chip. Public evidence by mid-2026 shows
              a family of related compute products arranged around use case rather than only around a single vehicle
              program. The installed center of gravity is still NX9031 / NX9031X for assisted driving inside NIO and
              Onvo vehicles, but WAIC 2026 expanded the visible product map to include NX9031U for embodied intelligence
              and advanced manufacturing, NX9031C for agent inference, and NX6031 as an intelligent sensing chip. That
              matters because it changes how diligence should frame the business. Shenji is best understood as a
              domain-specific AI silicon platform built from NIO’s automotive compute base, not as a one-off captive
              part number. However, the public surface is uneven. There are repeated announcements, showcase materials,
              and architecture claims, but there is still no public merchant product catalog with standardized part
              specs, price sheets, software documentation, or support SLAs for external customers.
