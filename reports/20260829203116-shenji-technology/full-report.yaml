chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Origin, and Strategic Role
        blocks:
          - type: paragraph
            body: >-
              Shenji Technology is best understood as the formal commercialization wrapper around NIO's multi-year
              autonomous-driving chip effort rather than as a conventional greenfield startup. Public reporting
              identifies the entity as Anhui Shenji Technology Co., Ltd., also referenced in English as GeniTech,
              registered in Hefei in June 2025 with business scope centered on integrated-circuit chip design and sales.
              The strategic purpose of the spinoff is consistent across official and independent coverage: move an
              expensive in-house chip program into a structure that can raise outside capital, create employee equity
              incentives, and eventually serve buyers beyond NIO itself. That matters because the chip effort was
              originally justified as a vertical-integration and cost-control move against Nvidia dependence, but by
              2026 it was being presented as a broader AI silicon platform across autonomous driving, embodied
              intelligence, and agent inference. The public surface therefore already supports three key identity
              conclusions for later chapters: Shenji is majority controlled by NIO, rooted in NIO's vehicle roadmap, and
              being repositioned as a standalone semiconductor asset rather than a hidden R&D cost center.
