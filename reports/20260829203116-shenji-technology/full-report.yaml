      - number: '7.4'
        title: Dependency, Financial, and Commercial Risk
        blocks:
          - type: paragraph
            body: >-
              Commercial and financial risks are dominated by concentration and capital intensity. The demand base is
              still overwhelmingly inside NIO and Onvo, which means Shenji depends on parent vehicle cadence, parent
              capital allocation, and parent willingness to continue prioritizing in-house chips. This makes the
              customer problem inseparable from the financial problem. NIO targeted non-GAAP operating break-even in
              2026 and simultaneously rolled out multiple brands and models, so Shenji’s roadmap remains exposed to
              broader parent-company operating pressure. The February 2026 financing round reduced immediate capital
              burden, but it did not eliminate the risk that future tape-outs, validation costs, or external-customer
              support requirements demand more capital. Merchant commercialization risk compounds this. External
              licensing exists, and M97 outreach is real, but no reviewed source confirms a third-party SOP design win.
              If Shenji cannot convert outside customers, then its economics remain heavily dependent on a single
              corporate family and a still-opaque internal transfer-pricing model.
            claimRefs:
