      - number: '3.2'
        title: Incumbent Strengths and Shenji's Current Position
        blocks:
          - type: paragraph
            body: >-
              Nvidia remains the hardest benchmark because its value proposition is system-level rather than chip-level.
              The DRIVE stack spans model development, simulation, validation, and in-vehicle compute and is already
              chosen by leading automakers and robotaxi fleets. Mobileye competes differently, prioritizing efficient,
              scalable automotive-grade compute and winning large OEM programs that can stretch into tens of millions of
              future vehicles. Horizon competes most directly with Shenji in China because it combines domestic
              positioning with mass-production scale, software-hardware co-optimization, and a Journey 6 roadmap
              spanning 10+ to 560 TOPS. Qualcomm adds pressure through the convergence of cockpit and ADAS workloads
              inside the Snapdragon Ride / Digital Chassis framing, while Black Sesame pushes a homegrown open ecosystem
              with aggressive performance claims and BYD-linked proof. Against that field, Shenji's core advantage is
              concrete deployment: the NX9031 family is not hypothetical, and public sources show real installations
              across NIO and Onvo. Its core weakness is visibility: compared with the incumbents, it offers less public
              evidence on software stack maturity, named outside customers, and production-grade packaging.
