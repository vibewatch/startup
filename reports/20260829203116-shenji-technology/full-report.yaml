      - number: '3.5'
        title: Practical Takeaway for Later Underwriting
        blocks:
          - type: paragraph
            body: >-
              For later financial and valuation chapters, the practical competitive takeaway is straightforward. Shenji
              does not need to beat every rival everywhere to become strategically valuable; it needs to win a
              defensible segment where NIO-derived deployment proof, domestic-supply positioning, and adequate software
              support create enough trust for repeat OEM adoption. The most plausible path is not displacing Nvidia
              globally but becoming a credible China-first high-compute alternative in premium assisted-driving programs
              and selected embodied-intelligence adjacencies. That would still be a meaningful outcome. The less
              attractive path is one where Shenji remains mostly a captive cost-allocation vehicle whose public chip
              claims never convert into a broad outside customer base. Public evidence today sits between those
              extremes. Compared with rivals, Shenji has enough product reality to deserve serious attention, but not
              yet enough external commercial proof to claim a durable multi-customer moat.
            claimRefs:
