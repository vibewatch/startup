      - number: '4.5'
        title: Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              The financial verdict is therefore mixed but investable enough to warrant deeper diligence. Shenji is not
              financially legible in the way a listed semiconductor company is legible. It is financially legible as a
              strategic asset within NIO: a program with real scale, heavy sunk cost, genuine cost-saving potential, and
              newly shared capitalization. That is more than narrative. Yet the evidence is still not sufficient to
              underwrite standalone economics. External licensing is real enough to matter, but not disclosed enough to
              model. Parent profitability improvement and volume growth create a favorable operating backdrop, but the
              exact contribution of Shenji is unknown. Capital adequacy has improved, but future chips and external
              customer support will almost certainly require more than the first outside round if Shenji is to become a
              merchant platform. Investors should therefore treat public financial evidence as supportive but incomplete
              and require a data-room-level bridge from chip shipments to recognized revenue, gross margin, and cash
              needs before adopting a strong underwriting view.
