  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Monetization Surface
        blocks:
          - type: paragraph
            body: >-
              Public evidence suggests Shenji currently monetizes through two channels, but only one is clearly proven.
              The first is captive chip deployment into NIO and Onvo vehicles, where economic value may appear through
              internal transfer pricing, BOM savings versus Nvidia, and support for higher-margin smart-driving
              features. The second is external monetization through licensing or supply to third parties, which only
              became visible in late 2025 and remains thinly disclosed. CarNewsChina reported that a single IP
              authorization could be worth several million U.S. dollars while a system-level SoC authorization could
              reach hundreds of millions, but those numbers describe possible deal sizes rather than confirmed
              contracted revenue. This distinction is crucial. Shenji already has economic relevance even if external
              merchant-chip revenue is still small, because it influences parent cost structure and technology control.
              But until public reporting separates internal economic contribution from outside sales, the business
              should be treated as an emerging commercialization story rather than as a transparently monetized merchant
              semiconductor company.
