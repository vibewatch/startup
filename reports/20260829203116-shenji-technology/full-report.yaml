  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and What Shenji Actually Sells Into
        blocks:
          - type: paragraph
            body: >-
              Shenji should be analyzed inside the high-compute automotive AI stack, not against the entire automotive
              semiconductor market. The relevant boundary includes autonomous-driving and ADAS SoCs, domain controllers,
              sensor-fusion compute, functional-safety-capable in-vehicle AI processors, and the associated
              system-integration logic needed for software-defined vehicles. It excludes unrelated vehicle electronics
              such as infotainment-only SoCs, battery-management chips, body controllers, commodity MCUs, and most
              non-AI automotive silicon. This distinction matters because broad automotive SoC market reports often mix
              cockpit, connectivity, powertrain, and ADAS demand into one number, while Shenji's current product proof
              is concentrated in smart-driving compute and adjacent embodied-intelligence ambitions. NIO's own
              full-stack materials reinforce that the company is selling a system-level promise: proprietary
              smart-driving silicon, high-performance sensing, domain fusion, and software integration. As a result,
              Shenji's addressable market is meaningful, but it is materially narrower than generic vehicle-chip TAM
              narratives and still highly dependent on whether Chinese OEMs want domestic alternatives to Nvidia-class
              autonomous-driving compute.
