      - number: '8.2'
        title: Current Valuation Context and Evidence Sufficiency
        blocks:
          - type: paragraph
            body: >-
              The best valuation anchor is the official February 2026 transaction, not the most bullish media shorthand.
              NIO and Shenji disclosed RMB 2.257 billion of new cash investment, 62.7 percent continuing NIO ownership,
              27.3 percent outside investors, and 10 percent reserved for incentive structures. CnEVPost and AInvest
              both explicitly derived an implied post-money valuation of about RMB 8.27 billion from that structure.
              Yicai and other secondary reports rounded the business up to nearly RMB 10 billion or about $1.5 billion,
              which is directionally consistent but less precise. This difference matters because it frames entry
              discipline. At roughly RMB 8.27 billion, the mark looks defensible as a strategic-asset valuation. At the
              rounded higher number, the investor is leaning even more heavily on platform optionality and future
              external commercialization. The problem is that public evidence does not yet bridge from shipments and
              strategic importance to standalone merchant-chip economics. Investors therefore have a credible mark but
              insufficient evidence for aggressive multiple expansion.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV011
              - CV012
              - CV013
              - CV022
              - CV023
      - number: '8.3'
        title: Bull, Base, and Bear Scenario Range
        blocks:
          - type: paragraph
            body: >-
              A scenario-based method is more honest than a faux-precise revenue multiple here. The bear case assumes
              Shenji remains mostly captive, fails to convert named external OEMs, and faces continued policy or supply
              overhang; in that case the business deserves a discount to the current private mark because strategic
              usefulness would remain real but merchant optionality would shrink. The base case assumes Shenji keeps
              compounding internal deployment, adds limited licensing or pilot revenue, and maintains current policy
              conditions; under that outcome the current official mark looks approximately fair. The bull case assumes
              Shenji wins named external automotive customers, proves merchant-grade support and safety documentation,
              and shows the broader AI-platform narrative can monetize beyond NIO. That scenario could justify a
              material re-rating above the current mark, but only after evidence improves. In short, the current price
              is easiest to justify as the midpoint of a wide range rather than as an obviously cheap entry.
            claimRefs:
              - CV014
