      - number: '6.3'
        title: External Commercialization and Expansion
        blocks:
          - type: paragraph
            body: >-
              External commercialization is visible but still early. The strongest public proof is that NIO began
              external technical licensing of the Shenji NX9031 in late 2025, converting at least part of the chip
              effort from an internal cost center into a commercial offering. By March 2026, multiple outlets said
              Shenji and Axera were pitching the M97 chip to automakers including Leapmotor and Geely, with the joint
              venture expected to handle shipment. That is meaningful because it shows go-to-market intent, not just
              open-ended strategic optionality. At the same time, the public record still falls short of a true
              customer-diversification milestone. No reviewed source provided a signed production design win, production
              volume forecast, external backlog, or named robotaxi customer using Shenji chips at scale. WAIC 2026
              expanded the addressable-customer narrative into robotics and agent workloads, but public customer proof
              there remains pipeline rather than adoption. Investors should therefore treat external customer activity
              as promising top-of-funnel progress rather than as mature expansion revenue.
