      - number: '6.5'
        title: Concentration, Expansion Loops, and Procurement Friction
        blocks:
          - type: paragraph
            body: >-
              Customer concentration remains Shenji’s biggest customer-quality weakness. Nearly all visible production
              proof is tied to NIO-controlled brands, and that creates two related risks. First, Shenji’s demand outlook
              depends heavily on NIO’s own product cadence, delivery execution, and willingness to keep sponsoring the
              in-house chip path. Second, external OEMs may hesitate to depend on a supplier controlled by a competing
              automaker, especially when public documentation, support policies, and governance protections are thin.
              The expansion loop is therefore clear but fragile: prove value inside NIO, extend to Onvo, use that
              production credibility to approach outside OEMs, and only then pursue broader embodied-intelligence
              customers. Any break in that chain—slow external conversion, NIO product softness, or discomfort with
              captive governance—would keep Shenji stuck in a concentrated quasi-captive mode. That does not negate the
              traction already achieved, but it means the customer story is still about validation and concentration
              more than about broad-based customer durability.
