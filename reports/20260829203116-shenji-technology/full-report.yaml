              Operational and quality risks are partly mitigated by real deployment but still under-disclosed. On the
              positive side, Shenji is not just a taped-out chip; it is in shipping vehicles and has gone through
              production rollouts across flagship and sub-brand models. That lowers the probability of pure technical
              non-viability. Yet several operational risks remain unresolved. Public sources do not disclose foundry
              relationships, packaging arrangements, yield, return rates, or long-term component commitments. The April
              2026 Onvo L90 reporting is a reminder that memory and high-performance component prices can move vehicle
              economics by around RMB 10,000, which means even a technically successful chip can face scaling friction
              through BOM or supply volatility. Public safety evidence is also incomplete. One source mentions ASIL-D
              compliance, but the report surface does not include public certificates, safety cases, or failure-rate
              dashboards. For internal deployment this may be tolerable; for outside OEM adoption it is a real diligence
              blocker.
            claimRefs:
