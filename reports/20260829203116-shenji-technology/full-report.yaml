  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive Landscape: Who Actually Competes With Shenji'
        blocks:
          - type: paragraph
            body: >-
              Shenji does not compete against a single monolithic “AI chip market.” Its landscape breaks into at least
              five meaningful competitor classes. First is Nvidia, the global incumbent with the broadest end-to-end
              stack from training and simulation to in-vehicle compute. Second is Mobileye, which competes on highly
              integrated, lower-power ADAS and autonomy silicon with deep OEM relationships. Third is Horizon Robotics,
              the most visible China-local automotive-computing specialist, now pushing the Journey 6 family across
              multiple compute tiers and mass-production partnerships. Fourth is Qualcomm, which approaches the market
              through Snapdragon Ride and the broader Digital Chassis, emphasizing cross-domain integration. Fifth is
              Black Sesame, another China-based challenger that pushes an open ecosystem and increasingly global
              positioning through the Huashan family. Shenji sits alongside those players as a vertically integrated
              captive-origin program that is trying to turn internal NIO success into broader platform credibility. This
              means the right comparison is not just TOPS; it is buyer trust, validation history, software tooling, and
              evidence of scalable OEM adoption.
