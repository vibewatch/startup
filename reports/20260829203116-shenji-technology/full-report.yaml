      - number: '1.3'
        title: Product Foundation, Deployment, and Scale Signals
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence in Shenji's profile is product reality. NIO and multiple independent outlets
              describe the NX9031 as a 5nm automotive-grade smart-driving chip with more than 50 billion transistors, a
              32-core CPU architecture, LPDDR5x support, 546 GB/s of bandwidth, and computing performance that NIO says
              is equivalent to four Nvidia Orin-X chips. Those claims are not merely conceptual; public sources tie the
              chip to real deployment in the ET9 and then to expansion across NIO and Onvo vehicles. The scale
              disclosures are directionally important: NIO said cumulative NX9031 shipments exceeded 150,000 units by
              February 2026, while WAIC-era coverage raised the disclosed installed base above 300,000 units for NX9031X
              across NIO and Onvo models. Shenji also expanded the narrative beyond driving with NX9031U, NX9031C, and
              NX6031. That does not yet prove broad third-party monetization, but it does prove that Shenji is built on
              a real mass-produced silicon program rather than on slides alone.
