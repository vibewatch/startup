      - number: '1.2'
        title: Leadership Surface and Governance Visibility
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is simultaneously one of Shenji's strengths and one of its gaps. The strongest named
              operator in public sources is Bai Jian, identified as NIO's head of chips and intelligent hardware and the
              legal representative of Anhui Shenji. William Li remains the strategic sponsor because Shenji is still
              majority owned by NIO and repeatedly explained through NIO's capital-allocation and product strategy. Ma
              Lin, NIO's branding and communications vice president, has also acted as a public amplifier for the chip
              story, especially around WAIC 2026. What is missing is equally important: the reviewed source set does not
              provide a clean standalone Shenji CEO disclosure, board roster, committee structure, or detailed
              governance rights for outside investors. For diligence, that means investors can underwrite the existence
              of technical and corporate sponsorship, but cannot yet underwrite governance depth. This makes Shenji look
              more like a strategically ring-fenced subsidiary with growing outside capitalization than a fully
              transparent standalone chip company.
