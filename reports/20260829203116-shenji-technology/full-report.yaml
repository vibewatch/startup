      - number: '6.4'
        title: Retention, Durability, and Evidence Quality
        blocks:
          - type: paragraph
            body: >-
              Retention visibility is weak even though deployment visibility is strong. Because Shenji is primarily
              embedded in NIO-controlled channels, contract duration, renewal mechanics, NRR, GRR, and customer
              satisfaction are mostly invisible on the public surface. Internal durability can be inferred from
              continued rollout across refreshed vehicle lines, but that is not the same thing as transparent retention
              data. The first users of the Onvo L90 and continuing expansion across NIO and Onvo suggest platform
              commitment, and the official product pages imply that Shenji is not being treated as an experimental
              option. But no source reviewed for this report discloses chip-level take rates, attach rates by trim,
              renewal terms for external licensing, or field satisfaction metrics from third-party buyers. For
              diligence, the key distinction is between persistence of internal architectural commitment and evidence of
              commercial retention from outside customers. Shenji scores well on the first and poorly disclosed on the
              second.
