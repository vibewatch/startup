companyProfile:
  summary: Shenji Technology (Anhui Shenji Technology Co., Ltd., also branded GeniTech) is NIO's automotive-chip spinout, formally registered in Hefei in June 2025 to carry the group's intelligent-driving semiconductor business. It now operates as a strategically important but still NIO-controlled chip platform spanning the mass-produced NX9031 driving SoC, newer variants for embodied intelligence and agent inference, and adjacent sensing components.
  foundedDate: '2025-06-17'
  founders:
    - name: NIO autonomous-driving chip division
      role: Spinout origin
      background: Shenji was carved out of NIO's in-house chip effort rather than introduced publicly as a greenfield founder-led startup.
      claimRefs: [CO001, CO003]
  foundingLocation: Hefei, Anhui, China
  headquarters: Hefei, Anhui, China
  productSummary: Shenji sells and develops automotive-grade AI chips centered on the NX9031 family for intelligent driving, plus newer compute variants and platforms for embodied intelligence, agent inference, and related edge-AI scenarios.
  customerFocus: NIO and Onvo vehicle programs first, with emerging outreach to third-party OEMs and adjacent AI / robotics customers.
  businessModel: Today the business is primarily strategic captive silicon plus internal transfer-pricing / BOM savings for NIO vehicles, with early external monetization through licensing and prospective OEM chip supply.
  stage: Series A
  fundingStatus: First external financing of RMB 2.257 billion closed/announced on 2026-02-26, implying about RMB 8.27 billion post-money while leaving NIO in control at 62.7%.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO015, CO016, CO017, CO020, CE001, CE021, CU002, CU016]
summary:
  headline: Shenji is a real and strategically valuable automotive-chip platform, but at the current private mark the upside is capped by opaque economics, heavy NIO dependence, and unresolved merchant-commercialization risk.
