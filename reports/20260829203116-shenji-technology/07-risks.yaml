- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - External commercialization failure
    - No named third-party production customer
    - Still no named SOP customer by next major roadmap cycle
    - Downgrade merchant-platform thesis; treat Shenji as captive strategic asset only
  - - Policy escalation
    - New sanctions, export tightening, or supplier restrictions tied to NIO / advanced compute
    - Direct restriction on supply chain, tooling, or customer procurement
    - Escalate risk rating and re-underwrite supply resilience
  - - Safety / support gap
    - OEM diligence rejects Shenji documentation or support commitments
    - Evidence of failed pilot or missing safety package
    - Pause underwriting until validation package is reviewed
  - - Parent concentration
    - NIO delivery or profitability misses materially weaken internal demand sponsorship
    - Persistent delivery softness or parent cash stress
    - Model downside as concentrated single-customer supplier
  - - Execution overstretch
    - Roadmap expands faster than validated customer conversion
    - Multiple new chip lines without external win or support infrastructure
    - Reduce valuation multiple and require roadmap focus
  notes: Kill criteria emphasize observable events that break the transition from captive proof to diversified merchant credibility.
