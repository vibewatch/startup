company:
  name: Shenji Technology
chapter:
  number: 7
  title: Risks
  summary: Shenji’s top risks are not one-dimensional technology risks. The most material exposures are policy-sensitive advanced-node supply, concentration inside a NIO-controlled ecosystem, incomplete public validation and safety disclosure, and the challenge of converting a captive chip program into a trusted merchant supplier. Recent U.S. regulatory actions against NIO do not amount to direct sanctions, but they still highlight how quickly legal and geopolitical developments can spill into commercial perception and financing narratives.
sections:
- id: severity-ranked-risk-frame
  title: Severity-Ranked Risk Frame
  body: 'The highest-risk interpretation of Shenji is not that the chip does not work. Public evidence already shows real vehicle deployment, sizable shipments, and continued investment. The more serious question is whether Shenji can keep shipping advanced automotive silicon at scale while navigating a policy-sensitive supply chain, a concentrated customer base, and limited public merchant-supplier disclosure. For an investor, these risks transmit quickly: supplier or export friction can hit roadmap timing, customer concentration can amplify any NIO slowdown, and weak third-party documentation can delay external OEM conversion. Importantly, the risk stack is interconnected. A company can have strong internal validation and still face commercial hesitation from third parties that worry about governance, support obligations, or U.S.-linked policy overhang. Shenji therefore looks less like a binary technology bet and more like a layered execution-and-dependency story whose risk burden remains
    high even as proof points accumulate.'
  claimRefs:
  - CR001
  - CR003
  - CR006
  - CR013
  - CR017
  - CR019
