- id: regulatory-and-legal-risk
  title: Regulatory and Legal Risk
  body: Regulatory and legal risk moved from background concern to live issue in 2026. The clearest catalyst was the U.S. Department of Defense’s June 2026 publication of the Section 1260H “Chinese military companies” list, which included NIO. NIO responded immediately that the list was not a sanctions list and would not impact its business, while reserving the right to take legal action. Both points can be true. The list may not directly prohibit securities trading or current operations, but it still creates reputation, procurement, and diligence drag for any business embedded inside NIO’s strategic stack. At the same time, BIS and related legal guidance in 2026 reaffirmed that advanced-computing export rules for China-linked entities remain active. Shenji’s exact foundry and manufacturing chain are not publicly disclosed, so investors cannot cleanly map which controls matter today versus which become relevant only under a tighter future regime. The right conclusion is not that Shenji is
    blocked today; it is that its legal and regulatory exposure is material and only partly visible on the public surface.
  claimRefs:
