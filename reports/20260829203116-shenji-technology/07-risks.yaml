- id: mitigations-monitoring-and-kill-criteria
  title: Mitigations, Monitoring, and Kill Criteria
  body: 'Shenji is not unmitigated. Outside investors have already validated that the asset is financeable, NIO’s full-stack organization provides internal deployment leverage, and shipment milestones suggest the technology has cleared a meaningful real-world threshold. But mitigation maturity is uneven. Many mitigants are strongest for captive use and weaker for merchant expansion. For example, full-stack integration helps product performance inside NIO vehicles, but it does not by itself solve governance discomfort for rival OEMs. Likewise, large shipment numbers prove scale, but they do not prove external revenue durability or immunity to future export restrictions. A disciplined investor should therefore monitor explicit kill criteria: no named third-party production customer, worsening U.S. policy posture around China-linked advanced compute, evidence that safety or support documentation is insufficient for outside OEMs, and signs that NIO’s own operating priorities are crowding out
    Shenji’s roadmap. The company’s upside depends on converting proof into portability; the kill criteria largely track failures of that conversion.'
