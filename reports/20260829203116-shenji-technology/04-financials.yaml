company:
  name: Shenji Technology
chapter:
  number: 4
  title: Financials
  summary: 'Shenji''s financial story is still mostly an embedded-subsidiary story: real production volume, real outside funding, and plausible future licensing revenue, but no standalone public P&L. Public evidence supports a chip program that has become financially relevant to NIO because it can lower supplier dependence and shift part of the R&D burden to outside investors, yet revenue quality, gross margin, external-customer mix, and true capital adequacy remain under-disclosed.'
sections:
- id: revenue-model-and-monetization
  title: Revenue Model and Monetization Surface
  body: Public evidence suggests Shenji currently monetizes through two channels, but only one is clearly proven. The first is captive chip deployment into NIO and Onvo vehicles, where economic value may appear through internal transfer pricing, BOM savings versus Nvidia, and support for higher-margin smart-driving features. The second is external monetization through licensing or supply to third parties, which only became visible in late 2025 and remains thinly disclosed. CarNewsChina reported that a single IP authorization could be worth several million U.S. dollars while a system-level SoC authorization could reach hundreds of millions, but those numbers describe possible deal sizes rather than confirmed contracted revenue. This distinction is crucial. Shenji already has economic relevance even if external merchant-chip revenue is still small, because it influences parent cost structure and technology control. But until public reporting separates internal economic contribution from outside
    sales, the business should be treated as an emerging commercialization story rather than as a transparently monetized merchant semiconductor company.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI016
  - CI017
  - CI021
  - CI031
  - CI033
  tableRefs:
