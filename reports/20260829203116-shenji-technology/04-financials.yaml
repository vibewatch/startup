    - Real and scaled through 2026 vehicle launches
    - Medium — economically meaningful but not broken out publicly
    - Request transfer-pricing and internal revenue-recognition policy
  - - Cost savings versus Nvidia
    - Lower BOM and supplier dependence from using NX9031 instead of Orin-X
    - RMB per vehicle
    - About RMB 10,000 cost advantage claimed by Yicai / NIO
    - Low to medium — claim not independently audited
    - Validate against actual vehicle BOM and software-support cost
  - - External IP licensing
    - Technical or IP authorization to third parties
    - Per authorization / platform
    - Began appearing publicly in late 2025
    - Low — deal sizes cited, revenue not disclosed
    - Ask for signed contracts and revenue-recognition treatment
  - - External OEM chip supply
    - Potential direct or partner-enabled non-NIO vehicle programs
    - Per SOP program
    - Prospective only in reviewed public evidence
    - Low
    - Confirm design wins, pilot orders, and production timing
  - - Adjacent AI compute
    - Embodied intelligence, agent inference, and advanced manufacturing chips
    - Per device / platform
    - Narrative visible, monetization unproven
    - Low
    - Obtain first customer list and pricing architecture
  notes: Shenji almost certainly has multiple economic pathways, but public data does not yet separate realized revenue from strategic cost savings or future commercialization options.
