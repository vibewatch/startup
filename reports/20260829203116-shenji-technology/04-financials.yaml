  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: standalone Shenji P&L
    missingEvidence: Recognized revenue, gross margin, operating expense, burn, and cash balance for Shenji as a standalone entity.
    whyItMatters: Without a standalone P&L, investors cannot underwrite valuation, payback, or runway with discipline.
    diligencePath: Request board deck or audited management accounts separating Shenji from consolidated NIO reporting.
    relatedQuestionRefs:
    - QI009
    - QI022
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: external licensing economics
    missingEvidence: Signed contract values, revenue-recognition treatment, renewal structure, and customer names for external licensing deals.
    whyItMatters: External monetization is central to the bull case but currently visible only through qualitative or media-reported signals.
    diligencePath: Review executed agreements or a customer-revenue bridge under NDA.
    relatedQuestionRefs:
    - QI002
    - QI008
    - QI023
    relatedTableRefs:
    - TI001
    - TI002
  - type: private-evidence-only
    severity: material
    topic: future capital needs
    missingEvidence: Next-chip tape-out budget, foundry commitments, packaging/test obligations, and hiring plan.
    whyItMatters: The first outside round may or may not be enough depending on the roadmap and manufacturing commitments.
    diligencePath: Request 24-month operating plan and capex/opex forecast for Shenji management.
    relatedQuestionRefs:
    - QI017
    - QI018
    - QI025
    relatedTableRefs:
    - TI004
  - type: conflicting-data
    severity: minor
    topic: attribution of margin benefit
    missingEvidence: A management bridge quantifying how much of NIO's margin improvement comes from chip insourcing versus mix, pricing, or manufacturing scale.
    whyItMatters: Investors may over-credit Shenji for parent improvements without isolating causality.
    diligencePath: Ask management to quantify chip-related savings within vehicle-margin evolution.
    relatedQuestionRefs:
    - QI007
    - QI011
    - QI024
