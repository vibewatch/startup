- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Impact
  - Why it matters
  - Current proxy
  - Exact diligence path
  rows:
  - - Standalone recognized revenue
    - High
    - Without it, valuation is narrative-heavy
    - Chip shipment counts and licensing reports
    - Request audited or board-level revenue bridge
  - - Gross margin by product / customer type
    - High
    - Separates strategic cost center from attractive merchant silicon
    - Parent vehicle margins and cost-savings claims
    - Request product margin waterfall
  - - External-customer revenue share
    - High
    - Shows whether Shenji is diversifying away from NIO concentration
    - Reported outreach to Leapmotor / Geely only
    - Request customer concentration table
  - - Headcount and burn
    - Medium
    - Needed for runway and operating-leverage analysis
    - Outside funding and parent results
    - Request current org chart, payroll, and monthly burn
  - - Foundry / packaging commitments
    - Medium
    - Can create hidden cash needs and working-capital risk
    - Advanced-node capital-intensity reports
    - Request wafer, packaging, and test commitments
  notes: These are not minor omissions; they are the specific blockers preventing a clean standalone underwriting case from public information alone.
