- id: capital-adequacy-and-parent-context
  title: Capital Adequacy and Parent-Company Context
  body: 'Shenji''s February 2026 financing changed the funding conversation but did not end it. Officially, RMB 2.257 billion of new cash went into newly issued Shenji shares, leaving NIO with 62.7 percent control and continued financial consolidation. By July 2026, Shenji said cumulative financing since establishment was close to RMB 3 billion. This clearly reduces NIO''s burden of funding the chip roadmap alone. It does not mean the business is independently financed for the long term. Automotive-grade chips require repeated node transitions, safety validation, software maintenance, customer support, and potentially support for new products such as M97 or embodied-intelligence chips. Parent-company context matters because NIO was simultaneously pursuing non-GAAP operating break-even in 2026, improving vehicle margin, and scaling deliveries across NIO, ONVO, and FIREFLY. That makes Shenji financially strategic even before its own standalone metrics are visible: it can serve as a cost-control
    asset, a re-rating catalyst, and a capital-sharing mechanism.'
