- id: traction-proxies-concentration-and-gaps
  title: Traction Proxies, Concentration, and What Is Missing
  body: 'The public traction data for Shenji is directionally useful but economically incomplete. Shipment and deployment numbers show that the chip program is real and scaling: more than 150,000 cumulative NX9031 units were disclosed by February 2026, 200,000-plus by the April 2026 Onvo L90 rollout, and more than 300,000 NX9031X shipments by WAIC 2026. Meanwhile NIO''s delivery updates show a large and growing captive ecosystem, including strong ONVO volumes and refreshed flagship launches that can absorb additional in-house chips. However, these are concentration signals as much as growth signals. The visible order book remains overwhelmingly tied to NIO-controlled brands, and public sources still do not provide standalone Shenji revenue, external-customer revenue share, gross margin, or audited headcount. Even NIO''s audited Form 20-F only confirms parent-company statements, not Shenji''s own accounts. For diligence, this means the business has strong operating proxies but weak disclosure
    quality.'
  claimRefs:
  - CI001
  - CI014
  - CI015
  - CI016
