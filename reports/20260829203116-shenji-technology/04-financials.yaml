  - TI002
  figureRefs:
  - FI001
- id: unit-economics-and-cost-structure
  title: Unit Economics and Cost Structure
  body: 'The strongest public unit-economics evidence centers on cost and capital, not on revenue quality. Multiple sources say NX9031 development consumed billions of renminbi, with Yicai narrowing the figure to roughly RMB 2.3-3.0 billion and William Li comparing the effort to building about 1,500 battery-swap stations. That is an enormous capital commitment for a single-chip program and explains why NIO eventually sought outside investors. The most favorable counterweight is Shenji''s claimed cost advantage: Yicai reported about RMB 10,000 of vehicle-level savings versus Nvidia Orin-X, which if sustained across scale deployments could materially support parent vehicle economics. What remains missing is the link between those two facts. Public sources do not disclose Shenji''s gross margin, wafer or packaging economics, yield, depreciation treatment, internal transfer-pricing model, or the cost of ongoing software support. Investors can therefore say the chip program may improve cost structure,
    but cannot yet quantify when cumulative savings overtake cumulative R&D outlay on a standalone basis.'
  claimRefs:
  - CI008
  - CI009
  - CI010
  - CI017
  - CI022
  - CI023
  - CI036
