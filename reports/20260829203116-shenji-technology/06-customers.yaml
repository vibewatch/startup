chapter:
  number: 6
  title: Customers
  summary: Shenji has real adoption proof, but almost all of it still sits inside NIO-controlled channels. The best customer evidence is production deployment across NIO and Onvo models plus test-drive/store rollout for the L90; the weakest areas are third-party SOP wins, renewal visibility, and any public data on external revenue concentration or contract durability.
sections:
- id: customer-base-and-segmentation
  title: Customer Base and Segmentation
  body: 'Shenji’s customer base should be segmented by control and monetization, not only by end market. The first and overwhelmingly proven segment is the captive NIO ecosystem: NIO-branded flagship and refreshed models that use Shenji chips as part of the intelligent-driving stack. The second segment is Onvo, which is still controlled by NIO but behaves like a distinct internal channel because it broadens the install base across a more value-oriented sub-brand. The third segment is prospective external automotive customers such as Leapmotor and Geely, where public evidence shows active pitching and platform readiness work but not yet confirmed production wins. The fourth segment is adjacent non-auto AI customers for embodied intelligence or agent inference, which are part of the roadmap narrative but currently lack named production users. This segmentation matters because the business has already crossed the proof threshold for internal deployment, yet it has not crossed the diversification
    threshold that would materially reduce customer concentration risk.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU020
  - CU021
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-production-proof
  title: Adoption Trajectory and Production Proof
  body: 'The adoption trajectory is real, but it is best measured through deployment surfaces rather than through standalone customer-count disclosures. Official and industry sources show more than 150,000 cumulative NX9031 units by February 2026, more than 200,000 by the April 2026 Onvo L90 shipping update, and more than 300,000 NX9031X shipments across NIO and Onvo models by WAIC 2026. NIO’s delivery updates reinforce why those milestones matter: the parent ecosystem was still adding large monthly vehicle volume in 2026, including over 35,000 vehicles in July and over 107,000 vehicles in the second quarter. The Onvo L90 launch path is especially useful because it created production, showroom, and test-drive evidence rather than only management narration. The official Onvo L90 page also confirms Shenji as standard smart-driving hardware in the product narrative. Together, these sources provide strong proof that Shenji has moved beyond prototype status and into scaled customer-facing deployment,
    even if the customer set remains narrow.'
  claimRefs:
  - CU008
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU022
  - CU023
