  - - Onvo sub-brand
    - Onvo product teams / family-SUV end users / NIO-controlled channel
    - Rollout of smart-driving stack into broader-market vehicles
    - Rapidly expanding internal channel in 2026
    - Increases installed base and scale economics
    - No public take-rate or per-trim attachment disclosure
  - - Prospective external OEMs
