    - Domestic ADAS compute alternative
    - Active outreach but no confirmed SOP win
    - Key route to reducing concentration
    - Need signed contracts and production timing
  - - External licensing counterparties
    - Chipmakers or platform partners
    - Technical authorization / IP monetization
    - At least one external licensing relationship publicly reported
    - First non-captive monetization signal
    - Counterparty names and renewal terms undisclosed
  - - Adjacent AI / robotics customers
    - Robotics, manufacturing, or agent-platform builders
    - Embodied intelligence and agent inference
    - Roadmap-visible, not customer-proven
    - Potential long-term TAM expansion
    - No named production customers reviewed
  notes: Segmentation should separate captive channels from third-party customers because adoption quality differs materially across them.
