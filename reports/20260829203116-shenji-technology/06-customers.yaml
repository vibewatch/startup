- id: external-commercialization-and-expansion
  title: External Commercialization and Expansion
  body: External commercialization is visible but still early. The strongest public proof is that NIO began external technical licensing of the Shenji NX9031 in late 2025, converting at least part of the chip effort from an internal cost center into a commercial offering. By March 2026, multiple outlets said Shenji and Axera were pitching the M97 chip to automakers including Leapmotor and Geely, with the joint venture expected to handle shipment. That is meaningful because it shows go-to-market intent, not just open-ended strategic optionality. At the same time, the public record still falls short of a true customer-diversification milestone. No reviewed source provided a signed production design win, production volume forecast, external backlog, or named robotaxi customer using Shenji chips at scale. WAIC 2026 expanded the addressable-customer narrative into robotics and agent workloads, but public customer proof there remains pipeline rather than adoption. Investors should therefore treat
    external customer activity as promising top-of-funnel progress rather than as mature expansion revenue.
  claimRefs:
  - CU006
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU024
  - CU025
  - CU031
  tableRefs: []
  figureRefs: []
- id: retention-durability-and-evidence-quality
  title: Retention, Durability, and Evidence Quality
  body: Retention visibility is weak even though deployment visibility is strong. Because Shenji is primarily embedded in NIO-controlled channels, contract duration, renewal mechanics, NRR, GRR, and customer satisfaction are mostly invisible on the public surface. Internal durability can be inferred from continued rollout across refreshed vehicle lines, but that is not the same thing as transparent retention data. The first users of the Onvo L90 and continuing expansion across NIO and Onvo suggest platform commitment, and the official product pages imply that Shenji is not being treated as an experimental option. But no source reviewed for this report discloses chip-level take rates, attach rates by trim, renewal terms for external licensing, or field satisfaction metrics from third-party buyers. For diligence, the key distinction is between persistence of internal architectural commitment and evidence of commercial retention from outside customers. Shenji scores well on the first and poorly
    disclosed on the second.
  claimRefs:
  - CU011
  - CU013
  - CU026
  - CU027
  - CU028
  - CU029
  - CU032
  tableRefs:
  - TU004
  figureRefs: []
- id: concentration-and-procurement-friction
  title: Concentration, Expansion Loops, and Procurement Friction
  body: 'Customer concentration remains Shenji’s biggest customer-quality weakness. Nearly all visible production proof is tied to NIO-controlled brands, and that creates two related risks. First, Shenji’s demand outlook depends heavily on NIO’s own product cadence, delivery execution, and willingness to keep sponsoring the in-house chip path. Second, external OEMs may hesitate to depend on a supplier controlled by a competing automaker, especially when public documentation, support policies, and governance protections are thin. The expansion loop is therefore clear but fragile: prove value inside NIO, extend to Onvo, use that production credibility to approach outside OEMs, and only then pursue broader embodied-intelligence customers. Any break in that chain—slow external conversion, NIO product softness, or discomfort with captive governance—would keep Shenji stuck in a concentrated quasi-captive mode. That does not negate the traction already achieved, but it means the customer story
    is still about validation and concentration more than about broad-based customer durability.'
