- id: scenario-valuation-range
  title: Bull, Base, and Bear Scenario Range
  body: A scenario-based method is more honest than a faux-precise revenue multiple here. The bear case assumes Shenji remains mostly captive, fails to convert named external OEMs, and faces continued policy or supply overhang; in that case the business deserves a discount to the current private mark because strategic usefulness would remain real but merchant optionality would shrink. The base case assumes Shenji keeps compounding internal deployment, adds limited licensing or pilot revenue, and maintains current policy conditions; under that outcome the current official mark looks approximately fair. The bull case assumes Shenji wins named external automotive customers, proves merchant-grade support and safety documentation, and shows the broader AI-platform narrative can monetize beyond NIO. That scenario could justify a material re-rating above the current mark, but only after evidence improves. In short, the current price is easiest to justify as the midpoint of a wide range rather than
    as an obviously cheap entry.
  claimRefs:
