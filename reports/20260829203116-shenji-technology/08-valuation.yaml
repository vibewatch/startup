- id: comps-exit-readiness-and-final-call
  title: Comparables, Exit Readiness, and Final Call
  body: 'Comparable analysis is useful mainly to highlight what Shenji is not. It is not yet a public-style disclosed chip company like Mobileye, Nvidia, or Qualcomm, all of which provide regular audited or listed-company filings and much deeper ecosystem visibility. Nor is it simply another NIO operating department, because outside investors have already assigned it a separate value. The right conclusion is that Shenji deserves to be viewed as a strategic private semiconductor platform with real proof but incomplete merchant readiness. That leads to a watch recommendation rather than an invest or pass call. A pass would ignore the real asset quality, while an invest call would overstate how much evidence exists on economics and diversification. Exit readiness is also limited: until Shenji discloses cleaner standalone metrics or wins named outside production customers, there is no strong public basis to assume rapid mark-up, IPO readiness, or easy secondary liquidity. The next move in conviction
    likely comes from diligence, not from storytelling.'
