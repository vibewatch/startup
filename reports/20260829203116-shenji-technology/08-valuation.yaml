- id: current-valuation-context
  title: Current Valuation Context and Evidence Sufficiency
  body: The best valuation anchor is the official February 2026 transaction, not the most bullish media shorthand. NIO and Shenji disclosed RMB 2.257 billion of new cash investment, 62.7 percent continuing NIO ownership, 27.3 percent outside investors, and 10 percent reserved for incentive structures. CnEVPost and AInvest both explicitly derived an implied post-money valuation of about RMB 8.27 billion from that structure. Yicai and other secondary reports rounded the business up to nearly RMB 10 billion or about $1.5 billion, which is directionally consistent but less precise. This difference matters because it frames entry discipline. At roughly RMB 8.27 billion, the mark looks defensible as a strategic-asset valuation. At the rounded higher number, the investor is leaning even more heavily on platform optionality and future external commercialization. The problem is that public evidence does not yet bridge from shipments and strategic importance to standalone merchant-chip economics.
    Investors therefore have a credible mark but insufficient evidence for aggressive multiple expansion.
  claimRefs:
