company:
  name: Shenji Technology
chapter:
  number: 8
  title: Valuation
  summary: Shenji has earned a valuation anchor, but not yet a clean underwriting case. The official February 2026 financing gives a credible current mark around RMB 8.27 billion post-money, while secondary sources round the business to nearly RMB 10 billion / roughly $1.5 billion. That mark is not obviously irrational given real product proof and strategic importance, but it already prices in a meaningful portion of the platform optionality before public disclosure on external revenue, gross margin, or diversified customer wins exists.
sections:
- id: thesis-vs-price
  title: Investment Thesis Versus Price
  body: 'The central valuation question is not whether Shenji is a real asset. It is. Public sources support a funded, controlled NIO spinoff with production-scale deployment, a widening chip roadmap, and enough outside investor demand to establish a standalone mark. The harder question is whether that mark leaves attractive upside for a new investor today. On one side, Shenji has three things most young automotive-chip stories do not have: real shipments, a parent ecosystem large enough to absorb product, and a credible path to platform expansion into embodied intelligence and agent inference. On the other side, the current public mark already captures much of that narrative while leaving investors without basic underwriting inputs such as standalone revenue, gross margin, customer concentration by revenue, and external contract durability. That pushes the appropriate stance away from blind enthusiasm and toward price-sensitive monitoring.'
  claimRefs:
