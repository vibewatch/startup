- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bear
    - Shenji stays mostly captive, no named third-party production customer, policy overhang persists
    - Estimated RMB 5.5B-7.0B; roughly -34% to -15% versus the official ~RMB 8.27B mark
    - Concentration, export-policy sensitivity, merchant-conversion failure
    - Plausible if external GTM stalls or NIO priorities shift
  - - Base
    - Internal deployment keeps compounding, licensing progresses slowly, no major policy shock
    - Estimated RMB 8.0B-9.5B; roughly -3% to +15% versus the official mark
    - Disclosure opacity and limited diversification remain
    - Most consistent with current public evidence
  - - Bull
    - Named external OEM wins, merchant-grade support package, broader AI monetization beyond cars
    - Estimated RMB 11.0B-13.0B; roughly +33% to +57% versus the official mark
    - Execution complexity and competition still matter
    - Requires evidence improvement, not just narrative repetition
  notes: These are scenario estimates anchored to the current private mark and evidence quality, not DCF outputs.
