- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: sample
    basis: These rows are a sample of the most relevant public reference points for disclosure depth and strategic positioning, not a complete peer set.
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Shenji Feb 2026 round
    - Private post-money mark
    - ~RMB 8.27B implied official mark
    - Primary valuation anchor
    - No standalone P&L disclosed
  - - Mobileye
    - Public ADAS/AV peer with 20-F filing surface
    - Listed peer with audited public reporting
    - Closest listed category for automotive intelligent-driving stack exposure
    - Different business mix and far better disclosure
  - - Nvidia DRIVE platform / Nvidia
    - Global AV compute incumbent with 10-K disclosure
    - Mega-cap diversified public benchmark, not a private-chip comp
    - Shows strategic value of full-stack vehicle compute ecosystems
    - Scale and business mix are incomparable
  - - Qualcomm automotive / Ride
    - Diversified listed semiconductor benchmark with 10-K disclosure
    - Public benchmark for auto-compute credibility and ecosystem depth
    - Useful for ecosystem and merchant-platform comparison
    - Automotive is only one segment inside Qualcomm
  - - NIO parent SOTP lens
    - Parent-company strategic asset value
    - Public market may partly capitalize Shenji through NIO, but not cleanly
    - Relevant because NIO still controls 62.7% and consolidates results
    - Parent valuation does not isolate Shenji economics
  notes: The table is most useful for triangulation and disclosure comparison, not for deriving a precise market multiple.
  claimRefs:
  - CV001
  - CV002
  - CV022
  - CV023
  - CV030
  - CV031
  - CV032
- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - No named third-party production customer
    - Still absent by next major roadmap cycle
    - Bull case for merchant optionality weakens sharply
    - Treat Shenji as strategic captive asset; reduce upside assumptions
  - - Policy or supply tightening
    - Direct new restriction on advanced-node supply, tooling, or buyer procurement
    - Raises capital, timing, and customer-conversion risk
    - Escalate risk rating; cut valuation range
  - - Weak diligence on economics
    - Management cannot provide standalone revenue, gross margin, or concentration bridge
    - Invest thesis loses financial support
    - Stay at watch / pass until evidence improves
  - - Parent-priority conflict
    - NIO operating pressure or product cadence materially de-prioritizes Shenji roadmap
    - Reduces both internal proof compounding and external conversion potential
    - Lower base case and extend timing
  - - Support / safety package shortfall
    - External OEMs reject documentation or support commitments
    - Blocks merchant transition
    - Do not underwrite external-customer scenarios
  notes: These triggers are designed to test whether Shenji can graduate from strategic proof into investable merchant economics.
  claimRefs:
  - CV010
  - CV024
  - CV029
  - CV034
  - CV035
  - CV036
  - CV037
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Standalone revenue and gross margin
    - Quarterly revenue bridge, margin by captive vs external sale
    - Needed to value Shenji as a business rather than a strategic narrative
    - Request CFO or board-package reporting under NDA
  - - Customer concentration and contracts
    - Revenue / unit share by NIO, Onvo, licensing, and external OEMs
    - Determines whether current mark is diversification-ready or still captive
    - Request customer concentration schedule and contract summary
  - - Merchant support readiness
    - Safety package, validation dossier, support SLA, warranty and indemnity terms
    - External OEM conversion depends on these materials
    - Request customer diligence pack
  - - Supply-chain resilience
    - Foundry, packaging, memory, and export-control exposure map
    - Policy-sensitive hardware businesses can fail through dependencies
    - Request operations and legal risk memo
  - - Governance and investor protections
    - Board rights, related-party policy, minority protections, conflict management
    - Needed to evaluate a NIO-controlled supplier fairly
    - Request governance documents and side-letter summary
  notes: Without these asks, a new investor is mostly underwriting optionality rather than transparent economics.
