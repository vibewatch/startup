  topStrengths:
    - >-
      The product is proven in market, with real deployment across NIO and Onvo vehicles and shipment disclosures
      progressing from 150,000+ to 300,000+ units in 2026.
    - >-
      Outside investors established a credible standalone mark while allowing NIO to keep control, confirming Shenji is
      viewed as a financeable strategic asset rather than only an internal cost center.
    - >-
      Shenji's roadmap is broadening beyond one driving chip toward embodied-intelligence and agent-inference platforms,
      creating genuine optionality if external commercialization succeeds.
    - >-
      NIO's full-stack software, vehicle, and systems-engineering environment gives Shenji an unusually strong in-house
      proving ground for automotive silicon.
  topRisks:
    - >-
      Standalone revenue, gross margin, cash burn, and customer concentration by revenue remain undisclosed, limiting
      valuation precision.
    - >-
      The overwhelming majority of visible demand still sits inside NIO-controlled channels, so customer diversification
      risk is high.
    - >-
      Advanced-node manufacturing, memory, packaging, and export-control exposure are only partly visible on the public
      surface.
    - >-
      External OEMs may hesitate to depend on a supplier controlled by a competing automaker unless governance and
      support independence become clearer.
    - >-
      The current mark already captures meaningful strategic optionality, leaving less room for error if merchant
      monetization lags.
  unresolvedGaps:
    - Standalone P&L, gross-margin, and cash-runway reporting for Shenji as a separate entity.
    - Revenue and shipped-unit concentration by NIO, Onvo, licensing counterparties, and prospective external OEMs.
    - Merchant customer diligence pack covering safety validation, warranty, support SLA, and governance protections.
    - Foundry, packaging, memory, EDA-tooling, and export-control dependency map.
    - Evidence of named third-party production customers beyond licensing or pipeline discussions.
