- id: switching-costs-distribution-and-pricing
  title: Switching Costs, Distribution Power, and Pricing Visibility
  body: 'The biggest competitive barrier in this market is not raw silicon performance; it is organizational switching cost. Automotive AI compute is sold through long design cycles, safety validation, vehicle-platform integration, and support ecosystems that buyers cannot swap casually. Nvidia benefits from a broad software environment and system-level development workflow, Mobileye from long-standing OEM program embedment, Horizon from China-local mass production and architecture breadth, and Qualcomm from cross-domain automotive relationships. Shenji''s captive channel gives it one unusually powerful distribution mechanism: it can be designed into NIO and Onvo vehicles without having to win an external RFP first. That makes it easier to prove in-vehicle operation, cost savings, and deployment scale. However, external sales still require a harder step-change. Public pricing is largely opaque across the whole set, which itself is informative: buyers evaluate ADAS chips as long-cycle platforms,
    not shelf-priced components. The limited public packaging data that does surface, such as Qualcomm development hardware, highlights how complex and partner-mediated the commercialization path remains.'
