evidenceGaps:
  - type: missing-source
    severity: material
    topic: standalone governance
    missingEvidence: >-
      A primary source naming Shenji's standalone CEO, full executive roster, board composition, and investor governance
      rights.
    whyItMatters: >-
      Without standalone governance disclosure, investors cannot assess key-person risk, board oversight, or whether
      outside investors have meaningful protective rights.
    diligencePath: >-
      Request Shenji's latest shareholder presentation, cap table summary, and board list from management or lead
      investors.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: standalone economics
    missingEvidence: >-
      Standalone revenue, gross margin, external-customer revenue share, and audited headcount for Shenji after the
      February 2026 round.
    whyItMatters: >-
      Valuation can only be judged loosely while the chip business remains embedded in NIO's reporting and most
      commercial metrics remain undisclosed.
    diligencePath: >-
      Ask for board or investor reporting that splits captive NIO revenue from third-party licensing and discloses the
      standalone P&L.
    relatedQuestionRefs:
      - QO023
      - QO024
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: external commercialization
    missingEvidence: >-
      Named external customers, design wins, contract sizes, and timeline conversion for reported talks with Leapmotor,
      Geely, or other non-NIO buyers.
    whyItMatters: >-
      The step from captive deployment to external revenue is central to whether Shenji deserves a
      semiconductor-platform valuation rather than a cost-sharing spinout valuation.
    diligencePath: >-
      Verify whether reported 2026 outreach produced signed evaluation agreements, tape-out support, or commercial
      licensing contracts.
    relatedQuestionRefs:
      - QO017
      - QO018
      - QO023
    relatedTableRefs:
      - TO004
  - type: conflicting-data
    severity: minor
    topic: valuation rounding
    missingEvidence: >-
      A cap-table-quality financing memo that reconciles the official RMB 8.27 billion implied post-money value with
      press references to nearly RMB 10 billion.
    whyItMatters: >-
      The valuation discrepancy is not thesis-breaking, but it affects peer-multiple comparison and should be normalized
      before investment committee discussion.
    diligencePath: >-
      Confirm fully diluted share count and whether any concurrent financing or option-pool adjustments were included in
      media round-ups.
    relatedQuestionRefs:
      - QO014
  - type: private-evidence-only
    severity: material
    topic: third-party SOM and design-win conversion
    missingEvidence: Named external design wins, pricing, contract values, and SOP timelines for non-NIO customers.
    whyItMatters: >-
      Without conversion data, Shenji's serviceable obtainable market cannot be translated from narrative into revenue
      probability.
    diligencePath: >-
      Request pipeline breakdown by captive vs external customer, including paid pilots, evaluation units, and signed
      SOP commitments.
    relatedQuestionRefs:
      - QM009
      - QM024
      - QM025
  - type: conflicting-data
    severity: minor
    topic: market-definition variance
    missingEvidence: Methodology detail reconciling broad auto-SoC forecasts with narrow ADAS or autonomous-driving compute forecasts.
    whyItMatters: Using the wrong market denominator can materially distort valuation multiples and market-share claims.
    diligencePath: Normalize TAM/SAM slides to one explicit scope before IC discussion.
    relatedQuestionRefs:
      - QM003
      - QM004
      - QM005
      - QM006
      - QM007
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: TM003 external OEM buyer path
    missingEvidence: Procurement process detail showing who signs off on external Shenji design wins at non-NIO OEMs.
    whyItMatters: Budget ownership affects sales-cycle duration, pricing leverage, and channel strategy.
    diligencePath: Ask for one anonymized external OEM deal desk or design-review process map.
    relatedQuestionRefs:
      - QM011
      - QM013
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: TM004 performance-per-watt validation
    missingEvidence: Independent performance-per-watt and ASIL validation of Shenji chips versus competing automotive AI processors.
    whyItMatters: >-
      TOPS alone is insufficient for market conversion in automotive environments where safety and thermal constraints
      dominate.
    diligencePath: Obtain third-party benchmark and validation reports or customer qualification results.
    relatedQuestionRefs:
      - QM017
      - QM024
    relatedTableRefs:
      - TM004
  - type: private-evidence-only
    severity: material
    topic: external OEM conversion proof
    missingEvidence: >-
      Named third-party SOP wins, contract structures, and renewal or follow-on programs for Shenji outside the NIO
      ecosystem.
    whyItMatters: Competitive durability depends on multi-customer adoption rather than captive parent deployment alone.
    diligencePath: 'Request external pipeline by stage: evaluation, pilot, design win, SOP, and revenue contribution.'
    relatedQuestionRefs:
      - QP019
