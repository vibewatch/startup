- id: buyer-segmentation-and-adoption
  title: Buyer Segments, Budget Owners, and Adoption Path
  body: Shenji's near-term buyer map is unusually clear because it starts with a captive parent. NIO and Onvo vehicle programs are the immediate economic anchor, with chip deployment tied to flagship and refreshed vehicle launches such as ET9, L90, and L80. The next buyer tier is other Chinese OEMs or chip partners evaluating domestic high-compute ADAS silicon, illustrated by reported outreach to Leapmotor and Geely and by the Axera-linked M97 effort. A third tier includes robotics, agent inference, and intelligent-computing users that Shenji began discussing around NX9031U and WAIC 2026, but those markets are still conceptual from a revenue-proof perspective. In all three tiers, the economic buyer is not a retail driver; it is a mix of vehicle program leadership, ADAS engineering, procurement, finance, and platform-software owners who care about compute density, thermal limits, functional safety, tooling maturity, and supply security. This makes automotive AI chips a long-cycle, design-win-heavy
    market with far more organizational friction than consumer semiconductors.
