- id: sizing-lenses-and-contradictions
  title: 'Sizing Lenses: Large Market, Wide Definition Spread'
  body: Public market-size estimates for this category vary widely because publishers are measuring different things. Future Market Insights places the broad automotive SoC market at about USD 22.8 billion in 2026, while DIResearch's autonomous-driving-SoC figure is about USD 33.0 billion in 2026 and Semiconductor Insight's narrower autonomous-driving-SoC lens is only USD 6.8 billion. A separate Semiconductor Insight lens puts the ADAS SoC submarket at USD 9.2 billion in 2026. None of these figures is inherently wrong; they are simply built on different scope definitions. That is why Shenji should not be benchmarked against the most expansive number by default. The investable question is not whether automotive compute is large in aggregate, but which slice Shenji can realistically serve over the next few years. Today the company clearly serves captive premium EV programs inside NIO and Onvo, and it has signaled interest in higher-compute adjacencies and external OEM licensing. Public evidence
    does not yet support a clean bottoms-up SOM, so the chapter preserves the range instead of forcing false precision.
  claimRefs:
