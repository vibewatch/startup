- id: growth-drivers-and-adoption-constraints
  title: Growth Drivers and Adoption Constraints
  body: The demand drivers are substantial. Multiple market sources describe rising AI compute requirements as vehicles move from conventional ADAS to software-defined, sensor-rich L2+, L3, and eventually L4 architectures. Safety regulation, domain centralization, richer perception stacks, and OEM interest in domestic supply chains all increase demand for automotive-grade AI compute. At the same time, the constraints are just as important. Automotive chips face multi-year qualification cycles, high tape-out and validation costs, and punishing thermal and power requirements inside electric vehicles. Incumbents such as Nvidia, Mobileye, and Horizon compete not only on TOPS but also on software tooling, safety certification history, OEM integrations, and support ecosystems. Shenji therefore benefits from a real macro tailwind, but its market conversion will depend on proving that its platform can clear these non-silicon barriers for buyers beyond NIO's own programs. That is why public third-party
    SOM evidence remains the main market-analysis gap rather than raw market size itself.
  claimRefs:
  - CM003
