  - type: private-evidence-only
    severity: material
    topic: third-party SOM and design-win conversion
    missingEvidence: Named external design wins, pricing, contract values, and SOP timelines for non-NIO customers.
    whyItMatters: Without conversion data, Shenji's serviceable obtainable market cannot be translated from narrative into revenue probability.
    diligencePath: Request pipeline breakdown by captive vs external customer, including paid pilots, evaluation units, and signed SOP commitments.
