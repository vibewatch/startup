    - QM009
    - QM024
    - QM025
  - type: conflicting-data
    severity: minor
    topic: market-definition variance
    missingEvidence: Methodology detail reconciling broad auto-SoC forecasts with narrow ADAS or autonomous-driving compute forecasts.
    whyItMatters: Using the wrong market denominator can materially distort valuation multiples and market-share claims.
    diligencePath: Normalize TAM/SAM slides to one explicit scope before IC discussion.
