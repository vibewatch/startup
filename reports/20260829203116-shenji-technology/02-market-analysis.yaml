chapter:
  number: 2
  title: Market Analysis
  summary: Shenji participates in a fast-growing but definition-sensitive automotive AI compute market that sits inside the broader software-defined-vehicle semiconductor stack. Public evidence supports a real and expanding addressable category for high-compute ADAS and autonomous-driving SoCs, but Shenji's current serviceable market remains far narrower than broad automotive SoC forecasts because today's proof is still concentrated in NIO/Onvo deployments and a handful of reported OEM outreach paths.
sections:
- id: market-boundary
  title: Market Boundary and What Shenji Actually Sells Into
  body: 'Shenji should be analyzed inside the high-compute automotive AI stack, not against the entire automotive semiconductor market. The relevant boundary includes autonomous-driving and ADAS SoCs, domain controllers, sensor-fusion compute, functional-safety-capable in-vehicle AI processors, and the associated system-integration logic needed for software-defined vehicles. It excludes unrelated vehicle electronics such as infotainment-only SoCs, battery-management chips, body controllers, commodity MCUs, and most non-AI automotive silicon. This distinction matters because broad automotive SoC market reports often mix cockpit, connectivity, powertrain, and ADAS demand into one number, while Shenji''s current product proof is concentrated in smart-driving compute and adjacent embodied-intelligence ambitions. NIO''s own full-stack materials reinforce that the company is selling a system-level promise: proprietary smart-driving silicon, high-performance sensing, domain fusion, and software
    integration. As a result, Shenji''s addressable market is meaningful, but it is materially narrower than generic vehicle-chip TAM narratives and still highly dependent on whether Chinese OEMs want domestic alternatives to Nvidia-class autonomous-driving compute.'
  claimRefs:
