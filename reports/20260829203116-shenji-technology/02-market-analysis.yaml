- id: what-the-market-evidence-still-cannot-prove
  title: What the Market Evidence Still Cannot Prove
  body: 'The current market evidence is strong enough to establish direction but not precise monetization. It shows that software-defined vehicles are raising compute intensity, that Chinese OEMs have strategic reasons to diversify away from foreign suppliers, and that Shenji already has a substantial captive base through NIO and Onvo. It does not yet show how much of the broader addressable market Shenji can win outside that ecosystem, what share of future demand will remain in infotainment or lower-compute safety systems outside Shenji''s sweet spot, or whether embodied-intelligence and agent-inference adjacencies will become near-term revenue pools rather than narrative extensions. For valuation work, the correct takeaway is disciplined optimism: use the broad market figures to show category tailwind, but use the narrower ADAS and autonomous-driving compute slices to anchor underwriting. Until design wins, pricing, and external customer conversions are more visible, Shenji''s market opportunity
    is demonstrably large but still only partially commercialized.'
