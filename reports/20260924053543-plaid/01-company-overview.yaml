company:
  name: Plaid
chapter:
  number: 1
  title: Company Overview
  summary: "Plaid remains a private, San Francisco-based open-banking infrastructure company with a large consumer-financial network, broad product surface, and a clear path toward IPO optionality. The refreshed evidence still supports a dominant market position, but it also keeps trust, disclosure, and governance opacity as persistent diligence issues."
sections:
  - id: identity-scale
    title: Identity, scale, and product surface
    body: >
      Plaid is still best understood as the connectivity layer between consumer bank accounts
      and the apps that need them. The refreshed sources continue to show a large installed base:
      Plaid says it supports more than 12,000 financial institutions and over 9,000 digital
      financial services, while Axis Intelligence and Sacra point to more than 500 million
      cumulative consumer account connections, roughly 7,000+ customer companies, and a 2025 ARR
      estimate of $546M. That combination of network breadth and recurring usage keeps Plaid in a
      structurally strong position even before a public filing. The product surface also keeps
      widening: beyond account linking, the platform now spans payments, fraud, identity, credit,
      and onboarding workflows, which matters because those adjacent products are what make the
      company more than a pure bank-aggregation utility.
    claimRefs: [CO001, CO002, CO003, CO004, CO010, CO011, CO012]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-governance
    title: Leadership, founders, and governance concentration
    body: >
      The company still centers on co-founder Zach Perret, with William Hockey remaining a
      historically important co-founder and Eric Hart joining as CFO in October 2023. The reporting
      surface suggests a private-company governance model that is still founder-led rather than
      fully institutionalized for public markets. That matters because the public narrative, the
      financing story, and the eventual IPO process are all likely to be read through Perret's
      execution and the depth of the rest of the operating bench. The main diligence question is
      whether Plaid can preserve that founder speed while also showing enough reporting rigor and
      bench strength for public investors to treat the business as something more durable than a
      single-person story.
    claimRefs: [CO005, CO006, CO013]
    tableRefs: [TO002]
  - id: financing-milestones
    title: Capitalization and milestone chronology
    body: >
      Plaid's financing path remains one of fintech's most visible valuation arcs: a $575M 2025
      financing at a $6.1B valuation, followed by an employee share sale in early 2026 that implied
      an $8B valuation. The company has disclosed roughly $1.31B of lifetime primary funding across
      seed through 2025, which is consistent with the scale of the investor base and the long private
      run-up to a possible IPO. The recent privacy settlement and 2026 Maine breach notice remain
      relevant milestone items because they sit alongside the financing story rather than outside it.
      The chronology matters because each financing step now sits against a changing regulatory and
      trust backdrop, not just a simple growth narrative.
    claimRefs: [CO007, CO008, CO009, CO012]
    tableRefs: [TO003]
