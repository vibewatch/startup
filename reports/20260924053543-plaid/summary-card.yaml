summary:
  headline: >
    Plaid remains the structurally dominant US open-banking infrastructure layer with ~$546M estimated ARR, 70%+ market
    share, and product diversification, but private disclosure opacity, regulatory headwinds, and a still-recovering
    valuation profile keep the stance at track until an IPO filing confirms the numbers.
