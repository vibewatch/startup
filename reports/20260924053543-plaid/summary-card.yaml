    - NRR and cohort retention remain undisclosed.
    - CFPB Section 1033 enforcement and related legal challenges remain a binary regulatory risk.
    - Leadership succession depth and post-founder bench strength remain unclear.
    - IPO terms, lock-up dynamics, and secondary-market pricing pressure remain unknown.
