company:
  name: Plaid
chapter:
  number: 6
  title: Customers
  summary: "Plaid's customer base has clearly broadened from fintech startups into enterprise and institutional workflows, and the refreshed evidence still supports meaningful adoption expansion. The remaining issue is less whether customers exist and more how concentrated, durable, and trust-sensitive that demand is once the first integration is live."
sections:
  - id: segmentation-adoption
    title: Customer segmentation and adoption trajectory
    body: >
      Plaid's customer base now spans fintech startups, enterprise software, lenders, banks, and
      payment-heavy businesses. The original self-serve developer motion still matters, but the
      current evidence shows a deeper enterprise layer with more than 1,000 enterprise customers and
      about 8,000 total customer companies. Adoption is therefore not just a logo count; it is a
      land-and-expand motion in which a buyer often starts with one workflow and adds more products
      once the integration is already in place. In practice, that matters because Plaid sits at the
      point where onboarding, account linking, verification, and payment initiation converge, so the
      customer value is sticky even when the buyer is not a pure fintech company. That makes the
      base broader than the usual developer-tools narrative and closer to infrastructure embedded in
      revenue or risk workflows for customers.
    claimRefs: [CU001, CU002, CU003, CU009, CU010, CU011]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: named-proof
    title: Named customer proof and production use
    body: >
      The refreshed evidence still shows real production use, not just marketing logos. TechCrunch
      names Venmo, Robinhood, Coinbase, Carvana, SoFi, H&R Block, Zillow, Faire, CarMax, Possible
      Finance, Empower, and Cross River as customers or partners tied to Plaid's enterprise
      expansion. The Cross River case study is especially useful because it shows a live workflow:
      Plaid powers instant account verification and pushes use cases into faster payment rails like
      RTP and FedNow. That is exactly the kind of proof point that tells you the product is embedded
      in core operations.
    claimRefs: [CU004, CU005, CU006]
    tableRefs: [TU002]
  - id: retention-concentration
    title: Retention, concentration, and trust constraints
    body: >
      Customer retention is still mostly inferred rather than disclosed. Plaid's data-privacy
      settlement and 2026 breach notice show that the trust premium is not abstract; it is part of
      how procurement teams think about bank-linking infrastructure. The key diligence issue is how
      much concentration sits inside the top enterprise customers and whether a few large accounts
      can meaningfully alter growth if they multi-home, internalize, or slow expansion. Until Plaid
      publishes retention metrics, the customer story remains strong but not fully underwritten.
    claimRefs: [CU007, CU008, CU012]
    tableRefs: [TU003]
