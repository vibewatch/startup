              - CM009
      - number: '2.2'
        title: Sizing lenses and buyer segmentation
        blocks:
          - type: paragraph
            body: >
              The refreshed evidence supports several independent sizing lenses rather than one neat TAM. Plaid's own
              network claims, the Harris Poll-backed fintech adoption survey, and the enterprise customer expansion all
              point to a market that keeps widening as payment, identity, and fraud use cases get attached to the same
              connection layer. The buying center is also broadening: the original self-serve fintech developer remains
              important, but enterprise software, lenders, and banks now participate because the integration has become
              a workflow decision as much as a data decision. In practice, that widens the buying committee from
              engineering into product, compliance, risk, and treasury, which is why adoption can accelerate quickly
              once one team proves the ROI.
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM005
              - CM006
      - number: '2.3'
        title: Growth drivers, constraints, and open questions
        blocks:
          - type: paragraph
            body: >
              Adoption is being pulled by two things at once: consumer demand for seamless onboarding and the regulatory
              move toward portable financial data. At the same time, the market faces constraints from bank-controlled
              access fees, direct-bank API programs, and the reality that some companies can still solve the problem
              with in-house engineering if they are large enough. The resulting market is big, but it is not
              frictionless, and the biggest diligence question is still how much of the spend ends up being attached to
              open-banking compliance versus pure product growth. That distinction matters for valuation because
              compliance-driven demand tends to be stickier, while discretionary product growth can be more cyclical.
            claimRefs:
              - CM008
              - CM009
              - CM011
              - CM012
