  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and user workflows
        blocks:
          - type: paragraph
            body: >
              Plaid delivers a hosted Link flow that lets users connect accounts and hand a token to the app they
              actually want to use. On top of that connective layer sit Auth, Balance, Identity, Transactions,
              Investments, Liabilities, Income, Monitor, Protect, Signal, Transfer, Payments, and Layer. The important
              product shift is that Plaid is no longer just a bank-linking utility: it now maps to onboarding, payments,
              fraud, KYC/AML, and credit workflows. That breadth makes the product sticky because the buyer can keep
              adding new use cases without rebuilding the same bank integration from scratch. It also means the product
              is increasingly sold as infrastructure for business operations, not as a narrow API wrapper around one
              bank-login task.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE010
          - type: table
