  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segmentation and adoption trajectory
        blocks:
          - type: paragraph
            body: >
              Plaid's customer base now spans fintech startups, enterprise software, lenders, banks, and payment-heavy
              businesses. The original self-serve developer motion still matters, but the current evidence shows a
              deeper enterprise layer with more than 1,000 enterprise customers and about 8,000 total customer
              companies. Adoption is therefore not just a logo count; it is a land-and-expand motion in which a buyer
              often starts with one workflow and adds more products once the integration is already in place. In
              practice, that matters because Plaid sits at the point where onboarding, account linking, verification,
              and payment initiation converge, so the customer value is sticky even when the buyer is not a pure fintech
              company. That makes the base broader than the usual developer-tools narrative and closer to infrastructure
              embedded in revenue or risk workflows for customers.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU009
              - CU010
