  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers, adjacent bundlers, and standards
        blocks:
          - type: paragraph
            body: >
              The refreshed evidence still frames MX Technologies and Finicity as Plaid's closest direct competitors in
              bank-account connectivity, with Stripe Financial Connections competing for developers that are already
              paying Stripe for payments infrastructure. FDX is not a company competitor in the classic sense, but it is
              a meaningful standards alternative because it gives banks a governance-led path for API data sharing. That
              makes Plaid's market less like a pure software category and more like a contest between convenience, bank
              control, and payment-stack bundling. Put differently, the market is split between people who want one
              developer API and institutions that want tighter control over who gets to touch the data.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
