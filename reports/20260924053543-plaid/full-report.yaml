        blocks:
          - type: paragraph
            body: >
              The company still centers on co-founder Zach Perret, with William Hockey remaining a historically
              important co-founder and Eric Hart joining as CFO in October 2023. The reporting surface suggests a
              private-company governance model that is still founder-led rather than fully institutionalized for public
              markets. That matters because the public narrative, the financing story, and the eventual IPO process are
              all likely to be read through Perret's execution and the depth of the rest of the operating bench. The
              main diligence question is whether Plaid can preserve that founder speed while also showing enough
              reporting rigor and bench strength for public investors to treat the business as something more durable
              than a single-person story.
