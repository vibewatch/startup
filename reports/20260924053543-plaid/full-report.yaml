companyProfile:
  summary: >
    Plaid Inc. was founded in 2013 in San Francisco by Zachary Perret and William Hockey, who initially attempted to
    build a consumer personal-finance app before pivoting to the underlying data-connectivity layer. Plaid's API enables
    fintech apps to read consumer bank account data (with user consent) for account verification, transaction
    enrichment, identity, income verification, and credit underwriting. By 2026, Plaid had extended beyond data
    aggregation into fraud prevention, payment initiation, credit infrastructure, and income / employment verification.
    The company withstood a failed $5.3B Visa acquisition, a 2022 restructuring, and a valuation reset from its $13.4B
    Series D peak — emerging as a leaner, operationally profitable business targeting a 2026–2027 IPO. As of the refresh
    date, Plaid still held ~70% US market share in open-banking aggregation and was growing ARR at approximately 40%
    year-over-year.
  foundedDate: '2013-01-01'
  founders:
    - name: Zachary (Zach) Perret
      role: Co-founder & CEO
      background: >
        Built Plaid from a consumer-finance app pivot and has led the company through the Visa deal collapse, 2022
        restructuring, valuation reset, and operational turn to profitability.
      claimRefs:
        - CO004
    - name: William Hockey
      role: Co-founder (former CTO, departed 2021)
      background: |
