      - number: '3.2'
        title: Plaid's differentiation and competitive limits
        blocks:
          - type: paragraph
            body: >
              Plaid's strongest edge is still developer ergonomics plus installed-base breadth: a single integration can
              reach many institutions and then expand into identity, payments, fraud, and onboarding workflows. That
              makes the company harder to replace once a buyer has multi-product adoption in place. The weakness is that
              the same breadth also invites bundling pressure, and the more a buyer already uses Stripe,
              Mastercard/Finicity, or a bank-led standard, the easier it is to treat Plaid as one component rather than
              the whole stack. The moat is therefore partly technical and partly organizational: once the buyer's
              internal teams have standardized around Plaid, the replacement cost includes retraining, compliance
              review, and product change management.
            claimRefs:
              - CP004
              - CP005
              - CP008
              - CP011
