    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, scale, and product surface
        blocks:
          - type: paragraph
            body: >
              Plaid is still best understood as the connectivity layer between consumer bank accounts and the apps that
              need them. The refreshed sources continue to show a large installed base: Plaid says it supports more than
              12,000 financial institutions and over 9,000 digital financial services, while Axis Intelligence and Sacra
              point to more than 500 million cumulative consumer account connections, roughly 7,000+ customer companies,
              and a 2025 ARR estimate of $546M. That combination of network breadth and recurring usage keeps Plaid in a
              structurally strong position even before a public filing. The product surface also keeps widening: beyond
              account linking, the platform now spans payments, fraud, identity, credit, and onboarding workflows, which
              matters because those adjacent products are what make the company more than a pure bank-aggregation
              utility.
