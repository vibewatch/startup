      - number: '6.2'
        title: Named customer proof and production use
        blocks:
          - type: paragraph
            body: >
              The refreshed evidence still shows real production use, not just marketing logos. TechCrunch names Venmo,
              Robinhood, Coinbase, Carvana, SoFi, H&R Block, Zillow, Faire, CarMax, Possible Finance, Empower, and Cross
              River as customers or partners tied to Plaid's enterprise expansion. The Cross River case study is
              especially useful because it shows a live workflow: Plaid powers instant account verification and pushes
              use cases into faster payment rails like RTP and FedNow. That is exactly the kind of proof point that
              tells you the product is embedded in core operations.
            claimRefs:
              - CU004
              - CU005
              - CU006
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
      - number: '6.3'
        title: Retention, concentration, and trust constraints
        blocks:
          - type: paragraph
            body: >
              Customer retention is still mostly inferred rather than disclosed. Plaid's data-privacy settlement and
              2026 breach notice show that the trust premium is not abstract; it is part of how procurement teams think
              about bank-linking infrastructure. The key diligence issue is how much concentration sits inside the top
              enterprise customers and whether a few large accounts can meaningfully alter growth if they multi-home,
              internalize, or slow expansion. Until Plaid publishes retention metrics, the customer story remains strong
              but not fully underwritten.
            claimRefs:
              - CU007
              - CU008
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU006
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and bank-partner dependency
        blocks:
          - type: paragraph
            body: >
              Plaid does not own the bank rails it sits on, so access risk is partly an external-policy question and
              partly a partner-management question. The company can sign renewals and keep adding institution coverage,
              but a changed access rule, a stricter consent requirement, or a renegotiated bank agreement can still
              alter economics quickly. That makes regulation and partner access the first-order diligence issue rather
              than a background compliance footnote. It also means Plaid's moat is partly negotiated, not purely
              technical, because the product is only as strong as the permissions, integrations, and consent flows it
              can continuously renew. In other words, access durability is a strategic asset and a strategic liability
              at the same time.
            claimRefs:
              - CR001
              - CR010
              - CR012
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR005
              - CR007
              - CR010
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR007
              - CR012
      - number: '7.2'
        title: Security, privacy, and consumer trust
        blocks:
          - type: paragraph
            body: >
              The 2026 breach notice and the surrounding privacy coverage show that trust risk is live, not
              hypothetical. Because Plaid sits in the path between bank accounts and downstream apps, any security or
              privacy event can spread beyond a single product into buyer perception across the whole platform. The
              issue is not just breach cleanup cost; it is whether procurement teams start treating Plaid as a
              higher-friction vendor after each new incident or lawsuit. For a company like Plaid, a headline breach can
              become a sales objection for entirely different workflows because buyers usually do not separate "linking"
              risk from the rest of the stack. That makes every new trust event potentially cumulative rather than
              isolated.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR010
      - number: '7.3'
        title: Substitution, migration, and reliability risk
        blocks:
          - type: paragraph
            body: >
              Plaid's API layer is defensible because it is embedded, but it is not irreplaceable. Developer comparisons
              against other account-data vendors and even ad hoc bank-data approaches show that teams can at least
              benchmark alternatives. That means reliability incidents, pricing moves, or regulatory friction can
              accelerate multi-homing or partial migration even when the primary integration stays in place. The
              practical risk is not an all-at-once switch; it is a slow reduction in share-of-wallet if a buyer starts
              routing new use cases elsewhere while keeping Plaid on the legacy path. This is why the migration risk
              matters even when headline customer counts keep rising.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR009
          - type: table
            tableRef: TR003
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR009
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Private-market reset and recent marks
        blocks:
          - type: paragraph
            body: >
              Plaid's private-market pricing has clearly reset from the 2021 peak. The 2025 financing round landed at
              $6.1 billion, while later secondary-market coverage points to an about-$8 billion level in 2026. That is a
              meaningful recovery, but it is not the same thing as a full re-rating back to the old high. The important
              takeaway is that the market still values Plaid like a strong infrastructure asset with real scale, not
              like a runaway growth story with no regulatory baggage. The rebound is therefore real, but it still
              depends on investors believing that the company can keep compounding without first-guessing the eventual
              IPO discount. Put differently, the re-rating is credible but not yet fully locked in.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV012
      - number: '8.2'
        title: Revenue, profitability, and the valuation bridge
        blocks:
          - type: paragraph
            body: >
              The valuation discussion only makes sense when tied to operating scale. Refresh evidence points to a
              business that has reached enough scale and profitability to support a materially larger equity value than
              earlier rounds implied. The exact bridge from operating metrics to equity value is still estimated rather
              than filed, but the market clearly treats Plaid as a durable infrastructure platform rather than a
              one-product fintech point solution. That gap matters because every valuation headline currently bundles
              operating performance, liquidity demand, and narrative momentum into one number.
            claimRefs:
              - CV004
              - CV006
              - CV007
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV006
              - CV007
      - number: '8.3'
        title: IPO and public-market scenarios
        blocks:
          - type: paragraph
            body: >
              The current public-market conversation clusters around an IPO valuation in the high single digits to low
              double digits. Several 2026 articles frame $8.5 billion to $10 billion as a plausible range, which is
              consistent with a company that has recovered from the down-round but still faces a public-market discount
              for disclosure and regulatory uncertainty. The real underwriting question is not whether Plaid can go
              public; it is whether it can do so without the public market shaving away the private-market rebound. A
              clean filing would narrow the debate to actual numbers, but until then the range stays opinion-heavy.
            claimRefs:
              - CV003
              - CV008
              - CV009
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV008
              - CV011
              - CV012
