  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >
              Plaid is not selling a single app; it is selling access to financial data, verification rails, and
              money-movement workflows that sit underneath consumer finance products. The market therefore includes
              bank-linking, account verification, transaction data, income and identity verification, and adjacent
              payments or fraud products. It excludes the consumer app itself and any purely internal treasury stack.
              The practical substitutes are manual bank-entry, direct bank APIs or OAuth rails, and internal build. That
              boundary matters because Plaid's pricing and moat are tied to how expensive and error-prone those
              substitutes are. It also means the category should be evaluated as a workflow layer, not just as a data
              vendor, because the buyer is often comparing time-to-integrate and conversion impact rather than a simple
              line-item API price.
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM007
