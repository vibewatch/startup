  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams and pricing model
        blocks:
          - type: paragraph
            body: >
              Plaid monetizes a B2B platform, not a consumer app. The company charges businesses for account
              connectivity, verification, data access, and newer payments or fraud products. The refreshed evidence
              still shows a mix of one-time fees, per-use charges, subscription pricing, and larger enterprise
              contracts, which means realized revenue depends on volume, account breadth, and whether a buyer expands
              from a single integration into multiple products. That mix is good for retention but makes list pricing a
              weak proxy for realized economics. In other words, the company sells a usage-led platform at the low end
              and a relationship-led platform at the high end, so the real test is whether the same customer keeps
              adding products after the first integration.
