      - number: '5.2'
        title: Architecture, deployment, and support model
        blocks:
          - type: paragraph
            body: >
              The quickstart and engineering evidence point to a platform that is built to be integrated quickly, but
              still requires real operational support. Plaid's public quickstart spans multiple client libraries and
              languages, while the GitHub customer story shows an internal engineering organization that uses
              self-hosted GitHub Enterprise, canary-style deployment flows, and a heavy documentation culture. The AWS
              and Cross River case study then shows the operational payoff: Plaid can ride multiple bank rails, not just
              screen scraping, and push verification into faster payment pathways. The public surface is polished, but
              the underlying ops stack is still a real distributed system with support, rollout, and incident-management
              consequences.
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE007
      - number: '5.3'
        title: Differentiation, reliability, and control points
        blocks:
          - type: paragraph
            body: >
              The differentiator is not just API breadth; it is the combination of developer tooling, product depth, and
              operational controls. At the same time, Plaid's institution-error docs show that uptime and institution
              availability still matter at the edge of the product, and the company's security / consent posture remains
              a live issue because every connection touches sensitive financial data. That means the product moat
              depends on more than features: it also depends on reliability, support process, and how well Plaid can
              keep bank connectivity boring enough for buyers to trust it as infrastructure. If the support loop fails,
              the UX advantage quickly turns into a procurement concern.
            claimRefs:
              - CE008
              - CE009
              - CE011
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
