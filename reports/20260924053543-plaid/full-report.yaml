              - CP011
      - number: '3.3'
        title: Switching costs, trust, and moat durability
        blocks:
          - type: paragraph
            body: >
              Switching costs are real but not absolute. Multi-homing is common because teams often keep a backup rail
              for edge institutions, and large enterprise buyers can still build parts of the stack in-house when
              privacy or control becomes strategic. Plaid's privacy settlement and the 2026 Maine breach notice also
              keep trust in the foreground, which means moat durability will depend as much on reliability and
              governance as on raw coverage. That is why the moat question is less "is there competition?" and more "how
              much of the workflow stays glued to Plaid once the first integration is done?" In a category like this,
              trust, uptime, and procurement experience can matter as much as feature breadth because buyers are wiring
              core financial workflows to the vendor.
            claimRefs:
