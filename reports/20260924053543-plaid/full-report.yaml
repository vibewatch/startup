      - number: '4.2'
        title: Revenue quality, growth, and margin path
        blocks:
          - type: paragraph
            body: >
              The refreshed estimates still point to a sizable, recurring business: Sacra pegs 2025 ARR at roughly
              $546M, up 40% year over year, and also says Plaid reached adjusted EBITDA profitability in 2025. The
              important financial question is not just whether the company is growing, but whether that growth comes
              from a durable mix of enterprise contracts, broader product adoption, and lower churn rather than one-off
              usage spikes. On the evidence available here, Plaid looks like a platform with strong gross-margin
              potential and improving operating leverage, but not one with audited public disclosure. The market can see
              the slope, but not the full income statement.
            claimRefs:
