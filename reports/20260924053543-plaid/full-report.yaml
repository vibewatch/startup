              - CI005
              - CI006
              - CI007
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI007
      - number: '4.3'
        title: Capital adequacy and diligence gaps
        blocks:
          - type: paragraph
            body: >
              Capital has not been the obvious constraint: the company has already raised more than $1.3B across primary
              rounds and still refreshed its valuation upward to an $8B employee tender in early 2026. Even so, the
              absence of audited financials means the actual cash balance, burn, and runway remain opaque, and the next
              real underwriting event is still the eventual IPO filing rather than a routine private disclosure package.
              Until then, Plaid's financial diligence hinges on whether the growth story, the margin story, and the
              capital story all reconcile. The underlying question is whether public-market disclosure will confirm the
              private estimates or force a material reset.
            claimRefs:
