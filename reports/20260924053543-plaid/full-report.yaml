        title: Capitalization and milestone chronology
        blocks:
          - type: paragraph
            body: >
              Plaid's financing path remains one of fintech's most visible valuation arcs: a $575M 2025 financing at a
              $6.1B valuation, followed by an employee share sale in early 2026 that implied an $8B valuation. The
              company has disclosed roughly $1.31B of lifetime primary funding across seed through 2025, which is
