  topStrengths:
    - >-
      Dominant market position: 70%+ US open-banking aggregation share and 8,000+ integrated apps create a multi-sided
      network effect moat.
    - >-
      ARR acceleration with product diversification: roughly $546M 2025E ARR growing around 40% YoY, with fraud,
      payments, and credit products adding mix.
    - >-
      Consumer-consent data flywheel: 100M+ permissioned consumer accounts and massive connection volume generate
      proprietary behavioral data.
    - >-
      Operational profitability and IPO optionality: profitability and scale support a credible 2026–2027 public-market
      path.
    - >-
      Expanded customer proof: named enterprise and partner references show real production usage across payments,
      verification, and account-linking workflows.
  topRisks:
    - >-
      Regulatory and partner-access dependence: access rules, consent requirements, and bank negotiations can still
      alter economics quickly.
    - 'Customer concentration: a small set of mega-app and enterprise buyers likely drives a large share of revenue.'
