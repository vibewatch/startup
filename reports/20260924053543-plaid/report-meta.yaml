companyProfile:
  summary: >
    Plaid Inc. was founded in 2013 in San Francisco by Zachary Perret and William Hockey, who initially attempted to
    build a consumer personal-finance app before pivoting to the underlying data-connectivity layer. Plaid's API enables
    fintech apps to read consumer bank account data (with user consent) for account verification, transaction
    enrichment, identity, income verification, and credit underwriting. By 2026, Plaid had extended beyond data
    aggregation into fraud prevention, payment initiation, credit infrastructure, and income / employment verification.
    The company withstood a failed $5.3B Visa acquisition, a 2022 restructuring, and a valuation reset from its $13.4B
    Series D peak — emerging as a leaner, operationally profitable business targeting a 2026–2027 IPO. As of the refresh
    date, Plaid still held ~70% US market share in open-banking aggregation and was growing ARR at approximately 40%
    year-over-year.
  foundedDate: '2013-01-01'
  founders:
    - name: Zachary (Zach) Perret
      role: Co-founder & CEO
      background: >
        Built Plaid from a consumer-finance app pivot and has led the company through the Visa deal collapse, 2022
        restructuring, valuation reset, and operational turn to profitability.
      claimRefs:
        - CO004
    - name: William Hockey
      role: Co-founder (former CTO, departed 2021)
      background: |
        Departed as CTO in 2021 to co-found Column (a chartered national bank); retains a board director role at Plaid.
      claimRefs:
        - CO005
  foundingLocation: San Francisco, California
  headquarters: San Francisco, California
  productSummary: >
    Plaid sells developer API products across five pillars: data connectivity, income verification, fraud and risk,
    payments, and consumer finance. The platform covers bank-linking, transaction enrichment, identity, verification,
    payment initiation, and risk controls for fintech and enterprise buyers.
  customerFocus: >
    Primary: developer-tier fintechs and SMB apps on self-serve, graduating to enterprise contract. Strategic: mega-app
    fintechs and enterprise workflows driving the bulk of revenue; banks and credit unions are emerging as
    compliance-oriented buyers.
  businessModel: >
    Three-tier revenue model: per-connection fees for core data products, subscription pricing for developer-tier apps,
    and annual enterprise contracts with committed minimum usage. Newer products use subscription or per-verification
    pricing. Revenue remains predominantly recurring and consumption-based.
  stage: Late-stage Private (Series E, IPO-track 2026–2027)
  fundingStatus: >
    ~$1.3B raised across five primary rounds (2013–2025). April 2025 Series E: $575M at $6.1B post-money valuation. 2026
    liquidity coverage points to about an $8.0B valuation. IPO filing remains the next major catalyst.
  disclosureProfile: private-undisclosed
  claimRefs:
    - CO001
    - CO004
    - CO005
    - CO009
    - CO013
summary:
