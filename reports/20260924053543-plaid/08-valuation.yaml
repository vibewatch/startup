company:
  name: Plaid
chapter:
  number: 8
  title: Valuation
  summary: "Plaid's valuation has recovered from the 2021 peak but still trades below the old high-water mark. The market is pricing a business with strong scale and profitability, yet the absence of public filings keeps the private-market rebound partly narrative-driven."
sections:
  - id: private-market-reset
    title: Private-market reset and recent marks
    body: >
      Plaid's private-market pricing has clearly reset from the 2021 peak. The 2025 financing round
      landed at $6.1 billion, while later secondary-market coverage points to an about-$8 billion
      level in 2026. That is a meaningful recovery, but it is not the same thing as a full re-rating
      back to the old high. The important takeaway is that the market still values Plaid like a
      strong infrastructure asset with real scale, not like a runaway growth story with no
      regulatory baggage. The rebound is therefore real, but it still depends on investors believing
      that the company can keep compounding without first-guessing the eventual IPO discount.
      Put differently, the re-rating is credible but not yet fully locked in.
    claimRefs: [CV001, CV002, CV005, CV010]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: revenue-linkage
    title: Revenue, profitability, and the valuation bridge
    body: >
      The valuation discussion only makes sense when tied to operating scale. Refresh evidence
      points to a business that has reached enough scale and profitability to support a materially
      larger equity value than earlier rounds implied. The exact bridge from operating metrics to
      equity value is still estimated rather than filed, but the market clearly treats Plaid as a
      durable infrastructure platform rather than a one-product fintech point solution. That gap
      matters because every valuation headline currently bundles operating performance, liquidity
      demand, and narrative momentum into one number.
    claimRefs: [CV004, CV006, CV007]
    tableRefs: [TV002]
  - id: public-market-scenarios
    title: IPO and public-market scenarios
    body: >
      The current public-market conversation clusters around an IPO valuation in the high single
      digits to low double digits. Several 2026 articles frame $8.5 billion to $10 billion as a
      plausible range, which is consistent with a company that has recovered from the down-round but
      still faces a public-market discount for disclosure and regulatory uncertainty. The real
      underwriting question is not whether Plaid can go public; it is whether it can do so without
      the public market shaving away the private-market rebound. A clean filing would narrow the
      debate to actual numbers, but until then the range stays opinion-heavy.
    claimRefs: [CV003, CV008, CV009, CV011, CV012]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Valuation history table
    columns: [date, event, value, signal, implication]
    rows:
      - ["2021", "Series D peak", "$13.4B", "Peak mark", "High-water valuation still matters as the comparison base"]
      - ["Apr 2025", "Funding round", "$6.1B", "Down round", "Reset the private market lower"]
      - ["Feb 2026", "Employee liquidity / share-sale coverage", "$8.0B", "Recovery", "Suggests a rebound but not a new top"]
      - ["Jul 2026", "IPO preview articles", "$8.5B-$10B", "Range", "Indicates current market expectations"]
    notes: "This table mixes completed financings with secondary-market and media-reported valuation points because no S-1 exists yet."
    claimRefs: [CV001, CV002, CV003, CV005]
  - id: TV002
    title: Operating metrics bridge
    columns: [metric, estimate, date, source, implication]
    rows:
      - ["ARR / revenue scale", "$546M", "2025", "Tracxn / official coverage", "Supports a much larger denominator than early rounds"]
      - ["Growth", "~40% YoY", "2025", "IPO preview coverage", "Growth remains good enough to preserve premium pricing"]
      - ["Profitability", "First profitable year", "2025", "IPO preview coverage", "De-risks the denominator"]
      - ["Customer footprint", "500M+ connected accounts", "2025/2026", "Official / analytics coverage", "Signals scale and network value"]
    notes: "These are directional market estimates, not audited financial statements."
    claimRefs: [CV004, CV006, CV007]
  - id: TV003
    title: Scenario table
    columns: [scenario, valuation, what has to be true, risk]
    rows:
      - ["Bear", "$6B-$7B", "Public investors focus on regulation and disclosure gaps", "The private-market discount persists"]
      - ["Base", "$8B-$9B", "Momentum and profitability offset caution", "Fairly valued but not a breakout"]
      - ["Bull", "$9.5B-$10B+", "Regulatory backdrop and growth both cooperate", "Requires a clean IPO window"]
    enumerationScope:
      coverage: partial
      basis: "Scenario coverage is intentionally bounded to the three most plausible public-market outcomes."
    notes: "The scenario table is qualitative and intentionally omits precise dilution math until an S-1 appears."
    claimRefs: [CV003, CV008, CV011, CV012]
