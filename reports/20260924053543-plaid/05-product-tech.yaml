      - ["Move money or pay out", "Multiple bank/payment integrations", "Transfer / Payments", "One stack for funds movement", "Rail coverage varies by region"]
      - ["Reduce fraud risk", "Separate risk vendor plus manual review", "Signal / Protect / Monitor", "Better upstream decisioning", "Needs data volume to be most effective"]
      - ["Underwrite lending", "Bank statements and manual income checks", "Income / Assets / Liabilities", "Faster decisions and better data context", "Coverage and accuracy can vary"]
    notes: "This table maps user jobs to Plaid workflows rather than pretending every use case has identical economics."
    claimRefs: [CE001, CE002, CE003, CE006, CE007]
  - id: TE003
    title: Technology / operating architecture table
    columns: [layer/process/component, role, dependency, risk]
    rows:
      - ["Hosted Link UI", "Front-door account connection", "Bank login and consent flow", "UX friction or bank changes can reduce conversion"]
      - ["API / token exchange", "Moves account access from app to Plaid and back", "Client libraries and auth flow", "Auth failures can break the integration"]
      - ["Bank connectivity layer", "Normalizes institution differences", "Bank availability and protocol variation", "Institution outages become product incidents"]
      - ["Rail partners", "Enable verification and money movement", "ACH, RTP, FedNow, and bank partners", "Coverage and partner policy can change"]
      - ["Developer tooling", "Quickstarts, docs, GitHub workflows", "Docs quality and internal infra", "Poor docs or slow release cycles slow adoption"]
    notes: "The architecture is mostly software, but the operational dependency surface includes banks, rail partners, and internal support processes."
    claimRefs: [CE004, CE005, CE006, CE008, CE009, CE011]
