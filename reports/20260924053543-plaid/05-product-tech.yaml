chapter:
  number: 5
  title: Product & Technology
  summary: "Plaid's product stack is broader than bank linking alone: the company now spans account connection, verification, payments, fraud, identity, onboarding, and credit workflows. The refreshed evidence still suggests a strong developer surface, but support, uptime, and trust controls remain central to how the product actually behaves in production."
sections:
  - id: product-surface
    title: Product surface and user workflows
    body: >
      Plaid delivers a hosted Link flow that lets users connect accounts and hand a token to the
      app they actually want to use. On top of that connective layer sit Auth, Balance, Identity,
      Transactions, Investments, Liabilities, Income, Monitor, Protect, Signal, Transfer, Payments,
      and Layer. The important product shift is that Plaid is no longer just a bank-linking utility:
      it now maps to onboarding, payments, fraud, KYC/AML, and credit workflows. That breadth makes
      the product sticky because the buyer can keep adding new use cases without rebuilding the same
      bank integration from scratch. It also means the product is increasingly sold as
      infrastructure for business operations, not as a narrow API wrapper around one bank-login
      task.
    claimRefs: [CE001, CE002, CE003, CE010]
    tableRefs: [TE001]
    figureRefs: [FE001]
  - id: architecture-ops
    title: Architecture, deployment, and support model
    body: >
      The quickstart and engineering evidence point to a platform that is built to be integrated
      quickly, but still requires real operational support. Plaid's public quickstart spans multiple
      client libraries and languages, while the GitHub customer story shows an internal engineering
      organization that uses self-hosted GitHub Enterprise, canary-style deployment flows, and a
      heavy documentation culture. The AWS and Cross River case study then shows the operational
      payoff: Plaid can ride multiple bank rails, not just screen scraping, and push verification
      into faster payment pathways. The public surface is polished, but the underlying ops stack is
      still a real distributed system with support, rollout, and incident-management consequences.
    claimRefs: [CE004, CE005, CE006, CE007]
    tableRefs: [TE002]
  - id: differentiation-controls
    title: Differentiation, reliability, and control points
    body: >
      The differentiator is not just API breadth; it is the combination of developer tooling,
      product depth, and operational controls. At the same time, Plaid's institution-error docs show
      that uptime and institution availability still matter at the edge of the product, and the
      company's security / consent posture remains a live issue because every connection touches
      sensitive financial data. That means the product moat depends on more than features: it also
      depends on reliability, support process, and how well Plaid can keep bank connectivity boring
      enough for buyers to trust it as infrastructure. If the support loop fails, the UX advantage quickly turns into a
      procurement concern.
    claimRefs: [CE008, CE009, CE011, CE012]
    tableRefs: [TE003]
