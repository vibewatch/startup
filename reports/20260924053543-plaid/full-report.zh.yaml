    title: 公司概况
    sections:
      - number: '1.1'
        title: 定位、规模与产品版图
        blocks:
          - type: paragraph
            body: >
              Plaid 的核心角色，是连接个人银行账户与需要这些数据的应用。最新资料显示，其网络覆盖面仍然很广：Plaid 称已接入超过 12,000 家金融机构和 9,000 多种数字金融服务；Axis
              Intelligence 与 Sacra 则估计，累计账户连接超过 5 亿次、客户公司约 7,000 多家，2025 年 ARR 约为 $546M。广泛覆盖和持续使用，使 Plaid
              在提交公开申报文件前仍具结构性优势。产品也不止账户连接，还涵盖支付、反欺诈、身份、信贷和用户入驻等工作流；这些相邻产品让它不再只是银行账户聚合工具。
