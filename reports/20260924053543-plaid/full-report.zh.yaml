        title: 资金充裕度与尽调信息缺口
        blocks:
          - type: paragraph
            body: >
              资本目前看起来并非明显瓶颈：Plaid 一级市场累计融资超过 $1.3B，2026 年初员工股份出售又对应 $8B 估值。但没有经审计财报，现金余额、烧钱速度和资金可支撑时间仍不透明。下一个真正的投资判断节点是
              IPO 申报，而不是例行的私营公司披露。在此之前，要核对增长、利润率和融资情况能否彼此印证；上市披露究竟会确认私募市场估算，还是带来明显下调，仍待观察。
