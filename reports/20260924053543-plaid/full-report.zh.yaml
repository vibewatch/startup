        title: 收入质量、增长走势与利润率轨迹
        blocks:
          - type: paragraph
            body: >
              Sacra 估计 Plaid 2025 年 ARR 约 $546M，同比增长 40%，并称公司当年实现调整后 EBITDA
              盈利。财务尽调要看的不只是增长，还要判断增长是否来自稳固的企业合同、多产品渗透和较低流失，而非一次性用量激增。现有证据显示，Plaid
              毛利率潜力较强，经营杠杆也在改善；但公司尚未公开经审计的财务数据。市场看得到增长趋势，却看不到完整利润表。
