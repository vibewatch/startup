      - number: '2.3'
        title: 增长驱动力、制约瓶颈与开放问题
        blocks:
          - type: paragraph
            body: >
              推动市场采纳的力量来自两头：一是个人用户对顺畅入驻体验的刚需，二是推动金融数据可携性的监管趋势。与此相伴，市场也面临多重制约：银行掌控的接口访问收费、大行自建的直连 API
              方案，以及规模足够庞大的机构仍可选择自研兜底。             
              这个市场体量不小，却并非畅通无阻。尽调的关键问题仍是：企业支出中有多少用于满足开放银行合规要求，又有多少来自产品增长？这一区分会影响估值判断：合规需求通常更稳定，产品扩张支出则可能更具周期性。
