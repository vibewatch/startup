companyProfile:
  summary: >
    2013 年，Zachary Perret 与 William Hockey 在旧金山创立 Plaid Inc.。两人最初试图开发面向消费者的个人理财应用，随后转型切入底层数据连接层。Plaid 的 API
    让金融科技应用能在获得用户授权的前提下读取银行账户数据，用于账户验证、交易明细清洗补全、身份验证、收入核验以及信贷审核。到 2026 年，Plaid
    已从单纯的数据聚合延伸至欺诈防范、支付发起、信贷基础设施以及收入与就业核验。公司顶住了 $5.3B Visa 收购案流产、2022 年业务重组以及估值从 Series D 顶峰 $13.4B
    大幅回落的冲击，精简组织并跑通运营盈利，瞄准 2026–2027 年推进 IPO。截至本轮更新基准日，Plaid 在美国开放银行数据聚合领域仍握有约 70% 的市场份额，ARR 同比增速约 40%。
