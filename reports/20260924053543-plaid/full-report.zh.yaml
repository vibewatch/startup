  customerFocus: |
    主力客群：以自助模式起步的开发者层级金融科技公司与中小企业应用，成熟后转化为企业级合约。战略客群：贡献大部分收入的超级金融应用与企业级工作流；银行及信用社正成为看重合规的新兴买方。
  businessModel: |
    收费分三层：核心数据产品按连接次数收费，开发者版应用按订阅收费，企业客户签订带最低用量承诺的年度合同。新产品则按订阅或单次核验收费。收入整体以经常性和用量计费为主。
