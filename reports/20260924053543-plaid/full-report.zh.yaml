  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源与定价模式
        blocks:
          - type: paragraph
            body: >
              Plaid
              面向企业销售平台服务，而非消费者应用。企业为账户连接、核验、数据访问，以及新推出的支付和反欺诈产品付费。收入包括一次性收费、按量计费、订阅和大型企业合同；实际收入取决于调用量、接入账户范围，以及客户会否从单一产品扩展到多款产品。这样的组合有利于留存，但公开标价难以反映实际收入质量。小客户主要按用量付费，大客户则靠长期客户关系；关键要看客户完成首次集成后，是否会继续增加产品。
            claimRefs:
