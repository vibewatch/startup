      - number: '3.3'
        title: 切换成本、信任基础与护城河韧性
        blocks:
          - type: paragraph
            body: >
              切换成本确实存在，但并非不可逾越。企业常同时接入多家供应商，为少见的银行保留备用通道；大型企业也能在隐私或控制权变得重要时自建部分系统。Plaid 的隐私和解及 2026
              年缅因州数据泄露通知，让信任问题更加突出。因此，护城河能否持久，既看覆盖范围，也看可靠性和治理。关键不是有没有竞争，而是完成首次集成后，有多少工作流仍留在
              Plaid。对接核心金融流程的买方同样看重信任、可用性和采购体验。
