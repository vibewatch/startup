      - number: '1.3'
        title: 资本结构与关键里程碑演进
        blocks:
          - type: paragraph
            body: >
              Plaid 的估值经历是金融科技领域最受关注的轨迹之一：2025 年融资 $575M，估值 $6.1B；2026 年初的员工股份要约收购对应 $8B 隐含估值。公司披露，自种子轮至 2025 年累计完成约
              $1.31B 的一级融资，背后是庞大的投资者阵容，也反映了其为可能的 IPO 长期保持私营状态。近期隐私相关和解及 2026
              年向缅因州提交的数据泄露通知，同样是这段融资历程中的重要节点。后续融资每一步都要放在监管和信任环境变化中看，而不能只按增长故事解读。
