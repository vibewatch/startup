  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >
              Plaid
              卖的不是面向消费者的应用，而是支撑消费金融产品的数据接口、核验通道和资金流转工作流。市场范围包括银行账户连接与验证、交易数据、收入和身份核验，以及相邻的支付、反欺诈产品；不包括消费者应用本身或企业内部资金管理系统。替代方案有手动录入银行信息、直连银行
              API 或 OAuth，以及内部自建。替代方案的成本和出错率，决定了 Plaid 的定价空间和护城河。评估这个市场也不能只把它当作数据供应商：买方往往更在意集成所需时间和转化率变化，而非单项 API 报价。
