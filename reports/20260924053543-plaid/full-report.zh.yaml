      - number: '1.2'
        title: 管理层、创始人与治理集中度
        blocks:
          - type: paragraph
            body: >
              Plaid 的管理仍以联合创始人 Zach Perret 为中心；另一位重要联合创始人 William Hockey 仍具历史影响力，Eric Hart 于 2023 年 10 月出任
              CFO。公开报道显示，公司治理仍是创始人主导的私营公司模式，尚未完全制度化到适配公开市场的程度。Perret 的执行力和其他高管的梯队深度，很可能影响市场叙事、融资和 IPO 进程。尽调要看的是：Plaid
              能否保留创始团队的决策速度，同时拿出足够扎实的报告规范和管理梯队，让公众投资者相信公司不只依赖一位创始人。
