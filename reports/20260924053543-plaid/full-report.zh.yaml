  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品矩阵与用户工作流
        blocks:
          - type: paragraph
            body: >
              Plaid 的托管式 Link 流程让用户连接账户，再把令牌交给目标应用。底层连接之上还有
              Auth、Balance、Identity、Transactions、Investments、Liabilities、Income、Monitor、Protect、Signal、Transfer、Payments
              和 Layer。如今 Plaid 已不只是银行连接工具，还支持用户入驻、支付、反欺诈、KYC/AML 和信贷工作流。客户可在原有集成上增加用例，不必重建银行连接；Plaid
              因而逐渐成为业务基础设施，而不只是围绕银行登录的一层 API。
