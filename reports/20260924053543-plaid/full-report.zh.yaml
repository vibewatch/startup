  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接竞品、跨界打包方与行业标准
        blocks:
          - type: paragraph
            body: >
              MX Technologies 和 Finicity 仍是 Plaid 在银行账户连接领域最直接的对手；Stripe Financial Connections 则争取已经使用 Stripe
              支付基础设施的开发者。FDX 不是传统商业竞品，却提供了另一条路径：银行可依循行业治理标准共享 API 数据。于是，竞争不只是软件产品之争，也在比较接入便利、银行控制权和支付产品捆绑。开发者想要一个统一
              API，金融机构则希望更严格地掌控数据访问。
