        title: 市场规模测算视角与买方客群细分
        blocks:
          - type: paragraph
            body: >
              最新证据适合从多个独立视角衡量市场，而非压成一个 TAM 数字。Plaid 自述的网络数据、Harris Poll
              支持的金融科技使用调查，以及企业客户的扩张，都指向同一趋势：支付、身份和反欺诈用途不断接入同一连接层，市场随之扩大。买方也在变化：自助接入的金融科技开发者仍然重要，企业软件公司、放贷机构和银行也开始参与，因为集成已不只是数据调用，而是工作流决策。采购团队因此从工程部门扩展到产品、合规、风控和资金部门；一旦有团队验证了
              ROI，采用速度就可能迅速提升。
