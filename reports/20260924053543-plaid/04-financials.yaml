company:
  name: Plaid
chapter:
  number: 4
  title: Financials
  summary: "Plaid's financial picture is still strong on top-line growth and product expansion, but the company remains privately held and therefore under-disclosed relative to public-market peers. The refreshed evidence supports a recurring, high-margin platform story, while leaving audited revenue, cash, and retention metrics unresolved."
sections:
  - id: revenue-model
    title: Revenue streams and pricing model
    body: >
      Plaid monetizes a B2B platform, not a consumer app. The company charges businesses for
      account connectivity, verification, data access, and newer payments or fraud products. The
      refreshed evidence still shows a mix of one-time fees, per-use charges, subscription pricing,
      and larger enterprise contracts, which means realized revenue depends on volume, account
      breadth, and whether a buyer expands from a single integration into multiple products. That
      mix is good for retention but makes list pricing a weak proxy for realized economics. In other
      words, the company sells a usage-led platform at the low end and a relationship-led platform
      at the high end, so the real test is whether the same customer keeps adding products after the
      first integration.
    claimRefs: [CI001, CI002, CI003]
    tableRefs: [TI001]
    figureRefs: [FI001]
  - id: revenue-quality
    title: Revenue quality, growth, and margin path
    body: >
      The refreshed estimates still point to a sizable, recurring business: Sacra pegs 2025 ARR at
      roughly $546M, up 40% year over year, and also says Plaid reached adjusted EBITDA
      profitability in 2025. The important financial question is not just whether the company is
      growing, but whether that growth comes from a durable mix of enterprise contracts, broader
      product adoption, and lower churn rather than one-off usage spikes. On the evidence available
      here, Plaid looks like a platform with strong gross-margin potential and improving operating
      leverage, but not one with audited public disclosure. The market can see the slope, but not
      the full income statement.
    claimRefs: [CI004, CI005, CI006, CI007]
    tableRefs: [TI002]
  - id: capital-adequacy
    title: Capital adequacy and diligence gaps
    body: >
      Capital has not been the obvious constraint: the company has already raised more than $1.3B
      across primary rounds and still refreshed its valuation upward to an $8B employee tender in
      early 2026. Even so, the absence of audited financials means the actual cash balance, burn,
      and runway remain opaque, and the next real underwriting event is still the eventual IPO filing
      rather than a routine private disclosure package. Until then, Plaid's financial diligence
      hinges on whether the growth story, the margin story, and the capital story all reconcile.
      The underlying question is whether public-market disclosure will confirm the private
      estimates or force a material reset.
    claimRefs: [CI008, CI009, CI010, CI011, CI012]
    tableRefs: [TI003]
tables:
