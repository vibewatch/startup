      - ["Verification", "One-time or per-use fee for Auth / Identity / Balance", "per verification", "Core onboarding layer", "Good retention when embedded in onboarding", "Assess attach rate across enterprise vs self-serve"]
      - ["Transactions", "Subscription per connected account", "per connected account / month", "Recurring data product", "Sticky once integrated", "Confirm how much is bundled vs standalone"]
      - ["Payments", "Usage fee on transfer and funding workflows", "per transaction", "Growing adjacent line", "Benefits from workflow expansion", "Measure contribution margin versus core data products"]
      - ["Fraud / underwriting", "Subscription or per-check pricing", "per decision / account", "Growing adjacent line", "Improves monetization density", "Validate adoption by vertical and customer size"]
    notes: "This table separates the economic mechanism from the product name because Plaid monetizes the same buyer through multiple products."
    claimRefs: [CI001, CI002, CI003, CI006]
  - id: TI002
    title: Pricing / monetization table
    columns: [price/unit/contract, list vs realized pricing, discounts/unknowns, source]
    rows:
      - ["One-time fee", "List pricing exists, realized pricing varies", "Enterprise discounts are opaque", "Plaid business model page"]
      - ["Per-use fee", "Usage-based and customer-specific", "No public realized rate card", "Plaid business model page / docs"]
      - ["Subscription", "Per connected account or package", "Bundling can mask unit economics", "Plaid business model page / docs"]
      - ["Enterprise contract", "Negotiated annual or multi-year", "Exact terms are private", "TechCrunch / Sacra"]
    notes: "Public list prices are only a rough proxy; the real economics depend on customer mix and product bundling."
    claimRefs: [CI001, CI002, CI003, CI007]
  - id: TI003
    title: Unit economics table
    columns: [metric, value/null, confidence, why it matters, diligence ask]
    rows:
      - ["2025 ARR", "$546M", "medium", "Defines the scale of the recurring revenue base", "Reconcile against a first public filing"]
      - ["2025 YoY growth", "40%", "medium", "Shows reacceleration after fintech normalization", "Separate product mix from usage rebound"]
      - ["Adjusted EBITDA", "positive in 2025", "medium", "Signals operating leverage", "Confirm whether profitability is durable"]
      - ["Gross margin", "n/a in public disclosure", "low", "Would anchor platform economics", "Need audited cost of revenue"]
      - ["Customer count", "~8,000", "medium", "Shows breadth of monetization", "Check enterprise concentration"]
      - ["Headcount", "1,318 est.", "medium", "Useful for revenue per employee and operating efficiency", "Verify against current internal org size"]
    notes: "Null values are deliberate where public disclosure is insufficient; the table is a diligence prompt rather than a complete model."
    claimRefs: [CI004, CI005, CI007, CI008, CI011]
