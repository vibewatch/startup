    columns: [segment, buyer, user, payer, workflow, budget owner, adoption trigger]
    rows:
      - ["Fintech startup", "Product/engineering", "Developer + end user", "The startup", "Bank linking / onboarding", "Product or engineering", "Need a quick launch with minimal bank integrations"]
      - ["Enterprise software", "IT / platform", "Ops + customer teams", "The enterprise", "Verification / payout / onboarding", "Platform or line-of-business", "Need a standardized workflow across many customers"]
      - ["Lender / underwriting", "Risk / credit", "Ops / borrower", "The lender", "Income, assets, liabilities", "Credit or risk", "Need fast decisioning and better data coverage"]
      - ["Bank / institution", "Digital banking / API", "Bank staff and consumers", "The bank", "Open-banking compliance", "Product / compliance", "Need to expose data securely or meet portability rules"]
      - ["Payments / treasury", "Payments", "Finance ops", "The merchant / platform", "Bank transfer / payout", "Finance / treasury", "Need cheaper rails or lower return risk"]
    notes: "This is a buyer map, not a market-share model; it captures how Plaid's budget owner changes by use case."
    claimRefs: [CM001, CM003, CM006, CM008, CM009, CM010]
