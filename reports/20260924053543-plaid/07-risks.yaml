      - ["Partner dependence", "Bank renegotiates or narrows access", "High", "Multi-bank relationships", "High"]
      - ["Security/privacy", "New breach or privacy complaint", "High", "Controls and notification processes", "High"]
      - ["Reliability", "Outage or degraded linking flow", "Medium-high", "Operational hardening", "Medium"]
      - ["Substitution", "Developer switches to an alternative vendor", "Medium", "Product breadth and switching costs", "Medium"]
      - ["Valuation / exit", "IPO timing slips or public-market discount widens", "Medium", "Private-market liquidity options", "Medium"]
    enumerationScope:
      coverage: partial
      basis: "This register focuses on the highest-probability risks highlighted by the refreshed evidence."
    notes: "The residual column stays high because Plaid's core workflows are tied to regulated financial access."
    claimRefs: [CR001, CR005, CR007, CR010, CR012]
  - id: TR002
    title: Legal and trust timeline
    columns: [year, event, signal, what it means]
    rows:
      - ["2020-2022", "Privacy litigation / class-action coverage", "Negative", "Privacy concerns are durable enough to generate legal attention"]
      - ["2025", "Bank access renewal / renewed data access agreement coverage", "Mixed", "Partnerships can be renewed, but only with ongoing negotiation"]
      - ["2026", "Breach notice and downstream coverage", "Negative", "Security trust remains a live diligence item"]
      - ["2026", "Consumer explainers on whether Plaid is safe", "Negative", "Trust is a mainstream buyer question, not a niche one"]
    enumerationScope:
      coverage: partial
      basis: "The timeline captures the most visible recent evidence in the refresh set."
    notes: "The timeline is partial and deliberately limited to visible trust events that surfaced in the refresh evidence."
    claimRefs: [CR002, CR003, CR004, CR010]
  - id: TR003
    title: Substitution and fallback comparison
    columns: [option, why it matters, migration friction, risk to Plaid]
    rows:
      - ["Alternative account-data vendors", "Direct competitive benchmark", "Medium", "Pricing and feature pressure"]
      - ["Ad hoc bank-data scripts", "Proof that some teams can build around a vendor", "High", "Partial disintermediation for narrow use cases"]
      - ["Multi-homing", "Buyers can keep Plaid while piloting another provider", "Low-medium", "Reduces moat if usage is split"]
      - ["Regulatory-direct access", "If policy changes, some flows may move closer to the bank", "Medium", "Weakens centralized API control"]
    notes: "This table is about practical substitution, not perfect one-to-one replacement; it is intended as a decision aid, not a comprehensive vendor scorecard."
    claimRefs: [CR005, CR006, CR007, CR009]
