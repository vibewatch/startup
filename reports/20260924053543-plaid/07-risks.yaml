company:
  name: Plaid
chapter:
  number: 7
  title: Risks
  summary: "Plaid's risk stack is still dominated by regulation, bank-access dependence, and trust sensitivity. The core business is resilient, but the exact thing that makes it sticky — deep integration with financial accounts — also makes it exposed to policy shifts, privacy incidents, and partner renegotiation."
sections:
  - id: regulatory-partner-risk
    title: Regulatory and bank-partner dependency
    body: >
      Plaid does not own the bank rails it sits on, so access risk is partly an external-policy
      question and partly a partner-management question. The company can sign renewals and keep
      adding institution coverage, but a changed access rule, a stricter consent requirement, or a
      renegotiated bank agreement can still alter economics quickly. That makes regulation and
      partner access the first-order diligence issue rather than a background compliance footnote.
      It also means Plaid's moat is partly negotiated, not purely technical, because the product is
      only as strong as the permissions, integrations, and consent flows it can continuously renew.
      In other words, access durability is a strategic asset and a strategic liability at the same
      time.
    claimRefs: [CR001, CR010, CR012]
    tableRefs: [TR001]
    figureRefs: [FR001]
  - id: security-trust-risk
    title: Security, privacy, and consumer trust
    body: >
      The 2026 breach notice and the surrounding privacy coverage show that trust risk is live, not
      hypothetical. Because Plaid sits in the path between bank accounts and downstream apps, any
      security or privacy event can spread beyond a single product into buyer perception across the
      whole platform. The issue is not just breach cleanup cost; it is whether procurement teams
      start treating Plaid as a higher-friction vendor after each new incident or lawsuit. For a
      company like Plaid, a headline breach can become a sales objection for entirely different
      workflows because buyers usually do not separate "linking" risk from the rest of the stack.
      That makes every new trust event potentially cumulative rather than isolated.
    claimRefs: [CR002, CR003, CR004, CR008]
    tableRefs: [TR002]
  - id: substitution-competition-risk
    title: Substitution, migration, and reliability risk
    body: >
      Plaid's API layer is defensible because it is embedded, but it is not irreplaceable. Developer
      comparisons against other account-data vendors and even ad hoc bank-data approaches show that
      teams can at least benchmark alternatives. That means reliability incidents, pricing moves, or
      regulatory friction can accelerate multi-homing or partial migration even when the primary
      integration stays in place. The practical risk is not an all-at-once switch; it is a slow
      reduction in share-of-wallet if a buyer starts routing new use cases elsewhere while keeping
      Plaid on the legacy path. This is why the migration risk matters even when headline customer
      counts keep rising.
    claimRefs: [CR005, CR006, CR007, CR009]
    tableRefs: [TR003]
    figureRefs: []
tables:
