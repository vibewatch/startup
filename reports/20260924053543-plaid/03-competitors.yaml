      - ["Breadth of bank coverage", "Strong", "Strong", "Medium", "Strong", "Weak"]
      - ["Payments bundling", "Strong", "Medium", "Strong", "Medium", "Weak"]
      - ["Fraud / identity adjacency", "Strong", "Medium", "Medium", "Medium", "Weak"]
      - ["Bank governance alignment", "Medium", "Strong", "Medium", "Strong", "Strong"]
      - ["Trust / privacy optics", "Mixed after settlement and breach", "Unknown", "Medium", "Unknown", "Strong internally"]
    notes: "Cells are deliberately ordinal or unknown where the refreshed evidence does not support a hard numeric comparison."
    claimRefs: [CP004, CP005, CP006, CP007, CP008, CP009, CP010, CP011]
  - id: TP003
    title: Pricing / packaging comparison
    columns: [company, price/unit/contract model, included capabilities, discount or unknowns, implication]
    rows:
      - ["Plaid", "Enterprise contract plus usage-based fees", "Connectivity, verification, payments, fraud, onboarding", "List pricing is public for some developer use cases, but realized pricing is negotiated", "Best fit when the buyer wants one API layer across many workflows"]
      - ["Stripe Financial Connections", "Bundled within Stripe relationships", "Bank connectivity tied to Stripe payments and treasury stack", "Public apples-to-apples pricing is not disclosed here", "Most dangerous when the buyer already standardizes on Stripe"]
      - ["Finicity / Mastercard", "Enterprise contract", "Verification and lender workflows", "Packaging is opaque and procurement-led", "Competes best where lender governance and card-network trust matter"]
      - ["Manual / internal build", "Internal engineering cost", "Whatever the team builds", "Costs are hidden in headcount and maintenance", "Attractive only when control or privacy outweighs integration speed"]
    notes: "Pricing is mostly opaque across the market; the table therefore records contract pattern rather than pretending to know every list price."
    claimRefs: [CP003, CP004, CP005, CP008, CP009, CP012]
