      - number: '2.3'
        title: 买方地图、分层逻辑与采纳机制
        blocks:
          - type: paragraph
            body: >-
              La Renon 的 go-to-market
              路径更像一条分层医药价值链，而不是单一买方群体。印度国内采纳始于医生处方行为和治疗可信度，但要靠医院处方集、分销商、批发商、药剂师，以及慢病患者的复购需求维持。出口市场再加一层：注册、进口伙伴和本地监管合规先成为放量前的门槛。这种买方结构让市场在两点上有吸引力。第一，慢病治疗一旦赢得医生信任，就能形成重复处方行为。第二，注册驱动的出口能把增长跑道拉长到国内学术推广之外。挑战在于，公开来源没有披露哪些细分市场主导
              La Renon
              当前经济性。公司显然有多事业部慢病定位，但投资者仍需要治疗领域和地域结构，才能判断哪些买方群体具备战略优先级。公司的注册基础提示了出口选择权，但披露还不足以判断最有吸引力的细分到底是专科医生主导的国内利基，还是伙伴主导的海外市场。
