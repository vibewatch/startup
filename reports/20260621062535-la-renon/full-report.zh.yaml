companyProfile:
  summary: >-
    La Renon Healthcare Pvt. Ltd. 是一家总部位于 Ahmedabad 的品牌仿制药公司，2007 年成立，2008
    年开始运营。公司只做慢性病治疗领域，包括肾脏、CNS、重症监护、心血管代谢、胃肠、泌尿、呼吸和妇科八个专科事业部。凭借约 340 个制剂组合、DSIR 认可的研发中心，以及以子公司 Stanford Laboratories
    为核心的制造基础，La Renon 过去十年实现 25% 的收入 CAGR 和 30% 的 EBITDA CAGR，FY25 收入达到 Rs 1,640–1,685 crore，EBITDA 达 Rs 330–356
    crore。公司通过 269 项药品注册进入 40+ 个国家，并吸引了一批头部投资者；截至 2025 年 9 月，业务估值为 Rs 11,000 crore（约 USD 1.3B），较 2015 年首轮机构融资估值提升约 16 倍。
  foundedDate: '2007-01-01'
  founders:
    - name: Pankaj Singh
      role: 创始人、董事长兼董事总经理
      background: 第一代创业者，拥有科学学位和 MBA，在印度及国际医药业务一线积累超过 20 年经验。
      claimRefs:
        - CO003
        - CO012
  foundingLocation: Ahmedabad, Gujarat, India
