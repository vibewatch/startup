  productSummary: >-
    八个慢病治疗事业部的品牌仿制药制剂：Nephroscience（肾脏）、CNS（神经）、Critical Care（抗感染）、Cardio-Metabolic（糖尿病 /
    高血压）、Gastroenterology、Urology、Respiratory 和 Gynaecology。产品在印度销售，并通过 269 项药品注册出口至 40+ 个国家。制造体系包括子公司 Stanford
    Laboratories（口服剂型）、Frimline（医学食品）、Enaltec Labs（API 研究）、Rusoma Healthcare（小容量注射剂），以及合同制造商。
  customerFocus: 印度及 40+ 个出口市场的专科医生（肾脏科医生、神经科医生、心脏科医生、重症医生）、医院、ICU、创伤中心和专科诊所。
  businessModel: 通过 DSIR 认可的研发中心开发并制造品牌仿制药制剂，将技术转移给制造子公司和合同合作伙伴，再通过专科销售队伍销售产品。收入来自印度国内品牌仿制药销售（约 55-60%）和出口制剂销售（约 40-45%）。
  stage: Late-stage private / pre-IPO
