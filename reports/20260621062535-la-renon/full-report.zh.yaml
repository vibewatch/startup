      - number: '8.2'
        title: 公开可比公司支持优质药企倍数，但也说明 La Renon 需要披露折价
        blocks:
          - type: paragraph
            body: >-
              公开市场环境是顺风，但不是空白支票。印度制药仍是规模大、机构持有充分的上市板块，Sun、Lupin、Mankind、Alkem、Abbott India、Eris
              等龙头都享有有意义的盈利倍数。投资人可以从中读出两点。第一，披露足够强时，市场愿意为品牌仿制药和慢病治疗资产付钱。第二，这些公开市场倍数背后，有每日价格发现、审计报表，以及远比 La Renon
              当前更丰富的分部透明度。最相关的反向参照是 JB Chemicals 出售进程：据报道，私募买方已认为 25-30x EBITDA 对一家纯仿制药公司偏贵。在这个背景下，按报道的 Rs 330-356 crore
              区间测算，La Renon 的 2025 年末估值大约对应 31-33x FY25 EBITDA。因此，合适的情景框架既保留持续增长的真实牛市案例，也承认基准情景低于 headline
              估值；熊市情景里，即便经营没有崩塌，倍数压缩也可能先落地。另一个有用视角是不对称：上市同业靠审计报表、季度节奏和分部评论支撑溢价评级，La Renon 则要求投资人从交易 headline
              推到完整投资判断价值。这个缺口正是情景表在基准情景保留显著折价的原因。
