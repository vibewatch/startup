  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 经审计 FY25 不及预期
        - 经审计 EBITDA 显著低于 Rs 330 crore，或盈利质量走弱
        - 打破当前倍数支撑，并迫使估值重置。
        - 不支付 2025 年末名义估值。
      - - 权利栈意外
        - 优先权、反稀释或债务条款实质上使新资金居后
        - 把名义估值变成误导性的入场标记。
        - 要求重新定价，或放弃。
      - - 出口 / 受监管市场冲击
        - 美国或其他受监管市场敞口比假设更大且更弱
        - 提高定价、关税和合规下行的相关性。
        - 下调情景区间并提高风险评级。
      - - 工厂爬坡交付不足
        - Rajasthan 扩产滑期或拖累利润率
        - 削弱牛市支撑中嵌入的远期增长逻辑。
        - 转向基准 / 熊市框架。
      - - 私募市场倍数压缩
        - 可比行业交易显著低于当前假设重新定价
        - 即使经营仍稳健，退出可选性也会收窄。
        - 持有，或等待更低入场价。
    notes: 触发项聚焦少数最可能迅速压垮或捍卫当前估值的事实。
    claimRefs:
      - CV009
      - CV027
      - CV032
      - CV033
