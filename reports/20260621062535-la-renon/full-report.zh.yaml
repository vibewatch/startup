        title: 留存、复用逻辑与需求耐久性
        blocks:
          - type: paragraph
            body: >-
              客户耐久性的最佳论据来自治疗逻辑，而不是已披露的留存指标。CKD 支持、糖尿病神经病变管理、高血压、糖尿病和孕期相关补充，都是可能产生重复处方或经常性补货的类别。WHO 和 ICMR
              背景也强化了这些类别为何在印度和其他中低收入环境中重要：慢性肾病、高血压、糖尿病和其他非传染性疾病负担足够大，能支撑持续临床需求。这有用，因为它解释了如果执行强，La Renon
              的产品集为何可能形成耐久的渠道吞吐。但本章应避免过度声称。公开来源没有披露客户数、复购率、NRR、流失率或合同期限。甚至市场可得性也可能嘈杂，Neuronomic
              缺货列表就是例子。因此，正确姿态是：复用逻辑可见，但留存证据仍严重不足。
