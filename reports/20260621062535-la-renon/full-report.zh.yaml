            body: >-
              资本故事比交易金额标题更微妙。近期报道让 La Renon 看起来融资充足，但可见活动中相当一部分是二级交易，而非一级融资。2025 年交易里，发起人和既有投资者向新进投资者出售股份，这意味着报道的 Rs
              1,000 crore 事件不能自动理解为新的经营现金。这个区分重要，因为公司同时在资助产能扩张，并追逐又一年强增长。公开记录没有披露在手现金、债务额度、 burn 或
              runway，因此无法干净测试增长是否能内部供给，还是仍依赖外部资本。反向证据让这一点更尖锐：Economic Times 称 Goldman Sachs 曾探索一笔更大的 Rs 1,600 crore
              注资，但没有完成。这并不推翻财务实力，却说明融资选择权并非无限。公开投资者能看到资本市场兴趣；但仍无法有把握地承销资本充足性。
