      - number: '8.3'
        title: 最合适的开源结论是 track / research-more，中等置信度，并设明确升级门槛
        blocks:
          - type: paragraph
            body: >-
              这里的建议质量，受限更多在入场价格的证据质量，而不是业务吸引力。乐观投资人可以指向慢病治疗定位、出口、反复出现的投资人兴趣，以及一家如果 FY26 推向 Rs 2,000 crore 收入和约 Rs 450
              crore EBITDA、就可能长进当前估值的公司。谨慎投资人则会指向高于 JB
              委托案的倍数、缺少审计账目、权利和债务能见度不足，以及上市同业之所以撑住公开市场倍数，是因为披露强得多。这个组合不足以仅凭开源信息给出强 buy 结论。它支持 track /
              research-more；如果入场价接近 2025 年末 headline 估值，至少也应等条款。升级路径很直接：FY25 审计数、清晰的 FY26
              run-rate、股权结构和优先权清楚、出口和美国敞口直接披露，以及工厂扩张和营运资本不会侵蚀已报道 EBITDA
              故事的证据。实际意思是，本章并不看空公司的存在；它只是对开源信息能知道什么保持纪律。如果下一轮尽调能把不透明的二级交易估值标记转成有文件支撑的盈利能力和干净条款，建议可以很快上调。在此之前，耐心本身就是估值纪律的一部分。
