      - number: '1.2'
        title: 领导班底与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              La Renon 的公开材料里，领导层可见度是相对优势，但也暴露集中风险。创始人 Pankaj Singh 仍是公司战略身份的核心，官方履历强调他是第一代创业者，具备科学训练、MBA
              背景，并在医药行业深耕超过二十年。其下已披露的运营班底偏实务，而非纯礼仪角色：Vivek Gupta 负责肾脏业务，Yashwant Singh 覆盖多个印度国内治疗线，Samir Kumar 领导
              CNS，Abhijit Basu 则被定位为运营和伙伴管理高管。这足以显示真实的角色分工，但公开记录在解释公司历史、战略和投资者相关性时，仍高度围绕 Pankaj
              Singh。对于一家财务披露有限的私营公司，这一点重要：即便二线领导可见，创始人依赖仍会放大接班、执行和融资敏感性。
