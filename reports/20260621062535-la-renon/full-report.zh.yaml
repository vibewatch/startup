      - number: '1.3'
        title: 融资路径、所有权版图与估值抬升
        blocks:
          - type: paragraph
            body: >-
              身份之外，公司概览里最重要的事实，是 La Renon 估值爬升的速度。公开报道显示，公司估值从 Sequoia 2015 年投资时的约 Rs 700 crore，升至 2021 年 A91 轮的约 Rs
              3,500 crore、2024 年 ChrysCapital 的约 Rs 6,500 crore、2025 年初 Avendus 的约 Rs 8,000 crore，再到 2025 年晚些时候
              WhiteOak-Siguler-Creador 交易的约 Rs 11,000
              crore。这一路径很抢眼，意味着增长、出口结构和经营杠杆足够强，能持续把跨界私募资本吸引到一个品牌仿制药平台上。公开记录也在这里变得最薄。来源给出了宽泛的持股结构和交易规模，却没有现行股权表、权利栈或债务情况，无法把融资标题转化成真正的所有权承销视角。这个未解细节不是装饰性问题。它直接影响估值上行中，有多少来自真实经营进展，多少来自热门赛道里有利的私募市场定价。
