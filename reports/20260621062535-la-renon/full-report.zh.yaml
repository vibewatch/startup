        title: 产品组合形态与治疗线深度
        blocks:
          - type: paragraph
            body: >-
              La Renon 的产品栈最好理解为一个多事业部慢病护理平台，而不是单一旗舰品牌。官方表面反复汇聚到同一套架构：八个治疗事业部、约 340
              个制剂，以及足以支撑印度国内学术推广和出口商业化的注册与管线足迹。事业部页面让产品策略变得具体。肾脏被框定为最初利基，仍是专注治疗定位的最强证据。CNS 是已披露 SKU
              数最深的类别；重症监护、心血管代谢、泌尿、呼吸、胃肠和妇科则补足更广的慢病和专科篮子。这一点重要，因为它说明 La Renon
              正在规模化解决组合管理、制剂更新和渠道覆盖问题，而不只是延伸一个分子家族。最有证据支撑的结论是：公司有宽度，也有一些真实深度，尤其是肾脏和 CNS 主张同时得到官方页面和外部渠道列表强化的地方。
