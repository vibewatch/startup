  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - FY26 收入接近 Rs 2,000 crore，EBITDA 约 Rs 450 crore；出口和慢病治疗持续复合增长；披露没有意外。
        - 以 30-33x 远期 EBITDA 视角，可以支撑约 Rs 10,500-14,000 crore。
        - 需要工厂爬坡干净、没有监管冲击，并且私募市场继续给出溢价需求。
        - 有可能，但证据尚未完全补足。
      - - 基准
        - 已报告 FY25 EBITDA 区间大体真实，但投资者仍要求披露折价。
        - 高 20 倍至约 30x EBITDA 的视角，支撑约 Rs 9,000-10,500 crore。
        - 经审计数字或权利细节仍可能迫使重置。
        - 当前公开证据下最可支撑。
      - - 熊市
        - 增长或披露不及预期；行业倍数谨慎情绪占上风。
        - 按 Rs 330-356 crore 采用 25x 或更低 EBITDA，支撑约 Rs 8,250-8,900 crore 或更低。
        - 运营彻底失灵前，倍数压缩可能先发生。
        - 足够实质，需把确信度维持在中。
    notes: 情景锚定在已报告 FY25 EBITDA 区间和当前行业倍数信号，而非投机性的 DCF 精度。
