  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 经审计 FY25 / FY26 财务
        - 经审计报表、分部桥接、营运资本细节
        - 没有这些，每个倍数背后的 EBITDA 分母都偏软。
        - 管理层数据室和审计师材料包。
      - - 股权结构和权利栈
        - 当前 SHA、清算优先权、转让权、债务明细
        - 名义估值不足以支撑入场承销。
        - 公司法律顾问和投资者文件。
      - - 地区和客户结构
        - 出口国家、客户和受监管市场敞口
        - 需要用它检验美国定价和关税风险的相关性。
        - 按国家导出的商业分析，以及头部客户集中度。
      - - 工厂爬坡经济性
        - Rajasthan 资本开支、资质确认状态、利用率、利润率桥接
        - 需要判断增长能否转成干净 EBITDA。
        - 运营尽调加工厂走访。
      - - 质量和监管历史
        - 审批、检查、召回、投诉、价格管制映射
        - 需要据此判断风险折价应收窄还是扩大。
        - 监管和 QA 尽调工作流。
    notes: 这些问题是改变建议的最短路径，因为它们直接击中最大的估值不确定性来源。
    claimRefs:
      - CV026
      - CV027
      - CV039
