    title: 投资人历史与股权结构表
    blocks:
      - type: paragraph
        body: >-
          2015 年 6 月至 2025 年 9 月，La Renon 在五轮已披露机构融资中合计募资约 USD 229 million。Sequoia Capital（现 Peak XV Partners）领投 2015
          年相当于 Series A 的轮次，金额为 Rs 100 crore（约 $16M），隐含估值约 $100M。A91 Partners 于 2021 年 1 月按 $500M 估值投资 $30M。ChrysCapital
          于 2024 年按 Rs 6,500 crore 完成约 8% 的二级交易。Avendus Future Leaders Fund 于 2025 年 2 月按 Rs 8,000 crore 买入约 2%。2025 年 9
          月交割的交易中，WhiteOak Capital、Siguler Guff 和 Creador 按 Rs 11,000 crore 估值共同以 Rs 1,000 crore 收购 10%。交易后，发起人家族持股约
          66%，PE 投资人合计持股约 34%。
