  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限
    rows:
      - - Sun Pharma
        - 公开市值和 P/E
        - 2026 年 6 月 19 日市值 Rs 441,070 crore；P/E 38.14x
        - 大型上市品牌制药基准，显示强披露可获得的定价。
        - 规模大得多、更多元，也不是直接的私营公司可比。
      - - Lupin
        - 公开市值和 P/E
        - 2026 年 6 月 19 日市值 Rs 107,510 crore；P/E 19.95x
        - 可作为规模化印度制药平台的较低倍数上市参照。
        - 上市公司盈利倍数不等同于私营 EV/EBITDA。
      - - Mankind Pharma
        - 公开市值和 P/E
        - 2026 年 6 月 19 日市值 Rs 99,665.01 crore；P/E 51.92x
        - 说明优质慢病 / 品牌仿制药敞口可获得较高公开市场倍数。
        - 仍受益于上市流动性和经审计披露。
      - - Alkem Labs
        - 公开市值和 P/E
        - 2026 年 6 月 19 日市值 Rs 64,248.25 crore；P/E 27.9x
        - 中大型上市可比，具备有意义的国内品牌敞口。
        - 公开 P/E 不能一比一映射到 La Renon 的私营 EV。
      - - Abbott India
        - 公开市值和 P/E
        - 2026 年 6 月 19 日市值 Rs 55,705.05 crore；P/E 35.8x
        - 聚焦印度的高端品牌制药参照。
        - MNC 关联公司经济性和披露质量存在实质差异。
      - - Eris Lifesciences
        - 公开市值和 P/E
        - Screener 快照显示市值 Rs 20,070 crore；P/E 79.0x
        - 较小的慢病聚焦国内可比，显示小盘溢价乐观情绪。
        - 快照时间和比率定义可能快速变化。
      - - JB Chemicals 出售流程
        - 私募市场 EBITDA 谨慎信号
        - 据报道，PE 买家认为 25-30x EBITDA 偏贵，但战略买家兴趣仍在。
        - 对私营买家可能拒绝为仿制药公司支付何种价格，是当前最好的反向校验。
        - JB 是不同资产和不同交易目标，不是干净的一一可比。
      - - La Renon 2025 年末估值标记
        - 隐含私营 EV / EBITDA
        - 基于已报告 FY25 EBITDA Rs 330-356 crore，约 Rs 11,000 crore 估值隐含约 31-33x EBITDA。
        - 直接框定名义估值是否高于私募市场谨慎区间。
        - 取决于未经审计的已报告 EBITDA，以及未披露的净债务 / 权利栈。
    notes: 可比组刻意混合公开市场数据和正在进行的私募市场交易，因为 La Renon 是私营公司，单一可比框架不够。
    enumerationScope:
      coverage: partial
