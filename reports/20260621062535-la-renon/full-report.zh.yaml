        title: 分销强度与倍数纪律，比名义产品重叠更重要
        blocks:
          - type: paragraph
            body: >-
              公开来源没有提供这些公司之间干净的标价比较，因此更有用的尽调视角是“打包能力”：谁触达医生，谁控制分销，谁能在增长放缓时守住高倍数。在这一点上，La Renon 拥有可观的慢病专科
              franchise，但更大的既有玩家仍占据战略高地。Mankind 的 Tier II-IV 触达、Torrent 的 50 国足迹和 Sun Pharma
              的庞大上市规模都重要，因为品牌药里的转换成本只是中等。医生信任和品牌记忆有黏性，但多数治疗领域仍有多个临床上可接受的品牌替代品。这意味着 La Renon
              必须继续靠治疗执行和声誉取胜，而不是靠结构性锁定。叠加估值后，这一点更尖锐：如果买方可以转向规模更大、披露更好的品牌，那么偏高的私募倍数留给商业失误的空间就更少。实用尽调要求，是把品牌熟悉度和真实定价权分开：如果医生能在几种慢病品牌之间有限扰动地切换，那么
              La Renon 相对上市龙头的分销劣势就不只是商业问题，而是财务问题。
