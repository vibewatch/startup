  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 La Renon 实际竞争的位置
        blocks:
          - type: paragraph
            body: >-
              市场分析首先要避免的错误，是把 La Renon
              当成均匀参与整个印度医药行业的公司。印度医药市场确实庞大，但公司自身披露指向更窄的竞争场：品牌仿制药制剂、慢病处方，以及注册和本地商业化关系重要的部分出口市场。这意味着真实市场边界排除了大量通用宏观医药报告计入的内容，包括疫苗、医疗器械、诊断和无关医院服务。买方逻辑也不同于企业软件或单一医院采购。La
              Renon
              的相关市场要经过医生、治疗方案采纳、分销商、药房、医院和进口伙伴。理解这个边界很关键，因为后续市场规模和估值应反映公司的治疗组合和注册基础，而不是用一个全国医疗支出标题来严重高估可服务需求。换句话说，本章需要区分行业宽度和公司可触达需求。这个区分能避免后续估值把印度全国医药规模误当成
              La Renon 可变现市场。
