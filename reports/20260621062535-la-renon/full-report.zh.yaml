      - number: '5.4'
        title: 路线图信号、产能扩张与主要技术风险
        blocks:
          - type: paragraph
            body: >-
              公开路线图证据存在，但碎片化。正面看，外部报道和渠道页面显示，公司持续在慢病和专科类别更新组合，神经病理性疼痛和 CKD 支持品牌有活跃商业存在；Rajasthan
              口服固体制剂扩张若按描述执行，将显著增加产能。CARE 对 Frimline、Enaltec 和 PALMIGES 的说明也显示，产品技术路线图不止于简单品牌仿制药，还延伸到营养补充和 API
              相关邻近领域。风险在于，路线图精度仍低。公开来源对 Rajasthan 项目应解读为 43 million unit 工厂目标，还是每月 100 million 到 400 million
              片剂和胶囊爬坡，并不一致；所审查来源也没有提供内部里程碑表，无法调和时间、剂型和上市顺序。这意味着产品技术故事可作为规模与平台论点投资，但还不能被承销为执行确定性。实用尽调上，应要求管理层提供投产计划、剂型拆分，以及当前利用率到扩产后产出的精确桥接，以便在承销增长前先把产能口径标准化。
