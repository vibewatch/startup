  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 报告增长强劲，收入模型看起来是慢病品牌制剂加出口
        blocks:
          - type: paragraph
            body: >-
              公开记录确实支撑一个连贯的收入故事。La Renon
              反复被描述为一家聚焦慢病治疗的品牌制剂公司，拥有广泛产品组合，并在印度国内制剂之外叠加了有意义的出口活动。这一点重要，因为它暗示收入不是建立在一次性招标冲高或单一旗舰分子上。相反，叙事是慢病类别里的重复处方需求，由约
              340 个制剂组合支撑；业务结构中，出口据称贡献 40-45% 的销售。历史增长标记也以私营公司标准看异常强：FY20 收入约 Rs 800 crore，FY25 收入约 Rs 1,640-1,685
              crore，FY26 目标约 Rs 2,000 crore。若按表面接受，这足以解释投资者的认真兴趣。但它还不足以对收入确认、渠道结构，或销售中真正高质量与只是快速增长的占比，得出精确结论。
