      - number: '2.2'
        title: 规模测算视角与区间纪律的重要性
        blocks:
          - type: paragraph
            body: >-
              自上而下的市场规模测算支持 La Renon 仍有增长空间，但不支持虚假的精确性。IMARC 给出的市场观点更激进，认为 2025 年印度医药市场超过 USD 68 billion，并预测长期 CAGR
              很强。Mordor 给出的近期基数明显更低，增长率也更慢。政府和行业机构没有调和这些方法，因此最干净的尽调姿态，是把两者作为外部边界保留，而不是压成一个点估计。对 La Renon
              也应如此。公开来源没有披露按治疗领域的收入拆分、地域结构或处方份额，外部分析师无法稳健地自下而上计算 SAM 或 SOM。可以说的是，公司 40
              多个国家的足迹和注册基础，意味着其可服务市场确实大于只做印度国内品牌仿制药；但要达到精确，仍需要管理层数据。
