    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、运营模式与规模足迹
        blocks:
          - type: paragraph
            body: >-
              对一家印度私营药企来说，La Renon 的公开身份异常清晰。官方材料一贯把总部放在 Ahmedabad，注明公司 2007 年成立、2008
              年开始运营，并将业务描述为面向慢病和专科疾病类别的品牌仿制药制剂公司，而不是只追求大宗急性病用药销量。运营足迹也比单纯的国内销售商更宽。公司称其拥有约 340 个制剂、八个治疗事业部、覆盖 40
              多个国家、数百项注册，以及相当规模的评估和管线储备。这些事实重要，因为它们说明 La Renon
              已是有规模的商业化和组合管理平台，而不是单一品牌故事。后续章节讨论市场准入、治疗领域集中度和出口敞口时，也能把判断锚定在已披露的运营基础上，而不是靠推测规模。
