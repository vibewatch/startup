      - number: '2.4'
        title: 增长驱动、政策支持与最重要约束
        blocks:
          - type: paragraph
            body: >-
              市场背景有利，但并非没有摩擦。需求端支撑来自印度慢性病负担，包括显著的肾病患病率、更广泛的 NCD
              增长、印度国内医疗扩张，以及该国作为大规模医药制造基地的角色。政策也在帮忙：行业层面的支持计划和制造倡议，可以改善有规模制剂企业的经济性。约束端则是监管、定价和出口。NPPA
              相关价格管制可能限制覆盖品类的变现。CDSCO 审批和合规流程会影响上市节奏和产品扩张。出口导向的印度药企还反复面对外部风险，包括美国定价压力、监管审查、关税威胁，以及对进口 API 的供应链依赖。对 La
              Renon
              而言，含义很直接：市场足够有吸引力，能支撑增长；但执行质量、治疗领域聚焦和监管导航，将决定多少机会能转化为可防守的收入和利润。因此，市场吸引力和执行难度必须一起看。一个有价格上限、监管门槛和进口投入敞口的大市场仍然有吸引力，但并不顺滑。
