  - id: TV002
    title: 论点 / 反论点表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - 强慢病治疗定位、出口结构和反复出现的投资者需求，可以支撑溢价兴趣。
        - 如果经审计 FY25/FY26 证明已报告 EBITDA 轨迹，且权利栈摩擦有限，则上调。
      - - 2015 年到 2025 年的估值路径显示真实市场验证和持续增长。
        - 如果 2025 年价格发现主要是二级交易，且缺乏当前盈利质量支撑，则下调。
      - - 公开可比公司显示，印度制药投资者愿意为优质品牌仿制药平台付费。
        - La Renon 提供接近上市公司的经审计数字和分部结构披露前，维持折价。
      - - 反论点是，Rs 11,000 crore 对一家披露不透明的私营仿制药公司而言，把太多完美执行计入价格。
        - 更低入场价或完全开放的数据室，会显著削弱这一反对意见。
    notes: 本表让论点和反论点直接对冲，使建议锚定在价格和证据上，而不只是公司质量。
