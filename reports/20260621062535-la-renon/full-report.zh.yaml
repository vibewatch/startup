  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与护理场景
        blocks:
          - type: paragraph
            body: >-
              La Renon 没有披露具名客户名单，但官方表面仍揭示了有用的细分模型。治疗页面一贯对应慢病护理的复购工作流：肾脏围绕 CKD 患者，CNS 围绕长期神经和精神疾病，心血管代谢围绕糖尿病和高血压，泌尿围绕
              BPH 和肾结石，呼吸围绕长期呼吸疾病，妇科围绕女性健康路径。重症监护提供了最明确的机构信号，因为公司称其服务印度各地 ICU、CCU
              和创伤中心。董事会成员和联系页面也指向一种专科营销模型：围绕客户专属团队和伙伴筛选来搭建，而不是纯品牌广告。正确结论是，La Renon
              似乎卖给由医生、机构、药房、分销商和伙伴组成的混合客户图谱，慢病护理的重复需求是主导使用逻辑。缺失的是一个公开分母：各细分市场分别贡献多少收入。
