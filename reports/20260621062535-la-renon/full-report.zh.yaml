  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 当前估值标记令人印象深刻，但价格支撑比标题更薄
        blocks:
          - type: paragraph
            body: >-
              La Renon 最新估值标记值得重视，因为它不是一次性传闻。公开报道支持一条轨迹：从 Sequoia 时代约 Rs 700 crore，到 2021 年约 Rs 3,500 crore、2024 年约 Rs
              6,500 crore、2025 年初约 Rs 8,000 crore，再到 2025 年晚些时候约 Rs 11,000
              crore。这是剧烈重估，也符合一家在慢病治疗和出口上实现真实增长的公司。问题不是公司好不好，而是公开材料是否支撑这个精确价格。FY25 收入和 EBITDA 仍来自媒体报道，缺少审计背书。2025
              年估值标记主要通过二级交易被发现，而不是干净的公开备案；2025 年 ET 报道本身也保留了反向事实：更大的 Goldman Sachs
              融资路径没有完成。这个组合意味着投资判断必须对价格敏感：业务动能出色，但若不因不透明打折，公开证据还不足以支持支付最高标记。它也意味着，下行可能先来自治理或披露重定价，而不是任何明显需求放缓。一个可信业务，如果价格通过不透明二级交易发现、证据分母偏软，仍可能是一笔缺乏吸引力的交易。
