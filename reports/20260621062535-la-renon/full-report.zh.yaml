        title: 出口、定价与供应链敞口可能快速传导到 EBITDA
        blocks:
          - type: paragraph
            body: >-
              第二个风险块是经营传导，而不是公司文书。公开来源显示出口约占销售 40-45%，这意味着 La Renon 不只活在受保护的印度国内品牌仿制药泡泡里。FY2026
              行业报道指向美国定价压力、美国增长放缓、USFDA 审查加强，甚至有关税监测措辞，可能在边际上伤及印度药企经济性。成本端，第三方市场研究仍把印度药企描述为实质依赖进口 API
              和与中国相关供应链，尽管政策努力推动本地化生产。对 La Renon 而言，这些不是抽象行业注脚。它们会与仍在扩张的产品组合、Rajasthan
              产能爬坡，以及产品级地域结构、采购集中度和质量事件披露有限交互。由此产生的风险是：一家按强增长和 EBITDA 定价的公司，在投资者拿到抗压性审计证据之前，如果定价、合规或投入成本逆向移动，情绪可能迅速压缩。
