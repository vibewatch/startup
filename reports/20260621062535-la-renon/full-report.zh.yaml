      - number: '4.2'
        title: 隐含利润率路径在改善，但经营桥接仍靠推断
        blocks:
          - type: paragraph
            body: >-
              公开来源能给出的最强量化洞察，是隐含利润率趋势。用报道的收入和 EBITDA 数据看，La Renon 的 EBITDA 利润率似乎从 FY20 的约 18.8% 提升至 FY25 的约
              20.1-21.1%，FY26 目标约
              22.5%。这个方向令人鼓舞，因为它说明公司随规模扩大正在获取经营杠杆。产能扩张和更广的慢病治疗覆盖，让这个故事有可信度。问题不在算术，而在算术下面的桥接仍不透明。公开来源没有披露毛利率、销售队伍生产率、库存周转、应收账款天数或按地域的盈利能力。因此，本章可以说利润率叙事方向为正，但无法证明改善来自真正更好的单位经济、临时结构效应、出口定价，还是递延成本压力。这是典型情形：收入和
              EBITDA 标题是有用的初筛事实，却不是完整承销输入。
