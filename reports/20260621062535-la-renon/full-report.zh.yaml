  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管可见度是最大的未解决承销风险
        blocks:
          - type: paragraph
            body: >-
              第一项风险不是 La Renon
              明显存在进行中的监管违规，而是公开记录无法证明相反。公司是私营企业，所审查的官方页面偏商业而非合规导向，当前公开材料不包含经审计财务报表、产品级审批时间表、检查历史或诉讼登记。这制造了真实的承销问题，因为后期药企估值需要的不只是收入和
              EBITDA 标题。投资者需要对牌照、价格管制敞口、审批、法律程序，以及沉默到底代表干净还是只是缺披露，有足够把握。本轮还在 CDSCO 和 NPPA 页面遇到直接访问摩擦，并发现 Bar and Bench
              交易页面不可用，意味着多项监管和交易条款核查在一手来源中仍未解决。含义是，监管和法律尽调不是勾选式后续动作，而是本章最重要的门槛；未完成前，任何人都不应把当前私募市场估值视为已充分风险调整。
