              的相关性在另一处：它展示了当慢病治疗、并购和经营杠杆一起起规模后，私募股权和战略方如何给品牌仿制药平台定价。Mankind 和 Torrent
              在渠道角度更危险，因为它们把更广的印度国内触达与慢病和专科覆盖结合起来。Lupin、Alkem、Abbott India 和 Sun Pharma
