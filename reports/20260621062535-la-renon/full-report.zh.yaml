  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 同业边界：直接慢病同业与广义印度药企龙头
        blocks:
          - type: paragraph
            body: >-
              La Renon 的正确竞争集，起点是销售慢病或专科复购处方的印度品牌药企业，而不是每一家医疗公司或每一家仿制药制造商。因此，Eris 和 JB Chemicals
              比无关医院或器械企业更重要；Mankind、Torrent、Lupin、Alkem、Abbott India 和 Sun Pharma
              则属于更宽的既有龙头框架。它们都在同一个印度国内处方药市场争夺医生信任、渠道准入或投资者注意力。这个含义对尽调很重要。La Renon
              不是只靠新颖性竞争。它身处成熟的品牌制剂赛道，已有多家上市公司把慢病治疗深度、更好的资产负债表可见度和更强的公开市场可比性结合起来。因此，同业问题不只是“谁也卖药片”，而是谁控制医生注意力、分销商杠杆和估值可信度。
