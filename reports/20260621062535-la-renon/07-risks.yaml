- calloutType: risk
  title: The biggest risk is hidden variance, not visible scandal
  body: Open sources do not prove a specific blow-up at La Renon. They show that several of the checks needed to clear a late-stage pharma valuation still sit behind private-company disclosure walls. That means diligence should focus first on documents that collapse uncertainty, not on adding more narrative enthusiasm.
