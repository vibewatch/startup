- id: operating-and-market-exposures
  title: Export, pricing, and supply-chain exposures could transmit quickly into EBITDA
  body: The second risk block is operational transmission rather than corporate paperwork. Open sources indicate that exports account for roughly 40-45% of sales, which means La Renon does not live only inside a protected domestic branded-generics bubble. Sector reporting for FY2026 points to US pricing pressure, slower US growth, heightened USFDA scrutiny, and even tariff-monitor language that could hurt Indian pharma economics at the margin. On the cost side, third-party market work still describes Indian pharma as materially dependent on imported APIs and China-linked supply chains despite policy efforts to localize production. For La Renon, those are not abstract sector notes. They interact with a still-expanding product portfolio, a Rajasthan capacity ramp, and limited public disclosure on product-level geography mix, sourcing concentration, and quality events. The resulting risk is that a company marked on strong growth and EBITDA can face fast sentiment compression if pricing, compliance,
    or input costs move against it before investors have audited evidence on resilience.
