summary:
  headline: >-
    La Renon 是印度慢病治疗品牌仿制药里突出的复合增长标的，25%/30% 的收入 / EBITDA CAGR 可验证，Rs 11,000 crore
    估值背后有五家机构投资人，肾病学地位领先；但在私有且披露有限的结构下，31–33x EBITDA 倍数几乎不给执行风险留余地。
  overallScore: 7.2
