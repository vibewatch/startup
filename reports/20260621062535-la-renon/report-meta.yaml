companyProfile:
  summary: >-
    La Renon Healthcare Pvt. Ltd. is an Ahmedabad-based branded generic pharmaceutical
    company founded in 2007 and operational since 2008. The company focuses exclusively on
    chronic disease therapies — nephrology, CNS, critical care, cardio-metabolic,
    gastroenterology, urology, respiratory, and gynaecology — through eight specialist
    divisions. With a portfolio of approximately 340 formulations, a DSIR-recognized R&D
    center, and a manufacturing base anchored by its subsidiary Stanford Laboratories,
    La Renon has delivered a 25% revenue CAGR and 30% EBITDA CAGR over the past decade,
    reaching FY25 revenue of Rs 1,640–1,685 crore and EBITDA of Rs 330–356 crore.
    The company is active in 40+ countries through 269 drug registrations and has attracted
    a marquee investor syndicate that values the business at Rs 11,000 crore (~USD 1.3B)
    as of September 2025, representing a ~16x valuation step-up from its first institutional
    round in 2015.
  foundedDate: "2007-01-01"
  founders:
    - name: Pankaj Singh
      role: Founder, Chairman & Managing Director
      background: >-
        First-generation entrepreneur with a science degree and MBA and more than 20 years
        of hands-on experience in Indian and international pharmaceutical business.
      claimRefs: [CO003, CO012]
  foundingLocation: Ahmedabad, Gujarat, India
  headquarters: Ahmedabad, Gujarat, India
  productSummary: >-
    Branded generic pharmaceutical formulations across eight chronic-therapy divisions:
    Nephroscience (nephrology), CNS (neurology), Critical Care (anti-infectives),
    Cardio-Metabolic (diabetes/hypertension), Gastroenterology, Urology, Respiratory,
    and Gynaecology. Marketed in India and exported to 40+ countries through 269 drug
    registrations. Manufacturing includes subsidiary Stanford Laboratories (oral dosage),
    Frimline (medical foods), Enaltec Labs (API research), and Rusoma Healthcare
    (small-volume parenterals), plus contract manufacturers.
  customerFocus: >-
    Specialist physicians (nephrologists, neurologists, cardiologists, intensivists),
    hospitals, ICUs, trauma centres, and specialty clinics in India and 40+ export markets.
  businessModel: >-
    Develops and manufactures branded generic formulations through its DSIR-recognized
    R&D center, transfers technology to its manufacturing subsidiaries and contract partners,
    and markets products through specialist field-force divisions. Revenue is generated from
    domestic branded generic sales (~55-60%) and export formulation sales (~40-45%).
  stage: Late-stage private / pre-IPO
  fundingStatus: >-
    Rs 11,000 crore valuation; most recent round is September 2025 WhiteOak–Siguler Guff–Creador
    consortium (10% for Rs 1,000 crore); total raised ~USD 229M from Peak XV (2015),
    A91 Partners (2021), ChrysCapital (2024 secondary), Avendus (Feb 2025),
    and the 2025 consortium; promoter holds ~66%.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO004, CO005, CO006, CO007, CO010, CO018, CO021, CO026, CO027, CO028]

summary:
  headline: >-
    La Renon is India's standout chronic-therapy branded-generic compounder, with
    verifiable 25%/30% revenue/EBITDA CAGRs, a Rs 11,000 crore valuation backed by
    five institutional investors, and a leadership position in nephrology — but the
    31–33x EBITDA multiple leaves little margin for execution risk in a private,
    disclosure-light structure.
  overallScore: 7.2
  recommendation: track
  confidence: medium
  riskRating: medium
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1300
    revenueRunRateUsdM: 197
    arrUsdM: null
    revenueGrowthYoYPct: 20
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 229
    customerCount: null
    headcount: null
  topStrengths:
    - >-
      Industry-leading 25% revenue CAGR and 30% EBITDA CAGR over a decade, corroborated
      by multiple independent PE investors pricing the business progressively higher.
    - >-
      Dominant market position in nephrology (company-claimed ~30% segment share) with
      deep specialist physician relationships built over 17+ years.
    - >-
      Diversified chronic-therapy platform across 8 divisions reduces single-segment
      concentration risk; meaningful exports (40–45% of sales) to 40+ countries.
    - >-
      Marquee PE syndicate (Peak XV, A91, ChrysCapital, Avendus, WhiteOak, Siguler Guff,
      Creador) validates business quality; founder-controlled structure provides stable
      governance and long-term alignment.
    - >-
      DSIR-recognized R&D center with 4 manufacturing subsidiaries and an expanding
      Rajasthan plant (100M → 400M units/month) supports organic capacity for growth.
  topRisks:
    - >-
      31–33x EV/EBITDA valuation leaves minimal execution headroom; comparable public
      PE players have walked away from Indian generic acquisitions at 25–30x EBITDA.
    - >-
      Private-undisclosed disclosure profile means all financial data relies on media
      reports and investor communications — no audited accounts are publicly verifiable.
    - >-
      High key-person concentration in founder Pankaj Singh; board composition and
      succession planning are not publicly disclosed.
    - >-
      Export-driven business (40–45%) exposed to USFDA regulatory risk, US tariff threats
      (50% tariff proposed on Indian pharma imports), and US pricing erosion pressures.
    - >-
      NPPA price controls on branded generics and increasing genericisation pressure
      domestically could compress domestic margins; API import dependence on China is
      a cross-sector risk.
  unresolvedGaps:
    - Audited financial statements unavailable; media-reported figures need independent verification before any investment decision.
    - Headcount, exact customer count, and detailed P&L split between domestic and export not publicly disclosed.
    - Board composition, governance documents, and investor rights (pro-rata, information covenants) not available.
    - IPO timeline not officially disclosed; Goldman Sachs discussions in 2025 did not materialise.
    - Exact nephrology market share of ~30% is a company claim without independent third-party verification.

appendices:
  - id: A
    title: Investor History and Cap Table
    blocks:
      - type: paragraph
        body: >-
          La Renon has raised approximately USD 229 million across five disclosed institutional
          rounds from June 2015 to September 2025. Sequoia Capital (now Peak XV Partners)
          led the 2015 Series A-equivalent at Rs 100 crore (~$16M) implying a ~$100M valuation.
          A91 Partners invested $30M in January 2021 at a $500M valuation. ChrysCapital executed
          an ~8% secondary in 2024 at Rs 6,500 crore. Avendus Future Leaders Fund bought ~2%
          in February 2025 at Rs 8,000 crore. The September 2025 closing saw WhiteOak Capital,
          Siguler Guff, and Creador jointly acquire 10% for Rs 1,000 crore at a Rs 11,000 crore
          valuation. Post-transaction, the promoter family holds approximately 66% and PE
          investors collectively hold approximately 34%.
        claimRefs: [CO022, CO023, CO024, CO025, CO026, CO027, CO028]

