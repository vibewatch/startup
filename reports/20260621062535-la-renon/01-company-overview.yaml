- id: funding-ownership-and-valuation-path
  title: Funding path, ownership map, and valuation escalation
  body: The most important company-overview fact pattern after identity is the speed of La Renon’s valuation climb. Public coverage traces a step-up from Sequoia’s 2015 investment at roughly Rs 700 crore valuation to the A91 round at roughly Rs 3,500 crore in 2021, ChrysCapital at around Rs 6,500 crore in 2024, Avendus at roughly Rs 8,000 crore in early 2025, and the WhiteOak-Siguler-Creador deal at around Rs 11,000 crore later in 2025. That path is dramatic because it implies that growth, export mix, and operating leverage have been strong enough to keep attracting crossover private capital into a branded-generics platform. It is also where the public record becomes thinnest. Sources offer broad ownership splits and deal sizes, but not the current cap table, rights stack, or debt profile that would convert headline financing into a true ownership-underwriting view. That unresolved detail is not cosmetic. It directly affects how much of the reported valuation path reflects true operating
    progress versus favorable private-market pricing in a hot sector.
