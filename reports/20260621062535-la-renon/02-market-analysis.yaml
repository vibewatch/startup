- id: growth-drivers-and-constraints
  title: Growth drivers, policy support, and the most important constraints
  body: 'The market backdrop is favorable, but not frictionless. Demand-side support comes from India’s chronic-disease burden, including meaningful kidney-disease prevalence, broader NCD growth, domestic healthcare expansion, and the country’s role as a large-scale pharma manufacturing base. Policy also helps: sector-level support schemes and manufacturing initiatives can improve economics for scaled formulation players. On the constraint side, regulation, pricing, and exports matter. NPPA-linked price controls can cap monetization in covered categories. CDSCO approval and compliance processes affect launch timing and product expansion. Export-oriented Indian pharma also faces recurring external risks including US pricing pressure, regulatory scrutiny, tariff threats, and supply-chain dependence on imported APIs. For La Renon, the implication is straightforward: the market is attractive enough to justify growth, but execution quality, therapy focus, and regulatory navigation will decide
    how much of that opportunity converts into defendable revenue and margin. That is why market attractiveness and execution difficulty need to be carried together. A large market with pricing caps, regulatory gating, and imported-input exposure is attractive, but not frictionless.'
