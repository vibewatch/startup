- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Primary buyer influence
  - Primary user
  - Payer / budget source
  - Adoption trigger
  - Market implication
  rows:
  - - Domestic chronic prescriptions
    - Specialist and general physicians
    - Patients with repeat therapy needs
    - Out-of-pocket, insurer, or hospital mix
    - Clinical trust and prescription continuity
    - Core chronic branded-generic demand pool.
  - - Hospital and institutional use
    - Hospital formulary and department heads
    - Inpatients and managed-care settings
    - Hospital budgets and procurement
    - Therapy protocol fit and availability
    - Important for critical-care and specialty lines.
  - - Retail pharmacy channel
    - Distributors and pharmacies
    - Prescription-bearing patients
    - Patient spend and channel credit
    - Shelf presence and prescription conversion
    - Shapes repeat purchase economics.
  - - Export registrations
    - Importer or local commercialization partner
    - Local prescribers and patients
    - Country-specific commercial economics
    - Registration approval and partner execution
    - Extends growth runway beyond India.
  - - Nephrology specialists
    - Nephrologists and specialist clinics
    - CKD and dialysis-adjacent patients
    - Mixed payer structures
    - Specialist adoption and therapy credibility
    - Potentially La Renon’s strongest niche claim.
  - - CNS and cardio-metabolic repeat care
    - Physicians and long-term care networks
    - Chronic therapy patients
    - Recurring patient spending
    - Long-term adherence and prescription renewal
    - Supports recurring rather than one-time demand.
  notes: This buyer map is a workflow interpretation of the company’s therapy positioning and Indian pharma channel structure rather than a directly disclosed customer list.
