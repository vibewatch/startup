tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment or lens
  - Included spend
  - Excluded spend
  - Buyer / payer logic
  - Why it matters for La Renon
  rows:
  - - All India pharmaceuticals
    - Prescription drugs, branded generics, specialty formulations, export sales
    - Devices, diagnostics, hospital services, most vaccines outside scope lens
    - Mixed buyers across retail, hospital, export, and government channels
    - Useful outer TAM but too broad for company-level underwriting.
  - - Indian branded generics
    - Branded prescription formulations sold through doctor-led channels
    - Unbranded commodity molecules and non-drug care
    - Doctors influence demand; distributors and pharmacies shape pull-through
    - Closer to La Renon’s disclosed identity.
  - - Chronic-care therapy market
    - Nephrology, CNS, cardio-metabolic, respiratory, gastro, urology, gynaecology repeat therapies
    - Acute-only episodic therapies outside the company’s emphasis
    - Repeat prescription behavior and specialist referral patterns matter
    - Closer to the company’s therapy mix and repeat-use economics.
  - - Registration-led export market
    - Countries where La Renon has registrations, approvals, and partner routes
    - Unregistered geographies or pure aspiration markets
    - Local importers, partners, and regulators matter alongside doctors
    - Important because exports are reported at 40-45% of sales.
  - - Serviceable La Renon opportunity
    - Intersection of chronic therapies, current registrations, and commercial reach
    - Broad Indian pharma totals not reachable by current footprint
    - Buyer map differs by therapy and geography
    - Best lens for later diligence despite incomplete public precision.
  notes: The table narrows the relevant market from all-India pharma to the chronic-care branded-generic and export contexts most relevant to La Renon.
