  evidenceGaps:
  - type: missing-source
    severity: material
    topic: quality-metrics
    missingEvidence: Independent batch-failure, recall, certification-audit, or pharmacovigilance metrics tied to La Renon manufacturing sites.
    whyItMatters: Without external quality metrics, the trust and compliance stack remains mostly company-described rather than independently performance-tested.
    diligencePath: Request site-level quality dashboards, recall history, major audit outcomes, and pharmacovigilance summaries from management or regulators.
    relatedQuestionRefs:
    - QE023
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: roadmap-granularity
    missingEvidence: Product-by-product launch calendar, regulatory filing dates, and launch-readiness milestones beyond selected public examples.
    whyItMatters: The public pack is enough to show portfolio breadth but not enough to underwrite launch cadence or prioritization discipline.
    diligencePath: Request the internal launch roadmap and top-20 pipeline status sheet with filing, approval, and commercialization dates.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: minor
    topic: reliability-metrics
    missingEvidence: Service-level or implementation metrics such as stock-out frequency, fill-rate, complaint closure time, or adverse-event turnaround.
    whyItMatters: These operating metrics would show whether the product stack converts architecture claims into dependable execution.
    diligencePath: Ask for field-force service metrics, distributor fill rates, and complaint-resolution KPIs by division.
    relatedQuestionRefs:
    - QE024
