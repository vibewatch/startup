  rows:
  - - Nephrology
    - Nephrologists; CKD patients
    - Established core
    - Origin segment with strongest niche claim and CKD focus
    - Independent market-share validation for the “highest number of CKD patients” claim.
  - - CNS
    - Neurologists and psychiatrists
    - Established and expanding
    - 60+ products plus pipeline; neuropathic-pain relevance
    - Exact SKU profitability and launch cadence not public.
  - - Critical care
    - ICUs, CCUs, trauma centres
    - Established institutional line
    - Anti-infective focus and cited unique solutions
    - No named hospital deployments or formulary wins disclosed.
  - - Cardio-metabolic
    - Physicians treating diabetes and hypertension
    - Established chronic-care line
    - Dedicated team plus lifestyle-disease framing
    - No disclosed outcomes or channel share data.
  - - Urology
    - Urologists; BPH and stone patients
    - Established line
    - Complete-basket language suggests category coverage
    - No product-level sales mix or physician adoption data.
  - - Respiratory
    - Pulmonology and general medicine channels
    - Established line
    - Broad product basket for high-incidence respiratory disorders
    - No disclosed demand split by acute versus maintenance use.
  - - Gastroenterology
    - GI specialists and general medicine channels
    - Established line
    - Large SKU surface with modern molecules such as acotiamide
    - No disclosed category-level growth metrics.
  - - Gynaecology
    - OB-GYN and women's health channels
    - Established line
    - Broad women's health SKU list including hormonal therapies
    - No evidence on share or institutional protocols.
  - - PALMIGES / neuropathic-pain nutraceutical asset
    - Neurology and pain-management prescribers
    - Development-to-commercial asset
    - CARE cites patent approvals including Canada and Europe
    - No public patent number or commercialization economics.
  - - Enaltec API capability
    - Internal formulation programs
    - Strategic integration asset
    - Backward integration into APIs
    - No public disclosure on molecule-level self-supply share.
  notes: Rows combine therapy divisions and adjacent strategic assets so the table captures both commercial modules and enabling product-tech assets; gaps mark where public evidence stops short of underwriting.
