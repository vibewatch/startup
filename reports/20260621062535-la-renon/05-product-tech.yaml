  - type: conflicting-data
    severity: minor
    topic: rajasthan-plant
    missingEvidence: One public source gives a 43 million unit target while later news reports a 100 million to 400 million monthly oral-solids ramp.
    whyItMatters: Capacity claims shape product-tech underwriting, so inconsistent phrasing can misstate how much de-bottlenecking is actually planned.
    diligencePath: Request the plant project note with current nameplate capacity, post-expansion capacity, dosage-form scope, and commissioning dates.
    relatedQuestionRefs:
    - QE019
