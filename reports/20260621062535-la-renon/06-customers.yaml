- id: TU006
  title: Retention evidence-gap proxy table
  columns:
  - Evidence surface
  - What is visible
  - What remains missing
  - Why the gap matters
  - Diligence path
  rows:
  - - E-pharmacy product pages
    - Pricing, expiry, availability, and condition-level use cases for selected SKUs
    - Repeat-order curves, subscription behavior, reorder frequency
    - Live listings do not prove durable customer economics
    - Request channel sell-through and repeat-order data by top SKU
  - - Official therapy pages
    - Institutional and chronic-care customer narratives
    - Named hospital accounts, prescriber coverage, formulary wins
    - Narrative without named accounts can overstate deployment depth
    - Request top institutional references and therapy-wise doctor coverage
  - - Justdial reviews
    - A shallow 3.4 rating signal with mixed comments
    - Validated satisfaction data, complaint closure rates, NPS
    - Sparse reviews cannot support a strong satisfaction conclusion
    - Request NPS, complaint logs, and service-level dashboards
  - - Market directories
    - Broad product discoverability across multiple platforms
    - Retention, churn, contract duration, and cohort retention
    - Breadth of visibility is not the same as durability of demand
    - Request account-cohort retention and distributor attrition metrics
  notes: This extra exhibit converts the chapter's biggest customer-proof limitation into a structured diligence checklist rather than implying retention precision that public sources do not support.
