- id: retention-repeat-use-and-demand-durability
  title: Retention, repeat-use logic, and demand durability
  body: 'The best case for customer durability comes from therapy logic, not from disclosed retention metrics. CKD support, diabetic neuropathy management, hypertension, diabetes, and pregnancy-related supplementation are all categories where repeat prescriptions or recurring replenishment are plausible. WHO and ICMR context reinforces why these categories matter in India and other low- or middle-income settings: the burden of chronic kidney disease, hypertension, diabetes, and other noncommunicable diseases is large enough to support continued clinical demand. That is useful because it explains why La Renon''s product set could create durable channel throughput if execution is strong. But the chapter should avoid over-claiming. Public sources do not disclose customer counts, repeat-order rates, NRR, churn, or contract duration. Even marketplace availability can be noisy, as shown by the out-of-stock Neuronomic listing. So the correct stance is that repeat-usage logic is visible, while retention
    proof remains materially under-evidenced.'
  claimRefs:
