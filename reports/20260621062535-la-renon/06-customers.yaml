- id: concentration-satisfaction-and-main-gaps
  title: Concentration, satisfaction, and the main open diligence gaps
  body: 'The adverse takeaway in this chapter is not that customer evidence is negative; it is that key customer-quality metrics are still hard to verify independently. Justdial provides the only directly public feedback signal in the reviewed pack, and it is too shallow to carry a strong satisfaction conclusion: the page shows a 3.4 rating, a small number of comments, and mixed sentiment including a visible “Poor” review. That is enough to reject any strong claim of universally positive satisfaction, but not enough to infer systemic customer weakness either. More importantly, no reviewed source discloses top-customer concentration, geography concentration, segment revenue share, contract structure, or cohort retention. The company may well have durable channel relationships, but the open pack does not yet let an investor test whether the business is broad-based or concentrated. This chapter therefore supports a measured conclusion: customer reach is plausible and externally visible, while
    concentration and satisfaction remain live diligence asks rather than solved facts.'
