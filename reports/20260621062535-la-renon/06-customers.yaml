- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - International field-team support and a Myanmar country-manager opening
    - Country mix remains undisclosed
    - Could be a real growth lever or a thin exploratory footprint
    - Request geography-level revenue, growth, and margin split.
  - - Multi-platform digital health-commerce presence
    - Channel profitability and concentration unknown
    - Channel breadth may diversify access but could still be economically concentrated
    - Request channel revenue concentration and CAC/service-cost view.
  - - Therapy adjacency across nephrology, CNS, cardio-metabolic, respiratory, and women's health
    - No public segment revenue split
    - Cross-selling narrative is plausible but unverified
    - Request segment-wise revenue and contribution margin.
  - - Institutional critical-care positioning
    - No named hospitals or formulary wins disclosed
    - Institutional exposure could be strategically important or mostly marketing-led
    - Request top institutional accounts and tender history.
  - - Partner-led business-development model
    - Top-partner concentration unknown
    - Partner dependence can create hidden concentration risk
    - Request top partner list, contract tenor, and renewal profile.
  notes: The expansion view highlights what can expand while keeping concentration risk explicit, because public reach signals are much stronger than public concentration disclosures.
