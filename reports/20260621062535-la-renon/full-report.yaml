      - number: '2.2'
        title: Sizing lenses and why range discipline matters
        blocks:
          - type: paragraph
            body: >-
              Top-down market sizing supports the conclusion that La Renon has room to grow, but it does not support
              false precision. IMARC offers the more aggressive market view, placing India’s pharma market above USD 68
              billion in 2025 and projecting a very strong long-term CAGR. Mordor gives a meaningfully lower near-term
              base and a slower growth rate. Government and industry bodies do not reconcile those methodologies, so the
              cleanest diligence stance is to carry both as outer bounds rather than collapse them into one point
              estimate. The same discipline applies to La Renon. Open sources disclose no therapy-wise revenue split,
              geography mix, or prescription share that would let an external analyst calculate a robust bottom-up SAM
              or SOM. What can be said is that the company’s 40-plus-country footprint and registration base imply a
              real serviceable market larger than domestic-only branded generics, while precision still requires
              management data.
