          score: 5
          detail: Enough to frame a range, not enough to clear a clean buy call.
        - label: Overall IC readiness
          score: 5
          detail: Worth tracking closely, but not yet fully underwritten at the top mark.
appendices:
  - id: A
    title: Investor History and Cap Table
    blocks:
      - type: paragraph
        body: >-
          La Renon has raised approximately USD 229 million across five disclosed institutional rounds from June 2015 to
          September 2025. Sequoia Capital (now Peak XV Partners) led the 2015 Series A-equivalent at Rs 100 crore
          (~$16M) implying a ~$100M valuation. A91 Partners invested $30M in January 2021 at a $500M valuation.
          ChrysCapital executed an ~8% secondary in 2024 at Rs 6,500 crore. Avendus Future Leaders Fund bought ~2% in
          February 2025 at Rs 8,000 crore. The September 2025 closing saw WhiteOak Capital, Siguler Guff, and Creador
          jointly acquire 10% for Rs 1,000 crore at a Rs 11,000 crore valuation. Post-transaction, the promoter family
          holds approximately 66% and PE investors collectively hold approximately 34%.
        claimRefs:
          - CO022
          - CO023
          - CO024
          - CO025
          - CO026
          - CO027
          - CO028
