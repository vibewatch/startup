        title: Leadership bench and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Leadership visibility is a relative strength in La Renon’s public materials, but it also highlights
              concentration risk. Founder Pankaj Singh remains the company’s central strategic identity, with official
              biographies emphasizing first-generation entrepreneurship, scientific training, an MBA, and more than two
              decades in pharma. The disclosed operating bench under him is functional rather than purely ceremonial:
              Vivek Gupta anchors nephrology, Yashwant Singh covers several domestic therapy lines, Samir Kumar leads
              CNS, and Abhijit Basu is presented as an operations and partner-management executive. That is enough to
              show real role segmentation, yet the public record still centers overwhelmingly on Pankaj Singh when
              explaining the company’s history, strategy, and investor relevance. For a private company with limited
              financial disclosure, that matters because founder dependence can amplify succession, execution, and
              fundraising sensitivity even when second-line leaders are visible.
