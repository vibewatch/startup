  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Portfolio shape and therapy-line depth
        blocks:
          - type: paragraph
            body: >-
              La Renon's product stack is best understood as a multi-division chronic-care platform rather than a single
              flagship brand. The official surface repeatedly converges on the same architecture: eight therapy
              divisions, roughly 340 formulations, and a registration-and-pipeline footprint broad enough to support
              both domestic detailing and export-led commercialization. The division pages make the product strategy
              concrete. Nephrology is framed as the original niche and still the strongest proof of focused therapeutic
              positioning. CNS is the deepest disclosed category by SKU count, while critical care, cardio-metabolic,
              urology, respiratory, gastroenterology, and gynaecology fill out a broader chronic and specialty basket.
              This matters because it suggests La Renon is solving portfolio-management, formulation-refresh, and
              channel-coverage problems at scale, not merely extending one molecule family. The best corroborated
              conclusion is breadth with some real depth, especially where nephrology and CNS claims are reinforced by
              both official pages and outside channel listings.
