      - number: '7.4'
        title: Mitigations exist, but several thesis-break thresholds still require diligence
        blocks:
          - type: paragraph
            body: >-
              The right conclusion is not that La Renon is uninvestable. It is that its strongest mitigants are still
              mostly inferred rather than fully documented in public. Official materials support therapy breadth, export
              reach, and some R&D and expansion capability. Sector sources show India pharma still has supportive
              demand, policy attention, and active capital-market interest. Those are real offsets. But risk management
              here has to be evidence-led. Investors should require audited FY25 and latest-trailing financials,
              product-level CDSCO and price-control mapping, direct explanation of US exposure, supplier concentration
              data, and the current shareholder-rights stack before upgrading conviction. Kill criteria should therefore
              be explicit: missed ramp milestones, adverse regulatory findings, a step-down from media-reported EBITDA,
              evidence that export economics are materially US-linked, or financing terms that privilege insiders over
              new money. Until those checks clear, La Renon deserves a medium-confidence risk rating with document-first
              diligence rather than a narrative-only green light.
            claimRefs:
