    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, operating model, and scale footprint
        blocks:
          - type: paragraph
            body: >-
              La Renon’s public identity is unusually clear for a private Indian pharma company. Official materials
              consistently place the headquarters in Ahmedabad, date the founding to 2007 with operations beginning in
              2008, and describe the business as a branded-generic formulations company oriented toward chronic and
              specialty disease categories rather than commodity acute-care volume alone. The operating footprint also
              looks broader than a simple domestic marketer. The company says it has roughly 340 formulations, an
              eight-division therapy structure, more than 40-country reach, hundreds of registrations, and a sizable
              evaluation and pipeline queue. Those facts matter because they establish La Renon as a scaled
              commercialization and portfolio-management platform rather than a single-brand story. They also help later
              chapters anchor claims about market access, therapy concentration, and export exposure against a disclosed
              operating base rather than inferred scale.
