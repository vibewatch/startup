      - number: '5.4'
        title: Roadmap signals, capacity expansion, and the main technical risks
        blocks:
          - type: paragraph
            body: >-
              Public roadmap evidence exists, but it is fragmented. On the positive side, outside coverage and channel
              pages show continuing portfolio refresh across chronic and specialty categories, active commercial
              presence for neuropathic-pain and CKD-support brands, and a Rajasthan oral-solids expansion story that
              would materially increase capacity if executed as described. CARE's note on Frimline, Enaltec, and
              PALMIGES also shows a product-tech roadmap that is broader than simple branded generics alone, reaching
              into nutraceutical and API-linked adjacencies. The risk is that roadmap precision is still low. Public
              sources disagree on whether the Rajasthan project should be read as a 43 million unit plant target or as a
              100 million to 400 million monthly tablets-and-capsules ramp, and none of the reviewed sources provide the
              internal milestone sheet that would reconcile timing, dosage forms, and launch sequencing. That means the
              product-tech story is investable as a scale-and-platform thesis, but not yet underwritten as an execution
              certainty. In practical diligence terms, management should be asked for the commissioning plan,
              dosage-form split, and the exact bridge between current utilization and post-expansion output so capacity
              claims can be normalized before underwriting growth.
