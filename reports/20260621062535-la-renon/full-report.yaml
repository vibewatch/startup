companyProfile:
  summary: >-
    La Renon Healthcare Pvt. Ltd. is an Ahmedabad-based branded generic pharmaceutical company founded in 2007 and
    operational since 2008. The company focuses exclusively on chronic disease therapies — nephrology, CNS, critical
    care, cardio-metabolic, gastroenterology, urology, respiratory, and gynaecology — through eight specialist
    divisions. With a portfolio of approximately 340 formulations, a DSIR-recognized R&D center, and a manufacturing
    base anchored by its subsidiary Stanford Laboratories, La Renon has delivered a 25% revenue CAGR and 30% EBITDA CAGR
    over the past decade, reaching FY25 revenue of Rs 1,640–1,685 crore and EBITDA of Rs 330–356 crore. The company is
    active in 40+ countries through 269 drug registrations and has attracted a marquee investor syndicate that values
    the business at Rs 11,000 crore (~USD 1.3B) as of September 2025, representing a ~16x valuation step-up from its
    first institutional round in 2015.
  foundedDate: '2007-01-01'
  founders:
    - name: Pankaj Singh
      role: Founder, Chairman & Managing Director
      background: >-
        First-generation entrepreneur with a science degree and MBA and more than 20 years of hands-on experience in
        Indian and international pharmaceutical business.
      claimRefs:
        - CO003
        - CO012
  foundingLocation: Ahmedabad, Gujarat, India
  headquarters: Ahmedabad, Gujarat, India
  productSummary: >-
    Branded generic pharmaceutical formulations across eight chronic-therapy divisions: Nephroscience (nephrology), CNS
    (neurology), Critical Care (anti-infectives), Cardio-Metabolic (diabetes/hypertension), Gastroenterology, Urology,
    Respiratory, and Gynaecology. Marketed in India and exported to 40+ countries through 269 drug registrations.
    Manufacturing includes subsidiary Stanford Laboratories (oral dosage), Frimline (medical foods), Enaltec Labs (API
    research), and Rusoma Healthcare (small-volume parenterals), plus contract manufacturers.
  customerFocus: >-
    Specialist physicians (nephrologists, neurologists, cardiologists, intensivists), hospitals, ICUs, trauma centres,
    and specialty clinics in India and 40+ export markets.
  businessModel: >-
    Develops and manufactures branded generic formulations through its DSIR-recognized R&D center, transfers technology
    to its manufacturing subsidiaries and contract partners, and markets products through specialist field-force
    divisions. Revenue is generated from domestic branded generic sales (~55-60%) and export formulation sales
    (~40-45%).
  stage: Late-stage private / pre-IPO
  fundingStatus: >-
