  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Peer boundary: direct chronic peers versus broad Indian pharma incumbents'
        blocks:
          - type: paragraph
            body: >-
              The right competitor set for La Renon starts with Indian branded-pharma businesses that sell recurring
              chronic or specialist prescriptions, not with every healthcare company or every generic manufacturer. That
              is why Eris and JB Chemicals matter more than unrelated hospital or device businesses, and why Mankind,
              Torrent, Lupin, Alkem, Abbott India, and Sun Pharma belong in the broader incumbent frame. They all
              compete for physician trust, channel access, or investor attention in the same domestic prescriptions
              market. The implication is important for diligence. La Renon is not competing on novelty alone. It is
              competing inside a mature branded-formulations arena where several public companies already combine
              chronic-therapy depth, better balance-sheet visibility, and stronger public-market comparability. That
              makes the peer question less about who sells tablets and more about who controls doctor attention,
              distributor leverage, and valuation credibility.
