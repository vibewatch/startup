      - number: '4.2'
        title: The implied margin path is improving, but the operating bridge is still inferential
        blocks:
          - type: paragraph
            body: >-
              The strongest quantitative insight available from public sources is the implied margin trend. Using the
              reported revenue and EBITDA figures, La Renon appears to move from roughly 18.8% EBITDA margin in FY20 to
              about 20.1-21.1% in FY25, with a FY26 target around 22.5%. That direction is encouraging because it
              suggests the company is capturing operating leverage as scale grows. Capacity expansion and broader
              chronic-therapy coverage make that story plausible. The problem is not the arithmetic. The problem is that
              the bridge underneath the arithmetic remains opaque. Public sources do not disclose gross margin,
              sales-force productivity, inventory turns, receivable days, or geography-wise profitability. The chapter
              can therefore say that the margin narrative is directionally positive, but it cannot prove whether the
              improvement comes from genuinely better unit economics, temporary mix effects, export pricing, or deferred
              cost pressure. This is a classic case where top-line and EBITDA headlines are useful screening facts, not
              complete underwriting inputs.
