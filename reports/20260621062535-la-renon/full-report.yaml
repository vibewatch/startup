            title: Big market, narrower opportunity
            body: >-
              The right conclusion is not merely that Indian pharma is large. It is that La Renon sits in a specifically
              attractive slice where chronic disease burden, branded-generic economics, and registration-led exports
              intersect. That supports growth, but it does not by itself solve the open problem of precise SAM and SOM
              sizing.
