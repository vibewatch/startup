  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory visibility is the biggest unresolved underwriting risk
        blocks:
          - type: paragraph
            body: >-
              The first risk is not that La Renon obviously has a live regulatory breach; it is that the open record
              does not prove the opposite. The company is private, the reviewed official pages are commercial rather
              than compliance-oriented, and the current public pack does not include audited financial statements,
              product-level approval schedules, inspection histories, or a litigation register. That creates a real
              underwriting problem because later-stage pharma valuations need more than revenue and EBITDA headlines.
              They need comfort on licenses, price-control exposure, approvals, legal process, and whether silence
              reflects cleanliness or simply lack of disclosure. This run also hit direct access friction on CDSCO and
              NPPA pages and found the Bar and Bench transaction page unavailable, which means several regulator- and
              deal-term checks remain unresolved in primary sources. The implication is that regulatory and legal
              diligence is not a box-ticking follow-up. It is the chapter’s most important gating item before anyone
              should treat the current private-market mark as fully risk-adjusted.
