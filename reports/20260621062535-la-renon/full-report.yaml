      - number: '8.2'
        title: Public comps support quality pharma multiples, but they also show why La Renon needs a disclosure haircut
        blocks:
          - type: paragraph
            body: >-
              Public-market context is supportive without being a blank check. Indian pharma remains a large, well-owned
              listed sector, and public leaders such as Sun, Lupin, Mankind, Alkem, Abbott India, and Eris all trade at
              meaningful earnings multiples. That tells investors two useful things. First, the market does pay for
              branded-generic and chronic-therapy franchises when disclosure is strong. Second, those public multiples
              sit alongside daily price discovery, audited filings, and far richer segment transparency than La Renon
              currently offers. The most relevant adverse comparator is the JB Chemicals sale process, where
              private-equity buyers reportedly viewed 25-30x EBITDA as already rich for a pure generic drugmaker.
              Against that backdrop, La Renon’s late-2025 mark implies roughly 31-33x FY25 EBITDA using the reported Rs
              330-356 crore range. The right scenario framework therefore keeps a real bull case for continued growth,
              but it also admits a base case below the headline mark and a bear case where multiple compression lands
              first, even without an operating collapse. Another useful lens is asymmetry: public peers justify premium
              ratings with audited statements, quarterly cadence, and segment commentary, while La Renon asks investors
              to bridge from transaction headlines to full underwriting value. That gap is exactly why the scenario
              table keeps a meaningful discount in the base case.
