      - number: '4.3'
        title: Capital events are real, but balance-sheet adequacy is still unproven from public sources
        blocks:
          - type: paragraph
            body: >-
              The capital story is more nuanced than the headline transaction values suggest. Recent coverage makes La
              Renon look heavily financed, but much of the visible activity was secondary rather than primary. In the
              2025 transaction, promoters and existing investors sold shares to incoming investors, which means the
              reported Rs 1,000 crore event should not automatically be read as fresh operating cash. That distinction
              matters because the company is simultaneously funding capacity expansion and chasing another year of
              strong growth. The open record does not disclose cash on hand, debt facilities, burn, or runway, so there
              is no clean way to test whether growth can be funded internally or still depends on external capital. The
              adverse evidence sharpens this point: Economic Times says Goldman Sachs had explored a larger Rs 1,600
              crore infusion that did not close. That does not disprove financial strength, but it does show financing
              optionality is not unlimited. Public investors can see capital-market interest; they still cannot
              underwrite capital adequacy with confidence.
