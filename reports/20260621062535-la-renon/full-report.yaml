  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The current mark is impressive, but price support is thinner than the headline suggests
        blocks:
          - type: paragraph
            body: >-
              La Renon’s latest valuation marker deserves respect because it is not a one-off rumor. Open reporting
              supports a trajectory from roughly Rs 700 crore in the Sequoia era to around Rs 3,500 crore in 2021, about
              Rs 6,500 crore in 2024, around Rs 8,000 crore in early 2025, and about Rs 11,000 crore by late 2025. That
              is a dramatic re-rating and it is consistent with a company that has delivered real growth in chronic
              therapies and exports. The problem is not whether the company is good. The problem is whether the open
              pack supports this exact price. FY25 revenue and EBITDA remain media-reported, not audit-backed. The 2025
              marks were largely discovered through secondary transactions rather than clean public filings, and the
              2025 ET report itself preserves the adverse fact that a larger Goldman Sachs fundraising path did not
              close. That combination means the investment call has to be price-sensitive: impressive business momentum,
              but incomplete evidence for paying the top mark without a discount for opacity. It also means downside can
              emerge from governance or disclosure repricing before any obvious demand slowdown appears. A credible
              business can still be an unattractive deal if the price is discovered through opaque secondaries and the
              evidence denominator is soft.
            claimRefs:
