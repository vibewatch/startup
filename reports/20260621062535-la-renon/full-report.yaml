      - number: '5.2'
        title: Development and manufacturing architecture
        blocks:
          - type: paragraph
            body: >-
              The operating architecture is unusually legible for a private pharma company. La Renon says its
              DSIR-recognized in-house R&D center develops formulations to a stable, commercialization-ready state and
              then transfers the technology to either owned or partner manufacturing. That creates a clear architecture:
              discovery and formulation work in-house, oral-dose manufacturing support through Stanford Labs, and
              supplementary scale through third-party manufacturers named on the R&D page. CARE's credit note adds the
              most useful independent discipline to this picture. It confirms that Stanford reduced dependence on
              external manufacturing but did not eliminate it, and it quantifies that dependence at about 36% of
              formulation requirement in FY21. It also adds the strategic logic behind later acquisitions, especially
              Enaltec for API backward integration. The result is an architecture that looks practical and scalable, but
              still exposed to supplier quality, handoff discipline, and manufacturing concentration risk where public
              documentation becomes thinner.
