      - number: '3.2'
        title: Competitor profiles show larger scale almost everywhere except La Renon's narrowest niche strengths
        blocks:
          - type: paragraph
            body: >-
              The public comparator set makes one point immediately: La Renon is substantial for a private company, but
              it is still smaller than every listed peer that matters in its orbit. Eris is the closest listed
              chronic-care comparator because its public narrative is explicitly built around domestic branded
              formulations and chronic therapies, yet Eris still commands a larger market capitalization than La Renon's
              latest private mark. JB Chemicals is relevant for a different reason: it demonstrates how private equity
              and strategics value a branded-generics platform once chronic therapies, acquisitions, and operating
              leverage begin to scale together. Mankind and Torrent are more dangerous from a channel perspective
              because they pair much broader domestic reach with chronic and specialty coverage. Lupin, Alkem, Abbott
              India, and Sun Pharma are not perfect therapy matches, but they remain adjacent substitutes with more
              capital, more disclosure, and more room to pressure pricing or field-force mindshare.
