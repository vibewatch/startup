            body: >-
              La Renon's customer base is not disclosed as a named account list, but the official surface still reveals
              a useful segmentation model. The therapy pages consistently map to recurring chronic-care workflows:
              nephrology around CKD patients, CNS around long-duration neurological and psychiatric conditions,
              cardio-metabolic around diabetes and hypertension, urology around BPH and kidney stones, respiratory
              around long-running respiratory disorders, and gynaecology around women's health pathways. Critical care
              adds the most explicit institutional signal because the company says it serves ICUs, CCUs, and trauma
              centres across India. The board-members and contact pages also point to a specialty-marketing model built
              around customer-dedicated teams and partner selection rather than pure brand advertising. The right
              conclusion is that La Renon appears to sell into a mixed customer graph of physicians, institutions,
              pharmacies, distributors, and partners, with chronic-care repeat need as the dominant usage logic. What is
              missing is a public denominator for how much each segment contributes to revenue.
