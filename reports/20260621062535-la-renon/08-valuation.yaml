- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Sun Pharma
    - Public market cap and P/E
    - Rs 441,070 crore market cap; 38.14x P/E on 19 Jun 2026
    - Large listed branded-pharma benchmark showing what strong disclosure can command.
    - Much larger, more diversified, and not a direct private-company comp.
  - - Lupin
    - Public market cap and P/E
    - Rs 107,510 crore market cap; 19.95x P/E on 19 Jun 2026
    - Useful lower-multiple listed reference for a scaled Indian pharma platform.
    - Public-company earnings multiple is not the same as private EV/EBITDA.
  - - Mankind Pharma
    - Public market cap and P/E
    - Rs 99,665.01 crore market cap; 51.92x P/E on 19 Jun 2026
    - Shows that premium chronic / branded-generic exposure can earn a high public multiple.
    - Still benefits from listing liquidity and audited disclosure.
  - - Alkem Labs
    - Public market cap and P/E
    - Rs 64,248.25 crore market cap; 27.9x P/E on 19 Jun 2026
    - Mid-large listed comp with meaningful domestic branded exposure.
    - Public P/E cannot be mapped one-for-one to La Renon’s private EV.
  - - Abbott India
    - Public market cap and P/E
    - Rs 55,705.05 crore market cap; 35.8x P/E on 19 Jun 2026
    - Premium India-focused branded-pharma reference.
    - MNC affiliate economics and disclosure quality differ materially.
  - - Eris Lifesciences
    - Public market cap and P/E
    - Rs 20,070 crore market cap; 79.0x P/E on Screener snapshot
    - Smaller chronic-focused domestic comparator showing premium small-cap optimism.
    - Snapshot timing and ratio definitions can move quickly.
  - - JB Chemicals sale process
    - Private-market EBITDA caution
    - PE buyers reportedly viewed 25-30x EBITDA as rich while strategic interest persisted.
    - Best adverse current check on what private buyers may resist paying for a generic-drugmaker.
    - JB is a different asset and mandate, not a clean apples-to-apples pair.
  - - La Renon late-2025 mark
    - Implied private EV / EBITDA
    - About Rs 11,000 crore on reported FY25 EBITDA of Rs 330-356 crore implies roughly 31-33x EBITDA.
    - Directly frames whether the headline valuation sits above private-market caution zones.
    - Depends on unaudited reported EBITDA and undisclosed net debt / rights stack.
  notes: The comp set intentionally mixes public market data with a live private-market mandate because La Renon is private and no single comp framework is sufficient.
