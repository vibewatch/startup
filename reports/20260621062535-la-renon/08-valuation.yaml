- id: recommendation-and-final-diligence
  title: The best open-source call is track / research-more with medium confidence and explicit upgrade gates
  body: 'Recommendation quality here is constrained less by business attractiveness than by evidence quality at the entry price. A bullish investor can point to chronic-therapy positioning, exports, repeated investor interest, and a company that may grow into the current mark if FY26 pushes toward Rs 2,000 crore revenue and about Rs 450 crore EBITDA. A skeptical investor can point to the richer-than-JB-mandate multiple, the lack of audited accounts, incomplete visibility into rights and debt, and the fact that listed peers justify their public multiples with much stronger disclosure. That mix does not support a full-throated buy from open sources alone. It supports track / research-more, or at minimum a wait-for-terms stance if the entry price is anywhere near the late-2025 headline valuation. The path to an upgrade is straightforward: audited FY25s, a clean FY26 run-rate, cap-table and preference clarity, direct export and US exposure disclosure, and evidence that plant expansion and working
    capital do not erode the reported EBITDA story. In practice, that means this chapter is not bearish on the company’s existence; it is disciplined about what is knowable from open sources. If the next diligence pass converts opaque secondary marks into documented earnings power and clean terms, the recommendation can move quickly. Until then, patience is part of valuation discipline.'
