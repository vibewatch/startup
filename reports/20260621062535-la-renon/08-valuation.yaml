- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - Strong chronic-therapy positioning, export mix, and repeated investor demand can justify premium interest.
    - Upgrade if audited FY25/FY26 proves the reported EBITDA trajectory and rights-stack friction is limited.
  - - The valuation path from 2015 to 2025 shows real market validation and sustained growth.
    - Downgrade if the 2025 price discovery proves mostly secondary and unsupported by current earnings quality.
  - - Public comps show Indian pharma investors pay for quality branded-generic franchises.
    - Keep the discount until La Renon offers public-company-like disclosure on audited numbers and segment mix.
  - - The anti-thesis is that Rs 11,000 crore prices in too much perfection for a private generic-drugmaker with opaque disclosure.
    - A lower entry point or fully opened data room would materially soften this objection.
  notes: The table keeps thesis and anti-thesis in direct tension so the recommendation stays anchored to price and evidence, not just company quality.
