  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-fy25
    missingEvidence: Audited FY25 financial statements, quality of earnings, segment bridge, and current FY26 trading data.
    whyItMatters: The valuation denominator behind every multiple is still media-reported rather than audit-backed.
    diligencePath: Request audited statements, monthly MIS, and a bridge from FY25 to current run-rate performance.
    relatedQuestionRefs:
    - QV003
    - QV004
    - QV021
    relatedTableRefs:
    - TV001
    - TV003
    - TV006
  - type: private-evidence-only
    severity: blocking
    topic: rights-stack
    missingEvidence: Current cap table, preference terms, debt, transfer mechanics, and shareholder rights.
    whyItMatters: A headline valuation can materially misstate entry economics when rights are opaque.
    diligencePath: Obtain SHA, debt schedule, and transaction summary from management and counsel.
    relatedQuestionRefs:
    - QV013
    - QV014
    relatedTableRefs:
    - TV002
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: geography-and-customer-mix
    missingEvidence: Country-level revenue, top customers, and regulated-market mix.
    whyItMatters: The relevance of export, pricing, and regulatory downside cannot be sized without knowing where growth actually comes from.
    diligencePath: Request revenue bridge by geography, channel, and top-account concentration.
    relatedQuestionRefs:
    - QV025
    - QV026
    relatedTableRefs:
    - TV003
    - TV006
  - type: private-evidence-only
    severity: material
    topic: working-capital-and-debt
    missingEvidence: Current net debt, working-capital intensity, and covenant profile.
    whyItMatters: Private-company value cannot be normalized cleanly without knowing leverage and cash-conversion quality.
    diligencePath: Request debt schedule, receivables aging, inventory turns, and cash-flow bridge.
