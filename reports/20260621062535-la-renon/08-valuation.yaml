- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Audited FY25 / FY26 financials
    - Audited statements, segment bridge, working-capital detail
    - Without them the EBITDA denominator behind every multiple remains soft.
    - Management data room and auditor pack.
  - - Cap table and rights stack
    - Current SHA, liquidation preference, transfer rights, debt schedule
    - Headline valuation is not enough for entry underwriting.
    - Company counsel and investor documents.
  - - Geography and customer mix
    - Export-country, customer, and regulated-market exposure
    - Needed to test the relevance of US pricing and tariff risks.
    - Commercial analytics export by country and top-account concentration.
  - - Plant-ramp economics
    - Rajasthan capex, qualification status, utilization, margin bridge
    - Needed to know whether growth can convert into clean EBITDA.
    - Ops diligence plus plant visit.
  - - Quality and regulatory history
    - Approvals, inspections, recalls, complaints, price-control mapping
    - Required to decide whether the risk discount should compress or widen.
    - Regulatory and QA diligence workstream.
  notes: These asks are the shortest route to changing the recommendation because they attack the biggest sources of valuation uncertainty directly.
