- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - FY26 approaches Rs 2,000 crore revenue and about Rs 450 crore EBITDA; exports and chronic therapies continue compounding; no disclosure surprises.
    - A 30-33x forward EBITDA lens can defend roughly Rs 10,500-14,000 crore.
    - Requires clean plant ramp, no regulatory shock, and continued premium private-market demand.
    - Possible but not yet fully evidenced.
  - - Base
    - Reported FY25 EBITDA range is broadly real, but investors continue to demand a disclosure discount.
    - A high-20s to about 30x EBITDA lens supports roughly Rs 9,000-10,500 crore.
    - Audited numbers or rights details could still force a reset.
    - Most supportable from current open evidence.
  - - Bear
    - Growth or disclosure disappoints; sector multiple caution dominates.
    - A 25x or lower EBITDA lens on Rs 330-356 crore supports roughly Rs 8,250-8,900 crore or less.
    - Multiple compression can happen before operations fail outright.
    - Material enough to keep conviction medium.
  notes: Scenarios are anchored to the reported FY25 EBITDA range and current sector multiple signals rather than to speculative DCF precision.
