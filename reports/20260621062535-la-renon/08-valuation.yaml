- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Audited FY25 miss
    - Audited EBITDA materially below Rs 330 crore or quality of earnings weakens
    - Breaks the current multiple support and forces valuation reset.
    - Do not pay the late-2025 headline valuation.
  - - Rights-stack surprise
    - Preference, ratchet, or debt terms materially subordinate new money
    - Turns a headline valuation into a misleading entry marker.
    - Require repricing or pass.
  - - Export / regulated-market shock
    - US or other regulated-market exposure proves larger and weaker than assumed
    - Raises the relevance of pricing, tariff, and compliance downside.
    - Lower scenario range and raise risk rating.
  - - Plant-ramp underdelivery
    - Rajasthan expansion slips or drags margin
    - Cuts the forward-growth case embedded in bull support.
    - Move toward base/bear framework.
  - - Private-market multiple compression
    - Comparable sector deals reprice materially below current assumptions
    - Narrows exit optionality even if operations remain sound.
    - Hold or wait for lower entry.
  notes: Triggers focus on the few facts most likely to collapse or defend the current valuation quickly.
