- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence today
  - Mitigation / diligence ask
  rows:
  - - Nephrology-heavy specialist identity
    - Larger incumbents can fund adjacent chronic launches and field-force expansion
    - High
    - La Renon's niche is real, but public peers already cover broad chronic pathways
    - Request therapy-level revenue and win/loss data by specialist segment
  - - Chronic-care growth narrative
    - Public chronic-care peers like Eris already enjoy listed credibility and larger scale
    - High
    - Eris is the cleanest listed chronic comp and still trades at a larger equity value
    - Request evidence that La Renon's growth quality exceeds Eris on margin or share
  - - Institutional capital validation
    - Rich multiple leaves less room for operational miss
    - High
    - Implied multiple is around or above the rich 25-30x EBITDA benchmark cited for generic assets
    - Request current monthly exit-rate EBITDA and FY26 bridge
  - - Domestic-plus-export footprint
    - Scale incumbents can still out-distribute or out-spend the company
    - Medium-High
    - Torrent, Lupin, and Sun all show much larger reach and capital access
    - Request field-force, geography, and distributor productivity data
  - - Private-company flexibility
    - Lack of public disclosure can weaken buyer and investor confidence
    - Medium-High
    - Listed peers publish results and annual reports while La Renon does not
    - Request audited statements, debt schedule, and working-capital KPIs
  - - PE interest in the asset class
    - M&A competition can bid up alternatives and compress future exit room
    - Medium
    - JB Chemicals and Novartis India coverage show active buyer interest in comparable platforms
    - Map likely acquirers and their public valuation tolerance
  notes: Severity is an underwriting judgment based on the retained evidence set, not a probabilistic forecast.
