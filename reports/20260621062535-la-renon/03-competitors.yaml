- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company
  - Commercial / contract model signal
  - Public price or valuation signal
  - Included capabilities or scope
  - Discount / unknowns
  - Implication
  rows:
  - - La Renon
    - Private branded-formulations platform backed by secondary and growth capital
    - Rs 11,000 crore latest private valuation; FY25 EBITDA Rs 330-356 crore
    - Chronic therapies, exports, specialist-led domestic portfolio
    - No public list pricing, gross margin, or realized price disclosure
    - Underwriting relies on valuation math more than transparent operating-unit economics
  - - Eris
    - Listed chronic-care branded-formulations company
    - 79x P/E; Rs 20,070 crore market cap
    - High chronic-care concentration and domestic branded presence
    - No comparable product-level price list retained
    - Closest listed signal for chronic-franchise quality
  - - JB Chemicals
    - Listed branded-generics asset with PE sponsorship
    - 2024 sale commentary said 25-30x EBITDA already looked rich; current market cap much higher
    - Chronic therapies plus acquisitions and portfolio optimization
    - Current deal economics and synergy assumptions are not fully public
    - Most useful benchmark for what sponsors may actually pay for a branded-generics platform
  - - Mankind
    - Listed scale incumbent
    - 47x P/E; Rs 99,705 crore market cap
    - Mass domestic distribution and broad formulations mix
    - No clean price-per-script disclosures retained
    - Channel strength can overwhelm narrower specialist positioning
  - - Torrent
    - Listed incumbent with global footprint
    - Much larger turnover base than La Renon
    - Multiple chronic and specialty therapy lines, plus exports
    - No retained product-level pricing comparables
    - Scale and reach make it a strong substitute in many doctor decisions
  - - Public-peer basket
    - Exchange-traded disclosure surfaces
    - Public P/E bands span roughly 20x to 79x in retained sources
    - Recurring results, annual reports, market-cap visibility
    - Therapy-by-therapy comparability still imperfect
    - La Renon is judged against richer disclosure standards than its own public record provides
  notes: This table compares packaging of capital and disclosure rather than retail MRP per molecule, because the retained source pack does not provide a like-for-like product price deck across companies.
