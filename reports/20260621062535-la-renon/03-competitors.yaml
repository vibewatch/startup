- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Target segment
  - Differentiation
  - Limitation for La Renon comparison
  rows:
  - - Eris Lifesciences
    - Direct public chronic-care peer
    - Rs 20,070 crore market cap; 79x P/E on 19 Jun 2026
    - Domestic branded formulations; chronic and sub-chronic therapies
    - Closest listed chronic-care framing and strong domestic branded-formulation identity
    - Still materially larger and publicly disclosed versus private La Renon
  - - JB Chemicals & Pharmaceuticals
    - Direct sponsor-backed branded-generics comparator
    - Rs 1,606 crore FY20 revenue to Rs 3,484 crore FY24; KKR owned 53.78% during sale process
    - Chronic therapies plus portfolio expansion
    - Best public analogue for PE ownership, chronic emphasis, and exit interest
    - More inorganic and public-market seasoned than La Renon
  - - Mankind Pharma
    - Scaled domestic incumbent
    - Rs 99,705 crore market cap; 43.5 billion units installed capacity
    - Acute and chronic formulations with deep rural and Tier II-IV reach
    - Distribution power and broad doctor access
    - Broader model than La Renon's more specialist chronic story
  - - Torrent Pharma
    - Scaled incumbent with global reach
    - FY2026 turnover about Rs 13,980 crore; 50+ countries
    - CV, CNS, GI, women's health, diabetes, pain, oncology
    - Deep therapy breadth and export scale
    - Much larger operating base than La Renon
  - - Lupin
    - Adjacent global generics and specialty substitute
    - Rs 1,07,510 crore market cap; about 20x P/E
    - Generics, complex formulations, branded products, specialties
    - Global manufacturing and specialty reach
    - Less clearly chronic-specialty focused than Eris or La Renon
  - - Alkem Laboratories
    - Adjacent domestic branded incumbent
    - Rs 64,248 crore market cap; 27.9x P/E
    - Broad prescription pharma portfolio
    - Large listed domestic brand with accessible filings
    - Less obviously nephrology-led than La Renon
  - - Abbott India
    - Adjacent branded incumbent
    - Rs 55,705 crore market cap; 35.9x P/E
    - Established branded pharmaceuticals
    - High-quality disclosure and premium branded positioning
    - Multinational affiliate dynamics make it an imperfect direct operating comp
  - - Sun Pharma
    - Status-quo dominant incumbent
    - Rs 4,41,070 crore market cap; 38.1x P/E
    - Broad pharmaceuticals across India and global markets
    - Overwhelming scale and capital access
    - Too large to be a like-for-like peer, but impossible to ignore as channel benchmark
  notes: This table enumerates the most decision-useful open-record peer set for La Renon rather than every Indian pharma company; the goal is underwriting relevance, not exhaustive sector coverage.
