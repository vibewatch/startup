callouts:
- calloutType: risk
  title: Rich multiple leaves little room for a normal branded-generic slowdown
  body: The clearest adverse read from the peer set is valuation discipline. Public and sponsor-backed comparator evidence suggests 25-30x EBITDA is already considered rich for a generic-drug platform. La Renon's reported FY25 EBITDA and latest valuation imply a multiple around or above that band, so the company must keep proving that chronic-specialty depth and export mix justify a structurally better outcome than the broader listed comparator set.
