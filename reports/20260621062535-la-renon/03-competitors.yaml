- id: pricing-distribution-and-switching-costs
  title: Distribution strength and multiple discipline matter more than nominal product overlap
  body: 'Public sources do not provide clean list-price comparisons across these companies, so the more useful diligence lens is packaging power: who reaches doctors, who controls distribution, and who can sustain high multiples if growth softens. On that score, La Renon has a respectable chronic-specialty franchise, but the larger incumbents still hold the strategic high ground. Mankind''s Tier II-IV reach, Torrent''s 50-country footprint, and Sun Pharma''s sheer listed scale all matter because switching costs in branded pharma are only moderate. Doctor trust and brand recall are sticky, yet most therapies still have multiple clinically acceptable branded alternatives. That means La Renon must keep winning with therapy execution and reputation, not with structural lock-in. The valuation overlay makes this sharper: if buyers can substitute toward larger, better-disclosed brands, then a rich private multiple leaves less room for commercial error. The practical diligence ask is to separate
    brand familiarity from real pricing power: if doctors can switch across several chronic brands with limited disruption, then La Renon''s distribution disadvantage against listed incumbents becomes a financial issue, not just a commercial one.'
