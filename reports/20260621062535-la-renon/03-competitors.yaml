  evidenceGaps:
  - type: missing-source
    severity: material
    topic: therapy-level-share-comparison
    missingEvidence: Comparable therapy-level revenue mix and prescription-share data for La Renon versus Eris, JB Chemicals, Mankind, and Torrent.
    whyItMatters: Without therapy-level mix, the peer set can rank strategic closeness but cannot isolate where La Renon truly wins or loses on specialist economics.
    diligencePath: Request therapy-wise domestic revenue, field-force deployment, and top-brand rankings from management or channel consultants.
    relatedQuestionRefs:
    - QP005
    - QP008
    - QP016
    relatedTableRefs:
    - TP001
    - TP002
  - type: private-evidence-only
    severity: material
    topic: la-renon-win-loss-data
    missingEvidence: Win/loss analysis against named competitors, distributor retention metrics, and doctor-level adoption data for La Renon.
    whyItMatters: The chapter can infer moat durability from public comparators, but it cannot prove real switching behavior without commercial operating data.
    diligencePath: Request prescribing data, distributor churn, and competitive-intelligence reviews by therapy line.
    relatedQuestionRefs:
    - QP012
    - QP023
    - QP025
  - type: conflicting-data
    severity: minor
    topic: jb-current-versus-historical-valuation
    missingEvidence: A single date-aligned source reconciling JB Chemicals' 2024 sale-process market cap with its June 2026 public valuation.
    whyItMatters: The direction of re-rating is clear, but precise like-for-like comparison across dates is still a triangulation exercise.
    diligencePath: Pull exchange-date market caps or annual reports for each relevant observation date before using JB as a precise relative-valuation benchmark.
    relatedQuestionRefs:
    - QP010
    - QP011
    relatedTableRefs:
    - TP003
