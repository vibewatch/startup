evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financing-rights
    missingEvidence: >-
      Current shareholder agreement terms, liquidation preferences, board rights, and any debt or structured financing
      arrangements.
    whyItMatters: >-
      Company Overview can map investors and valuations, but not the actual control stack or downside protections that
      shape ownership economics.
    diligencePath: Request the latest cap table, SHA, and any debt schedule from management or lead investors.
    relatedQuestionRefs:
      - QO024
  - type: private-evidence-only
    severity: material
    topic: cap-table-completeness
    missingEvidence: A current detailed cap table showing investor-by-investor stakes after the September 2025 transaction.
    whyItMatters: >-
      Open sources only provide promoter-versus-PE split and selective investor percentages, which is insufficient for
      precise ownership or dilution analysis.
    diligencePath: Request an updated capitalization table and secondary transaction schedule.
    relatedQuestionRefs:
      - QO025
  - type: private-evidence-only
    severity: material
    topic: la-renon-sam-som-sizing
    missingEvidence: >-
      Therapy-wise revenue split, geography split, prescription volume, and registration-to-sales conversion needed for
      a bottom-up SAM/SOM model.
    whyItMatters: >-
      Without company-level mix data, this chapter can frame TAM and serviceable opportunity, but not a precise
      monetizable market for La Renon.
    diligencePath: >-
      Request therapy and geography revenue splits plus doctor, distributor, and export-country concentration data from
      management.
    relatedQuestionRefs:
      - QM024
  - type: missing-source
    severity: material
    topic: therapy-level-share-comparison
    missingEvidence: >-
      Comparable therapy-level revenue mix and prescription-share data for La Renon versus Eris, JB Chemicals, Mankind,
      and Torrent.
    whyItMatters: >-
      Without therapy-level mix, the peer set can rank strategic closeness but cannot isolate where La Renon truly wins
      or loses on specialist economics.
    diligencePath: >-
      Request therapy-wise domestic revenue, field-force deployment, and top-brand rankings from management or channel
      consultants.
    relatedQuestionRefs:
      - QP005
      - QP008
      - QP016
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: la-renon-win-loss-data
    missingEvidence: >-
      Win/loss analysis against named competitors, distributor retention metrics, and doctor-level adoption data for La
      Renon.
    whyItMatters: >-
      The chapter can infer moat durability from public comparators, but it cannot prove real switching behavior without
      commercial operating data.
    diligencePath: Request prescribing data, distributor churn, and competitive-intelligence reviews by therapy line.
    relatedQuestionRefs:
      - QP012
      - QP023
      - QP025
  - type: conflicting-data
    severity: minor
    topic: jb-current-versus-historical-valuation
    missingEvidence: >-
      A single date-aligned source reconciling JB Chemicals' 2024 sale-process market cap with its June 2026 public
      valuation.
    whyItMatters: >-
      The direction of re-rating is clear, but precise like-for-like comparison across dates is still a triangulation
      exercise.
    diligencePath: >-
      Pull exchange-date market caps or annual reports for each relevant observation date before using JB as a precise
      relative-valuation benchmark.
    relatedQuestionRefs:
      - QP010
      - QP011
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway-and-debt
    missingEvidence: Cash on hand, debt schedule, covenants, monthly burn, and runway assumptions.
    whyItMatters: >-
      Capital adequacy is the central underwriting blocker for this chapter and cannot be inferred responsibly from
      transaction headlines alone.
    diligencePath: Request monthly liquidity reports, debt maturity schedules, and board-approved operating plans from management.
    relatedQuestionRefs:
      - QI014
      - QI016
    relatedTableRefs:
      - TI004
      - TI005
  - type: missing-source
    severity: material
    topic: audited-financial-statements
    missingEvidence: Audited annual financial statements and detailed management accounts for FY23-FY26.
    whyItMatters: >-
      Without audited statements, the chapter cannot validate whether reported revenue, EBITDA, and capex metrics are
      fully comparable across years.
    diligencePath: >-
      Obtain audited statements plus a management bridge to the media-reported FY25 and FY26 numbers used in fundraising
      coverage.
    relatedQuestionRefs:
      - QI010
      - QI017
      - QI025
      - QI020
    relatedTableRefs:
      - TI003
      - TI005
  - type: stale
    severity: material
    topic: source-decay
    missingEvidence: >-
      Stable primary or cached records for the Avendus, legal-advisor, and Moneycontrol coverage around 2025
      transactions.
    whyItMatters: >-
      Link rot weakens reproducibility and makes the financing chronology less reliable for future refreshes if no
      internal archive exists.
    diligencePath: >-
      Archive source PDFs or publisher screenshots and request official transaction announcements or advisor materials
      for the data room.
    relatedQuestionRefs:
      - QI023
      - QI024
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: quality-metrics
    missingEvidence: >-
      Independent batch-failure, recall, certification-audit, or pharmacovigilance metrics tied to La Renon
      manufacturing sites.
    whyItMatters: >-
      Without external quality metrics, the trust and compliance stack remains mostly company-described rather than
      independently performance-tested.
    diligencePath: >-
      Request site-level quality dashboards, recall history, major audit outcomes, and pharmacovigilance summaries from
      management or regulators.
    relatedQuestionRefs:
      - QE023
      - QE024
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: roadmap-granularity
    missingEvidence: >-
      Product-by-product launch calendar, regulatory filing dates, and launch-readiness milestones beyond selected
      public examples.
    whyItMatters: >-
      The public pack is enough to show portfolio breadth but not enough to underwrite launch cadence or prioritization
      discipline.
    diligencePath: >-
      Request the internal launch roadmap and top-20 pipeline status sheet with filing, approval, and commercialization
      dates.
    relatedQuestionRefs:
      - QE025
    relatedTableRefs:
      - TE005
  - type: missing-source
    severity: minor
    topic: reliability-metrics
    missingEvidence: >-
      Service-level or implementation metrics such as stock-out frequency, fill-rate, complaint closure time, or
      adverse-event turnaround.
    whyItMatters: >-
      These operating metrics would show whether the product stack converts architecture claims into dependable
      execution.
    diligencePath: Ask for field-force service metrics, distributor fill rates, and complaint-resolution KPIs by division.
    relatedQuestionRefs:
      - QE024
    relatedTableRefs: []
  - type: conflicting-data
    severity: minor
    topic: rajasthan-plant
    missingEvidence: >-
      One public source gives a 43 million unit target while later news reports a 100 million to 400 million monthly
      oral-solids ramp.
    whyItMatters: >-
      Capacity claims shape product-tech underwriting, so inconsistent phrasing can misstate how much de-bottlenecking
      is actually planned.
    diligencePath: >-
      Request the plant project note with current nameplate capacity, post-expansion capacity, dosage-form scope, and
      commissioning dates.
    relatedQuestionRefs:
      - QE019
    relatedTableRefs:
      - TE005
  - type: missing-source
    severity: material
    topic: named-institutional-customers
    missingEvidence: Named hospitals, dialysis chains, ICU networks, or health-system accounts using La Renon products in production.
    whyItMatters: >-
      The official site clearly targets clinical settings, but open sources do not prove which institutions are
      customers or how strategic those accounts are.
    diligencePath: >-
      Request top institutional accounts, use-case references, and any anonymized tender or formulary-win history by
      therapy line.
    relatedQuestionRefs:
      - QU019
      - QU024
      - QU017
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: Customer retention, repeat purchase, NRR/GRR, and segment-level reorder behavior.
    whyItMatters: >-
      Without these metrics, the chapter can support repeat-usage logic but cannot underwrite customer durability or
      cohort quality.
    diligencePath: >-
      Request repeat-order curves, top-SKU reorder rates, distributor attrition, and any KAM dashboard used by
      management.
    relatedQuestionRefs:
      - QU018
    relatedTableRefs:
      - TU004
  - type: missing-source
