- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric or evidence
  - Impact
  - Exact diligence path
  rows:
  - - Audited income statement and EBITDA bridge
    - Without it, headline revenue and margin cannot be fully trusted
    - Request the last three audited statements with management bridge to reported FY25/FY26 numbers
  - - Cash, debt, and runway schedule
    - Capital adequacy cannot be underwritten
    - Request monthly liquidity report, debt schedule, and covenant summary
  - - Working-capital metrics (inventory, receivables, payables)
    - Revenue quality and cash conversion remain unknown
    - Request monthly and annual working-capital days by major segment
  - - Therapy-wise and geography-wise revenue mix
    - The chapter cannot isolate where growth is strongest or most profitable
    - Request segment P&L by therapy and export geography
  - - Product-level price-control exposure
    - Margin sensitivity to NPPA rules cannot be quantified
    - Map portfolio against NLEM and controlled categories molecule by molecule
  - - Stable source archive for financing history
    - Open-web links already show decay and mismatched redirects
    - Build an internal diligence archive of press releases, banker decks, and signed transaction summaries
  notes: Every row is a concrete blocker to clean financial underwriting rather than a generic wish list; the goal is to translate source limitations into data-room asks.
