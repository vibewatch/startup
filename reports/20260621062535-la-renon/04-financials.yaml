chapter:
  number: 4
  title: Financials
  summary: Open-record evidence supports a credible growth-and-margin expansion story for La Renon, but the financial pack remains secondary-source-driven and structurally incomplete. Revenue quality appears promising, yet capital adequacy, balance-sheet strength, and financing dependency cannot be fully underwritten without management disclosure or audited statements.
sections:
- id: reported-growth-and-revenue-model
  title: Reported growth is strong, and the revenue model looks like chronic branded formulations plus exports
  body: 'The public record does support a coherent top-line story. La Renon is repeatedly described as a branded-formulations company focused on chronic therapies, with a broad product portfolio and meaningful export activity layered on top of domestic formulations. That matters because it suggests revenue is not built around one-off tender spikes or a single flagship molecule. Instead, the narrative is recurring prescription demand in chronic categories, supported by a portfolio of roughly 340 formulations and a business mix in which exports reportedly contribute 40-45% of sales. The historical growth markers are also unusually strong for a private company: FY20 revenue was reported around Rs 800 crore, FY25 revenue around Rs 1,640-1,685 crore, and FY26 aspirations around Rs 2,000 crore. Taken at face value, that is enough to justify serious investor interest. It is not enough, however, to conclude anything precise about revenue recognition, channel mix, or the share of sales that is genuinely
    high quality versus simply fast growing.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
  - CI009
  tableRefs:
