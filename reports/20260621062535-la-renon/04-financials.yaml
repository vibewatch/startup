callouts:
- calloutType: risk
  title: Headline funding is not the same as usable liquidity
  body: The most important financial caution is capital interpretation. Public coverage shows large transactions around La Renon, but the visible 2025 deal included significant secondary selling by promoters and existing investors. That means the open record demonstrates market interest, not necessarily abundant fresh balance-sheet cash. Without audited statements, debt detail, and runway disclosure, capital adequacy still has to be treated as unresolved.
  claimRefs:
  - CI016
  - CI017
  - CI018
  - CI020
