  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway-and-debt
    missingEvidence: Cash on hand, debt schedule, covenants, monthly burn, and runway assumptions.
    whyItMatters: Capital adequacy is the central underwriting blocker for this chapter and cannot be inferred responsibly from transaction headlines alone.
    diligencePath: Request monthly liquidity reports, debt maturity schedules, and board-approved operating plans from management.
    relatedQuestionRefs:
    - QI014
    - QI016
    relatedTableRefs:
    - TI004
    - TI005
  - type: missing-source
    severity: material
    topic: audited-financial-statements
    missingEvidence: Audited annual financial statements and detailed management accounts for FY23-FY26.
    whyItMatters: Without audited statements, the chapter cannot validate whether reported revenue, EBITDA, and capex metrics are fully comparable across years.
    diligencePath: Obtain audited statements plus a management bridge to the media-reported FY25 and FY26 numbers used in fundraising coverage.
    relatedQuestionRefs:
    - QI010
    - QI017
    - QI025
    - QI020
    relatedTableRefs:
    - TI003
    - TI005
  - type: stale
    severity: material
    topic: source-decay
    missingEvidence: Stable primary or cached records for the Avendus, legal-advisor, and Moneycontrol coverage around 2025 transactions.
    whyItMatters: Link rot weakens reproducibility and makes the financing chronology less reliable for future refreshes if no internal archive exists.
    diligencePath: Archive source PDFs or publisher screenshots and request official transaction announcements or advisor materials for the data room.
    relatedQuestionRefs:
    - QI023
    - QI024
    relatedTableRefs:
    - TI005
