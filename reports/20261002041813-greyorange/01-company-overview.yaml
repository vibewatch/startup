    title: "Funding Totals Do Not Measure Liquidity"
    body: "Two databases report about $545 million across nine rounds, but FundedIQ records only $110 million and TechCrunch says the 2022 financing mixed equity and debt [CO009, CO011, CO012]. None of those figures measures current cash, and no source supplies debt terms, secondary proceeds, burn, or runway."
    claimRefs:
      - "CO009"
      - "CO011"
      - "CO012"
  - calloutType: "insight"
    title: "Scale Claims Need Denominator Discipline"
    body: "GreyOrange's 100,000+ active agents and 3,000+ sites indicate deployment reach, while the dated headcount sources indicate organizational scale [CO015, CO016]. They do not establish distinct customers, revenue, ARR, retention, or software mix, so those financial and commercial metrics remain open rather than inferred."
    claimRefs:
      - "CO015"
      - "CO016"
