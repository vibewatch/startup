company:
  name: "GreyOrange"
chapter:
  number: 1
  title: "Company Overview"
  summary: "GreyOrange sells AI-driven orchestration software and robotics for warehouses, stores, and supply chains, but public records disagree on its founding date, leadership, and cumulative financing. The latest supported financing milestone is a $135 million first close of Series D in December 2023; current valuation, consolidated revenue, customer count, cash, and governance remain material diligence gaps."
sections:
  - id: "identity-and-business-model"
    title: "Identity, Footprint, and Business Model"
    body: "GreyOrange presents itself as an operating layer for physical commerce: its software coordinates people, robots, and other systems across warehouses, stores, and supply chains rather than functioning only as a robot manufacturer [CO004]. FundedIQ lists core operations in the United States, Singapore, Germany, Japan, and India [CO005]. Current data profiles place headquarters in Roswell, Georgia, while TechCrunch uses the broader Atlanta designation [CO003]. The origin chronology is not clean enough to state as a single verified date: The Company Check says the founders started GreyOrange in 2012, but TechCrunch says the business was formed in India in 2015 [CO001, CO002]. Legal-entity records and founder documentation are therefore required before treating either date as definitive."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO001"
  - id: "leadership-and-governance"
    title: "Leadership, Governance, and Key-Person Dependence"
    body: "The available evidence shows a founder-led CEO transition but does not establish the current 2026 leadership roster. TechCrunch identified co-founder Samay Kohli as CEO in May 2022, while company-announcement coverage in December 2023 identified co-founder Akash Gupta as CEO [CO006, CO007]. That chronology suggests a leadership change, but neither assigned current official page provides a dated executive roster. Public evidence in the pool also does not establish board membership, voting control, founder ownership, executive succession arrangements, or the division of responsibilities between the founders. These omissions create key-person and governance risk: investors should verify current authority and oversight directly rather than infer that a 2023 title remains current."
    claimRefs:
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO002"
  - id: "financing-and-valuation"
    title: "Financing History, Investor Influence, and Valuation Limits"
    body: "The financing record supports several disclosed events but not a precise current capital position. TechCrunch reported a $140 million Series C in 2018 that brought cumulative funding at that point to $170 million, followed by $110 million of mixed equity-and-debt growth financing in May 2022 [CO008, CO009]. December 2023 coverage reported a $135 million first close of Series D led by Anthelion Capital [CO010]. Two data providers now report approximately $545 million across nine rounds, while FundedIQ records only the $110 million round; the conflict appears to reflect coverage scope and prevents treating either database total as audited [CO011, CO012]. The only valuation figure in the assigned evidence is The Company Check's historical $700 million mark for September 2020, not a current valuation [CO013]. Funding raised is not cash available, and no source discloses present debt, secondary sales, burn, or runway."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO003"
  - id: "scale-and-milestones"
    title: "Operating Scale, Milestones, and Disclosure Gaps"
    body: "GreyOrange's 2026 homepage claims more than 100,000 active physical agents and more than 3,000 active global sites, but those are company-reported deployment indicators rather than audited customer or revenue measures [CO015]. A separate profile reports 553 employees as of May 21, 2025, which fits FundedIQ's broader 501-1,000 employee band; neither establishes current 2026 headcount [CO016]. The record also contains an adverse capital-markets signal: as of May 2022, TechCrunch said an earlier IPO plan had not materialized [CO014]. No assigned source provides a current customer count, consolidated revenue, ARR, revenue growth, margins, cash balance, or runway. Those quantities remain gaps; the homepage's site and agent counts cannot be substituted for customers, revenue, or recurring software scale."
    claimRefs:
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"
