  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Suite Definition and Customer Workflows
        blocks:
          - type: paragraph
            body: >-
              GreyOrange packages its commercial offerings under Commerce One, which it positions as an integrated
              operating fabric connecting warehouse fulfillment, retail store floors, and broader supply chain
              execution. The primary engine is GreyMatter, a warehouse robotics orchestration system designed to
              coordinate people, robotic fleets, and material handling systems with claimed vendor-agnostic flexibility.
              GreyOrange reports that GreyMatter executes over one million dynamic optimizations per minute across
              operational distribution centers, claiming a 2x to 4x lift in warehouse productivity and up to 45%
              reduction in fulfillment costs per unit. For retail store environments, GreyOrange delivers gStore, which
              uses overhead and handheld RFID sensing to provide high-precision inventory tracking with 98% to 99%
              accuracy and 3 to 5 foot location precision, driving automatic shelf replenishment and omnichannel order
              staging. Across the wider enterprise network, gNetwork provides cross-facility visibility and inventory
              routing. However, while GreyOrange advertises 100,000+ physical agents and 3,000+ active sites worldwide,
              public documentation does not independently disaggregate active SaaS installations from legacy hardware
              shipments, leaving exact production customer workflows subject to on-site validation.
            claimRefs:
