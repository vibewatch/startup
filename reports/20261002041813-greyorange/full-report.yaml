  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              GreyOrange monetizes its fulfillment technology through a multi-tiered architecture that spans physical
              robotics deployment, software orchestration, and lifecycle maintenance. The primary software platform,
              GreyMatter, delivers vendor-agnostic warehouse execution orchestration, coordinating multi-agent robotics
              fleets and human labor through real-time algorithmic dispatch. On the retail store floor, GreyOrange
              monetizes its gStore application suite via continuous RFID inventory scanning, automated replenishment
              workflows, and omnichannel store fulfillment. Physical robotics hardware—including goods-to-person AMRs,
              assisted picking units, and sortation conveyors—is delivered under hybrid enterprise procurement models
              comprising capital expenditure purchases, robotics-as-a-service (RaaS) subscription leases, and mandatory
              multi-year maintenance and software licensing agreements. Because GreyOrange does not publish a
              standardized public list price card, commercial deal sizes are negotiated on an enterprise basis scaled by
              facility footprint, total deployed autonomous mobile robot unit counts, throughput volume, and software
              module tier. List pricing, realized contract pricing, and contractual discount structures remain strictly
              non-public, requiring targeted customer contract auditing during institutional diligence.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
