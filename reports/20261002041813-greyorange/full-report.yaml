      - number: '4.2'
        title: GTM Motion and Unit Economics Proxies
        blocks:
          - type: paragraph
            body: >-
              The commercial go-to-market motion for GreyOrange targets enterprise supply chain operators, Fortune 500
              omnichannel retailers, and third-party logistics providers such as Walmart Canada, Sodimac, and global
              retail chains. Enterprise sales cycles in high-throughput warehouse automation are structurally prolonged,
              typically spanning 9 to 18 months due to facility layout simulation, network engineering integration,
              procurement committee approvals, and pilot testing. Although GreyOrange claimed a gross contracted revenue
              retention rate of over 170% from existing customers in historical growth updates, comprehensive unit
              economics such as customer acquisition cost (CAC), CAC payback duration, and software net revenue
              retention (NRR) remain undisclosed. Physical robotics deployments incur heavy upfront site-engineering and
              integration expenses that depress gross margins during the initial installation phase, while mature
              recurring software revenues from GreyMatter and gStore yield substantially higher software gross margin
              characteristics once sites reach steady-state throughput. Verifying the margin divergence across physical
              system deployments and SaaS orchestration is critical for assessing operating leverage.
            claimRefs:
