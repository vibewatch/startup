      - Assumptions
      - Valuation or return logic
      - Probability signal
      - Downside trigger
    rows:
      - - Bull
        - Independent validation of recurring software growth, retention, and margins
        - Benchmark only after verified revenue and entry price are available
        - No probability assigned
        - Scale does not translate into durable software economics
      - - Base
        - Deployment scale is real, but economics and capitalization remain private
        - Price remains unformed; continue tracking
        - Current evidence best fits this case
        - Financing required before disclosure improves
      - - Bear
        - Debt or preference overhang combines with multiple compression
        - Protect capital by declining an unsupported entry price
        - Mixed financing and stale IPO evidence are caution signals
        - Down round, covenant pressure, or liquidity shortfall
    notes: >-
      These are conditional underwriting cases, not forecasts; no valuation range, return target, or probability is
      estimated without current financial and price inputs.
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
