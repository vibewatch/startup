      - number: '4.3'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              GreyOrange has financed its global expansion and ongoing technology research and development through a
              combination of institutional equity rounds and debt financing facilities, accumulating between $436.8M and
              $545M across multiple funding rounds. In May 2022, the company completed a $110M growth financing round
              comprising equity led by Mithril Capital Management alongside separate debt financing managed by BlackRock
              to support international operations and add approximately 300 technical and commercial roles. In December
              2023, GreyOrange closed a $135M Series D financing round led by Anthelion Capital with continued
              participation from Mithril Capital and Blume Ventures to accelerate global adoption across warehouses and
              retail chains. Prior exploration of a United States initial public offering in late 2021 targeted a $500M
              to $600M capital raise at a prospective $1.5B to $1.7B valuation, but public listing plans did not
              materialize as broader market conditions shifted. With secondary market platforms such as EquityZen
              facilitating employee and early-shareholder transactions, absolute cash on hand, monthly net burn rate,
              and covenant structures on debt facilities remain confidential, creating financing dependency risks if
              operating cash flow does not reach sustained breakeven.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
              - CI015
              - CI016
