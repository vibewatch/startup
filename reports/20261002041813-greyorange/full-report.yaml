      - number: '5.2'
        title: Architecture, Operating Model, and Developer Signals
        blocks:
          - type: paragraph
            body: >-
              GreyOrange's underlying technology stack reflects a transition from proprietary automated guided vehicle
              (AGV) manufacturing toward an enterprise distributed software and PaaS orchestration platform. Technical
              recruiting disclosures, engineering specifications, and architectural job records reveal that GreyOrange's
              core backend platform is built primarily in Java and C++, supported by Python for automation and test
              pipelines, Erlang/Scala for concurrent queuing, and microservices hosted on AWS. The system architecture
              emphasizes low-latency message queues, REST APIs, and algorithmic planning services responsible for path
              optimization, dynamic multi-agent task dispatching, and robotic routing in computationally intensive
              warehouse environments. Quality engineering teams utilize Python automation frameworks, Page Object Model
              (POM) testing, and simulated evaluation pipelines to validate complex asynchronous data pipelines before
              physical deployment. GreyOrange claims vendor-agnostic hardware interoperability, coordinating proprietary
              Ranger robots alongside third-party AMRs, automated storage and retrieval systems (ASRS), and sorters.
              Crucially, engineering specifications indicate an ongoing corporate transition toward a pure SaaS and PaaS
              delivery model, necessitating large-scale refactoring of monolithic routing algorithms into cloud-hosted
              microservices with open RESTful interfaces.
            claimRefs:
              - CE006
              - CE007
              - CE008
              - CE009
