  - id: FE001
    title: GreyOrange Commerce One Software Architecture Stack
    type: stack
    summary: >-
      Six-tier architectural stack illustrating data flow from physical robotics through edge orchestration to
      enterprise cloud integration.
    data:
      layers:
        - label: Enterprise Application & WMS Layer
          detail: Top-level enterprise connectivity interfacing with corporate WMS, ERP, and e-commerce platforms.
          modules:
            - WMS Integration Gateway (Manhattan, SAP EWM, Blue Yonder)
            - Omnichannel Order Management & Restocking API
          outputs:
            - Validated Order Streams
            - Synchronized Inventory Snapshots
        - label: Network Optimization & Commerce One Layer
          detail: Cross-facility intelligence layer coordinating inventory flows and capacity across multi-site networks.
          modules:
            - gNetwork Dynamic Commerce Router
            - Cross-Node Inventory Allocation Service
          outputs:
            - Global Inventory Visibility
            - Inter-Facility Transfer Schedules
        - label: Retail In-Store Sensing & Intelligence Layer
          detail: Store-level digital twin platform managing real-time RFID tracking and automated replenishment.
          modules:
            - gStore Cloud Inventory & RFID Engine
            - In-Store Item Localization Service
          outputs:
            - 98-99% Store Inventory Accuracy
            - Automated Sales Floor Replenishment Tasks
        - label: GreyMatter Core Orchestration Layer
          detail: Algorithmic execution engine performing real-time multi-agent optimization and robotic task scheduling.
          modules:
            - Algorithmic Path Planning Engine (Java/C++)
            - Low-Latency Queuing & High-Concurrency Scheduler
          outputs:
            - 1M+ Dynamic Optimizations/Minute
            - Collision-Free AMR Trajectories
        - label: Simulation & Quality Assurance Layer
          detail: Virtual evaluation and test automation pipelines validating fleet operations and software releases.
          modules:
            - Python Test Automation Framework (Page Object Model)
            - Virtual Simulation & Physics Modeling Engine
          outputs:
            - Automated Regression Test Reports
            - Pre-Deployment Fleet Validation Telemetry
        - label: Physical Execution & Edge Layer
          detail: On-premise edge appliances, sensor arrays, human picking stations, and heterogeneous robotic fleets.
          modules:
            - Proprietary Ranger AMR Drive Units
            - Third-Party Robotic Agents & Fixed MHE
            - Stationary & Handheld RFID Sensors
            - Human-Machine Picking Terminals
          outputs:
            - Physical Pallet/Tote Movement
            - Continuous Edge Telemetry
    approximationNotes: >-
      Architecture layers synthesized from engineering specifications, hiring disclosures, and published platform
      descriptions.
    claimRefs:
      - CE001
      - CE002
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: Enterprise Customer Journey and Platform Expansion Loop
    type: journey-map
    summary: >-
      Illustrates the commercial expansion path from warehouse pilot to multi-facility orchestration and store-level
      gStore physical AI rollout.
    data:
      items:
        - label: Initial Warehouse Pilot
          description: Customer evaluates GreyMatter in a single distribution center with 10-15 AMRs for goods-to-person picking.
          role: Land Phase
        - label: Facility Expansion & Fleet Scale
          description: Customer scales robot fleet to 50-80+ units per site, replacing conventional material handling equipment.
          role: Expand Phase
        - label: Multi-Facility Network Deployment
          description: >-
            GreyMatter is deployed across regional distribution centers to unify fulfillment rules across multiple
            brands.
          role: Enterprise Integration
        - label: Store Floor gStore Rollout
          description: >-
            Customer deploys gStore across hundreds of retail stores with RFID and sensing to connect DC and store
            inventory.
          role: Omnichannel Loop
        - label: Heterogeneous Fleet Orchestration
          description: Orchestration layer integrates 3rd-party vendor AMRs, robotic arms, and vertical lifts under unified WES.
          role: Platform Standardization
        - label: Real-Time Supply Chain Synchronization
          description: Feedback loops link store sales data, shelf heatmaps, and DC replenishment algorithms dynamically.
          role: Ecosystem Lock-In
    approximationNotes: >-
      Represents typical enterprise customer trajectory synthesized from H&M Group and customer deployment case
      interviews.
    claimRefs:
      - CU004
      - CU010
      - CU012
  - id: FR001
    title: Risk Severity and Likelihood Assessment Matrix
    type: matrix
    summary: >-
      Visual mapping of identified regulatory, operational, partner, and financial risks by likelihood and impact
      severity.
    data:
      columns:
        - Rare / Very Low Likelihood
        - Low Likelihood
        - Medium Likelihood
        - High Likelihood
        - Very High / Persistent Likelihood
        - Near-Certain Likelihood
      rows:
        - label: Catastrophic Impact
          values:
            - Core IP invalidation or global injunction
            - Multi-facility fatal automated machinery accident
            - Persistent IPO cancellation combined with sudden debt acceleration
            - Complete Black Friday global cloud and edge orchestration collapse
            - Comprehensive export embargo on all Chinese partner AMR chassis
            - Simultaneous bankruptcy of top three 3PL integration partners
        - label: Critical Impact
          values:
            - Single-tenant regional edge controller server failure
            - Peak season orchestration software latency spike and picking halt
            - Major partner hardware safety recall across North American sites
            - Extended private market liquidity freeze requiring down-round financing
            - Key customer contract termination at major regional fulfillment hubs
            - Enterprise retail ERP integration failure during seasonal warehouse ramp
        - label: High Impact
          values:
            - Targeted ransomware intrusion isolating warehouse local subnet
            - Enterprise edge compute and IoT sensor communication latency
            - Heterogeneous AMR firmware drift causing routing collisions
            - Hardware manufacturing supply chain disruption for replacement parts
            - Prolonged pilot-to-production enterprise adoption lag
            - Tier-1 retail procurement friction over multi-vendor liability terms
        - label: Moderate Impact
          values:
            - Minor cross-border tariff adjustment on robotic components
            - Multi-jurisdictional tax reporting and transfer pricing scrutiny
            - Local warehouse floor labor resistance or retraining delays
            - Temporary edge telemetry packet loss during peak shift change
            - Subcontractor technician availability bottlenecks in remote markets
            - Third-party battery degradation and charging dock scheduling drift
        - label: Minor Impact
          values:
            - Localized RFID tag read inaccuracy in apparel retail stores
            - Minor UI rendering delay in GreyMatter operations supervisor dashboard
            - Inconsequential sensor calibration drift corrected by routine maintenance
            - Delayed shipment of auxiliary scanner brackets or mounting fixtures
            - Transient simulation parameter mismatch in GreyMatter Foundry sandbox
            - Minor documentation discrepancies across regional operator training manuals
        - label: Negligible Impact
          values:
            - Cosmetic scuffs on AMR exterior protective bumper panels
            - Non-critical telemetry logging delay for historical reporting archives
            - Routine scheduled maintenance window overrun under 15 minutes
            - Deprecation of legacy browser version on administrative console
            - Staging environment sandbox reset during low-volume weekend shifts
            - Minor font rendering variance on localized handheld terminal screens
    approximationNotes: >-
      Risk placements represent qualitative analytical categorization based on enterprise robotics diligence and
      disclosed company operating history.
    claimRefs:
      - CR005
      - CR006
      - CR009
      - CR011
