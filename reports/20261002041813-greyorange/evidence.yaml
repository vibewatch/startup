evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current executive roster, board composition, founder ownership, voting rights, succession arrangements, and
      delegated authority.
    whyItMatters: >-
      Dated CEO titles establish a transition but do not show who controls the company or how founder dependence is
      mitigated in 2026.
    diligencePath: >-
      Obtain the current organization chart, board minutes, shareholder register, charter documents, and management
      biographies from the data room.
    relatedQuestionRefs:
      - QO003
      - QO010
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: capitalization
    missingEvidence: >-
      Audited financing schedule separating primary equity, debt principal, secondary sales, and any undrawn commitments
      across all rounds.
    whyItMatters: Reported cumulative funding totals conflict, and none establishes cash available or current debt exposure.
    diligencePath: >-
      Reconcile bank statements, debt agreements, cap-table transaction history, and audited cash-flow statements to
      each announced round.
    relatedQuestionRefs:
      - QO004
      - QO005
      - QO010
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: current-scale-and-financials
    missingEvidence: >-
      Current consolidated revenue, ARR, growth, gross margin, customer count, cash balance, burn, runway, and exact
      2026 headcount.
    whyItMatters: >-
      Deployment indicators and historical funding cannot establish recurring software scale, profitability, liquidity,
      or current organizational capacity.
    diligencePath: >-
      Request audited consolidated statements, ARR bridge, customer master, cohort metrics, monthly cash forecast, and
      payroll roster through September 2026.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse-checks
    missingEvidence: Authoritative current litigation, regulatory, safety-incident, outage, sanction, and complaint records.
    whyItMatters: >-
      The assigned adverse query returned no retained URL, and absence of a result is not evidence that no incident
      occurred.
    diligencePath: >-
      Run jurisdiction-specific court, regulator, workplace-safety, product-safety, and service-incident searches during
      legal diligence.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: investor-map
    missingEvidence: >-
      Complete current shareholder, creditor, board-observer, and option-holder populations with ownership percentages
      and security rights.
    whyItMatters: >-
      The selected public stakeholder map cannot establish control, dilution, liquidation priority, or related-party
      influence.
    diligencePath: >-
      Review the fully diluted cap table, debt register, shareholder agreements, board register, and secondary-transfer
      history.
    relatedQuestionRefs:
      - QO004
      - QO010
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: sizing-gaps
    missingEvidence: >-
      Standalone annual contract value (ACV) and recurring software revenue figures for GreyMatter orchestration
      decoupled from physical robotic hardware sales.
    whyItMatters: >-
      Prevents precise calculation of Serviceable Obtainable Market (SOM) market share in pure-play warehouse software
      orchestration versus bundled hardware automation.
    diligencePath: >-
      Request audited management breakdown of software subscription revenue versus capital hardware sales in customer
      contracts.
    relatedQuestionRefs:
      - QM009
  - type: private-evidence-only
    severity: material
    topic: win-rate-competitors
    missingEvidence: >-
      Disclosed head-to-head competitive win and loss rates against Geek+ and Locus Robotics in Tier-1 enterprise RFP
      bake-offs.
    whyItMatters: >-
      Independent win-rate metrics are critical to verify whether GreyMatter's multi-agent software differentiation
      overcomes low-cost hardware competition.
    diligencePath: >-
      Request audited sales pipeline win/loss logs and customer reference interview data from enterprise retail
      accounts.
    relatedQuestionRefs:
      - QP002
    relatedTableRefs:
      - TP001
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Public contract rate cards, RaaS hourly or per-pick pricing tiers, and realized software margin percentages for
      GreyMatter and gStore.
    whyItMatters: >-
      Pricing opacity prevents underwriting gross margin comparability between pure-play hardware sales and high-margin
      recurring orchestration software.
    diligencePath: >-
      Review master service agreements, customer order forms, and discounting schedules in confirmatory commercial due
      diligence.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: enumeration-incomplete
    severity: minor
    topic: rfid-store-competition
    missingEvidence: >-
      Comprehensive market share breakdown of retail store inventory platforms comparing GreyOrange gStore against
      specialized RFID solution providers.
    whyItMatters: >-
      Determines whether in-store retail orchestration represents an accretive second growth engine or a niche add-on to
      core warehouse automation.
    diligencePath: >-
      Conduct channel diligence with retail systems integrators and evaluate Zebra Technologies joint pipeline
      reporting.
    relatedQuestionRefs:
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: arr-and-revenue-mix
    missingEvidence: >-
      Audited annual recurring revenue (ARR) breakdown distinguishing GreyMatter SaaS licenses from hardware Capex and
      maintenance fees.
    whyItMatters: >-
      Without segmented revenue disclosures, investors cannot model software recurring revenue multiple vs
      capital-intensive hardware manufacturing.
    diligencePath: >-
      Request GAAP audited financial statements and recurring revenue bridge reports during confidential management
      meetings.
    relatedQuestionRefs:
      - QI005
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: gross-margin-breakdown
    missingEvidence: >-
      Gross margin percentages broken down by hardware delivery, cloud SaaS orchestration, and professional integration
      services.
    whyItMatters: Hardware deployment cost overruns can severely dilute overall gross margins despite high-margin software claims.
    diligencePath: Review project-level contribution margin data across representative warehouse customer deployments.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-and-runway
    missingEvidence: >-
      Current cash balance, net monthly operating cash burn rate, and covenants governing the BlackRock debt financing
      facility.
    whyItMatters: >-
      High operating burn combined with debt service obligations can create refinancing risk if growth capital markets
      tighten.
    diligencePath: Inspect latest treasury reports, bank covenant compliance certificates, and 24-month forward liquidity models.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: hardware-specifications
    missingEvidence: >-
      Granular hardware datasheets detailing battery chemistry, charging cycle duration, MTBF, payload torque ratings,
      and unit bill-of-materials for proprietary Ranger AMR models.
    whyItMatters: >-
      Without primary hardware engineering specifications, underwriters cannot assess robotic lifecycle depreciation,
      field maintenance burden, or physical hardware replacement cycles.
    diligencePath: >-
      Request confidential hardware specification sheets, safety certs (ANSI/RIA R15.08, CE mark), and
      warranty/maintenance telemetry logs during technical management diligence.
    relatedQuestionRefs:
      - QE002
  - type: missing-source
    severity: material
    topic: edge-resilience-failover
    missingEvidence: >-
      Empirical benchmark data or architectural whitepapers detailing edge compute gateway failover protocols when cloud
      WAN connectivity to AWS drops during live warehouse picking.
    whyItMatters: >-
      If edge servers cannot sustain autonomous local routing during network disruptions, entire distribution facilities
      face work stoppages and severe delivery SLA penalties.
    diligencePath: >-
      Examine architectural disaster recovery runbooks, offline edge node operational limits, and customer SLA incident
      reports during enterprise technical review.
    relatedQuestionRefs:
      - QE007
  - type: missing-source
    severity: minor
    topic: compliance-certifications
    missingEvidence: >-
      Third-party audit documentation for SOC 2 Type II, ISO/IEC 27001, and formal robotic cybersecurity compliance
      verification.
    whyItMatters: >-
      Enterprise Tier-1 retail customers require verified data security and network isolation standards prior to
      connecting external IoT orchestration software to enterprise WMS/ERP networks.
    diligencePath: >-
      Obtain current SOC 2 Type II attestation reports and cloud penetration test summaries directly from GreyOrange
      information security officers.
    relatedQuestionRefs:
      - QE004
  - type: private-evidence-only
    severity: material
    topic: undisclosed-nrr-and-churn
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), and customer account churn cohorts by vintage
      year.
    whyItMatters: >-
      Without cohort retention disclosures, investors cannot verify whether historical contracted gross retention is
      sustained across large enterprise accounts.
    diligencePath: Request customer cohort retention schedules and annual churn metrics under non-disclosure review.
    relatedQuestionRefs:
      - QU004
      - QU008
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-table
    missingEvidence: >-
      Comprehensive census of all live enterprise deployments, active robot fleet counts per customer, and ARR
      contribution.
    whyItMatters: >-
      Public customer references are limited to showcase accounts like H&M Group and Walmart Canada, concealing
      potential concentration or pilot drop-off.
    diligencePath: Audit top 20 customer accounts, revenue concentration percentages, and pilot-to-production conversion rates.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: minor
    topic: independent-user-reviews
    missingEvidence: >-
      Third-party customer review datasets (e.g., Gartner Peer Insights, G2) detailing implementation hurdles, software
      stability, and maintenance costs.
    whyItMatters: >-
      Most customer proof is co-marketed with corporate partners, leaving day-to-day operational friction and customer
      satisfaction unverified.
    diligencePath: Interview reference warehouse managers and store operations executives at deployed customer sites.
    relatedQuestionRefs:
      - QU008
  - type: missing-source
    severity: material
    topic: uptime-sla
    missingEvidence: >-
      Disclosed historical platform uptime percentages, incident logs, and SLA penalty payout track record for
      GreyMatter cloud and edge orchestration.
    whyItMatters: >-
      Enterprise customers and investors require verification of operational resilience during peak fulfillment seasons
