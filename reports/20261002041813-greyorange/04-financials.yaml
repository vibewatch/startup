callouts:
  - calloutType: "risk"
    title: "Revenue Visibility and Disclosure Opacity"
    body: "GreyOrange operates with substantial disclosure opacity regarding audited financial metrics. The company has raised significant institutional capital but has never publicly disclosed audited recurring revenue, gross margins, or operating profitability, requiring thorough off-balance-sheet diligence."
    claimRefs:
      - "CI015"
      - "CI016"
  - calloutType: "insight"
    title: "Capital Structure and Debt Obligations"
    body: "The inclusion of growth debt financing alongside equity in GreyOrange's 2022 financing round signals structured capital dependencies. Investors must evaluate debt maturity timelines, interest servicing obligations, and senior security liens against company intellectual property."
    claimRefs:
      - "CI011"
      - "CI012"
