      - number: '5.2'
        title: 技术架构、运行机制与底层工程信号
        blocks:
          - type: paragraph
            body: >-
              GreyOrange 的底层技术栈显露出从传统专有自动导引车（AGV）制造向企业级分布式软件与 PaaS 编排平台的转型轨迹。技术招聘要求、工程规格说明与系统架构岗位记录表明，GreyOrange
              的核心后端主要采用 Java 与 C++ 构建，辅以 Python 驱动自动化与测试流水线，依托 Erlang/Scala 承载高并发消息队列，微服务全面部署于 AWS。系统架构高度聚焦低延迟消息队列、REST
              API 以及算法规划服务，负责应对仓储高算力环境下的路径优化、动态多智能体任务分派与机器人运动规划。质效工程团队利用 Python
              自动化框架、页面对象模型（POM）测试与仿真评估管道，在硬件物理部署前对复杂的异步数据链路实施预校验。GreyOrange 声称其具备硬件中立互操作性，可统一调度自有 Ranger 机器人以及第三方
              AMR、自动化立体库（ASRS）和分拣线。至关重要的一点在于，多份工程规格文档证实其正推进向纯 SaaS 与 PaaS 交付模式的全面转型，亟需将昔日的单体路径规划算法大规模重构成具备开放 RESTful
              接口的云端微服务集群。
