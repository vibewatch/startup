  - id: FE001
    title: GreyOrange Commerce One 软件架构栈
    type: stack
    summary: 六层架构技术栈，展示从物理机器人到边缘调度再到企业云集成的端到端数据流。
    data:
      layers:
        - label: 企业应用与 WMS 层
          detail: 对接企业 WMS、ERP 及电商平台的顶层企业级连接。
          modules:
            - WMS 集成网关（Manhattan、SAP EWM、Blue Yonder）
            - 全渠道订单管理与补货 API
          outputs:
            - 经校验的订单流
            - 同步库存快照
        - label: 网络优化与 Commerce One 层
          detail: 跨园区智能层，负责协调多网点网络间的库存流与产能。
          modules:
            - gNetwork 动态商业路由器
            - 跨节点库存分配服务
          outputs:
            - 全局库存可视性
            - 跨园区调拨计划表
        - label: 零售店内感知与智能层
          detail: 门店级数字孪生平台，管理实时 RFID 追踪与自动化补货。
          modules:
            - gStore 云库存与 RFID 引擎
            - 店内商品定位服务
          outputs:
            - 98%–99% 的门店内库存准确率
            - 卖场自动化补货任务
        - label: GreyMatter 核心调度层
          detail: 算法执行引擎，负责实时多智能体优化与机器人任务排程。
          modules:
            - 算法路径规划引擎（Java/C++）
            - 低延迟排队与高并发调度器
          outputs:
            - 每分钟 1M+ 次动态优化
            - 无碰撞 AMR 行驶轨迹
        - label: 仿真与质量保障层
          detail: 虚拟评估与自动化测试流水线，用于验证车队运营与软件发布版本。
          modules:
            - Python 自动化测试框架（Page Object Model）
            - 虚拟仿真与物理建模引擎
          outputs:
            - 自动化回归测试报告
            - 部署前车队验证遥测数据
        - label: 物理执行与边缘层
          detail: 本地部署的边缘设备、传感器阵列、人工拣选工作站与异构机器人车队。
          modules:
            - 自研 Ranger AMR 驱动单元
            - 第三方机器人智能体与固定式物料搬运设备（MHE）
            - 固定式与手持式 RFID 传感器
            - 人机拣选终端
          outputs:
            - 物理托盘 / 料箱搬运
            - 连续边缘遥测数据
    approximationNotes: 架构层级系综合工程技术规范、招聘披露信息及公开发布的平台说明梳理而成。
    claimRefs:
