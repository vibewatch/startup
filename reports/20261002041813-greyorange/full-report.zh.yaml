      - number: '1.3'
        title: 融资历程、资方话语权与估值锚点缺失
        blocks:
          - type: paragraph
            body: >-
              已披露融资记录证实了数次资本动作，但无法反映当期精确资金状况。TechCrunch 报道显示，公司于 2018 年完成 $140 million 的 C 轮融资，使当时累计融资金额达到 $170
              million；随后于 2022 年 5 月完成 $110 million 的股债混合成长轮融资 [CO008, CO009]。2023 年 12 月媒体报道确认其完成由 Anthelion Capital
              领投的 $135 million 的 D 轮首期交割 [CO010]。目前两家数据机构显示其经 9 轮累计融资约 $545 million，而 FundedIQ 仅收录该笔 $110 million
              融资；上述冲突主要源于统计口径差异，导致各数据库总额均无法视作审计后口径 [CO011, CO012]。指定证据库中唯一的估值数据为 The Company Check 记录的 2020 年 9 月历史估值
              $700 million，并非当期估值 [CO013]。已融资金不等于账面可用现金，且并无公开信源披露现有负债规模、老股转让、月度消耗及现金跑道（runway）。
