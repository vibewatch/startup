      - number: '2.3'
        title: 买方画像、采购经济模型与落地阻力
        blocks:
          - type: paragraph
            body: >
              企业级履约自动化的采购需求高度集中于大型零售商、DTC 服装品牌及第三方物流（3PL）服务商，此类客户多拥有单仓 50,000 平方英尺以上的分销网络，且履约预算超过 $10 million
              (CM013)。采购决策委员会通常由首席供应链官、供应链运营副总裁或首席运营官主导，一线仓储运营经理则充当核心评估人，重点考量系统能否杜绝吞吐量瓶颈与停机事故 (CM014)。GreyOrange
              管理层公开披露显示，大客户宣贯与认知培育占整体 GTM 沟通时长的 60% 以上，主因企业采购方需反复权衡业务中断风险与维系人工现状的显性成本
              (CM015)。资本开支节奏直接影响落地速度：尽管大型企业会在新建绿地（greenfield）仓中直接部署机器人，但约 50%
              的落地场景发生在既有存量棕地（brownfield）仓中，工程团队必须在旧厂房物理约束下改造加装自动化系统 (CM016)。为平抑数百万美元级资本支出门槛，自动化服务商日益推行机器人即服务（RaaS）模式，提供
              1 年期运营协议，方便客户在敲定 10 年期重资产投入前启动轻量化试点项目 (CM016)。
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
