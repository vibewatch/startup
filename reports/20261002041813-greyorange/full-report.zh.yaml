        title: 收入结构与定价机制
        blocks:
          - type: paragraph
            body: >-
              GreyOrange 依托涵盖物理机器人交付、软件编排调度及全生命周期运维的多层架构实现商业化变现。其核心软件平台 GreyMatter
              提供独立于硬件厂商的仓储执行编排，依托实时算法调度统筹多智能体机器人机队与人工操作。在零售门店场景，GreyOrange 借助 gStore 应用套件实现持续的 RFID
              库存扫描、自动补货工作流与全渠道门店履约变现。实体机器人硬件——涵盖货到人
              AMR、辅助拣选设备及分拣输送线——采用混合采购架构交付，包含传统设备买断（CapEx）、机器人即服务（RaaS）订阅租赁，以及强制绑定的多年期运维与软件授权协议。鉴于 GreyOrange
              从未公开标准刊例价目表，商业订单规模均依大客户个案磋商，综合考量仓储面积、自主移动机器人实际投放台数、设计吞吐量及选购软件功能模块层级。公开报价、实际合同成交价及条款折扣明细均严格保密，机构尽调须针对具体客户合同开展专项核查。
