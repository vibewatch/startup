    title: 公司概况
    sections:
      - number: '1.1'
        title: 企业定位、业务版图与商业模式
        blocks:
          - type: paragraph
            body: >-
              GreyOrange 将自身定位为实体商业的操作层系统：其软件负责协同仓储、门店及供应链各环节的人员、机器人与其他软硬件系统，而非单纯充当机器人硬件制造商 [CO004]。FundedIQ
              记录其核心业务覆盖美国、新加坡、德国、日本与印度 [CO005]。现有数据资料将其总部列于佐治亚州 Roswell，TechCrunch 则统称为亚特兰大地界
              [CO003]。公司创立时间线尚缺乏单一确证节点：The Company Check 显示创始人于 2012 年设立 GreyOrange，但 TechCrunch 称该业务于 2015 年在印度成立
              [CO001, CO002]。因此在核实法人注册底稿与创始人书面文件前，不宜将任一时间判定为确切成立日期。
