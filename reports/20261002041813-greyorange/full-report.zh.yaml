  - id: TV003
    title: 乐观、基准与悲观情景框架
    columns:
      - 情景
      - 假设条件
      - 估值或回报逻辑
      - 概率信号
      - 下行触发条件
    rows:
      - - 乐观情景
        - 经常性软件增长、留存率和利润率获得独立验证
        - 仅在获得经核实的收入与入场价格后进行对标
        - 未赋予概率
        - 规模无法转化为持久的软件经济效益
      - - 基准情景
        - 部署规模属实，但财务指标与资本结构仍未公开
        - 价格尚未明晰；保持持续跟踪
        - 当前证据最符合该情景
        - 在信息披露改善之前仍需外部融资
      - - 悲观情景
        - 债务或优先股清算包袱与估值倍数压缩相互叠加
        - 拒绝缺乏依据的入场估值以保护资本安全
        - 矛盾的融资信息与停滞的 IPO 迹象构成警示信号
        - 下跌轮（Down Round）融资、契约压力或流动性短缺
    notes: 此类情景属于条件化投资审定用例，而非预测；在缺乏当前财务与价格输入数据的情况下，不估算任何估值区间、回报目标或概率。
    claimRefs:
