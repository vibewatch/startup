  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、支出归类与既有方案替代关系
        blocks:
          - type: paragraph
            body: >
              仓储与零售履约自动化市场涵盖三个紧密交织的层级：物理搬运自动化（自主移动机器人 AMR、自动化存取系统 ASRS 及分拣系统）、执行与编排软件，以及门店端实时库存感知
              (CM001)。可触达支出由投向仓储机器人、机队管理、仓储执行系统（WES）和全渠道库存追踪的企业级资本支出及 SaaS 订阅构成
              (CM002)。传统企业资源规划（ERP）授权许可、常规干线运输管理、长途车队远程监控，以及未自动化的普通叉车等传统物料搬运设备均排除在该核心边界之外，除非内部物流改造需对接机器人牵引车
              (CM003)。企业级供应链运营商现存的主流替代方案，仍是结合传统仓储管理系统（WMS）与刚性固定输送机基础设施的人工分拣
              (CM004)。然而仓储人员长期高流动率，叠加大促旺季对当日达或次日达履约时效的严苛要求，使纯人工模式在峰值订单冲击下尽显脆弱 (CM005)。GreyOrange 将 GreyMatter
              软件定位为独立于硬件的自动化编排平台，旨在统筹调度多厂商异构机器人机队与人工工作流，主打不愿弃用既有输送机资产但亟需改造存量棕地（brownfield）配送中心的企业客户 (CM006)。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM006
      - number: '2.2'
        title: 市场规模测算多重视角、复合增速与行业采纳曲线
        blocks:
          - type: paragraph
            body: >
              评估履约自动化的潜在市场规模（TAM），须综合考量全球机器人、仓储执行软件与物流自动化等多个互补视角，不可单一数据概全 (CM007)。根据 Inc42 整合的行业监测数据，广义全球 AI 赋能机器人市场预计将从
              2021 年的 $6.9 billion 扩张至 2026 年的 $35.3 billion，年复合增长率达 38.6% (CM008)。在仓储设施内部执行领域，Gartner 发布的 2023
              年供应链执行技术成熟度曲线（Hype Cycle）预测，到 2027 年将有超过 75% 的大型企业在其仓储运营中引入某种形式的信息物理融合自动化 (CM009)。Gartner
              强调，随着企业在离散履约环节扩大机器人部署规模，多数运营商势必面临管理多硬件厂商异构机队的局面，标准化多智能体编排软件将成为运营刚需 (CM010)。GreyOrange 内部披露显示，其 GreyMatter
              平台在遍布全球的 3,000 多个客户站点调度 100,000 至 130,000 个在行物理智能体，每分钟运算优化逾 100 万次
              (CM011)。尽管大盘预测增速迅猛，但因非上市公司数据不透明，独立核算中立软件编排层的可服务可获取市场（SOM）时，依然难以将其与底层 AMR 硬件采购合同完全拆分剥离 (CM012)。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
              - CM012
