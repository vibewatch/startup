            body: >-
              GreyOrange 依托机构股权融资与债权信贷工具的组合支持其全球扩张及持续的技术研发，历次多轮融资累计吸纳资本介于 $436.8M 至 $545M 之间。2022 年 5 月，公司完成 $110M
              规模的成长轮融资，包括由 Mithril Capital Management 领投的股权，以及由 BlackRock 操盘的独立债权融资，旨在支撑国际化拓展并扩充约 300 个技术与销售岗位。2023 年 12
              月，GreyOrange 完成 $135M 的 D 轮融资，由 Anthelion Capital 领投，Mithril Capital 与 Blume Ventures
              跟投，用以加速其系统在跨国仓储与零售门店网络的落地。2021 年底公司曾筹备赴美首次公开募股（IPO），拟以 $1.5B 至 $1.7B 的预期估值募资 $500M 至
              $600M，但随资本市场大环境剧变，上市计划搁浅。尽管 EquityZen 等二级市场平台促成了员工与早期股东的零星股权转让，但公司账面绝对现金存量、月度净消耗率（burn
              rate）及信贷契约条款（covenants）仍处严密保密状态；若经营活动现金流未能持续实现盈亏平衡，将面临沉重的外部融资依赖风险。
