      - CU010
      - CU012
  - id: FR001
    title: 风险严重度与发生概率评估矩阵
    type: matrix
    summary: 依据发生概率与影响严重程度对识别出的合规、运营、合作伙伴及财务风险进行可视化映射。
    data:
      columns:
        - 极罕见 / 发生概率极低
        - 发生概率较低
        - 发生概率中等
        - 发生概率较高
        - 发生概率极高 / 持续存在
        - 几乎必然发生
      rows:
        - label: 灾难性影响
          values:
            - 核心知识产权无效或遭遇全球禁令
            - 多园区自动化机械重大致死事故
            - IPO 持续搁浅与突发债务加速到期相互叠加
            - 黑色星期五期间全球云端与边缘调度系统全面崩溃
            - 针对所有中国合作厂商 AMR 底盘的全面出口禁运
            - 前三大 3PL 集成合作伙伴同时破产
        - label: 严重影响
          values:
            - 单租户区域边缘控制器服务器故障
            - 业务旺季调度软件延迟激增导致拣选作业停摆
            - 北美各网点发生重大合作伙伴硬件安全召回
            - 一级市场流动性持续冻结被迫进行下跌轮融资
            - 主要区域履约中心的核心客户合同被终止
            - 季节性仓储负荷攀升期间企业级零售 ERP 集成失败
        - label: 较高影响
          values:
            - 定向勒索软件入侵导致仓库局域网子网被隔离
            - 企业边缘计算与 IoT 传感器通信延迟
            - 异构 AMR 固件漂移导致路径规划碰撞
            - 替换零部件的硬件制造供应链中断
            - 企业客户从试点到正式生产落地的周期拉长
            - 一线零售买方就多厂商责任划分条款产生采购摩擦
        - label: 中度影响
          values:
            - 机器人零部件面临小幅跨境关税调整
            - 多司法管辖区税务申报与转移定价审查
            - 本地仓库一线员工抵制或再培训延迟
            - 高峰交接班期间边缘遥测数据临时丢包
            - 偏远市场分包技术人员可用性瓶颈
            - 第三方电池性能衰减及充电桩调度漂移
        - label: 轻微影响
          values:
            - 服装零售门店内局部 RFID 标签读取误差
            - GreyMatter 运营主管仪表盘出现轻微 UI 渲染延迟
            - 可由日常维护纠正的非关键传感器校准漂移
            - 辅助扫描枪支架或安装夹具交付延期
            - GreyMatter Foundry 沙盒中瞬态仿真参数不匹配
            - 各区域操作员培训手册存在细微文档差异
        - label: 可忽略影响
          values:
            - AMR 外部防撞保险杠面板的表面轻微划痕
            - 历史报告归档的非关键性遥测日志记录延迟
            - 常规计划维护窗口超时不足 15 分钟
            - 管理控制台停用旧版浏览器版本
            - 低业务量周末班次期间的预发布环境沙箱重置
            - 本地化手持终端屏幕上的轻微字体渲染差异
    approximationNotes: 风险定位属于定性分析归类，基于企业级机器人尽调及公司已披露的运营历史划分。
    claimRefs:
      - CR005
      - CR006
      - CR009
      - CR011
  - id: FV001
    title: 建议推导逻辑
    type: flow
    summary: 公开证据支持阶段性门禁尽调流程，而非量化估值。
    data:
      nodes:
        - id: scale
          label: 规模信号
          detail: 公司口径 100,000+ 台实体智能体
        - id: financing
          label: 融资支撑
          detail: 据报道完成 $135M Series D 首期交割
