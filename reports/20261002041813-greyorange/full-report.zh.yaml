      - number: '3.3'
        title: 生态准入、护城河持续性与潜在替换风险
        blocks:
          - type: paragraph
            body: >-
              尽管 GreyOrange 赢得了多项标杆性大客户订单——包括承建 Walmart Canada 位于阿尔伯塔省投资 $118 million
              的履约中心，以及在国际全渠道零售商中铺开系统——但其长期护城河仍面临结构性市场压力的侵蚀。中国及跨国 AMR 制造商掀起的硬件同质化价格战持续压缩专有机器人的硬件销售利润率，倒逼 GreyOrange
              战略转型，全面押注硬件中立的软件编排层及认证合作伙伴集成。然而，Dematic 与 Vanderlande
              等老牌竞争对手积累了数十年的系统集成关系、覆盖全球的现场驻地运维网络，并具备足以垫资承揽巨型自动化枢纽的雄厚资产负债表。此外，公司此前筹集 $500 million 至 $600 million
              的公开上市计划未能如期成行，迫使其于 2022 年补充 $110 million 增长期融资，并于 2023 年底推进 $135 million 的 D
              轮融资。此类多轮后续融资突显出面对重资本地位稳固的工业巨头时，在全球范围内扩展实体物理 AI 业务所需的高昂资本开支。
