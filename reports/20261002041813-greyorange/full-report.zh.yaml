              - CV014
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV009
              - CV014
              - CV015
              - CV016
      - number: '8.2'
        title: 融资背景与资本结构悬顶隐患
        blocks:
          - type: paragraph
            body: >-
              公开信源一致证实 GreyOrange 于 2023 年 12 月完成了 $135 million 的 D 轮首期交割，但对其累计融资总额的历史口径莫衷一是。Multiples 记录其 5 轮累计融资 $423
              million，而 Tracxn 则记录 9 轮累计融资 $545 million；上述差额规模显著，或源自对债权、过桥轮次及未公开交易的统计口径差异。2022 年 $110 million
              的成长轮融资本身即融合了股权与债务，再次印证已融资金额既不可等同于股权价值，亦不能视作可用现金。在缺乏股权结构表（cap
              table）、债务到期明细、清算优先权设定及账面可用流动性数据的情况下，股权稀释比例与优先权悬顶（preference overhang）风险根本无法量化。因此，任何投资意向书（term
              sheet）的拟定均须以完全对账核准的内部融资底账为前提，切忌盲目锚定第三方平台的统计总额。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV005
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV009
              - CV010
      - number: '8.3'
        title: 情景假设与可比公司估值框架
        blocks:
          - type: paragraph
            body: >-
              现有证据由于既未披露 GreyOrange 的当前估值，亦未提供当期营收分母，无法推导常规的市销率（P/S）倍数估值。现有可比公司列表仅能充当边界基准校验：Multiples 将 Exotec 标为 20.0x
              市销率，而 EquipmentShare 仅为 1.7x，如此悬殊的估值倍数极差难以直接跨越不同的业务结构、毛利率、增长率及资本密集度展开机械比照。乐观情景（bull
              case）须以独立经审计的经常性软件经济模型和稳固的客户留存为支撑；基准情景（base case）认可其落地部署规模，但不预设估值价格；悲观情景（bear
              case）则预示其在商业模型尚未证伪或证实前便面临巨额融资稀释或估值倍数大幅压缩。鉴于缺乏原始输入数据，本报告不对具体估值区间或情景概率作人为虚构设定。
            claimRefs:
              - CV003
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 退出成熟度、尽调核心问询项与核心逻辑证伪触发条件
        blocks:
          - type: paragraph
            body: >-
              最确切的公开退出信号属于历史节点而非当前状况。Inc42 曾报道 GreyOrange 探讨过赴美上市方案，原计划以 $1.5 billion 至 $1.7 billion 的估值募集 $500 million
              至 $600 million 资金；而 TechCrunch 于 2022 年 5 月证实该上市规划未能付诸实施。上述记录表明公司目前并不具备现成 IPO
              成熟度。敲定投资决策前，尽调必须索取经审计的分部营收与分部毛利率、经常性收入留存率、储备订单转化率、净现金与月度消耗、债务偿付契约条款、清算优先权细则，以及经董事会批准的最新融资方案。投资逻辑证伪的触发条件包括：披露透明度未获改善前提下出现下调估值的流血轮融资（down
              round）、爆发债务违约或流动性枯竭危机，抑或所宣传的部署规模遭证伪且无法转化为可持续的软件盈利模型。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 图表与附注
        blocks:
          - type: callout
            title: 严守价格纪律是投资决策前置关卡
            body: 切勿将已融资金额、企业单方宣称的落地规模或历史上市估值报道误当作当期企业价值。在核算投资回报前，必须获取确切的当期价格与经核实的财务分母数据。
            calloutType: recommendation
            claimRefs:
              - CV007
              - CV008
              - CV014
              - CV015
          - type: callout
            title: 累计融资金额不等于账面可用现金
            body: 公开报道的累计融资总额存在口径冲突，且 2022 年融资混合了股权与债权。在评估现金跑道或股权稀释前，必须逐一核准各轮融资工具属性、实收资金、实际账户余额及优先清偿权序列。
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV016
