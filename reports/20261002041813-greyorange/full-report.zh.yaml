      - number: '1.2'
        title: 管理层架构、公司治理与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              现有证据显示公司经历了一次由联合创始人接任的 CEO 交接，但未明确 2026 年当期高管名册。TechCrunch 曾确认联合创始人 Samay Kohli 于 2022 年 5 月担任 CEO，而 2023
              年 12 月的公司公告报道则将联合创始人 Akash Gupta 列为 CEO [CO006,
              CO007]。该时间线印证了领导层更替，但本次指定核查的现行官方页面均未提供带日期的管理层名单。现有公开证据库亦未披露董事会席位构成、投票控制权分配、创始人持股比例、高管继任计划及两位创始人之间的权责划分。上述信息缺失构成了关键人与公司治理风险：投资机构应直接核验现行审批权限与监管架构，不宜推定
              2023 年披露的职务沿用至今。
