              GreyOrange 2026 年官网主页声称拥有逾 100,000 个在行物理智能体和逾 3,000 个全球活跃站点，但此类指标属公司自述的部署数据，而非经审计的客户数或营收凭据
              [CO015]。另一独立档案显示截至 2025 年 5 月 21 日员工数为 553 人，与 FundedIQ 划定的 501-1,000 人员工区间相吻合；两者均无法确证 2026 年当期员工规模
