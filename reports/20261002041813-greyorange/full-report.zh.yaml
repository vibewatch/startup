  - number: 5
    title: 产品与核心技术
    sections:
      - number: '5.1'
        title: 产品矩阵界定与客户业务流整合
        blocks:
          - type: paragraph
            body: >-
              GreyOrange 将其商用方案统揽于 Commerce One 品牌之下，定位为串联仓储履约、零售门店与更广域供应链执行的一体化操作底座。其核心引擎为 GreyMatter
              仓储机器人编排系统，宣称具备中立适配多厂商的调度柔性，协同人工作业、机器人机队与物料搬运设备。GreyOrange 披露称，GreyMatter 在在行配送中心每分钟执行逾 100
              万次动态优化，宣称可实现仓储生产率 2x 至 4x 提升，并将单件履约成本降低至多 45%。针对零售门店环境，GreyOrange 推出 gStore 方案，利用顶部悬挂及手持 RFID 感知提供精度达 98%
              至 99%、定位偏差在 3 至 5 英尺的高精度库存追踪，驱动货架自动补货与全渠道订单分拣预配。放到更广的企业网络里，gNetwork 提供跨仓库存可视化与智能路由调度。然而，尽管 GreyOrange 宣传拥有
              100,000+ 物理智能体与 3,000+ 全球活跃站点，公开资料却未独立拆分现行 SaaS 活跃实例与历史硬件出货量，实际生产环境下的真实工作流仍有待入场实地验证。
