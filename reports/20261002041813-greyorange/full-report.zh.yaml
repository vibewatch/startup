        - 保留证据中缺乏当前估值或收入分母
        - 不予设定精确估值区间
      - - 决策门槛
        - 有条件通过
        - 核实经济指标、股权结构表（Cap Table）、债务及入场价格
        - 仅在尽调弥合实质性缺口后再行评估
    notes: 各项评估均属于分析师研判，非交易条款；估值与回报为空值反映了公开输入数据的缺失，而非零值。
