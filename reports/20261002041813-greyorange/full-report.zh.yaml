      - number: '2.4'
        title: 图表与附注
        blocks:
          - type: callout
            title: 跨硬件中立编排构筑新兴竞争制高点
            body: >
              随着企业级仓储广泛引入不同硬件厂商的多元自动化设备，战略制高点正由单一机器人硬件本体转向多智能体软件编排。Gartner 预测至 2027 年逾 75%
              的企业将引入信息物理融合自动化系统，其中多数须管理异构机队。类似 GreyMatter 这种将机队调度与专有机器人硬件解耦的软件平台，既能为买方化解存量棕地改造风险，亦有望切入高毛利的软件预算空间。
            calloutType: insight
            claimRefs:
              - CM006
              - CM009
              - CM010
              - CM011
          - type: callout
            title: 高资本开支属性与漫长客户培育周期
            body: >
              企业级履约自动化订单资金门槛极高，单个仓储设施的投资额普遍在 $2 million 至 $8 million 之间，交付周期长达 12 至 24 个月。GreyOrange
              商业化负责人指出，大客户培训与认知培育占据 60%
              以上的商务沟通时间，采购方需审慎权衡业务中断风险与维持现状的惯性。尽管灵活的机器人即服务（RaaS）模式降低了初期门槛，但机队规模扩张所伴随的高资本消耗仍是制约市场渗透的核心瓶颈。
            calloutType: risk
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争态势与结构性分层
        blocks:
          - type: paragraph
            body: >-
              履约自动化与机器人行业涵盖鲜明的细分技术范式，自传统固定式自动化立体库（ASRS），延展至柔性自主移动机器人（AMR）及门店级库存平台。在这一生态体系中，GreyOrange
              主要定位于多智能体履约编排服务商，统筹调度异构物理机器人机队与仓储作业人员。在货到人自主搬运工作流中，其直接竞品既包括 Geek+、Locus Robotics 及 Mobile Industrial
              Robots 等专业 AMR 厂商，亦涵盖 Dematic、Vanderlande、Swisslog 等提供端到端固定式自动化工程方案的传统物料搬运巨头。在零售门店场景，GreyOrange 的 gStore
              方案与各类 RFID 和计算机视觉库存技术商竞逐，同时直接联手 Zebra Technologies 等硬件龙头以打通感知与执行链路。此外，大型零售巨头多建有自研工程团队或专有自动化项目，例如 Amazon
              的内部机器人系统以及 Walmart 的多元化供应链技术战略合作网络。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
