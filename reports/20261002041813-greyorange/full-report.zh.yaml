          description: 客户在单个配送中心部署 10–15 台 AMR 试用 GreyMatter 进行“货到人”拣选。
          role: Land Phase
        - label: 园区扩容与车队规模化
          description: 客户将单点机器人车队规模扩展至 50–80+ 台，替代传统物料搬运设备。
          role: Expand Phase
        - label: 多园区网络部署
          description: GreyMatter 推广部署至各区域配送中心，统一多品牌间的履约规则。
