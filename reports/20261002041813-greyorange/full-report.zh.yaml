        title: 销售拓展路径与单位经济模型推演
        blocks:
          - type: paragraph
            body: >-
              GreyOrange 的商务拓展（GTM）主攻企业级供应链运营商、财富 500 强全渠道零售巨头及第三方物流服务商，代表性客户涵盖 Walmart Canada、Sodimac
              及国际连锁零售品牌。高吞吐量仓储自动化领域的大客户销售周期结构性偏长，受厂区布局仿真建模、网络工程集成联调、跨部门采购委员会审批及驻地概念验证（PoC）影响，通常长达 9 至 18 个月。尽管
              GreyOrange 在过往经营通报中声称存量客户合同营收毛留存率逾 170%，但获客成本（CAC）、CAC
              回本周期及软件净收入留存率（NRR）等完整单位经济模型数据均未披露。物理机器人部署涉及高昂的早期现场工程施工与系统集成支出，导致初次交付阶段毛利率受压；而在站点吞吐步入稳态后，源自 GreyMatter 与
              gStore 的经常性软件收入毛利率则明显更高。要准确判断经营杠杆，关键是核实实体系统部署与 SaaS 编排之间的毛利率差距。
