      - - Multi-Agent Warehouse Orchestration
        - Vendor-agnostic fleet orchestration software, multi-agent AI execution, WES integration licenses
        - General corporate ERP licenses, cloud database hosting, off-site supply chain network planning
        - Chief Supply Chain Officer / VP Logistics Technology
        - High; core software moat decoupling fleet intelligence from proprietary robotic hardware
      - - Autonomous Mobile Robots (AMR)
        - Goods-to-person mobile robots, rack-moving AMRs, assisted picking cobots, autonomous pallet tuggers
        - Unautomated manual forklifts, fixed overhead monorails, manual push carts, road delivery vehicles
        - VP Warehouse Operations / Director of Engineering
        - High; primary physical fulfillment automation asset replacing manual travel time
      - - Fixed Automation and Sortation
        - High-velocity automated sortation conveyors, cross-belt sorters, automated storage and retrieval (ASRS)
        - Architectural building construction, physical real estate land acquisition, structural racking steel
        - VP Supply Chain Infrastructure / Facilities Director
        - Moderate; high-throughput capital assets integrated into orchestration workflows
      - - In-Store RFID and Sensing
        - Retail sales floor RFID readers, real-time item tracking software, automated restocking sensor feeds
        - Point-of-sale cash registers, store payment terminals, general retail security surveillance cameras
        - VP Omnichannel Retail / Head of Store Operations
        - Growing; connects warehouse fulfillment accuracy with store-level inventory availability
