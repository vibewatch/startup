company:
  name: GreyOrange
chapter:
  number: 8
  title: Valuation
  summary: >-
    GreyOrange presents evidence of operating scale and continued investor support, but the
    retained public record does not disclose a current valuation or the financial outputs needed
    to calculate an entry multiple. Conflicting cumulative-funding totals, mixed equity and debt,
    and stale IPO reporting support a research-more/track recommendation rather than a priced
    investment call.
sections:
  - id: investment-view
    title: Investment view and decision posture
    body: >-
      The investable case rests on a potentially valuable orchestration layer rather than on a
      verified financial profile. GreyOrange says its network includes more than 100,000 physical
      agents, more than 3,000 active global sites, and over $1 billion of monthly inventory flows.
      Those figures indicate meaningful deployment breadth if validated, but they remain
      company-issued operating claims and do not reveal revenue, margin, retention, or cash
      generation. The retained evidence also does not disclose a current valuation. Consequently,
      company quality cannot be translated into price attractiveness. The appropriate posture is
      research-more/track with medium-low confidence and high underwriting risk, not buy: the call
      can improve only after current economics, capitalization, and an actual entry price are
      verified.
    claimRefs: [CV009, CV010, CV011, CV014, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-and-overhang
    title: Financing context and overhang
    body: >-
      Public sources agree that GreyOrange completed a $135 million Series D first close in
      December 2023, but they do not produce a consistent cumulative-funding history. Multiples
      reports $423 million across five rounds, while Tracxn reports $545 million across nine
      rounds; the difference is material and may reflect treatment of debt, extensions, or
      undisclosed transactions. The 2022 $110 million growth financing itself combined equity and
      debt, showing why funding raised must not be treated as either equity value or cash
      available. Without the cap table, debt schedule, liquidation preferences, or remaining
      liquidity, dilution and preference overhang cannot be quantified. Any term sheet should
      therefore be conditional on a fully reconciled financing ledger rather than anchored to an
      aggregator total.
    claimRefs: [CV001, CV002, CV004, CV005, CV016]
    tableRefs: [TV002]
  - id: scenario-and-comparable-frame
    title: Scenario and comparable frame
    body: >-
      A conventional revenue-multiple valuation is not supportable from the assigned evidence
      because neither GreyOrange's current valuation nor a current revenue denominator is
      disclosed. The available comparable table is useful only as a boundary check: Multiples
      lists Exotec at a 20.0x revenue multiple and EquipmentShare at 1.7x, a spread too wide to
      transfer directly across different business mixes, margins, growth rates, and capital
      intensity. The bull case requires independently verified recurring software economics and
      durable customer retention; the base case assumes deployment scale but leaves price
      unformed; the bear case is financing-led dilution or multiple compression before economics
      are proven. No precise valuation range or scenario probability is assigned because doing so
      would manufacture inputs absent from the evidence.
    claimRefs: [CV003, CV012, CV013, CV014, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-diligence
    title: Exit readiness, diligence asks, and thesis breaks
    body: >-
      The most concrete public exit signal is historical rather than current. Inc42 reported that
      GreyOrange had evaluated a U.S. listing intended to raise $500 million to $600 million at a
      possible $1.5 billion to $1.7 billion valuation, while TechCrunch reported in May 2022 that
      the listing had not materialized. That record does not establish present IPO readiness.
      Before investment, diligence should obtain audited segment revenue and gross margin,
      recurring-revenue retention, backlog conversion, cash and burn, debt covenants, preference
      terms, and a current board-approved financing plan. Thesis-break triggers are a down round
      without improved disclosure, covenant or liquidity pressure, or verified deployment scale
      that fails to convert into durable software economics.
    claimRefs: [CV006, CV007, CV008, CV014, CV015, CV016]
