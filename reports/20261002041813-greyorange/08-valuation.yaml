  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation-method
      missingEvidence: Current revenue, ARR, growth, gross margin, retention, cash burn, runway, and an actionable entry price.
      whyItMatters: These inputs determine whether operating scale can support an investable valuation and target return.
      diligencePath: Obtain audited financial statements, cohort and retention schedules, current management accounts, and proposed financing terms.
      relatedQuestionRefs: [QV003, QV006, QV009]
      relatedTableRefs: [TV001, TV003]
    - type: conflicting-data
      severity: material
      topic: cumulative-funding
      missingEvidence: A primary round-by-round capitalization ledger separating equity, debt, extensions, and cancelled or undisclosed transactions.
      whyItMatters: Conflicting cumulative totals prevent reliable dilution, debt, and proceeds analysis.
      diligencePath: Reconcile board records, stock ledgers, debt agreements, bank receipts, and investor closing documents.
      relatedQuestionRefs: [QV001, QV002, QV005]
      relatedTableRefs: [TV002]
    - type: stale
      severity: material
      topic: exit-readiness
      missingEvidence: Current board-approved IPO or strategic-exit plan, banker engagement, readiness workstream, and timing.
      whyItMatters: The latest retained IPO-status reporting is from 2022 and cannot establish 2026 exit readiness.
      diligencePath: Request current board materials, banker mandates, audited reporting-readiness assessment, and strategic buyer discussions.
      relatedQuestionRefs: [QV008]
    - type: missing-source
      severity: material
      topic: financing-overhang
      missingEvidence: Fully diluted ownership, liquidation preferences, anti-dilution rights, debt balances, covenants, and maturities.
      whyItMatters: These terms determine effective entry ownership, downside protection, dilution, and liquidity risk.
      diligencePath: Review the current cap table, charter, investor rights agreements, debt schedule, and covenant compliance certificates.
      relatedQuestionRefs: [QV002, QV005, QV009]
      relatedTableRefs: [TV001, TV002, TV003]
