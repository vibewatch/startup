      - [Confidence, "Medium-low", "Multiple independent financing reports exist, but key totals conflict", "Require primary financing and financial records"]
      - [Risk rating, High, "Mixed capital structure and unquantified preference overhang", "Underwrite dilution and debt before entry"]
      - [Valuation stance, "Insufficient evidence", "No current valuation or revenue denominator in the retained evidence", "Do not assign a precise range"]
      - [Decision threshold, Conditional, "Verify economics, cap table, debt, and entry price", "Reassess only after diligence closes the material gaps"]
    notes: "Assessments are analyst judgments, not transaction terms; null valuation and return outputs reflect missing public inputs rather than zero values."
    claimRefs: [CV003, CV009, CV010, CV011, CV014, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Lens, Evidence, What would change the view]
    rows:
      - ["Thesis: operating scale", "Company reports 100,000+ physical agents and 3,000+ active global sites", "Independent deployment and utilization verification"]
      - ["Thesis: investor support", "$135M Series D first close was reported for December 2023", "Current capitalization and use-of-proceeds reconciliation"]
      - ["Anti-thesis: financing opacity", "Cumulative funding is reported as both $423M and $545M", "Primary round-by-round ledger separating debt and equity"]
      - ["Anti-thesis: exit uncertainty", "A previously discussed U.S. IPO had not materialized by May 2022", "Current board-approved exit plan and readiness evidence"]
    notes: "Funding totals use each publisher's stated methodology and are not reconciled; company operating metrics are unaudited claims."
    claimRefs: [CV001, CV002, CV004, CV006, CV009, CV010]
  - id: TV003
    title: Bull, base, and bear scenario framework
    columns: [Case, Assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Independent validation of recurring software growth, retention, and margins", "Benchmark only after verified revenue and entry price are available", "No probability assigned", "Scale does not translate into durable software economics"]
      - [Base, "Deployment scale is real, but economics and capitalization remain private", "Price remains unformed; continue tracking", "Current evidence best fits this case", "Financing required before disclosure improves"]
      - [Bear, "Debt or preference overhang combines with multiple compression", "Protect capital by declining an unsupported entry price", "Mixed financing and stale IPO evidence are caution signals", "Down round, covenant pressure, or liquidity shortfall"]
    notes: "These are conditional underwriting cases, not forecasts; no valuation range, return target, or probability is estimated without current financial and price inputs."
    claimRefs: [CV003, CV005, CV006, CV012, CV013, CV014, CV015, CV016]
