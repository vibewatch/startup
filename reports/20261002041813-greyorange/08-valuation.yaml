callouts:
  - calloutType: recommendation
    title: Price discipline is the gating issue
    body: >-
      Do not convert funding raised, company-claimed deployment scale, or a historical IPO
      valuation report into a current enterprise value. Require a current price and verified
      financial denominator before underwriting returns.
    claimRefs: [CV007, CV008, CV014, CV015]
  - calloutType: risk
    title: Financing totals are not cash availability
    body: >-
      The reported cumulative totals conflict, and the 2022 financing included both equity and
      debt. Reconcile instruments, proceeds, balances, and preferences before assessing runway or
      dilution.
    claimRefs: [CV001, CV002, CV005, CV016]
