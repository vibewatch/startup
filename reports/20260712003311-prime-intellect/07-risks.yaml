- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Security / privacy failure
    - Confirmed breach or material customer-trust incident
    - One severe incident without credible response
    - Pause or downgrade underwriting
  - - Supply / export disruption
    - Loss of key model access or hardware path
    - Multi-quarter product impairment
    - Re-test product resilience and gross-margin path
  - - Customer-quality weakness
    - Top-customer churn or concentration shock
    - Loss of flagship proof or weak renewal data
    - Reassess growth durability thesis
  - - Control-maturity stall
    - No major improvement in trust evidence after Series A
    - Still no audit / reliability depth in next diligence cycle
    - Apply valuation and confidence discount
  notes: These kill criteria are intended to be monitored, not merely listed; each has a clear transmission path into the investment thesis.
