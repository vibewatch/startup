  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability
    missingEvidence: Uptime history, incident logs, latency targets, and support SLAs by deployment mode.
    whyItMatters: These determine whether the platform can support enterprise production workloads rather than just technical pilots.
    diligencePath: Request status history, SLO/SLA documents, and incident postmortems.
    relatedQuestionRefs:
    - QE009
    - QE010
    - QE020
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: compliance
    missingEvidence: Certifications, audits, DPA terms, and enterprise-control mappings beyond marketing-level security pages.
    whyItMatters: Trust depth is one of the main constraints on selling to regulated or conservative enterprises.
    diligencePath: Request SOC / ISO evidence, DPAs, and customer security-review packages.
    relatedQuestionRefs:
    - QE021
    - QE022
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: minor
    topic: adoption-depth
    missingEvidence: Repository contributor depth, usage telemetry, and customer adoption by module.
    whyItMatters: These would show whether the open surfaces are strategic adoption channels or mostly supporting assets.
    diligencePath: Request repo analytics and module-level adoption data.
    relatedQuestionRefs:
    - QE013
    - QE014
    relatedTableRefs:
    - TE001
  - type: private-evidence-only
    severity: material
    topic: dependency-risk
    missingEvidence: Supplier concentration, GPU sourcing, and partner dependency terms.
    whyItMatters: The platform depends on external infrastructure and environments that can affect margin and reliability.
    diligencePath: Request supplier mix, fallback plans, and key integration dependency reviews.
