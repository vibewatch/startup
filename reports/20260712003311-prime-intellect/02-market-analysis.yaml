  evidenceGaps:
  - type: missing-source
    severity: material
    topic: independent-sam
    missingEvidence: An independent analyst source that isolates the post-training and owned-agent infrastructure niche instead of broad AI or inference TAM.
    whyItMatters: Without that, SAM and penetration math remain heuristic rather than measured.
    diligencePath: Request or commission a segment-specific market map from an infrastructure-focused analyst.
    relatedQuestionRefs:
    - QM007
    - QM023
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: minor
    topic: buyer-mix
    missingEvidence: Customer-level breakdown of startup versus enterprise revenue mix.
    whyItMatters: Buyer mix determines whether the market story is still bottoms-up experimentation or true enterprise platform adoption.
    diligencePath: Ask management for ARR split by customer segment and ACV band.
    relatedQuestionRefs:
    - QM010
    - QM011
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: Retention, expansion, and migration data showing whether embedded eval/training workflows create durable switching costs.
    whyItMatters: Without retention evidence, the vendor-lock-in thesis remains mostly conceptual.
    diligencePath: Request cohort analysis, renewal rates, and win-loss commentary against hyperscalers.
