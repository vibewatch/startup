- id: recommendation-and-diligence-asks
  title: Recommendation, Triggers, and Final Diligence Asks
  body: 'The most defensible public-only recommendation is “research more / track with discipline.” That is not a disguised negative; it is a recognition that Prime appears strategically strong enough to merit serious attention, while still lacking the private metrics required for conviction at a 10x-ARR headline entry. A more positive call would require evidence of healthy margins, low concentration, strong renewals, and a clean preference stack. A more negative call would require evidence that the ARR is lower quality, the cap table is less favorable, or the trust gap is slowing enterprise conversion materially. The practical implication is simple: Prime is the kind of company where price and diligence can still move the investment call a great deal, so the right next step is not a snap judgment but a tightly scoped diligence sprint against the most valuation-sensitive unknowns. This is exactly the profile where disciplined investors can outperform impatient ones, because the company may
    be excellent while the current evidence set is still insufficient for full-confidence underwriting.'
