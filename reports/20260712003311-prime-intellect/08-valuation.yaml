    - Current $1B entry later looks conservative relative to revenue quality and strategic scarcity.
    - Needs trust hardening and durable retention.
    - Independent proof starts broadening beyond flagship cases.
  - - Base
    - Growth stays strong but diligence gaps close only gradually.
    - Current entry can work, but upside depends on measured re-rating rather than instant multiple expansion.
    - Margin and concentration ambiguity persists.
    - Company keeps winning technical buyers but enterprise evidence fills in slowly.
  - - Bear
    - Pricing compresses, concentration surfaces, or trust gap slows expansion.
    - Current entry looks full or expensive despite real demand.
    - Cap-table opacity and weaker economics hurt realized returns.
    - Procurement friction rises faster than control maturity.
  notes: Scenarios are directional; they are intended to show transmission paths, not to create false numerical precision.
