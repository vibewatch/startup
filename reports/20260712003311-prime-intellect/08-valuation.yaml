- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Gross margin by product line
    - Actual infrastructure economics
    - Determines whether 10x ARR is fair or cheap
    - Finance + data room review
  - - Top-customer concentration and NRR
    - Revenue quality and renewal durability
    - Separates broad adoption from fragile usage growth
    - Finance + customer reference calls
  - - Preference stack and dilution
    - Realized return mechanics
    - Can overwhelm company-value growth if unfavorable
    - Legal + financing document review
  - - Trust controls and enterprise security evidence
    - Conversion ceiling with larger buyers
    - Directly affects expansion and multiple support
    - Security diligence + customer procurement review
  notes: These are the highest-leverage items for moving the recommendation, not a generic diligence wish list.
