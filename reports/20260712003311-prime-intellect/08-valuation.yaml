- id: comparable-set-and-capitalization
  title: Comparable Set and Capitalization Reality
  body: Private infrastructure comparables help establish that the market is willing to pay up for AI infrastructure narratives with traction. Together AI, Baseten, and Modal each carry valuation headlines that make Prime’s $1 billion mark look credible rather than outlandish. But comp math here is messy. Those marks are themselves narrative-heavy, often lack clean public economics, and sit in a market where product scope and revenue quality differ materially by company. The cap table adds another layer of uncertainty. Prime’s January 2026 Form D shows nearly $50 million sold before the public Series A announcement, making the true preference stack and dilution path impossible to model confidently from headlines alone. The most important conclusion is not that comps are useless; it is that they cannot substitute for knowing what ownership, liquidation preferences, and revenue quality really look like.
  claimRefs:
  - CV004
  - CV005
