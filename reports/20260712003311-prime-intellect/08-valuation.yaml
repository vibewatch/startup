- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Trust-control failure
    - Serious security/privacy incident or failed enterprise diligence
    - Damages conversion, retention, and multiple support
    - Pause investment case or demand steep discount
  - - Customer-quality weakness
    - High concentration or flagship churn revealed
    - Reduces durability of ARR headline
    - Re-underwrite to lower quality-of-revenue profile
  - - Cap-table impairment
    - Preference stack materially worse than implied
    - Cuts realized investor returns
    - Adjust price discipline or walk away
  - - Pricing compression
    - Workflow ROI fails to defend premium economics
    - Shrinks multiple and margin outlook
    - Shift from track to pass unless price resets
  notes: Each trigger is tied to an identifiable diligence path or post-investment monitoring metric.
