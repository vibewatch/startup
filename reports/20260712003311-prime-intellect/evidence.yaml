evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: capitalization
    missingEvidence: >-
      Primary financing documents that reconcile the January 2026 Form D with the publicly announced pre-Series A and
      Series A totals.
    whyItMatters: Without this, ownership dilution, insider participation, and preference-stack analysis remain incomplete.
    diligencePath: Request the board deck, cap table, and closing documents for the Dec 2025/Jan 2026 financing.
    relatedQuestionRefs:
      - QO010
  - type: conflicting-data
    severity: minor
    topic: founding-date
    missingEvidence: >-
      Incorporation documents or board materials that establish whether the operative founding date is late 2023 or
      2024.
    whyItMatters: A clean founding date matters for benchmarking speed of growth and employee vesting timelines.
    diligencePath: Pull certificate of incorporation, first board consent, and earliest payroll records.
    relatedQuestionRefs:
      - QO011
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Current headcount by function, office, and contractor mix.
    whyItMatters: Operating scale and burn cannot be judged well without team size and org depth.
    diligencePath: Request the latest org chart and payroll summary.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Full board roster, observer rights, and post-Series-A ownership percentages.
    whyItMatters: Governance concentration and control rights are central to any late-stage underwriting decision.
    diligencePath: Request charter documents, voting agreements, and the current board package.
    relatedQuestionRefs:
      - QO026
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: independent-sam
    missingEvidence: >-
      An independent analyst source that isolates the post-training and owned-agent infrastructure niche instead of
      broad AI or inference TAM.
    whyItMatters: Without that, SAM and penetration math remain heuristic rather than measured.
    diligencePath: Request or commission a segment-specific market map from an infrastructure-focused analyst.
    relatedQuestionRefs:
