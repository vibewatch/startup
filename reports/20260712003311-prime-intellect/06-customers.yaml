  - CU037
  tableRefs:
  - TU001
  - TU002
  figureRefs:
  - FU001
- id: named-customer-proof
  title: Named Customer Proof and Evidence Quality
  body: 'Named customer proof is the strongest part of the chapter. Ramp gives Prime a flagship enterprise outcome case tied to spreadsheet-search performance. Zapier adds a different kind of evidence: not only a company-authored case study, but also a public event where Zapier’s own applied-AI engineer discusses RL environments and verifier-driven optimization alongside Prime. Browserbase contributes a third proof surface that is technical rather than purely commercial, because its docs and blog show Prime being used inside a real browser-agent integration. Taken together, these examples are more persuasive than a generic customer logo wall. Prime also maintains a case-study index, suggesting that customer proof is becoming a repeatable GTM motion rather than a one-off press tactic. Still, the examples remain a selected sample. The public record does not tell us how representative these accounts are of the wider customer base, whether they are high spend, or whether similar workflows have
    repeated across many paying accounts.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU019
  - CU020
  - CU021
  - CU022
  - CU031
  - CU032
  - CU036
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: retention-expansion-concentration
  title: Retention, Expansion, and Concentration
  body: 'The most important unresolved customer questions sit after initial adoption. Prime’s full-stack architecture clearly creates an opportunity for land-and-expand: a team can begin with one training workflow and later add evaluations, sandboxes, inference, or dedicated deployments. That is the optimistic path, and the named references all hint at multi-step engagement rather than one-off usage. But none of the public sources disclose retention cohorts, contract length, gross retention, net retention, or top-customer concentration. This is a meaningful limitation because AI infrastructure businesses can show impressive growth while still depending on a handful of volatile accounts or on usage patterns that are easy to switch away from. The current evidence therefore supports expansion potential more than proven durability. It also means the customer count headline should be treated as an adoption indicator, not as a substitute for cohort quality.'
  claimRefs:
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU026
  - CU027
  - CU030
  tableRefs:
  - TU004
  - TU005
  figureRefs:
  - FU002
  - FU004
- id: procurement-durability-verdict
  title: Procurement Friction, Durability, and Verdict
  body: Prime’s customer story is strongest where technical teams are willing to trade procurement convenience for workflow control and performance gains. That is a meaningful segment, but it is not the entire enterprise market. Buyers can choose more familiar alternatives from OpenAI, Azure, or AWS, and broader market commentary plus FTC guidance around AI risk suggests smaller AI vendors must overcome real counterparty and lock-in concerns during procurement. This does not invalidate Prime’s traction; it reframes it. The company appears to have real customer demand and unusually concrete public references for its age, yet still lacks the retention and concentration disclosures that would turn adoption momentum into a fully underwritten customer base. The prudent diligence stance is therefore positive on current adoption, cautious on durability, and explicitly unfinished on concentration risk. That gap matters directly for any investor trying to separate sticky platform adoption from temporary
    experimentation.
  claimRefs:
  - CU028
  - CU029
  - CU034
  - CU035
  tableRefs: []
  figureRefs: []
