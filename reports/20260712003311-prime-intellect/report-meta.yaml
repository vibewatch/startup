companyProfile:
  summary: >-
    Prime Intellect is a San Francisco-based AI infrastructure company founded in 2024 by Vincent Weisser and Johannes Hagemann. It sells a
    full-stack platform for enterprises and AI-native teams to train, evaluate, and deploy their own open-model agents on private workflows,
    combining hosted training, evaluation tooling, environments, inference, and compute access under a sovereignty-first commercial pitch. By
    July 2026, the company reported more than $100M in annualized revenue, 6,000-plus customers, and a $130M Series A at a $1B valuation,
    making it one of the fastest-scaling startups in the category while still leaving major private diligence gaps on margins and durability.
  founders:
    - name: Vincent Weisser
      role: CEO & Co-founder
      background: Co-founder of VitaDAO and former Molecule ecosystem/operator with a DeSci and open-infrastructure network.
      claimRefs: [CO006, CO008]
    - name: Johannes Hagemann
      role: CTO & Co-founder
      background: Former Aleph Alpha distributed-training engineer educated at the Hasso Plattner Institute.
      claimRefs: [CO007, CO009]
  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: >-
    Prime sells a modular but integrated AI stack: hosted RL and post-training through Lab, evaluation tooling via verifiers and hosted
    evaluations, environment and sandbox support, OpenAI-compatible inference, dedicated deploys, and access to compute or reserved clusters.
  customerFocus: >-
    AI-native startups, developer-tool vendors, and digital-native enterprises that want stronger control over task-specific model improvement
    and private data than generic closed-model APIs or hyperscaler bundles provide.
  businessModel: >-
    B2B usage-based monetization across compute access, hosted training tokens, evaluation workflows, inference APIs, and larger enterprise
    deployment or capacity commitments, with self-serve technical adoption expanding into broader enterprise contracts.
  stage: Series A (private, venture-backed)
  fundingStatus: >-
    $130M Series A announced July 2026 at a reported $1B valuation; official total funding is over $150M, with a January 2026 Form D adding
    public ambiguity around the exact pre-Series-A capitalization path.
  disclosureProfile: private-undisclosed
  claimRefs: [CO014, CO015, CO016, CE001, CI001, CU001]
