  topStrengths:
    - Full-stack product positioning around enterprise-controlled model improvement, not just a thin API wrapper.
    - Unusually strong top-line traction for the category, including >$100M annualized revenue and 6,000-plus customers.
    - Fresh named workflow proof from Ramp, Zapier, and Browserbase that suggests real product value beyond marketing claims.
    - Large Series A and strong investor bench reduce immediate capital-access risk.
  topRisks:
    - Gross margin, retention, and customer concentration remain publicly undisclosed despite a meaningful entry multiple.
    - Trust-control maturity and enterprise hardening appear thinner than the sovereignty pitch implies.
    - Supplier, platform, and procurement-safe-competitor dependencies can pressure both win rates and economics.
    - Form D / preference-stack ambiguity could materially affect realized investor returns.
  unresolvedGaps:
    - No public gross-margin, NRR, churn, or cohort data.
    - No public top-customer concentration or spend-band disclosure.
    - No public cap-table package reconciling the January 2026 Form D to the Series A narrative.
    - No public audit-grade trust / security evidence comparable to large enterprise vendors.
