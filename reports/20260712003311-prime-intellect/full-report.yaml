      - number: '1.4'
        title: Commercial Traction, Milestones, and Early Adverse Signals
        blocks:
          - type: paragraph
            body: >-
              The commercial ramp is the single strongest fact in the overview chapter. Prime Intellect says it had more
              than 6,000 customers and over $100 million in annualized revenue in under a year by the time it announced
              the Series A. Independent reporting corroborates at least the direction of the story by naming paying
              customers such as Ramp, Zapier, and Flapping Airplanes, while company materials add NVIDIA, Character.AI,
              Browserbase, Goodfire, Arcee, and Standard Intelligence as reference accounts. The product cadence also
              supports the growth narrative: Lab launched in February 2026, private beta users completed more than 3,000
              RL runs, Hosted Evaluations launched in May, Browserbase joined as a browser-agent partner, and NVIDIA
              pulled Prime Intellect into the Nemotron coalition. The caveat is quality of evidence. Most traction
              metrics remain company-provided, the founding date is inconsistently described across sources, and
              independent sector commentary argues that open-model infrastructure pricing is compressing rapidly. Prime
              Intellect therefore enters diligence as a very real growth story, but not yet a fully audited one.
