  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Competitive Set
        blocks:
          - type: paragraph
            body: >-
              Prime Intellect does not face a single clean rival. It sits inside a crowded stack where buyers can solve
              the same problem through very different combinations of products: an open-model cloud like Together, an
              inference-first platform like Baseten, a general AI cloud like Modal, a lightweight model API like
              Replicate, a Ray-native distributed-compute platform like Anyscale, or a hyperscaler stack like Bedrock,
              Azure Foundry, Google Agent Platform, or direct OpenAI enterprise products. That breadth matters because
              it means Prime Intellect is competing on jobs-to-be-done rather than on a narrow feature checklist. The
              job is helping a buyer own more of the model optimization loop without recreating a frontier lab. Whoever
              can combine acceptable governance, attractive economics, and fast implementation will often win regardless
              of whether the buyer calls the purchase “training,” “inference,” or “agent infrastructure.” The commercial
              category boundary is therefore fluid, which makes competitor framing as important as feature comparison
              for investors today.
            claimRefs:
              - CP001
