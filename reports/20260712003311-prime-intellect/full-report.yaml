      - number: '3.2'
        title: Direct Open-Model Peers
        blocks:
          - type: paragraph
            body: >-
              The closest independent peers all attack adjacent slices of the same opportunity. Together AI is the
              broadest direct competitor because it spans inference, model shaping, storage, code sandboxes, and
              large-scale infrastructure under one AI-native cloud banner. Baseten is more tightly focused on production
              inference, but its ability to deploy in its own cloud or the customer’s cloud makes it highly relevant
              whenever data control and enterprise posture matter. Modal is a powerful adjacent competitor because it
              already sells low-latency inference, batch jobs, and sandboxes, and it is explicitly doubling down on
              training and reinforcement-learning workflows. Replicate is much lighter-weight and more
              developer-centric, while Anyscale competes through distributed training and Ray-native execution. Prime
              Intellect’s distinctiveness is strongest where RL environments, evaluation loops, and self-improving
              agents matter, but that wedge lives next to increasingly convergent packaging from other independent
              vendors.
