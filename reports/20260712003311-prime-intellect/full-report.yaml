            figureRef: FO002
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
      - number: '1.2'
        title: Founders, Leadership, and Governance Surface
        blocks:
          - type: paragraph
            body: >-
              The founding pair combine an unusual blend of decentralized-science ideology and hardcore
              distributed-systems engineering. Vincent Weisser comes out of VitaDAO, Molecule, and Zuzalu, giving Prime
              Intellect a network anchored in open-source, crypto-native, and frontier-science communities rather than
              in traditional enterprise software. Johannes Hagemann brings the technical operating credential:
              distributed training work at Aleph Alpha and a systems-engineering background that is legible to customers
              buying serious post-training infrastructure. Public governance disclosure is thinner. The clearest hard
              evidence is the January 2026 SEC Form D, which names Weisser and Hagemann and adds David Katz as a
              director. That suggests institutionalization beyond a two-founder shop, but it does not disclose a full
              board roster, ownership splits, or operating headcount. The legal record also splits between a
              Delaware-incorporated entity footprint and widespread media descriptions of the company as San
              Francisco-based, which is normal for startups but still worth noting when diligence asks for principal
              place of business and governance documents.
