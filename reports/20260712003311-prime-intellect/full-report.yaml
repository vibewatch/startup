  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Included Spend
        blocks:
          - type: paragraph
            body: >-
              Prime Intellect should be analyzed inside the managed AI infrastructure layer, not the entire AI economy.
              The company’s product scope spans compute procurement, RL environments, secure sandboxes, hosted training,
              evaluations, and inference deployment. That sits above raw GPU rental and below the application layer, and
              it differs from simply calling a frontier-model API. The included spend is what an enterprise pays to own
              more of the model-optimization loop: experimentation, post-training, evaluation, deployment, and ongoing
              improvement for specific workflows. Excluded spend includes frontier pretraining budgets, generic
              public-cloud IaaS without Prime-like orchestration, and pure SaaS copilots where the buyer never touches
              the model stack. This framing matters because many published AI market numbers include semiconductors,
              public-cloud platform revenue, and general enterprise AI software that Prime Intellect cannot
              realistically win. The real substitute set is narrower: AWS Bedrock, Azure Foundry and Azure OpenAI,
              Google’s agent platform, Together-style open-model clouds, and internal self-hosted stacks.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM012
