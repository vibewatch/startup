        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              Prime Intellect’s legal and regulatory risk is not primarily about one current lawsuit or enforcement
              event; it is about the direction of travel. AI infrastructure vendors now operate in an environment where
              transparency, data governance, marketing accuracy, and lifecycle controls matter more every quarter. The
              EU AI Act, FTC guidance, and NIST AI RMF all point the same way: enterprise buyers will increasingly
              expect evidence of process maturity, not just technical promise. Prime does have baseline legal and trust
              surfaces—privacy, terms, and security pages—but those are entry-level signals. They do not by themselves
              prove audited controls, customer-specific data handling, or operational discipline. Export controls add
              another externality because access to models and hardware can change for geopolitical reasons outside the
              company’s control. That makes regulatory change a real second-order product risk, not a purely legal
              footnote.
