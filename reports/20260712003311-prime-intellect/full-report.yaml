      - number: '4.3'
        title: Cost Structure and Capital Adequacy
        blocks:
          - type: paragraph
            body: >-
              Prime Intellect’s cost model is almost certainly compute-heavy even if the company is more asset-light
              than a GPU neocloud that owns or leases large dedicated fleets. The product requires third-party GPU
              capacity, inference serving, orchestration, storage, and sandbox runtime. The docs imply Prime tries to
              improve utilization through shared hardware and multi-tenant LoRA deployments, which is the right economic
              instinct, but public sources do not reveal gross margin or contribution margin. Financing depth partly
              offsets that uncertainty. The company raised seed capital in 2024, a $15 million extension in early 2025,
              disclosed a nearly $50 million Form D offering in January 2026, and then announced a $130 million Series A
              in July 2026. That means capital adequacy is unlikely to be the near-term issue; the issue is whether
              capital can be converted into durable, efficient growth before the market compresses pricing or forces
              heavier enterprise support and supplier commitments. Independent CIO commentary adds a second lens:
              enterprise buyers increasingly score small AI infrastructure vendors on survivability, not just on
