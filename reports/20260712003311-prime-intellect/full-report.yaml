chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product Scope, and Strategic Thesis
        blocks:
          - type: paragraph
            body: >-
              Prime Intellect presents itself as an AI infrastructure company rather than a model lab selling one closed
              API. Across its homepage, Lab launch materials, and Series A announcement, the company consistently
              describes a full-stack system for training, deploying, and continuously improving customer-owned models on
              private workflows. The package spans GPU access, RL environments, hosted training, secure sandboxes,
              evaluations, and inference, which is materially broader than a standalone model endpoint. The strategic
              message is equally explicit: enterprises should own their optimization loop instead of handing product
              data and workflow knowledge back to OpenAI, Anthropic, or any other frontier lab. That sovereignty thesis
              is the throughline tying together Prime Intellect’s research program, infrastructure stack, and commercial
              pitch. It also explains why the company packages modular services rather than forcing buyers into a single
              monolithic contract. Public materials describe both self-serve and enterprise paths, from on-demand
              compute and serverless APIs to dedicated deployments and reserved clusters.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO035
