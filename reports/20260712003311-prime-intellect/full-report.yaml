              - CV037
      - number: '8.3'
        title: Bull, Base, Bear, and Sensitivity
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: Prime becomes the preferred full-stack control plane for enterprises
              that want to own and continuously improve private AI agents, and the current valuation ends up looking
              modest against future scale. The base case is less dramatic but still attractive: growth remains strong,
              yet the market waits for better proof on margins, retention, and trust before rewarding a much higher
              multiple. The bear case does not require the company to fail. It only requires pricing pressure, slower
              enterprise hardening, or concentration surprises to make the present entry look full. That framing is why
              sensitivity matters more than precision. Small changes in assumptions about gross margin quality,
              concentration, or cap-table cleanliness are likely to matter more for realized returns than broad AI
              market growth alone. For this reason, scenario discipline is more informative than a single headline
              multiple for investors here today overall.
            claimRefs:
              - CV015
