      - number: '2.4'
        title: Growth Drivers, Constraints, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Prime Intellect benefits from several powerful market drivers: RL is becoming a mainstream post-training
              method, open models keep improving, and more teams want to use traces and evaluations to optimize models
              directly for their own workflows. Yet the same market is also structurally hard. Data sovereignty is a
              real buying trigger, but Bedrock and OpenAI now both promise strong privacy controls, so sovereignty alone
              is not enough. Open-source parity can compress pricing; neocloud vendors may consolidate; and hidden
              switching costs cut both ways by helping incumbents once they are embedded. Regulation is becoming another
              selection variable rather than a distant future issue, especially in Europe. The consequence is that Prime
              Intellect is entering a very large market with genuine demand, but one where distribution, compliance,
              reliability, and financial resilience may matter as much as raw model performance. The biggest diligence
              gap is simple: no public source cleanly measures how much of the spending pool remains available to
              independent vendors after hyperscalers and closed-model platforms take their share.
