      - number: '3.3'
        title: Incumbents, Substitutes, and Distribution Power
        blocks:
          - type: paragraph
            body: >-
              Hyperscalers and OpenAI create the hardest competitive problem because they compress multiple buying
              criteria into one incumbent relationship. Bedrock leads with model breadth, agent tooling, compliance, and
              explicit data-control promises. Azure Foundry does the same inside Microsoft’s identity, security, and
              knowledge ecosystem. Google’s Gemini Enterprise Agent Platform combines model choice, agent tooling, and
              MLOps in a unified surface. OpenAI, meanwhile, is moving beyond raw API usage into packaged enterprise
              commitments around privacy and pricing. Prime Intellect’s open-stack narrative therefore does not compete
              in a vacuum: many buyers can already get privacy, governance, and strong models from their existing cloud
              or model vendor. Independent startups only win if their extra control, faster iteration, or better
              economics are large enough to justify switching away from those incumbent defaults.
