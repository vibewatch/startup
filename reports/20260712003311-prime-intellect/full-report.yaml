      - number: '1.3'
        title: Funding History and Capitalization Ambiguity
        blocks:
          - type: paragraph
            body: >-
              Prime Intellect’s public fundraising path has been compressed and somewhat messy. In April 2024 the
              company announced a $5.5 million seed round co-led by Distributed Global and CoinFund. In February 2025 it
              announced a further $15 million led by Founders Fund with Menlo and a bench of well-known AI operators.
              Then on July 8 2026 it announced a $130 million Series A led by Radical Ventures with NVIDIA Ventures,
              Intel Capital, Dell Technologies Capital, and existing investors, alongside an unusually strong angel
              syndicate. The official message is simple: total funding is now over $150 million. The disclosure
              complication is an SEC Form D filed in January 2026 showing nearly $50 million of equity sold beginning
              December 1 2025 with 61 investors. That filing may represent a pre-Series A financing, a structure wrapped
              into later disclosure, or a separate bridge that public narratives do not clearly unpack. The result is a
              strong signal of investor demand but an incomplete public capitalization history, which matters for
              dilution, preference stack, and any attempt to reconcile ownership before the Series A.
