      - number: '2.2'
        title: Sizing the Opportunity Through Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              The most useful way to size Prime Intellect’s opportunity is to keep multiple lenses in play at once. The
              broad AI inference market is enormous at more than $106 billion in 2025 and roughly $255 billion by 2030,
              while the broader enterprise AI market is similarly above $100 billion and growing near 19% annually.
              Reinforcement-learning software itself also shows very high projected growth, though from a much smaller
              base. Those numbers prove budget availability, but they overstate what Prime Intellect can touch. Much of
              the inference TAM accrues to chips, hyperscaler platform revenue, and general-purpose AI spend. Prime
              Intellect’s practical serviceable market is the subset of startups and enterprises willing to own custom
              model improvement instead of outsourcing it entirely to closed labs or generic hyperscaler bundles. That
              is still a large and growing niche, but it is not directly measured in public analyst work. The right
              conclusion is directional: the category is big enough to support multiple venture-scale winners, but
              public TAM estimates should not be mistaken for Prime Intellect’s near-term addressable revenue pool.
            claimRefs:
