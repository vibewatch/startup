  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Surfaces
        blocks:
          - type: paragraph
            body: >-
              Prime Intellect’s revenue model is more diversified than the simple “AI API startup” label suggests.
              Public materials describe at least five monetizable surfaces: on-demand compute, reserved clusters, hosted
              RL training, evaluations, and inference serving through both serverless and dedicated deployments. The
              docs make clear that core training revenue is usage-based, with per-million-token pricing for input,
              output, and training, while the homepage points to separate enterprise capacity commitments around
              dedicated inference and cluster procurement. That hybrid mix matters. A pure inference vendor lives and
              dies on token price and utilization. Prime Intellect, by contrast, is trying to capture a wider share of
              the customer workflow by charging for the entire model-optimization loop. The financial upside is larger
              account expansion; the downside is a more operationally complex cost base and harder-to-benchmark unit
              economics.
