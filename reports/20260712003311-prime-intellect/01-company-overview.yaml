  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: capitalization
    missingEvidence: Primary financing documents that reconcile the January 2026 Form D with the publicly announced pre-Series A and Series A totals.
    whyItMatters: Without this, ownership dilution, insider participation, and preference-stack analysis remain incomplete.
    diligencePath: Request the board deck, cap table, and closing documents for the Dec 2025/Jan 2026 financing.
    relatedQuestionRefs:
    - QO010
  - type: conflicting-data
    severity: minor
    topic: founding-date
    missingEvidence: Incorporation documents or board materials that establish whether the operative founding date is late 2023 or 2024.
    whyItMatters: A clean founding date matters for benchmarking speed of growth and employee vesting timelines.
    diligencePath: Pull certificate of incorporation, first board consent, and earliest payroll records.
    relatedQuestionRefs:
    - QO011
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: Current headcount by function, office, and contractor mix.
