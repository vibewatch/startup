company:
  name: Prime Intellect
chapter:
  number: 1
  title: Company Overview
  summary: Prime Intellect has become one of the fastest-scaling AI infrastructure startups of 2026 by packaging compute, RL tooling, evaluations, and inference into an enterprise-controlled stack. The company reached a reported $1 billion valuation, 6,000-plus customers, and more than $100 million of annualized revenue, but its capital history and governance disclosure remain materially thinner than its growth story.
sections:
- id: identity-thesis
  title: Identity, Product Scope, and Strategic Thesis
  body: 'Prime Intellect presents itself as an AI infrastructure company rather than a model lab selling one closed API. Across its homepage, Lab launch materials, and Series A announcement, the company consistently describes a full-stack system for training, deploying, and continuously improving customer-owned models on private workflows. The package spans GPU access, RL environments, hosted training, secure sandboxes, evaluations, and inference, which is materially broader than a standalone model endpoint. The strategic message is equally explicit: enterprises should own their optimization loop instead of handing product data and workflow knowledge back to OpenAI, Anthropic, or any other frontier lab. That sovereignty thesis is the throughline tying together Prime Intellect’s research program, infrastructure stack, and commercial pitch. It also explains why the company packages modular services rather than forcing buyers into a single monolithic contract. Public materials describe both
    self-serve and enterprise paths, from on-demand compute and serverless APIs to dedicated deployments and reserved clusters.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO035
  figureRefs:
  - FO002
- id: founders-governance
  title: Founders, Leadership, and Governance Surface
  body: 'The founding pair combine an unusual blend of decentralized-science ideology and hardcore distributed-systems engineering. Vincent Weisser comes out of VitaDAO, Molecule, and Zuzalu, giving Prime Intellect a network anchored in open-source, crypto-native, and frontier-science communities rather than in traditional enterprise software. Johannes Hagemann brings the technical operating credential: distributed training work at Aleph Alpha and a systems-engineering background that is legible to customers buying serious post-training infrastructure. Public governance disclosure is thinner. The clearest hard evidence is the January 2026 SEC Form D, which names Weisser and Hagemann and adds David Katz as a director. That suggests institutionalization beyond a two-founder shop, but it does not disclose a full board roster, ownership splits, or operating headcount. The legal record also splits between a Delaware-incorporated entity footprint and widespread media descriptions of the company
    as San Francisco-based, which is normal for startups but still worth noting when diligence asks for principal place of business and governance documents.'
  claimRefs:
  - CO006
  - CO007
  - CO008
  - CO009
  - CO010
  - CO032
  - CO040
  tableRefs:
  - TO002
- id: capitalization-history
  title: Funding History and Capitalization Ambiguity
  body: 'Prime Intellect’s public fundraising path has been compressed and somewhat messy. In April 2024 the company announced a $5.5 million seed round co-led by Distributed Global and CoinFund. In February 2025 it announced a further $15 million led by Founders Fund with Menlo and a bench of well-known AI operators. Then on July 8 2026 it announced a $130 million Series A led by Radical Ventures with NVIDIA Ventures, Intel Capital, Dell Technologies Capital, and existing investors, alongside an unusually strong angel syndicate. The official message is simple: total funding is now over $150 million. The disclosure complication is an SEC Form D filed in January 2026 showing nearly $50 million of equity sold beginning December 1 2025 with 61 investors. That filing may represent a pre-Series A financing, a structure wrapped into later disclosure, or a separate bridge that public narratives do not clearly unpack. The result is a strong signal of investor demand but an incomplete public capitalization
    history, which matters for dilution, preference stack, and any attempt to reconcile ownership before the Series A.'
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  - CO031
  - CO033
  tableRefs:
  - TO003
- id: traction-and-milestones
  title: Commercial Traction, Milestones, and Early Adverse Signals
  body: 'The commercial ramp is the single strongest fact in the overview chapter. Prime Intellect says it had more than 6,000 customers and over $100 million in annualized revenue in under a year by the time it announced the Series A. Independent reporting corroborates at least the direction of the story by naming paying customers such as Ramp, Zapier, and Flapping Airplanes, while company materials add NVIDIA, Character.AI, Browserbase, Goodfire, Arcee, and Standard Intelligence as reference accounts. The product cadence also supports the growth narrative: Lab launched in February 2026, private beta users completed more than 3,000 RL runs, Hosted Evaluations launched in May, Browserbase joined as a browser-agent partner, and NVIDIA pulled Prime Intellect into the Nemotron coalition. The caveat is quality of evidence. Most traction metrics remain company-provided, the founding date is inconsistently described across sources, and independent sector commentary argues that open-model infrastructure
    pricing is compressing rapidly. Prime Intellect therefore enters diligence as a very real growth story, but not yet a fully audited one.'
