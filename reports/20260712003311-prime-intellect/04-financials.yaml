    - QI019
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: Cohort retention, NRR, revenue concentration, and top-customer exposure.
    whyItMatters: These determine whether the company is compounding or simply scaling noisy usage revenue.
