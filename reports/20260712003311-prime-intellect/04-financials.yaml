  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Gross margin, contribution margin, and infrastructure unit-cost disclosures.
    whyItMatters: Without margin visibility, the headline ARR number cannot be translated into durable enterprise value.
    diligencePath: Request margin bridge by product line and supplier-cost breakdown.
