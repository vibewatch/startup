              商业爬坡是概况章节里最强的一条事实。Prime Intellect 称，在宣布 Series A 时，公司成立不到一年就拥有超过 6,000 家客户和超过 $100 million
              年化收入。独立报道至少证实了叙事方向，点名 Ramp、Zapier、Flapping Airplanes 等付费客户；公司材料又补充了
              NVIDIA、Character.AI、Browserbase、Goodfire、Arcee 和 Standard Intelligence 等参考账户。产品节奏也支撑增长叙事：Lab 于 2026 年 2
              月发布，私测用户完成超过 3,000 次 RL run，Hosted Evaluations 于 5 月发布，Browserbase 作为浏览器智能体合作伙伴加入，NVIDIA 也把 Prime
              Intellect 拉进 Nemotron 联盟。需要打折的是证据质量。多数牵引指标仍由公司提供，创立日期在不同来源中表述不一，独立行业评论也认为开放模型基础设施定价正在快速压缩。因此，Prime
              Intellect 进入尽调时确实是一个真实的增长故事，但还不是一个完全审计过的增长故事。
