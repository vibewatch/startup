      - number: '2.2'
        title: 用多重镜头测算机会
        blocks:
          - type: paragraph
            body: >-
              测算 Prime Intellect 的机会，最有用的方法是同时保留多重镜头。广义 AI 推理市场规模巨大，2025 年超过 $106 billion，到 2030 年约 $255 billion；更广的企业
              AI 市场同样超过 $100 billion，并以接近 19% 的年增速扩张。强化学习软件本身的预计增速也很高，只是基数小得多。这些数字证明预算存在，但也高估了 Prime Intellect 能触达的范围。推理
              TAM 中很大一部分流向芯片、超大规模云厂商平台收入和通用 AI 支出。Prime Intellect
              的实际可服务市场，是愿意掌握定制模型改进、而不是把改进完全外包给封闭实验室或通用云厂商套件的创业公司和企业子集。这个细分仍然很大，也在增长，但公开分析师工作并没有直接测量。正确结论是方向性的：这个品类足以支撑多个风险投资规模的赢家，但公开
              TAM 估算不应被误读为 Prime Intellect 的近期可触达收入池。
