      - number: '1.3'
        title: 融资历史与资本化模糊点
        blocks:
          - type: paragraph
            body: >-
              Prime Intellect 的公开融资路径压缩得很快，也有些凌乱。2024 年 4 月，公司宣布由 Distributed Global 和 CoinFund 共同领投 $5.5 million
              种子轮。2025 年 2 月，又宣布 Founders Fund 领投、Menlo 和一批知名 AI 运营者参投的 $15 million 后续融资。随后在 2026 年 7 月 8 日，公司宣布由
              Radical Ventures 领投、NVIDIA Ventures、Intel Capital、Dell Technologies Capital 和既有投资者参投的 $130 million Series
              A 轮，并配有异常强的天使投资人团。官方信息很简单：累计融资现在超过 $150 million。披露层面的麻烦来自 2026 年 1 月提交的 SEC Form D，显示自 2025 年 12 月 1 日起已向
              61 名投资者出售近 $50 million 股权。该文件可能代表 Series A
              前融资、被包进后续披露的结构，或一笔公开叙事没有拆清的独立桥接轮。结果是投资人需求信号很强，但公开资本化历史不完整；这会影响稀释、优先股堆叠，以及任何在 Series A 前对齐所有权的尝试。
