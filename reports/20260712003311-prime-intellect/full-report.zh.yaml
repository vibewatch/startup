              AI 基础设施业务可以展示亮眼增长，同时仍依赖少数波动账户，或依赖很容易被切走的使用模式。因此，当前证据更多支持扩张潜力，而非已经证明的持久性。它也意味着，客户数标题应被视为采用指标，而不是队列质量的替代品。
