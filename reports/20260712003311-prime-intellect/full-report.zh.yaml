  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Prime Intellect 的法律和监管风险，并不主要来自某一起当前诉讼或执法事件，而是来自方向。AI 基础设施供应商如今运营在一个透明度、数据治理、营销准确性和生命周期控制每个季度都更重要的环境里。EU
              AI Act、FTC 指引和 NIST AI RMF 都指向同一个方向：企业买方会越来越期待流程成熟度证据，而不只是技术承诺。Prime
              确实有基础法律和信任表面——隐私、条款和安全页面——但它们只是入门信号，本身不能证明已审计控制、客户特定数据处理或运营纪律。出口管制又增加了另一个外部性，因为模型和硬件的接入可能因公司无法控制的地缘政治原因变化。这使监管变化成为真实的二阶产品风险，而不只是法律脚注。
