              倍的表面入场价上形成确信，还缺少关键私有指标。更积极的判断，需要看到健康利润率、低客户集中度、强续约和干净的优先权结构；更负面的判断，则需要证据显示 ARR
              质量偏低、股权结构不那么有利，或信任缺口正在明显拖慢企业转化。实际含义很简单：Prime
              是那类价格和尽调都能大幅改写投资结论的公司。下一步不该仓促定性，而是围绕最影响估值的未知项，跑一轮边界清晰的尽调冲刺。正是在这种公司上，纪律严的投资人可能跑赢急躁的投资人：公司也许非常优秀，但现有证据仍不足以支撑高确信度投资判断。
