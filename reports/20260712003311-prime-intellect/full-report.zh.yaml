        blocks:
          - type: paragraph
            body: >-
              Prime 的依赖图异常重要，因为业务夹在客户和多个强大上游系统之间。GPU 和云接入、开放模型生态、Browserbase 式环境合作伙伴，以及有影响力的平台关系，都不完全受 Prime
              控制。这个模式的上行是速度和资本效率；下行是供应商定价、容量分配、合作伙伴 API 质量或生态偏好一变，利润率和可靠性可能同时受冲击。竞争替代品也抬高风险。当采购简单性或品牌安全比定制化更重要时，买方可以退回
              AWS、Azure、Google 或 OpenAI。这不会消灭 Prime 的楔子，但会缩窄公司在无需证明异常强 ROI 的情况下能够赢下的账户集合。
