companyProfile:
  summary: >-
    Prime Intellect 是一家总部位于 San Francisco 的 AI 基础设施公司，由 Vincent Weisser 和 Johannes Hagemann 于 2024 年创立。公司销售一套全栈平台，服务企业和
    AI 原生团队，让他们在私有工作流上训练、评估并部署自己的开放模型智能体；平台把托管训练、评估工具、环境、推理和算力接入组合在一起，并以主权优先作为商业卖点。到 2026 年 7 月，公司披露年化收入超过 $100M、客户超过
    6,000 家，并以 $1B 估值完成 $130M Series A 轮，使其成为该品类扩张最快的创业公司之一；与此同时，利润率和持久性上仍留下重大的私有尽调缺口。
