      - number: '2.4'
        title: 增长驱动、约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Prime Intellect 受益于几股强劲的市场驱动：RL
              正成为主流后训练方法，开放模型持续变强，更多团队也希望用轨迹和评估直接为自己的工作流优化模型。但同一个市场在结构上也很难。数据主权是真实购买触发点，但 Bedrock 和 OpenAI
              现在都承诺强隐私控制，所以单靠主权不够。开源能力追平会压缩定价；新型云厂商可能整合；隐藏切换成本两头作用，一旦现有厂商嵌入，也会帮它们守住客户。监管也正从遥远未来问题变成另一个选择变量，尤其在欧洲。结果是，Prime
              Intellect
              正进入一个需求真实、规模很大的市场，但分发、合规、可靠性和财务韧性可能与原始模型性能一样重要。最大的尽调缺口很简单：没有公开来源能干净测算，在超大规模云厂商和封闭模型平台拿走份额之后，留给独立供应商的支出池还有多大。
