      - number: '1.2'
        title: 创始人、领导层与治理表面
        blocks:
          - type: paragraph
            body: >-
              两位创始人把去中心化科学理念和硬核分布式系统工程结合在一起，这种组合并不常见。Vincent Weisser 来自 VitaDAO、Molecule 和 Zuzalu，使 Prime Intellect
              的网络根植于开源、加密原生和前沿科学社区，而不是传统企业软件圈。Johannes Hagemann 带来可被客户读懂的技术运营资历：在 Aleph Alpha
              做过分布式训练，也有系统工程背景，适合销售严肃的后训练基础设施。公开治理披露更薄。最明确的硬证据是 2026 年 1 月 SEC Form D，其中列出 Weisser 和 Hagemann，并把 David
              Katz 列为董事。这说明公司已经不只是两位创始人的小店，但没有披露完整董事会名单、持股比例或运营人员规模。法律记录也在 Delaware 注册实体足迹与媒体普遍称其总部位于 San Francisco
              之间分开；这对创业公司很常见，但当尽调追问主要营业地和治理文件时，仍值得标注。
