          label: 容量依赖
        - from: models
          to: prime
          label: 模型兼容性依赖
        - from: partners
          to: prime
          label: 工作流依赖
        - from: hyperscalers
          to: prime
          label: 竞争 / 采购压力
    claimRefs:
      - CR017
      - CR019
      - CR020
      - CR022
      - CR025
      - CR031
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 当前判断取决于如何平衡可见牵引力和仍缺失、却会左右估值的关键证据。
    data:
      nodes:
        - id: scale
          label: 规模：>$100M ARR、6,000+ 客户
        - id: proof
          label: 证明：真实产品 + 具名工作流结果
        - id: gaps
          label: 缺口：毛利率、客户集中度、股权结构表、控制能力
        - id: price
          label: 价格：$1B 标称估值
        - id: call
          label: 判断：继续研究 / 观察
      edges:
        - from: scale
          to: call
        - from: proof
          to: call
        - from: gaps
          to: call
        - from: price
          to: call
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV007
      - CV038
  - id: FV002
    title: 估值敏感性
    type: bar
    summary: 少数私有数据点的影响，远大于宽泛的 AI 市场增长热情。
    data:
      items:
        - label: 毛利率质量
          value: 10
        - label: 客户集中度 / NRR
          value: 9
        - label: 优先股堆叠清晰度
          value: 8
        - label: 信任控制成熟度
          value: 8
        - label: 品类增长叙事
          value: 5
    claimRefs:
      - CV015
      - CV018
      - CV020
      - CV029
      - CV030
  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 公开证据支持一组结果区间，而不是单一精确标记。
    data:
      items:
        - label: 悲观 EV 锚点
          low: 0.6
          high: 0.9
          unit: $B
          note: 信任缺口、估值压缩或客户集中度问题浮现
        - label: 基准 EV 锚点
          low: 0.9
          high: 1.3
          unit: $B
          note: 增长守住，但证据缺口逐步补上
        - label: 乐观 EV 锚点
          low: 1.3
          high: 2.2
          unit: $B
          note: 毛利率、留存和企业级强化得到验证
    approximationNotes: 这些区间是根据公开证据和可比公司叙事得出的情景锚点，不是建模后的公允价值。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV039
      - CV040
  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: 面向投委会的计分卡，覆盖规模、证明、经济性、风险和证据质量。
    data:
      items:
        - label: 收入 / 需求证明
          value: High
          unit: signal
          status: publicly strong
        - label: 护城河 / 工作流差异化
          value: Medium-High
          unit: signal
          status: credible but still forming
        - label: 经济性能见度
          value: Low
          unit: signal
          status: publicly thin
        - label: 股权结构表清晰度
          value: Low
          unit: signal
          status: Form D complicates picture
        - label: 公开证据质量
          value: Medium
          unit: signal
          status: good but incomplete
    claimRefs:
      - CV004
      - CV006
      - CV007
      - CV014
      - CV029
      - CV037
