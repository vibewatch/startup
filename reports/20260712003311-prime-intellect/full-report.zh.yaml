            body: >-
              只看公开证据，Prime Intellect
              的财务表现很亮眼，但只被部分承保。公司似乎拥有多个变现界面、真实的客户结果证明，以及足够资本去主动进攻大市场。这些都是真优势。但未回答的问题，正好是把标题式增长公司和持久复利公司区分开的那些：扣除算力成本后的毛利率、收入集中度、支持强度、流失、扩张，以及
              Form D 之后资本结构堆叠的真实形状。最佳总结是，Prime Intellect
              已经从投机性产品故事跨过门槛，变成可见收入业务；但公开证据仍支持对收入质量和资本效率采取“继续研究”姿态。私有数据室审查可能显著改善这个判断，但公开层面尚未发生。这是一个正面的起点，但还不是完整的承保案例。严肃投资人今天若要把公开
              ARR 叙事视为可用于承保，可能仍需要管理层报告、客户队列和供应商成本细节。
