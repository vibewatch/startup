      - number: '4.3'
        title: 成本结构与资本充足性
        blocks:
          - type: paragraph
            body: >-
              即使 Prime Intellect 比拥有或租赁大规模专用 GPU 队列的 GPU 新型云厂商更轻资产，它的成本模型几乎肯定仍以算力为重。产品需要第三方 GPU 容量、推理服务、编排、存储和沙盒运行时。文档暗示
              Prime 试图通过共享硬件和多租户 LoRA 部署提升利用率，这是正确的经济直觉，但公开来源没有披露毛利率或贡献利润率。融资深度部分抵消了这个不确定性。公司在 2024 年获得种子资金，2025 年初完成
              $15 million 延展融资，2026 年 1 月披露近 $50 million Form D 发行，随后在 2026 年 7 月宣布 $130 million Series A
              轮。这意味着资本充足性不太可能是近期问题；真正问题是，在市场压缩定价或迫使公司投入更重的企业支持与供应商承诺之前，资本能否转化为持久、高效率增长。独立 CIO
              评论提供了第二个视角：企业买方越来越会按生存能力给小型 AI 基础设施供应商打分，而不只是看功能或 token 价格。
