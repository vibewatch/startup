              FTC 围绕 AI 风险的指引，也说明小型 AI 供应商必须在采购中克服真实的交易对手和锁定担忧。这并不会推翻 Prime
              的牵引，而是重新定义它。公司看起来有真实客户需求，也有以其年龄看异常具体的公开参考；但仍缺少留存和集中度披露，无法把采用动能完全转化为可承保的客户基础。因此，审慎尽调姿态应是：对当前采用正面，对持久性谨慎，对集中度风险明确未完成。这个缺口会直接影响任何想区分黏性平台采用和临时实验的投资人。
