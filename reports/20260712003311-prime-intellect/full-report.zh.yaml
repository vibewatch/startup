    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入流与定价界面
        blocks:
          - type: paragraph
            body: >-
              Prime Intellect 的收入模型，比“AI API 创业公司”这个简单标签更分散。公开材料至少描述了五个可变现界面：按需算力、预留集群、托管 RL 训练、评估，以及通过 serverless
              和专用部署提供的推理服务。文档明确说明，核心训练收入按用量计费，对输入、输出和训练使用每百万 token 定价；官网则指向专用推理和集群采购上的独立企业容量承诺。这种混合很重要。纯推理供应商的生死取决于
              token 价格和利用率。相比之下，Prime Intellect 试图通过为整个模型优化闭环收费，拿到更大一部分客户工作流。财务上行来自更大的账户扩张；下行则是成本基础更复杂、单位经济模型更难对标。
