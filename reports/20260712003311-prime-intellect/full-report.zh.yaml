        blocks:
          - type: paragraph
            body: >-
              Prime Intellect
              在定性上很容易让人喜欢。以公司年龄看，它已有真实收入规模；围绕企业可控开放模型工作流的产品逻辑可信；新的具名证据也证明其技术栈能改善真实任务。这是正向逻辑。更难的问题是，当前价格是否已经捕捉了太多上行。按据报道
              $1 billion 估值和超过 $100 million 年化收入计算，标题进入点约为 10x ARR。对一家高速增长、具战略性的 AI
              基础设施公司来说，这个倍数并不荒谬，但也不显得便宜。反向逻辑是，毛利率、集中度、留存和优先股堆叠的公开证据仍落后于增长叙事。因此，投资人不是在困境价格下买一颗隐藏宝石；他们是在为一家仍需在私有尽调中证明若干关键估值品质的公司支付有意义的倍数。
