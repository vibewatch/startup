chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、产品范围与战略逻辑
        blocks:
          - type: paragraph
            body: >-
              Prime Intellect 把自己定义成 AI 基础设施公司，而不是销售单一封闭 API 的模型实验室。从官网、Lab 发布材料到 Series A
              公告，公司都反复强调一套全栈系统：帮助客户在私有工作流上训练、部署并持续改进自有模型。这个组合覆盖 GPU 接入、RL
              环境、托管训练、安全沙盒、评估和推理，范围明显宽于单一模型端点。战略信息同样直接：企业应该掌握自己的优化闭环，而不是把产品数据和工作流知识交还给 OpenAI、Anthropic
              或其他前沿模型实验室。主权逻辑贯穿 Prime Intellect
              的研究项目、基础设施栈和商业话术，也解释了为什么公司把服务拆成模块化组合，而不是强迫买方签一个单体合同。公开材料同时描述了自助式和企业路径，从按需算力、serverless API，到专用部署和预留集群。
