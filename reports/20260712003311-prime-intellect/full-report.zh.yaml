      - number: '3.2'
        title: 直接开放模型同业
        blocks:
          - type: paragraph
            body: >-
              最接近的独立同业都在攻打同一个机会的相邻切片。Together AI 是最宽的直接竞争对手，因为它在一个 AI 原生云旗帜下覆盖推理、模型塑形、存储、代码沙盒和大规模基础设施。Baseten
              更聚焦生产推理，但它能部署在自有云或客户云里；只要数据控制和企业姿态重要，它就高度相关。Modal
              是强大的相邻竞争者，因为它已经销售低延迟推理、批处理任务和沙盒，并且明确加码训练和强化学习工作流。Replicate 更轻量、更偏开发者；Anyscale 则通过分布式训练和 Ray 原生执行竞争。Prime
              Intellect 的独特性在 RL 环境、评估闭环和自我改进智能体重要时最强，但这个楔子旁边，其他独立供应商的包装正在越来越趋同。
