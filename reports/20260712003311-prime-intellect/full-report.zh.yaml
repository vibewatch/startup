  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与纳入支出
        blocks:
          - type: paragraph
            body: >-
              Prime Intellect 应放在托管 AI 基础设施层里分析，而不是整个 AI 经济。公司的产品范围覆盖算力采购、RL 环境、安全沙盒、托管训练、评估和推理部署，位置高于原始 GPU
              租赁、低于应用层，也不同于单纯调用前沿模型 API。纳入支出，是企业为掌握更多模型优化闭环而支付的钱：实验、后训练、评估、部署，以及围绕特定工作流的持续改进。排除项包括前沿预训练预算、没有 Prime
              式编排的通用公有云 IaaS，以及买方从不触碰模型栈的纯 SaaS 副驾驶产品。这个框架重要，因为许多已发布的 AI 市场数字包含半导体、公有云平台收入和通用企业 AI 软件，而 Prime Intellect
              不可能现实地吃下这些预算。真正的替代集合更窄：AWS Bedrock、Azure Foundry 和 Azure OpenAI、Google 的智能体平台、Together 式开放模型云，以及企业内部自托管栈。
