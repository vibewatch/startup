  - calloutType: "risk"
    title: "The Generative AI Inference Tax Threatens Non-Designer SaaS Unit Economics"
    body: "Canva's 2026 revenue growth forecast revision from 30% to 20% highlights the structural margin pressure created by serving frontier model AI tasks to 265 million users. While in-house model development and the Leonardo.AI acquisition reduced serving costs by 90%, sustained competitive parity against Adobe Firefly and Google Pics requires heavy ongoing capital allocation."
