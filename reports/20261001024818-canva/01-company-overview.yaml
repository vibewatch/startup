company:
  name: "Canva"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Canva's own pages establish a 2013 launch, an online design-and-publishing product, and 220M+ monthly active users; 2026 secondary sources report higher scale, approximately $4B of ARR, and a $42B secondary valuation. Capitalization, leadership, and adverse operating changes remain less certain because the assigned pool lacks corporate filings, audited financials, and direct investor materials."
sections:
  - id: "identity-and-product"
    title: "Identity, Product, and Reach"
    body: >-
      Canva describes itself as an online design and publishing tool launched in
      2013. Its business combines a broad free product with paid subscriptions and
      content licensing: Free Content licenses can be issued at no cost, while Pro
      Content is paid for per use by free users or included with a valid
      subscription. The official About page displays 220M+ monthly active users,
      while a 2026 comparison article reports 265M monthly active users and more
      than 31M paid subscribers at the end of 2025. Those figures are not treated
      as one continuous series because the company page has no stated metric date
      and the third-party report relies on other publications. Current
      headquarters, legal-entity structure, stage, office count, and headcount are
      not reliably established by the assigned evidence.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO004"
      - "CO005"
      - "CO006"
    tableRefs:
      - "TO001"
  - id: "capital-and-scale"
    title: "Capital, Valuation, and Reported Scale"
    body: >-
      One adverse secondary analysis reports $589M raised across 19 rounds,
      backing from Blackbird Ventures, Sequoia Capital, and General Catalyst, and
      a $42B implied valuation in an August 2025 employee share sale. The same
      article reports approximately $4B of ARR at the end of 2025. These are
      distinct measures: cumulative funding is not cash available, a secondary
      valuation is not a priced primary financing, and ARR is not accounting
      revenue. The assigned pool provides no audited statements, capitalization
      table, debt schedule, credit agreement, or direct investor announcement to
      corroborate the figures. They are therefore useful orientation points, not
      verified cover metrics. The named-investor map is intentionally partial and
      does not imply board seats, voting rights, ownership percentages, or current
      holdings.
    claimRefs:
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO003"
  - id: "leadership-and-governance"
    title: "Leadership and Governance Coverage"
    body: >-
      The assigned pool supports the three-founder identity through secondary
      reporting: Melanie Perkins, Cliff Obrecht, and Cameron Adams. It also
      identifies Perkins as CEO in connection with a reported 2026 investor
      update, but it does not reliably establish current titles for Obrecht or
      Adams, the board roster, independent directors, succession planning, or
      voting control. Key-person exposure is consequently an analytical concern
      rather than a quantified governance finding. A March 2026 reduction of 10
      of 12 technical-writer roles is reported by the same secondary source,
      itself citing other publications, and has no direct company confirmation in
      the pool. Diligence should obtain a current organization chart, board and
      committee records, founder-control terms, management retention data, and a
      complete workforce reconciliation before relying on leadership or
      headcount claims.
    claimRefs:
      - "CO010"
      - "CO015"
    tableRefs:
      - "TO002"
  - id: "commercial-signals-and-milestones"
    title: "Commercial Signals, Milestones, and Adverse Change"
    body: >-
      Public pricing reports show that Canva's commercial packaging was moving
      during 2026. CloudEagle listed Pro at $120 per user annually in January,
      while Style Factory listed $144 annually in July; Enterprise remained
      sales-quoted in two third-party sources. These are publisher snapshots, not
      executed customer contracts, and the differing dates prevent a clean
      like-for-like price comparison. More materially, ValueAddVC reports that
      Canva reduced its 2026 revenue-growth forecast from 30% to 20% in a Q2
      investor update as AI serving costs weighed on economics. Because the pool
      does not contain that investor update, the revision remains
      second-hand. Canva's August 2026 privacy-policy update is directly
      observable and provides a dated legal milestone, but it does not resolve
      current regulatory, litigation, outage, or incident status.
    claimRefs:
      - "CO003"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO016"
    figureRefs:
      - "FO001"
