evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: >-
      Current executive titles, board membership, committee structure, founder biographies, succession plans, and
      voting-control terms.
    whyItMatters: >-
      Without primary governance records, founder-market fit, functional coverage, and key-person exposure cannot be
      assessed reliably.
    diligencePath: >-
      Request the current organization chart, board and committee roster, shareholder agreement, biographies, retention
      terms, and succession plan.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: stakeholder-and-investor-map
    missingEvidence: >-
      Complete cap table, current ownership, voting rights, board rights, invested amounts, and secondary-sale
      participation.
    whyItMatters: Named investors alone do not establish economic exposure, governance influence, or exit incentives.
    diligencePath: >-
      Obtain the current cap table, financing documents, shareholder register, board consents, and secondary transaction
      records.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: company-snapshot
    missingEvidence: >-
      Primary confirmation of current headquarters, legal entities, stage, headcount, office locations, and paid
      subscriber mix.
    whyItMatters: >-
      These fields drive operating-scale and governance judgments but cannot be substituted with product reach or
      undated marketing figures.
    diligencePath: >-
      Request corporate registry extracts, entity chart, HR roster, office list, current investor materials, and
      subscription cohort reports.
    relatedQuestionRefs:
      - QO002
      - QO010
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: capital-and-financials
    missingEvidence: >-
      Audited financial statements, direct investor updates, financing schedule, debt and credit documents, and
      transaction terms for the 2025 share sale.
    whyItMatters: >-
      Secondary reports cannot reconcile ARR to accounting revenue, funding to cash available, or secondary valuation to
      enterprise value.
    diligencePath: >-
      Request audited accounts, board-approved investor materials, bank and debt schedules, round documents, and the
      employee share-sale memorandum.
    relatedQuestionRefs:
      - QO004
  - type: conflicting-data
    severity: minor
    topic: scale-and-pricing
    missingEvidence: >-
      Dated company definitions for monthly active users, paid subscribers, and plan pricing by geography and billing
      cadence.
    whyItMatters: >-
      The pool contains 220M and 265M user figures and $120 and $144 annual Pro prices without aligned dates,
      definitions, or markets.
    diligencePath: >-
      Obtain dated KPI definitions and archived official price cards for the relevant markets, then reconcile each
      publisher snapshot.
    relatedQuestionRefs:
      - QO002
      - QO005
  - type: missing-source
    severity: material
    topic: adverse-events
    missingEvidence: The Q2 2026 investor update and direct company records for the reported technical-writer layoffs.
    whyItMatters: Both adverse claims currently depend on one secondary article that cites other publications.
    diligencePath: >-
      Request the investor update, workforce-change communications, affected-role reconciliation, and management
      explanation.
    relatedQuestionRefs:
      - QO008
  - type: conflicting-data
    severity: material
    topic: market-share
    missingEvidence: >-
      Reconciliation between Datanyze's 12.47% graphics market share estimate and Forrester's 17.3% 2026 design market
      share estimate.
    whyItMatters: >-
      Different market boundaries (graphics tools vs. digital visual design platforms) produce diverging market share
      benchmarks that impact TAM penetration calculations.
    diligencePath: >-
      Obtain underlying report methodology documents from Datanyze and Forrester to align category definitions and
      sample populations.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: segment-revenue
    missingEvidence: Audited financial breakdown of ARR and subscriber revenue by product tier (Canva Pro vs. Teams vs. Enterprise).
    whyItMatters: >-
      Without audited segment revenue, enterprise net revenue retention and consumer churn cannot be verified
      independently prior to IPO.
    diligencePath: >-
      Review audited income statements and S-1 / prospectus disclosures when Canva files for its planned public
      offering.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: enterprise-pricing
    missingEvidence: >-
      Audited enterprise contract discount schedules, average realized selling prices per seat, and custom volume
      concessions for Canva Enterprise versus Adobe Creative Cloud and Figma Organization agreements.
    whyItMatters: >-
      Reported list pricing of $10 to $18 per user per month for Canva Teams masks negotiated enterprise tier pricing
      and custom volume discounting that determine true net retention and gross margin impact.
    diligencePath: >-
      Review redacted enterprise customer MSA exhibits, customer procurement interview notes, and vendor benchmark
      databases covering accounts with over 1,000 design seats.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited cohort-level net revenue retention (NRR), gross customer churn, and customer acquisition cost (CAC)
      payback periods across self-serve and enterprise tiers.
    whyItMatters: >-
      Without audited cohort retention curves and CAC payback data, underwriters cannot verify whether self-serve
      freemium conversion economics remain sustainable as paid marketing and AI compute costs increase.
    diligencePath: >-
      Request audited management accounts and cohort retention schedules by customer tier under NDA during pre-IPO
      financial diligence.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: ai-cost-structure
    missingEvidence: >-
      Audited gross margin impact and exact ongoing compute expenditures for Leonardo.AI in-house infrastructure versus
      frontier-model third-party API contracts.
    whyItMatters: >-
      Canva reported a 90% reduction in AI serving costs following the Leonardo.AI acquisition and proprietary model
      deployment, but the true net margin profile and capex requirements remain unverified by third-party auditors.
    diligencePath: >-
      Inspect infrastructure hosting agreements, GPU compute commitments, and cost-of-goods-sold (COGS) breakout
      schedules in the pre-IPO data room.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: minor
    topic: valuation-and-capital
    missingEvidence: >-
      Audited balance sheet showing unrestricted cash balances, short-term investments, and complete capitalization
      table share-class liquidation preferences.
    whyItMatters: >-
      Secondary market transactions route through SPVs and forward contracts without full balance sheet disclosure,
      obscuring effective cash runway and preference stacks.
    diligencePath: >-
      Examine Canva's latest audited balance sheet and capital table details via formal investor information rights or
      pre-IPO prospectus filings.
    relatedQuestionRefs:
      - QI007
      - QI008
  - type: private-evidence-only
    severity: material
    topic: generative-ai-model-mix
    missingEvidence: >-
      Granular breakdown of API inference routing between proprietary Leonardo.AI checkpoints and external frontier APIs
      (OpenAI/Anthropic) across Magic Studio features.
    whyItMatters: >-
      Directly determines Canva's exposure to gross margin compression, third-party model dependency, and compute unit
      economics at 265M active user scale.
    diligencePath: >-
      Request engineering architecture documentation detailing inference orchestration, model cache hit rates, and
      per-task compute cost attribution across active tiers.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Tier-level NRR, GRR, logo churn, renewal rates, contract duration, active paid seats, and top-customer revenue
