      education utilization.
    whyItMatters: Overlapping populations and inconsistent measurement periods prevent reliable conversion or engagement analysis.
    diligencePath: >-
      Request metric definitions, period-end reconciliations, duplicate-account treatment, and segment-level active-user
      counts.
    relatedQuestionRefs:
      - QU002
  - type: private-evidence-only
    severity: material
    topic: ai-training-provenance-and-unlearning
    missingEvidence: >-
      Audited machine unlearning verification and copyright training data provenance reports for proprietary Canva
      Design Models and Leonardo.ai datasets.
    whyItMatters: >-
      Without independent verification of training data sources and algorithmic deletion mechanics, enterprise clients
      face unquantifiable copyright infringement and regulatory compliance exposure under evolving EU AI Act mandates.
    diligencePath: >-
      Request third-party training data audit documentation and contractual representations regarding unlearning
      capabilities during enterprise procurement review.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: minor
    topic: secondary-cap-table-liquidation-stack
    missingEvidence: >-
      Detailed capitalization table schedule detailing liquidation preferences, option pool expansion terms, and share
      class seniority across Series A through secondary tenders.
    whyItMatters: >-
      Secondary buyers acquiring synthetic exposure through SPVs lack transparency into seniority subordination relative
      to institutional preferred stockholders.
    diligencePath: >-
      Condition late-stage secondary participation on formal confirmation of share class rights, fee waterfalls, and
      transfer restriction waiver documentation.
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-segment-margins
    missingEvidence: >-
      Audited GAAP financial statements detailing gross margins, net income, and AI compute expenditures by product
