    whyItMatters: >-
      The public sample is selective and cannot establish customer breadth, production durability, or reference quality
      across segments.
    diligencePath: >-
      Obtain a customer roster segmented by tier and geography, then reference-check a stratified sample of new,
      renewed, expanded, and churned accounts.
