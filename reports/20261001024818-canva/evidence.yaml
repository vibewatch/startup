    whyItMatters: >-
      Current disclosures stem from executive interviews and secondary tender circulars; unverified gross margin
      compression from AI serving costs directly impacts terminal multiples.
    diligencePath: >-
      Review pre-IPO S-1/F-1 registration statements or request audited financial statements and cohort margin data in
      pre-IPO data rooms.
    relatedQuestionRefs:
      - QV007
