    whyItMatters: >-
      Headline user scale cannot establish durable recurring revenue or show whether enterprise expansion offsets
      self-serve churn.
    diligencePath: >-
      Request cohort retention schedules, renewal waterfalls, active-seat utilization, contract vintages, and top-20
