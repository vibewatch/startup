company:
  name: "Canva"
chapter:
  number: 6
  title: "Customers"
  summary: "Canva's customer surface spans individual creators, business teams, enterprises, and education institutions, while assigned sources place global monthly usage above 260 million around the end of 2025. Public proof is strongest for broad adoption and selected Korean deployments; tier-level retention, revenue concentration, contract duration, and cohort economics remain material diligence gaps."
sections:
  - id: "segments-and-economic-roles"
    title: "Segments and Economic Roles"
    body: "Canva reaches several customer populations through one product-led surface rather than a single enterprise sales motion. Third-party analysis describes a progression from free individual use to Pro, team, and enterprise subscriptions, while company-issued materials document education and workplace use. That breadth is strategically useful because creators and students can introduce the product before centralized procurement begins. It also weakens the interpretability of headline monthly-active-user figures: the assigned evidence does not separate paid users, active enterprise seats, education users, or casual free users on a consistent basis. The clearest current paid-adoption datapoint is an uncorroborated third-party report of more than 31 million paying subscribers, roughly 12% of monthly users."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU010"
    tableRefs:
      - "TU001"
  - id: "adoption-and-reference-proof"
    title: "Adoption Trajectory and Reference Proof"
    body: "Assigned independent sources place global monthly active use between 260 million and more than 265 million around the end of 2025, but the underlying measurement method and unique-user denominator are not public in this evidence set. Fresher company-issued evidence is more specific in Korea: monthly active users reportedly more than doubled year over year, and an education partnership covered 2.9 million teachers and students across 11 of 17 cities and provinces. NEWNEEK is the strongest named commercial reference, describing company-wide workflow use. A teacher demonstration provides qualitative productivity evidence, but neither case discloses contract value, renewal behavior, deployment duration, or independently measured outcomes."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU011"
      - "CU013"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "expansion-and-durability"
    title: "Expansion Mechanics and Durability"
    body: "The public expansion thesis is plausible but not yet measurable from the assigned sources. A broad free surface can seed individual habits; collaboration, shared assets, and administrative controls can then support team standardization and institutional procurement. This is a mechanism inference, not cohort proof. No assigned source reports net revenue retention, gross revenue retention, logo churn, contract duration, renewal rates, or revenue concentration by customer tier. An adverse analyst report also says Canva reduced its 2026 revenue-growth forecast from 30% to 20% as AI serving costs rose. That is not direct evidence of customer churn, but it raises a diligence question about whether pricing, feature gating, or service economics could affect expansion and renewal."
    claimRefs:
      - "CU012"
      - "CU014"
      - "CU015"
    figureRefs:
      - "FU001"
  - id: "trust-procurement-and-concentration"
    title: "Trust, Procurement, and Concentration Gaps"
    body: "Institutional adoption adds governance requirements that consumer-scale metrics do not capture. Canva's privacy policy says account content and activity can be visible to team owners and that an employer or other administering entity may receive account information and control an administered account. Those controls can enable enterprise governance, but they also make privacy configuration, data handling, and administrator authority part of buyer diligence. PeerSpot offers a current enterprise-review surface, yet the fetched page exposes only a generic summary and answer count rather than named reviewers, verified purchases, or renewal histories. Public evidence therefore cannot quantify top-customer exposure, channel dependence, procurement cycle length, or the share of enterprise use that is centrally contracted."
    claimRefs:
      - "CU008"
      - "CU009"
      - "CU011"
      - "CU014"
      - "CU016"
