    title: "Scale is not retention"
    body: "The assigned evidence supports broad reach and selected deployment examples, but it does not disclose NRR, GRR, churn, renewal, contract length, active enterprise seats, or customer concentration. Those missing denominators prevent a durable-revenue conclusion."
    claimRefs:
