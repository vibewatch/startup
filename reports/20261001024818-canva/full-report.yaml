chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Product, and Reach
        blocks:
          - type: paragraph
            body: >-
              Canva describes itself as an online design and publishing tool launched in 2013. Its business combines a
              broad free product with paid subscriptions and content licensing: Free Content licenses can be issued at
              no cost, while Pro Content is paid for per use by free users or included with a valid subscription. The
              official About page displays 220M+ monthly active users, while a 2026 comparison article reports 265M
              monthly active users and more than 31M paid subscribers at the end of 2025. Those figures are not treated
              as one continuous series because the company page has no stated metric date and the third-party report
              relies on other publications. Current headquarters, legal-entity structure, stage, office count, and
              headcount are not reliably established by the assigned evidence.
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO005
              - CO006
