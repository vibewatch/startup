  - id: FE001
    title: Canva Multi-Tier Scalability and Operating Infrastructure Stack
    type: stack
    summary: >-
      Architectural overview mapping Canva's client interfaces, in-memory gateway caching, generative AI services,
      streaming data pipelines, and analytical data warehouse.
    claimRefs:
      - CE002
      - CE011
      - CE015
    approximationNotes: >-
      Synthesizes engineering disclosures from Canva Engineering and InfoQ on distributed session authentication, CDC
      data pipelines, and in-house model hosting.
    data:
      layers:
        - label: Client & Presentation Surface
          detail: Web browser, native mobile, and desktop application interfaces
          modules:
            - Web Browser Application (React / TypeScript)
            - Native Mobile Apps (iOS / Android)
            - Desktop Native Wrappers (macOS / Windows)
        - label: Application Gateway & Authentication
          detail: Edge routing and distributed session revocation caches
          modules:
            - API Gateway Instances
            - In-Memory Sorted Binary Revocation Arrays (87.5% memory reduction)
            - OAuth 2.0 & Enterprise Identity Connectors
        - label: Core Visual Layout & Rendering Engine
          detail: Client-side document state management and high-concurrency canvas rendering
          modules:
            - Document State Management Engine
            - WebAssembly Vector Rendering Core
            - Template & Multi-Page Composition Pipeline
        - label: Generative AI & Model Serving Plane
          detail: Hybrid inference combining in-house fine-tuned models with commercial API gateways
          modules:
            - Proprietary Leonardo.AI Generative Model Stack
            - In-House Fine-Tuned Domain Models (90% serving cost reduction)
            - External Frontier Model Gateway (OpenAI / Anthropic fallback)
        - label: Streaming Data & Event Ingestion
          detail: Continuous change data capture streaming table mutations into analytical stages
          modules:
            - AWS Database Migration Service (MySQL CDC continuous replication)
            - Amazon Kinesis Data Streams (DynamoDB change streams)
            - Kinesis Data Firehose with S3 Buffering
        - label: Analytical Warehouse & Durable Persistence
          detail: Multi-petabyte analytical warehouse and distributed durable object storage
          modules:
            - Snowflake Analytical Warehouse (5+ Petabytes)
            - Amazon S3 Immutable 30-Minute Revocation Objects
            - Primary MySQL & Amazon DynamoDB Service Databases
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Evidence-bounded pathway from broad access to governed institutional use; stages are mechanisms, not measured
      conversion cohorts.
    data:
      items:
        - label: 1. Broad access
          detail: Individuals, creators, and education users encounter Canva through free or institution-provided access.
          touchpoints:
            - Free design surface
            - Canva for Education
        - label: 2. Repeated individual use
          detail: Users apply templates and editing tools to recurring personal, classroom, or work content.
          touchpoints:
            - Templates
            - Editing and AI tools
        - label: 3. Paid individual upgrade
          detail: Some users move into paid subscriptions for premium capabilities; public cohort conversion is not disclosed.
          touchpoints:
            - Paid subscription
            - Premium assets and brand tools
        - label: 4. Team collaboration
          detail: Shared work and brand consistency create a reason to coordinate usage across a team.
          touchpoints:
            - Shared content
            - Brand management
        - label: 5. Administrative governance
          detail: Team owners or administering entities can manage account access and content under policy-defined controls.
          touchpoints:
            - Team administration
            - Administered accounts
        - label: 6. Institutional expansion
          detail: >-
            Broader workflow adoption may support more users or use cases, but renewal and expansion rates remain
            undisclosed.
          touchpoints:
            - Cross-workflow adoption
            - Renewal and seat expansion diligence
    approximationNotes: >-
      Conceptual mechanism synthesized from assigned sources; no stage conversion rates, common cohort, or
      time-to-convert data are publicly supported.
