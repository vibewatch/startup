      - number: '1.3'
        title: Leadership and Governance Coverage
        blocks:
          - type: paragraph
            body: >-
              The assigned pool supports the three-founder identity through secondary reporting: Melanie Perkins, Cliff
              Obrecht, and Cameron Adams. It also identifies Perkins as CEO in connection with a reported 2026 investor
              update, but it does not reliably establish current titles for Obrecht or Adams, the board roster,
              independent directors, succession planning, or voting control. Key-person exposure is consequently an
              analytical concern rather than a quantified governance finding. A March 2026 reduction of 10 of 12
              technical-writer roles is reported by the same secondary source, itself citing other publications, and has
              no direct company confirmation in the pool. Diligence should obtain a current organization chart, board
              and committee records, founder-control terms, management retention data, and a complete workforce
              reconciliation before relying on leadership or headcount claims.
