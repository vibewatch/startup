      - number: '1.2'
        title: Capital, Valuation, and Reported Scale
        blocks:
          - type: paragraph
            body: >-
              One adverse secondary analysis reports $589M raised across 19 rounds, backing from Blackbird Ventures,
              Sequoia Capital, and General Catalyst, and a $42B implied valuation in an August 2025 employee share sale.
              The same article reports approximately $4B of ARR at the end of 2025. These are distinct measures:
              cumulative funding is not cash available, a secondary valuation is not a priced primary financing, and ARR
              is not accounting revenue. The assigned pool provides no audited statements, capitalization table, debt
              schedule, credit agreement, or direct investor announcement to corroborate the figures. They are therefore
              useful orientation points, not verified cover metrics. The named-investor map is intentionally partial and
              does not imply board seats, voting rights, ownership percentages, or current holdings.
