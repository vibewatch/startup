        title: Commercial Signals, Milestones, and Adverse Change
        blocks:
          - type: paragraph
            body: >-
              Public pricing reports show that Canva's commercial packaging was moving during 2026. CloudEagle listed
              Pro at $120 per user annually in January, while Style Factory listed $144 annually in July; Enterprise
              remained sales-quoted in two third-party sources. These are publisher snapshots, not executed customer
              contracts, and the differing dates prevent a clean like-for-like price comparison. More materially,
              ValueAddVC reports that Canva reduced its 2026 revenue-growth forecast from 30% to 20% in a Q2 investor
              update as AI serving costs weighed on economics. Because the pool does not contain that investor update,
              the revision remains second-hand. Canva's August 2026 privacy-policy update is directly observable and
              provides a dated legal milestone, but it does not resolve current regulatory, litigation, outage, or
