  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Pillar
      - Thesis Argument
      - Anti-Thesis Counter
      - Thesis-Break Trigger
    rows:
      - - Market & Scale
        - 260M+ MAU and 95% Fortune 500 adoption create massive enterprise flywheel
        - Core user base is largely free consumer/SMB with low monetization depth
        - MAU contraction or plateau in enterprise team conversions
      - - Financial Model
        - Seven consecutive years of profitability fund growth without dilutive capital
        - Gross margins vulnerable to AI model inference costs and API dependencies
        - Operating margin turning negative or persistent gross margin contraction
      - - Product & AI Moat
        - Proprietary Leonardo.AI acquisition and Canva Design Model cut AI costs 90%
        - Commoditization by Adobe Firefly and foundational multimodal LLMs
        - Paid subscriber growth slowing below 15% YoY following price adjustments
      - - Valuation & Entry
        - 10.5x ARR multiple compares favorably to historical 14x+ marks and private peers
        - Deceleration to 20% growth fails to justify multiple expansion above 10x
        - Secondary pricing dropping below $1,400 or secondary supply exceeding 1.5x
