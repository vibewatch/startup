        - Medium
        - Indicates underlying software economics prior to AI inference expansion
        - Reconcile post-AI hosting COGS and Leonardo.AI compute depreciation
      - - Annual Recurring Revenue (ARR)
        - $4.0B to $4.2B
        - High
        - Core scale benchmark confirming top-tier SaaS revenue velocity
        - Verify ARR definition and deferred revenue timing differences
