callouts:
  - calloutType: strength
    title: Exceptional Capital Efficiency and Organic Cash Generation
    body: Canva stands apart from late-stage venture-backed technology peers by compounding ARR to $4.0 billion while sustaining seven consecutive years of profitable operations on under $600 million in total primary equity raised. Its self-serve product-led growth model and emerging LLM referral traffic generate low-CAC user acquisition that protects the company from aggressive sales and marketing burn.
    claimRefs:
      - CI001
      - CI009
      - CI014
  - calloutType: risk
    title: Frontier AI Inference Costs and Platform Competitive Squeeze
    body: The downward revision of Canva's 2026 revenue growth forecast from 30% to 20% highlights the severe margin friction introduced by frontier-model inference costs across 265 million users. While in-house models and Leonardo.AI aim to reduce serving expenses by 90%, the arrival of Google Pics bundled into Google Workspace poses a zero-marginal-cost alternative that threatens Canva's standalone pricing power.
    claimRefs:
      - CI010
      - CI011
      - CI012
