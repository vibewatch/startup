  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与目标市场空间
        blocks:
          - type: paragraph
            body: >-
              Canva 位于数字视觉沟通、演示软件和自动化营销素材制作的交汇处。传统图形软件主要面向专业设计师，要求用户掌握矢量插画、照片精修和印前处理等复杂技能；Canva
              则面向知识工作者、营销团队、教育从业者及需要即用型模板视觉内容的企业员工。其可服务市场包括数字演示文稿、社交媒体营销素材、企业品牌物料、数字白板和轻量视频剪辑。专业工程计算机辅助设计（CAD）、建筑制图、交互式游戏引擎开发及高端影视后期制作，则不属于
              Canva 可争取的预算范围。这一定位让 Canva 的触达范围超出传统设计部门，覆盖所有需要视觉沟通的业务单元；目前其用户遍及全球 190 个国家和地区，月活跃用户达 260 million。
            claimRefs:
              - CM001
              - CM002
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM005
              - CM006
              - CM007
      - number: '2.2'
        title: 市场规模测算视角与收入走势
        blocks:
          - type: paragraph
            body: >-
              评估 Canva 的市场空间，不能只看一个潜在市场总额（TAM），还需结合多个细分市场。在数字内容创作与视觉软件大盘中，行业估算 TAM 约为 $65 billion；核心云端图形和演示工具的可服务空间则超过
              $28 billion。第三方市场追踪显示 Canva 已在该领域占据显著份额。Datanyze 估计，Canva 在核心图形软件市场的份额为 12.47%，全球排名第三，仅次于 Adobe
              Photoshop。Forrester Research 的估算更为激进：Canva 2026 年平面设计市场份额升至 17.3%，18 个月内提高近五个百分点，超过 Adobe Express。Canva
              预计还占数字演示软件市场的 46%，逐步取代独立的传统幻灯片软件。市场扩张带动 Canva 2025 年会计确认收入达到 $3.5 billion （同比增长 35%），ARR 约 $4 billion；B2B
              企业团队贡献超过 $500 million ARR，规模每年翻倍。
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM003
              - CM009
              - CM010
      - number: '2.3'
        title: 买方客群细分与企业预算归属
        blocks:
          - type: paragraph
            body: >-
              Canva 的 GTM 覆盖多层客群，从免费增值 C 端创作者延伸至集中部署的《财富》500 强企业。基础用户包括超过 260 million 月活跃用户和 21 million
              个人付费订阅用户，他们通过企业信用卡或自助结账低门槛订阅。在教育市场，免费 Canva for Education 覆盖 190 个国家和地区，触达全球超过 60 million
              名师生，逐步建立跨代际品牌忠诚度，并融入日常工作流。在企业端，Canva 已进入 95% 的《财富》500 强；员工超过 1,000 人的企业中，超过 130,000
              个团队活跃使用该平台进行设计。Forrester Consulting 的独立研究也验证了企业采购的经济性：Canva Enterprise 三年投资回报率（ROI）达
              414%，通过提高营销效率、减少代理商支出，创造 $7.5 million 综合收益。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.4'
        title: 增长驱动、AI 成本与监管约束
        blocks:
          - type: paragraph
            body: >-
              Canva 扩张视觉沟通平台，受益于几股长期趋势：企业需要更敏捷地传达视觉信息，远程团队协作日益普遍，企业软件也走向消费化。在 2026 年设计趋势分析中，Canva 将「以不完美为设计」（Imperfect
              by Design）列为主要创作潮流；80% 的创作者称正重新掌握创意主导权，77% 认为人工智能是重要的工作流伙伴。但大规模推广 AI 功能也给毛利率带来实质压力。向 265 million
              月活跃用户提供生成式 AI 工具，需要依赖成本高昂的第三方前沿基础模型，严重挤压单位经济效益。Canva 因而在第二季度投资者更新中将 2026 年营收增速预期从 30% 下调至
              20%，以维持商业模式的可持续性。为抵消这笔「推理税」，Canva 依靠自研微调模型和收购 Leonardo.Ai，将 AI 服务成本削减约 90%。与此同时，公司拓展全球业务必须严格遵循欧洲 GDPR 和英国
              GDPR；非上市身份则使详细的同期群订阅用户流失指标无从查证。
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 支撑底稿
        blocks:
          - type: callout
            title: 超越传统图形工具，拿下演示软件市场
            body: Canva 借助云端协作和多设备访问，逐步替代传统桌面工具，覆盖 260 million 月活跃用户，并拿下演示软件市场 46% 的份额。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
          - type: callout
            title: AI 推理成本挤压毛利率
            body: Canva 向 265 million 用户快速铺开生成式 AI，推高推理成本并压低营业利润率，促使公司把增长预期从 30% 下调至 20%，同时加快自研模型。
            calloutType: risk
            claimRefs:
              - CM011
              - CM012
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与核心市场细分
        blocks:
          - type: paragraph
            body: >-
              Canva 面对的竞争者包括专业设计平台、传统创意软件巨头、专业演示工具和轻量社媒制作产品。专业 UI/UX 与产品设计方面，Figma 在产品设计团队中的渗透率超过 86%，2026 年第一季度收入为
              $333.4 million。它服务的是不同的矢量工程设计赛道，并不直接争夺 Canva 的核心营销用户。Adobe Express 是最直接的传统巨头威胁，每月 $9.99 即可使用 Creative
              Cloud 资产同步和商用安全的 Firefly 生成模型。Visme 等相邻产品侧重数据密集型信息图和实时表格连接；Storyflow
              等替代工作台则切入早期创意规划和策略预制作，而非最终图形交付。Gamma、Alai 等新兴 AI 原生演示平台通过自适应重排版面、自动分享文档，挑战 Canva 的幻灯片工作流。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP009
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP009
              - CP010
      - number: '3.2'
        title: 功能矩阵与垂直细分工作流替代方案
        blocks:
          - type: paragraph
            body: >-
              Canva 覆盖社媒图文、营销物料、视频剪辑、演示文稿和在线文档，精选模板超过 100 万套。但通用模板模式也留下体验短板，垂直竞品正从这些边界切入。Alai、Gamma
              等专用幻灯片工具面向复杂演示流程，提供理解上下文的版式生成、元素自动重排，以及按页追踪观众流失的互动分析。企业沟通方面，Prezent 等平台面向重要投资者和高管汇报，强调企业级品牌管控，以及可双向导出
              PowerPoint、避免排版错乱。相比之下，Canva 的演示文稿多为静态输出；Magic Design 只能处理简单 Prompt，版式改变后仍需人工重排。尽管有这些垂直场景短板，非专业设计者使用 Canva
              制作涵盖 100+ 预设规格的多格式营销素材，速度仍比专业设计工具快 3x 以上。
            claimRefs:
              - CP004
              - CP005
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP004
              - CP005
              - CP007
              - CP010
              - CP012
      - number: '3.3'
        title: 定价包装模式与总体拥有成本（TCO）
        blocks:
          - type: paragraph
            body: >-
              设计软件各异的打包和定价方式，反映出目标买方及企业协作模式的差别。Canva 按用户收费：Canva Pro 每月 $10 至 $18，Canva Teams 和企业方案每位用户每月 $10 至
              $25；参与协作的每位团队成员都需购买付费许可证。Figma 则按席位收费，年付方案下每位编辑者每月
              $16，查看者、项目相关方和高管评审者可免费使用，且席位不限。在企业里，专业团队制作资产、跨职能人员参与评审，Figma 的查看者模式能显著降低总体拥有成本（TCO）。Adobe Express 为现有
              Creative Cloud 订阅用户提供捆绑权益，边际成本为零；独立订阅每月 $9.99，直接挤压 Canva 的 SMB 客群。VistaCreate、Snappa 等低价替代品每月收费
              $10，提供精简的静态图形制作，面向不需要 Canva 企业协作功能的价格敏感型创作者。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP015
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP015
      - number: '3.4'
        title: 护城河韧性、转换成本与颠覆风险
        blocks:
          - type: paragraph
            body: >-
