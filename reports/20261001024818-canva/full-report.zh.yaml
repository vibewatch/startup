      - number: '4.3'
        title: 资本充裕度、融资独立性与估值回调
        blocks:
          - type: paragraph
            body: >-
              Canva 是全球资本效率最高的规模化软件公司之一，连续七年保持正经营现金流和会计盈利。自成立以来，公司累计获得的一级市场风险投资不足 $600
              million；基础设施、全球地产扩张和战略并购主要由内部经营现金流支撑，而非靠频繁增发股权融资。最近一次定价的一级股权融资发生在 2021 年 9 月，投后估值为 $40
              billion。此后股权转让均为员工老股二级交易，包括 2025 年 8 月一轮估值 $42 billion 的流动性交易。2026 年软件二级市场估值倍数下行，加上投资者审视 AI
              算力支出的可持续性，促成多次独立估值调整。经第三方独立评估后，主要机构风投股东 Blackbird Ventures 和 AirTree Ventures 将内部估值下调 17%，从约 $42 billion
              降至 $34.9 billion。Canva 用于员工股份发行的内部估值也在过去 12 个月从 $38.9 billion 降至 $31
              billion；二级交易平台反映买方需求疲软，买方意向与待售老股供应的比例估计仅为 0.7:1。这轮估值回调说明，Canva 虽能靠自身经营造血，但在预计于 2027 年 IPO 前，公开市场投资者仍会严格审视其
              AI 投入后的利润率能否持续。
            claimRefs:
              - CI012
