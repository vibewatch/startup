      - number: '4.4'
        title: 投资评估与尽调核心障碍
        blocks:
          - type: paragraph
            body: >-
              Canva 的投资画像突出三点：经常性收入规模大、历史资本效率高，并已渗透至 95% 的《财富》500 强企业。公司连续七年保持经营盈利，ARR 增至 $4.0 billion，为许多 IPO
              前软件公司难以企及的防御缓冲。此外，Canva 的机构治理较为严格：隐私政策清晰，禁止在 Canva Education 账户投放广告，限制对学生的商业画像和定向推广，并管理与 Affinity
              等收购产品之间的跨应用数据流动。但投资者若要以高估值出资，仍有几项关键尽调障碍。第一，管理层把 2026 年营收增速指引从 30% 下调至 20%，说明持续提供生成式 AI
              功能的成本仍长期威胁软件业务的营业利润率。第二，Google Pics 正式推出并原生集成至 Google Workspace 和个人 AI 订阅方案，形成零边际成本的有力替代品，可能削弱 Canva
              从免费用户转化付费用户的能力。最后，Canva 仍未上市，并通过特殊目的载体（SPV）间接发行股份，投资者无法查阅经审计的同期群净收入留存率（NRR）、获客回本周期（CAC
              Payback）及经核证的毛利率拆分数据。补齐这些私有数据缺口，是机构投资前的核心前提。
