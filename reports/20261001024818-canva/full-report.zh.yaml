            - 中
            - 中
            - 成熟
            - label: 低
              tone: positive
        - label: IPO 前流动性与 SPV 条款
          values:
            - 资本 / 治理
            - 高
            - 中
            - 较低
            - label: 高
              tone: warning
  - id: FV001
    title: 投资判断逻辑
    type: flow
    summary: 该框架把用户规模和现金流表现与老股估值倍数约束相连，最终导向买入建议。
    data:
      nodes:
        - id: scale
          label: 规模与市场领军地位
          description: 立足免费增值视觉沟通领域，MAU 达 260M+、ARR 达 $4B
        - id: profitability
          label: 持续现金流创造
          description: 自助 PLG 引擎支撑公司连续 7 年盈利
        - id: ai-cost-drag
          label: AI 推理成本承压
          description: 为应对 AI 单位经济压力，公司将 2026 年营收增速预期从 30% 下调至 20%
        - id: valuation-multiple
          label: 老股估值倍数纪律
          description: $42B 估值对应 ARR 的 10.5x；要撑住这一估值，增长需持续在 20% 以上
        - id: governance-ipo
          label: IPO 筹备关键里程碑
          description: 聘任 CFO 并开展员工要约收购，标志 IPO 前架构准备就绪
        - id: verdict
          label: 投资建议
          description: 中等置信度买入，投资期限 2-4 年；持续关注 AI 利润率和老股流动性
      edges:
        - from: scale
          to: profitability
        - from: profitability
          to: ai-cost-drag
        - from: ai-cost-drag
          to: valuation-multiple
        - from: valuation-multiple
          to: governance-ipo
        - from: governance-ipo
          to: verdict
    approximationNotes: 梳理如何将经营基本面优势与估值约束纳入投资判断。
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
      - CV005
      - CV014
