      - number: '1.3'
        title: 管理层与公司治理信息覆盖
        blocks:
          - type: paragraph
            body: >-
              二手报道支持三位联合创始人的身份：Melanie Perkins、Cliff Obrecht 和 Cameron Adams。报道还将 Perkins 与一份据称于 2026 年发布的投资者更新联系起来，称她担任
              CEO；但现有资料无法可靠确认 Obrecht 或 Adams
              的现任职务、董事会名单、独立董事席位、继任安排或投票控制权。因此，关键人物依赖是分析层面的担忧，并非量化后的治理结论。同一二手信源（转引其他出版物）还称，公司于 2026 年 3 月裁撤 12
              个技术文档撰写岗位中的 10 个；资料库没有公司的直接确认。要据此评估管理层或员工规模，尽调前还需取得最新组织架构图、董事会及委员会记录、创始人控制权条款、管理层留任数据，以及完整员工名册的核对底稿。
            claimRefs:
