      - number: '4.2'
        title: 单位经济模型、GTM 效率与 AI 推理成本压力
        blocks:
          - type: paragraph
            body: >-
              截至 2025 年底，Canva 月活跃用户超过 265 million，付费订阅用户超过 31 million，付费渗透率为 10.7% 至
              11.7%，自然转化表现强劲。随着对话式搜索和发现渠道兴起，Canva 直接接入主流基础模型聊天机器人。用户与 Canva 的 ChatGPT 集成产品进行了超过 26 million 次对话，使 AI
              对话助手成为有效的漏斗顶部引流渠道。第三方市场分析预计，Canva 年化营收运行率（Run-rate）在 2026 年初达到 $4.2 billion，同比增长 40%。但向 265 million
              活跃账户快速推广生成式 AI，严重挤压毛利率。Canva 在 2026 年第二季度投资者更新中把全年营收增速预测从 30% 下调至 20%，并明确将原因归于 OpenAI 和 Anthropic 等第三方前沿
              AI 模型供应商收取过高的推理服务费。大众创意工具每次会话都会产生大量推理调用，依赖外部基础模型 API 可能侵蚀此前长期维持在 65% 左右的软件毛利率。为应对这一结构性成本压力，Canva
              优先投入工程资源开发自研生成架构，并整合收购 Leonardo.AI 获得的技术资产。Canva 称，自研模型投入使用后，AI 任务服务成本降低约 90%，单位经济效益因此趋稳，为后续扩展产品功能打下基础。
