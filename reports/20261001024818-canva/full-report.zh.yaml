        - 底层多模态大模型造成严重同质化；年内两次下调营收预测
        - 20%
    notes: 依据员工二级交易估值和修正后的增长指引，构建两年期前瞻情景模型。
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV013
