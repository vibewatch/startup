      - number: '5.3'
        title: 云架构、会话可扩展性与分布式数据底座
        blocks:
          - type: paragraph
            body: >-
              为支撑超过 200 million 月活跃用户及高并发实时编辑，Canva 在 Amazon Web
              Services（AWS）上搭建了专用云基础设施。扩展能力的一项关键改进，是重构分布式会话撤销架构。网关部署期间，Canva 不再把数亿次身份验证检查请求都送往中心化关系型数据库，而是把 12
              小时会话撤销窗口切成 30 分钟一块的二进制数据，存入 Amazon S3。应用网关通过条件 HTTP 请求下载变更分块，并在内存中维护有序数组进行二分查找；这使网关内存缓存占用下降
              87.5%，也消除了数据库峰值。在分析链路中，Canva 从脆弱的 24 小时全量数据库快照转向持续变更数据捕获（CDC）。系统用 AWS Database Migration Service 处理
              MySQL，用 Kinesis Data Streams 处理 DynamoDB，再通过 Kinesis Data Firehose 将变更事件写入分区 S3 暂存区，最后由 Snowpipe 持续导入
              Snowflake。这套按微服务划分的数据网格（Data Mesh）管理超过 5 PB 的分析数据，各工程领域团队则借助可复用的基础设施即代码（IaC）模块管理自己的数据底座。
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE015
