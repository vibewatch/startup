chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、产品与业务触达
        blocks:
          - type: paragraph
            body: >-
              Canva 自述是一款 2013 年上线的在线设计与发布工具。其业务将广覆盖的免费产品、付费订阅和内容授权结合起来：Free Content 可免费授权，Pro Content
              则由免费用户按次付费，或包含在有效订阅中。官方「关于我们」页面显示月活跃用户为 220M+；一篇 2026 年对比报道则称，截至 2025 年底月活跃用户达 265M、付费订阅用户超过
              31M。官网未注明指标日期，第三方报道又转引其他出版物，因此不能把两组数据当作连续、同口径的序列。现有证据也未能可靠确认 Canva 当前总部、法定实体架构、发展阶段、办公室数量或员工总数。
            claimRefs:
