      - number: '1.4'
        title: 商业信号、发展里程碑与负面变动
        blocks:
          - type: paragraph
            body: >-
              公开价格信息显示，Canva 于 2026 年调整了商业套餐。CloudEagle 1 月列出的 Pro 价格为每用户每年 $120，Style Factory 7 月列出的年费为 $144；两家第三方都称
              Enterprise 方案需联系销售报价。这些只是出版方记录的价格快照，并非已签署的客户合同；由于记录日期不同，不能直接作同口径比较。更重要的是，ValueAddVC 报道称，AI
              推理服务成本拖累单位经济效益，Canva 因而在第二季度投资者更新中把 2026 年营收增速预期从 30% 下调至 20%。证据库未收录该投资者更新，因此这一调整仍属二手信息。Canva 于 2026 年 8
              月更新隐私政策，这是可直接查验的法律文件节点，但不能据此判断其当前监管合规、未决诉讼、服务中断或安全事故情况。
