        - label: 企业级与 B2B 业务扩张
          value: 500
          unit: USD millions ARR
          detail: 25+ 席企业团队合同对应的年化运行速率
          valueNote: 2025 年同比翻倍，ACV 也更稳定
        - label: AI 与基础设施优化
          value: -90
          unit: percent cost per task
          detail: 据报道，Leonardo.AI 和自研模型帮助降低生成式 AI 服务成本
          valueNote: 公司称效率提升有助于抵御前沿模型 API 费用对毛利率的挤压
        - label: 经营盈利表现
          value: 7
          unit: consecutive years
          detail: 持续实现正向经营现金流并保持盈利的记录
          valueNote: PLG 模式自我造血，尽量减少对外部融资的依赖
    approximationNotes: 指标综合 2025 全年财务数据与 2026 年初运营指标；单任务成本降幅采用公司报告的估算值。
