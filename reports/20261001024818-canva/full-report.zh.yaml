  - id: FI001
    title: 收入转化路径：从用户活跃到经营现金贡献
    type: waterfall
    summary: 瀑布图示意 Canva 从漏斗上游的用户活跃度，走到确认收入、托管成本和现金毛利的财务转化路径。
    data:
      items:
        - label: 平台用户规模（MAU）
          value: 265
          unit: million users
          detail: 使用 Canva 模板和 AI 设计工具的月活用户总量
          valueNote: 漏斗顶端的免费用户池，为 PLG 转化和大模型推荐流量提供入口
        - label: 付费订阅用户
          value: 31
          unit: million subscribers
          detail: 由免费用户转化而来的个人 Pro 用户及 B2B 团队付费席位
          valueNote: 对应约 11.7% 的自助与商业付费转化率
        - label: 确认收入基数
          value: 3500
          unit: USD millions
          detail: 2025 全年全球订阅及企业销售确认的收入
