        blocks:
          - type: paragraph
            body: >-
              生成式 AI 全面融入 Canva 的 Magic Studio，既是产品增长引擎，也是最严峻的单位经济瓶颈。面对 265 million 月活跃用户，如果面向大众的 AI 功能依赖 OpenAI 和
              Anthropic 的商业前沿模型 API，推理成本将难以为继。这一成本压力促使 Canva 在第二季度业务更新中把 2026 年营收增速预期从 30% 下调至
              20%，体现出公司在增长速度与经济可持续性之间的权衡。为缓解毛利率压力，Canva 推动底层架构转型；据报道，公司自研微调模型并收购澳大利亚生成式图像平台 Leonardo.AI 后，将 AI 服务成本削减约
              90%。信任与合规是另一条前线，Canva 也明确划定数据保护边界：隐私政策承诺，绝不将 Canva Education
              账户中生成的用户内容用于机器学习或基础模型训练，以满足全球教育合规框架对未成年人敏感数据的隐私要求。
            claimRefs:
