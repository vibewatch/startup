      - number: '5.2'
        title: 用户工作流、生产交付与技术边界
        blocks:
          - type: paragraph
            body: >-
              Canva 将图形创作接入端到端发布流程，服务业务团队和分布式营销人员。制作宣传册、展会物料时，标准模板可简化版面编排、字体对齐和视觉风格设定，并能导出带出血线和裁切标记的印刷就绪
              PDF。即便如此，量产印刷仍需人工对照印厂提供的刀模线，避免文字在折痕或折缝处被裁切。企业协作方面，Canva
              支持多人实时编辑、批注审阅和细粒度链接分享权限。默认情况下，设计仅对明确受邀的协作者开放；只有主动开启团队范围共享或公开链接，其他人才能访问。用户还可设置设计数据分析的可见范围，并匿名化互动遥测数据。这些措施为分布式组织提供基础操作安全，同时降低非技术用户的排版门槛。
            claimRefs:
