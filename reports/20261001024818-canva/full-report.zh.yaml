  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、视觉套件功能与模块化布局
        blocks:
          - type: paragraph
            body: >-
              Canva 是一体化视觉办公套件，面向 C
              端消费者、SMB、教育机构和大型企业，降低内容创作门槛。它最初是浏览器端模板编辑器，用于制作简单的社交媒体图文和宣传物料；此后逐步扩展到演示文稿、多页文档、协作白板、视频剪辑、电子表格，以及 Magic
              Studio 中的生成式 AI 工具。数百万精选模板、矢量设计元素、图库和集中管理的品牌资产库（Brand
              Kits），让非专业知识工作者也能快速制作商用级视觉素材，无需掌握复杂的平面设计技能。技术评估同时划清了产品边界：Canva
              擅长拖拽式素材编排和多格式快速发布，但不支持原生计算机辅助设计（CAD）文件、工程比例尺或高保真 3D 渲染。因此，建筑设计和工程制图等专业流程仍不会用 Canva
              交付成品，其核心优势仍在通用商业视觉沟通，而非垂直工程设计。
            claimRefs:
              - CE001
              - CE007
              - CE008
