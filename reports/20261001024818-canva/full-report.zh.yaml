      - number: '1.2'
        title: 资本、估值与报道规模
        blocks:
          - type: paragraph
            body: >-
              一篇持审慎观点的二手分析称，Canva 历经 19 轮融资累计筹资 $589M，投资方包括 Blackbird Ventures、Sequoia Capital 和 General Catalyst；2025 年
              8 月员工老股出售对应的隐含估值为 $42B。同一报道估计，截至 2025 年底 ARR 约为 $4B。这几项指标口径不同：累计融资额不是账面可用现金，二级市场估值不是定价后的一级股权融资，ARR
              也不是会计确认收入。现有证据库没有经审计财报、股权结构表（Cap
              Table）、债务明细、信贷协议或投资方直接公告来佐证这些数字。因此，它们只能作为参考，不能视为已核实的核心指标。文中的投资方名单有意只列部分机构，不代表这些机构拥有董事会席位、投票权、特定持股比例或当前持仓。
            claimRefs:
              - CO011
              - CO012
              - CO013
              - CO014
          - type: table
            tableRef: TO003
            claimRefs:
              - CO001
