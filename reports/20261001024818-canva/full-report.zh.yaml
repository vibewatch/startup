        title: 收入来源、商业化机制与定价层级
        blocks:
          - type: paragraph
            body: >-
              Canva 的商业模式由两条增长路径构成：高频、自助式的免费增值 PLG 产品，以及快速增长的 B2B 企业销售。核心产品 Canva Pro 是个人订阅方案，每位用户每月约 $10 至
              $13，可使用高级设计素材、管理品牌资产库并调用进阶工作流模板。面向个人方案之上，Canva for Teams 为需要共享资产库和团队管理功能的中小机构提供多席位协作套餐。公司称，月活跃用户每年增长
              20%，推动 ARR 在 2025 日历年末达到约 $4 billion。全年会计确认收入为 $3.5 billion；与签约 ARR 的差额反映客户转向年度或多年订阅后递延确认的收入增加。机构客户是 Canva
              增长最快的业务部分：按采购至少 25 个席位定义的 B2B 业务同比翻倍，ARR 超过 $500 million。Canva
              还在巴基斯坦、乌拉圭、摩洛哥和牙买加等发展中市场推出低价订阅，以拓展用户。自助免费增值转化与企业席位扩张相结合，收入来源涵盖个人创作者、教育机构、商业代理商和《财富》500 强企业。
