  - id: FE001
    title: Canva 多层扩展架构与运行基础设施
    type: stack
    summary: 梳理 Canva 的客户端界面、内存网关缓存、生成式 AI 服务、流式数据管道和分析型数据仓库架构。
    claimRefs:
      - CE002
      - CE011
      - CE015
    approximationNotes: 综合 Canva Engineering 和 InfoQ 对分布式会话鉴权、CDC 数据管道及自研模型托管的披露。
    data:
      layers:
        - label: 客户端与展现层
          detail: 网页、原生移动端和桌面应用界面
          modules:
            - Web 浏览器应用（React / TypeScript）
            - 原生移动应用（iOS / Android）
            - 桌面原生封装（macOS / Windows）
        - label: 应用网关与身份认证
          detail: 边缘路由与分布式会话撤销缓存
          modules:
            - API 网关实例
            - 内存排序二进制撤销数组（内存占用降低 87.5%）
            - OAuth 2.0 与企业身份连接器
        - label: 核心视觉布局与渲染引擎
          detail: 客户端文档状态管理与高并发画布渲染
          modules:
            - 文档状态管理引擎
            - WebAssembly 矢量渲染核心
            - 模板与多页排版流水线
        - label: 生成式 AI 与模型服务层
          detail: 混合推理架构结合自研微调模型与商业 API 网关
          modules:
            - 专有 Leonardo.AI 生成模型技术栈
            - 自研领域微调模型（服务成本降低 90%）
            - 外部前沿模型网关（OpenAI / Anthropic 备用）
        - label: 流式数据与事件接入
          detail: 持续捕获数据变更，并将其流式送入分析链路
          modules:
            - AWS Database Migration Service（MySQL CDC 持续复制）
            - Amazon Kinesis Data Streams（DynamoDB 变更流）
            - 带 S3 缓冲的 Kinesis Data Firehose
        - label: 分析型数仓与持久化存储
          detail: PB 级分析数仓与分布式持久化对象存储
          modules:
            - Snowflake 分析型数仓（5+ PB）
            - Amazon S3 不可变的 30 分钟撤销对象
            - 主库 MySQL 与 Amazon DynamoDB 服务数据库
  - id: FU001
    title: 客户旅程路径图
    type: journey-map
    summary: 依据有限证据梳理从广泛触达到受治理的机构级使用路径；各阶段表示运作机制，并非实测转化客群。
    data:
      items:
        - label: 1. 广泛触达
          detail: 个人用户、创作者和教育用户通过免费版或机构提供的入口接触 Canva。
          touchpoints:
            - 免费设计操作界面
            - Canva 教育版
        - label: 2. 个人高频复用
          detail: 用户在日常个人、课堂或工作内容中反复使用模板与编辑工具。
          touchpoints:
            - 模板库
            - 编辑与 AI 工具
        - label: 3. 个人付费升级
          detail: 部分用户为使用高级功能转为付费订阅；公开资料未披露客群转化数据。
          touchpoints:
            - 付费订阅
            - 高级素材与品牌工具
        - label: 4. 团队协同
          detail: 共享成果和维护品牌一致性，推动团队协同使用。
          touchpoints:
            - 共享内容
            - 品牌管理
        - label: 5. 统一管控与治理
          detail: 团队所有者或管理主体可按既定政策管理账户访问权限与内容。
          touchpoints:
            - 团队管理
            - 受管账户
        - label: 6. 机构级扩张
          detail: 更广泛地采用工作流可能支持更多用户或使用场景，但续约率和扩张率仍未披露。
          touchpoints:
            - 跨工作流采用
            - 续约与席位扩张尽调
    approximationNotes: 这是基于指定信源梳理的概念机制；阶段转化率、统一客群及转化周期均无公开数据支持。
    claimRefs:
      - CU015
      - CU016
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 对比 Canva 主要风险的发生概率、影响程度、缓解措施成熟度及残余敞口。
    approximationNotes: 发生概率、严重程度和缓解措施评级，均为综合公司披露与第三方评估后的定性判断。
