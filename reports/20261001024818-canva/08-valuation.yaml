    body: "Canva represents one of the highest-quality private SaaS platforms globally, pairing $4B in ARR and 260M monthly active users with seven consecutive years of GAAP-level profitability. At a $42B valuation (10.5x ARR), shares trade at a fair multiple that leaves adequate room for institutional returns if Canva executes on its planned 2026-2027 Nasdaq listing."
