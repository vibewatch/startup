      - "CV002"
      - "CV003"
      - "CV004"

  - calloutType: "risk"
    title: "Structural Downside: Indirect Secondary Exposure and AI Margins"
    body: "Prospective secondary investors face two distinct headwinds: synthetic SPV or forward contract structures with no direct shareholder voting rights, and gross margin pressure as AI feature usage expands across free and SMB tiers. Any secondary entry above $1,650 per share narrows the risk-adjusted margin of safety."
