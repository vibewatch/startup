  figureRefs:
  - FR003
- id: people-execution-risks
  title: People and Execution Risks
  body: 'Execution risk is elevated because Skydio is attempting to reorient the business toward defense and domestic manufacturing while simultaneously recovering from a workforce shock and preserving founder-led technical credibility. Adam Bry and Abe Bachrach remain central to external trust, autonomy vision, and defense-ecosystem relationships, so leadership continuity matters disproportionately compared with a mature public defense prime that can absorb executive turnover. The fall 2024 workforce reduction of roughly 25% appears to have refocused the company on defense, but layoffs can also remove tacit engineering knowledge, reduce morale, and create perception risk for recruits and customers. Cleared engineering talent is a separate bottleneck: building secure autonomy, manufacturing, and government-delivery capabilities requires personnel who can operate inside a narrow skill market, and public disclosures do not confirm the scale or pace of clearance sponsorship. The domestic manufacturing
    ambition compounds the challenge. A $3.5 billion buildout over five years is strategically powerful if executed, but it also raises questions about whether operations and supply-chain leadership depth are sufficient for a production ramp that is much harder than a software-led growth story. Table TR004 frames these risks around key-person concentration, layoffs, hiring scarcity, and scale-up leadership gaps.'
  claimRefs:
  - CR003
  - CR005
  - CR017
  - CR031
  - CR040
  tableRefs:
  - TR004
  figureRefs: []
- id: financial-safety-cyber-risks
  title: Financial, Safety, and Cybersecurity Risks
  body: 'Skydio''s financial risk is less about a near-term lack of capital and more about opacity, concentration, and the possibility that safety or cyber events could impair high-value government channels. The April 2026 Series F added $110 million at a reported $4.4 billion valuation, which is a meaningful mitigation because it provides fresh funding and external validation, but it does not answer the core underwriting questions: gross margin, burn, revenue mix, and agency-level concentration remain undisclosed. Public evidence suggests DoD-related channels likely represent the majority of revenue, so a single program cancellation or procurement slowdown could create a disproportionate decline. Figure FR002 shows how that concentration interacts with battery sanctions, FedRAMP delay, and key-person risk to pressure revenue, margins, customer retention, and valuation simultaneously. Cyber posture is a partial offset: SOC 2 Type II, FIPS 140-2, and a US-only cloud reduce baseline risk,
    yet the company''s actual FedRAMP status remains unconfirmed and therefore cannot be relied on as a commercialization bridge into more sensitive deployments. Safety is equally material. No public FAA enforcement action or recall was identified, but an autonomy-related injury event would create regulatory, legal, and reputational downside. Finally, lobbying has helped create a favorable regulatory backdrop, but criticism that this advantage is policy-driven rather than purely product-driven becomes its own reputational and policy risk if the political environment turns.'
