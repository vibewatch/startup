company:
  name: Skydio
chapter:
  number: 7
  title: Risks
  summary: Skydio faces a severity-ranked set of risks spanning regulatory exposure, supply chain fragility, partner dependencies, execution gaps, and financial uncertainty. The highest-severity confirmed risk is the October 2024 Chinese sanctions that severed Skydio's sole-source battery supply, forcing approximately one-battery-per-month rationing and delaying a spring 2025 new-source qualification target. Regulatory risks center on FAA BVLOS rulemaking pace, Blue UAS/NDAA certification continuity under the July 2025 DIU-to-DCMA transition, ITAR compliance depth for allied-nation exports, and unconfirmed FedRAMP authorization status. Key-person concentration in co-founders Adam Bry and Abe Bachrach, a reported approximately 25% workforce reduction in fall 2024, and a $3.5 billion domestic manufacturing pledge that has yet to reach full production scale create execution risk. Financial risks include undisclosed gross margins, high revenue concentration in US DoD contracts, and a capital
    structure not transparent to investors. Mitigations include the $110M Series F closed in April 2026 at a $4.4B valuation, domestic manufacturing investment, SOC 2 Type II and FIPS 140-2 security posture, and Skydio's embedded position on the Blue UAS list.
sections:
- id: regulatory-legal-risks
  title: Regulatory and Legal Risks
  body: 'Skydio''s regulatory risk stack is unusually consequential because a large share of its commercial upside depends on remaining inside defense-friendly procurement and airspace rules rather than simply winning on price. The company benefits from the NDAA and Blue UAS regime today, but that moat also creates sensitivity to any certification change, audit finding, or administrative disruption as the Blue UAS program reportedly moved from the Defense Innovation Unit to the Defense Contract Management Agency under a July 2025 Secretary of Defense memorandum. Table TR001 shows how this procurement gate sits alongside FAA Part 107 visual-line-of-sight limits, uncertain timing for a general BVLOS rule, ITAR and EAR obligations tied to deployments in 29 allied nations, evolving privacy and data-protection rules, and product-liability exposure if an autonomy or dock-related incident causes injury. Figure FR001 underscores that these are not hypothetical edge cases: China sanctions are already
    active, while FAA, export-control, privacy, and safety constraints remain monitorable risks that can change Skydio''s addressable market or contract eligibility. Public evidence does not show known FAA enforcement or product recalls, but the absence of identified actions is not the same thing as legal clearance, especially for a private company selling into security-sensitive missions.'
  claimRefs:
