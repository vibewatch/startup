- id: supply-chain-operational-risks
  title: Supply Chain and Operational Risks
  body: 'The most concrete operational risk is the battery supply shock that became visible on October 28, 2024, when Chinese sanctions cut off a sole-source battery input and forced Skydio to ration roughly one battery per month per customer. That event converted a previously abstract supplier-concentration concern into an immediate delivery and customer-service problem, and management''s stated goal of qualifying a replacement source by spring 2025 has not been publicly confirmed as achieved. Table TR002 captures why that matters beyond batteries alone: a hardware business selling docks, autonomous infrastructure, and mission-critical aircraft must manage recall risk, manufacturing quality during a domestic transition, cybersecurity controls for connected operations, and autonomy edge cases that could trigger grounding or contract pauses. Skydio''s mitigants are real but incomplete. The company cites SOC 2 Type II, FIPS 140-2, and a US-only cloud posture, while its reliability dashboard
    claims dock-based flights are about three times safer than manual flights. Those facts help frame operational maturity, but they do not eliminate execution risk around new-source qualification, yield ramp, or whether FedRAMP authorization has moved beyond an unconfirmed state.'
  claimRefs:
  - CR001
  - CR002
  - CR004
  - CR005
  - CR013
  - CR015
