      - number: '1.2'
        title: 创始人、管理层与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              Skydio 由 Adam Bry 和 Abe Bachrach 于 2014 年共同创立。两人 2009 年在 MIT 读研究生时相识，并在那里用数年时间开创自主无人机研究。离开 MIT 后，两人参与启动
              Google Project Wing 自主配送项目，之后离职创办 Skydio。Adam Bry 担任 CEO，也是公司最主要的公众面孔；他的履历包括全国遥控飞机冠军飞手经历、MIT 和 Olin
              College 学位，以及多篇技术论文和多项专利。Abe Bachrach 担任 CTO，自 2007 年起负责 MIT 自主飞行研究项目；背景覆盖计算机视觉、机器学习、系统架构和飞行器设计。CEO
              层面的关键人集中度值得注意：Bry 是外部唯一广泛认知的创始人 CEO，牵引战略、资本关系和政府合作拓展。公司官网公开列出的更广泛高管团队包括 Callan
              Carpenter（CRO，在航空航天和工程软件领域超过 30 年）、James LaCamp（CFO，曾任 Flock Safety CFO 和 Deloitte 合伙人）、Brendan
              Groves（首席法务官，曾任 DOJ 副助理总检察长、空军军官）、Macario Namie（CMO，25 年以上企业营销经验，包括 Cisco 和 WebEx）、Ryan Reading（软件工程
              SVP，来自 Samsara 和 Cisco Meraki），以及 Anna Wiesenthal-Birch（人力运营 SVP）。董事会构成没有完整公开；公司尚未提交 S-1
              或其他列出董事会的公开披露。官网提到设有 National Security Advisory Board。2024 年裁员涉及与消费级产品线相关岗位的退出，但 Skydio 没有发布详细说明。
