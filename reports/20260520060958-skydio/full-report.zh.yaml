            body: >-
              Skydio 的财务风险，与其说是近期缺资本，不如说是透明度不足、集中度高，以及安全或网络事件可能损伤高价值政府渠道。2026 年 4 月 Series F 以据报 $4.4 billion 估值新增 $110
              million，这是一项有意义的缓释，因为它带来新资金和外部验证，但无法回答核心承销问题：毛利率、烧钱速度、收入组合和机构层面的集中度仍未披露。公开证据显示，DoD
              相关渠道很可能贡献大部分收入，因此单个项目取消或采购放缓都可能造成不成比例的下滑。Figure FR002 展示了这种集中度如何与电池制裁、FedRAMP
              延迟和关键人风险交织，同时压迫收入、利润率、客户留存和估值。网络安全态势是部分抵消因素：SOC 2 Type II、FIPS 140-2 和仅美国云降低了基线风险，但公司的实际 FedRAMP
              状态仍未确认，因此不能把它视为进入更敏感部署的商业化桥梁。安全风险同样重要。公开材料未发现 FAA
              执法行动或召回，但一起自主飞行相关伤害事件就会带来监管、法律和声誉下行。最后，游说帮助塑造了有利监管背景，但如果政治环境转向，外界批评这一优势由政策驱动而非纯产品驱动，本身就会变成声誉和政策风险。
