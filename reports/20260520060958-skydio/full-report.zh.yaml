    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、总部、使命与产品模式
        blocks:
          - type: paragraph
            body: >-
              Skydio 是一家位于加州 San Mateo
              的自主无人机公司，核心使命是打造关键行业依赖的飞行机器人基础设施。公司自称是美国最大的无人机制造商，并把自己的技术平台定义为服务公共安全、国防、公用事业和企业客户的「飞行机器人」。当前产品族包括 Skydio
              X10（2023 年 9 月推出的商用与民用旗舰）、Skydio X10D（国防级版本）、Skydio R10（韧性战术平台）、Skydio F10（固定翼远程平台）、Skydio Dock for
              X10（自动起降与回收站，让远程驾驶和自主作业无需现场人员即可运行），以及 DFR Command、Remote Ops、3D Scan 等软件平台。Skydio Autonomy 是公司的 AI
              导航栈；Skydio Connect 是机队管理层；Skydio Extend 则向第三方开发者提供开放集成
              API。核心商业模式是硬件加软件：无人机和机库通过直接合同、州和联邦采购工具卖给企业、政府和公共安全客户，再叠加 DFR Command、Remote Ops
              等软件订阅形成经常性收入。公司所有产品都在美国设计和组装，主要生产基地位于加州 Hayward；Skydio 把美国本土来源同时包装成安全差异化和监管护城河，用来对抗中国无人机制造商，尤其是 DJI。截至
              2026 年 4 月 Series F 公告，公司声称年收入达到数亿美元、单位经济模型强劲且处于超高速增长，但没有公开可得的经审计收入数字。官方材料显示，总部地址为 3000 Clearview Way, San
              Mateo, CA。
