            body: >-
              Skydio 的公开可靠性仪表盘承认，细障碍物检测失败（电线、缆线）是最大的技术因素事故驱动项。公司表示软件修复已有计划，但截至 2026 年 5
              月尚未发布。电力线路巡检和基础设施环境中的操作员面临更高坠机风险；公开披露虽然体现透明度，值得肯定，但对任务关键型部署而言仍构成反向信号。
