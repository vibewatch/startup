        title: 合作伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >-
              Skydio 的依赖画像，比「国内制造领导者」这条主叙事更紧。制裁前，电芯供应似乎实际上由一家中国制造商单一来源供给，而这一单点依赖足以影响整个装机基础的交付。联邦渠道依赖也很高：持续保持 Blue UAS
              身份是许多防务和国土安全采购的准入条件，因此任何由 DCMA 管理的合规问题，即使产品质量本身仍然完整，也可能削弱采购通道。Figure FR003 绘制了其余依赖网络，包括作为仅美国部署云底座的
              AWS、管理豁免和自主运行包线的 FAA、用于涉密准入的 SAIC 和 Leidos
              等主承包商，以及为国内制造推进提供资金的资本提供方。收入集中会放大所有这些连接。陆军、空军及其他联邦渠道的公开合同披露暗示，DoD
              及相邻机构很可能贡献了大部分收入，也就是说，单一政策变化、预算削减或承包商渠道损失，都可能很快传导到出货、续约和估值。Table TR003 因此把依赖风险视为结构性问题，而不是偶发问题。
