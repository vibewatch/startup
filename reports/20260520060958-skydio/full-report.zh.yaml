      - number: '7.4'
        title: 人员与执行风险
        blocks:
          - type: paragraph
            body: >-
              Skydio 正在把业务重心转向防务和国内制造，同时还要从裁员冲击中恢复、守住创始人主导的技术可信度，因此执行风险偏高。Adam Bry 和 Abe Bachrach
              仍是外部信任、自主飞行愿景和防务生态关系的核心；与能吸收高管流动的成熟上市防务主承包商相比，领导层连续性在 Skydio 身上更重要。2024 年秋季约 25%
              的裁员似乎让公司重新聚焦防务，但裁员也可能带走隐性工程知识、打击士气，并给招聘和客户带来感知风险。具备安全许可的工程人才是另一道瓶颈：构建安全自主飞行、制造和政府交付能力，需要能在狭窄技能市场中工作的人员，而公开披露没有确认安全许可赞助的规模或速度。国内制造雄心进一步放大挑战。五年
              $3.5 billion 建设计划若能执行，战略价值很高；但它也提出一个问题：运营和供应链领导层深度是否足以支撑生产爬坡，而这一爬坡远比软件驱动的增长故事更难。Table TR004
