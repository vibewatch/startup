          value: 3.6
        - label: $400M 收入 × 12x（中位基准）
          value: 4.8
        - label: $450M 收入 × 15x（高位基准）
          value: 6.75
        - label: $600M 收入 × 15x（偏乐观）
          value: 9
        - label: $600M 收入 × 20x（乐观）
          value: 12
        - label: 当前 Series F 轮估值
