  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Skydio 的可服务市场不应理解成单一通用无人机
              TAM，而应拆成五个部分重叠的子市场。第一，无人机首响应（DFR）与公共安全：警察、消防、EMS、搜救和应急管理机构把自主无人机部署成战术资产。第二，关键基础设施巡检：公用事业、能源、电信和交通运营商用无人机完成输电线、管道、风机、桥梁和铁路走廊等强制巡检。第三，国防和国家安全
              sUAS：DoD 项目办公室、盟军和美国情报体系在 NDAA 管辖采购下购买短程侦察、监视和战术 UAS 平台。第四，场站安防和远程监控：企业设施、工业园区、港口和关键基础设施运营商部署自主机库 +
              无人机系统，用于周界监控和事件响应。第五，更广义的美国政府商用无人机平台市场，这些机构在非军事联邦业务中要求平台通过 Blue UAS 审查或符合
              NDAA。纳入支出的范围包括硬件（无人机、机库、配件）、软件订阅（DFR Command、Remote Ops、3D Scan、机队管理）、服务和支持合同。排除的支出包括消费级娱乐无人机、受 NDAA
              限制的中国制造平台（DJI、Autel 和 CISA 名单实体）、商业包裹配送物流（Amazon Prime Air、Wing）、农业喷洒无人机，以及远程固定翼货运。Skydio
              面对的现状替代方案包括：有人直升机（警察和消防部门用于空中监视——成本 $500-1,500/飞行小时，而无人机作业为 $20-80/小时）；公用事业的人工巡检队伍（估计每个资产类别每年巡检周期
              $150-500K）；中国无人机——DJI 和 Autel——在 NDAA 限制前主导美国公共安全和商用巡检市场；老一代美国无人机平台（Parrot Anafi、DJI 时代的较旧同类产品、小型固定翼 ISR
              平台）；固定监控摄像头加保安值守；以及专业无人机服务承包商。每一种替代方案既是 Skydio 要替换的竞争基线，也是衡量无人机 ROI 的成本标尺。
