            title: 自主飞行技术栈构成持久技术护城河
            body: >-
              Skydio 的 AI 自主飞行技术栈——基于 VIO 的 GPS 拒止导航、NightSense 零光自主飞行，以及运行在 NVIDIA Jetson Orin 上的 360
              度避障——体现了真实的多年研发深度，中国制造竞品无法合法提供给美国联邦机构。叠加 Blue UAS/NDAA 合规后，只要联邦无人机采购限制继续有效，Skydio 就拥有结构性采购优势。
            calloutType: strength
