      - number: '5.5'
        title: 信任、安全架构与合规认证
        blocks:
          - type: paragraph
            body: >-
              Skydio 的 Security Trust Center 记录了一套覆盖硬件、连接、云和合规层的端到端安全架构。硬件安全由几项能力支撑：AES-256 SkydioLink 无线加密；Dock
              内用于硬件密钥存储的 TPM，满足 CJIS 6.0 要求；传输中和静态数据的 FIPS 140-3 验证加密；采集点 SHA-256 哈希，为证据流程提供法庭可辩护的监管链。云基础设施运行在 AWS
              US-West，具备 SOC2 Type II 认证（2023 年续期）、ISO 27001:2022 认证（2023 年完成）、传输中 TLS 1.2/1.3、静态 AES-256，并通过 SAML 和
              OIDC 支持企业 SSO（支持 Axon Connect、Okta 和 Microsoft Entra）。CJIS Security Policy v6.0 合规由 FedRAMP
              认可的第三方评估机构（3PAO）独立审查。公司持有 AS9100D 航空航天与防务制造质量认证。NDAA Section 889 合规为声明性质——Skydio 称其不使用 Section 889
              禁止实体提供的电信或视频监控设备。公司还持有面向 Texas 政府采购的 TX-RAMP Level 2
              认证。独立机构定期做渗透测试；结果会共享给高管，漏洞会跟踪处理。软件和固件更新在安装前均经过数字签名和验证。隐私控制包括客户数据隔离、企业 SSO
              和仅美国数据驻留。可靠性仪表盘公开披露事故数量和根因类别，包括细障碍物检测失败（最大单一技术因素）、螺旋桨毂磨损、电池估算错误和飞控系统异常——这种透明度在行业内少见，但也对复杂环境中的运营可靠性构成反向信号。
            claimRefs:
