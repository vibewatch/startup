      - number: '5.6'
        title: 技术风险、依赖项与未解尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Skydio 的产品与技术画像包含多项实质技术风险。最迫近的是电池供应链：中国 2024 年 10 月对无人机相关材料实施出口管制，迫使 Skydio
              向既有客户限量供应电池，直接冲击其最大的装机基础。Skydio 依赖高性能锂离子电芯，部分来源暴露在中国出口限制之下；SkyForge
              制造承诺不一定能解决上游电芯依赖。第二，可靠性仪表盘披露，持续存在的细障碍物检测失败是最大的技术因素事故驱动项；公司明确承认视觉导航并不完美，并指出截至报告日，解决该问题的软件改进已有计划但尚未发布。第三，BVLOS
              远程运行依赖第三方运营商的商用蜂窝网络（5G/LTE）；网络中断或覆盖空白会让 Dock 型 DFR 失效。第四，NVIDIA Jetson Orin 和 Qualcomm Snapdragon SoC
              依赖美国设计但全球制造的芯片；任何供应或出口限制都会直接影响生产。第五，监管依赖包括仍在推进的 FAA BVLOS 审批流程；FAA
              政策或州级无人机条例变化可能限制市场准入。第六，竞争护城河部分依赖中国无人机采购限制延续；若 NDAA 无人机条款逆转，DJI 可能重新进入美国政府市场。私有信息缺口包括：硬件和软件的实际毛利率、Hayward
              制造良率、Skydio Regulatory Services 管线中 BVLOS 豁免通过率，以及 F10 固定翼平台已商业化还是仍在开发中。
            claimRefs:
              - CE041
              - CE042
              - CE043
              - CE044
              - CE045
