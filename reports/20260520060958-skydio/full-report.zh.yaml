      - number: '2.2'
        title: 市场规模测算——多重视角
        blocks:
          - type: paragraph
            body: >-
              Skydio 需要多重测算视角，因为它的可服务市场与通用商用无人机总可用市场（TAM）在结构上不同。视角 1——通用全球商用无人机 TAM：Grand View Research 估计，全球商用无人机市场
              2023 年约 $6.5B，到 2030 年约 $31.5B（CAGR 约 25%）。MarketsandMarkets 估计为 $14.1B（2023）到 $55.8B（2030），CAGR 约
              22%。Precedence Research 估计为 $12.5B（2023）到 $58.5B（2032），CAGR 约 18.6%。Fortune Business Insights 估计 2030 年达到
              $48.9B。这些估计彼此冲突很大，也没有按政府、消费和农业子板块拆分；用来锚定 Skydio TAM 的价值有限。视角 2——美国政府 / 公共安全 / 国防 /
              公用事业可服务市场（SAM）：把美国在全球公共安全无人机市场中的份额（Business Research Insights 估计 2024 年约 $300-450M，到 2030 年增至
              $950M-1.1B）、DoD sUAS 可见合同授予额（每年 $1-3B）和美国公用事业 / 基础设施巡检无人机支出（$500M-1B）合并，得到 2024-2026 年美国政府 / 机构 SAM 约
              $2-5B/年。视角 3——Blue UAS / NDAA 审查采购渠道：截至 2024 年初，DIU Blue UAS 许可名单覆盖约 12-18 个平台。这个采购渠道更小也更快（3-6
              个月周期，而标准联邦采购为 12-24 个月），为通过审查的美国本土无人机制造商形成约 $500M-2B/年的子 SAM。视角 4——从 Skydio 客户基础推导的受约束可获取市场（SOM）：以 3,800+
              客户和估计每客户平均合同价值 $100-300K（硬件 + 多年软件订阅）计算，当前账面 SOM 约为 $380M-1.1B，后续增长来自 DFR
              项目深化和国防放量。相互矛盾的估计必须保留：没有任何分析师来源给出 Skydio 专属 SAM 或 SOM，所有视角都有很高不确定区间。DoD Replicator 项目（FY2024-2025 专门用于可消耗
              sUAS 的 $500M-1B tranche）是一个离散扩张事件，没有被运行率估计捕捉。
