          - type: callout
            title: 电池供应链仍是未解决的关键风险
            body: >-
              中国 2024 年 10 月出口管制迫使 Skydio 向整个装机基础限量供应电池——这是直接的产品交付失败。SkyForge 制造承诺并不保证上游电芯依赖得到解决。在美国制造或盟国供应的高性能 LiPo
              电芯来源完成认证之前，这仍是组合中最大的产品连续性风险。
            calloutType: risk
