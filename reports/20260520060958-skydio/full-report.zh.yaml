              按 DroneXL 分析隐含的 10–20× 过去收入倍数计算，只要 Skydio 毛利率高于 40%、NRR 超过 110%，$4.4B 估值与防务科技 AI 硬件同业的区间相符。但毛利率和 NRR
              都未披露。按表面估值投资，依赖的是 CEO 叙事，而不是经审计财务。任何按这一价格交易的投资人，都应把 Table TI005 列出的五个尽调阻断项设为交割条件，而不是可选事项。
            calloutType: assumption
