      - number: '4.3'
        title: 成本结构、制造与资本强度
        blocks:
          - type: paragraph
            body: >-
              相比中国竞争对手，Skydio 的成本结构带有本土制造溢价。所有产品都在加州 Hayward 工厂设计和组装；公司称截至 2026 年 4 月，该工厂生产无人机的速度「快过为匹配需求而招聘的速度」。与 DJI
              的离岸生产模式相比，本土制造带来更高人工成本、本土组件采购成本和设施相关资本开支。2024 年 10 月的电池供应链中断暴露了一个具体成本结构依赖：当中国制裁公司时，Skydio
              尚未完成电池供应本土化，被迫实行每架无人机一块电池的配给。这个事件说明，供应链中的非本土组件同时带来成本波动和客户交付风险。Series F 后一天宣布的五年 $3.5B SkyForge
              本土制造承诺，是一项重大的资本开支义务：平均每年 $700M，所需收入或外部资本显著超过 $110M Series F 融资额。其中超过 $1B 将投向美国本土供应商。2024 年约 25%
              的裁员，是一次成本结构转向：离开消费板块员工，转向利润率更高的政府垂直。各板块毛利率仍未披露；本土制造的硬件驱动业务通常毛利率为 30–50%，软件订阅可以达到 70–80%，但没有 Skydio
              专属披露时，这些只能作为行业代理估计。
