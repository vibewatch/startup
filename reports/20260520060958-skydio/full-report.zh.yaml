          - type: callout
            title: CEO 拒绝额外资本是正面信号，但放在全局里力度有限
            body: >-
              Adam Bry 在超额认购下仍拒绝更多投资人资本，是可信的经营杠杆信号，也与接近自由现金流收支平衡相符。不过，$110M Series F 相对于 $3.5B SkyForge 资本开支承诺并不大；CEO
              所说运营费用「资本需求快速下降」，不必然意味着 SkyForge 资本开支可以自筹。投资人应区分两件事：运营成本自给（该信号支持这一点）与全部资本开支自给（仅靠本轮融资规模无法支持）。
