      - number: '5.2'
        title: 自主飞行技术栈、传感器设计与技术架构
        blocks:
          - type: paragraph
            body: >-
              Skydio 的核心技术差异化在于自研 AI 自主飞行技术栈。它运行在 NVIDIA Jetson Orin 系统级芯片上，并由第二颗 Qualcomm Snapdragon 865 SoC
              处理载荷。Jetson Orin 的算力是上一代 Skydio 的 10 倍，可利用六个定制全向导航摄像头实时重建 3D 环境，形成真正 360 度避障覆盖。导航摄像头同时使用可见光和红外补光来支持
              NightSense 模式，使 X10 和 R10 成为公司所称唯一能在零光环境全自主飞行的无人机。视觉惯性里程计（VIO）提供不依赖 GPS 的 ±10 cm 悬停精度，这对 GPS 拒止或 GPS
              欺骗环境至关重要。Spatial AI Engine 模块可在机体端实时生成 2D 地图和 3D 模型，支撑 3D Scan 巡检流程。Skydio Shadow
              是目标跟踪模块，即使人物或车辆短暂被遮挡，也能保持锁定。Skydio Scout 支持自主车队警戒——无人机会相对移动地面单元自主保持可配置位置。连接由 Skydio Connect 管理，这是一套分层方案，结合
              Connect SL（Wi-Fi 6 点对点，视距最远 7.5 miles，农村/弱干扰条件下 12 km）和 Connect 5G（LTE/5G 蜂窝，SIM 可由 Skydio
              配置或运营商提供）。Connect Fusion 会自动混合两条通道，以最大化吞吐和韧性。Skydio Dock 集成 Trusted Platform Module（TPM）用于硬件密钥存储，并配备
              AES-256 加密的 SkydioLink 无线电。所有软件和固件更新均有数字签名。定制镜头（官方产品页称现成部件「无法提供所需图像质量」）采用紧凑型过渡变焦系统和大光圈（f/1.8 与
              f/2.2），进光量比竞品设备高 1.7–3.5×。X10 集成 Teledyne FLIR Boson+ 热成像传感器——公司称这是无人机首次集成该传感器——分辨率 640×512，灵敏度 <30 mK；按
              Skydio 官方产品页，其灵敏度比同类设备高 40%。
