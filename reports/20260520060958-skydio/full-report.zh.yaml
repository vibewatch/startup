      - number: '5.4'
        title: 差异化、知识产权与竞争护城河
        blocks:
          - type: paragraph
            body: >-
              Skydio 的竞争位置建立在四个互相咬合的优势上。第一，AI 自主飞行技术栈——尤其是基于 VIO 的 GPS 拒止导航、NightSense 零光自主飞行和 Spatial AI
              巡检——体现了真实技术深度；DJI 和多数竞品目前无法在 5 lb 以下机体上复刻同等性能。第二，Blue UAS 清单和 NDAA Section 889
              合规构成结构性采购护城河：限制或禁止中国制造无人机的联邦、州和防务机构，必须从认证清单供应商采购。Skydio、Parrot（ANAFI USA）和 Autel Robotics 是主要的 Blue UAS
              四旋翼选项，但 Skydio 的软件平台深度和美国制造姿态，让它成为大型政府项目的默认选择。第三，Dock 生态带来切换成本：一旦 Dock hive、CAD 集成、DFR Command 工作流和 Axon
              Evidence 证据链落地，更换平台就需要重做整套调度和证据流程。第四，Skydio 的 $3.5 billion SkyForge 制造承诺和 AS9100D
              航空航天质量认证，让公司有望扩大美国本土生产并满足防务合同交付节奏。公司称，自主飞行平台让非专业人员经过几小时培训即可操作无人机，相比手动飞行方案可降低无人机项目的人力成本。批评者指出，Skydio
              的竞争护城河一部分来自监管，而非纯技术；若中国无人机政策逆转，继续游说限制 DJI 市场准入所带来的护城河可能收窄。通过 Skydio Extend（Attachments ICD、REST
              API、MAVLink、ATAK）形成的开发者生态增加了类似平台网络效应的生态锁定，但开发者社区规模仍比 DJI 的 SDK 生态小几个数量级。
