      - number: '3.3'
        title: 通过美国 Blue UAS 认证的直接竞争对手
        blocks:
          - type: paragraph
            body: >-
              在 DIU Blue UAS 许可名单内——也就是 Skydio 最主要的监管保护区——三家直接竞争对手最值得关注，且各自战略定位不同。Red Cat Holdings 于 2022 年收购 Teal
              Drones，推出 Teal 2 和 Golden Eagle 平台，两者均进入 Blue UAS 名单。Teal 几乎完全聚焦军事 ISR：面向 DoD 客户的短程侦察、周界防御和战术 sUAS。Red Cat
              在 2024-2025 年市值约 $70-130M，只是 Skydio $4.4B 估值的一小部分。Teal 平台会与 Skydio X10D 争夺陆军 tranche 合同，但并不面向 Skydio
              的商用公共安全或公用事业巡检板块。Parrot ANAFI USA 是 Parrot SA（法国母公司，2023 年收入约 €90M）销售的法国制造平台，已获 DIU
              许可，并积极卖给美国公共安全和企业客户。Parrot 起价约 $7,000，没有等效的机库 + 无人机自主系统；对不需要 Skydio 所强调自主能力的机构来说，它是低成本替代方案。Parrot 缺少
              Skydio 的 AI 驱动避障和自主任务执行能力，这在 DFR 和远程作业用例上形成真实能力缺口。Freefly Systems 的 Alta Astro 平台起价约
              $12,500，主要定位专业巡检和媒体场景——买方不同于 Skydio 主要服务的执法和军方采购漏斗。Freefly 没有大规模公开融资；其 DoD 合同足迹也没有公开记录。这三家公司都没有达到 Skydio
              声称的 1,200 家公共安全机构覆盖规模。Skydio 的机库 + 无人机系统让零现场自主作业成为可能；在商用规模上，Blue UAS 同行没有等效产品，这使 Skydio
              在远程作业板块拥有真实且当前未被匹配的能力优势。
