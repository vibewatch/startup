    summary: 基于公开披露，粗略估算 Skydio 在每个采用阶段的可触达和已服务市场规模，从美国公共安全机构总量到部署 Dock 的机构。
    data:
      items:
        - label: 美国执法机构总数（FBI 普查）
          value: 18000
        - label: Skydio 客户组织总数（全部分层）
          value: 3800
        - label: Skydio 公共安全机构
          value: 1200
        - label: 已部署 Dock 的机构（估计“数百家”）
          value: 400
        - label: 多 Dock 蜂群扩展机构（估计）
          value: 80
    approximationNotes: FBI 执法机构普查数字为近似值。Skydio 客户数量来自公司声称。部署 Dock 和多 Dock 的数字为分析师估计，依据 USAFCENT 博客提到“数百家州和地方机构”已有 Dock 部署；没有官方拆分。
    claimRefs:
      - CU001
      - CU002
      - CU019
      - CU009
  - id: FU003
    title: 客户证据质量矩阵
    type: matrix
    layout: wide
    summary: 将已点名客户的证据按证据质量（独立证据与仅公司来源）和部署成熟度（正式部署与试点）映射，覆盖每个已知具名客户或分层。
    data:
      columns:
        - 独立证据
        - 仅公司来源证据
        - 试点 / 评估
        - 声称存在——无具名证明
      rows:
        - label: 国防
          values:
            - 133rd ANG（DVIDSHUB）；陆军 $52M X10D（army.mil + prnewswire）
            - 25th Infantry Div.（Skydio 客户故事）
            - —
            - 29 个盟国（无具名证明）
        - label: 公共安全
          values:
            - —
            - Brookhaven PD 8 个 Dock（Skydio DFR 页面）
            - Bloomington MN DFR（2026 年 5 月）
            - 1,200+ 机构（无拆分）
        - label: 公用事业 / 场地安防
          values:
            - —
            - Axon Air DFR（Axon 产品页）
            - —
            - 450+ 公用事业；场地安防分层（无数量）
    approximationNotes: >-
      分类反映分析师对来源独立性的判断。“独立证据”= 非 Skydio 的一手来源（DVIDSHUB、army.mil、prnewswire、Axon 产品页）。“仅公司来源”= 只有 Skydio
      博客或页面。部分条目横跨多个类别；这里放入更强的分类。
    claimRefs:
      - CU013
      - CU014
      - CU016
      - CU017
      - CU011
      - CU020
      - CU028
      - CU036
  - id: FU004
    title: 关键客户集中度和扩展风险指标
    type: bar
    layout: standard
    summary: 根据公开证据，用 1–5 的分析师严重度量表评估 Skydio 客户群中最重要的风险和扩展因素暴露。
    data:
      items:
        - label: 头部账户集中度（国防）
          value: 5
        - label: Axon 渠道依赖（公共安全）
          value: 4
        - label: 监管护城河耐久度风险
          value: 4
        - label: 电池 / 供应链中断风险
          value: 4
        - label: 公共部门预算时点波动
          value: 3
        - label: ADS/DLA 经销商集中度
          value: 3
        - label: 先落地再扩张的 Dock 扩展信号
          value: 4
        - label: 软件订阅粘性（增购）
          value: 3
    approximationNotes: 严重度评分为分析师判断（1=低，5=高），基于公开证据；正值代表风险，负值代表缓释因素。“先落地再扩张”按扩展机会（正向信号）计分，并映射到同一量表用于横向比较。
    claimRefs:
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035
      - CU026
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 按严重度和可能性展示 Skydio 的主要风险热力图，覆盖监管、供应链、合作伙伴 / 依赖、执行和财务类别。
    data:
      columns:
        - 可能性极低
        - 可能性低
        - 可能性中
        - 可能性高
        - 已确认 / 活跃
      rows:
        - label: 影响严重
          values:
            - —
