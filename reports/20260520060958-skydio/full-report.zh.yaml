      - number: '6.4'
        title: 留存、复购与耐久性代理指标
        blocks:
          - type: paragraph
            body: >-
              Skydio 不披露净收入留存率、总收入留存率或流失率。但若干行为代理指标可见。防务领域最有说服力的证据是后续采购速度：美国空军 EOD 项目 2025 年 11 月以一笔数百万美元初始授标启动，2026
              年初获得后续合同，几个月内将原订单范围扩大超过一倍——这种快速复购与高运营满意度一致。陆军 2026 年 3 月的 $52M 订单建立在 2025 年 SRR Tranche 2 订单之上，而后者又延续了
              2022 年 Tranche 1 关系；同一平台连续三批陆军订单，意味着真实运营连续性。公共安全领域，Brookhaven PD 从最初 DFR 部署扩展到 8 个
              Dock，是最清晰的具名信号，说明机构会扩张而不是流失。USAFCENT Dock 订单提到，Dock 型能力「已在全美数百家州和地方机构部署」，说明部署 Dock
              的机构走向规模化，而不是停在试点。循环软件订阅模式——公共安全的 DFR Command、企业的 Remote Ops——创造了合同续约触点，但合同期限和续约率未披露。2024 年 10 月由中国对 Skydio
              相关零部件制裁引发的电池限供，是迄今最清晰的反向留存信号：既有客户被迫排队等电池，可能扰乱运营项目，并给竞争对手机会接触受限机构。之后没有公开证据显示流失升高，但该事件确立了不容忽视的供应链留存风险。
