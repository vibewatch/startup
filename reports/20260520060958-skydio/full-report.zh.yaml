  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层与垂直行业地图
        blocks:
          - type: paragraph
            body: >-
              Skydio 将客户基础划分为五个主要垂直：公共安全/DFR、国防/国家安全、公用事业/能源、场地安防，以及其他企业（建筑、交通/桥梁巡检、教育、油气）。公共安全是最大、最可见的板块，Skydio 称截至
              2024 年末，已有超过 1,200 家机构运行 DFR 项目。部署形态从小型机构的单机巡逻，到大型都市警局和校园安防项目的多 Dock hive 网络不等。在公共安全内部，Axon Air 渠道（Axon 基于
              Skydio X10 和 R10 打造的品牌化 DFR 产品）在直销和经销商销售之外，增加了第二条商业化路径。防务覆盖美国军方所有军种——陆军、空军、海军、海军陆战队、海岸警卫队和国民警卫队——以及 29
              个盟国。按订单金额看，美国陆军是已知最大的单一军事客户；按任务类型看，空军最分散（EOD、TACP、基地安防、ISR）。公用事业板块面向发电、输电和配电运营商，场景包括变电站监控、配电网络巡检和发电设施勘测；Skydio
              称该队列有超过 450
              家公用事业和能源公司。场地安防部署在企业园区、数据中心、惩教设施和关键基础设施，是最新、最小的具名板块，被定位为警卫巡逻的自主替代方案。渠道多样性因板块而异：防务主要通过授权经销商流转（ADS—Atlantic
              Diving Supply—以及 DLA 的 Tailored Logistics Support Special Operational Equipment 采购通道）；公共安全通过直销和 Axon Air
              合作；公用事业/企业则同时通过直销以及 Skydio 合同页面列出的采购通道目录。
