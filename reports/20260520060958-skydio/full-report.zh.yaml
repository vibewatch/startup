      - number: '6.5'
        title: 集中度、渠道依赖与结构性风险
        blocks:
          - type: paragraph
            body: >-
              Skydio 的客户基础在结构上高度集中，由此带来收入和声誉风险。第一，公共安全和防务都受年度预算周期和采购规则约束，收入会呈现块状波动；单个机构决定推迟 Dock
              部署或重新招标合同，就可能实质影响某个季度的出货。第二，Axon Air 合作既是资产，也是单点依赖：Axon 是 Skydio 最大的公共安全渠道合作伙伴，双方共同营销并集成证据工作流。如果 Axon
              选择认证一家竞争无人机厂商——或开发自有硬件——Skydio 触达 Axon 数千家机构装机基础的能力会受损。第三，防务采购护城河部分来自监管：Skydio 的 Blue UAS 清单和 NDAA Section
              889 合规，把政府资金从 DJI
              导向美国来源平台。行业媒体批评称，这一监管优势部分来自游说，而不完全来自产品能力，这也提出一个问题：监管环境变化时，护城河是否持久。第四，公司不披露分板块收入，因此无法评估防务板块的头部客户集中度（少数大订单驱动报告数字），也无法评估循环软件占总收入的比例。第五，2024
              年 10 月电池限供说明，单一供应链事件能同时降低所有板块既有客户的服务质量。监管护城河依赖、Axon 渠道集中和防务采购块状波动叠加，形成有意义的集中度风险；公开材料没有披露多元化收入组合或 NRR/GRR
              指标，无法抵消这一点。
