      - number: '3.2'
        title: 主导型存量巨头——DJI 与 Autel
        blocks:
          - type: paragraph
            body: >-
              DJI 是结构上最重要的竞争对手。按行业共识，DJI 掌握全球商用无人机市场约 70% 份额，拥有全球最大无人机装机基础；在 NDAA 限制前，美国公共安全部门也大量使用 DJI。DJI 的旗舰企业平台是
              Matrice 350 RTK，基础配置价格约 $6,000 至 $8,500，明显低于 Skydio X10 约 $10,000 至 $20,000（视配置而定）。DJI 还提供 Dock 2
              自动机库系统，直接对标 Skydio Dock。DJI 的产品宽度、全球支持网络、备件可得性，以及第三方载荷和软件集成生态，都是 Skydio 尚未在同等规模复制的优势。NDAA 对 DJI
              进入美国联邦采购的禁令，构成 Skydio 的核心受保护渠道；但 DJI 仍在美国非联邦商业市场、州 / 地方市场（NDAA 不适用）和所有国际市场经营。多家来源指出，DJI 正在华盛顿挑战 NDAA
              条款，也有人考虑从宪法性角度挑战禁令。如果 NDAA 禁令削弱或被推翻，鉴于 Skydio 的价格和生态差距，其估值会受到严重冲击。Autel Robotics 是一家中国背景竞争对手，提供 EVO Max
              4T（热成像与可见光传感器套件，约 $7,000-$10,000/台）及其他平台。Autel 一直积极面向美国公共安全市场把自己包装成独立于 DJI 的替代方案，但目前不在 DIU Blue UAS
              许可名单上，并在联邦资金采购中面临与 DJI 类似的 NDAA 审查。DroneLife 指出，Autel EVO Max 4T 以显著更低价格提供与 Skydio X10
              竞争的功能，在非联邦企业板块构成真实竞争压力。
