  - id: FV003
    title: 各情景估值与回报区间
    type: range
    claimRefs:
      - CV031
      - CV032
      - CV033
    data:
      items:
        - label: 悲观情景退出估值（$B）
          low: 1.5
          high: 2.5
        - label: 基准情景退出估值（$B）
          low: 3.5
          high: 6
        - label: 乐观情景退出估值（$B）
          low: 8
          high: 12
        - label: 当前 Series F 轮进入估值（$B）
          low: 4.4
          high: 4.4
  - id: FV004
    title: 投资 KPI 评分卡
    type: kpi
    claimRefs:
      - CV001
      - CV005
      - CV007
      - CV013
      - CV024
      - CV025
      - CV026
    data:
      items:
        - label: 市场规模与顺风
          value: Strong
          context: 国防无人机市场预计到 2030 年超过 $30B；NDAA 拉动的本土需求在加速；公共安全 DFR 采用率快速提升
        - label: 产品市场匹配与证据
          value: Strong
          context: 已部署 60,000+ 架无人机；$52M 陆军订单；Air Force EOD；USAFCENT 机巢；1,200+ 家公共安全机构均有一手来源确认
        - label: 监管护城河
          value: Moderate-Strong
          context: Blue UAS 身份已确认；DCMA 过渡带来不确定性；护城河依赖政策，产品层面没有补救抓手时可能逆转
        - label: 竞争定位
          value: Moderate
          context: 自主飞行优势已确认；DJI 受禁令限制；但 Shield AI 和 Anduril 资金充足，国防主承包商可通过收购在 24–36 个月内复制能力
        - label: 财务画像
          value: Weak (Unverified)
          context: 收入说法（数亿美元）来自公司口径且未经审计；毛利率、ARR、NRR 和烧钱速度均未披露——都是投资测算的硬阻断项
        - label: 风险调整后观点
          value: High Risk
          context: 电池供应冲击（Oct 2024）、人员缩减（~25%）、DoD 集中度、SkyForge 资本开支包袱和 Blue UAS 政策风险同时构成四项重大风险
        - label: 估值与证据
          value: Stretched
          context: 隐含 EV/Revenue 为 10–20x，对比 AVAV 的 5.2x；溢价成立需要确认软件收入占比、增长和利润率，但公开来源无法验证这些条件
