              2026 年 3 月的 $52M 陆军订单从投标到授标不到 72 小时，延续了自 2022 年开始的三批采购关系。美国空军 EOD 后续订单在几个月内把初始范围扩大一倍。上述快速复购没有经过竞争性重新招标，是
