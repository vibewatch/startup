            body: >-
              最强的独立客户证据来自政府来源记录和具名机构公告。美国陆军第 25 步兵师将 Skydio X10D
              接入实时作战网络，在地面小队和指挥单元之间传输实时视频，并称该部署是生产级集成，为大规模战术无人机集成树立了新标杆。Minnesota 空中国民警卫队第 133 安全部队中队于 2023 年 11
              月成为首个让飞行员获得 Skydio X2D 认证的国民警卫队单位；项目中的 Tech Sgt. Brandon Trout 在 DVIDSHUB 记录中被直接引用——DVIDSHUB
              是独立政府媒体——称该无人机正在改变「我们做的每一件事」。USAFCENT 2026 年 4 月采购超过 $9M 的 Dock 和 X10
              系统，用于保护中东美国空军基地；该项目被描述为「美国空军规模最大的国际基地安防自主无人机基础设施部署之一」。Skydio 联邦销售副总裁的博客文章直接确认，这是 Dock
              型自主安防首次进入空军海外部队保护任务。公共安全领域，Brookhaven PD 是 Skydio 官方页面上唯一有量化结果的具名机构：部署 8 个 Dock，并实现 30
              秒无人机响应。未找到有独立可核验结果的具名公用事业或场地安防客户案例；考虑到公司声称 450+ 公用事业板块，这是实质缺口。Axon 产品页确认，通过 Axon Air 部署了 X10（户外 Dock 型
              DFR）和 R10（室内巡逻 DFR），构成生产使用的独立合作伙伴层级佐证。
