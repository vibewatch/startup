      - number: '8.2'
        title: 融资背景、入场纪律与优先权悬压
        blocks:
          - type: paragraph
            body: >-
              Series F（$110 million，估值 $4.4 billion）接在 2022 年 Series E（$230 million，估值 $2.2 billion）之后，意味着约四年估值翻了
              2x。已披露股权融资总额约 $672 million。CEO 称本轮超额认购且公司有意压制需求，这是正面信号——它意味着二级市场清算价格至少为 $4.4
              billion——但公开数据无法审计这一点。私募轮发行的优先股通常带有标准清算优先权（1x 非参与式到 2x 参与式较常见），会压在普通股之上。没有股权结构表披露，就无法评估任何低于 $4.4 billion
              退出时优先股与普通股的经济分配。假设以 $3 billion 退出，持有 1x 清算优先权的现有优先股投资人可能收回 $672 million
              融资额中的大部分或全部，而普通股接近归零。这种优先权悬压是风险投资支持公司的标准特征，但在 $4.4 billion 入场价下具有实质影响。按这一价格入场，需要看清三件事：毛利率（硬件主导的 30–35%
              毛利率与软件平台 60–70% 毛利率，在相同收入下意味着公允价值相差 2–3x）、ARR 占总收入比例（总收入 $400 million、ARR 占 40% 的公司，与 ARR 占 10%
              的公司完全不同），以及 SkyForge 融资计划（$3.5 billion 承诺若只是愿景而非合同性资金，会带来未来稀释风险）。SEC Form D 记录确认，Skydio
              使用了豁免发行结构，符合一家并未考虑近期 IPO 的公司特征。Table TV001 提供推荐摘要。
