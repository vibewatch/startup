        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Skydio 的监管风险栈格外关键，因为其商业上行空间很大一部分取决于留在有利于防务的采购和空域规则内，而不只是靠价格取胜。公司当下受益于 NDAA 和 Blue UAS
              体系，但这道护城河也让它对任何认证变化、审计发现或行政扰动敏感；据称 Blue UAS 项目已根据 2025 年 7 月国防部长备忘录，从 Defense Innovation Unit 转至 Defense
              Contract Management Agency。Table TR001 展示了这道采购关口如何与 FAA Part 107 视距飞行限制、通用 BVLOS 规则时间不确定性、与 29 个盟国部署挂钩的
              ITAR 和 EAR 义务、不断演进的隐私和数据保护规则，以及自主飞行或 Dock 相关事故造成伤害时的产品责任暴露并列存在。Figure FR001 强调，这些不是假设性的边缘案例：中国制裁已经生效，而
              FAA、出口管制、隐私和安全约束仍是可监控风险，可能改变 Skydio 的可服务市场或合同资格。公开证据没有显示已知 FAA
              执法或产品召回，但没有发现行动并不等于法律风险已清零，尤其是对一家向安全敏感任务销售产品的私营公司而言。
