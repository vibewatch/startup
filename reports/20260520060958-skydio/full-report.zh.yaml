      - number: '3.4'
        title: 替代方案、现状路径与相邻选择
        blocks:
          - type: paragraph
            body: >-
              现状替代方案是 Skydio 要增长就必须打掉的竞争基线。有人直升机仍是公共安全空中监视的主导工具，成本约 $500 至 $1,500/飞行小时；相比之下，自主无人机作业约 $20 至 $80/小时。ROI
              分析里成本差很有吸引力，但切换需要资本投入、飞手再培训、FAA BVLOS 授权和组织变革管理，这些都会拖慢采用。公用事业资产——输电线、管道、风机——的人工巡检队伍，每个资产类别每年巡检周期成本约
              $150,000 至 $500,000；无人机项目成本只是其中一小部分。固定监控摄像头结合外包保安，是周界监控的主要现状方案；机库 +
              无人机模式必须在单事件成本上证明自己，才足以覆盖资本支出和软件订阅费用。第三方无人机服务承包商（无人机即服务 运营商）为部分买方提供不自建无人机能力的替代路径；它们可以选择任何平台，包括面向非联邦账户的 DJI
              平台，这限制了 Skydio 捕获完整市场的能力。Shield AI 的 Nova 2 是相邻 ISR 平台，聚焦军方和执法突入行动中的 GPS 拒止室内侦察；它与 Skydio 在国防板块有重叠，但不直接竞争
              Skydio X10/X10D 的室外自主飞行和巡检任务。AgEagle Aerial Systems 聚焦固定翼测绘、农业和精准农业；与 Skydio 相邻，但服务不同买方和工作流。DoD
              项目中还存在内部自研和系统集成商替代路径，主承包商（L3Harris、Textron、AeroVironment）会提出把自己的 sUAS 方案整合进更大的平台项目；这条路径主要在大规模政府采购中与 Skydio
              竞争。
