      - number: '4.5'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Skydio 于 2026 年 4 月以 $4.4B 投后估值完成 $110M Series F 轮，由既有投资人领投。该轮超额认购；CEO Adam Bry
              拒绝吸收更多资本，并把资本需求下降包装成这轮融资最重要的事实。分析师把这个信号解读为两种可能：公司接近自给自足的一张信任票，或外部新投资人不愿在 $4.4B 估值上下注。到 2026 年，累计股权融资约
              $672M。Hercules Capital 参与 2023 年 2 月 Series E 轮；结合 Hercules 已知的风险贷款模式，暗示 Series E 股权融资旁可能还有信用额度或风险债务
              组件，但债务条款没有公开披露。2023 年 3 月 6 日提交的 SEC Form D 确认 $230M Series E 是豁免股权发行。截至 2026 年 5 月，公司没有公开 IPO 申报。SkyForge
              $3.5B 制造承诺形成一项前瞻资本义务，约为累计股权融资额的
              5×；资金来自收入、政府拨款、债务还是未来股权轮次，并未披露。任何公开文件都没有给出现金余额、烧钱速度和现金跑道数据，因此外部无法独立评估资本充足性；2026 年 4 月融资规模（$110M）更像是 8–18
              个月现金跑道，取决于假设烧钱速度，而不是多年缓冲。下一轮融资触发因素最可能是 SkyForge 建设里程碑叠加国防合同积压订单放量带来的营运资金需求。
