      - number: '5.3'
        title: 部署、BVLOS 远程运营与生态集成
        blocks:
          - type: paragraph
            body: >-
              Skydio 的部署模型面向远程和无人值守运行而设计。在无人机先遣响应（DFR）流程中，Dock hive——布设在关键位置的两个或更多 Dock 组成的集群——通过 DFR Command 接入 CAD 和
              NG911 调度系统。接到报警后，远程机长（RPIC）会在 20 秒内自动发射最近停在 Dock 内的 X10，让警员到场前先获得现场态势。X10 的 Pathfinder
              技术会自主绕开地形和空域限制。巡逻驱动的 DFR 场景里，警员在现场部署 X10 或 R10，再通过 DFR Command 和 5G/LTE 交接给远程操作员。基于浏览器的 Skydio Remote Ops
              让企业客户无需专有硬件，就能从任意地点发射并操控机队无人机。Skydio Academy 提供正式飞手培训，Skydio Regulatory Services 团队协助机构申请 FAA BVLOS
              豁免。防务侧，X10D 可将带有 STANAG 4609 合规 KLV 遥测的实时视频直接送入 Android Team Awareness Kit（ATAK）和 ATAK UAS Tool，并支持 RAS-A
              和 MAVLink 集成协议。Skydio Connect External Radio 与 Dock 分离部署时可延长点对点距离；Starlink 集成让 Dock 在无蜂窝覆盖的偏远地点也能联网。集成目录列出
              Axon Air（实时态势感知，并自动上传证据至 Axon Evidence）、RapidSOS（CAD 集成）、Pix4D、Bentley iTwin Capture、DroneDeploy 和 ESRI
              SiteScan 等合作伙伴。Dock 系统支持 Skydio Connect Fusion——自动混合 5G
              蜂窝和点对点链路——只要有蜂窝覆盖，实际航程就可不受限制，并为多无人机机队运行提供内置冲突消解。截至报告日，Skydio 服务超过 1,200 家公共安全机构、美国国防部每个军种以及 29
              个盟国；但公开来源无法独立核验这些客户数量。
