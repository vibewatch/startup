            body: >-
              截至 2026 年 5 月，Skydio 的商用产品家族包括五种不同硬件配置，以及配套软件平台。Skydio X10 是 2023 年 9 月推出的民用和商用旗舰四旋翼：重量 4.65 lbs（2.11
              kg），最长飞行 40 分钟，最高速度 45 mph，40 秒内完成部署，并可挂载模块化传感器包，包括 VT300-Z（64 MP 窄角、48 MP 长焦、640×512 辐射测温热成像）、VT300-L（64
              MP 窄角、50 MP 1-inch 广角、热成像和集成照明灯）以及 V100-L（仅视觉）。Skydio X10D 是防务版机体，物理尺寸和传感器架构相同，但为电子战环境、GPS 拒止导航和接入 ATAK 的
              STANAG 4609 KLV 遥测做了额外加固。Skydio R10 是第二个平台变体，官方称其适合战术公共安全和室内 DFR 场景；该产品 2024 年 1 月发布，并列入政府采购可用的 Blue UAS
              认证清单。Skydio F10 是产品页列出的固定翼长航时平台，但截至报告日公开规格有限。Skydio Dock for X10 是防风雨的自主停靠和充电站，可在 20 秒内发起 X10 任务，借助 Remote
              Ops 软件支持 24/7 运行，并集成 ADS-B、天气、GPS 等环境传感器，用于 BVLOS 空域感知。软件平台包括 DFR
              Command（面向公共安全无人机先遣响应项目的云端调度和机队管理）、Remote Ops（企业远程机队管理，可从任意浏览器访问）和 3D Scan（自主摄影测量与制图）。Skydio Extend
              集成层提供开放 API、webhook 和集成目录，连接 Axon Air、RapidSOS、CAD 系统、ATAK、Pix4D、Bentley iTwin、DroneDeploy、ESRI SiteScan
