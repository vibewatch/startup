      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              Skydio 的 GTM 主要是直接面向政府和企业，并靠采购工具打通流程，而不是依赖广泛经销商渠道。公司通过 GSA Schedule 和州采购合同销售，让联邦和州级采购无需逐份合同走单一来源论证即可合规完成。与
              Axon 的 DFR 集成合作，在 Axon 既有执法客户基础中创造了间接分销渠道，把 Skydio 延伸到已经使用 Axon 生态的机构。政府合同销售周期很长，从评估到授予通常需要 6 到 18 个月；这使
              CAC 衡量只能落在不公开的历史客户组上。公司没有披露获客成本、销售回本周期或净收入留存数字。代理证据显示切换成本较高：1,200+ 个公共安全机构使用 Skydio，且同比翻倍；51 个州交通部门中有 45
              个使用该平台；Skydio 称其 DFR Command 软件深度嵌入机构调度工作流。这些指标暗示流失率较低，但支撑估值中软件成分所需的 NRR 数字并不可得。
