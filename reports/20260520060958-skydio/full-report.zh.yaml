        - 高——失去 Axon 合作会削弱公共安全销售入口
        - 评估合同排他性、续约条款，以及 Axon 自有无人机硬件路线图
      - - ADS / DLA 经销商集中
        - 集中度风险
        - 陆军和空军国防订单经由 Atlantic Diving Supply（ADS）和 DLA 采购载体流转
        - 中——国防经销商集中；合同页面的多经销商政策有所缓冲
        - 识别国防收入中 ADS 渠道与直销的占比
      - - 公共部门预算节奏
        - 集中度风险
        - 市政和联邦年度预算周期导致采购不均衡；财年末订单激增
        - 中——政府市场固有特征；多年期合同载体部分抵消
        - 要求提供积压订单和延迟订单可见度
      - - 监管护城河持久性
        - 集中度风险
        - NDAA Section 889 / Blue UAS 合规把政府资金导向 Skydio；游说批评已有记录
        - 中——护城河目前存在；但易受监管漂移、DJI FCC 上诉或 NDAA 修订影响
        - 跟踪 FCC Covered List 程序和 NDAA 2027 文本
      - - 头部客户集中（国防）
        - 集中度风险
        - 陆军 + 空军占已知高价值订单大多数；海军、海军陆战队、海岸警卫队规模较小
        - 高——未披露细分收入；国防收入可能高度集中在 2–3 个军种
        - 要求按细分市场和军种提供收入赫芬达尔指数
      - - 先落地再扩张的 Dock 模式
        - 扩张驱动因素
        - 部署初始 Dock 系统的机构会回购更多 Dock（Brookhaven 8-Dock 扩张）
        - 正面——初始安装借助 CAD/NG911 集成形成切换成本护城河
        - 量化各机构随时间推移的平均 Dock 数量
      - - 软件订阅增购
        - 扩张驱动因素
        - DFR Command 和 Remote Ops 在硬件之上叠加经常性收入；集成越深，切换成本越高
        - 正面——若续约率强，可形成耐久的 ARR 层
        - 要求提供软件附加率和每个硬件客户的 ARR
      - - 中国电池供应链风险
        - 集中度风险
        - Oct 2024 制裁迫使所有客户细分市场同时进入电池配给
        - 高——短期已缓解；结构性供应链风险并未公开消除
        - 核实替代电池供应商认证和库存建设
    notes: 风险严重性是基于公开证据的分析师判断。扩张驱动因素代表客户经济性中的正向动能；集中度风险代表结构性脆弱点，已披露指标尚不足以抵消。
