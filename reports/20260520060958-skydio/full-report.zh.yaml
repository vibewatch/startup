      - number: '1.4'
        title: 规模指标、里程碑与反向事件
        blocks:
          - type: paragraph
            body: >-
              截至 2026 年 4 月，Skydio 的运营规模已经相当可观，而且维度很多。公司已交付超过 60,000 架无人机，记录超过 3.7M 次客户任务，拥有 3,800 多家企业客户，包括全美 1,200
              多个公共安全机构、美国军方每个军种、29 个盟国，以及 450 多家公用事业和能源公司。1600 万美国人居住在 Skydio 无人机首响应（DFR）机库两英里范围内。2026 年 3 月，美国陆军下单
              $52M，采购超过 2,500 架 X10D 无人机；这是陆军历史上规模最大的单一供应商战术 sUAS 订单。陆军也分别在 2022 年（Tranche 1，X2D）和 2025 年（Tranche
              2，X10D）将 Skydio 选为 SRR Program of Record。Defense Innovation Unit 于 2025 年 2 月刷新 Blue UAS 清单时，选择 X10D 用于
              NDAA 验证。美国空军为 TACP 和 EOD 单位授予了首批数百万美元合同。关键反向事件的时间线是：2024 年，Skydio 据报道裁员约 25%（约 100
              名员工），原因是战略重心从消费市场转向政府和国防。2024 年 10 月，中国因 Skydio 向台湾销售产品而制裁公司；Skydio 确认其在台湾唯一客户是 National Fire
              Agency，并因电池尚未完成本土化而对电池实行配给（每架无人机一块）。新的非中国电池来源预计在 2025 年春季到位。这些反向事件凸显两项重要尽调议题：第一，2024
              年重组说明纯企业模式需要一次事前并未完全预期的再校准；第二，电池事件暴露了供应链依赖，公司公开承认并承诺解决。2026 年 4 月 Series F 后一天，Skydio 宣布名为 SkyForge 的
              $3.5B 美国制造投资承诺，计划创造 2,000+ 个 Skydio 岗位和 3,000+ 个供应链岗位，并向美国本土供应商投入至少 $1B。
