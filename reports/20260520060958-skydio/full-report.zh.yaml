      - number: '3.5'
        title: 护城河耐久性、切换成本与竞争风险
        blocks:
          - type: paragraph
            body: >-
              Skydio 的竞争护城河建立在三根相互重叠的支柱上：监管保护（NDAA/Blue
              UAS）、自主能力差异化和生态锁定。每一项都真实存在，但也都有明显漏洞。监管护城河被直接批评为游说驱动的构造，而不是基于技术的竞争优势。DroneXL 和 Axios 都在 2024 年报道，Skydio
              雇佣游说者和公司高管推动限制中国无人机制造商的 NDAA 条款——也就是创造有利于 Skydio 商业化的市场条件。批评并不否定护城河，但说明护城河取决于政治：政府更替、法律挑战或双边贸易谈判都可能削弱 NDAA
              条款，让 DJI 重返联邦市场。自主能力差异化——Skydio 的 AI 驱动避障、自主跟踪和机库 + 无人机任务执行——是真实的，且当前 Blue UAS 同行无法匹配。不过，DJI 的全球研发规模（估计
              10,000+ 名工程师）意味着，一旦监管环境变化，DJI 可以迅速补上能力缺口。公共安全机构常见多供应商并用：它们可以、也确实会同时采购多个获批供应商的产品，限制 Skydio
              宣称独占账户的能力。切换成本不低，但也不是高到无法跨越：Skydio 的 DFR Command 软件、Connect 机队管理和专有机库集成会形成工作流依赖，但竞争平台可以在不完全替换 Skydio
              的情况下并行加入。2024 年 10 月中国电池制裁暴露出关键供应链漏洞——Skydio 在宣传自己是完全本土制造商时，电池供应仍依赖中国组件。Skydio
              公开承认了这一矛盾，削弱了一项关键差异化主张。最后，商品化压力真实存在：更多美国制造商获得 Blue UAS 许可后，监管护城河的独占性会下降，Skydio 必须更依赖产品差异化和切换成本来守住装机基础。
