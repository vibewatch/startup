      - number: '1.3'
        title: 资本结构、估值轨迹与投资人版图
        blocks:
          - type: paragraph
            body: >-
              Skydio 的融资历史覆盖 2014 至 2026 年六轮已知股权融资。公司 2023 年 2 月完成 $230M Series E 轮，使累计融资达到 $562M，投后估值超过 $2.2B。Series E
              由 Linse Capital 领投，既有投资方 Andreessen Horowitz、Next47、IVP、DoCoMo、NVIDIA、UP.Partners 继续参与，新投资方 Hercules
              Capital 和 Axon 也加入。Series E 通过 2023 年 3 月 6 日向 SEC 提交 Form D 完成登记。2026 年 4 月，Skydio 宣布由既有投资人领投的 $110M
              Series F 轮，累计融资增至约 $672M，投后估值达到 $4.4B。这轮融资的看点在于既有投资人超额认购，而 Bry 明确拒绝更多资本，把较小融资规模包装成经营杠杆增强、接近自给自足的证据。DroneXL
              的第三方分析指出，该轮没有披露头部新机构领投方；既有投资人结构既可以解读为信任票，也可能意味着新投资人不愿按 $4.4B 价格买入。Andreessen Horowitz 领投 2021 年 Series
              D；Linse Capital 领投 2023 年 Series E；Series F 没有公开点名领投方。在年收入「数亿美元」基础上给出 $4.4B 估值，DroneXL 估计 Skydio
              的交易倍数为过去十二个月收入的 10x-20x——对一家带有 AI 特征、拥有监管护城河的硬件公司而言可以解释，但相对国防科技同行并不便宜。收入增速、毛利率和净美元留存率仍未披露。
