  - id: TI005
    title: 公开财务缺口表
    notes: 每个缺口都对应财务承销所需、但截至 2026-05-20 在任何公开来源中未找到的信息。 严重度评级代表尽调优先级，不代表负面结果发生概率。
    columns:
      - 缺失指标
      - 对承销为何重要
      - 对 $4.4B 估值判断的影响
      - 具体尽调路径
    rows:
      - - 经审计分业务毛利率
        - 判断硬件是增厚利润，还是由软件补贴；对 LTV 模型至关重要
        - 没有毛利率无法计算远期收入倍数；10–20x 可能合理，也可能站不住
        - 向 CFO James LaCamp 索取经审计利润表；按硬件 / 软件 / 服务拆分的分业务 P&L
      - - ARR 与 ARR 增长率
        - 软件 ARR 是估值的经常性收入底座；“数亿美元”总收入可能主要来自硬件
        - 若 ARR <$50M，$4.4B 对应的隐含 SaaS 倍数极高；若 ARR >$200M，倍数可辩护
        - 数据室 ARR 明细；自 2022 以来的月度 ARR 队列
      - - 净留存率（NRR）
        - 显示现有 1,200+ 家机构和 3,800+ 家企业客户中的扩张与流失
        - 高 NRR（>120%）是价值创造的主要驱动；低 NRR（<100%）在该估值下是红旗
        - CRM / 计费系统导出；按细分 NRR；按队列流失分析
      - - 月度烧钱速度和现金跑道
        - 判断真实资本充足性；相对 $3.5B SkyForge 承诺，$110M Series F 规模偏小
        - 若烧钱速度 >$14M/month，现金跑道可能 <8 个月，下一轮融资迫在眉睫
        - 银行流水；月度 P&L；CFO 提供的 Series E 以来现金流桥
      - - Hercules Capital 债务条款和约束性条款
        - 风险债附带约束性条款、认股权证和到期风险；条款可能限制股权分配
        - 若约束性条款与收入爬坡或 SkyForge 投资冲突，会形成重大表外风险
        - 完整信贷协议；约束性条款清单；认股权证覆盖；到期日
      - - SkyForge 资本开支节奏和资金机制
        - 5 年 $3.5B 可能需要新增股权、债务或远超此前累计 $672M 融资的收入生成能力
        - 若资本开支由收入支付，可验证自给自足叙事；若靠债务支付，会改变杠杆画像
        - 董事会批准的资本开支计划；制造扩建时间表；融资承诺
