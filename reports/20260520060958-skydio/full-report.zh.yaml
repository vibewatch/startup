  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Skydio 的投资逻辑建立在四个复合优势上：NDAA Blue UAS 框架形成的监管护城河，实际上把 DJI 及其他中国来源无人机排除在联邦采购之外；防务和公共安全渠道由美国军方所有军种、超过 1,200
              家公共安全机构和 29 个盟国锚定；平台级自主飞行技术栈——避障、Dock 型 DFR 和 Skydio Autonomy Engine——竞品尚未大规模匹配；以及国内制造姿态（$3.5 billion
              SkyForge 承诺）强化了符合 NDAA 的采购资格。这些优势不是假设：陆军 $52 million X10D 订单、空军 EOD 后续授标和 USAFCENT Dock 部署，确认 Skydio
              已在多个防务垂直从试点走向正式项目。2026 年 4 月由现有投资人领投、估值 $4.4 billion 的 Series F
              中，据称有投资人想追加投入但被拒绝，释放出内部人士继续有信心的信号。反向逻辑同样扎实。财务不透明是承销的最大约束：毛利率、ARR、NRR 和现金消耗均未披露，无法确认 $4.4 billion
              价格是否与价值相符。2024 年 10 月电池供应冲击——迫使大约每月每客户一块电池的限供——暴露了结构性硬件依赖，软件溢价倍数无法简单吸收。Blue UAS
              护城河是政府政策，可能被收窄、挑战或不再续期。2024 年秋季约 25% 的裁员引发执行风险问题。DoD 合同收入集中带来块状波动和单一事件下行。若这些缺口不解决，公开证据无法支持买入建议。Table TV002
