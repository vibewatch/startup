              和投资人访谈中的披露——属于公司主张，尚未由第三方财务报表独立审计或验证。关键私有缺口包括：毛利率（未披露）、软件订阅 ARR（未披露）、净收入留存（未披露）、月度烧钱速度（未披露），以及 Series F
              部署后的现金余额（未披露）。按企业无人机行业常见水平，单架无人机收入可以用 $10,000–$50,000+ 代理估计；在已交付 60,000 架基础上，意味着累计硬件收入
              $600M–$3B。但这没有考虑年度节奏、订阅挂载率或服务收入。缺少分板块收入披露时，「数亿美元」年收入的质量、经常性和利润率都无法验证。这些缺口构成估值承销的基本尽调阻塞项。
