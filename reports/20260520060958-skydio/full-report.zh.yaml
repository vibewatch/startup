      - 阈值 / 可观察事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 被 Blue UAS 名单移除或暂停资格
        - 任何可信公开报告显示 DCMA 审计未通过、Blue UAS 项目终止，或国会行动将 Skydio 从批准名单中移除
        - 抹掉 Skydio 最持久的单一结构性优势；DoD 和联邦采购通道坍塌；估值回到纯硬件 2–4x 收入倍数
        - 退出或完全对冲持仓；从头重做承销判断
      - - 电池供应中断再次发生
        - 第一次解决后的 12 个月内再次出现重大配给事件，或到 2026 年 Q4 仍未披露合格国内电池供应商名称
        - 指向结构性而非一次性供应风险；客户流失加速；DFR 项目可靠性叙事坍塌；新投资人进一步打折
        - 重新评估投资逻辑；不加仓；启动供应链尽调
      - - DoD 采购收缩
        - 已公布 DoD 无人机预算同比削减超过 20%，或失去陆军 / 空军正式项目资格且没有替代合同
        - 最大收入板块消失；公司被迫经营重组；Series G 更可能以更低估值融资
        - 减持或退出；跟踪季度采购披露
      - - 披露后毛利率低于 25%
        - 任一财务报表披露的经审计综合毛利率 ≤25%
        - 硬件主导的经济模型撑不起 10–20x 收入倍数；SaaS 溢价层极小；公允价值降至 4–6x 收入（约 $1.2–3B）
        - 将建议调整为回避；在下一次流动性窗口退出
      - - 收入低于公司说法
        - 经审计 FY2025 收入低于 $200M（显著低于「数亿美元」说法）
        - 管理层叙事可信度受损；按 $4.4B 投资的 Series F 投资人多付 2–3x；下调估值融资可能发生
        - 退出；重新评估所有投资逻辑锚点
      - - 关键人物离职
        - CEO Adam Bry 或联合创始人 Abe Bachrach 离职，且没有计划内继任安排
        - 公司身份和国防关系依赖联合创始人；人才留存和愿景延续存在风险
        - 跟踪；启动继任尽调；可能触发重新评估
    notes: 触发器来自第 4 章和第 7 章的公开风险证据；私营公司的监测路径有限；部分触发器只有在流动性事件或自愿披露时才会显现。
    claimRefs:
      - CV015
      - CV023
      - CV024
      - CV025
      - CV026
      - CV034
      - CV039
  - id: TV006
    title: 最终尽调问题清单
    columns:
      - 主题
      - 缺失证据
      - 对估值为何重要
      - 负责人 / 尽调路径
    rows:
      - - 分板块毛利率
        - FY2024 和 FY2025 经审计的综合及分板块毛利率（硬件无人机、Dock / 基础设施、软件订阅、服务）
        - 30% 毛利率支撑 5–7x 收入倍数；60% 毛利率支撑 15–20x；没有该数据，就无法独立承销 $4.4B 估值
        - CFO James LaCamp；资料室损益表
      - - ARR 和净留存率
        - 按产品拆分的年经常性收入（DFR Command、Remote Ops、3D Scan、Connect）；2022 年以来按客户板块拆分的 NRR
        - 判断软件层是否足够重要（可支撑溢价）还是极小（只能套硬件倍数）；可让公允价值相差 2–4x
        - CRO Callan Carpenter；产品计费系统导出
      - - 电池供应链状态
        - 合格国内电池供应商名称、产能爬坡时间表、单位成本相对原中国来源的变化，以及截至 2026 年 Q2 的交付确认
        - 电池中断是已确认运营风险中严重度最高的一项；供应若未解决，所有情景下运营脆弱性都会延续
        - CEO Adam Bry；资料室供应商资格确认函
      - - 股权结构表和优先股堆叠
        - 完整股权结构表；按轮次拆分的清算瀑布；反稀释条款；既有投资人 LP 按模型估值而非市场估值带来的老股压力
        - 决定退出时普通股真实价值；若以 $1.5–3B 退出，优先股清算优先权可能彻底清零普通股和员工期权
        - 法律顾问；Series F 条款清单和此前轮次文件
      - - SkyForge 融资计划
        - 董事会批准的 $3.5B SkyForge 承诺年度资本开支计划；资金来源（内部现金、债务、补助、未来股权融资）
        - $3.5B 是累计股权融资额的 5x；若资金未落实，制造投资逻辑只是愿景，未来必须通过稀释性股权融资补足
        - CFO；董事会批准的资本开支计划和融资承诺函
      - - 经审计收入和烧钱速度
        - 经审计 FY2025 收入、COGS、毛利、运营费用和现金消耗；Series F 后现金跑道预测
        - 确认或推翻「数亿美元」收入说法；现金跑道决定 12–18 个月内是否马上需要再融资
        - 审计机构；资料室 P&L 和董事会现金流计划
    notes: 六项尽调事项都会阻挡买入建议。第 1 项（毛利率）和第 6 项（经审计收入）对独立承销最关键。第 3–5 项（电池、股权结构表、SkyForge）是评估风险调整后下行所必需。
    claimRefs:
      - CV014
      - CV019
      - CV025
      - CV037
      - CV038
      - CV039
