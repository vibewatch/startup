      - number: '8.5'
        title: 退出准备度、投资逻辑破裂触发点与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              Skydio 的退出准备度受三点卡住：公司仍是私有结构，部分国防项目涉密，也没有审计财务。若按当前 $4.4B 估值
              IPO，公司必须证明毛利率在扩张，讲清年经常性收入（ARR）轨迹，并解决供应链风险，才能经受公开市场审视——SEC 的 10-K 披露要求会迫使 Skydio
              拿出其目前回避的财务透明度。L3Harris、RTX、Northrop 等国防主承包商发起战略并购，也是一条可行退出路径，但 NDAA 对中国组件供应商的限制和 CFIUS
              审查，都要求公司提供清晰的供应链文件。按当前价格向主权财富基金或 PE 买方做老股出售也可能发生，但会面对同样的尽调要求。表 TV005 的投资逻辑失效触发点界定了需要退出或重估的具体事件：Blue UAS
              清单状态变化、电池供应问题复发、DoD 采购收缩超过 20%、披露毛利率低于 25%，或经审计收入显著低于「数亿美元」说法。表 TV006
              的最终尽调请求列出七项具体证据，只有这些证据到位，建议才可能从观察转为买入。在这些问题解决前——尤其是毛利率、ARR、电池供应商身份和股权结构表——现有证据不足以支持以 $4.4B 买入。图 FV004
              汇总了所有评估维度下可供投委会使用的 KPI 打分。
