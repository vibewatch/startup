      - number: '8.4'
        title: 情景分析——乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              三个情景界定投资区间。乐观情景下，Skydio 到 2027 财年收入达到 $600 million 或更高（在当前「数亿美元」基数上约 35–50% 复合增长），软件 ARR 超过总收入 40%，毛利率达到
              55% 或以上，电池供应链通过合格国内供应商完全解决，BVLOS 规则制定打开大型新商业 DFR 市场，并以 15–20x 收入倍数发生流动性事件，符合防务软件平台估值。对应退出价值为 $8–12
              billion，相对当前 $4.4 billion Series F 价格，为按现估值进入的投资人带来 2–3x 回报。基准情景假设收入温和增长（到 2027 财年 $300–500
              million）、收入组合偏硬件、混合毛利率 35–50%、电池供应部分解决，并以 10–12x 收入退出——对应估值 $3.5–6 billion，约等于或略高于当前 Series F
              价格，新投资人回报有限。悲观情景包括重大 DoD 合同丢失或采购放缓、电池供应冲击复发、Blue UAS 政策挑战，或员工队伍扰动迫使公司下轮融资下调估值；公司以 $2–3 billion 融资，或以
              $1.5–2.5 billion 退出，意味着相对当前 Series F 价格亏损 40–65%。结合当前轨迹，基准情景概率最高；但相对当前入场价，上行有限（2–3x
              乐观回报需要多个方面同时显著执行），同时悲观尾部风险实质存在，因此按当前估值应给出观察而非买入建议。Table TV004 给出正式情景结构。
