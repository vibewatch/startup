      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              Skydio 的买方版图按采购路径、预算归属和采用触发因素切成不同层。公共安全机构（警察、消防、EMS）按客户数是当前最大板块（截至 2024 年末 1,200+ 家机构）。典型决策流程是：部门主管识别用例 →
              通过联邦 / 州拨款资助无人机项目试点（FEMA、DHS、Department of Justice Byrne JAG grants）→ 硬件评估 → 通过州或县合作采购合同或直接采购完成购买 →
              软件订阅带来经常性收入。用户（现场操作员）常常不同于付款方（部门预算 / 拨款官员），采用也常由拨款资助的试点推动，而不是来自日常运营预算。国防和军方采购通过项目办公室运转：AFWERX（空军快速采办）、Army
              RCCTO（Rapid Capabilities and Critical Technologies Office）、Marine Corps warfighting labs，以及联合 DIU 路径。Blue
              UAS 许可名单是首要过滤器：只有名单内平台才能进入某些 DoD 采办渠道。合同结构从 SBIR/STTR 研发奖励，到 OTA（Other Transaction Authority）协议，再到标准 FAR
              合同。公用事业和能源公司（截至 2024 年 450+ 家）通过运营或现场服务组织掌握的资本开支或运营预算采购。ROI 由强制合规巡检要求驱动：大宗电力系统的 NERC CIP、FAA
              强制风机巡检、管道完整性管理要求。场站安防买方（企业和工业）仍处早期；预算归属实体安防或企业技术组织。盟国（截至 2024 年 29 个）通过 Foreign Military
              Sales（FMS）、带出口许可的直接商业销售（ITAR/EAR），或 NATO/FVEY 采购框架采购。交通基础设施业主（DOT、州 DOT、港务局）是增长中的相邻市场；桥梁巡检、铁路监测和港口安防都是已记录的
              Skydio 用例。
