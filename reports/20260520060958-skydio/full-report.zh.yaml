              Skydio 面向公开市场披露的牵引力指标很强，也均由公司披露：已交付 60,000+ 架无人机、完成 3.7M 次客户任务、拥有 3,800+ 家企业客户、1,200+ 个公共安全机构（同比翻倍）、450+
