      - number: '8.3'
        title: 可比公司组合与估值框架
        blocks:
          - type: paragraph
            body: >-
              没有私营无人机或防务自主飞行公司公开披露财务，因此可比组合以公开上市的防务无人机公司为锚，并在可得时补充已披露的私募轮估值。AeroVironment（AVAV）是最相关的公开基准：截至 2026 年 5
              月，其过去十二个月收入约 $1.61 billion，市值约 $8.1 billion，交易倍数约为 5.2x EV/Revenue 和 4.3x Price/Sales。AeroVironment
              经审计、EBITDA 层面盈利，且毛利率结构已知——这些都是 Skydio 在公开证据语境下缺乏的优势。Red Cat Holdings（RCAT）是一家规模更小、符合 NDAA 的公开无人机公司，市值约
              $420 million；鉴于阶段和规模，它不能直接可比，但说明小型防务无人机股票的公开市场可能波动很大。Joby Aviation（JOBY）作为一家收入前 eVTOL 公司，市值约 $9.8
              billion，投资逻辑贴近防务；它说明，即便近期没有盈利，只要监管和技术护城河持久，资本市场也会给予溢价倍数。私募市场中，Shield AI 据称在 2023 年一轮融资中估值约 $2.7 billion（防务
              AI 自主，软件为主），Anduril Industries 在 2024 年一轮融资中达到约 $18 billion 估值（更广泛的防务 AI 平台）。Skydio 的 $4.4 billion 估值位于
              Shield AI 与 Anduril 之间的私营防务 AI 光谱上，但它包含大量硬件收入，通常会压低倍数。以 $4.4 billion 估值对应公司所称「数亿美元」收入（解读为 $220–440
              million），Skydio 隐含 EV/Revenue 为 10–20x——显著高于 AVAV 可比项。只有在软件层足够大（ARR ≥ 总收入 40%）、增长率持续高（YoY ≥50%）且毛利率高于 50%
              时，这一溢价才站得住。公开来源无法确认任何一项。Figure FV002 展示收入和倍数假设下的估值敏感性。Figure FV003 展示乐观、基准和悲观情景下的回报区间。
