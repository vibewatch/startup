  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Skydio 横跨五类竞争对手，每一类都必须分开分析，因为它们代表不同的买方取舍和替代风险。第一，全球主导型存量巨头：DJI 按出货量掌握全球商用无人机市场约 70% 份额，并在 NDAA
              限制前主导美国公共安全和企业存量装机。DJI 在光学、续航和载荷上与 Skydio 大体可比甚至更强；但 NDAA Section 848 及后续条款禁止美国联邦政府采购 DJI，从而形成 Skydio
              最主要的受保护渠道。第二，与中国相关的替代者：Autel Robotics 由中国背景创立，营销上主打 DJI 替代方案，但同样面临 NDAA 限制，且截至 2026 年 5 月不在 DIU Blue UAS
              许可名单上。第三，通过美国 Blue UAS 审查的直接同行：Red Cat Holdings（Teal 2、Golden Eagle）、Parrot（ANAFI USA）和 Freefly
              Systems（Alta Astro）在重叠板块竞争，分别覆盖国防 ISR、通用企业与公共安全、巡检与媒体。它们都没有 Skydio 的自主深度、机队规模或机库 + 无人机产品。第四，相邻国防 ISR
              玩家：Shield AI 的 Nova 2 与公司在 GPS 拒止室内侦察场景重叠，但不是 X10/X10D 在室外自主 UAS
              上的直接竞争者。第五，现状替代方案：有人直升机（公共安全空中监视）、人工巡检队伍（公用事业）、固定摄像头加保安值守（场站安防）和第三方无人机服务承包商，都是 Skydio
              必须替代的“不行动”选择。只有理解全部五类，才能判断 Skydio 的差异化到底是耐久产品能力，还是主要来自监管。
