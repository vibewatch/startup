  - id: FV001
    title: 推荐逻辑流
    type: flow
    claimRefs:
      - CV001
      - CV005
      - CV012
      - CV013
      - CV024
      - CV025
      - CV034
    data:
      nodes:
        - id: revenue-scale
          label: 收入与客户规模（数亿美元；3,800+ 客户）
        - id: regulatory-moat
          label: 监管护城河——Blue UAS / NDAA 采购壁垒
        - id: defense-channel
          label: 国防渠道深度（全部美国军种；29 个盟国；1,200+ 公共安全机构）
        - id: financial-opacity
          label: 财务不透明——无经审计利润率、ARR 或烧钱速度
        - id: supply-risk
          label: 供应链与集中度风险（电池；DoD 收入依赖）
        - id: valuation-stretch
          label: 估值溢价——隐含 EV/Revenue 10–20x，对比 AVAV 5.2x
        - id: capital-risk
          label: 资本结构与稀释风险（SkyForge 未获资金落实；清算优先权压顶）
        - id: recommendation
          label: 推荐：观察——尽调未解锁前不以 $4.4B 买入
      edges:
        - from: revenue-scale
          to: regulatory-moat
          label: 强化
        - from: regulatory-moat
          to: defense-channel
          label: 支撑
        - from: defense-channel
          to: financial-opacity
          label: 被部分抵消
        - from: financial-opacity
          to: valuation-stretch
          label: 无法支撑
        - from: supply-risk
          to: valuation-stretch
          label: 压低
        - from: valuation-stretch
          to: capital-risk
          label: 叠加放大
        - from: capital-risk
          to: recommendation
          label: 导致
  - id: FV002
    title: 估值敏感性——收入 × 倍数矩阵
    type: bar
    claimRefs:
      - CV012
      - CV013
      - CV027
      - CV031
      - CV032
      - CV033
    data:
      items:
