      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              Skydio 可服务市场最大的结构性驱动因素是美国政策：NDAA 中国无人机限制（FY2020 Section 848，以及至 FY2025 的后续年度 NDAA 条款）禁止美国联邦机构采购 DJI、Autel
              Robotics、Parrot 和其他 CISA 名单中国实体制造的无人机。这实际上把整个联邦和 DoD 市场导向本土采购，并推动州和地方机构跟进。DIU 的 Blue UAS 许可名单把已审查平台的采购周期从
              12-24 个月压缩到 3-6 个月，为 Skydio 创造结构性的上线速度优势。FAA BVLOS 监管放松是第二个关键驱动因素：没有 BVLOS 授权，DFR
              项目每次飞行都需要专门现场飞手，自主首响应的经济性就消失。FAA 于 2022-2023 年开始发放有限 DFR BVLOS 豁免，并在 2023 年提出更广泛规则制定；豁免发放速度限制了机构全面部署自主 DFR
              项目的节奏。AI 与自主能力的 ROI 是复合驱动因素：Skydio 的自主避障降低了飞手技能要求，扩大可部署操作员范围，并相较手动驾驶平台把单次飞行成本估计降低
              30-60%。主要约束包括：资本强度——Skydio Dock 基础设施每个站点需要 $50-200K+ 投入，限制固定预算较小机构的采用速度；培训和工作流变化——DFR 项目部署需要 6-18
              个月的操作员培训、BVLOS 豁免获取、CAD 集成和政策制定；采购周期长度——即使有 Blue UAS 简化流程，国防和联邦采购周期仍有 12-36 个月；供应链脆弱性——2024 年 10 月中国对
              Skydio 的制裁造成电池配给事件，说明即便在美国组装，公司硬件供应链仍依赖中国组件。最重大的尾部风险，是 NDAA 中国无人机条款被法律或政治手段回滚：DJI 和美国本土无人机经销商一直游说反对
              Section 848，任何成功的法律挑战或 NDAA 修订，都可能立刻重新打开联邦、甚至州市场中的中国无人机采购，抹去 Skydio 最主要的结构性护城河。
