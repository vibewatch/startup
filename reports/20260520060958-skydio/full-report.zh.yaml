      - number: '7.2'
        title: 供应链与运营风险
        blocks:
          - type: paragraph
            body: >-
              最具体的运营风险，是 2024 年 10 月 28 日浮出水面的电池供应冲击：中国制裁切断了单一来源的电池供应，迫使 Skydio
              大约每名客户每月只配给一块电池。该事件把原本抽象的供应商集中担忧，直接变成交付和客户服务问题；管理层曾表示目标是在 2025 年春季前认证替代来源，但公开材料尚未确认这一目标已实现。Table TR002
              说明，这个问题为何不只关乎电池：一家销售
              Dock、自主基础设施和任务关键型飞行器的硬件公司，必须管理召回风险、国内转产期间的制造质量、联网运行的网络安全控制，以及可能触发停飞或合同暂停的自主飞行边缘案例。Skydio
              的缓释措施真实存在，但并不完整。公司提到 SOC 2 Type II、FIPS 140-2 和仅美国云部署；可靠性仪表盘称 Dock
              型飞行大约比手动飞行安全三倍。这些事实有助于刻画运营成熟度，但无法消除新来源认证、良率爬坡，或 FedRAMP 授权是否已超出未确认状态等执行风险。
