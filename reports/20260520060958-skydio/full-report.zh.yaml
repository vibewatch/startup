  - id: TM004
    title: 增长驱动因素与采用约束表
    description: >-
      Key forces driving and constraining Skydio's market growth, with direction, timing, valuation relevance, and
      diligence asks.
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 对采用的影响
      - 尽调问题
    rows:
      - - NDAA 中国无人机限制（第 848 条及后续条款）
        - 驱动因素 —— 结构性
        - 当前生效；需每年 NDAA 续期
        - 要求联邦机构采购国产产品；在州 / 地方市场加速从 DJI 转向 Skydio
        - 逐财年跟踪 NDAA 续期；监测 DJI 游说及任何修正案尝试
      - - Blue UAS DIU 准入名单（采购提速）
        - 驱动因素 —— 结构性
        - 当前生效；DIU 每季度更新名单
        - 把获准平台的联邦采购周期从 12-24 个月压到 3-6 个月；让现有名单成员获得先发优势
        - 核实 Skydio 现有及未来平台能否持续保持有效准入；监测名单变化
      - - FAA BVLOS 监管放宽（DFR 项目）
        - 驱动因素 —— 有条件
        - 现在逐项豁免；更广泛规则制定 2024-2026
        - 没有 BVLOS，DFR 需要现场飞手，经济账就不成立；BVLOS 放开后，完整自主 DFR 部署才跑得通
        - 监测 FAA DFR NPRM 及豁免批准率；延迟或限制会压住 DFR 项目增长
      - - DoD Replicator 计划与自主 sUAS 需求
        - 驱动因素 —— 近期
        - FY2024-2026 首批批次
        - DoD 为自主、可消耗无人机明确列预算；Skydio 作为 Blue UAS 准入的美国本土供应商，位置有利
        - 确认 Skydio 在 Replicator 采购中是否有有效合同或机会；量化收入订单积压
      - - AI / 自主性 ROI —— 降低飞手要求和单次飞行成本
        - 驱动因素 —— 持续
        - 2024-2030 逐步复利累积
        - 扩大可部署操作员基数；降低每任务小时成本；支撑企业和公用事业规模采用
        - 量化 Skydio 相比直升机 / 载人机组的实际每飞行小时成本；收集客户 ROI 案例
      - - 中国电池 / 组件制裁（October 2024 事件）
        - 约束 —— 反向
        - 已生效；供应链恢复在 2026 仍在持续
        - 造成交付积压和电池配给；即便定位为美国组装，仍暴露硬件供应链依赖
        - 评估电池供应链多元化进展；量化 2024 交付中断导致的客户流失
      - - 资本强度 —— Dock 基础设施与部署成本
        - 约束 —— 持续
        - 长期存在；硬件成本随时间下降可部分抵消
        - 限制小型机构采用速度；每个 Dock 站点 $50-200K+，需要实质性资本投入
        - 量化平均 Dock 站点部署成本；评估 Skydio 是否提供融资或租赁方案来降低门槛
      - - NDAA 法律 / 政治回撤风险
        - 约束 —— 尾部风险
        - 风险持续；如果 DJI 发起法律挑战或国会修正案，可能落地
        - 如果中国无人机重新进入美国联邦采购，主要结构性护城河可能消失
        - 监测 DJI 游说披露（FARA）、国会行动及对 NDAA 第 848 条的任何法院挑战
