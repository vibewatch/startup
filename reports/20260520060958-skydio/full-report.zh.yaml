  - id: TM001
    title: 市场定义表
    description: >-
      Skydio's five addressable sub-markets with included/excluded spend, primary buyer/payer, and status-quo
      substitutes that define the competitive baseline.
    columns:
      - 细分市场 / 类别
      - 纳入支出
      - 排除支出
      - 主要买方 / 付款方
      - 对 Skydio 的意义
    rows:
      - - 无人机先到场（DFR）/ 公共安全
        - 无人机硬件、停机舱、DFR Command 软件、培训、BVLOS 豁免、机队管理订阅
        - 消费级娱乐无人机、美国之外的非 DFR 基础无人机项目
        - 警察、消防、EMS 部门——资金来自部门预算和联邦 / 州补助（FEMA、DHS、DOJ）
        - 按客户数看是当前最大细分市场（1,200+ 家机构）；DFR Command 软件订阅带来经常性收入
      - - 关键基础设施巡检
        - 平台硬件、巡检软件（3D Scan）、基于停机舱的自动巡检、服务
        - 农业巡检（喷洒无人机）、远程固定翼货运
        - 公用事业、能源公司、铁路、电信运营商——资本开支和运营开支预算由运营负责人掌握
        - 450+ 家公用事业 / 能源客户；强制合规巡检带来重复需求
      - - 国防 / 国家安全 sUAS
        - 短程侦察硬件（X10D、R10）、国防级软件、OTA/FAR 合同
        - 重型打击无人机、大型固定翼 ISR、反无人机 C-UAS 系统、外国军事平台
        - DoD 项目办公室（AFWERX、DIU、RCCTO），通过 FMS/ITAR 面向盟军
        - 覆盖每个美国军种和 29 个盟国；2024 年转向后增长最快的细分市场
      - - 场地安防 / 远程监控
        - 用于周界监控、异常检测、集成安防软件的停机舱 + 无人机系统
        - 传统固定监控摄像头、实体安保人员、其他非无人机周界系统
        - 企业设施、工业园区、港口、数据中心——实体安全或 CTO 预算
        - 新兴细分市场；大型存量市场中的绿地机会（全球实体安防约 $400B）
      - - 联邦 / 文职政府（非 DoD）
        - 面向 CBP、DHS、联邦土地管理、林业、测绘的 Blue UAS 认证平台
        - 受 NDAA 限制的中国平台、不在 Blue UAS 认证清单上的平台
        - 联邦文职机构——GSA 采购目录、NDAA 要求的国产单一来源采购
        - 增长中的相邻市场；NDAA 限制要求采购 Blue UAS 认证平台
      - - 排除：消费 / 娱乐
        - N/A — 不可服务
        - DJI 消费级、Autel 娱乐级、Parrot 消费级
        - 爱好者、发烧友——直接消费购买
        - Skydio 于 2024 年退出消费市场；明确排除在当前战略之外
      - - 排除：商业配送 / 农业
        - N/A — 不可服务
        - Amazon Prime Air、Wing 配送无人机、农业喷洒（DJI Agras）
        - 零售商（配送）和农户（农业）——不是 Skydio 买方基础
        - 使用场景、竞争集合和监管框架不同；排除在 TAM 分析之外
