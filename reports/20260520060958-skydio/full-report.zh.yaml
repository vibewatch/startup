  - id: TM002
    title: TAM / SAM / SOM 规模测算视角表
    description: >-
      Multiple market sizing estimates across different scopes, geographies, and methodologies. Contradictory estimates
      preserved; confidence reflects data quality and applicability to Skydio.
    columns:
      - 视角 / 发布方
      - 年份 / 地理范围
      - 数值 / CAGR
      - 方法
      - 置信度
      - Skydio 规模测算限制
    rows:
      - - 全球商用无人机 TAM（Grand View Research）
        - 2023→2030 / 全球
        - $6.5B→$31.5B，CAGR ~25%
        - 自下而上行业调研；仅商用（不含军事）
        - 中
        - 包含消费、农业、配送等不在 Skydio 市场内的细分市场；高估 TAM
      - - 全球商用无人机 TAM（MarketsandMarkets）
        - 2023→2030 / 全球
        - $14.1B→$55.8B，CAGR ~22%
        - 跨垂直和地理范围的需求侧建模
        - 中
        - 方法未公开披露；显著高于 GVR 估计——反映范围差异
      - - 全球商用无人机 TAM（Precedence Research）
        - 2023→2032 / 全球
        - $12.5B→$58.5B，CAGR ~18.6%
        - 自上而下 + 自下而上混合
        - 低-中
        - 与 M&M 一致；不含军事支出，而军事支出会影响 Skydio 国防细分市场
      - - 全球商用无人机 TAM（Fortune Business Insights）
        - 2024→2030 / 全球
        - 2030 年达 ~$48.9B
        - 需求侧调研；所有商用垂直领域
        - 低
        - 显著高于 GVR；方法差异；未拆分政府子细分市场
      - - 美国公共安全无人机市场（Business Research Insights）
        - 2023→2030 / 美国（估计）
        - $300-450M（2024）→ $950M-1.1B（2030），CAGR ~17.5%
        - 公共安全机构、市政采购；美国约占全球 35-40%
        - 中
        - 最接近 Skydio 核心客户基础的单一细分市场估计；方法披露有限
      - - DoD sUAS 可见合同授予（推断，多来源）
        - FY2023-2025 / 美国
        - 每年 $1-3B；Replicator FY2024-2025 增加 $500M-1B 批次
        - 通过 USASpending.gov 和公开公告可观察的合同授予；不完整（涉密项目）
        - 低-中
        - 不完整；未捕捉涉密项目；采购波动带来逐年差异
      - - 美国公用事业 / 基础设施无人机巡检（推断）
        - 2024 / 美国
        - 无人机服务和平台每年 $500M-1B
        - 由强制巡检制度数量（NERC CIP、FAA、pipeline IMP）× 估计无人机占比推断
        - 低
        - 没有公开分析师报告按美国层面拆分公用事业无人机市场；估计仅作示意
      - - 受限 SOM —— Skydio 现有客户基数
        - 2026 / 美国为主，部分盟国
        - $300M-1.1B（基于 3,800+ 客户 × $100-300K 平均合同价值）
        - 自下而上：客户数 × 估计平均合同价值；合同价值为推断，并未披露
        - 极低
        - 平均合同价值、合同条款或每客户收入均无公开披露；SOM 估计带有推测性
