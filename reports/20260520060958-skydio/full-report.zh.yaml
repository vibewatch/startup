        title: 采用轨迹、规模指标与机队利用率
        blocks:
          - type: paragraph
            body: >-
              Skydio 的累计采用指标散见于官方产品页、博客文章和投资人公告。公司报告称，截至 2026 年 4 月，已交付超过 60,000 架无人机、执行超过 3.7 million 次任务，DFR Dock
              覆盖足迹让超过 16 million 名美国人处在 Skydio Dock 两英里范围内。总客户数跨过 3,800 家组织，这一里程碑与 Series F
              公告同时被引用。这些数据均为公司声称且未经审计；没有独立枚举或注册数据库确认这些数量。公共安全板块中，2023 年 2 月 Series E 公告提到 1,200 家机构；截至 2026 年 5
              月，这一数字仍醒目地出现在 DFR 和公共安全页面，说明该数量披露后没有大幅增长，或 Skydio 选择保留整数口径，而真实数字已高于该值。防务采购给出的采用故事更尖锐：陆军在 2025 年下达 $7.9M
              SRR Tranche 2 订单，随后在 2026 年 3 月采购超过 2,500 架 X10D、金额超过 $52M——公司称这是陆军史上最大单一供应商 sUAS 订单，从投标到授标不到 72
              小时。陆军复购的速度和规模，是目前最清晰的行为留存信号之一。民用侧，Minnesota 州 Bloomington 在 2026 年 5 月的测试体现了小型市政机构仍处于早期评估阶段，说明公共安全 DFR
