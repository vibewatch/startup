  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 有向无环图展示主要风险节点如何传导到收入、利润率、留存和估值结果。
    data:
      nodes:
        - id: battery_sanctions
          label: 中国电池制裁
          role: primary risk source
        - id: fedramp_delay
          label: FedRAMP 授权延迟
          role: primary risk source
        - id: ndaa_risk
          label: NDAA / Blue UAS 变化
          role: primary risk source
        - id: key_person
          label: 关键人物离职（CEO/CTO）
          role: primary risk source
        - id: supply_disruption
          label: 生产 / 供应中断
          role: intermediate risk
        - id: contract_delay
          label: 合同交付延迟
          role: intermediate risk
        - id: revenue_loss
          label: 收入损失
          role: business outcome
        - id: margin_compression
          label: 利润率压缩
          role: business outcome
        - id: valuation_impact
          label: 估值折价
          role: final outcome
        - id: customer_churn
          label: 客户 / DoD 流失
          role: business outcome
      edges:
        - from: battery_sanctions
          to: supply_disruption
          label: 单一来源中断
        - from: supply_disruption
          to: contract_delay
          label: 硬件积压
        - from: contract_delay
          to: revenue_loss
          label: 确认收入延迟
        - from: contract_delay
          to: customer_churn
          label: 履约失败
        - from: fedramp_delay
          to: revenue_loss
          label: 涉密扩张受阻
        - from: ndaa_risk
          to: revenue_loss
          label: 被排除出采购
        - from: ndaa_risk
          to: customer_churn
          label: 联邦客户流失
        - from: key_person
          to: contract_delay
          label: 项目连续性缺口
        - from: key_person
          to: revenue_loss
          label: 依赖关系驱动的 DoD 交易
        - from: revenue_loss
          to: margin_compression
          label: 固定成本基础
        - from: revenue_loss
          to: valuation_impact
          label: 增速压缩
        - from: customer_churn
          to: valuation_impact
          label: 留存信号衰减
    approximationNotes: 传导关系根据公开证据和标准风险建模框架推断。边权重仅表示方向；未进行概率量化。
    claimRefs:
      - CR001
      - CR025
      - CR026
      - CR031
      - CR040
      - CR041
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 映射 Skydio 在供应商、认证机构、客户、云基础设施和资本提供方上的关键外部依赖。
    data:
      nodes:
        - id: skydio
