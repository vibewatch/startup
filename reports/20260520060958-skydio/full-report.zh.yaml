            body: >-
              2024 年 10 月的中国制裁及随后的电池限供说明，一个受制裁零部件会立刻变成客户交付失败和声誉受损。虽然公司目标是在 2025 年春季切入新的本土电池来源，但 2026 年 4 月 Series F
              材料没有证实供应链已完全本土化。若本土电池采购带来实质成本上升，本就未披露的硬件毛利率会被进一步挤压。这类风险与纯软件公司截然不同，应把供应链尽调列为尽调阻断项。
