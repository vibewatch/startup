      - number: '3.6'
        title: 图表
        blocks:
          - type: callout
            title: 监管护城河主要是政治产物，不是技术壁垒
            body: >-
              Skydio 在美国联邦无人机采购中的主导位置，依赖限制中国制造无人机的 NDAA 条款。包括 DroneXL 和 Axios 在内的多个独立来源都把这些限制的主要驱动力归因于 Skydio 的游说，而不只是
              Skydio 产品更好。如果 NDAA 条款通过法律挑战、行政行动或贸易谈判被削弱，DJI 可能带着成本低得多、功能更丰富的平台重返联邦市场。投资人应把监管护城河视为支撑 Skydio
              当前估值的必要条件，而不是充分条件。
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
              - CP033
          - type: callout
            title: 电池供应链与本土制造叙事相矛盾
            body: >-
              Skydio 把自己营销成美国本土制造龙头，并用这一点对 DJI 和 Autel 做差异化。但 2024 年 10 月中国电池制裁暴露出，Skydio
              的电池供应依赖中国组件，并迫使公司临时配给客户电池。Skydio 自己承认了这一矛盾。Red Cat（Utah）和 Freefly（Colorado）等竞争对手没有面对同样的电池供应链批评。Skydio
              本土制造营销与实际供应链之间的落差，是一个重大的信誉风险。
            calloutType: risk
            claimRefs:
              - CP015
          - type: callout
            title: 自主深度是唯一耐久护城河——前提是守得住
            body: >-
              在所有竞争维度中，Skydio 的 AI 驱动自主避障、自主跟踪，以及机库 + 无人机任务执行能力，代表当前 Blue UAS 许可竞争对手中真正无人匹配的能力。没有任何直接 Blue UAS
              同行能在商用规模上提供等效的零现场机库 + 无人机作业系统。这是 Skydio 唯一不依赖监管政治的耐久护城河。风险在于 DJI 的研发规模：估计 10,000+ 名工程师意味着，一旦监管壁垒倒下，DJI
              可能迅速补上差距。
            calloutType: insight
            claimRefs:
              - CP024
              - CP025
              - CP040
  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入来源、定价模型与收入确认
        blocks:
          - type: paragraph
            body: >-
              Skydio 的收入来自四个主要来源：（1）X10、X10D、R10 和 F10 产品族的无人机硬件销售；（2）Dock for X10 等机库和自主基础设施系统，支撑无人值守 DFR 部署；（3）以 DFR
              Command（公共安全）和 Remote Ops/Flight
              Deck（企业）为主的软件订阅；（4）政府服务、培训和集成支持。公司明确把自己定位成硬件加软件平台，经常性软件收入叠加在硬件合同获胜之上；这一模式与其所称「强劲单位经济模型」一致。任何 X10、X10D、R10
              或 F10 无人机型号都没有公开标价；全部企业和政府销售都通过 GSA Schedule 合同、州采购工具或直接谈判的国防合同完成。DFR Command 被描述为无人机首响应
              项目的云端指挥平台，但订阅价格没有公开。大型政府合同（例如美国陆军 $52M X10D 订单）的收入确认遵循 FAR
              里程碑交付计划，而不是按期确认，因此季度报告可能波动。软件订阅如果按期确认，可以平滑政府硬件周期，但硬件、软件和服务收入的拆分并未公开。
