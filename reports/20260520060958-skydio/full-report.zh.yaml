      - number: '4.6'
        title: 财务结论——收入质量、利润率路径与尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              Skydio 的财务画像有一条可信的收入增长故事：大型、可见的美国政府合同和快速扩张的公共安全机构覆盖共同支撑增长。但缺少经审计财务、毛利率、ARR、NRR
              和烧钱数据，外部仅靠公开来源无法独立承销估值。$4.4B 估值意味着过去十二个月收入的 10–20×（按 DroneXL 分析）——对一家拥有监管护城河的国防科技 AI
              硬件公司来说，这个倍数可以辩护，但没有损益表就无法确认。政府合同侧的收入质量较高（多年期、受竞争护城河保护、任务关键），但采购时点和按里程碑确认会让收入波动。硬件与软件收入结构
              未知；如果软件在「数亿美元」中占比很小，隐含 SaaS 倍数会更高，也更难辩护。$3.5B SkyForge 承诺释放了信心信号，但也是资本强度风险：Skydio 必须产生足够经营现金流，或获得远超 Series
              F 的外部资本，才可能执行。2024 年裁员和电池配给是反向数据点，显示运营脆弱性；它们不构成生死问题，但说明利润率画像尚未稳定。关键尽调阻塞项包括：（1）分板块经审计毛利率，（2）软件订阅 ARR 和
              NRR，（3）烧钱速度和现金跑道，（4）Hercules Capital 债务条款，（5）SkyForge 资本开支 时间表和资金机制。没有这些，按 $4.4B
              交易的投资人靠的是管理层叙事和代理指标，而不是已验证的财务表现。
            claimRefs:
              - CI034
              - CI035
              - CI036
              - CI037
              - CI038
              - CI039
