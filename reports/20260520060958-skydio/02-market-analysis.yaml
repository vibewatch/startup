  evidenceGaps:
    - type: private-evidence-only
      severity: major
      topic: "Skydio per-segment revenue breakdown not publicly disclosed"
      missingEvidence: >-
        Skydio does not disclose revenue by segment (public safety, defense, utility, security).
        Without segment revenue, it is impossible to verify whether the claimed customer counts translate
        to proportionate revenue, or whether one segment dominates the P&L.
      whyItMatters: >-
        Segment revenue distribution determines whether Skydio's 2024 defense pivot is revenue-additive
        or redistributive, and whether public safety and utility segments generate sufficient recurring
        software revenue to justify the platform investment.
      diligencePath: >-
        Request audited segment revenue breakdown for FY2022-FY2025 under NDA; separately verify
        average contract value and software attach rate per segment.
      relatedQuestionRefs: [QM029, QM021]
    - type: no-public-evidence
      severity: major
      topic: "No public analyst report provides a Skydio-specific SAM or SOM"
      missingEvidence: >-
        All analyst TAM/SAM estimates cover broad commercial drone verticals without disaggregating
        the specific sub-markets (government/public safety/defense/utility) where Skydio competes.
        No commissioned research provides Skydio-specific market sizing.
      whyItMatters: >-
        Without a Skydio-specific SAM, all market sizing in this chapter is constructed from
        bottom-up approximations with high uncertainty bands. The SAM estimate could be 2-3x
        too large or too small depending on methodology.
      diligencePath: >-
        Commission a sector-specific market sizing study covering US government/institutional
        drone procurement; request Skydio's internal market sizing model under NDA.
      relatedQuestionRefs: [QM003, QM007, QM022]
    - type: no-public-evidence
      severity: major
      topic: "Battery supply chain remediation status after October 2024 China sanctions unclear"
      missingEvidence: >-
        Skydio has not publicly disclosed the extent of customer delivery backlog, the timeline for
        battery supply chain recovery, whether alternative battery sources have been qualified,
        or the revenue impact of the 2024 rationing event.
      whyItMatters: >-
        The supply chain vulnerability is a material risk for defense and public safety customers
        requiring operational readiness. If unresolved in 2026, it could constrain revenue growth
        and damage the premium positioning that justifies Skydio's valuation.
      diligencePath: >-
        Request battery supplier diversification plan and status, customer contract penalty
        clauses related to delivery failures, and 2024 backlog resolution metrics under NDA.
      relatedQuestionRefs: [QM018, QM027]
    - type: conflicting-data
      severity: minor
      topic: "Analyst commercial drone TAM estimates vary 4x without disclosed methodology"
      missingEvidence: >-
        GVR ($31.5B), MarketsandMarkets ($55.8B), Precedence ($58.5B), and Fortune Business Insights
        (~$48.9B) disagree on 2030 global commercial drone TAM by a 1.9x factor. None disclose
        their methodology in sufficient detail to reconcile the difference or apply a consistency
        adjustment for Skydio SAM analysis.
      whyItMatters: >-
        The TAM range creates a 2x uncertainty band on all SAM estimates derived from it, making
        market sizing unreliable for investment decisions based on top-down TAM-to-SOM logic.
      diligencePath: >-
        Obtain full methodology documentation from at least one analyst report; separately construct
        a bottom-up SAM estimate from government procurement databases and agency budget data.
      relatedQuestionRefs: [QM001, QM009]
    - type: no-public-evidence
      severity: moderate
      topic: "FAA BVLOS rulemaking timeline and DFR waiver grant rates not publicly tracked"
      missingEvidence: >-
        The FAA has not published a definitive BVLOS rulemaking timeline. DFR waiver applications
        and approval rates are not systematically published. The pace of regulatory liberalization
        is material to the addressable DFR market.
      whyItMatters: >-
