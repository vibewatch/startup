      confidence: high
      freshness: current
      answersQuestionRefs: [QM013, QM024]
    - id: CM018
      statement: >-
        Defense and military procurement runs through AFWERX (Air Force rapid acquisition), Army RCCTO
        (Rapid Capabilities and Critical Technologies Office), DIU OTA pathways, and standard Navy/Marine
        Corps program offices. The Blue UAS cleared list is the primary filter for DoD drone procurement.
