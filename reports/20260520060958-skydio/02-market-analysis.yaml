      statement: >-
        Public safety agencies (police, fire, EMS, search-and-rescue) represent Skydio's largest customer
        segment by count — 1,200+ agencies as of late 2024. Budget ownership is typically the department chief
        supported by state/federal grant funding (FEMA Assistance to Firefighters, DHS Homeland Security Grant
