  claims:
    - id: CM001
      statement: >-
        Skydio's addressable market encompasses five distinct sub-markets: drone-as-first-responder (DFR) and public
        safety, critical infrastructure inspection, defense and national security sUAS, site security and remote
        monitoring, and broader US government commercial drone platforms where NDAA compliance mandates domestic sourcing.
      type: inferred
      topic: market-boundary
      sourceRefs: [SM012, SM013, SM014]
      confidence: high
      freshness: current
      answersQuestionRefs: [QM001, QM024]
    - id: CM002
      statement: >-
        Included spend in Skydio's addressable market covers: drone hardware platforms, autonomous dock systems,
        flight management and DFR software subscriptions, inspection and data analytics software, services, training,
        and support contracts for US government, public safety, defense, and utility customers.
      type: inferred
      topic: included-spend
      sourceRefs: [SM012, SM013]
      confidence: high
      freshness: current
      answersQuestionRefs: [QM024]
    - id: CM003
      statement: >-
        Excluded from Skydio's addressable market: consumer and recreational drones (exited 2024), platforms
        manufactured by NDAA-restricted Chinese entities (DJI, Autel Robotics, Parrot, and CISA-listed companies),
        commercial package delivery drone platforms (Amazon Prime Air, Wing), agricultural crop-spraying drones,
        and long-range fixed-wing cargo logistics platforms.
      type: inferred
      topic: excluded-spend
      sourceRefs: [SM003, SM019, SM023]
      confidence: high
      freshness: current
      answersQuestionRefs: [QM012, QM024]
    - id: CM004
      statement: >-
        Status-quo substitutes for Skydio vary by segment: helicopters and manned aircraft (public safety aerial
        surveillance, approximately $500-1,500/flight hour versus $20-80/hour for drones); manned inspection crews
        (utility line and infrastructure inspection, $150-500K per annual inspection cycle); Chinese drone platforms
        (DJI, Autel — dominant before NDAA restrictions); fixed surveillance cameras with security staffing; and
        specialist drone service contractors who bring their own platforms.
      type: inferred
      topic: substitutes
      sourceRefs: [SM011, SM014, SM015]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM024]
    - id: CM005
      statement: >-
        The FAA's Drone-as-First-Responder (DFR) program provides the primary regulatory framework for automated
        drone deployment in public safety. As of 2023-2024, the FAA has issued limited BVLOS waivers for DFR
        operations; the Skydio X10 and Dock combination is the leading commercial platform for agencies
        pursuing BVLOS DFR operations.
      type: inferred
      topic: dfr-regulatory-framework
      sourceRefs: [SM001, SM017]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM014]
    - id: CM006
      statement: >-
        Section 848 of the FY2020 NDAA and subsequent annual NDAA provisions (FY2021-FY2025) have progressively
        restricted US federal agencies from procuring drones manufactured by CISA-designated Chinese entities.
        The FY2024 NDAA (H.R. 2670) extended and strengthened these provisions. This is the primary structural
        regulatory driver creating mandatory domestic drone procurement for US federal agencies.
      type: observed
      topic: ndaa-restriction
      sourceRefs: [SM003, SM019, SM023, SM025]
      confidence: high
      freshness: current
      answersQuestionRefs: [QM009, QM017]
    - id: CM007
      statement: >-
        The global commercial drone market is estimated at approximately $6-14B in 2023-2024 depending on
        methodology; growth forecasts range from $31.5B (Grand View Research, CAGR ~25%) to $55.8B (MarketsandMarkets)
        by 2030. The wide range reflects differing scope definitions — some include military drones, some exclude
        agricultural drones — making direct comparisons unreliable without methodology reconciliation.
      type: third-party-reported
      topic: global-commercial-drone-tam
      sourceRefs: [SM004, SM005, SM006, SM007, SM008]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM001, QM012]
    - id: CM008
      statement: >-
        The US commercial drone market represents approximately 30-35% of global commercial drone volume based on
        industry association estimates (AUVSI), implying a US commercial drone TAM of approximately $2-5B in 2024.
        This estimate includes all commercial verticals including consumer, agricultural, and delivery, most of
        which are not in Skydio's addressable market.
      type: inferred
      topic: us-commercial-drone-tam
      sourceRefs: [SM011, SM004]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM001]
    - id: CM009
      statement: >-
        Commercial drone TAM estimates from GVR ($31.5B), MarketsandMarkets ($55.8B), Precedence Research ($58.5B),
        and Fortune Business Insights (~$48.9B) conflict materially — ranging across a 1.9x band for 2030 global
        projections. None of these estimates are disaggregated into Skydio-relevant sub-segments (government,
        public safety, defense, utility), making them poor anchors for Skydio SAM/SOM analysis.
      type: third-party-reported
      topic: conflicting-tam-estimates
      sourceRefs: [SM004, SM005, SM007, SM008]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM001, QM022]
    - id: CM010
      statement: >-
        Skydio's estimated SAM — combining US public safety drone market ($300-450M in 2024 per Business Research
        Insights US-share calculation), DoD sUAS visible contract awards ($1-3B annually), and US utility/energy
        drone inspection ($500M-1B) — yields a combined US government/institutional SAM of approximately $2-5B
        annually in 2024-2026. All components carry high uncertainty due to limited public data.
      type: estimated
      topic: skydio-sam
      sourceRefs: [SM009, SM010, SM011]
      confidence: low
      freshness: current
      answersQuestionRefs: [QM003, QM022]
    - id: CM011
      statement: >-
        The global public safety drone market is estimated at approximately $900M in 2023, growing to approximately
        $2.7B by 2030 at a CAGR of ~17.5% (Business Research Insights). The US share is approximately 35-40%,
        implying a US public safety drone market of $315-360M in 2023, growing to $950M-1.1B by 2030.
      type: third-party-reported
      topic: public-safety-drone-market
      sourceRefs: [SM009]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM002, QM005]
    - id: CM012
      statement: >-
        DoD sUAS procurement — across AFWERX, DIU, Army RCCTO, Navy/Marine Corps, and SOCOM program offices —
        is estimated at $1-3B annually based on visible contract awards and public procurement data. The Replicator
        initiative (announced August 2023) committed an estimated $500M-$1B for attritable autonomous drone
        procurement in FY2024-2025, representing a discrete expansion beyond run-rate spending.
      type: estimated
      topic: dod-suas-market
      sourceRefs: [SM028, SM029, SM030]
      confidence: low
      freshness: current
      answersQuestionRefs: [QM004]
    - id: CM013
      statement: >-
        Skydio's near-term SOM, derived from its current customer base of 3,800+ customers at an estimated
        average contract value of $100-300K per customer (hardware + multi-year software subscription), implies
        a total current book value of approximately $380M-1.1B. This is a highly speculative estimate: Skydio
        does not disclose average contract value, contract term, or per-segment revenue. The true SOM could
        differ by 2-5x in either direction.
      type: estimated
      topic: skydio-som
      sourceRefs: [SM012, SM013, SM016]
      confidence: low
      freshness: current
      answersQuestionRefs: [QM003, QM029]
    - id: CM014
      statement: >-
        The generic commercial drone TAM overstates Skydio's opportunity by approximately 5-10x. The TAM
        includes consumer drones, agricultural spraying, and commercial package delivery — together representing
        approximately 60-70% of TAM by volume — none of which are Skydio's market segments. A TAM-to-SAM
        conversion factor of 5-15% is appropriate when anchoring Skydio analysis to commercial drone market data.
      type: inferred
      topic: tam-to-sam-adjustment
      sourceRefs: [SM004, SM005, SM011]
      confidence: medium
      freshness: current
      answersQuestionRefs: [QM012, QM022]
    - id: CM015
      statement: >-
        The DIU Blue UAS cleared list included approximately 12-18 platforms as of early 2024. Skydio's X10 and
        legacy R1/R2 platforms are among the approved domestic platforms. The Blue UAS framework represents a
        specific procurement channel that excludes Chinese manufacturers by design and compresses DoD procurement
        cycles from 12-24 months to approximately 3-6 months for cleared platforms.
      type: observed
      topic: blue-uas-market
      sourceRefs: [SM002, SM014, SM015, SM020]
      confidence: high
      freshness: current
      answersQuestionRefs: [QM008, QM010, QM025]
    - id: CM016
      statement: >-
        The US utility and energy infrastructure drone inspection market is estimated at $500M-1B annually
        in drone services and platform spending, driven by mandatory compliance inspection requirements:
        NERC CIP for bulk power systems, FAA-mandated inspection for wind turbines, and pipeline integrity
        management program (IMP) requirements under PHMSA regulations. Skydio claims 450+ utility/energy
