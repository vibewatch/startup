    severity: minor
    topic: board composition not publicly disclosed
    missingEvidence: >-
      Skydio does not publish its board of directors, board observer rights, or investor governance rights. Board member
      identities, investor board seats, and voting controls are not available from public sources.
    whyItMatters: >-
      Without board composition, investor control rights and governance risk cannot be assessed; concentrated control by
      a single investor or founder could affect M&A or IPO optionality.
    diligencePath: >-
      Request board composition, voting rights, and investor observer rights under NDA. Search SEC EDGAR for any
      required board disclosures in proxy statements or Form D amendments.
