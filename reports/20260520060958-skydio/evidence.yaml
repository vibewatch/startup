  - type: missing-source
    severity: minor
    topic: competitive comparison with Shield AI, Joby Defense, and Dedrone
    missingEvidence: >-
      No independent comparative analysis of Skydio versus peer US autonomous drone companies (Shield AI, Joby Defense,
      Dedrone) was available in the sources accessed for this chapter.
    whyItMatters: >-
      Without competitive benchmarking data, it is difficult to assess Skydio's market-share position, pricing power, or
      the defensibility of its autonomy moat relative to well-funded domestic peers.
    diligencePath: >-
      Commission independent competitive analysis or request Skydio's own competitive positioning deck. Review Shield
      AI, Joby Defense, and Dedrone public filings and press for direct product comparisons.
    relatedQuestionRefs:
      - QO020
