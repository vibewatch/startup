companyProfile:
  summary: "Skydio is the leading U.S.-based autonomous drone company. Founded in 2014 by Adam Bry and Abe Bachrach after their MIT autonomous-flight research and Google Project Wing experience, the company now focuses on public safety, defense, critical infrastructure, and site security. Its current platform spans X10 and X10D drones, Dock for X10, the R10 platform, and software including DFR Command and Remote Flight Deck. Public evidence shows deep traction across U.S. military, public safety, and utility customers, but key financial details remain private."
