chapter:
  number: 6
  title: Customers
  summary: >-
    Skydio's customer base of over 3,800 organizations spans public safety/DFR (>1,200 agencies), defense (every U.S.
    military branch, 29 allied nations), utilities/energy (>450 companies), and site security. Production deployments
    are confirmed by government-sourced case studies, military contract announcements, and the DVIDSHUB record, while
    adoption trajectory is anchored by a $52M+ Army order in March 2026 and a $9M+ Air Force base-security deployment
    announced in April 2026. Retention proxies—follow-on contracts, expanded Dock deployments, and multi-year
    software subscriptions—are positive but NRR/GRR/churn are not publicly disclosed. Concentration risk is real:
    public-sector budget timing, Axon channel dependence, a regulatory-moat reliance, and the battery disruption
    already experienced in October 2024 all represent structural customer risks.

sections:
  - id: customer-segmentation
    title: Customer Base Segmentation and Vertical Map
    body: >-
      Skydio organizes its customer base into five primary verticals: public safety/DFR, defense/national security,
      utilities/energy, site security, and other enterprise (construction, transportation/bridge inspection, education,
      oil and gas). Public safety is the largest and most visible segment, with Skydio claiming more than 1,200 agencies
      operating DFR programs as of late 2024. These range from single-drone patrol deployments in smaller agencies to
      multi-Dock hive networks in large metropolitan departments and campus security programs. Within public safety,
      the Axon Air channel (Axon's branded DFR offering built on Skydio X10 and R10) adds a second go-to-market
      route alongside direct and reseller sales. Defense spans every branch of the U.S. military—Army, Air Force,
      Navy, Marines, Coast Guard, and National Guard—plus 29 allied nations. The Army is the single largest known
      military customer by order value; the Air Force is the most diversified by mission set (EOD, TACP, base
      security, ISR). The utilities segment addresses power-generation, transmission, and distribution operators
      running substation monitoring, distribution-network inspection, and power-generation surveys; Skydio claims
      more than 450 utility and energy companies in this cohort. Site security—deployed at corporate campuses,
      data centers, corrections facilities, and critical infrastructure—is the newest and smallest named segment,
      positioned as an autonomous alternative to guard patrols. Channel diversity varies by segment: defense flows
      primarily through authorized resellers (ADS—Atlantic Diving Supply—and the DLA's Tailored Logistics Support
      Special Operational Equipment vehicle), public safety through direct sales and the Axon Air partnership, and
      utilities/enterprise through both direct sales and a catalog of procurement vehicles listed on Skydio's
      contracts page.
    claimRefs:
      - CU001
      - CU002
      - CU003
