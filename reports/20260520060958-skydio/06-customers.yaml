  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-gap
      missingEvidence: "NRR, GRR, churn rate, cohort-level renewal data, and software subscription ARR attach rate by customer segment."
      whyItMatters: >-
        Without retention metrics, it is impossible to assess whether Skydio's 3,800+ customer count reflects
        cumulative acquisition or a healthy active base, and whether the public-safety and enterprise segments
        are growing or plateauing net of churn. Software subscription attach rate and ARR per customer are also
        undisclosed, limiting assessment of the recurring revenue layer.
      diligencePath: >-
        Request NRR/GRR and trailing-12-month churn data in due diligence; cross-check against DFR Command
        subscription counts and Dock deployment records. Request software ARR and contract length distribution.
      relatedQuestionRefs:
        - QU017
        - QU027

    - type: enumeration-incomplete
      severity: material
      topic: utilities-evidence-gap
      missingEvidence: "Named, independently verifiable utility and site-security customer case studies."
      whyItMatters: >-
        The 450+ utility claim and the entire site-security segment lack publicly named production customers
        with verifiable outcomes; without named proof the revenue quality of these segments cannot be assessed.
      diligencePath: >-
        Request reference customer list for utilities and site-security segments; seek independent case studies
        or public announcements from named utility operators.
      relatedQuestionRefs:
        - QU003
      relatedTableRefs:
        - TU003

    - type: private-evidence-only
      severity: material
      topic: revenue-transparency
      missingEvidence: "Segment-level revenue breakdown and top-customer revenue concentration metric."
      whyItMatters: >-
        Without segment revenue data, the contribution of the $52M+ Army order and USAFCENT order to total
        revenue is unknown, and the concentration of revenue in 2–3 top defense customers cannot be assessed.
      diligencePath: >-
        Request revenue by segment (public safety, defense, utilities, site security) and top-10-customer
        revenue concentration in due diligence.
      relatedQuestionRefs:
        - QU024

    - type: missing-source
      severity: minor
      topic: public-safety-independent-verification
      missingEvidence: >-
        Independent (non-Skydio) agency press releases, city council records, or government inspector general
        reports confirming named DFR deployments and outcomes for agencies beyond the 133rd ANG. Independent
        verification of the USAFCENT Dock deployment beyond the Skydio corporate blog is also absent.
      whyItMatters: >-
        Brookhaven PD and the wider 1,200-agency count are self-reported by Skydio; an independent public
        record would materially raise evidence confidence for the public-safety segment. The USAFCENT order
        is confirmed only via Skydio's own blog post; no DoD press release or independent news coverage
        has been located as of May 2026.
      diligencePath: >-
        Search municipal meeting records, city budgets, and procurement databases for DFR program approvals
        and expenditures; cross-check agency names on the DFR page against FOIA-accessible records. Monitor
        Air Force news releases for USAFCENT drone program confirmations.
      relatedQuestionRefs:
        - QU011
        - QU015

    - type: private-evidence-only
      severity: minor
      topic: allied-nations-detail
      missingEvidence: "Identity and deployment scope of 29 allied-nation customers."
      whyItMatters: >-
        Allied-nation customers represent export revenue and geopolitical validation, but the count is
        unverified and the volume is unknown.
      diligencePath: >-
        Request country-by-country customer list for allied-nation deployments; check export license filings.
      relatedQuestionRefs:
        - QU012

    - type: missing-source
      severity: minor
      topic: competitive-customer-benchmarking
      missingEvidence: >-
        Comparative data on customer counts, DFR deployment volumes, or contract values for competing
        DFR platforms (e.g., Percepto, Iris Automation) and Axon's potential future hardware strategy.
      whyItMatters: >-
        Without competitive customer benchmarks, it is impossible to assess whether Skydio's 1,200-agency
        count represents dominant market share or a modest fraction of the addressable market, and whether
        Axon could replicate the DFR stack with alternate drone hardware.
      diligencePath: >-
        Research Percepto, Iris, and emerging DFR platform deployments; request Axon's drone hardware
        roadmap in partnership due diligence.
      relatedQuestionRefs:
        - QU023

