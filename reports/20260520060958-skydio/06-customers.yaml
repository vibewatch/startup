  - id: named-customer-proof
    title: Named Customer Evidence and Deployment Quality
    body: >-
      The strongest independent customer evidence comes from government-sourced records and named agency announcements.
      The U.S. Army's 25th Infantry Division integrated the Skydio X10D into a real-time operational network,
      streaming live video between ground teams and command units, and described the deployment as a production
      integration setting a new benchmark for tactical drone integration at scale. The 133rd Security Forces Squadron,
      an Air National Guard unit in Minnesota, became the first National Guard unit to certify Airmen on the Skydio
      X2D in November 2023, with Tech Sgt. Brandon Trout of the program quoted directly in the DVIDSHUB record—an
      independent government media outlet—describing the drone as transforming "every single thing that we do."
      USAFCENT's April 2026 order of more than $9M for Dock and X10 systems to secure U.S. airbases in the Middle
      East is described as "one of the largest autonomous drone infrastructure deployments for international base
      security by the U.S. Air Force," and the blog post from Skydio's VP of Federal Sales quotes direct
      confirmation that this is the first time Dock-based autonomous security is being brought to the Air Force
      for an overseas force-protection mission. In public safety, Brookhaven PD is the only named agency with a
      quantitative outcome visible on official Skydio pages: deploying eight Docks and achieving 30-second drone
      response times. No named utility or site-security customer case study with independently verifiable outcomes
      was located; this is a material gap given the claimed 450+ utility segment. The Axon product page confirms
      deployment of both X10 (outdoor dock-based DFR) and R10 (indoor patrol DFR) via Axon Air, constituting
      independent partner-tier corroboration of production use.
    claimRefs:
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
      - CU017
      - CU018
      - CU020
