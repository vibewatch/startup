      - CU026
      - CU027
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035

figures:
  - id: FU001
    title: Skydio Customer Journey Map by Segment
    type: journey-map
    layout: wide
    summary: >-
      Illustrates the five-stage customer journey from discovery through expanded deployment, mapped across
      the four primary segments (public safety, defense, utilities, site security).
    data:
      items:
        - label: "Stage 1 — Discovery & Evaluation"
          detail: "Agency pilots Skydio X10 DFR; defense bid submitted via ADS/DLA; utility operator assesses truck-roll replacement economics"
        - label: "Stage 2 — Procurement & Contract"
          detail: "Axon Air bundled sale (X10 + DFR Command + Axon Evidence) or direct ADS reseller order via DLA TLS SOE vehicle"
        - label: "Stage 3 — Initial Deployment"
          detail: "1-2 Docks deployed; Skydio Academy training; CAD/NG911 or ATAK integration live; first missions flown"
        - label: "Stage 4 — Production Operations"
          detail: "Agency runs 24/7 DFR missions; USAF/Army Dock conducts autonomous perimeter patrols; DFR Command subscription active"
        - label: "Stage 5 — Expansion & Re-buy"
          detail: "Brookhaven-model 8-Dock expansion; USAF EOD follow-on doubles scope; Army returns for $52M+ re-buy; SaaS upsell"
