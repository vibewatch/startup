  - id: adoption-trajectory
    title: Adoption Trajectory, Scale Metrics, and Fleet Utilization
    body: >-
      Skydio's cumulative adoption metrics are disclosed in a mix of official product pages, blog posts, and investor
      announcements. The company reports more than 60,000 drones shipped, more than 3.7 million missions flown, and
      a DFR-dock footprint that places over 16 million Americans within two miles of a Skydio Dock—all as of April
      2026. The total customer figure crossed 3,800 organizations, a milestone cited alongside the Series F announcement.
      These are company-claimed and unaudited; no independent enumeration or registration database confirms the counts.
      Within the public safety segment, the Series E announcement in February 2023 cited 1,200 agencies, a figure
      still prominently displayed on the DFR and public-safety pages as of May 2026, suggesting the count has not
      grown substantially since that disclosure or Skydio has chosen to hold the round number while the true figure
      grows beyond it. Defense procurement tells a sharper adoption story: the Army placed a $7.9M SRR Tranche 2
      order in 2025 followed by a $52M+ order for over 2,500 X10D drones in March 2026—described as the largest
      single-vendor sUAS order in Army history and concluded in under 72 hours from bid to award. The speed and
      scale of repeat Army procurement is one of the clearest behavioral retention signals available. Across the
      civilian side, the Bloomington, Minnesota test in May 2026 illustrates early-stage evaluation by smaller
      municipalities, suggesting the top-of-funnel for public safety DFR remains active.
    claimRefs:
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
