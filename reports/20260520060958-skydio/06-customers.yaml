callouts:
  - calloutType: strength
    title: Defense Procurement Velocity Is a Retention Signal
    body: >-
      The $52M Army order (March 2026) concluded in under 72 hours from bid to award, extending
      a three-tranche procurement relationship dating to 2022. The USAF EOD follow-on doubled
      the initial scope within months. These rapid re-buys—without competitive rebidding—represent
      the clearest public signal of customer stickiness available for Skydio.
    claimRefs:
      - CU011
      - CU021
      - CU022
  - calloutType: risk
    title: Battery Rationing Exposed a Structural Customer Risk
    body: >-
      China's October 2024 sanctions forced Skydio to ration batteries across all segments simultaneously,
      visibly disrupting customer operations and providing competitors a window to approach constrained
      agencies. No public churn data followed, but the episode demonstrated that a single regulatory
      action can impair Skydio's ability to serve its entire installed base, regardless of segment or
      contract status.
    claimRefs:
      - CU030
      - CU033
  - calloutType: risk
    title: Named Customer Evidence Is Thin Outside Defense
    body: >-
      Of 3,800 claimed customers and 450+ utility companies, only a handful of named, independently
      corroborated production deployments are publicly available. The utilities segment—an estimated
      major revenue contributor—has no independently named case study as of May 2026. This evidence
      gap limits due-diligence confidence in non-defense segment durability.
    claimRefs:
      - CU036
      - CU003

