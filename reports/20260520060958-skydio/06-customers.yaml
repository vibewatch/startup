      - TU004
    figureRefs: []

  - id: concentration-risk-and-structural-vulnerabilities
    title: Concentration, Channel Dependence, and Structural Risks
    body: >-
      Skydio's customer base is structurally concentrated in ways that create revenue and reputational risk.
      First, both public safety and defense are governed by annual budget cycles and procurement rules that produce
      lumpy revenue; a single agency decision to delay a Dock deployment or rebid a contract can materially affect
      a quarter's shipments. Second, the Axon Air partnership is simultaneously an asset and a single-point dependency:
      Axon is Skydio's largest public safety channel partner, with co-marketing and integrated evidence workflows.
      If Axon chose to qualify a competing drone manufacturer—or develop its own hardware—Skydio's access to
      Axon's installed base of thousands of agencies would be impaired. Third, the defense procurement moat is
      partially regulatory: Skydio's Blue UAS listing and NDAA Section 889 compliance channel government dollars
      away from DJI and toward U.S.-origin platforms. Critics in the trade press have argued this regulatory
      advantage stems partly from lobbying rather than purely from product capability, raising the question of
      whether the moat is durable as the regulatory environment shifts. Fourth, no segment revenue breakdown is
      disclosed, making it impossible to assess top-customer concentration within defense (where a handful of
      major orders drive the reported numbers) or the share of total revenue attributable to recurring software.
      Fifth, the October 2024 battery rationing demonstrated that a single supply-chain event can degrade service
      quality for existing customers simultaneously across all segments. The combination of regulatory moat
      dependence, channel concentration in Axon, and lumpy defense procurement creates meaningful concentration
      risk that is not offset by any public disclosure of diversified revenue mix or NRR/GRR metrics.
    claimRefs:
      - CU031
      - CU032
      - CU033
      - CU034
      - CU035
      - CU036
      - CU037
      - CU038
