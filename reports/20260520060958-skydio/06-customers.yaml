  - id: TU005
    title: Expansion Drivers and Concentration Risks
    columns:
      - Driver / Risk Factor
      - Type
      - Current Impact
      - Severity
      - Diligence Path
    rows:
      - - Axon Air channel dependence
        - Concentration risk
        - Single largest public-safety co-sell partner; DFR Command deeply integrated with Axon Evidence
        - High — loss of Axon partnership would impair public-safety sales access
        - Assess contract exclusivity, renewal terms, and Axon's own drone hardware roadmap
      - - ADS / DLA reseller concentration
        - Concentration risk
        - Army and Air Force defense orders flow through Atlantic Diving Supply (ADS) and DLA vehicle
        - Medium — reseller concentration in defense; mitigated by multi-reseller policy on contracts page
        - Identify share of defense revenue through ADS vs. direct
      - - Public-sector budget timing
        - Concentration risk
        - Annual municipal and federal budget cycles create lumpy procurement; fiscal-year-end ordering spikes
        - Medium — inherent to government market; partially offset by multi-year contract vehicles
        - Request backlog and deferred-order visibility
      - - Regulatory moat durability
        - Concentration risk
        - NDAA Section 889 / Blue UAS compliance channels government dollars; lobbying criticism documented
        - Medium — moat exists today; vulnerable to regulatory drift, DJI FCC appeal, or NDAA amendment
        - Monitor FCC Covered List proceedings and NDAA 2027 language
      - - Top-account concentration (defense)
        - Concentration risk
        - Army + Air Force represent majority of known high-value orders; Navy/Marines/Coast Guard smaller
        - High — no segment revenue breakdown; defense revenue may be highly concentrated in 2–3 branches
        - Request revenue Herfindahl by segment and branch
      - - Land-and-expand Dock model
        - Expansion driver
        - Agencies that deploy initial Dock systems return for additional Docks (Brookhaven 8-Dock expansion)
        - Positive — initial installation creates switching-cost moat via CAD/NG911 integrations
        - Quantify average Dock count per agency over time
      - - Software subscription upsell
        - Expansion driver
        - DFR Command and Remote Ops add recurring revenue on top of hardware; integration depth increases switching cost
        - Positive — creates durable ARR layer if renewal rates are strong
        - Request software attach rate and ARR per hardware customer
      - - China battery supply-chain risk
        - Concentration risk
        - Oct 2024 sanctions forced battery rationing across all customer segments simultaneously
        - High — resolved temporarily; structural supply-chain moat has not been publicly closed
        - Confirm alternate battery supplier qualification and inventory build
    notes: >-
      Risk severity is analyst judgment based on public evidence. Expansion drivers represent positive momentum
      in customer economics; concentration risks represent structural vulnerabilities not yet offset by disclosed
      metrics.
    claimRefs:
