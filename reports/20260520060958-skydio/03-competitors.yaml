company:
  name: Skydio

chapter:
  number: 3
  title: Competitors
  summary: >-
    Skydio occupies an unusual competitive position: its primary moat is regulatory (NDAA/Blue UAS
    exclusion of Chinese drone makers) rather than purely technological, creating a protected domestic
    market among federal and public safety buyers while exposing it to meaningful peer risk within the
    Blue UAS-cleared set. DJI remains the dominant global incumbent — superior on price, ecosystem size,
    and international reach — but is federally banned for US government use, ceding Skydio's core
    procurement channel. Among US-based peers on the DIU Blue UAS cleared list, Red Cat/Teal targets
    defense ISR, Parrot ANAFI USA targets general enterprise, and Freefly/Alta Astro targets inspection
    and media — none match Skydio's autonomy depth or dock-and-drone system scale. Adverse evidence is
    significant: critics argue Skydio's regulatory moat is primarily lobbying-driven, multi-homing across
    Blue UAS vendors is common, and the October 2024 China battery sanctions exposed critical supply chain
    dependence that undermines the domestic-manufacturing narrative.

sections:
  - id: landscape-overview
    title: Competitive Landscape Overview
    body: >-
      Skydio competes across five competitor categories that must be analyzed separately because they
      represent different buyer trade-offs and displacement risks. First, the dominant global incumbent:
      DJI commands approximately 70% of the global commercial drone market by unit volume and dominates
      the pre-NDAA installed base in US public safety and enterprise. Its technology is broadly
      competitive with or superior to Skydio on optics, flight time, and payload — but it is prohibited
      from US federal government procurement by NDAA Section 848 and subsequent provisions, creating
      Skydio's primary protected channel. Second, China-linked alternatives: Autel Robotics is
      Chinese-founded and marketed as a DJI alternative, but also faces NDAA restrictions and is not on
      the DIU Blue UAS cleared list as of May 2026. Third, direct US Blue UAS-cleared peers: Red Cat
      Holdings (Teal 2, Golden Eagle), Parrot (ANAFI USA), and Freefly Systems (Alta Astro) compete in
      overlapping segments — respectively defense ISR, general enterprise and public safety, and
      inspection and media. None has Skydio's autonomy depth, fleet scale, or dock-and-drone offering.
      Fourth, adjacent defense ISR players: Shield AI's Nova 2 overlaps in GPS-denied indoor
      reconnaissance but is not a direct outdoor autonomous UAS competitor to the X10/X10D. Fifth,
      status-quo substitutes: manned helicopters (public safety aerial surveillance), manual inspection
      crews (utilities), fixed surveillance cameras with guard staffing (site security), and third-party
      drone service contractors each represent the do-nothing alternative Skydio must displace.
      Understanding all five categories is required to assess whether Skydio's differentiation is durable
      or regulatory in nature.
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP005
      - CP021
      - CP022
