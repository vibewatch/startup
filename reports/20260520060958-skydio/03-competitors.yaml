      whyItMatters: >-
        If large DoD platform programs consistently route through system integrators who select
        non-Skydio sUAS platforms, Skydio's government TAM is smaller than its Blue UAS moat
        suggests.
      diligencePath: >-
        Review USASpending.gov for prime contractor drone sub-awards; examine DoD acquisition
        program office solicitations for sUAS integration requirements.
      relatedQuestionRefs:
