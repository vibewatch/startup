  - id: TP004
    title: Moat Durability and Competitive Risk Register
    columns:
      - Moat Claim
      - Threat / Challenge
      - Severity
      - Mitigation / Diligence Ask
    rows:
      - - NDAA/Blue UAS regulatory exclusion of DJI and Autel
        - Legal challenge to NDAA constitutionality; administration policy reversal; lobbying by DJI
        - High
        - Monitor NDAA reauthorization; assess legal exposure; evaluate product differentiation independent of regulation
      - - AI autonomy differentiation (obstacle avoidance, mission execution)
        - DJI closing capability gap as NDAA ban creates R&D incentive; Blue UAS peers catching up
        - Medium
        - Track DJI BVLOS capability releases internationally; assess peer roadmaps
      - - Dock-and-drone zero-on-site operations
        - No current Blue UAS peer match; DJI Dock 2 available internationally
        - Low (near-term); Medium (3-5 yr)
        - Confirm IP protection around Dock system; evaluate DJI Dock patent portfolio
      - - Public safety installed base (1,200+ agencies claimed)
        - Multi-homing; agencies adding competitors alongside Skydio; budget pressure limiting renewal
        - Medium
        - Validate renewal rates and expansion revenue; audit actual exclusivity vs. multi-vendor deployments
      - - US domestic manufacturing narrative
        - China battery sanctions (Oct 2024) revealed dependency; not fully domestic despite marketing
        - High (credibility)
        - Require evidence of battery supply chain diversification; audit Hayward manufacturing content
      - - DFR Command / software ecosystem lock-in
        - Open-source drone software (ArduPilot, DroneKit) and platform-agnostic integrators erode lock-in
        - Low
        - Assess API openness; evaluate third-party integrations that could abstract away Skydio software
    notes: >-
      Severity ratings are qualitative assessments based on source evidence and competitive intelligence
      as of May 2026. "High" indicates near-term material risk to moat durability. Diligence asks are
