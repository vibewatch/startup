  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: Skydio X10 exact list pricing
      missingEvidence: >-
        Skydio does not publish a public price list for X10 or X10D; pricing is available only
        through direct sales and government contract vehicles.
      whyItMatters: >-
        Inability to confirm exact pricing limits direct price comparison with competitors and
        makes it difficult to assess whether Skydio's premium is justified by capability.
