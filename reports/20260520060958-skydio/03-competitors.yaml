callouts:
  - calloutType: risk
    title: Regulatory Moat Is Primarily Political, Not Technical
    body: >-
      Skydio's dominant position in US federal drone procurement depends on NDAA provisions that
      restrict Chinese-manufactured drones. Multiple independent sources — including DroneXL and Axios
      — characterized Skydio's lobbying efforts as the primary driver of these restrictions, not
      Skydio's product superiority alone. If NDAA provisions are weakened through legal challenge,
      executive action, or trade negotiation, DJI could re-enter the federal market with a
      significantly lower-cost, more feature-rich platform. Investors should treat the regulatory moat
      as a necessary condition for Skydio's current valuation, not a sufficient one.
    claimRefs:
      - CP013
      - CP014
      - CP033

  - calloutType: risk
    title: Battery Supply Chain Contradicts Domestic Manufacturing Narrative
    body: >-
      Skydio markets itself as the US domestic manufacturing leader and uses this as a differentiation
      against DJI and Autel. However, the October 2024 China battery sanctions revealed that Skydio's
      battery supply depended on Chinese components, forcing temporary customer rationing. This
      contradiction was acknowledged by Skydio itself. Competitors like Red Cat (Utah) and Freefly
      (Colorado) do not face the same battery supply chain criticism. The gap between Skydio's domestic
      manufacturing marketing and its actual supply chain is a material credibility risk.
    claimRefs:
      - CP015

  - calloutType: insight
    title: Autonomy Depth Is the Only Durable Moat — If It Holds
    body: >-
      Among all competitive dimensions, Skydio's AI-driven autonomous obstacle avoidance, autonomous
      tracking, and dock-and-drone mission execution represent a genuinely unmatched capability among
      current Blue UAS-cleared competitors. No direct Blue UAS peer offers an equivalent dock-and-drone
      zero-on-site operations system at commercial scale. This is Skydio's only durable moat that is
      independent of regulatory politics. The risk is DJI's R&D scale: with an estimated 10,000+
      engineers, DJI could close the gap rapidly if regulatory barriers fell.
    claimRefs:
      - CP024
      - CP025
      - CP040

