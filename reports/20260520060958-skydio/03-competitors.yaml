  - id: us-blue-uas-peers
    title: US Blue-UAS Certified Direct Competitors
    body: >-
      Within the DIU Blue UAS cleared list — Skydio's primary regulatory protection zone — three direct
      competitors stand out, each with a distinct strategic positioning. Red Cat Holdings acquired Teal
      Drones in 2022 and fields the Teal 2 and Golden Eagle platforms, both cleared on the Blue UAS
      list. Teal's focus is almost exclusively military ISR: short-range reconnaissance, perimeter
      defense, and tactical sUAS for DoD customers. Red Cat's market capitalization of approximately
      $70-130 million during 2024-2025 reflects a company at a fraction of Skydio's $4.4 billion
      valuation. Teal platforms compete with Skydio's X10D for Army tranche contracts but are not
      positioned for Skydio's commercial public safety or utility inspection segments. Parrot ANAFI USA
      is a French-manufactured platform sold by Parrot SA (French parent, revenues approximately €90
      million in 2023), cleared by the DIU, and actively sold to US public safety and enterprise
      customers. Parrot's pricing starts around $7,000 with no equivalent dock-and-drone autonomy
      system, making it a lower-cost alternative for agencies that do not require the autonomous
      capabilities Skydio emphasizes. Parrot lacks Skydio's AI-driven obstacle avoidance and
      autonomous mission execution, creating a real capability gap for DFR and remote operations use
      cases. Freefly Systems' Alta Astro platform starts at approximately $12,500 and is positioned
      primarily for professional inspection and media — a different buyer than the law enforcement and
      military procurement funnel Skydio primarily serves. Freefly is not publicly funded at scale;
      its DoD contract footprint is not publicly documented. None of the three has matched Skydio's
      claimed 1,200 public safety agency footprint. Skydio's dock-and-drone system — enabling zero
      on-site autonomous operations — has no equivalent among Blue UAS peers at commercial scale,
      representing a real and currently unmatched capability advantage in the remote operations segment.
