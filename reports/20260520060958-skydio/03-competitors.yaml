        Monitor DIU cleared list updates; track NDAA compliance filings; review Autel press releases.
      relatedQuestionRefs:
        - QP011

    - type: missing-source
      severity: material
      topic: Customer switching cases from Skydio to competitors
      missingEvidence: >-
        No verified public cases of enterprise or government customers explicitly switching away
        from Skydio to a competitor were found in the research.
      whyItMatters: >-
        The absence of documented churn could reflect genuine stickiness or simply limited public
        disclosure; the distinction is important for assessing switching cost durability.
      diligencePath: >-
        Conduct reference checks with Skydio customers; review procurement records for
        competitive bid replacements; interview law enforcement technology decision-makers.
      relatedQuestionRefs:
        - QP022

    - type: missing-source
      severity: minor
      topic: DoD internal build and system integrator drone alternatives
      missingEvidence: >-
        Limited public data on how frequently DoD programs choose prime contractor or system
        integrator drone solutions (e.g., via AeroVironment, L3Harris, Textron) over standalone
