  - id: technical-risks-and-dependencies
    title: Technical Risks, Dependencies, and Open Diligence Gaps
    body: >-
      Skydio's product and technology profile carries several material technical risks. The most
      immediate is the battery supply chain: China's October 2024 export controls on drone-related
      materials forced Skydio to ration batteries to existing customers, representing a direct operational
      disruption to its largest installed base. Skydio relies on high-performance lithium-ion cells
      sourced in part from supply chains exposed to Chinese export restrictions, and the SkyForge
      manufacturing commitment does not necessarily resolve the upstream battery-cell dependency. Second,
      the reliability dashboard discloses persistent thin-obstacle detection failures as the largest
      technical-factor incident driver; vision-based navigation is explicitly acknowledged as imperfect,
      and Skydio notes that software improvements addressing this were planned but not yet shipped
      as of the report date. Third, BVLOS remote operations depend on commercial cellular (5G/LTE)
      availability from third-party carriers; network outages or coverage gaps could render
      Dock-based DFR inoperative. Fourth, the NVIDIA Jetson Orin and Qualcomm Snapdragon SoCs
      represent dependencies on U.S.-designed but globally manufactured silicon; any restriction on
      supply or export of these chips would directly impact production. Fifth, regulatory dependencies
      include ongoing FAA BVLOS approval processes; changes in FAA policy or state-level drone ordinances
      could constrain market access. Sixth, the competitive moat partly depends on continuation of
      Chinese-drone procurement restrictions; reversal of NDAA drone provisions could allow DJI
      re-entry into U.S. government markets. Private information gaps include: actual gross margin on
      hardware versus software, manufacturing yield rates at Hayward, BVLOS waiver acceptance rate
      in the Skydio Regulatory Services pipeline, and whether the F10 fixed-wing platform is
      commercially available or still in development.
    claimRefs:
      - CE041
      - CE042
      - CE043
      - CE044
      - CE045

