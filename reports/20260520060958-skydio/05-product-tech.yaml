  - id: trust-security-compliance
    title: Trust, Security Architecture, and Compliance Certifications
    body: >-
      Skydio's Security Trust Center documents a comprehensive end-to-end security architecture across
      hardware, connectivity, cloud, and compliance layers. Hardware security is anchored by AES-256
      SkydioLink wireless encryption, a TPM in the Dock for hardware key storage meeting CJIS 6.0
      requirements, FIPS 140-3 validated encryption for data in transit and at rest, and SHA-256 hashing
      at the point of capture providing courtroom-defensible chain of custody for evidentiary workflows.
      Cloud infrastructure runs on AWS US-West with SOC2 Type II certification (renewed 2023), ISO
      27001:2022 certification (completed 2023), TLS 1.2/1.3 in transit, AES-256 at rest, SSO via SAML
      and OIDC (supporting Axon Connect, Okta, and Microsoft Entra). CJIS Security Policy v6.0
      compliance is independently reviewed by a FedRAMP-accredited third-party assessment organization
      (3PAO). The company holds AS9100D aerospace and defense manufacturing quality certification.
      NDAA Section 889 compliance is declared — Skydio states it does not use telecommunications or
      video surveillance equipment from entities prohibited under Section 889. TX-RAMP Level 2
      certification is held for Texas government procurement. Regular penetration testing is conducted
      by independent firms; results are shared with senior management and vulnerabilities tracked.
      Software and firmware updates are digitally signed and verified before installation. Privacy
      controls include customer data isolation, enterprise SSO, and U.S.-only data residency. The
      reliability dashboard publicly discloses incident counts and root-cause categories, including
      thin-obstacle detection failures (the largest single technical factor), propeller hub wear,
      battery estimation errors, and flight control system anomalies — a level of transparency unusual
      in the industry but also an adverse signal for operational reliability in complex environments.
    claimRefs:
