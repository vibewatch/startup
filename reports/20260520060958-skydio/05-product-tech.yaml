  - id: TE003
    title: Technology / Operating Architecture Table
    columns:
      - Layer / Component
      - Role
      - Key Dependency
      - Technical Risk
    rows:
      - - NVIDIA Jetson Orin SoC
        - Main AI autonomy compute; 3D environment reconstruction and obstacle avoidance
        - U.S.-designed silicon; globally manufactured (TSMC supply chain)
        - Supply disruption or export restriction; no disclosed second-source
      - - Qualcomm Snapdragon 865 SoC
        - Payload/camera ISP and secondary compute
        - Qualcomm supply chain
        - Same silicon supply-chain risk as Jetson; dual-SoC adds thermal/power budget
      - - Visual-Inertial Odometry (VIO)
        - GPS-independent navigation; ±10 cm hover accuracy
        - Six custom navigation cameras; IR/visible illuminators for NightSense
        - Degraded in featureless environments (open ocean, white-out); illuminator range limits
      - - GNSS module
        - GPS + Galileo + GLONASS + BeiDou for standard navigation
        - Multi-constellation GNSS chipset
        - Spoofable; degraded to VIO when jammed — increases compute load
      - - Connect SL (Wi-Fi 6 radio)
        - Primary point-to-point C2 link; up to 7.5 miles / 12 km rural
        - 2.4 GHz and 5 GHz spectrum; AES-256 encrypted
        - Susceptible to RF jamming; range drops to 1-2 km in urban/high-interference
      - - Connect 5G (LTE/5G cellular)
        - BVLOS remote ops and unlimited-range operations
        - Third-party carrier network (AT&T, Verizon, T-Mobile or carrier SIM)
        - Carrier outage or rural coverage gap disables remote ops; data cost variable
      - - Teledyne FLIR Boson+ thermal sensor
        - Radiometric thermal imaging; 640×512, <30 mK sensitivity
        - Teledyne FLIR supply chain
        - Single-source thermal sensor creates supply dependency; Teledyne is US-based
      - - Battery (LiPo cells)
        - Primary power; ~40 min flight time
        - High-performance LiPo cells; supply chain exposed to Chinese export controls
        - China's Oct 2024 export controls caused Skydio to ration batteries; no confirmed US alternative
      - - Skydio Cloud (AWS US-West)
        - Fleet management, evidence storage, remote ops relay, over-the-air updates
        - Amazon Web Services US-West region
        - AWS outage risk; data sovereignty for non-US allies limited without international regions
      - - Dock TPM + SkydioLink radio
        - Hardware key storage for encryption; secure C2 between Dock and X10
        - TPM chipset + AES-256 wireless
        - Dock physical security required; exposed outdoor installation may allow tampering
      - - DFR Command / Remote Ops cloud
        - Dispatch integration, fleet management, remote ops UI, evidence workflow
        - Skydio Cloud + customer CAD/NG911/Axon systems
        - SaaS availability; integration complexity with legacy CAD systems
    notes: >-
      Architecture data sourced from official Skydio product and security pages. Supply-chain
      risk assessments are inferred from public disclosures; exact component sourcing not publicly confirmed.
