callouts:
  - calloutType: strength
    title: Autonomy Stack as Durable Technical Moat
    body: >-
      Skydio's AI autonomy stack — VIO-based GPS-denied navigation, NightSense zero-light autonomous
      flight, and 360-degree obstacle avoidance on an NVIDIA Jetson Orin — represents genuine
      multi-year R&D depth that Chinese-manufactured competitors cannot legally offer to U.S. federal
      agencies. Combined with Blue UAS/NDAA compliance, this creates a structural procurement advantage
      that persists as long as federal drone-procurement restrictions remain in force.
    claimRefs:
      - CE029
      - CE030
      - CE031

  - calloutType: risk
    title: Battery Supply Chain Remains Unresolved Critical Risk
    body: >-
      China's October 2024 export controls forced Skydio to ration batteries to its entire installed
      base — a direct product delivery failure. The SkyForge manufacturing commitment does not guarantee
      resolution of the upstream battery-cell dependency. Until a U.S.-manufactured or allied-nation
      high-performance LiPo cell source is qualified, this remains the single largest product-continuity
      risk in the portfolio.
    claimRefs:
      - CE041
      - CE044

  - calloutType: risk
    title: Thin-Obstacle Detection and Reliability Transparency
    body: >-
      Skydio's public reliability dashboard acknowledges that thin-obstacle detection failures (power
      lines, cables) are the largest technical-factor incident driver. The company has stated that
      software fixes are planned but not shipped as of May 2026. Operators in power-line inspection and
      infrastructure environments face elevated crash risk, and the open disclosure — while commendable
      for transparency — constitutes an adverse signal for mission-critical deployments.
    claimRefs:
      - CE043
      - CE045

