  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold / Observable Event
      - Transmission to Investment Thesis
      - Action Implication
    rows:
      - - Blue UAS list removal or suspension
        - >-
          Any credible public report of DCMA audit failure, Blue UAS program termination,
          or congressional action removing Skydio from the approved list
        - >-
          Eliminates Skydio's single most durable structural advantage; DoD and federal
          procurement access collapses; valuation reverts to hardware-only multiples of 2–4x revenue
        - Exit or fully hedge position; re-underwrite from scratch
      - - Battery supply disruption recurrence
        - >-
          Second major rationing event within 12 months of the first resolution, or failure
          to name a qualified domestic battery supplier by Q4 2026
        - >-
          Signals structural (not one-off) supply risk; customer churn accelerates; DFR
          program reliability narrative collapses; new investors discount further
        - Reassess thesis; do not add to position; initiate supply-chain diligence
      - - DoD procurement contraction
        - >-
          Published DoD drone budget reduction exceeding 20% YoY, or loss of Army/Air Force
          program-of-record status without a replacement contract
        - >-
          Removes the largest revenue segment; forces operating restructuring; Series G
          financing at a lower valuation becomes probable
        - Reduce or exit position; monitor quarterly procurement disclosures
      - - Gross margin below 25% on disclosure
        - >-
          Audited gross margin from any financial statement at or below 25% blended
        - >-
          Hardware-dominant economics cannot support a 10–20x revenue multiple; SaaS premium
          layer is de minimis; fair value falls to 4–6x revenue (~$1.2–3B)
        - Revise recommendation to Avoid; exit at next liquidity window
      - - Revenue miss vs. company claim
        - >-
          Audited FY2025 revenue below $200M (materially below "hundreds of millions" claim)
        - >-
          Management narrative credibility impaired; Series F investors at $4.4B overpaid
          by 2–3x; down-round financing likely
        - Exit; reassess all thesis anchors
      - - Key-person departure
        - >-
          Departure of CEO Adam Bry or co-founder Abe Bachrach without planned succession
        - >-
          Company identity and defense relationships are co-founder-dependent; talent
          retention and vision continuity at risk
        - Monitor; initiate succession diligence; potential trigger for reassessment
    notes: >-
      Triggers are derived from public risk evidence across chapters 4 and 7; monitoring
      paths are limited for a private company; some triggers only become visible at
      liquidity events or voluntary disclosure.
    claimRefs:
      - CV015
      - CV023
      - CV024
      - CV025
      - CV026
      - CV034
      - CV039

  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters for Valuation
      - Owner / Diligence Path
    rows:
      - - Gross margin by segment
        - >-
          Audited blended and segment-level gross margin (hardware drone, dock/infrastructure,
          software subscription, services) from FY2024 and FY2025
        - >-
          A 30% gross margin justifies a 5–7x revenue multiple; a 60% gross margin justifies
          15–20x; without this, the $4.4B cannot be independently underwritten
        - CFO James LaCamp; data room income statement
      - - ARR and net revenue retention
        - >-
          Annual recurring revenue by product (DFR Command, Remote Ops, 3D Scan, Connect);
          NRR by customer segment since 2022
        - >-
          Determines whether the software layer is material (defensible premium) or de minimis
          (hardware multiple applies); drives fair value by 2–4x
        - CRO Callan Carpenter; product billing system export
      - - Battery supply chain status
        - >-
          Qualified domestic battery supplier name, volume ramp timeline, unit cost vs. prior
          China source, and delivery confirmation as of Q2 2026
        - >-
          Battery disruption is the highest-severity confirmed operational risk; unresolved
          supply means operational fragility persists in every scenario
        - CEO Adam Bry; supplier qualification letter in data room
      - - Cap table and preference stack
        - >-
          Full capitalization table; liquidation waterfall by series; anti-dilution terms;
          secondary overhang from existing investor LP mark-to-model vs. market
        - >-
          Determines true common equity value at exit; at $1.5–3B exit, preferred liquidation
          preferences may wipe out common equity and employee options entirely
        - Legal counsel; Series F term sheet and prior round documents
      - - SkyForge financing plan
        - >-
          Board-approved capex schedule for the $3.5B SkyForge commitment by year;
          financing sources (internal cash, debt, grants, future equity)
        - >-
          $3.5B is 5x total equity raised; if unfunded, the manufacturing thesis is aspirational
          and future dilutive equity rounds are necessary
        - CFO; board-approved capex plan and financing commitment letters
      - - Audited revenue and burn
        - >-
          Audited FY2025 revenue, COGS, gross profit, operating expense, and cash burn;
          post-Series F cash runway projection
        - >-
          Confirms or refutes the "hundreds of millions" revenue claim; cash runway determines
          whether another raise is imminent within 12–18 months
        - Audit firm; data room P&L and board cash-flow schedule
    notes: >-
      All six diligence items are blocking for a Buy recommendation. Items 1 (gross margin)
      and 6 (audited revenue) are the most critical for independent underwriting. Items 3–5
      (battery, cap table, SkyForge) are required to assess risk-adjusted downside.
    claimRefs:
