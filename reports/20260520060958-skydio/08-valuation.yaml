  - id: scenario-analysis-bull-base-bear
    title: Scenario Analysis — Bull, Base, and Bear Cases
    body: >-
      Three scenarios frame the investment range. In the bull case, Skydio achieves $600 million or
      more in revenue by fiscal 2027 (roughly 35–50% compound growth from the current
      "hundreds-of-millions" base), software ARR exceeds 40% of total revenue, gross margin
      reaches 55% or above, the battery supply chain is fully resolved with a qualified domestic
      supplier, BVLOS rulemaking creates a large new commercial DFR market, and a liquidity event
      occurs at a 15–20x revenue multiple consistent with a defense-software-platform valuation.
      That yields an exit value of $8–12 billion, representing a 2–3x return from the $4.4 billion
      Series F price for investors at current valuation. The base case assumes modest revenue growth
      (to $300–500 million by fiscal 2027), a hardware-heavy revenue mix with blended gross margin
      of 35–50%, battery supply partially resolved, and an exit at 10–12x revenue — producing a
      valuation of $3.5–6 billion, roughly in line with or modestly above the current Series F
      price, representing a limited-return scenario for new investors. The bear case features a
      material DoD contract loss or procurement slowdown, a recurrence of the battery supply
      disruption, a Blue UAS policy challenge, or a workforce disruption that forces a down round;
      the company raises capital at $2–3 billion or exits at $1.5–2.5 billion, implying a loss of
      40–65% from the current Series F price. The base case is the most probable given current
      trajectory, but the limited upside relative to the current entry price (a 2–3x bull case
      requires significant execution on multiple fronts simultaneously) and the material bear case
      tail risk argue for a Track rather than Buy recommendation at current valuation. Table TV004
      provides the formal scenario structure.
