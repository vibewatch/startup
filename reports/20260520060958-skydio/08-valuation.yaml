  - id: TV002
    title: Thesis and Anti-Thesis Table
    columns:
      - Thesis Argument
      - Evidence Base
      - Anti-Thesis
      - What Would Change This View
    rows:
      - - Blue UAS regulatory moat creates a durable procurement barrier to DJI and Chinese-origin drones
        - NDAA 2025 language, Blue UAS approved list, DoD procurement directives
        - The moat is a government policy, not a patent; it can be narrowed, waived, or reversed
        - Evidence of sustained regulatory challenge, DCMA audit failure, or legislative roll-back
      - - Defense and public safety channel is deep and institutionalized
        - >-
          Every US military branch, 1,200+ public safety agencies, 29 allied nations, $52M Army
          order, Air Force EOD, USAFCENT
        - >-
          Revenue is concentrated in US DoD; a single large contract loss would materially impair
          revenue; no revenue by segment disclosed
        - Disclosed contract-by-contract revenue breakdown; diversification to non-DoD segments
      - - Autonomy platform differentiates Skydio from hardware-only competitors
        - Skydio Autonomy Engine, dock-based DFR, obstacle-avoidance capabilities
        - >-
          Large defense primes (RTX, L3Harris) have acquisition budgets that could close the
          autonomy gap; Joby/Shield AI have deep AI talent pipelines
        - A large defense prime or well-funded startup replicating autonomy stack within 18 months
      - - Hundreds of millions in annual revenue with "strong unit economics" signals approaching profitability
        - CEO public statement in Series F blog post (April 2026)
        - >-
          Revenue is company-claimed and unaudited; "strong unit economics" is undefined;
          hardware margins and SaaS revenue mix are undisclosed
        - Audited gross margin ≥40% and ARR as a percentage of total revenue confirmed
      - - SkyForge $3.5B manufacturing commitment reinforces supply-chain sovereignty
        - Skydio official press release and blog; govexec coverage
        - >-
          $3.5B is approximately 5x total equity raised; financing structure is unconfirmed; the
          commitment may be aspirational rather than contractually funded
        - Board-approved capex schedule with binding commitments and financing sources disclosed
      - - April 2026 oversubscribed round at $4.4B with investor demand turned down is a positive signal
        - CEO public statement; Series F announcement
        - >-
          Oversubscription signals insider/existing-investor demand, not necessarily arms-length
          price discovery; existing VCs may be marking to model rather than market
        - Arms-length secondary trade above $4.4B or LP marks from independent institutions
    notes: >-
      Thesis and anti-thesis pairs sourced from public evidence only; private diligence would
      likely resolve the financial opacity arguments.
