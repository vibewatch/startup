  - id: financing-context-and-entry-discipline
    title: Financing Context, Entry Discipline, and Preference Overhang
    body: >-
      The Series F ($110 million at $4.4 billion) follows a Series E ($230 million at $2.2 billion
      in 2022), implying a 2x valuation step-up over roughly four years. Total disclosed equity
      raised is approximately $672 million. The CEO's framing that the round was oversubscribed and
      that demand was deliberately restrained is a positive signal — it implies that clearing price
      was at least $4.4 billion in the secondary market — but it is not auditable from public data.
      Preferred stock issued in private rounds typically carries standard liquidation preferences
      (1x non-participating to 2x participating are common) that create an overhang on common
      equity. Without cap table disclosure, the economic split between preferred and common at any
      exit below $4.4 billion cannot be assessed. At a hypothetical $3 billion exit, existing
      preferred holders with a 1x liquidation preference could recover most or all of the $672
      million raised while common equity approaches zero. This preference overhang is a standard
      venture-backed company feature but is material given the $4.4 billion entry price. Entry
      discipline at this price requires visibility into gross margin (the difference between a
      hardware-dominant 30–35% margin and a software-platform 60–70% margin implies a 2–3x
      difference in fair value at the same revenue), ARR as a share of total revenue (a company
      with 40% ARR at $400 million total revenue is categorically different from one with 10% ARR),
      and the SkyForge financing plan (a $3.5 billion commitment that is aspirational rather than
      contractually funded creates a future dilution risk). The SEC Form D records confirm Skydio
      has used exempt offering structures consistent with a company that is not contemplating a
      near-term IPO. Table TV001 provides the recommendation summary.
