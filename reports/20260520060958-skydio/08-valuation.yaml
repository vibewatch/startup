  - id: TV003
    title: Comparable Valuation Table
    enumerationScope:
      coverage: partial
      basis: >-
        Public defense-drone, defense-tech, and defense-AI companies as of May 2026 plus
        disclosed private round marks for the closest private analogs; excludes undisclosed
        private marks and non-defense drone companies.
    columns:
      - Comparable
      - Type
      - Revenue / Scale
      - Multiple or Valuation
      - Relevance to Skydio
      - Limitation
    rows:
      - - AeroVironment (AVAV)
        - Public defense drone / autonomy
        - $1.61B TTM revenue; $8.1B market cap; profitable EBITDA
        - EV/Rev 5.2x; P/S 4.3x (May 2026)
        - "Closest public comp: US DoD-focused, autonomous UAS, Blue UAS eligible"
        - >-
          Audited and profitable; larger scale (~4–7x Skydio revenue); full financial disclosure
          makes Skydio's premium vs. AVAV difficult to sustain at public market multiples
      - - Red Cat Holdings (RCAT)
        - Public small defense drone (Teal Golden Eagle)
        - ~$30M annual revenue; ~$420M market cap
        - P/S ~14x (highly volatile; small float)
        - NDAA-aligned US-made defense drone; Blue UAS eligible
        - >-
          Much smaller scale; early commercialization stage; illiquid stock makes multiple
          unreliable; not a valid comp for Skydio's revenue base
      - - Joby Aviation (JOBY)
        - Public eVTOL / defense-adjacent autonomous aviation
        - Pre-revenue; ~$9.8B market cap (May 2026)
        - N/A (no revenue); valued on FAA certification and DoD contract pipeline
        - Shows capital markets will award $10B+ to defense-adjacent autonomy with regulatory moat
        - >-
          Pre-revenue and different mission; Joby's moat is FAA eVTOL certification, not Blue UAS;
          not directly comparable on financial metrics
      - - Shield AI (private)
        - Private defense AI autonomy (Hivemind)
        - Undisclosed revenue; ~$2.7B round valuation (November 2023)
        - N/A (private; 2023 mark is stale)
        - Software-primary defense AI autonomy; closest private analogue to Skydio's software layer
        - >-
          2023 mark is stale by 30 months; no public revenue disclosure; software-only vs.
          Skydio's hardware+software mix; Skydio at $4.4B represents a 63% premium to Shield AI
      - - Anduril Industries (private)
        - Private defense AI platform (hardware+software)
        - Undisclosed revenue; ~$18B round valuation (2024)
        - N/A (private; 2024 mark)
        - Demonstrates large private defense-AI valuations are possible
        - >-
          Anduril is hardware+software like Skydio but at much larger scale and disclosed
          government contract volume; Skydio at $4.4B implies one-quarter of Anduril's valuation
          at presumably a fraction of Anduril's revenue
    notes: >-
      Public multiples sourced from Yahoo Finance as of May 19–20, 2026. Private valuations
      from disclosed press coverage; actual caps and preferences are not public. Skydio's
      implied EV/Revenue range of 10–20x is derived from management's "hundreds of millions"
      revenue claim against the $4.4B post-money valuation.
