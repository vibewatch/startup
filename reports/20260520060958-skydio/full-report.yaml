  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Scope, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Skydio's addressable market is best understood as five partially overlapping sub-markets rather than a
              single generic drone TAM. First, drone-as-first-responder (DFR) and public safety: police, fire, EMS,
              search-and-rescue, and emergency management agencies deploying autonomous drones as tactical assets.
              Second, critical infrastructure inspection: utilities, energy companies, telecommunications, and
              transportation operators using drones for mandatory inspection of power lines, pipelines, wind turbines,
              bridges, and rail corridors. Third, defense and national security sUAS: DoD program offices, allied
              militaries, and US intelligence community procuring short-range reconnaissance, surveillance, and tactical
              UAS platforms under NDAA-governed procurement. Fourth, site security and remote monitoring: enterprise
              facilities, industrial campuses, ports, and critical infrastructure operators deploying autonomous
              dock-and-drone systems for perimeter monitoring and incident response. Fifth, the broader US government
              commercial drone platform market where agencies require Blue UAS-cleared or NDAA-compliant platforms for
              non-military federal operations. Included spend covers hardware (drones, docks, accessories), software
              subscriptions (DFR Command, Remote Ops, 3D Scan, fleet management), services, and support contracts.
              Excluded spend covers consumer recreational drones, Chinese-manufactured platforms restricted by NDAA
              (DJI, Autel, and CISA-listed entities), commercial package delivery logistics (Amazon Prime Air, Wing),
              crop-spraying agricultural drones, and long-range fixed-wing cargo. Status-quo substitutes for Skydio
              include: manned helicopters (used for aerial surveillance by police and fire departments — cost
              $500-1,500/flight hour versus $20-80/hour for drone operations); manned inspection crews for utilities
              (estimated $150-500K per annual inspection cycle per asset class); Chinese drones — DJI and Autel — which
              dominated US public safety and commercial inspection markets before NDAA restrictions; legacy US drone
              platforms (Parrot Anafi, older DJI-era equivalents, small fixed-wing ISR platforms); fixed surveillance
              cameras with security guard staffing; and specialist drone service contractors. Each substitute represents
              both the competitive baseline Skydio displaces and a cost benchmark against which drone ROI is measured.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
