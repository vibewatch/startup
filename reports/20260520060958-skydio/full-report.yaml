      - number: '1.4'
        title: Scale metrics, milestones, and adverse events
        blocks:
          - type: paragraph
            body: >-
              Skydio's operational scale as of April 2026 is substantial and multi-dimensional. The company has shipped
              over 60,000 drones, recorded over 3.7 million customer missions, and has more than 3,800 enterprise
              customers, including over 1,200 public safety agencies throughout the United States, every branch of the
              U.S. military, and 29 allied nations, as well as more than 450 utility and energy companies. Sixteen
              million Americans live within two miles of a Skydio Drone as First Responder dock. The U.S. Army placed a
              $52 million order for over 2,500 X10D drones in March 2026 — the largest single-vendor tactical sUAS order
              in Army history — and the Army selected Skydio as the SRR Program of Record in both 2022 (Tranche 1, X2D)
              and 2025 (Tranche 2, X10D). The Defense Innovation Unit's February 2025 Blue UAS refresh selected the X10D
              for NDAA verification. The U.S. Air Force awarded initial multi-million-dollar contracts for TACP and EOD
              units. The chronology of key adverse events: in 2024, Skydio underwent a reported workforce reduction of
              approximately 25% (roughly 100 employees), attributed to a strategic pivot toward government and defense
              and away from consumer markets. In October 2024, China sanctioned Skydio over its sales to Taiwan; Skydio
              confirmed its only Taiwan customer was the National Fire Agency and responded by rationing batteries (one
              per drone) because batteries had not yet been onshored. New non-Chinese battery sources were expected by
              spring 2025. These adverse events highlight two material diligence items: first, the 2024 restructuring
              suggests the enterprise-only model required a recalibration that was not fully anticipated; second, the
              battery episode exposed a supply chain dependency that the company publicly acknowledged and committed to
              resolving. The April 2026 $3.5 billion U.S. manufacturing investment commitment, branded as SkyForge, was
              announced one day after the Series F and is intended to create 2,000+ Skydio jobs and 3,000+ supply chain
              roles while directing $1 billion or more to domestic suppliers.
