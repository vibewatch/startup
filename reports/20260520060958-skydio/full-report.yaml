      - number: '2.2'
        title: Market Sizing — Multiple Lenses
        blocks:
          - type: paragraph
            body: >-
              Multiple sizing lenses are required for Skydio because the addressable market is structurally different
              from the generic commercial drone TAM. Lens 1 — Generic global commercial drone TAM: Grand View Research
              estimates the global commercial drone market at approximately $6.5B in 2023, growing to approximately
              $31.5B by 2030 (CAGR ~25%). MarketsandMarkets estimates $14.1B (2023) to $55.8B (2030), CAGR ~22%.
              Precedence Research estimates $12.5B (2023) to $58.5B (2032), CAGR ~18.6%. Fortune Business Insights
              estimates $48.9B by 2030. These estimates conflict materially and are not disaggregated by government vs.
              consumer vs. agricultural sub-segments; their utility as Skydio TAM anchors is limited. Lens 2 — US
              government/public safety/defense/utility SAM: combining the US share of the global public safety drone
              market (approximately $300-450M in 2024, growing to $950M-1.1B by 2030 per Business Research Insights),
              DoD sUAS visible contract awards ($1-3B annually), and US utility/infrastructure inspection drone spending
              ($500M-1B), yields a combined US government/institutional SAM of approximately $2-5B annually in
              2024-2026. Lens 3 — Blue UAS / NDAA-cleared procurement channel: the DIU Blue UAS cleared list covers
              approximately 12-18 platforms as of early 2024. This procurement channel is smaller and faster (3-6 month
              cycle versus 12-24 months for standard federal procurement), representing a sub-SAM of approximately
              $500M-2B annually for cleared domestic drone manufacturers. Lens 4 — Constrained SOM from Skydio customer
              base: with 3,800+ customers and estimated average contract value of $100-300K per customer (hardware +
              multi-year software subscription), the current book-value SOM is approximately $380M-1.1B, with expansion
              potential from DFR program deepening and defense ramp. Contradictory estimates are preserved: no analyst
              source provides a Skydio-specific SAM or SOM, and all lenses have high uncertainty bands. The DoD
              Replicator program ($500M-1B tranche dedicated to attritable sUAS in FY2024-2025) represents a discrete
              expansion event not captured in run-rate estimates.
