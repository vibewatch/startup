  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              Skydio's regulatory risk stack is unusually consequential because a large share of its commercial upside
              depends on remaining inside defense-friendly procurement and airspace rules rather than simply winning on
              price. The company benefits from the NDAA and Blue UAS regime today, but that moat also creates
              sensitivity to any certification change, audit finding, or administrative disruption as the Blue UAS
              program reportedly moved from the Defense Innovation Unit to the Defense Contract Management Agency under
              a July 2025 Secretary of Defense memorandum. Table TR001 shows how this procurement gate sits alongside
              FAA Part 107 visual-line-of-sight limits, uncertain timing for a general BVLOS rule, ITAR and EAR
              obligations tied to deployments in 29 allied nations, evolving privacy and data-protection rules, and
              product-liability exposure if an autonomy or dock-related incident causes injury. Figure FR001 underscores
              that these are not hypothetical edge cases: China sanctions are already active, while FAA, export-control,
              privacy, and safety constraints remain monitorable risks that can change Skydio's addressable market or
              contract eligibility. Public evidence does not show known FAA enforcement or product recalls, but the
              absence of identified actions is not the same thing as legal clearance, especially for a private company
              selling into security-sensitive missions.
            claimRefs:
