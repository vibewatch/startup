  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              Skydio's investment thesis rests on four compounding advantages: a regulatory moat created by the NDAA
              Blue UAS framework that effectively bans DJI and other Chinese-origin drones from federal procurement; a
              defense and public safety channel anchored by every U.S. military branch, more than 1,200 public safety
              agencies, and 29 allied nations; a platform autonomy stack — obstacle avoidance, dock-based DFR, and
              Skydio Autonomy Engine — that competitors have not matched at scale; and a domestic manufacturing posture
              ($3.5 billion SkyForge commitment) that reinforces NDAA-aligned procurement eligibility. These advantages
              are not hypothetical: the Army's $52 million X10D order, Air Force EOD follow-on awards, and USAFCENT dock
              deployments confirm that Skydio has moved from pilot to program-of-record status in multiple defense
              verticals. The April 2026 Series F at $4.4 billion, led by existing investors who were reportedly turned
              down on attempts to invest more, signals continued insider confidence. The anti-thesis is equally
              grounded. Financial opacity is the single largest constraint on underwriting: gross margin, ARR, NRR, and
              cash burn are undisclosed, making it impossible to confirm whether the $4.4 billion price is consistent
              with value. The October 2024 battery supply shock — which forced roughly one-battery-per-month rationing —
              exposed a structural hardware dependency that a software premium multiple cannot simply absorb. The Blue
              UAS moat is a government policy that could be narrowed, challenged, or not renewed. Workforce reduction of
              approximately 25% in fall 2024 raises execution risk questions. Revenue concentration in DoD contracts
              creates lumpiness and single-event downside. Without resolving these gaps, a buy recommendation cannot be
              supported by public evidence. Table TV002 structures the full thesis and anti-thesis. Figure FV001 chains
              the evidence to the recommendation outcome.
            claimRefs:
