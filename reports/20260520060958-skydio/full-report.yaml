      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The single largest structural driver of Skydio's addressable market is US policy: the NDAA Chinese drone
              restriction (Section 848 FY2020 and successive annual NDAA provisions through FY2025) bars US federal
              agencies from procuring drones manufactured by DJI, Autel Robotics, Parrot, and other CISA-listed Chinese
              entities. This effectively mandates domestic procurement for the entire federal and DoD market, and has
              catalyzed state and local agencies to follow. The Blue UAS DIU cleared list accelerates procurement cycles
              from 12-24 months to 3-6 months for vetted platforms, creating a structural time-to-deployment advantage
              for Skydio. FAA BVLOS regulatory liberalization is the second key driver: without BVLOS authorization, DFR
              programs require dedicated on-site pilots for every flight, eliminating the economics of autonomous
              first-response. The FAA issued limited DFR BVLOS waivers starting in 2022-2023 and proposed broader
              rulemaking in 2023; the pace of waiver issuance constrains how quickly agencies can deploy full autonomous
              DFR programs. AI and autonomy ROI is a compounding driver: Skydio's autonomous obstacle avoidance reduces
              the pilot skill requirement, expanding deployable operators and reducing per-flight cost by an estimated
              30-60% versus manually piloted platforms. Principal constraints: capital intensity — Skydio Dock
              infrastructure requires $50-200K+ per site, limiting adoption velocity for smaller agencies on fixed
              budgets; training and workflow change — DFR program deployment requires 6-18 months of operator training,
              BVLOS waiver acquisition, CAD integration, and policy development; procurement cycle length — defense and
              federal procurement cycles remain 12-36 months even with Blue UAS streamlining; and supply chain fragility
              — the October 2024 China sanctions on Skydio created a battery rationing event that demonstrated ongoing
              hardware supply chain dependence on Chinese components despite US assembly. The most significant tail risk
              is legal or political rollback of NDAA Chinese drone provisions: DJI and domestic drone resellers have
              lobbied against Section 848, and any successful legal challenge or NDAA amendment could immediately
              re-open Chinese drone procurement in federal and potentially state markets, eliminating Skydio's primary
              structural moat.
