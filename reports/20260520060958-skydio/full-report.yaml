      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Autonomy platform creates durable regulatory and technical moat
            body: >-
              Skydio's AI autonomy stack, combined with Blue UAS clearance and NDAA compliance, creates a structural
              procurement advantage that DJI and most foreign competitors cannot access. The Army SRR Program of Record
              spanning both tranches (2022 and 2025) confirms that the moat has survived multiple acquisition review
              cycles.
            calloutType: strength
            claimRefs:
              - CO007
              - CO025
              - CO035
          - type: callout
            title: Battery supply chain and China sanctions remain a material diligence item
            body: >-
              The October 2024 China sanctions revealed that batteries were one of few components still sourced from
              China as of that date. Skydio rationed batteries for months. New sources were expected by spring 2025 but
              the company has not published confirmation of full onshoring. Any future escalation with Chinese suppliers
              would repeat this disruption.
            calloutType: risk
            claimRefs:
              - CO027
              - CO028
              - CO029
              - CO030
          - type: callout
            title: Series F structure signals operating leverage but raises valuation transparency questions
            body: >-
              A $110M raise led by existing investors at $4.4B — oversubscribed but kept small — is consistent with
              either a company approaching free cash flow positive (Bry's framing) or with new institutional investors
              unwilling to underwrite the valuation. Revenue growth rate, margin, and retention remain undisclosed,
              making independent verification of the operating-leverage thesis impossible from public sources alone.
            calloutType: insight
            claimRefs:
              - CO013
              - CO014
              - CO015
          - type: callout
            title: 2024 workforce reduction and lobbying critique deserve explicit tracking
            body: >-
              The reported ~25% workforce cut and DroneXL's detailed critique of Skydio's anti-DJI lobbying strategy are
              adverse signals that later chapters should reuse. The pivot narrative (consumer to defense) carries
              reputational risk if the regulatory moat depends on legislation that may be legally challenged or
              reversed.
