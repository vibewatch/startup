chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, mission, and product model
        blocks:
          - type: paragraph
            body: >-
              Skydio is a San Mateo, California-based autonomous drone company whose core mission is to build the flying
              robot infrastructure that critical industries rely on. The company self-describes as the largest drone
              manufacturer in the United States and characterizes its technology platform as "flying robots" that serve
              public safety, defense, utility, and enterprise customers. The current product family includes the Skydio
              X10 (commercial and civil flagship launched September 2023), the Skydio X10D (defense-grade variant), the
              Skydio R10 (resilient tactical platform), the Skydio F10 (fixed-wing long-range), the Skydio Dock for X10
              (automated launch and recovery station enabling remotely piloted and autonomous operations without on-site
              personnel), and software platforms including DFR Command, Remote Ops, and 3D Scan. Skydio Autonomy is the
              company's AI navigation stack; Skydio Connect is its fleet management layer; and Skydio Extend provides an
              open integration API for third-party developers. The core business model is hardware plus software: drones
              and docks are sold to enterprise, government, and public safety customers under direct contracts and
              through state and federal procurement vehicles, with recurring revenue from software subscriptions (DFR
              Command, Remote Ops) layered on top. The company designs and assembles all products in the United States —
              primarily at its Hayward, California manufacturing facility — and positions domestic origin as both a
              security differentiator and a regulatory moat against Chinese drone manufacturers, particularly DJI. As of
              the April 2026 Series F announcement, Skydio claims hundreds of millions in annual revenue with strong
              unit economics and hypergrowth, though no audited revenue figure is publicly available. Headquarters is at
              3000 Clearview Way, San Mateo, CA, consistent with official materials.
