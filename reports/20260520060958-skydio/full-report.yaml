      - number: '5.3'
        title: Deployment, BVLOS Remote Ops, and Ecosystem Integrations
        blocks:
          - type: paragraph
            body: >-
              Skydio's deployment model is designed for remote and unattended operations. In the Drone as First
              Responder (DFR) workflow, Dock hives — groups of two or more Docks positioned at strategic locations — are
              integrated with CAD and NG911 dispatch systems through DFR Command. When a call is received, a remote
              pilot in command (RPIC) launches the nearest Dock-resident X10 automatically in under 20 seconds,
              providing on-scene situational awareness before officers arrive. The X10's Pathfinder technology
              autonomously routes around terrain and airspace restrictions. For patrol-led DFR, an officer deploys an
              X10 or R10 at the scene and hands off to a remote operator via DFR Command over 5G/LTE. Browser-based
              Skydio Remote Ops gives enterprise customers the ability to launch and pilot fleet drones from any
              location without proprietary hardware. Skydio Academy provides formal pilot training, and Skydio's
              Regulatory Services team assists agencies with FAA BVLOS waivers. On the defense side, the X10D delivers
              live video with STANAG 4609 compliant KLV telemetry directly into the Android Team Awareness Kit (ATAK)
              and ATAK UAS Tool, and supports RAS-A and MAVLink integration protocols. The Skydio Connect External Radio
              extends point-to-point range when separated from the Dock; Starlink integration enables Dock connectivity
              in remote locations without cellular coverage. The integrations catalog lists partners including Axon Air
              (real-time situational awareness and automatic evidence upload to Axon Evidence), RapidSOS (CAD
              integration), Pix4D, Bentley iTwin Capture, DroneDeploy, and ESRI SiteScan. The Dock system supports
              Skydio Connect Fusion — automatic blending of 5G cellular and point-to-point links — enabling effectively
              unlimited range wherever cellular coverage exists, and provides built-in drone deconfliction for
              multi-drone fleet operations. As of the report date, Skydio serves over 1,200 public safety agencies,
              every branch of the U.S. Department of Defense, and 29 allied nations, though no independent verification
              of these customer counts is available from public sources.
