  - id: TV004
    title: Bull / Base / Bear Scenario Table
    columns:
      - Scenario
      - Key Assumptions
      - Revenue (2027E)
      - Implied Valuation / Exit Range
      - Return to Series F Investor
      - Key Risks to Scenario
    rows:
      - - Bull
        - >-
          ARR >40% of revenue; gross margin ≥55%; domestic battery supplier confirmed Q3 2026; BVLOS rule expands
          commercial DFR market; DoD budget favorable; IPO or strategic exit at 15–20x revenue
        - $600M+
        - $8B – $12B
        - 2–3x on $4.4B entry
        - >-
          Requires simultaneous execution across autonomy, manufacturing, software growth, and regulatory tailwinds; any
          single failure compresses the outcome toward base case
      - - Base
        - >-
          Hardware-heavy mix (ARR 15–25% of revenue); gross margin 35–50%; battery supply partially resolved; steady DoD
          contract renewals; exit at 10–12x revenue in 2028–2030
        - $300M – $500M
        - $3.5B – $6B
        - 0–1.4x on $4.4B entry (flat to modest return)
        - >-
          Financial opacity means base case is hard to confirm; hardware margin compression from SkyForge ramp costs
          could push valuation toward bear case
      - - Bear
        - >-
          Major DoD contract loss or budget cut; battery disruption recurs; Blue UAS challenge; workforce reduction 2.0;
          capital raise required at $2–3B down round
        - $150M – $250M
        - $1.5B – $2.5B
        - 0.3–0.6x on $4.4B entry (loss of 40–65%)
        - >-
          Liquidation preference stack means common equity (including employee options) is wiped at $1.5B exit;
          preferred holders may partially recover
    notes: >-
      All revenue and valuation figures are estimates based on analyst reasoning from public information; no audited
      Skydio financial data is available. Probability signals: bull ~25%, base ~50%, bear ~25% — reflecting high outcome
      dispersion from financial opacity.
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV014
      - CV025
  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold / Observable Event
      - Transmission to Investment Thesis
      - Action Implication
    rows:
      - - Blue UAS list removal or suspension
        - >-
          Any credible public report of DCMA audit failure, Blue UAS program termination, or congressional action
          removing Skydio from the approved list
        - >-
          Eliminates Skydio's single most durable structural advantage; DoD and federal procurement access collapses;
          valuation reverts to hardware-only multiples of 2–4x revenue
        - Exit or fully hedge position; re-underwrite from scratch
      - - Battery supply disruption recurrence
        - >-
          Second major rationing event within 12 months of the first resolution, or failure to name a qualified domestic
          battery supplier by Q4 2026
        - >-
          Signals structural (not one-off) supply risk; customer churn accelerates; DFR program reliability narrative
          collapses; new investors discount further
        - Reassess thesis; do not add to position; initiate supply-chain diligence
      - - DoD procurement contraction
        - >-
          Published DoD drone budget reduction exceeding 20% YoY, or loss of Army/Air Force program-of-record status
          without a replacement contract
        - >-
          Removes the largest revenue segment; forces operating restructuring; Series G financing at a lower valuation
          becomes probable
        - Reduce or exit position; monitor quarterly procurement disclosures
      - - Gross margin below 25% on disclosure
        - Audited gross margin from any financial statement at or below 25% blended
        - >-
          Hardware-dominant economics cannot support a 10–20x revenue multiple; SaaS premium layer is de minimis; fair
          value falls to 4–6x revenue (~$1.2–3B)
        - Revise recommendation to Avoid; exit at next liquidity window
      - - Revenue miss vs. company claim
        - Audited FY2025 revenue below $200M (materially below "hundreds of millions" claim)
        - >-
          Management narrative credibility impaired; Series F investors at $4.4B overpaid by 2–3x; down-round financing
          likely
        - Exit; reassess all thesis anchors
      - - Key-person departure
        - Departure of CEO Adam Bry or co-founder Abe Bachrach without planned succession
        - >-
          Company identity and defense relationships are co-founder-dependent; talent retention and vision continuity at
          risk
        - Monitor; initiate succession diligence; potential trigger for reassessment
    notes: >-
      Triggers are derived from public risk evidence across chapters 4 and 7; monitoring paths are limited for a private
      company; some triggers only become visible at liquidity events or voluntary disclosure.
    claimRefs:
      - CV015
      - CV023
      - CV024
      - CV025
      - CV026
      - CV034
      - CV039
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters for Valuation
      - Owner / Diligence Path
    rows:
      - - Gross margin by segment
        - >-
          Audited blended and segment-level gross margin (hardware drone, dock/infrastructure, software subscription,
          services) from FY2024 and FY2025
        - >-
          A 30% gross margin justifies a 5–7x revenue multiple; a 60% gross margin justifies 15–20x; without this, the
          $4.4B cannot be independently underwritten
        - CFO James LaCamp; data room income statement
      - - ARR and net revenue retention
        - >-
          Annual recurring revenue by product (DFR Command, Remote Ops, 3D Scan, Connect); NRR by customer segment since
          2022
        - >-
          Determines whether the software layer is material (defensible premium) or de minimis (hardware multiple
          applies); drives fair value by 2–4x
        - CRO Callan Carpenter; product billing system export
      - - Battery supply chain status
        - >-
          Qualified domestic battery supplier name, volume ramp timeline, unit cost vs. prior China source, and delivery
          confirmation as of Q2 2026
        - >-
          Battery disruption is the highest-severity confirmed operational risk; unresolved supply means operational
          fragility persists in every scenario
        - CEO Adam Bry; supplier qualification letter in data room
      - - Cap table and preference stack
        - >-
          Full capitalization table; liquidation waterfall by series; anti-dilution terms; secondary overhang from
          existing investor LP mark-to-model vs. market
        - >-
          Determines true common equity value at exit; at $1.5–3B exit, preferred liquidation preferences may wipe out
          common equity and employee options entirely
        - Legal counsel; Series F term sheet and prior round documents
      - - SkyForge financing plan
        - >-
          Board-approved capex schedule for the $3.5B SkyForge commitment by year; financing sources (internal cash,
          debt, grants, future equity)
        - >-
          $3.5B is 5x total equity raised; if unfunded, the manufacturing thesis is aspirational and future dilutive
          equity rounds are necessary
        - CFO; board-approved capex plan and financing commitment letters
      - - Audited revenue and burn
        - >-
          Audited FY2025 revenue, COGS, gross profit, operating expense, and cash burn; post-Series F cash runway
          projection
        - >-
          Confirms or refutes the "hundreds of millions" revenue claim; cash runway determines whether another raise is
          imminent within 12–18 months
        - Audit firm; data room P&L and board cash-flow schedule
    notes: >-
      All six diligence items are blocking for a Buy recommendation. Items 1 (gross margin) and 6 (audited revenue) are
      the most critical for independent underwriting. Items 3–5 (battery, cap table, SkyForge) are required to assess
      risk-adjusted downside.
    claimRefs:
      - CV014
      - CV019
      - CV025
      - CV037
      - CV038
      - CV039
      - CV041
