      - number: '2.3'
        title: Buyer, User, and Payer Segmentation
        blocks:
          - type: paragraph
            body: >-
              Skydio's buyer landscape is structurally segmented by procurement pathway, budget ownership, and adoption
              trigger. Public safety agencies (police, fire, EMS) represent the largest current segment by customer
              count (1,200+ agencies as of late 2024). The decision process is typically: department chief identifies
              use case → drone program pilot funded through federal/state grant (FEMA, DHS, Department of Justice Byrne
              JAG grants) → hardware evaluation → procurement through state or county cooperative purchasing contract or
              direct purchase → software subscription adds recurring revenue. The user (field operator) is often
              different from the payer (department budget/grant officer), and adoption is frequently driven by a
              grant-funded pilot rather than operational budget. Defense and military procurement runs through program
              offices: AFWERX (Air Force rapid acquisition), Army RCCTO (Rapid Capabilities and Critical Technologies
              Office), Marine Corps warfighting labs, and joint DIU pathways. The Blue UAS cleared list is the primary
              filter: only platforms on the cleared list can flow through certain DoD acquisition channels. Contract
              structures range from SBIR/STTR R&D awards to OTA (Other Transaction Authority) agreements to standard
              FAR-based contracts. Utility and energy companies (450+ as of 2024) procure through capital expenditure or
              operating budget owned by the operations or field services organization. ROI is driven by mandatory
              compliance inspection requirements: NERC CIP for bulk power systems, FAA-mandated wind turbine inspection,
              pipeline integrity management requirements. Site security buyers (enterprise and industrial) are a nascent
              segment; budget ownership rests with the physical security or enterprise technology organization. Allied
              nations (29 as of 2024) procure through Foreign Military Sales (FMS), direct commercial sales with export
              licensing (ITAR/EAR), or NATO/FVEY procurement frameworks. Transportation infrastructure owners (DOT,
              state DOTs, port authorities) represent a growing adjacency with bridge inspection, rail monitoring, and
              port security as documented Skydio use cases.
