      - number: '4.2'
        title: GTM Motion and Sales Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              Skydio's go-to-market is predominantly direct-to-government and direct-to-enterprise with
              procurement-vehicle enablement rather than a broad reseller channel. The company sells via GSA schedules
              and state procurement contracts, enabling compliant federal and state-level acquisition without
              per-contract sole-source justification. The Axon partnership for DFR integration creates an indirect
              distribution channel within Axon's existing law-enforcement customer base, extending Skydio's reach into
              agencies already in the Axon ecosystem. Sales cycles for government contracts are long — typically six to
              eighteen months from evaluation to award — which limits CAC measurement to trailing cohorts that are not
              public. No customer acquisition cost, sales payback period, or net revenue retention figures are publicly
              disclosed. Proxy evidence suggests high switching costs: 1,200+ public safety agencies use Skydio with a
              year-over-year doubling, 45 of 51 state transportation departments use the platform, and Skydio describes
              its DFR Command software as deeply integrated into agency dispatch workflows. These indicators imply low
              churn but the NRR figure required to underwrite the software component of the valuation is not available.
