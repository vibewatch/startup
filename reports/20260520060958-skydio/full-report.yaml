      - number: '7.5'
        title: Financial, Safety, and Cybersecurity Risks
        blocks:
          - type: paragraph
            body: >-
              Skydio's financial risk is less about a near-term lack of capital and more about opacity, concentration,
              and the possibility that safety or cyber events could impair high-value government channels. The April
              2026 Series F added $110 million at a reported $4.4 billion valuation, which is a meaningful mitigation
              because it provides fresh funding and external validation, but it does not answer the core underwriting
              questions: gross margin, burn, revenue mix, and agency-level concentration remain undisclosed. Public
              evidence suggests DoD-related channels likely represent the majority of revenue, so a single program
              cancellation or procurement slowdown could create a disproportionate decline. Figure FR002 shows how that
              concentration interacts with battery sanctions, FedRAMP delay, and key-person risk to pressure revenue,
              margins, customer retention, and valuation simultaneously. Cyber posture is a partial offset: SOC 2 Type
              II, FIPS 140-2, and a US-only cloud reduce baseline risk, yet the company's actual FedRAMP status remains
              unconfirmed and therefore cannot be relied on as a commercialization bridge into more sensitive
              deployments. Safety is equally material. No public FAA enforcement action or recall was identified, but an
              autonomy-related injury event would create regulatory, legal, and reputational downside. Finally, lobbying
              has helped create a favorable regulatory backdrop, but criticism that this advantage is policy-driven
              rather than purely product-driven becomes its own reputational and policy risk if the political
              environment turns.
