      - number: '3.2'
        title: Dominant Incumbents — DJI and Autel
        blocks:
          - type: paragraph
            body: >-
              DJI is the structurally most important competitor. By industry consensus, DJI holds approximately 70% of
              global commercial drone market share and has the largest installed base of any drone company in the world,
              including in the US public safety sector prior to the NDAA restrictions. DJI's flagship enterprise
              platform is the Matrice 350 RTK, priced from approximately $6,000 to $8,500 for the base configuration —
              substantially cheaper than the Skydio X10 at approximately $10,000 to $20,000 depending on configuration.
              DJI also offers the Dock 2 automated docking system, directly competing with Skydio Dock. DJI's product
              breadth, global support network, spare-parts availability, and ecosystem of third-party payloads and
              software integrations represent advantages Skydio has not replicated at the same scale. The NDAA
              prohibition on DJI for US federal procurement creates Skydio's core protected channel, but DJI continues
              to operate in US non-federal commercial, state/local (where NDAA does not apply), and all international
              markets. Multiple sources note that DJI is challenging NDAA provisions in Washington and that legal
              challenges to the ban's constitutionality have been contemplated. If the NDAA ban were weakened or
              reversed, Skydio's valuation would be severely impacted given the price and ecosystem gap. Autel Robotics
              is a Chinese-founded competitor offering the EVO Max 4T (thermal and visible sensor suite, approximately
              $7,000-$10,000 per unit) and other platforms. Autel has aggressively marketed itself to US public safety
              as a DJI-independent alternative, but is not currently on the DIU Blue UAS cleared list and faces similar
              NDAA scrutiny as DJI for federally funded procurement. DroneLife noted that Autel's EVO Max 4T offers
              features competitive with Skydio's X10 at a meaningfully lower price point, representing genuine
              competitive pressure in the non-federal enterprise segment.
