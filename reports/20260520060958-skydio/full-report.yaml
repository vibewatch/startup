  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Vertical Map
        blocks:
          - type: paragraph
            body: >-
              Skydio organizes its customer base into five primary verticals: public safety/DFR, defense/national
              security, utilities/energy, site security, and other enterprise (construction, transportation/bridge
              inspection, education, oil and gas). Public safety is the largest and most visible segment, with Skydio
              claiming more than 1,200 agencies operating DFR programs as of late 2024. These range from single-drone
              patrol deployments in smaller agencies to multi-Dock hive networks in large metropolitan departments and
              campus security programs. Within public safety, the Axon Air channel (Axon's branded DFR offering built on
              Skydio X10 and R10) adds a second go-to-market route alongside direct and reseller sales. Defense spans
              every branch of the U.S. military—Army, Air Force, Navy, Marines, Coast Guard, and National Guard—plus 29
              allied nations. The Army is the single largest known military customer by order value; the Air Force is
              the most diversified by mission set (EOD, TACP, base security, ISR). The utilities segment addresses
              power-generation, transmission, and distribution operators running substation monitoring,
              distribution-network inspection, and power-generation surveys; Skydio claims more than 450 utility and
              energy companies in this cohort. Site security—deployed at corporate campuses, data centers, corrections
              facilities, and critical infrastructure—is the newest and smallest named segment, positioned as an
              autonomous alternative to guard patrols. Channel diversity varies by segment: defense flows primarily
              through authorized resellers (ADS—Atlantic Diving Supply—and the DLA's Tailored Logistics Support Special
              Operational Equipment vehicle), public safety through direct sales and the Axon Air partnership, and
              utilities/enterprise through both direct sales and a catalog of procurement vehicles listed on Skydio's
              contracts page.
