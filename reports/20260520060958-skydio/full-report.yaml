            body: >-
              Skydio's public-facing traction metrics are substantial and company-disclosed: 60,000+ drones shipped,
              3.7M customer missions flown, 3,800+ enterprise customers, 1,200+ public safety agencies (doubled
              year-over-year), 450+ utilities, every branch of the US military, 29 allied nations, and 45 of 51 state
              transportation agencies. The company claims hundreds of millions in annual revenue and characterizes
              growth as "hypergrowth" with "strong unit economics." These are CEO disclosures on X and in investor
              interviews — they are company-claimed and have not been independently audited or verified by a third-party
              financial statement. The critical private gaps are: gross margin (not disclosed), ARR from software
              subscriptions (not disclosed), net revenue retention (not disclosed), monthly burn rate (not disclosed),
              and cash on hand after Series F deployment (not disclosed). Revenue per drone can be proxied at
              $10,000–$50,000+ per unit based on enterprise drone industry norms, which at 60,000 units shipped implies
              cumulative hardware revenue of $600M–$3B, but this does not account for per-year cadence, subscription
              attach rate, or service revenue. Without segmented revenue disclosure, the quality, recurrence, and margin
              of the "hundreds of millions" in annual revenue cannot be verified. These gaps constitute fundamental
              diligence blockers for valuation underwriting.
