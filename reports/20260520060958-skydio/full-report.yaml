      - number: '1.2'
        title: Founders, leadership, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Skydio was co-founded in 2014 by Adam Bry and Abe Bachrach, who first met as graduate students at MIT in
              2009 and spent several years pioneering autonomous drone research there. After leaving MIT, both helped
              start Google's Project Wing autonomous delivery program before departing to found Skydio. Adam Bry serves
              as CEO and is the primary public face of the company; his profile includes national champion R/C airplane
              piloting experience, MIT and Olin College degrees, and authorship of numerous technical papers and
              patents. Abe Bachrach serves as CTO and led the MIT autonomous flight research program from 2007; his
              background spans computer vision, machine learning, system architecture, and vehicle design. Key-person
              concentration at the CEO level is notable: Bry is the sole externally recognized founder-CEO driving
              strategy, capital relationships, and government partnership development. The broader executive team as
              publicly listed on the company's about page includes Callan Carpenter (CRO, over 30 years in aerospace and
              engineering software), James LaCamp (CFO, former CFO of Flock Safety and partner at Deloitte), Brendan
              Groves (Chief Legal Officer, former Associate Deputy Attorney General at DOJ and Air Force officer),
              Macario Namie (CMO, 25+ years in enterprise marketing including Cisco and WebEx), Ryan Reading (SVP
              Software Engineering, from Samsara and Cisco Meraki), and Anna Wiesenthal-Birch (SVP People Operations).
              Board composition is not publicly disclosed in full; the company has not filed an S-1 or public
              disclosures that enumerate the board. A National Security Advisory Board is referenced on the official
              website. Leadership changes from the 2024 workforce reduction included the exit of roles associated with
              the consumer product segment, though Skydio has not published a detailed accounting.
