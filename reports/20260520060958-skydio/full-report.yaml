  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Skydio competes across five competitor categories that must be analyzed separately because they represent
              different buyer trade-offs and displacement risks. First, the dominant global incumbent: DJI commands
              approximately 70% of the global commercial drone market by unit volume and dominates the pre-NDAA
              installed base in US public safety and enterprise. Its technology is broadly competitive with or superior
              to Skydio on optics, flight time, and payload — but it is prohibited from US federal government
              procurement by NDAA Section 848 and subsequent provisions, creating Skydio's primary protected channel.
              Second, China-linked alternatives: Autel Robotics is Chinese-founded and marketed as a DJI alternative,
              but also faces NDAA restrictions and is not on the DIU Blue UAS cleared list as of May 2026. Third, direct
              US Blue UAS-cleared peers: Red Cat Holdings (Teal 2, Golden Eagle), Parrot (ANAFI USA), and Freefly
              Systems (Alta Astro) compete in overlapping segments — respectively defense ISR, general enterprise and
              public safety, and inspection and media. None has Skydio's autonomy depth, fleet scale, or dock-and-drone
              offering. Fourth, adjacent defense ISR players: Shield AI's Nova 2 overlaps in GPS-denied indoor
              reconnaissance but is not a direct outdoor autonomous UAS competitor to the X10/X10D. Fifth, status-quo
              substitutes: manned helicopters (public safety aerial surveillance), manual inspection crews (utilities),
              fixed surveillance cameras with guard staffing (site security), and third-party drone service contractors
              each represent the do-nothing alternative Skydio must displace. Understanding all five categories is
              required to assess whether Skydio's differentiation is durable or regulatory in nature.
