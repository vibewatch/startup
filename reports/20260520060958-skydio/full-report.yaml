      - number: '6.4'
        title: Retention, Repeat Procurement, and Durability Proxies
        blocks:
          - type: paragraph
            body: >-
              Skydio does not disclose net revenue retention, gross revenue retention, or churn rates. However, several
              behavioral proxies are visible. Within defense, the most compelling evidence is follow-on procurement
              velocity: the U.S. Air Force EOD program, initiated in November 2025 with an initial multi-million dollar
              award, received a follow-on contract in early 2026 that more than doubled the scope of the original order
              within months—a rapid re-buy that is consistent with high operational satisfaction. The Army's $52M order
              in March 2026 built on the SRR Tranche 2 order placed in 2025, which itself extended the Tranche 1
              relationship from 2022; three consecutive Army orders from a single platform implies genuine operational
              continuity. In public safety, Brookhaven PD's expansion from an initial DFR deployment to eight Docks is
              the clearest named indicator that agencies expand rather than churn. The USAFCENT Dock order notes that
              dock-based capability is "already deployed across hundreds of state and local agencies nationwide,"
              suggesting Dock-deploying agencies reach scale rather than remaining in pilot. The recurring software
              subscription model—DFR Command for public safety, Remote Ops for enterprise—creates contractual renewal
              touchpoints, though contract lengths and renewal rates are not disclosed. The battery rationing episode in
              October 2024, triggered by China's sanctions on Skydio-related components, provides the clearest adverse
              retention signal to date: existing customers were forced to queue for batteries, potentially disrupting
              operational programs and creating a window where competitors could approach constrained agencies. No
              public evidence of elevated churn followed, but the episode establishes a non-trivial supply-chain
              retention risk.
