      - number: '8.3'
        title: Comparable Set and Valuation Framework
        blocks:
          - type: paragraph
            body: >-
              No private drone or defense-autonomy company discloses financials publicly, so the comparable set is
              anchored in public defense drone companies and supplemented by disclosed private round marks where
              available. AeroVironment (AVAV) is the most relevant public benchmark: it generates approximately $1.61
              billion in trailing twelve-month revenue, carries a market capitalization of approximately $8.1 billion as
              of May 2026, and trades at roughly 5.2x EV/Revenue and 4.3x Price/Sales. AeroVironment is audited,
              profitable on an EBITDA basis, and carries a known gross margin structure — all advantages that Skydio
              lacks in a public evidence context. Red Cat Holdings (RCAT) is a smaller NDAA-aligned public drone company
              with a market capitalization of approximately $420 million; it is not directly comparable given its stage
              and scale, but it illustrates that the public market for small defense drone equities can be volatile.
              Joby Aviation (JOBY) carries a market cap of approximately $9.8 billion as a pre-revenue eVTOL company
              with a defense-adjacent thesis, illustrating that capital markets will award premium multiples to
              companies with durable regulatory and technical moats even without near-term profitability. In the private
              market, Shield AI was reportedly valued at approximately $2.7 billion in a 2023 round (defense AI
              autonomy, software-primary), and Anduril Industries achieved an approximately $18 billion valuation in a
              2024 round (broader defense AI platform). Skydio at $4.4 billion sits between Shield AI and Anduril on the
              private defense-AI spectrum but includes substantial hardware revenue that typically compresses multiples.
              Skydio's implied EV/Revenue at $4.4 billion against a "hundreds of millions" revenue claim (interpreted as
              $220–440 million) implies a 10–20x multiple — a material premium to the AVAV comparable. That premium is
              defensible only if the software layer is large enough (ARR ≥ 40% of total revenue), the growth rate is
              sustainably high (≥50% YoY), and gross margin is above 50%. None of these can be confirmed from public
              sources. Figure FV002 shows valuation sensitivity to revenue and multiple assumptions. Figure FV003
              illustrates the return range under bull, base, and bear scenarios.
            claimRefs:
