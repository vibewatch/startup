      - number: '5.2'
        title: Autonomy Stack, Sensor Design, and Technical Architecture
        blocks:
          - type: paragraph
            body: >-
              Skydio's core technical differentiator is its proprietary AI autonomy stack running on an NVIDIA Jetson
              Orin system-on-chip backed by a secondary Qualcomm Snapdragon 865 SoC for payload processing. The Jetson
              Orin delivers 10 times the compute of the prior Skydio generation, enabling real-time 3D environment
              reconstruction from six custom-designed omnidirectional navigation cameras that provide true 360-degree
              obstacle avoidance coverage. The navigation cameras use both visible-light and infrared illuminators for
              NightSense mode, making X10 and R10 the company's claimed sole drones capable of fully autonomous flight
              in zero-light conditions. Visual-inertial odometry (VIO) provides GPS-independent hover accuracy of ±10
              cm, critical for GPS-denied or GPS-spoofing environments. The Spatial AI Engine module generates
              on-vehicle 2D maps and 3D models in real time for the 3D Scan inspection workflow. Skydio Shadow is the
              object-tracking module, maintaining lock on persons or vehicles even through brief occlusions. Skydio
              Scout enables autonomous convoy overwatch — the drone autonomously holds a configurable position relative
              to a moving ground unit. Connectivity is managed by Skydio Connect, a layered suite combining Connect SL
              (Wi-Fi 6 point-to-point, up to 7.5 miles line-of-sight, 12 km range in rural/weak-interference conditions)
              and Connect 5G (LTE/5G cellular with Skydio-provisioned or operator-supplied SIMs). Connect Fusion
              automatically blends both channels for maximum throughput and resilience. The Skydio Dock integrates a
              Trusted Platform Module (TPM) for hardware key storage and an AES-256 encrypted SkydioLink radio. All
              software and firmware updates are digitally signed. Custom-engineered lenses (the off-the-shelf components
              "couldn't deliver the image quality" per the official product page) use a compact transition zoom system
              and wide apertures (f/1.8 and f/2.2) that capture 1.7–3.5× more light than competitor units. The X10
              integrates the Teledyne FLIR Boson+ thermal sensor — claimed first-ever drone integration — at 640×512
              resolution with <30 mK sensitivity, 40% more sensitive than comparable units per Skydio's official product
              page.
