  - id: TM004
    title: Growth Drivers and Adoption Constraints Table
    description: >-
      Key forces driving and constraining Skydio's market growth, with direction, timing, valuation relevance, and
      diligence asks.
    columns:
      - driver / constraint
      - direction
      - timing
      - implication for adoption
      - diligence ask
    rows:
      - - NDAA Chinese drone restriction (Section 848 and successors)
        - Driver — structural
        - Active now; annual NDAA renewal required
        - >-
          Mandates domestic procurement for federal agencies; accelerates DJI-to-Skydio transitions in state/local
          markets
        - Track NDAA renewal each fiscal year; monitor DJI lobbying and any amendment attempts
      - - Blue UAS DIU cleared list (procurement acceleration)
        - Driver — structural
        - Active now; list updated quarterly by DIU
        - >-
          Reduces federal procurement cycle from 12-24 months to 3-6 months for cleared platforms; creates first-mover
          advantage for existing list members
        - Verify Skydio maintains active clearance for all current and future platforms; monitor list changes
      - - FAA BVLOS regulatory liberalization (DFR programs)
        - Driver — conditional
        - Waiver-by-waiver now; broader rulemaking 2024-2026
        - Unlocks full autonomous DFR deployment; without BVLOS, DFR requires on-site pilot, eliminating economic case
        - Monitor FAA DFR NPRM and waiver grant rates; delays or restrictions would cap DFR program growth
      - - DoD Replicator initiative and autonomous sUAS demand
        - Driver — near-term
        - FY2024-2026 initial tranches
        - Explicit DoD budget for autonomous attritable drones; Skydio positioned as Blue UAS-cleared domestic supplier
        - Confirm Skydio has active contracts or opportunities in Replicator procurement; quantify revenue backlog
      - - AI/autonomy ROI — reduced pilot requirement and cost/flight
        - Driver — ongoing
        - Compounding over 2024-2030
        - >-
          Expands deployable operator base; reduces cost per mission hour; supports enterprise and utility adoption at
          scale
        - Quantify actual cost per flight hour for Skydio vs. helicopter/manned crew; gather customer ROI case studies
      - - China battery/component sanctions (October 2024 event)
        - Constraint — adverse
        - Active; supply chain recovery ongoing in 2026
        - >-
          Created delivery backlog and battery rationing; demonstrates hardware supply chain dependence despite US
          assembly positioning
        - >-
          Assess battery supply chain diversification progress; quantify customer attrition from 2024 delivery
          disruption
      - - Capital intensity — Dock infrastructure and deployment cost
        - Constraint — ongoing
        - Persistent; partly offset by falling hardware costs over time
        - Limits adoption velocity for smaller agencies; $50-200K+ per Dock site requires meaningful capital commitment
        - >-
          Quantify average Dock site deployment cost; assess whether Skydio offers financing or lease options to lower
          barrier
      - - NDAA legal/political rollback risk
        - Constraint — tail risk
        - Ongoing risk; could crystallize if DJI pursues legal challenge or Congressional amendment
        - Potentially eliminates primary structural moat if Chinese drones regain access to US federal procurement
        - Monitor DJI lobbying disclosures (FARA), Congressional actions, and any court challenges to NDAA Section 848
