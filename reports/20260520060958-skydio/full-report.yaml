      - number: '4.5'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Skydio closed a $110M Series F in April 2026 at a $4.4B post-money valuation, led by existing investors.
              The raise was oversubscribed; CEO Adam Bry declined to take more capital, framing declining capital needs
              as the most significant fact of the round. This signal is interpreted by analysts as either a vote of
              confidence in approaching self-sufficiency or as evidence that new external investors were unwilling to
              invest at $4.4B. Total equity capital raised through 2026 is approximately $672M. Hercules Capital
              participated in the February 2023 Series E round, which in combination with Hercules's known venture
              lending model suggests a credit facility or venture debt component alongside the Series E equity, though
              the debt terms have not been publicly disclosed. The SEC Form D filed March 6, 2023 confirms the $230M
              Series E as an exempt equity offering. No IPO filing has been made public as of May 2026. The SkyForge
              $3.5B manufacturing commitment creates a forward capital obligation that is approximately 5× the total
              equity raised; whether this is funded through revenue, government grants, debt, or future equity rounds is
              not disclosed. The absence of cash on hand, burn rate, and runway data from any public filing prevents an
              independent assessment of capital adequacy; the April 2026 raise size ($110M) is consistent with an 8–18
              month runway depending on assumed burn, not a multi-year buffer. The next-round trigger is most likely a
              combination of SkyForge construction milestones and working-capital needs as the defense contract backlog
              scales.
