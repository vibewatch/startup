      - number: '3.5'
        title: Moat Durability, Switching Costs, and Competitive Risks
        blocks:
          - type: paragraph
            body: >-
              Skydio's competitive moat rests on three overlapping pillars: regulatory protection (NDAA/Blue UAS),
              autonomy differentiation, and ecosystem lock-in. Each is real but has meaningful vulnerabilities. The
              regulatory moat has been explicitly criticized as a lobbying-driven construction rather than a
              technology-based competitive advantage. DroneXL and Axios both reported in 2024 that Skydio employed
              lobbyists and company executives to advocate for NDAA provisions that would restrict Chinese drone
              manufacturers — creating the market conditions that benefit Skydio commercially. This criticism does not
              invalidate the moat, but it means the moat is politically contingent: administration changes, legal
              challenges, or bilateral trade negotiations could weaken NDAA provisions, restoring DJI's access to
              federal markets. Autonomy differentiation — Skydio's AI-driven obstacle avoidance, autonomous tracking,
              and dock-and-drone mission execution — is genuine and currently unmatched among Blue UAS peers. However,
              DJI's global R&D scale (estimated 10,000+ engineers) means it can close capability gaps rapidly if the
              regulatory environment changes. Multi-homing across Blue UAS vendors is common: public safety agencies can
              and do procure from multiple approved vendors simultaneously, limiting Skydio's ability to claim exclusive
              accounts. Switching costs are non-trivial but not prohibitive: Skydio's DFR Command software, Connect
              fleet management, and proprietary dock integration create workflow dependencies, but competing platforms
              can be added alongside Skydio without full displacement. The October 2024 China battery sanctions exposed
              a critical supply chain vulnerability — Skydio's battery supply depended on Chinese components even while
              marketing itself as a fully domestic manufacturer. This contradiction was publicly acknowledged by Skydio,
              undermining a key differentiation claim. Finally, commoditization pressure is real: as more US
              manufacturers gain Blue UAS clearance, the regulatory moat becomes less exclusive, and Skydio must rely
              more heavily on product differentiation and switching costs to defend its installed base.
            claimRefs:
              - CP012
              - CP013
              - CP014
              - CP015
              - CP026
              - CP027
