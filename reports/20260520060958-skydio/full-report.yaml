      - number: '5.6'
        title: Technical Risks, Dependencies, and Open Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Skydio's product and technology profile carries several material technical risks. The most immediate is
              the battery supply chain: China's October 2024 export controls on drone-related materials forced Skydio to
              ration batteries to existing customers, representing a direct operational disruption to its largest
              installed base. Skydio relies on high-performance lithium-ion cells sourced in part from supply chains
              exposed to Chinese export restrictions, and the SkyForge manufacturing commitment does not necessarily
              resolve the upstream battery-cell dependency. Second, the reliability dashboard discloses persistent
              thin-obstacle detection failures as the largest technical-factor incident driver; vision-based navigation
              is explicitly acknowledged as imperfect, and Skydio notes that software improvements addressing this were
              planned but not yet shipped as of the report date. Third, BVLOS remote operations depend on commercial
              cellular (5G/LTE) availability from third-party carriers; network outages or coverage gaps could render
              Dock-based DFR inoperative. Fourth, the NVIDIA Jetson Orin and Qualcomm Snapdragon SoCs represent
              dependencies on U.S.-designed but globally manufactured silicon; any restriction on supply or export of
              these chips would directly impact production. Fifth, regulatory dependencies include ongoing FAA BVLOS
              approval processes; changes in FAA policy or state-level drone ordinances could constrain market access.
              Sixth, the competitive moat partly depends on continuation of Chinese-drone procurement restrictions;
              reversal of NDAA drone provisions could allow DJI re-entry into U.S. government markets. Private
              information gaps include: actual gross margin on hardware versus software, manufacturing yield rates at
              Hayward, BVLOS waiver acceptance rate in the Skydio Regulatory Services pipeline, and whether the F10
              fixed-wing platform is commercially available or still in development.
            claimRefs:
              - CE041
              - CE042
              - CE043
              - CE044
              - CE045
      - number: '5.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Autonomy Stack as Durable Technical Moat
            body: >-
              Skydio's AI autonomy stack — VIO-based GPS-denied navigation, NightSense zero-light autonomous flight, and
              360-degree obstacle avoidance on an NVIDIA Jetson Orin — represents genuine multi-year R&D depth that
              Chinese-manufactured competitors cannot legally offer to U.S. federal agencies. Combined with Blue
              UAS/NDAA compliance, this creates a structural procurement advantage that persists as long as federal
              drone-procurement restrictions remain in force.
            calloutType: strength
            claimRefs:
              - CE029
              - CE030
              - CE031
          - type: callout
            title: Battery Supply Chain Remains Unresolved Critical Risk
            body: >-
              China's October 2024 export controls forced Skydio to ration batteries to its entire installed base — a
              direct product delivery failure. The SkyForge manufacturing commitment does not guarantee resolution of
              the upstream battery-cell dependency. Until a U.S.-manufactured or allied-nation high-performance LiPo
              cell source is qualified, this remains the single largest product-continuity risk in the portfolio.
            calloutType: risk
            claimRefs:
              - CE041
              - CE044
          - type: callout
            title: Thin-Obstacle Detection and Reliability Transparency
            body: >-
              Skydio's public reliability dashboard acknowledges that thin-obstacle detection failures (power lines,
              cables) are the largest technical-factor incident driver. The company has stated that software fixes are
              planned but not shipped as of May 2026. Operators in power-line inspection and infrastructure environments
              face elevated crash risk, and the open disclosure — while commendable for transparency — constitutes an
              adverse signal for mission-critical deployments.
