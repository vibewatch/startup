            Defense drone market projected $30B+ by 2030; NDAA-driven domestic demand accelerating; public safety DFR
            adoption increasing rapidly
        - label: Product-Market Fit & Proof
          value: Strong
          context: >-
            60,000+ drones deployed; $52M Army order; Air Force EOD; USAFCENT dock; 1,200+ public safety agencies
            confirmed from primary sources
        - label: Regulatory Moat
          value: Moderate-Strong
          context: >-
            Blue UAS status confirmed; DCMA transition adds uncertainty; moat is policy-dependent and reversible without
            product recourse
        - label: Competitive Positioning
          value: Moderate
          context: >-
            Autonomy advantage confirmed; DJI banned; however Shield AI and Anduril well-funded; defense primes can
            replicate over 24–36 months with acquisitions
        - label: Financial Profile
          value: Weak (Unverified)
          context: >-
            Revenue claim (hundreds of millions) is company-stated and unaudited; gross margin, ARR, NRR, and burn are
            undisclosed — all blocking for underwriting
        - label: Risk-Adjusted View
          value: High Risk
          context: >-
            Battery supply shock (Oct 2024), workforce reduction (~25%), DoD concentration, SkyForge capex overhang, and
            Blue UAS policy risk are four simultaneous material risks
        - label: Valuation vs. Evidence
          value: Stretched
          context: >-
            10–20x implied EV/Revenue vs. AVAV at 5.2x; premium requires confirmed software mix, growth, and margin that
            cannot be validated from public sources
