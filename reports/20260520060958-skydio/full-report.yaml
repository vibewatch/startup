      - number: '4.3'
        title: Cost Structure, Manufacturing, and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              Skydio's cost structure reflects a domestic-manufacturing premium relative to Chinese competitors. All
              products are designed and assembled at the Hayward, California facility, which the company describes as
              producing drones "faster than it can hire to match demand" as of April 2026. Domestic manufacturing incurs
              higher labor costs, domestic component sourcing costs, and facility-related capex compared to DJI's
              offshore production model. The battery supply chain disruption of October 2024 exposed a specific
              cost-structure dependency: Skydio had not yet onshored battery supply when China sanctioned the company,
              forcing one-battery-per-drone rationing. This episode illustrates how non-domestic components in the
              supply chain create both cost variability and customer-delivery risk. The $3.5B SkyForge domestic
              manufacturing commitment over five years — announced the day after the Series F — represents a material
              capex obligation: at $700M per year average, it would require revenue generation or external capital that
              significantly exceeds the $110M Series F raise. More than $1B is directed to US-based domestic suppliers.
              The 2024 workforce reduction of approximately 25% was a cost-structure pivot away from consumer-segment
              employees toward higher-margin government verticals. Gross margin by segment remains undisclosed;
              hardware-driven businesses with domestic manufacturing typically carry gross margins of 30–50%, while
              software subscriptions can reach 70–80%, but without Skydio-specific disclosure these are industry-proxy
              estimates only.
