  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Line, SKU Map, and Solution Matrix
        blocks:
          - type: paragraph
            body: >-
              Skydio's commercial product family as of May 2026 comprises five distinct hardware configurations plus
              associated software platforms. The Skydio X10 is the civil and commercial flagship quadrotor launched in
              September 2023: it weighs 4.65 lbs (2.11 kg), flies for up to 40 minutes at a max speed of 45 mph, deploys
              in under 40 seconds, and carries modular sensor packages including the VT300-Z (64 MP narrow, 48 MP
              telephoto, 640×512 radiometric thermal), the VT300-L (64 MP narrow, 50 MP 1-inch wide, thermal, and
              integrated flashlight), and the V100-L (visual only). The Skydio X10D is the defense-variant airframe with
              the same physical dimensions and sensor architecture but additional hardening for electronic-warfare
              environments, GPS-denied navigation, and STANAG 4609 KLV telemetry for ATAK integration. The Skydio R10 is
              a second platform variant described as resilient for tactical public safety and indoor DFR operations; it
              was announced in January 2024 and is listed on the Blue UAS cleared list for government procurement. The
              Skydio F10 is a fixed-wing long-endurance platform listed on the product page but with limited public
              specifications as of the report date. The Skydio Dock for X10 is a weatherproof autonomous docking and
              charging station that launches X10 missions in under 20 seconds, supports 24/7 operations via remote ops
              software, and integrates environmental sensors (ADS-B, weather, GPS) for BVLOS airspace awareness.
              Software platforms include DFR Command (cloud-based dispatch and fleet management for public safety Drone
              as First Responder programs), Remote Ops (enterprise remote fleet management accessible from any browser),
              and 3D Scan (autonomous photogrammetry and mapping). The Skydio Extend integration layer provides open
              APIs, webhooks, and an integrations catalog for third-party connections including Axon Air, RapidSOS, CAD
              systems, ATAK, Pix4D, Bentley iTwin, DroneDeploy, and ESRI SiteScan.
