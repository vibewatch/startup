      - number: '7.3'
        title: Partner and Dependency Risks
        blocks:
          - type: paragraph
            body: >-
              Skydio's dependency profile is tighter than the top-line narrative of domestic manufacturing leadership
              suggests. Before sanctions, the battery cell supply appears to have been effectively sole-sourced from a
              China-based manufacturer, and that single dependency proved powerful enough to impair deliveries across
              the installed base. Federal channel dependence is also high: continued Blue UAS status is a gating
              condition for many defense and homeland-security purchases, so any DCMA-administered compliance issue
              could impair procurement access even if underlying product quality remains intact. Figure FR003 maps the
              rest of the dependency web, including AWS as the cloud backbone for US-only deployments, the FAA as the
              authority governing waivers and autonomous operating envelopes, prime contractors such as SAIC and Leidos
              for classified access, and capital providers that fund the domestic manufacturing push. Revenue
              concentration magnifies all of these links. Public contract disclosures from the Army, Air Force, and
              other federal channels imply that DoD and adjacent agencies likely account for the majority of revenue,
              meaning a single policy shift, budget cut, or contractor-channel loss could ripple quickly into shipments,
              renewals, and valuation. Table TR003 therefore treats dependency risk as structural rather than
              incidental.
            claimRefs:
