      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Regulatory Moat Is Primarily Political, Not Technical
            body: >-
              Skydio's dominant position in US federal drone procurement depends on NDAA provisions that restrict
              Chinese-manufactured drones. Multiple independent sources — including DroneXL and Axios — characterized
              Skydio's lobbying efforts as the primary driver of these restrictions, not Skydio's product superiority
              alone. If NDAA provisions are weakened through legal challenge, executive action, or trade negotiation,
              DJI could re-enter the federal market with a significantly lower-cost, more feature-rich platform.
              Investors should treat the regulatory moat as a necessary condition for Skydio's current valuation, not a
              sufficient one.
            calloutType: risk
            claimRefs:
              - CP013
              - CP014
              - CP033
          - type: callout
            title: Battery Supply Chain Contradicts Domestic Manufacturing Narrative
            body: >-
              Skydio markets itself as the US domestic manufacturing leader and uses this as a differentiation against
              DJI and Autel. However, the October 2024 China battery sanctions revealed that Skydio's battery supply
              depended on Chinese components, forcing temporary customer rationing. This contradiction was acknowledged
              by Skydio itself. Competitors like Red Cat (Utah) and Freefly (Colorado) do not face the same battery
              supply chain criticism. The gap between Skydio's domestic manufacturing marketing and its actual supply
              chain is a material credibility risk.
            calloutType: risk
            claimRefs:
              - CP015
          - type: callout
            title: Autonomy Depth Is the Only Durable Moat — If It Holds
            body: >-
              Among all competitive dimensions, Skydio's AI-driven autonomous obstacle avoidance, autonomous tracking,
              and dock-and-drone mission execution represent a genuinely unmatched capability among current Blue
              UAS-cleared competitors. No direct Blue UAS peer offers an equivalent dock-and-drone zero-on-site
              operations system at commercial scale. This is Skydio's only durable moat that is independent of
              regulatory politics. The risk is DJI's R&D scale: with an estimated 10,000+ engineers, DJI could close the
              gap rapidly if regulatory barriers fell.
            calloutType: insight
            claimRefs:
              - CP024
              - CP025
              - CP040
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Pricing Model, and Recognition
        blocks:
          - type: paragraph
            body: >-
              Skydio generates revenue across four primary streams: (1) hardware drone sales of the X10, X10D, R10, and
              F10 product family, (2) dock and autonomous-infrastructure systems including the Dock for X10 enabling
              unmanned DFR deployments, (3) software subscriptions led by DFR Command (public safety) and Remote
              Ops/Flight Deck (enterprise), and (4) government services, training, and integration support. The company
              positions itself explicitly as a hardware-plus-software platform where recurring software revenue layers
              on top of hardware contract wins, a model consistent with its stated "strong unit economics." No list
              prices for any X10, X10D, R10, or F10 drone model are publicly disclosed; all enterprise and government
              sales flow through GSA schedule contracts, state procurement vehicles, or direct negotiated defense
              contracts. DFR Command is described as the cloud-based command platform for Drone as First Responder
              programs but its subscription price is not posted publicly. Revenue recognition for large government
              contracts (e.g., the $52M U.S. Army X10D order) follows FAR milestone-delivery schedules rather than
              ratable recognition, creating potential for lumpy quarterly reporting. Software subscriptions, if ratable,
              would smooth the government hardware cycle but the split between hardware, software, and services revenue
              is not publicly disclosed.
