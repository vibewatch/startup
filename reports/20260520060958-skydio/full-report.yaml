      - number: '4.6'
        title: Financial Verdict — Revenue Quality, Margin Path, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Skydio's financial profile presents a credible revenue growth story anchored in large, visible US
              government contracts and a rapidly expanding public safety agency footprint, but the absence of audited
              financials, gross margin, ARR, NRR, and burn data makes independent valuation underwriting impossible from
              public sources alone. The $4.4B valuation implies 10–20× trailing revenue (per DroneXL analysis) — a
              defensible multiple for a defense-tech AI hardware company with a regulatory moat, but not one that can be
              confirmed without access to the income statement. Revenue quality is high on the government-contract side
              (multi-year, competitive-moat protected, mission-critical) but potentially lumpy due to procurement timing
              and milestone-based recognition. The hardware-to-software revenue mix is unknown; if software is a small
              share of "hundreds of millions," the implied SaaS multiple is even higher and even less defensible. The
              $3.5B SkyForge commitment is a directional signal of confidence but also a capital- intensity risk: it
              requires Skydio to generate sufficient operating cash flow or access external capital far in excess of the
              Series F to execute. The 2024 workforce reduction and battery rationing are adverse datapoints that
              demonstrate operational fragility; they are not existential, but they suggest the margin profile has not
              been stable. The critical diligence blockers are: (1) audited gross margin by segment, (2) ARR and NRR on
              software subscriptions, (3) burn rate and cash runway, (4) Hercules Capital debt terms, and (5) SkyForge
              capex schedule and funding mechanism. Without these, investors transacting at $4.4B are relying on
              management narrative and proxy metrics, not verified financial performance.
            claimRefs:
              - CI034
              - CI035
              - CI036
              - CI037
              - CI038
              - CI039
      - number: '4.7'
        title: Exhibits
        blocks:
          - type: callout
            title: Battery Supply Chain Exposes Cost and Delivery Fragility
            body: >-
              The October 2024 China sanctions and resulting battery rationing demonstrate that a single sanctioned
              component can translate immediately into customer delivery failures and reputational damage. Although new
              domestic battery sources were targeted for spring 2025, the April 2026 Series F materials do not confirm
              full supply-chain onshoring. Cost increases from domestic battery sourcing, if material, would compress an
              already-undisclosed hardware gross margin. This risk is categorically different from a software-only
              company and warrants supply-chain due diligence as a diligence blocker.
            calloutType: risk
            claimRefs:
              - CI026
              - CI027
              - CI039
          - type: callout
            title: $4.4B Valuation Cannot Be Independently Verified from Public Sources
            body: >-
              At an implied 10–20× trailing revenue multiple (DroneXL analysis), the $4.4B valuation is range-consistent
              with defense-tech AI hardware peers if Skydio's gross margins are above 40% and its NRR exceeds 110%.
              However, both margin and NRR are undisclosed. Investors accepting the valuation at face value are relying
              on CEO narrative, not audited financials. Any investor transacting at this price should treat the five
              diligence blockers identified in Table TI005 as conditions of closing, not optional items.
            calloutType: assumption
            claimRefs:
              - CI034
              - CI037
          - type: callout
            title: CEO Declining Capital Is a Positive Signal, but Modest in Context
            body: >-
              Adam Bry's decision to decline additional investor capital despite oversubscription is a credible
              operating-leverage signal consistent with approaching free-cash-flow breakeven. However, the $110M Series
              F is modest relative to the $3.5B SkyForge capex commitment; the CEO's framing of "rapidly decreasing
              capital needs" for operating expenses does not necessarily mean SkyForge capex is self-funded. Investors
              should distinguish between operational-cost self-sufficiency (plausible based on the signal) and full
              capex self-sufficiency (not supported by the raise size alone).
            calloutType: insight
            claimRefs:
              - CI010
              - CI024
