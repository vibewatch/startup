      - number: '7.4'
        title: People and Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Execution risk is elevated because Skydio is attempting to reorient the business toward defense and
              domestic manufacturing while simultaneously recovering from a workforce shock and preserving founder-led
              technical credibility. Adam Bry and Abe Bachrach remain central to external trust, autonomy vision, and
              defense-ecosystem relationships, so leadership continuity matters disproportionately compared with a
              mature public defense prime that can absorb executive turnover. The fall 2024 workforce reduction of
              roughly 25% appears to have refocused the company on defense, but layoffs can also remove tacit
              engineering knowledge, reduce morale, and create perception risk for recruits and customers. Cleared
              engineering talent is a separate bottleneck: building secure autonomy, manufacturing, and
              government-delivery capabilities requires personnel who can operate inside a narrow skill market, and
              public disclosures do not confirm the scale or pace of clearance sponsorship. The domestic manufacturing
              ambition compounds the challenge. A $3.5 billion buildout over five years is strategically powerful if
              executed, but it also raises questions about whether operations and supply-chain leadership depth are
              sufficient for a production ramp that is much harder than a software-led growth story. Table TR004 frames
              these risks around key-person concentration, layoffs, hiring scarcity, and scale-up leadership gaps.
            claimRefs:
