      - number: '8.5'
        title: Exit Readiness, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is constrained by Skydio's private structure, classification of some defense programs, and
              the absence of audited financials. An IPO at the current $4.4 billion valuation would require demonstrated
              gross margin expansion, a clearly articulated ARR trajectory, and resolution of supply-chain risks to
              satisfy public market scrutiny — the SEC's 10-K disclosure requirements would compel financial
              transparency that Skydio currently avoids. Strategic M&A by a defense prime (L3Harris, RTX, Northrop) is a
              plausible exit path, but NDAA restrictions on Chinese-component suppliers and CFIUS review would require
              clear supply chain documentation. A secondary sale to a sovereign wealth fund or PE buyer at the current
              price is possible but would face the same due diligence requirements. The thesis-break triggers in Table
              TV005 define the specific events that would prompt an exit or fundamental reassessment: Blue UAS list
              status change, battery supply recurrence, DoD procurement contraction exceeding 20%, disclosed gross
              margin below 25%, or audited revenue materially below the "hundreds of millions" claim. Final diligence
              asks in Table TV006 identify the seven specific pieces of evidence that would move the recommendation from
              Track to Buy. Until those are resolved — particularly gross margin, ARR, battery supplier identity, and
              cap table structure — the evidence base does not support a buy decision at $4.4 billion. The KPI scorecard
              in Figure FV004 summarizes the investment committee-ready scoring across all evaluated dimensions.
