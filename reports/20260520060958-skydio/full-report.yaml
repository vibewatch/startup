      - number: '3.4'
        title: Substitutes, Status-Quo, and Adjacent Alternatives
        blocks:
          - type: paragraph
            body: >-
              Status-quo substitutes are the competitive baseline that Skydio must displace to grow. Manned helicopters
              remain the dominant tool for aerial surveillance in public safety, costing approximately $500 to $1,500
              per flight hour — compared to $20 to $80 per hour for autonomous drone operations. The cost differential
              is compelling in ROI analysis, but switching requires capital investment, pilot retraining, FAA
              authorization for BVLOS operations, and organizational change management that slows adoption. Manual
              inspection crews for utility assets — power lines, pipelines, wind turbines — cost approximately $150,000
              to $500,000 per annual inspection cycle per asset class, versus a fraction of that cost with drone
              programs. Fixed surveillance cameras combined with contract security staffing are the primary status-quo
              for perimeter monitoring, and the dock-and-drone model must displace this at a cost-per-event that
              justifies the capital and software subscription expense. Third-party drone service contractors
              (drone-as-a-service operators) provide an alternative to in-house drone deployment that some buyers
              prefer; they can select any platform — including DJI-based ones for non-federal accounts — which limits
              Skydio's ability to capture the full market. Shield AI's Nova 2 is an adjacent ISR platform focused on
              GPS-denied indoor reconnaissance for military and law enforcement entry operations — overlapping in the
              defense segment but not directly competing with the outdoor autonomous flight and inspection missions of
              the Skydio X10/X10D. AgEagle Aerial Systems focuses on fixed-wing mapping, agriculture, and precision
              agriculture — adjacent to Skydio but serving different buyers and workflows. Internal build and system
              integrator alternatives exist for DoD programs, where prime contractors (L3Harris, Textron, AeroVironment)
              propose integrating their own sUAS solutions into broader platform programs; this path competes with
              Skydio primarily in large-scale government procurement.
            claimRefs:
              - CP016
              - CP017
              - CP018
              - CP021
