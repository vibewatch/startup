company:
  name: Skydio
chapter:
  number: 4
  title: Financials
  summary: >-
    Skydio claims hundreds of millions in annual revenue as of its April 2026 Series F closing,
    with four revenue streams — hardware drone sales, dock/autonomous-infrastructure systems,
    software subscriptions, and government services — but no audited figures or gross margin data
    are publicly available. The company's $4.4B valuation implies a 10–20× trailing revenue
    multiple that cannot be independently verified. Critical private metrics (gross margin, ARR,
    burn rate, NRR) remain undisclosed, making full underwriting impossible from public sources.
    The $3.5B SkyForge manufacturing commitment adds a multi-year capital-intensity obligation
    that may require sustained revenue growth, debt, or future equity to fund alongside operating
    costs. Key adverse signals — October 2024 China-sanctions battery rationing and a 2024
    workforce reduction — indicate operational fragility that the April 2026 fundraise has not
    fully resolved.

sections:
  - id: revenue-streams-and-pricing
    title: Revenue Streams, Pricing Model, and Recognition
    body: >-
      Skydio generates revenue across four primary streams: (1) hardware drone sales of the X10,
      X10D, R10, and F10 product family, (2) dock and autonomous-infrastructure systems including
      the Dock for X10 enabling unmanned DFR deployments, (3) software subscriptions led by DFR
      Command (public safety) and Remote Ops/Flight Deck (enterprise), and (4) government
      services, training, and integration support. The company positions itself explicitly as a
      hardware-plus-software platform where recurring software revenue layers on top of hardware
      contract wins, a model consistent with its stated "strong unit economics." No list prices
      for any X10, X10D, R10, or F10 drone model are publicly disclosed; all enterprise and
      government sales flow through GSA schedule contracts, state procurement vehicles, or direct
      negotiated defense contracts. DFR Command is described as the cloud-based command platform
      for Drone as First Responder programs but its subscription price is not posted publicly.
      Revenue recognition for large government contracts (e.g., the $52M U.S. Army X10D order)
      follows FAR milestone-delivery schedules rather than ratable recognition, creating potential
      for lumpy quarterly reporting. Software subscriptions, if ratable, would smooth the
      government hardware cycle but the split between hardware, software, and services revenue
      is not publicly disclosed.
