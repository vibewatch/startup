  - id: TI005
    title: Public Financial Gaps Table
    notes: >-
      Each gap reflects information that is material to financial underwriting but was not
      found in any public source reviewed through 2026-05-20. Severity ratings represent
      diligence priority, not probability of adverse outcome.
    columns:
      - Missing Metric
      - Why It Matters for Underwriting
      - Impact on $4.4B Valuation Judgment
      - Exact Diligence Path
    rows:
      - - Audited gross margin by segment
        - Determines whether hardware is margin-accretive or subsidized by software; critical for LTV model
        - Cannot compute forward revenue multiples without margin; 10–20x could be justified or unjustifiable
        - Request audited income statement from CFO James LaCamp; segment P&L by hardware / software / services
      - - ARR and ARR growth rate
        - Software ARR is the recurring-revenue foundation of the valuation; "hundreds of millions" total revenue may be hardware-dominated
        - If ARR is <$50M, the implied SaaS multiple at $4.4B is extreme; if ARR >$200M, multiple is defensible
        - Data room ARR schedule; monthly ARR cohort since 2022
      - - Net revenue retention (NRR)
        - Indicates expansion vs. churn within existing 1,200+ agency and 3,800+ enterprise customer base
        - High NRR (>120%) is a primary value-creation driver; low NRR (<100%) is a red flag at this valuation
        - CRM/billing system export; NRR by segment; churn analysis by cohort
      - - Monthly burn rate and cash runway
        - Determines actual capital adequacy; $110M Series F is small relative to $3.5B SkyForge commitment
        - If burn is >$14M/month, runway may be <8 months and next round is imminent
        - Bank statements; monthly P&L; CFO cash-flow bridge since Series E
      - - Hercules Capital debt terms and covenants
        - Venture debt carries covenants, warrants, and maturity risk; terms may constrain equity distributions
        - Material off-balance-sheet risk if covenants conflict with revenue ramp or SkyForge investment
        - Full credit agreement; covenant schedule; warrant coverage; maturity date
      - - SkyForge capex schedule and funding mechanism
        - $3.5B over 5 years may require new equity, debt, or revenue generation well beyond $672M total prior raise
        - If capex-funded by revenue, validates self-sufficiency narrative; if debt-funded, changes leverage profile
        - Board-approved capital expenditure plan; manufacturing buildout timeline; financing commitments
    claimRefs:
      - CI029
      - CI030
      - CI031
      - CI032
      - CI033
      - CI036
      - CI037

