callouts:
  - calloutType: risk
    title: Battery Supply Chain Exposes Cost and Delivery Fragility
    body: >-
      The October 2024 China sanctions and resulting battery rationing demonstrate that a
      single sanctioned component can translate immediately into customer delivery failures
      and reputational damage. Although new domestic battery sources were targeted for
      spring 2025, the April 2026 Series F materials do not confirm full supply-chain
      onshoring. Cost increases from domestic battery sourcing, if material, would compress
      an already-undisclosed hardware gross margin. This risk is categorically different from
      a software-only company and warrants supply-chain due diligence as a diligence blocker.
    claimRefs:
      - CI026
      - CI027
      - CI039

  - calloutType: assumption
    title: $4.4B Valuation Cannot Be Independently Verified from Public Sources
    body: >-
      At an implied 10–20× trailing revenue multiple (DroneXL analysis), the $4.4B valuation
      is range-consistent with defense-tech AI hardware peers if Skydio's gross margins are
      above 40% and its NRR exceeds 110%. However, both margin and NRR are undisclosed.
      Investors accepting the valuation at face value are relying on CEO narrative, not audited
      financials. Any investor transacting at this price should treat the five diligence
      blockers identified in Table TI005 as conditions of closing, not optional items.
    claimRefs:
      - CI034
      - CI037

  - calloutType: insight
    title: CEO Declining Capital Is a Positive Signal, but Modest in Context
    body: >-
      Adam Bry's decision to decline additional investor capital despite oversubscription is a
      credible operating-leverage signal consistent with approaching free-cash-flow breakeven.
      However, the $110M Series F is modest relative to the $3.5B SkyForge capex commitment;
      the CEO's framing of "rapidly decreasing capital needs" for operating expenses does not
      necessarily mean SkyForge capex is self-funded. Investors should distinguish between
      operational-cost self-sufficiency (plausible based on the signal) and full capex
      self-sufficiency (not supported by the raise size alone).
    claimRefs:
      - CI010
      - CI024
      - CI036

