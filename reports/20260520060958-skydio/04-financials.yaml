  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: gross-margin
      missingEvidence: >-
        Audited gross margin by segment (hardware, software, services) and blended gross margin
        from Skydio's income statement; no public filing or investor disclosure provides this.
      whyItMatters: >-
        Gross margin is the primary input for any DCF or revenue-multiple underwriting;
        without it, the $4.4B valuation cannot be independently assessed. A hardware-heavy
        company with 30% gross margins implies a very different valuation than a
        software-heavy company with 70% margins at the same revenue level.
      diligencePath: >-
        Request audited financial statements (income statement + balance sheet) from CFO
        James LaCamp; request segment-level gross margin bridge in data room.
      relatedQuestionRefs:
        - QI002

    - type: private-evidence-only
      severity: blocking
      topic: arr-nrr
      missingEvidence: >-
        Annual recurring revenue (ARR) from DFR Command, Remote Ops, Connect, and other
        subscription products; net revenue retention (NRR) by customer segment.
      whyItMatters: >-
        ARR and NRR determine whether the recurring-revenue component of the business is
        large enough to support a premium valuation multiple; if ARR is small relative to
        hardware revenue, the implied SaaS multiple is extreme.
      diligencePath: >-
        Request ARR cohort schedule from product/finance team; NRR by segment for public
        safety, defense, and utilities from CRM/billing system export since 2022.
      relatedQuestionRefs:
        - QI004
        - QI005

    - type: private-evidence-only
      severity: blocking
      topic: burn-rate-runway
      missingEvidence: >-
        Monthly cash burn rate and cash on hand post-Series F; bank statements or audited
        cash flow statement showing operating and capex spend trajectory since Series E close.
      whyItMatters: >-
        The $110M Series F is modest relative to SkyForge and operating costs; runway
        duration determines whether a follow-on raise is imminent and the risk of dilutive
        bridge financing.
      diligencePath: >-
        Request monthly P&L and cash flow statement from CFO since January 2023; board-level
        cash runway schedule post-Series F.
      relatedQuestionRefs:
        - QI003

    - type: private-evidence-only
      severity: material
      topic: acv-by-segment
      missingEvidence: >-
        Average contract value (ACV) per customer segment across public safety, defense,
        utilities, and enterprise; expansion and upsell rates by cohort.
      whyItMatters: >-
        ACV and CAC determine LTV and payback period; without them, the 3,800 customer count
        cannot be translated into a revenue model; $52M ÷ 2,500 units provides a single-
        contract defense hardware proxy only.
      diligencePath: >-
        Request ACV by segment from CRM system; quota attainment and sales cycle data from
        CRO Callan Carpenter; customer cohort analysis from CFO.
      relatedQuestionRefs:
        - QI021

    - type: private-evidence-only
      severity: material
      topic: skyforge-capex-schedule
      missingEvidence: >-
        Board-approved SkyForge capital expenditure schedule by year; financing commitments
        for the $3.5B plan (revenue-funded vs. debt vs. future equity); binding versus
        aspirational commitment status.
      whyItMatters: >-
        If SkyForge is aspirational rather than contractually committed, it represents a
        materially different balance-sheet risk profile; if funded by debt, the leverage
        structure changes the risk profile of existing equity at $4.4B.
      diligencePath: >-
        Request board-approved capex plan; financing term sheets or commitment letters; legal
        review of SkyForge announcement for binding versus forward-looking-statement language.
      relatedQuestionRefs: []

