  - id: capital-valuation-and-investors
    title: Capital structure, valuation trajectory, and investor map
    body: >-
      Skydio's capital history spans six known equity rounds from 2014 through 2026. The company raised a $230 million
      Series E in February 2023, which brought total funding to $562 million at a post-money valuation of over $2.2
      billion. Linse Capital led the Series E, joined by existing investors Andreessen Horowitz, Next47, IVP, DoCoMo,
      NVIDIA, and UP.Partners, as well as new investors Hercules Capital and Axon. The Series E filing was registered
      with the SEC via Form D on March 6, 2023. In April 2026, Skydio announced a $110 million Series F led by
      existing investors, bringing total funding to approximately $672 million and valuation to $4.4 billion
      post-money. The Series F was notable in being oversubscribed by existing investors, with Bry explicitly
      declining additional capital, framing the small raise size as evidence of operating leverage and approaching
      self-sufficiency. Third-party analysis by DroneXL noted that no marquee new institutional lead was named, and
      read the existing-investor structure as either a vote of confidence or as signal that new investors were unwilling
      to buy in at the $4.4 billion price. Andreessen Horowitz led the 2021 Series D; Linse Capital led the 2023
      Series E; no named lead was publicly identified for Series F. At $4.4 billion on "hundreds of millions" in
      annual revenue, DroneXL estimated Skydio was trading at 10x-20x trailing revenue — reasonable for a hardware
      company with AI characteristics and a regulatory moat, but not cheap relative to defense-tech peers. Revenue
      growth rate, gross margin, and net dollar retention remain undisclosed.
