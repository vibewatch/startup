  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: revenue
      missingEvidence: >-
        Audited or independently verified annual revenue figure with growth rate and gross margin for Skydio.
      whyItMatters: >-
        CEO characterization of "hundreds of millions in annual revenue" is the only public data point. Without revenue
        scale, growth rate, and gross margin, the $4.4B valuation and operating-leverage thesis cannot be
        independently assessed. This gap is central to any investment or partnership decision.
      diligencePath: >-
        Request access to financial statements, management accounts, or auditor letter under NDA. Series F investor
        materials would likely contain detailed financials.
      relatedQuestionRefs:
        - QO013
        - QO017
    - type: private-evidence-only
      severity: material
      topic: cap table
      missingEvidence: >-
        Full cap table including Series F investor identities, ownership percentages, and board seat allocation.
      whyItMatters: >-
        The Series F was led by "existing investors" without naming them. Without knowing which investors hold what
        stakes and which have board control, governance and control risk cannot be assessed.
      diligencePath: >-
        Request cap table and investor rights agreement under NDA. Cross-reference with Series E SEC Form D for
        partial verification.
      relatedQuestionRefs:
        - QO019
        - QO006
      relatedTableRefs:
        - TO003
    - type: private-evidence-only
      severity: minor
      topic: supply chain
      missingEvidence: >-
        Confirmation that battery supply has been fully onshored post the China sanctions episode; current battery
        sourcing geography and supplier names.
      whyItMatters: >-
        Skydio said spring 2025 was the expected timeline for new battery sources. No public confirmation of full
        resolution has been found in sources accessed for this chapter.
      diligencePath: >-
        Ask company directly for supply chain update post-spring 2025 and confirm dual-source or domestic-only
        battery procurement as of run date.
      relatedQuestionRefs:
        - QO026
    - type: missing-source
      severity: minor
      topic: competitive comparison with Shield AI, Joby Defense, and Dedrone
      missingEvidence: >-
        No independent comparative analysis of Skydio versus peer US autonomous drone companies (Shield AI, Joby
        Defense, Dedrone) was available in the sources accessed for this chapter.
      whyItMatters: >-
        Without competitive benchmarking data, it is difficult to assess Skydio's market-share position, pricing
        power, or the defensibility of its autonomy moat relative to well-funded domestic peers.
      diligencePath: >-
        Commission independent competitive analysis or request Skydio's own competitive positioning deck. Review
        Shield AI, Joby Defense, and Dedrone public filings and press for direct product comparisons.
      relatedQuestionRefs:
        - QO020
    - type: missing-source
      severity: minor
      topic: board composition not publicly disclosed
      missingEvidence: >-
        Skydio does not publish its board of directors, board observer rights, or investor governance rights. Board
        member identities, investor board seats, and voting controls are not available from public sources.
      whyItMatters: >-
        Without board composition, investor control rights and governance risk cannot be assessed; concentrated
        control by a single investor or founder could affect M&A or IPO optionality.
      diligencePath: >-
        Request board composition, voting rights, and investor observer rights under NDA. Search SEC EDGAR for any
        required board disclosures in proxy statements or Form D amendments.
      relatedTableRefs:
        - TO002
      relatedQuestionRefs: []
