          tone: positive
        - label: China battery sanctions (Oct 2024)
          value: Resolved spring 2025
          detail: China sanctioned Skydio over Taiwan drone sales; battery rationing lasted several months.
          tone: warning
        - label: 2024 workforce reduction
          value: ~25% / ~100 employees
          detail: Layoffs in early 2024; pivot to government and defense; enterprise commercial scaled back.
          tone: warning
    approximationNotes: >-
      Total raised is a derived estimate, not a single official disclosure. Army order value is a floor ($52M+). Spring
      2025 battery resolution is the stated timeline at time of sanctions; no public confirmation of full resolution found.
