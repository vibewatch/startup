  topStrengths:
    - >-
      Blue UAS / NDAA-aligned regulatory posture and domestic manufacturing create a meaningful procurement moat versus
      Chinese incumbents.
    - >-
      Real public-safety and defense traction is unusually deep for a private hardware company, including all U.S.
      military branches and more than 1,200 public safety agencies.
    - Autonomy, docked operations, and DFR workflows differentiate Skydio beyond commodity hardware positioning.
    - >-
      April 2026 insider-led financing and the SkyForge manufacturing plan indicate continued investor commitment and
      category ambition.
  topRisks:
    - >-
      Gross margin, ARR, burn, cap table terms, and revenue concentration are undisclosed, making a $4.4B valuation hard
      to underwrite from public evidence.
    - >-
      The regulatory moat is policy-driven; any rollback, waiver expansion, or successful challenge that reopens
      procurement to DJI or other Chinese competitors could compress pricing and demand.
    - >-
      China's October 2024 sanctions exposed a real battery and supply-chain vulnerability despite the
      domestic-manufacturing narrative.
    - >-
      Government and defense concentration plus hardware capital intensity create downside if procurement timing slips
      or manufacturing expansion outpaces software-margin growth.
  unresolvedGaps:
    - Audited revenue, gross margin, ARR mix, and cash-burn data are still unavailable publicly.
    - Cap table, liquidation preferences, and any venture-debt or structured-finance obligations remain undisclosed.
    - Battery supplier identity and full post-sanctions supply-chain resolution have not been publicly confirmed.
    - Revenue mix by defense, public safety, utilities, and software subscriptions is not disclosed.
    - >-
      Top-customer concentration, backlog, renewal rates, and contract-length data remain unavailable without a private
      data room.
