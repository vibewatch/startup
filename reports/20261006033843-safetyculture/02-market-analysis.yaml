callouts:
  - calloutType: insight
    title: The Per-Seat Frontline Pricing Paradox
    body: >
      While software vendors target the massive 80% deskless worker demographic, applying traditional $20-$30/month desk-worker SaaS pricing models to entire field workforces creates untenable contract sizes for low-margin industrial operators. Category winners increasingly decouple active field reporting from full administrative seat licensing.
    claimRefs:
      - CM005
      - CM007
      - CM008
  - calloutType: risk
    title: Operational Fragility in Blended Hardware and SaaS Solutions
    body: >
      Expanding from pure mobile checklists into IoT sensor telemetry creates physical operational dependencies. When upstream sensor infrastructure or connectivity fails, real-time monitoring halts, presenting reputational and operational risks for mission-critical cold-chain and facility monitoring.
    claimRefs:
      - CM003
      - CM015
