    title: "Recommendation Stance: Track at Current Valuation Marks"
    body: "SafetyCulture warrants a disciplined Track recommendation with a Stretched valuation stance. While frontline software utility is proven across 85,000 customers, the AU$2.5B headline mark requires aggressive multiple maintenance and sustained >25% ARR growth without audited public financial proof."
