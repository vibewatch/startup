  - calloutType: "risk"
    title: "Valuation Setback and Secondary Liquidity Signal"
    body: "The AU$200 million valuation markdown in September 2024 and structured secondary share offloading by early investors like Blackbird signal that institutional insiders are taking liquidity ahead of an uncertain public listing window."
