evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: >-
      Audited consolidated revenue, gross margin, accounting loss, operating cash burn, cash balance, runway, and debt
      or credit facilities.
    whyItMatters: Revenue is not ARR, accounting loss is not cash burn, and cumulative funding does not establish current liquidity.
    diligencePath: >-
      Request audited financial statements, monthly management accounts, bank statements, debt schedules, and the
      current cash forecast from the data room.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: >-
      A dated payroll roster and active-customer definition reconciling the 797 and 878 headcount estimates and the
      80,000-organization claim.
    whyItMatters: >-
      Workforce trajectory and active-customer scale affect operating leverage, productivity, and go-to-market
      assessment.
    diligencePath: Obtain monthly headcount by function and geography plus billed-customer and active-user cohort exports.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: A current company organization chart, director register, board committee roster, and documented succession plan.
    whyItMatters: Public directories may lag leadership changes and cannot establish actual decision rights or succession readiness.
    diligencePath: Reconcile the current org chart and director filings with board minutes and executive employment agreements.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: ownership
    missingEvidence: >-
      The fully diluted cap table, security classes, preferences, voting agreements, and participant-level allocation of
      the 2024 secondary sales.
    whyItMatters: Named investors and round totals do not establish current ownership, control, or liquidation outcomes.
    diligencePath: >-
      Review the capitalization ledger, shareholder agreements, financing documents, and secondary transaction
      schedules.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: adverse-events
    missingEvidence: Comprehensive regulator, court, and company incident records beyond one public breach catalog.
    whyItMatters: Absence from a single catalog is not proof that no security, legal, regulatory, or operational incident occurred.
    diligencePath: >-
      Run jurisdiction-specific court and regulator searches and request the company's incident and litigation
      registers.
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: material
    topic: tam-and-retention-disclosures
    missingEvidence: >-
      Audited enterprise market sizing by industrial vertical, along with cohort-level Net Revenue Retention (NRR) and
      logo churn rates for frontline operations software.
    whyItMatters: >-
      Without segmented market retention and churn metrics, it is impossible to verify whether frontline operations
      software commands durable enterprise software multiples or experiences high churn among casual seat tiers.
    diligencePath: Request audited revenue by customer segment and vertical cohort retention data during direct management diligence.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: audited-financials-and-burn
    missingEvidence: >-
      Audited consolidated GAAP or IFRS financial statements disclosing annual revenue, gross profit, cost of sales,
      operating cash burn, and cash runway.
    whyItMatters: >-
      Without audited figures, investors cannot calculate true recurring revenue quality, unit gross margins, or cash
      burn rate to determine underwriting return thresholds.
    diligencePath: Obtain confidential management accounts and audited consolidated financial statements under NDA.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: saas-unit-retention-metrics
    missingEvidence: >-
      Historical Net Revenue Retention (NRR), Gross Revenue Retention (GRR), cohort logo churn, and customer acquisition
      cost (CAC) payback schedules.
    whyItMatters: >-
      Underwriting long-term software profitability requires verifying whether expansions outpace contraction and
      whether frontline seat adoption is stable.
    diligencePath: Request historical cohort retention watermarks and sales efficiency telemetry from company financial operations.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: ai-production-adoption
    missingEvidence: >-
      Empirical customer adoption percentages, operational SLA performance, and false positive metrics for newly
      launched Mitti AI agents and vision-based issue creation.
    whyItMatters: >-
      Validates whether the 2026 platform transformation delivers genuine operational intelligence differentiation or
      functions primarily as marketing positioning.
    diligencePath: Request customer deployment telemetry and AI feature active usage rates from management in virtual data room.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE001
  - type: private-evidence-only
    severity: material
    topic: retention-and-nrr
    missingEvidence: Audited cohort net revenue retention (NRR), gross revenue retention (GRR), and enterprise annual logo churn rates.
    whyItMatters: >-
      Without audited retention benchmarks, investors cannot verify whether customer expansion compensates for SMB and
      mid-market churn.
    diligencePath: >-
      Request confidential historical cohort retention tables and expansion waterfall reports from the company's
      financial data room.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-census
    missingEvidence: Comprehensive census of revenue contribution across the top 100 enterprise customers.
    whyItMatters: >-
      Exposes potential customer revenue concentration risks and vulnerability to procurement budget cuts at anchor
      accounts.
    diligencePath: Conduct customer concentration audit reviewing top 20 customer ACV contribution and contract renewal horizons.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Confirmed board-resolution minutes and settlement terms for executive equity litigation involving Frank Costigan.
    whyItMatters: >-
      Adverse court rulings could create precedent for executive share vesting liabilities or expose governance
      dysfunction.
    diligencePath: Review Federal Court of Australia proceedings and request company legal risk disclosures.
    relatedQuestionRefs:
      - QR001
      - QR009
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: blocking
    topic: financial-model
    missingEvidence: Audited financial statements confirming consolidated revenue, cash burn rate, gross margin, and runway.
    whyItMatters: >-
      Without audited financial disclosures, the company's valuation multiple and capital sustainability cannot be
      independently corroborated.
    diligencePath: Obtain confidential information memorandum (CIM) and audited financial pack under non-disclosure agreement.
    relatedQuestionRefs:
      - QR006
      - QR009
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: workforce
    missingEvidence: Exact headcount reduction counts and severance liabilities from the May 2026 restructuring.
    whyItMatters: Indicates the severity of operational retrenchment and risk of technical debt accumulation.
    diligencePath: Request human resources census data and restructuring cost allocations.
    relatedQuestionRefs:
      - QR002
      - QR009
    relatedTableRefs:
      - TR002
  - type: private-evidence-only
    severity: blocking
    topic: financial-reporting
    missingEvidence: >-
      Audited consolidated financial statements disclosing ARR run rate, GAAP revenue, gross margin, operating cash
      burn, and cash runway.
    whyItMatters: >-
      Without audited figures, valuation multiples of 18x to 21x ARR are based on unverified third-party estimates,
      creating severe pricing risk.
    diligencePath: Request confidential audited financial statements and board-approved financial model under NDA.
    relatedQuestionRefs:
      - QV001
      - QV003
    relatedTableRefs:
      - TV001
  - type: private-evidence-only
    severity: material
    topic: cap-table-liquidation
    missingEvidence: >-
      Cap table detailing liquidation preferences, participation rights, and senior preference overhang for the
      September 2024 Series D round.
    whyItMatters: >-
      Senior liquidation preferences can disproportionately impair common equity and secondary buyers in downside exit
      scenarios below $2.5B.
    diligencePath: Review complete shareholders agreement, constitution, and Series D share subscription deed.
    relatedQuestionRefs:
      - QV005
      - QV007
    relatedTableRefs:
      - TV003
  - type: missing-source
    severity: material
    topic: customer-retention
    missingEvidence: >-
      Net Revenue Retention (NRR), Gross Revenue Retention (GRR), and customer churn data following the August 2026
      Mitti rebrand.
    whyItMatters: >-
      Enterprise customer churn during the brand transition could undermine growth projections and accelerate multiple
      compression.
    diligencePath: Obtain cohort retention tables segmented by enterprise versus self-serve customers.
    relatedQuestionRefs:
      - QV008
      - QV009
    relatedTableRefs:
      - TV002
