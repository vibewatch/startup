    title: Scenario Valuation and Downside Return Framework
    columns:
      - Scenario
      - Probability
      - 2028 ARR Estimate
      - Exit ARR Multiple
      - Implied Valuation
      - Return vs Series D ($1.65B)
      - Key Operating Assumptions
    rows:
