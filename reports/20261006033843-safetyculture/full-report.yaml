      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The Rebranding Imperative and Category Trap
            body: >-
              SafetyCulture's August 2026 rebrand to Mitti reflects an urgent strategic effort to escape the safety
              department pigeonhole. While the platform excels at checklist capture, commoditization by low-cost form
              builders and encroachment by CMMS vendors threaten its enterprise valuation multiple unless it
              successfully monetizes its newer AI agents and integrated insurance offerings.
            calloutType: risk
            claimRefs:
