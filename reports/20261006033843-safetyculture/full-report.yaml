chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origin, and operating model
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture began in 2004 under founder Luke Anear and is headquartered in Surry Hills, Sydney.
              Independent company profiles consistently describe a privately held, subscription-funded, mobile-first
              platform used for inspections, audits, issue management, training, asset management, and frontline
              operational improvement. That product breadth matters because the business is no longer adequately
              described as a safety-checklist application: its operating proposition links worker-captured data to
              corrective workflows across safety, quality, compliance, and maintenance. The legal entity and the
              commercial brand should nevertheless be distinguished. SafetyCulture remained the report subject while the
              company and platform moved to the Mitti identity in August 2026; accessible public records do not
              establish that the underlying ownership changed with the rebrand.
