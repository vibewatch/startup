  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Monetization Streams, and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture generates software revenue primarily through seat-based software-as-a-service (SaaS)
              subscriptions for its mobile-first frontline inspection, issue tracking, and operations platform.
              Historically known as iAuditor and rebranded alongside the parent company to Mitti in August 2026, the
              software employs a classic freemium and land-and-expand go-to-market architecture. Free tiers provide
              entry-level utility capped at ten seats and five active checklist templates, funneling frontline teams
              into paid tiers. The paid SaaS pricing structure centers on a standard Premium tier priced at USD 24 per
              seat per month when billed annually (or USD 29 per seat on a monthly billing cycle), while enterprise-wide
              deployments require custom contracts with volume discounting and dedicated account management. Beyond the
              core inspection software subscription, SafetyCulture has systematically diversified its monetization
              streams into adjacent product vectors. These include mobile-first micro-learning and compliance training
              via EdApp (SC Training), IoT sensor hardware and monitoring telemetry for facility and environmental
              tracking, physical consumables via an online storefront, and specialized commercial property and casualty
              coverage through its insurance MGA arm, rebranded back to Mitti Insurance and licensed across 51 US states
              and jurisdictions. This multi-stream structure broadens customer lifetime value, although software seat
              subscriptions remain the primary economic engine.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
