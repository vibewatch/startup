      - number: '1.2'
        title: Scale claims and the Mitti repositioning
        blocks:
          - type: paragraph
            body: >-
              The August 11, 2026 rebrand to Mitti was more than a visual refresh: the company moved its web identity
              from safetyculture.com to mitti.com and framed the platform as an all-in-one frontline operations system.
              A competitor research page independently verified redirects and reported that the old name had confined
              buyer perception to safety departments. At launch, the company claimed more than two million frontline
              workers across 80,000 organizations. Those figures indicate broad distribution but remain
              company-originated scale claims relayed by third parties rather than audited customer or active-user
              counts. Current workforce estimates also conflict: one August 2026 profile lists 797 employees, whereas
              Tracxn lists 878 as of July 31, 2026. This range should not be collapsed into a precise current headcount
              without payroll or HR evidence.
            claimRefs:
              - CO004
              - CO005
              - CO010
              - CO011
      - number: '1.3'
        title: Leadership, board coverage, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Founder dependence remains a central governance consideration. Third-party reporting says Luke Anear
              returned as chief executive in February 2026 after a short period away from the role, and IBISWorld also
              identifies him as the current CEO. An August 2026 profile lists Edelita Tichepco as CFO, Tom Dance as CTO,
              Hamish Grant as COO, and Anna Wenngren as chief people officer. Tracxn separately lists a four-person
              board comprising Anear and independent members Craig Spencer Tiley, Jan Hammer, and Richard Charles
              Spencer Baker. These sources provide functional coverage across finance, technology, operations, people,
              and investor governance, but they are not substitutes for a dated company organizational chart, director
              filings, or board minutes. Anear's return and immediate leadership of the Mitti repositioning reinforce
              both founder-market fit and succession risk.
            claimRefs:
