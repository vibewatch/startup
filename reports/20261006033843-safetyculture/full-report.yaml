  - id: FU001
    title: SafetyCulture Frontline Customer Acquisition, Engagement, and Expansion Journey Map
    type: journey-map
    summary: >-
      Visualizes the end-to-end customer progression from initial mobile inspection trial through AI-assisted
      qualification, enterprise rollout, and operational expansion.
    data:
      items:
        - label: 1. Frontline Inbound Discovery
          stage: Top-of-Funnel Inbound
          userRole: Site Supervisor / Field Inspector
          touchpoints:
            - Download iAuditor mobile app on iOS/Android
            - Access free template library with 59,216 checklists
            - Run offline inspections on site without network connection
          painPoint: Paper inspection binders and fragmented compliance reporting
          sentiment: positive
        - label: 2. Autonomous AI Qualification
          stage: Lead Triage & Conversion
          userRole: Inside Sales / AI Sales Agent Bosh
          touchpoints:
            - Bosh AI agent analyzes inbound company profile and CRM signals
            - Automated 24/7 personalized follow-up and objection handling
            - Calendar booking directly with dedicated account executives
          painPoint: High inbound volume historically causing qualified leads to go cold
          sentiment: positive
        - label: 3. Team & Departmental Land
          stage: Commercial Purchase
          userRole: EHS Manager / Plant Operations Lead
          touchpoints:
            - Upgrade to Premium plan at USD 24 per seat per month
            - Standardize custom checklist templates and issue tracking
            - Implement basic action assignments and corrective sign-offs
          painPoint: Procurement resistance to enterprise safety labeling
          sentiment: neutral
        - label: 4. Multi-Site Enterprise Expansion
          stage: Enterprise Rollout
          userRole: VP of Safety / Chief Risk Officer
          touchpoints:
            - Deploy across multiple plant facilities or retail stores
            - Integrate Procore, dbt Labs, and Couchbase data workflows
            - Adopt integrated EdApp training and IoT sensor monitoring
          painPoint: Tracking multi-site compliance consistency and reporting
          sentiment: positive
        - label: 5. Operational AI Transformation
          stage: Full Platform Expansion
          userRole: Chief Operating Officer / General Manager
          touchpoints:
            - Adopt 2026 Mitti AI Agents and automated issue generation
            - Leverage 5 Star Benchmarking across facility locations
            - Evaluate Mitti Insurance offerings for bundled underwriting
          painPoint: Overcoming 2026 brand confusion during contract renewal cycles
          sentiment: caution
        - label: 6. Renewal, Expansion & Durability
          stage: Ongoing Retention & Land-and-Expand
          userRole: VP of Procurement / Enterprise Account Executive
          touchpoints:
            - Annual license renewal and volume-tier renegotiation
            - Cross-departmental license expansion beyond safety teams
            - API integrations with core ERP, HR, and BI systems
          painPoint: Lack of transparent cohort retention and NRR data
          sentiment: neutral
    approximationNotes: >-
      Journey map stages reflect documented product-led expansion mechanics, Relevance AI sales automation workflows,
      and 2026 Mitti platform capabilities.
