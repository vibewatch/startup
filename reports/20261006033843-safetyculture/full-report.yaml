  - id: TR003
    title: Partner and Counterparty Dependency Risk Register
    columns:
      - Dependency Area
      - Counterparty
      - Role
      - Concentration
      - Failure Scenario
      - Severity
      - Mitigation
      - Residual Exposure
    rows:
      - - Cloud Hosting & Compute
        - Amazon Web Services (AWS)
        - Primary cloud host, databases, and multi-region storage
        - Single-Provider Dominance
        - Global AWS availability zone disruption or hosting cost inflation
        - Critical
        - Multi-AZ replication and automated snapshots
        - Complete vendor lock-in with multi-quarter migration barrier
      - - Edge Security & DDoS Mitigation
        - Cloudflare
        - Web Application Firewall and DDoS protection
        - Sole Edge Provider
        - Edge routing disruption blocking global mobile and web API traffic
        - High
        - Standard Cloudflare enterprise SLA
        - Transient global API service unavailability
      - - Third-Party AI Foundation Models
        - Anthropic, Google, AWS
        - External LLM reasoning and inspection summary generation
        - High Vendor Reliance
        - API deprecation, model drift, vendor rate-limiting, or policy changes
        - Medium
        - Multi-provider model evaluation and opt-out of model training
        - Feature downtime and latency degradation across AI Agent tools
      - - Payment Gateway Processing
        - Stripe, Zuora, eWay
        - Subscription billing and customer credit card processing
        - Diversified Gateways
        - Billing engine downtime or payment gateway compliance breach
        - Medium
        - PCI-DSS compliant external vaults; no internal card caching
        - Inability to process recurring subscription renewals
    notes: Ordered by severity. Evaluates external counterparty concentration across technical and operational domains.
    claimRefs:
      - CR011
      - CR012
      - CR013
  - id: TV001
    title: Recommendation Summary and Decision Framework
    columns:
      - Dimension
      - Assessment / Metric
      - Evidence Basis
      - Decision Implication
    rows:
      - - Recommendation
        - Track
        - AU$2.5B valuation represents 18x-21.4x estimated ARR amid opaque financial disclosures
        - Maintain coverage; defer direct primary equity commitments until audited numbers are disclosed
      - - Confidence
        - Medium
        - Corroborated round history and third-party ARR estimates balanced against private financials
        - Require non-disclosure agreement CIM and audited financial review for higher conviction
      - - Risk Rating
        - High
        - Valuation markdown, ongoing operating losses, and rebrand transition friction
        - Structure downside liquidation preference and price ratchets on new capital
      - - Valuation Stance
        - Stretched
        - 21.4x ARR multiple exceeds public SaaS medians (6x-8x) by more than 2.5x
        - Target secondary entry marks at a minimum 35% discount to Series D headline price
      - - Target Return Profile
        - 1.5x - 2.0x (Long-term Hold)
        - Dependent on successful Mitti horizontal expansion and reaching $150M+ ARR at IPO
        - Only viable if entry valuation is reset toward 10x-12x ARR
    notes: >-
      Recommendation synthesized from cross-chapter operational scale, private financing records, and comparative SaaS
      multiples.
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV014
  - id: TV002
    title: Thesis and Anti-Thesis Balance Sheet
    columns:
      - Dimension
      - Investment Thesis
      - Structural Anti-Thesis
      - What Would Change the View
    rows:
      - - Product & Market Adoption
        - High mobile engagement across 2M+ frontline workers and 85,000 organizations
        - Safety checklist tools risk commoditization by specialized inspection and asset management apps
        - Evidence of accelerating ACV growth and expansion beyond safety into core operations
      - - Monetization & Unit Economics
        - Scalable tier model ($24/seat/mo) with self-serve viral bottom-up team adoption
        - Lack of disclosed net revenue retention (NRR) and potential high frontline seat churn
        - Audited SaaS metrics showing NRR > 115% and gross margins > 75%
      - - Valuation & Capital Structure
        - Backing by premier funds (AirTree, Blackbird, Insight) providing balance sheet stability
        - September 2024 round was marked down by $200M to $2.5B, leaving significant preference overhang
        - Subsequent clean equity round at flat or stepped-up valuation without heavy liquidation preferences
      - - Corporate Identity & Strategy
        - Mitti rebrand unlocks broader horizontal market access beyond safety department budgets
        - Abandoning established 20-year brand equity risks enterprise search friction and customer confusion
        - Documented enterprise customer retention and rebrand adoption rate > 95% over 12 months
    notes: Core thesis drivers evaluated against operational vulnerabilities and empirical market data.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV005
      - CV006
      - CV007
