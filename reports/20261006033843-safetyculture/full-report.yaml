        - 15%
        - $160M USD
        - 15.0x
        - $2,400M USD
        - +45% ($2.4B)
        - Successful Mitti rebrand, rapid AI agent monetization, and US insurance expansion
      - - Base Case
        - 50%
        - $130M USD
        - 10.0x
        - $1,300M USD
        - '-21% ($1.3B)'
        - Steady 20% ARR CAGR, moderate US traction, multiple compression to software peer medians
      - - Bear Case
        - 35%
        - $105M USD
        - 6.0x
        - $630M USD
        - '-62% ($0.63B)'
        - Growth decelerates to single digits, brand friction increases churn, multiple collapses to 6x
    notes: >-
      Valuation scenarios model exit values through 2028 based on estimated 2025 ARR baseline of $90.3M and varying
      multiple compression assumptions.
    claimRefs:
