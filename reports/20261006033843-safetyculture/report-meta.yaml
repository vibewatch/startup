companyProfile:
  summary: >-
    SafetyCulture is a late-stage private frontline operations platform founded by Luke Anear that has expanded from
    mobile inspections into training, sensor telemetry, workflow automation, and insurance. The company rebranded to
    Mitti in August 2026, but public disclosure still leaves core financial, retention, and governance metrics only
    partially visible.
