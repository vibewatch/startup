  topStrengths:
    - Broad frontline adoption across 80,000+ organizations and millions of workers.
    - Product breadth now spans inspections, training, sensors, workflow automation, and insurance.
    - Founder-led repositioning preserves category recognition while widening the operating scope.
  topRisks:
    - Audited revenue, gross margin, burn, and net retention remain undisclosed.
