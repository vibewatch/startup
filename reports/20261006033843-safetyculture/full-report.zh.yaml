          - type: paragraph
            body: >-
              SafetyCulture 在领导层变动和品牌重定位后，治理画像显示出较高的管理层波动和未解决的法律负债。创始人 Luke Anear 任 CEO 20 年后离任，由 Kelly Vohs 短暂接替，随后于
              2026 年 2 月回归，重组亏损业务成为 AI 优先供应商并执行 2026 年 8 月的 Mitti 公司更名。领导层骤变和战略调整同时伴随澳大利亚联邦法院的正式雇佣诉讼：SafetyCulture Care
              前董事总经理 Frank Costigan 起诉公司，指称公司不当解雇并未支付全部股份权益。更名还带来可量化的运营风险，包括企业商标混淆、80,000 家注册组织的客户流失，以及旧 EHS 买方网络中的营销摩擦。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR008
      - number: '7.2'
        title: 运营可靠性、网络安全治理与员工重组
        blocks:
          - type: paragraph
            body: >-
              在公司转向自动化之际，运营连续性和员工稳定性构成现实风险。2026 年 5 月，SafetyCulture 在全球裁员，影响产品工程、客户成功以及 Manchester 和 Austin
              的区域开发办公室，同时把开发工作集中到 AI 能力。虽然第三方泄露数据库截至 2026 年记录了零起已确认网络事件或数据披露，SafetyCulture 仍依赖复杂云架构。公司依据 ISO 27001:2024
              认证和 AICPA SOC 标准运营，采用静态 AES-256 加密及传输中 TLS 1.2+。但在工业环境中，一线移动工作流仍受本地设备缓存限制、一周存储到期和人工数据同步缺口影响。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
