      - number: '4.2'
        title: 单位经济代理指标、成本结构与运营规模
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 是一家澳大利亚私营有限责任公司，不公开报告经审计的 GAAP 或 IFRS
              损益表，因此毛利率、获客成本（CAC）、回收期和净收入留存率（NRR）尚未得到主要监管申报验证。不过，运营规模指标和 SaaS 行业基准可以为底层经济性提供参考。平台覆盖超过 80,000 家客户组织和全球超过
              200 万名活跃一线员工，每年记录超过 600 million 次巡检，EdApp 每日完成数万节课程。服务现场员工的移动优先 SaaS 架构通常拥有 75% 至 82%
              的毛利率，主要成本来自云托管基础设施、数据接入管线、移动推送和客户支持。主要成本还包括悉尼及国际开发中心的工程人才、中端市场和企业部署的销售与客户成功团队，以及领域管理费用。第三方聚合商估算收入约 USD
              201.2M、员工 957 人，但这些只是未经验证的私营指标代理，并非经审计财务结果。群组流失、毛收入留存、扩张率和客户集中度等关键投资判断输入仍未披露，属于待完成的尽调事项。
