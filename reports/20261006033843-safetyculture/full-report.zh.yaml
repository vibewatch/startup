chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、起源与运营模式
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 由创始人 Luke Anear 于 2004 年创立，总部位于悉尼 Surry
              Hills。多份独立公司资料一致将其描述为一家私营、靠订阅收入运营、以移动端为先的平台，用于巡检、审计、问题管理、培训、资产管理和一线运营改进。产品覆盖面很重要：公司已不能再被简单归类为安全检查清单应用，其运营方案把员工采集的数据接入安全、质量、合规和维护场景的整改工作流。不过，法律实体与商业品牌仍需区分。2026
              年 8 月，公司及平台转用 Mitti 品牌，但本报告对象仍是 SafetyCulture；现有公开记录无法证明更名同时改变了底层所有权。
            claimRefs:
