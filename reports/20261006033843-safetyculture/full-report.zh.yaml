  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 一线运营平台定义与核心能力
        blocks:
          - type: paragraph
            body: >
              SafetyCulture 提供移动优先的运营与合规平台，把现场纸质审计和检查清单流程转成结构化、实时的数字审计轨迹。该产品最初以 iAuditor 品牌在企业现场为人熟知，2026 年 8 月在回任创始人
              Luke Anear 领导下正式更名为
              Mitti。平台面向制造设施、物流枢纽、建筑工地和零售运营中的分散一线团队。它不只是行政合规档案，而是直接在工作现场运行：简化日常巡检、采集带照片的隐患记录、记录整改行动并跟踪反复发生的事故处理。

              平台架构围绕三条运营工作流：主动巡检采集、自动化运营问题解决和环境传感器遥测。运营人员通过跨平台 iOS、Android
              移动界面执行巡检，支持离线录入、结构化条件逻辑和媒体采集。完成清单后，系统会自动触发可配置的 webhook 提醒、记录带时间戳的整改行动并填充集中式管理看板。随着近期平台扩张，SafetyCulture 加入了
              AI 辅助功能，包括从照片证据自动创建问题、后台工作流代理和跨地点五星基准比较；但在高危险工业环境中，自动 AI 派单仍待客户验证。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
