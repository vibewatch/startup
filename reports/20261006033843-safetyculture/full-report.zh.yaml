      - number: '5.2'
        title: 产品模块、SKU 演进与内容生态
        blocks:
          - type: paragraph
            body: >
              SafetyCulture 平台由多个功能模块组成，把客户关系从基础健康安全巡检扩展到更广的一线运营管理。核心软件模块 Inspections（历史品牌为 iAuditor）提供可定制检查清单模板、自动生成
              PDF 审计、评分逻辑和强制证据采集。配套模块包括管理任务分派和缺陷 SLA 跟踪的 Actions；让员工通过二维码或移动界面报告即时隐患的 Issues；以及直接在一线员工移动设备上提供微学习课程的
              Training。

              除软件工具外，SafetyCulture
              还维护庞大的内容生态，包含数千份经过行业审核的预制检查清单模板和安全微课程。这座数字内容库既是自然获客渠道，也是酒店、食品生产、建筑和设施维护等行业的快速入职机制。作为核心软件套件的补充，公司运营 Mitti
              Insurance（前身为 SafetyCulture Care），这是一家专业承保部门，把运营安全遥测与美国和澳大利亚辖区的商业财产及意外险保障结合起来。
            claimRefs:
              - CE006
              - CE007
              - CE008
