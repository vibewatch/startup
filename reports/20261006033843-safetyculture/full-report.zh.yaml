  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户群分层、买方画像与行业垂直领域
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture
              面向工业和商业行业中分散、无固定办公桌的一线运营环境，这些环境高度重视合规、安全审计和持续运营质量。核心买方过去主要是环境、健康与安全（EHS）经理、质量保证总监和风险合规高管，但实际用户多为移动端无固定办公桌员工，包括制造车间主管、建筑工头、零售店经理和设施检查员，他们用移动设备执行日常巡检、隐患评估和检查清单流程。Landbase
              的第三方验证技术跟踪显示，企业部署高度集中在工业垂直领域，主要包括制造、商业及住宅建筑、商业服务和杂货零售，并广泛分布于美国、英国、澳大利亚、加拿大和新西兰。已核实的商业使用企业账户包括零售超市巨头 Coles
              Group、工业制造跨国企业 Magna International、消费电子集团 LG、工业气体生产商 Air Liquide、建材供应商 CRH，以及 State of Texas 等公共部门组织。旧
              SafetyCulture 品牌把产品困在安全部门，限制其获得更广运营和工厂管理预算，因此战略定位面临挑战。
