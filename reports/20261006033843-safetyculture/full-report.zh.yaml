  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、范围与现状替代方案
        blocks:
          - type: paragraph
            body: >
              一线运营软件市场长期由专业化环境、健康与安全（EHS）合规工具、本地化质量管理系统、维护工单软件和传统人工流程割裂构成 [CM001]。SafetyCulture 的战略转向最终在 2026 年 8 月以更名
              Mitti 呈现，明确把边界从战术性检查清单巡检扩展到一线运营层 [CM002]。这一边界涵盖数字巡检、事故管理、资产跟踪、24/7
              温度与传感器监测以及工作流自动化，同时有意排除重量级计算机化维护管理系统（CMMS）和专业企业资源规划（ERP）工作流 [CM002]
              [CM003]。工业工作现场最主要的在位替代方案仍是纸笔夹板、临时电子表格和彼此割裂的消息群组 [CM004]。数字化点状方案经常形成运营孤岛，让主管团队不得不在不同设施之间手工汇总数据 [CM004]。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM002
              - CM005
              - CM006
              - CM007
      - number: '2.2'
        title: 市场规模视角与可服务支出
        blocks:
          - type: paragraph
            body: >
              评估一线运营软件的可服务市场，必须把宏观劳动力数字与真实软件预算拆开看 [CM005]。全球市场叙事经常引用“全球约 80%
              的劳动者不坐在办公桌前”，由此得到制造、建筑、酒店、物流和零售行业庞大的理论无固定办公桌劳动力池 [CM005]。但一线软件支出只占运营技术总预算的一小部分 [CM006]。分析师估算中，广义
              EHS、设施合规和一线劳动力软件虽构成数十亿美元市场，但每名一线员工的软件支出相较知识工作者 SaaS 受到根本约束 [CM006] [CM007]。SafetyCulture 自助版年付起价为每用户每月
              $24；然而全企业一线部署若给整个现场劳动力授权，往往会触及预算上限，迫使厂商采用核心授权席位加不限量报表层的混合定价 [CM007] [CM008]。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM011
      - number: '2.3'
        title: 买方画像、付费方动态与采购路径
        blocks:
          - type: paragraph
            body: >
              一线软件的采用路径呈现出部门买方与企业 IT 采购之间的经典张力 [CM009]。过去，采用通常从下而上开始：单个工地的安全经理、质量负责人或设施主管下载移动应用（前身为 iAuditor），替代纸质表单
              [CM002] [CM009]。但要把合同价值扩展到多地点、跨职能运营，就必须把预算归属从本地安全成本中心转移给运营副总裁、首席运营官或企业采购委员会 [CM009]
              [CM010]。与此同时，SafetyCulture 通过 Mitti Insurance
              扩展到硬件远程信息和承保业务，把财产及意外险风险经理引入为互补的经济买方，形成与风险降低和保险费挂钩、而不只依赖软件席位许可的变现路径 [CM002] [CM011]。
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM009
              - CM010
              - CM011
              - CM013
      - number: '2.4'
        title: 增长驱动、摩擦点与采用约束
        blocks:
          - type: paragraph
            body: >
              一线软件采用由严格的监管合规要求、企业风险管理需求以及分散实体站点对实时可见性的运营需求驱动 [CM001] [CM012]。反过来，采用也受到显著的结构性约束
              [CM013]。在建筑工地、偏远工业厂等现场环境，不能假定网络持续可用，因此强大的离线同步是绝对要求，而非可选能力
              [CM014]。此外，无固定办公桌岗位的员工流动率高，要求入职摩擦接近于零；复杂的多字段表单会造成完成率低下和行政弃用 [CM005]
              [CM013]。其他障碍包括传感器基础设施的可靠性：外部硬件和电信中断可能暂时切断实时遥测监测，凸显 SaaS 与实体 IoT 传感结合的运营风险
              [CM015]。在采矿、重型制造等高度监管行业，横向巡检工具还会受到各司法辖区监管框架的区域合规阻力；这些框架要求经审计的签字留痕，超出通用检查清单模板的能力 [CM014] [CM016]。
            claimRefs:
              - CM001
              - CM005
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: 证据展项
        blocks:
          - type: callout
            title: 按席位计费的一线定价悖论
            body: >
              软件厂商瞄准占比 80% 的庞大无固定办公桌劳动力，但把传统的 $20-$30/month 办公桌员工 SaaS
              定价套到整个现场劳动力，会让低利润工业运营商承担无法承受的合同规模。品类赢家正越来越多地把现场活跃报表与完整的管理席位许可拆开。
            calloutType: insight
            claimRefs:
              - CM005
              - CM007
              - CM008
          - type: callout
            title: 硬件与 SaaS 混合方案的运营脆弱性
            body: |
              从纯移动检查清单扩展到 IoT 传感器遥测，会产生实体运营依赖。一旦上游传感器基础设施或连接中断，实时监测就会停止，给关键冷链和设施监控带来声誉与运营风险。
            calloutType: risk
            claimRefs:
              - CM003
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 市场分层与替代方案类型
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 所处的一线运营市场日益拥挤，买方面对的不是一份直接竞争者名单，而是五类替代方案：Xenia、Taqtics 等一线运营执行套件；Fluix、TrueContext（前身为
              ProntoForms）等工作流自动化工具；MaintainX 等移动优先 CMMS 维护平台；Inspecable、SiteDocs 等垂直合规工具；以及 VelocityEHS、Cority 等重量级企业
              EHS 套件。SafetyCulture 过去以 iAuditor
              身份成为默认的移动检查清单工具，但企业对设施维护、工单路由和区域监管合规的要求不断扩张，暴露出纯清单工作流的架构限制。竞争者正通过把条件逻辑、计算机化维护管理系统（CMMS）和自动派单直接嵌入一线员工体验，主动切入这些功能空白。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP007
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP008
              - CP011
      - number: '3.2'
        title: 能力深度、离线可靠性与定价架构
        blocks:
          - type: paragraph
            body: >-
              对核心一线能力的比较显示，横向巡检工具与专业工作流平台之间存在明显运营取舍。在深井矿山、船舶和偏远公用事业走廊等完全没有网络连接的现场，SafetyCulture
              要求用户在默认一周存储窗口内预下载移动模板；用户还反映，大量照片重新联网时经常同步不畅。相比之下，Fluix、Inspecable
              等专业巡检平台支持近失事件记录、风险评估方法声明（RAMS）和自动生成工单的自主离线队列，不受预缓存约束。定价方面，SafetyCulture 年付标准档为每用户每月 $24（月付为每用户 $29），另有最多
              10 个席位的免费档；竞争者则提供按地点授权、按层级开放维护模块或按本地货币计费等模块化方案，更吸引注重成本的多单位运营商。
            claimRefs:
              - CP005
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP008
              - CP010
              - CP011
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP007
              - CP009
              - CP010
      - number: '3.3'
        title: 护城河持久性、转换成本与品类扩张
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 的主要结构性护城河来自超过 59,200 份公开检查清单模板、覆盖 85,000 家客户组织的品牌普及度，以及在多地点一线团队中的深度工作流集成。但一线转换成本低，加上现代 AI
              快速生成基础数字表单，使这道清单护城河的持久性受到挑战。为摆脱只做安全审计工具的品类标签，公司于 2026 年 8 月全面更名为
              Mitti，引入自主后台代理、从照片输入自动创建问题以及多地点基准比较。尽管公司把自己重定位成横跨软件、硬件和商业保险的一体化运营平台，SafetyCulture 仍面临 MaintainX
              等最佳单品维护平台及垂直安全工具的强力阻击，后者拥有更紧密的运营集成和更高的工作流锁定。
            claimRefs:
              - CP006
              - CP012
              - CP013
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP008
      - number: '3.4'
        title: 证据展项
        blocks:
          - type: callout
            title: 更名必要性与品类陷阱
            body: >-
              SafetyCulture 于 2026 年 8 月更名为 Mitti，反映出其急于摆脱安全部门标签。平台虽擅长清单采集，但低成本表单构建器的商品化竞争及 CMMS
              厂商的蚕食，可能压低企业估值倍数，除非公司成功将新的 AI 代理和一体化保险业务变现。
            calloutType: risk
            claimRefs:
              - CP006
              - CP013
              - CP015
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、变现渠道与定价架构
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 的软件收入主要来自按席位计费的 SaaS 订阅，服务于其移动优先的一线巡检、问题跟踪和运营平台。该软件过去称为 iAuditor，2026 年 8 月随母公司一起更名为
              Mitti，采用经典的免费增值和“先落地、再扩张”获客架构。免费档提供入门功能，上限为 10 个席位和 5 个活跃检查清单模板，把一线团队导向付费档。付费 SaaS 以标准 Premium
              档为核心，年付为每席位每月 USD 24（月付则为每席位 USD 29）；全企业部署需要定制合同、批量折扣和专属客户管理。除核心巡检订阅外，SafetyCulture 还系统性扩展到相邻产品：通过
              EdApp（SC Training）提供移动优先的微学习和合规培训；提供用于设施与环境跟踪的 IoT 传感硬件及监测遥测；通过线上店铺销售实体耗材；并通过保险 MGA
              部门提供专业商业财产及意外险保障。该部门重新采用 Mitti Insurance 品牌，已在 51 个美国州及辖区获许可。多渠道结构扩大了客户终身价值，但软件席位订阅仍是主要经济引擎。
