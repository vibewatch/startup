  - id: FI001
    title: SafetyCulture 一线工作流向收入与利润率转化模型
    type: flow
    summary: 结构化模型展示一线移动员工的参与度如何经过逐步拓展的产品层级，转化为软件订阅收入及多元化变现。
    data:
      nodes:
        - id: node-1
          label: 一线移动员工采用
          role: Top-of-funnel entry via free mobile inspection checklists and incident capture across job sites
          tone: positive
        - id: node-2
          label: 团队级落地与拓展转化
          role: Exceeding 10 free seats or 5 templates triggers upgrade to Premium tier at USD 24-29/seat/mo
          tone: positive
        - id: node-3
          label: 企业 SaaS 扩张
          role: Multi-site rollout with custom integrations, enterprise analytics dashboards, and unified compliance
          tone: positive
        - id: node-4
          label: 多元收入相邻业务交叉销售
          role: Monetization expansion into EdApp micro-learning, IoT sensors, consumables, and Mitti Insurance
          tone: neutral
        - id: node-5
          label: 运营成本结构
          role: Engineering talent, AWS hosting infrastructure, and GTM sales overhead consuming subscription gross profits
          tone: neutral
        - id: node-6
          label: 净现金流与资产负债表续航
          role: >-
            High-margin subscription software revenue balanced against historical accounting losses and US MGA
            investments
          tone: warning
      edges:
        - from: node-1
          to: node-2
          label: 免费增值门槛
        - from: node-2
          to: node-3
          label: 企业签约
        - from: node-3
          to: node-4
          label: 产品组合交叉销售
        - from: node-4
          to: node-5
          label: 成本吸收
        - from: node-5
          to: node-6
          label: 净利润率兑现
    approximationNotes: 示意性运营流程，描绘商业模式如何从一线员工使用推进至综合现金利润率的产生。
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI012
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 多层运营技术栈，展示移动端现场采集、开发者集成服务、AWS 湖仓存储及分析建模。
    data:
      layers:
        - label: 展示与边缘采集层
          detail: 支持跨平台的 iOS 和 Android 移动应用，具备离线持久化、相机 / 媒体采集及二维码事件触发入口。
        - label: 集成与合作伙伴连接层
          detail: Mitti Developer Portal 承载 REST API、实时 Webhook，以及面向 Procore、Salesforce 和企业 ERP 的预构建连接器。
        - label: 身份与安全治理层
          detail: 通过 SAML 2.0 实现企业单点登录，借助 SCIM 自动配置目录，并采用基于角色的访问控制。
        - label: 数据湖摄取层
          detail: AWS S3 Medallion 存储架构将原始 Bronze JSON 流、整理后的 Silver Parquet 文件和可供 SQL 使用的 Gold 数据集分层存储。
        - label: 企业分析与建模层
          detail: Athena 和 Redshift SQL 数仓计算、dbt Cloud 语义转换流水线，以及 Tableau 运营 KPI 仪表盘。
        - label: AI 与自动化智能层
          detail: 后台工作流自动化代理、基于视觉的照片问题创建，以及跨多个地点的五星绩效基准比较。
    approximationNotes: 基于已发布的开发者文档和 AWS 参考合作伙伴架构绘制的逻辑架构示意。
    claimRefs:
      - CE004
      - CE010
      - CE011
      - CE012
  - id: FU001
    title: SafetyCulture 一线客户获取、参与和扩张旅程图
    type: journey-map
    summary: 可视化展示客户从首次移动检查试用，到 AI 辅助资格筛选、企业部署及运营扩张的完整推进路径。
    data:
      items:
        - label: 1. 一线用户主动发现
          stage: 漏斗顶部主动获客
          userRole: Site Supervisor / Field Inspector
          touchpoints:
            - 在 iOS/Android 上下载 iAuditor 移动应用
            - 访问包含 59,216 份检查清单的免费模板库
            - 在现场无网络连接时执行离线检查
          painPoint: Paper inspection binders and fragmented compliance reporting
          sentiment: positive
        - label: 2. 自主 AI 资格筛选
          stage: 线索分流与转化
          userRole: Inside Sales / AI Sales Agent Bosh
          touchpoints:
            - Bosh AI 代理分析流入的公司资料和 CRM 信号
            - 自动执行全天候个性化跟进与异议处理
            - 直接与专属客户经理预约时间
          painPoint: High inbound volume historically causing qualified leads to go cold
          sentiment: positive
        - label: 3. 团队与部门落地
          stage: 商业采购
          userRole: EHS Manager / Plant Operations Lead
          touchpoints:
            - 升级至 Premium 方案，价格为每席位每月 USD 24
            - 标准化自定义检查清单模板和问题跟踪
            - 落地基础行动分派和纠正措施签核
          painPoint: Procurement resistance to enterprise safety labeling
          sentiment: neutral
        - label: 4. 多地点企业扩张
          stage: 企业部署
          userRole: VP of Safety / Chief Risk Officer
          touchpoints:
            - 部署至多个工厂设施或零售门店
            - 集成 Procore、dbt Labs 和 Couchbase 数据工作流
            - 采用集成式 EdApp 培训和 IoT 传感器监测
          painPoint: Tracking multi-site compliance consistency and reporting
          sentiment: positive
        - label: 5. 运营 AI 转型
          stage: 全平台扩张
          userRole: Chief Operating Officer / General Manager
          touchpoints:
            - 采用 2026 Mitti AI Agents 和自动问题生成
            - 在各设施地点利用 5 Star Benchmarking
            - 评估 Mitti Insurance 的捆绑承保方案
          painPoint: Overcoming 2026 brand confusion during contract renewal cycles
          sentiment: caution
        - label: 6. 续约、扩张与持久性
          stage: 持续留存与落地拓展
          userRole: VP of Procurement / Enterprise Account Executive
          touchpoints:
            - 年度许可证续约和按用量分层重新议价
            - 将许可证从安全团队扩展至其他部门
            - 与核心 ERP、HR 和 BI 系统进行 API 集成
          painPoint: Lack of transparent cohort retention and NRR data
          sentiment: neutral
    approximationNotes: 旅程图阶段反映有文档记录的产品驱动扩张机制、Relevance AI 销售自动化工作流及 2026 Mitti 平台能力。
    claimRefs:
      - CU002
      - CU007
      - CU008
      - CU009
      - CU014
      - CU016
  - id: FR001
    title: 企业风险评估矩阵
    type: matrix
    summary: 从可能性、影响和缓解措施成熟度三个维度评估 SafetyCulture 的企业风险。
    data:
      columns:
        - 可能性
        - 影响
        - 缓解措施成熟度
        - 剩余风险评分
      rows:
        - label: 高管诉讼与股权索赔
          values:
            - 中
            - 高
            - 发展中
            - 较高
        - label: 员工重组与人才流失
          values:
            - 高
            - 高
            - 初期
            - 严重
        - label: 企业品牌重塑的采用阻力
          values:
            - 中
            - 中
            - 中等
            - 中等
        - label: 云基础设施集中度（AWS）
          values:
            - 低
            - 严重
            - 成熟
            - 较高
        - label: 财务不透明与估值倍数
          values:
            - 高
            - 高
            - 低
            - 严重
        - label: 网络安全与数据泄露风险
          values:
            - 低
            - 严重
            - 成熟
            - 可控
    approximationNotes: 基于公开披露、技术白皮书和运营文件综合得出的定性多维评分。
    claimRefs:
      - CR001
      - CR004
      - CR006
      - CR007
      - CR011
      - CR014
      - CR015
  - id: FV001
    title: 估值逻辑与建议流程
    type: flow
    summary: 从运营证据和估值倍数出发，系统化推导最终的 Track 建议。
    data:
      nodes:
        - id: operational-scale
          label: 一线规模：85,000 名客户和 2M+ 用户证明产品市场匹配
        - id: revenue-evidence
          label: 收入基线：预计 ARR 为 $90.3M-$100M+，盈利能力尚未确认
        - id: valuation-pricing
          label: 估值定价：AU$2.5B（$1.65B USD）对应 18x-21.4x ARR 倍数
        - id: comparative-discipline
          label: 估值核验：相较公开 SaaS 公司 6x-8x 的中位数，18x-21.4x 倍数偏高
        - id: risk-adjustments
          label: 风险调整：$200M 估值下调、领导层更替及 Mitti 品牌重塑不确定性
        - id: recommendation-track
          label: 最终立场：建议 Track；待估值或披露重置后再投资
      edges:
        - from: operational-scale
          to: revenue-evidence
        - from: revenue-evidence
          to: valuation-pricing
        - from: valuation-pricing
          to: comparative-discipline
        - from: comparative-discipline
          to: risk-adjustments
        - from: risk-adjustments
          to: recommendation-track
    approximationNotes: 流程展示投资委员会如何依次推导出 Track 立场。
    claimRefs:
      - CV001
      - CV003
      - CV008
      - CV013
      - CV014
      - CV016
