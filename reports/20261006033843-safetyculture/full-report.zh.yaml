      - number: '5.3'
        title: 架构、数据接入与企业集成
        blocks:
          - type: paragraph
            body: >
              SafetyCulture 的技术架构采用分布式云基础设施，主要部署在 Amazon Web Services（AWS）上。移动设备提交的一线运营记录、传感器读数和媒体附件经 API
              网关处理后，进入多层数据存储环境。企业客户用结构化 Medallion 架构把运营数据集提取到集中式云数据湖：原始交易载荷以分区 JSON 文件落入 Amazon S3 Bronze 存储，经 AWS Glue
              和 Apache Spark 任务清洗并扁平化为 Silver Parquet 格式，再加载至可通过 Amazon Redshift 或 Athena 访问的 Gold 分析模型。

              在内部，SafetyCulture 通过部署 dbt Cloud 管理海量客户使用数据的逻辑和物理转换，令查询管线延迟从 17 分钟降至 4 分钟，同时跟踪运营 OKR
              和客户扩张向量。为把一线数据接入企业事实系统，SafetyCulture 提供直接 REST API、webhook 订阅，以及 Procore、Salesforce、Microsoft Power BI 和
              Tableau 等系统的预配置连接器。企业身份控制包括 SAML 2.0 单点登录（SSO）和按 SCIM 标准自动配置用户生命周期。
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
