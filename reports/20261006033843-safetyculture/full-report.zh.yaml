      - number: '5.4'
        title: 信任、网络安全治理与技术尽调缺口
        blocks:
          - type: paragraph
            body: >
              部署于重工业、关键基础设施和受监管设施的运营软件，对数据完整性、隐私和持续可用性有严格要求。截至 2026 年 10 月，公开网络安全数据库和泄露监测库未记录针对 SafetyCulture
              的已确认数据泄露事件或监管网络安全执法行动。传输中数据采用现代 TLS 协议保护，多租户云存储按基于角色的访问控制及租户隔离边界分区。

              尽管历史安全记录干净，技术尽调仍发现若干运营架构依赖。视觉隐患识别和自动后台代理等生产 AI
              功能依赖第三方基础模型及云基础设施，而这些供应商没有公布其在嘈杂现场环境中的延迟或准确率基准。此外，开发者门户虽公开了巡检和用户管理的大量端点，但 SOC 2 Type II
              鉴证报告、欧洲及政府账户的区域数据主权选项等正式企业认证，仍需通过专门虚拟数据室文件验证。
            claimRefs:
              - CE014
              - CE015
              - CE016
