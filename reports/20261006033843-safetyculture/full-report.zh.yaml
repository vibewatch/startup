        - $130M USD
        - 10.0x
        - $1,300M USD
        - '-21% ($1.3B)'
        - ARR 稳定保持 20% CAGR，美国市场取得中等进展，倍数压缩至软件同业中位数
      - - 悲观情景
        - 35%
        - $105M USD
        - 6.0x
        - $630M USD
        - '-62% ($0.63B)'
        - 增长放缓至个位数，品牌摩擦加剧流失，倍数跌至 6x
    notes: 估值情景以 2025 年 ARR 基线估算值 $90.3M 为基础，对截至 2028 年的退出价值建模，并采用不同的倍数压缩假设。
    claimRefs:
      - CV003
      - CV008
      - CV013
      - CV014
      - CV015
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 基于现有来源的公司成立、产品扩张、融资、收购、领导层变动和 Mitti 品牌重塑时间线。
    data:
      items:
        - date: '2004'
          label: 成立
          detail: Luke Anear 在澳大利亚创立 SafetyCulture。
          tone: neutral
        - date: '2012'
          label: iAuditor 上线
          detail: 移动检查清单和检查应用成为旗舰产品。
          tone: positive
        - date: '2014'
          label: 国际扩张
          detail: 公司历史资料记录了国际扩张的开始。
          tone: positive
        - date: 2018-05
          label: Series C 轮
          detail: 融资数据库记录了一轮 $45 million 融资，估值为 $330 million。
          tone: positive
        - date: '2020'
          label: 产品与资本扩张
          detail: 公司筹集增长资本，并收购培训产品 EdApp。
          tone: positive
        - date: 2021-05
          label: 大额增长轮
          detail: Tracxn 记录了一轮 $76.5 million 融资，投后估值为 $1.7 billion。
          tone: positive
        - date: 2022-04
          label: 收购 SHEQSY
          detail: SafetyCulture 收购了单人作业安全软件公司 SHEQSY。
          tone: positive
        - date: 2023-08
          label: 留存证据中的估值峰值
          detail: 2023 年 8 月融资对应的估值为 AU$2.7 billion。
          tone: positive
        - date: 2024-09
          label: 一级与二级融资
          detail: 这笔 AU$165 million 交易由 AU$75 million 一级资本和 AU$90 million 二级出售组成，估值为 AU$2.5 billion。
          tone: warning
        - date: 2026-02
          label: 创始人回任 CEO
          detail: 第三方报道显示 Luke Anear 回任首席执行官。
          tone: neutral
        - date: '2026-08-11'
          label: SafetyCulture 更名为 Mitti
          detail: 公司和平台采用 Mitti 品牌，但仍是同一家私营企业。
          tone: neutral
    approximationNotes: 日期和交易数字保留留存来源所用的期间和货币；时间线不暗示未披露的所有权或控制权变化。
    claimRefs:
      - CO001
      - CO004
      - CO006
      - CO007
      - CO008
      - CO012
      - CO015
  - id: FM001
    title: 一线运营软件可服务市场金字塔
    type: pyramid
    summary: 分层可服务市场金字塔，将全球无办公桌员工的理论规模与经预算验证的联网软件和核心检查支出进行比较。
    data:
      items:
        - label: 无办公桌员工总数
          value: 2.7B Workers
          detail: 全球非办公桌员工规模（约占全球劳动力的 80%）
        - label: 工业与服务业一线员工
          value: 1.2B Workers
          detail: 制造、建筑、酒店和物流行业的目标无办公桌员工
        - label: 数字化就绪的现场员工
          value: 250M Workers
          detail: 配备企业设备或 BYOD 移动设备的一线员工
        - label: 联网一线现场员工
          value: 40M Target Seats
          detail: 配备专用移动应用的一线主管和熟练检查员
        - label: 活跃一线运营 SaaS 支出
          value: $3.5B Core SaaS
          detail: 当前全球企业和中端市场在 EHS 及一线运营工具上的支出
        - label: SafetyCulture 平台规模
          value: 2M+ Active Users
          detail: 分布于 80,000 家商业客户组织的一线员工
    approximationNotes: 市场人口数据基于全球一线劳动力研究；活跃 SaaS 支出估算反映 EHS 和移动检查软件类别的综合市场研究。
