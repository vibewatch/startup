      - number: '4.3'
        title: 资本充足性、融资依赖与投资判断
        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 的资产负债表和未来现金续航既有强大机构支持，也受到历史经营亏损和后期估值调整的制约。2024 年 9 月，公司完成由 Airtree Ventures 领投、现有投资者参与的
              AU$165M（约 USD 110.7M）后期风险融资，估值约 AU$2.5B（USD 1.7B）。这轮融资之前，公司于 2023 年 8 月以 AU$2.7B 估值融资 AU$34M，相比峰值估值标记下调
              AU$200M。2026 年 2 月，创始人 Luke Anear 回任 CEO，公开任务是把亏损业务重建为 AI 优先的运营企业；此前公司在 2025 年进行了员工结构调整，员工数先收缩后在 2026
              年恢复。若现金管理审慎，2024 年 9 月的注资可提供多年续航，但公司历史上在国际扩张和 51 个美国辖区的保险许可投入期间一直处于会计亏损。从投资判断角度，SafetyCulture
              在移动一线运营领域展现市场领导力，但机构投资者在无法取得私有合并管理账目之前，无法验证运营杠杆、现金消耗率或最终盈利路径。
