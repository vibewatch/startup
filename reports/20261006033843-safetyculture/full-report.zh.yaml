        blocks:
          - type: paragraph
            body: >-
              SafetyCulture 的采用轨迹显示全球一线运营已达到相当规模。截至 2026 年，公司报告服务超过 80,000 家客户组织（历史数字最高曾称 85,000 家）以及遍布 180 个国家的超过 2
              million 名活跃一线员工。平台每年执行超过十亿次运营检查，每日交付约 85,000 节微学习课程。2024
              年初，快速增长的产品驱动型自然流入需求压垮商业市场组织，带来严重的线索筛选瓶颈和行政延迟，客户经理难以手工处理个性化外联与潜客审核。SafetyCulture 没有在运营亏损重组期间激进扩充销售团队，而是与
              Relevance AI 合作，部署由一线市场团队直接配置的自主销售 AI 代理 Bosh。该代理全天候运行在内部 CRM 和 ICP
              标准上，使已预订销售会议数增至三倍、单次会议成本减半、合格销售管道机会翻倍，且不增加工程负担。为扩大漏斗顶部，公司还在工程和产品营销团队通过 Glean 部署企业搜索与工作 AI，综合跨行业客户洞察和 PRD
              周期，节省搜索时间并加快响应客户需求。
