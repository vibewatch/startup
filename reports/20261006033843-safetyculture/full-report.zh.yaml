      - number: '1.2'
        title: 规模口径与 Mitti 定位转向
        blocks:
          - type: paragraph
            body: >-
              2026 年 8 月 11 日更名为 Mitti 不只是视觉更新：公司把网站从 safetyculture.com 切换到
              mitti.com，并将平台定位为一体化一线运营系统。一家竞争对手研究页面独立验证了跳转，并称旧名称把买方认知局限在安全部门。公司发布时声称覆盖 80,000 家组织中的逾 200
              万名一线员工。这些数字显示分发范围广，但仍是公司发起、经第三方转述的规模口径，并非经过审计的客户数或活跃用户数。当前员工估算也不一致：一份 2026 年 8 月资料列出 797 人，而 Tracxn 列出的
              2026 年 7 月 31 日数据为 878 人。没有薪资或人力资源证据，不应把这一范围压缩成精确的当前员工数。
            claimRefs:
              - CO004
              - CO005
              - CO010
              - CO011
      - number: '1.3'
        title: 管理层、董事会覆盖与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              创始人依赖仍是治理层面的核心考量。第三方报道指 Luke Anear 在短暂离任后于 2026 年 2 月回任首席执行官，IBISWorld 也将其列为现任 CEO。一份 2026 年 8 月资料列出
              Edelita Tichepco 任 CFO、Tom Dance 任 CTO、Hamish Grant 任 COO、Anna Wenngren 任首席人力官。Tracxn 另列出四人董事会，由 Anear
              及独立成员 Craig Spencer Tiley、Jan Hammer 和 Richard Charles Spencer Baker
              组成。这些来源覆盖财务、技术、运营、人力和投资者治理职能，但不能替代带日期的公司组织架构图、董事备案或董事会纪要。Anear 回归并立即主导 Mitti 定位转向，既强化了创始人与市场的匹配，也凸显继任风险。
            claimRefs:
              - CO012
              - CO013
