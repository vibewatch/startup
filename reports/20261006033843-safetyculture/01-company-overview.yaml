  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "financial-disclosure"
      missingEvidence: "Audited consolidated revenue, gross margin, accounting loss, operating cash burn, cash balance, runway, and debt or credit facilities."
      whyItMatters: "Revenue is not ARR, accounting loss is not cash burn, and cumulative funding does not establish current liquidity."
      diligencePath: "Request audited financial statements, monthly management accounts, bank statements, debt schedules, and the current cash forecast from the data room."
      relatedQuestionRefs:
        - "QO009"
      relatedTableRefs:
        - "TO001"
    - type: "conflicting-data"
      severity: "material"
      topic: "scale"
      missingEvidence: "A dated payroll roster and active-customer definition reconciling the 797 and 878 headcount estimates and the 80,000-organization claim."
      whyItMatters: "Workforce trajectory and active-customer scale affect operating leverage, productivity, and go-to-market assessment."
      diligencePath: "Obtain monthly headcount by function and geography plus billed-customer and active-user cohort exports."
      relatedQuestionRefs:
        - "QO009"
      relatedTableRefs:
        - "TO001"
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "leadership"
      missingEvidence: "A current company organization chart, director register, board committee roster, and documented succession plan."
      whyItMatters: "Public directories may lag leadership changes and cannot establish actual decision rights or succession readiness."
      diligencePath: "Reconcile the current org chart and director filings with board minutes and executive employment agreements."
      relatedTableRefs:
        - "TO002"
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "ownership"
      missingEvidence: "The fully diluted cap table, security classes, preferences, voting agreements, and participant-level allocation of the 2024 secondary sales."
      whyItMatters: "Named investors and round totals do not establish current ownership, control, or liquidation outcomes."
      diligencePath: "Review the capitalization ledger, shareholder agreements, financing documents, and secondary transaction schedules."
      relatedTableRefs:
        - "TO003"
    - type: "missing-source"
      severity: "minor"
      topic: "adverse-events"
      missingEvidence: "Comprehensive regulator, court, and company incident records beyond one public breach catalog."
      whyItMatters: "Absence from a single catalog is not proof that no security, legal, regulatory, or operational incident occurred."
      diligencePath: "Run jurisdiction-specific court and regulator searches and request the company's incident and litigation registers."
      relatedQuestionRefs:
        - "QO010"
