company:
  name: "SafetyCulture"
chapter:
  number: 1
  title: "Company Overview"
  summary: "SafetyCulture, founded by Luke Anear in 2004 and headquartered in Surry Hills, built a subscription frontline-operations platform around inspections, training, assets, and issue management. The company rebranded to Mitti in August 2026 after a 2024 financing that combined primary and secondary capital at an AU$2.5 billion valuation; reported scale is material, but current headcount, audited financials, debt, and ownership terms remain incompletely disclosed."
sections:
  - id: "identity-and-business-model"
    title: "Identity, origin, and operating model"
    body: >-
      SafetyCulture began in 2004 under founder Luke Anear and is headquartered in
      Surry Hills, Sydney. Independent company profiles consistently describe a
      privately held, subscription-funded, mobile-first platform used for
      inspections, audits, issue management, training, asset management, and
      frontline operational improvement. That product breadth matters because the
      business is no longer adequately described as a safety-checklist application:
      its operating proposition links worker-captured data to corrective workflows
      across safety, quality, compliance, and maintenance. The legal entity and the
      commercial brand should nevertheless be distinguished. SafetyCulture remained
      the report subject while the company and platform moved to the Mitti identity
      in August 2026; accessible public records do not establish that the underlying
      ownership changed with the rebrand.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
    figureRefs:
      - "FO001"
  - id: "scale-and-rebrand"
    title: "Scale claims and the Mitti repositioning"
    body: >-
      The August 11, 2026 rebrand to Mitti was more than a visual refresh: the
      company moved its web identity from safetyculture.com to mitti.com and framed
      the platform as an all-in-one frontline operations system. A competitor
      research page independently verified redirects and reported that the old name
      had confined buyer perception to safety departments. At launch, the company
      claimed more than two million frontline workers across 80,000 organizations.
      Those figures indicate broad distribution but remain company-originated scale
      claims relayed by third parties rather than audited customer or active-user
      counts. Current workforce estimates also conflict: one August 2026 profile
      lists 797 employees, whereas Tracxn lists 878 as of July 31, 2026. This range
      should not be collapsed into a precise current headcount without payroll or HR
      evidence.
    claimRefs:
      - "CO004"
      - "CO005"
      - "CO010"
      - "CO011"
  - id: "leadership-and-governance"
    title: "Leadership, board coverage, and key-person dependence"
    body: >-
      Founder dependence remains a central governance consideration. Third-party
      reporting says Luke Anear returned as chief executive in February 2026 after a
      short period away from the role, and IBISWorld also identifies him as the
      current CEO. An August 2026 profile lists Edelita Tichepco as CFO, Tom Dance as
      CTO, Hamish Grant as COO, and Anna Wenngren as chief people officer. Tracxn
      separately lists a four-person board comprising Anear and independent members
      Craig Spencer Tiley, Jan Hammer, and Richard Charles Spencer Baker. These
      sources provide functional coverage across finance, technology, operations,
      people, and investor governance, but they are not substitutes for a dated
      company organizational chart, director filings, or board minutes. Anear's
      return and immediate leadership of the Mitti repositioning reinforce both
      founder-market fit and succession risk.
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO014"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-disclosure"
    title: "Funding history, valuation, and disclosure limits"
    body: >-
      Multiple databases converge on roughly $298 million of funding across 11
      rounds, although currency conversion and treatment of secondary transactions
      vary. The September 2024 transaction is therefore best stated in its disclosed
      Australian-dollar components: AU$165 million in total, comprising AU$75
      million of primary capital and AU$90 million of secondary sales, at an
      AU$2.5 billion valuation. That valuation was below the AU$2.7 billion level
      associated with the August 2023 raise. IBISWorld reports approximately $201.3
      million of 2025 total revenue, but that metric is not identified as ARR and
      the accessible page does not expose audited statements, margins, cash burn,
      cash available, or debt facilities. Investor participation is visible;
      preference terms, ownership percentages, board-reserved matters, and the
      allocation of secondary proceeds are not. Those omissions prevent a reliable
      fully diluted cap table or runway conclusion.
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO015"
      - "CO016"
    tableRefs:
      - "TO003"
