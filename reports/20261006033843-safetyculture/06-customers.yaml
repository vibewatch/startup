chapter:
  number: 6
  title: "Customers"
  summary: "SafetyCulture serves an extensive frontline customer base spanning over 80,000 to 85,000 organizations and 2 million workers across 180 countries, anchored by heavy enterprise adoption across manufacturing, construction, logistics, and retail. While verified third-party technology tracking confirms enterprise accounts including Coles Group, LG, Magna International, and Air Liquide, the company's customer expansion relies heavily on a product-led land-and-expand motion that historically created top-of-funnel inbound bottlenecks, which the company addressed via automated sales agent deployments. Significant diligence gaps persist around Net Revenue Retention (NRR), gross churn, and exact account revenue concentration, compounded by commercial friction from its August 2026 rebrand to Mitti."
sections:
  - id: "customer-segmentation-and-target-markets"
    title: "Customer Base Segmentation, Buyer Personas, and Industry Verticals"
    body: "SafetyCulture targets decentralized, deskless, and frontline operating environments across industrial and commercial sectors where compliance, safety audits, and continuous operational quality are critical. The core buyer persona historically centered on Environment, Health, and Safety (EHS) managers, quality assurance directors, and risk compliance executives. However, actual users are predominantly mobile deskless workers—ranging from manufacturing floor supervisors and construction foremen to retail store managers and facilities inspectors—who execute daily inspections, hazard assessments, and checklist protocols on mobile devices. Third-party verified technology tracking from Landbase confirms that enterprise deployments concentrate heavily within industrial verticals, led by manufacturing, commercial and residential construction, business services, and grocery retail, with widespread presence across the United States, United Kingdom, Australia, Canada, and New Zealand. Major enterprise accounts verified in commercial usage include retail supermarket giant Coles Group, industrial manufacturing multinational Magna International, consumer electronics conglomerate LG, industrial gas producer Air Liquide, building materials supplier CRH, and public sector organizations such as the State of Texas. Strategic positioning challenges emerged because the legacy SafetyCulture brand pigeonholed the product inside safety departments, limiting software budget access from wider operations and plant management."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-and-operational-scale"
    title: "Adoption Trajectory, Frontline Volume, and Go-to-Market Scaling"
    body: "The adoption trajectory of SafetyCulture demonstrates substantial volume scale across global frontline operations. By 2026, the company reported supporting over 80,000 customer organizations (with historical figures citing up to 85,000 organizations) and more than 2 million active frontline workers across 180 countries. Platform utilization encompasses over one billion operational checks executed annually and approximately 85,000 microlearning lessons delivered daily. In early 2024, rapid product-led inbound interest overwhelmed the commercial go-to-market organization, creating severe lead qualification bottlenecks and administrative latency where account executives struggled to handle personalized outreach and prospect vetting manually. Rather than aggressively expanding sales headcount during a period of operational loss restructuring, SafetyCulture partnered with Relevance AI to deploy an autonomous sales AI agent named Bosh configured directly by frontline go-to-market teams. Operating 24/7 on internal CRM and ICP criteria, the autonomous deployment tripled booked sales meetings, halved the cost per meeting, and doubled qualified sales pipeline opportunities without engineering overhead. Complementing top-of-funnel scaling, the company deployed enterprise search and work AI via Glean across its engineering and product marketing teams to synthesize cross-industry customer insights and PRD cycles, saving search time and accelerating response velocity to customer requirements."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU008"
      - "CU009"
      - "CU010"
      - "CU011"
    tableRefs:
      - "TU002"
  - id: "named-deployments-and-durability-risks"
    title: "Named Customer Proof, Retention Integrity, and Expansion Friction"
    body: "Evidence from verified customer rosters and vendor case studies demonstrates deep production integration in enterprise and mid-market accounts, though contract retention and revenue concentration metrics remain strictly undisclosed. While verified user directories record 300 substantiated enterprise entities operating SafetyCulture iAuditor across 31 index pages, vendor testimonials highlight strategic software dependencies, including mobile database scaling with Couchbase, analytics workflows with dbt Labs, customer insight synthesis with Dovetail, and product analytics tracking with Amplitude. Despite these extensive operational touchpoints, SafetyCulture has not publicly disclosed audited cohort renewal rates, gross revenue retention (GRR), Net Revenue Retention (NRR), or top-customer revenue concentration. Furthermore, commercial friction is highlighted by independent competitor analyses such as Inspecable, which note that SafetyCulture's pricing structure—charging USD 24 per seat monthly on annual plans with premium enterprise tiers—faces pushback in regional or specialized markets where local competitors offer native regulatory registers and local currency billing. Finally, the August 2026 corporate rebrand from SafetyCulture to Mitti introduces transitional customer relationship risk: although domain redirects (safetyculture.com to mitti.com) remain active, the retirement of a 22-year-old category brand creates procurement confusion and contract renewal friction across conservative enterprise procurement departments."
    claimRefs:
      - "CU012"
      - "CU013"
      - "CU014"
      - "CU015"
      - "CU016"
    tableRefs:
      - "TU003"
