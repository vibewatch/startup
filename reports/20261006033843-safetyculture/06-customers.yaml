callouts:
  - calloutType: "strength"
    title: "Proven Product-Led Viral Adoption and Frontline Workflow Utility"
    body: "SafetyCulture's core strength lies in its viral, bottom-up mobile adoption. By offering a functional free tier (up to 10 seats) and a public repository of over 59,000 checklist templates that function offline on mobile devices, the platform embeds itself directly into daily field inspections before formal enterprise procurement is initiated. This product-led motion has established an entrenched user base of 2 million frontline workers."
    claimRefs:
      - "CU006"
      - "CU007"
      - "CU014"
  - calloutType: "risk"
    title: "Opaque Retention Metrics and Brand Transition Resistance"
    body: "Despite boasting 80,000+ customer organizations, SafetyCulture maintains complete opacity regarding customer concentration, Net Revenue Retention (NRR), and annual cohort churn. Compounding this opacity, the August 2026 rebrand to Mitti creates commercial friction: shedding the established SafetyCulture name disrupts search recognition and requires account executives to re-explain the corporate identity during enterprise procurement renewals."
    claimRefs:
      - "CU013"
      - "CU015"
      - "CU016"
