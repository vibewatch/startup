companyProfile:
  summary: >-
    XpressBees (legally Busybees Logistics Solutions Private Limited) is a Pune-based
    Indian e-commerce logistics company founded in 2015 as a spinoff from FirstCry.
    It has grown to cover 20,000+ pincodes, 4,500+ service centres, 250+ hubs, and
    28,000+ delivery partners. The company has raised approximately USD 650 million
    across multiple rounds, most recently a USD 80 million Series G led by Ontario
    Teachers' Pension Plan in November 2023 at a USD 1.4 billion post-money valuation.
    Despite its network scale, XpressBees faces mounting financial pressure: FY25 net
    losses rose 85% to INR 370 crore on nearly flat revenue of INR 2,874 crore, while
    cash and cash equivalents collapsed 87% to INR 172 crore. The core courier business
    (96% of revenue) is loss-making at the EBITDA level (-7.9% margin in FY25), and the
    higher-margin warehousing and B2B segments remain too small to offset these losses.
    Key strategic risks include the internalization of logistics by Meesho through its
    Valmo arm, aggressive competitive positioning by Delhivery, and the absence of any
    confirmed new funding in FY26.
