summary:
  headline: >-
    XpressBees is a network-scale Indian logistics unicorn facing acute cash depletion,
    a stale USD 1.4 billion valuation mark, and existential customer concentration risk
    from Meesho's Valmo internalization -- avoid new investment until liquidity and
    profitability signals improve.
