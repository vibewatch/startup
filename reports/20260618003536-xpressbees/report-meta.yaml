  productSummary: >-
    XpressBees offers express B2C parcel delivery, reverse logistics, dark warehousing
    and 3PL fulfillment, B2B logistics, and cross-border shipping. Core service is
    last-mile delivery to 20,000+ pincodes with same-day or next-day capability in
    metros and 3-5 day delivery to tier-2 and tier-3 markets. Platform includes
    tracking APIs, webhook integrations, order management APIs, and a proprietary
    warehouse management system.
  customerFocus: >-
    E-commerce marketplaces (Meesho, Flipkart, Amazon India), D2C brands (fashion,
    electronics, health, beauty), SME merchants, and B2B enterprise clients.
  businessModel: >-
