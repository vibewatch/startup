      - number: '2.5'
        title: 规模尽调缺口与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >-
              印度电商物流和 CEP 市场在研究来源之间存在严重定义碎片化。IMARC 估算 2025 年市场为 $6.65B，而 Mordor Intelligence 给出 $10.8B——相差
              62%——主要因为边界定义不同（是否纳入 B2B 快递、地面 vs. 空运 vs. 两轮 CEP、仓到门 vs.
              商户到门）。尽调使用者在引用任何单一估算前，应先确认采用的定义。所有主要研究机构都指出，印度物流行业数据透明度低：除上市的 Delhivery
              外，承运商不发布货件量、收益率或市场份额数据。XpressBees、Ekart 和 Ecom Express 的市场份额估算，是从 Registrar of Companies
              备案（收入代理指标）和聚合器货件量估算中推导而来。XpressBees 尚未公开披露 FY25 或 FY26 货件量，使市场份额三角测算不精确。即时零售物流市场规模测算仍处早期；到 2027 年的估算从
              $500M 到 $2B 不等，取决于假设的 GMV 增长和最后一公里收益率，可信独立研究有限。ONDC 对 XpressBees 可服务市场规模的影响，公开资料无法量化——ONDC
              交易量在增长，但归属于特定承运商的确切物流收入无法获得。
            claimRefs:
              - CM035
              - CM036
              - CM037
              - CM038
      - number: '2.6'
        title: 图表
        blocks:
          - type: callout
            title: 印度 CEP 市场结构性庞大，但利润率被压缩
            body: >-
              印度快递物流市场规模 $9–11B，年增长 10–14%，足以支撑多家规模化玩家。但自 2022 年以来，产能过剩和有资金支持的竞争者使单票价格压缩 10–20%。XpressBees
              进入的是正确市场，却处在错误的定价周期：FY25 行业仍在增长，公司收入却持平。复苏要么依靠需求侧货量恢复，要么转向利润率更高的 D2C 和增值服务。
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
              - CM030
          - type: callout
            title: 平台自营物流限制第三方可服务市场
            body: >-
              Flipkart 的 Ekart 和 Amazon Logistics 合计自营处理其约 40–50% 货量，从结构上限制第三方 CEP
              市场。随着印度两大电商平台增长，它们更可能把更多货量转为自营，而不是更少。若 D2C 和 SME 板块增长不够快、无法补偿，这对 XpressBees 这类中型第三方承运商是生存级风险。
            calloutType: risk
            claimRefs:
              - CM029
              - CM031
          - type: callout
            title: D2C 品牌扩张带来溢价货量增长
            body: >-
              FY26 D2C 订单量增长 33%，5,000+ 个活跃 D2C 品牌需要带品牌感的配送体验、退货门户和快速 COD 结算；该板块是 XpressBees 最清晰的利润率扩张路径。相比平台物流客户，D2C
              品牌支付溢价费率，切换成本也更高。
            calloutType: insight
            claimRefs:
              - CM018
              - CM019
              - CM025
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 整合后的竞争格局
        blocks:
          - type: paragraph
            body: >-
              到 2026 年中，印度电商物流格局已不再是一群定位相似的独立玩家混战。市场整合成四类战略群体：以 Delhivery 和 Blue Dart 为代表的上市开放网络承运商；DTDC
              等私人但已规模化的加盟或地面网络；Shiprocket 等商户软件驱动的聚合器；以及 Ekart 和 Amazon Logistics
              等自营车队，它们把包裹量内部化，而不是向更广市场销售中立运力。最重要的结构性事件，是 Delhivery 在 2025 年以 INR 1,407 crore 收购 Ecom
              Express。该交易让印度原第三大电商物流玩家不再作为独立竞争者存在，也把承压产能并入最大的上市对手。因此，XpressBees
              现在面对的市场里，规模化独立玩家更少，但领头玩家更强。公开竞品评论也强化了这种强硬姿态：2026 年 5 月，Delhivery CEO Sahil Barua 明确表示看不到 XpressBees
              存在的理由，传递的是激进自信，而非共存。
