  - id: TP003
    title: 定价 / 打包对比
    columns:
      - 服务商
      - 价格 / 单位 / 合同模式
      - 包含能力
      - 折扣或未知项
      - 含义
    rows:
      - - XpressBees
        - 公开快递费页面提供指示性价格，但企业定价按线路和货量逐项谈判
        - 地面包裹、逆向物流、COD、面向商户的发货工具
        - 公开页面只具方向性；合同费率未披露
        - XpressBees 可能靠定制定价竞争，而不是靠透明标价领先
      - - Delhivery
        - 以合同为主、覆盖广泛企业谈判；公开对比页面把它描述为规模化后有竞争力
        - 全国包裹、零担、仓储、退货、跨境、商户技术
        - 真实实现收益未披露；对比页面由供应商撰写
        - 宽度叠加规模，让 Delhivery 能把更多服务打包进同一个承运商关系
      - - Blue Dart
        - 相比主打地面网络的同行，定价偏高，尤其是航空快递和紧急线路
        - 航空快递、企业文件、限时达、可信 B2B 服务
        - 谈判后的企业折扣透明度有限
        - 速度和信任比最低成本更重要时，客户会选择 Blue Dart
      - - Shiprocket
        - 软件驱动定价，并在合作承运商之间比价；商户可按价格和可达性选择承运商
        - 商户面板、快递聚合、结账工具、比价、SLA 可见性
        - 终端承运商价格随套餐、线路和承运商组合变化
        - Shiprocket 降低单一承运商锁定，削弱独立承运商定价权
      - - DTDC
        - 加盟和账户制定价；公开标价不完整
        - 国内包裹、SME / C2C 覆盖、地面网络触达
        - 公开披露无法给出可直接横比的单位经济
        - DTDC 更靠可获得性和熟悉度竞争，而不是透明价格披露
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly observable pricing and packaging evidence for major alternatives available to merchants as of June
        2026; negotiated enterprise contracts remain private
    notes: 本章刻意不把公开标价页等同于真实企业定价。在该市场里，货量组合、区域、COD、退货和 SLA 承诺都会显著改变净收益。
