      - - 独立全国网络仍然稀缺且有价值
        - Ecom Express 不再是独立同行，但其运力实际上增强了 Delhivery，而不是改善 XpressBees 的位置
        - 高
        - 核实 XpressBees 是否赢得任何 Ecom 流失客户，还是面对更强的 Delhivery
      - - 商户一旦接入就会保持黏性
        - Shiprocket 式聚合让多承运商并用常态化，也让切换承运商在运营上更容易
        - 高
        - 索取头部 D2C 和 SME 账户的 cohort 留存与承运商份额数据
      - - 自营物流不是直接竞争者，因为它们封闭运营
        - 即使封闭运营，Ekart 和 Amazon 也会把有吸引力的包裹量从开放市场拿走，压住可实现规模
        - 高
        - 在可竞争市场结构性缩小的假设下压力测试增长计划
      - - 私有股权结构保留灵活性
        - Delhivery 和 Blue Dart 可把公开市场披露、资产负债表可信度和收购能力当作竞争武器
        - 中
        - 索取更新后的现金跑道、资本开支计划，以及竞争压力下保持价格纪律的证据
    notes: 最高严重性的风险，是那些压缩开放市场或让承运商切换更容易的因素。本登记表聚焦护城河耐久度，而不是报告其他部分已覆盖的通用运营风险。
