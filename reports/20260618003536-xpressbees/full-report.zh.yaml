      - number: '4.2'
        title: 现金状况与跑道
        blocks:
          - type: paragraph
            body: >-
              FY25 最紧迫的资产负债表信号，是现金塌陷。截至 2025 年 3 月，现金及现金等价物从一年前的 INR 1,331 crore 降至 INR 172 crore，下降
              87%，显著削弱战略灵活性。总资产也下降 18% 至 INR 2,133 crore，进一步说明 FY25 不是一个看得见资金充裕扩张的年份。若把 FY25 EBITDA 亏损 INR 228 crore
              作为方向性的年化烧钱代理，披露的年末现金余额意味着，在需要进一步融资或经营表现大幅改善之前，跑道不足九个月。该估算并不完美，因为公开资料没有披露准确月度烧钱、债务摊还、供应商信用变动或营运资金流入。即便有这些保留，已披露现金余额仍太小，无法支撑公司从容走向盈利。举证责任现在转向
              FY26 经营修复、新资本，或二者兼有的证据。
