      - number: '8.6'
        title: 尽调缺口与信息请求
        blocks:
          - type: paragraph
            body: >-
              没有四组缺失数据，投资者不应承销当前估值。第一，管理层必须披露当前现金、债务、应付款账龄和 13 周预测，让过桥轮问题不再只是猜测。第二，公司需要展示头部客户集中度，尤其是 Meesho
              敞口、合同期限和任何货量保证。第三，需要细分毛利率、单票收入以及 B2B 或 3PL 组合，以测试多元化是否真的改善质量。第四，必须披露 cap
              table、清算优先权栈和任何过桥轮条款，普通股回报才有可能精确建模。没有这些，任何点估值都只是叙事标记，而不是可投资估值。
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
          - type: table
            tableRef: TV006
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
      - number: '8.7'
        title: 图表
        blocks:
          - type: callout
            title: 估值标记已经陈旧，但现金消耗没有
            body: 最大的估值问题不只是倍数压缩，而是旧 Series G 价格正被拿来对比一个弱得多的 FY25 流动性位置。
            calloutType: risk
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
          - type: callout
            title: 当前定价已经假设复苏
            body: 在增长持平且 EBITDA 为负的情况下，约 4.1x 收入标记很难自圆其说，尤其是披露更充分的上市同业交易倍数更低。
            calloutType: insight
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV021
          - type: callout
            title: 过桥可选性仍在
            body: 赞助方占比较高意味着 XpressBees 仍可能拿到防御性融资轮，这是牛市情景不为零的主要原因。
            calloutType: strength
            claimRefs:
              - CV029
              - CV042
          - type: callout
            title: 现在还不要承销旧估值
            body: 新资金应等待新一轮融资或 FY26 EBITDA 出现可见修复，再把 2023 年估值视为相关。
            calloutType: recommendation
            claimRefs:
              - CV032
              - CV034
              - CV035
          - type: callout
            title: 收入倍数测算使用粗略汇率桥
            body: 所有 USD 情景和敏感性输出都把 INR 2,874 crore 折算为约 USD 345 million，并用最后投后估值代理企业价值，因为完整债务细节并不公开。
            calloutType: assumption
            claimRefs:
              - CV004
              - CV009
