      - 威胁
      - 严重性
      - 缓释措施 / 尽调问题
    rows:
      - - 二三线服务密度是 XpressBees 的持久优势
        - Delhivery 和 DTDC 也规模化服务非一线线路；该优势可能比管理层表述更窄
        - 高
