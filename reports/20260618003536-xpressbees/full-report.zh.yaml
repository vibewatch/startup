      - number: '1.3'
        title: 融资历史与投资人
        blocks:
          - type: paragraph
            body: >-
              自 2015 年以来，XpressBees 多轮累计融资约 $680 million，2022 年 2 月以 $1.2 billion 估值跻身独角兽，随后在 2023 年 11 月 Series G 后估值达到
              $1.4 billion。早期投资人包括 Elevation Capital（原 SAIF Partners）、IDG Ventures 和 Vertex Ventures，2016 年 Series A 融资
              $12.5M。Alibaba Group 在 2017–2018 年间投资约 $35 million，在 XpressBees 扩展电商物流能力时成为战略伙伴。2020 年 Series E 从
              Investcorp、Norwest Venture Partners 和 Gaja Capital 融资 $110 million，用于扩展仓储和第三方物流。2022 年 2 月，具有转折意义的 Series
              F 融资 $300 million，由首次在亚洲投资的 Blackstone Growth（BXG）领投，TPG Growth 和 ChrysCapital 跟投。该轮包括 $100 million 一级资本和
              $200 million 老股转让，使 Elevation Capital、Alibaba 等早期投资人部分退出，CDH Investments 则完全退出。该轮也以 $1.2 billion
              估值催化公司成为独角兽。2022 年后续交易还包括 Avendus Future Leaders Fund II 投入 INR 195 crore。2023 年初，马来西亚主权财富基金 Khazanah
              Nasional Berhad 投资 $40 million。最近一轮机构融资是 2023 年 11 月 Series G，由 Ontario Teachers' Pension Plan（通过
              Teachers' Venture Growth）投资 $80 million，XpressBees 估值约 $1.4 billion。Ontario Teachers' 表示，这是其在印度的首笔直接 TVG
              投资，并称印度是“关键战略”国家。TechCrunch 报道称，该轮使累计融资达到约 $680 million。Ontario Teachers' 投资被广泛解读为 IPO 前布局；截至 2026 年 6
              月，公司尚未提交红鲱鱼招股书草案。
