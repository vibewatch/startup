      - number: '1.4'
        title: 规模、里程碑与展望
        blocks:
          - type: paragraph
            body: >-
              XpressBees 已建成印度最大的快递物流网络之一，覆盖超过 20,000 个 pincode 和 2,800+ 个城市，依托 4,500+ 个服务中心、250+ 个枢纽和超过 28,000
              名配送伙伴。公司每天处理超过 2.5 million 个订单，成立以来累计配送超过 2 billion 个包裹。关键增长里程碑包括：2021 年收购航运聚合平台 NimbusPost；2021 年 7 月与
              SpiceXpress（SpiceJet 货运部门）建立战略合作以扩展空运；2023 年 8 月全现金收购总部位于 New Delhi 的快递公司 Trackon Courier，扩展 XpressBees
              在印度北部的网络。2025 年 3 月，Fortune India 在“最具潜力创业公司”专题中把 XpressBees 列入五家物流创业公司之一。但截至 FY25
              的财务轨迹显示挑战加重。收入增长几乎停滞——FY25 收入 INR 2,874 crore，仅比 FY24 的 INR 2,831 crore 增长 1.5%，此前年度增长更强。净亏损扩大 85% 至 INR
              370 crore，EBITDA 利润率恶化至 -7.9%，现金及现金等价物下降 87% 至 INR 172 crore。最刺眼的是，2026 年 5 月，Delhivery CEO Sahil Barua
              公开表示：“我不认为 XpressBees 相比三家上市公司有任何结构性优势，也看不到它们存在的理由。” 这句在公开业绩电话会上的负面表态，反映出 XpressBees 在尚未上市时就面临上市对手的竞争压力。尽管
              Series G 被解读为 IPO 前准备，XpressBees 截至 2026 年 6 月仍未提交 IPO 文件。公司转向 B2B 物流、仓储和 ONDC，是试图跳出商品化 B2C
              配送市场、分散业务的战略押注。
