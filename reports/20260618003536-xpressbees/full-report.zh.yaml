  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户基础概览
        blocks:
          - type: paragraph
            body: >-
              XpressBees 面向几类不同买方，而不是一个同质化商户池。官方页面显示，其获客覆盖大型电商平台、D2C 品牌、中小商户，以及使用 B2B
              物流、仓储和供应链支持的企业托运方。这个组合很重要，因为每个细分客群购买的结果不同。大型平台带来密集的每日包裹量，但议价强势，也能多平台分流或把需求内部化。D2C 品牌用 XpressBees
              做履约、末端配送和退货。SME 更受益于 API 和伙伴带来的 onboarding，而不是企业采购周期。B2B 和 3PL
              买方是主要多元化机会，因为他们使用仓储、运输和跨境服务，粘性可能强于单纯包裹线路。公开证据也支持全国性地理覆盖，包括 20,000+ 个 pin code、250+ 个枢纽、主要都市，以及 4,000+
              个二线和三线城市。
