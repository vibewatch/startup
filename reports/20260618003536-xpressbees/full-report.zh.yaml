  - id: TM001
    title: 市场定义表
    columns:
      - 市场细分
      - 范围 / 定义
      - 估算规模（2025–2026）
      - 与 XpressBees 的相关性
      - 主要替代品
    rows:
      - - 印度整体物流
        - 覆盖全部货运、公路、铁路、航空、冷链、仓储、快递；包括国内与跨境
        - $350–380B（整体市场）
        - 更大的行业背景；XpressBees 只在其中一个较窄细分市场竞争
        - 铁路货运、CONCOR、FTL 卡车运输
      - - 印度有组织 3PL 物流
        - 提供 B2B 与 B2C 供应链服务的第三方物流商；不包括企业自建物流
        - ~$50–60B
        - XpressBees 是 3PL 服务商；广义上在该市场竞争
        - 大型企业自建物流
      - - 印度快递、速递与包裹（CEP）
        - 面向 B2C、B2B、C2C 的时效型快递网络配送；包括航空与地面快递
        - $9–10.6B（FY25–FY26）
        - 核心 TAM；XpressBees 的主要竞争场
        - India Post、Blue Dart、DTDC 与 GATI
      - - 印度电商物流
        - 面向线上零售商户的物流服务，包括揽收、分拣、末端配送、逆向物流；有时仅指电子零售
        - $6.65–$10.8B（2025，取决于定义）
        - 主要收入池；XpressBees 约 96% 收入来自电商快递
        - Ekart（Flipkart）、Amazon Logistics、Delhivery 与 Ecom Express
      - - 印度 D2C 物流
        - 面向通过自有渠道或社交电商销售的直面消费者品牌的物流服务；不包括平台型市场
        - ~$7.55B（2025），CAGR 约 6.3%
        - 高优先级增长垂直；单票利润率高于平台物流
        - Shiprocket、NimbusPost（现属 XpressBees）、Pickrr（被 Shiprocket 收购）
      - - 印度即时零售物流
        - 面向 FMCG、杂货、药品的超快速（10–30 分钟）配送；需要本地前置仓网络
        - 早期市场；到 2027 年 $500M–$2B（估算）
        - 早期相邻机会；XpressBees 通过 2026 年试点进入
        - Zepto 自有运力、Swiggy Instamart、Blinkit（Zomato）
    enumerationScope:
