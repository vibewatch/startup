  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心产品平台
        blocks:
          - type: paragraph
            body: >-
              XpressBees 的产品更适合被理解为面向印度商户的端到端商业物流平台，而不是狭义快递 SKU。公司在同一运营伞下销售 B2C 包裹配送、逆向物流、仓储、B2B
              快递和跨境服务，并用全国网络支撑这一商业范围；公司称该网络通过 4,500+ 个服务中心、250+ 个枢纽和 28,000+ 名配送伙伴，覆盖超过 20,000 个
              pincode。这种广度很重要，因为商户通常按工作流组合购买物流：揽收、分拣、干线、配送、退货处理和履约，都会影响转化和复购。因此，XpressBees
              的产品故事与其说是某个单一高端功能，不如说是在同一网络上解决多个发货和履约任务。Trackon 收购和参与 ONDC 进一步表明，管理层正在把产品边界从最初的电商包裹基础，扩展到更广的企业和市场网络相关物流用例。
