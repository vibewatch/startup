  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: FY25 财务表现
        blocks:
          - type: paragraph
            body: >-
              XpressBees 的 FY25 数字描绘的是一家保住规模、却失去财务动能的公司。营业收入达到 INR 2,874 crore，仅比 FY24 的 INR 2,831 crore 增长 1.5%；净亏损从
              INR 200 crore 扩大至 INR 370 crore，EBITDA 亏损从 INR 102 crore 恶化至 INR 228 crore。EBITDA 利润率从 FY24 的 -3.6% 降至
              FY25 的 -7.9%，说明成本增长明显跑赢收入增长。总支出升至 INR 3,334 crore，使公司几乎没有空间吸收折旧、财务成本或营运资金摩擦。ROCE 也从 -14.1% 恶化至
              -29.3%，这与网络型业务确有资产强度、但尚未赚到足够贡献利润来支撑投入资本相一致。因此，财务图景不是暂时性的会计噪音，而是规模化后负经营杠杆的明确信号。
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
