      - number: '2.2'
        title: 市场规模与估算
        blocks:
          - type: paragraph
            body: >-
              多家研究机构发布了印度电商物流和 CEP 板块的市场规模估算，因范围、方法和基准年不同，结果跨度很大。用来锚定 XpressBees 长期机会的 TAM（Total Addressable
              Market），更适合采用印度快递物流（CEP）市场：FY25 约 $9B，按 10.5–12% CAGR 增至 FY30 估算 $14–16B。KPMG 2025 年 8 月快递行业报告估算 FY25 有组织
              CEP 市场约 $9 billion；Mordor Intelligence 在更宽的电商物流定义下给出 2026 年 $10.58B。Expert Market Research 估算 FY24 市场为
              $8.78B、CAGR 10%，对应 FY26 为 $9.66B。按中等到宽口径，这些估算把 2026 年市场框定在 $9–11B。XpressBees 的 Serviceable Addressable
              Market（SAM）更窄：面向电商和 D2C 商户的 B2C 与 C2C 快递配送，不包括 B2B 货运、政府和企业合同物流。SAM 估算为 FY26 $3.5–5B，依据是 B2C/C2C 约占 CEP 总量
              55%（据 Redseer），且 XpressBees 目标客群为中腰部到大型商户。XpressBees 的 Serviceable Obtainable Market（SOM）——即当前收入——FY25 约为
              INR 2,874 crore（~$350M），意味着其在定义的 SAM 中占有 7–10% 份额。印度电商 GMV 提供需求侧锚点：2024 日历年约 $120–140 billion；ET Retail
              引用预测称 2026 年将增至 $163 billion，IBEF 则指出 FY24 财年 e-tail GMV 为 $83 billion。由于平均订单价值（AOV）下降和下单频次提高，货件量增长历史上一直以
              19–23% CAGR 跑在 GMV 增长前面。Redseer 估算 FY26 B2C 货件超过 10+ billion，高于 FY22 的 5 billion。
