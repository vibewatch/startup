        - 重启估值工作，检验新一轮是否清理或维持旧估值
      - - EBITDA 修复
        - FY26 EBITDA 利润率改善至 -3% 或更好
        - 显示与 Delhivery 的利润率差距正在明显收窄
        - 若其他尽调项也改善，可从回避转入观察名单
      - - Meesho 集中度恶化
        - 有证据显示 Valmo 收回更多货量，或 Meesho 仍保持结构性主导
        - 打破独立性论点，并进一步压缩议价能力
        - 转向困境情景承销假设
      - - 无融资且无修复
        - 没有新一轮融资，也看不到流动性改善
        - 过高估值将转化为可能的降价轮或困境出售设置
        - 视当前估值为缺乏支撑
      - - 客户或利润率披露不及预期
        - 大客户集中度或分部经济性比预期更差
        - 证实估值背后的业务质量弱于假设
        - 要求更低入场价，否则不交易
    notes: 前两行是足以支持重新承销的论点打破条件；后三行是放弃触发项，会强化下行情景。
    claimRefs:
      - CV028
      - CV032
      - CV034
      - CV035
      - CV041
  - id: TV006
    title: 最终尽调清单表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 流动性
        - 当前现金、债务、应付款账龄和 13 周现金预测
        - 缺少这些，投资人无法判断桥接融资是否迫在眉睫，还是已经安排好
        - 公司财务团队、贷款人明细和董事会材料
      - - 客户集中度
        - 收入排名前 20 客户、Meesho 占比、合同期限和货量承诺
        - 这决定有多少定价权和流失风险不受管理层控制
        - 商业尽调和客户群组数据室
      - - 分部经济性
        - 快递、仓储、B2B 或 3PL 按件收入对应的毛利率、贡献利润率和收入
        - 这检验多元化究竟提升质量，还是只增加低利润货量
        - 管理账、路线或客户群组盈利切片
      - - 股权结构和优先权
        - 股份类别条款、清算顺位、反稀释保护，以及任何桥接轮结构
        - 若有优先权悬空，普通股回报无法准确建模
        - 法律尽调和融资文件
      - - FY26 交易更新
        - 2025 年 3 月以来的季度收入、EBITDA、包裹量和主要客户变化
        - 只有 FY25 之后运营动能改善，旧 Series G 估值才站得住
        - 董事会材料、审计师复核和月度 MIS
    notes: 这些问题按优先级排序，用来在重审当前估值前回答最低限度的关键问题。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
