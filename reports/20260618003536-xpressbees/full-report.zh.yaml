      - number: '3.3'
        title: 定价、分销与替代压力
        blocks:
          - type: paragraph
            body: >-
              印度包裹物流的买方选择，不只由原始网络质量决定，也同样受分销力量和比价影响。WareIQ 和 NimbusPost 的公开对比页持续把 Delhivery 描述为网络覆盖和企业工具更广，而 XpressBees
              公开费率卡更偏指示性而非合同价，这强化了该市场定价通过谈判完成且不透明的事实。Blue Dart 通常能维持溢价，因为空运快递、确定时效的 B2B 服务和 DHL
              品牌背书，能为紧急货件支撑更高费率；但这也缩窄了它在低成本大众电商包裹中的适配度。Shiprocket
              具有战略重要性，因为它把承运商选择变成软件工作流：商户无需完全绑定某一家运营商，就能跨承运商比较费率、可服务性和 SLA 表现。不过，最大的替代压力来自自营车队。Ekart 和 Amazon Logistics
              并不广泛向外部商户开放，但它们自营处理约 40–50% 平台货量，缩小了 XpressBees 和所有其他开放网络承运商可争夺的包裹池。
            claimRefs:
