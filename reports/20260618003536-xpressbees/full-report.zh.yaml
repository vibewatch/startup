      - number: '3.2'
        title: 开放网络基准
        blocks:
          - type: paragraph
            body: >-
              在中立第三方配送网络中，Delhivery 现在是 XpressBees 最清晰的基准。它已上市、实现盈利，并且明显大于私人同行：FY26 收入 INR 10,486 crore，EBITDA INR 764
              crore，PAT INR 153 crore，配送 1 billion 个包裹。规模、披露和收购能力叠在一起，使它成为最危险的直接对手。Blue Dart 同样规模化且上市，但竞争重心不同：它隶属 DHL
              Group，强调高端空运快递和企业运输，FY26 收入约 INR 6,141 crore，EBITDA 利润率约 10.4%。DTDC 因全国加盟网络和 SME/C2C
              密度仍然重要，尽管其收入和盈利披露不如上市公司严格。Shiprocket 竞争的是商户获取和发货编排，而不是纯干线所有权：它聚合包括 XpressBees 和 Delhivery
              在内的多家承运商，这意味着一旦承运商经济性或 SLA 表现恶化，它可以把商户需求从任何单一网络导走。
