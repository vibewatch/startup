  - id: TI002
    title: 定价 / 变现表
    columns:
      - 产品或服务
      - 价格、单位或合同模型
      - 公开证据
      - 折扣或未知项
      - 来源含义
    rows:
      - - 企业快递合同
        - 按线路、重量档、服务级别和货量承诺谈判
        - 公开来源描述了有规模的快递业务，但未发布全国标准价目表
        - 实现收益、返利、罚款和季节性折扣未披露
        - 收入真实存在，但公开网页证据无法把规模换算成每票盈利能力
      - - 市场平台和 D2C 包裹配送
        - 按票变现，费率卡内嵌 SLA 和逆向物流复杂度
        - 行业基准文章显示，印度包裹价格竞争激烈，且常常低利润
        - 客户特定价格底线和 COD 附加费不公开
        - 公司可能靠谈判后的收益竞争，而不是靠公开标价透明度
      - - 仓储
        - 仓储费加吞吐量或处理量计费
        - 仓储收入 FY24 快速增长，说明包裹配送之外也在变现
        - 合同条款、入住率和转嫁成本未披露
        - 如果规模化，该收入流能改善组合质量，但当前变现细节很薄
      - - B2B 和 3PL 合同
        - 可能是合同驱动定价，按线路、吨位和服务定制
        - 公开公司介绍提到该服务线，但未披露标价
        - 没有合同期限、续约或最低量证据
        - 这是一个可能的盈利杠杆，但公开证据不足以承销
      - - 逆向物流和 COD 服务
        - 与包裹和结算复杂度挂钩的打包或附加定价
        - 运营重要性可见，但收费表不可见
        - 附着率未知，退货带来的利润拖累未知
        - 关键的隐性变现层，可能增厚利润，也可能稀释利润
      - - 公开披露的定价姿态
        - 大多不透明
        - 现有公开来源支持谈判式变现，而不是透明标价
        - 缺少按分部拆分的准确价格实现
        - 公开数据足以勾勒模型，但不足以证明收入质量
    notes: XpressBees 的变现看起来更像谈判定价，而不是菜单式标价；因此公开证据能描述定价机制，却不能证明真实单位收入。
