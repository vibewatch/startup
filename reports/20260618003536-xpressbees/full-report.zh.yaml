      - number: '4.4'
        title: 单位经济与基准
        blocks:
          - type: paragraph
            body: >-
              公开单位经济图景并不完整，但现有证据仍能看出压力所在。货运和处理消耗了 FY25 支出约 73%，约 INR 2,462 crore，使运输密度和线路效率成为关键经济杠杆。在 XpressBees
              这样的网络中，只要单票实现收益率出现温和压缩，而货运、处理和退货相关成本不能同步下降，贡献利润率就会迅速被摧毁。行业基准也指向结构性困难的经营环境：印度物流成本占 GDP
              比重仍高，最后一公里包裹定价往往谈判激烈，高 COD 和退货率让现金转换变慢。Delhivery 提供了最清晰的披露基准。它报告 FY26 收入 INR 10,486 crore、EBITDA 利润率
              7.3%、PAT INR 153 crore；按 EBITDA 利润率计算，XpressBees 比最强上市开放网络同行落后约 15 个百分点。这个差距不能证明 XpressBees
              无法修复，但确实显示执行需要改善的幅度。
