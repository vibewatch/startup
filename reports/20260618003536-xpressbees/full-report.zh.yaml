      - number: '3.4'
        title: 护城河耐久性与尽调含义
        blocks:
          - type: paragraph
            body: >-
              XpressBees 的竞争问题不在于是否存在替代方案，而在于公司面对资本更充足、定位不同或结构性更有利的对手时，是否仍有持久优势。Delhivery
              目前看起来拥有最强护城河，因为它同时具备全国规模、改善中的盈利能力、公开市场融资通道，以及整合弱势同行的能力。Blue Dart 的护城河更窄，但在高端空运快递和企业信任敏感线路上仍然稳固。DTDC
              的护城河在于加盟密度和 SME 熟悉度，但缺少公开财务披露，使耐久性更难有信心地打分。Shiprocket
              的护城河是商户工作流所有权：卖家一旦使用聚合器软件在多家承运商之间多归属，任何单一网络的定价权都会削弱。对 XpressBees 而言，最重要的未决尽调问题包括：相对 Delhivery
              的商户留存、分板块贡献利润率、二线 / 三线线路上真实服务水平差异化，以及行业整合后其网络是否仍显著更便宜或更好。
