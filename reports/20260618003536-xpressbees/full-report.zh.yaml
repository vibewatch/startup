  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 单位
      - 当前数值或状态
      - 收入质量
      - 尽调问题
    rows:
      - - 快递服务
        - 面向电商、D2C 和市场平台商户，按发货挂钩的快递和包裹配送
        - 包裹 / 发货
        - 最新公开披露中约占运营收入的 96%
        - 规模高，但质量较低，因为价格靠谈判，货量可能集中
        - 索取每票实现收益、客户集中度，以及按线路或服务层级拆分的利润率
      - - 仓储和履约
        - 与商户库存和吞吐量挂钩的仓储、处理和订单履约费用
        - 客户合同 / 托盘 / 订单
        - FY24 为 INR 48 crore，FY23 为 INR 0.77 crore
        - 战略价值在改善，但相对总收入仍小
        - 索取 FY25 和 FY26 仓储收入、毛利率和客户数
      - - B2B 物流和 3PL
        - 城际和企业物流、分销、合同供应链服务
        - 合同 / 发货 / 线路
        - 公开披露为增长重点，但未拆分分部收入
        - 如果合同比 B2C 快递货量更黏，收入质量可能更高
        - 索取 B2B 和 3PL 各服务线的分部收入桥和贡献利润率
      - - 增值逆向物流和 COD 处理
        - 附着在包裹量上的退货处理、对账和现金处理流程
        - 包裹 / 退货 / 交易
        - 运营上重要，但公开备案未单独披露
        - 有用的附着收入，但实际定价权不透明
        - 索取附着率、退货率经济性和 COD 浮存影响
      - - 跨境或相邻服务
        - 国内包裹配送之外的附属物流服务
        - 合同 / 发货
        - 公司介绍中提到，但公开财务贡献未量化
        - 能见度低，当前规模下可能较小
        - 索取各相邻业务经审计收入拆分和增长展望
    notes: 公开证据支持这样一种收入模型：已经具备规模，但仍然集中；快递服务占主导，仓储是披露最清楚的多元化切入口。
