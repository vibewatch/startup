            body: >-
              合在一起看，客户图景有吸引力，但不完整。XpressBees
              显然有有意义的市场采用、广泛的地理可服务性，以及横跨多个商业垂直领域的可识别客户名单。但现有证据仍留下三个承销缺口。第一，总客户数不如活跃客户质量重要，因为大型平台可以主导货量并压低价格。第二，logo
              可见不等于收入留存；商户可以仍是客户，却把有意义份额转给另一家承运商或内部车队。第三，公开来源没有展示细分层面的利润率或账户集中度趋势，因此外部无法验证摆脱 Meesho 的多元化速度。下一步客户尽调应聚焦前
              10 大客户收入集中度、Meesho 按季度份额、D2C 与 B2B cohort 留存、细分层面毛利率，而不是追逐虚荣客户数量。
