            body: >-
              即使保留来源未确认针对 XpressBees 的重大执法行动，监管敞口也在上升。GST 2.0 推动物流运营商加强电子发票、电子运单集成和对账纪律；2026 年部门审查也越来越被描述为 AI
              打分、数据驱动。跨州运营的包裹网络还面临各州特定的运输和车辆规则；当供应商、货运和发票数据不能干净匹配时，文件风险会反复出现。劳工敞口很重要，因为公司公开提及超过 28,000
              名配送伙伴，任何零工分类、福利义务或伙伴合规执法的变化都可能带来有意义的财务影响。隐私义务在印度 DPDP 制度下也相关，因为货运记录、地址、电话号码和商户数据都嵌在运营工作流里。
