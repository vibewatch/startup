        - ~$6.65B（2025，IMARC）
        - CAGR 14.5%，到 2030 年约 $12.9B
        - IMARC Group
        - 中
      - - SAM：面向电商与 D2C 的 B2C/C2C 快递
        - 通过第三方快递承运商配送的 B2C 与 C2C 包裹；不包括平台自建物流（Ekart、Amazon）和 B2B 货运
        - ~$3.5–5B（FY26 估算；B2C = CEP 约 55%，再扣除自建物流）
        - CAGR 11–14%，与包裹量增长一致
        - Redseer、KPMG（推导）
        - 低
