        - FY25 同比 1.5%（停滞）；历史 CAGR 更高
        - Entrackr / MCA 申报数据
        - 高
      - - 需求侧：印度电商 GMV
        - 印度电商总商品交易额（B2C 与 B2B2C 线上零售）
        - $120–140B（CY2024）；$163B（ET Retail 预计 2026）
        - CAGR 18–22%
        - IBEF、ET Retail 与 Unicommerce
        - 中
