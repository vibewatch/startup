    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              XpressBees 的法律主体是 Busybees Logistics Solutions Private Limited，一家位于 Maharashtra 邦 Pune 的私人有限公司。公司成立于 2015
              年，由 Amitava Saha 和 Supam Maheshwari 共同创办的印度母婴儿童电商平台 FirstCry 拆分而来。XpressBees 独立后，Amitava Saha 从 FirstCry
              首席运营官转任 XpressBees 创始 CEO。Supam Maheshwari 因 FirstCry 渊源，技术上是 XpressBees 联合创始人，但他一直留任 FirstCry CEO，并不参与
              XpressBees 运营。XpressBees 是第三方物流（3PL）和快递服务商，服务覆盖包裹配送、逆向物流、仓储与履约、B2B 供应链服务和跨境运输。公司主要收入来自面向电商玩家的快递服务，占 FY25
              营业收入 96%。客户覆盖 Meesho、Lenskart、Xiaomi、Paytm、NetMeds 等印度主要电商平台，也包括数千个 D2C 品牌和 SME 商户。为分散收入来源，公司已从电商根基扩展到 B2B
              物流、仓储与履约服务以及第三方物流（3PL）。截至 2025 年 3 月，XpressBees 称其运营约 4,500 个服务中心和 250 个枢纽，并合作超过 28,000 名配送伙伴。2023
              年末，公司作为物流服务商加入印度政府支持的 ONDC（Open Network for Digital Commerce），把可触达市场扩展到该网络上的小商户交易。
