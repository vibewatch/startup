      - number: '2.3'
        title: 买方分层与结构
        blocks:
          - type: paragraph
            body: >-
              XpressBees 的买方宇宙覆盖五个主要板块：（1）大型电商平台，（2）D2C（direct-to-consumer）品牌，（3）市场平台和 ONDC 上的 SME/MSME 卖家，（4）B2B
              企业发货方，（5）社交电商和即时零售运营商。大型平台（Meesho、Flipkart、Amazon、Myntra、Ajio）量最大、利润率最低。它们强势谈判单票费率（B2C 最后一公里通常每票 INR
              45–80），贡献 CEP 承运商 40–60% 货量，并经常在 2–4 家物流商之间多归属。平台切换成本低；XpressBees 在这里的关键差异化是二线 / 三线城市的区域 pincode 覆盖和
              COD（Cash on Delivery）管理。D2C 品牌是价值最高的增长板块。Unicommerce 的 India D2C Report 2026 显示，FY26 D2C 订单量增长 33%，超过
              5,000 个活跃 D2C 品牌依赖第三方物流。D2C 品牌优先看重速度、退货管理和 COD 结算；由于技术集成和 SLA
              更定制化，它们的切换成本高于大型平台。该板块能为快递承运商带来溢价定价和更高利润率。MSME 和 SME 卖家——截至 2025 年，估算有 10+ million 个 MSME 卖家活跃在电商平台上——通常通过
              Shiprocket 等聚合器，或直接通过 XpressBees 的 SME 门户触达。单个 SME 发货方平均量低（10–50 票 / 天），但生态内 SME 总量合计占平台包裹量
              30–40%。XpressBees 收购 NimbusPost（2021）为该板块增加了技术层。B2B 企业发货方使用 XpressBees 的 B2B 快递服务寄送文件、样品和城际商业货运。该板块增长较慢，但在
              B2C 量下滑时提供逆周期收入稳定性。社交电商（Instagram、WhatsApp 驱动的品牌）和即时零售（Zepto、Blinkit、Swiggy Instamart）正在成为新兴买方板块；Cargo
              Insights 报道称，Delhivery 和 XpressBees 都在 2025–2026 年进入即时零售领域，以捕捉该需求。
