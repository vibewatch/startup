      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              印度快递物流市场受益于数个将持续到 2030 年的长期增长驱动。印度零售的电商渗透率约 8–10%，相比中国 30%+、全球 20%+ 仍有大幅空间。互联网渗透——尤其是二线 / 三线城镇的移动宽带——在
              2025 年突破 900 million 用户，催化服务不足地区的首次线上购物人群。政府的 PM GatiShakti National Master Plan
              和专用货运走廊投资正在降低物流成本和运输时间，利好接入公路货运网络的快递承运商。印度物流成本约占 GDP 14–16%，而发达市场为
              8–9%；这种结构性低效既为技术赋能物流商创造增长机会，也带来改革压力，最终会奖励高效率运营商。政府的 ONDC（Open Network for Digital
              Commerce）正在创造数百万新增数字商户交易，全部需要最后一公里配送。Brickwork Ratings 2026 年 3 月行业分析强调，印度非组织化物流（当前占总物流 70–80%）因 GST
              合规要求正在加速正规化，带来对有组织 3PL 服务商的需求。D2C 品牌生态和社交电商渠道（Instagram shopping、WhatsApp
              commerce）也在结构性创造对灵活、技术集成型最后一公里配送的新需求。市场增长和 XpressBees 份额的关键约束包括：（1）价格战：疫情后产能过剩和融资支持的竞争对手（Delhivery、Ecom
              Express、Blue Dart）使单票费率自 2022 年以来下降 10–20%，压缩利润率；（2）平台自营：Flipkart 的 Ekart 和 Amazon Logistics 合计内部处理其
              40–50% 的自有货量，限制第三方可服务市场；（3）退货率：印度电商退货率按品类为 15–40%（时尚最高），推高服务成本；（4）COD（Cash on Delivery）仍占印度电商订单
              50–60%，需要资本密集型回款周期；（5）偏远 pincode 的基础设施缺口推高最后一公里成本。Logistics Insider 在 2026 年指出，行业在 2025
              年增加了大量公路、铁路、港口和航空货运能力，降低成本的同时，也让所有竞争者平等获得基础设施改善。
