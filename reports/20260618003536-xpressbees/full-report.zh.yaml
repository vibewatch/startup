              时，不必先搭一套很深的直接集成。二级报道也把 ONDC 参与视为切入小商户和独立卖家的路径。财务上，多元化故事有一定支撑：FY25 收入几乎持平，说明大客户价格承压；FY24 仓储收入据报从极小基数增长 60
