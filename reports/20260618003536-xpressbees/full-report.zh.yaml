      - number: '6.3'
        title: Meesho Valmo 集中度风险
        blocks:
          - type: paragraph
            body: >-
              最重要的客户问题不是 XpressBees 有没有 logo，而是公司对 Meesho 仍有多大敞口，以及 Meesho 借 Valmo 建立了多少议价权。多篇近期文章称，Meesho
              曾是独立物流服务商的历史性主导托运方，并把 Valmo 描述为其自有物流部门。2025 和 2026 年的报道称，Valmo 峰值时内部消化了超过 60% 的 Meesho 货运，到 2026 年 5 月又降至
              50% 以下。这个下降方向上有利，因为部分包裹量似乎回到了第三方市场。但风险并未消失。据称 Valmo 的配送价格仍比外部 3PL 低 9% 至 15%，这意味着 Meesho 可以用可信的内部选项迫使
              XpressBees 及同行让价。如果 Meesho 仍是第一大客户，这就是整个尽调案例中最大的单一客户集中度风险。
