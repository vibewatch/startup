              - CE033
              - CE038
      - number: '5.5'
        title: 质量、合规与可靠性
        blocks:
          - type: paragraph
            body: >-
              XpressBees 的产品质量主要体现在服务水位表述、集成功能和客户评价界面，而不是一个正式公开的信任中心。公司宣传的配送时效包括都市线路 1-2 个工作日、二线及以下城市约 3-5 天；API
              和工作流界面则提供 EDD 与 NDR 能力，帮助商户处理异常。评价证据并不一致。TrackParcel 显示评分约为五分之四；Trustpilot
              既有偏企业客户的正面反馈，也有更尖锐的消费者投诉，说明核心平台具备商业可信度，但终端客户体验并不稳定。公开证据也支持其具备印度物流行业的常规合规姿态，但详细的安全、隐私或审计认证并未显著披露。缺少公开
              NPS、信任仪表盘或现代状态页，也限制了外部投资者在可见运营网络之外，对质量主张能给出的信心。
