      - CM026
      - CM027
      - CM028
      - CM029
      - CM030
      - CM031
      - CM032
  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手
      - 类别
      - 规模 / 融资
      - 目标细分
      - 差异化
      - 局限
    rows:
      - - Delhivery
        - 直接开放网络龙头
        - FY26 收入 INR 10,486 Cr；1B 包裹；已上市；盈利
        - 大型电商平台、D2C 品牌、企业
        - 全国一体化网络、公开披露、并购能力、宽产品栈
        - 规模进攻型竞争者；压缩行业价格，也能比同业投入更多
      - - Blue Dart
        - 老牌高端快递
        - FY26 收入 INR 6,141 Cr；PAT 约 INR 240 Cr；DHL 子公司
        - 高端 B2B、航空快递、紧急件
        - 航空网络、企业信任、DHL 品牌、更高利润率
        - 并不天然适合最低成本的大众电商地面包裹
      - - DTDC
        - 老牌加盟式地面网络
        - 每年约 400M+ 票；收入未公开确认
        - SME、C2C、加盟主导的国内包裹
        - 密集加盟网点，小发货方认知度高
        - 公开财务透明度有限；高端技术差异化证明较弱
      - - Shiprocket
        - 聚合器 / 商户 OS
        - 估值约 US$1.17B；融资 $426M+；已递交 IPO
        - SME、D2C 品牌、平台卖家
        - 比价、商户软件、多承运商编排
        - 依赖第三方承运商；不能替代自有全国干线能力
      - - Ekart / Amazon Logistics
        - 平台自建运力
        - 内部处理约 40–50% 平台订单
        - 自有市场和平台货量
        - 稳定自有需求、运营数据优势、平台集成
        - 不向第三方商户广泛开放；主要是缩小 TAM，而非出售开放运力
      - - Shadowfax
        - 相邻本地即时配送专家
        - Flipkart 和 NGP Capital 支持；偏即时零售
        - 本地配送、餐饮、按需服务、即时零售
        - 两轮车密度和快速周转履约
        - 不是全国 B2C 快递网络经济性的主要对标
      - - Ecom Express（历史）
        - 曾经的直接同业；现已被吸收
        - 峰值估值约 INR 7,000 Cr；以 INR 1,407 Cr 出售
        - 历史上做电商包裹配送
        - 困境前拥有全国电商网络覆盖
        - 困境出售给 Delhivery 后不再独立
    enumerationScope:
      coverage: partial
      basis: >-
        Material competitor classes and representative scaled players relevant to XpressBees as of June 2026; excludes
        India Post and smaller regional couriers
    notes: Delhivery 和 Blue Dart 已上市，公开财务可见度最高。DTDC 和 Shadowfax 的规模指标只在公开来源中部分披露。Ecom Express 被纳入，是因为它消失后改变了竞争格局，尽管它已不再独立。
