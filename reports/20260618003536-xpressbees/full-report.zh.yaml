        - 中高（定制集成、品牌化追踪、COD 结算周期）
        - 品牌化体验、退货门户、COD 快速回款
        - 高度匹配；有溢价机会；D2C 是公司明确优先级
      - - SME/MSME 平台卖家
        - 低（单卖家每天 10–500 单；合计规模可观）
        - 高（偏好聚合器做价格比较）
        - 低（聚合平台很容易多归属）
        - 稳定揽收、可负担价格、简单 COD
        - 中等匹配；通过收购 NimbusPost 和 SME 门户触达
      - - B2B 企业发货方（文件、城际）
