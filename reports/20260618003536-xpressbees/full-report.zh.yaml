      - number: '4.5'
        title: 资本结构与融资历史
        blocks:
          - type: paragraph
            body: >-
              历史上，XpressBees 并不缺增长资本渠道。公开数据库和融资追踪机构显示，截至 2023 年 11 月 Series G，累计融资约 USD 650 million；最知名的后期融资包括 2022 年 2
              月由 Blackstone 领投的 USD 300 million Series F，以及 2023 年 11 月 Ontario Teachers' 以约 USD 1.4 billion 估值投资的 USD
              80 million Series G。公开股权结构快照也显示，机构基金掌控公司：基金投资人持有约 63–66%，包括 Alibaba 在内的企业持有约 24%，ESOP 池接近 6%，创始人持股约
              2%。这种结构意味着 XpressBees 仍有强赞助方支持，理论上可以再资本化；但也意味着 2023 年后没有新披露融资这件事很重要。FY26
              没有公开确认的新融资，因此当前资本结构看起来更像一张老化的后期资产负债表，而不是刚获融资的 IPO 前故事。
