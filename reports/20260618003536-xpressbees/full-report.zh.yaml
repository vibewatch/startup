companyProfile:
  summary: >-
    XpressBees（法律主体为 Busybees Logistics Solutions Private Limited）是一家总部位于 Pune 的印度电商物流公司，2015 年从 FirstCry 拆分成立。公司网络已覆盖
    20,000+ 个 pincode、4,500+ 个服务中心、250+ 个枢纽和 28,000+ 名配送伙伴。公司多轮累计融资约 USD 650 million，最近一轮是 2023 年 11 月由 Ontario
    Teachers' Pension Plan 领投的 USD 80 million Series G，投后估值 USD 1.4 billion。网络规模虽大，XpressBees 的财务压力却在加重：FY25 收入几乎持平，为
    INR 2,874 crore，净亏损同比扩大 85% 至 INR 370 crore；现金及现金等价物锐减 87% 至 INR 172 crore。核心快递业务贡献 96% 收入，但 EBITDA 层面仍亏损（FY25 利润率
    -7.9%）；利润率更高的仓储和 B2B 业务规模仍太小，无法抵消亏损。关键战略风险包括 Meesho 通过 Valmo 自建物流、Delhivery 竞争姿态激进，以及 FY26 未确认任何新融资。
