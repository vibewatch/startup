  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 财务与流动性风险
        blocks:
          - type: paragraph
            body: >-
              眼前风险不是理论上的稀释或遥远的 IPO 延迟，而是近期流动性。FY25 结束时，收入几乎持平，EBITDA 亏损扩大至 INR 228 crore，净亏损扩大至 INR 370 crore，ROCE 降至负
              29.3%，现金从一年前的 INR 1,331 crore 崩至 INR 172 crore。用 FY25 EBITDA 亏损作为方向性烧钱代理，意味着截至 2025 年 3
              月，若没有重大经营修复、供应商信用缓解或新资本，跑道不到九个月。公开数据库仍显示最后一轮清晰披露融资在 2023 年 11 月，未确认 FY26
              融资。这一组合造成急迫的过桥轮风险，也大幅压缩了定价、客户留存或营运资本管理上的容错空间。
