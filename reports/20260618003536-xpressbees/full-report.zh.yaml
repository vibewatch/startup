      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              XpressBees 由创始人 Amitava Saha 领导，他担任董事总经理兼 CEO。Saha 曾是 FirstCry 联合创始人，随后把 XpressBees
              打造成印度最大的独立物流平台之一。他带来明确的关键人依赖：几乎所有公开定位和投资人沟通都出自他，一旦离任，会留下实质性领导缺口。高管团队包括首席财务官 Santosh Abbimane、首席运营官 Rahul
              Agrawal、首席商务官 Harshal Bhoi，以及首席人力资源与行政官 Ajoy Clement Salve。董事会除创始人外，还包括主要机构投资者代表——Blackstone
              Growth、TPG、ChrysCapital、Norwest Venture Partners、Investcorp、Ontario Teachers' 和
              Khazanah。公司没有公开披露包含个人姓名的详细董事会构成；XpressBees 是私人公司，其 Registrar of Companies（MCA）备案是权威记录。2025 年，公司任命 Tarun
              Agarwal 为 B2C First Mile Operations 副总裁，显示其仍在核心配送运营上投入人才。截至报告日期，公司未披露重大高管离任或不利治理事件，但创始人集中度意味着，一旦 Saha
              离开或无法履职，执行风险会上升。
