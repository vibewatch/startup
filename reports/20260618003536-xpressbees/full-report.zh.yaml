        - 已上线且具战略意义
        - 将 XpressBees 接入政府支持的商业渠道
        - 需要 ONDC 订单量和商户留存证据
    notes: 产品模块有官方服务页和第三方公司报道支撑；成熟度标签是定性判断，依据是各模块在公开证据中出现的突出程度。
