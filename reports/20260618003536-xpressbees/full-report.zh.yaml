      - number: '4.3'
        title: 收入结构与变现
        blocks:
          - type: paragraph
            body: >-
              公开披露显示，XpressBees 的绝大部分收入仍来自核心快递活动，而非多元物流相邻业务。快递服务约占营业收入 96%，也就是说，货件量、线路组合、谈判后收益率、COD
              强度和退货率仍主导经济模型。仓储收入是多元化最清晰的信号：它从 FY23 的仅 INR 0.77 crore 增至 FY24 的 INR 48 crore，约 60 倍增长，但仓储仍不到 FY24 合并收入
              2%。换句话说，新收入流从极小基数快速增长，却尚未改变公司对核心电商包裹引擎的依赖。公开定价证据也指向谈判式变现，而非透明标价销售。实际收益率很可能因客户规模、地理区域、服务级别协议、COD
              处理、逆向物流复杂度和季节性量承诺而异。因此，收入模型真实且已有规模，但组合仍窄，仅靠公开资料难以精确承销。
