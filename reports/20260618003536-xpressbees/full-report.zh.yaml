      - number: '4.6'
        title: 通往盈利的路径
        blocks:
          - type: paragraph
            body: >-
              通往盈利的路径概念上可见，但数字上尚未证明。第一，XpressBees 需要通过更密的线路、更好的货运采购、更低的退货摩擦和更少非理性客户定价，修复快递经济性。第二，仓储、B2B 物流和更广 3PL
              服务等非快递组合，需要从有趣的相邻业务成长为实质收入贡献者。第三，在 IPO 路径重启前，流动性压力需要缓解。截至 2026 年中，公司尚未向 SEBI 提交
              DRHP，公开记录仍缺月度烧钱、毛利率、货件收益率、客户集中度和 FY26 现金状况。这使外部很难判断公司是真的接近可持续盈利，还是只是在拉长一张赞助方支持的资产负债表。实际尽调结论是，XpressBees
              也许仍有复苏路径，但公开证据尚不足以承销近期 IPO 或自我造血增长故事。
