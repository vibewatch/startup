  productSummary: >-
    XpressBees 提供 B2C 快递包裹配送、逆向物流、暗仓和 3PL 履约、B2B 物流以及跨境运输。核心服务是面向 20,000+ 个 pincode 的最后一公里配送，在都市圈具备当日达或次日达能力，向二线和三线市场提供
    3–5 天配送。平台包含追踪 API、webhook 集成、订单管理 API 和自研仓库管理系统。
  customerFocus: 电商平台（Meesho、Flipkart、Amazon India）、D2C 品牌（时尚、电子、健康、美妆）、SME 商户和 B2B 企业客户。
