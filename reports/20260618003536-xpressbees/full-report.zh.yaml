  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与边界
        blocks:
          - type: paragraph
            body: >-
              XpressBees 位于三个彼此不同但相互重叠的市场交汇处。最宽口径是印度整体物流市场，包括公路货运、铁路、仓储、冷链和快递配送，估算总可服务支出为 $350–380
              billion。其中，第三方物流（3PL）服务商竞争的有组织物流市场约为 $50–60 billion，年增长 8–12%。XpressBees 竞争的是最窄也增长最快的子集：Courier, Express &
              Parcel（CEP）市场，也称快递物流，服务有时效要求的 B2C、C2C 和 B2B 货件。该市场 FY25 约 $9–10.6 billion，到 2030 年 CAGR 为
              10–14%。电商物流子板块——CEP 中专由线上零售货件驱动、XpressBees 可触达的部分——2025 年估算为 $6.65–$10.8 billion，取决于不同市场研究机构采用的定义口径（有的包含
              B2B，有的排除仓到店最后一公里）。估算差异来自纳入口径不同：IMARC（$6.65B）采用较窄定义，排除 B2B 快递；Mordor Intelligence（$10.8B）则把地面快递和 C2C
              板块与电商一起纳入。KPMG 的快递行业报告与 FY25 有组织 CEP 约 ~$9B 的估算一致，这是行业中引用最多的数字。XpressBees 核心服务的替代者包括：（1）大型平台自营物流部门（Amazon
              Logistics、Flipkart Ekart），（2）重资产既有玩家（Blue Dart、DTDC、India Post），（3）通过多家承运商路由的 Shiprocket/NimbusPost 等聚合器。对
              D2C 卖家而言，Easyecom 和 Unicommerce 等 fulfillment-as-a-service（FaaS）服务商可部分替代技术层，但不能替代实体配送网络。相邻增长市场包括即时零售物流（15
              分钟配送）、跨境电商物流、食品和医药冷链物流，以及 B2B 文件追踪溯源（政府和企业）。
