      - number: '7.2'
        title: Competitive and Market Risks
        blocks:
          - type: paragraph
            body: >-
              XpressBees faces a structurally harder market than it did two years ago. Meesho appears to have been a top
              customer, and Valmo demonstrated that a major marketplace can internalize a majority of shipment volume
              while using lower-cost in-house logistics to pressure external carriers. Even if Valmo's in-house share
              slipped below 50 percent by May 2026, the bargaining leverage remains with Meesho rather than with its
              logistics vendors. At the same time, Delhivery has strengthened its position through scale, public-market
              credibility, and the acquisition of Ecom Express for INR 1,407 crore, while its CEO publicly questioned
              why XpressBees should exist at all. The practical implication is that XpressBees is squeezed from both
              sides: customers can internalize demand, and the strongest open-network rival can use density and
              balance-sheet advantage to compress industry economics.
