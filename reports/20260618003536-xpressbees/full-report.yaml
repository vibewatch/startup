      - number: '7.4'
        title: Operational and Execution Risks
        blocks:
          - type: paragraph
            body: >-
              Operational risk is tightly linked to the income statement. Freight and handling represent roughly 73
              percent of total expense, which means fuel, linehaul procurement, load factor, failed delivery, and
              reverse-logistics performance all move EBITDA quickly. Public evidence supports a broad national network,
              but it does not provide audited uptime, incident history, or service-level reporting that would justify
              relying on any precise 99.9 percent reliability narrative. Quality risk is also visible indirectly: public
              review surfaces are mixed, and a delivery model dependent on a large partner workforce and third-party
              carriers is inherently harder to keep uniform across geographies and peak periods. In a stressed liquidity
              position, operational variance becomes doubly dangerous because the company has less cash to absorb
              service failures or price-matching.
