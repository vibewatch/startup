      - number: '4.2'
        title: Cash Position and Runway
        blocks:
          - type: paragraph
            body: >-
              The most urgent balance-sheet signal in FY25 was the collapse in cash. Cash and cash equivalents fell to
              INR 172 crore at March 2025 from INR 1,331 crore a year earlier, an 87% decline that materially reduced
              strategic flexibility. Total assets also fell 18% to INR 2,133 crore, reinforcing that FY25 was not a year
              of visibly well-funded expansion. If the FY25 EBITDA loss of INR 228 crore is used as a directional
              annualized burn proxy, the reported year-end cash balance implied less than nine months of runway before
              further financing or a sharp improvement in operating performance would become necessary. That estimate is
              imperfect because public sources do not disclose exact monthly burn, debt amortization, vendor-credit
              movements, or working-capital inflows. Even with those caveats, the disclosed cash balance was too small
              to underwrite a leisurely path to profitability. The burden of proof now shifts to evidence of FY26
              operating repair, fresh capital, or both.
