  - id: TP001
    title: Competitor profile table
    columns:
      - Competitor
      - Category
      - Scale / Funding
      - Target Segment
      - Differentiation
      - Limitation
    rows:
      - - Delhivery
        - Direct open-network leader
        - FY26 revenue INR 10,486 Cr; 1B parcels; listed; profitable
        - Large e-commerce platforms, D2C brands, enterprises
        - National integrated network, public disclosures, M&A capacity, broad product stack
        - Aggressive scale competitor; compresses industry pricing and can outspend peers
      - - Blue Dart
        - Incumbent premium express
        - FY26 revenue INR 6,141 Cr; PAT ~INR 240 Cr; DHL subsidiary
        - Premium B2B, air express, urgent shipments
        - Air network, enterprise trust, DHL brand, higher margins
        - Less naturally positioned for lowest-cost mass e-commerce ground parcels
      - - DTDC
        - Incumbent franchise ground network
        - ~400M+ shipments annually; revenue not publicly confirmed
        - SME, C2C, franchise-led domestic parcel
        - Dense franchise footprint and familiarity among small shippers
        - Limited public financial transparency; weaker proof of premium technology differentiation
      - - Shiprocket
        - Aggregator / merchant OS
        - ~US$1.17B valuation; $426M+ raised; IPO-filed
        - SMEs, D2C brands, marketplace sellers
        - Rate-shopping, merchant software, multi-carrier orchestration
        - Depends on third-party carriers; not a substitute for owned national linehaul capacity
      - - Ekart / Amazon Logistics
        - Captive platform fleets
        - Handle ~40–50% of platform shipments internally
        - Own marketplace and platform volume
        - Guaranteed captive demand, operational data advantage, platform integration
        - Not broadly open to third-party merchants; reduces TAM more than it sells open capacity
      - - Shadowfax
        - Adjacent hyperlocal specialist
        - Backed by Flipkart and NGP Capital; quick-commerce oriented
        - Hyperlocal, food, on-demand, quick commerce
        - Two-wheeler density and fast-turnaround fulfillment
        - Not the primary benchmark for nationwide B2C express network economics
      - - Ecom Express (legacy)
        - Former direct peer; now absorbed
        - Peak valuation ~INR 7,000 Cr; sold for INR 1,407 Cr
        - Historically e-commerce parcel delivery
        - Had national e-commerce footprint before distress
        - No longer independent after distress sale to Delhivery
