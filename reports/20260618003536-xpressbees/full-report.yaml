            body: >-
              The best diversification story is the shift from a marketplace-heavy parcel book toward D2C, SME,
              warehousing, and B2B use cases. Official D2C and B2B pages show that XpressBees is not just selling
              courier capacity; it is packaging fulfillment, last-mile execution, returns, warehousing, transport, and
              supply-chain support. Partner integrations such as ClickPost lower onboarding friction for merchants who
              want to compare carriers or activate XpressBees without building a deep direct integration first.
              Secondary coverage also points to ONDC participation as a route into smaller merchants and independent
              sellers. Financially, the diversification case has some support: FY25 revenue was nearly flat, suggesting
              price pressure on large accounts, while FY24 warehousing growth was reported at 60x from a tiny base. That
              pattern implies expansion is happening, but it is not yet large enough to offset marketplace pricing
