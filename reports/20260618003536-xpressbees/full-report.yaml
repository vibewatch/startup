      - number: '4.5'
        title: Capital Structure and Funding History
        blocks:
          - type: paragraph
            body: >-
              Historically, XpressBees has not lacked access to growth capital. Public databases and funding trackers
              place cumulative capital raised at roughly USD 650 million through the November 2023 Series G, with the
              best-known late-stage financings being the USD 300 million Series F led by Blackstone in February 2022 and
              the USD 80 million Series G from Ontario Teachers' at an approximately USD 1.4 billion valuation in
              November 2023. Public cap-table snapshots also indicate that institutional funds control the company: fund
              investors hold about 63-66%, enterprises including Alibaba hold roughly 24%, the ESOP pool is near 6%, and
              founder ownership is about 2%. That structure means XpressBees remains heavily sponsor-backed and
              potentially recapitalizable, but it also means the post-2023 absence of a newly disclosed round matters.
              No new FY26 financing has been publicly confirmed, so the capital stack currently looks more like an aging
              late-stage balance sheet than a freshly funded pre-IPO story.
