      - number: '4.4'
        title: Unit Economics and Benchmarks
        blocks:
          - type: paragraph
            body: >-
              The public unit-economics picture is incomplete, but the available evidence still shows where the pressure
              sits. Freight and handling consumed roughly 73% of FY25 expenditure, or about INR 2,462 crore, making
              transportation density and route efficiency the critical economics lever. In a network like XpressBees,
              even modest compression in realized yield per shipment can rapidly destroy contribution margin if freight,
              handling, and return-related costs do not move down in parallel. Industry benchmarks also point to a
              structurally hard operating environment: Indian logistics costs remain high as a share of GDP, last-mile
              parcel pricing is often intensely negotiated, and high COD and return rates keep cash conversion slow.
              Delhivery provides the clearest disclosed benchmark. It reported FY26 revenue of INR 10,486 crore, EBITDA
              margin of 7.3%, and PAT of INR 153 crore, which places XpressBees roughly 15 percentage points behind on
              EBITDA margin versus the strongest listed open-network peer. That gap does not prove XpressBees cannot
              recover, but it does show how far execution must improve.
