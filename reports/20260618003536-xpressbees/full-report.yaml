    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Business Model
        blocks:
          - type: paragraph
            body: >-
              XpressBees is legally incorporated as Busybees Logistics Solutions Private Limited, a private limited
              company based in Pune, Maharashtra. The company was established in 2015 as a corporate spinoff from
              FirstCry, the Indian e-commerce platform for baby and children's products co-founded by Amitava Saha and
              Supam Maheshwari. When XpressBees became independent, Amitava Saha transitioned from his role as Chief
              Operating Officer at FirstCry to become the founding CEO of XpressBees. Supam Maheshwari, while
              technically a co-founder of XpressBees by virtue of the FirstCry origin, has remained at FirstCry as its
              CEO and is not operationally involved in XpressBees. XpressBees operates as a third-party logistics (3PL)
              and express delivery provider, offering services across parcel delivery, reverse logistics, warehousing
              and fulfillment, B2B supply chain services, and cross-border shipping. The company's primary revenue
              stream — accounting for 96% of FY25 operating income — is courier services for e-commerce players. Its
              client base spans major Indian e-commerce platforms including Meesho, Lenskart, Xiaomi, Paytm, and
              NetMeds, as well as thousands of direct-to-consumer (D2C) brands and SME merchants. The company has
              expanded beyond its e-commerce roots into B2B logistics, warehousing and fulfillment services, and
              third-party logistics (3PL) to diversify its revenue base. As of March 2025, XpressBees stated it operated
              about 4,500 service centres and 250 hubs, and engaged more than 28,000 delivery partners. The company
              joined India's government-backed ONDC (Open Network for Digital Commerce) as a logistics provider in late
              2023, expanding its addressable market to small merchants transacting on that network.
