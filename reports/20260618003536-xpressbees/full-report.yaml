            claimRefs:
              - CV009
              - CV021
              - CV028
              - CV032
              - CV033
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV004
              - CV006
              - CV007
              - CV015
              - CV032
              - CV033
              - CV035
      - number: '8.6'
        title: Diligence Gaps and Information Requests
        blocks:
          - type: paragraph
            body: >-
              An investor should not underwrite the current mark without four missing datasets. First, management must
              disclose current cash, debt, payable aging, and a 13-week forecast so the bridge-round question stops
              being speculative. Second, the company needs to show top-customer concentration, especially Meesho
              exposure, contract tenure, and any volume guarantees. Third, segment gross margin, revenue per shipment,
              and B2B or 3PL mix are needed to test whether diversification is genuinely improving quality. Fourth, the
              cap table, preference stack, and any bridge-round terms must be disclosed before common-equity returns can
              be modeled with precision. Without them, any point estimate would be a narrative mark rather than an
              investable valuation.
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
          - type: table
            tableRef: TV006
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: The mark is stale, but the cash burn is not
            body: >-
              The biggest valuation problem is not just multiple compression. It is that the old Series G price is being
              compared against a much weaker FY25 liquidity position.
            calloutType: risk
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
          - type: callout
            title: Current pricing already assumes recovery
            body: >-
              A roughly 4.1x revenue mark on flat growth and negative EBITDA is hard to defend when better-disclosed
              listed peers trade lower.
            calloutType: insight
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV021
          - type: callout
            title: Bridge optionality still exists
            body: >-
              Sponsor-heavy ownership means XpressBees may still secure a defensive round, which is the main reason the
              bull case is not zero.
            calloutType: strength
            claimRefs:
              - CV029
              - CV042
          - type: callout
            title: Do not underwrite the old mark yet
            body: >-
              New money should wait for either a fresh round or visible FY26 EBITDA repair before treating the 2023
              valuation as relevant.
            calloutType: recommendation
            claimRefs:
              - CV032
              - CV034
              - CV035
          - type: callout
            title: Revenue-multiple math uses a rough FX bridge
            body: >-
              All USD scenario and sensitivity outputs translate INR 2,874 crore into roughly USD 345 million and use
              the last post-money mark as a proxy for enterprise value because full debt detail is not public.
            calloutType: assumption
            claimRefs:
              - CV004
