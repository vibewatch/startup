      - number: '6.6'
        title: Customer Concentration and Diversification
        blocks:
          - type: paragraph
            body: >-
              Put together, the customer picture is attractive but incomplete. XpressBees clearly has meaningful market
              adoption, broad geographic serviceability, and a recognizable customer roster across several commerce
              verticals. But the available evidence still leaves three underwriting gaps. First, gross customer count is
              less important than active-customer quality because large platforms can dominate volume while compressing
              price. Second, logo visibility is not the same as revenue retention; a merchant can remain a customer
              while shifting meaningful share to another carrier or to an internal fleet. Third, public sources do not
              show segment-level margin or account concentration trends, so the pace of diversification away from Meesho
              cannot be verified from outside. The next-step customer diligence should therefore focus on top-10 revenue
              concentration, Meesho share by quarter, D2C and B2B cohort retention, and segment-level gross margin
              rather than chasing a vanity customer-count figure.
