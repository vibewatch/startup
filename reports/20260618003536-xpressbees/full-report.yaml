  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Financial and Liquidity Risks
        blocks:
          - type: paragraph
            body: >-
              The immediate risk is not theoretical dilution or a distant IPO delay; it is near-term liquidity. FY25
              ended with revenue almost flat, EBITDA loss worsening to INR 228 crore, net loss widening to INR 370
              crore, ROCE falling to negative 29.3 percent, and cash collapsing to INR 172 crore from INR 1,331 crore a
              year earlier. Using the FY25 EBITDA loss as a directional burn proxy implies less than nine months of
              runway from March 2025 absent a material operating recovery, vendor-credit relief, or fresh capital.
              Public databases still show the last clearly disclosed round in November 2023, with no confirmed FY26
              financing. That combination creates acute bridge-round risk and sharply reduces room for error in pricing,
              client retention, or working-capital management.
            claimRefs:
