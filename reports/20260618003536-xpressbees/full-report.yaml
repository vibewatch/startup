      - number: '6.3'
        title: Meesho Valmo Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              The most important customer question is not whether XpressBees has logos; it is how exposed the company
              remains to Meesho and how much bargaining power Meesho has created through Valmo. Multiple recent articles
              describe Meesho as a historically dominant shipper for independent logistics providers and describe Valmo
              as its captive logistics arm. Coverage in 2025 and 2026 says Valmo had internalized more than 60% of
              Meesho shipments at peak, then slipped below 50% by May 2026. That decline is directionally helpful
              because some parcel volume appears to have returned to the third-party market. It does not remove the
              risk. Valmo is still reported to price deliveries 9% to 15% below external 3PLs, which means Meesho can
              use a credible in-house option to force rate concessions from XpressBees and peers. If Meesho is still the
              top account, this is the single biggest customer concentration risk in the entire diligence case.
            claimRefs:
