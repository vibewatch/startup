      - number: '7.3'
        title: Regulatory and Legal Risks
        blocks:
          - type: paragraph
            body: >-
              Regulatory exposure is rising even if no major enforcement action against XpressBees was confirmed in the
              retained sources. GST 2.0 pushes logistics operators toward tighter e-invoicing, e-way-bill integration,
              and reconciliation discipline, while 2026 departmental scrutiny is increasingly described as AI-scored and
              data-driven. A parcel network operating across states also faces state-specific transport and vehicle
              rules, plus recurring documentation risk when vendor, shipment, and invoice data do not line up cleanly.
              Labor exposure matters because the company publicly references more than 28,000 delivery partners, making
              any shift in gig-worker classification, benefits obligations, or partner-compliance enforcement
              financially meaningful. Privacy obligations are also relevant under India's DPDP regime because shipment
              records, addresses, phone numbers, and merchant data all sit inside the operational workflow.
            claimRefs:
