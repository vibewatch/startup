      - number: '7.6'
        title: Mitigation and Risk Prioritization
        blocks:
          - type: paragraph
            body: >-
              The visible mitigation story exists, but it is incomplete. XpressBees has tried to diversify into
              warehousing, B2B logistics, 3PL services, and ONDC-linked merchant flows, and sponsor backing means a
              recapitalization is possible in principle. None of that fully resolves the central risk stack. The company
              still needs proof of FY26 cash stability, top-customer diversification, audited compliance maturity, and
              evidence that service quality can hold while competing against Delhivery and under Meesho's pricing
              shadow. The practical diligence posture is therefore to prioritize kill criteria: fresh financing or
              self-funded cash stabilization, Meesho exposure trending down, no material regulatory shock, and
              freight-cost discipline strong enough to stop negative operating leverage from compounding.
