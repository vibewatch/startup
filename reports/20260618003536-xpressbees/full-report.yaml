  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Product Platform
        blocks:
          - type: paragraph
            body: >-
              XpressBees' product is best understood as an end-to-end commerce logistics platform for Indian merchants
              rather than as a narrow courier SKU. The company markets B2C parcel delivery, reverse logistics,
              warehousing, B2B express, and cross-border services under one operating umbrella, and it backs that
              commercial scope with a national network that it says reaches more than 20,000 pincodes through 4,500 plus
              service centres, 250 plus hubs, and 28,000 plus delivery partners. That breadth matters because merchants
              typically buy logistics in workflow bundles: order pickup, sortation, linehaul, delivery, return handling,
              and fulfillment all affect conversion and repeat purchase. XpressBees' product story is therefore less
              about a single premium feature and more about solving multiple shipping and fulfillment jobs on one
              network. The Trackon acquisition and ONDC participation further suggest that management is extending the
              product envelope beyond its original e-commerce parcel base into broader enterprise and marketplace-linked
              logistics use cases.
