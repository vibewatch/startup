  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Financial Performance FY25
        blocks:
          - type: paragraph
            body: >-
              XpressBees' FY25 numbers describe a business that retained scale but lost financial momentum. Operating
              revenue reached INR 2,874 crore, up only 1.5% from INR 2,831 crore in FY24, while net loss widened to INR
              370 crore from INR 200 crore and EBITDA loss deteriorated to INR 228 crore from INR 102 crore. EBITDA
              margin moved from -3.6% in FY24 to -7.9% in FY25, showing that cost growth materially outpaced top-line
              growth. Total expenditure rose to INR 3,334 crore, leaving the company with little room to absorb
              depreciation, finance costs, or working-capital friction. ROCE also worsened to -29.3% from -14.1%, which
              is consistent with a network business carrying real asset intensity but not yet earning enough
              contribution margin to justify that deployed capital. The financial picture is therefore not one of
              temporary accounting noise; it is a clear sign of negative operating leverage at scale.
            claimRefs:
