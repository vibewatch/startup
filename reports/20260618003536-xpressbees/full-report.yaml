  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer or service
      - Price, unit, or contract model
      - Public evidence
      - Discounts or unknowns
      - Source implication
    rows:
      - - Enterprise courier contracts
        - Negotiated by lane, weight slab, service level, and volume commitment
        - Public sources describe a scaled courier business but do not publish a standard national price card
        - Realized yield, rebates, penalties, and seasonal discounts are undisclosed
        - Revenue is real, but public web evidence cannot convert scale into per-shipment profitability
      - - Marketplace and D2C parcel delivery
        - Per-shipment monetization with SLA and reverse-logistics complexity embedded in rate cards
        - Industry benchmark articles show Indian parcel rates are highly competitive and often low-margin
        - Client-specific rate floors and COD surcharges are not public
        - The company likely competes through negotiated yields rather than list-price transparency
      - - Warehousing
        - Storage plus throughput or handling-based billing
        - Warehousing revenue grew sharply in FY24, indicating monetization beyond parcel delivery
        - Contract terms, occupancy, and pass-through costs are not disclosed
        - The stream can improve mix quality if scaled, but current monetization detail is thin
      - - B2B and 3PL contracts
        - Likely contract-led pricing with lane, tonnage, and service customisation
        - Public company descriptions mention the service line, but no list pricing is disclosed
        - No evidence on contract tenure, renewal, or minimums
        - This is a plausible profitability lever, but public evidence is insufficient for underwriting
      - - Reverse logistics and COD services
        - Bundled or add-on pricing linked to parcel and settlement complexity
        - Operational importance is visible, but fee schedules are not
        - Unknown attach rates and margin drag from returns
        - A key hidden monetization layer that may be either margin-accretive or margin-dilutive
      - - Publicly disclosed pricing posture
        - Mostly opaque
        - Available public sources support negotiated monetization rather than transparent list pricing
        - Exact price realization by segment is missing
        - Public data is enough to map the model, not enough to prove revenue quality
    notes: >-
      XpressBees' monetization appears more negotiated than menu-priced, so public evidence can describe pricing
      mechanics but not realized unit revenue.
