            body: >-
              XpressBees has built one of India's most extensive express logistics networks, with 20,000+ pincodes,
              4,500+ service centers, 250+ hubs, and 28,000+ delivery partners. The company delivers to more than 2,800
              cities including Tier 2, 3, and 4 markets that many competitors underserve. This network scale creates a
