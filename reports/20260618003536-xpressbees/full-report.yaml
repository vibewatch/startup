      - number: '4.6'
        title: Path to Profitability
        blocks:
          - type: paragraph
            body: >-
              The path to profitability is visible conceptually but not yet proven numerically. First, XpressBees needs
              courier economics to improve through denser routes, better freight procurement, lower returns friction,
              and less irrational client pricing. Second, it needs non-courier mix such as warehousing, B2B logistics,
              and broader 3PL services to grow from interesting adjacency to material revenue contributor. Third, it
              needs liquidity pressure to ease before an IPO path can reopen. As of mid-2026, no DRHP had been filed
              with SEBI, and the public record still omits monthly burn, gross margin, shipment yield, customer
              concentration, and FY26 cash position. That makes it difficult to assess whether the company is genuinely
              approaching sustainable profitability or simply stretching a sponsor-backed balance sheet. The practical
              diligence conclusion is that XpressBees may still have a route to recovery, but public evidence does not
              yet justify underwriting a near-term IPO or a self-funded growth story.
