        title: People and Governance Risks
        blocks:
          - type: paragraph
            body: >-
              Leadership and governance are not the largest risk category, but they are important amplifiers. Amitava
              Saha remains the public CEO and managing director, yet the retained public record does not clearly
              disclose a deputy succession bench or a transparent investor-board composition. That matters because the
              business is simultaneously dealing with liquidity pressure, customer concentration, competitive
              compression, and regulatory complexity. A heavily fund-owned company can still raise capital or change
              course, but governance power may sit more with institutional investors than with founders, which can speed
              decisive action or create recap-driven outcomes that are not aligned with common shareholders or
              employees.
