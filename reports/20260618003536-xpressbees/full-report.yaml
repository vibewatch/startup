      - number: '5.5'
        title: Quality, Compliance, and Reliability
        blocks:
          - type: paragraph
            body: >-
              Product quality at XpressBees is visible mainly through service-level messaging, integration features, and
              customer review surfaces rather than through a formal public trust centre. The company markets fast
              delivery windows such as 1-2 business days for metro lanes and roughly 3-5 days for tier-2 and beyond,
              while its API and workflow surfaces include EDD and NDR capabilities that help merchants manage
              exceptions. Review evidence is mixed. TrackParcel indicates a roughly four-out-of-five rating, while
              Trustpilot contains both positive enterprise-style feedback and sharper consumer complaints, implying that
              the core platform is commercially credible but uneven at the end-customer edge. Public evidence also
              supports a standard Indian logistics compliance posture, yet detailed security, privacy, or audit
              certifications are not prominently disclosed. The absence of a public NPS figure, trust dashboard, or
              modern status artefacts limits how much confidence an outside investor can place in quality claims beyond
              the visible operating network.
