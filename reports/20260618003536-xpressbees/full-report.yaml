            body: >-
              Among neutral, third-party delivery networks, Delhivery is now the clearest benchmark for XpressBees. It
              is public, profitable, and materially larger than private peers, with FY26 revenue of INR 10,486 crore,
              EBITDA of INR 764 crore, PAT of INR 153 crore, and 1 billion parcels delivered. That combination of scale,
              disclosure, and acquisition capacity makes it the most dangerous direct rival. Blue Dart is also scaled
              and public, but its competitive center of gravity is different: it sits inside DHL Group, emphasizes
              premium air express and enterprise shipping, and generated approximately INR 6,141 crore of FY26 revenue
              with EBITDA margin around 10.4%. DTDC remains relevant because of its national franchise network and
              SME/C2C density, even though its revenue and profitability are not publicly disclosed with the same rigor.
              Shiprocket competes on merchant acquisition and shipping orchestration rather than pure linehaul
              ownership: it aggregates multiple carriers, including XpressBees and Delhivery, which means it can steer
