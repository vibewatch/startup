      - number: '2.5'
        title: Sizing Diligence Gaps and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >-
              The India e-commerce logistics and CEP market suffers from significant definitional fragmentation across
              research sources. IMARC estimates the market at $6.65B for 2025, while Mordor Intelligence gives $10.8B —
              a 62% difference — primarily because of differing boundary definitions (B2B express inclusion, surface vs.
              air vs. two-wheeler CEP, warehouse-to-doorstep vs. merchant-to- doorstep). Diligence users should confirm
              which definition is used before referencing any single estimate. All major research firms note that
              India's logistics sector operates with low data transparency: carriers (except the listed Delhivery) do
              not publish shipment volumes, yields, or market-share data. Market share estimates for XpressBees, Ekart,
              and Ecom Express are inferred from Registrar of Companies filings (revenue proxies) and shipment volume
              estimates from aggregators. XpressBees has not publicly disclosed its shipment volume for FY25 or FY26,
              making market-share triangulation imprecise. Quick commerce logistics market sizing is nascent; estimates
              range from $500M to $2B by 2027 depending on assumed GMV growth and last-mile yield, and credible
              independent research is limited. The impact of ONDC on addressable market size for XpressBees is
              unquantified from public sources — ONDC transaction volumes are growing but exact logistics revenue
              attribution to specific carriers is unavailable.
            claimRefs:
              - CM035
              - CM036
              - CM037
              - CM038
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: India's CEP Market Is Structurally Large but Margin-Compressed
            body: >-
              The India express logistics market is a $9–11B market growing at 10–14% annually — large enough to support
              multiple scaled players. However, per-shipment pricing has compressed 10–20% since 2022 due to
              over-capacity and competitive funded players. XpressBees operates in the right market at the wrong moment
              in the pricing cycle, with revenue flat in FY25 despite sector growth. Recovery requires either
              demand-side recovery in volumes or a move toward higher-margin D2C and value-added services.
            calloutType: insight
            claimRefs:
              - CM008
              - CM009
              - CM030
          - type: callout
            title: Platform Captive Logistics Caps Third-Party Addressable Market
            body: >-
              Flipkart's Ekart and Amazon Logistics together handle approximately 40–50% of their own shipment volumes
              captively, structurally limiting the third-party CEP market. As India's two largest e-commerce platforms
              grow, they are likely to captivate more volume, not less. This is an existential risk for mid-size
              third-party carriers like XpressBees if D2C and SME segments don't grow fast enough to compensate.
            calloutType: risk
            claimRefs:
              - CM029
              - CM031
          - type: callout
            title: D2C Brand Proliferation Offers Premium-Rate Volume Growth
            body: >-
              With D2C order volumes growing 33% in FY26 and 5,000+ active D2C brands demanding branded delivery
              experiences, returns portals, and fast COD settlement, this segment represents XpressBees' clearest path
              to margin expansion. D2C brands pay premium rates and have higher switching costs than platform logistics
              customers.
            calloutType: insight
            claimRefs:
              - CM018
              - CM019
              - CM025
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape After Consolidation
        blocks:
          - type: paragraph
            body: >-
              The Indian e-commerce logistics landscape in mid-2026 is no longer a crowded field of similarly positioned
              independents. It has consolidated into four strategic groups: listed open-network carriers led by
              Delhivery and Blue Dart; private but scaled franchise or ground networks such as DTDC; merchant
              software-led aggregators such as Shiprocket; and captive fleets such as Ekart and Amazon Logistics that
              internalize parcel volume rather than selling neutral capacity to the wider market. The most important
              structural event was Delhivery's INR 1,407 crore acquisition of Ecom Express in 2025. That deal removed
              what had been India's third-largest e-commerce logistics player as an independent competitor and folded
              distressed capacity into the largest listed rival. As a result, XpressBees now competes in a market with
              fewer scaled independents but a more formidable lead player. Public competitor commentary reinforces that
              tougher posture: in May 2026, Delhivery CEO Sahil Barua explicitly said he did not see a reason for
              XpressBees to exist, signaling aggressive confidence rather than coexistence.
