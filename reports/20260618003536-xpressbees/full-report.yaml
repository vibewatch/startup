  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Overview
        blocks:
          - type: paragraph
            body: >-
              XpressBees sells into several distinct buyer types rather than one homogeneous merchant pool. Official
              pages show a broad go-to-market that spans large e-commerce marketplaces, D2C brands, small and medium
              merchants, and enterprise shippers using B2B logistics, warehousing, and supply-chain support. That mix
              matters because each segment buys a different outcome. Large marketplaces bring dense daily parcel volume
              but negotiate aggressively and can multi-home or internalize demand. D2C brands use XpressBees for
              fulfillment, last-mile delivery, and returns. SMEs benefit from API and partner-led onboarding rather than
              enterprise procurement cycles. B2B and 3PL buyers are the main diversification opportunity because they
              use warehousing, transport, and cross-border services with potentially better stickiness than pure parcel
              lanes. Public evidence also supports nationwide geographic reach, with coverage across 20,000+ pincodes,
              250+ hubs, major metros, and 4,000+ tier-2 and tier-3 cities.
