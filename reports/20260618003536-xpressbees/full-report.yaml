  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Provider
      - Price / Unit / Contract Model
      - Included Capabilities
      - Discount or Unknowns
      - Implication
    rows:
      - - XpressBees
        - >-
          Indicative public courier-charge pages exist, but enterprise pricing is negotiated lane-by-lane and
          volume-by-volume
        - Surface parcel, reverse logistics, COD, merchant-facing shipping tools
        - Public pages are directional only; contracted rates not disclosed
        - XpressBees likely competes through custom pricing, not transparent list-price leadership
      - - Delhivery
        - >-
          Contract-led pricing with broad enterprise negotiation; public comparison pages frame it as competitive at
          scale
        - National parcel, part-truckload, warehousing, returns, cross-border, merchant tech
        - True realized yields are undisclosed; comparison pages are vendor-authored
        - Breadth plus scale lets Delhivery bundle more services into one carrier relationship
      - - Blue Dart
        - Premium-priced relative to ground-focused peers, especially for air-express and urgent lanes
        - Air express, enterprise documents, time-definite delivery, trusted B2B service
        - Limited transparency on negotiated enterprise discounts
        - Blue Dart is chosen when speed and trust matter more than lowest cost
      - - Shiprocket
        - >-
          Software-led pricing and rate comparison across partner carriers; merchants can select carrier by rate and
          serviceability
        - Merchant panel, courier aggregation, checkout tools, rate-shopping, SLA visibility
        - End-carrier rates vary by plan, lane, and carrier mix
        - Shiprocket reduces single-carrier lock-in and weakens standalone carrier pricing power
      - - DTDC
        - Franchise and account-based pricing; public list pricing is incomplete
        - Domestic parcel, SME/C2C coverage, ground network reach
        - Public disclosures do not provide clean apples-to-apples unit economics
        - DTDC competes on accessibility and familiarity more than transparent price disclosure
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly observable pricing and packaging evidence for major alternatives available to merchants as of June
        2026; negotiated enterprise contracts remain private
    notes: >-
      The chapter deliberately avoids pretending public list pages equal realized enterprise pricing. In this market,
      volume mix, zone, COD, returns, and SLA commitments materially alter net yields.
