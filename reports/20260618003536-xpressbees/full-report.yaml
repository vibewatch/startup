      - number: '4.3'
        title: Revenue Structure and Monetization
        blocks:
          - type: paragraph
            body: >-
              Public disclosures indicate that XpressBees still earns the overwhelming majority of its revenue from core
              courier activity rather than from diversified logistics adjacencies. Courier services accounted for
              roughly 96% of operating revenue, which means shipment volume, lane mix, negotiated yield, COD intensity,
              and return rates still dominate the economic model. Warehousing revenue is the clearest sign of
              diversification: it rose to INR 48 crore in FY24 from only INR 0.77 crore in FY23, a roughly 60x jump, but
              that still left warehousing at under 2% of consolidated FY24 revenue. In other words, the new stream grew
              fast from a tiny base but did not yet change the company's dependence on the core e-commerce parcel
              engine. Public pricing evidence also points to negotiated monetization rather than transparent list-price
              selling. Realized yields likely vary by client size, geography, service-level agreement, COD handling,
              reverse-logistics complexity, and seasonal volume commitment. The revenue model is therefore real and
              scaled, but still narrow in mix and difficult to underwrite precisely from public sources alone.
