        - FY26 revenue INR 10,486 crore; EBITDA margin 7.3 percent; PAT INR 153 crore
        - About 2.9x-3.1x EV to revenue
        - Best listed open-network comp in India
        - Larger scale and now profitable, so it is a demanding benchmark
      - - Blue Dart
        - Premium express and air-heavy profitable operator
        - About 2.5x-3.5x EV to revenue
        - Shows where premium profitable logistics can trade
        - Service mix differs materially from XpressBees
      - - Shiprocket
        - Private aggregator and merchant-enablement model
        - About USD 1.17B valuation and roughly 6x-9x implied revenue multiple
        - Useful upper-bound private-market sentiment signal
        - Model is less asset-heavy and not directly comparable
      - - India listed logistics basket
        - Public market valuation context
        - Roughly 2.1x-3.0x EV to revenue
        - Anchors the domestic peer band for asset-heavy logistics
        - Band blends business models and profit profiles
      - - Global logistics sector average
        - Cross-market sector multiples
        - About 0.97x-2.1x EV to revenue and 6.3x-9x EV to EBITDA
        - Shows that global sector pricing is generally below the last XpressBees mark
        - International mix and capital structures differ
    notes: >-
      Comparable set mixes the highest-signal domestic listed peers with one private-market reference and one global
      sector band because no perfect direct comp exists.
    enumerationScope:
      coverage: partial
      basis: >-
        Built from the retained June 2026 source set covering the main India listed logistics benchmarks, one
        high-salience private comp, and cross-market sector multiple datasets. It is not exhaustive because private
        secondary marks and some Blue Dart real-time data are not fully public in the retained sources.
    claimRefs:
      - CV010
      - CV011
      - CV016
      - CV017
      - CV018
      - CV019
      - CV020
      - CV021
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or event
      - Transmission to thesis
      - Action implication
    rows:
      - - Fresh funding
        - New institutional round announced within six months
        - Reduces immediate liquidity stress and keeps the upside path alive
        - Re-open valuation work and test whether the round clears or preserves the old mark
      - - EBITDA repair
        - FY26 EBITDA margin improves to negative 3 percent or better
        - Shows the margin gap versus Delhivery is narrowing materially
        - Shift from avoid to watchlist if other diligence items also improve
      - - Meesho concentration worsens
        - Evidence that Valmo takes back more volume or Meesho remains structurally dominant
        - Breaks the independence thesis and compresses bargaining power further
        - Move to distressed underwriting assumptions
      - - No funding and no repair
        - No new round plus no visible liquidity improvement
        - Converts a stretched mark into a probable down-round or distressed sale setup
        - Treat current mark as unsupported
      - - Customer or margin disclosure disappoints
        - Top-customer concentration or segment economics are worse than expected
        - Confirms that the business quality behind the mark is weaker than assumed
        - Require a lower entry price or no trade
    notes: >-
      The first two rows are thesis-break conditions that would justify re-underwriting. The last three are kill
      triggers that make the downside case stronger.
    claimRefs:
      - CV028
      - CV032
      - CV034
      - CV035
      - CV041
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Liquidity
        - Current cash, debt, payable aging, and 13-week cash forecast
        - Without this, investors cannot tell whether bridge financing is urgent or already arranged
        - Company finance team, lender schedule, and board materials
      - - Customer concentration
        - Top-20 customers by revenue, Meesho share, contract tenure, and volume commitments
        - This determines how much pricing power and churn risk sit outside management control
        - Commercial diligence and customer cohort data room
      - - Segment economics
        - Gross margin, contribution margin, and revenue per shipment by courier, warehousing, and B2B or 3PL
        - This tests whether diversification improves quality or just adds low-margin volume
        - Management accounts and route or cohort profitability cuts
      - - Cap table and preferences
        - Share-class terms, liquidation stack, anti-dilution protections, and any bridge-round structure
        - Common-equity returns cannot be modeled accurately without preference overhang
        - Legal diligence and financing documents
      - - FY26 trading update
        - Quarterly revenue, EBITDA, shipment volume, and major-customer movement since March 2025
        - The old Series G mark is only defensible if operating momentum improved after FY25
        - Board deck, auditor review, and monthly MIS
    notes: These asks are ranked to answer the minimum set of questions needed before revisiting the current valuation.
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
