  - id: TI001
    title: Revenue streams table
    columns:
      - Revenue stream
      - Mechanism
      - Unit
      - Current value or status
      - Revenue quality
      - Diligence ask
    rows:
      - - Courier services
        - Shipment-linked courier and parcel delivery for e-commerce, D2C, and marketplace merchants
        - Parcel / shipment
        - About 96% of operating revenue in the latest public disclosures
        - High scale but lower quality because pricing is negotiated and volume can be concentrated
        - Request realized yield per shipment, client concentration, and margin by lane or service tier
      - - Warehousing and fulfillment
        - Storage, handling, and order-fulfillment fees tied to merchant inventory and throughput
        - Client contract / pallet / order
        - INR 48 crore in FY24 versus INR 0.77 crore in FY23
        - Improving strategically, but still small relative to total revenue
        - Request FY25 and FY26 warehousing revenue, gross margin, and client count
      - - B2B logistics and 3PL
        - Inter-city and enterprise logistics, distribution, and contract supply-chain services
        - Contract / shipment / lane
        - Publicly disclosed as a growth focus, but segment revenue is not broken out
        - Potentially higher quality if contracts are stickier than B2C courier volumes
        - Request segment revenue bridge and contribution margin by B2B and 3PL service line
      - - Value-added reverse logistics and COD handling
        - Returns processing, reconciliation, and cash-handling workflows attached to parcel volume
        - Parcel / return / transaction
        - Operationally important but not separately disclosed in public filings
        - Useful attachment revenue, but actual pricing power is opaque
        - Request attach rate, return-rate economics, and COD float impact
      - - Cross-border or adjacent services
        - Ancillary logistics services beyond domestic parcel delivery
        - Contract / shipment
        - Mentioned in company descriptions, but public financial contribution is not quantified
        - Low visibility and likely minor at current scale
        - Request audited revenue split and growth outlook for each adjacency
    notes: >-
      Public evidence supports a scaled but still concentrated revenue model in which courier services dominate and
      warehousing is the clearest disclosed diversification wedge.
