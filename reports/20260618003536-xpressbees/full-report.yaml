  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Current Valuation and Context
        blocks:
          - type: paragraph
            body: >-
              The last clear valuation anchor is the November 2023 Series G, when Ontario Teachers participated in an
              about USD 80 million round that valued XpressBees at roughly USD 1.4 billion post-money. That mark has not
              been refreshed publicly through June 2026 even though FY25 revenue grew only 1.5 percent to INR 2,874
              crore, net loss widened to INR 370 crore, EBITDA margin fell to negative 7.9 percent, and cash dropped to
              INR 172 crore. Using the last post-money mark as a rough enterprise-value proxy, the business still
              screens near 4.1x FY25 revenue, which is rich for a private parcel network with unresolved liquidity and
              profitability questions. That leaves investors relying on an old private round to value a business that
              looks materially weaker today.
