      - number: '6.4'
        title: Customer Satisfaction and Retention
        blocks:
          - type: paragraph
            body: >-
              Public retention underwriting is notably weaker than public adoption underwriting. Review surfaces give
              enough signal to say XpressBees is operationally real, but not enough to underwrite durable cohort
              retention or expansion economics with confidence. TrackParcel shows a 4 out of 5 delivery rating in 2026,
              which is directionally positive for a mass-market logistics network. Trustpilot is more mixed, with some
              positive commentary but enough delivery complaints to show the consumer experience is inconsistent. Public
              SLA signals point to metro delivery in roughly 1 to 2 business days and tier-2 service in roughly 3 to 5
              days, which supports competitiveness but not necessarily customer delight. No public NPS, GRR, NRR, churn,
              renewal, or contract-length data was found. The result is an evidence gap: XpressBees may have sticky
              customers, but current public proof is mostly indirect and does not quantify repeat usage in a way
              investors can bank on.
