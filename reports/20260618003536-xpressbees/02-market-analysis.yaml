  - id: market-sizing-and-estimates
    title: Market Sizing and Estimates
    body: >-
      Multiple research firms have published market sizing for India's e-commerce logistics and CEP
      segments, and their estimates span a wide range depending on scope, methodology, and base year.
      For the TAM (Total Addressable Market) anchoring XpressBees' long-run opportunity, the India
      express logistics (CEP) market is the appropriate anchor: approximately $9B (FY25), growing
      to an estimated $14–16B by FY30 at a 10.5–12% CAGR. KPMG's August 2025 express industry report
      estimated the organized CEP market at approximately $9 billion for FY25, while Mordor Intelligence
      cites $10.58B for 2026 on the broader e-commerce logistics definition. Expert Market Research
      estimates an $8.78B market in FY24 growing at 10% CAGR, implying $9.66B in FY26. These estimates
      bracket the market at $9–11B in 2026 on moderate to broad definitions.
      The Serviceable Addressable Market (SAM) for XpressBees is narrower: B2C and C2C express delivery
      for e-commerce and D2C merchants, excluding B2B freight, government, and enterprise contract
      logistics. The SAM is estimated at $3.5–5B in FY26, based on B2C/C2C comprising approximately
      55% of total CEP volume (per Redseer) and XpressBees targeting the mid-tier to large merchant
      segment. XpressBees' Serviceable Obtainable Market (SOM) — its current revenue — was approximately
      INR 2,874 crore (~$350M) in FY25, implying a market share of 7–10% of its defined SAM.
      India's e-commerce GMV provides a demand-side anchor: approximately $120–140 billion in calendar
      2024, with ET Retail citing projected growth to $163 billion by 2026 and IBEF noting $83 billion
      in FY24 e-tail GMV on a fiscal-year basis. Shipment volume growth has historically tracked at
      19–23% CAGR ahead of GMV growth due to declining average order values (AOV) and higher order
      frequency. Redseer estimates 10+ billion B2C shipments in FY26, up from 5 billion in FY22.
