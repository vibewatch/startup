callouts:
  - calloutType: insight
    title: India's CEP Market Is Structurally Large but Margin-Compressed
    body: >-
      The India express logistics market is a $9–11B market growing at 10–14% annually — large enough
      to support multiple scaled players. However, per-shipment pricing has compressed 10–20% since
      2022 due to over-capacity and competitive funded players. XpressBees operates in the right market
      at the wrong moment in the pricing cycle, with revenue flat in FY25 despite sector growth. Recovery
      requires either demand-side recovery in volumes or a move toward higher-margin D2C and value-added
      services.
    claimRefs:
      - CM008
      - CM009
      - CM030

  - calloutType: risk
    title: Platform Captive Logistics Caps Third-Party Addressable Market
    body: >-
      Flipkart's Ekart and Amazon Logistics together handle approximately 40–50% of their own shipment
      volumes captively, structurally limiting the third-party CEP market. As India's two largest
      e-commerce platforms grow, they are likely to captivate more volume, not less. This is an
      existential risk for mid-size third-party carriers like XpressBees if D2C and SME segments
      don't grow fast enough to compensate.
    claimRefs:
      - CM029
      - CM031

  - calloutType: insight
    title: D2C Brand Proliferation Offers Premium-Rate Volume Growth
    body: >-
      With D2C order volumes growing 33% in FY26 and 5,000+ active D2C brands demanding branded
      delivery experiences, returns portals, and fast COD settlement, this segment represents
      XpressBees' clearest path to margin expansion. D2C brands pay premium rates and have higher
      switching costs than platform logistics customers.
    claimRefs:
      - CM018
      - CM019
      - CM025

