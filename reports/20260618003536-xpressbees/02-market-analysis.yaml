  - id: market-diligence-gaps
    title: Sizing Diligence Gaps and Contradictory Estimates
    body: >-
      The India e-commerce logistics and CEP market suffers from significant definitional fragmentation
      across research sources. IMARC estimates the market at $6.65B for 2025, while Mordor Intelligence
      gives $10.8B — a 62% difference — primarily because of differing boundary definitions (B2B
      express inclusion, surface vs. air vs. two-wheeler CEP, warehouse-to-doorstep vs. merchant-to-
      doorstep). Diligence users should confirm which definition is used before referencing any single
      estimate. All major research firms note that India's logistics sector operates with low data
      transparency: carriers (except the listed Delhivery) do not publish shipment volumes, yields, or
      market-share data. Market share estimates for XpressBees, Ekart, and Ecom Express are inferred
      from Registrar of Companies filings (revenue proxies) and shipment volume estimates from aggregators.
      XpressBees has not publicly disclosed its shipment volume for FY25 or FY26, making market-share
      triangulation imprecise. Quick commerce logistics market sizing is nascent; estimates range from
      $500M to $2B by 2027 depending on assumed GMV growth and last-mile yield, and credible independent
      research is limited. The impact of ONDC on addressable market size for XpressBees is unquantified
      from public sources — ONDC transaction volumes are growing but exact logistics revenue attribution
      to specific carriers is unavailable.
    claimRefs:
      - CM035
      - CM036
