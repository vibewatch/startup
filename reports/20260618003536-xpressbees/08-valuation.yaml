- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple or valuation
  - Relevance
  - Limitation
  rows:
  - - Delhivery
    - FY26 revenue INR 10,486 crore; EBITDA margin 7.3 percent; PAT INR 153 crore
    - About 2.9x-3.1x EV to revenue
    - Best listed open-network comp in India
    - Larger scale and now profitable, so it is a demanding benchmark
  - - Blue Dart
    - Premium express and air-heavy profitable operator
    - About 2.5x-3.5x EV to revenue
    - Shows where premium profitable logistics can trade
    - Service mix differs materially from XpressBees
  - - Shiprocket
    - Private aggregator and merchant-enablement model
    - About USD 1.17B valuation and roughly 6x-9x implied revenue multiple
    - Useful upper-bound private-market sentiment signal
    - Model is less asset-heavy and not directly comparable
  - - India listed logistics basket
    - Public market valuation context
    - Roughly 2.1x-3.0x EV to revenue
    - Anchors the domestic peer band for asset-heavy logistics
    - Band blends business models and profit profiles
  - - Global logistics sector average
    - Cross-market sector multiples
    - About 0.97x-2.1x EV to revenue and 6.3x-9x EV to EBITDA
    - Shows that global sector pricing is generally below the last XpressBees mark
    - International mix and capital structures differ
  notes: Comparable set mixes the highest-signal domestic listed peers with one private-market reference and one global sector band because no perfect direct comp exists.
  enumerationScope:
    coverage: partial
    basis: Built from the retained June 2026 source set covering the main India listed logistics benchmarks, one high-salience private comp, and cross-market sector multiple datasets. It is not exhaustive because private secondary marks and some Blue Dart real-time data are not fully public in the retained sources.
