  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: liquidity-gap
    missingEvidence: Current cash balance, debt schedule, payable aging, and 13-week cash forecast for FY26
    whyItMatters: Without current liquidity evidence, investors cannot know whether the company is negotiating from strength, bridge-round urgency, or near-distress.
    diligencePath: Request CFO-certified cash summary, lender schedule, and weekly cash bridge from management or the data room.
    relatedQuestionRefs:
    - QV025
  - type: private-evidence-only
    severity: material
    topic: customer-gap
    missingEvidence: Top-customer concentration, Meesho revenue share, contract tenure, and any minimum-volume commitments
    whyItMatters: Valuation downside is highly sensitive to whether XpressBees can diversify away from Meesho or Valmo pricing power.
    diligencePath: Request top-20 customer bridge, contract summaries, and cohort shipment trends by platform.
    relatedQuestionRefs:
    - QV026
  - type: private-evidence-only
    severity: material
    topic: segment-gap
    missingEvidence: Segment gross margin, contribution margin, revenue per shipment, and B2B or 3PL mix by cohort
    whyItMatters: Without segment economics, the thesis that diversification can justify a better multiple remains narrative rather than underwritten.
    diligencePath: Request management-account cuts by courier, warehousing, B2B, and 3PL, plus shipment-yield tables.
    relatedQuestionRefs:
    - QV027
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-gap
    missingEvidence: Share-class preferences, anti-dilution terms, and any bridge-round structure or liquidation stack
    whyItMatters: Common-equity returns can differ sharply from enterprise value when late-stage preference overhang is significant.
    diligencePath: Obtain financing documents and the fully diluted cap table through legal diligence.
    relatedQuestionRefs:
    - QV028
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table coverage
    missingEvidence: Real-time Blue Dart multiples and additional private secondary marks for Shiprocket or XpressBees
    whyItMatters: The comp table is directionally strong, but private and premium-express market data are not fully public in the retained source set.
    diligencePath: Pull live Blue Dart market screens and private secondary data from paid databases before final IC pricing.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV004
