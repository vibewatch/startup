company:
  name: XpressBees
chapter:
  number: 8
  title: Valuation
  summary: XpressBees enters the June 2026 valuation chapter with a stale USD 1.4 billion Series G mark, flat FY25 revenue, a much wider loss base, and sharply reduced cash. Using the last disclosed post-money as a rough enterprise-value proxy, the company still screens at about 4.1x FY25 revenue versus roughly 2.1x-3.1x for listed Indian logistics peers, while trailing Delhivery by about 15 EBITDA-margin points. The upside case still exists if sponsor capital bridges liquidity and B2B or 3PL diversification becomes material, but current public evidence supports an avoid or high-caution stance for new money until funding and EBITDA repair are visible.
sections:
- id: current-valuation-and-context
  title: Current Valuation and Context
  body: The last clear valuation anchor is the November 2023 Series G, when Ontario Teachers participated in an about USD 80 million round that valued XpressBees at roughly USD 1.4 billion post-money. That mark has not been refreshed publicly through June 2026 even though FY25 revenue grew only 1.5 percent to INR 2,874 crore, net loss widened to INR 370 crore, EBITDA margin fell to negative 7.9 percent, and cash dropped to INR 172 crore. Using the last post-money mark as a rough enterprise-value proxy, the business still screens near 4.1x FY25 revenue, which is rich for a private parcel network with unresolved liquidity and profitability questions. That leaves investors relying on an old private round to value a business that looks materially weaker today.
  claimRefs:
  - CV001
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV009
  tableRefs: []
  figureRefs:
  - FV002
- id: comparable-company-analysis
  title: Comparable Company Analysis
  body: Peer framing is unfavorable. Public market data place Delhivery around 2.9x-3.1x EV to revenue on FY26 revenue of INR 10,486 crore, with a 7.3 percent EBITDA margin and PAT of INR 153 crore after its first annual profit in FY25. Blue Dart usually deserves a premium because it is profitable and air-express weighted, but even its range remains broadly inside the mid-2x to mid-3x band. Shiprocket has carried a high private valuation near USD 1.17 billion and a higher implied revenue multiple, but that is a weak comp because its model is more aggregator-like and less asset-heavy than XpressBees. Relative to listed Indian peers and global logistics-sector averages, XpressBees still looks priced for a better operating profile than it currently demonstrates.
