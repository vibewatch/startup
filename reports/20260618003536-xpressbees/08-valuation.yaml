- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key assumptions
  - Valuation or return logic
  - Probability signal
  rows:
  - - Bull
    - B2B or 3PL exceeds 35 percent of revenue, EBITDA reaches breakeven by FY27, and a bridge round resets liquidity risk
    - IPO or strategic exit at about 3x-4x revenue supports USD 1.2B-USD 1.6B value and limited upside versus the old mark
    - Low probability without visible FY26 repair
  - - Base
    - Revenue rises to about INR 3,200 crore-INR 3,500 crore by FY26-FY27, losses narrow but remain negative, and investors fund a defensive extension round
    - Strategic sale or structured recap at 1.5x-2.5x revenue supports about USD 500M-USD 900M
    - Most plausible unless funding and customer concentration improve quickly
  - - Bear
    - Valmo internalization resumes, revenue declines, and no fresh capital arrives before cash support fails
    - Distressed exit below USD 300M or shutdown outcome
    - Material risk because liquidity and concentration are already visible
  notes: Scenario values are author estimates anchored to current revenue scale, peer multiples, and the public funding situation.
