- id: diligence-gaps-and-information-requests
  title: Diligence Gaps and Information Requests
  body: An investor should not underwrite the current mark without four missing datasets. First, management must disclose current cash, debt, payable aging, and a 13-week forecast so the bridge-round question stops being speculative. Second, the company needs to show top-customer concentration, especially Meesho exposure, contract tenure, and any volume guarantees. Third, segment gross margin, revenue per shipment, and B2B or 3PL mix are needed to test whether diversification is genuinely improving quality. Fourth, the cap table, preference stack, and any bridge-round terms must be disclosed before common-equity returns can be modeled with precision. Without them, any point estimate would be a narrative mark rather than an investable valuation.
  claimRefs:
  - CV036
  - CV037
  - CV038
  - CV039
