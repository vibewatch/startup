- id: recommendation-and-kill-triggers
  title: Recommendation and Kill Triggers
  body: 'The present recommendation is avoid or high caution for new investment. The company is not being rejected because logistics is a bad market; it is being rejected because the public evidence shows a stale valuation mark, weak liquidity, an unproven profitability path, and a meaningful operating gap versus the strongest listed peer. Two thesis-break triggers would force a re-underwrite rather than an automatic no: first, a credible new institutional funding round inside six months; second, FY26 EBITDA margin improving to negative 3 percent or better. Absent one of those signals, the downside still dominates because even a moderate miss in funding or customer concentration can move the company from overvalued to distressed quickly. Until one of those catalysts appears, the burden of proof stays on management rather than on skeptical investors.'
