- id: bear-base-bull-scenarios
  title: Bear, Base, and Bull Scenarios
  body: The scenario spread is wide because financing rather than demand alone now determines the outcome set. In the bull case, XpressBees raises a bridge round, lifts B2B and 3PL to more than one-third of revenue, reaches EBITDA breakeven by FY27, and reopens an IPO or strategic-exit path at about 3x-4x revenue for a USD 1.2 billion-USD 1.6 billion outcome. The base case assumes revenue reaches roughly INR 3,200 crore-INR 3,500 crore by FY26-FY27, losses narrow but do not disappear, and investors fund a defensive extension round before a strategic sale at 1.5x-2.5x revenue, or USD 500 million-USD 900 million. The bear case is that Valmo internalization and pricing pressure resume, revenue declines, cash support fails, and the company ends up in a distressed exit below USD 300 million or worse. In other words, funding access is now the main gate between a survivable reset and a permanently impaired outcome.
  claimRefs:
