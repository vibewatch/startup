callouts:
  - calloutType: strength
    title: Broad Customer Surface, Narrow Proof of Economics
    body: >-
      XpressBees clearly serves multiple customer segments and has enough named logos to prove market relevance. What is still missing is hard evidence on revenue quality, share of wallet, and renewal durability inside those relationships.
    claimRefs:
      - CU001
      - CU011
      - CU020
      - CU041

  - calloutType: risk
    title: Valmo Is the Defining Customer Risk
    body: >-
      If Meesho remains the top account, Valmo gives it a structurally better negotiating position than any ordinary large customer would have. That makes concentration risk both a volume problem and a margin problem.
    claimRefs:
      - CU015
      - CU017
      - CU018
      - CU019

  - calloutType: insight
    title: Diversification Is Happening, But It Has Not Yet Repriced the Story
    body: >-
      Warehousing, B2B, ONDC, and long-tail D2C growth show that XpressBees is trying to reduce marketplace dependence. Flat FY25 revenue implies those wins are still too small to overpower pricing pressure in the core parcel book.
    claimRefs:
      - CU028
      - CU029
      - CU030
      - CU031
      - CU032

  - calloutType: recommendation
    title: Ask for Revenue Cohorts, Not Vanity Customer Counts
    body: >-
      The next diligence step should request top-10 customer mix, Meesho share trend, D2C and B2B cohort retention, and segment-level gross margin. Those metrics matter more than a headline merchant-count figure.
    claimRefs:
      - CU006
      - CU040
      - CU041
      - CU042

  - calloutType: assumption
    title: Long-Tail Merchant Breadth Exists but Is Not Precisely Quantified
    body: >-
      Public evidence supports a meaningful D2C and SME base, but not a clean active-customer number. The chapter assumes the long tail is strategically important while treating its exact size as unresolved.
    claimRefs:
      - CU006
      - CU033
      - CU038

