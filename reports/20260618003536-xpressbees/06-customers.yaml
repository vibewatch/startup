  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: Customer-specific public case studies or contract disclosures that quantify deployment scale, parcel volume, or business outcomes for the named accounts.
      whyItMatters: Logo-level proof validates relevance, but it does not show whether the relationship is large, profitable, or durable enough to support underwriting confidence.
      diligencePath: Request the top 20 customer list with start date, current share of wallet, annual parcel volume, and one quantified case study per top segment.
      relatedQuestionRefs:
        - QU026
      relatedTableRefs:
        - TU003
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: Cohort retention, renewal, churn, NPS, and contract-length data segmented by marketplace, D2C, SME, and B2B customers.
      whyItMatters: Without direct retention metrics, investors cannot tell whether XpressBees has durable customer economics or only broad but shallow adoption.
      diligencePath: Request GRR, NRR, churn, renewal history, median contract term, and complaint-resolution trend for the top customer cohorts.
      relatedQuestionRefs:
        - QU015
      relatedTableRefs:
        - TU004
    - type: private-evidence-only
      severity: material
      topic: concentration-trend
      missingEvidence: Quarterly top-10 customer concentration, Meesho revenue share, parcel share, and segment-level gross margin for the last eight quarters.
      whyItMatters: The diversification story cannot be trusted if the company remains economically dependent on one platform or on low-margin marketplace lanes.
      diligencePath: Request a quarterly concentration bridge showing marketplace, D2C, SME, B2B, and ONDC mix by revenue and gross profit.
      relatedQuestionRefs:
        - QU022
      relatedTableRefs:
        - TU005
    - type: missing-source
      severity: minor
      topic: procurement-friction
      missingEvidence: Publicly attributable evidence on customer onboarding time, implementation effort, switching costs, and procurement cycle length by segment.
      whyItMatters: Procurement friction affects retention and expansion, especially when merchants can multi-home across carriers and aggregators.
      diligencePath: Ask management for implementation timelines, integration requirements, cancellation terms, and customer references that discuss switching costs.
      relatedQuestionRefs:
        - QU023
    - type: missing-source
      severity: minor
      topic: customer-count
      missingEvidence: A precise public split of active versus historical merchants within the stated long-tail D2C and SME base.
      whyItMatters: A large merchant count can overstate real adoption if inactive or low-frequency shippers are included in the headline figure.
      diligencePath: Request active-customer definitions, monthly active shipper counts, and segment-level ARPU bands.
