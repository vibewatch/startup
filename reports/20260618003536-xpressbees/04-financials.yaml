callouts:
  - calloutType: risk
    title: Flat Revenue, Rising Losses, and Falling Cash Is the Core Financial Problem
    body: >-
      XpressBees did not merely post another loss-making growth year. FY25 combined almost flat revenue with sharply worse EBITDA, wider net loss, and an 87% cash drawdown, which is a harder pattern to defend because it signals both weaker unit economics and less balance-sheet room to wait for recovery.
    claimRefs:
      - CI002
      - CI004
      - CI005
      - CI010
      - CI015
      - CI016

  - calloutType: insight
    title: Diversification Exists, but It Is Still Small
    body: >-
      Warehousing growth is strategically important because it shows XpressBees can monetize more than parcel delivery, but public numbers still suggest that non-courier revenue is too small to offset weakness in the core courier engine. The financial story remains dominated by shipment economics.
    claimRefs:
      - CI012
      - CI013
      - CI014
      - CI034
      - CI043

  - calloutType: recommendation
    title: Underwrite Liquidity Before Underwriting IPO Optionality
    body: >-
      Before treating XpressBees as an IPO candidate, diligence should request updated cash, monthly burn, customer concentration, shipment yield, and gross-margin disclosure. Without those numbers, the company can be described as scaled and sponsor-backed, but not as financially de-risked.
    claimRefs:
      - CI030
      - CI031
      - CI035
      - CI038
      - CI048

