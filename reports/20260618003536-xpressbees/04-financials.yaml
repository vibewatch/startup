  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: per-shipment-yield
      missingEvidence: Exact realized revenue per shipment, parcel volumes, and per-shipment gross profit by customer and lane.
      whyItMatters: Without yield and volume detail, public revenue cannot be translated into unit economics or price discipline.
      diligencePath: Request management shipment-volume bridge, yield tables by service line, and contribution margin by lane and customer cohort.
      relatedQuestionRefs:
        - QI018
    - type: private-evidence-only
      severity: material
      topic: monthly-burn
      missingEvidence: Exact monthly cash burn, cash-in and cash-out pattern, and working-capital bridge after March 2025.
      whyItMatters: The public runway estimate is only a proxy and cannot replace an actual treasury view.
      diligencePath: Request CFO-certified monthly management accounts, 13-week cash forecast, and board liquidity updates.
      relatedQuestionRefs:
        - QI019
    - type: private-evidence-only
      severity: material
      topic: debt-and-obligations
      missingEvidence: Debt schedules, leases, vendor-financing exposure, and any project-finance or contingent obligations.
      whyItMatters: Hidden liabilities can make the reported cash balance materially less protective than it appears.
      diligencePath: Request debt register, lease commitments, payable aging, and contingent-liability footnotes from audited statements.
      relatedQuestionRefs:
        - QI020
    - type: missing-source
      severity: material
      topic: cash-drawdown-drivers
      missingEvidence: A detailed public or primary-source explanation for what specifically drove the INR 1,159 crore cash drawdown from FY24 to FY25.
      whyItMatters: The cause determines whether the cash burn was a one-time balance-sheet event or a repeatable structural problem.
      diligencePath: Request cash-flow statement detail, capex bridge, debt-repayment schedule, and working-capital movement commentary.
      relatedQuestionRefs:
        - QI021
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Top-customer revenue concentration, parcel-volume concentration, and payment terms.
      whyItMatters: High concentration can worsen pricing power, bad-debt risk, and working-capital volatility.
      diligencePath: Request top-20 customer tables with revenue share, shipment share, receivable days, and contract renewal dates.
      relatedQuestionRefs:
        - QI022
    - type: private-evidence-only
      severity: material
      topic: gross-margin-disclosure
      missingEvidence: Gross margin and contribution margin by courier, warehousing, and B2B or 3PL segments.
      whyItMatters: EBITDA alone does not show whether the core business is fixable through density and mix improvements.
      diligencePath: Request audited segment P&L disclosure and management's margin-bridge view for FY26 and FY27.
      relatedQuestionRefs:
        - QI025

