summary:
  headline: XpressBees 是具备网络规模的印度物流独角兽，但现金急剧耗尽、USD 1.4 billion 估值标记陈旧，且 Meesho 将 Valmo 内部化带来生存级客户集中风险；在流动性和盈利信号改善前，应避免新增投资。
