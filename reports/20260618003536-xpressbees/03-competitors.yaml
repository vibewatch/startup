  - id: moat-durability-and-diligence-implications
    title: Moat Durability and Diligence Implications
    body: >-
      The competitive question for XpressBees is not whether alternatives exist; it is whether the company still has a durable edge against better-capitalized, differently positioned, or structurally advantaged rivals. Delhivery currently appears to have the strongest moat because it combines national scale, improving profitability, public-market access, and the ability to consolidate weaker peers. Blue Dart's moat is narrower but still durable in premium air express and enterprise trust-sensitive lanes. DTDC's moat lies in franchise density and SME familiarity, though the absence of public financial disclosure makes durability harder to score with confidence. Shiprocket's moat is merchant workflow ownership: once a seller uses aggregator software to multi-home across carriers, any single network's pricing power weakens. For XpressBees, the most important outstanding diligence asks are merchant retention versus Delhivery, segment-level contribution margins, true service-level differentiation in Tier 2/3 lanes, and evidence that its network remains meaningfully cheaper or better than carrier alternatives after industry consolidation.
