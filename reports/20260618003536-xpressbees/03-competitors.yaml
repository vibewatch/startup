callouts:
  - calloutType: insight
    title: Delhivery Is Now the Bar, Not Just Another Peer
    body: >-
      Delhivery combines the attributes XpressBees lacks simultaneously: public-market access, full-year profitability, 1 billion parcel scale, and proven willingness to consolidate weaker rivals. After absorbing Ecom Express, it is the clearest benchmark for network breadth, disclosure quality, and capital resilience in Indian express logistics.
    claimRefs:
      - CP002
      - CP003
      - CP004
      - CP005
      - CP031

  - calloutType: risk
    title: Captive Fleets Shrink the Best Part of the Market
    body: >-
      Ekart and Amazon Logistics do not need to win third-party merchants to hurt XpressBees. By keeping 40–50% of platform volume in-house, captive fleets remove precisely the dense, high-frequency parcel pools that help open-network carriers fill linehaul and defend yield.
    claimRefs:
      - CP022
      - CP023
      - CP036

  - calloutType: recommendation
    title: Ask for Merchant Retention and Lane Economics Before Underwriting Differentiation
    body: >-
      Public evidence is enough to show the competitor set is strong, but not enough to prove XpressBees still has a durable edge. Diligence should request top-merchant retention versus Delhivery, contribution margins by lane and segment, and evidence that Tier 2/3 service quality or cost remains measurably superior after consolidation.
    claimRefs:
      - CP033
      - CP034
      - CP037

