  - id: pricing-distribution-and-substitutes
    title: Pricing, Distribution, and Substitute Pressure
    body: >-
      Buyer choice in Indian parcel logistics is shaped as much by distribution power and rate-shopping as by raw network quality. Public comparison pages from WareIQ and NimbusPost consistently frame Delhivery as broader in network reach and enterprise tooling, while public XpressBees rate cards are indicative rather than contractual, reinforcing that pricing in this market is negotiated and opaque. Blue Dart typically preserves a premium because air express, time-definite B2B service, and DHL brand assurance justify higher rates for urgent shipments, but that also narrows its fit for low-cost mass e-commerce parcels. Shiprocket is strategically important because it turns carrier selection into a software workflow: merchants can compare rates, serviceability, and SLA performance across carriers without fully committing to any one operator. The biggest substitute pressure, however, comes from captive fleets. Ekart and Amazon Logistics are not broadly open to external merchants, but by handling roughly 40–50% of their own platform volumes they shrink the contestable parcel pool available to XpressBees and every other open-network carrier.
    claimRefs:
      - CP021
      - CP022
      - CP023
      - CP024
      - CP025
      - CP026
      - CP027
      - CP028
      - CP034
      - CP036
