figures:
  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: Public evidence supports a layered logistics stack that starts at merchant integration and ends in physical network execution.
    data:
      layers:
        - id: merchant-interface
          label: Merchant interfaces and partner connectors
          modules:
            - Merchant OMS and marketplace order feeds
            - ClickPost, TrackingMore, Softpal, and Base.com connectors
            - Shipment creation and label-generation entry points
        - id: shipment-control
          label: Shipment control and visibility APIs
          modules:
            - Tracking API and shipment-status events
            - NDR workflow and exception handling
            - EDD logic and callback or webhook delivery
        - id: optimization-data
          label: ETA, routing, and event-data layer
          modules:
            - Scan-event ingestion and shipment telemetry
            - Predictive ETA and route-optimization logic
            - Allocation and planning rules for network execution
        - id: warehouse-execution
          label: WMS and fulfillment automation
          modules:
            - ERP-linked warehouse-management workflows
            - RFID, robotics, and conveyor-supported handling
            - Pick-pack-dispatch controls for 3PL fulfillment
        - id: network-operations
          label: Hub, linehaul, and last-mile operations
          modules:
            - Hub and service-centre orchestration
            - Delivery-partner allocation and last-mile execution
            - Reverse-logistics routing back into the network
    approximationNotes: The layers summarize public operating evidence and external stack signals, not an internal engineering schematic.
    claimRefs:
      - CE006
      - CE009
      - CE011
      - CE012
      - CE035

