callouts:
  - calloutType: strength
    title: Breadth of logistics workflow is the product's clearest strength
    body: >-
      XpressBees sells more than parcel transportation. Forward shipping, reverse logistics, warehousing,
      B2B movement, cross-border services, and ONDC-linked flows give merchants a broader workflow package
      than a single-lane courier vendor would offer.
    claimRefs:
      - CE001
      - CE002
      - CE027
      - CE029
      - CE036

  - calloutType: insight
    title: The moat looks operational before it looks software-native
    body: >-
      Public evidence points to real logistics execution depth and integration breadth, but not to a highly
      transparent software platform with a visible SDK ecosystem, modern release management, or obvious
      proprietary IP. The strongest defensibility likely comes from network density and workflow coverage.
    claimRefs:
      - CE018
      - CE019
      - CE034
      - CE035

  - calloutType: risk
    title: Public trust signalling is thinner than the product breadth
    body: >-
      XpressBees can show delivery windows, tracking workflows, and mixed review evidence, yet it does not
      prominently disclose a modern trust centre, public status artefacts, NPS, or detailed security
      certifications. That leaves a diligence blind spot around service quality and enterprise assurance.
    claimRefs:
      - CE022
      - CE023
      - CE024
      - CE025
      - CE026

  - calloutType: recommendation
    title: Verify warehouse productivity and API reliability before underwriting technology differentiation
    body: >-
      The next diligence step should be operational proof, not more marketing copy. Ask for facility-level
      throughput, scan latency, NDR resolution rates, integration uptime logs, and any internal security or
      compliance certifications to test whether the product stack is materially differentiated.
    claimRefs:
      - CE017
      - CE021
      - CE038
      - CE040

