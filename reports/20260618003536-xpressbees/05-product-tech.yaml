  evidenceGaps:
    - type: missing-source
      severity: material
      topic: roadmap
      missingEvidence: Public release notes, changelog entries, or versioned roadmap artefacts that show software delivery cadence.
      whyItMatters: Without release-level evidence, investors cannot judge whether strategic roadmap claims are translating into repeatable product execution.
      diligencePath: Request an internal product roadmap, last four quarters of release notes, and KPI owners for API, warehouse, and ONDC-related product work.
      relatedQuestionRefs:
        - QE019
      relatedTableRefs:
        - TE005
    - type: missing-source
      severity: material
      topic: reliability
      missingEvidence: First-party uptime dashboard, incident history, or SLA reporting that directly supports the widely repeated uptime-oriented integration narrative.
      whyItMatters: API uptime is a core trust signal for merchant integrations, and partner marketing is weaker evidence than first-party operational reporting.
      diligencePath: Request 12 months of API uptime logs, incident summaries, webhook delivery metrics, and merchant SLA terms.
      relatedQuestionRefs:
        - QE020
      relatedTableRefs:
        - TE004
    - type: private-evidence-only
      severity: material
      topic: warehousing
      missingEvidence: Facility-level throughput, utilization, order accuracy, and pick-pack productivity metrics for dark warehousing operations.
      whyItMatters: Automation claims may be strategically important, but they are hard to underwrite without proof that the facilities outperform conventional alternatives.
      diligencePath: Request site visits, monthly operating dashboards, and before-after productivity data for at least two automated fulfillment centres.
      relatedQuestionRefs:
        - QE025
      relatedTableRefs:
        - TE001
    - type: private-evidence-only
      severity: material
      topic: compliance
      missingEvidence: Publicly attributable evidence of specific security, privacy, or audit certifications such as SOC-style reports or formal enterprise security attestations.
      whyItMatters: Enterprise customers and investors need more than general compliance posture when assessing whether the platform can support sensitive merchant workflows.
      diligencePath: Request security questionnaires, certification reports, privacy controls, audit summaries, and customer security-review outcomes.
      relatedQuestionRefs:
        - QE026
      relatedTableRefs:
        - TE004
