  - id: funding-history-and-investors
    title: Funding History and Investors
    body: >-
      XpressBees has raised approximately $680 million in cumulative funding across multiple rounds
      since 2015, achieving unicorn status with a $1.2 billion valuation in February 2022 before
      reaching $1.4 billion with the November 2023 Series G. The company's early investors included
      Elevation Capital (formerly SAIF Partners), IDG Ventures, and Vertex Ventures in a $12.5M
      Series A in 2016. Alibaba Group invested approximately $35 million in 2017–2018, becoming
      a strategic partner as XpressBees expanded its e-commerce logistics capabilities. The 2020
      Series E ($110 million) from Investcorp, Norwest Venture Partners, and Gaja Capital funded
      expansion into warehousing and third-party logistics. The transformative Series F in February
      2022 raised $300 million, led by Blackstone Growth (BXG) making its first Asia investment,
      alongside TPG Growth and ChrysCapital. This round consisted of $100 million in primary capital
      and $200 million in secondary share sales, allowing early investors including Elevation Capital
      and Alibaba to partially exit. CDH Investments made a complete exit. This round catalyzed
      unicorn status at a $1.2 billion valuation. Subsequent transactions in 2022 included INR 195
      crore from Avendus Future Leaders Fund II. In early 2023, Khazanah Nasional Berhad — Malaysia's
      sovereign wealth fund — invested $40 million. The most recent institutional round, Series G in
      November 2023, raised $80 million from Ontario Teachers' Pension Plan (via its Teachers' Venture
      Growth arm), valuing XpressBees at approximately $1.4 billion. Ontario Teachers' said this
      was its first direct TVG investment in India and identified India as a "key strategic" country.
      TechCrunch reported the round brought cumulative funding to approximately $680 million.
      The Ontario Teachers' investment was widely interpreted as pre-IPO positioning; the company
      has not yet filed a Draft Red Herring Prospectus as of June 2026.
