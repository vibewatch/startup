      whyItMatters: "Board composition reveals governance quality, investor control rights, and IPO readiness; key for pre-IPO diligence"
      diligencePath: "Request MCA filings (Form 32 director appointments) or direct company disclosure; company is private so public filing is the only path"
      relatedQuestionRefs:
