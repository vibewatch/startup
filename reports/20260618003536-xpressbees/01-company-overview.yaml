callouts:
  - calloutType: strength
    title: Extensive Pan-India Logistics Network
    body: >-
      XpressBees has built one of India's most extensive express logistics networks, with 20,000+
      pincodes, 4,500+ service centers, 250+ hubs, and 28,000+ delivery partners. The company delivers
      to more than 2,800 cities including Tier 2, 3, and 4 markets that many competitors underserve.
      This network scale creates a significant barrier to entry for new logistics entrants.
    claimRefs:
      - CO027
      - CO028
      - CO029

  - calloutType: risk
    title: Mounting Financial Losses and Cash Depletion
    body: >-
      XpressBees' FY25 net losses widened 85% to INR 370 crore on nearly flat revenue, while cash
      fell 87% to just INR 172 crore. EBITDA margin deteriorated to -7.9%. The company's cost base
      grew faster than revenue due to pricing pressure from large clients and rising logistics costs.
      Combined with Delhivery CEO's public statement questioning XpressBees' viability, the company's
      path to profitability and IPO is under serious question.
    claimRefs:
      - CO034
      - CO035
      - CO036

