  - id: scale-milestones-and-outlook
    title: Scale, Milestones, and Outlook
    body: >-
      XpressBees has built one of India's largest express logistics networks, covering more than 20,000
      pincodes and 2,800+ cities through 4,500+ service centers, 250+ hubs, and over 28,000 delivery
      partners. The company processes over 2.5 million orders daily and has delivered more than 2 billion
      parcels since its founding. Key growth milestones include the 2021 acquisition of NimbusPost, a
      shipping aggregation platform; a strategic partnership with SpiceXpress (SpiceJet's cargo arm) in
      July 2021 for air freight expansion; and the August 2023 all-cash acquisition of Trackon Courier,
      a New Delhi-based courier company that expanded XpressBees' network in northern India.
      Fortune India included XpressBees among five logistics ventures in its Most Promising Startups
      issue in March 2025. However, the financial trajectory through FY25 reflects mounting challenges.
      Revenue growth has nearly stalled — FY25 revenue of INR 2,874 crore was up only 1.5% from INR
      2,831 crore in FY24, following much stronger growth in prior years. Net losses widened 85% to
      INR 370 crore, EBITDA margin deteriorated to -7.9%, and cash and cash equivalents fell 87% to
      INR 172 crore. Most strikingly, in May 2026, Delhivery CEO Sahil Barua publicly stated: "I don't
      think XpressBees has any structural advantages compared to the three listed companies, and I don't
      see a reason for them to exist." This adverse statement — made on a public earnings call — reflects
      the competitive pressure XpressBees faces from listed rivals as it has not yet gone public. XpressBees
      has not filed IPO documents as of June 2026, though the Series G was interpreted as pre-IPO preparation.
      The company's strategic pivot toward B2B logistics, warehousing, and ONDC represents a bid to diversify
      beyond the commoditizing B2C delivery market.
