  - id: leadership-and-governance
    title: Leadership and Governance
    body: >-
      XpressBees is led by its founder, Amitava Saha, who serves as Managing Director and CEO. Saha
      was co-founder of FirstCry before building XpressBees into one of India's largest independent
      logistics platforms. He represents a clear key-person dependency: nearly all public positioning
      and investor communications originate from him, and his departure would create a material
      leadership gap. The executive team includes Santosh Abbimane as Chief Financial Officer, Rahul
      Agrawal as Chief Operating Officer, Harshal Bhoi as Chief Business Officer, and Ajoy Clement Salve
      as Chief Human Resources and Administration Officer. The board of directors includes representation
      from major institutional investors — Blackstone Growth, TPG, ChrysCapital, Norwest Venture Partners,
      Investcorp, Ontario Teachers', and Khazanah — alongside the founder. A detailed board composition
      with individual names is not publicly disclosed; XpressBees is a private company and its Registrar
      of Companies (MCA) filings are the authoritative record. The company appointed Tarun Agarwal as
      Vice President for B2C First Mile Operations in 2025, indicating continued talent investment in
      core delivery operations. The company has not disclosed any material leadership departures or
      adverse governance events as of the run date, but the founder concentration creates execution risk
      if Saha were to leave or become unavailable.
