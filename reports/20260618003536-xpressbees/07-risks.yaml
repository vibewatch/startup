callouts:
  - calloutType: risk
    title: "Liquidity is the gating risk because every other fix needs time the balance sheet may not have"
    body: >-
      A company can survive concentration or competition if it has time and cash. FY25 left XpressBees with neither comfort. Unless FY26 performance improved sharply off-public-record, the company likely needed either a bridge round, a hidden debt line, or unusually fast operating repair.
    claimRefs: [CR004, CR005, CR007, CR009, CR049]

  - calloutType: risk
    title: "Meesho and Valmo remain the most dangerous external dependency"
    body: >-
      Valmo does not need to fully replace XpressBees to damage economics. It only needs to remain credible enough to shift share or force price concessions. If Meesho is still the largest account, that leverage can overpower many smaller mitigation efforts.
    claimRefs: [CR013, CR014, CR015, CR016, CR017, CR041]

  - calloutType: insight
    title: "Regulation is a margin risk, not just a legal checklist"
    body: >-
      GST, labor, privacy, and transport obligations matter because they feed directly into operating cost, working capital, audit burden, and financing readiness. For a low-runway logistics network, compliance errors can become liquidity events.
    claimRefs: [CR023, CR024, CR028, CR029, CR030]

  - calloutType: recommendation
    title: "Do not underwrite recovery without customer mix, cash, and compliance proof"
    body: >-
      The minimum diligence package should include current cash, monthly burn, top-10 customer concentration, Meesho share by quarter, GST notice history, partner contracts, and 12 months of uptime and SLA reporting. Without that, the mitigation story is still mostly narrative.
    claimRefs: [CR033, CR043, CR048, CR049]

  - calloutType: assumption
    title: "A sponsor-backed recap remains possible but is not yet evidenced in the public record"
    body: >-
      This chapter assumes institutional investors could still support the business if they view it as strategically salvageable. That is a helpful but unproven assumption, not a disclosed FY26 financing fact.
    claimRefs: [CR007, CR008, CR047]

