  title: Financials
  summary: FY24 shows real improvement and a major financing reset, but Purplle remains materially under-disclosed
    on the forward metrics that matter most for valuation.
sections:
- id: fy24-core-performance
  title: FY24 core performance
  body: 'Purplle''s FY24 financial story is more constructive than many private e-commerce narratives:
    the company grew revenue strongly, nearly halved losses, and reduced marketing intensity. This is
    not the same as profitability, but it is enough to show that the business was moving toward better
    operating discipline before the 2024 financing round. The numbers here should be treated as the best
    available public anchor rather than a full audited diligence model. That distinction matters because
    a private consumer company can show genuine improvement while still leaving large questions unanswered
    on margin quality, cash conversion, and forward operating leverage. Additional triangulation across
    fetched sources reduces headline uncertainty, but not enough to replace direct company disclosures
    or audited forward data where those remain absent.'
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI006
  - CI007
  - CI008
  - CI009
  - CI029
  - CI035
  tableRefs:
  - TI001
  figureRefs:
  - FI001
- id: liquidity-capital-and-runway
  title: Liquidity, capital, and runway
  body: Standalone FY24 liquidity looked limited on public evidence, but the ₹1,500 crore Series F likely
    reset Purplle's runway and gave the company room to pursue a more aggressive omnichannel strategy.
    Third-party databases and financing coverage are directionally consistent on the cumulative capital
    story, though none substitutes for a direct cap-table or audited cash-flow view. The numbers here
    should be treated as the best available public anchor rather than a full audited diligence model.
    That distinction matters because a private consumer company can show genuine improvement while still
    leaving large questions unanswered on margin quality, cash conversion, and forward operating leverage.
    Additional triangulation across fetched sources reduces headline uncertainty, but not enough to replace
    direct company disclosures or audited forward data where those remain absent.
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  - CI014
  - CI015
  - CI016
  - CI017
  - CI018
  - CI019
