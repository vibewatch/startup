- id: monetization-model
  title: Monetization model
  body: The best financial-structure insight in the reviewed evidence is that Purplle is not just a commission
    marketplace. Entrackr lists ads, promotion services, in-house brands, royalties, subscriptions, and
    support revenue, while later trade coverage suggests owned brands may now dominate the revenue mix.
    That could be a powerful margin driver, but it also makes the business much harder to compare with
    public retail or marketplace peers without gross-margin disclosure. The numbers here should be treated
    as the best available public anchor rather than a full audited diligence model. That distinction matters
    because a private consumer company can show genuine improvement while still leaving large questions
    unanswered on margin quality, cash conversion, and forward operating leverage. Additional triangulation
    across fetched sources reduces headline uncertainty, but not enough to replace direct company disclosures
    or audited forward data where those remain absent.
  claimRefs:
  - CI011
  - CI023
  - CI024
  - CI036
  tableRefs:
  - TI004
  figureRefs:
  - FI002
- id: disclosure-quality
  title: Disclosure quality
  body: Purplle's entity disclosures are good enough to identify the operating companies, but the financial
    disclosure surface is still thin. The retained filing-adjacent sources mainly provide breadcrumbs;
    the actual underwriteable numbers still come from filing-derived journalism, not directly fetched
    audited statements. That is the biggest difference between Purplle and public comparables. The numbers
    here should be treated as the best available public anchor rather than a full audited diligence model.
    That distinction matters because a private consumer company can show genuine improvement while still
    leaving large questions unanswered on margin quality, cash conversion, and forward operating leverage.
    Additional triangulation across fetched sources reduces headline uncertainty, but not enough to replace
    direct company disclosures or audited forward data where those remain absent.
  claimRefs:
  - CI025
  - CI026
  - CI027
  - CI028
  - CI032
  - CI033
  - CI034
  tableRefs:
  - TI005
  figureRefs:
  - FI004
- id: forward-read-through
  title: Forward read-through
  body: If the 2026 trade coverage is directionally right, Purplle's revenue and store base expanded sharply
    after the 2024 round and the business is now much more owned-brand-heavy than before. Those are material
    claims because they change how investors should think about the company's gross-margin potential and
    fixed-cost base. But because they are not directly supported by audited filings in the fetched set,
    they should be treated as informative rather than definitive. The numbers here should be treated as
    the best available public anchor rather than a full audited diligence model. That distinction matters
    because a private consumer company can show genuine improvement while still leaving large questions
    unanswered on margin quality, cash conversion, and forward operating leverage. Additional triangulation
    across fetched sources reduces headline uncertainty, but not enough to replace direct company disclosures
    or audited forward data where those remain absent.
  claimRefs:
