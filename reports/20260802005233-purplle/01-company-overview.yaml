company:
  name: Purplle
chapter:
  number: 1
  title: Company Overview
  summary: Founder-led Indian beauty commerce platform that now looks increasingly like a private-label-led
    omnichannel retailer built on a marketplace distribution base.
sections:
- id: origin-and-governance
  title: Origin and governance
  body: Purplle's public company-owned materials present a founder-led beauty specialist built from Mumbai
    with operational control still concentrated around its co-founders and core technologist. The compliance
    and terms pages are unusually useful because they disclose the current operating entities, the registered
    office, and the company's own explanation of when it acts as facilitator versus seller. That matters
    because the platform increasingly looks like a hybrid of marketplace distribution and owned-brand
    economics rather than a pure marketplace. This section emphasizes only the strongest fetched evidence
    and highlights where the public record is still thinner than a listed-company diligence package. That
    framing matters because investors can confirm existence, financing, and broad strategy, but still
    need deeper operational disclosure before treating the narrative as fully underwritten.
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO008
  - CO009
  tableRefs:
  - TO001
  - TO002
- id: business-model-and-brand-portfolio
  title: Business model and brand portfolio
  body: The most consistent picture across official pages, funding coverage, and founder interviews is
    that Purplle uses marketplace breadth to source demand and proprietary labels to capture a higher
    share of wallet. Brand pages confirm active first-party or exclusive-brand merchandising across Good
    Vibes, Alps Goodness, Faces Canada, DermDoc, and NY Bae, while the live storefront makes clear the
    platform spans core beauty and personal-care categories rather than a narrow niche. Founder commentary
    points to data-led white-space identification as the engine behind the private-label expansion. This
    section emphasizes only the strongest fetched evidence and highlights where the public record is still
    thinner than a listed-company diligence package. That framing matters because investors can confirm
    existence, financing, and broad strategy, but still need deeper operational disclosure before treating
    the narrative as fully underwritten.
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO013
  - CO036
  - CO037
  figureRefs:
  - FO002
- id: capital-history-and-unicorn-status
  title: Capital history and unicorn status
  body: Purplle clearly qualifies as a unicorn on the evidence after the August 2024 cutoff. Multiple
    independent reports converge on a ~₹1,500 crore Series F round led by ADIA with support from Premji
    Invest, Blume Ventures, and other insiders, closing around a US$1.2B-US$1.25B valuation. Third-party
    databases expand the investor history, but the cleanest underwriteable point remains the 2024 priced
    round because no later financing was located in the reviewed materials. This section emphasizes only
    the strongest fetched evidence and highlights where the public record is still thinner than a listed-company
    diligence package. That framing matters because investors can confirm existence, financing, and broad
    strategy, but still need deeper operational disclosure before treating the narrative as fully underwritten.
  claimRefs:
  - CO014
  - CO015
  - CO016
  - CO017
  - CO018
  - CO019
  - CO020
  tableRefs:
  - TO003
  - TO007
  figureRefs:
  - FO001
- id: financial-and-distribution-snapshot
  title: Financial and distribution snapshot
  body: 'FY24 public reporting shows real operating progress: revenue rose strongly while losses narrowed
    and marketing intensity came down. At the same time, the business was still loss-making and cash visibility
    remains limited. On reach, the company appears to have meaningful national distribution leverage:
    10 million-plus monthly consumers, roughly half of revenue from smaller cities, and a touchpoint network
    that preceded the later reported ramp in exclusive stores. Later-dated trade coverage suggests the
    omni-channel story accelerated sharply after the 2024 round, but those post-FY24 operating claims
    still need audited confirmation. This section emphasizes only the strongest fetched evidence and highlights
    where the public record is still thinner than a listed-company diligence package. That framing matters
    because investors can confirm existence, financing, and broad strategy, but still need deeper operational
    disclosure before treating the narrative as fully underwritten.'
  claimRefs:
  - CO021
  - CO022
  - CO023
  - CO024
  - CO025
  - CO026
  - CO027
  - CO028
