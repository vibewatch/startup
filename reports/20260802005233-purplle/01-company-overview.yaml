- id: credibility-check-and-open-gaps
  title: Credibility check and open gaps
  body: Purplle's public record is strong enough to establish the company's existence, financing, scale
    direction, and broad strategy. It is not strong enough to answer the hardest investment questions.
    Adverse customer signals are easy to find in public app-store reviews and complaint boards, and management
    has not made public the board composition, cohort retention, gross margin, CAC, or audited FY25/FY26
    numbers needed to move from narrative conviction to firm underwriting. That makes the overview chapter
    supportive but not fully conclusive. This section emphasizes only the strongest fetched evidence and
    highlights where the public record is still thinner than a listed-company diligence package. That
    framing matters because investors can confirm existence, financing, and broad strategy, but still
    need deeper operational disclosure before treating the narrative as fully underwritten.
  claimRefs:
  - CO039
  - CO040
  - CO040
  tableRefs:
  - TO006
