- id: nykaa-and-honasa-as-primary-benchmarks
  title: Nykaa and Honasa as primary benchmarks
  body: Nykaa is the best public valuation and disclosure benchmark because it combines beauty specialization,
    owned brands, and omnichannel depth inside a listed-company shell. Honasa is the best owned-brand
    operating analogue because it has already shown what public beauty economics look like when proprietary
    brands, not marketplace commissions, carry most of the value. Purplle now appears to sit between those
    two models. The competitive read-through is necessarily comparative rather than perfectly normalized,
    because the fetched sources mix public-company disclosures, private retail surfaces, and trade commentary.
    Even so, the patterns are strong enough to locate Purplle between distribution-heavy specialists and
    owned-brand-led beauty houses. Additional triangulation across fetched sources reduces headline uncertainty,
    but not enough to replace direct company disclosures or audited forward data where those remain absent.
