- id: benchmark-quality-and-open-questions
  title: Benchmark quality and open questions
  body: The competitor picture is useful but incomplete. Nykaa and Honasa are strong benchmarks because
    they disclose more. Tira and Myntra are directionally helpful but financially opaque at the business-unit
    level. Purplle itself remains the biggest source of uncertainty because the operating figures that
    would most sharpen competitor analysis — store productivity, category-level contribution, verified
    FY25/FY26 revenue, and margin by owned versus third-party mix — are not yet in the public evidence
    reviewed here. The competitive read-through is necessarily comparative rather than perfectly normalized,
    because the fetched sources mix public-company disclosures, private retail surfaces, and trade commentary.
    Even so, the patterns are strong enough to locate Purplle between distribution-heavy specialists and
    owned-brand-led beauty houses. Additional triangulation across fetched sources reduces headline uncertainty,
    but not enough to replace direct company disclosures or audited forward data where those remain absent.
