- id: secondary-rivals-and-channel-pressure
  title: Secondary rivals and channel pressure
  body: Tira, Myntra Beauty, SUGAR, and Sephora matter for different reasons. Tira raises the UX and assortment
    bar for a specialist beauty retailer. Myntra makes beauty one more category inside a larger lifestyle
    marketplace. SUGAR competes product-by-product in makeup, while Sephora sets the premium aspiration
    ceiling. None is a perfect analogue, but together they show how many ways beauty demand can be monetized
    in India. The competitive read-through is necessarily comparative rather than perfectly normalized,
    because the fetched sources mix public-company disclosures, private retail surfaces, and trade commentary.
    Even so, the patterns are strong enough to locate Purplle between distribution-heavy specialists and
    owned-brand-led beauty houses. Additional triangulation across fetched sources reduces headline uncertainty,
    but not enough to replace direct company disclosures or audited forward data where those remain absent.
