  title: Competitors
  summary: Purplle competes in a fragmented field and increasingly looks like a hybrid between Nykaa's
    specialist retail model and Honasa's owned-brand economics.
sections:
- id: competitive-field
  title: Competitive field
  body: 'Purplle does not face one monolithic competitor. The relevant field splits into several archetypes:
    Nykaa as the listed beauty specialist, Honasa as the public house-of-brands operator, Tira as the
    multi-brand specialist retailer, Myntra as the horizontal marketplace adjacency, and SUGAR or Sephora
    as focused brand or premium-channel rivals. This fragmentation matters because it means Purplle can
    be strategically strong in one axis while still looking weak in another. The competitive read-through
    is necessarily comparative rather than perfectly normalized, because the fetched sources mix public-company
    disclosures, private retail surfaces, and trade commentary. Even so, the patterns are strong enough
    to locate Purplle between distribution-heavy specialists and owned-brand-led beauty houses. Additional
    triangulation across fetched sources reduces headline uncertainty, but not enough to replace direct
    company disclosures or audited forward data where those remain absent.'
