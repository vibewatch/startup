  topStrengths:
  - Large beauty-market exposure with strong relevance to India's mid-income and non-metro shopper.
  - Hybrid model blends marketplace reach with increasingly meaningful owned-brand economics.
  - FY24 showed real efficiency improvement before a large 2024 financing reset runway.
  topRisks:
  - Public disclosure remains too thin on audited forward financials, margins, governance, and retention.
  - Customer-trust frictions are visible in complaints around delivery, returns, refunds, and support.
  - Rapid store expansion and owned-brand concentration could amplify execution and inventory risk.
  unresolvedGaps:
  - Need direct audited FY25/FY26 statements or MCA filing-grade evidence to validate the post-round scale
    story.
  - Need board, governance-rights, and investor-control visibility after the 2024 round.
  - Need gross-margin, repeat-order, and retention-quality metrics to underwrite valuation with confidence.
