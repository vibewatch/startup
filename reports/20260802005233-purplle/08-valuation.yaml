chapter:
  number: 8
  title: Valuation
  summary: 'Purplle looks strategically interesting but not yet cleanly underwriteable: the 2024 unicorn
    mark is stretched on verified FY24 numbers and only becomes more defensible if weaker later trade-reported
    scale claims hold.'
sections:
- id: last-known-mark
  title: Last known mark
  body: Purplle clearly achieved unicorn status after the relevant cutoff, and the last directly supportable
    external mark is the 2024 round at roughly US$1.2B-US$1.25B. The key valuation question is not whether
    that mark existed. It is whether that mark still looks justified on the strongest public operating
    evidence available today. Valuation judgment is especially sensitive here because the best verified
    base year is older and less flattering than later trade-reported scale claims. The right use of this
    section is to frame the range of plausible outcomes and the diligence discount required before treating
    the last round mark as fully supported. Additional triangulation across fetched sources reduces headline
    uncertainty, but not enough to replace direct company disclosures or audited forward data where those
    remain absent. Additional triangulation across fetched sources reduces headline uncertainty, but not
    enough to replace direct company disclosures or audited forward data where those remain absent.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV009
  - CV010
  tableRefs:
  - TV001
- id: what-the-mark-implies
  title: What the mark implies
  body: If FY24 revenue of ₹680 crore is the only defensible financial base, the 2024 round implies a
    rich ~14.6x-15.3x revenue multiple for a still-loss-making company. That is not impossible in a strong
    category, but it leaves little margin for disappointment. If later FY25 and FY26 trade figures are
    directionally right, the story becomes materially easier to defend. Valuation judgment is especially
    sensitive here because the best verified base year is older and less flattering than later trade-reported
    scale claims. The right use of this section is to frame the range of plausible outcomes and the diligence
    discount required before treating the last round mark as fully supported. Additional triangulation
    across fetched sources reduces headline uncertainty, but not enough to replace direct company disclosures
    or audited forward data where those remain absent. Additional triangulation across fetched sources
    reduces headline uncertainty, but not enough to replace direct company disclosures or audited forward
    data where those remain absent.
