- id: diligence-discount
  title: Diligence discount
  body: 'Purplle deserves a material diligence discount relative to the narrative strength of its 2024
    round. The reasons are straightforward: the strongest verified year is still loss-making, customer-trust
    frictions are visible, and the later operating numbers that would make the mark feel fair are not
    directly audited in the retained evidence. Governance opacity adds to the discount. Valuation judgment
    is especially sensitive here because the best verified base year is older and less flattering than
    later trade-reported scale claims. The right use of this section is to frame the range of plausible
    outcomes and the diligence discount required before treating the last round mark as fully supported.
    Additional triangulation across fetched sources reduces headline uncertainty, but not enough to replace
    direct company disclosures or audited forward data where those remain absent. Additional triangulation
    across fetched sources reduces headline uncertainty, but not enough to replace direct company disclosures
    or audited forward data where those remain absent.'
  claimRefs:
