      - number: '2.2'
        title: 渠道组合与全渠道现实
        blocks:
          - type: paragraph
            body: >-
              线上美妆已经成为主要渠道，但这个品类仍有庞大的线下基盘。IMARC 给出的 2025 年线上店铺占比 30%，与 WorldMetrics
              较早的线下为主表述并不矛盾，更多是时间点不同：美妆正快速线上化，但信任、试用和履约仍然关键。因此，即便是 Purplle
              这样的应用主导型垂直平台，全渠道执行也有战略意义。本节使用方向性市场证据，而不是押注一个完美数据集，因为美妆市场规模和渠道份额会随来源方法不同而变化。重要的不只是头部数字，而是数字化加速、高端化和线下仍重要这三件事同时成立。跨已抓取来源进一步交叉验证能降低标题数字的不确定性，但还不足以替代公司直接披露，或在缺位时替代经审计的前瞻数据。
