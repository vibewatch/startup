              Purplle
              对目标客户的自我描述，与更广的市场证据相互印证：印度美妆需求由有上升愿望的中等收入家庭、非一线城市更深渗透，以及数字发现行为拉动。较弱的二级来源显示，线上研究和视频影响都很强；这些具体百分比需要谨慎看待，但方向信息清楚地被垂直竞争对手在应用、内容和货品陈列上的投入证实。Purplle
