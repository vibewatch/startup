          to: trust
        - from: trust
          to: economics
        - from: economics
          to: valuation
    claimRefs:
      - CR002
      - CR006
      - CR019
      - CR033
      - CR037
      - CR038
  - id: FR002
    title: 监管敞口矩阵
    type: matrix
    layout: wide
    summary: Purplle 的监管画像横跨电商、化妆品、数据和广告，不是单一窄口径规则。
    data:
      columns:
        - 直接影响度
        - 违规后严重度
        - 当前公开可见度
      rows:
        - label: 电商消费者规则
          values:
            - 高
            - 高
            - 中
        - label: 化妆品 / 标签合规
          values:
            - 高
            - 高
            - 低-中
        - label: 数据保护 / IT 法
          values:
            - 高
            - 高
            - 低
        - label: 广告 / 达人宣称
          values:
            - 中-高
            - 中-高
            - 低-中
        - label: BIS 质量标准
          values:
            - 中
            - 中
            - 低
    claimRefs:
      - CR009
      - CR011
      - CR012
      - CR013
      - CR014
      - CR015
    approximationNotes: 敞口等级基于商业模式和公开产品界面的分析判断。
  - id: FR003
    title: 风险评分卡
    type: kpi
    layout: standard
    summary: 需求风险看起来可控；披露、服务质量和执行风险更关键。
    data:
      items:
        - label: 市场需求风险
          value: 4
          max: 10
          note: 美妆品类需求大且在增长。
        - label: 客户信任风险
          value: 8
          max: 10
          note: 投诉面显示问题有实质影响。
        - label: 披露风险
          value: 8
          max: 10
          note: 私企可见度有限。
        - label: 监管风险
          value: 6
          max: 10
          note: 电商、化妆品、数据、宣称均受到多套规则覆盖。
        - label: 执行风险
          value: 8
          max: 10
          note: 线下扩张和服务质量都有真实风险。
        - label: 流动性风险
          value: 3
          max: 10
          note: 2024 年融资缓解近期资金压力。
    claimRefs:
      - CR016
      - CR021
      - CR022
      - CR036
      - CR037
      - CR038
    approximationNotes: 分数是作者对重要性的判断，不是统计模型。
  - id: FR004
    title: 反向信号时间线
    type: timeline
    layout: wide
    summary: Purplle 的公开反向信号集中在服务摩擦和披露限制上，而不是某个灾难性单点事件。
    data:
      items:
        - date: '2024'
          label: 退货 / 客服投诉可见
          detail: App Store 评论抱怨配送、退款和客服问题。
          tone: warning
        - date: '2024'
          label: FY24 改善后仍亏损
          detail: 运营已有进展，但盈利能力尚未被证明。
          tone: warning
        - date: 2024-10
          label: 已完成独角兽融资
          detail: 降低流动性风险，但也可能抬高预期。
          tone: neutral
        - date: '2026'
          label: 门店和自有品牌扩张说法增多
          detail: 可能带来上行，但执行和集中度风险也更高。
          tone: warning
    claimRefs:
      - CR004
      - CR006
      - CR016
      - CR020
      - CR021
      - CR036
  - id: FV001
    title: 建议逻辑链条
    type: flow
    layout: wide
    summary: Purplle 具备真实品类质量和增长支撑，但在最后已知估值上，披露缺口和服务风险挡住了高确定性的乐观情景。
    data:
      nodes:
        - id: market
          label: 规模大且增长中的美妆市场
          detail: 支撑可规模化的品类赢家。
          tone: positive
        - id: scale
          label: 10M+ 消费者，以及据报道的融资后规模
          detail: 显示出实质性平台价值。
          tone: positive
        - id: fy24
          label: FY24 基础仍亏损
          detail: 已验证的最好年度仍为负。
          tone: warning
        - id: trust
          label: 客户信任与披露缺口
          detail: 客服、退货和可见度仍是弱点。
          tone: warning
        - id: rec
          label: 建议：继续研究
          detail: 需要更强的审计与治理证据。
          tone: warning
      edges:
        - from: market
          to: rec
          label: 支撑关注
        - from: scale
          to: rec
          label: 支撑关注
        - from: fy24
          to: rec
          label: 挡住确定性
        - from: trust
          to: rec
          label: 需要折价
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV028
      - CV036
      - CV037
      - CV039
  - id: FV002
    title: 估值敏感性条形图
    type: bar
    layout: wide
    summary: 以 FY24 收入为基准，Purplle 的最后估值接近公开证据可支撑区间的上沿。
    data:
      items:
        - label: 5x FY24 收入
          value: 3400
          unit: ₹cr
        - label: 6x FY24 收入
          value: 4080
          unit: ₹cr
        - label: 8x FY24 收入
          value: 5440
          unit: ₹cr
        - label: 10x FY24 收入
          value: 6800
          unit: ₹cr
        - label: 12x FY24 收入
          value: 8160
          unit: ₹cr
        - label: 15x FY24 收入
          value: 10200
          unit: ₹cr
    claimRefs:
      - CV031
      - CV032
      - CV033
    approximationNotes: 仅用 FY24 收入作为基数，用收入倍数示意股权价值敏感性。
  - id: FV003
    title: 估值区间
    type: range
    layout: standard
    summary: 由于 FY24 与后续行业报道之间的公开证据质量差异很大，宽估值区间比单点估计更站得住。
    data:
      items:
        - label: 悲观情景
          low: 3400
          mid: 4100
          high: 5000
          unit: ₹cr
        - label: 基准情景
          low: 5400
          mid: 6400
          high: 7600
          unit: ₹cr
        - label: 乐观情景
          low: 8200
          mid: 9600
          high: 10400
          unit: ₹cr
        - label: 最后已知估值
          low: 9960
          mid: 10170
          high: 10375
          unit: ₹cr
    claimRefs:
      - CV006
      - CV007
      - CV008
      - CV028
      - CV029
      - CV030
      - CV031
      - CV032
      - CV033
    approximationNotes: 区间采用简单收入倍数情景，并对 2024 年估值标记使用近似 USD/INR 汇率换算。
  - id: FV004
    title: 投资评分卡
    type: kpi
    layout: standard
    summary: Purplle 在市场和战略意义上得分高，但证据质量和估值支撑偏弱。
    data:
      items:
        - label: 市场质量
          value: 8
          max: 10
          note: 品类大且在增长。
        - label: 战略意义
          value: 7
          max: 10
          note: 分销已跑出来，自有品牌有潜力。
        - label: 客户证据
          value: 6
          max: 10
          note: 规模信号强，服务信号好坏参半。
        - label: 披露质量
          value: 3
          max: 10
          note: 仍是私企，披露依然不足。
        - label: 估值支撑
          value: 4
          max: 10
          note: 按已验证 FY24 基础看，最后估值偏高。
        - label: 投资判断信心
          value: 4
          max: 10
          note: 前瞻数据和治理缺口太多。
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV028
      - CV036
      - CV037
      - CV039
    approximationNotes: 分数是面向投委会讨论的分析判断，不是公式输出。
