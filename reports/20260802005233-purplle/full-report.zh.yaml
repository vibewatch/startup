        title: 竞争场域
        blocks:
          - type: paragraph
            body: >-
              Purplle 面对的不是一个单一巨型对手。相关竞争场域分成几类原型：Nykaa 是上市美妆垂直平台，Honasa 是公开的品牌集团运营商，Tira 是多品牌垂直零售商，Myntra
              是横向交易平台的相邻竞争者，SUGAR 或 Sephora 则是聚焦品牌或高端渠道的对手。碎片化很关键，因为它意味着 Purplle
              可能在一个维度很强，同时在另一个维度显弱。竞争映射只能做比较，无法完全标准化，因为已抓取来源混合了上市公司披露、私营零售界面和行业评论。即便如此，这些模式已经足以把 Purplle
              定位在分销较重的垂直平台和自有品牌主导的美妆集团之间。跨已抓取来源进一步交叉验证能降低标题数字的不确定性，但还不足以替代公司直接披露，或在缺位时替代经审计的前瞻数据。
