        title: 子品类与高端化
        blocks:
          - type: paragraph
            body: >-
              护肤看起来是结构上最有吸引力的细分，因为它兼具当前大份额、复购和强内容驱动发现。高端化也是真实趋势：第三方来源指向不断扩大的高端美妆池、K-beauty
              和功效护肤影响力上升，以及消费者对成分和功效的更高预期。Purplle
              不是以奢侈品为先的零售商，但高端化仍重要，因为它会影响消费者向往和竞争对手货盘。本节使用方向性市场证据，而不是押注一个完美数据集，因为美妆市场规模和渠道份额会随来源方法不同而变化。重要的不只是头部数字，而是数字化加速、高端化和线下仍重要这三件事同时成立。跨已抓取来源进一步交叉验证能降低标题数字的不确定性，但还不足以替代公司直接披露，或在缺位时替代经审计的前瞻数据。
