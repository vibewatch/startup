companyProfile:
  summary: >-
    Purplle 是一家印度美妆与个护电商平台，2012 年创立于 Mumbai。公司把多品牌交易平台、 不断扩大的自有美妆品牌组合、移动端优先的发现体验，以及快速扩张的全渠道触点放在一起。2024 年，Purplle 通过 ADIA
    领投的 Series F 融资进入独角兽行列，目标客群指向印度中等收入、二三线城市美妆消费者。
