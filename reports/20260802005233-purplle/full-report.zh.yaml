  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 政策与责任
        blocks:
          - type: paragraph
            body: >-
              第一层风险是结构性的。Purplle
              自己的条款描述了一个混合模型：平台经常作为撮合方，同时也打造自有品牌，并在某些情况下作为卖方。这在经济性上有吸引力，但订单出错时，也会让客户更难理解责任归属。严格的退货政策放大了这个问题。这个风险项的实际重要性，不只取决于它是否存在，也取决于公司提供多少披露和缓释证据。放在
              Purplle 身上，反复出现的主题是：真正决定可投资性的，不只是品类需求，执行和透明度同样重要。跨已抓取来源进一步交叉验证能降低标题数字的不确定性，但还不足以替代公司直接披露，或在缺位时替代经审计的前瞻数据。
