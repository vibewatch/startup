            body: >-
              Purplle 的公司自有公开材料呈现的是一家创始人主导、从 Mumbai
              起步的美妆垂直平台，运营控制权仍集中在联合创始人和核心技术负责人周围。合规与条款页面异常有用，因为它们披露了当前运营实体、注册地址，以及公司对自己何时作为撮合方、何时作为卖方的解释。这一点很重要：平台越来越像交易平台分销和自有品牌经济性的混合体，而不是纯交易平台。本节只强调已抓取证据中最扎实的部分，并标出公开记录仍弱于上市公司级尽调材料包的地方。这个框架重要，因为投资人可以确认公司存在、融资和大方向，但在把叙事视为已充分支撑前，仍需要更深的运营披露。
