  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场规模与增长
        blocks:
          - type: paragraph
            body: >-
              本次审阅证据里，最干净的市场规模锚点是 IMARC 对印度美妆和个护市场 2025 年约 US$31.19 billion 的估计，并给出到 2034 年接近 US$48.72 billion
              的路径。Entrepreneur India
              落在相近区间，但口径略有不同；这提醒我们，这里的市场数字只能作方向性参考，不是审计级事实。关键投资结论很简单：印度美妆足够大，可以支撑多个规模化平台，但增长方式不像赢家通吃的软件市场。本节使用方向性市场证据，而不是押注一个完美数据集，因为美妆市场规模和渠道份额会随来源方法不同而变化。重要的不只是头部数字，而是数字化加速、高端化和线下仍重要这三件事同时成立。跨已抓取来源进一步交叉验证能降低标题数字的不确定性，但还不足以替代公司直接披露，或在缺位时替代经审计的前瞻数据。
