company:
  name: Purplle
chapter:
  number: 7
  title: Risks
  summary: Purplle's main risks are not market demand but execution, trust, compliance surface area, and
    the persistent opacity of a fast-scaling private company.
sections:
- id: policy-and-liability
  title: Policy and liability
  body: The first risk layer is structural. Purplle's own terms describe a hybrid model in which the platform
    often acts as facilitator while also building owned brands and, in some cases, acting as seller. That
    is economically attractive, but it also makes responsibility harder for customers to understand when
    orders go wrong. The restrictive returns policy intensifies that problem. The practical importance
    of this risk item depends not only on whether it exists but also on how much disclosure and mitigation
    evidence the company provides. In Purplle's case, the recurring theme is that execution and transparency
    matter as much as category demand in determining real investability. Additional triangulation across
    fetched sources reduces headline uncertainty, but not enough to replace direct company disclosures
    or audited forward data where those remain absent.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR033
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: customer-trust-risk
  title: Customer-trust risk
  body: The strongest adverse evidence in the retained set comes from customer-facing complaint surfaces.
    Reviews repeatedly cite delayed deliveries, wrong items, refund disputes, return denials, and inconsistent
    support. At least one review alleges counterfeit goods, which is especially damaging in beauty because
    authenticity and safety are trust-critical. These are not necessarily representative of the full base,
    but they are too consistent to ignore. The practical importance of this risk item depends not only
    on whether it exists but also on how much disclosure and mitigation evidence the company provides.
    In Purplle's case, the recurring theme is that execution and transparency matter as much as category
    demand in determining real investability. Additional triangulation across fetched sources reduces
    headline uncertainty, but not enough to replace direct company disclosures or audited forward data
    where those remain absent.
  claimRefs:
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR031
  - CR032
  - CR040
  tableRefs:
  - TR002
  figureRefs:
  - FR004
- id: regulatory-risk
  title: Regulatory risk
  body: Purplle sits inside several overlapping regulatory frameworks. Consumer-protection and e-commerce
    rules matter because it is a consumer marketplace. CDSCO and BIS matter because it sells beauty products.
    DPDP and the IT Act matter because it collects user data through digital channels. ASCI matters because
    beauty commerce leans heavily on claims, content, and promotional framing. None of these regimes alone
    is fatal, but together they create meaningful compliance surface area. The practical importance of
    this risk item depends not only on whether it exists but also on how much disclosure and mitigation
    evidence the company provides. In Purplle's case, the recurring theme is that execution and transparency
    matter as much as category demand in determining real investability. Additional triangulation across
    fetched sources reduces headline uncertainty, but not enough to replace direct company disclosures
    or audited forward data where those remain absent.
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  tableRefs:
  - TR003
  figureRefs:
  - FR002
- id: financial-and-strategic-risk
  title: Financial and strategic risk
  body: The financial risk is not that Purplle lacks demand; it is that the company is still loss-making,
    still under-disclosed, and now appears to be adding stores and leaning harder into owned brands. If
    the later trade data is directionally correct, those strategic moves could improve margin — or magnify
    execution risk and inventory concentration. Add competition from better-disclosed peers, and the risk
    profile becomes much more about execution quality than about market existence. The practical importance
    of this risk item depends not only on whether it exists but also on how much disclosure and mitigation
    evidence the company provides. In Purplle's case, the recurring theme is that execution and transparency
    matter as much as category demand in determining real investability. Additional triangulation across
    fetched sources reduces headline uncertainty, but not enough to replace direct company disclosures
    or audited forward data where those remain absent.
  claimRefs:
  - CR016
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  - CR022
  - CR027
  - CR028
  - CR029
  - CR030
  - CR036
  - CR037
  - CR038
  tableRefs:
  - TR004
  - TR005
- id: governance-and-open-questions
  title: Governance and open questions
  body: The final risk layer is governance and observability. Purplle remains a private company, and the
    retained evidence set does not provide the board, the direct audited statements, or the metrics that
    would let an investor cleanly separate narrative strength from operating quality. The best public
    mitigants are the 2024 financing round and the FY24 efficiency improvement, but the biggest unresolved
    questions — gross margin, retention quality, governance, and the credibility of FY25/FY26 claims —
    remain very material. The practical importance of this risk item depends not only on whether it exists
    but also on how much disclosure and mitigation evidence the company provides. In Purplle's case, the
    recurring theme is that execution and transparency matter as much as category demand in determining
    real investability. Additional triangulation across fetched sources reduces headline uncertainty,
    but not enough to replace direct company disclosures or audited forward data where those remain absent.
