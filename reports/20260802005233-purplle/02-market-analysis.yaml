- id: subcategory-and-premiumization
  title: Subcategory and premiumization
  body: 'Skincare looks like the most attractive structural pocket because it combines large current share,
    repeat purchase, and strong content-led discovery. Premiumization is also real: third-party sources
    point to a growing premium-beauty pool, expanding K-beauty and dermocosmetic influence, and higher
    expectations around ingredients and efficacy. Purplle is not positioned as a luxury-first retailer,
    but premiumization still matters because it shapes shopper aspiration and competitor assortment. This
    section uses directional market evidence rather than a single perfect dataset, because beauty market
    sizing and channel shares vary by source methodology. The important takeaway is less the exact headline
    number than the combination of digital acceleration, premiumization, and continuing offline relevance.
    Additional triangulation across fetched sources reduces headline uncertainty, but not enough to replace
    direct company disclosures or audited forward data where those remain absent.'
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
  - CM012
  - CM013
  - CM026
  - CM031
