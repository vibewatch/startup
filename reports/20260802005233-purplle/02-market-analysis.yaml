  title: Market Analysis
  summary: India beauty is a large, steadily growing, digitally accelerating market whose economics still
    depend on trust, merchandising, and omnichannel execution rather than pure online scale.
sections:
- id: market-size-and-growth
  title: Market size and growth
  body: 'The cleanest market-size anchor in the reviewed evidence is IMARC''s ~US$31.19 billion estimate
    for India beauty and personal care in 2025, with a path toward nearly US$48.72 billion by 2034. Entrepreneur
    India lands in a similar range but uses slightly different framing, which is a reminder that market
    numbers here are directional rather than audit-grade. The key investment takeaway is simple: India
    beauty is large enough to support multiple scaled platforms, but it is not growing like a winner-take-all
    software market. This section uses directional market evidence rather than a single perfect dataset,
    because beauty market sizing and channel shares vary by source methodology. The important takeaway
    is less the exact headline number than the combination of digital acceleration, premiumization, and
    continuing offline relevance. Additional triangulation across fetched sources reduces headline uncertainty,
    but not enough to replace direct company disclosures or audited forward data where those remain absent.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM033
  tableRefs:
  - TM001
  figureRefs:
  - FM001
- id: channel-mix-and-omnichannel-reality
  title: Channel mix and omnichannel reality
  body: 'Online beauty has become a major channel, yet the category still has a large offline base. IMARC''s
    30% online-store share in 2025 and WorldMetrics'' older offline-heavy framing are not contradictory
    so much as temporally different: beauty is migrating online fast, but trust, trial, and fulfillment
    still matter. That makes omnichannel execution strategically relevant even for app-led specialists
    such as Purplle. This section uses directional market evidence rather than a single perfect dataset,
    because beauty market sizing and channel shares vary by source methodology. The important takeaway
    is less the exact headline number than the combination of digital acceleration, premiumization, and
    continuing offline relevance. Additional triangulation across fetched sources reduces headline uncertainty,
    but not enough to replace direct company disclosures or audited forward data where those remain absent.'
  claimRefs:
  - CM005
  - CM006
  - CM007
  - CM018
  - CM019
  - CM022
  - CM034
  tableRefs:
  - TM004
  figureRefs:
  - FM002
- id: consumer-demand-drivers
  title: Consumer demand drivers
  body: 'Purplle''s own target-customer description lines up with broader market evidence: India''s beauty
    demand is being driven by aspirational middle-income households, deeper non-metro adoption, and digital
    discovery behaviors. Weaker secondary sources suggest heavy online research and high video influence;
    while those exact percentages should be treated cautiously, the directional message is clearly corroborated
    by how specialist competitors invest in apps, content, and merchandising. Purplle''s tier-2/3 revenue
    mix is particularly important because it grounds the market thesis in company-specific demand proof.
    This section uses directional market evidence rather than a single perfect dataset, because beauty
    market sizing and channel shares vary by source methodology. The important takeaway is less the exact
    headline number than the combination of digital acceleration, premiumization, and continuing offline
    relevance. Additional triangulation across fetched sources reduces headline uncertainty, but not enough
    to replace direct company disclosures or audited forward data where those remain absent.'
  claimRefs:
  - CM015
  - CM016
  - CM017
  - CM018
  - CM019
  - CM020
  - CM021
  - CM032
  tableRefs:
  - TM002
