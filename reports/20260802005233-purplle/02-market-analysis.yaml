- id: market-risks-and-read-through-for-purplle
  title: Market risks and read-through for Purplle
  body: The same market that supports strong growth also creates real operating difficulty. Counterfeit
    risk, ingredient scrutiny, and regional diversity all raise the cost of curating and policing assortment.
    Add omnichannel expectations and quick-commerce pressure, and beauty e-commerce can become less profitable
    than the top-line story implies. For Purplle, that means the market is attractive enough to justify
    continued investment, but not easy enough to underwrite without more evidence on economics. This section
    uses directional market evidence rather than a single perfect dataset, because beauty market sizing
    and channel shares vary by source methodology. The important takeaway is less the exact headline number
    than the combination of digital acceleration, premiumization, and continuing offline relevance. Additional
    triangulation across fetched sources reduces headline uncertainty, but not enough to replace direct
    company disclosures or audited forward data where those remain absent.
  claimRefs:
  - CM023
  - CM024
  - CM025
  - CM026
