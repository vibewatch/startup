      - number: '1.1'
        title: Origin and governance
        blocks:
          - type: paragraph
            body: >-
              Purplle's public company-owned materials present a founder-led beauty specialist built from Mumbai with
              operational control still concentrated around its co-founders and core technologist. The compliance and
              terms pages are unusually useful because they disclose the current operating entities, the registered
              office, and the company's own explanation of when it acts as facilitator versus seller. That matters
              because the platform increasingly looks like a hybrid of marketplace distribution and owned-brand
              economics rather than a pure marketplace. This section emphasizes only the strongest fetched evidence and
              highlights where the public record is still thinner than a listed-company diligence package. That framing
              matters because investors can confirm existence, financing, and broad strategy, but still need deeper
              operational disclosure before treating the narrative as fully underwritten.
