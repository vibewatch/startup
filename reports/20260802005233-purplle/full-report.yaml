  - id: FO001
    title: Purplle milestone timeline
    type: timeline
    layout: wide
    summary: >-
      Purplle's public story runs from a 2012 founding through a 2024 unicorn round and a materially larger omnichannel
      footprint reported by 2026.
    data:
      items:
        - date: '2012'
          label: Founding
          detail: >-
            Purplle is founded by Manish Taneja and Rahul Dash; Suyash Katyayani leads technology in current leadership
            materials.
          tone: positive
        - date: 2024-07
          label: Series F first tranche
          detail: BusinessLine reports a ~₹1,000 crore first tranche ahead of the full round close.
          tone: positive
        - date: 2024-10
          label: Series F close at unicorn mark
          detail: Purplle closes ~₹1,500 crore and is valued around US$1.2B-US$1.25B.
          tone: positive
        - date: '2024'
          label: 10M+ monthly consumers and 20,000 touchpoints
          detail: Funding coverage highlights large consumer reach beyond metros.
          tone: positive
        - date: '2024'
          label: Offline rollout still early
          detail: Mint says Purplle had only two stores and planned another five to ten.
          tone: neutral
        - date: '2025'
          label: FY25 scale-up reported by trade media
          detail: IMAGES Business of Fashion reports FY25 revenue of ~₹1,367 crore with owned brands driving most sales.
          tone: positive
        - date: '2026'
          label: ~200 stores reported
          detail: Trade media frames Purplle as a broader omnichannel beauty network.
          tone: positive
