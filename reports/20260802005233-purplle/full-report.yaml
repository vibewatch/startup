        title: Market risks and read-through for Purplle
        blocks:
          - type: paragraph
            body: >-
              The same market that supports strong growth also creates real operating difficulty. Counterfeit risk,
              ingredient scrutiny, and regional diversity all raise the cost of curating and policing assortment. Add
              omnichannel expectations and quick-commerce pressure, and beauty e-commerce can become less profitable
              than the top-line story implies. For Purplle, that means the market is attractive enough to justify
              continued investment, but not easy enough to underwrite without more evidence on economics. This section
              uses directional market evidence rather than a single perfect dataset, because beauty market sizing and
