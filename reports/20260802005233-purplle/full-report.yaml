              The first risk layer is structural. Purplle's own terms describe a hybrid model in which the platform
              often acts as facilitator while also building owned brands and, in some cases, acting as seller. That is
              economically attractive, but it also makes responsibility harder for customers to understand when orders
              go wrong. The restrictive returns policy intensifies that problem. The practical importance of this risk
