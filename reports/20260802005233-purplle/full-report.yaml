        title: Subcategory and premiumization
        blocks:
          - type: paragraph
            body: >-
              Skincare looks like the most attractive structural pocket because it combines large current share, repeat
              purchase, and strong content-led discovery. Premiumization is also real: third-party sources point to a
              growing premium-beauty pool, expanding K-beauty and dermocosmetic influence, and higher expectations
              around ingredients and efficacy. Purplle is not positioned as a luxury-first retailer, but premiumization
              still matters because it shapes shopper aspiration and competitor assortment. This section uses
              directional market evidence rather than a single perfect dataset, because beauty market sizing and channel
