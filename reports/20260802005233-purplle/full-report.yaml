              grew revenue strongly, nearly halved losses, and reduced marketing intensity. This is not the same as
              profitability, but it is enough to show that the business was moving toward better operating discipline
              before the 2024 financing round. The numbers here should be treated as the best available public anchor
              rather than a full audited diligence model. That distinction matters because a private consumer company
              can show genuine improvement while still leaving large questions unanswered on margin quality, cash
              conversion, and forward operating leverage. Additional triangulation across fetched sources reduces
