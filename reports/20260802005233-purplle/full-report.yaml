companyProfile:
  summary: >-
    Purplle is an Indian beauty and personal-care commerce platform founded in 2012 in Mumbai. It combines a multi-brand
    marketplace, a growing portfolio of owned beauty labels, a mobile-first discovery experience, and a rapidly
    expanding omnichannel footprint. The company reached unicorn status in 2024 via a Series F financing led by ADIA and
    is positioned toward India's mid-income, tier-2 and tier-3 beauty shopper.
