    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market size and growth
        blocks:
          - type: paragraph
            body: >-
              The cleanest market-size anchor in the reviewed evidence is IMARC's ~US$31.19 billion estimate for India
              beauty and personal care in 2025, with a path toward nearly US$48.72 billion by 2034. Entrepreneur India
              lands in a similar range but uses slightly different framing, which is a reminder that market numbers here
              are directional rather than audit-grade. The key investment takeaway is simple: India beauty is large
              enough to support multiple scaled platforms, but it is not growing like a winner-take-all software market.
              This section uses directional market evidence rather than a single perfect dataset, because beauty market
              sizing and channel shares vary by source methodology. The important takeaway is less the exact headline
              number than the combination of digital acceleration, premiumization, and continuing offline relevance.
              Additional triangulation across fetched sources reduces headline uncertainty, but not enough to replace
              direct company disclosures or audited forward data where those remain absent.
