- id: catalog-content-and-personalization
  title: Catalog, content, and personalization
  body: The most interesting product signal is the way Purplle combines content with commerce. Beauty
    Edit, topical guides, “thousands of makeup looks,” and Beauty Assistant all suggest a funnel designed
    to increase discovery and reduce decision friction. The sitemap reinforces that interpretation by
    exposing product brands, categories, reviews, collections, and editorial surfaces as parallel indexable
    assets. Public product evidence in this chapter is stronger on the shopper-facing surface than on
    internal engineering architecture. That is still useful for diligence because it shows how Purplle
    actually merchandises discovery, conversion, and support, even if the deeper technical stack remains
    largely undisclosed. Additional triangulation across fetched sources reduces headline uncertainty,
    but not enough to replace direct company disclosures or audited forward data where those remain absent.
  claimRefs:
  - CE014
  - CE015
  - CE016
  - CE029
  - CE030
  - CE032
  - CE035
  figureRefs:
  - FE002
  - FE003
- id: assortment-and-brand-merchandising
  title: Assortment and brand merchandising
  body: 'Purplle is clearly not a single-brand app. Public category and brand pages show a hybrid assortment
    strategy: owned or closely aligned brands receive first-class treatment, but well-known third-party
    brands are also deeply embedded in the catalog. The later 2026 scale claims, if directionally accurate,
    imply that search, discovery, and merchandising tooling already operate at meaningful catalog breadth.
    Public product evidence in this chapter is stronger on the shopper-facing surface than on internal
    engineering architecture. That is still useful for diligence because it shows how Purplle actually
    merchandises discovery, conversion, and support, even if the deeper technical stack remains largely
    undisclosed. Additional triangulation across fetched sources reduces headline uncertainty, but not
    enough to replace direct company disclosures or audited forward data where those remain absent.'
  claimRefs:
  - CE017
  - CE018
  - CE019
  - CE026
  - CE027
  tableRefs:
  - TE003
- id: operations-support-and-post-purchase-risk
  title: Operations, support, and post-purchase risk
  body: Public evidence on operations is mixed. Support and payment surfaces are visible, and order-tracking
    is exposed. But the policy framework is restrictive and negative reviews cluster around post-purchase
    failure modes — delivery, refunds, returns, and customer support. That means the product thesis is
    stronger on discovery than on the confidence users place in fulfillment execution. Public product
    evidence in this chapter is stronger on the shopper-facing surface than on internal engineering architecture.
    That is still useful for diligence because it shows how Purplle actually merchandises discovery, conversion,
    and support, even if the deeper technical stack remains largely undisclosed. Additional triangulation
    across fetched sources reduces headline uncertainty, but not enough to replace direct company disclosures
    or audited forward data where those remain absent.
  claimRefs:
  - CE010
  - CE011
  - CE020
  - CE021
  - CE022
  - CE023
  - CE024
  - CE033
  tableRefs:
  - TE004
