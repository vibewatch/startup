- id: tech-read-through-and-gaps
  title: Tech read-through and gaps
  body: Purplle's public product-tech evidence is sufficient to show a coherent commerce stack, but not
    enough to claim a deep technical moat. There is no engineering documentation, public API surface,
    or explicit data/ML architecture in the retained sources. The best case is that Purplle has built
    a credible discovery-to-conversion system around catalog, content, and private-label merchandising;
    the worst visible risk is that service execution undercuts that front-end value. Public product evidence
    in this chapter is stronger on the shopper-facing surface than on internal engineering architecture.
    That is still useful for diligence because it shows how Purplle actually merchandises discovery, conversion,
    and support, even if the deeper technical stack remains largely undisclosed. Additional triangulation
    across fetched sources reduces headline uncertainty, but not enough to replace direct company disclosures
    or audited forward data where those remain absent.
