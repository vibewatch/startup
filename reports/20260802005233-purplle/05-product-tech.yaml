chapter:
  number: 5
  title: Product & Tech
  summary: Public evidence shows a coherent mobile-first commerce stack built around content-led discovery,
    broad catalog coverage, and owned-brand merchandising, with the biggest visible risk in post-purchase
    execution rather than front-end product design.
sections:
- id: surface-and-workflow
  title: Surface and workflow
  body: Purplle's public product surfaces make it clear that this is a mobile-first beauty commerce experience,
    not just a thin storefront. The app listing lays out the primary categories, merchanting language,
    and value proposition, while the live Beauty Assistant page shows how support, offers, magazine content,
    and category entry points are integrated into the same consumer journey. Public product evidence in
    this chapter is stronger on the shopper-facing surface than on internal engineering architecture.
    That is still useful for diligence because it shows how Purplle actually merchandises discovery, conversion,
    and support, even if the deeper technical stack remains largely undisclosed. Additional triangulation
    across fetched sources reduces headline uncertainty, but not enough to replace direct company disclosures
    or audited forward data where those remain absent.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
