company:
  name: Purplle
chapter:
  number: 6
  title: Customers
  summary: Purplle has credible consumer demand and loyalty mechanics for India's mid-market beauty shopper,
    but public evidence also shows post-purchase trust and service weaknesses that could cap retention
    quality.
sections:
- id: who-the-customer-is
  title: Who the customer is
  body: 'Purplle''s public customer story is unusually explicit for a private e-commerce company. Management
    says the platform focuses on households earning roughly ₹5 lakh to ₹30 lakh annually, and that about
    half of revenue already comes from tier-2 and tier-3 cities. Combined with the app''s “pocket-friendly”
    positioning, this points to a mass-to-masstige customer base that is less prestige-driven and more
    value-and-access driven than the shoppers most associated with luxury beauty retail. Customer evidence
    is inherently mixed because app ratings capture broad sentiment while complaints disproportionately
    surface failure cases. The right read-through is to combine both: acquisition and engagement appear
    credible, but repeat quality and trust are not yet cleanly proven with hard retention metrics. Additional
    triangulation across fetched sources reduces headline uncertainty, but not enough to replace direct
    company disclosures or audited forward data where those remain absent.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU024
  tableRefs:
  - TU001
  figureRefs:
  - FU002
- id: acquisition-and-retention-design
  title: Acquisition and retention design
  body: 'Purplle''s best visible customer strengths are the ones embedded in the product journey: review-driven
    trust, Beauty Assistant, content-led discovery, and a loyalty layer via Elite membership. These are
    plausible retention levers even without direct cohort data. Broad category coverage and strong owned-brand
    presence also create a path to higher repeat purchase and cross-sell over time. Customer evidence
    is inherently mixed because app ratings capture broad sentiment while complaints disproportionately
    surface failure cases. The right read-through is to combine both: acquisition and engagement appear
    credible, but repeat quality and trust are not yet cleanly proven with hard retention metrics. Additional
    triangulation across fetched sources reduces headline uncertainty, but not enough to replace direct
    company disclosures or audited forward data where those remain absent.'
  claimRefs:
