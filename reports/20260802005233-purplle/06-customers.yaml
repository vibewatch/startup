  - TU006
- id: scale-and-convenience
  title: Scale and convenience
  body: 'Purplle clearly has enough scale to matter — 10 million-plus monthly consumers and a later-reported
    expansion to around 200 stores and 20,000 touchpoints. If the 2026 omnichannel data is directionally
    right, convenience and reassurance should improve. But the missing ingredient is hard proof on repeat
    rate, order frequency, and store-level conversion uplift. Customer evidence is inherently mixed because
    app ratings capture broad sentiment while complaints disproportionately surface failure cases. The
    right read-through is to combine both: acquisition and engagement appear credible, but repeat quality
    and trust are not yet cleanly proven with hard retention metrics. Additional triangulation across
    fetched sources reduces headline uncertainty, but not enough to replace direct company disclosures
    or audited forward data where those remain absent.'
  claimRefs:
  - CU001
  - CU026
  - CU029
  - CU035
- id: customer-proof-bottom-line
  title: Customer-proof bottom line
  body: 'Public customer evidence is good enough to say Purplle has demand, brand awareness, and a meaningful
    mobile customer base. It is not good enough to say the company has a demonstrable customer moat. The
    strongest customer-positive facts are scale, loyalty mechanics, and content-led discovery; the strongest
    negatives are post-purchase execution and the absence of disclosed retention metrics. Customer evidence
    is inherently mixed because app ratings capture broad sentiment while complaints disproportionately
    surface failure cases. The right read-through is to combine both: acquisition and engagement appear
    credible, but repeat quality and trust are not yet cleanly proven with hard retention metrics. Additional
    triangulation across fetched sources reduces headline uncertainty, but not enough to replace direct
    company disclosures or audited forward data where those remain absent.'
