figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Purplle's customer journey is strong on discovery and value but vulnerable at fulfillment and
    returns.
  data:
    items:
    - label: Discovery
      stage: Discovery
      actor: Value-conscious beauty shopper
      action: Finds Purplle through app stores, offers, content, or beauty looks
      pain: Large choice set can be confusing
      outcome: Installs app or browses categories
    - label: Selection
      stage: Consideration
      actor: Beauty shopper
      action: Uses Beauty Assistant, reviews, and content to pick products
      pain: Needs confidence on shade / authenticity / fit
      outcome: Adds products to cart
    - label: Conversion
      stage: Checkout
      actor: Member or non-member shopper
      action: Uses secure payments and maybe Elite benefits
      pain: Price sensitivity and promo complexity
      outcome: Places order
    - label: Fulfillment
      stage: Delivery
      actor: Customer + courier
      action: Waits for delivery and tracks order
      pain: Delays, wrong items, courier confusion appear in complaints
      outcome: Satisfaction can swing sharply here
    - label: Recovery / repeat
      stage: Post-purchase
      actor: Customer support
      action: Handles returns, refund, or future purchase
      pain: Return rejections and slow support damage loyalty
      outcome: Either repeat order or churn to alternatives
