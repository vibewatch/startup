- id: customer-friction
  title: Customer friction
  body: 'The problem is that the same public sources that show strong acquisition signals also show real
    trust breaks. Accessible reviews repeatedly mention wrong or missing items, delayed delivery, poor
    support, denied returns, and in at least one case counterfeit concern. That doesn''t invalidate the
    overall demand story, but it does mean customer love is not cleanly bankable. Customer evidence is
    inherently mixed because app ratings capture broad sentiment while complaints disproportionately surface
    failure cases. The right read-through is to combine both: acquisition and engagement appear credible,
    but repeat quality and trust are not yet cleanly proven with hard retention metrics. Additional triangulation
    across fetched sources reduces headline uncertainty, but not enough to replace direct company disclosures
    or audited forward data where those remain absent.'
  claimRefs:
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
  - CU019
  - CU020
  - CU030
  - CU032
  - CU034
  tableRefs:
