- id: sizing-lenses-and-contradictions
  title: Sizing Lenses, Contradictory Estimates, and What Can Actually Be Defended
  body: The market is large enough to matter, but the harder diligence task is choosing the right lens rather than quoting the biggest available TAM. The accessible Grand View summary describes industrial water treatment as a multi-tens-of-billions market with high-single-digit growth, which is directionally helpful but not precise enough to use as a direct revenue proxy for Gradiant. The problem is category mismatch. Some market datasets focus on treatment products or equipment, while policy and company materials stretch naturally into reuse, PFAS remediation, digital optimization, and resource recovery. That is why a lens-based approach is more honest. The broad TAM is global industrial water treatment and reuse. The more decision-useful SAM is the subset of water-critical industrial sites where production, compliance, or expansion depends on better process-water, wastewater, and reuse outcomes. Public customer disclosures from semiconductors and hyperscalers confirm that those subsegments
    exist, but they do not publish bottom-up procurement budgets for water vendors, so any numeric SAM or SOM remains low-confidence. A cautious translation of the accessible evidence is a broad TAM band around $20B-$40B, a narrower Gradiant-core SAM band around $3B-$8B, and a near-term SOM lens below $1B annually. Those are working diligence ranges, not precise market-report facts, and they should be treated as scaffolding for underwriting rather than as valuation truth.
