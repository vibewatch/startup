- id: growth-drivers-and-adoption-constraints
  title: Growth Drivers, Adoption Constraints, and Diligence Gaps
  body: The strongest structural driver is water stress itself. WRI and UN-Water both frame water scarcity as a worsening global constraint shaped by climate pressure, rising demand, and infrastructure limits. For Gradiant, that structural problem becomes commercial demand when it intersects with water-intensive growth sectors. Semiconductor fabs, AI-linked data-center buildouts, PFAS treatment needs, reuse policy, and resource-recovery programs all increase the number of sites willing to buy higher-performance water systems. EPA’s WRAP 2.0 is especially relevant because it directly connects rising data-center and manufacturing demand with the need for reuse, while EPA PFAS rules create additional treatment urgency in certain applications. But adoption is not frictionless. The IEA water-energy nexus reminds investors that advanced treatment and reuse can carry meaningful energy and operating-cost implications. Industrial buyers also face long qualification cycles, capex approval gates, and
    trust hurdles because a water-system failure can shut down mission-critical operations. The biggest remaining diligence gaps are not about whether demand exists; they are about how much of that demand sits inside Gradiant’s true category, what buyers actually spend, and what share the company wins today. Those omissions are why the chapter remains persuasive but intentionally cautious.
