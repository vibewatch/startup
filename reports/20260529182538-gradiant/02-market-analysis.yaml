  name: Gradiant
chapter:
  number: 2
  title: Market Analysis
  summary: Gradiant operates in industrial and commercial water treatment, reuse, and discharge management, with the most attractive demand concentrated in water-critical verticals such as semiconductors, data centers, and regulation-led PFAS or reuse projects. The market is clearly large and structurally improving, but public estimates are definition-sensitive, so the most defensible approach is a lens-based TAM/SAM/SOM framework rather than false precision from one broad market-report number.
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary, Included Spend, and Substitutes
  body: 'Gradiant should be analyzed inside industrial and commercial water treatment, reuse, and discharge management rather than as a municipal utility-infrastructure vendor. The company’s own positioning is consistent on this point: it frames the mission as making industrial water usage sustainable and markets solutions across semiconductors, data centers, pharmaceuticals, mining, food, energy, and other process industries. USGS defines industrial water use broadly across fabrication, processing, washing, cooling, transport, product incorporation, and plant sanitation, which fits Gradiant’s workflow focus much better than a narrow membrane-equipment category. The market boundary should therefore include process-water treatment, wastewater treatment, reuse, discharge minimization, and selected resource-recovery programs at private industrial and commercial sites. It should exclude municipal pipe networks, residential filtration, and generic civic waterworks capex even though those categories
    are adjacent in some commercial databases. That distinction matters because the buyer logic and valuation logic are different: Gradiant sells to operators facing production, compliance, and expansion bottlenecks, not to rate-based public utilities alone. The main substitutes are incumbent EPCs, point-solution OEMs, internal utility teams, and incremental compliance upgrades that avoid an integrated reclaim-and-reuse platform.'
