tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / Category
  - Included Spend
  - Excluded Spend
  - Buyer / Payer
  - Relevance
  rows:
  - - Industrial process-water and wastewater treatment
    - Treatment trains, polishing, wastewater cleanup, discharge management, and plant-level optimization at private industrial sites
    - Municipal distribution networks, household filtration, and generic civic waterworks
    - Facilities, utilities, operations, and site-expansion budgets
    - Core Gradiant market because it matches the company’s industrial workflow and technology positioning
  - - Industrial water reuse and recovery
    - Reuse systems, recycle loops, ZLD/minimum-liquid-discharge programs, and selected resource-recovery projects
    - Generic sustainability consulting without water-system deployment
    - Utilities, EHS, operations, and sustainability co-sponsors
    - High relevance because Gradiant explicitly markets reclaim / renew outcomes and reuse technologies
  - - Semiconductor and advanced-manufacturing water systems
    - Ultrapure/process water, recycling, wastewater treatment, reliability upgrades, and expansion-enabling water infrastructure
    - Semiconductor tool capex unrelated to water systems
    - Fab facilities/utilities teams and plant leadership
    - Priority SAM lens because water quality and uptime are mission critical
  - - Data-center water systems
    - Cooling-water optimization, site-water stewardship, recycle/reuse projects, and water-sensitive campus design support
    - General server, networking, and power-electronics spend
    - Infrastructure, campus-development, and sustainability teams
    - Important adjacency and growth wedge because AI infrastructure is increasing water scrutiny at large campuses
  - - PFAS, reuse, and compliance-driven industrial projects
    - PFAS treatment, reuse upgrades, wastewater compliance, and water-security projects where regulation or scarcity forces action
    - Broad municipal drinking-water rate base unless Gradiant is the actual vendor
    - Environmental compliance and site-utilities owners
    - Relevant because regulation and scarcity can accelerate project timing even when buyers did not plan a broader water overhaul
  notes: Boundary is defined for Gradiant underwriting, not for sector taxonomy purity; excluded categories can be adjacent markets but are not the right primary denominator for this company.
