  title: Growth drivers and constraints table
  columns:
  - Driver / Constraint
  - Direction
  - Timing
  - Implication
  - Diligence Ask
  rows:
  - - Global water stress and scarcity
    - Positive
    - Multi-year
    - More industrial sites will treat secure water access as operating infrastructure rather than as a utility afterthought
    - Map target customers against Aqueduct and local water-stress exposure
  - - AI and data-center buildout
    - Positive
    - 2025-2030
    - Raises importance of water at new campuses and supports the Series E narrative around AI infrastructure
    - Request named data-center project pipeline and revenue conversion assumptions
  - - Semiconductor fab water intensity
    - Positive
    - 2025-2030
    - Supports high-value project demand where water quality and recycling affect uptime and output
    - Validate fab references, deployment scope, and repeat-program potential
  - - WRAP 2.0 and reuse policy support
    - Positive
    - Current
    - Keeps reuse adoption politically and institutionally supported, especially where manufacturing demand is rising
    - Check which reuse programs are already funded or mandated in target regions
  - - PFAS regulation
    - Positive
    - Current to near-term
    - Creates additional treatment urgency in selected sites and expands adjacent demand
    - Separate industrial PFAS opportunities from municipal compliance markets
  - - Water-energy nexus and treatment operating cost
    - Negative
    - Ongoing
    - Energy-intensive solutions can slow payback and require careful ROI framing
    - Ask for project-level energy intensity, opex, and payback benchmarks by use case
  - - Mission-critical qualification and trust requirements
    - Negative
    - Ongoing
    - Long sales cycles and reference dependence can slow adoption despite clear need
    - Review win-loss data, pilot-to-production conversion, and reference accounts by vertical
  - - Category ambiguity in market data
    - Negative
    - Current
    - Makes headline TAM numbers easy to overstate and hard to compare across reports
    - Maintain a lens-based sizing approach and avoid using one broad estimate as a valuation shortcut
  notes: Positive / negative describes net effect on adoption timing for Gradiant. Several rows are structural conditions rather than one-time events, so timing is intentionally broad.
