  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: Bottom-up SAM for semiconductor and data-center water budgets
    missingEvidence: Public customer disclosures do not break out vendor spend for process-water, recycling, cooling-water, or reuse programs by site or by company.
    whyItMatters: Without procurement-level budget data, the chapter can defend strategic importance but cannot convert the priority verticals into a tight bottom-up SAM.
    diligencePath: Request customer-level capital plans, procurement budgets, or vendor-spend benchmarks for fab utilities and hyperscale campus water systems.
    relatedQuestionRefs:
    - QM022
  - type: private-evidence-only
    severity: material
    topic: Gradiant market share and win-rate visibility
    missingEvidence: The public record does not disclose Gradiant’s category share, vertical-specific win rate, or named pipeline conversion by end market.
    whyItMatters: Any SOM claim stays low-confidence until investors know whether Gradiant is a niche winner, a broad platform leader, or a small participant in each vertical.
    diligencePath: Request booked-revenue mix, win-loss data, repeat-customer rates, and backlog by vertical to convert the market thesis into a share thesis.
    relatedQuestionRefs:
    - QM023
  - type: private-evidence-only
    severity: material
    topic: Buyer ROI, ACV, and payback benchmarks
    missingEvidence: Reviewed public sources do not disclose project ACV, payback periods, energy penalties, or other ROI benchmarks that buyers use to approve advanced treatment and reuse projects.
    whyItMatters: This prevents a rigorous view of sales-cycle length, economic defensibility, and which subsegments can adopt without subsidy or acute scarcity.
    diligencePath: Request project-level business cases, energy-intensity data, and post-install water / cost savings by use case.
    relatedQuestionRefs:
    - QM024
  - type: private-evidence-only
    severity: material
    topic: Gradiant revenue mix by recurring versus project-based offerings
    missingEvidence: The public record does not split revenue among projects, recurring services, chemicals, software, operations support, or aftermarket streams.
    whyItMatters: That mix matters because recurring revenue generally deserves a different multiple and implies a different market structure than one-time project delivery.
    diligencePath: Request segment revenue and gross-margin mix by offering type and by vertical.
    relatedQuestionRefs:
    - QM025
  - type: conflicting-data
    severity: minor
    topic: Industrial water TAM methodology mismatch
    missingEvidence: Market summaries, policy documents, and company materials do not use a shared denominator for treatment equipment, reuse services, PFAS remediation, and digital operations.
    whyItMatters: This is the central reason a lens-based sizing method is more honest than quoting one generic TAM as if it were directly monetizable by Gradiant.
    diligencePath: Preserve the category mismatch in future revisions unless a source with transparent scope definitions and subsegment breakout becomes available.
