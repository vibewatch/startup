callouts:
- calloutType: strength
  title: Semiconductor and AI infrastructure make water a strategic bottleneck, not a background utility cost
  body: The most credible part of the market thesis is the buyer reality in fabs and large data centers. Public TSMC, Intel, Google, and Microsoft materials all show that water availability, recycling, cooling, and stewardship now sit close to uptime and expansion planning.
  claimRefs:
  - CM016
  - CM017
  - CM018
  - CM019
  - CM023
  - CM040
- calloutType: risk
  title: The biggest market-modeling risk is category inflation
  body: Industrial water, reuse, PFAS, and wastewater treatment categories overlap but do not map neatly onto a single monetizable denominator for Gradiant. Investors should treat broad TAM figures as directional context and keep underwriting anchored on the narrower water-critical SAM.
  claimRefs:
  - CM012
  - CM013
  - CM014
  - CM036
  - CM038
  - CM043
- calloutType: insight
  title: Water reuse policy and scarcity together shorten the path from “nice to have” to funded project
  body: 'WRAP 2.0, PFAS pressure, and worsening scarcity all push the same direction: more sites have to invest in better treatment and reuse before water becomes a growth constraint or compliance event. That makes Gradiant’s reclaim-and-renew framing commercially relevant.'
  claimRefs:
  - CM008
  - CM009
  - CM022
  - CM031
  - CM032
  - CM033
- calloutType: assumption
  title: Numeric SAM and SOM remain working ranges until the company discloses segment economics or win rates
  body: The $3B-$8B SAM lens and the sub-$1B near-term SOM lens are intentionally low-confidence. They are useful for bounding the opportunity, but they should not be mistaken for audited category data or disclosed market share.
  claimRefs:
  - CM037
  - CM038
  - CM039
