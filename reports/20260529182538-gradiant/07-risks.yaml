'chapter':
  'number': 7
  'title': 'Risks'
  'summary': 'Gradiant’s risk surface is led by a real but non-operational governance shock around the 2025 Bajpayee scandal, followed by execution risk in mission-critical UPW, ZLD, and PFAS projects, dependency risk across lenders, partners, and semiconductor-heavy demand, and financial/model risk driven by private-company opacity. Public mitigants exist—repeat customer wins, acquisitions that add local engineering depth, a visible operations bench, Series E funding, and HSBC-backed liquidity—but the retained corpus still leaves board remediation, covenant headroom, customer concentration, cash conversion, and post-acquisition integration as thesis-critical diligence gaps.'
'sections':
- 'id': 'ranked-risk-posture'
  'title': 'Severity-ranked risk posture'
  'body': 'Gradiant’s risk profile is serious but not monolithic. The highest-severity visible issue is governance and reputational: multiple 2025 news reports said co-founder Anurag Bajpayee was arrested in the Boston brothel probe, and the retained corpus still does not show the case disposition or a fully articulated board-level remediation package. That risk should be treated as distinct from product or plant execution; the public record still supports real customer deployments and financing access. The second cluster is operational. Gradiant sells mission-critical water systems into semiconductors, PFAS remediation, and complex industrial sites where water failure can impair yield, compliance, or site uptime. The third cluster is dependency: lender liquidity, partner-led mining projects, and semiconductor-heavy demand all matter to delivery. The fourth is financial/model risk. Series E, the HSBC revolver, and a more-than-$500 million H1 2024 order announcement show momentum, but the
    company remains privately disclosed only in fragments, leaving collections, concentration, covenant, and margin questions unresolved.'
