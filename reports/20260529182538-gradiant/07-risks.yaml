- 'id': 'governance-legal-and-regulatory-risk'
  'title': 'Governance, legal, and regulatory risk'
  'body': 'Public evidence makes the Bajpayee episode a real governance and reputational risk, but not evidence of a product or operating failure. IndiaWest and The Week both reported that Bajpayee was arrested in the Boston brothel probe, while NewsBytes said Gradiant publicly stood by him and expected the matter to resolve favorably. The May 2026 Series E release shifted Bajpayee’s public title to Executive Chairman, but the retained corpus does not disclose final case status, any independent board review, or any durable governance remediation steps. Beyond governance, PFAS regulation materially raises both opportunity and risk. EPA’s drinking-water rulemaking and 2024 Federal Register final rule established enforceable PFAS standards, while EPA’s CERCLA and release-reporting materials make clear that PFOA and PFOS now carry cleanup and reporting consequences. ECHA’s broader PFAS work shows that regulatory creep is not only a U.S. issue. For Gradiant, that means ForeverGone and related
    offerings may benefit from demand tailwinds, but commercialization also depends on defensible performance claims, project economics, and customers that can navigate evolving cleanup and reporting regimes.'
