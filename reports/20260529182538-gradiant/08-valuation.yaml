- id: comparable-set-and-valuation-method
  title: Comparable set and valuation method
  body: |-
    Because Gradiant does not disclose enough public financial detail for a clean formula-driven
    valuation, the right method is triangulation. The closest public lenses are Xylem, Veolia,
    Pentair, and Ecolab, with the Xylem-Evoqua transaction as the most relevant strategic water
    M&A precedent. The set is intentionally imperfect. Veolia is too diversified and utility-like,
    so it sets more of a floor. Ecolab is a premium benchmark with much stronger recurring
    chemistry-and-service economics, so it is closer to a ceiling. Xylem and Pentair sit in the
    middle: both are public, industrial, water-exposed, and materially better disclosed than
    Gradiant, but neither is a direct match for Gradiant’s project-heavy semiconductor, PFAS, and
    industrial-water mix.

    The comp spread is still informative. Veolia trades around 1.1x EV/Sales, Xylem and Pentair
    around low-3x EV/Sales, Ecolab near 4.9x, and the Evoqua takeout implied a little above 4x
    revenue with a control premium and synergy case. That range supports a disciplined conclusion:
    Gradiant may deserve a premium to Veolia because its disclosed growth and technology intensity
    appear stronger, but it does not obviously deserve Ecolab’s premium without recurring-revenue
    visibility, audited margins, and mature disclosure. The valuation question is therefore not
    “Which exact multiple is right?” but “What range is justified once the undisclosed revenue,
    margin, and structure inputs are stress-tested?”
