- id: TV002
  title: Thesis / anti-thesis
  columns:
  - Category
  - Investment thesis
  - Anti-thesis
  - What changes the view
  rows:
  - - Market
    - Premium industrial water, semiconductors, PFAS, and reuse remain attractive end markets with high pain points
    - Attractive markets do not guarantee that private investors should pay a premium without revenue transparency
    - Upgrade if audited growth and backlog conversion prove Gradiant is capturing the opportunity at high quality
  - - Product
    - Gradiant appears differentiated in high-complexity water applications rather than commodity treatment alone
    - Complex project businesses can look like premium tech until warranty, utilization, and service economics are disclosed
    - Upgrade if service share, margin durability, and warranty performance are disclosed
  - - Customers
    - Blue-chip customer proof and repeat-order signals reduce customer-existence risk
    - Public logos do not reveal concentration, pricing power, payment terms, or renewability
    - Upgrade if concentration, DSO, and repeat-revenue data are clean
  - - Financials
    - Orders, profitability claims, and HSBC support suggest scale and lender confidence
    - No audited 2025 revenue, cash flow, or cap-table data means the headline mark may overstate real equity value
    - Upgrade if audited financials and term sheets validate the growth story
  - - Competition
    - Xylem/Evoqua precedent and public water-tech comps show strategic assets can command premium pricing
    - Ecolab-like premium multiples belong to businesses with recurring revenue and mature public disclosure, which Gradiant does not yet show
    - Upgrade if Gradiant’s disclosed economics begin to resemble premium recurring industrial-water peers
  - - Risks
    - Governance and execution risks are real but not yet proven to be operationally fatal
    - Governance, project slippage, or punitive round structure can quickly turn a quality company into an overpaid deal
    - Downgrade if governance remediation, concentration, or covenant headroom looks weaker than implied
  notes: The thesis is intentionally price-sensitive. The anti-thesis is not a rebuttal to product quality; it is a reminder that valuation discipline depends on disclosed economics and terms.
