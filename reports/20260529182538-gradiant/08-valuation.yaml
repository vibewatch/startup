- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Scale / financial profile
  - Valuation reference
  - Why relevant
  - Key limitation
  rows:
  - - Xylem
    - $9.0B 2025 revenue; 38.5% gross margin; 13.5% operating margin
    - ~3.0x EV/Sales; ~14.4x EV/EBITDA
    - Closest public water-tech platform with industrial exposure and disclosed margins
    - Far larger, public, and more diversified than Gradiant
  - - Veolia
    - €44.4B LTM revenue; organic EBITDA growth +6.3% in 2025
    - ~1.1x EV/Sales; ~7.3x EV/EBITDA
    - Useful lower-bound floor for a diversified environmental-services operator
    - Utility-like mix and leverage depress the multiple
  - - Pentair
    - $4.2B LTM revenue; ~16.0% profit margin
    - ~3.2x EV/Sales; ~12.4x EV/EBITDA
    - Relevant industrial-water and product-oriented public comp
    - Less project-heavy and more standardized than Gradiant
  - - Ecolab
    - $16.45B LTM revenue; 44.4% gross margin; 18.5% operating margin
    - ~4.9x EV/Sales; ~20.1x EV/EBITDA
    - Premium benchmark for high-quality industrial-water and service economics
    - Recurring service model and disclosure are much stronger than Gradiant’s public profile
  - - Evoqua takeout
    - $1.737B 2022 revenue; $297.7M adjusted EBITDA
    - ~4.3x revenue; ~25x adjusted EBITDA; $7.5B EV
    - Best strategic water-treatment M&A precedent in the retained set
    - Control premium and synergy case make it a ceiling, not a clean trading comp
  notes: Enumerates the retained comp set actually used in this chapter. Public multiples are current as of 2026-05-29; Veolia metrics are quoted in EUR and not FX-normalized against U.S. peers.
