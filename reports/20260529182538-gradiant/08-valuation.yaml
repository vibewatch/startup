company:
  name: Gradiant
chapter:
  number: 8
  title: Valuation
  summary: |-
    Gradiant’s latest disclosed price marker is the May 2026 Series E at a $2 billion valuation,
    double the 2023 Series D $1 billion mark. The company has credible quality signals behind that
    step-up—more than $500 million of first-half 2024 orders, a 2025 year-in-review claim of
    >50% revenue growth and 4x profitability expansion, lender support from HSBC, and strong
    customer proof in semiconductors and other mission-critical water markets. But public revenue,
    margin, cash-conversion, round-size, and cap-table data remain undisclosed, so valuation has
    to be triangulated from comparable ranges and scenario logic rather than a single-point model.
    The recommendation is Track: the business appears strategically strong, but the current price
    looks stretched without audited 2025 financials and clean round terms.
sections:
- id: investment-frame-and-pricing-context
  title: Investment frame and pricing context
  body: |-
    Gradiant’s private-market pricing story is easy to summarize and harder to underwrite. The
    company moved from a disclosed $1 billion Series D valuation in May 2023 to a disclosed $2
    billion Series E valuation in May 2026. That doubling is not happening in a vacuum. Public
    company materials and third-party coverage support real commercial progress: Gradiant said it
    booked more than $500 million of first-half 2024 orders, highlighted repeat semiconductor and
    blue-chip industrial customers, and later said 2025 revenue grew by more than 50% with 4x
    higher profitability. The October 2025 HSBC revolver also matters because lender support at
    single-digit rates is directionally better evidence of operating quality than a brand-only
    venture round.

    The problem is not that Gradiant lacks positive signals; it is that the signals are much more
    visible than the denominators behind them. The public record still does not disclose audited
    2025 revenue, margins, cash conversion, ARR or recurring mix, the size of the Series E round,
    or the cap-table and preference stack attached to the current mark. That means the investment
    thesis cannot be a generic “great company, buy the round” posture. It has to balance a strong
    market, real product and customer proof, and improving financing maturity against the reality
    that a $2 billion headline valuation may already capitalize much of the upside before investors
    can inspect the economics underneath it.
