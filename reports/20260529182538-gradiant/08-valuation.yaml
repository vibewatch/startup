tables:
- id: TV001
  title: Recommendation summary
  columns:
  - Dimension
  - Assessment
  - Evidence frame
  - Decision implication
  rows:
  - - Recommendation
    - Track
    - Strong market, product, and customer proof; insufficient public economics to buy the round at face value
    - Stay engaged, but require full diligence or better terms before committing capital
  - - Confidence
    - Medium
    - Public demand proof is real, but too much of the underwriting still relies on company-level claims instead of audited disclosures
    - Do not underwrite a narrow fair-value point estimate
  - - Risk rating
    - High
    - Governance, cap-table opacity, project execution, and hidden concentration or covenant risk can all impair downside
    - Require explicit downside protections and concentrated diligence
  - - Valuation stance
    - Stretched
    - At $2 billion, Gradiant already sits near the top of what public and precedent ranges comfortably support
    - Avoid paying a premium to the current mark without new evidence
  - - Entry discipline
    - Discount or structure required
    - Clean cap-table terms, information rights, and price discipline matter more than headline access
    - Only proceed if the deal includes transparency and downside protection
  - - Hold / exit frame
    - 4-6 year hold; strategic or later-stage exit more plausible than near-term IPO
    - Current disclosure quality does not yet support a quick IPO-style rerating assumption
    - Underwrite to milestone execution, not to a fast mark-up
  notes: Summary reflects public evidence as of 2026-05-29. Price sensitivity is driven mainly by undisclosed revenue, margins, and round terms rather than by market appetite alone.
