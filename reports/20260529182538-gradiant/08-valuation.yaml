  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: audited-2025-financials
    missingEvidence: Audited 2025 revenue, gross margin, EBITDA or operating income, cash conversion, and backlog-to-revenue bridge.
    whyItMatters: These figures determine whether the $2 billion mark is near a premium public-comp range or materially above it.
    diligencePath: Request the FY2025 audit package, monthly management accounts, and a 2024-2026 backlog conversion bridge from finance.
    relatedQuestionRefs:
    - QV018
    - QV020
    - QV021
    - QV024
    - QV029
  - type: private-evidence-only
    severity: blocking
    topic: cap-table-and-round-terms
    missingEvidence: Series E round size, pre/post share count, liquidation preferences, participation rights, anti-dilution terms, and pro-rata rights.
    whyItMatters: Entry economics can look acceptable or unattractive at the same headline valuation depending on structure and dilution.
    diligencePath: Obtain the latest cap table, signed term sheet, stock purchase agreement, and investor rights documents.
    relatedQuestionRefs:
    - QV001
    - QV019
    - QV024
    - QV030
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-and-concentration
    missingEvidence: Recurring service share, project share, top-10 customer concentration, DSO, backlog aging, and milestone-payment profile.
    whyItMatters: These items determine how much of Gradiant’s growth deserves Ecolab-like premium treatment versus project-business discounting.
    diligencePath: Request a revenue bridge by product and customer, aging schedules, concentration tables, and milestone payment terms for the top contracts.
    relatedQuestionRefs:
    - QV006
    - QV017
    - QV025
    - QV026
  - type: private-evidence-only
    severity: material
    topic: governance-remediation
    missingEvidence: Case disposition, board or committee review, delegated-authority map, and any reputational-risk remediation tied to the founder scandal.
    whyItMatters: Governance shocks can compress private-market pricing and limit exit optionality even if operating metrics hold up.
    diligencePath: Request counsel-confirmed case status, board minutes or committee memos, and current executive-authority materials.
    relatedQuestionRefs:
    - QV007
    - QV025
    - QV028
