- id: TV005
  title: Thesis-break and kill triggers
  columns:
  - Trigger
  - Threshold or proof point
  - Transmission to thesis
  - Action implication
  rows:
  - - Revenue scale disappoints
    - Audited 2025 revenue materially below the implied base-case range, especially < $250M
    - Current multiple stops looking premium-quality and starts looking overpaid
    - Move from Track to Avoid
  - - Margins or cash conversion disappoint
    - Low gross margin, weak EBITDA conversion, or persistent working-capital drag
    - Premium-multiple logic breaks because growth is not translating into quality earnings
    - Avoid or require steep discount
  - - Cap-table terms are punitive
    - Heavy liquidation stack, participating preferred, or unusually investor-favorable anti-dilution rights
    - Headline valuation overstates real common-equity economics
    - Do not invest on headline valuation alone
  - - Concentration or backlog aging is too high
    - A few accounts drive backlog or conversion is slower than implied
    - Customer-proof story becomes fragile and valuation should compress
    - Stay in diligence or avoid
  - - Governance overhang deepens
    - Case escalation or weak board remediation
    - Exit optionality and customer confidence can compress
    - Avoid until resolved
  - - Execution slips on flagship projects
    - Semiconductor, PFAS, or other complex projects miss schedule, guarantees, or collections
    - Growth narrative no longer supports a premium multiple
    - Re-price toward bear-case range
  notes: The trigger table is designed for investment-committee monitoring. Each row is a thesis gate rather than a generic company risk.
