  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: food-pharma-proof-depth
    missingEvidence: Named food and pharmaceutical accounts need site-level deployment scope, contract maturity, and quantified operating outcomes beyond the single GSK example.
    whyItMatters: Without deeper proof, Coca-Cola, AB InBev, Pfizer, and most pharma proof remain logos rather than underwriting-grade customer references.
    diligencePath: Request reference calls, site lists, and pre/post water-performance metrics for named food and pharmaceutical customers.
    relatedQuestionRefs:
    - QU014
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-cohorts
    missingEvidence: Portfolio NRR, GRR, churn, and renewal cohorts by vertical, geography, and customer vintage are not public.
    whyItMatters: Retention quality is central to customer durability and cross-sell value, and current public proof only supports proxy-level judgments.
    diligencePath: Request account-level renewal data, logo churn, and cohort tables for the past three years.
    relatedQuestionRefs:
    - QU015
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: contract-duration-and-repeat-sites
    missingEvidence: Public materials do not disclose contract term, backlog by account, or the number of sites per customer relationship.
    whyItMatters: Repeat-project signals are meaningful only if they convert into durable multi-year revenue and multi-site expansion.
    diligencePath: Request contract-tenure distributions, renewal schedules, site counts, and repeat-order rates for the top twenty accounts.
    relatedQuestionRefs:
    - QU017
    relatedTableRefs:
    - TU004
    - TU005
  - type: private-evidence-only
    severity: minor
    topic: customer-satisfaction-metrics
    missingEvidence: No public customer NPS, service-level, complaint-rate, or escalation metrics were found.
    whyItMatters: Service quality and referenceability influence renewal, cross-sell, and procurement win rates in mission-critical industrial accounts.
    diligencePath: Request customer NPS, complaint and incident logs, support SLAs, and referenceability by vertical.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof-coverage
    missingEvidence: The public named-customer sample is partial and excludes anonymous semiconductor deployments plus any private references.
    whyItMatters: A small curated sample can overstate proof quality if the unseen customer base is less durable or less referenceable.
    diligencePath: Request a complete referenceable-customer list with stage, geography, vertical, and whether each account permits disclosure.
    relatedQuestionRefs:
    - QU008
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-account revenue share, vertical mix, and direct-versus-partner-led revenue are not publicly disclosed.
    whyItMatters: Without concentration data, investors cannot judge whether growth is diversified or heavily reliant on a few blue-chip projects or channels.
    diligencePath: Request top-10 and top-20 accounts by revenue, revenue by vertical and geography, and partner-led revenue share.
    relatedQuestionRefs:
    - QU021
    - QU025
    relatedTableRefs:
    - TU005
