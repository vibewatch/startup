company:
  name: Gradiant
chapter:
  number: 6
  title: Customers
  summary: 'Public customer evidence shows Gradiant concentrated in water-intensive industrial verticals—especially semiconductors, pharmaceuticals, food and beverage, mining, and energy—with the strongest later-stage proof in semiconductor recycling, Formosa/Nan Ya wastewater reduction, Munich Airport PFAS treatment, and select mining projects. What remains unknown is equally important: Gradiant does not publish active customer count, NRR/GRR/churn, contract duration, or top-account concentration, so durability still rests on repeat-project and returning-customer proxies rather than on portfolio retention disclosure.'
sections:
- id: customer-base-by-vertical-and-geography
  title: Customer base by vertical, buyer, and geography
  body: Gradiant’s customer base is best segmented by vertical, use case, and geography rather than by a single headline customer count. The company sells into water-intensive industrial operators whose plants cannot afford water quality failures, compliance misses, or supply interruptions. Public industry pages cluster the base around semiconductors, food and beverage, pharmaceuticals, mining, refining and chemicals, and energy. The buyer and payer are usually the plant owner or operating company, while the day-to-day users are engineering, utility, water, and operations teams that have to keep the site running and compliant. Geography matters as well. Public customer proof spans Taiwan, Singapore, Germany, Italy, Western Australia, India, Munich, and the United States, which suggests Gradiant wins where water stress, discharge standards, and mission-critical production intersect. The strongest public concentration is in semiconductors, but the broader segmentation frame is still site-water
    complexity, not a published customer total.
