- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk / constraint
  - Impact
  - Diligence path
  rows:
  - - Site-wide land-and-expand across treatment, reuse, UPW, AI, and PFAS
    - Growth can deepen wallet share inside one customer, but project scope may still be episodic
    - Strong upside if one logo expands from one plant problem into a broader site program
    - Request revenue by first product sold, second product sold, and number of sites per expanded account
  - - Semiconductor repeat wins
    - Public repeat proof is heaviest in semiconductors and advanced manufacturing
    - Could make growth sensitive to fab capex cycles and regional semiconductor policy
    - Request semiconductor revenue share, top fabs by revenue, and backlog by region
  - - Blue-chip logo concentration in public proof
    - Named references are far smaller than the implied customer base and may be a curated sample
    - Reference quality can look stronger publicly than the underlying portfolio mix
    - Request full referenceable-customer list and top-20 account concentration
  - - Acquired installed bases via H+E and WaterPark
    - Local engineering access and legacy relationships help win work but add integration and organic-growth opacity
    - Customer expansion may depend partly on acquired channels rather than only on direct selling
    - Request direct versus acquired revenue, account ownership, and renewal performance of acquired books
  - - Partner-led mining motion via SLB and Rio Tinto
    - Mining proof depends on large partners and long project cycles
    - Partner dependence could compress margins or reduce visibility into end-customer economics
    - Request standalone mining win rate, partner-led revenue share, and project-payback assumptions
  - - Procurement and reputational friction
    - The CEO scandal could complicate reference selling or sensitive procurement even if no defections are public
    - Win rates or diligence cycles may slow without showing up immediately as churn
    - Request delayed-award, lost-RFP, and customer-escalation data after the 2025 event
  notes: Public evidence supports real expansion mechanisms, but not enough disclosure exists to quantify concentration, churn, or partner dependence with institutional confidence.
