- id: adoption-trajectory-and-deployment-maturity
  title: Adoption trajectory and deployment maturity
  body: 'Gradiant’s public adoption trajectory is visible through systems, project wins, and order book growth rather than through a disclosed account count. Independent coverage said the company had about 600 water-treatment facilities in 2023, and MIT News later described more than 2,500 end-to-end systems built for customers around the world. Official releases add cadence beneath those top-line figures: seven contracts in September 2022 across five verticals, four recycling projects and a 35-plus project pipeline in India in 2019, and more than $500 million of new orders in the first half of 2024. The most credible maturity signal is not simply logo volume but repeat work. Gradiant publicly points to a second major semiconductor project in Dresden, a second successful semiconductor UPW project in Italy in 2025, and returning customers adopting more of its solutions. Those facts support real customer adoption, but they still stop short of disclosing how many accounts are active, what share
    recur, or how much of the order book is repeat versus first-time business.'
