- id: named-customer-proof-and-reference-quality
  title: Named customer proof and reference quality
  body: 'Named customer proof exists, but it does not all have the same evidentiary weight. The strongest public outcomes come from later-stage deployments such as the Taiwan semiconductor reclaim project, the Singapore LSR case, the Formosa Plastics and Nan Ya wastewater-reduction award, and the Munich Airport ForeverGone installation. Those sources provide operating status, system size, recovery, or cost claims. Mining proof is meaningful but more partner-led: Rio Tinto and SLB are named in a 2023 mining announcement, yet the public record emphasizes technology fit more than completed financial outcomes. Blue-chip logo proof is broader than outcome proof. Independent coverage and Gradiant’s 2024 orders release name TSMC, Micron, Coca-Cola, Pfizer, GSK, and AB InBev, but those logos usually lack disclosed contract value, maturity, or renewal detail in the retained corpus. The right reading is therefore not that every logo is equal, but that Gradiant has a layered proof set: quantified production
    deployments at the top, active project and partner references in the middle, and softer logo-level validation beneath them.'
