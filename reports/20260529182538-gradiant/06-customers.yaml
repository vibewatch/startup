- id: expansion-loops-partner-dependence-and-concentration-risk
  title: Expansion loops, partner dependence, and concentration risk
  body: Expansion logic is visible even if concentration math is not. Gradiant is clearly trying to become the site-wide water partner by stacking wastewater treatment, reuse, UPW, SmartOps AI, PFAS destruction, and chemistry around one account. That creates real land-and-expand potential, especially in semiconductors and other plants with multiple water pain points. The risk is that public proof is concentrated in a narrow band of blue-chip industrial names and in project-heavy verticals that can be cyclical. Semiconductors dominate the repeat-proof set, so investors should assume some exposure to fab capex timing until vertical revenue mix is disclosed. There is also route-to-market dependence. The WaterPark and H+E acquisitions supplied local installed bases and engineering depth in Taiwan and Europe, while the mining proof set leans on partnerships with SLB and Rio Tinto. Those are not necessarily weaknesses, but they do mean Gradiant’s customer growth is not purely organic or purely
    software-like. Without top-account percentages, direct-versus-partner revenue mix, and contract-term data, customer concentration remains an evidence gap rather than a solved diligence question.
