- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Core use case
  - Geography / public proof
  - Strategic value / gap
  rows:
  - - Semiconductors & microelectronics
    - 'Buyer: fab utilities / ESG / engineering; User: water, utilities, O&M teams; Payer: fab owner / operator'
    - UPW, wastewater reclaim, reuse, compliance, yield protection
    - Taiwan, Singapore, Dresden, and Italy; WaterPark installed base includes TSMC and Micron references
    - Strongest public proof and repeat wins, but active-account count is undisclosed
  - - Pharmaceuticals
    - 'Buyer: manufacturing / utility / EHS leadership; User: water-quality and plant-ops teams; Payer: pharma manufacturer'
    - Pure / ultrapure water, wastewater minimization, antibiotic-waste handling
    - Pfizer and GSK named in independent coverage; India and Malaysia project references; GSK Singapore outcome cited by Forbes
    - Strategic fit is clear, but named outcome proof is thin outside one GSK plant example
  - - Food & beverage
    - 'Buyer: plant ops / procurement; User: utilities and wastewater teams; Payer: beverage or food producer'
    - Ingredient water, effluent reuse, by-product recovery, recycling efficiency
    - Coca-Cola and AB InBev named in independent coverage and 2024 orders; brewery project in Africa
    - Good logo proof, but little public site-level performance disclosure
  - - Mining & critical minerals
    - 'Buyer: processing / environment leadership; User: site water and metallurgy teams; Payer: miner or operator'
    - Process-water upgrade, wastewater reuse, lithium concentration, remote-site resilience
    - Rio Tinto and SLB named; projects in Western Australia and the United States
    - Named proof exists and strategic value is high, but public revenue contribution is unknown
  - - Refining, chemicals, and energy
    - 'Buyer: site engineering / utilities; User: operations teams; Payer: industrial operator'
    - Process water, produced-water reuse, ZLD / MLD, discharge compliance
    - Sector pages plus 2024 orders naming Petronas, ADNOC, and Nama Water
    - Evidence skews to projects and sectors rather than quantified named case studies
  - - Public infrastructure, remediation, and AI data centers
    - 'Buyer: airport authority, infrastructure owner, or hyperscaler utilities team; User: site water operators; Payer: asset owner'
    - PFAS destruction, airport remediation, and site-wide water systems
    - Munich Airport deployment and 2025 year-in-review mentions of new data-center contracts
    - Fresh wedge with strong strategic narrative, but repeat economics are still early
  notes: Segmentation is built from public industry pages, case studies, order-book disclosures, and independent reporting. Gradiant does not publish customer mix by revenue band, account size, or active customer count.
