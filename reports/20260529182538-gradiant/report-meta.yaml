companyProfile:
  summary: Gradiant is a private industrial water technology company founded at MIT in 2013 by Anurag Bajpayee and Prakash Govindan. The company designs and operates advanced water, wastewater, reuse, zero-liquid-discharge, PFAS, and digital optimization systems for water-intensive industrial customers. Its strongest public growth narrative is concentrated in semiconductors, AI data centers, pharmaceuticals, food and beverage, mining, and energy. Public evidence confirms a financing step-up from a 2023 $1B valuation to a May 2026 Series E at a $2B valuation, but the business remains financially opaque despite company-claimed 2025 profitability and 50%+ growth.
  foundedDate: '2013-01-01'
  founders:
    - name: Anurag Bajpayee
      role: Co-founder; public materials variously call him CEO and Executive Chairman
      background: MIT-trained water engineer whose research underpins Gradiant's desalination and reuse thesis.
      claimRefs: [CO001, CO007]
    - name: Prakash Govindan
      role: Co-founder and COO
      background: Technical and operating co-founder tied to Gradiant's commercial buildout and delivery scale.
      claimRefs: [CO001, CO008]
  foundingLocation: Cambridge / Boston, Massachusetts
  headquarters: Boston / Woburn, Massachusetts
  productSummary: End-to-end industrial water and wastewater treatment systems including reuse, resource recovery, brine concentration, PFAS treatment, zero-liquid-discharge, and SmartOps AI-enabled plant optimization.
  customerFocus: Semiconductor fabs, AI data centers, pharmaceuticals, food and beverage, mining and critical minerals, petrochemicals, and other mission-critical industrial operators.
  businessModel: Project-led B2B model spanning engineered treatment systems, ongoing plant operations, digital optimization, and adjacent chemicals or resource-recovery economics where applicable.
  stage: Series E
  fundingStatus: May 2026 Series E at a $2B valuation after a $225M Series D in 2023 and a $50M HSBC corporate revolver in 2025; exact Series E round size not publicly disclosed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO005, CO021]
summary:
