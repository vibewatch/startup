      - number: '6.5'
        title: 扩张循环、伙伴依赖与集中度风险
        blocks:
          - type: paragraph
            body: >-
              即使缺少集中度数字，扩张逻辑仍然可见。Gradiant 显然想把废水处理、回用、UPW、SmartOps AI、PFAS 销毁和化学品堆到同一个账户周围，成为站点级水务伙伴。这带来真实的落地后扩张
              潜力，尤其是在半导体和其他有多重水问题的工厂。风险在于，公开证明集中在一小批蓝筹工业客户，以及项目属性强、可能周期性波动的垂直行业。半导体主导了重复证明集，所以在披露垂直收入结构之前，投资者应假设公司暴露于晶圆厂
              资本开支节奏。市场进入路径也有依赖。WaterPark 和 H+E 收购带来了台湾和欧洲的本地装机基础和工程深度；采矿证明集则依靠与 SLB、Rio Tinto 的合作。这些不一定是弱点，但意味着
              Gradiant 的客户增长不是纯有机，也不像纯软件。没有头部账户占比、直销与伙伴收入结构、合同期限数据，客户集中度仍是证据缺口，而不是已经解决的尽调问题。
