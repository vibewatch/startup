        title: 财务 / 模型风险、缓释因素与论证破裂触发器
        blocks:
          - type: paragraph
            body: >-
              财务 / 模型风险偏高，主要因为公开动能信号强于公开单位经济。$2B 估值的 Series E、带有盈利色彩的 HSBC 公告、H1 2024 超过 $500M
              订单，都指向真实商业牵引。但这些都不能替代经审计收入质量、毛利率耐久性、回款、契约余量、在手订单
              转化或客户集中度披露。项目型业务里，这些隐藏变量很关键。订单可能延后，里程碑付款到账前营运资金可能先吞掉现金，集中度也可能藏在蓝筹 logo
              列表里。需求集中度同样看起来真实：公开语料反复围绕半导体、先进制造、AI 基础设施和一小组大型工业客户。这不自动构成负面，但意味着承销判断取决于 Gradiant
              能否持续赢得复杂项目，同时不拉伸资产负债表，也不过度依赖狭窄行业和交易对手。正确投资框架应是有条件的：承认真实缓释因素，但把董事会补救、头部账户组合、DSO、契约条款、质保索赔和收购后执行指标设为明确论证闸门，而不是默认强项。
