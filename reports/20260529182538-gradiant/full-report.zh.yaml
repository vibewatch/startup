      - number: '8.2'
        title: 可比公司组与估值方法
        blocks:
          - type: paragraph
            body: >-
              因为 Gradiant 没有披露足够公开财务细节，无法做干净的公式化估值，正确方法是三角定位。最接近的公开视角是 Xylem、Veolia、Pentair 和 Ecolab，Xylem-Evoqua
              交易是最相关的战略水务 M&A 先例。这个组合有意保持不完美。Veolia 太多元、太像公用事业，因此更像下限。Ecolab 是高溢价基准，经常性化学品和服务经济性强得多，因此更接近上限。Xylem 和
              Pentair 位于中间：两者都是上市、工业、水务敞口公司，披露显著优于 Gradiant，但都不是 Gradiant 项目属性重、覆盖半导体、PFAS 和工业水组合的直接可比。


              可比公司区间仍有信息量。Veolia 交易约 1.1x EV/Sales，Xylem 和 Pentair 约低 3x EV/Sales，Ecolab 接近 4.9x，Evoqua 收购隐含收入倍数略高于
              4x，并包含控制权溢价和协同逻辑。该区间支持一个有纪律的结论：Gradiant 可能应相对 Veolia
              享有溢价，因为披露的增长和技术强度看起来更强；但在经常性收入可见度、经审计利润率和成熟披露缺失时，它并不明显配得上 Ecolab
              的溢价。因此，估值问题不是“哪个精确倍数正确？”，而是“在未披露的收入、利润率和结构输入接受压力测试后，什么区间才站得住？”
