        - 不承销狭窄的公允价值点估计
      - - 风险评级
        - 高
        - 治理、股权结构表不透明、项目执行，以及隐藏集中度或契约风险都可能损害下行
        - 要求明确下行保护并聚焦尽调
      - - 估值立场
        - 偏高
        - 以 $2 billion 估值看，Gradiant 已接近公开公司和先例区间能稳妥支撑的顶部
        - 没有新证据，不要对当前估值加价
      - - 入场纪律
        - 需要折价或结构保护
        - 清晰股权结构表条款、信息权和价格纪律，比抢到份额更重要
        - 只有交易包含透明度和下行保护时才推进
