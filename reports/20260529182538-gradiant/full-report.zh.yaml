  - id: TI004
    title: 资本充足性表
    columns:
      - 项目
      - 公开证据
      - 含义
      - 风险 / 质量判断
      - 尽调要求
    rows:
      - - Series C 轮（2021）
        - 融资超过 $100M；用途包括项目级融资和灵活交付模式
        - 后续轮次前，资本支持已是 GTM 模式的一部分
        - 战略资本有帮助，但它指向项目强度，而非纯软件效率
        - 提供融资项目的已实现回报
      - - Series D 轮（2023）
        - $225M，估值 $1B；资金用于扩张和 R&D
        - 初步规模化之后很久，公司仍需要增长资本
        - 能支撑扩张，但不能回答当前流动性
        - 说明 Series D 轮还剩多少、已投放多少
      - - HSBC 循环贷款（2025）
        - $50M 企业循环贷款，用于美国营运资金和项目执行
        - 证实短期流动性需求与项目交付绑定
        - 这是营运资金真实存在且运营上重要的最直接证据
        - 提供借款基数机制和当前使用率
      - - 总信贷额度
        - 公司称总信贷额度超过 $100M
        - 暗示已有多项授信和更成熟的财资体系
        - 有利于执行灵活性，但财务契约余量未知
        - 提供完整债务明细和未提取额度
      - - Series E 轮（2026）
        - $2B 估值；资金用于收购、R&D、运营规模化和 IPO 准备
        - 即便公司声称已盈利，增长议程仍吃资本
        - 估值已公开，实际融资金额未公开
        - 提供交割备忘录、融资金额和稀释情况
      - - 应收账款支持
        - Year in Review 称，HSBC 授信由蓝筹客户应收账款支持
        - 客户质量可能有助于获得融资
        - 也意味着现金被应收账款和里程碑回款占用
        - 提供 DSO、留存和客户集中度
      - - 现金 / 消耗 / 跑道
        - 未公开披露
        - 公开信息无法清楚判断资产负债表是否充足
        - 资本充足性上最大的剩余障碍
        - 提供月度现金桥表和 12 至 18 个月流动性计划
    notes: 历史轮次时间线只在资本分析需要时纳入；本章避免复用概览章节的 claim ids，重点看未来充足性。
