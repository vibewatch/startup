  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险图谱
        blocks:
          - type: paragraph
            body: >-
              Gradiant 的风险画像严肃，但并非单一。可见问题中最严重的是治理和声誉：多篇 2025 年新闻报道称联合创始人 Anurag Bajpayee
              在波士顿妓院调查中被捕，保留资料仍未显示案件结果或完整的董事会层面补救方案。该风险应与产品或工厂执行分开看；公开记录仍支持真实客户部署和融资可得性。第二组是运营风险。Gradiant 向半导体、PFAS
              修复和复杂工业现场销售任务关键型 水系统，水故障可能影响良率、合规或站点正常运行时间。第三组是依赖风险：贷方流动性、伙伴主导的采矿项目、半导体偏重的需求都会影响交付。第四组是财务 / 模型风险。Series
              E、HSBC 循环贷款和 H1 2024 超过 $500M 订单公告显示动能，但公司作为私营公司只零散披露信息，回款、集中度、契约条款和利润率问题仍未解决。
