      - number: '1.4'
        title: 规模、布局与商业势头
        blocks:
          - type: paragraph
            body: >-
              到 2025-2026 年，Gradiant 似乎已经达到有意义的全球规模，尽管具体运营版图在公开数据中仍有噪音。官方和第三方来源都指向 Boston/Woburn 总部和全球分布式组织，但员工数口径从
              ContactOut 的 501-1,000 人，到公司 2022 年新闻稿的超过 1,300 人，再到 ZoomInfo 的 1K-5K 人不等。Craft 列出八个办公室地点，包括 Woburn
              以及多个美国、印度、中国和 Singapore 地址，与管理层反复强调的跨区域运营模式方向一致。2025 年回顾文章是最强的公开运营披露：Gradiant 称收入较 2024 年增长超过 50%，新订单超过
              $500M，盈利能力提升四倍，区域收入在美国、欧洲、中东和印度洋-太平洋之间分散。同一篇回顾和 2026 年 Series E 公告都指向半导体、数据中心、PFAS
              修复、锂回收和其他工业应用中的强需求，说明公司已不再依赖单一终端市场。
