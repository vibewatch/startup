      - number: '2.2'
        title: 规模测算视角、相互矛盾的估计与可辩护区间
        blocks:
          - type: paragraph
            body: >-
              这个市场足够大，值得关注；更难的尽调任务不是引用最大的 TAM，而是选对视角。可访问的 Grand View
              摘要把工业水处理描述为一个数百亿美元规模、高个位数增长的市场，这在方向上有帮助，但不够精确，不能直接拿来作为 Gradiant
              收入代理。问题在于类别错配。有些市场数据集聚焦处理产品或设备，而政策和公司材料自然延伸到水回用、PFAS 修复、数字优化和资源回收。因此，用多视角比拼一个数字更诚实。广义 TAM
              是全球工业水处理和水回用。更适合决策的 SAM
              是那些水对生产、合规或扩张至关重要，且依赖更好工艺水、废水和回用结果的工业站点子集。半导体和超大规模云厂商的公开客户披露确认这些子细分存在，但它们不公布给水供应商的自下而上采购预算，所以任何数字化 SAM 或
              SOM 都仍然低置信度。谨慎解读可访问证据后，广义 TAM 可放在约 $20B-$40B 区间，更窄的 Gradiant 核心 SAM 放在约 $3B-$8B，近期 SOM 视角低于每年
              $1B。这些是工作中的尽调区间，不是精确的市场报告事实；它们应作为承销脚手架，而不是估值真相。
