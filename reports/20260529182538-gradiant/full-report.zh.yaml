  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 对投资判断的影响
      - 现有公开证据
      - 具体尽调路径
    rows:
      - - 审计收入
        - 无法确定业务规模，也无法校准估值倍数
        - 公开信息只有公司声称的增长率和订单动能
        - 要求提供 FY2024 和 FY2025 审计收入，并按地区和收入流拆分
      - - 按收入流划分的毛利率
        - 无法检验数字化或化学品附加是否实质改善收入组合质量
        - 价值主张已公开，实际毛利率未公开
        - 要求提供 EPC、O&M、SmartOps、化学品和回收业务的毛利率桥表
      - - EBITDA / 经营现金流
        - 盈利能力声明无法转化为实际盈利质量
        - 公司称盈利能力改善，但没有公开 EBITDA 数字
        - 要求提供季度 EBITDA、EBIT 和现金转化报表
      - - 现金余额和跑道
        - 无法判断短期融资依赖或再融资风险
        - HSBC 授信证明公司有流动性工具，不证明资产负债表充足
        - 要求提供现金头寸、债务提款、财务契约余量和 13 周现金预测
      - - ARR / NRR / CAC / 回本期
        - 无法量化 SmartOps 和服务是否实质改变收入质量
        - 一个案例证实 SaaS 包装形态，但没有公开经常性指标
        - 要求提供经常性收入看板和分群留存模型
      - - 客户集中度和 DSO
        - 回款风险和议价能力仍未知
        - 应收账款支持的借款说明 AR 很重要，但客户集中度未披露
        - 要求提供头部客户收入占比、AR 账龄和坏账历史
      - - 项目亏损历史 / 保证
        - 无法框定执行下行风险
        - 公开可比公司披露这些风险；Gradiant 没有披露
        - 要求提供项目复盘、储备政策和保证索赔历史
      - - Series E 轮确切金额和稀释
        - 无法判断最新一轮之后的资本充足性规模
        - 估值和资金用途已公开；融资金额未公开
        - 要求提供投资条款清单、股权结构表和交割备忘录
    notes: 每一行都有意写成证据缺口，而非填充指标；这些具体缺失输入仍卡住投资判断。
