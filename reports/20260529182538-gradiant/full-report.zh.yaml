      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              Gradiant 的买方地图更适合看成一组高价值垂直行业，而不是一个统一的水处理客户群。半导体晶圆厂是最清晰的水关键型细分，因为水质、回收和可靠性会影响良率和正常运行时间；TSMC 和 Intel
              的公开披露都把这种战略姿态讲得很明确。超大规模云厂商和数据中心开发商构成第二个重要细分。Google 和 Microsoft 披露水资源管理和水正效承诺，Microsoft
              现在还把芯片直冷与设施层面的重大节水联系起来。这些披露不揭示采购预算，但确认水决策已和基础设施及可持续性规划并排。其他工业细分——制药、食品、采矿、PFAS 修复和资源回收——遵循同样逻辑：当公用工程、EHS
              或场址运营团队意识到现有水系统限制合规或增长时，买方就会浮现。实际付款方很少是泛化的“水部门”。预算通常在设施、公用工程、运营或扩张资本开支负责人手里，采购团队后续叠加。这也解释了为什么 Gradiant
              的客户证据重要：蓝筹名称和水回用结果能帮助它跨过信任门槛，因为这些项目的买方无法承受部署失败。
