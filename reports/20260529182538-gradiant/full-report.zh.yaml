          detail: 首个站点上线，配套操作员培训、优化和合规监测。
        - id: optimize
          label: 优化 / 支持
          detail: SmartOps、药剂和工艺支持提升回收率、正常运行时间或成本结果。
        - id: expand
          label: 重复 / 扩展
          detail: 客户增加相邻范围、另一座晶圆厂，或更广的全站水务项目。
      edges:
        - from: pain-point
          to: validate
          label: 必须证明关键水痛点可解决
        - from: validate
          to: award
          label: 站点水化学和经济性可信后，客户才会承诺
        - from: award
          to: commission
          label: 项目交付把参考案例变成运行站点
        - from: commission
          to: optimize
          label: 结果证明和运营支持加深信任
        - from: optimize
          to: expand
          label: 重复范围来自新用例、新站点或新技术
    claimRefs:
      - CU013
      - CU014
      - CU017
      - CU018
      - CU019
      - CU020
      - CU039
      - CU042
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 公开客户记录在 Gradiant 披露实时部署和量化结果处最强；蓝筹 logo 证明更广，但实质上更软。
    data:
      columns:
        - 生产成熟度
        - 结果具体度
        - 证据新鲜度
        - 重复信号可见度
      rows:
        - label: TSMC
          values:
            - 中：通过 WaterPark 和独立报道体现装机基础 / logo 引用
            - 低：保留语料中没有公开站点 KPI
            - 中：独立报道和装机基础引用仍有效
            - 低：未披露后续指标
        - label: Micron
          values:
            - 中：出现在装机基础和 2024 年订单中
            - 低：保留语料中没有站点 KPI
            - 高：出现在 2024 年订单和较早独立报道中
            - 低：没有公开重复订单细节
        - label: Coca-Cola
          values:
            - 中低：logo 和订单簿证明
            - 低：保留语料中没有公开站点 KPI
            - 高：2024 年独立资料和官方材料仍提及
            - 低：无范围或续约细节
        - label: Pfizer / GSK
          values:
            - 混合：GSK 是较后期案例，Pfizer 停留在 logo 级别
            - 中：Forbes 提到 GSK 约 5 吨 / 天废弃物提取，Pfizer 无对应数据
            - 中：证明主要依赖较早独立报道
            - 低：未披露合同期限
        - label: Rio Tinto / SLB
          values:
            - 中：具名项目和合作伙伴关系，但仍以项目为主导
            - 中：描述了技术适配和设施范围，经济性较薄
            - 中：公开证明锚定 2023-2024 年来源
            - 中低：伙伴 / 项目延续未量化
        - label: Formosa / Nan Ya
          values:
            - 高：获奖运营设施
            - 高：废水下降 81%，废弃物下降 82%
            - 高：近期官方认可，附带有日期的前后数据
            - 中：暗示长期运营历史，但未披露商业扩张
        - label: Munich Airport
          values:
            - 高：已调试的现场部署
            - 高：披露 99–99.9% PFAS 去除率和成本区间
            - 高：2025 年部署
            - 中低：太新，尚无续约历史
    claimRefs:
