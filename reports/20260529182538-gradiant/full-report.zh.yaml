      - number: '1.3'
        title: 融资历程、资本形成与投资人基础
        blocks:
          - type: paragraph
            body: >-
              Gradiant 的资本历程显示，公司正从风投支持的清洁技术创业公司，升级为一个更成熟的项目执行平台，同时获得股权和贷款方支持。2021 年 11 月，公司宣布完成超募 Series C，融资超过 $100M，由
              Warburg Pincus 和 Schlumberger New Energy 领投，使成立以来累计融资超过 $200M。2023 年 5 月，公司完成 Series D 首次交割，融资 $225M，由
              BoltRock Holdings 和 Centaurus Capital 领投，累计融资超过 $400M，并确立了公司首个公开 $1B 估值。2025 年 10 月，Gradiant 与 HSBC 完成
              $50M 企业循环信贷，并称总信贷额度已超过 $100M，明确把这项安排包装为盈利能力和贷款方信心的证据。下一次重大跃迁出现在 2026 年 5 月，Gradiant 宣布以 $2B 估值完成 Series
              E，由 Safar Partners 和 Hostplus Superannuation Fund 领投，ClearVision Ventures 参投。所审阅公开材料确认了估值和本轮融资的战略目的，但未披露
              Series E 金额；这一缺口仍是当前尽调问题。
