      - CU034
      - CU035
      - CU046
  - id: FU004
    title: 留存 / 重复队列代理
    type: cohort
    layout: standard
    summary: 由于 Gradiant 不发布真实留存队列，本图用代理区间展示：从量化部署到仅 logo 引用，证明质量走弱时，公开可见的延续性如何下降。
    approximationNotes: 这些百分比是公开证据支持的延续性代理区间，不是实际 NRR、GRR 或 logo 留存。它们有意保守，来自保留公开证明集中重复项目或持续关系信号的质量。
    data:
