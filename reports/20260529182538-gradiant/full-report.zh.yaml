      - number: '3.3'
        title: 定价、切换成本与替代路径
        blocks:
          - type: paragraph
            body: >-
              公开定价是竞争记录中最弱的一块。主要全系统玩家没有任何一家披露足够的标价细节，无法支撑假精确对比；因此最诚实的打包视角应是合约式，而不是数字式。Veolia、Xylem、IDE、Jacobs、AECOM 和
              Gradiant 似乎都销售工程化系统、设备、调试和运营支持的组合，经济性由站点复杂度塑造，而不是由公开目录决定。问题在于替代路径可能显得便宜得具有迷惑性。买方可以继续在许可下排放，通过 EPC
              增加传统设备，或避开更深入的水回用和 ZLD 重设计。但一旦工厂完成许可和调试，切换成本会迅速上升，因为许可、操作员诀窍、备件和生产资格认证都会沉没。因此，对 Gradiant 来说，最难的销售任务往往不是打败
              Aquaporin 或 Trevi，而是一开始就说服买方离开可信任的既有厂商或熟悉的工程路径。
