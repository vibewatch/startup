      - number: '5.2'
        title: 按任务拆解的模块组合
        blocks:
          - type: paragraph
            body: >-
              公开模块集合很宽，但映射到客户任务后仍然连贯。RO Infinity 是偏膜的平台，服务海水淡化、卤水浓缩、卤水采矿，以及通向 MLD 或 ZLD 系统的高回收率前端。Bio Infinity
              覆盖高效生物处理，用于去除营养物和可生物降解有机物，尤其适合工业废水流量波动且排放限值严格的场景。Selective Contaminant Extraction
              处理特定化合物和离子的定向物理、化学去除或回收；Carrier Gas Extraction 和 Free Radical Oxidation 则把平台延伸到热浓缩和高级氧化，面向最难处理的高盐或高 COD
              水流。SmartOps AI 位于物理工厂之上，是数字运营层；较新的品牌化产品——面向 PFAS 的 ForeverGone 和面向电池级锂的
              alkaLi——把多个单元操作打包成价值更高的应用型解决方案。公开证据显示，这些模块不是随机菜单。废水、工艺水、锂和超纯水页面反复指向同一组底层技术族，意味着 Gradiant
              在多个行业复用一套核心工具箱。这种复用具有战略意义，因为公司可以面向多种水结果销售——源水制备、工艺水精处理、废水处理、水回用、资源回收和排放最小化——而不必为每个垂直行业搭建一套完全不同架构。待解问题不是模块是否存在，而是这套跨模块实施方法在少数营销页面和案例研究之外，有多可重复、多少案例可引用。
