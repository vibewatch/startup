      - number: '4.4'
        title: 承销缺口与财务结论
        blocks:
          - type: paragraph
            body: >-
              做承销时，证据能支撑四个结论。第一，Gradiant 似乎拥有真实商业势头和可信的盈利信号，但这些信号仍是公司口径，而非经审计数据。第二，收入质量很可能是混合型：项目驱动，因此有波动；O&M、SmartOps
              和化学品带来一个可信但仍未量化的经常性尾部。第三，资本强度是真实存在的。监管许可、履约保证、长部署周期和应收账款支持的借款，都把模型推向工业项目金融，而不是轻资产软件。第四，尽调阻塞点仍然重大。没有经审计收入、毛利率、EBITDA、现金、烧钱速度、ARR
              或经常性收入占比、客户集中度和 Series E
              确切募资额，投资人可以承销方向和战略契合度，但无法建立清晰的下行情景。下一步需要管理层数据室，把积压订单、转化、营运资本和分收入流利润率串起来，而不是继续给更多增长叙事。管理层还应在同一个材料包中对齐积压订单质量、回款节奏和保证责任敞口。
