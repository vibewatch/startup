      - number: '8.4'
        title: 决策纪律、论证破裂点与下一步尽调
        blocks:
          - type: paragraph
            body: >-
              最终推荐应有纪律，而不是二元判断。Gradiant
              在高端工业水务中似乎具备强市场位置、差异化产品广度、真实蓝筹客户和越来越可信的融资支持。这些不是弱业务意义上的“Track”信号；它们是可投资业务意义上的“Track”信号，只是当前公开定价支撑比运营叙事更薄。没有经审计
              2025 年财务和投资条款清晰度，投资者可能为一项公开披露仍更像后期私营项目型业务的资产，支付接近 Ecolab 或战略先例的价格。


              投资论证破裂触发器很实际。如果收入质量、现金转化、集中度、契约余量或治理补救显著弱于暗示水平，结论应从 Track 下调到 Avoid。升级路径同样清楚：披露经审计 2025
              年收入和利润率，展示普通优先股保护，证明在手订单转化和集中度健康，并解决治理悬而未决问题，或证明它已经明确不影响运营。在此之前，公司值得继续接触和尽调，但不值得按当前头条估值开空白支票。
