      - number: '1.6'
        title: 展项
        blocks:
          - type: callout
            title: 差异化水技术栈叠加盈利增长，是罕见组合
            body: >-
              本章最强证据并不只是 Gradiant 融了很多钱，而是公司把宽广的自研技术组合、公开声称的盈利能力和有意义的商业势头放在了一起。到 2025 年末，公司报告收入增长超过 50%、盈利能力提升 4x、新订单超过
              $500M；2026 年 Series E 新闻稿则把 Gradiant 定位为 AI、半导体和其他任务关键型工业系统的水基础设施伙伴。技术、资本通道和运营表现能同时出现，在工业水领域很少见。
            calloutType: strength
            claimRefs:
              - CO005
              - CO018
              - CO019
              - CO021
          - type: callout
            title: 治理不透明是近期尽调的核心担忧
            body: >-
              以公司体量来看，公开治理披露偏薄。2026 年 5 月融资新闻稿称 Anurag Bajpayee 为执行董事长，而其他 2025 年来源仍称其为 CEO。董事会只披露了一部分，公开记录中最重要的反向事件是
              Bajpayee 2025 年卷入 Boston 妓院调查被捕。即便法律事项不直接损害运营，它也提出关键人、接班和声誉风险问题；投资人需要先得到答案，才能把公司视为已具备 IPO 准备度。
            calloutType: risk
            claimRefs:
              - CO007
              - CO011
              - CO034
              - CO035
          - type: callout
            title: AI 和半导体增长正把水从公用事业成本推成战略瓶颈
            body: >-
              Gradiant 的叙事可信，因为它贴合目标终端市场的物理现实。半导体晶圆厂、超大规模数据中心、制药工厂和矿物加工站点离不开高度可靠的取水、处理、回用和排放管理。公司的 2026 年融资叙事、2025
              年年度回顾和技术页面都指向同一模式：客户购买水基础设施，不是为了增加合规附属项，而是为了支撑持续运行、扩产和可持续性。
            calloutType: insight
            claimRefs:
              - CO004
              - CO017
              - CO028
              - CO029
          - type: callout
            title: 公开指标仍留下重要承销缺口
            body: >-
              公开记录足以证明 Gradiant 真实、规模不小且正在增长，但不足以承销收入质量或治理精确度。所审阅来源未披露 2026 年 Series E
              金额，员工数信号相互冲突，缺少客户集中度数据，也没有公开股权结构表或经审计财务报表。这些缺口不否定公司优势，但投资人不应因此对任何估值驱动的投资结论过度自信。
