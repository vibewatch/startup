      - - Veolia
        - €44.4B LTM 收入；2025 年有机 EBITDA 增长 +6.3%
        - 约 1.1x EV/Sales；约 7.3x EV/EBITDA
        - 可作为多元化环境服务运营商的下限参照
        - 类公用事业业务组合和杠杆压低了倍数
      - - Pentair
        - $4.2B LTM 收入；约 16.0% 利润率
        - 约 3.2x EV/Sales；约 12.4x EV/EBITDA
        - 相关的工业水处理、产品导向上市可比公司
        - 项目属性低于 Gradiant，标准化程度更高
      - - Ecolab
        - $16.45B LTM 收入；44.4% 毛利率；18.5% 经营利润率
        - 约 4.9x EV/Sales；约 20.1x EV/EBITDA
        - 高质量工业水处理和服务经济性的高端基准
        - 经常性服务模式和披露质量都明显强于 Gradiant 的公开画像
      - - Evoqua 收购案
        - $1.737B 2022 年收入；$297.7M 调整后 EBITDA
        - 约 4.3x 收入；约 25x 调整后 EBITDA；$7.5B EV
        - 保留样本中最佳战略性水处理并购先例
        - 控制权溢价和协同逻辑把它推成上限，而不是干净的交易可比
    notes: 列出本章实际采用的保留可比样本。公开市场倍数截至 2026-05-29； Veolia 指标以 EUR 报价，未相对美国同业做汇率标准化。
