  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块 / 资产
      - 主要工作流阶段
      - 主要用户
      - 状态 / 成熟度
      - 差异化
      - 尽调缺口
    rows:
      - - RO Infinity（CFRO + RO）
        - 浓盐水浓缩、淡化、回用、ZLD 前端
        - 工业工厂、淡化项目、锂场地
        - 已商业化推广的核心平台
        - 最高 99% 回收率，产出盐饱和浓盐水；采用商业膜的模块化组件
        - 没有公开披露按装机基础统计的全装机群污染、清洗或可用率数据
      - - 产品线：Bio Infinity（BioConvert、BioCapture、Ultrawaves）
        - 二级 / 三级废水处理
        - 工业废水运营方
        - 已商业化推广；公司声称覆盖 200+ 个制造场地
        - 高负荷生物处理，叠加甲烷回收和更低生命周期成本主张
        - 装机基础主张未按子模块、客户或参考场地质量拆分
      - - 选择性污染物提取
        - 定向污染物去除和矿物回收
        - 有特定离子、VOCs、油类、金属或 ppb 排放目标的场地
        - 已商业化推广的跨平台模块
        - 物理 + 化学步骤可独立运行，也可围绕 ROI/CGE/FRO 运行
        - 按污染物类别展示经济性的中立案例很少
      - - 载气萃取
        - 热浓缩、MLD、ZLD 收尾
        - 高 TDS、易结垢废水运营方
        - 已商业化推广的核心平台
        - 声称相较传统热系统，CAPEX/OPEX 更低，压力 / 温度也更低
        - 公开证据大多停留在营销层面，缺少具名基准研究
      - - 自由基氧化
        - 高 COD 和难降解有机物破坏
        - 处理难题水流的工业废水运营方
        - 已商业化推广的细分模块
        - 高级氧化套件，声称氧化剂和能效表现强
        - 第三方运行数据和按污染物划分的参考案例稀少
      - - SmartOps AI
        - 监测、预测、优化、远程 O&M 支持
        - 工厂业主和运营方
        - 已商业部署，至少有一个公开案例
        - 数字孪生 + 实时传感器 + ML + 专家运营支持
        - 网络安全、数据权利和认证细节未公开披露
      - - ForeverGone
        - PFAS 去除和破坏
        - 工业、市政、垃圾填埋和修复用户
        - 2024 年推出；2025 年部署和获奖规模扩大
        - 一体化现场去除 + 破坏，采用微泡沫分离和电氧化
        - 组合证据依赖公司宣布的结果和有限具名部署
      - - EC2 驱动的 alkaLi
        - 锂提取、浓缩、转化
        - 使用盐水、盐田、地热或回收来源的锂生产商
        - 商业验证 / 客户导入阶段
        - 集成提取-浓缩-转化流程，配套 CFRO 和可选 BOO 模式
        - 公开来源无法看清商业成熟度和客户数量
      - - 超纯水方案
        - UPW 的补水、一级和抛光阶段
        - 半导体、太阳能、制药制造商
        - 已商业化推广的应用组合包
        - 把 SCE、RO Infinity 和 EDI 与 H+E 领域经验结合
        - 没有按晶圆厂或产线类型披露公开参考架构或良率影响数据
    notes: 各行只覆盖公开具名模块或应用组合。成熟度只反映留存来源明确提供的证据，不代表内部产品路线图。
