  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              分析
              Gradiant，应把它放进工业和商业水处理、水回用与排放管理，而不是市政公用事业基础设施供应商。公司自己的定位在这一点上很一致：使命是让工业用水可持续，解决方案面向半导体、数据中心、制药、采矿、食品、能源和其他流程工业。USGS
              对工业用水的定义很宽，涵盖制造、加工、清洗、冷却、运输、产品掺入和工厂卫生；这个定义比狭窄膜设备类别更贴合 Gradiant
              的工作流重心。因此，市场边界应纳入私营工业和商业场址的工艺水处理、废水处理、水回用、排放最小化，以及部分资源回收项目。即便市政管网、住宅过滤和通用市政水务资本开支在部分商业数据库中相邻，也应排除在外。这个区分很重要，因为买方逻辑和估值逻辑不同：Gradiant
              卖给面对生产、合规和扩张瓶颈的运营商，而不是只卖给按费率监管的公共事业单位。主要替代方案包括既有 EPC、点状方案 OEM、内部公用工程团队，以及避开一体化回收和回用平台的渐进式合规升级。
