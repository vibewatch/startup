      - 公开数值 / 状态
      - 置信度
      - 为何重要
      - 尽调要求
    rows:
      - - 2025 年收入增长（相对 2024 年）
        - '>50%（公司声称）'
        - 中
        - 证实收入端动能强，但不能说明绝对收入基数
        - 与审计收入和月度收入桥表核对
      - - 2025 年新订单
        - '>$500M（公司声称）'
        - 中
        - 可作为 2026 年收入转化的有用领先指标
        - 提供在手订单账龄、取消情况和转化率
      - - 2025 年盈利能力
        - 增长 4X 且实现盈利（公司声称）
        - 方向置信度高，精确度置信度低
        - 提示经营杠杆出现，但不能说明实际 EBITDA 或自由现金流
        - 按季度提供 EBITDA、EBIT 和现金转化
      - - 地域组合
        - 约 1/3 美国、1/4 欧洲，其余为中东 + 印太
        - 中
        - 若回款也足够分散，地域分散可提高韧性
        - 按地区提供收入、毛利率和 DSO
      - - SmartOps 节能
        - 在 >200,000 m3/day SWRO 工厂最高节能 5%
        - 中
        - 支撑按价值定价的软件叙事，也给客户带来 OPEX 收益
        - 说明 Gradiant 通过定价捕获了多少价值
      - - Xylem 作为经常性服务收入代理
        - 装机基础支撑稳定的备件、替换和服务收入
        - 中
        - 说明规模起来后，已安装资产为何能带来质量更高的长尾收入
        - 将 Gradiant 装机基础和服务附加率与该代理对比
      - - 项目风险代理
        - 公开可比公司披露成本超支和性能保证风险
        - 中
        - 证实工业水项目一旦执行滑坡，就会侵蚀利润率
        - 按项目批次提供 Gradiant 储备政策和亏损历史
      - - 毛利率
        - 未公开披露
        - 低
        - 这是评估项目 + 服务混合模式估值的关键
        - 披露 EPC、O&M、数字化和化学品的毛利率
      - - ARR / NRR / CAC / 回本期
        - 未公开披露
        - 低
        - 需要它来检验软件或服务长尾是否实质改善收入质量
        - 提供经常性收入看板和分群留存指标
      - - 客户集中度 / DSO
        - 未公开披露
        - 低
        - 回款和集中度是项目型业务的核心
        - 提供头部客户收入占比和 AR 账龄
    notes: 本表有意混合已披露指标和明确缺口，方便读者区分牵引信号与缺失的投资判断所需输入。
