  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资框架与定价背景
        blocks:
          - type: paragraph
            body: >-
              Gradiant 的私募市场定价故事很好概括，但很难承销。公司在 2023 年 5 月披露的 Series D 估值为 $1B，2026 年 5 月披露的 Series E 估值为
              $2B。估值翻倍不是凭空发生。公司材料和第三方报道支持真实商业进展：Gradiant 称 2024 年上半年获得超过 $500M 订单，强调半导体与蓝筹工业客户的重复采购，后来又称 2025 年收入增长超过
              50%，盈利能力提高 4x。2025 年 10 月 HSBC 循环贷款也重要，因为以个位数利率获得贷方支持，作为运营质量证据，方向上强于仅靠品牌背书的风险投资轮。


              问题不在于 Gradiant 缺少正面信号，而在于信号远比背后的分母可见。公开记录仍未披露经审计 2025 年收入、利润率、现金转化、ARR 或经常性收入结构、Series E
              轮规模，以及当前估值对应的股权结构和优先权结构。这意味着投资论证不能是泛泛的“好公司，买这一轮”。它必须把强市场、真实产品与客户证明、融资成熟度提升，与另一面放在一起权衡：$2B
              头条估值可能已经在投资者检查底层经济性之前，把相当多上行计入了价格。
