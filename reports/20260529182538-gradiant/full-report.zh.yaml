      - CE039
  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流 / 痛点
      - Gradiant 方案
      - 公开声称的可衡量收益
      - 已知限制
    rows:
      - - 减少淡水取用的同时保障工艺用水
        - 工厂需要可靠取水或再生水进料，同时控制占地和成本
        - RO Infinity、SCE 和定制工艺水处理线
        - 更高回收率、模块化减少占地、总水成本更低
        - 公开来源未按行业或进水组成披露标准化设计范围
      - - 处理高波动工业废水
        - 水流随污染物负荷和排放标准变化；单一技术很少够用
        - Bio Infinity，并按需叠加 SCE/FRO
        - Bio Infinity 声称生命周期成本最高降低 50%；SCE 声称出水可达 ppb 级
        - 中立客户参考和长期运行数据有限
      - - 降低高盐水工厂排放和处置量
        - 传统热法 ZLD 昂贵，遇到易污染水流也难运行
        - RO Infinity 后接载气萃取或其他 ZLD 收尾
        - RO Infinity 声称较热法节省约 60%；CGE 声称总水成本降低 >50%
        - 跨来源基准仍大多由公司提供
      - - 现场去除并破坏 PFAS
        - 只捕集的方法会产生处置成本，并转移责任
        - ForeverGone
        - 公司声称处理后低于监管限值；行业媒体报道 99–99.9% 去除率和低成本
        - 具名中立案例仍少，长期修复经济性仍在形成
      - - 从复杂盐水中回收锂或其他资源
        - 蒸发池速度慢、占地大，且对输入条件挑剔
        - alkaLi / EC2，加 CFRO 和转化阶段
        - 电池级产出按秒计，而不是按年计；公司声称 OPEX 降低 50%
        - 公开证据显示的是导入和验证，不是广泛商业规模
      - - 让运营中的工厂更可靠、运行成本更低
        - 运营方难以平衡水质、回收率、能源、清洗周期和人工
        - SmartOps AI
        - 一个公开淡化案例显示最高节能 5%、可用率 99.95%
        - 公开软件安全和全装机群 KPI 披露薄弱
      - - 为精密制造生产超纯水
        - 半导体和制药工艺需要极高纯度和稳定质量
        - 使用 RO Infinity、SCE 和 EDI 的 UPW 组合包
        - '>18.2 MΩ-cm 电阻率目标；描述了补水、一级和抛光阶段'
        - 未留存公开设计蓝图或良率影响案例研究
      - - 帮助超大规模云服务商管理全场水战略
        - AI 数据中心正在水资源紧张地区扩张，同时面临严苛的可持续性审查
        - 整合 ZLD、SmartOps AI 和化学品的数据中心组合方案
        - 核心主张是 99% 工艺水在现场回收并回用
        - 留存来源未公开客户名称、合同范围和已实现节省
    notes: 收益均为对应工作流的公开主张，不应理解为所有装置的保证结果。各行混合成熟和新兴方案，因为买家常围绕一个场地问题组合多个模块。
