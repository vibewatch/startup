      - number: '7.2'
        title: 治理、法律与监管风险
        blocks:
          - type: paragraph
            body: >-
              公开证据让 Bajpayee 事件成为真实治理与声誉风险，但不是产品或运营失败的证据。IndiaWest 和 The Week 均报道称 Bajpayee 在波士顿妓院调查中被捕，NewsBytes 则称
              Gradiant 公开支持他，并预计事件将有利解决。2026 年 5 月 Series E 公告把 Bajpayee 的公开头衔改为 Executive
              Chairman，但保留资料没有披露案件最终状态、任何独立董事会审查，或任何可持续治理补救措施。治理之外，PFAS 监管同时实质性抬高机会和风险。EPA 的饮用水规则制定和 2024 年 Federal
              Register 最终规则确立了可执行 PFAS 标准；EPA 的 CERCLA 和释放报告材料也明确，PFOA 和 PFOS 现在带来清理和报告后果。ECHA 更广泛的 PFAS
              工作显示，监管外溢不只是美国问题。对 Gradiant 而言，ForeverGone 及相关产品可能受益于需求顺风，但商业化也取决于可辩护的性能主张、项目经济性，以及客户能否应对不断演化的清理和报告制度。
