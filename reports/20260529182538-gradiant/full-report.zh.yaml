        - CURE Chemicals、服务团队、耗材、清洗事件
        - 公开材料没有披露各模块的利润率结构或药剂强度数据
      - - 验证与合规层
        - 向客户、监管方和工厂业主证明处理效果
        - 认证实验室、EPA 标准、NPDES 许可、测量协议
        - 合规负担随地区和应用场景大幅变化
      - - 客户运营与反馈循环
        - 把工厂运行表现沉淀成后续设计经验和优化基准
        - 具名案例、运行数据、服务合同、专家团队
        - 设施群级 KPI 的公开披露很薄，外部很难验证学习效应
