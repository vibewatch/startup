  - id: TE003
    title: 技术 / 运营架构表
    columns:
      - 层级 / 组件
      - 作用
      - 关键依赖
      - 主要风险
    rows:
      - - 进水表征和工艺工程
        - 把源水水质、废水化学、回收目标和许可指标转化为处理工艺链
        - 现场采样、场地数据、排放目标、工程人员
        - 定性判断出错，可能推翻经济性或合规假设
      - - 核心物理处理模块
        - 按水流特点运行生物、膜、定向去除、氧化或热处理步骤
        - RO Infinity、Bio Infinity、SCE、CGE、FRO 硬件与控制
        - 性能随各场地的污堵、结垢和污染物复杂度变化
      - - 面向具体应用的组合方案
        - 把多种单元操作打包成 ForeverGone、alkaLi、UPW 或集成式数据中心水务方案等产品
        - 跨模块集成能力与项目交付纪律
        - 营销组合可能跑在公开证据或路线图精度前面
      - - 数字孪生与工厂数据层
        - 连接传感器、实时过程数据、优化模型、维护预测和操作员工作流
        - 仪表、遥测、历史数据、SmartOps AI 模型
        - 网络安全、数据权利和远程控制治理尚未公开到细节
