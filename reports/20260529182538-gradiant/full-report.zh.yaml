      - number: '6.4'
        title: 留存、重复使用与披露缺口
        blocks:
          - type: paragraph
            body: >-
              公开客户记录里，耐久性是最弱的一环。保留资料没有披露 NRR、GRR、logo
              流失率、续约率、活跃客户数、平均合同期限或头部账户集中度。这意味着本章只能使用重复使用代理指标，而不是真正的组合留存数据。最好的代理指标是公司 2024 年官方声明称老客户正在采用更多 Gradiant
              解决方案、台湾半导体案例里的后续晶圆厂合作，以及 Dresden 和 Italy 的半导体项目重复中标。这些信号重要，因为它们暗示 落地后扩张行为，以及任务关键型
              环境里的一定可引用性。不过，它们不能替代账户级分群。公开客户满意度披露也很薄。没有检索到 NPS、支持 SLA 或投诉率数据。主要负面公开信号是 2025 年 CEO
              丑闻；它不等同于客户流失，但可能给受监管或重视声誉的买方带来采购摩擦。因此，本章只能把耐久性描述为代理指标层面的判断，而不是机构级验证过的留存。
