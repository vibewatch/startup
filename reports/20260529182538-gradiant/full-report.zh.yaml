            body: >-
              Gradiant 的公开采用轨迹体现在系统数量、项目胜利和订单簿增长，而不是已披露账户数。独立报道称公司 2023 年约有 600 座水处理设施，MIT News 后来描述其为全球客户建成超过 2,500
              套端到端系统。官方新闻稿在这些顶层数字之下补充节奏：2022 年 9 月横跨五个垂直行业的七份合同、2019 年印度四个回收项目和超过 35 个项目的储备，以及 2024 年上半年超过 $500M
              新订单。最可信的成熟度信号不只是客户标识数量，而是重复工作。Gradiant 公开提到 Dresden 的第二个大型半导体项目、2025 年 Italy 第二个成功的半导体 UPW
              项目，以及回头客采用更多解决方案。这些事实支持真实客户采用，但仍没有披露活跃账户数、复购占比，或订单簿中重复业务与首次业务的比例。
