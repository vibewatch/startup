            body: >-
              Gradiant 的依赖画像不只是供应商问题；更关乎让项目成交和交付的机构与本地能力层。官方和行业报道显示，公司获得 HSBC $50M 公司循环贷款，总信贷额度现超过
              $100M。这对营运资金波动是有意义的缓释，但也提醒项目执行仍倚赖贷方信心。公开增长证明也集中在少数渠道：半导体、先进制造、采矿伙伴关系和 PFAS 修复。采矿证据本身与伙伴相连，公开公告点名 SLB 和 Rio
              Tinto。与此同时，H+E 和 WaterPark 收购显示 Gradiant 依赖收购来的工程深度，以及欧洲、台湾装机基础入口。人员方面，2022
              年运营高管聘任公告是真实的缓释信号，但当前公开董事会图谱、完整高管梯队和继任设计仍披露不足。结果是一家公司看起来有能力、也有资源连接，但相比更标准化的基础设施平台，仍更依赖特定交易对手、收购的本地团队和领导层可信度。
