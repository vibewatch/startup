      - number: '5.3'
        title: 运营架构与交付模式
        blocks:
          - type: paragraph
            body: >-
              从保留来源中浮现的运营架构有五层。第一是工艺特性分析：Gradiant
              把自己定位为先诊断进水水质、排放目标和水回用经济性，再选择处理流程。第二是物理处理层，膜、生物、定向去除、氧化和热模块可组合成定制处理流程。第三是数字仪表化：SmartOps AI
              创建数字孪生，接入传感器数据，并用机器学习做监控、预测性维护和优化。第四是现场运营和化学支持，Gradiant
              强调专家工艺团队、远程监控和化学品。第五是结果保障——水回用、合规排放、资源回收或更低总用水成本。关键点在于，SmartOps AI 在公开材料中并不是脱离工艺工厂的独立 SaaS。技术页面明确把软件与
              Gradiant 的系统专长，以及全球项目中的交付和运营绑定。ENGIE 海水淡化案例强化了这一模式：软件部署在非常具体的工厂配置上，用能源和回收指标验证，并作为 SaaS
              卖进已经运营的淡化设施。对于服务任务关键型水基础设施的公司来说，这种架构具备战略合理性，因为工厂数据、工艺专家和模块化硬件之间的反馈回路，比通用仪表盘更有防御性。这也意味着尽调应把 Gradiant
              评估为一个组合了工艺工程、工厂运营和软件的供应商，而不是纯数字供应商。
