        - VWT&S 的独立收入并未在公开口径中清晰拆出；相比专业挑战者，技术栈可能显得偏传统
      - - Xylem / Evoqua
        - 规模型既有厂商
        - 收购逻辑提到合并收入约 $7B，且仍有上市公司披露
        - 工业处理、服务密集型水务运营、晶圆厂相邻和 PFAS 相关项目
        - 装机基础信任、上市公司规模、服务和售后深度
        - 业务宽度会稀释焦点；公开证据在规模上更强，在差异化高难水流经济性上较弱
      - - IDE Technologies
        - 项目 / 海水淡化既有厂商
        - 私有但运营久的平台，具备 60+ 年水处理经验和大型参考项目
        - 海水淡化、工业回用、废水、交钥匙水务项目
        - 大型项目可信度和海水淡化血统
        - 相比 Veolia 或 Xylem，公开证据较少能证明其密集路线式服务覆盖
      - - Aquaporin
        - 组件型挑战者
        - 上市膜专家，投资者关系披露活跃
        - 通过 OEM 或集成商渠道服务膜和过滤应用
        - 仿生膜科学，以及组件层的选择权
        - 公开证据很少能证明其可交付交钥匙工厂或承担广泛 O&M 责任
      - - Membrion
        - 细分挑战者
        - 风投支持的高难废水专攻者
        - PFAS 相邻、半导体、采矿、溶解金属和盐类水流
        - 面向高难工业废水和回收用例的 ECD 陶瓷路线
        - 商业化早期，范围窄于全系统既有厂商
      - - Trevi Systems
        - 早期挑战者
        - 公开网站显示一家以试点为主的正渗透公司，并有 DOE 支持的 Hawaii 项目
        - 海水淡化、远程供水、高盐度和试点规模项目
        - 正渗透和可再生海水淡化叙事
        - 公开证据仍集中在试点和案例研究，而不是大规模装机队伍
      - - 替代方：Jacobs / AECOM / internal build
        - 现状替代方案
        - 全球工程替代方，水务实践广泛，采购动作熟悉
        - 传统合规系统、废水、回用、海水淡化、内部自建项目
        - 可信赖工程路径，买方感知到的职业风险更低
        - 与专业平台相比，通常在回用、ZLD 和 AI 主导优化上差异化较弱
