  - id: TV002
    title: 投资逻辑 / 反向逻辑
    columns:
      - 类别
      - 投资逻辑
      - 反向逻辑
      - 改变观点的因素
    rows:
      - - 市场
        - 高端工业水、半导体、PFAS 和回用仍是痛点强、吸引力高的终端市场
        - 市场有吸引力，不等于私募投资者可以在收入透明度不足时支付溢价
        - 若经审计增长和积压订单转化证明 Gradiant 正以高质量捕捉机会，则上调判断
      - - 产品
        - Gradiant 在高复杂度水务应用上似乎有差异化，而不只是商品化处理
        - 复杂项目型业务在保修、利用率和服务经济性披露前，可能看起来像高端科技公司
        - 若服务占比、利润率韧性和保修表现披露，则上调判断
      - - 客户
        - 蓝筹客户验证和重复订单信号降低客户存在性风险
        - 公开 Logo 不揭示集中度、定价权、付款条件或可续性
        - 若集中度、DSO 和重复收入数据干净，则上调判断
      - - 财务
        - 订单、盈利主张和 HSBC 支持显示规模和贷款方信心
        - 没有经审计 2025 收入、现金流或股权结构表数据，意味着账面标价可能高估真实股权价值
        - 若经审计财务和条款清单验证增长故事，则上调判断
      - - 竞争
        - Xylem/Evoqua 先例和公开水科技可比公司显示，战略资产可以拿到溢价定价
        - 类似 Ecolab 的溢价倍数属于有经常性收入、公开披露成熟的公司，而 Gradiant 还没有证明这点
        - 若 Gradiant 披露的经济性开始接近高端经常性工业水务同行，则上调判断
      - - 风险
        - 治理和执行风险真实存在，但尚未证明会对运营致命
        - 治理、项目滑坡或惩罚性轮次结构，可能很快把优质公司变成买贵了的交易
        - 若治理补救、集中度或契约余量弱于暗示，则下调判断
    notes: 投资逻辑刻意保持价格敏感。反向逻辑不是否定产品质量，而是提醒估值纪律取决于已披露经济性和条款。
