  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争图谱与威胁层级
        blocks:
          - type: paragraph
            body: >-
              Gradiant 参与的水市场里，相关替代方案形态并不相同。最清晰的框架是四层。第一层是规模型既有厂商：Veolia Water Technologies 和收购 Evoqua 之后的
              Xylem，它们拥有上市公司或集团规模、长期运营历史和深厚工业案例。第二层是 IDE Technologies，它的渠道密度不如这些玩家，但在海水淡化、水回用和其他大型项目型水系统上高度可信。第三层是
              Aquaporin、Membrion、Trevi
              等早期挑战者。它们重要，是因为代表未来技术替代方向；但所审阅证据仍让它们看起来更像组件、试点或细分工艺挑战者，而不是能与一家试图承担工厂级责任的公司竞争的全栈对手。第四层是替代方案层：买方仍可选择
              Jacobs、AECOM、其他工程伙伴，或采用传统排放中心化设计，而不是一体化 Gradiant 式平台。这个替代层按体量最重要，因为许多工业运营商在选择新专业供应商之前，默认先走熟悉的采购路径。
