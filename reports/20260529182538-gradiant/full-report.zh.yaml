      - number: '1.2'
        title: 创始人、领导层与治理信号
        blocks:
          - type: paragraph
            body: >-
              Gradiant 的创始故事仍与 MIT 以及两位联合创始人 Anurag Bajpayee、Prakash Govindan 紧密绑定。Bajpayee 仍是公司公开形象，但真实治理结构没有“创始人
              CEO”叙事那么简单。到 2025 年，反向和人物报道仍称 Bajpayee 为 CEO；而 2026 年 5 月官方 Series E
              公告则称其为联合创始人兼执行董事长。本次审阅的公司公开材料没有解释这一头衔变化，因此留下一个待解问题：日常 CEO 权限是否已经调整。Gradiant 2022 年 9 月新闻稿明确称 Prakash
              Govindan 为 COO，并宣布 Govind Alagappan 出任全球运营总裁，说明公司当时已经开始搭建更深的运营班底。治理披露仍有限，但 2023 年 Series D 新闻稿披露 BoltRock
              Holdings 的 Craig Huff 和 General Innovation Capital 的 Mark Danchak
              加入董事会。这给投资人提供了外部董事参与的证据，但完整董事会构成、委员会结构和投资人权利并未公开列出。
