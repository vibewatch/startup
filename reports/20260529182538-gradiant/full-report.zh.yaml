  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 全球水压力和水资源短缺
        - 正向
        - 多年
        - 更多工业场地会把安全水源视为运营基础设施，而不是把它当成公用工程的事后补丁
        - 将目标客户映射到 Aqueduct 和本地水压力暴露
      - - AI 和数据中心建设
        - 正向
        - 2025-2030
        - 新建园区对水的重视度提高，也支撑 Series E 围绕 AI 基础设施的叙事
        - 索取已具名数据中心项目管线和收入转化假设
      - - 半导体晶圆厂用水强度
        - 正向
        - 2025-2030
        - 水质和回收影响正常运行和产出，因而支撑高价值项目需求
        - 验证晶圆厂客户背书、部署范围和重复项目潜力
      - - WRAP 2.0 和回用政策支持
        - 正向
        - 当前
        - 尤其在制造业需求上升地区，回用采用仍有政治和制度支持
        - 检查目标区域哪些回用项目已经获得资金或被强制要求实施
      - - PFAS 监管
        - 正向
        - 当前至近期
        - 在特定场地制造额外处理紧迫性，并扩大相邻需求
        - 将工业 PFAS 机会与市政合规市场拆开看
      - - 水-能关系和处理运营成本
        - 负向
        - 持续
        - 高耗能方案会拉长回本，并要求更谨慎包装 ROI
        - 按用例索取项目级能耗强度、opex 和回本基准
      - - 任务关键型资质认证和信任要求
        - 负向
        - 持续
        - 销售周期长、依赖客户背书，即便需求明确也会拖慢采用
        - 按垂直行业复盘赢单 / 输单数据、试点转生产转化和参考客户
      - - 市场数据口径模糊
        - 负向
        - 当前
        - 头部 TAM 数字容易被夸大，不同报告之间也难比较
        - 坚持按不同视角测算规模，避免把一个宽口径估算当作估值捷径
    notes: 正向 / 负向描述对 Gradiant 采用节奏的净影响。多行是结构性条件，而非一次性事件，所以时间口径刻意保持宽泛。
