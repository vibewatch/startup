companyProfile:
  summary: >-
    Gradiant 是一家私营工业水技术公司，2013 年由 Anurag Bajpayee 和 Prakash Govindan 在 MIT 创立。公司为用水密集型工业客户设计并运营先进水处理、废水、回用、零液体排放、PFAS
    处理和数字优化系统。其最强的公开增长叙事集中在半导体、AI 数据中心、制药、食品饮料、采矿和能源。公开证据确认，公司估值从 2023 年的 $1B 抬升至 2026 年 5 月 Series E 的 $2B；但即便公司称 2025
    年已盈利且增长超过 50%，业务财务仍不透明。
