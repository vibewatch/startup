  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河或风险
      - 主要威胁
      - 严重性
      - 重要性
      - 缓解措施 / 尽调问题
    rows:
      - - Gradiant 高难问题工艺优势
        - 如果 TCO 证据弱，既有厂商可抵消这套叙事
        - 高
        - 投资逻辑取决于能否在最难处理的水流中证明真实的回收、能耗或正常运行优势
        - 要求参考工厂运营数据和客户并列证据
      - - Veolia 已安装的热法和 ZLD 参考项目
        - 专业厂商会在高难盐水上攻击能耗和总成本经济性
        - 中至高
        - 买方想要成熟规模时，Veolia 最强；但同一类项目也给了靠效率替代的空间
        - 在高 TDS 参考案例上测试改造和新建经济性
      - - Xylem / Evoqua 的服务密度和信任
        - 只有差异化压过路线密度时，Gradiant 才能赢
        - 高
        - 正常运行敏感场景里的买方常常更偏好服务响应和熟悉采购，而不是新颖性
        - 尽调时绘制服务覆盖、备件可得性和晶圆厂参考质量
      - - IDE 大型项目履历
        - 在海水淡化主导的采购中，IDE 扩大工业重叠
        - 中
        - 即使 Gradiant 的专业工艺故事更强，项目买方也可能偏好大型项目既有厂商
        - 按地理和项目类型分拆管线，而不是按泛市场份额
      - - 早期挑战者带来的收购或合作风险
        - 大型既有厂商可吸收细分工艺创新
        - 中
        - 组件突破可能侵蚀模块级差异化，即便那些初创公司本身不会成为完整对手
        - 跟踪细分膜和 FO 玩家周边的合作、授权和收购活动
      - - 现状 EPC 和排放路径
        - 初始成本熟悉、许可连续性让买方留在已知路径上
        - 很高
        - 主要威胁在于买方什么新东西都不做，却仍能跨过眼前合规或产能门槛
        - 在承销份额提升前，量化生命周期 TCO 对比排放、外运或传统 EPC
    notes: 严重性是对实际竞争危险的承销判断，不是量化损失预测。每一行都扎根于公开证据，也标出公开证据止步之处。
