      - number: '3.4'
        title: 护城河耐久性与投资含义
        blocks:
          - type: paragraph
            body: >-
              投资结论是，Gradiant 不需要在所有地方打败所有竞争者，但必须赢下那些差异化工艺设计比既有厂商舒适感更重要的水问题。Veolia 的护城河在装机热法和 ZLD 案例主导采购的场景中最深。Xylem 和
              Evoqua 的护城河在服务密度、售后存在和上市公司信任最重要的场景中最深。IDE 是项目驱动型既有厂商，能在海水淡化和大型水回用场景中挤压
              Gradiant。早期挑战者还不是按体量计算的主要商业威胁，但它们重要，因为它们可能压缩模块级差异化，或成为更大既有厂商的收购标的。最大的结构性威胁仍是现状：EPC、排放和传统设计。这意味着 Gradiant
              的护城河论证取决于在难处理水流上证明更低总成本或更高回收率，同时也要证明客户可以把任务关键型正常运行时间托付给它。没有信任，技术不够；没有技术，信任通常会让既有厂商胜出。
