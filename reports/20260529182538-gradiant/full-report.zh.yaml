              明确表示，其装机基础支撑稳定的零件、更换和服务收入，同时警告大型水项目存在成本超支和履约保证风险。Veolia 2025 年披露显示，当组合转向更高价值解决方案和服务时，规模化水技术业务可以让 EBITDA
              增速快于收入。Gradiant 可能正在朝这个方向走，但公开证据仍是方向性，而非定论。
