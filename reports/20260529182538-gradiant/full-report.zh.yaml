  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 客户工作流定义
        blocks:
          - type: paragraph
            body: >-
              理解 Gradiant 的产品，最好从客户工作流出发，而不是从某一个品牌技术页面出发。公司从工业站点的源水和工艺水制备开始，随后跟着工厂走到废水处理、水回用、排放最小化、PFAS
              修复和资源回收。这个框架很重要，因为半导体、制药、采矿、食品、锂和数据中心买方很少只采购一个孤立单元操作；它们通常购买的是一套办法，用来锁定供水、保护生产良率、减少淡水取用，并把排放或处置风险控制在许可范围内。公开解决方案页面持续描述模块化处理流程，可按用户需求配置：超纯水、工业工艺水、复杂废水回收、锂回收，或
              AI 基础设施的全站水策略。这种工作流框架也解释了 Gradiant 为什么总把数字优化、化学品和工程服务与处理模块并列。在数据中心公告中，公司把 ZLD 回收和回用、SmartOps AI 优化、CURE
              Chemicals 包装为一个全站方案。MIT News 同样把 Gradiant
              描述为一家端到端水公司，面向任务关键型客户组合化学、膜和生物处理。公开材料不能证明每个部署都用完整栈，但它支持运营模式判断：Gradiant 试图从进水特性分析到水回用或合规排放，掌握工厂级水问题。
