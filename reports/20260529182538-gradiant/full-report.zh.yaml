      - number: '1.5'
        title: 里程碑、声誉风险与关键待解问题
        blocks:
          - type: paragraph
            body: >-
              里程碑记录支持这样一个判断：Gradiant 建起的是真实商业深度，而不只是气候科技热度。公开新闻稿显示，公司从 2021 年增长轮融资和南极海水淡化项目，推进到 2022 年运营团队搭建、2023
              年独角兽估值、2025 年利润和订单加速，以及 2026 年围绕 AI、半导体和 IPO 准备的融资。第三方和公司来源还把 Gradiant 与一批蓝筹客户绑定，包括
              Coca-Cola、TSMC、Micron、GSK、Pfizer、SLB、Rio Tinto 和 AB InBev。所审阅记录中最重要的反向信号不是运营失败，而是治理与声誉：多篇 2025 年文章报道
              Bajpayee 因 Boston 豪华妓院调查被捕，NewsBytes 和 IndiaWest 引述公司为其辩护，并称对司法系统有信心。我没有在所审阅来源中发现针对 Gradiant 的公开 EPA、OSHA
              或产品安全执法记录，但董事会披露不透明、执行董事长头衔变化未解释、缺少经审计财务披露，意味着投资人仍需补做尽调，才能把公司的增长叙事视为充分去风险。
