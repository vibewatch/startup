        title: 展项
        blocks:
          - type: callout
            title: 一体化系统定位是核心产品逻辑
            body: 来源中最强的主线不是任何单一膜或 PFAS 技术，而是 Gradiant 能把源水、工艺水、废水、水回用、排放和优化框定为同一个工程问题。这种一体化框架让产品组合在商业上变得连贯。
