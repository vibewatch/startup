  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: 分层展示 Gradiant 如何把工程设计、处理模块、数字控制和运营支持组合成站点级水处理架构。
    data:
      layers:
        - id: customer-objective
          label: 客户目标层
          detail: 水源安全、工艺用水质量、废水回用、PFAS 治理、排放最小化或资源回收，决定工厂要解决什么设计问题。
        - id: design-layer
          label: 工艺工程层
          detail: 进水表征、物料衡算设计、许可目标转换和模块选择，把站点问题转成处理工艺链。
        - id: treatment-layer
          label: 处理模块层
          detail: RO Infinity、Bio Infinity、SCE、CGE、FRO、UPW 套件、ForeverGone 和 alkaLi 按需组合，拼出物理处理工艺链。
        - id: digital-layer
          label: 数字与控制层
          detail: SmartOps AI 将传感器、工厂数据、数字孪生逻辑、预测性维护和优化建议接入运行中的工厂。
        - id: service-layer
          label: 服务、化学与验证层
          detail: 工艺专家、药剂、认可实验室、验证协议和现场 O&M 支持稳定性能，并记录合规证据。
        - id: outcome-layer
          label: 结果层
          detail: 实现回用、合规排放、降低淡水取用、降低总水成本，或回收锂 / 其他有价值资源。
    approximationNotes: 这是根据公开产品材料重构的运营栈，并非 Gradiant 发布的内部系统图。
    claimRefs:
      - CE002
      - CE015
      - CE016
      - CE024
      - CE025
      - CE036
  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 概括站点从定义水挑战，到一体化处理、优化，再到回用 / 排放结果的通用流程。
    data:
      nodes:
        - id: site-problem
          label: 定义站点水问题
          description: 客户界定水源、工艺用水、废水、PFAS、排放或资源回收目标。
        - id: characterize
          label: 表征进水与约束
          description: 团队将水质、许可限值、回用需求、能源和占地约束转成设计要求。
        - id: select-train
          label: 组装处理工艺链
          description: Gradiant 围绕具体任务配置膜、生物、选择性去除、氧化、热法或 UPW 阶段。
        - id: instrument
          label: 部署仪表并接入数据
          description: 传感器和工厂遥测把物理系统接入 SmartOps AI 和远程绩效管理。
        - id: operate
          label: 运行并优化工厂
          description: 运营人员和工艺专家在站点限制内管理产能、清洗、回收率、化学品和维护。
        - id: verify
          label: 验证质量与合规
          description: 对照客户规格、PFAS 阈值、排放许可或回收目标检查水质。
        - id: outcome
          label: 回用、排放或回收资源
          description: 站点获得一种或多种结果：工艺用水供应、废水循环、减少处置、PFAS 破坏或锂产出。
      edges:
        - id: e1
          source: site-problem
          target: characterize
          label: 站点目标
        - id: e2
          source: characterize
          target: select-train
          label: 设计依据
        - id: e3
          source: select-train
          target: instrument
          label: 调试
        - id: e4
          source: instrument
          target: operate
          label: 实时工艺数据
        - id: e5
          source: operate
          target: verify
          label: 质量结果
        - id: e6
          source: verify
          target: outcome
          label: 水 / 资源产出
        - id: e7
          source: verify
          target: characterize
          label: 目标偏离时反馈
    approximationNotes: 该流程有意抽象多个终端市场；实际工艺链组成因站点和行业而异。
    claimRefs:
      - CE001
      - CE015
      - CE024
      - CE025
      - CE029
      - CE035
