      - number: '2.4'
        title: 增长驱动、采用约束与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最强的结构性驱动是水压力本身。WRI 和 UN-Water 都把水资源短缺描述为一个正在恶化的全球约束，由气候压力、需求上升和基础设施限制共同塑造。对 Gradiant
              来说，这个结构性问题一旦与用水密集型增长行业交叉，就会变成商业需求。半导体晶圆厂、AI 相关数据中心建设、PFAS 处理需求、水回用政策和资源回收项目，都会增加愿意购买更高性能水系统的站点数量。EPA 的
              WRAP 2.0 尤其相关，因为它直接把数据中心和制造业需求上升与水回用需求连接起来；EPA PFAS 规则也在特定应用中制造额外处理紧迫性。但采用并非没有摩擦。IEA
              的水-能源纽带提醒投资人，先进处理和水回用可能带来有意义的能源和运营成本影响。工业买方还面对漫长资格认证周期、资本开支
              审批关卡和信任门槛，因为水系统故障会关停任务关键型运营。剩余最大尽调缺口不在于需求是否存在，而在于这部分需求有多少落在 Gradiant
              的真实类别里、买方实际花多少钱、公司今天赢下多少份额。这些缺口解释了为什么本章有说服力，但仍刻意保持谨慎。
