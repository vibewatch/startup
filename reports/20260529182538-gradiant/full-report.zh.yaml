  - id: TU005
    title: 扩张与集中风险表
    columns:
      - 扩张驱动因素
      - 集中风险 / 约束
      - 影响
      - 尽调路径
    rows:
      - - 围绕处理、回用、UPW、AI 和 PFAS 的全场地落地后扩张
        - 增长可以加深单一客户的钱包份额，但项目范围仍可能是阶段性的
        - 如果一个客户从单个工厂问题扩展成更广的场地项目，上行空间很强
        - 要求按首售产品、第二个售出产品和每个扩张账户的场地数拆分收入
      - - 半导体重复赢单
        - 公开重复证明最集中在半导体和先进制造
        - 增长可能对晶圆厂资本开支周期和区域半导体政策敏感
        - 要求提供半导体收入占比、按收入排名的头部晶圆厂和按地区拆分的积压订单
      - - 公开证明中的蓝筹客户集中
        - 具名引用远少于隐含客户基础，可能是精心挑选的样本
        - 公开呈现的引用质量可能强于真实组合结构
        - 要求完整可引用客户清单和前 20 大账户集中度
      - - 通过 H+E 和 WaterPark 获取的装机基础
        - 本地工程入口和历史关系有助于赢单，但也增加整合与有机增长的不透明度
        - 客户扩张可能部分依赖收购来的渠道，而不只是直接销售
        - 要求区分直接收入与收购收入，并提供账户归属和被收购账本的续约表现
      - - 由 SLB 和 Rio Tinto 带动的伙伴主导采矿打法
        - 挖矿场景的验证依赖大型伙伴和长项目周期
        - 伙伴依赖可能压缩利润率，或削弱对终端客户经济性的可见度
        - 要求提供独立挖矿项目胜率、伙伴主导收入占比和项目回本假设
      - - 采购和声誉摩擦
        - CEO 丑闻即便尚无公开客户流失，也可能让客户背书销售或敏感采购变复杂
        - 胜率或尽调周期可能放慢，但不会立即体现为流失
        - 要求提供 2025 事件后的延期授标、丢失 RFP 和客户升级处理数据
    notes: 公开证据支持真实扩张机制，但披露不足，无法以机构级信心量化集中度、流失或伙伴依赖。
