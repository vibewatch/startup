  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 基于保留公开记录中的发生可能性、影响、缓释成熟度和残余暴露，对 Gradiant 五大风险集群做相对比较。
    data:
      columns:
        - 治理 / 法务
        - 运营 / 质量
        - 伙伴 / 依赖
        - 人才 / 执行
        - 财务 / 模型
      rows:
        - label: 发生可能性
          values:
            - 中
            - 中
            - 高
            - 中
            - 高
        - label: 影响
          values:
            - 高
            - 高
            - 高
            - 中高
            - 高
        - label: 缓释成熟度
          values:
            - 低中
            - 中
            - 中
            - 中
            - 中低
        - label: 残余风险敞口
          values:
            - 高
            - 高
            - 高
            - 中高
            - 高
    approximationNotes: 该比较由作者依据公开证据编码，不是精算评分表。Bajpayee 事件和 PFAS 规则复杂度抬高了治理 / 法律风险；财务 / 模型风险升高，主要来自不透明，而非已披露的困境信号。
    claimRefs:
      - CR001
      - CR006
      - CR025
      - CR037
      - CR040
      - CR045
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 治理、执行、依赖和模型风险如何传导至收入、融资、利润率和估值。
    data:
      nodes:
        - id: governance-shock
          label: 治理冲击
          detail: 公开的创始人丑闻和补救披露不完整，拖累可信度。
        - id: procurement-friction
          label: 采购摩擦
          detail: 敏感客户或合作伙伴放慢尽调，或上调审批层级。
        - id: project-delay
          label: 项目延期或表现不达标
          detail: 复杂 UPW、回用或 PFAS 项目错过进度或回收率目标。
        - id: working-capital-strain
          label: 营运资本压力
          detail: 里程碑节奏和项目密集度在现金回款前吃掉流动性。
        - id: partner-pullback
          label: 合作伙伴 / 贷款方收缩
          detail: 信贷或合作伙伴胃口减弱，压低交易流量或交付灵活性。
        - id: margin-pressure
          label: 利润率压力
          detail: 返工、回款变慢或高成本交付拉低单位经济。
        - id: revenue-risk
          label: 收入风险
          detail: 中标延后、复购放慢，或客户暂停被集中度放大。
        - id: valuation-risk
          label: 估值与融资风险
          detail: 不透明叠加执行走弱，压缩估值支撑和融资杠杆。
      edges:
        - from: governance-shock
          to: procurement-friction
          label: 抬高审查强度
        - from: procurement-friction
          to: revenue-risk
          label: 放慢授标
        - from: project-delay
          to: working-capital-strain
          label: 拉长现金周期
        - from: project-delay
          to: margin-pressure
          label: 推高返工
        - from: partner-pullback
          to: working-capital-strain
          label: 削弱灵活性
        - from: partner-pullback
          to: revenue-risk
          label: 削弱融资可得性
        - from: working-capital-strain
          to: valuation-risk
          label: 提高稀释风险
        - from: margin-pressure
          to: valuation-risk
          label: 压缩质量
        - from: revenue-risk
          to: valuation-risk
          label: 削弱增长信心
    claimRefs:
      - CR001
      - CR024
      - CR025
      - CR026
      - CR038
      - CR041
      - CR042
      - CR045
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 贷款方、收购来的区域团队、客户、合作伙伴和监管方中的关键依赖。
    data:
      nodes:
        - id: hsbc
          label: HSBC / 贷款方
          detail: 为营运资本和项目执行提供循环流动性。
        - id: semis
          label: 半导体和 AI 晶圆厂
          detail: 复购项目和先进制造需求中最显眼的集中来源。
        - id: he
          label: H+E
          detail: 欧洲布局和先进制造工程深度。
        - id: waterpark
          label: WaterPark
          detail: 台湾装机基础和半导体设计 / 建造能力。
        - id: slb-riotinto
          label: SLB / Rio Tinto
          detail: 借助合作伙伴进入采矿市场的路径和项目背书。
        - id: pfas-buyers
          label: PFAS 买方 / 监管方
          detail: 机场、受监管场址和机构共同塑造 PFAS 需求节奏。
        - id: gradiant-core
          label: Gradiant 核心运营
          detail: 协调交付、质量和现金转换的执行引擎。
        - id: revenue-cash
          label: 收入 / 现金转换
          detail: 商业产出最容易受依赖变化影响。
      edges:
        - from: hsbc
          to: gradiant-core
          label: 支持营运资本
        - from: semis
          to: revenue-cash
          label: 拉动可见需求
        - from: he
          to: gradiant-core
          label: 增加欧洲能力
        - from: waterpark
          to: gradiant-core
          label: 增加台湾能力
        - from: slb-riotinto
          to: revenue-cash
          label: 打开采矿项目
        - from: pfas-buyers
          to: revenue-cash
          label: 主导 PFAS 重复采用
        - from: gradiant-core
          to: revenue-cash
          label: 将项目转成现金
    claimRefs:
      - CR025
      - CR030
      - CR032
      - CR033
      - CR034
      - CR043
      - CR045
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 从市场和客户验证，到披露缺口和可比锚点，最终导向「观察」建议的决策链。
    data:
      nodes:
        - id: market
          label: 市场质量（高）
          detail: 高端工业水、半导体、PFAS 和回用仍是有吸引力的支出池
        - id: customer
          label: 客户验证（高）
          detail: 蓝筹客户名称和复购信号降低存在性风险
        - id: financial_momentum
          label: 财务动能（中高）
          detail: H1 2024 订单 >$500M、2025 年收入增长 >50% 的说法、盈利能力 4x 的说法
        - id: disclosure_gap
          label: 披露缺口（重大）
          detail: 未披露经审计的 2025 年收入、利润率、现金转换或股权结构表
        - id: governance
          label: 治理拖累（重大）
          detail: 创始人法律报道意味着入场纪律要留得更宽
        - id: comp_anchor
          label: 可比锚点（有上限）
          detail: 公开市场和先例区间从约 1.1x EV/Sales 到约 4.9x，并有战略收购上限
        - id: recommendation
          label: 建议：观察
          detail: 可以推进尽调，但如果经济性不更清晰或条款不更好，不要按当前估值买入
      edges:
        - from: market
          to: recommendation
          label: 支持继续接触
        - from: customer
          to: recommendation
          label: 降低商业存在性风险
        - from: financial_momentum
          to: recommendation
          label: 支撑较底部溢价的估值框架
        - from: disclosure_gap
          to: recommendation
          label: 阻断买入信心
        - from: governance
          to: recommendation
          label: 拉宽所需下行保护
        - from: comp_anchor
          to: recommendation
          label: 限制当前估值可被证明的空间
    claimRefs:
      - CV009
      - CV014
      - CV015
      - CV022
      - CV025
      - CV026
      - CV048
      - CV058
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 以百万美元计的示例中点，展示收入验证、轮次条款和风险因素变化时，Gradiant 价值如何变化。
    data:
      items:
        - label: 乐观验证：收入 >$400M + 干净条款
          value: 2600
          note: 乐观区间中点，单位 USD M
        - label: 当前披露融资轮锚点
          value: 2000
          note: 最新披露的私募市场估值
        - label: 基准情景：已披露但项目权重高
          value: 1700
          note: 基准区间中点，单位 USD M
        - label: 现金转换弱或集中度高
          value: 1200
          note: 向公允价值区间低端压缩
        - label: 惩罚性优先权 + 治理拖累
          value: 900
          note: 悲观低端中点，单位 USD M
    approximationNotes: 数值是以百万美元计的示例估值中点，不是精确标记。由于 Gradiant 不公开披露收入、利润率或轮次条款，锚点来自情景逻辑。
    claimRefs:
      - CV021
      - CV022
      - CV025
      - CV053
      - CV054
      - CV055
      - CV057
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 截至 2026-05-29，Gradiant 的乐观、基准、悲观和当前入场估值带。
    data:
      items:
        - label: 悲观情景
          low: 800
          high: 1300
          unit: USD M
          note: 收入转换弱、条款弱，或拖累更深
        - label: 基准情景
          low: 1400
          high: 2000
          unit: USD M
          note: 公司质量不错，但未披露的经济性让价值接近或低于当前估值
        - label: 乐观情景
          low: 2200
          high: 3000
          unit: USD M
          note: 收入、利润率和条款清单证据验证溢价待遇
        - label: 当前披露融资轮
          low: 2000
          high: 2000
          unit: USD M
          note: 最新披露的私人估值
    approximationNotes: 区间是由公开可比公司、先例交易参考和宽泛收入假设拼出的情景括号。不应解读为 DCF，也不是管理层指引。
    claimRefs:
      - CV052
      - CV053
      - CV054
      - CV055
      - CV057
      - CV058
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向 IC 的 Gradiant 打分，覆盖最影响估值纪律的证据维度。
    data:
      items:
        - label: 市场吸引力
          value: 8 / 10
          status: verified
          note: 高端工业水需求和半导体 / PFAS 顺风可信
          claimRefs:
            - CV009
            - CV014
        - label: 产品 / 客户验证
          value: 8 / 10
          status: verified
          note: 蓝筹客户名称和复购信号真实存在
          claimRefs:
            - CV012
            - CV013
        - label: 财务动能
          value: 7 / 10
          status: verified
          note: 订单、盈利能力声称和贷款方支持方向上偏强
          claimRefs:
            - CV006
            - CV014
            - CV015
        - label: 经济性可见度
          value: 4 / 10
          status: gap
          note: 未披露经审计的 2025 年收入、利润率、现金转换或收入结构
          claimRefs:
            - CV022
            - CV023
            - CV024
        - label: 竞争位置
          value: 7 / 10
          status: in-progress
          note: 看起来有差异化，但估值仍必须落在公开市场和先例交易边界内
          claimRefs:
            - CV048
            - CV051
        - label: 治理 / 执行风险
          value: 5 / 10
          status: in-progress
          note: 治理拖累和项目型业务执行风险仍然重大
          claimRefs:
            - CV026
            - CV060
        - label: 估值支撑
          value: 4 / 10
          status: gap
          note: 如果没有条款清单清晰度或经审计经济性，$2B 很难称得上有吸引力
          claimRefs:
            - CV057
            - CV058
        - label: 证据质量
          value: 5 / 10
          status: in-progress
          note: 证据足以框定决策，但不足以把不确定性压缩成单点价格
          claimRefs:
            - CV052
            - CV061
    claimRefs:
