      - number: '8.3'
        title: 牛市、基准与熊市承销
        blocks:
          - type: paragraph
            body: >-
              情景框架应明确区分已知和仅被暗示的内容。牛市情景下，Gradiant 未披露的 2025 年收入实际已大致越过 $400M，2026 年增长仍高于
              30%，现金转化扎实，股权结构干净，治理噪音不损害客户或融资入口。在这个世界里，略高于当前轮次的估值区间——约 $2.2B 至 $3.0B——可以用高溢价工业水务和战略先例视角辩护。


              基准情景更保守，也应赋予最高概率。它假设公司真实且有吸引力，但透明度仍显著低于顶级上市可比：收入可能在数亿美元中段，而不是高段；增长从 2024–2025
              年异常强的主张中减速；利润率为正但受项目型业务拖累；轮次条款普通，而非特别有利于投资者。这支持约 $1.4B 至 $2.0B 的估值，也就是说今天 $2B 标记已经捕捉了相当多合理上行。


              熊市情景不是欺诈情景，而是估值压缩情景。如果披露收入低于暗示水平，在手订单转化更慢，现金生成偏弱，轮次条款苛刻，或治理悬而未决进一步加深，估值可能压缩至 $0.8B 至
              $1.3B。该不对称性推动推荐结论。投资者应假设 4–6 年持有期，并围绕运营里程碑和结构化下行保护承销，而不是押注快速 IPO 或轻松升值轮。
