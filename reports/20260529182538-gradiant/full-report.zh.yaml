  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 按垂直、买方与地域拆分客户基础
        blocks:
          - type: paragraph
            body: >-
              Gradiant
              的客户基础最好按垂直行业、用例和地域来分层，而不是看一个单一客户数量标题。公司卖给用水密集型工业运营商，这些工厂承受不起水质失败、合规失误或供水中断。公开行业页面把客户基础集中在半导体、食品饮料、制药、采矿、炼油和化工、能源等领域。买方和付款方通常是工厂所有者或运营公司；日常用户则是工程、公用工程、水务和运营团队，他们必须保证站点持续运行且合规。地域同样重要。公开客户证据横跨
              Taiwan、Singapore、Germany、Italy、Western Australia、India、Munich 和 United States，说明 Gradiant
              在水压力、排放标准和任务关键型生产交汇处赢单。公开集中度最强的是半导体，但更宽的分层框架仍是站点水复杂度，而不是已公布客户总数。
