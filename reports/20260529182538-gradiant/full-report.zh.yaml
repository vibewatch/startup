    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份定位、使命与产品边界
        blocks:
          - type: paragraph
            body: >-
              Gradiant 是一家私营工业水技术公司，总部位于 Massachusetts 州 Boston 地区，公开资料具体指向 Woburn 作为运营基地。公司称其诞生于
              MIT，并把自己定位为一种“不同类型的水公司”：围绕端到端解决方案搭建，而不是只卖单一工艺撬装设备
              或软件模块。其产品覆盖受污染废水处理、超纯工艺水制备、资源回收、卤水浓缩、最小液体排放和零液体排放，以及工厂级数字优化。公司给出的价值主张是帮助重工业客户减少淡水取用、回收有价值材料、把废水再生为淡水，并以更低能耗运营。公开材料持续显示，Gradiant
              的商业重心落在停机时间和水质都至关重要的用水密集行业：半导体和数据中心、食品饮料、制药、采矿和关键矿物、能源、石化、可再生能源，以及部分政府基础设施项目。技术页面显示，公司已不再只是海水淡化专家；它现在销售一套更宽的技术栈，包括采用专利
              CFRO 的 RO Infinity、Bio Infinity、SmartOps AI 及其他自研平台。
