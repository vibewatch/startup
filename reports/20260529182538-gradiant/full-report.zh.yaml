            body: >-
              公开证据指向一个混合收入模式，而不是清爽的软件故事。Gradiant 销售工程化处理系统、UPW、水回用和 ZLD 项目，同时也销售设计-建造、运营-维护、灵活融资、SmartOps AI
              优化、自研化学品和资源回收工作流。这意味着已报告收入很可能混合了前置 EPC 或设计-建造确认，以及服务、软件、化学品，甚至项目资产或融资收入。最清晰的公司披露牵引力信号来自 2025 年回顾：收入较 2024
              年增长超过 50%，新订单超过 $500M，盈利能力提升 4X，并在进入 2026
              年时实现盈利性增长。地域看起来也更均衡，而不是集中在一个市场。限制在于披露深度。所审阅公开来源没有给出经审计收入、收入流占比或已实现定价，所以营收叙事方向上强，但仍是公司口径，且不足以支撑完整承销模型。
