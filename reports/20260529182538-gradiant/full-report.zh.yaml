            body: >-
              一旦按战场而不是品牌名拆分市场，竞争图景会更清晰。Veolia 是热法 ZLD 和其他高 TDS 卤水问题上记录最充分的既有厂商，因为其公开 ZLD 和 HPD 材料突出大规模蒸发和结晶经验。Xylem 加
              Evoqua 在工业水处理广度、服务密度和晶圆厂相邻可信度最重要的场景里看起来最强。IDE
              在海水淡化、工业水回用或大型交钥匙项目上高度可信，但其公开证据更像项目履历，而不是密集现场服务基础设施。Aquaporin、Membrion 和 Trevi 的重要性不同：Aquaporin
              看起来像膜或组件威胁，Membrion 像聚焦难处理废水的威胁，Trevi 像仍需更多规模化证据的正渗透选项。在这一背景下，Gradiant
              最好的楔子不在于规模能压过既有厂商，而在于它可能在选定水流上更快或以更好经济性解决更难的水回用、ZLD 和优化问题。
