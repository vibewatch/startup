  - id: TV005
    title: 投资逻辑失效与否决触发项
    columns:
      - 触发项
      - 阈值或证明点
      - 对投资逻辑的影响
      - 行动含义
    rows:
      - - 收入规模不及预期
        - 经审计 2025 年收入显著低于隐含基准情景区间，尤其是 < $250M
        - 当前倍数不再像高质量溢价，开始像买贵了
        - 从观察转为回避
      - - 利润率或现金转化不及预期
        - 毛利率低、EBITDA 转化弱，或营运资本持续拖累
        - 增长没有转成高质量利润，溢价倍数逻辑失效
        - 回避，或要求大幅折价
      - - 股权结构条款苛刻
        - 清算优先权堆叠重、参与型优先股，或异常偏向投资人的反稀释权
        - 名义估值高估了普通股真实经济性
        - 不要只按名义估值投资
      - - 客户集中度或积压订单账龄过高
        - 少数客户撑起积压订单，或转化速度慢于隐含假设
        - 客户验证故事变脆，估值应当压缩
        - 继续尽调或回避
      - - 治理悬而未决问题加深
        - 案件升级，或董事会整改乏力
        - 退出选择和客户信心都可能被压缩
        - 解决前回避
      - - 旗舰项目执行失误
        - 半导体、PFAS 或其他复杂项目在进度、保证指标或回款上失手
        - 增长叙事不再撑得住溢价倍数
        - 按悲观情景区间重新定价
    notes: 这张触发项表面向投委会监控。每一行都是投资逻辑关口，而不是泛泛的 公司风险。
    claimRefs:
      - CV023
      - CV025
      - CV026
      - CV055
      - CV056
      - CV057
      - CV060
  - id: TV006
    title: 最终尽调清单
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计 2025 年财务数据
        - 收入、毛利率、EBITDA 或经营利润，以及经营现金流
        - 决定当前轮次是合理、偏高，还是其实有吸引力
        - 财务资料室：经审计报表加月度桥接
      - - 积压订单质量
        - 积压订单账龄、里程碑计划、取消历史，以及订单到收入桥接
        - 区分健康增长与递延或低质量项目量
        - CRO / CFO 复核前二十个项目
      - - 收入结构
        - 经常性服务占比、项目占比，以及任何类似 ARR 的组成
        - 决定应采用 Ecolab 式溢价，还是 Xylem 式中点框架
        - 分部材料加队列分析
      - - 客户集中度和回款
        - 前 10 大客户、DSO、应收账款账龄和争议历史
        - 隐藏集中度或回款慢，会迅速压缩股权价值
        - 财务控制负责人资料包和大客户下钻
      - - Series E 轮条款
        - 轮次规模、股权结构表、优先权、反稀释和投资人权利
        - 真实入场经济性可能与名义估值差得很远
        - 法律顾问和融资文件
      - - 治理整改
        - 创始人案件状态、董事会回应、授权安排和声誉控制
        - 用于判断退出准备度和下行倍数风险
        - 董事会材料、法律顾问备忘录和治理访谈
    notes: 这些问题是从公开市场三角测算走向真正承销判断所需的最低证据集。回答之前， $2 billion 标记应视为可谈判锚点，而不是已经验证的公允价值。
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV061
figures:
  - id: FO001
    title: Gradiant 公司里程碑时间线
    type: timeline
    layout: wide
    summary: 梳理 Gradiant 从 2013 年创立到 2026 年 5 月 Series E 轮的公开里程碑， 包括 2025 年 10 月信贷额度和 2025 年 4 月治理丑闻。
    data:
      items:
        - label: 创立于 MIT
          date: 2013-01
          detail: Anurag Bajpayee 和 Prakash Govindan 基于 MIT 水处理研究创办 Gradiant。
          tone: positive
        - label: 南极海水淡化合同
          date: 2021-10
          detail: Gradiant 旗下 CRS Water 拿下南极海水淡化厂项目，显示国际项目 触达能力。
          tone: positive
        - label: Series C 轮
          date: 2021-11
          detail: Gradiant 获得 Warburg Pincus 和 Schlumberger New Energy 领投的超过 $100M 融资。
          tone: positive
        - label: 运营高管团队搭建
          date: 2022-09
          detail: Govind Alagappan 出任全球运营总裁，Gradiant 宣布战略性招聘。
          tone: positive
        - label: Series D 独角兽轮
          date: 2023-05
          detail: Series D 轮首次交割带来 $225M 融资和 $1B 估值。
          tone: positive
        - label: CEO 法律丑闻
          date: 2025-04
          detail: 多家媒体报道 Bajpayee 因波士顿豪华妓院案调查被捕。
          tone: negative
        - label: 强劲的 2025 经营年
          date: 2025-12
          detail: 年度回顾称收入增长 50%+、新增订单 $500M+，盈利能力增长 4x。
          tone: positive
        - label: HSBC 信贷额度
          date: 2025-10
          detail: Gradiant 完成 $50M 循环贷款，并称总信贷能力现已超过 $100M。
          tone: positive
        - label: Series E 轮，估值 $2B
          date: 2026-05
          detail: Safar Partners 和 Hostplus 领投新融资，与 IPO 准备以及 AI 和 半导体扩张挂钩。
          tone: positive
    approximationNotes: 部分里程碑只精确到月份，因为公司材料只披露发布日期或年度摘要，而不是确切执行日期。
    claimRefs:
