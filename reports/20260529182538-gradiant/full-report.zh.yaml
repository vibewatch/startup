            body: >-
              具名客户证据确实存在，但证明力并不一致。最强的公开成效来自更成熟的部署，比如台湾半导体回收项目、新加坡 LSR 案例、Formosa Plastics 与 Nan Ya 的废水减排获奖项目，以及 Munich
              Airport 的 ForeverGone 安装。这些来源给出了运行状态、系统规模、回收率或成本主张。采矿证据有意义，但更多由合作伙伴牵引：Rio Tinto 和 SLB 出现在 2023
