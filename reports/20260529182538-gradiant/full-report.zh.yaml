      - number: '5.4'
        title: 差异化与公开证据点
        blocks:
          - type: paragraph
            body: >-
              Gradiant 最清晰的公开差异化来自四个方面。第一，RO Infinity 和 Carrier Gas Extraction 都声称成本显著低于传统热浓缩，使 Gradiant 在高回收率、MLD 和 ZLD
              工作流中具备可信叙事，因为这些场景里总用水成本主导工厂决策。第二，SmartOps AI 给公司一个数字化运营模式，而且它附着在真实设施上，不是作为脱离现场的分析层营销；已发布的 ENGIE
              案例至少提供了一个量化证据点。第三，ForeverGone 被定位为比通用 PFAS 处理更强的应用型楔子，因为它承诺的不只是去除，还包括在现场销毁 PFAS 浓缩物。第四，alkaLi 展示了 Gradiant
              如何把膜和控制诀窍重新打包成面向锂生产商的垂直品牌化方案。第三方报道总体支持其广度叙事，即便不能完整验证每项运营主张。MIT News 报道超过 2,500 套端到端系统，并点名蓝筹工业客户。Global
              Water Awards 在授予 Gradiant 2024 年荣誉时，明确提到 Turing、锂生产、PFAS 消除和超临界水氧化。PFAS 专业媒体报道描述了微泡沫分馏加电氧化、99-99.9%
              去除率、公司声称的低运营成本区间，以及 Munich International Airport 部署。因此，证据在广度和应用野心上方向性较强，但在中立案例研究、具名客户引用和全组合可靠性数据上仍薄于理想状态。
