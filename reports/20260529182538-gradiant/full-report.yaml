      - number: '8.4'
        title: Decision discipline, thesis-breaks, and next diligence
        blocks:
          - type: paragraph
            body: |-
              The final recommendation should therefore be disciplined rather than binary. Gradiant appears
              to have a strong market position in premium industrial water, differentiated product breadth,
              real blue-chip customers, and increasingly credible financing support. Those are not “track”
              signals in the sense of a weak business; they are “track” signals in the sense of an investable
              business whose current public pricing support is thinner than its operating narrative. Without
              audited 2025 financials and term-sheet clarity, investors risk paying an Ecolab-like or
              strategic-precedent-like price for an asset whose public disclosure still looks closer to a late-
              stage private project business.

              The thesis-break triggers are practical. If revenue quality, cash conversion, concentration,
              covenant headroom, or governance remediation look materially worse than implied, the call should
              move from Track to Avoid. The upgrade path is equally clear: disclose audited 2025 revenue and
              margins, show ordinary preferred protections, prove backlog conversion and concentration are
              healthy, and either resolve the governance overhang or demonstrate that it has become clearly
              non-operational. Until then, the company merits continued engagement and diligence, but not a
              blank check at the current headline valuation.
