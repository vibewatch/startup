  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Public Traction
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a hybrid revenue model rather than a clean software story. Gradiant sells
              engineered treatment systems, UPW, reuse, and ZLD projects, but also markets design-build,
              operate-maintain, flexible financing, SmartOps AI optimization, in-house chemicals, and resource-recovery
              workflows. That means reported revenue likely mixes upfront EPC or design-build recognition with service,
              software, chemicals, and possibly project-asset or financing revenues. The clearest company-disclosed
              traction signal is the 2025 review: revenue up over 50% versus 2024, over $500 million of new orders,
              profitability up 4X, and growth delivered profitably into 2026. Geography also appears balanced rather
              than concentrated in one market. The limitation is disclosure depth. None of the reviewed public sources
              gives audited revenue, stream mix percentages, or realized pricing, so the top-line story is directionally
              strong but still company-claimed and incomplete for a full underwriting model.
