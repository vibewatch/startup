      - number: '2.3'
        title: Buyer Segments, Budget Owners, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Gradiant’s buyer map is best understood as a set of high-value verticals rather than one uniform
              water-treatment customer base. Semiconductor fabs are the clearest water-critical segment because water
              quality, recycling, and reliability affect yield and uptime; public TSMC and Intel disclosures make that
              strategic posture explicit. Hyperscalers and data-center developers form a second important segment.
              Google and Microsoft disclose water stewardship and water-positive commitments, while Microsoft now links
              direct-to-chip cooling to material water savings at the facility level. Those disclosures do not reveal
              procurement budgets, but they do confirm that water decisions sit alongside infrastructure and
              sustainability planning. Other industrial segments—pharma, food, mining, PFAS remediation, and resource
              recovery—follow the same logic: buyers surface when utilities, EHS, or site-operations teams realize
              existing water systems constrain compliance or growth. The practical payer is rarely a generic “water
              department.” Instead the budget usually sits with facilities, utilities, operations, or expansion-capex
              owners, with procurement layered on later. This also explains why Gradiant’s customer proof matters:
              blue-chip names and reuse outcomes help overcome trust barriers in projects where buyers cannot tolerate a
              failed deployment.
