  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      Decision chain from market and customer proof through disclosure gaps and comp anchors to the Track
      recommendation.
    data:
      nodes:
        - id: market
          label: Market quality (High)
          detail: Premium industrial water, semiconductors, PFAS, and reuse remain attractive spend pools
        - id: customer
          label: Customer proof (High)
          detail: Blue-chip names and repeat-order signals reduce existence risk
        - id: financial_momentum
          label: Financial momentum (Medium-High)
          detail: '>$500M H1 2024 orders, >50% 2025 revenue growth claim, 4x profitability claim'
        - id: disclosure_gap
          label: Disclosure gap (Material)
          detail: No audited 2025 revenue, margin, cash-conversion, or cap-table disclosure
        - id: governance
          label: Governance overhang (Material)
          detail: Founder legal coverage argues for wider entry discipline
        - id: comp_anchor
          label: Comp anchor (Bounded)
          detail: Public and precedent range spans ~1.1x EV/Sales to ~4.9x plus a strategic takeout ceiling
        - id: recommendation
          label: 'RECOMMENDATION: Track'
          detail: Engage on diligence, but do not pay the current mark without cleaner economics or better terms
      edges:
        - from: market
          to: recommendation
          label: supports continued engagement
        - from: customer
          to: recommendation
          label: reduces commercial existence risk
        - from: financial_momentum
          to: recommendation
          label: supports premium-to-floor framing
        - from: disclosure_gap
          to: recommendation
          label: blocks buy conviction
        - from: governance
          to: recommendation
          label: widens required downside protection
        - from: comp_anchor
          to: recommendation
          label: caps what the current mark can justify
    claimRefs:
