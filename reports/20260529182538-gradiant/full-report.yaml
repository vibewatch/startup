  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              Gradiant’s risk profile is serious but not monolithic. The highest-severity visible issue is governance
              and reputational: multiple 2025 news reports said co-founder Anurag Bajpayee was arrested in the Boston
              brothel probe, and the retained corpus still does not show the case disposition or a fully articulated
              board-level remediation package. That risk should be treated as distinct from product or plant execution;
              the public record still supports real customer deployments and financing access. The second cluster is
              operational. Gradiant sells mission-critical water systems into semiconductors, PFAS remediation, and
              complex industrial sites where water failure can impair yield, compliance, or site uptime. The third
              cluster is dependency: lender liquidity, partner-led mining projects, and semiconductor-heavy demand all
              matter to delivery. The fourth is financial/model risk. Series E, the HSBC revolver, and a more-than-$500
              million H1 2024 order announcement show momentum, but the company remains privately disclosed only in
              fragments, leaving collections, concentration, covenant, and margin questions unresolved.
            claimRefs:
