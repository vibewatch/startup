  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: How governance, execution, dependency, and model risks propagate into revenue, financing, margins, and valuation.
    data:
      nodes:
        - id: governance-shock
          label: Governance shock
          detail: Public founder scandal and incomplete remediation disclosures create credibility drag.
        - id: procurement-friction
          label: Procurement friction
          detail: Sensitive customers or partners slow diligence or escalate approvals.
        - id: project-delay
          label: Project delay or underperformance
          detail: Complex UPW, reclaim, or PFAS projects miss schedule or recovery targets.
        - id: working-capital-strain
          label: Working-capital strain
          detail: Milestone timing and project intensity absorb liquidity before cash converts.
        - id: partner-pullback
          label: Partner / lender pullback
          detail: Credit or partner appetite weakens, reducing deal flow or delivery flexibility.
        - id: margin-pressure
          label: Margin pressure
          detail: Rework, slower collections, or expensive delivery lower unit economics.
        - id: revenue-risk
          label: Revenue risk
          detail: Awards slip, repeats slow, or concentration amplifies a customer pause.
        - id: valuation-risk
          label: Valuation and financing risk
          detail: Opacity plus weaker execution compresses valuation support and financing leverage.
      edges:
