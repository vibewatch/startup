      - number: '1.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiated water-tech stack plus profitable growth is a rare combination
            body: >-
              The strongest evidence in this chapter is not simply that Gradiant has raised a lot of money; it is that
              the company couples a broad proprietary technology portfolio with publicly claimed profitability and
              meaningful commercial momentum. By late 2025 the company was reporting 50%+ revenue growth, 4x
              profitability improvement, and more than $500M of new orders, while the 2026 Series E press release framed
              Gradiant as the water infrastructure partner for AI, semiconductors, and other mission-critical industrial
              systems. That combination of technology, capital access, and operating performance is rare in industrial
              water.
            calloutType: strength
            claimRefs:
              - CO005
              - CO018
              - CO019
              - CO021
          - type: callout
            title: Governance opacity is the key near-term diligence concern
            body: >-
              Public governance disclosure is thin for a company of this size. The May 2026 financing release calls
              Anurag Bajpayee Executive Chairman, while other 2025 sources still call him CEO. The board has only been
              partially disclosed, and the most material public adverse event in the record is Bajpayee’s 2025 arrest in
              the Boston brothel investigation. Even if the legal matter does not impair operations directly, it raises
              key-person, succession, and reputational-risk questions that need to be answered before an investor treats
              the company as IPO-ready.
            calloutType: risk
            claimRefs:
              - CO007
              - CO011
              - CO034
              - CO035
          - type: callout
            title: AI and semiconductor growth appear to be moving water from utility cost to strategic bottleneck
            body: >-
              Gradiant’s messaging is credible because it matches the physical reality of the end markets it targets.
              Semiconductor fabs, hyperscale data centers, pharma plants, and minerals processing sites cannot operate
              without highly reliable water sourcing, treatment, reuse, and discharge management. The company’s 2026
              financing narrative, 2025 year review, and technology pages all point to the same pattern: customers are
              buying water infrastructure not as a compliance add-on but as a core enabler of uptime, expansion, and
              sustainability.
            calloutType: insight
            claimRefs:
              - CO004
              - CO017
              - CO028
              - CO029
          - type: callout
            title: Public metrics still leave meaningful underwriting gaps
            body: >-
              The public record is good enough to establish that Gradiant is real, large, and growing, but not good
              enough to underwrite revenue quality or governance precision. The amount of the 2026 Series E is
              undisclosed in reviewed sources, headcount signals conflict, customer concentration data are missing, and
              no public cap table or audited financial statements are available. Those gaps do not negate the company’s
              strengths, but they should temper confidence in any valuation-driven investment conclusion.
            calloutType: assumption
