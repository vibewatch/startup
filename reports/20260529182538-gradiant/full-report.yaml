      - number: '3.2'
        title: Head-to-Head by Segment and Capability
        blocks:
          - type: paragraph
            body: >-
              The competitive picture sharpens once the market is split by battlefield instead of by brand name. Veolia
              is the most documented incumbent in thermal ZLD and other high-TDS brine problems because its public ZLD
              and HPD materials foreground evaporation and crystallization experience at scale. Xylem plus Evoqua looks
              strongest where industrial water treatment breadth, service intensity, and fab-adjacent credibility matter
              most. IDE is highly credible where the problem looks like desalination, industrial reuse, or a large
              turnkey project, but its public evidence reads more like project pedigree than like dense field-service
              infrastructure. Aquaporin, Membrion, and Trevi matter differently: Aquaporin looks like a membrane or
              component threat, Membrion looks like a targeted difficult-wastewater threat, and Trevi looks like a
              forward-osmosis option that still needs more proof at scale. Against that backdrop, Gradiant’s best wedge
              is not that it can out-scale the incumbents; it is that it may solve harder reuse, ZLD, and optimization
              problems faster or with better economics on selected streams.
