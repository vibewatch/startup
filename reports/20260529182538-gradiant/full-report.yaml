      - number: '8.3'
        title: Bull, base, and bear underwriting
        blocks:
          - type: paragraph
            body: |-
              The scenario frame should be explicit about what is known and what is merely implied. In the
              bull case, Gradiant’s undisclosed 2025 revenue turns out to have crossed roughly the $400
              million level, 2026 growth remains above 30%, cash conversion is solid, the cap table is
              clean, and governance noise does not impair customer or financing access. In that world, a
              valuation range modestly above the current round—roughly $2.2 billion to $3.0 billion—can be
              defended against premium industrial-water and strategic precedent lenses.

              The base case is more conservative and should carry the highest probability. It assumes the
              company is real and attractive, but still materially less transparent than top-tier public
              analogues: revenue is probably in the mid-hundreds of millions rather than the upper-hundreds,
              growth decelerates from the exceptional 2024-2025 claims, margins are positive but project-
              heavy, and round terms are ordinary rather than investor-friendly. That supports something like
              $1.4 billion to $2.0 billion, which means today’s $2 billion mark already captures much of the
              reasonable upside.

              The bear case is not a fraud case; it is a compression case. If disclosed revenue is lower than
              implied, backlog converts more slowly, cash generation is weak, round terms are punitive, or
              governance overhang deepens, the valuation can compress toward $0.8 billion to $1.3 billion.
              That asymmetry drives the recommendation. Investors should assume a four-to-six-year hold and
              underwrite to operational milestones and structured downside protection, not to a quick IPO or
              easy step-up round.
