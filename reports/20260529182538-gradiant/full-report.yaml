          disclosed
        - Upgrade if service share, margin durability, and warranty performance are disclosed
      - - Customers
        - Blue-chip customer proof and repeat-order signals reduce customer-existence risk
        - Public logos do not reveal concentration, pricing power, payment terms, or renewability
        - Upgrade if concentration, DSO, and repeat-revenue data are clean
      - - Financials
        - Orders, profitability claims, and HSBC support suggest scale and lender confidence
        - No audited 2025 revenue, cash flow, or cap-table data means the headline mark may overstate real equity value
        - Upgrade if audited financials and term sheets validate the growth story
      - - Competition
        - Xylem/Evoqua precedent and public water-tech comps show strategic assets can command premium pricing
        - >-
