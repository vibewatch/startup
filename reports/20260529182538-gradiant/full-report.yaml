      - number: '5.3'
        title: Operating Architecture and Delivery Model
        blocks:
          - type: paragraph
            body: >-
              The operating architecture that emerges from the retained sources has five layers. First is process
              characterization: Gradiant positions itself as diagnosing feedwater quality, discharge targets, and reuse
              economics before selecting a train. Second is the physical treatment layer, where membrane, biological,
              targeted-removal, oxidation, and thermal modules can be combined into bespoke trains. Third is digital
              instrumentation: SmartOps AI creates a digital twin, ingests sensor data, and uses machine learning for
              monitoring, predictive maintenance, and optimization. Fourth is field operations and chemistry support,
              where Gradiant emphasizes expert process teams, remote monitoring, and chemicals. Fifth is outcome
              assurance — reuse, compliant discharge, resource recovery, or lower total water cost. The key point is
              that SmartOps AI is not publicly framed as stand-alone SaaS disconnected from the process plant. The
              technology page explicitly ties the software to Gradiant’s systems expertise and to delivery and
              operations across global projects. The ENGIE desalination case reinforces that pattern: the software is
              deployed against a very specific plant configuration, verified against energy and recovery metrics, and
              sold as SaaS into an already operating desal facility. This architecture makes strategic sense for a
              company serving mission-critical water infrastructure, because feedback loops between plant data, process
              experts, and modular hardware are more defensible than generic dashboards. It also means diligence should
              evaluate Gradiant as a combined process-engineering, plant-operations, and software supplier rather than
              as a pure digital vendor.
