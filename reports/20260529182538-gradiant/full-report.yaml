      - number: '1.2'
        title: Founders, Leadership, and Governance Signals
        blocks:
          - type: paragraph
            body: >-
              Gradiant’s founding story remains tightly tied to MIT and to its two co-founders, Anurag Bajpayee and
              Prakash Govindan. Bajpayee is still the public face of the company, but the exact governance structure is
              less clear than a simple founder-CEO narrative suggests. Adverse and profile coverage through 2025 still
              called Bajpayee the CEO, while the official May 2026 Series E announcement referred to him as Co-Founder
              and Executive Chairman. Public company materials reviewed for this run did not explain that title shift,
              creating an unresolved question around whether day-to-day CEO authority has changed. A September 2022
              Gradiant press release clearly identified Prakash Govindan as COO and announced Govind Alagappan as
              President of Global Operations, signaling that the company had already begun to build a deeper operating
              bench. Governance disclosure remains limited, but the 2023 Series D release disclosed that Craig Huff of
              BoltRock Holdings and Mark Danchak of General Innovation Capital joined the board. That gives investors
              evidence of outside board participation, though full board composition, committee structure, and investor
              rights are not publicly laid out.
