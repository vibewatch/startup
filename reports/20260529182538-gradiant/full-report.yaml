      - number: '7.3'
        title: Operational execution, quality, and security risk
        blocks:
          - type: paragraph
            body: >-
              Operational risk is fundamental because Gradiant is not selling a low-touch software product. It is
              designing and delivering site-specific water systems where reliability, recovery, and compliance matter to
              customers’ core operations. The retained semiconductor pages say fabs require very large volumes of
              ultrapure water and cannot tolerate quality misses; Gradiant’s Taiwan and Singapore case studies emphasize
              resilient designs, high recovery, limited-footprint constraints, and high-variability wastewater. Those
              are credible proof points, but they also reveal why scaling is hard. The company now cites repeat
              semiconductor work in Dresden and Italy, plus PFAS work at Munich Airport, which means execution risk
              spans multiple jurisdictions, feedwater profiles, construction environments, and customer acceptance
              criteria. Public materials also show AI-enabled treatment and optimization claims, but they do not
              disclose cyber certifications, OT segmentation, or incident history for digitally enabled systems. That
              does not prove a cyber weakness; it means diligence must not assume mature controls just because the
              public narrative emphasizes AI and mission-critical reliability.
