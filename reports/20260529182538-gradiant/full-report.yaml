            body: >-
              Gradiant’s customer base is best segmented by vertical, use case, and geography rather than by a single
              headline customer count. The company sells into water-intensive industrial operators whose plants cannot
              afford water quality failures, compliance misses, or supply interruptions. Public industry pages cluster
              the base around semiconductors, food and beverage, pharmaceuticals, mining, refining and chemicals, and
              energy. The buyer and payer are usually the plant owner or operating company, while the day-to-day users
              are engineering, utility, water, and operations teams that have to keep the site running and compliant.
              Geography matters as well. Public customer proof spans Taiwan, Singapore, Germany, Italy, Western
              Australia, India, Munich, and the United States, which suggests Gradiant wins where water stress,
              discharge standards, and mission-critical production intersect. The strongest public concentration is in
              semiconductors, but the broader segmentation frame is still site-water complexity, not a published
