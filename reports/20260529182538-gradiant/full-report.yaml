      - number: '5.4'
        title: Differentiation and Public Proof Points
        blocks:
          - type: paragraph
            body: >-
              Gradiant’s clearest public differentiation comes from four areas. First, RO Infinity and Carrier Gas
              Extraction both claim materially lower cost than conventional thermal concentration, giving Gradiant a
              credible story in high-recovery, MLD, and ZLD workflows where total water cost dominates plant decisions.
              Second, SmartOps AI gives the company a digitally enabled operating model that is attached to real
              facilities instead of being marketed as a detached analytics overlay; the published ENGIE case provides at
              least one quantified proof point. Third, ForeverGone is being positioned as a stronger
              application-specific wedge than generic PFAS treatment because it promises not only removal but
              destruction of PFAS concentrate on site. Fourth, alkaLi shows how Gradiant is trying to repackage its
              membrane and controls know-how into a vertically branded solution for lithium producers. Third-party
              coverage broadly supports the breadth story even if it does not fully validate every operating claim. MIT
              News reports more than 2,500 end-to-end systems and names blue-chip industrial customers. Global Water
              Awards explicitly called out Turing, lithium production, PFAS elimination, and supercritical water
              oxidation when giving Gradiant a 2024 distinction. PFAS-specific trade coverage describes micro-foam
              fractionation plus electrooxidation, 99–99.9% removal, a low claimed operating-cost band, and a Munich
              International Airport deployment. The evidence is therefore directionally strong on breadth and
              application ambition, but still thinner than ideal on neutral case studies, named customer references, and
              fleet-level reliability data.
