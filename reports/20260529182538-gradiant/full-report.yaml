      - number: '3.4'
        title: Moat Durability and Investment Implications
        blocks:
          - type: paragraph
            body: >-
              The investment takeaway is that Gradiant does not need to beat every rival everywhere, but it does need to
              win in the water problems where differentiated process design matters more than incumbent comfort.
              Veolia’s moat is deepest where installed thermal and ZLD references dominate procurement. Xylem and
              Evoqua’s moat is deepest where service density, aftermarket presence, and listed-company trust matter
              most. IDE is the project-led incumbent that can crowd Gradiant in desalination and large reuse situations.
              The early challengers are not yet the main commercial threat on volume, but they matter because they can
              narrow module-level differentiation or become acquisition targets for bigger incumbents. The biggest
              structural threat remains the status quo: EPCs, discharge, and conventional designs. That means Gradiant’s
              moat case depends on proving lower total cost or better recovery on hard streams, while also proving that
              customers can trust the company with mission-critical uptime. Technology without trust will not be enough;
              trust without technology will usually favor the incumbent.
