        title: Unit Economics, Cost Drivers, and Proxy Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Unit economics here should be framed as industrial-water project economics, not SaaS shorthand. SmartOps
              and OARO give the best public hints at value capture: SmartOps is sold as remote monitoring, predictive
              maintenance, and lower labor or OPEX, while the desalination case study reports up to 5% energy savings at
              a plant above 200,000 m3/day and explicitly labels the delivery model as SaaS. The OARO and CFRO material
              argues Gradiant can push recovery higher and cut downstream ZLD cost. Those are strong value propositions,
              but they are not disclosed gross margins. Public incumbents are the best proxy. Xylem’s 2025 10-K
              explicitly says its installed base supports steady parts, replacement, and service revenue, while also
              warning that large water projects carry cost-overrun and performance-guarantee risk. Veolia’s 2025
              disclosures show that scaled water-technology businesses can grow EBITDA faster than revenue when the mix
              shifts toward higher-value solutions and services. Gradiant may be moving that way, but the public
              evidence is still directional rather than conclusive.
