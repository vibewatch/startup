      - number: '7.4'
        title: Partner, dependency, and people risk
        blocks:
          - type: paragraph
            body: >-
              Gradiant’s dependence profile is not just about suppliers; it is about the institutions and local
              capability layers that allow projects to close and deliver. Official and trade coverage say the company
              closed a $50 million HSBC corporate facility and now has more than $100 million of total credit capacity,
              which is a meaningful mitigation for working-capital swings but also a reminder that project execution
              still leans on lender confidence. Public growth proof is similarly concentrated in a few channels:
              semiconductors, advanced manufacturing, mining partnerships, and PFAS remediation. The mining evidence
              itself is partner-linked, with SLB and Rio Tinto named in the public release. At the same time, the H+E
              and WaterPark acquisitions show that Gradiant relies on acquired engineering depth and installed-base
              access in Europe and Taiwan. On the people side, the 2022 operations-hire announcement is a real
              mitigating signal, but the current public board map, full executive bench, and succession design remain
              under-disclosed. The result is a company that appears capable and connected, yet still more dependent on
              specific counterparties, acquired local teams, and leadership credibility than a more standardized
              infrastructure platform would be.
