      - number: '4.4'
        title: Underwriting Gaps and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              For underwriting, four conclusions survive the evidence. First, Gradiant appears to have real commercial
              momentum and credible profitability signals, but those signals remain company-claimed rather than audited.
              Second, revenue quality is probably hybrid: project-led and therefore lumpy, with a credible but still
              unquantified recurring tail from O&M, SmartOps, and chemicals. Third, capital intensity is real.
              Regulatory permitting, performance guarantees, long deployments, and receivables-backed borrowing all push
              the model much closer to industrial project finance than to asset-light software. Fourth, the diligence
              blockers remain material. Without audited revenue, gross margin, EBITDA, cash, burn, ARR or recurring mix,
              customer concentration, and exact Series E proceeds, an investor can underwrite direction and strategic
              fit, but not a clean downside case. The next step is a management data room that bridges backlog,
              conversion, working capital, and margin by revenue stream rather than more narrative growth claims.
              Management should also reconcile backlog quality, collections cadence, and guarantee exposure in one
              package.
