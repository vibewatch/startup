      - number: '5.2'
        title: Module Portfolio by Job To Be Done
        blocks:
          - type: paragraph
            body: >-
              The public module set is broad but still coherent when mapped to customer jobs. RO Infinity is the
              membrane-heavy platform for desalination, brine concentration, brine mining, and high-recovery front ends
              to MLD or ZLD systems. Bio Infinity covers high-rate biological treatment for nutrient and
              biodegradable-organics removal, especially where industrial wastewater flows vary and discharge limits are
              stringent. Selective Contaminant Extraction handles targeted physical and chemical removal or recovery of
              specific compounds and ions, while Carrier Gas Extraction and Free Radical Oxidation extend the platform
              into thermal concentration and advanced oxidation for the hardest high-salinity or high-COD streams.
              SmartOps AI sits above the physical plant as the digital operating layer, and the newer branded offers —
              ForeverGone for PFAS and alkaLi for battery-grade lithium — package multiple unit operations into
              higher-value application-specific solutions. Public evidence suggests these modules are not random menu
              items. The wastewater, process-water, lithium, and ultrapure-water pages repeatedly point to the same
              underlying technology families, implying that Gradiant reuses a core toolkit across many sectors. That
              reuse is strategically important because it lets the company sell toward multiple water outcomes —
              source-water production, process-water polishing, wastewater treatment, reuse, resource recovery, and
              discharge minimization — without needing a wholly separate architecture for each vertical. The open
              question is not whether modules exist; it is how repeatable and referenceable the cross-module
              implementation playbook is beyond selected marketing pages and case studies.
