        - id: design-layer
          label: Process Engineering Layer
          detail: >-
            Feed characterization, mass-balance design, permit target translation, and module selection turn the site
            problem into a treatment train.
        - id: treatment-layer
          label: Treatment Module Layer
          detail: >-
            RO Infinity, Bio Infinity, SCE, CGE, FRO, UPW packages, ForeverGone, and alkaLi combine as needed for the
