  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Customer Workflow Definition
        blocks:
          - type: paragraph
            body: >-
              Gradiant’s product definition is best understood through the customer workflow rather than through any one
              branded technology page. The company starts with source and process water production for industrial sites,
              then follows the plant through wastewater treatment, water reuse, discharge minimization, PFAS
              remediation, and resource recovery. That framing matters because buyers in semiconductors, pharma, mining,
              food, lithium, and data centers rarely purchase a single isolated unit operation; they are usually buying
              a way to secure water supply, protect production yield, reduce freshwater withdrawals, and keep discharge
              or disposal risk inside permit limits. The public solution pages consistently describe modular treatment
              trains that can be configured differently depending on whether the user needs ultrapure water, industrial
              process water, complex wastewater recycling, lithium recovery, or site-wide water strategy for AI
              infrastructure. This workflow framing also explains why Gradiant keeps presenting digital optimization,
              chemicals, and engineering services alongside treatment modules. In the data-center announcement, the
              company pitches ZLD recovery and reuse, SmartOps AI optimization, and CURE Chemicals as one site-wide
              package. MIT News likewise describes Gradiant as an end-to-end water company that combines chemical,
              membrane, and biological treatment for mission-critical customers. That does not prove every deployment
              uses the full stack, but it does support the operating-model thesis: Gradiant is trying to own the
              plant-level water problem from feed characterization through reuse or compliant discharge.
            claimRefs:
