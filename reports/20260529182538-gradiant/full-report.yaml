      - number: '1.3'
        title: Funding History, Capital Formation, and Investor Base
        blocks:
          - type: paragraph
            body: >-
              Gradiant’s capital history shows a company graduating from venture-backed cleantech startup to a more
              mature project-execution platform with both equity and lender support. In November 2021 the company
              announced an oversubscribed Series C of more than $100 million led by Warburg Pincus and Schlumberger New
              Energy, taking total funding since inception above $200 million. In May 2023 it raised $225 million in the
              first close of a Series D led by BoltRock Holdings and Centaurus Capital, lifting total funding above $400
              million and establishing the company’s first public $1 billion valuation. In October 2025 Gradiant closed
              a $50 million revolving corporate facility with HSBC and said total credit capacity now exceeded $100
              million, explicitly framing the facility as evidence of profitability and lender confidence. The next
              major step came in May 2026, when Gradiant announced a Series E at a $2 billion valuation led by Safar
              Partners and Hostplus Superannuation Fund, with ClearVision Ventures participating. Reviewed public
              materials confirm the valuation and strategic purpose of the round, but they do not disclose the Series E
              dollar amount; that omission remains a live diligence gap.
