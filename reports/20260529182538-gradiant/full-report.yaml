      - number: '6.4'
        title: Retention, repeat usage, and disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              Durability is the weakest part of the public customer record. No retained source discloses NRR, GRR, logo
              churn, renewal rate, active customer count, average contract duration, or top-account concentration. That
              means the chapter has to rely on repeat-usage proxies instead of true portfolio retention data. The best
              proxies are the official 2024 statement that returning customers are adopting more Gradiant solutions, the
              Taiwan semiconductor case’s follow-on fab collaboration, and the repeated semiconductor wins in Dresden
              and Italy. Those signals matter because they imply land-and-expand behavior and some level of
              referenceability in mission-critical environments. Still, they are not substitutes for account-level
              cohorts. Public customer-satisfaction disclosure is also thin. No NPS, support SLA, or complaint-rate data
              were retrieved. The main adverse public signal is the 2025 CEO scandal, which is not the same thing as
              customer churn but could create procurement friction for regulated or reputation-sensitive buyers. The
              chapter can therefore describe durability only as proxy-level, not as institutionally underwritten
              retention.
