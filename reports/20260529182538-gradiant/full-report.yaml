        - Revenue, gross margin, EBITDA or operating income, and operating cash flow
        - Determines whether the current round is fair, stretched, or actually attractive
        - 'Finance room: audited statements plus monthly bridge'
      - - Backlog quality
        - Backlog aging, milestone schedule, cancellation history, and order-to-revenue bridge
        - Separates healthy growth from deferred or low-quality project volume
        - CRO / CFO review of top twenty projects
      - - Revenue mix
        - Recurring-service share, project share, and any ARR-like components
        - Determines whether Ecolab-like premium or Xylem-like midpoint framing is appropriate
        - Segment deck plus cohort analysis
      - - Customer concentration and collections
        - Top-10 accounts, DSO, receivables aging, and dispute history
        - Hidden concentration or slow cash collection can compress equity value quickly
        - Controller package and top-account drilldown
      - - Series E terms
        - Round size, cap table, preferences, anti-dilution, and investor rights
        - Real entry economics can differ sharply from the headline valuation
        - Counsel and financing documents
      - - Governance remediation
        - Founder case status, board response, delegated authority, and reputational controls
        - Needed to judge exit readiness and downside multiple risk
        - Board materials, counsel memo, and governance interviews
    notes: >-
      These asks are the minimum set required to move from public-market triangulation to true underwriting. Until they
      are answered, the $2 billion mark should be treated as a negotiable anchor rather than a validated fair value.
    claimRefs:
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
      - CV026
      - CV061
