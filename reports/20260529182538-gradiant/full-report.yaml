chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Mission, and Product Scope
        blocks:
          - type: paragraph
            body: >-
              Gradiant is a privately held industrial water technology company headquartered in the Boston,
              Massachusetts area, with public profiles pointing specifically to Woburn as its operating base. The
              company says it was founded at MIT and positions itself as a “different kind of water company” built
              around end-to-end solutions rather than a single process skid or software module. Its offering spans
              treatment of contaminated wastewater, production of ultrapure process water, resource recovery, brine
              concentration, minimum and zero liquid discharge, and plant-level digital optimization. The company frames
              its value proposition as helping heavy industrial customers reduce freshwater withdrawal, reclaim valuable
              materials, renew wastewater into freshwater, and operate with lower energy intensity. Public materials
              consistently show that Gradiant’s commercial focus sits in water-intensive sectors where uptime and water
              quality are mission critical: semiconductors and data centers, food and beverage, pharmaceuticals, mining
              and critical minerals, energy, petrochemicals, renewables, and selected government infrastructure work.
              The technology page shows that the company is no longer just a desalination specialist; it now markets a
              broad stack that includes RO Infinity with patented CFRO, Bio Infinity, SmartOps AI, and other in-house
              platforms.
