  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: standard
    summary: >-
      Industrial customers move from water-stress diagnosis to plant deployment and only then to repeat scope, which is
      why Gradiant’s customer motion looks operational and engineering-led rather than purely commercial.
    data:
      items:
        - stage: Water-risk trigger
          actors:
            - Plant leadership
            - EHS / utilities
            - Procurement
          touchpoints:
            - Water stress or discharge limit
            - Capex review
            - Reference screening
          emotion: Urgency around reliability, compliance, and production continuity
          label: Water-risk trigger
        - stage: Design basis / validation
          actors:
            - Plant engineering
            - Water team
            - Gradiant process experts
          touchpoints:
            - Bench testing
            - Pilot or design basis
            - Solution scoping
          emotion: Buyer wants proof that the flowsheet can handle exact site chemistry
          label: Design basis / validation
        - stage: Design-build deployment
          actors:
            - Project delivery team
            - Site operations
            - Commissioning staff
          touchpoints:
            - Contract award
            - Commissioning
            - Training and handover
          emotion: Trust rises when the plant comes online without disrupting production
          label: Design-build deployment
        - stage: Operate / expand
          actors:
            - Site operators
            - Digital / chemistry support
            - Regional account leadership
          touchpoints:
            - SmartOps optimization
            - Repeat project
            - Second site or adjacent use case
          emotion: Expansion depends on outcome visibility and referenceability more than on logo value alone
          label: Operate / expand
    claimRefs:
      - CU003
      - CU004
      - CU039
      - CU042
      - CU044
  - id: FU002
    title: Adoption / deployment funnel
    type: flow
    layout: standard
    summary: >-
      The deployment funnel starts with a site-specific water pain point, runs through validation and design-build
      execution, and expands only after the first plant or scope proves itself.
    data:
      nodes:
        - id: pain-point
          label: Water pain point
          detail: A fab, plant, airport, or mining site faces water scarcity, discharge pressure, or contamination risk.
        - id: validate
          label: Validate chemistry
          detail: >-
            Bench, pilot, or engineering studies confirm the proposed treatment train against site-specific water
            quality.
        - id: award
          label: Award project
          detail: Customer signs a design-build, design-build-operate, or technology-integration contract.
        - id: commission
          label: Commission plant
          detail: The first site goes online with operator training, optimization, and compliance monitoring.
        - id: optimize
          label: Optimize / support
          detail: SmartOps, chemistry, and process support improve recovery, uptime, or cost outcomes.
        - id: expand
          label: Repeat / expand
          detail: Customer adds adjacent scopes, another fab, or a broader site-wide water program.
      edges:
        - from: pain-point
          to: validate
          label: Mission-critical water pain must be proven solvable
        - from: validate
          to: award
          label: Customer commits once site chemistry and economics are credible
        - from: award
          to: commission
          label: Project delivery converts a reference into a live site
        - from: commission
          to: optimize
          label: Outcome proof and operations support deepen trust
        - from: optimize
          to: expand
          label: Repeat scope comes from new use cases, sites, or technologies
    claimRefs:
      - CU013
      - CU014
      - CU017
      - CU018
      - CU019
      - CU020
      - CU039
      - CU042
