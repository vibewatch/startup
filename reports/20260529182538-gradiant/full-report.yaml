            body: >-
              The clearest hard financial evidence is on capital needs. Gradiant’s October 2025 HSBC facility was
              structured as a $50 million corporate revolver for working capital and project execution, with total
              credit capacity above $100 million and receivables from blue-chip customers cited as support. That is
              exactly what one would expect from a company carrying large, site-specific projects, milestone
              receivables, procurement commitments, and performance obligations across regions. Earlier financing
              reinforces the same picture: 2021 Series C was partly for project-level financing and flexible DB or O&M
              models; 2023 Series D funded expansion and R&D; and 2026 Series E at a $2 billion valuation is earmarked
              for acquisitions, R&D, operating scale, and IPO readiness. The missing piece is liquidity transparency.
              Public sources do not disclose cash on hand, monthly burn, debt draw, DSO, backlog conversion speed, or
              the exact amount raised in Series E, so adequacy can be inferred only directionally.
