        - Potentially highest-quality mix element but scale is unknown
        - Show SmartOps bookings, recurring revenue, attach rate, and churn
      - - CURE Chemicals
        - In-house treatment chemicals and conditioning programs
        - Recurring consumables and program contracts
        - Product family is public; pricing and mix are not
        - Could improve repeat revenue and margin if attached to installed base
