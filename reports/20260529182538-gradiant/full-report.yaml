      - number: '7.5'
        title: Financial/model risk, mitigations, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Financial/model risk is elevated mainly because public momentum signals are stronger than public unit
              economics. Series E at a $2 billion valuation, a profitability-tinged HSBC announcement, and more than
              $500 million of H1 2024 orders all point to real commercial traction. None of them, however, substitutes
              for audited revenue quality, gross margin durability, collections, covenant headroom, backlog conversion,
              or customer concentration disclosure. In a project-heavy business, those hidden variables matter. Orders
              can slip, working capital can absorb cash before milestone payments arrive, and concentration can hide
              inside a blue-chip logo list. Demand concentration also appears real: the public corpus repeatedly centers
              semiconductors, advanced manufacturing, AI infrastructure, and a small set of large industrial names. That
              is not automatically negative, but it means the underwriting case depends on whether Gradiant can keep
              winning complex projects without stretching the balance sheet or becoming too reliant on a narrow band of
              sectors and counterparties. The right investment frame is therefore conditional: acknowledge the real
              mitigants, but treat board remediation, top-account mix, DSO, covenant terms, warranty claims, and
              post-acquisition execution metrics as explicit thesis-gates rather than as assumed strengths.
