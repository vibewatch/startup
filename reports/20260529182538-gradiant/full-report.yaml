  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and Threat Hierarchy
        blocks:
          - type: paragraph
            body: >-
              Gradiant competes in a water market where the relevant alternatives are not all the same shape. The
              cleanest framing is four layers. First are the scale incumbents: Veolia Water Technologies and Xylem after
              Evoqua, both of which bring public-company or conglomerate scale, long operating histories, and deep
              industrial references. Second is IDE Technologies, which is not as route-dense as those players but is
              highly credible in desalination, reuse, and other large project-led water systems. Third are early
              challengers such as Aquaporin, Membrion, and Trevi. Those companies matter because they point toward
              future technology displacement, but the reviewed evidence still makes them look more like component,
              pilot, or niche-process challengers than full-stack competitors to a company trying to own plant-level
              accountability. Fourth is the substitute layer: buyers can still choose Jacobs, AECOM, other engineering
              partners, or a conventional discharge-centered design rather than an integrated Gradiant-style platform.
              That substitute layer matters most by volume because many industrial operators default to the known
              procurement path before they default to a new specialist vendor.
