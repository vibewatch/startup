companyProfile:
  summary: >-
    Gradiant is a private industrial water technology company founded at MIT in 2013 by Anurag Bajpayee and Prakash
    Govindan. The company designs and operates advanced water, wastewater, reuse, zero-liquid-discharge, PFAS, and
    digital optimization systems for water-intensive industrial customers. Its strongest public growth narrative is
    concentrated in semiconductors, AI data centers, pharmaceuticals, food and beverage, mining, and energy. Public
    evidence confirms a financing step-up from a 2023 $1B valuation to a May 2026 Series E at a $2B valuation, but the
    business remains financially opaque despite company-claimed 2025 profitability and 50%+ growth.
