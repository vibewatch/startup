company:
  name: Gradiant
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Gradiant is a Boston-area industrial water technology company founded at MIT in 2013 by
    Anurag Bajpayee and Prakash Govindan. It has evolved from a desalination spinout into a
    global provider of advanced water, wastewater, reuse, zero-liquid-discharge, and AI-enabled
    operating systems for semiconductor, pharma, data-center, food, mining, and energy customers.
    Public evidence confirms a step-up in financing from a 2021 $100M+ Series C to a 2023 $225M
    Series D at a $1B valuation, followed by a 2025 $50M HSBC credit facility and a May 2026
    Series E at a $2B valuation. The core strengths are differentiated technology and profitable
    growth momentum, while the biggest open issues are governance opacity, inconsistent public
    headcount signals, and reputational risk from the 2025 CEO legal scandal.
sections:
  - id: identity-and-business-model
    title: Identity, Mission, and Product Scope
    body: >-
      Gradiant is a privately held industrial water technology company headquartered in the Boston,
      Massachusetts area, with public profiles pointing specifically to Woburn as its operating
      base. The company says it was founded at MIT and positions itself as a “different kind of
      water company” built around end-to-end solutions rather than a single process skid or
      software module. Its offering spans treatment of contaminated wastewater, production of
      ultrapure process water, resource recovery, brine concentration, minimum and zero liquid
      discharge, and plant-level digital optimization. The company frames its value proposition as
      helping heavy industrial customers reduce freshwater withdrawal, reclaim valuable materials,
      renew wastewater into freshwater, and operate with lower energy intensity. Public materials
      consistently show that Gradiant’s commercial focus sits in water-intensive sectors where
      uptime and water quality are mission critical: semiconductors and data centers, food and
      beverage, pharmaceuticals, mining and critical minerals, energy, petrochemicals, renewables,
      and selected government infrastructure work. The technology page shows that the company is no
      longer just a desalination specialist; it now markets a broad stack that includes RO Infinity
      with patented CFRO, Bio Infinity, SmartOps AI, and other in-house platforms.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO031
    tableRefs:
      - TO001
    figureRefs:
      - FO002
  - id: founders-leadership-and-governance
    title: Founders, Leadership, and Governance Signals
    body: >-
      Gradiant’s founding story remains tightly tied to MIT and to its two co-founders, Anurag
      Bajpayee and Prakash Govindan. Bajpayee is still the public face of the company, but the
      exact governance structure is less clear than a simple founder-CEO narrative suggests.
      Adverse and profile coverage through 2025 still called Bajpayee the CEO, while the official
      May 2026 Series E announcement referred to him as Co-Founder and Executive Chairman. Public
      company materials reviewed for this run did not explain that title shift, creating an
      unresolved question around whether day-to-day CEO authority has changed. A September 2022
      Gradiant press release clearly identified Prakash Govindan as COO and announced Govind
      Alagappan as President of Global Operations, signaling that the company had already begun to
      build a deeper operating bench. Governance disclosure remains limited, but the 2023 Series D
      release disclosed that Craig Huff of BoltRock Holdings and Mark Danchak of General Innovation
      Capital joined the board. That gives investors evidence of outside board participation,
      though full board composition, committee structure, and investor rights are not publicly laid
      out.
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO010
      - CO011
      - CO012
      - CO013
    tableRefs:
      - TO002
  - id: capital-formation-and-investor-base
    title: Funding History, Capital Formation, and Investor Base
    body: >-
      Gradiant’s capital history shows a company graduating from venture-backed cleantech startup to
      a more mature project-execution platform with both equity and lender support. In November
      2021 the company announced an oversubscribed Series C of more than $100 million led by
      Warburg Pincus and Schlumberger New Energy, taking total funding since inception above $200
      million. In May 2023 it raised $225 million in the first close of a Series D led by BoltRock
      Holdings and Centaurus Capital, lifting total funding above $400 million and establishing the
      company’s first public $1 billion valuation. In October 2025 Gradiant closed a $50 million
      revolving corporate facility with HSBC and said total credit capacity now exceeded $100
      million, explicitly framing the facility as evidence of profitability and lender confidence.
      The next major step came in May 2026, when Gradiant announced a Series E at a $2 billion
      valuation led by Safar Partners and Hostplus Superannuation Fund, with ClearVision Ventures
      participating. Reviewed public materials confirm the valuation and strategic purpose of the
      round, but they do not disclose the Series E dollar amount; that omission remains a live
      diligence gap.
    claimRefs:
      - CO014
      - CO015
      - CO016
      - CO017
      - CO018
