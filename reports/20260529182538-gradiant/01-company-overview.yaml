      - TO003
    figureRefs:
      - FO003
  - id: scale-footprint-and-commercial-momentum
    title: Scale, Footprint, and Commercial Momentum
    body: >-
      By 2025-2026, Gradiant appears to have reached meaningful global scale even though the exact
      operating footprint remains somewhat noisy across public datasets. Official and third-party
      sources all point to a Boston/Woburn headquarters and a globally distributed organization, but
      the reported headcount ranges from 501-1,000 employees on ContactOut to more than 1,300 on a
      2022 company release and 1K-5K on ZoomInfo. Craft lists eight office locations, including
      Woburn and multiple U.S., India, China, and Singapore addresses, which is directionally
      consistent with management’s repeated claims of a cross-regional operating model. The 2025
      year-in-review post is the strongest public operating disclosure: Gradiant said revenue grew
      more than 50 percent versus 2024, new orders exceeded $500 million, profitability increased
      fourfold, and regional revenue mix was diversified across the United States, Europe, the
      Middle East, and Indo-Pacific. That same review and the 2026 Series E announcement both point
      to strong demand in semiconductors, data centers, PFAS remediation, lithium recovery, and
      other industrial applications, suggesting the company is no longer dependent on a single end
      market.
    claimRefs:
      - CO022
      - CO023
      - CO024
      - CO025
