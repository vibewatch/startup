  - id: milestones-reputation-and-key-open-questions
    title: Milestones, Reputational Risk, and Key Open Questions
    body: >-
      The milestone record supports the view that Gradiant has built real commercial depth rather
      than hype-only climate-tech visibility. Public releases show it expanding from a 2021 growth
      round and Antarctic desalination work into a 2022 operating-team buildout, a 2023 unicorn
      valuation, a 2025 profit-and-orders acceleration, and a 2026 financing framed around AI,
      semiconductors, and IPO readiness. Third-party and company sources also tie Gradiant to a
      blue-chip customer set that includes Coca-Cola, TSMC, Micron, GSK, Pfizer, SLB, Rio Tinto,
      and AB InBev. The most material adverse signal in the reviewed record is not an operating
      failure but a governance and reputational one: multiple 2025 articles reported Bajpayee’s
      arrest in the Boston luxury-brothel investigation, while NewsBytes and IndiaWest quoted the
      company defending him and stating confidence in the justice system. I did not find public EPA,
      OSHA, or product-safety enforcement against Gradiant in the sources reviewed, but the lack of
      transparent board disclosure, the unexplained Executive Chairman title change, and the absence
      of audited financial disclosure mean investors still need follow-up diligence before treating
      the company’s growth narrative as fully de-risked.
    claimRefs:
      - CO011
      - CO030
      - CO032
      - CO033
      - CO034
      - CO035
      - CO036
    tableRefs:
      - TO004
