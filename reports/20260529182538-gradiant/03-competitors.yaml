- id: pricing-switching-costs-and-substitutes
  title: Pricing, Switching Costs, and Substitute Paths
  body: Public pricing is the weakest part of the competitive record. None of the major full-system players publish enough list-pricing detail to support a fake-precision comparison, which is why the most honest packaging view is contractual rather than numeric. Veolia, Xylem, IDE, Jacobs, AECOM, and Gradiant all appear to sell combinations of engineered systems, equipment, commissioning, and operating support, with economics shaped by site complexity rather than by a published catalog. That matters because the substitute path can look deceptively cheap. A buyer can continue discharging under permit, add conventional equipment through an EPC, or avoid deeper reuse and ZLD redesign. But once a plant is permitted and commissioned, switching costs rise quickly because permits, operator know-how, spare parts, and production qualification become sunk. This is why the hardest sales job for Gradiant is often not beating Aquaporin or Trevi; it is convincing buyers to move away from the trusted incumbent
    or the known engineering path in the first place.
