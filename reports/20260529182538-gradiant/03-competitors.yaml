- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or risk
  - Primary threat
  - Severity
  - Why it matters
  - Mitigation / diligence ask
  rows:
  - - Gradiant hard-problem process edge
    - Incumbents can neutralize the narrative if TCO proof is weak
    - High
    - The investment case depends on proving real recovery, energy, or uptime advantages on the hardest streams
    - Demand reference-plant operating data and side-by-side customer evidence
  - - Veolia installed thermal and ZLD references
    - Specialists attack energy and total-cost economics on hard brines
    - Medium to high
    - Veolia is strongest where buyers want proven scale, but those same projects create room for efficiency-based displacement
    - Test retrofit and new-build economics on high-TDS reference cases
  - - Xylem / Evoqua service density and trust
    - Gradiant wins only where differentiation outweighs route density
    - High
    - Buyers in uptime-sensitive settings often favor service response and procurement familiarity over novelty
    - Map service coverage, spares access, and fab-reference quality during diligence
  - - IDE mega-project pedigree
    - IDE expands industrial overlap in desalination-led procurements
    - Medium
    - Project buyers may prefer a mega-project incumbent even if Gradiant’s specialist process story is stronger
    - Segment pipeline by geography and project archetype rather than by generic market share
  - - Early challengers as acquisition or partner risks
    - Bigger incumbents can absorb niche process innovation
    - Medium
    - Component breakthroughs can erode module-level differentiation without those startups becoming full rivals alone
    - Track partnerships, licensing, and acquisition activity around niche membrane and FO players
  - - Status-quo EPC and discharge path
    - First-cost familiarity and permit continuity keep buyers on the known path
    - Very high
    - The main threat is that buyers do nothing new and still clear immediate compliance or capacity hurdles
    - Quantify lifecycle TCO versus discharge, hauling, or conventional EPC before underwriting share gains
  notes: Severity is an underwriting judgment about practical competitive danger, not a quantified loss forecast. Each row is grounded in the public evidence and the places where public evidence still stops short.
