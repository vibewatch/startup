- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor class
  - Public pricing visibility
  - Usual contract model
  - Included capabilities
  - Evidence gap / implication
  rows:
  - - Gradiant
    - Low
    - Integrated project, commissioning, operating support, and digital overlay
    - Hard-problem treatment, reuse, ZLD, optimization
    - Public proof is strong on capability narrative and weak on realized pricing, so premium economics still need customer validation
  - - Veolia WTS
    - Low
    - Equipment, EPC, long-term O&M, and industrial process support
    - Thermal ZLD, wastewater, industrial water technologies, global service
    - Scale may support aggressive bundling, but public list pricing is not disclosed
  - - Xylem / Evoqua
    - Low
    - Equipment, service, aftermarket, and public-company water-solutions platform
    - Industrial treatment, services, monitoring, and acquired Evoqua capabilities
    - Service-heavy economics are directionally clear, but exact package pricing still is not
  - - IDE Technologies
    - Low
    - Turnkey project, desalination, industrial reuse, and selected long-duration project structures
    - Desalination, industrial wastewater, reuse, project delivery
    - Project pedigree is visible while exact commercial terms are not
  - - Aquaporin / Membrion / Trevi
    - Low to medium for pilot scope, low for scale scope
    - Module, pilot, OEM, or focused project engagements
    - Component technology, niche process improvement, or pilots
    - These players may be easier to pilot than to trust for full-plant accountability
  - - Jacobs / AECOM / internal build
    - Low
    - Engineering scope plus commodity equipment and compliance-driven infrastructure work
    - Design, delivery, and integration of conventional systems
    - Can appear cheaper on first pass because buyers already understand the scope and permitting path
  notes: The public record does not support fabricated price precision. The comparison therefore focuses on contract shape, bundling logic, and what remains unknowable without customer or bid-level data.
