  - type: missing-source
    severity: material
    topic: veolia-standalone-revenue
    missingEvidence: A clean standalone revenue breakout for Veolia Water Technologies and Solutions in the current period.
    whyItMatters: Without a direct segment revenue line, Veolia’s competitive scale can only be triangulated through group-level materials and technology pages.
    diligencePath: Request the latest segment bridge or management commentary that isolates Water Technologies and Solutions from broader Veolia reporting.
    relatedQuestionRefs:
    - QP023
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: installed-base-share
    missingEvidence: Public win-rate, installed-base share, and fab-by-fab penetration data for Gradiant versus Veolia or Xylem.
    whyItMatters: This is the key missing dataset for underwriting whether Gradiant is truly displacing incumbents or only winning net-new hard cases.
    diligencePath: Request customer reference lists, live-site cohort data, or pipeline by incumbent-displacement versus greenfield projects.
    relatedQuestionRefs:
    - QP024
    relatedTableRefs:
    - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Signed contract values, realized pricing, and side-by-side TCO benchmarks across Gradiant and its main incumbents.
    whyItMatters: The pricing section can compare packaging logic, but not actual economic edge, without bid data or operating-cost proofs.
    diligencePath: Collect recent customer proposals, retrofit economics, disposal costs, and O&M assumptions for at least three reference cases.
    relatedQuestionRefs:
    - QP017
    - QP025
    relatedTableRefs:
    - TP003
