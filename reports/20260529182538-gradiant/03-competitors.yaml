tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding proxy
  - Target segment(s)
  - Differentiation
  - Limitation
  rows:
  - - Veolia Water Technologies
    - Scale incumbent
    - Part of a large public industrial and environmental group; HPD page cites 1,000+ installations in 30+ countries
    - Industrial water, ZLD, wastewater, high-TDS brine, global process industries
    - Thermal evaporation and crystallization depth plus broad industrial references
    - Standalone VWT&S revenue is not cleanly broken out publicly and the stack can look legacy-heavy versus specialist challengers
  - - Xylem / Evoqua
    - Scale incumbent
    - Acquisition thesis cited about $7B combined revenues and continuing public-company reporting
    - Industrial treatment, service-heavy water operations, fab-adjacent and PFAS-relevant programs
    - Installed-base trust, public-company scale, service and aftermarket depth
    - Breadth can dilute focus and public evidence is stronger on scale than on differentiated hard-stream economics
  - - IDE Technologies
    - Project / desalination incumbent
    - Private but long-lived platform with 60+ years of water-treatment experience and large reference projects
    - Desalination, industrial reuse, wastewater, turnkey water projects
    - Mega-project credibility and desalination pedigree
    - Less public evidence of dense route-based service coverage than Veolia or Xylem
  - - Aquaporin
    - Component challenger
    - Public membrane specialist with active investor-relations surface
    - Membrane and filtration applications through OEM or integrator channels
    - Biomimetic membrane science and optionality at the component layer
    - Little public proof of turnkey plant delivery or broad O&M accountability
  - - Membrion
    - Niche challenger
    - Venture-backed difficult-wastewater specialist
    - PFAS-adjacent, semiconductor, mining, dissolved-metals and salts streams
    - ECD ceramic approach for difficult industrial wastewater and recovery use cases
    - Early commercialization and narrow scope versus full-system incumbents
  - - Trevi Systems
    - Early-stage challenger
    - Pilot-oriented forward-osmosis company with a DOE-backed Hawaii project on the public site
    - Seawater desalination, remote water, high-salinity and pilot-scale projects
    - Forward-osmosis and renewable-desalination narrative
    - Public proof still centers on pilots and case studies, not a large installed fleet
  - - Jacobs / AECOM / internal build
    - Status-quo substitute
    - Global engineering substitutes with broad water practices and familiar procurement motion
    - Conventional compliance systems, wastewater, reuse, desalination, internal-build projects
    - Trusted engineering path and less perceived career risk for buyers
    - Usually less differentiated on reuse, ZLD, and AI-led optimization than a specialist platform
  notes: Pricing, revenue, and funding details are only listed where public evidence is explicit. Missing standalone revenue or contract values are preserved as evidence gaps instead of estimated.
