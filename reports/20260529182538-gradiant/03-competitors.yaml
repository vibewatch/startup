    severity: material
    topic: challenger-commercial-scale
    missingEvidence: Current revenue, backlog, and installed-base metrics for Aquaporin, Membrion, and Trevi in deployments comparable to Gradiant’s target plants.
    whyItMatters: The chapter can classify these companies by competitive shape, but not prove how close they are to commercial scale without more operating data.
