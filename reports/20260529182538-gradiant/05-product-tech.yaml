figures:
- id: FE001
  title: Product Architecture Map
  type: stack
  layout: wide
  summary: Layered view of how Gradiant combines engineering, treatment modules, digital controls, and operating support into one site-level water architecture.
  data:
    layers:
    - id: customer-objective
      label: Customer Objective Layer
      detail: Source water security, process-water quality, wastewater recycling, PFAS remediation, discharge minimization, or resource recovery define the plant design problem.
    - id: design-layer
      label: Process Engineering Layer
      detail: Feed characterization, mass-balance design, permit target translation, and module selection turn the site problem into a treatment train.
    - id: treatment-layer
      label: Treatment Module Layer
      detail: RO Infinity, Bio Infinity, SCE, CGE, FRO, UPW packages, ForeverGone, and alkaLi combine as needed for the physical process train.
    - id: digital-layer
      label: Digital and Controls Layer
      detail: SmartOps AI links sensors, plant data, digital-twin logic, predictive maintenance, and optimization recommendations to the operating plant.
    - id: service-layer
      label: Service, Chemistry, and Validation Layer
      detail: Process experts, chemicals, accredited labs, verification protocols, and site O&M support stabilize performance and document compliance.
    - id: outcome-layer
      label: Outcome Layer
      detail: Reuse, compliant discharge, lower freshwater withdrawal, lower total water cost, or recovered lithium / other valuable resources.
  approximationNotes: This is a reconstructed operating stack from public product materials rather than an internal system diagram released by Gradiant.
