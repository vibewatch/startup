  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: reliability-disclosure
    missingEvidence: Portfolio-level uptime, fouling, cleaning frequency, and module-specific failure or replacement data across RO Infinity, SmartOps AI, ForeverGone, and other core modules.
    whyItMatters: Mission-critical water systems are judged on sustained operating performance, not only process diagrams and isolated showcase metrics.
    diligencePath: Request fleet-level KPI packs, O&M dashboards, and named reference calls segmented by module and industry.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: security-disclosure
    missingEvidence: Public SOC 2, ISO 27001, IEC 62443, penetration-test, or comparable cybersecurity documentation for SmartOps AI and remote-control workflows.
    whyItMatters: Digital access to water plants raises operational and customer-trust risk; without third-party assurance, the software layer remains harder to underwrite than the process modules.
    diligencePath: Ask for current certification letters, security architecture overviews, and customer security-review outcomes for SmartOps AI deployments.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: minor
    topic: ip-depth
    missingEvidence: A fuller map of issued and pending patents by module, geography, expiry, and claim scope for CFRO, CGE, FRO, SmartOps AI, and ForeverGone.
    whyItMatters: One visible patent supports the claim that proprietary IP exists, but not the breadth, defensibility, or freedom-to-operate of the overall platform.
    diligencePath: Compile a patent landscape from USPTO/EPO databases and management IP schedules, then compare it to direct competitors by subsystem.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: customer-proof
    missingEvidence: Named customer references and operating results for the two hyperscaler contracts and for broader SmartOps AI, PFAS, and lithium deployments.
    whyItMatters: The product story is strongest when public references show repeatable outcomes across industries; unnamed projects leave deployment density hard to verify.
    diligencePath: Request referenceable logos, scope-of-work summaries, and before/after KPI data for major recent wins.
    relatedQuestionRefs:
    - QE016
    - QE027
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: roadmap-disclosure
    missingEvidence: Detailed technical documentation and release timing for HyperSolved for Data Centers, ProtiumSource for Green Hydrogen, and other newly branded offers shown in navigation but not in the retained product corpus.
    whyItMatters: Roadmap precision matters when underwriting adjacent growth vectors; marketing visibility without technical detail increases execution uncertainty.
    diligencePath: Request product briefs, launch dates, first-customer references, and ownership of each adjacent offer within the product organization.
