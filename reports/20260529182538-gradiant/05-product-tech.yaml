- id: TE002
  title: Workflow / Use-Case Table
  columns:
  - User job
  - Current workflow / pain point
  - Gradiant solution
  - Measurable benefit claimed publicly
  - Known limitation
  rows:
  - - Secure process water with lower freshwater withdrawals
    - Plants need reliable intake or reclaimed feed while controlling footprint and cost
    - RO Infinity, SCE, and custom process-water trains
    - Higher recovery, modular footprint reduction, lower total water cost
    - Public sources do not disclose standardized design ranges by industry or feed composition
  - - Treat high-variability industrial wastewater
    - Flows vary by contaminant load and discharge standard; single technology rarely suffices
    - Bio Infinity plus SCE/FRO as needed
    - Up to 50% lower life-cycle cost claimed for Bio Infinity; ppb effluent claims for SCE
    - Neutral customer references and long-run operating data are limited
  - - Minimize discharge and disposal from brine-heavy plants
    - Conventional thermal ZLD is expensive and hard to run on fouling streams
    - RO Infinity followed by Carrier Gas Extraction or other ZLD finishing
    - RO Infinity claims ~60% savings vs thermal; CGE claims >50% lower total water cost
    - Cross-source benchmarks are still mostly company-supplied
  - - Remove and destroy PFAS on site
    - Capture-only methods create disposal cost and liability transfer
    - ForeverGone
    - Below-regulatory-limit treatment claimed; 99–99.9% removal and low cost reported by trade press
    - Named neutral case studies remain sparse and long-run remediation economics are still emerging
  - - Recover lithium or other resources from complex brines
    - Evaporation ponds are slow, land-intensive, and input-specific
    - alkaLi / EC2 plus CFRO and conversion stages
    - Battery-grade output measured in seconds not years; 50% lower OPEX claimed
    - Public evidence shows onboarding and proving, not broad commercial scale
  - - Keep operating plants reliable and cheaper to run
    - Operators struggle to balance water quality, recovery, energy, cleaning cycles, and labor
    - SmartOps AI
    - Up to 5% energy savings and 99.95% uptime in one published desal case
    - Public software-security and fleet-wide KPI disclosure are weak
  - - Produce ultrapure water for precision manufacturing
    - Semiconductor and pharma processes need extreme purity and consistent quality
    - UPW package using RO Infinity, SCE, and EDI
    - '>18.2 MΩ-cm resistivity target; make-up, primary, and polishing stages described'
    - No public design blueprints or yield-impact case studies were retained
  - - Help hyperscalers manage site-wide water strategy
    - AI data centers are growing in water-stressed regions with strong sustainability scrutiny
    - Integrated data-center package combining ZLD, SmartOps AI, and chemicals
    - 99% of process water recovered and reused on site is the headline claim
    - Customer names, contract scope, and realized savings are not public in retained sources
  notes: Benefits are the public claims attached to the relevant workflow; they should not be read as guaranteed outcomes across all installations. Rows mix mature and emerging offers because buyers often assemble multiple modules around one site problem.
