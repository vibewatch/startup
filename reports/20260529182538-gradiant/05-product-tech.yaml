- id: SE_SEC005
  title: Trust, Compliance, and Roadmap Uncertainty
  body: 'Trust and quality matter here because Gradiant’s systems are sold into plants where water failure can halt semiconductor output, impair municipal treatment performance, or undermine hyperscaler sustainability commitments. Public evidence is strongest where a third party can verify a narrow claim: accredited laboratories for ForeverGone PFAS testing, IPMVP-style measurement and verification in one SmartOps AI desalination case, EPA PFAS thresholds, and NPDES permitting structures. The sources also show some public IP evidence in process-control patents and some design conservatism in the use of commercially available membranes and modular assemblies. Those are positives, but they are not substitutes for broad public disclosure of reliability, cybersecurity, or certification discipline. The largest evidence gaps are straightforward. Gradiant does not publish portfolio-level uptime or replacement metrics across the module stack, even though it sells into mission-critical environments.
    SmartOps AI materials do not disclose SOC 2, ISO 27001, IEC 62443, or equivalent third-party security assurances. The public roadmap is also less precise than the marketing suggests: HyperSolved for Data Centers and ProtiumSource for Green Hydrogen are visible in navigation, and alkaLi is clearly in go-to-market mode, but detailed release sequencing, feature ownership, and customer traction are not richly documented in the retained corpus. The result is a chapter that supports Gradiant’s integrated product thesis while still reserving judgment on quality systems, cyber trust, and near-term roadmap precision.'
