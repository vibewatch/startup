- id: TE003
  title: Technology / Operating Architecture Table
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Primary risk
  rows:
  - - Feed characterization and process engineering
    - Translate source-water quality, wastewater chemistry, recovery goals, and permit targets into a treatment train
    - Field sampling, site data, discharge targets, engineering staff
    - Bad characterization can invalidate economics or compliance assumptions
  - - Core physical treatment modules
    - Run biological, membrane, targeted-removal, oxidation, or thermal steps appropriate to the stream
    - RO Infinity, Bio Infinity, SCE, CGE, FRO hardware and controls
    - Performance varies with fouling, scaling, and contaminant complexity by site
  - - Application-specific bundles
    - Package multiple unit operations into offers such as ForeverGone, alkaLi, UPW, or integrated data-center water solutions
    - Cross-module integration and project delivery discipline
    - Marketing bundles can outpace public proof or roadmap precision
  - - Digital twin and plant-data layer
    - Connect sensors, real-time process data, optimization models, maintenance prediction, and operator workflows
    - Instrumentation, telemetry, historical data, SmartOps AI models
    - Cybersecurity, data rights, and remote-control governance are not publicly detailed
  - - Chemicals and maintenance support
    - Tune chemistry, cleaning cycles, and operating setpoints to stabilize performance and total water cost
    - CURE Chemicals, service teams, consumables, cleaning events
    - Public materials do not show margin structure or chemical-intensity data by module
  - - Verification and compliance layer
    - Demonstrate treatment to customers, regulators, and plant owners
    - Accredited labs, EPA standards, NPDES permits, measurement protocols
    - Compliance burden varies sharply by geography and application
  - - Customer operations and feedback loop
    - Convert plant performance into future design know-how and optimization benchmarks
    - Named references, operating data, service contracts, expert teams
    - Public disclosure of fleet-level KPIs is thin, limiting external verification of learning effects
  notes: The table reconstructs operating architecture from retained public materials. It emphasizes roles and dependencies rather than attempting to reverse-engineer undocumented software or control-stack internals.
