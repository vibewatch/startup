callouts:
- calloutType: strength
  title: Integrated-system positioning is the core product thesis
  body: The strongest throughline in the sources is not any single membrane or PFAS technology; it is Gradiant’s ability to frame source water, process water, wastewater, reuse, discharge, and optimization as one engineering problem. That integrated framing is what makes the portfolio commercially coherent.
  claimRefs:
  - CE001
  - CE002
  - CE024
  - CE025
- calloutType: insight
  title: SmartOps AI looks more credible as operator software than as generic industrial AI
  body: Public materials tie SmartOps AI to physical plants, digital twins, and named operating outcomes rather than to vague AI branding. That is a positive sign, but public cyber and certification disclosure still lags the process-technology disclosure.
  claimRefs:
  - CE015
  - CE017
  - CE018
  - CE040
- calloutType: strength
  title: ForeverGone is the clearest application-specific wedge
  body: 'Among Gradiant’s branded offers, ForeverGone has the most legible external narrative: a defined contaminant problem, a distinct mechanism, public lab validation language, awards, and at least one named deployment. That makes it a strong wedge product even if long-run economics still need deeper neutral proof.'
  claimRefs:
  - CE029
  - CE030
  - CE031
  - CE032
  - CE033
- calloutType: risk
  title: Quality, security, and roadmap evidence remain thinner than the marketing breadth
  body: The company has enough public material to demonstrate ambition and product breadth, but not enough to eliminate diligence questions on fleet reliability, SmartOps AI security assurance, or the exact roadmap for newly branded adjacent offers. Those are the biggest underwriting gaps left after this chapter.
  claimRefs:
  - CE039
  - CE040
  - CE042
