tables:
- id: TE001
  title: Product Module / Asset Matrix
  columns:
  - Module / Asset
  - Primary workflow stage
  - Primary user
  - Status / maturity
  - Differentiation
  - Diligence gap
  rows:
  - - RO Infinity (CFRO + RO)
    - Brine concentration, desalination, reuse, ZLD front end
    - Industrial plants, desalination, lithium sites
    - Commercially marketed core platform
    - Up to 99% recovery to salt-saturation brine; modular assemblies using commercial membranes
    - No public fleet-level fouling, cleaning, or uptime statistics by installation base
  - - Bio Infinity (BioConvert, BioCapture, Ultrawaves)
    - Secondary / tertiary wastewater treatment
    - Industrial wastewater operators
    - Commercially marketed; 200+ manufacturing sites claimed
    - High-rate biological treatment with methane recovery and lower life-cycle cost claims
    - Installed-base claim is not broken out by submodule, customer, or reference site quality
  - - Selective Contaminant Extraction
    - Targeted contaminant removal and mineral recovery
    - Sites with specific ions, VOCs, oils, metals, or ppb discharge targets
    - Commercially marketed cross-platform module
    - Physical + chemical steps can run stand-alone or around ROI/CGE/FRO
    - Few neutral case studies show economics by contaminant class
  - - Carrier Gas Extraction
    - Thermal concentration, MLD, ZLD finishing
    - High-TDS and scaling wastewater operators
    - Commercially marketed core platform
    - Claims lower CAPEX/OPEX and lower pressure / temperature than conventional thermal systems
    - Public proof is largely marketing-level versus named benchmark studies
  - - Free Radical Oxidation
    - High-COD and refractory-organic destruction
    - Industrial wastewater operators in difficult streams
    - Commercially marketed niche module
    - Advanced oxidation suite with strong claimed oxidant and energy efficiency
    - Third-party operating data and contaminant-specific references are sparse
  - - SmartOps AI
    - Monitoring, prediction, optimization, remote O&M support
    - Plant owners and operators
    - Commercially deployed with at least one published case
    - Digital twin + real-time sensors + ML + expert operations support
    - Cybersecurity, data-rights, and certification detail are not publicly disclosed
  - - ForeverGone
    - PFAS removal and destruction
    - Industrial, municipal, landfill, and remediation users
    - Introduced in 2024; deployment and awards scaling in 2025
    - All-in-one on-site removal plus destruction using micro-foam fractionation and electrooxidation
    - Portfolio proof relies on company-announced results and limited named deployments
  - - alkaLi powered by EC2
    - Lithium extraction, concentration, conversion
    - Lithium producers using brine, ponds, geothermal, recycling
    - Commercial-proving / onboarding stage
    - Integrated Extract-Concentrate-Convert flow with CFRO and optional BOO model
    - Commercial maturity and customer count remain unclear from public sources
  - - Ultrapure Water offer
    - Make-up, primary, and polishing stages for UPW
    - Semiconductor, solar, pharma manufacturers
    - Commercially marketed application bundle
    - Combines SCE, RO Infinity, and EDI with H+E domain expertise
    - No public reference architecture or yield-impact data by fab or line type
  notes: Rows focus on publicly named modules or application bundles only. Maturity reflects what is explicitly evidenced in retained sources, not an internal product roadmap.
