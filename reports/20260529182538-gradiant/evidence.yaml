    whyItMatters: >-
      Status-quo substitutes are clearly important, but public economics vary too much by site to support a universal
      price ladder.
    diligencePath: >-
      Build a diligence worksheet using three recent customer geographies with actual permit fees, hauling costs, and
      disposal assumptions.
