evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board list, committee structure, and investor-governance rights for each major financing round.
    whyItMatters: >-
      Governance opacity matters more after the 2025 reputational event and the 2026 title change from CEO to Executive
      Chairman.
    diligencePath: Request the latest board deck, governance chart, and post-Series-E cap-table summary from management.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: series-e-size
    missingEvidence: The actual dollar amount raised in the May 2026 Series E.
    whyItMatters: Valuation without round size makes it hard to assess dilution, runway extension, and investor appetite.
    diligencePath: Request the executed financing summary, cap-table change log, and any associated press Q&A or investor memo.
    relatedQuestionRefs:
      - QO013
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A management-confirmed current employee count and regional staffing distribution.
    whyItMatters: Headcount is a key scale indicator and a proxy for delivery capacity, but public sources conflict materially.
    diligencePath: Ask for the current org chart, employee census by geography, and 12-month hiring/attrition history.
    relatedQuestionRefs:
      - QO016
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Audited revenue, gross margin, EBITDA, cash balance, burn, and order-conversion data.
    whyItMatters: Public claims of profitability and growth cannot be underwritten fully without audited or lender-grade financials.
    diligencePath: Obtain the latest board financial package and project-level contribution-margin analysis.
    relatedQuestionRefs:
      - QO015
      - QO025
  - type: private-evidence-only
    severity: minor
    topic: customer-concentration
    missingEvidence: Customer count, top-customer exposure, and contract-duration detail behind the named logos.
    whyItMatters: The logo list is strong but does not reveal concentration or repeatability of revenue.
    diligencePath: Request a revenue-by-customer cohort table with contract type, geography, and renewal status.
    relatedQuestionRefs:
      - QO018
      - QO025
  - type: private-evidence-only
    severity: material
    topic: Bottom-up SAM for semiconductor and data-center water budgets
    missingEvidence: >-
      Public customer disclosures do not break out vendor spend for process-water, recycling, cooling-water, or reuse
      programs by site or by company.
    whyItMatters: >-
      Without procurement-level budget data, the chapter can defend strategic importance but cannot convert the priority
      verticals into a tight bottom-up SAM.
    diligencePath: >-
      Request customer-level capital plans, procurement budgets, or vendor-spend benchmarks for fab utilities and
      hyperscale campus water systems.
    relatedQuestionRefs:
      - QM022
  - type: private-evidence-only
    severity: material
    topic: Gradiant market share and win-rate visibility
    missingEvidence: >-
      The public record does not disclose Gradiant’s category share, vertical-specific win rate, or named pipeline
      conversion by end market.
    whyItMatters: >-
      Any SOM claim stays low-confidence until investors know whether Gradiant is a niche winner, a broad platform
      leader, or a small participant in each vertical.
    diligencePath: >-
      Request booked-revenue mix, win-loss data, repeat-customer rates, and backlog by vertical to convert the market
      thesis into a share thesis.
    relatedQuestionRefs:
      - QM023
  - type: private-evidence-only
    severity: material
    topic: Buyer ROI, ACV, and payback benchmarks
    missingEvidence: >-
      Reviewed public sources do not disclose project ACV, payback periods, energy penalties, or other ROI benchmarks
      that buyers use to approve advanced treatment and reuse projects.
    whyItMatters: >-
      This prevents a rigorous view of sales-cycle length, economic defensibility, and which subsegments can adopt
      without subsidy or acute scarcity.
    diligencePath: Request project-level business cases, energy-intensity data, and post-install water / cost savings by use case.
    relatedQuestionRefs:
      - QM024
  - type: private-evidence-only
    severity: material
    topic: Gradiant revenue mix by recurring versus project-based offerings
    missingEvidence: >-
      The public record does not split revenue among projects, recurring services, chemicals, software, operations
      support, or aftermarket streams.
    whyItMatters: >-
      That mix matters because recurring revenue generally deserves a different multiple and implies a different market
      structure than one-time project delivery.
    diligencePath: Request segment revenue and gross-margin mix by offering type and by vertical.
    relatedQuestionRefs:
      - QM025
  - type: conflicting-data
    severity: minor
    topic: Industrial water TAM methodology mismatch
    missingEvidence: >-
      Market summaries, policy documents, and company materials do not use a shared denominator for treatment equipment,
      reuse services, PFAS remediation, and digital operations.
    whyItMatters: >-
      This is the central reason a lens-based sizing method is more honest than quoting one generic TAM as if it were
      directly monetizable by Gradiant.
    diligencePath: >-
      Preserve the category mismatch in future revisions unless a source with transparent scope definitions and
      subsegment breakout becomes available.
  - type: missing-source
    severity: material
    topic: veolia-standalone-revenue
    missingEvidence: A clean standalone revenue breakout for Veolia Water Technologies and Solutions in the current period.
    whyItMatters: >-
      Without a direct segment revenue line, Veolia’s competitive scale can only be triangulated through group-level
      materials and technology pages.
    diligencePath: >-
      Request the latest segment bridge or management commentary that isolates Water Technologies and Solutions from
      broader Veolia reporting.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: installed-base-share
    missingEvidence: Public win-rate, installed-base share, and fab-by-fab penetration data for Gradiant versus Veolia or Xylem.
    whyItMatters: >-
      This is the key missing dataset for underwriting whether Gradiant is truly displacing incumbents or only winning
      net-new hard cases.
    diligencePath: >-
      Request customer reference lists, live-site cohort data, or pipeline by incumbent-displacement versus greenfield
      projects.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Signed contract values, realized pricing, and side-by-side TCO benchmarks across Gradiant and its main incumbents.
    whyItMatters: >-
      The pricing section can compare packaging logic, but not actual economic edge, without bid data or operating-cost
      proofs.
    diligencePath: >-
      Collect recent customer proposals, retrofit economics, disposal costs, and O&M assumptions for at least three
      reference cases.
    relatedQuestionRefs:
      - QP017
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: challenger-commercial-scale
    missingEvidence: >-
      Current revenue, backlog, and installed-base metrics for Aquaporin, Membrion, and Trevi in deployments comparable
      to Gradiant’s target plants.
    whyItMatters: >-
      The chapter can classify these companies by competitive shape, but not prove how close they are to commercial
      scale without more operating data.
    diligencePath: >-
      Request the latest annual reports, financing decks, or customer deployment counts for each challenger before
      over-weighting them.
    relatedQuestionRefs:
      - QP026
    relatedTableRefs:
      - TP001
  - type: enumeration-incomplete
    severity: minor
    topic: status-quo-economics
    missingEvidence: >-
