  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: Signed contract values, realized pricing, discounts, change-order terms, and separate monetization for SmartOps, chemicals, and O&M.
    whyItMatters: The public record supports a contract-model view but not price realization, which blocks a real gross-margin and payback analysis.
    diligencePath: Request the last five large contracts split by EPC, O&M, digital, and chemicals, including change-order history and price escalators.
    relatedQuestionRefs:
    - QI006
    - QI007
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: audited-financials
    missingEvidence: Audited income statement, balance sheet, cash-flow statement, and backlog bridge for fiscal 2024 and 2025.
    whyItMatters: Without audited statements, the chapter can assess direction and credibility, but not convert company-claimed momentum into a defendable downside case.
    diligencePath: Obtain audited annual financials plus a monthly management pack tying booked orders, revenue recognition, and project cash collection.
    relatedQuestionRefs:
    - QI018
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: margin-ebitda-disclosure
    missingEvidence: Gross margin by stream, EBITDA, project margin by vertical, and contribution from digital, chemicals, and operating services.
    whyItMatters: The mix-quality argument depends on knowing whether higher-value recurring layers are large enough to offset the lumpy and risk-bearing project base.
    diligencePath: Request a revenue and gross-profit bridge by EPC, O&M, digital, chemicals, and resource-recovery streams for the last eight quarters.
    relatedQuestionRefs:
    - QI018
    - QI019
    relatedTableRefs:
    - TI003
    - TI005
  - type: private-evidence-only
    severity: material
    topic: cash-burn-runway
    missingEvidence: Cash on hand, unrestricted cash, debt draw, monthly burn or cash generation, runway, and covenant headroom.
    whyItMatters: The HSBC revolver proves working-capital demand exists, but not whether current liquidity is abundant or already tightly managed.
    diligencePath: Request a 13-week cash-flow forecast, current borrowing-base report, debt schedule, and covenant package.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: concentration-and-collections
    missingEvidence: Customer concentration, DSO, retention or renewal rates for services, project milestone timing, and backlog conversion by vertical.
    whyItMatters: Revenue quality depends on how concentrated the customer base is and how efficiently the company turns backlog into collected cash.
    diligencePath: Request the top-20 customer list, AR aging, retention data for service contracts, and backlog conversion cohorts by project type.
    relatedQuestionRefs:
    - QI019
    - QI025
    relatedTableRefs:
    - TI003
    - TI005
  - type: missing-source
    severity: material
    topic: series-e-size
    missingEvidence: Exact Series E amount raised, security structure, dilution, and any secondary component.
    whyItMatters: The valuation is public, but the actual capital added to the balance sheet is still unknown, which limits any runway or capital-adequacy conclusion.
    diligencePath: Request the signed term sheet, closing memo, post-money cap table, and board materials describing use of proceeds.
    relatedQuestionRefs:
    - QI017
    - QI025
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: project-risk-bridge
    missingEvidence: Loss-history, contingency reserves, warranty spend, performance-guarantee claims, and change-order realization by project cohort.
    whyItMatters: Proxy evidence from Xylem shows these are real financial variables in industrial water, but Gradiant does not disclose its own experience curve.
    diligencePath: Request project postmortems for the ten largest contracts, including contingency usage, liquidated damages exposure, and guarantee outcomes.
    relatedQuestionRefs:
    - QI014
    - QI024
    relatedTableRefs:
    - TI003
    - TI004
