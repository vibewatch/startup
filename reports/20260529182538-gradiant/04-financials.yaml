- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public evidence
  - What it implies
  - Risk / quality view
  - Diligence ask
  rows:
  - - Series C (2021)
    - Raised over $100M; use included project-level financing and flexible delivery models
    - Capital support was already part of the GTM model before later rounds
    - Helpful strategic capital, but signals project intensity rather than pure software efficiency
    - Provide realized returns on financed projects
  - - Series D (2023)
    - $225M at $1B valuation; proceeds for expansion and R&D
    - Growth capital was still needed well after initial scale-up
    - Supports expansion but does not answer current liquidity
    - Show what percentage of Series D remains or was deployed
  - - HSBC revolver (2025)
    - $50M corporate revolver for U.S. working capital and project execution
    - Confirms near-term liquidity needs tied to project delivery
    - Most direct evidence that working capital is real and operationally important
    - Provide borrowing-base mechanics and current utilization
  - - Total credit capacity
    - Company says total credit exceeds $100M
    - Suggests multiple facilities and a more mature treasury stack
    - Positive for execution flexibility, but covenant headroom is unknown
    - Provide full debt schedule and undrawn availability
  - - Series E (2026)
    - $2B valuation; proceeds for acquisitions, R&D, operating scale, IPO readiness
    - Growth agenda remains capital hungry even after profitability claims
    - Valuation is public, actual dollars raised are not
    - Provide closing memo, amount raised, and dilution
  - - Receivables-backed support
    - Year in Review says HSBC line was backed by receivables from blue-chip customers
    - Customer quality may help financing access
    - Also implies cash is tied up in receivables and milestone collections
    - Provide DSO, retention, and customer concentration
  - - Cash / burn / runway
    - Not publicly disclosed
    - No clean public view on balance-sheet sufficiency
    - Largest remaining capital-adequacy blocker
    - Provide monthly cash bridge and 12- to 18-month liquidity plan
  notes: Historical round chronology is included only where needed for capital analysis; the chapter avoids reusing overview claim ids and focuses on forward adequacy.
