    - Confirms strong top-line momentum but not absolute revenue base
    - Reconcile against audited revenue and monthly revenue bridge
  - - 2025 new orders
    - '>$500M (company-claimed)'
    - Medium
    - Useful leading indicator for 2026 revenue conversion
    - Provide backlog aging, cancellations, and conversion rates
  - - 2025 profitability
    - 4X increase and profitable (company-claimed)
    - High for direction, low for precision
    - Suggests operating leverage but not actual EBITDA or free cash flow
    - Provide EBITDA, EBIT, and cash conversion by quarter
  - - Geographic mix
    - Approx. 1/3 US, 1/4 Europe, remainder Middle East + Indo-Pacific
    - Medium
    - Diversification can improve resilience if collections are also diversified
    - Provide revenue, margin, and DSO by region
  - - SmartOps energy savings
    - Up to 5% energy savings at >200,000 m3/day SWRO plant
    - Medium
    - Supports a value-based software pitch and customer OPEX benefit
    - Show how much of that value Gradiant captures in pricing
  - - Xylem proxy for recurring service revenue
    - Installed base supports steady parts, replacement, and service revenue
    - Medium
    - Shows why installed assets can create higher-quality tails once scale exists
    - Compare Gradiant installed base and service attach rates against this proxy
  - - Project risk proxy
    - Public comps disclose cost overrun and performance guarantee risk
    - Medium
    - Confirms that industrial water projects can impair margin if execution slips
    - Provide Gradiant reserve policy and loss history by project cohort
  - - Gross margin
    - Not publicly disclosed
    - Low
    - Critical for valuing a hybrid project-plus-service model
    - Disclose margin by EPC, O&M, digital, and chemicals
  - - ARR / NRR / CAC / payback
    - Not publicly disclosed
    - Low
    - Needed to test whether software or service tails are materially improving revenue quality
    - Provide recurring revenue dashboard and cohort retention metrics
  - - Customer concentration / DSO
    - Not publicly disclosed
    - Low
    - Collections and concentration are central in project-heavy businesses
    - Provide top-customer revenue share and AR aging
  notes: This table intentionally mixes disclosed metrics with explicit nulls so the reader can distinguish traction signals from missing underwriting inputs.
