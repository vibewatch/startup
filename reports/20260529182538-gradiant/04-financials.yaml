tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit / contract form
  - Current public status
  - Revenue-quality view
  - Diligence ask
  rows:
  - - EPC / design-build systems
    - Site-specific engineering, equipment supply, construction, and commissioning
    - Project milestones / contract value
    - Clearly visible in company materials and funding coverage
    - Likely largest current revenue pool but also the lumpiest and most working-capital intensive
    - Break out revenue and gross margin by EPC, retrofits, and greenfield projects
  - - Operate-maintain / O&M
    - Post-install operations support and facility management
    - Multi-year service agreement
    - Publicly described but no revenue share disclosed
    - Higher quality than one-time EPC if renewal and utilization are strong
    - Provide contracted O&M ARR-equivalent, renewal rates, and margin by site cohort
  - - SmartOps AI
    - Digital optimization, remote monitoring, predictive maintenance
    - SaaS or service fee layered onto operating plant
    - One case study explicitly says SaaS
    - Potentially highest-quality mix element but scale is unknown
    - Show SmartOps bookings, recurring revenue, attach rate, and churn
  - - CURE Chemicals
    - In-house treatment chemicals and conditioning programs
    - Recurring consumables and program contracts
    - Product family is public; pricing and mix are not
    - Could improve repeat revenue and margin if attached to installed base
    - Disclose chemical revenue, gross margin, and customer attach rate
  - - Resource recovery
    - Recovery of minerals, metals, salts, or lithium-linked outputs
    - Project scope, recovery share, or process fees
    - Capability is public but monetization method is unclear
    - Potential upside stream but probably episodic and site-specific
    - Document realized revenue model on three recovery deployments
  - - Project finance / structured delivery
    - Flexible design-build, operate-maintain, and financing models
    - Equity contribution, milestone billing, or financed project structure
    - Visible in Series C coverage and HSBC credit discussion
    - Can support wins but adds balance-sheet and liquidity complexity
    - Provide capital-at-risk by project and financing return profile
  notes: Rows distinguish public visibility from inferred economics; no public source discloses stream mix percentages or audited revenue by stream.
