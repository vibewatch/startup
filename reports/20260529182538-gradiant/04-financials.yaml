- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - What public evidence exists
  - Exact diligence path
  rows:
  - - Audited revenue
    - Cannot size the business or normalize valuation multiples
    - Only company-claimed growth rate and order momentum are public
    - Request audited FY2024 and FY2025 revenue with regional and stream breakdown
  - - Gross margin by stream
    - Cannot test whether digital or chemical attach is meaningfully improving mix quality
    - Value propositions are public, realized margin is not
    - Request gross margin bridge for EPC, O&M, SmartOps, chemicals, and recovery
  - - EBITDA / operating cash flow
    - Profitability claims cannot be translated into actual earnings quality
    - Company says profitability improved, but no EBITDA figure is public
    - Request quarterly EBITDA, EBIT, and cash conversion statements
  - - Cash balance and runway
    - Cannot judge near-term funding dependency or refinancing risk
    - HSBC facility proves liquidity tools exist, not balance-sheet sufficiency
    - Request cash position, debt draw, covenant headroom, and 13-week cash forecast
  - - ARR / NRR / CAC / payback
    - Cannot quantify whether SmartOps and services are materially changing revenue quality
    - One case confirms SaaS packaging, but no recurring metrics are public
    - Request recurring-revenue dashboard and cohort retention model
  - - Customer concentration and DSO
    - Collections risk and bargaining power remain unknown
    - Receivables-backed borrowing implies AR matters, but concentration is undisclosed
    - Request top-customer revenue share, AR aging, and bad-debt history
  - - Project loss history / guarantees
    - Execution downside cannot be bounded
    - Public comps disclose these risks; Gradiant does not
    - Request project postmortems, reserve policy, and guarantee claim history
  - - Exact Series E amount and dilution
    - Capital adequacy after the latest round cannot be sized
    - Valuation and use of proceeds are public; amount raised is not
    - Request the term sheet, cap table, and closing memo
  notes: Every row is intentionally an evidence gap rather than a filler metric; these are the specific missing inputs that still block clean underwriting.
