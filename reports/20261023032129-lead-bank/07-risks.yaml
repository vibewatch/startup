      - ["Partner or intermediary operational failure", "Medium", "High", "Partially observable from model only", "High", "Need dependency map, exit plans, and tested fallback procedures"]
      - ["Fintech-deposit or customer concentration shock", "Medium", "High", "Not established", "High", "Need top-partner balances, limits, and stress scenarios"]
      - ["Service interruption or delayed recovery", "Unknown", "High", "Not established", "Medium-high", "Need uptime, incident, RTO/RPO, and postmortem history"]
    notes: "Rows combine comparator evidence with explicit unknowns; no unavailable Lead Bank operating metric is converted to zero or treated as proof of absence."
    claimRefs: [CR005, CR006, CR007, CR008, CR009]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Sponsor-bank compliance infrastructure", "Lead Bank and fintech partners", "Partner growth outpaces monitoring, testing, or BSA/AML staffing", "High", "Stage onboarding, audit rights, independent testing, and remediation gates", "High pending control evidence"]
      - ["Transaction and card integrations", "Stripe, Visa, and other platform partners", "Integration, settlement, or partner termination interrupts product access", "High", "Review concentration, SLAs, portability, termination assistance, and contingency rails", "Medium-high"]
      - ["Fintech customer and deposit base", "BaaS customers and end users", "Sector shock or partner failure causes withdrawals, complaints, or liquidity pressure", "High", "Set concentration limits, liquidity stress tests, and transparent customer communications", "High"]
      - ["External market and capital expectations", "Investors and BaaS ecosystem", "Growth assumptions fail while valuation and capital needs remain elevated", "Medium-high", "Obtain runway, capital plan, loss assumptions, and downside financing scenarios", "Medium-high"]
    notes: "Named partners are reported by an independent local publication; contract terms, concentration, and fallback capacity were not disclosed in the assigned evidence."
    claimRefs: [CR007, CR008, CR009, CR010, CR011, CR012]
