callouts:
  - calloutType: risk
    title: Highest-priority diligence
    body: Obtain Lead Bank-specific examination, reconciliation, concentration, incident, liquidity, and complaint records before relying on the absence of an assigned-pool enforcement or outage record.
    claimRefs: [CR004, CR006, CR008, CR012]
  - calloutType: recommendation
    title: Thesis-break trigger
    body: Treat a material regulatory remediation order, unresolved customer-fund reconciliation exception, sustained service failure, or partner loss without a tested fallback as a thesis-break event.
    claimRefs: [CR003, CR005, CR009, CR011]
