      - ["Consumer harm and litigation after access interruption", "United States", "CFPB judgment and reported consumer accounts document the failure mode", "Medium", "High", "Review complaints, disclosures, insurance treatment, complaint SLAs, and litigation searches", "Medium-high"]
      - ["Unclear enforcement, licensing, privacy, or IP posture", "United States", "Lead Bank-specific status not established by assigned evidence", "Unknown", "High", "Commission current legal/regulatory diligence across federal and state authorities", "High because evidence is incomplete"]
    notes: "Comparator and regulator evidence are not proof of a Lead Bank incident; likelihood and residual exposure are underwriting assessments pending company-specific records."
    enumerationScope:
      coverage: partial
      basis: "Publicly accessible comparator and regulator records allocated to this risks chapter; not a complete legal docket or examination history."
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006]
