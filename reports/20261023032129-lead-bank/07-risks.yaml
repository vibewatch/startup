company:
  name: Lead Bank
chapter:
  number: 7
  title: Risks
  summary: Lead Bank's sponsor-bank model is exposed to compliance, recordkeeping, partner, concentration, and funding risks that are visible in comparable fintech-bank failures and in the economics of its BaaS market. The assigned evidence does not establish a Lead Bank enforcement action or outage, so the highest-priority conclusions are monitoring triggers and diligence requirements rather than assertions of incidents.
sections:
  - id: regulatory-legal
    title: Regulatory and legal exposure
    body: >
      Lead Bank operates in a model where the regulated bank remains responsible for controls while fintech partners and intermediaries can create operational dependencies. The OCC's termination order for Blue Ridge states that the earlier order addressed safety and soundness and compliance with law, while independent reporting describes systemic BSA/AML control breakdowns and weak testing at that peer. The CFPB's Synapse action provides a concrete recordkeeping failure mode: the agency alleged that partner-bank records did not match records for consumer funds, producing a reported $60 million to $90 million shortfall and prolonged access restrictions. These are comparable risks, not evidence that Lead Bank has suffered the same event. A Lead Bank-specific examination history, consent order search, licensing posture, privacy terms, and partner-control testing remain necessary before treating regulatory risk as low.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operating-and-financial
    title: Operational, quality, and financial-model risk
    body: The most material operating risk is not merely a system outage; it is a reconciliation or control failure that can interrupt customer access while responsibility is disputed across bank, fintech, and infrastructure layers. The Synapse record shows how missing or inconsistent ledgers can become a consumer, legal, and reputational event. Fair Observer's comparison with Evolve also highlights concentration and governance as amplifiers when a bank depends heavily on fintech deposits. Lead Bank's reported $70 million Series B and $1.47 billion post-money valuation create a funding and execution expectation, but neither source establishes burn, liquidity buffer, loss rates, or capital adequacy. The practical underwriting response is to require incident metrics, recovery testing, audit findings, concentration limits, and stress cases rather than infer resilience from market growth.
    claimRefs: [CR005, CR006, CR007, CR008]
    tableRefs: [TR002]
  - id: dependencies-and-kill-criteria
    title: Partner dependencies and thesis-break triggers
    body: >
      Lead Bank's public positioning ties its growth to programmable BaaS integrations and named partnerships, including Stripe, Visa, and Branch, while market research describes compliance, risk management, customer support, and transaction processing as part of the BaaS revenue definition. That combination means partner onboarding, data lineage, sponsor-bank oversight, and counterparty concentration are central dependencies. The evidence does not disclose Lead Bank's customer-level concentration, contract protections, service-level performance, or fallback providers. Investors should therefore monitor measurable triggers: a material partner termination, an unresolved reconciliation exception, a regulatory remediation order, a sustained service incident, a capital or liquidity breach, or a loss rate that materially exceeds underwriting plans. These triggers make the risk thesis testable without inventing company-specific thresholds.
    claimRefs: [CR009, CR010, CR011, CR012]
    tableRefs: [TR003]
    figureRefs: [FR001]
