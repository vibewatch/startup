callouts:
  - calloutType: insight
    title: Compliance is part of the product
    body: GMI describes BaaS as entering a compliance-and-scale phase, while Lead's market narrative positions bank-owned controls and the chartered ledger as the differentiator. The same requirement that raises onboarding cost can concentrate demand among credible sponsor banks.
    claimRefs: [CM011, CM013, CM014]
  - calloutType: risk
    title: Market size does not establish Lead's share
    body: The published global estimates support category growth but do not reveal Lead's eligible partner pool, capacity, mix, pricing, or revenue share. A Lead-specific SAM/SOM remains a diligence gap rather than an inferred percentage of TAM.
    claimRefs: [CM006, CM008, CM009]
