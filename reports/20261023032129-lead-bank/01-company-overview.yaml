callouts:
  - calloutType: strength
    title: Regulated infrastructure plus API distribution
    body: Lead combines a bank charter and FDIC-insured role with API-delivered accounts, payments, card issuing, and lending, a positioning that can reduce the licensing burden for fintech partners.
    claimRefs: [CO001, CO002]
  - calloutType: risk
    title: Governance and financial transparency remain open
    body: The retained evidence does not establish the post-Series-B cap table, board composition, revenue concentration, audited financials, or regulatory examination history.
    claimRefs: [CO011, CO016]
  - calloutType: insight
    title: Growth is visible through partners, not disclosed operating KPIs
    body: Stripe, Visa, Bridge, Branch, and Loop references show platform expansion, but public evidence does not quantify customer volumes, revenue, profitability, or partner dependency.
    claimRefs: [CO013, CO014, CO015, CO016]
