artifact: company-overview
slug: lead-bank
runDate: 2026-10-23
company:
  name: Lead Bank
chapter:
  number: 1
  title: Company Overview
  summary: Lead Bank is a Kansas City sponsor bank repositioned around API-enabled banking-as-a-service for fintechs. The evidence supports a 2022 acquisition, a $70 million Series B at a $1.47 billion valuation, and a growing partner-led model, but public evidence remains thin on board governance, audited financials, revenue concentration, and compliance-examination depth.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: Lead Bank is described as an FDIC-insured, state-chartered or chartered bank headquartered in Kansas City, Missouri, offering accounts, payments, card issuing, lending, and related banking-as-a-service capabilities through APIs. Forbes describes the bank as founded in 1928 and acquired by fintech executives in 2022, while the same page's statistics panel labels the founding year as 2022; this is a source-level inconsistency rather than a basis for choosing one date. The operating model is therefore best treated as a legacy bank acquired and repositioned for fintech infrastructure, with the legal charter and regulated balance-sheet role remaining central to its proposition. Industry research places sponsor-bank arrangements at the intersection of fintech distribution and regulated deposit, payment, and compliance infrastructure, while also warning that auditability and controls are becoming commercial differentiators. Lead's public evidence supports the product scope, but not a complete product-pricing or revenue-mix picture.
    claimRefs: [CO001, CO002, CO003, CO004, CO005]
    tableRefs: [TO001]
  - id: ownership-leadership-and-financing
    title: Ownership, leadership, and financing
    body: Jackie Reses led the 2022 acquisition and is identified as Lead Bank's CEO in the reviewed coverage. The acquisition was reported at $56 million, followed by a $70 million Series B that Lead said lifted post-money valuation to $1.47 billion. Coverage names ICONIQ and Greycroft as new investors and Andreessen Horowitz, Ribbit Capital, Coatue, Khosla Ventures, and Zeev Ventures as existing backers. Forbes reports $180 million of funding from Ribbit, Coatue, Khosla Ventures, and others, so the public record contains a total-capital figure that is not reconciled to the identified rounds. There is no retained source establishing the post-Series-B cap table, board composition, liquidation preferences, or control rights; these remain material diligence gaps for minority investors.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO011]
    tableRefs: [TO002, TO003]
  - id: scale-partners-and-milestones
    title: Scale, partnerships, and milestones
    body: The reviewed sources identify approximately 200 employees as of March 2026 and describe partnerships with Stripe and Visa around the stablecoin-linked Bridge card platform, plus a strategic banking relationship with Branch. Forbes also reports a December acquisition of Loop, a payments processor using stablecoin rails, but the source excerpt does not provide a year. These milestones indicate expansion from sponsor-bank infrastructure into payment processing and stablecoin-linked workflows, while the disclosed employee count provides only a point-in-time scale indicator. The BaaS market evidence points to rapid category growth, but it is third-party market context, not Lead revenue or market share. Public sources do not disclose customer count, revenue, profitability, credit losses, regulatory examination history, or partner concentration; those omissions constrain confidence in scale and risk assessment.
    claimRefs: [CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
