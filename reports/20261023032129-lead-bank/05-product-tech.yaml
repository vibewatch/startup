callouts:
  - calloutType: strength
    title: Documented programmable surface
    body: Lead exposes a specific object model and six payment execution categories rather than only describing banking-as-a-service in abstract terms.
    claimRefs: [CE001, CE003]
  - calloutType: risk
    title: Operational proof remains thin
    body: The retained evidence does not disclose uptime, incident history, control attestations, API performance, or the exact production boundary for the Bridge/Visa stablecoin integration.
    claimRefs: [CE008, CE011, CE012]
  - calloutType: recommendation
    title: Require control and reliability evidence
    body: Before underwriting technical maturity, request architecture and data-flow diagrams, security and compliance attestations, rail-level reliability metrics, incident logs, and production-versus-pilot deployment evidence from Lead and its named partners.
    claimRefs: [CE010, CE011, CE014]

