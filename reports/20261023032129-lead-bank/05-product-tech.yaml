      - ["Bank-managed account infrastructure", "Provide FBO, operating, and settlement accounts", "Lead charter and banking operations", "Test segregation, liquidity, permissions, and reconciliation"]
      - ["Payment execution", "Execute ACH, wire, instant, internal, blockchain, and check movements", "External rail operators and network rules", "Obtain rail-specific availability, limits, settlement windows, and exception handling"]
      - ["Card and stablecoin settlement integration", "Connect Bridge/Visa card activity to onchain settlement", "Bridge, Visa, stablecoins, and supported chains", "Determine production scope, custody/control responsibilities, monitoring, and rollback procedures"]
    notes: "Architecture is limited to the publicly documented product grouping and independently reported integration; internal services, controls, and performance are not disclosed in the retained evidence."
    claimRefs: [CE003, CE005, CE006, CE008]

