    title: Customer segmentation
    columns: [Segment, Buyer or payer, Use case and product surface, Strategic value, Evidence gap]
    rows:
      - [Fintech and consumer platforms, Fintech product or platform operator, "Embedded accounts, cards, lending and payment transfers", "Chartered infrastructure can support multiple products inside one partner workflow", "Revenue, contract duration and active-program count are undisclosed"]
      - [Workforce payments, Workforce-payments platform serving W-2 and 1099 workers, "Branch App, debit card and white-label payment products", "Extends Lead into payroll-adjacent verticals including gig, staffing and logistics", "No disclosed transaction volume, worker utilization or renewal data"]
      - [Consumer fintech, Consumer-finance platform, "Card issuing and related banking infrastructure for platforms such as Affirm and Ramp", "Named platforms provide distribution into established fintech ecosystems", "Lead's customer-level revenue and share of partner activity are not disclosed"]
      - [Digital assets and cross-border payments, Digital-asset or payments platform, "Stablecoin-linked cards, payments, custody, settlement and on-chain settlement pilots", "Differentiates Lead as a sponsor willing to serve more complex regulated programs", "Production status, economics and geographic utilization require confirmation"]
    notes: "Sources describe customer segments and product surfaces, but do not provide a complete customer census, revenue bands, contract terms or active-use denominator; rows are a partial public-evidence map."
    claimRefs: [CU001, CU002, CU003, CU005, CU006, CU007, CU008, CU009]
  - id: TU002
    title: Customer growth, adoption and durability trajectory
    columns: [Metric or signal, Public value, Date or period, Confidence, Implication, Missing denominator]
    rows:
      - [Named Branch relationship, "Additional card-issuing partner and sponsor-bank role", "2025-07-22", High, "Commercial deployment spans app, debit card and white-label products", "No volumes, active accounts or contract term"]
      - [Named customer breadth, "Affirm, Ramp and Flex identified as consumer-ecommerce fintech customers or users", "2025-06-10", Medium, "Shows multiple fintech verticals beyond a single anchor", "No customer count, spend or revenue contribution"]
      - [Bridge/Visa expansion signal, "Stablecoin-linked card role with expansion toward a 100-country rollout", "2026-03 reported by Contrary", Medium, "Indicates geographic and product expansion potential", "No live-country count, transaction volume or revenue"]
      - [Anchor concentration signal, "Affirm described as largest disclosed customer; $21.5B partner-group loan originations in fiscal 2024", "Fiscal 2024", Medium, "Potentially material exposure to a small number of fintech partners", "Lead's share and revenue exposure are undisclosed"]
    notes: "The table mixes named commercial relationships and an external concentration observation; values are not a comparable customer funnel and missing denominators are intentional."
    claimRefs: [CU005, CU007, CU008, CU012, CU013, CU014]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or program, Segment, Deployment or use case, Production versus pilot, Outcome or strategic signal, Limitation]
    rows:
      - [Branch, Workforce payments, "Sponsor bank and additional card issuer for Branch App, Card and white-label products", "Announced commercial partnership; production scale not quantified", "Supports expansion across hospitality, gig, staffing, construction, logistics and agriculture", "Announcement is company-issued and provides no usage or retention metric"]
      - [Affirm, Consumer fintech, "Named by CNBC among consumer-ecommerce fintechs using Lead infrastructure", "Customer/use relationship reported; exact program scope not disclosed", "Shows access to a scaled consumer-finance platform", "No contract, volume, renewal or revenue data"]
      - [Ramp, Business fintech, "Named by CNBC among fintechs using Lead infrastructure", "Customer/use relationship reported; exact program scope not disclosed", "Ramp's separate Stripe expansion shows broader cross-border demand but is not attributable to Lead", "No Lead-specific live-product or economics detail"]
      - [Bridge and Visa-linked program, Digital assets and payments, "Stablecoin-linked card and on-chain settlement participation", "Expansion and pilot language; production utilization not quantified", "Supports a differentiated digital-asset customer proposition", "Country rollout, transaction volume and revenue are not disclosed"]
    enumerationScope:
      coverage: partial
      basis: "Named customer and program evidence publicly retained for Lead Bank through the 2026-10-23 refresh run; it excludes undisclosed or unreported relationships."
    notes: "This is a partial enumeration of named relationships, not a complete customer list. Production status is preserved as reported and is not upgraded from launch, pilot or expansion language."
    claimRefs: [CU005, CU006, CU007, CU008, CU009, CU010, CU015]
figures:
  - id: FU001
    title: Customer journey from sponsor-bank sale to expansion
    type: journey-map
    summary: Named evidence supports a partner-led path from regulated infrastructure selection to multi-product and geographic expansion, while retention proof remains unavailable.
    data:
      items:
        - label: Institutional need
          title: Fintech needs a chartered partner
          detail: "Buyer requires regulated access to accounts, cards, lending or payments."
          touchpoints: ["Charter and FDIC-insured banking access", "API-oriented integration"]
        - label: Program launch
          title: Named program deployment
          detail: "Branch, Affirm, Ramp and Bridge/Visa-linked programs are publicly associated with Lead."
          touchpoints: ["Card issuing", "Embedded accounts", "Stablecoin-linked payments"]
        - label: Workflow adoption
          title: End-customer use case
          detail: "Programs serve workers, consumers, businesses or digital-asset users through a fintech front end."
          touchpoints: ["Workforce payments", "Consumer fintech", "Cross-border or digital-asset payments"]
        - label: Expansion
          title: More products or markets
          detail: "Public evidence points to vertical expansion, additional products and a reported 100-country rollout direction."
          touchpoints: ["White-label products", "Additional geographies", "Business and personal banking cross-sell"]
        - label: Durability test
          title: Retention and concentration diligence
          detail: "Public evidence does not disclose churn, renewal, utilization or Lead's share of anchor-customer volume."
          touchpoints: ["Request contract and renewal data", "Measure active programs and customer concentration"]
        - label: Refresh loop
          title: Quarterly customer review
          detail: "The underwriting decision should be refreshed against customer-level operating data rather than announcement counts."
          touchpoints: ["Review active-program register", "Reconcile revenue and volume concentration"]
    approximationNotes: "Conceptual evidence map only; stage order does not imply conversion, timing, or value magnitude."
    claimRefs: [CU001, CU003, CU004, CU005, CU007, CU008, CU011, CU014]
