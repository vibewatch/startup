      - [Unit / Synctera / Treasury Prime / Bond, "Middleware BaaS", "API abstraction across sponsor-bank relationships", "Potentially lower integration burden and broader bank choice", "Underlying bank accountability and economics vary by program"]
      - [The Bancorp / Green Dot / legacy sponsors, "Incumbent sponsor bank", "Established regulated programs and payment/card experience", "Credible status-quo substitute", "Technology modernization and direct public comparability are unclear"]
      - [Internal build / own charter, "Status quo or build", "Control over product, data and banking relationship", "Avoids dependence on one BaaS provider", "Higher licensing, compliance and operational burden"]
    notes: "Source-backed category snapshot synthesized from official competitor pages and Sacra's comparative profiles; unknown fields are intentionally not scored."
    claimRefs: [CP001, CP002, CP005, CP006, CP007, CP008]
  - id: TP002
    title: Peer capability and scale disclosures
    columns: [Provider, Scale or traction disclosed, Core scope, Differentiator stated by source, Limitation / comparability]
    rows:
      - [Lead Bank, "$4B client assets; $31B+ loan originations per year; 4.15B API calls per year; 30M+ end users", "Accounts, cards, credit, lending and agentic finance", "Owns charter, infrastructure and Federal Reserve connection", "Official metrics lack definitions, period context and independent corroboration"]
      - [Column, "$153.11M Sacra-estimated 2025 revenue; $33.30M funding shown by Sacra", "Accounts, cards, ACH/Fedwire/FedNow, compliance and lending capital", "Vertical integration plus warehouse lines and forward flows", "Sacra estimates are not audited and are not directly comparable to Lead's official metrics"]
      - [Cross River, "$32Bn+ consumer loans facilitated since 2019", "Accounts, bank rails, cards, crypto, marketplace lending and principal financing", "Breadth, processor optionality and capital solutions", "Company-authored cumulative figure; no comparable revenue or retention disclosure"]
      - [Lead Bank, "$124.35M Sacra-estimated 2025 adjusted revenue", "BaaS, deposits, payments, cards and lending", "Full-stack BaaS with traditional community-bank operations", "Analyst estimate differs from official site metrics and is not audited"]
    notes: "Values preserve issuer, metric and period. Company metrics, Sacra estimates and cumulative totals are not interchangeable measures of scale."
    claimRefs: [CP005, CP006, CP007, CP009]
  - id: TP003
    title: Pricing and packaging comparison
    columns: [Provider, Published pricing / fee model, Packaging, Buyer implication, Unknown]
    rows:
      - [Lead Bank, null, "Bundled or unbundled programmable banking primitives", "Potential flexibility to start narrow and expand", "List prices, minimums, discounts and realized take rate"]
      - [Column, "$0.50 per ACH transfer and $5 per wire cited by Sacra", "Usage fees plus monthly minimums; interchange and interest income", "More explicit public fee mechanics", "Contract pricing, discounts, implementation fees and realized margins"]
      - [Cross River, null, "Processor-agnostic cards plus accounts, rails, lending and financing", "Optionality may reduce processor lock-in", "List prices, minimums, discounts, SLAs and switching costs"]
      - [Middleware providers, null, "Single integration to multiple sponsor-bank relationships", "May reduce bank-selection friction", "Provider-specific fee schedules and underlying-bank economics"]
    notes: "Only Column's public Sacra profile supplies a concrete fee example; all other price cells are unknown rather than inferred from product breadth."
    claimRefs: [CP010, CP011, CP012, CP013]
figures:
  - id: FP001
    title: Evidence-backed competitive positioning
    type: quadrant
    summary: "Ordinal positioning highlights Lead's disclosed control and breadth against selected alternatives; coordinates are analytical scores, not market-share measurements."
    data:
      xAxis:
        label: Integration control
        min: 1
        max: 5
      yAxis:
        label: Product breadth
        min: 1
        max: 5
      points:
        - {label: Lead Bank, x: 5, y: 4, note: "Charter, infrastructure and direct Federal Reserve connection; broad accounts, cards, credit and lending."}
        - {label: Column, x: 5, y: 4, note: "Vertically integrated bank and technology with accounts, payments, cards and lending capital."}
        - {label: Cross River, x: 4, y: 5, note: "Broad accounts, rails, cards, crypto, lending, financing and securities."}
        - {label: Middleware BaaS, x: 2, y: 3, note: "Broader bank choice through abstraction, but less direct control of the underlying charter."}
        - {label: Legacy sponsor bank, x: 3, y: 3, note: "Regulated program capacity is credible; modern technology and breadth are not established in the pool."}
        - {label: Internal build / own charter, x: 5, y: 2, note: "Maximum control in principle, but the retained evidence does not establish comparable product breadth."}
    approximationNotes: "Scores are ordinal analyst synthesis from retained source descriptions on a 1–5 scale; they are not independently measured benchmarks or market shares."
    claimRefs: [CP005, CP006, CP007, CP008, CP014]
callouts:
  - calloutType: strength
    title: Structural differentiation is credible
    body: Lead combines a regulated charter with direct infrastructure and a modular product surface, a configuration that can reduce middleware dependence for fintech buyers.
    claimRefs: [CP005, CP006]
  - calloutType: risk
    title: Capability overlap is already substantial
    body: Column and Cross River disclose overlapping account, payment, card and lending capabilities; Lead's durable edge therefore depends on execution, economics and risk acceptance that public sources do not quantify.
    claimRefs: [CP007, CP008, CP014]
