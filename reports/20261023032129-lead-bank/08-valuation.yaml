    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, track, "Do not underwrite a buy without current financial and cap-table evidence."]
      - [Confidence, medium, "The financing mark is disclosed, but operating denominators and terms are incomplete."]
      - [Risk rating, high, "Regulatory, partner, credit, and valuation risks are material."]
      - [Valuation stance, unclear, "The $1.47B equity mark has no independently verified current revenue, cash, or debt bridge."]
    notes: "Assessment synthesizes the cited financing, comp, and risk evidence; it is not an audited valuation opinion."
    claimRefs: [CV011, CV012, CV013, CV014]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Integrated sponsor-bank differentiation", "A bank-owned BaaS platform offers programmable products for direct workflow integration.", "Evidence of weak partner retention or inability to scale compliance."]
      - ["Financing validates investor demand", "$70M Series B at $1.47B post-money valuation.", "A below-mark round, impaired preferred terms, or no current financing support."]
      - ["Revenue quality may be rate-sensitive", "Sacra estimates 68% of 2024 revenue came from interest on deposits and loans.", "Audited fee mix, net interest margin, and stress-tested credit results."]
      - ["Comparable range is wide", "Finro reports 6.9x median banking/neobank EV/revenue and 9.1x Series B median.", "A bank-specific peer set with consistent revenue and capital definitions."]
    notes: "Third-party estimates and dataset medians are directional; they do not establish Lead Bank's audited revenue or enterprise value."
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV008]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Scenario, Assumptions, Valuation or return logic, Probability signal, Key risk]
    rows:
      - [Bull, "Fee revenue compounds, partner concentration declines, and capital remains ample.", "Prior $1.47B mark is supportable or can re-rate upward; no target return is supportable from public inputs.", "Qualitative upside case only.", "Regulatory and credit costs rise faster than fee growth."]
      - [Base, "Growth continues but current revenue, margins, and terms remain partly undisclosed.", "Hold or track at the last disclosed mark pending audited denominator and cap-table review.", "Most defensible pending diligence; not a quantified probability.", "Entry price embeds unverified operating assumptions."]
      - [Bear, "Partner loss, funding-cost pressure, adverse examination, or credit losses compress earnings.", "Multiple compression or a below-mark financing creates permanent dilution or mark-down risk.", "Material downside case; probability cannot be estimated from this pool.", "Liquidity, capital, and regulatory constraints."]
    notes: "Scenarios are qualitative because public evidence does not provide enough verified inputs for probability-weighted valuation ranges or target returns."
    claimRefs: [CV011, CV012, CV013, CV014]

