schemaVersion: "report-v2"
artifact: valuation
slug: lead-bank
runDate: 2026-10-23
company:
  name: Lead Bank
chapter:
  number: 8
  title: Valuation
  summary: Lead Bank's latest financing mark in the assigned evidence is a $1.47 billion post-money valuation from its September 2025 Series B, while current revenue, earnings quality, and cap-table terms remain incompletely disclosed. Public evidence supports a price-sensitive track posture rather than a precise current valuation.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      Lead Bank has a differentiated sponsor-bank proposition: a bank-owned
      BaaS platform offering programmable products for direct integration into
      fintech workflows. The strongest positive evidence is the $70 million
      Series B at a $1.47 billion post-money valuation. That financing is a
      market-clearing signal, not an audited intrinsic value. The anti-thesis
      is that a bank valuation depends on earnings quality, credit outcomes,
      regulatory capital, partner concentration, and funding costs, none of
      which is fully observable in this pool. A third-party comp source reports
      roughly $180 million of 2024 revenue and a 68% interest-income mix, but
      labels the estimate as Sacra's; it should not be treated as audited
      revenue. The decision therefore turns on whether durable fee revenue and
      compliance capacity can grow faster than rate, credit, and regulatory
      risks.
    claimRefs: [CV001, CV003, CV004, CV005]
    tableRefs: [TV001, TV002]
  - id: price-discipline
    title: Price discipline and comparable evidence
    body: >-
      The disclosed price is difficult to benchmark directly because Lead Bank
      is private and the relevant denominator is not independently established.
      Finro's Q1 2026 preview gives broad fintech reference points: banking and
      neobanks show a 6.9x median EV/revenue and 12.4x average across 55
      companies, while Series B companies show a 9.1x median and 14.8x average.
      These are a working dataset, not a bank-specific audited comp set, and
      Finro says its database mixes public, private, and M&A observations plus
      internal estimates. Applying the 6.9x to 12.4x banking range to Sacra's
      estimated $180 million 2024 revenue produces an illustrative $1.24
      billion to $2.23 billion enterprise-value range. That is not an equity
      valuation and cannot be compared directly with the $1.47 billion
      post-money financing mark without current cash, debt, capital,
      revenue-mix, and growth evidence. The cited
      public Marqeta reference was at 1.47x EV/revenue on Yahoo Finance as of
      June 30, 2026, underscoring how business model and public-market liquidity
      can produce a wide spread versus private fintech marks.
    claimRefs: [CV006, CV007, CV008, CV009, CV010, CV016]
    tableRefs: [TV003]
  - id: scenarios-and-triggers
    title: Scenarios, recommendation, and thesis-break triggers
    body: >-
      A bull case requires proof that partner-driven fee revenue, deposits, and
      lending can scale without a proportional increase in losses, compliance
      expense, or regulatory constraints. A base case assumes the last disclosed
      valuation remains supportable only if management supplies current audited
      or regulator-consistent revenue, capital, credit, and concentration data.
      A bear case combines multiple compression with a weaker fintech funding
      environment, partner attrition, higher funding costs, or a compliance
      event. The public evidence does not support a probability-weighted target
      return, liquidation-preference analysis, or exit date. The practical
      recommendation is track: require price and cap-table access before
      underwriting, and move toward buy only if independent financial evidence
      closes the material gaps. Thesis-break triggers are a material regulatory
      action, a major partner exit, disclosed credit losses that impair capital,
      or a round below the prior $1.47 billion post-money mark.
    claimRefs: [CV011, CV012, CV013, CV014]
    figureRefs: [FV001]
  - id: diligence-asks
    title: Exit readiness and final diligence asks
    body: >-
      Exit readiness is not established by the Series B headline alone. The
      comparison set shows that private fintech financing can re-rate quickly:
      Crunchbase reported Mercury at a $5.2 billion valuation after its May
      2026 Series D, while its source also reported $650 million of annualized
      revenue in the third quarter of 2025.
      Those figures describe Mercury, not Lead Bank, and are a context point
      rather than a transferable multiple. Lead Bank diligence should obtain
      the current cap table, preferred terms, option pool, debt and capital
      requirements, audited revenue bridge, net interest margin, credit-loss
      history, top-partner concentration, regulatory examination findings, and
      a current financing or secondary price. Until those records are available,
      the       valuation stance is unclear rather than demonstrably attractive, and the
      main investment action is to preserve entry discipline.
    claimRefs: [CV010, CV015, CV017]

