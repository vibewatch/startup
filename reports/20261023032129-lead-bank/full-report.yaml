        title: Ownership, leadership, and financing
        blocks:
          - type: paragraph
            body: >-
              Jackie Reses led the 2022 acquisition and is identified as Lead Bank's CEO in the reviewed coverage. The
              acquisition was reported at $56 million, followed by a $70 million Series B that Lead said lifted
              post-money valuation to $1.47 billion. Coverage names ICONIQ and Greycroft as new investors and Andreessen
              Horowitz, Ribbit Capital, Coatue, Khosla Ventures, and Zeev Ventures as existing backers. Forbes reports
              $180 million of funding from Ribbit, Coatue, Khosla Ventures, and others, so the public record contains a
              total-capital figure that is not reconciled to the identified rounds. There is no retained source
              establishing the post-Series-B cap table, board composition, liquidation preferences, or control rights;
              these remain material diligence gaps for minority investors.
