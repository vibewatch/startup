chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Lead Bank is described as an FDIC-insured, state-chartered or chartered bank headquartered in Kansas City,
              Missouri, offering accounts, payments, card issuing, lending, and related banking-as-a-service
              capabilities through APIs. Forbes describes the bank as founded in 1928 and acquired by fintech executives
              in 2022, while the same page's statistics panel labels the founding year as 2022; this is a source-level
              inconsistency rather than a basis for choosing one date. The operating model is therefore best treated as
              a legacy bank acquired and repositioned for fintech infrastructure, with the legal charter and regulated
              balance-sheet role remaining central to its proposition. Industry research places sponsor-bank
              arrangements at the intersection of fintech distribution and regulated deposit, payment, and compliance
              infrastructure, while also warning that auditability and controls are becoming commercial differentiators.
              Lead's public evidence supports the product scope, but not a complete product-pricing or revenue-mix
              picture.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
