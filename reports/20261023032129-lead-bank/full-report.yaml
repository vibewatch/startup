  - id: FU001
    title: Customer journey from sponsor-bank sale to expansion
    type: journey-map
    summary: >-
      Named evidence supports a partner-led path from regulated infrastructure selection to multi-product and geographic
      expansion, while retention proof remains unavailable.
    data:
      items:
        - label: Institutional need
          title: Fintech needs a chartered partner
          detail: Buyer requires regulated access to accounts, cards, lending or payments.
          touchpoints:
            - Charter and FDIC-insured banking access
            - API-oriented integration
        - label: Program launch
          title: Named program deployment
          detail: Branch, Affirm, Ramp and Bridge/Visa-linked programs are publicly associated with Lead.
          touchpoints:
            - Card issuing
            - Embedded accounts
            - Stablecoin-linked payments
        - label: Workflow adoption
          title: End-customer use case
          detail: Programs serve workers, consumers, businesses or digital-asset users through a fintech front end.
          touchpoints:
            - Workforce payments
            - Consumer fintech
            - Cross-border or digital-asset payments
        - label: Expansion
          title: More products or markets
          detail: >-
            Public evidence points to vertical expansion, additional products and a reported 100-country rollout
            direction.
          touchpoints:
            - White-label products
            - Additional geographies
            - Business and personal banking cross-sell
        - label: Durability test
          title: Retention and concentration diligence
          detail: Public evidence does not disclose churn, renewal, utilization or Lead's share of anchor-customer volume.
          touchpoints:
            - Request contract and renewal data
            - Measure active programs and customer concentration
        - label: Refresh loop
          title: Quarterly customer review
          detail: >-
            The underwriting decision should be refreshed against customer-level operating data rather than announcement
            counts.
          touchpoints:
            - Review active-program register
            - Reconcile revenue and volume concentration
    approximationNotes: Conceptual evidence map only; stage order does not imply conversion, timing, or value magnitude.
