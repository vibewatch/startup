            body: >-
              The reviewed sources identify approximately 200 employees as of March 2026 and describe partnerships with
              Stripe and Visa around the stablecoin-linked Bridge card platform, plus a strategic banking relationship
              with Branch. Forbes also reports a December acquisition of Loop, a payments processor using stablecoin
              rails, but the source excerpt does not provide a year. These milestones indicate expansion from
              sponsor-bank infrastructure into payment processing and stablecoin-linked workflows, while the disclosed
