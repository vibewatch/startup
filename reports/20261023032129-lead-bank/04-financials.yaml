schemaVersion: "report-v2"
artifact: financials
slug: lead-bank
runDate: 2026-10-23
company:
  name: Lead Bank
chapter:
  number: 4
  title: Financials
  summary: Lead Bank has a disclosed BaaS and programmable-banking revenue model, but the assigned public evidence does not disclose revenue mix, realized pricing, margins, burn, runway, or customer concentration. The $70 million Series B and $1.47 billion post-money valuation provide financing context, not proof of cash available or operating performance.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Lead describes a programmable financial-infrastructure model in which partners
      use APIs and a regulated sponsor-bank platform to store money, move money, lend,
      and issue cards. The documentation identifies entities, accounts, account
      numbers, balances, and transactions as shared operating objects, and says a
      program may combine multiple product pillars. This supports a transaction- and
      program-based monetization hypothesis, but the public material does not disclose
      a price list, take rate, minimum commitment, realized revenue, or revenue
      recognition policy. Official positioning is therefore useful for mechanism, not
      for underwriting revenue or gross margin. Independent coverage reports the
      Series B and named partnerships, but repeats company-reported financing and
      strategy rather than supplying audited financial statements.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
  - id: unit-economics
    title: Sales efficiency and cost structure
    body: >-
      The strongest public operating signal is product breadth combined with
      compliance and integration work: Lead says its APIs are modular building blocks,
      while the documentation distinguishes executing from reporting APIs and notes a
      transition from a hybrid file-and-API model to a fully API-based model. That
      architecture can support repeatable program launches, but it also implies
      implementation, compliance, risk-management, and servicing costs that are not
      quantified in the assigned sources. There is no public CAC, payback, sales-cycle
      duration, gross margin, net interest margin, credit-loss ratio, servicing cost,
      or working-capital schedule here. The right underwriting posture is to treat
      unit economics as unavailable rather than infer SaaS-like margins from API
      language.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy
    title: Capital adequacy and financial diligence blockers
    body: >-
      Coverage reports that Lead raised $70 million in a September 2025 Series B at a
      $1.47 billion post-money valuation, led by ICONIQ and Greycroft with existing
      investors continuing to participate. That is evidence of external financing and
      investor support, not a cash-balance or runway disclosure. A tertiary source
      reports $778.9 million of assets at the August 2022 acquisition, but that
      historical figure cannot establish the current balance sheet. The assigned FDIC
      institutions API query returned an empty data array for the requested Lead Bank
      filter; this does not establish that the bank has no regulatory financial
      record, because the response may reflect query, naming, endpoint, or dataset
      limitations. Public evidence also does not establish debt obligations, planned
      use of proceeds, capital ratios, liquidity buffers, partner concentration, or the
      next financing trigger. These missing inputs are material for a sponsor bank
      exposed to compliance, credit, and operational scaling requirements.
    claimRefs: [CI009, CI010, CI011, CI012, CI013]
callouts:
  - calloutType: strength
    title: Clear infrastructure monetization mechanism
    body: Lead exposes programmable payments, accounts, lending, and card capabilities through APIs, creating a coherent platform basis for program and transaction revenue.
    claimRefs: [CI001, CI002]
  - calloutType: risk
    title: Financing is not runway
    body: The disclosed Series B amount and post-money valuation do not reveal cash on hand, burn, capital adequacy, or how much capital remains available for operating and regulatory needs.
    claimRefs: [CI009, CI010, CI012]
  - calloutType: recommendation
    title: Underwrite only after financial diligence
    body: Request audited or management financials, revenue and margin schedules, liquidity and capital data, partner concentration, and financing terms before assigning a financial valuation view.
    claimRefs: [CI007, CI011, CI012]
tables:
  - id: TI001
    title: Revenue streams and evidence status
    columns: [Stream, Mechanism, Unit or driver, Current public value/status, Quality, Diligence ask]
    rows:
      - ["Payments and money movement", "API-enabled storage and movement of funds", "Transaction or program activity", "Mechanism described; value undisclosed", "Company-described", "Obtain transaction volumes, fee schedule, and realized take rates"]
      - ["Card issuing", "Programmable card programs", "Cards, spend, and program activity", "Partnerships reported; revenue undisclosed", "Third-party reported from company releases", "Obtain issuer economics, interchange sharing, and partner minimums"]
      - ["Lending", "Loan origination and funding workflows", "Applications, accounts, and funded balances", "Workflow documented; loan book and income undisclosed", "Company-described", "Obtain interest income, fees, credit losses, and funding costs"]
      - ["Deposits and accounts", "Accounts, balances, and account numbers", "Deposits or account balances", "Product objects documented; balances and pricing undisclosed", "Company-described", "Obtain deposit beta, interest expense, and balance-sheet policy"]
    notes: "Public evidence describes product mechanisms and selected partnerships, not recognized revenue; null or undisclosed values must not be treated as zero."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization disclosure
    columns: [Item, Public list or contract price, Realized pricing, Discount or unknown, Underwriting implication]
    rows:
      - [API access, null, null, "Not disclosed in assigned sources", "Cannot model recurring platform fees"]
      - [Payments, null, null, "Transaction pricing and minimums unavailable", "Cannot estimate gross transaction contribution"]
      - [Cards, null, null, "Interchange, processor, and program economics unavailable", "Cannot estimate net card revenue"]
      - [Lending, null, null, "Rates, fees, losses, and funding spread unavailable", "Cannot estimate risk-adjusted lending income"]
    notes: "The official pages describe capabilities and implementation paths but do not provide a public price sheet; null means unavailable evidence, not free service."
    claimRefs: [CI004, CI007, CI008]
  - id: TI003
    title: Unit economics and capital adequacy evidence
    columns: [Metric, Value, Confidence, Why it matters, Diligence ask]
    rows:
      - ["Revenue or ARR", null, low, "Revenue quality and scale cannot be assessed", "Provide audited revenue by stream and recognition policy"]
      - ["Gross margin or net interest margin", null, low, "Platform and balance-sheet economics remain unpriced", "Provide margin bridge by product and period"]
      - ["CAC, payback, and sales cycle", null, low, "Growth efficiency is untested", "Provide cohort funnel, CAC, cycle length, and payback"]
      - ["Cash, burn, and runway", null, low, "Series B proceeds do not equal available liquidity", "Provide current cash, monthly burn, runway, and use of proceeds"]
      - ["Capital and credit-loss metrics", null, low, "Sponsor-bank scaling can require additional capital and controls", "Provide capital ratios, liquidity, delinquencies, charge-offs, and reserves"]
      - ["Assets", "$778.9 million at the August 2022 acquisition", low, "Historical scale does not establish the current balance sheet", "Provide current assets, deposits, equity, and net income from validated regulatory filings"]
    notes: "The $70 million Series B and $1.47 billion post-money valuation are financing context only; the asset figure is historical, and the assigned FDIC query returned no rows and does not prove absence of financial records."
    claimRefs: [CI007, CI009, CI010, CI011, CI012, CI013]
