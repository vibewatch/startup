          label: Partner program
          detail: "A fintech, consumer, or digital-asset program contracts and integrates with Lead."
        - id: entity
          label: Entity
          detail: "Lead's documentation says KYC and OFAC screening apply at the entity level."
        - id: account
          label: Account
          detail: "A financial product held by one or more entities."
        - id: balance
          label: Balance
          detail: "Current and available funds, including maintained subledger balances."
        - id: transaction
          label: Transaction
          detail: "A debit or credit posted to an account with lineage to the originating payment."
        - id: revenue-output
          label: Revenue output
          detail: "Fees, spreads, or other realized economics are not disclosed in the assigned sources."
    claimRefs: [CI005, CI008, CI004]
