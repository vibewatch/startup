evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: Current post-Series-B cap table, board roster, voting rights, and liquidation preferences
    whyItMatters: Control and downside allocation cannot be assessed from financing headlines alone.
    diligencePath: Request the latest capitalization table, charter, investor-rights agreement, and board materials.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: financials
    missingEvidence: Audited financial statements, revenue mix, net interest margin, credit losses, and cash-burn or runway detail
    whyItMatters: The valuation cannot be tested against operating performance or balance-sheet risk.
    diligencePath: >-
      Obtain audited statements, regulatory call reports, management accounts, and a bridge from financing proceeds to
      cash available.
    relatedQuestionRefs:
      - QO004
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: regulatory
    missingEvidence: BSA/AML program depth, regulatory examination outcomes, remediation history, and partner oversight controls
    whyItMatters: Sponsor-bank compliance capacity is central to the durability of the BaaS model.
    diligencePath: >-
      Review examination summaries, consent orders if any, compliance staffing, control testing, and partner-monitoring
      documentation.
    relatedQuestionRefs:
      - QO008
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: Complete current executive and board roster with biographies
    whyItMatters: Key-person dependence and functional coverage remain only partially observable.
    diligencePath: Obtain the current leadership page, board roster, and succession materials.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: customers
    missingEvidence: Customer count, revenue concentration, contract duration, minimums, and partner exit provisions
    whyItMatters: Partner-led growth can mask concentration and renewal risk.
    diligencePath: Request anonymized cohort, concentration, renewal, and contractual dependency schedules.
    relatedQuestionRefs:
      - QO005
      - QO006
      - QO008
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Lead-specific eligible partner universe, serviceable geographies, program capacity, pricing, revenue-share terms,
      and product-level revenue mix.
    whyItMatters: >-
      Global BaaS estimates establish category scale but cannot translate into Lead's serviceable market or expected
      share without operating denominators.
    diligencePath: >-
      Request management's market model, qualified pipeline by segment and geography, partner capacity plan, price
      cards, and revenue-share assumptions; reconcile them to audited revenue and program volumes.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      Comparable current price cards, minimums, discounts, implementation fees and realized take rates for Lead Bank,
      Column and Cross River.
    whyItMatters: Price and gross economics determine whether overlapping capabilities translate into a durable buyer advantage.
    diligencePath: >-
      Request anonymized contract schedules, fee cards, implementation statements of work and cohort-level realized
      economics from management.
    relatedQuestionRefs:
      - QP005
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Contract duration, exclusivity, renewal, migration timelines, churn and multi-homing evidence across Lead Bank's
      major fintech programs.
    whyItMatters: Without switching and retention data, the proposed compliance and integration moat remains a hypothesis.
    diligencePath: >-
      Obtain customer cohort retention, top-partner contract summaries, migration case studies and references from
      current and former customers.
    relatedQuestionRefs:
      - QP006
      - QP008
  - type: conflicting-data
    severity: minor
    topic: scale
    missingEvidence: >-
      A reconciled metric dictionary distinguishing Lead's official client assets, loan originations, API calls and end
      users from Sacra's adjusted revenue estimates.
    whyItMatters: >-
      Mixed definitions can create false scale comparisons with Column's estimated revenue or Cross River's cumulative
      loans.
    diligencePath: >-
      Request period definitions, accounting scope, client-versus-end-user denominators and third-party corroboration
      for each headline metric.
    relatedQuestionRefs:
      - QP003
  - type: missing-source
    severity: material
    topic: moat-risk
    missingEvidence: >-
      Independent customer or regulatory evidence comparing uptime, compliance outcomes, onboarding speed and incident
      history across BaaS providers.
    whyItMatters: Vendor-authored capability pages establish product claims but not relative execution or trust.
    diligencePath: >-
      Commission reference calls, review regulator correspondence and obtain service-level and incident disclosures
      under NDA.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: missing-source
    severity: blocking
    topic: revenue-quality
    missingEvidence: >-
      Audited or management financial statements with revenue by stream, recognition policy, gross margin, net interest
      margin, and period-over-period trends.
    whyItMatters: >-
      Without recognized revenue and margin data, the platform mechanism cannot be translated into revenue quality or a
      defensible operating valuation.
    diligencePath: >-
      Request the latest audited statements, monthly management accounts, revenue bridge, and product-level margin
