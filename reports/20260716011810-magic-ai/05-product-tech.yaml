company:
  name: Magic AI
chapter:
  number: 5
  title: Product & Technology
  summary: 'Magic''s technical story is coherent and ambitious: pre-training plus long-term memory, domain-specific reinforcement learning, ultra-long context, and inference-time compute aimed first at code generation and automated AI research. The public product gap is that the company still looks more like a frontier-model lab with developer-facing intent than like a broadly deployed enterprise platform. Its technology claims are strong enough to justify attention, but the maturity gap between research novelty and fully commercial product remains the central product-tech question.'
sections:
- id: product-scope-and-public-surfaces
  title: 'Public product scope: code generation remains the wedge inside a broader safe-AGI mission'
  body: 'Magic''s public product surface is narrower than its mission statement and broader than a simple coding copilot. The current homepage frames the company around safe AGI achieved by automating AI research and code generation. Earlier materials were more explicitly software-engineering focused, and the research posts around LTM-1 and LTM-2-mini show why: code is a domain where long-range context, evaluation, and iterative improvement can be turned into a tractable product wedge. That wedge remains visible in current role pages, which repeatedly mention user-facing systems on top of long-context models, APIs and backend services for AI-first experiences, post-training loops, evaluation frameworks, and data pipelines. In other words, the architecture is not just a single model; it is a stack that links foundational model work to product surfaces. What is still missing publicly is a clean generally available product page or transparent packaging that would make those surfaces easy to
    evaluate as a buyer rather than as an observer of research progress.'
  claimRefs:
