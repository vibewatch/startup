- id: technology-architecture-and-evals
  title: Technology architecture depends on long context, RL loops, infrastructure, and benchmark discipline
  body: 'The public architecture story has four recurring components. First is pre-training and data work, visible in Magic''s role descriptions and mission language. Second is ultra-long-context model design: LTM-1 established the long-context theme, and LTM-2-mini escalated it to a 100M-token public claim and 10 million lines of code framing. Third is post-training and reinforcement learning, which current roles describe in terms of reward signals, environments, long-horizon reasoning, self-play, and eval frameworks. Fourth is inference-time and systems engineering, including kernels, supercomputing, and large-scale platform infrastructure. That makes Magic''s product-tech stack more vertically integrated than a wrapper around third-party APIs. It also creates a demanding technical burden. To matter commercially, the model must do better on hard software engineering work, not merely on marketing demos. Public developer benchmarks such as SWE-bench, BigCodeBench, Aider leaderboards, HashHop,
    and LiveCodeBench underline how quickly the category is professionalizing around measurable coding tasks, reproducibility, and real-world code issues. Those benchmarks do not prove Magic wins them today, but they do show the standard the market increasingly expects. That emphasis on evaluation is especially important because long-context claims can sound impressive while hiding brittle performance on realistic software tasks. In this market, buyers increasingly expect models not only to read more files, but to reason correctly across them under reproducible test conditions and with reviewable outputs.'
  claimRefs:
  - CE010
  - CE011
  - CE012
  - CE013
  - CE014
  - CE015
  - CE016
  - CE017
  - CE018
  - CE019
  - CE020
  - CE021
  tableRefs:
