  productSummary: Magic builds frontier long-context models and user-facing coding systems intended to understand very large codebases, support complex multi-file software-engineering workflows, and automate parts of AI research.
  customerFocus: Large enterprises, platform teams, and technically sophisticated engineering organizations with expensive codebase-scale workflows.
  businessModel: Emerging B2B software / model-platform model aimed at selling premium coding and automation capability into enterprise engineering budgets, though public monetization detail is still limited.
  stage: Private, Series C
