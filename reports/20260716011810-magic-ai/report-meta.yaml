  topStrengths:
  - Magic made a genuinely differentiated long-context coding claim in 2024 rather than merely wrapping a third-party API.
  - Investor quality is exceptional, with Eric Schmidt, CapitalG, Sequoia, Atlassian, and other elite backers supporting the company.
  - 'The company still appears focused on a concrete product wedge: whole-codebase software engineering and automated AI research.'
  - Small-team intensity can be an advantage for frontier research execution when technical direction is correct.
  - The coding-AI category continues to command strong private-market appetite, preserving upside if Magic converts technical novelty into product traction.
  topRisks:
  - Public revenue, customer, and unit-economics disclosure remain too thin to underwrite the current valuation confidently.
  - Context-window differentiation may commoditize as larger labs and platform vendors extend agents, context, and distribution.
  - Enterprise trust, legal defensibility, and procurement readiness are not yet publicly legible enough for a premium software underwriting case.
  - Compute intensity and small-team breadth create meaningful execution and cost risk.
  - A high private mark increases downside if commercialization lags or future financings demand sharper proof.
  unresolvedGaps:
  - Current revenue, ARR, pricing realization, and pilot-to-production conversion.
  - Named production customers, deployment depth, and renewal behavior.
  - Training-data provenance, legal posture, and memorization / licensing safeguards.
  - Security architecture, admin controls, retention defaults, and customer-facing procurement package.
  - Cap-table preferences, dilution overhang, and other private-round economics that affect actual return potential.
