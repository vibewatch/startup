  - id: FE004
    title: 产品成熟度 / 能力图
    type: matrix
    summary: Magic 在研究野心上靠前，在公开商业化深度上落后。
    data:
      columns:
        - 研究野心
        - 产品界面清晰度
        - 信任 / 治理可见度
      rows:
