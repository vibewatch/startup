  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 如果前沿编码智能体规模化，法律和监管风险会从今天的可控状态迅速扩大
        blocks:
          - type: paragraph
            body: >-
              Magic 值得肯定，因为它比许多编码初创公司更早公开承认前沿模型风险。它的安全和 AGI-readiness
              材料明确讨论了危险能力评测、网络进攻风险、董事会报告，以及在缓解措施未就绪时暂停开发的可能性。这明显好过把编码模型假装成无风险生产力软件。但这对尽调来说只是起点。公开记录没有显示成熟的训练数据治理项目、详细授权立场，或围绕数据来源和客户赔偿的企业级政策文件。这很重要，因为围绕生成式
              AI 训练的法律环境仍未稳定。U.S. Copyright Office 的 2025 训练报告和 Andersen 诉讼记录清楚表明，受版权保护训练数据、记忆化和下游市场伤害仍是活问题。对 Magic
              而言，风险敞口在概念上比通用聊天机器人更尖锐，因为产品故事围绕代码和自动化软件工程展开，而授权、开源和专有材料在这些领域挨得很近。EU AI Act 也提高了欧洲高级 AI 部署的基准合规负担。这些都不能证明
              Magic 当前不合规，但意味着投资人应把法律可防守性视为一阶尽调事项，而不是产品市场契合后再处理的文书工作。
