        title: 公开客户证明是相对于对手最大的缺口
        blocks:
          - type: paragraph
            body: >-
              客户故事里最强的负面信号很简单：审阅过的公开材料仍未识别出一个具名 Magic 客户。Magic
              的网站、博客、安全页面和融资报道强调技术野心、资本、算力和招聘，但没有强调部署、客户标识或案例研究。缺席不能证明公司没有试点，却意味着外部投资人无法确认长上下文能力是否已经转化为可重复客户价值。与竞争对手的反差很明显。Cursor
              发布了广泛客户页面，列出 Stripe、Brex、Coinbase、Rippling 等例子。Devin 既发布一般客户页面，也发布 Nubank
              代码迁移工作等详细案例。即使平台供应商和基础设施提供商，也会发布客户故事，说明买家如何在内部解释 ROI。从客户尽调看，Magic
              因而不仅在证明广度上落后于类别领导者，也在可引用性上落后。这让公司更难在收入质量、扩张潜力和预算粘性上被承销。公开证明在买家旅程内部同样重要：技术拥护者往往需要可引用案例，才能说服安全、财务或采购利益相关方，一个新类别值得标准化。
