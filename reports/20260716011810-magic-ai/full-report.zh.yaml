      - number: '2.2'
        title: 买家、用户与付款方地图：经济买家通常高于日常用户
        blocks:
          - type: paragraph
            body: >-
              Magic 这类产品的日常用户是软件工程师，但经济买家通常是工程负责人、平台团队、CTO 组织，或试图压缩交付周期的企业 IT 职能。这个分裂很重要，因为 Magic
              的切口在某些环境里更容易被证明合理：代码库理解、迁移风险、上手成本和调试延迟已经上升为董事会级或 VP 级痛点。独立开发者可能喜欢长上下文，但 Fortune 500
              平台团队会把它视为生产力和降风险工具。公开采用信号显示，这条预算路径正在变真：Microsoft 披露 GitHub Copilot 付费订阅者超过 1.8 million、企业客户超过 77,000；Stack
              Overflow 2024 调查发现，多数开发者已经在工作流里使用或计划使用 AI
              工具。不过，愿意试用不等于愿意标准化。买家越来越想要使用分析、安全控制、访问控制，以及工具能处理复杂任务而不只是自动补全的证明。这塑造了一种市场结构：高端编码智能体预算会先集中在拥有工程管理工具预算的大型组织，再扩散到
              SMB 开发者长尾。
