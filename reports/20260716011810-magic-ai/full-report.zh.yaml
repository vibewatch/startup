            - 中低
        - label: AI 原生编码产品
          values:
            - 中高
            - 高
            - 中高
        - label: 捆绑式既有厂商
          values:
            - 中
            - 高
            - 高
    approximationNotes: 取值是序数型相对判断，基于本章审阅的公开产品界面和此前竞品分析。
