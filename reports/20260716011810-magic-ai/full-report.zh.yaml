      - number: '8.2'
        title: 情景区间很宽：可比样本证明市场愿意为上行付费，却没有给出 Magic 专属证据
        blocks:
          - type: paragraph
            body: >-
              可比样本是双刃剑。一方面，AI 编程已经成了私人软件市场估值最高的类别之一。Cursor、Cognition、Codeium / Windsurf 都拿到或被报道接近数十亿美元估值；Microsoft 对
              Copilot 的披露也说明，平台级分发能把编程 AI 推到极大规模的战略位置。上述事实解释了为什么 Magic 2024
              年估值一出来并不荒谬。投资人并不是凭空发明一个类别。另一方面，如今最强的可比公司大多把高估值和比 Magic 公开证据更扎实的商业化进展绑在一起。Cursor 发布客户证据和定价。Cognition
              扩展了更宽的智能体叙事，并持续吸引资本。Codeium / Windsurf 受益于战略稀缺性和收购兴趣。Microsoft、Amazon、Google、OpenAI、Anthropic 的平台捆绑，也让市场比
              100M-token 主张显得独特稀奇时更难打。因此，我们的区间保持宽。乐观情景下，Magic
              把研究深度转成高端企业切入点，估值重定到上一个公开标记之上。基础情景下，公司仍有价值，但在产品证据变硬前，估值大致停在或小幅高于最近引用标记。悲观情景下，上下文窗口差异化比商业化成熟更快商品化，估值回落到更小的研究溢价。情景区间因此不是电子表格算出来的，更多取决于里程碑概率。
