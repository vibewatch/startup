  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型和商业化状态：市场已经有价格，但 Magic 没有公开价格
        blocks:
          - type: paragraph
            body: >-
              核心财务难题在于，Magic 仍没有公开商业化界面。公司展示了使命、模型、招聘计划和资本基础，但没有产品价格、API 价格、席位价格或客户案例，能让外部投资人估算当前收入。TechCrunch 的 August
              2024 融资报道称 Magic 没有什么收入可言；截至 July 2026 审阅的官方材料也没有用更新后的商业指标替代这一点。这不代表 Magic
              以后不能变现，而是公开记录仍只支持未来态收入逻辑，不支持当前收入逻辑。最合理的变现路径是企业席位制软件、按使用量计费的智能体或模型访问，或与代码库理解和迁移工作流绑定的大客户试点合同。但这些路径是从类别推断出来的，不是
              Magic 自己披露的。相比之下，竞争对手已经公布足够的定价或打包细节，让买家能立即比较成本和范围。财务上，这意味着 Magic
              首先仍是研究资产，其次才是可见软件业务。这个缺口也影响进入市场时点。在竞争对手公布价格和免费层的类别里，缺少公开报价会拖慢试验，并让收入预测几乎完全依赖管理层私下说法。
