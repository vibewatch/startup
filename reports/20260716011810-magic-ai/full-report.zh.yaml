            body: >-
              Magic 面对的不是一个清晰同业集合。它直接竞争的是 Cursor、Windsurf/Codeium、Devin 等独立 AI-native 编码产品，大家都承诺让软件工程师更快。它也间接但强力地与
              GitHub Copilot、Amazon Q Developer、Gemini Code Assist、Claude Code
              等既有厂商和平台供应商竞争，后者能把编码辅助和更广的生态触达结合起来。这几类供应商很重要，因为它们赢的原因不同。Cursor 和 Devin 拼工作流野心与产品速度。GitHub、AWS 和 Google
              拼分发、采购熟悉度，以及与现有企业技术栈的集成。Anthropic 则靠模型质量和智能体开发者工作流竞争。Magic
