    rows:
      - - 客户
        - 具名生产账户、ROI、推广深度、续约信号
        - 决定产品是否已经从研究跨到持久价值
        - 要求安排客户访谈和使用指标
      - - 收入 / 变现
        - ARR、定价兑现、试点到生产的转化
        - 需要用经营证据替代里程碑猜测
        - 要求提供董事会材料或财务包
      - - 法律 / 数据
        - 数据集来源、授权立场、记忆化测试、律师备忘录
        - 是前沿代码模型最大的剩余下行桶
        - 要求审查法律工作流
      - - 安全 / 采购
        - 管理员控制、留存默认项、审计日志、合同条款、认证路线图
        - 没有这一层，企业买方可能停滞
        - 要求审查安全架构和标准合同集
      - - 算力经济性
        - 产能合同、利用率、单个有效长上下文工作负载成本
        - 决定护城河能否以经济方式服务
        - 要求基础设施和财务敏感性模型
    notes: 这些请求刻意收窄：只要回答得好，每一项都能实质性重估估值讨论。
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV036
      - CV037
