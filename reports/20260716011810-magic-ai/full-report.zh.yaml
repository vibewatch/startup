      - number: '5.2'
        title: 技术架构依赖长上下文、RL 循环、基础设施和基准纪律
        blocks:
          - type: paragraph
            body: >-
              公开架构故事有四个反复出现的组件。第一是预训练和数据工作，可从 Magic 的职位描述和使命语言中看到。第二是超长上下文模型设计：LTM-1 确立了长上下文主题，LTM-2-mini 则把它升级成
              100M-token 的公开主张和 10 million
              行代码叙事。第三是后训练和强化学习，当前职位用奖励信号、环境、长程推理、自博弈和评测框架来描述。第四是推理时和系统工程，包括内核、超级计算和大规模平台基础设施。这让 Magic 的产品技术栈比套在第三方 API
              上的包装层更垂直整合，也带来很重的技术负担。要在商业上有意义，模型必须在困难软件工程工作上做得更好，而不只是赢在营销演示。SWE-bench、BigCodeBench、Aider
              leaderboards、HashHop 和 LiveCodeBench 等公开开发者基准凸显出，这个类别正迅速围绕可衡量编码任务、可复现性和真实代码问题专业化。这些基准不能证明 Magic
              今天能赢，但显示了市场越来越期待的标准。评测尤其重要，因为长上下文主张听起来很强，却可能掩盖现实软件任务中的脆弱表现。在这个市场里，买家越来越期待模型不只是能读更多文件，还要在可复现测试条件下跨文件正确推理，并给出可审查输出。
