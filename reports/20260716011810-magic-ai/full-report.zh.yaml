        title: 创始人、团队设计与运营形态
        blocks:
          - type: paragraph
            body: >-
              公开记录显示，Magic 的创始人智识信号异常强，但常规运营披露有限。Eric Steinberger 一直被标注为联合创始人兼 CEO；TechCrunch 和 Sequoia 材料把他与 Meta
              FAIR、早期和 Noam Brown 的合作，以及早于 Magic 的长期 AGI 关注联系起来。Sebastian De Ro 一直被列为联合创始人，TechCrunch 报道称他曾任 FireStart
              CTO。当前招聘文案显示，公司的组织仍明显偏研究：开放职位强调研究工程、评测、内核、长上下文推理、预训练系统、开发者工具、超级计算基础设施，以及把模型能力转成用户工作流的产品团队。这不像已经规模化的企业销售组织，更像一家小型前沿实验室在有选择地产品化研究成果。因此，August
              2024 披露的最后一个精确员工数 23 人，和当前网站反复提到的“小”团队在方向上并不矛盾，尽管公司没有公布当前精确员工数。
