      - CR008
      - CR013
      - CR019
      - CR025
      - CR037
      - CR042
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: Magic 的主要风险沿几条通道传导：法律不确定性、安全 / 采购摩擦和算力依赖，都会压制客户采用、烧钱速度和估值支撑。
    data:
      nodes:
        - id: legal
          label: 法律 / IP 不确定性
          detail: 训练数据和许可问题可能带来成本、延迟或合同摩擦。
          tone: warning
        - id: security
          label: 安全 / 信任缺口
          detail: 公开信任态势偏薄，可能拖慢以代码为核心产品的采购。
          tone: warning
        - id: compute
          label: 算力依赖
          detail: GPU 产能和基础设施经济性同时影响开发速度与服务成本。
          tone: warning
        - id: customer
          label: 客户采用
          detail: 企业铺开取决于法律风险可接受度、信任控制和可用且可靠的体验。
          tone: warning
        - id: burn
          label: 烧钱速度 / 经营杠杆
          detail: 收入放大前，延迟、补救和基础设施成本可能叠加。
          tone: negative
        - id: valuation
          label: 估值支撑
          detail: 如果采用或防御性仍未验证，研究溢价会被压缩。
          tone: negative
      edges:
        - from: legal
          to: customer
        - from: legal
          to: burn
        - from: security
          to: customer
        - from: security
          to: burn
        - from: compute
          to: customer
        - from: compute
          to: burn
        - from: customer
          to: valuation
        - from: burn
          to: valuation
    approximationNotes: 图中编码的是压力方向，而不是每条因果链的估计强度。
    claimRefs:
      - CR012
      - CR018
      - CR023
      - CR027
      - CR032
      - CR040
      - CR042
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Magic 的运营核心依赖算力、基础设施、产品化和客户信任的协同推进；任何一个节点偏弱都会拖慢商业化。
    data:
      nodes:
        - id: gpu
          label: GPU / 硬件层
          detail: 前沿训练和长上下文推理需要稀缺且昂贵的硬件。
          tone: warning
        - id: cloud
          label: 云 / 基础设施层
          detail: 资源供给、网络、存储和编排落在超大规模云厂商或混合基础设施上。
          tone: warning
        - id: product
          label: 产品层
          detail: 面向用户的系统必须把模型质量转成可靠工作流。
          tone: warning
        - id: trust
          label: 信任 / 合规层
          detail: 安全、隐私和采购准备度决定企业铺开。
          tone: warning
        - id: magic
          label: Magic 运营核心
          detail: 小团队协调模型、基础设施、产品和安全工作。
          tone: positive
        - id: outcomes
          label: 商业结果
          detail: 部署、续约和估值支撑都依赖所有上游层。
          tone: warning
      edges:
        - from: gpu
          to: magic
        - from: cloud
          to: magic
        - from: product
          to: magic
        - from: trust
          to: magic
        - from: magic
          to: outcomes
        - from: gpu
          to: outcomes
        - from: trust
          to: outcomes
    approximationNotes: 这张依赖图概括关键运营层，而不是合同排他性。
    claimRefs:
      - CR020
      - CR022
      - CR024
      - CR030
      - CR031
      - CR033
      - CR034
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 建议保持谨慎，因为品类上行和技术可信度同时遇到公开商业化证据偏薄、私募价格锚点偏高。
    data:
      nodes:
        - label: 技术信号：100M-token 编码叙事和前沿招聘广度
        - label: 品类支撑：编码 AI 同行仍能拿到数十亿美元估值
        - label: 证据缺口：无公开收入披露，也无具名 Magic 生产客户
        - label: 风险负荷：法律、信任和算力问题仍是一阶变量
        - label: 入场纪律：最后被引用估值已计入大量未来成功
        - label: 建议：观察 / 继续研究，除非私下尽调大幅提高证据质量
    approximationNotes: null
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV009
      - CV010
      - CV012
      - CV035
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 最大摆动因素是客户证据、法律可防御性、算力经济性，以及上下文护城河相较商业化更成熟的对手是否仍有差异。
    data:
      items:
        - label: 可背书生产客户出现
          value: 2
        - label: 展示强法律 / 数据防御性
          value: 1
        - label: 算力经济性仍然沉重
          value: -1
        - label: 护城河受到套件和智能体挤压
          value: -1.5
        - label: 信任套件快速通过采购
          value: 1
    approximationNotes: 取值是相对于当前公开锚点的方向性估值影响分数，以十亿美元计；它们反映情景差值，不是管理层指引。
    claimRefs:
      - CV020
      - CV021
      - CV023
      - CV028
      - CV031
      - CV039
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支持很宽的估值带，因为 Magic 仍是按里程碑定价的资产，而不是能干净建模的收入业务。
    data:
      items:
        - label: 悲观
          low: 0.4
          mid: 0.6
          high: 0.8
        - label: 基准
          low: 1
          mid: 1.4
          high: 1.8
        - label: 乐观
          low: 3
          mid: 4
          high: 5
    approximationNotes: 取值是以十亿美元计的宽估值区间，来自可比私募估值和里程碑转化逻辑，而不是 DCF。
    claimRefs:
      - CV018
      - CV019
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: Magic 在技术野心和投资人质量上得分较好，但公开证据、经济性可见度和当前入场吸引力偏弱。
    data:
      items:
        - label: 技术差异化
          value: 8
        - label: 品类顺风
          value: 8
        - label: 投资人质量
          value: 9
        - label: 商业证据
          value: 3
        - label: 证据质量
          value: 4
        - label: 当前估值吸引力
          value: 3
    approximationNotes: 分数是 0-10 的序数型尽调判断，由保留下来的证据综合而成，不是管理层提供的 KPI。
    claimRefs:
      - CV002
      - CV004
      - CV009
      - CV011
      - CV015
      - CV035
