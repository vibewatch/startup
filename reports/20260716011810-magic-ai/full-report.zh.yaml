    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命与当前公开定位
        blocks:
          - type: paragraph
            body: >-
              Magic 的公开身份已经超出早期“软件工程 AI 同事”的框架。现在的官网、安全页面、AGI readiness policy 和招聘材料里，公司不再只把自己说成代码助手创业公司，而是提出用自动化 AI
              研究和代码生成来构建安全
              AGI。它把前沿规模预训练、领域专用强化学习、超长上下文和推理时计算结合起来。这个转向很关键，因为后文解读产品主张和估值时，基准都变了。投资人承销的不只是一个开发者工具工作流，而是一个前沿模型研究计划；编码只是通往更广泛自主推理的第一条商业上更可落地的路径。同时，Magic
              仍把这份野心锚在软件工程上：多页官方材料都称公司在构建长上下文模型、面向开发者的工具，以及建立在这些模型之上的用户系统。换句话说，代码产品故事没有消失，只是被放进了更大的安全 AGI 叙事里。
