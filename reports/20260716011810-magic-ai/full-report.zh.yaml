  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：广义开发者工具 vs. Magic 更窄的全代码库切口
        blocks:
          - type: paragraph
            body: >-
              分析 Magic 时，应把它放在 AI 编码和开发者生产力软件里，而不是把它当作通用 AGI 市场代理。纳入的支出，是帮助专业工程师借助模型写代码、审查、调试、测试、重构、写文档和交付的软件，包括 IDE
              copilot、感知仓库的聊天、编码智能体、云端任务工作器，以及可基准测试的代码推理工作流。不包括通用消费者聊天机器人、原始模型基础设施，或主要面向非技术用户的 low-code
              工具。在这个已经很宽的类别内，Magic 瞄准的是最难的切片之一：拥有超大代码库、长依赖链和复杂迁移的团队。若模型能比普通 IDE copilot 理解多得多的上下文，才可能支撑高端预算。因此，广义 AI 编码
              TAM 数字有方向性参考价值，但还不够。最宽的市场研究描绘的是数十亿美元 AI 代码工具类别；更窄的研究则切出小得多的生成式编码细分。差异本身很关键：Magic
              的商业逻辑不太取决于一般开发者需求是否存在，而更取决于全代码库问题是否足够痛，能否在前沿实验室把功能吸收之前，撑起一个差异化类别。
