  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议应保持价格敏感，因为技术质量和估值支撑不是一回事
        blocks:
          - type: paragraph
            body: >-
              正确起点，是把公司质量和入场质量拆开看。Magic 值得尊重：公司拿到顶级投资人的资本，2024
              年提出真正有辨识度的长上下文主张，并且仍把自己定位为前沿研究机构，而不是浅层封装产品。在投资人常常愿意为品类领导权可能性付费的市场里，上述事实有分量。但它们不能直接回答投资问题。公开证据仍未显示具名生产环境客户、足够有意义的披露收入，或能支撑标准
              SaaS 式投资测算的运营指标。因此，估值问题从收入倍数转向里程碑定价：投资人该为“全代码库 AI 软件工程”这个研究阶段期权付多少钱？我们的答案是，期权确实存在，但当前公开证据更支持纪律，而不是追高。按
              2024 年 8 月的估值标记，Magic 实际上是在按技术可选性、投资人信念，以及“上下文规模优势能在既有巨头追上前转化为产品杠杆”这个判断来定价。到了 2026 年 7
              月，这个类别更拥挤、商业化更成熟、基准测试更密集。门槛因此抬高。除非新投资人拿到客户牵引、法律可防御性和企业信任就绪度上的强私下证据，审慎建议应是继续研究 / 跟踪，而不是只因为其他 AI
              编程公司估值很高就追逐私人市场溢价。
