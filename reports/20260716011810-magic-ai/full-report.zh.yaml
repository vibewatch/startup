  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 即使实际公开客户不可见，目标客户也可见
        blocks:
          - type: paragraph
            body: >-
              Magic 的理想客户画像比当前客户名单更容易推断。公开产品叙事、融资故事和招聘计划都指向成熟工程组织，而不是业余编码者。拥有庞大 monorepo
              的大型企业、背负迁移或调试负担的平台团队，以及研究密集型技术组织，最符合公司的长上下文卖点。这些买家不太在意通用代码补全，更在意全代码库理解、跨文件推理、上手、现代化改造和工程杠杆。可能的采用路径也遵循标准企业
              AI 模式：先由开发者试验，再在困难工作流上给出团队级证明，然后进入安全和采购审查，最后才是预算标准化。这条路径很关键，因为用户和付款方很少是同一个人。工程负责人、平台团队、CTO
              组织或转型预算，是最可能的付款方；开发者则是日常用户。理论上，Magic 的产品可以很好地适配这条路径，但公开记录仍让理论远远领先于证明。实际含义是，Magic
              可能不需要数百万休闲用户也能具备商业意义。它需要较少数量但技术成熟的账户，把代码库级理解视为有意义的预算项，而不是锦上添花的功能。这是一个更窄的市场，但一旦证明出现，合同价值和扩张潜力可能很高。
