        title: 成本结构和单位经济代理指标指向极高资本强度，但公开效率证明有限
        blocks:
          - type: paragraph
            body: >-
              公开信号指向一个非常昂贵的运营模式。Magic 的 August 2024 帖子把 23 人员工数披露和 8,000 张 H100 放在一起，并描述了 Google Cloud / Nvidia
              支持的基础设施建设。当前职位描述仍集中在预训练数据、RL 系统、产品工程和长上下文模型工作，软件工程岗位薪资区间大约从 $200,000 到
              $550,000，另加股权。这组信息意味着，成本基础主要由算力、模型训练和高薪技术人才驱动，而不是由规模化销售组织驱动。但投资人仍无法承销经典单位经济。没有公开毛利率、推理成本披露、NRR、ACV、销售效率数据，也没有可用来衡量研究支出的清晰收入分母。公开软件和
              AI 平台可比公司至少公布定价或经审计财务报表；Magic 没有。因此，最好的公开代理指标不是毛利率，而是资本强度：巨额融资对应极小的披露团队和没有可见收入基准。这支持把 Magic
