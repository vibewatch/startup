        title: 执行风险被算力依赖、小团队广度和估值压力放大
        blocks:
          - type: paragraph
            body: >-
              最后一类风险是执行。Magic 的 August 2024 帖子称，公司在最近 $320 million 投资后有 23 人，并可使用 8,000 张
              H100。这个组合很亮眼，但也很说明问题：相对于仍需协调的资本、基础设施和商业化工作，公司规模极小。当前招聘页面覆盖产品、预训练、推理和 RL 系统、环境，以及广泛软件工程，意味着多个关键层仍在同时建设。来自
              Eric Schmidt、CapitalG、Sequoia、Atlassian
              等的资本降低了近期融资风险，但也抬高了缓慢或含糊商业转型的代价。这种规模的团队在研究上可能是优势；但若产品化、企业信任、客户成功和算力运营都需要同时成熟，就会变成弱点。依赖图也很关键。前沿 GPU
              可获得性、超大规模云厂商经济性和基础设施设计选择，会同时影响训练速度、推理成本和可用时间。由于公开客户证明仍薄，外部投资人仍无法判断这些技术投入是否正在转化为持久需求。结果是一种典型前沿 AI
              张力：资本和野心能买时间，但买不来证据。Magic 仍必须证明，它的技术边缘能经受采购、部署和商业化现实。
