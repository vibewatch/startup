      - number: '8.3'
        title: 最终判断取决于一小组证据：它们要么验证、要么击穿研究溢价假设
        blocks:
          - type: paragraph
            body: >-
              这不是“多做点尽调更好”的案子。它决定这是一笔可辩护的私人入场，还是一个故事驱动的押注。如果管理层能拿出几件具体东西，投资假设会明显改善：可做背书的生产客户；安全和采购异议正在被清除的证据；关于训练数据和法律暴露的可防御叙事；以及一套经济模型，证明长上下文性能可以在不引发灾难性成本的情况下交付。若上述证据在私下存在，Magic
              仍可能以正在成形的前沿软件平台身份支撑强估值。若不存在，反论点就强很多。反论点不是 Magic
              质量低，而是市场可能把实验室优势按已经可重复的软件业务来资本化。实验室优势和可重复软件业务的区别，关系到入场纪律，也关系到退出逻辑。没有收入或客户证据，标准持有期回报模型除了下一轮更高价格融资外，几乎没有依据。因此，真正的投资测算需要里程碑转化，而不只是更多知名投资人或更惊艳演示。最关键的击穿触发点很容易说清：没有有意义的商业化证据，没有买方看得懂的信任包，没有可防御的法律姿态，也看不到大型实验室扩展上下文和智能体质量后技术护城河仍然独特。如果四项同时失效，溢价应大幅压缩。
