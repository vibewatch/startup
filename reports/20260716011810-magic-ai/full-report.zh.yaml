companyProfile:
  summary: >-
    Magic AI 是一家位于 San Francisco 的私营前沿模型公司，由 Eric Steinberger 和 Sebastian De Ro 于 2022 年创立。它对外讲述的故事把安全 AGI
    野心和一个具体的编码切口放在一起：长上下文模型和面向开发者的系统，目标是跨整个代码库推理、自动化软件工程工作，并最终支持自动化 AI 研究。以这么早的商业阶段而言，公开融资证据异常强，包括 August 2024 披露的最近一笔
    $320M 投资，以及公司声称的累计融资 $515M；但公开经营基础远不如融资标题扎实，因为收入、具名客户和企业部署细节仍大多没有披露。
