      - number: '5.3'
        title: 信任姿态和开发阶段仍然混合：治理有思考，商业成熟度有限
        blocks:
          - type: paragraph
            body: >-
              与许多研究阶段编码初创公司相比，Magic 已发布更多安全和治理材料。安全页面、AGI Readiness Policy
              和安全联系披露，至少显示了公司公开承诺做危险能力评测、分阶段部署思考，以及基本安全报告通道。这很重要，因为代码生成系统若草率发布，会制造运营和安全风险。同时，Magic
              的公开信任控制仍比商业化最好的企业级对手浅。当前公开材料没有提供 Cursor、GitHub Copilot
              或主要平台供应商直接展示的那种管理员、审计、留存或隐私控制深度。因此，开发阶段证据同时指向两边：研究复杂度高，商业化层仍有限。公开来源中可见的路线图也与这个判断一致。Magic 从 2023 年的 Series
              A 愿景和 LTM-1，走到 2024 年的 AGI readiness 和 LTM-2-mini；到 2026
              年仍在产品、预训练、RL、评测和基础设施上深度招聘。这种招聘广度是技术认真度的好信号，也提醒外界产品栈仍在建设。换句话说，Magic
              可能已经有可信的内部技术栈，但外部产品契约还不完整。剩余工作不只是提升模型质量，还包括买家可理解性、部署细节和运营信任文档。这个缺口很实质。
