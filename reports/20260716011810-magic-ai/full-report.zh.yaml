        - id: data
          label: 数据管道
          tone: positive
        - id: compute
          label: 算力 / 内核 / 基础设施
          tone: warning
        - id: bench
          label: 基准测试 + 评估
          tone: neutral
        - id: ux
          label: 产品 UX + API
          tone: neutral
        - id: trust
          label: 安全治理 + 安保态势
          tone: warning
      edges:
        - from: data
          to: compute
          label: 高效训练
        - from: compute
          to: bench
          label: 验证能力
        - from: bench
          to: ux
          label: 交付可用产品
        - from: ux
          to: trust
          label: 必须可治理
    approximationNotes: 每项依赖都有公开可见证据，但内部运营指标并不公开。
    claimRefs:
