      - number: '1.3'
        title: 资本形成、算力策略与战略利益相关方
        blocks:
          - type: paragraph
            body: >-
              按私营公司标准，Magic 的融资和基础设施故事属于顶级；按常规尽调标准，它仍异常不透明。August 2024 官方材料披露了最近 $320 million 投资，并称累计融资达到 $515
              million；同时期 TechCrunch 报道则把累计金额放在接近 $465 million，并称无法确认投后估值。之后一个分析型二手来源称该轮估值大约 $1.5
              billion，这和更广泛的市场传闻一致，但不是公司一手文件或一手公告。这个差异很重要：后文应把 2024 估值视为被广泛引用，而不是一手披露。真正一手披露的是股权结构表的战略质量和算力计划。2024 年公告把
              Eric Schmidt、Jane Street、Sequoia、Atlassian、CapitalG、Nat Friedman、Daniel Gross 和 Elad Gil
              与公司联系起来；同一天的研究帖还宣布了 Google Cloud 和 Nvidia 支持的超级计算机建设。两者放在一起看，投资人资助的不只是模型
              R&D，也是在资助让超长上下文主张具备经济可信度所需的异常昂贵基础设施。
