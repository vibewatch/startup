      - number: '7.2'
        title: 代码智能体在信任控制对买家可读之前就处理敏感上下文，安全和运营风险因此升高
        blocks:
          - type: paragraph
            body: >-
              从运营上看，Magic 正在把一类困难系统产品化。长上下文主张有差异化，但也意味着异常内存压力、容错问题和高吞吐基础设施需求。Magic 自己的招聘信息也这样写：长时间运行任务、大型 GPU
              集群、检查点、恢复和基础设施可复现性是反复出现的主题。这让可靠性风险成为结构性问题，而不是偶发问题。安全侧同样重要。代码智能体靠近仓库、secret、内部架构和工具执行。GitHub、GitLab、AWS、Google、OpenAI、Devin
              和 Cursor 的行业信任中心与安全页面显示，企业买家现在期待的基线是明确安全控制、合规语言、管理员姿态和面向事件的文档。Magic
              今天的公开安全界面薄得多，主要限于安全叙事和一个最小化安全联系页面。这个缺口对研究阶段公司可能完全正常，但若一个供应商要求企业把专有软件资产交给前沿系统信任，就不正常。额外复杂性来自智能体失败模式。面向可使用工具的智能体的安全指引越来越强调
              prompt injection、token theft、tool misuse 和 indirect instruction attacks。如果 Magic
              的产品层扩张快于信任层，这些担忧会拖慢采购，或迫使昂贵的重构。
