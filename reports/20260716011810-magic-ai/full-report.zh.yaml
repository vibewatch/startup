  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 残余严重性最高的类别是训练数据 / IP、企业信任和算力依赖；Magic 有一些治理缓释，但公开运营证据仍然偏薄。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
        - 残余严重性
      rows:
        - label: 训练数据 / IP 敞口
          values:
            - label: 中高
              tone: warning
            - label: 高
              tone: negative
            - label: 低中
              tone: neutral
            - label: 高
              tone: negative
        - label: 企业安全 / 采购缺口
          values:
            - label: 高
              tone: negative
            - label: 高
              tone: negative
            - label: 低中
              tone: neutral
            - label: 高
              tone: negative
        - label: 算力集中 / 成本
          values:
            - label: 中高
              tone: warning
            - label: 高
              tone: negative
            - label: 中
              tone: warning
            - label: 中高
              tone: warning
        - label: 小团队执行广度
          values:
            - label: 高
              tone: negative
            - label: 高
              tone: negative
            - label: 中
              tone: warning
            - label: 中高
              tone: warning
        - label: 治理滞后于能力
          values:
            - label: 中
              tone: warning
            - label: 中高
              tone: warning
            - label: 中
              tone: warning
            - label: 中
              tone: warning
    approximationNotes: 这张热力图是定性且有来源支撑的；它概括风险标签，而不是概率模型。
    claimRefs:
