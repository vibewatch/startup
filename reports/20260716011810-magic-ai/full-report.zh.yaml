            body: >-
              Magic 的生存能力可能强于大多数研究阶段 AI 初创公司，原因很简单：披露融资基础相对于小团队规模非常庞大。官方材料称累计融资达到 $515 million，最新披露投资为 $320
              million。即使烧钱很高，这也应当为持续模型研究和产品探索提供相当长的现金跑道。但公开资本强不等于财务清晰。公司仍没有披露现金余额、月度烧钱、现金跑道估计、债务负担或下一轮触发条件，也没有公开 IPO
              信号，更没有证据表明 Magic 已从研究声望跨入可重复软件经济。落实到尽调，财务结论很直接：资本充足性大概率是优势，商业化证据仍是主要阻碍；除累计融资外，几乎所有重要承销输入仍是私有信息。在 Magic
              披露收入、定价、客户队列或基于使用量的效率指标前，公司必须更像未来产品化期权那样被估值，而不是像当前软件运营商那样被估值。即便对公开记录作慷慨解读，也只能支持一个窄结论：Magic
              大概率有足够钱继续建设，但没有足够披露让外部判断建设过程是否经济高效。
