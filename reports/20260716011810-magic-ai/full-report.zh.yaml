  - id: FU001
    title: 客户旅程图
    type: flow
    summary: 可能路径从开发者好奇走向企业标准化，而 Magic 的公开证据大多停在旅程早段。
    data:
      nodes:
        - id: interest
          label: 开发者 / 团队兴趣
          tone: neutral
        - id: pilot
          label: 困难工作流试点
          tone: warning
        - id: review
          label: 安全 + 采购审查
          tone: warning
        - id: deploy
          label: 生产部署
          tone: neutral
        - id: expand
          label: 扩张 + 标准化
          tone: positive
      edges:
        - from: interest
          to: pilot
          label: 证明价值
        - from: pilot
          to: review
          label: 通过治理审查
        - from: review
          to: deploy
          label: 购买并部署
        - from: deploy
          to: expand
          label: 续约并扩展
    approximationNotes: 阶段来自品类采购模式推断，而不是 Magic 已披露的漏斗数据。
    claimRefs:
      - CU004
      - CU007
      - CU008
      - CU009
      - CU010
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    summary: Magic 在概念漏斗顶部似乎较强，但越往下公开证据越弱。
    data:
      items:
        - label: 目标账户相关性
          value: 100
          note: 大型代码库和工程生产力痛点明确存在
        - label: 试点可行性
          value: 70
          note: 技术似乎适合高价值试点
        - label: 公开生产证据
          value: 20
          note: 未公开披露具名部署
        - label: 公开扩张证据
          value: 10
          note: 未公开披露续约或铺开指标
    approximationNotes: 取值是序数型代理指标，不是实测转化率。
    claimRefs:
