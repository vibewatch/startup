      - number: '3.3'
        title: 护城河首先是技术，但分发和信任能很快抹掉技术领先
        blocks:
          - type: paragraph
            body: >-
              如果 Magic 有护城河，那首先是技术。100M-token 定位在公开材料中确实有差异化，也对应真实的软件工程痛点：一次性理解大型代码库。但这个类别也显示，纯技术护城河非常脆弱。GitHub
              支持模型文档现在已包含部分 Copilot 模型的 1 million-token 上下文选项，说明上下文扩展不再是边缘能力。Cursor、Devin、Claude Code 和 Amazon Q
              越来越多地在完整工作流自动化上竞争，而不是只拼原始建议质量。与此同时，大型供应商控制着企业购买开发者工具的既有渠道。这意味着 Magic
              同时面临两类切换风险：开发者可以在多个助手之间多栖使用，企业管理员也可以在差异化价值不明显时标准化到一个套件。Magic
              的正向情景是，代码库规模推理仍足够难，让一家专门实验室保持领先。负向情景是，上下文变成另一个勾选框，而胜出的经济收益流向分发更好、管理员深度更强、客户证据更多的产品。这种动态也削弱硬切换成本。开发者可以在终端测试模型优先工具，在仓库主机里保留
              Copilot，同时用 Cursor 或 Devin 做更有野心的任务。因此，Magic 不只需要证明自己能被加进技术栈，还要证明它会成为最关键工作流的首选工具。
