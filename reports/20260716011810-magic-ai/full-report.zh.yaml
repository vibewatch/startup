  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 公开产品范围：代码生成仍是更大安全 AGI 使命里的切口
        blocks:
          - type: paragraph
            body: >-
              Magic 的公开产品界面比使命宣言更窄，但比一个简单 coding copilot 更宽。当前官网把公司定位为靠自动化 AI 研究和代码生成来实现安全 AGI。早期材料更明确聚焦软件工程，围绕 LTM-1 和
              LTM-2-mini 的研究帖也说明了原因：代码是一个能把长距离上下文、评测和迭代改进转成可处理产品切口的领域。这个切口在当前职位页面中仍然清晰，页面反复提到建立在长上下文模型之上的用户系统、面向 AI
              优先体验的 API
              和后端服务、后训练循环、评测框架和数据管线。换句话说，架构不是单一模型，而是一套把基础模型工作连到产品界面的技术栈。公开层面仍缺的是一个清晰、普遍可用的产品页面或透明打包方式，让买家能评估这些界面，而不只是旁观研究进展。
