- id: final-diligence-asks-and-thesis-breakers
  title: The final call depends on a short list of evidence that can either validate or break the research-premium thesis
  body: 'This is not a case where more diligence is just nice to have. It is the difference between a defensible private entry and a story-driven bet. The thesis improves materially if management can show a few concrete things: referenceable production customers, evidence that security and procurement objections are being cleared, a defensible story on training-data and legal exposure, and an economic model showing that long-context performance can be delivered without catastrophic cost. If those proofs exist privately, then Magic could still justify a strong mark as a frontier software platform in formation. If they do not, the anti-thesis becomes much stronger. The anti-thesis is not that Magic is low quality; it is that the market may have capitalized a laboratory advantage as if it were already a repeatable software business. That distinction matters for entry discipline. It also matters for exit logic. Without revenue or customer proof, there is little basis for a standard hold-period
    return model beyond another financing at a higher price. A real underwriting case therefore needs milestone conversion, not just more famous investors or more impressive demos. The most important thesis-break triggers are easy to state: no meaningful commercial proof, no buyer-legible trust package, no defensible legal posture, and no sign that the technical moat remains distinct as larger labs extend context and agent quality. If those four elements fail together, the premium should compress sharply.'
