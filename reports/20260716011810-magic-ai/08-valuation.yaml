- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Commercial proof absent
    - No referenceable production customers or quantified ROI before next financing event
    - Turns research premium into pure narrative premium
    - Do not underwrite upside as if adoption is real
  - - Legal defensibility weak
    - No credible training-data provenance or counselable licensing posture
    - Can block enterprise deals and compress valuation support
    - Apply a legal overhang discount or walk away
  - - Trust posture inadequate
    - No buyer-legible security / procurement package
    - Slows or prevents enterprise standardization
    - Do not model fast seat or account expansion
  - - Moat compression obvious
    - Benchmarks and customer evidence show bundled rivals are good enough on target workflows
    - Shrinks differentiated willingness to pay
    - Mark Magic closer to a smaller frontier-lab option
  - - Compute economics unattractive
    - Long-context workloads cannot be served or trained at acceptable unit economics
    - Burn overwhelms product leverage
    - Assume future financing risk rises sharply
  notes: Each trigger is intended to be observable in diligence rather than inferred from brand prestige.
  claimRefs:
