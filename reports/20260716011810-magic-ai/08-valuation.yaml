  - CV041
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Customers
    - Named production accounts, ROI, rollout depth, renewal signals
    - Determines whether the product has crossed from research to durable value
    - Request reference calls and usage metrics
  - - Revenue / monetization
    - ARR, pricing realization, pilot-to-production conversion
    - Needed to replace milestone speculation with operating evidence
    - Request board deck or finance package
  - - Legal / data
    - Dataset sourcing, licensing posture, memorization testing, counsel memo
    - Largest residual downside bucket for frontier code models
    - Request legal workstream review
  - - Security / procurement
    - Admin controls, retention defaults, audit logging, contractual terms, certifications roadmap
    - Enterprise buyers may stall without this layer
    - Request security architecture review and standard contract set
  - - Compute economics
    - Capacity contracts, utilization, cost per useful long-context workload
    - Determines whether moat can be served economically
    - Request infra and finance sensitivity model
  notes: 'These asks are narrow by design: each one can materially re-rate the valuation discussion if answered well.'
