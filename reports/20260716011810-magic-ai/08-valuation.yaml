- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric / anchor
  - Valuation / status
  - Relevance
  - Limitation
  rows:
  - - Magic (last widely cited mark)
    - US$320M recent investment, ~23 people, frontier long-context coding narrative
    - ~US$1.5B widely cited 2024 private valuation context
    - Anchor for entry-discipline discussion
    - Public revenue and customer evidence remain thin
  - - Cursor
    - Rapid commercialization, pricing, and customer proof in coding AI
    - ~US$9B reported 2025 private valuation
    - Shows what the market pays for visible product traction
    - Reported private mark, not audited economics
  - - Cognition / Devin
    - Agentic coding narrative plus continuing financing momentum
    - US$10.2B reported in 2025 CNBC coverage; US$25B pre-money reported in 2026 TechCrunch coverage
    - Shows how investors reward broader agent leadership narratives
    - Narrative moved quickly and may outrun disclosed fundamentals
  - - Codeium / Windsurf
    - Strategic scarcity and acquisition/financing interest around AI coding platforms
    - ~US$3B reported range in 2025 financing / acquisition reporting
    - Useful mid-tier anchor for premium coding assets
    - Different product mix and strategic context from Magic
  - - Microsoft / GitHub Copilot context
    - Public platform owner with disclosed Copilot scale and enormous public valuation base
    - Public-company platform context rather than startup private mark
    - Shows why distribution and bundle power matter in this market
    - Not a direct comp for a pre-revenue startup
  notes: Rows are ordered from Magic's own mark outward into stronger-commercialized private peers and public-platform context.
