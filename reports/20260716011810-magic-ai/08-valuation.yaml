- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Magic turns codebase-scale reasoning into a premium enterprise wedge, shows referenceable production customers, and preserves a moat versus bundled rivals
    - US$3.0B-US$5.0B valuation range becomes plausible as research premium converts into commercial premium
    - Moat erosion, legal overhang, expensive serving economics
    - Possible but dependent on proof not yet public
  - - Base
    - Magic remains technically respected, raises further capital, and demonstrates some traction, but public commercialization proof stays limited
    - US$1.0B-US$1.8B range roughly around or modestly above the last widely cited mark
    - Still hard to prove revenue quality and durable adoption
    - Most consistent with current public evidence
  - - Bear
    - Context advantage commoditizes, customer proof stays thin, and legal / trust / compute questions slow productization
    - US$0.4B-US$0.8B range as valuation falls back toward a smaller research option value
    - Down-round risk, compressed financing appetite, platform competition
    - Material if milestone conversion stalls
  notes: Ranges are broad because milestone probabilities, not reported financials, dominate the underwriting model.
