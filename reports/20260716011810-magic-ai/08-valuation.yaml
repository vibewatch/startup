- id: scenario-ranges-and-comparable-context
  title: Scenario ranges are wide because the comparable set proves appetite for upside but not Magic-specific proof
  body: The comparable set cuts both ways. On one hand, AI coding has become one of the highest-valued private software categories in the market. Cursor, Cognition, and Codeium / Windsurf all attracted or were reported around multi-billion-dollar marks, while Microsoft's Copilot disclosures show that platform-scale distribution can make coding AI strategically important at enormous scale. Those facts are why Magic's 2024 valuation was not absurd on arrival. Investors were not inventing the category from thin air. On the other hand, most of the strongest comparables now pair premium valuation with much better commercialization evidence than Magic has shown publicly. Cursor publishes customer proof and pricing. Cognition built a broader agent narrative and kept attracting capital. Codeium / Windsurf benefited from strategic scarcity and acquisition interest. Platform bundles from Microsoft, Amazon, Google, OpenAI, and Anthropic also make the market more competitive than it was when a 100M-token
    claim looked uniquely exotic. That is why our range stays broad. In the bull case, Magic converts research depth into a premium enterprise wedge and re-rates above its last public mark. In the base case, the company remains valuable but only roughly around or modestly above the last cited mark until product proof hardens. In the bear case, context-window differentiation commoditizes faster than commercialization matures, and the valuation falls back toward a smaller research premium. The range is therefore driven less by spreadsheets than by milestone probabilities.
