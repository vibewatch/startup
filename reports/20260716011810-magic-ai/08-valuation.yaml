- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Support
  - Why it matters
  - What would change the view
  rows:
  - - 'Thesis: real frontier technical signal'
    - 100M-token codebase reasoning story, elite investors, ongoing frontier hiring
    - Supports a real option value, not a meme premium
    - Need proof that technical lead still translates into practical product advantage
  - - 'Thesis: category valuations remain strong'
    - Cursor, Cognition, and Codeium / Windsurf show persistent capital appetite for coding AI
    - Magic is not alone in receiving premium software-AI treatment
    - Need evidence Magic belongs in the upper tier of that set
  - - 'Anti-thesis: public commercialization proof is weak'
    - No public revenue disclosure, no named Magic customers, limited trust artifacts
    - Suggests the premium may be ahead of operating evidence
    - Named production accounts and quantified ROI would improve the case
  - - 'Anti-thesis: moat compression risk is high'
    - Larger labs and platform vendors keep improving context, agents, and distribution
    - Can shrink willingness to pay for a research-only edge
    - Need benchmark and customer evidence that Magic still wins where it matters
  notes: The investment debate is not about whether Magic is interesting; it is about whether the price already assumes too much success.
