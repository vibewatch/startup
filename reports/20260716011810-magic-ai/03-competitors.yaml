chapter:
  number: 3
  title: Competitors
  summary: Magic competes in one of the most crowded AI-software categories on the market. Its clearest technical distinction is ultra-long-context, whole-codebase reasoning, but its weakest positions are distribution, public customer proof, pricing transparency, and enterprise controls relative to GitHub Copilot, Cursor, Amazon Q Developer, Gemini Code Assist, Claude Code, and Devin-style agents. The competitive question is therefore not whether Magic has a real idea; it is whether that idea can stay scarce long enough to outrun better-distributed rivals and become a product advantage rather than a research demo feature.
sections:
- id: landscape-and-classes
  title: 'Landscape: direct peers, incumbents, agentic upstarts, and bundled platform rivals'
  body: 'Magic does not face one clean peer set. It competes directly with standalone AI-native coding products such as Cursor, Windsurf/Codeium, and Devin on the promise of making software engineers faster. It competes indirectly but powerfully with incumbents and platform vendors such as GitHub Copilot, Amazon Q Developer, Gemini Code Assist, and Claude Code that can combine coding assistance with broader ecosystem reach. Those vendor classes matter because they win for different reasons. Cursor and Devin compete on workflow ambition and product velocity. GitHub, AWS, and Google compete on distribution, procurement familiarity, and integration into existing enterprise stacks. Anthropic competes through model quality and agentic developer workflows. Magic''s own claim to relevance is narrower: a model that can process dramatically more context than typical peers. That matters most on large repositories and multi-file tasks, but it does not automatically solve the buyer''s other criteria
    around trust, price, admin controls, or referenceability.'
