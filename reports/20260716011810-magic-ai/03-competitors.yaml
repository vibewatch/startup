  evidenceGaps:
  - type: missing-source
    severity: material
    topic: magic-pricing-and-packaging
    missingEvidence: A current public or private Magic pricing sheet, packaging overview, or pilot-commercialization path.
    whyItMatters: Without pricing and packaging, it is hard to compare Magic against trialable alternatives that already publish clear plans.
    diligencePath: Request current pricing, pilot structure, contract terms, and any admin-control roadmap from the company.
    relatedQuestionRefs:
    - QP011
    - QP012
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: magic-enterprise-proof
    missingEvidence: Referenceable customer deployments or benchmark-to-production evidence showing Magic wins real whole-codebase workflows against public competitors.
    whyItMatters: The market already offers many buyable alternatives, so technical novelty alone is unlikely to sustain a moat.
    diligencePath: Request head-to-head pilot results, named references, and win/loss data versus Copilot, Cursor, Devin, and bundled cloud tools.
    relatedQuestionRefs:
    - QP014
    - QP025
    relatedTableRefs:
    - TP004
