    severity: material
    topic: multi-homing-and-switching-data
    missingEvidence: Usage or survey data showing whether enterprise developers standardize on one assistant or actively multi-home across several.
    whyItMatters: Multi-homing directly limits pricing power and moat durability for all standalone vendors, including Magic.
