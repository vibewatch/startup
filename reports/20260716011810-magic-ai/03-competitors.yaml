- id: capabilities-pricing-and-distribution
  title: Capability, pricing, and distribution comparison favors the larger platforms
  body: 'On feature scope, the market has already moved beyond autocomplete. GitHub now describes Copilot as spanning IDE suggestions, chat, CLI use, PR descriptions, Spaces, and agents that can plan code changes for review. Cursor sells a standalone AI-native IDE with agents, cloud workflows, SSO, SCIM, privacy mode, and centralized controls. Amazon Q Developer emphasizes autonomous feature implementation, testing, refactoring, and AWS-native operations. Gemini Code Assist and Claude Code extend the field further by pairing coding help with broader model ecosystems. Devin remains differentiated as a cloud software engineer with explicit multi-step task execution. Pricing is equally competitive. GitHub publishes free, Pro, Pro+, and Max plans; Cursor offers free, $20 individual, and $40 team pricing plus enterprise; Devin exposes usage-based pricing; AWS and Google use free-to-paid and enterprise packaging. Magic, by contrast, still has no public commercial pricing or packaging page. That
    creates a core asymmetry: the rivals can be trialed, budgeted, and expanded today, while Magic still reads more like a frontier capability bet waiting for product-market proof. One practical consequence is that the competitive set can attack Magic from several directions at once. Copilot can win through default placement inside existing GitHub estates. Cursor can win through better daily UX for serious engineers. AWS and Google can win through security review shortcuts and broader platform account control. Claude Code can win among technical power users who optimize for workflow flexibility rather than procurement formality.'
