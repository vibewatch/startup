- id: security-operational-and-product-risk
  title: Security and operational risk are elevated because code agents handle sensitive context before trust controls are buyer-legible
  body: 'Operationally, Magic is trying to productize a difficult class of system. The long-context claim is differentiated, but it also implies unusual memory pressure, fault tolerance problems, and high-throughput infrastructure demands. Magic''s own job postings say as much: long-running jobs, large GPU clusters, checkpointing, recovery, and infrastructure reproducibility are recurring themes. That makes reliability risk structural rather than accidental. The security side is equally important. Code agents sit close to repositories, secrets, internal architecture, and tool execution. Industry trust-center and security pages from GitHub, GitLab, AWS, Google, OpenAI, Devin, and Cursor show the baseline enterprise buyers now expect: explicit security controls, compliance language, admin posture, and incident-facing documentation. Magic''s public security surface is much thinner today, limited mainly to a safety narrative and a minimal security contact page. That gap may be perfectly normal
    for a research-stage company, but it is not normal for a vendor asking enterprises to trust frontier systems with proprietary software estates. The additional complication is agentic failure mode. Security guidance for tool-using agents increasingly emphasizes prompt injection, token theft, tool misuse, and indirect instruction attacks. If Magic''s product layer expands faster than its trust layer, those concerns can slow procurement or force costly re-architecture.'
  claimRefs:
