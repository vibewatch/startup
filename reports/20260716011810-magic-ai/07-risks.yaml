- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Training-data legal risk
    - Counselable provenance position
    - Management cannot show defensible sourcing, licenses, or takedown process
    - Treat legal overhang as valuation discount, not tail risk
  - - Enterprise security readiness
    - Buyer-legible trust package
    - No acceptable security architecture, retention posture, or contractual controls before enterprise rollout
    - Do not underwrite fast procurement or broad deployments
  - - Commercialization risk
    - Referenceable production proof
    - No named production customers or quantified ROI before next financing event
    - Assume research premium decays
  - - Compute dependence
    - Capacity and economics
    - No credible path to stable capacity and acceptable cost per useful workload
    - Model burn and service economics as structurally impaired
  - - Governance / safety coordination
    - Policy execution
    - Capability thresholds are met but evaluation and mitigation process is still immature
    - Assume development delays or heightened adverse-event risk
  notes: These criteria are framed so diligence can test them objectively rather than rely on a general impression of technical brilliance.
