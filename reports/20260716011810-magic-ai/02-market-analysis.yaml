- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Developer productivity pressure
    - driver
    - Current
    - Makes AI assistance easier to justify even before perfect autonomy
    - Ask for measured ROI by workflow, not just anecdotal speed gains
  - - Rapid growth in AI project activity on GitHub
    - driver
    - Current
    - Signals ecosystem momentum and developer experimentation
    - Check whether experimentation converts into paid enterprise standardization
  - - Growth in global developer population
    - driver
    - Current-to-long-term
    - Expands the addressable user base and future buyer pool
    - Segment paid enterprise buyers from total developer counts
  - - Enterprise codebase complexity
    - driver
    - Current
    - Strengthens the case for repo-aware and long-context tools
    - Request customer examples involving migrations, debugging, or large-repo onboarding
  - - Trust and accuracy concerns on complex tasks
    - constraint
    - Current
    - Limits willingness to delegate high-risk engineering work
    - Request benchmark and production-quality evidence on hard tasks
  - - Security, privacy, and governance requirements
    - constraint
    - Current
    - Pushes vendors toward enterprise controls and slows adoption in regulated accounts
    - Review access controls, retention, audit logs, and deployment options
  - - Commodity pricing pressure from large vendors
    - constraint
    - Current
    - Can compress standalone vendor differentiation into bundle features
    - Benchmark premium willingness to pay for whole-codebase capabilities
  - - Model/inference economics for heavy context
    - constraint
    - Current-to-medium-term
    - May limit practical usage even if technical capability exists
    - Request evidence on latency, unit cost, and usage patterns at long-context scale
  notes: The strongest category tailwinds are real, but Magic's premium wedge only holds if long-context performance and economics are both defensible in live enterprise workflows.
