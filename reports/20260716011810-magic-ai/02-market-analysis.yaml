  rows:
  - - AI coding assistants / copilots
    - IDE autocomplete, chat, code explanation, inline edits, repo-aware search
    - Generic chatbots without code context
    - Engineering managers, CTO orgs, individual developers
    - This is the base category where Magic must compete for workflow budget
  - - Agentic software engineering tools
    - Autonomous task execution, PR generation, background workers, test/debug loops
    - Horizontal task bots not focused on code
    - Platform engineering, productivity, dev-tools buyers
    - Magic's whole-codebase claim is most valuable if this segment keeps moving up-stack
  - - Enterprise codebase understanding
    - Migration, onboarding, debugging, architecture reasoning across large repos
    - Small-project hobby workflows with low context needs
    - Large-enterprise engineering leadership
    - This is the clearest wedge for 100M-token positioning
  - - Developer infrastructure / platform tooling adjacency
    - Security controls, auditability, analytics, access controls
    - Raw cloud GPU infrastructure
    - CTO, CIO, security, developer platform
    - Adoption requires governance and procurement features, not just model quality
  - - Out-of-scope adjacent spend
    - Low-code tools, generic LLM subscriptions, raw model APIs, cloud training infra
    - N/A
    - Different buyers and budgets
    - Keeping the boundary narrow avoids overstating Magic's reachable market
  notes: The table separates the broad developer-AI umbrella from Magic's narrower whole-codebase use case so later sizing does not double-count unrelated infrastructure or consumer-chat spend.
