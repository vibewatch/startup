  - FM002
- id: buyers-users-and-adoption-path
  title: 'Buyer, user, and payer map: the economic buyer is usually above the daily user'
  body: 'The daily user for Magic-like products is the software engineer, but the economic buyer is usually an engineering leader, platform team, CTO organization, or enterprise IT function trying to compress time-to-ship. That split is important because Magic''s wedge is easier to justify in environments where codebase comprehension, migration risk, onboarding cost, and debugging latency are already board-level or VP-level pain points. A solo developer may enjoy long context, but a Fortune 500 platform team may treat it as a productivity and risk-reduction tool. Public adoption signals suggest this budget path is becoming real: Microsoft disclosed more than 1.8 million paid GitHub Copilot subscribers and over 77,000 enterprise customers, while Stack Overflow''s 2024 survey found that most developers already use or plan to use AI tools in their workflow. Still, willingness to experiment is not identical to willingness to standardize. Buyers increasingly want usage analytics, security controls,
    access controls, and proof that the tool helps on complex tasks rather than only autocomplete. That creates a market structure where premium coding-agent budgets concentrate first in larger organizations with engineering-management tooling budgets and only later diffuse into the long tail of SMB developers.'
  claimRefs:
  - CM008
  - CM009
  - CM010
  - CM011
  - CM014
  - CM015
  - CM017
  - CM018
  - CM019
