callouts:
- calloutType: strength
  title: Demand for AI in software development is already real
  body: 'The broad adoption signals are no longer hypothetical: developers are already using AI in workflow, GitHub shows surging AI-project activity, and Microsoft reports a large paid Copilot base. Magic does not need to create a category from scratch.'
  claimRefs:
  - CM008
  - CM010
  - CM015
  - CM021
- calloutType: risk
  title: A growing market does not guarantee a durable standalone wedge
  body: The category is moving quickly toward bundled agentic workflows from large vendors. If ultra-long context becomes table stakes or remains too expensive to use heavily, Magic could be trapped inside a healthy market without owning a defensible slice of it.
  claimRefs:
  - CM023
  - CM024
  - CM025
  - CM026
  - CM028
- calloutType: insight
  title: Magic's real market is the pain of understanding very large codebases
  body: The best commercial framing is not “all developers will use AI,” but “some high-value teams will pay materially more for tools that reason across codebases too large for ordinary copilots.” That is a smaller but potentially premium market if the product works.
  claimRefs:
  - CM016
  - CM017
  - CM027
  - CM029
  - CM031
