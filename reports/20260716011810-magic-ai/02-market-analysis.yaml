  evidenceGaps:
  - type: missing-source
    severity: material
    topic: magic-sam-and-som
    missingEvidence: A company, investor, or market dataset that isolates the number of large-codebase enterprise teams willing to pay specifically for long-context whole-repo tooling.
    whyItMatters: Magic's valuation and go-to-market depend on a narrower premium wedge than headline AI-coding TAM figures can prove.
    diligencePath: Request Magic's pipeline segmentation, pilot-account profiles, and any internal SAM work that splits large-enterprise codebase accounts from general developer-tool demand.
    relatedQuestionRefs:
    - QM024
    - QM025
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: budget-owner-and-procurement-path
    missingEvidence: Referenceable customer evidence showing which internal budget line actually pays for Magic-like deployments and what approval path is required.
    whyItMatters: The user and payer are not the same person, so budget authority and procurement friction directly affect sales velocity and ACV potential.
    diligencePath: Request customer interviews, procurement timelines, and deal-level information on whether budgets come from platform engineering, AI transformation, or central IT.
    relatedQuestionRefs:
    - QM015
    - QM017
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: whole-codebase-roi-proof
    missingEvidence: Public or private workflow evidence showing that ultra-long-context reasoning materially changes outcomes on migrations, onboarding, debugging, or refactoring versus standard copilots.
    whyItMatters: Without ROI proof, Magic's long-context wedge may remain technically interesting but commercially non-essential.
    diligencePath: Ask for benchmark-to-production translation evidence, pilot success metrics, and before/after engineering-efficiency data on large-repository tasks.
    relatedQuestionRefs:
    - QM022
    - QM025
    relatedTableRefs:
    - TM004
