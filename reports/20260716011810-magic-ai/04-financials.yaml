  evidenceGaps:
  - type: missing-source
    severity: material
    topic: current-revenue-and-arr
    missingEvidence: Current revenue, ARR, and customer-count disclosure from the company.
    whyItMatters: These are the base metrics required to underwrite a software company rather than a research narrative.
    diligencePath: Request monthly recurring revenue, TTM revenue, ARR bridge, and active customer counts.
    relatedQuestionRefs:
    - QI001
    - QI011
    - QI025
    relatedTableRefs:
    - TI001
    - TI005
  - type: missing-source
    severity: material
    topic: gross-margin-and-unit-costs
    missingEvidence: Cost-to-serve, gross margin, and inference or compute cost data at the product or pilot level.
    whyItMatters: Long-context systems can be technically impressive but financially unattractive if serving costs stay too high.
    diligencePath: Request internal model cost curves, cost per active customer, and gross-margin by product line.
    relatedQuestionRefs:
    - QI010
    - QI014
    - QI023
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: material
    topic: cash-balance-burn-and-runway
    missingEvidence: Current cash balance, monthly burn, committed compute spend, and runway months.
    whyItMatters: A large historical raise does not by itself prove current capital adequacy if burn is very high.
    diligencePath: Request board-level cash planning, monthly cash burn, and committed infrastructure obligations.
