- id: capital-adequacy-and-underwriting-gaps
  title: Capital adequacy looks strong, but true underwriting remains blocked by missing revenue and burn data
  body: 'Magic likely has better survivability than most research-stage AI startups simply because the disclosed financing base is enormous relative to the small team size. Official materials say total capital raised reached $515 million and that the latest disclosed investment was $320 million. That should provide substantial runway for continued model research and product exploration even under a high burn profile. But public capital strength should not be confused with financial clarity. There is still no disclosed cash balance, monthly burn, runway estimate, debt load, or next-round trigger. There are also no public IPO signals and no evidence that Magic has crossed from research prestige into repeatable software economics. In practical diligence terms, the financial verdict is straightforward: capital adequacy is probably a strength, commercialization evidence is still the main blocker, and almost every important underwriting input beyond capital raised remains private. Until Magic
    discloses revenue, pricing, customer cohorts, or usage-based efficiency metrics, the company has to be valued more like an option on future productization than like a current software operator. Even a generous reading of the public record therefore supports only a narrow conclusion: Magic probably has enough money to keep building, but not enough disclosure for outsiders to judge whether the building process is economically efficient.'
