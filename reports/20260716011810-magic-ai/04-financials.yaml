- id: cost-structure-and-unit-economics-proxies
  title: Cost structure and unit-economics proxies imply extreme capital intensity but limited public efficiency proof
  body: 'Public signals point to a very expensive operating model. Magic''s August 2024 post paired a 23-person headcount disclosure with 8,000 H100s and described a Google Cloud / Nvidia-backed infrastructure buildout. Current role descriptions remain concentrated around pre-training data, RL systems, product engineering, and long-context model work, with salary ranges for software engineering roles running from roughly $200,000 to $550,000 plus equity. That combination implies a cost base driven far more by compute, model training, and highly paid technical labor than by a scaled sales organization. However, investors still cannot underwrite classic unit economics. There is no public gross margin, no inference cost disclosure, no NRR, no ACV, no sales-efficiency data, and no clear revenue denominator against which to measure the research spend. Public software and AI platform comparables at least publish pricing or audited financial statements; Magic does not. As a result, the best public
    proxy is not gross margin but capital intensity: huge capital raised against a tiny disclosed team and no visible revenue benchmark. That supports a view of Magic as a heavily financed frontier lab rather than a mature software company.'
  claimRefs:
