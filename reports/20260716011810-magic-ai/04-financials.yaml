    - Request trailing-12-month revenue and current ARR
  - - Public ARR
    - Undisclosed
    - High
    - Without ARR, growth and efficiency cannot be benchmarked
    - Request ARR, net-new ARR, and churn
  - - Gross margin
    - Undisclosed
    - High
    - Compute-heavy products can have very different economics from SaaS
    - Request gross margin by product or pilot type
  - - Capital per disclosed employee
    - ~$13.9M from latest round; ~22.4M from official total raised
    - Medium
    - Shows extraordinary financing intensity relative to team size
    - Confirm current headcount and actual deployed capital
  - - Inference / model cost exposure
    - Material but undisclosed
    - Medium
    - Long-context usage can destroy margins if cost curves are poor
    - Request internal cost per active customer or per task
  - - Net revenue retention
    - Undisclosed
    - High
    - Expansion is crucial for premium developer tools
    - Request NRR and cohort expansion by account size
  - - Sales efficiency / CAC payback
    - Undisclosed
    - High
    - Needed to judge whether enterprise GTM is viable
    - Request pipeline conversion and payback by segment
  - - Revenue per employee
    - Not supportable publicly
    - High
    - Would indicate whether commercialization matches capital base
    - Request current revenue and fully loaded headcount
