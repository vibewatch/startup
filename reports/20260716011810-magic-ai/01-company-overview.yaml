callouts:
- calloutType: strength
  title: Investor quality and compute access are the clearest objective strengths
  body: The most defensible part of Magic’s story is not current commercialization; it is the combination of elite investors, Google Cloud and Nvidia infrastructure support, and a technical claim that was at least directionally corroborated by independent coverage when it was announced. Few pre-revenue AI coding labs had that blend of capital quality and compute access in 2024.
  claimRefs:
  - CO013
  - CO014
  - CO021
  - CO025
  - CO026
  - CO027
- calloutType: risk
  title: Disclosure remains thin on the facts that usually justify late-stage prices
  body: Public evidence does not yet support a conventional growth-equity view of Magic. There is no audited revenue, no named customer roster, no clean primary-source valuation statement for the 2024 round, and only one precise public team-size disclosure. That means later chapters have to evaluate Magic mostly as a technical option on future commercialization, not as a proven operating business.
  claimRefs:
  - CO017
  - CO029
  - CO030
  - CO040
  - CO041
  - CO043
  - CO044
- calloutType: insight
  title: Magic now reads more like a frontier lab with a software-engineering wedge than a narrow coding-assistant vendor
  body: The official narrative has shifted from “AI colleague for software engineering” toward a broader claim that code generation and automated AI research are the best route to safe AGI. That makes the company strategically more ambitious, but it also increases the distance between technical demos and a repeatable enterprise product business.
  claimRefs:
