company:
  name: Magic AI
chapter:
  number: 1
  title: Company Overview
  summary: Magic is a San Francisco AI company founded in 2022 by Eric Steinberger and Sebastian De Ro that now publicly frames its mission as building safe AGI by automating AI research and code generation. The company’s best-documented operating facts remain the August 2024 disclosure of a $320 million financing, a 100 million-token LTM-2-mini model, a Google Cloud and Nvidia compute partnership, and a team of roughly two dozen people. Public evidence is strongest on technical ambition and investor quality, and weakest on revenue, customer traction, and even the exact fully diluted valuation attached to the 2024 round.
sections:
- id: identity-and-positioning
  title: Identity, mission, and current public positioning
  body: 'Magic’s public identity has broadened since its early “AI colleague for software engineering” framing. On its current homepage, safety page, AGI readiness policy, and current hiring materials, the company no longer presents itself only as a code assistant startup. Instead, it describes a mission to build safe AGI by automating AI research and code generation, combining frontier-scale pre-training, domain-specific reinforcement learning, ultra-long context, and inference-time compute. That shift matters because it changes how later chapters should interpret both product claims and valuation. Investors are not only underwriting a developer-tool workflow; they are underwriting a frontier-model research program that treats coding as the first commercially tractable route to broader autonomous reasoning. At the same time, Magic still anchors that ambition in software engineering: multiple official pages say the company is building long-context models, developer-facing tools, and user-facing
    systems on top of those models. In other words, the code product story has not disappeared, but it now sits inside a much larger safe-AGI narrative.'
