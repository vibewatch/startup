  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: total-raised-and-valuation
    missingEvidence: A primary financing document or company statement that cleanly states both total capital raised and the post-money valuation for the August 2024 round.
    whyItMatters: The public story oscillates between roughly $465M and $515M total raised and relies on secondary shorthand for the ~$1.5B valuation, which weakens cap-table confidence.
    diligencePath: Request the round press deck, cap-table summary, or board-approved financing memo from the company or lead investors.
    relatedQuestionRefs:
    - QO011
    - QO012
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: current-headcount
    missingEvidence: An updated employee count or current org chart after the August 2024 23-person disclosure.
    whyItMatters: Team size is a key scaling and execution variable for a company attempting frontier-model research, productization, and large-scale infrastructure simultaneously.
    diligencePath: Request a current employee census or management-prepared headcount by function and location.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: Named customers, pilots, or production deployments for Magic’s code-generation or long-context systems.
    whyItMatters: Without named outside use, it is impossible to separate technical promise from true commercial traction or to assess whether the product wedge has crossed into repeatable value delivery.
    diligencePath: Ask for pilot roster, referenceable customers, signed contracts, or usage metrics that show adoption outside Magic.
