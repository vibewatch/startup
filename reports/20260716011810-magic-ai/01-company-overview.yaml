- id: milestones-and-disclosure-gaps
  title: Milestones, public chronology, and what remains missing
  body: 'The company chronology is short, dense, and highly concentrated around a few visible turning points. Magic was founded in 2022, disclosed a $5 million seed and a $23 million Series A by early 2023, introduced its 5 million-token LTM-1 model in mid-2023, published an AGI readiness policy in July 2024, and on August 29, 2024 combined three major disclosures at once: the $320 million financing, the 100 million-token LTM-2-mini update, and a Google Cloud/Nvidia supercomputing partnership. What has not happened publicly is almost as important. The current site still does not disclose revenue, ARR, customer count, named enterprise logos, or a clean primary-source valuation statement for the 2024 round. And by May 2026, external commentary could already cite Magic as a cautionary case: despite the headline technical claim and huge financing, there was still no public evidence that LTM-2-mini had become a broadly deployed outside product. That does not disprove the technology, but it sharply
    narrows what this chapter can state with confidence: strong technical ambition and funding are proven; commercial traction and valuation support are not.'
