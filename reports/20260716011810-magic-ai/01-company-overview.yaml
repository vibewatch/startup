- id: founders-team-and-organization
  title: Founders, team design, and operating shape
  body: 'The public record supports unusually strong founder-intellectual signals but limited conventional operating disclosure. Eric Steinberger is consistently identified as co-founder and CEO, with TechCrunch and Sequoia materials tying him to Meta FAIR, early collaboration with Noam Brown, and a long-running AGI focus that pre-dates Magic. Sebastian De Ro is consistently named as co-founder and is described in TechCrunch reporting as a former FireStart CTO. Current hiring copy shows that the company’s organization is still research-heavy: the open roles emphasize research engineering, evals, kernels, long-context inference, pre-training systems, developer tooling, supercomputing infrastructure, and a product team tasked with turning model capability into user-facing workflows. This does not look like a scaled enterprise go-to-market organization. It looks like a small frontier lab that is selectively productizing its research. That explains why a last precise headcount disclosure of
    23 people in August 2024 remains directionally compatible with the current site’s repeated references to a “small” team, even though the exact current employee count is not published.'
