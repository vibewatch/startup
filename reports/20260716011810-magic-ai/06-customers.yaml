- id: public-customer-proof-gap
  title: Public customer proof is the biggest gap versus rivals
  body: 'The strongest negative signal in the customer story is simple: reviewed public materials still do not identify a named Magic customer. Magic''s website, blog, safety pages, and funding coverage emphasize technical ambition, capital, compute, and hiring, but not deployments, logos, or case studies. That absence does not prove the company has no pilots, but it does mean outside investors cannot confirm whether long-context capability has crossed into repeatable customer value. The contrast with rivals is striking. Cursor publishes a broad customer page with examples from Stripe, Brex, Coinbase, Rippling, and others. Devin publishes both a general customers page and detailed case studies like Nubank''s code migration work. Even platform vendors and infrastructure providers publish customer stories that show how buyers explain ROI internally. In customer diligence terms, Magic is therefore behind the category leaders not only on breadth of proof but also on referenceability. That makes
    the company harder to underwrite on revenue quality, expansion potential, and budget stickiness. Public proof also matters inside the buyer journey itself: technical champions often need referenceable examples to convince security, finance, or procurement stakeholders that a new category is worth standardizing.'
  claimRefs:
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
