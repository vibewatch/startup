  - FU003
- id: retention-expansion-and-concentration-risk
  title: Without customer proof, retention and concentration questions stay unresolved
  body: 'Once customer proof is missing, most of the second-order questions also remain unresolved. There is no public customer count, no cohort data, no renewal disclosure, no NRR, no expansion patterns, and no concentration profile. That means Magic could be anywhere on a wide spectrum: from a research-access tool with no durable deployments, to a handful of promising but unreferenceable pilots, to deeper internal adoption inside a few strategic accounts. Public evidence does not currently distinguish among those states. The best available analogs suggest what good customer evidence would look like. Devin''s Nubank case study quantifies time savings, cost savings, workflow fit, and task economics. Cursor''s customer page shows role-based endorsements from major technical buyers and deployment scale inside well-known companies. Magic has not yet published anything comparable. Until it does, the main customer verdict is cautious: target customers are plausible, but current traction, retention
    quality, and expansion durability are unproven. That uncertainty creates a wide range of possible outcomes. Magic could eventually show strong expansion inside a few accounts, or it could discover that the product is admired by engineers but hard to institutionalize. Right now, the public record does not resolve that uncertainty yet.'
