  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue model and monetization status: the market has prices, but Magic does not publish one'
        blocks:
          - type: paragraph
            body: >-
              The core financial challenge is that Magic still has no public monetization surface. The company presents
              a mission, models, hiring plan, and capital base, but not a product price, API price, seat price, or
              customer case study that would let an outside investor estimate current revenue. TechCrunch's August 2024
              funding coverage said Magic had no revenue to speak of, and the reviewed official materials through July
              2026 still do not replace that with an updated commercial metric. That does not mean Magic cannot monetize
              later; it means the public record still supports only a future-state revenue thesis rather than a current
              one. The most plausible monetization paths are enterprise seat-based software, usage-based agent or model
              access, or large-account pilot contracts tied to codebase understanding and migration workflows. But those
              paths remain inferred from the category, not disclosed by Magic itself. In contrast, rivals already
              publish enough pricing or packaging detail to let buyers compare cost and scope immediately. Financially,
              that means Magic remains a research asset first and a visible software business second. That gap also
              matters for GTM timing. In categories where rivals publish prices and free tiers, the absence of a public
              offer can delay experimentation and make revenue forecasting almost entirely dependent on
              private-management claims.
