      - number: '3.3'
        title: Moat durability is technical first, but distribution and trust can erase a technical lead quickly
        blocks:
          - type: paragraph
            body: >-
              Magic's moat, if it exists, is technical. The 100M-token positioning is genuinely differentiated in public
              materials and addresses a real software-engineering pain point: understanding large codebases in one pass.
              But the category also shows how fragile purely technical moats can be. GitHub's supported-model
              documentation now includes 1 million-token context options for some Copilot models, meaning context
              expansion is no longer a fringe capability. Cursor, Devin, Claude Code, and Amazon Q increasingly compete
              on full workflow automation rather than raw suggestion quality. Meanwhile, large vendors own the channels
              through which enterprises already buy developer tools. That means Magic faces two forms of switching risk
              at once: developers can multi-home across multiple assistants, and enterprise admins can standardize on a
              bundle if differentiated value is not obvious. The positive case for Magic is that codebase-scale
              reasoning remains hard enough that a purpose-built lab stays ahead. The negative case is that context
              becomes just another checkbox while the winning economics accrue to products with better distribution,
              admin depth, and customer proof. That dynamic also weakens hard switching costs. A developer can test a
              model-first tool in a terminal, keep Copilot inside the repository host, and still use Cursor or Devin for
              more ambitious tasks. Magic therefore needs evidence not just that it can be added to the stack, but that
              it becomes the preferred tool for the workflows that matter most.
