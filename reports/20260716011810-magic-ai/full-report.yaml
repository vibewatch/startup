companyProfile:
  summary: >-
    Magic AI is a private San Francisco frontier-model company founded in 2022 by Eric Steinberger and Sebastian De Ro.
    Its public story combines safe-AGI ambition with a concrete coding wedge: long-context models and developer-facing
    systems meant to reason across entire codebases, automate software engineering work, and ultimately support
    automated AI research. Public financing evidence is unusually strong for such an early commercial stage, including a
    disclosed recent $320M investment in August 2024 and company-claimed total funding of $515M, but the public
    operating base remains far less proven than the financing headline because revenue, named customers, and enterprise
    deployment detail are still largely undisclosed.
