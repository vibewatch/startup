  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory risk is manageable today but could widen quickly if frontier coding agents scale
        blocks:
          - type: paragraph
            body: >-
              Magic deserves credit for publicly acknowledging frontier-model risk earlier than many coding startups.
              Its safety and AGI-readiness materials explicitly discuss dangerous capability evaluations, cyberoffense
              risk, board reporting, and the possibility of pausing development if mitigations are not ready. That is
              materially better than pretending coding models are risk-free productivity software. But it is still only
              a starting point for diligence. The public record does not show a mature training-data governance program,
              a detailed licensing posture, or enterprise-ready policy artifacts around data provenance and customer
              indemnity. That matters because the legal environment around generative AI training remains unsettled. The
              U.S. Copyright Office's 2025 training report and the Andersen litigation record make clear that
              copyrighted training data, memorization, and downstream market harm remain live issues. For Magic, the
              exposure is conceptually sharper than for a generic chatbot because the product story revolves around code
              and automated software engineering, domains where licensed, open-source, and proprietary material sit
              uncomfortably close together. The EU AI Act also raises the baseline compliance burden for advanced AI
              deployments across Europe. None of this proves Magic is currently non-compliant. It does mean investors
              should treat legal defensibility as a first-order diligence item rather than as paperwork to solve after
              product-market fit.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
