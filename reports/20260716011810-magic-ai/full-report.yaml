  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: >-
          Recommendation should remain price-sensitive because technical quality and valuation support are not the same
          thing
        blocks:
          - type: paragraph
            body: >-
              The right starting point is to separate company quality from entry quality. Magic is easy to respect. The
              company raised capital from elite investors, made a genuinely distinctive long-context claim in 2024, and
              continues to frame itself as a frontier research organization rather than a shallow wrapper. In a market
              where investors routinely pay for the possibility of category leadership, those facts matter. But they do
              not settle the investment question. Public evidence still does not show named production customers,
              meaningful disclosed revenue, or operating metrics that would allow a standard SaaS-style underwriting
              model. That pushes the valuation problem away from revenue multiples and toward milestone pricing: how
              much should an investor pay for a research-stage option on whole-codebase AI software engineering? Our
              answer is that the option is real, but the current public proof set supports discipline rather than
              eagerness. At the August 2024 mark, Magic was effectively priced on technical optionality, investor
              conviction, and the belief that context-scale advantages could translate into product leverage before
              incumbents caught up. By July 2026, the category has become more crowded, better commercialized, and more
              heavily benchmarked. That raises the bar. Unless a new investor receives strong private evidence on
              customer traction, legal defensibility, and enterprise trust readiness, the prudent recommendation is
              research-more / track, not chase the private premium simply because other AI coding names command large
              numbers.
