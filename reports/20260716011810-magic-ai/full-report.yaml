      - number: '1.3'
        title: Capital formation, compute strategy, and strategic stakeholders
        blocks:
          - type: paragraph
            body: >-
              Magic’s funding and infrastructure story is elite by private-company standards and still unusually opaque
              by normal diligence standards. Official August 2024 materials disclosed a recent $320 million investment
              and stated that total capital raised had reached $515 million, while TechCrunch’s contemporaneous
              reporting put the cumulative figure nearer $465 million and said the exact post-round valuation could not
              be confirmed. A later analytical secondary source describes the round at roughly a $1.5 billion valuation,
              which matches broader market chatter but not a primary company filing or primary announcement. That
              discrepancy is important: later chapters should treat the 2024 valuation as widely cited rather than
              primary-disclosed. What is primary-disclosed is the strategic quality of the cap table and the compute
              plan. The 2024 announcement tied Eric Schmidt, Jane Street, Sequoia, Atlassian, CapitalG, Nat Friedman,
              Daniel Gross, and Elad Gil to the company, while the same day’s research post announced Google Cloud and
              Nvidia-backed supercomputer buildouts. That pairing suggests investors were funding not only model R&D but
              also the unusually expensive infrastructure needed to make ultra-long-context claims economically
              credible.
