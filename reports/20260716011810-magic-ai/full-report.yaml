  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Target customers are visible even if actual public customers are not
        blocks:
          - type: paragraph
            body: >-
              Magic's ideal customer profile can be inferred more confidently than its current roster. The public
              product narrative, financing story, and hiring plan all point toward sophisticated engineering
              organizations rather than hobbyist coders. Large enterprises with sprawling monorepos, platform teams
              facing migration or debugging burdens, and research-heavy technical organizations fit the company's
              long-context pitch best. These buyers care less about generic code completion and more about
              whole-codebase understanding, cross-file reasoning, onboarding, modernization, and engineering leverage.
              The likely adoption path also follows the standard enterprise AI pattern: developer experimentation first,
              then team-level proof on hard workflows, then security and procurement review, and only then budget
              standardization. That path matters because the user and payer are rarely the same person. Engineering
              leaders, platform teams, CTO organizations, or transformation budgets are the most plausible payers, while
              developers are the daily users. Magic's product could fit that path well in theory, but the public record
              still leaves theory far ahead of proof. The practical implication is that Magic probably does not need
              millions of casual users to matter commercially. It needs a smaller number of technically sophisticated
              accounts that view codebase-scale understanding as a meaningful budget line rather than as a nice-to-have
              feature. That is a narrower market, but one where contract values and expansion potential could be high if
              proof emerges.
            claimRefs:
