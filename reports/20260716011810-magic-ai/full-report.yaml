        title: 'Public product scope: code generation remains the wedge inside a broader safe-AGI mission'
        blocks:
          - type: paragraph
            body: >-
              Magic's public product surface is narrower than its mission statement and broader than a simple coding
              copilot. The current homepage frames the company around safe AGI achieved by automating AI research and
              code generation. Earlier materials were more explicitly software-engineering focused, and the research
              posts around LTM-1 and LTM-2-mini show why: code is a domain where long-range context, evaluation, and
              iterative improvement can be turned into a tractable product wedge. That wedge remains visible in current
              role pages, which repeatedly mention user-facing systems on top of long-context models, APIs and backend
              services for AI-first experiences, post-training loops, evaluation frameworks, and data pipelines. In
              other words, the architecture is not just a single model; it is a stack that links foundational model work
              to product surfaces. What is still missing publicly is a clean generally available product page or
