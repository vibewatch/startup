chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and current public positioning
        blocks:
          - type: paragraph
            body: >-
              Magic’s public identity has broadened since its early “AI colleague for software engineering” framing. On
              its current homepage, safety page, AGI readiness policy, and current hiring materials, the company no
              longer presents itself only as a code assistant startup. Instead, it describes a mission to build safe AGI
              by automating AI research and code generation, combining frontier-scale pre-training, domain-specific
              reinforcement learning, ultra-long context, and inference-time compute. That shift matters because it
              changes how later chapters should interpret both product claims and valuation. Investors are not only
              underwriting a developer-tool workflow; they are underwriting a frontier-model research program that
              treats coding as the first commercially tractable route to broader autonomous reasoning. At the same time,
              Magic still anchors that ambition in software engineering: multiple official pages say the company is
              building long-context models, developer-facing tools, and user-facing systems on top of those models. In
              other words, the code product story has not disappeared, but it now sits inside a much larger safe-AGI
              narrative.
