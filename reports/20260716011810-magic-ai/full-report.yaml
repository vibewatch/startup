  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: broad developer tooling vs. Magic''s narrower whole-codebase wedge'
        blocks:
          - type: paragraph
            body: >-
              Magic should be analyzed inside AI coding and developer-productivity software, not as a generic AGI market
              proxy. The included spend is software that helps professional engineers write, review, debug, test,
              refactor, document, and ship code with model assistance. That includes IDE copilots, repo-aware chat,
              coding agents, cloud task workers, and benchmarked code-reasoning workflows. It does not include generic
              consumer chatbots, raw model infrastructure, or low-code tooling aimed primarily at non-technical users.
              Within that already broad category, Magic aims at one of the hardest slices: teams with massive codebases,
              long dependency chains, and complex migrations where a model that can reason over far more context than a
              normal IDE copilot could justify premium budget. That is why broad AI-coding TAM figures are directionally
              useful but not sufficient. The broadest market studies describe a multibillion-dollar AI code-tools
              category, while narrower studies isolate a much smaller generative-coding segment. The variance matters:
              Magic's commercial case depends less on the existence of developer demand in general and more on whether
              the whole-codebase problem is painful enough to support a differentiated category before frontier labs
              absorb the feature.
