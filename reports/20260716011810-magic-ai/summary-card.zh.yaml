  topStrengths:
    - Magic 在 2024 年提出了真正有差异的长上下文编程主张，而不是只套一层第三方 API。
    - 投资人质量很高，Eric Schmidt、CapitalG、Sequoia、Atlassian 等顶级支持者都站在公司背后。
    - 公司仍聚焦一个具体产品切口：全代码库软件工程和自动化 AI 研究。
    - 技术方向正确时，小团队的高强度可以成为前沿研究执行优势。
    - 编程 AI 类别在私募市场仍有强需求；如果 Magic 能把技术新意转成产品牵引力，上行空间还在。
  topRisks:
    - 公开的收入、客户和单位经济披露仍太薄，无法有把握地承销当前估值。
    - 大实验室和平台厂商继续扩展智能体、上下文和分发能力后，上下文窗口差异化可能商品化。
    - 企业信任、法律可防御性和采购就绪度在公开信息中还不够清晰，难以支撑高溢价软件承销案例。
    - 计算强度和小团队覆盖面带来实质执行风险和成本风险。
    - 私募估值偏高；如果商业化落后，或后续融资要求更尖锐的证据，下行风险会放大。
  unresolvedGaps:
    - 当前收入、ARR、实际定价兑现，以及试点到生产的转化。
    - 具名生产客户、部署深度和续约行为。
    - 训练数据来源、法律立场，以及记忆化 / 授权防护。
    - 安全架构、管理员控制、留存默认设置和面向客户的采购材料包。
    - 股权结构优先权、稀释压力，以及影响实际回报潜力的其他私募轮经济条款。
