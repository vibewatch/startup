evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: total-raised-and-valuation
    missingEvidence: >-
      A primary financing document or company statement that cleanly states both total capital raised and the post-money
      valuation for the August 2024 round.
    whyItMatters: >-
      The public story oscillates between roughly $465M and $515M total raised and relies on secondary shorthand for the
      ~$1.5B valuation, which weakens cap-table confidence.
    diligencePath: >-
      Request the round press deck, cap-table summary, or board-approved financing memo from the company or lead
      investors.
    relatedQuestionRefs:
      - QO011
      - QO012
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: current-headcount
    missingEvidence: An updated employee count or current org chart after the August 2024 23-person disclosure.
    whyItMatters: >-
      Team size is a key scaling and execution variable for a company attempting frontier-model research,
      productization, and large-scale infrastructure simultaneously.
    diligencePath: Request a current employee census or management-prepared headcount by function and location.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: Named customers, pilots, or production deployments for Magic’s code-generation or long-context systems.
    whyItMatters: >-
      Without named outside use, it is impossible to separate technical promise from true commercial traction or to
      assess whether the product wedge has crossed into repeatable value delivery.
    diligencePath: >-
      Ask for pilot roster, referenceable customers, signed contracts, or usage metrics that show adoption outside
      Magic.
    relatedQuestionRefs:
      - QO015
      - QO023
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: magic-sam-and-som
    missingEvidence: >-
      A company, investor, or market dataset that isolates the number of large-codebase enterprise teams willing to pay
      specifically for long-context whole-repo tooling.
    whyItMatters: >-
      Magic's valuation and go-to-market depend on a narrower premium wedge than headline AI-coding TAM figures can
      prove.
    diligencePath: >-
      Request Magic's pipeline segmentation, pilot-account profiles, and any internal SAM work that splits
      large-enterprise codebase accounts from general developer-tool demand.
    relatedQuestionRefs:
      - QM024
      - QM025
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: budget-owner-and-procurement-path
    missingEvidence: >-
      Referenceable customer evidence showing which internal budget line actually pays for Magic-like deployments and
      what approval path is required.
    whyItMatters: >-
      The user and payer are not the same person, so budget authority and procurement friction directly affect sales
      velocity and ACV potential.
    diligencePath: >-
      Request customer interviews, procurement timelines, and deal-level information on whether budgets come from
      platform engineering, AI transformation, or central IT.
    relatedQuestionRefs:
      - QM015
      - QM017
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: whole-codebase-roi-proof
    missingEvidence: >-
      Public or private workflow evidence showing that ultra-long-context reasoning materially changes outcomes on
      migrations, onboarding, debugging, or refactoring versus standard copilots.
    whyItMatters: Without ROI proof, Magic's long-context wedge may remain technically interesting but commercially non-essential.
    diligencePath: >-
      Ask for benchmark-to-production translation evidence, pilot success metrics, and before/after
      engineering-efficiency data on large-repository tasks.
    relatedQuestionRefs:
      - QM022
      - QM025
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: magic-pricing-and-packaging
    missingEvidence: A current public or private Magic pricing sheet, packaging overview, or pilot-commercialization path.
    whyItMatters: >-
      Without pricing and packaging, it is hard to compare Magic against trialable alternatives that already publish
      clear plans.
    diligencePath: Request current pricing, pilot structure, contract terms, and any admin-control roadmap from the company.
    relatedQuestionRefs:
      - QP011
      - QP012
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: magic-enterprise-proof
    missingEvidence: >-
      Referenceable customer deployments or benchmark-to-production evidence showing Magic wins real whole-codebase
      workflows against public competitors.
    whyItMatters: The market already offers many buyable alternatives, so technical novelty alone is unlikely to sustain a moat.
    diligencePath: >-
      Request head-to-head pilot results, named references, and win/loss data versus Copilot, Cursor, Devin, and bundled
      cloud tools.
    relatedQuestionRefs:
      - QP014
      - QP025
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: multi-homing-and-switching-data
    missingEvidence: >-
      Usage or survey data showing whether enterprise developers standardize on one assistant or actively multi-home
      across several.
    whyItMatters: Multi-homing directly limits pricing power and moat durability for all standalone vendors, including Magic.
    diligencePath: Ask for seat-level retention, primary-vs-secondary tool usage, and admin policy data from pilot accounts.
    relatedQuestionRefs:
