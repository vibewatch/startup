companyProfile:
  summary: Multiverse is a London-headquartered private workforce upskilling company incorporated in 2016 that has evolved from WhiteHat's apprenticeship roots into an employer-funded AI, data, and technology training platform. Public materials say it serves more than 1,500 employers and 22,000 learners through skills-gap diagnostics, personalised learning pathways, AI-supported coaching, and apprenticeship-style programmes. The company raised a fresh $70 million round at a $2.1 billion valuation in May 2026, but the latest filed-year evidence still points to roughly £79.6 million of revenue and a £63.3 million pre-tax loss, so scale is real while unit economics and governance transparency remain only partially disclosed.
  foundedDate: '2016-02-25'
  founders:
    - name: Euan Blair
      role: Founder & CEO
      background: Founder and chief executive who remains the company's primary public spokesperson and anchors the strategy shift from apprenticeship placement toward enterprise AI upskilling.
      claimRefs: [CO009, CO013]
  foundingLocation: London, UK
  headquarters: London, UK
  productSummary: Multiverse sells employer-funded workforce diagnostics, AI and data apprenticeships, AI-adoption curricula, coaching, and structured on-the-job learning pathways, including programmes such as AI-Powered Productivity, AI Solutions Builder, AI and Machine Learning Fellowship, and Applied Data Engineering.
  customerFocus: Enterprise employers and public-sector organisations in the UK and US, with early expansion into Germany, that want to upskill incumbent employees and selected early-career talent in AI, data, and technology roles.
  businessModel: Employers pay for cohort-based training and workforce development; in the UK many programmes use apprenticeship levy or levy-transfer funding, while learners remain salaried and Multiverse provides programme design, delivery, coaching, and assessment support.
  stage: Series D
  fundingStatus: Multiverse raised a $220 million Series D in June 2022 at a $1.7 billion post-money valuation, then added a $70 million primary round in May 2026 at a $2.1 billion valuation; independent coverage places lifetime funding at roughly $570 million.
  disclosureProfile: private-disclosed
  claimRefs: [CO001, CO003, CO004, CO005, CO006, CO007, CO008, CO009, CO016, CO018, CV007]
summary:
  headline: Multiverse has real enterprise traction and a fresh $2.1 billion price signal, but public evidence still supports a research-more stance because losses, policy-linked delivery risk, and disclosure gaps make the valuation look stretched.
  overallScore: 6.1
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
