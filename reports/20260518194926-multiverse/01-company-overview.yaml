  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: A current board list, governance charter, and cap-table level ownership summary for the private company.
    whyItMatters: Board composition, control rights, and investor protections materially affect governance risk and downside protection.
    diligencePath: Request current board materials, shareholder list, and any investor rights summary in the data room.
    relatedQuestionRefs:
    - QO008
    - QO026
    relatedTableRefs:
    - TO002
    - TO003
  - type: stale
    severity: material
    topic: headcount
    missingEvidence: A current total employee count by geography and function after the US retrenchment and StackFuel integration.
    whyItMatters: Public sources only show dated snapshots, which makes productivity, burn, and integration planning hard to underwrite.
    diligencePath: Request the latest org chart, month-end headcount report, and geography split from management.
    relatedQuestionRefs:
    - QO014
    - QO026
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: employee-liquidity
    missingEvidence: Detailed terms for employee equity in the 2026 financing, including whether any secondary liquidity cleared and on what terms.
    whyItMatters: Liquidity mechanics affect retention, effective valuation quality, and how much of the round was true primary growth capital.
    diligencePath: Ask for the financing summary, employee equity memo, and any secondary or tender allocation schedule.
    relatedQuestionRefs:
    - QO025
    - QO026
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: material
    topic: apprenticeship-outcomes
    missingEvidence: A current regulator or provider-level outcomes table covering completion, achievement, and withdrawal rates across the learner base.
    whyItMatters: Revenue leadership and customer logos do not fully answer whether learner outcomes remain durable as the model shifts toward enterprise AI upskilling.
    diligencePath: Request the latest ILR or provider outcomes pack and compare it with recent regulatory commentary and customer cohorts.
