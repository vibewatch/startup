company:
  name: Multiverse
chapter:
  number: 1
  title: Company Overview
  summary: Multiverse is a London-headquartered private workforce-upskilling company that has repositioned from apprenticeship placement into enterprise AI adoption, with public materials now claiming more than 1,500 employers and 22,000 learners. Its May 2026 $70 million financing at a $2.1 billion valuation, plus partnerships with Microsoft, Palantir, and major employers and the StackFuel acquisition in Germany, support a live expansion story across Europe. But the public record still leaves material underwriting gaps around exact current headcount, detailed governance, and the mechanics behind employee liquidity and recent valuation recovery.
sections:
- id: identity-and-model
  title: Identity, model, and current operating footprint
  body: 'Multiverse’s company-overview record is now much clearer than its older WhiteHat apprenticeship identity, but the strongest description of the business still comes from the company itself. The official website and mission pages repeatedly frame Multiverse as an upskilling platform for AI and tech adoption, not just a recruiter of school leavers into entry-level apprenticeships. That matters because the operating model has broadened into diagnostics, personalised learning pathways, AI-assisted coaching, and employer-funded programmes that sit inside broader workforce-transformation agendas. The public footprint also supports real scale: the company says it works with more than 1,500 employers and has supported more than 22,000 learners, while customer and partner releases show active work across the UK and US plus a now-explicit push into continental Europe through Germany. The durable takeaway is that Multiverse has become a workforce-enablement layer for enterprise AI, data, and
    digital adoption, even if the cleanest articulation of that position remains management-authored rather than independently audited.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO008
  tableRefs:
  - TO001
