    - label: Core Multiverse-aligned channel
      value: 243.3k levy-funded starts; 39.8% level 4+; digital tech 7.7%
      note: Closest official shell for higher-skill employer-funded apprenticeship demand.
    - label: Public company traction layer
      value: 1,000+ employers / 16,000+ apprentices / £58.9m provider revenue
      note: Company claims plus FE Week provider-revenue ranking for 2023/24-2026 public evidence.
