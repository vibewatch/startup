  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-economics
    missingEvidence: Public pricing, ACV, cohort size, and expansion economics by employer segment.
    whyItMatters: Without pricing and ACV, outside-in SAM and payback analysis remain too soft for underwriting.
    diligencePath: Request current rate cards, cohort minimums, ACV by product family, and renewal-driven expansion data.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM005
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Revenue split between levy-funded apprenticeships and employer-paid AI adoption or consulting-like work.
    whyItMatters: This split determines how exposed the business is to UK policy changes versus discretionary enterprise budgets.
    diligencePath: Request FY2026 revenue by geography, product, funding route, and learner level.
    relatedQuestionRefs:
    - QM022
    - QM026
    relatedTableRefs:
    - TM005
  - type: private-evidence-only
    severity: blocking
    topic: us-expansion-proof
    missingEvidence: Current US customers, revenue, headcount, and unit economics after the previously reported failed America expansion.
    whyItMatters: US optionality is a major valuation swing factor and is not proved by retained public sources.
    diligencePath: Request current US pipeline, won accounts, losses, revenue, and product modifications by state or segment.
    relatedQuestionRefs:
    - QM020
    - QM024
    relatedTableRefs:
    - TM005
  - type: stale
    severity: material
    topic: post-level7-policy
    missingEvidence: Company-level exposure to standards affected by the January 2026 level-7 funding change and the pace of standards refresh under Skills England.
    whyItMatters: Official market data show behavioural change, but public company disclosures do not isolate sensitivity.
    diligencePath: Request bookings, backlog, and revenue mix by level, plus current standard-refresh lead times.
    relatedQuestionRefs:
    - QM025
    relatedTableRefs:
    - TM005
