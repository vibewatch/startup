- calloutType: risk
  title: Near-term economics are still highly policy-shaped
  body: The UK core market is real, but conversion depends heavily on levy mechanics, funding-rule stability, employer budget discipline, and the political scrutiny now surrounding expensive higher-level programmes. That means the business should not be underwritten as if policy risk were negligible.
