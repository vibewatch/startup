  rows:
  - - UK levy-funded professional apprenticeships
    - Employer-funded apprenticeship training and assessment for digital, data, and AI-related roles
    - Wages, generic compliance training, and non-approved qualifications
    - CHRO/L&D with finance or levy owner
    - Core monetisation channel and the closest public market shell
  - - Employer-paid AI adoption and data capability programmes
    - AI tool adoption, data fluency, productivity, and role-based digital capability building
    - Consumer self-pay learning and generic content subscriptions
    - L&D, transformation office, or business-unit budget
    - Adjacent expansion layer that broadens budget owners beyond classic apprenticeships
  - - Adult FE and skills provision
    - Adult level 3, FE, and bootcamp-style public skills delivery
    - Enterprise coaching, managed cohorts, and company-specific change support
    - State funding with some employer or learner contribution
    - Important substitute and talent-supply layer, but not the same revenue pool
  - - US registered apprenticeship market
    - Employer-sponsored paid on-the-job programmes across many occupations
    - England-style levy mechanics and a single national payroll-tax funding model
    - Employer, state, or federal programme support
    - Relevant expansion shell but not a one-to-one copy of UK economics
  - - Status-quo substitute stack
    - Internal L&D, consultants, universities, and the official apprenticeship marketplace
    - A fictional one-vendor baseline
    - Employer or learner depending on route
    - Explains why Multiverse competes against multiple substitute paths, not one product category
  notes: 'Boundary logic is job-to-be-done based: the core shell is employer-funded work-based upskilling; adjacent layers matter when they either supply talent or compete for the same employer budget.'
