- id: TM005
  title: Highest-value remaining market diligence gaps
  columns:
  - gap
  - current public state
  - why it matters
  - exact diligence path
  rows:
  - - UK pricing and ACV by employer segment
    - Public sources show provider revenue and ROI claims but no price cards, ACV, or cohort economics.
    - Valuation depends on contract size, seat density, and expansion path.
    - Request current rate cards, average contract value, minimum cohort size, and renewal cohorts by employer segment.
  - - Revenue split between levy-funded apprenticeships and employer-paid AI adoption work
    - Company positioning spans both, but public revenue disclosures do not separate funding source or product family.
    - This determines how exposed the business is to UK policy changes versus discretionary enterprise budgets.
    - Request FY2026 revenue by geography, product line, and funding mechanism.
  - - Independent outcome evidence
    - Public ROI and employer-count claims are company-supplied rather than independently audited in retained sources.
    - Renewal quality and moat depend on measured business outcomes, not just company claims.
    - Request third-party impact studies, completion rates, wage effects, promotions, and productivity measures.
  - - US expansion proof points
    - FE Week cites failed US expansion and no retained 2026 source discloses current US customers or revenue.
    - US optionality could be overstated in valuation if the second engine is still unproven.
    - Request current US pipeline, active customers, revenue, headcount, and product modifications.
  - - Post-level-7 policy sensitivity
    - Official data show a surge before the January 2026 funding restriction, but no public source isolates Multiverse’s exposure.
    - A concentrated mix in affected standards could change near-term growth and margin.
    - Request bookings, backlog, and revenue mix by level, age, and affected standard.
  notes: These are the market-analysis gaps most likely to change SAM confidence, growth durability, and risk-adjusted underwriting.
