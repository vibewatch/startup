- id: buyer-map
  title: Buyer, user, and payer motion is cross-functional and ROI-led
  body: |-
    Multiverse’s buying motion is better understood as an organisational change purchase than as a narrow training SKU. The natural sponsor is usually a CHRO, L&D leader, transformation office, or business-unit owner trying to close an AI, data, or productivity gap. End users can be junior-to-mid professionals, aspiring analysts, and AI champions embedded in business functions, which moves the product away from the image of apprenticeship as only an entry-level pathway. Because Multiverse presents itself as an ROI-linked platform, Finance and Procurement become real gatekeepers: they care about the levy treatment of spend, the link between training and measurable productivity, and the opportunity cost of funding a long programme during a cost-management cycle.

    This matters for adoption speed. Current independent survey evidence shows employers still face hard-to-fill roles and still pay up for specialised skills, but budgets are being managed tightly and training teams remain capacity constrained. That means the strongest adoption trigger is not generic enthusiasm for learning. It is a concrete operational pain point such as AI-tool rollout, a hard-to-fill capability gap, or a board-level productivity mandate that can justify sponsorship and budget. The same evidence base also implies where deployment is harder: lower-skilled or less-qualified worker populations participate in training much less often, so scale is likelier to come first through cohorts where digital fluency and manager sponsorship are already present.
