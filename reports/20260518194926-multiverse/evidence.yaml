evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance-disclosure
    missingEvidence: A current board list, governance charter, and cap-table level ownership summary for the private company.
    whyItMatters: >-
      Board composition, control rights, and investor protections materially affect governance risk and downside
      protection.
    diligencePath: Request current board materials, shareholder list, and any investor rights summary in the data room.
    relatedQuestionRefs:
      - QO008
      - QO026
    relatedTableRefs:
      - TO002
      - TO003
  - type: stale
    severity: material
    topic: headcount
    missingEvidence: A current total employee count by geography and function after the US retrenchment and StackFuel integration.
    whyItMatters: >-
      Public sources only show dated snapshots, which makes productivity, burn, and integration planning hard to
      underwrite.
    diligencePath: Request the latest org chart, month-end headcount report, and geography split from management.
    relatedQuestionRefs:
      - QO014
      - QO026
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: employee-liquidity
    missingEvidence: >-
      Detailed terms for employee equity in the 2026 financing, including whether any secondary liquidity cleared and on
      what terms.
    whyItMatters: >-
      Liquidity mechanics affect retention, effective valuation quality, and how much of the round was true primary
      growth capital.
    diligencePath: Ask for the financing summary, employee equity memo, and any secondary or tender allocation schedule.
    relatedQuestionRefs:
      - QO025
      - QO026
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: apprenticeship-outcomes
    missingEvidence: >-
      A current regulator or provider-level outcomes table covering completion, achievement, and withdrawal rates across
      the learner base.
    whyItMatters: >-
      Revenue leadership and customer logos do not fully answer whether learner outcomes remain durable as the model
      shifts toward enterprise AI upskilling.
    diligencePath: >-
      Request the latest ILR or provider outcomes pack and compare it with recent regulatory commentary and customer
      cohorts.
    relatedQuestionRefs:
      - QO017
      - QO026
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: financial-transparency
    missingEvidence: An audited bridge for revenue by geography and product line, plus gross margin and burn information for 2025-2026.
    whyItMatters: >-
      A private-market rerating is easier to accept if growth, margins, and cash inflection can be tested beyond
      company-selected headline metrics.
    diligencePath: Request audited financial statements, board reporting packs, and a 2026 operating plan with monthly actuals.
    relatedQuestionRefs:
      - QO013
      - QO026
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: pricing-economics
    missingEvidence: Public pricing, ACV, cohort size, and expansion economics by employer segment.
    whyItMatters: Without pricing and ACV, outside-in SAM and payback analysis remain too soft for underwriting.
    diligencePath: Request current rate cards, cohort minimums, ACV by product family, and renewal-driven expansion data.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM005
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: Revenue split between levy-funded apprenticeships and employer-paid AI adoption or consulting-like work.
    whyItMatters: This split determines how exposed the business is to UK policy changes versus discretionary enterprise budgets.
    diligencePath: Request FY2026 revenue by geography, product, funding route, and learner level.
    relatedQuestionRefs:
      - QM022
      - QM026
    relatedTableRefs:
      - TM005
  - type: private-evidence-only
    severity: blocking
    topic: us-expansion-proof
    missingEvidence: >-
      Current US customers, revenue, headcount, and unit economics after the previously reported failed America
      expansion.
    whyItMatters: US optionality is a major valuation swing factor and is not proved by retained public sources.
    diligencePath: Request current US pipeline, won accounts, losses, revenue, and product modifications by state or segment.
    relatedQuestionRefs:
      - QM020
      - QM024
    relatedTableRefs:
      - TM005
  - type: stale
    severity: material
    topic: post-level7-policy
    missingEvidence: >-
      Company-level exposure to standards affected by the January 2026 level-7 funding change and the pace of standards
      refresh under Skills England.
    whyItMatters: Official market data show behavioural change, but public company disclosures do not isolate sensitivity.
    diligencePath: Request bookings, backlog, and revenue mix by level, plus current standard-refresh lead times.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM005
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Standard enterprise contract prices, cohort minimums, and discount structures for Multiverse, QA, Makers, Guild,
      and Correlation One.
    whyItMatters: >-
      Public substitutes provide visible price anchors, but the main employer-platform peers do not, limiting
      apples-to-apples procurement analysis.
    diligencePath: >-
      Request current price cards, realised price per learner, and minimum cohort commitments from vendor sales teams or
      customer references.
    relatedQuestionRefs:
      - QP011
    relatedTableRefs:
      - TP003
  - type: access-blocked
    severity: material
    topic: provider-outcomes
    missingEvidence: >-
      Current like-for-like official provider-detail pages or recent public achievement-rate data for Multiverse and
      each direct apprenticeship peer.
    whyItMatters: >-
      QA and Makers have usable public inspection evidence, but the broader direct-outcome comparison is incomplete
      without current provider-detail access for every comparable supplier.
    diligencePath: >-
      Pull current apprenticeship-service provider-detail pages and achievement-rate exports directly from the UK
      apprenticeship service or through maintained screenshots.
    relatedQuestionRefs:
      - QP023
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: liquidity-runway
    missingEvidence: >-
      Exact post-May-2026 cash balance, any venture debt or facility draws, and a monthly cash bridge from 31 March 2025
      to close of the new round.
    whyItMatters: >-
      Without a post-raise balance-sheet view, public evidence can show direction of travel but cannot underwrite runway
      or covenant risk.
    diligencePath: >-
      Request board-approved cash forecast, monthly management accounts, bank balances, and any debt or covenant package
      used in the 2026 financing process.
    relatedQuestionRefs:
      - QI010
      - QI023
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback period, enterprise sales cycle, renewal rate, and expansion revenue split by customer cohort.
    whyItMatters: >-
      Revenue per employee improved, but that does not reveal whether new revenue is efficient, repeatable, or dependent
      on unusually large customers.
    diligencePath: >-
      Request pipeline funnel data, cohort-level contract history, renewal cohorts, and sales-headcount productivity by
      segment.
    relatedQuestionRefs:
      - QI012
  - type: private-evidence-only
    severity: material
    topic: gross-margin
