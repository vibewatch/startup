- id: renewal-and-roi
  title: Renewal, ROI, and durability proxies
  body: 'The renewal and ROI picture is directionally positive, but the evidence quality is mixed. Multiverse''s own learner-outcomes page makes the boldest durability claims, saying customers have generated $2bn+ in confirmed ROI and that net revenue retention is above 100% after the first programme. Those are attractive late-stage software-style metrics, but they are not broken out by cohort, geography, or customer segment, so they should be treated as management-selected aggregates rather than independently underwritten retention math. The more credible public renewal proxies are account-specific. John Lewis says it plans multiple new cohorts, Orange Business says a successful pilot was expanded over the following year, QS says annual cohorts have grown since 2023, and Capita reports a first-cohort NPS of 63 with employees now pushing to join later cohorts. The older 2023 impact-report release is useful as a historical floor rather than a current KPI: it said 93% of apprentices remained
    at their company post-programme and that in-programme work had generated $669m of business value that year. Taken together, the public record supports land-and-expand behaviour, but it still does not disclose GRR, top-account churn, contract length, or the bridge from learner-level value creation into account-level renewals.

    '
