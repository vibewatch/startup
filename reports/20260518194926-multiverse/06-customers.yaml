- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration or durability risk
  - Evidence
  - Impact
  - Diligence path
  rows:
  - - Large levy-funded UK enterprise programmes
    - UK training budgets and levy policy appear central to many named expansions
    - John Lewis, Nationwide, L&G, Capita, and The AA all reference levy-funded or apprenticeship-based programmes
    - Budget tightening or policy change could slow expansions even with strong logos
    - Request revenue split between levy-funded spend and direct non-levy enterprise spend
  - - Public-sector and NHS adoption
    - Public procurement cycles and partner dependency can slow deployment even with strong mission fit
    - NLFT, Leeds, and NHS FDP references show public-sector traction; the FDP push also depends on Palantir rollout
    - Slower procurement or implementation could delay realised revenue
    - Request signed contract count, cohort starts, and renewal dates for NHS and council accounts
  - - AI upsell inside existing logos
    - Public proof is rich on pilots and first cohorts but sparse on audited renewals
    - 100%+ NRR claim, QS growth, Capita next-cohort demand, and Orange expansion are all positive but mostly self-reported
    - Investors could overestimate expansion durability from selected case studies
    - Request cohort-to-account conversion and renewal data for the top 20 logos
  - - U.S. and international diversification
    - The U.S. apprenticeship model appears less stable for Multiverse than the UK model
    - Citi remains a positive U.S.-linked proof point, but Workshift says Multiverse withdrew from U.S. registered apprenticeships as budgets tightened
    - U.S. diversification may be weaker than headline branding suggests
    - Request current U.S. customer count, revenue mix, and pipeline by product
  - - Completion and delivery quality
    - Lower completion rates can undermine employer confidence and renewals
    - BritBrief reports 52.6% completion versus 65.4% sector average
    - Renewal risk may rise if outcomes deteriorate or Ofsted pressure increases
    - Request employer renewal and expansion by completion-rate band
  - - Top-customer concentration disclosure
    - No public top-customer share, ACV, or contract-length disclosure exists
    - The public record provides logo breadth but no ranked customer revenue table
    - A small number of large UK accounts could carry more revenue than the public evidence suggests
    - Request top-10 customer revenue share, contract terms, and upcoming renewal calendar
  notes: Concentration risk is inferred from the structure of the public evidence base because Multiverse does not publish ranked customer revenue disclosures.
