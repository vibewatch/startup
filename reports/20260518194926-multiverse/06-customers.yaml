- id: named-customer-proof
  title: Named customer proof and measured workplace outcomes
  body: 'The strongest part of the customer chapter is the quality of named proof. John Lewis has a clearly scaled, multi-year data-skills deployment: the retailer says it launched its first cohort in 2023, now has more than 600 data apprentices across the business, and has already seen learner-built dashboards linked to customer service improvements. Nationwide provides an earlier-stage but still credible account-level proof set, publishing the baseline problem size of 14.3 hours per week spent on data tasks, a 33-learner March 2024 cohort, and time savings from deployed dashboards. Jaguar Land Rover goes further into operational ROI, saying one learner project helped add 600 cars per week and another saved 85 hours per month. NHS and public-sector case studies also move beyond generic learning language: NLFT describes a five-year strategic data priority, 100% learner alignment with Trust strategy, and one project that reduced patients awaiting assessments from 25 to one within nine months,
    while Leeds Health and Care Academy reports a 17.5% efficiency improvement in handling data tasks. Just Eat, QS, Citi, and Capita deepen the evidence set with daily-skill-use, cost savings, line-manager impact, and cohort-satisfaction signals. None of this is the same thing as audited account profitability or renewal, but it is materially stronger than a customer-logo carousel.

    '
