  evidenceGaps:
  - type: missing-source
    severity: material
    topic: top-customer-concentration
    missingEvidence: Complete named-customer roster or ranked top-10 customer revenue share, ACV, contract length, and next renewal dates by account.
    whyItMatters: Public logo breadth does not reveal whether a handful of large UK accounts or public-sector cohorts dominate revenue.
    diligencePath: Request a customer concentration schedule from management with revenue, seats, term dates, and renewal status for the top 20 accounts.
    relatedQuestionRefs:
    - QU017
    - QU025
    relatedTableRefs:
    - TU003
    - TU005
  - type: private-evidence-only
    severity: material
    topic: segment-retention-math
    missingEvidence: GRR, NRR, and churn broken out by geography, segment, and cohort vintage, plus a bridge from learner-level value to account renewal.
    whyItMatters: The public 100%+ NRR claim is directionally positive, but without cohort detail it cannot be used as a clean underwriting input.
    diligencePath: Ask for cohort retention tables by account vintage, segment, and product family, including logo churn and contraction.
    relatedQuestionRefs:
    - QU013
    - QU014
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: us-customer-density
    missingEvidence: Current U.S. customer count, U.S. revenue contribution, and post-withdrawal pipeline or renewal data.
    whyItMatters: Citi is a positive U.S.-linked proof point, but the Workshift pullback story suggests U.S. durability may be weaker than headline branding implies.
    diligencePath: Request U.S. logo count, booked revenue, active cohorts, and pipeline by product after the registered-apprenticeship withdrawal.
    relatedQuestionRefs:
    - QU007
    - QU019
    relatedTableRefs:
    - TU001
    - TU005
  - type: conflicting-data
    severity: minor
    topic: completion-versus-employer-value
    missingEvidence: Employer-by-employer evidence showing whether low completion rates actually impair renewal, expansion, or satisfaction.
    whyItMatters: Blair's claim that many withdrawals still create value partially offsets completion concerns, but it does not prove customer durability.
    diligencePath: Request renewal and NPS data segmented by completion-rate band and programme family, with employer comments from at-risk cohorts.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU004
    - TU005
