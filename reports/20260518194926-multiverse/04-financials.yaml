- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Impact on underwriting
  - Current public proxy
  - Exact diligence path
  rows:
  - - Segment revenue mix by geography and funding source
    - Cannot judge how much revenue quality depends on the UK levy system versus discretionary enterprise budgets
    - Programme catalogue, US page, Oxford contracts, and customer logos only
    - Request FY2025 to FY2026 management accounts split by UK levy, levy transfer, direct enterprise, and US revenue
  - - Gross margin by programme family
    - Cannot tell whether the model scales like software or labour-intensive training services
    - No public gross-margin disclosure
    - Request cohort P&Ls, coach utilisation, and curriculum amortisation schedule
  - - CAC, payback, and sales cycle
    - Cannot assess sales efficiency or durability of enterprise growth
    - Employer count and customer logos only
    - Request funnel conversion data, ACV, renewal cohorts, and payback by segment
  - - Post-raise cash, debt, and covenants
    - Runway cannot be fully underwritten from FY2025 figures plus a headline raise amount
    - FY2025 cash plus May 2026 funding announcement
    - Request closing balance sheet, debt schedule, covenant package, and 24-month cash forecast
  - - Completion and quality trend by cohort
    - Below-sector outcomes could affect repeat buying, support cost, or regulatory burden
    - BritBrief completion-rate report and Ofsted / DWP oversight pages
    - Request official DfE provider extracts, Ofsted correspondence, and employer-level completion data
  - - Realised pricing and discounting
    - No way to translate catalogue depth into blended ASP or margin
    - Oxford and AA give examples, not a pricing book
    - Request standard funding bands, realised revenue per learner, and discount policy by customer type
  notes: Every row is a real underwriting blocker rather than a generic wish list. The biggest public deficiency is not lack of company activity; it is lack of disaggregated financial disclosure.
  enumerationScope:
    coverage: partial
    basis: Rows capture the highest-value missing metrics identified during chapter research, but additional diligence items would likely surface once management accounts are opened.
