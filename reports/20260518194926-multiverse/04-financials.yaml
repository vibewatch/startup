tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Unit
  - Public value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - UK levy-funded apprenticeships
    - Training delivered against employer levy balances under approved standards
    - Learner / apprenticeship standard
    - Core observable UK stream; FE Week reported £58.9m of apprenticeship revenue in FY2024
    - High demand, but exposed to completion quality and levy-policy rules
    - Request FY2025 to FY2026 revenue split by standard, learner type, and levy vs non-levy funding
  - - Levy-transfer funded public-sector cohorts
    - Third-party levy transfers arranged alongside customer contracts
    - Contract / cohort
    - Oxford example used about £135k of council levy plus £360k of Cisco transfer
    - Good collection if transfer is secured, but sourcing transfers adds complexity
    - Request proportion of revenue that depends on transfer brokers rather than customer-owned levy
  - - Direct enterprise AI and data upskilling
    - Employer-paid cohort contracts around AI, data, and business-value programmes
    - Cohort / employer account
    - AA disclosed a 50-person AI cohort; official pages show enterprise-focused catalogues but no price list
    - 'Medium quality: strong logos, weak transparency on ASPs and renewals'
    - Request ACV, renewal rate, and expansion revenue by employer cohort
  - - US apprenticeship or workforce-development contracts
    - Employer-funded programmes outside the UK levy system
    - Employer account / cohort
    - US page claims experience with more than 500 companies but no revenue split
    - 'Medium-low: validates a second geography but not the economics'
    - Request US revenue, gross margin, and sales efficiency separately from UK levy-funded work
  - - Advanced technical apprenticeships
    - Longer Level 5 and Level 6 data, AI, and engineering programmes
    - Learner over 15 to 24 months
    - Official pages show longer-duration programmes with likely higher revenue per learner
    - Potentially attractive ASPs, but delivery intensity could also be higher
    - Request realised revenue per learner and coach utilisation by programme family
  notes: The public record supports the existence of multiple enterprise-training revenue streams, but not a disclosed revenue mix. UK levy-funded training is the most visible stream; realised pricing and segment contribution remain private.
  enumerationScope:
    coverage: partial
    basis: Five public revenue mechanisms were identifiable from official programme pages, procurement documents, and customer disclosures, but Multiverse does not publish a full segment mix.
