  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: liquidity-runway
    missingEvidence: Exact post-May-2026 cash balance, any venture debt or facility draws, and a monthly cash bridge from 31 March 2025 to close of the new round.
    whyItMatters: Without a post-raise balance-sheet view, public evidence can show direction of travel but cannot underwrite runway or covenant risk.
    diligencePath: Request board-approved cash forecast, monthly management accounts, bank balances, and any debt or covenant package used in the 2026 financing process.
    relatedQuestionRefs:
    - QI010
    - QI023
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: CAC, payback period, enterprise sales cycle, renewal rate, and expansion revenue split by customer cohort.
    whyItMatters: Revenue per employee improved, but that does not reveal whether new revenue is efficient, repeatable, or dependent on unusually large customers.
    diligencePath: Request pipeline funnel data, cohort-level contract history, renewal cohorts, and sales-headcount productivity by segment.
    relatedQuestionRefs:
    - QI012
  - type: private-evidence-only
    severity: material
    topic: gross-margin
    missingEvidence: Programme-level gross margin, coach or tutor utilisation, curriculum amortisation, and support cost per active learner.
    whyItMatters: Multiverse may look software-like from the outside, but investor returns depend on whether delivery economics scale like services or software.
    diligencePath: Request cohort P&Ls by programme family, delivery staffing model, utilisation data, and a gross-margin bridge from revenue to contribution profit.
    relatedQuestionRefs:
    - QI021
  - type: enumeration-incomplete
    severity: minor
    topic: pricing-disclosure
    missingEvidence: Standard-by-standard public price list or realised average selling price by programme, geography, and customer type.
    whyItMatters: Public examples prove Multiverse can win meaningful contracts, but they do not reveal blended ASPs, discounting, or price realisation.
    diligencePath: Request standard funding bands, realised revenue per learner, and discount policy by customer type.
    relatedQuestionRefs:
    - QI005
    relatedTableRefs:
    - TI002
  - type: missing-source
    severity: material
    topic: completion-quality
    missingEvidence: Official cohort-by-cohort completion, withdrawal, and achievement data that reconcile public scrutiny with current employer economics.
    whyItMatters: Weak outcomes could reduce repeat buying, trigger regulator attention, or increase delivery cost if support intensity must rise to protect results.
    diligencePath: Request the current DfE provider dataset, Ofsted correspondence, and employer-level completion data for major cohorts.
    relatedQuestionRefs:
    - QI018
    relatedTableRefs:
    - TI005
