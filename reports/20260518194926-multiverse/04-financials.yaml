- id: TI004
  title: Capital adequacy table
  columns:
  - Capital item
  - Public value / status
  - Evidence / method
  - Confidence
  - Implication / diligence ask
  rows:
  - - Latest pre-raise cash on hand
    - £81.8m at FY2025 year-end
    - Reported from filed FY2025 accounts in multiple outlets
    - medium
    - Liquidity looked adequate near term, but materially lower than the year before
  - - FY2025 burn proxy
    - £63.3m pre-tax loss and ~£53.6m cash decline
    - Combines reported loss with cash movement
    - medium
    - Standalone runway looked finite without better margins or new capital
  - - May 2026 new equity
    - $70m / €60m primary funding
    - Official press release plus independent news corroboration
    - high
    - Likely intended to replenish runway and fund expansion rather than simply repair optics
  - - Stated use of funds
    - European expansion and AI-adoption platform growth, including StackFuel integration
    - Official company disclosure
    - high
    - Signals continued growth investment, not full austerity mode
  - - December 2025 equity activity
    - 11,433 B ordinary shares allotted for cash
    - Companies House SH01
    - high
    - Confirms financing-related equity activity before the public May 2026 round
  - - Debt / project-finance obligations
    - No public debt or project-finance facility identified in reviewed sources
    - Observed absence across filings summary, press coverage, and official disclosures
    - medium
    - Request debt schedule, covenants, and any venture debt or warehouse lines
  - - Next-round trigger
    - Public evidence still suggests another funding event or clear breakeven proof may be needed if losses stay elevated
    - Inference from FY2025 cash, losses, and the new 2026 raise
    - low
    - Request board plan for breakeven, downside runway, and financing contingency
  notes: This table uses the public record only. It is informative on timing and direction, but it is not a substitute for a post-raise balance sheet and financing package.
