- id: capital-adequacy-and-adverse-signals
  title: Capital adequacy and adverse signals
  body: 'This chapter does not restate the full funding chronology from Company Overview, but the pieces needed for capital adequacy are visible. Companies House confirms the latest filed accounts run only to 31 March 2025, while a December 2025 share allotment and the official May 2026 fundraise show that fresh equity activity continued close to the latest balance-sheet date. The new $70 million raise and first reported cash-positive quarter reduce immediate solvency pressure, yet they do not remove the need for diligence because the public record does not show post-raise cash, debt, or covenant terms. Adverse signals also remain meaningful. Multiverse has already restructured away from parts of its early-talent and US expansion strategy, public-sector risk registers explicitly discuss delivery-volume and quality risk, and BritBrief reported completion rates below the sector average together with expected Ofsted attention. Those issues matter financially because levy-funded programmes depend
    on employer confidence, programme suitability, and acceptable outcomes. Capital adequacy therefore looks improved but not fully de-risked: the company has bought time, not full public transparency.'
