company:
  name: Multiverse
chapter:
  number: 4
  title: Financials
  summary: 'Public evidence shows Multiverse scaling quickly but still operating with startup-like burn: FY2025 revenue rose to £79.6 million, pre-tax loss widened to £63.3 million, and cash fell to £81.8 million before a fresh $70 million raise in May 2026. Revenue quality is partly underwritten by UK apprenticeship-levy flows and large enterprise cohorts, but realised pricing, gross margin, CAC or payback, and segment mix remain undisclosed. Recent layoffs, completion-rate scrutiny, and labour-heavy delivery costs keep underwriting confidence constrained despite first-quarter cash positivity in 2026.'
sections:
- id: revenue-model-and-funding-flows
  title: Revenue model and apprenticeship funding flows
  body: 'Multiverse is not a consumer edtech subscription business; the public record shows an enterprise training provider whose revenue is largely monetised through apprenticeship programmes and related workforce-upskilling cohorts. Official pages position the company as an AI, data, and engineering upskilling platform serving more than 1,500 employers across the UK and US, while the US page separately claims experience with more than 500 companies. That means revenue quality depends less on freemium conversion or SMB seat expansion and more on employer training budgets, apprenticeship eligibility, and cohort-level renewals. In the UK, the economic plumbing matters: the apprenticeship levy diverts payroll into a governed funding pool, and Oxford City Council''s procurement documents show Multiverse can supplement customer budgets with levy transfers from large partners such as Cisco. Public evidence therefore supports a revenue model built on funded apprenticeship standards, transferred
    levy balances, and direct enterprise cohort contracts, not on transparent software list pricing. Programme pages publish duration and qualification level, but not realised price, discounting, or average revenue per learner. That makes the model understandable in mechanism terms while leaving revenue mix and unit economics only partially visible.'
