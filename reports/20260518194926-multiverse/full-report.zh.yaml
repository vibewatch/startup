              本章不重述公司概况中的完整融资时间线，但资本充足性需要的要件是可见的。Companies House 确认最新备案账目只到 31 March 2025，而 December 2025 股份配发和官方 May
              2026 融资显示，接近最新资产负债表日时仍有新股活动。新的 $70 million
              融资和首次披露的季度现金流转正，降低了即时偿债压力，但并未消除尽调需要，因为公开记录没有展示融资后现金、债务或约束条款。反向信号同样有意义。Multiverse 已经从部分早期人才和 US
              扩张战略中重组退出，公共部门风险登记明确讨论交付量和质量风险，BritBrief 也报道完成率低于行业平均，并预计 Ofsted
              会关注。这些问题在财务上重要，因为征费资助项目依赖雇主信心、项目适配度和可接受结果。因此，资本充足性看起来改善了，但没有完全去风险：公司买到了时间，而不是完整的公开透明。
