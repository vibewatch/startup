        title: 公开牵引力、成本基础与运营效率
        blocks:
          - type: paragraph
            body: >-
              最清晰的财务趋势，是强劲收入增长与持续经营亏损并存。FE Week 报道，April 2023 至 March 2024 的学徒培训收入为 £58.9 million，高于 £44.1
              million；FY2025 集团账目被广泛报道为收入 £79.6 million、税前亏损 £63.3 million。FY2025 期末现金为 £81.8 million，低于 £135.4
              million，意味着 2026 融资前大约消耗 £53.6 million 现金。据报道，EBITDA 从 -£61.3 million 小幅改善到 -£59.7
              million，方向上积极，但离盈亏平衡仍很远。人工仍是最可见的成本驱动：员工数从 822 降至 813，但员工成本仍上升；据报道，人均收入增长 37%；公司还向 55 名离职员工支付近
              £980,000。London 仍是组织锚点，混合办公政策围绕 London
              办公室展开；外部薪酬数据也显示工资区间很宽，符合一个教练密集交付模式叠加高级企业与技术领导岗位的组织。合并来看，公开牵引力真实，但成本基础仍更像规模化培训服务业务，而不是轻资本软件公司。
