      - number: '2.4'
        title: 增长驱动很强，但政策机制和 US 证据仍是闸门
        blocks:
          - type: paragraph
            body: >-
              Multiverse 的需求论证足够强，值得继续尽调。AI 相关岗位和技能会显著扩张，雇主报告技能变化很快，专门数字能力能获得薪酬和招聘溢价。Multiverse 的公开牵引力和 FE Week
              的提供商排名报道都显示，公司已经是 UK 学徒制中的规模玩家，而不是投机性的试点供应商。这些因素支持一个判断：公司处在有可衡量需求的真实市场，而不是纯叙事类别。


              反向逻辑同样重要。NAO 显示，征费体系并没有直接解决培训投入不足；雇主仍未充分使用资金，预算也可能承压。Multiverse 自己认为标准更新太慢，项目时长规则阻碍雇主采用；在课程很快过时的 AI
              领域，这个问题尤其突出。FE Week 又增加两个谨慎信号：成本更高的 6 级和 7 级项目仍有政治敏感性，公司早期美国推进失败。再叠加缺少公开的 2026 US 客户或收入披露，US
              扩张应被视为期权价值，而不是已经被证明的第二引擎。近端经济性仍更紧地绑定 UK 资金规则、雇主成本纪律，以及公司能否把自称的 ROI 转化为可由独立方信任的续约证据。
