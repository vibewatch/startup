      - number: '2.2'
        title: UK 市场规模真实，但相关外壳窄于未来工作叙事
        blocks:
          - type: paragraph
            body: >-
              England 官方学徒制数据支持一个有意义的近端市场，同时也迫使任何 TAM 主张保持克制。最强的当前外壳是 2024/25 年 353,500 个学徒项目启动、总体 761,500 名参与者，以及
              243,340 个由征费资助的启动。Multiverse 在仍在增长的市场部分最有相关性：高阶项目、数字技术标准，以及面向现有员工的培训。同一官方序列也说明，市场并非简单地又大又涨：启动数和参与人数仍低于
              2017 年前水平，中级学徒项目继续萎缩，近期增长是被资金规则调整前的 7 级项目行为向上拉动。


              两个相邻规模视角扩大了机会，但不让分析滑向想象。第一，学徒制之外的成人 FE 与技能参与者仍超过 1.17 million，尽管该池在 2024/25 下滑。第二，DSIT 的 AI
              技能工作指向一个大得多的结构性需求外壳：预计到 2035 年，直接 AI 岗位将达到 3.9 million，广义 AI 相关职业人数达到 9.7
              million。这些预测能证明长期员工再培训需求很大，但它们是劳动力需求预测，不是当下支出数字。作为 US 扩张背景，Apprenticeship.gov 每年 800,000+
              名学徒显示雇主主导培训市场有相当规模，但该外壳横跨所有职业，并不意味着立即存在一个 Multiverse 规模的 SAM。
