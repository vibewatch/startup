            body: >
              客户章节最强的部分是具名证明质量。John Lewis 有清晰的规模化、多年数据技能部署：这家零售商称其在 2023 年启动第一批队列，如今全公司已有超过 600
              名数据学徒，并已看到学习者搭建的仪表盘与客户服务改善相连。Nationwide 提供较早期但仍可信的账户级证明集，公布了每周花 14.3 小时处理数据任务的基线问题规模、March 2024 的 33
              人队列，以及已部署仪表盘带来的时间节省。Jaguar Land Rover 更进一步进入运营 ROI，称一个学习者项目帮助每周增加 600 辆车，另一个每月节省 85 小时。NHS
              和公共部门案例研究也超越泛泛学习语言：NLFT 描述了五年战略数据优先级、学习者与信托战略 100% 对齐，以及一个项目在九个月内把等待评估患者从 25 人降到 1 人；Leeds Health and Care
              Academy 报告数据任务处理效率提高 17.5%。Just Eat、QS、Citi 和 Capita
              又用日常技能使用、成本节省、一线经理影响和队列满意度信号加深了证据集。这些都不等于经审计的账户盈利能力或续约，但显著强于客户标识轮播。
