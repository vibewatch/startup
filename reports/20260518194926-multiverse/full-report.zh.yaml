              2023 年以来的里程碑序列显示，公司正果断转向企业 AI 赋能，同时仍带着上一轮扩张失误留下的伤痕。客户与合作伙伴证据覆盖了故事的多个层面：Microsoft 关联的 Copilot 培训、KPMG
              队列、Legal & General 的 AI 项目、Palantir 与 NHS 数据平台合作，以及长期运行的 John Lewis 部署，都证明 May 2024 之后商业活动仍在继续。January
              2026 收购 StackFuel 又把欧洲从愿景变成了与 Germany 和 AZAV 认证交付绑定的具体地理扩张计划。反向标记也应留在标准时间线里。Sifted 关于 US
              裁员和后续遣散支付的报道显示，管理层曾让招聘计划跑在收入之前，后来不得不倒车。这不否定当前增长叙事，但会把下一步尽调问题磨得更尖：新的 AI
              采用论点，能否带来比早期学徒制增长剧本更持久的利润率、更强治理和更干净的运营纪律。
