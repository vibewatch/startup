  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争图谱与替代集合
        blocks:
          - type: paragraph
            body: >
              Multiverse 并不在单一品类里竞争。最直接的战斗来自 UK 提供商，它们能使用同样的学徒制资助轨道，并向雇主销售类似的 AI、数据和软件能力，尤其是 QA 和
              Makers。这些供应商重要，因为它们可以满足许多相同买方目标——关闭技术技能缺口、留住员工、展示有凭证的学习结果——而不要求买方选择完全不同的资金或治理模式。已审阅的政府页面也重要，因为它们显示征费资金和非征费共同投资可以直接流向提供商，所以“维持现状”的直接签约仍是购买托管平台的真实替代方案。


              除了直接的学徒制同业，Multiverse 还面对相邻的雇主技能提升替代方案。Guild 销售由雇主付费的学习市场和学院，General Assembly 销售现场团队培训和更短的训练营，Correlation
              One 销售快速企业 AI 赋能和员工项目，Coursera 加 LinkedIn Learning
              则销售可持续使用的订阅内容库，并有公开或近公开的购买模式。实践中，买方可通过多条路解决同一个员工发展任务：优化征费、雇主付费教育福利、短周期工作坊，或自助内容平台。
