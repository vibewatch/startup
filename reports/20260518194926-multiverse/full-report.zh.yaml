  - id: TI001
    title: 收入流表
    columns:
      - 收入流
      - 机制
      - 计价单位
      - 公开数值 / 状态
      - 收入质量
      - 尽调问题
    rows:
      - - 英国学徒税资助的学徒制
        - 按获批标准交付培训，对应扣减雇主学徒税余额
        - 学习者 / 学徒制标准
        - 核心可观测英国收入流；FE Week 报道 FY2024 学徒制收入为 £58.9m
        - 需求高，但受完课质量和学徒税政策规则影响
        - 要求按标准、学习者类型、学徒税与非学徒税资金拆分 FY2025 至 FY2026 收入
      - - 学徒税转移资助的公共部门队列
        - 与客户合同配套安排第三方学徒税转移
        - 合同 / 队列
        - Oxford 案例使用约 £135k 市议会学徒税和 £360k Cisco 转移资金
        - 转移资金锁定后回款质量好，但寻找转移方增加复杂度
        - 要求披露依赖转移撮合方而非客户自有学徒税的收入占比
      - - 企业直付 AI 与数据技能提升
        - 围绕 AI、数据和业务价值项目的雇主付费队列合同
        - 队列 / 雇主账户
        - AA 披露 50 人 AI 队列；官方页面展示面向企业的课程目录，但没有价目表
        - 中等质量：客户 logo 强，但 ASP 和续约透明度弱
        - 按雇主队列要求提供 ACV、续约率和扩张收入
      - - 美国学徒制或劳动力发展合同
        - 英国学徒税体系之外的雇主出资项目
        - 雇主账户 / 队列
        - 美国页面称服务过 500 多家公司，但未披露收入拆分
        - 中低：验证了第二地域，但未验证经济性
        - 要求将美国收入、毛利率和销售效率与英国学徒税资助业务分开披露
      - - 高阶技术学徒制
        - 时间更长的 Level 5 和 Level 6 数据、AI 与工程项目
        - 学习者，周期 15 至 24 个月
        - 官方页面显示项目周期更长，单学习者收入可能更高
        - ASP 可能有吸引力，但交付强度也可能更高
        - 按项目系列要求提供每名学习者实际收入和教练利用率
    notes: 公开记录能证明公司存在多条企业培训收入流，但不能证明收入结构已披露。英国学徒税资助培训是最可见的收入流；实际定价和分部贡献仍未公开。
