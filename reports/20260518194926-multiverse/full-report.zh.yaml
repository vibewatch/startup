        - 软件 / 产品工程师
        - Level 6 学位学徒制
        - 21 个月 + 3 个月评估
        - 从需求到受监控部署，构建 AI 原生产品
        - 公开提及 RAG、API、编排、MCP 和 LLMOps
        - 未公开参考架构或生产级护栏包
      - - Data Fellowship
        - 有志进入 / 新入行数据分析师
        - Level 4 学徒制
        - 13 个月
        - 将业务数据转成分析和 BI 输出
        - 将 SQL、BI、统计和 ML 融入面向岗位的应用学习
        - 未公开样本产物库或受治理的数据模型模板
      - - Applied Data Engineering
