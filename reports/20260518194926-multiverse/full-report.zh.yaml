        - 平台上的现有学员
        - 嵌入式支持功能
        - 项目期间始终可用
        - 回答问题、辅导反思并转接支持
        - 学员旅程中的 AI + 人工支持层
        - 底层模型、数据保留和评估栈仍未披露
