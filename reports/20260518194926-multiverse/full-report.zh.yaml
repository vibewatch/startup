  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品表面与商业形态
        blocks:
          - type: paragraph
            body: >-
              Multiverse 的公开产品表面更接近学徒制运营模型，而不是泛化 LMS 或按席位销售的 SaaS 目录。当前面向 UK 的页面把产品拆成具名
              AI、数据和工程项目，并明确资质等级、时长和资格规则。阶梯从面向业务用户的 AI-Powered Productivity，延伸到面向跨职能自动化负责人的 AI Transformation
              Architect，再进入更深的技术项目，例如 AI Product Engineering、Applied Data Engineering、Java Software Engineering、Advanced
              Data Fellowship Top-Up 和 DevOps Engineering
              Upskiller。这意味着产品表面不是一张单体平台功能清单，而是一组托管的岗位特定路径，打包课程、教练支持、基于工作的项目和评估义务。商业形态也重要。留存公开页面中，Multiverse
              反复把这些项目营销为征费资助的学徒项目，并附带工作权、居住和岗位匹配要求，因此公开 UK 产品与学徒制资助轨道和法定学习者完成机制紧密绑定。相比之下，最清晰的 US 证明点是 Northwell
              Health，故事被表述为面向 155 名 IT 学习者的定制员工技能提升，而不是公开的征费式目录。因此，公开证据支持这样一种看法：Multiverse 是一个嵌入工作流、拥有项目族的培训平台，而不是纯内容订阅。
