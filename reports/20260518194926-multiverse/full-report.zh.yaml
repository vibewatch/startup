        - 低于行业的结果可能影响复购、支持成本或监管负担
        - BritBrief 完成率报告和 Ofsted / DWP 监管页面
        - 要求提供官方 DfE 供应商摘录、Ofsted 往来函件和雇主层面完成数据
      - - 实际定价和折扣
        - 无法把课程目录深度转换为综合 ASP 或毛利
        - Oxford 和 AA 只是样本，不是完整定价簿
        - 要求按客户类型提供标准资金区间、每名学习者实际收入和折扣政策
    notes: 每一行都是真正卡住投资判断的问题，不是泛泛的愿望清单。最大的公开缺口不是公司缺少业务动作，而是缺少分拆财务披露。
