  - id: TP004
    title: 护城河耐久性 / 竞争风险清单
    columns:
      - 护城河主张
      - 威胁 / 替代方案
      - 严重程度
      - 证据 / 理由
      - 尽调问题
    rows:
      - - 原生适配学徒税的雇主交付
        - QA 和 Makers 也在卖原生适配学徒税的 AI 与技术项目
        - 高
        - 直接同行也能使用同一套资金通道，QA 已在营销 2026 年学徒税支持模块化培训的灵活性
        - 按雇主规模和职能，量化进行中 RFP 里相对 QA 和 Makers 的胜率
      - - 嵌入岗位的应用与辅导
        - GA 和 Correlation One 的短项目在买家看来摩擦更低
        - 高
        - Multiverse 交付需要预留时间和经理支持；上线后能增值，但会拖慢售前推进
        - 衡量相对短课替代方案的上线时间、经理负担和实施失败率
      - - 近期规模与融资动能
        - $2.1B 估值需要迅速证明欧洲扩张和收购整合能转化为持久 ROI
        - 高
        - 2026 年融资补足资源，也抬高了欧洲执行的业绩门槛
        - 按队列类型跟踪 StackFuel 整合后的欧洲新增客户和留存
      - - 定价不透明
        - GA 和 Coursera 公布明确基准价，Multiverse 未公布
        - 中
        - 买家能立即比较替代品，却必须进入顾问式流程才可对标 Multiverse
        - 要求按项目系列提供每名学习者的实际标准价格、队列最低人数和平均折扣
      - - 学徒制资金护城河
        - Growth and Skills Levy 扩围可能把预算拉向更短的模块化选项
        - 高
        - QA 已把 2026 年学徒税变化包装成模块化技能培训的资金来源，而不只是完整学徒制
        - 估算若买家把预算转向模块化非学徒制支出，Multiverse 订单中仍能适配的比例
      - - 全球企业邻近赛道
        - Guild 和 Correlation One 无需英国学徒制管理流程，也能赢下雇主技能提升预算
        - 中
        - 这些供应商卖的是市场平台、学院或员工培训项目，从学徒税体系外切入同一问题
        - 识别哪些买家分层需要英国证书，哪些主要看重更快全球落地
    notes: 严重程度反映的是 Multiverse 当前切入口上的竞争压力，不是市场绝对吸引力。若干风险偏战略性而非生死攸关，但会直接影响销售摩擦、采购可比性和护城河耐久性。
