      - number: '8.3'
        title: 情景区间更取决于证据兑现，而不是可服务市场叙事
        blocks:
          - type: paragraph
            body: >-
              本章的乐观、基准和悲观区间有意采用情景法，而不是机械精确计算，因为公开记录没有披露 2026 年轮次条款、当前毛利率或批次盈利能力。 乐观情景假设 2026 年 5 月叙事在持久意义上基本属实：经审计的 2026
              年数字确认多个季度现金为正，增长仍然很强， 欧洲 AI 采用扩张把合作伙伴和公共部门胜利中已经可见的客户证据继续复合放大。基准情景假设，这轮融资作为战略性私募市场价格大致合理，
              但在经审计的利润率改善出现前，上行受限。悲观情景假设，当前增长拐点消退，质量问题仍然可见，公司在投资人心智中开始更接近承压的培训和教育科技可比公司， 而不是稀缺的 AI
              基础设施故事。关键在于，估值上行现在不再主要取决于公司是否真实——它显然是真实的——而取决于新证据能否把一轮可信的私募融资转化为可重复的经济性故事。
