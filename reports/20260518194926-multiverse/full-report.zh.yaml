            body: >
              反向证据没有证明客户大规模流失，但说明不能把客户标识列表误认成已经去风险的客户基础。FE Week 把 Multiverse 失败的 U.S. 扩张和 AI 转向与亏损上升联系在一起，随后又报道 FY2025
              亏损扩大到 £63.3 million，现金几乎减半。Workshift 给出最清晰的客户预算警告：Multiverse 曾暂时退出 U.S. 注册学徒制；学徒制投资人 Ryan Craig 认为，预算收紧时
              CFO 会削减这些项目。这不否定 Citi 代表的剩余 U.S. 机会，但说明 U.S. 客户耐久性弱于 UK 案例研究密度可能暗示的水平。质量侧，BritBrief 报道完成率 52.6%，低于行业平均
