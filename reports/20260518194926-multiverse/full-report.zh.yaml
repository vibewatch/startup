  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 立场
      - 核心论点
      - 当前证据
      - 什么会改变判断
    rows:
      - - 投资逻辑
        - 2026 年 5 月轮次证明 Multiverse 仍能以独角兽以上估值吸引机构资本
        - 困难期后，以 $2.1b 估值完成 $70m 新股融资
        - 若经审计 2026 年数字验证该叙事，信心会进一步上升
      - - 投资逻辑
        - 企业和公共部门证据点支撑真实 AI 采用用例，而不只是教育故事
        - L&G、Palantir/NHS 和 Oxford 证据显示，需求不止停留在营销文案
        - 多年队列续约和利润率披露会带来更强确信
      - - 反向逻辑
        - 最近一个经审计年度看起来仍像亏损培训业务，而不是已验证的软件复利公司
        - FY2025 收入约 £79.6m，同时仍有约 £63.3m 税前亏损和更低现金
        - 只有连续现金转正季度证明交付模式可扩张，判断才会改善
      - - 反向逻辑
        - 质量和披露缺口意味着，当前估值可能高估外部投资者真正能承销的内容
        - 完成率受审视、裁员、无公开轮次条款、无老股交易信号
        - 若轮次条款、单位经济和经审计 2026 年数据披露，判断会改善
    notes: 反向逻辑刻意对价格敏感。同一家公司若提供更高质量数据室，即使业务本身不变，也可能转向更建设性的判断。
