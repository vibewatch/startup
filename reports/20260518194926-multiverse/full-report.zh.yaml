      - number: '1.3'
        title: 融资历史、估值上调与规模信号
        blocks:
          - type: paragraph
            body: >-
              Multiverse 的资本故事如今更像复苏加扩张，而不是防守性过桥，但它并非一条干净直线。2022 Series D 让公司以 $1.7 billion 估值成为 UK 首家教育科技独角兽；May 2026
              的新股融资由 Schroders Capital 领投，主要既有投资人回归，把估值推高到 $2.1 billion。官方材料把这轮融资与强势动能并列，包括收入同比增长 50%，以及 2026
              年初首次季度现金流转正。正面信息不能脱离反向证据来看。独立报道把融资前阶段与亏损扩大、裁员，以及被迫撤回的 US 招聘计划联系在一起。FE Week 的收入榜证据仍支持真实的 UK 市场地位，因为
              Multiverse 在 2023-24 位居学徒制提供商收入第一，并且在前十收入者中唯一被 Ofsted
              评为优秀。因此，这轮融资更像是给仍在亏损、但规模平台可信度上升的公司提供扩张资本，而不是已经充分去风险的后期资产。
