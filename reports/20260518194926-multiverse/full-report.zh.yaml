companyProfile:
  summary: >-
    Multiverse 是一家总部位于 London、2016 年注册成立的私营员工技能提升公司，已从 WhiteHat 的学徒制起点，演变为由雇主付费的
    AI、数据与技术培训平台。公开材料称，公司通过技能缺口诊断、个性化学习路径、AI 辅助教练和学徒制式项目，服务超过 1,500 家雇主、支持 22,000 名学习者。公司在 May 2026 按 $2.1 billion 估值新融
    $70 million，但最新已备案年度证据仍指向约 £79.6 million 收入和 £63.3 million 税前亏损；规模真实，单位经济与治理透明度仍只披露了一部分。
  foundedDate: '2016-02-25'
  founders:
    - name: Euan Blair
      role: 创始人兼 CEO
      background: 创始人兼首席执行官仍是公司最主要的公开发言人，也主导了公司从学徒安置转向企业 AI 技能提升的战略迁移。
      claimRefs:
        - CO009
        - CO013
  foundingLocation: London, UK
  headquarters: London, UK
  productSummary: >-
    Multiverse 向雇主销售员工诊断、AI 与数据学徒项目、AI 采用课程、教练服务和结构化在岗学习路径，项目包括 AI-Powered Productivity、AI Solutions Builder、AI and
    Machine Learning Fellowship、Applied Data Engineering。
  customerFocus: 面向 UK 和 US 的企业雇主与公共部门组织，并已初步扩张到 Germany；这些客户希望在 AI、数据和技术岗位上提升现有员工及部分早期职业人才的技能。
  businessModel: 雇主为队列式培训和员工发展付费；在 UK，许多项目使用学徒制征费或征费转移资金，学习者保持领薪，Multiverse 提供项目设计、交付、教练和评估支持。
