  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Multiverse 应被分析为一家由雇主付费的员工技能提升公司，位于学徒制交付和更广泛 AI 采用服务的交界处，而不是泛化的消费者教育科技公司。公司自身 2026
              年定位从业务目标、员工技能诊断、在岗学习和可衡量 ROI 切入。因此，最接近的公开市场外壳不是整个在线学习宇宙，而是 UK 雇主赞助培训体系，尤其是通过学徒制征费资助的高阶数字与 AI 相关学徒项目。


              相邻外壳又比学徒制本身更宽。Multiverse 还营销 AI-Powered Productivity 等项目，看起来是在围绕 AI 工具采用做企业能力建设，预算可来自
              L&D、转型办公室和业务部门。成人继续教育（FE）与技能供给作为人才供给和替代层有意义，但不是同一个收入池。同样，US 注册学徒制市场是一个可能的扩张外壳，但其资金和设立机制与 England
              由工资税资助的征费模式差异很大。实际替代集合因此很碎：内部 L&D、咨询公司、大学、公共技能供给和官方学徒制市场，都以不同方式争夺同一个雇主问题。
