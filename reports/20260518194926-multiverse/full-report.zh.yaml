      - number: '7.4'
        title: 资本、团队与否决条件
        blocks:
          - type: paragraph
            body: >-
              从资本和团队看，局面仍太脆弱，不能掉以轻心。City AM、FE Week、BusinessCloud 和 IndexBox 报道的 FY2025 结果显示，亏损仍在扩大或维持高位， 2026
              年融资前现金大幅下降，裁员赔付继续发生、员工数下滑。管理层 2026 年 5 月融资公告方向上是正面的：公司拿到新增股本融资、更高估值标记，
              并声称首次实现现金为正的季度，但这还不能关闭尽调问题，因为融资后现金、债务、契约和客户集中度数据仍未披露。领导班子明显比过去更强， AI 推进期间新突出了 CFO
              和董事会层面的科技人物。即便如此，投资人仍在承销一个创始人主导的转型：它横跨监管、合作伙伴集中和跨境扩张， 同时寄望 AI
              采用收入跑赢偏重服务的成本基础。因此，最有用的否决条件应该具体，而不是叙事化：结果恶化、检查偏弱、失去征费契合、再次裁员， 或有证据表明 2026 年融资只是买时间，并没有改变单位经济。
