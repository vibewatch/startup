        - Level 5 学徒制
        - 15 个月 + 3 个月评估
        - 搭建管道、存储和贴合云环境的数据运营
        - 公开课程覆盖数据仓库、数据网格、可观测性和事故响应
        - 没有公开证据显示已有参考部署或可复用加速器
      - - Advanced Data Fellowship Top-Up
        - 已具备 Level 4 数据背景的分析师
        - Level 6 学位学徒制
        - 2 年 + 1 个月评估
        - 打造战略级数据产品和支持 ML 的数据基础设施
        - 增加治理、机器学习、软件和战略项目领导力
        - 公开资料几乎没有说明结课项目案例或导师工具
      - - Java Software Engineering
        - 早期软件工程师
        - 工程学徒制
        - 公开页面列出模块阶梯，没有给出醒目的周期
        - 从基础知识推进到 API、测试、架构和 DevOps
        - 明确强调 Spring Boot、测试纪律和安全发布能力
        - 没有公开样例代码仓库或平台截图
      - - DevOps Engineering Upskiller
        - 转向交付运营的工程师
        - Level 4 学徒制
        - 约 46 周，外加 EPA 准备
        - 安全运行云、CI/CD、容器和维护工作
        - 从云基础到不可变基础设施和监控，阶段推进清晰
        - 没有公开证据说明实验环境或企业集成
