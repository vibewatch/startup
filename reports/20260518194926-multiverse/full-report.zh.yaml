  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 政策与监管敞口
        blocks:
          - type: paragraph
            body: >-
              Multiverse 最大的结构性风险在于，其相当一部分产品市场契合仍然依托学徒政策，而不是完全独立的软件预算。政府资助规则、新的 Growth and Skills Levy，
              以及行业评论都指向一个更灵活的制度：模块化学习空间变大，但对年轻学习者和早期路径的强调也更明确。Multiverse 不必然因此出局，却会面临政策契合风险， 因为公司很多可见客户使用征费资助的 AI
              和数据项目服务在职员工。历史质量背书仍然强：Ofsted 在 2021 年将该提供商评为“卓越”。但 2026 年的反向报道把近期官方数据与 52.6% 完成率（行业平均
              65.4%）联系起来，并称新的监管审视正在加码。再叠加多个司法辖区的正式投诉、隐私和服务可用性条款，监管敞口就形成一组堆叠风险， 可能同时打击收入、销售效率和估值。
