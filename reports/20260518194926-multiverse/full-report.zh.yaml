        title: 续约、ROI 与耐久性代理
        blocks:
          - type: paragraph
            body: >
              续约与 ROI 图景方向上积极，但证据质量混合。Multiverse 自身学习者结果页面给出最强的耐久性主张，称客户已产生 $2bn+ 的已确认 ROI，且首个项目后的净收入留存率（NRR）超过
              100%。这些是有吸引力的后期软件式指标，但没有按队列、地域或客户细分拆开，因此应视为管理层筛选后的汇总，而不是可独立承保的留存数学。更可信的公开续约代理来自具体账户。John Lewis
              称计划多个新队列，Orange Business 称成功试点在随后一年扩展，QS 称年度队列自 2023 年以来增长，Capita 报告首个队列 NPS 为 63，且员工现在主动争取加入后续队列。较早的 2023
              影响报告发布可作为历史地板，而非当前 KPI：它称 93% 学徒项目结束后仍留在本公司，项目内工作当年创造了 $669m
              业务价值。合并来看，公开记录支持先落地再扩张行为，但仍没有披露总留存率（GRR）、大客户流失、合同期限，或学习者层价值创造如何桥接到账户层续约。
