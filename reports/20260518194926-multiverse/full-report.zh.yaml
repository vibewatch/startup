  - id: TU005
    title: 扩张与集中度风险表
    columns:
      - 扩张驱动因素
      - 集中度或耐久性风险
      - 证据
      - 影响
      - 尽调路径
    rows:
      - - 学徒税资助的英国大型企业项目
        - 英国培训预算和学徒税政策似乎是许多具名扩张的核心
        - John Lewis、Nationwide、L&G、Capita 和 The AA 都提到学徒税资助或基于学徒制的项目
        - 即便客户质量高，预算收紧或政策变化也可能拖慢扩张
        - 要求拆分学徒税资助支出与企业直接非学徒税支出的收入占比
      - - 公共部门与 NHS 采用
        - 公共采购周期和伙伴依赖会拖慢部署，即使命题契合度很高
        - NLFT、Leeds 和 NHS FDP 参考案例显示公共部门牵引力；FDP 推进也依赖 Palantir 落地
        - 采购或实施变慢，可能推迟收入确认
        - 要求提供 NHS 和地方议会账户的已签合同数、队列启动数和续约日期
      - - 存量客户内的 AI 增购
        - 公开证据有大量试点和首批队列，但缺少经审计续约
        - 100%+ NRR 声称、QS 增长、Capita 下一队列需求和 Orange 扩张都属正向，但大多由公司自报
        - 投资人可能从精选案例中高估扩张耐久性
        - 要求提供前 20 个客户从队列到账户的转化和续约数据
      - - 美国及国际多元化
        - Multiverse 的美国学徒制模式似乎不如英国模式稳定
        - Citi 仍是一个与美国相关的正向证据点，但 Workshift 称，预算收紧后 Multiverse 退出了美国注册学徒制
        - 美国多元化可能弱于品牌表述给人的印象
        - 要求提供当前美国客户数、收入结构和按产品拆分的销售管线
      - - 完成率与交付质量
        - 完成率较低会削弱雇主信心和续约
        - BritBrief 报告完成率为 52.6%，低于行业平均 65.4%
        - 如果结果恶化或 Ofsted 压力加大，续约风险可能上升
        - 要求按完成率分组提供雇主续约和扩张数据
      - - 头部客户集中度披露
        - 未公开披露头部客户占比、ACV 或合同期
        - 公开记录给出客户覆盖面，但没有按收入排序的客户表
        - 少数大型英国账户贡献的收入可能高于公共证据显示
        - 要求提供前 10 大客户收入占比、合同条款和即将到来的续约日历
    notes: Multiverse 不披露按收入排序的客户信息，因此集中度风险只能从公开证据基础的结构推断。
    claimRefs:
      - CU008
      - CU038
      - CU040
      - CU041
      - CU042
      - CU043
      - CU045
      - CU046
