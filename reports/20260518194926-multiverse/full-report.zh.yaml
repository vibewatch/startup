  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 2026 年估值标记重置叙事，但没有减轻尽调负担
        blocks:
          - type: paragraph
            body: >-
              本章最强的单一事实是，Multiverse 并非只是守住旧的账面估值；它在 2026 年 5 月以披露的 $2.1 billion 估值募集了新增股本资金。 其重要性在于，它确认公司仍是独角兽，也说明经历艰难的
              2023-2025 年后，公司仍能触达高质量投资人。可是同一组证据也解释了为什么承销不能止步于标题。 最新审计年度仍只指向约 £79.6 million 收入、£63.3 million
              税前亏损、现金下降、重组，以及从早期增长押注转向的新战略。 管理层最强的看多数据点——50% 增长和首个现金为正季度——很新，也方向上令人鼓舞，但尚未审计。换句话说，这轮融资证明了价格和融资通道，
              不是持久经济性的完整证据。因此，估值章节必须把 2026 年融资视为真实的外部价格信号，同时仍因证据质量、交付风险和公开轮次条款缺失而打折。
