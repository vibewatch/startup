    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、模式与当前运营版图
        blocks:
          - type: paragraph
            body: >-
              Multiverse 如今的公司概况记录，已经比早期 WhiteHat 学徒制身份清晰得多，但最有力的业务描述仍来自公司自身。官网和使命页面反复把 Multiverse 定位为面向 AI
              与技术采用的技能提升平台，而不只是把离校生招聘进入初级学徒岗位的机构。关键在于，运营模式已经扩展到诊断、个性化学习路径、AI
              辅助教练，以及嵌在更大员工转型议程里的雇主付费项目。公开足迹也支撑了真实规模：公司称与超过 1,500 家雇主合作，已支持超过 22,000 名学习者；客户和合作伙伴发布显示，UK 与 US
              都有活跃项目，并且通过 Germany 明确推进欧洲大陆扩张。持久结论是，Multiverse 已成为企业 AI、数据和数字化采用中的员工赋能层，尽管这一定位最干净的表述仍由管理层撰写，而非独立审计。
