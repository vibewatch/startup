      - number: '8.4'
        title: 建议、持有纪律与仍关键的尽调关口
        blocks:
          - type: paragraph
            body: >-
              基于公开证据，正确的投资姿态不是否认进展或品类潜力，而是正确给剩余不确定性定价。Multiverse 有真实的外部估值标记、可信的客户标识， 以及契合当前企业 AI
              支出的叙事。这个组合足以避免“回避”建议，但不足以支持在披露的 2026 年 5 月价格之上付款，除非追加尽调；
              原因在于，最新审计年度仍深度亏损，完成质量担忧仍可能传导到收入耐久性，融资条款也仍不透明。因此，有纪律的投资人应把当前轮次视为最高可接受入场价， 而不是加价乐观的起点。下一段信心需要经审计的 2026
              年证据、轮次条款透明度和更清晰的单位经济披露。在此之前，正确输出是继续研究，并给出偏高估值立场： 公司可投、轮次可信，但证据不足以支撑可承销的买入。
