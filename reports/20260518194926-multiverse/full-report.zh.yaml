        title: 领导层梯队、创始人依赖与治理可见度
        blocks:
          - type: paragraph
            body: >-
              领导层图景足以证明职能覆盖，但还不足以按上市公司标准承保治理。Euan Blair 仍是显而易见的重心：他是创始人、首席执行官、融资的主要发言人，也是与公司从学徒机会转向员工 AI
              采用这一战略迁移绑定最深的人。这带来真实的关键人依赖。与此同时，2024-2026 的记录显示公司在有意义地搭建梯队。Jillian Gillespie 从 MongoDB 加入，带来财务纪律；Martha
              Lane Fox 带来可信度更高的公开董事会信号；较新的产品和学习负责人也加深了 AI
              产品开发与课程设计的执行纵深。即便有这些进展，治理图景仍不完整。公开来源没有给出完整的当前董事会名单、所有权地图或投资人权利摘要，因此领导层梯队看起来强于治理披露。投资人可以合理判断公司正在专业化，但不能据此认定它已达到公开透明标准。
