      - number: '5.4'
        title: 信任、合规、质量与风险
        blocks:
          - type: paragraph
            body: >-
              Multiverse 的 UK 产品交付离不开合规机器。帮助中心来源把脱岗学习记录、Gateway 就绪度和 EPA 准备明确列为产品责任，保护保障指南则提供专门报告渠道和升级路径。历史质量证据很强：2021 年
              Ofsted 检查把 Multiverse 总体和学徒项目都评为优秀，并强调教练质量、资源、在线社区和保护保障。但承保信心不能停在这里，因为当前反向证据比历史检查结果嘈杂得多。FE Week 称 2023-24
              成就率提升到 59%，但 BritBrief 报道 52.6% 完成率，并将其与新的审视联系起来，还引用前员工对教练负载过重和优先级变化的描述。Trustpilot 不是决定性证据，但它增加了用户侧关于 AI
              生成视频和招聘体验的投诉。技术信任图景也只披露了一部分。General Catalyst 角色说明公司在认证、GDPR 和合规发布基础设施上有严肃内部工作，但留存公开来源仍没有暴露企业软件投资人通常想看的
              API、正常运行时间或第三方认证细节。因此，产品显然真实、嵌入运营且有质量控制，但公开信任表面仍落后于产品抱负。
