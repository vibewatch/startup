  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标快照
      - 倍数 / 估值信号
      - 相关性
      - 局限
    rows:
      - - Udemy
        - FY2025 收入 $789.8m；调整后 EBITDA $95.3m；UB ARR $540.0m
        - 2026 年 5 月市值约 $0.67b，约为 FY2025 收入的 ~0.8x
        - 覆盖企业技能提升，且企业学习存量基础庞大
        - 消费者和市场平台混合模式削弱可比性
      - - Coursera
        - FY2025 收入约 $757.5m；调整后 EBITDA 约 $63.5m
        - 2026 年 5 月市值约 $1.64b，约为 FY2025 收入的 ~2.2x
        - 全球学习平台，企业和证书业务都有一定权重
        - 消费者和学位业务混合，使其覆盖面比 Multiverse 更宽
      - - Docebo
        - 2025 Q4 收入 $63.0m；ARR $238.1m；调整后 EBITDA 利润率 21.2%
        - 2026 年 5 月市值约 $0.43b，约为 FY2026 指引中点的 ~1.6x
        - 最接近的上市纯企业学习 SaaS 可比公司
        - 利润率和 SaaS 经济性比 Multiverse 偏人力的模式更干净
      - - Guild Education
        - 2022 年估值 $4.4b；2024 年裁员；2025 年影响力发布仍显示 1.4m 合资格成员
        - 私募可比案例显示品类天花板和后续收缩风险
        - 美国最接近的雇主资助教育可比公司
        - 未找到当前公开收入倍数或老股交易价格
      - - Preply
        - 2026 年 1 月 Series D；EBITDA 转正，拥有 100,000+ 名导师
        - 2026 年 1 月估值 $1.2b
        - 说明规模化学习平台在 2026 年仍可跨过独角兽估值
        - 语言学习市场平台，不是学徒制技能提升
      - - upGrad
        - Temasek 按持平估值投资；来源称季度收入约 Rs600 crore
        - 2024 年 10 月估值 $2.25b
        - 显示职业学习赛道后期私募价格纪律
        - 以印度为中心的多垂直模式不同于 Multiverse
      - - Cornerstone OnDemand
        - 成熟劳动力学习软件先例
        - 2021 年以 $5.2b 企业价值私有化
        - 可作为规模化劳动力学习软件的退出参考
        - 历史私有化案例，不是实时交易可比公司
    notes: 这是一组部分可比对象，覆盖实时上市可比公司、私募学习平台轮次，以及一个劳动力学习退出先例。上市公司行使用市值 / 收入，而非 EV / 收入，因为这里没有重建现金和债务调整。
