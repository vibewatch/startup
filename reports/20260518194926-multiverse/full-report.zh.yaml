  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 对投资判断的影响
      - 当前公开代理指标
      - 具体尽调路径
    rows:
      - - 按地域和资金来源拆分的分部收入结构
        - 无法判断收入质量多大程度依赖英国学徒税体系，而非企业可自由支配预算
        - 仅有项目目录、美国页面、Oxford 合同和客户 logo
        - 要求按英国学徒税、学徒税转移、企业直付和美国收入拆分 FY2025 至 FY2026 管理账
      - - 按项目系列拆分的毛利率
        - 无法判断模型扩张更像软件，还是劳动密集型培训服务
        - 无公开毛利率披露
        - 要求提供队列 P&L、教练利用率和课程摊销表
      - - CAC、回本周期和销售周期
        - 无法评估销售效率或企业增长耐久性
        - 仅有雇主数量和客户 logo
        - 要求提供漏斗转化数据、ACV、续约队列和按分部拆分的回本周期
      - - 融资后现金、债务和契约
        - 仅凭 FY2025 数字和标题式融资金额，无法完整判断现金跑道
        - FY2025 现金加 2026 年 5 月融资公告
        - 要求提供交割资产负债表、债务明细、契约包和 24 个月现金预测
