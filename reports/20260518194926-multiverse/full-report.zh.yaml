      - number: '5.2'
        title: 交付系统与 Atlas 层
        blocks:
          - type: paragraph
            body: >-
              Multiverse 的主要技术差异化不只是课程广度，而是一个试图把教学、教练、应用型工作和 AI
              支持连接进学习者工作流的交付系统。项目页面和支持文档一致描述了异步模块、现场工作坊、教练触点、同伴或小组支持，以及与学习者本职工作相连的项目工作。帮助中心材料又把人力层拆成启动、队列、讲师和成功教练角色，说明运营模型有意把导入、技术教学、持续进展和评估准备拆开。Atlas
              位于这套人力系统之上，而不是取代它。Multiverse 把 Atlas 描述为嵌在学习平台里的常驻 AI 向导，采用苏格拉底式辅导风格，理解项目上下文，并可升级给真人教练。Atlas
              的公开演进值得注意：发布材料强调提示词工程和持续迭代；一年结果强调使用量和有用性增长；后续更新又把 Atlas
              重塑为理解意图的支持路由器，声称可解决大多数入站支持查询，并释放教练时间去做更高价值工作。实际结论是，Multiverse 似乎正在构建一套人加 AI 的交付栈；产品一部分是课程，一部分是支持编排。
