  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与学徒制资金流
        blocks:
          - type: paragraph
            body: >-
              Multiverse 不是消费者教育科技订阅业务；公开记录显示，它是一家企业培训提供商，收入主要通过学徒项目和相邻的员工技能提升队列变现。官方页面把公司定位为服务 UK 和 US 超过 1,500 家雇主的
              AI、数据和工程技能提升平台，US 页面则单独声称与超过 500 家公司合作过。这意味着收入质量更少取决于免费增值转化或中小企业（SMB）席位扩张，更多取决于雇主培训预算、学徒制资格和队列级续约。在
              UK，经济管道很关键：学徒制征费把工资单资金导入受监管资金池，Oxford City Council 的采购文件显示，Multiverse 可以用 Cisco
              等大型伙伴的征费转移来补充客户预算。因此，公开证据支持一种收入模式：建立在有资金支持的学徒制标准、转移征费余额和直接企业队列合同上，而不是透明软件标价上。项目页面公布时长和资质等级，但不公布实际价格、折扣或每名学习者平均收入。结果是，机制上可以理解这个模式，但收入结构和单位经济只露出一部分。
