              学院，一名参与者报告交付时间从数周缩短到数天。Palantir 和 Multiverse 还宣布针对 NHS Federated Data Platform 的学徒项目，首批队列计划于 February 2026
              启动，而该平台上已有大量 NHS 装机面。DIGIT 的 2026 报道又增加一层新客户标识，点名 Skanska、Visa 和 University of Manchester 等雇主正在招收 AI
