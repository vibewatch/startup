        - id: external-price
          label: 新外部定价
          note: $70m 轮融资以 $2.1b 估值完成，重新给出活跃的私有市场定价
          type: input
        - id: traction
          label: 企业端牵引
          note: 客户、伙伴和公共部门佐证显示市场真实存在
          type: process
        - id: audited-gap
          label: 审计经济性缺口
          note: 最近审计年度仍显示大额亏损、现金减少
          type: process
        - id: quality-risk
          label: 质量和交付风险
          note: 完课率审查可能传导到收入质量
          type: process
        - id: terms-gap
          label: 条款不透明
          note: 没有关于股价或优先股堆叠的公开证据
          type: process
        - id: output
          label: 继续研究 / 偏高
          note: 审计后的 2026 证据出来前，把本轮价格当作上限
          type: output
      edges:
        - from: external-price
          to: output
          label: 正面，但单独看不够
        - from: traction
          to: output
          label: 支撑可行性和客户需求
        - from: audited-gap
          to: output
          label: 压住上调出价的意愿
        - from: quality-risk
          to: output
          label: 增加下行折价
        - from: terms-gap
          to: output
          label: 让入场测算难以干净成立
    approximationNotes: 这条流程是分析框架，不是精确流程。它概括价格、牵引、经济性和缺失披露如何共同形成最终立场。
    claimRefs:
      - CV001
      - CV007
      - CV014
      - CV015
      - CV040
      - CV044
      - CV046
      - CV051
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 最重要的估值变化来自证据转化事件，不是电子表格里的小修小补。
    data:
      items:
        - label: 经审计的 2026 利润率佐证
          value: 0.5
          unit: USD bn upside
          detail: 会让私有市场溢价更容易守住
          tone: positive
        - label: 连续多个现金为正季度
          value: 0.3
          unit: USD bn upside
          detail: 支撑持久拐点，而不是单个强季度
          tone: positive
        - label: 持续质量 / 完课拖累
          value: -0.4
          unit: USD bn downside
          detail: 会挤压收入质量和企业信任
          tone: warning
        - label: 轮次条款显示强投资人保护
          value: -0.3
          unit: USD bn downside
          detail: 会削弱表面轮次对普通股持有人的价值
          tone: warning
        - label: 公开可比公司倍数持续压缩
          value: -0.5
          unit: USD bn downside
          detail: 会让私有市场溢价更难维持
          tone: warning
    approximationNotes: 敏感性条是方向性估计区间，不是模型输出。它们显示哪些证据事件最影响投资测算观点。
    claimRefs:
      - CV040
      - CV043
      - CV048
      - CV049
      - CV050
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 情景区间以已披露轮次为锚，再根据可比公司证据和佐证质量放宽或收紧。
    data:
      items:
        - label: 悲观情景（USD bn）
          low: 0.8
          mid: 1
          high: 1.2
          note: 增长褪色，质量风险仍可见，投资人锚定承压的可比公司
        - label: 基准情景（USD bn）
          low: 1.6
          mid: 1.9
          high: 2.2
          note: 当前轮次大体合理，但上行要等经审计的 2026 佐证
        - label: 乐观情景（USD bn）
          low: 2.3
          mid: 2.5
          high: 2.8
          note: 高增长和连续现金为正，把 2026 轮次变成垫脚石
    approximationNotes: 这些是投资测算区间，不是目标价。它们有意反映围绕轮次条款、毛利率和老股流动性的不确定性。
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV047
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: Multiverse 在品类相关性和客户佐证上得分较好，但经济性、估值支撑和证据质量明显弱得多。
    data:
      items:
        - label: 品类相关性
          value: 8/10
          detail: AI 技能提升仍是企业真实需求
          tone: positive
        - label: 客户佐证
          value: 8/10
          detail: L&G、Palantir/NHS 和 Oxford 支撑真实需求
          tone: positive
        - label: 规模佐证
          value: 7/10
          detail: 有真实企业客户基础和学徒收入，但仍是私有公司，披露有选择性
          tone: positive
        - label: 经济性
          value: 4/10
          detail: 最近审计年度仍显示大额亏损、现金减少
          tone: warning
        - label: 风险控制
          value: 4/10
          detail: 完课率和交付质量问题仍然可见
          tone: warning
        - label: 估值支撑
          value: 5/10
          detail: 新轮次有帮助，但公开可比公司估值低得多
          tone: warning
        - label: 证据质量
          value: 5/10
          detail: 当前乐观点的审计佐证仍低于投资人想要的水平
          tone: warning
    approximationNotes: 这些分数是 IC 式综合，不是工作流跑出的评分表。它们用于概括证据平衡，不能替代底层主张。
    claimRefs:
      - CV018
      - CV040
      - CV044
      - CV045
      - CV051
