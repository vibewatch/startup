      - number: '7.3'
        title: 依赖与模式风险
        blocks:
          - type: paragraph
            body: >-
              Multiverse 的 AI 增长叙事如今与合作伙伴和市场依赖深度绑在一起。公开案例显示，公司通过 Sky、ADEPT、Nottingham 城市合作和 Age UK 等渠道交付由征费转移支持的项目；
              既支撑增长故事，也暴露出模式仍受公共部门预算、捐赠征费流向和少数可见项目牵动。Palantir/NHS 学徒项目发布具备战略价值， 但也把部分 AI
              叙事集中在一个合作伙伴技术栈和一个高度公开的客户环境上。德国又加了一层依赖。Multiverse 称 StackFuel 带来 AZAV 认证、 企业客户和强劲完成数据，StackFuel
              现行课程列表也显示它确有运营资产；但这次扩张仍新增跨境整合、隐私和认证执行风险。最后，AI 宏观动态有利有弊： WEF、SignalFire 和 Anthropic 都暗示，AI
              一边推高再培训需求，一边压缩传统初级岗位招聘。它支持 Multiverse 转向在职员工， 但削弱了公司最初用作切入点的学徒漏斗。
