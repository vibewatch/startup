  - id: TV005
    title: 投资逻辑破裂和否决触发表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 经审计 2026 年增长低于叙事
        - 收入增长大幅回落，明显低于 2026 年融资叙事
        - 当前溢价失去主要私募市场依据
        - 重新切估值，靠近情景区间下沿
      - - 现金转正季度未能重复
        - 2026 年 Q1 后报告显示现金转正季度只是一次性
        - 该轮开始显得由叙事驱动，而非证据驱动
        - 暂停任何高于披露轮次出价的意愿
      - - 质量指标恶化
        - 完成结果或监管压力仍明显疲弱
        - 学徒税支撑的收入质量和企业信任双双恶化
        - 采用更严风险折价，并重审收入持久性
      - - 轮次条款显示重投资者保护
        - 优先股堆叠、反稀释或其他保护显著削弱普通股经济性
        - 名义估值高估干净进入价值
        - 除非价格调整或保护条款拉平，否则把建议重置为回避
    notes: 否决触发因素设计成可监控，而不是修辞。每一项都指向一个具体事件，一旦发生就需要重做估值判断。
    claimRefs:
      - CV011
      - CV043
      - CV045
      - CV046
      - CV048
      - CV049
      - CV050
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 尽调主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经审计 2026 年财务包
        - 2025 年 3 月后的月度收入、毛利、EBITDA、现金流和资产负债表
        - 用于检验新轮次反映的是持久经济性，还是只有叙事加速
        - 管理层数据室，加审计师或董事会材料
      - - 2026 年轮次条款
        - 股价、优先股堆叠、清算瀑布和期权池影响
        - 用于把名义估值转成真实进入价值和下行保护
        - 领投方条款清单和更新后的股权结构表
      - - 单位经济
        - 毛利率、CAC、回本周期、NRR，以及产品 / 地域贡献利润率
        - 决定 Multiverse 应按软件、服务还是混合模式交易
        - 财务和 GTM 运营审阅
      - - 老股流动性信号
        - 2024 年 5 月后的任何员工要约回购、经纪报价或老股交易
        - 帮助检验新股估值是否能在该轮之外成立
        - 公司、领投方或老股经纪沟通
      - - 质量和完成指标
        - 按项目和队列划分的近期完成、留存和雇主满意度数据
        - 用于判断收入质量能否支撑溢价估值倍数
        - 运营和监管尽调
    notes: 这些要求按它们对建议的影响大小排序，而不是按收集难度排序。
    claimRefs:
      - CV003
      - CV045
      - CV046
      - CV048
      - CV051
