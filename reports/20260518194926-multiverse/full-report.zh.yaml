      - number: '8.2'
        title: 可比公司显示，Multiverse 定价带有私募溢价
        blocks:
          - type: paragraph
            body: >-
              公开市场参照组仍有帮助，尽管上市公司中没有一个是完美的学徒制类比。Udemy 和 Coursera 规模更大、平台更宽，企业收入之外还带有消费者敞口； Docebo 更接近纯 SaaS，披露的利润率也远好于
              Multiverse。即便如此，交易图景很重要：截至 2026 年 5 月，这些公开公司市值 / 收入大约在 0.8x 到 2.2x，远低于 Multiverse
              最新私募轮隐含的收入倍数。私募可比公司没那么严苛，但也不能轻松看待。Guild 在 2022 年 $4.4 billion 的峰值显示，品类可以拿到很高的估值；但其 2024
              年裁员和后来转向企业学习，也说明这些估值承压可以很快发生。 Preply 2026 年 1 月 $1.2 billion 轮融资和 upGrad 2024 年持平的 $2.25 billion
              估值说明，规模化学习业务仍能拿到资本， 但定价纪律如今更紧地绑在运营证据上。单看可比公司，Multiverse 相比公开可比公司显得昂贵，相比私募可比公司也只有选择性支撑。
