              公开记录足以看清业务形状，但不足以完整承保。正面很清楚：Multiverse 已跨过有意义的收入规模，能落地六位数中段的公共部门队列，声称企业 ROI 很强，并在 May 2026
              按更高估值募到新资本。负面也很清楚：亏损相对收入仍大，最近一轮融资前现金显著烧掉，裁员显示公司主动压缩成本，完成率审视又引入了与学徒制经济性绑定、而非泛化软件留存的质量型收入风险。最大阻碍是透明度。Multiverse
