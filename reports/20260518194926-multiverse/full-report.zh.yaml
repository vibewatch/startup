        - 按雇主细分索取当前费率表、平均合同价值、最低队列规模和续约队列。
      - - 学徒税资助的学徒制与雇主付费 AI 落地工作的收入拆分
        - 公司定位覆盖两者，但公开收入披露没有拆分资金来源或产品家族。
        - 该拆分决定业务对英国政策变化和企业自主预算的敞口各有多大。
        - 索取 FY2026 按地区、产品线和资金机制拆分的收入。
      - - 独立结果证据
        - 公开 ROI 和雇主数量主张来自公司自身，而不是留存资料中的独立审计。
        - 续约质量和护城河取决于可衡量的业务结果，而不只是公司主张。
        - 索取第三方影响研究、完成率、工资影响、晋升和生产率指标。
