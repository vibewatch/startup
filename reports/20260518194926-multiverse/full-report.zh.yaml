      - number: '5.3'
        title: 工具、集成与企业依赖
        blocks:
          - type: paragraph
            body: >-
              留存来源中最强的产品技术信号是，Multiverse 交付依赖客户工具访问和内部平台能力，而不只是内容创作。AI Powered Productivity 要求 Microsoft 365 或 Google
              Workspace，加上授权的 Copilot 或 Gemini。Data Fellowship 增加了 Power BI、Tableau、Sphere Engine、Lucidchart 等 BI
              和图表依赖；Advanced Data Fellowship Top-Up 则更深入工程工作站模式，需要 Jupyter、GitHub、Git、IDE 访问、CLI 使用、PostgreSQL 和
              pgAdmin。Multiverse 自身支持内容称，Sphere Engine 因托管云编辑器和动态应用而需要加入白名单；其电脑指南也明确，OS 选择和雇主管理设备会影响项目兼容性。与此同时，AI
              Product Engineering 和 DevOps 课程公开提到 API、RAG、编排框架、Docker、Kubernetes、CI/CD 和云部署；一则公开平台工程招聘又加上第二层：内部负责
              SSO、通知交付、安全发布、偏好管理和代码级 GDPR 义务。换句话说，Multiverse 看起来像一个培训平台，其真实运营表面横跨雇主 IT
              访问、第三方生产力工具、云沙箱，以及产品团队依赖的内部可信企业平台。
