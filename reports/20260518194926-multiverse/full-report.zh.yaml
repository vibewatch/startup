            body: >
              最新公告显示，AI 时代的 Multiverse 仍在新增或加深大型具名账户，而不是只回收旧学徒制引用。KPMG 的首个 AI 技能提升队列包括 134 人，覆盖早期职业员工到合伙人。Legal &
              General 交叉证实，January 2025 有一个 50 名同事、征费资助、为期 13 个月的 AI for Business Value 项目。The AA 公开确认 February 2026
