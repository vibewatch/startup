  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 按细分、地域与付款方划分的客户基础
        blocks:
          - type: paragraph
            body: >
              Multiverse 的公开客户基础足够宽，能证明真实的企业与公共部门采用，但透明度还不足以完整承保集中度或耐久性。公司当前营销声称拥有超过 1,500 家雇主或客户、超过 22,000
              名学习者；学习者结果页面又增加了广度标记，例如超过四分之一 FTSE 100、半数 Russell Group 大学、超过 100 家 NHS 信托、超过 50
              个地方议会。案例研究层面进一步填补了买方地图：John Lewis 和 Just Eat 等零售与消费品牌；Nationwide、Citi、Legal & General、KPMG 等金融服务机构；Jaguar
              Land Rover、QS、The Crown Estate 等工业和基础设施集团；以及 NHS 和地方政府相关组织。这是有意义的细分证明，因为具名账户横跨不同用户、付款方和运营场景。不过，证据仍偏向
              UK。Citi 给出最清晰的公开 US 相关客户证明，但当前大多数具名引用、征费资助项目和公开案例研究仍绑定 UK 企业和公共部门买方。因此，客户标识组合支持按行业分散的真实多元化，但也显示客户质量仍由大型 UK
              账户驱动，并带有重采购和学徒制预算敞口。
