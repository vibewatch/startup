      - number: '7.2'
        title: 质量、学习者与声誉风险
        blocks:
          - type: paragraph
            body: >-
              这组运营风险不在工厂或云可用性，而在教育质量、学习者匹配，以及一旦滑坡后随之而来的声誉拖累。BritBrief 的报道给出了核心反向指控：
              内部最大化招生的压力可能削弱了学徒适配性控制，尤其在岗位角色与课程内容无法干净匹配时。Multiverse 自身的投诉政策写得清楚，也对齐外部良好实践框架， 但流程不等于投诉量保持低位的证据。存档的
              Trustpilot 页面显示情绪混合，并非一致好评，这符合一个规模化提供商在不同项目中学习者体验不均衡的特征。 如果完成率持续疲弱，或新的 Ofsted 检查低于 2021
              年基准，下行不只是声誉问题；它还可能降低雇主赞助批次的意愿，增加公共部门销售难度， 并迫使公司在支持、辅导和质量修复上投入更多。
