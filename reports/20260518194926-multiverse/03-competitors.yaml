  - id: TP004
    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Threat / alternative
      - Severity
      - Evidence / rationale
      - Diligence ask
    rows:
      - - Levy-native employer delivery
        - QA and Makers also sell levy-native AI and tech programmes
        - High
        - The same funding rails are available to direct peers, and QA is already marketing 2026 modular levy flexibility
        - Quantify win rates versus QA and Makers in live RFPs by employer size and function
      - - Embedded workplace application and coaching
        - Shorter GA and Correlation One programmes can look lower-friction to buyers
        - High
        - Multiverse delivery requires protected time and manager sponsorship, which adds value after launch but slows pre-sale motion
        - Measure time-to-launch, manager burden, and implementation failure rates versus short-form alternatives
      - - Recent scale and funding momentum
        - $2.1B valuation requires fast proof that European expansion and acquisition integration translate into durable ROI
        - High
        - The 2026 raise improves resources, but it also raises the performance bar for European execution
        - Track post-StackFuel integration, European customer additions, and retention by cohort type
      - - Pricing opacity
        - GA and Coursera publish clear benchmark prices while Multiverse does not
        - Medium
        - Buyers can compare substitutes instantly but must enter a consultative process to benchmark Multiverse
        - Request standard realised price per learner, cohort minimums, and average discounts by programme family
      - - Apprenticeship-funding moat
        - Growth and Skills Levy broadening can pull spend into shorter modular options
        - High
        - QA is already positioning the 2026 levy change as a way to fund modular skills, not only full apprenticeships
        - Estimate what share of Multiverse bookings would still fit if buyers shift budget to modular non-apprenticeship spend
      - - Global-enterprise adjacency
        - Guild and Correlation One can win employer upskilling budgets without UK apprenticeship admin
        - Medium
        - Those vendors sell marketplaces, academies, or workforce programmes that attack the same problem from outside the levy system
        - Identify which buyer segments need UK credentialing versus those that mostly value faster global rollout
    notes: >-
      Severity reflects competitive pressure on Multiverse's current wedge, not absolute market attractiveness. Several
      risks are strategic rather than existential, but they directly affect sales friction, procurement comparability,
      and moat durability.
