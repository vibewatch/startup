  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Alternative
      - Public price signal
      - Delivery format
      - Typical duration
      - Funding route
      - Implication
    rows:
      - - Multiverse
        - No standard enterprise price published on reviewed employer pages
        - Structured employer programmes and apprenticeships
        - 13 months to 3+ years depending on programme
        - Apprenticeship levy or employer budget
        - Requires consultative sale and funding-model fit before clean price benchmarking
      - - QA
        - No standard employer price published; levy and commercial offers both marketed
        - Apprenticeships plus instructor-led courses and subscription library
        - Multi-month apprenticeships or shorter course-based training
        - Growth and Skills Levy or employer budget
        - Broadens buyer options and can reduce switching cost away from apprenticeship-only formats
      - - Makers
        - No standard employer price published
        - Apprenticeships plus commercial fast tracks and executive offsites
        - 4-6 months for fast tracks to 13 months+ for apprenticeships
        - Levy or commercial budget
        - Faster launch options increase pressure on Multiverse's longer cycle
      - - Guild
        - No public list price found on reviewed pages
        - Marketplace plus academies and coaching
        - Ongoing employer benefit / academy contracts
        - Employer-paid education-benefit budgets
        - Competes for CHRO and talent-development budget rather than levy alone
      - - General Assembly
        - Public IT Bootcamp list price of $7,600; enterprise team-training pricing custom
        - Short bootcamps, workshops, and pathway courses
        - 12 weeks part time for reviewed IT Bootcamp; workshops shorter
        - Consumer spend or enterprise L&D budget
        - Gives buyers a fast, visible benchmark for short-form upskilling
      - - Correlation One
        - Enterprise pricing custom; Amazon Career Choice programmes fully funded for eligible associates
        - Custom cohorts, workforce programmes, and apprenticeships
        - 3 weeks to 4 months for enterprise training; 12-16 weeks for Amazon programmes
        - Employer, public-sector, or partner-funded budgets
        - Fast and flexible packaging without UK apprenticeship admin requirements
      - - Coursera Teams
        - $399 per user per year for up to 499 users; enterprise custom for 500+ users
        - SaaS learning subscription with certificates and labs
        - Annual subscription / always-on usage
        - Operating budget
        - Cheapest public benchmark among reviewed enterprise alternatives
      - - LinkedIn Learning
        - Quote-based / undisclosed on reviewed page
        - Continuous subscription learning and skills-intelligence platform
        - Ongoing subscription
        - Operating budget
        - Easier to trial than apprenticeships but lower-touch and less job-embedded
    notes: >-
      Public price signal means a clear list price or explicit statement of non-public pricing on the reviewed
      page set. Where pages were consultative or form-led, pricing is recorded as undisclosed rather than estimated.
    claimRefs:
