    - type: access-blocked
      severity: material
      topic: provider-outcomes
      missingEvidence: Current like-for-like official provider-detail pages or recent public achievement-rate data for Multiverse and each direct apprenticeship peer.
      whyItMatters: QA and Makers have usable public inspection evidence, but the broader direct-outcome comparison is incomplete without current provider-detail access for every comparable supplier.
      diligencePath: Pull current apprenticeship-service provider-detail pages and achievement-rate exports directly from the UK apprenticeship service or through maintained screenshots.
