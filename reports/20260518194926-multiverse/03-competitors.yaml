    - type: private-evidence-only
      severity: material
      topic: pricing-transparency
      missingEvidence: Standard enterprise contract prices, cohort minimums, and discount structures for Multiverse, QA, Makers, Guild, and Correlation One.
      whyItMatters: Public substitutes provide visible price anchors, but the main employer-platform peers do not, limiting apples-to-apples procurement analysis.
