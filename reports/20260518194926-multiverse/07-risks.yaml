  evidenceGaps:
  - type: missing-source
    severity: material
    topic: legal-enforcement-register
    missingEvidence: A disclosed list of active or settled litigation, regulatory enquiries, data-breach notices, and material employment disputes.
    whyItMatters: Public retained sources surfaced policy and quality issues but not a complete legal overhang register, so hidden disputes could still change downside and insurance assumptions.
    diligencePath: Request management legal pack, outside counsel summary, cyber incident log, and any regulator correspondence since 2024.
    relatedQuestionRefs:
    - QR026
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Revenue share, renewal rates, gross margin, and bookings concentration by top customers, sectors, geographies, and public-sector cohorts.
    whyItMatters: Case studies prove traction but do not show how much revenue sits behind a few large accounts or partner-led programmes, which is central to downside sizing.
    diligencePath: Request cohort-level revenue concentration matrix, top-20 account summary, and renewal waterfall by programme family.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR003
  - type: access-blocked
    severity: material
    topic: quality-feedback-dashboard
    missingEvidence: A live export of provider complaint volumes, employer-review scores, withdrawal reasons, and programme-level outcome trends from primary systems.
    whyItMatters: Secondary reporting suggests material quality friction, but the magnitude cannot be sized cleanly without primary dashboard data or an accessible provider-review feed.
    diligencePath: Use a browser-authenticated session or management export to capture current provider dashboard, employer reviews, complaint counts, and withdrawal reasons.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR001
    - TR002
  - type: private-evidence-only
    severity: material
    topic: post-raise-liquidity
    missingEvidence: Current cash, debt, covenants, working-capital timing, and monthly burn after the May 2026 financing.
    whyItMatters: The 2026 round is the main buffer against FY2025 losses, so runway cannot be underwritten confidently without post-close balance-sheet data.
    diligencePath: Request post-raise cash bridge, debt schedule, covenant package, and board reporting for the first two quarters after the financing.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR004
    - TR005
