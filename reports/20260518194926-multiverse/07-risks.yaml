- id: capital-people-and-kill-criteria
  title: Capital, people, and kill criteria
  body: 'The capital and people picture remains too fragile for a complacent read. FY2025 results as reported by City AM, FE Week, BusinessCloud, and IndexBox showed losses still widening or staying large, cash falling materially before the 2026 raise, and headcount declining as redundancy payments continued. Management''s May 2026 funding announcement is directionally positive: it gives the company fresh primary capital, a higher valuation mark, and a claimed first cash-positive quarter, but it does not close the diligence case because post-raise cash, debt, covenant, and customer-concentration data remain undisclosed. The leadership bench is clearly stronger than it was, with a newly highlighted CFO and board-level tech figure during the AI push. Even so, investors are still underwriting a founder-led pivot across regulation, partner concentration, and cross-border expansion while hoping that AI adoption revenues outgrow the service-heavy cost base. The most useful kill criteria are therefore
    concrete rather than narrative: worse outcomes, a weak inspection, loss of levy fit, renewed layoffs, or evidence that the 2026 round merely bought time instead of changing unit economics.'
