company:
  name: Multiverse
chapter:
  number: 7
  title: Risks
  summary: 'Multiverse''s risk stack is concentrated in three places at once: dependence on UK apprenticeship policy, fresh quality/outcomes scrutiny, and a still-unproven AI-adoption pivot that must justify a higher 2026 valuation after large FY2025 losses and layoffs. Public case studies show real partner and public-sector demand, but they also expose levy-transfer, Palantir/NHS, and StackFuel integration dependencies. The underwriting question is whether management can convert the May 2026 raise into better outcomes, cleaner cash discipline, and stronger regulatory resilience before another inspection, policy change, or partner disruption damages growth.'
sections:
- id: policy-and-regulatory-exposure
  title: Policy and regulatory exposure
  body: 'Multiverse''s biggest structural risk is that a large share of its product-market fit still runs through apprenticeship policy, not a fully untethered software budget. Government funding rules, the new Growth and Skills Levy, and sector commentary all point toward a regime that is becoming more flexible for modular learning but also more explicitly focused on younger learners and earlier-stage routes. That is not automatically fatal for Multiverse, but it does create policy-fit risk because many of the company''s visible customers use levy-funded AI and data programmes for incumbent workforces. The historical quality badge is still strong: Ofsted rated the provider outstanding in 2021. But adverse 2026 coverage tied recent official data to a 52.6% completion rate versus a 65.4% sector average and said fresh regulatory scrutiny was building. Add in formal complaints, privacy, and service-availability terms across multiple jurisdictions, and the result is a regulatory exposure stack
    that can hit revenue, sales efficiency, and valuation at the same time.'
