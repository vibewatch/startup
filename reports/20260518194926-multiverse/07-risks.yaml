- id: dependency-and-model-risk
  title: Dependency and model risk
  body: 'Multiverse''s AI-growth narrative is now deeply intertwined with partner and market dependencies. Public examples show levy-transfer-backed delivery through Sky, ADEPT, Nottingham city partnerships, and Age UK, which supports the growth story but also shows how exposed the model remains to public-sector budgets, donor levy flows, and a few visible programmes. The Palantir/NHS apprenticeship launch is strategically valuable, yet it concentrates part of the AI story on one partner stack and one very public customer environment. Germany adds another dependency layer. Multiverse says StackFuel brings AZAV accreditation, enterprise accounts, and strong completion data, while StackFuel''s live course listings show a real operating asset; still, the expansion adds cross-border integration, privacy, and accreditation execution risk. Finally, macro AI dynamics cut both ways: WEF, SignalFire, and Anthropic all suggest AI is compressing traditional entry-level hiring even as reskilling demand
    rises. That supports Multiverse''s incumbent-worker pivot but weakens the apprenticeship funnel the company originally used as a wedge.'
