    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, model, and current operating footprint
        blocks:
          - type: paragraph
            body: >-
              Multiverse’s company-overview record is now much clearer than its older WhiteHat apprenticeship identity,
              but the strongest description of the business still comes from the company itself. The official website
              and mission pages repeatedly frame Multiverse as an upskilling platform for AI and tech adoption, not just
              a recruiter of school leavers into entry-level apprenticeships. That matters because the operating model
              has broadened into diagnostics, personalised learning pathways, AI-assisted coaching, and employer-funded
              programmes that sit inside broader workforce-transformation agendas. The public footprint also supports
              real scale: the company says it works with more than 1,500 employers and has supported more than 22,000
              learners, while customer and partner releases show active work across the UK and US plus a now-explicit
              push into continental Europe through Germany. The durable takeaway is that Multiverse has become a
              workforce-enablement layer for enterprise AI, data, and digital adoption, even if the cleanest
              articulation of that position remains management-authored rather than independently audited.
