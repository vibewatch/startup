  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Policy and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              Multiverse's biggest structural risk is that a large share of its product-market fit still runs through
              apprenticeship policy, not a fully untethered software budget. Government funding rules, the new Growth
              and Skills Levy, and sector commentary all point toward a regime that is becoming more flexible for
              modular learning but also more explicitly focused on younger learners and earlier-stage routes. That is
              not automatically fatal for Multiverse, but it does create policy-fit risk because many of the company's
              visible customers use levy-funded AI and data programmes for incumbent workforces. The historical quality
              badge is still strong: Ofsted rated the provider outstanding in 2021. But adverse 2026 coverage tied
              recent official data to a 52.6% completion rate versus a 65.4% sector average and said fresh regulatory
              scrutiny was building. Add in formal complaints, privacy, and service-availability terms across multiple
              jurisdictions, and the result is a regulatory exposure stack that can hit revenue, sales efficiency, and
              valuation at the same time.
