      - number: '2.2'
        title: UK market sizing is real, but the relevant shell is narrower than future-of-work rhetoric
        blocks:
          - type: paragraph
            body: >-
              England’s official apprenticeship data support a meaningful near-term market but also force discipline on
              any TAM claim. The strongest current shell is 353,500 apprenticeship starts in 2024/25, with 761,500
              participants overall and 243,340 levy-funded starts. Multiverse’s relevance is strongest in the parts of
              that market that are still growing: higher-level programmes, digital technology standards, and training
              for existing employees. The same official series shows why the market is not simply large and rising:
              starts and participation remain below pre-2017 levels, intermediate apprenticeships keep shrinking, and
              recent growth has been pulled upward by level 7 behaviour ahead of funding changes.


              Two adjacent sizing lenses broaden the opportunity without letting the analysis drift into fantasy. First,
              adult FE and skills participation outside apprenticeships still totals more than 1.17 million learners,
              even though that pool fell in 2024/25. Second, DSIT’s AI-skills work points to a much larger structural
              demand shell, with direct AI jobs projected to reach 3.9 million by 2035 and 9.7 million people in broader
              AI-related occupations. Those projections justify a large long-run need for workforce reskilling, but they
              are labour-demand forecasts rather than present-day spend figures. For US expansion context,
              Apprenticeship.gov’s 800,000+ annual apprentices show a sizable employer-led training market, but that
              shell spans all occupations and does not imply an immediate Multiverse-sized SAM.
