  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The 2026 mark resets the story, but not the diligence burden
        blocks:
          - type: paragraph
            body: >-
              The strongest single fact in this chapter is that Multiverse did not merely defend an old paper mark; it
              raised fresh primary capital in May 2026 at a disclosed $2.1 billion valuation. That is important because
              it confirms continued unicorn status and shows the company can still access high-quality investors after a
              difficult 2023-2025 period. The same evidence, however, also shows why underwriting cannot stop at the
              headline. The latest audited year still points to only about £79.6 million of revenue, a £63.3 million
              pre-tax loss, falling cash, restructuring, and a strategic pivot away from earlier growth bets.
              Management’s best bullish datapoints — 50% growth and a first cash-positive quarter — are current and
              directionally encouraging, but they are not yet audited. In other words, the round proves price and
              access, not full proof of durable economics. The valuation chapter therefore has to treat the 2026 raise
              as a real external price signal while still discounting for evidence quality, delivery risk, and the
              absence of public round-term disclosure.
            claimRefs:
