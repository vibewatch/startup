              from early-career hires through partners. Legal & General cross-corroborated a 50-colleague, levy-funded,
              13-month AI for Business Value programme in January 2025. The AA publicly confirmed a February 2026
              strategic partnership and said Customer Operations teams were already using AI-driven insights to improve
              resource planning and operational efficiency. Orange Business said a successful pilot had already expanded
              into broader data and AI academies for 50 UK-based team members, with one participant reporting delivery
              times cut from weeks to days. Palantir and Multiverse also announced NHS Federated Data Platform-specific
              apprenticeships, with first cohorts scheduled for February 2026 and a large installed NHS surface already
              on the platform. DIGIT's 2026 coverage adds another fresh-logo layer by naming Skanska, Visa, and the
              University of Manchester among employers taking AI apprentices. These partner-led references matter
              because they show Multiverse is still winning AI budgets inside well-known organisations; they also matter
              because most of them remain launch-stage or first-cohort evidence rather than fully disclosed renewal
              economics.
