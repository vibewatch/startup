        title: Customer base by segment, geography, and payer
        blocks:
          - type: paragraph
            body: >
              Multiverse's public customer base is broad enough to establish real enterprise and public-sector adoption,
              but not transparent enough to fully underwrite concentration or durability. The company's current
              marketing claims more than 1,500 employers or customers and more than 22,000 learners, while its
              learner-outcomes page adds breadth markers such as over a quarter of the FTSE 100, half of Russell Group
              universities, more than 100 NHS trusts, and more than 50 local councils. The case-study surface then fills
              in the buyer map: retail and consumer brands such as John Lewis and Just Eat; financial-services
              institutions including Nationwide, Citi, Legal & General, and KPMG; industrial and infrastructure groups
              such as Jaguar Land Rover, QS, and The Crown Estate; and NHS and local-government aligned organisations.
              That is meaningful segmentation proof because the named accounts span different users, payers, and
              operating contexts. Still, the evidence remains skewed toward the UK. Citi gives the clearest public
              U.S.-linked customer proof, but the bulk of current named references, levy-funded programmes, and public
              case studies remain tied to UK enterprise and public-sector buyers. The logo mix therefore supports real
              diversification by sector, but also suggests that customer quality is still driven by large UK accounts
