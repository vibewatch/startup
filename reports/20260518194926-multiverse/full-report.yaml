      - number: '4.4'
        title: Underwriting gaps and financial verdict
        blocks:
          - type: paragraph
            body: >-
              The public record is good enough to see the shape of the business but not good enough to fully underwrite
              it. Positives are clear: Multiverse has crossed meaningful revenue scale, can land mid-six-figure
              public-sector cohorts, claims strong enterprise ROI, and was able to raise new capital at a higher
              valuation in May 2026. Negatives are also clear: loss levels remain large relative to revenue, cash burned
              down materially before the latest raise, layoffs show active cost compression, and completion-rate
              scrutiny introduces a quality-linked revenue risk that is specific to apprenticeship economics rather than
              generic software retention. The biggest blocker is opacity. Multiverse does not disclose segment mix
              between levy-funded UK work, direct enterprise contracts, and US activity; it does not disclose gross
              margin, CAC, payback, or debt balances; and it does not publish a programme price list that can be
              reconciled to realised revenue. The financial verdict is therefore cautiously constructive rather than
              high-conviction: the company appears financeable and still growing, but public evidence supports a
              diligence-heavy research-more stance rather than an underwritten growth-equity yes.
