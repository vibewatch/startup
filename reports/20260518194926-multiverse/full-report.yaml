              needs allowlisting because it hosts cloud-based editors and dynamic applications, and its computer
              guidance makes clear that OS choice and employer-managed devices affect programme compatibility.
              Meanwhile, AI Product Engineering and DevOps curricula publicly reference APIs, RAG, orchestration
              frameworks, Docker, Kubernetes, CI/CD, and cloud deployment, and a public platform-engineering job posting
              adds a second layer: internal ownership of SSO, notification delivery, safe releases, preference
              management, and code-level GDPR obligations. Put differently, Multiverse looks like a training platform
              whose real operating surface spans employer IT access, third-party productivity tools, cloud sandboxes,
