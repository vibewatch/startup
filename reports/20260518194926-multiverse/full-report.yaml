      - number: '7.2'
        title: Quality, learner, and reputation risk
        blocks:
          - type: paragraph
            body: >-
              The operational risk picture is less about factories or cloud uptime than about educational quality,
              learner fit, and the reputational drag that follows if those slip. BritBrief's reporting makes the central
              adverse allegation: internal pressure to maximise enrolments may have weakened apprenticeship suitability
              controls, especially where job roles and course content did not match cleanly. Multiverse's own complaints
              policy is well articulated and aligned to external good-practice frameworks, but a process is not the same
              thing as proof that complaints stay low. The archived Trustpilot page showed mixed rather than uniformly
              glowing sentiment, which is consistent with a scaled provider whose learner experience is uneven across
              programmes. If completion rates stay weak or a new Ofsted inspection lands below the 2021 benchmark, the
              downside is not only reputational; it can also reduce employer willingness to sponsor cohorts, complicate
              public-sector selling, and force heavier spend on support, coaching, and quality remediation.
