      - number: '2.4'
        title: Growth drivers are strong, but policy mechanics and US proof points remain the gating constraints
        blocks:
          - type: paragraph
            body: >-
              The demand case for Multiverse is strong enough to justify continued diligence. AI-related jobs and skills
              are set to expand materially, employers report rapid skill change, and specialised digital capabilities
              command pay and hiring premia. Multiverse’s public traction and FE Week’s provider-ranking coverage both
              show that the company is already a scaled player in UK apprenticeships rather than a speculative pilot
              vendor. These factors support the view that the company sits in a real market with measurable demand
              rather than in a purely narrative category.


              The contra case is equally important. The NAO shows the levy system has not straightforwardly solved
              training underinvestment, employers still underuse funds, and the budget can become strained. Multiverse
              itself argues that standard updates are too slow and that programme-duration rules hinder employer
              adoption, which is a particular problem in AI where curricula age quickly. FE Week adds two more caution
              flags: higher-cost level 6 and 7 programmes remain politically sensitive, and the company’s earlier
              America push failed. Combined with the absence of public 2026 US customer or revenue disclosure, that
              means US expansion should be treated as option value, not as a proven second engine. Near-term economics
              are still more tightly tied to UK funding rules, employer cost discipline, and the company’s ability to
              convert company-claimed ROI into independently credible renewal evidence.
