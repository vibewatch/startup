      - number: '3.2'
        title: Competitor profiles and distribution power
        blocks:
          - type: paragraph
            body: |
              Multiverse's own current scale signal is meaningful: the company said in 2025 that it works with more
              than 1,500 employers and 22,000 learners, and in May 2026 it announced a $70 million primary raise at
              a $2.1 billion valuation with 50% year-over-year revenue growth and a cash-positive quarter. That gives
              it more recent momentum than smaller UK peers, but it does not make the field empty. QA is the most
              direct scaled incumbent because it already serves thousands of apprentices across 23 standards and sells
              AI, data, cloud, cyber, and software programmes to large employers nationwide. Makers is smaller, but
              it combines a respected bootcamp brand, good regulatory outcomes, and commercial fast-track offers that
              can appeal to buyers who want less administrative drag than a multi-year apprenticeship.

              The adjacent competitors matter because they pull budget from a different angle. Guild has evolved from
              tuition reimbursement into a much broader employer talent-development platform. General Assembly is
              redesigning its offer around shorter pathways and enterprise AI training. Correlation One is selling
              custom AI enablement and workforce programs with Amazon-scale proof points. Those alternatives do not
              need to win on levy fluency if they can win on speed, executive sponsorship, or global reach.
