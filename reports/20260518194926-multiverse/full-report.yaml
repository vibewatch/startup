      - number: '6.5'
        title: Concentration, churn risk, and adverse evidence
        blocks:
          - type: paragraph
            body: >
              The adverse evidence does not prove customer churn at scale, but it does show why the logo list should not
              be mistaken for a de-risked customer base. FE Week tied Multiverse's failed U.S. expansion and AI pivot to
              rising losses, then separately reported FY2025 losses widening to £63.3 million while cash nearly halved.
              Workshift added the clearest customer-budget warning: Multiverse temporarily withdrew from U.S. registered
              apprenticeships, and apprenticeship investor Ryan Craig argued that when budgets tighten, the CFO cuts
              these programmes. That does not negate the remaining U.S. opportunity represented by Citi, but it does
              show that U.S. customer durability is weaker than the UK case-study density might imply. On the quality
              side, BritBrief reported a 52.6% completion rate versus a 65.4% sector average, plus intervention risk if
              outcomes worsen. Euan Blair's response that 70% of AI-course withdrawals still generated employer value is
              directionally useful, but it is not the same thing as proving account renewal or low churn. The core
              underwriting gap remains unchanged: public materials do not disclose top-customer revenue share, GRR,
              renewal dates, ACV, or segment mix, so concentration risk has to be inferred from logo composition and
              geography rather than directly measured.
            claimRefs:
