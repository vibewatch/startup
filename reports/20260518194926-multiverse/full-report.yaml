      - number: '4.2'
        title: Public traction, cost base, and operating efficiency
        blocks:
          - type: paragraph
            body: >-
              The clearest financial trend is strong top-line growth combined with persistent operating losses. FE Week
              reported £58.9 million of apprenticeship-training revenue for April 2023 to March 2024, up from £44.1
              million, while the FY2025 group accounts were widely reported as showing £79.6 million of revenue and a
              £63.3 million pre-tax loss. Cash ended FY2025 at £81.8 million, down from £135.4 million, implying roughly
              £53.6 million of cash consumption before the 2026 financing. EBITDA reportedly improved modestly from
              -£61.3 million to -£59.7 million, which is directionally positive but still far from breakeven. Labour
              remains the most visible cost driver: headcount fell from 822 to 813, yet staff costs still rose, revenue
              per employee reportedly increased 37%, and nearly £980,000 was paid to 55 employees for loss of office.
              London remains the organisational anchor, with a hybrid policy centred on the London office, and external
              salary data show a wide wage band that is consistent with a coach-heavy delivery model plus senior
              enterprise and technical leadership roles. Taken together, public traction is real, but the cost base
              still behaves more like a scaled training-services business than a capital-light software company.
