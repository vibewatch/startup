      - number: '3.3'
        title: Delivery model, pricing, and buying friction
        blocks:
          - type: paragraph
            body: |
              Capability and packaging differences are central to the buying decision. Multiverse is strongest when a
              buyer wants structured, on-the-job delivery, manager-supported application, and apprenticeship-aligned
              learning paths that connect directly to workforce planning. The John Lewis deployment page underscores
              that this is not lightweight content consumption: learners need protected time, managerial sponsorship,
              and, in some cases, tool prerequisites such as a paid Gemini license. That embedded model can create
              switching cost once deployed, but it also makes the initial sale slower than a workshop or a content
              subscription.

              Pricing and contract transparency favor substitutes rather than Multiverse. The reviewed Multiverse,
              QA, Makers, Guild, and Correlation One employer pages do not publish standard contract rates. By
              contrast, General Assembly publicly lists a $7,600 IT Bootcamp, and Coursera publishes a $399 per
              user per year team plan for up to 499 users. That matters in procurement: a buyer can benchmark quick,
              low-friction options immediately, while Multiverse often requires a consultative sale and funding-model
              fit assessment before price can even be compared.
