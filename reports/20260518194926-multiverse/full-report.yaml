  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Multiverse should be analysed as an employer-funded workforce upskilling business that sits at the
              junction of apprenticeship delivery and broader AI-adoption services, not as a generic consumer edtech
              company. The company’s own 2026 positioning starts with business goals, workforce skill diagnostics,
              on-the-job learning, and measurable ROI. That makes the closest public market shell the UK
              employer-sponsored training system, especially higher-level digital and AI-relevant apprenticeships funded
              through the levy, rather than the whole online learning universe.


              The adjacent shell is broader than apprenticeships alone. Multiverse also markets AI-Powered Productivity
              and similar programmes that look like enterprise capability building around AI-tool adoption, which can
              draw budgets from L&D, transformation, and business units. Adult FE and skills provision is relevant as a
              talent supply and substitute layer, but it is not the same revenue pool. Likewise, the US registered
              apprenticeship market is a plausible expansion shell, yet its funding and setup mechanics differ sharply
              from England’s payroll-tax-funded levy model. The practical substitute set is therefore fragmented:
              internal L&D, consultancies, universities, public-skills provision, and the official apprenticeship
              marketplace all compete with the same employer problem statement in different ways.
