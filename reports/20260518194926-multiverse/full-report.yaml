              cash-positive quarter reduce immediate solvency pressure, yet they do not remove the need for diligence
              because the public record does not show post-raise cash, debt, or covenant terms. Adverse signals also
              remain meaningful. Multiverse has already restructured away from parts of its early-talent and US
              expansion strategy, public-sector risk registers explicitly discuss delivery-volume and quality risk, and
              BritBrief reported completion rates below the sector average together with expected Ofsted attention.
