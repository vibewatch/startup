  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and apprenticeship funding flows
        blocks:
          - type: paragraph
            body: >-
              Multiverse is not a consumer edtech subscription business; the public record shows an enterprise training
              provider whose revenue is largely monetised through apprenticeship programmes and related
              workforce-upskilling cohorts. Official pages position the company as an AI, data, and engineering
              upskilling platform serving more than 1,500 employers across the UK and US, while the US page separately
              claims experience with more than 500 companies. That means revenue quality depends less on freemium
              conversion or SMB seat expansion and more on employer training budgets, apprenticeship eligibility, and
              cohort-level renewals. In the UK, the economic plumbing matters: the apprenticeship levy diverts payroll
              into a governed funding pool, and Oxford City Council's procurement documents show Multiverse can
              supplement customer budgets with levy transfers from large partners such as Cisco. Public evidence
              therefore supports a revenue model built on funded apprenticeship standards, transferred levy balances,
              and direct enterprise cohort contracts, not on transparent software list pricing. Programme pages publish
              duration and qualification level, but not realised price, discounting, or average revenue per learner.
              That makes the model understandable in mechanism terms while leaving revenue mix and unit economics only
              partially visible.
