      - number: '8.2'
        title: Comparables imply that Multiverse is priced for a private premium
        blocks:
          - type: paragraph
            body: >-
              The public-market reference set remains helpful even though none of the listed names is a perfect
              apprenticeship analogue. Udemy and Coursera are larger, broader platforms and mix enterprise revenue with
              consumer exposure, while Docebo is cleaner SaaS with much better disclosed margins than Multiverse. Even
              so, the trading picture matters: as of May 2026, those public names sit around roughly 0.8x to 2.2x
              market-cap-to-revenue, far below the revenue multiple implicit in Multiverse’s latest private round.
              Private comparables are less punitive but still not carefree. Guild’s $4.4 billion 2022 peak shows the
              category can command very large marks, yet its 2024 layoffs and later pivot into corporate learning
              illustrate how quickly those marks can come under pressure. Preply’s January 2026 $1.2 billion round and
              upGrad’s 2024 flat $2.25 billion valuation show that capital is still available for scaled learning
              businesses, but price discipline is now tied much more tightly to operating proof. On comparables alone,
              Multiverse looks expensive versus public comps and only selectively supported versus private comps.
