  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The recommendation flows from a real 2026 price signal and real customer proof, but is capped by weak audited
      economics and missing round-term disclosure.
    data:
      nodes:
        - id: external-price
          label: Fresh external price
          note: $70m round at $2.1b re-establishes a live private valuation
          type: input
        - id: traction
          label: Enterprise traction
          note: Customer, partner, and public-sector proof show a real market
          type: process
        - id: audited-gap
          label: Audited economics gap
          note: Latest audited year still shows heavy losses and lower cash
          type: process
        - id: quality-risk
          label: Quality and delivery risk
          note: Completion-rate scrutiny can transmit into revenue quality
          type: process
        - id: terms-gap
          label: Terms opacity
          note: No public evidence on share price or preference stack
          type: process
        - id: output
          label: Research-more / stretched
          note: Use the current round as a ceiling until audited 2026 proof arrives
          type: output
      edges:
        - from: external-price
          to: output
          label: positive but insufficient on its own
        - from: traction
          to: output
          label: supports viability and customer demand
        - from: audited-gap
          to: output
          label: caps willingness to pay up
        - from: quality-risk
          to: output
          label: adds downside haircut
        - from: terms-gap
          to: output
          label: blocks clean entry underwriting
    approximationNotes: >-
      This flow is analytical rather than process-exact. It summarizes how price, traction, economics, and missing
      disclosure combine into the final stance.
    claimRefs:
      - CV001
      - CV007
      - CV014
      - CV015
      - CV040
      - CV044
      - CV046
      - CV051
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: The most important valuation moves are evidence-conversion events, not minor spreadsheet tweaks.
    data:
      items:
        - label: Audited 2026 margin proof
          value: 0.5
          unit: USD bn upside
          detail: Would make the private premium easier to defend
          tone: positive
        - label: Repeat cash-positive quarters
          value: 0.3
          unit: USD bn upside
          detail: Supports a durable inflection rather than one strong quarter
          tone: positive
        - label: Persistent quality / completion drag
          value: -0.4
          unit: USD bn downside
          detail: Would pressure revenue quality and enterprise trust
          tone: warning
        - label: Round terms show heavy investor protection
          value: -0.3
          unit: USD bn downside
          detail: Would reduce the value of the headline round for common holders
          tone: warning
        - label: Public comp compression persists
          value: -0.5
          unit: USD bn downside
          detail: Would make the private premium harder to sustain
          tone: warning
    approximationNotes: >-
      Sensitivity bars are directional estimate ranges, not model outputs. They show which evidence events would matter
      most to the underwriting view.
    claimRefs:
      - CV040
      - CV043
      - CV048
      - CV049
      - CV050
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Scenario ranges use the disclosed round as an anchor and then widen or tighten based on comparable-set evidence
      and proof quality.
    data:
      items:
        - label: Bear case (USD bn)
          low: 0.8
          mid: 1
          high: 1.2
          note: Growth fades, quality risks stay visible, and investors anchor to pressured comps
        - label: Base case (USD bn)
          low: 1.6
          mid: 1.9
          high: 2.2
          note: Current round broadly fair, but upside waits on audited 2026 proof
        - label: Bull case (USD bn)
          low: 2.3
          mid: 2.5
          high: 2.8
          note: High growth and repeat cash positivity turn the 2026 round into a stepping stone
    approximationNotes: >-
      These are underwriting ranges, not target prices. They intentionally reflect uncertainty around round terms, gross
      margin, and secondary liquidity.
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV047
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: wide
    summary: >-
      Multiverse scores well on category relevance and customer proof, but much less well on economics, valuation
      support, and evidence quality.
    data:
      items:
        - label: Category relevance
          value: 8/10
          detail: AI upskilling remains a live enterprise need
          tone: positive
        - label: Customer proof
          value: 8/10
          detail: L&G, Palantir/NHS, and Oxford support real demand
          tone: positive
        - label: Scale proof
          value: 7/10
          detail: Real enterprise base and apprenticeship revenue, but still private and selectively disclosed
          tone: positive
        - label: Economics
          value: 4/10
          detail: Latest audited year still showed large losses and lower cash
          tone: warning
        - label: Risk control
          value: 4/10
          detail: Completion-rate and delivery-quality issues remain visible
          tone: warning
        - label: Valuation support
          value: 5/10
          detail: Fresh round helps, but public comps are much lower
          tone: warning
        - label: Evidence quality
          value: 5/10
          detail: Current bull points are still less audited than an investor would want
          tone: warning
    approximationNotes: >-
      These scores are IC-style synthesis, not rubric outputs from the workflow. They are meant to summarize the
      evidence balance, not replace the underlying claims.
    claimRefs:
      - CV018
      - CV040
      - CV044
      - CV045
      - CV051
