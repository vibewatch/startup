        title: Milestones, strategic partnerships, and risk markers to carry forward
        blocks:
          - type: paragraph
            body: >-
              The milestone sequence since 2023 shows a business moving decisively toward enterprise AI enablement while
              still carrying the scars of an earlier expansion miss. Customer and partner proof points now sit across
              multiple layers of the story: Microsoft-linked Copilot training, a KPMG cohort, Legal & General’s AI
              programme, a Palantir and NHS data-platform partnership, and a long-running John Lewis deployment all
              demonstrate continued commercial activity after May 2024. The January 2026 StackFuel acquisition then
              turned Europe from an aspiration into a concrete geographic expansion plan tied to Germany and
              AZAV-accredited delivery. The adverse markers should remain in the canonical chronology as well. Sifted’s
              reporting on US layoffs and later redundancy payments shows management had to reverse a hiring plan that
              got ahead of revenue. That does not negate the current growth narrative, but it does sharpen what
              diligence should test next: whether the new AI-adoption thesis produces durable margins, stronger
              governance, and cleaner operating discipline than the earlier apprenticeship-growth playbook did on its
              own.
