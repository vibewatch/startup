      - number: '1.2'
        title: Leadership bench, founder dependence, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The leadership picture is good enough to establish functional coverage, but not good enough to underwrite
              governance as if this were a public company. Euan Blair remains the unmistakable centre of gravity: he is
              the founder, chief executive, primary spokesperson on financing, and the person most closely associated
              with the strategy shift from apprenticeship access into workforce AI adoption. That creates real
              key-person dependency. At the same time, the 2024-2026 record shows meaningful bench-building. Jillian
              Gillespie’s arrival from MongoDB adds finance discipline, Martha Lane Fox adds a higher-credibility public
              board signal, and newer product and learning leaders deepen execution depth around AI-enabled product
              development and curriculum design. Even with that progress, the governance picture stays incomplete.
              Public sources do not provide a full current board roster, ownership map, or investor-rights summary, so
              the leadership bench looks stronger than the governance disclosure. Investors can reasonably conclude the
              company is professionalising, but not that public transparency standards have been met.
