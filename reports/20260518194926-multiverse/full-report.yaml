      - number: '1.3'
        title: Funding history, valuation reset upward, and scale signals
        blocks:
          - type: paragraph
            body: >-
              Multiverse’s capital story now reads as a recovery and expansion narrative rather than a defensive bridge,
              but it is not a clean straight line. The 2022 Series D established the company as the UK’s first edtech
              unicorn at a $1.7 billion valuation, and the May 2026 primary raise moved that mark up to $2.1 billion
              with Schroders Capital leading and major prior backers returning. Official materials pair that financing
              with strong momentum language, including 50% year-over-year revenue growth and a first cash-positive
              quarter in early 2026. Those positives should not be detached from the adverse evidence. Independent
              reporting tied the pre-raise period to widening losses, headcount reductions, and a failed US hiring plan
              that had to be unwound. FE Week’s revenue league-table evidence nevertheless supports real UK market
              relevance, because Multiverse topped apprenticeship-provider revenue in 2023-24 and was uniquely cited as
              outstanding by Ofsted among the top ten earners. The funding round therefore looks like expansion capital
              for a still-loss-making but increasingly credible scaled platform, not a fully de-risked late-stage asset.
