  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and commercial shape
        blocks:
          - type: paragraph
            body: >-
              Multiverse's public product surface is much closer to an apprenticeship operating model than a generic LMS
              or seat-based SaaS catalog. The current UK-facing pages break the offer into named AI, data, and
              engineering programmes with explicit qualification levels, durations, and eligibility rules. The ladder
              runs from AI-Powered Productivity at the business-user end, through AI Transformation Architect for
              cross-functional automation leaders, into deeper technical programmes such as AI Product Engineering,
              Applied Data Engineering, Java Software Engineering, Advanced Data Fellowship Top-Up, and DevOps
              Engineering Upskiller. That means the product surface is not one monolithic platform feature list; it is a
              managed portfolio of role-specific pathways that package curriculum, coach support, work-based projects,
              and assessment obligations. The commercial shape matters too. Across the retained public pages, Multiverse
              repeatedly markets these programmes as levy-funded apprenticeships with right-to-work, residence, and
              role-fit requirements, so the public UK offer is tightly coupled to apprenticeship funding rails and
              statutory learner-completion mechanics. In contrast, the clearest US proof point is Northwell Health,
              where the story is framed as bespoke workforce upskilling for 155 IT learners rather than a public
              levy-style catalogue. Public evidence therefore supports a view of Multiverse as a workflow-embedded
              training platform with programme families, not as a pure content subscription.
