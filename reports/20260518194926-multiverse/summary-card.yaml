  topStrengths:
    - >-
      1,500+ employers and 22,000+ learners show that Multiverse has already reached meaningful enterprise and learner
      scale.
    - >-
      Named customer and partner proof across John Lewis, Nationwide, Jaguar Land Rover, KPMG, Legal & General, and
      Palantir/NHS supports real demand for applied AI and data upskilling.
    - >-
      The May 2026 round at a $2.1 billion valuation, led by Schroders Capital with major prior backers returning,
      confirms continued access to high-quality capital.
    - >-
      Management's 50% year-over-year growth claim and first cash-positive quarter in Q1 2026 point to improving
      momentum even if they are not yet fully audited.
  topRisks:
    - >-
      The latest filed year still showed only about £79.6 million of revenue against a roughly £63.3 million pre-tax
      loss, with cash down materially before the 2026 raise.
    - >-
      Reported 52.6% completion rates versus a 65.4% sector average create regulatory, reputational, and
      customer-renewal risk if outcomes do not improve.
    - >-
      The model still depends materially on UK apprenticeship-policy and levy structures rather than on fully
      software-like discretionary budgets.
    - >-
      Governance visibility, cap-table terms, customer concentration, and audited 2026 economics remain under-disclosed
      for late-stage underwriting.
  unresolvedGaps:
    - >-
      Audited FY2026 revenue, margin, cash-burn, and proof that cash-positive quarters persist after the May 2026
      financing.
    - Full 2026 round terms, preference stack, board rights, and the detailed mechanics of the employee equity offer.
    - >-
      Customer concentration, renewal and gross-retention data, and cohort-level unit economics outside
      management-selected case studies.
    - >-
      Current quality-improvement metrics, completion trends, and any Ofsted or DfE correspondence after the reported
      deterioration.
