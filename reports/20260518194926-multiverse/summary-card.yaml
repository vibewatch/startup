summary:
  headline: >-
    Multiverse has real enterprise traction and a fresh $2.1 billion price signal, but public evidence still supports a
    research-more stance because losses, policy-linked delivery risk, and disclosure gaps make the valuation look
    stretched.
  overallScore: 6.1
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
