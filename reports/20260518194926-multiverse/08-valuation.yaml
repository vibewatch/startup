tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence today
  - Decision implication
  rows:
  - - Recommendation
    - research-more
    - Fresh $2.1b round proves real capital access, but public operating proof still lags the price
    - Do not underwrite a buy purely from brand and fundraising momentum
  - - Confidence
    - medium
    - Most bullish current datapoints are company-claimed, while the latest audited year still shows heavy losses
    - Require audited 2026 reporting before moving to high-conviction underwriting
  - - Risk rating
    - high
    - Quality-linked completion risk, layoffs, and opaque round terms can all transmit into valuation downside
    - Demand explicit downside protection and diligence rights
  - - Valuation stance
    - stretched
    - Live public comps trade materially below the private round and private comps still require proof or price discipline
    - Avoid paying above the disclosed May 2026 mark
  - - Entry discipline
    - at or below disclosed round only
    - No public source reviewed disclosed the 2026 round’s effective share price or liquidation preferences
    - Treat the headline mark as a ceiling until terms and audited numbers are shared
  notes: This table is analytical rather than mechanical. It translates the retained evidence into an IC-style output and explicitly discounts for missing round-term and audited 2026 disclosure.
