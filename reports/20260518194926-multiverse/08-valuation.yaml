  evidenceGaps:
  - type: stale
    severity: material
    topic: audited-2026-financials
    missingEvidence: Post-March 2025 audited or at least reviewed 2026 P&L, cash-flow, and balance-sheet evidence confirming whether the Q1 2026 cash-positive claim repeated.
    whyItMatters: The current recommendation turns on whether the latest private round reflects durable operating improvement or just a strong narrative on top of still-lossmaking audited numbers.
    diligencePath: Request monthly management accounts from April 2025 onward plus any lender or board reporting pack used for the 2026 fundraise.
    relatedQuestionRefs:
    - QV004
    - QV026
    - QV028
    - QV029
    - QV032
  - type: private-evidence-only
    severity: material
    topic: round-terms
    missingEvidence: The effective share price, liquidation preferences, participation rights, and option-pool effects of the May 2026 financing are not public.
    whyItMatters: Valuation headline alone is not enough to judge entry discipline because a high headline price can still mask investor-protective terms that dilute common shareholders.
    diligencePath: Obtain the 2026 term sheet, share-class summary, updated cap table, and any side-letter rights granted to the new lead investor.
    relatedQuestionRefs:
    - QV007
    - QV028
    - QV030
    - QV032
  - type: missing-source
    severity: material
    topic: secondary-liquidity
    missingEvidence: No post-May-2024 secondary-market trade or broker indication for Multiverse shares was found in publicly fetchable sources during this run.
    whyItMatters: Secondary pricing would help test whether the headline primary round valuation is clearing in broader private markets or is specific to the lead-led financing.
    diligencePath: Ask the company, lead investor, or specialist brokers for anonymised secondary indications, tender history, or recent employee-liquidity data.
    relatedQuestionRefs:
    - QV024
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Public evidence still lacks gross margin, renewal or NRR, CAC, payback, and product or geography-level contribution margins.
    whyItMatters: Those metrics determine whether Multiverse deserves a software-like premium or should be valued more like a people-intensive training-services business.
    diligencePath: Request product-level and geography-level cohort economics, renewal data, and sales-efficiency metrics covering 2024 through 2026.
    relatedQuestionRefs:
    - QV028
    - QV029
    - QV032
