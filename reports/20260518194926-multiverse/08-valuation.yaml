- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Case
  - Core argument
  - Evidence today
  - What would change the view
  rows:
  - - Thesis
    - The May 2026 round proves Multiverse can still attract institutional capital above unicorn level
    - Fresh $70m primary round at $2.1b after a difficult period
    - Confidence rises further if audited 2026 numbers confirm the narrative
  - - Thesis
    - Enterprise and public-sector proof points support a real AI-adoption use case rather than a purely educational story
    - L&G, Palantir/NHS, and Oxford evidence show demand beyond marketing copy
    - More conviction would come from multi-year cohort renewal and margin disclosure
  - - Anti-thesis
    - The latest audited year still looks like a lossmaking training business rather than a proven software compounder
    - FY2025 revenue of ~£79.6m still came with ~£63.3m pre-tax loss and lower cash
    - View improves only if repeat cash-positive quarters show the delivery model scaling
  - - Anti-thesis
    - Quality and disclosure gaps mean the current mark may overstate what outsiders can actually underwrite
    - Completion-rate scrutiny, layoffs, no public round terms, no secondary signal
    - View improves if round terms, unit economics, and audited 2026 data become available
  notes: The anti-thesis is intentionally price-sensitive. A higher-quality data room could move the same company into a more constructive stance without changing the business itself.
