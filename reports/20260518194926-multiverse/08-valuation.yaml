- id: scenario-ranges-and-price-sensitivity
  title: Scenario ranges depend more on evidence conversion than on addressable market stories
  body: 'The bull, base, and bear ranges in this chapter are intentionally scenario-based rather than mechanically precise because the public record does not reveal the 2026 round terms, current gross margins, or cohort profitability. The bull case assumes that the May 2026 narrative is substantially true in a durable sense: audited 2026 numbers confirm repeat cash-positive quarters, growth remains very strong, and European AI-adoption expansion compounds the customer proof already visible in partner and public-sector wins. The base case assumes the round is roughly fair as a strategic private-market price but that upside is capped until audited margin improvement appears. The bear case assumes the current growth inflection fades, quality issues remain visible, and the company begins to trade mentally closer to pressured training and edtech comparables rather than scarce AI infrastructure stories. The key point is that valuation upside now depends less on whether the company is real — it
    clearly is — and more on whether new evidence can convert a credible private round into a repeatable economics story.'
  claimRefs:
  - CV041
