- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key assumptions
  - Valuation range (USD bn)
  - Probability signal
  - Key risk / proof test
  rows:
  - - Bull
    - 50%+ growth proves durable, repeat cash-positive quarters emerge, Europe AI-adoption expansion compounds customer proof
    - 2.3-2.8
    - Possible, but requires new audited evidence rather than only management claims
    - Need audited 2026 growth, margin narrowing, and low adverse drift
  - - Base
    - Round price roughly fair for current traction, but margins remain mixed and upside waits on better disclosure
    - 1.6-2.2
    - Most consistent with the available public record today
    - Need clarity on round terms and product-level economics before underwriting upside
  - - Bear
    - Growth slows, quality issues stay visible, and investors anchor more heavily to pressured public and private comps
    - 0.8-1.2
    - Not the current signal, but very plausible if 2026 momentum proves temporary
    - Would be triggered by weak audited numbers, poor completion trends, or harder capital markets
  notes: Ranges are scenario estimates, not negotiated prices. They use the disclosed round, live public-comp trading, and recent private learning-platform precedents as anchors.
