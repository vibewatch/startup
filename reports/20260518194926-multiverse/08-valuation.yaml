- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric snapshot
  - Multiple / valuation signal
  - Why relevant
  - Limitation
  rows:
  - - Udemy
    - FY2025 revenue $789.8m; adjusted EBITDA $95.3m; UB ARR $540.0m
    - May 2026 market cap about $0.67b, or ~0.8x FY2025 revenue
    - Enterprise upskilling exposure and a large business-learning installed base
    - Mixed consumer and marketplace model depresses comparability
  - - Coursera
    - FY2025 revenue about $757.5m; adjusted EBITDA about $63.5m
    - May 2026 market cap about $1.64b, or ~2.2x FY2025 revenue
    - Global learning platform with meaningful enterprise and credential mix
    - Consumer and degree mix makes it broader than Multiverse
  - - Docebo
    - Q4 2025 revenue $63.0m; ARR $238.1m; 21.2% adjusted EBITDA margin
    - May 2026 market cap about $0.43b, or ~1.6x FY2026 guidance midpoint
    - Closest public pure-play enterprise learning SaaS comp
    - Cleaner margins and SaaS economics than Multiverse’s people-heavy model
  - - Guild Education
    - 2022 valuation $4.4b; 2024 layoffs; 2025 impact release still showed 1.4m eligible members
    - Private comp shows category ceiling and later retrenchment risk
    - Closest employer-funded education comp in the US
    - No current public revenue multiple or secondary price was found
  - - Preply
    - January 2026 Series D; EBITDA-positive and 100,000+ tutors
    - $1.2b valuation in January 2026
    - Shows that scaled learning platforms can still clear unicorn marks in 2026
    - Language-learning marketplace, not apprenticeship upskilling
  - - upGrad
    - Temasek invested at a flat mark; source cited ~Rs600 crore quarterly revenue
    - $2.25b valuation in October 2024
    - Shows late-stage private price discipline in professional learning
    - India-centric multi-vertical model differs from Multiverse
  - - Cornerstone OnDemand
    - Mature workforce-learning software precedent
    - $5.2b enterprise-value take-private in 2021
    - Useful exit reference for scaled workforce-learning software
    - Historical take-private, not a live trading comp
  notes: This is a partial comparable set covering live public comps, private learning-platform rounds, and one workforce-learning exit precedent. Public rows use market-cap-to-revenue, not EV-to-revenue, because cash and debt adjustments were not rebuilt here.
  enumerationScope:
    coverage: partial
    basis: Rows cover the most supportable public and private learning-platform references directly fetched in this run, but not every possible HR-tech or edtech comparable.
