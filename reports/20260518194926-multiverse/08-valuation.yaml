- id: TV006
  title: Final diligence asks table
  columns:
  - Diligence topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Audited 2026 financial pack
    - Monthly revenue, gross profit, EBITDA, cash flow, and balance sheet after March 2025
    - Needed to test whether the new round reflects durable economics or only narrative acceleration
    - Management data room plus auditor or board materials
  - - 2026 round terms
    - Share price, preference stack, liquidation waterfall, and option-pool impact
    - Needed to translate headline valuation into true entry value and downside protection
    - Lead investor term sheet and updated cap table
  - - Unit economics
    - Gross margin, CAC, payback, NRR, and product/geography contribution margins
    - Determines whether Multiverse should trade like software, services, or a hybrid
    - Finance and GTM operating review
  - - Secondary liquidity signal
    - Any employee tender, broker indications, or secondary trades after May 2024
    - Helps test whether the primary mark clears outside the round itself
    - Company, lead investor, or secondary broker outreach
  - - Quality and completion metrics
    - Recent completion, retention, and employer-satisfaction data by programme and cohort
    - Needed to judge whether revenue quality supports premium valuation multiples
    - Operations and regulatory diligence
  notes: These asks are ordered by how much they could move the recommendation, not by how easy they are to collect.
