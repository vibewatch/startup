- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold / event
  - Transmission to thesis
  - Action implication
  rows:
  - - Audited 2026 growth misses narrative
    - Revenue growth normalizes sharply below the 2026 fundraising narrative
    - The current premium loses its main private-market justification
    - Re-cut valuation closer to the lower end of the scenario range
  - - Cash-positive quarter does not repeat
    - Post-Q1 2026 reporting shows the cash-positive quarter was one-off
    - The round starts to look narrative-led rather than evidence-led
    - Suspend any willingness to pay above the disclosed round
  - - Quality metrics worsen
    - Completion outcomes or regulatory pressure remain visibly weak
    - Levy-backed revenue quality and enterprise trust both deteriorate
    - Apply a harsher risk discount and revisit revenue durability
  - - Round terms reveal heavy investor protection
    - Preference stack, anti-dilution, or other protections materially weaken common-share economics
    - Headline valuation overstates clean entry value
    - Re-base recommendation to avoid unless price adjusts or protections equalize
  notes: Kill triggers are designed to be monitorable rather than rhetorical. Each one points to a concrete event that would require a new valuation view.
