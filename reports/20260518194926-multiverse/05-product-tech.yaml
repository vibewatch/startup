  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: atlas-architecture
    missingEvidence: Named model providers, retrieval design, data-retention policy, evaluation framework, and red-team controls for Atlas in production.
    whyItMatters: Atlas is positioned as a core differentiator, but without architecture and governance detail it is hard to assess privacy boundaries, cost structure, or safety maturity.
    diligencePath: Request the Atlas architecture deck, privacy model, red-team/evaluation scorecards, and escalation playbooks used by product and safety teams.
    relatedQuestionRefs:
    - QE023
    - QE025
  - type: access-blocked
    severity: material
    topic: provider-performance-page
    missingEvidence: An accessible current official apprenticeship-provider performance page for Multiverse on the GOV.UK apprenticeship service during this run.
    whyItMatters: Current official pass-rate and provider-performance data would help reconcile positive historical inspection evidence with recent external scrutiny over completion outcomes.
    diligencePath: Re-run fetches with direct purchaser-side access or request an exported provider-performance report from Multiverse or the apprenticeship service.
    relatedQuestionRefs:
    - QE024
  - type: private-evidence-only
    severity: material
    topic: us-offer-details
    missingEvidence: Formal US catalogue, curriculum outlines, compliance regime, pricing, and customer-implementation materials beyond customer stories.
    whyItMatters: Public evidence shows US activity, but it does not reveal whether US delivery scales with the same economics, support burden, and trust controls as the UK apprenticeship offer.
    diligencePath: Request the US product catalogue, sample statements of work, implementation plans, and any US-specific learner-completion metrics.
    relatedQuestionRefs:
    - QE017
  - type: missing-source
    severity: material
    topic: security-disclosure
    missingEvidence: Public trust-center material, third-party security attestations, incident history, uptime reporting, or API / status documentation tied to the platform itself.
    whyItMatters: Internal platform ambition is visible, but enterprise underwriting still needs harder evidence on security posture, reliability practice, and externally auditable controls.
    diligencePath: Request trust-center access, recent pen-test summaries, uptime / incident reports, and any current SOC 2, ISO 27001, or equivalent control evidence.
    relatedQuestionRefs:
    - QE023
    - QE025
    relatedTableRefs:
    - TE004
  - type: enumeration-incomplete
    severity: minor
    topic: public-product-surface
    missingEvidence: Private employer-admin features, implementation dashboards, learner analytics surfaces, and any bespoke modules not exposed on public pages.
    whyItMatters: The public product-surface table is useful for market positioning, but it may understate the workflow tooling Multiverse actually uses with enterprise customers.
    diligencePath: Request a live product demo covering learner, coach, employer-admin, and analytics views, plus screenshots of the underlying workflow tooling.
    relatedQuestionRefs:
    - QE001
    relatedTableRefs:
    - TE001
