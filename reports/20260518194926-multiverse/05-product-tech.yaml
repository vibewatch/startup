- id: tooling-integrations-and-enterprise-dependencies
  title: Tooling, integrations, and enterprise dependencies
  body: 'The strongest product-tech signal in the retained sources is that Multiverse delivery depends on customer tool access and internal platform capabilities, not just content authoring. The AI Powered Productivity requirements call for Microsoft 365 or Google Workspace plus licensed Copilot or Gemini. Data Fellowship adds BI and diagramming dependencies such as Power BI, Tableau, Sphere Engine, and Lucidchart, while Advanced Data Fellowship Top-Up moves deeper into an engineering workstation model with Jupyter, GitHub, Git, IDE access, CLI usage, PostgreSQL, and pgAdmin. Multiverse''s own support content says Sphere Engine needs allowlisting because it hosts cloud-based editors and dynamic applications, and its computer guidance makes clear that OS choice and employer-managed devices affect programme compatibility. Meanwhile, AI Product Engineering and DevOps curricula publicly reference APIs, RAG, orchestration frameworks, Docker, Kubernetes, CI/CD, and cloud deployment, and a public
    platform-engineering job posting adds a second layer: internal ownership of SSO, notification delivery, safe releases, preference management, and code-level GDPR obligations. Put differently, Multiverse looks like a training platform whose real operating surface spans employer IT access, third-party productivity tools, cloud sandboxes, and an internal trusted-enterprise platform that product teams depend on.'
  claimRefs:
