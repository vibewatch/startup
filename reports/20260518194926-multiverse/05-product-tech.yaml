  - - Java Software Engineering
    - Early-career software engineers
    - Engineering apprenticeship
    - Public page lists module ladder rather than headline duration
    - Move from fundamentals into APIs, testing, architecture, and DevOps
    - Explicit emphasis on Spring Boot, testing discipline, and secure release skills
