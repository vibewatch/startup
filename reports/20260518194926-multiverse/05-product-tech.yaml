  - - Atlas AI guide
    - Existing learners on platform
    - Embedded support feature
    - Always available during programme
    - Answer questions, coach reflection, and route support
    - AI-plus-human support layer inside the learner journey
    - Underlying model, data-retention, and evaluation stack remain undisclosed
