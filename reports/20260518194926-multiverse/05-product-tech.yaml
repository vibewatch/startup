  - - Applied Data Engineering
    - Data professionals moving into engineering
    - Level 5 apprenticeship
    - 15 months + 3 month assessment
    - Build pipelines, storage, and cloud-aligned data operations
    - Public curriculum spans warehousing, meshes, observability, and incident response
