  - FI004
- id: financial-verdict-and-diligence-blockers
  title: Financial verdict and diligence blockers
  body: 'The financial verdict is that Mambu has credible platform demand, credible customer scale, and a believable strategic logic for expanding from core banking into payments, but public transparency remains below underwriting grade. Revenue quality cannot be judged cleanly because list pricing, realized pricing, revenue mix, and current margin are not public. Sales efficiency cannot be judged because CAC, payback, and retention data are absent. Capital adequacy cannot be judged because cash, runway, and any debt schedule are absent. Low-confidence independent adverse commentary reinforces the same pressure points from another angle: long enterprise sales cycles, dependence on SI partners, incumbent pricing pressure, and exposure to delayed transformation budgets. None of that disproves the investment case, but it does mean the burden shifts to management to provide private evidence before valuation can be anchored responsibly. In practical terms, Mambu looks strategically important
    and commercially relevant, yet still requires a finance data room before anyone can say whether the current business mix is software-beautiful or services-heavy and financing-sensitive.'
