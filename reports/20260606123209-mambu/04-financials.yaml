  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency-gap
    missingEvidence: CAC, payback, NRR, churn, funnel conversion, and quota-carrying productivity by segment.
    whyItMatters: Without sales-efficiency and retention data, it is impossible to test whether enterprise growth is efficient or durable.
    diligencePath: Request the board KPI pack, cohort retention tables, pipeline conversion data, and rep productivity metrics for 2024-2026.
    relatedQuestionRefs:
    - QI009
  - type: private-evidence-only
    severity: material
    topic: current-margin-gap
    missingEvidence: Current gross margin by product line, services mix, and hosting / support cost bridge.
    whyItMatters: Margin is the core test of whether Mambu behaves like high-quality software revenue or like a services-heavy transformation business.
    diligencePath: Request audited FY2024 and FY2025 gross-margin bridges split across core platform, payments, and implementation services.
    relatedQuestionRefs:
    - QI012
  - type: private-evidence-only
    severity: blocking
    topic: cash-runway-gap
    missingEvidence: Cash balance, monthly burn, runway, any debt facilities, and management’s next-round trigger.
    whyItMatters: Capital adequacy and financing dependence cannot be underwritten without a current cash bridge and liability schedule.
    diligencePath: Request monthly cash bridge, debt and covenant schedule, and 12-18 month operating plan with downside scenarios.
    relatedQuestionRefs:
    - QI019
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: revenue-mix-gap
    missingEvidence: Revenue split across recurring core subscriptions, implementation / migration services, partner-driven delivery, and payments.
    whyItMatters: Revenue quality depends on how much gross profit comes from repeatable platform value versus lower-margin project work.
    diligencePath: Request product-line revenue mix, contracted ARR, services attachment rates, and backlog by line of business.
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: numeral-acquisition-economics
    missingEvidence: Purchase price, integration budget, expected synergies, and revenue contribution from Numeral-enabled payments.
    whyItMatters: The strategic rationale is clear, but the financial ROI of the acquisition cannot be modeled from public evidence.
    diligencePath: Request acquisition memo, purchase accounting summary, integration spend, and post-close payments attach-rate forecasts.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
    - TI005
sections:
- id: revenue-model-and-pricing-opacity
  title: Revenue model and pricing opacity
  body: 'Mambu’s public financial story begins with breadth of product scope rather than clarity of monetization. Current official materials frame the company as a SaaS cloud banking platform spanning deposits, lending, payments, Islamic banking, banking-as-a-service, and embedded finance. The company’s own messaging increasingly places payments near the center of the story: the Numeral acquisition is described as a strategic growth move, the 2026 payments-hub release calls payments a cornerstone of strategy, and partner content shows Mambu leaning on pre-integrated payments infrastructure instead of selling only a standalone ledger. That points to a multi-line revenue model with recurring platform value plus implementation, migration, partner-enabled delivery, and payments-related revenue opportunities. What public evidence does not show is the exact commercial conversion of that product surface into price books, transaction schedules, setup fees, minimum commitments, or discount policy.
    The accessible pricing path returns a not-found page, and none of the reviewed official materials disclose realized contract economics. Revenue quality is therefore inferable only at the mechanism level, not the contract level.'
  claimRefs:
  - CI001
  - CI004
  - CI008
  - CI009
  - CI036
  - CI040
  - CI043
  - CI047
  - CI057
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: public-traction-and-revenue-estimate-gaps
  title: Public traction and revenue estimate gaps
  body: 'Public traction markers support the idea that Mambu is not an early product-market-fit story. Around Series E, multiple sources converged on 200-plus customers, roughly 50-53 million end users, 65-country reach, 40-plus new customer wins in 2021, and more than 120% year-on-year growth in Q3 2021. Current official materials push those scale claims materially higher: more than 260 customers, 65-plus countries, more than 230 million end users, more than 500 million daily API calls, and sevenfold growth in payments processed during 2025. Those signals support a business with genuine throughput and continued relevance. But there is still no primary-source public revenue bridge for the current group. Instead, the market leans on secondary databases and previews. GetLatka publishes a 2024 revenue estimate, while PitchBook and PM Insights expose the revenue topic without releasing a current public number and Sacra explicitly disclaims completeness. That makes Mambu’s growth story directionally
    credible while leaving current revenue, ARR, and valuation estimates squarely in the triangulate-not-trust bucket.'
  claimRefs:
  - CI002
  - CI003
  - CI005
  - CI006
  - CI014
  - CI015
  - CI016
  - CI025
  - CI026
  - CI027
  - CI028
  - CI033
  figureRefs:
  - FI003
- id: gtm-and-core-platform-economics
  title: GTM motion and core-platform economics
  body: The best public proxies for Mambu’s economics come from how customers and partners describe implementation rather than from any explicit margin disclosure. Form3’s partner page emphasizes that institutions can avoid building payments infrastructure themselves by using a pre-integration with Mambu. Allica Bank’s case study describes migrating a complex acquired SME loan portfolio at pace using Mambu’s loan ledger and composable architecture. FinTech Futures reports BridgeFund was online with deposits in six months and using the platform to expand volumes and geography. Those are useful proof points because they show the product solves material, operationally hard problems and can go live fast once a buying decision is made. But they also imply a sales motion that is expert-assisted, integration-heavy, and likely expensive to support. No reviewed source disclosed CAC, payback, NRR, or current gross margin. Craft offers an old FY2020 margin snapshot, but it is too stale and database-derived
    to clear the gap. The public unit-economics read-through is therefore that Mambu likely has meaningful recurring software value, but the balance between high-margin core revenue and lower-margin project effort remains hidden.
  claimRefs:
  - CI034
  - CI035
  - CI043
  - CI044
  - CI045
  - CI046
  - CI047
  - CI050
  - CI058
  tableRefs:
  - TI003
  figureRefs:
  - FI002
- id: capital-adequacy-and-financing-dependence
  title: Capital adequacy and financing dependence
  body: Capital history is substantially clearer than capital adequacy. December 2021 Series E is well corroborated across official, advisory, and news sources at roughly €235 million or $266 million and a roughly €4.9 billion or $5.5 billion valuation, with proceeds earmarked for innovation, geographic expansion, customer success, and hiring. Public databases further expose a multi-round chronology, but they disagree on lifetime funding totals by roughly $20 million, which shows that even aggregate capital raised is still estimate-grade rather than company-disclosed. The Numeral acquisition in December 2024 and the February 2026 payments-hub expansion show that Mambu has continued to invest in growth and broaden the monetization surface. What the public record still does not show is the current balance-sheet cushion behind that strategy. The only locally accessible filing evidence in this review is the UK Mambu Tech entity, which exposes small-company-account timing but not consolidated
    group cash, debt, revenue mix, or purchase-price economics. No reviewed source disclosed current cash on hand, burn, runway, or the next-round trigger. Financing dependence is therefore unresolved, not disproven.
  claimRefs:
  - CI010
  - CI011
  - CI012
  - CI013
  - CI017
