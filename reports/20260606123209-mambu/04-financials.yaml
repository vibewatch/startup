chapter:
  number: 4
  title: Financials
  summary: 'Mambu’s public financial picture shows a real, scaled core-banking platform but not a fully underwritable one. Official and independent sources support a revenue model spanning core platform subscriptions, implementation and migration work, partner-enabled delivery, and an increasingly strategic payments layer after the Numeral acquisition and 2026 payments-hub expansion. What remains opaque are the metrics that decide software quality and financing risk: list and realized pricing, revenue mix, gross margin, CAC/payback, retention, cash, runway, and the economics of the Numeral integration. The financial verdict is therefore positive on demand and strategic relevance, but cautious on margin path and capital adequacy because public disclosure still stops well short of investment-grade transparency.'
