tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Public mechanism
  - Current public status
  - Revenue-quality read-through
  - Diligence ask
  rows:
  - - Core banking platform subscriptions
    - Deposits, lending, and core modules sold to banks, lenders, fintechs, and other institutions
    - Explicitly supported by current official product surface
    - Likely recurring and mission-critical once implemented
    - Request standard subscription constructs, ACV by segment, and renewal history.
  - - Payments hub / orchestration
    - API-first payments hub, scheme connectivity, reconciliation, liquidity, and payment workflows
    - Explicitly expanded after Numeral; 2026 press says payments processed grew 7x in 2025
    - Could deepen wallet share and increase usage-based revenue, but unit pricing is undisclosed
    - Request payment-fee schedules, scheme/connectivity pricing, and payments attach rate.
  - - Implementation / migration services
    - Customer migrations, deployment work, onboarding, training, and support are visible in customer and partner materials
    - Strongly implied by Allica, BridgeFund, and Form3 evidence
    - Can accelerate adoption but may dilute gross margin if services-heavy
    - Request services gross margin, implementation effort by deal, and percentage of contract value from services.
  - - Partner-enabled delivery
    - Form3 pre-integration and 450+ partner ecosystem highlighted on official surfaces
    - Clearly material to delivery and scale
    - Could reduce in-house build cost while obscuring reseller or referral economics
    - Request partner-sourced pipeline %, reseller terms, and SI margin-sharing agreements.
  - - Embedded finance / BaaS use cases
    - Mambu markets wallets, BNPL, embedded finance, and BaaS use cases beyond banks
    - Visible in official buyer segmentation
    - Broadens TAM but monetization by use case is not public
    - Request revenue by buyer archetype and product family.
  - - Numeral-enabled payment technology
    - Numeral payments stack becomes integrated into Mambu offer and available to new customers from day one
    - Explicit post-acquisition expansion vector
    - Could raise software and transaction monetization per customer if adoption is real
    - Request acquisition model, incremental revenue, and payment-product attach rate.
  notes: Public evidence supports a multi-line monetization model, but not the exact mix between recurring platform revenue, services, partner economics, and payments.
  claimRefs:
  - CI001
  - CI004
  - CI036
  - CI040
  - CI043
  - CI047
  - CI057
- id: TI002
  title: Pricing / monetization table
  columns:
  - Surface
  - What is public
  - What is not public
  - Implication
  - Diligence ask
  rows:
  - - Official website and product pages
    - Product scope, buyer types, scale claims, and payments expansion
    - No list pricing, contract tiers, implementation fees, or transaction schedules
    - Public pricing opacity remains a first-order underwriting blocker
    - Obtain current price book, standard order form, and discount policy.
  - - /pricing path
    - A public pricing URL exists only as a not-found page
    - Whether pricing is intentionally private or simply unpublished
    - Even discovery path to pricing is absent
    - Ask management for live pricing architecture and channel-specific packaging.
  - - Customer and partner case studies
    - Deployment value, migration speed, and integration benefits
    - Realized pricing, services attachment, and margin by deal
    - Value proof exists, but commercial conversion does not
    - Review executed SOWs, invoices, and implementation scopes.
  - - Funding announcements
    - Use of funds and expansion intent are disclosed
    - Burn, payback, and contribution margin behind the expansion plan
    - Capital use is visible, economics are not
    - Request budget-versus-actual analysis tied to the 2021 raise and post-acquisition spend.
  - - Market-data previews and databases
    - Directionally useful revenue, funding, valuation, and headcount estimates
    - Methodology, source documents, and current verified revenue
    - Useful for triangulation only, not for underwriting
    - Reconcile every estimate to audited finance-team outputs.
