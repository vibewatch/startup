  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Repricing or structured round
        - Any new financing, secondary trade, or internal benchmark implies a material markdown or preference stack inconsistent with the stale 2021 headline.
        - Invalidates the idea that the old mark still anchors current value.
        - Re-underwrite immediately toward the base-to-bear range.
      - - Services-heavy economics
        - Diligence shows a low software gross margin, heavy implementation burden, or limited operating leverage.
        - Collapses the premium-multiple thesis.
        - Treat Mambu more like a lower-multiple infrastructure or services asset.
      - - Weak retention or concentration
        - NRR, GRR, or concentration metrics fail to support sticky enterprise-software economics.
        - Turns the logo set from strength into volatility risk.
        - Cut size, demand price reset, or pause.
      - - Execution shock at a flagship customer
        - A major migration, outage, or payments-integration issue becomes public at a reference customer.
        - Compresses both execution credibility and valuation support.
        - Move toward avoid unless the issue is clearly contained and temporary.
      - - No disclosure progress before the next capital event
        - Management still will not share a clean economics and cap-table pack before asking investors to price new money.
        - Confirms opacity is structural rather than transitional.
        - Maintain research-more and refuse to chase price.
    notes: These are valuation-moving triggers designed to change price or process, not merely generic risks.
    claimRefs:
      - CV050
      - CV051
      - CV052
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Current ARR / revenue bridge
        - Board or auditor pack showing 2025-2026 ARR, revenue, and reconciliation from any legal-entity or database numbers to consolidated results.
        - This is the fastest way to test whether the stale mark is merely stale or fundamentally unsupported.
        - CFO, board materials, and audited management accounts.
      - - Margin and services mix
        - Software versus services mix, gross margin trend, implementation burden, and payments economics.
        - Determines whether Mambu deserves premium software multiples or a lower blended multiple.
        - Finance leadership and delivery-operations review.
      - - Retention and concentration
        - NRR, GRR, cohort renewals, top-customer share, and top-partner exposure.
        - Needed to know whether the logo set translates into durable economics.
        - Commercial operations, customer-success data, and cohort analysis.
      - - Cap table and preferences
        - Current cap table, liquidation preferences, seniority, side letters, and any structured protections.
        - Headline valuation can be economically misleading without this file.
        - CFO, lead counsel, and latest financing documents.
      - - Cash, burn, and runway
        - Latest cash balance, burn profile, covenant position, and plan to profitability or next capital event.
        - Valuation support weakens sharply if the company needs capital before disclosure improves.
        - Finance team, board pack, and treasury review.
      - - Win-loss and flagship reference health
        - Recent large-bank competitive outcomes, renewal evidence, incident history, and flagship migration health.
        - Separates real moat from marketing strength in a crowded modernization market.
        - CRO, CTO, customer references, and incident logs.
    notes: This is the minimum diligence pack needed to convert Mambu from interesting to underwritable at a specific price.
    claimRefs:
      - CV053
      - CV054
      - CV055
      - CV056
