  - id: final-diligence-asks-and-thesis-breaks
    title: Final diligence asks and thesis-break triggers
    body: >-
      The remaining work is clear and investment critical. Before underwriting price, investors need a board-level 2025-2026 ARR or revenue bridge, software-versus-services mix, gross margin trend, retention data, concentration, the latest burn and runway view, and the actual cap-table terms behind any current mark. Without those files, the investment question is not whether Mambu is strategically relevant; it is what investors are really paying for and how much hidden downside sits between preferred and common outcomes. The official Companies House trail reinforces the gap: accessible filings exist, but they are small-company accounts and not a consolidated lens on group economics.

      The thesis also needs explicit breakpoints. Any new financing, secondary transaction, or internal valuation benchmark that implies a material markdown would undermine the case that the 2021 mark still matters. So would evidence that the economics are implementation-heavy, that retention is weaker than a premium software multiple assumes, or that customer concentration is higher than the current logo set suggests. Operationally, a public migration failure, outage, or payments-integration stumble at a flagship customer would compress both execution credibility and multiple support. The upside case is still alive because Mambu appears to own a real product and customer base, but the price-sensitive recommendation can improve only if diligence proves stronger economics and cleaner terms than the public record currently discloses.
