  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: current-financial-bridge
      missingEvidence: Audited or board-approved 2025-2026 ARR and revenue bridge from legal-entity numbers to consolidated group results.
      whyItMatters: Without a clean top-line bridge, investors cannot know whether the public revenue proxies materially understate the business or roughly describe it.
      diligencePath: Request CFO pack, audited management accounts, and board reporting that reconcile any ARR presentation to statutory revenue.
      relatedQuestionRefs:
        - QV002
        - QV008
      relatedTableRefs:
        - TV006
    - type: private-evidence-only
      severity: blocking
      topic: margin-and-retention
      missingEvidence: Current gross margin, software-versus-services mix, NRR, GRR, churn, and cohort profitability.
      whyItMatters: These are the files that determine whether Mambu deserves a premium software multiple rather than a lower blended multiple.
      diligencePath: Request detailed cohort analysis, gross-margin bridge, services-attachment data, and customer-retention reports.
      relatedQuestionRefs:
        - QV009
      relatedTableRefs:
        - TV006
    - type: private-evidence-only
      severity: blocking
      topic: cap-table-and-price-discovery
      missingEvidence: Current cap table, liquidation preferences, seniority, any structured protections, secondary pricing, and any recent internal valuation benchmarks.
      whyItMatters: Headline valuation can be economically misleading if preference terms or refreshed pricing have already reset downside outcomes.
      diligencePath: Review financing documents, cap-table model, counsel memo, and any recent 409A or board valuation materials.
      relatedQuestionRefs:
        - QV002
        - QV025
      relatedTableRefs:
        - TV004
        - TV005
        - TV006
    - type: private-evidence-only
      severity: material
      topic: cash-burn-and-runway
      missingEvidence: Current cash balance, monthly burn, debt or covenant profile, and financing plan to the next value-creation milestone.
      whyItMatters: A premium private valuation becomes harder to defend if the company needs capital before disclosure quality improves.
      diligencePath: Request treasury view, covenant schedule, and board financing plan.
      relatedQuestionRefs:
        - QV028
      relatedTableRefs:
        - TV006
    - type: private-evidence-only
      severity: material
      topic: concentration-and-reference-health
      missingEvidence: Top-customer share, top-partner share, renewal status of flagship logos, recent win-loss data, and incident history.
      whyItMatters: The public logo set can overstate moat if revenue is concentrated or if flagship deployments are less healthy than marketing implies.
      diligencePath: Review customer cohorts, pipeline pack, reference calls, and incident postmortems.
      relatedQuestionRefs:
        - QV027
        - QV028
      relatedTableRefs:
        - TV005
        - TV006
