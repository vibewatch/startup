  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - What would change the view
    rows:
      - - Mambu has real product and customer proof across core banking, payments, and adjacent workflows.
        - Need audited economics to show that product breadth converts into premium-quality revenue rather than only strategic relevance.
      - - Payments expansion and the Numeral acquisition create a credible adjacency beyond the legacy core-banking narrative.
        - Need proof that payments growth is durable, profitable, and sticky rather than a low-margin expansion story.
      - - Customer and partner evidence from Allica, Form3, and 2026 payments references suggests delivery credibility and ecosystem leverage.
        - Need renewal, concentration, and implementation-burden data to convert reference quality into underwriting confidence.
      - - The anti-thesis is that Mambu remains a strong asset but at a stale 2021 price that no longer matches post-reset software or fintech multiples.
        - This softens only if current ARR or revenue is materially above public proxies and terms are clean.
      - - The anti-thesis is strengthened by absent public pricing, absent current consolidated ARR or revenue disclosure, and absent margin or retention disclosure.
        - A board-level data room with pricing architecture, margin trend, and NRR could materially improve the case.
      - - Public and private comparables still allow a premium if Mambu is genuinely elite on software quality and scale.
        - Investors need proof that Mambu deserves that premium instead of assuming it from the 2021 mark.
    notes: Each row is framed as a valuation-moving argument rather than a static judgment on company quality.
