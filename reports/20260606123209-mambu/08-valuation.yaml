  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - Current ARR or revenue is materially above public proxies, payments momentum sticks, and diligence shows software-like gross margin, retention, and clean terms.
        - $2.4B-$3.6B current fair-value range; still below the 2021 peak, but supportive of a premium private-software view.
        - Any sign of services-heavy revenue, concentration, or a structured cap table breaks this case quickly.
        - Requires a clean data room and explicit evidence that the public proxies materially understate current economics.
      - - Base
        - Mambu remains strategically strong and commercially relevant, but public disclosure stays incomplete and no current price discovery is shared.
        - $1.3B-$2.1B range; the company deserves a premium to weak fintechs, but not the stale 2021 mark.
        - Another financing need, soft retention, or weak margins keep this case from rerating.
        - Most consistent with the retained public record.
      - - Bear
        - Public revenue proxies are directionally right, comp discipline dominates, and any refreshed pricing or terms land below expectations.
        - $0.7B-$1.2B range; a new-money or secondary markdown would likely push fair value into this band.
        - Down-round dynamics, preference overhang, and execution surprises would compound each other.
        - Becomes more likely if the key economics and term files stay closed.
    notes: Scenario bands are underwriting judgments, not a DCF, and they are intentionally wide because the core economic inputs remain private.
