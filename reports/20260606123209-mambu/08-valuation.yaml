  - id: public-comparable-lens
    title: Public and private comparable lens
    body: >-
      The comparable set has to do two jobs at once: anchor Mambu against observable public software valuations and test whether private cloud-core businesses still deserve a scarcity premium after the 2021 fintech peak. The market-reset evidence is clear enough to matter. Bain describes 2021 fintech revenue multiples reaching as high as 25x before crashing in 2022, while TechCrunch's 2023 private-market reporting shows that many fintechs have since reset through secondary price discovery, structured rounds, and valuation right-sizing. First Page Sage's 2025 private-fintech work points to banking-related revenue multiples around 4.2x to 6.7x and a median around 4.7x by late 2024, down from 7.7x in 2021. That does not prove Mambu belongs exactly on that table, but it does make the old mark a stale reference point rather than a self-validating fact.

      The public comp band is mixed but still directionally hard to ignore. Temenos offers the incumbent upper-bound lens with disclosed ARR, margins, and installed-base scale. nCino provides a more cloud-banking-software read-through with disclosed revenue, gross margin, and EV/sales. Guidewire and Clearwater are not direct core-banking peers, but both are mission-critical financial-software names with sticky implementations and fuller disclosure, making them useful premium-quality boundary markers. Thought Machine adds the private cloud-core comparison, and its own 2025 insider raise with no public re-mark is a reminder that strategic relevance does not automatically equal visible valuation support. Against those comps, Mambu's stale $5.5B mark implies high-30s to low-40s revenue multiples on the two publicly accessible 2024 revenue proxies in this chapter, which is far above the observable public band and above the 2025 private-banking multiple table.
