  evidenceGaps:
  - type: missing-source
    severity: material
    topic: named-customer-roster-completeness
    missingEvidence: An exhaustive current list of live paying Mambu customers, including which logos are active, in pilot, churned, or inactive.
    whyItMatters: The chapter can show representative named proof, but not whether the full customer base is broader, narrower, or more concentrated than the public sample suggests.
    diligencePath: Request a live customer ledger with launch status, contract start date, and current ARR by account, then reconcile it against the public case-study roster.
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo churn, contract length, renewal rates, and expansion ARR by customer cohort.
    whyItMatters: Without renewal and churn metrics, the chapter can support adoption but cannot underwrite durability or customer lifetime value.
    diligencePath: Request customer cohort data by segment and geography, including gross and net retention bridges for the last 8 quarters.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: blocking
    topic: customer-concentration
    missingEvidence: Top-10 and top-25 ARR concentration, largest single-account exposure, and sponsor-backed versus direct account mix.
    whyItMatters: Logo breadth does not reveal whether Mambu is economically dependent on a few flagship customers or sponsored deployments.
    diligencePath: Request current ARR concentration schedules plus historical loss or downsell history for the largest accounts.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: implementation-success-rates
    missingEvidence: Win/loss data, failed migrations, delayed go-lives, and implementation CSAT for customer deployments.
    whyItMatters: Review surfaces suggest friction in customer orientation and customization cost, but the public record does not quantify how often those issues affect expansion or churn.
    diligencePath: Request implementation scorecards by account, partner, and geography, including time-to-value, post-go-live incidents, and conversion from pilot to production.
    relatedQuestionRefs:
    - QU023
    - QU024
    relatedTableRefs:
    - TU004
    - TU005
