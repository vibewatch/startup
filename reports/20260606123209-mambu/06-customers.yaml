- id: partner-channel-influence-concentration-and-diligence-gaps
  title: Partner and channel influence, concentration, and diligence gaps
  body: Several of Mambu's most interesting customer proofs are not pure standalone software wins; they involve partner or sponsor structures that can both strengthen and complicate customer quality. Spendesk's public story runs through BPCE, GoTyme sits inside the Tyme and JG Summit ecosystem, and ABN AMRO's BUUT launch shows how an incumbent can reuse Mambu across multiple branded propositions. Those examples are positive because they show platform trust and expansion into adjacent workloads. They are also cautionary because the public record does not reveal how much revenue comes from a few flagship groups, how much delivery depends on bank sponsors or ecosystem partners, or how much Mambu earns after implementation versus at launch. Public case studies show breadth of adoption, but not cohort economics. The core diligence asks are therefore concentration by top account, contract length and renewal terms, module-attach by flagship customers, and implementation success rates after first
    go-live.
  claimRefs:
  - CU030
  - CU031
  - CU036
  - CU038
  - CU039
