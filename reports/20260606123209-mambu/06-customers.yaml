tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale / production marker
  - Revenue / strategic value
  - Main gap
  rows:
  - - Consumer neobank / super-app
    - 'Buyer: digital-bank operator; User: retail consumer; Payer: institution'
    - App-based payments, cards, lending, savings
    - Ualá launched on Mambu in 2 months; customer-side app remains live in Argentina and Mexico
    - Shows Mambu can support high-frequency consumer finance in LATAM
    - No disclosed contract value or retention by market
  - - Established SME bank
    - 'Buyer: bank product / lending team; User: SME borrower; Payer: bank'
    - Bespoke SME lending
    - Allica case is framed around live SME lending, not pilot experimentation
    - Extends proof into bank-served SME credit
    - No public origination volume or renewal data tied to Mambu
  - - Digital bank at ecosystem scale
    - 'Buyer: bank; User: retail consumer / MSME; Payer: bank'
    - Transactional digital banking with ecosystem features
    - Bank Jago cites a 7-month implementation and still markets a live digital bank
    - Supports high-scale core-banking migration in Indonesia
    - Customer-side technical and commercial detail is sparse
  - - Cross-market digital banking template
    - 'Buyer: banking group / ecosystem sponsors; User: retail consumer; Payer: bank'
    - Replicate TymeBank-style digital banking into the Philippines
    - GoTyme says 100,000 customers per month since launch
    - Shows reusability across geographies and sponsor structures
    - No public renewal or economics by country
  - - Embedded finance / BaaS platform
    - 'Buyer: platform product team; User: fintech / brand customers; Payer: platform'
    - Cloud banking and embedded-finance infrastructure
    - Solaris positions the deployment as fully cloud-based bank infrastructure
    - Broadens proof beyond front-end neobanks into regulated infrastructure
    - No public module mix or margin impact
  - - Consumer wealth / banking app
    - 'Buyer: fintech operator; User: retail investor / saver; Payer: fintech'
    - Investing, saving, and banking
    - Stash still markets a live wealth app and says it has helped 5M+ people build wealth
    - Shows Mambu can support retail-investment-adjacent finance propositions
    - No public Mambu-specific outcome metrics
  - - Global remittance / payments modernisation
    - 'Buyer: global money-transfer operator; User: retail remittance customer; Payer: operator'
    - Digital banking plus European payment-rail modernisation
    - Western Union case cites four-country payments migration in six months
    - One of the clearest enterprise land-and-expand proofs
    - No public revenue contribution by workload
  - - B2B spend-management fintech
    - 'Buyer: finance-software operator; User: business finance teams; Payer: fintech / partner bank'
    - SEPA flows and banking infrastructure for spend management
    - Spendesk case is live and tied to BPCE sponsorship plus payment-cost savings
    - Shows Mambu can support non-bank fintech distribution
    - Channel dependence on bank partner is not quantified
  - - Digital microfinance / consumer lending
    - 'Buyer: lender; User: consumer borrower / saver; Payer: lender'
    - Loans, savings, and banking for underbanked users
    - Renmoney cites 500k+ customers and ₦2tn loans to date after migration
    - Strong inclusion-led proof with quantified throughput
    - No public renewal or unit-economics data
  - - Digital SME lender
    - 'Buyer: bank-owned fintech; User: SME borrower; Payer: lender'
    - Fast online business lending
    - New10 cites 10-month launch, 15-minute decisions, and 2-day disbursal
    - Clear proof in business-borrower workflows
    - No public cohort performance or contract terms
  - - European mobile bank
    - 'Buyer: digital bank; User: retail consumer; Payer: bank'
    - Mobile current accounts and daily banking
    - N26 cites 4.0M+ revenue-relevant customers and tens of millions of monthly transactions
    - One of the strongest scale proofs in the public set
    - No public renewal economics or workload pricing disclosed
  notes: Rows summarize representative named proofs in the retained public sample; they are not an exhaustive customer census and do not imply ARR weighting.
