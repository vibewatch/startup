- id: retention-durability-and-proof-quality
  title: Retention, durability, and proof quality
  body: 'The public record supports a durability hypothesis, but not a durability proof. There are good expansion proxies: Western Union broadened from digital banking into payments modernization, ABN AMRO reused Mambu from New10 into BUUT, and Tyme/GoTyme used the platform as a reusable banking template across markets. Review surfaces also describe Mambu as fast to integrate and strong on APIs, which is consistent with reuse inside complex customer estates. But those proxies stop well short of the metrics an investor would actually underwrite. No retained public source discloses Mambu customer NRR, GRR, logo churn, contract length, renewal cohorts, seat growth, or revenue expansion by account. The review surfaces add a second caution: users praise flexibility and launch speed, but also complain about customer orientation, learning curve, and customization cost. So the best public interpretation is that Mambu has credible live customers and plausible expansion vectors, while true retention
    economics remain private.'
