- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Public evidence
  - Impact
  - Diligence path
  rows:
  - - ABN AMRO platform reuse
    - New10 was followed by BUUT on Mambu
    - Positive signal for repeatability inside large incumbents
    - Request revenue, product, and support scope by ABN AMRO brand
  - - GoTyme / Tyme ecosystem replication
    - TymeBank pattern was lifted into the Philippines with JG Summit backing
    - Positive on template reuse; also shows partner dependence
    - Request economics, support model, and retention by market and sponsor
  - - Sponsor-bank / partner influence
    - Spendesk case is tied to BPCE; GoTyme ties to JG Summit; BUUT ties to ABN AMRO
    - Some wins likely require channel or sponsor structures, not pure direct software sales
    - Request sourced ARR by partner type and concentration among sponsor-backed accounts
  - - Flagship-account concentration
    - No public top-customer revenue or ACV schedule is disclosed
    - Material unknown for underwriting ARR durability
    - Request top-10 / top-25 ARR concentration and largest-single-account history
  - - Customer-mix concentration
    - Public named proof skews toward digital banks, lenders, payments, and embedded finance
    - The brand is broad, but the visible revenue engine may still cluster in a few financial workflows
    - Request ARR split by bank, lender, fintech, BaaS, and payments cohort
  - - Retention economics missing
    - No public NRR, GRR, term length, or renewal cohorts appear in retained sources
    - Durability cannot be underwritten from public evidence alone
    - Request renewal curves, expansion ARR, and gross churn bridge
  - - Implementation / support friction
    - Review surfaces note customer-orientation and customization-cost issues
    - Execution risk may cap expansion even when landing new logos
    - Request implementation success rates, CSM coverage, and support SLA history
  notes: 'The table focuses on what public customer proof can and cannot underwrite: visible expansion mechanisms exist, but concentration and renewal economics remain private.'
