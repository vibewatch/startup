chapter:
  number: 6
  title: Customers
  summary: Mambu's public customer evidence supports real global production adoption across digital banks, lenders, BaaS, payments, spend management, and consumer-finance apps. The strongest proof is implementation speed plus live workload expansion at customers like N26, GoTyme, Western Union, New10, Renmoney, and Spendesk; the weakest proof is durability economics, because public sources do not disclose renewal, churn, contract-length, or concentration data. Partner and sponsor influence is visible in several wins, so underwriting customer quality requires more than logo counting.
sections:
- id: customer-base-segmentation-and-geographic-breadth
  title: Customer base segmentation and geographic breadth
  body: 'Mambu''s retained public evidence shows a customer base centered on institutions that pay for core-banking or payments infrastructure while serving consumers or SMEs downstream. In this sample, the most visible buyer categories are consumer neobanks and fintech apps like Ualá, Bank Jago, GoTyme, N26, and Stash; SME and business-borrower platforms like Allica and New10; infrastructure-heavy finance platforms like Solaris and Western Union; and adjacent finance-ops software like Spendesk. That matters because it demonstrates breadth across banking, lending, embedded finance, payments, and spend management, not just one narrow product motion. Geography is also broad: the chapter''s named proof spans Latin America, the UK and continental Europe, Africa, Southeast Asia, and North America. Even so, the sample still clusters in regulated financial-services workloads, and Europe remains the densest concentration in public references. The right read is global proof with thematic concentration,
    not evenly diversified ARR exposure.'
