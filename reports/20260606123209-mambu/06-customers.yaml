- id: named-customer-proof-production-status-and-outcomes
  title: Named customer proof, production status, and outcome specificity
  body: 'The named-customer evidence is materially better than a logo wall. Ualá, Bank Jago, GoTyme, Renmoney, New10, N26, Western Union, Spendesk, Solaris, Stash, and Allica all have public surfaces that indicate live businesses in 2026, and Mambu''s own case pages overwhelmingly describe production deployments rather than pilots. The best proof pairs a Mambu case study with a customer-side page or independent announcement: Ualá still markets a full app-based money stack in Argentina, Allica still focuses on established UK SMEs, N26 still markets a live mobile bank, and GoTyme still positions itself as a fast-growing Philippine bank. Outcome quality is uneven, though. Renmoney, New10, Western Union, Spendesk, N26, and GoTyme provide quantified public outcomes, while Solaris, Allica, and Stash are stronger on strategic fit than on disclosed ROI. So the chapter can support real production use, but not equally strong commercial measurement across every logo.'
