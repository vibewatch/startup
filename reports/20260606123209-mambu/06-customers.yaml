figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  summary: Mambu customer journeys usually start with a regulated buyer problem, move through a fast implementation narrative, then seek adjacent workload expansion once live.
  data:
    items:
    - id: need
      label: Buyer need
      detail: A bank, lender, or fintech buyer typically starts with core modernisation, faster lending workflows, embedded finance, or payments migration.
      touchpoints:
      - Core replacement
      - New digital proposition
      - Embedded finance
      - Payments modernisation
    - id: selection
      label: Selection / sponsorship
      detail: Procurement often includes ecosystem or sponsor influence, especially where a bank partner, incumbent parent, or group ecosystem is involved.
      touchpoints:
      - ABN AMRO / BUUT
      - BPCE / Spendesk
      - JG Summit / GoTyme
    - id: implementation
      label: Implementation
      detail: Public proof repeatedly emphasizes fast time to market, with examples at 2, 7, 10, and 12 months depending on scope.
      touchpoints:
      - Ualá 2 months
      - Bank Jago 7 months
      - New10 10 months
      - BUUT 12 months
    - id: go-live
      label: Go-live and usage
      detail: Once live, public proof shifts to customer acquisition, transaction scale, loan throughput, and operational efficiency rather than seats or users inside Mambu itself.
      touchpoints:
      - GoTyme 100k / month
      - N26 monthly transactions
      - Renmoney loan volume
      - Western Union payments
    - id: expand
      label: Expand / deepen
      detail: The strongest expansion proofs show adjacent workloads or brand reuse, but public sources stop short of revealing renewal curves or concentration economics.
      touchpoints:
      - New10 -> BUUT
      - Digital banking -> payments
      - Tyme -> GoTyme
      - Missing NRR / concentration
  claimRefs:
