  body: Mambu’s customer chapter is supported by live banks, loan books, payment rails, and consumer-finance apps rather than a generic customer wall. That materially raises confidence in adoption quality.
  claimRefs:
  - CU028
  - CU029
  - CU047
- calloutType: risk
  title: Retention and concentration still sit behind the data-room curtain
  body: Public sources do not disclose NRR, churn, contract length, or top-customer revenue mix. Investors can support adoption, but not durability economics, from public evidence alone.
  claimRefs:
  - CU037
  - CU038
  - CU039
- calloutType: insight
  title: Partner structures matter in several flagship wins
  body: ABN AMRO, BPCE, and JG Summit appear directly in some of the best-known proofs. That helps explain expansion, but it also means channel and sponsor dependence must be diligence-tested.
  claimRefs:
  - CU030
  - CU031
  - CU045
