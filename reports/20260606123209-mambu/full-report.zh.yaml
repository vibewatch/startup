  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户工作流定义产品
        blocks:
          - type: paragraph
            body: >-
              Mambu 的产品应被理解为银行、贷款机构和金融科技公司的可配置运营层，而不是单体核心替换。客户团队可以在一个共享平台上配置存款、贷款、支付或伊斯兰银行产品，通过浏览器 UI 和 API
              管理这些产品，并借助生态伙伴扩展栈，而不是等待供应商写代码发布。工作流从产品和账户设置开始，进入 API 连接的执行和服务，并越来越多延伸到支付编排、验证、对账和跨境连接。公开文档强化了 Mambu
              想销售控制力和适应性的定位：公司反复强调可组合性、API-first 配置，以及在多云和合作伙伴环境中部署。实际结论是，Mambu 的产品宽度现在覆盖产品制造、服务、支付控制和开发者工具，但核心、支付和较新 AI
              层之间的商业打包，公开披露仍不如功能范围清楚。
