  - id: TU001
    title: 客户分群表
    columns:
      - 分群
      - 买方 / 用户 / 付款方
      - 用例
      - 规模 / 生产标记
      - 收入 / 战略价值
      - 主要缺口
    rows:
      - - 消费者新银行 / 超级 App
        - 买方：数字银行运营方；用户：零售消费者；付款方：机构
        - App 内支付、银行卡、贷款、储蓄
        - Ualá 2 个月内基于 Mambu 上线；客户侧 App 仍在阿根廷和墨西哥运营
        - 证明 Mambu 能支撑 LATAM 高频消费者金融
        - 未披露合同金额或按市场拆分的留存
      - - 成熟 SME 银行
        - 买方：银行产品 / 贷款团队；用户：SME 借款人；付款方：银行
        - 定制 SME 贷款
        - Allica 案例围绕已上线 SME 贷款展开，而不是试点实验
        - 把证明延伸到银行服务的 SME 信贷
        - 没有与 Mambu 相关的公开放款量或续约数据
      - - 生态级数字银行
        - 买方：银行；用户：零售消费者 / MSME；付款方：银行
        - 带生态功能的交易型数字银行
        - Bank Jago 称 7 个月完成实施，且仍在营销已上线的数字银行
        - 支持印尼大规模核心银行迁移证明
        - 客户侧技术和商业细节稀疏
      - - 跨市场数字银行模板
        - 买方：银行集团 / 生态发起方；用户：零售消费者；付款方：银行
        - 把 TymeBank 式数字银行复制到菲律宾
        - GoTyme 称自上线以来每月新增 100,000 名客户
        - 证明可跨地域和发起方结构复用
        - 没有按国家披露的续约或经济性数据
      - - 嵌入式金融 / BaaS 平台
        - 买方：平台产品团队；用户：金融科技 / 品牌客户；付款方：平台
        - 云银行和嵌入式金融基础设施
        - Solaris 将该部署定位为完全云化的银行基础设施
        - 将证明从前端新银行拓展到受监管基础设施
        - 没有公开模块组合或利润率影响
      - - 消费者财富 / 银行 App
        - 买方：金融科技运营方；用户：零售投资者 / 储户；付款方：金融科技
        - 投资、储蓄和银行服务
        - Stash 仍在营销已上线的财富 App，并称已帮助 5M+ 人积累财富
        - 证明 Mambu 能支撑贴近零售投资的金融主张
        - 没有公开的 Mambu 专属结果指标
      - - 全球汇款 / 支付现代化
        - 买方：全球汇款运营方；用户：零售汇款客户；付款方：运营方
        - 数字银行加欧洲支付轨道现代化
        - Western Union 案例称 6 个月内完成 4 国支付迁移
        - 这是最清晰的企业级落地并扩张证明之一
        - 没有按工作负载披露的公开收入贡献
      - - B2B 支出管理金融科技
        - 买方：财务软件运营方；用户：企业财务团队；付款方：金融科技 / 合作银行
        - 面向支出管理的 SEPA 流程和银行基础设施
        - Spendesk 案例已上线，并绑定 BPCE 背书和支付成本节省
        - 证明 Mambu 能支撑非银行金融科技分发
        - 对银行合作伙伴的渠道依赖未量化
      - - 数字小额金融 / 消费贷款
        - 买方：贷款机构；用户：消费者借款人 / 储户；付款方：贷款机构
        - 面向银行服务不足用户的贷款、储蓄和银行服务
        - Renmoney 称迁移后至今已有 500k+ 客户和 ₦2tn 贷款
        - 以金融普惠为牵引的强证明，且吞吐量已量化
        - 没有公开续约或单位经济数据
      - - 数字 SME 贷款机构
        - 买方：银行旗下金融科技；用户：SME 借款人；付款方：贷款机构
        - 快速线上企业贷款
        - New10 称 10 个月上线、15 分钟决策、2 天放款
        - 企业借款人工作流上的清晰证明
        - 没有公开队列表现或合同条款
      - - 欧洲移动银行
        - 买方：数字银行；用户：零售消费者；付款方：银行
        - 移动活期账户和日常银行服务
        - N26 称有 4.0M+ 收入相关客户和数千万笔月交易
        - 是公开样本中最强的规模证明之一
        - 未披露公开续约经济性或工作负载定价
    notes: 各行概述保留的公开样本中具名代表案例；并非完整客户普查，也不意味着 ARR 权重。
