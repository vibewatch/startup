            body: >-
              风险图中令人放心的一点是，Mambu
              看起来并不草率。它有公开安全证明、连续性工具、多云定位，以及至少一些可信的客户速度和上线执行验证。它还直接卖进一个客户正被迫正式化第三方监督的市场，这意味着买方有强激励把更好的纪律压进供应商关系。需要谨慎的是，同一批力量提高证明门槛的速度，可能快过
              Mambu 公开披露改善的速度。因此，投资规则可以很清楚。控制能力倒退会立刻重要，因为银行核心的信任重建很慢。大银行迁移超支很重要，因为 Swisscom 和反向 SWOT
