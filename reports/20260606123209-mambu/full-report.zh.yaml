      - number: '2.3'
        title: 增长驱动因素与现代化催化剂
        blocks:
          - type: paragraph
            body: >-
              市场驱动因素是结构性的，不只是周期性的。Accenture、Deloitte 和 Swisscom 都描述了一个仍被遗留技术、缓慢产品变化，以及不适配现代数据、AI 或开放生态的架构困住的行业。Backbase
              和 Sutherland 补充说，可组合、模块化方法之所以重要，是因为银行不想在发布新产品或降低维护拖累前，先完成整个平台的推倒重来。换句话说，需求不只是新核心系统，而是一条持续变化的路径。


              支付现代化让这种需求更尖锐。KPMG 的 2026 年趋势把即时支付、支付 AI 和嵌入式金融列为当前优先事项；Bank of England 的 ISO 20022 时间表和 ECB 的 TIPS
              基础设施，则把实时支付变成具体实施项目。这些基础设施变化对 Mambu 很重要，因为它们把架构质量、云姿态和数据就绪度，转化为董事会看得见的支出决定。


              Mambu 自有材料与这一组催化剂高度贴合。公司声称能缩短产品发布周期，其报告 The end of transformation?
              也主张银行可借助可组合架构一步步离开遗留系统。这不能证明市场份额捕获，但能解释为什么 Mambu 的产品叙事与公开现代化压力正在累积的方向一致。
