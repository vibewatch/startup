        - 在共享云原生底座上，通过平台、UI 和 API 配置产品
        - 官方和评论来源都把 Mambu 与更快上线、更容易改产品联系起来
        - 公开证据没有按产品线或复杂度层级拆分配置速度
      - - 运行贷款放款、催收和还款
