        - 公开提及的现行鉴证
        - 平台级安全管理体系和独立审计报告
        - 公开材料未详细披露报告范围、例外事项或审计时点
      - - 外部渗透测试
        - 公开提及的现行控制
        - 针对常见漏洞的网络和 Web 应用测试
        - 没有公开的修复节奏或问题严重度披露
      - - 7×24 事件响应和业务连续性
        - 公开提及的现行控制
        - 值班响应、灾难恢复和经过测试的连续性流程
        - 公开材料没有事件历史数据集，无法对应其宣传的正常运行时间和可用性说法
      - - 专属部署和审计权
        - 公开提及的现行选项
        - 专属环境，以及客户 / 监管方审计访问权
        - 公开材料未说明商业条款，也未说明哪些客户选择专属隔离
      - - IP 封锁和凭证滥用控制
        - 公开提及的历史安全增强
        - 无效凭证达到阈值后自动封锁，并管理允许 / 阻止列表
        - 有文章层面的证明，但更广的身份控制遥测不公开
      - - 支付合规控制
        - 公开提及的现行能力集
        - VOP、审批工作流、审计追踪、Swift 跟踪、筛查和验证控制
        - 公开证据能较强证明功能存在，但对监管检查结果或采用深度证明较弱
    notes: 信任证据混合了持续的平台鉴证和有日期的功能发布；缺失项指出投资判断仍需要私下获取信任资料包或客户背书。
