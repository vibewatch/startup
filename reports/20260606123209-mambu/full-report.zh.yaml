      - number: '4.5'
        title: 财务结论与尽调卡点
        blocks:
          - type: paragraph
            body: >-
              财务结论是，Mambu
              拥有可信的平台需求、可信的客户规模，以及从核心银行扩展到支付的可信战略逻辑，但公开透明度仍低于承销级。收入质量无法干净判断，因为标价、实际成交价、收入组合和当前利润率不公开。销售效率无法判断，因为
              CAC、回本期和留存数据缺失。资本充足性无法判断，因为现金、资金续航和任何债务计划缺失。低置信度的独立负面评论从另一个角度强化了相同压力点：企业销售周期长、依赖 SI
              合作伙伴、存量供应商定价压力，以及转型预算延期风险。这些都不能否定投资论点，但确实把举证责任转给管理层：估值能够负责任锚定前，管理层必须提供私有证据。实际看，Mambu
              具备战略重要性和商业相关性，但仍需要财务数据室；拿到数据室后，外部人才能判断当前业务组合是软件属性漂亮，还是服务偏重且对融资敏感。
