companyProfile:
  summary: >-
    Mambu 是一家 2011 年成立的荷兰私营金融科技公司，销售云原生、可组合的银行平台，覆盖存款、贷款、支付、伊斯兰银行、BaaS 和嵌入式金融场景。公司总部位于 Amsterdam；根据 2024 年末至 2026
    年的公司材料，Mambu 支持超过 65 个国家的 260 多家银行和金融科技机构，每天处理超过 500 million 次 API 调用。2024 年收购 Numeral 后，Mambu 的产品范围变宽；2025-2026
