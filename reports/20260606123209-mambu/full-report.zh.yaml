      - number: '8.2'
        title: 公共和私有可比视角
        blocks:
          - type: paragraph
            body: >-
              可比公司集合必须同时做两件事：用可观察的公开软件估值锚定 Mambu，并检验私有云核心业务在 2021 年金融科技高峰后，是否仍配得上稀缺性溢价。市场重置证据已经清楚到足以影响判断。Bain 称 2021
              年金融科技收入倍数一度高达 25x，随后在 2022 年崩塌；TechCrunch 2023 年的私募市场报道显示，许多金融科技公司此后通过老股价格发现、结构化融资和估值纠偏完成重置。First Page
              Sage 的 2025 年私有金融科技研究指出，到 2024 年末，银行相关收入倍数约为 4.2x 至 6.7x，中位数约 4.7x，低于 2021 年的 7.7x。这不能证明 Mambu
              恰好应该落在那张表上，但足以让旧估值变成过时参照，而不是自我验证的事实。

              公开可比区间参差不齐，但方向上仍难以忽视。Temenos 提供传统厂商上限视角，披露了 ARR、利润率和装机规模。nCino 则给出更接近云银行软件的读数，披露收入、毛利率和 EV/sales。Guidewire
              和 Clearwater 不是直接核心银行同业，但都是任务关键型金融软件公司，实施粘性强、披露更完整，因此可作为优质资产的边界标记。Thought Machine 增加了私有云核心比较，它自己 2025
              年的内部人融资没有公开重估，也提醒投资人：战略相关性不等于可见估值支撑。对照这些可比公司，Mambu 陈旧的 $5.5B 估值，意味着本章两个可公开取得的 2024 年收入代理口径上，收入倍数处于 30
              多倍高段到 40 多倍低段，远高于可观察公开区间，也高于 2025 年私有银行倍数表。
