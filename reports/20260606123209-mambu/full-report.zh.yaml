      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              运营层面，Mambu 已不再由创始人掌舵。公开证据显示 Eugene Danilkis 是联合创始人兼前 CEO，但 Finextra 报道他因个人原因在 2023 年 6 月立即辞职，随后 Fernando
              Zandona 从首席产品与技术官转任临时 CEO。Mambu 在 2023 年 8 月正式将该任命转为永久，并把 Zandona 安排在 Amsterdam 总部；Open Banking Expo
              的独立报道也印证了这一交接时间线。当前领导层页面显示，公司班底比纯创始人故事更制度化：Jesper Hybholt Sorensen 任 CFO，Semhal Tarekegn O’Gorman
              负责客户成功，Mark Geneste 负责收入，Ellie Heath 负责人事。治理能见度仍不完整。公开页面列出 Fritz Oidtmann
              为董事会主席，并显示公司有意披露董事和顾问，但不披露委员会结构、观察员权利或完整投资者权利图谱。因此，关键人风险和控制权集中问题只能从公开数据中得到部分回答。
