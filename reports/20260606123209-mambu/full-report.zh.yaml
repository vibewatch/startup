  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 当 Mambu 成为银行关键外包控制点，监管和法律风险最高
        blocks:
          - type: paragraph
            body: >-
              Mambu 不只是另一家金融科技应用供应商；它把核心运营层卖给受监管机构，而这些机构如今必须更严格地盘点、监控、测试并退出第三方 ICT 依赖。DORA 和英国关键第三方制度之所以重要，正因为 Mambu
              给银行、贷款机构和支付服务商的价值主张是云原生速度，Mambu 因而进入客户的运营韧性边界，而不是外围软件插件。Mambu
              公开材料能略微减轻顾虑：公司称监管机构和客户拥有审计权，销售共享或专用环境，并强调数据驻留选项。但负担仍然不对称。即使供应商被认定为关键方，银行客户仍要为外包风险负责；英国新的报告规则还把重大非外包安排也纳入更大可见度。法律披露层也比投资人希望的更薄。Cookie
              政策容易找到，但公开的产品级隐私和数据处理细节仍然有限。实际含义是，Mambu 的销售动作越来越取决于它多快能满足客户和监管机构对分包商、退出、事件报告和数据处理的深度尽调，而不只是产品能力。
