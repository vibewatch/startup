      - number: '2.2'
        title: 买方分层、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              Mambu 这类平台的买方宇宙，比 Tier 1 银行一步替换核心系统的经典场景更宽。Mambu 当前网站把机会归在银行、新银行、金融科技公司、贷款机构和信用合作社；Google Cloud
              案例研究又把零售商纳入其中，并称 Mambu 的客户群从全球前 100 大银行到新兴数字化进入者都有。PeerSpot 和 Open Banking Tracker
              进一步说明，市场还包括小微信贷、支付处理、嵌入式金融和更广义的银行科技场景，而不只是存量综合银行这一种原型。


              这个宽度很重要，因为不同分层的购买逻辑不同。大型存量机构通常推进企业级现代化项目，架构、风险和运营相关方复杂。区域银行和信用合作社更可能需要合作伙伴带交付，并要求更低风险的迁移路径。新银行、金融科技公司和嵌入式金融玩家更看重上线速度、API
              灵活性和产品可配置性。沿这些路径看，公开证据显示经济买方通常是现代化发起人、CIO、COO 或产品高管的某种组合；架构、支付、运营和风险团队则是重度用户和守门人。


              实际含义是，Mambu 卖的不只是软件功能。它借助生态伙伴、云选择和渐进式迁移，出售一条可信的摆脱遗留约束的路径。这条路径把可触达市场扩展到那些不愿批准一次性单体切换的机构之外。
