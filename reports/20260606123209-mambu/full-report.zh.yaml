  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: Mambu 的建议取决于真实平台证明能否压过缺失的经济指标和已经过时的周期峰值估值。
    data:
      nodes:
        - id: A
          label: 战略相关性
          detail: 260+ 客户、65+ 国家、支付增长和可信交付证明，让投资逻辑仍有生命力。
          tone: positive
        - id: B
          label: 产品与生态证明
          detail: 客户和伙伴证据支撑可组合性、迁移能力和支付赋能。
          tone: positive
        - id: C
          label: 过时的 2021 估值
          detail: 最后披露价格仍指向 2021 年 12 月的 $5.5B。
          tone: risk
        - id: D
          label: 经济指标披露缺口
          detail: 当前 ARR、利润率、留存、现金和条款仍未公开。
          tone: risk
        - id: E
          label: 可比公司与重估纪律
          detail: 自 2021 年以来，公开和私有 fintech 倍数已大幅重置。
          tone: neutral
        - id: F
          label: 继续研究 / 偏高
          detail: 保持跟进，但没有更干净的数据室或低得多的入场价，就不要追高。
          tone: risk
      edges:
        - from: A
          to: B
          label: 支撑质量
        - from: B
          to: F
          label: 保留上行空间
        - from: C
          to: D
          label: 要求证明
        - from: D
          to: E
          label: 迫使检查可比估值
        - from: E
          to: F
          label: 限制价格支撑
