      - number: '2.4'
        title: 约束、矛盾与对 Mambu 的含义
        blocks:
          - type: paragraph
            body: >-
              同一组让市场显得有吸引力的证据，也解释了为什么采用仍然困难。PwC 强调，仅韧性支出就可能吞掉可观资本；Accenture 和 Swisscom
              描述的混合核心与迭代式重构模式，正是因为银行并不总能承受一次性大爆炸替换。Google Cloud 的 Mambu 材料又说明，灵活性、数据驻留、可用性和供应商选择不是次要问题，而是买方是否信任云核心迁移的核心。


              因此，定价透明度和干净的 SAM/SOM
              计算仍未解决。公开记录足够证明这个品类真实、增长且具有战略重要性，但不足以把该结论转换成一个可辩护的近端市场份额分母。本报告保留的来源没有披露代表性合同、服务附着率，或按分层和地理拆分的最新客户组合。


              对后续章节来说，底线很清楚。Mambu 参与的是一个有意义的市场，但实际天花板更少由抽象 TAM
              决定，更多由迁移复杂度、交付信心、合作伙伴触达，以及公司能否持续赢下重视可组合性而非增量遗留升级的分层决定。因此，市场章节应保留相互矛盾的估算和明确证据缺口，而不是夸大确定性。
