  - id: TV005
    title: 投资逻辑破裂和否决触发表
    columns:
      - 触发点
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 重新定价或结构化轮次
        - 任何新融资、老股交易或内部基准都暗示重大下调，或优先权堆叠与陈旧的 2021 年头条估值不一致。
        - 推翻旧估值仍能锚定当前价值的想法。
        - 立即按基准到悲观区间重新承销。
      - - 服务占比高的经济性
        - 尽调显示软件毛利率偏低、实施负担重或经营杠杆有限。
        - 击穿高倍数溢价逻辑。
        - 更接近低倍数基础设施或服务资产来对待 Mambu。
      - - 留存弱或集中度高
        - NRR、GRR 或集中度指标无法支撑粘性企业软件经济性。
        - 客户名单从优势变成波动风险。
        - 缩小仓位、要求价格重置，或暂停。
      - - 旗舰客户执行冲击
        - 参考客户出现重大迁移、宕机或支付集成问题，并公开化。
        - 同时压缩执行可信度和估值支撑。
        - 除非问题明确受控且临时，否则转向回避。
      - - 下一次资本事件前披露没有进展
        - 管理层在要求投资者为新股定价前，仍不分享干净的经济性和股权结构包。
        - 证明不透明是结构性问题，而不是过渡期问题。
        - 维持继续研究，拒绝追价。
    notes: 这些触发点会推动估值变化，目标是改变价格或流程，而不是罗列泛泛风险。
    claimRefs:
      - CV050
      - CV051
      - CV052
  - id: TV006
    title: 最终尽调要求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 当前 ARR / 收入桥
        - 董事会或审计师材料，展示 2025-2026 年 ARR、收入，以及从任何法律实体或数据库数字到合并结果的调节。
        - 这是最快检验陈旧估值只是过时、还是根本站不住的方法。
        - CFO、董事会材料和经审计管理账。
      - - 利润率和服务组合
        - 软件与服务组合、毛利率趋势、实施负担和支付经济性。
        - 决定 Mambu 应拿优质软件倍数，还是更低的混合倍数。
        - 财务负责人和交付运营审查。
      - - 留存和集中度
        - NRR、GRR、队列续约、头部客户占比和头部合作伙伴敞口。
        - 需要这些来判断客户名单能否转化为耐久经济性。
        - 商业运营、客户成功数据和队列分析。
      - - 股权结构表和优先权
        - 当前股权结构表、清算优先权、优先级、附函和任何结构化保护。
        - 没有这份文件，头条估值在经济上可能误导。
        - CFO、牵头法律顾问和最新融资文件。
      - - 现金、烧钱速度和现金跑道
        - 最新现金余额、烧钱曲线、契约状况，以及通往盈利或下一次资本事件的计划。
        - 如果公司在披露改善前就需要资本，估值支撑会明显走弱。
        - 财务团队、董事会材料和资金管理审查。
      - - 赢单 / 输单和旗舰案例健康度
        - 近期大型银行竞争结果、续约证据、事故历史和旗舰迁移健康度。
        - 在拥挤的现代化市场里，区分真实护城河和营销声量。
        - CRO、CTO、客户案例和事故日志。
    notes: 这是把 Mambu 从“有意思”转为“能按具体价格承销”所需的最低尽调包。
    claimRefs:
      - CV053
      - CV054
      - CV055
      - CV056
