      - number: '7.4'
        title: 人员、披露和财务模型风险，仍是不能只按 2021 年估值锚承保 Mambu 的最大原因
        blocks:
          - type: paragraph
            body: >-
              公开记录最软的部分不是产品质量，而是可承保的业务质量。Mambu 仍受益于 2021 年 Series E
              估值的光环，当前第三方数据库也继续呈现收入增长和员工数标记。但公开证据很杂。GetLatka、PitchBook 和 PM Insights 没有给市场一个干净的当前收入、员工规模、流动性或盈利能力视图，PM
              Insights 界面还明确滞后并设门槛。Companies House 给出有用的法人线索，包括近期董事变更和小公司账户，但不是合并集团经济性。这很关键，因为针对 Mambu
              的反向情景不是“公司很差、故事很好”，而是“架构很强、公开经济性不完整，企业级执行可能比品类叙事暗示的更难”。反向 SWOT 来源层级较低，但方向上与更优质来源一致：长销售周期、SI
              依赖以及超大规模云厂商层的定价权，正是公开披露薄弱时可能压缩此前私募市场估值的风险。本章正确立场不是危言耸听，而是把 2021 年估值视为过时，把当前规模指标视为近似，并把企业级执行深度视为仍有一部分未经验证。
