  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与竞争者类型
        blocks:
          - type: paragraph
            body: >-
              Mambu 面对的不是一种干净的竞争者原型。最直接的压力来自 Thought Machine 和 Tuum 等云原生或模块化核心同业，它们同样承诺更快上线、API
              驱动的灵活性和低扰动现代化。但这些直接同业只是市场的一层。更大的存量套件阵营——以 Temenos、Oracle FLEXCUBE、Infosys Finacle、TCS BaNCS 和 Finastra
              为代表——仍然重要，因为许多银行买的是广度、本地化、实施信心和合作伙伴产能，而不只是最优雅的架构。Juniper 排行榜和 SDK.finance 的 2026
              年供应商地图都说明，这个市场足够宽，银行会在同一轮采购动作里比较现代可组合平台和存量套件。


              替代方案集合也比纯核心替换更宽。nCino 年报明确表示其销售流程数字化、遗留整合和银行体验改进，这意味着即使它不是通用核心，也能吸收转型预算。PeerSpot 针对 Mambu 和 Temenos
              的替代方案页面进一步说明，买方会主动横向查看多条替代路径。实际结果是，Mambu 不仅与其他核心系统竞争，也与分阶段现代化、工作流层升级，以及延迟或缩小替换范围的决策竞争。
