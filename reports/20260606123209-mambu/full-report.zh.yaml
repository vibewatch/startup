    title: 缓释措施和投资逻辑破裂触发表
    columns:
      - 风险
      - 可监控触发点
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 控制倒退
        - 安全认证、过渡期审计函或公开事故通知
        - 主要银行工作负载上，任何失效、保留意见报告或客户范围控制例外
        - 立即升级，并在独立审阅补救证据前把承销重置到下行情景
      - - 大型银行迁移执行
        - 标杆项目里程碑和变更单行为
        - 旗舰迁移明显错过上线，需要反复重置范围，或失去具名参考客户
        - 削减企业级上行情景假设，并把 SI 依赖视为结构性利润率拖累
      - - 云或供应商集中度
        - 更新后的云架构和子处理方地图
        - 管理层无法证明生产环境敞口足够分散、退出路径经过测试，且单一供应商敞口可接受
        - 使用更高折现率，并要求先修复云集中度，再承销规模收益
      - - 支付合作伙伴依赖
        - Form3 或同类合作伙伴的可用性、路线图和客户使用情况
        - 支付轨道宕机、合作伙伴重新定价，或 Mambu/Form3 技术栈战略破裂，影响生产客户
        - 重新评估支付扩张，并把平台逻辑收窄回仅核心系统经济性
      - - 监管报告负担
        - 客户提出的 DORA、FCA 重大第三方报告或英国 CTP 规则要求
        - Mambu 无法提供客户现在为登记册、退出、事故报告或审计审查所需的控制证据
        - 在尽调包重建前，假设销售转化放慢、续约信心下降
      - - 披露持续陈旧
        - 融资更新和当前管理账
        - 下一次融资或老股事件发生时，仍没有当前经审计经营数据、续约指标或清晰估值桥
        - 不按旧私募市场标记承销；在透明度改善前，把立场转为观察或回避
    notes: 这些投资逻辑破裂触发点应能从尽调材料、客户要求和管理层更新中监控，而不是失败后事后归因。
    claimRefs:
      - CR006
      - CR016
      - CR021
      - CR028
      - CR029
      - CR030
      - CR042
      - CR047
      - CR049
      - CR060
      - CR061
      - CR063
      - CR064
  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 继续跟踪该资产，但仅凭公开证据，不要按接近陈旧的 2021 年头条估值来承销。
      - - 信心
        - 中
        - 战略价值和可比锚点看得见，但承销文件仍未公开。
      - - 风险评级
        - 高
        - 陈旧估值叠加当前经济性不透明，一旦真实条款浮出，重估可能很快发生。
      - - 估值立场
        - 偏高
        - 公开证据不支持把 $5.5B 视为今天的公允价值。
      - - 入场纪律
        - 优先选择大约 $1.1B-$1.6B，或与尽调挂钩的结构
        - 只有在管理层证明 ARR 显著更高、利润率和留存强劲且条款干净时，才支付高于该区间的价格。
    notes: 把证据集转化为价格敏感的立场，而不是泛泛的公司质量评分。
    claimRefs:
      - CV045
      - CV046
      - CV047
      - CV048
      - CV049
  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 论点
      - 什么会改变判断
    rows:
      - - Mambu 在核心银行、支付和相邻工作流上有真实产品和客户验证。
        - 需要经审计经济性证明，产品广度能转化为高质量收入，而不只是战略价值。
      - - 支付扩张和收购 Numeral，让 Mambu 在传统核心银行叙事之外获得可信相邻业务。
        - 需要证明支付增长可持续、有利润、粘性强，而不是低毛利扩张故事。
      - - Allica、Form3 和 2026 年支付案例提供的客户与合作伙伴证据，说明交付可信，也能撬动生态。
        - 需要续约、集中度和实施负担数据，才能把案例质量转化为承销信心。
      - - 反向逻辑是：Mambu 仍是强资产，但陈旧的 2021 年价格已不匹配重置后的软件或金融科技倍数。
        - 只有当前 ARR 或收入显著高于公开代理指标，且条款干净，这一判断才会缓和。
      - - 公开定价缺席、当前合并 ARR 或收入披露缺席、利润率或留存披露缺席，都会强化反向逻辑。
        - 若董事会级数据室提供定价架构、利润率趋势和 NRR，投资理由可能显著改善。
      - - 如果 Mambu 在软件质量和规模上确实顶尖，公开和私募可比公司仍允许给溢价。
        - 投资者需要证据证明 Mambu 值得这份溢价，而不是沿用 2021 年估值假设。
    notes: 每一行都按会推动估值变化的论点来写，而不是对公司质量做静态判断。
    claimRefs:
