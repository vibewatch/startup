      - number: '8.4'
        title: 最后尽调问题和破题触发条件
        blocks:
          - type: paragraph
            body: >-
              剩余工作清楚且对投资至关重要。在承保价格之前，投资人需要董事会层面的 2025-2026 年 ARR
              或收入桥、软件与服务收入组合、毛利率趋势、留存数据、集中度、最新烧钱速度和现金跑道视图，以及任何当前估值背后的真实股权结构条款。没有这些文件，投资问题就不是 Mambu
              是否具有战略相关性，而是投资人到底在为什么付钱，以及优先股和普通股结果之间藏着多少下行。官方 Companies House
              线索强化了这一缺口：可取得的文件存在，但它们是小公司账户，并不能提供集团经济性的合并视角。

              投资逻辑还需要明确断点。任何新的融资、老股交易或内部估值基准，只要意味着重大降估，都会削弱 2021
              年估值仍然重要的论点。若有证据表明经济性偏实施重、留存弱于高溢价软件倍数假设，或客户集中度高于当前展示客户名单暗示，结论同样会受损。运营层面，如果旗舰客户出现公开迁移失败、宕机或支付集成失误，执行可信度和倍数支撑都会被压缩。上行情景仍然存在，因为
              Mambu 看起来拥有真实产品和客户基础；但这条对价格敏感的建议，只有在尽调证明经济性更强、条款比当前公开记录披露的更干净时，才可能上调。
            claimRefs:
              - CV050
