      - number: '3.3'
        title: 分销力量、切换成本与替代方案
        blocks:
          - type: paragraph
            body: >-
              Mambu 的竞争挑战同样来自分销力量和切换成本，不只是功能覆盖。Temenos 向各种规模银行营销按自身节奏现代化，Finastra 明确主张分步替换核心，TCS
              则把软件与全球系统集成商的资产负债表信用和服务触达绑定。Oracle 增加了广泛的合作伙伴生态连接，Finacle 和 TCS
              也各自公布庞大的地理或机构足迹。这些信号很重要，因为银行往往选择它们认为可以安全落地的供应商和迁移路径，而不是架构故事最干净的那一个。


              这正是替代方案广度具备战略意义的地方。Thought Machine 和 Tuum 是直接同业，但 Mambu 也可能输给更窄的转型路径：围绕存量核心共存、通过 nCino
              等平台做工作流主导的数字化，或部分内部自建。nCino 文件将其定位为遗留整合和流程数字化平台，使它相邻而非相同，但仍会影响预算分配。用于承销时，这意味着 Mambu
              的机会边界不只由竞争核心供应商划定，还由银行到底愿不愿意推进全范围替换来划定。
