      - number: '3.2'
        title: 能力广度、定价不透明与买方适配
        blocks:
          - type: paragraph
            body: >-
              Mambu 最强的公开产品叙事，是在一套可组合 SaaS 栈里的广度。公司称其支持存款、贷款、支付、伊斯兰银行、BaaS
              和嵌入式金融，同时帮助客户更快上线并无扰现代化。这为金融科技公司、贷款机构和银行创造了一套宽阔的现代化叙事：买方想要一个现代平台，但不想从单体套件开始。Thought Machine
              是架构上最近的直接挑战者，因为它更强调可编程产品逻辑、智能合约和产品制造。Tuum 则以更低摩擦的模块化角度挑战，强调实施和性能。买方想要速度、灵活性和更小幅度重写运营模式时，这些直接同业最强。


              更难的是与存量供应商比较。Temenos、Oracle、Finacle、TCS 和 Finastra
              都在营销更宽的企业覆盖、更强本地化、更大的已披露客户足迹和更深的合作伙伴交付网络。它们也越来越多使用可组合、云原生、渐进式现代化这套语言，而这曾经让 Mambu
              听起来独特而现代。定价无法拯救这组比较，因为公开记录很薄。TrustRadius 显示 Mambu 价格不可得，SDK.finance 明确称 Temenos
              定价大多非公开，本报告保留的来源也没有给套件阵营提供可横向比较的模块定价。因此，公开证据支持比较透明度和打包方式，而不是假装知道真实交付经济性。
