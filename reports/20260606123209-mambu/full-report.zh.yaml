      - number: '5.2'
        title: 架构、API 与部署模式
        blocks:
          - type: paragraph
            body: >-
              对一家私营核心银行供应商来说，Mambu 的公开架构故事异常具体。Mambu 明确把平台描述为云原生、多云、可配置和 API-first；用户指南称客户通过 Mambu UI、API 和生态入口操作，公开 API
              参考覆盖 v1、v2、Payments 和 Streaming APIs，并提供可下载 OpenAPI 规格。卡和还款参考说明，公开 API
              覆盖面不只是宣传册：卡授权冻结流程、还款、角色和配置都有直接文档。Google Cloud 的部署证据又增加了一层技术证明，描述了基于 Kubernetes 的互操作、多云支持，以及需要严格 SLA
              和数据驻留结果的客户环境。因此，架构看起来像一个分层控制平面：配置和 UI 在顶部，核心引擎和共享服务在中间，API
              与事件接口环绕其外，底层则是合作伙伴云和集成依赖。剩余担忧在于，公开基准深度仍比架构声称的广度更薄。
