  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 公允价值中点最受隐藏收入质量和任何最新价格发现影响。
    approximationNotes: 柱形展示的是相对 $1.7B 名义中点基准情景的示意性估值变化；它们只表示方向性影响，不是模型审计。
    data:
      items:
        - label: 经审计 ARR 远高于公开代理指标
          value: 0.9
          detail: 如果公开数据库数字明显低估当前合并 ARR 或收入，则有上行空间。
          tone: positive
        - label: 强毛利率与留存证明
          value: 0.6
          detail: 如果尽调确认软件式经济性和粘性队列，则有上行空间。
          tone: positive
        - label: 公开可比估值约束在 ~3x-5x
          value: -0.6
          detail: 如果投资人转向当前可观察可比区间低端，则有下行风险。
          tone: risk
        - label: 结构性降估或疲弱老股信号
          value: -0.8
          detail: 如果任何最新价格发现显示 2021 年估值站不住脚，则有下行风险。
          tone: risk
        - label: 服务偏重或集中度偏高的模式
          value: -0.5
          detail: 如果实施负担或集中度动摇高溢价倍数假设，则有下行风险。
          tone: risk
