            body: >-
              上一轮融资周期以来，最大的产品变化是支付不再只是外围集成故事。2024 年 12 月收购 Numeral 后，Mambu 将支付重新定位为平台原生延伸，并在 2025 和 2026
              年用异常密集的更新流支撑这一叙事。公开记录现在显示一套围绕支付枢纽和通用网关构建的两段式支付架构，包含直接和间接清算体系连接、对账工具、审批工作流、审计轨迹、沙盒模拟、Swift Business
              Connect，以及更紧密的贷款或存款编排。产品更新也显示出具体新增功能的节奏，而不只是叙事定位：SEPA 批处理改进、ClearBank、Memo Bank 和 Iberpay 等银行集成、VOP
              就绪和上线信号、仪表盘级 Swift 跟踪，以及核心与支付之间的新生命周期自动化。2026 年 6 月的 Intelligent Core 和 MCP 是最清楚的前瞻性一步，但从公开尽调角度看，AI
