    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份定位与平台叙事
        blocks:
          - type: paragraph
            body: >-
              Mambu 当前公开身份更像一家云原生银行基础设施供应商，而不是单一产品的核心系统供应商。官网现在称其为唯一可组合、AI 就绪的平台，拥有智能核心，并明确把存款、贷款、支付、伊斯兰银行、BaaS
              和嵌入式金融放进同一套可配置栈。同一页面也给出当前规模叙事：数百家创新者、超过 230 million 名终端用户、每天超过 500 million 次 API 调用、超过 450 家合作伙伴，并在超过 65
              个国家使用。历史身份披露没这么清楚。官方材料明确 Amsterdam 是当前总部，但创立叙事主要仍由二级资料支撑：公司 2011 年起步于 Berlin，创始人为 Eugene Danilkis、Sofia
              Nunes 和 Frederik Pfisterer。因此，可以有把握地称 Mambu 如今总部在 Amsterdam，但完整三人创始团队仍应视为二级来源支持的事实，而不是官方封面级披露。
