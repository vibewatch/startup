  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议和价格纪律
        blocks:
          - type: paragraph
            body: >-
              Mambu 仍像一家真实业务，而不是叙事空壳。官方记录支持的规模包括：65+ 个国家的数百家金融创新者、超过 2.3 亿终端用户、每天超过 5 亿次 API 调用，以及 65+ 个国家的 260
              多家客户。产品故事也不只是狭义核心账本：平台如今覆盖存款、贷款、支付、伊斯兰银行和嵌入式金融场景；Allica 和 Form3 的客户与伙伴证据，也支撑其迁移可信度和支付赋能能力。2026 年 2
              月的支付发布带来有用的运营信号，因为管理层披露 2025 年已处理支付量同比增长七倍，并点名了一组不止单一试点的真实客户。

              问题在价格支撑，而不是公司是否存在。最后一轮已披露融资仍可追溯到 2021 年 12 月，当时 Mambu 以约 $5.5B 投后估值融资约
              $266M。此后，可获得的公开记录没有给出更新的头部估值、干净的老股价格、经审计 ARR、当前合并收入、毛利率、NRR
              或优先股堆叠细节。保留的官方和注册来源显示，即使可取得的英国实体文件也是小公司账户，而不是投资人捍卫后期软件估值所需的合并披露。因此，正确结论是继续研究，而不是买入：资产质量可能真实，值得保持接触；但如果没有大幅更低的价格，或质量高得多的私有数据室，就不要在陈旧的
              2021 年估值附近承保。
