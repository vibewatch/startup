            - 逐条支付轨道的独立运营验证仍有限
        - label: 安全和合规基线
          values:
            - 中高
            - 点名 ISO 27001、SOC 报告、渗透测试、DR/BCP 和访问控制
            - 详细报告范围、事件历史和基准披露仍未公开
        - label: 开发者和运维工具
          values:
            - 中高
            - 公开 API、OpenAPI 规范、卡 / 还款文档、审计跟踪和 webhook 发布
            - 评测证据仍指向培训和自助深度缺口
        - label: AI / Intelligent Core 层
          values:
            - 中
            - 具体发布措辞和 MCP 治理概念已公开
            - 客户生产采用和量化价值尚未公开
