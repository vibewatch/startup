      - number: '8.3'
        title: 情景区间和入场纪律
        blocks:
          - type: paragraph
            body: >-
              正确的情景框架，首先要承认关键承保输入是私有的。乐观情景不是因为 Mambu 曾经达到过 2021 年头部估值，所以该估值就自然仍然成立。乐观情景应是：可获得的收入代理显著低估当前合并 ARR
              或收入，支付动能正在转化为更高质量的钱包份额，管理层也能证明软件型利润率、强留存和干净股权结构。在这条路径下，Mambu 仍可能配得上较大的私有市场溢价；但即便如此，合理价值区间大概率也会明显低于 2021
              年旧高点，因为倍数制度已经改变。

              基准情景给 Mambu
              公开记录确实支持的内容计分：真实客户验证、可信伙伴杠杆、持续产品扩展，以及仍然重要的品类。它也对公开证据无法支持的内容打折：当前融资刷新、干净合并经济性或明确条款可见度。这就是为什么当前最合理区间仍大致是
              $1.3B 至 $2.1B，偏好的入场区间还要更低，约 $1.1B 至
              $1.6B，除非尽调发现显著好于公开来源的隐藏质量。悲观情景很直接。如果可获得的收入代理方向上正确，如果服务或支持负担重于投资人预期，或任何新交易重定价股权结构表，那么公开可比视角会指向显著更低的估值。因此，投资人应把任何关于
              2021 年价格的讨论视为需要挑战的天花板，而不是可以接受的地板。
            claimRefs:
              - CV041
              - CV042
              - CV043
              - CV044
              - CV045
              - CV046
