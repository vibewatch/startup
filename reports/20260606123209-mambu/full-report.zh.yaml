            body: Mambu 的客户章节由活跃银行、贷款账簿、支付轨道和消费者金融应用支撑，而不是泛泛客户墙。这显著提高了对采用质量的信心。
            calloutType: strength
            claimRefs:
              - CU028
              - CU029
