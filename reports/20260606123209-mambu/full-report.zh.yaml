      - number: '7.2'
        title: 可见控制缓和了运营和安全风险，但迁移执行仍是难点
        blocks:
          - type: paragraph
            body: >-
              相比许多私营金融科技基础设施公司，Mambu 公开的控制证据更多。公司发布 ISO 和 SOC 声明，提到外部渗透测试，称配备 24/7 待命人员，并描述业务连续性测试、按时间点恢复和早期 AWS
              故障切换架构。这些是真实缓释项，不是营销空话，也解释了 Mambu 为什么能在受监管客户面前保持可信。剩余问题在于，银行核心系统不能只靠控制叙事承保。Mambu
              自己的报告多次警告核心迁移可能脱轨，并明确反对一次性大爆炸替换，主张分阶段改造。Swisscom 把风险表述得更适合投资判断：小银行迁移或许可控，但大银行项目需要系统集成商，并推高成本。Google Cloud
              和 Allica 证明快速部署可行，但这些案例不能抹掉企业级执行风险；它们只是证明交付条件有利时，平台能够跑通。投资人真正要问的是，Mambu
              的常青发布模式和可组合架构，能否把变更风险降到足以抵消大银行迁移和上线后支持的协调负担。
