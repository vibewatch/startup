  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价不透明
        blocks:
          - type: paragraph
            body: >-
              Mambu 的公开财务故事先体现为产品范围很宽，而不是变现清晰。当前官方材料把公司定位为 SaaS 云银行平台，覆盖存款、贷款、支付、伊斯兰银行、BaaS
              和嵌入式金融。公司自有话术越来越把支付放到故事中心：Numeral 收购被描述为战略增长动作，2026 年支付枢纽发布称支付是战略基石，合作伙伴内容也显示 Mambu
              借助预集成支付基础设施，而不是只销售独立账本。这指向一个多线收入模型：经常性平台价值，加上实施、迁移、合作伙伴带来的交付，以及支付相关收入机会。公开证据没有展示的是，这一产品范围如何具体转化为价目表、交易费率表、设置费、最低承诺或折扣政策。可访问的定价路径返回未找到页面，已审阅官方材料也没有披露实际合同经济性。因此，收入质量只能在机制层面推断，无法在合同层面判断。
