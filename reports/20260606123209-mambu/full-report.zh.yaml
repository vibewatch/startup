      - number: '1.4'
        title: 里程碑与风险信号
        blocks:
          - type: paragraph
            body: >-
              公开里程碑叙事已经从「现代云核心」转向更宽的银行与支付平台。2021 年融资栈之后的关键变化，是 2024 年 12 月收购 Numeral：Mambu 获得一家位于 Paris 的支付技术资产，年处理金额超过
              €10 billion，并带来与欧洲主要银行和清算体系的关系。Mambu 2026 年 2 月支付公告进一步强化了这一步：公告称 2025 年支付量同比增长七倍，支付枢纽正向 EMEA、拉美和亚太扩张，客户包括
              Western Union、BCB Group、Flowe 和 Spendesk。客户证明仍有分量：Good Money 和 Platcorp
              案例研究展示的是真实部署结果，而不是泛泛的客户标识幻灯片；Google Cloud 则把 Mambu 描述为更快启动周期、更低 IT
              运行成本的实际路径。主要公开风险信号不是需求崩塌，而是信息质量：创始人交接、Numeral 经济数据未披露、数据库层指标相互矛盾，都意味着尽调应聚焦治理权利、当前经济性，以及管理层如今如何定义「客户」。
