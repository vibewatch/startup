            body: >-
              最有支撑的资本基准仍是 2021 年 12 月由 EQT Growth 领投的 Series E。Mambu 自有公告、Business Wire、TechCrunch、FT Partners
              以及后续报道相互印证：公司融资 €235 million，约 $266 million，投后估值约 €4.9 billion / $5.5 billion。公开报道还列出了该轮周边的持续投资者：EQT
              Growth 领投，TCV、Tiger Global、Bessemer、Runa、Acton 和 Arena 跟投，Carolina Brochado 获得董事席位。同一组 2021
              年证据也是最后一次官方员工数披露，人数为 800 人。当前规模方向上积极，但数字杂乱。官方 2023 年材料称客户 280 多家、终端用户 120 million；2024 年末和 2026 年初材料称超过 65
              个国家的 260 多家客户；Google Cloud 案例研究称超过 250 家客户和 80 million 名终端用户；GetLatka 在 2025 年末画像中引入低置信度的收入、累计融资、员工数，甚至
              CEO 和客户数，无法与官方叙事完全对齐。结果是一边有强平台验证信号，一边经济透明度很弱。
