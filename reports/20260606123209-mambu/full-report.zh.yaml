  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模口径
        blocks:
          - type: paragraph
            body: >-
              不能用一个未区分的 TAM 来分析
              Mambu。公司当前定位和合作伙伴材料指向的是云原生、可组合的核心银行平台，而不是整个银行软件和服务宇宙。因此，广义核心银行软件市场只能作为外围背景。更近的竞争类别，是买方拿来与存量核心、专业供应商和混合共存架构比较的云端
              / 可组合核心平台。更直接的预算切口还要更窄：替换、掏空或逐步重构遗留核心及相关处理栈的现代化项目。


              公开市场估算保留了这个边界问题，而不是解决它。Precedence 将 2025 年广义核心软件市场定为 USD 13.79 billion，The Business Research Company
              对同一年给出 USD 14.35 billion，Fortune Business Insights 则给出 USD 19.67 billion。2026 年已发布区间从 USD 10.41 billion 到
              USD 23.16 billion。Market.us 又把现代化项目口径收窄到 2025 年 USD 1.9 billion、2026 年 USD 2.4
              billion。正确结论不是把这些估算抹平成一个虚假的精确点，而是把广义、品类和支出楔子三种口径分开。


              地理上，证据即便方法不同，方向也基本一致。在已审阅公开来源中，北美是当前最大支出池；同时，可组合与即时支付叙事继续在受监管市场推高现代化紧迫感。用于后续估值时，Mambu
              的市场应被框定为一个带明确边界逻辑的区间，而不是单一头条 TAM。
