      - number: '7.3'
        title: 合作伙伴和云依赖是战略助推器，也会带来集中度和传导风险
        blocks:
          - type: paragraph
            body: >-
              Mambu 最强的战略论点是，可组合性让客户组合最佳供应商，而不是接受单体技术栈。这个设计选择本身也带来必须明确承保的依赖风险。公开来源显示，Mambu 借助超大规模云厂商获得部署灵活性，借助 Google
              Cloud 获得互操作性和市场入口，借助 Form3
              获得预集成支付基础设施，并借助托管或保障合作伙伴给受监管交易提供连续性安慰。每一项依赖单独看都合理；合在一起，则形成多层第三方链条，银行客户仍必须绘制、监控并解释。Form3 自己的营销很有说明性：它强调横跨
              AWS、Azure 和 GCP 的韧性，并把架构明确连到云集中度和数据主权担忧。这是缓释项，但也说明这些担忧已经足够核心，足以进入销售话术。主要剩余风险不是 Mambu
              没有替代方案；而是投资人还看不到按超大规模云厂商、支付伙伴、地区或主要客户项目拆分的实际生产集中度。在这张图私下披露前，应把公司视为理论上运营多元、实践中尚未验证。
