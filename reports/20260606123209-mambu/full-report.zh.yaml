            body: >-
              公开牵引指标支持一个判断：Mambu 已不再处于早期产品市场匹配阶段。Series E 前后，多方来源聚合到 200 多家客户、约 50-53 million 名终端用户、覆盖 65 个国家、2021 年新增客户
              40 多家，以及 2021 年 Q3 同比增长超过 120%。当前官方材料把这些规模声称大幅推高：超过 260 家客户、65 多个国家、超过 230 million 名终端用户、每天超过 500 million
              次 API 调用，以及 2025 年处理支付量增长七倍。这些信号支持一个有真实吞吐、持续相关性的业务。但当前集团仍没有来自一手来源的公开收入桥。市场转而依赖二级数据库和预览。GetLatka 发布 2024
              年收入估算，PitchBook 和 PM Insights 提及收入主题但不发布当前公开数字，Sacra 则明确声明信息不完整。因此，Mambu 的增长故事方向上可信，但当前收入、ARR
              和估值估算都应归入「三角测算，而非直接相信」的桶。
