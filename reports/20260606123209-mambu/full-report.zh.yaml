  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: standard
    summary: Mambu 客户旅程通常从受监管买家的问题出发，进入快速实施叙事，上线后再寻找相邻工作负载扩张。
    data:
      items:
        - id: need
          label: 买方需求
          detail: 银行、贷款机构或 fintech 买家通常从核心现代化、更快贷款工作流、嵌入式金融或支付迁移开始。
          touchpoints:
            - 核心替换
            - 新数字化方案
            - 嵌入式金融
            - 支付现代化
        - id: selection
          label: 选择 / 背书
          detail: 采购往往包含生态或赞助方影响，尤其是在涉及银行伙伴、现有母公司或集团生态时。
          touchpoints:
            - ABN AMRO / BUUT
            - BPCE / Spendesk
            - JG Summit / GoTyme
        - id: implementation
          label: 实施
          detail: 公开验证反复强调更快上市，案例按范围不同分别为 2、7、10 和 12 个月。
          touchpoints:
            - Ualá 2 个月
            - Bank Jago 7 个月
            - New10 10 个月
            - BUUT 12 个月
        - id: go-live
          label: 上线和使用
          detail: 上线之后，公开验证转向获客、交易规模、贷款吞吐和运营效率，而不是 Mambu 内部的席位或用户数。
          touchpoints:
            - GoTyme 100k / 月
            - N26 月交易
            - Renmoney 贷款量
            - Western Union 支付
        - id: expand
          label: 扩张 / 深化
          detail: 最强的扩张验证显示相邻工作负载或品牌复用，但公开来源没有披露续约曲线或集中度经济性。
          touchpoints:
            - New10 -> BUUT
            - 数字银行 -> 支付
            - Tyme -> GoTyme
            - NRR / 集中度缺失
