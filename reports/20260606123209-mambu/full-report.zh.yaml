            body: >-
              公开资料里，Mambu 经济性的最佳代理不是明确利润率披露，而是客户和合作伙伴如何描述实施。Form3 合作伙伴页面强调，机构可通过与 Mambu 的预集成，避免自行建设支付基础设施。Allica Bank
              案例研究描述了如何用 Mambu 的贷款账本和可组合架构，快速迁移一组复杂的收购型中小企业贷款组合。FinTech Futures 报道 BridgeFund
              用六个月上线存款业务，并借助平台扩大规模和地域。这些都是有用证明点，因为它们显示产品解决了重要且运营上困难的问题，一旦买方决策落地就能快速上线。但它们也暗示销售动作需要专家协助、集成很重，并且支持成本可能很高。已审阅来源没有披露
              CAC、回本期、NRR 或当前毛利率。Craft 提供过旧的 FY2020 利润率快照，但它太陈旧且来自数据库，不足以填补缺口。因此，公开单位经济性读法是：Mambu
