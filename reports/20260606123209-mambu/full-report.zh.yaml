  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 主要传导路径从外包审查和迁移复杂度出发，进入销售放慢、客户验证变弱和估值压力。
    data:
      nodes:
        - id: ctp
          label: CTP / 外包审查
          detail: DORA、FCA 和 BoE 规则提高第三方银行核心供应商的尽调负担。
        - id: cloud
          label: 云集中度不确定性
          detail: 公开验证尚未展示各产品和客户细分中的真实超大规模云厂商分布或退出准备度。
        - id: migration
          label: 大型银行迁移复杂度
          detail: Swisscom 和 Mambu 的报告都暗示，企业交付可能成本高、重度依赖 SI。
        - id: payments
          label: 支付伙伴依赖
          detail: Form3 扩展能力，但也新增一层关键任务运营依赖。
        - id: controls
          label: 控制叙事
          detail: ISO、SOC、托管和灾难恢复（DR）主张有意义，但仍需要私下证据包。
        - id: sales
          label: 销售周期拉长
          detail: 更多尽调和更多依赖会拖慢企业转化。
        - id: references
          label: 参考客户验证缺口
          detail: 具名赢单存在，但覆盖广度和集中度仍不清楚。
        - id: economics
          label: 经济性不透明
          detail: 公开收入和估值标记仍是估计值或已陈旧。
        - id: valuation
          label: 估值压缩风险
          detail: 验证薄弱叠加披露陈旧，可能迫使估值相对 2021 年标记打折。
      edges:
        - from: ctp
          to: sales
          label: 抬高尽调负担
        - from: cloud
          to: sales
          label: 增加集中度问题
        - from: migration
          to: references
          label: 可能拖慢标杆案例落地
        - from: payments
          to: references
          label: 让客户证明多一层伙伴依赖
        - from: controls
          to: sales
          label: 有帮助，但单靠它过不了尽调
        - from: sales
          to: economics
          label: 周期拉长会挤压转化和利润率
        - from: references
          to: economics
          label: 证据薄，耐久性论据就弱
        - from: economics
          to: valuation
          label: 削弱旧估值支撑
        - from: cloud
          to: valuation
          label: 加重下行情景权重
    claimRefs:
      - CR024
      - CR035
      - CR041
      - CR046
      - CR047
      - CR055
      - CR056
      - CR060
      - CR061
      - CR064
