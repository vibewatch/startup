      - number: '3.4'
        title: 护城河耐久性与被替代风险
        blocks:
          - type: paragraph
            body: >-
              Mambu 的护城河看起来真实，但比不加批判的 SaaS 增长解读更窄。买方想要宽口径可组合平台、快速上市，以及现代支付或相邻产品扩张，同时又不想被锁进遗留套件路线图时，Mambu
              似乎最强。相对大型存量供应商，这是有意义的优势；后者最强的公开证据仍集中在广度、区域化和可信交付。Mambu 2025 年支付推进也改善了其故事，使平台看起来不再只是纯贷款或存款供应商，而是更完整。


              风险在于，竞争对手会从两个方向挤压 Mambu。Thought Machine 声称产品逻辑更可编程，Tuum
              声称模块化交付摩擦更低，存量供应商则披露更多规模、更强合作伙伴杠杆和更高企业采购舒适度。同时，公开证据对价格、赢单率和 Tier 1 选型比拼披露很少，因此很难证明 Mambu
              的架构能转化为可重复的经济胜利。对后续财务和估值工作来说，正确结论是：Mambu 的护城河取决于它能否比存量套件更新自身话术更快、比相邻替代方案缩小替换范围更快，把有吸引力的产品叙事变成耐久的实施证明。
