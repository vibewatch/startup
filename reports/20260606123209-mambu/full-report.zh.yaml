      - CV055
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 当前 ARR 或收入显著高于公开代理指标，支付势头延续，尽调显示软件式毛利率、留存和干净条款。
        - 当前公允价值区间 $2.4B-$3.6B；仍低于 2021 年峰值，但支撑优质私募软件视角。
        - 任何服务收入占比高、集中度高或结构化股权结构迹象，都会快速击穿该情景。
        - 需要干净的数据室，并明确证明公开代理指标显著低估当前经济性。
      - - 基准
        - Mambu 仍具战略优势和商业价值，但公开披露仍不完整，也没有共享当前价格发现。
        - $1.3B-$2.1B 区间；公司应相对较弱金融科技公司获得溢价，但不应拿陈旧的 2021 年标记。
        - 再次融资需求、留存偏软或利润率偏弱，都会压住该情景重估。
        - 最符合现存公开记录。
      - - 悲观
        - 公开收入代理指标方向正确，可比公司纪律主导判断，任何刷新后的定价或条款都低于预期。
        - $0.7B-$1.2B 区间；新股或老股折价大概率会把公允价值推入该区间。
        - 降估值融资动态、优先权悬置和执行意外会相互放大。
        - 如果关键经济性和条款文件继续关闭，悲观情景概率会上升。
    notes: 情景区间是承销判断，不是 DCF；区间有意拉宽，因为核心经济性输入仍属私密。
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
      - CV046
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值状态
      - 相关性
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the valuation anchors actually used in this chapter: the stale Mambu mark, four public software
        read-throughs, and one private cloud-core peer. It is not a full map of every banking-software vendor.
    rows:
      - - Mambu（最后披露的 2021 年估值标记）
        - $5.5B 头条估值，对应公开 2024 年收入代理指标 $128.6M 和 $145M
        - 按 GetLatka 约 ~42.8x，按 Tracxn 法律实体收入标记约 ~37.9x
        - 直接的标的公司锚点，用来衡量旧价格如今高出可观察公开可比公司多少
        - 没有当前重估；公开收入数字是数据库代理指标，不是经审计合并 ARR。
      - - Temenos
        - $6.06B 市值，对应 $1.08B TTM 收入和 $859.9M ARR
        - 市值 / 收入约 ~5.6x，市值 / ARR 约 ~7.0x
        - 有规模、装机基础和强披露的存量厂商上限可比
        - 比 Mambu 大得多，也成熟得多。
      - - nCino
        - $1.86B 企业价值，对应 $610.06M TTM 收入
        - 约 ~3.05x EV / 销售额
        - 云银行软件可比公司，披露利润率且聚焦金融机构
        - 贷款和工作流组合并非直接的核心银行类比。
      - - Guidewire
        - $11.56B 市值，对应 $1.421B TTM 收入
        - 市值 / 收入约 ~8.1x
        - 高质量、任务关键型金融软件的边界标记
        - 保险软件不是直接的银行核心同业；本行使用市值而非 EV。
      - - Clearwater Analytics
        - $7.27B 市值，对应 $825.73M TTM 收入
        - 市值 / 收入约 ~8.8x
        - 另一个高质量金融软件基准，显示强披露能支撑什么估值
        - 投资会计软件是相邻领域，不是核心银行同业；本行同样使用市值。
      - - Thought Machine
        - 2022 年披露估值 $2.7B，加上 2025 年 £45M 内部轮，但没有公开重估
        - 战略性私募同业锚点，但当前估值支撑不透明
        - 最接近的私募云核心可比，可映射市场定位和投资者预期
        - 当前估值仍未披露，因此它更像谨慎的私募同业镜头，而不是干净的倍数锚点。
    notes: 有意混用指标视角，因为每个可比公司的公开 EV 数据并非同样易得；目标是划定边界，而不是制造虚假精确。
