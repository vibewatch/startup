  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 Mambu 的相关性
    rows:
      - - 广义核心银行软件
        - 银行和金融机构用于运行存款、贷款、产品处理和账户运营的核心系统及相关软件 / 服务
        - 外围银行 IT、通用 CRM、无关合规工具和非核心金融科技前端
        - 银行和金融机构，通过企业 IT 和转型预算购买
        - 可作为外层 TAM 背景，但过宽，不能直接用于份额假设
      - - 云 / 可组合核心银行平台
        - 云原生账本、产品引擎、API 编排和模块化核心处理层
        - 所有没有改善核心技术栈或产品引擎的传统银行服务支出
        - 银行、新银行、金融科技公司、贷款机构和嵌入式金融运营商
        - 最接近 Mambu 产品组合的竞争品类视角
      - - 核心银行现代化项目
        - 替换、掏空或渐进式重构传统核心及相邻处理技术栈的项目预算
        - 与迁移或架构变更无关的稳态支出
        - 转型发起人、CIO/COO 办公室和业务线现代化项目
        - 最适合判断采用时点的近期支出切入口
      - - 实时支付 / ISO 20022 叠加
        - 支持全天候处理所需的即时支付、ISO 20022 准备、清结算现代化和架构工作
        - 没有平台或处理变更的纯网络费用
        - 支付负责人、运营团队和监管变化预算
        - 重要，因为支付紧迫性可以为核心架构决策提供预算
      - - 维持现状替代方案
        - 现有核心升级、混合共存、重中间件架构、内部自建和分阶段组件替换
        - 忽视银行实际现代化方式的纯绿地叙事
        - 希望在保留现有基础设施的同时降低风险的银行
        - 关键，因为买方常把 Mambu 与局部修补方案比较，而不只看直接同业
    notes: 本章使用明确的市场边界逻辑：广义软件作为外层背景，可组合 / 云核心作为品类背景，现代化项目作为近期预算切入口。
