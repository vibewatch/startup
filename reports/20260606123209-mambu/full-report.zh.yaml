              million，说明即便累计融资额仍是估算级，而非公司披露。2024 年 12 月收购 Numeral，以及 2026 年 2 月支付枢纽扩张，表明 Mambu
              继续投入增长并拓宽变现空间。公开记录仍没有显示的是支撑该战略的当前资产负债表缓冲。本次审阅中唯一可本地访问的申报证据，是英国 Mambu Tech
              实体；它暴露了小公司账目时间安排，但没有披露合并集团现金、债务、收入组合或收购价格经济性。已审阅来源没有披露当前现金、烧钱速度、资金续航或下一轮融资触发条件。因此，融资依赖尚未解决，而不是已经被证伪。
