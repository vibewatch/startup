  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: tier1-bakeoffs
      missingEvidence: Named win-loss data or customer selection memos showing which vendors prevail in Tier 1 core replacement bake-offs.
      whyItMatters: Without named competitive outcomes, public evidence can compare positioning but cannot prove share gains or win-rate leadership.
      diligencePath: Request anonymized pipeline conversion data, reference call notes, and named displacement stories by region and bank tier.
      relatedQuestionRefs:
        - QP022
    - type: private-evidence-only
      severity: material
      topic: vendor-pricing
      missingEvidence: Signed proposals or detailed module-level pricing schedules for Mambu, Thought Machine, Temenos, Oracle, Tuum, and nCino.
      whyItMatters: Public sources show opacity, but they do not reveal the all-in economics that determine whether Mambu truly wins on cost or only on architecture.
      diligencePath: Collect live RFP submissions and implementation SOWs covering software, services, migration, and infrastructure across at least three buyer segments.
      relatedQuestionRefs:
        - QP023
      relatedTableRefs:
        - TP003
    - type: missing-source
      severity: material
      topic: competitive-win-rate
      missingEvidence: Independent datasets on Mambu win rates, losses to incumbents, and losses to adjacent substitutes such as nCino or internal build.
      whyItMatters: The chapter can describe competitive pressure, but not quantify whether Mambu is taking share or merely participating in attractive evaluations.
      diligencePath: Ask management for competitive take-rate by segment and request customer references that explicitly compare Mambu with named alternatives.
      relatedQuestionRefs:
        - QP027
    - type: enumeration-incomplete
      severity: minor
      topic: substitute-frequency
      missingEvidence: Public evidence quantifying how often banks choose coexistence, workflow-layer upgrades, or internal build instead of a full core replacement.
      whyItMatters: Substitute breadth matters to durability and valuation, but the current source set is qualitative rather than frequency-based.
      diligencePath: Gather analyst surveys, procurement case studies, and implementation partner data on partial-modernization outcomes.
      relatedQuestionRefs:
        - QP017
        - QP018
      relatedTableRefs:
        - TP004
sections:
  - id: landscape
    title: Landscape and competitor classes
    body: |-
      Mambu does not face one clean competitor archetype. Its closest direct pressure comes from cloud-native or modular-core peers such as Thought Machine and Tuum, which also promise faster launches, API-led flexibility, and lower-disruption modernization. But those direct peers are only one layer of the market. A much larger incumbent-suite class — led by Temenos, Oracle FLEXCUBE, Infosys Finacle, TCS BaNCS, and Finastra — still matters because many banks buy for breadth, localization, implementation confidence, and partner capacity rather than for the most elegant architecture. Juniper’s leaderboard and SDK.finance’s 2026 vendor map both reinforce that the market is broad enough for banks to compare modern composable platforms and incumbent suites in the same buying motion.

      The substitute set is also wider than pure core replacements. nCino’s annual report makes clear that it sells process digitization, legacy consolidation, and banking-experience improvement, which means it can absorb transformation budget even when it is not the universal core. PeerSpot’s alternatives pages for both Mambu and Temenos reinforce that buyers actively look across multiple substitute paths. The practical result is that Mambu competes not only against other cores, but also against phased modernization, workflow-layer upgrades, and the decision to delay or narrow the scope of replacement.
