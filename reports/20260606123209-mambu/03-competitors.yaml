        - Traditional and neo banks, fintechs, EMIs, PSPs, and NBFIs
        - API-first modular core with progressive transformation story
        - Smaller brand depth and reference disclosure than Mambu or major incumbents.
      - - nCino
        - Adjacent modernization substitute
        - 2,700+ customers in 25+ countries
        - Banks, credit unions, mortgage banks, and large financial institutions
        - Workflow digitization, legacy consolidation, and process modernization
        - Not clearly a universal core replacement in every deal.
