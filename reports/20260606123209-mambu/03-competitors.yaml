  - id: TP005
    title: Moat durability / competitive risk register
    columns:
      - Moat claim / risk
      - Threat
      - Severity
      - Evidence
      - Mitigation / diligence ask
    rows:
      - - Broad composable SaaS scope
        - Incumbents now use similar composable and cloud-native language
        - High
        - Temenos, Finacle, Oracle, TCS, and Finastra all market modernized architectures
        - Test whether Mambu’s breadth wins real bake-offs or only narrative comparisons.
      - - Payments adjacency
        - Suite vendors already combine payments with broader enterprise portfolios and partner ecosystems
        - Medium
        - Temenos Payments and Oracle banking overview point to stronger portfolio breadth
        - Measure whether Mambu Payments drives distinct wins or only improves checklist completeness.
      - - Speed and low disruption
        - Tuum and incumbents also market low-risk, progressive transformation
        - High
        - Tuum says it never failed an implementation; Temenos and Finastra promote paced modernization
        - Compare time-to-value and migration risk in actual implementations.
      - - Trust and installed-base gap
        - Incumbents disclose larger reach and customer scale than Mambu does publicly
        - High
        - Temenos, TCS, Finacle, and nCino publish stronger scale signals
        - Request customer reference depth by region and bank tier.
      - - Price opacity
        - Thin public price evidence hides discounting and total implementation cost
        - Medium
        - TrustRadius and SDK.finance show opacity rather than transparent benchmarks
        - Review proposals and implementation SOWs across at least three buyer segments.
      - - Substitute breadth
        - Workflow layers, coexistence, and internal build can narrow replacement scope
        - High
        - nCino and partial-modernization narratives broaden the alternative set
        - Quantify how often Mambu loses to scope reduction instead of vendor displacement.
    notes: Competitive durability depends on implementation proof, trust, and economics as much as on architecture.
