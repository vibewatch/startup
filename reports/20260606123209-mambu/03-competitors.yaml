  - id: TP004
    title: Switching cost, distribution, and substitute map
    columns:
      - Pressure source
      - How it competes with Mambu
      - Evidence from retained sources
      - Implication for Mambu
      - Diligence ask
    rows:
      - - Incumbent coexistence path
        - Lets banks modernize around legacy cores instead of replacing everything at once
        - Temenos and Finastra explicitly market paced or stepwise modernization
        - Mambu can lose to narrower transformation scopes even when product quality is strong
        - Ask which deals narrowed from full-core replacement to phased coexistence.
      - - Partner-led suite delivery
        - Large vendors combine software with broad implementation ecosystems and services capacity
        - Temenos, Oracle, and TCS all emphasize partners, ecosystems, or scale
        - Delivery confidence can outweigh architectural elegance in large-bank deals
        - Request partner-sourced pipeline and region-level implementation depth.
      - - Direct cloud-native peer
        - Thought Machine competes on smart contracts and product manufacturing
        - Vault Core and Vault Payments extend a unified direct peer story
        - Mambu must defend breadth against a stronger programmability narrative
        - Test where Mambu wins despite weaker programmable-product rhetoric.
      - - Progressive transformation challenger
        - Tuum competes with modular low-disruption claims and strong implementation posture
        - Tuum markets API-first modernization, never-failed implementation, and performance metrics
        - Mambu is pressured from below by a more explicitly progressive-migration story
        - Compare deployment speed and migration complexity in shared deals.
      - - Adjacent workflow layer
        - nCino can absorb budget for digitization and legacy consolidation without being the universal core
        - nCino filings emphasize process digitization and legacy-system consolidation
        - Mambu does not only lose to other cores; it can lose to narrower modernization software
        - Ask whether Mambu competes directly with nCino or only alongside it in mixed stacks.
      - - Internal build / abstraction layer
        - Buyers may reduce project scope to APIs, overlays, or internal orchestration instead of core replacement
        - Coexistence and microservices narratives make partial replacement plausible
        - The real substitute set is broader than named vendor rivals
        - Request architecture diagrams and scope changes for lost or delayed deals.
    notes: Substitute pressure includes partial modernization and workflow-layer upgrades, not only named core-vendor displacement.
