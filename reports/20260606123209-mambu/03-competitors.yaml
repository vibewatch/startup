callouts:
  - calloutType: strength
    title: Mambu wins where buyers want breadth inside a modern composable SaaS stack
    body: Mambu’s public case is strongest when a bank wants one modern platform that spans core, payments, and adjacent banking products without defaulting to a large incumbent suite.
    claimRefs:
      - CP002
      - CP003
      - CP042
  - calloutType: risk
    title: The real substitute set is wider than direct core peers
    body: Mambu is pressured not only by Thought Machine and Tuum, but also by incumbent coexistence paths and adjacent workflow-layer platforms such as nCino.
    claimRefs:
      - CP038
      - CP040
      - CP048
  - calloutType: risk
    title: Public price evidence is too thin to prove economic superiority
    body: The retained source set shows opacity and sparse reviews, so competitive diligence must rely on live proposals and implementation evidence rather than public price pages.
