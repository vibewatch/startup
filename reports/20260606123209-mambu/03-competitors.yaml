  - id: distribution-and-substitutes
    title: Distribution power, switching costs, and substitutes
    body: |-
      Mambu’s competitive challenge is as much about distribution power and switching costs as about feature coverage. Temenos markets banks of every size modernizing at their own pace, Finastra explicitly advocates replacing the core stepwise, and TCS pairs software with the balance-sheet credibility and services reach of a global systems integrator. Oracle adds broad partner-ecosystem connectivity, while Finacle and TCS each publish large geographic or institutional footprints. Those signals matter because banks often choose the vendor and migration path they believe they can implement safely, not the one with the cleanest architectural story.

      This is where substitute breadth becomes strategically important. Thought Machine and Tuum are direct peers, but Mambu can also lose to narrower transformation paths: coexistence around an incumbent core, workflow-led digitization via platforms such as nCino, or partial internal build. nCino’s filings position it as a legacy-consolidation and process-digitization platform, which makes it adjacent rather than identical, yet still relevant to budget allocation. For underwriting, that means Mambu’s opportunity is bounded not only by rival core vendors but by the willingness of banks to undertake a full-scope replacement at all.
