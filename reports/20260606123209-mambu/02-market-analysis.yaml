    {
      "id": "constraints-and-implications",
      "title": "Constraints, contradictions, and implications for Mambu",
      "body": "The same evidence that makes the market attractive also explains why adoption stays hard. PwC highlights that resilience spending alone can absorb meaningful capital, while Accenture and Swisscom describe hybrid-core and iterative-refactoring patterns that exist precisely because banks cannot always stomach a big-bang replacement. Google Cloud’s Mambu materials then make clear that flexibility, data residency, availability, and vendor-choice concerns are not secondary issues; they are central to whether buyers trust a cloud-core migration at all.\n\nThis is why pricing transparency and clean SAM/SOM math remain unresolved. The public record is rich enough to show that the category is real, growing, and strategically important, but not rich enough to convert that conclusion into one defensible near-term market-share denominator. No retained source here discloses representative contracts, services attachment rates, or an up-to-date customer mix by segment and geography.\n\nThe bottom line for later chapters is clear. Mambu participates in a meaningful market, but the practical ceiling is governed less by abstract TAM and more by migration complexity, delivery confidence, partner reach, and whether the company can keep winning the segments that value composability over incremental legacy upgrades. That is why the market chapter should preserve contradictory estimates and explicit evidence gaps instead of overstating certainty.",
