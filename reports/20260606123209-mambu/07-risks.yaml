- calloutType: assumption
  title: Treat multi-cloud as mitigation, not proof of low concentration
  body: Marketing across AWS, Google Cloud, and Azure is directionally positive, but investors still need a production workload map before concluding that hyperscaler dependency is genuinely diversified.
  claimRefs:
