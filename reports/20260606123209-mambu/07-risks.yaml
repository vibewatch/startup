- calloutType: risk
  title: The main mismatch is not product quality but proof quality
  body: Mambu has more visible controls than many private fintech infrastructure companies, yet the public record still does not show enough on concentration, renewal, or current group economics to underwrite the 2021 valuation comfortably.
