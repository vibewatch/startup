chapter:
  number: 7
  title: Risks
  summary: Mambu's risk profile is credible but not low. Public sources show real mitigations—ISO/SOC controls, audit-right commitments, multi-cloud deployment options, escrow-based continuity assurance, and some strong customer proof—but the highest residual risks are still third-party oversight, SI-heavy large-bank implementations, and stale financial disclosure anchored to the 2021 valuation rather than current audited group economics. The right investment stance is therefore to treat Mambu as a real, scaled banking-infrastructure asset whose next value step depends less on product legitimacy and more on proving concentration, execution quality, and current financial durability under the tougher 2026 outsourcing regime.
