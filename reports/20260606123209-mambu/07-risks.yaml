  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customer-concentration-and-retention
    missingEvidence: Current customer concentration, renewal cohorts, NRR, gross retention, and top-customer revenue share by segment.
    whyItMatters: Without retention and concentration evidence, investors cannot tell whether Mambu's enterprise proof is diversified and durable or still concentrated in a small number of lighthouse customers.
    diligencePath: Request the board pack or investor KPI deck showing renewal rates, top-10 ARR concentration, expansion ARR, and churn by cohort.
    relatedQuestionRefs:
    - QR025
    - QR030
    relatedTableRefs:
    - TR005
  - type: private-evidence-only
    severity: material
    topic: TR001-regulatory-coverage-gap
    missingEvidence: A current customer-facing pack covering DORA register support, UK material-third-party reporting support, privacy/DPA disclosures, and regulator-audit workflow details.
    whyItMatters: The regulatory / legal risk register is intentionally partial because public evidence shows the categories of risk but not the vendor pack that customers now need to satisfy outsourcing, incident, and exit reviews.
    diligencePath: Request the current regulatory diligence pack, DPA, audit-right process, incident-notification workflow, and customer FAQ for DORA and UK third-party reporting.
    relatedQuestionRefs:
    - QR011
    - QR012
    - QR013
    - QR014
    - QR030
    relatedTableRefs:
