- id: operational-security-and-migration
  title: Operational and security risk are moderated by visible controls, but migration execution remains the hard part
  body: 'Mambu has more public control evidence than many private fintech infrastructure companies. The company publishes ISO and SOC claims, references external pentests, says it keeps 24/7 on-call staff, and describes business-continuity testing, point-in-time recovery, and historical AWS failover architecture. Those are real mitigants, not marketing fluff. They also explain why Mambu has remained credible with regulated customers. The residual problem is that a banking core is not underwritten on control narrative alone. Mambu''s own reports repeatedly warn that core migration can derail, and they explicitly argue against big-bang replacement in favor of phased change. Swisscom sharpens that into a more investable risk statement: small-bank migrations may be manageable, but larger-bank programs need system integrators and add cost. Google Cloud and Allica show that rapid deployment is possible, yet those references do not erase enterprise execution risk; they simply prove the platform
    can work when the delivery context is favorable. For investors, the operating question is whether Mambu''s evergreen release model and composable architecture reduce change risk enough to offset the coordination burden of large-bank migration and post-go-live support.'
