  - type: private-evidence-only
    severity: material
    topic: cloud-and-supply-chain-concentration
    missingEvidence: A current map of production workloads, hyperscaler split, major subcontractors, and tested exit procedures by product and customer segment.
    whyItMatters: Mambu markets both AWS-linked controls and multi-cloud flexibility, but outside investors still cannot see whether revenue or operational load is concentrated on a narrow subset of providers.
    diligencePath: Request the current cloud architecture pack, subprocessor list, concentration thresholds, and the last two exit or failover test reports.
