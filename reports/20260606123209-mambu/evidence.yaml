evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: total-raised
    missingEvidence: A current cap-table or financing ledger that reconciles official 2021 round amounts with later database totals.
    whyItMatters: >-
      The headline “total raised” figure changes depending on whether only official financing is counted or whether
      later databases include older seed and intermediate rounds.
    diligencePath: >-
      Ask management for a financing chronology, cap table summary, and investor-by-round schedule that bridges official
      announcements to current totals.
    relatedQuestionRefs:
      - QO013
      - QO025
    relatedTableRefs:
      - TO001
  - type: stale
    severity: material
    topic: headcount
