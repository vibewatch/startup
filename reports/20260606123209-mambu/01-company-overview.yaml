  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: total-raised
    missingEvidence: A current cap-table or financing ledger that reconciles official 2021 round amounts with later database totals.
    whyItMatters: The headline “total raised” figure changes depending on whether only official financing is counted or whether later databases include older seed and intermediate rounds.
    diligencePath: Ask management for a financing chronology, cap table summary, and investor-by-round schedule that bridges official announcements to current totals.
    relatedQuestionRefs:
    - QO013
    - QO025
    relatedTableRefs:
    - TO001
  - type: stale
    severity: material
    topic: headcount
    missingEvidence: An official 2025 or 2026 employee count or payroll-backed headcount snapshot.
    whyItMatters: Current operating leverage and go-to-market capacity are hard to judge when the official headcount point is still 2021 while third-party estimates differ.
    diligencePath: Request current FTE count by function and region, plus a bridge from the last public staffing disclosure.
    relatedQuestionRefs:
    - QO014
    - QO025
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: governance-rights
    missingEvidence: A full board roster, committee map, and investor-rights summary showing who actually controls or influences governance today.
    whyItMatters: The public evidence names a chair, a board seat for Carolina Brochado, and a handful of executives, but it does not reveal committee structure, observer rights, or investor vetoes.
    diligencePath: Request the latest board deck appendix, shareholder agreement summary, and board / observer list with appointing constituencies.
    relatedQuestionRefs:
    - QO008
    - QO024
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: material
    topic: numeral-acquisition
    missingEvidence: Purchase price, revenue contribution, integration milestones, and post-close payment-volume KPIs for Numeral.
    whyItMatters: The acquisition changes the platform narrative materially, but public sources do not quantify the economics or near-term integration success.
    diligencePath: Request acquisition board materials, integration KPI dashboards, and pipeline or revenue attribution for the payments hub.
    relatedQuestionRefs:
    - QO019
    - QO024
    relatedTableRefs:
    - TO004
  - type: conflicting-data
    severity: minor
    topic: current-scale-metrics
    missingEvidence: A reconciled definition for customer count and end-user count across official, partner, and database sources.
    whyItMatters: Official materials move from 200 to 280 to 260-plus customers while third-party databases report 6,000 customers, making cover-metric interpretation sensitive to methodology.
    diligencePath: Ask management to define contracted customers, live customers, and end-user methodology, then bridge each public figure to the underlying definition.
    relatedQuestionRefs:
    - QO022
    - QO023
    - QO025
    relatedTableRefs:
    - TO001
sections:
- id: identity-and-platform
  title: Identity and platform positioning
  body: 'Mambu’s current public identity is that of a cloud-native banking infrastructure vendor rather than a single-product core vendor. The homepage now calls it the only composable, AI-ready platform with an intelligent core and explicitly frames deposits, lending, payments, Islamic banking, banking-as-a-service, and embedded finance as part of one configurable stack. The same surface also carries the current scale story: hundreds of innovators, more than 230 million end users, more than 500 million API calls per day, more than 450 partners, and active use across more than 65 countries. Historical identity is less cleanly disclosed. Official materials are clear that Amsterdam is the current head office, but the founding narrative remains best supported through secondary profiles that place the 2011 start in Berlin and attribute founding credit to Eugene Danilkis, Sofia Nunes, and Frederik Pfisterer. That means the company can be described confidently as Amsterdam-headquartered today,
    while the full founder trio should still be treated as a secondary-source-supported fact rather than an official cover-line disclosure.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO004
  - CO005
  - CO006
  - CO007
  - CO021
  - CO022
  - CO023
  figureRefs:
  - FO002
- id: leadership-and-governance
  title: Leadership and governance
  body: 'Leadership is no longer founder-led operationally. Public evidence shows Eugene Danilkis as co-founder and former CEO, but Finextra reported his immediate June 2023 resignation for personal reasons, after which Fernando Zandona moved from Chief Product and Technology Officer into the interim chief executive role. Mambu formally made that appointment permanent in August 2023 and located Zandona at the Amsterdam head office, while independent coverage from Open Banking Expo corroborated the transition timeline. The current leadership page also shows a more institutionalized bench than a pure founder story: Jesper Hybholt Sorensen is CFO, Semhal Tarekegn O’Gorman leads customer success, Mark Geneste leads revenue, and Ellie Heath leads people. Governance visibility is still incomplete, however. The public surface names Fritz Oidtmann as board chair and indicates that board members and advisors are intentionally surfaced, but it does not disclose committee structure, observer rights,
    or a complete investor-rights map. That leaves real key-person and control concentration only partially answered from public data.'
  claimRefs:
