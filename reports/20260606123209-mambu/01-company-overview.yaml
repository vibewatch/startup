- id: capital-and-scale
  title: Capital base and public scale
  body: 'The best-supported capital benchmark remains the December 2021 EQT Growth-led Series E. Across Mambu’s own announcement, Business Wire, TechCrunch, FT Partners, and follow-on coverage, the company raised €235 million, or about $266 million, at roughly a €4.9 billion / $5.5 billion post-money valuation. Public coverage also names the continuing investor set around that round: EQT Growth as lead, with TCV, Tiger Global, Bessemer, Runa, Acton, and Arena following on, while Carolina Brochado gained a board seat. The same 2021 evidence set is also the last official employee disclosure at 800 staff. Current scale is directionally positive but numerically messy. Official 2023 materials said 280-plus customers and 120 million end users; late-2024 and early-2026 materials say over 260 customers in over 65 countries; Google Cloud’s case study cites over 250 customers and 80 million end users; and GetLatka’s late-2025 profile introduces low-confidence revenue, total-raised, headcount, and
    even CEO/customer counts that do not fully reconcile with the official story. The result is a strong platform-validation signal paired with weak economic transparency.'
