- id: milestones-and-risk-signals
  title: Milestones and risk signals
  body: 'The public milestone story has shifted from “modern cloud core” toward a broader banking-and-payments platform. The pivotal change after the 2021 financing stack is the December 2024 acquisition of Numeral, which added a Paris-based payments technology asset processing more than €10 billion annually and brought relationships with major European banks and schemes. That strategic move is reinforced by Mambu’s February 2026 payments announcement, which said payment volume grew sevenfold year over year in 2025 and that the hub was expanding across EMEA, Latin America, and Asia Pacific with customers such as Western Union, BCB Group, Flowe, and Spendesk. Customer proof also remains meaningful: Good Money and Platcorp case studies show real deployment outcomes rather than generic logo slides, while Google Cloud frames Mambu as a practical route to faster launch cycles and lower IT running costs. The main public risk signal is not demand collapse but information quality: founder transition,
    undisclosed Numeral economics, and contradictory database-level metrics mean diligence should focus on governance rights, current economics, and how management defines “customer” today.'
