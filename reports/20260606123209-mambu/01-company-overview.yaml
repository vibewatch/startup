chapter:
  number: 1
  title: Company Overview
  summary: Mambu is an Amsterdam-headquartered cloud banking platform whose public story now combines a broad SaaS core-banking stack, a 2021 Series E valuation peak, a 2023 founder-to-operator CEO transition, and a 2024-2026 push into payments via the Numeral acquisition. Public evidence still shows strong customer and partner validation, but current economics, governance rights, and some headline scale metrics remain only partially disclosed or inconsistent across third-party databases.
