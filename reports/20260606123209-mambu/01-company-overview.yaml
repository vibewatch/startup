  - Evidence of importance
  - Control / economic relevance
  - Diligence ask
  rows:
  - - EQT Growth
    - Lead Series E investor
    - Led the last official round and placed Carolina Brochado on the board
    - Best-supported source of current valuation anchor and likely strongest capital influence in the public record.
    - Request current ownership, liquidation preference, and reserved-matter rights.
  - - Series E follow-on syndicate
    - 'Existing investor bloc: TCV, Tiger, Bessemer, Runa, Acton, Arena'
    - Repeated across TechCrunch, FT Partners, and investor coverage
    - Shows continuity from the prior financing stack and a potentially crowded private cap table.
    - Ask which investors still hold pro rata, board, or observer rights.
  - - Acton Capital / Fritz Oidtmann
    - Long-time investor with chair connection
    - Acton says it has backed Mambu since 2015; Fritz is board chair
    - Links one investor lineage directly to formal governance.
    - Clarify whether chairmanship reflects ownership, operating value-add, or both.
  - - Google Cloud
    - Strategic partner and delivery enabler
    - Case study ties Mambu to multi-cloud interoperability, faster launches, and access to new markets
    - Important for go-to-market credibility and deployment flexibility rather than direct control.
    - Quantify joint pipeline, mutual customers, and regional influence.
  - - Reference customers
    - Marquee proof set including Western Union, N26, BancoEstado, ABN AMRO, and others
    - Official 2021, 2024, and 2026 materials keep repeating named institutions
    - Provides commercial validation even without public contract economics.
    - Measure which references are live production accounts versus marketing logos.
  - - Numeral
    - Acquired payments asset
    - Adds >€10B annual processing and bank / scheme relationships to Mambu’s scope
    - Expands TAM from core banking into payments infrastructure, but economics remain private.
    - Request acquisition price, integration KPI targets, and payment-volume revenue contribution.
