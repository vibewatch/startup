  - CE042
  - CE045
- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control / assurance item
  - Status
  - Scope
  - Open gap
  rows:
  - - ISO 27001 and SOC 1 / SOC 2
    - Publicly named current assurance
    - Platform-wide security management system and independent auditor reports
    - Public materials do not expose report scopes, exceptions, or audit vintage in detail
  - - External penetration testing
    - Publicly named current control
    - Network and web-application testing against common vulnerabilities
    - No public remediation cadence or issue-severity disclosure is available
  - - 24/7 incident response and business continuity
    - Publicly named current control
    - On-call response, disaster recovery, and tested continuity procedures
    - There is no public incident-history dataset tied to the marketed uptime and availability claims
  - - Dedicated deployments and audit rights
    - Publicly named current option
    - Dedicated environments plus customer / regulator audit access
    - Public materials do not describe commercial terms or which customers choose dedicated isolation
  - - IP blocking and credential-abuse controls
    - Publicly named historical security enhancement
    - Auto-blocking after invalid-credential thresholds plus managed allow / block lists
    - Article-level proof exists, but broader identity-control telemetry is not public
  - - Payments compliance controls
    - Publicly named current capability set
    - VOP, approval workflows, audit trails, Swift tracking, screening and validation controls
    - Public evidence is strong on feature presence but weaker on regulatory exam outcomes or adoption depth
  notes: Trust evidence mixes persistent platform attestations with dated feature releases; missing items identify where underwriting would still require a private trust pack or customer references.
