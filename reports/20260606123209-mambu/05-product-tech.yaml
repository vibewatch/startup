- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Primary risk
  rows:
  - - Mambu UI and configuration layer
    - Administers products, customers, users, permissions, and operational workflows
    - Browser UI, tenant configuration, and governance settings
    - Weak role design or limited training can slow implementation and raise operational error risk
  - - Core engines and shared services
    - Execute lending, deposit, payments, and Islamic-banking logic on a shared platform foundation
    - Core services, ledger behavior, end-of-day processing, and internal configuration integrity
    - Public documentation is broad, but product-specific performance envelopes are not fully public
  - - API and event layer
    - Exposes v1/v2, Payments, Streaming, webhooks, OpenAPI specs, and integration controls
    - API keys, roles, permissions, tenant throughput controls, webhook delivery modes
    - Versioning, rate-limit, and eventing expectations still need customer diligence by workload
  - - Payments Hub control layer
    - Handles processing, liquidity views, reconciliations, approval flows, investigations, and dashboards
    - Payment files, status reports, audit trails, and rules engines
    - Operational complexity rises with multi-bank, multi-scheme environments despite hub abstraction
  - - Universal Gateway and scheme connectivity
    - Connects partner banks, Swift, SEPA rails, VOP, and other payment networks
    - Partner banks, scheme operators, homologation, regulatory deadlines, and bank-specific behavior
    - Coverage depth and go-live pace depend on continued bank-network expansion and certification work
  - - Cloud and reliability layer
    - Delivers multi-cloud deployment, HA, disaster recovery, security controls, and observability
    - AWS, Google Cloud, Azure, Kubernetes, monitoring, and incident-response processes
    - Independent public proof for uptime and failover claims is still thinner than the architectural narrative
  notes: This table synthesizes the public architecture into operating layers; it is not a reverse-engineered system diagram for any one customer deployment.
