- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow problem
  - Mambu solution
  - Public benefit signal
  - Current limitation
  rows:
  - - Launch a new deposit or current-account product
    - Legacy core changes are slow and expensive
    - Configure products through the platform, UI, and APIs on a shared cloud-native foundation
    - Official and review sources both tie Mambu to faster go-lives and easier product changes
    - Public evidence does not separate configuration speed by product family or complexity tier
  - - Run lending disbursements, collections, and repayments
    - Core and payments stacks often require handoffs across systems
    - June 2026 roadmap adds native lending-payments orchestration with pre-built workflows
    - Mambu now markets one coordinated flow for disbursements, collections, repayments, and restructures
    - Public evidence is roadmap-led rather than supported by independent customer case studies
  - - Process card authorization holds correctly
    - Card operations need compliant hold lifecycle handling
    - Cards API plus card-specific release work supports hold creation, adjustment, reversal, settlement, and custom expiry behavior
    - Public docs show direct endpoint-level support and a dated card-compliance enhancement
    - There is no public benchmark for card-scale transaction volumes or fraud-control outcomes
  - - Route domestic and cross-border payments
    - Fragmented schemes and partner-bank integrations slow expansion
    - Universal Gateway plus Payments Hub provide managed connectivity and orchestration across local and global rails
    - Official pages and 2025-2026 updates point to faster integrations, Swift connectivity, and expanded bank coverage
    - Public network breadth is still most specific in company materials rather than independent rail-by-rail audits
  - - Reconcile and investigate payment exceptions
    - Manual matching and exception workflows create delay and compliance risk
    - Mambu automates reconciliations, exposes audit trails, and adds dashboard-level tracking and simulator tooling
    - Official articles describe automated reconciliation, audit metadata, and developer-facing event tracking
    - Independent evidence on error-rate reduction or staffing impact is absent
  - - Deploy into regulated or data-residency-sensitive markets
    - Cloud and residency constraints often force redesigns
    - Multi-cloud deployment plus partner cloud programs support customer-specific environments
    - Google Cloud cites Kubernetes-based interoperability, data-residency support, and high-availability requirements
    - Public evidence is strongest for Google Cloud; equivalent AWS/Azure implementation detail is thinner
  notes: Benefit statements are grounded in public documentation, partner evidence, and implementation reviews; quantitative outcomes remain limited outside a few customer or partner anecdotes.
