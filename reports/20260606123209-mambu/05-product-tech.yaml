- id: payments-expansion-numeral-and-roadmap
  title: Payments expansion, Numeral integration, and roadmap
  body: 'The biggest product shift since the prior funding cycle is that payments is no longer a peripheral integration story. After acquiring Numeral in December 2024, Mambu repositioned payments as a native extension of the platform and then backed that story with an unusually dense stream of updates across 2025 and 2026. The public record now shows a two-part payments architecture built around a payments hub and a universal gateway, direct and indirect scheme connectivity, reconciliation tooling, approval workflows, audit trails, sandbox simulation, Swift Business Connect, and tighter lending or deposit orchestration. Product updates also show a cadence of concrete additions rather than only narrative positioning: SEPA batch-processing improvements, bank integrations such as ClearBank, Memo Bank, and Iberpay, VOP readiness and go-live signals, dashboard-level Swift tracking, and new lifecycle automation between core and payments. June 2026 adds the clearest forward-looking step with Intelligent
    Core and MCP, but that AI layer is still launch-stage from a public diligence perspective, whereas the payments stack has multiple dated releases and external corroboration.'
