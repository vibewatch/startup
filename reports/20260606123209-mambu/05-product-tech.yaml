- id: architecture-apis-and-deployment-model
  title: Architecture, APIs, and deployment model
  body: 'The public architecture story is unusually concrete for a private core-banking vendor. Mambu explicitly frames the platform as cloud-native, multi-cloud, configurable, and API-first; its user guide says customers work through the Mambu UI, APIs, and ecosystem surfaces, and the public API reference spans v1, v2, Payments, and Streaming APIs with downloadable OpenAPI specifications. The cards and repayments references show that the public API surface is not just brochureware: card authorization-hold flows, repayments, roles, and configuration are documented directly. Deployment evidence from Google Cloud adds a second layer of technical proof by describing Kubernetes-based interoperability, multi-cloud support, and customer environments that need strict SLA and data-residency outcomes. The architecture therefore looks like a layered control plane: configuration and UI at the top, core engines and shared services in the middle, API and eventing surfaces around them, and partner cloud
    and integration dependencies underneath. The residual concern is that public benchmark depth is still thinner than the breadth of the architectural claims.'
  claimRefs:
