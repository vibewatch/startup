tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary buyer or user
  - Current maturity / status
  - Differentiation signal
  - Diligence gap
  rows:
  - - Cloud banking core platform
    - Bank architecture, product, and operations teams
    - Current flagship platform
    - Composable, API-first core spanning lending, deposits, payments, and Islamic banking on one foundation
    - Public SKU packaging and attach rates across modules are not disclosed
  - - Lending engine
    - Retail, SME, and embedded-lending teams
    - Current and actively updated
    - Supports configurable repayment structures, arrears handling, mortgages, and lifecycle automation
    - Independent public proof of underwriting depth and collections performance is limited
  - - Deposits engine
    - Retail and business-banking teams
    - Current and actively updated
    - Supports current, savings, term-deposit, and transactional-account workflows on the same platform
    - Public product-by-product limit, pricing, and throughput detail remains thin
  - - Payments Hub
    - Payments operations and treasury teams
    - Current and scaling globally
    - Centralises payment processing, liquidity views, reconciliations, and investigations in one control layer
    - Independent benchmark evidence for availability, throughput, and incident history is limited
  - - Universal Gateway and VOP layer
    - Payments product and compliance teams
    - Current and expanding
    - One managed integration layer for schemes, partner banks, and Verification of Payee compliance
    - Exact coverage by market and customer segment still relies heavily on company materials
  - - Developer / admin surface
    - Engineering, DevOps, and implementation teams
    - Current
    - Public API reference, OpenAPI specs, webhooks, CasC, audit trails, and documented cards / repayments endpoints
    - Public examples are strong, but self-serve training depth is still questioned in review evidence
  - - Intelligent Core / MCP
    - Innovation and operations teams
    - New 2026 launch-stage capability
    - Promises native AI adapters, governance, and agent-ready workflow execution without custom middleware
    - No public customer deployment case study or quantified production outcome is yet visible
  notes: Rows summarize the module map visible in public product, documentation, and roadmap material; maturity reflects evidence depth, not a full private product audit.
