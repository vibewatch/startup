  evidenceGaps:
  - type: missing-source
    severity: material
    topic: independent-performance-benchmarks
    missingEvidence: Independent customer or auditor evidence validating 99.99% availability, 300-plus RPS, failover behavior, and the marketed 6x integration-speed claim for the current payments stack.
    whyItMatters: Official product metrics are central to underwriting implementation risk, but the current public set is mostly self-reported and not tied to named production benchmark packs.
    diligencePath: Request current SLA schedules, uptime history, incident postmortems, and customer-specific performance references for both core and payments environments.
    relatedQuestionRefs:
    - QE004
    - QE027
  - type: private-evidence-only
    severity: material
    topic: intelligent-core-adoption
    missingEvidence: Named customer deployments, control documentation, and measured business outcomes for the Intelligent Core, MCP adapter, and AI-powered Insights announced in June 2026.
    whyItMatters: The AI layer is strategically important to differentiation, but today it appears launch-led rather than proven in public production environments.
    diligencePath: Ask for live customer references, architecture reviews, MCP governance documentation, and any production usage metrics or case studies for the new AI layer.
    relatedQuestionRefs:
    - QE028
  - type: private-evidence-only
    severity: material
    topic: sku-and-pricing-clarity
    missingEvidence: Clear public SKU boundaries, pricing logic, and attachment assumptions for Payments Hub, Universal Gateway, VOP, and the newer Intelligent Core capabilities.
    whyItMatters: Without module-pricing clarity, it is difficult to judge expansion economics, product packaging complexity, or how much of the broader surface customers actually buy.
    diligencePath: Request current packaging decks, pricing schedules, and attach-rate data broken out by core, payments, and AI modules.
    relatedQuestionRefs:
    - QE029
