  name: Mambu
chapter:
  number: 5
  title: Product & Technology
  summary: Mambu now presents a broad, cloud-native banking platform that spans configurable core engines, a fast-expanding payments stack, and a growing AI control layer, with the strongest public evidence on composable architecture, payment-network expansion, and baseline security/compliance controls. The chapter’s main diligence positives are deployment flexibility, partner-enabled integration breadth, and concrete 2025-2026 product releases; the main open risks are thin independent proof for uptime and performance claims, limited public SKU clarity, and launch-stage evidence for the new Intelligent Core and MCP stack.
sections:
- id: product-definition-and-module-map
  title: Product definition in customer workflow terms
  body: 'Mambu’s product should be understood as a configurable operating layer for banks, lenders, and fintechs rather than a single monolithic core replacement. A customer team can configure deposit, lending, payments, or Islamic-banking products on one shared platform, manage those products through the browser UI and APIs, and extend the stack through ecosystem partners rather than waiting for vendor-coded releases. The workflow starts with product and account setup, moves through API-connected execution and servicing, and increasingly extends into payment orchestration, verification, reconciliation, and cross-border connectivity. Public documentation reinforces that Mambu wants to sell control and adaptability: the company repeatedly emphasizes composability, API-first configuration, and deployment across multiple clouds and partner environments. The practical takeaway is that Mambu’s product breadth now spans product manufacturing, servicing, payments control, and developer tooling,
    but the commercial packaging between core, payments, and newer AI layers is still less explicit publicly than the feature surface itself.'
  claimRefs:
