    rows:
      - - Broad core banking software
        - >-
          Core systems and related software/services used to run deposits, loans, product processing, and account
          operations across banks and FIs
        - Peripheral bank IT, generic CRM, unrelated compliance tools, and non-core fintech front ends
        - Banks and financial institutions through enterprise IT and transformation budgets
        - Useful outer TAM context but too broad for direct share assumptions
      - - Cloud/composable core banking platforms
        - Cloud-native ledgers, product engines, API-based orchestration, and modular core processing layers
        - All legacy-bank services spend that does not improve the core stack or product engine
        - Banks, neobanks, fintechs, lenders, and embedded-finance operators
        - Closest competitive category lens for Mambu’s product set
      - - Core banking modernization programs
        - >-
          Project budgets for replacing, hollowing out, or progressively refactoring legacy cores and adjacent
          processing stacks
        - Steady-state spend unrelated to migration or architecture change
        - Transformation sponsors, CIO/COO offices, and line-of-business modernization programs
        - Best near-term spend wedge for adoption timing
      - - Real-time payments / ISO 20022 overlay
        - >-
          Instant payments, ISO 20022 readiness, settlement modernization, and architecture work needed to support
          always-on processing
        - Pure network fees without platform or processing change
        - Payments leaders, operations teams, and regulatory-change budgets
        - Important because payments urgency can fund core architecture decisions
      - - Status-quo substitutes
        - >-
          Incumbent core upgrades, hybrid coexistence, middleware-heavy architectures, internal builds, and phased
          component replacement
        - Greenfield-only narratives that ignore how banks actually modernize
        - Banks trying to reduce risk while retaining existing infrastructure
        - Critical because buyers often compare Mambu against partial fixes, not only direct peers
