      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Leadership is no longer founder-led operationally. Public evidence shows Eugene Danilkis as co-founder and
              former CEO, but Finextra reported his immediate June 2023 resignation for personal reasons, after which
              Fernando Zandona moved from Chief Product and Technology Officer into the interim chief executive role.
              Mambu formally made that appointment permanent in August 2023 and located Zandona at the Amsterdam head
              office, while independent coverage from Open Banking Expo corroborated the transition timeline. The
              current leadership page also shows a more institutionalized bench than a pure founder story: Jesper
              Hybholt Sorensen is CFO, Semhal Tarekegn O’Gorman leads customer success, Mark Geneste leads revenue, and
              Ellie Heath leads people. Governance visibility is still incomplete, however. The public surface names
              Fritz Oidtmann as board chair and indicates that board members and advisors are intentionally surfaced,
              but it does not disclose committee structure, observer rights, or a complete investor-rights map. That
              leaves real key-person and control concentration only partially answered from public data.
