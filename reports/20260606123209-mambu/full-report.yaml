  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Mambu should not be analyzed against a single undifferentiated TAM. The company’s current positioning and
              partner materials point to a cloud-native, composable core banking platform rather than the entire
              universe of banking software and services. That means the broad core banking software market is useful
              only as outer context. The nearer competitive category is the cloud/composable core platform set that
              buyers evaluate against incumbent cores, specialist vendors, and hybrid coexistence architectures. The
              immediate budget wedge is even narrower: modernization programs that replace, hollow out, or progressively
              refactor legacy cores and related processing stacks.


              Public market estimates preserve that boundary problem rather than resolve it. Precedence puts the 2025
              broad core software market at USD 13.79 billion, The Business Research Company puts the same year at USD
              14.35 billion, and Fortune Business Insights puts it at USD 19.67 billion. For 2026 the published spread
              runs from USD 10.41 billion to USD 23.16 billion. Market.us then narrows the modernization-program lens to
              USD 1.9 billion in 2025 and USD 2.4 billion in 2026. The right conclusion is not to smooth those estimates
              into one false precision point; it is to keep the broad, category, and spend-wedge lenses separate.


              Geographically, the evidence is directionally aligned even when methodologies differ. North America is the
              largest current spend pool in the public sources reviewed, while the composable and instant-payments
              narrative keeps pushing modernization urgency across regulated markets. For later valuation work, Mambu’s
              market should therefore be framed as a range with explicit boundary logic rather than a single headline
              TAM.
