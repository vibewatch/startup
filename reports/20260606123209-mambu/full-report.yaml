        title: Capital adequacy and financing dependence
        blocks:
          - type: paragraph
            body: >-
              Capital history is substantially clearer than capital adequacy. December 2021 Series E is well
              corroborated across official, advisory, and news sources at roughly €235 million or $266 million and a
              roughly €4.9 billion or $5.5 billion valuation, with proceeds earmarked for innovation, geographic
              expansion, customer success, and hiring. Public databases further expose a multi-round chronology, but
              they disagree on lifetime funding totals by roughly $20 million, which shows that even aggregate capital
              raised is still estimate-grade rather than company-disclosed. The Numeral acquisition in December 2024 and
              the February 2026 payments-hub expansion show that Mambu has continued to invest in growth and broaden the
              monetization surface. What the public record still does not show is the current balance-sheet cushion
              behind that strategy. The only locally accessible filing evidence in this review is the UK Mambu Tech
              entity, which exposes small-company-account timing but not consolidated group cash, debt, revenue mix, or
              purchase-price economics. No reviewed source disclosed current cash on hand, burn, runway, or the
