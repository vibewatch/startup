    type: bar
    layout: wide
    summary: The fair-value midpoint is most sensitive to hidden revenue quality and any refreshed price discovery.
    approximationNotes: >-
      Bars are illustrative valuation deltas versus a notional $1.7B midpoint base case; they show directional impact
      rather than a model audit.
    data:
      items:
        - label: Audited ARR far above public proxies
          value: 0.9
          detail: Upside if the public database numbers materially understate current consolidated ARR or revenue.
          tone: positive
        - label: Strong gross margin and retention proof
          value: 0.6
          detail: Upside if diligence confirms software-like economics and sticky cohorts.
          tone: positive
        - label: Public comp discipline to ~3x-5x
          value: -0.6
          detail: Downside if investors lean toward the low end of today's observable comp range.
          tone: risk
        - label: Structured markdown or weak secondary signal
          value: -0.8
          detail: Downside if any refreshed price discovery shows the 2021 mark no longer holds.
          tone: risk
        - label: Services-heavy or concentrated model
          value: -0.5
          detail: Downside if implementation burden or concentration undermines premium-multiple assumptions.
