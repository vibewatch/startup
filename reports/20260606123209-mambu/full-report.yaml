            body: >-
              The softest part of the public record is not product quality; it is underwriteable business quality. Mambu
              still benefits from the halo of its 2021 Series E valuation, and current third-party databases continue to
              present revenue growth and headcount markers. But the public evidence is messy. GetLatka, PitchBook, and
              PM Insights do not give the market a single clean current view of revenue, workforce size, liquidity, or
              profitability, and the PM Insights surface is explicitly delayed and gated. Companies House provides
              useful legal-entity breadcrumbs, including recent director changes and small-company accounts, but not
              consolidated group economics. That matters because the adverse case against Mambu is not “bad company,
              good story”; it is “strong architecture, incomplete public economics, and enterprise execution that may be
              harder than the category narrative suggests.” The adverse SWOT source is low tier, but it is directionally
              consistent with the better sources: long sales cycles, SI dependence, and pricing power at the hyperscaler
