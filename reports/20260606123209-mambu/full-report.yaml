            body: >-
              The best public proxies for Mambu’s economics come from how customers and partners describe implementation
              rather than from any explicit margin disclosure. Form3’s partner page emphasizes that institutions can
              avoid building payments infrastructure themselves by using a pre-integration with Mambu. Allica Bank’s
              case study describes migrating a complex acquired SME loan portfolio at pace using Mambu’s loan ledger and
              composable architecture. FinTech Futures reports BridgeFund was online with deposits in six months and
              using the platform to expand volumes and geography. Those are useful proof points because they show the
              product solves material, operationally hard problems and can go live fast once a buying decision is made.
              But they also imply a sales motion that is expert-assisted, integration-heavy, and likely expensive to
              support. No reviewed source disclosed CAC, payback, NRR, or current gross margin. Craft offers an old
              FY2020 margin snapshot, but it is too stale and database-derived to clear the gap. The public
              unit-economics read-through is therefore that Mambu likely has meaningful recurring software value, but
              the balance between high-margin core revenue and lower-margin project effort remains hidden.
