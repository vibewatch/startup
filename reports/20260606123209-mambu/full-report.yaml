      The main transmission path runs from outsourcing scrutiny and migration complexity into slower sales, weaker
      customer proof, and valuation pressure.
    data:
      nodes:
        - id: ctp
          label: CTP / outsourcing scrutiny
          detail: DORA, FCA, and BoE rules raise the diligence burden on third-party banking-core vendors.
        - id: cloud
          label: Cloud concentration uncertainty
          detail: >-
            Public proof does not yet show the actual hyperscaler split or exit readiness by product and customer
            segment.
        - id: migration
          label: Large-bank migration complexity
          detail: Swisscom and Mambu reports both imply enterprise delivery can be costly and SI-heavy.
        - id: payments
          label: Payments-partner dependency
          detail: Form3 expands capability but adds another mission-critical operational layer.
        - id: controls
          label: Control narrative
          detail: ISO, SOC, escrow, and DR claims are meaningful but still need private evidence packs.
        - id: sales
          label: Sales-cycle elongation
          detail: More diligence and more dependencies can slow enterprise conversion.
        - id: references
