  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Current ARR or revenue is materially above public proxies, payments momentum sticks, and diligence shows
          software-like gross margin, retention, and clean terms.
        - >-
          $2.4B-$3.6B current fair-value range; still below the 2021 peak, but supportive of a premium private-software
          view.
        - Any sign of services-heavy revenue, concentration, or a structured cap table breaks this case quickly.
        - >-
          Requires a clean data room and explicit evidence that the public proxies materially understate current
          economics.
      - - Base
        - >-
          Mambu remains strategically strong and commercially relevant, but public disclosure stays incomplete and no
          current price discovery is shared.
        - $1.3B-$2.1B range; the company deserves a premium to weak fintechs, but not the stale 2021 mark.
        - Another financing need, soft retention, or weak margins keep this case from rerating.
        - Most consistent with the retained public record.
      - - Bear
        - >-
          Public revenue proxies are directionally right, comp discipline dominates, and any refreshed pricing or terms
          land below expectations.
        - $0.7B-$1.2B range; a new-money or secondary markdown would likely push fair value into this band.
        - Down-round dynamics, preference overhang, and execution surprises would compound each other.
        - Becomes more likely if the key economics and term files stay closed.
    notes: >-
      Scenario bands are underwriting judgments, not a DCF, and they are intentionally wide because the core economic
      inputs remain private.
    claimRefs:
      - CV041
      - CV042
      - CV043
      - CV044
      - CV045
      - CV046
  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable
      - Metric
      - Multiple / valuation status
      - Relevance
      - Limitation
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the valuation anchors actually used in this chapter: the stale Mambu mark, four public software
        read-throughs, and one private cloud-core peer. It is not a full map of every banking-software vendor.
    rows:
      - - Mambu (last disclosed 2021 mark)
        - $5.5B headline valuation against public 2024 revenue proxies of $128.6M and $145M
        - ~42.8x on GetLatka and ~37.9x on Tracxn's legal-entity revenue marker
        - Direct subject-company anchor for how far the old price now sits above observable public comps
        - No current re-mark, and the public revenue figures are database proxies rather than audited consolidated ARR.
      - - Temenos
        - $6.06B market cap against $1.08B TTM revenue and $859.9M ARR
        - ~5.6x market-cap-to-revenue and ~7.0x market-cap-to-ARR
        - Incumbent upper-bound comp with scale, installed base, and strong disclosure
        - Much larger and more mature than Mambu.
      - - nCino
        - $1.86B enterprise value against $610.06M TTM revenue
        - ~3.05x EV / sales
        - Cloud-banking-software comp with disclosed margins and financial-institution focus
        - Lending and workflow mix is not a direct core-banking analogue.
      - - Guidewire
        - $11.56B market cap against $1.421B TTM revenue
        - ~8.1x market-cap-to-revenue
        - Premium-quality, mission-critical financial-software boundary marker
        - Insurance software is not a direct banking-core peer and this row uses market cap rather than EV.
      - - Clearwater Analytics
        - $7.27B market cap against $825.73M TTM revenue
        - ~8.8x market-cap-to-revenue
        - Another high-quality financial-software benchmark for what strong disclosure can command
        - Investment-accounting software is adjacent rather than a core-banking peer and this row also uses market cap.
      - - Thought Machine
        - $2.7B disclosed 2022 valuation plus a £45M 2025 insider round with no public re-mark
        - Strategic private-peer anchor with opaque current valuation support
        - Closest private cloud-core read-through on market positioning and investor expectations
        - >-
          Current valuation remains undisclosed, so it is a cautionary private-peer lens rather than a clean multiple
          anchor.
    notes: >-
      Mixed metric lenses are used intentionally because public EV data is not equally accessible across every comp; the
      goal is boundary setting, not false precision.
