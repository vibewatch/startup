            body: >-
              Public traction markers support the idea that Mambu is not an early product-market-fit story. Around
              Series E, multiple sources converged on 200-plus customers, roughly 50-53 million end users, 65-country
              reach, 40-plus new customer wins in 2021, and more than 120% year-on-year growth in Q3 2021. Current
              official materials push those scale claims materially higher: more than 260 customers, 65-plus countries,
              more than 230 million end users, more than 500 million daily API calls, and sevenfold growth in payments
              processed during 2025. Those signals support a business with genuine throughput and continued relevance.
              But there is still no primary-source public revenue bridge for the current group. Instead, the market
              leans on secondary databases and previews. GetLatka publishes a 2024 revenue estimate, while PitchBook and
              PM Insights expose the revenue topic without releasing a current public number and Sacra explicitly
              disclaims completeness. That makes Mambu’s growth story directionally credible while leaving current
              revenue, ARR, and valuation estimates squarely in the triangulate-not-trust bucket.
