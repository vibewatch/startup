  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal risk is highest where Mambu becomes a critical outsourced control point for banks
        blocks:
          - type: paragraph
            body: >-
              Mambu is not just another fintech application vendor; it sells a core operating layer into regulated
              institutions that now have tighter obligations to inventory, monitor, test, and exit third-party ICT
              dependencies. DORA and the UK critical-third-party regime matter precisely because Mambu's value
              proposition is cloud-native speed for banks, lenders, and payments providers, which makes the company part
              of customers' operational-resilience perimeter rather than a peripheral software add-on. Public Mambu
              materials help at the margin: the company says regulators and customers have audit rights, it markets
              shared or dedicated environments, and it highlights data-residency options. But the burden is still
              asymmetric. Bank customers remain accountable for outsourcing risk even if a provider is designated
              critical, and new UK reporting rules widen visibility into material non-outsourcing arrangements as well.
              The legal-disclosure layer is also thinner than an investor would want. The cookie policy is easy to
              retrieve, but public product-level privacy and data-processing detail remains limited. The practical
              implication is that Mambu's sales motion increasingly depends on how fast it can satisfy deeper customer
              and regulator diligence on subcontractors, exits, incident reporting, and data handling—not just on
              product capability.
