chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and platform positioning
        blocks:
          - type: paragraph
            body: >-
              Mambu’s current public identity is that of a cloud-native banking infrastructure vendor rather than a
              single-product core vendor. The homepage now calls it the only composable, AI-ready platform with an
              intelligent core and explicitly frames deposits, lending, payments, Islamic banking, banking-as-a-service,
              and embedded finance as part of one configurable stack. The same surface also carries the current scale
              story: hundreds of innovators, more than 230 million end users, more than 500 million API calls per day,
              more than 450 partners, and active use across more than 65 countries. Historical identity is less cleanly
              disclosed. Official materials are clear that Amsterdam is the current head office, but the founding
              narrative remains best supported through secondary profiles that place the 2011 start in Berlin and
              attribute founding credit to Eugene Danilkis, Sofia Nunes, and Frederik Pfisterer. That means the company
              can be described confidently as Amsterdam-headquartered today, while the full founder trio should still be
              treated as a secondary-source-supported fact rather than an official cover-line disclosure.
