            body: >-
              The encouraging part of the risk picture is that Mambu does not look careless. It has public security
              attestations, continuity tooling, multi-cloud positioning, and at least some credible customer proof for
              speed and go-live execution. It also sells directly into a market whose customers are now under pressure
              to formalize third-party oversight, which means buyers have strong incentives to force better discipline
              into the vendor relationship. The caution is that these same forces can raise the proof bar faster than
              Mambu's public disclosure has improved. That leads to a clean investment rule set. A control regression
