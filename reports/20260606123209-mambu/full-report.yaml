            body: >-
              The public record supports a durability hypothesis, but not a durability proof. There are good expansion
              proxies: Western Union broadened from digital banking into payments modernization, ABN AMRO reused Mambu
              from New10 into BUUT, and Tyme/GoTyme used the platform as a reusable banking template across markets.
