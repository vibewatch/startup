      - number: '7.3'
        title: >-
          Partner and cloud dependencies are strategic enablers, but they also create concentration and transmission
          risk
        blocks:
          - type: paragraph
            body: >-
              Mambu's strongest strategic argument is that composability lets customers combine best-in-class providers
              instead of accepting a monolithic stack. That same design choice creates dependency risk that must be
              underwritten explicitly. Public sources show Mambu leaning on hyperscalers for deployment flexibility,
              Google Cloud for interoperability and market access, Form3 for pre-integrated payments infrastructure, and
              escrow or assurance partners for continuity comfort in regulated deals. Each dependency can be rational on
              its own. Together they create a multilayered third-party chain that bank customers still have to map,
              monitor, and justify. Form3's own marketing is revealing: it stresses resilience across AWS, Azure, and
              GCP and explicitly links its architecture to cloud-concentration and data-sovereignty concerns. That is a
              mitigation, but it is also evidence that these concerns are central enough to be part of the sales pitch.
              The main residual risk is not that Mambu has no alternatives; it is that investors cannot yet see the
              actual production concentration by hyperscaler, payments partner, region, or major customer program. Until
              that map is disclosed privately, the company should be treated as operationally diversified in theory but
              unverified in practice.
