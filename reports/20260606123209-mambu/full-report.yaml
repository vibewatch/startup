  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and pricing opacity
        blocks:
          - type: paragraph
            body: >-
              Mambu’s public financial story begins with breadth of product scope rather than clarity of monetization.
              Current official materials frame the company as a SaaS cloud banking platform spanning deposits, lending,
              payments, Islamic banking, banking-as-a-service, and embedded finance. The company’s own messaging
              increasingly places payments near the center of the story: the Numeral acquisition is described as a
              strategic growth move, the 2026 payments-hub release calls payments a cornerstone of strategy, and partner
              content shows Mambu leaning on pre-integrated payments infrastructure instead of selling only a standalone
              ledger. That points to a multi-line revenue model with recurring platform value plus implementation,
              migration, partner-enabled delivery, and payments-related revenue opportunities. What public evidence does
              not show is the exact commercial conversion of that product surface into price books, transaction
              schedules, setup fees, minimum commitments, or discount policy. The accessible pricing path returns a
              not-found page, and none of the reviewed official materials disclose realized contract economics. Revenue
              quality is therefore inferable only at the mechanism level, not the contract level.
