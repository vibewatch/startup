    layout: wide
    summary: >-
      Mambu’s public architecture reads as layered configuration and servicing on top of shared banking engines,
      payments control, and multi-cloud operations.
    data:
      layers:
        - label: Channels, operators, and service teams
          detail: Bank staff and customer-facing teams interact through apps, portals, and the Mambu UI.
