  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and competitor classes
        blocks:
          - type: paragraph
            body: >-
              Mambu does not face one clean competitor archetype. Its closest direct pressure comes from cloud-native or
              modular-core peers such as Thought Machine and Tuum, which also promise faster launches, API-led
              flexibility, and lower-disruption modernization. But those direct peers are only one layer of the market.
              A much larger incumbent-suite class — led by Temenos, Oracle FLEXCUBE, Infosys Finacle, TCS BaNCS, and
              Finastra — still matters because many banks buy for breadth, localization, implementation confidence, and
              partner capacity rather than for the most elegant architecture. Juniper’s leaderboard and SDK.finance’s
              2026 vendor map both reinforce that the market is broad enough for banks to compare modern composable
              platforms and incumbent suites in the same buying motion.


              The substitute set is also wider than pure core replacements. nCino’s annual report makes clear that it
              sells process digitization, legacy consolidation, and banking-experience improvement, which means it can
              absorb transformation budget even when it is not the universal core. PeerSpot’s alternatives pages for
              both Mambu and Temenos reinforce that buyers actively look across multiple substitute paths. The practical
              result is that Mambu competes not only against other cores, but also against phased modernization,
              workflow-layer upgrades, and the decision to delay or narrow the scope of replacement.
            claimRefs:
