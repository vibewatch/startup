  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Mambu still screens as a real business, not a narrative shell. The official record supports hundreds of
              financial innovators across 65+ countries, more than 230 million end users, over 500 million API calls per
              day, and more than 260 customers in over 65 countries. The product story is also broader than a narrow
              core-ledger pitch: the platform now spans deposits, lending, payments, Islamic banking, and
              embedded-finance use cases, while customer and partner evidence from Allica and Form3 supports migration
              credibility and payments enablement. The February 2026 payments release adds a useful operating signal
              because management disclosed sevenfold year-on-year growth in payments processed in 2025 and named a live
              customer set that reaches beyond a single pilot.

              The problem is price support, not company existence. The last disclosed financing still traces back to
              December 2021, when Mambu raised roughly $266 million at a $5.5 billion post-money valuation. Since then
              the accessible public record has not produced a refreshed headline mark, clean secondary pricing, audited
              ARR, current consolidated revenue, gross margin, NRR, or preference-stack detail. The retained official
              and registry sources show that even the accessible UK entity filings are small-company accounts rather
              than the sort of consolidated disclosure an investor would need to defend a late-stage software valuation.
              That leaves the right call as research-more, not buy: stay engaged because the asset quality may be real,
              but do not underwrite near the stale 2021 mark without a much lower price or a much better private data
              room.
            claimRefs:
