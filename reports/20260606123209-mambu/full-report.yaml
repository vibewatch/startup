      - number: '2.3'
        title: Growth drivers and modernization catalysts
        blocks:
          - type: paragraph
            body: >-
              The market drivers are structural rather than purely cyclical. Accenture, Deloitte, and Swisscom all
              describe a sector that is still trapped by legacy technology, slow product change, and architecture not
              designed for modern data, AI, or open ecosystems. Backbase and Sutherland add that composable and modular
              approaches matter because banks do not want modernization to require a wholesale platform rip-and-replace
              before they can launch new products or reduce maintenance drag. In other words, demand is not just for a
              new core; it is for a path to continuous change.


              Payments modernization sharpens that demand. KPMG’s 2026 trends elevate instant payments, payments AI, and
              embedded finance as current priorities, while the Bank of England’s ISO 20022 timetable and the ECB’s TIPS
              infrastructure turn real-time payments into concrete implementation programs. Those infrastructure changes
              matter for Mambu because they convert architecture quality, cloud posture, and data readiness into
              board-visible spending decisions.


              Mambu’s own materials fit this catalyst stack closely. The company claims faster product launch cycles,
              and its report The end of transformation? argues that banks can move step by step away from legacy systems
              through composable architecture. That does not prove market capture, but it does explain why Mambu’s
              product story is aligned with where public modernization pressure is actually building.
            claimRefs:
              - CM001
              - CM025
              - CM026
              - CM027
              - CM028
              - CM029
              - CM030
              - CM031
              - CM032
