            body: >-
              The best-supported capital benchmark remains the December 2021 EQT Growth-led Series E. Across Mambu’s own
              announcement, Business Wire, TechCrunch, FT Partners, and follow-on coverage, the company raised €235
              million, or about $266 million, at roughly a €4.9 billion / $5.5 billion post-money valuation. Public
