      - number: '8.3'
        title: Scenario ranges and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The right scenario framework starts by admitting that the key underwriting inputs are private. The bull
              case is not that the 2021 headline simply remains true because Mambu once achieved it. The bull case is
              that the accessible revenue proxies materially understate current consolidated ARR or revenue, payments
              momentum is translating into higher-quality wallet share, and management can prove software-like margins,
              strong retention, and a clean cap table. Under that path, Mambu could still deserve a large private
              premium, but even then the fair-value range probably sits meaningfully below the old 2021 peak because the
              multiple regime has changed.

              The base case gives Mambu credit for what the public record does support: real customer proof, credible
              partner leverage, continued product expansion, and a category that still matters. It also discounts the
              company for what public evidence does not support: a current financing refresh, clean consolidated
              economics, or explicit term visibility. That is why the most reasonable current band remains roughly $1.3B
              to $2.1B, with a preferred entry zone lower still at around $1.1B to $1.6B unless diligence surfaces
              materially better hidden quality than the public sources show. The bear case is straightforward. If the
              accessible revenue proxies are directionally right, if services or support burden is heavier than
              investors expect, or if any new transaction re-prices the cap table, then the public-comp lens points
              materially lower. Investors should therefore treat any discussion of the 2021 price as a ceiling to
              challenge, not a floor to accept.
