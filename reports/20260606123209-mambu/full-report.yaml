      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Mambu’s moat looks real, but narrower than an uncritical SaaS-growth reading would imply. The company
              appears strongest when buyers want a broad composable platform, quick time to market, and modern payments
              or adjacent product expansion without living inside a legacy suite roadmap. That is a meaningful advantage
              versus large incumbents whose strongest public evidence still centers on breadth, regionalization, and
              trusted delivery. Mambu’s 2025 payments push also improves its story by making the platform look more
              complete than a pure lending or deposits vendor.


              The risk is that rivals pressure Mambu from both directions. Thought Machine claims more programmable
              product logic, Tuum claims lower-friction modular delivery, and incumbents publish more disclosed scale,
              stronger partner leverage, and broader enterprise comfort. Meanwhile, the public evidence base is thin on
              price, win rates, and Tier 1 bake-offs, so it is difficult to prove that Mambu’s architecture converts
              into repeatable economic victories. For later financial and valuation work, the right takeaway is that
              Mambu’s moat depends on turning a compelling product narrative into durable implementation proof faster
              than incumbent suites can modernize their own messaging and faster than adjacent substitutes can narrow
              the scope of what needs to be replaced.
