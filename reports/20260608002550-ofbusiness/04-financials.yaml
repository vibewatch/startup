tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit / disclosed metric
      - Current public value / status
      - Quality of evidence
      - Diligence ask
    rows:
      - - Parent raw-material commerce
        - Procurement, aggregation, fulfillment, and category spread on industrial inputs
        - FY24 operating revenue base
        - Core driver inside OfBusiness's ₹19,296 crore FY24 operating revenue
        - Medium; scale is public but realized take rate is not
        - Break out revenue, gross profit, and working-capital intensity by category
      - - Parent financial services to SMEs
        - Lending and allied financial services sold alongside commerce workflows
        - Revenue stream identified, but no clean segment split
        - Public sources say it is one of the two primary operating-revenue engines
        - Medium; direction clear, mix opaque
        - Provide commerce vs finance revenue and gross-margin split
      - - Parent interest / other financial activity
        - Interest and other financial income above operating revenue
        - FY24 other financial income
        - ₹232 crore in FY24, taking total revenue to ₹19,529 crore
        - Medium; visible in reporting, but not decomposed further
        - Show recurring vs one-off financial income items
      - - Oxyzo core lending income
        - Interest income on SME credit products
        - FY25 interest-income share
        - About 95% of FY25 revenue came from interest income
        - Medium-High; direct financial reporting
        - Disclose fee income, DCM income, and fund-management contribution separately
      - - New fee verticals
        - Debt capital markets, GoldenPi distribution, AIF / investment manager
        - Strategic expansion status
        - Publicly announced, but earnings contribution not yet disclosed
        - Low-Medium; strategic visibility, weak monetization detail
        - Provide revenue and cost contribution for new verticals
    notes: Combines parent and subsidiary revenue streams because the public record is structurally asymmetric; the cleanest monetary disclosures sit at Oxyzo rather than the parent marketplace.
