company:
  name: OfBusiness
chapter:
  number: 4
  title: Financials
  summary: Public evidence supports a profitable but still procurement-heavy parent business and a much cleaner disclosed lending subsidiary. OfBusiness generated about ₹19,296 crore of FY24 operating revenue and roughly ₹603 crore of FY24 profit, while Oxyzo disclosed ₹1,207 crore FY25 revenue, ₹339 crore FY25 PAT, and FY26 revenue around ₹1,489-1,494 crore with GNPA below 1%. The main underwriting blocker is not absence of scale or profitability; it is the lack of parent-level cash, runway, realized take-rate, and GTM-efficiency disclosure, so the public finance case is materially stronger for Oxyzo than for the consolidated parent.
sections:
  - id: revenue-quality-and-monetization
    title: Revenue Quality and Monetization
    body: |-
      The retained public record shows that OfBusiness is still monetized first as a procurement-and-finance operating business, not as a pure software layer. Entrackr and Economic Times both describe FY24 operating revenue around ₹19,296 crore and identify two core engines: sale of industrial goods/raw materials and financial services to SMEs. Entrackr further notes ₹232 crore of interest and other financial activity, which means the consolidated parent already mixes commerce spread and finance income rather than depending on one homogeneous revenue stream. That mix is useful because it diversifies revenue, but it also means revenue quality depends heavily on commodity procurement execution, credit discipline, and working-capital turnover rather than a clean subscription base.

      The public pricing surface is far clearer on the Oxyzo side than on the parent marketplace side. Oxyzo publishes list terms for purchase finance, invoice discounting, business loans, and machinery finance: rates start from 12% per annum, processing fees from 1%, unsecured limits can reach ₹5 crore, and approvals are marketed within 48 hours. Purchase finance and invoice discounting are also explicit that interest is charged only on utilization, which is commercially attractive and consistent with working-capital workflows. What remains missing is the realized side of the ledger: the retained public sources do not disclose OfBusiness's realized procurement take rate, category-level gross margins, or realized yield/fee mix by customer cohort.
