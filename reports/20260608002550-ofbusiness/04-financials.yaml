    title: Parent disclosure is still too thin for a clean runway view
    body: Public sources support profitability, but they do not disclose parent cash on hand, burn, runway, CAC, payback, or realized procurement take rate, which prevents a full equity-style underwriting from public data alone.
    claimRefs:
