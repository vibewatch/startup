  - id: TI002
    title: Pricing / monetization table
    columns:
      - Product / stream
      - Public price / unit
      - Realized vs list
      - Eligibility / tenor
      - Disclosure quality
      - Source / diligence ask
    rows:
      - - Purchase finance
        - Starts from 12% p.a.; processing fee from 1% p.a.
        - List pricing only; realized yield undisclosed
        - Unsecured limits up to ₹5 crore; 60-120 day tenor; 48-hour approval
        - High for list terms, low for realized yield
        - Ask realized yield by customer tier, utilization, and delinquency cohort
      - - Invoice discounting
        - Starts from 12% p.a.; processing fee from 1% p.a.
        - List pricing only; charged on utilized amount and days used
        - Up to ₹5 crore; 48-hour approval; recourse structure via escrow
        - High for product mechanics, low for portfolio yield
        - Ask average discount period, realized yield, and buyer concentration
      - - Business loan
        - Starts from 12% p.a.; processing fee from 1% p.a.
        - List pricing only; realized spread undisclosed
        - Unsecured up to ₹5 crore; typical 12-36 month EMI structure; 48-hour approval
        - High for list terms, low for realized pricing dispersion
        - Ask weighted-average tenor, coupon, and secured-vs-unsecured pricing mix
      - - Machinery finance
        - Starts from 12% p.a.; processing fee from 1% p.a.
        - List pricing only; final rate and LTV vary by asset and credit profile
        - Up to ₹5 crore unsecured; 24-48 hour disbursement after sanction
        - High for list terms, low for realized capex yield
        - Ask LTV distribution, secured share, and asset repossession history
      - - OfBusiness marketplace / procurement
        - No public list price, take rate, or category margin schedule retained
        - Realized pricing fully opaque in retained sources
        - Revenue visible only in aggregate company financial reporting
        - Low
        - Provide invoice-level gross margin and customer discount waterfall by category
    notes: Public monetization transparency is unusually explicit on Oxyzo lending products and unusually thin on the parent procurement marketplace.
    claimRefs:
