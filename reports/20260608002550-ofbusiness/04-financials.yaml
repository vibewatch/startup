  - id: TI004
    title: Capital adequacy table
    columns:
      - Item
      - Latest public value / status
      - Source window
      - Why it matters
      - Underwriting read
      - Diligence ask
    rows:
      - - Oxyzo net worth and CRAR at Mar 2026
        - Net worth ~₹3,327 crore; CRAR ~28.84-29%
        - FY26 media coverage
        - Shows capital remained well above regulatory floors after another year of growth
        - Positive, but directionally lower than earlier checkpoints
        - Provide audited FY26 standalone and consolidated capital stack
      - - Oxyzo net worth and CRAR at Dec 2025
        - Net worth ₹3,195 crore; CRAR 32.1%; gearing 2.2x
        - ICRA Mar 2026 note (9M FY26)
        - Gives a rated, near-current checkpoint on capital and leverage
        - Positive; still comfortable with room before 4x gearing guardrail
        - Share monthly leverage and liquidity trend from Jan-Mar 2026
      - - Oxyzo FY25 year-end capital snapshot
        - Net worth ₹2,943 crore; CRAR 34%; LCR 327%
        - FY25 annual report
        - Confirms strong carry-in capital and liquidity entering FY26
        - Positive base for ongoing scale-up
        - Reconcile annual-report CRAR with rating-agency methodology
      - - Debt outstanding / fresh debt raised
        - ₹6,028 crore debt outstanding; >₹3,500 crore fresh debt in FY25
        - FY25 annual report
        - Shows balance-sheet growth is funded through real liability-market access
        - Positive for access, but increases refinancing dependence
        - Provide lender concentration, weighted cost of debt, and maturity ladder
      - - Next-12-month liquidity coverage
        - ~₹3,366 crore debt due vs ~₹6,428 crore expected inflows, plus ₹1,058 crore liquidity and ~₹937 crore unused lines
        - ICRA Mar 2026 note
        - Demonstrates a strong near-term liquidity cushion on public evidence
        - Positive, assuming collections remain stable
        - Provide actual Mar-Jun 2026 collections and rollover performance
      - - Secured vs unsecured mix
        - ~64-66% secured and ~34-36% unsecured by late 2025
        - ICRA / CARE 2025 notes
        - Unsecured growth is the cleanest risk variable in the public file
        - Acceptable today, but monitorable if growth shifts further unsecured
        - Provide vintage, sector, and ticket-size mix for unsecured cohorts
      - - Parent support and ownership
        - OFB Tech / OfBusiness remained ~70% owner through 2024-2025
        - ICRA / CARE notes
        - Matters because Oxyzo still sits inside the parent ecosystem even if rating agencies do not assume rescue capital
        - Supportive governance link, but not a substitute for stand-alone liquidity
        - Share intercompany exposures, guarantees, and any downstream/upstream funding flows
      - - Parent cash / runway
        - Not publicly disclosed in retained sources
        - Parent public record
        - This is the biggest remaining financing blind spot for the consolidated story
        - Negative for parent-level underwriting clarity
        - Provide parent cash, burn, free cash flow, and runway scenarios
    notes: Public evidence lets us underwrite Oxyzo's capital structure materially better than the parent company's consolidated liquidity position.
