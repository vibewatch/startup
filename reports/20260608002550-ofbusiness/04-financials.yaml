  evidenceGaps:
    - type: missing-source
      severity: material
      topic: parent-liquidity-opacity
      missingEvidence: Parent cash balance, burn rate, debt maturity schedule, and runway scenarios for OfBusiness.
      whyItMatters: These are required to assess financing dependency, dilution risk, and whether parent profitability is translating into free cash generation.
      diligencePath: Request the latest parent balance sheet, monthly cash bridge, debt maturity ladder, and board-approved base / downside runway cases.
      relatedQuestionRefs:
        - QI022
      relatedTableRefs:
        - TI005
    - type: missing-source
      severity: material
      topic: pricing-opacity
      missingEvidence: Realized take rate, category-level gross margin, customer discounting, and lending yield by product cohort.
      whyItMatters: Aggregate revenue and list pricing do not reveal how much pricing power survives after discounts, funding costs, and product mix.
      diligencePath: Request invoice-level gross-margin waterfalls, product yield curves, and realized vs list pricing by cohort.
      relatedQuestionRefs:
        - QI005
      relatedTableRefs:
        - TI002
        - TI005
    - type: missing-source
      severity: material
      topic: gtm-economics-opacity
      missingEvidence: CAC, sales-cycle length, funnel conversion, repeat-order rate, and payback period for both commerce and lending funnels.
      whyItMatters: Without GTM efficiency data, it is hard to judge whether current profitability can persist as growth continues.
      diligencePath: Request cohort-level funnel data, acquisition cost by channel, conversion timelines, repeat usage, and payback by product line.
      relatedQuestionRefs:
        - QI023
      relatedTableRefs:
        - TI003
        - TI005
    - type: missing-source
      severity: material
      topic: unsecured-book-opacity
      missingEvidence: Vintage curves, sector cohorts, bucketed PAR / NPA data, recoveries, and loss-given-default for the unsecured book.
      whyItMatters: Top-line GNPA ratios do not reveal whether current asset quality can survive a weaker cycle or a faster unsecured mix shift.
      diligencePath: Request unsecured-book cohort tables, delinquency waterfalls, recovery curves, and sector / ticket-size concentration views.
      relatedQuestionRefs:
        - QI024
      relatedTableRefs:
        - TI004
        - TI005
    - type: missing-source
      severity: material
      topic: new-vertical-economics
      missingEvidence: Revenue, cost, capital employed, and earnings contribution for GoldenPi, the credit fund, and the investment-manager arm.
      whyItMatters: New verticals are currently a strategic narrative, but they cannot be valued or credited in underwriting without standalone economics.
      diligencePath: Request segment-level P&L, balance sheet, and management targets for each new fee-income business.
      relatedQuestionRefs:
        - QI025
      relatedTableRefs:
        - TI001
        - TI005
