  - calloutType: strength
    title: Oxyzo is the cleaner public underwriting surface
    body: Filed and rated evidence shows a lending arm with real scale, recurring interest income, capital ratios still above regulatory needs, and NPAs held near or below 1% even through fast growth.
    claimRefs:
      - CI023
      - CI025
      - CI037
