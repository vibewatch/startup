  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing metric
      - Why it matters
      - Best public proxy
      - Impact on analysis
      - Exact diligence path
    rows:
      - - Parent cash on hand, burn, and runway
        - Needed to judge financing dependency ahead of IPO and growth plans
        - Oxyzo liquidity disclosures and parent profitability headlines
        - Blocks a full parent-level solvency and dilution assessment
        - Request parent monthly cash bridge, debt maturities, and 12-18 month runway cases
      - - Realized procurement take rate / category margin
        - Needed to judge revenue quality and gross-margin durability in the commerce layer
        - Aggregate FY24 revenue, EBITDA margin, and expense ratios
        - Prevents a clean view of how much margin comes from procurement spread versus ancillary finance
        - Provide invoice-level take rate, gross margin, and discount waterfall by major category
      - - CAC, sales cycle, and payback
        - Needed to test whether growth is becoming more expensive as scale rises
        - Public product pages show approval promises but not funnel efficiency
        - Leaves GTM efficiency and repeat-order economics under-specified
        - Provide acquisition cost, conversion funnel, sales cycle, repeat rate, and payback by cohort
      - - Unsecured-book cohort detail
        - Needed to stress-test late-cycle credit losses rather than rely on point-in-time NPAs
        - Public sources disclose only unsecured share and top-line GNPA / NNPA
        - Limits downside analysis on the riskiest slice of Oxyzo's book
        - Provide cohort curves, PAR buckets, sector mix, and loss-given-default for unsecured accounts
      - - New-vertical earnings contribution
        - Needed to judge whether GoldenPi, credit-fund, and manager businesses are diversifying profits or just consuming capital
        - Strategy announcements and media reporting
        - Keeps non-interest-income optionality narrative-heavy rather than model-ready
        - Share revenue, expense, and capital employed by each new vertical
      - - Parent / subsidiary segment split
        - Needed to separate marketplace economics from regulated lending economics
        - Consolidated revenue and Oxyzo stand-alone or rated metrics
        - Makes sum-of-the-parts valuation and margin benchmarking imprecise
        - Provide consolidated segment P&L, balance sheet, and cash flow by commerce vs lending
    notes: These are not cosmetic asks. They are the minimum dataset needed to move from a public-market narrative to an investable underwriting model.
    claimRefs:
      - CI008
      - CI038
      - CI039
      - CI040
      - CI041
      - CI042
figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: Public evidence shows a commerce-plus-credit loop rather than one monolithic marketplace revenue stream.
    approximationNotes: The bridge abstracts actual operational steps into the monetization nodes that are visible in retained public sources. It is meant to show where revenue quality is observable and where it remains opaque.
    claimRefs:
      - CI003
      - CI004
      - CI009
      - CI011
      - CI013
      - CI014
      - CI024
    data:
      nodes:
        - id: n1
          label: Raw-material demand
          detail: Manufacturers and contractors need recurring commodity or project-input procurement
        - id: n2
          label: OfBusiness procurement layer
          detail: Commerce engine sources materials, aggregates supply, and executes fulfillment
          dependsOn:
            - n1
        - id: n3
          label: Oxyzo financing layer
          detail: Purchase finance, invoice discounting, business loans, and machinery finance fund the workflow
          dependsOn:
            - n1
        - id: n4
          label: Revenue capture
          detail: Parent earns commerce revenue plus financial income; Oxyzo earns interest income and ancillary fees
          dependsOn:
            - n2
            - n3
        - id: n5
          label: Profit quality test
          detail: Margin durability depends on procurement spread, utilization, funding cost, and credit losses rather than only on software leverage
          dependsOn:
            - n4
  - id: FI002
    title: Unit economics bridge
    type: flow
    layout: standard
    summary: Oxyzo's disclosed economics still resemble a healthy spread business, but incremental growth is already compressing margins modestly.
    approximationNotes: This is a conceptual bridge from disclosed pricing and funding costs to reported profitability, not a full reconciliation to audited statements.
    claimRefs:
      - CI010
      - CI018
      - CI020
      - CI024
      - CI026
      - CI027
      - CI043
    data:
      nodes:
        - id: u1
          label: Product pricing
          detail: List pricing starts from 12% p.a. across key credit products, with utilization-based charging on revolving facilities
        - id: u2
          label: Interest-income engine
          detail: Interest income remained the dominant revenue line, including about 95% of FY25 revenue
          dependsOn:
            - u1
        - id: u3
          label: Funding and opex drag
          detail: Finance costs and opex rose as the balance sheet expanded, moderating FY26 net margin and 9M FY26 RoA
          dependsOn:
            - u2
        - id: u4
          label: Credit-cost control
          detail: GNPA stayed near 1% or below, keeping credit costs contained despite rapid scale-up
