callouts:
- calloutType: insight
  title: The real market is large, but the direct wedge is narrower
  body: The most useful sizing insight is not that Indian B2B is huge, but that OfBusiness addresses the narrower slice where raw-material procurement, supplier control, logistics, and finance matter at once. That makes the opportunity smaller than the outer TAM but potentially more defensible.
  claimRefs:
  - CM024
  - CM044
  - CM045
  - CM052
- calloutType: strength
  title: Embedded finance is a conversion tool, not just an adjacency
  body: Public MSME credit-gap evidence and Oxyzo's product positioning suggest financing is central to procurement conversion. The ability to pair price discovery with working-capital support can compress buyer friction and improve repeat usage.
  claimRefs:
  - CM008
  - CM017
  - CM019
  - CM020
  - CM055
- calloutType: risk
  title: This category is more capital- and compliance-intensive than pure software
  body: Large market headlines do not remove the burdens of working capital, logistics, supplier management, and RBI-governed digital lending compliance. That combination can build a moat, but it also makes valuation discipline essential.
