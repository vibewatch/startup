- id: multiple-sizing-lenses
  title: 'Multiple Sizing Lenses: Outer TAM Is Large, Direct SAM Is Smaller'
  body: 'The broadest public market thesis is Bessemer''s and IBEF''s roughly US$200 billion online B2B marketplace opportunity by 2030. That outer lens is useful because it shows Indian B2B digitization is still early: Bessemer says B2B e-commerce was only 1% of the overall market in 2022 and could still be under 5% by 2030. But this is too broad to call OfBusiness''s direct market. OfBusiness does not sell into all B2B categories; it is concentrated in raw-material-heavy, fulfillment-sensitive sectors where procurement needs supplier curation, logistics, and credit.


    A second lens comes from MSME and procurement formalization. India had 7.86 crore registered MSMEs employing 34.63 crore people as of February 2026, but only a subset fits OfBusiness''s current wedge because registered enterprises are skewed toward trading and services rather than pure manufacturing. A third lens comes from finance: the World Bank/IFC addressable MSME credit gap cited by IBEF is US$397 billion, while Redseer''s digital-SME framing is narrower at US$220 billion with a US$112 billion working-capital shortfall. Those are not additive; they are different ways of bounding the same financing pain point.


    The underwriting takeaway is lens-based. A defensible analytical 2030 SAM for OfBusiness is roughly US$15-30 billion, representing a focused slice of the US$200 billion outer market aligned with raw materials, manufacturing-linked trade, and embedded finance. A near-term obtainable wedge is smaller again because online penetration is low, compliance burdens are rising, and revenue from traded goods should not be confused with platform GMV.'
