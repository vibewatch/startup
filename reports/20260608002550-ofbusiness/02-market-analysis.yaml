  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: sizing-precision
    missingEvidence: A public split of OfBusiness procurement GMV or revenue by category, take rate, and repeat versus one-off transaction mix.
    whyItMatters: Without category-level GMV or monetization data, the public SAM and SOM ranges stay analytical rather than audit-grade.
    diligencePath: Request management cohort data on procurement GMV, category mix, monetization by product, and repeat order concentration for the last twelve quarters.
    relatedQuestionRefs:
    - QM011
    - QM024
    relatedTableRefs:
    - TM002
  - type: conflicting-data
    severity: material
    topic: market-size-bridges
    missingEvidence: A management bridge reconciling the US$200B outer B2B TAM, the US$220B digital SME credit deficit, and the US$397B addressable MSME credit gap into one consistent internal market map.
    whyItMatters: The public numbers are all relevant but describe different populations and methods, so they cannot be used interchangeably in underwriting.
    diligencePath: Ask management and lenders for the internal market map that links procurement GMV, finance take-up, and sector concentration to each TAM/SAM/SOM layer.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: oxyzo-product-mix
    missingEvidence: A current split of Oxyzo exposure by purchase finance, invoice discounting, contractor finance, tenor, collateral profile, and loss performance.
    whyItMatters: Embedded-finance quality determines conversion and risk, but public sources only show the existence and aggregate scale of the finance layer.
    diligencePath: Request portfolio vintages, delinquency buckets, top-sector exposure, and product-level unit economics for Oxyzo linked to procurement-originated customers.
    relatedQuestionRefs:
    - QM008
    - QM025
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: minor
    topic: private-procurement-comparables
    missingEvidence: A public, high-quality private-enterprise benchmark comparable to GeM that isolates digital raw-material procurement volumes for manufacturing and contractor workflows.
    whyItMatters: GeM is a powerful validation lens, but private-enterprise procurement behavior could digitize at a different pace and with different product mix.
    diligencePath: Use company data rooms, lender partner data, and enterprise-customer interviews to build a private-procurement comparable set by vertical and order frequency.
    relatedQuestionRefs:
    - QM018
    - QM024
    relatedTableRefs:
    - TM002
    - TM004
