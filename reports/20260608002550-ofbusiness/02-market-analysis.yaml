- id: constraints-contradictions-and-valuation-relevance
  title: Constraints, Contradictory Estimates, and Valuation Relevance
  body: 'The main mistake in this market is to treat digital B2B procurement as either a pure software story or a pure broad-commerce TAM story. Public sources show large opportunity, but they also show real friction. Bessemer still sees only 10% of MSMEs transacting online today; 6Wresearch flags digital-infrastructure gaps and operational costs; ISM India highlights capability and supplier-risk constraints; and RBI''s digital-lending regime makes embedded credit more compliance-heavy. Those frictions slow adoption even when the strategic logic is strong.


    The size estimates also need discipline. The US$200 billion outer B2B opportunity, the US$220 billion digital-SME credit deficit, and the US$397 billion addressable MSME credit gap are useful, but they describe different populations and definitions. They should be treated as bounding lenses, not as additive TAM. That is why the chapter keeps the analytical SAM and SOM ranges explicitly low confidence.


    For valuation, the key implication is that OfBusiness is operating in a category with large runway but mixed quality of public comparables. Revenue scale is real, yet the model carries working-capital, logistics, and regulatory burdens that make it harder than a pure take-rate or SaaS business. Investors should therefore ask for category GMV, take-rate, credit-book mix, and product-level disclosure before translating the headline market into a clean underwriting multiple.'
