  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入质量与变现
        blocks:
          - type: paragraph
            body: >-
              保留的公开记录显示，OfBusiness 仍首先作为采购 + 金融运营业务变现，而不是纯软件层。Entrackr 和 Economic Times 都把 FY24 经营收入描述为约 ₹19,296
              crore，并识别出两个核心引擎：工业品 / 原材料销售，以及面向 SME 的金融服务。Entrackr 还提到 ₹232 crore
              利息和其他金融活动，这意味着合并母公司已经混合了商务价差和金融收入，而不是依赖单一同质收入流。这种组合有用，因为它分散收入；但它也意味着收入质量重度依赖大宗商品采购执行、信贷纪律和营运资金周转，而不是干净的订阅基数。


              Oxyzo 侧的公开定价面远比母公司市场平台侧清晰。Oxyzo 发布了采购融资、发票贴现、企业贷款和机械融资的挂牌条款：年化利率从 12% 起，处理费从 1% 起，无抵押额度可达 ₹5 crore，并宣传 48
              小时内审批。采购融资和发票贴现也明确只对已使用额度计息，这在商业上有吸引力，也符合营运资金工作流。缺失的是账本的实际落地侧：保留的公开来源没有披露 OfBusiness
              已实现的采购抽佣率、品类级毛利率，或按客户分组切分的实际收益率 / 费用组合。
