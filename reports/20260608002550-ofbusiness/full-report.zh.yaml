  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 平台
      - 公开模式
      - 已披露经济性 / 限额
      - 已包含能力
      - 未知项 / 注意事项
      - 含义
    rows:
      - - Oxyzo
        - 与供应商发票绑定的采购融资授信额度
        - 最高 ₹5 Cr；定价 12% p.a. 起；处理费 1% p.a. 起；期限 60-120 天
        - 直接向供应商付款、可选无抵押、RBI 监管的 NBFC、仅按使用额计息
        - 客户层面的实际定价和信贷损失未公开
        - 这组同行中，采购绑定金融最明确的公开基准
      - - Mintifi
        - 库存融资、发票融资、营运资本贷款
        - 库存采购授信额度最高 ₹2 Cr；无抵押商业贷款最高 ₹50 lakh
        - 自有 NBFC 加合作放贷方；分销商和零售商工作流；300+ 个品牌
        - 实际定价、抽佣率和损失表现仍未公开披露
        - 即便价格不完全透明，也是金融侧最强同行
      - - FinanSME / Power2SME
        - 与 NBFC 合作伙伴安排采购票据融资
        - 协议利率；处理 4,000 份申请；980 个活跃账户；放款 ₹1,850 Cr
        - 叠加在采购俱乐部模式上的金融层
        - 没有标准化公开费率表，也没有逐产品经济性
        - 展示了原材料集采与金融结合的早期先例
      - - Lendingkart
        - 无抵押 MSME 企业贷款
        - 最高 ₹50 lakh；无抵押
        - 数字化 KYC 和快速申请流程
        - 留存证据中的公开页面未披露实际利率区间
        - 争夺营运资金预算，但不是采购原生方案
      - - InCred
        - 营运资金、定期贷款和渠道金融产品
        - 营运资金贷款最长 12 个月；无抵押定期贷款最长 36 个月
        - 分销商和供应商融资，加上通用 SME 贷款
        - 公开页面未披露可比的采购挂钩定价基准
        - 属于贷款侧竞争对手，尤其适用于渠道金融场景
      - - UGRO Capital
        - 有抵押和无抵押 MSME 贷款
        - 披露快速审批和灵活期限，但留存资料没有公开费率表
        - 公开 NBFC 信任背书和数字化流程
        - 详细经济性需要比这里留存资料更深入的投资者或产品披露
        - 竞争点在受监管 MSME 信贷，而不是采购运营工作流
    notes: 公开包装远比实际定价清楚。Oxyzo 披露得异常直接；多数竞争对手只披露产品类别、额度或审批承诺， 不发布可比的实际商业条款。
