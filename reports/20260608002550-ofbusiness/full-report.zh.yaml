      - number: '3.2'
        title: 相邻发现平台与替代渠道
        blocks:
          - type: paragraph
            body: >-
              第二层竞争不是一一对应的采购运营商，而是最终交易上游的广义发现和补货层。IndiaMART、TradeIndia 和 Udaan 都在这里给 OfBusiness 施压。IndiaMART
              显然是规模锚点：其投资者材料称它是印度最大的线上 B2B 市场平台，在线 B2B 分类信息中占 60% 份额；其 FY2025-26 年报披露 41 million 活跃买方、220,000 付费供应商、114
              million 商业询盘和 129 million 在线商品列表。TradeIndia 更小，但作为多平台采购通道仍足够重要；它声称有 89 million 年询盘、11.4 million 注册用户和
              100,000+ 品类，并明确向 MSME 推介 360 度数字解决方案。Udaan 通过以零售为中心的 B2B 贸易、物流和 udaanCapital 形成重叠，但其公开品类重点仍是
              FMCG、主粮、生鲜和医药，而不是重工业投入品。因此，替代集合大于直接同行：线下分销商、本地贸易商、直接钢厂关系和通用数字线索生成平台，即便无法复制完整 OfBusiness
