  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 品类
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 与 OfBusiness 的相关性
    rows:
      - - 原材料采购
        - 钢铁、有色金属、聚合物、化学品、能源、农业及相邻工业投入品
        - 消费零售、与工业采购无关的成品转售
        - 采购负责人或企业主；由运营或项目预算支付
        - 核心切入口，靠价格发现、履约和品类深度支撑
      - - 供应商发现和 RFQ 工作流
        - 经验证买家、报价请求、供应商入驻和质检
        - 没有交易支持的被动分类信息
        - 供应商销售负责人和买方采购团队
        - 关键，因为品类流动性决定价格发现是否可信
      - - 嵌入式金融和应收账款支持
        - 与采购流绑定的采购融资、应收账款贴现和营运资本支持
        - 独立无抵押零售贷款或无关消费信贷
        - 财务负责人、资金部或创始人主导的付款方
        - 将采购意向转成可重复订单流的战略飞轮
      - - 招标和市场情报层
        - BidAssist 招标发现、Nexizo 大宗商品数据、价格和市场情报
        - 缺少市场信号的通用 ERP 核心
        - 商务团队或采购分析负责人
        - 重要的线索生成和转换成本层
      - - 物流和履约
        - 运输、发运可视化、交付协调、全印度采购和流转
        - 缺少采购语境的纯货代
        - 运营或供应链预算负责人
        - 必要，因为原材料采购对时间和物流敏感
      - - 排除的现状方案和替代品
        - N/A
        - 线下分销商、本地经纪、直接 OEM 关系、纯发现门户、内部电子表格
        - 现有采购和财务团队
        - 这些是 OfBusiness 必须替代的既有方案，而不是可计入直接 SAM 的对象
    notes: 这个边界刻意窄于整个印度 B2B 商业。OfBusiness 适合的场景，是原材料采购、供应商验证、物流和营运资本支持处在同一条工作流里。
