  - id: FV002
    title: 估值敏感性
    type: bar
    summary: 以 FY24 收入为基数，不同销售倍数假设对应的隐含企业价值。
    approximationNotes: 数值采用留存资料中引用的约 $2.3 billion FY24 收入基数。这只是销售倍数敏感性的速算， 不是完整 DCF 或分部估值模型。
    data:
