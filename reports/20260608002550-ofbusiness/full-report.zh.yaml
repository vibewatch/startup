      - number: '7.5'
        title: IPO 时点、监控指标与否决条件
        blocks:
          - type: paragraph
            body: >-
              IPO 时点不只是催化剂，也是风险。OfBusiness 已完成可见的前置工作——转为公众公司、聘任投行，并对外沟通大型公开发行计划——但后期私募资本也在收紧，迫使许多已具规模的创业公司同时转向公开市场。这意味着
              OfBusiness 不是进入空场，而是进入一条队伍；在这条队伍里，披露质量、定价纪律和外界感知的韧性，比光有承销商更重要。截至 runDate，公开证据仍未显示已提交 DRHP
              或确定上市日期，因此正确的评估姿态，是把时点视为未定，而不是迫近。


              最有用的监控框架，不是一张模糊观察清单，而是一组具体的投资假设破坏触发器。第一，无抵押客户群组滑坡，或 NNPA
              升至评级机构舒适区之上，将说明增长模型跑在风控前面。第二，资本充足率下降或流动性盈余变薄，会在债务市场条件最关键时放大资金依赖。第三，投诉账龄反复进入 RBI 30
              天升级路径，会把运营问题转成行为合规问题。第四，大宗商品波动若叠加借款人需求走弱，将同时测试贸易和信贷。最后，如果 OfBusiness 持续扩大相邻下注，而 IPO
              文件没有明显推进，管理层带宽风险就应成为时点和估值上的真实折扣。
