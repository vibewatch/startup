    type: flow
    layout: wide
    summary: 公开证据显示，OfBusiness 更像是商贸加信贷闭环，而不是单一的市场收入流。
    approximationNotes: 该桥接图把实际运营步骤抽象为留存公开来源中可见的变现节点，用来说明收入质量在哪里可观察，哪里仍不透明。
    claimRefs:
      - CI003
      - CI004
      - CI009
      - CI011
      - CI013
      - CI014
      - CI024
    data:
      nodes:
        - id: n1
