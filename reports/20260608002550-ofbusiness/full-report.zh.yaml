      - number: '4.3'
        title: 资本结构与贷款账簿风险
        blocks:
          - type: paragraph
            body: >-
              资本结构是公开证据最强的地方。Oxyzo 的 FY25 年报显示，净资产为 ₹2,943 crore，未偿债务为 ₹6,028 crore，FY25 新增举债超过 ₹3,500
              crore，借款组合进一步转向非银行资金。评级说明随后把视角往前延伸：ICRA 2026 年 3 月说明显示，评级债务工具合计 ₹5,897.75 crore，净资产 ₹3,195 crore，CRAR 为
              32.1%，管理口径杠杆 2.2x，未来 12 个月债务义务约 ₹3,366 crore，对应预期流入约 ₹6,428 crore，外加流动性缓冲和未使用额度。FY26 媒体报道补充了 2026 年 3
              月的期末状态：净资产约 ₹3,327 crore，CRAR 约 29%，流动性盈余超过 ₹950 crore。


              贷款账簿风险受控，但并非无风险。FY25 年报数据、ICRA 和 CARE 都把 FY25 至 2025 年末的 GNPA / gross stage 3 放在约 1%，NNPA / net stage 3
              放在约 0.4-0.5%；随后公开 FY26 报道显示改善至约 0.74% GNPA 和 0.28-0.30% NNPA。同一批来源也说明评级机构为什么仍谨慎：账簿增长很快，2025 年末 34-36% 的
              AUM 是无抵押，ICRA 和 CARE 都明确把资产成熟度、无抵押账簿增长、杠杆爬升和 SME 信贷压力列为主要下行触发因素。因此，公开结论是有利但有条件：Oxyzo
              仍高于监管资本要求，并且负债来源多元，但如果无抵押增长跑赢承销纪律，它并不能免于恶化。
