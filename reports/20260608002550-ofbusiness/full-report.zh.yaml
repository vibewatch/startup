        - id: u3
          label: 资金与运营费用拖累
          detail: 资产负债表扩张后，财务成本和运营费用上升，压低 FY26 净利率和 9M FY26 RoA
          dependsOn:
            - u2
        - id: u4
          label: 信用成本控制
          detail: GNPA 保持在约 1% 或以下，尽管规模快速扩大，信用成本仍被压住
          dependsOn:
            - u2
        - id: u5
          label: 利润结果
          detail: FY25-FY26 证据仍显示 PAT 强劲、资产回报率为中个位数，但利润率并非无限扩张
          dependsOn:
            - u3
            - u4
