      - number: '8.3'
        title: 可比公司集与倍数纪律
        blocks:
          - type: paragraph
            body: >
              公开可比分析方向上有用，但需要大幅调整。保留信源集中，IndiaMART 和 PB Fintech 是最可用的印度上市参照，因为两者都是有规模的数字平台，有公开披露、明确盈利进展和可观察市值。截至 2026 年
              6 月运行日，CompaniesMarketCap 给出的 IndiaMART 市值约 $1.25 billion，PB Fintech 约 $7.4 billion。Screener
              数据显示，IndiaMART 最近四个已报告季度销售额合计约 Rs 1,569 crore，PB Fintech 最近四个已报告季度销售额合计约 Rs 6,794 crore。这意味着 IndiaMART
              粗略市值 / 销售额倍数约 7.5x，PB Fintech 约 10.3x。两者的交易基础，是比 OfBusiness 更干净的披露和轻得多的资产负债表强度。


              这道差距就是关键约束。OfBusiness FY24 收入约 $2.3 billion，税后利润约 $72.6 million。按 FY24 基数计算，2024 年 10 月约 $4 billion
              的二级交易意味着约 1.7x 销售额、约 55x 盈利；2021 年旧的 $5 billion 标记意味着约 2.2x 销售额、约 69x 盈利；外部讨论的 $6–9 billion IPO 区间，则意味着约
              2.6–3.9x 销售额、约 83–124x 盈利。这些销售额倍数仍远低于 IndiaMART 或 PB Fintech，但并不让 IPO 要价显得明显便宜，因为 OfBusiness
              收入质量更低：它结合了重库存贸易、制造业敞口，以及通过 Oxyzo 嵌入的信贷。因此，合理估值框架应给 OfBusiness
              远低于轻资产数字平台的收入倍数，同时承认其盈利能力、规模和日益有价值的金融臂。这套逻辑指回 $4–5 billion 区间，而不是报道 IPO 区间的上沿。
