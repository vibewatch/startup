        - 治理联系有支持作用，但不能替代独立流动性
        - 分享公司间敞口、担保，以及任何下拨 / 上划资金流
      - - 母公司现金 / 跑道
        - 留存来源未公开披露
        - 母公司公开记录
        - 这是合并叙事中最大的剩余融资盲点
        - 不利于母公司层面的承销判断清晰度
        - 提供母公司现金、烧钱速度、自由现金流和跑道情景
    notes: 公开证据让我们能明显更好地承销 Oxyzo 的资本结构，而不是母公司的合并流动性位置。
