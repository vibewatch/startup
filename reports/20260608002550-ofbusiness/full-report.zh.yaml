          note: 公开流程在漏斗顶部是自助式。
        - label: 供应商匹配
          value: Supplier portal and KAM process coordinate verified-buyer enquiries and seller documents.
          note: 供应商参与是可见且明确的，不是隐藏的中间件。
        - label: 融资决策
          value: >-
            Oxyzo can add purchase finance, vendor finance, invoice discounting, or work-order finance when capital is
            needed.
          note: 金融作为可选但核心的转化层嵌入流程。
        - label: 履约和文档
          value: Shipment tracking, invoices, ledgers, and e-way-bill workflows stay inside the app or web surface.
          note: 运营可见性是吸引重复使用的一部分。
        - label: 重复使用与扩张
          value: >-
