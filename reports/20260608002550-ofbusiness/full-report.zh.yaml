          value: 3.5
          high: 4
          unit: $B
        - label: 基准
          low: 4
          value: 4.6
          high: 5.2
          unit: $B
        - label: 乐观
          low: 6
          value: 6.5
          high: 7
          unit: $B
        - label: 概率加权中枢
          low: 4.6
          value: 4.8
          high: 4.9
          unit: $B
