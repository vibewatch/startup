      - number: '2.2'
        title: 多重测算口径：外层 TAM 很大，直接 SAM 更小
        blocks:
          - type: paragraph
            body: >-
              最宽的公开市场论点来自 Bessemer 和 IBEF：到 2030 年，线上 B2B 市场平台机会约 US$200 billion。这个外层视角有用，因为它显示印度 B2B 数字化仍处早期：Bessemer
              称，2022 年 B2B 电商仅占整体市场 1%，到 2030 年也可能仍低于 5%。但这个口径太宽，不能直接当作 OfBusiness 的市场。OfBusiness 不覆盖所有 B2B
              品类；它集中在原材料权重高、履约敏感的行业，采购需要供应商筛选、物流和信贷。


              第二个视角来自 MSME 和采购正规化。截至 2026 年 2 月，印度有 7.86 crore 家注册 MSME，雇用 34.63 crore 人；但只有其中一部分契合 OfBusiness
              当前切入点，因为注册企业偏向贸易和服务，而非纯制造。第三个视角来自金融：IBEF 引用的 World Bank/IFC 可触达 MSME 信贷缺口为 US$397 billion；Redseer 的数字 SME
              框架更窄，为 US$220 billion，并有 US$112 billion 营运资金缺口。这些数字不能相加；它们是在用不同方式给同一个融资痛点划边界。


              投资判断应按口径拆开。OfBusiness 一个可辩护的分析型 2030 年 SAM 约为 US$15-30 billion，代表 US$200 billion
              外层市场中与原材料、制造业绑定贸易和嵌入式金融相匹配的聚焦切片。近期可获得切入点还要更小，因为线上渗透率低、合规负担上升，且自营商品收入不能与平台 GMV 混为一谈。
