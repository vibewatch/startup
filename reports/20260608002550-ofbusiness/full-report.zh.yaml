      - number: '7.3'
        title: 大宗商品与营运资本风险
        blocks:
          - type: paragraph
            body: >-
              OfBusiness 和 Oxyzo 绑定同一个底层工业现实：它们围绕与原材料相关的 SME 需求赚钱。OfBusiness
              把自己定位成覆盖钢铁、铝、农业、石油、能源、聚合物、化学品及相关链条的采购与信贷平台；CRISIL 早期对 OFB Tech 的评级理由，也描述了类似的广泛贸易覆盖，包括工业钢材、水泥 /
              RMC、管材、聚合物、石油衍生品、工业化学品、建材和农产品。Business Today 另称，Oxyzo
              为钢铁、铝、铜、锌、聚合物、化学品和农产品等原材料提供融资。这种广度带来分散化好处，但也意味着平台贴近周期性投入品市场，而不是远离它们。


              缓释证据是真实的：CRISIL 称 OFB
              拥有多元化供应商基础，并可借助预付款报价和批量采购获得一定定价保护。但公司自己的证言反复提到原材料价格波动、投入成本高企和营运资本短缺，这正是投资者应关心的风险传导通道。外部宏观来源也证明问题仍在发生。Allianz
              描述金属价格持续波动，J.P. Morgan 称关税和贸易不确定性推高营运资本融资需求，Aon 和 BCG 都把原材料短缺和波动定位为正在升级的企业风险。OfBusiness
              面临的后果不只是交易量下降；更可能是承压客户同时需要更多信贷、贡献更薄利润率，并成为 Oxyzo 更弱的还款风险。
