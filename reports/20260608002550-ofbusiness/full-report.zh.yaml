      - number: '4.4'
        title: 尽调阻塞项与财务判断
        blocks:
          - type: paragraph
            body: >-
              剩下的问题是披露不对称。保留的公开来源足以判断 Oxyzo 的大体盈利能力、资本充足率、账簿质量和融资多元化，但不足以完成母公司的权益式投资论证。没有保留来源披露母公司账面现金、月度消耗、现金
              runway、客户集中度、CAC、回本周期或已实现采购抽佣率。Oxyzo 无抵押账簿的公开披露也停留在顶层 NPA 比率和有抵押 / 无抵押组合；它们没有给出 vintage 曲线、行业客群或分桶级违约瀑布。即便
              GoldenPi、信贷基金和投资管理人手臂等新增相邻业务，也是在战略上先可见，在经济性上后可见。


              由此得到的是分裂判断。收入质量可信，因为母公司和子公司都已经盈利，Oxyzo 尤其像一家真正运营中的
              NBFC，而不是只有叙事的金融手臂。利润率路径可以接受，但随着杠杆提高、增量增长来自较低收益率的有抵押业务或新垂直领域，利润率很可能正常化。Oxyzo 内部的资本强度可控，因为
              CRAR、流动性和负债多元化仍健康；但母公司仅凭公开数据仍无法干净投资论证，因为现金 runway 和实际变现不透明。尽调里的可投资问题因此不是 OfBusiness
              有没有规模，而是母公司能否展示现金生成、定价兑现和 GTM 效率，其披露质量能否接近 Oxyzo 已经可见的水平。
