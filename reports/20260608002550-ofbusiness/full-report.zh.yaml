      - number: '1.4'
        title: 规模快照、垂直整合、里程碑与负面核查
        blocks:
          - type: paragraph
            body: >-
              保留材料中最强的类审计证据仍是 FY24。官方稿件称，OfBusiness 经营收入为 ₹19,296.27 crore，合并净利润为 ₹602.97 crore，总费用为 ₹18,695.75 crore。这让
              OfBusiness 看起来明显大于、也更赚钱于许多风投支持的 B2B 同行。同一份官方稿件也说明了 Oxyzo 为什么重要：这家金融子公司 FY24 收入为 ₹903 crore，利润为 ₹290
              crore；Indian Startup News 和 IPO Central 后续 FY26 报道则把 Oxyzo 放在约 ₹1,494 crore 收入、约 ₹375 crore PAT，以及约
              ₹11,822 crore 资产或 AUM。Oxyzo 不是旁枝噪音，而是集团可投资性故事的重要部分。


              里程碑证据显示，公司一直从聚合走向更深的垂直整合。BidAssist 于 2017 年上线，2018 年扩张到 13 个邦；2021 年让公司成为独角兽，并按私人市场标记成为 $5 billion 企业；2022
              年又让 Oxyzo 自身成为独角兽。后续阶段更偏工业：管理层强调收购，Moneycontrol 报道 2025 年公司全资持有 Indian
              Design，这是上市前整合四个商务垂直领域计划的一部分。这与公司说法一致：它在建设制造和自有品牌深度，而不只是套利贸易流。


              负面核查没有显示已保留的制裁或诉讼大雷，但确实给出三个真实警示信号：创始人 Nitin Jain 于 2026 年离职、IPO 前 ESOP 流动性和投资者退出活动，以及从 2021 年峰值到 2024
              年二级市场的可见估值重置。员工数也无法干净支撑，因为官方集团营销与市场数据提供商似乎衡量的是不同范围。合在一起，这些问题不会否定规模故事，但意味着第 1 章应把 OfBusiness
              写成一个有披露缺口的盈利型、雄心型平台，而不是完全去风险的 IPO 前复利标的。
