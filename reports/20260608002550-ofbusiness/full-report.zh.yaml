      - number: '5.3'
        title: 嵌入式融资工作流与运营依赖
        blocks:
          - type: paragraph
            body: >-
              融资工作流是这个栈在运营上拉开差异的地方。Oxyzo 的采购融资页面描述了一种模式：贷款方依据已提交发票直接向供应商付款，借款人在 60-120
              天周期内还款，实际把营运资金嵌进原材料采购。发票贴现处理相反的时间错配：卖方有应收账款后，Oxyzo
              可依据选定发票预付资金，并使用带追索权结构和类托管账户收款机制。独立的企业贷款和机械融资产品，则把同一客户关系延伸到资本开支和更长期扩张。围绕这些产品，Oxyzo 反复使用一条共同文档主线——发起人
              KYC、GSTIN、银行流水、GSTR 数据和审计财务报表——这说明它更像标准化数字承销工作流，而不是临时拼装的产品运营。公开依赖地图也清楚：应用商店分发影响移动端界面，RBI
              规则影响放贷行为，供应商和运输商网络影响履约，第三方云、CRM 和支付供应商很可能影响网页和交易可靠性。这些依赖可见，尽管精确内部编排仍不可见。
