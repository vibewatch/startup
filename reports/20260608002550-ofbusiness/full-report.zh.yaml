  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 监管、信用滑坡、大宗商品冲击和融资压力如何传导为利润率压力，并损害 IPO 时点。
    approximationNotes: 该图展示公开证据暗示的方向性传导通道，不是量化情景模型。
    data:
      nodes:
        - id: r1
          label: 监管边界扩大
          detail: NBFC 指引、投诉升级和新受监管产品扩大合规负荷。
        - id: r2
          label: 信用损失上升
          detail: 无抵押或新近成熟的借款人滑坡速度开始快于预期。
        - id: r3
          label: 大宗商品波动冲击 SME 客户
          detail: 投入品价格波动削弱客户现金流和融资需求质量。
        - id: r4
          label: 资金利差或展期收紧
          detail: 债务市场和贷款人胃口走弱，而增长仍需要资本。
        - id: r5
          label: 利润率和流动性压力
          detail: 拨备、再融资成本和营运资本压力压缩回报。
        - id: r6
          label: IPO 准备度下滑
          detail: 公开市场窗口收窄时，披露和治理工作落后。
        - id: r7
          label: 估值 / 投资逻辑走弱
          detail: 综合下行情景会重估质量、时点和投资建议。
      edges:
        - from: r1
          to: r6
          label: 增加披露负担
        - from: r2
          to: r5
          label: 推高拨备和回收成本
        - from: r3
          to: r2
          label: 削弱借款人质量
        - from: r3
          to: r5
          label: 推高营运资本压力
        - from: r4
          to: r5
          label: 推高再融资成本
        - from: r5
          to: r6
          label: 削弱公开市场叙事
        - from: r2
          to: r7
          label: 削弱承销可信度
        - from: r6
          to: r7
          label: 推迟估值兑现
    claimRefs:
      - CR014
      - CR019
      - CR031
      - CR035
      - CR039
      - CR041
      - CR043
      - CR044
      - CR046
  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: 核心平台、交易对手和治理节点决定 OfBusiness 与 Oxyzo 能否在控制不滑坡的前提下增长。
    approximationNotes: 依赖项反映公开可见的角色和工作流连接，不代表独家合同集中度。
    data:
      nodes:
        - id: d1
          label: OfBusiness 原材料平台
          detail: 围绕工业投入品的采购、价格发现和客户漏斗。
        - id: d2
          label: Oxyzo NBFC 资产负债表
          detail: 营运资本和结构化信贷引擎。
        - id: d3
          label: 银行和联合贷款伙伴
          detail: 授信额度、银团和表内 / 表外支持。
        - id: d4
          label: NCD / 资本市场投资者
          detail: 债券发行和再融资胃口。
        - id: d5
          label: 大宗商品供应商和 SME 买家
          detail: 底层交易和信用质量基础。
        - id: d6
          label: GoldenPi 固收平台
          detail: 零售债券分销和财富业务邻接。
        - id: d7
          label: Oxyzo Credit Fund I / AIF 基金
          detail: 核心 NBFC 放贷之外的私人信贷扩张。
        - id: d8
          label: 监管机构和投诉渠道
          detail: RBI 行为监管加 SEBI 相关产品边界。
        - id: d9
          label: 管理层与董事会监督
          detail: 这个协调层必须让多套风险框架保持对齐。
      edges:
