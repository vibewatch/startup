        - 降低发现成本，加快机会筛选
        - 没有公开 API 文档，也没有下游转化率证据
      - - 现货价格发现和询价
        - 逐一联系多个贸易商或经纪人询每日报价
        - OfBusiness 主页 / App 与 Nexizo 展示实时价格、新闻和询价流程
        - 更快看清多个品类价格
