    layout: wide
    summary: 按发生可能性、影响、缓释成熟度和剩余严重度，方向性比较 OfBusiness / Oxyzo 的主要风险集群。
    approximationNotes: 评分是基于留存公开证据的分析判断，不是管理层风险评级或精算概率。
