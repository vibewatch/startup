            body: >-
              OfBusiness 的公开产品故事围绕完整 SME 采购旅程展开，而不是狭窄目录。客户可以直接进来做原材料寻源，也可以从招标发现和价格情报切入。官网首页文案把公司定位为原材料采购与信贷平台，覆盖 500+
              品类、300K+ 多品牌 SKU、应用和网页订单透明度，以及实时追踪。供应商门户也把卖方工作流讲得很清楚：入驻被包装成三步流程，注册后分配关键客户经理，并要求供应商提供 GST、银行和 e-KYC 文档。结合
              Android
              应用描述，保留来源展示了一条具体买方工作流：发现需求、查看价格、请求报价、提交询盘、可选用信贷，然后在同一个数字界面管理交付、发票和账本。品类宽度在钢铁、化学品、聚合物、能源、有色金属和农业相邻产品等工业材料上最强，这一点在首页、供应商和应用界面上保持一致。
