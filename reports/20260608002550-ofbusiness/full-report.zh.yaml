      - number: '2.3'
        title: 买方细分、预算负责人和采纳路径
        blocks:
          - type: paragraph
            body: >-
              最相关的买方不是平均意义上的印度 SMB，而是那些足够频繁购买价格波动工业投入品、因此采购工作流和信贷都会变得重要的企业。OfBusiness
              自身材料和客户证言指向制造商、可再生材料供应商、工业零部件制造商、室内或基础设施承包商，以及需要更好价格和更可靠营运资金的供应端工厂或加工商。在这些账户里，使用者往往是采购、工厂、商务或运营团队；付款人则通常是控制投入预算的老板、财务负责人或业务单元。


              这一区分重要，因为采纳来自运营痛点，而不是抽象的软件转型命令。保留来源中最强的触发因素，是价格透明、投入成本下降、认证供应商、RFQ
              流、物流可见性，以及在同一个工作流里抹平营运资金缺口的能力。供应端入驻同样重要，因为 OfBusiness 必须维持品类深度、质量检查和运输覆盖，价格发现才可信。


              相比 IndiaMART 式发现或纯市场论点，OfBusiness 试图解决的问题更难，但潜在粘性也更强：如何让既在意供应连续性、又在意现金转化的企业，把经常性原材料采购管起来。因此，这个模式最好理解为采购 +
              金融 + 执行，而不是简单的需求聚合层。
