      - number: '1.3'
        title: 融资历史、投资者版图与 IPO 定位
        blocks:
          - type: paragraph
            body: >-
              OfBusiness 的融资台阶很长：2016 年从 $5 million Series A 起步，经过 2018 年和 2019 年的增长轮，随后在 2021 年用多个估值标记陡然提速。Dealroom 记录了
              2021 年 4 月估值 $800 million 的 $110 million 轮、2021 年 7 月 SoftBank 领投且估值 $1.6 billion 的 $160 million 轮、2021 年
              9 月估值 $3.0 billion 的 $200 million Tiger 轮，以及 2021 年 12 月估值 $5.0 billion 的 $325 million Series G。这个序列是第 1
              章的标准融资弧线，因为它同时解释了投资者名单，以及后来围绕当前估值的争论。


              投资者版图在官网上标得异常清楚。Tiger Global、Norwest Venture Partners、SoftBank、Matrix Partners、Falcon Edge、Creation
              Investments 和 Zodius Capital 都直接出现在投资者页面；后期新闻则在 IPO 前加入 Cornerstone Ventures。仍不清楚的是，2024 年二级交易、2025 年
              Cornerstone 轮和 ESOP 流动性之后，各方的准确持股。Tracxn 与 Dealroom 对历史总融资额也不一致，这说明至少一个数据集把债务、二级交易或其他不可比工具纳入了口径。


              IPO 信号真实，但仍是暂定。Reuters 报道的目标发行规模为 $750 million 至 $1 billion，并点名 Bank of America、Citi、JPMorgan、Morgan
              Stanley 和 Axis Capital 为投行；另一篇 Reuters 报道则引用了未经确认的 $6 billion 至 $9 billion 估值目标。这个目标需要与更冷静的 2024 年二级市场约 $4
              billion 标记对照。换句话说，公司显然已经走在上市通道上，但公开证据仍支持一组估值叙事，而不是一个已经落定的 IPO 前数字。
