      - number: '2.5'
        title: 约束、互相矛盾的估算与估值相关性
        blocks:
          - type: paragraph
            body: >-
              这个市场最容易犯的错，是把数字 B2B 采购写成纯软件故事，或纯广义商务 TAM 故事。公开来源显示机会很大，也显示摩擦真实存在。Bessemer 仍认为如今只有 10% 的 MSME
              在线交易；6Wresearch 提示数字基础设施缺口和运营成本；ISM India 强调能力和供应商风险约束；RBI 的数字贷款制度又让嵌入式信贷更重合规。即便战略逻辑很强，这些摩擦也会放慢采纳。


              规模估算也需要纪律。US$200 billion 的外层 B2B 机会、US$220 billion 的数字 SME 信贷缺口，以及 US$397 billion 的可触达 MSME
              信贷缺口都有用，但它们描述的是不同人群和定义。应把它们当作边界口径，而不是可相加 TAM。因此，本章把分析型 SAM 和 SOM 区间明确标为低置信度。


              估值上的关键含义是：OfBusiness 所处品类增长空间很长，但公开可比公司的质量参差。收入规模真实，但这个模式背着营运资金、物流和监管负担，比纯抽佣率或 SaaS 生意更难。投资者应先要求品类
              GMV、抽佣率、信贷账簿结构和产品级披露，再把头部市场空间换算成干净的投资倍数。
