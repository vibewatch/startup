  - id: TV005
    title: 投资假设失效与止损触发器表
    columns:
      - 触发器
      - 阈值或观察
      - 为何重要
      - 行动含义
    rows:
      - - IPO 申报延误
        - 又一个报道周期后，仍没有公开 DRHP 或可信申报时间表
        - 故事会从已观察到的定价退回纯愿景。
        - 向悲观区间移动，并要求更深折价。
      - - Oxyzo 信贷恶化
        - 无抵押占比明显上升，或资产质量指标逼近评级机构的负面触发条件
        - 削弱集团内部最透明的利润引擎。
        - 下调区间，把尽调重点放到信贷账龄批次损失。
      - - 母公司披露不及预期
        - 最新审计显示利润率、利润转化或营运资本强度比 FY24 暗示的更差
        - 削弱任何高于 2024 年二级交易估值的溢价逻辑。
        - 把案例重锚到 $3-4 billion。
      - - IPO 市场疲弱持续
        - 新经济发行继续低于此前私募估值定价
        - 公开市场簿记中，$6-9 billion 区间更难站住。
        - 参与前要求看到折价发行价格的证据。
      - - 正向去风险
        - 已提交 DRHP、最新母公司审计、Oxyzo 资产质量稳定
        - 这是乐观情形所需的精确三件套。
        - 只有届时才考虑支付高于旧 $5 billion 锚点的价格。
    notes: 这些触发器同时包含公司证据和市场证据，因为 OfBusiness 已在 IPO 路径上；最终清算价格取决于两者。
    claimRefs:
      - CV018
      - CV019
      - CV037
      - CV039
      - CV040
      - CV044
      - CV046
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 尽调路径
    rows:
      - - 母公司经审计财务
        - FY25 和 FY26 合并母公司经审计报表
        - 需要验证 FY24 盈利是否延续到 IPO 窗口。
        - 取得审计报表，或在 DRHP 提交后取得 DRHP 财务。
      - - 股权结构和股份类别
        - 完整股东名单、期权池、清算优先权和反稀释条款
        - 真实稀释和回报建模必须依赖这些信息。
        - 审阅董事会批准的股权结构表、股东协议和权利清单。
      - - DRHP / SEBI 状态
        - 申报日期、审查状态和更新后的发行结构
        - 决定 IPO 路径仍在推进还是已经漂移。
        - 跟踪 SEBI 门户、承销行材料和公司申报。
      - - 分部经济性
        - 核心商业垂直的毛利率、抽成率和营运资本强度
        - 尽管收入偏库存重，仍需这些证据来证明任何可比上市公司溢价。
        - 要求管理层提供从 GMV/采购量到毛利和 EBITDA 的桥接。
      - - Oxyzo 信贷账龄批次
        - 账龄批次损失曲线、有抵押与无抵押客群表现、集中度数据
        - 这是判断 Oxyzo 应获得估值上调还是折价的核心。
        - 审阅评级机构底层数据和贷款账簿组合包。
      - - IPO 募资用途
        - 按实体划分的新股发行偿债和增长资金配置
        - 影响去杠杆、稀释和股权故事质量。
        - 在 DRHP 或投行预路演材料中核验。
    notes: 在有价格的投资备忘录从跟踪转向买入前，这些是最低剩余问题。颗粒度足够直接放进实时尽调工作计划。
    claimRefs:
      - CV008
      - CV017
      - CV044
      - CV045
      - CV046
      - CV047
