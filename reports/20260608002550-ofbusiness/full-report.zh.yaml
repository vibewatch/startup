          detail: 制造商和承包商需要持续采购大宗商品或项目投入品
        - id: n2
          label: OfBusiness 采购层
          detail: 商贸引擎负责寻源物料、聚合供给并完成履约
          dependsOn:
            - n1
        - id: n3
          label: Oxyzo 融资层
          detail: 采购融资、发票贴现、商业贷款和设备融资为工作流提供资金
          dependsOn:
