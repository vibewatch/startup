      - number: '3.4'
        title: 耐久性、多平台采购与相对强项
        blocks:
          - type: paragraph
            body: >-
              OfBusiness 的护城河真实存在，但有条件。当买方需要在同一次采购动作里获得大宗商品价格可见性、供应商执行和营运资金支持时，它最强；只做发现的平台或一般 MSME
              贷款方会在这里留下价值。但护城河并非绝对，因为栈里的每一层都有专业对手。Moglix 在工业目录和采购系统叙事上更宽；Infra.Market 在建筑材料和自有制造重要的场景更强；IndiaMART 和
              TradeIndia 在获客线索和买方触达上结构性更优；Mintifi 以及公开或受监管 MSME 贷款方是可信的金融替代品；Udaan
              则在零售商和分销商走廊中构成获客侧威胁。因此，竞争结构是三线作战，而不是一个主导性宿敌。切换成本也不均匀：一旦信贷、供应商条款和运营执行被嵌进同一个工作流，切换成本最高；但在发现层，买方仍能到别处比价或找货，切换成本就低。实际投资结论是，OfBusiness
              在一体化工业采购 + 信贷上有可防守定位，但仍会受到品类专家、大型发现网络和日益机构化的金融竞争者冲击。
