    type: flow
    layout: standard
    summary: Oxyzo 披露的经济性仍像一门健康的利差生意，但增量增长已经在小幅压缩利润率。
    approximationNotes: 这是从披露定价和资金成本通向已报告盈利能力的概念桥接，不是对审计财报的完整勾稽。
    claimRefs:
      - CI010
      - CI018
      - CI020
      - CI024
      - CI026
      - CI027
      - CI043
    data:
      nodes:
        - id: u1
          label: 产品定价
          detail: 关键授信产品的标价从 12% p.a. 起，循环额度按使用量收费
        - id: u2
          label: 利息收入引擎
          detail: 利息收入仍是主导收入线，约占 FY25 收入的 95%
          dependsOn:
