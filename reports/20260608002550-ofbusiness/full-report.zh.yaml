      - number: '6.5'
        title: 扩张动能与集中度风险
        blocks:
          - type: paragraph
            body: >-
              最强的扩张路径，是在同一运营关系里扩大钱包份额。采购客户的需求从寻源延伸到执行、应收账款、资本开支和抵押借款后，可以叠加采购融资、供应商融资、应收账款贴现、工作订单融资、设备融资、商业贷款或房产抵押贷款。这在战略上有吸引力，因为它不需要另起一套获客体系，就能提高转换成本。不过，集中度和披露风险仍然实质存在。CARE
              称，2025 年 Oxyzo 的 AUM 约 34–36% 是无抵押，且无抵押板块——主要是营业额超过 ₹200 crore 的 SME——需要在账簿经历周期时继续监控。Moneycontrol
              也显示，Oxyzo 要继续加深 SME 参与，依赖多元化银行、NBFC 和资本市场资金，因此客户扩张部分绑定资金方信心和流动性。公开证据也证言偏多、分段模糊：公司在标题式营销里混用订单、赋能
              SME、应用用户、供应商和融资借款人，却不给出大客户敞口或客户群组拆分。因此，在资料室证据补齐缺口前，投资者可以相信客户广度，但不能把集中度和耐久性视为已被证明。
