  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出，以及为什么 OfBusiness 比泛 B2B 更窄
        blocks:
          - type: paragraph
            body: >-
              OfBusiness 应被限定为一体化原材料采购与嵌入式金融平台，而不是所有印度 B2B 商务的万能代表口径。首页和关于页面把公司放在 7
              条以上供应链中——钢铁、铝、农业、石油和能源、聚合物、化学品以及相邻工业品类；供应商门户则展示低碳钢、有色金属、聚合物和包装、化学品、能源和石油等具体履约品类。因此，商业上要完成的任务，是为制造商、承包商和工业买方反复采购材料；这些买方关心价格发现、交付确定性和现金流支持，而不只是泛目录浏览。


              纳入口径应覆盖原材料采购、供应商发现、报价和 RFQ 工作流、物流协调，以及采购融资或发票贴现等与采购绑定的金融。排除项应包括纯 B2C
              零售、没有履约或金融层的泛横向分类信息，以及无法控制材料流的无关软件预算。OfBusiness 自身材料强调了这一区分：它把采购与 BidAssist、Nexizo 和 Oxyzo 配在一起，让业务更像工作流 +
              贸易平台，而不是信息列表市场。这个区分对投资判断重要，因为它缩小了直接市场，却让产品在运营上更有粘性。
