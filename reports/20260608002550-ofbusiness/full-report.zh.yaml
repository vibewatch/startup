  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 重要性
      - 最佳公开代理指标
      - 对分析的影响
      - 精确尽调路径
    rows:
      - - 母公司在手现金、烧钱速度和跑道
        - 需要判断 IPO 和增长计划前的融资依赖
        - Oxyzo 流动性披露和母公司盈利头条
        - 阻碍完整的母公司层面偿付能力和稀释评估
        - 要求提供母公司月度现金桥、债务到期和 12-18 个月跑道情景
      - - 实际采购抽佣率 / 品类利润率
        - 需要判断贸易层的收入质量和毛利耐久度
        - 汇总 FY24 收入、EBITDA 利润率和费用率
        - 无法清楚看出利润有多少来自采购价差，多少来自附属金融
        - 按主要品类提供发票级抽佣率、毛利和折扣瀑布
      - - CAC、销售周期和回本周期
        - 需要测试规模上升后增长是否变贵
        - 公开产品页面展示审批承诺，但不展示漏斗效率
        - GTM 效率和复购经济性定义不足
        - 按队列提供获客成本、转化漏斗、销售周期、复购率和回本周期
      - - 无抵押账簿队列细节
        - 需要压力测试周期后段信用损失，而不是依赖时点 NPA
        - 公开来源只披露无抵押占比和总量 GNPA / NNPA
        - 限制对 Oxyzo 账簿中最高风险部分的下行分析
        - 提供无抵押账户的队列曲线、PAR 桶、行业组合和违约损失率
      - - 新业务盈利贡献
        - 需要判断 GoldenPi、信用基金和管理人业务是在分散利润，还是只是在消耗资本
