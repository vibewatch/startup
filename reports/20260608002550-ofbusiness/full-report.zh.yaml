      - number: '8.2'
        title: 母公司盈利能力、Oxyzo 申报证据与悬而未决项
        blocks:
          - type: paragraph
            body: >
              最强的估值支撑证据不是 IPO 噪音，而是公开来源里已经可见的经营证明。OfBusiness 报告 FY24 营业收入 Rs 19,296.27 crore、合并净利润约 Rs 603
              crore；Financial Express 另称 FY24 营业利润为 Rs 666 crore，管理层目标是在三到五年内把 EBITDA 利润率从约 3.6% 提升到 5%
              以上。这些数字说明，OfBusiness
              不是典型烧钱型市场平台；它已经达到有意义的规模，并进入净利润为正的区间。即便如此，业务组合仍然重要。相当一部分收入来自存货贸易和与营运资本绑定的商业活动，而不是纯软件或抽佣率模型，这限制了公开市场互联网倍数可套用的激进程度。


              第二个主要支撑是放贷子公司 Oxyzo。这里的公开证据更强，因为公司发布年报，也被评级机构跟踪。Oxyzo FY25 年报披露总收入 Rs 1,211 crore、PAT Rs 339 crore、资产 Rs
              9,236 crore、未偿债务 Rs 6,028 crore、客户基础超过 3.8 lakh、GNPA 1.09%、CRAR 34%。2026 年 3 月 ICRA 覆盖随后显示，截至 2025 年 12 月
              31 日，9M FY26 总收入 Rs 1,048 crore、PAT Rs 267 crore、贷款账簿约 Rs 9,501 crore；FY26 新闻报道后来称收入 Rs 1,494 crore、PAT Rs
              375 crore、贷款账簿 Rs 10,545 crore。这有助于支撑估值区间上半段，但不能消除悬而未决项。CARE 和 ICRA 仍把高速增长、组合账龄成熟度，以及 34–36%
              无抵押账簿列为现实风险因素。公开来源也识别出主要投资者和所有权比例，但没有披露清算优先权、反稀释保护或完整 IPO 前股权结构表，因此稀释测算仍不完整。
