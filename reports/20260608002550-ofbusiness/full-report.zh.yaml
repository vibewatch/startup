            body: >-
              更广的架构是模块化、按工作流定制的，而不是单体 B2B 店面。OfBusiness 的关于页面称，公司从上游 BidAssist 起步，提供大型招标语料和配套投标文件访问；随后叠加 Nexizo
              做价格情报和买方发现，再把客户导入 OfBusiness 寻源和 Oxyzo 融资。BidAssist 自己的网站补充了细节：平台不只是招标列表，还暴露历史结果、文档智能、AI 驱动短名单，以及可接入 ERP
              或采购系统的 Tender API。Nexizo 则把栈延伸到销售、库存、生产和物流工作流，并声称兼容更大的 ERP 和 CRM
              环境。公开技术证据仍是商业级，而非工程级；我们能看到模块、数据产品和集成主张，但看不到底层系统设计、可用性承诺或 API 参考细节。这意味着产品架构可以在层级上较有信心地绘出，但低层实现细节仍是尽调缺口。
