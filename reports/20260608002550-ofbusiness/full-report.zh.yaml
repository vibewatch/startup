      - number: '1.2'
        title: 领导层可见度、治理信号与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              公开可见的领导层仍围绕创始团队展开。官方团队页仍突出展示 Asish Mohapatra、Bhuvan Kumar Gupta、Ruchi Kalra 和 Vasant Sridhar；第三方数据库也继续把
              Mohapatra 标为联合创始人兼 CEO、Gupta 标为联合创始人兼 CTO、Kalra 标为联合创始人和财务负责人。Reuters 还在 IPO 流程中将 Bhavesh Keswani 识别为
              CFO。这一点重要，因为上市准备期间，对外面对资本市场的管理层梯队不只有 CEO，CFO 也在其中。


              保留报道中最主要的领导层负面变化，是 Nitin Jain 在 OfBusiness 和 Oxyzo 任职约十年后，于 2026
              年离开。这件事本身不会打断公司的连续性叙事，因为其余创始人群体看起来仍然活跃，但它确实在敏感时点提高了关键人集中度。公司正向公开市场投资者推介一个具规模、盈利、一体化的平台，同时又在简化结构、整合子公司。这个窗口期内，任何创始人离开都值得跟踪，即使留任领导层已经扎根且公开可见。


              治理披露足以识别管理者，但判断监督质量仍然偏薄。现有来源更擅长展示高管，而不是展示控股公司层面的董事会构成、委员会分工，或真正独立董事的平衡。公司已经转为公众实体，因此这个缺口值得注意，但还不致命。后续尽调因此不能只因法律状态变化，就假设公司已有扎实的上市公司治理；正式董事会证据仍需直接从申报文件或最终招股书中收集。
