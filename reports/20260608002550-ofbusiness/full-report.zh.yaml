  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 乐观逻辑
      - 反向逻辑
      - 改变判断的条件
    rows:
      - - 母公司经营证明
        - FY24 收入 Rs 19,296 crore、净利润约 Rs 603 crore，说明 OfBusiness 已有规模且盈利。
        - 收入仍包含库存商品和制造相关经济性，因此质量低于软件式市场平台。
        - 经审计 FY25/FY26 母公司报表，含分部细节和稳定利润转化。
      - - Oxyzo 支撑
        - Oxyzo 带来一个盈利且披露较充分的金融臂，FY25 PAT 为 Rs 339 crore，FY26 PAT 为 Rs 375 crore。
        - 评级机构仍把增长速度、账本成熟度和 34-36% 无抵押账本列为监测事项。
        - 再有一年干净的信贷表现，并改善账龄披露。
      - - IPO 路径
        - 转为公众公司并取得投行委任，说明上市流程真实推进。
        - 留存来源中没有公开 DRHP 或可见 SEBI 里程碑，说明路径尚未去风险。
        - DRHP 申报完成并更新时间表后，估值可更接近乐观区间。
      - - 当前市场标记
        - 2024 年约 $4 billion 的老股交易是仍有效且可辩护的锚点。
        - 最新 Rs 100 crore 轮未披露估值，不能替代老股交易作为价格证据。
        - 一笔规模更大、披露价格更高的新股或老股交易。
      - - 公开可比公司支撑
        - IndiaMART 和 PB Fintech 显示，公开市场仍奖励有规模的数字平台。
        - 这些平台资产更轻、透明度更高，因此倍数不应直接搬到 OfBusiness。
        - 证明 OfBusiness 的商贸 + 信贷混合模式能维持高于投资者当前假设的利润率。
      - - 股权结构悬而未决
        - 公开资料识别了主要投资者和发起人持股。
        - 优先股堆叠、反稀释条款和 IPO 前完整持股经济性仍未披露。
        - 完整股权结构表和股东权利明细。
    notes: 反向逻辑更多来自披露质量和业务组合调整，而不是需求风险。OfBusiness 可能是一家好公司，但价格不对时仍可能不是好投资。
