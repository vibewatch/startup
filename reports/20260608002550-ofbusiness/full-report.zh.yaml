  - id: TI004
    title: 资本充足性表
    columns:
      - 项目
      - 最新公开数值 / 状态
      - 来源窗口
      - 重要性
      - 投资判断
      - 尽调追问
    rows:
      - - Oxyzo 2026 年 3 月净资产和 CRAR
        - 净资产约 ₹3,327 crore；CRAR 约 28.84-29%
        - FY26 媒体报道
        - 显示又一年增长后，资本仍显著高于监管底线
        - 正面，但方向上低于更早检查点
        - 提供经审计 FY26 单体和合并资本结构
      - - Oxyzo 2025 年 12 月净资产和 CRAR
        - 净资产 ₹3,195 crore；CRAR 32.1%；杠杆率 2.2x
        - ICRA 2026 年 3 月报告（9M FY26）
        - 给出接近当前、有评级背书的资本和杠杆检查点
        - 正面；仍舒适，距 4x 杠杆警戒线有空间
        - 分享 2026 年 1-3 月月度杠杆和流动性趋势
      - - Oxyzo FY25 年末资本快照
        - 净资产 ₹2,943 crore；CRAR 34%；LCR 327%
        - FY25 年报
        - 确认进入 FY26 时资本和流动性底子强
        - 为持续扩张提供正面基础
        - 对齐年报 CRAR 与评级机构方法
      - - 未偿债务 / 新增债务融资
        - 未偿债务 ₹6,028 crore；FY25 新增债务 >₹3,500 crore
        - FY25 年报
        - 显示资产负债表增长靠真实负债市场渠道融资
        - 融资渠道正面，但再融资依赖上升
        - 提供贷款方集中度、加权债务成本和到期梯
      - - 未来 12 个月流动性覆盖
        - 到期债务约 ₹3,366 crore，对应预期流入约 ₹6,428 crore，另有 ₹1,058 crore 流动性和约 ₹937 crore 未使用授信
        - ICRA 2026 年 3 月报告
        - 公开证据显示短期流动性缓冲强
        - 正面，前提是回款保持稳定
        - 提供 2026 年 3-6 月实际回款和展期表现
      - - 有抵押与无抵押组合
        - ~64-66% 有抵押，~34-36% 无抵押，截至 2025 年末
        - ICRA / CARE 2025 年报告
        - 公开资料中，无抵押增长是最清晰的风险变量
        - 当前可接受，但若增长进一步转向无抵押，需要持续监控
        - 提供无抵押队列的放款年份、行业和单笔规模组合
      - - 母公司支持和所有权
        - OFB Tech / OfBusiness 在 2024-2025 年仍持有约 70%
        - ICRA / CARE 报告
