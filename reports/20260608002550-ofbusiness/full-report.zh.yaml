  - id: FV003
    title: 估值 / 回报区间
    type: range
    summary: 悲观、基准和乐观估值区间，以及概率加权中枢。
    approximationNotes: 所有数值均为分析师估算，单位为十亿美元，依据已观察到的融资锚点、FY24 母公司收入、Oxyzo 申报证据以及 2026 年 6 月公开可比公司环境。
    data:
      items:
        - label: 悲观
