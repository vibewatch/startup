      - number: '2.4'
        title: 嵌入式金融、监管轨道与宏观驱动
        blocks:
          - type: paragraph
            body: >-
              这个品类不能没有嵌入式金融层；它是市场存在的原因之一。IBEF、Redseer 和 SIDBI 都指向庞大的 MSME 融资缺口；SIDBI 还明确把 GeM、TReDS 和正规化举措放进同一轮竞争力提升中。放到
              OfBusiness 身上，Oxyzo 就不只是附属放贷手臂。它提供信贷和发票贴现能力，帮助把采购需求转化为可重复交易流。


              同时，监管门槛已高于印度早期金融科技繁荣期。RBI 的 Digital Lending Directions 2025 覆盖银行、NBFC 和其他受监管贷款方，并强化了 LSP
              尽调、直接放款和还款、冷静期、披露、投诉处理、本地数据存储等要求。RBI 2025 年基于规模的 NBFC
              指引也强调，规模更大或风险更高的非银贷款方会被纳入更严监管框架。采购平台不会因此失去机会；合规质量和伙伴纪律反而会变成竞争体能的一部分。


              宏观顺风仍有建设性。GeM 显示采购可以规模化数字化；FY26 制造业 GVA 增长保持强劲；PLI 和产业政策继续支持本地化；ISM India 称，采购负责人现在除了成本，也把韧性、AI、ESG
              和供应商协作列为优先事项。这些力量支持能够把采购执行、融资和数据结合起来的平台。
