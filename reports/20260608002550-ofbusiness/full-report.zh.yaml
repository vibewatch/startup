        - 供应商门户收集 GST、支票和 e-KYC 文件，再分配 KAM
        - 卖家激活更快，公开入驻费用为零
        - 公共门户未披露付款政策或供应商分析
      - - 营运资金支持的采购
        - 买方等现金到位后才下单
        - Oxyzo 采购融资按发票直接付款给供应商，并提供 60-120 天还款期
        - 可能降低采购成本，并让营运资金周转更顺
        - 缺少承销模型和批准率透明度
