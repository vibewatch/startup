  - id: FV004
    title: 投资 KPI
    type: kpi
    summary: 投委会式评分，覆盖验证、经济性、风险和估值。
    approximationNotes: 评分为 1-5 分的分析师判断（5 分最好），依据截至 2026-06-08 的公开证据，而非管理层指引或私有数据室材料。
    data:
      items:
        - label: 市场机会
          score: 4
          detail: 印度 B2B 采购叠加 MSME 金融，结构性空间仍大，还能支撑 IPO 兴趣。
        - label: 经营验证
          score: 4
          detail: FY24 母公司盈利与规模已经落地，不只是叙事。
        - label: Oxyzo 支撑
          score: 4
          detail: 公开年报和评级机构证据表明，信贷业务是真正的估值支撑。
        - label: 披露质量
          score: 2
          detail: 母公司 FY25/FY26 审计、分部利润率和优先股经济条款仍缺失。
        - label: 风险画像
          score: 2
          detail: IPO 时点风险和 Oxyzo 无抵押账簿待观察项限制上行空间。
        - label: 估值支撑
          score: 3
          detail: 约 $4 billion 的二级交易估值有支撑；$6-9 billion 区间尚未去风险。
        - label: 证据质量
          score: 3
          detail: 申报文件和市场数据覆盖足以支撑估值区间，但还不足以承销完整乐观情景。
    claimRefs:
      - CV009
      - CV010
      - CV013
      - CV015
      - CV019
      - CV035
      - CV042
      - CV043
      - CV044
