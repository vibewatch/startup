        - 卖家等待买方付款，或使用银行透支
        - Oxyzo 发票贴现通过追索结构变现选定发票
        - 无需融资整个应收账款池，也能改善流动性
        - 买方集中度和损失假设未公开
      - - Capex 扩张或设备采购
        - 单独寻找银行贷款，经历漫长书面流程
        - Oxyzo 商业贷款和机械融资把同一借款人关系延伸到定期信贷
