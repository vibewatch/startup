companyProfile:
  summary: >-
    OfBusiness 是一家 2015 年成立的印度 B2B 商务与嵌入式金融平台，运营主体为 OFB Tech Limited。公开证据显示，它的一体化栈横跨 BidAssist 招标发现、Nexizo
    大宗商品与买方情报、原材料采购和履约，以及面向成熟 SME 与新兴企业的 Oxyzo 营运资金融资。集团已进入正式 IPO 准备，但母公司层面的披露仍落后于 FY24 和 Oxyzo 更透明申报中呈现的规模与盈利故事。
