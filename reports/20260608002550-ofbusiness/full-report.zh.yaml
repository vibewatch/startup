  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 概率信号
      - 估值区间
      - 核心假设
      - 主要失效模式
    rows:
      - - 悲观
        - 25%
        - $3.0B-$4.0B
        - IPO 时点后移，2026 式风险厌恶持续，投资者惩罚库存重收入和 Oxyzo 无抵押账本监测项。
        - IPO 窗口继续关闭，或下一笔活跃市场标记低于 2024 年二级交易估值。
      - - 基准
        - 50%
        - $4.0B-$5.2B
        - FY24 母公司盈利基本守住，Oxyzo 继续交出干净的信贷指标，披露有所改善，但仍达不到完整上市公司透明度。
        - 投资人接受约 $5 billion 的旧估值锚点，但不愿把价格抬到管理层期待的 IPO 区间。
      - - 乐观
        - 25%
        - $6.0B-$7.0B
        - 母公司提交 DRHP 并附带最新审计，利润率改善清晰可见，Oxyzo 资产质量在 IPO 路演前仍保持强劲。
        - 市场环境或新申报材料无法支撑额外的倍数扩张。
      - - 概率加权中枢估计
        - 100%
        - $4.6B-$4.9B
        - 中点结果反映已观察到的锚点，而不是管理层愿景。
        - 若接近 $9 billion 出价，就等于在证据出现前过度押注乐观情形。
    notes: 情景区间为分析师估算，锚定已观察到的二级交易定价、FY24 母公司收入、Oxyzo 申报证据以及 2026 年 6 月可比上市公司数据，并非管理层指引。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
      - CV041
      - CV046
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司或锚点
      - 状态 / 日期
      - 估值或倍数锚点
      - 对 OfBusiness 的参考意义
      - 局限
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the decision-useful valuation anchors visible as of the 2026-06-08 run date: the latest OfBusiness
        financing signals, the current IPO ask, and the most comparable Indian listed digital-platform benchmarks with
        readable market-data pages. It is not an exhaustive survey of every listed industrial, marketplace, or fintech
        company.
    rows:
      - - OfBusiness 最新一级融资
        - 2025 年 4 月，非公开
        - Cornerstone Ventures 投资 Rs 100 crore；估值未披露
        - 说明资本仍愿意进入，公司也仍朝 IPO 推进。
        - 规模太小、披露太少，不能作为硬性的估值重置。
      - - OfBusiness 二级交易
        - 2024 年 10 月，非公开二级交易
        - 约 $4 billion 隐含估值
        - 因为时间近、贴近拟议 IPO 窗口，是当前最好的活跃市场锚点。
        - 二级交易价格可能反映流动性因素，而不是完整机构尽调后的定价。
      - - OfBusiness Series G 轮
        - 2021 年 12 月，定价股权轮
        - $325 million 融资，估值约 $5 billion；其中包括 $140 million 二级交易
        - 最后一轮大型硬一级估值，仍是重要历史锚点。
        - 形成于更强的私募市场环境，如今已明显过时。
      - - IndiaMART
        - 上市公司，2026 年 6 月
        - 市值约 $1.25 billion；按 Screener 数据约为最近 12 个月收入的 7.5x
        - 对有规模、披露透明的印度 B2B 市场平台，是有用的上市基准。
        - 资产轻、没有贷款账簿，使模型更干净，也应享有更高收入倍数。
      - - PB Fintech
        - 上市公司，2026 年 6 月
        - 市值约 $7.4 billion；按 Screener 数据约为最近 12 个月收入的 10.3x
        - 显示印度有规模且盈利的数字分销平台，公开市场投资人仍愿意给出怎样的定价。
        - 披露好得多、营运资本需求更轻，库存敞口也低于 OfBusiness。
      - - 报道中的 IPO 目标
        - 2024-2026 年 IPO 前报道
        - $750 million-$1 billion IPO 对应 $6-9 billion 目标区间
        - 定义了管理层和投行试图触达的价格带。
        - 保留来源中尚无公开 DRHP 或最新母公司审计来支撑上限。
    notes: 可比上市公司倍数只作为方向性护栏，不作为直接转移价格。OfBusiness 的商业 + 信贷混合模式，相比资产轻互联网同行需要折价。
    claimRefs:
