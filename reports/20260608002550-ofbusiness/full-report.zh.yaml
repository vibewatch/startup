      - number: '8.4'
        title: 情景区间、最终立场与尽调问题
        blocks:
          - type: paragraph
            body: >
              情景分析很直接。熊市情景下，IPO 窗口拉长，风险偏好仍弱，投资者聚焦大宗商品相关收入质量和 Oxyzo 无抵押账簿监控项；这支撑 $3.0–4.0 billion 区间。基准情景下，OfBusiness 保住
              FY24 利润画像，Oxyzo 继续打出稳健信贷指标，最终 IPO 流程在披露更好但不完美的情况下过关；这支撑约 $4.0–5.2 billion。牛市情景下，公司提交
              DRHP，带来母公司最新经审计数字，证明利润率和资本纪律仍守得住，并进入更友好的 IPO 盘面；这可支撑约 $6.0–7.0 billion。因此，概率加权重心在约 $4.6–4.9 billion，而不是
              $6–9 billion 的标题区间。


              由此得到清晰立场：跟踪，中等置信度，高风险。公司规模和盈利能力都不容忽视，但价格敏感性真实存在。约 $4 billion 时，二级交易看起来站得住；约 $5 billion 时，估值仍可由规模和 Oxyzo
              支撑来解释；高于 $6 billion 后，立场转为偏紧，因为市场需要提前为尚未公开的披露和 IPO 执行付费。最重要的尽调问题是具体的，而不是抽象的：FY25/FY26
              母公司经审计报表、股权类别和清算优先权细节、实时 DRHP 或 SEBI 状态更新、细分层级毛利率或抽佣率证据，以及 Oxyzo 信贷 vintage 数据。如果这些材料干净到位，区间可以上移。如果 IPO
              时点再次滑坡，或 Oxyzo 信贷质量转弱，区间应快速下调。
