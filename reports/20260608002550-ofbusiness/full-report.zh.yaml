      - number: '7.2'
        title: 信用、融资与资产负债表风险
        blocks:
          - type: paragraph
            body: >-
              最实质的风险仍是信贷成熟度，而不是当前盈利能力。CARE 2025 年 12 月的说明称，Oxyzo 约三分之一 AUM
              是无抵押，并明确称该板块需要监控，同时仍把流动性和资本化水平描述为充足。这是很强的起点，但不是风险已经出清。FY26 结果改善了表层资产质量叙事——总 NPA 降至 0.74%，净 NPA 降至约
              0.28–0.30%——但同一批公开结果也显示，随着资产负债表扩张，资本充足率较前一年下降。Entrackr 仍显示净资产和流动性盈余健康，但当一家 SME
              贷款机构进入更复杂的市场环境时，变化方向比绝对缓冲更重要。


              资金依赖是第二层风险。Oxyzo 2025 年继续募集有担保 NCD 资本，包括 2 月发行的一笔 9.75% 票息、110% 抵押覆盖的 NCD，随后又募集更大规模的 ₹533 crore 债务来支持 SME
              信贷投放。这些交易显示当前资金方需求强劲，但也证明这个模型要持续滚动增长，仍需要反复进入资本市场并维持银行合作关系。如果利差扩大或续作意愿减弱，增长可能在资产质量明显恶化前先放慢。换句话说，当前流动性降低了短期偿付风险，但没有消除作为战略依赖的融资风险。
