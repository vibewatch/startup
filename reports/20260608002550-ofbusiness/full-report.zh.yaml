            body: >-
              母公司业务已可证明盈利，但利润率画像仍像一个重营运资金品类里的高效运营商，而不是轻资本平台。Economic Times 和 Entrackr 把 FY24 净利润放在约 ₹603 crore，对应
              ₹19,296 crore 经营收入。Entrackr 还披露 7.44% EBITDA 利润率、12.33% ROCE，以及每 1 卢比经营收入对应 ₹0.97
              费用强度。这些数字体面且方向上在改善，但也显示经济性更多由库存商品、材料消耗和运营杠杆塑造，而不是纯经常性软件收入。


              Oxyzo 给出了更干净的公开单位经济数据集。FY25 年报、ICRA 和 CARE 都显示，这是一家 NIM 约 8.2-8.5%、RoA 约 3.6-4.4%、GNPA 接近 1% 的贷款业务。Head
              and Tale 称利息收入贡献了 FY25 收入约 95%，进一步说明这是一门经典利差生意，费用收入仍居次。FY26 报道仍健康，但并非毫无摩擦：Economic Times 称，随着资产负债表扩张、融资成本和
              opex 上升，运营收入增长 23%，净利润率则回落至 25.2%。聚焦 SME 的 NBFC 能做到这一步，盈利能力仍然很强；但投资判断应预期利润率会随着杠杆上升和有抵押 / 无抵押组合变化而正常化。
