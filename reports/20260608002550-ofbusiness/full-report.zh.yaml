      - number: '7.4'
        title: 执行与依赖风险
        blocks:
          - type: paragraph
            body: >-
              执行风险偏高，因为 Oxyzo 一边拓宽业务线，一边仍把速度当产品卖。公司营销最高 ₹5 crore 的无抵押商业贷款，承诺 48
              小时审批和全数字化流程；这在商业上有吸引力，但运营容错很低：欺诈控制、定价纪律、服务质量或催收任何一环滑坡，都可能迅速伤害单位经济模型和声誉。Oxyzo 自己的材料也提醒借款人，持续 EMI 违约可能导致 NPA
              分类、法律追偿，以及有担保案件中的抵押品扣押；这凸显风控错误多快会变成运营和法律事件。RBI 当前 NBFC 指引也强化了这一点：数字贷款、LSP 和 DLG 结构被视为明确受监管活动，而不是边缘试验。


              依赖仍然重要，尽管它们并不明显集中在单一交易对手。Entrackr 显示，资金来源分散在大型银行、NBFC 和资本市场工具之间；VCCircle 和 ET 则显示，公司同步进入私募信贷和 GoldenPi
              主导的固收分销。这扩大了机会，也增加了银行伙伴、资本市场投资者、产品团队和合规负责人之间的整合与治理负担。因此，依赖图谱的核心不是某一个生死攸关的伙伴，而是管理层能否在母公司进入 IPO
              市场前，协调多条受监管渠道，同时不让核心放贷引擎的执行质量滑坡。
