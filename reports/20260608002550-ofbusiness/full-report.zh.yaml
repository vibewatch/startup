        - from: d2
          to: d7
          label: 私募信贷延伸
        - from: d8
          to: d2
          label: 行为监管与审慎监管
        - from: d9
          to: d1
          label: 战略与控制
        - from: d9
          to: d2
          label: 风险偏好与流动性纪律
        - from: d9
          to: d6
          label: 整合纪律
        - from: d9
          to: d7
          label: 治理纪律
