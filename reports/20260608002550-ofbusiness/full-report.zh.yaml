  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与治理风险
        blocks:
          - type: paragraph
            body: >-
              Oxyzo 的公开风险图谱，起点不是某一个未结公开执法案，而是监管边界扩张。RBI 2025 年 11 月信贷设施指引明确覆盖 NBFC
              数字贷款、贷款服务商和违约损失担保，因此更快的远程获客或伙伴主导分销，会增加行为合规和模型风险义务，而不是把业务移到规则之外。Oxyzo
              自己的投诉流程图把这一点说得更清楚：未解决投诉先从运营团队升级到投诉官，再到首席节点官，再到内部申诉专员，30 天后最终升级到 RBI。这给投资者留下了一个可实时监控的监管触发点。


              法律风险也很具体，不是假设。2026 年 3 月，一起 Madras High Court 案件显示，Oxyzo 以有担保债权人身份诉讼，并主张 SARFAESI/CERSAI
              相对于税收债权的优先权；这直接证明，部分承压信贷可能从标准催收转入法院主导的回收。与此同时，Oxyzo 正在扩大合规版图：公司推出了 SEBI 注册的 II 类私募信贷工具，并宣布收购 GoldenPi——一个
              SEBI 注册的线上债券平台。治理在改善，但公开视角下还不完全成熟。Entrackr 报道其新增了一名独立董事，但公开投资者页面仍未披露更完整的委员会层面治理材料、董事会工作计划，或 IPO
              式控制架构；这些才足以让外部投资者更干净地评估扩张信心。
