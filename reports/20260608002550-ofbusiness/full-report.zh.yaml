chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、法律结构与一体化商业模式
        blocks:
          - type: paragraph
            body: >-
              看 OfBusiness，首先应把它视为由控股公司牵头的运营生态，而不是狭义线上市场。公司自称印度最大的 B2B 原材料采购与信贷平台，并把这一定位系在一组相互衔接的产品上：用于招标发现的
              BidAssist、用于大宗商品情报的 Nexizo、覆盖金属、化学品、农业等品类的 OfBusiness 采购与履约，以及面向 SME 的结构化融资
              Oxyzo。这个一体化栈重要，是因为公司明确把自己同时放进供应商、制造商、进口商或出口商、技术平台几个角色里，并串在同一个工作流中。


              最清晰的法律锚点是 OFB Tech Limited，前身为 OFB Tech Private Limited，CIN 为 U74140GJ2015PLC154393。官网页面和 FY24
              新闻稿显示，注册办公室在 Ahmedabad；联系页面则把总部放在 Gurugram 的 Global Business
              Park。实际尽调中，应把法律注册地与媒体报道、客户触达使用的运营中枢分开看。官方历史把业务追溯到 2015 年，这与 Tofler 的注册数据一致，尽管后续部分新闻简写偶尔使用 2016 年。


              在 B2B 商务创业公司里，OfBusiness 的运营叙事异常宽。官方材料称，公司已交付 500K+ 订单，赋能 2 million+ SME，覆盖 26 个邦和超过 15 个国家，并拥有约 4,000
              家运输商组成的物流网络，每年处理超过 150,000 票货物。这些是公司口径，不是审计后的 KPI 披露，但足以立起管理层叙事，后续章节需要检验：OfBusiness 试图服务印度 SME
              的，不是简单市场中介，而是一体化商务、制造、数据和融资平台。
