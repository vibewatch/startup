  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资锚点、最新轮次与 IPO 路径
        blocks:
          - type: paragraph
            body: >
              OfBusiness 最新披露的一级资本，并不是新的硬定价事件，而是一笔 IPO 前小额补充资金：2025 年 4 月，公司从 Cornerstone Ventures 融资 Rs 100
              crore，报道明确把该轮放在 IPO 准备语境里，而不是新的估值重置。公开报道没有披露轮次价格或投后估值，因此不应把它当作干净的估值锚。上一笔大型定价股权锚仍是 2021 年 12 月 Series G，当时
              OfBusiness 以约 $5 billion 估值融资 $325 million，其中包括规模不小的 $140 million 二级出售。更新的价格发现来自 2024 年 10 月二级交易；Economic
              Times 后来称该交易对公司的估值约为 $4 billion。对当前入场纪律而言，这笔二级交易比 2021 年牛市轮次更重要，因为它离计划 IPO 窗口近得多。


              IPO 准备是真实的。公开报道称，OfBusiness 在 2025 年 1 月转为公众公司，聘请 Axis Capital、JPMorgan、Citigroup、Morgan Stanley 和 Bank of
              America，并探索约 $750 million 至 $1 billion 的 IPO，结构混合新股发行和 OFS 老股出售。但公开证据仍没有走到已提交 DRHP 或已披露 SEBI
              审核节点。与此同时，2026 年更广泛的 IPO 市场降温，后期私募资金也变得更挑剔。这个组合很关键：没有实时申报、母公司最新审计或更清晰公开时间表时，当前围绕 $6–9 billion IPO
              估值的讨论，更像愿望，而不是已证明的出清价格。因此，估值判断应依靠可观察成交估值和已披露财务，而不是上市前标题式目标。
