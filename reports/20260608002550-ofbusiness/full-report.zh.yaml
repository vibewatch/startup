  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接的工业商务与材料同行
        blocks:
          - type: paragraph
            body: >-
              OfBusiness 最暴露的对手，不是泛供应商发现平台，而是同样想掌握经常性工业投入品工作流的公司。公开证据中最接近的直接同行是 Moglix、Infra.Market、JSW One MSME 和
              Power2SME；NowPurchase 和部分 Zetwerk 用例则是更窄的替代品。Moglix 在工业目录和企业采购叙事上最宽：其商业网站称公司是亚洲最大的 B2B 商务公司之一，引用 $2.6
              billion 估值，并称覆盖 700,000+ 工业品、19,000+ 邮区编码、1,000+ 大型制造商和 3,000+ 工厂。Infra.Market
              形态不同，但在建筑权重高的账户中仍有直接威胁，因为它结合了直送工地、多产品建筑目录、283+ 制造设施和 17,256 个零售触点。JSW One MSME
              更窄，但在钢铁和水泥权重高的工作流中很有力，因为采购信任和品类明确性比横向宽度更重要。Power2SME 仍然相关，因为它较早但仍明确的画像，把原材料聚合与金融准入配在一起，是 OfBusiness
              现在推介的一体化模式的功能性前身。Zetwerk 和 NowPurchase 不是那么通用的替代品：当客户痛点是外包制造或金属工厂流程控制，而不是广义原材料采购时，它们才更重要。
