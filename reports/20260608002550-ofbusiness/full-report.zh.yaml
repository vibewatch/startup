      - number: '3.3'
        title: 嵌入式金融对手与公开包装
        blocks:
          - type: paragraph
            body: >-
              金融层让 OfBusiness 与纯市场平台的比较明显变难，因为 Oxyzo 发布的是真正的采购融资产品，而不只是线索表单。Oxyzo 披露，无抵押额度最高可达 ₹5 crore，利率从 12% 起，48
              小时审批，期限 60-120 天，并具备直接向供应商付款和 RBI 注册。这样看，Mintifi 是公开来源中最清晰的金融侧同行：Business Standard 和 Moneycontrol
              都把它描述为一个覆盖 300+ 品牌的供应链金融平台，已融资 $180 million，每年处理超过 $3 billion 发票，并通过自有 NBFC 加合作贷款方放款。Lendingkart、InCred 和
              UGRO 都在争夺同一块营运资金预算，但它们公开页面将产品包装成一般 MSME 贷款、无抵押企业贷款或渠道金融，而不是采购原生寻源。监管门槛也重要。RBI 的 Digital Lending Directions
              提高了对 LSP 尽调、直接放款和还款、披露与数据控制的期待，这利好能展示清晰受监管实体责任的贷款方。落到实操，OfBusiness
              竞争的不只是“谁能更便宜地找到钢材或化学品”；它还在竞争谁能以足够信任度，对这条采购流完成承销、放款和服务，从而赢得重复使用。
