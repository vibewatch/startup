companyProfile:
  summary: OfBusiness is a 2015-founded Indian B2B commerce and embedded-finance platform operating under OFB Tech Limited. Public evidence shows an integrated stack spanning BidAssist tender discovery, Nexizo commodity and buyer intelligence, raw-material procurement and fulfillment, and Oxyzo working-capital finance for established SMEs and emerging corporates. The group has entered formal IPO preparation, but parent-level disclosure still trails the scale and profitability story visible in FY24 and in Oxyzo's more transparent filings.
