  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-opacity
    missingEvidence: Account-level realized pricing, take rates, and discounting terms for OfBusiness, Mintifi, and major MSME lenders across comparable customer cohorts.
    whyItMatters: Public pages describe product shape but not realized commercial terms, which limits clean switching-cost and margin comparisons.
    diligencePath: Request side-by-side term sheets, realized APR bands, invoice-tenor mixes, and renewal behavior for matched customer cohorts.
    relatedQuestionRefs:
    - QP018
    - QP025
    relatedTableRefs:
    - TP003
  - type: missing-source
    severity: material
    topic: customer-overlap
    missingEvidence: Named or anonymized account overlap showing where OfBusiness wins or loses against Moglix, Infra.Market, JSW One MSME, and IndiaMART at the customer level.
    whyItMatters: Without overlap and win-rate evidence, the chapter can classify rivals but cannot quantify true switching cost or competitive intensity by vertical.
    diligencePath: Ask management for top-50 account overlap, multi-vendor sourcing behavior, and recent competitive-loss analyses segmented by vertical.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP001
    - TP004
  - type: private-evidence-only
    severity: material
    topic: credit-performance-comparability
    missingEvidence: Comparable loan-book quality, delinquency, and loss data for Oxyzo, Mintifi Finserve, and public MSME lenders serving similar procurement-linked customers.
    whyItMatters: The strongest public finance competitors are differentiated as much by underwriting quality as by distribution, yet those outcomes are mostly undisclosed in retained sources.
    diligencePath: Request vintage curves, NPA buckets, recoveries, and partner-lender economics for procurement-linked portfolios versus general MSME books.
    relatedQuestionRefs:
    - QP018
    - QP020
    relatedTableRefs:
    - TP003
