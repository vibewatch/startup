- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale / funding signal
  - Target segment
  - Key strength
  - Key limitation
  rows:
  - - OfBusiness
    - Integrated industrial procurement + credit
    - 500K+ orders delivered; 2M+ SMEs; 26 states; 15+ countries
    - Manufacturers, contractors, and industrial buyers buying recurring raw materials
    - Combines sourcing, price discovery, and NBFC-backed working capital in one workflow
    - Public disclosure on realized pricing, customer overlap, and win rates remains thin
  - - Moglix
    - Industrial procurement and B2B commerce
    - $2.6B valuation; 700K+ items; 19K+ pin codes; 1000+ manufacturers; 3000+ factories
    - Enterprise procurement teams, factories, and industrial buyers
    - Catalog breadth and enterprise procurement-system framing
    - Less publicly explicit on raw-material-finance economics than Oxyzo
  - - Infra.Market
    - Construction materials platform
    - 283+ manufacturing facilities; 17,256 retail touchpoints
    - Contractors, developers, retailers, and construction projects
    - Owned brands, manufacturing depth, and direct-to-site delivery
    - Construction-heavy scope is narrower than OfBusiness’s full industrial wedge
  - - JSW One MSME
    - Steel and building-material marketplace
    - Category-specific marketplace under the JSW One MSME brand
    - Manufacturing and construction MSMEs
    - Strong category focus in steel and building materials
    - Narrower category breadth than OfBusiness or Moglix
  - - Power2SME
    - Buying-club procurement + finance
    - 55,000+ MSME members; founded 2012
    - SMEs sourcing raw materials and seeking finance support
    - Explicit raw-material aggregation plus finance access
    - Older public materials and weaker contemporary scale visibility
  - - IndiaMART
    - Discovery marketplace
    - 41M active buyers; 220K paying suppliers; 114M enquiries; 129M listings
    - MSMEs, large enterprises, and individual buyers/suppliers
    - Largest public discovery reach and strong RFQ/storefront tooling
    - Discovery and SaaS first; weaker integrated credit-control loop
  - - Udaan
    - Retail and distributor eB2B
    - India’s largest eB2B platform for retailers; financial services via udaanCapital
    - Retailers, distributors, manufacturers, and small businesses
    - Logistics plus retailer/distributor network effects
    - Category mix skews away from heavy industrial raw materials
  - - Mintifi
    - Supply-chain finance specialist
    - $180M Series E; 300+ brands; $3B+ invoice throughput
    - Brands, distributors, and retailers using inventory or working-capital finance
    - Scale and specialization in invoice and inventory finance
    - Less evidence of raw-material procurement control than OfBusiness
  - - Zetwerk
    - Contract manufacturing substitute
    - 9M+ parts; 1800+ active customers; 20+ countries
    - Industrial buyers outsourcing manufactured components or assemblies
    - Manufacturing execution, lead-time reduction, and global capacity
    - Adjacent substitute rather than a pure marketplace for recurring raw materials
  notes: Covers the most visible Indian direct, adjacent, and finance-linked peers with public evidence as of 2026-06-08; several private regional traders and opaque vertical specialists are excluded because they do not disclose enough comparable public data.
