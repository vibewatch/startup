chapter:
  number: 3
  title: Competitors
  summary: OfBusiness does not face one perfect substitute. Its hardest direct pressure comes from industrial procurement peers such as Moglix, Infra.Market, JSW One MSME, and Power2SME; its acquisition funnel is pressured by IndiaMART, TradeIndia, and Udaan; and its finance moat is most directly challenged by Mintifi plus regulated MSME lenders. Relative strength still sits with OfBusiness when raw-material sourcing, supplier payment, and working capital must stay inside one operating loop, but discovery remains multi-home and category specialists can still win where construction depth, public scale, or finance specialization matter more than integrated execution.
sections:
- id: direct-industrial-peers
  title: Direct Industrial-Commerce and Materials Peers
  body: 'OfBusiness is most exposed to rivals that also try to own recurring industrial-input workflows rather than generic supplier discovery. The closest direct peers in public evidence are Moglix, Infra.Market, JSW One MSME, and Power2SME, with NowPurchase and selected Zetwerk use cases acting as narrower substitutes. Moglix looks broadest on industrial catalog and enterprise procurement framing: its business site calls it one of Asia’s largest B2B commerce firms, cites a $2.6 billion valuation, and says it reaches 700,000-plus industrial items, 19,000-plus pin codes, 1,000-plus large manufacturers, and 3,000-plus factories. Infra.Market is different in shape but still directly threatening in construction-heavy accounts because it combines direct-to-site delivery, a multi-product construction catalog, 283-plus manufacturing facilities, and 17,256 retail touchpoints. JSW One MSME is narrower but potent in steel-and-cement-heavy workflows where procurement trust and category specificity
    matter more than horizontal breadth. Power2SME remains relevant because its older but still explicit profile pairs raw-material aggregation with finance access, making it a functional predecessor to the integrated model OfBusiness now markets. Zetwerk and NowPurchase are less universal substitutes: they matter when a customer’s pain is outsourced manufacturing or metal-factory process control rather than broad raw-material sourcing.'
