- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or risk
  - Threatening rival / substitute
  - Why it matters
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Integrated sourcing plus finance loop
    - Mintifi and regulated MSME lenders
    - Finance specialists can attack the credit layer even if they do not control procurement
    - High
    - Request repeat-usage, attach-rate, and loss-rate data to test whether Oxyzo meaningfully increases procurement retention
  - - Industrial catalog breadth
    - Moglix
    - Moglix’s enterprise procurement framing and broad item coverage can win centralized sourcing teams
    - High
    - Ask for OfBusiness account wins in multi-category industrial RFQs against Moglix
  - - Construction and project-material control
    - Infra.Market and JSW One MSME
    - Construction-heavy accounts may prefer players with stronger site delivery, steel, or owned-brand depth
    - High
    - Test vertical win rates in infrastructure, contractors, and steel-intensive buyers
  - - Discovery-layer exclusivity
    - IndiaMART and TradeIndia
    - Lead-gen marketplaces increase multi-homing and reduce exclusivity at the top of funnel
    - Medium-High
    - Request account-level sourcing journeys and quote-share data before assuming strong switching costs
  - - Retail and distribution overlap
    - Udaan
    - Udaan can absorb SMB replenishment and working-capital demand outside heavy industrial categories
    - Medium
    - Separate OfBusiness industrial cohorts from retailer or distributor-like cohorts in diligence
  - - Status-quo procurement
    - Offline distributors, local traders, direct mill relationships, and internal procurement teams
    - Non-digital substitutes still satisfy parts of the job and cap take-rate potential
    - Medium
    - Validate why customers move from manual or distributor-led procurement into OfBusiness and how durable that move is
  notes: Severity is a judgment based on public evidence as of 2026-06-08. The biggest risk is not one perfect substitute, but specialists attacking different layers of the OfBusiness workflow.
