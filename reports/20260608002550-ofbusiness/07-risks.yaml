    {
      "id": "ipo-timing-and-kill-criteria",
      "title": "IPO timing, monitoring indicators, and kill criteria",
      "body": "IPO timing is a risk, not just a catalyst. OfBusiness has done the visible pre-work — public-company conversion, bank appointments, and a communicated plan for a large public offering — but late-stage private capital has also tightened, pushing many scaled startups toward public markets at the same time. That means OfBusiness is not entering a vacuum; it is entering a queue in which disclosure quality, pricing discipline, and perceived resilience will matter more than the existence of bankers alone. Public evidence still does not show a filed DRHP or hard listing date as of runDate, so the correct underwriting posture is to treat timing as open rather than imminent.\n\nThe most useful monitoring frame is a set of concrete thesis-break triggers rather than a vague watchlist. First, unsecured-cohort slippage or NNPA moving above rating-agency comfort levels would signal that the growth model is outrunning underwriting. Second, falling capital adequacy or a thinner liquidity surplus would make funding dependence more acute precisely when debt-market conditions matter most. Third, complaint ageing that repeatedly runs into the 30-day RBI escalation path would convert an operational issue into a conduct issue. Fourth, commodity volatility that coincides with weaker borrower demand would test both commerce and credit at the same time. Finally, if OfBusiness keeps widening adjacent bets while IPO documentation does not visibly progress, management-bandwidth risk should be treated as a real discount to timing and valuation.",
