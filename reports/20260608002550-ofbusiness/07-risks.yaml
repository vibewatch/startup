    {
      "id": "commodity-and-working-capital-risk",
      "title": "Commodity and working-capital risk",
      "body": "OfBusiness and Oxyzo are tied to the same underlying industrial reality: they make money around raw-material-linked SME demand. OfBusiness presents itself as a procurement-and-credit platform across steel, aluminium, agriculture, petroleum, energy, polymers, chemicals, and related chains; CRISIL's older rationale for OFB Tech describes a similarly broad trading footprint across industrial steel, cement/RMC, pipes, polymers, petroleum derivatives, industrial chemicals, building materials, and agro commodities. Business Today separately describes Oxyzo financing raw materials such as steel, aluminium, copper, zinc, polymers, chemicals, and agro products. That breadth is a diversification benefit, but it also means the platform sits close to cyclical input markets rather than away from them.\n\nThe mitigating evidence is real: CRISIL said OFB has a diversified supplier base and some pricing protection through advance-payment quotes and bulk buying. But the company's own testimonials repeatedly mention volatile raw-material prices, high input costs, and working-capital shortages, which is the risk transmission channel investors should care about. External macro sources reinforce that the problem is still current. Allianz describes persistent metals volatility, J.P. Morgan describes tariff and trade uncertainty increasing demand for working-capital finance, and Aon/BCG both frame raw-material scarcity and volatility as escalating enterprise risks. The consequence for OfBusiness is not just lower commerce volumes; it is the possibility that stressed customers simultaneously need more credit, generate thinner margins, and become weaker repayment risks for Oxyzo.",
