    {
      "id": "execution-and-dependency-risk",
      "title": "Execution and dependency risk",
      "body": "Execution risk is elevated because Oxyzo is still selling speed as a product while broadening its business lines. The company markets unsecured business loans up to ₹5 crore with 48-hour approvals and a fully digitised process, which is commercially attractive but operationally unforgiving: any slippage in fraud controls, pricing discipline, servicing quality, or collections can damage both unit economics and reputation quickly. Oxyzo's own materials also warn borrowers that persistent EMI default can lead to NPA classification, legal recovery, and collateral seizure in secured cases, highlighting how quickly underwriting mistakes can become operational and legal events. RBI's current NBFC directions reinforce that point by treating digital lending, LSPs, and DLG structures as explicit regulated activities rather than peripheral experimentation.\n\nDependencies remain meaningful even though they are not obviously concentrated in one counterparty. Entrackr shows funding diversified across major banks, NBFCs, and capital-market instruments, while VCCircle and ET show simultaneous moves into private credit and GoldenPi-led fixed-income distribution. That broadens opportunity but also increases integration and governance load across bank partnerships, capital-markets investors, product teams, and compliance owners. The dependency map is therefore less about a single existential partner and more about whether management can coordinate multiple regulated channels without allowing execution quality to slip in the core lending engine before the parent reaches the IPO market.",
