    {
      "id": "credit-funding-risk",
      "title": "Credit, funding, and balance-sheet risk",
      "body": "The most material risk remains credit seasoning rather than current profitability. CARE's December 2025 note said about one-third of Oxyzo's AUM was unsecured and explicitly called that segment monitorable, while still describing liquidity and capitalisation as comfortable. That is a strong starting point, not a finished de-risking. FY26 results improved the headline asset-quality story — gross NPA fell to 0.74% and net NPA to roughly 0.28-0.30% — but those same public results also showed capital adequacy stepping down from the prior year as the balance sheet expanded. Entrackr still showed healthy net worth and liquidity surplus, yet the direction of travel matters more than the absolute buffer when an SME lender is growing into a more complex market environment.\n\nFunding dependence adds the second layer of risk. Oxyzo continued to raise secured NCD capital in 2025, including a February issue with 9.75% coupon and 110% collateral cover, followed by a larger ₹533 crore debt raise to support SME credit disbursement. Those transactions show strong lender appetite today, but they also prove that the model still needs repeat capital-market access and cooperative banking relationships to keep compounding. If spreads widen or rollover appetite softens, growth can slow before asset quality visibly deteriorates. In other words, current liquidity lowers near-term insolvency risk but does not eliminate funding risk as a strategic dependency.",
