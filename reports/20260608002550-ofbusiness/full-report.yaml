      - number: '3.4'
        title: Durability, Multi-Homing, and Relative Strengths
        blocks:
          - type: paragraph
            body: >-
              OfBusiness’s moat is real but conditional. It is strongest when the buyer needs commodity-price
              visibility, vendor execution, and working-capital support in the same purchasing motion; that is where a
              discovery-only platform or a general MSME lender leaves value on the table. But the moat is not absolute
              because each layer of the stack has a specialist rival. Moglix is broader on industrial catalog and
              procurement-system framing; Infra.Market is stronger where construction materials and owned manufacturing
              matter; IndiaMART and TradeIndia are structurally superior for lead generation and buyer reach; Mintifi
              and public or regulated MSME lenders are credible finance alternatives; and Udaan is an acquisition-side
              threat in retailer and distributor corridors. This leads to a three-front competitive structure rather
              than a single dominant nemesis. Switching costs are therefore uneven: they are highest once credit,
              supplier terms, and operational execution are embedded inside the same workflow, but they are low at the
              discovery layer where buyers can still compare quotes or source options elsewhere. The practical
              underwriting conclusion is that OfBusiness has defensible positioning in integrated industrial procurement
              plus credit, but it remains vulnerable to category specialists, large discovery networks, and increasingly
              institutionalized finance competitors.
