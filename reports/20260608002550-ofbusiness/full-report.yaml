  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing Anchors, Latest Round, and IPO Path
        blocks:
          - type: paragraph
            body: >
              The latest disclosed primary capital into OfBusiness is not a new hard pricing event but a small pre-IPO
              top-up: in April 2025 the company raised Rs 100 crore from Cornerstone Ventures, and the coverage
              explicitly framed the round as part of IPO preparation rather than as a fresh valuation reset. Public
              reports do not disclose the round price or a post-money mark, so it should not be treated as a clean
              valuation anchor. The last large priced equity anchor remains the December 2021 Series G, when OfBusiness
              raised $325 million at about a $5 billion valuation, including a sizeable $140 million secondary sale.
              More recent price discovery came from an October 2024 secondary transaction that Economic Times later
              described as valuing the company around $4 billion. That secondary matters more for current entry
              discipline because it sits much closer to the intended IPO window than the 2021 bull-market round.


              IPO preparation is real. Public reporting says OfBusiness converted itself into a public entity in January
              2025, hired Axis Capital, JPMorgan, Citigroup, Morgan Stanley, and Bank of America, and explored an IPO of
              roughly $750 million to $1 billion with a mix of fresh issue and offer-for-sale shares. But the public
              evidence still stops short of a filed DRHP or a disclosed SEBI review milestone. At the same time, the
              broader 2026 IPO market has cooled, and late-stage private funding has become less forgiving. That
              combination matters: without a live filing, fresh parent audits, or a clearer public timeline, the current
              discussion around a $6-9 billion IPO value looks more like aspiration than demonstrated clearing price.
              The underwriting case should therefore lean on observed marks and disclosed financials, not on pre-listing
              headline targets.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV035
              - CV036
              - CV037
      - number: '8.2'
        title: Parent Profitability, Oxyzo Filing Evidence, and Overhang
        blocks:
          - type: paragraph
            body: >
              The strongest pro-valuation evidence is not the IPO chatter but the operating proof already visible in
              public sources. OfBusiness reported FY24 operating revenue of Rs 19,296.27 crore and consolidated net
              profit of roughly Rs 603 crore, while Financial Express separately described FY24 operating profit at Rs
              666 crore and management's goal of lifting EBITDA margin above 5% from roughly 3.6% over three to five
              years. Those numbers show that OfBusiness is not a classic cash-burning marketplace; it has already
              reached meaningful scale and positive bottom-line territory. Even so, the business mix matters. A
              meaningful part of revenue comes from stock-in-trade and working-capital-linked commerce rather than a
              pure software or take-rate model, which limits how aggressively public-market internet multiples can be
              imported.


              The second major support is Oxyzo, the lending subsidiary. Here the public evidence is stronger because
              the company publishes an annual report and is followed by rating agencies. Oxyzo's FY25 annual report
              disclosed Rs 1,211 crore of total income, Rs 339 crore of PAT, Rs 9,236 crore of assets, debt outstanding
              of Rs 6,028 crore, customer base above 3.8 lakh, GNPA of 1.09%, and CRAR of 34%. March 2026 ICRA coverage
              then showed 9M FY26 total income of Rs 1,048 crore, PAT of Rs 267 crore, and loan book around Rs 9,501
              crore as of December 31, 2025; FY26 news coverage later reported Rs 1,494 crore of revenue, Rs 375 crore
              of PAT, and loan book of Rs 10,545 crore. This helps the upper half of the range, but it does not remove
              overhang. CARE and ICRA both still highlight high growth, portfolio seasoning, and a 34-36% unsecured book
              as live risk factors. Public sources also identify major investors and ownership stakes, yet they do not
              disclose liquidation preferences, anti-dilution protections, or a full pre-IPO cap table, so dilution math
              remains incomplete.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV013
              - CV014
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV043
              - CV044
              - CV047
      - number: '8.3'
        title: Comparable Set and Multiple Discipline
        blocks:
          - type: paragraph
            body: >
              The public-comparable exercise is directionally useful but needs heavy adjustment. IndiaMART and PB
              Fintech are the most usable listed Indian references in the retained source set because both are sizeable
              digital platforms with public disclosure, meaningful profitability progress, and observable market caps.
              As of the June 2026 run date, CompaniesMarketCap put IndiaMART's market value at about $1.25 billion and
              PB Fintech's at about $7.4 billion. Screener data shows IndiaMART's latest four reported quarters summing
              to about Rs 1,569 crore of sales and PB Fintech's latest four reported quarters summing to about Rs 6,794
              crore. That implies rough market-cap-to-sales multiples of about 7.5x for IndiaMART and about 10.3x for PB
              Fintech. Both trade on cleaner disclosure and much lighter balance-sheet intensity than OfBusiness.


              That gap is the key discipline. OfBusiness produced roughly $2.3 billion of FY24 revenue and about $72.6
              million of FY24 after-tax profit. The October 2024 secondary at about $4 billion implies about 1.7x sales
              and roughly 55x earnings on that FY24 base. The old $5 billion 2021 mark implies about 2.2x sales and
              about 69x earnings on the same base, while the floated $6-9 billion IPO range implies about 2.6-3.9x sales
              and about 83-124x earnings. Those sales multiples are still far below IndiaMART or PB Fintech, but that
              does not make the IPO ask obviously cheap because OfBusiness's revenue quality is lower: it combines
              inventory-heavy trade, manufacturing exposure, and embedded credit through Oxyzo. A reasonable valuation
              framework therefore gives OfBusiness a much lower revenue multiple than asset-light digital platforms
              while still crediting it for profitability, scale, and an increasingly valuable finance arm. That logic
              points back toward the $4-5 billion zone rather than toward the top of the reported IPO range.
