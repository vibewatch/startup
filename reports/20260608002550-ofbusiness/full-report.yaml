        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >-
              OfBusiness’s public surfaces support a three-layer customer map rather than a single buyer persona. First
              are procurement-side buyers: manufacturers, contractors, traders, distributors, renewable-energy
              operators, infrastructure firms, and other industrial businesses that need raw materials, price
              intelligence, fulfillment, and shipment visibility. Second are suppliers that join the network to receive
              verified-buyer enquiries, key-account support, and logistics coordination. Third are Oxyzo borrowers—SMEs
              and emerging corporates that use purchase finance, invoice discounting, work-order finance, machinery
              finance, business loans, or loan-against-property products to smooth procurement and growth. The company’s
              own scale banners are broad rather than cohort-specific: 500,000+ orders delivered, 2 million+ SMEs
              empowered, 26-state reach, and 15+ countries served. Google Play narrows that story by saying 50,000+
              MSMEs have procured raw materials through the app. Together these sources show a real and multi-segment
              user base, but they do not cleanly separate buyers from suppliers, app users from financed borrowers, or
              active customers from lifetime relationships.
