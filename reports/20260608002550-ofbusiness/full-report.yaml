            body: >-
              Developer-signal evidence exists, but it is indirect. OfBusiness does not expose a public GitHub footprint
              or engineering blog in the retained sources, so the strongest practitioner proxies come from the Android
              listing, app-intelligence sites, hiring surfaces, and external stack detection. Google Play shows a
              feature-rich buyer app with shipment tracking, invoice management, e-way bills, and Ask VedAI. AppBrain
              and AndroidRank both show a real installed base, with 100K+ installs and recent maintenance signals, even
              if the review picture is mixed. AppBrain also surfaces complaints about bugs, response times, and missing
