      - number: '2.3'
        title: Buyer Segments, Budget Owners, and the Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The most relevant buyer is not the average Indian SMB; it is the business that buys volatile industrial
              inputs often enough for procurement workflow and credit to matter. OfBusiness's own materials and
              testimonials point to manufacturers, renewable-material suppliers, industrial component makers, interior
              or infrastructure contractors, and supplier-side mills or processors that need both better prices and more
              reliable working capital. In these accounts, the user is often a procurement, plant, commercial, or
              operations team, while the payer sits with the owner, finance head, or business unit controlling input
              budgets.


              This split matters because adoption is driven by operational pain, not by an abstract software
              transformation mandate. The strongest triggers in retained sources are price transparency, lower input
              costs, verified suppliers, RFQ flow, logistics visibility, and the ability to smooth working-capital gaps
              in the same workflow. Supplier-side onboarding also matters because OfBusiness has to maintain category
              depth, quality checks, and transport coverage to make price discovery credible.


              Compared with IndiaMART-style discovery or a pure marketplace thesis, OfBusiness is trying to solve a
              harder but potentially stickier problem: how to make recurring raw-material procurement governable for
              businesses that care about both supply continuity and cash conversion. That is why the model is best
              understood as procurement plus finance plus execution, not as a simple demand-aggregation layer.
