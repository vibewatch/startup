  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or observation
      - Why it matters
      - Action implication
    rows:
      - - IPO filing slippage
        - No public DRHP or credible filing timetable after another reporting cycle
        - Pushes the story back from observed pricing into pure aspiration.
        - Move toward the bear range and require a deeper discount.
      - - Oxyzo credit deterioration
        - Unsecured mix rises meaningfully or asset-quality metrics trend toward rating-agency negative triggers
        - Weakens the most transparent profit engine inside the group.
        - Cut range and focus diligence on credit-vintage losses.
      - - Parent disclosure disappointment
        - >-
          Fresh audits show weaker margins, lower profit conversion, or worse working-capital intensity than FY24
          suggests
        - Undermines the argument for any premium over the 2024 secondary.
        - Rebase the case toward $3-4 billion.
      - - IPO-market weakness persists
        - New-age offerings continue to price below prior private marks
        - Makes the $6-9 billion range harder to defend in public-market bookbuilding.
        - Require evidence of a discounted issue price before engaging.
      - - Positive de-risking
        - Filed DRHP, fresh parent audits, and stable Oxyzo asset quality
        - The exact trio needed for the bull case.
        - Only then consider paying above the old $5 billion anchor.
    notes: >-
      The triggers mix company-specific evidence with market-specific evidence because OfBusiness is already on an IPO
      path; clearing price will depend on both.
    claimRefs:
      - CV018
      - CV019
      - CV037
      - CV039
      - CV040
      - CV044
      - CV046
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Diligence path
    rows:
      - - Parent audited financials
        - FY25 and FY26 consolidated audited parent statements
        - Needed to test whether FY24 profitability persisted into the IPO window.
        - Obtain audited statements or DRHP financials once filed.
      - - Cap table and share classes
        - Full shareholder list, option pool, liquidation preferences, and anti-dilution terms
        - Necessary for real dilution and return modelling.
        - Review board-approved cap table, shareholder agreements, and rights schedules.
      - - DRHP / SEBI status
        - Filing date, review status, and updated issue structure
        - Determines whether the IPO path is live or drifting.
        - Track SEBI portal, syndicate bank materials, and company filings.
      - - Segment economics
        - Gross margin, take-rate, and working-capital intensity by core commerce vertical
        - Needed to justify any public-comp premium despite inventory-heavy revenue.
        - Request management bridge from GMV/procurement volume to gross profit and EBITDA.
      - - Oxyzo credit vintages
        - Vintage loss curves, secured vs unsecured cohort performance, and concentration data
        - Core to deciding whether Oxyzo deserves a supportive valuation uplift or a discount.
        - Review rating-agency backup data and lending-book portfolio packs.
      - - IPO proceeds use
        - Fresh-issue debt repayment and growth allocation by entity
        - Impacts de-leveraging, dilution, and equity story quality.
        - Verify in DRHP or banker pre-marketing materials.
    notes: >-
      These are the minimum remaining asks before a priced investment memo can move from track to buy. They are specific
      enough to fit directly into a live diligence workplan.
