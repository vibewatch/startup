      - number: '1.4'
        title: Scale Snapshot, Vertical Integration, Milestones, and Adverse Checks
        blocks:
          - type: paragraph
            body: >-
              The strongest audited-like evidence in the retained set is still FY24. The official release says
              OfBusiness generated ₹19,296.27 crore of operating revenue and ₹602.97 crore of consolidated net profit,
              with total expenses of ₹18,695.75 crore. That makes OfBusiness look meaningfully larger and more
              profitable than many venture-backed B2B peers. The same official release also shows why Oxyzo matters: the
              financing arm posted ₹903 crore of FY24 revenue and ₹290 crore of profit, while later FY26 reporting from
              Indian Startup News and IPO Central puts Oxyzo at roughly ₹1,494 crore of revenue, about ₹375 crore of
              PAT, and about ₹11,822 crore of assets or AUM. Oxyzo is not side noise; it is a major piece of the group's
              investability story.


              Milestone evidence shows a business that kept moving from aggregation to deeper vertical integration.
              BidAssist launched in 2017, expansion reached 13 states by 2018, 2021 turned the company into a unicorn
              and then a $5 billion business on private marks, and 2022 made Oxyzo a unicorn in its own right. The later
              phase is more industrial: management highlighted acquisitions, and Moneycontrol reported full ownership of
              Indian Design in 2025 as part of a plan to consolidate four commerce verticals before listing. That is
              consistent with the company's claim that it is building manufacturing and private-label depth, not just
              arbitraging trade flows.


              Adverse checks do not show a retained sanctions or litigation bombshell, but they do show three real
              caution signals: founder Nitin Jain's exit in 2026, pre-IPO ESOP liquidity and investor exit activity, and
              a visible valuation reset from the 2021 peak to the 2024 secondary market. Headcount is also not cleanly
              supportable because official group marketing and market-data providers appear to measure different scopes.
              Together, those issues do not negate the scale story, but they do mean chapter 1 should present OfBusiness
              as a profitable, ambitious platform with disclosure gaps rather than as a fully de-risked pre-IPO
              compounder.
