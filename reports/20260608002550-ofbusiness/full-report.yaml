              documentation spine — promoter KYC, GSTIN, bank statements, GSTR data, and audited financials — which
              signals a standardized digital underwriting workflow rather than ad hoc product operations. The public
              dependency map is also clear: app-store distribution matters for the mobile surface, RBI rules matter for
              lending conduct, supplier and transporter networks matter for fulfillment, and third-party cloud, CRM, and
              payment vendors likely matter for web and transaction reliability. Those dependencies are visible even
