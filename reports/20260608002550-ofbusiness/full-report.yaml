  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Platform
      - Public model
      - Disclosed economics / limits
      - Included capabilities
      - Unknowns / caveats
      - Implication
    rows:
      - - Oxyzo
        - Purchase-finance credit line tied to supplier invoices
        - Up to ₹5 Cr; pricing starts at 12% p.a.; processing fee starts at 1% p.a.; 60-120 day terms
        - Direct supplier payment, collateral-free option, RBI-regulated NBFC, interest only on usage
        - Realized customer-level pricing and credit losses are not public
        - Most explicit public benchmark for procurement-linked finance in this peer set
      - - Mintifi
        - Inventory finance, invoice finance, working-capital loans
        - Credit line up to ₹2 Cr for inventory purchases; collateral-free business loans up to ₹50 lakh
        - Own NBFC plus partner lenders; distributor and retailer workflows; 300+ brands
        - Realized pricing, take rates, and loss performance remain undisclosed publicly
        - Strongest finance-side peer even without full price transparency
      - - FinanSME / Power2SME
        - Purchase-bill finance arranged with NBFC partners
        - Negotiated rates; 4,000 applications processed; 980 active accounts; ₹1,850 Cr disbursed
        - Finance layer attached to buying-club procurement model
        - No standardized public rate card or product-by-product economics
        - Shows legacy precedent for combining raw-material aggregation with finance
      - - Lendingkart
        - Unsecured MSME business loan
        - Up to ₹50 lakh; no collateral
        - Digital KYC and quick application flow
        - Public page does not disclose realized rate bands on the retained evidence
        - Competes for working-capital budget but is not procurement-native
      - - InCred
        - Working-capital, term-loan, and channel-finance products
        - Working-capital loans up to 12 months; collateral-free term loans up to 36 months
        - Distributor and vendor finance plus general SME lending
        - Public page does not disclose a comparable procurement-linked pricing benchmark
        - Relevant lender competitor, especially for channel-finance use cases
      - - UGRO Capital
        - Secured and unsecured MSME lending
        - Quick approvals and flexible terms disclosed, but no retained public rate card
        - Public-NBFC trust posture and digital process
        - Detailed economics require deeper investor or product disclosures than retained here
        - Competes on regulated MSME credit rather than procurement operating workflow
