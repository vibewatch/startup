      - number: '3.3'
        title: Embedded-Finance Rivals and Public Packaging
        blocks:
          - type: paragraph
            body: >-
              The finance layer is where OfBusiness becomes materially harder to compare with pure marketplaces, because
              Oxyzo publishes a real purchase-finance product rather than only a lead form. Oxyzo discloses unsecured
              limits up to ₹5 crore, interest starting from 12 percent, 48-hour approval, and 60-120 day tenors, with
              direct supplier payments and RBI registration. That makes Mintifi the clearest financing-side peer in
              public sources: Business Standard and Moneycontrol both describe a 300-plus-brand supply-chain-finance
              platform that raised $180 million, processes more than $3 billion in invoices annually, and runs credit
              through its own NBFC plus partner lenders. Lendingkart, InCred, and UGRO all compete for the same
              working-capital budget, but their public pages frame the offer as general MSME lending, unsecured business
              loans, or channel finance rather than procurement-native sourcing. The regulatory bar also matters. RBI’s
              Digital Lending Directions raise expectations around LSP diligence, direct disbursal and repayment,
              disclosure, and data controls, which favors lenders that can show clear regulated-entity accountability.
              In practice, that means OfBusiness does not only compete on who can find steel or chemicals cheaper; it
              also competes on who can underwrite, disburse, and service that procurement flow with enough trust to win
              repeat use.
