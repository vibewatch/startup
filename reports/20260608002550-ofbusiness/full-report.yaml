  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Why OfBusiness Is Narrower Than Generic B2B
        blocks:
          - type: paragraph
            body: >-
              OfBusiness should be bounded as an integrated raw-material procurement and embedded-finance platform, not
              as a catch-all proxy for all Indian B2B commerce. The homepage and about page place the company in
              seven-plus supply chains—steel, aluminium, agriculture, petroleum and energy, polymers, chemicals, and
              adjacent industrial categories—while the supplier portal shows concrete fulfillment categories such as
              mild steel, non-ferrous, polymers and packaging, chemicals, and energy and petroleum. The commercial
              job-to-be-done is therefore recurring materials sourcing for manufacturers, contractors, and industrial
              buyers who care about price discovery, delivery assurance, and cash-flow support rather than generic
              catalog browsing alone.


              Included spend should cover raw-material purchases, supplier discovery, quotation and RFQ workflows,
              logistics coordination, and procurement-linked finance such as purchase finance or invoice discounting.
              Excluded spend should include pure B2C retail, generic horizontal classifieds with no fulfillment or
              finance layer, and unrelated software budgets that do not control materials flow. OfBusiness's own
              materials stress this distinction: it pairs procurement with BidAssist, Nexizo, and Oxyzo, which makes the
              business closer to a workflow-plus-trade platform than a listings marketplace. That distinction matters
              for underwriting because it narrows the direct market while making the product more operationally sticky.
            claimRefs:
