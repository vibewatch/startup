      - number: '7.3'
        title: Commodity and working-capital risk
        blocks:
          - type: paragraph
            body: >-
              OfBusiness and Oxyzo are tied to the same underlying industrial reality: they make money around
              raw-material-linked SME demand. OfBusiness presents itself as a procurement-and-credit platform across
              steel, aluminium, agriculture, petroleum, energy, polymers, chemicals, and related chains; CRISIL's older
              rationale for OFB Tech describes a similarly broad trading footprint across industrial steel, cement/RMC,
              pipes, polymers, petroleum derivatives, industrial chemicals, building materials, and agro commodities.
              Business Today separately describes Oxyzo financing raw materials such as steel, aluminium, copper, zinc,
              polymers, chemicals, and agro products. That breadth is a diversification benefit, but it also means the
              platform sits close to cyclical input markets rather than away from them.


              The mitigating evidence is real: CRISIL said OFB has a diversified supplier base and some pricing
              protection through advance-payment quotes and bulk buying. But the company's own testimonials repeatedly
              mention volatile raw-material prices, high input costs, and working-capital shortages, which is the risk
              transmission channel investors should care about. External macro sources reinforce that the problem is
              still current. Allianz describes persistent metals volatility, J.P. Morgan describes tariff and trade
              uncertainty increasing demand for working-capital finance, and Aon/BCG both frame raw-material scarcity
              and volatility as escalating enterprise risks. The consequence for OfBusiness is not just lower commerce
              volumes; it is the possibility that stressed customers simultaneously need more credit, generate thinner
              margins, and become weaker repayment risks for Oxyzo.
            claimRefs:
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
              - CR031
              - CR032
              - CR043
              - CR048
      - number: '7.4'
        title: Execution and dependency risk
        blocks:
          - type: paragraph
            body: >-
              Execution risk is elevated because Oxyzo is still selling speed as a product while broadening its business
              lines. The company markets unsecured business loans up to ₹5 crore with 48-hour approvals and a fully
              digitised process, which is commercially attractive but operationally unforgiving: any slippage in fraud
              controls, pricing discipline, servicing quality, or collections can damage both unit economics and
              reputation quickly. Oxyzo's own materials also warn borrowers that persistent EMI default can lead to NPA
              classification, legal recovery, and collateral seizure in secured cases, highlighting how quickly
              underwriting mistakes can become operational and legal events. RBI's current NBFC directions reinforce
              that point by treating digital lending, LSPs, and DLG structures as explicit regulated activities rather
              than peripheral experimentation.


              Dependencies remain meaningful even though they are not obviously concentrated in one counterparty.
              Entrackr shows funding diversified across major banks, NBFCs, and capital-market instruments, while
              VCCircle and ET show simultaneous moves into private credit and GoldenPi-led fixed-income distribution.
              That broadens opportunity but also increases integration and governance load across bank partnerships,
              capital-markets investors, product teams, and compliance owners. The dependency map is therefore less
              about a single existential partner and more about whether management can coordinate multiple regulated
              channels without allowing execution quality to slip in the core lending engine before the parent reaches
              the IPO market.
