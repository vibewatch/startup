      - number: '4.3'
        title: Capital Structure and Lending-Book Risk
        blocks:
          - type: paragraph
            body: >-
              Capital structure is where the public evidence is strongest. Oxyzo's FY25 annual report shows net worth of
              ₹2,943 crore, debt outstanding of ₹6,028 crore, fresh debt raised above ₹3,500 crore during FY25, and a
              borrowings mix that shifted further toward non-bank funding. Rating notes then extend the view forward:
              ICRA's March 2026 note shows rated debt facilities totaling ₹5,897.75 crore, net worth of ₹3,195 crore,
              CRAR of 32.1%, managed gearing of 2.2x, and next-12-month debt obligations of about ₹3,366 crore against
              expected inflows of about ₹6,428 crore plus liquidity buffers and unused lines. FY26 media coverage adds a
              March 2026 end-state around ₹3,327 crore net worth, ~29% CRAR, and >₹950 crore liquidity surplus.


              The lending-book risk is controlled, but not risk-free. FY25 annual-report data, ICRA, and CARE all place
              GNPA/gross stage 3 around 1% and NNPA/net stage 3 around 0.4-0.5% through FY25 and late 2025, then public
              FY26 coverage shows improvement to roughly 0.74% GNPA and 0.28-0.30% NNPA. The same sources also show why
              rating agencies remain cautious: the book has grown very quickly, 34-36% of AUM was unsecured by late
              2025, and both ICRA and CARE explicitly flag seasoning, unsecured-book growth, leverage creep, and SME
              credit stress as key downside triggers. The public conclusion is therefore favorable but conditional:
              Oxyzo is still above regulatory capital needs and has diversified liabilities, yet it is not insulated
              from deterioration if unsecured growth outruns underwriting discipline.
