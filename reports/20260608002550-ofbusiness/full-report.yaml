  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, legal, and governance risk
        blocks:
          - type: paragraph
            body: >-
              Oxyzo's public-risk stack starts with perimeter expansion rather than a single open enforcement file. The
              November 2025 RBI credit-facilities directions explicitly cover NBFC digital lending, lending service
              providers, and default-loss guarantees, so faster remote origination or partner-led distribution increases
              conduct and model-risk obligations rather than moving them outside the rulebook. Oxyzo's own grievance
              flowchart sharpens that point: unresolved complaints escalate from operations to the grievance officer,
              then the principal nodal officer, then the internal ombudsman, and finally RBI after 30 days. That creates
              a visible supervisory trigger investors can monitor in real time.


              Legal risk is also concrete rather than hypothetical. In March 2026, a Madras High Court matter showed
              Oxyzo litigating as a secured creditor and relying on SARFAESI/CERSAI priority over a tax charge, which is
              direct evidence that some stressed credits can migrate into court-led recovery rather than standard
              collections. At the same time, Oxyzo is widening its compliance footprint: the firm has launched a
              SEBI-registered Category II private-credit vehicle and announced the acquisition of GoldenPi, a
              Sebi-registered online bond platform. Governance is improving, but not fully mature in public view.
              Entrackr reported the addition of an independent director, yet the public investor pages still do not
              disclose the fuller committee-level governance pack, board workplan, or IPO-style control architecture
              that would let outside investors underwrite expansion confidence cleanly.
            claimRefs:
