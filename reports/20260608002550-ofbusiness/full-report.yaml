      - number: '2.4'
        title: Embedded Finance, Regulatory Rails, and Macro Drivers
        blocks:
          - type: paragraph
            body: >-
              The embedded-finance layer is not optional to the category; it is one of the reasons the market exists.
              IBEF, Redseer, and SIDBI all point to large MSME funding gaps, and SIDBI explicitly frames GeM, TReDS, and
              formalization initiatives as part of the same competitiveness push. For OfBusiness, that means Oxyzo is
              not just an ancillary lending arm. It is the credit and invoice-discounting capability that helps convert
              procurement demand into repeatable transaction flow.


              At the same time, the regulatory bar is higher than it was during India's earlier fintech boom. RBI's
              Digital Lending Directions 2025 apply across banks, NBFCs, and other regulated lenders and harden the
              requirements around LSP due diligence, direct disbursal and repayment, cooling-off periods, disclosures,
              grievance redressal, and local data storage. RBI's 2025 scale-based NBFC directions reinforce that larger
              or riskier non-bank lenders operate in a more tightly supervised framework. For a procurement platform,
              that does not kill the opportunity; it makes compliance quality and partner discipline part of competitive
              fitness.


              The macro tailwinds remain constructive. GeM shows procurement can be digitized at scale, manufacturing
              GVA growth stayed strong in FY26, PLI and industrial policy continue to support localization, and ISM
              India says procurement leaders now prioritize resilience, AI, ESG, and supplier collaboration alongside
              cost. Those forces support platforms that can combine procurement execution with financing and data.
