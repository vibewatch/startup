      - number: '3.2'
        title: Adjacent Discovery Platforms and Substitute Channels
        blocks:
          - type: paragraph
            body: >-
              The second competitive layer is not a like-for-like procurement operator; it is the broad discovery and
              replenishment layer that sits upstream of a final transaction. IndiaMART, TradeIndia, and Udaan all
              pressure OfBusiness here. IndiaMART is clearly the scale anchor: its investor materials say it is India’s
              largest online B2B marketplace with 60 percent share in online B2B classifieds, and its FY2025-26 annual
              report reports 41 million active buyers, 220,000 paying suppliers, 114 million business enquiries, and 129
              million live listings. TradeIndia is smaller but still large enough to matter as a multi-homing rail,
              claiming 89 million annual inquiries, 11.4 million registered users, and 100,000-plus categories while
              explicitly marketing 360-degree digital solutions for MSMEs. Udaan overlaps through retail-centric B2B
              trade, logistics, and udaanCapital, but its public category emphasis remains FMCG, staples, fresh, and
              pharma rather than heavy industrial inputs. The substitute set is therefore bigger than direct peers:
              offline distributors, local traders, direct mill relationships, and generic digital lead-gen platforms can
              all win part of the job even if they do not replicate the full OfBusiness stack. That lowers exclusivity
              at the top of the funnel and keeps price discovery under pressure.
