chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Legal Structure, and Integrated Business Model
        blocks:
          - type: paragraph
            body: >-
              OfBusiness should be treated first as a holdco-led operating ecosystem rather than a narrow online
              marketplace. The company markets itself as India's largest B2B raw-material procurement and credit
              platform and ties that positioning to a set of linked products: BidAssist for tender discovery, Nexizo for
              commodity intelligence, OfBusiness procurement and fulfillment for metals, chemicals, agri and related
              categories, and Oxyzo for structured SME financing. That integrated stack matters because the company
              explicitly positions itself as supplier, manufacturer, importer or exporter, and technology platform in
              one workflow.


              The cleanest legal anchor is OFB Tech Limited, formerly OFB Tech Private Limited, with CIN
              U74140GJ2015PLC154393. Official pages and the FY24 press release show the registered office in Ahmedabad,
              while the contact page places the head office in Global Business Park, Gurugram. In practice that means
              diligence should separate legal domicile from the operating nerve center used in media coverage and
              customer outreach. Official history ties the business back to 2015, which aligns with Tofler incorporation
              data even though some later press shorthand occasionally uses 2016.


              The company's operating narrative is unusually broad for a B2B commerce startup. Official materials claim
              500K-plus orders delivered, 2 million-plus SMEs empowered, presence across 26 states and more than 15
              countries, and a logistics network of about 4,000 transporters handling over 150,000 consignments a year.
              Those are company claims rather than audited KPI disclosures, but they do establish the management story
              that later chapters should test: OfBusiness is trying to be an integrated commerce, manufacturing, data,
              and financing platform serving Indian SMEs rather than a simple marketplace intermediary.
