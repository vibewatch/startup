      - number: '4.2'
        title: Profitability and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The parent business is demonstrably profitable, but the margin profile still looks like an efficient
              operator in a heavy working-capital category rather than a light-capex platform. Economic Times and
              Entrackr put FY24 net profit at roughly ₹603 crore on ₹19,296 crore of operating revenue. Entrackr
              additionally reports a 7.44% EBITDA margin, 12.33% ROCE, and expense intensity of ₹0.97 per rupee of
              operating revenue. Those numbers are respectable and directionally improving, yet they also show how much
              economics are shaped by stock-in-trade, materials consumed, and operating leverage rather than pure
              recurring software revenue.


              Oxyzo gives the cleaner public unit-economics dataset. The FY25 annual report, ICRA, and CARE all show a
              lending business with NIM around 8.2-8.5%, RoA around 3.6-4.4%, and GNPA near 1%. Head and Tale says
              interest income contributed about 95% of FY25 revenue, reinforcing that this is a classic spread business
              with fee income still secondary. FY26 reporting remains healthy but not frictionless: Economic Times says
              revenue from operations rose 23% while net profit margin moderated to 25.2% as finance costs and opex rose
              with the balance sheet. That is still strong profitability for an SME-focused NBFC, but it means
              underwriting should expect margin normalization as leverage rises and as the secured/unsecured mix
              evolves.
