  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      How regulation, credit slippage, commodity shocks, and funding stress can cascade into margin pressure and IPO
      timing damage.
    approximationNotes: The map shows directional transmission channels implied by public evidence, not a quantified scenario model.
    data:
      nodes:
        - id: r1
          label: Regulatory perimeter expands
          detail: NBFC directions, complaints escalation, and new regulated products widen compliance load.
        - id: r2
          label: Credit losses rise
          detail: Unsecured or newly seasoned borrowers begin slipping faster than expected.
        - id: r3
          label: Commodity volatility hits SME customers
          detail: Input-price swings weaken customer cash flow and financing demand quality.
        - id: r4
          label: Funding spreads or rollover tighten
          detail: Debt-market and lender appetite weaken while growth still needs capital.
        - id: r5
          label: Margin and liquidity pressure
          detail: Provisioning, refinancing cost, and working-capital strain compress returns.
        - id: r6
          label: IPO readiness slips
          detail: Disclosure and governance work falls behind while public-market window narrows.
        - id: r7
          label: Valuation / investment case weakens
          detail: The combined downside re-rates quality, timing, and recommendation.
      edges:
        - from: r1
          to: r6
          label: adds disclosure burden
        - from: r2
          to: r5
          label: raises provisions and recovery cost
        - from: r3
          to: r2
          label: weakens borrower quality
        - from: r3
          to: r5
          label: raises working-capital stress
        - from: r4
          to: r5
          label: raises refinancing cost
        - from: r5
          to: r6
          label: weakens public-market story
        - from: r2
          to: r7
          label: undercuts underwriting credibility
        - from: r6
          to: r7
          label: delays valuation realisation
    claimRefs:
      - CR014
      - CR019
      - CR031
      - CR035
      - CR039
      - CR041
      - CR043
      - CR044
      - CR046
