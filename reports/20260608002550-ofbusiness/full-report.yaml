      - number: '8.4'
        title: Scenario Ranges, Final Stance, and Diligence Asks
        blocks:
          - type: paragraph
            body: >
              The scenario work is straightforward. In the bear case, the IPO window stretches, risk appetite stays
              soft, and investors focus on commodity-linked revenue quality plus Oxyzo's unsecured-book monitorables;
              that supports a $3.0-4.0 billion range. In the base case, OfBusiness keeps the FY24 profit profile intact,
              Oxyzo continues to print solid credit metrics, and the eventual IPO process clears with better but not
              perfect disclosure; that supports roughly $4.0-5.2 billion. In the bull case, the company files a DRHP
              with fresh audited parent numbers, demonstrates that margin and capital discipline are holding up, and
              enters a friendlier IPO tape; that can support about $6.0-7.0 billion. The probability-weighted center of
              gravity is therefore around $4.6-4.9 billion rather than around the $6-9 billion headline range.


              That leads to a clear stance: track, medium confidence, high risk. The company is too substantial and too
              profitable to dismiss, but the price sensitivity is real. Around $4 billion, the secondary looks
              defensible; around $5 billion, the valuation can still be justified by scale and Oxyzo support; above $6
              billion the stance turns stretched because the market would be paying upfront for disclosures and IPO
              execution that are not yet public. The most important diligence asks are concrete rather than abstract:
              audited FY25/FY26 parent statements, share-class and liquidation-preference detail, a live DRHP or SEBI
              status update, segment-level gross margin or take-rate evidence, and Oxyzo credit-vintage data. If those
              arrive cleanly, the range can move up. If IPO timing slips again or Oxyzo credit quality weakens, the
              range should move down quickly.
