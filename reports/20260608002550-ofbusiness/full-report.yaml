      - number: '4.4'
        title: Diligence Blockers and Financial Verdict
        blocks:
          - type: paragraph
            body: >-
              The remaining issue is disclosure asymmetry. The retained public sources are good enough to underwrite
              Oxyzo's broad profitability, capital adequacy, book quality, and funding diversification, but they are not
              good enough to finish an equity-style underwriting of the parent. No retained source discloses parent cash
              on hand, monthly burn, runway, customer concentration, CAC, payback, or realized procurement take rate.
              Public disclosures on Oxyzo's unsecured book also stop at top-line NPA ratios and secured/unsecured mix;
              they do not provide vintage curves, sector cohorts, or bucket-level default waterfalls. Even new
              adjacencies such as GoldenPi, the credit fund, and the investment-manager arm are visible strategically
              before they are visible economically.


              That leaves a split verdict. Revenue quality is credible because both the parent and subsidiary are
              already profitable, and Oxyzo in particular looks like a real operating NBFC rather than a narrative-only
              financing arm. Margin path is acceptable but likely to normalize as leverage increases and as incremental
              growth comes from lower-yield secured business or new verticals. Capital intensity is manageable inside
              Oxyzo because CRAR, liquidity, and liability diversification remain healthy, but the parent still cannot
              be underwritten cleanly on public data alone because runway and realized monetization are opaque. For
              diligence, the investable question is therefore not whether OfBusiness has scale; it is whether the parent
              can show cash generation, pricing realization, and GTM efficiency at a level comparable to the disclosure
              quality already visible inside Oxyzo.
