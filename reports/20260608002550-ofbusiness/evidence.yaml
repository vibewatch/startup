evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-headcount-scope
    missingEvidence: >-
      A single audited or board-approved current headcount number that reconciles group, operating-company, and
      legal-entity scopes.
    whyItMatters: >-
      Headcount is a cover metric and current public evidence conflicts across official marketing and market-data
      sources, which weakens operating-efficiency comparisons.
    diligencePath: >-
      Request the latest consolidated HR dashboard or DRHP workforce note from management and reconcile it against
      legal-entity payroll plus group subsidiary rolls.
