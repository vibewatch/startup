      post-conversion holdco.
    whyItMatters: >-
      Founder-led businesses can still have strong governance, but the current public source set does not expose enough
      board detail to judge independence or oversight quality.
    diligencePath: >-
      Review MCA filings, any IPO draft prospectus when available, or direct investor-relations disclosures for board
      and committee composition.
