slug: ofbusiness
runDate: "2026-06-08"
company:
  name: OfBusiness

chapter:
  number: 8
  title: Valuation
  summary: >-
    OfBusiness has enough public evidence to support a serious IPO discussion, but not enough to
    underwrite the upper-end $6-9 billion mark now circulating in pre-IPO reporting. The cleanest
    current anchor is the roughly $4 billion October 2024 secondary, bracketed by the older $5
    billion December 2021 Series G and supported by profitable FY24 parent results plus a stronger,
    well-disclosed Oxyzo lending subsidiary. A defensible range today is about $4.0-5.2 billion,
    with fair value around $4-5 billion, stretched value above $6 billion, and expensive territory
    near $9 billion absent a public DRHP, updated parent audits, and clearer cap-table terms.

sections:
  - id: financing-anchors-and-ipo-path
    title: Financing Anchors, Latest Round, and IPO Path
    body: |
      The latest disclosed primary capital into OfBusiness is not a new hard pricing event but a small pre-IPO top-up: in April 2025 the company raised Rs 100 crore from Cornerstone Ventures, and the coverage explicitly framed the round as part of IPO preparation rather than as a fresh valuation reset. Public reports do not disclose the round price or a post-money mark, so it should not be treated as a clean valuation anchor. The last large priced equity anchor remains the December 2021 Series G, when OfBusiness raised $325 million at about a $5 billion valuation, including a sizeable $140 million secondary sale. More recent price discovery came from an October 2024 secondary transaction that Economic Times later described as valuing the company around $4 billion. That secondary matters more for current entry discipline because it sits much closer to the intended IPO window than the 2021 bull-market round.

      IPO preparation is real. Public reporting says OfBusiness converted itself into a public entity in January 2025, hired Axis Capital, JPMorgan, Citigroup, Morgan Stanley, and Bank of America, and explored an IPO of roughly $750 million to $1 billion with a mix of fresh issue and offer-for-sale shares. But the public evidence still stops short of a filed DRHP or a disclosed SEBI review milestone. At the same time, the broader 2026 IPO market has cooled, and late-stage private funding has become less forgiving. That combination matters: without a live filing, fresh parent audits, or a clearer public timeline, the current discussion around a $6-9 billion IPO value looks more like aspiration than demonstrated clearing price. The underwriting case should therefore lean on observed marks and disclosed financials, not on pre-listing headline targets.
