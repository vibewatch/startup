  - id: quality-of-earnings-and-subsidiary-support
    title: Parent Profitability, Oxyzo Filing Evidence, and Overhang
    body: |
      The strongest pro-valuation evidence is not the IPO chatter but the operating proof already visible in public sources. OfBusiness reported FY24 operating revenue of Rs 19,296.27 crore and consolidated net profit of roughly Rs 603 crore, while Financial Express separately described FY24 operating profit at Rs 666 crore and management's goal of lifting EBITDA margin above 5% from roughly 3.6% over three to five years. Those numbers show that OfBusiness is not a classic cash-burning marketplace; it has already reached meaningful scale and positive bottom-line territory. Even so, the business mix matters. A meaningful part of revenue comes from stock-in-trade and working-capital-linked commerce rather than a pure software or take-rate model, which limits how aggressively public-market internet multiples can be imported.

      The second major support is Oxyzo, the lending subsidiary. Here the public evidence is stronger because the company publishes an annual report and is followed by rating agencies. Oxyzo's FY25 annual report disclosed Rs 1,211 crore of total income, Rs 339 crore of PAT, Rs 9,236 crore of assets, debt outstanding of Rs 6,028 crore, customer base above 3.8 lakh, GNPA of 1.09%, and CRAR of 34%. March 2026 ICRA coverage then showed 9M FY26 total income of Rs 1,048 crore, PAT of Rs 267 crore, and loan book around Rs 9,501 crore as of December 31, 2025; FY26 news coverage later reported Rs 1,494 crore of revenue, Rs 375 crore of PAT, and loan book of Rs 10,545 crore. This helps the upper half of the range, but it does not remove overhang. CARE and ICRA both still highlight high growth, portfolio seasoning, and a 34-36% unsecured book as live risk factors. Public sources also identify major investors and ownership stakes, yet they do not disclose liquidation preferences, anti-dilution protections, or a full pre-IPO cap table, so dilution math remains incomplete.
