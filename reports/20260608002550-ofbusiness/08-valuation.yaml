  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold or observation
      - Why it matters
      - Action implication
    rows:
      - - IPO filing slippage
        - No public DRHP or credible filing timetable after another reporting cycle
        - Pushes the story back from observed pricing into pure aspiration.
        - Move toward the bear range and require a deeper discount.
      - - Oxyzo credit deterioration
        - Unsecured mix rises meaningfully or asset-quality metrics trend toward rating-agency negative triggers
        - Weakens the most transparent profit engine inside the group.
        - Cut range and focus diligence on credit-vintage losses.
      - - Parent disclosure disappointment
        - Fresh audits show weaker margins, lower profit conversion, or worse working-capital intensity than FY24 suggests
        - Undermines the argument for any premium over the 2024 secondary.
        - Rebase the case toward $3-4 billion.
      - - IPO-market weakness persists
        - New-age offerings continue to price below prior private marks
        - Makes the $6-9 billion range harder to defend in public-market bookbuilding.
        - Require evidence of a discounted issue price before engaging.
      - - Positive de-risking
        - Filed DRHP, fresh parent audits, and stable Oxyzo asset quality
        - The exact trio needed for the bull case.
        - Only then consider paying above the old $5 billion anchor.
    notes: >-
      The triggers mix company-specific evidence with market-specific evidence because OfBusiness is
      already on an IPO path; clearing price will depend on both.
    claimRefs:
