  evidenceGaps:
    - type: missing-source
      severity: material
      topic: drhp-status
      missingEvidence: A public DRHP, SEBI acknowledgement, or equivalent filing-timeline document for the IPO.
      whyItMatters: Without a live filing milestone, the reported IPO range remains aspiration rather than process-backed price discovery.
      diligencePath: Monitor SEBI public issues disclosures and syndicate-bank materials for a formal filing event.
      relatedQuestionRefs:
        - QV007
    - type: private-evidence-only
      severity: material
      topic: dilution-overhang
      missingEvidence: Full cap table, share classes, liquidation preferences, anti-dilution terms, and current option-pool detail.
      whyItMatters: Return modelling can change materially if late-stage preferred shareholders have stronger downside protection than common holders.
      diligencePath: Request shareholder agreements and the latest board-approved cap table in diligence.
      relatedQuestionRefs:
        - QV013
        - QV029
    - type: missing-source
      severity: material
      topic: parent-current-audits
      missingEvidence: Audited FY25 and FY26 consolidated parent financials plus segment gross-margin and working-capital disclosure.
      whyItMatters: The current range leans heavily on FY24 parent data and more recent Oxyzo data, leaving the parent-side trend only partially observed.
      diligencePath: Wait for audited statements or obtain the same disclosures through a future DRHP.
      relatedQuestionRefs:
        - QV008
        - QV023
        - QV029
    - type: enumeration-incomplete
      severity: minor
      topic: comparable-valuation-table
      missingEvidence: A broader set of public-market and transaction comps across industrial procurement, B2B platforms, and fintech-enabled trade finance.
      whyItMatters: The comparable table is decision-useful but intentionally partial, so it should frame valuation rather than pretend to be exhaustive.
      diligencePath: Expand the comp set once more public filings or directly relevant listed peers are available.
      relatedQuestionRefs:
        - QV018
        - QV019
      relatedTableRefs:
        - TV004
