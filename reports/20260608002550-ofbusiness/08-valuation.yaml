tables:
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Assessment
      - Decision implication
    rows:
      - - Recommendation
        - Track / price-sensitive
        - Do not underwrite the upper-end IPO ask until parent filings and cap-table terms are public.
      - - Confidence
        - Medium
        - Core financial anchors are real, but current parent disclosure is still incomplete.
      - - Risk rating
        - High
        - IPO timing, disclosure quality, and Oxyzo credit seasoning can all move valuation quickly.
      - - Valuation stance
        - Fair around $4-5 billion; stretched above $6 billion
        - The 2024 secondary is supportable; the floated $6-9 billion range is not yet fully evidenced.
      - - Best current anchor
        - October 2024 secondary at about $4 billion
        - It is the most recent observed price signal and is closer to the intended IPO window than the 2021 round.
      - - Bull-case requirement
        - DRHP plus fresh parent audits and stable Oxyzo asset quality
        - Needed before underwriting $6-7 billion with confidence.
      - - Primary downside trigger
        - IPO delay plus weaker risk appetite or Oxyzo credit slippage
        - Can compress the range toward $3-4 billion.
      - - Entry discipline
        - Prefer exposure only near the current secondary anchor or below
        - Margin of safety disappears quickly once investors start paying for the $6-9 billion headline range.
    notes: >-
      Assessment is intentionally price-sensitive rather than a generic company-quality score.
      The table treats observed market marks and public filings as harder evidence than pre-IPO headlines.
