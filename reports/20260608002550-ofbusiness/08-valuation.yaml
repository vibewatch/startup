  - id: comparable-set-and-multiple-discipline
    title: Comparable Set and Multiple Discipline
    body: |
      The public-comparable exercise is directionally useful but needs heavy adjustment. IndiaMART and PB Fintech are the most usable listed Indian references in the retained source set because both are sizeable digital platforms with public disclosure, meaningful profitability progress, and observable market caps. As of the June 2026 run date, CompaniesMarketCap put IndiaMART's market value at about $1.25 billion and PB Fintech's at about $7.4 billion. Screener data shows IndiaMART's latest four reported quarters summing to about Rs 1,569 crore of sales and PB Fintech's latest four reported quarters summing to about Rs 6,794 crore. That implies rough market-cap-to-sales multiples of about 7.5x for IndiaMART and about 10.3x for PB Fintech. Both trade on cleaner disclosure and much lighter balance-sheet intensity than OfBusiness.

      That gap is the key discipline. OfBusiness produced roughly $2.3 billion of FY24 revenue and about $72.6 million of FY24 after-tax profit. The October 2024 secondary at about $4 billion implies about 1.7x sales and roughly 55x earnings on that FY24 base. The old $5 billion 2021 mark implies about 2.2x sales and about 69x earnings on the same base, while the floated $6-9 billion IPO range implies about 2.6-3.9x sales and about 83-124x earnings. Those sales multiples are still far below IndiaMART or PB Fintech, but that does not make the IPO ask obviously cheap because OfBusiness's revenue quality is lower: it combines inventory-heavy trade, manufacturing exposure, and embedded credit through Oxyzo. A reasonable valuation framework therefore gives OfBusiness a much lower revenue multiple than asset-light digital platforms while still crediting it for profitability, scale, and an increasingly valuable finance arm. That logic points back toward the $4-5 billion zone rather than toward the top of the reported IPO range.
