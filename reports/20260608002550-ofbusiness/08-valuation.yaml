  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability signal
      - Valuation range
      - Core assumptions
      - Main failure mode
    rows:
      - - Bear
        - 25%
        - $3.0B-$4.0B
        - IPO timing slips, 2026-style risk aversion persists, and investors penalize inventory-heavy revenue plus Oxyzo unsecured-book monitorables.
        - IPO window stays shut or the next live mark clears below the 2024 secondary.
      - - Base
        - 50%
        - $4.0B-$5.2B
        - FY24 parent profitability broadly holds, Oxyzo keeps printing clean credit metrics, and disclosure improves but remains short of full public-company transparency.
        - Investors pay around the older $5 billion mark but refuse to stretch toward the aspirational IPO range.
      - - Bull
        - 25%
        - $6.0B-$7.0B
        - Parent files a DRHP with fresh audits, margin progression is visible, and Oxyzo asset quality stays strong into the IPO roadshow.
        - Market conditions or new filings fail to support the extra multiple expansion.
      - - Probability-weighted central estimate
        - 100%
        - $4.6B-$4.9B
        - Midpoint outcome reflects observed anchors, not management aspiration.
        - Paying near $9 billion would require overweighting the bull case before the evidence arrives.
    notes: >-
      Scenario ranges are analyst estimates tied to observed secondary pricing, FY24 parent revenue,
      Oxyzo filing evidence, and June 2026 public-comp data. They are not management guidance.
