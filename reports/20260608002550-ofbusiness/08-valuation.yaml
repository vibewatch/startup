  - id: TV004
    title: Comparable valuation table
    columns:
      - Comparable or anchor
      - Status / date
      - Valuation or multiple anchor
      - Relevance to OfBusiness
      - Limitation
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the decision-useful valuation anchors visible as of the 2026-06-08 run date: the
        latest OfBusiness financing signals, the current IPO ask, and the most comparable Indian
        listed digital-platform benchmarks with readable market-data pages. It is not an exhaustive
        survey of every listed industrial, marketplace, or fintech company.
    rows:
      - - OfBusiness latest primary round
        - April 2025, private
        - Rs 100 crore from Cornerstone Ventures; valuation undisclosed
        - Shows capital is still available and the company remains IPO-bound.
        - Too small and too undisclosed to serve as a hard valuation reset.
      - - OfBusiness secondary transaction
        - October 2024, private secondary
        - About $4 billion implied valuation
        - Best current live market anchor because it is recent and close to the intended IPO window.
        - Secondary pricing can reflect liquidity dynamics rather than a full institutional diligence process.
      - - OfBusiness Series G
        - December 2021, priced equity round
        - $325 million raised at about $5 billion; included $140 million secondary
        - Last large hard primary mark and still an important historical anchor.
        - Set in a stronger private-market environment and now materially dated.
      - - IndiaMART
        - Public, June 2026
        - About $1.25 billion market cap; roughly 7.5x latest-12-month sales on Screener data
        - Useful public benchmark for a scaled Indian B2B marketplace with transparent reporting.
        - Asset-light model and no lending book make it cleaner and deserving of a richer sales multiple.
      - - PB Fintech
        - Public, June 2026
        - About $7.4 billion market cap; roughly 10.3x latest-12-month sales on Screener data
        - Shows what public investors will still pay for scaled, profitable digital-distribution platforms in India.
        - Much better disclosure, lighter working-capital needs, and less inventory exposure than OfBusiness.
      - - Reported IPO aspiration
        - 2024-2026 pre-IPO reporting
        - $6-9 billion target range for a $750 million-$1 billion IPO
        - Defines the price zone management and bankers are trying to reach.
        - No public DRHP or fresh parent audit in retained sources yet supports that top end.
    notes: >-
      Public-comparable multiples are used as directional guardrails rather than direct transfer prices.
      OfBusiness's blended commerce-and-credit model requires a discount to asset-light internet peers.
