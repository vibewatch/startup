  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Dimension
      - Bull thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Parent operating proof
        - FY24 revenue of Rs 19,296 crore and net profit of about Rs 603 crore show OfBusiness is already scaled and profitable.
        - Revenue still includes stock-in-trade and manufacturing-linked economics, so quality is lower than a software-like marketplace.
        - Audited FY25/FY26 parent statements with segment detail and stable profit conversion.
      - - Oxyzo support
        - Oxyzo adds a profitable, well-disclosed finance arm with FY25 PAT of Rs 339 crore and FY26 PAT of Rs 375 crore.
        - Rating agencies still flag growth pace, seasoning, and a 34-36% unsecured book as monitorables.
        - Another year of clean credit performance plus better vintage disclosures.
      - - IPO path
        - Public-company conversion and bank mandates show the listing process is genuine.
        - No public DRHP or visible SEBI milestone in retained sources means the path is not yet de-risked.
        - A filed DRHP and updated timetable would justify moving closer to the bull range.
      - - Current market mark
        - The 2024 secondary at about $4 billion is a live and defensible anchor.
        - The latest Rs 100 crore round disclosed no valuation and cannot replace the secondary as price evidence.
        - A larger disclosed primary or secondary at a higher price.
      - - Public comp support
        - IndiaMART and PB Fintech show public markets still reward scaled digital platforms.
        - Those platforms are asset-light and more transparent, so their multiples should not be ported directly into OfBusiness.
        - Proof that OfBusiness's blended commerce-credit model can sustain higher margins than investors currently assume.
      - - Cap-table overhang
        - Public sources identify major investors and promoter ownership.
        - Preference stack, anti-dilution terms, and full pre-IPO ownership economics remain undisclosed.
        - Full cap-table and shareholder-rights schedules.
    notes: >-
      The anti-thesis is driven less by demand risk than by disclosure quality and business-mix
      adjustment. OfBusiness may be a good company while still being a poor buy at the wrong price.
