figures:
- id: FU001
  title: OfBusiness customer journey map
  type: journey-map
  layout: wide
  summary: Publicly visible journey from industrial demand discovery into supplier matching, financing, delivery, and repeat procurement.
  data:
    items:
    - label: Discovery
      value: Homepage, app, or raw-material category pages surface prices, news, and categories for industrial inputs.
      note: Discovery is anchored on price intelligence and category breadth rather than brand-led storytelling.
    - label: Requirement capture
      value: Buyer submits enquiry or searches app for material, quantity, and geography.
      note: Public flow is self-serve at the top of funnel.
    - label: Supplier match
      value: Supplier portal and KAM process coordinate verified-buyer enquiries and seller documents.
      note: Supplier participation is visible and explicit, not hidden middleware.
    - label: Financing decision
      value: Oxyzo can add purchase finance, vendor finance, invoice discounting, or work-order finance when capital is needed.
      note: Finance is embedded as an optional but central conversion layer.
    - label: Fulfillment and documentation
      value: Shipment tracking, invoices, ledgers, and e-way-bill workflows stay inside the app or web surface.
      note: Operational visibility is part of the repeat-use pitch.
    - label: Repeat use and expansion
      value: Customers can reorder, draw again, expand to capex or receivables products, or deepen supplier relationships.
      note: The strongest monetization logic is repeated operational use, not one-off acquisition.
  approximationNotes: The journey merges buyer, supplier, and borrower steps from separate public pages; internal underwriting and exception loops are not public.
  claimRefs:
  - CU004
  - CU005
  - CU020
  - CU021
  - CU022
  - CU023
  - CU042
