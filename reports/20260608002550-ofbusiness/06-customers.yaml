company:
  name: OfBusiness
chapter:
  number: 6
  title: Customers
  summary: OfBusiness shows real customer activity across a two-sided industrial network of buyers, suppliers, and Oxyzo-financed borrowers. Public proof is strongest on workflow breadth and testimonial variety—homepage quotes, supplier references, 50,000+ MSME app claim, 5,000+ Oxyzo customers, 100,000+ app installs, and a ₹10,545 crore FY26 loan book—but weak on named logos, retention, and top-customer concentration. The key diligence risk is not absence of adoption signals; it is the lack of cohort, ROI, and exposure detail needed to judge durability.
sections:
- id: customer-base-segmentation
  title: Customer Base Segmentation
  body: 'OfBusiness’s public surfaces support a three-layer customer map rather than a single buyer persona. First are procurement-side buyers: manufacturers, contractors, traders, distributors, renewable-energy operators, infrastructure firms, and other industrial businesses that need raw materials, price intelligence, fulfillment, and shipment visibility. Second are suppliers that join the network to receive verified-buyer enquiries, key-account support, and logistics coordination. Third are Oxyzo borrowers—SMEs and emerging corporates that use purchase finance, invoice discounting, work-order finance, machinery finance, business loans, or loan-against-property products to smooth procurement and growth. The company’s own scale banners are broad rather than cohort-specific: 500,000+ orders delivered, 2 million+ SMEs empowered, 26-state reach, and 15+ countries served. Google Play narrows that story by saying 50,000+ MSMEs have procured raw materials through the app. Together these sources
    show a real and multi-segment user base, but they do not cleanly separate buyers from suppliers, app users from financed borrowers, or active customers from lifetime relationships.'
  claimRefs:
