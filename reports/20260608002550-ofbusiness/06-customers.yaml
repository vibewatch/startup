- id: retention-repeat-and-service-signals
  title: Retention, Repeat Usage, and Service Signals
  body: No public source reviewed for this chapter discloses NRR, GRR, churn, renewal rate, contract length, cohort retention, or satisfaction survey data. That is the biggest weakness in OfBusiness’s customer record. Still, the operating design suggests recurring use for customers that clear the eligibility bar. Purchase finance is built around repeated supplier invoices and 60–120 day cycles; invoice discounting assumes ongoing receivables from creditworthy buyers; vendor finance is structured around anchor-supplier relationships; and work-order finance covers repeat execution against government or corporate orders. Those features all imply that OfBusiness and Oxyzo are aiming for repeat transaction loops rather than one-off lead generation. The problem is proof quality. AppBrain includes positive comments about pricing and market updates, but it also captures adverse reviews about bugs, weak response after document submission, and missing channel-partner workflow. Oxyzo’s FAQ and RBI-linked
    grievance language show that escalation channels exist, yet the standalone grievance page itself is sparse. Overall, repeat-use logic is clear, while retention disclosure is not.
  claimRefs:
  - CU020
  - CU023
  - CU028
  - CU029
  - CU030
  - CU037
  - CU039
  - CU047
  tableRefs:
  - TU005
- id: expansion-dynamics-and-concentration-risks
  title: Expansion Dynamics and Concentration Risks
  body: 'The strongest expansion vector is wallet-share expansion inside the same operating relationship. A procurement customer can add purchase finance, vendor finance, invoice discounting, work-order finance, machinery finance, business loans, or loan-against-property as needs evolve from sourcing into execution, receivables, capex, and collateral-backed borrowing. That is strategically attractive because it raises switching costs without requiring a separate customer-acquisition stack. However, concentration and disclosure risks remain material. CARE says roughly 34–36% of Oxyzo’s AUM was unsecured in 2025 and that the unsecured segment—largely SMEs with turnover above ₹200 crore—must be monitored as the book seasons. Moneycontrol also shows that Oxyzo depends on diversified bank, NBFC, and capital-market funding to keep deepening SME engagement, so customer expansion is partly tied to lender confidence and liquidity. Public evidence is also testimonial-heavy and segment-blurred: the
    company mixes orders, SMEs empowered, app users, suppliers, and financed borrowers in headline marketing without giving top-customer exposure or cohort breakdown. Investors should therefore treat customer breadth as credible, but concentration and durability as unproven until data-room evidence closes the gaps.'
