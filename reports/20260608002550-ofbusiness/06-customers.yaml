- id: adoption-and-named-proof
  title: Adoption and Named Proof Signals
  body: 'Public adoption evidence is credible but unevenly distributed. At the broadest level, the homepage advertises 500,000+ orders delivered and 2 million+ SMEs empowered, while the Google Play listing says OfBusiness has helped over 50,000 MSMEs procure raw materials and gives buyers tools for buying, selling, shipment tracking, invoice management, price monitoring, and AI-assisted queries. Independent app aggregators corroborate real distribution: 100,000+ installs on Google Play, roughly 180,000 cumulative downloads on AppBrain, and 112,698 estimated installs on AndroidRank. Oxyzo adds a parallel credit-adoption signal: the FAQ says it serves 5,000+ SME and corporate customers, and Moneycontrol says its FY26 loan book reached ₹10,545 crore as demand from SMEs continued. Named proof exists, but mostly through testimonials rather than logos or case studies. The OfBusiness homepage carries named quotes from Sajal Gupta, Rahul Bansal, Ankit Garg, and Jagdeep Bansal; Oxyzo uses a named
    borrower story from Vinay Yadav. Those references are useful because they show production-like use cases, yet none provide company names, spend, contract length, or quantified ROI beyond qualitative claims.'
  claimRefs:
