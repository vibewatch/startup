- id: supplier-network-and-partner-proof
  title: Supplier Network and Partner Proof
  body: 'The supplier side is not a background detail; it is a visible part of the customer proposition. OfBusiness’s supplier portal explicitly promises access to verified buyers, quotation requests, and broader exposure to its customer network. Onboarding is described as a three-step, free process supported by GST, cancelled-cheque, and e-KYC documentation, with a key account manager assigned after registration. Public supplier proof is also stronger than the usual logo wall. Om Prakash Tiwari says OfBusiness quality-checks products before they reach customers, Jatinder Kumar calls the platform a growth partner that expanded market reach, and Rakesh Sinha frames the relationship around fairness, attentiveness, and trust. The same portal says suppliers have grown their business three times with OfBusiness and that the company provides logistics support through a wide network of providers. Oxyzo’s vendor-finance page reinforces the same two-sided logic: anchor-led financing is positioned
    as a way to pay suppliers early while improving buyer economics. That is strong partner proof for workflow relevance, even if exact supplier counts and churn are still undisclosed.'
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  - CU009
  - CU010
  - CU021
  - CU042
  tableRefs:
  - TU002
