  evidenceGaps:
  - type: missing-source
    severity: material
    topic: named-customer-roi
    missingEvidence: Named customer roster with company names, deployment dates, spend or savings metrics, contract length, and reference-call availability.
    whyItMatters: Testimonials confirm relevance, but investors still cannot judge whether the largest buyers or borrowers are durable, referenceable, and economically attractive.
    diligencePath: Request the top 20 customer and top 20 borrower reference list with one-page case studies, renewal status, and quantified outcomes.
    relatedQuestionRefs:
    - QU020
    - QU025
    relatedTableRefs:
    - TU004
  - type: private-evidence-only
    severity: material
    topic: retention-cohorts
    missingEvidence: NRR, GRR, logo retention, borrower repeat-draw cohorts, complaint-resolution cohorts, and annual churn by segment.
    whyItMatters: The chapter can show workflow logic and adoption proxies, but without cohort metrics there is no direct evidence that customers stay, expand, or repay predictably over time.
    diligencePath: Ask management for monthly cohort tables across procurement buyers, suppliers, and Oxyzo borrowers, including repeat-order and repeat-draw frequencies.
    relatedQuestionRefs:
    - QU021
    - QU025
    relatedTableRefs:
    - TU005
  - type: private-evidence-only
    severity: material
    topic: concentration-disclosure
    missingEvidence: Top-customer, top-borrower, top-anchor, and supplier concentration packs with exposure percentages and overdue buckets.
    whyItMatters: Public sources support breadth but say almost nothing about whether revenue, credit exposure, or supplier dependence is concentrated in a few accounts.
    diligencePath: Request top-10 and top-20 exposure schedules, concentration stress tests, and secured versus unsecured mix by customer cohort.
    relatedQuestionRefs:
    - QU022
    - QU025
    relatedTableRefs:
    - TU006
