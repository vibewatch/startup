- id: leadership-governance
  title: Leadership Visibility, Governance Signals, and Key-Person Dependence
  body: |-
    Public leadership visibility remains centered on the founding group. The official team page still prominently surfaces Asish Mohapatra, Bhuvan Kumar Gupta, Ruchi Kalra, and Vasant Sridhar, while third-party databases continue to tag Mohapatra as co-founder and CEO, Gupta as co-founder and CTO, and Kalra as co-founder and finance leader. Reuters also identifies Bhavesh Keswani as CFO during the IPO process, which matters because the CFO, not just the CEO, is part of the external market-facing management bench during listing preparation.

    The main adverse leadership development in retained coverage is Nitin Jain's 2026 exit after roughly a decade with OfBusiness and Oxyzo. That does not on its own break the company's continuity story because the remaining founder cohort still appears active, but it does tighten key-person concentration at a sensitive moment. The business is being marketed to public investors as a scaled, profitable, integrated platform while simultaneously simplifying structure and consolidating subsidiaries. Any founder departure during that window deserves monitoring even if the remaining leaders are entrenched and publicly visible.

    Governance disclosure is adequate for identifying leaders but still thin for judging oversight quality. The current source set is much better at showing executives than at showing board composition, committee assignments, or true independent-director balance at the holdco level. Because the company has already converted into a public entity, that omission is notable rather than fatal. It means later diligence should not assume robust listed-company governance merely from the legal-status change; formal board evidence still needs to be collected directly from filings or the eventual prospectus.
