callouts:
- calloutType: strength
  title: Integrated commerce-plus-finance stack is the core differentiator
  body: The strongest chapter-1 throughline is not just raw-material trading volume but the combination of discovery tools, procurement, financing, and increasingly vertically integrated fulfillment. That makes Oxyzo and BidAssist integral to the investment story rather than ancillary businesses.
  claimRefs:
  - CO001
  - CO006
  - CO029
  - CO040
- calloutType: risk
  title: IPO preparation is real, but disclosure quality still lags the narrative
  body: Retained sources show active IPO planning, yet headcount remains inconsistent, the cap table is not publicly clean after secondary activity, and adverse signals include founder Nitin Jain's exit plus a 2024 valuation reset. Those gaps matter because the company is already marketing itself as a public-ready integrated platform.
