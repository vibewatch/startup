  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-headcount-scope
    missingEvidence: A single audited or board-approved current headcount number that reconciles group, operating-company, and legal-entity scopes.
    whyItMatters: Headcount is a cover metric and current public evidence conflicts across official marketing and market-data sources, which weakens operating-efficiency comparisons.
    diligencePath: Request the latest consolidated HR dashboard or DRHP workforce note from management and reconcile it against legal-entity payroll plus group subsidiary rolls.
    relatedQuestionRefs:
    - QO018
  - type: enumeration-incomplete
    severity: material
    topic: governance-board-visibility
    missingEvidence: A current public board roster with committee assignments, independent-director status, and role titles for the post-conversion holdco.
    whyItMatters: Founder-led businesses can still have strong governance, but the current public source set does not expose enough board detail to judge independence or oversight quality.
    diligencePath: Review MCA filings, any IPO draft prospectus when available, or direct investor-relations disclosures for board and committee composition.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: material
    topic: post-secondary-cap-table
    missingEvidence: A post-2024 cap table with exact ownership percentages after secondary exits, Cornerstone entry, and any pre-IPO ESOP liquidity transactions.
    whyItMatters: IPO supply, control, and exit overhang depend on who still owns the stock after the 2024–2025 secondary activity, and public datasets disagree on both ownership and total capital raised.
    diligencePath: Obtain the latest shareholder register or draft prospectus capitalization table and reconcile it against Tracxn, Dealroom, and news reports.
    relatedQuestionRefs:
    - QO011
    - QO025
    relatedTableRefs:
    - TO003
  - type: missing-source
    severity: minor
    topic: litigation-and-regulatory-screen
    missingEvidence: A regulator-grade legal screen covering courts, sanctions lists, and enforcement databases tied directly to OFB Tech Limited and core subsidiaries.
    whyItMatters: Retained adverse coverage did not surface a major enforcement event, but absence from media coverage is weaker than a direct legal and regulatory search on named entities.
    diligencePath: Run named-entity searches across Indian court databases, MCA charge and filing records, SEBI enforcement releases, and sanctions or watchlist datasets using OFB Tech Limited and Oxyzo entity names.
    relatedQuestionRefs:
    - QO023
  - type: private-evidence-only
    severity: material
    topic: latest-audited-group-metrics
    missingEvidence: Audited FY25 consolidated OfBusiness financial statements and any group-level FY26 metrics beyond subsidiary snippets and acquisition commentary.
    whyItMatters: Moneycontrol disclosed FY25 revenue and PAT during the Indian Design story, but without a retained audited filing the newest group numbers still carry article-level interpretation risk.
