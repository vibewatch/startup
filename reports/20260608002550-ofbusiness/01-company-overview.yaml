- id: funding-investors
  title: Funding History, Investor Map, and IPO Positioning
  body: |-
    OfBusiness has a long funding staircase that starts with a $5 million Series A in 2016, steps through 2018 and 2019 growth rounds, and then accelerates sharply in 2021 with multiple valuation marks. Dealroom records a $110 million round at an $800 million valuation in April 2021, a SoftBank-led $160 million round at a $1.6 billion valuation in July 2021, a $200 million Tiger round at a $3.0 billion valuation in September 2021, and a $325 million Series G at a $5.0 billion valuation in December 2021. That sequence is the canonical funding arc for chapter 1 because it explains both the investor roster and the later debate around present valuation.

    The investor map is unusually well signposted on the official site. Tiger Global, Norwest Venture Partners, SoftBank, Matrix Partners, Falcon Edge, Creation Investments, and Zodius Capital all appear directly on the investor page, while late-stage news adds Cornerstone Ventures ahead of the IPO. What remains unclear is exact ownership after the 2024 secondary activity, 2025 Cornerstone round, and ESOP liquidity. Tracxn and Dealroom also disagree on total historical funding, which suggests at least one dataset is including debt, secondary transactions, or other non-comparable instruments.

    IPO signaling is real but still provisional. Reuters reported a target issue size of $750 million to $1 billion and identified Bank of America, Citi, JPMorgan, Morgan Stanley, and Axis Capital as bankers, while another Reuters report cited an unconfirmed valuation ambition of $6 billion to $9 billion. That should be read against the more sober 2024 secondary mark of about $4 billion. In other words, the company is clearly in the listing lane, but the public evidence still supports a range of valuation narratives rather than one settled pre-IPO number.
