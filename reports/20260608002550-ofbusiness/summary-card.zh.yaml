summary:
  headline: OfBusiness 确实是一家已具规模、能盈利的工业 B2B 商贸加金融平台；但缺少母公司最新审计和公开 DRHP，只值得围绕约 $4 billion 的老股锚点观察，而不是按传闻中的 $6-9 billion IPO 区间定价。
