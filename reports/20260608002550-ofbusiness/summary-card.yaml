  topStrengths:
    - >-
      OfBusiness has a real integrated workflow across BidAssist, Nexizo, procurement and fulfillment, and Oxyzo
      financing rather than a discovery-only marketplace surface.
    - >-
      FY24 parent results show unusual scale and profitability for a venture-backed B2B platform, while Oxyzo provides
      cleaner public evidence on credit quality, capitalization, and earnings.
    - >-
      Public customer and product evidence supports a recurring use case for established industrial SMEs and emerging
      corporates with real procurement and working-capital pain points.
    - >-
      The company has retained access to capital and has already completed visible IPO-preparation steps, which reduces
      near-term financing risk even if listing timing remains open.
  topRisks:
    - >-
      Parent disclosure remains incomplete: there is still no public DRHP, no fresh parent audited FY25/FY26 financials,
      and no clean public view of cash, take rate, or full cap-table economics.
    - >-
      Oxyzo credit seasoning remains the sharpest operational risk because about one-third of AUM is unsecured and
      valuation support depends heavily on stable asset quality and funding access.
    - >-
      OfBusiness's blended commerce-and-credit model is more commodity- and working-capital-intensive than the public
      internet-platform comparables often used in IPO framing.
    - >-
      Customer durability is under-disclosed because public sources do not provide NRR, churn, cohort retention, or
      top-customer concentration.
    - >-
      The floated $6-9 billion IPO range is ahead of the retained evidence and could compress quickly if IPO timing
      slips or market appetite weakens.
  unresolvedGaps:
    - >-
      Fresh FY25 and FY26 audited parent financial statements, including segment economics, gross margin, and
      working-capital intensity by vertical.
    - >-
      Full cap table, share classes, option pool, preference stack, and ownership after the 2024 secondary and pre-IPO
      liquidity activity.
    - >-
      Oxyzo vintage loss curves, secured-versus-unsecured cohort performance, and concentration data for the lending
      book.
    - >-
      Customer-cohort retention, top-account concentration, and a clean bridge between app users, buyers, suppliers, and
      financed borrowers.
    - >-
      Public DRHP timing, issue structure, and use-of-proceeds detail sufficient to test IPO readiness and valuation
      support.
