summary:
  headline: >-
    OfBusiness is a real scaled and profitable industrial B2B commerce-plus-finance platform, but without fresh parent
    audits and a public DRHP it is only worth tracking near the roughly $4 billion secondary anchor, not the floated
    $6-9 billion IPO range.
