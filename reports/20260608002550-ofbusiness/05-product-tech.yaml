company:
  name: OfBusiness
chapter:
  number: 5
  title: Product & Technology
  summary: 'OfBusiness presents a tightly linked product stack: BidAssist for opportunity discovery, Nexizo for market intelligence, a procurement and supplier workflow for raw materials, and Oxyzo for embedded lending. Public evidence supports strong workflow definition around categories, onboarding, shipment tracking, and digital credit eligibility, plus meaningful Android-app usage signals. The main weaknesses are not commercial breadth but technical openness: public API references, uptime or incident disclosures, and broader procurement-surface security documentation remain thin, so diligence should treat architecture defensibility as only partially verified.'
sections:
- id: product-definition-workflow
  title: Product Definition and Procurement Workflow
  body: 'OfBusiness''s public product story is built around a full SME purchasing journey rather than a narrow catalog. The customer can come in directly for raw-material sourcing or enter via tender discovery and price intelligence. Official homepage copy positions the company as a raw-material procurement and credit platform with 500+ categories, 300K+ multi-brand SKUs, app-and-web order transparency, and live tracking. The supplier portal makes the sell-side workflow similarly explicit: onboarding is marketed as a three-step process, a key account manager is assigned after registration, and suppliers are asked for GST, bank, and e-KYC documentation. Together with the Android app description, the retained sources show a concrete buyer workflow: discover demand, check prices, request quotations, place an enquiry, optionally take credit, and then manage deliveries, invoices, and ledgers through the same digital surface. Category breadth is strongest in industrial materials such as steel,
    chemicals, polymers, energy, non-ferrous materials, and agriculture-linked products, which is consistent across homepage, supplier, and app surfaces.'
