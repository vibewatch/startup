- id: platform-capabilities-architecture
  title: Platform Capabilities, Module Map, and Operating Architecture
  body: 'The broader architecture is modular and workflow-specific rather than a monolithic B2B storefront. OfBusiness''s about page says the company starts upstream with BidAssist, which gives access to a large tender corpus and associated bidding documents, then layers Nexizo for price intelligence and buyer discovery before routing customers into OfBusiness sourcing and Oxyzo financing. BidAssist''s own site adds detail that the platform is more than a tender list: it exposes historical results, document intelligence, AI-driven shortlisting, and a Tender API that can be integrated into ERP or procurement systems. Nexizo extends the stack into sales, inventory, production, and logistics workflows while claiming compatibility with larger ERP and CRM environments. Public technical evidence is still commercial rather than engineering-grade; we can see modules, data products, and integration claims, but not underlying system design, uptime commitments, or API reference detail. That means the
    product architecture can be mapped at the layer level with reasonable confidence, while low-level implementation specifics remain a diligence gap.'
  claimRefs:
