  - FE003
- id: trust-compliance-docs
  title: Trust, Compliance, Privacy, and Documentation Coverage
  body: 'Trust and compliance evidence is materially better on the Oxyzo lending surface than on the broader OfBusiness procurement surface. Oxyzo''s FAQ explicitly ties the company to RBI registration under Section 45-IA, lays out a three-level grievance process with escalation to the RBI Ombudsman, and repeats a detailed digital-documentation checklist across products. The privacy-policy PDF goes further, showing dedicated sections for collection, sharing, retention, control, security, and grievance handling. RBI''s 2025 digital-lending and NBFC direction pages provide the external rule book around customer protection, lender-service-provider arrangements, and scale-based regulation. Oxyzo also exposes public support and investor-relations pages, which strengthens the compliance and disclosure footprint. The gap is that comparable public trust artifacts for the core OfBusiness procurement stack are much thinner. We could verify support and workflow pages, but not a strong public set of
    API docs, uptime commitments, incident reporting, or security attestations for the raw-material marketplace itself. That makes compliance maturity asymmetric across the group: lending workflows are documented; procurement architecture and security governance are still only lightly surfaced in public.'
  claimRefs:
  - CE033
  - CE034
  - CE035
  - CE036
  - CE037
  - CE038
  - CE039
  - CE046
