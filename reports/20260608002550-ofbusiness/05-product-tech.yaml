- id: embedded-financing-operating-model
  title: Embedded Financing Workflow and Operating Dependencies
  body: 'The financing workflow is where the stack becomes differentiated in operational terms. Oxyzo''s purchase-finance page describes a model in which the lender pays suppliers directly against submitted invoices and the borrower repays over a 60-120 day cycle, effectively embedding working capital into raw-material procurement. Invoice discounting handles the opposite timing problem: once the seller has receivables, Oxyzo can advance funds against selected invoices using a recourse structure with an escrow-style collection mechanism. Separate business-loan and machinery-finance products extend the same customer relationship into capex and longer-term expansion. Across those products, Oxyzo repeats a common documentation spine — promoter KYC, GSTIN, bank statements, GSTR data, and audited financials — which signals a standardized digital underwriting workflow rather than ad hoc product operations. The public dependency map is also clear: app-store distribution matters for the mobile surface,
    RBI rules matter for lending conduct, supplier and transporter networks matter for fulfillment, and third-party cloud, CRM, and payment vendors likely matter for web and transaction reliability. Those dependencies are visible even though the precise internal orchestration is not.'
  claimRefs:
  - CE025
  - CE026
  - CE027
  - CE028
  - CE029
  - CE030
  - CE031
  - CE032
  - CE034
  - CE044
