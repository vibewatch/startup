  evidenceGaps:
  - type: access-blocked
    severity: material
    topic: public-legal-coverage
    missingEvidence: A fully accessible public OfBusiness privacy, terms, and security artifact set that can be fetched end-to-end without broken or generic landing-page responses.
    whyItMatters: The procurement platform handles pricing, shipment tracking, document exchange, and buyer or supplier onboarding data, so legal and data-handling clarity affects enterprise diligence.
    diligencePath: Request the current OfBusiness privacy policy, terms of use, and any security or data-processing addenda directly from the company and verify the live URLs that buyers and suppliers are meant to use.
    relatedQuestionRefs:
    - QE016
  - type: private-evidence-only
    severity: material
    topic: public-technical-docs
    missingEvidence: Public API references, uptime or status commitments, architecture documentation, or security attestations for the OfBusiness procurement, BidAssist, and Nexizo surfaces.
    whyItMatters: Without public technical artifacts it is difficult to separate a production-grade systems moat from a commercial front-end layered on largely undocumented processes and dependencies.
    diligencePath: Ask for API documentation, architecture diagrams, uptime reports, incident history, security certifications, and enterprise integration playbooks under NDA.
    relatedQuestionRefs:
    - QE021
  - type: missing-source
    severity: minor
    topic: independent-stack-validation
    missingEvidence: Independent corroboration of the precise web stack, cloud estate, data pipelines, and payment or CRM dependencies behind the public platform.
    whyItMatters: ContactOut provides only a loose external fingerprint, which is useful as a proxy but not strong enough to underwrite architecture resilience or switching costs.
    diligencePath: Validate infrastructure and vendor concentration from architecture interviews, cloud bills, vendor contracts, and observability screenshots rather than third-party stack-detection sites.
    relatedQuestionRefs:
    - QE020
