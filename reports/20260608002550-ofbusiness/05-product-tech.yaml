- id: TE002
  title: Procurement and Financing Workflow Use-Case Table
  columns:
  - User Job
  - Current Workflow
  - OfBusiness / Oxyzo Solution
  - Measurable Benefit
  - Known Limitation
  rows:
  - - Tender-led demand discovery
    - Manually search portals, download documents, shortlist tenders by hand
    - BidAssist aggregates tenders, documents, historical results, AI insights, and API feeds
    - Lower discovery friction and faster opportunity triage
    - No public API docs or evidence of downstream conversion rates
  - - Spot price discovery and quote request
    - Call multiple traders or brokers for daily rates
    - OfBusiness homepage/app plus Nexizo show live prices, news, and quote flows
    - Faster price visibility across many categories
    - Exact source methodology for pricing feeds is not public
  - - Supplier onboarding and response
    - Offline document exchange and ad hoc introductions
    - Supplier portal collects GST, cheque, and e-KYC, then assigns a KAM
    - Faster seller activation with zero public onboarding fee
    - Public portal does not expose payout policies or supplier analytics
  - - Working-capital assisted procurement
    - Buyer delays orders until cash is available
    - Oxyzo purchase finance pays supplier directly against invoice and extends 60-120 day repayment
    - Potential cheaper procurement and smoother working capital cycles
    - Underwriting model and approval-rate transparency are missing
  - - Receivables monetisation after sale
    - Seller waits for buyer payment or uses bank overdraft
    - Oxyzo invoice discounting monetises selected invoices through a recourse structure
    - Improves liquidity without financing the entire debtor book
    - Buyer-concentration and loss assumptions are not public
  - - Capex expansion or equipment purchase
    - Separate bank loan search and long paperwork cycle
    - Oxyzo business loan and machinery finance extend the same borrower relationship into term credit
    - Unified lender relationship for operations plus expansion
    - No public cohort data on secured vs unsecured machinery finance
  notes: Benefits are drawn from official product claims and should be treated as workflow intent rather than audited outcome metrics.
