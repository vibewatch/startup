  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and buyer problem
        blocks:
          - type: paragraph
            body: >-
              Flying Tulip describes an integrated on-chain financial system rather than a single-product exchange. Its
              own site positions capital as moving among lending, borrowing, staking, trading, and total-return
              products, while its March update describes ftUSD as the liquidity and settlement layer and Lend, Spot, and
              TRS as successive capital-efficiency, execution, and synthetic-exposure layers. The relevant market
              boundary therefore includes on-chain collateral management, spot and leveraged execution, lending,
              stablecoin settlement, and risk-transfer functions that can share collateral. It excludes centralized
              exchange custody, fiat banking, and unrelated blockchain infrastructure. The status quo is not only
              another DeFi application: users can keep assets idle in wallets, split positions among Aave-like lenders,
              DEXs, derivatives venues, and bridges, or use centralized exchanges. That fragmentation is the adoption
              opportunity, but it also means Flying Tulip must win several workflows and safety thresholds at once.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM012
              - CM014
      - number: '2.2'
        title: Sizing lenses and market conditions
        blocks:
          - type: paragraph
            body: >-
              Available sizing evidence is wide-ranging and not directly additive. CoinLaw reports $71.77 billion of
              DeFi TVL across 453 chains on June 18, 2026, down 37.3% year to date, while also reporting $7.20 billion
              of 24-hour DEX volume, $314.00 billion of stablecoin supply, $36.50 billion of lending TVL, and $24.91
              billion of trailing-twelve-month protocol fees. Resh reports a much higher $185 billion TVL for March
              2026, but its article does not provide a comparable methodology or reconciliation to the later CoinLaw
              snapshot. These are market-context lenses, not a Flying Tulip revenue forecast. The company’s March 26
              update gives an early operating lens: $1.08 million of ftUSD minted, $121.58 million of backing capital,
              and $457.02 thousand of all-time yield generated. The gap between broad category activity and the
              company’s early product balances makes realized deposits, turnover, fees, and retention the critical
              bridge from market opportunity to valuation.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM009
              - CM010
      - number: '2.3'
        title: Buyer segments, drivers, and constraints
        blocks:
          - type: paragraph
            body: >-
              The initial buyer map is segment-led rather than customer-count-led because no retained source provides a
              verified Flying Tulip customer census. Yield-oriented capital providers need transparent backing,
              sustainable yield, and redemption mechanics; traders need execution, leverage, and liquidity;
              sophisticated DeFi users need productive collateral and fewer transfers; and ecosystem or institutional
              participants need auditable settlement, jurisdictional eligibility, and operational controls. Flying
              Tulip’s product updates show a phased adoption path from ftUSD to Lend, Trade, TRS, and multi-chain
              deployment, with shared collateral as the cross-sell mechanism. The strongest drivers are capital
              efficiency, fewer protocol hops, and a unified margin account. Constraints are equally material: the press
              release says redemption is limited by reserves and protocol parameters; market TVL is volatile; external
              descriptions disagree on scale; and the retained evidence does not independently establish retention,
              realized revenue, regulatory readiness, or smart-contract assurance. Those gaps cap confidence in any SOM
              claim.
            claimRefs:
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM011
              - CM012
              - CM013
              - CM015
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Treat the opportunity as a stack of monetizable pools
            body: >-
              The evidence supports a broad activity environment, but not an additive TAM. Underwrite Flying Tulip
