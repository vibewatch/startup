  - id: FE001
    title: Flying Tulip product architecture map
    type: stack
    summary: >-
      The documented stack uses Trade as a pricing spine, a shared collateral layer for credit and futures, and ftUSD
      for settlement, with policy controls spanning the system.
    data:
      layers:
        - label: User and integration surface
          detail: One interface and a documentation hub intended for users and builders.
          modules:
            - Spot and limit-order access
            - Lending and borrowing
            - Perpetual positions
            - SDK and API guidance
          outputs:
            - Unified product workflow
        - label: Trade price spine
          detail: Hybrid AMM and CLOB execution supplies depth-aware market signals.
          modules:
            - CLOB matching
            - Adaptive AMM
            - TWAP and reserve-aware windows
          outputs:
            - Executable price and depth
        - label: Credit and shared collateral
          detail: Pair markets coexist with a curated cross-collateral pool.
          modules:
            - Permissionless Lend
            - Permissioned Lend
            - Snapshot LTV
            - Soft liquidation
          outputs:
            - Borrowing power and shared margin
        - label: Perpetual futures
          detail: Internal trading informs leverage, funding, liquidation, and settlement.
          modules:
            - Depth-aware limits
            - Borrowing-linked funding
            - Time-sliced unwind
          outputs:
            - ftUSD-settled derivatives
        - label: Settlement rail
          detail: ftUSD clears product activity and sftUSD is the optional variable-yield form.
          modules:
            - ftUSD
            - sftUSD
            - Settlement LPs
          outputs:
            - Common dollar-target settlement
        - label: Policy and cashflow controls
          detail: Caps, breakers, staged changes, and protocol revenues frame system operation.
          modules:
            - Asset and venue caps
            - Circuit breakers
            - Pre-trade simulation
            - Buyback pipeline
          outputs:
            - Risk constraints and FT cashflows
    approximationNotes: >-
      Conceptual map of the documented operating design; layer order does not establish deployed code, security,
      performance, or production maturity.
    claimRefs:
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE016
