  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and strategic position
        blocks:
          - type: paragraph
            body: >-
              Flying Tulip's stated scope spans spot trading, lending, perpetual futures, insurance, and an ftUSD
              settlement rail. Alchemy describes the product as a full-stack application that combines a hybrid AMM and
              order book, oracle-less perpetual futures, on-chain insurance, and a shared collateral pool; the company's
              own site similarly frames the product around capital moving across lending, borrowing, staking, and
              trading. This is a direct attempt to compete across several product categories at once rather than win
              only one wedge. The Block reports that management itself names Coinbase and Binance as holistic
              comparators, and Ethena, Hyperliquid, Aave, and Uniswap at the product level. That breadth creates a large
              surface for differentiation but also exposes the project to multi-front execution risk and fragmented
              buyer expectations.
            claimRefs:
              - CP001
              - CP005
              - CP011
              - CP013
          - type: table
            tableRef: TP001
            claimRefs:
