  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: Shared infrastructure and missing independent assurance keep the leading risks high despite disclosed controls.
    data:
      columns:
        - label: Impact
          detail: Consequence if the failure occurs
        - label: Likelihood
          detail: Qualitative evidence-based exposure, not a probability
        - label: Mitigation maturity
          detail: Publicly evidenced maturity as of 2026-10-23
      rows:
        - label: Shared-margin failure
          values:
            - label: Critical
              detail: Can propagate across lending, orders, trading, and futures
            - label: Medium
              detail: Complex coupled surface; no incident-rate denominator
            - label: Partial
              detail: Architecture described; independent stress testing absent
        - label: ftUSD peg / strategy
          values:
            - label: Critical
              detail: Settlement and yield layer affects several products
            - label: Medium
              detail: Yield and peg claims are current but independently unverified
            - label: Early
              detail: On-chain visibility claimed; independent assurance absent
        - label: Redemption reserve
          values:
            - label: Critical
              detail: Reserve sufficiency anchors the downside-protection thesis
            - label: Medium
              detail: Right is explicitly reserve- and parameter-limited
            - label: Partial
              detail: Terms disclosed; coverage and liquidity reconciliation absent
        - label: Regulatory perimeter
          values:
            - label: High
              detail: Restrictions can impair products, markets, or onboarding
            - label: Medium
              detail: Multiple regulated activity categories are implicated
            - label: Early
              detail: No company-specific legal opinions in assigned evidence
        - label: Sanctions / eligibility
          values:
            - label: High
              detail: Control failure can block markets and counterparties
            - label: Medium
              detail: Reported KYC differs across sale phases
            - label: Partial
              detail: Restrictions are caveated; test evidence is absent
        - label: External venue contagion
          values:
            - label: High
              detail: Venue liquidity can affect deployed capital
            - label: Medium
              detail: A threshold response was reported during an Aave-related event
            - label: Partial
              detail: Response observed; current limits and shares undisclosed
        - label: Multi-chain execution
          values:
            - label: Critical
              detail: Inconsistent state or downtime can affect user positions
            - label: Medium
              detail: Five chains and multiple integrated products expand surface area
            - label: Early
              detail: No independent chain-level resilience evidence in pool
        - label: Reporting / execution discipline
          values:
            - label: High
              detail: Unreconciled disclosures weaken risk monitoring
            - label: Medium
              detail: Independent review identified documentation and arithmetic concerns
            - label: Partial
              detail: Team acknowledgment reported; formal reconciliations not available
    approximationNotes: >-
      Ordinal labels synthesize cited architecture, reported incidents, disclosed mitigations, and explicit evidence
      gaps. They are not calibrated probabilities, loss estimates, or proof of a recorded Flying Tulip incident.
    claimRefs:
      - CR001
      - CR003
      - CR005
      - CR007
      - CR008
      - CR009
      - CR011
      - CR016
