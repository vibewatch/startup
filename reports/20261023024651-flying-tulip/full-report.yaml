  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and buying surfaces
        blocks:
          - type: paragraph
            body: >-
              Flying Tulip's public materials describe a protocol serving several overlapping user jobs rather than a
              disclosed enterprise customer base. The core user is a DeFi capital provider who deposits assets, earns
              yield, borrows against collateral, or uses the same margin account for trading and swaps. The official
              site positions ftUSD as a settlement currency and yield-bearing building block, while the launch coverage
              describes a unified platform for spot trading, perpetual derivatives, lending, and a native stablecoin. A
              second segment is the active trader who values shared collateral and cross-product execution. A third is
              the developer or ecosystem integrator evaluating an on-chain financial primitive; Alchemy lists the
              application as a DEX, derivatives, and lending app, but does not identify a named deployment customer.
              These are product-defined segments, not independently verified customer cohorts. No public source in the
              assigned pool supplies a customer count, revenue contribution by segment, or payer/user split.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU004
              - CU006
              - CU013
          - type: figure
            figureRef: FU001
            claimRefs: []
      - number: '6.2'
        title: Adoption trajectory and usage proof
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a launch and product-expansion trajectory, not a retention curve. The official site
              says capital can move among products and describes ftUSD, lending, trading, and total-return swaps as live
              surfaces; its blog reports that Trade, TRS, Rewards, automatic compounding for ftUSD, and BNB Chain
              support were introduced in a September update. Alchemy's listing reports around $90 million in deposits,
              while the MEXC article reports more than $126 million in total value locked and more than $85,000 of
              accumulated yield; these figures differ in scope, date, and publisher methodology and should not be
              combined. The blog also records that many participants exited or withdrew FT positions after launch, which
              is direct adverse evidence against treating launch interest as durable retention. There is no public
              denominator for active wallets, repeat depositors, monthly volume, renewals, cohort retention, or net
              revenue retention.
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU006
              - CU007
              - CU008
              - CU009
              - CU010
              - CU011
      - number: '6.3'
        title: Named proof, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not establish named end customers or production deployments. The official materials
              describe user actions and product integrations, and the partner-style Alchemy directory identifies the
              application and its supported categories, but neither supplies customer names, contracts, case-study
              outcomes, or procurement records. Flying Tulip's own blog does show a land-and-expand product motion:
              users can move collateral among Lend, Trade, TRS, and ftUSD, and the September update says asset support
              and chain coverage expanded. That is an expansion design, not proof that individual users expand or renew.
              The main customer diligence risk is therefore evidentiary: launch participation, deposits, and token
              ownership could represent different populations, and the public record does not disclose concentration by
              wallet, asset, chain, geography, or channel. A buyer should request wallet-level cohort tables, retention
              definitions, and reconciliation of TVL, supply, deposits, and fee-paying activity before underwriting
              durability.
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.4'
        title: Customer journey evidence
        blocks:
          - type: paragraph
            body: >-
              The observable journey begins with a capital provider selecting a supported asset and account surface,
              continues through deposit or minting, and can expand into borrowing, spot or leveraged trading, swaps, and
              total-return products. The sources support these product touchpoints, but they do not show conversion
              rates between them. Accordingly, the journey below is a map of disclosed adoption surfaces rather than a
              measured funnel. The most important missing evidence is the proportion of depositors who become repeat
              users, the share of users who use multiple products, and the relationship between product activity and
              protocol revenue. The absence of those denominators prevents a defensible conclusion about customer
              durability or cross-sell efficiency.
            claimRefs:
              - CU001
              - CU006
              - CU008
              - CU013
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated account design
            body: >-
              Flying Tulip's public product surfaces are designed around shared collateral and movement among lending,
              yield, trading, swaps, and derivatives, creating a plausible cross-sell path.
            calloutType: strength
            claimRefs:
              - CU001
              - CU003
              - CU013
              - CU015
          - type: callout
            title: Adoption durability is unproven
            body: >-
              Public materials report deposits, TVL, and product launches, but do not disclose active-user denominators,
              retention cohorts, or customer concentration; the company blog also reports participant exits and
              withdrawals.
            calloutType: risk
            claimRefs:
              - CU006
              - CU007
              - CU010
              - CU011
              - CU016
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk picture
        blocks:
          - type: paragraph
            body: >-
              The central risk is coupling rather than any single product. Flying Tulip and an Alchemy listing describe
              one deposit or margin account supporting lending, orders, trading, and futures, while the company says
              ftUSD combines a dollar peg with yield strategies. A fault in pricing, collateral treatment, settlement,
              or reserve liquidity could therefore affect several user promises at once. The perpetual-put disclosure
              narrows the protection: it is limited by on-chain reserves and protocol parameters and is neither insured
              nor guaranteed. Independent commentary also reports prior liquidity, TVL, reporting, and rollout concerns.
              The matrix ranks residual severity from those disclosed dependencies and evidence gaps; its likelihood and
              maturity labels are analytical judgments, not measured incident probabilities.
            claimRefs:
              - CR001
              - CR003
              - CR006
              - CR008
              - CR009
              - CR015
              - CR016
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR007
              - CR008
              - CR009
              - CR011
              - CR016
      - number: '7.2'
        title: Regulatory and legal perimeter
        blocks:
          - type: paragraph
            body: >-
              Regulatory exposure is high because the public product set combines a yield-bearing dollar asset, lending,
              leveraged trading, derivatives, insurance-like protection, and a token redemption feature. A third-party
              sale guide described a permissionless public phase without KYC, while the company press release separately
              warned that eligibility and jurisdictional restrictions may apply. Neither statement establishes the
              current control design. EBA evidence confirms that MiCA classification is active for e-money tokens, the
              SEC maintains procedures for investigating possible federal securities-law violations, and OFAC's actions
              index changes continuously. None of those regulator pages identifies a Flying Tulip violation. The
              investable mitigation threshold is company-specific legal analysis plus tested sanctions, eligibility, and
              blocked-flow controls.
            claimRefs:
              - CR004
              - CR011
              - CR012
              - CR013
              - CR015
          - type: table
            tableRef: TR001
            claimRefs:
              - CR003
              - CR004
              - CR011
              - CR012
              - CR013
              - CR015
      - number: '7.3'
        title: Operational and security coupling
        blocks:
          - type: paragraph
            body: >-
              The operating surface spans multiple chains and products. Alchemy reports roughly $90 million of deposits
              across Ethereum, Avalanche, BNB Chain, Base, and Solana, while Flying Tulip's current site and blog
              describe integrated Lend, Trade, TRS, collateral swaps, limit orders, and ftUSD. That breadth creates more
              contracts, assets, parameters, and chain interfaces to monitor. The strongest observed mitigation is
              behavioral: an April 2026 independent review says the team withdrew all ETH from Aave when liquidity
              crossed its threshold during the Kelp DAO rsETH incident. This shows a response mechanism, not proof that
              shared-margin, stablecoin, reserve, or cross-chain failure modes are contained. Independent audit reports,
              public bug-bounty scope, incident history, and stress-test results were not present in the assigned
              evidence.
            claimRefs:
              - CR001
              - CR002
              - CR005
              - CR006
              - CR009
              - CR010
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR005
              - CR006
              - CR009
              - CR010
              - CR015
      - number: '7.4'
        title: Partner, capital, and execution dependencies
        blocks:
          - type: paragraph
            body: >-
              Flying Tulip depends on external chains, reserve assets, liquidity venues, sale channels, and verification
              processes even where core settlement is on-chain. The Aave response illustrates venue dependence; the
              public-sale guide shows different KYC treatment across channels; and the redemption disclosure makes
              reserve liquidity a direct constraint on downside protection. Capital-model risk is also material: a 2025
              independent preview and the company release described a $1 billion total objective rather than $1 billion
              of cash already available. Kill criteria should therefore be evidence based: verified liquid reserves
              below eligible redemption obligations, an unresolved material peg or liquidation event, a regulator
              restricting a core product or market, or management declining to reconcile a material token, reserve, or
              liquidity discrepancy.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR007
              - CR008
              - CR014
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR005
              - CR007
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Diligence remains the primary mitigation
            body: >-
              Do not treat on-chain visibility as equivalent to independent assurance. Require a reconciled reserve
              schedule, signed security reports, privileged-role and upgrade maps, jurisdiction-specific legal opinions,
              and venue- and chain-concentration data before underwriting the disclosed controls as mature.
            calloutType: risk
            claimRefs:
              - CR003
              - CR007
              - CR009
              - CR011
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              Flying Tulip's positive case is a unified on-chain financial system that reuses collateral across lending,
              trading, perpetuals, and settlement, with the official documentation describing executable-liquidity
              pricing and programmatic cashflows. The public financing case is also notable: PR Newswire reports a $200
              million private round and an on-chain redemption right, while SetterVC lists a $1 billion latest valuation
              mark. The anti-thesis is that these are not operating KPIs. The available evidence does not disclose
              revenue, fee capture, retention, audited reserves, or a verified secondary-market clearing price. The
              protocol's capital-efficiency promise therefore remains an execution hypothesis, not a demonstrated
              earnings stream.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
          - type: table
            tableRef: TV001
            claimRefs:
              - CV003
              - CV008
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV008
              - CV013
      - number: '8.2'
        title: Entry discipline and scenario range
        blocks:
          - type: paragraph
            body: >-
              The $1 billion figure should be treated as a reported financing or valuation mark rather than fair value.
              SetterVC explicitly labels its valuation data as estimates that may be incomplete, stale, erroneous, or
              revised; RootData separately records a $200 million seed round, a $50 million public sale, and a $25.5
              million Series A, implying a total that conflicts with SetterVC's $225.5 million aggregate. Funding raised
              is therefore not treated as cash available. Gate reports a $0.10 fixed token price and describes the
              perpetual-put mechanism, while PR Newswire cautions that redemption is limited by reserves and protocol
              parameters and is not a guarantee. A disciplined entry would require reserve reconciliation, token supply
              and unlock schedules, realized liquidity, and post-launch fee and retention data. Without those inputs,
              precise return math would be false precision.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV008
              - CV013
      - number: '8.3'
        title: Comparable set and diligence decision
        blocks:
          - type: paragraph
            body: >-
              Comparable evidence is useful for market context but cannot be converted into a direct multiple for Flying
              Tulip. CoinLaw reports that DeFi TVL was $71.77 billion across 453 chains on June 18, 2026, with $7.20
              billion of daily DEX volume, while the same source describes a 37.3% year-to-date TVL decline. DeFiLlama's
              Uniswap page reports $4.121 billion of TVL, $100.55 million of 30-day fees, and $8.18 million of 30-day
              revenue as of October 23, 2026; these are scale and monetization reference points, not proof that Flying
              Tulip can reach them. Hyperliquid's profile shows a much larger, observable market-cap and trading-volume
              benchmark, but its own architecture and disclosure base differ. The investment decision should remain
              track until Flying Tulip publishes comparable operating data.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
      - number: '8.4'
        title: Recommendation and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The recommendation is track with medium confidence and a stretched, not fully underwritten, valuation
              stance. The product thesis has credible technical specificity: official materials describe
              cross-collateral accounts, depth-aware risk controls, and ftUSD settlement; the commercial thesis is not
              yet evidenced by disclosed recurring revenue or durable user cohorts. The call should move toward
              research-more or avoid if reserve coverage is not independently reconciled, the token trades below the
              claimed redemption economics, audits identify material smart-contract or liquidation defects, or launch
              incentives fail to produce repeat borrowing, trading, and settlement activity. It could improve toward buy
              only after independently verified reserves, transparent supply and unlock data, sustained fee generation,
              and retention cohorts are public.
            claimRefs:
              - CV013
              - CV014
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Track, not buy
            body: >-
              The $1 billion mark is not supported by enough public operating or reserve evidence to justify a buy
              recommendation; wait for auditable cash-flow and token-liquidity evidence.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV008
              - CV013
          - type: callout
            title: Principal-protection claims remain conditional
            body: >-
              The perpetual put is described as programmatic and reserve-limited, so it should not be valued as an
              unconditional guarantee.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
          - type: callout
            title: Comparable scale is the missing bridge
            body: >-
              Public DeFi comparables show observable TVL, fees, revenue, or volume; Flying Tulip's assigned evidence
              does not yet provide the same operating bridge.
            calloutType: insight
            claimRefs:
              - CV010
              - CV011
              - CV012
