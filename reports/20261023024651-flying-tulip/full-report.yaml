      - number: '4.2'
        title: Traction, pricing, and unit economics
        blocks:
          - type: paragraph
            body: >-
              Public traction is limited to product and activity signals rather than customer economics. Flying Tulip's
              own update says Lend TVL, ftUSD supply, borrowing activity, fees, and FT buybacks reached new highs in
              August, but it does not disclose the values, period-over-period rates, user counts, or cohort retention.
              Alchemy independently lists the application with around $90M in deposits, but the page does not define the
              measurement date, composition, or whether deposits equal TVL. Token sale materials establish a fixed $0.10
              FT sale price in some phases, not realized protocol pricing or revenue per user. CAC, payback, gross
              margin, utilization, liquidation losses, and customer concentration remain unavailable. Any scenario
              should keep these inputs explicitly public-claimed, proxy, or unavailable.
            claimRefs:
