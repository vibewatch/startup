              - CP006
              - CP007
              - CP008
              - CP012
      - number: '3.2'
        title: Capability, liquidity, and buying criteria
        blocks:
          - type: paragraph
            body: >-
              The core buying proposition is shared collateral: one deposit can support lending positions, resting
              orders, and futures collateral simultaneously. Flying Tulip's documentation also claims that executable
              depth informs pricing, leverage, funding, and liquidation parameters, while the site emphasizes soft
              liquidations and depth-aware borrowing. These mechanisms could reduce capital fragmentation for
              sophisticated traders, but they are not equivalent to proven liquidity or lower realized risk. Hyperliquid
              provides a strong specialist benchmark: its documentation reports fully on-chain spot and perpetual order
              books and a current capacity of 200,000 orders per second. DeFiLlama's dYdX page provides a different
              benchmark, recording $1.311 billion of 30-day perpetual volume, $81.45 million of TVL, and $267,063 of
              30-day fees as of October 23, 2026. CoinLaw reports another scale hurdle: Aave V3 held $12.10 billion of
              lending TVL on June 18, 2026. These figures are not directly comparable operating metrics for Flying
              Tulip, which has not publicly disclosed equivalent sustained volumes or fees in the assigned evidence.
            claimRefs:
              - CP002
              - CP003
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP006
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Flying Tulip's proposed moat is integration: shared collateral, internal depth-aware pricing, a
              yield-bearing settlement asset, and token-linked cashflows. The design is difficult to copy operationally
              because it couples risk parameters across products, but that coupling also makes failures more correlated.
              Aave already offers permissionless crypto lending and borrowing through collateralized pools, while dYdX
              and Hyperliquid demonstrate specialized trading liquidity and transparent on-chain execution. Aave's
              established lending role and the specialist venues' measurable activity create switching costs that a new
              integrated platform must overcome. The Block's September 2025 account described the project as under
              development, but the official October 2026 site now exposes Lend, Trade, and TRS entry points, so the old
              launch-timing statement is historical rather than current adverse evidence. The remaining adverse case is
              incumbent scale plus the absence of normalized public retention, fee, audit, and stress-test comparisons.
              A participating investor also characterized competition with better-capitalized DeFi incumbents as
              daunting.
            claimRefs:
              - CP009
              - CP010
              - CP012
              - CP013
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP003
              - CP007
              - CP008
              - CP012
              - CP014
              - CP015
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP016
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated collateral is the clearest differentiation
            body: >-
              The strongest product distinction in the assigned evidence is the claim that one deposit can
              simultaneously support lending, orders, and futures collateral.
            calloutType: strength
            claimRefs:
              - CP002
          - type: callout
            title: Specialist incumbents set the proof burden
            body: >-
              Hyperliquid's reported throughput and dYdX's measured volume and fees show that Flying Tulip must prove
              execution quality, liquidity, and risk controls rather than rely on feature breadth alone.
            calloutType: risk
            claimRefs:
              - CP006
              - CP007
          - type: callout
            title: Underwrite milestones before moat
            body: >-
              Treat integration as a hypothesis until independent audits, normalized realized liquidity, fee generation,
              and user retention are disclosed across the live product surfaces.
            calloutType: recommendation
            claimRefs:
              - CP010
              - CP014
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Flying Tulip describes an integrated financial system spanning lending, spot trading, derivatives,
              insurance, and ftUSD. Its public materials identify trading fees, lending spreads, stablecoin yield, and
              insurance premiums as intended revenue streams, while the official site frames capital movement across
              products as the core efficiency proposition. These are mechanisms and company or partner descriptions, not
              audited revenue. The company also says protocol revenues may support development and FT buybacks, so the
              economic linkage between usage, revenue, and token support is central to underwriting. No retained source
              provides a time series for fee revenue, take rate, realized spread, insurance loss ratio, or recurring
              revenue. The model should therefore be treated as a set of stated monetization paths rather than
              demonstrated financial performance.
