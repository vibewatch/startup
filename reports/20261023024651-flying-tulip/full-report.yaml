chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product, and leadership
        blocks:
          - type: paragraph
            body: >-
              Flying Tulip presents itself as an on-chain financial system rather than a single-purpose exchange. Its
              documentation describes spot trading through AMM and CLOB components, lending, perpetual futures,
              insurance, and an ftUSD settlement rail, with a design goal of reusing collateral across products. The
              public site similarly describes deposits supporting lending, borrowing, staking, and trading. Andre Cronje
              is identified as founder across the company release and independent coverage; third-party reporting also
              links the project to his prior Yearn and Sonic work. Public materials identify a distributed team of about
              15 people, but the assigned evidence does not provide a complete executive roster, board, legal entity, or
              named security leadership. That makes founder dependence and governance transparency important diligence
              items rather than settled strengths.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO008
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO008
      - number: '1.2'
        title: Funding, token structure, and stakeholder exposure
        blocks:
          - type: paragraph
            body: >-
              The strongest independent financing account is The Block's report that Flying Tulip raised $200 million in
              a private SAFT round at a $1 billion fully diluted valuation, with no single lead investor and a broad
              crypto-investor syndicate. That historical financing FDV should not be presented as current: the company
              later said a June 2026 burn of roughly $900 million of FT reduced FDV to roughly $100 million, a claim
              that still needs independent supply and market-value reconciliation. The proposed perpetual-put redemption
              right is described as a burn-and-redeem mechanism backed by a segregated reserve, but the company release
              says it is limited by reserves and protocol parameters; it is therefore not equivalent to insured
              principal or cash freely available to the company. One Gate funding article reports $225.5 million of
              cumulative funding, which conflicts with the $200 million primary account and is retained as a dated,
              lower-confidence discrepancy rather than normalized into a single total.
