        title: Product milestones and unresolved scale questions
        blocks:
          - type: paragraph
            body: >-
              The project has moved from a fundraising narrative toward a live, expanding product suite. Flying Tulip's
              blog reports launches of Trade, Total Return Swap, Rewards, automatic ftUSD compounding through ssftUSD,
