      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The financing structure is unusual: Blocmates reports a $200M seed SAFT at a $1B fully diluted valuation
              and describes a perpetual put, while the company-issued release says redemptions are settled from a
              segregated on-chain reserve seeded from raised capital. CoinList cautions that sale information was
              supplied by Flying Tulip and that the asset is speculative. This is financing raised, not cash available
              for operations or proof of runway. The same materials describe deploying contributed funds into
              conservative on-chain lending strategies or targeting yield, but no audited reserve balance, asset
              allocation, encumbrance schedule, burn rate, debt facility, or withdrawal policy is disclosed. A later
              Gate article reports $225.5M cumulative funding, but its chronology is not reconciled to the $200M primary
              announcement. Capital adequacy is therefore a material diligence gap rather than a solved question.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
      - number: '4.4'
        title: Financial underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              The investment case has a credible product-to-monetization narrative but weak public financial
              observability. Integrated collateral can reduce the need to move assets across venues, yet it also links
              lending, trading, derivatives, stablecoin, and insurance exposures. The BIS warns that DeFi
              vulnerabilities can be severe because of leverage, liquidity mismatches, interconnectedness, and limited
              shock absorbers; that is relevant downside context for any margin and reserve model, not evidence of a
              Flying Tulip loss. The highest-priority asks are an auditor-reconciled reserve and redemption report,
              product-level fee and expense statements, realized spread and liquidation-loss data, user and retention
              cohorts, and a cash/runway schedule. Until those are supplied, revenue quality and margin path should be
              scored as unverified and financing dependency as high.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Integrated monetization architecture
            body: >-
              The same collateral account is designed to support lending, trading, and settlement products, creating
              several potential fee and spread channels.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
              - CI005
          - type: callout
            title: Financing is not runway
            body: >-
              The disclosed raise and redemption reserve describe financing design, but public materials do not
              establish unrestricted operating cash, burn, liabilities, or reserve coverage.
            calloutType: risk
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
          - type: callout
            title: Underwrite only after financial disclosure
            body: >-
              Require reconciled reserve, fee, expense, utilization, loss, and cohort data before treating the
              protocol's monetization model as demonstrated.
            calloutType: recommendation
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition and user workflow
        blocks:
          - type: paragraph
            body: >-
              Flying Tulip presents one account and collateral base for spot trading, lending, perpetual futures,
              insurance, and ftUSD rather than requiring users to move assets among separate protocols. Its official
              design says a deposit can continue earning base yield while supporting lending, resting orders, or futures
              collateral; Alchemy and Coinranking independently describe the same shared-pool, cross-margin concept.
              Tapbit's February 2026 launch review, however, reported only ftUSD and margin lending as initially live,
              with spot trading, leverage, and total-return swaps expected later. The investable product therefore
              should be underwritten as a staged rollout of a broad financial stack, not as proof that every documented
              module has equivalent production maturity. Users gain fewer collateral transfers and a common interface,
              while accepting more dependence on one protocol's risk engine and settlement design.
            claimRefs:
              - CE001
              - CE002
              - CE009
              - CE016
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE003
              - CE004
              - CE005
              - CE006
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE006
              - CE016
      - number: '5.2'
        title: Architecture and operating model
        blocks:
          - type: paragraph
            body: >-
              The documented pricing spine is Trade, a hybrid AMM and central limit order book. Orders are intended to
              consume order-book liquidity before residual flow reaches an adaptive AMM; time- and reserve-aware windows
              then feed downstream credit and derivatives decisions. Lending is split between permissionless pair
              markets and a curated cross-collateral pool, while perpetual futures use internal trading activity rather
              than an external oracle and settle in ftUSD. This can reduce lag and fragmented pricing, but it also
              couples execution, leverage limits, liquidations, funding, and settlement to the quality and resilience of
              the same liquidity signals. The official documentation is detailed enough to establish the intended
              mechanisms, not their implementation correctness, stress performance, or deployed-contract equivalence.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE016
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE007
              - CE008
              - CE016
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE016
      - number: '5.3'
        title: Deployment, integration, and maturity
        blocks:
          - type: paragraph
            body: >-
              Public maturity signals are mixed. Tapbit reported a February 2026 launch with ftUSD and margin lending
              first and broader functions scheduled for subsequent weeks. Alchemy's independently written directory page
              describes deployments on Ethereum, Avalanche, BNB Chain, Base, and Solana and reports around $90 million
              in deposits, but the page provides no visible metric date in the fetched text. Flying Tulip's
              documentation advertises SDK references, API documentation, and integration guides, yet that statement
              does not establish API stability, versioning, support response times, usage, or third-party integration
              quality. The developer surface is therefore credible as documentation intent but insufficient as evidence
              of a mature integration ecosystem or consistent multi-chain operations.
            claimRefs:
              - CE008
              - CE009
              - CE010
      - number: '5.4'
        title: Trust, security, compliance, and quality controls
        blocks:
          - type: paragraph
            body: >-
              Flying Tulip documents conservative treasury-allocation policy, venue and asset caps, circuit breakers,
              staged parameter changes, pre-trade simulation, bounded fees, and soft liquidations. Coinspeaker
              separately reports company-stated OFAC screening and tax-reporting features, but does not provide
              implementation detail or independent control testing. The assigned evidence also contains no
              contract-specific audit report, auditor scope, deployment-to-commit mapping, bug-bounty terms, uptime
              history, or incident postmortem for Flying Tulip. Code4rena demonstrates the kind of named audit and
              mitigation-review artifact available for DeFi projects, but its fetched landing page does not establish a
              Flying Tulip engagement. This gap matters because Coinranking flags the larger attack surface of a
              multi-product design, while Chainalysis reports private-key compromise as 43.8% of stolen crypto in 2024
              and stablecoins as 63% of illicit transaction volume. Those ecosystem figures are risk context, not
              evidence of a Flying Tulip incident.
            claimRefs:
              - CE007
              - CE011
              - CE012
