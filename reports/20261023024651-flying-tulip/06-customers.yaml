      - [FT position exits, "many participants exited or withdrew", "June update", "Company blog; high confidence for the statement, adverse posture", "Warns that launch participation did not equal durable retention", "Count, percentage, cohort definition, and remaining balance"]
    notes: "Values are reported by different publishers and periods. TVL, deposits, yield, product launches, and token-position exits are not a common time series and must not be read as a conversion funnel."
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU011]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or proof surface, Segment, Deployment/use case, Production vs pilot, Outcome, Limitation]
    rows:
