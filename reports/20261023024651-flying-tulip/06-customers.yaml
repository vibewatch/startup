callouts:
  - calloutType: strength
    title: Integrated account design
    body: Flying Tulip's public product surfaces are designed around shared collateral and movement among lending, yield, trading, swaps, and derivatives, creating a plausible cross-sell path.
    claimRefs: [CU001, CU003, CU013, CU015]
  - calloutType: risk
    title: Adoption durability is unproven
    body: Public materials report deposits, TVL, and product launches, but do not disclose active-user denominators, retention cohorts, or customer concentration; the company blog also reports participant exits and withdrawals.
    claimRefs: [CU006, CU007, CU010, CU011, CU016]
