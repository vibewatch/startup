      coverage: partial
      basis: "Public assigned sources available through 2026-10-23; named customer and deployment disclosures only"
    notes: "This is a partial proof inventory, not an exhaustive customer list. The absence of named customers in the assigned pool is an evidence gap, not proof that no customers exist."
    claimRefs: [CU012, CU013, CU014, CU015, CU016]
