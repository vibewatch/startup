      - [No named end customer disclosed, "Traders / borrowers", "Public materials describe Trade, Lend, and TRS", "Not established", "Cross-product workflow is described", "No wallet-level volume, repeat use, or outcome data"]
      - [Alchemy directory listing, "Developers / integrators", "Listed as DEX, derivatives, and lending app", "Directory listing, not a deployment case study", "Confirms discoverability and category placement", "Alchemy says listings are independently reviewed but does not identify a customer deployment"]
