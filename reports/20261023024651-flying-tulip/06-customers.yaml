chapter:
  number: 6
  title: Customers
  summary: Flying Tulip presents an integrated DeFi account spanning yield, lending, trading, and swaps, but the available public evidence is principally product and launch disclosure rather than customer-verified adoption. Public materials describe product availability and capital flows, while named production customers, retention, repeat usage, and concentration remain unverified.
sections:
  - id: customer-segments
    title: Customer segments and buying surfaces
    body: >-
      Flying Tulip's public materials describe a protocol serving several overlapping user jobs rather than a disclosed enterprise customer base. The core user is a DeFi capital provider who deposits assets, earns yield, borrows against collateral, or uses the same margin account for trading and swaps. The official site positions ftUSD as a settlement currency and yield-bearing building block, while the launch coverage describes a unified platform for spot trading, perpetual derivatives, lending, and a native stablecoin. A second segment is the active trader who values shared collateral and cross-product execution. A third is the developer or ecosystem integrator evaluating an on-chain financial primitive; Alchemy lists the application as a DEX, derivatives, and lending app, but does not identify a named deployment customer. These are product-defined segments, not independently verified customer cohorts. No public source in the assigned pool supplies a customer count, revenue contribution by segment, or payer/user split.
    claimRefs: [CU001, CU002, CU003, CU004, CU005]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory
    title: Adoption trajectory and usage proof
    body: >-
      The evidence supports a launch and product-expansion trajectory, not a retention curve. The official site says capital can move among products and describes ftUSD, lending, trading, and total-return swaps as live surfaces; its blog reports that Trade, TRS, Rewards, automatic compounding for ftUSD, and BNB Chain support were introduced in a September update. Alchemy's listing reports around $90 million in deposits, while the MEXC article reports more than $126 million in total value locked and more than $85,000 of accumulated yield; these figures differ in scope, date, and publisher methodology and should not be combined. The blog also records that many participants exited or withdrew FT positions after launch, which is direct adverse evidence against treating launch interest as durable retention. There is no public denominator for active wallets, repeat depositors, monthly volume, renewals, cohort retention, or net revenue retention.
    claimRefs: [CU006, CU007, CU008, CU009, CU010, CU011]
    tableRefs: [TU002]
  - id: named-proof-and-concentration
    title: Named proof, expansion, and concentration risk
    body: >-
      Public evidence does not establish named end customers or production deployments. The official materials describe user actions and product integrations, and the partner-style Alchemy directory identifies the application and its supported categories, but neither supplies customer names, contracts, case-study outcomes, or procurement records. Flying Tulip's own blog does show a land-and-expand product motion: users can move collateral among Lend, Trade, TRS, and ftUSD, and the September update says asset support and chain coverage expanded. That is an expansion design, not proof that individual users expand or renew. The main customer diligence risk is therefore evidentiary: launch participation, deposits, and token ownership could represent different populations, and the public record does not disclose concentration by wallet, asset, chain, geography, or channel. A buyer should request wallet-level cohort tables, retention definitions, and reconciliation of TVL, supply, deposits, and fee-paying activity before underwriting durability.
    claimRefs: [CU012, CU013, CU014, CU015, CU016]
    tableRefs: [TU003]
  - id: customer-exhibits
    title: Customer journey evidence
    body: >-
      The observable journey begins with a capital provider selecting a supported asset and account surface, continues through deposit or minting, and can expand into borrowing, spot or leveraged trading, swaps, and total-return products. The sources support these product touchpoints, but they do not show conversion rates between them. Accordingly, the journey below is a map of disclosed adoption surfaces rather than a measured funnel. The most important missing evidence is the proportion of depositors who become repeat users, the share of users who use multiple products, and the relationship between product activity and protocol revenue. The absence of those denominators prevents a defensible conclusion about customer durability or cross-sell efficiency.
    claimRefs: [CU001, CU006, CU008, CU013, CU015]
