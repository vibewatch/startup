schemaVersion: "report-v2"
artifact: risks
slug: flying-tulip
runDate: 2026-10-23
company:
  name: Flying Tulip
chapter:
  number: 7
  title: Risks
  summary: >-
    Flying Tulip's integrated margin, trading, lending, stablecoin, and redemption design
    concentrates technical, liquidity, compliance, and counterparty exposures in one system.
    Public evidence shows active controls and a prior venue-risk response, but independent
    security assurance, reserve coverage, legal classification, and concentration data remain
    material gaps.
sections:
  - id: ranked-risk-picture
    title: Ranked risk picture
    body: >-
      The central risk is coupling rather than any single product. Flying Tulip and an Alchemy
      listing describe one deposit or margin account supporting lending, orders, trading, and
      futures, while the company says ftUSD combines a dollar peg with yield strategies. A fault
      in pricing, collateral treatment, settlement, or reserve liquidity could therefore affect
      several user promises at once. The perpetual-put disclosure narrows the protection: it is
      limited by on-chain reserves and protocol parameters and is neither insured nor guaranteed.
      Independent commentary also reports prior liquidity, TVL, reporting, and rollout concerns.
      The matrix ranks residual severity from those disclosed dependencies and evidence gaps; its
      likelihood and maturity labels are analytical judgments, not measured incident
      probabilities.
    claimRefs: [CR001, CR003, CR006, CR008, CR009, CR015, CR016]
    figureRefs: [FR001]
  - id: regulatory-legal-perimeter
    title: Regulatory and legal perimeter
    body: >-
      Regulatory exposure is high because the public product set combines a yield-bearing
      dollar asset, lending, leveraged trading, derivatives, insurance-like protection, and a
      token redemption feature. A third-party sale guide described a permissionless public phase
      without KYC, while the company press release separately warned that eligibility and
      jurisdictional restrictions may apply. Neither statement establishes the current control
      design. EBA evidence confirms that MiCA classification is active for e-money tokens, the
      SEC maintains procedures for investigating possible federal securities-law violations, and
      OFAC's actions index changes continuously. None of those regulator pages identifies a
      Flying Tulip violation. The investable mitigation threshold is company-specific legal
      analysis plus tested sanctions, eligibility, and blocked-flow controls.
    claimRefs: [CR004, CR011, CR012, CR013, CR015]
    tableRefs: [TR001]
  - id: operational-security-coupling
    title: Operational and security coupling
    body: >-
      The operating surface spans multiple chains and products. Alchemy reports roughly $90
      million of deposits across Ethereum, Avalanche, BNB Chain, Base, and Solana, while Flying
      Tulip's current site and blog describe integrated Lend, Trade, TRS, collateral swaps, limit
      orders, and ftUSD. That breadth creates more contracts, assets, parameters, and chain
      interfaces to monitor. The strongest observed mitigation is behavioral: an April 2026
      independent review says the team withdrew all ETH from Aave when liquidity crossed its
      threshold during the Kelp DAO rsETH incident. This shows a response mechanism, not proof
      that shared-margin, stablecoin, reserve, or cross-chain failure modes are contained.
      Independent audit reports, public bug-bounty scope, incident history, and stress-test
      results were not present in the assigned evidence.
    claimRefs: [CR001, CR002, CR005, CR006, CR009, CR010, CR015]
    tableRefs: [TR002]
  - id: dependencies-and-kill-criteria
    title: Partner, capital, and execution dependencies
    body: >-
      Flying Tulip depends on external chains, reserve assets, liquidity venues, sale channels,
      and verification processes even where core settlement is on-chain. The Aave response
      illustrates venue dependence; the public-sale guide shows different KYC treatment across
      channels; and the redemption disclosure makes reserve liquidity a direct constraint on
      downside protection. Capital-model risk is also material: a 2025 independent preview and
      the company release described a $1 billion total objective rather than $1 billion of cash
      already available. Kill criteria should therefore be evidence based: verified liquid
      reserves below eligible redemption obligations, an unresolved material peg or liquidation
      event, a regulator restricting a core product or market, or management declining to
      reconcile a material token, reserve, or liquidity discrepancy.
    claimRefs: [CR003, CR004, CR005, CR007, CR008, CR014, CR016]
    tableRefs: [TR003]
callouts:
  - calloutType: risk
    title: Diligence remains the primary mitigation
    body: >-
      Do not treat on-chain visibility as equivalent to independent assurance. Require a
      reconciled reserve schedule, signed security reports, privileged-role and upgrade maps,
      jurisdiction-specific legal opinions, and venue- and chain-concentration data before
      underwriting the disclosed controls as mature.
    claimRefs: [CR003, CR007, CR009, CR011, CR016]
