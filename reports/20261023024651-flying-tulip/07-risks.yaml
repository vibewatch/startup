    claimRefs: [CR003, CR004, CR011, CR012, CR013, CR015]
  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Disclosed mitigation, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - ["Shared-margin pricing or liquidation failure", "Medium; evidence-limited", "Critical", "Integrated pricing, collateral, and settlement design is publicly described", "Design described; independent stress evidence absent", "High", "Independent liquidation, manipulation, congestion, and bad-debt stress tests"]
      - ["ftUSD peg or yield-strategy loss", "Medium; evidence-limited", "Critical", "Company claims delta-neutral yield and on-chain auditability", "Company-described only", "High", "Strategy inventory, venue limits, realized P&L, reserve policy, and independent assurance"]
      - ["Redemption reserve shortfall or illiquidity", "Medium; evidence-limited", "Critical", "Programmatic redemption and segregated on-chain reserves are described", "Contractual limits disclosed; coverage unverified", "High", "Reconciled eligible claims, liquid unencumbered assets, haircuts, and stress capacity"]
      - ["External venue contagion", "Medium; observed precedent", "High", "Review reports that ETH was withdrawn from Aave after a liquidity threshold was crossed", "Responsive precedent; policy detail private", "Medium-high", "Venue caps, alert thresholds, approved counterparties, and post-incident review"]
      - ["Cross-chain or contract compromise", "Medium; evidence-limited", "Critical", "Products are presented across five named chains and a broad integrated surface", "Public assurance incomplete", "High", "Signed audits, bug-bounty scope, privileged roles, upgrade controls, uptime, and incident history"]
    notes: >-
      No comparable incident-rate series was available. "Critical" denotes a plausible
      system-wide consequence given shared infrastructure, not an estimated probability or a
      recorded Flying Tulip loss.
    claimRefs: [CR001, CR002, CR003, CR005, CR006, CR009, CR010, CR015]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or surface, Role, Concentration evidence, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - ["Reserve assets and venues", "Undisclosed reserve allocation", "Fund eligible redemptions and yield", "No reconciled allocation or counterparty concentration in assigned evidence", "Asset impairment, withdrawal delay, or venue lock prevents timely redemption", "Critical", "On-chain reserve mechanics and parameter limits are disclosed", "High"]
      - ["External DeFi liquidity", "Aave and any other deployed venues", "Liquidity and capital deployment", "Aave response is documented; current venue shares are not", "Venue liquidity deteriorates or collateral is impaired", "High", "Reported threshold-based withdrawal response", "Medium-high"]
      - ["Chains and infrastructure", "Ethereum, Avalanche, BNB Chain, Base, Solana, relayers, and RPC providers", "Execution, custody, settlement, and access", "Alchemy names five chains; chain-level deposits and uptime are not disclosed", "Chain halt, reorg, bridge or relayer failure creates inconsistent account state", "Critical", "Multi-chain operation is visible; failover design is not independently tested", "High"]
      - ["Distribution and compliance channels", "Partner early access and permissionless public access", "Investor onboarding and eligibility", "KYC treatment differs by phase in the third-party guide", "A channel admits prohibited users or applies inconsistent eligibility controls", "High", "Early-access KYC is reported and company caveats reserve jurisdiction restrictions", "High"]
    notes: >-
      Concentration is recorded as unknown where the pool provides no denominator. The table does
      not infer that a named venue or chain has failed Flying Tulip; it identifies dependencies
      that require current exposure and contingency evidence.
    claimRefs: [CR002, CR003, CR004, CR005, CR007, CR014]
figures:
  - id: FR001
    title: Residual risk heatmap
    type: matrix
    summary: Shared infrastructure and missing independent assurance keep the leading risks high despite disclosed controls.
    data:
      columns:
        - label: Impact
          detail: "Consequence if the failure occurs"
        - label: Likelihood
          detail: "Qualitative evidence-based exposure, not a probability"
        - label: Mitigation maturity
          detail: "Publicly evidenced maturity as of 2026-10-23"
      rows:
        - label: Shared-margin failure
          values:
            - {label: "Critical", detail: "Can propagate across lending, orders, trading, and futures"}
            - {label: "Medium", detail: "Complex coupled surface; no incident-rate denominator"}
            - {label: "Partial", detail: "Architecture described; independent stress testing absent"}
        - label: ftUSD peg / strategy
          values:
            - {label: "Critical", detail: "Settlement and yield layer affects several products"}
            - {label: "Medium", detail: "Yield and peg claims are current but independently unverified"}
            - {label: "Early", detail: "On-chain visibility claimed; independent assurance absent"}
        - label: Redemption reserve
          values:
            - {label: "Critical", detail: "Reserve sufficiency anchors the downside-protection thesis"}
            - {label: "Medium", detail: "Right is explicitly reserve- and parameter-limited"}
            - {label: "Partial", detail: "Terms disclosed; coverage and liquidity reconciliation absent"}
        - label: Regulatory perimeter
          values:
            - {label: "High", detail: "Restrictions can impair products, markets, or onboarding"}
            - {label: "Medium", detail: "Multiple regulated activity categories are implicated"}
            - {label: "Early", detail: "No company-specific legal opinions in assigned evidence"}
        - label: Sanctions / eligibility
          values:
            - {label: "High", detail: "Control failure can block markets and counterparties"}
            - {label: "Medium", detail: "Reported KYC differs across sale phases"}
            - {label: "Partial", detail: "Restrictions are caveated; test evidence is absent"}
        - label: External venue contagion
          values:
            - {label: "High", detail: "Venue liquidity can affect deployed capital"}
            - {label: "Medium", detail: "A threshold response was reported during an Aave-related event"}
            - {label: "Partial", detail: "Response observed; current limits and shares undisclosed"}
        - label: Multi-chain execution
          values:
            - {label: "Critical", detail: "Inconsistent state or downtime can affect user positions"}
            - {label: "Medium", detail: "Five chains and multiple integrated products expand surface area"}
            - {label: "Early", detail: "No independent chain-level resilience evidence in pool"}
        - label: Reporting / execution discipline
          values:
            - {label: "High", detail: "Unreconciled disclosures weaken risk monitoring"}
            - {label: "Medium", detail: "Independent review identified documentation and arithmetic concerns"}
            - {label: "Partial", detail: "Team acknowledgment reported; formal reconciliations not available"}
    approximationNotes: >-
      Ordinal labels synthesize cited architecture, reported incidents, disclosed mitigations,
      and explicit evidence gaps. They are not calibrated probabilities, loss estimates, or proof
      of a recorded Flying Tulip incident.
    claimRefs: [CR001, CR003, CR005, CR007, CR008, CR009, CR011, CR016]
