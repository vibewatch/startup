  evidenceGaps:
    - type: conflicting-data
      severity: material
      topic: defi-tvl
      missingEvidence: A reconciled methodology and date-matched dataset explaining the $71.77 billion and $185 billion TVL estimates.
      whyItMatters: A wide market-size range changes the denominator used for penetration and valuation scenarios.
      diligencePath: Obtain source datasets or methodology notes from both publishers and reconcile chain coverage, category definitions, and snapshot dates.
      relatedQuestionRefs: [QM003, QM004]
      relatedTableRefs: [TM002]
    - type: private-evidence-only
      severity: material
      topic: sizing-gap
      missingEvidence: Product-level deposits, active wallets, utilization, fees, retention cohorts, and payer economics for Flying Tulip.
      whyItMatters: Broad DeFi TVL and volume do not prove that Flying Tulip can capture durable usage or revenue.
      diligencePath: Request monthly cohort, product funnel, fee, withdrawal, and risk-adjusted contribution data by chain and product.
      relatedQuestionRefs: [QM008, QM009, QM010]
      relatedTableRefs: [TM002, TM003]
    - type: missing-source
      severity: material
      topic: buyer-segments
      missingEvidence: Independent customer or procurement evidence showing who budgets for integrated DeFi workflows.
      whyItMatters: The buyer and payer may differ across retail, professional trading, treasury, and institutional segments.
      diligencePath: Request anonymized customer segmentation, wallet cohort, and partner distribution evidence with jurisdictional breakdowns.
      relatedQuestionRefs: [QM002, QM005]
      relatedTableRefs: [TM003]
