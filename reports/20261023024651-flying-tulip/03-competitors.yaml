schemaVersion: "report-v2"
artifact: competitors
slug: flying-tulip
runDate: 2026-10-23
company:
  name: Flying Tulip
chapter:
  number: 3
  title: Competitors
  summary: Flying Tulip is positioned as a cross-margin DeFi suite rather than a single-purpose exchange, combining trading, lending, derivatives, stablecoin settlement, and insurance. Its differentiation is architectural and capital-efficiency oriented, but incumbents already possess deeper liquidity, operating history, and product-specific trust; the competitive case therefore depends on whether the integrated design can produce durable execution and risk advantages.
sections:
  - id: competitive-landscape
    title: Landscape and strategic position
    body: >-
      Flying Tulip's stated scope spans spot trading, lending, perpetual futures, insurance,
      and an ftUSD settlement rail. Alchemy describes the product as a full-stack application
      that combines a hybrid AMM and order book, oracle-less perpetual futures, on-chain
      insurance, and a shared collateral pool; the company's own site similarly frames the
      product around capital moving across lending, borrowing, staking, and trading. This is
      a direct attempt to compete across several product categories at once rather than win
      only one wedge. The Block reports that management itself names Coinbase and Binance as
      holistic comparators, and Ethena, Hyperliquid, Aave, and Uniswap at the product level.
      That breadth creates a large surface for differentiation but also exposes the project to
      multi-front execution risk and fragmented buyer expectations.
    claimRefs: [CP001, CP005, CP011, CP013]
    tableRefs: [TP001]
  - id: capability-and-economics
    title: Capability, liquidity, and buying criteria
    body: >-
      The core buying proposition is shared collateral: one deposit can support lending
      positions, resting orders, and futures collateral simultaneously. Flying Tulip's
      documentation also claims that executable depth informs pricing, leverage, funding, and
      liquidation parameters, while the site emphasizes soft liquidations and depth-aware
      borrowing. These mechanisms could reduce capital fragmentation for sophisticated traders,
      but they are not equivalent to proven liquidity or lower realized risk. Hyperliquid
      provides a strong specialist benchmark: its documentation reports fully on-chain spot
      and perpetual order books and a current capacity of 200,000 orders per second. DeFiLlama's
      dYdX page provides a different benchmark, recording $1.311 billion of 30-day perpetual
      volume, $81.45 million of TVL, and $267,063 of 30-day fees as of October 23, 2026.
      CoinLaw reports another scale hurdle: Aave V3 held $12.10 billion of lending TVL on
      June 18, 2026. These figures are not directly comparable operating metrics for Flying
      Tulip, which has not publicly disclosed equivalent sustained volumes or fees in the
      assigned evidence.
    claimRefs: [CP002, CP003, CP006, CP007, CP008]
    tableRefs: [TP002]
  - id: durability-and-risk
    title: Moat durability and displacement risk
    body: >-
      Flying Tulip's proposed moat is integration: shared collateral, internal depth-aware
      pricing, a yield-bearing settlement asset, and token-linked cashflows. The design is
      difficult to copy operationally because it couples risk parameters across products, but
      that coupling also makes failures more correlated. Aave already offers permissionless
      crypto lending and borrowing through collateralized pools, while dYdX and Hyperliquid
      demonstrate specialized trading liquidity and transparent on-chain execution. Aave's
      established lending role and the specialist venues' measurable activity create switching
      costs that a new integrated platform must overcome. The Block's September 2025 account
      described the project as under development, but the official October 2026 site now
      exposes Lend, Trade, and TRS entry points, so the old launch-timing statement is historical
      rather than current adverse evidence. The remaining adverse case is incumbent scale plus
      the absence of normalized public retention, fee, audit, and stress-test comparisons.
      A participating investor also characterized competition with better-capitalized DeFi
      incumbents as daunting.
    claimRefs: [CP009, CP010, CP012, CP013, CP015, CP016]
    tableRefs: [TP003]
    figureRefs: [FP001]
tables:
  - id: TP001
    title: Competitor profile table
    columns: [Competitor or alternative, Category, Public scale or operating signal, Differentiation / limitation]
    rows:
      - [Flying Tulip, "Integrated DeFi suite", "Around $90M in deposits reported by Alchemy; no comparable fee or volume series in assigned sources", "Shared collateral across trading, lending, perps, insurance, and ftUSD; launch timing and independent operating proof remain incomplete"]
      - [Hyperliquid, "Specialist on-chain trading venue / L1", "Documentation reports 200,000 orders per second for HyperCore", "Deep specialist trading architecture; does not establish Flying Tulip-style multi-product collateral integration"]
      - [dYdX, "Perpetual trading protocol", "$1.311B 30-day perp volume and $267,063 30-day fees on the assigned DeFiLlama snapshot", "Measured specialist activity; the same source records a $9M 2023 market-manipulation incident"]
      - [Aave, "Lending and borrowing protocol", "CoinLaw reports $12.10B of Aave V3 lending TVL on June 18, 2026", "Established lending category incumbent; not a like-for-like integrated trading and insurance suite"]
      - [Coinbase / Binance, "Holistic centralized exchange incumbents", "Named by Flying Tulip management as holistic comparators", "Broader distribution and operating history are implied by the comparison, but no assigned source provides a like-for-like metric"]
    notes: "Scale signals are source-specific and not normalized: deposits/TVL, fees, trading volume, order throughput, and cited net deposits are different measures and periods."
    claimRefs: [CP001, CP005, CP006, CP007, CP008, CP012]
  - id: TP002
    title: Feature and capability matrix
    columns: [Buying criterion, Flying Tulip, Hyperliquid, dYdX, Aave]
    rows:
      - [Shared collateral across lending and trading, "Claimed cross-collateral pool", "Not established by assigned source", "Not established by assigned source", "Collateralized lending pools; cross-product trading integration not established"]
      - [Spot and perpetual trading, "Hybrid AMM + CLOB and internal pricing claimed", "Fully on-chain spot and perpetual order books", "Perpetual trading activity measured", "Not established by assigned source"]
      - [Lending / borrowing, "Permissionless pairs plus permissioned cross-collateral pool claimed", "Not established by assigned source", "Protocol description emphasizes margin trading and borrow/lend", "Core lending and borrowing capability"]
      - [Stablecoin settlement, "ftUSD described as delta-neutral settlement currency", "Not established by assigned source", "Not established by assigned source", "GHO stablecoin launch summarized"]
      - [Risk and liquidation transparency, "Depth-aware limits and soft liquidations claimed", "On-chain order, cancel, trade, and liquidation events", "DeFiLlama records historical incidents", "Collateral and governance model documented in secondary summary"]
    notes: "Cells marked as not established are evidence gaps, not claims that the capability is absent. Company-authored capability descriptions are not independent benchmarks."
    claimRefs: [CP002, CP003, CP004, CP006, CP007, CP008, CP009]
  - id: TP003
    title: Pricing, packaging, and switching comparison
    columns: [Alternative, Price / monetization signal, Included capabilities, Switching or adoption implication]
    rows:
      - [Flying Tulip, "No common realized fee schedule is retained in the assigned evidence", "Current official entry points expose Lend, Trade, TRS, ftUSD, and the FT marketplace", "Potentially attractive for capital efficiency, but realized pricing and cross-product retention are unknown"]
      - [Hyperliquid, "No price or fee schedule in assigned excerpt", "On-chain spot and perpetual order books plus HyperEVM building blocks", "Specialist liquidity and performance may make migration difficult for active traders"]
      - [dYdX, "$267,063 30-day fees and $1.311B 30-day perp volume on the assigned snapshot", "Perpetual trading protocol with measurable activity", "Existing volume and venue history create a trust and liquidity hurdle"]
      - [Aave, "Variable and stable interest rates summarized; no comparable realized rate retained", "Collateralized lending, borrowing, flash loans, and GHO stablecoin", "Lending users may prefer a proven single-purpose venue unless integration creates measurable savings"]
      - [Status quo / internal build, "No public price established in assigned sources", "Use existing venues and treasury controls rather than adopting a new suite", "Avoids migration and smart-contract concentration risk but preserves product fragmentation"]
    notes: "The assigned pool does not provide a common price basis across alternatives. Unknown prices and realized discounts are intentionally preserved as diligence gaps."
    claimRefs: [CP003, CP007, CP008, CP012, CP014, CP015]
figures:
  - id: FP001
    title: Competitive positioning by integration breadth and operating proof
    type: quadrant
    summary: "Flying Tulip emphasizes integration breadth, while incumbent alternatives show stronger specialist operating proof in the assigned evidence."
    data:
      points:
        - {label: Flying Tulip, x: 0.9, y: 0.3, tone: positive, note: "Broad integrated design; limited public operating proof"}
        - {label: Hyperliquid, x: 0.6, y: 0.8, tone: positive, note: "Specialist on-chain trading and reported throughput"}
        - {label: dYdX, x: 0.4, y: 0.8, tone: positive, note: "Specialist perp venue with measured volume and fees"}
        - {label: Aave, x: 0.5, y: 0.9, tone: positive, note: "Established lending category position"}
        - {label: Coinbase / Binance, x: 0.8, y: 0.9, tone: neutral, note: "Holistic comparators named by management; assigned sources do not provide normalized metrics"}
        - {label: Status quo / internal build, x: 0.1, y: 0.5, tone: neutral, note: "Low integration novelty but avoids adopting a new suite"}
      xAxis: "Integration breadth (ordinal evidence-backed score)"
      yAxis: "Public operating proof (ordinal evidence-backed score)"
    approximationNotes: "Coordinates are ordinal analyst scores based only on the retained evidence; they are not market-share, revenue, or performance measurements."
    claimRefs: [CP016]
callouts:
  - calloutType: strength
    title: Integrated collateral is the clearest differentiation
    body: "The strongest product distinction in the assigned evidence is the claim that one deposit can simultaneously support lending, orders, and futures collateral."
    claimRefs: [CP002]
  - calloutType: risk
    title: Specialist incumbents set the proof burden
    body: "Hyperliquid's reported throughput and dYdX's measured volume and fees show that Flying Tulip must prove execution quality, liquidity, and risk controls rather than rely on feature breadth alone."
    claimRefs: [CP006, CP007]
  - calloutType: recommendation
    title: Underwrite milestones before moat
    body: "Treat integration as a hypothesis until independent audits, normalized realized liquidity, fee generation, and user retention are disclosed across the live product surfaces."
    claimRefs: [CP010, CP014, CP015, CP016]
