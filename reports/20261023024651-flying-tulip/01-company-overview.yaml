callouts:
  - calloutType: strength
    title: Integrated product thesis
    body: "The strongest evidenced strategic asset is a coherent shared-collateral architecture spanning trading, lending, settlement, and derivatives rather than a single isolated DeFi primitive."
    claimRefs: [CO001, CO002, CO011]
  - calloutType: risk
    title: Reserve and disclosure risk
    body: "The perpetual-put design is explicitly limited by reserves and protocol parameters, while independent evidence of reserve sufficiency, audits, revenue, and customer retention is not present in the assigned pool."
    claimRefs: [CO010, CO014]
  - calloutType: recommendation
    title: Diligence posture
    body: "Track product execution, but require contract audits, reserve reconciliation, named governance and security ownership, and operating metrics before treating the token valuation or deposits figure as investable scale."
    claimRefs: [CO005, CO010, CO014, CO016]
