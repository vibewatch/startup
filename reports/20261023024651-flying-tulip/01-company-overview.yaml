company:
  name: Flying Tulip
chapter:
  number: 1
  title: Company Overview
  summary: Flying Tulip is a DeFi financial system led by Andre Cronje that combines trading, lending, derivatives, stablecoin settlement, and insurance around shared collateral. Public evidence supports a $200 million private SAFT round at a $1 billion financing FDV, while the company later claimed a token burn reduced FDV to about $100 million; audited reserves, realized revenue, customer scale, and governance remain material gaps.
sections:
  - id: identity-leadership
    title: Identity, product, and leadership
    body: Flying Tulip presents itself as an on-chain financial system rather than a single-purpose exchange. Its documentation describes spot trading through AMM and CLOB components, lending, perpetual futures, insurance, and an ftUSD settlement rail, with a design goal of reusing collateral across products. The public site similarly describes deposits supporting lending, borrowing, staking, and trading. Andre Cronje is identified as founder across the company release and independent coverage; third-party reporting also links the project to his prior Yearn and Sonic work. Public materials identify a distributed team of about 15 people, but the assigned evidence does not provide a complete executive roster, board, legal entity, or named security leadership. That makes founder dependence and governance transparency important diligence items rather than settled strengths.
    claimRefs: [CO001, CO002, CO003, CO008]
    tableRefs: [TO002]
  - id: capital-and-governance
    title: Funding, token structure, and stakeholder exposure
    body: >-
      The strongest independent financing account is The Block's report that Flying Tulip raised $200 million in a private SAFT round at a $1 billion fully diluted valuation, with no single lead investor and a broad crypto-investor syndicate. That historical financing FDV should not be presented as current: the company later said a June 2026 burn of roughly $900 million of FT reduced FDV to roughly $100 million, a claim that still needs independent supply and market-value reconciliation. The proposed perpetual-put redemption right is described as a burn-and-redeem mechanism backed by a segregated reserve, but the company release says it is limited by reserves and protocol parameters; it is therefore not equivalent to insured principal or cash freely available to the company. One Gate funding article reports $225.5 million of cumulative funding, which conflicts with the $200 million primary account and is retained as a dated, lower-confidence discrepancy rather than normalized into a single total.
    claimRefs: [CO005, CO006, CO007, CO009, CO010, CO013, CO015]
    tableRefs: [TO001, TO003]
  - id: milestones-and-gaps
    title: Product milestones and unresolved scale questions
    body: The project has moved from a fundraising narrative toward a live, expanding product suite. Flying Tulip's blog reports launches of Trade, Total Return Swap, Rewards, automatic ftUSD compounding through ssftUSD, and a BNB Chain rollout in its September update; its October post describes Swap functionality inside the same margin account. The company website states that ftUSD is intended to target a dollar peg while generating yield, while Alchemy's independent directory reports approximately $90 million in deposits, a figure without a stated measurement date or methodology. These are meaningful operating signals but not substitutes for audited TVL, active-user, fee, retention, or revenue disclosures. The chapter therefore treats launch progress as observed company reporting, treats the deposit figure as third-party reported and time-sensitive, and leaves customer scale, realized economics, reserve reconciliation, audit coverage, regulatory permissions, and adverse-event history as open diligence work.
    claimRefs: [CO011, CO012, CO014, CO016]
    figureRefs: [FO001]
