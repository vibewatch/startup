evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A complete legal-entity, board, executive, security, and compliance roster with role dates and decision rights.
    whyItMatters: Founder concentration and a complex financial protocol require clear accountability and succession coverage.
    diligencePath: >-
      Obtain the current cap table, board minutes or governance charter, leadership roster, and named security and
      compliance owners.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: scale
    missingEvidence: Audited TVL/deposit, active-wallet, fee, revenue, retention, and chain-by-chain operating metrics.
    whyItMatters: Funding and deposits do not establish recurring revenue, customer adoption, or durable product-market fit.
    diligencePath: Request dated dashboards, fee ledgers, cohort retention, and an auditor-reconciled deposits report.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: redemption
    missingEvidence: Independent reserve attestations, smart-contract audits, queue/rate-limit parameters, and redemption stress tests.
    whyItMatters: The perpetual put is explicitly reserve-limited and is not an insured or guaranteed claim.
    diligencePath: >-
      Review deployed contract addresses, audit reports, reserve wallets, liabilities, and historical redemption
      settlement data.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: Primary documents reconciling the $200 million private round with the $225.5 million cumulative-funding figure.
    whyItMatters: Funding raised, valuation, and cash available are distinct metrics that affect solvency and dilution analysis.
    diligencePath: Obtain signed SAFT schedules, subsequent-round documents, and a financing reconciliation by date and instrument.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse
    missingEvidence: Independent legal, regulatory, incident, sanctions, and audit search results covering the current live deployment.
    whyItMatters: >-
      A live cross-margin DeFi system can create technical and regulatory liabilities not visible in promotional product
      updates.
    diligencePath: Commission current contract, sanctions, jurisdiction, incident, and litigation diligence before investment.
    relatedQuestionRefs:
      - QO007
      - QO008
  - type: conflicting-data
    severity: material
    topic: defi-tvl
