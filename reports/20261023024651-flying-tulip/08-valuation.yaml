schemaVersion: "report-v2"
artifact: valuation
slug: flying-tulip
runDate: 2026-10-23
company:
  name: Flying Tulip
chapter:
  number: 8
  title: Valuation
  summary: Public evidence supports a differentiated, integrated DeFi design and meaningful capital-market interest, but it does not establish recurring revenue, durable protocol cash flow, or an independently verified current valuation. The appropriate stance is track pending audited reserve, token-distribution, retention, and commercial-performance evidence.
sections:
  - id: investment-thesis
    title: Investment thesis and anti-thesis
    body: >-
      Flying Tulip's positive case is a unified on-chain financial system that
      reuses collateral across lending, trading, perpetuals, and settlement,
      with the official documentation describing executable-liquidity pricing
      and programmatic cashflows. The public financing case is also notable:
      PR Newswire reports a $200 million private round and an on-chain
      redemption right, while SetterVC lists a $1 billion latest valuation
      mark. The anti-thesis is that these are not operating KPIs. The available
      evidence does not disclose revenue, fee capture, retention, audited
      reserves, or a verified secondary-market clearing price. The protocol's
      capital-efficiency promise therefore remains an execution hypothesis, not
      a demonstrated earnings stream.
    claimRefs: [CV001, CV002, CV003, CV004]
    tableRefs: [TV001, TV002]
  - id: price-and-scenarios
    title: Entry discipline and scenario range
    body: >-
      The $1 billion figure should be treated as a reported financing or
      valuation mark rather than fair value. SetterVC explicitly labels its
      valuation data as estimates that may be incomplete, stale, erroneous, or
      revised; RootData separately records a $200 million seed round, a $50
      million public sale, and a $25.5 million Series A, implying a total that
      conflicts with SetterVC's $225.5 million aggregate. Funding raised is
      therefore not treated as cash available. Gate reports a
      $0.10 fixed token price and describes the perpetual-put mechanism, while
      PR Newswire cautions that redemption is limited by reserves and protocol
      parameters and is not a guarantee. A disciplined entry would require
      reserve reconciliation, token supply and unlock schedules, realized
      liquidity, and post-launch fee and retention data. Without those inputs,
      precise return math would be false precision.
    claimRefs: [CV005, CV006, CV007, CV008, CV016]
    tableRefs: [TV003]
    figureRefs: [FV001]
  - id: comps-and-diligence
    title: Comparable set and diligence decision
    body: >-
      Comparable evidence is useful for market context but cannot be converted
      into a direct multiple for Flying Tulip. CoinLaw reports that DeFi TVL
      was $71.77 billion across 453 chains on June 18, 2026, with $7.20 billion
      of daily DEX volume, while the same source describes a 37.3% year-to-date
      TVL decline. DeFiLlama's Uniswap page reports $4.121 billion of TVL,
      $100.55 million of 30-day fees, and $8.18 million of 30-day revenue as
      of October 23, 2026; these are scale and monetization reference points,
      not proof that Flying Tulip can reach them. Hyperliquid's profile shows
      a much larger, observable market-cap and trading-volume benchmark, but
      its own architecture and disclosure base differ. The investment decision
      should remain track until Flying Tulip publishes comparable operating
      data.
    claimRefs: [CV009, CV010, CV011, CV012]
  - id: recommendation
    title: Recommendation and thesis-break triggers
    body: >-
      The recommendation is track with medium confidence and a stretched,
      not fully underwritten, valuation stance. The product thesis has credible
      technical specificity: official materials describe cross-collateral
      accounts, depth-aware risk controls, and ftUSD settlement; the commercial
      thesis is not yet evidenced by disclosed recurring revenue or durable
      user cohorts. The call should move toward research-more or avoid if
      reserve coverage is not independently reconciled, the token trades below
      the claimed redemption economics, audits identify material smart-contract
      or liquidation defects, or launch incentives fail to produce repeat
      borrowing, trading, and settlement activity. It could improve toward
      buy only after independently verified reserves, transparent supply and
      unlock data, sustained fee generation, and retention cohorts are public.
    claimRefs: [CV013, CV014, CV015]
    tableRefs: []
callouts:
  - calloutType: recommendation
    title: Track, not buy
    body: The $1 billion mark is not supported by enough public operating or reserve evidence to justify a buy recommendation; wait for auditable cash-flow and token-liquidity evidence.
    claimRefs: [CV003, CV008, CV013]
  - calloutType: risk
    title: Principal-protection claims remain conditional
    body: The perpetual put is described as programmatic and reserve-limited, so it should not be valued as an unconditional guarantee.
    claimRefs: [CV007, CV008]
  - calloutType: insight
    title: Comparable scale is the missing bridge
    body: Public DeFi comparables show observable TVL, fees, revenue, or volume; Flying Tulip's assigned evidence does not yet provide the same operating bridge.
    claimRefs: [CV010, CV011, CV012]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Decision implication]
    rows:
      - [Recommendation, track, "Wait for operating and reserve verification"]
      - [Confidence, medium, "Evidence is directionally useful but incomplete"]
      - [Risk rating, high, "Smart-contract, reserve, regulatory, and market risks remain material"]
      - [Valuation stance, stretched, "$1B is a reported mark without earnings support"]
    notes: "Assessment is an analyst judgment constrained by the cited public evidence; no revenue or cash-flow metric is disclosed for Flying Tulip."
    claimRefs: [CV003, CV008, CV013, CV014]
  - id: TV002
    title: Thesis / anti-thesis
    columns: [Argument, Supporting evidence, What would change the view]
    rows:
      - ["Integrated collateral and settlement architecture", "Official docs describe shared collateral, depth-aware pricing, and ftUSD", "Independent audit and sustained utilization"]
      - ["Institutional financing interest", "PR Newswire reports a $200M private round", "Audited cap table, terms, and later investor confirmation"]
      - ["Downside-protection design", "PR Newswire describes an on-chain redemption right", "Reserve reconciliation and observed redemption liquidity"]
      - ["Commercial traction is unproven", "Assigned sources do not disclose recurring revenue or retention", "Audited fees, revenue, cohorts, and repeat usage"]
    notes: "Rows separate company or partner descriptions from the independent operating evidence still required; financing is not treated as cash available or revenue."
    claimRefs: [CV001, CV002, CV004, CV007, CV008, CV013]
  - id: TV003
    title: Bull / base / bear scenario
    columns: [Scenario, Assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Audited reserves; repeat users; sustained fee capture; transparent token supply", "A $1B mark becomes supportable only if operating metrics approach observable DeFi comparables", "Low until verified", "Reserve or cohort disclosure fails"]
      - [Base, "Products launch, but public operating evidence remains limited and incentives are material", "Track at the reported mark; do not underwrite a multiple or target return", "Most likely on current evidence", "No timely audit or fee disclosure"]
      - [Bear, "Contract, liquidation, regulatory, or reserve shortfall; weak post-incentive usage", "Capital impairment and/or token illiquidity; the put is conditional on reserve capacity", "Material", "Redemptions cannot be met or activity decays"]
      - [Diligence case, "Management supplies reconciled reserves, cap table, unlocks, audits, fees, and cohorts", "Re-underwrite with a model matched to realized protocol revenue", "Decision gate", "Evidence remains unauditable"]
    notes: "Scenario ranges are qualitative because assigned sources do not provide verified revenue, cash burn, retention, reserve balances, or a current independent clearing price."
    claimRefs: [CV003, CV007, CV008, CV010, CV011, CV013, CV015, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: Product differentiation and financing interest pass through evidence gaps before reaching a track recommendation.
    data:
      nodes:
        - {id: product, label: "Integrated DeFi architecture", tone: positive}
        - {id: financing, label: "$200M private round reported", tone: positive}
        - {id: mark, label: "$1B valuation mark", tone: warning}
        - {id: gaps, label: "Revenue, reserves, cohorts not independently verified", tone: risk}
        - {id: discipline, label: "Require audits and operating data", tone: neutral}
        - {id: recommendation, label: "TRACK", tone: opportunity}
      edges:
        - {from: product, to: financing}
        - {from: financing, to: mark}
        - {from: mark, to: gaps}
        - {from: gaps, to: discipline}
        - {from: discipline, to: recommendation}
    claimRefs: [CV001, CV003, CV008, CV013]
