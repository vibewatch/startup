artifact: financials
slug: flying-tulip
runDate: 2026-10-23
company:
  name: Flying Tulip
chapter:
  number: 4
  title: Financials
  summary: Flying Tulip has disclosed a multi-product DeFi monetization design and large token financing, but public evidence does not establish recurring revenue, realized margins, cash runway, or customer-level unit economics. The key underwriting issue is whether protocol activity and reserve economics can replace financing and token-incentive dependence.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Flying Tulip describes an integrated financial system spanning lending, spot trading,
      derivatives, insurance, and ftUSD. Its public materials identify trading fees, lending
      spreads, stablecoin yield, and insurance premiums as intended revenue streams, while the
      official site frames capital movement across products as the core efficiency proposition.
      These are mechanisms and company or partner descriptions, not audited revenue. The
      company also says protocol revenues may support development and FT buybacks, so the
      economic linkage between usage, revenue, and token support is central to underwriting.
      No retained source provides a time series for fee revenue, take rate, realized spread,
      insurance loss ratio, or recurring revenue. The model should therefore be treated as a
      set of stated monetization paths rather than demonstrated financial performance.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-unit-economics
    title: Traction, pricing, and unit economics
    body: >-
      Public traction is limited to product and activity signals rather than customer
      economics. Flying Tulip's own update says Lend TVL, ftUSD supply, borrowing activity,
      fees, and FT buybacks reached new highs in August, but it does not disclose the values,
      period-over-period rates, user counts, or cohort retention. Alchemy independently lists
      the application with around $90M in deposits, but the page does not define the
      measurement date, composition, or whether deposits equal TVL. Token sale materials
      establish a fixed $0.10 FT sale price in some phases, not realized protocol pricing or
      revenue per user. CAC, payback, gross margin, utilization, liquidation losses, and
      customer concentration remain unavailable. Any scenario should keep these inputs
      explicitly public-claimed, proxy, or unavailable.
    claimRefs: [CI005, CI006, CI007, CI008]
    tableRefs: [TI003]
  - id: capital-and-reserve
    title: Capital adequacy and financing dependency
    body: >-
      The financing structure is unusual: Blocmates reports a $200M seed SAFT at a $1B fully
      diluted valuation and describes a perpetual put, while the company-issued release says
      redemptions are settled from a segregated on-chain reserve seeded from raised capital.
      CoinList cautions that sale information was supplied by Flying Tulip and that the asset
      is speculative. This is financing raised, not cash available for operations or proof of
      runway. The same materials describe deploying contributed funds into conservative
      on-chain lending strategies or targeting yield, but no audited reserve balance, asset
      allocation, encumbrance schedule, burn rate, debt facility, or withdrawal policy is
      disclosed. A later Gate article reports $225.5M cumulative funding, but its chronology
      is not reconciled to the $200M primary announcement. Capital adequacy is therefore a
      material diligence gap rather than a solved question.
    claimRefs: [CI009, CI010, CI011, CI012]
  - id: underwriting-verdict
    title: Financial underwriting verdict
    body: >-
      The investment case has a credible product-to-monetization narrative but weak public
      financial observability. Integrated collateral can reduce the need to move assets across
      venues, yet it also links lending, trading, derivatives, stablecoin, and insurance
      exposures. The BIS warns that DeFi vulnerabilities can be severe because of leverage,
      liquidity mismatches, interconnectedness, and limited shock absorbers; that is relevant
      downside context for any margin and reserve model, not evidence of a Flying Tulip loss.
      The highest-priority asks are an auditor-reconciled reserve and redemption report,
      product-level fee and expense statements, realized spread and liquidation-loss data,
      user and retention cohorts, and a cash/runway schedule. Until those are supplied,
      revenue quality and margin path should be scored as unverified and financing dependency
      as high.
    claimRefs: [CI013, CI014, CI015, CI016]

tables:
  - id: TI001
    title: Revenue streams table
    columns: [Stream, Mechanism described publicly, Current value/status, Quality and diligence ask]
    rows:
      - [Trading, "Spot and derivatives trading fees", null, "Mechanism disclosed; obtain fee schedule, volumes, realized take rate, and net revenue"]
      - [Lending, "Lending spreads and interest-bearing deposits", null, "Mechanism disclosed; obtain utilization, borrow/supply rates, bad debt, and net spread"]
      - [ftUSD, "Stablecoin yield and settlement activity", null, "Company-claimed design; obtain reserve composition, yield attribution, and peg-loss history"]
      - [Insurance, "On-chain insurance premiums", null, "Product scope described; obtain premium volume, claims, loss ratio, and reserve policy"]
    notes: "Streams are stated mechanisms, not reported revenue. Null means no retained source supplied a comparable current value or audited period."
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: Pricing and monetization table
    columns: [Item, Public price or term, List versus realized, Underwriting implication]
    rows:
      - [FT token sale, "$0.10 per FT in reported presale phases", "Sale price, not protocol revenue", "Test sale settlement, circulating supply, and redemption-reserve funding"]
      - [Public sale, "Target up to $1B total private and public funding", "Fundraising target, not cash received", "Reconcile commitments, proceeds, and use of funds"]
      - [On-chain redemption right, "Redeem up to original principal in contributed asset", "Contractual/programmatic right, not guaranteed cash", "Obtain reserve attestations and stress-test redemption capacity"]
      - [Product fees, "No retained fee schedule or realized rate", "Unavailable", "Request product-level pricing, discounts, rebates, and net take rate"]
    notes: "Reported token terms and targets are not equivalent to realized revenue, cash available, or margin. The company release says the redemption right is limited by reserves and parameters."
    claimRefs: [CI007, CI009, CI010, CI011]
  - id: TI003
    title: Unit economics table
    columns: [Metric, Value, Confidence, Why it matters and diligence ask]
    rows:
      - [Deposits, "~$90M listed by Alchemy", "Medium proxy", "Clarify date, asset mix, TVL definition, and reconciled on-chain balance"]
      - [Revenue, null, "Unavailable", "Need fees, spreads, premiums, incentives, and net protocol revenue by product"]
      - [Gross margin, null, "Unavailable", "Need liquidity, oracle, chain, insurance, and incentive costs"]
      - [CAC/payback, null, "Unavailable", "Need acquisition spend, wallet cohorts, funded activation, and retention"]
      - [Runway, null, "Unavailable", "Need cash/reserve policy, monthly burn, liabilities, and financing restrictions"]
      - [Standardized financial statement, null, "Unavailable for Flying Tulip", "Reconcile fees, revenue, expenses, and earnings using an on-chain analytics export"]
    notes: "Null fields are public-data gaps, not zeroes. The deposits figure is a third-party listing without a disclosed measurement basis."
    claimRefs: [CI004, CI005, CI006, CI008, CI014, CI015]

figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: Customer collateral and activity are intended to feed several monetization paths, but public evidence does not quantify conversion into revenue or gross profit.
    data:
      nodes:
        - id: collateral
          label: "Deposited collateral"
          detail: "Users deposit supported assets into shared accounts or pools."
        - id: lending
          label: "Lending and borrowing"
          detail: "Interest-bearing deposits and borrow positions."
        - id: trading
          label: "Spot and derivatives"
          detail: "Trading activity intended to generate fees."
        - id: ftusd
          label: "ftUSD settlement"
          detail: "Stablecoin design intended to generate yield."
        - id: insurance
          label: "Insurance"
          detail: "Risk-transfer product intended to generate premiums."
        - id: protocol
          label: "Protocol revenue"
          detail: "Stated uses include development and FT buybacks; amount is unavailable."
      edges:
        - from: collateral
          to: lending
        - from: collateral
          to: trading
        - from: collateral
          to: ftusd
        - from: collateral
          to: insurance
        - from: lending
          to: protocol
        - from: trading
          to: protocol
        - from: ftusd
          to: protocol
        - from: insurance
          to: protocol
    approximationNotes: "Conceptual bridge based on publicly described mechanisms; no revenue, gross-profit, or conversion values are inferred."
    claimRefs: [CI001, CI002, CI003, CI004]

callouts:
  - calloutType: strength
    title: Integrated monetization architecture
    body: "The same collateral account is designed to support lending, trading, and settlement products, creating several potential fee and spread channels."
    claimRefs: [CI001, CI002, CI005]
  - calloutType: risk
    title: Financing is not runway
    body: "The disclosed raise and redemption reserve describe financing design, but public materials do not establish unrestricted operating cash, burn, liabilities, or reserve coverage."
    claimRefs: [CI009, CI010, CI011, CI012]
  - calloutType: recommendation
    title: Underwrite only after financial disclosure
    body: "Require reconciled reserve, fee, expense, utilization, loss, and cohort data before treating the protocol's monetization model as demonstrated."
    claimRefs: [CI013, CI014, CI015, CI016]

