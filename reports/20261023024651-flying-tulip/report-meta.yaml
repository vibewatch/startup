companyProfile:
  summary: >-
    Flying Tulip is an Andre Cronje-led DeFi project presenting a multi-product financial system rather than a
    single-purpose venue. Its public materials describe shared collateral across spot trading, lending, perpetual
    futures, insurance, and ftUSD settlement, while independent coverage confirms a large private SAFT round and
    identifies a small distributed team. The evidence base does not yet establish audited reserves, recurring revenue,
    customer retention, or a complete governance and security organization.
