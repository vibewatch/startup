  topStrengths:
    - Broad shared-collateral product architecture spanning multiple DeFi use cases.
    - Credible institutional financing syndicate and a distinctive on-chain redemption mechanism.
    - Evidence of a live, expanding product rollout across several chains.
  topRisks:
    - No independently verified recurring revenue, retention, or current fair-value mark.
    - Reserve, smart-contract, liquidation, and stablecoin controls lack public independent audit evidence.
    - Small team, founder concentration, regulatory uncertainty, and incumbent liquidity advantages.
  unresolvedGaps:
