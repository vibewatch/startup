  evidenceGaps:
    - type: missing-source
      severity: material
      topic: audit-evidence
      missingEvidence: Independent audit reports mapped to specific Flying Tulip deployed contracts, reviewed commits, scope, findings, and remediation status.
      whyItMatters: The shared pricing, credit, futures, and settlement design creates coupled smart-contract and economic-risk exposure that design documentation cannot validate.
      diligencePath: Obtain auditor-issued reports, commit hashes, deployment addresses, remediation attestations, and any public bug-bounty scope; reconcile each artifact to current production contracts.
      relatedQuestionRefs: [QE008]
    - type: missing-source
      severity: material
      topic: operational-reliability
      missingEvidence: Dated uptime, incident, exploit, recovery-time, oracle or price-manipulation, liquidation, and postmortem records for each live chain and product.
      whyItMatters: Reliability and recovery evidence are required to test whether the coupled architecture behaves safely during stressed liquidity and infrastructure failures.
      diligencePath: Request status-page exports, incident logs, postmortems, recovery objectives, monitoring coverage, and chain-by-chain service-level records since initial launch.
      relatedQuestionRefs: [QE010]
    - type: private-evidence-only
      severity: material
      topic: control-effectiveness
      missingEvidence: Independent testing of OFAC screening, tax reporting, circuit breakers, cap enforcement, governance access, key management, and emergency-change procedures.
      whyItMatters: Public descriptions establish intended controls but not implementation coverage, false-negative rates, privileged-access safeguards, or operational effectiveness.
      diligencePath: Review control architecture, vendor contracts, screening rules, privileged-role inventory, multisig policy, change logs, tabletop tests, and independent assurance results.
      relatedQuestionRefs: [QE006, QE009]
    - type: stale
      severity: minor
      topic: deployment-metrics
      missingEvidence: Dated and independently reproducible chain-by-chain deposits, active users, transaction volumes, integration counts, and product availability.
      whyItMatters: The undated directory metric cannot establish current adoption or consistent deployment maturity across supported chains.
      diligencePath: Reconcile contract-address-level analytics against a dated protocol dashboard and independent on-chain data provider for each chain and product.
      relatedQuestionRefs: [QE004]
