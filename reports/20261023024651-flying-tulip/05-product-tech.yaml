artifact: product-tech
slug: flying-tulip
runDate: 2026-10-23
company:
  name: Flying Tulip
chapter:
  number: 5
  title: Product & Technology
  summary: Flying Tulip is designed as a shared-collateral DeFi system in which trading liquidity informs lending and perpetual-futures risk, with ftUSD as the settlement rail. The architecture is differentiated on paper, but public evidence is stronger on design than on production maturity, independent audits, reliability, and operating controls.
sections:
  - id: product-and-workflow
    title: Product definition and user workflow
    body: >-
      Flying Tulip presents one account and collateral base for spot trading, lending,
      perpetual futures, insurance, and ftUSD rather than requiring users to move assets
      among separate protocols. Its official design says a deposit can continue earning
      base yield while supporting lending, resting orders, or futures collateral; Alchemy
      and Coinranking independently describe the same shared-pool, cross-margin concept.
      Tapbit's February 2026 launch review, however, reported only ftUSD and margin lending
      as initially live, with spot trading, leverage, and total-return swaps expected later.
      The investable product therefore should be underwritten as a staged rollout of a
      broad financial stack, not as proof that every documented module has equivalent
      production maturity. Users gain fewer collateral transfers and a common interface,
      while accepting more dependence on one protocol's risk engine and settlement design.
    claimRefs: [CE001, CE002, CE009, CE016]
    tableRefs: [TE001, TE002]
  - id: architecture-and-risk-engine
    title: Architecture and operating model
    body: >-
      The documented pricing spine is Trade, a hybrid AMM and central limit order book.
      Orders are intended to consume order-book liquidity before residual flow reaches an
      adaptive AMM; time- and reserve-aware windows then feed downstream credit and
      derivatives decisions. Lending is split between permissionless pair markets and a
      curated cross-collateral pool, while perpetual futures use internal trading activity
      rather than an external oracle and settle in ftUSD. This can reduce lag and fragmented
      pricing, but it also couples execution, leverage limits, liquidations, funding, and
      settlement to the quality and resilience of the same liquidity signals. The official
      documentation is detailed enough to establish the intended mechanisms, not their
      implementation correctness, stress performance, or deployed-contract equivalence.
    claimRefs: [CE003, CE004, CE005, CE006, CE016]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: maturity-deployment-and-developer-surface
    title: Deployment, integration, and maturity
    body: >-
      Public maturity signals are mixed. Tapbit reported a February 2026 launch with
      ftUSD and margin lending first and broader functions scheduled for subsequent weeks.
      Alchemy's independently written directory page describes deployments on Ethereum,
      Avalanche, BNB Chain, Base, and Solana and reports around $90 million in deposits,
      but the page provides no visible metric date in the fetched text. Flying Tulip's
      documentation advertises SDK references, API documentation, and integration guides,
      yet that statement does not establish API stability, versioning, support response
      times, usage, or third-party integration quality. The developer surface is therefore
      credible as documentation intent but insufficient as evidence of a mature integration
      ecosystem or consistent multi-chain operations.
    claimRefs: [CE008, CE009, CE010]
  - id: trust-security-and-quality
    title: Trust, security, compliance, and quality controls
    body: >-
      Flying Tulip documents conservative treasury-allocation policy, venue and asset caps,
      circuit breakers, staged parameter changes, pre-trade simulation, bounded fees, and
      soft liquidations. Coinspeaker separately reports company-stated OFAC screening and
      tax-reporting features, but does not provide implementation detail or independent
      control testing. The assigned evidence also contains no contract-specific audit report,
      auditor scope, deployment-to-commit mapping, bug-bounty terms, uptime history, or
      incident postmortem for Flying Tulip. Code4rena demonstrates the kind of named audit
      and mitigation-review artifact available for DeFi projects, but its fetched landing
      page does not establish a Flying Tulip engagement. This gap matters because Coinranking
      flags the larger attack surface of a multi-product design, while Chainalysis reports
      private-key compromise as 43.8% of stolen crypto in 2024 and stablecoins as 63% of
      illicit transaction volume. Those ecosystem figures are risk context, not evidence
      of a Flying Tulip incident.
    claimRefs: [CE007, CE011, CE012, CE013, CE014, CE015, CE016]
callouts:
  - calloutType: strength
    title: Coherent shared-risk design
    body: The same liquidity and collateral framework is intended to connect execution, borrowing, futures, settlement, and protocol cashflows, reducing product-to-product fragmentation if implemented as documented.
    claimRefs: [CE002, CE003, CE004, CE005, CE006]
  - calloutType: risk
    title: Verification trails product breadth
    body: Public materials explain the intended mechanics, but they do not provide enough contract-specific audit, reliability, incident, integration, or control evidence to validate production resilience across the full stack.
    claimRefs: [CE008, CE011, CE012, CE016]
tables:
  - id: TE001
    title: Product module and maturity matrix
    columns: [Module, Primary user, Public status or maturity signal, Differentiation, Diligence gap]
    rows:
      - ["Trade (AMM + CLOB)", "Traders and liquidity providers", "Officially documented; broader spot rollout was described as following the initial launch", "Hybrid execution and shared price spine", "Deployed contracts and stress-test results"]
      - ["Permissionless Lend", "Pair-market lenders and borrowers", "Officially documented", "Depth-aware borrowing with snapshot LTV and soft liquidation", "Pair coverage and realized liquidation outcomes"]
      - ["Permissioned Lend", "Curated-asset cross-margin users", "Officially documented", "One deposit can support lending, orders, and futures", "Admission policy and concentration limits"]
      - ["Perpetual futures", "Leveraged traders and settlement LPs", "Officially documented; launch sequencing remained staged", "Internal trade-derived pricing and borrowing-linked funding", "Production liquidity and manipulation testing"]
      - ["ftUSD and sftUSD", "Settlement users and yield seekers", "Tapbit reported ftUSD among the first live products", "Delta-neutral settlement rail with optional staking", "Reserve composition, peg history, and independent attestations"]
      - ["Insurance and protocol cashflows", "Protocol users and FT holders", "Described in official and independent overviews", "Product fees feed programmatic FT buybacks", "Policy wording, claims history, and revenue-to-buyback reconciliation"]
    notes: Public status combines official design documentation with dated third-party launch reporting; it does not equate documentation with audited production readiness.
    claimRefs: [CE001, CE003, CE004, CE005, CE006, CE009]
  - id: TE002
    title: Workflow and use-case assessment
    columns: [User job, Conventional fragmented workflow, Flying Tulip approach, Claimed measurable benefit, Limitation]
    rows:
      - ["Deploy collateral across activities", "Deposit into separate protocols and accounts", "Reuse one collateral base across lending, orders, and futures", "Higher capital efficiency per deposit", "Benefit is design-level and lacks public realized-user measurement"]
      - ["Execute spot orders", "Choose between AMM and order-book venues", "Route order-book liquidity first and residual flow to the AMM", "Potentially tighter execution with adaptive liquidity", "No public slippage benchmark in assigned evidence"]
      - ["Manage leveraged risk", "Depend on external prices and fixed risk tables", "Use internal depth-aware prices for limits and liquidation sizing", "Reduced exposure to delayed-oracle pricing", "Internal liquidity becomes a shared failure dependency"]
      - ["Settle and earn on dollar assets", "Move among stablecoins and yield products", "Use ftUSD for settlement and stake into sftUSD for variable distributions", "Common settlement rail across products", "Peg, reserve, and yield performance remain unverified here"]
    notes: Benefits are mechanism claims from official documentation unless explicitly framed as third-party reporting; no public benchmark establishes realized user outcomes.
    claimRefs: [CE002, CE003, CE005, CE006, CE016]
  - id: TE003
    title: Technology and operating architecture
    columns: [Layer or process, Role, Key dependency, Principal risk]
    rows:
      - ["User and developer surface", "Unified product access plus promised SDK, API, and integration guidance", "Documentation quality and interface stability", "Support, versioning, and integration adoption are undisclosed"]
      - ["Trade price spine", "Match CLOB liquidity then route residual flow through adaptive AMM", "Sufficient executable liquidity and robust regime signals", "Thin or manipulated liquidity can propagate into risk calculations"]
      - ["Credit and margin", "Set pair-level and cross-collateral borrowing power", "Depth-aware windows, asset caps, and liquidators", "Shared collateral can transmit stress across products"]
      - ["Perpetual futures", "Derive leverage, funding, and liquidation inputs from internal trading", "Trade-engine availability and ftUSD settlement liquidity", "Oracle reduction does not remove market-manipulation or availability risk"]
      - ["Risk and treasury controls", "Apply caps, circuit breakers, staged changes, simulations, and soft unwind", "Governance discipline and observable control operation", "Controls are documented but not independently tested in assigned evidence"]
    notes: Architecture is reconstructed from Flying Tulip documentation and independent summaries; code-level implementation and deployed-parameter verification remain open.
    claimRefs: [CE003, CE004, CE005, CE007, CE008, CE016]
figures:
  - id: FE001
    title: Flying Tulip product architecture map
    type: stack
    summary: The documented stack uses Trade as a pricing spine, a shared collateral layer for credit and futures, and ftUSD for settlement, with policy controls spanning the system.
    data:
      layers:
        - label: User and integration surface
          detail: One interface and a documentation hub intended for users and builders.
          modules: [Spot and limit-order access, Lending and borrowing, Perpetual positions, SDK and API guidance]
          outputs: [Unified product workflow]
        - label: Trade price spine
          detail: Hybrid AMM and CLOB execution supplies depth-aware market signals.
          modules: [CLOB matching, Adaptive AMM, TWAP and reserve-aware windows]
          outputs: [Executable price and depth]
        - label: Credit and shared collateral
          detail: Pair markets coexist with a curated cross-collateral pool.
          modules: [Permissionless Lend, Permissioned Lend, Snapshot LTV, Soft liquidation]
          outputs: [Borrowing power and shared margin]
        - label: Perpetual futures
          detail: Internal trading informs leverage, funding, liquidation, and settlement.
          modules: [Depth-aware limits, Borrowing-linked funding, Time-sliced unwind]
          outputs: [ftUSD-settled derivatives]
        - label: Settlement rail
          detail: ftUSD clears product activity and sftUSD is the optional variable-yield form.
          modules: [ftUSD, sftUSD, Settlement LPs]
          outputs: [Common dollar-target settlement]
        - label: Policy and cashflow controls
          detail: Caps, breakers, staged changes, and protocol revenues frame system operation.
          modules: [Asset and venue caps, Circuit breakers, Pre-trade simulation, Buyback pipeline]
          outputs: [Risk constraints and FT cashflows]
    approximationNotes: Conceptual map of the documented operating design; layer order does not establish deployed code, security, performance, or production maturity.
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE016]
