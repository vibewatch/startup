    - 'Thin: the round is real, but public economics are not.'
    - The view improves if ARR is already above roughly $75M-$100M with software-like margins.
  - - Capital structure
    - 'Mixed: the latest round reduces near-term financing risk but leaves preference and dilution terms private.'
    - The view improves after cap-table, liquidation-preference, and any secondary-overhang diligence.
