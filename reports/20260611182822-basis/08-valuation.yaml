- id: bull-base-bear-scenario-range
  title: Bull, base, and bear scenario ranges
  body: 'The scenario work makes the underwriting problem explicit. If Basis is still in a $25 million to $40 million ARR zone, even generous 8x to 12x software multiples imply a value hundreds of millions below the February 2026 mark. A middle case around $50 million to $75 million of ARR with 12x to 16x multiples only starts to bracket the current value; it does not make the round obviously cheap. A genuinely attractive upside requires something stronger: ARR already nearer $80 million to $120 million, software-like margins, and enough customer expansion evidence to keep a 15x to 20x premium band credible. The bearish path is not product collapse. It is ordinary software re-rating plus AI-control risk in tax and audit workflows, where hallucinations, privacy failures, or supervision gaps would be punished quickly by buyers. The upside path is standardization: if Basis can turn top-firm logos and partner proof into repeatable, high-margin deployments, the mark can still work. That is why the valuation stance remains stretched rather than broken: strategic plausibility exists, but the current price only works inside a conservative base-to-bull band.'
