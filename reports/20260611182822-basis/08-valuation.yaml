- id: TV003
  title: Comparable valuation table
  columns:
  - Comparable
  - Type
  - Current disclosed marker
  - Public multiple / scale signal
  - Relevance to Basis
  - Limitation
  rows:
  - - Basis
    - Private accounting AI
    - 'Feb. 2026: $100M round at ~$1.15B'
    - No public ARR or revenue denominator
    - Reference mark for the current underwriting decision
    - Headline valuation is visible; economics are not
  - - Numeric
    - Private accounting automation
    - 'Nov. 2025: $51M Series B; ~$89M total raised'
    - Claims 90%+ auto-match rate and finance-ops expansion
    - Closest workflow-automation peer with fresh funding proof
    - Valuation was not publicly disclosed
  - - Truewind
    - Private accounting AI
    - 'Jan. 2025: $13M Series A; >$17M total raised'
    - Claims 4x revenue growth and 47% of close tasks absorbed
    - Useful early-stage peer for AI-close automation adoption
    - Valuation was not publicly disclosed
  - - Ramp
    - Private fintech AI
    - 'Jun. 2026: $44B valuation; >$1B annualized revenue'
    - 70k+ customers and >$3B total funding
    - Shows what a visible denominator can support in AI-fintech
    - Much broader spend and payments platform than Basis
  - - BILL
    - Public fintech / accounting infrastructure
    - FY2025 revenue ~$1.46B; 81.4% GAAP gross margin
    - ~2.08x P/S; ~1.84x EV/revenue
    - Public lower-band comp for finance automation economics
    - Mix includes payments and transaction revenue, not just SaaS
  - - Workiva
    - Public reporting / audit software
    - 2024 revenue ~$738.7M; ~90% subscription/support
    - ~3.03x P/S; ~2.91x EV/revenue
    - Good comp for audit-ready reporting and disclosure workflows
    - Larger, more mature, and public-company oriented
  - - BlackLine
    - Public accounting automation
    - 2024 GAAP gross margin 75.2%
    - ~2.59x P/S; ~2.49x EV/revenue
    - Closest public comp for close and accounting automation
    - More mature and less AI-native than Basis
  - - Intuit
    - Public incumbent platform
    - Large incumbent with broad SMB accounting surface
    - ~3.80x P/S; ~3.64x EV/revenue
    - Upper-end incumbent multiple reference for trusted finance software
    - Broader tax and SMB ecosystem makes direct comparability imperfect
  notes: Private rows use whichever marker is actually disclosed in reviewed sources—valuation when available, otherwise round size and scale signals. Public rows pair filings with current market-data pages to keep the comp set anchored in both fundamentals and current pricing.
