company:
  name: Basis
chapter:
  number: 8
  title: Valuation
  summary: 'Basis reached a February 2026 unicorn mark with unusually strong sponsor quality and visible accounting-firm proof, but the public record still lacks the denominator needed to underwrite that price with traditional multiple discipline. Private accounting-AI comps show real investor appetite, while public accounting and fintech software comps trade closer to 2x-4x sales and 2026 software-multiple context has tightened materially. The evidence-supported call is therefore research-more with medium confidence, high risk, and a stretched valuation stance: the upside exists, but only if ARR, retention, margin, and preference-stack diligence validate a much stronger economic profile than public sources currently disclose.'
sections:
- id: price-sensitive-verdict
  title: Price-sensitive verdict and entry discipline
  body: 'Basis has crossed the most important headline threshold for a young vertical-AI company: a February 2026 Series B put the company at about $1.15 billion with blue-chip sponsors and real accounting-firm penetration. That matters. The top-line story is stronger than generic “AI for finance” marketing because the evidence set includes top-25 firm penetration, a Baker Tilly channel-style collaboration, and an OpenAI case study pointing to measurable time savings. Those are not enough, however, to convert the current mark into an automatic underwriting pass. The public record still does not disclose ARR, revenue, retention, or burn, so the investor is effectively paying for leadership in a category that looks real but is still economically opaque. Public comp multiples for Intuit, Workiva, BlackLine, and BILL cluster around roughly 2x to 4x sales, and 2026 SaaS market context is materially less forgiving than 2021. That leaves the recommendation price-sensitive rather than categorical: Basis looks strategically interesting and commercially plausible, but at the current mark the disciplined call is research-more, with medium confidence, high risk, and a stretched valuation stance rather than buy-first and diligence-later.'
