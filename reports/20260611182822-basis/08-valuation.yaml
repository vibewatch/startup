  evidenceGaps:
  - type: private-evidence-only
    severity: blocking
    topic: basis-arr-retention
    missingEvidence: Actual ARR, net revenue retention, customer retention cohorts, and revenue bridge into the February 2026 valuation.
    whyItMatters: Without a hard denominator, the current $1.15B mark can only be reverse-engineered through scenario bands rather than validated.
    diligencePath: Request board deck KPI pages, monthly recurring revenue bridge, cohort retention tables, and investor data room KPI definitions.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: basis-cap-table
    missingEvidence: Current cap table, liquidation preferences, option-pool refreshes, secondaries, and any venture debt or structured financing.
    whyItMatters: Preference overhang and hidden dilution can turn a plausible enterprise value into an unattractive common-equity entry.
    diligencePath: Request fully diluted ownership schedule, latest term sheet, side letters, note schedules, and any secondary or tender history.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: basis-margin-mix
    missingEvidence: Software-versus-services revenue mix, gross margin by major workflow, and implementation or support burden by customer cohort.
    whyItMatters: Basis only deserves a premium software multiple if automation economics are software-like rather than services-heavy.
    diligencePath: Request margin bridge by product line, customer implementation staffing ratios, and support-cost waterfall.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: basis-customer-quality
    missingEvidence: Customer concentration, renewal rates, expansion ARR, win-loss data, and realized time-to-value for top-firm deployments.
    whyItMatters: Penetration headlines do not tell an investor whether Basis compounds inside firms or stalls after pilot deployments.
    diligencePath: Request top-20 customer ARR list, renewal cohorts, expansion waterfall, and standardized implementation scorecards.
    relatedQuestionRefs:
    - QV030
    relatedTableRefs:
    - TV006
  - type: enumeration-incomplete
    severity: material
    topic: comparable valuation table coverage
    missingEvidence: Private-comp valuation disclosures for Numeric and Truewind plus closer private-market revenue denominators for accounting-automation peers.
    whyItMatters: The comparable table is decision-useful but still partial because the freshest private accounting-AI rounds do not publicly disclose valuation and economics with the same precision as public comps.
    diligencePath: Request private-market database pulls or investor materials for peer valuations, then update the table with disclosed valuation bands or explicitly verified absences.
    relatedTableRefs:
    - TV003
