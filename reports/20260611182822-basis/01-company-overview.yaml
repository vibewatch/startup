  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital structure
    missingEvidence: Public disclosure on any secondary sales, debt facilities, or warehouse-style credit linked to Basis.
    whyItMatters: Series B and investor-map analysis is incomplete without knowing whether employees or early investors received liquidity or whether non-equity financing exists.
    diligencePath: Request board materials, cap-table summary, financing documents, and any lender or secondary transaction schedules from management.
    relatedQuestionRefs:
    - QO014
    relatedTableRefs:
    - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue and ARR disclosure
    missingEvidence: Current ARR, revenue run rate, gross margin, and any customer-retention metrics.
    whyItMatters: The chapter can support funding and penetration signals, but not unit economics or quality-of-revenue underwriting.
    diligencePath: Request management KPI pack, board deck, and cohort retention data tied to GAAP or management reporting definitions.
    relatedQuestionRefs:
    - QO019
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: headcount and locations
    missingEvidence: A current employee count and precise office footprint instead of indirect hiring cues and New York references.
    whyItMatters: Operating leverage, burn, and org-scale assessment remain uncertain without a current people and location baseline.
    diligencePath: Request current org chart, headcount by function, office lease summary, and hiring plan.
    relatedQuestionRefs:
    - QO020
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: minor
    topic: leadership depth
    missingEvidence: A current board list and full executive roster beyond founders, investor-board names, and Annette Garcia.
    whyItMatters: Key-person dependence is easier to underwrite once the full management bench and committee structure are visible.
    diligencePath: Request current board observer list, executive roster, and role charters; cross-check against HR and insurance schedules.
    relatedQuestionRefs:
    - QO007
    - QO008
    relatedTableRefs:
    - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: milestone chronology completeness
    missingEvidence: A fuller dated chronology covering internal launches, exact board approvals, and any undisclosed financing or customer milestones that did not make it into public materials.
    whyItMatters: The overview chapter has a usable chronology, but later chapters should know the milestone table is public-record partial rather than exhaustive.
    diligencePath: Request the internal company timeline, board calendars, and product launch log to reconcile what is missing from the public chronology.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO004
