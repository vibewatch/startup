- id: milestones-and-carry-forward-risks
  title: Milestones, model partnerships, and cautionary signals to carry forward
  body: 'The dated public chronology is now rich enough to act as the reusable record for later chapters. Basis was founded in 2023, emerged publicly with its seed financing in October 2023, disclosed a Wiss beta beginning in late 2023, raised a $34 million Series A in December 2024, published a detailed OpenAI-progress narrative in August 2025, and then crossed into a new scale bracket with its February 2026 Series B. March and April 2026 added a Codex spotlight and the Baker Tilly collaboration, while June 2026 public commentary from Annette Garcia made the tax-and-audit expansion path explicit. The positive story is therefore clear: stronger capital, expanding workflow breadth, and visible partner proof. The cautionary story is also clear. Basis is operating in a domain where trustworthy AI, cybersecurity governance, and reviewable audit trails are not optional. SEC, NIST, and broader professional-services research all point toward a higher compliance bar for AI systems in financial workflows.
    That does not undermine the company thesis, but it means later risk work should treat trust, governance, and disclosure completeness as first-order diligence items rather than polish work.'
