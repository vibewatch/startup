company:
  name: Basis
chapter:
  number: 1
  title: Company Overview
  summary: Basis is a private New York-based AI accounting software company whose public record is strongest on founder identity, funding, large-firm penetration, and trust-oriented product positioning. Retained sources support a 2023 founding, seed/Series A/Series B funding culminating in a $100 million round at a $1.15 billion valuation in February 2026, and workflow expansion across CAS, tax, and audit with named proof points such as Wiss and Baker Tilly. The main diligence limits are thin public disclosure on revenue, ARR, headcount, office footprint, and detailed board or executive depth, plus the broader regulatory and trustworthy-AI burden that comes with high-stakes accounting automation.
sections:
- id: identity-and-scope
  title: Identity, headquarters, stage, and product scope
  body: 'Basis has a fairly consistent public identity even though the company does not publish a dense corporate fact sheet. The homepage, about page, and launch materials all describe Basis as an AI agent platform for accountants rather than a horizontal productivity copilot. The legal record visible on the privacy policy identifies the operating entity as Essex Labs, Inc. doing business as Basis. Public financing coverage from CPA Practice Advisor and Crowdfund Insider places the company in New York City, while the official site itself does not publish an address or office list, so headquarters should be treated as externally reported rather than company-certified. The cleanest stage label is private Series B: Basis publicly announced a $100 million round at a $1.15 billion valuation in February 2026 and nothing in the retained source set suggests a public listing or later financing. The product narrative is also unusually specific for a young company: agents are meant to execute real
    accounting workflows, then hand finished work back to accountants for review, judgment, and client advisory rather than replacing the profession outright.'
  claimRefs:
  - CO001
  - CO002
  - CO003
  - CO005
  - CO008
  - CO009
  - CO010
  - CO045
- id: founders-governance-and-key-person-risk
  title: Founders, governance, and key-person concentration
  body: >-
    The founder record is broader than the operating narrative visible in fundraising coverage. Seed and later financing materials consistently name Matthew Harpe and Mitchell Troyanovsky as the co-founders most tied to commercial launch, with Harpe the clearest public CEO voice and Troyanovsky a visible product-facing co-founder in the later Codex customer spotlight. Separate retained founder materials and Citybiz's Series A coverage identify Zenna Tavares, Emily Mackevicius, and Eli Bingham as co-founders as well, giving Basis a supportable five-person founding cohort for this chapter even though public materials emphasize different subsets. Concise backgrounds are also supportable for four of the five: Harpe is described externally as a former Boston Consulting Group and SoftBank executive; Basis and Tavares's own site describe Zenna as a reasoning researcher, former Columbia innovation scholar, and MIT Ph.D.; Basis describes Mackevicius as a Columbia-trained postdoctoral researcher and MIT Ph.D. who leads Collaborative Intelligent Systems; and Basis describes Bingham as a Broad Institute fellow, Pyro co-creator, and former Uber AI Labs senior research scientist. By contrast, retained public materials identify Troyanovsky as a co-founder and product-facing representative but do not provide a fuller pre-Basis biography. Public disclosure still does not cleanly map operating titles, governance roles, or ownership across all five founders. Annette Garcia is explicitly identified as joining in 2024 as the fifth full-time employee and now leads Accounting Product Operations, a notable sign that Basis is embedding practitioner expertise into product development instead of leaving the platform entirely in the hands of engineers. Governance also became more legible at the Series B, when Miles Clements of Accel joined a board that already included Keith Rabois through Khosla Ventures. Even so, the disclosed bench remains concentrated: founders still dominate product narrative, strategic positioning, and external communication, so key-person dependence should be treated as real until management publishes a fuller executive roster and board map.
  claimRefs:
