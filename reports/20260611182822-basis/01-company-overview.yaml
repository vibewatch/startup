- id: capital-base-and-stakeholders
  title: Funding history, investor base, and stakeholder map
  body: 'Basis now has a coherent public capital history even if finer points of the cap table remain private. The company emerged publicly with a $3.6 million seed round in October 2023, raised a $34 million Series A led by Khosla Ventures in December 2024, and then announced a $100 million Series B at a $1.15 billion valuation in February 2026. Reconciling those rounds gives roughly $137.6 million raised, which several outside publications round to about $138 million. The Series B syndicate materially broadened the stakeholder base: Accel and GV entered as lead names, Khosla doubled down, and other backers and angels from across software, infrastructure, and finance remained involved. That investor roster matters because it gives Basis more than just capital; it also adds distribution, hiring, and strategic credibility with accounting firms, model labs, and future enterprise buyers. The important public gap is what is not disclosed: there is no evidence in the retained source set of debt,
    warehouse financing, tender activity, or other secondaries, so the equity story is visible but the complete capital-structure story is not.'
  claimRefs:
  - CO011
  - CO012
  - CO013
  - CO014
  - CO015
  - CO016
  - CO017
  tableRefs:
  - TO003
- id: scale-signals-and-enterprise-readiness
  title: Scale signals, customer proof, and enterprise-readiness posture
  body: 'Basis discloses more about traction quality than about absolute scale. The strongest current signal is not a raw customer count but penetration into large firms: Basis says it works with about 30% of the Top 25 accounting firms, while its own careers page claims the company is deployed with top firms and operates hundreds of agents behind every accountant. Public proof points are also stronger than generic logo lists. Wiss disclosed a beta starting in November 2023 and a wider CAS rollout in September 2024, and Basis announced a 2026 collaboration with Baker Tilly aimed at automation across thousands of accounting clients. Product breadth has also moved beyond early CAS positioning; by 2026 public materials describe deployments across CAS, tax, and audit, including a showcased end-to-end 1065 tax workflow. Security posture is another current signal. Basis says it is SOC 2 Type II, ISO 27001, and ISO 42001 certified, keeps data in the United States, avoids model training on customer
    data, and provides audit trails for agent actions. The major caveat is disclosure opacity: no retained source supports current ARR, revenue, exact headcount, or precise office footprint, and the security page still listed GDPR and CCPA as coming soon.'
