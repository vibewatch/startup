  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing
      missingEvidence: Realized ACVs, discount bands, minimum contract sizes, and billing units by firm segment.
      whyItMatters: >-
        Without realized pricing data, adoption proof cannot be translated into recurring revenue
        quality or sales efficiency.
      diligencePath: Request price book, sample order forms, and closed-won ACV distribution by customer size.
      relatedQuestionRefs:
        - QI028
      relatedTableRefs:
        - TI002
    - type: private-evidence-only
      severity: blocking
      topic: revenue-metrics
      missingEvidence: Current ARR, revenue run-rate, gross margin, and stream-level revenue mix.
      whyItMatters: >-
        These are the minimum metrics required to underwrite valuation, margin path, and durability
        of the business model.
      diligencePath: >-
        Request monthly management P&L and quarterly ARR bridge segmented by software, support, and
        services.
      relatedQuestionRefs:
        - QI026
      relatedTableRefs:
        - TI003
        - TI005
    - type: private-evidence-only
      severity: material
      topic: retention-concentration
      missingEvidence: Net retention, gross retention, logo concentration, and top-customer revenue exposure.
      whyItMatters: >-
        Enterprise adoption anecdotes do not prove durable recurring revenue or diversified customer
        economics.
      diligencePath: >-
        Request cohort retention tables, top-10 customer list with revenue share, and renewal /
        churn schedule.
      relatedQuestionRefs:
        - QI012
      relatedTableRefs:
        - TI005
    - type: missing-source
      severity: material
      topic: burn-runway
      missingEvidence: Current cash balance, monthly burn, and management runway forecast.
      whyItMatters: Scenario estimates are not sufficient for assessing insolvency risk or next-round timing.
      diligencePath: Request trailing 12 months of cash flow and the current operating-plan runway model.
      relatedQuestionRefs:
        - QI017
      relatedTableRefs:
        - TI004
    - type: private-evidence-only
      severity: material
      topic: services-mix
      missingEvidence: >-
        Share of revenue and delivery cost attributable to onboarding, configuration, support, and
        professional services.
      whyItMatters: >-
        Software-like margins cannot be assumed if service-heavy deployments are a material part of
        the model.
      diligencePath: >-
        Request revenue mix by stream and gross margin bridge separating software from services and
        support.
      relatedQuestionRefs:
        - QI029
      relatedTableRefs:
        - TI001
        - TI003
