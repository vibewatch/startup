company:
  name: Basis
chapter:
  number: 4
  title: Financials
  summary: >-
    Basis's public financial story is strong on funding and enterprise-demand proxies but weak on
    underwriteable operating metrics. Public evidence supports a quote-based enterprise
    workflow-automation model, meaningful compliance and support costs, and near-term capital
    adequacy from the $100 million Series B, but it does not disclose ARR, cash, gross margin,
    retention, or customer concentration.
sections:
  - id: revenue-model-and-pricing
    title: Revenue Model and Pricing Architecture
    body: >-
      Basis’s public financial surface looks like enterprise software sold into accounting firms,
      not consumer SaaS. The home page shows practice-area modules across CAS, tax, audit, and
      advisory, but no checkout flow or price table; the legal pages repeatedly route commercial use
      through written MSAs, order forms, and separate enterprise agreements. That combination
      implies quote-based contracts, negotiated scope, and workflow-specific deployment rather than
      transparent seat-based self-service pricing.


      Because Basis sells automation into high-stakes accounting work, the likely revenue model
      blends recurring platform fees with onboarding, workflow configuration, support, and perhaps
      partner-specific deployment work. Home-page testimonials span multiple firms and practice
      areas, while Wiss and OpenAI describe multi-step workflows, human review, and measurable
      capacity gains. Public evidence is strong enough to say Basis monetizes enterprise workflow
      automation for accounting firms. It is not strong enough to disclose realized ACVs, discount
      bands, minimum contract sizes, or the split between software and services.
    claimRefs:
      - CI002
      - CI010
      - CI011
      - CI012
      - CI013
      - CI017
      - CI020
      - CI022
      - CI033
      - CI045
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: gtm-proxies-and-revenue-quality
    title: Go-to-Market Proxies and Revenue Quality
    body: >-
      Public demand proxies are real but selective. Basis and third parties repeatedly state the
      company works with roughly 30% of the top 25 accounting firms, and Wiss says a beta in CAS
      expanded to full deployment with internal adoption rising month over month. Baker Tilly’s 2026
      collaboration adds another scaled buyer using Basis for transaction processing, journal entry
      support, reconciliations, and post-close reporting. The home page also features testimonials
      from Wiss, UHY, Clark Nuber, Boulay, and BPB, which is unusually concrete customer proof for
      an early vertical-AI vendor.


      What is missing is the part investors actually underwrite: contract duration, net revenue
      retention, win rates, sales cycle length, realized pricing, and customer concentration.
      OpenAI’s case study says firms report up to 30% time savings on average, and company-linked
      funding coverage cites 20% to 50% efficiency gains, so Basis is clearly selling on capacity
      expansion and faster review cycles. But those ROI signals are still company-channeled or
      partner-quoted, not audited revenue data. The GTM story is credible enterprise adoption; the
      revenue-quality story remains unproven.
    claimRefs:
      - CI003
      - CI016
      - CI017
      - CI018
      - CI019
      - CI020
      - CI024
      - CI033
      - CI034
      - CI037
      - CI038
    tableRefs:
      - TI003
    figureRefs:
      - FI002
  - id: cost-structure-and-unit-economics
    title: Cost Structure and Unit Economics
    body: >-
      Basis does not look like a low-support wrapper around a generic model. The security page
      advertises SOC 2 Type II, ISO 27001, ISO 42001, U.S.-only hosting, MFA, audit logs, backups,
      and third-party testing. The legal terms add that AI outputs are not a substitute for
      professional judgment and require human review and verification. Those commitments are
      commercially helpful in accounting, but they also imply fixed compliance, infrastructure, and
      customer-success costs before each additional dollar of gross profit.


      Public comparables reinforce that likely mix. Workiva’s 2025 10-K says 92% of revenue came
      from subscription and support fees, with the remainder from professional services, and warns
      services mix can affect gross margins. BILL’s 2025 10-K notes some annual subscriptions but
      also open-ended arrangements, pricing sensitivity, and selling costs, while reporting 81.7%
      GAAP and 85.0% non-GAAP gross margin at scale. Basis may eventually resemble high-margin
      software, but the public record today supports a nearer-term model of enterprise software plus
      onboarding, partner rollout, and model-vendor expense rather than pure software economics
      already achieved.
    claimRefs:
      - CI014
      - CI015
      - CI021
      - CI023
      - CI025
      - CI028
      - CI030
      - CI031
      - CI032
      - CI035
      - CI036
      - CI047
      - CI049
    tableRefs: []
    figureRefs:
      - FI004
  - id: capital-adequacy-and-financing-dependency
    title: Capital Adequacy and Financing Dependency
    body: >-
      Basis has raised disclosed equity in three steps: a $3.6 million seed, a $34 million Series A,
      and a $100 million Series B at a $1.15 billion valuation. That is roughly $137.6 million of
      disclosed equity financing since formation, and no retrieved source describes venture debt,
      project finance, or other leverage. Relative to most vertical-AI startups, that is a strong
      capital base. The Series B use of proceeds — accelerating platform development and expanding
      engineering and machine learning teams — also reads as offensive investment rather than rescue
      financing.


      The limitation is that funding does not equal cash. Basis discloses no cash balance, burn, or
      revenue contribution, so runway can only be illustrated, not known. A simple scenario using
      only the fresh $100 million round implies about 18 to 33 months of runway if monthly burn
      falls around $3.0 million to $5.5 million; actual runway could be longer if prior capital
      remains or if recurring revenue offsets spend. Even so, financing dependency is not gone.
      Basis is scaling a security-heavy, model-dependent, enterprise deployment business, and the
      next financing trigger will likely depend on whether adoption headlines convert into realized
      pricing, gross margin after support, and repeatable expansion within large firms.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI008
      - CI009
      - CI039
      - CI040
      - CI041
      - CI042
      - CI046
    tableRefs:
      - TI004
    figureRefs:
      - FI003
  - id: financial-verdict-and-public-gaps
    title: Financial Verdict and Public Gaps
    body: >-
      The public bull case is straightforward: Basis has real enterprise-style proof points, rapid
      funding velocity, credible investors, a compliance posture that matches buyer requirements,
      and multiple customer and partner sources pointing to labor-saving ROI. The company appears to
      be selling into a real pain point as the accounting labor market stays tight and AI adoption
      in professional services moves from experimentation to strategic deployment.


      The public bear case is just as straightforward: there is still no disclosed revenue, ARR,
      cash balance, gross margin, CAC, renewal, or concentration data. Journal of Accountancy and
      NIST both underscore why that matters: hallucinations, prompt injection, privacy, and
      oversight failures are live risks in accounting workflows, and model or vendor promises can
      outrun operational proof. The honest financial verdict is therefore positive on category
      demand and near-term capital adequacy, but inconclusive on revenue quality and margin
      durability. A serious underwriting process would need pricing realization,
      software-versus-services mix, retention, and monthly financial statements before treating
      Basis as financially de-risked rather than commercially promising.
    claimRefs:
      - CI021
      - CI025
      - CI026
      - CI027
      - CI034
      - CI038
      - CI043
      - CI044
      - CI048
      - CI049
    tableRefs:
      - TI005
    figureRefs: []
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit / contract
      - Current public status
      - Revenue quality
      - Diligence ask
    rows:
      - - Enterprise platform subscription
        - Quoted platform access for accounting-firm workflows across CAS, tax, audit, and advisory
        - MSA / order form; likely annual or multi-year
        - Core commercial surface is visible, but no public price card
        - Potentially recurring and high quality if renewals are strong
        - Request signed order forms, billing cadence, and renewal terms
      - - Practice-area expansion
        - Additional deployments within firm departments or new workflows
        - Department / workflow expansion
        - Supported by Wiss full CAS rollout and multi-practice positioning
        - High if standardized; lower if each expansion is custom-scoped
        - Break out expansion ARR versus implementation revenue
      - - Implementation and configuration
        - Workflow setup, firm-specific standards, integration, and onboarding
        - Project or fixed-fee services
        - Implied by enterprise agreements and deployment-heavy customer proof
        - Margin-dilutive if material
        - Provide services SOWs, implementation timelines, and attach rate
      - - Ongoing support and governance
        - Human-review workflows, auditability, compliance documentation, customer success
        - Bundled or separately priced support
        - Operationally necessary but not priced publicly
        - Could be sticky if embedded; could compress margins if labor-heavy
        - Disclose support staffing, included service levels, and escalation economics
      - - Partner / managed-services channel
        - Revenue sourced through accounting and advisory firms embedding Basis in client delivery
        - Channel or reseller-like economics
        - Wiss and Baker Tilly show channel-style distribution potential
        - Good distribution leverage if partners self-serve; lower quality if Basis stays hands-on
        - Disclose partner economics, revenue share, and channel share of ARR
    notes: >-
      Rows summarize the public monetization surface; undisclosed commercial terms are not zero and
      require diligence follow-up.
    claimRefs:
      - CI002
      - CI013
      - CI017
      - CI020
      - CI022
      - CI033
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Price / contract element
      - Public value / status
      - List vs. realized
      - Why it matters
      - Diligence ask
    rows:
      - - List price
        - null
        - No public list pricing on the website
        - Without a price anchor, outsiders cannot test deal size or adoption friction
        - Request current pricing sheet or enterprise quote examples
      - - Contract vehicle
        - Written MSA / order form governs service access
        - Realized terms are negotiated, not self-serve
        - Indicates enterprise contracting and room for custom scope or discounting
        - Provide template MSA, order form, and payment terms
      - - Pilot / beta terms
        - null
        - Wiss references beta-to-full deployment but no public pilot economics
        - Pilot structure determines CAC, conversion, and services burden
        - Disclose pilot duration, conversion rate, and whether pilots are paid
      - - Realized ACV / discount bands
        - null
        - No public ACV, minimums, or discount guidance
        - Needed to connect adoption proof to recurring revenue scale
        - Provide ACV distribution by firm size and discount approval policy
      - - Billing basis
        - Likely quoted by firm scope, workflow, or practice area
        - Inferred from enterprise deployment evidence, not disclosed directly
        - Determines whether growth comes from seats, workflows, or broader firm adoption
        - Clarify primary billing unit and upsell path
    notes: >-
      Null means undisclosed; contract structure is visible, but realized pricing and discounts are
      not public.
    claimRefs:
      - CI010
      - CI011
      - CI012
      - CI020
      - CI045
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value / proxy
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Revenue / ARR
        - null
        - low
        - No top-line anchor means valuation and payback cannot be underwritten
        - Provide quarterly ARR and revenue bridge by stream
      - - Gross margin
        - null
        - low
        - Basis has not disclosed gross margin; margin path is the core underwriting question
        - Disclose gross margin for software, support, and services separately
      - - CAC / payback
        - null
        - low
        - Enterprise direct-plus-partner selling likely carries meaningful sales and onboarding cost
        - Provide CAC, sales cycle, win rate, and payback by segment
      - - Retention / NRR
        - null
        - low
        - Firmwide deployments may be sticky, but there is no public cohort proof
        - Provide gross retention, NRR, and expansion by customer cohort
      - - ROI proxy
        - 20%–50% efficiency claims; up to 30% time savings in partner / company-backed sources
        - medium
        - >-
          Demand may be real if ROI is repeatable, but productivity proof is not the same as
          monetization proof
        - Share measured ROI studies tied to contracted customers
      - - Software vs. services mix
        - >-
          Comparable filings suggest enterprise platforms often pair subscription revenue with
          professional services
        - medium
        - Services-heavy mix can delay software-like gross margins
        - Disclose recurring software share, implementation share, and support cost load
    notes: >-
      Public unit-economics disclosure is mostly absent, so the table separates observable proxies
      from missing private metrics.
    claimRefs:
      - CI018
      - CI021
      - CI028
      - CI030
      - CI031
      - CI037
      - CI038
  - id: TI004
    title: Capital adequacy table
    columns:
      - Item
      - Public value / status
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Disclosed equity raised
        - $137.6M cumulative ($3.6M seed + $34M Series A + $100M Series B)
        - medium
        - Sets the outer bound of disclosed external capital since inception
        - Reconcile round proceeds received net of fees and any secondary component
      - - Latest financing
        - $100M Series B at $1.15B valuation (Feb. 2026)
        - high
        - Fresh capital lowers near-term insolvency risk and funds continued product scaling
        - Provide cap table, investor rights, and any tranche conditions
      - - Cash on hand
        - null
        - low
        - Funding raised is not the same as current liquidity
        - Provide current cash balance and monthly cash flow
      - - Illustrative monthly burn
        - $3.0M–$5.5M per month (estimated)
        - low
        - Needed to translate the round into runway; estimate is scenario-based, not disclosed
        - Provide monthly opex and cash burn for the last 12 months
      - - Illustrative runway from Series B only
        - 18–33 months (estimated)
        - low
        - Shows near-term capital adequacy sensitivity to burn assumptions
        - Confirm runway under base and downside operating plan
      - - Debt / project finance obligations
        - None publicly disclosed
        - low
        - Absence of visible leverage reduces complexity but is not proof of no obligations
        - Provide debt schedule, leases, and any off-balance-sheet commitments
    notes: >-
      Burn and runway are scenario estimates based on the disclosed Series B only; current cash,
      revenue contribution, and prior cash retention are not public.
    claimRefs:
      - CI005
      - CI006
      - CI007
      - CI009
      - CI039
      - CI040
      - CI041
      - CI042
      - CI046
  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing private metric
      - Impact on analysis
      - Exact diligence path
    rows:
      - - Current ARR / revenue run-rate
        - Without top-line scale, valuation and efficiency cannot be benchmarked
        - Request monthly revenue bridge and last eight quarters of ARR history
      - - Gross margin and software-versus-services split
        - Margin durability is unknowable while implementation and support burden remain opaque
        - Provide P&L by software, support, and professional services
      - - Cash balance and monthly burn
        - Runway cannot be underwritten from fundraising headlines alone
        - Provide current cash, trailing 12-month burn, and 18-month operating plan
      - - Retention, expansion, and concentration
        - Revenue quality cannot be judged without cohort data and top-customer exposure
        - Provide gross retention, NRR, cohort expansion, and top-10 customer concentration
      - - Realized pricing and discounting
        - No way to translate adoption proof into recurring contract economics
        - >-
          Provide price book, ACV distribution, discount approvals, and pilot-to-production
          conversion data
    notes: >-
      These gaps are the minimum financial disclosures needed to convert Basis from a narrative
      story into an underwriteable one.
    claimRefs:
      - CI021
      - CI034
      - CI038
      - CI041
      - CI043
      - CI044
      - CI048
      - CI049
