        - 要求按业务领域拆分 ARR 和活跃工作流。
      - - 单一客户内的工作流宽度
        - 如果客户只买一个工作流而不买其他工作流，使用可能仍很窄。
        - 即便初始大客户标识很强，也可能限制 NRR。
        - Wiss 和 Baker Tilly 暗示存在多条工作流，但公开材料对广度的量化仍很薄。
        - 要求提供头部客户逐工作流采用历史。
      - - Top-25 事务所渗透
        - 大型事务所标识占比高，也可能意味着收入集中。
        - 少数大账户可能主导收入和续约风险。
        - Series B 材料反复提到前 25 大事务所中约 30% 使用。
        - 要求按 ARR 和任务量披露前 10 大客户集中度。
      - - 高质量背书集中
        - 最强公开证据集中在 Wiss、Baker Tilly 和 UHY。
        - 少数标识之外证据偏弱，可能夸大覆盖广度。
        - 首页推荐语集合比客户自有证据集合更宽。
        - 要求提供更多客户自有案例研究和背调电话。
      - - 留存不透明
        - 没有公开 GRR、NRR、流失或合同期限指标。
        - 仅靠公开证据无法承销持久性。
        - 公司、客户和行业媒体来源中都一致缺少这些指标。
        - 要求提供队列留存、续约日历，以及扩张 / 降级桥表。
    notes: 本表把增长机制和仍缺失的证据拆开；这些风险是商业未知项，不是采用失败的证据。
