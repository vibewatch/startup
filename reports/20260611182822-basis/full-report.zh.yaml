    rows:
      - - 前沿模型供应商
        - OpenAI / Anthropic / 超大规模云厂商级 LLM 生态
        - 企业 AI 工作流的核心推理和生成层
        - Basis 公开叙事提到 OpenAI 进展，而同业公开引用多家前沿模型供应商。
        - 模型定价、政策、延迟或访问变化削弱产品经济性或质量。
        - 高
        - 人工复核、可审计性，以及潜在多模型架构。
        - 公开材料未披露冗余架构。
      - - 云 / 安全基础设施
        - 托管、身份和备份栈
        - 存储并保护客户数据和工作流日志。
        - 仅美国托管和认证可见，但基础设施架构未公开。
        - 宕机、泄露或控制范围错配会伤害客户信任和续约。
        - 高
        - 加密、MFA、备份、事件响应和认证。
        - 详细架构和近期事件历史仍为私密信息。
      - - 会计事务所渠道集中
        - 具名大型事务所客户和合作关系
        - 需求证明、背书和扩张渠道
        - 公开证据集中在少数具名事务所，而不是披露出的广泛基盘。
        - 失去一个标杆客户或合作伙伴，会损害可信度和增长叙事。
        - 高
        - 多业务线产品宽度和更多事务所背书。
        - 公开材料未披露集中度和留存数据。
      - - 企业合同条款
        - 客户 MSA、订单、DPA 和保险结构
        - 分配责任、数据权利、复核义务和审计权。
        - 公开网站条款把平台细节交给私下书面协议。
        - 赔偿或责任条款弱于买方对受监管工作流的预期。
        - 高
        - 私下尽调中可用定制合同解决。
        - 看不到合同前，承销不能假设分配有利。
      - - NDA 下的合规文档
        - SOC 2 报告和其他合规文档
        - 买方尽调加速器和续约支持
        - 公开页面称这些材料只在 NDA 下或按请求提供。
        - 如果文档不完整或范围过窄，销售周期会变慢，尽调也可能失败。
        - 中高
        - 信任导向定位和可见认证。
        - 范围、例外和整改历史未公开。
    notes: 依赖项按其直接损害客户信任、工作流质量或企业成交率的程度排序。
