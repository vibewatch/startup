  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局类别，以及什么才算真正竞争对手
        blocks:
          - type: paragraph
            body: >-
              Basis 的竞争集合应按待完成任务拆分，而不是把任何提到 AI 的产品都算进去。Basis 营销的是可跨
              CAS、税务、审计和咨询执行会计流程的代理，然后把可复核输出交回给会计师。因此最接近的直接同业，是同样试图在事务所内部掌控会计流程执行的供应商，而不只是弹出聊天框或自动化一个子任务。基于保留的公开证据，Botkeeper、Truewind
              和 Digits 是最相关的直接比较对象，因为它们会计原生、理解流程，并销售给会计师或会计事务所。Pilot 在客户结果层面重叠，但模式更偏服务。Vic.ai 和 BILL 是更窄的 AP
              专家。QuickBooks 和 Microsoft 重要，是因为即便它们不是最深的会计原生系统，也可以通过现有软件预算和熟悉界面进入。这个类别拆分很重要，因为 Basis
              即便在流程深度上最好，也可能在买方更重视既有安装基础、较低公开价格或外包结果，而非一个新平台时，把预算输给现有厂商、替代方案或服务模式。
