      - number: '3.4'
        title: 定价、包装、分发与信任姿态
        blocks:
          - type: paragraph
            body: >-
              公开定价是竞争集合分化最清楚的地方之一。Botkeeper、Pilot 和 Digits 都发布了有意义的包装信息，让买方能快速对标入门成本：Botkeeper 发布按授权分层，Pilot 发布记账和 CFO
              计划，Digits 发布 SaaS 计划加合作伙伴提供的服务。Basis、Vic.ai 和 BILL 在保留证据中没有提供可比的公开价格表；Intuit 和 Microsoft
              则更强调捆绑和附加逻辑，而不是干净的一对一会计事务所合同。这有两层含义。第一，价格敏感或自助型买方拥有比 Basis 更透明的替代方案。第二，如果 Basis
              赢在流程深度或企业部署经济性，不透明定价仍可能合理，但这必须由私下证明，因为公开记录没有显示。信任姿态类似。Basis 控制很强，但 Botkeeper、Vic.ai、Digits 和 Microsoft
              也营销安全、隐私或合规保障。因此公开信任主张看起来像进入交易的前置条件，而不是独立护城河。分发验证可能更重要：来自 Wiss 的客户证据和通过 Baker Tilly 的合作伙伴杠杆显示，Basis
              可以超越孤立工具试点；而捆绑型现有厂商仍会威胁凭熟悉度和采购便利性胜出。
