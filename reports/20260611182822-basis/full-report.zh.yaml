chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部、阶段与产品范围
        blocks:
          - type: paragraph
            body: >-
              虽然 Basis 没有发布密集的公司事实表，但其公开身份相当一致。官网、关于页面和发布材料都把 Basis 描述为面向会计师的 AI 代理平台，而不是横向生产力
              copilot。隐私政策中可见的法律记录显示，运营实体是 Essex Labs, Inc.，以 Basis 名义开展业务。CPA Practice Advisor 和 Crowdfund Insider
              的公开融资报道把公司放在纽约市；官方网站本身没有披露地址或办公室列表，因此总部应视为外部报道口径，而非公司认证口径。最清晰的阶段标签是私营 Series B：Basis 在 2026 年 2 月公开宣布以
              $1.15 billion 估值完成 $100 million
              融资，保留来源集中没有任何信息显示其已上市或完成后续融资。对一家年轻公司来说，产品叙事也异常具体：代理要执行真实会计流程，再把完成的工作交回给会计师复核、判断和做客户咨询，而不是彻底替代这个职业。
