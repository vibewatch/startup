  - id: TR001
    title: 监管 / 法律风险登记表
    columns:
      - 风险
      - 当前公开证据
      - 可能性
      - 严重性
      - 缓释成熟度
      - 残余暴露
      - 尽调路径
    rows:
      - - AI 输出执业过失 / 疏忽暴露
        - Basis 称输出不是专业建议，必须经过复核；CPA 指引称盲目信赖可能产生责任。
        - 高
        - 关键
        - 中
        - 如果税务、审计或咨询工作出错，事务所仍承担复核责任。
        - 要求提供业务约定条款样本、QA 工作流控制、错误升级阈值和索赔历史。
      - - 纳税申报保密 / IRC 7216 误用
        - IRS 和 26 U.S.C. §7216 约束申报信息的披露或使用；CPA 指引指出，涉及 AI 时需要分析同意要求。
        - 中高
        - 关键
        - 中
        - 未经授权使用数据可能引发法律、声誉和客户流失后果。
        - 审查数据流图、同意措辞、留存做法和税务工作流隔离控制。
      - - PCAOB / 审计证据不足
        - PCAOB AS 1105 强调充分、适当证据和独立可靠性；如果 AI 在缺少控制的情况下转换证据，这两点可能被削弱。
        - 中
        - 高
        - 低中
        - 审计客户仍需要证明 AI 输出不会替代证据测试。
        - 要求提供审计工作流设计文档、证据血缘、覆盖日志和审计师接受案例。
      - - 网络安全 / 隐私治理缺口
        - Basis 宣传认证和保障措施，但企业隐私条款和详细合规附件未公开，GDPR/CCPA 仍标为即将推出。
        - 中
        - 高
        - 中
        - 信任姿态可见，但法律和运营完整性仍难从公开材料验证。
        - 要求提供最新 SOC 2 报告、ISO 范围声明、DPA、子处理方名单和事件预案。
      - - SOX / GAAP / 披露控制误用
        - 面向合规的现有厂商把 AI 用于披露、风险因素和 SOX 准备度营销，说明这些工作流对控制失效高度敏感。
        - 中
        - 高
        - 低中
        - 如果 Basis 用在财务报告上游，错误输出可能污染控制叙述或披露。
        - 要求提供客户批准的控制矩阵，以及在结账、报告或 SOX 场景中有边界使用的案例。
    notes: 各行按残余承销严重性排序；公开证据对规则存在性最强，对 Basis 专属合同分配最弱。
    enumerationScope:
      coverage: partial
      basis: >-
        Public sources cover the main legal and standards-based risk vectors for Basis as of 2026-06-11, but not private
        contracts, customer-specific jurisdictions, or nonpublic incidents.
