      - CU042
      - CU044
  - id: FU003
    title: 客户证据矩阵
    type: matrix
    layout: standard
    summary: Wiss 拥有最丰富的客户自有证据，Baker Tilly 给出最新的规模化采用信号，UHY 的公开运营结果最清晰；其余多是较薄的证言证据。
    data:
      columns:
        - 证据质量
        - 结果具体性
        - 部署成熟度
        - 留存可见性
      rows:
        - label: Wiss
          values:
            - 高 — 客户自有公告，加上后续动能发布
            - 中/高 — 全面部署，声称关账更快、效果更好
            - 高 — 从 beta 到全面 CAS 部署，并有更广扩张兴趣
            - 低 — 无续约或合同数据
        - label: Baker Tilly
          values:
            - 高 — 客户自有 2026 年公告
            - 中 — 详细列出工作流，但缺少量化 ROI
            - 中 — 评估后入选；实际使用广度未披露
            - 低 — 无留存或集中度数据
        - label: UHY
          values:
            - 中 — Basis 自有页面有强引用，加上 UHY CAS 上下文
            - 高 — 月结时间显著缩短，并赞扬上线体验
            - 中 — 读起来像生产使用，但开始日期和广度未披露
            - 低 — 无流失、续约或支出数据
        - label: Clark Nuber / Boulay / BPB
          values:
            - 低/中 — 仅在 Basis 自有页面有证言
            - 中 — 有工作流和价值表述，但没有分母
            - 中 — 语气像生产使用，佐证较薄
            - 低 — 无耐久性披露
        - label: Top-25 渗透声明
          values:
            - 中 — 多个来源重复提及
            - 低 — 只有渗透率标题，没有客户名单或收入拆分
            - 中 — 暗示在大型事务所中规模化采用
            - 低 — 集中度经济性未知
    claimRefs:
      - CU002
      - CU005
      - CU007
      - CU009
      - CU012
      - CU014
      - CU015
      - CU016
      - CU038
      - CU044
  - id: FU004
    title: 扩张与集中度传导图
    type: dag
    layout: standard
    summary: Basis 似乎从 CAS 滩头扩张到相邻业务领域；但大型事务所 logo 质量既支撑上行，也因流失和续约数据未披露而放大集中度风险的重要性。
    data:
      nodes:
        - id: cas-beachhead
          label: CAS 滩头
          description: Basis 从 CAS 起步，因为这些工作流重复、会计原生，而且运营上很紧迫。
        - id: named-production
          label: 具名生产使用胜利
          description: Wiss、Baker Tilly 和 UHY 提供了最清晰的公开证据，证明 Basis 用在真实事务所工作流中，而不只是演示。
        - id: workflow-expansion
          label: 工作流扩张
          description: 事务所可以把使用范围从关账和记账任务扩到交易处理、报告、税务和审计支持。
        - id: top25-penetration
          label: Top-25 logo 渗透
          description: 2026 年多篇报道反复称，Basis 覆盖美国前 25 大会计师事务所约 30%。
        - id: concentration-risk
          label: 集中度风险
          description: 如果少数 logo 贡献了过高收入份额，大型事务所渗透可能意味着 ARR 高度集中。
        - id: retention-opacity
          label: 留存不透明
          description: 没有公开 GRR、NRR、流失或续约时间表可证明这些 logo 内的耐久性。
      edges:
        - from: cas-beachhead
          to: named-production
          label: 第一楔子
        - from: named-production
          to: workflow-expansion
          label: 信任建立
        - from: workflow-expansion
          to: top25-penetration
          label: 更广事务所铺开
        - from: top25-penetration
          to: concentration-risk
          label: logo 可能聚集
        - from: top25-penetration
          to: retention-opacity
          label: 经济性仍未披露
        - from: concentration-risk
          to: retention-opacity
          label: 下行难以承保
    claimRefs:
      - CU005
      - CU006
      - CU009
      - CU020
      - CU021
      - CU022
      - CU036
      - CU037
      - CU042
      - CU043
      - CU044
      - CU049
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: standard
    summary: 按发生可能性、影响、缓释成熟度和剩余严重性，序数化呈现 Basis 当前最重要的风险领域。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: AI 准确性 / 幻觉责任
          values:
            - 高
            - 严重
            - 中
            - 高
        - label: 税务 / 审计标准合规
          values:
            - 中高
            - 严重
            - 中低
            - 高
        - label: 安全 / 保密性泄露
          values:
            - 中
            - 严重
            - 中
            - 中高
        - label: 模型 / 合作伙伴依赖
          values:
            - 中高
            - 高
            - 中低
            - 高
        - label: 竞争 / 集中度 / 承保能力缺口
          values:
            - 高
            - 高
            - 低
            - 高
    approximationNotes: 评级是基于已审阅 2026 年来源集综合出的承保判断，不是概率预测。
    claimRefs:
      - CR023
      - CR027
      - CR034
      - CR036
      - CR042
      - CR045
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 输出质量、监管和合同责任分配风险如何传导为客户流失和承保失败。
    data:
      nodes:
        - id: R1
          label: 幻觉或不完整输出
          detail: 税务、审计或咨询工作流产出看似合理但错误的分析。
          tone: risk
        - id: R2
          label: 人工复核漏掉缺陷
          detail: CPA 或复核者在验证不足时接受输出。
          tone: risk
        - id: R3
          label: 错误申报或客户交付物
          detail: 错误进入税表、审计工作底稿、关账备忘录或咨询输出。
          tone: risk
        - id: R4
          label: 职业责任事件
          detail: 客户补救成本、过失索赔或监管关注。
          tone: risk
        - id: R5
          label: 客户信任流失
          detail: 续约、背书或扩张意愿转弱。
          tone: risk
        - id: R6
          label: 合同责任分配争议
          detail: 供应商与客户围绕赔偿、责任上限和审查义务争执。
          tone: risk
        - id: R7
          label: 企业成交周期变慢
          detail: 买方要求更多安全、质量和治理证据。
          tone: risk
        - id: R8
          label: 增长 / 估值支撑下降
          detail: 商业摩擦压缩上行空间和融资质量。
          tone: risk
        - id: R9
          label: 可见缓释措施
          detail: 认证、审计日志、不用于训练立场和人工审查规则能降低风险，但抹不掉风险。
          tone: positive
      edges:
        - from: R1
          to: R2
          label: 需审查环节失灵
        - from: R2
          to: R3
          label: 允许
        - from: R3
          to: R4
          label: 可能触发
        - from: R4
          to: R5
          label: 损害
        - from: R4
          to: R6
          label: 暴露
        - from: R5
          to: R7
          label: 拉长
        - from: R6
          to: R7
          label: 复杂化
        - from: R7
          to: R8
          label: 施压
        - from: R9
          to: R2
          label: 部分降低
        - from: R9
          to: R7
          label: 部分抵消
    claimRefs:
      - CR006
      - CR007
      - CR017
      - CR020
      - CR041
      - CR042
      - CR044
      - CR045
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: 塑造 Basis 剩余风险的主要外部依赖和竞争压力。
    data:
      nodes:
        - id: D1
          label: Basis 平台
          detail: 面向 CAS、税务、审计和咨询的多业务线 AI 平台。
          tone: neutral
        - id: D2
          label: 前沿模型提供商
          detail: LLM 层的经济性、访问权限和政策环境。
          tone: risk
        - id: D3
          label: 云和安全栈
          detail: 托管、身份、加密、日志和备份基础设施。
          tone: risk
        - id: D4
          label: 企业合同
          detail: MSA、DPA、赔偿、审计权条款。
          tone: risk
        - id: D5
          label: 头部会计师事务所客户
          detail: 可见的证明集和客户背书渠道。
          tone: positive
        - id: D6
          label: Workiva
          detail: 面向财务报告、审计、风险和 SOX 的 AI 在位者。
          tone: risk
        - id: D7
          label: Thomson Reuters
          detail: 有引用支撑的 CoCounsel 和 ONESOURCE 合规生态。
          tone: risk
        - id: D8
          label: Intuit / QuickBooks
          detail: 分销能力强的 SMB 和税务生态，内嵌 genAI。
          tone: risk
        - id: D9
          label: 监管机构和标准组织
          detail: IRS、PCAOB、SEC、FTC 和 NIST 塑造可接受的工作流设计。
          tone: risk
