      - number: '4.5'
        title: 财务结论与公开缺口
        blocks:
          - type: paragraph
            body: >-
              公开多头论点很直接：Basis 有真实的企业级验证点、快速融资速度、可信投资人、匹配买方要求的合规姿态，以及多项客户和伙伴来源指向节省劳动力的 ROI。随着会计劳动力市场保持紧张，专业服务中的 AI
              采用从试验走向战略部署，公司看起来正卖进一个真实痛点。


              公开空头论点也同样直接：收入、ARR、现金余额、毛利率、CAC、续约或集中度数据仍未披露。Journal of Accountancy 和 NIST 都强调了这件事为什么重要：幻觉、prompt
              injection、隐私和监督失败是会计流程中的现实风险，模型或供应商承诺可能跑在运营验证前面。因此诚实的财务结论是：品类需求和近期资本充足性偏正面，但收入质量和利润率耐久性仍无定论。严肃承销流程需要实际定价、软件与服务组合、留存和月度财务报表，之后才能把
              Basis 视为财务风险已被化解，而不仅是商业前景可观。
