      - number: '7.5'
        title: 承保卡点、缓释成熟度与投资逻辑击穿触发器
        blocks:
          - type: paragraph
            body: >-
              公开证据并不说明 Basis
              不能投；它说明若要给出干净的风险折扣，材料还不够。公开记录支持真实的缓释因素——安全认证、不训练客户数据的主张、审计日志、人工复核要求、大型事务所客户证据，以及足够重要的产品覆盖面。但公开记录也留下多个未解卡点。没有公开证据显示税务和审计任务中的实测生产准确率、错误严重度、异常处理或返工；没有公开客户集中度或留存数据；没有公开
              DPA、安全附件或赔偿排期来说明 AI 生成工作流导致错误申报或客户损失时责任落在哪里；也没有清晰的公开图谱说明模型提供商集中度或韧性。这些不是装饰性尽调问题。如果 Basis
              不能证明低逃逸率、强覆盖控制、私有合同风险分配和多元化模型治理，那么正确做法就是把公司按高风险赋能型供应商承保，而不是按已经验证、关键任务级的会计基础设施承保。可度量的否决触发器很直接：重大安全事件、负面监管结论、流失标杆客户、无法维持认证，或无法证明税务和审计工作流的输出质量。
