      - number: '2.4'
        title: 按事务所规模划分的买方分层与竞争动态
        blocks:
          - type: paragraph
            body: >-
              Basis 最好的公开适配对象是较大型公共会计事务所，尤其是业务量和流程标准化足以支撑多业务自动化的事务所。Basis 自身的公开足迹加上 Wiss 推广都支撑这一点。产品被放在
              CAS、税务、审计和咨询之间，最强的公开客户标识验证也不是很小的本地事务所，而是一个 Top 100 风格的买方把产品用作力量倍增器。这很重要，因为采用路径会随事务所规模急剧变化。全国性和 Top 100
              区域事务所可以用创新、CIO 或业务转型预算资助试验；它们也有足够的流程重复，让 AI 产生可见杠杆。中型市场事务所仍可能采用，但价格敏感度更高，也更可能把 Basis
              与现有技术栈扩展或技术赋能服务替代方案比较。


              竞争压力已经很宽。Intuit 正围绕 AI 驱动流程和统一数据为事务所重新包装 QuickBooks；Sage 和 Xero 把自己定位为面向会计师的云系统；Botkeeper 和 Pilot
              销售人机结合的运营模式；Numeric 和 Digits 以明确的自动化主张攻击结账和总账流程。因此市场并没有等 Basis 来定义品类。Basis
              的优势在于，它把垂直、端到端流程执行卖进会计事务所场景，在那里人才稀缺、质量门槛和事务所经济模型相互碰撞。它的风险在于，现有厂商掌握既有流程表面，更窄的供应商可能给出更清晰的 ROI 或更容易的实施。公开证据支持
              Basis 在头部事务所形成强早期楔子，但还不能证明该品类已经被其普遍赢下。
