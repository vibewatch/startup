  - id: TU005
    title: 部署摩擦 / 控制表
    columns:
      - 摩擦 / 控制领域
      - 公开证据
      - 对客户为何重要
      - 当前判断
      - 尽调要求
    rows:
      - - 隐私和客户数据处理
        - Basis 称不训练模型、完整数据隔离，并提供单独企业协议；Thomson Reuters 和 ACCA 称隐私是头号关切
        - 会计事务所处理高度敏感的客户数据，如果使用条款不清楚，会阻止部署
        - 控制姿态方向上不错，但买家仍需做合同和运营验证
        - 要求提供 DPA / MSA 隐私条款、模型提供商清单和客户数据流图
      - - 可审计性和人工复核
        - Basis 强调动作可追溯、理由透明；Annette Garcia 称会计师需要一致性和可审阅性
        - 客户需要输出经得起后续复核，也符合专业标准
        - 这看起来既是核心产品强项，也是核心采购要求
        - 要求提供审计轨迹样本、复核人看板，以及异常处理工作流。
      - - 集成复杂度
        - Thomson Reuters 和 IBM 称，系统割裂和工作流集成是主要障碍。
        - 多系统会计环境可能拉长见效时间，并推高服务成本。
        - 即便客户愿意购买，这也很可能是真实的部署负担。
        - 要求提供实施计划、系统前置条件和平均上线周期。
      - - 培训和变更管理
        - CPA Practice Advisor、Thomson Reuters、ACCA 和 IBM 都强调技能缺口和人员提升。
        - 培训薄弱会拖慢采用，也限制账户内扩张。
        - 这很可能是持续工作，不是一次性上线步骤。
        - 要求提供客户赋能计划、管理员培训小时数和采用手册。
      - - 客户信任和预期
        - JOA、ACCA 和 Thomson Reuters 都警示幻觉、黑箱信任和披露预期。
        - 即便事务所购买产品，面向客户的使用仍可能受信任和专业风险约束。
        - 平台看起来围绕这一反对意见设计，但公开证据仍主要停留在叙述层面。
        - 要求提供客户披露措辞、QA 控制，以及被拒绝或升级输出的案例。
    notes: 各行把产品主张与独立反向证据放在一起；这是一张部署风险表，不是失败记录。
