        - 上市金融科技 / 会计基础设施
        - FY2025 收入约 $1.46B；GAAP 毛利率 81.4%
        - 约 2.08x P/S；约 1.84x EV/revenue
        - 财务自动化经济性的上市低端可比公司
        - 收入结构含支付和交易收入，不只是 SaaS
      - - Workiva
        - 上市报告 / 审计软件
        - 2024 年收入约 $738.7M；订阅 / 支持约占 90%
        - 约 3.03x P/S；约 2.91x EV/revenue
        - 可比照审计就绪报告和披露工作流
        - 规模更大、更成熟，且面向上市公司
      - - BlackLine
        - 上市会计自动化
        - 2024 年 GAAP 毛利率 75.2%
        - 约 2.59x P/S；约 2.49x EV/revenue
        - 最接近结账和会计自动化的上市可比公司
        - 比 Basis 更成熟，但 AI 原生属性较弱
      - - Intuit
        - 上市在位平台
        - 大型在位者，覆盖广泛 SMB 会计场景
        - 约 3.80x P/S；约 3.64x EV/revenue
        - 可信财务软件的高端在位者倍数参照
        - 税务和 SMB 生态更宽，直接可比性并不完美
    notes: 私营公司行使用已审阅来源实际披露的标记：有估值就用估值，否则用轮次规模和规模信号。上市公司行把监管文件与当前市场数据页面配对，让可比集同时锚定基本面和当前定价。
    enumerationScope:
