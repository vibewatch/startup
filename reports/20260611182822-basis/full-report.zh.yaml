      - number: '2.2'
        title: TAM、SAM 与受证据约束的规模测算
        blocks:
          - type: paragraph
            body: >-
              最宽且可支撑的 TAM 口径是美国会计服务收入。IBISWorld 把 2026 年美国市场规模定为 $157.4 billion，AnythingResearch 则显示 2025 年为 $145.4
              billion，前四大份额为 42.8%。这些数字方向一致——Basis 所处的是一个很大的服务池——但它们并不直接等同于软件支出，也不等同于 Basis 可变现的表面。在软件侧，The Business
              Research Company、Mordor Intelligence 和 Precedence 都把 2025-2026 年全球会计软件市场放在约 $21 billion 到 $23
              billion，披露区域份额的来源显示北美约占 38%。这意味着，在调整 Basis 面向会计事务所而非所有企业财务用户之前，北美软件支出的外沿大约是 $8 billion 到 $9 billion。


              “跨 CAS、税务和审计销售给会计事务所的 AI 自动化”的精确 SAM 未公开披露。最好的公开方法是把北美会计软件作为上限，再按买方类型收窄。Intuit、Sage 和 Xero
              都已经卖给会计师；Botkeeper、Pilot、Numeric 和 Digits 则说明，买方可以通过记账自动化、技术赋能服务、结账软件或 AI 原生总账来解决同一痛点。因此 Basis 的近期
              SAM，是愿意在多项业务中采用垂直、可复核 AI 的大型美国会计事务所子集。公开来看，最强的 SOM 代理不是收入份额，而是切入约 30% 的 Top 25
              会计事务所。这是楔入强度的有意义证据，但若没有定价、席位数或 ACV 披露，还不足以计算精确收入份额。
