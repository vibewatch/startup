  - id: TR002
    title: 运营 / 质量 / 安全风险登记表
    columns:
      - 失效模式
      - 重要性
      - 可能性
      - 严重性
      - 当前缓释
      - 残余暴露
      - 未解决缺口
    rows:
      - - 幻觉或不完整的会计输出
        - 税务、审计和 GAAP 任务高度依赖上下文，一个看似合理的答案也可能变成专业责任事件。
        - 高
        - 关键
        - 人工复核、明确的输出免责声明，以及带引用的工作流步骤。
        - 公开材料仍看不到错误逃逸率。
        - 没有按工作流披露任务准确率、异常率或返工的公开基准。
      - - 机密客户或纳税人数据处理不当
        - CPA 事务所和税务申报服务商处理高度敏感的财务和个人信息。
        - 中高
        - 关键
        - 不用于训练声明、仅美国托管、MFA、加密和租户隔离。
        - 客户仍必须验证数据流、留存和同意控制。
        - 没有公开的企业 DPA 或工作流级留存披露。
      - - 认证之下的安全控制漂移
        - 认证证明流程成熟度，但承销人更关心控制运行、范围和事件历史。
        - 中
        - 高
        - SOC 2 Type II、ISO 27001、ISO 42001、备份和事件响应声明。
        - 公开材料仍停留在摘要层面，且部分受 NDA 限制。
        - SOC 2 报告、ISO 适用性声明和近期渗透测试摘要未公开。
      - - 提示注入 / 影子 AI / 用户绕行
        - 客户文件和员工行为可能引入隐藏指令，或绕过获批工作流。
        - 中
        - 高
        - 审计日志和基于角色的访问控制有帮助，专业指引也建议采用限制性政策。
        - 人为错误仍是活的控制弱点。
        - 没有沙盒、内容过滤或工作流隔离指标的公开证据。
      - - 规模扩张中认证或隐私承诺缺口扩大
        - 进入更多事务所和更多工作流，可能跑在隐私、区域或行业控制承诺前面。
        - 中
        - 中高
        - 可见的信任定位和标准对齐。
        - 公开信号仍显示隐私 / 合规里程碑尚未完成。
        - GDPR/CCPA 时间表和扩大的监管 / 客户要求仍不清楚。
      - - 声明或营销跑在实测表现前面
        - FTC AI 执法显示，证据薄弱时，监管机构愿意挑战 AI 赋能主张。
        - 中
        - 高
        - Basis 条款谨慎，把复核责任推回给用户。
        - 营销、演示和客户轶事仍可能跑在量化证据前面。
        - 需要按工作流披露经审计或客户验证的表现报告。
    notes: 本登记表关注生产质量和保密风险，而不是泛泛的创业公司运营风险。
