      - number: '3.2'
        title: 直接会计原生同业：Botkeeper、Truewind 和 Digits
        blocks:
          - type: paragraph
            body: >-
              Botkeeper、Truewind 和 Digits 都与 Basis 故事中有意义的一部分重叠，但方式不同。Botkeeper 明确为会计事务所打造，并已声称拥有超过 200 家事务所和 5,000
              多个企业客户，这给了它真实的安装基础可信度；同时，它仍把产品描述为 AI、支持和专属帮助的混合体，而不是多业务代理平台。Truewind
              在复核优先的流程自动化上更接近，但其公开定位仍集中在结账、对账、交易编码和附表准备，并把 Sage 或 QBO 保持为事实来源。Digits 是三者中结构上最有野心的，因为它销售 AI
              原生总账、公布入门价格，并推动事务所采用品牌化客户体验和代理式结账运营。放在一起看，这些同业说明 Basis 并不是唯一试图自动化会计师流程的公司；它们也说明市场在重服务记账、以结账为中心的 copilot
              层和完整总账替代之间相当碎片化。当买方想要跨多个业务线的可复核执行，而不只是记账或结账提速时，Basis 的差异化主张最强。
