  - id: TV006
    title: 最终尽调请求表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - ARR 与留存
        - MRR 或 ARR 桥接、NRR、Logo 留存，以及按队列拆分的扩张 ARR。
        - 没有分母，就无法用任何倍数纪律检验估值。
        - 财务尽调：索取月度董事会材料中的 KPI 页和队列表。
      - - 股权结构表与优先权
        - 完全稀释所有权、优先股堆叠、期权池刷新、老股交易，以及任何债务。
        - 普通股回报不只取决于企业价值标题数字。
        - 法律与融资尽调：索取股权结构表、公司章程、投资条款清单和附属协议。
      - - 毛利率和服务负担
        - 软件与服务收入占比、按工作流拆分的毛利率、上线强度和支持人员配置。
        - 只有自动化经济性真正像软件，高端软件倍数才站得住。
        - FP&A 尽调：索取分部 P&L 和实施经济性。
      - - 客户质量
        - 头部客户集中度、续约表现、标准实施周期，以及赢单 / 输单数据。
        - Top-25 渗透只有在能复利增长并续约时才重要。
        - 商业尽调：客户访谈，加上 CRM 和续约导出数据审阅。
      - - 风险控制
        - 线上错误率跟踪、升级路径、隐私控制、审计轨迹完整性和模型治理文档。
        - 税务和审计自动化的容错空间远窄于通用 copilots。
        - 产品与合规尽调：索取控制矩阵、事故日志和 QA 评分卡。
    notes: 这些是最低限度尽调请求；只有拿到这些，才能把一家有意思、价格真实的公司，推进为同一价格下可承销的投资。
    claimRefs:
      - CV038
      - CV039
      - CV040
