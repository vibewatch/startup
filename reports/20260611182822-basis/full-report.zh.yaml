      - number: '3.5'
        title: 转换成本、护城河耐久性与反向角度
        blocks:
          - type: paragraph
            body: >-
              Basis 的最好情况是，流程深度、可复核性和多业务会计原生设计，形成通用 copilots 和点状解决方案不易匹配的耐久楔子。公开客户验证支撑这个论点：Wiss 明确把 Copilot 与 Basis
              作了对比，并称真正改变业务的是集成式端到端自动化，而不是泛化 AI 可用性。OpenAI 和 Basis 也把产品进展描述为随模型改进而复利，这可能扩大 Basis
              能安全掌控的流程集合。反向情形同样重要。模型进步也可能商品化助手功能，缩小专业平台与捆绑资源丰富的现有厂商之间的差距。各供应商的公开信任主张正在收敛，因此安全本身不是护城河。Botkeeper 和 Digits
              的公开价格会压低感知价值，而 QuickBooks 和 Microsoft 可以利用既有分发，让“够用”的 AI
              显得更便宜、更容易采用。结果是一个看起来真实但有条件的护城河：当事务所想要跨多个业务的会计原生、可复核流程所有权时，Basis
              看起来最强；当买方优化的是捆绑杠杆、外包或透明低入门价格，而不是深层流程控制时，Basis 看起来较弱。
