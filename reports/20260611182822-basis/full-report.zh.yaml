      - number: '1.3'
        title: 融资历史、投资人基础与利益相关方图谱
        blocks:
          - type: paragraph
            body: >-
              即便股权结构细节仍属私密，Basis 现在已有连贯的公开资本历史。公司在 2023 年 10 月以 $3.6 million 种子轮公开亮相，2024 年 12 月完成由 Khosla Ventures 领投的
              $34 million Series A，随后在 2026 年 2 月宣布以 $1.15 billion 估值完成 $100 million Series B。合并这些轮次后，累计融资约 $137.6
              million，几家外部媒体四舍五入为约 $138 million。Series B 财团显著拓宽了利益相关方基础：Accel 和 GV 以领投方身份进入，Khosla
              继续加码，来自软件、基础设施和金融领域的其他支持者和天使投资人仍然参与。投资人名单重要，不只是因为它给 Basis
              资本；它还增加了公司面向会计事务所、模型实验室和未来企业买家的分发、招聘和战略可信度。关键公开缺口在于未披露的部分：保留来源集中没有债务、仓储融资、要约收购或其他二级交易证据，因此股权故事可见，但完整资本结构故事不可见。
