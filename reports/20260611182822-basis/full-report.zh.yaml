  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 当前判断
      - 什么会改变判断
    rows:
      - - 品类需求
        - 正面：会计自动化需求和劳动力压力是真实的，Basis 也有投资人质量和头部事务所证据。
        - 如果部署被证明狭窄或集中，而不是能跨事务所和工作流复制，判断会转弱。
      - - 商业证明
        - 建设性：Baker Tilly、OpenAI 和 Top-25 渗透表明市场拉力真实存在。
        - 如果 Basis 披露续约、扩张和实施标准化数据，判断会明显改善。
      - - 估值支撑
        - 薄弱：本轮融资真实存在，但公开经济性不存在。
        - 如果 ARR 已经高于大约 $75M-$100M，且利润率接近软件公司，判断会改善。
