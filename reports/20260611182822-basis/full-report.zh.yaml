  - id: FV001
    title: 投资建议逻辑
    type: flow
    layout: wide
    summary: 赞助方质量和商业验证把建议往上推，但缺少分母这一关仍然过不了。
    data:
      nodes:
        - id: A
          label: $1.15B 私募估值标记
          detail: 2026 年 2 月这一轮融资有官方和独立来源充分交叉印证。
        - id: B
          label: 赞助方质量
          detail: Accel、GV、Khosla 和 Lloyd Blankfein 带来真实信号力。
        - id: C
          label: 商业验证
          detail: Top-25 渗透、Baker Tilly 和 OpenAI 案例研究证据显示市场拉力真实存在。
        - id: D
          label: 经济性不透明
          detail: ARR、留存、烧钱和服务组合仍未披露。
        - id: E
          label: 可比公司区间压缩
          detail: 公开市场和 2026 SaaS 中位数倍数远低于激进的私募假设。
        - id: F
          label: 继续研究 / 偏贵
          detail: 公司有意思，融资真实，但公开分母不足。
      edges:
        - from: A
          to: B
          label: 得到支撑
        - from: B
          to: C
          label: 强化
        - from: C
          to: D
          label: 抵消因素
        - from: D
          to: E
          label: 迫使
        - from: E
          to: F
          label: 因此
    approximationNotes: 这是一张逻辑图，不是概率模型。即便赞助方和客户信号很强，结论仍停在继续研究，原因在这里。
    claimRefs:
      - CV002
      - CV004
      - CV006
      - CV009
      - CV010
      - CV034
      - CV037
      - CV054
      - CV062
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: $1.15B 估值对应的 ARR 门槛差异很大，关键看最终被市场接受的是哪一个收入倍数。
    data:
      items:
        - label: 15x 溢价区间
          value: 76.7
          detail: 如果 Basis 能拿到很强的私募溢价，需要达到的 ARR。
          tone: positive
        - label: 12x 溢价区间
          value: 95.8
          detail: 如果投资人仍看好但保持纪律，需要达到的 ARR。
          tone: neutral
        - label: 10x 溢价区间
          value: 115
          detail: 如果公司足够优秀但不再被视为例外，需要达到的 ARR。
          tone: neutral
        - label: 5x 软件区间
          value: 230
          detail: 如果 Basis 重新定价到强劲但成熟的软件公司附近，需要达到的 ARR。
          tone: risk
        - label: 3.4x 公开 SaaS 中位数
          value: 338.2
          detail: 按 2026 年 3 月公开 SaaS 中位数计算所需的 ARR。
          tone: risk
        - label: 3.1x 私募 SaaS 并购中位数
          value: 371
          detail: 按 2026 年 3 月私募 SaaS 并购中位数计算所需的 ARR。
          tone: risk
      yAxis:
        label: 支撑 $1.15B 估值所需的 ARR 或收入（USD M）
    approximationNotes: 每个柱状值都按估值除以倍数反推。这些是敏感性门槛，不是 Basis 披露的经营指标。
    claimRefs:
      - CV034
      - CV035
      - CV044
      - CV045
      - CV046
      - CV047
      - CV048
      - CV049
      - CV050
      - CV051
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 当前估值标记高于熊市情景，只落在有纪律基准情景的上半段。
    data:
      items:
        - label: 熊市公允价值
          low: 0.2
          mid: 0.34
          high: 0.48
          displayValue: $0.20B-$0.48B
          detail: ARR 只有 $25M-$40M，市场给 8x-12x 收入倍数。
          tone: risk
        - label: 基准公允价值
          low: 0.6
          mid: 0.9
          high: 1.2
          displayValue: $0.60B-$1.20B
          detail: ARR 达到 $50M-$75M，买方支付 12x-16x。
          tone: neutral
        - label: 牛市公允价值
          low: 1.2
          mid: 1.7
          high: 2.4
          displayValue: $1.20B-$2.40B
          detail: ARR 达到 $80M-$120M，增长和利润率质量都强。
          tone: positive
        - label: 当前参考估值
          low: 1.15
          mid: 1.15
          high: 1.15
          displayValue: $1.15B
          detail: 2026 年 2 月 Series B 参考点。
          tone: neutral
    approximationNotes: 区间是以十亿美元计的估值情景，由明确 ARR 和倍数假设搭出，不是公司指引。
    claimRefs:
      - CV002
      - CV059
      - CV060
      - CV061
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: wide
    summary: 头部 KPI 足够有吸引力，值得继续做功课；但信息仍太不完整，无法在当前估值标记下干净放行。
    data:
      items:
        - label: 最新披露估值
          value: $1.15B
          detail: 交叉印证充分的私募轮参考。
        - label: 已披露累计融资
          value: ~$138M
          detail: 暗示账面资本效率很强。
        - label: 头部事务所渗透信号
          value: ~30% of Top 25
          detail: 公开来源中当前最好的商业验证。
        - label: 公开可比公司 P/S 区间
          value: 2.08x-3.80x
          detail: 运行日 BILL 到 Intuit 的区间。
        - label: 2026 SaaS EV/收入中位数
          value: 3.1x-3.4x
          detail: Aventis 给出的私募并购到公开市场中位数区间。
        - label: 支撑 10x-15x 所需 ARR
          value: $77M-$115M
          detail: 要拿到溢价但不荒谬的软件倍数，至少需要这个分母。
        - label: 披露质量
          value: Low
          detail: ARR、NRR、烧钱和优先权条款仍未公开。
    claimRefs:
      - CV002
      - CV003
      - CV006
      - CV030
      - CV033
      - CV034
      - CV035
      - CV051
      - CV054
