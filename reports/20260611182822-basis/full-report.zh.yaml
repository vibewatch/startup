      - CV060
      - CV061
  - id: TV005
    title: 投资逻辑失效与终止触发器表
    columns:
      - 触发器
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - 经济性持续不透明
        - 尽调开放后，ARR、NRR、毛利率和服务收入占比仍不披露。
        - 估值仍靠信念驱动，而不是证据驱动。
        - 不要把 2026 年 2 月价格当成可投资价格。
      - - 实际工作流出现质量或控制失败
        - 税务或审计生产使用中出现重大幻觉、隐私或监督问题。
        - 高风险会计工作流买方会很快重估信任。
        - 除非价格大幅重置且控制已修复，否则转为回避。
      - - 可比公司倍数继续压缩
        - 上市会计软件区间跌破 2026 年 3 月已压缩水平。
        - Basis 失去支撑私募增长例外所需的高端区间支撑。
        - 重切悲观 / 基准估值，并提高回报门槛。
      - - 合作伙伴验证无法转化为持久扩张
        - 具名事务所仍只是参考客户，看不到续约或跨业务线增长。
        - 投资逻辑从可扩展平台降级为亮眼试点供应商。
        - 从主动尽调转入观察名单。
    notes: 这些是可监控断点，不是泛泛风险。每个触发器都用于告诉投资人：什么时候当前价格不再配得上假设中的溢价。
