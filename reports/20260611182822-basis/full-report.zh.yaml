      - number: '4.3'
        title: 成本结构与单位经济模型
        blocks:
          - type: paragraph
            body: >-
              Basis 不像是在通用模型外面套一层、低支持成本的包装层。安全页面宣传 SOC 2 Type II、ISO 27001、ISO 42001、仅美国托管、MFA、审计日志、备份和第三方测试。法律条款还补充，AI
              输出不能替代专业判断，需要人工复核和验证。这些承诺在会计领域有商业帮助，但也意味着在每增加一美元毛利之前，公司要先承担固定合规、基础设施和客户成功成本。


              公开可比公司强化了这种可能组合。Workiva 的 2025 10-K 称，92% 收入来自订阅和支持费，其余来自专业服务，并警告服务组合可能影响毛利率。BILL 的 2025 10-K
              提到部分年度订阅，也提到开放式安排、定价敏感度和销售成本，同时报告规模化后的 81.7% GAAP 和 85.0% non-GAAP 毛利率。Basis
              最终也许会像高毛利软件，但今天的公开记录更支持一种近期模型：企业软件加上线导入、伙伴推广和模型供应商开支，而不是已经实现的纯软件经济模型。
