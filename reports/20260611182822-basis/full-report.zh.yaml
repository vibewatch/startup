  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与买方图谱
        blocks:
          - type: paragraph
            body: >-
              Basis 卖给会计事务所，而不是以自助方式卖给个人记账员。公开信息反复围绕事务所业务领域组织产品——CAS、税务、审计、咨询、外包会计和托管服务；客户引用来自 CEO、合伙人、CIO
              和托管服务负责人，而不是自己刷卡购买的一线员工。这个模式强烈指向事务所级买方和付款方，会计师及交付团队是主要用户，会计事务所的终端客户则通过更快结账、更好报告和更多咨询产能间接受益。分层宽度也不止单一记账楔子。Basis
              从 CAS 起步，因为该领域流程重复且深度会计原生；但公开材料现在也把平台定位到税务和审计。实用的分层视角因此应按事务所类型和流程成熟度来划分：以 CAS
              为主的外包会计事务所、更大型多学科事务所、托管服务业务，以及希望用一层 AI 横跨多个部门的跨业务事务所。
