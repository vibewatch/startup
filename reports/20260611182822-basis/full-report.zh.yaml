  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序总览，以及为什么承保仍被卡住
        blocks:
          - type: paragraph
            body: >-
              Basis 周围最高严重度的风险不是泛泛的“AI 风险”，而是 AI 输出可能出错，与承担法定、标准化和声誉责任的专业服务工作之间的相互作用。Basis 现在把一个平台卖进
              CAS、税务、审计和咨询，这意味着单个模型、控制或工作流弱点可能跨多个受监管会计场景扩散，而不是被限制在低风险后台任务里。公开缓释因素真实存在。Basis 称其通过 SOC 2 Type II、ISO 27001
              和 ISO 42001 认证，数据留在美国，不用客户数据训练，并记录智能体动作。法律条款也异常明确：AI
              输出不能替代专业判断，在用于申报、客户交付物或专业工作成果之前必须复核。这些控制重要，但没有回答承保人更难的问题：税务和审计工作流中观测到的幻觉率或异常率是多少，企业合同如何分配责任，客户基础有多集中，如果关键模型提供商、安全认证或集成路径突然变化会发生什么。
