      - number: '5.4'
        title: 成熟度、路线图与范围扩张
        blocks:
          - type: paragraph
            body: >-
              Basis 的公开时间线支持这样一种产品图景：从核心会计起步，做出真实 CAS 牵引力，现在推进税务和审计，而不是声称所有业务领域从第一天起就已成熟。Annette Garcia 的访谈是这里最坦率的来源：她说
              Basis 从核心会计开始，是因为系统必须先知道如何做会计，才能在税务或审计中成功；两个较新的业务领域都会引入性质上更难的判断和监管问题。这一表述与其余记录一致。Wiss 提供 CAS
              部署的历史验证，OpenAI Basis 文章显示更深的流程编排和模型路由成熟度，Series B 报道则把公开范围扩展到 CAS、税务和审计，包括 1065 流程。与此同时，Basis 的 2025-2026
              年工程帖显示，公司正在构建内部上下文、eval 和代理管理系统，应能提高迭代速度。正确解读是：Basis
              已不再是早期原型，但也没有公开证明其营销的每个高风险流程都达到统一质量水平。成熟度故事在流程宽度和内部技术严肃性上最强，在公开质量指标和标准化企业运营数据上较弱。
