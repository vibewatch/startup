  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户流程定义产品
        blocks:
          - type: paragraph
            body: >-
              Basis 用流程语言而不是助手语言描述产品。官网称代理在后台运行、端到端执行会计流程，并把完成的工作交回复核；关于页面强调，公司搭建的是会计逻辑系统，而不是叠在会计数据上的聊天机器人层。这个区别重要，因为
              Basis 最强的公开证据不是泛化 AI 生产力话术；而是反复主张会计师仍在关键阶段掌控，系统完成执行密集步骤后，由人来复核工作产出并作判断。OpenAI 的 Basis
              案例研究把这套营销落在具体例子上，例如对账、日记账分录和财务摘要；Series B 报道又加入端到端 1065 税表示例。Basis 还把产品映射到 CAS、税务、审计和咨询，因此客户流程故事比狭窄 AP
              或记账楔子更宽。官网和 Wiss 的公开客户验证显示，公司确实有多业务采用；但公开记录在定性流程结果上仍强于按流程标准化的生产 KPI。
