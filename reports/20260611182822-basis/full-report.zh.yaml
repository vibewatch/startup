            body: >-
              估值本身足够真实；问题在分母。Basis 融资 $100M，估值约 $1.15B，目前披露累计融资约
              $138M。纸面上看，这显得资本效率不错：累计融资仅约为当前标题估值的八分之一。若把所报估值视为投后估值，最新一轮的新钱稀释也只是约高个位数。这是好消息。更难的问题是，表面效率究竟反映真实经济杠杆，还是投资人在公司披露收入基础前，就提前为品类领导地位定价。公开来源没有显示风险债、老股交易、清算优先权，也没有说明普通股入场比独角兽标题暗示的更干净还是更复杂。实用的估值结论是，Basis
              大概降低了短期融资风险，但没有消除稀释风险。如果公司后来在经济性得到广泛验证前还需要再融资，股权结构表和优先股堆叠里的隐藏变量，可能比当前投后估值更影响回报结果。
