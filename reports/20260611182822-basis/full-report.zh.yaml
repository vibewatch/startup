  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 对价格敏感的结论与入场纪律
        blocks:
          - type: paragraph
            body: >-
              对一家年轻的垂直 AI 公司来说，Basis 已经越过最重要的标题门槛：2026 年 2 月的 Series B 将公司估值推到约
              $1.15B，背后有蓝筹投资方，也有真实会计师事务所渗透。这很重要。相比泛泛的“AI for finance”营销，顶线故事更强，因为证据包里有前 25 大事务所渗透、Baker Tilly
              类渠道合作，以及一份指向可度量省时的 OpenAI 案例研究。但这些还不足以把当前估值变成自动通过的承保结论。公开记录仍未披露
              ARR、收入、留存或烧钱速度，所以投资人实际上是在为一个看起来真实、但经济性仍不透明的品类领导地位付费。Intuit、Workiva、BlackLine 和 BILL 的公开可比倍数大致聚集在约 2x 到 4x
              销售额，2026 年 SaaS 市场环境也明显不如 2021 年宽松。因此，建议取决于价格，而不是绝对分类：Basis
              具有战略吸引力，商业上也说得通，但在当前估值下，纪律性结论是继续研究，中等信心、高风险、估值偏高；而不是先买入、后尽调。
