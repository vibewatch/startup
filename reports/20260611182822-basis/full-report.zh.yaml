      - number: '8.4'
        title: 乐观、基准与悲观情景区间
        blocks:
          - type: paragraph
            body: >-
              情景测算把承保问题讲得很清楚。如果 Basis 仍在 $25M 到 $40M ARR 区间，即便给出慷慨的 8x 到 12x 软件倍数，隐含价值也会比 2026 年 2 月估值低数亿美元。$50M 到 $75M
              ARR、12x 到 16x 倍数的中间情景，才刚开始覆盖当前价值；并不能让这一轮显得明显便宜。真正有吸引力的上行情景需要更强条件：ARR 已经更接近 $80M 到 $120M，利润率像软件，且客户扩张证据足以让
              15x 到 20x 的溢价区间可信。悲观路径不是产品崩盘，而是普通软件重估叠加税务和审计工作流中的 AI 控制风险；一旦出现幻觉、隐私失败或监督缺口，买方会迅速惩罚。上行路径是标准化：如果 Basis
              能把头部事务所 logo 和合作伙伴证据转化成可复制、高毛利部署，当前估值仍可能成立。因此，估值立场仍是偏高，而不是崩坏：战略可信度存在，但当前价格只有在保守的基准到乐观区间内才说得通。
