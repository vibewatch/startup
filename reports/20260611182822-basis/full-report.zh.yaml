  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >-
              Basis 的公开财务表面更像卖给会计事务所的企业软件，而不是消费者 SaaS。官网展示了横跨 CAS、税务、审计和咨询的业务模块，但没有结账流程或价格表；法律页面反复把商业使用导向书面
              MSA、订单和单独企业协议。这个组合意味着报价制合同、谈判范围，以及按流程定制部署，而不是透明的按席位自助定价。


              因为 Basis 把自动化卖进高风险会计工作，可能的收入模式会把经常性平台费与上线导入、流程配置、支持，或许还有特定伙伴部署工作混在一起。官网证言横跨多家事务所和业务领域，Wiss 与 OpenAI
              则描述多步骤流程、人工复核和可衡量的产能提升。公开证据足以说明 Basis 通过面向会计事务所的企业流程自动化变现；但不足以披露实际 ACV、折扣区间、最低合同规模，或软件与服务的拆分。
