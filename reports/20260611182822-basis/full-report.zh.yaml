      - number: '8.3'
        title: 可比框架，以及为什么传统倍数承保受限
        blocks:
          - type: paragraph
            body: >-
              Basis 不完全落在某一个纯可比桶里，所以估值纪律才重要。私营市场上，Numeric 和 Truewind 显示投资人仍在积极资助会计自动化，但这些公司更常披露轮次规模和产品雄心，而不是估值。Ramp
              距离更远，但有参考价值，因为它说明，只要收入规模可见，2026 年私营市场对 AI 驱动的 fintech 平台仍可能胃口巨大：$44B 私有估值之下有超过 $1B
              的年化收入。公开市场侧，可比信号更冷静。Yahoo Finance 在运行日显示，Intuit 约 3.8x 销售额、Workiva 约 3.0x、BlackLine 约 2.6x、BILL 约
              2.1x。监管文件进一步证明，这些是真正的软件企业，收入经审计，毛利率也可观。Aventis 更广泛的 2026 年软件研究方向类似：公开市场 EV / 收入中位数约 3.4x，私营 SaaS 并购约
              3.1x。Basis 可能配得上高于该组公司的溢价，因为它可能更早期、增长更快，也在塑造品类；但公开证据还不足以假设溢价宽到估值支撑不再重要。换句话说，今天还没有足够披露的收入、利润率或烧钱数据，无法用传统 EV
              / 收入倍数干净承保 Basis；用情景逻辑比假精确更诚实。
