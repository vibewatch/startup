companyProfile:
  summary: >-
    Basis 是一家位于纽约的私营软件公司，面向会计事务所打造长周期 AI 代理。公开材料显示，平台覆盖客户会计服务、税务、审计和咨询流程，重点不是只给建议的
    copilot，而是端到端完成任务后交由人工复核。公司拼出了一支混合创始团队，既有商业运营者，也有深厚的概率编程和研究人才；随后从专业金融科技和前沿 AI 投资人处完成种子轮、Series A 和 Series B
    融资。公开验证最强的部分来自 Wiss、Baker Tilly、UHY 等具名事务所，以及 Basis 覆盖约 30% 美国前 25
    大会计事务所的更宽口径说法。主要限制是经济数据不透明：收入、ARR、留存、利润率、烧钱速度和客户集中度均未披露。
