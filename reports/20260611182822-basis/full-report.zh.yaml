  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义与范围
        blocks:
          - type: paragraph
            body: >-
              分析 Basis 时，应对标专业会计事务所流程自动化市场，而不是所有财务软件支出或经济体中每一名会计从业者。公司自己把产品定位在
              CAS、税务、审计和咨询之间，这与面向客户出售经常性和项目制专业服务的公共会计事务所最直接契合。BLS 职业定义确认，会计劳动力横跨公共会计师、管理会计师、政府会计师和审计师，因此广义会计劳动力市场大于
              Basis 的直接购买中心。这个区分重要，因为大量软件市场服务的是 controller、CFO、薪资团队或行业特定财务运营，而不是 CPA 事务所。


              因此，本章纳入的支出包括：公共会计服务收入、销售给会计事务所的软件和流程工具，以及可在事务所内部替代或增强会计师劳动的邻近自动化预算。排除或仅部分纳入的支出包括企业 ERP、通用 AP
              自动化，以及企业财务团队购买的内部 controllership 软件，除非这些工具可作为 Basis
              想要自动化的同一会计工作的实际替代品。这个边界让本章保持诚实：它保留了会计支出的大外沿，同时避免把每一美元记账、薪资或 finance-ERP 支出都视为同样可由面向事务所的代理平台触达。
