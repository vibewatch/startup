        title: 耐久性、扩张与集中度
        blocks:
          - type: paragraph
            body: >-
              Basis 最清晰的扩张路径不是消费级座席增长，而是在已经信任它的事务所内部，继续打深工作流和业务线渗透。Wiss 从 CAS beta 走到全面部署，并出现更广泛的内部兴趣。Baker Tilly
              把此次上线表述为托管服务扩张的下一阶段。Basis 自己的会计产品运营团队称，公司从 CAS
              起步，因为必须先吃透核心会计，再延伸到审计和税务。这些都是实打实的落地后扩张信号。尚未被证明的是投资人能够承保的耐久性。公开来源没有披露
              GRR、NRR、流失、续约率、合同期限或队列留存。集中度图景同样有两面：覆盖前 25 大事务所中约 30% 是很强的 logo 质量信号，但也可能意味着相当一部分商业价值集中在少数大客户手里。没有收入集中度、按
              logo 拆分的部署深度或合同到期数据，客户故事在战略价值上有吸引力，但经济耐久性的文件仍不够。
