  - id: TU001
    title: 客户分层表
    columns:
      - 分层
      - 买方 / 用户 / 付款方
      - 主要用例
      - 公开规模 / 证据
      - 战略价值
      - 缺口
    rows:
      - - CAS / 外包会计事务所
        - 买方和付款方是事务所或业务线负责人；用户是 CAS 会计师和复核人员
        - 日记账分录、对账、月结、报告、临近记账的工作流
        - Wiss 从测试版到全面部署 CAS；UHY 月结引述；Basis 从 CAS 起步
        - 证据最强的滩头阵地，因为工作流重复、高频且原生于会计
        - 没有按 CAS 客户披露的席位数、ACV 或实施周期
      - - 大型多业务线会计事务所
        - 买方和付款方似乎是事务所管理层；用户覆盖 CAS、税务、审计和咨询团队
        - 跨业务线自动化和工作流委派
        - Basis 称进入约 30% 的美国前 25 大事务所；首页引用的客户包括 Wiss、Boulay、Clark Nuber 和 BPB
        - 如果跨业务线使用属实，客户标识价值高，参考质量也强
        - 公开证据未说明前 25 大关系中有多少是广泛部署，有多少是窄试点
      - - 托管服务型会计和财务业务
        - 买方和付款方是托管服务负责人；用户是服务终端客户的交付团队
        - 交易处理、JE 支持、对账、关账后分析、管理报告、预算和预测
        - Baker Tilly 官方合作列名这些工作流，并称其先评估了多个平台
        - 说明 Basis 能卖进服务交付运营，不只是后台实验
        - 没有关于实施时间表、客户覆盖或上线经济性的公开信息
      - - 税务团队
        - 买方可能是税务业务线负责人；用户是税务专业人士
        - 税务底稿、纳税申报表和研究支持
        - Basis 称平台现在覆盖税务；BPB 引述称可信智能体重塑税务工作；公司称已演示 1065 纳税申报表
        - 如果准确性和可审阅性守得住，CAS 之外还有上行空间
        - 没有公开的税务专项留存、胜率或生产量指标
      - - 审计团队
        - 买方可能是审计负责人；用户是审计师和复核人员
        - 审计测试、工作底稿、证据收集，支持可复核工作流
        - Basis、媒体报道和公司材料都把审计列为目标业务领域
        - 审计风险高、工作流丰富，战略价值大
        - 公开证据弱于 CAS 和托管服务；未检索到具名审计客户案例
      - - 会计事务所终端客户受益方
        - 付款方仍是会计事务所，但受益方是事务所客户
        - 更快关账、更好报告、更多顾问产能
        - UHY 提到客户月结时间缩短；Baker Tilly 把价值表述为一致性、可见性和可直接用于决策的洞察
        - 客户结果很重要，因为它能强化事务所内部粘性和扩张
        - 终端客户引用是间接的；留存来源没有披露直接客户满意度得分或案例研究分母
    notes: 各行结合公司、客户和独立证据；公开证据对工作流类型最强，对花费、席位和续约行为最弱。
