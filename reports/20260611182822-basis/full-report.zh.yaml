              公开需求代理指标真实但有选择性。Basis 和第三方反复称，公司服务约 30% 的前 25 大会计事务所；Wiss 称 CAS beta 扩展为全面部署，内部采用逐月上升。Baker Tilly 的 2026
              年合作又加入一个规模化买方，用 Basis 做交易处理、日记账分录支持、对账和结账后报告。官网还展示了 Wiss、UHY、Clark Nuber、Boulay 和 BPB 的证言；对早期垂直 AI
              供应商来说，这是异常具体的客户验证。


              缺失的是投资人真正要承销的部分：合同期限、净收入留存、赢单率、销售周期长度、实际定价和客户集中度。OpenAI 案例研究称，事务所平均报告最高 30% 的时间节省；公司相关融资报道引用 20% 到 50%
              的效率提升，因此 Basis 显然在销售产能扩张和更快复核周期。但这些 ROI 信号仍由公司渠道或合作伙伴引用，并非经审计收入数据。GTM 故事是可信的企业采用；收入质量故事仍未被证明。
