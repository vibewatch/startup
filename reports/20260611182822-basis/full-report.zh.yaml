      - number: '5.2'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开架构描述来自 OpenAI：每个 Basis 任务都从一个监督代理开始，由它根据任务、复杂度、延迟和输入类型把工作路由给专门子代理。在该描述中，监督角色从 o3 迁移到 GPT-5，而 GPT-4.1
              仍留在技术栈中处理速度敏感交互。Basis
              称这套架构由基准测试驱动：公司运行内部评估，以判断哪些模型适合哪些流程，以及代理何时能安全承接更多工作。同一来源还称，代理通过中心层共享上下文，并向复核者暴露假设、源材料和逻辑，这与 Basis 可追踪 AI
              的公开承诺一致。另一批 Basis 工程帖补充了重要细节：公司似乎运行一种代理原生的内部运营模式，包含 APO、Atlas、重评测工程实践，以及通过统一 MCP
              做内部工具编排。这些帖子是有价值的开发者信号，说明工程严肃度和内部流程成熟度；但它们不能直接证明每个面向客户的流程都使用完全相同的基础设施。公开来看，客户产品架构可信且具体；私下仍未披露精确服务栈、非
