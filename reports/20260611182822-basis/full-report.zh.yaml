      - number: '7.4'
        title: 基础模型依赖、既有厂商竞争与集中度都会压缩上行空间
        blocks:
          - type: paragraph
            body: >-
              Basis 不是在真空中竞争。公开市场和产品证据显示，AI 加持的财务与 ERP 市场增长很快，但赛场上也有大得多的供应商，已经把可信内容、披露工作流、税务引擎和嵌入式分发打包在一起。Workiva
              推广用于财务报告、审计、风险和 SOX 准备的 AI；Thomson Reuters 推广带引用支撑的 CoCounsel Audit 和 CoCounsel Tax，以及注入 AI 的 ONESOURCE
              工作流；Intuit 正把 Intuit Assist 推向 QuickBooks 和报税准备。Workiva 自己的 10-K 称，竞争横跨多元化企业软件提供商、垂直供应商、GRC
              供应商和专业服务替代方案，并预计更大型和更专门化的供应商都会进一步加剧竞争。Basis
              的客户证据令人印象深刻，但公开范围仍窄，集中在少数具名事务所和合作关系，而不是披露的广泛客户基础、留存画像或头部客户敞口。模型依赖也只露出一部分。Workiva 公开表示，其 AI 技术栈目前使用来自
              Google、AWS/Anthropic 和 Microsoft/OpenAI 的前沿模型；Basis 的公开界面强调 OpenAI/Codex 和“可信智能体”叙事，但主安全 /
              法律页面没有公开写清生产模型冗余或回退架构。因此，在既有厂商持续缩小产品差距的同时，Basis 也暴露在平台、模型成本或合作伙伴政策变化之下。
