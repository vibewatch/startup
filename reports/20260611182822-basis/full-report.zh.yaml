      - number: '6.3'
        title: ROI、部署摩擦与证据质量
        blocks:
          - type: paragraph
            body: >-
              ROI 叙事可信，但仍大量依赖替代指标。OpenAI 称，使用 Basis 的事务所平均报告节省 30% 时间，并且随着信任加深持续扩大智能体职责；Basis 融资报道还加入了一位投资人的说法，称各业务线效率提升
              20% 到 50%。问题不在于没有 ROI 信号——信号有好几个——而在于最强的公开数字仍来自公司渠道或合作伙伴渠道，而不是经审计的客户经营数据。独立实施研究解释了原因。CPA Practice
