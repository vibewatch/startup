      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Basis 已分三步披露股权融资：$3.6 million 种子轮、$34 million Series A，以及以 $1.15 billion 估值完成的 $100 million Series
              B。自成立以来，披露股权融资约 $137.6 million；没有检索来源描述风险债、项目融资或其他杠杆。相对大多数垂直 AI 创业公司，这是一笔强资本基础。Series B
              募资用途——加速平台开发并扩张工程和机器学习团队——也读起来像进攻性投入，而不是救援融资。


              限制在于，融资不等于现金。Basis 没有披露现金余额、烧钱速度或收入贡献，因此现金跑道只能示意，不能确知。只用新到位的 $100 million 融资做一个简单情景，如果月烧钱约 $3.0 million 到
              $5.5 million，意味着大约 18 到 33 个月现金跑道；如果此前资本仍有余额，或经常性收入抵消支出，实际现金跑道可能更长。即便如此，融资依赖并未消失。Basis
              正在扩张一个安全重、依赖模型、企业部署型业务；下一次融资触发点很可能取决于采用头条能否转化为实际定价、扣除支持后的毛利率，以及在大型事务所内可重复扩张。
