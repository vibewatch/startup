      - number: '5.5'
        title: 差异化、信任、安全与合规
        blocks:
          - type: paragraph
            body: >-
              Basis 最可防守的公开差异化，不在于它是唯一把 AI 用在会计里的公司，而在于它把会计特定流程所有权、可复核性和多业务野心结合起来。Wiss 的比较尤其重要，因为它明确说 Copilot 和一家私有事务所
              ChatGPT 实例有用，但仍不等同于 Basis 的集成式端到端自动化。这与竞争集合对应得很清楚：QuickBooks AI 和 Microsoft Copilot
              是嵌入更大套件的宽助手；Botkeeper、Vic.ai 和 Digits 则分别营销更窄的记账、AP 或总账中心表面。相比之下，Basis
              销售的是一个会计事务所原生平台，代理可以执行工作并交回可复核交付物。安全和信任姿态强化了这个故事：Basis 公开声称不使用客户数据训练模型、数据隔离、动作可审计、token-based
              访问、仅美国数据托管和多项认证。但会计是受监管的信任业务，不是通用自动化市场。NIST、PCAOB、IRS、AICPA 和 Thomson Reuters 都强调，高风险金融 AI
              需要治理、可复核性和专业判断。Basis 的信任叙事方向上强，但证明责任仍高，因为精确集成覆盖、SLA 条款和审计质量指标大多仍属私密。
