      - number: '7.2'
        title: 专业准则、CPA 责任与监管风险是一阶问题
        blocks:
          - type: paragraph
            body: >-
              Basis 明确卖进了贴近 GAAP 解读、纳税申报处理、审计证据和 SOX 控制流程的工作。这很关键，因为治理准则把判断责任放在持牌事务所和项目团队身上，而不是工具供应商身上。Basis
              自己的条款写明，输出仅供信息和辅助使用，可能包含错误或遗漏，不能替代会计、税务、审计、法律或财务建议。Journal of Accountancy 和 CPAI 材料从买方侧强化了同一点：生成式 AI
              可能误用准则、产生幻觉，或不当处理机密客户数据；盲目信赖会把工作流便利变成疏忽或专业责任问题。税务侧尤其敏感。IRS Publication 4557 称保护纳税人数据是法律要求，并提示事务所承担 FTC
              Safeguards Rule 义务；26 U.S.C. §7216 则将某些未经授权披露或使用申报信息的行为刑事化。审计侧，PCAOB AS 1105
              要求充分、适当的审计证据，并特别看重证据来源的可靠性和独立性，因此任何由 AI 摘要或 AI 转换过的证据链都是尽调项。Basis
              可以支持工作流，但公开记录尚未给出足够量化的控制证据，不能假设这些责任已经在经济或运营层面从事务所转移出去。
