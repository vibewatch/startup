      - number: '3.3'
        title: 现有厂商、邻近替代品与现状
        blocks:
          - type: paragraph
            body: >-
              竞争分析中最大的错误，是只把 Basis 与其他创业公司供应商比较。Pilot、Vic.ai、BILL、QuickBooks、Microsoft 以及内部自建现状，都从不同角度攻击同一个劳动力池。Pilot
              为创业公司和小企业提供记账、税务和 CFO 服务，因此当买方更想要外部团队而不是新软件栈时，它就形成竞争。Vic.ai 和 BILL 更窄，但 AP
              专家仍可在财务团队或会计事务所投入更广流程平台之前，吸收自动化预算和运营注意力。Intuit Assist 和 Microsoft 365 Copilot
              又不同：基于保留公开证据，它们不是会计事务所原生产品，但继承了 QuickBooks 和 Microsoft 365
              的分发，降低了已经生活在这些系统里的买方采用摩擦。现状同样重要。事务所已经运行总账、电子表格、业务工具、复核习惯和客户沟通闭环，这些都会形成惯性。因此 Basis
              不只需要胜过某一个产品；它要打败的是一组既有软件、人工流程和熟悉的流程捷径。
