      - number: '7.3'
        title: 安全、保密与治理是可见强项，但承保仍嫌不完整
        blocks:
          - type: paragraph
            body: >-
              Basis 的公开安全姿态强于许多私营 AI 初创公司。公司声称拥有 SOC 2 Type II、ISO 27001 和 ISO 42001
              认证；不使用客户数据训练模型；严格租户隔离；仅在美国托管；MFA；静态和传输中加密；智能体动作可审计。对处理纳税申报、审计工作底稿和其他敏感客户数据的会计师而言，这些都是有意义的缓释因素。但同一套公开材料也说明，风险章节不能简单写成“安全已解决”。Basis
              的安全页面仍写着 GDPR 和 CCPA “即将推出”，公开隐私政策称企业产品隐私条款存在于单独书面协议中，SOC 2 报告和其他合规文件也只在 NDA 或请求后提供。NIST 的 AI RMF、NIST
              更广泛的 AI 治理工作和 SP 800-53
              都指向同一个方向：风险管理是一套持续控制纪律，不是一次性徽章。因此，承保问题不是缺少安全主张，而是缺少公开证据来说明这些控制在真实客户工作负载下如何表现，模型供应商和子处理方如何治理，以及生产环境中可度量的残余错误、事件或覆盖率长什么样。
