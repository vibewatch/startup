        - 声称收入增长 4x，并吸收 47% 的结账任务
        - 可作为 AI 结账自动化采用率的早期同业参照
        - 估值未公开披露
      - - Ramp
        - 私营金融科技 AI
        - 2026 年 6 月：估值 $44B；年化收入超过 $1B
        - 70k+ 客户，累计融资超过 $3B
        - 展示 AI 金融科技里可见分母能支撑什么体量
        - 支出和支付平台远比 Basis 宽
