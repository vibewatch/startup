  - id: TV004
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 核心假设
      - 估值逻辑
      - 概率信号
      - 关键风险
    rows:
      - - 悲观
        - ARR 只有 $25M-$40M；买方把 Basis 重新定价到普通软件风险区间。
        - 8x-12x 收入意味着价值约 $0.2B-$0.48B。
        - 如果部署停滞、错误率反噬，或软件倍数继续压缩，这最可能发生。
        - 该轮估值会明显高于最终跑出来的经济性。
      - - 基准
        - ARR 达到约 $50M-$75M，经济性像软件但不算顶尖。
        - 12x-16x 收入意味着价值约 $0.6B-$1.2B。
        - 如果 Basis 确实成立、但阶段仍早于私募估值所暗示的成熟度，这是最可信情景。
        - 当前价格只有在 Basis 已接近该区间顶部时才说得通。
      - - 乐观
        - ARR 达到约 $80M-$120M，留存、标准化和高质量毛利都很强。
        - 15x-20x 收入意味着价值约 $1.2B-$2.4B。
        - 需要异常强的增长，再叠加可复制的头部事务所扩张。
        - 主要风险是在经济性披露前就假设高端 AI 倍数。
      - - 当前参考估值
        - 未披露公开分母。
        - 2026 年 2 月融资把当前市场价格标在约 $1.15B。
        - 可作为私募清算价参考，不能证明公允价值。
        - 价格可能比怀疑者预期更久地高于上市可比逻辑。
    notes: 情景数值是分析敏感性区间，不是公司指引。它把估值反拆为 ARR 和倍数组合，让下行和上行明示出来，而不是藏在假设里。
    claimRefs:
      - CV002
