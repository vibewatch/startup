      - 可监控触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 受监管工作流输出质量失败
        - 经验证的错误或异常指标
        - 税务或审计工作流逃逸率超过约定阈值，或造成重大客户补救事件。
        - 暂停扩张到该工作流，直到控制、复核和基准证据改善。
      - - 安全 / 隐私恶化
        - 认证、事件披露或客户通知
        - 重大事件、失去认证，或信任材料范围受限。
        - 上调风险评级，并要求更新控制包后再推进。
      - - 模型供应商集中冲击
        - 供应商或政策变化
        - 重大模型访问、定价、安全政策或延迟变化，且没有证明可行的后备路径。
        - 套用依赖折价，并要求冗余计划。
      - - 客户集中度破裂
        - 具名标识流失或合作关系逆转
        - 失去标杆事务所、续约失败，或背书集合缩小。
        - 重新评估增长持久性和商业可信度。
      - - 监管 / 准则压力上升
        - IRS、PCAOB、SEC、FTC 或州隐私行动
        - 新规则、指引或执法重大改变允许的工作流设计或披露预期。
        - 延后承销，直到客户和供应商控制更新。
      - - 尽调包仍不完整
        - 私下证据请求完成度
        - 尽调周期后仍没有量化准确率、合同分配、集中度或模型治理证据。
        - 将其视为继续研究 / 不承销结果，而不是强行给出干净通过。
    notes: 触发项这样设计，是为了让投资人或买方不用依赖模糊情绪变化也能监控。
