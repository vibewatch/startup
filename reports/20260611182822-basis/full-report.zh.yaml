      - number: '2.3'
        title: 需求驱动、采用节奏与约束
        blocks:
          - type: paragraph
            body: >-
              最大驱动因素是会计师劳动力短缺。BLS 仍预计每年有 124,200 个岗位空缺，薪资中位数已升至 $81,680，行业主导的报道持续描述结构性疲弱的人才管道。NPAG 专为解决短缺而成立；NYSSCPA 对
              AICPA 工作的总结强调学生转入会计专业的转化疲弱；The CPA Journal 则把人手不足与上升的报告和审计质量风险联系起来。换句话说，事务所需要
              Basis，不是因为会计很时髦；它们需要杠杆，是因为劳动力市场紧、贵，而且运营脆弱。薪酬成本上升进一步强化这种压力。2026 年 3 月 Employment Cost Index 显示，民用劳动者工资同比增长
              3.4%；这不是会计专属数据，但仍支持劳动力成本持续通胀的大背景。


              第二个驱动因素是流程复杂度。会计工作由截止日期驱动、受监管且复核密集。PCAOB 经 SEC
              批准的技术辅助分析案卷强调，技术正更深嵌入审计程序，但控制门槛更高而不是更低。这为能让工作更可复核、更一致、更可追踪的工具创造了有利环境；也会压制任何承诺“完全自主”却没有清晰控制的供应商。Thomson
              Reuters 的 2026 年数据很好地捕捉了采用阶段：GenAI 使用快速上升，但代理式 AI 和 ROI 衡量仍处早期。买方想要 AI，但强制要求仍不常见，正式 ROI 纪律仍薄。这意味着 Basis
              进入了一个接受度高的市场，但仍需要重度建立信任、实施支持，并证明能减少复核者工作量。
