        blocks:
          - type: paragraph
            body: >-
              创始人记录比融资报道中可见的运营叙事更宽。种子轮和后续融资材料持续把 Matthew Harpe 和 Mitchell Troyanovsky 列为最贴近商业发布的联合创始人，其中 Harpe 是最清晰的公开
              CEO 声音，Troyanovsky 则在后来的 Codex 客户聚焦中作为面向产品的联合创始人出现。另一批保留的创始人材料和 Citybiz 的 Series A 报道还把 Zenna
              Tavares、Emily Mackevicius 和 Eli Bingham 识别为联合创始人，因此本章可支撑 Basis
              拥有五人创始团队，尽管公开材料强调的是不同子集。五人中四人的简要背景也有支撑：外部资料称 Harpe 曾任 Boston Consulting Group 和 SoftBank 高管；Basis 和
              Tavares 自己的网站称 Zenna 是推理研究者、前 Columbia 创新学者和 MIT Ph.D.；Basis 称 Mackevicius 是 Columbia 训练的博士后研究员和 MIT
              Ph.D.，负责 Collaborative Intelligent Systems；Basis 称 Bingham 是 Broad Institute 研究员、Pyro 共同创造者，曾任 Uber AI
              Labs 高级研究科学家。相比之下，保留的公开材料把 Troyanovsky 识别为联合创始人和面向产品的代表，但未提供更完整的 Basis
              之前履历。公开披露仍未清晰映射五位创始人的运营头衔、治理角色或股权。Annette Garcia 被明确披露为 2024 年加入的第五名全职员工，如今负责 Accounting Product
              Operations；这说明 Basis 正把从业者专长嵌入产品开发，而不是把平台完全交给工程师。Series B 之后，治理也更可读：Accel 的 Miles Clements 加入董事会，董事会此前已通过
              Khosla Ventures 纳入 Keith
              Rabois。即便如此，已披露的管理层仍然集中：创始人仍主导产品叙事、战略定位和外部沟通，因此在管理层发布更完整的高管名单和董事会图谱之前，关键人物依赖应被视为真实存在。
