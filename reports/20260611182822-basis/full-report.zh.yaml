      - number: '5.3'
        title: 部署、集成、可靠性与支持
        blocks:
          - type: paragraph
            body: >-
              Basis 拥有有意义的公开部署验证，但公开实施细节仍不完整。Wiss 称其在 2023 年末 beta 测试 Basis，成功后扩大到完整 CAS 部署；Baker Tilly 则把与 Basis
              的关系定位为横跨数千名会计客户的规模化合作。官网补充了关于月结提速和强上线导入支持的具名证言，招聘页面称 Basis 已在头部会计事务所部署，并在每位会计师背后拥有数百个代理。安全材料支撑其对备份、事件响应、基于
              token 的访问、加密和 MFA 的严肃态度。缺失细节恰恰在买方最需要的地方：经复核的公开记录没有发布完整生产集成列表、具体 ERP
              或税务引擎连接器、可用性承诺、公开状态历史，或软件与实施服务之间按流程划分的服务边界。这种不透明不意味着集成或 SLA
              不存在；它意味着公开尽调表面不完整。对投资人来说，这是典型的企业软件承销问题：客户验证可见，但部署可复现性和可靠性边界仍需直接尽调。
