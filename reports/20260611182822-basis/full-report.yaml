  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - ARR and retention
        - MRR or ARR bridge, NRR, logo retention, and expansion ARR by cohort.
        - Without the denominator, the valuation cannot be tested against any multiple discipline.
        - 'Finance diligence: request monthly board pack KPI pages and cohort tables.'
      - - Cap table and preferences
        - Fully diluted ownership, preference stack, option-pool refreshes, secondaries, and any debt.
        - Common-equity returns depend on more than enterprise value headlines.
        - 'Legal and financing diligence: request cap table, charter, term sheet, and side letters.'
      - - Margin and services burden
        - Software versus services mix, gross margin by workflow, onboarding intensity, and support staffing.
        - A premium software multiple is only justified if automation economics are actually software-like.
        - 'FP&A diligence: request segment P&L and implementation economics.'
      - - Customer quality
        - Top-customer concentration, renewal performance, standard implementation timeline, and win-loss data.
        - Top-25 penetration matters only if it compounds and renews.
        - 'Commercial diligence: customer calls plus CRM and renewal export review.'
      - - Risk controls
        - >-
          Live error-rate tracking, escalation paths, privacy controls, audit trail completeness, and model-governance
          documentation.
        - Tax and audit automation carries a much narrower tolerance for failure than generic copilots.
        - 'Product and compliance diligence: request control matrix, incident logs, and QA scorecards.'
    notes: >-
      These are the minimum diligence asks required to move from an interesting company at a real price to an
      underwriteable investment at that same price.
    claimRefs:
