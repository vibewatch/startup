  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Definition and Scope
        blocks:
          - type: paragraph
            body: >-
              Basis should be analyzed against the market for professional accounting-firm workflow automation, not
              against every dollar spent on finance software or every accountant employed in the economy. The company
              itself positions the product across CAS, tax, audit, and advisory, which aligns most directly with public
              accounting firms selling recurring and project-based professional services to clients. BLS occupation
              definitions confirm that accounting labor spans public accountants, management accountants, government
              accountants, and auditors, so the broad accounting labor market is larger than Basis's immediate buying
              center. That distinction matters because much of the software market serves controllers, CFOs, payroll
              teams, or industry-specific finance operations rather than CPA firms.


              The included spend for this chapter is therefore: public accounting service revenue, software and workflow
              tooling sold into accounting firms, and adjacent automation budgets that can replace or augment accountant
              labor inside firms. Excluded or only partially included spend is corporate ERP, general AP automation, and
              internal controllership software bought by enterprise finance teams unless those tools act as practical
              substitutes for the same accounting work Basis wants to automate. This boundary keeps the chapter honest.
              It preserves the large outer envelope of accounting spend while avoiding the mistake of treating every
              bookkeeping, payroll, or finance-ERP dollar as equally addressable by a firm-focused agent platform.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM012
              - CM049
              - CM052
              - CM053
              - CM054
