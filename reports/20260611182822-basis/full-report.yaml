      - number: '3.2'
        title: 'Direct accounting-native peers: Botkeeper, Truewind, and Digits'
        blocks:
          - type: paragraph
            body: >-
              Botkeeper, Truewind, and Digits each overlap with a meaningful part of the Basis story, but in different
              ways. Botkeeper is explicitly built for accounting firms and already claims more than 200 firms and
              5,000-plus business clients, which gives it real installed-base credibility; at the same time, it still
              frames the offer as a blend of AI, support, and dedicated help rather than as a multi-practice agent
              platform. Truewind is closer on review-first workflow automation, but its public positioning stays
              concentrated on close, reconciliation, transaction coding, and schedule preparation while keeping Sage or
              QBO as the source of truth. Digits is the most structurally ambitious of the three because it sells an
              AI-native ledger, publishes entry pricing, and pushes firms toward a branded client experience plus
              agentic close operations. Together these peers show that Basis is not alone in trying to automate
              accountant workflows, but they also show that the market is fragmented between service-heavy bookkeeping,
              close-centric copilot layers, and full ledger replacement. Basis’s differentiation claim is strongest when
              the buyer wants reviewable execution across multiple practice lines rather than only bookkeeping or close
              acceleration.
