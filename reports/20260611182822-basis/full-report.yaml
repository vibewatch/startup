      - number: '8.3'
        title: Comparable frame and why traditional multiple underwriting is limited
        blocks:
          - type: paragraph
            body: >-
              Basis does not fit one pure comp bucket, which is why valuation discipline matters. On the private side,
              Numeric and Truewind show that investors are still funding accounting automation aggressively, but those
              companies disclose round sizes and product ambitions more readily than valuations. Ramp is farther afield,
              yet it is useful because it shows 2026 private appetite for an AI-led fintech platform can still be
              enormous when revenue scale is visible: more than $1 billion of annualized revenue sits underneath a $44
              billion private mark. On the public side, the comp signal is sobering. Yahoo Finance showed Intuit at
              roughly 3.8x sales, Workiva at roughly 3.0x, BlackLine at roughly 2.6x, and BILL at roughly 2.1x on the
              run date. Filings reinforce that these are real software businesses with audited revenue and substantial
              gross margins. Aventis’s broader 2026 software work is directionally similar: about 3.4x median public EV
              or revenue and about 3.1x private SaaS M&A. Basis can deserve a premium to that cluster because it may be
              earlier, faster-growing, and category-shaping, but public evidence does not yet justify assuming a premium
              so wide that valuation support becomes irrelevant. Put differently, there is not enough disclosed revenue,
              margin, or burn data to underwrite Basis cleanly with a traditional EV or revenue multiple today, so
              scenario logic is more honest than fake precision.
