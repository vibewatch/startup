  - id: TV004
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation logic
      - Probability signal
      - Key risk
    rows:
      - - Bear
        - ARR only $25M-$40M; buyers re-rate Basis closer to ordinary software risk bands.
        - 8x-12x revenue implies roughly $0.2B-$0.48B of value.
        - Most likely if deployments stall, error rates bite, or software multiples compress further.
        - The round would have materially over-shot realized economics.
      - - Base
        - ARR reaches roughly $50M-$75M with solid but not elite software-like economics.
        - 12x-16x revenue implies roughly $0.6B-$1.2B.
        - Most plausible if Basis is real but still earlier than the private mark implies.
        - Current price only works if Basis is already near the top of this band.
      - - Bull
        - ARR reaches roughly $80M-$120M with strong retention, standardization, and high-quality margins.
        - 15x-20x revenue implies roughly $1.2B-$2.4B.
        - Requires unusually strong growth plus repeatable top-firm expansion.
        - The main risk is assuming premium AI multiples before economics are disclosed.
      - - Current reference mark
        - No public denominator disclosed.
        - The February 2026 round marks the market at about $1.15B today.
        - Useful as a private clearing price, not as proof of fair value.
        - Price can remain above public-comp logic for longer than skeptics expect.
    notes: >-
      Scenario values are analytical sensitivity bands, not company guidance. They reverse-engineer the valuation into
      ARR and multiple combinations so downside and upside are explicit rather than implied.
    claimRefs:
      - CV002
      - CV044
      - CV045
      - CV046
      - CV047
      - CV048
      - CV059
      - CV060
      - CV061
  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Economic opacity persists
        - ARR, NRR, gross margin, and services mix remain undisclosed after diligence access.
        - The mark stays belief-driven rather than evidence-driven.
        - Do not treat the February 2026 price as investable.
      - - Quality or control failure in live workflows
        - Material hallucination, privacy, or supervision issue in tax or audit production use.
        - Buyers in high-stakes accounting workflows will re-rate trust very quickly.
        - Move to avoid unless price resets dramatically and controls are remediated.
      - - Comp multiple compression continues
        - Public accounting software bands fall below already-compressed March 2026 levels.
        - Basis loses the premium-band support needed for a private-growth exception.
        - Re-cut bear/base values and raise return hurdle.
      - - Partner proof does not convert to durable expansion
        - Named firms stay reference accounts but do not show renewal or cross-practice growth.
        - The thesis shifts from scalable platform to impressive pilot vendor.
        - Shift from active diligence to watchlist.
    notes: >-
      These are monitorable breakpoints, not generic risks. Each trigger is designed to tell an investor when the
      current price no longer deserves the assumed premium.
