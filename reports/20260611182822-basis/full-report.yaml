      - number: '1.3'
        title: Funding history, investor base, and stakeholder map
        blocks:
          - type: paragraph
            body: >-
              Basis now has a coherent public capital history even if finer points of the cap table remain private. The
              company emerged publicly with a $3.6 million seed round in October 2023, raised a $34 million Series A led
              by Khosla Ventures in December 2024, and then announced a $100 million Series B at a $1.15 billion
              valuation in February 2026. Reconciling those rounds gives roughly $137.6 million raised, which several
              outside publications round to about $138 million. The Series B syndicate materially broadened the
              stakeholder base: Accel and GV entered as lead names, Khosla doubled down, and other backers and angels
              from across software, infrastructure, and finance remained involved. That investor roster matters because
              it gives Basis more than just capital; it also adds distribution, hiring, and strategic credibility with
              accounting firms, model labs, and future enterprise buyers. The important public gap is what is not
              disclosed: there is no evidence in the retained source set of debt, warehouse financing, tender activity,
              or other secondaries, so the equity story is visible but the complete capital-structure story is not.
