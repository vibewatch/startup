      - number: '7.4'
        title: Foundation-model dependence, incumbent competition, and concentration can all compress upside
        blocks:
          - type: paragraph
            body: >-
              Basis is not competing in a vacuum. Public market and product evidence shows a fast-growing, AI-enabled
              finance and ERP market, but also a field where much larger vendors already bundle trusted content,
              disclosure workflows, tax engines, and embedded distribution. Workiva markets AI for financial reporting,
              audit, risk, and SOX readiness; Thomson Reuters markets citation-backed CoCounsel Audit and CoCounsel Tax
              plus AI-infused ONESOURCE workflows; and Intuit is pushing Intuit Assist across QuickBooks and tax
              preparation. Workiva’s own 10-K says competition spans diversified enterprise software providers, niche
              vendors, GRC vendors, and professional-services alternatives, and expects both larger and more specialized
              vendors to intensify competition further. Basis’s customer proof is impressive but still publicly narrow,
              centered on a small set of named firms and partnerships rather than a disclosed broad customer base,
              retention profile, or top-customer exposure. Model dependence is also only partially visible. Workiva
              openly says its AI stack currently uses frontier models from Google, AWS/Anthropic, and Microsoft/OpenAI,
              while Basis’s public surface highlights OpenAI/Codex and “trusted agents” messaging but does not publicly
              spell out production model redundancy or fallback architecture on the main security/legal pages. That
              leaves Basis exposed to platform, model-cost, or partner-policy changes at the same time incumbents keep
              narrowing the product gap.
