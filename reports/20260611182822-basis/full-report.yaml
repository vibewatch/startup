      - number: '3.5'
        title: Switching costs, moat durability, and the adverse angle
        blocks:
          - type: paragraph
            body: >-
              The best case for Basis is that workflow depth, reviewability, and multi-practice accounting-native design
              create a durable wedge that generic copilots and point solutions cannot easily match. Public customer
              proof supports that argument: Wiss explicitly contrasted Copilot with Basis and said the transformative
              piece was integrated end-to-end automation, not generic AI availability. OpenAI and Basis also frame
              product progress as compounding with model improvements, which can widen the set of workflows Basis can
              safely own. The adverse case is just as important. Model progress can also commoditize assistant features
              and narrow the gap between specialized platforms and bundle-rich incumbents. Public trust claims are
              converging across vendors, so security alone is not a moat. Published prices from Botkeeper and Digits put
              downward pressure on perceived value, while QuickBooks and Microsoft can use existing distribution to make
              “good enough” AI feel cheaper and easier to adopt. The result is a moat that looks real but conditional:
              Basis appears strongest when a firm wants accounting-native, reviewable workflow ownership across multiple
              practices; it looks weaker when the buyer optimizes for bundle leverage, outsourcing, or transparent
              low-entry pricing rather than deep process control.
