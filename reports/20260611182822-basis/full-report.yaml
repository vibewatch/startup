      - number: '2.4'
        title: Buyer Segmentation by Firm Size and Competitive Dynamics
        blocks:
          - type: paragraph
            body: >-
              The best public fit for Basis is larger public-accounting firms, especially firms with enough volume and
              process standardization to justify multi-practice automation. Basis's own public footprint, plus the Wiss
              rollout, supports this. The product is framed across CAS, tax, audit, and advisory, and the strongest
              public logo proof is not a tiny local firm but a Top 100-style buyer using the product as a force
              multiplier. This matters because the adoption path varies sharply by firm size. National and Top 100
              regional firms can fund experimentation through innovation, CIO, or practice-transformation budgets; they
              also have enough workflow repetition for AI to generate visible leverage. Mid-market firms may still
              adopt, but are more price-sensitive and more likely to compare Basis against incumbent stack extensions or
              tech-enabled service alternatives.


              Competitive pressure is already broad. Intuit is actively repackaging QuickBooks for firms around
              AI-powered workflows and unified data; Sage and Xero position themselves as accountant-focused cloud
              systems; Botkeeper and Pilot sell human-plus-software operating models; Numeric and Digits attack close
              and ledger workflows with explicit automation claims. The market is therefore not waiting for Basis to
              define the category. Basis's edge is that it is selling vertical, end-to-end workflow execution into the
              accounting-firm context, where talent scarcity, quality thresholds, and firm economics collide. Its risk
              is that incumbents own existing workflow surfaces and narrower vendors may deliver clearer ROI or easier
              implementation. Public evidence supports a strong early wedge in top-tier firms, but not yet a universally
              won category.
