  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Basis’s public financial surface looks like enterprise software sold into accounting firms, not consumer
              SaaS. The home page shows practice-area modules across CAS, tax, audit, and advisory, but no checkout flow
              or price table; the legal pages repeatedly route commercial use through written MSAs, order forms, and
              separate enterprise agreements. That combination implies quote-based contracts, negotiated scope, and
              workflow-specific deployment rather than transparent seat-based self-service pricing.


              Because Basis sells automation into high-stakes accounting work, the likely revenue model blends recurring
              platform fees with onboarding, workflow configuration, support, and perhaps partner-specific deployment
              work. Home-page testimonials span multiple firms and practice areas, while Wiss and OpenAI describe
              multi-step workflows, human review, and measurable capacity gains. Public evidence is strong enough to say
              Basis monetizes enterprise workflow automation for accounting firms. It is not strong enough to disclose
              realized ACVs, discount bands, minimum contract sizes, or the split between software and services.
