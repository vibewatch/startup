companyProfile:
  summary: >-
    Basis is a New York-based private software company building long-horizon AI agents for accounting firms. Public
    materials show the platform spanning client accounting services, tax, audit, and advisory workflows, with an
    emphasis on end-to-end task completion plus human review rather than suggestion-only copilots. The company has
    assembled a hybrid founding team that combines commercial operators with deep probabilistic-programming and research
    talent, then raised seed, Series A, and Series B funding from specialized fintech and frontier-AI investors. Public
    proof is strongest at named firms such as Wiss, Baker Tilly, and UHY, plus the broader claim that Basis reaches
    roughly 30% of the top 25 U.S. accounting firms. The main limitation is economic opacity: revenue, ARR, retention,
    margin, burn, and customer concentration remain undisclosed.
