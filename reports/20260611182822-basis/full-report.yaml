  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk overview and why underwriting is still blocked
        blocks:
          - type: paragraph
            body: >-
              The highest-severity risk around Basis is not generic “AI risk”; it is the interaction between AI-output
              fallibility and professional services work that carries statutory, standards-based, and reputational
              liability. Basis now markets one platform across CAS, tax, audit, and advisory, which means a single
              model, control, or workflow weakness can propagate across multiple regulated accounting surfaces rather
              than staying confined to a low-stakes back-office task. Public mitigants are real. Basis says it is SOC 2
              Type II, ISO 27001, and ISO 42001 certified, keeps data in the U.S., does not train on customer data, and
              logs agent actions. The legal terms are also unusually explicit that AI outputs are not a substitute for
              professional judgment and must be reviewed before they are used in filings, client deliverables, or
              professional work product. Those controls matter, but they do not answer the underwriter’s harder
              questions: what are the observed hallucination or exception rates in tax and audit workflows, how is
              liability allocated in enterprise contracts, how concentrated is the customer base, and what happens if a
              key model provider, security certification, or integration path changes suddenly.
            claimRefs:
