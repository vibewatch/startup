              assumptions, source material, and logic to reviewers, aligning with Basis’s public promise of traceable
              AI. Separate Basis engineering posts add an important nuance: the company appears to run an agent-native
              internal operating model with APO, Atlas, eval-heavy engineering practices, and internal tool
              orchestration through a unified MCP. Those posts are valuable developer-signal evidence for engineering
              seriousness and internal process maturity, but they are not direct proof that every customer-facing
