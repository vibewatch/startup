            body: >-
              Public demand proxies are real but selective. Basis and third parties repeatedly state the company works
              with roughly 30% of the top 25 accounting firms, and Wiss says a beta in CAS expanded to full deployment
              with internal adoption rising month over month. Baker Tilly’s 2026 collaboration adds another scaled buyer
              using Basis for transaction processing, journal entry support, reconciliations, and post-close reporting.
              The home page also features testimonials from Wiss, UHY, Clark Nuber, Boulay, and BPB, which is unusually
              concrete customer proof for an early vertical-AI vendor.


              What is missing is the part investors actually underwrite: contract duration, net revenue retention, win
              rates, sales cycle length, realized pricing, and customer concentration. OpenAI’s case study says firms
              report up to 30% time savings on average, and company-linked funding coverage cites 20% to 50% efficiency
              gains, so Basis is clearly selling on capacity expansion and faster review cycles. But those ROI signals
              are still company-channeled or partner-quoted, not audited revenue data. The GTM story is credible
              enterprise adoption; the revenue-quality story remains unproven.
