      - number: '1.4'
        title: Scale signals, customer proof, and enterprise-readiness posture
        blocks:
          - type: paragraph
            body: >-
              Basis discloses more about traction quality than about absolute scale. The strongest current signal is not
              a raw customer count but penetration into large firms: Basis says it works with about 30% of the Top 25
              accounting firms, while its own careers page claims the company is deployed with top firms and operates
              hundreds of agents behind every accountant. Public proof points are also stronger than generic logo lists.
              Wiss disclosed a beta starting in November 2023 and a wider CAS rollout in September 2024, and Basis
              announced a 2026 collaboration with Baker Tilly aimed at automation across thousands of accounting
              clients. Product breadth has also moved beyond early CAS positioning; by 2026 public materials describe
              deployments across CAS, tax, and audit, including a showcased end-to-end 1065 tax workflow. Security
              posture is another current signal. Basis says it is SOC 2 Type II, ISO 27001, and ISO 42001 certified,
              keeps data in the United States, avoids model training on customer data, and provides audit trails for
              agent actions. The major caveat is disclosure opacity: no retained source supports current ARR, revenue,
              exact headcount, or precise office footprint, and the security page still listed GDPR and CCPA as coming
              soon.
