      - number: '7.5'
        title: Underwriting blockers, mitigation maturity, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Basis is not uninvestable on public evidence; it is under-documented for a clean risk discount. The public
              record supports real mitigants—security certifications, no-training claims, audit logs, human-review
              requirements, major-firm customer proof, and a product surface broad enough to matter. But it also leaves
              several blockers unresolved. There is no public evidence of measured production accuracy, error-severity
              rates, exception handling, or rework on tax and audit tasks; no public customer-concentration or retention
              data; no public DPA, security exhibit, or indemnity schedule showing where liability sits when an
              AI-generated workflow contributes to a bad filing or client loss; and no clear public map of
              model-provider concentration or resilience. Those are not cosmetic diligence asks. If Basis cannot show
              low escape rates, strong override controls, private-contract risk allocation, and diversified model
              governance, then the right call is to underwrite the company as a high-risk enablement vendor rather than
              as already-proven, mission-critical accounting infrastructure. The measurable kill triggers are
              straightforward: material security incidents, adverse regulatory findings, loss of a marquee customer,
              inability to maintain certifications, or failure to prove output quality on tax and audit workstreams.
