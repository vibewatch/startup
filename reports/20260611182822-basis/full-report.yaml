  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape categories and what actually counts as a competitor
        blocks:
          - type: paragraph
            body: >-
              The competitor set for Basis should be split by job-to-be-done rather than by any product that happens to
              mention AI. Basis markets agents that execute accounting workflows across CAS, tax, audit, and advisory,
              then return review-ready output to accountants. That makes its closest direct peers the vendors that also
              try to own accounting workflow execution inside firms, not just surface a chat box or automate one
              subtask. On retained public evidence, Botkeeper, Truewind, and Digits are the most relevant direct
              comparisons because they are accounting-native, workflow-aware, and sold into accountants or accounting
              firms. Pilot overlaps at the customer-outcome level but uses a more services-heavy model. Vic.ai and BILL
              are narrower AP specialists. QuickBooks and Microsoft matter because they can arrive through existing
              software budgets and familiar interfaces, even when they are not the deepest accounting-native systems.
              That category split matters because Basis can be best-in-class on workflow depth and still lose budget to
              incumbents, substitutes, or service models if the buyer prioritizes installed-base leverage, lower
              published prices, or outsourced outcomes over a new platform.
            claimRefs:
