      - number: '8.5'
        title: Exit readiness, thesis-breaks, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is the missing bridge between strategic excitement and investable valuation. Basis may be
              building a category-leading workflow layer for accounting firms, but the public record is not yet
              IPO-ready and does not show enough economics or control detail to support a traditional exit-underwriting
              case. The realistic near-term path is continued private compounding, not a clean public-market handoff.
              That makes downside triggers unusually important: if economics stay opaque, if AI-control failures surface
              in tax or audit work, or if partner proof never converts into durable expansion, the investment case can
              deteriorate faster than the product narrative. The final diligence list is therefore non-optional. Until
              ARR, retention, services mix, control evidence, and the preference stack are visible, Basis should stay in
              the active work queue, but the current price should not be treated as fully validated.
            claimRefs:
