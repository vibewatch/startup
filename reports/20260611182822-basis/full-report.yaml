  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price-sensitive verdict and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Basis has crossed the most important headline threshold for a young vertical-AI company: a February 2026
              Series B put the company at about $1.15 billion with blue-chip sponsors and real accounting-firm
              penetration. That matters. The top-line story is stronger than generic “AI for finance” marketing because
              the evidence set includes top-25 firm penetration, a Baker Tilly channel-style collaboration, and an
              OpenAI case study pointing to measurable time savings. Those are not enough, however, to convert the
              current mark into an automatic underwriting pass. The public record still does not disclose ARR, revenue,
              retention, or burn, so the investor is effectively paying for leadership in a category that looks real but
              is still economically opaque. Public comp multiples for Intuit, Workiva, BlackLine, and BILL cluster
              around roughly 2x to 4x sales, and 2026 SaaS market context is materially less forgiving than 2021. That
              leaves the recommendation price-sensitive rather than categorical: Basis looks strategically interesting
              and commercially plausible, but at the current mark the disciplined call is research-more, with medium
              confidence, high risk, and a stretched valuation stance rather than buy-first and diligence-later.
