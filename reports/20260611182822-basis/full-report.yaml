      - number: '4.4'
        title: Capital Adequacy and Financing Dependency
        blocks:
          - type: paragraph
            body: >-
              Basis has raised disclosed equity in three steps: a $3.6 million seed, a $34 million Series A, and a $100
              million Series B at a $1.15 billion valuation. That is roughly $137.6 million of disclosed equity
              financing since formation, and no retrieved source describes venture debt, project finance, or other
              leverage. Relative to most vertical-AI startups, that is a strong capital base. The Series B use of
              proceeds — accelerating platform development and expanding engineering and machine learning teams — also
              reads as offensive investment rather than rescue financing.


              The limitation is that funding does not equal cash. Basis discloses no cash balance, burn, or revenue
              contribution, so runway can only be illustrated, not known. A simple scenario using only the fresh $100
              million round implies about 18 to 33 months of runway if monthly burn falls around $3.0 million to $5.5
              million; actual runway could be longer if prior capital remains or if recurring revenue offsets spend.
              Even so, financing dependency is not gone. Basis is scaling a security-heavy, model-dependent, enterprise
              deployment business, and the next financing trigger will likely depend on whether adoption headlines
              convert into realized pricing, gross margin after support, and repeatable expansion within large firms.
            claimRefs:
