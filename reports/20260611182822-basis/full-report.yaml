      - number: '8.2'
        title: Current financing context, capital efficiency, and dilution
        blocks:
          - type: paragraph
            body: >-
              The mark itself is real enough; the denominator is the problem. Basis raised $100 million at about $1.15
              billion and now shows roughly $138 million of total disclosed capital raised. On paper that looks
              capital-efficient: cumulative capital raised is only about one-eighth of the current headline valuation.
              It also implies modest new-money dilution for the latest round, roughly high-single-digits if the quoted
              valuation is treated as post-money. That is the good news. The harder question is whether the apparent
              efficiency reflects genuine economic leverage or simply forward pricing from investors who are
              underwriting category leadership before the company discloses its revenue base. Public sources do not show
              venture debt, secondary stock sales, liquidation preferences, or whether the common-equity entry is
              cleaner or messier than the unicorn headline suggests. The practical valuation takeaway is that Basis has
              probably reduced near-term financing risk, but it has not removed dilution risk. If the company later
              needs another round before economics are broadly validated, the hidden variables in the cap table and
              preference stack could matter more to return outcomes than the current post itself.
