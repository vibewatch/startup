      - number: '4.3'
        title: Cost Structure and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              Basis does not look like a low-support wrapper around a generic model. The security page advertises SOC 2
              Type II, ISO 27001, ISO 42001, U.S.-only hosting, MFA, audit logs, backups, and third-party testing. The
              legal terms add that AI outputs are not a substitute for professional judgment and require human review
              and verification. Those commitments are commercially helpful in accounting, but they also imply fixed
              compliance, infrastructure, and customer-success costs before each additional dollar of gross profit.


              Public comparables reinforce that likely mix. Workiva’s 2025 10-K says 92% of revenue came from
              subscription and support fees, with the remainder from professional services, and warns services mix can
              affect gross margins. BILL’s 2025 10-K notes some annual subscriptions but also open-ended arrangements,
              pricing sensitivity, and selling costs, while reporting 81.7% GAAP and 85.0% non-GAAP gross margin at
              scale. Basis may eventually resemble high-margin software, but the public record today supports a
              nearer-term model of enterprise software plus onboarding, partner rollout, and model-vendor expense rather
              than pure software economics already achieved.
