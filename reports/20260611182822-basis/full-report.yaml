          - type: callout
            title: Opacity is the core anti-thesis
            body: >-
              The cleanest bearish argument is not that Basis lacks customers; it is that investors may be underwriting
              a premium multiple without public evidence on ARR, retention, margin, or preference terms.
            calloutType: risk
