      - number: '7.2'
        title: Professional standards, CPA liability, and regulatory risk are first-order issues
        blocks:
          - type: paragraph
            body: >-
              Basis is explicitly selling into work that sits close to GAAP interpretation, tax-return handling, audit
              evidence, and SOX-oriented control processes. That matters because the governing standards put the burden
              of judgment on licensed firms and engagement teams, not on the tool vendor. Basis’s own terms state that
              outputs are informational and assistive only, may contain errors or omissions, and are not a substitute
              for accounting, tax, audit, legal, or financial advice. Journal of Accountancy and CPAI materials
              reinforce the same point from the buyer side: generative AI can misapply standards, hallucinate, or
              mishandle confidential client data, and blind reliance can turn a workflow convenience into a negligence
              or professional-liability problem. The tax side is especially sensitive. IRS Publication 4557 says
              protecting taxpayer data is the law and points firms to FTC Safeguards Rule obligations, while 26 U.S.C.
              §7216 criminalizes certain unauthorized disclosure or use of return information. On the audit side, PCAOB
              AS 1105 requires sufficient appropriate audit evidence and places special weight on the reliability and
              independence of evidence sources, which makes any AI-summarized or AI-transformed evidence chain a
              diligence item. Basis can support the workflow, but the public record does not yet show enough quantified
              control evidence to assume those liabilities are economically or operationally transferred away from the
              firm.
            claimRefs:
