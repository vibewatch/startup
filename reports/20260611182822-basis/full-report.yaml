      - number: '3.3'
        title: Incumbents, adjacent substitutes, and the status quo
        blocks:
          - type: paragraph
            body: >-
              The biggest mistake in competitive analysis would be to compare Basis only against other startup vendors.
              Pilot, Vic.ai, BILL, QuickBooks, Microsoft, and the internal-build status quo all attack the same labor
              pool from different angles. Pilot offers bookkeeping, tax, and CFO services for startups and small
              businesses, so it competes whenever the buyer wants an outside team more than a new software stack. Vic.ai
              and BILL are narrower, but AP specialists can still absorb automation budget and operational attention
              before a finance team or accounting firm commits to a broader workflow platform. Intuit Assist and
              Microsoft 365 Copilot are different again: they are not accounting-firm-native products on retained public
              evidence, yet they inherit distribution from QuickBooks and Microsoft 365, which lowers adoption friction
              for buyers who already live in those systems. The status quo is equally important. Firms already operate
              ledgers, spreadsheets, practice tools, reviewer habits, and client communication loops that create
              inertia. That means Basis does not just need to be better than one product; it needs to beat a bundle of
              existing software, human process, and familiar workflow shortcuts.
