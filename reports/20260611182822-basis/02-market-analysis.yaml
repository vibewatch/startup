- id: market-sizing
  title: TAM, SAM, and Evidence-Constrained Sizing
  body: 'The broadest supportable TAM lens is U.S. accounting services revenue. IBISWorld places the U.S. market at $157.4 billion in 2026, while AnythingResearch shows $145.4 billion in 2025 with a top-four share of 42.8%. Those numbers are directionally aligned — Basis is operating in a very large services pool — but they are not directly equivalent to software spend or to Basis''s monetizable surface. On the software side, The Business Research Company, Mordor Intelligence, and Precedence all put the global accounting-software market around $21 billion to $23 billion in 2025-2026, with North America at about 38% of the total in the sources that disclose regional share. That implies an outer-bound North American software spend of roughly $8 billion to $9 billion before adjusting for the fact that Basis targets accounting firms rather than all corporate finance users.


    A precise SAM for “AI automation sold to accounting firms across CAS, tax, and audit” is not publicly disclosed. The best public approach is to treat North American accounting software as an upper bound and then narrow by buyer type. Intuit, Sage, and Xero all already sell into accountants, while Botkeeper, Pilot, Numeric, and Digits show that buyers can solve the same pain through bookkeeping automation, tech-enabled services, close software, or AI-native ledgers. Basis''s near-term SAM is therefore the subset of larger U.S. accounting firms willing to adopt vertical, reviewable AI across multiple practices. Publicly, the strongest SOM proxy is not revenue share but penetration into about 30% of the Top 25 accounting firms. That is meaningful evidence of wedge strength, but not enough to calculate exact revenue share without pricing, seat-count, or ACV disclosure.'
