  evidenceGaps:
  - type: missing-source
    severity: material
    topic: Exact accounting-firm AI SAM
    missingEvidence: A public market estimate isolating software and automation spend by U.S. accounting firms, segmented by firm size and practice area.
    whyItMatters: Current public sources provide a broad services TAM and a broad software upper bound, but not a direct firm-only AI automation SAM for Basis.
    diligencePath: Request third-party market-study excerpts, Basis internal TAM model, and customer-spend segmentation by firm size, practice area, and module.
    relatedQuestionRefs:
    - QM027
    - QM031
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: Basis pricing and ACV distribution
    missingEvidence: Public pricing, contract structure, module packaging, seat economics, and ACV by firm tier.
    whyItMatters: Without pricing, the chapter cannot convert strong penetration signals into revenue-share or SOM estimates.
    diligencePath: Request price book, cohort-level contract values, implementation fees, renewal terms, and win-loss notes by segment.
    relatedQuestionRefs:
    - QM028
    - QM031
    relatedTableRefs:
    - TM002
    - TM003
  - type: missing-source
    severity: material
    topic: Independent benchmark evidence
    missingEvidence: Controlled, independent benchmarking of Basis accuracy, reviewer effort reduction, exception rates, and time-to-value against incumbent suites and narrower automation tools.
    whyItMatters: The market is crowded and public product pages are self-authored, so underwriting differentiation requires more than vendor claims and partner testimonials.
    diligencePath: Request benchmark studies, customer scorecards, implementation timelines, and documented before/after workflow metrics versus alternatives.
    relatedQuestionRefs:
    - QM025
    - QM032
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: minor
    topic: Firm-size adoption depth
    missingEvidence: A public breakdown of how deeply Basis is deployed within each firm tier, including modules live, users active, and client volume processed.
    whyItMatters: Current public evidence proves meaningful logo penetration but not the depth, breadth, or durability of adoption inside those firms.
    diligencePath: Request deployment-depth dashboards, module attach rates, user cohorts, and expansion / churn data by customer segment.
    relatedQuestionRefs:
    - QM024
    - QM028
    relatedTableRefs:
    - TM003
