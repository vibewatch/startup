- id: demand-drivers-and-adoption-constraints
  title: Demand Drivers, Adoption Timing, and Constraints
  body: 'The biggest driver is the accountant labor shortage. BLS still projects 124,200 openings per year, median pay has risen to $81,680, and profession-led reporting continues to describe a structurally weak pipeline. NPAG was formed specifically to address the shortage, NYSSCPA''s summary of the AICPA work highlights weak student conversion into accounting majors, and The CPA Journal ties understaffing to rising reporting and audit-quality risk. Put differently, firms do not need Basis because accounting is trendy; they need leverage because the labor market is tight, expensive, and operationally fragile. Rising compensation costs reinforce that pressure. The March 2026 Employment Cost Index shows 3.4% year-over-year wage growth for civilian workers, which is not accounting-specific but still supports a backdrop of persistent labor-cost inflation.


    The second driver is workflow complexity. Accounting work is deadline-driven, regulated, and review-intensive. PCAOB''s SEC-approved docket on technology-assisted analysis underscores that technology is being embedded deeper into audit procedures, but under a higher control bar rather than a lower one. This creates a favorable environment for tools that make work more reviewable, consistent, and traceable. It also creates a headwind for any vendor promising “fully autonomous” operation without clear controls. Thomson Reuters'' 2026 data captures the adoption stage well: GenAI use is rising fast, but agentic AI and ROI measurement remain early. Buyers want AI, yet mandates are still uncommon and formal ROI discipline remains thin. That means Basis is entering a receptive market, but one that still requires heavy trust-building, implementation support, and proof of reviewer-effort reduction.'
