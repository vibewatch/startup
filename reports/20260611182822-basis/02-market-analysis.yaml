- id: FM004
  title: Accounting-firm adoption path
  type: flow
  layout: standard
  summary: Public evidence suggests firms move from labor pain and pilot sponsorship toward controlled rollout rather than flipping directly to fully autonomous firm-wide deployment.
  data:
    nodes:
    - id: pain
      label: Talent shortage and margin pressure
      description: Staffing scarcity, wage pressure, and workload stress create the initial buying trigger for automation.
    - id: sponsor
      label: Partner / ops / innovation sponsor
      description: A practice leader or operations executive funds the pilot and defines where automation should start.
    - id: pilot
      label: CAS or tax pilot workflow
      description: Firms typically start in repetitive, reviewable workflows before expanding into audit or broader advisory work.
    - id: review
      label: Reviewer trust and controls
      description: Human review, auditability, and exception handling determine whether the tool can scale beyond a demo or narrow pilot.
    - id: rollout
      label: Firm-wide multi-practice rollout
      description: Once trust is established, firms expand across more clients, teams, and modules.
    - id: roi
      label: Measured ROI and renewal
      description: Long-term category winners will need documented reviewer-time savings, capacity gains, and retention proof.
    edges:
    - from: pain
      to: sponsor
      label: creates budget urgency
    - from: sponsor
      to: pilot
      label: chooses first workflow
    - from: pilot
      to: review
      label: must prove accuracy and control
    - from: review
      to: rollout
      label: trust enables scale
    - from: rollout
      to: roi
      label: expansion still requires measured outcomes
