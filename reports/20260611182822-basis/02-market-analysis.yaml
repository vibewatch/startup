tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance to Basis
  rows:
  - - Public accounting services
    - Audit, tax, CAS, advisory, and outsourced accounting revenue earned by CPA firms
    - Internal corporate accounting salaries and ERP licenses
    - Managing partners, practice leaders, firm operations budgets
    - Primary TAM envelope
  - - Bookkeeping / tax / payroll service bundles
    - Recurring SMB compliance and back-office work delivered by firms
    - DIY consumer tax software and pure consumer finance apps
    - Firm owners, CAS leaders, client-service line budgets
    - High relevance because Basis automates repetitive firm work
  - - Accounting-firm software stack
    - Practice tools, workflow software, accountant-focused cloud suites, automation budgets
    - Unrelated enterprise IT spend
    - CIO, COO, innovation lead, firm partners
    - Primary SAM boundary
  - - Corporate finance / controllership software
    - GL, close, AP, reporting, ERP, and finance-ops tooling
    - External CPA service revenue
    - Controllers, CFOs, finance IT
    - Adjacent substitute market, not Basis's first wedge
  - - Tech-enabled accounting substitutes
    - Hybrid software-plus-service offers from bookkeeping or finance providers
    - Pure manual local bookkeeping with no technology layer
    - SMB owners, finance leaders, some accounting firms
    - Important competitor class
  notes: Basis sits between public accounting labor spend and the software/tools budget used to compress that labor. The chapter excludes broad ERP spend except where it substitutes for the same job to be done.
