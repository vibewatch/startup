company:
  name: Basis
  website: https://getbasis.ai
  sector: Fintech / AI
  stage: growth-stage private
  headquarters: New York City, New York, United States
  shortDescription: Agentic AI platform that automates end-to-end accounting workflows for professional services firms, from CAS and tax to audit, enabling accounting firms to scale throughput without proportional headcount growth.
chapter:
  number: 2
  title: Market Analysis
  summary: 'Basis sells into a large but easily overstated market. The broad U.S. accounting-services envelope is supported by two public lenses at roughly $145 billion to $157 billion, but that total includes many services, buyers, and labor pools that Basis does not directly monetize. The relevant buying center is narrower: public accounting firms adopting software and workflow automation across CAS, tax, audit, and advisory. Global accounting-software estimates cluster in the low-$20 billions, with North America representing about 38% of spend, but those estimates include corporate finance, payroll, and sector-specific software well beyond Basis''s immediate wedge. The practical underwriting takeaway is that Basis is not pursuing “all accounting” at once; it is targeting the highest-value, highest-pain slice inside accounting firms first.


    Demand conditions are favorable. BLS still projects 124,200 annual openings for accountants and auditors, median pay reached $81,680 in 2024, and multiple profession-specific sources describe a pipeline crisis marked by more than 300,000 departures and weak graduate replenishment. At the same time, regulatory and quality demands remain high: accounting work is structured, auditable, and often client- or regulator-facing, which increases the value of reviewable automation but slows adoption of fully autonomous systems. Thomson Reuters shows AI is moving quickly into professional services — 40% of organizations now use GenAI — yet only 15% report using agentic AI and only 18% measure ROI, confirming that the category is early rather than mature.


    That combination creates Basis''s opportunity and constraint simultaneously. Firms need leverage, but they already buy from Intuit, Sage, Xero, and workflow-specific challengers such as Botkeeper, Pilot, Numeric, and Digits. Basis''s strongest public fit is therefore among larger accounting firms that need vertical automation across multiple practice areas and can underwrite trust, controls, and change management better than a typical SMB buyer.'
sections:
- id: market-definition
  title: Market Definition and Scope
  body: 'Basis should be analyzed against the market for professional accounting-firm workflow automation, not against every dollar spent on finance software or every accountant employed in the economy. The company itself positions the product across CAS, tax, audit, and advisory, which aligns most directly with public accounting firms selling recurring and project-based professional services to clients. BLS occupation definitions confirm that accounting labor spans public accountants, management accountants, government accountants, and auditors, so the broad accounting labor market is larger than Basis''s immediate buying center. That distinction matters because much of the software market serves controllers, CFOs, payroll teams, or industry-specific finance operations rather than CPA firms.


    The included spend for this chapter is therefore: public accounting service revenue, software and workflow tooling sold into accounting firms, and adjacent automation budgets that can replace or augment accountant labor inside firms. Excluded or only partially included spend is corporate ERP, general AP automation, and internal controllership software bought by enterprise finance teams unless those tools act as practical substitutes for the same accounting work Basis wants to automate. This boundary keeps the chapter honest. It preserves the large outer envelope of accounting spend while avoiding the mistake of treating every bookkeeping, payroll, or finance-ERP dollar as equally addressable by a firm-focused agent platform.'
