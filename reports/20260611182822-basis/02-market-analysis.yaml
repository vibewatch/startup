- id: TM004
  title: Growth drivers and adoption constraints
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Accounting talent shortage
    - positive
    - current and structural
    - Makes labor-substituting automation easier to justify at firm level
    - Request deployment metrics by practice area and role class
  - - Rising compensation and staffing cost
    - positive
    - current
    - Improves ROI case for software if implementation cost stays controlled
    - Request payback period, seat economics, and reviewer-time savings
  - - Regulatory complexity and audit-quality pressure
    - positive for need, negative for speed
    - ongoing
    - Supports demand for traceable automation but raises proof burden
    - Request audit trail, control, and exception-rate evidence
  - - AI adoption still early
    - negative near term
    - current
    - Budgeting is moving ahead of standardized ROI measurement
    - Request customer rollout progression from pilot to broad deployment
  - - Incumbent bundling from Intuit / Sage / Xero
    - negative
    - current
    - Raises switching-cost and pricing pressure on standalone vendors
    - Request win-loss data versus incumbent stack extensions
  - - Human review and trust requirements
    - negative
    - ongoing
    - Limits fully autonomous penetration and elongates implementation cycles
    - Request reviewer effort, override rate, and accuracy benchmarking
  notes: The same conditions that make Basis attractive also slow category maturation. Shortage and complexity increase urgency, but trust and incumbent distribution constrain how fast spend moves.
