company:
  name: Basis
chapter:
  number: 3
  title: Competitors
  summary: 'Basis sits in a crowded but still segmented competitive set. The strongest public evidence shows Basis competing most directly with accounting-native workflow vendors such as Botkeeper, Truewind, and Digits, while Pilot, Vic.ai, BILL, QuickBooks, and Microsoft represent service-led, AP-led, or bundled-suite substitutes. Basis appears strongest where accounting firms want reviewable end-to-end execution across multiple practice lines, but the adverse angles are real: incumbent distribution power, pricing opacity, security-feature parity, and the possibility that model progress narrows feature gaps faster than buyers change systems.'
sections:
- id: landscape-and-boundaries
  title: Landscape categories and what actually counts as a competitor
  body: The competitor set for Basis should be split by job-to-be-done rather than by any product that happens to mention AI. Basis markets agents that execute accounting workflows across CAS, tax, audit, and advisory, then return review-ready output to accountants. That makes its closest direct peers the vendors that also try to own accounting workflow execution inside firms, not just surface a chat box or automate one subtask. On retained public evidence, Botkeeper, Truewind, and Digits are the most relevant direct comparisons because they are accounting-native, workflow-aware, and sold into accountants or accounting firms. Pilot overlaps at the customer-outcome level but uses a more services-heavy model. Vic.ai and BILL are narrower AP specialists. QuickBooks and Microsoft matter because they can arrive through existing software budgets and familiar interfaces, even when they are not the deepest accounting-native systems. That category split matters because Basis can be best-in-class
    on workflow depth and still lose budget to incumbents, substitutes, or service models if the buyer prioritizes installed-base leverage, lower published prices, or outsourced outcomes over a new platform.
  claimRefs:
  - CP001
  - CP002
  - CP003
  - CP016
  - CP017
  tableRefs:
  - TP001
- id: direct-accounting-native-peers
  title: 'Direct accounting-native peers: Botkeeper, Truewind, and Digits'
  body: Botkeeper, Truewind, and Digits each overlap with a meaningful part of the Basis story, but in different ways. Botkeeper is explicitly built for accounting firms and already claims more than 200 firms and 5,000-plus business clients, which gives it real installed-base credibility; at the same time, it still frames the offer as a blend of AI, support, and dedicated help rather than as a multi-practice agent platform. Truewind is closer on review-first workflow automation, but its public positioning stays concentrated on close, reconciliation, transaction coding, and schedule preparation while keeping Sage or QBO as the source of truth. Digits is the most structurally ambitious of the three because it sells an AI-native ledger, publishes entry pricing, and pushes firms toward a branded client experience plus agentic close operations. Together these peers show that Basis is not alone in trying to automate accountant workflows, but they also show that the market is fragmented between
    service-heavy bookkeeping, close-centric copilot layers, and full ledger replacement. Basis’s differentiation claim is strongest when the buyer wants reviewable execution across multiple practice lines rather than only bookkeeping or close acceleration.
  claimRefs:
  - CP004
  - CP005
  - CP006
  - CP009
