- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Scale signal / funding visibility
  - Target customer
  - Product scope / differentiation
  - Public limitation or caveat
  rows:
  - - Basis
    - Direct accounting-native workflow platform
    - $100M Series B at $1.15B valuation; ~30% of Top 25 U.S. firms claimed/supported in retained sources
    - Mid-to-large accounting firms
    - End-to-end accounting agents across CAS, tax, audit, and advisory with review-ready output
    - Public pricing and contract structure are not disclosed
  - - Botkeeper
    - Direct peer / bookkeeping automation for firms
    - 200+ accounting firms and 5,000+ business clients claimed on official site; funding not disclosed on retained pages
    - Accounting firms
    - AI bookkeeping with dedicated services, accounting-firm-specific workflow, public per-license pricing
    - Public story is strongest in bookkeeping and capacity, not in tax/audit breadth
  - - Truewind
    - Direct peer / close automation layer
    - Trusted by 500+ accountants claimed on home page; funding not disclosed on retained pages
    - Accounting teams and firms using Sage Intacct or QBO
    - GL-ready journal entries, reconciliation, transaction coding, schedules, review-first close automation
    - Public scope centers on close and source-of-truth integrations more than multi-practice firm workflow ownership
  - - Digits
    - Direct peer / ledger replacement
    - Thousands of startups, small businesses, and accounting firms claimed; pricing public; funding not disclosed on retained pages
    - Businesses and accounting firms
    - AI-native general ledger, agentic close, bill pay, invoicing, firm branding, client portal
    - More cross-segment than accounting-firm-only; exclusive firm pricing still requires sales engagement
  - - Pilot
    - Service-heavy substitute
    - 3,000+ growth-driven startups and small businesses claimed; pricing public
    - Startups and small businesses
    - Bookkeeping, tax, CFO, and outsourced operations using people-plus-software delivery
    - Closer to outsourced finance than to accounting-firm-native agent software
  - - Vic.ai
    - Adjacent specialist / AP automation
    - AP efficiency metrics public; funding not disclosed on retained pages
    - Enterprise finance teams
    - Invoice processing, approvals, payments, and autonomous finance for AP
    - Narrower than Basis because public scope is AP-centric
  - - QuickBooks + Intuit Assist
    - Incumbent SMB suite substitute
    - Installed-base scale not quantified in retained page; AI features bundled into existing QuickBooks motion
    - SMBs and existing QuickBooks users
    - Workflow prompts, invoicing help, and financial Q&A inside QuickBooks
    - Retained evidence does not show accounting-firm-native multi-practice workflow ownership
  - - Microsoft 365 Copilot
    - Horizontal incumbent substitute
    - Installed-base scale not quantified in retained page; bundle leverage comes from existing Microsoft 365 footprint
    - Existing Microsoft business users
    - Chat, search, agents, app integration, and work-graph context
    - Horizontal productivity layer rather than accounting-native system of record
  - - BILL
    - Adjacent specialist / AP-AR automation
    - Accounting-firm channel present; list pricing not shown in retained page
    - SMBs, midsize firms, accountants
    - Accounts payable, receivable, procurement, approvals, and payments workflows
    - Narrower operational wedge than Basis and no retained evidence of tax/audit workflow scope
  notes: Profile rows prioritize publicly visible scope, target buyer, and scale signal. Where funding or customer-count data is not disclosed in retained sources, the cell states that instead of inferring it.
