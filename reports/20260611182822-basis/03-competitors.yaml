- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Provider
  - Published entry price / contract model
  - Unit
  - Included capabilities in retained evidence
  - Pricing visibility
  - Implication for Basis
  rows:
  - - Basis
    - Unknown / sales-led
    - Unknown
    - Accounting agents across CAS, tax, audit, advisory; contract detail not public
    - Low
    - Workflow depth may justify premium pricing, but public benchmarking is impossible without management materials
  - - Botkeeper
    - $149/mo for 1-4 licenses; $59/mo for 25+ monthly; $53/mo annual at 25+
