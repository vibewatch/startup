- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Evidence
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Basis wins on accounting-native end-to-end workflow depth
    - Generic copilots and point tools become good enough as model quality improves
    - Wiss contrasted Basis with Copilot; OpenAI and Microsoft both show rapidly expanding agent capabilities
    - High
    - Review current win-loss notes against QuickBooks, Microsoft, and direct peers by practice line
  - - Reviewability and traceability support trust in high-stakes workflows
    - Security/privacy controls are converging across vendors and becoming table stakes
    - Basis, Botkeeper, Vic.ai, Digits, and Microsoft all market meaningful trust posture
    - Medium-High
    - Request side-by-side control evidence, audit logs, escalation rules, and customer security-review outcomes
  - - Large-firm penetration creates a beachhead with reference value
    - Botkeeper already has installed-base distribution and suite incumbents already own adjacent workflow surfaces
    - Botkeeper claims 200+ firms; QuickBooks and Microsoft arrive through familiar stacks
    - High
    - Ask Basis for expansion rates, multi-practice attach, and reasons buyers pick Basis over bundled incumbents
  - - Partner and customer proof can accelerate distribution
    - Partner economics and channel structure are not public
    - Wiss and Baker Tilly show leverage, but public revenue-share or reseller terms are missing
    - Medium
    - Request partner pipeline, reseller economics, and percentage of ARR influenced by channels
  - - Multi-practice scope broadens share-of-wallet opportunity
    - AP specialists can capture budget first and delay broader workflow platform adoption
    - Vic.ai and BILL focus on narrow but tangible ROI categories with easier buyer stories
    - Medium
    - Map how Basis lands after AP or close point-solutions are already in place
  - - Opaque pricing may support value-based selling
    - Opaque pricing can also slow evaluation against transparent alternatives like Digits, Pilot, and Botkeeper
    - Public list prices exist for several rivals but not for Basis
    - Medium-High
    - Request pricing book, discount corridors, implementation fees, and renewal or expansion examples
  notes: Severity reflects likely impact on Basis’s competitive durability, not certainty of loss. The register focuses on public evidence and intentionally leaves unknown contract economics as diligence asks rather than assumptions.
