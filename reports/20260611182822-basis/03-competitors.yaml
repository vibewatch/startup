- id: pricing-packaging-distribution-and-trust
  title: Pricing, packaging, distribution, and trust posture
  body: 'Public pricing is one of the cleanest places where the competitive set splits. Botkeeper, Pilot, and Digits all publish meaningful packaging information, which lets buyers benchmark entry cost quickly: Botkeeper publishes per-license tiers, Pilot publishes both bookkeeping and CFO plans, and Digits publishes SaaS plans plus partner-provided services. Basis, Vic.ai, and BILL do not provide comparable public price sheets in the retained evidence, while Intuit and Microsoft emphasize bundling and add-on logic more than a clean apples-to-apples accounting-firm contract. That has two implications. First, price-sensitive or self-directed buyers have more transparent alternatives than Basis. Second, opaque pricing can still be rational if Basis wins on workflow depth or enterprise deployment economics, but that has to be proven privately because the public record does not show it. Trust posture is similar. Basis has strong controls, but Botkeeper, Vic.ai, Digits, and Microsoft also market
    security, privacy, or compliance safeguards. Public trust claims therefore look like a prerequisite for getting into the deal, not a standalone moat. Distribution proof may matter more: customer evidence from Wiss and partner leverage via Baker Tilly show Basis can move beyond an isolated tool pilot, while bundled incumbents still threaten to win on familiarity and procurement convenience.'
