  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: peer-scale-funding-visibility
    missingEvidence: Apples-to-apples customer counts, revenue, funding, and deployment depth for Botkeeper, Truewind, Digits, Vic.ai, and BILL beyond marketing claims.
    whyItMatters: The competitor profile table can compare positioning, but not true share, monetization, or capital durability without standardized public scale disclosures.
    diligencePath: Request management's current win-loss deck and ask each reference customer which alternatives they evaluated, plus any public financing or customer-count materials not visible on the home pages.
    relatedQuestionRefs:
    - QP005
    relatedTableRefs:
    - TP001
  - type: private-evidence-only
    severity: material
    topic: switching-cost-and-win-loss-data
    missingEvidence: Migration timelines, retention/expansion metrics, seat growth, and quantified win-loss data versus QuickBooks, Microsoft, Botkeeper, Digits, and Truewind.
    whyItMatters: The moat analysis is currently evidence-backed but still qualitative; underwriting durability requires proof that buyers expand usage after the initial wedge and do not revert to bundled substitutes.
    diligencePath: Ask Basis for deployment cohorts, implementation duration, logo retention, competitive displacement examples, and practice-line expansion rates by customer segment.
    relatedQuestionRefs:
    - QP020
    relatedTableRefs:
    - TP004
  - type: missing-source
    severity: material
    topic: basis-enterprise-pricing
    missingEvidence: Basis list pricing, minimum contract sizes, discounting rules, partner economics, or public ROI calculator with contractual detail.
    whyItMatters: Without contract economics it is difficult to compare Basis against cheaper published alternatives or bundled incumbent offers, and difficult to test whether workflow depth translates into pricing power.
    diligencePath: Request the current pricing book, standard MSA/order-form structure, partner revenue-share terms, and examples of how pricing changes from CAS-only deployments to multi-practice rollouts.
    relatedQuestionRefs:
    - QP025
    relatedTableRefs:
    - TP003
