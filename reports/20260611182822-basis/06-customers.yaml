figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  summary: Basis usually enters through firm leadership solving capacity and quality bottlenecks, then expands as teams trust reviewable workflow automation.
  data:
    items:
    - id: stress
      label: Capacity pain recognized
      actor: CEO / partner / practice leader
      description: The starting trigger is usually labor shortage, margin pressure, or workflow overload inside an accounting firm.
      channels:
      - Funding/news coverage
      - Firm strategy releases
      - Basis home/about
    - id: vendor-eval
      label: Vendor evaluation
      actor: Firm leadership + operations / technology
      description: The firm evaluates whether Basis can handle accounting-native workflows with enough control, security, and auditability.
      channels:
      - Baker Tilly evaluation note
      - Security page
      - Customer references
    - id: initial-deploy
      label: Initial practice deployment
      actor: CAS / managed-services / accounting delivery team
      description: Deployment begins in a workflow-dense practice area such as CAS or accounting and finance managed services.
      channels:
      - Wiss CAS beta
      - UHY testimonial
      - Baker Tilly collaboration
    - id: review-loop
      label: Review + trust loop
      actor: Accountants and reviewers
      description: Users judge whether outputs are consistent, reviewable, and aligned to firm standards before expanding use.
      channels:
      - OpenAI case study
      - Annette Garcia interview
      - Security page
    - id: expand
      label: Workflow / practice expansion
      actor: Firm leadership + adjacent practice teams
      description: As trust builds, firms consider expansion into tax, audit, and broader cross-practice automation.
      channels:
      - OpenAI case study
      - Wiss internal-adoption note
      - About page
