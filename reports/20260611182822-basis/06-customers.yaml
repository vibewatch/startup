company:
  name: Basis
chapter:
  number: 6
  title: Customers
  summary: 'Basis has unusually concrete named-account proof for an early accounting-AI vendor: Wiss, Baker Tilly, UHY, Clark Nuber, Boulay, and BPB are all publicly referenced, with the strongest production evidence at Wiss, Baker Tilly, and UHY. The public story supports firm-led adoption across CAS first and then tax/audit expansion, plus measurable ROI proxies like 30% time savings and faster close cycles, but it still does not disclose retention, contract duration, or concentration by revenue.'
sections:
- id: customer-segmentation-and-buyer-map
  title: Customer segmentation and buyer map
  body: 'Basis is selling to accounting firms, not to individual bookkeepers in a self-serve motion. The public surface repeatedly organizes the product around firm practice areas — CAS, tax, audit, advisory, outsourced accounting, and managed services — and customer quotes come from CEOs, partners, CIOs, and managed-services leaders rather than from rank-and-file staff buying cards on their own. That pattern strongly suggests a firm-level buyer and payer, with accountants and delivery teams as the primary users and the accounting firm’s end-clients benefiting indirectly through faster closes, better reporting, and more capacity for advisory work. Segment breadth is also broader than a single bookkeeping wedge. Basis started with CAS, where workflows are repetitive and deeply accounting-native, but public materials now position the platform across tax and audit as well. The practical segmentation lens is therefore by firm type and workflow maturity: CAS-heavy outsourced-accounting firms,
    larger multidisciplinary firms, managed-services practices, and cross-practice firms that want one AI layer spanning multiple departments.'
