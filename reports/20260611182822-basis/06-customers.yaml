- id: customer-diligence-gaps
  title: Customer diligence gaps
  body: 'A buyer could defend the statement that Basis has real enterprise adoption, named production references, and category-aligned ROI. A buyer could not yet defend strong retention, low concentration, or fully de-risked deployment. The public record still lacks customer-count denominators, ARR by customer tier, retention cohorts, contract length, renewal timing, implementation time-to-value, and customer mix across top-25 firms versus the long tail. Even some named accounts are unevenly evidenced: Wiss, Baker Tilly, and UHY have substantive proof, while Clark Nuber, Boulay, and BPB are mostly testimonial-level. The next diligence step should therefore focus less on whether customers exist and more on how durable and economically meaningful they are. Basis should be asked for a customer list with ARR bands, the top-ten concentration table, renewal schedule, implementation timelines, expansion history by practice area, and customer-specific ROI studies that include denominator definitions
    and time windows.'
