- id: TU006
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / durability risk
  - Impact
  - Public proof
  - Diligence path
  rows:
  - - CAS-to-tax-and-audit expansion
    - Later-stage practices may adopt more slowly than CAS
    - Upside is large if Basis standardizes across the firm
    - Basis home, about, and product-ops interview all point to cross-practice ambition
    - Request ARR and active-workflow split by practice area
  - - Workflow breadth inside one logo
    - Usage may remain narrow if customers buy one workflow but not others
    - Could limit NRR despite strong initial logos
    - Wiss and Baker Tilly imply multiple workflows, but public breadth is still thinly quantified
    - Request workflow-by-workflow adoption history for top customers
  - - Top-25-firm penetration
    - A high share of large-firm logos can also mean revenue concentration
    - A few large accounts could dominate revenue and renewal risk
    - Series B materials repeatedly cite ~30% of the top 25 firms
    - Request top-10 customer concentration by ARR and by task volume
  - - Reference-quality concentration
    - Strongest public proof clusters around Wiss, Baker Tilly, and UHY
    - Weak proof beyond a few logos can overstate breadth
    - Home-page testimonial set is broader than the customer-owned proof set
    - Request additional customer-owned case studies and reference calls
  - - Retention opacity
    - No public GRR, NRR, churn, or contract-duration metrics
    - Durability cannot be underwritten from public evidence alone
    - Absence is consistent across company, customer, and trade-press sources
    - Request cohort retention, renewal calendar, and expansion / downsell bridge
  notes: This table separates growth mechanics from what is still missing; risks are commercial unknowns, not evidence that adoption is failing.
