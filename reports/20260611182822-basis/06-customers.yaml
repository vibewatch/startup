- id: durability-expansion-and-concentration
  title: Durability, expansion, and concentration
  body: 'Basis’s clearest expansion path is not consumer-style seat growth but deeper workflow and practice-area penetration inside firms that already trust it. Wiss moved from a CAS beta to full deployment and broader internal interest. Baker Tilly framed its rollout as the next phase of a managed-services expansion. Basis’s own accounting product operations team says the company started with CAS because it had to master core accounting first, then extend into audit and tax. Those are real land-and-expand signals. What remains unproven is durability in a form investors can underwrite. Public sources do not disclose GRR, NRR, churn, renewal rates, contract duration, or cohort retention. The concentration picture is similarly two-sided: reaching about 30% of the top 25 firms is a strong logo-quality signal, but it could also mean a meaningful share of commercial value sits in a small number of large accounts. Without revenue concentration, deployment depth by logo, or contract-expiration
    data, the customer story is promising on strategic value and still under-documented on economic durability.'
