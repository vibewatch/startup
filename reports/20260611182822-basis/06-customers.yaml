  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-gap
    missingEvidence: GRR, NRR, logo churn, renewal rate, and cohort retention by major customer segment.
    whyItMatters: Without durability data, strong logos and testimonials can overstate the true economic staying power of the customer base.
    diligencePath: Request cohort retention tables, renewal schedules, and churn commentary from management and customer success leaders.
    relatedQuestionRefs:
    - QU018
    - QU019
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Top-10 customer concentration by ARR, deployment depth by logo, and exact denominator behind the top-25 penetration claim.
    whyItMatters: A few large-firm accounts could create meaningful revenue and renewal risk even if the headline logo set looks impressive.
    diligencePath: Request top-customer concentration schedules, ARR bands by customer, and the exact customer list behind the top-25 statistic.
    relatedQuestionRefs:
    - QU020
    - QU025
    relatedTableRefs:
    - TU006
  - type: private-evidence-only
    severity: minor
    topic: proof-quality
    missingEvidence: Customer-owned case studies or reference calls for Clark Nuber, Boulay, BPB, and other testimonial-only logos.
    whyItMatters: The public set currently relies too heavily on Basis-owned testimonial surfaces for several named accounts, which weakens corroboration quality.
    diligencePath: Ask management to provide customer reference calls and customer-owned deployment documents for at least three additional logos.
    relatedQuestionRefs:
    - QU004
    - QU023
    relatedTableRefs:
    - TU003
  - type: missing-source
    severity: material
    topic: implementation-metrics
    missingEvidence: Implementation timeline, admin-training hours, time-to-value, and adoption metrics after go-live.
    whyItMatters: Deployment friction is a key gating factor in accounting AI, and public proof today is stronger on qualitative support than on quantified rollout efficiency.
    diligencePath: Request implementation playbooks, median go-live timelines, and customer-success dashboards for recent enterprise deployments.
    relatedQuestionRefs:
    - QU014
    - QU015
    - QU024
    relatedTableRefs:
    - TU005
  - type: missing-source
    severity: material
    topic: roi-denominator
    missingEvidence: Customer-specific ROI studies with baseline period, denominator, sample size, and time window for time-savings or efficiency claims.
    whyItMatters: Current ROI evidence is directionally good but too lightly specified to underwrite value realization at scale.
    diligencePath: Request case studies that show before/after labor hours, close-cycle changes, review-cycle changes, and realized expansion within named accounts.
    relatedQuestionRefs:
    - QU010
    - QU026
    relatedTableRefs:
    - TU002
