- id: named-accounts-and-adoption-trajectory
  title: Named accounts and adoption trajectory
  body: 'Public customer proof is strongest where the customer itself speaks. Wiss says it began testing Basis in beta in November 2023 and moved to full deployment across its CAS practice, with internal adoption rising month over month and other practice areas lining up behind it. Baker Tilly says it evaluated multiple platforms before selecting Basis for accounting and finance managed services, then named the workflows it plans to automate: transaction processing, journal entry support, reconciliations, post-close analysis, management reporting, budgeting, and forecasting. UHY’s quote on the Basis site adds a more outcome-specific proof point, saying Basis significantly reduced month-end close for clients and that onboarding and implementation support were delivered as promised. Above the named-account level, Basis and repeat coverage say the platform now reaches roughly 30% of the top 25 U.S. accounting firms. That is a meaningful scale claim, but it is still a penetration headline rather
    than a customer-count, ARR, or utilization denominator.'
