tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Primary use case
  - Public scale / proof
  - Strategic value
  - Gap
  rows:
  - - CAS / outsourced accounting firms
    - Buyer and payer are firm or practice leaders; users are CAS accountants and reviewers
    - Journal entries, reconciliations, monthly close, reporting, bookkeeping-adjacent workflows
    - Wiss beta-to-full CAS deployment; UHY month-end-close quote; Basis started in CAS
    - Best-proven beachhead because workflows are repetitive, high-volume, and accounting-native
    - No public seat counts, ACVs, or implementation durations by CAS customer
  - - Large multidisciplinary accounting firms
    - Buyer and payer appear to be firm leadership; users span CAS, tax, audit, and advisory teams
    - Cross-practice automation and workflow delegation
    - Basis claims ~30% of top 25 firms; home-page references include Wiss, Boulay, Clark Nuber, and BPB
    - High logo value and strong reference quality if usage is real across practices
    - Public proof does not disclose how many of the top-25 relationships are broad deployments versus narrow pilots
  - - Managed-services accounting and finance practices
    - Buyer and payer are managed-services principals; users are delivery teams serving end clients
    - Transaction processing, JE support, reconciliations, post-close analysis, reporting, budgeting and forecasting
    - Baker Tilly official collaboration names these workflows and says it evaluated multiple platforms first
    - Shows Basis can sell into service-delivery operations, not just back-office experimentation
    - No public information on implementation timeline, client coverage, or economics of the rollout
  - - Tax teams
    - Buyer is likely tax-practice leadership; users are tax professionals
    - Tax workpapers, tax returns, and research support
    - Basis says the platform now spans tax; BPB quote says trusted agents reshape tax work; company says it has demonstrated a 1065 tax return
    - Supports upside beyond CAS if accuracy and reviewability hold
    - No public tax-specific retention, win-rate, or production-volume metrics
  - - Audit teams
    - Buyer is likely audit leadership; users are auditors and reviewers
    - Audit testing, working papers, evidence gathering, support for reviewable workflows
    - Basis, coverage, and company materials all reference audit as a target practice area
    - Large strategic value because audit is high-stakes and workflow rich
    - Public proof is thinner than CAS and managed services; no named audit customer case study was retrieved
  - - End-client beneficiaries of accounting firms
    - Payer is still the accounting firm, but the beneficiary is the firm’s client
    - Faster closes, better reporting, and more adviser capacity
    - UHY cites reduced month-end close for clients; Baker Tilly frames value as consistency, visibility, and decision-ready insight
    - Important because client outcomes can strengthen stickiness and expansion inside firms
    - End-client references are indirect; no retained source discloses direct customer satisfaction scores or case-study denominators
  notes: Rows combine company, customer, and independent evidence; public proof is strongest for workflow type and weakest for spend, seats, and renewal behavior.
