- id: TU005
  title: Deployment friction / control table
  columns:
  - Friction / control area
  - Public evidence
  - Why it matters for customers
  - Current read
  - Diligence ask
  rows:
  - - Privacy and client-data handling
    - Basis says no model training, full data isolation, and separate enterprise agreements; Thomson Reuters and ACCA say privacy is a top concern
    - Accounting firms handle highly sensitive client data and will block deployment if usage terms are unclear
    - Control posture is directionally good, but buyers still need contractual and operational validation
    - Request DPA / MSA privacy terms, model-provider list, and customer-data flow diagram
  - - Auditability and human review
    - Basis emphasizes traceable actions and transparent rationale; Annette Garcia says accountants need consistency and reviewability
    - Customers need outputs that hold up later in review and under professional standards
    - This looks like a core product strength and a core buying requirement
    - Request sample audit trails, reviewer dashboards, and exception-handling workflow
  - - Integration complexity
    - Thomson Reuters and IBM say fragmented systems and workflow integration are major barriers
    - Multi-system accounting environments can delay time-to-value and raise services costs
    - Likely a real deployment burden even at willing customers
    - Request implementation plan, system prerequisites, and average go-live timeline
  - - Training and change management
    - CPA Practice Advisor, Thomson Reuters, ACCA, and IBM all stress skills gaps and upskilling
    - Weak training slows adoption and limits expansion inside accounts
    - Likely ongoing work rather than a one-time onboarding step
    - Request customer enablement plan, admin training hours, and adoption playbooks
  - - Client trust and expectations
    - JOA, ACCA, and Thomson Reuters all warn about hallucinations, black-box trust, and disclosure expectations
    - Even when firms buy the product, client-facing usage may be constrained by trust and professional risk
    - The platform seems designed around this objection, but public proof is still mostly narrative
    - Request client-disclosure language, QA controls, and examples of rejected or escalated outputs
  notes: Rows combine product claims with independent adverse evidence; this is a deployment-risk table, not a failure log.
