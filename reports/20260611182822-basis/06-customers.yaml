- id: roi-deployment-friction-and-proof-quality
  title: ROI, deployment friction, and proof quality
  body: 'The ROI story is credible but still proxy-heavy. OpenAI says firms using Basis report 30% time savings on average and continue expanding agent responsibilities as trust grows; Basis-backed funding coverage adds an investor quote claiming 20% to 50% efficiencies across practices. The problem is not the absence of any ROI signal — there are several — but that the strongest public numbers are still company-channeled or partner-channeled rather than audited customer operating data. Independent implementation research helps explain why. CPA Practice Advisor, Thomson Reuters, ACCA, Journal of Accountancy, and IBM all describe the same adoption bottlenecks: data privacy concerns, fragmented systems, training and skills gaps, governance requirements, human-review obligations, and skepticism toward black-box AI outputs. Basis’s own product-operations interview makes the same point from the inside: accountants want consistency, audit trail, predictability, and outputs that hold up later in
    review. That makes the best reading of current proof “real production value in the right firms, but deployment still requires significant controls and change management.”'
