  - id: TR005
    title: Mitigation and kill criteria table
    columns:
      - Risk
      - Monitorable trigger
      - Threshold / event
      - Action implication
    rows:
      - - Output-quality failure in regulated workflows
        - Verified error or exception metrics
        - Tax or audit workflow escape rate exceeds agreed threshold or produces a material client remediation event
        - Pause expansion into that workflow until controls, review, and benchmark evidence improve
      - - Security / privacy deterioration
        - Certifications, incident disclosure, or customer notice
        - Material incident, loss of certification, or scope limitation in trust artifacts
        - Re-rate risk upward and require updated controls package before proceeding
      - - Model-vendor concentration shock
        - Provider or policy change
        - Major model access, pricing, safety-policy, or latency change without demonstrated fallback path
        - Apply dependency discount and require redundancy plan
      - - Customer concentration break
        - Named-logo churn or partnership reversal
        - Loss of a marquee firm, failed renewal, or shrinking reference set
        - Reassess growth durability and commercial credibility
      - - Regulatory / standards pressure rises
        - IRS, PCAOB, SEC, FTC, or state privacy action
        - New rule, guidance, or enforcement materially alters permitted workflow design or disclosure expectations
        - Delay underwriting until customer and vendor controls are updated
      - - Diligence package remains incomplete
        - Private evidence request completion
        - No quantified accuracy, contract allocation, concentration, or model-governance evidence after diligence cycle
        - Treat as a research-more / no-underwrite outcome rather than forcing a clean pass
    notes: Triggers are framed so an investor or buyer can monitor them without relying on vague sentiment changes.
