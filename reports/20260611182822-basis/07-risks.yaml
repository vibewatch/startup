company:
  name: Basis
chapter:
  number: 7
  title: Risks
  summary: >-
    Basis’s core risk is not whether accountants want automation; it is whether AI outputs can be
    used safely enough in tax, audit, CAS, and advisory workflows that remain governed by CPA,
    IRS, PCAOB, privacy, and client-liability obligations. Public evidence shows a stronger trust
    posture than a typical early-stage AI vendor—SOC 2 Type II, ISO 27001, ISO 42001,
    no-training claims, audit logs, and explicit human-review requirements—but the same public
    record also shows important underwriting gaps on quantified accuracy, contractual risk
    allocation, concentration, and model-vendor dependency. Net: high residual risk with visible
    mitigants, but not yet low enough for a clean underwriting pass without private diligence.
sections:
  - id: ranked-risk-overview
    title: Ranked risk overview and why underwriting is still blocked
    body: >-
      The highest-severity risk around Basis is not generic “AI risk”; it is the interaction between
      AI-output fallibility and professional services work that carries statutory, standards-based, and
      reputational liability. Basis now markets one platform across CAS, tax, audit, and advisory,
      which means a single model, control, or workflow weakness can propagate across multiple
      regulated accounting surfaces rather than staying confined to a low-stakes back-office task.
      Public mitigants are real. Basis says it is SOC 2 Type II, ISO 27001, and ISO 42001 certified,
      keeps data in the U.S., does not train on customer data, and logs agent actions. The legal terms
      are also unusually explicit that AI outputs are not a substitute for professional judgment and
      must be reviewed before they are used in filings, client deliverables, or professional work
      product. Those controls matter, but they do not answer the underwriter’s harder questions:
      what are the observed hallucination or exception rates in tax and audit workflows, how is
      liability allocated in enterprise contracts, how concentrated is the customer base, and what
      happens if a key model provider, security certification, or integration path changes suddenly.
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR005
      - CR006
      - CR007
      - CR008
      - CR042
      - CR043
      - CR044
      - CR045
    figureRefs:
      - FR001
      - FR002
  - id: professional-standards-liability-and-regulatory-risk
    title: Professional standards, CPA liability, and regulatory risk are first-order issues
    body: >-
      Basis is explicitly selling into work that sits close to GAAP interpretation, tax-return handling,
      audit evidence, and SOX-oriented control processes. That matters because the governing
      standards put the burden of judgment on licensed firms and engagement teams, not on the tool
      vendor. Basis’s own terms state that outputs are informational and assistive only, may contain
      errors or omissions, and are not a substitute for accounting, tax, audit, legal, or financial
      advice. Journal of Accountancy and CPAI materials reinforce the same point from the buyer
      side: generative AI can misapply standards, hallucinate, or mishandle confidential client data,
      and blind reliance can turn a workflow convenience into a negligence or professional-liability
      problem. The tax side is especially sensitive. IRS Publication 4557 says protecting taxpayer data
      is the law and points firms to FTC Safeguards Rule obligations, while 26 U.S.C. §7216
      criminalizes certain unauthorized disclosure or use of return information. On the audit side,
      PCAOB AS 1105 requires sufficient appropriate audit evidence and places special weight on the
      reliability and independence of evidence sources, which makes any AI-summarized or
      AI-transformed evidence chain a diligence item. Basis can support the workflow, but the public
      record does not yet show enough quantified control evidence to assume those liabilities are
      economically or operationally transferred away from the firm.
    claimRefs:
      - CR006
      - CR007
      - CR008
