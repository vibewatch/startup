  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: regulatory-legal-risk-register
      missingEvidence: Customer-specific jurisdiction map, private compliance exhibits, and workflow-specific use restrictions for tax, audit, CAS, and advisory engagements.
      whyItMatters: Without customer and contract granularity, the legal risk register can rank the main domains but cannot prove exact applicability by workflow and jurisdiction.
      diligencePath: Request the standard enterprise MSA, DPA, security exhibit, and a matrix showing supported versus prohibited use cases by practice area and geography.
      relatedQuestionRefs:
        - QR026
      relatedTableRefs:
        - TR001
    - type: private-evidence-only
      severity: blocking
      topic: accuracy-metrics
      missingEvidence: Workflow-level accuracy, exception, override, and rework metrics for audit, tax, and close-related use cases, plus severity-weighted incident history.
      whyItMatters: Underwriting cannot treat Basis as low-residual-risk infrastructure without measured proof that the public trust posture translates into stable output quality.
      diligencePath: Request benchmark studies, production QA dashboards, customer acceptance criteria, and post-incident root-cause summaries by workflow.
      relatedQuestionRefs:
        - QR025
      relatedTableRefs:
        - TR002
        - TR005
    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: Top-customer share, revenue mix by customer tier, retention by cohort, and reference customer churn history.
      whyItMatters: Public named logos prove relevance, but they do not show whether growth and renewal risk are diversified enough to absorb a marquee-customer loss.
      diligencePath: Request trailing-twelve-month revenue concentration, gross and net retention, and the percentage of ARR represented by the top five customers and partners.
      relatedQuestionRefs:
        - QR022
      relatedTableRefs:
        - TR003
    - type: private-evidence-only
      severity: material
      topic: model-governance
      missingEvidence: Named production model providers, fallback hierarchy, pricing exposure, outage playbooks, and provider-specific safety or retention terms.
      whyItMatters: Foundation-model concentration can impair latency, cost, reliability, and compliance posture at exactly the moment enterprise customers expect stable accounting workflows.
      diligencePath: Request architecture review materials, vendor concentration analysis, failover testing results, and model-change approval logs.
      relatedQuestionRefs:
        - QR027
        - QR024
      relatedTableRefs:
        - TR003
    - type: private-evidence-only
      severity: blocking
      topic: contract-risk-allocation
      missingEvidence: Standard indemnity language, liability caps, audit rights, customer remedies, cyber-notification obligations, and insurance coverage for AI-output failures.
      whyItMatters: Public terms are too generic to underwrite who actually bears loss when an AI-assisted accounting workflow contributes to a customer error or incident.
      diligencePath: Review the latest customer MSA, DPA, security exhibit, and any E&O / cyber-insurance summary used in enterprise diligence.
      relatedQuestionRefs:
        - QR026
      relatedTableRefs:
        - TR003
        - TR005
