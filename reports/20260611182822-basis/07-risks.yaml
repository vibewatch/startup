  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Counterparty / class
      - Role
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Frontier model providers
        - OpenAI / Anthropic / hyperscaler-class LLM ecosystem
        - Core reasoning and generation layer for enterprise AI workflows
        - Public Basis narrative references OpenAI progress, while peers openly cite multiple frontier model vendors
        - Model pricing, policy, latency, or access changes degrade product economics or quality
        - High
        - Human review, auditability, and potential multi-model architecture
        - Public redundancy architecture is not disclosed
      - - Cloud / security infrastructure
        - Hosting, identity, and backup stack
        - Stores and secures customer data and workflow logs
        - U.S.-only hosting and certifications are visible, but infrastructure architecture is not public
        - Outage, breach, or control-scope mismatch harms customer trust and renewals
        - High
        - Encryption, MFA, backups, incident response, and certifications
        - Detailed architecture and recent incident history remain private
      - - Accounting-firm channel concentration
        - Named large-firm customers and partnerships
        - Demand proof, references, and expansion channel
        - Public proof is concentrated in a small set of named firms rather than a disclosed broad base
        - Loss of one marquee customer or partner damages credibility and growth narrative
        - High
        - Multi-practice product breadth and additional firm references
        - Public concentration and retention data are undisclosed
      - - Enterprise contract terms
        - Customer MSAs, order forms, DPAs, and insurance structure
        - Allocate liability, data rights, review obligations, and audit rights
        - Public website terms defer platform specifics to private written agreements
        - Indemnity or liability terms prove weaker than buyers expect for regulated workflows
        - High
        - Custom contracts can solve this in private diligence
        - Underwriting cannot assume favorable allocation without seeing them
      - - Compliance documentation under NDA
        - SOC 2 report and additional compliance docs
        - Buyer diligence accelerant and renewal support
        - Public page says these artifacts are available only under NDA or on request
        - Slower sales cycles or failed diligence if documentation is incomplete or narrowly scoped
        - Medium-High
        - Trust-oriented positioning and visible certifications
        - Scope, exceptions, and remediation history are not public
    notes: Dependencies are ordered by how directly they can impair customer trust, workflow quality, or enterprise close rates.
