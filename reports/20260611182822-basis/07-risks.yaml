  - id: security-privacy-and-governance-risk
    title: Security, confidentiality, and governance are visible strengths but still incomplete for underwriting
    body: >-
      Basis’s public security posture is stronger than many private AI startups. The company claims
      SOC 2 Type II, ISO 27001, and ISO 42001 certification; no model training on customer data;
      strict tenant isolation; U.S.-only hosting; MFA; encryption at rest and in transit; and auditable
      agent actions. Those are meaningful mitigants for accountants who handle tax returns, audit
      workpapers, and other sensitive client data. Yet the same public package also reveals why a risk
      chapter cannot simply mark “security solved.” Basis’s security page still says GDPR and CCPA
      are “coming soon,” the public privacy policy says enterprise-product privacy terms live in
      separate written agreements, and the SOC 2 report plus additional compliance documents are
      available only under NDA or on request. NIST’s AI RMF, NIST’s broader AI governance work,
      and SP 800-53 all point toward risk management as an ongoing control discipline rather than a
      one-time badge. The underwriting problem is therefore not absence of security claims; it is the
      lack of public evidence on how those controls perform under real customer workloads, how
      model-vendor and subprocessors are governed, and what measurable residual error, incident,
      or override rates look like in production.
    claimRefs:
      - CR003
      - CR004
