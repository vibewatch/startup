  - id: TR004
    title: People / execution risk register
    columns:
      - Role / function
      - Public dependency or gap
      - Likelihood
      - Severity
      - Mitigation
      - Diligence path
    rows:
      - - Responsible-AI / quality governance leadership
        - Public materials emphasize product and trust outcomes more than named model-risk or assurance owners.
        - Medium
        - High
        - ISO 42001 and audit-log claims imply some internal governance structure.
        - Request org chart, model-risk committee cadence, and escalation owners for high-severity output failures.
      - - Customer-success and implementation capacity
        - Expansion across tax, audit, CAS, and advisory raises onboarding and support complexity.
        - Medium-High
        - High
        - Named large-firm proof suggests Basis can handle sophisticated customers.
        - Request implementation staffing, support SLAs, and renewal drivers by cohort.
      - - Standards-aware subject matter depth
        - Professional workflows require deep knowledge of tax, audit, and reporting rules, not just generic AI engineering.
        - Medium
        - High
        - Product terms require human review and Basis employs accounting-oriented product staff publicly.
        - Review domain-expert headcount, reviewer credentials, and workflow-specific validation ownership.
      - - Go-to-market discipline versus hype
        - Fast market growth can reward aggressive AI positioning before controls are fully proven.
        - Medium
        - Medium-High
        - Basis’s public legal terms are cautious and reduce obvious overclaiming.
        - Request internal approval rules for marketing claims, case studies, and benchmark publication.
    notes: Public execution risk is driven more by control-owner depth and services capacity than by founder visibility alone.
