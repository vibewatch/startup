  - id: TR002
    title: Operational / quality / security risk register
    columns:
      - Failure mode
      - Why it matters
      - Likelihood
      - Severity
      - Current mitigation
      - Residual exposure
      - Unresolved gap
    rows:
      - - Hallucinated or incomplete accounting output
        - Tax, audit, and GAAP tasks are context-heavy and can turn a plausible answer into a professional-liability event.
        - High
        - Critical
        - Human review, explicit output disclaimers, and cited workflow steps.
        - Error escape rate is still unknown publicly.
        - No public benchmark on task accuracy, exception rate, or rework by workflow.
      - - Confidential client or taxpayer data mishandling
        - CPA firms and tax preparers handle highly sensitive financial and personal information.
        - Medium-High
        - Critical
        - No-training claim, U.S.-only hosting, MFA, encryption, and tenant isolation.
        - Customer still must validate data-flow, retention, and consent controls.
        - No public enterprise DPA or workflow-level retention disclosures.
      - - Security control drift despite certifications
        - Certifications prove process maturity, but underwriters care about control operation, scope, and incident history.
        - Medium
        - High
        - SOC 2 Type II, ISO 27001, ISO 42001, backups, and incident-response claims.
        - Public artifacts remain summary-level and partly NDA-gated.
        - SOC 2 report, ISO statements of applicability, and recent pen-test summaries are not public.
      - - Prompt injection / shadow AI / user workarounds
        - Client files and employee behavior can introduce hidden instructions or bypass approved workflows.
        - Medium
        - High
        - Audit logs and role-based access help, and professional guidance recommends restrictive policies.
        - Human error remains a live control weakness.
        - No public evidence on sandboxing, content-filtering, or workflow-isolation metrics.
      - - Certification or privacy-commitment gap widens during scale
        - Growing into more firms and more workflows can outpace privacy, regional, or industry control commitments.
        - Medium
        - Medium-High
        - Visible trust positioning and standards alignment.
        - Public signals still show unfinished privacy/compliance milestones.
        - GDPR/CCPA timing and expanded regulator/customer requirements remain unclear.
      - - Claims or marketing outpace measured performance
        - FTC AI enforcement shows regulators are willing to challenge AI-enabled claims when evidence is weak.
        - Medium
        - High
        - Basis’s terms are cautious and push review responsibility back to users.
        - Marketing, demos, and customer anecdotes can still outrun quantified proof.
        - Need audited or customer-verified performance reporting by workflow.
    notes: This register focuses on production-quality and confidentiality risk rather than generic startup operations risk.
