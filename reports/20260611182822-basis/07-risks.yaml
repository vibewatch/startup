  - id: underwriting-blockers-and-kill-criteria
    title: Underwriting blockers, mitigation maturity, and thesis-break triggers
    body: >-
      Basis is not uninvestable on public evidence; it is under-documented for a clean risk discount.
      The public record supports real mitigants—security certifications, no-training claims, audit
      logs, human-review requirements, major-firm customer proof, and a product surface broad
      enough to matter. But it also leaves several blockers unresolved. There is no public evidence of
      measured production accuracy, error-severity rates, exception handling, or rework on tax and
      audit tasks; no public customer-concentration or retention data; no public DPA, security exhibit,
      or indemnity schedule showing where liability sits when an AI-generated workflow contributes to
      a bad filing or client loss; and no clear public map of model-provider concentration or resilience.
      Those are not cosmetic diligence asks. If Basis cannot show low escape rates, strong override
      controls, private-contract risk allocation, and diversified model governance, then the right call is
      to underwrite the company as a high-risk enablement vendor rather than as already-proven,
      mission-critical accounting infrastructure. The measurable kill triggers are straightforward:
      material security incidents, adverse regulatory findings, loss of a marquee customer, inability to
      maintain certifications, or failure to prove output quality on tax and audit workstreams.
    claimRefs:
      - CR037
      - CR038
      - CR040
      - CR041
      - CR042
      - CR044
      - CR045
    tableRefs:
      - TR004
      - TR005
callouts:
  - calloutType: risk
    title: Output risk still sits with the licensed firm
    body: >-
      Basis’s public terms repeatedly push firms to review, verify, and supervise AI outputs before
      they touch filings or client work product. That is commercially honest, but it also means the
      tool does not remove CPA, tax-preparer, or audit liability—it only changes how that liability is
      managed.
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR042
  - calloutType: insight
    title: Security posture is a mitigant, not a pass-through
    body: >-
      The certifications, no-training claims, U.S.-only hosting, and auditability claims are all real
      positives, yet public evidence still lacks the private artifacts an underwriter would want before
      treating Basis as low-residual-risk infrastructure.
    claimRefs:
      - CR003
      - CR005
      - CR040
      - CR044
tables:
  - id: TR001
    title: Regulatory / legal risk register
    columns:
      - Risk
      - Current public evidence
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure
      - Diligence path
    rows:
      - - AI-output malpractice / negligence exposure
        - Basis says outputs are not professional advice and must be reviewed; CPA guidance says blind reliance can create liability.
        - High
        - Critical
        - Medium
        - Firms still bear review responsibility if tax, audit, or advisory work is wrong.
        - Request sample engagement terms, QA workflow controls, error-escalation thresholds, and claims history.
      - - Tax-return confidentiality / IRC 7216 misuse
        - IRS and 26 U.S.C. §7216 constrain disclosure or use of return information; CPA guidance points to consent analysis when AI is involved.
        - Medium-High
        - Critical
        - Medium
        - Unauthorized data use could trigger legal, reputational, and customer-loss consequences.
        - Review data-flow diagrams, consent language, retention practices, and tax-workflow segregation controls.
      - - PCAOB / audit-evidence insufficiency
        - PCAOB AS 1105 emphasizes sufficient appropriate evidence and independent reliability, which can be weakened if AI transforms evidence without controls.
        - Medium
        - High
        - Low-Medium
        - Audit customers still need proof that AI outputs do not replace evidence testing.
        - Request audit workflow design docs, evidence lineage, override logs, and auditor acceptance examples.
      - - Cybersecurity / privacy governance gap
        - Basis advertises certifications and safeguards, but public enterprise privacy terms and detailed compliance exhibits are private, while GDPR/CCPA are still marked coming soon.
        - Medium
        - High
        - Medium
        - Trust posture is visible, but legal and operational completeness remains hard to verify publicly.
        - Request the latest SOC 2 report, ISO scope statements, DPA, subprocessors list, and incident playbooks.
      - - SOX / GAAP / disclosure-control misuse
        - Compliance-oriented incumbents market AI for disclosure, risk factors, and SOX readiness, showing how sensitive these workflows are to control failure.
        - Medium
        - High
        - Low-Medium
        - If Basis is used upstream of financial reporting, a bad output can contaminate control narratives or disclosures.
        - Request customer-approved control matrices and examples of bounded use in close, reporting, or SOX contexts.
    notes: Rows are ordered by residual underwriting severity; public evidence is strongest on rule existence and weakest on Basis-specific contractual allocation.
    enumerationScope:
      coverage: partial
      basis: Public sources cover the main legal and standards-based risk vectors for Basis as of 2026-06-11, but not private contracts, customer-specific jurisdictions, or nonpublic incidents.
