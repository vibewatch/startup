companyProfile:
  summary: >-
    Basis is a New York-based private software company building long-horizon AI agents for accounting firms. Public materials show the platform spanning client accounting services, tax, audit, and advisory workflows, with an emphasis on end-to-end task completion plus human review rather than suggestion-only copilots. The company has assembled a hybrid founding team that combines commercial operators with deep probabilistic-programming and research talent, then raised seed, Series A, and Series B funding from specialized fintech and frontier-AI investors. Public proof is strongest at named firms such as Wiss, Baker Tilly, and UHY, plus the broader claim that Basis reaches roughly 30% of the top 25 U.S. accounting firms. The main limitation is economic opacity: revenue, ARR, retention, margin, burn, and customer concentration remain undisclosed.
  foundedDate: '2023-01-01'
  founders:
    - name: Matt Harpe
      role: Co-Founder and CEO
      background: Former Boston Consulting Group and SoftBank executive who leads commercial strategy and external company narrative.
      claimRefs: [CO050]
    - name: Mitchell Troyanovsky
      role: Co-Founder
      background: Product-facing co-founder repeatedly cited in Basis launch and financing materials, though retained public sources do not provide a fuller pre-Basis biography.
      claimRefs: [CO054]
    - name: Zenna Tavares
      role: Co-Founder and Director
      background: Former Columbia innovation scholar and MIT PhD whose work centers on reasoning and causal probabilistic programming.
      claimRefs: [CO051]
    - name: Emily Mackevicius
      role: Co-Founder and Senior Research Scientist
      background: Leads Collaborative Intelligent Systems at Basis and previously trained at Columbia and MIT.
      claimRefs: [CO052]
    - name: Eli Bingham
      role: Co-Founder and Director
      background: Broad Institute fellow, Pyro co-creator, and former Uber AI Labs senior research scientist.
      claimRefs: [CO053]
  foundingLocation: New York City, New York, United States
