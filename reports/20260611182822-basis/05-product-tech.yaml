- id: architecture-and-operating-model
  title: Architecture and operating model
  body: 'The clearest public architecture description comes from OpenAI, which says each Basis task begins with a supervising agent that routes work to specialized sub-agents according to task, complexity, latency, and input type. In that description, the supervising role moved from o3 to GPT-5, while GPT-4.1 remains in the stack for speed-sensitive interactions. Basis says this architecture is benchmark-driven: the company runs internal evaluations to determine which models are fit for which workflows and when agents can safely take on more work. The same source also says agents share context through a central layer and expose assumptions, source material, and logic to reviewers, aligning with Basis’s public promise of traceable AI. Separate Basis engineering posts add an important nuance: the company appears to run an agent-native internal operating model with APO, Atlas, eval-heavy engineering practices, and internal tool orchestration through a unified MCP. Those posts are valuable developer-signal
    evidence for engineering seriousness and internal process maturity, but they are not direct proof that every customer-facing workflow uses identical infrastructure. Publicly, the customer product architecture is credible and specific; privately, the exact serving stack, non-OpenAI dependencies, and fallback behavior remain undisclosed.'
