- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current manual workflow
  - Basis solution
  - Public benefit signal
  - Current limitation
  rows:
  - - Reconciliation reviewer
    - Pull support, trace transactions, resolve exceptions, draft reconciliations
    - Agents complete reconciliation steps and return reviewable output
    - OpenAI cites reconciliations as an automated Basis workflow
    - No public exception-rate or reconciliation-cycle benchmark
  - - Controller or senior accountant
    - Research support, map accounts, draft journal entries, explain logic
    - Agents prepare journal entries with visible data, mapping logic, and confidence
    - OpenAI describes journal entries with explanations visible to accountants
    - No published error-rate or posting-approval metric
  - - Firm team preparing management output
    - Compile sources, summarize activity, draft financial commentary
    - Agents automate financial summaries as part of repetitive accounting work
    - OpenAI cites financial summaries among repetitive workflows
    - No public template coverage by firm type or reporting package
  - - Tax preparer
    - Collect source docs, extract values, draft return package, review
    - Basis publicly demonstrated an end-to-end 1065 workflow and says tax scope is expanding
    - Series B coverage and Annette interview both support tax workflow progress
    - No public list of supported forms, edge cases, or tax-engine integrations
  - - CAS team lead
    - Coordinate monthly close work and onboarding across clients
    - Basis combines execution automation with onboarding and support according to customer proof
    - UHY quote reports reduced month-end close time and strong onboarding
    - Public record does not separate software from services effort
  - - Firm innovation leader
    - Compare copilots, assistants, and workflow systems
    - Basis positions itself as accounting-native end-to-end automation rather than a generic assistant
    - Wiss says Copilot and private ChatGPT were useful but not equivalent to Basis
    - Public pricing and deployment economics remain undisclosed
  notes: Benefits are limited to source-backed signals such as time savings, reduced close effort, or transformed workflows. The table avoids unsupported ROI quantification beyond disclosed claims.
