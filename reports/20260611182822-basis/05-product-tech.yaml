- id: maturity-roadmap-and-scope-expansion
  title: Maturity, roadmap, and scope expansion
  body: 'Basis’s public chronology supports a product that started with core accounting, built real CAS traction, and is now pushing into tax and audit rather than claiming all practice areas were mature from day one. Annette Garcia’s interview is the most candid source here: she says Basis started with core accounting because the system had to know how to do accounting before it could succeed in tax or audit, and that both newer practice areas introduce qualitatively harder judgment and regulatory problems. That statement is consistent with the rest of the record. Wiss gives historical proof of CAS deployment, the OpenAI Basis article shows deeper workflow orchestration and model-routing maturity, and Series B coverage expands the public scope to CAS, tax, and audit, including the 1065 workflow. Meanwhile, Basis’s 2025-2026 engineering posts show the company building internal context, eval, and agent-management systems that should improve iteration velocity. The right reading is that Basis
    is no longer an early prototype, but neither is it publicly proven at a uniform quality level across every high-stakes workflow it markets. The maturity story is strongest on workflow breadth and internal technical seriousness, weaker on published quality metrics and standardized enterprise operating data.'
