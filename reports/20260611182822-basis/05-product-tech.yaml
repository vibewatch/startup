tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module / asset
  - Primary user
  - Current public maturity
  - Differentiation signal
  - Diligence gap
  rows:
  - - CAS agents
    - CAS accountants and firm reviewers
    - Most proven public surface
    - Started from core accounting and has customer proof from Wiss and homepage testimonials
    - Need workflow-level accuracy and override metrics by CAS task
  - - Tax agents
    - Tax preparers and reviewers
    - Demonstrated but still expanding
    - 1065 workflow proof and public emphasis on growing tax scope beyond core accounting
    - Need exact tax-form coverage, engine integrations, and review-rate data
  - - Audit agents
    - Audit teams and engagement reviewers
    - Early public expansion signal
    - Basis markets audit as part of firm-wide scope and Annette says the team is building for audit judgment complexity
    - Need evidence of live audit production scope, evidence-management integrations, and QA metrics
  - - Advisory / firm-wide layer
    - Partners, reviewers, and client-facing accountants
    - Positioning-level evidence
    - Homepage frames accountants as shifting into higher-value advisory while agents perform execution work
    - Need product boundaries between workflow automation and advisory analysis features
  - - Trust / review layer
    - Reviewers, compliance owners, and IT/security teams
    - Clearly claimed control surface
    - Audit trails, rationale, source visibility, token-based access, and certifications are explicit parts of the pitch
    - Need customer-facing screenshots, admin controls, and security-review outputs under NDA
  notes: This table separates what Basis explicitly markets from what is only implied by broader positioning. Maturity refers to public proof quality, not internal product confidence.
