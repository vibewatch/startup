- id: TE004
  title: Deployment, integration, reliability, and support table
  columns:
  - Dimension
  - Public status
  - What is verified
  - What is not publicly verified
  - Implication
  rows:
  - - Named deployments
    - Verified
    - Wiss and Baker Tilly publicly describe Basis relationships; homepage includes multiple named firms
    - Production breadth by workflow, seat count, and renewal status
    - Real deployment proof exists, but scale economics are still opaque
  - - Onboarding and support
    - Partly verified
    - Homepage testimonial says onboarding and implementation were strong
    - Standard implementation timelines, staffing model, and support tiers
    - Support may be a real differentiator but could also carry services burden
  - - Authentication and access
    - Verified at principle level
    - Security page says access uses revocable tokens and MFA
    - Exact SSO, API, or connector patterns by third-party system
    - Security-aware access design is visible; integration reproducibility is not
  - - Data residency and continuity controls
    - Verified at principle level
    - Security and privacy pages say U.S.-only hosting, encryption, backups, and incident response
    - RPO/RTO values, uptime targets, and external status history
    - Control posture is clear, enterprise reliability envelope is still private
  - - Ecosystem integration relevance
    - Externally verified
    - Intuit and Xero publish accounting APIs and OAuth guidance for ecosystem connectivity
    - Basis-specific connector matrix to these or other systems
    - Market integration burden is real even if Basis does not publish its exact list
  - - Public operating disclosure
    - Unverified
    - No reviewed source lists full ERP, tax-engine, or document-system support, or a public SLA
    - Exact production integration and reliability envelope
    - This is the main product-tech diligence blocker in the public record
  notes: Public status refers to the evidence surface, not to whether Basis likely has the capability internally. “Not publicly verified” items should be converted into direct diligence requests.
