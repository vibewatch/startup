  evidenceGaps:
  - type: missing-source
    severity: material
    topic: integration-catalog
    missingEvidence: A current list of supported ERP, tax engine, document-management, storage, and communication integrations with scope by workflow.
    whyItMatters: Deployment effort, buyer fit, and switching-cost analysis depend on which systems Basis can actually connect to in production.
    diligencePath: Request the current integration matrix, authentication patterns, and customer references by integration family.
    relatedQuestionRefs:
    - QE015
    - QE027
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: reliability-sla
    missingEvidence: Public or private uptime targets, incident-history summaries, recovery objectives, and escalation commitments.
    whyItMatters: High-stakes accounting workflows require confidence that the platform can support close, tax, and audit deadlines without opaque downtime risk.
    diligencePath: Request SLA documents, status-history exports, backup and disaster-recovery RPO/RTO targets, and customer support escalation runbooks.
    relatedQuestionRefs:
    - QE016
    - QE028
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: quality-metrics
    missingEvidence: Workflow-level accuracy, override, exception, and audit-quality metrics by practice area and task.
    whyItMatters: Without measured quality by workflow, investors cannot tell whether public testimonials reflect repeatable product performance or bespoke implementation wins.
    diligencePath: Request internal QA dashboards, benchmark definitions, override rates, and customer review-cycle metrics for CAS, tax, and audit.
    relatedQuestionRefs:
    - QE024
    - QE028
    relatedTableRefs:
    - TE006
  - type: private-evidence-only
    severity: material
    topic: model-stack
    missingEvidence: A versioned record of model providers, routing rules, and fallback behavior beyond the OpenAI stack publicly described.
    whyItMatters: Model concentration, latency, cost, and explainability risks depend on the real serving stack, not only the partner story presented in public case studies.
    diligencePath: Request model-governance documentation, vendor concentration analysis, and change-management history for routing decisions.
    relatedQuestionRefs:
    - QE009
    - QE025
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: minor
    topic: privacy-compliance-scope
    missingEvidence: Current public statements or certifications clarifying GDPR and CCPA program scope, plus enterprise privacy terms.
    whyItMatters: Global deployment and enterprise procurement often require clarity on privacy obligations beyond generic website disclosures.
    diligencePath: Request DPA templates, privacy addenda, current compliance roadmap, and third-party assessments tied to enterprise product data handling.
    relatedQuestionRefs:
    - QE018
    - QE019
    relatedTableRefs:
    - TE006
  - type: missing-source
    severity: material
    topic: support-operating-model
    missingEvidence: Standard implementation timelines, staffing model, training commitments, and support-tier definitions by customer segment.
    whyItMatters: A workflow-automation product can look like software in marketing but behave like software-plus-services in delivery economics and customer success.
    diligencePath: Request implementation playbooks, staffing ratios, support SLAs, and post-go-live operating procedures by firm size.
    relatedQuestionRefs:
    - QE013
    - QE014
    relatedTableRefs:
    - TE004
