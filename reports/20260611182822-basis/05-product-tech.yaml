company:
  name: Basis
chapter:
  number: 5
  title: Product & Technology
  summary: Basis is publicly positioned as an accounting-firm-native agent platform that executes reviewable workflows across CAS, tax, audit, and advisory rather than as a generic chat assistant. The strongest source-backed technical claims are the OpenAI-described supervising-agent/sub-agent architecture, reviewability controls, and public security posture, alongside customer evidence from Wiss and Baker Tilly that Basis is deployed in real firm settings. The main diligence blockers are not whether Basis has real product substance, but whether its public record is still too thin on integrations, uptime/SLA, exact model mix over time, and workflow-level quality metrics for underwriting high-stakes accounting automation.
sections:
- id: product-in-customer-workflow
  title: Product definition in customer-workflow terms
  body: Basis describes its product in workflow language rather than assistant language. The homepage says agents run in the background, execute accounting workflows end to end, and return finished work for review, while the About page emphasizes that the company built a system for accounting logic rather than a chatbot layer on top of accounting data. That distinction matters because the strongest public Basis evidence is not generic AI productivity rhetoric; it is the repeated claim that accountants remain in control at key stages, reviewing work product and applying judgment after the system has already completed execution-heavy steps. OpenAI’s Basis case study grounds that marketing in concrete examples such as reconciliations, journal entries, and financial summaries, while Series B coverage adds the end-to-end 1065 tax return example. Basis also maps the product across CAS, tax, audit, and advisory, which makes the customer workflow story broader than a narrow AP or bookkeeping wedge.
    Public customer proof on the homepage and from Wiss suggests real multi-practice adoption, but the public record is still stronger on qualitative workflow outcomes than on standardized production KPIs by workflow.
