- id: TE006
  title: Trust / quality / compliance table
  columns:
  - Control or requirement
  - Public status
  - Scope
  - Remaining gap
  - Why it matters
  rows:
  - - SOC 2 Type II
    - Claimed
    - Security, availability, confidentiality
    - Report available only under NDA
    - Enterprise buyers will want direct report review
  - - ISO 27001
    - Claimed
    - Information security management
    - Certification boundary not public
    - Supports trust posture but not implementation detail
  - - ISO 42001
    - Claimed
    - AI management system
    - No public scope statement or controls summary
    - Relevant because Basis markets AI into high-stakes workflows
  - - No model training on customer data
    - Claimed
    - Sensitive customer and firm data
    - No public enterprise privacy addendum in reviewed set
    - Core trust issue for accounting firms
  - - Traceable AI and audit logs
    - Claimed
    - Agent actions, sources, changes, rationale
    - No public screenshots or workflow-level retention details
    - Reviewability is central to adoption in accounting
  - - U.S.-only hosting and token-based access
    - Claimed
    - Residency and authentication model
    - No public list of sub-processors or connector-by-connector auth design
    - Important for privacy review and procurement
  - - Professional-review requirement
    - Supported by external guidance
    - Audit, tax, and accounting judgments remain human-accountable
    - No public Basis metric on override or escalation rates
    - Regulatory and professional standards make human supervision non-optional
  - - GDPR / CCPA program maturity
    - Partly claimed
    - Public trust surface
    - Security page still says coming soon
    - Signals public disclosure and compliance messaging still maturing
  notes: This table mixes Basis claims with external governance context because the product’s trustworthiness depends both on vendor controls and on the professional standards governing accounting work.
