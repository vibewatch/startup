- id: deployment-integration-reliability-support
  title: Deployment, integration, reliability, and support
  body: 'Basis has meaningful public deployment proof but still incomplete public implementation detail. Wiss says it beta-tested Basis in late 2023, then expanded to full CAS deployment after successful results, and Baker Tilly positions its relationship with Basis as a scaled collaboration across thousands of accounting clients. The homepage adds named testimonials about month-end close acceleration and strong onboarding support, while the careers page says Basis is already deployed with top accounting firms and has hundreds of agents behind every accountant. Security materials support a seriousness around backup, incident response, token-based access, encryption, and MFA. The missing detail is where buyers usually need it most: the reviewed public record does not publish a complete production integration list, specific ERP or tax-engine connectors, uptime commitments, public status history, or workflow-specific service boundaries between software and implementation services. That opacity
    does not mean the integrations or SLAs do not exist; it means the public diligence surface is incomplete. For an investor, this creates a classic enterprise-software underwriting problem: customer proof is visible, but the reproducibility of deployment and the reliability envelope still require direct diligence.'
