- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Publicly described role
  - Key dependency
  - Primary risk
  rows:
  - - Reviewer interface and work packet
    - Presents outputs, sources, changes, rationale, and confidence for accountant review
    - Clear human-review UI and underlying data provenance
    - Review surface could be insufficient for audit-grade signoff if evidence views are thin
  - - Firm context and standards layer
    - Adapts outputs to firm, practice, engagement, and prior preferences
    - Durable structured context and policy inputs
    - Context drift or stale instructions could create repeatable errors
  - - Supervising agent
    - Coordinates the full workflow and routes work across specialized sub-agents
    - Frontier model reasoning quality and orchestration logic
    - Model-routing failures can propagate across long workflows
  - - Specialized sub-agents
    - Handle focused steps based on complexity, latency, and input type
    - Model benchmarks and tool-access boundaries
    - Coverage gaps or tool misuse may create hidden failure modes
  - - Tool / connector layer
    - Pulls in accounting data, documents, and actions required for execution
    - Authentication, external systems, and integration coverage
    - Public integration opacity prevents buyers from verifying deployment scope
  - - Control, eval, and internal operations layer
    - Internal APO, Atlas, and eval practices appear to improve product quality and iteration speed
    - Human managers, benchmarks, and operational discipline
    - Internal engineering maturity does not equal customer-facing workflow proof
  notes: This is a public-architecture synthesis from Basis and OpenAI materials. It distinguishes customer-facing workflow layers from internal engineering or operating-model signals.
