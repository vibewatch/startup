evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital structure
    missingEvidence: Public disclosure on any secondary sales, debt facilities, or warehouse-style credit linked to Basis.
    whyItMatters: >-
      Series B and investor-map analysis is incomplete without knowing whether employees or early investors received
      liquidity or whether non-equity financing exists.
    diligencePath: >-
      Request board materials, cap-table summary, financing documents, and any lender or secondary transaction schedules
      from management.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: revenue and ARR disclosure
    missingEvidence: Current ARR, revenue run rate, gross margin, and any customer-retention metrics.
    whyItMatters: >-
      The chapter can support funding and penetration signals, but not unit economics or quality-of-revenue
      underwriting.
    diligencePath: >-
      Request management KPI pack, board deck, and cohort retention data tied to GAAP or management reporting
      definitions.
    relatedQuestionRefs:
      - QO019
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: headcount and locations
    missingEvidence: A current employee count and precise office footprint instead of indirect hiring cues and New York references.
    whyItMatters: >-
      Operating leverage, burn, and org-scale assessment remain uncertain without a current people and location
      baseline.
    diligencePath: Request current org chart, headcount by function, office lease summary, and hiring plan.
    relatedQuestionRefs:
      - QO020
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: minor
    topic: leadership depth
    missingEvidence: A current board list and full executive roster beyond founders, investor-board names, and Annette Garcia.
    whyItMatters: Key-person dependence is easier to underwrite once the full management bench and committee structure are visible.
    diligencePath: >-
      Request current board observer list, executive roster, and role charters; cross-check against HR and insurance
      schedules.
    relatedQuestionRefs:
      - QO007
      - QO008
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: milestone chronology completeness
    missingEvidence: >-
      A fuller dated chronology covering internal launches, exact board approvals, and any undisclosed financing or
      customer milestones that did not make it into public materials.
    whyItMatters: >-
      The overview chapter has a usable chronology, but later chapters should know the milestone table is public-record
      partial rather than exhaustive.
    diligencePath: >-
      Request the internal company timeline, board calendars, and product launch log to reconcile what is missing from
      the public chronology.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO004
  - type: missing-source
    severity: material
    topic: Exact accounting-firm AI SAM
    missingEvidence: >-
      A public market estimate isolating software and automation spend by U.S. accounting firms, segmented by firm size
      and practice area.
    whyItMatters: >-
      Current public sources provide a broad services TAM and a broad software upper bound, but not a direct firm-only
      AI automation SAM for Basis.
    diligencePath: >-
      Request third-party market-study excerpts, Basis internal TAM model, and customer-spend segmentation by firm size,
      practice area, and module.
    relatedQuestionRefs:
      - QM027
      - QM031
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: Basis pricing and ACV distribution
    missingEvidence: Public pricing, contract structure, module packaging, seat economics, and ACV by firm tier.
    whyItMatters: Without pricing, the chapter cannot convert strong penetration signals into revenue-share or SOM estimates.
    diligencePath: >-
      Request price book, cohort-level contract values, implementation fees, renewal terms, and win-loss notes by
      segment.
    relatedQuestionRefs:
      - QM028
      - QM031
    relatedTableRefs:
      - TM002
      - TM003
  - type: missing-source
    severity: material
    topic: Independent benchmark evidence
    missingEvidence: >-
      Controlled, independent benchmarking of Basis accuracy, reviewer effort reduction, exception rates, and
      time-to-value against incumbent suites and narrower automation tools.
    whyItMatters: >-
      The market is crowded and public product pages are self-authored, so underwriting differentiation requires more
      than vendor claims and partner testimonials.
    diligencePath: >-
      Request benchmark studies, customer scorecards, implementation timelines, and documented before/after workflow
      metrics versus alternatives.
    relatedQuestionRefs:
      - QM025
      - QM032
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: minor
    topic: Firm-size adoption depth
    missingEvidence: >-
      A public breakdown of how deeply Basis is deployed within each firm tier, including modules live, users active,
      and client volume processed.
    whyItMatters: >-
      Current public evidence proves meaningful logo penetration but not the depth, breadth, or durability of adoption
      inside those firms.
    diligencePath: >-
      Request deployment-depth dashboards, module attach rates, user cohorts, and expansion / churn data by customer
      segment.
    relatedQuestionRefs:
      - QM024
      - QM028
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: peer-scale-funding-visibility
    missingEvidence: >-
      Apples-to-apples customer counts, revenue, funding, and deployment depth for Botkeeper, Truewind, Digits, Vic.ai,
      and BILL beyond marketing claims.
    whyItMatters: >-
      The competitor profile table can compare positioning, but not true share, monetization, or capital durability
      without standardized public scale disclosures.
    diligencePath: >-
      Request management's current win-loss deck and ask each reference customer which alternatives they evaluated, plus
      any public financing or customer-count materials not visible on the home pages.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: switching-cost-and-win-loss-data
    missingEvidence: >-
      Migration timelines, retention/expansion metrics, seat growth, and quantified win-loss data versus QuickBooks,
      Microsoft, Botkeeper, Digits, and Truewind.
    whyItMatters: >-
      The moat analysis is currently evidence-backed but still qualitative; underwriting durability requires proof that
      buyers expand usage after the initial wedge and do not revert to bundled substitutes.
    diligencePath: >-
      Ask Basis for deployment cohorts, implementation duration, logo retention, competitive displacement examples, and
      practice-line expansion rates by customer segment.
    relatedQuestionRefs:
      - QP020
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: material
    topic: basis-enterprise-pricing
    missingEvidence: >-
      Basis list pricing, minimum contract sizes, discounting rules, partner economics, or public ROI calculator with
      contractual detail.
    whyItMatters: >-
      Without contract economics it is difficult to compare Basis against cheaper published alternatives or bundled
      incumbent offers, and difficult to test whether workflow depth translates into pricing power.
    diligencePath: >-
      Request the current pricing book, standard MSA/order-form structure, partner revenue-share terms, and examples of
      how pricing changes from CAS-only deployments to multi-practice rollouts.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: Realized ACVs, discount bands, minimum contract sizes, and billing units by firm segment.
    whyItMatters: >-
      Without realized pricing data, adoption proof cannot be translated into recurring revenue quality or sales
      efficiency.
    diligencePath: Request price book, sample order forms, and closed-won ACV distribution by customer size.
    relatedQuestionRefs:
      - QI028
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: blocking
    topic: revenue-metrics
    missingEvidence: Current ARR, revenue run-rate, gross margin, and stream-level revenue mix.
    whyItMatters: These are the minimum metrics required to underwrite valuation, margin path, and durability of the business model.
    diligencePath: Request monthly management P&L and quarterly ARR bridge segmented by software, support, and services.
    relatedQuestionRefs:
      - QI026
    relatedTableRefs:
      - TI003
      - TI005
  - type: private-evidence-only
    severity: material
    topic: retention-concentration
    missingEvidence: Net retention, gross retention, logo concentration, and top-customer revenue exposure.
    whyItMatters: Enterprise adoption anecdotes do not prove durable recurring revenue or diversified customer economics.
    diligencePath: Request cohort retention tables, top-10 customer list with revenue share, and renewal / churn schedule.
    relatedQuestionRefs:
      - QI012
    relatedTableRefs:
      - TI005
  - type: missing-source
    severity: material
    topic: burn-runway
    missingEvidence: Current cash balance, monthly burn, and management runway forecast.
    whyItMatters: Scenario estimates are not sufficient for assessing insolvency risk or next-round timing.
    diligencePath: Request trailing 12 months of cash flow and the current operating-plan runway model.
    relatedQuestionRefs:
      - QI017
    relatedTableRefs:
      - TI004
  - type: private-evidence-only
    severity: material
    topic: services-mix
    missingEvidence: Share of revenue and delivery cost attributable to onboarding, configuration, support, and professional services.
    whyItMatters: Software-like margins cannot be assumed if service-heavy deployments are a material part of the model.
    diligencePath: Request revenue mix by stream and gross margin bridge separating software from services and support.
    relatedQuestionRefs:
      - QI029
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: integration-catalog
    missingEvidence: >-
      A current list of supported ERP, tax engine, document-management, storage, and communication integrations with
      scope by workflow.
    whyItMatters: >-
      Deployment effort, buyer fit, and switching-cost analysis depend on which systems Basis can actually connect to in
      production.
    diligencePath: Request the current integration matrix, authentication patterns, and customer references by integration family.
    relatedQuestionRefs:
      - QE015
      - QE027
    relatedTableRefs:
      - TE004
  - type: missing-source
    severity: material
    topic: reliability-sla
    missingEvidence: Public or private uptime targets, incident-history summaries, recovery objectives, and escalation commitments.
    whyItMatters: >-
      High-stakes accounting workflows require confidence that the platform can support close, tax, and audit deadlines
      without opaque downtime risk.
    diligencePath: >-
      Request SLA documents, status-history exports, backup and disaster-recovery RPO/RTO targets, and customer support
      escalation runbooks.
    relatedQuestionRefs:
      - QE016
      - QE028
    relatedTableRefs:
      - TE004
  - type: private-evidence-only
    severity: material
    topic: quality-metrics
    missingEvidence: Workflow-level accuracy, override, exception, and audit-quality metrics by practice area and task.
    whyItMatters: >-
      Without measured quality by workflow, investors cannot tell whether public testimonials reflect repeatable product
      performance or bespoke implementation wins.
    diligencePath: >-
      Request internal QA dashboards, benchmark definitions, override rates, and customer review-cycle metrics for CAS,
      tax, and audit.
    relatedQuestionRefs:
      - QE024
      - QE028
    relatedTableRefs:
      - TE006
  - type: private-evidence-only
    severity: material
    topic: model-stack
    missingEvidence: >-
      A versioned record of model providers, routing rules, and fallback behavior beyond the OpenAI stack publicly
      described.
    whyItMatters: >-
      Model concentration, latency, cost, and explainability risks depend on the real serving stack, not only the
      partner story presented in public case studies.
    diligencePath: >-
      Request model-governance documentation, vendor concentration analysis, and change-management history for routing
      decisions.
    relatedQuestionRefs:
      - QE009
      - QE025
    relatedTableRefs:
