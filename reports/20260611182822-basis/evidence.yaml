      disclosures.
    diligencePath: >-
      Request DPA templates, privacy addenda, current compliance roadmap, and third-party assessments tied to enterprise
      product data handling.
    relatedQuestionRefs:
      - QE018
      - QE019
    relatedTableRefs:
