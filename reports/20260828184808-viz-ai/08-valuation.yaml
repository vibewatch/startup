- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Evidence-supported view
  - What would change the view
  rows:
  - - 'Thesis: enterprise clinical workflow platform'
    - Broad adoption, module breadth, customer-success infrastructure, and life-sciences monetization suggest real platform potential
    - Upgrade further if private diligence shows strong NRR, low churn, and healthy gross margins
  - - 'Thesis: installed-base depth supports monetization expansion'
    - Nearly 2,000 hospitals and multiple monetization vectors support cross-sell logic
    - Upgrade if expansion ARR per health system is disclosed and strong
  - - 'Anti-thesis: stale unicorn mark is unsupported'
    - The last confirmed valuation implies a multiple above today’s public comp band
    - Neutralize if current ARR, retention, and margins support premium comp treatment
  - - 'Anti-thesis: high-touch model may cap margins'
    - Support, implementation, and clinical enablement are strengths but can also suppress software-like margin scaling
    - Relax if management shows improving deployment leverage and segment margins
  - - 'Anti-thesis: life sciences upside may be concentrated'
    - Partnership count is encouraging, but economics and renewal quality are opaque
    - Relax if partner concentration and gross margin data are favorable
  - - 'Anti-thesis: reimbursement wins are real but narrow'
    - NTAP and HCM payment support help, yet do not de-risk the whole catalog
    - Relax if more modules show durable economic adoption pathways
  notes: Rows are arranged to show both upside logic and the specific evidence required to turn that logic into valuation support.
