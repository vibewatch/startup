  - - Bull
    - $80M+ ARR, strong retention, limited concentration, scalable life-sciences monetization, improving margin structure
    - 9x-12x ARR => ~$720M-$960M EV; good upside only if entry is well below this band
    - Requires private proof that public sources do not yet provide
    - Possible, but contingent on diligence rather than public evidence alone
