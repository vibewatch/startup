- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Security / privacy breakdown
    - Material security incident, breach notice, or repeated audit exception
    - Any major PHI event or pattern of serious control failure
    - Pause bullish view until incident handling and customer retention are re-underwritten
  - - Reimbursement deterioration
    - Loss of key payment support or failure of new pathways to gain support
    - Negative policy shift in a reference pathway or no broader reimbursement progress
    - Lower growth confidence and reduce valuation premium
  - - Installed-base slowdown
    - Hospital, provider-user, or partner growth flattens materially
    - No meaningful expansion in key footprint metrics across two reporting periods
    - Reassess customer depth and product relevance
  - - Retention / concentration disappointment
    - Private diligence shows weak renewals or concentrated revenue
    - NRR below software-quality threshold or outsized top-account dependency
    - Cut conviction sharply
  - - Execution overload
    - Support, implementation, or module rollout quality worsens
    - Rising go-live delays, support backlog, or account dissatisfaction
    - Assume margin path and expansion story are weaker than public narrative
  - - Strategic displacement
    - Broader platforms or incumbents bundle similar workflows successfully
    - Reference customers choose competitor platform standardization
    - Reframe Viz.ai as feature-vulnerable rather than platform-defensible
  notes: These kill criteria are designed to be monitorable rather than abstract.
