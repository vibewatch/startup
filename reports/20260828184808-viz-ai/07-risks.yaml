- id: operational-partner-and-model-risk
  title: Operational, partner, and model risk
  body: |-
    Operationally, Viz.ai depends on much more than the algorithm. It depends on imaging and clinical data flows, customer IT integration, training, workflow design, support quality, and continued clinician response. The support and customer-resource materials make that clear. This is a high-touch product, which creates stickiness but also scaling burden. Rural hospitals and association channels deepen that tradeoff: they broaden reach and social mission, yet often come with tighter budgets, lighter local IT capacity, and more fragile transfer workflows. Those conditions can lengthen time to value and make rollout quality harder to standardize.

    Partner and model risks also remain unresolved. Channel relationships with associations are promising, but public data does not show conversion efficiency or economic durability. Reimbursement support exists for some modules but not all, making the model vulnerable if workflow ROI becomes harder to defend. Competitive pressure is also intensifying as rival and incumbent vendors move toward the same enterprise value narrative. The risk is not necessarily immediate collapse. It is gradual compression: slower expansion, harder procurement, more discounting, and more scrutiny of every new workflow line the company adds.
