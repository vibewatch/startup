chapter:
  number: 7
  title: Risks
  summary: 'Viz.ai’s risk profile is not dominated by one fatal flaw, but by a set of interacting downside paths: regulatory and evidence burden as modules multiply, uneven reimbursement support, PHI and privacy exposure, high dependence on customer implementation quality, competition around workflow infrastructure, and still-limited public visibility into retention, concentration, and cash generation. The company has meaningful mitigants—trust posture, scale, customer success infrastructure, and clearances—but several of the most important residual risks still require private diligence.'
sections:
- id: severity-ranked-top-risks
  title: Severity-ranked top risks
  body: |-
    Viz.ai does not look like a company facing one single catastrophic red flag. Instead, it faces a cluster of material but interconnected risks that are common to scaled clinical AI platforms: regulatory complexity as modules proliferate, uneven reimbursement support, PHI and privacy exposure, high dependence on customer implementation quality, channel and concentration opacity, and competition that is steadily moving closer to enterprise workflow orchestration. The fact that the product remains assistive reduces some autonomous-AI danger, but it does not remove human-factors or governance risk. If anything, it shifts more responsibility into real-world implementation quality.

    The positive counterweight is that Viz.ai has visible mitigants. It has accumulated trust documentation, multiple regulatory clearances, customer-success infrastructure, a meaningful installed base, and some reimbursement precedents. That combination makes residual risk more manageable than an early-stage unproven AI company. But it is not enough to make risk low. The company is already big enough that a notable incident, reimbursement reversal, procurement slowdown, or platform-displacement trend would have investment consequences that flow across multiple modules and revenue lines at once.
  claimRefs:
  - CR001
  - CR023
  - CR030
  - CR031
  - CR035
  - CR040
  tableRefs:
  - TR001
  figureRefs:
  - FR001
- id: regulatory-legal-and-security-risk
  title: Regulatory, legal, and security risk
  body: |-
    The most structurally important risk area is regulatory and legal. Viz.ai operates in clinical decision support and disease-detection workflows, so every new module requires more evidence, more compliance discipline, and more post-market vigilance. FDA oversight, ACR governance expectations, privacy notices, HIPAA security obligations, and cross-border legal documentation all point in the same direction: this is a platform that lives inside a dense compliance perimeter. The company’s assistive posture matters here. Because clinicians remain in the loop, Viz.ai avoids some of the hardest autonomous-software liability questions, but it still depends on hospitals using the system correctly and consistently.

    Security and privacy amplify this risk because PHI-heavy workflow software can lose years of procurement trust from a single high-profile incident. Viz.ai public trust materials are stronger than average, and the SOC 2 + HIPAA audit announcement is a real mitigating signal. Yet public documents cannot answer the hardest questions: incident history, drift monitoring, workflow override rates, local governance failures, or how frequently customer-side configuration creates risk. That is why the legal risk today looks more prospective than litigated, but still highly material.
  claimRefs:
