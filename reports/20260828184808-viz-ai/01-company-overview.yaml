- id: milestones-risk-flags-and-open-diligence
  title: Milestones, product limitations, and open diligence flags
  body: |-
    Viz.ai's milestone record supports a company that has repeatedly moved from single-use validation toward broader platform credibility. The public chronology includes the first-of-its-kind FDA authorization in stroke, CMS reimbursement leadership via NTAP, international expansion signals by 2022, broader disease expansion by 2024-2026, and a growing evidence base that the company now measures in the hundreds of studies and abstracts. By the 2026 anniversary release, management was comfortable describing Viz.ai as an enterprise-grade healthcare AI platform rather than a stroke company.

    Still, the most useful adverse evidence is found inside the company own labeling and disclosure limits. Viz LVO, Viz ICH, and Viz HCM are all described as assistive, parallel-workflow tools that do not replace standard-of-care diagnosis or full physician evaluation. That reinforces the core business logic - faster escalation and coordination rather than autonomous diagnosis - but it also means value depends on clinician adoption, alert quality, and careful integration. Public headcount data are also inconsistent: Forbes listed 251 employees in March 2026 while GetLatka estimated 312 in late 2025. Likewise, profitability claims now exist without audited revenue, margin, or cash detail. The result is a company with very strong adoption and platform signals, but one that still requires direct management diligence on financial quality, global mix, and governance mechanics before any investor should underwrite a late-stage valuation with confidence.
