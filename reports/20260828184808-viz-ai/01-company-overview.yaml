- id: capital-history-scale-and-partnerships
  title: Capital history, scale milestones, and strategic partnerships
  body: |-
    The public capital history is strong enough to establish late-stage status, but not strong enough to resolve the full capitalization picture. The anchor fact is the April 2022 Series D: Viz.ai raised $100 million at a $1.2 billion valuation with Tiger Global and Insight Partners leading and a mix of prior backers returning. One year later, CIBC Innovation Banking provided a $40 million growth-capital facility that the company said would support expansion and potential acquisitions. Third-party databases then estimate cumulative equity raised at about $242 million, which implies all-in disclosed capital of at least about $282 million when the CIBC facility is included. That is directionally consistent with public ambiguity around whether debt-like capital is counted, but it still leaves a diligence gap around exact preferences, ownership, and any secondary activity.

    Scale progression is unusually visible. In the 2022 Series D materials, Viz.ai said it had surpassed 1,000 hospital users and covered more than 220 million lives across 1,400-plus hospitals and health systems. The 2023 financing materials said the platform served one patient every 21 seconds across more than 1,300 hospitals. By January 2025, Viz.ai claimed 1,700 hospitals, 60,000 providers, and more than 48 modules inside Viz.ai One. By January and July 2026, the company was saying nearly 2,000 hospitals, 230 million lives, more than 50 care pathways, and a healthcare business that had turned profitable in 2025.

    Partnerships help explain how Viz.ai is trying to turn that scale into a broader platform position. Microsoft expands the imaging-workflow and enterprise-deployment story, while Salesforce expands the life-sciences monetization path by connecting real-time clinical triggers to compliant commercial and support workflows. Those are not just marketing badges; they show Viz.ai trying to extend its role from alerting clinicians toward becoming a system-of-action layer around the hospital workflow.
