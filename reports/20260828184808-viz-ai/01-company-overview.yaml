  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: capital structure
    missingEvidence: Current cap table, liquidation preferences, debt covenants, and any secondary-share history since the 2022 Series D.
    whyItMatters: Valuation and ownership concentration cannot be judged precisely without knowing the preference stack and any non-public capital instruments.
    diligencePath: Request the latest board deck, cap table, and debt facility summary from management or lead investors.
    relatedQuestionRefs:
    - QO015
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: material
    topic: headcount
    missingEvidence: A management-confirmed employee count and function mix as of the run date.
    whyItMatters: Public employee estimates diverge materially, which weakens productivity comparisons and cost-base inference.
    diligencePath: Collect payroll or HRIS snapshots and reconcile them to any disclosed contractor base.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
  - type: private-evidence-only
    severity: material
    topic: financial disclosure
    missingEvidence: Audited revenue, margin, cash, and burn metrics that reconcile the profitability narrative with actual operating results.
    whyItMatters: The company now claims healthcare-business profitability, but investment sizing still depends on consolidated free-cash-flow and capital needs.
    diligencePath: Request monthly P&L, balance sheet, cash-flow statements, and segment revenue and margin by provider versus life-sciences businesses.
    relatedQuestionRefs:
    - QO020
    - QO029
  - type: enumeration-incomplete
    severity: minor
    topic: board and investor governance
    missingEvidence: Full board observer list, committee structure, and investor ownership percentages.
    whyItMatters: Governance control can influence financing strategy, exit timing, and downside protection for new investors.
    diligencePath: Review charter documents, board minutes, and the latest governance matrix.
    relatedQuestionRefs:
    - QO007
    - QO011
    relatedTableRefs:
    - TO002
    - TO003
  - type: stale
    severity: minor
    topic: international footprint
    missingEvidence: Updated disclosure on non-U.S. revenue, active hospital counts outside the U.S., and current legal-entity staffing by region.
    whyItMatters: The 2022 release showed international locations, but the current growth story is overwhelmingly U.S.-centric.
    diligencePath: Request regional revenue and deployment mix from finance and operations leaders.
    relatedQuestionRefs:
    - QO028
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology before Series D
    missingEvidence: Primary documents for Viz.ai pre-2022 rounds and earlier product launches that would make the milestone chronology exhaustive instead of post-Series-D weighted.
    whyItMatters: The public chronology is sufficient for major inflection points but not complete enough to prove every early financing and product milestone.
    diligencePath: Fetch primary press releases or financing databases for Series A through Series C and reconcile them into the chronology of record.
