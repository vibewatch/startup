company:
  name: Viz.ai
chapter:
  number: 1
  title: Company Overview
  summary: Viz.ai is a San Francisco-based clinical AI company founded in 2016 by Chris Mansi and David Golan to reduce treatment delays in time-critical care. Public disclosures show a progression from early stroke-focused workflow software to a multi-specialty enterprise platform reaching nearly 2,000 hospitals, 230 million lives, and a dual business model spanning hospital SaaS and life-sciences workflow partnerships. The strongest public signals are the 2022 $100 million Series D at a $1.2 billion valuation, the 2025 claim of healthcare-business profitability, and the 2026 evidence that Microsoft and Salesforce partnerships are widening Viz.ai's operating surface, while exact cap-table, headcount, and full financial transparency remain unresolved.
sections:
- id: identity-and-business-model
  title: Identity, founding story, and business model
  body: |-
    Viz.ai was founded in 2016 after Chris Mansi concluded that many poor acute-care outcomes were driven not by a lack of clinical knowledge but by handoff delay, communication friction, and inconsistent escalation between radiologists, emergency clinicians, and specialists. The company origin story is explicit: a patient died because the care pathway moved too slowly even after technically successful treatment. That framing still matters because it explains why Viz.ai positions itself less as a point algorithm vendor and more as a clinical workflow company. Public materials consistently describe an AI-powered care coordination platform that analyzes imaging or ECG data, surfaces suspected time-sensitive findings, and synchronizes the care team in parallel with the normal standard of care.

    The business model has broadened alongside the product. In provider markets, Viz.ai sells an enterprise platform to hospitals and health systems that want faster triage, better coordination, and expansion across multiple service lines. In life sciences, Viz.ai increasingly monetizes the same embedded workflow position by helping partners identify eligible patients, support therapy initiation, and route clinician education at the point of care. By 2026, the company was explicitly presenting hospital subscriptions and life-sciences workflow partnerships as two parallel revenue lines, not just a core provider product with incidental partnerships. That distinction is strategically important because it means the same clinical data and workflow layer can support both hospital ROI and partner go-to-market use cases.
