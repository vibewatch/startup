- id: adjacent-rivals-and-budget-competitors
  title: Adjacent rivals and AI-budget competitors
  body: |-
    Not every important competitor tries to replicate Viz.ai end-to-end. Qure.ai overlaps in stroke and broader imaging use cases, but its public materials lean more toward global screening, hardware-agnostic deployment, and public-health style programs than Viz.ai's U.S. enterprise-hospital emphasis. Avicenna.AI is closer in emergency-imaging workflow and patient-management logic, yet still looks narrower and more specialty-led. Cleerly sits in a different but strategically relevant lane because reimbursed cardiac imaging tools can capture specialty budgets even without a broad orchestration narrative. PathAI competes for enterprise AI attention through digital pathology workflows, while deepc competes as infrastructure for health-system AI deployment.

    This matters because large health systems do not always budget AI by narrow disease category. They often compare radiology, pathology, cardio, and workflow vendors inside the same governance process. In that setting, a specialty vendor with clean economics or a cross-modality workflow platform can still weaken Viz.ai's sales motion even without being a one-to-one substitute. Viz.ai's own integration of Avicenna.AI tools also shows that some competition becomes coopetition once a platform reaches sufficient scale.
