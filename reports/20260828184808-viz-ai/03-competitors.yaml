- id: switching-costs-and-moat-durability
  title: Switching costs, commoditization, and moat durability
  body: |-
    Switching costs in this market come from operational embedding, not from one algorithm alone. Once a vendor is inside PACS, worklists, alert routing, care-team escalation, and governance routines, replacing it can disrupt multiple departments and require new security reviews, retraining, and workflow redesign. That supports a real moat for whichever platform becomes standard inside the hospital. Viz.ai benefits from this dynamic where buyers want a single workflow layer across radiology, neuro, cardio, vascular, and adjacent service lines.

    Still, the moat is not absolute. Aidoc and RapidAI also use enterprise-platform language, while orchestration players like deepc attack the infrastructure layer directly. Specialty vendors such as Cleerly can win narrowly where reimbursement is cleaner, and open-platform behavior can both strengthen and weaken Viz.ai over time. The clearest long-term risk is that enterprise imaging AI becomes a feature of broader workflow infrastructure rather than a distinct category. If that happens, the winner will be the vendor with the deepest installed-base trust, integration leverage, and evidence of expansion, not necessarily the vendor with the most colorful algorithm portfolio.
