- id: buying-criteria-pricing-and-distribution
  title: Buying criteria, pricing opacity, and distribution power
  body: |-
    The retained independent sources reinforce that vendor selection is increasingly about workflow value. Radiology Business argues that enterprise AI buyers care about deeper orchestration, operational efficiency, and alignment with imaging IT backbones, while ACR frames deployment as a governance and quality-assurance problem. FDA oversight also keeps regulatory posture relevant. Viz.ai's own indications for use underscore that these products remain assistive rather than autonomous, which means workflow quality, trust, and clinician response are what buyers actually monetize.

    Pricing opacity makes the competitive picture harder to read. The fetched public sources almost never disclose per-hospital pricing, module ACV, or discount structures, so it is difficult to know whether wins are driven by breadth, evidence, or commercial concessions. In that vacuum, partner ecosystems matter more. Viz.ai's Microsoft and Salesforce relationships suggest a distribution and credibility advantage that most retained competitor sources did not match publicly. But ecosystems can also create dependency risk if channel economics or platform access change.
