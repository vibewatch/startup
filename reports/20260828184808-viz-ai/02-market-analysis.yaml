company:
  name: Viz.ai
chapter:
  number: 2
  title: Market Analysis
  summary: Viz.ai operates inside the enterprise clinical-AI market for time-sensitive imaging workflows, care coordination, and adjacent life-sciences workflow activation. Public evidence supports a large outer envelope - $5.3 trillion of U.S. health expenditure, $1.6347 trillion of hospital spend, 6,120 U.S. hospitals, a projected $8.18 billion global medical-imaging-AI market by 2030, and a much broader $194.4 billion AI-in-healthcare forecast - but those numbers bound the opportunity more convincingly than they define a clean Viz.ai SAM. The strongest adoption drivers are workflow delay reduction, clinician shortage, and enterprise orchestration value, while the clearest constraints are reimbursement scarcity outside a few modules, regulatory and governance burden, and the absence of public pricing detail.
sections:
- id: market-boundary
  title: Market boundary and status-quo substitutes
  body: |-
    Viz.ai should be framed first as workflow software attached to time-sensitive clinical decisions, not as a generic healthcare-AI vendor. Its radiology and neuro pages emphasize worklist prioritization, PACS integration, mobile collaboration, and downstream coordination rather than autonomous diagnosis. That means the relevant boundary starts with imaging-triggered triage and care-team activation, then widens into enterprise service-line coordination and select life-sciences workflows that depend on the same real-time trigger layer. This framing excludes scanner hardware, generic EHR spend, broad clinical documentation software, and most of the trillion-dollar categories inside healthcare expenditure.

    The status quo is still powerful. Hospitals can keep using existing PACS queues, radiologist review, manual paging, and human escalation without buying an enterprise AI workflow layer. Radiology Business makes the same point from the market side: standalone applications do not win by themselves if they cannot integrate into the imaging-IT backbone or prove enterprise value. The practical substitute is therefore not just another algorithm vendor; it is incumbent workflow plus selective point tools layered onto existing IT. That is why the right question is not whether the healthcare-AI market is large in aggregate, but whether enough provider and life-sciences budgets exist for workflow software that makes urgent care pathways faster, more coordinated, and more measurable.
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  - CM005
  - CM028
  - CM044
  - CM045
  tableRefs:
  - TM001
- id: sizing-lenses
  title: Evidence-constrained sizing lenses
  body: |-
    Public data provide credible market bounds but not a single precise TAM. The broadest ceiling is CMS national health expenditure, which reached $5.3 trillion in 2024, including $1.6347 trillion in hospital spend and $1.1097 trillion in physician and clinical services. The institutional-buyer lens then narrows to 6,120 U.S. hospitals and more than 916,000 staffed beds. The category lens narrows further: Grand View Research projected an $8.18 billion global AI-in-medical-imaging market by 2030 with neurology and CT leading early mix, while Allied Market Research projected a much broader $194.4 billion AI-in-healthcare market by 2030 that includes many categories far outside Viz.ai's core. These are useful bounds, but they measure different scopes.

    The most relevant Viz.ai-specific lens is installed-base evidence. The company says it now reaches nearly 2,000 hospitals and 230 million lives, with major adoption across top health systems and a module set that has expanded beyond stroke into cardio, oncology, pulmonology, and vascular workflows. That shows the market is commercially real. But because public sources do not disclose price per hospital, module attach, or segment revenue mix, the report uses an evidence-constrained SAM proxy rather than pretending to know a clean published market share. A rough $4 billion to $16 billion U.S. SAM range for enterprise imaging workflow, urgent care coordination, and adjacent life-sciences workflow software is analytically more honest than reusing trillion-dollar healthcare-spend numbers as if they were directly addressable revenue.
