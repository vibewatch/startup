callouts:
- calloutType: insight
  title: The market is smaller than healthcare spend but larger than stroke triage
  body: Viz.ai addressable market is best understood as enterprise workflow software attached to urgent care, not all AI in healthcare and not only stroke. The opportunity widens when the same trigger layer can support cardio, oncology, or life-sciences workflows.
  claimRefs:
  - CM001
  - CM028
  - CM032
  - CM044
- calloutType: risk
  title: Reimbursement remains the weakest public proof point
  body: Outside a handful of pathways, imaging AI still struggles to show clean line-item reimbursement. That means buyers often fund Viz.ai through workflow ROI, which raises the evidentiary bar on integration, safety, and operational outcomes.
  claimRefs:
  - CM018
  - CM019
  - CM020
  - CM049
- calloutType: assumption
  title: Public SAM must stay range-based
  body: Without price, attach-rate, and retention data, any precise SAM or SOM would be pseudo-accuracy. A range is more defensible than a single-point TAM estimate.
  claimRefs:
  - CM034
  - CM043
  - CM047
