- id: drivers-constraints-and-diligence-gaps
  title: Drivers, constraints, and unresolved diligence gaps
  body: |-
    The strongest demand drivers are structural. Imaging-AI category forecasts remain high growth, clinicians still face heavy workflow pressure, and both company and independent sources emphasize that urgent-care AI wins when it reduces delay across entire hospital networks. Viz.ai is especially well positioned where time-sensitive detection can mobilize a downstream team and create measurable operational value. Partner channels can reinforce that dynamic by shortening deployment, extending distribution, or making life-sciences workflows more actionable at the point of care.

    The constraints are equally real. Radiology Business notes that revenue still concentrates in only a few reimbursable or operationally obvious applications, and that ROI often remains hard to prove. ACR and FDA materials reinforce the governance burden, while Allied highlights clinician-acceptance and safety concerns. Viz.ai's own indications for use show that the product is assistive, not autonomous, which means hospitals still bear the cost of expert review and downstream action. The final unresolved gap is pricing: public evidence never reveals what a hospital or life-sciences partner actually pays. Without price, attach-rate, and retention data, the market can be bounded intelligently but not converted into a precise bottoms-up SOM.
