companyProfile:
  summary: >-
    Viz.ai is a clinical AI company founded in 2016 by Dr. Chris Mansi and Dr. David Golan.
    The company sells a workflow-embedded care-coordination platform used by hospitals and health
    systems to detect time-sensitive conditions from imaging and other clinical signals, mobilize
    care teams, and increasingly support administrative and life-sciences workflows. Public 2025-2026
    evidence shows a scaled footprint approaching or exceeding 2,000 hospitals, a growing life-sciences
    business, and healthcare-business profitability, but the company still does not publicly disclose
    the retention, margin, concentration, and cash-flow data needed to underwrite a premium late-stage
    private valuation with confidence.
  foundedDate: "2016-01-01"
  founders:
    - name: Dr. Chris Mansi
      role: Co-founder and CEO
      background: >-
        Neurosurgeon co-founder and continuing chief executive identified in official company materials.
      claimRefs:
        - CO001
        - CO005
    - name: Dr. David Golan
      role: Co-founder and technical founder
      background: >-
        Machine-learning researcher and co-founder identified in official company materials.
      claimRefs:
        - CO001
  headquarters: San Francisco, California, USA
  productSummary: >-
    Viz.ai sells an AI-powered clinical workflow and care-coordination platform that analyzes imaging
    and multimodal clinical data, routes alerts to specialists, supports treatment workflows across
    multiple disease areas, and increasingly extends into documentation, operational workflows, and
    life-sciences patient-identification programs.
  customerFocus: >-
    Health systems, hospitals, stroke and cardiovascular service lines, radiology and emergency-care
    teams, and life-sciences companies seeking embedded patient-identification and therapy-initiation
    workflows.
  businessModel: >-
    Enterprise SaaS sold into hospitals and health systems, supplemented by workflow-enablement and
    customer-success services, plus a life-sciences revenue stream tied to embedded patient-identification,
    education, and therapy-initiation workflows.
  stage: late-stage private
  fundingStatus: >-
    The last confirmed equity round was the $100 million Series D announced in April 2022 at a
    $1.2 billion valuation. Public evidence also shows a $40 million CIBC growth-capital facility in
    March 2023 and suggests roughly $282 million of publicly disclosed capital on a conservative basis.
