- id: architecture-and-operating-model
  title: Architecture and operating model
  body: |-
    Public materials reveal a fairly specific operating pattern even though core code and infrastructure details remain private. In the radiology and specialty pages, Viz.ai repeatedly describes cloud-native workflow orchestration tied into PACS, EHR, mobile, and desktop surfaces through standard communication protocols. Clinicians can view algorithm-processed images, receive alerting, coordinate across departments, and in some modules act on derived measurements or guideline-oriented support without leaving the enterprise workflow layer. Viz Assist and Agent Studio push that operating model further, extending from detection into documentation, coding support, and configurable pathway logic.

    The architecture is therefore best thought of as a multimodal ingestion-and-routing stack with disease-specific modules on top. Imaging and other clinical signals are ingested, AI models or rules process them, the system routes alerts or summaries to the appropriate care team, and the clinician remains in the loop for review and action. That is powerful because the same backbone can support many clinical use cases. But it also means dependence on customer IT, data quality, access control, and change management is structurally high. If those dependencies are weak, product breadth alone will not guarantee reliable outcomes.
  claimRefs:
  - CE003
  - CE005
  - CE006
  - CE022
  - CE023
  - CE024
  - CE032
  - CE033
