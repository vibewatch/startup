figures:
- id: FE001
  title: Product architecture map
  type: stack
  layout: standard
  summary: 'Public product materials support a layered architecture: multimodal ingestion, disease-specific AI, workflow routing, clinician-facing surfaces, and trust/compliance controls across the stack.'
  data:
    layers:
    - label: Layer 1 — Data ingestion
      detail: Imaging and other clinical signals enter the platform from hospital systems using standard communication protocols.
    - label: Layer 2 — Disease-specific AI modules
      detail: Condition modules detect suspected disease or quantify relevant measurements such as perfusion, hemorrhage, aneurysm, or RV/LV ratios.
    - label: Layer 3 — Workflow routing and collaboration
      detail: The platform sends alerts and context to the right multidisciplinary care teams across mobile and desktop surfaces.
    - label: Layer 4 — Clinician-facing applications
      detail: Radiology, neuro, cardio, vascular, oncology, Assist, and other specialty surfaces present outputs in workflow context.
    - label: Layer 5 — Trust and governance controls
      detail: SOC 2, HIPAA, privacy, continuity, and procurement-oriented controls sit across the platform as enterprise requirements.
    - label: Layer 6 — Configurable pathway logic
      detail: Agent Studio extends the stack by allowing health systems to customize and scale care pathways over the same backbone.
  approximationNotes: The stack synthesizes repeated operating patterns from product and trust pages; proprietary infrastructure internals remain private.
  claimRefs:
  - CE022
  - CE023
  - CE024
  - CE031
  - CE032
  - CE033
