- id: deployment-trust-and-operational-controls
  title: Deployment, trust, and operational controls
  body: |-
    Trust and procurement-readiness are central parts of the product, not side documentation. Viz.ai trust materials say the platform processes PHI across thousands of hospitals and describe a security and privacy program covering encryption, SOC 2 Type II, HIPAA safeguards, privacy governance, and continuity standards such as ISO 22301. The 2024 audit announcement adds a more concrete signal by saying the company completed SOC 2 Type II plus HIPAA audits with Big Four involvement. Taken together, these materials make a credible case that security, privacy, and enterprise reviewability are deliberate product features for Viz.ai.

    However, these disclosures still stop short of full technical assurance. Public trust-center content does not provide incident history, SLA detail, model-release discipline, or module-level performance drift monitoring. ACR best-practice guidance is a useful reminder that governance, monitoring, and local clinical controls remain necessary even when a vendor is well organized and regulatory clearances are in place. The product therefore looks enterprise-ready from a documentation and control posture, but not fully transparent from a third-party reliability-audit perspective.
  claimRefs:
  - CE011
  - CE012
  - CE013
  - CE014
  - CE021
  - CE031
  - CE034
  - CE038
  tableRefs:
  - TE004
- id: differentiation-maturity-and-technical-risks
  title: Differentiation, maturity, and technical risks
  body: |-
    Viz.ai strongest product differentiation appears to come from combination rather than any single model. The company has a broad and growing set of disease workflows, a multimodal routing layer, procurement-oriented trust documentation, increasing regulatory depth, and a credible enterprise installed base reinforced by 120-plus publications and high alert engagement. Independent signals from TIME and syndicated 2026 releases support the view that the product has reached real hospital-scale maturity rather than remaining a pilot-heavy concept.

    The clearest technical caveat is that much of the platform’s leverage still depends on human and organizational behavior. Clinicians must trust and act on alerts, hospitals must implement integrations correctly, and each added module increases roadmap and support complexity. Developer signals also show a closed, enterprise-first posture: there is little open-source or public API evidence around the core platform, so external builders and community validation are limited. That does not weaken the product for current hospital buyers, but it does mean extensibility, resilience, and long-term substitutability should be tested through private technical diligence rather than assumed from marketing copy.
  claimRefs:
