- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Clinical data ingestion
    - Ingests imaging and other clinical signals into platform
    - Scanner, PACS, EHR, EMS, and standard communication protocols
    - Data-format inconsistency or access failure can degrade workflow
  - - Disease-specific AI modules
    - Detects suspected disease or quantifies relevant measurements
    - Model performance, regulatory clearance, and image/data quality
    - False positives, false negatives, and post-market drift remain partly private
  - - Workflow routing and collaboration
    - Alerts the right specialists on mobile and desktop
    - Identity, notification, and team-routing configuration at customer site
    - Poor routing design can slow response even if algorithm works
  - - PACS / EHR integration layer
    - Returns outputs to clinician-native systems
    - Hospital IT integration and change management
    - Implementation burden or platform changes can delay rollout
  - - Assistive guideline and documentation layer
    - Surfaces insights, drafts, and coding suggestions
    - Multimodal data context and human review
    - Automation can create over-trust if clinicians rubber-stamp outputs
  - - Pathway configuration / Agent Studio
    - Lets customers extend workflows over same backbone
    - Governance, permissions, and vendor-managed controls
    - Extensibility without strong governance can create inconsistency across sites
  notes: This table describes the public operating pattern, not proprietary model architecture or infrastructure internals.
