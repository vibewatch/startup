- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Viz.ai solution
  - Measurable benefit
  - Limitation
  rows:
  - - Radiology triage and cross-team escalation
    - Read images in PACS, call downstream specialists, coordinate manually
    - AI flags suspected disease, returns processed images to PACS, and routes alerts to mobile/desktop teams
    - Faster escalation inside clinician-native workflow
    - Public false-positive and alert-fatigue rates are not disclosed
  - - Stroke perfusion review
    - Specialists review separate perfusion outputs and activate team manually
    - Viz CTP provides mobile/desktop ischemic-core and Tmax estimates with configurable thresholds
    - Potentially faster threshold-based activation and review
    - Comparative performance versus alternative CTP tools is not public
  - - EMS-to-cath-lab ACS coordination
    - ECGs arrive by text/photo or fragmented systems
    - Viz ACS centralizes full-quality ECGs in a HIPAA-compliant workflow
    - Reduces blurry-photo friction and unnecessary false alarms
    - No public latency or activation metrics by hospital
  - - Health-system ECG screening for HCM
    - Manual specialist referral after scattered ECG review
    - Viz HCM analyzes 12-lead ECGs and triages suspected cases to specialists
    - Supports earlier workup and better pathway standardization
    - Broader reimbursement and utilization economics remain unclear
  - - Clinician documentation and coding prep
    - Pre-chart, review imaging, and draft notes manually
    - Viz Assist surfaces key history, drafts notes, referral letters, and suggested billing codes
    - Operational time savings and possible revenue recovery
    - Human review quality and actual coding lift are not publicly audited
  - - Pathway design and guideline rollout
    - Custom EHR build or manual protocol change management
    - Agent Studio lets health systems create and update pathways faster
    - Potentially reduces IT backlog and pathway-launch time
    - Public evidence of customer-built pathway scale is limited
  notes: Benefits are presented as workflow advantages supported by product materials, not as universally audited outcome guarantees.
