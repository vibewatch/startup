  topStrengths:
    - Strong platform adoption across roughly 2,000 hospitals and a growing active clinician base.
    - >-
      Product position is broader than a single algorithm, spanning detection, care coordination, and workflow
      enablement.
    - Dual monetization path across provider software and life-sciences partnerships adds optionality.
    - Healthcare-business profitability in 2025 is a meaningful positive signal for maturity.
    - Customer-success and support infrastructure suggest real deployment depth rather than superficial pilot activity.
  topRisks:
    - The last confirmed valuation anchor is stale and screens rich relative to current public comp multiples.
    - Public evidence does not disclose retention, concentration, gross margin, or consolidated cash generation.
    - Regulatory, privacy, and clinical-governance overhead warrant a discount to clean horizontal SaaS peers.
    - High-touch implementation can support stickiness but may cap margins and slow scaling.
    - Reimbursement support is helpful in selected workflows, not broad enough to de-risk the whole product suite.
  unresolvedGaps:
    - Current price discovery, secondary marks, or board valuation updates since the 2022 Series D.
    - Net revenue retention, gross retention, churn, and expansion ARR by customer cohort.
    - Revenue concentration across provider systems, life-sciences partners, modules, and geographies.
    - Consolidated free cash flow, debt covenants, runway, and preference-stack economics.
    - Segment gross margin and the economic quality of the life-sciences revenue stream.
