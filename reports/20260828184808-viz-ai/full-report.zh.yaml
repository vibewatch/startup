  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的主要风险
        blocks:
          - type: paragraph
            body: >-
              Viz.ai 并不像踩着单一灾难级红旗的公司。更准确地说，它面对的是一组重大且相互关联的风险，这些风险在规模化临床 AI 平台中很常见：模块增多带来的监管复杂度、报销支持不均、PHI
              和隐私暴露、对客户落地质量的高度依赖、渠道和集中度不透明，以及竞争者正持续逼近企业级工作流编排。产品仍定位为辅助，确实降低了一部分自主 AI
              风险，但人因和治理风险并不会消失。反而，更多责任被推到真实世界的落地质量上。


              正面的抵消因素是，Viz.ai 有看得见的缓释项。公司积累了信任文档、多项监管许可、客户成功体系、有意义的已部署客户基础，以及若干报销先例。这套组合让剩余风险比一家未经验证的早期 AI
              公司更可控。但这不足以让风险变低。公司规模已经足够大，一次显著事故、报销逆转、采购放缓或平台替代趋势，都会让投资后果同时穿透多个模块和收入线。
            claimRefs:
