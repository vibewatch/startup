      - number: '4.3'
        title: 运营规模、效率与盈利信号
        blocks:
          - type: paragraph
            body: >-
              最强公开财务信号是，商业化现在看起来有意义，而不是仍停留在概念阶段。GetLatka 将 2024 年收入列为 $48.8 million；Viz.ai 2026 年 1 月公告称，医疗业务实现盈利，平台触达接近
              2,000 家医院，临床警报和工作流点击率达到 90%。同一公告及其转载还称，公司在此前 18 个月内将生命科学业务翻倍，并拥有超过 120
              篇同行评审论文和摘要，支持其对患者影响和工作流价值的主张。这些事实无法证明顶尖软件效率，但确实指向一家公司已走出试点阶段脆弱性。


              即便如此，盈利质量仍只部分可见。“医疗业务盈利”弱于公司整体盈利，公开记录也没有显示利润率改善来自持久订阅规模、招聘放缓、组合转变还是短期支出纪律。隐含的每员工收入约
              $150,000，对一家受监管临床工作流公司而言不错，但还没高到足以让投资人假设它已经是完全成熟的 SaaS 引擎。乐观解读是，Viz.ai
              现在可能用内部资金支持更多运营扩张；谨慎解读是，资本效率仍取决于成功交叉销售、续约深度，以及生命科学和新服务线的纪律性增长。
