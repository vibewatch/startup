      - number: '6.4'
        title: 扩张循环与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Viz.ai
              有几条看得见的扩张飞轮。医疗系统可以先上一个用例，再扩到更多专科线；标杆客户能变成同类系统采购时的背书；农村医疗协会一次性打开多家医院入口；医疗服务提供方部署后，也能成为生命科学工作流变现的平台。这些飞轮解释了为什么医院数、医护用户数和合作伙伴数能在同一时期一起上行。HCM
              等有报销支持的专科路径，可能还会在部分业务线里进一步提速。


              反面是集中度不透明。公开资料没有披露收入有多少来自最大几家医疗系统、最大的生命科学伙伴，或最成功的渠道关系。公开证据也集中在公司主动发布的正面客户证言。这不会推翻采用故事，但买方和投资人需要验证：平台究竟已经在多个账户里深度标准化，还是部分亮眼覆盖数字集中在少数真正有经济意义的部署上。简言之，扩张逻辑很强，集中度算术仍藏在黑箱里。
