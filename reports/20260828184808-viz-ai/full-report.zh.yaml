        - ~7.7x 收入
        - 临床医生工作流软件，有公开披露且盈利
        - 并非以影像为核心，公开市场披露质量更干净
      - - Tempus AI
        - ~$11.55B 市值 / $1.105B TTM 收入
        - ~10.5x 收入
        - 最接近的公开 AI 溢价医疗数据工作流可比对象
        - 规模更大，数据平台叙事也强得多
      - - RadNet
        - ~$5.87B 市值 / $2.04B TTM 收入
        - ~2.9x 收入
        - 影像邻近的医疗工作流语境
        - 服务属性重，不是干净的软件类比
      - - Health Catalyst
        - ~$0.11B 市值 / ~$316M TTM 收入
        - ~0.3x-0.4x 收入
        - 显示医疗软件倍数可能压缩到多低
        - 业务质量和品类定位与 Viz.ai 明显不同
    notes: 可比对象覆盖溢价和压缩两端，避免硬凑一个虚假的同业组。
    enumerationScope:
      coverage: partial
      basis: >-
        Covers the most decision-useful public valuation lenses retained during this run, not every adjacent
        digital-health or imaging company.
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV016
      - CV018
  - id: TV005
    title: 投资逻辑破裂与否决触发表
    columns:
      - 触发因素
      - 阈值 / 事件
      - 传导到投资逻辑
      - 行动含义
    rows:
      - - 严重安全或质量事故
        - 重大 PHI 事件、安全争议，或反复审计 / 控制失败
        - 打破信任护城河，放慢采购或扩张
        - 立即暂停乐观判断，重做下行情景
      - - 装机基础放缓
        - 医院覆盖、医疗服务方用户增长或附加模块采用显著停滞
        - 挑战平台升级叙事和交叉销售逻辑
        - 下调可接受倍数，并要求留存证据
      - - 支付环境恶化
        - 关键参考路径失去支付支持或扩展失败
        - 削弱最强用例之外的预算理由
        - 下调基准情景倍数和增长假设
      - - 集中度意外偏高
        - 私有尽调显示高度依赖少数系统或合作伙伴
        - 说明采用广度的变现多样性低于假设
        - 转向悲观情景框架
      - - 资本结构拖累
        - 债务条款、现金消耗或清算优先权比预期更严苛
        - 即便 EV 看起来有吸引力，普通股吸引力也会下降
        - 要求更低入场价，否则放弃
      - - 战略性替代
        - 更广平台或竞争对手在关键客户拿下标准化决策
        - 披露质量改善前，定价权已被压缩
        - 若趋势持续，按结构性投资逻辑破裂处理
    notes: 所有触发因素都可监控，并与决策绑定，不是泛泛的观察项。
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为何重要
      - 负责人或尽调路径
    rows:
      - - 留存队列
        - NRR、GRR、客户流失、按客户年份划分的模块扩张
        - 留存决定 Viz.ai 能否享受溢价工作流软件待遇
        - 向公司索取；队列材料和董事会 KPI 包
      - - 客户和合作伙伴集中度
        - 按头部医疗系统、生命科学合作伙伴和地区拆分的收入
        - 广泛的客户数量仍可能掩盖经济集中度
        - 向公司索取；财务尽调资料室
      - - 分部毛利率
        - 医疗服务方 SaaS、服务和生命科学工作流毛利率
        - 决定公司按软件模式扩张，还是按赋能服务模式扩张
        - 向公司索取；如有，提供经审计的分部视图
      - - 现金生成和现金跑道
        - 合并 EBITDA、自由现金流、现金余额、债务契约、现金跑道
        - 单一分部盈利不足以支撑股权投资判断
        - 董事会材料和债务文件
      - - 优先股堆叠和投资人保护
        - 清算优先权、参与权、pay-to-play 和老股条款
        - 新资金的结果可能与企业价值计算大幅不同
        - 股权结构表和融资法律文件
      - - 当前价格发现
        - 409A 估值、老股交易或近期投资人重估
        - 没有当前价格发现，建议仍是有条件的
        - 财务 / 法务索取，并做投资人参考访谈
    notes: 这些问题按收窄情景区间和改变建议的速度排序。
    claimRefs:
      - CV036
      - CV037
      - CV038
      - CV039
