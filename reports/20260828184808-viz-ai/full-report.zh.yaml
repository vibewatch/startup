  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流
      - Viz.ai 解决方案
      - 可衡量收益
      - 局限
    rows:
      - - 放射科分诊与跨团队升级
        - 在 PACS 中读片，电话联系下游专科医生，手工协调
        - AI 标记疑似疾病，把处理后的影像回写到 PACS，并把警报推送给移动端 / 桌面端团队
        - 在临床医生熟悉的工作流里更快升级响应
        - 未披露公开的假阳性率和警报疲劳率
      - - 卒中灌注复核
        - 专科医生分别查看灌注输出，再手动启动团队响应
        - Viz CTP 在移动端 / 桌面端提供缺血核心和 Tmax 估算，并支持配置阈值
        - 有望按阈值更快启动和复核
        - 与其他 CTP 工具的对比表现未公开
      - - 从 EMS 到导管室的 ACS 协调
        - ECG 通过短信 / 照片或割裂系统传来
        - Viz ACS 在符合 HIPAA 的工作流中集中管理高保真 ECG
        - 减少模糊照片带来的摩擦和不必要误报
        - 未公开按医院拆分的延迟或启动指标
      - - 医疗系统 ECG 筛查 HCM
        - 分散复核 ECG 后，再手动转诊给专科医生
        - Viz HCM 分析 12 导联 ECG，并把疑似病例分诊给专科医生
        - 支持更早检查，并提升路径标准化
        - 更广泛的报销和使用经济性仍不清楚
      - - 临床文档与编码准备
        - 手工预查病历、复核影像并起草病程记录
        - Viz Assist 提取关键病史，起草病程记录、转诊信和建议账单编码
        - 节省运营时间，并可能追回收入
        - 人工复核质量和实际编码提升未经过公开审计
      - - 路径设计与指南落地
        - 定制 EHR 开发，或手工管理诊疗方案变更
        - Agent Studio 让医疗系统更快创建和更新路径
        - 有望减少 IT 积压，缩短路径上线时间
        - 客户自建路径规模的公开证据有限
    notes: 这些收益来自产品材料支撑的工作流优势，并非普遍审计过的结果保证。
