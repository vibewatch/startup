companyProfile:
  summary: >-
    Viz.ai 是一家临床 AI 公司，由 Dr. Chris Mansi 和 Dr. David Golan 于 2016
    年创立。公司向医院和医疗系统销售嵌入工作流的照护协同平台，用影像和其他临床信号发现时间敏感病症，调动照护团队，并越来越多地支持行政和生命科学工作流。2025–2026 年公开证据显示，公司部署规模接近或超过 2,000
    家医院，生命科学业务在增长，医疗业务已盈利；但留存、利润率、集中度和现金流等支撑高溢价后期私募估值的关键数据，公司仍未公开披露。
