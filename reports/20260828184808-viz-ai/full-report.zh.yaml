      - number: '4.2'
        title: 融资历史与资本结构
        blocks:
          - type: paragraph
            body: >-
              从融资角度看，Viz.ai 明显是后期公司，但公开记录对总额并不完全一致。公司官方公告显示，2021 年 3 月 $71 million Series C 后，累计融资超过 $150 million；随后
              2022 年 4 月，公司以 $1.2 billion 估值完成 $100 million Series D。Business Wire 随后报道称，CIBC 于 2023 年 3 月提供 $40 million
              成长资本授信，用于支持扩张和潜在收购。不过，GetLatka 列示四轮融资总额为 $242 million。最干净的解释是，按来源方法和四舍五入口径不同，公开股权融资大约在 $242 million 到略高于
              $250 million 之间；若纳入债务授信，公开披露总资本进入大约 $282 million 到 $290 million 区间。


              这种混合图景仍然有信息量。它显示，公司先用大额软件式风投轮次搭建分发，再在迈向盈利时补充非稀释性资本。也说明管理层希望保留扩张和潜在补强型并购的可选性，而不是依赖近期公开融资事件。商业实体页面还显示，Viz.ai
              在多个司法辖区设有子公司，这可以支持增长和招聘，但也增加成本和合规复杂度；仅凭保留下来的公开来源，公开市场投资人还无法量化。
