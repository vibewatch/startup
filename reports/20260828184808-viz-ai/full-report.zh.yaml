      - number: '2.4'
        title: 驱动因素、约束与未解尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动是结构性的。医学影像 AI 品类预测仍维持高增长，临床医生仍承受沉重工作流压力，公司和独立来源都强调，急诊照护 AI
              只有能降低整个医院网络的延误才会赢。在时间敏感检测能够调动下游团队并创造可衡量运营价值的场景中，Viz.ai 尤其有利。合作伙伴渠道可以缩短部署、扩大分发，或让生命科学工作流在照护现场更可执行，从而强化这种动态。


              约束也同样真实。Radiology Business 指出，收入仍集中在少数可报销或运营价值明显的应用中，ROI 往往仍难证明。ACR 和 FDA 材料强化了治理负担，Allied
              则强调临床医生接受度和安全担忧。Viz.ai
              自己的适用范围显示，产品是辅助性的，而非自主性的，这意味着医院仍要承担专家复核和下游行动成本。最后一个未解缺口是定价：公开证据从未披露医院或生命科学合作伙伴实际支付多少。没有价格、附加率和留存数据，市场可以被理性框定，但无法转化为精确的自下而上
              SOM。
