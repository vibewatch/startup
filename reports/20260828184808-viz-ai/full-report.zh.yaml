      - number: '5.2'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >-
              即使核心代码和基础设施细节仍属私有，公开材料也揭示了相当具体的运营模式。在放射科和专科页面中，Viz.ai 反复描述与
              PACS、EHR、移动端和桌面界面相连的云原生工作流编排，并使用标准通信协议。临床医生可以查看算法处理后的图像、接收警报、跨科室协同，并在部分模块中使用衍生测量或指南导向支持作出行动，而无需离开企业工作流层。Viz
              Assist 和 Agent Studio 把这种运营模式进一步向前推，从检测延伸到文档、编码支持和可配置路径逻辑。


              因此，架构最好理解为一个多模态摄取和路由栈，上面叠加疾病专属模块。影像和其他临床信号被摄取，AI
              模型或规则处理信号，系统把警报或摘要路由到合适照护团队，临床医生仍在环内复核并行动。这很强大，因为同一个骨干可以支撑很多临床用例。但这也意味着，公司对客户
              IT、数据质量、访问控制和变更管理有结构性高依赖。如果这些依赖项薄弱，仅靠产品宽度无法保证可靠结果。
