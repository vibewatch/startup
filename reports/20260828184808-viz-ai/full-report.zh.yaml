    columns:
      - 论点
      - 证据支持的判断
      - 什么会改变判断
    rows:
      - - 投资逻辑：企业级临床工作流平台
        - 广泛采用、模块宽度、客户成功基础设施和生命科学变现，显示出真实平台潜力
        - 若非公开尽调显示 NRR 强、流失低、毛利率健康，可进一步上调
      - - 投资逻辑：存量客户深度支撑变现扩张
        - 近 2,000 家医院和多条变现路径支撑交叉销售逻辑
        - 若披露且显示每个医疗系统的扩张 ARR 强，可上调
      - - 反向逻辑：过期独角兽估值缺乏支撑
        - 最后一次确认估值对应的倍数高于当前上市可比公司区间
        - 若当前 ARR、留存和毛利率能支撑溢价可比公司口径，可中和该点
      - - 反向逻辑：重服务模式可能压住利润率
        - 支持、实施和临床赋能是优势，也可能压低软件式利润率扩张
        - 若管理层能证明部署杠杆和分部利润率在改善，可放松担忧
      - - 反向逻辑：生命科学上行空间可能集中
        - 合作伙伴数量令人鼓舞，但经济性和续约质量不透明
        - 若合作伙伴集中度和毛利率数据有利，可放松担忧
      - - 反向逻辑：支付胜利真实但范围窄
        - NTAP 和 HCM 支付支持有帮助，但不能消除全产品目录的风险
        - 若更多模块跑出持久经济采用路径，可放松担忧
    notes: 各行同时呈现上行逻辑，以及把该逻辑转化为估值支撑所需的具体证据。
