      - number: '3.3'
        title: 采购标准、定价不透明与分发力量
        blocks:
          - type: paragraph
            body: >-
              保留下来的独立来源强化了一个判断：供应商选择越来越看工作流价值。Radiology Business 认为，企业 AI 买方重视更深编排、运营效率，以及与影像 IT 骨干的对齐；ACR
              则把部署定义为治理和质量保证问题。FDA 监管也让监管姿态保持重要。Viz.ai 自身适用范围进一步说明，这类产品仍是辅助而非自主，因此工作流质量、信任和临床医生响应，才是买方真正变现的对象。


              定价不透明让竞争图景更难读。抓取到的公开来源几乎从不披露单院定价、模块 ACV 或折扣结构，因此很难判断赢单究竟来自宽度、证据还是商业让步。在这种真空里，合作伙伴生态更重要。Viz.ai 与
              Microsoft、Salesforce 的关系暗示了分发和可信度优势，而多数保留下来的竞争者来源并未公开匹配。但如果渠道经济性或平台访问发生变化，生态也会带来依赖风险。
