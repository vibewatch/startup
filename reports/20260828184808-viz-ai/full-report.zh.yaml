      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方地图是多角色的。医疗服务方一侧，放射科负责人、CMIO、CIO、卒中主任、ED 负责人和企业服务线高管都重要，因为产品同时触及影像解读和下游协同。生命科学一侧，Salesforce
              材料指向希望获得实时临床触发的商业、医学事务、市场准入和患者支持团队。这种组合意味着，Viz.ai 可因用例不同，被采购为科室工作流工具、企业 AI 平台，或嵌入式生命科学赋能层。


              来源暗示的采用路径也很熟悉。医疗系统从一个延迟可见且可衡量的紧急工作流起步，在试点或封闭服务线里证明价值，接入 PACS 或其他既有系统；临床和安全相关方信任平台后，再扩展到更多专科。Microsoft
              合作材料进一步说明，企业级铺开依赖互操作性、可扩展性和安全性，而不只是算法准确率。这让采用更像运营软件决策，而不是直接报销决策：买方需要更快决策、更少工作流断点，以及产品能留在医院既有 IT 和治理栈里的证据。
