    summary: 最关键的下行链条，是事件或治理失灵迅速传导到采购阻力、客户扩张放缓和估值压力。
    data:
      nodes:
        - id: t1
          label: 安全或治理失灵
          detail: 数据泄露、配置不当，或临床控制不力事件
        - id: t2
          label: 客户信任流失
          detail: 采购审查加强，客户背书变弱
        - id: t3
          label: 部署和扩张放缓
          detail: 上线延期，附加模块销售放慢，渠道转化走弱
        - id: t4
          label: 收入和利润率承压
          detail: 增长放慢，支持负担仍高企
        - id: t5
          label: 融资或估值压力
          detail: 战略杠杆降低，溢价倍数空间收窄
        - id: t6
          label: 报销脆弱性
          detail: 关键参照路径的政策支持收窄
        - id: t7
          label: 人因失效
          detail: 警报疲劳或临床响应延迟削弱证据
      edges:
        - from: t1
          to: t2
          label: 触发
        - from: t2
          to: t3
          label: 拖慢
        - from: t3
          to: t4
          label: 挤压
        - from: t4
          to: t5
          label: 造成
        - from: t6
          to: t4
          label: 削弱
        - from: t7
          to: t2
          label: 损害
    approximationNotes: 图展示因果流类别，而非精确的定量敏感性。
    claimRefs:
      - CR008
      - CR021
      - CR023
      - CR032
      - CR038
      - CR039
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Viz.ai 要靠客户 IT、监管机构、报销信号、支持运营和渠道关系同时稳住，业务才能跑通。
    data:
      nodes:
        - id: d1
          label: Viz.ai 平台
          detail: 公司核心资产和工作流平台
        - id: d2
          label: 客户 PACS / EHR / 本地 IT
          detail: 支撑部署和日常工作流执行
        - id: d3
          label: 临床医生复核纪律
          detail: 输出是辅助性质、不是自主决策，因此必须复核
        - id: d4
          label: 监管机构和审计方
          detail: FDA、CMS、HIPAA / 安全要求、审计准备度
        - id: d5
          label: 支持和实施组织
          detail: 客户成功、培训、工作流设计
        - id: d6
          label: 协会和合作伙伴渠道
          detail: NRHA、MHA、生命科学、战略合作伙伴
        - id: d7
          label: 资本与现金生成
          detail: 债务和盈利转型
      edges:
        - from: d2
          to: d1
          label: 依托运行
        - from: d3
          to: d1
          label: 安全使用
        - from: d4
          to: d1
          label: 约束
        - from: d5
          to: d1
          label: 释放价值
        - from: d6
          to: d1
          label: 扩大触达
        - from: d7
          to: d5
          label: 提供资金
    approximationNotes: 依赖项按控制面分组，而非按供应商合同分组。
    claimRefs:
      - CR009
      - CR012
      - CR019
      - CR022
      - CR029
      - CR031
      - CR038
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 运营证明较强，但估值锚已陈旧，因此建议克制处理：观察或继续研究。
    data:
      nodes:
        - id: n1
          label: 真实业务质量
          detail: 采用度、盈利信号、生命科学上行空间、客户成功深度
        - id: n2
          label: 陈旧估值锚
          detail: 最近一次确认估值是 2022 年 4 月的 $1.2B
        - id: n3
          label: 可见收入锚
          detail: GetLatka 报告 2024 年 ARR 为 $48.8M
        - id: n4
          label: 公开可比标尺
          detail: 可比公司收入倍数约 0.3x–10.5x
        - id: n5
          label: 披露缺口
          detail: 留存、现金流、集中度和股权结构表仍未公开
        - id: n6
          label: 建议
          detail: 观察 / 继续研究；只有价格大幅重置，或拿到非公开证据后，才值得建设性推进
      edges:
        - from: n1
          to: n6
          label: 支撑关注
        - from: n2
          to: n6
          label: 抬高门槛
        - from: n3
          to: n4
          label: 支持比较
        - from: n4
          to: n6
          label: 约束定价
        - from: n5
          to: n6
          label: 限制确信度
    approximationNotes: 逻辑链优先服务投资决策，而非穷尽因果细节。
    claimRefs:
      - CV003
      - CV005
      - CV016
      - CV018
      - CV027
      - CV030
      - CV042
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 如果投资者把不同 ARR 倍数套到 $65M 前瞻情景上，企业价值的示意结果如下。
    data:
      items:
        - label: 4x ARR
          value: 260
        - label: 6x ARR
          value: 390
        - label: 8x ARR
          value: 520
        - label: 10x ARR
          value: 650
        - label: 12x ARR
          value: 780
    approximationNotes: 数值单位为百万美元，采用一个示意性的 $65M ARR 案例，该案例由公开锚点和公司规模更新推导而来；这些是敏感性输出，不是预测。
    claimRefs:
      - CV017
      - CV019
      - CV020
      - CV032
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 情景区间显示仍有上行空间，但多数由公开证据支撑的路径仍明显低于 2022 年陈旧的独角兽估值标记。
    data:
      items:
        - label: 悲观
          low: 190
          high: 275
        - label: 基准
          low: 390
          high: 520
        - label: 乐观
          low: 720
          high: 960
    approximationNotes: 所有数字均为企业价值，单位为百万美元。图表基于情景表中明确列出的 ARR 和倍数假设。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
      - CV035
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 面向投委会的 1–5 分评分；5 代表基于公开证据可形成的最强确信度。
    data:
      items:
        - label: 市场机会
          value: 4
          note: 临床 AI 和照护协调需求仍真实且广泛
        - label: 产品 / 工作流契合度
          value: 4
          note: 采用度和平台广度支撑工作流契合度
        - label: 变现多元性
          value: 3
          note: 医疗服务方加生命科学的组合有吸引力，但经济性不透明
        - label: 财务证明
          value: 2
          note: 有 ARR 锚点，但缺少经审计收入、利润率和现金流
        - label: 风险画像
          value: 2
          note: 监管、实施和集中度风险仍需谨慎看待
        - label: 估值支撑
          value: 1
          note: 公开证据不足以支撑接近 2022 年陈旧估值标记的价格
        - label: 证据质量
          value: 2
          note: 叙事质量高于披露质量
    approximationNotes: 评分衡量公开证据对投资判断的有用性，而非公司的绝对质量。
    claimRefs:
      - CV004
      - CV022
      - CV023
      - CV024
      - CV029
      - CV036
      - CV042
