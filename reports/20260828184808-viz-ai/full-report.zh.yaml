      - - 基准情景
        - $65M ARR，覆盖继续增长，医疗业务盈利维持，披露仍不完整
        - 6x-8x ARR => ~$390M-$520M EV；只有较 2022 年估值大幅重置才值得研究
        - 现金流和利润率不透明，限制倍数扩张
