      - number: '3.2'
        title: 相邻对手与 AI 预算竞争者
        blocks:
          - type: paragraph
            body: >-
              并非所有重要竞争者都试图端到端复制 Viz.ai。Qure.ai 在卒中和更广影像用例上有重叠，但其公开材料更偏向全球筛查、硬件无关部署和公共卫生式项目，而不是 Viz.ai
              强调的美国企业医院。Avicenna.AI 更接近急诊影像工作流和患者管理逻辑，但仍显得更窄、更由专科牵引。Cleerly
              处在不同但具有战略相关性的赛道，因为可报销心脏影像工具即使没有宽广编排叙事，也能拿到专科预算。PathAI 通过数字病理工作流竞争企业 AI 注意力，deepc 则作为医疗系统 AI 部署基础设施参与竞争。


              这一点重要，因为大型医疗系统并不总按狭窄疾病类别来编制 AI
              预算。它们常在同一治理流程中比较放射、病理、心脏和工作流供应商。在这种场景下，经济性清晰的专科供应商，或跨模态工作流平台，即便不是一对一替代，也可能削弱 Viz.ai 的销售动作。Viz.ai 自身整合
              Avicenna.AI 工具也说明，平台达到足够规模后，部分竞争会变成竞合。
