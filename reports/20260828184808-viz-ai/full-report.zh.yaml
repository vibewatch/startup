      layers:
        - label: 第 1 层 — 数据接入
          detail: 影像和其他临床信号通过标准通信协议，从医院系统进入平台。
        - label: 第 2 层 — 面向疾病的 AI 模块
          detail: 病种模块识别疑似疾病，或量化灌注、出血、动脉瘤、RV/LV 比等指标。
        - label: 第 3 层 — 工作流路由与协作
          detail: 平台把告警和上下文发送到合适的多学科护理团队，并覆盖移动端和桌面端界面。
        - label: 第 4 层 — 面向临床医生的应用
          detail: 放射、神经、心脏、血管、肿瘤、Assist 等专科界面，在工作流上下文中呈现输出。
        - label: 第 5 层 — 信任与治理控制
          detail: SOC 2、HIPAA、隐私、连续性和面向采购的控制，作为企业级要求贯穿平台。
        - label: 第 6 层 — 可配置路径逻辑
