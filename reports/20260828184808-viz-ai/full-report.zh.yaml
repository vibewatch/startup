      - number: '8.4'
        title: 最终尽调问题与论点破裂项
        blocks:
          - type: paragraph
            body: >-
              缺失的尽调异常可操作。投资人主要不需要更多品牌客户标识，也不需要更多证据证明医院知道
              Viz.ai。他们需要决定公司性质的经济事实：这是高溢价软件、有用基础设施，还是融资过多的临床单点方案平台。首要问题是留存队列、按客户和生命科学伙伴划分的集中度、分部毛利率、合并现金生成、债务条款和优先权结构。这些项目会很快压缩估值区间。


              在此之前，论点破裂触发项很直接。严重安全或质量事故会直接打击信任。已部署客户基础增长放慢，或现有系统内扩张乏力，会挑战平台升级叙事。参考路径报销受挫，会削弱预算论证。战略性替代也一样——更宽的工作流平台或竞争
              AI 供应商若比 Viz.ai 强化装机基础护城河更快地吸收类似能力，增长和倍数都会承压。这些触发项可以观察，这是好事；但它们也再次说明，建议必须保持纪律：公开记录支持关注，不支持自满。
