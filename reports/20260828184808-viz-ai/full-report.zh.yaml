  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: standard
    summary: 典型 Viz.ai 工作流从临床数据接入开始，经过 AI 分析和告警，最后在既有企业环境中由临床医生复核并触发下游行动。
    data:
      nodes:
        - id: n1
          label: 临床数据从扫描仪、PACS、ECG、EHR 或同类来源进入 Viz.ai
          detail: 起点是多模态，不同护理路径有所不同
        - id: n2
          label: 面向疾病的模块分析疑似病情或关键指标
          detail: 例子包括卒中灌注、动脉瘤、RV/LV、HCM 或文档上下文
        - id: n3
          label: 平台把处理后的输出送回面向临床医生的界面
          detail: 输出可出现在 PACS、移动端、桌面端或工作流视图中
        - id: n4
          label: 合适的护理团队收到协同告警和上下文
          detail: 路由把放射科医生、专科医生、EMS 或协调员拉进同一工作流
        - id: n5
          label: 临床医生复核辅助输出，并决定下一步
          detail: 产品仍是辅助工具，需要人类判断
        - id: n6
          label: 下游诊断、转运、文档、转诊或治疗步骤发生
          detail: 运营价值取决于终端用户跟进，以及集成质量
      edges:
        - from: n1
