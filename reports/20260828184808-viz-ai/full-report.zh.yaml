chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、创立故事与商业模式
        blocks:
          - type: paragraph
            body: >-
              Viz.ai 创立于 2016 年。Chris Mansi
              当时判断，很多急性照护的不良结果，并不是因为临床知识不足，而是交接太慢、沟通摩擦太大，放射科医生、急诊医生和专科医生之间的升级路径不稳定。公司的创立叙事很直接：一名患者即使接受了技术上成功的治疗，仍因照护路径推进过慢而死亡。这个框架今天仍然重要，因为它解释了
              Viz.ai 为什么更像一家临床工作流公司，而不是单点算法供应商。公开材料一贯把公司描述为 AI 驱动的照护协同平台：分析影像或 ECG 数据，提示疑似时间敏感发现，并在常规标准照护并行推进时同步照护团队。


              商业模式也跟着产品一起拓宽。在医疗服务方市场，Viz.ai 向希望加快分诊、改善协同并扩展到多条服务线的医院和医疗系统销售企业平台。在生命科学领域，Viz.ai
              越来越多地把同一个嵌入式工作流位置变现：帮助合作伙伴识别符合条件的患者，支持疗法启动，并在照护现场分发临床医生教育内容。到 2026
              年，公司已明确把医院订阅和生命科学工作流合作伙伴关系列为两条并行收入线，而不是一个核心医疗服务方产品附带偶发合作。这个区别具有战略意义：同一层临床数据和工作流既能支撑医院
              ROI，也能支撑合作伙伴的商业化拓展用例。
