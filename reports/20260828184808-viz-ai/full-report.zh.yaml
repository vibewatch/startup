      - number: '1.3'
        title: 融资历史、规模里程碑与战略合作
        blocks:
          - type: paragraph
            body: >-
              公开融资历史足以确认公司已进入后期阶段，但还不足以还原完整资本结构。锚点事实是 2022 年 4 月的 Series D：Viz.ai 融资 $100 million，估值 $1.2 billion，由
              Tiger Global 和 Insight Partners 领投，多家老股东继续跟投。一年后，CIBC Innovation Banking 提供了 $40 million
              成长资本授信；公司称这笔资金将支持扩张和潜在收购。第三方数据库随后估计累计股权融资约 $242 million；若纳入 CIBC 授信，公开披露资本至少约 $282
              million。这个区间与公众对是否计入债务型资本的模糊口径方向一致，但精确优先权、所有权和任何老股交易仍是尽调缺口。


              规模进展异常可见。2022 年 Series D 材料中，Viz.ai 称其已超过 1,000 名医院用户，并覆盖 1,400 多家医院和医疗系统、超过 220 million 人群。2023
              年融资材料称，平台在 1,300 多家医院每 21 秒服务一名患者。到 2025 年 1 月，Viz.ai 称其拥有 1,700 家医院、60,000 名医疗服务方，以及 Viz.ai One 内超过 48
              个模块。到 2026 年 1 月和 7 月，公司称其接近 2,000 家医院、230 million 覆盖人群、超过 50 条照护路径，并且医疗业务已在 2025 年盈利。


              合作伙伴关系解释了 Viz.ai 如何把这种规模转化为更广的平台位置。Microsoft 扩展了影像工作流和企业部署叙事，Salesforce
              则把实时临床触发连接到合规的商业和支持工作流，扩展生命科学变现路径。这些不只是营销徽章；它们显示 Viz.ai 正试图从提醒临床医生，延伸为围绕医院工作流的行动系统层。
