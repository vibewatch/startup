      - number: '1.4'
        title: 里程碑、产品限制与未解尽调旗标
        blocks:
          - type: paragraph
            body: >-
              Viz.ai 的里程碑记录显示，公司反复从单一用途验证推进到更广的平台可信度。公开时间线包括卒中领域首个同类 FDA 授权、通过 NTAP 取得 CMS 报销领先地位、2022
              年前后的国际扩张信号、2024–2026 年更广的疾病扩展，以及如今以数百篇研究和摘要计量的证据基础。到 2026 年周年公告时，管理层已愿意把 Viz.ai 描述为企业级医疗 AI 平台，而不是一家卒中公司。


              但最有用的反向证据，反而来自公司自己的标签和披露边界。Viz LVO、Viz ICH 和 Viz HCM
              都被描述为辅助性、并行工作流工具，不能替代标准照护诊断或完整医生评估。这强化了核心商业逻辑——更快升级和协同，而不是自主诊断——但也意味着价值取决于临床医生采用、警报质量和细致集成。公开员工数也不一致：Forbes
              在 2026 年 3 月列出 251 名员工，GetLatka 则估计 2025 年末为 312
              名。同样，盈利说法已经出现，却没有经审计收入、利润率或现金细节。结果是，公司拥有很强的采用和平台信号，但在任何投资人有信心承销后期估值之前，仍需管理层直接解释财务质量、全球结构和治理机制。
