      - number: '8.3'
        title: 情景区间与上行条件
        blocks:
          - type: paragraph
            body: >-
              比起单一目标价，情景框架更站得住，因为太多核心输入仍未公开。悲观情景下，Viz.ai 像一家仍在增长、但被风险折价的医疗工作流公司：ARR 更接近 $55M，利润率仍被高接触部署拖累，投资人只给 3.5x 至
              5x 收入；对应价值约 $190M 至 $275M。基准情景下，平台维持有意义增长，把 ARR 推向约 $65M，并因规模和粘性真实而获得 6x 至 8x，即使披露仍不完整；对应约 $390M 至
              $520M。乐观情景下，ARR 接近或超过 $80M，医疗业务盈利被证明可持续，生命科学扩张也变得更可复制，可以支撑 9x 至 12x，对应约 $720M 至 $960M。


              关键不在任何单一数字的虚假精确，而在分布形状。公开证据让低于 $300M 显得过度悲观，除非采用质量远差于表面；但如果没有非公开证据证明 ARR 明显更高、留存或利润率质量好得多，超过约 $1B
              也很难支撑。实际投资姿态因此很清楚：看好公司，但必须要求估值大幅重置，或拿到强私下尽调，证明 Viz.ai 值得向高溢价公开可比公司收敛。
