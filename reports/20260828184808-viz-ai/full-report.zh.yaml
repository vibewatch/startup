      - number: '4.4'
        title: 承销边界与公开尽调缺口
        blocks:
          - type: paragraph
            body: >-
              本章只能支持方向性财务判断，因为关键承销字段仍属私有。公开来源没有披露分部 ARR、毛利率、烧钱速度、现金余额、递延收入、债务契约、CAC
              回本周期、客户集中度或续约经济性。它们也留下了公开指标定义上的模糊：合作伙伴数量随日期变化，融资总额因来源而异，员工数在独立数据库之间也不同。对一家成长阶段私营公司来说，这些问题可管理；但当强运营叙事要转化为硬投资案例时，它们会限制信心。


              因此，最重要的尽调步骤不是寻找更多公开赞誉，而是拿到可对账的内部财务材料，把收入构成、利润率结构和资本充足性连接到平台扩张故事。没有这些材料，投资人可以认为 Viz.ai
              具备可信规模、多元变现路径和改善中的经营杠杆，但还无法判断这些优点是否证明已消耗资本合理，或能否仅凭财务基础支撑未来高溢价估值。
