      - number: '7.2'
        title: 监管、法律和安全风险
        blocks:
          - type: paragraph
            body: >-
              结构上最重要的风险是监管和法律。Viz.ai 进入的是临床决策支持和疾病检测工作流，每增加一个模块，都需要更多证据、更严合规和更强上市后警戒。FDA 监管、ACR 治理预期、隐私通知、HIPAA
              安全义务和跨境法律文件都指向同一个结论：这是一个嵌在厚合规边界内的平台。公司坚持辅助定位很重要。临床医生仍在闭环内，Viz.ai 避开了一部分最难的自主软件责任问题，但仍依赖医院正确且一致地使用系统。


              安全和隐私会放大这个风险，因为承载大量 PHI 的工作流软件，一次高曝光事件就能丢掉多年采购信任。Viz.ai 公开信任材料强于平均水平，SOC 2 + HIPAA
              审计公告也是真实的缓释信号。但公开文件回答不了最难的问题：事故历史、漂移监控、工作流覆写率、本地治理失灵，或客户侧配置多频繁地制造风险。因此，今天的法律风险更多是前瞻性的，而不是已经诉讼化的，但重要性仍然很高。
