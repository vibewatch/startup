            body: >-
              具名客户证明足够宽，显示产品已在不同照护环境中实际使用。Piedmont Healthcare 同时出现在客户成功证言和更早的知名医疗系统名单中。Montana Hospital Association
              创造了覆盖 60 多家医院的网络式机会；Appalachian Regional Healthcare 和 UK 临床医生则公开谈到 Kentucky 乡村地区转诊网络和治疗时间改善。Tennessee
              Oncology 和 Jackson Health 增加了社区肿瘤和企业信任证明点，Medtronic 与 Novartis 则显示，生命科学参与绑定的是具体工作流项目，而不仅是抽象合作伙伴话术。


              但耐久性证据明显弱于采用证据。公开记录大量谈部署、客户背书和参与度，却几乎没有谈合同期限、GRR、NRR
              或模块级流失。客户成功人员、研究支持和持续培训指向一种有粘性的企业运营模式，生命科学工作流也可能再增加一层嵌入性。但没有队列级数据，投资人应把客户质量视为可信且在扩张，而不是已经完全承销。当前最强判断是，Viz.ai
              拥有可背书的生产客户和有意义参与度；最弱点是这些关系的经济深度仍属私有。
