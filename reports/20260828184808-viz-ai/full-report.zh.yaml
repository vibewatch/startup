      - number: '1.2'
        title: 管理层梯队、治理信号与合规姿态
        blocks:
          - type: paragraph
            body: >-
              管理层连续性是 Viz.ai 最清晰的优势之一。Chris Mansi 仍担任 CEO，也是公司公开形象；高管页面显示，运营、收入、R&D、隐私、医学领导力和财务等职能都有较深梯队。2024 年 3 月
              Michael Herring 加入担任 CFO 尤其值得关注，因为公司称他兼具上市公司和私营公司规模化经验。这说明在任何公开退出流程出现之前，Viz.ai
              已在加强报告和资本市场能力。与此同时，公司公开治理披露仍然很薄：管理层页面列出了董事会成员，但没有披露持股比例、委员会结构、观察员权利或投资人控制机制。


              合规姿态比治理姿态更具体。Viz.ai 的信任中心和 2024 年 7 月安全公告描述了一套成熟控制框架，覆盖 SOC 2 Type II、HIPAA、多项 ISO 认证、业务连续性、隐私管理和 AI
              治理标准。这对医院软件很关键，因为安全审查往往比原始模型表现更能卡住扩张。对生命科学也同样重要，因为客户信任取决于平台能否在高度监管场景下处理 PHI 和工作流触发。因此，抓取到的证据支持一个判断：Viz.ai
              的运营成熟度快于其公开治理细节。买方可以检查认证和信任文档，但投资人仍需通过私下尽调核实董事会权利和股权集中度。
