        title: 采用轨迹与使用信号
        blocks:
          - type: paragraph
            body: >-
              对一家私营医疗 AI 公司而言，公开客户增长指标异常强。Viz.ai 称其在 2024 年 1 月超过 1,500 家医院和 45,000 名医疗服务方；到 2025 年 1 月扩大至 1,700+ 家医院和
              60,000 名医疗服务方；到 2026 年 1 月又达到接近 2,000 家医院和超过 230 million 覆盖人群。当前生命科学页面显示，截至本报告日期，平台后来已达到 2,000+ 家医院和
              70,000+ HCP 用户。生命科学合作伙伴似乎也从 2024 年初的 7 家，扩展到 2026 年初的 13 家，并在当前达到 14+。


              这些不是完美客户指标，但方向上有用。它们显示，客户数、用户数和合作伙伴数量在多个有日期的发布中同步上升，比任何单一营销统计更有说服力。使用信号加深了这个判断：2024 年材料称，平台每分钟服务五名患者，且超过
              90% 的警报在五分钟内被查看；2026 年材料则强调 90% 点击率。这些指标不能替代流失率或 NRR，但确实说明至少部分部署已经变得运营上重要，而不是采购后闲置。
