  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现逻辑
        blocks:
          - type: paragraph
            body: >-
              Viz.ai 的公开记录支持一种混合商业化模型，而不是单一收入线。医疗服务方一侧像典型企业医疗软件：医院系统采用平台后，再通过 Viz Assist
              增加神经、心脏、放射、血管、肿瘤以及现在的行政工作流等服务线。生命科学一侧复用同一块已安装临床界面，识别符合条件的患者，触发下一步最佳行动，并为药企和医疗科技合作伙伴支持疗法启动或教育项目。从经济上看，Viz.ai
              正试图在同一机构覆盖上叠加更多工作流价值，提高每个已安装网络的收入。


              这个模型重要，因为它提高了增长来自扩张而不仅是全新客户获取的概率。公开产品页面支持这一点：Viz Assist
              明确营销文档准确性、建议账单代码和收入追回；肿瘤把平台延伸到另一条大型服务线；生命科学页面称合作伙伴数量上升、医疗专业人员覆盖广，并有可衡量工作流结果。报销也在选择性地发挥作用。Medical Economics
              显示，Viz HCM 获得了比许多 AI 工具更清晰的 Medicare 支付路径，这意味着部分模块可通过更清晰的专科经济性变现，而更广平台仍依靠企业工作流 ROI 销售。
