  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础与分层
        blocks:
          - type: paragraph
            body: >-
              Viz.ai 的客户图景比简单医院客户数更宽。公司主要商业基础是医疗服务方组织——使用 Viz.ai One
              处理紧急和专科工作流的医院和医疗系统——但同一个已安装临床界面也支持生命科学合作伙伴和乡村医疗渠道关系。这形成了三类有意义的细分：直接医疗服务方客户，通过该医疗服务方网络付费启动工作流项目的合作伙伴客户，以及能够一次打开多家医院入口的间接协会或区域渠道。公开乡村医疗、肿瘤和生命科学材料都强化了这一分层。


              在医疗服务方内部，公开记录指向学术中心、大型整合医疗系统、社区医院，以及乡村或关键接入环境的混合。这说明 Viz.ai
              并不限于狭窄旗舰中心买方画像。也意味着公司的扩张逻辑绑定在可重复的工作流模式上，能跨越差异很大的照护场景。对投资人而言，这在宽度上是积极信号，但也更需要弄清哪些细分贡献最高 ACV、最持久扩张和最大实施负担。
