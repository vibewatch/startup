      - number: '5.3'
        title: 部署、信任与运营控制
        blocks:
          - type: paragraph
            body: >-
              信任和采购就绪不是附属文档，而是产品的核心部分。Viz.ai 信任材料称，平台在数千家医院处理 PHI，并描述了一套安全和隐私项目，覆盖加密、SOC 2 Type II、HIPAA 保障、隐私治理，以及 ISO
              22301 等连续性标准。2024 年审计公告给出更具体的信号，称公司完成了 SOC 2 Type II 和 HIPAA 审计，且有四大会计师事务所参与。合起来看，这些材料可信地说明，安全、隐私和企业可审查性是
              Viz.ai 有意打造的产品特征。


              不过，这些披露仍未达到完整技术保证。公开信任中心内容没有给出事故历史、SLA 细节、模型发布纪律或模块级性能漂移监控。ACR
              最佳实践指南提醒，即使供应商组织良好并拥有监管许可，治理、监控和本地临床控制仍然必要。因此，从文档和控制姿态看，产品已经具备企业就绪度；但从第三方可靠性审计角度看，透明度仍不完整。
