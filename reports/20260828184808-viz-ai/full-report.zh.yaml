  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              应先把 Viz.ai 定义为附着在时间敏感临床决策上的工作流软件，而不是泛医疗 AI 供应商。其放射科和神经科页面强调工作清单优先级、PACS
              集成、移动协作和下游协同，而不是自主诊断。因此，相关边界从影像触发的分诊和照护团队启动开始，再扩展到企业服务线协同，以及依赖同一实时触发层的部分生命科学工作流。这个框架排除了扫描仪硬件、通用 EHR
              支出、广义临床文档软件，以及医疗支出里多数万亿美元级大类。


              现状仍然很强。医院可以继续使用既有 PACS 队列、放射科医生阅片、人工呼叫和人工升级，而不购买企业 AI 工作流层。Radiology Business 从市场侧给出同样判断：独立应用如果无法接入影像 IT
              骨干或证明企业价值，本身并不能赢。实际替代品因此不只是另一家算法供应商，而是既有工作流加上叠在既有 IT 上的选择性单点工具。因此，正确问题不是医疗 AI
              总市场到底有多大，而是医疗服务方和生命科学预算是否足以支持一种工作流软件，让急诊照护路径更快、更协同、更可衡量。
