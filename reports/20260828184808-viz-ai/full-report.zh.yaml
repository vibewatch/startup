      - number: '3.4'
        title: 切换成本、商品化与护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              这个市场的切换成本来自运营嵌入，而不是单一算法。一旦供应商进入
              PACS、工作清单、警报路由、照护团队升级和治理例程，替换就可能扰动多个科室，并需要新的安全审查、再培训和工作流重设计。这支撑了真实护城河，前提是哪家平台能成为医院内部标准。若买方希望在放射、神经、心脏、血管和相邻服务线之上使用一个工作流层，Viz.ai
              就会受益于这种动态。


              但护城河并非绝对。Aidoc 和 RapidAI 也使用企业平台语言，deepc 等编排玩家则直接攻击基础设施层。Cleerly
              这类专科供应商可以在报销更清晰的狭窄场景取胜，开放平台行为也可能随时间推移同时增强和削弱 Viz.ai。最清晰的长期风险是，企业影像 AI
              变成更广工作流基础设施的一个功能，而不是一个独立品类。如果发生这种情况，赢家将是装机基础信任最深、集成杠杆最大、扩张证据最强的供应商，而不一定是算法组合最丰富多彩的供应商。
