  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接临床 AI 同业
        blocks:
          - type: paragraph
            body: >-
              Viz.ai 的直接同业比广义医疗 AI 宇宙窄。Aidoc 和 RapidAI 是最明显的同类竞争者，因为两者都明确把临床 AI 作为工作流层来销售，而不是一次性诊断应用。Aidoc 强调优先级发现、端到端
              IT 集成、患者管理和 aiOS 平台；RapidAI 强调企业部署、跨学科临床行动、大规模证据和广泛国际覆盖。面对这些同业，Viz.ai 竞争的是多专科宽度、多模态数据和照护团队参与度，而不是单一卒中算法故事。


              这些直接竞争者很强，因为它们追求同一个医院价值主张：更快把正确患者送到正确专科医生面前，接入既有系统，并证明可衡量运营价值。这意味着买方比较的不只是模型准确率。买方比较的是集成负担、工作流契合度、信任，以及一家供应商成为多条服务线标准操作界面的可能性。在这个框架下，RapidAI
              像最大的公开规模基准，Aidoc 则像最直接的企业工作流镜像。
