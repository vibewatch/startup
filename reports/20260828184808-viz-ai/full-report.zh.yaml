  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              看 Viz.ai，正确结论是不要把公司质量等同于价格支撑。公开证据指向一家真实业务：公司拥有较宽的临床工作流平台，网络内接近 2,000
              家医院，临床医生参与度有意义，医疗业务已经盈利，生命科学变现层也在增长。这些信号并不轻。它们足以让投资人认真关注，也清楚地把 Viz.ai 和未经验证的早期医疗 AI 供应商区分开。


              问题在于，公开估值锚点既陈旧又苛刻。最后一次确认的估值是 2022 年 4 月 Series D 的 $1.2B，而最强公开经常性收入锚点是 GetLatka 给出的 2024 年 $48.8M ARR。即便承认
              2025 年和 2026
              年仍在增长，这个过时的独角兽估值，相对今天公开可比公司区间仍显得偏贵。因此判断必须对价格敏感：业务本身可能值得投资兴趣，但在留存、集中度、现金生成和资本结构没有更强私下证据之前，公开记录不支持再次支付接近
              2022 年估值的价格。
