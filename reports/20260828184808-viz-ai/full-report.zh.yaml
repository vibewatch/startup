      - number: '7.4'
        title: 缓释、否决标准和尽调路径
        blocks:
          - type: paragraph
            body: >-
              恰当结论不是对任何单一未解项反应过度，而是排序：哪些事情必须在私下证明，投资确信度才会提高。第一，公司要用续约和集中度数据证明已部署客户基础有经济韧性。第二，要证明医疗业务盈利正在转化为集团层面可信的资本充足性。第三，要证明信任、合规和支持体系经得住真实压力事件，而不只是采购审查。第四，要证明模块扩张创造价值的速度仍高于执行复杂度上升的速度。


              投资监控上，最重要的否决标准可以观察。严重安全事件、参考路径报销恶化、医院或医护用户增长停滞、重要客户扩张流失，或被更宽的工作流基础设施战略性替代，都会实质性改变估值框架。在私下尽调补上集中度、留存、事故历史和现金生成这些缺口之前，Viz.ai
              应被看作一个已经规模化、但仍对执行高度敏感的临床 AI 平台，而不是已经去风险的基础设施资产。
