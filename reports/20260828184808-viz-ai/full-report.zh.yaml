  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块宽度
        blocks:
          - type: paragraph
            body: >-
              Viz.ai
              不只是一个计算机视觉单点工具。公开产品界面一贯把公司呈现为企业临床工作流层：摄取影像和相关临床数据，标记疑似疾病，提醒相关团队，并把协作留在安全的移动端加桌面环境中。这个框架重要，因为它解释了产品家族如何在不变成一袋互不相连应用的情况下，扩展到放射、神经、心脏、血管、肿瘤和行政工作流。共同任务是降低时间敏感照护中的延误和协同失败。


              模块地图现在也明显比最初的卒中滩头阵地更宽。产品和获批页面显示，套件或模块覆盖 CT 灌注、腹主动脉瘤、动脉瘤随访、脑内出血量化、通过 RV/LV 分析支持 PE 风险、ACS 分诊、HCM、肿瘤，以及生成式
              AI 辅助。战略含义是，Viz.ai 已把一个医院工作流楔子转化为一组相关照护路径平台。对投资人而言，这种宽度创造了真实扩张上行，但也提高了监管维护、支持质量和跨模块一致性的门槛。
