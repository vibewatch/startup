      - number: '8.2'
        title: 可比公司视角：为什么 2022 年估值偏贵
        blocks:
          - type: paragraph
            body: >-
              当前公开可比公司给不出一个整齐答案，但能划出合理定价边界。Doximity 约按 TTM 收入 7.7x 交易，Tempus 约 10.5x，代表临床工作流和 AI 叙事里的高端估值。RadNet 更接近
              2.9x，它是规模更大、偏影像、服务属性更重的运营商；Health Catalyst 约 0.3x 至 0.4x，则提醒人们：一旦增长或信心转弱，医疗软件叙事可以大幅压缩。Viz.ai
              应该落在这个区间内，而不是区间外。


              在这个区间里应放哪一档？公开证据支持它高于低质量医疗 IT 公司，因为采用、产品重要性和平台宽度都是真的。但公开证据也支持它低于最干净的高溢价软件或 AI 可比公司，因为 Viz.ai
              没有披露公开市场奖励的留存、收入质量、利润率结构或资产负债表清晰度。因此，过时的 2022 年独角兽估值很难辩护。按 2024 年 ARR 算是 24.6x，即使用 $65M 前瞻 ARR 的示例情景，仍约为
              18.5x；旧估值隐含的溢价高于今天可见的可比公司区间，需要公开记录尚未提供的私下证据来支撑。
