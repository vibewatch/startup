      - number: '7.3'
        title: 运营、伙伴和商业模式风险
        blocks:
          - type: paragraph
            body: >-
              运营上，Viz.ai 靠的远不止算法。它还靠影像和临床数据流、客户 IT
              集成、培训、工作流设计、支持质量，以及临床医生持续响应。支持和客户资源材料已经说明这一点。产品高接触，这带来粘性，也带来扩张负担。农村医院和协会渠道加深了这种取舍：覆盖范围和社会使命被拉大，但预算更紧、本地 IT
              更薄、转诊工作流更脆弱。这些条件会拉长价值实现周期，也让交付质量更难标准化。


              伙伴和商业模式风险也没有完全解决。协会渠道关系看起来有前景，但公开数据没有显示转化效率或经济耐久性。部分模块有报销支持，并不是所有模块都有；一旦工作流 ROI
              更难证明，模式就会变脆弱。竞争压力也在加剧，竞争对手和既有厂商都在转向同一套企业价值叙事。风险不一定是马上崩塌，而是逐步挤压：扩张变慢、采购变难、折扣变多，公司每增加一条新工作流线都会遭到更多审视。
