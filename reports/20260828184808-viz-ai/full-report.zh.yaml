      - number: '2.2'
        title: 受证据约束的市场测算口径
        blocks:
          - type: paragraph
            body: >-
              公开数据给出了可信市场边界，却没有给出一个精确 TAM。最宽的上限是 CMS 全国医疗支出，2024 年达到 $5.3 trillion，其中医院支出 $1.6347 trillion，医生和临床服务
              $1.1097 trillion。机构买方口径进一步收窄到 6,120 家美国医院和超过 916,000 张运营床位。品类口径再收窄一层：Grand View Research 预计全球医学影像 AI 市场到
              2030 年达到 $8.18 billion，早期组合由神经科和 CT 领先；Allied Market Research 则预计到 2030 年更宽的医疗 AI 市场达到 $194.4
              billion，其中包含许多远离 Viz.ai 核心的品类。这些边界有用，但衡量范围不同。


              最相关的 Viz.ai 专属口径是装机基础证据。公司称目前触达接近 2,000 家医院和 230 million
              人群，在顶尖医疗系统中有重要采用，模块组合也已从卒中扩展到心脏、肿瘤、肺科和血管工作流。这说明市场商业化真实存在。但公开来源没有披露每家医院价格、模块附加率或分部收入结构，因此本报告使用受证据约束的 SAM
              代理，而不是假装知道一个干净的公开市场份额。对企业影像工作流、急诊照护协同和相邻生命科学工作流软件而言，一个粗略的美国 SAM 区间 $4 billion 到 $16
              billion，比把万亿美元级医疗支出数字当作可直接寻址收入来复用更诚实。
