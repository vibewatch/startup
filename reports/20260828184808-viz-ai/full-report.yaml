      - number: '7.2'
        title: Regulatory, legal, and security risk
        blocks:
          - type: paragraph
            body: >-
              The most structurally important risk area is regulatory and legal. Viz.ai operates in clinical decision
              support and disease-detection workflows, so every new module requires more evidence, more compliance
              discipline, and more post-market vigilance. FDA oversight, ACR governance expectations, privacy notices,
              HIPAA security obligations, and cross-border legal documentation all point in the same direction: this is
              a platform that lives inside a dense compliance perimeter. The company’s assistive posture matters here.
              Because clinicians remain in the loop, Viz.ai avoids some of the hardest autonomous-software liability
              questions, but it still depends on hospitals using the system correctly and consistently.


              Security and privacy amplify this risk because PHI-heavy workflow software can lose years of procurement
              trust from a single high-profile incident. Viz.ai public trust materials are stronger than average, and
              the SOC 2 + HIPAA audit announcement is a real mitigating signal. Yet public documents cannot answer the
              hardest questions: incident history, drift monitoring, workflow override rates, local governance failures,
              or how frequently customer-side configuration creates risk. That is why the legal risk today looks more
              prospective than litigated, but still highly material.
            claimRefs:
              - CR002
