companyProfile:
  summary: >-
    Viz.ai is a clinical AI company founded in 2016 by Dr. Chris Mansi and Dr. David Golan. The company sells a
    workflow-embedded care-coordination platform used by hospitals and health systems to detect time-sensitive
    conditions from imaging and other clinical signals, mobilize care teams, and increasingly support administrative and
    life-sciences workflows. Public 2025-2026 evidence shows a scaled footprint approaching or exceeding 2,000
    hospitals, a growing life-sciences business, and healthcare-business profitability, but the company still does not
    publicly disclose the retention, margin, concentration, and cash-flow data needed to underwrite a premium late-stage
    private valuation with confidence.
