  - id: FE001
    title: Product architecture map
    type: stack
    layout: standard
    summary: >-
      Public product materials support a layered architecture: multimodal ingestion, disease-specific AI, workflow
      routing, clinician-facing surfaces, and trust/compliance controls across the stack.
    data:
      layers:
        - label: Layer 1 — Data ingestion
          detail: >-
            Imaging and other clinical signals enter the platform from hospital systems using standard communication
            protocols.
        - label: Layer 2 — Disease-specific AI modules
          detail: >-
            Condition modules detect suspected disease or quantify relevant measurements such as perfusion, hemorrhage,
            aneurysm, or RV/LV ratios.
        - label: Layer 3 — Workflow routing and collaboration
          detail: >-
            The platform sends alerts and context to the right multidisciplinary care teams across mobile and desktop
            surfaces.
        - label: Layer 4 — Clinician-facing applications
          detail: >-
            Radiology, neuro, cardio, vascular, oncology, Assist, and other specialty surfaces present outputs in
            workflow context.
        - label: Layer 5 — Trust and governance controls
          detail: >-
            SOC 2, HIPAA, privacy, continuity, and procurement-oriented controls sit across the platform as enterprise
            requirements.
        - label: Layer 6 — Configurable pathway logic
          detail: >-
            Agent Studio extends the stack by allowing health systems to customize and scale care pathways over the same
            backbone.
    approximationNotes: >-
      The stack synthesizes repeated operating patterns from product and trust pages; proprietary infrastructure
      internals remain private.
    claimRefs:
      - CE022
      - CE023
      - CE024
      - CE031
      - CE032
      - CE033
      - CE035
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: standard
    summary: >-
      A typical Viz.ai workflow begins with clinical-data ingestion, runs through AI analysis and alerting, and ends
      with clinician review and downstream action inside an existing enterprise setting.
    data:
      nodes:
        - id: n1
          label: Clinical data enters Viz.ai from scanner, PACS, ECG, EHR, or related source
          detail: Multimodal starting point varies by care pathway
        - id: n2
          label: Disease-specific module analyzes suspected condition or relevant measurement
          detail: Examples include stroke perfusion, aneurysm, RV/LV, HCM, or documentation context
        - id: n3
          label: Platform returns processed output into clinician-facing surface
          detail: Outputs can appear in PACS, mobile, desktop, or workflow views
        - id: n4
          label: Right care team receives coordinated alert and context
          detail: Radiologists, specialists, EMS, or coordinators are routed into the same workflow
        - id: n5
          label: Clinician reviews assistive output and decides next action
          detail: Products remain assistive and require human judgment
        - id: n6
          label: Downstream diagnosis, transfer, documentation, referral, or treatment step occurs
          detail: Operational value depends on end-user follow-through and integration quality
      edges:
        - from: n1
          to: n2
          label: feeds
        - from: n2
          to: n3
          label: produces
        - from: n3
          to: n4
          label: routes
        - from: n4
          to: n5
          label: prompts
        - from: n5
          to: n6
          label: enables
    approximationNotes: This is a generic operating flow synthesized from multiple specialty pages rather than a single-module SOP.
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE007
      - CE011
      - CE023
      - CE032
