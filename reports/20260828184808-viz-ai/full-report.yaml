      - number: '2.2'
        title: Evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Public data provide credible market bounds but not a single precise TAM. The broadest ceiling is CMS
              national health expenditure, which reached $5.3 trillion in 2024, including $1.6347 trillion in hospital
              spend and $1.1097 trillion in physician and clinical services. The institutional-buyer lens then narrows
              to 6,120 U.S. hospitals and more than 916,000 staffed beds. The category lens narrows further: Grand View
              Research projected an $8.18 billion global AI-in-medical-imaging market by 2030 with neurology and CT
              leading early mix, while Allied Market Research projected a much broader $194.4 billion AI-in-healthcare
              market by 2030 that includes many categories far outside Viz.ai's core. These are useful bounds, but they
              measure different scopes.


              The most relevant Viz.ai-specific lens is installed-base evidence. The company says it now reaches nearly
              2,000 hospitals and 230 million lives, with major adoption across top health systems and a module set that
              has expanded beyond stroke into cardio, oncology, pulmonology, and vascular workflows. That shows the
              market is commercially real. But because public sources do not disclose price per hospital, module attach,
              or segment revenue mix, the report uses an evidence-constrained SAM proxy rather than pretending to know a
              clean published market share. A rough $4 billion to $16 billion U.S. SAM range for enterprise imaging
              workflow, urgent care coordination, and adjacent life-sciences workflow software is analytically more
              honest than reusing trillion-dollar healthcare-spend numbers as if they were directly addressable revenue.
