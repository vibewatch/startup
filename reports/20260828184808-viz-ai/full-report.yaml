        - $65M ARR, continued footprint growth, healthcare-business profitability holds, disclosure still incomplete
        - 6x-8x ARR => ~$390M-$520M EV; interesting only at a major reset vs 2022 mark
        - Opacity on cash flow and margins limits multiple expansion
