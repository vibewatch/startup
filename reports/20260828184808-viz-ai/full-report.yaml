  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Imaging-triggered care coordination
        - Triage, prioritization, and downstream specialist activation from imaging or ECG signals
        - Scanner hardware, generic PACS licenses, generic EHR budgets
        - Radiology, CMIO/CIO, service-line leaders
        - Core Viz.ai wedge
      - - Enterprise clinical AI workflow layer
        - Model orchestration, worklists, alerts, collaboration, and security review
        - Standalone isolated algorithms with no workflow or governance layer
        - Large health systems
        - Important platform expansion layer
      - - Life-sciences point-of-care activation
        - Clinician education, patient onboarding, therapy support, and trial or treatment triggers inside workflow
        - Broad pharma CRM or marketing automation spend with no clinical trigger
        - Life-sciences commercial, medical, and patient-support teams
        - Real adjacency but distinct buyer budget
      - - Service-line expansion markets
        - Cardiology, oncology, pulmonology, vascular, and neuro care-pathway workflows
        - Drug discovery, therapeutics, and unrelated hospital software
        - Service-line and enterprise buyers
        - Widens SAM beyond stroke and radiology
      - - Excluded broad healthcare IT
        - Billing, ERP, general documentation, consumer digital health
        - Time-sensitive image-led workflow action
        - Hospital IT budgets broadly
        - Too broad to use in TAM logic
      - - Status-quo substitute
        - Manual review queues, paging, and incumbent workflow tools
        - Autonomous diagnosis narrative
        - Hospitals bearing delay and labor costs
        - The incumbent process Viz.ai is trying to compress
    notes: >-
