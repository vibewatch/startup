        - $55M ARR, slower expansion, services burden heavier than expected, limited reimbursement breadth
        - 3.5x-5x ARR => ~$190M-$275M EV; attractive only if access price is deeply reset
        - Weak retention, concentration, or incident history could push outcome here
        - Plausible but not base if public adoption claims are directionally true
