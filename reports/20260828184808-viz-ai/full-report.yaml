  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct clinical-AI peers
        blocks:
          - type: paragraph
            body: >-
              Viz.ai direct peer set is narrower than the broader medical-AI universe. Aidoc and RapidAI are the most
              obvious like-for-like rivals because both explicitly market clinical AI as a workflow layer rather than as
              a one-off diagnostic application. Aidoc emphasizes prioritized findings, end-to-end IT integration,
              patient management, and its aiOS platform, while RapidAI emphasizes enterprise deployment,
              cross-disciplinary clinical action, large-scale evidence, and broad international reach. Against those
              peers, Viz.ai competes on multi-specialty breadth, multimodal data, and care-team engagement rather than
              on a single stroke algorithm story.


              These direct rivals are strong because they are pursuing the same hospital value proposition: get the
              right patient to the right specialist faster, integrate into existing systems, and prove measurable
              operational value. That means the buyer is not just comparing model accuracy. The buyer is comparing
              integration burden, workflow fit, trust, and the likelihood that a vendor becomes the standard operating
              surface across multiple service lines. In that frame, RapidAI looks like the largest public scale
              benchmark, while Aidoc looks like the most direct enterprise-workflow mirror image.
            claimRefs:
