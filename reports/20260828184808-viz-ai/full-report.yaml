      - number: '8.4'
        title: Final diligence asks and thesis-breaks
        blocks:
          - type: paragraph
            body: >-
              The missing diligence is unusually actionable. Investors do not mainly need more brand-name customer logos
              or more proof that hospitals know Viz.ai exists. They need the economic facts that decide whether this is
              premium software, useful infrastructure, or an over-raised clinical point-solution platform. The top asks
              are retention cohorts, concentration by customer and life-sciences partner, gross margin by segment,
              consolidated cash generation, debt terms, and the preference stack. Those items would collapse the
              valuation range quickly.


              Until then, thesis-break triggers are straightforward. A serious security or quality incident would attack
              trust directly. Slowing installed-base growth or weak expansion inside existing systems would challenge
              the platform-upgrade narrative. Reimbursement setbacks in reference pathways would weaken budget
              justification. And strategic displacement—where broader workflow platforms or rival AI vendors absorb
              similar capabilities faster than Viz.ai compounds its install-base moat—would pressure both growth and
              multiple. These are observable triggers, which is helpful. But they also reinforce why the recommendation
              should remain disciplined: the public record supports interest, not complacency.
            claimRefs:
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
