  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Viz.ai should be framed first as workflow software attached to time-sensitive clinical decisions, not as a
              generic healthcare-AI vendor. Its radiology and neuro pages emphasize worklist prioritization, PACS
              integration, mobile collaboration, and downstream coordination rather than autonomous diagnosis. That
              means the relevant boundary starts with imaging-triggered triage and care-team activation, then widens
              into enterprise service-line coordination and select life-sciences workflows that depend on the same
              real-time trigger layer. This framing excludes scanner hardware, generic EHR spend, broad clinical
              documentation software, and most of the trillion-dollar categories inside healthcare expenditure.


              The status quo is still powerful. Hospitals can keep using existing PACS queues, radiologist review,
              manual paging, and human escalation without buying an enterprise AI workflow layer. Radiology Business
              makes the same point from the market side: standalone applications do not win by themselves if they cannot
              integrate into the imaging-IT backbone or prove enterprise value. The practical substitute is therefore
              not just another algorithm vendor; it is incumbent workflow plus selective point tools layered onto
              existing IT. That is why the right question is not whether the healthcare-AI market is large in aggregate,
              but whether enough provider and life-sciences budgets exist for workflow software that makes urgent care
              pathways faster, more coordinated, and more measurable.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM028
              - CM044
              - CM045
