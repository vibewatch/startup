      - number: '8.3'
        title: Scenario ranges and upside conditions
        blocks:
          - type: paragraph
            body: >-
              A scenario framework is more defensible than a single target because too many core inputs remain private.
              In a bear case, Viz.ai behaves like a still-growing but risk-discounted healthcare workflow company: ARR
              is closer to $55 million, margins remain burdened by high-touch deployment, and investors apply only 3.5x
              to 5x revenue. That yields roughly $190 million to $275 million of value. In a base case, the platform
              sustains meaningful growth, pushes ARR toward about $65 million, and earns 6x to 8x because scale and
              stickiness are real even if disclosure is still incomplete; that supports roughly $390 million to $520
              million. In a bull case, ARR approaches or exceeds $80 million, healthcare-business profitability proves
              durable, and life-sciences expansion becomes more repeatable, supporting 9x to 12x and approximately $720
              million to $960 million.


              The key point is not the false precision of any single number. It is the shape of the distribution. Public
              evidence makes sub-$300 million look too bearish unless adoption quality is much worse than it appears,
              but it also makes anything above about $1 billion hard to support without non-public evidence of
              substantially higher ARR and much better retention or margin quality. That leaves a practical investment
              stance: be constructive on the company, but insist on either a material price reset or strong private
              diligence that proves Viz.ai deserves to converge toward the premium public comp set.
            claimRefs:
              - CV021
              - CV022
