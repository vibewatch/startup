        - Potentially faster threshold-based activation and review
        - Comparative performance versus alternative CTP tools is not public
      - - EMS-to-cath-lab ACS coordination
        - ECGs arrive by text/photo or fragmented systems
        - Viz ACS centralizes full-quality ECGs in a HIPAA-compliant workflow
        - Reduces blurry-photo friction and unnecessary false alarms
        - No public latency or activation metrics by hospital
      - - Health-system ECG screening for HCM
        - Manual specialist referral after scattered ECG review
