            body: >-
              This chapter can only support a directional financial view because the key underwriting fields remain
              private. Public sources do not disclose segment ARR, gross margin, burn, cash balance, deferred revenue,
              debt covenants, CAC payback, customer concentration, or renewal economics. They also leave ambiguity
              around public metric definitions: partnership count changes by date, funding totals differ across sources,
              and headcount reporting varies across independent databases. Those are manageable issues for a
              growth-stage private company, but they limit confidence when translating a strong operating narrative into
              a hard investment case.


              The most important diligence step is therefore not finding more public praise. It is obtaining reconciled
              internal finance materials that connect revenue composition, margin structure, and capital adequacy to the
              platform-expansion story. Without that, investors can conclude that Viz.ai has credible scale, diversified
              monetization paths, and improving operating leverage, but they cannot yet determine whether those
              positives justify the capital already consumed or support a premium future valuation on purely financial
              grounds.
