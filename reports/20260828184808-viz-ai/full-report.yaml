            title: Constructive company, disciplined price
            body: >-
              Viz.ai looks investable as a business, but not automatically at its stale 2022 unicorn valuation. Public
              evidence supports interest only if price resets materially or private diligence closes the
              economic-disclosure gap.
            calloutType: recommendation
