      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Platform scale is now the core proof point
            body: >-
              The strongest takeaway from the public record is that Viz.ai has moved well beyond a stroke-only
              narrative. Nearly 2,000 hospitals, 230 million lives, and two large horizontal partners suggest a company
              increasingly winning at workflow embedding, not just algorithm novelty.
