  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / event
      - Transmission to thesis
      - Action implication
    rows:
      - - Serious security or quality incident
        - Major PHI event, safety controversy, or repeated audit/control failure
        - Breaks trust moat and slows procurement or expansion
        - Pause bullish view immediately and re-underwrite downside
      - - Installed-base slowdown
        - Hospital footprint, provider-user growth, or add-on adoption stalls materially
        - Challenges platform-upgrade narrative and cross-sell logic
        - Reduce acceptable multiple and require retention proof
      - - Reimbursement deterioration
        - Key reference pathways lose payment support or fail to broaden
        - Weakens budget justification outside strongest use cases
        - Lower base-case multiple and growth assumptions
      - - Concentration surprise
        - Private diligence reveals outsized dependence on a few systems or partners
        - Shows adoption breadth is less monetization-diverse than assumed
        - Shift toward bear-case framework
      - - Capital-structure overhang
        - Debt terms, cash burn, or liquidation preferences are harsher than expected
        - Reduces common-equity attractiveness even if EV looks appealing
        - Demand lower entry price or walk away
      - - Strategic displacement
        - Broader platforms or rivals win standardization decisions in key accounts
        - Compresses pricing power before disclosure quality improves
        - Treat as structural thesis-break if trend persists
    notes: All triggers are monitorable and tied to decisions rather than generic watch items.
    claimRefs:
      - CV038
      - CV039
      - CV040
      - CV041
      - CV042
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Retention cohorts
        - NRR, GRR, logo churn, module expansion by customer vintage
        - Retention decides whether Viz.ai deserves premium workflow-software treatment
        - Company request; cohort deck and board KPI pack
      - - Customer and partner concentration
        - Revenue by top provider systems, life-sciences partners, and geography
        - Broad logo counts can still hide economic concentration
        - Company request; finance diligence room
      - - Segment gross margin
        - Gross margin for provider SaaS, services, and life-sciences workflows
        - Determines whether the business scales like software or like enabled services
        - Company request; audited segment view if available
      - - Cash generation and runway
        - Consolidated EBITDA, free cash flow, cash balance, debt covenants, runway
        - Profitability in one segment is not enough for equity underwriting
        - Board materials and debt documents
      - - Preference stack and investor protections
        - Liquidation preferences, participation, pay-to-play, and secondary terms
        - Outcome for new money can differ sharply from enterprise-value math
        - Cap table and legal financing docs
      - - Current price discovery
        - 409A marks, secondary trades, or recent investor re-marks
        - Without current price discovery, recommendation remains conditional
        - Finance/legal request plus investor reference calls
    notes: These asks are ranked by how quickly they would tighten the scenario range and change the recommendation.
    claimRefs:
      - CV036
      - CV037
