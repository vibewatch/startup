      - number: '8.2'
        title: Comparable lenses and why the 2022 mark looks rich
        blocks:
          - type: paragraph
            body: >-
              Current public comparables do not yield one neat answer, but they do define the boundaries of reasonable
              pricing. Doximity trades around 7.7x trailing revenue and Tempus around 10.5x, representing the premium
              end of clinically relevant workflow and AI narratives. RadNet trades closer to 2.9x as a larger
              imaging-centric operator with service-heavy economics, while Health Catalyst’s roughly 0.3x to 0.4x
              multiple is a reminder that healthcare-software narratives can compress dramatically when growth or
              confidence weaken. Viz.ai belongs somewhere inside this spread, not outside it.


              Where exactly inside that spread should it sit? Public evidence suggests above low-quality healthcare-IT
              names because adoption, product relevance, and platform breadth look real. But it also suggests below the
              cleanest premium software or AI comps because Viz.ai does not disclose the retention, revenue quality,
              margin structure, or balance-sheet clarity that public markets reward. That is why the stale 2022 unicorn
              valuation looks difficult to defend. At 24.6x 2024 ARR, and still about 18.5x even on an illustrative $65
              million forward ARR case, the old mark implies a premium above today’s visible comp range. That requires
              private proof the public record does not yet provide.
            claimRefs:
