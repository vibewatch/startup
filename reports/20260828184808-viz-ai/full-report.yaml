      - number: '1.2'
        title: Leadership bench, governance signals, and compliance posture
        blocks:
          - type: paragraph
            body: >-
              Leadership continuity is one of Viz.ai's clearest strengths. Chris Mansi remains the CEO and public face
              of the business, while the executive page shows a fairly deep bench spanning operations, revenue, R&D,
              privacy, medical leadership, and finance. The March 2024 addition of Michael Herring as CFO is especially
              relevant because the company described him as a finance leader experienced in both public and
              private-company scaling. That suggests Viz.ai has been investing in a stronger reporting and
              capital-markets function even before any public exit process is visible. At the same time, the company
              public governance disclosures remain thin: the leadership page names board members, but not ownership
              percentages, committee structure, observer rights, or investor-control mechanics.


              The compliance posture is more detailed than the governance posture. Viz.ai's trust center and July 2024
              security release describe a mature control framework covering SOC 2 Type II, HIPAA, multiple ISO
              certifications, business continuity, privacy management, and AI-governance standards. That matters in
              hospital software because security reviews often gate expansion more than raw model performance does. It
              also matters for life sciences, where customer trust depends on whether the platform can handle PHI and
              workflow triggers across heavily regulated settings. The fetched evidence therefore supports a view of
              Viz.ai as operationally maturing faster than its public governance detail suggests: buyers can inspect
              certifications and trust documentation, but investors still need private diligence on board rights and
              ownership concentration.
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
