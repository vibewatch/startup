      - number: '2.3'
        title: Buyer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer map is multi-persona. On the provider side, radiology leaders, CMIOs, CIOs, stroke directors, ED
              leaders, and enterprise service-line executives all matter because the product touches both imaging
              interpretation and downstream coordination. On the life-sciences side, Salesforce materials point to
              commercial, medical-affairs, market-access, and patient-support teams that want real-time clinical
              triggers. This mix implies that Viz.ai can be purchased as a departmental workflow tool, an enterprise AI
              platform, or an embedded life-sciences enablement layer depending on the use case.


              The adoption path implied by the sources is also familiar. A health system starts with an urgent workflow
              where delay is visible and measurable, proves value in a pilot or a contained service line, integrates
              with PACS or other existing systems, then expands across additional specialties once clinical and security
              stakeholders trust the platform. Microsoft partnership materials reinforce that enterprise-scale rollout
              depends on interoperability, scalability, and security rather than only on algorithm accuracy. This makes
              adoption less like a direct reimbursement decision and more like an operational software decision: buyers
              need faster decisions, fewer workflow gaps, and evidence that the product can live inside the hospital's
              existing IT and governance stack.
