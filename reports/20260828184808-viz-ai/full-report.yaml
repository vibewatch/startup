        title: Funding history and capital structure
        blocks:
          - type: paragraph
            body: >-
              Viz.ai appears firmly late-stage from a financing perspective, but the public record is not perfectly
              consistent on totals. Official company releases show a $71 million Series C in March 2021 that brought
              cumulative funding to over $150 million, followed by a $100 million Series D in April 2022 at a $1.2
              billion valuation. Business Wire then reported a $40 million growth-capital facility from CIBC in March
              2023 to support expansion and possible acquisitions. GetLatka, however, lists total funding at $242
              million across four rounds. The cleanest interpretation is that public equity tallies range from about
              $242 million to slightly above $250 million depending on source methodology and rounding, and total
              publicly disclosed capital rises into roughly the $282 million to $290 million band when the debt facility
              is included.


              That mixed picture is still informative. It shows a company that used large software-style venture rounds
              to build distribution, then supplemented equity with non-dilutive capital while moving toward
              profitability. It also suggests management wanted optionality for expansion and perhaps tuck-in M&A rather
              than relying on a near-term public financing event. The business-entities page further shows that Viz.ai
              operates with subsidiaries across multiple jurisdictions, which can support growth and hiring but also
              adds cost and compliance complexity that public investors cannot yet quantify from retained sources alone.
