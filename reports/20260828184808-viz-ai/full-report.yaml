  - id: TV001
    title: Recommendation summary table
    columns:
      - Lens
      - Current assessment
      - Evidence basis
      - Decision implication
    rows:
      - - Recommendation
        - Track / research-more
        - Business quality is visible, but pricing support is incomplete
        - Do not underwrite aggressively without valuation update or private diligence
      - - Confidence
        - Medium-low
        - Several strong operating signals exist, but core economics remain undisclosed
        - Treat scenario ranges as underwriting guides rather than investable marks
      - - Risk rating
        - High
        - >-
          Clinical-AI execution, regulatory overhead, concentration opacity, and capital-structure uncertainty all
          matter
        - Require disciplined entry and hard diligence gates
      - - Valuation stance
        - 2022 unicorn mark looks stretched on public evidence
        - Last confirmed mark is stale and screens rich versus public comp band
        - Avoid paying near $1.2B absent major private proof
      - - Constructive entry zone
        - Material reset versus 2022 mark
        - Base-case math clusters around roughly $390M-$520M and generous ARR math only reaches ~$650M
        - Interest improves materially if access price reflects that reset
      - - What upgrades the call
        - Retention, concentration, cash-flow, and cap-table proof
        - These are the missing data that would justify moving up the comp stack
        - Re-rate only after diligence or better price discovery
    notes: >-
      This table is intentionally price-sensitive. It separates business quality from what public evidence can support
