  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization logic
        blocks:
          - type: paragraph
            body: >-
              Viz.ai public record supports a hybrid commercialization model rather than a single revenue line. The
              provider side looks like classic enterprise healthcare software: hospital systems adopt the platform, then
              add service lines such as neuro, cardio, radiology, vascular, oncology, and now administrative workflows
              through Viz Assist. The life-sciences side reuses the same installed clinical surface to identify eligible
              patients, trigger next-best actions, and support therapy-initiation or education programs for pharma and
              medtech partners. Economically, that means Viz.ai is trying to increase revenue per installed network by
              layering additional workflow value onto the same institutional footprint.


              This model matters because it improves the odds that growth can come from expansion, not only from
              greenfield logo wins. Public product pages support that view: Viz Assist explicitly markets documentation
              accuracy, suggested billing codes, and revenue recovery; oncology extends the platform into another large
              service line; and the life-sciences page claims rising partner count, broad HCP reach, and measurable
              workflow outcomes. Reimbursement also matters selectively. Medical Economics shows that Viz HCM received a
              clearer Medicare payment path than many AI tools, which means some modules may monetize through cleaner
              specialty economics while the broader platform still sells on enterprise workflow ROI.
