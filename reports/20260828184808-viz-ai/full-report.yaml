  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The right conclusion on Viz.ai is not to confuse company quality with price support. Public evidence
              points to a real business: the company has a broad clinical workflow platform, nearly 2,000 hospitals in
              its network, meaningful clinician engagement, healthcare-business profitability, and a growing
              life-sciences monetization layer. Those are not trivial signals. They justify serious investor attention
              and they clearly separate Viz.ai from an unproven early-stage healthcare AI vendor.


              The problem is that the public valuation anchor is old and demanding. The last confirmed mark is the April
              2022 Series D at $1.2 billion, while the strongest public recurring-revenue anchor is GetLatka’s $48.8
              million ARR figure for 2024. Even giving credit for continued growth into 2025 and 2026, that stale
              unicorn mark still screens rich relative to today’s public comp band. The consequence is a price-sensitive
              call: the business may deserve investment interest, but the public record does not justify paying anything
              close to the 2022 mark again without materially stronger private evidence on retention, concentration,
              cash generation, and capital structure.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
