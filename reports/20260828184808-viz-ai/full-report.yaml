chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, founding story, and business model
        blocks:
          - type: paragraph
            body: >-
              Viz.ai was founded in 2016 after Chris Mansi concluded that many poor acute-care outcomes were driven not
              by a lack of clinical knowledge but by handoff delay, communication friction, and inconsistent escalation
              between radiologists, emergency clinicians, and specialists. The company origin story is explicit: a
              patient died because the care pathway moved too slowly even after technically successful treatment. That
              framing still matters because it explains why Viz.ai positions itself less as a point algorithm vendor and
              more as a clinical workflow company. Public materials consistently describe an AI-powered care
              coordination platform that analyzes imaging or ECG data, surfaces suspected time-sensitive findings, and
              synchronizes the care team in parallel with the normal standard of care.


              The business model has broadened alongside the product. In provider markets, Viz.ai sells an enterprise
              platform to hospitals and health systems that want faster triage, better coordination, and expansion
              across multiple service lines. In life sciences, Viz.ai increasingly monetizes the same embedded workflow
              position by helping partners identify eligible patients, support therapy initiation, and route clinician
              education at the point of care. By 2026, the company was explicitly presenting hospital subscriptions and
              life-sciences workflow partnerships as two parallel revenue lines, not just a core provider product with
              incidental partnerships. That distinction is strategically important because it means the same clinical
              data and workflow layer can support both hospital ROI and partner go-to-market use cases.
            claimRefs:
