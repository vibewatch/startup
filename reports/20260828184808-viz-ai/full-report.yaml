  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked top risks
        blocks:
          - type: paragraph
            body: >-
              Viz.ai does not look like a company facing one single catastrophic red flag. Instead, it faces a cluster
              of material but interconnected risks that are common to scaled clinical AI platforms: regulatory
              complexity as modules proliferate, uneven reimbursement support, PHI and privacy exposure, high dependence
              on customer implementation quality, channel and concentration opacity, and competition that is steadily
              moving closer to enterprise workflow orchestration. The fact that the product remains assistive reduces
              some autonomous-AI danger, but it does not remove human-factors or governance risk. If anything, it shifts
              more responsibility into real-world implementation quality.


              The positive counterweight is that Viz.ai has visible mitigants. It has accumulated trust documentation,
              multiple regulatory clearances, customer-success infrastructure, a meaningful installed base, and some
              reimbursement precedents. That combination makes residual risk more manageable than an early-stage
              unproven AI company. But it is not enough to make risk low. The company is already big enough that a
              notable incident, reimbursement reversal, procurement slowdown, or platform-displacement trend would have
              investment consequences that flow across multiple modules and revenue lines at once.
            claimRefs:
              - CR001
              - CR023
              - CR030
              - CR031
              - CR035
              - CR040
