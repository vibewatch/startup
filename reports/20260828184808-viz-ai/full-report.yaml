      - number: '7.4'
        title: Mitigations, kill criteria, and diligence path
        blocks:
          - type: paragraph
            body: >-
              The appropriate conclusion is not to overreact to any single unresolved item. It is to rank what must be
              proved privately before underwriting comfort improves. First, the company needs to show that its installed
              base is economically durable through renewal and concentration data. Second, it needs to show that
              healthcare-business profitability is translating into credible capital adequacy at the consolidated level.
              Third, it needs to show that its trust, compliance, and support posture survives real-world stress events
              rather than only procurement review. Fourth, it needs to show that module proliferation is still raising
              value faster than it raises execution complexity.


              For investment monitoring, the most important kill criteria are observable. A serious security incident,
              reimbursement deterioration in reference pathways, plateauing hospital or provider growth, loss of
              meaningful customer expansion, or strategic displacement by broader workflow infrastructure would each
              change the valuation frame materially. Until private diligence closes the gaps on concentration,
              retention, incident history, and cash generation, Viz.ai should be viewed as a scaled but still
              execution-sensitive clinical AI platform rather than a de-risked infrastructure asset.
            claimRefs:
