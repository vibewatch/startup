        - Supports earlier workup and better pathway standardization
        - Broader reimbursement and utilization economics remain unclear
      - - Clinician documentation and coding prep
        - Pre-chart, review imaging, and draft notes manually
        - Viz Assist surfaces key history, drafts notes, referral letters, and suggested billing codes
        - Operational time savings and possible revenue recovery
        - Human review quality and actual coding lift are not publicly audited
      - - Pathway design and guideline rollout
        - Custom EHR build or manual protocol change management
        - Agent Studio lets health systems create and update pathways faster
        - Potentially reduces IT backlog and pathway-launch time
        - Public evidence of customer-built pathway scale is limited
