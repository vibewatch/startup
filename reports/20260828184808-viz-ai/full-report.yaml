            body: >-
              Trust and procurement-readiness are central parts of the product, not side documentation. Viz.ai trust
              materials say the platform processes PHI across thousands of hospitals and describe a security and privacy
              program covering encryption, SOC 2 Type II, HIPAA safeguards, privacy governance, and continuity standards
              such as ISO 22301. The 2024 audit announcement adds a more concrete signal by saying the company completed
              SOC 2 Type II plus HIPAA audits with Big Four involvement. Taken together, these materials make a credible
              case that security, privacy, and enterprise reviewability are deliberate product features for Viz.ai.


              However, these disclosures still stop short of full technical assurance. Public trust-center content does
              not provide incident history, SLA detail, model-release discipline, or module-level performance drift
              monitoring. ACR best-practice guidance is a useful reminder that governance, monitoring, and local
              clinical controls remain necessary even when a vendor is well organized and regulatory clearances are in
              place. The product therefore looks enterprise-ready from a documentation and control posture, but not
              fully transparent from a third-party reliability-audit perspective.
