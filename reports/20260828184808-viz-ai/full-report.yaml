  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base and segmentation
        blocks:
          - type: paragraph
            body: >-
              Viz.ai customer picture is broader than a simple hospital-logo count. The company’s primary commercial
              base is provider organizations—hospitals and health systems using Viz.ai One across urgent and specialty
              workflows—but the same installed clinical surface also supports life-sciences partners and rural-health
              channel relationships. That creates three meaningful segment types: direct provider customers, partner
              customers who pay to activate workflow programs through that provider network, and indirect association or
              regional channels that can open access to many hospitals at once. Public rural-health, oncology, and
              life-sciences materials all reinforce this segmentation.


              Within providers, the public record points to a mix of academic centers, large integrated health systems,
              community hospitals, and rural or critical-access environments. That matters because it suggests Viz.ai is
              not limited to a narrow flagship-center buyer profile. It also means the company’s expansion logic is tied
              to repeatable workflow patterns that can travel across very different care settings. For investors, this
              is a positive sign on breadth, but it also makes it more important to understand which segments generate
              the highest ACV, the most durable expansion, and the greatest implementation burden.
