            body: >-
              Viz.ai is not merely a computer-vision point tool. The public product surface consistently presents the
              company as an enterprise clinical workflow layer that ingests imaging and related clinical data, flags
              suspected disease, alerts the relevant teams, and keeps collaboration inside a secure mobile-plus-desktop
              environment. That framing matters because it explains why the product family has expanded across
              radiology, neuro, cardio, vascular, oncology, and administrative workflows without becoming a bag of
              disconnected apps. The common job is to reduce delay and coordination failure in time-sensitive care.


              The module map also now looks materially broader than the original stroke beachhead. Product and clearance
              pages show suites or modules for CT perfusion, abdominal aortic aneurysm, aneurysm follow-up,
              intracerebral hemorrhage quantification, PE risk support through RV/LV analysis, ACS triage, HCM,
              oncology, and generative-AI assistance. The strategic implication is that Viz.ai has turned one hospital
              workflow wedge into a platform of related care pathways. For investors, that breadth creates real
              expansion upside, but it also raises the bar on regulatory maintenance, support quality, and cross-module
              consistency.
