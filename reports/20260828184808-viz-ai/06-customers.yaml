- id: named-proof-and-durability
  title: Named proof and durability
  body: |-
    Named customer proof is broad enough to show the product is used in the wild across different care settings. Piedmont Healthcare appears in both a customer-success testimonial and an earlier prominent-health-systems list. Montana Hospital Association created a network-style opportunity covering more than 60 hospitals, while Appalachian Regional Healthcare and UK clinicians provide public language around referral-network and treatment-time improvements in rural Kentucky. Tennessee Oncology and Jackson Health add community-oncology and enterprise-trust proof points, and Medtronic plus Novartis show that life-sciences engagement is tied to concrete workflow programs rather than only abstract partnership rhetoric.

    Still, durability evidence remains distinctly weaker than adoption evidence. The public record says a lot about deployments, references, and engagement, but almost nothing about contract length, GRR, NRR, or module-level churn. Customer-success staffing, research support, and ongoing training indicate a sticky enterprise operating model, and life-sciences workflows likely add another layer of embeddedness. But without cohort-level data, investors should treat customer quality as credible and expanding, not fully underwritten. The strongest current read is that Viz.ai has referenceable production customers and meaningful engagement; the weakest point is that the economic depth of those relationships is still private.
  claimRefs:
