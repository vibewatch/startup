- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Diligence path
  rows:
  - - More service lines inside same health system
    - Large systems may dominate ARR even if logo count is broad
    - A few major accounts could sway growth and renewals
    - Review revenue by top 10 and top 25 provider accounts
  - - More provider users inside same deployment
    - User count growth may reflect a few standout systems rather than broad depth
    - Could overstate overall installed-base health
    - Review seat counts and site counts by cohort
  - - Association / channel programs
    - Channel relationships may create access but not guaranteed paid conversion
    - Pipeline quality may be weaker than headline network size
    - Measure conversion from channel membership to active deployment
  - - Life-sciences partner expansion
    - A few major partners may dominate non-provider revenue
    - Partner concentration could distort perceived diversification
    - Obtain partner revenue mix and renewal terms
  - - Reimbursed specialty workflows
    - HCM-like pathways may expand faster than unreimbursed modules
    - Can skew adoption toward a narrow set of service lines
    - Break out adoption and ARR by reimbursed vs non-reimbursed modules
  - - Referenceable named accounts
    - Public testimonials may overweight happiest or most strategic customers
    - Can overstate average customer depth or satisfaction
    - Sample neutral and churned accounts in diligence
  notes: Expansion logic is clear in public materials; concentration math remains private.
