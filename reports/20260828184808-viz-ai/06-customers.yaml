  - Gap
  rows:
  - - Large health systems
    - Enterprise leadership, specialists, radiology, emergency teams
    - Multi-service-line care coordination
    - Majority of top 50 health systems claimed
    - Likely highest ACV and best reference-selling value
    - No ACV, NRR, or site-depth disclosure
  - - Academic and referral centers
    - Stroke, neuro, cardio, and specialty teams
    - Time-sensitive diagnosis and transfer coordination
    - Named systems include Ohio State, Atrium, Piedmont, UK commentary
    - High prestige and downstream referral influence
    - Economic contribution undisclosed
  - - Community and rural hospitals
    - Hospital operators, ED teams, local specialists
    - Earlier detection, transfer coordination, specialist access
    - Rural-health pages plus association programs across states
    - Important volume and channel-expansion surface
    - Implementation burden and budget sensitivity private
  - - Association / network channels
    - MHA Ventures, NRHA, peer-hospital programs
    - Education, network rollout, and member access
    - 60+ hospitals in MHA network; NRHA initiative
    - Efficient route to many hospitals at once
    - Channel conversion and paid uptake unknown
  - - Life-sciences partners
    - Pharma and medtech teams working through HCP workflows
    - Patient identification, referral, therapy initiation, education
    - 7 partners in 2024, 13 in 2026, 14+ currently
    - Second monetization engine over same provider network
    - Revenue mix and concentration private
  - - Specialty programs / clinics
    - Oncology and cardiology service lines
    - Condition-specific workflow activation
    - Tennessee Oncology and HCM support provide public proof
    - Adds depth within existing accounts
    - Module attach and contract terms undisclosed
  notes: The same hospital footprint can support more than one segment because provider deployments and life-sciences workflows overlap on the same clinical surface.
