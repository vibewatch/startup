- id: expansion-loops-and-concentration-risks
  title: Expansion loops and concentration risks
  body: |-
    Viz.ai appears to have several plausible expansion loops. A health system can start with one use case and add more service lines; a reference customer can become a procurement proof point for peer systems; a rural association can create access to many hospitals at once; and a provider deployment can become a platform for life-sciences workflow monetization. Those loops help explain how hospital, provider-user, and partner counts have all risen together over time. Reimbursement-supported specialty pathways such as HCM may further accelerate expansion in selected service lines.

    The counterweight is concentration opacity. Public sources do not reveal what share of revenue comes from the largest provider systems, the largest life-sciences partners, or the most successful channel relationships. Public proof is also strongest where the company has chosen to publish supportive testimonials. That does not invalidate the adoption story, but it does mean buyers and investors should test whether the platform is deeply standardized across accounts or whether some of the headline footprint is concentrated in a smaller set of economically meaningful deployments. In short, the expansion logic is strong; the concentration math is still hidden.
