company:
  name: Viz.ai
chapter:
  number: 6
  title: Customers
  summary: 'Viz.ai public customer record is strong on adoption breadth and named references: the company has scaled from 1,500+ hospitals and 45,000 providers in early 2024 to 2,000+ hospitals and 70,000+ HCP users by the run date, while expanding its life-sciences partner count from 7 to 14+. The weaker area is durability: public materials show engagement and referenceable deployments, but they still do not disclose churn, retention, contract quality, or revenue concentration.'
sections:
- id: customer-base-and-segmentation
  title: Customer base and segmentation
  body: |-
    Viz.ai customer picture is broader than a simple hospital-logo count. The company’s primary commercial base is provider organizations—hospitals and health systems using Viz.ai One across urgent and specialty workflows—but the same installed clinical surface also supports life-sciences partners and rural-health channel relationships. That creates three meaningful segment types: direct provider customers, partner customers who pay to activate workflow programs through that provider network, and indirect association or regional channels that can open access to many hospitals at once. Public rural-health, oncology, and life-sciences materials all reinforce this segmentation.

    Within providers, the public record points to a mix of academic centers, large integrated health systems, community hospitals, and rural or critical-access environments. That matters because it suggests Viz.ai is not limited to a narrow flagship-center buyer profile. It also means the company’s expansion logic is tied to repeatable workflow patterns that can travel across very different care settings. For investors, this is a positive sign on breadth, but it also makes it more important to understand which segments generate the highest ACV, the most durable expansion, and the greatest implementation burden.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU013
  tableRefs:
  - TU001
  figureRefs:
  - FU001
- id: adoption-trajectory-and-usage-signals
  title: Adoption trajectory and usage signals
  body: |-
    Public customer growth indicators are unusually strong for a private healthcare AI company. Viz.ai said it surpassed 1,500 hospitals and 45,000 providers in January 2024, expanded to 1,700+ hospitals and 60,000 providers by January 2025, and then reached nearly 2,000 hospitals and more than 230 million covered lives by January 2026. The current life-sciences page suggests the platform has since moved to 2,000+ hospitals and 70,000+ HCP users by the run date. Life-sciences partnerships also appear to have expanded from 7 in early 2024 to 13 by early 2026 and 14+ currently.

    These are not perfect customer metrics, but they are directionally useful. They show that logo count, user count, and partner count have all risen together across multiple dated releases, which is more convincing than any single marketing statistic. Usage signals deepen the case: 2024 materials said the platform served five patients per minute and that more than 90% of alerts were viewed within five minutes, while 2026 materials emphasized a 90% click-through rate. Those metrics do not substitute for churn or NRR, but they do suggest that at least some deployments have become operationally important rather than sitting idle after procurement.
  claimRefs:
  - CU006
  - CU007
  - CU008
  - CU009
