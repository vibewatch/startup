  topStrengths:
    - 平台已进入约 2,000 家医院，活跃临床医生群体还在扩大。
    - 产品位置不止单一算法，覆盖检测、照护协调和工作流赋能。
    - 服务提供者软件和生命科学合作伙伴的双重变现路径，增加了选择权。
    - 医疗业务在 2025 年实现盈利，是公司成熟度的一个重要正面信号。
    - 客户成功和支持基础设施显示部署深度真实，而不是表层试点活动。
  topRisks:
    - 上一次已确认估值锚点已经过时，相比当前上市可比公司倍数显得偏贵。
    - 公开证据没有披露留存、集中度、毛利率或合并现金生成能力。
    - 监管、隐私和临床治理开销意味着公司应相对干净的横向 SaaS 同行打折。
    - 高接触实施能增强粘性，但可能限制利润率并拖慢扩张。
    - 报销支持只对部分工作流有帮助，还不足以降低整个产品套件的风险。
  unresolvedGaps:
    - 2022 年 Series D 后的当前价格发现、老股交易估值标记或董事会估值更新。
    - 按客户队列拆分的净收入留存、总留存、流失和扩张 ARR。
    - 服务提供者系统、生命科学合作伙伴、模块和地区之间的收入集中度。
    - 合并自由现金流、债务契约、现金跑道和优先股堆叠经济性。
    - 分部毛利率，以及生命科学收入流的经济质量。
