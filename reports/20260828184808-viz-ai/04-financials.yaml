  title: Viz.ai has more than one way to grow inside the same network
  body: The most important financial takeaway is not just 2024 revenue. It is that Viz.ai appears to reuse the same installed hospital workflow surface for service-line expansion, documentation workflows, and life-sciences partnerships.
  claimRefs:
