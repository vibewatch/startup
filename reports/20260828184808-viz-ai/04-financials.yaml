  title: Unit economics table
  columns:
  - Driver
  - Public proof point
  - Why it matters economically
  - Confidence
  - Commercial limit
  - What to verify privately
  rows:
  - - Installed hospital network
    - Nearly 2,000 hospitals by Jan 2026; 2,000+ on current life-sciences page
    - Large installed base can support expansion without full new-logo cost each time
    - Medium-high
    - Hospital count does not show depth of paid adoption
    - Paid modules, active sites, and renewal depth
  - - High workflow engagement
    - 90% click-through rate on alerts and workflows
    - Suggests daily usage and renewal relevance
    - Medium-high
    - Engagement alone does not equal monetization
    - Engagement by product, specialty, and customer cohort
  - - Service-line breadth
    - Neuro, cardio, vascular, radiology, oncology, Assist
    - More surfaces to cross-sell into the same enterprise customer
    - High
    - Breadth can increase implementation burden
    - Attach rates and deployment timelines by service line
  - - Life-sciences outcomes claims
    - 2.3x follow-up referrals and 14% increase in treated patients in examples
    - Helps pharma justify workflow-partnership budgets
    - Medium
    - Case-study economics may not generalize
    - Partner ACV, expansion, and retention by disease area
  - - Documentation and coding support
    - Viz Assist promises suggested billing codes and revenue recovery
    - Operational payback can unlock budgets beyond radiology alone
    - Medium
    - Claims are marketing until revenue-recovery outcomes are audited
    - Observed ROI from live customers
  - - Selective reimbursement
    - Viz HCM payment path beginning 2025
    - Reimbursed modules can accelerate adoption in some specialties
    - High
    - Does not generalize to whole platform
    - Revenue tied to reimbursed workflows versus non-reimbursed ones
  notes: These are commercialization drivers, not audited unit-economics disclosures.
