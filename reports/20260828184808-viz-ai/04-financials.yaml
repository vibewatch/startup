tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Public evidence
  - Primary buyer
  - Why it should monetize
  - Current visibility
  - Key diligence ask
  rows:
  - - Provider platform subscriptions
    - Hospital footprint, service-line pages, and profitability release
    - Health systems and hospital networks
    - Core workflow layer across multiple urgent-care and specialty pathways
    - High on existence, low on contract size
    - Provide ARR, ACV, and renewal by health-system cohort
  - - Service-line expansion inside existing accounts
    - Cardio, neuro, radiology, vascular, oncology, and Assist pages
    - Existing provider customers
    - Cross-sell raises wallet share without starting a new enterprise sale from zero
    - High on strategy, low on attach rates
    - Show module attach, ARPU lift, and upsell win rates
  - - Life-sciences workflow partnerships
    - Life-sciences page plus January 2026 release
    - Pharma and medtech companies
    - Reuses embedded clinical surface for patient identification and therapy workflows
    - High on existence, low on revenue contribution
    - Break out partner count, ACV, retention, and revenue mix
  - - Documentation and coding optimization via Viz Assist
    - Assist page and launch release
    - Provider operations, service lines, and clinicians
    - Operational ROI can justify spend even when direct reimbursement is weak
    - Medium; commercial promise is visible but monetization structure is not
    - Disclose packaging, pricing, and actual revenue-recovery results
  - - Selective reimbursement-supported specialty modules
    - Medical Economics on Viz HCM payment
    - Providers and cardiology programs
    - Some modules may have cleaner billing logic and faster budget approval
    - Medium; pathway exists for HCM, not for every module
    - Separate reimbursement-led revenue from broader workflow-led revenue
  notes: The public record is strongest on how Viz.ai intends to monetize and weakest on how much each stream contributes today.
