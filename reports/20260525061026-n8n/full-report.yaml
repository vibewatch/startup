  - id: TE003
    title: Technology and Operating Architecture
    columns:
      - Layer / Component
      - Role
      - Technology / Dependency
      - Risk
    rows:
      - - Visual Workflow Editor (Frontend)
        - WYSIWYG canvas for workflow creation; converts graph to JSON workflow definition
        - Vue.js; modern browser required; REST API submission to backend
        - Learning curve for complex workflows; UI responsiveness may degrade at very large (1,000+ node) graphs
      - - Workflow Execution Engine (Backend)
        - Topological execution of nodes; data passthrough; error handling; retry logic
        - Node.js + TypeScript; in-memory execution per run; optional queue mode for distributed execution
        - >-
          Single-threaded Node.js event loop in single-instance mode creates concurrency ceiling; queue mode required
          for production scale
      - - Message Broker (Queue Mode)
        - Decouples trigger receipt from workflow execution; maintains pending execution queue; prevents duplicate runs
        - Redis (BullMQ library); required in queue mode; must be HA-configured for production
        - Redis becomes single point of failure if not clustered; encryption key must match across all workers
      - - Persistence Layer
        - Stores workflow definitions, execution history, credentials (encrypted), user data, and variables
        - PostgreSQL 13+ (production); SQLite (dev/test only; unsupported in queue mode); shared by all workers
        - Encryption key compromise decrypts all stored credentials; key rotation operational complexity
      - - Worker Instances
        - Execute workflow graphs fetched from PostgreSQL; report completion to Redis; horizontally scalable
        - Independent Node.js processes; same codebase as main; scaling by adding/removing worker containers
        - Binary data cannot use local filesystem in queue mode; requires S3 external storage
      - - Community Node Runtime
        - Executes third-party npm packages as workflow nodes; no sandboxing boundary
        - npm registry; arbitrary Node.js code with full process access (env vars, filesystem, network)
        - >-
          No isolation from n8n runtime; malicious node can exfiltrate all decrypted credentials; supply-chain attack
          vector
      - - AI Orchestration Layer
        - LLM invocation, tool-calling, memory, RAG, and multi-step agent loops within workflow graphs
        - >-
          LangChain.js (native integration); OpenAI/Anthropic/Google APIs; vector DBs (Pinecone, Weaviate, Milvus);
          local LLMs via Ollama
        - LLM API costs and rate limits add variable operational cost; local LLM integration requires GPU infrastructure
    notes: >
      Architecture details sourced from official n8n documentation (docs.n8n.io) and the jimmysong.io deep dive analysis
      (2026). Queue mode dependency diagram reflects n8n's publicly documented recommended production topology.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE007
      - CE019
      - CE020
      - CE021
