      - number: '7.5'
        title: Mitigations, Kill Criteria, and Diligence Asks
        blocks:
          - type: paragraph
            body: >
              Despite the severity of the risk profile, each major risk category has identifiable mitigants and
              investable monitoring indicators. The security risk is structurally manageable through network
              segmentation (air-gapping the n8n instance from the public internet), enforcing authentication on all
              webhook endpoints, disabling community nodes via N8N_COMMUNITY_PACKAGES_ENABLED=false where not required,
              and implementing regular patch cadence aligned with n8n's weekly release cycle. The introduction of
              cryptographic provenance requirements for verified community nodes (from May 2026) partially addresses the
              supply-chain vector, though unverified nodes remain installable. Enterprise deployments should integrate
              n8n credentials with HashiCorp Vault or equivalent external secret stores to limit the blast radius of an
              instance compromise. Formal SOC 2 and ISO 27001 certifications—on n8n's 2026 roadmap—would provide a
              third-party verification of control maturity that partially mitigates the compliance gap.

              For licensing risk, the key mitigant is contractual clarity: enterprise buyers should obtain a written
              commercial or Enterprise license agreement specifying permitted use, avoiding reliance on fair-code
              community interpretations. Service providers (agencies, MSPs) building client-facing automations must
              secure an Embed license. The risk of a rug pull—unilateral license tightening— is limited by the
              reputational cost to n8n of alienating its developer community but cannot be contractually prevented in
              the absence of explicit licensing commitments.

              Governance risk can be monitored via n8n's public security advisory cadence (GitHub Security Advisories),
              SOC 2 attestation progress, and community forum tone. A kill trigger would be a pattern of critical CVEs
              without architectural remediation (four or more CVSS 9+ CVEs in a 12-month window with no sandboxing
              improvement), suggesting systemic rather than incidental security debt.

              Founder and key-person risk is partially mitigated by Sequoia, Accel, and Felicis board presence, which
              typically drives succession planning conversations. Investors should diligence the depth of the CTO, CPO,
              VP Engineering, and VP Sales roles, asking for organizational charts, direct-report tenures, and
              succession plans. A kill trigger would be a voluntary departure by Oberhauser without a disclosed,
              credible successor during the 24-month post-Series C scaling phase.

              Financial opacity is mitigable only through data-room access. Required diligence items include: audited or
              reviewed income statements and balance sheets for FY2024 and FY2025; ARR and NRR by segment (cloud,
              enterprise self-hosted, OEM); top-10 customer revenue concentration; burn rate and runway calculation at
              current and target headcount; and SAP partnership financial terms (revenue guarantee, exclusivity clauses,
              termination provisions). A kill criterion is a burn multiple above 2.5× at current revenue scale with no
              credible path to below 1.5× within 18 months.

              SAP dependency risk can be monitored through SAP integration milestone delivery (Q3 2026 announced GA
              date), public SAP enterprise adoption metrics, and n8n's disclosed OEM revenue percentage. A kill trigger
              would be a SAP partnership restructuring, acquisition of a competing automation platform by SAP, or public
              dispute over embedding terms—any of which would remove the thesis-defining growth catalyst.
