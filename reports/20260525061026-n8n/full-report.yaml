      - number: '8.2'
        title: Valuation Methodology and Comparable Analysis
        blocks:
          - type: paragraph
            body: >
              Four analytical lenses converge on the same conclusion: n8n's October 2025 Series C price ($2.5B / ~$40M
              ARR ≈ 62× ARR) is materially stretched relative to both private market medians and public automation
              peers; the May 2026 SAP mark ($5.2B / >€100M ARR ≈ 50× ARR) is partially supported by continued
              hyper-growth but remains well above fundamentals-based fair value absent undisclosed unit-economics data.

              ARR Multiple Lens. The Series C implied approximately 62× forward ARR. Among public SaaS companies
              entering 2026, the median EV/Revenue multiple is 6–7× (Windsor Drake, Livmo 2026). The top decile of
              public SaaS — companies like ServiceNow and CrowdStrike — commands 15–20× on deeply embedded
              mission-critical workflows, NRR above 125%, and substantial operating profitability. For private SaaS, the
              2026 median transaction multiple in the lower-middle market is 4–5× ARR; top-quartile AI-native or
              hyper-growth private SaaS achieves 7–12× in competitive processes. Even at the very top of the private
              AI-native SaaS range (15–20×), n8n's 62× multiple is 3–4× above the achievable premium. Open-source SaaS
              businesses, absent demonstrated strong network-effects, typically trade at a 20–30% discount to
              closed-source peers — which would compress, not expand, the implied fair-value range.

              Public Peer Discount-to-Multiple Lens. The closest public pure-play peer is UiPath (NYSE: PATH), the
              world's largest automation platform, which reported ARR of $1.853B and revenue of $1.611B for FY2026
              (ended January 31, 2026) with 11% ARR growth. UiPath's enterprise value of $4.12B implies approximately
              2.2× EV/ARR as of May 2026. Even applying a generous 15× growth premium for n8n's superior ARR growth
              rate, the implied fair-value multiple would be approximately 33× — still 47% below the Series C 62×. The
              only arithmetic pathway to 62× requires either assuming permanent 3–5× above the maximum justified private
              SaaS premium, or assigning large option value to the SAP OEM channel and AI agent orchestration category
              leadership that is not yet monetised.

              Private Market Comp Lens. Zapier reached $420M ARR in Q1 2026 with a last known secondary valuation of
              approximately $5B, implying approximately 12× ARR — at 7× n8n's ARR scale. Workato's last institutional
              round in 2022 at $5.7B against an estimated $200M ARR implied approximately 28×, a multiple that has
              likely compressed materially since under current private SaaS market conditions. The private SaaS median
              of 4–5× establishes the floor for typical private transactions. n8n is priced at 4–13× above these
              comparables, reflecting a "category premium" for the AI agent orchestration positioning and the
              bidding-war dynamics of the Series C.

              Scenario Analysis. Under a base case in which n8n achieves $200M ARR by end-2026 at a 25× forward multiple
              (plausible for a category-leader growing >100% annually), the implied valuation would be approximately $5B
              — roughly in line with the SAP mark and providing modest support for Series C investors. A bull case of
              $300M ARR and 30× multiple implies $9B, well above the SAP mark and delivering a 3.6× return from Series C
              entry within roughly 18 months of close. A bear case of $80M ARR and 10× multiple implies $0.8B — a 68%
              step-down from Series C, consistent with a down-round or distressed acquisition, triggered by ARR
              deceleration, competitive displacement, or AI-hype cycle correction. The base case is the most likely
              outcome given current ARR trajectory, but the bull case requires successful SAP channel execution that
              remains unproven.
