      - number: '1.3'
        title: Funding History, Valuation, and Investors
        blocks:
          - type: paragraph
            body: >
              n8n has raised approximately $240M in total disclosed funding across four rounds from 2020 through 2025.
              The company's fundraising trajectory reflects rapid acceleration following its 2022 AI pivot.

              The seed round of $1.5M in 2020 was led by Sequoia Capital (its first European investment under the
              Sequoia Scout program) and firstminute capital, providing initial runway to build out the core team and
              product. The Series A of $12M in 2021 was led by Felicis Ventures, which has continued to participate in
              every subsequent round. In March 2025, Highland Europe led a €55M (~$60M) Series B—n8n's first
              institutional growth round—at a valuation of approximately €250M ($270M), with HV Capital, Sequoia,
              Felicis, and Harpoon co-investing.

              The inflection point came in October 2025 when n8n announced a $180M Series C led by Accel, bringing the
              post-money valuation to $2.5B—roughly a 9x step-up from the Series B valuation in under eight months. The
              round included Meritech, Redpoint, Evantic, and Visionaries Club as new institutional investors, alongside
              strategic participation from NVentures (NVIDIA's venture capital arm) and T.Capital (Deutsche Telekom's
              venture division). All prior institutional backers—Sequoia, Felicis Ventures, Highland Europe, and HV
              Capital—made follow-on investments, signaling continued conviction. Proceeds are targeted at AI capability
              expansion, US market penetration, and ecosystem development.

              The company opened offices in New York and London in 2025 as part of the Series B deployment plan, and the
              US already accounts for over half of n8n's user base. DTCP (Deutsche Telekom Capital Partners)
              participation as separate from T.Capital has not been independently confirmed in primary sources and
              should be treated as unverified.
