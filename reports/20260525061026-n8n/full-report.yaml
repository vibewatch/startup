      - number: '7.4'
        title: Financial Opacity, Founder Dependency, and Execution Risk
        blocks:
          - type: paragraph
            body: >
              n8n is a private company with no obligation to publish audited financial statements. Revenue estimates
              across independent sources range from ~$40M to $169.6M ARR for 2025–2026—a 4× discrepancy that illustrates
              the opacity problem. Sacra's canonical model estimates $40M ARR for early 2025; Growjo and CompWorth cite
              figures up to $170M based on employee-count models. n8n's CEO Jan Oberhauser confirmed revenues are
              "ripping" in a December 2025 interview but has not published audited figures. The 2025 annual filing at UK
              Companies House has not yet been submitted as of the runDate (May 2026), consistent with UK filing
              timelines but providing no incremental independent verification. Without disclosed financials, unit
              economics (CAC, LTV, gross margin by segment, burn rate) cannot be independently verified. Sacra estimates
              >75% gross margins, consistent with SaaS norms, but this is a model assumption rather than a disclosed
              figure.

              The headcount expansion from ~109 employees in 2024 to 800+ in 2026—a 7× increase—implies a burn rate that
              may materially exceed recognized revenue in the near term. Total capital raised is approximately $240M
              (through Series C) plus SAP's undisclosed strategic investment. If headcount growth has been primarily
              funded by the Series C ($180M, October 2025), and payroll for 800 employees at market rates in
              Berlin/SF/remote exceeds $80–100M/year before R&D, GTM, and infrastructure costs, the company's runway is
              estimated at 18–30 months from the Series C close—contingent on revenue acceleration covering the delta.
              Revenue growth has been exceptional (10× in 2025), but the comparator base was low, and the trajectory
              cannot be independently verified. Any deceleration in ARR growth or increase in competitive pricing
              pressure could shorten effective runway.

              Jan Oberhauser is the company's sole founder, public face, and strategic decision-maker. In a December
              2025 interview with tech.eu, Oberhauser explicitly acknowledged succession risk: "I am honestly aware that
              probably at some point post IPO, maybe at some point it would make sense for somebody else." Sequoia
              Capital's investment podcast confirmed the company's AI pivot, community strategy, and competitive moat
              were all shaped by Oberhauser's singular vision. His background in visual effects (not enterprise
              software) means the executive team's institutional depth in B2B SaaS scaling—sales leadership, enterprise
              compliance, international GTM, and capital markets preparation—has not been independently assessed. If
              Oberhauser were to depart, face health issues, or lose focus, the platform's narrative and strategic
              execution could be materially impaired during a critical enterprise-adoption phase.

              GTM and customer concentration risk is partially obscured by the opacity. n8n's cloud channel mix is
              estimated as 55% cloud subscriptions, 30% enterprise self-hosted licenses, and 15% OEM/embedded
              partnerships (Sacra). The SAP embedded partnership, while not publicly sized, likely represents a
              disproportionate future revenue share given the scale of SAP's enterprise customer base. Heavy
              concentration in one strategic partner creates bilateral negotiation risk; SAP has both the leverage and
              the incentive to renegotiate terms as n8n's revenue dependency on the partnership grows. Enterprise
              customer count (~1,400 as of May 2026) is encouraging, but average contract value, top-10 customer
              concentration, churn by segment, and NRR are not disclosed. The Felicis profile noted the "bottom-up
              builder-to-enterprise" go-to-market is the intended flywheel, but the conversion efficiency at the top end
              is unverifiable.
