  - id: FE001
    title: n8n Product Architecture Stack
    type: stack
    layout: wide
    summary: >
      n8n's layered product architecture from user-facing visual editor through execution engine, data persistence, and
      external integrations.
    data:
      layers:
        - label: User Interface Layer
          detail: >-
            Vue.js visual canvas; drag-and-drop node editor; inline expression syntax; sub-workflow management;
            execution history viewer.
          items:
            - Visual canvas workflow builder (Vue.js)
            - Node configuration panels with dynamic data mapping
            - Expression editor (JS-like inline transforms)
            - Execution log viewer and debug mode
            - Template library (10,000+ community templates)
        - label: Workflow Execution Layer
          detail: >-
            Node.js/TypeScript engine executing topological node graphs; supports single-instance mode and queue mode
            with Redis-backed workers.
          items:
            - 'Single-instance mode: all execution in main Node.js process'
            - 'Queue mode: Redis (BullMQ) + distributed worker pool'
            - 'Worker instances: independent Node.js processes (horizontal scaling)'
            - Error handling with per-node retry and error-branch routing
            - Sub-workflow call and response (modular reuse)
        - label: Integration and Extension Layer
          detail: >-
            400+ official integration nodes, 500+ community npm packages, HTTP Request node for arbitrary APIs, and 70+
            LangChain AI nodes.
          items:
            - 400+ official integration nodes (SaaS, database, messaging, AI providers)
            - 500+ community npm packages (n8n-nodes-* naming convention)
            - HTTP Request node (arbitrary REST/GraphQL without dedicated node)
            - 70+ LangChain AI nodes (LLM, memory, RAG, tool-calling, vector DBs)
            - Custom JavaScript/Python code nodes with npm access
        - label: Persistence and Security Layer
          detail: >-
            PostgreSQL for workflow and execution data; Redis queue; encrypted credential vault; external secret store
            integration on Enterprise.
          items:
            - PostgreSQL 13+ (workflow definitions, execution history, credentials)
            - Credential vault (AES-256 encryption, single shared key across workers)
            - External secret store (HashiCorp Vault — Enterprise tier)
            - Redis (BullMQ queue, execution coordination)
            - S3-compatible object storage (binary data in queue mode)
        - label: Deployment and Governance Layer
          detail: >-
            Four deployment modes; Git-based version control; multi-environment; SSO/RBAC; audit logs; air-gapped
            support for regulated industries.
          items:
            - 'n8n Cloud (managed SaaS: Starter/Pro/Business/Enterprise)'
            - Self-hosted Community (free; Sustainable Use License)
            - Self-hosted Enterprise (paid license; SSO, RBAC, audit logs)
            - Air-gapped Enterprise (offline deployment; no external network)
            - Multi-environment (dev/staging/prod) + Git version control
    approximationNotes: >
      Layer arrangement reflects logical product zones, not physical deployment topology. Community node package count
      (500+) is an estimate based on npm search results and gitnux.org/worldmetrics.org statistics; exact count varies
      with ecosystem activity.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE007
      - CE010
      - CE011
      - CE017
      - CE018
      - CE021
      - CE022
