  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Pricing Architecture
        blocks:
          - type: paragraph
            body: >
              n8n generates revenue through three distinct mechanisms: cloud subscription tiers, enterprise term
              licenses for self-hosted deployments, and an early-stage embedded/OEM channel in which third-party
              platforms (most prominently SAP) integrate n8n's automation engine natively.

              The cloud product charges exclusively on workflow execution count—one complete workflow run from trigger
              to finish regardless of internal step count. As of 2026, cloud plans are Starter at $24/month for 2,500
              executions, Pro at $60/month for 10,000 executions, and Business at $800/month for 40,000 executions.
              Enterprise cloud pricing is custom. Annual prepayment reduces cloud plan costs by 17–20%; enterprise
              accounts running above 250,000 monthly executions typically negotiate 20–30% further discounts on annual
              contracts. The execution model differs structurally from step-counting competitors such as Zapier: a
              ten-node workflow running 1,000 times costs 1,000 executions on n8n versus 10,000 tasks on Zapier, making
              n8n materially cheaper for complex or AI-augmented automations. This pricing advantage drives community
              and SMB adoption but caps per-user revenue at the execution tier ceiling.

              The Enterprise License tier—available for self-hosted deployments—unlocks SSO/SAML, audit logs, RBAC,
              version control, external secrets management, and worker mode. Without public pricing on this tier, the
              range has been reported in community sources as approximately $15,000–$50,000+/year. n8n transitioned from
              a workflow-count and user-count hybrid model to the current execution-only model in 2025, a change that
              generated community discussion about cost predictability at scale.

              The self-hosted Community Edition is free under the Sustainable Use License for internal commercial use,
              with infrastructure costs of roughly $3–7/month on a basic VPS or $20–150/month for production-grade
              self-hosting. This tier generates no direct license revenue for n8n but feeds the top of the funnel:
              community members self-hosting on free tier convert to cloud or enterprise at some rate. Typical
              open-source SaaS cloud conversion rates benchmark at 2–10% of self-hosted users, implying that the vast
              majority of n8n's estimated 1.7 million monthly active developers (as of May 2026) never pay.

              The SAP partnership, announced May 2026, adds a third revenue channel with direct commercial significance.
              Under the multi-year agreement, n8n's workflow engine will be embedded inside Joule Studio, SAP's
              agent-building environment. This is an OEM or embedded-license model that, if structured as revenue-share
              or per-deployment fees, could materially expand n8n's addressable monetization without incrementally
              increasing cloud execution costs.
