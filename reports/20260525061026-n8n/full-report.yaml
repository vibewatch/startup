  - id: TV005
    title: Thesis-Break and Kill Triggers Table
    columns:
      - Trigger
      - Threshold / Event
      - Transmission to Thesis
      - Action Implication
    rows:
      - - ARR growth deceleration
        - Two consecutive quarters of <2× year-over-year ARR growth at any point before end-2026
        - >-
          Series C 62× multiple was priced for 3–5× annual ARR growth; any deceleration to <2× materially impairs the
          bull case and makes the base case marginal
        - Downgrade to SELL/AVOID; reassess at new multiple implied by decelerated ARR trajectory
      - - NRR disclosed below 100%
        - >-
          First disclosed NRR figure (e.g., in IPO filing or investor update) below 100%, indicating net revenue
          contraction from existing customers
        - >-
          Below-100% NRR signals poor product retention and would imply the $40M ARR base was not durable; fundamentally
          breaks the expansion-revenue thesis
        - Exit or decline participation in any subsequent round at current or higher valuation
      - - SAP channel failure or termination
        - >-
          SAP announces delay of Joule Studio GA beyond Q4 2026, terminates or renegotiates the commercial agreement, or
          acquires a competing orchestration platform
        - >-
          The SAP OEM channel is the primary near-term revenue multiplier that justified the $5.2B mark; its absence
          collapses the bridge between $5.2B and a fundamentals-supportable valuation
        - Downgrade; valuation reverts to pure ARR-growth model, which implies $3–5B at best on base-case ARR
      - - Hyperscaler free-tier competitive entry
        - >-
          Microsoft, Google, or AWS announces a comparable AI workflow orchestration product at zero marginal cost
          bundled with existing enterprise contracts (similar to Power Automate bundled with M365)
        - >-
          n8n's structural advantage over Zapier is price; if a hyperscaler commoditises at zero price, n8n's pricing
          moat disappears and its community moat may not be sufficient to retain enterprise deals
        - Increase required NRR threshold to >130% and reduce acceptable forward multiple from 25× to 15×
      - - Governance or management break
        - >-
          Jan Oberhauser departs or takes extended leave without a publicly named, credible successor within 24 months
          of Series C close (by October 2027); or a named C-suite hire of CFO/CTO contradicts the current financial
          claims
        - >-
          Sole-founder-dependent business without named C-suite creates key-person risk at the single most important
          execution juncture (moving from PLG to enterprise sales motion)
        - Place on WATCH with 60-day deadline for management disclosure; reassess confidence rating downward
    claimRefs:
      - CV033
      - CV027
      - CV029
      - CV040
    notes: >-
      Kill triggers are early-warning indicators; thresholds are illustrative and should be recalibrated as actual
      financial disclosures become available.
    sourceRefs:
      - SV001
      - SV007
      - SV009
      - SV017
      - SV026
  - id: TV006
    title: Final Diligence Asks Table
    columns:
      - Topic
      - Missing Evidence
      - Why It Matters
      - Owner / Diligence Path
    rows:
      - - Net Revenue Retention (NRR)
        - NRR by customer cohort vintage for at least 3 annual cohorts; gross revenue retention (GRR) separately
        - >-
          NRR is the single strongest predictor of SaaS valuation — a company with NRR above 120% is worth 2–3× more
          than one with NRR below 100% on equivalent ARR; without it, the 62× multiple cannot be assessed
        - >-
          Request from n8n in data room; if unavailable, flag as high-severity gap and apply 30% diligence discount to
          any valuation offer
      - - Gross Margin by Product Channel
        - >-
          Cloud subscription gross margin; enterprise license gross margin; SAP/OEM embedded margin; blended gross
          margin
        - >-
          AI agent workloads generate disproportionate execution compute costs; if cloud gross margin is below 65%, the
          ARR-multiple framework overstates intrinsic value relative to SaaS peers operating at 80%+
        - Financial data room; compare against Sacra's estimated >75% benchmark for cross-validation
      - - SAP Commercial Agreement — Minimum Guaranteed Revenue
        - >-
          Minimum committed revenue, revenue-sharing structure, exclusivity clauses, and termination rights under the
          multi-year SAP commercial agreement
        - >-
          If the SAP deal is a best-efforts OEM with no minimum commitment, it provides less valuation support than a
          take-or-pay arrangement; the $5.2B SAP mark is materially affected by this distinction
        - Legal and commercial data room; request from n8n with NDA; validate SAP's accounting treatment
      - - Burn Rate and Runway
        - >-
          Monthly cash burn rate at current headcount (923+ employees at end-2025); estimated runway from total cash
          raised; FY2025 operating cash flow
        - >-
          At 923 employees with fully-loaded costs of ~$100–130K/year, annualised payroll burn exceeds $92M before
          infrastructure and overhead; insufficient runway would force a dilutive raise or covenant breach
        - >-
          Financial data room; cross-reference with Companies House filings when available; triangulate with headcount
          and published salary data
      - - Top-10 Customer Revenue Concentration
        - >-
          Revenue breakdown by top-10 customers; single largest customer as % of ARR; ARR from Fortune 500 vs.
          mid-market vs. SMB
        - >-
          If any single customer exceeds 10% of ARR, it creates a concentration risk that would reduce the effective
          valuation multiple by 20–40% (Livmo 2026 analysis); SAP becoming both investor and customer creates a
          potential dual concentration risk
        - >-
          Financial data room; confirm whether SAP's embedded deployment counts as ARR and how it is recognised; request
          enterprise customer list with anonymised ARR bands
    claimRefs:
      - CV026
      - CV031
      - CV042
    notes: >-
      Diligence asks are prioritized by information asymmetry; items may be partially addressed by future public
      disclosures.
    sourceRefs:
      - SV001
      - SV011
      - SV025
      - SV023
