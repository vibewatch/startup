  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Core Architecture
        blocks:
          - type: paragraph
            body: >
              n8n is a fair-code workflow automation and AI-agent orchestration platform built on Node.js and
              TypeScript. The backend workflow engine executes node-based graphs in topological order, passing
              structured JSON data between nodes at each step. The frontend visual editor is built with Vue.js and
              presents a drag-and-drop canvas where users connect trigger nodes (webhooks, schedules, polling) to action
              nodes (API calls, data transformations, database writes, AI model invocations) to form directed acyclic
              workflow graphs. Sub-workflows allow modular reuse of workflow logic, and the expression engine—a
              JavaScript-like syntax—enables inline dynamic data mapping between nodes without requiring a code node.
              Custom JavaScript or Python code nodes grant developers full programmatic access to the Node.js runtime,
              including npm package imports.

              The platform ships with more than 400 official integration nodes maintained by the n8n team, covering
              mainstream SaaS APIs (Salesforce, Slack, Google Workspace, GitHub, Stripe, etc.), databases, messaging
              queues, and AI model providers. Beyond official nodes, a community ecosystem on npm publishes packages
              following the "n8n-nodes-*" naming convention, bringing the total installable integration surface to over
              500 community packages as of 2026. Workflow templates—more than 10,000 pre-built and
              community-shared—lower the time-to-first-automation significantly.

              The execution model operates in two modes. Single-instance mode runs all workflow executions within the
              main Node.js process, suitable for development and small production deployments. Queue mode—recommended
              for production at scale—decouples trigger handling from execution by routing workflow job IDs through a
              Redis message broker to an independently scalable pool of worker instances. Each worker is its own Node.js
              process that fetches workflow definitions from a shared PostgreSQL database, executes the workflow, writes
              results back to PostgreSQL, and signals completion to Redis. Workers can be added or removed dynamically
              without downtime, enabling horizontal scaling. The shared encryption key requirement across main and
              worker instances is a security dependency that must be managed carefully in multi-node deployments.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
