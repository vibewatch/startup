      - number: '4.2'
        title: Growth Trajectory and Financial Scale Estimates
        blocks:
          - type: paragraph
            body: >
              n8n's ARR growth trajectory is the defining financial feature of the company and the primary justification
              for its valuation multiple. The publicly available data points form a coherent upward arc: $7.2M ARR in
              June 2024 (GetLatka), $26.5M ARR in July 2025 (GetLatka milestone), and $40M+ ARR reported at the August
              2025 Series C term sheet signing (confirmed by Sifted, Bloomberg, and corroborated by the company
              declining to deny). n8n itself stated that revenue grew tenfold in the year leading to the October 2025
              close. At the May 2026 SAP strategic investment, the company disclosed "over €100M" in ARR—a figure
              representing roughly 2.5x growth in approximately nine months. Independent analyst projections for
              end-2026 ARR range from $60M to $80M conservatively to the company-implied figure of over €100M.

              Alongside ARR, user growth signals validate the funnel size. Active users grew to 230,000+ by October 2025
              at the Series C. By May 2026 the monthly active developer and builder community had expanded to 1.7
              million—a metric that includes free self-hosted users and community contributors alongside cloud
              subscribers. The enterprise customer count showed a definitional shift: 3,000+ enterprise customers were
              reported in October 2025, narrowing to 1,400+ in May 2026. This apparent decline likely reflects a
              redefinition of "enterprise" toward larger, higher-ACV accounts rather than actual gross churn, but the
              discrepancy is unconfirmed and represents a diligence question. At $40M ARR across 3,000+ enterprise
              accounts, implied average contract value is approximately $13,300/year—characteristic of mid-market
              accounts. If the 1,400 enterprise count at €100M ARR is accurate, implied ACV has grown to approximately
              €71,400—a substantial uplift that would suggest strong expansion revenue within the cohort.

              n8n's headcount growth provides an independent signal of financial trajectory and cost base. Revelio Labs
              data shows 228 employees in 2023, 423 in 2024, and 923 by end-2025—a 74.3% year-on-year increase. Active
              job postings reached 406 in 2025, a 164% increase from 40 in 2024. If hiring pace continued into 2026 at
              any fraction of prior rates, headcount at the run date likely exceeds 1,000 employees. At an average
              fully-loaded employment cost estimated at $100,000–$130,000 per year for a software company skewed toward
              European salaries plus benefits, 1,000 employees imply a payroll-driven burn floor of approximately
              $8–10M/month before infrastructure, marketing, and overhead. Public cost data remains insufficient to
              triangulate burn with confidence.

              The valuation trajectory maps the capital market's assessment. The Series B in March 2025 valued n8n at
              approximately €300M ($355M). The Series C in October 2025 valued the company at $2.5B—a 7–8x step-up in
              seven months. The SAP investment in May 2026 valued n8n at $5.2B, doubling valuation in under seven
              months. This pace of valuation appreciation is exceptional even within European AI startup benchmarks and
              reflects concentrated investor conviction about category dominance, with Accel, Sequoia, Felicis, Highland
              Europe, NVIDIA, Deutsche Telekom, and now SAP all holding positions. The flip side of this trajectory is
              that the implied ARR multiple—approximately 62x at Series C and approximately 50x at the SAP deal (based
              on disclosed €100M ARR)—remains at the upper extreme of private technology valuations globally and well
              above comparable public automation companies.
