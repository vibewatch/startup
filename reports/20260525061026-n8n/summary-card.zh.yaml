summary:
  headline: n8n 是欧洲增长最快的企业自动化平台之一，社区护城河强、AI 原生定位清晰，也拿到机构背书；但 Series C 估值偏高，单位经济模型又缺失，更适合纪律性观察，而不是立即买入。
