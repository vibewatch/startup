    title: Recommendation Logic Flow — From Evidence to WATCH Stance
    type: flow
    layout: wide
    summary: >
      Chain from market scale, ARR growth proof, risks, and valuation inputs to the
      WATCH/TRACK recommendation, showing where evidence supports the thesis and where
      diligence gaps prevent a BUY.
    data:
      nodes:
        - id: market-scale
          label: "Large TAM\n($100B+ hyperautomation)"
          detail: "Workflow, iPaaS, low-code, AI orchestration combined TAM; structural growth above 10% CAGR"
          tone: positive
          claimRefs: [CV001]
        - id: arr-growth
          label: "Hyper-Growth ARR\n(10× YoY to Oct 2025; 2.5× to May 2026)"
          detail: "~$40M → >€100M in 7 months; supports category momentum thesis"
          tone: positive
          claimRefs: [CV007, CV008]
        - id: sap-channel
          label: "SAP OEM Channel\n(Joule Studio embed, 1,400+ enterprise)"
          detail: "Unmonetised revenue multiplier; SAP at $5.2B mark validates category leadership"
          tone: positive
          claimRefs: [CV004, CV029]
        - id: valuation-stretch
          label: "62× ARR Multiple\n(Series C; 3–4× above AI-native SaaS peak)"
          detail: "Only justified by option value and growth premium; bidding war inflated price"
          tone: negative
          claimRefs: [CV010, CV023]
        - id: absent-economics
          label: "Absent Unit Economics\n(No NRR, Margin, Burn, Concentration)"
          detail: "No audited data; all unit economics must be estimated; diligence impossible on fundamentals alone"
          tone: negative
          claimRefs: [CV026]
        - id: competitive-risk
          label: "Competitive Pressure\n(Microsoft, Zapier, hyperscalers)"
          detail: "Power Automate bundled; Zapier at 7× n8n scale; AI-native alternatives proliferating"
          tone: negative
          claimRefs: [CV035]
        - id: recommendation
          label: "WATCH / TRACK\n(Not BUY at Series C price)"
          detail: "Upgrade triggers: ARR >$200M, NRR >115%, gross margin >70%, SAP uptake confirmed"
          tone: neutral
          claimRefs: [CV032]
      edges:
        - from: market-scale
          to: recommendation
          label: "supports"
        - from: arr-growth
          to: recommendation
          label: "supports partially"
        - from: sap-channel
          to: recommendation
          label: "option value"
        - from: valuation-stretch
