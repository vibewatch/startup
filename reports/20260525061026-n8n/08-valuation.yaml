  evidenceGaps:
    - id: GV001
      topic: "Net Revenue Retention — not disclosed"
      description: >
        n8n has not disclosed NRR, GRR, or customer cohort retention data in any public filing,
        press release, or investor document as of 2026-05-25. NRR is the single most important
        metric for SaaS valuation confidence. Without it, no external investor can assess whether
        the $40M ARR base is durable, expanding, or contracting. All valuation scenarios in this
        chapter assign probability weights without NRR confirmation.
      relatedQuestionRefs: [QV022, QV024, QV027]
      relatedTableRefs: [TV004]

    - id: GV002
      topic: "Gross margin by product channel — not disclosed"
      description: >
        n8n has not disclosed gross margins for cloud subscriptions, enterprise licenses, or OEM
        embedded partnerships. Sacra estimates blended gross margin above 75%; however, AI agent
        workloads may compress cloud gross margins as compute costs scale disproportionately with
        execution volume. Without channel-level margin data, operating leverage estimates are
        entirely benchmark-derived.
      relatedQuestionRefs: [QV022]

    - id: GV003
      topic: "SAP commercial agreement terms — not disclosed"
      description: >
        The commercial terms of the multi-year SAP agreement (minimum guaranteed revenue, revenue
        share, exclusivity, termination rights, and accounting treatment of SAP-channel ARR) are
        not publicly disclosed. These terms are material to valuation: a take-or-pay OEM deal
        provides significantly more valuation support than a best-efforts partnership. The $5.2B
        SAP mark is materially affected by which structure was agreed.
      relatedQuestionRefs: [QV026]

    - id: GV004
      topic: "Burn rate and operating cash flow — not disclosed"
      description: >
        No operating cash flow, burn rate, or annual spend data has been disclosed. At 923 employees
        by end-2025 with fully-loaded costs estimated at $100–130K/year, payroll alone implies
        $92–120M+ annual burn before infrastructure and overhead. Without confirmed burn, the $180M
        Series C runway estimate is uncertain and could range from 18 to 36 months depending on
        growth-related hiring pace.
      relatedQuestionRefs: [QV022]

    - id: GV005
      topic: "Customer concentration and top-10 revenue breakdown — not disclosed"
      description: >
        Revenue breakdown by top-10 customers, single largest customer as percentage of ARR, and
        the proportion of ARR from Fortune 500 vs. mid-market vs. SMB has not been disclosed.
        With SAP as both investor and potential OEM channel partner, dual customer-investor
        concentration risk is a novel governance consideration that warrants explicit diligence.
      relatedQuestionRefs: [QV022, QV027]
