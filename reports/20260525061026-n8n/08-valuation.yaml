localEvidence:
  researchQuestions:
    - id: QV001
      question: "Did n8n close a $180M Series C at a $2.5B post-money valuation in October 2025, led by Accel?"
      type: verification
      targets: ["contentRequirements/2"]
      status: answered
      answerSummary: "Confirmed by multiple independent sources including Sifted, Bloomberg, CRN, PitchBook, and n8n's own blog post."

    - id: QV002
      question: "Did SAP make a strategic investment in n8n at a $5.2B valuation in May 2026?"
      type: verification
      targets: ["contentRequirements/2"]
      status: answered
      answerSummary: "Confirmed by Highland Europe press release, n8n blog, TechFundingNews, and Morningstar PR newswire."

    - id: QV003
      question: "Was n8n's ARR reported as exceeding $40M at the Series C term sheet signing in August 2025?"
      type: verification
      targets: ["contentRequirements/2"]
      status: answered
      answerSummary: "Confirmed by Sifted and Bloomberg reporting; n8n declined to confirm but acknowledged 10× YoY revenue growth."

    - id: QV004
      question: "Was n8n's ARR disclosed as exceeding €100M at the SAP strategic investment in May 2026?"
      type: verification
      targets: ["contentRequirements/2"]
      status: answered
      answerSummary: "Confirmed by Highland Europe press release and TechFundingNews coverage of the SAP deal."

    - id: QV005
      question: "Did Insight Partners make a competing offer of approximately $2.9–3.0B pre-money during the Series C bidding war?"
      type: verification
      targets: ["contentRequirements/2"]
      status: answered
      answerSummary: "Confirmed by Sifted pre-announcement reporting that Insight offered just under $3B; Business Times and Bloomberg corroborated the bidding war."

    - id: QV006
      question: "What is UiPath's EV/ARR multiple as of May 2026?"
      type: quantification
      targets: ["contentRequirements/4"]
      status: answered
      answerSummary: "UiPath EV of $4.12B / ARR of $1.853B (FY2026 filing) = approximately 2.2× EV/ARR; confirmed by ir.uipath.com FY2026 results and stockanalysis.com."

    - id: QV007
      question: "What is the private SaaS transaction multiple median in 2026?"
      type: quantification
      targets: ["contentRequirements/4"]
      status: answered
      answerSummary: "Median private SaaS transaction multiple is 4–5× ARR in 2026 per Livmo and Windsor Drake analysis; top-quartile AI-native SaaS reaches 7–12×."

    - id: QV008
      question: "What is n8n's implied ARR multiple at the Series C ($2.5B post-money, ~$40M ARR)?"
      type: quantification
      targets: ["contentRequirements/2"]
      status: answered
      answerSummary: "$2.5B / $40M = 62.5× ARR; pre-money valuation of ~$2.3B / $40M ≈ 58× (Sifted pre-announcement); range 58–62× depending on pre- vs. post-money basis."

    - id: QV009
      question: "What is n8n's implied ARR multiple at the SAP mark ($5.2B, >€100M ARR)?"
      type: quantification
      targets: ["contentRequirements/2"]
      status: answered
      answerSummary: "$5.2B / €100M ≈ 50× ARR; a modest compression from 62× reflecting ~2.5× ARR growth in approximately 7 months."

    - id: QV010
      question: "What was Zapier's ARR and implied valuation multiple as of Q1 2026?"
      type: quantification
      targets: ["contentRequirements/4"]
      status: answered
      answerSummary: "Zapier reached $420M ARR in Q1 2026 per arr.club; last known secondary valuation approximately $5B; implies approximately 11.9× ARR — at 7× n8n's ARR scale."

    - id: QV011
      question: "What ARR would n8n need to justify the $2.5B valuation at a normalised private SaaS multiple of 20×?"
      type: quantification
      targets: ["contentRequirements/2"]
      status: answered
      answerSummary: "$2.5B / 20× = $125M ARR required; n8n only crossed €100M ARR in May 2026, seven months after the Series C; the multiple was not justified on disclosed ARR at the time."

    - id: QV012
      question: "What is the bull-case implied valuation at $300M ARR and 30× multiple?"
      type: quantification
      targets: ["contentRequirements/3"]
      status: answered
      answerSummary: "$300M ARR × 30× = $9.0B; provides 3.6× return from Series C entry at $2.5B; requires SAP channel contribution and continued hypergrowth through 2026–2027."

    - id: QV013
      question: "What is the bear-case implied valuation at $80M ARR and 10× multiple?"
      type: quantification
      targets: ["contentRequirements/3"]
      status: answered
      answerSummary: "$80M ARR × 10× = $0.8B; represents a 68% step-down from the $2.5B Series C; triggered by ARR deceleration to <2× for two consecutive quarters or competitive displacement."

    - id: QV014
      question: "What is n8n's total disclosed capital raised through May 2026?"
      type: quantification
      targets: ["contentRequirements/2"]
      status: answered
      answerSummary: "Approximately $300M+: ~$73M through Series B, $180M Series C, and an estimated $60M SAP strategic investment (finsmes, pitchbook, highlandeurope sources)."

    - id: QV015
      question: "What percentage of n8n does SAP hold post-investment?"
      type: quantification
      targets: ["contentRequirements/2"]
      status: answered
      answerSummary: "Approximately 1.3% per Highland Europe press release; ~$60M / $5.2B post-money ≈ 1.15%; rounded to 1.3% in official announcement."

    - id: QV016
      question: "How does n8n's ARR growth rate compare to public automation peers and private SaaS benchmarks?"
      type: comparison
      targets: ["contentRequirements/4"]
      status: answered
      answerSummary: "n8n: 10× YoY growth to October 2025, approximately 2.5× in subsequent 7 months. UiPath: 11% ARR growth FY2026. Zapier: ~29% YoY in 2025. n8n is a far outlier above any public comparable."

    - id: QV017
      question: "How does n8n's ARR multiple compare to Zapier's implied ARR multiple?"
      type: comparison
      targets: ["contentRequirements/4"]
      status: answered
      answerSummary: "n8n Series C: ~62× ARR. Zapier: ~12× ARR on $420M at $5B. n8n trades at 5× the multiple of Zapier despite being 7× smaller in ARR. The premium reflects growth rate but is not fully explainable by fundamentals."

    - id: QV018
      question: "How does n8n's valuation compare to UiPath on EV/ARR?"
      type: comparison
      targets: ["contentRequirements/4"]
      status: answered
      answerSummary: "n8n: 62× ARR (Series C). UiPath: 2.2× EV/ARR. Differential: 28×. Even adjusting for growth rate premium (10× growth vs. 11%), n8n's multiple is structurally elevated."

    - id: QV019
      question: "How does the open-source SaaS discount affect fair value analysis for n8n vs. closed-source peers?"
      type: comparison
      targets: ["contentRequirements/4"]
      status: answered
      answerSummary: "Open-source SaaS typically trades at 20–30% discount vs. closed peers (Windsor Drake 2026). Applied to the top of the private AI-native range (20×), the adjusted fair value would be 14–16× — still 4× below Series C 62×."

    - id: QV020
      question: "How does n8n's valuation trajectory compare to other European unicorns during 2025?"
      type: comparison
      targets: ["contentRequirements/2"]
      status: answered
      answerSummary: "n8n went from $355M (March 2025) to $2.5B (October 2025) to $5.2B (May 2026) — a 15× step-up in 14 months, exceptional even among European AI startups. Comparable European AI valuations in 2025 include Mistral and Helsing, but none matched this compressed growth timeline."

    - id: QV021
      question: "Is the Series C price ($2.5B) artificially inflated by the competitive bidding war between Accel and Insight Partners?"
      type: adverse
      targets: ["contentRequirements/2"]
      status: answered
      answerSummary: "Evidence supports this conclusion: Sifted reported Insight offered ~$2.9B, creating a >20% pricing premium over what a single-buyer negotiation would have produced. This is a structural adverse finding for the Series C entry."
      adverseIntent: true

    - id: QV022
      question: "Can the 62× ARR multiple be justified by undisclosed unit economics (NRR, gross margin, burn)?"
      type: adverse
      targets: ["contentRequirements/2"]
      status: unresolved
      answerSummary: "Cannot be assessed — n8n has not disclosed NRR, gross margin, burn rate, or customer concentration. This is an explicit evidence gap. The multiple is unjustifiable from disclosed data alone."
      adverseIntent: true

    - id: QV023
      question: "What is the risk of a down-round if ARR growth decelerates to below 2× annually?"
      type: adverse
      targets: ["contentRequirements/3"]
      status: answered
      answerSummary: "Bear case analysis: at $80M ARR and 10× private SaaS multiple, implied valuation of $0.8B represents a 68% step-down from Series C. Probability is estimated at ~30% given competitive dynamics and AI-hype cycle risk."
      adverseIntent: true

    - id: QV024
      question: "Does the absence of NRR, gross margin, and burn rate data materially impair valuation confidence for any investor?"
      type: adverse
      targets: ["contentRequirements/2"]
      status: answered
      answerSummary: "Yes — NRR is the single strongest predictor of SaaS multiple in the 2026 private market (Livmo, Windsor Drake). Without it, investors must rely entirely on growth rate and category positioning. This creates an asymmetric information risk for external investors vs. Series C insiders."
      adverseIntent: true

    - id: QV025
      question: "What is n8n's likely exit path — IPO vs. M&A acquisition?"
      type: mechanism
      targets: ["contentRequirements/5"]
      status: answered
      answerSummary: "Jan Oberhauser has stated he wants a European listing. The investor syndicate (Accel, Sequoia, Meritech, Redpoint) is consistent with IPO preparation. M&A is also credible given SAP's strategic investment. Most likely exit is IPO in 2027–2028 if ARR crosses $300M and NRR above 115%."

    - id: QV026
      question: "How does the SAP OEM channel affect fair value analysis and what incremental ARR could it contribute?"
      type: mechanism
      targets: ["contentRequirements/2"]
      status: unresolved
      answerSummary: "SAP's enterprise customer base is massive but the commercial terms (minimum revenue, revenue share, exclusivity) are not disclosed. The channel creates real option value but cannot be quantified from public data; treated as upside optionality in the scenario analysis."

    - id: QV027
      question: "What diligence data would change the WATCH recommendation to BUY?"
      type: mechanism
      targets: ["contentRequirements/1"]
      status: answered
      answerSummary: "Four conditions: (1) confirmed ARR above $200M by Q4 2026; (2) disclosed NRR above 115%; (3) gross margin confirmed above 70%; (4) SAP Joule Studio commercial uptake evidence with measurable enterprise customer additions through the channel."

    - id: QV028
      question: "What is the governance and dilution risk for common shareholders at the $2.5B Series C entry?"
      type: mechanism
      targets: ["contentRequirements/2"]
      status: answered
      answerSummary: "Dilution risk is moderate: Accel-led Series C at $180M likely represents 6–8% of post-money, with earlier preferred holders stacked above common. Governance opacity (no CFO/CTO named) increases execution risk. Preference stack favors Series C holders over earlier investors in a down-round scenario."

    - id: QV029
      question: "How would a hyperscaler launching a free-tier AI workflow orchestration product affect n8n's valuation floor?"
      type: mechanism
      targets: ["contentRequirements/5"]
      status: answered
      answerSummary: "Microsoft Power Automate is already bundled with M365. If Microsoft adds MCP-native AI agent orchestration at zero marginal cost, n8n's $800/month Business tier becomes harder to justify for non-technical buyers. This would likely compress the forward multiple from 25× to 10–15× in a base scenario."

    - id: QV030
      question: "What is UiPath's FY2026 financial performance, and how does it anchor the public peer multiple?"
      type: quantification
      targets: ["contentRequirements/4"]
      status: answered
      answerSummary: "UiPath FY2026 (ended Jan 31 2026): Revenue $1.611B (+13% YoY), ARR $1.853B (+11% YoY), GAAP gross margin 83%, non-GAAP operating income $370M, EV $4.12B — implying 2.2× EV/ARR and establishing the public peer ceiling."

    - id: QV031
      question: "What is Workato's last known valuation and implied ARR multiple?"
      type: comparison
      targets: ["contentRequirements/4"]
      status: answered
      answerSummary: "Workato raised at $5.7B in 2022; estimated ARR approximately $200M+ at that time implying ~28× ARR; current 2026 estimate likely compressed to 10–15× under current private SaaS market conditions."

    - id: QV032
      question: "What is the public SaaS EV/Revenue median entering 2026?"
      type: quantification
      targets: ["contentRequirements/4"]
      status: answered
      answerSummary: "Public SaaS median EV/Revenue is approximately 6–7× entering 2026 per Windsor Drake and Livmo analysis; down from 18.6× peak in late 2021; stabilised at pre-2020 levels. Top-quartile public SaaS at 13–20×."

