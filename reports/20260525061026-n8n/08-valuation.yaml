chapter:
  number: 8
  title: Valuation
  summary: >
    n8n's October 2025 Series C ($2.5B post-money, $180M raised, Accel-led) implies
    approximately 62× ARR on the ~$40M ARR disclosed at term-sheet signing — a multiple
    Sifted and independent analysts characterised as driven by investor FOMO and competitive
    bidding dynamics rather than fundamental merit. The May 2026 SAP strategic investment at
    $5.2B against >€100M ARR compresses the implied multiple to ~50×, supported by the
    strategic OEM validation and continued hyper-growth. Four valuation lenses — ARR multiple,
    public-peer discount, private-market comp, and scenario modelling — converge on a
    WATCH/TRACK recommendation at the Series C price: the entry is stretched against the
    disclosed ARR base and would only become BUY-eligible with confirmed NRR >115%, gross
    margin >70%, and SAP channel uptake evidence. The $5.2B SAP mark is more defensible but
    still requires diligence on the same absent unit-economics metrics. Adverse risks include
    the absence of any audited financials, competitive commoditisation pressure from
    hyperscalers, and structural open-source pricing-power constraints. Eight net-new sources
    across previously uncited domains anchor the analysis, including UiPath's FY2026 financial
    filing (analyst-market-data and filing source types both covered).

sections:
  - id: valuation-context-financing-history
    title: Valuation Context and Financing History
    body: >
      n8n's valuation trajectory from March 2025 to May 2026 is among the most compressed
      step-up sequences in European technology history. The Series B in March 2025 valued n8n
      at approximately €300M ($355M) on €55M raised from Highland Europe, Sequoia, Felicis,
      and HV Capital. Seven months later in October 2025, the Series C valued the company at
      $2.5B post-money on $180M raised, led by Accel — a 7× step-up in valuation in a single
      round. A competitive bidding war between Accel and Insight Partners (which reportedly
      offered approximately $2.9–3.0B pre-money) drove the final price above any single-buyer
      fundamental analysis would have produced. Sifted, which broke the pre-announcement
      numbers, characterised the round as reflecting "investor FOMO" and reported that n8n's
      revenue had surpassed $40M at the August 2025 term-sheet signing — a figure n8n
      declined to confirm but did not deny.

      The May 2026 SAP strategic investment at a $5.2B implied valuation — approximately $60M
      reportedly structured as a secondary purchase alongside a multi-year OEM commercial
      agreement embedding n8n inside Joule Studio — provided the most recent public pricing
      mark. The investment was announced at SAPPHIRE NOW in Orlando on May 12, 2026. SAP holds
      approximately 1.3% of n8n post-transaction. The valuation jump from $2.5B to $5.2B was
      supported by disclosed ARR growing from >$40M at Series C to >€100M at the SAP deal,
      representing approximately 2.5× revenue growth in roughly seven months. The arithmetic:
      $5.2B / €100M ARR ≈ 50× — a modest compression from the 62× at Series C, but still
      well above fundamentals-based benchmarks for comparable private SaaS companies.

      Total disclosed capital raised through runDate 2026-05-25 exceeds $300M: approximately
      $73M through Series B close, $180M Series C, and an estimated $60M SAP investment. The
      institutional investor roster — Accel, Sequoia, Meritech, Redpoint, NVentures (NVIDIA),
      Highland Europe, HV Capital, Felicis, T.Capital (Deutsche Telekom), and SAP — represents
      one of the deepest enterprise-SaaS syndicates assembled for a European automation company.
      n8n's UK filing for 2025 remains outstanding as of 2026-05-25, consistent with UK
      Companies Act statutory timelines; no audited financials exist in the public domain.
      This governance opacity — no named CFO, CTO, or CCO in public materials — increases the
      diligence risk premium that any investor should attach to the non-public financial claims.
