  - id: licensing-governance-legal-risk
    title: Licensing, Open-Source Governance, and Legal Risk
    body: >
      n8n's Sustainable Use License (SUL) is a proprietary fair-code license that is not OSI
      (Open Source Initiative) approved. While source code is publicly visible and internal
      business use is permitted without restriction, the SUL prohibits commercial SaaS resale,
      white-labeling, and embedding n8n as the core of a commercial service without an Enterprise
      or Embed license. This licensing model has generated persistent community friction since the
      2022 transition from Apache 2.0 + Commons Clause. The n8n blog acknowledged at the time
      that the previous arrangement "created some ambiguity and confusion" and that the new SUL was
      designed to draw "a clearer line"—but in practice, community members continue to debate
      gray-area scenarios.

      The October 2025 Data Tables feature launch reignited a community licensing debate documented
      on Biggo. Critics argued that fair-source licensing "lacks the protections of true open source
      software" and voiced concern about future "rug pulls" where features become paywalled or
      pricing models change unilaterally. The debate drove some users to evaluate Node-RED (Apache
      2.0), Windmill.dev, ActivePieces, and Tracecat as true FOSS alternatives. Community forum
      activity on n8n.io confirms ongoing confusion about SUL vs. commercial license boundaries for
      agency and MSP use cases—scenarios where a developer builds n8n workflows for paying clients.
      n8n's official licensing FAQ acknowledges the ambiguity and directs users to email license@n8n.io
      for clarification, indicating edge cases cannot be resolved from published documentation alone.

      The governance architecture gap is a separate but related risk. JieGou's February 2026 analysis
      noted that n8n's HITL (human-in-the-loop) feature is "layer 1 of 11" governance primitives and
      lacks quantitative governance scoring, EU AI Act mapping, NIST AI RMF mapping, graduated
      autonomy controls, budget limits per agent, threat detection (prompt injection, data exfiltration),
      and SOC 2-structured audit evidence. In February 2026, n8n disclosed 21+ security vulnerabilities
      including 7 critical CVEs; CVE-2026-25049 bypassed the December 2025 fix within three months—
      a sign of architectural security debt that governance tooling cannot compensate for.

      From a legal and regulatory perspective, n8n GmbH (registered in Berlin, Germany) and its UK
      subsidiary (Companies House filing history confirmed) are subject to GDPR requirements applicable
      to all EU/UK data processors. Customers who self-host n8n are data controllers responsible for
      their own compliance; n8n's status as a SaaS vendor means cloud customers rely on n8n's DPA and
      sub-processor list. No SOC 2 or ISO 27001 certification has been publicly confirmed for n8n Cloud
      as of the runDate; the 2026 roadmap targets these certifications but formal attestation documents
      are not publicly available. The absence of these certifications creates a procurement blocker
      for regulated-industry enterprise buyers who require vendor certification as a pre-condition.
