company:
  name: n8n
chapter:
  number: 7
  title: Risks
  summary: >
    n8n in 2026 carries a layered, mutually reinforcing risk profile that spans security,
    licensing, competitive, financial, and people dimensions. On the security side, the
    platform disclosed five critical CVEs (CVSS 9.4–10.0) in a 60-day window between
    January and February 2026, including Ni8mare (CVE-2026-21858, CVSS 10.0), an
    unauthenticated RCE that exposed an estimated 100,000 self-hosted servers; a January 2026
    npm supply-chain attack exfiltrating stored OAuth tokens; and a December 2025 patch
    bypass (CVE-2026-25049). Cisco Talos documented 686% growth in weaponized n8n webhook
    URLs for malware delivery through March 2026. These incidents are particularly damaging
    because n8n functions as a centralized credential vault for all integrated systems—a
    single compromised instance can cascade into a full infrastructure breach. The fair-code
    Sustainable Use License is not OSI-approved open source; community backlash, fork
    discussions, and licensing ambiguity for service providers represent a persistent
    adoption barrier. SAP's strategic investment and plans to embed n8n inside Joule Studio
    create both a major growth catalyst and a single-partner concentration risk. Jan Oberhauser
    remains the sole founder, the platform's public face, and by his own admission a succession
    candidate post-IPO—key person risk is elevated. Financial opacity (no public filings,
    revenue estimates vary by 4× across sources) impedes independent diligence. Competitive
    risk from Microsoft Power Automate's bundled pricing and Zapier's integration breadth is
    material. Each risk has identified mitigants and concrete diligence asks; four kill-criteria
    triggers are defined for thesis-breaking events.

sections:
  - id: security-supply-chain-product-risk
    title: Security, Supply-Chain, and Product Risk
    body: >
      n8n's position as a centralized automation hub—storing API keys, OAuth tokens, database
      credentials, and cloud access tokens for every integrated service—creates an extraordinarily
      high blast radius for any successful attack. In the ten weeks between November 2025 and
      February 2026, n8n disclosed five critical security vulnerabilities (CVSS 9.4–10.0),
      representing an unprecedented concentration of maximum-severity findings for a single
      platform in a short window.

      CVE-2026-21858 ("Ni8mare", CVSS 10.0), disclosed January 7, 2026, is an unauthenticated
      remote code execution vulnerability rooted in a Content-Type confusion flaw in n8n's
      webhook handler. By sending a crafted HTTP request, an unauthenticated attacker can: read
      arbitrary files from the server (including the SQLite database and encryption key stored at
      /home/node/.n8n/config); forge administrator session tokens; and achieve full RCE by
      creating a workflow with an Execute Command node. Cyera Research Labs estimated over 100,000
      internet-exposed n8n servers were vulnerable. The patch was released in v1.121.0 on
      November 18, 2025; no workaround exists for unpatched deployments. Picus Security confirmed
      the full attack chain step-by-step, noting that the blast radius includes all credentials
      stored in the n8n instance. Three additional critical CVEs (CVE-2025-68613, CVSS 9.9;
      CVE-2025-68668 "N8scape", CVSS 9.9; CVE-2026-21877, CVSS 10.0) were disclosed in the
      same period, all enabling authenticated or unauthenticated code execution under varying
      conditions.

      CVE-2026-25049 (CVSS 9.4), disclosed February 5, 2026, bypassed the December 2025 patch
      for CVE-2025-68613. Pillar Security researchers warned that successful exploitation could
      grant full server control—including interception of OpenAI, Anthropic, and AWS credentials
      in real time—and that n8n Cloud's multi-tenant architecture could allow cross-tenant data
      access. The Register reported n8n maintainers confirmed: "An authenticated user with
      permission to create or modify workflows could abuse crafted expressions in workflow
      parameters to trigger unintended system command execution on the host running n8n." The
      patch bypass within three months of the original fix suggests architectural, not merely
      implementation, security debt.

      In May 2026, three further critical CVEs (CVE-2026-44789 prototype pollution via HTTP
      Request node leading to RCE; CVE-2026-44790 Git node argument injection; CVE-2026-44791
      XML node patch bypass) were disclosed via GitHub Security Advisories, all impactable by
      low-privileged authenticated users with workflow-editing permissions. These affect versions
      prior to 1.123.43, 2.20.7, and 2.22.1.

      The January 2026 npm supply-chain attack added a separate attack vector. Endor Labs
      discovered malicious npm packages disguised as legitimate n8n community nodes (e.g., Google
      Ads connectors) that collected OAuth tokens and API keys from n8n's credential store and
      exfiltrated them to C2 servers. There is no pre-publication review of npm packages, and all
      installed community nodes run with full access to the workflow environment, including
      decrypted API credentials. n8n introduced cryptographic provenance requirements for verified
      nodes from May 2026, but unverified nodes remain installable. Endor Labs noted: "Even
      though the malicious packages we know have been disabled in the last few hours, the attacks
      may continue and evolve going forward."

      Cisco Talos, in an April 2026 threat intelligence report, documented that the volume of
      emails containing weaponized n8n webhook URLs in March 2026 was approximately 686% higher
      than in January 2025. Threat actors exploit n8n's legitimate webhook infrastructure to
      deliver malware, conduct device fingerprinting, and bypass security filters—since the payloads
      appear to originate from a trusted n8n domain. JieGou's technical commentary noted that
      n8n's governance architecture gap (absence of quantitative governance scoring, regulatory
      compliance mapping, department-scoped policies, and SOC 2-structured audit evidence) means
      security incidents cannot be adequately governed by the platform's current tooling alone.
