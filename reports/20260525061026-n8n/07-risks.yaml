  evidenceGaps:
    - id: GR001
      topic: "SAP partnership financial terms and concentration risk quantification"
      description: >
        The SAP strategic investment amount, revenue guarantees, exclusivity clauses, royalty structures,
        termination provisions, and governance rights are not publicly disclosed as of 2026-05-25. These
        terms are essential for quantifying the severity of SAP partnership concentration risk and
        assessing whether the investment creates governance overhang for existing Series C investors.
        Data-room access and direct disclosure from n8n are required.
      relatedQuestionRefs: [QR025]

    - id: GR002
      topic: "n8n ARR segment breakdown and top-10 customer revenue concentration"
      description: >
        Segment-level ARR (cloud vs. enterprise self-hosted vs. OEM/embedded) and top-10 customer
        revenue concentration are not publicly disclosed. Sacra provides only channel mix estimates
        (55% cloud / 30% enterprise / 15% OEM). The actual NRR, churn rate, and customer concentration
        metrics required for a complete financial risk assessment are unavailable from public sources.
      relatedQuestionRefs: [QR027, QR028]

    - id: GR003
      topic: "External penetration test results and security audit date"
      description: >
        No external penetration test reports or third-party security audit results for n8n Cloud
        have been published as of 2026-05-25. Given the critical CVE pattern (five CVEs CVSS 9.4–10.0
        in a 60-day window), this is a material gap. The existence of an ongoing SOC 2 audit (if true)
        would imply a penetration test was conducted, but no confirmation is publicly available.
      relatedQuestionRefs: [QR029]

    - id: GR004
      topic: "n8n formal incident response SLA and architectural remediation plan"
      description: >
        n8n has not published a formal SLA for responding to critical CVEs. CVE-2026-21858 was patched
        approximately 6 weeks after researcher disclosure; CVE-2026-25049 bypassed that fix within 3
        months, indicating incomplete architectural remediation. The May 2026 CVEs extend the pattern
        to additional node types. A formal architectural remediation commitment for the webhook handling
        and expression evaluation attack surface has not been disclosed.
      relatedQuestionRefs: [QR032]

    - id: GR005
      topic: "SAP investment equity dilution and governance terms for existing investors"
      description: >
        The equity percentage, anti-dilution provisions, board governance rights, and any strategic
        control rights associated with SAP's strategic investment have not been disclosed. These terms
        are relevant to assessing whether the SAP relationship creates governance or exit constraints
        for existing Series C investors (Accel, NVIDIA, Sequoia, Felicis, Highland Europe).
      relatedQuestionRefs: [QR034]

