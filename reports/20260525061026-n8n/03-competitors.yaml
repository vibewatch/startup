chapter:
  number: 3
  title: Competitors
  summary: >
    n8n competes across three distinct strata: (1) consumer/SMB cloud automation (Zapier, Make.com),
    (2) enterprise iPaaS (Workato, Tray.io, MuleSoft/Boomi), and (3) open-source AI-agent
    orchestrators (Langflow, Flowise, Temporal). Zapier leads on integration breadth (~7,000+
    connectors, ~$420M ARR Q1 2026) but is proprietary cloud-only; n8n wins on cost economics at
    high volume, data sovereignty, and AI-agent depth. Workato (~$2.1B secondary market value,
    ~17,000 enterprise customers) and Tray.io ($70M ARR, $600M valuation) target larger enterprise
    contracts where n8n is still building proof. Microsoft Power Automate is a bundled hyperscaler
    threat: included in many M365 seats, it wins by default in Microsoft-centric enterprises even
    where n8n is technically superior. Open-source peers Langflow and Flowise overlap only in the
    AI-agent workflow sub-market; they lack business-automation breadth and are more complementary
    than substitutable at the workflow layer. n8n's primary moat—fair-code self-hosting plus
    LangChain-native AI orchestration—is durable in developer-led and regulated markets but faces
    compression risk from hyperscaler bundling, low-code commoditization, and AI-feature convergence.

sections:
  - id: landscape-overview
    title: Competitive Landscape and Buyer Alternatives
    body: >
      Buyers solving the workflow automation and AI-agent orchestration problem in 2026 face a
      fragmented landscape spanning cloud SaaS automation tools, enterprise integration platforms,
      and open-source AI-agent builders. n8n competes differently against each tier.

      The largest directly contested market segment is cloud workflow automation, where Zapier and
      Make.com occupy the SMB and mid-market segments. Zapier reached approximately $420 million
      ARR in Q1 2026 and services more than 3 million companies, with roughly 100,000 paying
      customers and a $5 billion valuation sustained on minimal venture capital ($2.68 million
      raised). Its 7,000+ native app connectors and zero-infrastructure deployment model make it the
      default for marketing, sales-ops, and non-technical business teams. Make.com (formerly
      Integromat, acquired by Celonis) serves a similar profile with 3,000+ connectors and a
      credit-based pricing model that scales with workflow complexity. Both platforms are cloud-only
      with no self-hosting option, which is the primary reason technically sophisticated and
      regulated-industry buyers migrate to n8n.

      At the enterprise tier, Workato and Tray.io (now styled as Tray.ai) anchor the iPaaS
      market for large enterprise automation and integration contracts. Workato raised approximately
      $421 million across multiple rounds peaking at a $5.7 billion valuation in 2021; secondary
      market transactions in early 2026 imply a current valuation of approximately $2.1 billion.
      The platform serves roughly 17,000 customers and is recognized for mature governance,
      audit-readiness, and complex enterprise sales motions. Tray.io raised approximately $150
      million through Series C (2022), reported $70 million ARR with ~40% year-on-year growth in
      2023, and pivoted toward AI-powered integration with its Merlin AI capability. Both require
      enterprise procurement motions with annual contract values typically ranging $30,000 to
      $250,000+, placing them above n8n's current enterprise deal size.

      The largest structurally different competitive threat comes from Microsoft Power Automate,
      bundled within Microsoft 365 subscriptions at $15 per user per month, or included at no
      marginal cost in certain M365 plans. In enterprises already standardized on Microsoft 365 and
      Azure, Power Automate represents a zero-incremental-cost automation baseline that competes
      primarily on procurement simplicity and ecosystem lock-in rather than technical capability.
      Datanyze reports 2,348 companies using Power Automate in production, including Walmart,
      Microsoft, and CVS Health; Gartner's 2025 RPA Magic Quadrant positions it as a strong
      player in the Power Platform context. For organizations without deep Microsoft commitment,
      Power Automate's weaker custom code support, limited self-hosting, and Microsoft ecosystem
      dependency remove it as a viable n8n substitute.

      Adjacent open-source competitors Langflow and Flowise occupy a narrower sub-market: visual
      AI-agent and retrieval-augmented generation (RAG) pipeline builders. Flowise (built on
      LangChain.js) excels at chatbot and RAG prototyping but lacks the broad business-app
      integrations, scheduling primitives, and production error handling that characterize n8n.
      Langflow targets Python-first data science and LLM experimentation workflows. Both are
      complementary in many deployments—teams frequently embed Flowise or Langflow agents inside
      n8n workflows—but they do not substitute for full business-automation scenarios. Temporal,
      a developer-centric durable workflow engine, competes for engineering-team adoption in
      microservice orchestration and long-running process use cases; it lacks visual no-code
      tooling and the app-connectivity layer that define the mainstream n8n use case.
