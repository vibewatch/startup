companyProfile:
  summary: >-
    n8n GmbH is a Berlin-based workflow automation and AI agent orchestration platform founded in
    2019 by Jan Oberhauser. The company operates under a fair-code (Sustainable Use) licensing
    model that makes the source freely self-hostable while monetizing through cloud subscriptions
    and enterprise term licenses. After a $180M Series C in October 2025 at a $2.5B valuation led
    by Accel—with NVIDIA's NVentures and Deutsche Telekom's T.Capital participating—n8n reported
    230,000+ active community users, 3,000+ enterprise customers, and ARR exceeding $40M following
    roughly 10x revenue growth through 2025. Public evidence through runDate supports strong
    category momentum, but key unit-economics and governance details remain undisclosed.
  foundedDate: '2019-01-01'
  founders:
    - name: Jan Oberhauser
      role: Founder & CEO
      background: Former Pipeline Technical Director at Digital Domain (VFX); built n8n to solve workflow automation pain points from his own pipeline engineering experience.
      claimRefs: [CO015, CO016, CO036]
  foundingLocation: Berlin, Germany
  headquarters: Berlin, Germany
  productSummary: >-
    n8n provides a visual, node-based workflow automation and AI agent orchestration platform
    supporting 500+ integrations. It enables technical and semi-technical teams to connect
    applications, build multi-step automations, and deploy AI agents with configurable human-in-the-loop
    controls. Deployment options include n8n Cloud (subscription tiers) and self-hosted Community
    or Enterprise editions.
  customerFocus: >-
    Technical teams and enterprise organizations requiring production-grade automation with data
    sovereignty, self-hosting flexibility, and AI agent capabilities; particularly strong in regulated
    industries, agencies, and digital-transformation contexts.
  businessModel: >-
    Cloud SaaS subscriptions on an execution-based pricing model (Starter $24/month to Business
    $800/month), plus enterprise term licenses for self-hosted deployments ($15,000–$50,000+/year),
    and an emerging OEM/embedded channel anchored by the May 2026 SAP Joule Studio partnership.
  stage: Series C
  fundingStatus: >-
    $180M Series C in October 2025 at $2.5B post-money valuation led by Accel; total disclosed
    funding reached about $240M across seed, Series A, Series B, and Series C. Investors include
    Accel, Sequoia, Meritech, Redpoint, Highland Europe, Felicis, HV Capital, NVentures (NVIDIA),
    and T.Capital (Deutsche Telekom).
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO009, CO010, CO011, CO012, CO015, CO016, CO022, CO030]
summary:
  headline: >-
    n8n is one of the fastest-growing enterprise automation platforms in Europe, with compelling
    community moat, strong AI-native positioning, and institutional validation—but stretched
    Series C valuation and absent unit economics warrant a disciplined track rather than immediate
    buy.
