      - number: '8.2'
        title: 估值方法与可比分析
        blocks:
          - type: paragraph
            body: >
              四个分析视角汇向同一个结论：n8n 2025 年 10 月 Series C 价格（$2.5B / 约 $40M ARR ≈ 62× ARR）相对私募市场中位数和上市自动化同行都明显拉伸； 2026 年 5 月
              SAP 标记（$5.2B / >€100M ARR ≈ 50× ARR）得到持续超高速增长的部分支撑，但如果没有未披露的单位经济性数据，仍远高于基本面公允价值。

              ARR 倍数视角。Series C 隐含约 62× 前瞻 ARR。进入 2026 年，上市 SaaS 公司的 EV/Revenue 中位数为 6–7×（Windsor Drake、Livmo 2026）。上市
              SaaS 前十分位公司——如 ServiceNow 和 CrowdStrike——在深度嵌入的关键任务工作流、125% 以上 NRR 和可观经营利润的支撑下，能获得 15–20×。私营 SaaS 方面，2026
              年低中端市场交易倍数中位数为 4–5× ARR；顶四分位 AI 原生或超高速增长私营 SaaS 在竞争性流程中可达 7–12×。即便取私营 AI 原生 SaaS 区间最顶端（15–20×），n8n 的 62×
              倍数仍比可实现溢价高 3–4×。开源 SaaS 企业如果没有已验证的强网络效应，通常相对闭源同行折价 20–30% 交易——这会压缩而不是扩大隐含公允价值区间。

              上市同行折价倍数视角。最接近的上市纯业务同行是 UiPath（NYSE: PATH），这是全球最大的自动化平台；其 FY2026（截至 2026 年 1 月 31 日）报告 ARR 为 $1.853B，收入
              $1.611B，ARR 增长 11%。截至 2026 年 5 月，UiPath 企业价值为 $4.12B，约等于 2.2× EV/ARR。即便给 n8n 更高 ARR 增速套用慷慨的 15×
              增长溢价，隐含公允价值倍数也约为 33×，仍比 Series C 的 62× 低 47%。唯一能算到 62× 的路径，要么是假设其可永久高出私营 SaaS 可辩护最高溢价 3–5×，要么是给 SAP OEM
              渠道和 AI 智能体编排品类领导地位赋予大量期权价值，而这些价值尚未变现。

              私募市场可比视角。Zapier 在 2026 年 Q1 达到 $420M ARR，最后已知老股估值约 $5B，隐含约 12× ARR——规模是 n8n ARR 的 7×。Workato 2022
              年最后一轮机构融资估值 $5.7B，对应估计 $200M ARR，隐含约 28×；在当前私营 SaaS 市场条件下，这一倍数很可能已经明显压缩。私营 SaaS 中位数 4–5× 构成典型私募交易的地板。n8n
              的定价比这些可比公司高 4–13×，反映的是 AI 智能体编排定位的“品类溢价”和 Series C 竞价战动态。

              情景分析。基准情景下，如果 n8n 到 2026 年底达到 $200M ARR，并获得 25× 前瞻倍数（对于年增长 >100% 的品类领导者是可行假设），隐含估值约 $5B——大致贴近 SAP 标记，也为
              Series C 投资人提供温和支撑。乐观情景为 $300M ARR、30× 倍数，隐含 $9B，明显高于 SAP 标记，并让 Series C 入场资金在完成后约 18 个月内获得 3.6× 回报。悲观情景为
              $80M ARR、10× 倍数，隐含 $0.8B——较 Series C 下调 68%，与下轮降价或困境收购一致，触发因素包括 ARR 放缓、竞争替代或 AI 炒作周期修正。考虑当前 ARR
              轨迹，基准情景最可能发生，但乐观情景要求 SAP 渠道成功执行，而这一点尚未验证。
