            title: Fair-code 许可带来生态碎片化风险
            body: >
              n8n 的 Sustainable Use License 长期引发社区争议。禁止在没有企业许可证的情况下构建商业 SaaS——据报道每年费用为 $15,000–$50,000+——限制了原本可以放大 n8n
              触达的商业生态。定价调整和按量执行模型变化曾多次触发社区反弹及 “rug pull” 担忧。一旦市场对许可稳定性的信任削弱，Node-RED、ActivePieces、Windmill.dev
              等许可更宽松的竞品可能夺走社区驱动增长。
