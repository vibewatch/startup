  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与定价架构
        blocks:
          - type: paragraph
            body: >
              n8n 通过 3 种不同机制创造收入：云订阅层级、自托管部署的企业期限许可证，以及早期嵌入式 / OEM 渠道——第三方平台（最突出的是 SAP）把 n8n 自动化引擎原生集成进去。

              云产品只按工作流执行次数收费——从触发到结束的完整工作流运行计为 1 次，不管内部步骤数。截至 2026 年，云计划包括 Starter（每月 $24，2,500 次执行）、Pro（每月 $60，10,000
              次执行）和 Business（每月 $800，40,000 次执行）。企业云定价为定制。年度预付可使云计划成本降低 17–20%；月执行量超过 250,000 的企业账户通常还能在年度合同中谈到额外 20–30%
              折扣。执行次数模型与 Zapier 这类按步骤计数的竞品结构不同：一个 10 节点工作流运行 1,000 次，在 n8n 上成本为 1,000 次执行，而在 Zapier 上是 10,000 个任务；因此对复杂或
              AI 增强自动化，n8n 明显更便宜。这一定价优势推动社区和 SMB 采用，但也把单用户收入封在执行层级上限内。

              Enterprise License 层级面向自托管部署，解锁 SSO/SAML、审计日志、RBAC、版本控制、外部密钥管理和 worker mode。该层级没有公开定价，社区来源报道的区间约为每年
              $15,000–$50,000+。2025 年，n8n 从工作流数量 + 用户数量混合模型切换到当前只按执行次数的模型，引发了社区对规模化成本可预测性的讨论。

              自托管 Community Edition 在 Sustainable Use License 下可免费用于内部商业用途，基础 VPS 基础设施成本约为每月 $3–7，生产级自托管约为每月
              $20–150。该层级不给 n8n 带来直接许可证收入，但会供给漏斗顶部：免费层自托管社区成员会以某种比例转化为云或企业客户。开源 SaaS 云转化率通常以 2–10% 自托管用户为基准，这意味着 n8n 估计
              1.7 million 月活跃开发者（截至 2026 年 5 月）中的绝大多数从不付费。

              2026 年 5 月宣布的 SAP 合作，增加了具备直接商业意义的第三条收入渠道。根据多年协议，n8n 工作流引擎将嵌入 Joule Studio，即 SAP 的智能体构建环境。这是 OEM
              或嵌入式许可证模式；如果按收入分成或按部署收费设计，可能在不增加云执行成本的情况下显著扩大 n8n 的可触达变现。
