      - number: '2.3'
        title: 买方分层与部署模式
        blocks:
          - type: paragraph
            body: >
              2026 年，企业工作流自动化买方分为 4 类角色，预算归属、采购标准和部署偏好各不相同。理解这一分层，是评估 n8n 的 SAM 以及商业层级现实采用路径的关键。

              开发者主导团队（工程师、平台工程师、DevOps）是 n8n 主要的自然获客渠道，也是产品市场匹配最强的人群。这类买方看重开放 API 访问、自托管、基于 Git
              的版本控制、通过自定义代码扩展，以及规模化后的成本可预测性。预算通常归平台或工程团队所有；中大型组织年支出区间为 $10,000–$100,000。该人群推动 n8n
              社区增长，并提供下游证据，支撑企业许可证采购。

              IT 治理和合规团队掌控受监管行业的采购审批。这类买方要求 RBAC、审计日志、SAML/SSO、数据驻留保证和供应商安全态势文档。他们价格容忍度较高但厌恶风险，愿意用更高 TCO
              换取合规暴露降低。对这一人群而言，n8n 的自托管模式是功能而非限制——它消除了与 SaaS 厂商谈判数据处理协议的需要。Vodafone、KPMG 和 Icatu insurance 是这一类别中已有记录的
              n8n 企业客户。

              业务运营和业务线团队代表业务开发者（citizen developer）人群，当前市场主要由 Zapier 和 Make 服务。该细分按数量最大，但单席支出最低、技术成熟度也最低。n8n
              的产品复杂度对这一买方构成障碍；Gartner 预测 80% 的低代码 / 无代码用户在 IT 部门之外，也凸显了这个细分对开发者优先工具而言仍然庞大且服务不足。

              大型企业 IT 自动化卓越中心（CoE）是按年度合同价值最高的细分。这类买方运行超自动化（hyperautomation）计划，自动化技术栈年支出为 $200,000–$500,000+，会把
              Workato、MuleSoft、ServiceNow 与 n8n 一并评估。SAP 2026 年 5 月对 n8n 的 $60M 战略投资，显示其有意借 Joule Studio
              的嵌入式超自动化层触达这一细分；这可能让 n8n 获得 SAP 300 million+ 云用户基础这一分发渠道。
