      - number: '2.2'
        title: 市场规模与估算
        blocks:
          - type: paragraph
            body: >
              分析师对 2026 年工作流自动化 TAM 的估算集中在 $24.7B 至 $30B 之间，中位数接近 $26.5B。这个跨度（$5.3B 区间）反映方法论差异很大：Mordor
              Intelligence（$26.0B）剔除纯 RPA 软件；Coherent Market Insights（$29.9B）纳入更宽的业务流程管理层；MarkNtel
              Advisors（$24.7B）采用更窄的云优先 SaaS 定义；Fortune Business Insights（$27.9B）包含专业服务。4 家机构都认同到 2030 年代初 CAGR 为
              9–17%，并把 AI 集成列为区间上沿的主要驱动。

              iPaaS 是最相邻的细分。Fortune Business Insights 估算 2026 年 iPaaS TAM 为 $19.15B，到 2034 年 CAGR 为 24.2%。Gartner 的 2024
              Market Share Analysis 将 2024 年 iPaaS 规模量化为 $8.5B（同比增长 23.4%），使其成为增速第二快的企业软件中间件细分。这些数字方法论不同——Gartner
              采用更窄、聚焦企业的边界——但都确认，随着 SaaS 应用扩散，集成层正在快速扩张。当前平均每家企业使用约 300 个 SaaS 应用，形成了结构性连接需求，而单一厂商无法原生覆盖。

              AI 智能体编排层规模更小，但增长更快。Dimension Market Research 估算 2026 年市场规模为 $11.0B，预计到 2035 年达到 $115.1B，CAGR 为
              29.8%。Tech-Insider 引用多家分析师估算的收敛区间，认为 2026 年为 $9.1–10.9B。Deloitte 和 Gartner 预测，到 2028 年，33% 的企业软件应用将嵌入智能体式
              AI，高于 2024 年不到 1%；如果兑现，每家主流工作流自动化厂商默认都会成为 AI 编排厂商。

              评估 n8n 在这些品类中的 SAM 和 SOM 需要判断。n8n 自托管、开发者优先的画像，把可触达买方限制在技术能力足够、且需要数据主权或在规模化场景优化 TCO 的组织内。这将 SAM 从完整 $26B
              TAM 缩窄到约 $2–6B 的 API 优先工作流自动化子细分，排除 RPA 和 iPaaS 企业细分。SOM 还受到当前 3,000+ 企业客户和 230,000+ 活跃用户基数限制，意味着即便在缩窄后的
              SAM 中，当前变现捕获也远低于 1%。尽调缺口仍在：截至 2026 年 5 月，尚无独立市场研究发布开源自托管工作流自动化子细分的规模。
