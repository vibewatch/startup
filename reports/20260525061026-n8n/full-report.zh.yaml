      - number: '3.2'
        title: 竞品画像与能力对比
        blocks:
          - type: paragraph
            body: >
              Zapier 的竞争优势建立在集成广度（Zapier 自有团队维护 7,000+ 个连接器）、易用性（非技术用户当天即可产出）以及可盈利的自筹模式上，后者让它比 VC
              支持的竞品承受更低定价压力。其按任务计价模型——工作流中的每个动作步骤都算 1 个可计费任务——在高工作流量和高复杂度下会结构性变贵。一个 5 步工作流每月执行 1,000 次，会消耗 5,000 个任务；按
              Team 计划费率，成本显著高于等价的 n8n 执行次数计划，因为 n8n 不管节点数多少，完整工作流运行只算 1 次执行。Zapier 没有自托管选项，这是有意设计，并支撑其托管 SaaS 经济性。包括
              Model Context Protocol（MCP）支持和 Copilot 式 AI 工作流生成在内的企业 AI 功能于 2025–2026 年加入，但仍面向业务用户，而非开发者控制的 AI
              智能体管线。Zapier 估计拥有 7%+ iPaaS 市场份额，并被约 70% 的 Fortune 1000 公司用于至少部分场景。

              Make.com 以可视化界面质量形成差异化——其带动画数据流的流程图式构建器，被广泛认为比 n8n 节点画布更适合非技术用户——同时在较小工作负载上更具成本效率。Make
              的积分制定价奖励简单场景，惩罚深度分支或迭代工作流。Make 在 2025–2026 年推出用于多智能体编排的 Make Grid，并发布 beta 版 Maia AI 构建器，缩小了与 n8n 的 AI
              智能体能力差距；但技术可扩展性（工作流内自定义 JavaScript 执行、自定义节点开发）仍弱于 n8n。Make 只提供云服务，并拥有 SOC 2 和 ISO 27001 认证。

              Workato 为大型企业集成和自动化而生，复杂度要求预构建企业 SaaS 连接器（SAP、Salesforce、ServiceNow、Workday）、强审计日志，以及受治理的 recipe（工作流）管理层。其
              RecipeIQ AI 助手能从自然语言生成工作流逻辑。Workato 定价不公开，但企业合同通常要求年度承诺；按任务计价叠加复杂部署所需专业服务，使总合同价值显著高于 n8n 企业层。Workato 客户群偏向
              1,000+ 席位组织中的 IT 运营、ITSM 和 HRIS 自动化。n8n 与 Workato 竞争时，主要强调自托管可带来 70–80% 降本潜力，以及对已熟悉 API 的技术团队来说实施开销更低。

              Tray.io（Tray.ai）目标企业细分与 Workato 相似，但强调非技术“业务集成者”使用低代码构建。Tray Merlin AI 把自然语言转成集成工作流。Sacra research 识别的
              Tray.io 关键风险包括：AI 商品化削弱 Merlin AI 差异化；从 $50M ARR 向上进入大客户时企业销售动作变复杂；非技术用户跨敏感系统创建集成，引发数据治理担忧。这些风险为 n8n
              打开了市场定位窗口；n8n 通过自托管而非供应商云控制来处理数据治理。

              Microsoft Power Automate 按 Datanyze 数据拥有约 7.1% 业务流程管理市场份额；多家分析师估算其在 2026 年全球 RPA/工作流市场占 8–12%。它与 Microsoft
              Copilot、Azure AI 以及更广泛 Power Platform（Power Apps、Power BI）的集成，使其成为面向 Microsoft 中心型企业的一体化平台打法。不过，在非
              Microsoft 应用集成广度、自定义代码灵活性和非 Windows 部署方面，它的评分长期低于 n8n、Zapier 和 Workato。

              在开源 AI 智能体细分，n8n 与 Flowise、Langflow 部分争夺开发者心智。Flowise（截至 2026 年 GitHub stars 超过 46,000）是领先的开源可视化 RAG
              和聊天机器人构建器，但无法在广泛业务自动化上替代 n8n。Langflow 因 LLM 管线可视化和 Python 导出受到重视。二者都可嵌入 n8n
              工作流，在生产技术栈中形成互补而非替代关系。Cybernews 评测（2026）认为，Flowise 缺少广泛应用集成、工作流重试和运营控制，因此无法在业务自动化上替代 n8n。
