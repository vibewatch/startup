  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与品类定义
        blocks:
          - type: paragraph
            body: >
              n8n 位于 4 个相互独立又重叠的软件品类交汇处：工作流自动化、集成平台即服务（iPaaS）、AI 智能体编排，以及低代码 / 无代码应用开发。各品类的分析师口径不同，因此已发布 TAM
              数据差异很大。2025–2026 年，工作流工具加入企业级治理，iPaaS 厂商加入低代码构建器，AI 智能体框架把传统工作流引擎变成智能体编排层，功能重叠显著增加。

              最窄口径下，工作流自动化指连接云 SaaS 应用、由 API 触发、基于线性 DAG 的任务自动化，也最接近 n8n 的核心产品。该细分不包括纯 RPA（面向遗留系统的桌面 UI 自动化）、重型 BPM
              流程管理，以及 MuleSoft 或 Boomi 服务的数据集成管线。对买方而言，买还是自建主要取决于 3 个因素：部署工具的团队有多技术化，数据主权或气隙要求是否限制托管选择，以及是否需要 AI
              原生智能体循环与确定性自动化并存。在同类公司中，n8n 独特地覆盖了这 3 条轴：它是唯一具备规模的玩家，同时拥有自托管开源层、原生 AI 智能体原语，并通过 JavaScript 和 Python
              自定义代码提供开发者优先的可扩展性。

              现状替代方案包括人工流程（SMB 中最常见）、自定义内部工具、基于电子表格的协作，以及嵌在 CRM/ERP 系统中的平台原生自动化（Salesforce Flow、SAP Automation
              Pilot、HubSpot workflows）。在企业账户中，主导性现状方案是 Microsoft Power Automate；它随 E3/E5 Microsoft 365
              许可证打包出货，按装机基础约控制企业自动化市场 19%。n8n 若要替换既有工具，其总拥有成本和可扩展性优势必须大过迁移摩擦和 IT 变更管理成本。
