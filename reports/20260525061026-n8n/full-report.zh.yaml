      - number: '5.2'
        title: 部署模型、基础设施与开发者体验
        blocks:
          - type: paragraph
            body: >
              n8n 提供四种不同部署选项，这共同定义了它相对仅云端竞争者的技术差异化。n8n Cloud 是托管 SaaS 产品，自动更新、安全补丁，并采用分层定价：Starter 为 $20/月（2,500 次执行、5
              并发），Pro 为 $50/月（10,000 次执行、20 并发），Business 是带 SSO/SAML 和版本控制的自托管或云混合选项，Enterprise 提供无限项目、200+
              并发执行、外部密钥存储集成、日志流和定制 SLA。Community 自托管版在 Sustainable Use License 下免费，支持所有集成节点且没有功能限制，但缺少付费 Enterprise
              许可密钥解锁的企业治理功能。Enterprise 自托管选项增加 SSO、RBAC、审计日志、版本控制、多环境和 99.99% SLA 支持。隔离网 Enterprise
              部署面向医疗、金融和政府等有严格数据驻留或网络隔离要求的组织，需要 Enterprise 许可、手动管理 Docker 镜像和 npm 包依赖，并与 n8n 企业销售团队协调离线许可激活。

              自托管带来实质性运营开销，买方常常低估这一点。生产级部署需要 PostgreSQL 13+（队列模式不支持 SQLite）、Redis 用于队列模式、反向代理（NGINX 或 Caddy）用于 TLS
              终止、队列模式下用于二进制数据的 S3 兼容对象存储，以及对更新、防火墙规则和凭证轮换的持续管理。把计算、数据库、存储、网络、安全工具和 DevOps 人工计入后，一个基础生产环境每月成本约
              $300–$500；对小团队而言，在同等执行量下，这些成本往往高于 n8n Cloud 价格。对非技术买家，自托管是显著运营门槛；n8n 自己的文档也建议没有服务器管理经验的用户选择 Cloud。截至 2026
              年 5 月 22 日，当前稳定版为 v2.21.7，大多数周都会发布小版本，累计发布历史超过 1,990 次。
