  - id: TR002
    title: 运营、安全与供应链风险登记表
    columns:
      - 失效模式
      - 可能性
      - 严重性
      - 缓释成熟度
      - 剩余敞口
      - 未解决缺口
    rows:
      - - 通过 CVE-2026-21858（Ni8mare）未经认证 RCE——完全接管实例，所有凭据面临风险
        - 未打补丁实例风险高；已确认被主动利用
        - 严重——CVSS 10.0；估计 100,000+ 台服务器暴露
        - v1.121.0 已发布补丁；未打补丁无变通方案；建议网络分段
        - 高——自托管运营者可能跟不上补丁节奏；气隙部署需要手动更新
        - 3 个月内出现补丁绕过（CVE-2026-25049），说明 webhook 处理存在结构性债务；来源证明校验不能追溯
      - - npm 供应链攻击：恶意社区节点外泄 OAuth 令牌
        - 中——2026 年 1 月记录到主动攻击；2026 年 5 月起来源证明校验只覆盖部分节点
        - 严重——n8n 存储的所有凭据都暴露在外泄风险下；没有运行时沙箱
        - 2026 年 5 月起对已验证节点执行加密来源证明校验；N8N_COMMUNITY_PACKAGES_ENABLED=false 可禁用所有社区节点
        - 高——未验证节点仍可安装；来源证明无法阻止看似合法的恶意节点在运行时访问凭据
        - 没有运行时沙箱把社区节点执行与 n8n 凭据库隔离；已安装节点代码审计由运营者负责
      - - 通过 n8n webhook 发送钓鱼 / 恶意软件的平台滥用
        - 高——恶意 n8n webhook 邮件增加 686%（Talos，2026 年 3 月 vs 2025 年 1 月）
        - 对 n8n 为中（声誉损害）；对未对 webhook 做认证的客户为高
        - n8n 默认没有实时滥用检测，也不强制 webhook 认证
        - 中——持续滥用会让 n8n 品牌与恶意软件投递绑定；企业买家可能限制 webhook 使用
        - 免费 webhook 账号缺少平台级滥用检测或限速；看似合法的 n8n 域名被用作掩护
      - - 经由表达式求值的已认证 RCE（CVE-2026-25049、CVE-2026-44789/44790/44791）
        - 中——需要工作流编辑权限；低权限认证用户可利用
        - 高——CVSS 9.4；可完全控制服务器，Cloud 多租户存在跨租户数据访问风险
        - 已发布补丁；需要升级 n8n 版本；表达式求值架构债务已被标记
        - 已打补丁实例为中；落后更新节奏的企业自托管为高
        - 表达式求值沙箱尚未完全加固；按现有模式，未来很可能出现绕过变体
      - - 自托管配置错误——实例暴露在互联网、部署未打补丁、凭据薄弱
        - 高——部分教程中的默认 Docker Compose 部署会暴露 5678 端口且无认证
        - 高——容易被 Shodan 发现；默认配置可能缺少 HTTPS、认证或网络限制
        - n8n 文档建议所有实例启用认证；官方指南要求反向代理
        - 高——社区文档不一致；非专业运营者常低配安全
        - 社区版没有自动加固检查；自托管配置的安全审计需要运营者主动发起
      - - n8n core 更新后，二进制依赖和社区节点破损
        - 中——每周发布节奏，节点接口偶尔有破坏性变更
        - 中——依赖这些节点的自动化工作流会破损；多步骤智能体可能静默失败
        - n8n 维护变更日志和社区节点兼容指南；计划推出版本化节点 API
        - 中——社区节点没有 SLA 或维护承诺；废弃节点带来长期可靠性风险
        - 社区节点 API 接口面没有正式弃用政策或兼容性保证；升级后才发现节点破损，处理是被动的
    notes: |
      按严重性排序。可能性与严重性反映截至 2026-05-25 的公开安全公告、威胁情报报告和社区文档证据。
