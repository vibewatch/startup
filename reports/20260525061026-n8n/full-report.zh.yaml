chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位、产品与商业模式
        blocks:
          - type: paragraph
            body: >
              n8n GmbH 是一家总部位于柏林的软件公司，运营一个 AI 原生工作流自动化与编排平台。产品让技术和半技术团队用可视化、节点式编辑器连接应用、自动化多步骤流程，并部署 AI 智能体；需要时还能加入
              JavaScript 或 Python 自定义代码。n8n 开箱支持 500+ 个集成，也有开放的社区节点生态，这些节点以 npm 包形式发布。

              公司由 Jan Oberhauser 于 2019 年创立。他受够了既有自动化工具的僵硬和缺乏扩展性。产品名 “n8n” 是 “nodemation” 的缩写——“node” 指 Node.js
              运行时和视图范式，“mation” 指 automation，中间 8 个字母被压缩成一个数字。平台于 2019 年 10 月在 Product Hunt 上线，尚未投入正式营销就吸引了早期开发者社区。

              n8n 采用双许可证模式，并称其为 “fair-code”。Sustainable Use License 让源码可以免费查看，也可免费自托管用于内部业务；但禁止在没有付费企业许可证的情况下，基于 n8n
              构建竞争性商业 SaaS 产品。叠加的 Enterprise License 增加
              SSO/SAML、LDAP、RBAC、审计日志、版本控制和气隙部署等功能。云托管计划按层级订阅提供（Starter、Pro、Enterprise）。商业模式把云 SaaS
              订阅和高价值企业期限许可证结合起来，面向需要大规模生产级自动化、同时看重数据主权和自托管的组织。

              n8n 把自己放在纯规则自动化（Zapier、Make）与完全自主 AI 智能体之间，让用户精确配置哪些任务交给 AI
              模型自主处理，哪些必须走确定性逻辑。这样的“混合控制”定位，加上可部署在任意基础设施上的能力，是其在受监管行业获得企业采用的主要驱动。
