            title: 社区驱动增长飞轮叠加 AI 时点
            body: >
              n8n 的开源定位，加上 2022 年在主流认知形成前押注 AI 编排，形成了可复利的增长飞轮：社区贡献者构建并分享集成，吸引更多技术用户；技术用户带来企业交易，企业收入再反哺产品投入。2025 年单年收入增长
              10x、用户增长 6x，验证该飞轮在最佳市场时点进入逃逸速度。
