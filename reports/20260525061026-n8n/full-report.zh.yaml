      - number: '7.5'
        title: 缓释措施、否决标准与尽调问题
        blocks:
          - type: paragraph
            body: >
              尽管风险画像很严峻，每一类主要风险都有可识别的缓释手段和可投资监测指标。安全风险在结构上可以管理：通过网络分段（让 n8n 实例与公网隔离）、对所有 webhook 端点强制认证、在不需要时用
              N8N_COMMUNITY_PACKAGES_ENABLED=false 禁用社区节点，并按 n8n 每周发布节奏定期打补丁。 2026 年 5
              月开始对已验证社区节点引入加密来源证明要求，部分缓解了供应链攻击向量，但未验证节点仍可安装。企业部署应把 n8n 凭据接入 HashiCorp Vault 或同等外部密钥存储，限制实例被攻破后的影响半径。n8n
              2026 年路线图中的正式 SOC 2 和 ISO 27001 认证，将提供第三方控制成熟度验证，部分缓释合规缺口。

              许可风险的关键缓释手段是合同清晰度：企业买家应拿到书面商业或 Enterprise 许可协议，明确允许用途，避免依赖 fair-code 社区解读。为客户构建面向客户自动化的服务提供商（代理机构、MSP）必须取得
              Embed 许可证。“抽地毯”风险——单方面收紧许可——受到 n8n 疏离开发者社区所需付出的声誉成本限制，但如果没有明确许可承诺，就无法用合同方式防住。

              治理风险可以通过 n8n 的公开安全公告节奏（GitHub Security Advisories）、SOC 2 鉴证进度和社区论坛语气来监测。否决触发点是关键 CVE 反复出现却没有架构性修复：12
              个月内出现四个或更多 CVSS 9+ CVE，且沙箱能力没有改善，说明安全债是系统性的，而不是偶发问题。

              创始人与关键人风险部分由 Sequoia、Accel 和 Felicis 的董事会存在缓释；这类投资人通常会推动接班计划讨论。投资人应尽调 CTO、CPO、VP Engineering 和 VP Sales
              角色的深度，要求查看组织架构、直属下属任期和接班方案。否决触发点是 Oberhauser 在 Series C 后 24 个月扩张阶段自愿离开，且公司没有披露可信接班人。

              财务不透明只能通过数据室访问来缓释。必要尽调材料包括：FY2024 和 FY2025 经审计或审阅的利润表和资产负债表；按细分市场（云、企业自托管、OEM）拆分的 ARR 和 NRR；前 10
              大客户收入集中度；按当前和目标员工数计算的烧钱速度与现金跑道；以及 SAP 合作的财务条款（收入保证、排他条款、终止条款）。否决标准是： 在当前收入规模下，烧钱倍数高于 2.5×，且 18 个月内没有可信路径降至
              1.5× 以下。

              SAP 依赖风险可以通过 SAP 集成里程碑交付（已宣布 Q3 2026 GA 日期）、公开 SAP 企业采用指标，以及 n8n 披露的 OEM 收入占比来监测。否决触发点包括 SAP 合作重组、SAP
              收购竞争性自动化平台，或围绕嵌入条款的公开争议——这些都会移除定义投资逻辑的增长催化剂。
