      - number: '7.3'
        title: 竞争风险、平台依赖与 AI 炒作风险
        blocks:
          - type: paragraph
            body: >
              n8n 的竞争位置同时承受三股压力：资源充足的既有厂商在扩展自动化能力；新的开源和 fair-code 进入者不断出现；SAP 合作带来战略集中风险。

              Microsoft Power Automate 免费打包在 Microsoft 365 E3/E5 许可里。任何已经使用 Microsoft 技术栈的组织，都能获得零边际成本的自动化替代方案。 Power
              Automate 在 2025 年 12 月更新中加入 AI Builder 能力，并加深与 Copilot Studio 的集成，让非技术用户可以用自然语言创建自动化。 Zapier 拥有 7,000+
              个集成，而 n8n 官方节点只有 400+；它的 no-code UX 对非技术买家来说采用门槛显著更低。 Workato 面向企业 iPaaS，并具备正式的 SOC 2 Type II 和 ISO 27001
              认证，因此在受监管行业买家面前比 n8n 更有合规优势。 这些既有厂商的销售体系、合作伙伴生态和认证都强于 n8n，限制了 n8n 在重视供应商风险管理的企业买家中的可服务市场。

              SAP 战略投资（2026 年 5 月，估值 $5.2B）把 n8n 原生嵌入 SAP Joule Studio，使 n8n 成为 SAP 300,000 家企业客户的自动化层。这一合作既是 n8n
              历史上最大的商业催化剂，也是最大的集中风险。SAP 关系一旦恶化——战略错位、SAP 收购竞争性的编排平台，或集成质量失败——就可能消除或大幅削弱一条代表 n8n 企业 TAM 扩张重要部分的管线。在 Joule
              Studio 里搭建工作流的 SAP 客户，会把自动化绑定到 SAP BTP 基础设施上，形成退出摩擦；未来合同谈判中，这可能让 SAP 受益而让 n8n 承压。n8n 官方博客承认，SAP
              合作方面“还有很多内容会陆续推出”，暗示财务条款和更深层依赖尚未完全披露。

              2026 年环境下，AI 功能炒作是迫切风险。n8n 的投资人叙事围绕“AI 编排层”和“AI 时代的 Excel” 展开，这些说法帮助其推动收入增长 10×、估值达到 $2.5B。Cisco Talos
              2026 年 4 月报告记录到，吸引企业买家的同一套 AI 智能体能力，也能让复杂威胁行为者用很低的技术门槛搭建自动化恶意软件投放和钓鱼系统。缺少足够护栏时，过度依赖智能体自动化会引入黑箱运营风险： 当 LLM
              驱动的智能体自主分诊、响应和行动，幻觉或提示注入可能造成未被发现的合规失败。Sequoia Capital 的播客访谈提到 “现在约 75% 的客户使用 AI 功能”，意味着产品价值逻辑高度押注 AI——因此对
              LLM 商品化以及 AI 投资气候转冷都很敏感。Make.com、Workato 和 Zapier 都在加入原生 LLM 编排能力；如果 AI 工作流功能在 12–18 个月内变成商品化层，n8n
              的溢价差异化就会收窄到自托管和开发者灵活性，而这两点服务的 TAM 小于完整自动化平台叙事。

              自托管复杂度是结构性采用障碍。Sliplane 的自托管指南显示，生产部署需要 PostgreSQL 13+、Redis（BullMQ）、反向代理、队列模式下用于二进制数据的 S3 兼容存储、TLS
              配置，并要持续跟进所有组件的补丁节奏。一个基础生产环境的基础设施成本估计为每月 $300–$500，通常高于同等 n8n Cloud 价格。n8n 自身文档建议没有服务器管理经验的用户选择
              Cloud，说明公司意识到其自托管用户中有相当一部分低于推荐的安全和可靠性标准。
