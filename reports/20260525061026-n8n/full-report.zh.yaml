      - number: '4.3'
        title: 单位经济、成本结构与利润率画像
        blocks:
          - type: paragraph
            body: >
              n8n 不公布经审计财务报表、毛利率、净留存率（NRR）、客户终身价值、获客成本（CAC）回本周期或烧钱速度。所有单位经济只能靠代理指标估算。Sacra 和可比开源核心 SaaS 基准显示，n8n 毛利率可能高于
              75%——这符合软件公司的特征：云基础设施成本主要来自工作流执行计算，没有实体商品，也没有专业服务占比很高的收入流。不过，按执行次数定价会带来成本敞口：随着 AI
              智能体工作流扩散（每个自主智能体会话每天可能触发数百或数千次执行），每份订阅背后的基础设施成本可能相对固定月费不成比例地上升；除非公司涨价或限制执行突发量，否则云毛利率会被压缩。

              对自托管企业客户，n8n
              服务额外工作流的边际成本接近于零——基础设施成本全部由客户承担。相较云业务，企业许可渠道因此在结构上改善了毛利率。不利之处在于，客户在规模化时比较云端与自托管，往往会发现自托管更便宜；这种持续的定价张力会限制
              n8n 上调云计划价格的力度，否则会加速客户迁移到免费可运行的自托管层。

              NRR 尚未披露。对一个开发者驱动、按使用量扩展、且处在快速增长工作流自动化市场的 SaaS 产品而言，同类最佳公司的 NRR 通常高于 120%。如果 n8n 的 NRR 低于 110%，要维持表面 ARR
              增长，就需要大量获取新客户，从而推高每单位净 ARR 的销售和营销成本。

              成本结构明显偏工程投入，符合 n8n 的产品驱动增长（PLG）模型和开源社区投入。2025 年 923 名员工、406 个招聘岗位显示，公司在争取企业账户和国际扩张时，销售与营销开支正在爬坡。据报道，2025
              年平均薪酬约为 $60,700/年（Revelio Labs），低估了真实完全负担成本；这个阶段的欧洲软件公司把薪资税、福利和股权计入后，完全负担成本通常高出 50–80%。按员工数和增长阶段推算的年度烧钱速度为
              $48–120M，与 Series C 后关于加速工程、企业销售和美国市场进入的资本投放指引相符。

              开源转化漏斗同时是优势也是风险。通过 GitHub 或社区发现 n8n 的用户，CAC 接近于零；但要把免费自托管用户转成企业合同，通常需要专门销售动作、技术支持和概念验证（PoC）周期，混合 CAC
              会明显抬高。n8n 上探高端市场后，PLG 带来的低 CAC 获客与高接触企业销售之间的平衡，将实质性决定利润率轨迹。
