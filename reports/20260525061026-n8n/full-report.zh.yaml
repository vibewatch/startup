      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              工作流自动化市场的结构性增长来自 3 个技术趋势交汇：SaaS 应用激增，需要集成；AI 原生工作流原语成熟；企业 IT 基础设施向混合环境收敛，自动化横跨本地和云工作负载。Stonebranch 的 2026
              Global State of IT Automation Report 显示，88% 的企业受访者运行混合 IT 环境；2024 至 2026 年，投资云自动化的受访者比例从 43% 升至
              64%，这条轨迹直接扩大了 API 型工作流工具的可触达市场。

              AI 集成是 2026 年新增需求的最大单一驱动。Gartner 预测，到 2026 年，30% 的企业会自动化超过一半网络活动，高于 2023 年不到 10%；驱动来自在工作流执行中嵌入 AI
              决策的智能自动化（Intelligent Automation，IA）平台。Gartner 同时把 超自动化——把 AI、ML、RPA 和工作流编排合为统一实践——列为 90% 大型企业的优先事项。n8n 的
              AI 智能体节点架构直指这一驱动，让确定性工作流逻辑和自主 AI 智能体循环可以共存在同一画布。

              主要采用约束是企业集成复杂度。根据 State of SaaS Integration Report，63% 的 iPaaS 采用者投资集成，首要目标是提升客户留存，而非降低成本；这说明 ROI
              已被认可，但衡量维度并不直观。监管合规要求——GDPR 数据驻留、HIPAA PHI 隔离、政府气隙要求——一方面限制采用（需要额外安全加固），另一方面也为能交付自托管、可审计工作流的平台创造竞争优势。

              反向指标包括：Gartner 在 2024 Hype Cycle for I&O Automation 中把智能自动化（Intelligent Automation） 归入幻灭低谷，并估计完整 IA
              能力主流采用还需 5–10 年。InformationWeek 的 2026 年企业 AI 预测强调，AI 智能体框架（LangGraph、AutoGen、Copilot Studio、Bedrock
              Agents）在不兼容架构上竞争，市场碎片化会提高企业在标准收敛前选择平台的集成风险。Deloitte 警告，智能体间通信协议（Google A2A、Anthropic MCP、Cisco
              AGNTCY）过度竞争，可能制造围墙花园生态，使智能体工作流无法跨供应商互操作。
