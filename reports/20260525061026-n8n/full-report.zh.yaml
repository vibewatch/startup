      - number: '1.3'
        title: 融资历史、估值与投资方
        blocks:
          - type: paragraph
            body: >
              n8n 从 2020 到 2025 年四轮累计披露融资约 $240M。融资轨迹显示，2022 年转向 AI 后，公司加速明显。

              2020 年 $1.5M 种子轮由 Sequoia Capital（其 Sequoia Scout 计划在欧洲的第一笔投资）和 firstminute capital
              领投，为核心团队和产品搭建提供了早期现金跑道。2021 年 $12M Series A 由 Felicis Ventures 领投，后者此后持续参与每一轮融资。2025 年 3 月，Highland Europe
              领投 €55M（约 $60M）Series B，这是 n8n 第一轮机构成长期融资，估值约 €250M（$270M），HV Capital、Sequoia、Felicis 和 Harpoon 共同参投。

              拐点出现在 2025 年 10 月，n8n 宣布由 Accel 领投 $180M Series C，投后估值升至 $2.5B——不到 8 个月较 Series B 估值大约上跳 9x。该轮引入
              Meritech、Redpoint、Evantic 和 Visionaries Club 等新机构投资方，也有 NVentures（NVIDIA 的风险投资部门）和 T.Capital（Deutsche
              Telekom 的风投部门）战略参投。此前所有机构投资方——Sequoia、Felicis Ventures、Highland Europe 和 HV Capital——均跟投，释放出持续信心。资金用途聚焦 AI
              能力扩展、美国市场渗透和生态建设。

              作为 Series B 资金部署计划的一部分，公司 2025 年在 New York 和 London 开设办公室；美国已贡献 n8n 超过一半用户。DTCP（Deutsche Telekom Capital
              Partners）是否作为独立于 T.Capital 的参与方，尚未在主要来源中得到独立确认，应视为未核实。
