      - number: '5.4'
        title: 企业功能、安全与合规
        blocks:
          - type: paragraph
            body: >
              n8n Enterprise 在 Community 基础之上叠加分层治理模型。身份认证和身份管理支持 SAML 2.0、OIDC 和 LDAP，并支持由 IDP
              驱动的用户开通：当用户在身份提供商（Okta、Azure AD 等）中加入、变更角色或离开时，n8n 会在实例和项目两个层级自动同步权限，避免手工访问管理漂移。项目范围自定义 RBAC
              允许管理员定义细粒度角色（builder、reviewer、operator、admin 或任意自定义角色），并按项目应用，让共享同一 n8n
              实例的团队能够职责分离。不可变审计日志记录每次工作流创建、修改、执行和凭证访问事件；日志可导出，也可通过日志流（Enterprise 层）发送到 SIEM。外部密钥存储集成支持 HashiCorp Vault
              等系统，让敏感凭证在 n8n 实例之外管理，降低 n8n 部署被攻破后的爆炸半径。基于 Git
              的版本控制、多环境支持（dev、staging、prod）和可视化工作流差异，让团队能把软件工程生命周期实践套用到自动化开发。

              n8n 的安全面带有重大风险，公开安全公告已有充分记录。CVE-2026-21858（Ni8mare）于 2026 年披露，是最高严重级别（CVSS 10.0）的未认证远程代码执行漏洞，影响 n8n 1.65.0
              到 1.120.x 版本。漏洞源于基于表单的工作流处理对 Content-Type 头验证不当，使未认证攻击者能够读取服务器任意文件——包括 n8n 加密密钥——随后伪造会话
              token，并实现完整远程代码执行。考虑到估计有 100,000+ 台暴露在互联网上的 n8n 服务器、100 million+ 次 Docker pull，爆炸半径很大。补丁已在 v1.121.0
              发布，未打补丁部署没有变通缓解措施。由于 n8n 是数十乃至数百个已连接服务的集中凭证枢纽，单个实例被攻破就可能级联成全面基础设施入侵，影响所有集成的 SaaS
              平台、云账户和数据库。企业必须强制执行网络分段、所有 webhook 端点认证，以及及时补丁节奏，才能管理这类风险。2026 年 1
              月供应链攻击进一步证明，未沙箱化的社区节点架构形成了持续的凭证外传攻击面，单靠技术控制无法完全消除。
