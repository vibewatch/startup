  - id: FR001
    title: n8n 风险热力图 —— 可能性与严重性
    type: matrix
    layout: wide
    summary: |
      按可能性（x 轴）和严重性（y 轴）定位 n8n 主要风险，显示高严重性风险集中在安全和平台依赖象限。
    data:
      columns:
        - 高可能性
        - 中可能性
        - 低可能性
      rows:
        - label: 关键严重性
          values:
            - CVE-2026-21858 Ni8mare 未认证 RCE（CVSS 10.0）；npm 供应链攻击外泄 OAuth 令牌；创始人 / 关键人离职（Jan Oberhauser 为唯一创始人）
            - SAP 伙伴关系失败或重组；通过表达式求值触发的认证后 RCE（CVE-2026-25049）
            - ''
        - label: 高严重性
          values:
            - 经由 n8n webhook 的恶意软件 / 钓鱼平台滥用（邮件增长 686%）；自托管配置错误；企业销售扩张缺口
            - 财务不透明：烧钱速度和 ARR 无法核验；竞争替代（Microsoft Power Automate 捆绑；Zapier 广度）；安全工程带宽受限
            - GDPR / EU 监管行动；缺少 SOC 2 / ISO 27001 阻断受监管行业采购
        - label: 中严重性
          values:
            - AI 热潮风险：LLM 功能在 12–18 个月内商品化；Sustainable Use License 分叉成真；npm registry 滥用
            - ''
            - AI 模型提供方 API 变更打断智能体工作流；员工数增长 7× 带来工程质量回归
        - label: 低严重性
          values:
            - ''
            - ''
            - UK Companies Act 申报延迟；云基础设施提供商集中（AWS）
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR005
      - CR021
      - CR023
      - CR031
      - CR034
  - id: FR002
    title: 风险传导图 —— n8n 风险如何流向收入和估值
    type: dag
    layout: wide
    summary: |
      有向无环图展示 n8n 主要风险类别如何向下传导，影响收入、客户、估值和运营。
    data:
      nodes:
        - id: security-cve
          label: |-
            关键 CVE 集群
            （Ni8mare + 另外 4 个）
        - id: supply-chain
          label: |-
            npm 供应链攻击
            （OAuth 令牌外泄）
        - id: platform-abuse
          label: |-
            平台滥用
            （Talos：webhook 邮件增长 686%）
        - id: licensing-ambiguity
          label: |-
            Sustainable Use License
            模糊性 / 反弹
        - id: founder-risk
          label: |-
            唯一创始人
            关键人风险
        - id: sap-dependency
          label: |-
            SAP 伙伴关系
            集中度
        - id: financial-opacity
          label: |-
            财务不透明
            （收入估计区间达 4×）
        - id: customer-trust
          label: |-
            企业客户信任
            受损
        - id: revenue-impact
          label: |-
            收入
            放缓
        - id: competitive-displacement
          label: |-
            竞争替代
            （Microsoft、Zapier）
        - id: valuation-compression
          label: |-
            估值
            压缩
        - id: community-fragmentation
          label: |-
            社区 / 开发者
            碎片化
      edges:
        - from: security-cve
          to: customer-trust
          label: 阻断企业采购
        - from: supply-chain
          to: customer-trust
          label: 凭证泄露侵蚀信任
        - from: platform-abuse
          to: customer-trust
          label: 品牌与恶意软件绑定
        - from: customer-trust
          to: revenue-impact
          label: 流失 / 交易延迟
        - from: licensing-ambiguity
          to: community-fragmentation
          label: 分叉动机
        - from: community-fragmentation
          to: revenue-impact
          label: 削弱自下而上增长飞轮
        - from: founder-risk
          to: revenue-impact
          label: AI 战略受损
        - from: sap-dependency
          to: revenue-impact
          label: 合作失败，催化剂消失
        - from: financial-opacity
          to: valuation-compression
          label: 压低投资者信心
        - from: revenue-impact
          to: valuation-compression
          label: 倍数压缩
        - from: competitive-displacement
          to: revenue-impact
          label: TAM 收缩
    claimRefs:
      - CR001
      - CR012
      - CR023
      - CR031
      - CR034
      - CR038
      - CR040
  - id: FR003
    title: n8n 关键依赖图
    type: dag
    layout: wide
    summary: |
      梳理 n8n 在安全基础设施、商业合作、AI 模型供应商、社区生态和监管环境上的关键外部依赖。
    data:
      nodes:
        - id: n8n-core
          label: n8n 平台核心
        - id: sap
          label: |-
            SAP SE
            （战略投资方、OEM）
        - id: npm-registry
          label: |-
            npm Registry
            （社区节点基础设施）
        - id: openai-anthropic
          label: |-
            OpenAI / Anthropic / Google
            （LLM 供应商）
        - id: aws-cloud
          label: |-
            AWS / GCP / Azure
            （n8n Cloud 基础设施）
        - id: sequoia-accel
          label: |-
            Sequoia / Accel / Felicis
            （领投方 / 董事会）
        - id: jan-oberhauser
          label: |-
            Jan Oberhauser
            （唯一创始人 / CEO）
        - id: github-community
          label: |-
            GitHub Community
            （450+ 贡献者，189K 星标）
        - id: nist-nvd
          label: |-
            NIST / NVD
            （CVE 披露框架）
        - id: gdpr-regulators
          label: |-
            欧盟 / 英国数据监管机构
            （GDPR、ICO）
        - id: enterprise-customers
          label: |-
            1,400+ 企业客户
            （SAP、Vodafone、Microsoft）
      edges:
        - from: n8n-core
          to: sap
          label: 嵌入 Joule Studio；战略投资；关键增长渠道
        - from: n8n-core
          to: npm-registry
          label: 社区节点分发；供应链攻击面
        - from: n8n-core
          to: openai-anthropic
          label: AI 功能价值取决于 LLM API 可用性；75%+ 客户使用 AI
        - from: n8n-core
          to: aws-cloud
          label: n8n Cloud 的计算、存储、数据库；99.99% SLA 依赖外部云基础设施
        - from: jan-oberhauser
          to: n8n-core
          label: 唯一创始人；产品愿景、AI 战略、社区信任、投资者叙事
        - from: sequoia-accel
          to: n8n-core
          label: 资本、董事会治理、继任规划
        - from: github-community
          to: n8n-core
          label: 500+ 社区节点；模板；自然传播
        - from: n8n-core
          to: gdpr-regulators
          label: n8n Cloud 处理客户数据；需要 GDPR DPA
        - from: nist-nvd
          to: n8n-core
          label: CVE 跟踪；安全公告框架；60 天内公开披露 5 个严重 CVE
        - from: n8n-core
          to: enterprise-customers
          label: 所有集成系统的凭据库；一旦失陷，爆炸半径覆盖全部系统
    claimRefs:
      - CR023
      - CR024
      - CR025
      - CR026
      - CR034
      - CR038
  - id: FV001
    title: 推荐逻辑流程——从证据到观察立场
    type: flow
    layout: wide
    summary: |
      从市场规模、ARR 增长证据、风险和估值输入一路推到观察 / 跟踪建议，标出哪些证据支撑投资逻辑，哪些尽调缺口让它还够不上买入。
    data:
      nodes:
        - id: market-scale
          label: |-
            大 TAM
            （$100B+ 超自动化）
          detail: 工作流、iPaaS、低代码和 AI 编排合计构成 TAM；结构性增速超过 10% CAGR
          tone: positive
          claimRefs:
            - CV001
        - id: arr-growth
          label: |-
            超高增长 ARR
            （到 Oct 2025 同比 10×；到 May 2026 为 2.5×）
          detail: ~$40M → >€100M，7 个月内完成；支撑品类动能逻辑
          tone: positive
          claimRefs:
            - CV007
            - CV008
        - id: sap-channel
          label: |-
            SAP OEM 渠道
            （嵌入 Joule Studio，1,400+ 企业）
          detail: 尚未货币化的收入倍增器；SAP 的 $5.2B 标记估值验证品类领导力
          tone: positive
          claimRefs:
            - CV004
            - CV029
        - id: valuation-stretch
          label: |-
            62× ARR 倍数
            （Series C；高于 AI 原生 SaaS 峰值 3–4×）
          detail: 只有期权价值和增长溢价能支撑；竞价战把价格抬高了
          tone: negative
          claimRefs:
            - CV010
            - CV023
        - id: absent-economics
          label: |-
            单位经济缺失
            （无 NRR、毛利率、烧钱速度、客户集中度）
          detail: 无审计数据；所有单位经济都只能估算；单靠基本面无法完成尽调
          tone: negative
          claimRefs:
            - CV026
        - id: competitive-risk
          label: |-
            竞争压力
            （Microsoft、Zapier、超大规模云厂商）
          detail: Power Automate 捆绑销售；Zapier 规模为 n8n 的 7×；AI 原生替代品快速涌现
          tone: negative
          claimRefs:
            - CV035
        - id: recommendation
          label: |-
            观察 / 跟踪
            （Series C 价格下不是买入）
          detail: 升级触发条件：ARR >$200M、NRR >115%、毛利率 >70%、SAP 采用得到确认
          tone: neutral
          claimRefs:
            - CV032
      edges:
        - from: market-scale
          to: recommendation
          label: 支撑
        - from: arr-growth
          to: recommendation
          label: 部分支撑
        - from: sap-channel
          to: recommendation
          label: 期权价值
        - from: valuation-stretch
          to: recommendation
          label: 约束
        - from: absent-economics
          to: recommendation
          label: 约束
        - from: competitive-risk
          to: recommendation
          label: 约束
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV010
      - CV023
      - CV026
      - CV029
      - CV032
      - CV035
  - id: FV002
    title: 按情景拆分的估值敏感性——n8n 隐含估值 vs. Series C 入场价
    type: bar
    layout: standard
    summary: |
      柱状图对比五种 ARR × 倍数情景下的 n8n 隐含估值，以及 October 2025 Series C $2.5B 参考入场价和 May 2026 SAP $5.2B 标记估值。
    data:
      items:
        - label: |-
            悲观情景
            （$80M ARR × 10×）
          value: 0.8
          unit: B USD
          detail: ARR 同比增速降至 <2×；被竞争对手替代；AI 热潮回调。比 Series C 低 68%。
          claimRefs:
            - CV022
        - label: |-
            低基准情景
            （$120M ARR × 18×）
          value: 2.2
          unit: B USD
          detail: 增长温和延续；SAP 渠道没有贡献；倍数小幅压缩。
          claimRefs:
            - CV037
        - label: |-
            基准情景
            （$200M ARR × 25×）
          value: 5
          unit: B USD
          detail: ARR 继续 2× 增长；SAP 渠道部分起量；与 SAP 标记估值一致。
          claimRefs:
            - CV028
            - CV037
        - label: |-
            高基准情景
            （$250M ARR × 28×）
          value: 7
          unit: B USD
          detail: SAP 渠道贡献强；NRR 超过 120%，验证品类强度。
          claimRefs:
            - CV021
        - label: |-
            乐观情景
            （$300M ARR × 30×）
          value: 9
          unit: B USD
          detail: SAP 渠道放量；NRR >125%；企业销售执行跑通。较 Series C 为 3.6×。
          claimRefs:
            - CV021
        - label: |-
            Series C 入场价
            （October 2025）
          value: 2.5
          unit: B USD
          detail: 参考：Accel 领投财团按 $2.5B 投后估值融资 $180M。
          claimRefs:
            - CV001
    claimRefs:
      - CV021
      - CV022
      - CV028
      - CV037
  - id: FV003
    title: 估值和回报区间——乐观 / 基准 / 悲观 vs. Series C 入场价
    type: range
    layout: standard
    summary: |
      以 October 2025 Series C 入场价（$2.5B）和 May 2026 SAP 标记估值（$5.2B）为锚，展示三种情景下的低 / 基准 / 高估值区间，以及相对 Series C 入场价的隐含回报倍数。
    data:
      items:
        - label: n8n 隐含估值——悲观情景
          low: 0.5
          mid: 0.8
          high: 1.2
          unit: B USD
          lowSource: $50M ARR × 10× (severe deceleration)
          highSource: $120M ARR × 10× (mild deceleration, low multiple)
          confidence: low
          claimRefs:
            - CV022
        - label: n8n 隐含估值——基准情景
          low: 3.5
          mid: 5
          high: 6.5
          unit: B USD
          lowSource: $140M ARR × 25× (growth moderates)
          highSource: $220M ARR × 29× (growth continues, multiple expands)
          confidence: medium
          claimRefs:
            - CV028
            - CV037
        - label: n8n 隐含估值——乐观情景
          low: 7
          mid: 9
          high: 12
          unit: B USD
          lowSource: $280M ARR × 25× (growth continues, multiple static)
          highSource: $400M ARR × 30× (SAP channel breakout)
          confidence: low
          claimRefs:
            - CV021
        - label: 相对 Series C 入场价（$2.5B）的回报倍数
          low: 0.2
          mid: 2
          high: 4.8
          unit: × return
          lowSource: 'Bear scenario: $0.5B / $2.5B entry = 0.2×'
          highSource: 'Bull scenario: $12B / $2.5B entry = 4.8×'
          confidence: low
          claimRefs:
            - CV031
        - label: SAP 投资标记估值（May 2026）
          low: 5.2
          mid: 5.2
          high: 5.2
          unit: B USD
          lowSource: Highland Europe press release May 12, 2026
          highSource: Single disclosed data point; no range
          confidence: medium-high
          claimRefs:
            - CV004
    claimRefs:
      - CV004
      - CV021
      - CV022
      - CV028
      - CV031
      - CV037
  - id: FV004
    title: 投资 KPI 评分卡——n8n 的七项尽调维度
    type: kpi
    layout: compact
    summary: |
      面向投委会的 n8n 评分，覆盖成长阶段 AI 基础设施投资最关键的七项尽调维度。评分反映截至 2026-05-25 的证据质量。
    data:
      items:
        - label: 市场机会（TAM / 结构性增长）
          value: 4 / 5
          detail: 市场规模大且在增长（$100B+ 超自动化 TAM）；AI 驱动形成结构性顺风；赛道拥挤且处于 Gartner 幻灭低谷，略扣分
          claimRefs:
            - CV001
        - label: 产品 / 技术验证
          value: 4 / 5
          detail: 1,000+ 集成、189K GitHub 星标、100M+ Docker 拉取；企业级加固 v2.0 于 Dec 2025 发布；Jan–Feb 2026 的 CVE 密集暴露扣 1 分
          claimRefs:
            - CV007
        - label: 客户牵引力
          value: 4 / 5
          detail: 1,400+ 企业客户、1.7M MADs、嵌入 SAP OEM；ACV 从 $13K（Oct 2025）升至 €71K（May 2026）；企业客户数口径变化留下疑问
          claimRefs:
            - CV008
            - CV038
        - label: 单位经济证据
          value: 1 / 5
          detail: NRR、毛利率、烧钱速度、流失率、CAC 均无公开数据；所有估算都来自第三方基准；这是最大的单一尽调缺口
          claimRefs:
            - CV026
        - label: 风险画像
          value: 3 / 5
          detail: 60 天窗口内出现 5 个 CVE（CVSS 9.4–10.0）；SUL 许可风险；唯一创始人依赖；财务不透明；SAP 战略协同部分抵消这些风险
          claimRefs:
            - CV034
        - label: 估值 vs. 可比公司组
          value: 2 / 5
          detail: Series C 的 62× ARR 比未上市 AI-SaaS 的最高溢价还高 3–4×；SAP 标记估值下的 50× 略好；显著高于上市可比 UiPath 的 2.2× EV/ARR
          claimRefs:
            - CV018
            - CV010
        - label: 证据质量
          value: 3 / 5
          detail: 融资轮和 ARR 口径有强一手来源支撑；缺少审计财务和单位经济数据，限制所有财务预测的可信度
          claimRefs:
            - CV009
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV009
      - CV010
      - CV018
      - CV026
      - CV034
      - CV038
