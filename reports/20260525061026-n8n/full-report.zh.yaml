      - number: '7.4'
        title: 财务不透明、创始人依赖与执行风险
        blocks:
          - type: paragraph
            body: >
              n8n 是私营公司，没有义务发布经审计财务报表。独立来源对其 2025–2026 年 ARR 的估计从约 $40M 到 $169.6M 不等，差距达到 4×，这正是不透明问题的体现。Sacra 的标准模型估计
              2025 年初 ARR 为 $40M；Growjo 和 CompWorth 基于员工数模型给出的数字最高接近 $170M。n8n CEO Jan Oberhauser 在 2025 年 12
              月访谈中确认收入在“高速增长”，但没有发布经审计数字。 截至 runDate（2026 年 5 月），英国 Companies House 的 2025
              年年报尚未提交；这符合英国申报时间线，却没有提供新的独立验证。 没有披露财务数据，单位经济性（CAC、LTV、分细分市场毛利率、烧钱速度）就无法独立核验。Sacra 估计毛利率 >75%，与 SaaS
              常态一致，但这是模型假设，不是披露数字。

              员工数从 2024 年约 109 人扩张到 2026 年 800+ 人，增幅 7×，意味着短期烧钱速度可能显著高于确认收入。累计融资约为 $240M（截至 Series C）加上 SAP
              未披露金额的战略投资。如果员工扩张主要由 Series C（$180M，2025 年 10 月）供血，且 800 名员工按 Berlin / SF / 远程市场薪酬计算，在计入研发、GTM
              和基础设施成本前，年度薪酬就超过 $80–100M，那么从 Series C 完成起，公司的现金跑道估计为 18–30 个月——前提是收入加速能够覆盖差额。收入增长极强（2025 年
              10×），但可比基数较低，轨迹也无法独立验证。ARR 增长一旦放缓，或竞争性定价压力上升，实际现金跑道都可能缩短。

              Jan Oberhauser 是公司的唯一创始人、公众面孔和战略决策者。2025 年 12 月接受 tech.eu 采访时，Oberhauser 明确承认接班风险：“我真切意识到，也许 IPO
              后的某个时候，换别人来做可能是合理的。” Sequoia Capital 的投资播客确认，公司的 AI 转向、社区策略和竞争护城河都由 Oberhauser 的个人愿景塑造。他的背景是视觉特效而非企业软件，
              这意味着管理团队在 B2B SaaS 扩张中的制度化深度——销售领导、企业合规、国际 GTM、资本市场准备——尚未被独立评估。如果 Oberhauser
              离开、遭遇健康问题或失去聚焦，平台叙事和战略执行都可能在关键的企业采用阶段受到实质冲击。

              GTM 与客户集中风险也部分被不透明性遮住。n8n 云渠道组合估计为 55% 云订阅、30% 企业自托管许可、15% OEM / 嵌入式合作（Sacra）。SAP 嵌入式合作虽然没有公开规模，但考虑到 SAP
              企业客户基数，未来收入占比很可能不成比例地高。重度集中于一个战略伙伴，会带来双边谈判风险； 随着 n8n 对该合作的收入依赖上升，SAP 既有杠杆，也有动力重新谈判条款。企业客户数（截至 2026 年 5 月约
              1,400 家）令人鼓舞，但平均合同价值、前 10 大客户集中度、分细分市场流失率和 NRR 都未披露。Felicis 档案提到，“自下而上，从建设者走向企业” 的 GTM
              是预期飞轮，但高端客户转化效率无法验证。
