      - number: '1.5'
        title: 里程碑、风险因素与反向进展
        blocks:
          - type: paragraph
            body: >
              n8n 的历史既有增长里程碑，也有几起需要尽调关注的反向事件。

              2026 年 1 月，Endor Labs 安全研究人员发现一场针对 n8n 生态的协同供应链攻击：威胁行为者发布了 8 个恶意 npm 包，伪装成 n8n 社区节点集成（例如 Google
              Ads、性能指标）。这些包一旦安装在自托管 n8n 实例上，就会把解密后的 OAuth token 和 API key 外传到攻击者控制的服务器。这次攻击值得注意，因为 n8n 社区节点与 n8n
              本体拥有同等权限级别——节点代码和 n8n 运行时之间没有沙箱隔离——使平台天然成为吸引供应链攻击者的“集中式凭证保险库”。

              同期，CVE-2026-21858（“Ni8mare”）披露：这是 n8n webhook 处理逻辑中的最高严重级别（CVSS 10.0）未认证文件读取漏洞，可升级为完整远程代码执行。估计超过 100,000
              台暴露在公网的 n8n 服务器存在风险。唯一修复方式是升级到 1.121.0 或更高版本。

              fair-code/Sustainable Use License 长期引发社区争议。批评者认为，这种模式构成“开源洗白”（open-washing）：一边按开源营销产品，一边限制关键 OSS
              自由，尤其是基于代码库构建商业 SaaS 的权利。据报道，商业 SaaS 用途的企业许可证年费起步在
              $15,000–$50,000+，对小型厂商门槛很高。定价调整和按量执行模型变化也引发过社区反弹，带来长期许可稳定性疑问。

              这些风险会实质影响企业采用：安全事件损害信任，尤其是在受监管行业；许可不确定性则影响 n8n 增长飞轮所依赖的社区生态。
