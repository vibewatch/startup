  - id: TE003
    title: 技术与运营架构
    columns:
      - 层级 / 组件
      - 角色
      - 技术 / 依赖
      - 风险
    rows:
      - - 可视化工作流编辑器（前端）
        - 所见即所得画布用于创建工作流；将图转换为 JSON 工作流定义
        - Vue.js；需要现代浏览器；通过 REST API 提交到后端
        - 复杂工作流有学习曲线；超大图（1,000+ 节点）下 UI 响应可能变慢
      - - 工作流执行引擎（后端）
        - 按拓扑顺序执行节点；传递数据；处理错误；执行重试逻辑
        - Node.js + TypeScript；每次运行在内存中执行；可选队列模式支持分布式执行
        - 单实例模式下，Node.js 单线程事件循环形成并发天花板；生产规模需要队列模式
      - - 消息代理（队列模式）
        - 解耦触发接收与工作流执行；维护待执行队列；防止重复运行
        - Redis（BullMQ 库）；队列模式必需；生产环境必须配置高可用
        - 未集群化时 Redis 会成为单点故障；所有 worker 的加密密钥必须一致
      - - 持久化层
        - 存储工作流定义、执行历史、凭据（加密）、用户数据和变量
        - PostgreSQL 13+（生产）；SQLite（仅开发 / 测试；队列模式不支持）；所有 worker 共享
        - 加密密钥泄露会解密全部已存凭据；密钥轮换带来运营复杂度
      - - Worker 实例
        - 执行从 PostgreSQL 拉取的工作流图；向 Redis 回报完成状态；可横向扩展
        - 独立 Node.js 进程；与主进程同一代码库；通过增减 worker 容器扩缩容
        - 队列模式下二进制数据不能使用本地文件系统；需要 S3 外部存储
      - - 社区节点运行时
        - 将第三方 npm 包作为工作流节点执行；没有沙箱边界
        - npm registry；任意 Node.js 代码可完整访问进程（环境变量、文件系统、网络）
        - 与 n8n 运行时没有隔离；恶意节点可外传全部已解密凭据；构成供应链攻击向量
      - - AI 编排层
        - 在工作流图内完成 LLM 调用、工具调用、记忆、RAG 和多步智能体循环
        - LangChain.js（原生集成）；OpenAI/Anthropic/Google API；向量数据库（Pinecone、Weaviate、Milvus）；通过 Ollama 运行本地 LLM
        - LLM API 成本和速率限制增加可变运营成本；接入本地 LLM 需要 GPU 基础设施
    notes: |
      架构细节来自 n8n 官方文档（docs.n8n.io）和 jimmysong.io 深度分析（2026）。队列模式依赖图反映 n8n 公开记录的生产环境推荐拓扑。
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE006
      - CE007
      - CE019
      - CE020
      - CE021
