        - 全球 / 欧盟 / 美国
        - 活跃；自 2022 年 3 月起通过合同执行
        - 中——代理 / MSP 渠道中灰色地带场景常见
        - 高——若违约，将失去商业部署权；社区可能分裂
        - 取得书面商业许可或 Embed 许可；避免依赖社区解读
        - 中——SUL 歧义无法靠公开文档解决；需要邮件升级确认
        - 要求 n8n 提供标准商业许可协议；书面确认允许用途；询问历史执行案例
      - - GDPR / 欧盟数据处理者义务（n8n Cloud 客户）
        - 欧盟 / EEA / 英国
        - 持续合规义务；n8n Cloud DPA 已存在
        - 云端低（DPA 已到位）；自托管中（客户是控制者）
        - 高——严重 GDPR 违规最高可罚全球年营业额 4%
        - 审阅 n8n Cloud DPA；评估分处理者清单；落地数据驻留控制
        - 中——分处理者清单并非公开实时更新；工作流凭据处理涉及 GDPR 敏感点
        - 向 n8n 要求当前数据处理协议、分处理者清单和 GDPR 违规通知流程
      - - n8n Cloud 缺少 SOC 2 / ISO 27001 认证
        - 美国 / 欧盟（企业采购）
        - 按 2026 年路线图推进中；截至 2026-05-25 未发布正式鉴证
        - 高——许多企业采购流程要求供应商认证
        - 高——受监管行业（金融、医疗、政府）采购会被卡住
        - n8n 2026 路线图目标包含 SOC 2 和 ISO 27001；时间表和范围未确认
        - 高——缺失会在许多 RFP 中造成硬性淘汰；竞争对手（Workato）已认证
        - 要求 n8n 提供正式鉴证证据或承诺时间表；结合部署敏感度评估风险
      - - CVE 披露义务与协调漏洞报告
        - 全球（CVSS/NVD）
        - n8n 正通过 GitHub Security Advisories 和 NVD 主动报告；2026 年 1–2 月的 60 天窗口内披露 5 个严重级 CVE
        - 高——持续存在；架构复杂度带来反复出现的漏洞面
        - 严重——未经认证的 RCE（CVSS 10.0）可完全接管实例
        - 保持 n8n 版本更新；订阅安全公告；强制网络分段
        - 高——原修复 3 个月内出现补丁绕过（CVE-2026-25049），说明架构债务
        - 要求 n8n 提供渗透测试结果和代码审计状态；确认 webhook 处理和表达式求值的架构修复计划
      - - 英国 Companies Act 申报义务（n8n Ltd 子公司）
        - 英国
        - Companies House 已确认申报历史；当前年度申报尚未到期
        - 低——常规合规义务
        - 低——逾期申报仅有行政处罚
        - 自动监控 Companies House 申报
        - 低——常规申报不构成重大法律敞口
        - 审阅 Companies House 申报，寻找董事构成、担保或决议的重大变化
    notes: |
      按严重性排序。严重性评级基于截至 2026-05-25 的公开证据。GDPR 和 SOC 2 发现是结构性缺口，不代表已确认违规。
    enumerationScope:
