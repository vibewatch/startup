  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 估值背景与融资历史
        blocks:
          - type: paragraph
            body: >
              2025 年 3 月到 2026 年 5 月，n8n 的估值轨迹是欧洲科技史上最压缩的连续跃升之一。2025 年 3 月 Series B 融资 €55M，投资方包括 Highland
              Europe、Sequoia、Felicis 和 HV Capital，对 n8n 的估值约为 €300M（$355M）。 七个月后的 2025 年 10 月，公司完成由 Accel 领投的 $180M
              Series C，投后估值 $2.5B，单轮估值跃升 7×。 Accel 与 Insight Partners 的竞争性竞价战（后者据报道给出约 $2.9–3.0B
              的投前估值）把最终价格推高到任何单一买方基本面分析都不会给出的水平。 Sifted 率先披露预公告数字，并把这轮融资描述为反映“投资人 FOMO”；其还报道称，在 2025 年 8 月签署 term sheet
              时，n8n 收入已超过 $40M——n8n 拒绝确认，但也没有否认。

              2026 年 5 月，SAP 战略投资给出的隐含估值为 $5.2B——据报道约 $60M 以老股购买形式完成，并配套多年 OEM 商业协议，将 n8n 嵌入 Joule
              Studio——这是最近一次公开定价标记。该投资于 2026 年 5 月 12 日在 Orlando 的 SAPPHIRE NOW 宣布。交易后，SAP 持有 n8n 约 1.3%。估值从 $2.5B 跳到
              $5.2B，支撑因素是披露 ARR 从 Series C 时的 >$40M 增至 SAP 交易时的 >€100M，大约七个月内收入增长约 2.5×。算术上：$5.2B / €100M ARR ≈ 50×——相比
              Series C 的 62× 有小幅压缩，但仍显著高于可比私营 SaaS 公司的基本面基准。

              截至 runDate 2026-05-25，已披露累计融资超过 $300M：Series B 完成前约 $73M、Series C $180M，以及估计 $60M 的 SAP 投资。机构投资人名单包括
              Accel、Sequoia、Meritech、Redpoint、NVentures（NVIDIA）、Highland Europe、HV Capital、Felicis、T.Capital（Deutsche
              Telekom）和 SAP，构成欧洲自动化公司获得过的最深企业 SaaS 财团之一。截至 2026-05-25，n8n 英国 2025 年备案仍未提交，符合 UK Companies Act
              法定时间线；公开领域没有经审计财务数据。 这种治理不透明——公开材料里没有具名 CFO、CTO 或 CCO——提高了任何投资人应计入非公开财务主张的尽调风险溢价。
