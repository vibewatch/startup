      - 对手方
      - 角色
      - 集中度
      - 失效场景
      - 严重性
      - 缓释措施
      - 剩余敞口
    rows:
      - - SAP Joule Studio 战略投资与嵌入
        - SAP SE
        - 战略投资方、OEM 合作伙伴、面向 300,000 家 SAP 企业客户的分销渠道
        - 高——SAP 关系是已公布的最大增长催化剂；财务条款未披露
        - SAP 收购竞争性自动化平台；SAP-n8n 集成未能在 2026 年 Q3 前实现 GA；随着依赖加深，SAP 重新谈判更有利的收入条款
        - 严重——SAP 关系可能代表企业 TAM 扩张的 20–40%；若终止，将拿掉定义投资逻辑的催化剂
        - n8n 多渠道策略（直接云、直接自托管、社区）提供部分基线独立性
        - 高——随着 SAP 集成加深，集中风险上升；合同排他条款未披露
      - - 用于社区节点交付和发现的 npm 生态系统
        - npm Inc.（GitHub/Microsoft 旗下）
        - 500+ 个社区节点的包注册表与发现基础设施
        - 中——所有社区节点安装都经由 npm；已确认恶意包事件
        - npm 注册表滥用（如 2026 年 1 月所见）；包名抢注；npm CDN 中断导致节点安装受阻
        - 高——供应链攻击把 npm 作为主要载体；没有替代社区节点注册表
        - 2026 年 5 月起执行加密来源证明校验；高安全部署可设置 N8N_COMMUNITY_PACKAGES_ENABLED=false
        - 高——架构上依赖 npm 的信任模型；无论来源证明如何，都没有运行时沙箱
      - - AI 模型提供商（OpenAI、Anthropic、Google Gemini）
        - OpenAI、Anthropic、Google
        - LLM 与向量嵌入 API 提供商，支撑 n8n 75%+ 的 AI 功能使用
        - 中——n8n 设计上不绑定模型；客户自行选择提供商
        - 提供商 API 破坏性变更；速率限制调整；价格上涨；服务中断冲击智能体工作流
        - 中——n8n 模型无关设计提供切换弹性；风险转移给客户
        - n8n 的提供商无关架构（可接入任意 LLM）是设计好的缓释因素
        - 低——提供商锁定发生在客户层，不在 n8n 层；n8n 财务上不依赖 AI 提供商关系
      - - n8n Cloud 的云基础设施提供商（AWS、GCP、Azure）
        - AWS（主）、GCP、Azure
        - n8n Cloud 托管 SaaS 的计算、存储、数据库、网络
        - 中——声称多云部署，但主提供商集中度很常见
        - AWS us-east-1 区域故障导致 n8n Cloud 停机；云提供商调价
        - 中——n8n Cloud SLA 包含 99.99% Enterprise 正常运行时间承诺；标准云风险
        - Enterprise 层多区域部署；标准云韧性最佳实践
        - 低中——行业标准云依赖风险；n8n Cloud SLA 提供合同救济
      - - 关键技术贡献者与开源社区
        - GitHub 社区，450+ 贡献者、189,000+ 星标
        - 缺陷修复、社区节点、模板、文档、集成
        - 低——贡献者基础广；没有单一贡献者主导
        - 核心贡献者离开，或社区因许可分裂；出现获得显著采用的分叉项目
        - 中——社区分裂削弱自然增长；成功分叉项目抢走开发者心智
        - fair-code 许可保留源代码可见性；n8n 品牌认知度高
        - 中——Sustainable Use License 持续激励想要宽松许可的开发者推动分叉
    notes: |
      按严重性排序。鉴于对投资逻辑的不对称影响，SAP 集中风险被评为最高。由于 2026 年供应链事件已确认，npm 依赖风险评为高。
