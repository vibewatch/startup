  - id: TV005
    title: 论点击穿与终止触发项表
    columns:
      - 触发项
      - 阈值 / 事件
      - 对论点的传导
      - 行动含义
    rows:
      - - ARR 增长放缓
        - 2026 年底前任意时间点，ARR YoY 增长连续两个季度 <2×
        - Series C 的 62× 倍数按 ARR 年增 3–5× 定价；任何降至 <2× 的放缓都会实质削弱牛市情景，并让基准情景变得勉强
        - 下调至卖出 / 回避；按放缓后的 ARR 轨迹隐含新倍数重新评估
      - - 披露 NRR 低于 100%
        - 首次披露的 NRR（如 IPO 文件或投资人更新）低于 100%，说明现有客户净收入收缩
        - NRR 低于 100% 说明产品留存差，也意味着 $40M ARR 基础不可持续；从根本上击穿扩张收入论点
        - 退出，或拒绝参与任何按当前或更高估值进行的后续轮次
      - - SAP 渠道失败或终止
        - SAP 宣布 Joule Studio GA 推迟至 2026 年 Q4 之后、终止或重谈商业协议，或收购竞争性编排平台
        - SAP OEM 渠道是支撑 $5.2B 标记估值的近期主要收入倍增器；一旦缺失，$5.2B 与基本面可支撑估值之间的桥会坍塌
        - 下调评级；估值回到纯 ARR 增长模型，按基准情景 ARR 最好也只隐含 $3–5B
      - - 超大规模云厂商免费层竞争进入
        - Microsoft、Google 或 AWS 宣布类似 AI 工作流编排产品，以零边际成本捆绑进现有企业合同（类似 Power Automate 捆绑 M365）
        - n8n 相对 Zapier 的结构性优势是价格；如果超大规模云厂商以零价格商品化，n8n 的定价护城河会消失，社区护城河也未必足以留住企业交易
        - 将所需 NRR 门槛提高到 >130%，并把可接受远期倍数从 25× 降至 15×
      - - 治理或管理层断裂
        - Jan Oberhauser 在 Series C 交割后 24 个月内（截至 2027 年 10 月）离任或长期休假，且没有公开指定可信继任者；或新任命的 CFO/CTO 等高管与当前财务声明相矛盾
        - 缺少具名高管、依赖独立创始人的业务，在最关键执行关口（从 PLG 转向企业销售打法）带来关键人风险
        - 列入观察，并要求 60 天内披露管理层信息；下调信心评级并重估
    claimRefs:
      - CV033
      - CV027
      - CV029
      - CV040
    notes: 终止触发项是预警指标；阈值仅作示例，应在实际财务披露后重新校准。
    sourceRefs:
      - SV001
      - SV007
      - SV009
      - SV017
      - SV026
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 净收入留存（NRR）
        - 至少 3 个年度客户分群的 NRR，按年份拆分；另列总收入留存（GRR）
        - NRR 是 SaaS 估值最强单一预测变量——在 ARR 相同情况下，NRR 高于 120% 的公司估值比 NRR 低于 100% 的公司高 2–3×；没有 NRR，62× 倍数无法评估
        - 向 n8n 数据室索取；若无法提供，标记为高严重度缺口，并对任何估值报价施加 30% 尽调折价
      - - 按产品渠道拆分的毛利率
        - 云订阅毛利率；企业许可毛利率；SAP/OEM 嵌入式毛利率；综合毛利率
        - AI agent 工作负载会产生不成比例的执行算力成本；若云毛利率低于 65%，相较毛利率 80%+ 的 SaaS 同业，ARR 倍数框架会高估内在价值
        - 财务数据室；与 Sacra 估算的 >75% 基准交叉验证
      - - SAP 商业协议——最低保证收入
        - 多年期 SAP 商业协议下的最低承诺收入、收入分成结构、排他条款和终止权
        - 如果 SAP 交易只是尽力而为的 OEM、没有最低承诺，其估值支撑弱于照付不议安排；$5.2B 的 SAP 标记估值会受到这一差别的实质影响
        - 法律和商业数据室；在 NDA 下向 n8n 索取；验证 SAP 的会计处理
      - - 现金消耗率与资金续航期
        - 按当前员工数（2025 年底 923+ 人）计算的月度现金消耗率；基于累计融资现金估算资金续航期；FY2025 经营现金流
        - 923 名员工、全口径成本约 $100–130K/年，仅年化薪酬现金消耗就超过 $92M，还未计入基础设施和管理开销；资金续航期不足会迫使稀释性融资或触发债务契约违约
        - 财务数据室；可用时与 Companies House 备案交叉核对；用员工数和公开薪酬数据三角验证
      - - 前 10 大客户收入集中度
        - 前 10 大客户收入拆分；最大单一客户占 ARR 比例；来自 Fortune 500、中端市场和 SMB 的 ARR
        - 若任一单一客户超过 ARR 的 10%，将形成集中度风险，并使有效估值倍数降低 20–40%（Livmo 2026 分析）；SAP 同时成为投资方和客户，可能带来双重集中度风险
        - 财务数据室；确认 SAP 的嵌入式部署是否计入 ARR 以及如何确认收入；索取带匿名 ARR 区间的企业客户名单
    claimRefs:
      - CV026
      - CV031
      - CV042
    notes: 尽调问题按信息不对称程度排序；部分事项可能由未来公开披露解决。
    sourceRefs:
      - SV001
      - SV011
      - SV025
      - SV023
