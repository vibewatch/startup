      - number: '1.4'
        title: 规模指标与客户牵引
        blocks:
          - type: paragraph
            body: >
              n8n 在 2025 年 10 月宣布 Series C 时披露，活跃用户超过 230,000，企业客户超过 3,000。仅 2025 年，公司用户增长 6x、收入增长 10x，延续了 2022 年战略性 AI
              转向后的加速趋势。按 GetLatka 数据，截至 2025 年 8 月，年经常性收入（ARR）超过 $40M，高于 2024 年中约 $7.2M——一年内 ARR 大约增长 5x。更早的增长里程碑包括 2025
              年 7 月突破 $26.5M ARR。

              已披露的企业客户包括 Vodafone、SoftBank、Volkswagen、Delivery Hero、Decathlon、KPMG、Twitch 和 Musixmatch。n8n 披露，Delivery
              Hero 每月节省 200 小时；Musixmatch 在 4 个月内节省了 47 天工程工作量。

              截至 2025 年 3 月 Series B 宣布时，GitHub 仓库 star 数已超过 70,000，并长期位列史上前 150 个 GitHub 项目。该仓库 Docker 拉取量累计超过 100
              million 次。到 2025 年，n8n 上构建的工作流超过 80% 涉及 AI 智能体节点，而 2022 年转向前几乎为零。按可得数据，npm 周下载量超过 500,000。

              员工数在不同来源间不一致：Craft.co 和 The Official Board 列出的高管团队数据指向约 300 人团队；Growjo 和 LeadIQ 在计入远程和国际承包商后估算总员工数超过
              800。真实数字很可能落在两者之间，反映 Series B 和 Series C 后 2025 年招聘快速扩张。
