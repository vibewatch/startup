  - id: TR004
    title: 人员与执行风险登记表
    columns:
      - 角色 / 职能
      - 依赖或缺口
      - 可能性
      - 严重性
      - 缓释措施
      - 尽调路径
    rows:
      - - Jan Oberhauser——唯一创始人、CEO、战略决策者、公众代表
        - 所有重大策略、产品愿景、AI 转向、社区信任和投资人叙事都绑定唯一创始人；没有具名联合创始人或公开继任计划
        - 低中——Oberhauser 42 岁、健康；最可能的触发因素是自愿离职
        - 严重——失去创始人会在拐点削弱公司叙事、社区信任和 AI 产品方向
        - Sequoia/Accel/Felicis 董事会参与推动继任规划；Oberhauser 已承认 IPO 后继任；高管团队正在搭建
        - 要求组织架构图、CTO/CPO/VP Sales 直接下属任期和董事会继任计划；评估第二梯队领导层深度；直接询问 Oberhauser 未来 3 年个人计划
      - - 企业销售与商业化领导力
        - 从开发者社区走向 Fortune 500 企业销售，需要另一套能力；公开信息中没有具名 VP Sales、CCO 或 CRO
        - 中——典型规模化阶段缺口；自下而上的销售动议在企业合同规模上有上限
        - 高——若无法扩展企业销售，会限制收入潜力，并支撑估值压缩
        - SAP 合作伙伴关系提供企业分销，不需要直接销售队伍；社区驱动增长补位
        - 要求具名商业领导层、承担配额的 AE 人数、平均企业交易周期，以及相对 Workato 和 Make.com 的胜率
      - - 安全工程与事故响应能力
        - 60 天内 5 个严重级 CVE；3 个月内出现补丁绕过，暗示安全工程带宽受限；800+ 员工数不能说明专职安全团队规模
        - 高——严重级 CVE 持续高频出现，说明结构性安全债务累积快于偿还
        - 高——若再出现另一个 CVSS 10 未认证 RCE 且补丁延迟，会造成重大客户流失和媒体伤害
        - 社区节点来源证明校验；安全公告承诺架构安全路线图
        - 要求安全工程团队规模与职责；外部渗透测试节奏和最近报告；PSIRT（产品安全事件响应团队）是否存在以及 SLA 承诺
      - - 7× 员工数增长后的工程扩张与团队整合
        - 员工数在 18 个月内从约 109 人增至 800+；快速招聘带来入职、文化和质量控制风险；每周发布节奏可能放大集成错误
        - 中 — 典型高增长执行风险；强工程文化可部分缓释
        - 中 — 代码质量回退或技术债加速，可能拖慢功能迭代或增加安全事件
        - n8n 的 GitHub 指标（189,000 个星标、活跃贡献者基础）显示其对工程师有吸引力；每周发布说明 CI/CD 正常运转
        - 索取 2025 年入职工程师流失率；若有收购能力，要求提供并购后整合计划；复核 GitHub 提交速度和 issue 积压账龄
      - - 财务与监管合规负责人
        - n8n 是私营公司，公开资料未披露 CFO、总法律顾问或合规负责人；2026 年员工扩张需要机构化财务控制
        - 中 — Series C 后期常见缺口；SAP 战略投资可能加快制度化成熟
        - 中 — 缺少正式财务控制，可能拖慢 IPO 准备或带来审计复杂性
        - 投资方董事会监督可部分补位；SAP 合作意味着已完成财务尽调
        - 确认是否设有 CFO 和总法律顾问及其任期；索取最近一次经董事会审阅的财务报表；确认是否有内审职能或外部审计师关系
    notes: |
      按严重程度排序。高管团队构成信息来自截至 2026-05-25 的公开资料和新闻报道；n8n 未发布完整高管团队页面。
