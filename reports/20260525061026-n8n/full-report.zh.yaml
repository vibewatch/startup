      - number: '4.2'
        title: 增长轨迹与财务规模估算
        blocks:
          - type: paragraph
            body: >
              n8n 的 ARR 增长轨迹，是这家公司最关键的财务特征，也是支撑其估值倍数的核心理由。公开数据点拼出一条连贯的上行曲线：2024 年 6 月 ARR 为 $7.2M（GetLatka），2025 年 7 月
              ARR 为 $26.5M（GetLatka 里程碑），2025 年 8 月签署 Series C 条款清单时 ARR 超过 $40M（Sifted、Bloomberg 确认，公司拒绝否认也提供了佐证）。n8n
              自称，截至 2025 年 10 月交割前一年，收入增长 10 倍。到 2026 年 5 月 SAP 战略投资时，公司披露 ARR「超过 €100M」——这意味着约 9 个月增长约 2.5 倍。独立分析师对
              2026 年末 ARR 的预测，从保守的 $60M 到 $80M，到公司口径隐含的超过 €100M 不等。

              除 ARR 外，用户增长信号也验证了漏斗规模。Series C 时，活跃用户到 2025 年 10 月增至 230,000+。到 2026 年 5 月，月活开发者和构建者社区扩大到 1.7
              million——这个口径把免费自托管用户和社区贡献者也计入，同时包括云订阅用户。企业客户数出现口径切换：2025 年 10 月报告为 3,000+，到 2026 年 5 月收窄为
              1,400+。表面下降更可能是把「enterprise」重定义为更大、更高 ACV 的账户，而不是实际总流失，但这个差异未经确认，是一个尽调问题。在 $40M ARR、3,000+
              企业账户下，隐含平均合同价值约为 $13,300/年，符合中端市场账户特征。如果 1,400 家企业客户和 €100M ARR 的口径准确，隐含 ACV 已升至约
              €71,400，抬升幅度很大，意味着该队列内扩张收入很强。

              n8n 的员工数增长为财务轨迹和成本底线提供了独立信号。Revelio Labs 数据显示，员工数从 2023 年的 228 人、2024 年的 423 人，增至 2025 年底的 923 人，同比增长
              74.3%。2025 年活跃招聘岗位达到 406 个，较 2024 年的 40 个增长 164%。如果招聘节奏在 2026 年哪怕只延续此前速度的一部分，本报告运行日的员工数也很可能超过 1,000
              人。按一家软件公司偏欧洲薪酬加福利、平均完全负担雇佣成本估计为 $100,000–$130,000/年计算，1,000 名员工意味着在基础设施、营销和管理开支之前，单薪酬驱动的烧钱底线就约为
              $8–10M/月。公开成本数据仍不足以有把握地三角定位烧钱速度。

              估值轨迹反映了资本市场的判断。2025 年 3 月 Series B 对 n8n 的估值约为 €300M（$355M）。2025 年 10 月 Series C 对公司的估值为 $2.5B，七个月内跳升 7–8
              倍。2026 年 5 月 SAP 投资对 n8n 的估值为 $5.2B，不到七个月再翻一倍。即便放在欧洲 AI
              初创公司基准里，这样的估值上行速度也很少见，体现出投资人对品类主导地位的集中押注；Accel、Sequoia、Felicis、Highland Europe、NVIDIA、Deutsche Telekom
              以及如今的 SAP 均已持仓。反面是，隐含 ARR 倍数——Series C 约为 62 倍，SAP 交易按披露的 €100M ARR 约为 50
              倍——仍处在全球私有科技公司估值的上沿，远高于可比上市自动化公司。
