      - number: '6.2'
        title: 具名客户验证点
        blocks:
          - type: paragraph
            body: >
              n8n 的具名客户组合至少包括十个公开记录的企业部署。证据质量从高置信、独立佐证的部署（Vodafone、Delivery Hero），到 n8n
              自撰案例研究且高管引语未验证（KPMG、Icatu）不等。最强的验证组是以下四个。[CU012]

              Vodafone UK 用 n8n 替代传统 SOAR 工具，用于网络安全和威胁情报自动化，实现每年 £2.2 million 成本节省，并每年消除 5,000+ 人天手工安全运营。[CU012]
              事件响应时间从数小时降到数分钟。该部署在 FTSE 100 安全运营中心内，以生产规模处理防火墙规则管理、威胁情报数据标准化和 SOAR 式自动响应。案例研究引用了一名 Vodafone 安全团队成员在 n8n
              录制活动中的发言。

              Delivery Hero（70+ 个国家、53,000+ 名员工）自动化了包括账户恢复在内的 IT 运营：每月约 800 个锁定请求，过去每个需 35 分钟，如今通过 Okta/Jira/Google APIs
              自动化工作流路由，仅一个工作流每月就节省 200+ 小时。[CU013] 该部署被 casestudies.com、Shakudo 和 Goodspeed Studio
              等多个第三方来源独立引用，是客户组合中最强的佐证证据。

              欧洲招聘网站 StepStone 运行 200+ 个任务关键型生产工作流，覆盖候选人数据处理、职位发布分发、CRM-ATS 同步和多系统集成。[CU014] 新数据源集成时间从 2 周缩短到 2 小时（25
              倍改善）。通过自托管实现完整数据主权，满足 StepStone 的数据隐私要求。该指标具体且无歧义，但案例研究由 n8n 撰写。

              Field Aerospace 使用 n8n 自动化，把政府提案准备从 2 周（3–4 人）缩短到 25 分钟即可完成 80% 完整度的初稿。[CU019]

              在中等置信层，Fullscript（加拿大，医疗保健补充剂）全组织部署以启用 AI 工作流，报告称节省了数月员工时间。[CU015] Musixmatch（意大利，音乐科技）在 4 个月内节省 47
              天工程工作。[CU016] Icatu（巴西，保险）借助 n8n 加速开发，在竞争对手之前率先推出数字保险产品。[CU017] Seguros Bolívar（哥伦比亚，保险）为 3,000 名员工部署
              n8n，推进 AI 优先转型。[CU018] KPMG 在 n8n 营销和合作伙伴来源内容中被提及，用于公司级 HR 自动化，但没有 KPMG 自己发布的确认，是客户组合中证据质量最低的引用。[CU021]

              评价平台证据为更广客户群提供了独立覆盖。G2 聚合 274 条已验证评价，综合评分 4.7/5；AI 生成摘要强调灵活性、自托管和可视化构建器是核心优势，非技术用户学习曲线陡峭是主要弱点。[CU022]
              PeerSpot 对 n8n 评分 8.2/10，43% 评价者来自大型企业，且至少一名评价者称手工处理时间减少 70%。[CU025] Capterra 对 n8n 评分 4.6/5（43
              条评价）。Software Advice 对 n8n 评分 4.6/5。这些平台都是经验证用户评价聚合器，与 n8n 保持独立，提供了更广的客户验证覆盖。相比之下，Trustpilot 给 n8n
              3.2/5，评论提到账户删除、支持失败、执行限制意外变化，以及购买 Business 或 Enterprise 许可后「无限工作流执行」权益被移除。[CU023] Trustpilot 分布代表直接反驳
              G2/PeerSpot 正向信号的反向客户证据，应按结构性支持和产品体验缺口计权，而不只是噪音。
