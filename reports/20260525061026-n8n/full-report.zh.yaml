        title: 图表与附录
        blocks:
          - type: callout
            title: 自托管开源模式顺应监管顺风
            body: >
              GDPR、HIPAA、NIS2 以及 2026 年 EU AI Act 执法的交汇，为能以完整数据主权交付企业自动化的平台创造结构性市场顺风。n8n 的自托管 Sustainable Use
              License，使其成为受监管企业买方的默认选择之一；这些买方无法把敏感数据路由到第三方 SaaS 云。88% 的企业运行混合
              IT，数据驻留要求继续强化，自托管模式正越来越像采购要求，而非可选功能。Vodafone 已记录的 £2.2M 节省，以及 SAP 在 $5.2B 估值下的战略投资，确认了这一定位的企业级验证。
