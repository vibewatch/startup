      - number: '7.2'
        title: 许可、开源治理与法律风险
        blocks:
          - type: paragraph
            body: >
              n8n 的 Sustainable Use License（SUL）是专有的 fair-code 许可证，未获 OSI（Open Source
              Initiative）批准。源代码虽然公开可见，企业内部使用也不受限制，但如果没有 Enterprise 或 Embed 许可证，SUL 禁止商业 SaaS 转售、白标化，也禁止把 n8n
              嵌入商业服务的核心部分。2022 年从 Apache 2.0 + Commons Clause 切换以来，社区围绕这一许可模式的摩擦一直没有消失。n8n 博客当时承认，之前的安排 “造成了一些歧义和混乱”，新的
              SUL 旨在划出“更清晰的边界”——但实际执行中，社区成员仍在争论灰色地带。

              2025 年 10 月 Data Tables 功能发布后，Biggo 记录到社区许可争议重新升温。批评者认为 fair-source 许可
              “缺少真正开源软件的保护”，并担心未来出现“抽地毯”：功能被放进付费墙，或定价模式被单方面改动。 这场争论推动部分用户评估 Node-RED（Apache
              2.0）、Windmill.dev、ActivePieces 和 Tracecat 等真正的 FOSS 替代方案。n8n.io 社区论坛的活动也显示，代理机构和 MSP
              的使用边界仍然不清——这类场景下，开发者会为付费客户搭建 n8n 工作流。n8n 官方许可 FAQ 承认这种模糊性，并引导用户发邮件到 license@n8n.io 咨询，说明边缘案例无法只靠公开文档解决。

              治理架构缺口是另一项独立但相互牵连的风险。JieGou 在 2026 年 2 月的分析指出，n8n 的 HITL（human-in-the-loop） 功能只是 11 层治理基础组件里的“第 1
              层”，缺少量化治理评分、EU AI Act 映射、NIST AI RMF 映射、分级自治控制、单个智能体预算上限、威胁检测（提示注入、数据外泄）以及 SOC 2 结构化审计证据。2026 年 2 月，n8n 披露
              21+ 个安全漏洞，其中 7 个为关键 CVE；CVE-2026-25049 在三个月内绕过了 2025 年 12 月的修复——这说明架构性安全债已经超出治理工具能够弥补的范围。

              从法律和监管角度看，n8n GmbH（注册于德国柏林）及其英国子公司（Companies House 备案历史已确认）受 GDPR 约束，要求适用于所有欧盟 / 英国数据处理方。自托管 n8n
              的客户是数据控制者，需要自行负责合规；n8n 作为 SaaS 供应商时，云客户依赖 n8n 的 DPA 和子处理方名单。截至 runDate，n8n Cloud 尚未公开确认取得 SOC 2 或 ISO
              27001 认证；2026 年路线图以这些认证为目标，但正式鉴证文件尚未公开。缺少这些认证会卡住受监管行业的企业采购，因为这类买家把供应商认证作为前置条件。
