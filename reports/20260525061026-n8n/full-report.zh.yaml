      - number: '5.5'
        title: 技术差异化、竞争风险与路线图
        blocks:
          - type: paragraph
            body: >
              相比仅云端自动化同行，n8n 的主要技术差异化在于数据主权（完整自托管，包括隔离网）、开发者体验（JavaScript/Python 代码节点、npm 访问、API-first 设计和 Git 集成）以及 AI
              智能体深度（原生 LangChain 集成、70+ 个 AI 节点，定位介于简单提示词链式编排与完整自主智能体框架之间）。fair-code Sustainable Use License
              既是战略资产，也是约束：源代码可自由查看，内部使用可自托管，推动广泛采用；但没有 Enterprise 许可时，商业 SaaS 转售受限。不过，该许可不是 OSI
              认证开源，这引发了持续社区争论，也促使一些本会贡献给纯开源替代品的开发者尝试 fair-code 路线。截至 2026 年 5 月，GitHub 指标——189,000+ stars、450+ 贡献者、每周
              1.45 million+ npm 下载、累计 50 million+ 下载——显示开发者采用强劲。第三方分析师估计，25% 的 Fortune 500 公司正在把 n8n
              用于业务关键工作流，但这一数字没有得到一手来源独立验证。

              2026 年产品路线图强调三条主线。第一，Publish/Save 工作流生命周期范式——把工作流当作有版本、可部署的生产工件，提供差异视图、分阶段发布和变更控制关卡。第二，AI 治理工具：LLM 输入 /
              输出的 PII 脱敏规则、按模型设定的配额和成本控制，以及 AI 工作流部署的基于角色审批。第三，增强可观测性和合规信号：实时执行仪表板、告警集成，以及 SOC 2/ISO 27001
              合规材料。每周发布节奏（累计 1,990+ 次发布；截至 2026 年 5 月 22 日最新稳定版 v2.21.7）证明了工程速度，但也给自托管运营方带来补丁管理负担。

              n8n 技术护城河面临的主要竞争风险，是 LLM 编排商品化：Zapier、Make.com 和 Workato 都在增加 AI 智能体能力，并可能在 12–24 个月内缩小 AI 功能差距。如果 AI
              编排模式变成商品层，n8n 的差异化会收窄为自托管能力和开发者灵活性——两者的总可用市场都小于「广义自动化平台」这一主张。自托管溢价还受到托管 n8n 服务（代理商和 VPS
              型方案）的威胁，这些服务把运营负担商品化。非技术买家在 n8n、Zapier 和 Make.com 之间评估时，自托管要求和设置复杂度仍是真实采用门槛，云层只能部分解决。
