          - type: callout
            title: 安全架构与凭证保险库风险
            body: >
              n8n 的架构让它成为高价值攻击面：社区节点与平台本体以同等权限运行，且没有沙箱隔离。2026 年 1 月供应链攻击和 CVE-2026-21858 都利用了这一架构现实。随着 n8n
              在受监管行业扩大企业采用，节点隔离缺失和自托管部署打补丁困难，需要结构性修复，而不只是补丁管理。
            calloutType: risk
