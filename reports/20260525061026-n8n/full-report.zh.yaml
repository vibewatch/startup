  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与核心架构
        blocks:
          - type: paragraph
            body: >
              n8n 是一个 fair-code 工作流自动化和 AI 智能体编排平台，基于 Node.js 和 TypeScript 构建。后端工作流引擎按拓扑顺序执行基于节点的图，在每一步把结构化 JSON
              数据传递到节点之间。前端可视化编辑器基于 Vue.js 构建，提供拖拽画布；用户把触发节点（webhook、定时、轮询）连接到动作节点（API 调用、数据转换、数据库写入、AI
              模型调用），形成有向无环工作流图。子工作流允许模块化复用工作流逻辑；表达式引擎采用类似 JavaScript 的语法，让节点之间可以内联动态映射数据，不必使用代码节点。自定义 JavaScript 或
              Python 代码节点让开发者获得对 Node.js 运行时的完整编程访问权，包括导入 npm 包。

              平台内置超过 400 个由 n8n 团队维护的官方集成节点，覆盖主流 SaaS API（Salesforce、Slack、Google Workspace、GitHub、Stripe 等）、数据库、消息队列和
              AI 模型提供商。官方节点之外，npm 上的社区生态按「n8n-nodes-*」命名约定发布包；截至 2026 年，可安装集成面合计超过 500 个社区包。工作流模板超过 10,000
              个，预构建且由社区共享，显著缩短首次自动化时间。

              执行模型有两种模式。单实例模式在主 Node.js 进程内运行所有工作流执行，适合开发和小型生产部署。队列模式则推荐用于大规模生产环境：触发处理与执行解耦，工作流任务 ID 经 Redis
              消息代理路由到一组可独立扩展的 worker 实例。每个 worker 都是独立 Node.js 进程，从共享 PostgreSQL 数据库读取工作流定义，执行工作流，把结果写回 PostgreSQL，并向
              Redis 发出完成信号。worker 可动态增减且不中断服务，从而实现横向扩展。主实例与 worker 实例必须共享加密密钥，这是一个安全依赖，在多节点部署中需要谨慎管理。
