      - number: '6.3'
        title: 留存、扩张、集中度与反向证据缺口
        blocks:
          - type: paragraph
            body: >
              n8n 没有公开披露任何标准 SaaS 留存指标——NRR、GRR、年流失率或队列留存数据。[CU024] 这本身就是重大尽调缺口：对一家声称拥有 1,400–3,000 企业客户、$100M+ ARR（据
              2026 年 5 月 SAP 公告）的公司而言，在任何投资人沟通、新闻稿或创始人访谈中都没有披露 NRR，相比同等规模上市 SaaS
              同行显得突出且不典型。尽调请求应专门索取：按队列年份（2021、2022、2023、2024）拆分的 logo 留存；ACV 按十分位分布；top-10 客户集中度占总 ARR
              百分比；以及净扩张收入占前一年基数的百分比。

              即便缺少披露指标，公开证据也能识别出结构性留存逆风。自托管 Community Edition
              的无限免费能力，形成可信的降级路径：企业客户若在合同期内标准化自托管，理论上可以在已经内化平台并建立独立运营能力后，不再续签付费许可。[CU030] 不同于所有价值都通过托管服务交付的 SaaS 平台，n8n 的
              fair-code 模型意味着核心产品可以与商业关系分离。

              YipitData B2B 支出面板数据提供了目前最清楚的留存动态信号。在同时使用 n8n 和 Zapier 的中端市场及企业公司中，客户放弃 Zapier 的可能性比放弃 n8n 高
              50%——这表明在共享使用队列 中，一旦采用，n8n 的粘性强于在位竞争对手。[CU026] 但 YipitData 也指出，截至 2026 年 1 月，n8n 企业客户数已大致连续四个月持平，年支出 >$10K
              的客户占比进入平台期，说明高价值企业扩张正在停滞。[CU003]

              2025–2026 年安全事件，是最具体的企业采用反向信号。CVE-2026-21858（「Ni8mare」）CVSS 10.0，影响 1.121.0 以下版本；据 Shadowserver Foundation
              数据，截至 2026 年 1 月 11 日，59,559 个联网 n8n 实例暴露在未认证远程服务器接管风险下。[CU032] CVE-2026-25049 于 2026 年 2 月披露，显示此前 2025 年
              12 月漏洞（CVE-2025-68613）的补丁可被拥有工作流创建权限的已认证用户绕过。[CU033] The Register 报道称，Pillar Security 研究人员警告，若被利用，n8n
              Cloud 多租户架构「可能允许单个恶意用户访问其他客户的数据」。这些漏洞不是假设：利用成本低（根据 PoC，一个带有 JavaScript 解构表达式的公开 webhook 就足够），而平台处理 OpenAI
              key、Anthropic 凭证和 AWS 账户等敏感凭证。需要 SOC 2 或 ISO 27001 供应链审查的企业客户，续约时可能要求合同让步、赔偿条款，或迁移到隔离网部署。

              「logo 膨胀」这个反向角度同样重要。多个合作伙伴和聚合来源引用「3,000 家企业客户」（Goodspeed Studio、Shakudo、gitnux.org、raascloud.io）；2026 年 5
              月 SAP 新闻稿——由 n8n Series B 投资方 Highland Europe 撰写——则称「超过 1,400 家企业客户」。[CU028] 1,400 与 3,000
              的差距在各来源之间没有解释，也没有调和。n8n 自身没有发布经审计企业客户数。

              集中度风险在公开数据中不可见。没有公开来源披露 n8n ARR 中有多少百分比来自 top 10 或 top 25 客户。[CU035] 如果 SAP
              嵌入式许可交易被设计为重大收入，它本身也可能形成一种新的客户集中度风险。[CU027] SAP 交易的商业条款没有公开。

              Community 到付费的转化在结构上仍低。自托管 Community 转向任何付费层的估计转化率为 1–5%，意味着 n8n 自托管安装基数中约 95–99% 不产生直接收入。[CU011]
              这形成了真正巨大的漏斗顶部，并驱动有机营销；但也意味着 n8n 的收入质量几乎完全取决于服务和留住小规模商业队列的能力，而庞大免费队列会稀释表面的「用户」指标。

              Trustpilot 评论暴露出结构性支持缺口：付费企业客户报告称，在试图扩大支出时无法联系销售团队，说明相对于安装基础中的商业潜力，客户成功覆盖不足。[CU029] 企业权重更高的评价平台（G2
              4.7/5、PeerSpot 8.2/10）与面向免费 / SMB 用户的开放平台（Trustpilot 3.2/5）之间满意度分层明显，说明企业部署方满意度显著高于社区或 SMB
              用户；这对企业留存是正向信号，但也警示更广社区体验较差。[CU034]
