      - number: '4.5'
        title: 财务结论、证据缺口与尽调清单
        blocks:
          - type: paragraph
            body: >
              n8n 的财务案例建立在已验证且异常强的收入增长率之上（12 个月 ARR 约 14 倍，从 $7.2M 增至超过 €100M），同时还有产品驱动、社区供能的分销模型，为相当一部分用户带来近零 CAC。SAP
              合作同时释放企业级验证信号，并打开新的 OEM 收入向量。这些优势是真实的，也得到顶级投资团的确认。

              尽调障碍同样清楚。没有经审计财务。毛利率没有披露。NRR、总留存率（GRR）和流失从未公布。烧钱速度靠推断，而不是公司报告。ARR 数字来自公司披露或第三方估计；GetLatka 和 Sacra
              具体数据点的方法基础不清楚。估值从 $355M 在 14 个月内跳到 $5.2B，反映 AI 市场情绪的程度不亚于基本经营改善，而 50–62 倍 ARR
              倍数仍处在历史上公开市场未能长期支撑自动化软件公司的水平。

              免费 / 自托管层带来结构性蚕食压力：如果相当一部分企业用户为了避开执行费用而自托管，相对总社区规模，每活跃用户的实际变现仍然有限。执行计价模型也带来毛利率敞口，因为 AI
              智能体工作流每个用户会话产生的执行次数多于传统规则型自动化。

              对潜在投资人或收购方，财务结论是：增长真实，SAP 带来的分销护城河具备战略意义，但任何承销或投资决策都不应只依赖当前公开证据。最低尽调资料包应包括完整股权结构表、2024 和 2025
              财年经审计或审阅财务、按队列拆解的 ARR 桥、按客户分层披露的 NRR 和总留存、烧钱速度与 12 个月现金流预测，以及 SAP 商业协议的财务条款。
