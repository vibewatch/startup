  - id: TM001
    title: 市场定义表
    columns:
      - 细分市场 / 类别
      - 纳入支出
      - 排除支出
      - 主要买方 / 付款方
      - 与 n8n 的关联
    rows:
      - - 工作流自动化（API 优先）
        - SaaS 到 SaaS 触发、多步骤自动化、AI 智能体循环、执行编排；云和自托管
        - 桌面 UI / RPA 机器人、重型 BPM 套件、原始 ETL 管道、原生平台自动化（Salesforce Flow、SAP Automation Pilot）
        - 平台工程师、DevOps 团队、IT 运营；无代码层也覆盖业务运营
        - 核心 TAM——n8n 是该类别的直接供应商；自托管 + AI 原生定位形成内部差异化
      - - iPaaS（集成平台即服务）
        - 企业级数据和系统集成基础设施；API 管理；事件流连接器；治理和转换层
        - 轻量点对点 webhook 连接器、CRM / ERP 内置工作流构建器、原始消息队列
        - 企业集成架构师、IT 运营；仅限大型企业；供应商合同 $50k–$300k/yr
        - 相邻 TAM——n8n 在低端边界（API 优先工作流自动化）竞争，但截至 2026 年还不能服务完整 iPaaS 企业规模
      - - AI 智能体编排
        - 多智能体协调平台、嵌入 LLM 的工作流工具、智能体可观测性、面向智能体循环的记忆和上下文管理
        - 基础模型训练 / 推理成本、独立 RAG / 向量数据库产品、只增加 AI 分类的 RPA 机器人
        - 企业 AI / ML 工程师、构建 AI 产品的平台团队；预算通常来自 AI / 创新 CoE
        - 新兴 TAM——n8n 的 AI 智能体节点和智能体循环架构，直接与 LangGraph、n8n MCP 工具以及超大规模云厂商智能体界面竞争
      - - 低代码 / 无代码开发
        - 应用构建平台、可视化工作流构建器、公民开发者工具、表单和流程自动化
        - 专业 IDE、DevOps / CI-CD 管道、需要纯代码操作的无头自动化引擎
        - 业务分析师、运营团队、非技术部门负责人；装机基础大，单席支出较低
        - 部分相邻——n8n 的可视化画布面向半技术用户，但产品以开发者优先；Zapier 和 Make 占据无代码 / 公民开发者市场份额
      - - RPA（机器人流程自动化）
        - 桌面 UI 机器人、屏幕抓取、旧系统交互、面向非 API 工作流的有人值守和无人值守自动化
        - API 原生集成、AI 推理、工作流编排、BPM 流程建模
        - IT 自动化和运营团队；旧系统负责人；拥有本地 ERP / 大型机的大型企业
        - 排除——n8n 不参与 RPA 竞争；该细分市场（$12–35B）由 UiPath、Automation Anywhere、Blue Prism 主导；只有在超自动化套件中存在重叠
    notes: 市场边界是近似值，分析师定义存在分歧。n8n 的有效 TAM 位于 API 优先工作流自动化细分市场，加上 AI 智能体编排层；截至 2026 年 5 月，iPaaS 和 RPA 是相邻市场，但并非直接竞争市场。
