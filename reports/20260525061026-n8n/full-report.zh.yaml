      - number: '3.3'
        title: 护城河耐久度、替代风险与买方细分结论
        blocks:
          - type: paragraph
            body: >
              n8n 的竞争位置建立在 3 条相互扣合的护城河上：(1) fair-code 自托管带来数据主权，纯云竞品无法提供；(2) 借原生 LangChain 集成和 70+ 个 AI 节点形成 AI
              智能体深度，Zapier 和 Make.com 难以匹配生产级智能体工作流；(3) 定价经济性偏向高容量技术买方——完全自托管实例以基础设施开销为代价，把软件许可成本降为零。

              自托管护城河在受监管垂直（医疗、金融服务、政府）最耐久；这些行业的数据驻留要求或安全政策禁止使用纯云厂商。截至 2026 年，尚无主要纯云竞品加入可信自托管路径。Workato 和 Tray.io
              是云优先；其“私有云”（private cloud） 选项需要由供应商管理专用基础设施，而不是客户控制的本地部署。

              AI 智能体深度护城河面临最可信的压缩风险。Zapier 的 MCP 集成和 AI 工作流生成功能（2025 年发布）显示，云优先竞品正在补上功能差距。Make Grid
              的多智能体编排同样缩短了距离。不过，LangChain 原生编排、智能体节点内自定义 JavaScript 执行，以及构建带记忆存储的有状态多智能体管线，仍是需要深度架构集成才能复制的差异点；估计达到功能平价需要
              12–18 个月开发滞后，是合理的尽调假设。

              最实质的反向风险是 Microsoft Power Automate 通过超大规模云厂商打包进入。购买 Business Premium 或 E3/E5 层级 Microsoft 365
              的企业，几乎以零边际成本获得 Power Automate 能力。在 Microsoft 中心型组织中，买方偏好 Power Automate，不是因为它技术更强，而是采购摩擦为零，IT
              治理也因留在单一供应商生态内而简化。这一动态在结构上抵抗 n8n 的定价论证：当替代方案是“随既有 M365 许可证免费”时，成本比较失去意义。n8n 的应对定位——数据主权、AI 智能体深度、非
              Microsoft 集成广度——对技术团队有说服力，但在大型组织中未必能压过集中式 IT 采购决策。

              低代码商品化是较慢但持续的威胁。随着 Zapier、Make 和新兴平台加入 AI 原生工作流生成（提示词到工作流，prompt-to-workflow），对不需要自定义代码的用户而言，n8n
              节点编辑器与竞品可视化构建器之间的差异会收窄。若 AI 工作流生成达到平价，n8n 更陡的学习曲线就会从深度能力信号变成纯粹负担。

              买方细分结论：n8n 明确赢在 (a) 需要生产规模 AI 智能体编排的技术和开发者主导团队，(b) 需要本地或 VPC 部署自动化的受监管行业，(c) 高容量工作流——Zapier 按任务计价使 n8n
              自托管可节省 70–90% 成本。n8n 面临结构性逆风的场景包括：(a) 非技术 SMB 团队，Zapier 和 Make.com 的上手与支持更强；(b) Microsoft 中心型企业，Power
              Automate 是零边际成本默认选项；(c) 大型企业集成合同，Workato 的成熟度、专业服务网络和审计工具比 n8n 的成本效率更有分量。
