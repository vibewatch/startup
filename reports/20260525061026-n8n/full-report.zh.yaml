      - number: '5.3'
        title: 集成、社区生态与 AI 智能体能力
        blocks:
          - type: paragraph
            body: >
              n8n 的集成广度分为官方节点（400+，由 n8n 工程团队维护）和社区节点（npm 上 500+
              包）。社区节点遵循严格打包约定——包名必须以「n8n-nodes-」或「@scope/n8n-nodes-」开头，并包含「n8n-community-node-package」npm 关键词以便自动发现。从
              2026 年 5 月 1 日起，通过 n8n Creator Portal 申请已验证状态的节点，必须经 GitHub Actions 发布，并附带加密来源证明（OIDC 签名）；本地直接 npm publish
              不再具备验证资格。这一来源要求是对 2026 年 1 月供应链攻击的直接回应：八个恶意 npm 包伪装成合法 n8n 集成，其中一个下载量达 8,385 次，并把 OAuth token
              外传到攻击者控制的服务器。关键安全限制在于，社区节点与 n8n 进程本身运行在同一权限级别：它们可以读取环境变量、访问文件系统、发起出站网络请求，并在执行期间接收解密后的 API key；与 n8n
              运行时之间没有沙箱或隔离。自托管管理员可以通过设置 N8N_COMMUNITY_PACKAGES_ENABLED=false 完全禁用社区节点。

              AI 智能体层是近期最具战略意义的扩展。n8n 提供 70+ 个原生基于 LangChain 的 AI 节点，把 LLM 模型连接（OpenAI、Anthropic Claude、Google
              Gemini，以及通过 Ollama 接入本地模型）、记忆存储（窗口缓冲、实体记忆）、向量数据库集成（Pinecone、Weaviate、Milvus、Qdrant）、向量嵌入
              提供商和检索增强生成（RAG）链组件，都做成一等可视化节点。AI 智能体工作流支持工具调用、多步推理循环、人工审核检查点，以及跨执行保留对话上下文。10,000+ 个社区工作流模板中，已有大量且持续增长的 AI
              智能体入门流程。n8n 的 AI 定位不同于独立 LLM 编排框架（LangChain Python、Flowise）：它把 AI 编排嵌入完整业务自动化场景，在同一个可视化工作流中，把 AI 决策节点连接到
              CRM 写入、数据库更新、邮件发送和 webhook 回调。
