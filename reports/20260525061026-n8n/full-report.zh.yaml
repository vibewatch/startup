  - id: TR005
    title: 缓释与终止标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - 长期安全债 / 反复出现严重 CVE
        - GitHub Security Advisories、n8n 的 NVD CVE 订阅流
        - 任一滚动 12 个月窗口内出现 4 个或更多 CVSS 9+ CVE，且未对 webhook / 表达式求值攻击面做架构级修复
        - 击穿论点：n8n 作为凭证枢纽已具规模，系统性安全债会构成存亡级客户信任风险；退出或放弃投资
      - - SAP 合作失败或重组
        - SAP Joule Studio GA 里程碑（2026 年 Q3）、SAP 公开采用 n8n 的公告、SAP 年报提及
        - SAP 将 GA 推迟至 2026 年 Q4 之后，宣布竞争性收购（如收购 Workato/Make.com），或重新谈判已公开披露且不利的收入条款
        - 削弱论点：SAP 是估值翻倍的催化剂；合作丧失会拿掉主要企业增长驱动；重估入场倍数
      - - 创始人在关键扩张阶段离任
        - 公开公告、LinkedIn 资料变更、欧洲 SEC 类文件、媒体报道
        - Series C 交割后 24 个月内，Oberhauser 宣布离任或长期休假，且未公开指定来自高管团队内部的可信继任者
        - 击穿论点：企业化转型拐点出现独立创始人离任；销售势头和投资人信心面临重大风险
      - - 收入增长放缓至 YoY 低于 2×，且烧钱倍数高于 2.5×
        - 数据室访问：月度 ARR、净新增 ARR、现金消耗率；或 Sacra / 分析师估算更新
        - 无论披露口径还是估算口径，ARR 增长降至 YoY 2× 以下，同时烧钱倍数超过 2.5×；或 ARR 连续两个季度放缓且未重组成本
        - 削弱论点：在 $2.5B–$5.2B 估值下，增长放缓会大幅压缩倍数；必须重估退出时间线和回报假设
      - - n8n 分叉项目取得显著社区采用
        - 已知分叉项目（Activepieces、Windmill.dev）的 GitHub 星标数、社区论坛情绪、开发者调查结果
        - 任一分叉项目在 18 个月内突破 30,000 个 GitHub 星标，并把离开动机归因于 n8n 许可
        - 论点风险：社区分裂会削弱有机增长飞轮；除非伴随企业客户流失，否则监测但不立即击穿论点
    notes: |
      终止标准阈值基于这一投资论点：n8n 的价值来自安全关键型企业部署、SAP 渠道扩张和创始人主导的 AI 产品愿景。触发项可通过公开信号（CVE 订阅流、媒体、GitHub）或数据室指标观察。
