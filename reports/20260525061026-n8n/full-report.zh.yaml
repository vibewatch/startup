      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >
              Jan Oberhauser 是 n8n 的唯一创始人兼 CEO。创办公司前，他在视觉特效工作室 Digital Domain 担任管线技术总监（Pipeline Technical
              Director，Pipeline TD），参与 Pirates of the Caribbean 4 和 Maleficent 等好莱坞大片的 VFX
              管线。他亲手搭建软件管线、自动化工作室重复任务，这段经历直接塑造了 n8n 的设计理念：灵活、开发者可控，避免脆弱的点对点集成。

              Oberhauser 最初把 n8n 当作副业项目，用来解决自己对既有自动化工具的不满，并一人写完整个产品；后来通过 GitHub 社区招聘早期成员。早期开发者 Ricardo Espinoza 2019 年在
              Product Hunt 发现 n8n，先贡献了几十个集成，随后在种子轮后全职加入。n8n 后续也沿用了这种从社区贡献者转为员工的路径。

              更广义的领导团队包括 David Roberts（产品副总裁）、Cornelius Suermann（工程副总裁）和 Claudia Bates（运营副总裁），产品、工程、运营职能覆盖较标准。按可得数据，截至
              2026 年，公司员工约 300 人；若计入国际承包商，一些估算给出的总人数更高。关键人物风险较高：Jan Oberhauser 在产品愿景、社区互动、融资和公开定位上都处于中心位置，给投资者带来单点故障暴露。

              董事会和治理细节尚未公开披露。考虑到领投轮次，董事会很可能至少有 Accel、Felicis Ventures 和 Highland Europe 的投资人代表，但现有来源尚未确认正式董事会构成。
