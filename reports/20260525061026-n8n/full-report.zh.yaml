  - id: TE002
    title: 工作流用例和客户任务地图
    columns:
      - 用户任务
      - 没有 n8n 时的现有流程
      - n8n 方案
      - 可衡量收益
      - 限制 / 风险
    rows:
      - - 捕获线索时连接 CRM 与营销自动化
        - 手动导出 CSV，或点对点 Zapier Zap
        - n8n 工作流使用 Salesforce + HubSpot 节点、条件分支和字段映射
        - 表单提交后亚秒级写入 CRM；消除手工同步延迟
        - 数据主权说法成立与否，取决于买家选择哪种部署模式
      - - 用于客服分诊的多步 AI 智能体
        - 人工分派工单队列，或僵硬的规则机器人
        - n8n AI 智能体工作流接入 OpenAI/Claude 节点、记忆，并通过工具调用连接 CRM + 工单节点
        - 自主分诊，并在需要时升级给人工；解决时间更短
        - 边界场景下的智能体可靠性取决于 LLM 模型选择；尚无原生评估工具
      - - 自动化从 API 到数据仓库的数据管道
        - Python ETL 脚本靠 cron 运行，没有监控
        - n8n 定时工作流使用 HTTP Request、数据转换和 PostgreSQL/BigQuery 写入节点；通过 Slack 发送错误告警
        - 无需维护自定义 cron 基础设施，也能获得可视化监控、失败重试和审计轨迹
        - 大批量批处理可能触及执行内存上限；队列模式会增加运维复杂度
      - - 带审计轨迹的受监管工作流（如财务审批）
        - 基于邮件的审批链，没有审计日志
        - n8n Enterprise 工作流具备 RBAC、不可变审计日志，以及要求授权用户操作的审批步骤
        - 完整审计轨迹支撑合规；日志对齐 GDPR/HIPAA
        - SOC 2 认证未确认；取决于自托管部署配置
      - - 内部开发者工具 / 工作流即 API 端点
        - 应用代码中的自定义微服务或 webhook 处理器
        - n8n 工作流以带 API key 认证的 webhook 端点暴露；非开发人员用可视化方式维护逻辑
        - 缓解工程瓶颈；运营团队迭代更快
        - 未认证 webhook 端点是 RCE 攻击向量（CVE-2026-21858）
    notes: |
      用例主张来自 n8n 官方文档、案例研究和独立社区指南。已量化收益只具方向性；公开来源没有独立验证的 ROI 数据。风险由尽调识别，并非公司承认。
