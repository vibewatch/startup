            body: >
              Microsoft Power Automate 打包在 M365 E3/E5 许可证中，对多数企业 Windows 客户而言是无需采购的自动化选项；随着 Copilot AI 功能成熟，它越来越能在 AI
              原生能力上竞争，而这曾是 n8n 的主要差异化。与此同时，Zapier、Make、Activepieces 以及 AI
