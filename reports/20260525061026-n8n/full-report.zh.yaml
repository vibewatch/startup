  - id: TV002
    title: 投资论点与反论点表
    columns:
      - 论点
      - 类型
      - 证据基础
      - 改变判断的因素
    rows:
      - - ARR 增长极快（截至 2025 年 10 月 YoY 10×；随后 7 个月再增 2.5× 至 >€100M）
        - 正向论点
        - 公司在 Series C 和 SAP 交易中披露；Sifted、Bloomberg、GetLatka 交叉印证
        - ARR 增长连续两个季度放缓至 YoY <2×
      - - 开源社区护城河：189K 个 GitHub 星标、100M+ Docker 拉取、170 万月活跃开发者，构成近零 CAC 漏斗
        - 正向论点
        - GitHub 仓库星标（公开）、SAP 交易时公司披露的社区指标
        - 出现主导性开源分叉（MIT 许可），或超大规模云厂商免费捆绑同等功能
      - - SAP 战略 OEM 渠道把 n8n 嵌入面向 SAP 企业客户的 Joule Studio——当前 ARR 尚未计入的收入倍增器
        - 正向论点
        - Highland Europe 2026 年 5 月新闻稿；blog.n8n.io/n8n-sap/；SAP CEO 声明
        - SAP 将 Joule Studio GA 推迟到 2026 年 Q4 之后，或收购竞争性编排平台
      - - Series C 价格（$2.5B / 约 62× ARR）被竞价战推高；Accel 以约 $2.9B 报价压过 Insight Partners
        - 反向论点
        - Sifted 反向分析；Bloomberg 预公告报道；Business Times
        - 有证据表明 Insight 的 $2.9B 报价因估值无关原因撤回（即价格并非差异点）
      - - NRR、毛利率、现金消耗率或客户集中度数据均未公开——仅凭基本面无法尽调
        - 反向论点
        - Sacra、getlatka、公司备案均确认未披露单位经济指标
        - n8n 在 IPO 文件或自愿投资人更新中披露 NRR、毛利率和客户分群数据
      - - 开源 fair-code 模型相较闭源 SaaS 同业，对定价权形成结构性上限；62× ARR 未反映这一折价
        - 反向论点
        - Windsor Drake SaaS 倍数分析；Livmo 2026 数据；开源 SaaS 折价基准
        - n8n 规模化后 NRR 高于 130%，证明溢价定价权足以覆盖结构性折价
      - - 治理不透明——未任命 CFO/CTO/CCO、无经审计财务、独立创始人 CEO 未指定继任者——推高执行风险溢价
        - 反向论点
        - JieGou 治理分析；UK Companies House 备案；tracxn 公司档案
        - n8n 任命具名高管团队成员并发布经审计账目，从而降低治理风险溢价
