  - id: FE001
    title: n8n 产品架构栈
    type: stack
    layout: wide
    summary: |
      n8n 的分层产品架构，从面向用户的可视化编辑器，到执行引擎、数据持久化和外部集成。
    data:
      layers:
        - label: 用户界面层
          detail: Vue.js 可视化画布；拖拽式节点编辑器；内联表达式语法；子工作流管理；执行历史查看器。
          items:
            - 可视化画布工作流构建器（Vue.js）
            - 带动态数据映射的节点配置面板
            - 表达式编辑器（类似 JS 的内联转换）
            - 执行日志查看器和调试模式
            - 模板库（10,000+ 社区模板）
        - label: 工作流执行层
          detail: Node.js/TypeScript 引擎执行拓扑化节点图；支持单实例模式，也支持由 Redis 支撑的 worker 队列模式。
          items:
            - 单实例模式：所有执行都在主 Node.js 进程内完成
            - 队列模式：Redis（BullMQ）+ 分布式 worker 池
            - Worker 实例：独立 Node.js 进程（水平扩展）
            - 按节点重试和错误分支路由处理错误
            - 子工作流调用与响应（模块化复用）
        - label: 集成与扩展层
          detail: 400+ 官方集成节点、500+ 社区 npm 包、面向任意 API 的 HTTP Request 节点，以及 70+ LangChain AI 节点。
          items:
            - 400+ 官方集成节点（SaaS、数据库、消息、AI 提供方）
            - 500+ 社区 npm 包（n8n-nodes-* 命名约定）
            - HTTP Request 节点（无需专用节点即可调用任意 REST/GraphQL）
            - 70+ LangChain AI 节点（LLM、记忆、RAG、工具调用、向量数据库）
            - 支持 npm 访问的自定义 JavaScript/Python 代码节点
        - label: 持久化与安全层
          detail: PostgreSQL 存储工作流和执行数据；Redis 队列；加密凭证库；Enterprise 支持外部密钥库集成。
          items:
            - PostgreSQL 13+（工作流定义、执行历史、凭证）
            - 凭证库（AES-256 加密，所有 worker 共用单一密钥）
            - 外部密钥库（HashiCorp Vault —— Enterprise 档位）
            - Redis（BullMQ 队列、执行协调）
            - S3 兼容对象存储（队列模式下的二进制数据）
        - label: 部署与治理层
          detail: 四种部署模式；基于 Git 的版本控制；多环境；SSO/RBAC；审计日志；为受监管行业提供隔离网络支持。
          items:
            - n8n Cloud（托管 SaaS：Starter/Pro/Business/Enterprise）
            - 自托管 Community（免费；Sustainable Use License）
            - 自托管 Enterprise（付费许可；SSO、RBAC、审计日志）
            - 隔离网络 Enterprise（离线部署；无外部网络）
            - 多环境（dev/staging/prod）+ Git 版本控制
    approximationNotes: |
      分层安排反映的是逻辑产品区域，不是物理部署拓扑。社区节点包数量（500+）是基于 npm 搜索结果和 gitnux.org/worldmetrics.org 统计得出的估计；确切数量会随生态活跃度变化。
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE007
      - CE010
      - CE011
      - CE017
      - CE018
      - CE021
      - CE022
