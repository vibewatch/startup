  - id: FM001
    title: 市场规模测算视角
    type: pyramid
    layout: wide
    summary: |
      n8n 覆盖四个市场类别的 TAM/SAM/SOM 测算。各层代表可触达性递减，从合计超自动化机会到 n8n 当前已货币化客户基础。
    data:
      items:
        - label: 合计超自动化 TAM（~$100B+）
          detail: 工作流自动化（$26–30B）+ iPaaS（$19B）+ AI 编排（$11B）+ 低代码 / 无代码（$65B）；类别之间显著重叠，不能完全相加
          tone: neutral
        - label: 工作流自动化 + AI 编排 TAM（$37B）
          detail: n8n 的主要可触达市场：API 优先工作流自动化（Mordor 2026 为 $26.01B）加 AI agent 编排层（Dimension 2026 为 $11.0B）
          tone: positive
        - label: API 优先自托管与 AI 原生 SAM（~$2–6B）
          detail: 开发者主导和合规主导的买方，需要自托管或 AI 原生工作流自动化；不包括无代码公民开发者层和纯 iPaaS 企业层
          tone: neutral
        - label: n8n 当前 SOM（估计 <1% SAM）
          detail: 3,000+ 企业客户、230,000+ 活跃用户、截至 2025 年 8 月 ARR >$40M；若 SAP 分发跑通，SAM 内仍有大量扩张空间
          tone: neutral
    approximationNotes: |
      各单项 TAM 来自分析师报告（2026 年估算）。由于存在重叠，合计数不可相加；它只展示 n8n 可能触达的总体市场范围。SAM 和 SOM 是作者基于现有证据估算，并非独立发布数据。
