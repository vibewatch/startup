  - id: TV004
    title: 可比估值表
    enumeration: true
    columns:
      - 可比对象
      - ARR / 收入规模
      - EV 或估值
      - EV / ARR 倍数
      - 与 n8n 的相关性
      - 局限性
    rows:
      - - 'UiPath（NYSE: PATH）——上市纯自动化标的'
        - $1.853B ARR（FY2026，YoY +11%）；$1.611B 收入
        - $4.12B 企业价值（2026 年 5 月）
        - 2.2× EV/ARR
        - 最大的上市纯自动化与编排平台；在企业工作流自动化市场直接重叠
        - 成熟公司 ARR 为 $1.8B、增速 11%，而 n8n 为高双位数增长；公开市场折价，相对私募市场溢价；n8n 缺少 UiPath 的经营盈利能力
      - - Zapier——私营、自举型工作流自动化公司
        - ~$420M ARR（2026 年 Q1）；~$310M 收入（2024 年）
        - ~$5.0B 二级市场估值（最新已知）
        - ~11.9× ARR
        - 直接工作流自动化竞争对手；两者都覆盖开发者 / 业务用户交叉人群；Zapier 在 $420M ARR 基础上以 $5B 估值实现盈利
        - Zapier 自举发展、融资极少，而 n8n 已融资 $300M+；Zapier ARR 规模约为 n8n 的 7×；市场定位不同（偏 SMB vs. n8n 企业-开发者）
      - - Workato——私营企业 iPaaS
        - ~$200M ARR 估算（2022 年基数，已增长）
        - ~$5.7B 最近一轮机构融资估值（2022 年）
        - 2022 年轮次约 28× ARR（按 2026 年市场条件可能压缩至 10–15×）
        - 企业 iPaaS，Gartner 定位强，具备 SOC2/ISO 认证；与 n8n 的企业买方高度重叠
        - 2022 年轮次的高峰定价难以维持到当前倍数；Workato 有 10,000+ 连接器，而 n8n 为 400+；定价模型不同
      - - 私营 SaaS 中位数（2026 年市场数据）
        - $5M–$50M ARR 区间
        - 3–7× 收入区间；中位数约 4.5×
        - 4–5× ARR 中位数；前四分位 AI 原生 SaaS 为 7–12×
        - 确立进入 2026 年时私募市场 SaaS 估值预期的参考底线
        - 中位数数据未按 n8n 具体增长率或品类定位调整；n8n 处在增长分布最右尾
      - - n8n Series C——自参照
        - ~$40M ARR（2025 年 8 月投资条款清单）；公司称 YoY 增长 10×
        - $2.5B 投后估值（2025 年 10 月）
        - ~62× ARR
        - 确立当前分析入场价格基础的参考交易
        - 价格可能被 Accel 与 Insight Partners 之间的竞价战推高；披露 ARR 未经审计，基于创始人披露
    notes: >
      所有倍数均按相关交易发生时披露或估算的 ARR 计算。n8n 当前 $5.2B 的 SAP 标记估值，意味着基于 >€100M ARR（2026 年 5 月）的 ARR 倍数约 50×。UiPath 数据来自 FY2026
      年报（截至 2026 年 1 月 31 日）。
    enumerationScope:
      coverage: sample
      basis: >
        Comparables selected to represent: (1) the closest public pure-play peer (UiPath); (2) the closest private
        bootstrapped peer (Zapier); (3) a private enterprise iPaaS peer (Workato); (4) the private SaaS market median
        reference frame; and (5) n8n's own Series C transaction as a self-reference anchor. GitLab and HashiCorp were
        considered as open-source SaaS comps but excluded as their business models differ materially (DevOps vs.
        workflow automation).
