  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 安全、供应链与产品风险
        blocks:
          - type: paragraph
            body: >
              n8n 是一个集中式自动化枢纽，为每个集成服务存储 API key、OAuth token、数据库凭证和云访问 token；任何成功攻击都会产生异常高的爆炸半径。2025 年 11 月到 2026 年 2
              月的十周内，n8n 披露了五个关键安全漏洞（CVSS 9.4–10.0），对单个平台而言，在短时间窗口内集中出现最高严重级别发现，前所未有。

              CVE-2026-21858（「Ni8mare」，CVSS 10.0）于 2026 年 1 月 7 日披露，是一个未认证远程代码执行漏洞，根源在 n8n webhook 处理器的 Content-Type
              混淆缺陷。通过发送精心构造的 HTTP 请求，未认证攻击者可以：从服务器读取任意文件（包括 SQLite 数据库和存储在 /home/node/.n8n/config 的加密密钥）；伪造管理员会话
              token；并通过创建带有 Execute Command 节点的工作流实现完整 RCE。Cyera Research Labs 估计，超过 100,000 台暴露在互联网上的 n8n 服务器存在漏洞。补丁于
              2025 年 11 月 18 日在 v1.121.0 发布；未打补丁部署没有变通缓解措施。Picus Security 逐步确认了完整攻击链，并指出爆炸半径包括 n8n
              实例内存储的所有凭证。同一时期还披露了另外三个关键 CVE（CVE-2025-68613，CVSS 9.9；CVE-2025-68668「N8scape」，CVSS 9.9；CVE-2026-21877，CVSS
              10.0），在不同条件下均可实现已认证或未认证代码执行。

              CVE-2026-25049（CVSS 9.4）于 2026 年 2 月 5 日披露，绕过了 2025 年 12 月针对 CVE-2025-68613 的补丁。Pillar Security
              研究人员警告，成功利用可获得完整服务器控制权——包括实时拦截 OpenAI、Anthropic 和 AWS 凭证——且 n8n Cloud 多租户架构可能允许跨租户数据访问。The Register 报道 n8n
              维护者确认：「拥有创建或修改工作流权限的已认证用户，可能滥用工作流参数中构造的表达式，在运行 n8n 的主机上触发非预期系统命令执行。」原修复三个月内就被绕过，说明安全债更像架构问题，而不只是实现问题。

              2026 年 5 月，又有三个关键 CVE 通过 GitHub Security Advisories 披露（CVE-2026-44789，通过 HTTP Request 节点原型污染导致
              RCE；CVE-2026-44790 Git 节点参数注入；CVE-2026-44791 XML 节点补丁绕过），拥有工作流编辑权限的低权限已认证用户都可能影响系统。这些漏洞影响 1.123.43、2.20.7
              和 2.22.1 之前版本。

              2026 年 1 月 npm 供应链攻击增加了另一个攻击向量。Endor Labs 发现，恶意 npm 包伪装成合法 n8n 社区节点（例如 Google Ads 连接器），从 n8n 的凭证存储收集 OAuth
              token 和 API key，并外传到 C2 服务器。npm 包没有发布前审核，所有已安装社区节点都能完全访问工作流环境，包括解密后的 API 凭证。n8n 从 2026 年 5
              月起对已验证节点引入加密来源证明要求，但未验证节点仍可安装。Endor Labs 指出：「尽管我们所知的恶意包已在过去几小时内被禁用，攻击未来仍可能持续并演化。」

              Cisco Talos 在 2026 年 4 月威胁情报报告中记录，2026 年 3 月含有武器化 n8n webhook URL 的邮件量约比 2025 年 1 月高 686%。威胁行为者利用 n8n 合法
              webhook 基础设施投递恶意软件、进行设备指纹识别，并绕过安全过滤——因为载荷看起来来自可信 n8n 域名。JieGou 的技术评论指出，n8n 的治理架构缺口（缺少量化治理评分、监管合规映射、部门范围策略和
              SOC 2 结构化审计证据）意味着，仅靠平台现有工具无法充分治理安全事件。
