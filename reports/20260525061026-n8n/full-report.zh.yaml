  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户群分层与采用轨迹
        blocks:
          - type: paragraph
            body: >
              n8n 的可触达客户范围横跨三个结构上不同、收入画像差异很大的分层：（1）免费自托管 Community 层；（2）云订阅 SMB 和中端市场团队；（3）使用 n8n Cloud
              Business/Enterprise 计划或自托管 Enterprise 许可的付费企业客户。

              Community 层按人数最大，商业可见度最低。截至 2024–2025 年末，活跃自托管安装量已超过 500,000，主要是开发者、初创公司、数字代理商，以及能把 n8n 装到 VPS
              或内部服务器上的技术型运营者。这些用户不给 n8n 带来直接许可收入，却是品牌认知、社区贡献、npm 下载量（每周 1.4 million+）和最终企业线索漏斗的主要来源。从自托管 Community
              转向任何付费层的转化率没有公开披露；参照开源 SaaS 可比公司（GitLab、Mattermost、Grafana），估计为 1–5%。这个结构性缺口意味着，n8n 对外宣传的大多数用户数字——230,000+
              活跃用户、1.7 million 月活开发者社区——并不对应付费账户。[CU011]

              付费商业分层才是商业上有意义的客户队列：raascloud.io 聚合显示 15,000+ 家公司使用 n8n，合作伙伴来源统计显示约 3,000+ 企业客户。[CU004] YipitData 的专有 B2B
              支出面板跟踪 1,300+ 家中端市场和企业公司的真实软件使用与支出，提供了最独立的轨迹信号：n8n 的观测中端市场客户数从 2025 年 1 月的 12 家增至 2026 年 1 月的 122 家，同比增长
              10 倍；截至 2026 年 1 月，月环比增长仍有 14%。[CU002] 同期 n8n 新增中端市场客户中近 80% 原本就是 Zapier 用户，说明 n8n 的主要增长向量是替代
              Zapier，而不是全新的工作流自动化采用。[CU006]

              根据 YipitData，到 2026 年 1 月为止，企业客户增长已连续四个月大致持平，年支出超过 $10,000 的客户占比也自 2025 年末以来进入平台期。[CU003]
              这释放出一个真实挑战：把中端市场技术拥护者 转成企业预算科目，需要采购关系、供应商安全审查和高管支持；n8n 的自托管、开发者驱动动作并不会自动生成这些能力。2026 年 5 月宣布的 SAP
              战略投资，是一次直接尝试：把 n8n 嵌入 SAP Joule Studio，面向 SAP 巨大的企业安装基础打开企业采购渠道。[CU009]

              从地理上看，n8n 带有欧洲出身（创立于柏林、由欧洲 VC 支持），但按网络流量分析，>50% 用户在美国。EMEA——尤其德国、英国和法国——在数据主权驱动的自托管企业部署上领先，原因是 GDPR
              敏感度高。印度和巴西的社区采用量大，但企业 ACV 较低。具名企业客户偏向欧洲和北美：Vodafone（英国）、StepStone（德国 / 欧洲）、Delivery Hero（德国 /
              全球）、Fullscript（加拿大）、KPMG（全球）、Icatu（巴西）、Seguros Bolívar（哥伦比亚）、TMNZ（新西兰）。[CU008]

              按垂直行业，最可信记录的企业部署集中在：电信 / 网络安全（Vodafone）、外卖 / IT 运营（Delivery Hero）、数字招聘 /
              数据集成（StepStone）、医疗保健补充剂（Fullscript）、音乐 / 媒体（Musixmatch）、保险 / 金融科技（Icatu、Seguros
              Bolívar、TMNZ）、专业服务（KPMG、Deda.Tech）以及政府提案自动化（Field Aerospace）。n8n 企业页面称，34% 的 Fortune 500 公司正在使用 n8n 的高级安全和
              DevOps 功能，但该数字来自 n8n 自身，没有独立佐证，是一个尽调缺口。[CU010]

              在 GTM 工程从业者中，GTME Pulse 于 2026 年报告 54% 采用率，驱动因素是在高工作流量下，固定费率相对按任务计价更划算。[CU007]
              代理商采用显著高于平均水平，因为多客户部署经济性更好：一家每月运行 200,000+ 自动化任务的代理商，使用自托管 n8n 只需支付服务器成本，而不是按 Zapier 任务费率支付
              $1,000–$2,000/月。
