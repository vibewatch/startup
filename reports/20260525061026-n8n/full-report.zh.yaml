      - number: '4.4'
        title: 资本充足性与资产负债表背景
        blocks:
          - type: paragraph
            body: >
              从种子轮到 Series C 的完整融资时间线，参见第 1 章（公司概况）。本财务章节讨论资本充足性和未来现金跑道。

              截至 2026 年 5 月，n8n 已披露股权融资总额超过 $300M：截至 2025 年 10 月 Series C 约 $240M，加上 SAP 在 $5.2B 估值下约 $60M
              的战略投资。公司没有披露债务额度、种子阶段工具之外的可转债，或项目融资义务。2025 年 10 月完成的 $180M Series C，是估算现金跑道的主要流动性事件。n8n 指引称，Series C
              募资将用于扩展 AI 能力、美国市场发展（纽约和伦敦办公室）以及工程团队增长。

              按推断烧钱速度 $4–10M/月计算（员工数不确定、基础设施成本未知，区间较宽），$180M Series C 可从 2025 年 10 月起提供约 18–45 个月现金跑道；若按较高烧钱估计，大约支撑到
              2027 年中至 2027 年末。SAP 投资再增加约 $60M，在相近烧钱速度下延长 6–15 个月。上述估算说明，n8n 并不马上依赖新一轮融资；但若没有达到盈利里程碑，公司很可能在 2027 年中前后寻求
              Series D 或后期轮，尤其当前增长投资本就有意前置。

              SAP 合作还通过多年期商业协议把 n8n 嵌入 Joule Studio，带来有意义的收入承诺。协议财务条款尚未披露，但企业级
              OEM/嵌入式许可协议通常包含保证最低收入承诺，这会降低有效烧钱速度，并把现金跑道延长到仅按股权融资估算之外。

              公开信息中没有披露信贷额度、可转债或项目融资义务。公司也没有表示 IPO 有具体时间表，不过 $5.2B 估值和 SAP 企业合作关系，为 2027–2029 年窗口的 IPO 或战略收购都打开了路径。
