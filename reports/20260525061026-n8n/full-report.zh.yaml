  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >
              2026 年，买方要解决工作流自动化和 AI 智能体编排问题，面对的是碎片化格局：云 SaaS 自动化工具、企业集成平台、开源 AI 智能体构建器并存。n8n 与每一层的竞争方式不同。

              最大、最直接争夺的市场细分是云工作流自动化，Zapier 和 Make.com 占据 SMB 与中端市场。Zapier 在 2026 年 Q1 达到约 $420 million ARR，服务超过 3
              million 家公司，付费客户约 100,000，估值维持在 $5 billion，且只募集过很少风险资本（$2.68 million）。其 7,000+
              个原生应用连接器和零基础设施部署模式，使它成为营销、销售运营和非技术业务团队的默认选择。Make.com（前身 Integromat，被 Celonis 收购）画像类似，拥有 3,000+
              个连接器，并采用随工作流复杂度扩展的积分制定价。两者都是纯云产品，没有自托管选项，这正是技术成熟买方和受监管行业买方迁移到 n8n 的主要原因。

              在企业层，Workato 和 Tray.io（现称 Tray.ai）支撑大型企业自动化与集成合同的 iPaaS 市场。Workato 多轮融资约 $421 million，2021 年估值峰值达 $5.7
              billion；2026 年初二级市场交易显示当前估值约 $2.1 billion。平台服务约 17,000 家客户，以成熟治理、审计就绪和复杂企业销售动作见长。Tray.io 到 Series
              C（2022）累计融资约 $150 million，2023 年披露 $70 million ARR、同比增长约 40%，并借 Merlin AI 能力转向 AI
              驱动集成。两者都需要企业采购动作，年度合同价值通常在 $30,000 到 $250,000+，高于 n8n 当前企业交易规模。

              结构上最大的不同类竞争威胁来自 Microsoft Power Automate。它包含在 Microsoft 365 订阅中，每用户每月 $15，或在部分 M365 计划中无边际成本。对已标准化
              Microsoft 365 和 Azure 的企业，Power Automate 代表零增量成本自动化基线，主要靠采购简单和生态锁定竞争，而不是靠技术能力。Datanyze 报告有 2,348 家公司在生产中使用
              Power Automate，包括 Walmart、Microsoft 和 CVS Health；Gartner 的 2025 RPA Magic Quadrant 把它置于 Power Platform
              语境下的强势玩家。对没有深度绑定 Microsoft 的组织，Power Automate 自定义代码支持较弱、自托管有限、依赖 Microsoft 生态，因而不再是可行的 n8n 替代品。

              相邻开源竞品 Langflow 和 Flowise 位于更窄的子市场：可视化 AI 智能体与检索增强生成（RAG）管线构建器。Flowise（基于 LangChain.js）擅长聊天机器人和 RAG 原型，但缺少
              n8n 的广泛业务应用集成、调度原语和生产错误处理。Langflow 面向 Python 优先的数据科学和 LLM 实验工作流。很多部署中二者是互补关系——团队常把 Flowise 或 Langflow
              智能体嵌入 n8n 工作流——但它们不能替代完整业务自动化场景。Temporal 是以开发者为中心的持久工作流引擎，在微服务编排和长运行流程用例中争夺工程团队采用；它缺少可视化无代码工具和主流 n8n
              用例所定义的应用连接层。
