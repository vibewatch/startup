summary:
  headline: >-
    n8n is one of the fastest-growing enterprise automation platforms in Europe, with compelling community moat, strong
    AI-native positioning, and institutional validation—but stretched Series C valuation and absent unit economics
    warrant a disciplined track rather than immediate buy.
