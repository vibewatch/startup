  topStrengths:
    - >-
      Massive and loyal developer community (230,000+ active users, 1.7M monthly active developers) provides a
      structurally advantaged, low-CAC acquisition funnel for enterprise conversion.
    - >-
      AI-native "hybrid control" positioning—deterministic automation combined with configurable AI agent
      autonomy—addresses a durable enterprise need that pure-AI and legacy-automation vendors do not.
    - >-
      Deep institutional syndicate (Accel, Sequoia, Meritech, NVIDIA, Deutsche Telekom, SAP) with SAP OEM partnership
      providing enterprise distribution reach into SAP's massive global install base.
    - >-
      Extraordinary ARR growth trajectory from ~$7M in mid-2024 to >€100M by May 2026, with 3,000+ enterprise customers
      across regulated industries and geographies.
    - >-
      Self-hosting and fair-code licensing create structural differentiation versus cloud-only competitors in
      data-sovereign and security-sensitive enterprise segments.
  topRisks:
    - >-
      No audited financials, disclosed gross margin, NRR, burn rate, or operating expense data; diligence inputs rely on
      self-reported figures and third-party estimates.
    - >-
      $2.5B Series C valuation implies approximately 62× ARR—a multiple characterised by Sifted and analysts as driven
      by FOMO bidding; only justifiable if NRR >115% and gross margin >70% are confirmed.
    - >-
      Security incidents in early 2026 (CVE-2026-21858 and npm supply-chain attacks) signal gaps in enterprise-grade
      security posture at a critical growth phase.
    - >-
      Fair-code Sustainable Use License creates ongoing controversy, potential open-source community fragmentation, and
      risk of enterprise procurement friction in jurisdictions with strict OSS licensing policies.
    - >-
      Key-person risk is material: Jan Oberhauser holds central product vision, community engagement, and fundraising
      roles with no visible C-suite depth in CFO, CTO, or CCO positions.
  unresolvedGaps:
    - Gross margin, NRR, burn rate, and cash runway are not publicly disclosed and must be obtained from the data room.
    - >-
      Self-hosted community-to-paid conversion rate and enterprise pipeline composition are not independently
      verifiable.
    - SAP OEM commercial structure (revenue-share vs. per-deployment fees, minimum commitments) is not public.
    - Full board composition, cap table, preference stack, and governance rights remain undisclosed.
    - >-
      CVE-2026-21858 remediation completeness and whether the npm supply-chain incidents resulted in customer data
      compromise are unresolved.
