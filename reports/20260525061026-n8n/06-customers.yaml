        - 230,000+
        - 2025
        - raascloud.io aggregation; worldmetrics.org
        - Medium
        - Broad adoption; overlaps heavily with free self-hosted tier
        - Definition of "active" not standardized across sources
      - - Companies using n8n
        - 15,000+
        - 2025
        - raascloud.io
        - Medium
        - Implies 15,000 accounts at some commercial or community level
        - Includes free self-hosted organizations; paying company count unknown
      - - Enterprise customers
        - 1,400+
        - May 2026
        - SAP/Highland Europe press release
        - Medium
        - Exceeds many enterprise SaaS peers at Series C; definition unclear
        - 3,000 figure in partner-sourced content unreconciled; no ACV floor disclosed
      - - Mid-market customer count (YipitData panel)
        - 12 → 122 (10x growth)
        - Jan 2025 → Jan 2026
        - YipitData B2B spend panel (independent)
        - High
        - Confirms genuine commercial mid-market momentum
        - Panel covers ~1,300 companies; extrapolation to full market carries uncertainty
      - - Monthly mid-market growth rate (YipitData)
        - 14% M/M
        - Jan 2026
        - YipitData
        - High
        - Strong month-on-month acceleration at year-end 2025/early 2026
        - Sustainability unclear; enterprise flat for 4 months concurrent
      - - Enterprise customer growth (YipitData)
        - Roughly flat for 4 months
        - Oct 2025–Jan 2026
        - YipitData
        - High
        - Enterprise pipeline not converting; growth concentrated in mid-market
        - Sample bias possible; enterprise definition may differ from n8n's count
      - - Self-hosted installations
        - 500,000+ active
        - Late 2024/early 2025
        - worldmetrics.org; raascloud.io
        - Medium
        - Massive free footprint drives brand and community awareness
        - No revenue attribution; conversion rate not disclosed
      - - npm weekly downloads
        - 1.4 million+ per week
        - 2024–2026
        - raascloud.io; worldmetrics.org
        - Medium
        - Confirms developer adoption velocity
        - Downloads ≠ deployed instances; self-hosted inflation possible
      - - Zapier displacement share
        - ~80% of new n8n mid-market customers were Zapier users
        - Jan 2025–Jan 2026
        - YipitData
        - High
        - Growth primarily Zapier displacement, not net-new automation market creation
        - Limited to YipitData's observed panel
    notes: "YipitData metrics (rows 5–7 and 10) are from an independent B2B spend panel covering ~1,300 companies and are the most reliable signals. Rows 1–4 and 8–9 rely on company-authored communications or third-party aggregators and carry higher uncertainty."

  - id: TU003
    title: Named Customer Proof Table
    description: >
      Key named customer deployments with segment, use case, deployment status, outcome
      claimed, evidence quality, and limitation.
    sourceRefs: [SU001, SU006, SU007, SU008, SU011, SU012, SU013, SU014]
    claimRefs: [CU012, CU013, CU014, CU015, CU016, CU017, CU018, CU019, CU020, CU021]
    enumeration: true
    enumerationScope:
      coverage: partial
      basis: "Named production enterprise customers confirmed in n8n case studies, partner content, or third-party case study sites as of May 2026; additional customers exist but are not publicly named"
    columns:
      - Customer
      - Segment / Vertical
      - Use Case
      - Deployment Status
      - Quantified Outcome
      - Proof Quality
      - Limitation
    rows:
      - - Vodafone (UK)
        - Telecom / Cybersecurity
        - Threat intelligence automation, SOAR replacement, firewall rule management
        - Production — mission-critical security operations
        - £2.2M annual savings; 5,000+ person-days; hours-to-minutes threat response
        - High — named FTSE 100 customer, executive quote, specific metrics
        - Case study authored by n8n; no independent Vodafone press release
      - - Delivery Hero (DE/Global)
        - Food Delivery / IT Operations
        - Account recovery automation, Okta/Jira/Google workflow, approval routing
        - Production — 800 lockouts/month automated
        - 200+ hours/month saved from single workflow
        - High — independently referenced in multiple third-party sources
        - No contract value, renewal, or expansion data disclosed
      - - StepStone (DE/EU)
        - Digital Recruiting / Data Integration
        - 200+ mission-critical workflows; CRM-ATS sync; API integration
        - Production at scale — 200+ production workflows
        - 25x faster API integration (2 weeks → 2 hours)
        - High — specific metric; named executive quote
        - Self-reported; no independent corroboration of workflow count
      - - Fullscript (Canada)
        - Healthcare Supplements / B2B
        - Organization-wide AI workflow enablement
        - Production — team-wide deployment
        - "Months of employee time saved"
        - Medium — non-specific outcome; no quantified metric
        - Vague outcome claim; no independent corroboration
      - - Musixmatch (Italy)
        - Music / Media Technology
        - Engineering workflow automation and daily task streamlining
        - Production
        - 47 days engineering work saved in 4 months
        - Medium — specific metric but n8n-authored only
        - No independent corroboration; "engineering days" metric not standardized
      - - Icatu (Brazil)
        - Insurance / Insurtech
        - Digital insurance product development acceleration
        - Production — first-to-market delivery
        - First-mover launch before competitors; qualitative speed claim
        - Medium — named customer with executive quote; outcome is qualitative
        - No ACV or contract data; "award-winning" sourced from n8n content only
      - - Seguros Bolívar (Colombia)
        - Insurance
        - AI-first transformation; medical request processing automation
        - Production — 3,000 employees
        - Qualitative — "technology to better support people"
        - Medium — named customer; executive quote; no hard metrics
        - No quantified outcome; claim comes from n8n case study
      - - TMNZ (New Zealand)
        - FinTech / Tax
        - AI productivity automation; workflow cultural shift
        - Production
        - Qualitative — shift from spreadsheet to automation culture
        - Medium — named customer; quote; no quantified ROI
        - Cultural shift metric is not independently verifiable
      - - KPMG
        - Professional Services / Advisory
        - HR automation; AI-integrated company-wide workflows
        - Asserted — production implied
        - Not disclosed
        - Low — reference in n8n marketing / partner content only
        - No KPMG-authored confirmation; absence of independent proof is diligence gap
      - - Field Aerospace (US/Government)
        - Government Contracts / Aerospace
        - Proposal generation automation
        - Production
        - 2 weeks (3–4 people) → 25 minutes for 80% complete draft
        - Medium-High — specific metric; named company; executive quote
        - Case study authored by n8n; internal use case only (not customer-facing)
    notes: "Proof quality ratings reflect independence of corroboration and specificity of outcome metric. 'High' requires either multi-source corroboration or both a named executive quote and a precise financial/time metric. KPMG is listed but rated Low due to absence of any KPMG-authored confirmation."

