        - Enterprise
        - High (YipitData independent panel)
        - Flat count ≠ flat revenue if ACV growing; request ARR contribution from enterprise cohort
      - - Top-customer concentration (share of ARR)
        - Not disclosed
        - Enterprise
        - N/A — undisclosed
        - "Critical: SAP deal + Vodafone-scale accounts could represent material ARR concentration"
      - - Contract duration / renewal cycles
        - Not disclosed
        - Enterprise self-hosted license
        - N/A — undisclosed
        - Request mix of multi-year vs annual contracts and renewal win rates
    notes: "All NRR/GRR/churn entries reflect absence of public disclosure as of May 2026; this is a material diligence gap for a Series C company at claimed $100M+ ARR. YipitData metrics (rows 8–9) represent independent evidence; all other values are inferred or platform-reported."

  - id: TU005
    title: Expansion and Concentration Risk Assessment
    description: >
      Known expansion drivers and concentration risks with impact rating and diligence paths.
    sourceRefs: [SU002, SU003, SU004, SU006, SU019, SU020, SU021, SU022]
    claimRefs: [CU030, CU031, CU032, CU033, CU034, CU035]
    columns:
      - Factor
      - Type
      - Evidence
      - Impact
      - Diligence Path
    rows:
      - - SAP embedded-license OEM deal
        - Concentration risk (new channel)
        - SAP press release May 2026; commercial terms undisclosed
        - High — if SAP represents >10% of ARR, single-partner concentration risk
        - Request revenue terms, minimum commitments, revenue share structure
      - - Delivery Hero / StepStone depth of deployment
        - Expansion evidence (land-and-expand)
        - Named cases with 200+ mission-critical workflows
        - Positive — deep workflow embedding creates switching cost
        - Request ACV growth from initial deployment; evidence of multi-team expansion
      - - Vodafone security use case
        - Expansion evidence (new vertical)
        - Production SOAR replacement at FTSE 100 company
        - Positive — replicable in other regulated enterprise accounts
        - Request whether Vodafone has expanded to other automation use cases
      - - Self-hosted Enterprise license downgrade risk
        - Churn risk (structural)
        - Inherent in fair-code model; no cloud lock-in
        - Medium — enterprises can self-host for free after building capability
        - Monitor license renewal rates; track self-hosted Enterprise → Community downgrades
      - - Security vulnerabilities (CVE-2026-21858, CVE-2026-25049)
        - Churn risk (trust)
        - Shadowserver 59,559 exposed instances; The Register CVE-2026-25049 bypass report
        - High — enterprise security reviews may block renewals pending remediation
        - Request incident log; confirm whether any enterprise customers delayed or cancelled due to CVEs
      - - Fortune 500 "34% using n8n" claim
        - Logo inflation risk
        - n8n enterprise page (self-reported); no independent corroboration
        - Medium — if overstated, damages credibility with enterprise prospects
        - Request independent source or methodology for the 34% figure
      - - 3,000 vs 1,400 enterprise customer discrepancy
        - Logo count inflation risk
        - SAP press release states 1,400+; partner content cites 3,000+
        - Medium-High — unresolved discrepancy signals possible count methodology inconsistency
        - "Request n8n to define enterprise customer: minimum ACV, contract type, active usage criteria"
      - - Digital agency channel
        - Expansion driver (channel)
        - GTME Pulse 54% GTM engineer adoption; agency economics strongly favor n8n
        - Positive — agencies are high-volume self-motivated adopters; potential upsell to managed plans
        - No formal reseller program data; request partner channel economics
    notes: "Impact ratings reflect potential materiality to ARR durability; 'High' indicates the factor could change valuation or deal structure if confirmed. SAP OEM terms, CVE churn impact, and NRR remain unverifiable from public sources alone."

figures:
  - id: FU001
    title: n8n Customer Journey Map
    type: journey-map
    layout: wide
    summary: >
      Maps the three primary customer segments—Community Developer, Technical SMB Operator,
      and Enterprise Buyer—through five adoption stages from discovery to expansion,
      highlighting key conversion gates and touchpoints at each stage.
    description: >
      Maps the three primary customer segments through the adoption funnel from discovery
      to production deployment and expansion, with the key handoff and conversion gates.
    sourceRefs: [SU001, SU003, SU004, SU008, SU010]
    claimRefs: [CU001, CU002, CU003, CU006, CU007, CU008]
    data:
      items:
        - label: "Discovery"
          detail: "Community Dev: GitHub (179k stars), npm (1.4M/week), Reddit r/n8n (220k). SMB: search, Zapier comparison articles, agency referral. Enterprise: RFP, SAP Joule Studio, n8n.io/enterprise, internal champion."
        - label: "Trial / Activation"
          detail: "Community Dev: free self-hosted install, Docker pull (100M+ lifetime), 10k+ templates. SMB: Cloud Starter €24/mo. Enterprise: PoC with self-hosted Enterprise trial, security review, champion escalation."
        - label: "Conversion Gate"
          detail: "Community Dev: needs SSO, compliance, or managed hosting. SMB: execution limit hit or team collaboration required. Enterprise: audit log, RBAC, multi-env, air-gap needed."
        - label: "Production Deployment"
          detail: "Community / Agency: self-hosted VPS / Docker, flat-rate cost, no per-task pricing. SMB: Cloud Pro/Business, 10k–40k executions/month. Enterprise: Enterprise license (self-hosted) or n8n Cloud Enterprise, SLA."
        - label: "Expansion"
          detail: "Agency / Mid-Market: additional clients or workflows; upgrade to higher execution tier. Enterprise: land-and-expand across teams (Delivery Hero model); new use cases (security, data engineering, AI orchestration)."

