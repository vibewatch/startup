  - id: named-customer-proof
    title: Named Customer Proof Points
    body: >
      n8n's named customer portfolio spans at least ten publicly documented enterprise
      deployments. Evidence quality ranges from high-confidence, independently-corroborated
      deployments (Vodafone, Delivery Hero) to n8n-authored case studies with unverified
      executive quotes (KPMG, Icatu). The strongest proof cluster is the following four. [CU012]

      Vodafone UK replaced traditional SOAR tooling with n8n for cybersecurity and threat
      intelligence automation, achieving £2.2 million in annual cost savings and eliminating
      5,000+ person-days of manual security operations annually. [CU012] Incident response
      time dropped from hours to minutes. The deployment handles firewall rule management,
      threat-intelligence data normalization, and SOAR-style automated response at
      production scale within a FTSE 100 security operations center. The case study
      references a Vodafone security team member in a recorded n8n event.

      Delivery Hero (70+ countries, 53,000+ employees) automated IT operations including
      account recovery: ~800 lockout requests/month that previously took 35 minutes each
      now route through an automated Okta/Jira/Google APIs workflow, saving 200+ hours per
      month from a single workflow. [CU013] This deployment is independently referenced
      in multiple third-party sources including casestudies.com, Shakudo, and Goodspeed
      Studio—the strongest corroboration evidence in the portfolio.

      StepStone, the European job board, runs 200+ mission-critical production workflows
      covering candidate data processing, job listing syndication, CRM-ATS sync, and
      multi-system integration. [CU014] New data source integration time was reduced from
      2 weeks to 2 hours (25x improvement). Full data sovereignty through self-hosting
      satisfies StepStone's data privacy requirements. This metric is specific and
      unambiguous, though the case study is n8n-authored.

      Field Aerospace reduced government proposal preparation from 2 weeks (3–4 people)
      to 25 minutes for an 80% complete draft using n8n automation. [CU019]

      In the medium-confidence tier, Fullscript (Canada, healthcare supplements) deployed
      organization-wide for AI workflow enablement, reporting months of employee time
      saved. [CU015] Musixmatch (Italy, music tech) saved 47 days of engineering work in
      4 months. [CU016] Icatu (Brazil, insurance) achieved first-to-market digital insurance
      product launch before competitors via n8n-accelerated development. [CU017] Seguros
      Bolívar (Colombia, insurance) deployed n8n for 3,000 employees toward an AI-first
      transformation. [CU018] KPMG is referenced in n8n marketing and partner-sourced
      content for HR automation at company-wide scale, but no KPMG-authored confirmation
      exists—the lowest-proof-quality reference in the portfolio. [CU021]

      Review-platform evidence provides independent breadth coverage across a wider customer
      base. G2 aggregates 274 verified reviews with a 4.7/5 aggregate; the AI-generated
      summary highlights flexibility, self-hosting, and visual builder as core strengths,
      with steep learning curve for non-technical users as the primary weakness. [CU022]
      PeerSpot rates n8n 8.2/10, with 43% of reviewers from large enterprises and at least
      one reviewer citing 70% reduction in manual processing time. [CU025] Capterra rates
      n8n at 4.6/5 (43 reviews). Software Advice rates n8n at 4.6/5. These platforms are
      verified-user review aggregators with independence from n8n, providing broader
      customer-proof coverage. Trustpilot, by contrast, gives n8n 3.2/5, with reviews
      citing account deletions, support failures, unexpected execution limit changes, and
      the removal of the unlimited workflow executions perk upon purchasing a Business or
      Enterprise license. [CU023] The Trustpilot distribution represents adverse customer
      evidence that directly contradicts the positive G2/PeerSpot signal and should be
      weighted as a structural support and product experience gap, not merely noise.
    claimRefs:
