company:
  name: n8n
chapter:
  number: 6
  title: Customers
  summary: >
    n8n's customer base is large in aggregate and concentrated in technically sophisticated
    buyers. As of May 2026, the company reports 1,400+ enterprise customers (per the SAP
    press announcement), 15,000+ companies using the platform, and a 1.7 million monthly
    active developer and builder community. The most credible independent signal—YipitData's
    B2B spend panel—shows n8n grew its observed mid-market customer count more than 10x
    year over year from January 2025 to January 2026, though enterprise customer count
    has been roughly flat for four months as of January 2026. Named production deployments
    include Vodafone (£2.2M annual savings in cybersecurity automation), Delivery Hero
    (200 hours/month saved from a single IT ops workflow), StepStone (200+ mission-critical
    workflows, 25x faster API integration), Fullscript, Musixmatch, KPMG, Icatu, and
    Seguros Bolívar. Review evidence is strong on G2 (4.7/5, 274 reviews) and PeerSpot
    (8.2/10) but mixed on Trustpilot (3.2/5), where support quality and pricing surprises
    dominate complaints. Critical adverse signals: n8n has never publicly disclosed NRR,
    gross revenue retention, ACV distribution, or top-customer concentration; the
    "3,000 enterprise customers" figure appears in partner-sourced content but the SAP
    announcement quantifies only 1,400+; self-hosted Community users vastly outnumber
    paying customers (500,000+ free installations vs. 15,000+ paying companies); and
    repeated critical security vulnerabilities (CVE-2026-21858, CVE-2026-25049) have
    introduced enterprise trust risk that is not yet reflected in disclosed retention data.

sections:
  - id: customer-base-segmentation-adoption
    title: Customer Base Segmentation and Adoption Trajectory
    body: >
      n8n's addressable customer universe spans three structurally distinct segments that
      have very different revenue profiles: (1) the free self-hosted Community tier,
      (2) cloud subscription SMBs and mid-market teams, and (3) paid Enterprise customers
      using either n8n Cloud Business/Enterprise plans or self-hosted Enterprise licenses.

      The Community tier is the largest by headcount and the least commercially visible.
      Over 500,000 active self-hosted installations have been counted as of late 2024–2025,
      primarily developers, startups, digital agencies, and technically capable operators
      who install n8n on a VPS or internal server. These users generate no direct license
      revenue for n8n but represent the dominant source of brand awareness, community
      contributions, npm downloads (1.4 million+ weekly), and eventual enterprise pipeline.
      The conversion rate from self-hosted Community to any paid tier is not publicly
      disclosed; based on open-source SaaS comparables (GitLab, Mattermost, Grafana), it
      is estimated at 1–5%. This structural gap means the majority of n8n's publicized
      user figures—230,000+ active users, 1.7 million monthly active developer community—
      do not correspond to paying accounts. [CU011]

      The paying commercial segment—15,000+ companies using n8n according to raascloud.io
      aggregation, and approximately 3,000+ enterprise customers per partner-sourced
      statistics—is the commercially significant cohort. [CU004] YipitData's proprietary
      B2B spend panel, which tracks real software usage and spend across 1,300+ mid-market
      and enterprise companies, provides the most independent trajectory signal: n8n grew
      its observed mid-market customer count from 12 to 122 between January 2025 and
      January 2026, a 10x year-over-year increase, with 14% month-on-month growth as
      recently as January 2026. [CU002] Nearly 80% of n8n's new mid-market customers
      over that period were already Zapier users, indicating that n8n's primary growth
      vector is Zapier displacement rather than net-new workflow automation adoption. [CU006]

      Enterprise customer growth, per YipitData, has been roughly flat for four consecutive
      months through January 2026, and the share of customers spending more than $10,000
      annually has plateaued since late 2025. [CU003] This signals a real challenge:
      converting mid-market technical champions into enterprise budget line items requires
      procurement relationships, vendor security reviews, and executive sponsorship that
      n8n's self-hosted, developer-led motion does not automatically generate. The SAP
      strategic investment announced May 2026 represents a direct attempt to unlock
      enterprise procurement channels, with n8n embedded inside SAP Joule Studio
      targeting SAP's massive enterprise install base. [CU009]

      Geographically, n8n skews European in heritage (founded in Berlin, backed by European
      VCs) but >50% of users are in the United States per web traffic analysis. EMEA—
      particularly Germany, UK, and France—leads for data-sovereignty-motivated self-hosted
      enterprise deployments due to GDPR sensitivity. India and Brazil represent high-volume
      community adoption with lower enterprise ACV. Named enterprise customers are weighted
      toward Europe and North America: Vodafone (UK), StepStone (Germany/Europe), Delivery
      Hero (Germany/global), Fullscript (Canada), KPMG (global), Icatu (Brazil), Seguros
      Bolívar (Colombia), TMNZ (New Zealand). [CU008]

      By vertical, the most credibly documented enterprise deployments cluster in: telecom /
      cybersecurity (Vodafone), food delivery / IT operations (Delivery Hero), digital
      recruiting / data integration (StepStone), healthcare supplements (Fullscript),
      music / media (Musixmatch), insurance / fintech (Icatu, Seguros Bolívar, TMNZ),
      professional services (KPMG, Deda.Tech), and government proposal automation (Field
      Aerospace). n8n's enterprise page states that 34% of Fortune 500 companies are
      using n8n's advanced security and DevOps features, but this figure is sourced from
      n8n itself with no independent corroboration and is a diligence gap. [CU010]

      Among Go-to-Market engineering practitioners, 54% adoption was reported by GTME Pulse
      in 2026, driven by the economics of flat-rate versus per-task pricing at high workflow
      volumes. [CU007] Agency adoption is significantly above average due to multi-client
      deployment economics: an agency running 200,000+ automation tasks monthly pays server
      costs on self-hosted n8n rather than $1,000–$2,000/month at Zapier task rates.
