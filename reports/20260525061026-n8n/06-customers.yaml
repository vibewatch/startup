  - id: retention-expansion-concentration-risks
    title: Retention, Expansion, Concentration, and Adverse Evidence Gaps
    body: >
      n8n has not publicly disclosed any standard SaaS retention metrics—NRR, GRR, annual
      churn rate, or cohort retention data. [CU024] The absence of this data is itself a
      material diligence gap: for a company claiming 1,400–3,000 enterprise customers and
      $100M+ ARR (per May 2026 SAP announcement), the lack of a disclosed NRR in any
      investor communication, press release, or founder interview is notable and atypical
      compared to public SaaS peers at similar scale. Diligence requests should specifically
      target: logo retention by cohort year (2021, 2022, 2023, 2024); ACV distribution by
      decile; top-10 customer concentration as percentage of total ARR; and net expansion
      revenue as a percentage of the prior year's base.

      Structural retention headwinds are identifiable from public evidence, even absent
      disclosed metrics. The self-hosted Community Edition's unlimited free capability
      creates a credible downgrade pathway: enterprise customers who standardize on
      self-hosting during a contract period can, in theory, decline to renew a paid license
      if they have internalized the platform and built operational capability to manage it
      independently. [CU030] Unlike SaaS platforms where all value is delivered through
      the hosted service, n8n's fair-code model means the core product is separable from
      the commercial relationship.

      The YipitData B2B spend panel data provides the clearest available signal on
      retention dynamics. Among mid-market and enterprise companies using both n8n and
      Zapier, companies are 50% more likely to drop Zapier than n8n—suggesting that
      once adopted, n8n has stronger stickiness than its incumbent competitor within
      a shared-use cohort. [CU026] However, YipitData also notes that n8n's enterprise
      customer count has been roughly flat for four months through January 2026 and the
      share of customers spending >$10K annually has plateaued—indicating that high-value
      enterprise expansion is stalling. [CU003]

      The security incidents of 2025–2026 represent the most concrete adverse enterprise
      adoption signal. CVE-2026-21858 ("Ni8mare"), rated CVSS 10.0 and affecting versions
      below 1.121.0, exposed 59,559 internet-connected n8n instances to unauthenticated
      remote server takeover as of January 11, 2026, per Shadowserver Foundation data. [CU032]
      CVE-2026-25049, disclosed February 2026, demonstrated that the patch for the prior
      December 2025 vulnerability (CVE-2025-68613) was bypassable by authenticated users
      with workflow creation permissions. [CU033] The Register reported that Pillar Security
      researchers warned the n8n Cloud multi-tenant architecture "could allow a single
      malicious user to access other customers' data" if exploited. These vulnerabilities
      are not hypothetical: exploitation requires low effort (a public webhook with a
      JavaScript destructuring expression suffices per the proof-of-concept), and the
      platform processes sensitive credentials including OpenAI keys, Anthropic credentials,
      and AWS accounts. Enterprise customers requiring SOC 2 or ISO 27001 supply-chain
      reviews may demand contract concessions, indemnification language, or migration to
      air-gapped deployments as a condition of renewal.

      The "logo inflation" adverse angle is also material. Multiple partner and aggregator
      sources cite "3,000 enterprise customers" (Goodspeed Studio, Shakudo, gitnux.org,
      raascloud.io); the SAP press release from May 2026—authored by Highland Europe,
      n8n's Series B investor—states "more than 1,400 enterprise customers." [CU028]
      The gap between 1,400 and 3,000 is unexplained and unreconciled across sources.
      n8n itself has not published an audited enterprise customer count.

      Concentration risk is invisible from public data. No public source discloses what
      percentage of n8n's ARR is attributable to its top 10 or top 25 customers. [CU035]
      The SAP embedded-license deal—if structured as material revenue—could itself represent
      a new form of customer concentration risk. [CU027] No commercial terms for the SAP
      deal have been published.

      Community-to-paying conversion remains structurally low. The estimated 1–5% conversion
      rate from self-hosted Community to any paid tier means that approximately 95–99% of
      n8n's self-hosted install base generates no direct revenue. [CU011] This creates a
      top-of-funnel that is genuinely massive and drives organic marketing, but it also means
      that n8n's revenue quality depends almost entirely on its ability to serve and retain
      the small commercial cohort, while the large free cohort dilutes headline "user" metrics.

      Trustpilot reviews reveal a structural support gap: paying enterprise customers report
      inability to reach sales teams when trying to expand spend, suggesting inadequate
      customer success coverage relative to the commercial potential in the installed base. [CU029]
      The satisfaction stratification between enterprise-weighted review platforms (G2 4.7/5,
      PeerSpot 8.2/10) and open-platform sites accessible to free/SMB users (Trustpilot
      3.2/5) indicates that enterprise deployers are significantly more satisfied than
      community or SMB users—a positive signal for enterprise retention, but a warning
      that the broader community experience is poor. [CU034]
