tables:
  - id: TU001
    title: n8n Customer Segment Map
    description: >
      Segment definitions by buyer/user/payer, use case profile, scale indicator, revenue
      or strategic value, and primary evidence gap.
    sourceRefs: [SU001, SU003, SU004, SU008, SU010]
    claimRefs: [CU001, CU002, CU003, CU004, CU007, CU008, CU009]
    columns:
      - Segment
      - Buyer / User / Payer
      - Primary Use Cases
      - Scale Indicator
      - Revenue / Strategic Value
      - Evidence Gap
    rows:
      - - Community / Self-Hosted (free)
        - Individual developers, startups, digital agencies
        - Prototyping, internal tooling, GTM automation, learning
        - 500,000+ active installations; 1.7M monthly active developer community
        - None direct; pipeline / brand value only
        - No conversion rate disclosed; free tier cannibalizes cloud
      - - Cloud SMB / Starter / Pro
        - Technical operators, small teams, agencies
        - Workflow automation, SaaS integration, AI agent builds, outbound GTM
        - 15,000+ paying companies estimated (all tiers combined)
        - Low ACV ($24–$60/mo); high volume
        - No disclosed churn, ARPU, or cohort retention
      - - Cloud Business / Enterprise
        - Ops, DevOps, IT, security, data engineering teams at mid-market companies
        - ETL pipelines, IT ops automation, AI orchestration, multi-team governance
        - 1,400–3,000 enterprise customers (range; see gap)
        - Moderate–high ACV ($800–$50,000+/year estimated)
        - ACV distribution, NRR, logo retention not public; 3,000 vs 1,400 discrepancy unresolved
      - - Self-Hosted Enterprise (license)
        - CISOs, IT architects, compliance officers at regulated enterprises
        - Air-gapped automation, data-sovereign AI pipelines, HIPAA/GDPR workflows
        - Unknown count within enterprise cohort
        - High ACV; $15,000–$50,000+/year estimated
        - No public segment count or revenue contribution
      - - Digital Agencies / Partners
        - Agency operators building automations for multiple end clients
        - Multi-client outbound, enrichment orchestration, reporting
        - 54% adoption among GTM engineers surveyed; agency adoption above average
        - Margin-driven; economics favor n8n over Zapier at scale
        - No partner revenue or reseller channel disclosed
      - - OEM / Embedded (SAP)
        - SAP enterprise customers via Joule Studio
        - SAP-native agentic workflow automation
        - SAP has 300,000+ enterprise customers globally
        - Potentially large; commercial terms undisclosed
        - No revenue terms, timeline, or minimum commitment published
    notes: "Segment scale indicators combine company-disclosed figures and raascloud.io / worldmetrics.org aggregations; paying company totals are estimates. Community conversion rate of 1–5% is benchmarked against GitLab, Mattermost, and Grafana — not disclosed by n8n."

