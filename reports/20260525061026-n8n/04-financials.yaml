  - id: financial-verdict-gaps
    title: Financial Verdict, Evidence Gaps, and Diligence Agenda
    body: >
      n8n's financial case rests on a verified, extraordinary revenue growth rate (roughly 14x ARR
      in twelve months, from $7.2M to over €100M) alongside a product-led, community-powered
      distribution model that generates near-zero CAC for a significant fraction of its user base.
      The SAP partnership signals both enterprise-grade validation and a new OEM revenue vector.
      These strengths are real and investor-confirmed by a blue-chip syndicate.

      The diligence blockers are equally clear. No audited financials exist. Gross margin is not
      disclosed. NRR, gross revenue retention, and churn have never been published. Burn rate is
      inferred, not reported. The ARR figures are company-disclosed or third-party estimated; the
      methodological basis for GetLatka's and Sacra's specific data points is unclear. The
      valuation step-up from $355M to $5.2B in fourteen months reflects AI market sentiment as
      much as fundamental operating improvement, and the 50–62x ARR multiple remains at levels
      that public markets have historically not sustained for automation software companies.

      The free/self-hosted tier creates structural cannibalization pressure: if a meaningful share
      of enterprise users self-host to avoid execution fees, realized monetization per active user
      remains modest relative to the total community size. The execution-pricing model also
      introduces margin exposure as AI agent workflows generate more executions per user session
      than traditional rule-based automations.

      The financial verdict for a prospective investor or acquirer is: the growth is real and the
      distribution moat through SAP is strategically significant, but no underwriting decision
      should rest on current public evidence alone. The minimum diligence set requires full
      capitalization table, audited or reviewed financials for fiscal years 2024 and 2025,
      ARR bridge by cohort, NRR and gross retention by customer segment, burn rate and
      12-month cash flow projection, and the financial terms of the SAP commercial agreement.
