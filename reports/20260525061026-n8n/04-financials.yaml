  - id: unit-economics-cost-margin
    title: Unit Economics, Cost Structure, and Margin Profile
    body: >
      n8n does not publish audited financial statements, gross margins, net revenue retention,
      customer lifetime value, CAC payback periods, or burn rate. All unit economics must be
      estimated from proxies. Sacra and comparable open-core SaaS benchmarks suggest gross margins
      above 75%—consistent with a software business whose cloud infrastructure cost is primarily
      compute for workflow execution, with no physical goods or professional-services-heavy revenue
      streams. The execution-based pricing model, however, introduces a cost-exposure dynamic: as
      AI agent workflows proliferate (each autonomous agent session potentially triggering hundreds
      or thousands of executions per day), infrastructure cost per subscription could rise
      disproportionately relative to fixed monthly plan fees, compressing cloud gross margin unless
      the company raises prices or limits execution burst.

      For self-hosted enterprise customers, n8n's marginal cost of serving additional workflows is
      near zero—the customer bears all infrastructure cost. This structurally improves gross margins
      on the enterprise license channel relative to cloud. The adverse implication is that a
      customer evaluating cloud-versus-self-hosted at scale will often find self-hosting cheaper,
      creating persistent pricing tension that limits how aggressively n8n can raise cloud plan prices
      without accelerating migration to the free-to-run self-hosted tier.

      Net revenue retention has not been disclosed. For a developer-led, usage-scaled SaaS product
      in a fast-growing workflow automation market, NRR above 120% is typical among best-in-class
      peers. If n8n's NRR is below 110%, the headline ARR figures would require meaningful new-customer
      acquisition to sustain growth, increasing sales and marketing cost per unit of net ARR.

      The cost structure is heavily engineering-weighted, consistent with n8n's product-led growth
      model and open-source community investment. The 2025 headcount of 923 and 406 job postings
      signal that sales and marketing spend is ramping as the company pursues enterprise accounts and
      international expansion. Reported average salary of approximately $60,700/year (Revelio Labs, 2025)
      underrepresents true fully-loaded cost; European software companies at this stage typically pay
      50–80% more in fully-loaded terms inclusive of payroll taxes, benefits, and equity. An estimated
      annual burn rate of $48–120M (implied by headcount and growth stage) is consistent with the
      post-Series C capital deployment guidance of accelerating engineering, enterprise sales, and
      US market entry.

      The open-source conversion funnel also introduces a CAC dynamic that is simultaneously an
      advantage and a risk. CAC for users who discover n8n via GitHub or community is near zero;
      however, enterprise deal conversion from free self-hosted users typically requires a dedicated
      sales motion, technical support, and proof-of-concept cycles that raise blended CAC substantially.
      As n8n moves upmarket, the balance between PLG-driven low-CAC acquisition and high-touch
      enterprise sales will shape the margin trajectory materially.
