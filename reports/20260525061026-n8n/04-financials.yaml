callouts:
  - calloutType: strength
    title: Extraordinary ARR Growth Velocity with SAP Enterprise Anchor
    body: >
      n8n's ARR trajectory—from $7.2M in June 2024 to over €100M by May 2026—represents
      approximately 14x growth in under two years, a rate that ranks among the fastest for
      European software companies. The SAP strategic investment and multi-year OEM agreement
      add institutional enterprise credibility, an embedded distribution channel into 99 of
      the world's 100 largest companies, and a new revenue stream that could structurally
      reduce the net burn rate. These signals together provide a strong case for continued
      scale over the near term.
    claimRefs:
      - CI001
      - CI005
      - CI026
      - CI028
      - CI040

  - calloutType: risk
    title: Valuation Multiple Extreme — Revenue Evidence Unaudited
    body: >
      n8n's $5.2B valuation implies a ~50x forward ARR multiple on disclosed but unaudited
      €100M ARR. No audited financial statements exist, no gross margin or NRR has been
      disclosed, and the company's enterprise customer count has fluctuated between 1,400
      and 3,000+ in less than a year. Sifted's adverse analysis and financial media coverage
      have characterised the multiple as "exceptionally rich" relative to comparable public
      automation companies (UiPath, Appian) that contracted sharply post-IPO. At current
      multiples, any deceleration in ARR growth, margin surprise, or market sentiment shift
      could materially impair valuation.
    claimRefs:
      - CI005
      - CI009
      - CI010
      - CI034
      - CI037

  - calloutType: risk
    title: Self-Hosted Cannibalization and AI Execution Margin Pressure
    body: >
      n8n's open-source model structurally limits monetisation of its largest audience:
      the vast majority of 1.7M monthly active developers will never convert to paid plans
      because the self-hosted Community Edition is functionally equivalent for most use cases.
      Simultaneously, the proliferation of AI agent workflows—which can generate hundreds
      of executions per session—creates execution-cost inflation that may compress cloud
      gross margins unless execution pricing is adjusted. Both forces systematically limit
      the revenue yield per community member and may require pricing model changes that
      risk community backlash.
    claimRefs:
      - CI016
      - CI031
      - CI032
      - CI033

