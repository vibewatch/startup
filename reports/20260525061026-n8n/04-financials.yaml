  - id: capital-adequacy-balance-sheet
    title: Capital Adequacy and Balance Sheet Context
    body: >
      Refer to Chapter 1 (Company Overview) for the full funding chronology from seed through
      Series C. The Financials chapter addresses capital adequacy and forward runway.

      As of May 2026, n8n has raised in excess of $300M in total disclosed equity financing:
      approximately $240M through the October 2025 Series C, plus SAP's approximately $60M
      strategic investment at $5.2B valuation. The company has not disclosed debt facilities,
      convertible notes beyond seed-stage instruments, or project-finance obligations. The
      $180M Series C close (October 2025) is the primary liquidity event for runway estimation.
      n8n guided that Series C proceeds will fund AI capability expansion, US market development
      (New York and London offices), and engineering team growth.

      With an inferred burn rate of $4–10M/month (broad range given headcount uncertainty and
      unknown infrastructure costs), the $180M Series C provides approximately 18–45 months of
      runway from October 2025, or roughly through mid-2027 to late-2027 at the higher burn
      estimate. The SAP investment adds approximately $60M, extending runway by 6–15 additional
      months at comparable burn rates. These estimates suggest n8n is not immediately dependent on
      a new financing round but would likely target a Series D or late-stage round by mid-2027
      absent profitability milestones, particularly given that current growth investment is
      intentionally front-loaded.

      The SAP partnership also introduces a meaningful revenue commitment through the multi-year
      commercial agreement to embed n8n within Joule Studio. The financial terms of this agreement
      have not been disclosed, but OEM/embedded license agreements at enterprise scale routinely
      include guaranteed minimum revenue commitments, which would reduce the effective burn rate
      and extend runway beyond the equity-only estimate.

      There are no publicly disclosed credit facilities, convertible debt, or project-finance
      obligations. The company has not indicated any plans for an IPO on a specific timeline,
      though the $5.2B valuation and SAP corporate partnership create a pathway toward either
      an IPO or a strategic acquisition in the 2027–2029 window.
