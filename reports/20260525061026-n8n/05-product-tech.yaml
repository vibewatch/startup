  - id: enterprise-features-security-and-compliance
    title: Enterprise Features, Security, and Compliance
    body: >
      n8n Enterprise adds a layered governance model on top of the Community foundation.
      Authentication and identity management support SAML 2.0, OIDC, and LDAP with
      IDP-driven user provisioning: when a user joins, changes roles, or departs in the
      identity provider (Okta, Azure AD, etc.), permissions are automatically synchronized
      in n8n at both instance and project levels, eliminating manual access management
      drift. Project-scoped custom RBAC allows administrators to define granular roles
      (builder, reviewer, operator, admin, or arbitrary custom roles) applied per project,
      enabling separation of duties across teams sharing a single n8n instance. Immutable
      audit logs capture every workflow creation, modification, execution, and credential
      access event; logs can be exported or streamed to a SIEM via log streaming (Enterprise
      tier). External secret store integration—supporting HashiCorp Vault and similar
      systems—allows sensitive credentials to be managed outside the n8n instance, reducing
      the blast radius of a compromised n8n deployment. Git-based version control with
      multi-environment support (dev, staging, prod) and visual workflow diffs enables
      teams to apply software-engineering lifecycle practices to automation development.

      The security surface of n8n carries material risk that is well-documented in public
      advisories. CVE-2026-21858 (Ni8mare), disclosed in 2026, is a maximum-severity
      (CVSS 10.0) unauthenticated remote code execution vulnerability affecting n8n
      versions 1.65.0 through 1.120.x. The vulnerability arises from improper Content-Type
      header validation in form-based workflow handling, enabling an unauthenticated attacker
      to read arbitrary files from the server—including the n8n encryption key—and subsequently
      forge session tokens and achieve full remote code execution. With an estimated 100,000+
      internet-exposed n8n servers and 100 million+ Docker pulls, the blast radius is substantial.
      The patch was released in v1.121.0 and no workarounds exist for unpatched deployments.
      Because n8n functions as a centralized credential hub for dozens or hundreds of connected
      services, a single compromised instance can cascade into a full infrastructure breach
      affecting all integrated SaaS platforms, cloud accounts, and databases. Enterprises
      must enforce network segmentation, authentication on all webhook endpoints, and timely
      patch cadence to manage this risk category. The January 2026 supply-chain attack further
      demonstrated that the unsandboxed community node architecture creates a persistent
      credential-exfiltration attack surface that technical controls alone cannot fully eliminate.
