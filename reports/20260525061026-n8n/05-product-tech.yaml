  - id: integrations-extensions-and-ai-capabilities
    title: Integrations, Community Ecosystem, and AI-Agent Capabilities
    body: >
      n8n's integration breadth is divided between official nodes (400+, maintained by
      the n8n engineering team) and community nodes (500+ packages on npm). Community
      nodes follow a strict packaging convention—package names must start with
      "n8n-nodes-" or "@scope/n8n-nodes-" and include the "n8n-community-node-package"
      npm keyword for auto-discovery. From May 1, 2026, nodes submitted for verified
      status through the n8n Creator Portal must be published via GitHub Actions with
      a cryptographic provenance statement (OIDC-signed), making direct local npm publish
      ineligible for verification. This provenance requirement was introduced in direct
      response to the January 2026 supply-chain attack in which eight malicious npm
      packages—including one with 8,385 downloads—mimicked legitimate n8n integrations
      and exfiltrated OAuth tokens to attacker-controlled servers. The critical security
      limitation is that community nodes run with the same privilege level as the n8n
      process itself: they can read environment variables, access the filesystem, make
      outbound network requests, and receive decrypted API keys during execution, with no
      sandboxing or isolation from the n8n runtime. Self-hosted administrators can disable
      community nodes entirely by setting N8N_COMMUNITY_PACKAGES_ENABLED=false.

      The AI-agent tier is the most strategically significant recent expansion. n8n
      provides 70+ native LangChain-based AI nodes that expose LLM model connections
      (OpenAI, Anthropic Claude, Google Gemini, and local models via Ollama), memory
      stores (window buffer, entity memory), vector database integrations (Pinecone,
      Weaviate, Milvus, Qdrant), embedding providers, and retrieval-augmented generation
      (RAG) chain components as first-class visual nodes. AI agent workflows support
      tool-calling, multi-step reasoning loops, human-in-the-loop checkpoints, and
      conversation context preservation across executions. The 10,000+ community workflow
      templates include a large and growing library of AI-agent starter flows. n8n's
      AI positioning differs from standalone LLM orchestration frameworks (LangChain
      Python, Flowise) by embedding AI orchestration within a full business-automation
      context—connecting AI decision nodes to CRM writes, database updates, email sends,
      and webhook callbacks within the same visual workflow.
