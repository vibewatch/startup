chapter:
  number: 5
  title: Product & Technology
  summary: >
    n8n is a Node.js/TypeScript workflow automation and AI-agent orchestration platform
    combining a Vue.js visual canvas with optional JavaScript/Python code nodes, over 400
    official integrations, and 500+ community npm packages. Four deployment modes—managed
    cloud, self-hosted Community, self-hosted Enterprise, and air-gapped—give technically
    sophisticated buyers complete infrastructure sovereignty. A Redis-backed queue mode
    enables horizontal scaling via independent worker processes, while a growing LangChain-native
    AI tier (70+ AI nodes, RAG support, vector-DB integrations) positions n8n at the workflow-
    orchestration layer of the enterprise AI stack. Enterprise governance features—custom
    project-scoped RBAC, SAML/OIDC/LDAP SSO with IDP-driven provisioning, immutable audit
    logs, external secret stores, and Git-based version control—differentiate n8n from
    consumer-grade automation peers. Two critical adverse signals shadow the platform in 2026:
    CVE-2026-21858 (CVSS max severity, 100,000+ estimated exposed servers) and a January 2026
    npm supply-chain attack exploiting the unsandboxed community node ecosystem. Self-hosting
    complexity ($300–$500/month estimated production infrastructure) and the fair-code
    Sustainable Use License—not OSI-approved open source—create material adoption barriers
    for non-technical buyers and limit ecosystem participation compared to permissively
    licensed alternatives.

sections:
  - id: product-definition-and-architecture
    title: Product Definition and Core Architecture
    body: >
      n8n is a fair-code workflow automation and AI-agent orchestration platform built on
      Node.js and TypeScript. The backend workflow engine executes node-based graphs in
      topological order, passing structured JSON data between nodes at each step. The
      frontend visual editor is built with Vue.js and presents a drag-and-drop canvas where
      users connect trigger nodes (webhooks, schedules, polling) to action nodes (API calls,
      data transformations, database writes, AI model invocations) to form directed acyclic
      workflow graphs. Sub-workflows allow modular reuse of workflow logic, and the expression
      engine—a JavaScript-like syntax—enables inline dynamic data mapping between nodes
      without requiring a code node. Custom JavaScript or Python code nodes grant developers
      full programmatic access to the Node.js runtime, including npm package imports.

      The platform ships with more than 400 official integration nodes maintained by the
      n8n team, covering mainstream SaaS APIs (Salesforce, Slack, Google Workspace, GitHub,
      Stripe, etc.), databases, messaging queues, and AI model providers. Beyond official
      nodes, a community ecosystem on npm publishes packages following the
      "n8n-nodes-*" naming convention, bringing the total installable integration surface
      to over 500 community packages as of 2026. Workflow templates—more than 10,000
      pre-built and community-shared—lower the time-to-first-automation significantly.

      The execution model operates in two modes. Single-instance mode runs all workflow
      executions within the main Node.js process, suitable for development and small
      production deployments. Queue mode—recommended for production at scale—decouples
      trigger handling from execution by routing workflow job IDs through a Redis message
      broker to an independently scalable pool of worker instances. Each worker is its
      own Node.js process that fetches workflow definitions from a shared PostgreSQL
      database, executes the workflow, writes results back to PostgreSQL, and signals
      completion to Redis. Workers can be added or removed dynamically without downtime,
      enabling horizontal scaling. The shared encryption key requirement across main and
      worker instances is a security dependency that must be managed carefully in
      multi-node deployments.
