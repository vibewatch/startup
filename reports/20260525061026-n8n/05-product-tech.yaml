  evidenceGaps:
    - id: GE001
      topic: "SOC 2 and ISO 27001 certification status"
      description: >
        No public sources confirm that n8n holds SOC 2 Type II or ISO 27001 certification as of 2026-05-25.
        For regulated enterprise deployments in healthcare, finance, and government, the absence of
        confirmed certification is a material diligence blocker. Investor diligence should request
        current attestation reports directly from n8n.
      relatedQuestionRefs: [QE014]

    - id: GE002
      topic: "Production throughput benchmarks for self-hosted queue mode deployments"
      description: >
        No independently verified throughput benchmarks (maximum workflow executions per second,
        peak concurrent workflows, memory usage at scale) are available in public sources. n8n's
        own documentation lists theoretical capabilities but no third-party performance validation
        was found.
      relatedQuestionRefs: [QE004]

    - id: GE003
      topic: "Fortune 500 enterprise adoption rate"
      description: >
        The claim that 25% of Fortune 500 companies use n8n for business-critical workflows
        (from shakudo.io) could not be independently verified. n8n has disclosed 3,000+ enterprise
        customers and 230,000+ active users but has not released a named Fortune 500 customer list.
      relatedQuestionRefs: [QE025]

    - id: GE004
      topic: "Publish/Save workflow lifecycle feature availability date"
      description: >
        The Publish/Save workflow lifecycle paradigm is on the n8n roadmap per third-party analysis
        but no official n8n release date, GA announcement, or feature specification was found in
        primary sources as of 2026-05-25.
      relatedQuestionRefs: [QE027]

    - id: GE005
      topic: "External secret store compatibility matrix (HashiCorp Vault versions and auth methods)"
      description: >
        n8n Enterprise advertises HashiCorp Vault integration but the specific Vault API versions,
        authentication methods (AppRole, Kubernetes, OIDC), and secret engine types supported are
        not publicly documented. Enterprise buyers should test with their specific Vault configuration.
      relatedQuestionRefs: [QE026]

    - id: GE006
      topic: "Community node count verification"
      description: >
        The 500+ community node package estimate is derived from npm search results and third-party
        statistics sites; n8n does not maintain a public count of verified vs. unverified community
        packages. The actual figure varies as packages are published and removed. Malicious packages
        removed after the January 2026 supply chain attack reduced the count temporarily.
      relatedQuestionRefs: [QE002]

