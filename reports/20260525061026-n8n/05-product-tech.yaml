  - id: deployment-model-and-developer-ergonomics
    title: Deployment Model, Infrastructure, and Developer Ergonomics
    body: >
      n8n offers four distinct deployment options that together define its technical
      differentiation relative to cloud-only competitors. n8n Cloud is the managed SaaS
      offering with automatic updates, security patching, and a tiered pricing structure:
      Starter at $20/month (2,500 executions, 5 concurrent), Pro at $50/month
      (10,000 executions, 20 concurrent), Business at a self-hosted or cloud hybrid
      with SSO/SAML and version control, and Enterprise with unlimited projects, 200+
      concurrent executions, external secret store integration, log streaming, and a
      custom SLA. The Community self-hosted edition is free under the Sustainable Use
      License and supports all integration nodes without feature restrictions, but lacks
      the enterprise governance features unlocked by a paid Enterprise license key.
      The Enterprise self-hosted option adds SSO, RBAC, audit logs, version control,
      multi-environment, and 99.99% SLA support. Air-gapped Enterprise deployment—for
      healthcare, finance, and government organizations with strict data residency or
      network isolation requirements—requires the Enterprise license, manual dependency
      management for Docker images and npm packages, and coordination with n8n's enterprise
      sales team for offline license activation.

      Self-hosting carries material operational overhead that is frequently underestimated
      by buyers. Production-grade deployments require PostgreSQL 13+ (SQLite is unsupported
      in queue mode), Redis for queue mode, a reverse proxy (NGINX or Caddy) for TLS
      termination, S3-compatible object storage for binary data in queue mode, and ongoing
      management of updates, firewall rules, and credential rotation. Infrastructure cost
      for a basic production environment ranges from $300–$500 per month when accounting
      for compute, database, storage, networking, security tooling, and DevOps labor—
      costs that often exceed n8n Cloud pricing at equivalent execution volumes for
      small teams. For non-technical buyers, self-hosting represents a significant
      operational barrier; n8n's own documentation recommends the Cloud option for
      users without server management experience. Current stable version as of May 22,
      2026 is v2.21.7, with minor versions released most weeks and a cumulative history
      of over 1,990 releases.
