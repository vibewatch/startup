  - id: scale-metrics-customer-traction
    title: Scale Metrics and Customer Traction
    body: >
      At the time of its Series C announcement in October 2025, n8n reported 230,000+ active users
      and 3,000+ enterprise customers. The company had experienced 6x user growth and 10x revenue
      growth during 2025 alone, following a pattern of increasing acceleration after its 2022
      strategic AI pivot. Annual recurring revenue (ARR) exceeded $40M as of August 2025 per
      GetLatka data, up from approximately $7.2M in mid-2024—representing roughly 5x ARR growth
      in one year. Earlier growth milestones include crossing $26.5M ARR in July 2025.

      Named enterprise customers include Vodafone, SoftBank, Volkswagen, Delivery Hero, Decathlon,
      KPMG, Twitch, and Musixmatch. n8n reported that Delivery Hero saved 200 hours per month,
      and Musixmatch saved 47 days of engineering work over four months using n8n workflows.

      The GitHub repository had surpassed 70,000 stars as of the Series B announcement in March
      2025 and is consistently ranked among the top 150 GitHub projects of all time. The
      repository has accumulated over 100 million Docker pulls. By 2025, over 80% of workflows
      built on n8n involved AI agent nodes, up from near-zero before the 2022 pivot. Weekly npm
      downloads exceeded 500,000 as of available data.

      Headcount data is inconsistent across sources: Craft.co and The Official Board list
      executive team data suggesting a ~300-person team; Growjo and LeadIQ estimate the total
      workforce at 800+ when including remote and international contractors. The true figure
      likely lies between these extremes, reflecting rapid 2025 hiring following the Series B
      and Series C.
