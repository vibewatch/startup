  - id: founders-leadership-governance
    title: Founders, Leadership, and Governance
    body: >
      Jan Oberhauser is the sole founder and CEO of n8n. Before founding the company, he worked as
      a Pipeline Technical Director (Pipeline TD) at the visual effects studio Digital Domain,
      contributing to VFX pipelines for major Hollywood productions including Pirates of the Caribbean
      4 and Maleficent. His hands-on experience building software pipelines to automate repetitive
      studio tasks directly informed the design philosophy of n8n, which emphasises flexibility,
      developer control, and avoidance of brittle point-to-point integrations.

      Oberhauser started n8n as a side project to solve his own frustrations with existing automation
      tools and initially coded the entire product himself, later hiring early team members through
      the GitHub community. The company's early developer Ricardo Espinoza discovered n8n on Product
      Hunt in 2019 and contributed dozens of integrations before being hired full-time after the
      seed round—a model n8n has continued to use for community-to-employee pathways.

      The broader leadership team includes David Roberts (VP of Product), Cornelius Suermann
      (VP of Engineering), and Claudia Bates (VP of Operations), reflecting a standard functional
      coverage across product, engineering, and operations. The company has grown to a workforce
      of approximately 300 employees as of 2026, per available data, though some estimates place
      total headcount higher when including international contractors. Key-person risk is material:
      Jan Oberhauser's central role in product vision, community engagement, fundraising, and public
      positioning creates single-point-of-failure exposure for investors.

      Board and governance details have not been publicly disclosed. Investor representation on the
      board likely includes at least Accel, Felicis Ventures, and Highland Europe given their lead
      round roles, but formal board composition has not been confirmed in available sources.
