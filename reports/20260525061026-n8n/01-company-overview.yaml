  - id: milestones-risks-adverse
    title: Milestones, Risk Factors, and Adverse Developments
    body: >
      n8n's history includes several adverse events that warrant diligence attention alongside
      its growth milestones.

      In January 2026, security researchers at Endor Labs discovered a coordinated supply chain
      attack targeting the n8n ecosystem: threat actors published eight malicious npm packages
      masquerading as n8n community node integrations (e.g., Google Ads, performance metrics).
      These packages, once installed on self-hosted n8n instances, exfiltrated decrypted OAuth
      tokens and API keys to attacker-controlled servers. The attack is notable because n8n
      community nodes run with the same privilege level as n8n itself—no sandboxing exists
      between node code and the n8n runtime—making the platform a "centralized credential vault"
      that is inherently attractive to supply chain attackers.

      Concurrently, CVE-2026-21858 ("Ni8mare") was disclosed—a maximum-severity (CVSS 10.0)
      unauthenticated file-read vulnerability in n8n's webhook processing logic that could
      escalate to full remote code execution. Over 100,000 internet-exposed n8n servers were
      estimated to be vulnerable. The only remediation was upgrading to version 1.121.0 or later.

      The fair-code/Sustainable Use License has been a sustained source of community controversy.
      Critics argue the model constitutes "open-washing"—marketing a product as open source while
      restricting key OSS freedoms, specifically the right to build commercial SaaS on the codebase.
      Enterprise license fees for commercial SaaS use are reported to start at $15,000–$50,000+
      per year, which is prohibitive for smaller vendors. Pricing shifts and metered execution
      model changes have also drawn backlash from the community, raising questions about long-term
      licensing stability.

      These risks are material to enterprise adoption: security incidents damage trust, especially
      in regulated industries; and licensing uncertainty affects the community ecosystem that is
      central to n8n's growth flywheel.
