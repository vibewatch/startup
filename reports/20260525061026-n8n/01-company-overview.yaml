callouts:
  - calloutType: strength
    title: Community-Led Growth Flywheel with AI Timing
    body: >
      n8n's open-source positioning, combined with its 2022 bet on AI orchestration before
      mainstream awareness, created a compounding growth flywheel: community contributors
      build and share integrations, attracting more technical users, who drive enterprise
      deals, which fund product investment. The 10x revenue and 6x user growth in a single
      year (2025) validates this flywheel reaching escape velocity at the optimal market moment.
    claimRefs:
      - CO013
      - CO014
      - CO023
      - CO032

  - calloutType: risk
    title: Security Architecture and Credential Vault Risk
    body: >
      n8n's architecture makes it a high-value attack surface: community nodes run with the
      same privilege level as the platform itself, with no sandboxing. The January 2026 supply
      chain attack and CVE-2026-21858 both exploit this architectural reality. As n8n scales
      enterprise adoption in regulated sectors, the absence of node isolation and the difficulty
      of patching self-hosted deployments will require structural remediation, not just patch
      management.
    claimRefs:
      - CO025
      - CO026
      - CO049

  - calloutType: risk
    title: Fair-Code Licensing Creates Ecosystem Fragmentation Risk
    body: >
      n8n's Sustainable Use License is a sustained source of community controversy.
      The prohibition on building commercial SaaS without an enterprise license—reportedly
      costing $15,000–$50,000+ per year—limits the commercial ecosystem that could
      otherwise multiply n8n's reach. Pricing shifts and metered-execution model changes
      have historically triggered community backlash and "rug pull" concerns. If trust in
      licensing stability erodes, competitors with more permissive licenses (Node-RED,
      ActivePieces, Windmill.dev) may capture community-powered growth.
    claimRefs:
      - CO003
      - CO027
      - CO028
      - CO029

