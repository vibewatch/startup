company:
  name: n8n
chapter:
  number: 1
  title: Company Overview
  summary: >
    n8n GmbH is a Berlin-based workflow automation and AI agent orchestration platform founded in 2019
    by Jan Oberhauser under a fair-code (Sustainable Use) licensing model. After raising $180M in a
    Series C in October 2025 at a $2.5B valuation led by Accel—with NVIDIA's NVentures and Deutsche
    Telekom's T.Capital participating—the company reported 230,000+ active users, 3,000+ enterprise
    customers, and ARR exceeding $40M following 10x revenue growth in 2025. Security incidents in
    early 2026 (CVE-2026-21858 and npm supply chain attacks) and persistent fair-code licensing
    controversy represent the primary adverse signals to diligence.

sections:
  - id: identity-product-business-model
    title: Identity, Product, and Business Model
    body: >
      n8n GmbH is a Berlin-headquartered software company that operates an AI-native workflow
      automation and orchestration platform. The product allows technical and semi-technical teams to
      connect applications, automate multi-step processes, and deploy AI agents using a visual,
      node-based editor combined with optional custom code in JavaScript or Python. n8n supports
      more than 500 integrations out of the box and an open ecosystem of community-contributed nodes
      published as npm packages.

      The company was founded in 2019 by Jan Oberhauser, who was frustrated by the rigidity and
      lack of extensibility in existing automation tools. He named the product "n8n" as an
      abbreviation of "nodemation"—"node" for the Node.js runtime and view paradigm, and "mation"
      for automation—condensing the eight intermediate letters into a single digit. The platform
      launched on Product Hunt in October 2019 and attracted an early developer community before
      any formal marketing spend.

      n8n operates under a dual-license model it describes as "fair-code." The Sustainable Use
      License makes the source code freely visible and self-hostable at no cost for internal business
      use, while prohibiting the building of competing commercial SaaS products on top of n8n without
      a paid enterprise license. An Enterprise License layered on top adds features including SSO/SAML,
      LDAP, RBAC, audit logs, version control, and air-gapped deployment. Cloud-hosted plans are
      offered on a tiered subscription basis (Starter, Pro, Enterprise). The business model combines
      cloud SaaS subscriptions with high-value enterprise term licenses, targeting organizations that
      need production-grade automation at scale while valuing data sovereignty and self-hosting.

      n8n positions itself in the space between pure rule-based automation (Zapier, Make) and fully
      autonomous AI agents, allowing users to configure exactly how much autonomy to delegate to AI
      models versus enforced deterministic logic. This "hybrid control" positioning, combined with
      the ability to deploy on any infrastructure, has been a primary driver of enterprise adoption
      in regulated industries.
