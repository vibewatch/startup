callouts:
  - calloutType: strength
    title: Self-Hosted Open-Source Model Aligns with Regulatory Tailwind
    body: >
      The convergence of GDPR, HIPAA, NIS2, and the 2026 EU AI Act enforcement creates
      a structural market tailwind for platforms that can deliver enterprise automation
      with full data sovereignty. n8n's self-hosted Sustainable Use License positions it
      as the default choice for regulated enterprise buyers who cannot route sensitive data
      through a third-party SaaS cloud. With 88% of enterprises operating hybrid IT and
      data residency requirements intensifying, the self-hosted model is increasingly a
      procurement requirement rather than an optional feature. Vodafone's documented £2.2M
      saving and SAP's strategic investment at a $5.2B valuation confirm enterprise-grade
      validation of this positioning.
    claimRefs:
      - CM017
      - CM019
      - CM020
      - CM021

  - calloutType: risk
    title: Hyperscaler Bundling and Market Crowding Threaten n8n's Mid-Market SAM
    body: >
      Microsoft Power Automate bundled in M365 E3/E5 licenses represents a procurement-free
      automation option for most enterprise Windows shops, and as Copilot AI features mature,
      it increasingly competes on AI-native capabilities that were n8n's primary differentiator.
      Simultaneously, market crowding from Zapier, Make, Activepieces, and AI-native entrants
      (Gumloop, Tray.ai) is compressing the differentiation space below the enterprise tier.
      Only 12% of AI agents reach full production at large scale, suggesting that n8n's
      AI-native positioning advantage is currently limited to a smaller production-grade buyer
      pool than pilot adoption statistics imply. Gartner's classification of Intelligent
      Automation in the Trough of Disillusionment means that the enterprise AI workflow
      market may contract before it expands as failed pilots generate skepticism.
    claimRefs:
      - CM013
      - CM030
      - CM031
      - CM032
      - CM041

