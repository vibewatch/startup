chapter:
  number: 2
  title: Market Analysis
  summary: >
    The addressable market for n8n spans four overlapping segments—workflow automation ($26–30B TAM in 2026),
    iPaaS ($19B), AI agent orchestration ($11B), and low-code/no-code development ($65B)—yielding a combined
    hyperautomation opportunity exceeding $100B globally. Analyst estimates diverge significantly (9–17% CAGR
    for workflow automation), reflecting methodological differences in segment scope. Enterprise buyers split
    between IT-led governance-first procurement and developer-led self-hosted tooling, with regulated industries
    driving disproportionate demand for self-hosted options. Growth is structural—driven by AI-native workflow
    primitives, hyperscaler SaaS proliferation, and the shift from RPA-first to API-first automation—but faces
    material headwinds from hyperscaler bundling, market crowding, commoditization of basic automation features,
    and a Gartner-documented Trough of Disillusionment for Intelligent Automation.

sections:
  - id: market-boundary-and-category-definition
    title: Market Boundary and Category Definition
    body: >
      n8n operates at the intersection of four distinct but overlapping software categories: workflow
      automation, Integration Platform as a Service (iPaaS), AI agent orchestration, and low-code/no-code
      application development. Each category uses different analyst perimeters, which explains the wide
      variance in published TAM figures. The functional overlap has grown substantially in 2025–2026 as
      workflow tools added enterprise-grade governance, iPaaS vendors added low-code builders, and AI
      agent frameworks turned conventional workflow engines into agentic orchestration layers.

      Workflow automation in its narrowest definition—API-triggered, linear DAG-based task automation
      connecting cloud SaaS applications—is closest to n8n's core product. This segment excludes pure
      RPA (desktop UI automation for legacy systems), heavyweight BPM process management, and the
      data-integration pipelines that MuleSoft or Boomi serve. The practical buy-vs-build boundary for
      buyers is determined by three factors: how technical the team deploying the tool is, whether data
      sovereignty or air-gap requirements constrain hosting choice, and whether AI-native agent loops are
      needed alongside deterministic automations. n8n addresses all three axes uniquely among its peers:
      it is the only at-scale player with a self-hosted open-source tier, native AI agent primitives, and
      developer-first extensibility through JavaScript and Python custom code.

      Status-quo substitutes include manual processes (the most common alternative in SMBs), custom-coded
      internal tooling, spreadsheet-based coordination, and platform-native automation embedded in CRM/ERP
      systems (Salesforce Flow, SAP Automation Pilot, HubSpot workflows). In enterprise accounts, the
      dominant status quo is Microsoft Power Automate, which ships bundled in E3/E5 Microsoft 365 licenses
      and controls approximately 19% of the enterprise automation market by installed base. For n8n to
      displace incumbent tooling, its total-cost-of-ownership and extensibility advantage must outweigh
      migration friction and IT change management overhead.
