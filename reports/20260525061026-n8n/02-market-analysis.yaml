  - id: market-sizing-and-estimates
    title: Market Sizing and Estimates
    body: >
      Analyst estimates for the workflow automation TAM in 2026 cluster between $24.7B and $30B, with a
      median near $26.5B. The spread ($5.3B range) reflects material methodological differences: Mordor
      Intelligence ($26.0B) scopes out pure RPA software; Coherent Market Insights ($29.9B) bundles in
      a broader business process management layer; MarkNtel Advisors ($24.7B) uses a narrower cloud-first
      SaaS definition; Fortune Business Insights ($27.9B) includes professional services. All four firms
      agree on a CAGR of 9–17% through the early 2030s, with AI integration cited as the primary driver
      for the higher end of the range.

      The iPaaS segment is the most adjacent. Fortune Business Insights puts the 2026 iPaaS TAM at
      $19.15B with a 24.2% CAGR through 2034. Gartner's 2024 Market Share Analysis quantified the iPaaS
      segment at $8.5B in 2024 (23.4% YoY growth), making it the second-fastest-growing enterprise
      software middleware segment. These figures are methodologically distinct—Gartner uses a narrower
      enterprise-focused perimeter—but both confirm that the integration layer is expanding rapidly
      alongside the proliferation of SaaS applications. The average enterprise now uses approximately
      300 SaaS applications, creating structural demand for connectivity solutions that no single vendor
      ships natively.

      The AI agent orchestration layer is smaller but growing faster. Dimension Market Research estimates
      the market at $11.0B in 2026, projecting $115.1B by 2035 at 29.8% CAGR. Tech-Insider cites a
      convergence of analyst estimates at $9.1–10.9B for 2026. Deloitte and Gartner forecast that 33%
      of enterprise software applications will embed agentic AI by 2028, up from under 1% in 2024—a
      projection that, if realized, would make every major workflow automation vendor an AI orchestration
      vendor by default.

      Sizing n8n's SAM and SOM within these categories requires judgment. n8n's self-hosted, developer-first
      profile restricts its addressable buyer pool to technically capable teams in organizations that either
      require data sovereignty or are optimizing for TCO at scale. This narrows the SAM from the full
      $26B TAM to roughly the $2–6B sub-segment of API-first workflow automation excluding RPA and iPaaS
      enterprise segments. SOM is further constrained by the current $3,000+ enterprise customer base
      and 230,000+ active users, implying a current monetization capture of well under 1% of even the
      narrowed SAM. Diligence gaps remain: no independent market sizing of the open-source self-hosted
      workflow automation sub-segment has been published as of May 2026.
