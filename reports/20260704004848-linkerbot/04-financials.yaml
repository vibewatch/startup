callouts:
- calloutType: strength
  title: A rare piece of financial-disclosure-grade evidence exists via a public-market shareholder
  body: Listed company Dongfang Precision's disclosed ~4.36% direct equity stake in Linkerbot, confirmed via its own regulated investor-relations channel, is a stronger evidentiary anchor for Linkerbot's cap table than any press release, because it comes with a public company's own disclosure obligations attached.
  claimRefs:
  - CI017
- calloutType: risk
  title: Revenue, margin, and balance-sheet disclosure are essentially absent
  body: No reviewed source discloses Linkerbot's revenue, gross margin, headcount, cash position, or burn rate; the entire public record is built on unit-shipment counts and financing-round announcements rather than financial-statement data.
  claimRefs:
  - CI013
  - CI019
  - CI025
  - CI027
- calloutType: risk
  title: Two funding events three months apart are not reconciled
  body: A ~RMB 1.5B Series B round (Feb 2026) and a ~$3B 'Series B+' valuation (May 2026) are both well-corroborated individually, but no source explains how much new capital, if any, the second event actually represents versus a valuation re-rating on existing capital.
  claimRefs:
  - CI030
- calloutType: assumption
  title: Aggressive future pricing targets are unverified against cost data
  body: A co-founder's stated 3-year target of sub-$70 unit pricing is treated here as a stated aspiration, not a verified cost-curve outcome, because no gross-margin or BOM-cost data exists to confirm it is achievable without sacrificing unit economics.
  claimRefs:
  - CI004
  - CI025
