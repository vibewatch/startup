company:
  name: Linkerbot
chapter:
  number: 4
  title: Financials
  summary: 'Linkerbot''s public financial record is almost entirely unit-shipment and financing-round evidence rather than revenue, margin, or balance-sheet disclosure: a ~$920 O6 list price and a co-founder''s stated sub-$70 three-year target are the only pricing data points found, and no source discloses gross margin, headcount, cash position, or burn rate. Capital adequacy evidence includes a ~RMB1.5B Series B round (Feb 2026) and a ~$3B ''Series B+'' valuation (May 2026) that are not reconciled with each other, plus a rare financial-disclosure-grade data point: listed company Dongfang Precision discloses holding ~4.36% direct equity in Linkerbot. The financial verdict is that revenue quality, margin path, and capital efficiency cannot currently be assessed from public sources, a material blocker versus comparable peer Unitree''s own IPO-prospectus-level disclosure.'
sections:
- id: revenue-and-pricing
  title: Revenue streams, pricing model, and recognition gaps
  body: Linkerbot's only clearly disclosed revenue stream is hardware sales of its Linker Hand product family, a line spanning at least 13 SKUs from 6 to 42 degrees of freedom, sold directly to industrial buyers, humanoid-robot integrators, and research institutions. The company also markets a software/platform layer — the LinkerSkillNet manipulation-skill ecosystem and the Open TeleDex teleoperation system — but no reviewed source discloses whether these generate separate license, subscription, or data-access revenue distinct from hardware sales; this is recorded as an open question rather than assumed to be either a real revenue line or pure marketing. On pricing, an independent industry tracker attributes a list price of approximately ¥6,666 (about $920) to the O6 entry-tier model, the only specific unit price found anywhere in reviewed sources, and quotes a company co-founder predicting prices could fall below ¥500 (about $70) within three years — an aggressive forward cost target rather than a stated current price. No source discloses pricing for the higher-DoF flagship models (L20, L20G, L30, L30Z, O7, and others), so a full pricing ladder across the product line cannot currently be constructed, and with no revenue-mix disclosure, revenue-recognition treatment cannot be assessed.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  - CI036
  tableRefs:
  - TI001
  - TI002
- id: gtm-and-cost-structure
  title: GTM motion, sales efficiency, and cost structure
  body: Linkerbot's disclosed go-to-market motion is direct sales to named industrial and research accounts (Samsung, Siemens, and research use described as including Stanford and MIT) combined with international press and trade-show visibility, most notably its CES 2026 debut; no reviewed source discloses a formal reseller or distributor network, and no source discloses sales-cycle length, customer acquisition cost, or payback-period proxies. On cost structure, industry commentary attributes Linkerbot's low list pricing partly to proprietary componentry (PEEK engineering polymer, in-house micro-reducers) and manufacturing scale rather than disclosed labor, overhead, or logistics figures; no source discloses gross margin, bill-of-materials cost, working-capital position, or planned capital expenditure beyond a general statement that new financing funds 'production capacity' improvements. Peer coverage of comparable manufacturing-scale thresholds (for example, AgiBot's push past 10,000 units) frames how capital-intensive reaching Linkerbot's own stated 10,000-unit/month target is likely to be, even though no Linkerbot-specific capex figure is available.
  claimRefs:
  - CI006
  - CI007
  - CI008
  - CI009
  - CI010
  - CI011
  - CI024
  figureRefs:
  - FI004
- id: public-traction-and-gaps
  title: Public traction versus private-metric gaps
  body: 'Linkerbot''s public traction is entirely unit-and-production based: the company disclosed shipping its 10,000th cumulative dexterous hand by December 2025 and scaling monthly production from almost 5,000 toward a targeted 10,000 units by mid-2026, alongside a separate Chinese-language report that the company targeted delivering 50,000 to 100,000 units across all of 2026 — a target five to ten times its disclosed end-2025 cumulative shipment level. None of this activity is matched by any disclosed financial-statement-level metric: no source discloses revenue, ARR, gross merchandise value, active-customer count, or utilization data. CB Insights maintains an analyst-tracked company profile, indicating some independent financial-data-provider coverage exists, though the specific financial fields it carries were not visible in the reviewed excerpt. This leaves a structural gap between strongly corroborated operational/unit traction and a complete absence of financial traction evidence.'
  claimRefs:
  - CI012
  - CI013
  - CI014
  - CI028
  tableRefs:
  - TI005
  figureRefs:
  - FI001
- id: capital-adequacy
  title: Capital adequacy and financing dependency
  body: Building on (but not restating) the historical round-by-round chronology recorded in the Company Overview chapter, this chapter's capital-adequacy-specific evidence shows Linkerbot closing a Series B round of roughly RMB 1.5 billion (about $210 million) around February 12, 2026, led by Daode Investment and Shengshi Investment with a long list of additional participants, with disclosed use of proceeds centered on core R&D, production-capacity expansion, and full-stack manipulation-platform capability. By early May 2026 the company had closed a further 'Series B+' round at approximately a $3 billion valuation with investors including Ant Group, HongShan Group, Zhongguancun Science Park Fund, Bank of China Asset Management, and Fosun Capital, and disclosed a roughly $6 billion target for its next round. Separately, listed company Dongfang Precision (002611.SZ) discloses holding an approximately 4.36% direct equity stake in Linkerbot, confirmed unchanged as of a June 2026 investor-relations response citing its 2025 annual report — a rare piece of financial-disclosure-grade evidence about Linkerbot's cap table, since it comes through a public company's own regulatory disclosure obligations rather than press coverage of the private company itself. No source reconciles the February 2026 Series B round size with the capital implied by the May 2026 Series B+ valuation, so the amount of dilution and capital efficiency between the two events cannot be fully decomposed. No source discloses cash on hand, monthly burn, runway, a specific next-round trigger milestone, or any debt/project-finance obligation; China's National Development and Reform Commission's 2026 warning about sector-wide overcapacity among more than 150 domestic humanoid-robot companies is a relevant adverse macro signal for how aggressively Linkerbot's rapid, repeated financing cadence should be read.
