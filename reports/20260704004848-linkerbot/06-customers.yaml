- calloutType: risk
  title: All named-customer evidence is logo-level, not outcome-level
  body: No source for any of the six named customers/institutions (Samsung, Siemens, Stanford, MIT, Cambridge, University of Hong Kong) specifies production-vs-pilot status or a quantified outcome; this is a materially thinner evidence base than a true case study.
