chapter:
  number: 6
  title: Customers
  summary: 'Linkerbot''s customer evidence spans industrial (Samsung Electronics, Siemens) and research (Stanford, MIT, Cambridge, University of Hong Kong) segments, with Samsung the best multi-source-corroborated named account and the rest resting on one or two sources or company statements alone. Adoption trajectory is documented through unit-shipment counts (10,000+ by Dec 2025, targeting 10,000 units/month and 50,000-100,000 units for full-year 2026) rather than account-level metrics, and a March 2026 Zhongguancun technology-competition win adds independent third-party validation. Retention, churn, satisfaction, customer-concentration, and outcome-level proof are complete blind spots: every named-customer relationship found is logo-level only, with no source confirming production-vs-pilot status or measurable outcomes.'
sections:
- id: customer-segmentation
  title: Customer base segmentation
  body: Linkerbot's disclosed customer base segments into at least three groups. Industrial and electronics-manufacturing customers — named across multiple sources as Samsung Electronics and Siemens — represent the segment where buyer, user, and payer are typically the same corporate procurement/automation function. Research institutions — Stanford, MIT, and Cambridge per company press materials, plus the University of Hong Kong per independent press coverage — represent a segment funded through grants and lab budgets rather than direct commercial procurement, valuable for reputational and pipeline reasons more than direct revenue. Humanoid-robot integrators are an implied third buyer class (since Linkerbot's hands are designed to be mounted on robot platforms), but no reviewed source names a specific integrator as a direct Linkerbot customer. No source discloses geographic distribution beyond these named accounts, company size/revenue-band segmentation, or a full customer-count breakdown by segment, leaving segmentation analysis anchored to a small number of named logos rather than a complete account map.
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  tableRefs:
  - TU001
- id: adoption-trajectory
  title: Adoption trajectory
  body: Linkerbot's adoption trajectory is documented almost entirely through unit-shipment and production-scale disclosures rather than account-level metrics. Monthly order volume was reported surpassing 1,000 units by November 2025, cumulative shipments exceeded 10,000 units by December 2025, and by May 2026 the company described scaling monthly production from almost 5,000 toward a 10,000-unit target. A separate Chinese-language report states the company targeted delivering 50,000 to 100,000 units across all of 2026 — a target substantially above its disclosed end-2025 cumulative level, though no source confirms a mid-year run-rate against that target. Beyond unit counts, Linkerbot also won the championship title at the 9th Zhongguancun International Advanced Technology Competition (announced March 26, 2026) among more than 2,100 participating global projects, a form of third-party technical validation distinct from a direct sales or usage metric. No reviewed source converts any of this shipment activity into a distinct-customer-account count, deployment-location count, or utilization rate, so adoption trajectory remains a production-scale story rather than a customer-account story.
  claimRefs:
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU002
  figureRefs:
  - FU002
- id: named-customer-proof
  title: 'Named customer proof: production vs. pilot and evidence freshness'
  body: 'Six named customers/institutions were found across reviewed sources: Samsung Electronics and Siemens on the industrial side, and Stanford, MIT, Cambridge, and the University of Hong Kong on the research side. Samsung Electronics has the strongest evidentiary basis, named consistently across three independent-ish sources (China Biz Insider, PR Newswire, and Interesting Engineering); Siemens and Stanford each have two-source corroboration; MIT and Cambridge appear only in Linkerbot''s own press release without independent confirmation in the sources reviewed; and the University of Hong Kong appears only in a single independent press source not mentioned in Linkerbot''s own reviewed materials. Critically, no source for any of the six specifies whether the relationship reflects a production deployment, a pilot, or a one-time demonstration/loan of equipment, and no source provides any quantified outcome metric (cycle-time improvement, defect-rate change, cost savings) for any account — all customer proof found here is logo-level rather than outcome-level. All of this evidence is dated between November 2025 and May 2026, meeting the freshness bar for a mid-2026 report, though no source explicitly reconfirms these relationships are still active as of the report date.'
  claimRefs:
  - CU009
  - CU010
