- id: retention-expansion-concentration
  title: Retention, durability, expansion, and concentration risk
  body: 'On retention and durability, the public record is empty: no reviewed source discloses net or gross revenue retention, churn, renewal rate, contract length, or any customer-satisfaction metric for Linkerbot, and no source documents repeat-purchase behavior for any specific named account, so the rising order-volume trend cannot be attributed to new-customer growth, repeat/expansion orders, or some mix of both. On expansion and concentration, no source discloses a top-customer or top-5-customer revenue share, nor a total distinct customer/logo count, making it impossible to assess concentration risk as a share of the total account base rather than only in absolute, named terms. Channel/partner dependence appears limited based on Linkerbot''s disclosed direct-sales and trade-show go-to-market motion, though two international B2B trade-directory listings — an HKTDC supplier storefront and a Hannover Messe exhibitor page — both returned not-found results as of the report date, a minor procurement-friction signal for prospective international buyers who might discover Linkerbot through those channels. At the sector level, China''s National Development and Reform Commission''s 2026 warning about more than 150 domestic humanoid-robot companies is a relevant adverse signal: an increasingly crowded competitive field could create customer-switching pressure that Linkerbot''s currently thin retention and concentration disclosure gives no way to evaluate. Overall, the customer-evidence profile combines credible, multiply-corroborated named-customer logos with a near-total absence of retention, concentration, satisfaction, and outcome-level evidence — a pattern more consistent with an early-scaling hardware company than a mature enterprise vendor.'
