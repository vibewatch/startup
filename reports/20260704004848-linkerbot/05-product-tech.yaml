- id: differentiation-trust-compliance
  title: Differentiation, trust, and compliance
  body: 'Linkerbot''s stated technology differentiation rests on three pillars: covering all three major actuation approaches in one product family (versus rivals that typically specialize in one), proprietary materials and manufacturing (PEEK polymer, in-house micro-reducers), and a claimed 80%+ market-share position built on cost/scale leadership rather than a single patentable breakthrough — no reviewed source discloses any patent portfolio, filing, or granted IP protection specific to Linkerbot''s methods, and no source discloses manufacturing facility count or component-supplier detail. On trust and compliance, the picture is thin: no formal safety or quality certification (e.g., against ISO 10218 or ISO/TS 15066) is disclosed as held by Linkerbot specifically, though the company''s ROS SDK README does include informal, developer-facing safety notes for hardware operation. No data-privacy or security policy was found for manipulation-skill or teleoperation data collected via LinkerSkillNet or Open TeleDex, and no manufacturing quality-control process (incoming/in-line/outgoing QA) is disclosed. China''s National Development and Reform Commission''s 2026 warning about excessive product duplication among more than 150 domestic humanoid-robot companies is a relevant sector-level adverse signal for whether rapid SKU proliferation across this whole industry — Linkerbot''s 13+ SKUs included — has been matched by proportional quality and safety investment. Overall, the gap between demonstrably active open-source developer tooling and a near-total absence of disclosed certifications, IP, or reliability data suggests Linkerbot''s public disclosure strategy currently favors developer adoption and press visibility over formal enterprise-trust documentation.'
  claimRefs:
