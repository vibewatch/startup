company:
  name: Linkerbot
chapter:
  number: 5
  title: Product & Technology
  summary: Linkerbot's product is a dexterous robotic-hand end-effector integrated via a genuinely open, GitHub-hosted ROS/ROS2 SDK, URDF models, and a simulator, spanning direct-drive, linkage, and tendon-driven actuation across 13+ commercial SKUs. Flagship specs (L30 ±0.2mm repeatability, O6 370g/50kg payload, L20 90%-efficient 'Super Electric Cylinder') are company-claimed and only partially independently corroborated, and the SDK's documented model-support list only partially matches the official sitemap's SKU list. Two of the most-marketed layers, Open TeleDex and LinkerSkillNet, have no visible open-source footprint, and no formal safety/quality certification, patent portfolio, or field reliability data was found for any product, leaving trust and compliance as the chapter's largest evidence gap.
sections:
- id: product-definition-and-modules
  title: Product definition, workflow, and module map
  body: In customer workflow terms, Linkerbot's product is a dexterous robotic-hand end-effector that an integrator mounts on a robot arm or humanoid platform and controls through a ROS or ROS2 driver stack and a Python/C++ SDK, rather than a complete robot the customer buys outright. The documented integration workflow — installing the SDK on Ubuntu 22.04 with ROS Humble and Python 3.10+, configuring hand parameters via a setting.yaml file, and then driving the hand through ROS topics or the LinkerHandApi Python class — is directly observable in Linkerbot's own GitHub-hosted SDK repositories. The company's official sitemap lists at least 13 distinct product pages (L6, L10, L20, L20G, L30, L30Z, O6, O7, D, J, R, W, YCB), but the ROS2 SDK's own README documents hardware support for a different, only partially overlapping model list (O6, L6, L7, O7, L10, L20, G20, L21) — a naming and coverage mismatch that is recorded here as an explicit inconsistency rather than assumed away. Flagship specifications disclosed in company materials include the L30's approximately ±0.2mm repeatability for precision-assembly work and the O6's 370g weight paired with a 50kg grip payload, attributed to PEEK engineering polymer and in-house-developed micro-reducers.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE006
  tableRefs:
  - TE001
- id: architecture-and-technology
  title: Architecture and operating model
  body: Linkerbot's hands cover three distinct actuation architectures — direct-drive, linkage, and tendon-driven — within a single product family, which an independent industry tracker highlights as unusually broad technology-route coverage compared to most single-architecture rivals. The industrial-tier L20 is described in company materials as using a proprietary 'Super Electric Cylinder' delivering 90% drive efficiency, 200N screw-end thrust, and a tested lifespan exceeding one million cycles, while a multi-modal 'sensing skin' tactile layer is marketed across the hand family. Above the hardware layer sits an open-source ROS/ROS2 SDK, URDF models, and a simulator (linker-sim) hosted on GitHub under the linker-bot organization — genuinely observable developer tooling rather than a marketing claim. By contrast, no GitHub repository or technical documentation was found by name for 'Open TeleDex' or 'LinkerSkillNet,' the two higher-level platform names the company markets most prominently; the closest matching repository is a general teleoperation-arm utility, suggesting these product names may sit over more narrowly named underlying code, or are simply not yet open-sourced. No single company-published diagram ties hardware, firmware, the open SDK layer, and these two proprietary platform layers together, so the architecture in this chapter is necessarily assembled from separate disclosures.
  claimRefs:
