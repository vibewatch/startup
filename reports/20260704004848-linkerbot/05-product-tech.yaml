callouts:
- calloutType: strength
  title: Genuinely open developer tooling, not just marketing claims
  body: Linkerbot's GitHub organization hosts real, actively documented ROS, ROS2, Python, and C++ SDKs plus URDF models and a simulator — directly inspectable evidence of engineering investment beyond press releases, and broader open tooling than most reviewed China-based dexterous-hand rivals disclose.
  claimRefs:
  - CE001
  - CE002
  - CE011
  - CE028
- calloutType: risk
  title: Two of the most-marketed platform names have no visible open-source footprint
  body: '''Open TeleDex'' and ''LinkerSkillNet'' are prominent in company marketing but have no identifiable GitHub repository or technical documentation; either these are proprietary, closed layers, or the naming does not map cleanly onto public code, and this ambiguity is worth resolving before relying on the software layer as a defensible moat.'
  claimRefs:
  - CE009
  - CE010
- calloutType: risk
  title: No formal certification, IP, or reliability data disclosed
  body: No reviewed source shows Linkerbot holding a safety/quality certification, patent, or field reliability data for any product; this is a material gap for enterprise/industrial buyers evaluating production deployment risk.
  claimRefs:
  - CE017
  - CE019
  - CE024
- calloutType: assumption
  title: SKU list and SDK-supported model list do not fully match
  body: The official sitemap's 13+ SKUs and the ROS2 SDK's documented 8-model support list overlap only partially; treat unmatched models (e.g., L20G vs. G20 naming, or L30Z/D/J/R/W/YCB without confirmed SDK support) as unverified until reconciled directly with the company.
  claimRefs:
  - CE004
