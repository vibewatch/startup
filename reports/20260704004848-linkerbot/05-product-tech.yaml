- id: deployment-integration-roadmap
  title: Deployment, integration, reliability, and roadmap
  body: 'On deployment and integration, Linkerbot provides real, inspectable tooling: multiple SDK language/framework variants (Python, C++, ROS1, ROS2), a URDF model repository compatible with standard simulation and motion-planning tools, and a dedicated simulator, all supporting Ubuntu 22.04 and ROS Humble as of the report date. Disclosed named customers/users span industrial production (Samsung, Siemens per company statements) and research institutions (Stanford, MIT), indicating deployment beyond internal demos, though no reviewed source documents a specific production-line integration case study with measured before/after results, and no field reliability data (MTBF, defect rate, return rate) exists for any model in production use. No formal customer support SLA or warranty terms were found beyond a general FAQ page on the company''s JavaScript-rendered website. On roadmap, Linkerbot reveals milestones through trade-show events rather than a published release calendar: the CES 2026 debut introduced the full Linker Hand line plus the ''Linker Craftsman'' workstation spanning 11 to 42 DoF, but no forward-looking roadmap (named next-generation models, target dates) was found beyond that reveal.'
  claimRefs:
  - CE011
