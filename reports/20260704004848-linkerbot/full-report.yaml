  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product definition, workflow, and module map
        blocks:
          - type: paragraph
            body: >-
              In customer workflow terms, Linkerbot's product is a dexterous robotic-hand end-effector that an
              integrator mounts on a robot arm or humanoid platform and controls through a ROS or ROS2 driver stack and
              a Python/C++ SDK, rather than a complete robot the customer buys outright. The documented integration
              workflow — installing the SDK on Ubuntu 22.04 with ROS Humble and Python 3.10+, configuring hand
              parameters via a setting.yaml file, and then driving the hand through ROS topics or the LinkerHandApi
              Python class — is directly observable in Linkerbot's own GitHub-hosted SDK repositories. The company's
              official sitemap lists at least 13 distinct product pages (L6, L10, L20, L20G, L30, L30Z, O6, O7, D, J, R,
              W, YCB), but the ROS2 SDK's own README documents hardware support for a different, only partially
              overlapping model list (O6, L6, L7, O7, L10, L20, G20, L21) — a naming and coverage mismatch that is
              recorded here as an explicit inconsistency rather than assumed away. Flagship specifications disclosed in
              company materials include the L30's approximately ±0.2mm repeatability for precision-assembly work and the
              O6's 370g weight paired with a 50kg grip payload, attributed to PEEK engineering polymer and
              in-house-developed micro-reducers.
            claimRefs:
              - CE001
