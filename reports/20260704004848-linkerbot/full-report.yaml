chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, and business model
        blocks:
          - type: paragraph
            body: >-
              Linkerbot is a Beijing-based robotics-hardware company, headquartered in the Haidian District, that
              designs and mass-produces high-degree-of-freedom (DoF) dexterous robotic hands for humanoid robots,
              industrial automation, and research use. Public reporting places the company's founding in 2023, a
              timeline consistent with a May 2026 Reuters-sourced description of Linkerbot as a 'two-year-old unicorn.'
              The core product is the Linker Hand series, which spans roughly 6 to 42 degrees of freedom across
              direct-drive, linkage, and tendon-driven actuation architectures, supplemented by a 'Linker Craftsman'
              workstation shown at CES 2026. The company's own sitemap lists at least thirteen distinct product pages
              (models L6, L10, L20, L20G, L30, L30Z, O6, O7, D, J, R, W, and YCB), indicating a broad, tiered product
              line rather than a single flagship SKU. Linkerbot's business model is hardware-first: it manufactures and
              sells dexterous end effectors to humanoid-robot integrators, industrial buyers, and research institutions,
              and layers a software/data ecosystem (LinkerSkillNet, Open TeleDex) on top rather than building or selling
              complete robots itself. As of May 2026 the company's stage is best described as a large, private,
              venture-backed hardware unicorn that has just closed a 'Series B+' round; it is not publicly listed and
              has disclosed no IPO timetable.
