              monthly output from almost 5,000 units to a planned 10,000 units 'soon,' building on a disclosed
              cumulative milestone of more than 10,000 hands shipped by December 2025 and a highest single month above
              4,000 units. Disclosed named customers are limited to Samsung Electronics and Siemens for
              industrial/production use, plus research use described as including Stanford and MIT, though no source
              provided contract values, unit counts by customer, or renewal information. Revenue, ARR, gross margin, and
              headcount remain fully undisclosed in every source reviewed for this chapter, and Linkerbot's HKTDC
              international-sourcing storefront page returned a page-not-found result, a minor but concrete
              channel-visibility gap. Separately, China's National Development and Reform Commission publicly flagged in
              2026 that more than 150 humanoid-robot companies now operate in China and warned against excessive product
              duplication and speculative bubbles — a sector-level adverse signal relevant to how aggressively any
              single company's valuation trajectory should be read.
