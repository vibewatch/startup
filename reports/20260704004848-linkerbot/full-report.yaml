      - CU011
      - CU012
      - CU034
  - id: FU004
    title: Named-customer source-corroboration depth
    type: bar
    layout: standard
    summary: >-
      Samsung Electronics has the deepest independent source corroboration; the University of Hong Kong and
      MIT/Cambridge rest on a single source each.
    data:
      items:
        - label: Samsung Electronics
          value: 3
        - label: Siemens
