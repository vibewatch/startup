      - number: '2.3'
        title: Buyer, user, and payer segmentation and adoption path
        blocks:
          - type: paragraph
            body: >-
              Buyers of Linkerbot-style dexterous hands fall into at least three segments with different budget
              ownership. Industrial and electronics-manufacturing buyers — the segment that includes Linkerbot's own
              disclosed customers Samsung Electronics and Siemens — typically fund purchases from an automation/capex
              budget where the buyer, user, and payer are the same corporate function, and the adoption trigger is
              reliability and cost parity against an existing gripper or manual process. Humanoid-robot integrators such
              as Unitree represent a distinct 'buy vs. build' segment: they can either purchase hands from a supplier
              like Linkerbot or design their own, so the adoption trigger is a cost and time-to-market comparison rather
              than a simple procurement decision. Research institutions (Linkerbot states usage including Stanford and
              MIT) are funded through grants and lab budgets rather than enterprise procurement, so their adoption
              trigger is publication and demonstration value rather than commercial ROI, making them a low-revenue but
              high-visibility channel. A Morgan Stanley-referenced 2026 survey found that many Chinese enterprise buyers
              want humanoid/dexterous automation but do not yet consider available products reliable enough for full
              production deployment, suggesting the typical adoption funnel — awareness, pilot, certification,
              production integration, reorder — is still concentrated in its earlier stages across the sector, Linkerbot
              included, even though no source discloses Linkerbot-specific funnel conversion data.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
              - CM016
