      - number: '7.3'
        title: Operational, quality, and partner/dependency risk
        blocks:
          - type: paragraph
            body: >-
              On operational risk, the most material gap is between Linkerbot's disclosed production-scale ambitions —
              from roughly 5,000 to a targeted 10,000 units per month, and separately a reported 50,000-100,000-unit
              full-year 2026 delivery target — and a complete absence of disclosed manufacturing capacity, capex, or
              capital-expenditure plan to support that scale-up. No field reliability data (defect rate, MTBF), recall
              history, or cybersecurity practice is disclosed for any product, and the company's software stack carries
              a specific OS/framework dependency (Ubuntu 22.04, ROS Humble) that is an operational risk if that
              combination lags newer tooling. An industry tracker frames the category as moving toward commoditization
              as standalone-hand entrants (AgiBot, Zhaowei) compete on price, a margin-compression risk for Linkerbot's
              cost/scale-based moat, compounded by a credibility risk illustrated by a public Unitree-AgiBot dispute
              over shipment-leadership claims that applies equally to Linkerbot's own unaudited 80%+ share claim. On
              partner and dependency risk, Linkerbot's capital base is concentrated among a small number of large,
              partly state-linked institutional investors (Ant Group, HongShan Group, Zhongguancun Science Park Fund,
              Bank of China Asset Management, Fosun Capital), plus a single disclosed public-market strategic holder
              (Dongfang Precision, ~4.36%); any shift in investor sentiment among this small group could materially
              affect future financing. Customer concentration cannot be quantified because total customer count is
              undisclosed, though only a handful of named accounts have been publicly identified. Two international
              trade-directory listings (HKTDC, Hannover Messe) are currently not-found, a minor channel-dependency gap,
              and the broader semiconductor supply chain is exposed to escalating US export-control policy.
