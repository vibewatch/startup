      - CU011
      - CU012
      - CU013
      - CU015
  - id: FR001
    title: Risk heatmap
    type: matrix
    layout: wide
    summary: >-
      Manufacturing scale-up, key-person, and capital-provider concentration risks score highest on combined likelihood
      and severity.
    data:
      columns:
        - Likelihood
        - Severity
        - Mitigation maturity
      rows:
        - label: Manufacturing scale-up shortfall
          values:
            - Medium
            - High
            - Not disclosed
        - label: US federal procurement ban (GUARD Act)
          values:
            - Medium
            - High
            - Not disclosed
        - label: Key-person / succession risk
          values:
            - Low-medium
            - High
            - Not disclosed
        - label: Capital-provider concentration
          values:
            - Medium
            - High
            - Not disclosed
        - label: Certification / ISO compliance gap
          values:
            - Medium
            - Medium
            - Informal only
        - label: Commoditization / margin compression
          values:
            - Medium
            - Medium
            - Unaudited claim
    claimRefs:
      - CR016
      - CR001
      - CR025
      - CR020
      - CR009
      - CR019
  - id: FR002
    title: Risk transmission map
    type: dag
    layout: wide
    summary: >-
      Regulatory, operational, and people risks each have a distinct transmission path into revenue, financing, and
      valuation.
    data:
      nodes:
        - id: reg
          label: US procurement bans / export controls
        - id: ops
          label: Manufacturing scale-up shortfall
        - id: people
          label: Key-person / governance gap
        - id: revenue
          label: Revenue / customer demand
        - id: financing
          label: Financing (next-round valuation)
        - id: valuation
          label: Overall company valuation
      edges:
        - from: reg
          to: revenue
          label: reduces addressable US-linked demand
        - from: ops
          to: revenue
          label: limits ability to fulfill orders at scale
        - from: people
          to: financing
          label: raises investor risk perception
        - from: revenue
          to: financing
          label: weaker traction reduces next-round leverage
        - from: financing
          to: valuation
          label: down-round or delayed round pressures valuation
    claimRefs:
      - CR001
      - CR016
      - CR025
      - CR030
  - id: FR003
    title: Dependency map
    type: dag
    layout: wide
    summary: >-
      Linkerbot depends on a concentrated set of capital providers, an undisclosed component supply chain, and a small
      number of publicly named customers.
    data:
      nodes:
        - id: capital
          label: Institutional investors (Ant Group, HongShan, ZGC Fund, BOC AM, Fosun)
        - id: listed-partner
          label: Dongfang Precision (~4.36% equity holder)
        - id: suppliers
          label: Component suppliers (motors, sensors, compute — undisclosed)
        - id: export-policy
          label: US export-control policy
        - id: customers
          label: Named customers (Samsung, Siemens, Stanford, MIT, Cambridge, HKU)
        - id: company
          label: Linkerbot
      edges:
        - from: capital
          to: company
          label: financing
        - from: listed-partner
          to: company
          label: equity stake
        - from: suppliers
          to: company
          label: component supply
        - from: export-policy
          to: suppliers
          label: constrains advanced-component access
        - from: company
          to: customers
          label: hardware sales
    approximationNotes: Supplier identities are categorical, not named, since no reviewed source discloses specific component suppliers.
    claimRefs:
      - CR020
      - CR021
      - CR024
      - CR013
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      Strong growth/scale evidence is offset by weak financial and audit evidence, yielding a research-more
      recommendation rather than a buy or avoid call.
    data:
      nodes:
        - id: scale
          label: Corroborated scale (shipments, production targets, investors)
        - id: gap
          label: Evidence gaps (financials, market-share audit, funding reconciliation)
        - id: risk
          label: Documented risks (regulatory, key-person, overcapacity)
        - id: verdict
          label: 'Recommendation: research-more, medium confidence, high risk, stretched valuation'
      edges:
        - from: scale
          to: verdict
          label: supports continued attention
        - from: gap
          to: verdict
          label: prevents a buy call
        - from: risk
          to: verdict
          label: prevents a high-confidence call
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
  - id: FV002
    title: 'Valuation sensitivity: comparable set'
    type: bar
    layout: wide
    summary: >-
      Linkerbot's disclosed valuation sits well above its closest direct product-category comparable (AgiBot) but below
      the largest Western full-stack humanoid makers.
    data:
      items:
        - label: AgiBot (direct hand-product comparable)
          value: 1
          unit: $B
        - label: Linkerbot (current, Series B+)
          value: 3
          unit: $B
        - label: Linkerbot (next-round target)
          value: 6
          unit: $B
        - label: X Square Robot
          value: 2.8
          unit: $B
        - label: Unitree
          value: 1.6
          unit: $B
        - label: Apptronik
          value: 5
          unit: $B
        - label: Figure AI
          value: 39
          unit: $B
    approximationNotes: >-
      Values are each company's most recently disclosed round/filing valuation as reported in reviewed sources, not
      adjusted to a common date or normalized by revenue.
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV018
      - CV041
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Linkerbot's next-round outcome could plausibly range from a down round to meeting its disclosed $6B target, with
      no source providing a base-case consensus figure.
    data:
      items:
        - label: 'Bear: down round / delayed raise'
          low: 1.5
          base: 2
          high: 2.5
          unit: $B
        - label: 'Base: moderate step-up below target'
          low: 3
          base: 4
          high: 5
          unit: $B
        - label: 'Bull: meets or exceeds disclosed target'
          low: 6
          base: 6.5
          high: 8
          unit: $B
    approximationNotes: >-
      Ranges are illustrative, anchored to the disclosed $3B current and $6B target valuations and the qualitative
      bull/base/bear scenario logic in this chapter; they are not derived from a disclosed company financial model.
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV006
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      IC-ready scoring shows strong market/scale signals offset by weak evidence-quality and financial-transparency
      scores.
    data:
      items:
        - label: Market growth signal
          value: Strong
          note: Fast-growing, cost-collapsing category per multiple analyst sources
        - label: Competitive moat evidence
          value: Moderate
          note: Scale/cost-based, unaudited share claim, credible commoditization threat
        - label: Financial transparency
          value: Weak
          note: No revenue, margin, cash, or headcount disclosed
        - label: Risk rating
          value: High
          note: Regulatory, key-person, and overcapacity risks all documented
        - label: Valuation stance
          value: Stretched
          note: Disclosed price not independently underwritten by audited evidence
    claimRefs:
      - CV004
      - CV028
      - CV040
