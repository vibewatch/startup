        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              The public leadership picture for Linkerbot is thin and, in one respect, unresolved. May 2026
              Reuters-sourced wire coverage (redistributed by BusinessWorld, the Straits Times, Yahoo Finance, and The
              Standard) names 'CEO Alex Zhou' as the executive who discusses production scale-up and the company's next
              fundraising target. Earlier, Chinese-language coverage from China Biz Insider dated November 2025 instead
              names 'Founder and CTO Zhou Yong' as the person quoted on order volume during the Series A+ financing era.
              No source reviewed for this chapter explicitly states whether Alex Zhou and Zhou Yong are the same
              individual under different English/Chinese name renderings, or whether a real title change from CTO to CEO
              occurred between the two reporting windows; this is recorded as an open, unresolved question rather than
              assumed either way. Beyond this single named executive (or pair of possibly-identical executives), no
              reviewed source discloses an independent board, outside directors, a founder equity split, or a succession
              plan. Because every piece of reviewed coverage — product strategy, fundraising commentary, and
              manufacturing scale-up plans — routes through one named spokesperson, key-person dependence risk is
              material for a company operating at a multi-billion-dollar valuation.
