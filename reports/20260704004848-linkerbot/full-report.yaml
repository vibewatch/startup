      - number: '1.4'
        title: 'Cover metrics: scale, market share, customers, and disclosure gaps'
        blocks:
          - type: paragraph
            body: >-
              Linkerbot's most heavily cited cover metric is its claimed global market share in high-degree-of-freedom
              robotic hands: the company states it holds over 80% share and is the only manufacturer mass-producing more
              than 1,000 high-DoF hands per month, a claim repeated in both company press releases and Reuters-sourced
              coverage. An independent industry tracker (TechBuzz China) and a Chinese-language market analysis
              (Gongboshi Robot) both describe Linkerbot as the category leader with 80%+ share as of early-to-mid 2026,
