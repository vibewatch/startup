            body: >-
              No reviewed source discloses any exit event specific to Linkerbot; the closest evidence of exit readiness
              in the sector is comparable peer Unitree's own STAR Market IPO filing, which demonstrates a viable exit
              path exists generally, and given Linkerbot's disclosed scale and institutional-investor base, an eventual
              IPO — plausibly on a Chinese exchange — is a plausible but currently unconfirmed path; no source discloses
              lock-up terms or any secondary-sale mechanism for existing shareholders. Adverse signals relevant to
              valuation risk include China's NDRC 2026 warning about sector-wide overcapacity, the public Unitree-AgiBot
              dispute over shipment-leadership claims (a direct analogue to Linkerbot's own unaudited 80%+ share claim),
              and US legislative moves (the GUARD Act, American Security Robotics Act) that could constrain Linkerbot's
              addressable Western market. Four concrete, monitorable thesis-break triggers follow directly from the
              Risks chapter: an independent audit materially contradicting the market-share claim; a down round, delayed
              fundraising, or missed production target; enacted US legislation explicitly covering embedded components;
              and departure of the company's sole named executive without a disclosed successor. The single
              highest-value final diligence ask is an independent audit of Linkerbot's claimed market share and shipment
              volumes, since nearly every other valuation input is downstream of that claim's credibility; close behind
              are basic financial-statement access, reconciliation of the two 2026 funding events, and
