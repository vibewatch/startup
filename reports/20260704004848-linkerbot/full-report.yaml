      - number: '2.2'
        title: TAM/SAM/SOM sizing across multiple, disagreeing lenses
        blocks:
          - type: paragraph
            body: >-
              No single trusted TAM number exists for this market. Whole-humanoid-robot market-size estimates for 2026
              range from about $4.2 billion (Grand View Research) and $5.41 billion (MarketsandMarkets) to $10.69
              billion (Future Market Insights) and $10.9 billion (Global Market Insights) — a spread of more than 2x for
              the same year, with none of the reviewed publisher pages fully disclosing their underlying methodology in
              the excerpts retrieved. Goldman Sachs Research instead frames the opportunity as a long-horizon scenario
              range: a base case near $38 billion by 2035, with a 'blue sky' scenario reaching $154 billion if
              reliability and cost barriers fall faster than expected. None of these whole-market figures isolate the
              dexterous-hand sub-segment Linkerbot actually sells into. The closest available proxy is a China Biz
              Insider estimate that the China-only dexterous-hand market alone will exceed $3.7 billion by 2031,
              alongside an industry tracker's observation that Chinese suppliers already provide 70-80% of global
              commercial high-DoF robot hands at unit prices that have fallen from over $100,000 to below $2,000. Even
              that narrower figure is a single-article citation rather than an audited market study, and no reviewed
              source provides a serviceable-obtainable-market (SOM) figure specific to Linkerbot; the company's own 80%+
              share claim is applied against a category boundary ('global high-DoF dexterous hand market') that it
              defines itself rather than against any named third-party sizing study.
