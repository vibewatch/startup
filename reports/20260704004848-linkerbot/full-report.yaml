              The GUARD Act and American Security Robotics Act would ban US federal procurement of Chinese-made
              robots/components in the same year China's 15th Five-Year Plan elevates robotics as a strategic priority —
              a bifurcating policy environment that could concentrate Linkerbot's addressable demand even more heavily
              inside China.
            calloutType: risk
            claimRefs:
