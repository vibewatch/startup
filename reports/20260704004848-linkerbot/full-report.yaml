      - number: '4.5'
        title: 'Financial verdict: revenue quality, margin path, and diligence blockers'
        blocks:
          - type: paragraph
            body: >-
              Taken together, the public record on Linkerbot combines strong, multiply-corroborated evidence of
              unit-shipment traction and financing-round activity with a near-total absence of revenue, margin,
              cost-structure, and balance-sheet disclosure — a pattern typical of a fast-scaling private hardware
              company but a material blocker to any independent financial valuation. Revenue quality cannot be assessed
              because no source breaks out revenue by stream, segment, or geography. The margin path is unclear because
              gross margin, BOM cost, and warranty/defect costs are all undisclosed, and the co-founder's stated
              multi-year path toward sub-$70 unit pricing could reflect either a credible manufacturing cost curve or a
              deliberately loss-leading growth strategy funded by continued equity financing — the public record cannot
              distinguish between the two. Capital intensity is high, illustrated by comparable peer
              manufacturing-scale-up coverage, and Linkerbot's own financing dependency (three or more equity rounds in
              under 18 months) is likely to persist until, or unless, hardware margins and/or an undisclosed
              software/data revenue layer mature enough to fund growth internally. The most concrete near-term diligence
              blockers are the absence of any audited financial statement (a bar that comparable peer Unitree has
              already cleared via its own IPO prospectus), the unreconciled gap between the February 2026 Series B round
              size and the May 2026 Series B+ valuation, and the complete absence of headcount, cash position, or
              burn-rate disclosure.
            claimRefs:
              - CI029
              - CI032
              - CI033
              - CI034
              - CI035
