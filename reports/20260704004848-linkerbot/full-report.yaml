  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: peers, incumbents, adjacents, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Linkerbot's competitive set spans three distinct categories. The first is direct dexterous-hand
              specialists that, like Linkerbot, sell hands as a standalone product: Inspire Robots (因时机器人), Shadow Robot
              (UK), and Zhaowei Mechatronics, a components manufacturer that has entered the category. The second, and
              arguably the more strategically important category, is full-stack humanoid-robot makers that design and
              manufacture their own hands rather than buying from an independent supplier — Unitree, AgiBot, Fourier
              Intelligence, UBTech, and Tesla all fall here, and each represents both a potential customer (if they ever
              chose to buy rather than build) and a permanent competitive threat (since they could sell excess hand
              capacity or spin out a hand business, as AgiBot has begun to do). The third category is non-China
              humanoid-robot makers — Figure AI, Apptronik, and 1X Technologies — that build their own hands in-house
              for now but represent the segment most exposed to future US policy actions that could reshape global
              sourcing patterns. Beyond dedicated dexterous hands, the status-quo substitute for any buyer that does not
              need full human-like dexterity is a simple parallel-jaw gripper (as sold by incumbents like RightHand
              Robotics), or simply continuing to rely on human manual labor. Lower-cost, lab-oriented adjacent products
              — Wonik Robotics' Allegro Hand and the open-source LEAP Hand — serve research buyers rather than
              industrial ones and are unlikely to directly displace Linkerbot's industrial customer base.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
