            body: >-
              Linkerbot's only clearly disclosed revenue stream is hardware sales of its Linker Hand product family, a
              line spanning at least 13 SKUs from 6 to 42 degrees of freedom, sold directly to industrial buyers,
              humanoid-robot integrators, and research institutions. The company also markets a software/platform layer
              — the LinkerSkillNet manipulation-skill ecosystem and the Open TeleDex teleoperation system — but no
              reviewed source discloses whether these generate separate license, subscription, or data-access revenue
              distinct from hardware sales; this is recorded as an open question rather than assumed to be either a real
              revenue line or pure marketing. On pricing, an independent industry tracker attributes a list price of
              approximately ¥6,666 (about $920) to the O6 entry-tier model, the only specific unit price found anywhere
              in reviewed sources, and quotes a company co-founder predicting prices could fall below ¥500 (about $70)
              within three years — an aggressive forward cost target rather than a stated current price. No source
              discloses pricing for the higher-DoF flagship models (L20, L20G, L30, L30Z, O7, and others), so a full
              pricing ladder across the product line cannot currently be constructed, and with no revenue-mix
              disclosure, revenue-recognition treatment cannot be assessed.
