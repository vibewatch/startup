        - label: Simulation / URDF (linker-sim)
          detail: Open-source simulation and motion-planning support
          maturity: Actively maintained, open-source
        - label: Open TeleDex teleoperation layer
          detail: Proprietary; limited public technical documentation
          maturity: Marketed, limited technical visibility
        - label: LinkerSkillNet manipulation-skill software
          detail: Proprietary higher-level skill library/dataset layer
          maturity: Marketed, limited technical visibility
    approximationNotes: >-
      Layer boundaries are inferred from separate disclosures (GitHub repos, press releases, product pages); no single
      company-published architecture diagram exists.
    claimRefs:
      - CE007
      - CE009
      - CE011
      - CE027
      - CE028
  - id: FE002
    title: Customer workflow / integration flow
    type: flow
    layout: standard
    summary: >-
      A typical integrator moves from hardware procurement through SDK integration to production deployment, with
      support/reliability visibility dropping off after initial integration.
    data:
      nodes:
        - id: procure
          label: Procure hand (O6/L-series/O-series)
        - id: mount
          label: Mount on robot arm / humanoid platform
        - id: sdk
          label: Install ROS/ROS2 SDK, configure setting.yaml
        - id: sim
          label: Validate in simulation (URDF + linker-sim)
        - id: deploy
          label: Deploy to production / research use
        - id: support
          label: Ongoing support (undocumented SLA)
      edges:
        - from: procure
          to: mount
          label: physical integration
        - from: mount
          to: sdk
          label: software integration
        - from: sdk
          to: sim
          label: pre-deployment validation
        - from: sim
          to: deploy
          label: go-live
        - from: deploy
          to: support
          label: post-deployment (undisclosed terms)
    claimRefs:
      - CE001
      - CE002
      - CE011
      - CE013
      - CE023
  - id: FE003
    title: Critical dependency map
    type: dag
    layout: wide
    summary: >-
      Linkerbot's stack depends on an OS/ROS-version combination, undisclosed component suppliers, and its own
      proprietary teleoperation/skill layers.
    data:
      nodes:
        - id: os
          label: Ubuntu 22.04 / ROS Humble / Python 3.10+
        - id: components
          label: Motors, gearboxes, tactile sensors, PEEK polymer (suppliers undisclosed)
        - id: github
          label: GitHub (linker-bot org) — SDK distribution
        - id: teledex
          label: Open TeleDex (proprietary teleoperation)
        - id: skillnet
          label: LinkerSkillNet (proprietary skill data/software)
        - id: product
          label: Shipped Linker Hand products
      edges:
        - from: components
          to: product
          label: manufacturing input
        - from: os
          to: product
          label: required integration environment
        - from: github
          to: product
          label: SDK distribution channel
        - from: product
          to: teledex
          label: hardware feeds teleoperation data
        - from: teledex
          to: skillnet
          label: data feeds skill library
    approximationNotes: >-
      Component-supplier identities are not disclosed in any reviewed source; nodes represent categories, not named
      third parties.
    claimRefs:
      - CE011
      - CE012
      - CE018
      - CE028
  - id: FE004
    title: Product maturity / capability map
    type: matrix
    layout: wide
    summary: >-
      Hardware and open-source developer tooling are the most mature, disclosed layers; certification, IP, and
      reliability data are the least mature/disclosed.
    data:
      columns:
        - Disclosed maturity
        - Independent verification
      rows:
        - label: Hardware (13+ SKUs, shipping)
          values:
            - High (company + press corroborated)
            - Partial (industry trackers corroborate market position, not lab test data)
        - label: ROS/ROS2 SDK + simulation tooling
          values:
            - High (actively documented on GitHub)
            - High (directly observable open-source repositories)
        - label: Teleoperation / skill software (Open TeleDex, LinkerSkillNet)
          values:
            - Medium (marketed, named)
            - Low (no named repository or technical spec found)
        - label: Certifications, IP, manufacturing QA
          values:
            - Low (not disclosed)
            - None found
    claimRefs:
      - CE016
      - CE017
      - CE019
      - CE035
  - id: FU001
    title: Customer journey map
    type: journey-map
    layout: wide
    summary: >-
      Industrial and research segments follow different adoption surfaces, converging on direct-sales/press-driven
      discovery rather than a channel-partner path.
    data:
      nodes:
        - id: awareness
          label: Awareness (CES 2026, press coverage, trade-show recognition)
        - id: evaluation
          label: Evaluation (SDK trial, simulation via URDF/linker-sim)
        - id: purchase
          label: Purchase (direct from Linkerbot)
        - id: deploy-industrial
          label: Production deployment (industrial line, e.g. Samsung, Siemens)
        - id: deploy-research
          label: Lab/demo deployment (research, e.g. Stanford, MIT, Cambridge, HKU)
        - id: expansion
          label: Expansion (undocumented repeat orders)
    claimRefs:
      - CU001
      - CU002
      - CU021
      - CU026
  - id: FU002
    title: Adoption / deployment funnel
    type: funnel
    layout: standard
    summary: >-
      Disclosed evidence concentrates at the awareness/shipment stage; expansion and retention stages have no disclosed
      data.
    data:
      items:
        - label: Awareness (press/trade-show reach)
          value: 100
        - label: Named customer relationship (Samsung, Siemens, Stanford, MIT, Cambridge, HKU)
          value: 45
        - label: Confirmed production vs. pilot status
          value: 10
        - label: Documented repeat/expansion order
          value: 5
    approximationNotes: >-
      Funnel values are illustrative proportions reflecting the relative depth of disclosed evidence at each stage, not
      measured conversion rates.
    claimRefs:
      - CU009
      - CU014
      - CU018
      - CU028
  - id: FU003
    title: Customer proof matrix
    type: matrix
    layout: wide
    summary: >-
      Evidence quality is strongest for logo identification and weakest for outcome specificity and production-status
      confirmation across all named customers.
    data:
      columns:
        - Logo identified
        - Multi-source corroborated
        - Production vs. pilot confirmed
        - Outcome quantified
      rows:
        - label: Samsung Electronics
          values:
