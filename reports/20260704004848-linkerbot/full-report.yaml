      - number: '8.3'
        title: Bull/base/bear scenarios and the comparable set
        blocks:
          - type: paragraph
            body: >-
              In a bull case, Linkerbot sustains its 80%+ share claim, hits its 50,000-100,000-unit 2026 delivery
              target, and raises its next round at or above the disclosed $6 billion target, aided by continued Chinese
              industrial-policy tailwinds. In a base case, growth continues but more moderately than stated, the next
              round closes below $6 billion, and price competition from AgiBot, Zhaowei, and other standalone-hand
              entrants intensifies. In a bear case, an independent audit or competitor dispute undermines the share
              claim, NDRC warnings translate into concrete policy tightening, and manufacturing scale-up falls short,
              forcing a down round or delayed fundraising; no source provides an explicit probability weighting across
              these scenarios, so this framing is qualitative and evidence-anchored rather than modeled. Against a
              comparable set spanning Unitree (~$1.6B, now IPO-filed with full prospectus-level disclosure), AgiBot
              (reportedly >RMB 7B, roughly $1B, the closest direct product-category comparable), Figure AI ($39B, the
              upper-bound Western comparable), Apptronik ($5B), and X Square Robot (>$2.8B), Linkerbot's disclosed ~$3
              billion valuation sits well above its closest direct hand-product comparable but below the largest
              full-stack Western humanoid makers — suggesting the market is pricing Linkerbot closer to a broad
              humanoid-robotics platform than to a narrower hand-component supplier. No source discloses a revenue or
              EBITDA multiple for Linkerbot or any comparable, so this benchmarking rests on absolute round valuations
              rather than a standardized multiple, and whole-market analyst estimates (MarketsandMarkets, Goldman Sachs
              Research) provide macro tailwind context without directly pricing Linkerbot itself.
