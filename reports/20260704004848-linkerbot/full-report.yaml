  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The market Linkerbot actually competes in is narrower than 'humanoid robots' as a whole: it is the
              sub-segment of the embodied-AI hardware stack devoted to dexterous end-effectors — robotic hands and
              grippers with human-like degrees of freedom — plus an adjacent manipulation-software layer
              (LinkerSkillNet, Open TeleDex). Excluded from that addressable spend is the much larger bill of materials
              for a complete humanoid robot: chassis, locomotion, batteries, and general-purpose AI compute, all of
              which are supplied by other vendors or built in-house by robot integrators. Adjacent markets include full
              humanoid-robot makers such as Unitree and Tesla's Optimus program that currently build their own hands
              rather than buying from a supplier, and industrial-automation gripper incumbents that could add degrees of
              freedom over time and encroach on the low end of Linkerbot's category. The most direct status-quo
              substitute for a buyer that does not need full human-like dexterity is a simple 2-3 finger parallel-jaw
              gripper (as sold by incumbents like RightHand Robotics), or simply continuing to use human manual labor
              for fine-manipulation tasks that are not yet cost-effective to automate. Framing the market this way
              matters because whole-humanoid-robot TAM figures, however large, systematically overstate what Linkerbot
              itself can capture.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
