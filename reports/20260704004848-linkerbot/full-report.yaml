              — within a single product family, which an independent industry tracker highlights as unusually broad
              technology-route coverage compared to most single-architecture rivals. The industrial-tier L20 is
              described in company materials as using a proprietary 'Super Electric Cylinder' delivering 90% drive
              efficiency, 200N screw-end thrust, and a tested lifespan exceeding one million cycles, while a multi-modal
