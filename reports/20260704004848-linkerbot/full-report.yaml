  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The investment thesis for Linkerbot rests on disclosed 80%+ share in a fast-growing, cost-collapsing
              high-degree-of-freedom dexterous-hand category, corroborated unit-shipment growth (10,000+ cumulative
              units by December 2025, targeting 10,000 units per month and separately a reported 50,000-100,000-unit
              full-year 2026 delivery goal), and backing from major institutional investors — Ant Group, HongShan Group,
              Zhongguancun Science Park Fund, Bank of China Asset Management, and Fosun Capital — at a disclosed ~$3
              billion valuation. A March 2026 technology-competition win and Beijing municipal-government recognition
              add qualitative credibility beyond the company's own statements. The anti-thesis is equally concrete: the
              market-share and shipment claims are self-defined and unaudited, and a public dispute between Unitree and
              AgiBot over shipment leadership shows this is a live, sector-wide credibility issue rather than a
              hypothetical concern; no revenue, gross margin, cash position, or headcount has been disclosed; the named
              customer base rests on a handful of logo-level accounts with no production-vs-pilot confirmation or
              outcome data; and China's own National Development and Reform Commission has publicly warned of
              overcapacity and speculative-bubble risk among more than 150 domestic humanoid-robot companies. On
              balance, the evidence base currently supports a growth narrative more than a due-diligence-grade financial
              or commercial case.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV037
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV037
      - number: '8.2'
        title: Recommendation, confidence, and current financing context
        blocks:
          - type: paragraph
            body: >-
              Given the strength of the growth narrative but the near-total absence of audited financial or
              independently verified evidence, a 'research-more' recommendation with medium confidence, a high risk
              rating, and a 'stretched' valuation stance is more defensible than an outright buy or avoid call; no
              source supports a specific target return, hold period, or exit multiple, since no entry price, share
              class, or liquidation-preference terms are disclosed for any specific investor. On current financing
              context, Linkerbot closed a 'Series B+' round around late April/early May 2026 at approximately a $3
              billion valuation and disclosed a roughly $6 billion target for its next round, without disclosing timing
              or instrument. A February 2026 Series B round of roughly RMB 1.5 billion (about $210 million) is not
              reconciled in any reviewed source with that $3 billion figure reached about three months later, making
              entry-price discipline difficult to assess independently for that window. The most concrete
              quasi-independent evidence bearing on the actual cap table is listed company Dongfang Precision's
              disclosed ~4.36% direct equity stake, confirmed through its own investor-relations disclosure — a
              genuinely useful anchor, but one data point far short of full cap-table visibility. Overall, public
              evidence is directionally consistent with continued investor demand but does not independently confirm
              that the disclosed $3 billion or targeted $6 billion figures represent fair value rather than
              momentum-driven pricing.
            claimRefs:
              - CV004
              - CV005
              - CV006
