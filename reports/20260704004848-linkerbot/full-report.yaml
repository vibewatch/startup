        title: Exhibits
        blocks:
          - type: callout
            title: Research-more, not buy or avoid
            body: >-
              The evidence base supports continued monitoring and a formal diligence process rather than a buy call
              (audited financials and an independent market-share audit are missing) or an avoid call (the growth
              narrative and investor roster are genuinely strong).
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV040
          - type: callout
            title: Two funding events three months apart remain unreconciled
            body: >-
              A ~RMB 1.5B Series B round (Feb 2026) and a ~$3B 'Series B+' valuation (May 2026) are each individually
              well-corroborated, but no source explains how much new capital the second event represents versus a
              valuation re-rating — a material gap for entry-price discipline.
            calloutType: risk
            claimRefs:
              - CV007
          - type: callout
            title: Linkerbot is priced between its closest comparable and the largest platforms
            body: >-
              At ~$3B, Linkerbot sits well above AgiBot (its closest direct hand-product comparable, ~$1B) but below
              Figure AI ($39B) and Apptronik ($5B), suggesting investors are pricing it more like a platform company
              than a narrow component supplier.
            calloutType: insight
            claimRefs:
              - CV019
          - type: callout
            title: Scenario probabilities are qualitative, not modeled
            body: >-
              No source provides a probability-weighted scenario model for Linkerbot; the bull/base/bear framing here
              reflects consistency with already-documented evidence, not a quantified forecast.
            calloutType: assumption
            claimRefs:
              - CV014
              - CV039
