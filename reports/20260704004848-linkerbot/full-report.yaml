      - number: '1.3'
        title: Funding history, valuation, and investors
        blocks:
          - type: paragraph
            body: >-
              Linkerbot's disclosed financing history spans at least two distinct eras. In the Series A+ era, China Biz
              Insider reported in November 2025 that the company had just closed its fourth capital injection in eight
              months, with investors including Zhejiang Innovation Investment, CDH Investments' Baifu fund, Leju
              Robotics, and listed strategic investors Dongfang Precision and Aux, alongside earlier backers Ant Group
              and Sequoia China Seed Fund; round size was not disclosed. By late April/early May 2026, Linkerbot
              announced a 'Series B+' round that valued the company at approximately US$3 billion, with participation
              from Ant Group, Sequoia spin-off HongShan Group, the state-backed Zhongguancun Science Park Fund, Bank of
              China Asset Management, and Fosun Capital. In the same announcement, the company said it would seek a
              roughly US$6 billion valuation — double the Series B+ level — in its next financing round, without
              disclosing timing or whether that round would be a private financing or a public listing. No reviewed
              source discloses Linkerbot's total lifetime capital raised as of the report date; the only cumulative
              figure available is $150 million raised since April 2025, disclosed in a December 2025 press release
              alongside a shipment milestone, which necessarily predates and understates the capital implied by the $3
              billion Series B+ valuation. No secondary sales or debt/credit facilities were disclosed in any reviewed
              source. It is also worth noting that the $3B/$6B valuation figures are corroborated across BusinessWorld,
              the Straits Times, Yahoo Finance, and The Standard, but all four appear to trace to the same underlying
              Reuters wire story plus the company's own statement, so the corroboration is broad in distribution but
              narrow in original reporting chains.
