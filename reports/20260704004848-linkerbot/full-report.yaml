              GitHub repository or technical documentation was found by name for 'Open TeleDex' or 'LinkerSkillNet,' the
              two higher-level platform names the company markets most prominently; the closest matching repository is a
              general teleoperation-arm utility, suggesting these product names may sit over more narrowly named
              underlying code, or are simply not yet open-sourced. No single company-published diagram ties hardware,
              firmware, the open SDK layer, and these two proprietary platform layers together, so the architecture in
