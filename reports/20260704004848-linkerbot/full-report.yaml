      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - 80%+ share sustained; 50,000-100,000-unit 2026 target hit; next round closes at or above $6B
        - Valuation continues to re-rate toward or above the disclosed $6B target
        - Requires market-share claim to hold up under scrutiny and continued capital availability
        - Consistent with company statements and current fundraising cadence, but unaudited
      - - Base
        - Moderate growth continues; next round closes below the $6B target; competitive pricing pressure intensifies
        - Valuation grows but at a discount to the company's own stated target
        - Standalone-hand entrants (AgiBot, Zhaowei) compress pricing power
        - Consistent with observed commoditization trend in the competitive set
      - - Bear
        - >-
          Independent audit or competitor dispute undermines the share claim; NDRC policy tightens; manufacturing
          scale-up falls short
        - Down round or materially delayed fundraising versus the $6B target
        - >-
          Regulatory (US procurement bans), credibility (share-claim disputes), and execution (production shortfall)
          risks compound
        - Consistent with adverse signals already documented (NDRC warning, Unitree-AgiBot dispute, GUARD Act)
