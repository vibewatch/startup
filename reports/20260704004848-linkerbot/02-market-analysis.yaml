  claims:
  - id: CM001
    statement: The addressable market Linkerbot sells into is best defined as the sub-segment of the humanoid-robotics/embodied-AI hardware stack devoted to dexterous end-effectors (robotic hands and grippers), not the full humanoid-robot market.
    type: inferred
    topic: market-boundary
    sourceRefs:
    - SM006
    - SM007
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM001
  - id: CM002
    statement: Excluded from Linkerbot's addressable spend is the far larger bill-of-materials for full humanoid robots (actuators, batteries, locomotion, sensors, AI compute) and adjacent industrial-gripper spend that does not require high-DoF human-like dexterity.
    type: inferred
    topic: market-boundary
    sourceRefs:
    - SM001
    - SM006
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM002
  - id: CM003
    statement: Status-quo substitutes for a Linkerbot-style high-DoF dexterous hand include simple 2-3 finger parallel-jaw grippers (e.g., RightHand Robotics) and continued reliance on human manual labor for fine-manipulation tasks.
    type: third-party-reported
    topic: substitutes
    sourceRefs:
    - SM022
    - SM023
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM003
  - id: CM004
    statement: Adjacent markets to Linkerbot's core dexterous-hand product include full humanoid-robot makers that build hands in-house (Unitree, Tesla Optimus) and industrial-automation gripper incumbents that could add DoF over time.
    type: inferred
    topic: adjacency
    sourceRefs:
    - SM024
    - SM006
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM004
  - id: CM005
    statement: MarketsandMarkets estimates the global humanoid robot market at USD 5.41 billion in 2026, growing to USD 50.27 billion by 2035 (CAGR 28.1%).
    type: third-party-reported
    topic: tam
    sourceRefs:
    - SM001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM005
  - id: CM006
    statement: Global Market Insights and Future Market Insights both estimate the 2026 global humanoid robot market above USD 10 billion, roughly double MarketsandMarkets' and Grand View Research's estimates for the same year.
    type: third-party-reported
    topic: tam
    sourceRefs:
    - SM002
    - SM003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM006
  - id: CM007
    statement: 'Goldman Sachs Research frames a wide humanoid-robot TAM range: a base case near $38 billion by 2035 and a ''blue sky'' scenario as high as $154 billion if cost and reliability barriers fall faster than expected.'
    type: third-party-reported
    topic: tam
    sourceRefs:
    - SM005
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM007
  - id: CM008
    statement: China Biz Insider reports the narrower China dexterous-hand market alone is projected to exceed $3.7 billion by 2031, a figure closer to a usable SAM proxy for Linkerbot than any whole-humanoid-robot TAM estimate.
    type: third-party-reported
    topic: sam
    sourceRefs:
    - SM006
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM008
  - id: CM009
    statement: An industry tracker reports Chinese suppliers provide 70-80% of global commercial high-DoF robot hands, and that domestic per-unit pricing has fallen from over $100,000 to below $2,000 in the fastest-moving segment.
    type: third-party-reported
    topic: sam
    sourceRefs:
    - SM007
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM009
  - id: CM010
    statement: No reviewed source isolates a SOM (serviceable obtainable market) figure specific to Linkerbot; Linkerbot's own 80%+ share claim is applied against an unspecified 'high-DoF dexterous hand' denominator rather than a named third-party sizing study.
    type: open-question
    topic: som
    sourceRefs:
    - SM018
    - SM006
    confidence: low
    freshness: current
    answersQuestionRefs:
    - QM010
  - id: CM011
    statement: Reviewed market-sizing estimates for the 2026 whole-humanoid-robot TAM disagree by more than 2x across publishers (roughly $4.2B-$10.9B depending on source), indicating real methodological disagreement rather than a single consensus number.
    type: inferred
    topic: tam
    sourceRefs:
    - SM001
    - SM002
    - SM003
    - SM004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM011
  - id: CM012
    statement: 'Buyers of Linkerbot''s dexterous hands span at least three segments: humanoid-robot integrators building their own full robots, industrial-automation end users, and research institutions.'
    type: inferred
    topic: segmentation
    sourceRefs:
    - SM019
    - SM024
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM012
  - id: CM013
    statement: Linkerbot's own disclosed named customers (Samsung Electronics, Siemens) sit in the industrial-automation/electronics-manufacturing segment, where the buyer, user, and payer are typically the same corporate procurement function.
    type: company-claimed
    topic: segmentation
    sourceRefs:
    - SM019
    confidence: medium
    freshness: recent
    answersQuestionRefs:
    - QM013
  - id: CM014
    statement: Research-institution buyers (described by Linkerbot as including Stanford and MIT) typically have grant-funded, lab-level budget ownership rather than enterprise procurement budgets, implying smaller per-account revenue but reputational/pipeline value.
    type: inferred
    topic: segmentation
    sourceRefs:
    - SM019
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM014
  - id: CM015
    statement: Humanoid-robot integrators (Unitree, Tesla, and others) that build their own hands in-house represent a segment where Linkerbot must sell a 'buy vs. build' value proposition rather than a straightforward component sale.
    type: inferred
    topic: segmentation
    sourceRefs:
    - SM024
    - SM007
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM015
  - id: CM016
    statement: A Morgan Stanley-referenced survey reported in 2026 that many Chinese enterprise buyers want humanoid-robot/dexterous automation but consider current products not yet reliable enough for production deployment, indicating a still-developing adoption trigger for enterprise buyers.
    type: third-party-reported
    topic: adoption-path
    sourceRefs:
    - SM025
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM016
  - id: CM017
    statement: China's 15th Five-Year Plan (2026-2030) elevates AI-powered robotics, including embodied AI and humanoid robots, to a core national industrial-strategy priority, a growth driver for domestic dexterous-hand suppliers like Linkerbot.
    type: third-party-reported
    topic: growth-driver
    sourceRefs:
    - SM010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM017
  - id: CM018
    statement: Falling per-unit hand pricing (from over $100,000 to under $2,000 for comparable-generation Chinese-made hands) is a growth driver that expands the buyer pool beyond well-funded robotics labs to mainstream industrial and even consumer-adjacent buyers.
    type: third-party-reported
    topic: growth-driver
    sourceRefs:
    - SM007
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM018
  - id: CM019
    statement: Public demonstrations by rival humanoid-robot makers (e.g., televised performances and public marathon events referenced in 2026 wire coverage) are cited as a driver of investor and buyer interest across the whole China humanoid-robotics sector, indirectly benefiting hand suppliers like Linkerbot.
    type: third-party-reported
    topic: growth-driver
    sourceRefs:
    - SM020
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM019
  - id: CM020
    statement: China's National Development and Reform Commission publicly warned in 2026 that more than 150 humanoid-robot companies now exist domestically and cautioned against excessive duplication and speculative bubbles, an adoption/valuation-discipline constraint for the whole sector.
    type: third-party-reported
    topic: adoption-constraint
    sourceRefs:
    - SM011
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QM020
  - id: CM021
    statement: US lawmakers introduced bipartisan bills in March 2026 (the American Security Robotics Act and the GUARD Act) that would ban US federal government procurement and use of humanoid and ground robots made by Chinese firms, a direct adoption constraint for Chinese-made components including dexterous hands in the US public sector.
    type: third-party-reported
    topic: adoption-constraint
    sourceRefs:
    - SM012
    - SM013
    - SM027
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QM021
