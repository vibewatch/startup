- id: growth-drivers-constraints
  title: Growth drivers and adoption constraints
  body: Several forces are pushing adoption forward. China's 15th Five-Year Plan (2026-2030) elevates AI-powered robotics to a core national strategic priority, a sustained policy tailwind for domestic hand makers. Per-unit hand pricing has fallen sharply — from over $100,000 to below $2,000 for comparable-generation Chinese-made hands, with some competitors publicly projecting sub-$100 pricing within a few years — which should expand the buyer pool well beyond well-capitalized robotics labs. Public demonstrations by rival humanoid-robot makers have also lifted sector-wide investor and buyer attention in 2026. Countervailing constraints are real and material. China's National Development and Reform Commission has publicly warned that more than 150 humanoid-robot companies now exist domestically and cautioned against product duplication and speculative bubbles — a signal that policy tightening or investor caution could follow. On the demand side, US lawmakers introduced the GUARD Act and the American Security Robotics Act in March 2026, both aimed at banning US federal government procurement and use of Chinese-made humanoid and ground robots, a direct constraint on any US public-sector demand for Chinese-made components including dexterous hands. Broader US semiconductor and advanced-computing export controls could further constrain the electronics inside high-end hands sold into or via US-linked supply chains. Finally, international safety standards (ISO 10218, ISO/TS 15066) and a still-early reliability profile — per the Morgan Stanley-referenced enterprise survey — mean many industrial buyers remain in pilot mode rather than committing to production-scale, multi-unit orders.
