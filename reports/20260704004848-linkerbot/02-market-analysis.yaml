callouts:
- calloutType: insight
  title: No single trusted TAM exists for this market
  body: Whole-humanoid-robot TAM estimates for 2026 span more than 2x across major publishers ($4.2B-$10.9B), and none isolate the narrower dexterous-hand sub-segment Linkerbot actually competes in; the closest proxy (China-only dexterous hands, >$3.7B by 2031) is a single-article estimate, not an audited study.
  claimRefs:
  - CM006
  - CM008
  - CM011
  - CM026
- calloutType: risk
  title: US policy is closing off a demand channel just as China's domestic policy opens one
  body: The GUARD Act and American Security Robotics Act would ban US federal procurement of Chinese-made robots/components in the same year China's 15th Five-Year Plan elevates robotics as a strategic priority — a bifurcating policy environment that could concentrate Linkerbot's addressable demand even more heavily inside China.
  claimRefs:
  - CM017
  - CM021
  - CM022
- calloutType: assumption
  title: Linkerbot's 80%+ share claim uses a self-defined category
  body: No third party has independently sized 'the global high-DoF dexterous hand market' the way Linkerbot defines it; treat the 80%+ figure as company-claimed share of a company-defined category until an independent SAM/SOM study is available.
  claimRefs:
  - CM010
  - CM027
  - CM030
- calloutType: strength
  title: Falling unit economics widen the realistic buyer pool
  body: Sub-$2,000 (and trending toward sub-$100) unit pricing for comparable-generation Chinese-made hands is a genuine structural driver that should expand demand beyond research labs into mainstream industrial buyers over the next several years.
  claimRefs:
  - CM009
  - CM018
