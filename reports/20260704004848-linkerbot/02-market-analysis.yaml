company:
  name: Linkerbot
chapter:
  number: 2
  title: Market Analysis
  summary: Linkerbot's addressable market is the dexterous end-effector sub-segment of embodied-AI/humanoid-robotics hardware, not the whole humanoid-robot market; published 2026 whole-market TAM estimates span $4.2B-$10.9B across major publishers with no reconciled methodology, and the closest dexterous-hand-specific proxy (China-only, >$3.7B by 2031) is a single-article estimate. Buyers split across industrial/electronics manufacturers, humanoid-robot integrators making a buy-vs-build decision, and grant-funded research institutions, with most 2026 evidence placing adoption in early pilot/certification stages rather than production reorder. Growth drivers include Chinese industrial policy and falling unit pricing; material constraints include a domestic overcapacity/bubble warning from China's NDRC and new US federal procurement bans targeting Chinese-made robots.
sections:
- id: market-boundary
  title: Market boundary, adjacencies, and status-quo substitutes
  body: 'The market Linkerbot actually competes in is narrower than ''humanoid robots'' as a whole: it is the sub-segment of the embodied-AI hardware stack devoted to dexterous end-effectors — robotic hands and grippers with human-like degrees of freedom — plus an adjacent manipulation-software layer (LinkerSkillNet, Open TeleDex). Excluded from that addressable spend is the much larger bill of materials for a complete humanoid robot: chassis, locomotion, batteries, and general-purpose AI compute, all of which are supplied by other vendors or built in-house by robot integrators. Adjacent markets include full humanoid-robot makers such as Unitree and Tesla''s Optimus program that currently build their own hands rather than buying from a supplier, and industrial-automation gripper incumbents that could add degrees of freedom over time and encroach on the low end of Linkerbot''s category. The most direct status-quo substitute for a buyer that does not need full human-like dexterity is a simple 2-3 finger parallel-jaw gripper (as sold by incumbents like RightHand Robotics), or simply continuing to use human manual labor for fine-manipulation tasks that are not yet cost-effective to automate. Framing the market this way matters because whole-humanoid-robot TAM figures, however large, systematically overstate what Linkerbot itself can capture.'
  claimRefs:
  - CM001
  - CM002
  - CM003
  - CM004
  tableRefs:
  - TM001
- id: market-sizing
  title: TAM/SAM/SOM sizing across multiple, disagreeing lenses
  body: 'No single trusted TAM number exists for this market. Whole-humanoid-robot market-size estimates for 2026 range from about $4.2 billion (Grand View Research) and $5.41 billion (MarketsandMarkets) to $10.69 billion (Future Market Insights) and $10.9 billion (Global Market Insights) — a spread of more than 2x for the same year, with none of the reviewed publisher pages fully disclosing their underlying methodology in the excerpts retrieved. Goldman Sachs Research instead frames the opportunity as a long-horizon scenario range: a base case near $38 billion by 2035, with a ''blue sky'' scenario reaching $154 billion if reliability and cost barriers fall faster than expected. None of these whole-market figures isolate the dexterous-hand sub-segment Linkerbot actually sells into. The closest available proxy is a China Biz Insider estimate that the China-only dexterous-hand market alone will exceed $3.7 billion by 2031, alongside an industry tracker''s observation that Chinese suppliers already provide 70-80% of global commercial high-DoF robot hands at unit prices that have fallen from over $100,000 to below $2,000. Even that narrower figure is a single-article citation rather than an audited market study, and no reviewed source provides a serviceable-obtainable-market (SOM) figure specific to Linkerbot; the company''s own 80%+ share claim is applied against a category boundary (''global high-DoF dexterous hand market'') that it defines itself rather than against any named third-party sizing study.'
