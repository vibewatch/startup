summary:
  headline: >-
    Linkerbot shows unusually strong, multiply-corroborated shipment scale and top-tier investor backing for a
    dexterous-hand maker, but a near-total absence of audited financials, independent market-share verification, and
    reconciled funding-round data mean its $3B valuation cannot yet be independently underwritten.
