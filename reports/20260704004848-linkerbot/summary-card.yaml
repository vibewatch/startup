  topStrengths:
    - >-
      Corroborated production scale (10,000+ cumulative units shipped by Dec 2025, targeting 10,000 units/month) across
      company statements and multiple independent trackers.
    - >-
      Top-tier institutional backing (Ant Group, HongShan Group, Zhongguancun Science Park Fund, Bank of China Asset
      Management, Fosun Capital) at a disclosed ~$3B valuation.
    - >-
      Genuinely open developer tooling (GitHub-hosted ROS/ROS2 SDKs, URDF models, simulator) evidencing real engineering
      investment beyond marketing claims.
  topRisks:
    - >-
      No audited financial statements, gross margin, cash position, or headcount disclosed anywhere, and no independent
      audit of the claimed 80%+ market share exists.
    - >-
      Key-person risk is concentrated in a single publicly named executive with an unresolved identity/title question
      and no disclosed board or succession plan.
    - >-
      US federal procurement bans (GUARD Act, American Security Robotics Act) and China's own NDRC overcapacity warnings
      create bidirectional regulatory and valuation-discipline risk.
  unresolvedGaps:
    - Independent, third-party audit of Linkerbot's claimed 80%+ high-DoF market share and unit-shipment volumes.
    - Revenue, gross margin, cash position, burn rate, and headcount disclosure.
    - >-
      Reconciliation of the February 2026 Series B round size with the May 2026 Series B+ valuation to assess dilution
      and capital efficiency.
    - >-
      Confirmation of whether 'Alex Zhou' and 'Zhou Yong' are the same individual, and disclosure of board composition
      and succession planning.
