company:
  name: Linkerbot
chapter:
  number: 7
  title: Risks
  summary: 'Linkerbot''s highest-severity risks are a manufacturing scale-up gap (5,000 to a targeted 10,000+ units/month, or 50,000-100,000 for full-year 2026) with no disclosed capex plan; US federal procurement bans (the GUARD Act, American Security Robotics Act) that could close off US-linked demand; concentrated key-person risk in a single named executive with no disclosed succession; and capital-provider concentration among a small number of large, partly state-linked institutional investors. Regulatory risk is bidirectional: US policy is tightening against Chinese-made robots/components even as China''s national strategy elevates the sector, while China''s own NDRC has separately warned of overcapacity among 150+ domestic humanoid-robot companies. No reviewed source documents any Linkerbot-specific mitigation, certification, insurance, or contingency plan for any of these risks, leaving the risk picture built almost entirely from sector-level context rather than company disclosure.'
sections:
- id: severity-ranked-overview
  title: Severity-ranked risk overview
  body: 'Across regulatory, operational, partner, and people dimensions, the highest-severity risks for Linkerbot are: manufacturing scale-up shortfall against a disclosed 10,000-unit/month (and separately reported 50,000-100,000-unit full-year 2026) target with no disclosed capex plan; US federal procurement bans (the GUARD Act and American Security Robotics Act) that could close off US-linked demand for Chinese-made robotics components; key-person and succession risk concentrated in a single publicly named executive; and capital-provider concentration among a small number of large, partly state-linked institutional investors. Each of these carries a plausible investment implication — from reduced near-term revenue growth (manufacturing shortfall), to a shrinking addressable market in the US (regulatory), to abrupt leadership discontinuity (people risk), to financing fragility if investor sentiment shifts (capital concentration). Mitigation maturity is uniformly low: no reviewed source documents a specific contingency plan, insurance policy, or risk-management disclosure from Linkerbot for any of these top risks, which is itself a notable gap for a company operating at a multi-billion-dollar valuation.'
  claimRefs:
  - CR001
  - CR016
  - CR020
  - CR025
  - CR034
  - CR041
- id: regulatory-legal-risk
  title: Regulatory and legal risk
  body: Linkerbot faces regulatory risk on both the US and Chinese sides of the market. In the US, lawmakers introduced the bipartisan GUARD Act and American Security Robotics Act in March 2026, aimed at banning federal government procurement and use of Chinese-made humanoid and ground robots; no reviewed source confirms whether this scope would extend to components like dexterous hands embedded inside non-Chinese-branded robots, leaving the practical reach of this risk to Linkerbot uncertain but plausible. Separately, BIS's 2026 case-by-case AI-chip license-review process and the broader January 2025 export controls on advanced computing items and AI model weights add compliance obligations relevant to any embodied-AI hardware and software maker sourcing or exporting advanced compute. A law-firm analysis frames humanoid robots generally as entering 'a new era of risk' under existing product-liability and safety law, though no reviewed source documents any litigation, enforcement action, or IP dispute specific to Linkerbot. On the China side, a national humanoid-robot standards-setting technical committee is being formed with Unitree and AgiBot executives as members, but no reviewed source confirms Linkerbot has committee representation, raising a risk that binding technical standards could be shaped without its direct input; separately, China's NDRC publicly warned in 2026 of overcapacity and speculative bubbles among more than 150 domestic humanoid-robot companies, a sector-wide signal of possible future policy tightening. No source confirms whether Linkerbot holds ISO 10218 or ISO/TS 15066 safety certification, and the EU's AI Act adds a further, currently unconfirmed, compliance layer for any European sales.
