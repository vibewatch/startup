callouts:
- calloutType: risk
  title: US and Chinese policy risk point in opposite directions
  body: US lawmakers are moving to ban Chinese-made robots/components from federal procurement in the same year China's national strategy elevates robotics as a priority, meaning Linkerbot's addressable demand could concentrate even more heavily inside China just as scrutiny of that market's overcapacity intensifies.
  claimRefs:
  - CR001
  - CR012
- calloutType: risk
  title: Key-person risk sits at the center of nearly every disclosed fact
  body: Every reviewed source about leadership, strategy, and fundraising routes through one publicly named executive, with no disclosed board, deputy, or succession plan — a single point of governance failure for a company operating at a multi-billion-dollar valuation.
  claimRefs:
  - CR025
  - CR028
- calloutType: risk
  title: No company-specific mitigation, certification, or insurance disclosure exists for any top risk
  body: Across regulatory, operational, partner, and people risk categories, no reviewed source documents a specific Linkerbot mitigation, certification, insurance policy, or contingency plan — the entire risk picture is built from sector-level context rather than company disclosure.
  claimRefs:
  - CR034
  - CR040
- calloutType: recommendation
  title: Prioritize independent audits of scale and certification claims
  body: Given a sector-wide pattern of contested self-reported shipment/share claims (Unitree vs. AgiBot) and no confirmed safety certification for Linkerbot itself, the highest-value near-term diligence action is commissioning an independent market-share/shipment audit and requesting certification documentation directly.
  claimRefs:
  - CR032
  - CR009
