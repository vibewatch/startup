  claims:
  - id: CR001
    statement: US lawmakers introduced the bipartisan American Security Robotics Act and GUARD Act in March 2026, both aimed at banning US federal government procurement and use of humanoid and ground robots made by Chinese firms, a direct regulatory risk for any Chinese-made robotics component including Linkerbot's hands.
    type: third-party-reported
    topic: regulatory-legal
    sourceRefs:
    - SR001
    - SR002
    - SR003
    confidence: high
    freshness: current
    answersQuestionRefs:
    - QR001
  - id: CR002
    statement: No reviewed source confirms whether the GUARD Act's or American Security Robotics Act's scope would extend to components (dexterous hands) embedded inside non-Chinese-branded robots, leaving the practical reach of this regulatory risk to Linkerbot's US-linked sales uncertain.
    type: open-question
    topic: regulatory-legal
    sourceRefs:
    - SR002
    confidence: low
    freshness: unknown
    answersQuestionRefs:
    - QR002
  - id: CR003
    statement: BIS's 2026 license-review process for AI chip exports to China and Macau introduces case-by-case review rather than blanket denial, but still constrains the advanced-compute components that could be used in higher-end Linkerbot hand electronics or associated AI/data infrastructure.
    type: third-party-reported
    topic: regulatory-legal
    sourceRefs:
    - SR004
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR003
  - id: CR004
    statement: US export controls published in January 2025 on advanced computing items and AI model weights add compliance obligations relevant to any embodied-AI company (including Chinese dexterous-hand makers) that trains or exports AI models alongside hardware.
    type: third-party-reported
    topic: regulatory-legal
    sourceRefs:
    - SR005
    confidence: medium
    freshness: historical
    answersQuestionRefs:
    - QR004
  - id: CR005
    statement: A law-firm analysis frames humanoid robots as entering 'a new era of risk' under existing product-liability, safety, and data-protection law, a general legal-exposure backdrop relevant to any dexterous-hand maker, Linkerbot included, even absent a company-specific case.
    type: third-party-reported
    topic: regulatory-legal
    sourceRefs:
    - SR006
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR005
  - id: CR006
    statement: No reviewed source documents any litigation, enforcement action, regulatory investigation, or product recall involving Linkerbot specifically.
    type: open-question
    topic: regulatory-legal
    sourceRefs: []
    confidence: low
    freshness: unknown
    answersQuestionRefs:
    - QR006
  - id: CR007
    statement: No reviewed source discloses any patent, trademark, or other intellectual-property filing or dispute involving Linkerbot.
    type: open-question
    topic: regulatory-legal
    sourceRefs: []
    confidence: low
    freshness: unknown
    answersQuestionRefs:
    - QR007
  - id: CR008
    statement: China is actively drafting national humanoid-robot standards through a technical committee whose members include executives from Unitree and AgiBot but, per reviewed sources, not Linkerbot, raising a risk that Linkerbot could face standards shaped without its direct input.
    type: third-party-reported
    topic: regulatory-legal
    sourceRefs:
    - SR013
    - SR012
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QR008
  - id: CR009
    statement: No reviewed source confirms whether Linkerbot's hand products currently comply with, or have been certified against, ISO 10218 or ISO/TS 15066 industrial/collaborative robot safety standards.
    type: open-question
    topic: regulatory-legal
    sourceRefs:
    - SR009
    - SR010
    confidence: low
    freshness: unknown
    answersQuestionRefs:
