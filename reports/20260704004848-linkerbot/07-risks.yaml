- id: people-financial-mitigation
  title: People/execution and financial/model risk, mitigation, and kill criteria
  body: 'People and execution risk center on a single publicly named executive: 2026 wire coverage names ''CEO Alex Zhou'' while 2025 coverage names ''Founder and CTO Zhou Yong,'' and a later independent source ties both names to one individual (''Alex Zhou Yong''), but no board, deputy, or succession plan is disclosed — a material governance gap at a multi-billion-dollar valuation. A reported plan to double the research team by the end of 2026, alongside aggressive production-volume growth targets, creates execution risk if hiring and quality-control capacity do not scale proportionally, though no current headcount baseline is disclosed to benchmark against. On financial/model risk, no source discloses cash on hand, burn rate, or runway, and the roughly RMB 1.5 billion February 2026 Series B round is not reconciled with the roughly $3 billion May 2026 ''Series B+'' valuation, leaving dilution and capital-efficiency risk unclear; no source confirms whether current pricing (e.g., the ~$920 O6 model) is consistent with a sustainable gross margin. Monitorable kill criteria/thesis-break triggers include: enacted US procurement-ban scope explicitly covering embedded components; any confirmed product recall or safety incident; a down round, valuation markdown, or confirmed miss versus the 2026 production target; departure of the sole named executive without a successor; and any independent audit materially contradicting Linkerbot''s 80%+ market-share claim. Overall, this chapter''s risk profile combines well-corroborated, sector-wide regulatory and overcapacity risk with a near-total absence of company-specific mitigation, certification, insurance, or contingency disclosure.'
