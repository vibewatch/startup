  productSummary: Linker Hand series of dexterous robotic hands and end effectors (13+ SKUs spanning 6-42 DoF, e.g. O6, L20, L30), a 'Linker Craftsman' manipulation workstation, plus the LinkerSkillNet manipulation-skill software ecosystem and Open TeleDex teleoperation system.
  customerFocus: Humanoid-robot integrators, industrial/electronics manufacturers (Samsung Electronics, Siemens), and research institutions (Stanford, MIT, Cambridge, University of Hong Kong); total distinct customer count and revenue concentration are undisclosed.
  businessModel: Hardware-first direct sales of dexterous hand/end-effector products, layered with an emerging manipulation-skill software and teleoperation platform whose separate revenue contribution (if any) is undisclosed.
  stage: Series B+ private
  fundingStatus: Series A+ reported November 2025 (fourth capital injection in eight months); Series B of roughly RMB 1.5 billion reported February 2026; 'Series B+' round closed around May 2026 at approximately a $3 billion valuation with a disclosed ~$6 billion next-round target; listed company Dongfang Precision (002611.SZ) discloses holding roughly 4.36% direct equity.
