companyProfile:
  summary: Linkerbot is a Beijing-based (Haidian District) robotics-hardware company, founded around 2023, that designs and mass-produces high-degree-of-freedom dexterous robotic hands under the Linker Hand brand, spanning roughly 6 to 42 degrees of freedom across direct-drive, linkage, and tendon-driven actuation. The company claims over 80% global market share in high-DoF dexterous hands, had shipped more than 10,000 cumulative units by December 2025, and was scaling monthly production from about 5,000 toward a 10,000-unit target as of May 2026, alongside a separately reported 50,000-100,000-unit full-year 2026 delivery goal. Linkerbot closed a Series B round of roughly RMB 1.5 billion in February 2026 and a further 'Series B+' round at approximately a $3 billion valuation by May 2026, backed by Ant Group, HongShan Group, Zhongguancun Science Park Fund, Bank of China Asset Management, and Fosun Capital, and has disclosed a roughly $6 billion target for its next round. Named customers span industrial manufacturing (Samsung Electronics, Siemens) and research institutions (Stanford, MIT, Cambridge, University of Hong Kong). Revenue, gross margin, cash position, headcount, board composition, and an independent audit of the market-share claim are not disclosed in any source reviewed.
  foundedDate: '2023-01-01'
  founders:
  - name: Alex Zhou (Zhou Yong)
    role: CEO
    background: Named 'CEO Alex Zhou' in May 2026 Reuters-sourced wire coverage and 'Founder and CTO Zhou Yong' in November 2025 China Biz Insider coverage; no reviewed source explicitly confirms these refer to the same individual or clarifies any CTO-to-CEO title change.
