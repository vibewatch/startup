- id: scale-metrics-and-gaps
  title: 'Cover metrics: scale, market share, customers, and disclosure gaps'
  body: 'Linkerbot''s most heavily cited cover metric is its claimed global market share in high-degree-of-freedom robotic hands: the company states it holds over 80% share and is the only manufacturer mass-producing more than 1,000 high-DoF hands per month, a claim repeated in both company press releases and Reuters-sourced coverage. An independent industry tracker (TechBuzz China) and a Chinese-language market analysis (Gongboshi Robot) both describe Linkerbot as the category leader with 80%+ share as of early-to-mid 2026, providing partial third-party corroboration beyond the company''s own statements, though neither source discloses its underlying methodology. On production scale, Linkerbot said in May 2026 that it was scaling monthly output from almost 5,000 units to a planned 10,000 units ''soon,'' building on a disclosed cumulative milestone of more than 10,000 hands shipped by December 2025 and a highest single month above 4,000 units. Disclosed named customers are limited to Samsung Electronics and Siemens for industrial/production use, plus research use described as including Stanford and MIT, though no source provided contract values, unit counts by customer, or renewal information. Revenue, ARR, gross margin, and headcount remain fully undisclosed in every source reviewed for this chapter, and Linkerbot''s HKTDC international-sourcing storefront page returned a page-not-found result, a minor but concrete channel-visibility gap. Separately, China''s National Development and Reform Commission publicly flagged in 2026 that more than 150 humanoid-robot companies now operate in China and warned against excessive product duplication and speculative bubbles — a sector-level adverse signal relevant to how aggressively any single company''s valuation trajectory should be read.'
