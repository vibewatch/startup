  claims:
  - id: CV001
    statement: The investment thesis for Linkerbot rests on disclosed 80%+ share in a fast-growing, cost-collapsing high-DoF dexterous-hand category, corroborated production scale (10,000+ cumulative units shipped, targeting 10,000/month), and backing from major institutional investors at a ~$3 billion valuation.
    type: inferred
    topic: thesis
    sourceRefs:
    - SV001
    - SV022
    - SV016
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV001
  - id: CV002
    statement: The anti-thesis is that Linkerbot's market-share claim is self-defined and unaudited, its financial statements (revenue, margin, cash position) are entirely undisclosed, its customer base rests on a handful of logo-level named accounts with no outcome or retention data, and it operates in a sector China's own NDRC has flagged for overcapacity risk.
    type: inferred
    topic: thesis
    sourceRefs:
    - SV019
    - SV015
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QV002
  - id: CV003
    statement: No reviewed source provides audited financial statements, an independent market-share audit, or named-customer outcome data for Linkerbot, so the investment thesis currently rests more on growth-narrative corroboration than on financial or commercial due-diligence-grade evidence.
    type: inferred
    topic: thesis
    sourceRefs:
    - SV015
    - SV016
    confidence: medium
    freshness: current
