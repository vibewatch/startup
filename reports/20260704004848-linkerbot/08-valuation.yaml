- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Independent market-share audit
    - Any credible third-party finding materially below the claimed 80%+ share
    - Undermines the core moat/scale argument underlying the valuation
    - Downgrade recommendation and reassess valuation stance immediately
  - - Funding/production miss
    - Down round, materially delayed fundraising vs. the $6B target, or missed 2026 production target
    - Signals weaker-than-disclosed commercial or financial trajectory
    - Reassess valuation stance and capital-adequacy risk rating
  - - US regulatory action
    - Enacted legislation explicitly covering embedded Chinese-made components (not just complete robots)
    - Shrinks Linkerbot's addressable Western demand
    - Reassess market-size and growth assumptions for non-China revenue
  - - Key-person departure
    - Confirmed departure of the sole named executive without a disclosed successor
    - Removes the primary operational/strategic continuity anchor
    - Treat as an immediate governance and continuity risk event
  notes: Triggers are forward-looking monitorable events consistent with risks already documented in the Risks chapter, not evidence that any have occurred as of the report date.
  claimRefs:
  - CV029
  - CV030
  - CV031
  - CV032
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner / diligence path
  rows:
  - - Market-share / shipment verification
    - Independent audit of the claimed 80%+ high-DoF share and unit-shipment volumes
    - Nearly every other valuation input depends on this claim's credibility
    - Commission a third-party audit or customs/shipment-data analysis
  - - Financial statements
    - Revenue, gross margin, cash position, burn rate
    - No valuation method beyond comparable-transaction pricing is currently possible without this
    - Request management accounts directly or monitor for a future IPO prospectus
  - - Funding-round reconciliation
    - Reconciliation of the Feb 2026 Series B round size with the May 2026 Series B+ valuation
    - Needed to assess actual dilution and capital efficiency between the two events
    - Request a full cap-table summary with pre/post-money detail per round
  - - Governance and key-person risk
    - Board composition, succession plan, and confirmation of the Alex Zhou / Zhou Yong identity question
    - Key-person risk is concentrated and currently unresolved
    - Request organization chart and governance documentation
  notes: Diligence asks are prioritized by how directly they would change the recommendation or valuation stance if resolved.
  claimRefs:
  - CV033
  - CV034
  - CV035
  - CV009
