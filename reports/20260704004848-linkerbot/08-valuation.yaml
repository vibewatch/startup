- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Unitree (China, full-stack humanoid, self-developed hands)
    - Valuation / filing status
    - ~$1.6B (2025 Series C); IPO filed, reported up to $580M raise
    - Closest China-based comparable with public filing-level disclosure
    - Full-stack humanoid maker, not a pure hand-component supplier like Linkerbot
  - - AgiBot (China, full-stack humanoid + standalone hand sales)
    - Valuation
    - Reported to exceed RMB 7B (~$1B) in an earlier round
    - Closest direct product-category comparable (also sells standalone hands)
    - Single-source, thin-content citation; valuation date and round details not fully corroborated
  - - Figure AI (US, full-stack humanoid, in-house hand)
    - Valuation
    - $39B post-money (Series C, >$1B raised)
    - Upper-bound comparable for a well-funded Western humanoid-robotics platform
    - Different geography, buyer base, and hand-sourcing model than Linkerbot
  - - Apptronik (US, full-stack humanoid, in-house hand)
    - Valuation
    - $5B ($520M raised)
    - Mid-tier Western comparable at a scale-up stage similar to Linkerbot
    - Different geography and business model (full robot vs. component)
  - - X Square Robot (China, embodied-AI/household robotics)
    - Valuation
    - '>$2.8B across four consecutive rounds'
    - China-based comparable at a broadly similar capital-raising cadence
    - Different end-market focus (household/consumer vs. Linkerbot's industrial/craftsmanship focus)
  notes: Valuations are as disclosed by each company or reported by press/filings; none use a standardized revenue or EBITDA multiple, since none of the comparables (including Linkerbot) disclose financial statements sufficient to compute one.
