- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - What would change the view
  rows:
  - - 'Thesis: Linkerbot leads a fast-growing, cost-collapsing category with strong institutional backing'
    - Independent market-share/shipment audit confirming the 80%+ claim would strengthen this thesis materially
  - - 'Thesis: Corroborated unit-shipment growth (10,000+ shipped, scaling toward 10,000/month) signals real commercial traction'
    - Disclosed revenue/ARR data consistent with that unit growth would confirm commercial (not just production) traction
  - - 'Anti-thesis: Market-share and shipment claims are self-defined and unaudited, and peer disputes (Unitree vs. AgiBot) show this is a live credibility issue sector-wide'
    - An independent audit contradicting the 80%+ claim would confirm the anti-thesis
  - - 'Anti-thesis: No financial statements, gross margin, or cash position are disclosed'
    - Access to management accounts or a future IPO prospectus (as with Unitree) would resolve this
  - - 'Anti-thesis: China''s NDRC has warned of sector-wide overcapacity and bubble risk among 150+ domestic humanoid-robot companies'
    - Concrete NDRC policy action (versus rhetoric) tightening the sector would confirm this anti-thesis; continued unconstrained growth would weaken it
  notes: Thesis and anti-thesis arguments are drawn directly from evidence reviewed in this and earlier chapters; neither side is assumed to dominate without further diligence.
