      - number: '4.5'
        title: 财务结论：收入质量、利润率路径和尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              合在一起看，Linkerbot
              的公开记录同时包含强且多方佐证的台数出货牵引力和融资轮活动，也几乎完全缺少收入、利润率、成本结构和资产负债表披露；这符合快速扩张的私营硬件公司常见模式，但会实质性阻断任何独立财务估值。收入质量无法评估，因为没有来源按收入流、客群或地域拆分收入。利润率路径也不清楚，因为毛利率、BOM
              成本、保修 / 缺陷成本全部未披露；联合创始人所称未来数年走向 $70
              以下单价，既可能反映可信的制造成本曲线，也可能是由持续股权融资支持的有意亏损扩张策略——公开记录无法区分两者。可比同业制造扩产报道显示资本强度很高；Linkerbot 自身融资依赖（三次或更多股权融资发生在不到
              18 个月内）大概率会持续，直到硬件利润率和 / 或未披露的软件 / 数据收入层成熟到足以内部供血，除非这一点永远无法实现。近期最具体的尽调阻断项，是没有任何经审计财务报表（可比同业 Unitree 已通过自身
              IPO 招股书跨过这道门槛）、2026 年 2 月 Series B 轮金额与 2026 年 5 月 Series B+ 估值之间缺少对账，以及员工人数、现金状况和现金消耗率披露完全缺席。
            claimRefs:
              - CI029
              - CI032
              - CI033
              - CI034
              - CI035
