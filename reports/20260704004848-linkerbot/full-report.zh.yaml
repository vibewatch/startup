  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              从监管、运营、伙伴和人员维度看，Linkerbot 最高严重度风险包括：在没有披露资本开支计划的情况下，可能无法兑现 10,000 台 / 月（以及另有报道的 2026 全年 50,000-100,000
              台）产能目标；美国联邦采购禁令（GUARD Act 和 American Security Robotics
              Act）可能切断美国链路上的中国制造机器人组件需求；关键人和接班风险集中在唯一公开具名高管身上；资本提供方集中在少数大型、部分带国资背景的机构投资者手中。每项风险都有合理投资影响：制造爬坡不及预期会压低近期收入增长；监管会缩小美国可服务市场；人员风险可能造成领导层突然断档；资本集中则会在投资者情绪转向时带来融资脆弱性。缓释成熟度普遍低：已审阅来源没有记录
              Linkerbot 针对任何顶级风险披露具体应急方案、保险政策或风险管理安排；对一家估值数十亿美元的公司来说，这本身就是显著缺口。
            claimRefs:
              - CR001
              - CR016
              - CR020
              - CR025
              - CR034
              - CR041
      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Linkerbot 同时面对美国和中国两侧的监管风险。美国方面，议员在 2026 年 3 月提出两党共同支持的 GUARD Act 和 American Security Robotics
              Act，目标是禁止联邦政府采购和使用中国制造的人形及地面机器人；没有已审阅来源确认范围是否延伸到嵌入非中国品牌机器人中的灵巧手等组件，因此这一风险对 Linkerbot
              的实际触达仍不确定，但合理存在。另行来看，BIS 2026 年逐案审查 AI 芯片许可证的流程，以及 2025 年 1 月更广泛的先进计算物项和 AI 模型权重出口管制，都给任何采购或出口先进算力的具身 AI
              硬件 / 软件厂商增加合规义务。一家律所分析称，人形机器人整体正在既有产品责任和安全法律下进入「风险新时代」，但已审阅来源没有记录任何针对 Linkerbot 的诉讼、执法行动或 IP
              争议。中国方面，全国人形机器人标准化技术委员会正在组建，Unitree 和 AgiBot 高管为成员，但没有已审阅来源确认 Linkerbot
              进入委员会；这带来一个风险：有约束力的技术标准可能在缺少其直接参与的情况下成形。与此同时，中国国家发改委在 2026 年公开警示 150
              多家国内人形机器人公司存在产能过剩和投机泡沫，是未来政策可能收紧的行业信号。没有来源确认 Linkerbot 是否持有 ISO 10218 或 ISO/TS 15066 安全认证；EU AI Act
              也给任何欧洲销售增加了另一层目前尚未确认的合规要求。
