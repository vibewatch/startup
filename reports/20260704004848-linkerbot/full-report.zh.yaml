      - number: '2.2'
        title: 从多个相互冲突的视角测算 TAM/SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              这个市场没有一个可信的单一 TAM 数字。2026 年整个人形机器人市场规模估计，从 Grand View Research 的约 $4.2B、MarketsandMarkets 的 $5.41B，到
              Future Market Insights 的 $10.69B、Global Market Insights 的 $10.9B 不等；同一年份口径相差超过 2
              倍，且已检索到的出版商页面摘录都没有完整披露底层方法论。Goldman Sachs Research 则把机会描述成长期情景区间：到 2035 年，基准情景接近
              $38B；若可靠性和成本障碍下降快于预期，“blue sky” 情景可达 $154B。这些整体市场数字都没有单独拆出 Linkerbot 实际销售进入的灵巧手子赛道。最接近的代理值来自 China Biz
              Insider 的估计：中国本土灵巧手市场到 2031 年将超过 $3.7B；同时，行业跟踪方观察到中国供应商已提供全球 70–80% 的商用高自由度机器人手，单价也从超过 $100,000 降至低于
              $2,000。即使这个更窄的数字也只是单篇文章引用，而非经审计的市场研究；已审阅来源也没有给出 Linkerbot 专属的可服务可获得市场（SOM）数字。公司自称 80%+
              份额所对应的品类边界，是其自己定义的“全球高自由度灵巧手市场”，不是任何具名第三方测算研究。
