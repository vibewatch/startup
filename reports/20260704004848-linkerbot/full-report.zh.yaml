      - number: '2.4'
        title: 增长驱动因素和采用约束
        blocks:
          - type: paragraph
            body: >-
              几股力量正在推动采用。中国“十五五”规划（2026–2030）把 AI 机器人提升为核心国家战略重点，为本土手部厂商提供持续政策顺风。单只手价格已大幅下降：同代中国制造灵巧手从超过 $100,000 降到低于
              $2,000，一些竞争对手还公开预计几年内可降到 $100 以下；买方池因此有望从资金充足的机器人实验室扩展到更广的客户。竞争性人形机器人厂商在 2026
              年的公开演示，也抬高了全行业投资人和买方关注度。反向约束同样真实且重要。中国国家发展和改革委员会已公开警示，国内已有 150
              多家人形机器人公司，并提醒避免产品重复和投机泡沫；这意味着后续可能出现政策收紧或投资人转谨慎。需求端，美国国会议员在 2026 年 3 月提出 GUARD Act 和 American Security
              Robotics
              Act，二者都旨在禁止美国联邦政府采购和使用中国制造的人形及地面机器人；这直接约束包括灵巧手在内的中国制造部件进入美国公共部门需求。更广泛的美国半导体和先进计算出口管制，也可能进一步限制销往或经由美国关联供应链的高端手部电子件。最后，国际安全标准（ISO
              10218、ISO/TS 15066）和仍处早期的可靠性曲线——见 Morgan Stanley 引用的企业调查——意味着许多工业买家仍停留在试点，而不是承诺生产规模、多台套订单。
