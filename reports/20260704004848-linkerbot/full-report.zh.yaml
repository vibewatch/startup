companyProfile:
  summary: >-
    Linkerbot 是一家总部位于北京海淀区的机器人硬件公司，约 2023 年成立，以 Linker Hand 品牌设计并量产高自由度灵巧机器人手，产品覆盖直驱、连杆和腱驱动架构，约 6–42
    个自由度。公司称自己在全球高自由度灵巧手市场占有 80% 以上份额，截至 2025 年 12 月累计出货超过 10,000 台；截至 2026 年 5 月，公司正把月产能从约 5,000 台拉向 10,000 台目标，另有报道给出
    2026 全年交付 50,000–100,000 台的目标。Linkerbot 在 2026 年 2 月完成约 RMB 1.5B 的 Series B，并在 2026 年 5 月前后以约 $3B 估值完成后续 ‘Series
    B+’，投资方包括 Ant Group、HongShan Group、Zhongguancun Science Park Fund、Bank of China Asset Management 和 Fosun
    Capital；公司还披露下一轮目标约 $6B。已点名客户覆盖工业制造（Samsung Electronics、Siemens）和研究机构（Stanford、MIT、Cambridge、University of Hong
    Kong）。所有已审阅来源均未披露收入、毛利率、现金状况、员工人数、董事会构成，也没有独立审计其市场份额主张。
