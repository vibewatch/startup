      - number: '8.4'
        title: 退出准备度、论点失效触发项与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              已审阅来源没有披露 Linkerbot 自身任何退出事件；行业内最接近退出准备度的证据，是可比同行 Unitree 已提交 STAR Market IPO，说明总体上存在可行退出路径。鉴于 Linkerbot
              已披露的规模和机构投资者基础，最终 IPO——可能在中国交易所——合理但目前未获确认；没有来源披露现有股东的 锁定期条款或任何二级转让机制。与估值风险有关的负面信号包括：中国国家发改委 2026
              年关于行业产能过剩的警示、Unitree 与 AgiBot 围绕出货领先说法的公开争议（直接类比 Linkerbot 自身未经审计的 80%+ 份额说法），以及美国立法动作（GUARD Act、American
              Security Robotics Act）可能限制 Linkerbot
              可服务的西方市场。四个具体、可监控的论点失效触发项直接来自风险章节：独立审计实质性推翻市占率说法；降估值融资、融资延迟或未达产量目标；已生效美国法律明确覆盖嵌入式组件；公司唯一具名高管离职且没有披露继任者。价值最高的最终尽调问题，是对
              Linkerbot 声称的市占率和出货量做独立审计，因为几乎所有其他估值输入都取决于这一说法是否可信；紧随其后的是获取基础财务报表、勾稽 2026 年两次融资事件，以及治理 / 关键人文件。
