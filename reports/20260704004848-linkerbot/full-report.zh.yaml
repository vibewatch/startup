        - label: 遥操作 / 技能软件（Open TeleDex、LinkerSkillNet）
          values:
            - 中（已宣传且已命名）
            - 低（未找到点名仓库或技术规格）
        - label: 认证、IP、制造 QA
          values:
            - 低（未披露）
            - 未找到
    claimRefs:
      - CE016
      - CE017
      - CE019
      - CE035
  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: 工业和科研客户的采用入口不同，但最终都靠直销或媒体报道发现产品，而不是通过渠道伙伴导入。
    data:
      nodes:
        - id: awareness
          label: 认知（CES 2026、媒体报道、展会认可）
        - id: evaluation
          label: 评估（SDK 试用，通过 URDF/linker-sim 仿真）
        - id: purchase
          label: 采购（直接从 Linkerbot 购买）
        - id: deploy-industrial
          label: 生产部署（工业产线，如 Samsung、Siemens）
        - id: deploy-research
          label: 实验室 / 演示部署（科研，如 Stanford、MIT、Cambridge、HKU）
        - id: expansion
          label: 扩张（复购订单未披露）
    claimRefs:
      - CU001
      - CU002
      - CU021
      - CU026
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 已披露证据集中在认知和发货阶段；扩张与留存阶段没有披露数据。
    data:
      items:
        - label: 认知（媒体 / 展会触达）
          value: 100
        - label: 具名客户关系（Samsung、Siemens、Stanford、MIT、Cambridge、HKU）
          value: 45
        - label: 已确认生产或试点状态
          value: 10
        - label: 有记录的复购 / 扩张订单
          value: 5
    approximationNotes: 漏斗数值只是示意比例，反映各阶段已披露证据的相对深度，不是实测转化率。
    claimRefs:
      - CU009
      - CU014
      - CU018
      - CU028
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 所有具名客户中，证据质量在客户标识确认上最强，在结果具体性和生产状态确认上最弱。
    data:
      columns:
        - 客户标识已识别
        - 多来源印证
        - 已确认生产或试点
        - 结果已量化
      rows:
        - label: Samsung Electronics
          values:
            - 是
            - 是（3 个来源）
            - 否
            - 否
        - label: Siemens
          values:
            - 是
            - 是（2 个来源）
            - 否
            - 否
        - label: Stanford University
          values:
            - 是
            - 是（2 个来源）
            - 否（暗示为科研 / 演示）
            - 否
        - label: MIT / Cambridge
          values:
            - 是
            - 否（仅公司声称）
            - 否（暗示为科研 / 演示）
            - 否
        - label: University of Hong Kong（研究机构）
          values:
            - 是
            - 否（单一独立来源）
            - 否（暗示为科研 / 演示）
            - 否
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
      - CU034
  - id: FU004
    title: 具名客户来源印证深度
    type: bar
    layout: standard
    summary: Samsung Electronics 的独立来源印证最深；University of Hong Kong 与 MIT/Cambridge 各自只靠一个来源支撑。
    data:
      items:
        - label: Samsung Electronics
          value: 3
        - label: Siemens
          value: 2
        - label: Stanford University
          value: 2
        - label: MIT
          value: 1
        - label: Cambridge
          value: 1
        - label: University of Hong Kong（研究机构）
          value: 1
    approximationNotes: 数值统计已审阅来源中点名各客户的不同来源数量（公司或独立来源），不是销售额、收入或满意度指标。
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
      - CU015
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 制造爬坡、关键人物和资本方集中风险，在发生概率与严重程度的综合评分上最高。
    data:
      columns:
        - 发生概率
        - 严重程度
        - 缓释成熟度
      rows:
        - label: 制造爬坡不及预期
          values:
            - 中
            - 高
            - 未披露
        - label: 美国联邦采购禁令（GUARD Act）
          values:
            - 中
            - 高
            - 未披露
        - label: 关键人物 / 接班风险
          values:
            - 低-中
            - 高
            - 未披露
        - label: 资本方集中
          values:
            - 中
            - 高
            - 未披露
        - label: 认证 / ISO 合规缺口
          values:
            - 中
            - 中
            - 仅非正式
        - label: 商品化 / 利润率压缩
          values:
            - 中
            - 中
            - 未经审计的主张
    claimRefs:
      - CR016
      - CR001
      - CR025
      - CR020
      - CR009
      - CR019
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 监管、运营和人员风险各自沿不同路径传导到收入、融资和估值。
    data:
      nodes:
        - id: reg
          label: 美国采购禁令 / 出口管制
        - id: ops
          label: 制造爬坡不及预期
        - id: people
          label: 关键人物 / 治理缺口
        - id: revenue
          label: 收入 / 客户需求
        - id: financing
          label: 融资（下一轮估值）
        - id: valuation
          label: 公司整体估值
      edges:
        - from: reg
          to: revenue
          label: 压低可触达的美国关联需求
        - from: ops
          to: revenue
          label: 限制大规模交付订单的能力
        - from: people
          to: financing
          label: 推高投资人风险感知
        - from: revenue
          to: financing
          label: 牵引力转弱，削弱下一轮融资议价
        - from: financing
          to: valuation
          label: 降价轮或融资延期压制估值
    claimRefs:
      - CR001
      - CR016
      - CR025
      - CR030
  - id: FR003
    title: 依赖关系图
    type: dag
    layout: wide
    summary: Linkerbot 依赖高度集中的资本方、未披露的零部件供应链，以及少量公开具名客户。
    data:
      nodes:
        - id: capital
          label: 机构投资人（Ant Group、HongShan、ZGC Fund、BOC AM、Fosun）
        - id: listed-partner
          label: Dongfang Precision（约 4.36% 股权持有人）
        - id: suppliers
          label: 零部件供应商（电机、传感器、计算组件——未披露）
        - id: export-policy
          label: 美国出口管制政策
        - id: customers
          label: 具名客户（Samsung、Siemens、Stanford、MIT、Cambridge、HKU）
        - id: company
          label: Linkerbot
      edges:
        - from: capital
          to: company
          label: 融资
        - from: listed-partner
          to: company
          label: 股权持股
        - from: suppliers
          to: company
          label: 零部件供应
        - from: export-policy
          to: suppliers
          label: 约束先进零部件获取
        - from: company
          to: customers
          label: 硬件销售
    approximationNotes: 供应商身份只按类别呈现而非点名，因为已审阅来源均未披露具体零部件供应商。
    claimRefs:
      - CR020
      - CR021
      - CR024
      - CR013
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 增长和规模证据很强，但财务与审计证据偏弱，最终给出继续研究建议，而不是买入或回避判断。
    data:
      nodes:
        - id: scale
          label: 已印证规模（发货、产能目标、投资人）
        - id: gap
          label: 证据缺口（财务、市场份额审计、融资核对）
        - id: risk
          label: 已记录风险（监管、关键人物、产能过剩）
        - id: verdict
          label: 建议：继续研究，中等置信度，高风险，估值拉伸
      edges:
        - from: scale
          to: verdict
          label: 支持继续关注
        - from: gap
          to: verdict
          label: 阻止给出买入判断
        - from: risk
          to: verdict
          label: 阻止给出高置信度判断
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV004
  - id: FV002
    title: 估值敏感性：可比公司组
    type: bar
    layout: wide
    summary: Linkerbot 披露估值显著高于最接近的直接产品品类可比公司 AgiBot，但低于西方最大的全栈人形机器人厂商。
    data:
      items:
        - label: AgiBot（手部产品直接可比）
          value: 1
          unit: $B
        - label: Linkerbot（当前，Series B+）
          value: 3
          unit: $B
        - label: Linkerbot（下一轮目标）
          value: 6
          unit: $B
        - label: X Square Robot
          value: 2.8
          unit: $B
        - label: Unitree
          value: 1.6
          unit: $B
        - label: Apptronik
          value: 5
          unit: $B
        - label: Figure AI
          value: 39
          unit: $B
    approximationNotes: 数值取已审阅来源报告的各公司最近披露轮次或备案估值，未按统一日期调整，也未按收入标准化。
    claimRefs:
      - CV015
      - CV016
      - CV017
      - CV018
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: Linkerbot 下一轮结果的合理范围从降价轮到达成披露的 $6B 目标；没有来源给出基准情景共识数字。
    data:
      items:
        - label: 熊市：降价轮 / 融资延期
          low: 1.5
          base: 2
          high: 2.5
          unit: $B
        - label: 基准：低于目标的温和上调
          low: 3
          base: 4
          high: 5
          unit: $B
        - label: 牛市：达到或超过披露目标
          low: 6
          base: 6.5
          high: 8
          unit: $B
    approximationNotes: 区间仅作示意，锚定已披露的当前 $3B 估值和 $6B 目标估值，以及本章牛市 / 基准 / 熊市的定性情景逻辑；它们并非来自已披露的公司财务模型。
    claimRefs:
      - CV011
      - CV012
      - CV013
      - CV006
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 可供 IC 使用的评分显示，市场与规模信号很强，但被偏弱的证据质量和财务透明度得分抵消。
    data:
      items:
        - label: 市场增长信号
          value: Strong
          note: 多个分析来源显示，该品类增长快、成本快速下探
        - label: 竞争护城河证据
          value: Moderate
          note: 护城河来自规模 / 成本，份额主张未经审计，商品化威胁可信
        - label: 财务透明度
          value: Weak
          note: 未披露收入、利润率、现金或员工人数
        - label: 风险评级
          value: High
          note: 监管、关键人物和产能过剩风险均有记录
        - label: 估值立场
          value: Stretched
          note: 披露价格没有审计证据独立支撑
    claimRefs:
      - CV004
      - CV028
      - CV040
