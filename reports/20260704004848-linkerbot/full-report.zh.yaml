      - number: '2.3'
        title: 买方、用户、付款方分层和采用路径
        blocks:
          - type: paragraph
            body: >-
              Linkerbot 这类灵巧手的买方至少分成三类，预算归属不同。工业和电子制造买家——包括 Linkerbot 自己披露的客户 Samsung Electronics 和 Siemens——通常从自动化 /
              资本开支预算中采购，买方、用户和付款方属于同一企业职能，采用触发点是相对于既有夹爪或人工流程的可靠性与成本平价。Unitree 等人形机器人集成商则构成独立的“买还是自研”客群：它们可以向 Linkerbot
              这样的供应商采购手部，也可以自己设计，因此采用触发点不是简单采购决策，而是成本和上市时间比较。研究机构（Linkerbot 称使用方包括 Stanford 和
              MIT）通过科研经费和实验室预算采购，而不是企业采购；采用触发点是论文发表和演示价值，而非商业 ROI，因此这是低收入但高可见度的渠道。一项 Morgan Stanley 引用的 2026
              年调查发现，许多中国企业买家希望引入人形 / 灵巧自动化，但尚不认为现有产品可靠到足以全量投入生产；这说明行业典型采用漏斗——认知、试点、认证、生产集成、复购——仍集中在早期阶段，Linkerbot
              也不例外，尽管没有来源披露 Linkerbot 自身的漏斗转化数据。
