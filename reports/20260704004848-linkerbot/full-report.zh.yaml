  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              Linkerbot 的投资论点建立在几项披露之上：高自由度灵巧手品类增长快、成本快速下探，公司声称占有 80%+ 份额；出货增长有交叉印证（2025 年 12 月累计 10,000+ 台，目标 10,000 台
              / 月，另有报道称 2026 全年交付 50,000-100,000 台）；以及主要机构投资者支持——Ant Group、HongShan Group、Zhongguancun Science Park
              Fund、Bank of China Asset Management、Fosun Capital——披露估值约 $3B。2026 年 3
              月技术大赛获奖和北京市政府认可，为公司自述之外增加了定性可信度。反向论点同样具体：市占率和出货说法由公司自行定义且未经审计，Unitree 与 AgiBot
              围绕出货领先的公开争议说明，行业信用问题已经现实存在，并非假设；收入、毛利、现金头寸或人数都未披露；具名客户基础只是一小批 logo 级账户，没有生产还是试点的确认，也没有结果数据；中国国家发改委也公开警示
              150 多家国内人形机器人公司存在产能过剩和投机泡沫风险。综合看，当前证据更能支撑增长叙事，而不是尽调级财务或商业结论。
