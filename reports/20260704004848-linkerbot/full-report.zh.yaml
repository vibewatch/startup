      - number: '8.5'
        title: 要点证据
        blocks:
          - type: callout
            title: 继续研究，而不是买入或回避
            body: 现有证据支持继续跟踪并启动正式尽调流程，而不是给出买入判断（缺少经审计财务和独立市占率审计）或回避判断（增长叙事和投资者名单确实强）。
            calloutType: recommendation
            claimRefs:
              - CV004
              - CV040
          - type: callout
            title: 相隔三个月的两次融资事件仍未勾稽
            body: >-
              约 RMB 1.5B 的 Series B 轮（2026 年 2 月）和约 $3B 的「Series B+」估值（2026 年 5
              月）各自都有较好印证，但没有来源解释第二次事件代表多少新资本、多少只是估值重定价——这是入场价格纪律的实质缺口。
            calloutType: risk
            claimRefs:
              - CV007
          - type: callout
            title: Linkerbot 的定价介于最接近可比公司和最大平台之间
            body: >-
              约 $3B 估值让 Linkerbot 明显高于 AgiBot（最接近的直接手部产品可比，约 $1B），但低于 Figure AI（$39B）和
              Apptronik（$5B）；这说明投资者更像是在按平台公司，而不是狭窄组件供应商给它定价。
            calloutType: insight
            claimRefs:
              - CV019
          - type: callout
            title: 情景概率是定性的，没有建模
            body: 没有来源提供 Linkerbot 的概率加权情景模型；这里的牛市 / 基准 / 熊市框架反映与已记录证据的一致性，而不是量化预测。
            calloutType: assumption
            claimRefs:
              - CV014
              - CV039
