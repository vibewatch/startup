  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻市场和现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Linkerbot 真正竞争的市场，比“人形机器人”整体要窄：它是具身 AI 硬件栈中专注灵巧末端执行器的子赛道，即具备类人自由度的机器人手和夹爪，再加相邻的操作软件层（LinkerSkillNet、Open
              TeleDex）。完整人形机器人的更大 BOM 并不计入这块可服务支出：底盘、运动系统、电池和通用 AI 算力都由其他供应商提供，或由机器人集成商自研。相邻市场包括 Unitree、Tesla Optimus
              等完整人形机器人厂商，它们目前自研手部而不是向供应商采购；也包括工业自动化夹爪老牌厂商，它们可能逐步增加自由度，并从低端挤入 Linkerbot 的品类。买家如果不需要完整类人灵巧度，最直接的现状替代品就是简单的
              2–3 指平行夹爪（如 RightHand Robotics 等老牌厂商所售），或者继续用人工完成尚不具备自动化成本效益的精细操作任务。这样界定市场很重要，因为整个人形机器人 TAM 数字无论多大，都会系统性高估
              Linkerbot 自己能捕获的部分。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
