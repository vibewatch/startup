      - number: '8.3'
        title: 牛市 / 基准 / 熊市情景与可比公司组
        blocks:
          - type: paragraph
            body: >-
              牛市情景下，Linkerbot 守住 80%+ 份额说法，完成 2026 年 50,000-100,000 台交付目标，并在持续的中国产业政策顺风下，以不低于已披露 $6B
              目标的估值完成下一轮融资。基准情景下，增长继续但低于公司表述，下一轮低于 $6B 完成，AgiBot、Zhaowei
              和其他独立手部产品进入者带来的价格竞争加剧。熊市情景下，独立审计或竞争对手争议削弱份额说法，国家发改委警示转化为具体政策收紧，制造爬坡不及预期，迫使公司降估值融资或推迟融资；没有来源给出这些情景的显式概率权重，因此这里是定性、以证据为锚的框架，而不是建模预测。对比
              Unitree（约 $1.6B，现已提交 IPO，披露达到完整招股书级别）、AgiBot（据报 >RMB 7B，约 $1B，最接近的直接产品品类可比）、Figure
              AI（$39B，西方上限可比）、Apptronik（$5B）和 X Square Robot（>$2.8B）这一组可比公司，Linkerbot 披露的约 $3B
              估值显著高于最接近的直接手部产品可比公司，但低于最大型西方全栈人形机器人厂商——说明市场给 Linkerbot 的定价更接近广义人形机器人平台，而不是较窄的手部组件供应商。没有来源披露 Linkerbot
              或任何可比公司的收入或 EBITDA 倍数，所以这一基准比较依赖绝对轮次估值，而不是标准化倍数；全市场分析师估算（MarketsandMarkets、Goldman Sachs
              Research）提供宏观顺风背景，但不能直接给 Linkerbot 定价。
