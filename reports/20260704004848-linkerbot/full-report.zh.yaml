      - number: '4.4'
        title: 资本充足性和融资依赖
        blocks:
          - type: paragraph
            body: >-
              在公司概览章节已记录的历史逐轮融资脉络基础上（本章不重复），本章与资本充足性直接相关的证据显示：Linkerbot 在 2026 年 2 月 12 日前后完成约 RMB 1.5B（约 $210M）的 Series
              B，由 Daode Investment 和 Shengshi Investment 领投，另有很长的参投方名单，披露募资用途聚焦核心研发、产能扩张和全栈操作平台能力。到 2026 年 5 月上旬，公司又以约
              $3B 估值完成 ‘Series B+’，投资方包括 Ant Group、HongShan Group、Zhongguancun Science Park Fund、Bank of China Asset
              Management 和 Fosun Capital，并披露下一轮目标约 $6B。另一个单列证据是，上市公司 Dongfang Precision（002611.SZ）披露直接持有 Linkerbot 约
              4.36% 股权，并在 2026 年 6 月投资者关系回复中引用其 2025 年年报确认持股未变；这是一条罕见的、达到财务披露级别的 Linkerbot
              股权结构证据，因为它来自上市公司自身监管披露义务，而不是私营公司新闻稿。没有来源对 2026 年 2 月 Series B 轮金额与 2026 年 5 月 Series B+
              估值隐含的资本规模作对账，因此两次事件之间的稀释和资本效率无法完全拆解。没有来源披露账上现金、月度现金消耗、资金可支撑时间、具体下一轮触发里程碑，或任何债务 / 项目融资义务；中国国家发展和改革委员会 2026
              年关于国内 150 多家人形机器人公司行业性产能过剩的警示，是解读 Linkerbot 快速、反复融资节奏时必须纳入的负面宏观信号。
