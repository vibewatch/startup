      - number: '1.2'
        title: 领导层、治理和关键人依赖
        blocks:
          - type: paragraph
            body: >-
              Linkerbot 公开可见的领导层信息很薄，其中一个关键点仍未解开。2026 年 5 月 Reuters 来源通讯稿（由 BusinessWorld、Straits Times、Yahoo Finance 和
              The Standard 再分发）把 ‘CEO Alex Zhou’ 称为讨论扩产和下一轮融资目标的高管。更早的 2025 年 11 月 China Biz Insider 中文报道则把 ‘Founder and
              CTO Zhou Yong’ 称为 Series A+ 融资阶段谈及订单量的人。已审阅来源没有明确说明 Alex Zhou 和 Zhou Yong 是否只是同一人的英文 / 中文名不同写法，也没有说明
              2025–2026 两个报道窗口之间是否真的发生了 CTO 到 CEO
              的头衔变化；本报告把它记录为未解决问题，而不是默认任一解释成立。除这位具名高管（或可能是同一人的两种称呼）外，已审阅来源没有披露独立董事会、外部董事、创始人股权分配或继任计划。已审阅报道中的产品战略、融资表态和制造扩产计划都通过同一位具名发言人传递；对于一家估值数十亿美元的公司，关键人依赖风险是实质性的。
