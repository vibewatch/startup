      - number: '1.3'
        title: 融资历史、估值和投资方
        blocks:
          - type: paragraph
            body: >-
              Linkerbot 已披露的融资历史至少分成两个阶段。Series A+ 阶段，China Biz Insider 在 2025 年 11 月报道，公司刚完成 8 个月内第四次注资，投资方包括 Zhejiang
              Innovation Investment、CDH Investments 旗下 Baifu fund、Leju Robotics，以及上市战略投资方 Dongfang Precision 和
              Aux，另有早期投资方 Ant Group 和 Sequoia China Seed Fund；该轮金额未披露。到 2026 年 4 月下旬 / 5 月上旬，Linkerbot 宣布 ‘Series B+’
              轮，估值约 US$3B，参投方包括 Ant Group、Sequoia 分拆后的 HongShan Group、国资背景的 Zhongguancun Science Park Fund、Bank of China
              Asset Management 和 Fosun Capital。同一公告中，公司称下一轮融资将寻求约 US$6B 估值，即 Series B+
              水平翻倍，但没有披露时间，也没有说明该轮会是私募融资还是公开上市。截至报告日，已审阅来源没有披露 Linkerbot 的累计总融资额；唯一可得的累计数字是 2025 年 12 月新闻稿中与出货里程碑一并披露的“自
              2025 年 4 月以来融资 $150M”，该数字早于 $3B Series B+
              估值，也必然低估后者隐含的资本规模。已审阅来源没有披露任何二级转让、债务或授信安排。还需要注意的是，BusinessWorld、Straits Times、Yahoo Finance 和 The Standard
              都佐证了 $3B / $6B 估值数字，但四者似乎都追溯到同一篇 Reuters 通讯稿加公司自有声明；因此佐证的分发面很广，原始报道链条却很窄。
