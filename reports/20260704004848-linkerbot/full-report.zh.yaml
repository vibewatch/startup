      - number: '3.4'
        title: 切换成本、锁定、分销权力和护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              一旦机器人集成商围绕某个供应商的手部工程化了控制栈、安装结构、线束和操作技能数据，切换成本很可能不低；这会为被设计进某一机器人平台的供应商创造真实但尚未量化的锁定。分销权力则更多掌握在全栈人形机器人厂商（Unitree、AgiBot、Figure
              AI、UBTech）手中，因为它们控制终端客户关系；Linkerbot 这样的独立手部供应商，要么被设计进别人的机器人，要么直接卖给研究 / 工业账户，分销位置结构性弱于集成商本身。Linkerbot
              自称的护城河基于生产规模和成本领先——80%+ 自称份额、低于 $1,000 的定价、1,000+ 台 / 月的量产下限——而非单一技术突破；Shadow Robot 已在原始 DoF
              上保持更高技术标杆，只是成本高得多。这个规模型护城河面临两个具体威胁：商品化风险，AgiBot 和 Zhaowei 以相近或更低价位进入已说明这一点；以及围绕自报规模主张的可信度风险，Humanoids
              Daily 报道的 Unitree 与 AgiBot 关于全球出货领先权公开争议就是例证。中国国家发展和改革委员会 2026 年警示国内已有 150
              多家人形机器人公司，这是另一个行业层面的负面信号：产能过剩或整合可能压缩整个竞争集合的利润率和估值，Linkerbot 也在其中。已审阅来源没有记录 Linkerbot
              对任何具名对手的具体赢单或败单，因此这里的护城河耐久性很大程度上来自推断，而非直接证据。
