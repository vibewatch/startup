        title: 留存、韧性、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              留存和关系韧性方面，公开记录为空：已审阅来源没有披露 Linkerbot
              的净收入留存、总收入留存、流失率、续约率、合同期限或任何客户满意度指标，也没有来源记录任何具名账户的复购行为。因此，订单量上升不能归因于新客增长、复购 /
              扩张订单，或两者混合。扩张和集中度方面，没有来源披露最大客户或前五大客户收入占比，也没有披露独立客户 / logo 总数，导致集中度风险无法按总账户基础占比评估，只能看绝对的具名客户。基于 Linkerbot
              披露的直销与展会获客动作，渠道 / 伙伴依赖似乎有限；不过两个国际 B2B 贸易目录条目——HKTDC 供应商店铺和 Hannover Messe 参展商页面——截至报告日均返回
              not-found，对可能通过这些渠道发现 Linkerbot 的国际买家构成轻微采购摩擦信号。行业层面，中国国家发改委 2026 年对 150
              多家国内人形机器人公司的警示是负面信号：竞争场越来越拥挤，可能带来客户切换压力，而 Linkerbot 当前稀薄的留存和集中度披露无法评估这种压力。整体看，客户证据画像是一边有可信、由多来源交叉印证的具名客户
              logo，另一边几乎没有留存、集中度、满意度和结果级证据——更像一家早期爬坡的硬件公司，而不是成熟企业供应商。
