              遥操作系统——但已审阅来源没有披露它们是否产生独立于硬件销售的许可、订阅或数据访问收入；本报告把它记录为开放问题，而不是默认它已经是实际收入线或只是营销包装。定价方面，独立行业跟踪方把 O6
