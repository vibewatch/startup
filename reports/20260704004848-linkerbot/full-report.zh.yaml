        blocks:
          - type: paragraph
            body: >-
              运营风险上，最实质缺口在于 Linkerbot 披露的产能野心——从约 5,000 台 / 月爬坡到目标 10,000 台 / 月，另有报道称 2026 全年交付目标为 50,000-100,000
              台——与完全缺失的制造产能或资本开支计划之间的落差。没有任何产品披露现场可靠性数据（缺陷率、MTBF）、召回历史或网络安全实践；公司的软件栈还绑定特定 OS / 框架（Ubuntu 22.04、ROS
              Humble），如果这一组合落后于更新工具，就会变成运营风险。一个行业跟踪方认为，随着独立手部产品进入者（AgiBot、Zhaowei）用价格竞争，该品类正走向商品化，这会压缩 Linkerbot 以成本 /
              规模为基础的护城河；同时，Unitree 与 AgiBot 围绕出货领先说法的公开争议，也暴露了可信度风险，同样适用于 Linkerbot 自己未经审计的 80%+ 份额说法。伙伴和依赖风险上，Linkerbot
              的资本基础集中在少数大型、部分带国资背景的机构投资者（Ant Group、HongShan Group、Zhongguancun Science Park Fund、Bank of China Asset
              Management、Fosun Capital），另有一个披露的公开市场战略持有人（Dongfang Precision，约
              4.36%）；这一小圈子里任何投资者情绪变化，都可能实质影响未来融资。客户集中度无法量化，因为总客户数未披露，公开识别的具名账户也只有少数。两个国际贸易目录条目（HKTDC、Hannover
              Messe）目前找不到，是轻微渠道依赖缺口；更广泛的半导体供应链则暴露在升级中的美国出口管制政策下。
