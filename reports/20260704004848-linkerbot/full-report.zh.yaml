        title: 封面指标：规模、市场份额、客户和披露缺口
        blocks:
          - type: paragraph
            body: >-
              Linkerbot 最常被引用的封面指标，是其声称在高自由度机器人手全球市场的份额：公司称自己占有 80% 以上份额，并且是唯一一家每月量产超过 1,000
              只高自由度灵巧手的制造商；这一说法同时出现在公司新闻稿和 Reuters 来源报道中。独立行业跟踪方 TechBuzz China 与中文市场分析 Gongboshi Robot 都把 Linkerbot
              描述为截至 2026 年上半年拥有 80%+ 份额的品类领导者，在公司自述之外提供了部分第三方佐证，但两者都没有披露底层方法论。产能方面，Linkerbot 在 2026 年 5 月称其正把月产量从接近
              5,000 台提升到“很快”达到计划中的 10,000 台；此前公司已披露截至 2025 年 12 月累计出货超过 10,000 只手，单月最高超过 4,000 台。已披露的具名客户仅限工业 / 生产用途的
              Samsung Electronics 和 Siemens，以及被描述为包括 Stanford 和 MIT
              在内的科研用途；没有来源给出合同金额、按客户拆分的台数或续约信息。本章审阅的所有来源均未披露收入、ARR、毛利率和员工人数，Linkerbot 的 HKTDC
              国际采购店铺页面还返回“页面未找到”，这是一个小但具体的渠道可见性缺口。另一个需要单列的背景信号是，中国国家发展和改革委员会在 2026 年公开指出中国已有 150
              多家人形机器人公司，并警示过度产品重复和投机泡沫；这是行业层面的负面信号，关系到外界应如何解读单家公司激进的估值轨迹。
