            body: >-
              Unitree 在 2026 年 3 月 IPO 招股书中披露了三档自研灵巧手：20-DoF Dex5-1、7-DoF Dex3-1 和 Dex1-1 夹爪；在 2025 年中 Series C 后估值约
              $1.6B，之后在人形机器人销售开始超过传统四足机器人业务时提交 IPO，报道称拟募资最高 $580M。AgiBot 已开始独立销售 OmniHand 系列，一款 10-DoF 型号定价约
              $1,350，直接打破过去只把手部与整机捆绑销售的做法。Shadow Robot 仍是公认技术标杆，具备 24 DoF 和 100+ 个传感器，但单手价格超过
              $140,000，量产已停滞——说明原始技术领先没有转化为规模。Zhaowei Mechatronics 从零部件制造背景切入，提供 DM17（17 个主动 DoF）和 LM06（150N
              抓握力）产品线。在全栈西方竞争者中，Figure AI 资本领先，Series C 融资超过 $1B 后投后估值 $39B，高于 Apptronik（融资 $520M、估值 $5B）和融资规模更小的 1X
              Technologies（$100M Series B）。中国具身 AI 竞争者 X Square Robot 连续四轮融资后估值超过 $2.8B，但明确瞄准家庭 / 消费操作任务，而非 Linkerbot
              所称的工业 / 工匠式重点，因此直接重叠较小。UBTech 的 Walker S2 人形机器人已开始量产，披露订单超过 8 亿元；Galbot（融资 RMB 2.5B）和 Robotera（融资超过
              $200M）也显示，新资本仍在进入 Linkerbot 灵巧手最终服务或竞争的更广泛中国人形机器人生态。
