    rows:
      - - 论点：Linkerbot 领先一个高速增长、成本快速下探且机构背书强的品类
        - 独立市场份额 / 出货量审计若确认 80%+ 说法，将大幅强化论点
      - - 论点：出货量增长已有佐证（已出货 10,000+，向 10,000/月爬坡），显示真实商业牵引力
        - 若披露的收入 / ARR 数据与出货增长匹配，将确认商业牵引力，而不只是产能牵引力
      - - 反论点：市场份额和出货量说法由公司自定义且未经审计，同业争议（Unitree vs. AgiBot）显示可信度问题已是全行业现实风险
        - 独立审计若推翻 80%+ 说法，将确认反论点
      - - 反论点：未披露财务报表、毛利率或现金头寸
        - 取得管理账目，或未来 IPO 招股书（如 Unitree）披露，可解决这一问题
      - - 反论点：中国 NDRC 已警告 150+ 家国内人形机器人公司存在全行业产能过剩和泡沫风险
        - NDRC 若出台收紧行业的具体政策动作（而不只是表态），将确认反论点；若继续不受约束地增长，则会削弱它
    notes: 论点和反论点直接来自本章及前文已审阅证据；没有进一步尽调前，不预设哪一方占优。
