      - number: '5.2'
        title: 架构和运行模式
        blocks:
          - type: paragraph
            body: >-
              Linkerbot 的手部在一个产品家族内覆盖三种驱动架构——直驱、连杆和腱驱动；独立行业跟踪方指出，相较多数单架构对手，这种技术路线覆盖异常宽。公司材料称工业级 L20 使用自有 ‘Super Electric
              Cylinder’，可提供 90% 驱动效率、200N 丝杆端推力，并经过超过 100 万次循环寿命测试；多模态 “sensing skin” 触觉层也在整个手部家族中营销。硬件层之上，是托管在
              linker-bot 组织 GitHub 下的开源 ROS/ROS2 SDK、URDF 模型和模拟器（linker-sim）——这些是真正可观察的开发者工具，不是营销说法。相比之下，没有按名称找到 ‘Open
              TeleDex’ 或 ‘LinkerSkillNet’ 的 GitHub
              仓库或技术文档；它们是公司最常营销的两个高层平台名，最接近的仓库只是一个通用遥操作臂工具。这说明这些产品名可能覆盖更窄命名的底层代码，也可能尚未开源。公司没有发布一张图，把硬件、固件、开源 SDK
              层和这两个专有平台层连起来；因此，本章架构只能从分散披露中拼出。
