  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：同类厂商、老牌厂商、相邻玩家和替代品
        blocks:
          - type: paragraph
            body: >-
              Linkerbot 的竞争集合横跨三类。第一类是与 Linkerbot 一样把灵巧手作为独立产品销售的直接灵巧手专家：Inspire Robots（因时机器人）、Shadow
              Robot（英国），以及已进入该品类的零部件制造商 Zhaowei
              Mechatronics。第二类，也可能是战略上更重要的一类，是自研并制造手部、而不是向独立供应商采购的全栈人形机器人厂商——Unitree、AgiBot、Fourier Intelligence、UBTech
              和 Tesla 都在其中。它们既可能成为潜在客户（如果未来选择采购而非自研），也会构成永久竞争威胁（因为它们可能出售富余手部产能，或像 AgiBot
              已开始做的那样拆出手部业务）。第三类是非中国人形机器人厂商——Figure AI、Apptronik 和 1X
              Technologies——目前在内部自研手部，但也是未来美国政策行动最可能重塑全球采购模式的客群。专用灵巧手之外，任何不需要完整类人灵巧度的买家，其现状替代方案是简单平行夹爪（如 RightHand
              Robotics 等老牌厂商所售），或继续依靠人工。低成本、实验室导向的相邻产品——Wonik Robotics 的 Allegro Hand 和开源 LEAP
              Hand——服务研究买家而非工业客户，不太可能直接替代 Linkerbot 的工业客户基础。
