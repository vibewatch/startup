chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部和商业模式
        blocks:
          - type: paragraph
            body: >-
              Linkerbot 是一家总部位于北京海淀区的机器人硬件公司，为人形机器人、工业自动化和科研场景设计并量产高自由度（DoF）灵巧机器人手。公开报道将公司成立时间放在 2023 年；这与 2026 年 5 月
              Reuters 来源报道把 Linkerbot 称为一家“成立两年的独角兽”的说法一致。核心产品是 Linker Hand 系列，覆盖直驱、连杆和腱驱动架构，约 6–42 个自由度，并由 CES 2026 展示的
              ‘Linker Craftsman’ 工作站补充。公司自有站点地图至少列出 13 个不同产品页面（型号 L6、L10、L20、L20G、L30、L30Z、O6、O7、D、J、R、W 和
              YCB），说明产品线分层且宽，而不是押注单一旗舰 SKU。Linkerbot 的商业模式以硬件为先：它制造并销售灵巧末端执行器给人形机器人集成商、工业买家和研究机构，再在硬件之上叠加软件 /
              数据生态（LinkerSkillNet、Open TeleDex），而不是自己造整机机器人销售。截至 2026 年 5 月，公司阶段最适合描述为一家刚完成 ‘Series B+’
              的大型、未上市、风投资本支持的硬件独角兽；公司未公开上市，也未披露 IPO 时间表。
