  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义、工作流和模块图谱
        blocks:
          - type: paragraph
            body: >-
              从客户工作流看，Linkerbot 的产品是灵巧机器人手末端执行器：集成商把它安装到机器人臂或人形机器人平台上，再通过 ROS 或 ROS2 驱动栈和 Python/C++ SDK
              控制；它不是客户直接购买的完整机器人。已记录的集成流程——在 Ubuntu 22.04、ROS Humble 和 Python 3.10+ 环境安装 SDK，通过 setting.yaml 文件配置手部参数，再用
              ROS topics 或 LinkerHandApi Python 类驱动手部——可以在 Linkerbot 自己托管于 GitHub 的 SDK 仓库中直接看到。公司官方站点地图至少列出 13
              个不同产品页面（L6、L10、L20、L20G、L30、L30Z、O6、O7、D、J、R、W、YCB），但 ROS2 SDK 自己的 README
              记录的硬件支持清单不同且只部分重叠（O6、L6、L7、O7、L10、L20、G20、L21）；本报告把这视为命名和覆盖范围不一致，而不是将其默认抹平。公司材料披露的旗舰规格包括：L30 面向精密装配工作约
              ±0.2mm 重复精度；O6 重 370g、抓握载荷 50kg，归因于 PEEK 工程聚合物和自研微型减速器。
            claimRefs:
