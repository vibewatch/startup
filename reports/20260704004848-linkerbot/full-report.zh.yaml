            body: >-
              人员和执行风险集中在唯一公开具名高管身上：2026 年通讯社报道称其为「CEO Alex Zhou」，2025 年报道称其为「Founder and CTO Zhou
              Yong」，后续独立来源把两个名字指向同一人（「Alex Zhou Yong」）；但没有披露董事会、副手或接班计划。以数十亿美元估值看，这是实质治理缺口。公司据报计划在 2026
              年底前把研究团队翻倍，同时又设下激进产量增长目标；如果招聘和质量控制能力不能同步扩张，就会产生执行风险，尽管目前没有披露基准人数可供对照。财务 /
              模型风险方面，没有来源披露现金、烧钱速度或资金可支撑期限；2026 年 2 月约人民币 15 亿元的 Series B 轮，与 2026 年 5 月约 $3B 的「Series
              B+」估值没有在任何已审阅来源中被勾稽，稀释和资本效率风险不清楚；没有来源确认当前定价（如约 $920 的 O6 型号）是否支撑可持续毛利。可监控的终止标准 /
              论点失效触发项包括：已生效美国采购禁令明确覆盖嵌入式组件；任何确认的产品召回或安全事故；降估值融资、估值下调，或确认未达 2026 年产量目标；唯一具名高管离职且没有继任者；任何独立审计实质性推翻
              Linkerbot 的 80%+ 市占率说法。整体看，本章风险画像同时包含印证较充分的行业监管和过剩风险，以及几乎完全缺失的公司层面缓释、认证、保险或应急披露。
