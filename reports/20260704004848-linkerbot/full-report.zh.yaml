            body: >-
              考虑到增长叙事强，但经审计财务或独立验证证据几乎完全缺位，给出「继续研究」建议、中等置信度、高风险评级和「偏高」估值立场，比直接买入或回避更站得住；没有来源支持具体目标回报、持有期或退出倍数，因为任何特定投资者的进入价格、股权类别或清算优先权条款都未披露。当前融资背景方面，Linkerbot
              在 2026 年 4 月底 / 5 月初左右完成「Series B+」轮，估值约 $3B，并披露下一轮目标约 $6B，但未披露时间或工具。2026 年 2 月约人民币 15 亿元（约 $210M）的 Series
              B 轮，与约三个月后达到的 $3B 估值，在任何已审阅来源中都没有勾稽，因此该窗口的入场价格纪律难以独立评估。关于实际股权结构，最具体、准独立的证据，是上市公司 Dongfang Precision
              通过自身投资者关系披露确认的约 4.36% 直接持股——这是一个真正有用的锚点，但远不足以看清完整股权结构表。整体看，公开证据在方向上符合投资者需求仍在延续的判断，但不能独立确认已披露 $3B 或目标 $6B
