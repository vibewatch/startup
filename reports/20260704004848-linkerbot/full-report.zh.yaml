              Kong——资金来自科研经费和实验室预算，而不是直接商业采购；其价值更多在声誉和管线，而非直接收入。人形机器人集成商构成隐含的第三类买家（因为 Linkerbot
              的手部产品设计用于安装在机器人平台上），但已审阅来源没有点名任何集成商是 Linkerbot 的直接客户。除上述账户外，没有来源披露地理分布、公司规模 /
              收入段分层，或按细分市场拆出的完整客户数量。因此，分层分析只能锚定少数具名 logo，而不是完整账户地图。
