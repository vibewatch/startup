company:
  name: Linkerbot
chapter:
  number: 3
  title: Competitors
  summary: Linkerbot's competitive set spans direct dexterous-hand specialists (Inspire Robots, Shadow Robot, Zhaowei Mechatronics), full-stack humanoid-robot makers that build hands in-house and could become direct rivals (Unitree, AgiBot, Fourier Intelligence, UBTech, Tesla), and non-China humanoid makers (Figure AI, Apptronik, 1X Technologies). Linkerbot's disclosed ~$920 O6 price undercuts AgiBot's ~$1,350 standalone hand and sits far below Shadow Robot's >$140,000 technical-benchmark hand, positioning its moat around manufacturing scale and cost rather than raw DoF leadership. That moat faces real commoditization risk (AgiBot and Zhaowei entering standalone sales) and a credibility risk shared across the sector, illustrated by a public Unitree-AgiBot dispute over shipment-leadership claims and China's NDRC warning of sector-wide overcapacity.
sections:
- id: competitive-landscape
  title: 'Competitive landscape: peers, incumbents, adjacents, and substitutes'
  body: 'Linkerbot''s competitive set spans three distinct categories. The first is direct dexterous-hand specialists that, like Linkerbot, sell hands as a standalone product: Inspire Robots (因时机器人), Shadow Robot (UK), and Zhaowei Mechatronics, a components manufacturer that has entered the category. The second, and arguably the more strategically important category, is full-stack humanoid-robot makers that design and manufacture their own hands rather than buying from an independent supplier — Unitree, AgiBot, Fourier Intelligence, UBTech, and Tesla all fall here, and each represents both a potential customer (if they ever chose to buy rather than build) and a permanent competitive threat (since they could sell excess hand capacity or spin out a hand business, as AgiBot has begun to do). The third category is non-China humanoid-robot makers — Figure AI, Apptronik, and 1X Technologies — that build their own hands in-house for now but represent the segment most exposed to future US policy actions that could reshape global sourcing patterns. Beyond dedicated dexterous hands, the status-quo substitute for any buyer that does not need full human-like dexterity is a simple parallel-jaw gripper (as sold by incumbents like RightHand Robotics), or simply continuing to rely on human manual labor. Lower-cost, lab-oriented adjacent products — Wonik Robotics'' Allegro Hand and the open-source LEAP Hand — serve research buyers rather than industrial ones and are unlikely to directly displace Linkerbot''s industrial customer base.'
