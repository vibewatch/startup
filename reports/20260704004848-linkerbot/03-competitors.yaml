- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - 80%+ share of the 'global high-DoF dexterous hand market'
    - Self-defined category with no independent audit; Unitree-AgiBot shipment dispute shows peers contest similar claims
    - material
    - Commission independent shipment/market-share audit before relying on this figure for valuation
  - - Cost/scale leadership (sub-$1,000 pricing, 1,000+ units/month)
    - AgiBot and Zhaowei entering standalone hand sales at similar or lower price points could commoditize the category
    - material
    - Track competitor price moves quarterly; assess Linkerbot's cost-curve trajectory versus rivals
  - - Broad product line (13+ SKUs, 6-42 DoF)
    - Full-stack integrators (Unitree, AgiBot, Fourier, UBTech) building hands in-house reduces the addressable buyer pool over time
    - material
    - Monitor whether major integrators continue to buy third-party hands or shift fully in-house
  - - Software/platform layer (LinkerSkillNet, Open TeleDex)
    - No disclosed adoption metrics for the software layer independent of hardware sales; could be marketing rather than a durable data moat
    - minor
    - Request usage/adoption data for the software platform separate from hardware unit sales
  - - Sector-wide overcapacity risk (NDRC warning, 150+ China humanoid-robot companies)
    - Broad industry consolidation or funding pullback could compress margins/valuations across all competitors including Linkerbot
    - material
    - Monitor NDRC/policy signals and competitor failure or consolidation events
  notes: Severity is qualitative and based on the weight of evidence reviewed, not a quantified risk model.
