  title: The most dangerous competitors may never buy Linkerbot's hands
  body: Unitree, AgiBot, Fourier Intelligence, UBTech, and Tesla all build their own dexterous hands in-house; AgiBot has already begun selling a standalone hand at a lower price point than some of Linkerbot's tiers, showing that today's potential customer can become tomorrow's direct competitor.
