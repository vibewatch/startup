- id: pricing-gtm-comparison
  title: Pricing, GTM, and trust/regulatory comparisons
  body: On disclosed pricing, Linkerbot's O6 model at roughly $920 undercuts AgiBot's standalone 10-DoF hand (~$1,350) and sits far below Shadow Robot's technical-benchmark hand (>$140,000) and generic overseas comparables cited at $150,000-$220,000 by an industry tracker. Unitree, Fourier Intelligence, and UBTech disclose no standalone hand pricing at all, because each bundles its hand exclusively into a complete humanoid-robot sale — meaning direct like-for-like price comparison is only possible against AgiBot and Shadow Robot among the named full-stack/technical-benchmark peers. On go-to-market, Linkerbot's disclosed channel is direct international press and trade-show visibility (CES 2026, PR Newswire distribution) combined with direct sales to named industrial and research accounts; no reviewed source discloses a formal reseller or distributor network, in contrast to full-stack makers that reach end customers through their own robot sales organizations. On trust and regulatory posture, no reviewed source discloses formal safety or quality certifications specific to any named competitor's dexterous-hand product — including Linkerbot's own — beyond the sector-wide existence of ISO industrial-robot safety standards discussed in the Market Analysis chapter, leaving certification status as an open diligence item across the entire competitive set rather than a Linkerbot-specific weakness.
  claimRefs:
  - CP017
  - CP018
  - CP019
  - CP020
  - CP030
