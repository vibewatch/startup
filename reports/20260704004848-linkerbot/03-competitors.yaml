- id: competitor-profiles
  title: 'Competitor profiles: scale, funding, and strategic direction'
  body: Unitree disclosed three tiers of self-developed dexterous hands in its March 2026 IPO prospectus — the 20-DoF Dex5-1, the 7-DoF Dex3-1, and the Dex1-1 gripper — and was valued at roughly $1.6 billion after a mid-2025 Series C round before later filing for an IPO reported at up to $580 million in proceeds as humanoid-robot sales began to surpass its legacy quadruped-robot business. AgiBot has begun selling its OmniHand series standalone, pricing a 10-DoF model at roughly $1,350, directly undercutting the historical practice of bundling hands only with complete robots. Shadow Robot remains the acknowledged technical benchmark at 24 DoF and 100+ sensors, but at more than $140,000 per hand its volume production has stalled — illustrating that raw technical leadership has not translated into scale. Zhaowei Mechatronics, entering from a components-manufacturing background, offers the DM17 (17 active DoF) and LM06 (150N grip) product lines. Among full-stack Western competitors, Figure AI leads on capital with a $39 billion post-money valuation after raising more than $1 billion in its Series C, ahead of Apptronik ($520 million raised at a $5 billion valuation) and the more modestly funded 1X Technologies ($100 million Series B). X Square Robot, a China-based embodied-AI competitor, surpassed a $2.8 billion valuation across four consecutive rounds but is explicitly targeting household/consumer manipulation tasks rather than Linkerbot's stated industrial/craftsmanship focus, reducing direct overlap. UBTech's Walker S2 humanoid began mass production with disclosed orders exceeding 800 million yuan, and Galbot (RMB 2.5 billion raised) and Robotera (over $200 million raised) show that fresh capital keeps entering the broader Chinese humanoid-robotics ecosystem that Linkerbot's hands ultimately serve or compete with.
