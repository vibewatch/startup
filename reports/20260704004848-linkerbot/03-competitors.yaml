- id: switching-lockin-moat
  title: Switching cost, lock-in, distribution power, and moat durability
  body: 'Once a robot integrator has engineered its control stack, mounting, wiring harness, and manipulation-skill data around one supplier''s hand, switching cost is likely non-trivial — creating a real, if unquantified, form of lock-in for whichever supplier is designed into a given robot platform. Distribution power sits disproportionately with the full-stack humanoid-robot makers (Unitree, AgiBot, Figure AI, UBTech), because they control the end-customer relationship; an independent hand supplier like Linkerbot depends on being designed into someone else''s robot or selling direct to research/industrial accounts, a structurally weaker distribution position than the integrators themselves hold. Linkerbot''s own moat claim rests on production scale and cost leadership — 80%+ claimed share, sub-$1,000 pricing, and a 1,000+ units/month production floor — rather than a single technical breakthrough, since Shadow Robot already holds a higher raw-DoF technical benchmark at far higher cost. That scale-based moat faces two concrete threats: commoditization risk, illustrated by AgiBot''s and Zhaowei''s entry at similar or lower price points, and a credibility risk around self-reported scale claims generally, illustrated by Humanoids Daily''s report of a public dispute between Unitree and AgiBot over global shipment-leadership claims. China''s National Development and Reform Commission''s 2026 warning that more than 150 humanoid-robot companies now exist domestically is a further sector-wide adverse signal that overcapacity or consolidation could compress margins and valuations across the entire competitive set, Linkerbot included. No reviewed source documents a specific competitive win or loss for Linkerbot against any named rival, so moat durability here is substantially inferred rather than directly evidenced.'
