- calloutType: insight
  title: Linkerbot competes on scale/cost, not raw technical leadership
  body: Shadow Robot's 24-DoF hand remains the acknowledged technical benchmark, but at over $140,000 per unit its production has stalled — Linkerbot's moat is closer to a manufacturing-scale and cost-curve advantage than a pure technology lead.
  claimRefs:
  - CP007
  - CP024
- calloutType: risk
  title: Self-reported scale claims across the sector are contested
  body: A public dispute between Unitree and AgiBot over global humanoid-shipment leadership, reported by Humanoids Daily, is a reminder that Linkerbot's own 80%+ market-share claim has not been independently audited and should be treated with the same caution applied to rivals' claims.
