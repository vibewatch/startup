  claims:
  - id: CP001
    statement: The competitive landscape for Linkerbot spans direct dexterous-hand specialists (Inspire Robots, Shadow Robot, Zhaowei Mechatronics), full-stack humanoid-robot makers that build their own hands (Unitree, AgiBot, Fourier Intelligence, UBTech, Tesla), and non-China humanoid-robot makers building in-house hands (Figure AI, Apptronik, 1X Technologies).
    type: inferred
    topic: landscape
    sourceRefs:
    - SP001
    - SP003
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP001
  - id: CP002
    statement: Status-quo substitutes for buyers that do not need full human-like dexterity include simple parallel-jaw grippers (e.g., RightHand Robotics) and continued manual human labor.
    type: third-party-reported
    topic: substitutes
    sourceRefs:
    - SP022
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP002
  - id: CP003
    statement: Research-oriented dexterous hands such as Wonik Robotics' Allegro Hand and the open-source LEAP Hand represent a lower-cost, lab-oriented adjacent category rather than mass-production industrial competitors.
    type: third-party-reported
    topic: adjacent
    sourceRefs:
    - SP023
    - SP024
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP003
  - id: CP004
    statement: 'The most credible internal-build threat comes from humanoid-robot integrators themselves: AgiBot, Unitree, Fourier Intelligence, and UBTech all design and manufacture their own hands rather than buying from independent suppliers like Linkerbot.'
    type: inferred
    topic: landscape
    sourceRefs:
    - SP005
    - SP008
    - SP010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP004
  - id: CP005
    statement: 'Unitree disclosed three tiers of self-developed dexterous hands in its March 2026 IPO prospectus: the five-finger Dex5-1 (20 DoF, 94 tactile sensors, 4.5kg payload, ±1mm precision, 1kg weight), the three-finger Dex3-1 (7 DoF, 33 sensors), and the Dex1-1 gripper (120N grip force, 20kg payload).'
    type: third-party-reported
    topic: competitor-profile
    sourceRefs:
    - SP001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP005
  - id: CP006
    statement: Unitree was valued at approximately $1.6 billion after a Series C round reported in July 2025 and later filed for an IPO reported at up to $580 million in proceeds as humanoid-robot sales began to surpass its legacy quadruped-robot business.
    type: third-party-reported
    topic: competitor-profile
    sourceRefs:
    - SP006
    - SP007
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP006
  - id: CP007
    statement: Shadow Robot's dexterous hand is described as the acknowledged technical benchmark at 24 DoF and 100+ sensors, but at over $140,000 per hand its volume production has stalled, illustrating a high-end technology leader that cannot compete on Linkerbot's cost/scale axis.
    type: third-party-reported
    topic: competitor-profile
    sourceRefs:
    - SP001
    - SP026
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP007
  - id: CP008
    statement: AgiBot began direct standalone sales of its OmniHand series, pricing a 10-degree-of-freedom model at RMB 9,800 (about US$1,350), breaking from the industry norm of bundling hands only with complete humanoid robots.
    type: third-party-reported
    topic: competitor-profile
    sourceRefs:
    - SP002
    - SP012
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP008
  - id: CP009
    statement: 'Zhaowei Mechatronics offers at least two dexterous-hand product lines: the DM17 (linear-motor direct drive, 17 active DoF, 5-12N fingertip force) and the LM06 (linkage transmission, 6 active/16 total DoF, 150N grip force), entering the category from a component-manufacturing background.'
    type: third-party-reported
    topic: competitor-profile
    sourceRefs:
    - SP001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP009
  - id: CP010
    statement: Tesla's Optimus Gen3 hand is estimated (via teardown-based analyst reads) at 17 active plus 5 passive DoF with 22 Hall position sensors, six-axis force sensing, and 94 tactile contact points, and Elon Musk has stated hand R&D represents roughly half of Optimus's total engineering effort, with a target cost of $20,000-$25,000 per robot at 1 million annual production.
    type: third-party-reported
    topic: competitor-profile
    sourceRefs:
    - SP001
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP010
  - id: CP011
    statement: Figure AI, a US humanoid-robot maker that designs its own hands, raised more than $1 billion in a Series C round at a $39 billion post-money valuation.
    type: company-claimed
    topic: competitor-profile
    sourceRefs:
    - SP013
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP011
  - id: CP012
    statement: Apptronik, another US humanoid-robot maker, raised $520 million at a $5 billion valuation, explicitly positioning itself to reach market ahead of Tesla.
    type: third-party-reported
    topic: competitor-profile
    sourceRefs:
    - SP014
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP012
  - id: CP013
    statement: 1X Technologies raised $100 million in a Series B round, a smaller capital base than the largest China- and Figure-AI-scale competitors, indicating a more fragmented funding tier among Western humanoid-robot makers.
    type: company-claimed
    topic: competitor-profile
    sourceRefs:
    - SP015
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP013
  - id: CP014
    statement: X Square Robot, a Chinese embodied-AI competitor, completed four consecutive financing rounds and surpassed a US$2.8 billion valuation while explicitly targeting household/consumer manipulation tasks rather than Linkerbot's stated focus on high-value craftsmanship skills.
    type: company-claimed
    topic: competitor-profile
    sourceRefs:
    - SP016
    - SP017
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP014
  - id: CP015
    statement: UBTech's Walker S2 humanoid robot began mass production and delivery with disclosed orders exceeding 800 million yuan, indicating a full-stack competitor with meaningful commercial order backlog of its own.
    type: company-claimed
    topic: competitor-profile
    sourceRefs:
    - SP011
    - SP010
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP015
  - id: CP016
    statement: Galbot raised RMB 2.5 billion in March 2026 and Robotera raised over US$200 million in May 2026, both signaling continued heavy capital inflow into China-based humanoid-robot and embodied-AI makers that could eventually build or buy dexterous hands at scale.
    type: third-party-reported
    topic: competitor-profile
    sourceRefs:
    - SP019
    - SP021
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP016
  - id: CP017
    statement: On pricing, Linkerbot's own O6 model is reported at approximately ¥6,666 (about $920), positioned below AgiBot's ¥9,800 (~$1,350) 10-DoF OmniHand and far below Shadow Robot's >¥1,000,000 (~$140,000) benchmark hand and generic overseas comparables at ¥1.1M-1.6M ($150K-$220K).
    type: third-party-reported
    topic: pricing
    sourceRefs:
    - SP001
    - SP002
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP017
  - id: CP018
    statement: No reviewed source discloses standardized list pricing for Unitree's, Fourier's, or UBTech's dexterous hands sold as standalone components, because these companies bundle hands into complete humanoid-robot sales rather than pricing them separately.
    type: open-question
    topic: pricing
    sourceRefs:
    - SP005
    - SP008
    - SP010
    confidence: low
    freshness: unknown
    answersQuestionRefs:
    - QP018
  - id: CP019
    statement: Linkerbot's disclosed go-to-market channel is direct international press/trade-show visibility (CES 2026, PR Newswire) plus direct sales to named industrial and research accounts, rather than a disclosed reseller or distributor network.
    type: inferred
    topic: gtm
    sourceRefs:
    - SP030
    confidence: medium
    freshness: current
    answersQuestionRefs:
    - QP019
  - id: CP020
    statement: No reviewed source discloses formal regulatory or safety certifications held by Linkerbot, Inspire Robots, AgiBot, or Zhaowei specific to their dexterous-hand products, unlike the broader ISO industrial-robot safety standards referenced at the sector level.
    type: open-question
    topic: trust-regulatory
    sourceRefs: []
    confidence: low
    freshness: unknown
    answersQuestionRefs:
    - QP020
  - id: CP021
    statement: Switching cost for a robot integrator that has already engineered its control stack around one supplier's hand (mounting, wiring harness, control API, and manipulation-skill data) is likely to be non-trivial, creating some lock-in once a hand is designed into a robot platform.
    type: inferred
    topic: switching-cost
    sourceRefs:
    - SP001
    confidence: medium
    freshness: current
    answersQuestionRefs:
