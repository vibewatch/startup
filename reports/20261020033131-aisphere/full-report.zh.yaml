      - 哪些事实会改变判断
    rows:
      - - 正方
        - 报告的消费者触达规模大
        - 用户超过 100 million，月活跃用户达 16 million
        - 经审计的活跃用户定义和付费转化
      - - 正方
        - 独立分发信号
        - PixVerse 进入 a16z 核心移动应用排名
        - 持续排名和队列留存
      - - 正方
        - 资本获取能力
        - 截至 2026 年 7 月，据报道 C 轮融资为 CNY2.98 billion
        - 清晰的股权结构表和与投资者利益一致的条款
      - - 反方
        - 经济性仍不透明
        - 已报告 ARR，但没有毛利率、NRR 或贡献利润率
        - 经审计的收入桥接表和单位经济性
      - - 反方
        - 资本密集度可能仍然很高
        - 资金用途强调研发、算力、人才和扩张
        - 推理成本下降和贡献利润率转正
      - - 反方
        - 合规可能中断分发
        - 中国规则要求治理、标签和备案控制
        - 已核验的控制措施、申报文件和事件响应证据
