      - number: '2.3'
        title: 买方、用户与预算归属
        blocks:
          - type: paragraph
            body: >-
              AIsphere
              的漏斗覆盖多类经济参与者。休闲创作者在免费增值模式下既是用户也是付费方；当更强的控制力和更快的迭代值得这笔支出时，专业消费者和小型创意团队可能购买点数或订阅。在企业工作流中，创意或产品团队使用模型，但采购预算可能来自营销、媒体制作或技术部门；公开证据确认有开放平台和合作伙伴集成，却没有披露合同规模或转化率。游戏和短剧工作室是另一类相邻买方，可能被实时场景延展吸引，但客户询问不等于生产采用。这种组合带来广泛的分发潜力，同时也让付费方集中度和企业销售效率悬而未决。
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM011
              - CM012
              - CM015
      - number: '2.4'
        title: 采用驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              采用由更可靠的短片生成、更强的控制力、更快的生成速度，以及降低制作摩擦的消费者界面驱动。2025 年 3 月的一份行业榜单显示，多个 AI 视频产品进入领先的 AI 原生 Web
              应用之列，既印证品类需求，也说明专业供应商较为分散。同一证据提醒，使用量排名与移动订阅收入排名仅部分重合，因此受众规模不能证明变现质量。监管也是约束：中国 AI
              内容标识规则要求展示可见标识，并禁止篡改或隐匿，增加了实施和分发义务。最后，持续为研发和算力融资既说明战略关注，也说明资本密集度。因此，估值应看经审计的付费转化、留存
              ARR、毛利率和算力效率，而不是只看用户数或融资规模。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: 展示
        blocks:
          - type: callout
            title: 触达规模不等于可服务收入
            body: 公开记录没有把注册用户桥接到付费账户、留存 cohort、毛利率或经算力调整的贡献。消费 AI 研究还显示，使用量领先者与移动订阅收入领先者仅部分重合。
            calloutType: risk
            claimRefs:
              - CM009
              - CM015
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代集合
        blocks:
          - type: paragraph
            body: >-
              当前最有力的第三方 mapping 将 PixVerse 归入视频生成和交互式视听世界模型，Runway、Luma AI 和 Kling AI 是其明确的竞争背景。另有报道将 ByteDance 的
              Seedance 2.0 列为竞品。AIsphere 联合创始人称 Seedance 影响有限，因为 PixVerse 面向全球市场，而 Seedance 主要聚焦中国；这是 Yicai
              转述的管理层定位，不是独立性能基准。因此，实际替代集合不止直接模型供应商：买方可以使用成熟平台、把 API 接入内部工作流，或暂缓采用。指定证据池对 PixVerse
              的记录远多于这些替代品，所以可以支持其品类归属，但不能排出赢家名次。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP012
      - number: '3.2'
        title: 能力位置与产品面广度
        blocks:
          - type: paragraph
            body: >-
              PixVerse 可见的产品广度是最明确的竞争资产。当前 mapping 覆盖 PixVerse、API、Game Engine、Growth Studio，以及 V6 和 R2
              模型系列。早期报道记录了文生视频、图生视频、角色生成和视频转视频延展；2026 年 3 月的记录称 R1
              支持实时生成和连续场景延展。这些发布显示，公司战略覆盖创作者工具、开发者接入、商家工作流和潜在的交互式世界。然而，证据池没有为 Runway、Luma、Kling 或 Seedance
              提供同等粒度的功能记录。因此，矩阵把缺乏证据的竞品单元标为未知，而不是把 PixVerse 更好的文档当作技术领先的证明。
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: 规模、分发、定价与买方摩擦
        blocks:
          - type: paragraph
            body: >-
              资本和报道中的使用量给 AIsphere 留出了竞争空间，但不能证明持久分发或买方锁定。Yicai 报道 2026 年 3 月完成 USD300 million 的 Series C；财新随后称，Alibaba
              主导的融资使该轮总额在 7 月达到 CNY2.98 billion，即 USD439 million。Yicai 还报道用户超过 100 million，而 2024 年较早记录显示用户超过 12
              million、月活接近六百万。这些数字对应不同日期，不应合并成增长率。Alibaba
              主导后续融资可能改善战略接入，但抓取的记录没有证明捆绑分发、排他性或客户转换成本。列表价格、实际合同条款、折扣及竞品包装均缺失，无法可靠比较总成本。
            claimRefs:
              - CP005
              - CP006
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP015
      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              产品迭代速度和融资支持了持续经营能力，但都不能建立可防守的护城河。竞争记录中已经有 ByteDance
              和其他资金充足的模型运营商，功能趋同和分发驱动的替代都是真实风险。合规和基础设施也可能改变相对经济性。中国规则要求供应商标识 AI 生成的网络内容，给国内运营商共同增加产品和治理负担。另据 Greenberg
              Traurig 描述的 BIS 指引，向总部位于中国的实体或其受控关联方供应受管制的先进计算物项，即使接收方在第三国，仍需满足许可要求。指定证据没有确认 AIsphere
              的供应商或许可证，因此这是潜在暴露路径，而不是已记录的违规。取得独立质量基准、留存、单位经济性和渠道条款前，投资判断应把护城河视为取决于执行。
            claimRefs:
              - CP013
              - CP014
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP004
              - CP015
