      - number: '2.2'
        title: 受证据约束的市场测算
        blocks:
          - type: paragraph
            body: >-
              现有记录支持从经营规模观察，而不是做传统的自上而下美元市场估算。随着输出质量和可控性提升，行业数据表明 AI 视频产品进入了领先消费 AI 榜单。2024 年 12 月，PixVerse 据报拥有超过 12
              million 用户和接近 6 million 月活用户；之后的报道显示，截至 2025 年末，PixVerse 与 Paiwo AI 合计用户超过 100 million，月活超过 16 million，ARR
              超过 US$40 million。这些指标说明了触达规模和一定程度的变现，但时间段和分母不同，不能相加，也不能上推为 TAM、SAM 或 SOM。因此，最有决策价值的测算，是把活跃用户桥接到付费
              cohort、使用量、毛利率和留存 ARR。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM009
              - CM015
              - CM016
