        title: 规模信号很强，但收入质量仍未验证
        blocks:
          - type: paragraph
            body: >-
              Yicai 报道 2025 年末 ARR 超过 $40 million，2025 年 10 月用户超过 100 million，同一快照中的月活用户超过 16 million。更早的 2024 年 12
              月报道称用户超过 12 million、月活接近六百万，说明漏斗顶部快速扩张。这些数字是有用的增长指标，但 ARR 不是收入，注册用户或活跃用户也不是付费客户。指定证据池中最审慎的来源将 ARR
              定性为未经审计的公司披露，并指出独立审计财报未公开。现有来源没有提供 ARR 定义、期初至期末桥接、预订额、递延收入、流失、净收入留存、cohort
              留存、付费转化或客户集中度。因此，收入质量仍是尽调问题，而不是可以纳入投资判断的结论。
