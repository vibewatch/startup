            body: >-
              财务故事有吸引力，但尚未达到可凭公开信息作出投资判断的标准。报道 ARR 和使用规模说明已有商业
              traction，最新融资也显著扩大了可用于模型开发和分发的资源。但两者都不能解决收入持续性或资本效率问题：没有来源把 ARR
              桥接到确认收入，区分经常性收入和消费型收入，或量化毛利率、推理成本、获客效率、留存、烧钱和
              runway。因此，合适的投资判断是把公开指标视为管理层增长信号，把融资视为募得的总资本，而不是现金可用或盈利的证明。达到投资级别的尽调需要审计财报、月度 cohort 和收入桥接、产品层面毛利率、云和 GPU
