      - number: '1.4'
        title: 里程碑与尽调姿态
        blocks:
          - type: paragraph
            body: >-
              证据显示，公司经营历史很短：2023 年成立，2024 年完成初始产品发布和数轮融资，2025 年出现大规模用户及 ARR 里程碑，2026 年又发布 R1 实时视频并完成大额 Series C
              融资。这种速度具有战略意义，但也带来执行和竞争问题。财新将该行业描述为一场不断扩大的竞赛，大平台都在试图挑战 ByteDance
              的领先地位；因此，募资本身并不能证明持久的技术或分销优势。时间线保留了来源中的时间段，没有臆造缺失日期；后续尽调应优先核查治理、融资条款、经审计的商业指标，以及独立的法律、监管、安全和宕机记录。
