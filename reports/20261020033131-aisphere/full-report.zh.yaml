      - number: '8.2'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              投资论点建立在三个外部可见信号上：融资能力快速提升、报道中的受众规模可观，以及独立观察到产品进入头部消费 AI
              移动榜单。可触达品类也有多条终端用户路径，包括营销、娱乐、教育、社交媒体、企业、中小企业和个人创作者。反论点是，报道注册量和月活并不能证明付费留存、持久利润率或高效推理经济性。由于融资资金一再被描述为用于模型研发、算力、人才和扩张，资本需求可能仍然很高。面向公众的生成式
              AI 服务和合成内容标识义务会增加执行成本及服务中断风险，因此，仅有强劲产品信号还不够。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: 情景与可比背景
        blocks:
          - type: paragraph
            body: >-
              公开证据不足以支持可靠的绝对估值区间，因此情景框架不臆造倍数。乐观情景要求有经审计的 ARR 增长、付费留存和毛利率证据，把产品热度转化为可重复的经济性。基准情景在将报道的 USD40-million-plus
              ARR 与收入和现金回收核对前，只把它视为方向性指标，并让公司继续处于尽调轨道。悲观情景是增长质量、安全控制或算力经济性令人失望，最终出现 down-round 或结构化融资。Moonshot AI 报道中的
              USD20 billion 估值和超过 USD200 million 的 ARR 说明中国 AI 资本充足，但其通用模型业务和约一百倍报道 ARR 的指标只是背景，不是 AIsphere 的直接基准。
            claimRefs:
              - CV003
              - CV007
              - CV012
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.4'
        title: 退出准备、尽调要求与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              仅凭融资头条无法确认退出准备度。在把 IPO、战略出售或二级交易路径纳入投资判断前，投资者需要审计 ARR 桥接、cohort 留存、毛利和贡献利润、算力承诺、地区收入结构，以及完整的 Series C
              资本结构和优先权方案。还需要证据证明标识、备案、内容治理和事故响应控制在中国及国际产品面上都能运行。论点失效触发器包括无法将报道 ARR
              与已收收入核对、付费用户或留存持续恶化、重大监管暂停、惩罚性优先权悬置，或入场价格在相关经济性尚未证明前就假定存在溢价经济性。独立移动榜单进展令人鼓舞，但它只是参与度信号，不是退出质量指标。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 对价格敏感的结论
            body: 应把报道规模和融资视为继续尽调的理由，而不是用来替代已披露的入场价格和经验证的经营经济性。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV015
              - CV016
          - type: callout
            title: 没有公开估值区间
            body: 在取得 Series C 条款、资本结构、审计 ARR 桥接、留存和利润率结构前，精确的公允价值区间只是虚假的精确。
            calloutType: risk
            claimRefs:
              - CV015
              - CV016
