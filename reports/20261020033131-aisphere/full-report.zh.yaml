  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律暴露
        blocks:
          - type: paragraph
            body: >-
              中国 AI 内容标识制度是指定证据中最明确、已确认的监管义务。规则于 2025 年 9 月 1 日生效，要求在 AI
              生成内容上添加可见标识，并禁止删除、篡改、伪造或隐匿识别标识。对于全球分发的视频产品，这会在生成、导出、分享和后续修改的全链路形成实施负担，而不是一次性披露。本文审阅的公开记录无法确认 AIsphere
              的技术控制、审计覆盖、隐私状况、知识产权赔偿、诉讼历史或监管沟通。这些缺口使合规成熟度无法评分，因此应把隐私、版权和跨境暴露视为重要尽调事项，而不是断言不存在事故或争议。
