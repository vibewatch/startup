        title: 信任、安全、隐私与质量控制
        blocks:
          - type: paragraph
            body: >-
              监管底线比 AIsphere 的实施证据清楚。中国生成式 AI
              措施适用于面向大陆公众、生成文本、图像、音频或视频的服务，并要求使用合法训练数据，保护知识产权、个人信息和用户输入机密，落实数据最小化、服务稳定以及生成图像和视频标识。2025 年另行发布的指引要求自 2025
              年 9 月 1 日起为 AI 生成网络内容添加可见标识。这些义务与 Paiwo AI 及任何面向大陆的 API 相关，但不能证明 AIsphere
              已实施合规控制。指定证据池没有信任中心、安全认证、事故记录、模型卡、内容审核指标、正常运行记录或独立审计。投资者应把合规和质量体系视为尽调要求，而不是推定存在的产品属性。
