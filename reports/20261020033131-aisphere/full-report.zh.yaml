  - id: TV003
    title: 牛市、基准与熊市情景
    columns:
      - 情景
      - 假设
      - 估值或回报逻辑
      - 概率信号
      - 下行情景触发点
    rows:
      - - 牛市
        - 经审计 ARR 持续复合增长，付费留存强劲，推理成本下降带动利润率改善
        - 公开证据或许足以支撑溢价结果，但无法据此给出可信的数值区间
        - 独立使用排名持续靠前，且付费用户群已获验证
        - 增长无法转化为现金贡献
      - - 基准
        - 报道中的 USD40M-plus ARR 大体准确，但经济模型仍不成熟
        - 在一手指标和入场条款足以建模前，继续研究
        - 融资渠道和广泛用户触达
        - 付费留存停滞，或融资条款明显偏向优先权
      - - 熊市
        - ARR 质量令人失望、算力成本居高不下，或合规问题扰乱分发
        - 下轮融资估值下调或结构化资本变得可能；无法支撑精确的底价
        - 资金需求仍与研发和算力绑定
        - 监管暂停、回款疲弱或惩罚性条款
    notes: 这些情景是有条件的决策路径，不是按概率加权的预测；公开证据不足以支持数值化的估值区间或目标回报。
    claimRefs:
      - CV003
      - CV005
      - CV009
      - CV010
      - CV011
      - CV015
      - CV016
