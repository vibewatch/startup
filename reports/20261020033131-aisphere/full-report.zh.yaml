              月报道称，资金将用于研发、新业务和全球扩张。更早的融资披露也把算力资源、人才、产品迭代和市场覆盖列为资金用途。这些重点符合算力和研发密集型模式，但融资总额不等于手头现金。公开记录没有披露 AIsphere
              的现金余额、月度烧钱、债务、合同算力承诺或 runway。作为方向性竞品基准而非 AIsphere 的事实，Adobe 的审计文件把托管、数据中心和 AI 推理成本列入订阅收入成本。AIsphere
              没有提供可比的毛利率或单次生成成本数据，无法检验当前定价是否覆盖交付成本。
