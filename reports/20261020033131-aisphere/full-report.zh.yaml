  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品面与客户工作流
        blocks:
          - type: paragraph
            body: >-
              PixVerse 被定位为视频生成平台，可把文本、图像及其他媒体输入变成短视频，减少对传统先剪辑工作流的依赖。二手报道记录的是一系列工作流扩展，而不是单一 SKU：文本、图像和角色驱动的生成、用于保持视觉一致性的
              Character2Video，以及可根据现有素材延展或生成片段的视频转视频功能。这种广度既支持低摩擦的消费者创作，也支持创作者改造源素材，但证据没有量化可用输出率或节省的剪辑时间。因此，从功能看，产品覆盖面很广，但可衡量的工作流优势仍未验证。公开时间线还提到
              Web、移动端和 API 交付面，不过指定证据中没有一手 API 文档。
            claimRefs:
