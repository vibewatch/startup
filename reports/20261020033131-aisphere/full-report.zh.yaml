            body: >-
              已披露的技术演进最清晰的一条线，是从 PixVerse V2 的 Diffusion-plus-Transformer 生成栈和据称自研的时空注意力机制，走向 R1 的自回归设计。2024 年 12 月的报道称
              V3.5 正在内部测试，生成时间低于 30 秒；2026 年 3 月的报道则称 R1 支持实时生成和连续场景延展。BigGo 进一步报道了 Omni 多模态架构和 IRE
              引擎，目标是压缩传统的多步生成流程。这些细节构成合理的架构叙事，但不是经独立基准测试的系统描述。最重要的成熟度警示，是宣传中的 R1 分辨率、延迟和 API 可用性与据报交付的版本不一致。因此，R1
              应按正在形成的产品方向评估，而不是按已验证的生产平台评估。
