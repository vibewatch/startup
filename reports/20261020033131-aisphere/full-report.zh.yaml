chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              AIsphere 是一家成立于 2023 年 4 月、总部位于北京的 AI 视频公司。其产品在海外以 PixVerse 为品牌，在中国使用 Paiwo
              AI。公司称拥有自研视频生成技术栈，可将文本、图像、关键帧和参考图像转成视频；官网还展示了面向电商、娱乐、游戏、电影、动画和广告工作流的
              API。由此可见，公司同时覆盖消费者创作者和企业基础设施，但现有材料没有披露订阅、点数、API 用量及其他渠道之间的收入分配。因此，报道用户总数反映的是触达规模，而非付费客户；报道 ARR
              也不应视为经审计的会计收入。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO009
              - CO010
              - CO013
      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公开证据主要围绕创始人 Wang Changhu 展开：他曾在 Microsoft Research Asia 和 ByteDance 从事计算机视觉与 AI 工作；联合创始人 Xie Xuzhang 则讨论过
              2026 年 3
              月融资和产品方向。这套技术履历有助于说明创始人与市场的匹配度，但证据过度集中也带来关键人物风险：战略、技术可信度和对外叙事反复落在少数几位领导者身上。指定来源没有说明董事会、表决权、高管梯队、继任计划或重大领导层变动。因此，领导层表格有意保持不完整，不能当作完整的管理层或治理名册。
            claimRefs:
              - CO004
              - CO005
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO004
              - CO005
              - CO015
      - number: '1.3'
        title: 融资、规模与利益相关方
        blocks:
          - type: paragraph
            body: >-
              融资从 2024 年的 A 轮系列加速到 2025 年据报 $60 million 的 Series B 和 RMB100 million 的 B+，随后在 2026 年 3 月完成据报 $300 million
              的 Series C。财新之后报道，Alibaba 主导的追加融资使 Series C 总额在 2026 年 7 月达到 RMB2.98 billion ($439
              million)。这些是特定时期的轮次披露，并不能验证累计募资额或可用现金。另有多个来源称，截至 2025 年末，公司用户超过 100 million、月活用户超过 16 million、ARR 超过 $40
              million。这些数字是重要的增长信号，但用户 cohort 定义、审计状态、收入桥接、留存、毛利率及付费客户转化率仍未披露。
