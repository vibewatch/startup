            body: >-
              可投资信号真实存在，但并不完整。截至 2026 年 7 月，财新报道 AIsphere 的 Series C 已达到 CNY2.98 billion (USD439 million)，高于 3 月报道的
              USD300 million 融资。独立报道也重复提到 ARR 超过 USD40 million、月活用户超过 16 million；a16z 则记录 PixVerse
              从移动端边缘榜进入核心榜单。这些事实支持继续尽调，而不是不计价格地承诺投资。现有来源没有提供当前投后估值、清算瀑布、所有权安排、毛利率、留存或经算力调整的贡献利润。因此，在取得一手融资和经营证据前，建议为
              research-more，信心为中等，风险为高，估值立场未定。
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV009
              - CV015
              - CV016
