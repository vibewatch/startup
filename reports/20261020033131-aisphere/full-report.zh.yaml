  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代品
        blocks:
          - type: paragraph
            body: >-
              可投资市场比整个生成式 AI 市场更窄：AIsphere 通过 PixVerse 参与 AI 原生短视频生成，面向消费者和创作者提供文生视频、图生视频及视频延展工作流，并通过 API
              服务商业应用。市场边界不包括通用助手、仅增加 AI
              功能的传统视频编辑器、常规制作软件和完整游戏引擎市场。这些类别可以替代部分工作流，但不应计入可触达支出。实时世界模型和游戏引擎用途属于相邻机会，而非已证实的基础市场，因为公开证据只记录了询问，没有披露部署。中国特有的标识要求为制作和分发增加合规环节，使溯源工具成为采用成本，而不是增量市场规模。
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM010
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
