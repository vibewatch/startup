schemaVersion: "report-v2"
artifact: financials
slug: aisphere
runDate: 2026-10-20
company:
  name: AIsphere
chapter:
  number: 4
  title: Financials
  summary: >-
    Public evidence indicates more than $40 million of company-reported ARR at the end of
    2025 and substantial user scale, but it does not provide an audited revenue bridge,
    gross margin, customer economics, cash balance, burn, or runway. The July 2026 Series C
    total improves financing capacity but is funding raised, not evidence of cash available
    or durable profitability.
sections:
  - id: monetization-architecture
    title: Monetization architecture is visible, but the mix is not
    body: >-
      AIsphere appears to monetize a broad product surface rather than a single clean SaaS
      line. Public descriptions place PixVerse and Paiwo AI in consumer creation workflows
      while also describing API and enterprise access, and one third-party briefing reports
      an image-to-video generation price of $4.80 per minute. That establishes a plausible
      blend of subscription or credit consumption and usage-based/API revenue, but it does
      not establish realized pricing, contract duration, discounts, revenue recognition, or
      the contribution of each surface. The retained sources disclose no revenue mix by
      product, customer type, channel, or geography. Consequently, the public ARR figure
      cannot be converted into accounting revenue, and apparent consumer scale cannot be
      converted into paying-customer economics without a paid-conversion denominator.
    claimRefs: [CI001, CI002, CI007, CI013]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-revenue-quality
    title: Scale signals are strong, while revenue quality remains unverified
    body: >-
      Yicai reported more than $40 million of ARR at the end of 2025, more than 100 million
      users in October 2025, and more than 16 million monthly active users in the same
      snapshot. Earlier December 2024 reporting described more than 12 million users and
      nearly six million monthly active users, showing rapid top-of-funnel expansion. These
      figures are useful traction indicators, but ARR is not revenue and registered or
      active users are not paying customers. The strongest skeptical source in the assigned
      pool characterizes the ARR as unaudited company disclosure and notes that independent
      audited financial statements are not public. No retained source provides an ARR
      definition, beginning-to-ending bridge, bookings, deferred revenue, churn, net revenue
      retention, cohort retention, paid conversion, or customer concentration. Revenue
      quality therefore remains a diligence question rather than an underwritten conclusion.
    claimRefs: [CI003, CI004, CI005, CI006, CI008, CI013]
  - id: cost-structure-and-capital
    title: Compute intensity and financing capacity pull in opposite directions
    body: >-
      A July 2026 report put cumulative Series C financing at RMB2.98 billion, or $439
      million, and March reporting said proceeds were intended for research and development,
      new businesses, and global expansion. Earlier financing disclosures likewise named
      computing resources, talent, product iteration, and market coverage as uses of funds.
      Those priorities are consistent with a compute- and research-intensive model, but the
      gross amount financed is not cash on hand. The public record does not disclose
      AIsphere's cash balance, monthly cash burn, debt, contractual compute commitments, or
      runway. As a directional competitor benchmark rather than an AIsphere fact, Adobe's
      audited filing identifies hosting, data-center, and AI-inference costs within
      subscription cost of revenue. AIsphere provides none of the comparable gross-margin
      or per-generation cost data needed to test whether current pricing absorbs those
      delivery costs.
    claimRefs: [CI009, CI010, CI011, CI012, CI014, CI015]
    tableRefs: [TI003]
  - id: financial-verdict
    title: Financial verdict and underwriting threshold
    body: >-
      The financial case is promising but not yet underwritable from public information.
      Reported ARR and usage scale suggest commercial traction, while the latest financing
      materially expands the resources available for model development and distribution.
      Neither signal resolves revenue durability or capital efficiency: no source bridges
      ARR to recognized revenue, identifies recurring versus consumption revenue, or
      quantifies gross margin, inference cost, acquisition efficiency, retention, burn, and
      runway. The appropriate underwriting stance is therefore to treat the public metrics
      as management traction indicators and the financing as gross capital raised, not as
      proof of cash availability or profitability. Investment-grade diligence requires
      audited financial statements, monthly cohort and revenue bridges, product-level gross
      margins, cloud and GPU commitments, and a board-approved cash plan tied to explicit
      next-round triggers.
    claimRefs: [CI002, CI003, CI008, CI012, CI013, CI014, CI016]
tables:
  - id: TI001
    title: Revenue streams and evidence quality
    columns: [Stream, Mechanism, Unit, Public status, Revenue quality, Diligence ask]
    rows:
      - [PixVerse consumer, "Creation access through subscriptions or credits", "Plan or generation", "Commercial product; mix undisclosed", "Reported ARR is not allocated to this stream", "Monthly paid users, ARPPU, churn, refunds, and recognized revenue"]
      - [Paiwo AI consumer, "Domestic creation access", "Plan or generation", "Commercial product; pricing and mix undisclosed", "No public domestic revenue allocation", "China billings, taxes, refunds, channel fees, and recognition policy"]
      - [Developer API, "Usage-based programmatic generation", "API usage unit", "API access described; realized price unavailable", "Volume, discounts, and minimum commitments unavailable", "Usage tiers, contracted volume, overages, and gross margin by model"]
      - [Enterprise workflows, "Contracted access or workflow integration", "Contract or usage", "Enterprise use cases described; contract economics unavailable", "No disclosed bookings, term, or concentration", "Top contracts, term, renewal, services content, and revenue recognition"]
    notes: >-
      Mechanisms are based on public product descriptions; stream-level revenue, realized
      pricing, mix, and accounting treatment are unavailable and are not estimated.
    claimRefs: [CI001, CI002, CI007]
  - id: TI002
    title: Pricing and monetization evidence
    columns: [Surface, Public price or unit, List versus realized, Discount or contract evidence, Underwriting implication]
    rows:
      - [Image-to-video generation, "$4.80 per minute reported by a third party", "Reported public price; realized yield unknown", "No retained discount or cohort evidence", "Cannot infer gross margin without compute cost and paid usage mix"]
      - [Consumer subscriptions or credits, "Unavailable in retained evidence", "List and realized price unavailable", "No retention, refund, or promotional data", "ARR quality cannot be tested by plan or geography"]
      - [Enterprise and API, "Unavailable in retained evidence", "Contract and usage pricing unavailable", "No volume tiers, minimums, or channel terms", "Revenue durability and concentration remain unknown"]
    notes: >-
      The only numeric price is a third-party-reported image-to-video rate; it is not treated
      as realized revenue, average selling price, or a current contract term.
    claimRefs: [CI001, CI002, CI007, CI013, CI014]
  - id: TI003
    title: Public traction, unit economics, and capital adequacy
    columns: [Metric, Value or status, Period, Confidence, Why it matters, Diligence ask]
    rows:
      - [ARR, "More than $40M, company-reported via Yicai", "End of 2025", "Medium; unaudited", "Signals commercial scale but is not accounting revenue", "ARR definition, customer-level bridge, bookings, and recognized revenue"]
      - [Registered users, "More than 100M", "October 2025", "Medium; company metric reported by Yicai", "Defines top-of-funnel scale, not monetization", "Deduplicated accounts, geography, acquisition source, and paid conversion"]
      - [Monthly active users, "More than 16M", "October 2025", "Medium; company metric reported by Yicai", "Offers an engagement denominator but not a payer denominator", "MAU definition, cohort retention, paid MAU, and generation frequency"]
      - [CAC and payback, null, "Not publicly disclosed", "Unavailable", "Determines whether viral reach converts efficiently", "Blended and paid CAC, contribution payback, and channel economics"]
      - [Gross margin and inference cost, null, "Not publicly disclosed", "Unavailable", "Tests whether usage and pricing absorb GPU and hosting costs", "Product-level gross margin, cost per generated minute, and cloud commitments"]
      - [Retention and NRR, null, "Not publicly disclosed", "Unavailable", "Separates recurring demand from episodic effects", "Logo churn, gross retention, NRR, and cohort revenue curves"]
      - ["Cash, burn, and runway", null, "Post-July 2026 financing", "Unavailable", "Funding raised does not establish liquidity or runway", "Bank statements, monthly burn, debt, commitments, and downside cash plan"]
    notes: >-
      Null means the metric was not disclosed in the assigned public evidence. ARR, users,
      financing, cash, revenue, and profitability are kept as distinct measures.
    claimRefs: [CI003, CI004, CI005, CI008, CI009, CI012, CI013, CI014, CI016]
figures:
  - id: FI001
    title: Publicly evidenced revenue model bridge
    type: flow
    summary: >-
      The public funnel reaches reported ARR, but paid conversion, revenue recognition, and
      gross profit remain missing links.
    data:
      nodes:
        - id: registered-base
          label: Registered base
          value: ">100M"
          unit: users
          detail: "Reported for October 2025; not a payer count."
        - id: active-base
          label: Monthly active base
          value: ">16M"
          unit: MAU
          detail: "Reported for October 2025; definition and cohort retention unavailable."
        - id: paid-conversion
          label: Paid conversion
          value: "Unavailable"
          detail: "No paid-user count or conversion rate is public."
        - id: monetized-usage
          label: Monetized usage
          value: "$4.80/min reported"
          unit: image-to-video minute
          detail: "Third-party-reported price; realized yield and discounts unavailable."
        - id: recurring-run-rate
          label: Recurring run-rate
          value: ">$40M"
          unit: ARR
          detail: "Reported at the end of 2025; not audited revenue."
        - id: gross-profit
          label: Gross profit
          value: "Unavailable"
          detail: "Gross margin and inference cost per unit are not public."
    approximationNotes: >-
      Ordered conceptual bridge only; it does not imply comparable populations, conversion
      rates, or that ARR equals recognized revenue.
    claimRefs: [CI002, CI003, CI004, CI005, CI007, CI008, CI013, CI014]
callouts:
  - calloutType: risk
    title: ARR is not audited revenue
    body: >-
      The more-than-$40-million figure is a reported annual recurring run-rate without a
      public definition, customer bridge, recognition policy, or audited financial statement.
    claimRefs: [CI003, CI008, CI016]
  - calloutType: recommendation
    title: Make unit economics and liquidity the next diligence gate
    body: >-
      Require product-level revenue and gross-margin bridges, paid cohorts, CAC/payback,
      cloud and GPU commitments, cash, debt, and monthly burn before underwriting growth or
      runway.
    claimRefs: [CI002, CI012, CI013, CI014, CI016]
