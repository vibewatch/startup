      topic: capital-adequacy
      missingEvidence: >-
        Current unrestricted cash, monthly cash burn, debt and liquidation terms,
        non-cancellable GPU or cloud commitments, downside runway, and the next-round trigger.
      whyItMatters: >-
        Financing proceeds are gross capital raised and cannot establish current liquidity,
        financing dependency, or the date at which another round becomes necessary.
      diligencePath: >-
        Reconcile bank statements to the general ledger, inspect debt and cloud contracts,
        review the board-approved operating plan, and run downside cash scenarios.
