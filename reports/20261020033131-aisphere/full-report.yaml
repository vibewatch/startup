figures:
  - id: FO001
    title: AIsphere milestone timeline
    type: timeline
    summary: A compressed sequence of product, financing, and scale milestones from formation through the expanded Series C.
    data:
      items:
        - date: 2023-04
          label: Company founded
          detail: >-
            AIsphere was founded in Beijing and its official site reports an initial financing of tens of millions of
            renminbi.
          tone: neutral
          claimRefs:
            - CO001
        - date: 2023-08
          label: Angel financing
          detail: Pandaily reported a multi-million-renminbi angel round.
          tone: positive
          claimRefs:
            - CO006
        - date: 2024-01
          label: PixVerse launched
          detail: The overseas PixVerse product launched with text-to-video functionality.
          tone: positive
          claimRefs:
            - CO003
        - date: 2024-03
          label: Series A1 and Character2Video
          detail: Reporting places an RMB100 million Series A1 and the Character2Video launch in March.
          tone: positive
          claimRefs:
            - CO006
        - date: 2024-07
          label: PixVerse V2
          detail: PixVerse V2 added a self-developed spatiotemporal attention mechanism and multiple generation modes.
          tone: positive
          claimRefs:
            - CO003
        - date: 2024-12
          label: A2-A4 financing and usage milestone
          detail: >-
            Nearly RMB300 million across A2-A4 was reported alongside more than 12 million users and nearly six million
            MAU.
          tone: positive
          claimRefs:
            - CO006
            - CO007
        - date: 2025-09
          label: Series B
          detail: A $60 million Series B was reported.
          tone: positive
          claimRefs:
            - CO008
        - date: 2025-10
          label: B+ and larger scale
          detail: >-
            An RMB100 million B+ preceded reports of more than 100 million users, more than 16 million MAU, and more
            than $40 million ARR.
          tone: positive
          claimRefs:
            - CO008
            - CO009
            - CO010
        - date: 2026-01
          label: PixVerse R1
          detail: R1 launched as a real-time video-generation model using an autoregressive architecture.
          tone: positive
          claimRefs:
            - CO011
        - date: 2026-03
          label: $300 million Series C reported
          detail: Yicai reported a $300 million round for R&D, new businesses, and global expansion.
          tone: positive
          claimRefs:
            - CO012
        - date: 2026-07
          label: Series C total reaches RMB2.98 billion
          detail: Caixin reported Alibaba-led financing bringing the round total to RMB2.98 billion ($439 million).
          tone: positive
          claimRefs:
            - CO013
