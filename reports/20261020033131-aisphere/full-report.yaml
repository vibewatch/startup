  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The investable market is narrower than generative AI overall: AIsphere competes in AI-native short-form
              video generation through PixVerse, with text-to-video, image-to-video, and video-extension workflows for
              consumers and creators, plus an API surface for commercial applications. The boundary excludes
              general-purpose assistants, legacy video editors that merely add AI features, conventional production
              software, and the full game-engine market. Those categories can substitute for parts of the workflow but
              should not be counted as addressable spend. Real-time world-model and game-engine use is an adjacency, not
              a proved base market, because public evidence records inquiries rather than disclosed deployments.
              China-specific labeling requirements add a compliance layer to production and distribution, making
              provenance tooling part of adoption cost rather than incremental market size.
            claimRefs:
              - CM001
              - CM002
              - CM008
              - CM010
              - CM012
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM012
      - number: '2.2'
        title: Evidence-Constrained Sizing
        blocks:
          - type: paragraph
            body: >-
              The available record supports operating-scale lenses, not a conventional top-down dollar estimate.
              Industry data shows AI video products entering leading consumer-AI rankings as output quality and
              controllability improved. PixVerse was reported at more than 12 million users and almost 6 million monthly
              active users in December 2024; later reporting placed the combined PixVerse and Paiwo AI base above 100
              million users, monthly active users above 16 million, and ARR above US$40 million by late 2025. These
              metrics establish reach and some monetization but have different periods and denominators. They cannot be
              added or promoted into TAM, SAM, or SOM. The most decision-useful sizing work is therefore a verified
              bridge from active users to paying cohorts, usage volume, gross margin, and retained ARR.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM009
              - CM015
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM007
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM009
              - CM015
      - number: '2.3'
        title: Buyers, Users, and Budget Ownership
        blocks:
          - type: paragraph
            body: >-
              AIsphere's funnel spans materially different economic actors. Casual creators are both user and payer
              under a freemium model, while prosumers and small creative teams may buy credits or subscriptions when
              better control and faster iteration justify the expense. In enterprise workflows, creative or product
              teams use the model but marketing, media-production, or technology budgets likely own procurement; public
              evidence confirms an open platform and partner integrations but does not disclose contract size or
              conversion. Gaming and short-drama studios represent an adjacent buyer set attracted by real-time scene
              extension, yet reported client inquiries do not prove production adoption. This mix creates broad
              distribution potential while leaving payer concentration and enterprise sales efficiency unresolved.
            claimRefs:
              - CM001
              - CM007
              - CM008
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM008
              - CM011
              - CM012
              - CM015
      - number: '2.4'
        title: Adoption Drivers, Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption is driven by better short-clip reliability, control, fast generation, and consumer interfaces
              that reduce production friction. A March 2025 industry ranking found several AI video products among
              leading AI-native web applications, supporting category demand but also showing fragmentation among
              specialized providers. The same evidence warns that usage and mobile-subscription revenue rankings overlap
              only partially, so audience scale does not prove monetization quality. Regulation is another constraint:
              China's AI-content labeling rules require visible marks and prohibit tampering or concealment, raising
              implementation and distribution obligations. Finally, repeated financing for R&D and compute signals both
              strategic interest and capital intensity. Valuation should therefore depend on audited payer conversion,
              retained ARR, gross margin, and compute efficiency rather than headline users or financing size.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Reach is not serviceable revenue
            body: >-
              The public record does not bridge registered users to paying accounts, retained cohorts, gross margin, or
              compute-adjusted contribution. Consumer-AI research also shows that usage leaders and mobile-subscription
              revenue leaders overlap only partially.
            calloutType: risk
            claimRefs:
              - CM009
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitution set
        blocks:
          - type: paragraph
            body: >-
              The strongest current third-party mapping places PixVerse in video generation and interactive audiovisual
              world models, with Runway, Luma AI, and Kling AI as its named competitive context. Separate reporting
              identifies ByteDance's Seedance 2.0 as a rival product. AIsphere's co-founder said Seedance had limited
              impact because PixVerse targets global markets while Seedance focuses mainly on China; that is management
              positioning relayed by Yicai, not an independent performance benchmark. The practical substitution set is
              therefore wider than direct model vendors: buyers can use an incumbent platform, combine APIs with
              internal workflows, or defer adoption. Public evidence in the assigned pool is much richer for PixVerse
              than for the named alternatives, so category membership is supportable but a winner ranking is not.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP015
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP006
              - CP012
      - number: '3.2'
        title: Capability position and product-surface breadth
        blocks:
          - type: paragraph
            body: >-
              PixVerse's visible breadth is its clearest competitive asset. The current mapped surface includes
              PixVerse, an API, a Game Engine, Growth Studio, and the V6 and R2 model families. Earlier reporting
              documents text-to-video, image-to-video, character generation, and video-to-video extension, while the
              March 2026 record describes R1 as supporting real-time generation and continuous scene extension. These
              releases suggest a strategy that spans creator tools, developer access, merchant workflows, and
              prospective interactive worlds. However, the evidence pool does not provide equivalent feature-level
              records for Runway, Luma, Kling, or Seedance. The matrix therefore marks unsupported competitor cells as
              unknown rather than treating PixVerse's better documentation as proof of technical superiority.
            claimRefs:
              - CP001
              - CP007
              - CP008
              - CP009
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP004
              - CP007
              - CP008
              - CP009
      - number: '3.3'
        title: Scale, distribution, pricing, and buyer friction
        blocks:
          - type: paragraph
            body: >-
              Capital and reported usage give AIsphere room to compete, but they do not prove durable distribution or
              buyer lock-in. Yicai reported a USD300 million Series C in March 2026, while Caixin later reported that an
              Alibaba-led financing brought the round total to CNY2.98 billion, or USD439 million, in July. Yicai also
              reported more than 100 million users, and the older 2024 record reported more than 12 million users and
              nearly six million monthly active users. These figures have different dates and should not be merged into
              a growth rate. Alibaba's leadership of the later financing may improve strategic access, but the fetched
              record does not establish bundled distribution, exclusivity, or customer switching costs. List prices,
              realized contract terms, discounts, and competitor packaging are absent, preventing a reliable total-cost
              comparison.
            claimRefs:
              - CP005
              - CP006
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP015
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Product velocity and financing support endurance, but neither establishes a defensible moat. The
              competitive record already includes ByteDance and other well-funded model operators, making feature
              convergence and distribution-led displacement credible risks. Compliance and infrastructure can also alter
              relative economics. Chinese rules require providers to label AI-generated online content, adding a product
              and governance burden shared by domestic operators. Separately, BIS guidance described by Greenberg
              Traurig keeps licensing requirements for covered advanced-computing items supplied to China-headquartered
              entities or their controlled affiliates, even when the recipient is in a third country. The assigned
              evidence does not establish AIsphere's suppliers or licenses, so this is an exposure pathway rather than a
              recorded violation. Underwriting should treat the moat as execution-dependent until independent quality
              benchmarks, retention, unit economics, and channel terms are obtained.
            claimRefs:
              - CP013
              - CP014
              - CP016
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP003
              - CP004
              - CP015
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Documentation advantage is not a product moat
            body: >-
              PixVerse has the richest evidence in this chapter's assigned pool, but the competitor records are too
              sparse to infer a technical, pricing, or distribution lead.
            calloutType: risk
            claimRefs:
              - CP015
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization architecture is visible, but the mix is not
        blocks:
          - type: paragraph
            body: >-
              AIsphere appears to monetize a broad product surface rather than a single clean SaaS line. Public
              descriptions place PixVerse and Paiwo AI in consumer creation workflows while also describing API and
              enterprise access, and one third-party briefing reports an image-to-video generation price of $4.80 per
              minute. That establishes a plausible blend of subscription or credit consumption and usage-based/API
              revenue, but it does not establish realized pricing, contract duration, discounts, revenue recognition, or
              the contribution of each surface. The retained sources disclose no revenue mix by product, customer type,
              channel, or geography. Consequently, the public ARR figure cannot be converted into accounting revenue,
              and apparent consumer scale cannot be converted into paying-customer economics without a paid-conversion
              denominator.
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI013
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI007
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI007
              - CI013
