              - CU008
              - CU011
              - CU012
              - CU013
              - CU016
      - number: '6.2'
        title: Adoption trajectory and current usage
        blocks:
          - type: paragraph
            body: >-
              Reported reach expanded rapidly: PixVerse moved from more than 12 million users and nearly 6 million
              monthly active users in December 2024 to a combined PixVerse and Paiwo base above 100 million users and 16
              million monthly actives in October 2025. By July 2026, secondary reporting cited more than 150 million
              registered users in over 175 countries but only roughly 15 million monthly actives. AppBrain independently
              estimated 78 million Android installs and 1.7 million installs in the latest 30 days as of October 18,
              2026. The registration curve is strong, but the monthly-active series appears flat to slightly lower
              across unlike reporting dates, leaving repeat use and conversion durability unproven.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
              - CU015
