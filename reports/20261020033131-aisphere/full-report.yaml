          - type: callout
            title: Customer economics remain below underwriting quality
            body: >-
              Public evidence does not bridge ARR to paid users, cohorts, segments, renewals, or concentration, and the
              only named enterprise relationship is commercially opaque.
            calloutType: risk
            claimRefs:
              - CU010
              - CU012
