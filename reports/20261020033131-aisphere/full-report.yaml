  - id: FE001
    title: Evidence-bounded PixVerse product architecture
    type: stack
    summary: >-
      Six disclosed layers connect inputs to generation, workflow tools, distribution, and the regulatory control plane
      without inferring undisclosed infrastructure.
    data:
      layers:
        - label: Input layer
          detail: Text, image, character, and existing-video inputs described by secondary sources.
          modules:
            - label: Text prompts
            - label: Images and character references
            - label: Existing footage
        - label: Core video generation
          detail: PixVerse produces short video through reported multimodal generation modes.
          modules:
            - label: Text-to-video
            - label: Image-to-video
            - label: Character-generated video
        - label: Temporal model layer
          detail: V2 was reported to use a Diffusion-plus-Transformer base and spatiotemporal attention.
          modules:
            - label: Diffusion plus Transformer
            - label: Spatiotemporal attention
        - label: Workflow tools
          detail: Character consistency and video-to-video features package model output for creator jobs.
          modules:
            - label: Character2Video
            - label: Video-to-video extension
        - label: Interactive world-model layer
          detail: R1 is reported as an autoregressive system for real-time generation and continuous scenes.
          modules:
            - label: Autoregressive generation
            - label: Continuous scene extension
        - label: Delivery and control plane
          detail: Web, mobile, and reported API surfaces sit alongside privacy, stability, and labeling duties.
          modules:
            - label: Web and mobile delivery
            - label: API distribution
            - label: Content labeling and data obligations
    approximationNotes: >-
      Conceptual ordering reflects disclosed product functions and applicable obligations; it does not assert an
      internal deployment topology.
    claimRefs:
      - CE001
      - CE002
      - CE004
      - CE007
      - CE014
      - CE015
      - CE016
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence shows a large creator acquisition funnel but leaves payment, retention, and enterprise expansion
      transitions unmeasured.
    data:
      items:
        - label: Discover
          detail: Viral creative effects and global social distribution attract creators.
          touchpoints:
            - Viral effects
            - Social platforms
            - Creator word of mouth
        - label: Install or visit
          detail: Users enter through the global PixVerse surface or the China-facing Paiwo AI product.
          touchpoints:
            - Android app
            - Global web or app surface
            - Paiwo AI
        - label: Create
          detail: Users generate and edit short-form AI video with text, image, video, and model workflows.
          touchpoints:
            - Prompt creation
            - Image animation
            - Video transformation
        - label: Pay
          detail: Subscription and credit mechanisms are visible, but paid conversion and payer mix are not disclosed.
          touchpoints:
            - Subscription
            - Credits
            - Ads on the free Android app
        - label: Repeat
          detail: Monthly-active disclosures provide snapshots, while renewal, churn, and cohort retention remain unavailable.
          touchpoints:
            - Monthly active use
            - Repeat generation
            - Support and billing
        - label: Expand
          detail: >-
            Enterprise expansion appears through an Alibaba agreement and gaming or short-drama inquiries, without
            quantified outcomes.
          touchpoints:
            - Cloud distribution
            - Enterprise deployment
            - Sector inquiries
    approximationNotes: >-
      Stages are an evidence-based workflow synthesis, not a measured conversion funnel; no transition rates or stage
      populations are inferred.
    claimRefs:
      - CU011
      - CU012
      - CU014
      - CU015
      - CU016
