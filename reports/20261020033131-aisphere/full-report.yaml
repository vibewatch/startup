  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal exposure
        blocks:
          - type: paragraph
            body: >-
              China's AI-content labeling regime is the clearest confirmed regulatory obligation in the assigned
              evidence. The rules took effect on September 1, 2025, require visible marks on AI-generated content, and
              prohibit deleting, tampering with, fabricating, or concealing identifying labels. For a globally
              distributed video product, this creates an end-to-end implementation burden across generation, export,
              sharing, and downstream modification rather than a one-time disclosure. The public record reviewed here
              does not establish AIsphere's technical controls, audit coverage, privacy posture, IP indemnities,
              litigation history, or regulator correspondence. Those omissions make compliance maturity unscorable and
              justify treating privacy, copyright, and cross-border exposure as material diligence items rather than
              asserting that no incidents or disputes exist.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR007
              - CR014
      - number: '7.2'
        title: Operating and financial resilience
        blocks:
          - type: paragraph
            body: >-
              Financing capacity has improved sharply: reporting moved from a USD300 million Series C in March 2026 to
              CNY2.98 billion, or about USD439 million, by July. That capital can fund models, compute, hiring, and
              international expansion, but funding raised is not cash available and does not answer burn, gross margin,
              working-capital, or inference cost questions. Yicai reported more than USD40 million of ARR at the end of
              the prior year, while the CEO separately said subscription revenue covered costs; neither disclosure is an
              audited bridge from ARR to recognized revenue, contribution margin, or cash flow. Rapid user growth and
              viral templates show demand, yet the absence of uptime, latency, moderation, fraud-loss, and incident
              statistics leaves service reliability and safety exposure materially unresolved at the disclosed scale.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR016
