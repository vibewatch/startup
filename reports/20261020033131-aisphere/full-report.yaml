  - id: FM001
    title: Evidence Ladder for the Addressable AI Video Market
    type: pyramid
    summary: >-
      Public evidence narrows from an AI-native application universe to category adoption, PixVerse engagement, and
      reported monetization without claiming that the layers form TAM, SAM, or SOM.
    data:
      nodes:
        - label: AI-native consumer application universe
          value: Top 50 web and top 50 mobile
          detail: Andreessen Horowitz ranking scope; legacy products with added AI features were excluded.
        - label: Ranked AI video category
          value: Hailuo
          detail: March 2025 web rankings show multiple scaled providers rather than one consolidated market.
        - label: Mobile ranking qualification
          value: More than 8 million MAU
          detail: Minimum reported threshold to enter the mobile usage list; not a PixVerse metric.
        - label: PixVerse registered reach
          value: More than 12 million users
          detail: Company figure reported by Yicai Global in December 2024.
        - label: PixVerse active reach
          value: Almost 6 million MAU
          detail: Company figure reported by Yicai Global in December 2024.
        - label: Later reported monetization
          value: More than US$40 million ARR
          detail: End-2025 company figure reported by Yicai Global in March 2026; not audited revenue.
    approximationNotes: >-
      This is an evidence hierarchy, not a value-proportional or nested funnel. Metrics use different populations and
      periods and must not be added, divided, or interpreted as TAM, SAM, or SOM.
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM009
      - CM015
