          - type: figure
            figureRef: FI001
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI007
              - CI008
              - CI013
              - CI014
      - number: '4.2'
        title: Scale signals are strong, while revenue quality remains unverified
        blocks:
          - type: paragraph
            body: >-
              Yicai reported more than $40 million of ARR at the end of 2025, more than 100 million users in October
              2025, and more than 16 million monthly active users in the same snapshot. Earlier December 2024 reporting
              described more than 12 million users and nearly six million monthly active users, showing rapid
              top-of-funnel expansion. These figures are useful traction indicators, but ARR is not revenue and
              registered or active users are not paying customers. The strongest skeptical source in the assigned pool
              characterizes the ARR as unaudited company disclosure and notes that independent audited financial
              statements are not public. No retained source provides an ARR definition, beginning-to-ending bridge,
              bookings, deferred revenue, churn, net revenue retention, cohort retention, paid conversion, or customer
              concentration. Revenue quality therefore remains a diligence question rather than an underwritten
              conclusion.
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI006
              - CI008
              - CI013
      - number: '4.3'
        title: Compute intensity and financing capacity pull in opposite directions
        blocks:
          - type: paragraph
            body: >-
              A July 2026 report put cumulative Series C financing at RMB2.98 billion, or $439 million, and March
              reporting said proceeds were intended for research and development, new businesses, and global expansion.
              Earlier financing disclosures likewise named computing resources, talent, product iteration, and market
              coverage as uses of funds. Those priorities are consistent with a compute- and research-intensive model,
              but the gross amount financed is not cash on hand. The public record does not disclose AIsphere's cash
              balance, monthly cash burn, debt, contractual compute commitments, or runway. As a directional competitor
              benchmark rather than an AIsphere fact, Adobe's audited filing identifies hosting, data-center, and
              AI-inference costs within subscription cost of revenue. AIsphere provides none of the comparable
              gross-margin or per-generation cost data needed to test whether current pricing absorbs those delivery
              costs.
            claimRefs:
              - CI009
              - CI010
              - CI011
              - CI012
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI008
              - CI009
              - CI012
              - CI013
              - CI014
              - CI016
      - number: '4.4'
        title: Financial verdict and underwriting threshold
        blocks:
          - type: paragraph
            body: >-
              The financial case is promising but not yet underwritable from public information. Reported ARR and usage
              scale suggest commercial traction, while the latest financing materially expands the resources available
              for model development and distribution. Neither signal resolves revenue durability or capital efficiency:
              no source bridges ARR to recognized revenue, identifies recurring versus consumption revenue, or
              quantifies gross margin, inference cost, acquisition efficiency, retention, burn, and runway. The
              appropriate underwriting stance is therefore to treat the public metrics as management traction indicators
              and the financing as gross capital raised, not as proof of cash availability or profitability.
              Investment-grade diligence requires audited financial statements, monthly cohort and revenue bridges,
              product-level gross margins, cloud and GPU commitments, and a board-approved cash plan tied to explicit
              next-round triggers.
            claimRefs:
              - CI002
              - CI003
              - CI008
              - CI012
              - CI013
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: ARR is not audited revenue
            body: >-
              The more-than-$40-million figure is a reported annual recurring run-rate without a public definition,
              customer bridge, recognition policy, or audited financial statement.
            calloutType: risk
            claimRefs:
              - CI003
              - CI008
              - CI016
          - type: callout
            title: Make unit economics and liquidity the next diligence gate
            body: >-
              Require product-level revenue and gross-margin bridges, paid cohorts, CAC/payback, cloud and GPU
              commitments, cash, debt, and monthly burn before underwriting growth or runway.
            calloutType: recommendation
            claimRefs:
              - CI002
              - CI012
              - CI013
              - CI014
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surfaces and customer workflow
        blocks:
          - type: paragraph
            body: >-
              PixVerse is presented as a video-generation platform that turns text, images, and other media inputs into
              short video clips, reducing the need for a conventional edit-first workflow. Secondary reporting documents
              a sequence of workflow additions rather than a single SKU: text-, image-, and character-driven generation,
              Character2Video for visual consistency, and a video-to-video function that can extend or generate clips
              from existing footage. This breadth supports both low-friction consumer creation and creator-oriented
              transformation of source material, but the evidence does not quantify usable-output rates or editing time
              saved. The product therefore appears broad at the feature level while its measurable workflow advantage
              remains unverified. Public chronologies also describe web, mobile, and API delivery surfaces, although no
              first-party API documentation was available in the assigned evidence.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE011
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE006
              - CE007
              - CE009
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE006
              - CE007
              - CE009
      - number: '5.2'
        title: Architecture, maturity, and roadmap
        blocks:
          - type: paragraph
            body: >-
              The clearest disclosed technical progression runs from a Diffusion-plus-Transformer generation stack and a
              claimed self-developed spatiotemporal attention mechanism in PixVerse V2 to an autoregressive design for
              R1. A December 2024 report placed V3.5 in internal testing with generation times below 30 seconds, while
              March 2026 reporting described R1 as supporting real-time generation and continuous scene extension. BigGo
              further reported an Omni multimodal architecture and an IRE engine intended to compress a conventional
              multi-step generation process. Those details form a plausible architecture narrative, not an independently
              benchmarked system description. The most material maturity warning is inconsistency between promoted and
              reportedly delivered R1 resolution, latency, and API availability. R1 should therefore be underwritten as
              an emerging product direction rather than a proven production platform.
            claimRefs:
              - CE004
              - CE005
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE004
              - CE007
              - CE008
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE007
              - CE014
              - CE015
              - CE016
      - number: '5.3'
        title: Differentiation and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              AIsphere's differentiation thesis combines end-user workflow packaging with a model-level roadmap.
              Character consistency, multiple input modes, and video-to-video transformation address visible creator
              jobs, while R1 attempts to move from finite clip generation toward interactive scene evolution.
              Independent reporting also places interactive world models within a wider investment race among Chinese
              technology platforms, which means the category is strategically important but unlikely to remain
              uncontested. Public funding coverage indicates that substantial capital is being directed toward research,
              computing resources, and iteration; it does not demonstrate lower inference cost, superior uptime, or
              defensible access to compute. The architecture still depends on undisclosed training data, model
              evaluation, serving economics, and integration quality. Without reproducible benchmarks or customer-side
              implementation evidence, the differentiation case is promising but not yet durable.
            claimRefs:
              - CE003
              - CE004
              - CE007
              - CE010
              - CE011
      - number: '5.4'
        title: Trust, safety, privacy, and quality controls
        blocks:
          - type: paragraph
            body: >-
              The regulatory baseline is clearer than AIsphere's implementation evidence. China's generative-AI measures
              apply to public mainland services generating text, images, audio, or video and impose obligations around
              lawful training data, intellectual property, personal information, user-input confidentiality, data
              minimization, stable service, and labeling of generated images and video. Separate 2025 guidelines require
              visible labels for AI-generated online content from September 1, 2025. These duties are relevant to Paiwo
              AI and any mainland-facing API, but they do not prove that AIsphere has implemented compliant controls.
              The assigned pool contains no trust center, security certification, incident history, model card,
              content-moderation metrics, uptime record, or independent audit. Investors should treat compliance and
              quality systems as diligence requirements, not inferred product attributes.
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is better evidenced than production maturity
            body: >-
              Public sources support multiple generation modes and an R1 roadmap, but they do not establish benchmarked
              quality, uptime, serving cost, or scaled API use.
            calloutType: insight
            claimRefs:
              - CE002
              - CE007
              - CE009
          - type: callout
            title: Regulatory duties are not proof of controls
            body: >-
              Mainland rules specify data, privacy, service-stability, and labeling obligations; the evidence pool does
              not show AIsphere's implementation or audit results.
            calloutType: risk
            claimRefs:
              - CE012
              - CE013
              - CE014
              - CE015
              - CE016
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and payer visibility
        blocks:
          - type: paragraph
            body: >-
              The observable base is led by global self-serve creators using PixVerse, with a separate Paiwo AI surface
              for China and an emerging enterprise or industrial motion. Multiples classifies AIsphere as B2B with a
              subscription model, while AppBrain describes a free Android app with ads and user complaints involving
              subscriptions and credits. These signals identify plausible buyers and payers, but they do not disclose
              the mix among free creators, subscribers, credit purchasers, enterprise buyers, or channel-sourced
              accounts. Reported user totals also combine products and geographies, so no reliable segment-level revenue
              or strategic-value ranking can be constructed from the retained public evidence.
            claimRefs:
              - CU011
              - CU014
              - CU016
          - type: table
            tableRef: TU001
            claimRefs:
              - CU003
              - CU004
              - CU005
