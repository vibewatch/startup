              - CU012
              - CU014
              - CU015
              - CU016
      - number: '6.3'
        title: Named customer proof and deployment quality
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence contains only one named enterprise relationship with deployment language: Uristocrat
              reports an existing deployment agreement with Alibaba, which is also a lead investor according to Caixin.
              Public scope, commercial terms, production status, usage volume, renewal history, and measured outcomes
              are absent, so the relationship cannot yet be treated as an independently validated production customer.
              AIsphere's co-founder also reported inquiries from gaming and short-drama clients for PixVerse R1, but
              inquiries are not pilots, deployments, or paid contracts. The named proof set is therefore too sparse to
              establish a repeatable enterprise sales motion.
            claimRefs:
              - CU012
              - CU013
              - CU016
          - type: table
            tableRef: TU003
            claimRefs:
              - CU012
              - CU013
              - CU016
      - number: '6.4'
        title: Durability, expansion, and concentration risk
        blocks:
          - type: paragraph
            body: >-
              The strongest monetization reference is more than USD40 million of annual recurring revenue at the end of
              2025, but the public record does not bridge that figure to paying users, customer cohorts, products,
              geographies, or enterprise accounts. No NRR, GRR, churn, renewal, contract-length, or top-customer data is
              disclosed in the retained sources. Alibaba's simultaneous roles as investor and reported deployment
              counterpart could accelerate cloud distribution and industrial adoption, but also create channel and
              infrastructure dependence that cannot be quantified. Individual AppBrain comments allege lost subscription
              benefits, crashes, prompt failures, and credit consumption; these anecdotes do not establish prevalence,
              yet they identify billing and reliability diligence paths directly relevant to retention.
            claimRefs:
              - CU010
              - CU012
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
