            claimRefs:
              - CR001
              - CR004
              - CR006
              - CR007
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR016
      - number: '7.3'
        title: Dependencies, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Alibaba is visible on both sides of AIsphere's risk ledger. Alibaba led the enlarged Series C, and Alibaba
              Cloud is described as providing full-stack infrastructure and model services for PixVerse training and
              inference, global deployment, and security compliance. This is a credible mitigation for capacity and
              international operations, but it also creates a potentially correlated capital, cloud, and ecosystem
              dependency; the reviewed sources disclose no spend share, minimum commitments, portability plan, recovery
              objectives, or exit rights. Investors should monitor cloud concentration, gross-margin movement, paid
              conversion, service incidents, labeling-control audit failures, and model-ranking deterioration.
              Thesis-break triggers are an inability to produce audited unit economics, a material labeling or safety
              enforcement action, repeated severe outages without tested recovery, or loss of strategic infrastructure
              support without a funded migration plan.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR006
              - CR010
              - CR013
              - CR014
              - CR015
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Kill criteria require private evidence
            body: >-
              Pause investment if AIsphere cannot provide an audited ARR-to-revenue bridge, product-level gross margin
              and burn, tested cloud portability and recovery evidence, or control testing for required AI-content
              labels; treat a material enforcement action or repeated severe outage without remediation as a thesis
              break.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR010
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The investable signal is real but incomplete. By July 2026, Caixin reported that AIsphere's Series C had
              reached CNY2.98 billion (USD439 million), updating the USD300 million financing reported in March.
              Independent reporting also repeated more than USD40 million of ARR and more than 16 million monthly active
              users, while a16z recorded PixVerse moving from its mobile brink list into the core ranking. Those facts
              support continued diligence, not a price-insensitive commitment. No retained source supplies a current
              post-money valuation, liquidation waterfall, ownership schedule, gross margin, retention, or
              compute-adjusted contribution margin. Accordingly, the recommendation is research-more, confidence is
              medium, risk is high, and valuation stance is undetermined pending primary financing and operating
              evidence.
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV009
              - CV015
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV010
              - CV011
              - CV015
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV003
              - CV009
              - CV010
              - CV015
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis rests on three externally visible signals: rapid financing capacity, substantial reported
              audience scale, and an independently observed move into a top consumer-AI mobile ranking. The addressable
              category also has multiple end-user lanes, including marketing, entertainment, education, social media,
              enterprises, SMEs, and individual creators. The anti-thesis is that reported registrations and monthly
              activity are not evidence of paid retention, durable margins, or efficient inference economics. Capital
              needs may remain high because financing proceeds are repeatedly described as funding model research,
              compute, talent, and expansion. Compliance obligations for public generative-AI services and
              synthetic-content labeling add execution cost and service-interruption risk, making a strong product
              signal insufficient on its own.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.3'
        title: Scenarios and comparable context
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not support a defensible absolute valuation range, so the scenario framework avoids
              invented multiples. The bull case requires audited ARR growth, paid retention, and gross-margin evidence
              that converts product popularity into repeatable economics. The base case treats the reported
              USD40-million-plus ARR as directional until reconciled to revenue and cash collection, and keeps the
              company on a diligence track. The bear case is a down-round or structured-financing outcome if growth
              quality, safety controls, or compute economics disappoint. Moonshot AI's reported USD20 billion valuation
              and more than USD200 million ARR illustrate abundant Chinese-AI capital, but its general-model business
              and roughly 100-times reported ARR marker are context, not a direct AIsphere benchmark.
            claimRefs:
              - CV003
              - CV007
              - CV012
              - CV013
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV009
              - CV010
              - CV011
              - CV015
              - CV016
      - number: '8.4'
        title: Exit readiness, diligence asks, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              Exit readiness cannot be established from funding headlines. Before underwriting an IPO, strategic sale,
              or secondary path, investors need an audited ARR bridge, cohort retention, gross and contribution margins,
              compute commitments, geographic revenue mix, and the complete Series C capitalization and preference
              package. They also need evidence that labeling, filing, content governance, and incident response controls
              operate across Chinese and international product surfaces. Thesis-break triggers are failure to reconcile
              reported ARR to collected revenue, sustained paid-user or retention deterioration, material regulatory
              suspension, punitive preference overhang, or an entry price that assumes premium economics before those
              economics are demonstrated. Independent mobile-ranking progress is encouraging, but it is only an
              engagement signal and not an exit-quality metric.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV014
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price-sensitive conclusion
            body: >-
              Treat reported scale and financing as reasons to continue diligence, not as substitutes for a disclosed
              entry price and verified operating economics.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV015
              - CV016
          - type: callout
            title: No public valuation range
            body: >-
              A precise fair-value range would be false precision until the Series C terms, capitalization, audited ARR
              bridge, retention, and margin structure are obtained.
            calloutType: risk
            claimRefs:
              - CV015
              - CV016
