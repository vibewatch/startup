    claimRefs: [CM003, CM004, CM005, CM007, CM009]
  - id: TM003
    title: Segment, Buyer, User, and Adoption Map
    columns:
      - Segment
      - User
      - Payer or budget owner
      - Workflow
      - Adoption trigger
      - Evidence limitation
    rows:
      - - Casual consumer
        - Social and entertainment creator
        - Individual user
        - Prompt or image to short video
        - Free access, novelty, speed, and shareable effects
        - Freemium positioning is public, but conversion and retention are not
      - - Prosumer or independent creator
        - Professional creator or small team
        - Individual or small-business creative budget
        - Iterative controlled content production
        - Better prompt adherence, motion control, and faster output
        - PixVerse-specific willingness to pay is not disclosed
      - - Enterprise marketing and media
        - Creative, advertising, animation, or product team
        - Marketing, production, procurement, or technology budget
        - API-integrated commercial content generation
        - Lower production time and workflow integration
        - Partner count is reported without contract value or production-volume detail
      - - Gaming and short-drama development
        - Developer or studio creative team
        - Product, studio, or R&D budget
        - Real-time scene extension and prospective AI-native engine use
        - Interactive generation and continuous scenes
        - Reported inquiries are not disclosed deployments or revenue
    notes: >-
      Budget ownership is inferred where publishers identify users or applications but do not name the
      contracting entity; public evidence does not disclose segment revenue, conversion, or sales-cycle data.
    claimRefs: [CM008, CM011, CM012, CM015]
figures:
  - id: FM001
    title: Evidence Ladder for the Addressable AI Video Market
    type: pyramid
    summary: >-
      Public evidence narrows from an AI-native application universe to category adoption, PixVerse
      engagement, and reported monetization without claiming that the layers form TAM, SAM, or SOM.
    data:
      nodes:
        - label: AI-native consumer application universe
          value: Top 50 web and top 50 mobile
          detail: Andreessen Horowitz ranking scope; legacy products with added AI features were excluded.
        - label: Ranked AI video category
          value: Hailuo #12, Kling #17, Sora #23
          detail: March 2025 web rankings show multiple scaled providers rather than one consolidated market.
        - label: Mobile ranking qualification
          value: More than 8 million MAU
          detail: Minimum reported threshold to enter the mobile usage list; not a PixVerse metric.
        - label: PixVerse registered reach
          value: More than 12 million users
          detail: Company figure reported by Yicai Global in December 2024.
        - label: PixVerse active reach
          value: Almost 6 million MAU
          detail: Company figure reported by Yicai Global in December 2024.
        - label: Later reported monetization
          value: More than US$40 million ARR
          detail: End-2025 company figure reported by Yicai Global in March 2026; not audited revenue.
    approximationNotes: >-
      This is an evidence hierarchy, not a value-proportional or nested funnel. Metrics use different
      populations and periods and must not be added, divided, or interpreted as TAM, SAM, or SOM.
    claimRefs: [CM003, CM004, CM005, CM009, CM015]
callouts:
  - calloutType: risk
    title: Reach is not serviceable revenue
    body: >-
      The public record does not bridge registered users to paying accounts, retained cohorts,
      gross margin, or compute-adjusted contribution. Consumer-AI research also shows that usage
      leaders and mobile-subscription revenue leaders overlap only partially.
    claimRefs: [CM009, CM015]
