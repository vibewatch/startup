        - Product-ranking evidence, not category revenue or addressable spend
      - - Yicai Global
        - December 2024
        - Global PixVerse user base
        - More than 12 million users and almost 6 million MAU
        - Not disclosed
        - Company figures reported by financial media
        - Medium
        - No paying-user count, cohort retention, or geographic mix
      - - Yicai Global
        - End-2025 metrics reported March 2026
        - Global PixVerse and Paiwo AI user base
        - More than 100 million users, more than 16 million MAU, and more than US$40 million ARR
        - Not disclosed
        - Company and co-founder figures reported by financial media
