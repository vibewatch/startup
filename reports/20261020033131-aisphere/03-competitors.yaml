      - [ByteDance / Seedance 2.0, Unknown, Unknown, "AI video rival only", "Packaging and channel terms unavailable", "Incumbent bundling risk cannot be priced"]
      - [Runway, Unknown, Unknown, "Named competitor only", "Pricing evidence unavailable", "No defensible cost comparison"]
