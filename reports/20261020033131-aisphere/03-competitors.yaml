      - [Kling AI, Unknown, Unknown, "Named competitor only", "Pricing evidence unavailable", "No defensible cost comparison"]
      - [Internal build / multi-vendor workflow, Unknown, "Compute, API, tooling, and labor mix", "Analytical substitute; components not costed", "Workload and staffing assumptions unavailable", "Build-versus-buy case remains open"]
    notes: >-
