company:
  name: AIsphere
chapter:
  number: 8
  title: Valuation
  summary: >-
    AIsphere has credible financing momentum, reported consumer scale, and more than
    USD40 million of ARR, but the retained public record does not disclose a current
    equity valuation, audited unit economics, or financing preferences. The
    recommendation is research-more with high risk and no price-supported buy call.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The investable signal is real but incomplete. By July 2026, Caixin reported
      that AIsphere's Series C had reached CNY2.98 billion (USD439 million), updating
      the USD300 million financing reported in March. Independent reporting also
      repeated more than USD40 million of ARR and more than 16 million monthly active
      users, while a16z recorded PixVerse moving from its mobile brink list into the
      core ranking. Those facts support continued diligence, not a price-insensitive
      commitment. No retained source supplies a current post-money valuation,
      liquidation waterfall, ownership schedule, gross margin, retention, or
      compute-adjusted contribution margin. Accordingly, the recommendation is
      research-more, confidence is medium, risk is high, and valuation stance is
      undetermined pending primary financing and operating evidence.
    claimRefs: [CV001, CV003, CV006, CV009, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis rests on three externally visible signals: rapid financing capacity,
      substantial reported audience scale, and an independently observed move into a
      top consumer-AI mobile ranking. The addressable category also has multiple
      end-user lanes, including marketing, entertainment, education, social media,
      enterprises, SMEs, and individual creators. The anti-thesis is that reported
      registrations and monthly activity are not evidence of paid retention, durable
      margins, or efficient inference economics. Capital needs may remain high because
      financing proceeds are repeatedly described as funding model research, compute,
      talent, and expansion. Compliance obligations for public generative-AI services
      and synthetic-content labeling add execution cost and service-interruption risk,
      making a strong product signal insufficient on its own.
    claimRefs: [CV002, CV003, CV004, CV005, CV008, CV009, CV010, CV011, CV014]
    tableRefs: [TV002]
  - id: scenarios-and-comparable-context
    title: Scenarios and comparable context
    body: >-
      Public evidence does not support a defensible absolute valuation range, so the
      scenario framework avoids invented multiples. The bull case requires audited
      ARR growth, paid retention, and gross-margin evidence that converts product
      popularity into repeatable economics. The base case treats the reported
      USD40-million-plus ARR as directional until reconciled to revenue and cash
      collection, and keeps the company on a diligence track. The bear case is a
      down-round or structured-financing outcome if growth quality, safety controls,
      or compute economics disappoint. Moonshot AI's reported USD20 billion valuation
      and more than USD200 million ARR illustrate abundant Chinese-AI capital, but its
      general-model business and roughly 100-times reported ARR marker are context,
      not a direct AIsphere benchmark.
    claimRefs: [CV003, CV007, CV012, CV013, CV015, CV016]
    tableRefs: [TV003]
  - id: exit-readiness-and-thesis-breaks
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Exit readiness cannot be established from funding headlines. Before underwriting
      an IPO, strategic sale, or secondary path, investors need an audited ARR bridge,
      cohort retention, gross and contribution margins, compute commitments, geographic
      revenue mix, and the complete Series C capitalization and preference package.
      They also need evidence that labeling, filing, content governance, and incident
      response controls operate across Chinese and international product surfaces.
      Thesis-break triggers are failure to reconcile reported ARR to collected revenue,
      sustained paid-user or retention deterioration, material regulatory suspension,
      punitive preference overhang, or an entry price that assumes premium economics
      before those economics are demonstrated. Independent mobile-ranking progress is
      encouraging, but it is only an engagement signal and not an exit-quality metric.
    claimRefs: [CV009, CV010, CV011, CV014, CV015, CV016]
