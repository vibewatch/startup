    claimRefs: [CV001, CV003, CV005, CV009, CV010, CV011, CV014]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns: [Case, Assumptions, Valuation or return logic, Probability signal, Downside trigger]
    rows:
      - [Bull, "Audited ARR compounds, paid retention is strong, and margins improve as inference cost falls", "Premium outcome may be supportable, but no numeric range is defensible from public evidence", "Sustained independent usage rank plus verified paid cohorts", "Growth fails to convert into cash contribution"]
      - [Base, "Reported USD40M-plus ARR is broadly accurate but economics remain immature", "Research-more until primary metrics and entry terms permit a model", "Financing access and broad user reach", "Flat paid retention or preference-heavy financing"]
      - [Bear, "ARR quality disappoints, compute cost stays high, or compliance disrupts distribution", "Down-round or structured capital becomes plausible; no precise floor is supportable", "Capital needs remain tied to R&D and compute", "Regulatory suspension, weak collections, or punitive terms"]
    notes: "Scenarios are conditional decision paths, not probability-weighted forecasts; public evidence is insufficient for numeric valuation ranges or target returns."
    claimRefs: [CV003, CV005, CV009, CV010, CV011, CV015, CV016]
