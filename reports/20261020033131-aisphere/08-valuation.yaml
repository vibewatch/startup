callouts:
  - calloutType: recommendation
    title: Price-sensitive conclusion
    body: >-
      Treat reported scale and financing as reasons to continue diligence, not as
      substitutes for a disclosed entry price and verified operating economics.
    claimRefs: [CV001, CV003, CV015, CV016]
  - calloutType: risk
    title: No public valuation range
    body: >-
      A precise fair-value range would be false precision until the Series C terms,
      capitalization, audited ARR bridge, retention, and margin structure are obtained.
    claimRefs: [CV015, CV016]
