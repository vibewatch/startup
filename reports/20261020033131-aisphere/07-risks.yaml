    columns:
      - Risk or rule
      - Jurisdiction and status
      - Likelihood
      - Severity
      - Visible mitigation
      - Residual exposure and diligence path
    rows:
      - - AI-generated content must carry visible identifying marks
        - China; effective September 1, 2025
        - High for covered output
        - High
        - No company-specific implementation evidence was retained
        - Obtain output-label specifications, control tests, and compliance audit results
      - - Labels may not be deleted, tampered with, fabricated, or concealed
        - China; effective requirement
        - Medium-high across downstream sharing
        - High
        - No persistence or anti-tamper evidence was retained
        - Test exports and edits across PixVerse clients, APIs, and third-party platforms
      - - Privacy, copyright, litigation, and cross-border controls
        - Global user distribution; status not established by the assigned sources
        - Unknown
        - Potentially high
        - Alibaba Cloud is described as supporting security compliance
        - Obtain DPA, subprocessors, IP policy, claims history, regulator correspondence, and jurisdiction matrix
    notes: >-
      Partial public-source register through 2026-10-20; likelihood, severity, and residual
      exposure are analyst judgments, and "unknown" means the assigned evidence did not
      establish the fact rather than that no risk exists.
    enumerationScope:
      coverage: partial
      basis: >-
        Public regulatory and company-specific sources assigned to this chapter through
        2026-10-20; court, regulator, privacy, and IP databases were not exhaustively covered.
    claimRefs: [CR001, CR002, CR003, CR007, CR014]
  - id: TR002
    title: Operational, financial, quality, and security risk register
    columns:
      - Failure mode
      - Evidence signal
      - Likelihood
      - Severity
      - Mitigation maturity
      - Residual exposure or unresolved gap
    rows:
      - - Compute cost or capacity outpaces monetization
        - Prior limited capital constrained training; new funds target R&D and compute
        - Medium
        - High
        - Developing
        - Audited burn, inference cost, gross margin, and capacity commitments are missing
      - - Reported ARR and cost coverage do not translate into durable cash economics
        - More than USD40 million ARR and subscription cost coverage were reported
        - Medium
        - High
        - Unverified
        - ARR bridge, recognized revenue, churn, contribution margin, and cash flow are missing
      - - Viral acquisition fails to convert or retain
        - Viral templates reportedly generated more than ten billion views
        - Medium
        - Medium-high
        - Developing
        - Paid conversion, cohort retention, acquisition mix, and platform dependence are missing
      - - Outage, abuse, fraud, or unsafe-content event at global scale
        - More than 100 million users and more than 16 million monthly active users were reported
        - Unknown
        - High
        - Unverified
        - No assigned source disclosed uptime, incident history, moderation precision, or recovery testing
    notes: >-
      Public claims are retained with their original periods and metric names; qualitative
      grades are analyst assessments, and ARR, subscription cost coverage, funding, and user
      counts are not treated as cash flow, margin, cash availability, or reliability evidence.
    claimRefs: [CR006, CR007, CR008, CR009, CR010, CR011, CR012]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty or gatekeeper
      - Role and concentration signal
      - Failure scenario
      - Severity
      - Visible mitigation
      - Residual exposure
    rows:
      - - Training, inference, global deployment, and compliance infrastructure
        - Alibaba Cloud
        - Named full-stack provider; spend and workload shares undisclosed
        - Service, pricing, policy, or relationship change disrupts PixVerse
        - High
        - Global infrastructure and security-compliance support are described
        - Portability, recovery objectives, minimum commitments, and exit rights are unknown
      - - Growth capital and strategic alignment
        - Alibaba-led Series C and other financial and strategic investors
        - CNY2.98 billion Series C reported by July 2026
        - Funding access tightens before economics become self-sustaining
        - High
        - Enlarged round provides additional financing capacity
        - Cash balance, burn, preferences, governance rights, and future needs are unknown
      - - Content distribution and regulatory acceptance
        - Platforms and Chinese internet regulators
        - AI-output labels must survive production and dissemination
        - Label-control failure causes distribution restrictions or enforcement
        - High
        - Binding labeling requirements provide a defined control objective
        - Company control design, audit evidence, and downstream enforcement are unknown
    notes: >-
      Concentration is described qualitatively because no source disclosed workload, spend,
      revenue, voting-right, or platform-distribution shares; severity and residual exposure
      are analyst judgments tied to the cited dependency evidence.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR014]
