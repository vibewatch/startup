company:
  name: AIsphere
chapter:
  number: 7
  title: Risks
  summary: >-
    AIsphere's most consequential public-evidence risks are compliance execution under
    China's AI-content labeling rules, compute and financing concentration around Alibaba,
    and an operating model whose disclosed scale is not matched by audited margin, burn,
    reliability, or incident data. The mitigations visible in public sources are real but
    incomplete: fresh capital and Alibaba Cloud support reduce near-term capacity risk while
    increasing dependency and leaving contractual resilience unverified.
sections:
  - id: regulatory-legal-exposure
    title: Regulatory and legal exposure
    body: >-
      China's AI-content labeling regime is the clearest confirmed regulatory obligation in
      the assigned evidence. The rules took effect on September 1, 2025, require visible
      marks on AI-generated content, and prohibit deleting, tampering with, fabricating, or
      concealing identifying labels. For a globally distributed video product, this creates
      an end-to-end implementation burden across generation, export, sharing, and downstream
      modification rather than a one-time disclosure. The public record reviewed here does
      not establish AIsphere's technical controls, audit coverage, privacy posture, IP
      indemnities, litigation history, or regulator correspondence. Those omissions make
      compliance maturity unscorable and justify treating privacy, copyright, and
      cross-border exposure as material diligence items rather than asserting that no
      incidents or disputes exist.
    claimRefs: [CR001, CR002, CR003, CR007]
    tableRefs: [TR001]
  - id: operating-financial-resilience
    title: Operating and financial resilience
    body: >-
      Financing capacity has improved sharply: reporting moved from a USD300 million Series
      C in March 2026 to CNY2.98 billion, or about USD439 million, by July. That capital can
      fund models, compute, hiring, and international expansion, but funding raised is not
      cash available and does not answer burn, gross margin, working-capital, or inference
      cost questions. Yicai reported more than USD40 million of ARR at the end of the prior
      year, while the CEO separately said subscription revenue covered costs; neither
      disclosure is an audited bridge from ARR to recognized revenue, contribution margin,
      or cash flow. Rapid user growth and viral templates show demand, yet the absence of
      uptime, latency, moderation, fraud-loss, and incident statistics leaves service
      reliability and safety exposure materially unresolved at the disclosed scale.
    claimRefs: [CR004, CR005, CR006, CR007, CR008, CR009, CR010, CR011, CR012, CR016]
    tableRefs: [TR002]
    figureRefs: [FR001]
  - id: dependencies-kill-criteria
    title: Dependencies, monitoring, and thesis-break triggers
    body: >-
      Alibaba is visible on both sides of AIsphere's risk ledger. Alibaba led the enlarged
      Series C, and Alibaba Cloud is described as providing full-stack infrastructure and
      model services for PixVerse training and inference, global deployment, and security
      compliance. This is a credible mitigation for capacity and international operations,
      but it also creates a potentially correlated capital, cloud, and ecosystem dependency;
      the reviewed sources disclose no spend share, minimum commitments, portability plan,
      recovery objectives, or exit rights. Investors should monitor cloud concentration,
      gross-margin movement, paid conversion, service incidents, labeling-control audit
      failures, and model-ranking deterioration. Thesis-break triggers are an inability to
      produce audited unit economics, a material labeling or safety enforcement action,
      repeated severe outages without tested recovery, or loss of strategic infrastructure
      support without a funded migration plan.
    claimRefs: [CR001, CR002, CR003, CR004, CR006, CR010, CR013, CR014, CR015]
    tableRefs: [TR003]
