callouts:
  - calloutType: risk
    title: Kill criteria require private evidence
    body: >-
      Pause investment if AIsphere cannot provide an audited ARR-to-revenue bridge, product-level
      gross margin and burn, tested cloud portability and recovery evidence, or control testing
      for required AI-content labels; treat a material enforcement action or repeated severe
      outage without remediation as a thesis break.
    claimRefs: [CR001, CR002, CR003, CR006, CR010, CR014]
