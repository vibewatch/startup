schemaVersion: "report-v2"
artifact: customers
slug: aisphere
runDate: 2026-10-20
company:
  name: AIsphere
chapter:
  number: 6
  title: Customers
  summary: >-
    PixVerse has demonstrated large global consumer reach, including more than 150 million
    registered users by July 2026 and strong independent Android distribution signals by
    October 2026. The investable customer case remains incomplete because public evidence
    does not disclose paid-user conversion, retention, segment economics, or customer
    concentration, while named enterprise proof is limited to a reported Alibaba deployment
    agreement and unnamed gaming and short-drama inquiries.
sections:
  - id: customer-segments-and-payers
    title: Customer segments and payer visibility
    body: >-
      The observable base is led by global self-serve creators using PixVerse, with a separate
      Paiwo AI surface for China and an emerging enterprise or industrial motion. Multiples
      classifies AIsphere as B2B with a subscription model, while AppBrain describes a free
      Android app with ads and user complaints involving subscriptions and credits. These
      signals identify plausible buyers and payers, but they do not disclose the mix among
      free creators, subscribers, credit purchasers, enterprise buyers, or channel-sourced
      accounts. Reported user totals also combine products and geographies, so no reliable
      segment-level revenue or strategic-value ranking can be constructed from the retained
      public evidence.
    claimRefs:
      - CU011
      - CU014
      - CU016
    tableRefs:
      - TU001
  - id: adoption-trajectory
    title: Adoption trajectory and current usage
    body: >-
      Reported reach expanded rapidly: PixVerse moved from more than 12 million users and
      nearly 6 million monthly active users in December 2024 to a combined PixVerse and Paiwo
      base above 100 million users and 16 million monthly actives in October 2025. By July
      2026, secondary reporting cited more than 150 million registered users in over 175
      countries but only roughly 15 million monthly actives. AppBrain independently estimated
      78 million Android installs and 1.7 million installs in the latest 30 days as of October
      18, 2026. The registration curve is strong, but the monthly-active series appears flat
      to slightly lower across unlike reporting dates, leaving repeat use and conversion
      durability unproven.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU015
    tableRefs:
      - TU002
    figureRefs:
      - FU001
  - id: named-customer-proof
    title: Named customer proof and deployment quality
    body: >-
      The assigned evidence contains only one named enterprise relationship with deployment
      language: Uristocrat reports an existing deployment agreement with Alibaba, which is
      also a lead investor according to Caixin. Public scope, commercial terms, production
      status, usage volume, renewal history, and measured outcomes are absent, so the
      relationship cannot yet be treated as an independently validated production customer.
      AIsphere's co-founder also reported inquiries from gaming and short-drama clients for
      PixVerse R1, but inquiries are not pilots, deployments, or paid contracts. The named
      proof set is therefore too sparse to establish a repeatable enterprise sales motion.
    claimRefs:
      - CU012
      - CU013
      - CU016
    tableRefs:
      - TU003
  - id: durability-expansion-and-risk
    title: Durability, expansion, and concentration risk
    body: >-
      The strongest monetization reference is more than USD40 million of annual recurring
      revenue at the end of 2025, but the public record does not bridge that figure to paying
      users, customer cohorts, products, geographies, or enterprise accounts. No NRR, GRR,
      churn, renewal, contract-length, or top-customer data is disclosed in the retained
      sources. Alibaba's simultaneous roles as investor and reported deployment counterpart
      could accelerate cloud distribution and industrial adoption, but also create channel
      and infrastructure dependence that cannot be quantified. Individual AppBrain comments
      allege lost subscription benefits, crashes, prompt failures, and credit consumption;
      these anecdotes do not establish prevalence, yet they identify billing and reliability
      diligence paths directly relevant to retention.
    claimRefs:
      - CU010
      - CU012
      - CU014
      - CU015
      - CU016
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Observable scale
      - Revenue / strategic value
      - Material gap
    rows:
      - - Global self-serve creators
        - "User: creator; payer: subscriber or credit buyer, mix undisclosed"
        - Text-, image-, and video-to-video creation
        - ">150M registered users across 175+ countries by July 2026"
        - Large acquisition funnel; segment revenue not disclosed
        - Paying conversion, retention, and geographic mix
      - - Android mobile creators
        - "User: mobile creator; payer: in-app subscriber or credit buyer"
        - Mobile AI video generation and effects
        - "AppBrain estimate: 78M installs and 1.7M recent installs as of 2026-10-18"
        - Independent distribution and rating signal; revenue unknown
        - Active-user denominator and paid cohort economics
      - - China-facing Paiwo AI users
        - "User: consumer or creator; payer: undisclosed"
        - Domestic AI video generation
        - Included in the combined >100M-user and >16M-MAU October 2025 disclosure
        - China product presence; standalone value unavailable
        - Product-specific users, revenue, and retention
      - - Enterprise and industrial clients
        - "Buyer: enterprise; user: creative, gaming, or short-drama team"
        - Deployment, content production, and real-time world-model exploration
        - One reported Alibaba deployment agreement plus unnamed sector inquiries
        - Potential distribution and infrastructure leverage
        - Paid-customer count, production scope, outcomes, and concentration
    notes: >-
      Partial segmentation from the assigned public sources; user, install, and inquiry
      metrics use different populations and dates and must not be added together.
    claimRefs:
      - CU003
      - CU004
      - CU005
      - CU007
      - CU008
      - CU011
      - CU012
      - CU013
      - CU016
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric
      - Value
      - Date / period
      - Source basis
      - Confidence
      - Implication and missing denominator
    rows:
      - - Registered or reported users
        - ">12M"
        - "2024-12-18"
        - Yicai and Pandaily reports
        - Medium
        - Early global reach; no paid-user or cohort denominator
      - - Monthly active users
        - "Nearly 6M"
        - "2024-12-18"
        - Yicai and Pandaily reports
        - Medium
        - High reported activity relative to users; methodology undisclosed
      - - Combined PixVerse / Paiwo AI adoption
        - ">100M users; >16M MAU"
        - "2025-10"
        - Yicai reporting, newly fetched in two access forms
        - Medium
        - Scale expanded sharply; product and geography split missing
      - - Registered users and monthly actives
        - ">150M registered; ~15M MAU; 175+ countries"
        - "2026-07"
        - Uristocrat synthesis citing Caixin and other coverage
        - Medium
        - Registration growth continued while reported MAU did not
      - - Android distribution
        - "78M estimated installs; 1.7M installs in prior 30 days"
        - "Updated 2026-10-18"
        - AppBrain independent app estimate
        - Medium
        - Current acquisition remains material; active and paid conversion absent
      - - Android rating
        - "4.46 / 5 from about 4.5M ratings"
        - "Updated 2026-10-18"
        - AppBrain aggregation of Google Play data
        - Medium
        - Broad engagement signal; rating distribution and cohort retention absent
    notes: >-
      Values retain each source's metric name, date, and denominator; registrations, users,
      monthly actives, installs, recent installs, and ratings are not interchangeable.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU007
      - CU008
      - CU009
      - CU015
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer / reference
      - Segment
      - Deployment / use case
      - Production vs. pilot
      - Reported outcome
      - Limitation
    rows:
      - - Alibaba
        - Cloud distribution / enterprise
        - Reported deployment agreement and enterprise distribution relationship
        - Existing agreement reported; production scope not disclosed
        - No customer outcome disclosed
        - Alibaba is also a lead investor; commercial terms and concentration are unknown
      - - Gaming-sector client inquiries
        - Gaming
        - Interest in PixVerse R1 as an AI-native game-engine direction
        - Inquiry only; no named pilot or production deployment
        - No outcome disclosed
        - Customers, conversion, pricing, and usage are undisclosed
      - - Short-drama-sector client inquiries
        - Media / entertainment
        - Interest in real-time video generation and continuous scene extension
        - Inquiry only; no named pilot or production deployment
        - No outcome disclosed
        - Customers, conversion, pricing, and usage are undisclosed
    notes: >-
      Partial enumeration of enterprise references in the assigned eight-source pool;
      inquiries are shown as pipeline signals and are not classified as customers.
    enumerationScope:
      coverage: partial
      basis: >-
        Named and sector-level enterprise references found in the assigned prefetched
        customer evidence available as of the 2026-10-20 run date.
    claimRefs:
      - CU012
      - CU013
      - CU016
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence shows a large creator acquisition funnel but leaves payment,
      retention, and enterprise expansion transitions unmeasured.
    data:
      items:
        - label: Discover
          detail: Viral creative effects and global social distribution attract creators.
          touchpoints:
            - Viral effects
            - Social platforms
            - Creator word of mouth
        - label: Install or visit
          detail: Users enter through the global PixVerse surface or the China-facing Paiwo AI product.
          touchpoints:
            - Android app
            - Global web or app surface
            - Paiwo AI
        - label: Create
          detail: Users generate and edit short-form AI video with text, image, video, and model workflows.
          touchpoints:
            - Prompt creation
            - Image animation
            - Video transformation
        - label: Pay
          detail: Subscription and credit mechanisms are visible, but paid conversion and payer mix are not disclosed.
          touchpoints:
            - Subscription
            - Credits
            - Ads on the free Android app
        - label: Repeat
          detail: Monthly-active disclosures provide snapshots, while renewal, churn, and cohort retention remain unavailable.
          touchpoints:
            - Monthly active use
            - Repeat generation
            - Support and billing
        - label: Expand
          detail: Enterprise expansion appears through an Alibaba agreement and gaming or short-drama inquiries, without quantified outcomes.
          touchpoints:
            - Cloud distribution
            - Enterprise deployment
            - Sector inquiries
    approximationNotes: >-
      Stages are an evidence-based workflow synthesis, not a measured conversion funnel;
      no transition rates or stage populations are inferred.
    claimRefs:
      - CU011
      - CU012
      - CU014
      - CU015
      - CU016
callouts:
  - calloutType: strength
    title: Consumer acquisition is independently visible
    body: >-
