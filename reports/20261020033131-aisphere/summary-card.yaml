  topStrengths:
    - Reported registered reach exceeded 150 million users across more than 175 countries by July 2026.
    - Independent Android distribution data and a16z ranking evidence corroborate broad consumer adoption.
    - Series C financing reached a reported RMB2.98 billion (USD439 million) by July 2026.
