company:
  name: "AIsphere"
chapter:
  number: 1
  title: "Company Overview"
  summary: "AIsphere is a Beijing AI-video company founded in April 2023 whose PixVerse/Paiwo AI platform has progressed from consumer generation tools into APIs and a real-time-video model. Independent reporting supports rapid financing and usage growth through July 2026, but valuation, cumulative capital raised, audited revenue quality, headcount, paying-customer count, governance, and financing terms remain unavailable in the assigned evidence."
sections:
  - id: "identity-and-business-model"
    title: "Identity and business model"
    body: >-
      AIsphere is a Beijing-based AI-video company founded in April 2023. Its main
      product is branded PixVerse overseas and Paiwo AI in China. The company
      describes a self-developed video-generation stack that turns text, images,
      key frames, and reference images into video, while its website also presents
      an API offering for e-commerce, entertainment, games, film, animation, and
      advertising workflows. This establishes a mixed consumer-creator and
      enterprise-infrastructure model, but the retained material does not disclose
      the revenue split between subscriptions, credits, API usage, or other
      channels. Reported user totals therefore describe reach rather than paying
      customers, and the reported ARR figure should not be treated as audited
      accounting revenue.
    claimRefs: [CO001, CO002, CO003, CO009, CO010]
    tableRefs: [TO001]
  - id: "leadership-and-governance"
    title: "Leadership and governance"
    body: >-
      Public evidence centers on founder Wang Changhu, whose prior computer-vision
      and AI roles included Microsoft Research Asia and ByteDance, and on co-founder
      Xie Xuzhang, who discussed the March 2026 financing and product direction.
      That technical pedigree is relevant founder-market fit, but the same evidence
      concentration creates key-person risk: strategy, technical credibility, and
      public narrative are repeatedly attached to a small number of named leaders.
      The assigned sources do not identify the board, voting rights, executive bench,
      succession plan, or material leadership changes. Accordingly, the leadership
      table is intentionally partial and should not be read as a complete management
      or governance roster.
    claimRefs: [CO004, CO005, CO015]
    tableRefs: [TO002]
  - id: "funding-scale-and-stakeholders"
    title: "Funding, scale, and stakeholders"
    body: >-
      Financing accelerated from the 2024 A-series rounds to a reported $60 million
      Series B and RMB100 million B+ in 2025, followed by a reported $300 million
      Series C in March 2026. Caixin then reported that Alibaba led additional
      financing that brought the Series C total to RMB2.98 billion ($439 million) in
      July 2026. These are period-specific round disclosures, not a verified bridge
      to cumulative capital raised or cash available. Separately, multiple sources
      reported more than 100 million users, more than 16 million monthly active users,
      and more than $40 million of ARR for late 2025. Those figures are material
      traction signals, but their cohort definitions, audit status, revenue bridge,
      retention, gross margin, and conversion to paying customers remain undisclosed.
    claimRefs: [CO006, CO007, CO008, CO009, CO010, CO012, CO013]
    tableRefs: [TO003]
  - id: "milestones-and-diligence-posture"
    title: "Milestones and diligence posture"
    body: >-
      The evidence shows a compressed operating history: formation in 2023, initial
      product launch and several financing steps in 2024, large reported usage and
      ARR milestones in 2025, and both the R1 real-time-video launch and major Series
      C financing in 2026. That velocity is strategically meaningful, but it also
      raises execution and competitive questions. Caixin framed the sector as a
      widening race in which major platforms are trying to challenge ByteDance's
      lead, so capital raised does not itself establish durable technical or
      distribution advantage. The timeline preserves the source periods without
      inventing missing days, and open diligence should prioritize governance,
      financing terms, audited commercial metrics, and independent legal,
      regulatory, security, and outage records.
    claimRefs: [CO001, CO006, CO007, CO008, CO011, CO012, CO013, CO014]
    figureRefs: [FO001]
