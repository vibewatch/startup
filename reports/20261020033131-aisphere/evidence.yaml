evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board composition, executive roster, voting rights, succession plan, and a record of material leadership
      changes.
    whyItMatters: >-
      Governance and succession evidence is required to assess control, oversight, and the durability of a
      founder-centered operating model.
    diligencePath: >-
      Request the current organization chart, board and observer list, governance documents, founder employment
      agreements, and leadership-change log.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: capitalization
    missingEvidence: >-
      Priced valuation, cumulative cash proceeds, debt or credit facilities, current cap table, liquidation preferences,
      side letters, and secondary transactions.
    whyItMatters: >-
      Round headlines cannot establish ownership, investor protections, cash availability, or entry-price
      attractiveness.
    diligencePath: >-
      Obtain signed financing documents, funds-flow statements, the fully diluted cap table, debt schedule, and
      liquidation waterfall.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
    topic: commercial-scale
    missingEvidence: >-
      Audited revenue and ARR bridge, gross margin, retention, paid-subscriber and enterprise-customer counts, channel
      mix, concentration, and current headcount.
    whyItMatters: >-
      Reported users and ARR do not establish revenue quality, unit economics, organizational capacity, or customer
      durability.
    diligencePath: >-
      Request audited financials, monthly ARR and cohort bridges, billing exports, customer concentration schedules,
      payroll records, and current headcount by function.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: adverse-record
    missingEvidence: >-
      Independent legal, regulatory, security, outage, content-safety, and intellectual-property incident records tied
      to AIsphere or PixVerse.
    whyItMatters: The absence of such records in the assigned pool is not evidence that no incidents or liabilities exist.
    diligencePath: >-
      Run jurisdiction-specific court, regulator, app-store, security, and availability checks and request the company's
      incident and claims registers.
  - type: private-evidence-only
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      Auditable category spend, geography-specific paid demand, AIsphere serviceable cohorts, and a bottoms-up
      volume-times-price model for TAM, SAM, and SOM.
    whyItMatters: >-
      Without comparable spend and conversion data, user counts cannot establish the revenue pool available to AIsphere
      or a credible market-share denominator.
    diligencePath: >-
      Obtain management's market model, customer and billing exports by geography and segment, API usage cohorts, and
      third-party category-spend benchmarks; reconcile them to audited ARR.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: payer-economics-gap
    missingEvidence: >-
      Paying-account counts, free-to-paid conversion, cohort retention, segment ARR, contract size, sales-cycle length,
      gross margin, and compute cost per generated second.
    whyItMatters: >-
      These metrics determine whether broad adoption converts into durable serviceable revenue and whether
      enterprise/API growth improves or dilutes contribution economics.
