  topStrengths:
    - 多个独立和官方来源反复把 Salla 列为沙特少数头部电商平台之一，包括 U.S. International Trade Administration。
    - Investcorp、Sanabil Investment 和 STV 提供机构资本，2024 年 3 月轮次明确通过「Pre-IPO Growth Fund」架构完成。
    - 已披露产品覆盖支付、BNPL、税务电子发票和大型第三方应用市场，证明平台宽度已超出基础店铺工具。
    - 公司站在规模大且仍增长的沙特数字经济里（据 GASTAT，占 GDP 的 15.6%），而电商是 2025 年上半年融资最多的 VC 赛道。
  topRisks:
    - 已审阅来源都未披露 Salla 的估值、收入、毛利率或现金头寸，任何对价格敏感的推荐都被卡住。
    - 公开店铺 / 商户规模指标随来源和定义不同相差约 3-5 倍，所有增长和市场份额判断都受影响。
    - >-
      沙特 Personal Data Protection Law 和 Cybersecurity Law 都适用，但没有来源确认 Salla 的合规或认证状态；一家泄露监测厂商还独立记录了 91,000+ 条与 salla.sa
      相关、出现在信息窃取恶意软件转储里的凭据。
    - 治理高度集中：三家机构投资人中，只有 Investcorp 的 Robin Mansour 被披露为董事；全部公开来源里反复出现的具名高管也只有两位。
    - 品牌 / IP 控制问题仍未解决：第二个 Google Play 上架项 com.faya.sala 使用 Salla 名称，声誉和商标风险仍悬着。
  unresolvedGaps:
    - 2024 年 3 月轮次的投后估值、股价和优先权条款未公开。
    - 公司尚未披露一个带明确定义和统计日期、可统一口径的商户 / 店铺数。
    - 经审计或管理层审阅的财务报表（收入、利润率、现金流）未公开。
    - PDPL 与 Cybersecurity Law 合规状态，以及 com.faya.sala 品牌控制问题，都要等公司直接披露才能解决。
    - 尽管存在指向性 Pre-IPO 和市场管线信号，但尚未确认任何具体 Tadawul IPO 时间表、承销商，或点名 Salla 的 CMA 备案。
