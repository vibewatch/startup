- id: TV004
  title: Comparable valuation table
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Shopify
    - EV / Revenue (per SEC 10-K and market data)
    - Public e-commerce-SaaS platform leader; multiple varies with market conditions
    - Closest global product-model analog (storefront + app ecosystem + payments).
    - Vastly larger scale, multi-geography, audited public disclosure Salla lacks.
  - - BigCommerce
    - EV / Revenue (per SEC 10-K and market data)
    - Smaller public e-commerce-SaaS peer
    - Closer scale analog than Shopify for a mid-sized e-commerce-SaaS enabler.
    - US-centric disclosure and customer base; not a Gulf-market comp.
  - - Wix
    - EV / Revenue (Yahoo Finance key statistics)
    - ~0.79x most recent quarter, down from ~2.84x-5.09x across the prior year
    - Shows current public e-commerce-SaaS-adjacent multiple compression risk.
    - Website-builder-first model with different monetization mix than Salla.
  - - Squarespace (Permira take-private, 2024)
    - EV / Revenue at deal announcement
    - 6.6x ($6.99B all-cash deal)
    - Highest-multiple outcome in this comp set; shows PE appetite for scaled SaaS.
    - One-off M&A transaction, not a steady-state public multiple; different business mix.
  - - Zid
    - Disclosed private funding total
    - $59M across three rounds ($50M Series B 2022, $7M Series A 2021, $2M seed 2019); ~7,500 stores at last disclosed round
    - Closest named Saudi domestic competitor with disclosed round sizes.
    - Materially smaller than Salla's disclosed capital raise or scale claims; no disclosed post-money valuation.
  - - Tabby
    - Disclosed pre-IPO private valuation
    - $3.3B (2025 Series E pre-IPO), up from $1.5B in late 2023
    - Shows a Saudi/Gulf fintech-adjacent peer reaching a multi-billion-dollar disclosed mark ahead of a Tadawul listing.
    - Fintech (BNPL) business model, not e-commerce-SaaS enablement; not directly comparable economics.
  - - Ninja
    - Disclosed pre-IPO round size
    - $250M pre-IPO round (2025)
    - Shows continued large-check appetite for Gulf commerce-adjacent platforms.
    - Quick-commerce logistics model, structurally different from Salla's SaaS-enablement model.
  - - Hala
    - Disclosed Series B round size
    - $157M Series B (co-led by Sanabil and TPG)
    - Shows a Salla co-investor (Sanabil) participating in a comparably large regional round.
    - B2B fintech/invoicing business, not e-commerce-SaaS; no disclosed valuation figure in this corpus.
  notes: This comp set is intentionally mixed (public multiples, an M&A take-private multiple, and disclosed private-round sizes) because no single peer matches Salla's Saudi-only, e-commerce-SaaS-enablement, pre-IPO profile.
