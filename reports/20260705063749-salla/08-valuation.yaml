  evidenceGaps:
  - type: missing-metric
    severity: material
    topic: valuation-disclosure-gap
    missingEvidence: Salla's post-money valuation, share price, or preference terms from its March 2024 $130 million round.
    whyItMatters: Without a disclosed price, this chapter cannot move beyond a research-more recommendation to any price-sensitive call.
    diligencePath: Request the 2024 round's term sheet or cap table directly from Salla, Investcorp, Sanabil, or STV.
    relatedQuestionRefs:
    - QV016
    relatedTableRefs:
    - TV001
  - type: missing-metric
    severity: material
    topic: financial-statement-disclosure-gap
    missingEvidence: Audited or management-reviewed revenue, gross margin, and cash-flow figures for Salla.
    whyItMatters: These are the core inputs for any valuation method beyond qualitative comp benchmarking, and their absence caps this chapter's analytical precision.
    diligencePath: Request financial statements directly from Salla as part of any future financing or listing process.
    relatedQuestionRefs:
    - QV005
    relatedTableRefs:
    - TV006
  - type: missing-metric
    severity: material
    topic: scale-metric-conflict-gap
    missingEvidence: A single reconciled Salla merchant/store count with a stated definition and measurement date.
    whyItMatters: The roughly 3-5x spread between the lowest (22,342 live stores) and highest (100,000-plus merchants) disclosed figures undermines every growth, scale, and comparable-multiple judgment in this chapter.
    diligencePath: Request a reconciled figure directly from Salla, or independently commission a technographic recount.
    relatedQuestionRefs:
    - QV006
    relatedTableRefs:
    - TV004
  - type: access-blocked
    severity: minor
    topic: third-party-valuation-estimate-access-gap
    missingEvidence: Rendered content from PitchBook, Notice.co, Crunchbase, Tracxn, Forbes Middle East, and Rasmal pages referencing Salla's or Zid's funding/valuation profile.
    whyItMatters: These aggregator pages could provide independent secondary corroboration or a market-implied valuation estimate, but returned bot-detection pages, ad-tracker redirects, or near-empty content at fetch time.
    diligencePath: Access these platforms via an authenticated account or licensed data feed rather than a direct anonymous page fetch.
    relatedQuestionRefs:
    - QV014
    - QV029
  - type: missing-source
    severity: minor
    topic: ipo-timetable-disclosure-gap
    missingEvidence: A specific disclosed IPO timetable, underwriter engagement, or CMA filing naming Salla.
    whyItMatters: Without this, the 'Pre-IPO Growth Fund' naming and Tadawul-pipeline context remain directional signals rather than a confirmed exit path.
    diligencePath: Monitor CMA and Tadawul IPO-pipeline disclosures directly, and request timetable confirmation from Salla or its lead investors.
    relatedQuestionRefs:
    - QV021
    - QV042
