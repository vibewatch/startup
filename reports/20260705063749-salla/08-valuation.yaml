- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner / diligence path
  rows:
  - - 2024 round valuation and terms
    - Post-money valuation, share price, and liquidation-preference structure of the March 2024 $130M round
    - Without this, no price-sensitive recommendation is possible.
    - Request directly from Salla, Investcorp, Sanabil, or STV.
  - - Audited or management-reviewed financials
    - Revenue, gross margin, cash position, and burn rate
    - Core inputs for any valuation method beyond qualitative comp benchmarking.
    - Request directly from Salla as part of any future financing or listing process.
  - - Reconciled scale metric
    - A single merchant/store count with a stated definition (live stores vs. registered accounts vs. cumulative merchants) and measurement date
    - Resolves the chapter-spanning 3-5x scale-metric conflict that undermines every growth and market-share claim.
    - Request directly from Salla, or independently commission a technographic recount.
  - - PDPL / Cybersecurity Law compliance status
    - Confirmation of registration status, certifications, or SDAIA correspondence
    - Determines whether a material, currently unpriced regulatory risk exists.
    - Request directly from Salla; cross-check against SDAIA's National Data Governance Platform.
  - - com.faya.sala brand-control position
    - Salla's official statement on the relationship (if any) to the com.faya.sala Google Play listing
    - An unresolved brand/IP question is a reputational and channel-control risk a public listing would need to address.
    - Request directly from Salla; escalate to Google Play if unauthorized.
  - - Tadawul listing timetable
    - Any confirmed listing intent, underwriter engagement, or CMA filing
    - Confirms or denies the "Pre-IPO Growth Fund" naming as an actual near-term listing signal.
    - Monitor CMA and Tadawul IPO-pipeline disclosures directly.
  notes: These six asks are the direct precondition for moving this chapter's recommendation away from research-more.
