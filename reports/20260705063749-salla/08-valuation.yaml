- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - Higher-end scale claims (100k+ merchants, $10B enabled sales since 2020) hold; take-rate resembles profitable global peers; Tadawul listing follows Tabby's path.
    - Multi-billion-dollar listing mark, similar in kind to Tabby's disclosed $3.3B pre-IPO valuation.
    - Requires both scale claims and margin assumptions this corpus cannot verify.
    - 'Low-to-medium: consistent with Saudi digital-economy growth data but unverified at the company level.'
  - - Base
    - Lower/conservative scale figures (68k Tap-reported stores or 22,342 StoreLeads live stores) are closer to reality; economics sit near the public e-commerce-SaaS median (~1.7x-2.8x EV/Revenue).
    - A more cautious listing mark than Tabby's, reflecting thinner disclosure and a narrower Saudi-only footprint.
    - Still depends on an undisclosed take-rate and cost structure.
    - 'Medium-high: consistent with the most independently verifiable scale and multiple data in this corpus.'
  - - Bear
    - Scale-metric conflict reflects genuine overstatement; Risks-chapter compliance gaps surface as real remediation cost or reputational harm; public e-commerce-SaaS multiples keep compressing (as observed in Wix).
    - Delayed or shrunken exit; any listing prices near the low end of the e-commerce-SaaS multiple range (~0.8x-1.7x EV/Revenue).
    - Regulatory, brand-control, and multiple-compression risks compound.
    - 'Low-to-medium: plausible given documented multiple compression, but no source confirms a Salla-specific adverse trigger yet.'
