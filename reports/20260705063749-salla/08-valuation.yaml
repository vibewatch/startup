- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Scale-claim overstatement confirmed
    - Independent audit or disclosure showing merchant/store counts materially below the 68k-100k+ range currently claimed
    - Undercuts the core "dominant scale" thesis pillar directly.
    - Downgrade recommendation; require a reconciled metric before any renewed engagement.
  - - Confirmed regulatory enforcement action
    - Any publicly confirmed PDPL, Cybersecurity Law, or E-Commerce Law fine or sanction naming Salla
    - Converts an evidence gap into a realized compliance-cost and reputational risk.
    - Treat as a kill criterion for near-term investment; reassess only after remediation is disclosed.
  - - Governance friction at board level
    - Evidence of dispute, forced exit, or governance breakdown involving Investcorp's board seat
    - Signals the single disclosed governance safeguard is not functioning.
    - Pause engagement pending clarity on board composition and investor alignment.
  - - Continued public e-commerce-SaaS multiple compression
    - Sustained EV/Revenue declines across Wix, Shopify, and BigCommerce beyond the levels already observed
    - Mechanically compresses any future Salla listing mark regardless of company execution.
    - Lower any future valuation expectation range and reassess exit timing.
  - - com.faya.sala brand dispute escalates
    - Trademark action, regulatory notice, or confirmed unauthorized use tied to the com.faya.sala listing
    - Elevates a currently unresolved brand question into a realized reputational or legal risk.
    - Request direct company disclosure before proceeding; treat silence as a negative signal.
  - - Disclosed valuation or financials released
    - Salla or an investor discloses the 2024 round's valuation, or any audited financial statement
    - Removes this chapter's central limitation and enables a specific price-sensitive recommendation.
    - Re-run this chapter's analysis with the new disclosure; upgrade recommendation only if terms and financials support it.
  notes: Triggers are written as monitorable, falsifiable events rather than generic risk statements.
