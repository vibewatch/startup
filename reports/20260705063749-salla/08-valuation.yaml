- id: bull-base-bear-scenarios
  title: Bull, base, and bear scenarios
  body: 'The bull case assumes Salla''s higher-end scale claims (100,000-plus merchants, $10 billion in enabled sales since 2020 per Investcorp''s own portfolio page) are broadly accurate, that its take-rate and subscription mix resemble the more profitable end of global e-commerce-SaaS peers, and that a Tadawul listing follows Tabby''s and Tamara''s path toward a multi-billion-dollar mark, supported by GASTAT data showing the digital economy at 15.6% of Saudi GDP and continued double-digit e-commerce market growth. The base case assumes the lower, more conservative scale figures (Tap''s ~68,000 stores or StoreLeads'' 22,342 live-store count) are closer to current reality, that Salla''s economics sit near the public e-commerce-SaaS median (roughly 1.7x-2.8x EV/Revenue per Multiples.vc and Yahoo Finance data on Wix), and that any future listing is priced more cautiously than Tabby''s given Salla''s thinner public disclosure and unresolved regulatory/brand questions. The bear case assumes the scale-metric conflict reflects genuine overstatement in the higher figures, that undisclosed compliance gaps identified in the Risks chapter surface as real remediation costs or reputational damage before any listing, and that public e-commerce-SaaS multiples continue compressing (Wix''s own EV/Revenue multiple fell from roughly 2.84x to 0.79x across the year to March 2026 per Yahoo Finance), materially delaying or shrinking any exit. Probability signals favor the base case: the underlying Saudi digital-economy growth story is well-corroborated by GASTAT and Statista, and Salla''s named-platform status is repeatedly confirmed by independent sources, but no source provides enough financial granularity to assign confident probability weights beyond a qualitative base-case lean.'
