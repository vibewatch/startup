chapter:
  number: 8
  title: Valuation
  summary: 'Salla is a research-more, not a priced buy: the company shows genuine demand proof (a disclosed $130 million March 2024 pre-IPO round led by Investcorp, with Sanabil Investment and STV participating, structured through a fund explicitly named for pre-listing growth capital) inside the fastest-growing venture segment in the fastest-growing Gulf VC market, but no reviewed source discloses Salla''s post-money valuation, revenue, margin, or cash position, and public scale metrics for stores and merchants conflict by roughly 3-5x depending on source and definition. Public e-commerce-software comparables (Shopify, BigCommerce, Wix, the Squarespace take-private) currently trade or transacted at a wide range of EV/Revenue multiples (roughly 0.8x-6.6x in 2026), and the closest disclosed regional private comps (Zid, Tabby, Ninja, Hala) show that Saudi e-commerce and fintech mega-rounds can support multi-billion-dollar marks, but none of these comps map cleanly onto Salla''s undisclosed unit economics. This chapter''s recommendation is therefore research-more with a risk rating of high and a valuation stance of unknown: the investment thesis (dominant Saudi e-commerce SaaS platform, institutional capital, an explicit pre-IPO signal, a large and still-growing underlying market) is real, but so is the anti-thesis (undisclosed financials, an unresolved scale-metric conflict, one board seat concentrated with a single investor, and open regulatory and brand-control questions carried over from this report''s Risks chapter). A defensible entry would require either a disclosed valuation mark with supporting financials, or a public listing that forces audited disclosure; absent either, this chapter recommends tracking Salla toward its apparent Tadawul listing path rather than underwriting a price today.'
sections:
- id: investment-thesis-and-anti-thesis
  title: Investment thesis and anti-thesis
  body: 'The thesis for Salla rests on five load-bearing facts established across this report: it is repeatedly named (including by the U.S. International Trade Administration) as one of a handful of dominant Saudi e-commerce platforms; it operates in a Saudi e-commerce market GASTAT and Statista put in the tens of billions of dollars and still growing; it has raised institutional capital from Investcorp, Sanabil Investment (a Public Investment Fund company), and STV, with Investcorp''s $130 million March 2024 round explicitly structured through a "Pre-IPO Growth Fund"; it has disclosed integrations across payments (Tap), BNPL (Tamara, Tabby), tax e-invoicing (ZATCA), and a large third-party app marketplace, showing platform depth beyond a bare storefront tool; and it sits inside a Saudi venture ecosystem where e-commerce was the top-funded sector in H1 2025 ($306 million, up 78% year-on-year per MAGNiTT) and where comparable companies (Tabby, Ninja, Hala) have closed mega-rounds and, in Tabby''s case, reached a disclosed $3.3 billion pre-IPO valuation. The anti-thesis is equally load-bearing: no reviewed source disclosed Salla''s own post-money valuation, annual revenue, gross margin, or cash runway; the company''s own headline scale metric is genuinely contested (68,000 to 100,000-plus stores or merchants depending on source, against an independent technographic tracker''s 22,342 live-store count); only one board seat (Investcorp''s) is disclosed among three institutional investors, concentrating governance influence; and this report''s Risks chapter found unresolved regulatory-disclosure, credential-exposure, and brand-control questions that a public listing would force into the open but that remain untested today. Each anti-thesis point maps to a specific, falsifiable diligence ask in this chapter''s final section rather than to a generic caution.'
