- id: comparable-set
  title: 'Comparable set: public companies, private rounds, and precedent transactions'
  body: No single comp cleanly matches Salla's mix of Saudi-only geography, e-commerce-SaaS-enablement model, and pre-IPO private status, so this chapter uses a deliberately mixed set. Among public e-commerce-software companies, Shopify's and BigCommerce's SEC 10-K filings anchor the audited-disclosure end of the spectrum; Yahoo Finance data shows Wix trading at roughly 0.79x EV/Revenue as of its most recent quarter (down sharply from ~2.84x-5.09x across the prior year), and Squarespace was taken private by Permira in 2024 at a 6.6x EV/Revenue multiple ($6.99 billion), the highest-multiple outcome in this comp set. Multiples.vc's June 2026 public-software benchmark data puts e-commerce SaaS specifically at a roughly 1.7x EV/Revenue (NTM) median, well below the broader ~2.2x public SaaS median and far below premium verticals like design/engineering software (4.5x). Among Saudi private comps, Zid -- Salla's closest named domestic competitor -- had raised a disclosed $59 million across three rounds (a $50 million 2022 Series B, a $7 million 2021 Series A, and a $2 million 2019 seed) covering roughly 7,500 stores as of its last disclosed round, materially smaller than Salla's disclosed capital raise and any of its claimed scale figures. Tabby (a $3.3 billion disclosed pre-IPO valuation, up from $1.5 billion in late 2023) and Ninja ($250 million pre-IPO round) show that Saudi consumer-fintech and e-commerce peers can support large late-stage marks, and Hala's $157 million Series B shows continued mega-round appetite in adjacent commerce-infrastructure categories -- but all three are fintech or quick-commerce businesses with disclosed metrics Salla does not share publicly, limiting direct comparability.
