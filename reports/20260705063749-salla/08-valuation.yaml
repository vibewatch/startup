- id: financing-context-and-entry-discipline
  title: Financing context, entry discipline, and dilution/preference overhang
  body: 'The only disclosed financing event is the March 2024 round: $130 million led by Investcorp through its Saudi Pre-IPO Growth Fund, with Sanabil Investment and existing shareholder STV participating, and Investcorp''s Robin Mansour joining Salla''s board -- but the round''s post-money valuation, share price, liquidation-preference terms, and total primary versus secondary split are not disclosed in any reviewed source. Earlier funding history is thin and partly contested: one source (MENAbytes) documents an $8.5 million Series A, while a separate analytics aggregator (GetLatka) describes Salla as "bootstrapped with no outside investment," a direct conflict with the well-corroborated $130 million round and one this chapter flags as a data-quality problem with that aggregator rather than evidence Salla was actually unfunded before 2024. Because no share price, cap table, or preference stack is public, entry discipline for any prospective investor today cannot be expressed as a specific price test; the only available discipline is procedural: require disclosure of the 2024 round''s valuation and preference terms, the current cap table, and audited or management-reviewed financials before committing new capital, and treat the "Pre-IPO Growth Fund" naming as a directional signal of listing intent rather than a committed timetable. Saudi Arabia''s Tadawul exchange had roughly 40 companies in its 2026 IPO pipeline per AGBI reporting, and comparable Saudi fintech/e-commerce peers Tabby and Tamara were both pursuing Tadawul listings as of 2025 per Vision2030.ai''s venture-funding analysis, which is the closest public evidence this chapter has for Salla''s own eventual exit path.'
