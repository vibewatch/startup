- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - argument
  - evidence
  - what would change the view
  rows:
  - - 'Thesis: dominant named platform'
    - U.S. ITA country guide and multiple independent press sources name Salla among a handful of dominant Saudi e-commerce platforms.
    - Independent confirmation Salla has lost material share to Zid or a marketplace entrant.
  - - 'Thesis: institutional capital with pre-IPO framing'
    - $130M March 2024 round led by Investcorp's "Pre-IPO Growth Fund," with Sanabil and STV participating.
    - Disclosure of the round's valuation, or confirmation of a specific listing timetable.
  - - 'Thesis: large, growing addressable market'
    - 'GASTAT: digital economy is 15.6% of Saudi GDP; Statista and Mordor Intelligence project continued double-digit e-commerce growth.'
    - A material slowdown in GASTAT or Statista's Saudi e-commerce growth trajectory.
  - - 'Anti-thesis: no disclosed valuation or financials'
    - No reviewed source states Salla's revenue, margin, cash position, or the 2024 round's post-money valuation.
    - A leaked or disclosed financial statement, or IPO-prospectus-grade filing.
  - - 'Anti-thesis: contested scale metric'
    - Public counts range from 22,342 live stores (StoreLeads) to 100,000-plus merchants (Investcorp), a roughly 3-5x spread.
    - A single reconciled figure with a stated definition and measurement date.
  - - 'Anti-thesis: concentrated board governance'
    - Only Investcorp's Robin Mansour is a disclosed board member among three institutional investors.
    - Disclosure of a fuller board composition or governance charter.
  notes: Each anti-thesis row maps directly to a diligence ask in the final diligence asks table.
