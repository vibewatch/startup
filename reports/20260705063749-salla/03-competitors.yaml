- id: competitor-profiles-and-comparisons
  title: Competitor profiles, disclosed scale, pricing, and capability comparison
  body: 'Disclosed scale metrics for Salla itself vary sharply depending on the source: StoreLeads'' 2026 technographic report counts 22,342 live stores, Tap Payments'' partner blog cites over 68,000 Saudi stores running Salla 4.0, and Entrepreneur Middle East reports over 55,000 merchants with cumulative sales exceeding SAR 21 billion -- a store/merchant-count definitional conflict this chapter preserves rather than resolves. Salla''s own partner-ecosystem page separately claims 500+ registered app developers reaching over 60,000 merchants, a company-sourced figure sitting between the third-party estimates. By contrast, Shopify''s SEC Form 10-K discloses audited FY2024 total revenue of $8.9 billion (+26% year over year) and GMV of $292.3 billion (+24%), with Yahoo Finance placing its market capitalization near $155 billion in early 2026 at a trailing P/E above 100x. BigCommerce''s own 10-K shows a narrower but still material FY2024 net loss of $27.0 million (versus $64.7 million in FY2023) and a $621.7 million accumulated deficit, which independent commentary from Small Cap Stocks ties to decelerating (~12% year-over-year) revenue growth and intensifying competitive pressure from Shopify -- adverse evidence corroborated by BigCommerce''s own filed numbers. On pricing, Shopify''s Basic tier runs $29-39/month and BigCommerce''s tiers span $39 to $1,499+/month, both self-serve and publicly listed; WooCommerce carries no core platform fee but $25-350/month hosting plus $29-299/year per extension; Salesforce Commerce Cloud publishes no self-serve rate card at all ("contact for pricing"), independently estimated by WooCommerce''s own cross-platform comparator at roughly $1,000-5,000+/month or 1-3% of GMV, positioning it as the highest-cost, most enterprise-oriented competitor reviewed. On capability, Shopify Plus and Salesforce Commerce Cloud''s B2B Growth Edition both explicitly market dedicated wholesale/B2B storefronts and native point-of-sale/omnichannel tooling; no equivalent B2B or POS capability is evidenced for Salla or Zid anywhere in this corpus, and no competitor in the set -- including Salla -- has a directly evidenced ZATCA e-invoicing compliance claim, despite it being a mandatory Saudi regulatory requirement.'
