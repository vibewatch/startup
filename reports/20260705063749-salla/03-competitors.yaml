callouts:
- calloutType: risk
  title: Scale-metric conflict clouds true market position
  body: Salla's disclosed store/merchant counts range from 22,342 (StoreLeads, independent) to 68,000+ (Tap Payments, partner) to 55,000+ merchants (Entrepreneur ME, press), a spread that has no equivalent for Shopify or BigCommerce, whose audited SEC filings give a single reconciled revenue and GMV figure each. This asymmetry in disclosure standards should temper any confidence in Salla's precise relative market position.
  claimRefs:
  - CP009
  - CP011
- calloutType: assumption
  title: Zid remains a benchmarking blind spot
  body: Every comparison in this chapter that pits Salla against Zid rests on a single joint news feature rather than independent Zid-specific financial or scale disclosure. Treat any implied Salla-versus-Zid ranking as provisional until independent Zid data becomes available.
  claimRefs:
  - CP036
