      These low/mid/high figures are illustrative EV/Revenue multiple ranges drawn from disclosed public e-commerce-SaaS
      comparables (Wix, Multiples.vc's sector median, and Squarespace's take-private multiple), not a dollar-denominated
      Salla valuation or company-specific estimate; no source discloses a Salla-specific multiple or valuation.
