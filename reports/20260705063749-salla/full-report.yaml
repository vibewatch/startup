    Tap), offering buy-now-pay-later (Tamara, Tabby), handling ZATCA-compliant e-invoicing, and extending functionality
    through a 400+ app third-party marketplace.
  customerFocus: Saudi and wider Gulf small-to-mid-size merchants building or migrating an online store.
