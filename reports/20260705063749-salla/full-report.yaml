companyProfile:
  summary: >-
    Salla is a Makkah-headquartered Saudi e-commerce SaaS platform, founded in 2016, that lets merchants build online
    stores, accept payments, and manage shipping and a large third-party app ecosystem. It has raised institutional
    pre-IPO capital from Investcorp, Sanabil Investment, and STV, and is repeatedly named among a handful of dominant
    Saudi e-commerce platforms, but it discloses no public valuation, revenue, or margin figures, and its own headline
    scale metrics conflict sharply across sources.
  foundedDate: '2016-01-01'
  founders:
    - name: Nawaf Hariri
      role: CEO and co-founder
      background: Publicly named CEO across every funding announcement reviewed for this report.
      claimRefs:
