      - number: '7.2'
        title: 'Regulatory and legal risk: an active compliance regime with no confirmed Salla-specific compliance evidence'
        blocks:
          - type: paragraph
            body: >-
              Saudi Arabia's Personal Data Protection Law (PDPL) came into full force and active enforcement on 14
              September 2024, following a one-year grace period, per CMS's international legal expert guide; violations
              carry a general administrative fine of up to SAR 5 million (roughly $1.33 million), a separate SAR 3
              million fine plus up to two years' imprisonment for intentional unlawful disclosure of sensitive data, and
              Saudi Arabia's Cybersecurity Law and telecom regulator (CITC) can add fines up to SAR 5 million and SAR 25
              million respectively for related violations. Saudi Press Agency coverage confirms SDAIA uses specialized
              committees to adjudicate confirmed PDPL violations and impose penalties, and the National Cybersecurity
              Authority has issued dedicated cybersecurity guidelines for e-commerce service providers (including SMEs)
              and consumers, plus Cloud Cybersecurity Controls (CCC-2:2024) setting data-localization and minimum
              security requirements for cloud providers and tenants -- rules that would apply to Salla's undisclosed
              hosting infrastructure if it is cloud-hosted. Separately, Saudi Arabia's 2019 E-Commerce Law (26 articles,
              per Saudipedia) requires online platforms to protect consumer data, disclose business-registration
              details, issue itemized invoices, and follow advertising rules, with fines up to SAR 1 million and
              potential suspension or blocking of the online business for violations. The U.S. International Trade
              Administration's own Saudi Arabia e-commerce country guide explicitly names Salla (alongside Zid, Noon,
              Jarir, Jahez, and HungerStation) as a locally dominant platform and separately notes the government is
              actively strengthening e-commerce consumer-protection regulation. None of this corpus's sources confirm
              Salla's specific PDPL registration status, a security certification, or an active lawsuit, regulatory
              sanction, or enforcement action naming Salla; a second Google Play listing using the Salla name
              (com.faya.sala), registered to an unrelated-appearing UK entity, also remains an unresolved brand-control
              and potential trademark question carried forward from the Product & Technology and Customers chapters.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
              - CR015
              - CR016
              - CR017
              - CR018
