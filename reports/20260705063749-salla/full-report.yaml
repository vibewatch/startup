        title: >-
          Expansion and concentration: App Store upsell and BNPL are real levers; no source discloses top-customer
          concentration
        blocks:
          - type: paragraph
            body: >-
              Salla's clearest disclosed expansion mechanism is its third-party App Store (apps.salla.sa /
              salla.partners), which the Product & Technology chapter documents as home to paid "Private" and "Public"
              apps built by outside developers -- a land-and-expand surface where a merchant that starts on the free
              Basic tier can add paid functionality without upgrading its core subscription tier. A second expansion
              lever is embedded buy-now-pay-later: Salla's Tamara partnership extended installment payments to more than
              10,000 merchants at no extra merchant fee per MAGNiTT's coverage, and a separate Tabby integration is
              documented in Salla's own help-center content, both of which expand average shopper basket size and
              merchant revenue without a corresponding subscription-tier upgrade. Concentration risk runs in the
              opposite direction from most enterprise SaaS: with a merchant base described as "individuals, small and
              medium brands, and well-established enterprises" and no single named top-customer disclosed anywhere in
              this corpus, per-merchant revenue concentration risk appears structurally low, but Salla instead carries a
              channel-concentration risk around its own App Store and partner-agency layer (Radar Agency, ReturnPlus,
              Cartat, and others), none of whose relative revenue contribution to Salla is disclosed. A distinct, newly
              surfaced concentration-adjacent risk is brand-channel concentration in mobile distribution: a second
              Google Play listing using the "Salla" name (package com.faya.sala) is registered to an unrelated-looking
              developer ("Faya Dev Ltd," a UK-registered entity) rather than Salla's own developer account, which --
              whether an authorized white-label build or an unrelated party trading on the brand -- is an unresolved
              brand-integrity and channel-control question this chapter cannot close with available evidence.
              Independent platform-comparison reviews consistently name Zid as Salla's nearest competitive alternative
              for Saudi merchants considering a switch, which this chapter treats as an ongoing competitive-retention
              risk rather than a resolved one.
