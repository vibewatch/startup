      - number: '4.4'
        title: Public traction versus private metrics, and financial verdict
        blocks:
          - type: paragraph
            body: >-
              Salla's public traction record is real but methodologically inconsistent. Independent technographic
              tracker StoreLeads counted only 22,342 live Salla-powered storefronts in its 2026 report, following a
              sharp 2025 technical-detection decline and partial 2026 rebound, while Tap Payments' partner blog
              separately cites over 68,000 Saudi stores running "Salla 4.0" -- a roughly 3x gap between an independent
              technographic count and a payments-partner-reported figure measured on a different basis and likely a
              different date. Layered on top of that are the GMV-style figures already discussed ($7 billion to $10
              billion enabled since 2020, across 80,000 to 100,000-plus "active merchants" depending on source and
              page). Because no source pairs any of these traction figures with an actual revenue number, this chapter
              cannot compute a take-rate, a revenue-per-merchant estimate, or a growth-adjusted valuation multiple for
              Salla -- the single largest blocker to a complete financial underwriting view.


              Weighed together, the positive case is that Salla has multiple monetization surfaces already operating
              (subscriptions, an app marketplace with real third-party developer earnings, native BNPL integrations, and
              a sizeable partner-referral program), a single large and reputationally strong institutional round ($130
              million, Investcorp-led, alongside PIF-owned Sanabil and existing investor STV), and a fund structure that
              signals an intended path toward public markets. The negative case is that essentially every quantity
              needed for a standard SaaS or marketplace financial model -- price, revenue, gross margin, CAC, payback,
              cash, burn, and runway -- is privately held and not found anywhere in this corpus, and that even Salla's
              topline scale metrics disagree with each other by roughly 3x to 5x depending on which source and vintage
              is used. BigCommerce's persistent net losses across three straight fiscal years, despite being a public,
              audited, well-capitalized incumbent, and Motley Fool's independent commentary that even category leader
              Shopify's valuation has repeatedly outrun its growth, are adverse reminders from the wider e-commerce SaaS
              category that scale and capital access alone do not guarantee a clean margin path -- a caution this
              chapter extends to any forward view of Salla's own financial trajectory. The verdict is therefore:
              directionally positive revenue architecture and traction signal, but financially unresolved pending
              management-provided revenue, margin, and cash data.
