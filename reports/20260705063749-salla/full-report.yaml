            any exit.
          tone: negative
        - label: Base case
          low: 1.7
          mid: 2.2
          high: 2.8
          displayValue: Near public e-commerce-SaaS median multiple (~1.7x-2.8x EV/Revenue, per Multiples.vc and Wix)
          detail: Conservative scale figures hold and a listing prices near current public e-commerce-SaaS comps.
          tone: warning
        - label: Bull case
          low: 2.8
          mid: 4.5
          high: 6.6
