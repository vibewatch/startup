              - CV036
              - CV037
              - CV038
      - number: '8.6'
        title: Exit readiness, thesis-break triggers, and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness signals are directional rather than confirmed: the March 2024 round's "Pre-IPO Growth Fund"
              framing, Saudi Arabia's active 2026 Tadawul IPO pipeline (roughly 40 companies per AGBI), and peer Saudi
              fintech/e-commerce companies (Tabby, Tamara) actively pursuing Tadawul listings all point toward eventual
              public-market intent, but no source discloses a specific timetable, underwriter, or listing venue for
              Salla itself. This chapter's thesis-break and kill-criteria triggers include: any independent confirmation
              that the higher-end scale claims (100,000-plus merchants, $10 billion in enabled sales) are materially
              overstated relative to audited figures; any confirmed regulatory enforcement action, fine, or unresolved
              litigation naming Salla; any evidence the disclosed board-seat concentration with Investcorp reflects
              unresolved governance friction; and continued public e-commerce-SaaS multiple compression (as observed in
              Wix's year-over-year decline) that would mechanically compress any future Salla listing's valuation
              regardless of its own execution. Final diligence asks, in priority order, are: (1) the 2024 round's
              post-money valuation and preference terms; (2) audited or management-reviewed revenue, gross margin, and
              cash-flow statements; (3) a single reconciled merchant/store count with a stated definition and
              measurement date; (4) confirmation of PDPL and Cybersecurity Law compliance status; and (5) direct company
              comment on the com.faya.sala brand-control question. Until these are answered, this chapter's position is
              to track Salla toward its apparent Tadawul path rather than to price it today.
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV042
              - CV043
              - CV044
