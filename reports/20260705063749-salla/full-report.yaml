      - number: '7.3'
        title: >-
          Operational and security risk: observed credential exposure, undisclosed infrastructure, and
          consumer-protection friction
        blocks:
          - type: paragraph
            body: >-
              A breach-monitoring vendor (LeakRadar) independently reports salla.sa-linked credentials appearing in
              infostealer-malware dumps, with a dynamically updated counter showing over 91,000 credentials at the time
              of this chapter's research, segmented into customer, employee, and third-party categories; LeakRadar's own
              published methodology notes this class of exposure typically originates from malware on end-user devices
              rather than a direct breach of the monitored company's own systems, so this data point documents a real
              and material exposure surface without confirming Salla's infrastructure was itself compromised. No source
              reviewed anywhere in this report discloses Salla's hosting or cloud-infrastructure provider, a public
              status or incident page, or an independently verified uptime record, and the Product & Technology chapter
              separately found that PCI DSS payment-card compliance and ZATCA e-invoicing integration are both
              company-claimed rather than third-party-certified. On the consumer-protection side, Trustpilot's aggregate
              rating for the salla.sa domain is 'Bad' (1.7 of 5 across 21 reviews), dominated by buyer complaints about
              scam-adjacent stores and weak dispute mediation -- a friction point that sits inside Saudi Arabia's active
              e-commerce consumer-protection mandate. Salla's own help-center documentation describes a formal
              Complaints System through which a buyer can escalate a dispute against a store, and at least one
              independently reviewed case (a Trustpilot review naming the merchant 'alnasser sports') shows this process
              functioning to a resolution, but this chapter finds no aggregate, disclosed dispute-resolution rate,
              average resolution time, or complaint volume. Zero tagged Salla questions on Stack Overflow and no
              disclosed developer-relations headcount point to a thin external-troubleshooting ecosystem, which could
              raise Salla's own support burden if its merchant base scales as the company and its investors claim.
            claimRefs:
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
