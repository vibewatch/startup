      - number: '8.3'
        title: Financing context, entry discipline, and dilution/preference overhang
        blocks:
          - type: paragraph
            body: >-
              The only disclosed financing event is the March 2024 round: $130 million led by Investcorp through its
              Saudi Pre-IPO Growth Fund, with Sanabil Investment and existing shareholder STV participating, and
              Investcorp's Robin Mansour joining Salla's board -- but the round's post-money valuation, share price,
              liquidation-preference terms, and total primary versus secondary split are not disclosed in any reviewed
              source. Earlier funding history is thin and partly contested: one source (MENAbytes) documents an $8.5
              million Series A, while a separate analytics aggregator (GetLatka) describes Salla as "bootstrapped with
              no outside investment," a direct conflict with the well-corroborated $130 million round and one this
              chapter flags as a data-quality problem with that aggregator rather than evidence Salla was actually
              unfunded before 2024. Because no share price, cap table, or preference stack is public, entry discipline
              for any prospective investor today cannot be expressed as a specific price test; the only available
              discipline is procedural: require disclosure of the 2024 round's valuation and preference terms, the
              current cap table, and audited or management-reviewed financials before committing new capital, and treat
              the "Pre-IPO Growth Fund" naming as a directional signal of listing intent rather than a committed
              timetable. Saudi Arabia's Tadawul exchange had roughly 40 companies in its 2026 IPO pipeline per AGBI
              reporting, and comparable Saudi fintech/e-commerce peers Tabby and Tamara were both pursuing Tadawul
              listings as of 2025 per Vision2030.ai's venture-funding analysis, which is the closest public evidence
              this chapter has for Salla's own eventual exit path.
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
              - CV033
              - CV036
      - number: '8.4'
        title: Bull, base, and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes Salla's higher-end scale claims (100,000-plus merchants, $10 billion in enabled
              sales since 2020 per Investcorp's own portfolio page) are broadly accurate, that its take-rate and
              subscription mix resemble the more profitable end of global e-commerce-SaaS peers, and that a Tadawul
              listing follows Tabby's and Tamara's path toward a multi-billion-dollar mark, supported by GASTAT data
              showing the digital economy at 15.6% of Saudi GDP and continued double-digit e-commerce market growth. The
              base case assumes the lower, more conservative scale figures (Tap's ~68,000 stores or StoreLeads' 22,342
              live-store count) are closer to current reality, that Salla's economics sit near the public
              e-commerce-SaaS median (roughly 1.7x-2.8x EV/Revenue per Multiples.vc and Yahoo Finance data on Wix), and
              that any future listing is priced more cautiously than Tabby's given Salla's thinner public disclosure and
              unresolved regulatory/brand questions. The bear case assumes the scale-metric conflict reflects genuine
              overstatement in the higher figures, that undisclosed compliance gaps identified in the Risks chapter
              surface as real remediation costs or reputational damage before any listing, and that public
              e-commerce-SaaS multiples continue compressing (Wix's own EV/Revenue multiple fell from roughly 2.84x to
              0.79x across the year to March 2026 per Yahoo Finance), materially delaying or shrinking any exit.
              Probability signals favor the base case: the underlying Saudi digital-economy growth story is
              well-corroborated by GASTAT and Statista, and Salla's named-platform status is repeatedly confirmed by
              independent sources, but no source provides enough financial granularity to assign confident probability
              weights beyond a qualitative base-case lean.
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
              - CV030
