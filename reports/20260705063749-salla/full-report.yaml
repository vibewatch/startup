      - number: '3.3'
        title: Switching costs, lock-in, multi-homing, and distribution power
        blocks:
          - type: paragraph
            body: >-
              Re-platforming an operating storefront between SaaS vendors requires migrating product catalogs, themes,
              checkout and payment-gateway integrations, and app or plugin dependencies -- a generic switching cost
              evidenced by the sheer breadth of each platform's own integration and developer documentation, from
              Salla's Merchant API and Twilight theme SDK to Shopify's partner and app ecosystem. Salla's own platform
              documentation markets one-click toggles for connecting or disconnecting payment gateways and logistics
              companies as a merchant-facing simplicity feature; by design, this same toggle architecture also lowers
              the barrier to adding new local integrations without a full re-platform, a double-edged property that cuts
              against pure lock-in even as it deepens Salla's local-integration footprint. At the demand-generation
              layer, KSA merchants are not confined to a single channel: a merchant can simultaneously operate an owned
              Salla or Zid storefront and list products on marketplace channels such as noon or Amazon.sa, meaning
              multi-homing across storefront-plus-marketplace is both possible and, per noon's continued growth and
              fresh $500 million raise, evidently common enough to sustain a large adjacent marketplace business. On
              distribution power specifically, Shopify's partner program reports paying out $1.3 billion to partners in
              2025 alone and claims up to 36% better checkout conversion than competitors -- self-reported figures that
              nonetheless illustrate an ecosystem scale several orders of magnitude larger than Salla's disclosed 500+
              partner developers, giving Shopify substantially more bargaining leverage with both merchants and
              third-party app developers. WooCommerce sits at the opposite extreme: its zero-platform-fee, fully
              self-hosted model gives merchants complete technical control and no vendor lock-in at the software layer,
              but shifts hosting, security, and (implicitly) local regulatory compliance burden onto the merchant or its
              agency, a cost that is real but harder to observe directly than a subscription fee. No source reviewed for
              this chapter documents contractual exclusivity or anti-multi-homing clauses for Salla, Zid, or any
              profiled global competitor, leaving the formal (as opposed to behavioral) distribution-power mechanics an
              open evidence gap.
            claimRefs:
              - CP023
              - CP024
              - CP025
              - CP026
              - CP027
