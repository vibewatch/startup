  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Salla scores well on market and demand proof but low on economic visibility and valuation support given the
      near-total absence of disclosed financials.
    data:
      items:
        - label: Market demand
          score: 8
          detail: Named a dominant Saudi e-commerce platform inside a large, growing digital economy.
          tone: positive
        - label: Capital / investor proof
          score: 7
          detail: Institutional capital from Investcorp, Sanabil, and STV, with an explicit pre-IPO framing.
          tone: positive
        - label: Moat / platform depth
          score: 6
          detail: Disclosed payments, BNPL, tax, and app-marketplace integrations show real platform breadth.
          tone: neutral
        - label: Economics visibility
          score: 2
          detail: No disclosed revenue, margin, or cash-flow figures anywhere in this corpus.
          tone: negative
        - label: Scale-metric reliability
          score: 3
          detail: Public store/merchant counts conflict by roughly 3-5x depending on source.
          tone: negative
        - label: Governance / execution risk
          score: 4
          detail: Single disclosed board seat and unresolved regulatory/brand questions from the Risks chapter.
          tone: warning
        - label: Valuation support
          score: 2
          detail: No disclosed price or financial base exists to support any specific valuation claim.
          tone: negative
        - label: Evidence quality
          score: 5
          detail: Good directional and comp-level evidence, but far short of filing-grade disclosure.
          tone: neutral
    approximationNotes: >-
      Scores are this chapter's qualitative synthesis of the evidence above (1-10 scale), not a third-party or
      company-provided rating.
    claimRefs:
