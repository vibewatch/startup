      - number: '4.3'
        title: 'Cost structure, compliance burden, and capital adequacy: one disclosed raise, no cash or burn data'
        blocks:
          - type: paragraph
            body: >-
              No source in this chapter discloses Salla's cost of goods sold, hosting spend, payment-processing cost, or
              gross margin. The clearest external anchor for what a healthy margin should look like comes from outside
              Salla entirely: Aleph's 2026 SaaS-benchmarking report, compiled from full-year-2025 data across 342 SaaS
              and AI-native companies, puts the median 2025 software gross margin at 80% (76% blended with services
              revenue), with a top-quartile mark of 86% and a bottom-quartile mark of 50% for companies not yet
              optimizing delivery costs -- a useful expectations anchor, but not a Salla-specific figure. A concrete,
              Salla-specific cost driver is regulatory: Saudi Arabia's Zakat, Tax and Customs Authority (ZATCA) has
              mandated e-invoicing since 4 December 2021 (Phase 1, generation) and rolled out Phase 2 integration
              requirements by taxpayer wave starting 1 January 2023, which obliges any Saudi e-commerce SaaS platform,
              including Salla, to build and maintain compliant invoice-generation and tax-authority integration -- a
              compliance cost that is structurally certain to exist even though no source quantifies it for Salla
              specifically, and no reviewed source contains an explicit statement that Salla's own platform is
              ZATCA-compliant.


              Salla's only disclosed capital event is the $130 million pre-IPO round announced 4 March 2024, led by
              Investcorp through its Investcorp Saudi Pre-IPO Growth Fund LP, alongside Sanabil Investment (a wholly
              owned Saudi Public Investment Fund company) and existing shareholder STV. Code & Co.'s due-diligence case
              study, prepared for Investcorp ahead of this investment, confirms the fund's explicit mandate is "equity
              growth capital investments...with the potential to access the capital markets" -- language this chapter
              reads as evidence that an eventual public listing is the anticipated next capital-market event for Salla,
              not as confirmation of a scheduled IPO date, timeline, or valuation. No reviewed source discloses Salla's
              current cash balance, monthly burn, runway, a specific use-of-funds breakdown for the $130 million round,
              or any debt, venture-debt, or project-finance facility held by the company. At the macro level, Saudi
              Arabia's Kafalah SME Loan Guarantee Program -- a government-backed financing-guarantee vehicle jointly run
              by the Ministry of Finance and the Saudi Industrial Development Fund -- illustrates that a broader public
              financing safety net exists for small merchants who might sell on Salla, but no source in this corpus
              documents Salla itself, or its merchants specifically, as a confirmed Kafalah beneficiary.
