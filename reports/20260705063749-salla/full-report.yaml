  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product overview and module map: a full merchant-operations suite, not just a storefront builder'
        blocks:
          - type: paragraph
            body: >-
              Salla packages far more than a storefront template into one merchant product. Its own marketing content
              (via a 2026 sponsored feature on Tap Payments' blog) describes a single dashboard that covers store setup,
              product listings, order and inventory management, native payment acceptance (mada, Visa, Mastercard,
              American Express, Apple Pay, and Tabby buy-now-pay-later, across 15-plus currencies), logistics-carrier
              connections with no separate contracts, built-in loyalty and rewards tooling, and marketing integrations
              spanning email (Klaviyo, Mailchimp), social advertising (Snapchat, Instagram, TikTok, X, Google), and
              WhatsApp order-confirmation messaging. A distinct native-app-builder module lets a merchant generate a
              branded Android or iOS shopping app "in 72 hours, no code," which stays synchronized with the main web
              store; this module is delivered separately from Salla's own first-party mobile apps. Salla ships at least
              one confirmed first-party app on Google Play -- a merchant-management app (package com.emoney.sallacp,
              developer "Nawaf Hariri", 500,000-plus installs) for running an existing store from a phone. A second
              Google Play listing, "Salla | sala" (package com.faya.sala), markets itself as a cross-store consumer
              shopping app, but its developer field reads "Faya Dev Ltd" (a UK-registered entity) with only 100-plus
              downloads -- this corpus cannot confirm whether that listing is an official Salla-operated app, an
              authorized white-label build, or an unrelated third party trading on the Salla name, so it is treated as
              an open brand-attribution question rather than a confirmed first-party asset.


              Layered on top of this merchant-facing suite is a third-party App Store (apps.salla.sa) and a Partners
              Portal (docs.salla.dev / salla.partners) that let external developers list paid "Private" or "Public" apps
              and build custom integrations -- the same ecosystem quantified in this report's Financials chapter. A
              real, if modest, external tooling layer backs that ecosystem: Salla publishes five distinct packages under
              the `@salla.sa` scope on npm (a CLI, a base UI kit, a web-component library, a Tailwind theme, and an
              Apple Pay SDK), and a search of the public npm registry for "salla" returns 53 total packages, including
              at least one independent community-built package (an n8n workflow-automation node) that is not part of
              Salla's own scope -- evidence that outside developers invest engineering effort in Salla integrations
              beyond what Salla itself ships.
