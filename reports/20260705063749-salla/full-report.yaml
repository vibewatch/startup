  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >-
              This chapter ranks Salla's disclosed and inferred risks by severity and mitigation maturity rather than by
              topic alone. The two highest-severity, least-mitigated categories are regulatory/compliance opacity
              (Personal Data Protection Law, Cybersecurity Law, and NCA cloud-security controls all apply, but no source
              discloses a compliance certification or registration status) and an unresolved brand/IP-control question
              around a second Google-Play listing using the Salla name. Credential-exposure risk is already observed
              rather than hypothetical: an independent breach-monitoring vendor documents tens of thousands of
              salla.sa-linked credentials circulating in infostealer-malware dumps, split across customer, employee, and
              third-party categories, though this reflects device-side malware rather than a confirmed breach of Salla's
              own systems. Partner concentration is moderate: Salla relies on named counterparties for payments (Tap),
              buy-now-pay-later (Tamara, Tabby), and lead capital (Investcorp), but none appears to be a single point of
              failure for a critical function given multiple parallel rails. Key-person and governance risk is elevated
              because only two named executives (CEO Nawaf Hariri, COO Salman Butt) and one named non-founder board
              member (Investcorp's Robin Mansour) recur across every source in this corpus, with no disclosed succession
              plan or broader management bench. No source discloses an active lawsuit, regulatory sanction, or
              enforcement action naming Salla specifically; this chapter treats that absence as an evidence gap
              requiring direct diligence rather than as confirmation of a clean record, and the investment implication
              throughout is that Salla's pre-IPO stage raises the bar for the disclosure depth a future public listing
              would require relative to today's record.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
