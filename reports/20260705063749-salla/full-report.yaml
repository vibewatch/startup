chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, headquarters, founders, and business model
        blocks:
          - type: paragraph
            body: >-
              Salla is a Saudi Arabian software-as-a-service company that lets merchants launch and run an online store
              without writing code, bundling storefront hosting, payments, shipping, and marketing tools into one
              subscription product. Multiple funding-round announcements and Salla's own investor-facing profiles
              converge on the same founding story: the company was established in 2016 in Makkah (Mecca) by Nawaf Hariri
              and Salman Butt, two Saudi entrepreneurs who wanted to remove the technical and logistical hassle of
              standing up an Arabic-language e-commerce storefront. Nawaf Hariri is consistently identified as CEO and
              co-founder across investor announcements and press coverage, while Salman Butt is named as co-founder and
              Chief Operating Officer in Series A coverage. The product itself is described the same way across sources:
              a proprietary SaaS solution that lets a merchant build a website, accept online payments, and arrange
              shipping within hours, integrated with more than 400 third-party applications spanning marketing,
              logistics, and payments. Salla's revenue model, per CEO commentary reported by Entrepreneur Middle East,
              has two legs -- subscription plans (Basic, Plus, Pro, Special) and "merchant solutions" revenue from
              shipping, payment processing, and third-party app fees -- rather than a single per-transaction take rate.
              Public plan pricing on Salla's own Tap Payments partner content shows a free Basic tier and paid Plus (SAR
              99/month) and Pro (SAR 299/month) tiers, with Salla Special reserved for high-volume merchants on custom
              pricing. Because Salla's primary marketing site (salla.com) returns bot-protection challenge pages to
              automated fetches, most of the identity detail in this chapter is corroborated through funding
              announcements, investor portfolio pages, and independent trackers rather than the company's own homepage
              copy.
