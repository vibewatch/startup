  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape -- direct peers, incumbents, adjacents, and status quo
        blocks:
          - type: paragraph
            body: >-
              Salla's competitive set spans five categories. The direct peer most consistently named alongside Salla is
              Zid, a fellow Saudi-native e-commerce SaaS platform; a 2024 Arab News "Startups of the Year" feature
              profiles Zid and Salla together as co-leaders of the Kingdom's e-commerce SaaS wave, though Zid's
              standalone revenue, funding total, and merchant count are not independently disclosed anywhere in the
              reviewed corpus beyond that joint feature. Global incumbent SaaS and self-hosted commerce platforms --
              Shopify, BigCommerce, WooCommerce (built on WordPress), and Salesforce Commerce Cloud -- all publish
              self-serve or contact-based pricing and product pages reachable by a Saudi merchant evaluating
              alternatives to Salla, positioning them as incumbent substitutes with global brand recognition Salla does
              not yet carry. Adjacent and substitute channels include marketplace-first selling: noon, a Middle East
              marketplace, disclosed a $500 million funding round on 12 December 2025 backed by sovereign capital, while
              Amazon.sa offers a comparable commission-based listing path; both let a merchant reach buyers without
              operating an owned storefront, trading direct customer-data ownership for demand aggregation and logistics
              support. Status-quo alternatives that any SaaS platform must still displace include continued offline
              point-of-sale retail and unmanaged social-commerce selling via Instagram or WhatsApp without a dedicated
              checkout. A further substitute is internal build: Salla's own published Merchant API, OAuth 2.0, and SDK
              documentation implicitly show what a technically capable merchant or systems integrator would need to
              replicate to build an in-house storefront rather than subscribing to any vendor. Likely future entrants
              include global platforms deepening Arabic-language and Gulf-payment localization investment, and
              fintech-embedded commerce tooling -- illustrated by Tap Payments' own blog coverage of its Salla
              integration -- that increasingly bundles payment rails directly with storefront features, blurring the
              line between payments partner and platform competitor.
