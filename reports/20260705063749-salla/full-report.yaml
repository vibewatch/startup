      - number: '2.4'
        title: Growth drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Structural drivers point toward continued growth. Saudi Arabia carried 99% internet penetration and 78% 5G
              coverage into 2026 (Mordor Intelligence), while DataReportal counted 36.84 million internet users at the
              start of 2024; by early 2025, DataReportal instead reported 33.9 million internet users on a smaller 34.3
              million total-population base, a data revision that this chapter flags rather than reconciles, since
              neither DataReportal edition explains the drop. Mada's cash-to-card shift ($52.6 billion processed in
              2024, +25.8% year over year) and Monsha'at's SAR 800 million SME-digitization program are near-term demand
              accelerants, reinforced by Vision 2030's policy goal of lifting SME GDP contribution to 35%. Constraints
              are equally concrete. Trade.gov's market-challenges guide describes an unpredictable regulatory
              environment for foreign firms, a 15% VAT, a 20% corporate income tax on non-GCC entities, and tightening
              ZATCA transfer-pricing enforcement. Saudi Arabia's General Authority for Competition opened 459
              investigations in 2024 alone and specifically scrutinizes vertical arrangements, exclusivity, and
              resale-price-maintenance clauses -- a live risk for SaaS-enablement platforms whose merchant terms
              commonly bundle payments and logistics. Mordor Intelligence separately quantifies high last-mile delivery
              costs outside metro corridors and PDPL/NCA data-sovereignty compliance overhead as adoption drags,
              particularly for smaller or foreign entrants who lack Salla's existing Saudi-domiciled compliance posture.
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM023
              - CM024
              - CM036
          - type: table
            tableRef: TM004
            claimRefs:
              - CM010
              - CM023
              - CM024
              - CM025
              - CM036
          - type: figure
            figureRef: FM004
            claimRefs:
