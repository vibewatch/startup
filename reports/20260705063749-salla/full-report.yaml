      - number: '8.2'
        title: Recommendation, confidence, risk rating, and valuation stance
        blocks:
          - type: paragraph
            body: >-
              This chapter's recommendation is research-more: Salla shows real demand and institutional-capital proof,
              but the public record cannot support a specific buy, pass, or price call because no source discloses a
              valuation mark, revenue figure, or margin structure to underwrite against. Confidence in this
              recommendation itself is medium: the demand-side evidence (named-platform status, institutional capital,
              partner integrations) is corroborated across multiple independent sources, but the valuation-relevant
              evidence (any specific price, multiple, or financial statement) is entirely absent, which caps confidence
              below high regardless of how strong the qualitative thesis reads. Risk rating is high, driven by the
              combination of undisclosed financials, the unresolved scale-metric conflict, concentrated single-investor
              board governance, and the regulatory/brand-control questions carried over from the Risks chapter -- any
              one of which could swing a future valuation mark by a wide margin without public evidence today to bound
              that swing. Valuation stance is explicitly unknown rather than attractive, fair, stretched, or expensive:
              assigning any of those four labels would require a disclosed price or a disclosed financial base to
              compare it against, and this corpus has neither. This chapter deliberately avoids inventing a valuation
              figure for Salla; every dollar figure in this chapter's tables and figures is either a disclosed
              third-party comparable (Shopify, BigCommerce, Wix, Squarespace, Zid, Tabby, Ninja, Hala) or an explicitly
              labeled illustrative sensitivity band, never a claimed Salla-specific valuation.
            claimRefs:
              - CV009
              - CV010
