    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Because no valuation is disclosed for Salla, this range shows qualitative bull/base/bear positioning relative to
      disclosed regional and public comps rather than a dollar-denominated Salla valuation.
    data:
