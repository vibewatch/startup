    title: Company milestone timeline
    type: timeline
    layout: wide
    summary: >-
      From its 2016 founding through a 2026 platform relaunch, Salla's public record shows a steady financing and
      partnership cadence culminating in a $130 million pre-IPO round, alongside a 2025-2026 cluster of conflicting
      scale disclosures.
    data:
      items:
        - label: Founding
          date: '2016'
          detail: Nawaf Hariri and Salman Butt found Salla in Makkah as a code-free e-commerce store builder.
          tone: positive
        - label: Seed round
          date: '2018'
          detail: Vision Ventures and Raed Ventures provide undisclosed seed capital.
          tone: positive
        - label: Series A
          date: 2019-2020
          detail: STV leads an $8.5M round with Vision Ventures and Raed Ventures participating.
          tone: positive
        - label: Tamara BNPL
          date: '2021'
          detail: Buy-now-pay-later goes live for 10,000+ merchants via a Tamara partnership.
          tone: positive
        - label: STV growth round
          date: '2023'
          detail: STV "doubles down" with an undisclosed follow-on investment ahead of the pre-IPO raise.
          tone: positive
        - label: Pre-IPO round
          date: 2024-03
          detail: Investcorp leads a $130M round with Sanabil Investment and STV; Robin Mansour joins the board.
          tone: positive
        - label: 2024 partnerships
          date: '2024'
