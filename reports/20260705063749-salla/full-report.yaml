  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              The market Salla addresses is Saudi Arabia's B2C and, increasingly, B2B online-retail enablement layer:
              the software, payments, and logistics stack that lets a merchant sell physical goods directly to a buyer
              over the internet. Statista's own market-definition notes for its Saudi Arabia eCommerce Market Forecast
              are explicit about what counts -- physical-goods sales via desktop or mobile digital channels to a private
              end consumer -- and what does not: digitally distributed services, digital media downloads or streams, B2B
              wholesale trade, and C2C/reCommerce resale of used or repaired goods. That boundary matters because
              several adjacent, larger numbers are routinely cited alongside Salla's market without being the same
              quantity. Saudi Arabia's national payments network, Mada, processed $52.6 billion in e-commerce
              transactions in 2024 (Mordor Intelligence), a figure that includes bill payments and other
              card-present-adjacent flows beyond retail GMV. GASTAT separately reports SAR 249.8 billion in 2024
              operating revenue for the whole Information and Communications Technology sector -- telecom, cloud, and
              hardware included -- which trade.gov independently sizes at nearly $48 billion for the broader Saudi ICT
              market. Neither the Mada processing figure nor the ICT-sector revenue figure is interchangeable with
              e-commerce GMV, even though press coverage sometimes conflates them. Key status-quo substitutes for a
              Salla storefront include marketplace-only selling on Amazon.sa or noon (commission-based, no owned
              storefront), direct social-commerce selling via Instagram/WhatsApp without a dedicated checkout, and
              continued offline point-of-sale retail, which still represents most day-to-day Saudi consumer spending
              despite 99% internet penetration.
            claimRefs:
              - CM001
              - CM010
              - CM020
              - CM021
              - CM022
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM010
              - CM021
              - CM022
      - number: '2.2'
        title: Market sizing across multiple, conflicting lenses
        blocks:
          - type: paragraph
            body: >-
              No single source anchors Saudi Arabia's e-commerce market size, so this chapter carries five separate
              lenses rather than picking one. ResearchAndMarkets' Q1 2024 databook (syndicated via BusinessWire) puts
              2024 GMV at $20.7 billion, up 10.21% from $18.8 billion in 2023, forecasting an 8.53% CAGR to $28.7
              billion by 2028. Mordor Intelligence's 2026 industry report instead estimates the market at $27.96 billion
              in 2025 and $31.29 billion in 2026, growing at an 11.92% CAGR to $54.87 billion by 2031 -- roughly 50%
              higher than ResearchAndMarkets' contemporaneous estimate for an adjacent year, with neither publisher
              disclosing enough raw methodology to reconcile the gap. A third, non-GMV lens is Mada's processed
              e-commerce transaction volume ($52.6 billion in 2024, +25.8% year over year), which is larger than either
              GMV estimate because it captures a broader set of card-and-wallet-settled flows. A fourth lens, GASTAT's
              ICT-sector revenue (SAR 249.8 billion, 2024), is broader still and not e-commerce-specific. A fifth,
              global lens from UNCTAD's Digital Economy Report 2024 puts worldwide e-commerce sales above $27 trillion
              across 43 economies, situating Saudi Arabia's market as a small single-digit fraction of the global total.
              Within Mordor's framework, B2C held 73.54% of 2025 revenue versus a faster-growing B2B segment (13.45%
              CAGR); consumer electronics led product categories (27.06% share) while food and beverage grew fastest
              (13.72% CAGR); and smartphones drove 77.98% of B2C revenue share. Applying Mordor's 73.54% B2C share to
              its own 2026 total yields an approximate $23.0 billion B2C-only slice -- an analyst-derived approximation,
              not a separately published figure.
            claimRefs:
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
              - CM010
              - CM018
