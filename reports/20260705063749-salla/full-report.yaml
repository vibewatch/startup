  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Salla layers merchant-facing commerce features over a documented API/auth/event core, with theming and CLI tooling
      exposed to a real but modest external developer ecosystem.
    data:
      layers:
        - label: Experience layer
          detail: >-
            Merchant web dashboard, native mobile app builder, and two first-party Google Play apps (merchant management
            and consumer shopping)
          tone: positive
          modules:
            - Merchant dashboard
            - No-code app builder
            - com.emoney.sallacp (merchant app)
            - com.faya.sala (consumer app)
          outputs:
            - Store setup, order/inventory management, mobile shopping
        - label: Commerce services layer
          detail: Native payments, BNPL, logistics, loyalty, and marketing-tool integrations
          tone: positive
          modules:
            - mada / Visa / Mastercard / Amex / Apple Pay
            - Tabby BNPL
            - Logistics carrier connections
            - Klaviyo / Mailchimp / social ads / WhatsApp
          outputs:
            - Checkout, fulfillment, retention, growth campaigns
        - label: Extensibility layer
          detail: Third-party App Store and Partners Portal documentation for external developers
