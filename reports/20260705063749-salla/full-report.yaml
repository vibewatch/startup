      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Government-subsidized SME digitization is a structural, multi-year demand driver
            body: >-
              Monsha'at's SAR 800 million SME-digitization program, Vision 2030's 35% SME-GDP target, and the Mada
              network's $52.6 billion of 2024 e-commerce processing volume (+25.8% year over year) together point to
              policy-backed, multi-year tailwinds for SaaS-enabled online retail in Saudi Arabia, independent of any
              single market-size estimate. GASTAT's 15.6% digital-economy GDP share situates this as a national economic
              priority rather than a niche vertical.
            calloutType: insight
            claimRefs:
              - CM010
              - CM020
              - CM025
          - type: callout
            title: >-
              Market-size and platform-share estimates diverge by a wide margin, and no source isolates Salla's
              SaaS-specific SOM
            body: >-
              Independent analysts disagree by roughly 50% on Saudi Arabia's current e-commerce market size (Mordor
              Intelligence's $31.29 billion 2026 estimate vs. ResearchAndMarkets' $20.7 billion 2024 figure extrapolated
              forward), and DataReportal's own internet-user count fell between its 2024 and 2025 editions without
              explanation. Aftership's platform-share data covers only a ~44,500-store technographic panel, far smaller
              than any of Salla's own merchant-count disclosures from Chapter 1, so no source in this corpus cleanly
              isolates a dollar-denominated SaaS-enablement SOM for Salla specifically.
            calloutType: risk
            claimRefs:
