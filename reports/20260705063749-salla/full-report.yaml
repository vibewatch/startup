  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis for Salla rests on five load-bearing facts established across this report: it is repeatedly
              named (including by the U.S. International Trade Administration) as one of a handful of dominant Saudi
              e-commerce platforms; it operates in a Saudi e-commerce market GASTAT and Statista put in the tens of
              billions of dollars and still growing; it has raised institutional capital from Investcorp, Sanabil
              Investment (a Public Investment Fund company), and STV, with Investcorp's $130 million March 2024 round
              explicitly structured through a "Pre-IPO Growth Fund"; it has disclosed integrations across payments
              (Tap), BNPL (Tamara, Tabby), tax e-invoicing (ZATCA), and a large third-party app marketplace, showing
              platform depth beyond a bare storefront tool; and it sits inside a Saudi venture ecosystem where
              e-commerce was the top-funded sector in H1 2025 ($306 million, up 78% year-on-year per MAGNiTT) and where
              comparable companies (Tabby, Ninja, Hala) have closed mega-rounds and, in Tabby's case, reached a
              disclosed $3.3 billion pre-IPO valuation. The anti-thesis is equally load-bearing: no reviewed source
              disclosed Salla's own post-money valuation, annual revenue, gross margin, or cash runway; the company's
              own headline scale metric is genuinely contested (68,000 to 100,000-plus stores or merchants depending on
              source, against an independent technographic tracker's 22,342 live-store count); only one board seat
              (Investcorp's) is disclosed among three institutional investors, concentrating governance influence; and
              this report's Risks chapter found unresolved regulatory-disclosure, credential-exposure, and brand-control
              questions that a public listing would force into the open but that remain untested today. Each anti-thesis
              point maps to a specific, falsifiable diligence ask in this chapter's final section rather than to a
              generic caution.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
          - type: table
            tableRef: TV002
