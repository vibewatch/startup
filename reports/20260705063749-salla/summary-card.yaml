  topStrengths:
    - >-
      Repeatedly named among a handful of dominant Saudi e-commerce platforms by independent and official sources,
      including the U.S. International Trade Administration.
    - >-
      Institutional capital from Investcorp, Sanabil Investment, and STV, with the March 2024 round explicitly
      structured through a "Pre-IPO Growth Fund."
    - >-
      Disclosed product depth across payments, BNPL, tax e-invoicing, and a large third-party app marketplace,
      evidencing platform breadth beyond a bare storefront tool.
    - >-
      Operates inside a large and still-growing Saudi digital economy (15.6% of GDP per GASTAT) where e-commerce was the
      top-funded VC sector in H1 2025.
  topRisks:
    - >-
      No reviewed source discloses Salla's valuation, revenue, gross margin, or cash position, blocking any
      price-sensitive recommendation.
    - >-
      Public store/merchant scale metrics conflict by roughly 3-5x depending on source and definition, undermining every
      growth and market-share claim.
    - >-
      Saudi Arabia's Personal Data Protection Law and Cybersecurity Law both apply, but no source confirms Salla's
      compliance or certification status, and a breach-monitoring vendor independently documents 91,000+ salla.sa-linked
      credentials in infostealer-malware dumps.
    - >-
      Governance is concentrated, with only Investcorp's Robin Mansour disclosed as a board member among three
      institutional investors, and only two named executives recurring across all public sources.
    - >-
      An unresolved brand/IP-control question (a second Google Play listing, com.faya.sala, using the Salla name)
      remains an open reputational and trademark question.
  unresolvedGaps:
    - The March 2024 round's post-money valuation, share price, and preference terms are not public.
    - A single reconciled merchant/store count with a stated definition and measurement date has not been disclosed.
    - Audited or management-reviewed financial statements (revenue, margin, cash flow) are not public.
    - >-
      PDPL and Cybersecurity Law compliance status, and the com.faya.sala brand-control question, both remain unresolved
      pending direct company disclosure.
    - >-
      No specific Tadawul IPO timetable, underwriter, or CMA filing naming Salla has been confirmed, despite directional
      pre-IPO and market-pipeline signals.
