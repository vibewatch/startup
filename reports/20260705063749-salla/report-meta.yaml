companyProfile:
  summary: Salla is a Makkah-headquartered Saudi e-commerce SaaS platform, founded in 2016, that lets merchants build online stores, accept payments, and manage shipping and a large third-party app ecosystem. It has raised institutional pre-IPO capital from Investcorp, Sanabil Investment, and STV, and is repeatedly named among a handful of dominant Saudi e-commerce platforms, but it discloses no public valuation, revenue, or margin figures, and its own headline scale metrics conflict sharply across sources.
  foundedDate: '2016-01-01'
  founders:
    - name: Nawaf Hariri
      role: CEO and co-founder
      background: Publicly named CEO across every funding announcement reviewed for this report.
      claimRefs: [CO001, CO002]
    - name: Salman Butt
      role: Co-founder and COO
      background: Co-founder and Chief Operating Officer.
      claimRefs: [CO001, CO003]
  foundingLocation: Makkah (Mecca), Saudi Arabia
  headquarters: Makkah (Mecca), Saudi Arabia
  productSummary: Salla provides a proprietary SaaS platform for building e-commerce storefronts, accepting online payments (with Tap), offering buy-now-pay-later (Tamara, Tabby), handling ZATCA-compliant e-invoicing, and extending functionality through a 400+ app third-party marketplace.
  customerFocus: Saudi and wider Gulf small-to-mid-size merchants building or migrating an online store.
  businessModel: Tiered store subscriptions (Basic/Plus/Pro/Special), plus merchant-solutions revenue from payments, shipping, and third-party app-marketplace transactions.
  stage: late-stage private (pre-IPO)
  fundingStatus: Raised $130 million in March 2024 led by Investcorp through its Saudi Pre-IPO Growth Fund, with Sanabil Investment and existing shareholder STV participating; an earlier $8.5 million Series A and an undisclosed 2018 seed round are also documented. No post-money valuation has been publicly disclosed for any round.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO004, CO007, CO009, CI001, CV005]
