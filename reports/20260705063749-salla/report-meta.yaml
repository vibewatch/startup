coverageNotes: Public evidence is strong on Salla's named-platform status, product/partner depth, and institutional capital, but no reviewed source discloses its valuation, revenue, margin, or cash position, and its headline scale metrics (store/merchant counts, cumulative GMV) conflict by roughly 3-5x across sources depending on definition and vintage. This report treats that conflict as a disclosed data-quality problem rather than resolving it to a single canonical figure, and it does not invent a valuation for Salla anywhere.
