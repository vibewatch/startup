      - number: '5.2'
        title: 架构与开发者生态：REST、OAuth2、webhooks，以及真实但小型的第三方构建面
        blocks:
          - type: paragraph
            body: >-
              Salla 自己的开发者文档写明，其 Merchant REST API 由 OAuth 2.0 保护，webhook 系统用于实时店铺事件通知， serverless “App Functions”
              层可在不暴露商户侧基础设施的情况下托管自定义 App 逻辑，Twilight theming framework 用于构建和发布自定义店铺主题。开发者通过官方 `@salla.sa/cli` npm
              package 触达这套架构；该 package 页面称其为 “官方 Salla 命令行界面”，提供从命令行创建、启动本地服务、认证、关联、删除和升级 Salla App 项目的命令， 并在公开 GitHub
              repository（SallaApp/Salla-CLI）重新发布了可运行示例。Salla 还发布 `@salla.sa/twilight` （打包 Web
              components、事件处理和请求工具的主题工具包）、`@salla.sa/twilight-components` （底层 Web 组件库）和
              `@salla.sa/twilight-tailwind-theme`（基于该工具包的 Tailwind CSS 主题） ——三者版本号相同，且都在本报告 runDate
              前数日内发布，说明这是仍在维护、协同推进的 release train，而不是弃置工具。 仅 `@salla.sa/twilight-tailwind-theme` 就报告约 15,000 次每周 npm
              下载量和 4 个依赖包， 可作为方向性（未经审计）代理，判断有多少主题或项目建在 Salla 官方组件层之上。


              在 Salla 自有工具之上，独立开发者表面已经有一定规模。GitHub code search “salla-api” 会浮现多个第三方、非官方开源项目： 一个专门面向 Salla 登录流程的 Node.js
              Passport.js OAuth 2.0 认证策略、一个 Salla API 的 Python 客户端库、一个面向 Salla 店铺数据的 Telegram bot 封装，以及——考虑到 runDate
              最值得注意——一个 “Salla Merchant API MCP Server”，即一个可让 AI agents 以编程方式接入 Salla 商户数据的 Model Context Protocol
              server。 它们都不是 Salla 维护；其存在说明第三方正有机投入 Salla API 表面，但可靠性、安全姿态和维护完全不在 Salla 控制内。 与此相对，Salla 在 Stack Overflow
              的公开开发者社区可见度几乎为零：截至本报告 runDate，平台 “salla” tag 搜索返回 0 个带标签问题；相比 GitHub 和 npm 上真实但有限的活动，这意味着 Salla
              的开发者支持大概率走自有 Partners Portal、 直接支持渠道或非正式渠道，而不是公开 Q&A。积极的一面是，Salla 的 Partners Portal 本身曾入围 2025 Developer
              Portal Awards； 这是独立第三方运营的认可项目，至少说明一个外部开发者体验评审机构对 Salla 文档质量有正面看法——但入围不等于获奖， 本语料也没有来源确认获奖结果。
