  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品概览与模块图：完整的商户运营套件，不只是店铺搭建器
        blocks:
          - type: paragraph
            body: >-
              Salla 打包进商户产品的，远不止一个店铺模板。其自有营销内容（Tap Payments 博客 2026 年赞助专题）
              描述了一个单一仪表盘：覆盖店铺搭建、商品上架、订单和库存管理、原生支付受理（mada、Visa、 Mastercard、American Express、Apple Pay，以及 Tabby 先买后付，支持
              15+ 种货币）、无需另签合同的物流承运商连接、 内置忠诚度和奖励工具，以及横跨 email（Klaviyo、Mailchimp）、社交广告（Snapchat、Instagram、TikTok、X、Google）
              和 WhatsApp 订单确认消息的营销集成。一个独立的原生 App 构建模块让商户“72 小时、零代码”生成带品牌的 Android 或 iOS 购物 App，并与主 Web 店保持同步；该模块不同于
              Salla 自己的一方移动 App。Salla 在 Google Play 至少有一个已确认的一方 App —— 商户管理 App（package com.emoney.sallacp，developer
              “Nawaf Hariri”，安装量 500,000+），用于在手机上管理既有店铺。 第二个 Google Play 条目 “Salla | sala”（package
              com.faya.sala）自称跨店消费者购物 App，但开发者字段是 “Faya Dev Ltd”（一家英国注册实体），下载量只有 100+。本语料无法确认该条目是 Salla 官方运营的
              App、授权白标版本， 还是借 Salla 名义运营的无关第三方，因此将其视为待厘清的品牌归属问题，而不是已确认的一方资产。


              在这套面向商户的产品之上，Salla 还搭了第三方 App Store（apps.salla.sa）和 Partners Portal （docs.salla.dev /
              salla.partners），让外部开发者上架付费的私有（“Private”）或公开（“Public”）应用，并构建定制集成—— 也就是本报告 Financials
              章节量化的同一个生态。支撑该生态的外部工具层真实存在，规模虽小：Salla 在 npm 的 `@salla.sa` scope 下发布了 5 个不同软件包（CLI、基础 UI kit、Web
              组件库、Tailwind 主题和 Apple Pay SDK），在公开 npm registry 搜索 “salla” 会返回 53 个软件包，其中至少包括一个独立社区构建软件包 （n8n
              工作流自动化节点），不属于 Salla 自身 scope——这说明除 Salla 自有交付之外，外部开发者也在为 Salla 集成投入工程资源。
