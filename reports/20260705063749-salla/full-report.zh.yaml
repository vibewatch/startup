    rows:
      - - 上线新的在线店铺
        - 以往通常要定制开发，或用通用模板构建器，再手动接入本地支付
        - 选择模板、添加商品、接入 Mada/Tabby 后上线——独立评测者称一天内可上线
        - 独立确认上线速度快（同一评测者称，基础店铺不到 1 小时）
        - 设置速度来自评测者观察的单个案例，不是跨店铺类型基准平均值
      - - 接受沙特本地支付和 BNPL
        - 商户过去需要按支付方式分别签网关合同
        - 一个仪表盘原生支持 mada、Visa、Mastercard、Amex、Apple Pay 和 Tabby BNPL
        - 评测者称 Mada/Tabby 设置耗时 5 分钟
        - 本资料集未披露这些集成的费用 / 佣金条款
      - - 向沙特 / GCC 以外客户销售
        - 否则需要单独的国际税务 / 物流栈
        - Salla 支持 15+ 种结账币种
        - 币种覆盖是一个具体、可量化的说法
        - 独立评测者称，多国税务设置和非 GCC 物流仍需手动处理且受限
      - - 用自定义功能扩展店铺
        - 否则需要围绕未公开文档的后端做定制开发
        - App Store（apps.salla.sa），加上有文档的 REST API、OAuth2、webhooks 和 CLI/SDK 工具
        - 外部开发者生态已经存在，虽不大但真实（npm 包、GitHub 项目）
        - 评测者称插件生态“比 Shopify 小得多”，因此特定集成可能不存在
      - - 分析店铺表现
        - 否则需要把原始订单数据导出到电子表格或 BI 工具
        - 内置仪表盘在一处显示订单、库存和收入
        - 独立评测者确认可“开箱即用”
        - 免费 / 基础层级报告不含按品类销售拆分，需付费升级
      - - 解决买家—商户纠纷
        - 市场平台（Amazon、Noon）通常直接调解纠纷
