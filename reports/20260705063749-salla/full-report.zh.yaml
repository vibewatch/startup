      - number: '7.3'
        title: 运营与安全风险：已观察到凭证暴露、基础设施未披露，以及消费者保护摩擦
        blocks:
          - type: paragraph
            body: >-
              一家 breach-monitoring vendor（LeakRadar）独立报告，salla.sa-linked credentials 出现在 infostealer-malware dumps 中；
              本章节研究时，动态更新 counter 显示超过 91,000 条 credentials，并分为客户、员工和第三方类别。LeakRadar 自己发布的方法论指出， 这类暴露通常来自终端用户设备上的
              malware，而不是被监控公司自有系统被直接攻破；因此该数据点证明了真实且重大的暴露面， 但不确认 Salla infrastructure 本身已被入侵。本报告任何地方审阅的来源都没有披露 Salla 的
              hosting 或 cloud-infrastructure provider、公开 status 或 incident page、 或经独立验证的 uptime record；Product &
              Technology 章节还单独发现，PCI DSS 支付卡合规和 ZATCA 电子发票集成都只是公司主张， 而非第三方认证。消费者保护侧，Trustpilot 对 salla.sa domain 的汇总评分是
              “Bad”（21 条评论中 1.7/5），主要由买家投诉 疑似诈骗店铺和弱纠纷调解驱动——这正落在 Saudi Arabia 活跃的 e-commerce consumer-protection mandate
              内。Salla 自有 help-center documentation 描述了正式 Complaints System，买家可借此升级与店铺的纠纷；至少一个经独立审阅的案例（Trustpilot review
              点名商户 “alnasser sports”） 显示该流程运转到解决。但本章节没有找到汇总且已披露的纠纷解决率、平均解决时间或投诉量。 Stack Overflow 上 Salla tagged
              questions 为 0，且未披露 developer-relations headcount，说明外部 troubleshooting ecosystem 很薄；
              如果商户基础按公司和投资人所称继续扩张，这可能抬高 Salla 自身 support burden。
            claimRefs:
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
