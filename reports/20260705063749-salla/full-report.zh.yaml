      - number: '7.2'
        title: 监管与法律风险：合规制度已进入执行期，但没有确认 Salla 特定合规证据
        blocks:
          - type: paragraph
            body: >-
              按 CMS international legal expert guide，Saudi Arabia 的 Personal Data Protection Law（PDPL）在 1 年宽限期之后， 于 2024
              年 9 月 14 日全面生效并进入主动执法；一般违规行政罚款最高 SAR 5 million（约 $1.33 million）， 对故意非法披露敏感数据另有 SAR 3 million 罚款加最高 2
              年监禁，Saudi Arabia 的 Cybersecurity Law 和 telecom regulator（CITC） 还可对相关违规分别追加最高 SAR 5 million 和 SAR 25
              million 罚款。Saudi Press Agency 报道确认，SDAIA 通过专门委员会裁定已确认的 PDPL 违规 并处罚；National Cybersecurity Authority 已为
              e-commerce service providers（包括 SMEs）和消费者发布专门 cybersecurity guidelines， 还发布 Cloud Cybersecurity
              Controls（CCC-2:2024），为 cloud providers 和 tenants 设定数据本地化与最低安全要求—— 如果 Salla 未披露的托管基础设施是
              cloud-hosted，这些规则就会适用。另据 Saudipedia，Saudi Arabia 2019 E-Commerce Law（26 articles） 要求 online platforms
              保护消费者数据、披露商业注册详情、开具分项发票并遵守广告规则； 违规最高罚款 SAR 1 million，并可能暂停或封锁线上业务。U.S. International Trade Administration
              的 Saudi Arabia e-commerce country guide 明确把 Salla（以及 Zid、Noon、Jarir、Jahez、HungerStation）列为本地 dominant
              platform，并另行指出政府正主动加强 e-commerce consumer-protection regulation。 本语料没有来源确认 Salla 的具体 PDPL 注册状态、安全认证，或点名
              Salla 的 active lawsuit、regulatory sanction 或 enforcement action； 一个使用 Salla 名称的第二 Google Play
              条目（com.faya.sala）注册给一家看似无关的英国实体，也仍是 Product & Technology 和 Customers 章节延续下来的未决 brand-control 及潜在 trademark
              问题。
