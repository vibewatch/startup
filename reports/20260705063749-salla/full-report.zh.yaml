      - number: '2.2'
        title: 多个相互冲突视角下的市场规模
        blocks:
          - type: paragraph
            body: >-
              没有单一来源能锚定沙特电商市场规模，所以本章保留五套独立视角，而不是强行选一个。ResearchAndMarkets 的 2024 年 Q1 数据手册（经 BusinessWire 分发）把 2024 年 GMV
              放在 $20.7 billion，较 2023 年的 $18.8 billion 增长 10.21%，并预测到 2028 年以 8.53% CAGR 增至 $28.7 billion。Mordor
              Intelligence 的 2026 年行业报告则估计，市场在 2025 年为 $27.96 billion、2026 年为 $31.29 billion，并以 11.92% CAGR 增至 2031 年的
              $54.87 billion——比 ResearchAndMarkets 对相邻年份的同期估计高出约 50%；两家发布方都没有披露足够原始方法来调和差距。第三套非 GMV 视角是 Mada
              处理的电商交易量（2024 年 $52.6 billion，同比 +25.8%），它大于任一 GMV 估算，因为覆盖了更广的一组银行卡和钱包结算流。第四套视角是 GASTAT 的 ICT 行业收入（2024 年
              SAR 249.8 billion），范围更宽，也并非电商专属。第五套全球视角来自 UNCTAD 的 Digital Economy Report 2024：43 个经济体全球电商销售额超过 $27
              trillion，由此看，沙特市场只是全球总量中低个位数百分比的一小部分。在 Mordor 框架内，B2C 占 2025 年收入的 73.54%，B2B 增速更快（13.45%
              CAGR）；消费电子是最大品类（27.06% 份额），食品饮料增速最快（13.72% CAGR）；智能手机贡献 B2C 收入份额的 77.98%。把 Mordor 自己的 73.54% B2C 份额套到其
              2026 年总量上，可得到约 $23.0 billion 的纯 B2C 切片——这是分析师推导的近似值，不是单独发布的数据。
