        title: 留存与满意度：未披露 NRR/GRR/churn，但评论平台和应用商店信号指向不同方向
        blocks:
          - type: paragraph
            body: >-
              本章节审阅的来源——无论官方、投资人还是独立来源——都没有披露 Salla 商户的 net revenue retention、gross revenue retention、churn、 renewal
              rate 或合同期限；本章节将缺失转为明确证据缺口，而不是估算。可用代理信号混杂，而且衡量对象不同。 Salla 官方商户管理 App 在 Google Play 约 5,800 条评论中得分 3.3/5，安装量
              500,000+——这是一个中等但评论量充足的信号， 专门指向商户日常工具体验。Trustpilot 对 salla.sa domain 的汇总评分低得多：“Bad（差）”，21 条评论中得分 1.7/5，
              主要由买家投诉疑似诈骗店铺和弱纠纷调解驱动，而不是投诉 Salla 自己的软件——这是关于 marketplace buyer trust 的不同信号， 不是商户对 SaaS
              产品的满意度。一篇独立商户侧评测（ZatcaHub，前文 Financials 和 Product & Technology 章节已引用）佐证了快速 Arabic-first setup
              和强本地支付集成可成为耐久性驱动因素，同时也记录 Shopify 之外较小的插件生态和较薄的免费层分析，这些摩擦点可能压制成长中商户的长期留存。 本章节无法独立抓取 G2 或 Capterra
              评论聚合页面；自动检索只拿到 JavaScript-only content，因此其 headline ratings 被记为 access-blocked evidence gap， 而不是二手引用。
