      - number: '8.5'
        title: 可比集：上市公司、私募轮次与先例交易
        blocks:
          - type: paragraph
            body: >-
              没有单一 comp 能干净匹配 Salla 的 Saudi-only geography、e-commerce-SaaS-enablement model 和 pre-IPO private status 组合，
              因此本章节有意使用混合可比集。上市 e-commerce-software companies 中，Shopify 和 BigCommerce 的 SEC 10-K filings 锚定
              audited-disclosure 端； Yahoo Finance 数据显示，Wix 最近一个季度 EV/Revenue 约 0.79x（较此前一年约 2.84x-5.09x
              大幅下行）；Squarespace 在 2024 年被 Permira 私有化， EV/Revenue multiple 为 6.6x（$6.99 billion），是本可比集中最高 multiple
              outcome。Multiples.vc 2026 年 6 月 public-software benchmark data 显示，e-commerce SaaS 的 NTM EV/Revenue median
              约 1.7x，明显低于更广义 public SaaS median 的约 2.2x，也远低于 design/engineering software 等 premium verticals（4.5x）。Saudi
              private comps 中，Zid——Salla 最接近的具名本土竞争对手——披露三轮共融资 $59 million （2022 年 $50 million Series B、2021 年 $7
              million Series A、2019 年 $2 million seed），最后一次披露轮次时覆盖约 7,500 stores； 与 Salla 已披露融资额和任何一项 claimed scale
              figures 相比都 materially smaller。Tabby（披露 pre-IPO valuation 为 $3.3 billion， 高于 2023 年末的 $1.5 billion）和
              Ninja（$250 million pre-IPO round）显示 Saudi consumer-fintech 和 e-commerce peers 可以支撑大型 late-stage marks；
              Hala 的 $157 million Series B 也显示 adjacent commerce-infrastructure categories 仍有 mega-round appetite——但三者都是
              fintech 或 quick-commerce businesses， 且披露了 Salla 没有公开分享的 metrics，限制了直接可比性。
            claimRefs:
              - CV031
              - CV032
