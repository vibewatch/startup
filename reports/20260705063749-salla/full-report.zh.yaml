            title: 规模指标冲突遮住真实市场位置
            body: >-
              Salla 已披露店铺/商户数从 22,342（StoreLeads，独立）到 68,000+（Tap Payments，伙伴）再到 55,000+ 名商户（Entrepreneur
              ME，媒体）不等；Shopify 或 BigCommerce 没有类似跨度，因为它们经审计的 SEC 文件各自给出一套统一的收入和 GMV 数字。这种披露标准不对称，应降低对 Salla 精确相对市场位置的信心。
