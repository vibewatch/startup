chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部、创始人与商业模式
        blocks:
          - type: paragraph
            body: >-
              Salla 是一家沙特 SaaS 公司，帮助商户无需写代码就能上线并运营网店，把店铺托管、支付、配送和营销工具打包进一个订阅产品。多份融资公告和 Salla 面向投资人的资料指向同一条创始故事：公司 2016
              年在 Makkah（Mecca）成立，创始人为 Nawaf Hariri 和 Salman Butt。两位沙特创业者要解决的是阿语电商店铺上线时的技术和物流麻烦。投资人公告和媒体报道都持续把 Nawaf
              Hariri 标为 CEO 兼联合创始人；Series A 报道则把 Salman Butt 标为联合创始人兼首席运营官。各来源对产品的描述也一致：一套自有 SaaS
              方案，商户可在数小时内搭出网站、接入在线支付并安排配送，同时集成 400 多个覆盖营销、物流和支付的第三方应用。Entrepreneur Middle East 报道的 CEO 评论显示，Salla
              的收入模型有两条腿——订阅计划（Basic、Plus、Pro、Special），以及来自配送、支付处理和第三方应用费用的「商户解决方案」收入，而不是单一按交易抽成。Salla 自有 Tap Payments
              伙伴内容公开的计划价格显示，Basic 为免费层，Plus（SAR 99/月）和 Pro（SAR 299/月）为付费层，Salla Special 面向大体量商户并采用定制定价。由于 Salla
              的主营销站点（salla.com）会向自动抓取返回机器人防护挑战页，本章多数身份细节来自融资公告、投资人组合页面和独立追踪器交叉确认，而不是公司首页文案。
