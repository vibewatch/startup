  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 对 Salla 的意义
    rows:
      - - B2C 零售电商（实物商品）
        - 消费者通过店铺、应用或第三方平台购买实物商品的在线销售
        - 数字服务、媒体下载 / 流媒体、B2B 批发、C2C/reCommerce（Statista 定义）
        - 消费者为最终付款方；SME / 品牌商户为卖方
        - Salla SaaS 店铺的核心可服务市场
      - - B2B 电商 / 批发数字贸易
        - 企业买方的数字采购订单和发票融资交易
        - 传统线下批发分销、非正式现金交易
        - 企业买方付款；SME / 制造商为卖方
        - Salla 和 Zid 正通过 B2B 门户功能开始争取的快速增长邻近细分（13.45% CAGR）
      - - 支付 / BNPL 处理量（Mada 网络）
        - 通过银行卡、钱包或 BNPL 通道清算的电商交易价值
        - 货到付款和线下刷卡零售交易
        - 消费者付款；商户 / PSP 收取费用
        - 邻近赋能层；可作为交易活动代理指标，但不等同于 GMV
      - - ICT 行业收入（更广义数字经济）
        - 全经济范围内的电信、云、软件和硬件收入
        - 非数字零售和非 ICT 服务
        - 企业和消费者在多个子行业中付款
        - 更广义的宏观背景（GASTAT、trade.gov）；尽管媒体常混用，但不能与电商 GMV 互换
      - - 仅第三方平台销售（Amazon.sa、noon）
        - 消费者直接在第三方平台完成的购买
        - 通过商户自有 SaaS 托管店铺完成的销售
        - 消费者付款；第三方平台抽佣
        - 对本可使用 Salla 的商户而言，第三方平台是关键现状替代方案 / 竞争分销渠道
      - - 线下 / 到店零售
        - 实体门店 POS 交易
        - 上述所有在线交易类型
        - 消费者付款；零售商为卖方
        - Salla 产品要转化为线上支出的基线现状
    notes: 边界遵循 Statista 发布的 B2C 电商定义；Mada 处理量和 ICT 行业收入仅用于邻近背景，并明确排除在本章其他位置使用的电商 GMV 数据之外。
