  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调问题
    rows:
      - - 99% 互联网普及率和 78% 5G 覆盖率
        - 驱动因素
        - 短至中期（0–4 年）
        - 减少接入摩擦，支撑 Salla 所依赖的移动优先结账流程
        - 核实 5G 覆盖率说法是否包括农村 / 二线地区，这些地方的最后一公里成本仍高
      - - Mada 从现金向银行卡迁移（2024 年处理 $52.6B，同比 +25.8%）
        - 驱动因素
        - 短期（<=2 年）
        - 扩大 Salla 接入商户可触达的银行卡 / 钱包付款人群
        - 索取 Salla 维度的支付结构数据（货到付款与银行卡 / 钱包占比），确认这股全国趋势是否传导到平台
      - - Monsha'at 中小企业数字化补贴（SAR 800M，824 家 SME）
        - 驱动因素
        - 中期（2–4 年）
        - 直接补贴商户入驻 Salla、Zid 等平台，降低商户获客成本
        - 确定 Salla 披露的商户基数中，有多少来自 Monsha'at 转介的 SME
      - - Vision 2030 中小企业 GDP 占比目标（35%）
        - 驱动因素
        - 长期（>=4 年）
        - 中小企业数字化获得持续政策顺风，SaaS 店铺采用也随之受益
        - 跟踪 35% 目标及配套资金承诺是否会在未来预算周期继续重申
      - - Z 世代社交电商和 BNPL 采用
        - 驱动因素
        - 短至中期
        - 借助集成的金融科技合作方（Tamara、Tabby）提高平均订单价值并撬动交叉销售
        - 获取 Salla 维度的 BNPL 挂载率和 AOV 提升数据，而不是依赖品类层面的估算
      - - 都市圈以外最后一公里配送成本高
        - 约束
        - 持续
        - 挤压 SME 商户利润率，拖慢农村 / 二线市场采用
        - 评估 Salla 的物流合作方集成是否能为非都市商户实质性降低最后一公里成本
      - - PDPL 数据本地化和网络安全合规开销
        - 约束
        - 持续，趋严
        - 推高平台运营成本，也可能劝退海外 SaaS 进入者，间接利好 Salla 这类沙特本土存量平台
        - 核实 Salla 自身的 PDPL / NCA 合规状态，以及公司是否把合规包装成提高切换成本的护城河
      - - GAC 2024 年执法升温（459 项调查；审查排他 / RPM 条款）
        - 约束
        - 近期（已生效）
        - 可能限制 SaaS 平台把支付 / 物流打包为排他条款；这类做法在赋能平台中常见
        - 审查 Salla 商户服务条款，寻找可能引来 GAC 审查的排他条款
      - - 跨境退货物流复杂
        - 约束
        - 持续
        - 与纯国内电商相比，限制国际化 / 邻近平台型电商增长
        - 评估 Salla 商户做跨境销售时，退货率或退货成本是否实质性更高
      - - 平台和商户的企业税 / VAT / zakat 合规负担
        - 约束
        - 持续
        - 增加 SaaS 平台必须吸收或转嫁的合规开销（例如 ZATCA 电子发票集成）
        - 核实 Salla 是否提供原生 ZATCA 电子发票合规工具，并把它用作商户留存抓手
    notes: 方向和时间是分析师判断，依据来源自身对驱动 / 阻力的表述（Mordor Intelligence）及监管指南（trade.gov、Bremer）；除非特别说明，这些并非 Salla 维度披露。
