            body: >-
              Monsha'at 的 SAR 800 million SME 数字化计划、Vision 2030 的 35% SME-GDP 目标，以及 Mada 网络在 2024 年处理的 $52.6 billion
              电商交易量（同比 +25.8%），共同指向沙特 SaaS 赋能线上零售的政策支持型、多年顺风，并不依赖任何单一市场规模估算。GASTAT 给出的 15.6% 数字经济 GDP
              份额，也说明这是国家经济优先事项，而非小众垂直市场。
