      - number: '8.2'
        title: 建议、置信度、风险评级与估值立场
        blocks:
          - type: paragraph
            body: >-
              本章节的建议是 research-more：Salla 展示了真实需求和机构资本证明，但公开记录无法支持具体 buy、pass 或 price call， 因为没有来源披露可用于承销的 valuation
              mark、revenue figure 或 margin structure。对该建议本身的 confidence 为 medium： 需求侧证据（named-platform
              status、institutional capital、partner integrations）由多个独立来源交叉佐证； 但与估值相关的证据（任何具体 price、multiple 或 financial
              statement）完全缺席，因此无论定性 thesis 看起来多强，confidence 都被压在 high 以下。 Risk rating 为 high，驱动因素包括未披露
              financials、未解决的规模指标冲突、集中于单一投资人的 board governance，以及从 Risks 章节延续下来的 regulatory/brand-control
              questions——其中任一项都可能让未来 valuation mark 大幅摆动，而今天没有公开证据为这种摆动设边界。 估值立场明确是 unknown，而不是
              attractive、fair、stretched 或 expensive：要贴上这四个标签中的任何一个，都需要披露价格或披露 financial base 作为比较基准， 本语料两者皆无。本章节刻意避免为
              Salla 编造 valuation figure；本章 tables 和 figures 中的每一个 dollar figure，要么是已披露的第三方可比项
              （Shopify、BigCommerce、Wix、Squarespace、Zid、Tabby、Ninja、Hala），要么是明确标注的 illustrative sensitivity band， 从不是声称的
              Salla 特定估值。
