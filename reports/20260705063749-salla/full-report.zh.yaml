  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 确认规模主张夸大
        - 独立审计或披露显示商户 / 店铺数量明显低于当前宣称的 68k-100k+ 区间
        - 直接削弱「主导规模」这一核心论点支柱。
        - 下调建议；任何重新接触前，先要求调和后的指标。
      - - 确认监管执法行动
        - 任何公开确认且点名 Salla 的 PDPL、Cybersecurity Law 或 E-Commerce Law 罚款 / 制裁
        - 把证据缺口转化为已发生的合规成本和声誉风险。
        - 将其作为近期投资否决标准；只有披露整改后才重新评估。
      - - 董事会层面治理摩擦
        - 出现涉及 Investcorp 董事席位的争议、强制退出或治理失灵证据
        - 显示唯一披露的治理防线没有发挥作用。
        - 暂停接触，等待董事会构成和投资人一致性明确。
      - - 公开电商 SaaS 倍数继续压缩
        - Wix、Shopify 和 BigCommerce 的 EV/Revenue 在已观察水平之外继续持续下行
        - 无论公司执行如何，都会机械压低 Salla 未来上市估值。
        - 下调未来估值预期区间，并重新评估退出时点。
      - - com.faya.sala 品牌争议升级
        - 与 com.faya.sala 上架项有关的商标行动、监管通知，或确认未经授权使用
        - 把当前未解决的品牌问题升级为已发生的声誉或法律风险。
        - 继续推进前要求公司直接披露；沉默视为负面信号。
      - - 估值或财务披露发布
        - Salla 或投资人披露 2024 轮估值，或任何经审计财务报表
        - 移除本章核心限制，并支持给出对价格敏感的具体建议。
        - 基于新披露重跑本章分析；只有条款和财务支持时才上调建议。
    notes: 触发项写成可监测、可证伪的事件，而不是泛泛的风险陈述。
    claimRefs:
      - CV039
      - CV040
      - CV041
      - CV042
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 2024 轮估值和条款
        - 2024 年 3 月 $130M 轮的投后估值、每股价格和清算优先权结构
        - 没有这些信息，就无法给出对价格敏感的建议。
        - 直接向 Salla、Investcorp、Sanabil 或 STV 索取。
      - - 经审计或管理层审阅的财务
        - 收入、毛利率、现金状况和现金消耗率
        - 这是定性可比基准之外任何估值方法的核心输入。
        - 在未来融资或上市流程中直接向 Salla 索取。
      - - 经调和的规模指标
        - 单一商户 / 店铺数量，附明确口径（活跃店铺、注册账号或累计商户）和计量日期
        - 解决贯穿本章、削弱所有增长和市场份额主张的 3-5x 规模指标冲突。
        - 直接向 Salla 索取，或独立委托技术图谱重新计数。
      - - PDPL / Cybersecurity Law 合规状态
        - 注册状态、认证或 SDAIA 往来的确认
        - 判断当前未定价的重大监管风险是否存在。
        - 直接向 Salla 索取；对照 SDAIA 的 National Data Governance Platform 交叉核验。
      - - com.faya.sala 品牌控制立场
        - Salla 就其与 com.faya.sala Google Play 上架项关系（如有）的官方说明
        - 未解决的品牌 / IP 问题是声誉和渠道控制风险，公开上市前必须处理。
        - 直接向 Salla 索取；如未经授权，升级至 Google Play。
      - - Tadawul 上市时间表
        - 任何确认的上市意向、承销商聘用或 CMA 申报
        - 确认或否定「Pre-IPO Growth Fund」命名是否指向实际的近期上市信号。
        - 直接监测 CMA 和 Tadawul IPO 管道披露。
    notes: 这六项要求是推动本章建议脱离「继续研究」的直接前提。
    claimRefs:
      - CV043
      - CV044
