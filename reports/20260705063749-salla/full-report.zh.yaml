      - number: '6.2'
        title: 采用轨迹：所有公开规模指标互相打架，两个新来源进一步拉大区间
        blocks:
          - type: paragraph
            body: >-
              本章节自己的来源发现复现并扩大了 Company Overview 章节标出的规模指标冲突，而不是解决它。独立技术图谱追踪器 StoreLeads 在其 2026 年报告中统计了 22,342 个在线 Salla
              店铺；e-commerce analytics vendor AfterShip 同样标注 2026 年的区域统计页面统计 19,640 个 Salla 驱动店铺，占其跟踪的沙特店铺的
              44.11%；声誉较低的统计博客 Middle East Commerce 则声称同期有 “超过 70,000 家活跃店铺”、超过 100 million 笔已处理订单，以及 60%+
              市场份额，但没有披露方法论； Salla 自己的双语 partner portal 和 2026 年 Tap Payments 赞助专题又分别引用“超过 68,000”家店铺。商户数和 GMV 侧， 2024 年
              3 月融资报道（Wamda 及同业）称有 80,000+ 活跃商户、2020 年以来促成销售额达 $7 billion； 而领投方 Investcorp 自己的组合公司页面写的是 100,000+ 商户、2020
              年以来 $10 billion——同一机构来源在不同页面给出大得多的数字。 Salla CEO 在 Entrepreneur Middle East 的另一处引述中称有“超过 55,000 个个人和企业”，以及
              lifetime SAR 21 billion 的商户销售额；该口径不同（lifetime SAR sales，而不是带日期的 USD GMV），没有共同方法论就无法与其他数字对齐。本章节不在这些数字中选赢家；
              它把区间本身——如今又被 Company Overview 章节原始集合之外的两个独立分析来源确认——视为最重要的采用轨迹发现。
