        blocks:
          - type: paragraph
            body: >-
              Salla 直接且可独立验证的具名客户案例很少；对具体大品牌名称（二级评论有时会把大型香水和零售连锁与 Salla 联系起来） 做一般 web search，并未独立确认这些品牌是 Salla
              商户，因此本章节排除未经核验的品牌主张，而不是复述。能独立检查的是一组更小的逐一具名账号。 Salla 自有 partners homepage 给出了具体生态伙伴证言，并带有量化结果：Radar Agency
              创始人称，在“来自 Salla 平台的支持和赋能”下， 该 agency 帮助其客户商户实现超过 SAR 25 million 的销售额和 50 million+ impressions；ReturnPlus 和
              Cartat apps 的具名代表称， 通过 Salla 的 App Store 触达了“广泛的商户群体”——这些是自发布证言，因此视为公司确认，而不是独立证明。 独立层面，salla.sa domain 的
              Trustpilot review thread 点名一个具体商户 “alnasser sports”，评论描述了“糟糕服务”，但最终通过 Salla 的 complaint process 解决； 这独立佐证了
              Salla 官方投诉系统（Salla 自有 help-center pages 有文档）至少在一个具体案例中能运转。另有两位 Salla 商户管理 App 的 Google Play 具名评论者 ——Hend
              AlKadhi 和 Hassan Almadlouh——描述了具体且带日期的生产使用问题（缺少订单验证码、更新后无法登录）；即便两人都未披露店铺规模或品类， 这些仍是有用的具名、带日期、生产环境（非
