        - 泄露或公开的财务报表，或达到 IPO 招股书级别的文件。
      - - 反方：规模指标有争议
        - 公开口径从 22,342 家活跃店铺（StoreLeads）到 100,000+ 商户（Investcorp）不等，差距约 3-5x。
        - 一个调和后的单一指标，附定义和计量日期。
      - - 反方：董事会治理集中
        - 三家机构投资者中，仅披露 Investcorp 的 Robin Mansour 担任董事会成员。
        - 披露更完整的董事会构成或治理章程。
    notes: 每条反方论点都直接对应最终尽调问题表中的一项要求。
