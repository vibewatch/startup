  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 本建议的核心，是强需求与资本证明能否抵住完全未披露的估值和财务底座；规模指标冲突是关键摆动因素。
    data:
      nodes:
        - id: demand
          label: 具名平台需求证明
          detail: Salla 反复被称为沙特头部电商平台；披露了大型合作伙伴集成。
          tone: positive
        - id: capital
          label: 机构资本
          detail: 2024 年 3 月 Investcorp 领投 $130M，Sanabil 和 STV 跟投；定位为 IPO 前增长资本。
          tone: positive
        - id: scale
          label: 规模指标冲突
          detail: 门店 / 商户数量因来源和定义不同，在 22,342 至 100,000+ 之间波动。
          tone: warning
        - id: disclosure
          label: 无估值或财务披露
          detail: 没有来源披露收入、利润率、现金状况或 2024 年轮次估值。
          tone: warning
        - id: risks
          label: 未决监管 / 品牌问题
          detail: 从风险章节延续而来：PDPL 状态和 com.faya.sala 品牌控制均未解决。
          tone: warning
        - id: decision
          label: 继续研究
          detail: 沿看似通往 Tadawul 的路径跟踪；任何价格敏感承诺前，都要求披露。
          tone: neutral
      edges:
        - from: demand
          to: decision
        - from: capital
          to: decision
        - from: scale
          to: decision
        - from: disclosure
          to: decision
        - from: risks
          to: decision
    approximationNotes: null
    claimRefs:
      - CV001
      - CV004
      - CV009
      - CV010
      - CV019
      - CV039
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: Salla 未披露收入，因此这张条形图只展示：仅因选用不同披露 GMV 区间和抽佣率假设，EV 标记需要落在多大差异的水平。它是敏感性示意，不是估值估计。
    data:
      items:
        - label: 按 $7B GMV、2% 抽佣率推算收入
          value: 140
          detail: 单位为 USD millions；用保守市场抽佣率套用低端 GMV 的示意。
          tone: neutral
        - label: 按 $7B GMV、4% 抽佣率推算收入
          value: 280
          detail: 单位为 USD millions；用较高抽佣率假设套用低端 GMV 的示意。
          tone: neutral
        - label: 按 $10B GMV、2% 抽佣率推算收入
          value: 200
          detail: 单位为 USD millions；用保守抽佣率套用高端 GMV 的示意。
          tone: neutral
        - label: 按 $10B GMV、4% 抽佣率推算收入
          value: 400
          detail: 单位为 USD millions；用较高抽佣率套用高端 GMV 的示意。
          tone: neutral
        - label: Wix EV/Revenue（最近季度）
          value: 0.79
          detail: 倍数，不是 USD millions；用于在抽佣率驱动的倍数语境中提供尺度参照。
          tone: warning
        - label: 电商 SaaS 中位 EV/Revenue（Multiples.vc）
          value: 1.7
          detail: 倍数，不是 USD millions；2026 年 6 月电商软件垂直领域公开可比公司的中位数。
          tone: neutral
    approximationNotes: >-
      GMV 到收入的桥接采用示意性的 2%-4% 抽佣率假设，套用 Salla 自行披露的 $7B-$10B
      累计促成销售额区间；这些只是粗略敏感性示意，不是公司披露或分析师估算的收入数字；两个倍数数据点放在同一轴上，纯粹用于说明尺度。
    claimRefs:
      - CV019
      - CV029
      - CV030
      - CV034
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 由于 Salla 未披露估值，本区间展示的是相对已披露区域可比公司和公开可比公司的定性悲观 / 基准 / 乐观定位，而不是以美元计价的 Salla 估值。
    data:
      items:
        - label: 悲观情景
          low: 0.8
          mid: 1.2
          high: 1.7
          displayValue: Below public e-commerce-SaaS median multiple (~0.8x-1.7x EV/Revenue)
          detail: 倍数压缩、规模夸大被证实，或监管 / 品牌事件落地，都会推迟或缩小任何退出。
          tone: negative
        - label: 基准情景
          low: 1.7
          mid: 2.2
          high: 2.8
          displayValue: Near public e-commerce-SaaS median multiple (~1.7x-2.8x EV/Revenue, per Multiples.vc and Wix)
          detail: 保守规模数据站得住，上市定价接近当前公开电商 SaaS 可比公司水平。
          tone: warning
        - label: 乐观情景
          low: 2.8
          mid: 4.5
          high: 6.6
          displayValue: >-
            Approaching premium SaaS / take-private multiples (~2.8x-6.6x EV/Revenue, per Squarespace's take-private and
            premium-vertical comps)
          detail: 高端规模主张站得住，Tadawul 上市以溢价倍数定价，性质类似 Tabby 的区域轨迹。
          tone: positive
    approximationNotes: >-
      这些低 / 中 / 高数值是从已披露公开电商 SaaS 可比公司（Wix、Multiples.vc 行业中位数，以及 Squarespace 私有化倍数）提取的示意性 EV/Revenue 倍数区间，不是以美元计价的 Salla
      估值或公司特定估计；没有来源披露 Salla 专属倍数或估值。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
      - CV033
      - CV036
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Salla 在市场和需求证明上得分较高，但由于几乎没有披露财务信息，经济可见度和估值支撑得分较低。
    data:
      items:
        - label: 市场需求
          score: 8
          detail: Salla 被称为沙特头部电商平台，处在庞大且增长中的数字经济里。
          tone: positive
        - label: 资本 / 投资者证明
          score: 7
          detail: Investcorp、Sanabil 和 STV 提供机构资本，并明确带有 IPO 前定位。
          tone: positive
        - label: 护城河 / 平台深度
          score: 6
          detail: 已披露的支付、BNPL、税务和应用市场集成显示平台宽度真实存在。
          tone: neutral
        - label: 经济性可见度
          score: 2
          detail: 本语料任何地方都未披露收入、利润率或现金流数据。
          tone: negative
        - label: 规模指标可靠性
          score: 3
          detail: 公开门店 / 商户数因来源不同相差约 3-5 倍。
          tone: negative
        - label: 治理 / 执行风险
          score: 4
          detail: 唯一披露的董事席位，以及风险章节中的未决监管 / 品牌问题。
          tone: warning
        - label: 估值支撑
          score: 2
          detail: 没有披露价格或财务底座，支撑不了任何具体估值主张。
          tone: negative
        - label: 证据质量
          score: 5
          detail: 方向性和可比公司层面的证据扎实，但远未达到申报级披露。
          tone: neutral
    approximationNotes: 评分是本章对上述证据的定性综合（1-10 分制），不是第三方或公司提供的评级。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
