  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              Salla 的投资论点建立在本报告反复确认的 5 个承重事实上：它反复被列名（包括 U.S. International Trade Administration）为 Saudi e-commerce
              platforms 中少数主导平台之一；它所处的 Saudi e-commerce market 按 GASTAT 和 Statista 估算已有数百亿美元规模且仍在增长；它从 Investcorp、
              Sanabil Investment（a Public Investment Fund company）和 STV 获得机构资本，且 Investcorp 2024 年 3 月 $130 million
              轮明确通过 “Pre-IPO Growth Fund” 组织；它披露了 payments（Tap）、BNPL（Tamara、Tabby）、tax e-invoicing（ZATCA）和大型 third-party
              app marketplace 集成， 显示平台深度不止于一个裸店铺工具；它还处在 Saudi venture ecosystem 中，e-commerce 在 2025 年 H1 是融资最高行业（$306
              million， 按 MAGNiTT 同比增长 78%），可比公司（Tabby、Ninja、Hala）已完成 mega-rounds，且 Tabby 达到披露的 $3.3 billion pre-IPO
              valuation。 反向论点同样承重：所审阅来源没有披露 Salla 自己的 post-money valuation、annual revenue、gross margin 或 cash
              runway；公司自己的头部规模指标 确实存在争议（视来源而定为 68,000 至 100,000+ stores 或 merchants，而独立 technographic tracker 的
              live-store count 是 22,342）； 三家机构投资人中仅披露一个 board seat（Investcorp），治理影响力集中；本报告 Risks 章节发现的未决
              regulatory-disclosure、credential-exposure 和 brand-control
              问题，在公开上市时会被迫摊开，但今天仍未受检验。每个反向论点都映射到本章节最后一节的具体、可证伪尽调要求， 而不是泛泛 caution。
            claimRefs:
