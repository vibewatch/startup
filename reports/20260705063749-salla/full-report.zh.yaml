  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局——直接对手、既有巨头、相邻玩家与现状替代
        blocks:
          - type: paragraph
            body: >-
              Salla 的竞争集合横跨五类。最常被与 Salla 并列点名的直接对手是 Zid，同为沙特本土电商 SaaS 平台；Arab News 2024 年「Startups of the Year」专题把 Zid 和
              Salla 放在一起，称为王国电商 SaaS 浪潮的共同领跑者。但除这篇联合报道外，本报告审阅的语料库没有任何独立披露 Zid 的单独收入、融资总额或商户数。全球既有 SaaS
              和自托管电商平台——Shopify、BigCommerce、WooCommerce（基于 WordPress）和 Salesforce Commerce Cloud——均发布了沙特商户在评估 Salla
              替代方案时可以触达的自助定价或联系销售型产品页面，因而构成具备全球品牌认知的既有替代品，而 Salla 尚未拥有这种认知。相邻和替代渠道包括市场平台优先销售：中东市场平台 noon 于 2025 年 12 月
              12 日披露一轮由主权资本支持的 $500 million 融资；Amazon.sa 提供类似的佣金制上架路径。两者都让商户无需运营自有店铺就能触达买家，代价是用直接客户数据所有权换取需求聚合和物流支持。任何
              SaaS 平台仍需替代的现状方案，还包括继续线下 POS 零售，以及通过 Instagram 或 WhatsApp 做无专门结账的非托管社交电商销售。另一个替代项是内部自建：Salla 已发布的 Merchant
              API、OAuth 2.0 和 SDK
              文档，实际展示了技术能力足够的商户或系统集成商要自建店铺、而不是订阅任何供应商时需要复制的能力。潜在未来进入者包括继续加大阿语和海湾支付本地化投入的全球平台，以及嵌入金融科技的电商工具——Tap Payments
              自己关于 Salla 集成的博客就是例子——这些工具越来越把支付轨道直接和店铺功能打包，模糊支付伙伴与平台竞争者之间的边界。
