      - number: '8.3'
        title: 融资背景、入场纪律与稀释 / 优先权悬顶压力
        blocks:
          - type: paragraph
            body: >-
              唯一披露的融资事件是 2024 年 3 月一轮：Investcorp 通过其 Saudi Pre-IPO Growth Fund 领投 $130 million， Sanabil Investment 和既有股东
              STV 参投，Investcorp 的 Robin Mansour 加入 Salla board；但任何审阅来源都没有披露该轮 post-money valuation、 share
              price、清算优先权条款，或 primary 与 secondary 的总拆分。更早融资历史很薄，且部分冲突：一个来源（MENAbytes）记录了 $8.5 million Series A，另一个
              analytics aggregator（GetLatka）称 Salla “bootstrapped with no outside investment”， 与已经充分佐证的 $130 million
              轮直接冲突；本章节将其标记为该 aggregator 的数据质量问题，而不是证明 Salla 在 2024 年前确实没有融资。 因为没有公开 share price、cap table 或 preference
              stack，今天任何 prospective investor 的 entry discipline 都无法写成具体 price test； 唯一可用的纪律是程序性要求：在投入新资本前，要求披露 2024
              年轮次的 valuation 和 preference terms、当前 cap table，以及 audited 或 management-reviewed financials； 同时把 “Pre-IPO
              Growth Fund” 命名视为 listing intent 的方向性信号，而不是已承诺 timetable。按 AGBI 报道，Saudi Arabia 的 Tadawul exchange 在 2026
              年 IPO pipeline 中约有 40 companies；按 Vision2030.ai 的 venture-funding analysis，可比 Saudi fintech/e-commerce
              peers Tabby 和 Tamara 截至 2025 年都在推进 Tadawul listings，这是本章节能找到的、最接近 Salla 自身最终退出路径的公开证据。
