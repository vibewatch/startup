      - number: '8.6'
        title: 退出就绪度、论点失效触发因素与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              退出准备度信号仍偏方向性，尚未得到确认：2024 年 3 月这轮融资被包装成「Pre-IPO Growth Fund」，沙特 2026 年 Tadawul IPO 管线活跃（AGBI 称约 40
              家公司），同类沙特金融科技 / 电商公司（Tabby、Tamara）也在积极推进 Tadawul 上市，均指向 Salla 最终有进入公开市场的意图。但没有任何来源披露 Salla
              自身的具体时间表、承销商或上市地点。本章的论点失效与否决触发项包括：任何独立确认显示较高口径的规模说法（10 万以上商户、促成 $10B 销售）相较审计数据被大幅夸大；任何已确认的监管执法、罚款或以 Salla
              为名的未决诉讼；任何证据显示已披露的 Investcorp 董事席位集中安排反映未解决的治理摩擦；以及公开电商 SaaS 倍数继续压缩（如 Wix 同比下滑所示），无论 Salla
              自身执行如何，都会机械压低其未来上市估值。最终尽调问题按优先级排序为：（1）2024 年融资的投后估值和优先权条款；（2）经审计或管理层复核的收入、毛利率和现金流报表；（3）一套口径统一、标注定义与测量日期的商户
              / 店铺数量；（4）确认 PDPL 和 Cybersecurity Law 合规状态；（5）公司直接回应 com.faya.sala 品牌控制问题。在这些问题得到回答前，本章立场是跟踪 Salla
              走向其看似明确的 Tadawul 路径，而不是现在为其定价。
            claimRefs:
              - CV039
              - CV040
              - CV041
              - CV042
              - CV043
