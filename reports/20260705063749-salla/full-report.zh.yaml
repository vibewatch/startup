      - number: '4.3'
        title: 成本结构、合规负担与资本充足性：一轮已披露融资，没有现金或烧钱数据
        blocks:
          - type: paragraph
            body: >-
              本章没有任何来源披露 Salla 的销货成本、托管支出、支付处理成本或毛利率。健康利润率应是什么样，最清晰的外部锚点完全来自 Salla 之外：Aleph 的 2026 年 SaaS 基准报告基于 342 家
              SaaS 和 AI 原生公司 2025 全年数据，给出 2025 年软件毛利率中位数 80%（与服务收入混合后为 76%），上四分位为 86%，尚未优化交付成本公司的下四分位为 50%。这是有用的预期锚，但不是
              Salla 专属数据。一个具体且 Salla 专属的成本驱动来自监管：沙特 Zakat, Tax and Customs Authority（ZATCA）自 2021 年 12 月 4
              日起强制要求电子发票（Phase 1，generation），并从 2023 年 1 月 1 日起按纳税人批次推出 Phase 2 集成要求；这迫使任何沙特电商 SaaS 平台，包括
              Salla，都要构建并维护合规的发票生成和税务机关集成。该合规成本在结构上必然存在，尽管没有来源对 Salla 具体量化，也没有本报告审阅的来源明确声明 Salla 自身平台符合 ZATCA。


              Salla 唯一披露的资本事件，是 2024 年 3 月 4 日宣布的 $130 million Pre-IPO 轮，由 Investcorp 通过 Investcorp Saudi Pre-IPO Growth
              Fund LP 领投，Sanabil Investment（沙特 Public Investment Fund 全资公司）和现有股东 STV 参投。Code & Co. 为 Investcorp
              在该投资前准备的尽调案例研究确认，该基金的明确使命是「equity growth capital investments...with the potential to access the capital
              markets」；本章把这句话解读为最终公开上市是 Salla 预期中的下一次资本市场事件，而不是确认已有计划的 IPO 日期、时间表或估值。本报告审阅的来源没有披露 Salla
              当前现金余额、月度烧钱、跑道、$130 million 轮融资的具体资金用途，或公司持有的任何债务、风险债或项目融资工具。在宏观层面，Saudi Arabia 的 Kafalah SME Loan
              Guarantee Program——由 Ministry of Finance 和 Saudi Industrial Development Fund 共同运营的政府支持融资担保工具——说明面向可能在
              Salla 上销售的小商户，存在更广泛的公共融资安全网；但本语料库没有记录 Salla 自身，或其商户群体，已被确认是 Kafalah 受益方。
