      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              结构性驱动仍指向持续增长。沙特在 2026 年进入 99% 互联网渗透率和 78% 5G 覆盖（Mordor Intelligence）的状态；DataReportal 在 2024 年初统计有 36.84
              million 互联网用户。到 2025 年初，DataReportal 又在更小的 34.3 million 总人口基数上报告 33.9 million
              互联网用户；两版都没有解释下滑，所以本章标记这次数据修订，而不是调和。Mada 推动现金向卡支付迁移（2024 年处理 $52.6 billion，同比 +25.8%）以及 Monsha'at 的 SAR 800
              million SME 数字化计划，是近期需求加速器；Vision 2030 要把 SME 对 GDP 的贡献提升到 35%，进一步强化了政策顺风。约束也同样具体。Trade.gov
              的市场挑战指南描述了外资企业面临的监管环境不可预测、15% VAT、非 GCC 实体 20% 企业所得税，以及 ZATCA 转让定价执法收紧。沙特 General Authority for
              Competition 仅 2024 年就发起 459 项调查，并专门审查纵向安排、排他性和维持转售价格条款——对商户条款通常打包支付和物流的 SaaS 赋能平台来说，这是现实风险。Mordor
              Intelligence 还量化了都会走廊以外高昂的最后一公里配送成本，以及 PDPL/NCA 数据主权合规开销对采用的拖累；对缺少 Salla 现有沙特本地合规姿态的小型或海外进入者尤其如此。
