  - id: TV004
    title: 可比估值表
    columns:
      - 可比对象
      - 指标
      - 倍数 / 估值 / 状态
      - 参考意义
      - 局限
    rows:
      - - Shopify
        - EV / Revenue（据 SEC 10-K 和市场数据）
        - 公开电商 SaaS 平台龙头；倍数随市场环境变化
        - 全球最接近的产品模式类比（店面 + 应用生态 + 支付）。
        - 规模大得多，覆盖多地区，并有经审计公开披露；Salla 不具备这些条件。
      - - BigCommerce
        - EV / Revenue（据 SEC 10-K 和市场数据）
        - 较小型公开电商 SaaS 同业
        - 作为中型电商 SaaS 赋能平台，规模类比比 Shopify 更接近。
        - 披露和客户基础偏美国；不是海湾市场可比对象。
      - - Wix
        - EV / Revenue（Yahoo Finance 关键统计）
        - ~0.79x（最近季度），低于前一年的 ~2.84x-5.09x
        - 显示当前公开电商 SaaS 相邻资产的倍数压缩风险。
        - 以建站工具为主，变现结构不同于 Salla。
      - - Squarespace（Permira 私有化，2024）
        - 交易公告时 EV / Revenue
        - 6.6x（$6.99B 全现金交易）
        - 本组可比中最高倍数结果；显示 PE 对规模化 SaaS 仍有收购胃口。
        - 一次性 M&A 交易，不是稳态公开市场倍数；业务组合不同。
      - - Zid
        - 已披露私募融资总额
        - $59M，分三轮（2022 年 $50M Series B 轮、2021 年 $7M Series A 轮、2019 年 $2M 种子轮）；最近一轮披露时约 7,500 家店铺
        - 披露轮次规模的沙特本土具名竞争者中最接近。
        - 融资规模和规模主张都明显小于 Salla；未披露投后估值。
      - - Tabby
        - 已披露 pre-IPO 私募估值
        - $3.3B（2025 年 Series E pre-IPO 轮），高于 2023 年底的 $1.5B
        - 显示沙特 / 海湾金融科技相邻同业在 Tadawul 上市前达到数十亿美元公开估值。
        - 金融科技（BNPL）商业模式，不是电商 SaaS 赋能；经济性不可直接类比。
      - - Ninja
        - 已披露 pre-IPO 轮规模
        - $250M pre-IPO 轮（2025）
        - 显示海湾商业相邻平台仍能吸引大额支票。
        - 即时零售物流模式，与 Salla 的 SaaS 赋能模式结构不同。
      - - Hala
        - 已披露 Series B 轮规模
        - $157M Series B 轮（Sanabil 与 TPG 共同领投）
        - 显示 Salla 共同投资方 Sanabil 也参与了规模相近的区域大轮融资。
        - B2B 金融科技 / 开票业务，不是电商 SaaS；本语料未披露估值。
    notes: 本可比组刻意混合公开市场倍数、M&A 私有化倍数和已披露私募轮规模，因为没有单一同业能完全匹配 Salla 的沙特单一市场、电商 SaaS 赋能、pre-IPO 画像。
    enumerationScope:
      coverage: exhaustive
      basis: >-
        All disclosed, independently verifiable public-company and Gulf private-round comparables identified in this
        chapter's research for e-commerce-SaaS and closely adjacent Saudi commerce/fintech peers.
