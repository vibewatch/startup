  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 较高口径规模主张（100k+ 商户、2020 年以来促成 $10B 销售）成立；抽佣率接近盈利型全球同业；Tadawul 上市沿着 Tabby 路径推进。
        - 数十亿美元上市估值，性质上接近 Tabby 披露的 $3.3B pre-IPO 估值。
        - 需要规模主张和利润率假设同时成立，但本语料无法验证。
        - 低至中：与沙特数字经济增长数据一致，但公司层面未经验证。
      - - 基准
        - 较低 / 保守规模数据（Tap 报告的 68k 家店铺，或 StoreLeads 的 22,342 家活跃店铺）更接近现实；经济性接近公开电商 SaaS 中位数（约 1.7x-2.8x EV/Revenue）。
        - 上市估值较 Tabby 更保守，反映披露更薄、足迹更窄且只在沙特。
        - 仍取决于未披露的抽佣率和成本结构。
        - 中高：与本语料中最能独立验证的规模和倍数数据一致。
      - - 悲观
        - 规模指标冲突反映真实夸大；风险章节中的合规缺口转化为实际整改成本或声誉损害；公开电商 SaaS 倍数继续压缩（如 Wix 所示）。
        - 退出推迟或规模缩水；任何上市定价接近电商 SaaS 倍数区间低端（约 0.8x-1.7x EV/Revenue）。
        - 监管、品牌控制和倍数压缩风险叠加。
        - 低至中：有记录的倍数压缩使其具备合理性，但尚无来源确认 Salla 特定的反向触发项。
    notes: Salla 自身的估值 / 回报数字只是情景逻辑示例，不是已披露或估算的公司美元金额。
    claimRefs:
      - CV023
      - CV024
      - CV025
      - CV026
