    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险概览
        blocks:
          - type: paragraph
            body: >-
              本章节按严重度和缓释成熟度为 Salla 已披露和推断的风险排序，而不只是按主题排序。严重度最高、缓释最不成熟的两类风险， 是监管 / 合规不透明（Personal Data Protection
              Law、Cybersecurity Law 和 NCA cloud-security controls 都适用， 但没有来源披露合规认证或注册状态），以及围绕第二个使用 Salla 名称的 Google Play
              条目的未决品牌 / IP 控制问题。 凭证暴露风险已经被观察到，并非假设：一家独立 breach-monitoring vendor 记录数万条与 salla.sa 相关的 credentials 在
              infostealer-malware dumps 中流转， 分为客户、员工和第三方类别；但这反映的是设备侧 malware，而不是已确认的 Salla 自有系统 breach。伙伴集中度中等： Salla
              在支付（Tap）、buy-now-pay-later（Tamara、Tabby）和主导资本（Investcorp）上依赖具名对手方，
              但考虑到多条并行通道，并无一方看起来是关键功能的单点故障。关键人和治理风险较高，因为本语料所有来源中反复出现的只有两名具名高管 （CEO Nawaf Hariri、COO Salman
              Butt）和一名具名非创始人董事（Investcorp 的 Robin Mansour），没有披露接班计划或更广的管理层梯队。 没有来源披露点名 Salla 的 active lawsuit、regulatory
              sanction 或 enforcement action；本章节将这种缺失视为需要直接尽调的证据缺口， 而不是清白记录的确认。贯穿本章的投资含义是，Salla 的 pre-IPO 阶段会提高未来 public
              listing 对披露深度的要求，相比今天的公开记录门槛更高。
