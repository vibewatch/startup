        - id: tamara
          label: Tamara
          detail: 具名 BNPL 伙伴（10,000+ 商户）。
          tone: neutral
        - id: tabby
          label: Tabby
          detail: 第二个具名 BNPL 结账选项。
          tone: neutral
        - id: investcorp
          label: Investcorp
          detail: 领投方；唯一披露的董事席位。
          tone: warning
        - id: sanabil
          label: Sanabil Investment
          detail: 2024 年 3 月轮次共同投资者。
          tone: neutral
        - id: stv
