      - number: '5.4'
        title: 信任、安全与合规：宣称的控制强，但未找到独立认证
        blocks:
          - type: paragraph
            body: >-
              Salla 自有营销内容声称其信任与安全栈具备实质内容：AI 欺诈检测、3D Secure 卡验证、“完全 PCI DSS 合规”， 与 Saudi Arabia's Zakat, Tax and Customs
              Authority（ZATCA）的电子发票直接集成，以及 dashboard、storefront 和 apps 全面支持阿拉伯语。
              上述主张真实且具体，比泛泛的“安全可靠”营销语更有信息量；但本语料中，每一项都来自公司陈述，而非独立认证： 未发现 PCI Security Standards Council 合规
              attestation、SOC 2 report、ISO 27001 certificate，也未发现第三方审计 Salla 的 ZATCA e-invoicing conformance。这与本报告
              Financials 章节已经识别的 ZATCA-compliance-status 缺口一致。 独立的第三方证据比 Salla 自身营销更复杂。一篇详细的第三方商户侧评测（ZatcaHub，2026）一手佐证了
              Salla 的几项优势—— 一天内上线店铺、5 分钟设置 Mada/Tabby、阿拉伯语 UI 干净且非技术人员友好——但也记录了具体限制：免费 / 基础层分析 在不升级时缺少按品类销售拆分，同一评测称插件 /
              App 生态“比 Shopify 小得多”， 非 GCC 市场的国际配送 / 多国税务配置需要大量手工工作。同一评测引用了一条未经核验的 Trustpilot 投诉，称 Salla 没有有效调解买家—商户纠纷，
              并明确将 Salla 定位为“店铺构建器，不是 marketplace”，不会像 Amazon 或 Noon 那样介入纠纷——这是买家保护上的结构性差异， 而非偶发问题。Salla 官方商户管理
              App（com.emoney.sallacp）在 Google Play 的 5,800 条评论中得分 3.3/5，安装量 500,000+；
              这是可量化、由独立平台聚合的满意度信号，低于一流商户工具通常应有的水平，尽管 Google Play 在抓取 listing 中未披露评论情绪拆分。
