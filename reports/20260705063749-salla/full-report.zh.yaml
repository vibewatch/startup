              detail: 存在投诉流程，但未披露总体解决率。
        - label: 伙伴 / 资本集中
          values:
            - label: 中
              tone: warning
              detail: 在三名具名投资者中，Investcorp 持有唯一披露的董事席位。
            - label: 中
              tone: warning
              detail: IPO 前，治理争议或退出压力都将具有重大影响。
            - label: 中
              tone: warning
              detail: Sanabil 和 STV 作为共同投资者，部分抵消单一投资者集中。
        - label: 关键人 / 领导层厚度
          values:
            - label: 中
              tone: warning
              detail: 本报告所有来源中反复出现的具名高管只有两位。
            - label: 高
              tone: negative
              detail: 未披露继任计划或更宽的管理层梯队。
            - label: 中
              tone: warning
