      - number: '7.5'
        title: 缓释措施、监控指标与止损标准
        blocks:
          - type: paragraph
            body: >-
              本语料中披露最强的缓释措施在治理侧：Investcorp 的机构 board seat，以及其通过 Code & Co. 做的投资前技术 / 产品尽调， 是防范 execution 和 key-person
              risk 的证据最充分的制衡；Salla 同时使用两个独立 BNPL partners（Tamara 和 Tabby），再加上 mada 和 Apple Pay， 相比依赖单一 processor 的
              checkout，降低了单点故障风险。已有文档且能运转的买家投诉升级流程， 对消费者保护和纠纷调解风险是部分缓释，尽管公开来源无法衡量其整体有效性；本报告任何地方都没有发现已披露的 compliance
              certification （PDPL registration、NCA cybersecurity-controls attestation、PCI DSS audit 或 ISO
              27001），因此除公司主张外，合规风险缓释无法独立验证。 本章节把最重要的开放问题转为可监控触发器：任何点名 Salla 的已发布 SDAIA 或 NCA enforcement decision；与
              salla.sa domain 相关的 infostealer-log credential counts 出现重大环比增长；任一具名 co-founder 离任且未披露 successor；以及
              com.faya.sala brand-control 问题升级或解决。 一个可监控的正面指标，是 Salla 在自有 investor-relations 和 press materials
              中持续发布一个经调和、审计的 merchant 或 store-count figure； 这将降低 Company Overview、Customers
              和本章节反复标出的规模指标不确定性。上述每个触发器都在本章节 tables 中配有具体 diligence path， 而不是停留在未解决的叙事点。
