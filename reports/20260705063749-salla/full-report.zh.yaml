      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景假设 Salla 高端 scale claims（按 Investcorp 自己 portfolio page，100,000+ merchants、2020 年以来 $10 billion
              enabled sales） 大体准确，take-rate 和 subscription mix 接近全球 e-commerce-SaaS peers 中更赚钱的一端，并且 Tadawul listing 沿着
              Tabby 和 Tamara 的路径走向数十亿美元级别估值标记， 由 GASTAT 数据所显示的 digital economy 占 Saudi GDP 15.6% 以及 e-commerce market
              持续双位数增长支撑。基准情景假设更低、更保守的规模数字 （Tap 的约 68,000 stores，或 StoreLeads 的 22,342 live-store count）更接近当前现实，Salla
              的经济性接近 public e-commerce-SaaS median （按 Multiples.vc 和 Yahoo Finance 对 Wix 的数据，约 1.7x-2.8x
              EV/Revenue），且未来任何 listing 定价都比 Tabby 更谨慎， 因为 Salla 公开披露更薄，监管 / 品牌问题未解决。悲观情景假设规模指标冲突反映较高数字确有夸大，Risks
              章节识别的未披露合规缺口在上市前显化为真实 remediation costs 或声誉损害，且 public e-commerce-SaaS multiples 继续压缩（按 Yahoo Finance，Wix
              自身 EV/Revenue multiple 在截至 2026 年 3 月的一年中从约 2.84x 降到 0.79x）， 从而实质性推迟或缩小任何退出。概率信号偏向基准情景：GASTAT 和 Statista 对
              Saudi digital-economy growth story 的佐证很强， Salla 的 named-platform status 也被独立来源反复确认；但没有来源提供足够 financial
              granularity，因此无法在定性 base-case lean 之外赋予可信 probability weights。
