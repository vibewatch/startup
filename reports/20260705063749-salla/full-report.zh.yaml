      - number: '1.3'
        title: 领导层、治理与相互冲突的规模口径
        blocks:
          - type: paragraph
            body: >-
              与融资体量相比，Salla 的公开领导层披露偏薄。Nawaf Hariri（CEO、联合创始人）和 Salman Butt（COO、联合创始人）是独立来源中反复出现的唯二高管；Investcorp 为 Robin
              Mansour 取得的董事会席位，是本研究发现的唯一具名非创始人治理细节。本语料库没有来源披露完整董事名单、委员会架构或更多 C-suite 人员；对一家完成 $130 million
              机构轮融资的公司来说，这本身就是一个值得注意的披露缺口。规模指标是各来源分歧最大的地方，而且这种分歧看起来更像真实的指标定义冲突，而非简单错误。Tap Payments 的 2026 年伙伴博客引用「超过
              68,000」家网店；Salla 自己的双语伙伴门户（salla.partners）独立显示「+67,000」和「+68,000」活跃店铺计数，同一域名下的开发者页面称 App Store 可触达「超过
              60,000」名商户；DevPortal Awards 2025 对 Salla 开发者门户的提名也使用「超过 60,000」家店铺和「7,000+」名伙伴开发者社区。2024 年 3
              月轮次公告报道（Wamda、AGBI、Decypha、Code & Co.）称，Salla 自 2020 年以来已在「超过 80 千名活跃商户」中促成 $7 billion 电商销售；Investcorp 自己的
              Salla 组合页面则给出更高口径：促成 $10 billion 销售、覆盖「超过 100 千名活跃商户」——同一领投方在不同于融资公告的页面上发布了明显更大的数字。独立技术图谱追踪器 StoreLeads 在
              2026 年报告中仅计数 22,342 个由 Salla 驱动的在线店铺；此前它在 2025 年出现大幅技术识别下滑，2026 年又部分反弹。聚合器 GetLatka 于 2025 年 9
              月更新，给出第四个相互矛盾的数据点：它称 Salla 是「自举……迄今没有外部投资」，并报告 843 名员工。这与上文记录的 STV/Investcorp
              融资历史直接冲突，应视为聚合器数据质量警报，而不是融资状态的佐证。考虑到上述跨度，本章不采用单一标准商户数或 GMV；后续章节引用任何 Salla 规模主张时，都应标明具体来源和时间，而不是给出一个单一数字。
