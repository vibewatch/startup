      - number: '4.2'
        title: GTM 路径与单位经济：生态信号强，但没有队列数据
        blocks:
          - type: paragraph
            body: >-
              Salla 的 GTM 路径混合了商户自助注册和大型第三方伙伴/开发者渠道。伙伴生态首页标称「+67,000」至「+68,000」家活跃店铺和超过 1,000 名认证伙伴；链接到的 Apps 页面则另称有超过
              500 名注册应用开发者，触达超过 60,000 名商户。这些 Salla 来源数字位于第三方和投资人披露的 55,000 至 100,000+ 区间之内。这个伙伴渠道在结构上类似 Shopify
              的应用与伙伴生态，但绝对规模小得多：Shopify 自己的伙伴页面称，仅 2025 年就向伙伴支付 $1.3 billion，约比 Salla 已披露伙伴收入示例所暗示的任何规模高出两个数量级。Salla
              的开发者文档（Merchant REST API、OAuth 2.0、Twilight 主题 SDK、webhooks，以及无服务器「App Functions」层）支撑了这一渠道，让代理机构和自由开发者无需
              Salla 销售团队直接介入，就能构建并变现集成；这可能是低 CAC 增长杠杆，但没有来源量化它对净商户新增的贡献。


              除生态规模外，本报告审阅的来源没有提供 Salla 在商户或伙伴开发者层面的销售周期、CAC、回本期、净收入留存或流失率。本章唯一能构建的量化单位经济锚点，是 App Store 那个单一的收入示例（100
              次订阅 x SAR 59，隐含 SAR 5,900 总额，开发者净得 SAR 4,130）；这只是示意性营销内容，并非经审计或公司明示的混合抽成率，应视为方向性信号，而不是指标。GetLatka 聚合器画像于
              2025 年 9 月最后更新，明确表示没有 Salla 收入信息，并报告截至该日期有 843 名员工——这是本语料库中唯一公开员工数。但由于 GetLatka 还错误称
              Salla「自举……迄今没有外部投资」，直接否定了有充分记录的 STV 和 Investcorp 融资历史，这个员工数本身也应谨慎使用，而不能作为干净的每员工收入分母。
