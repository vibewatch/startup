      - number: '1.2'
        title: 融资历史、投资人与估值信号
        blocks:
          - type: paragraph
            body: >-
              尽管公开资本结构表和估值标记没有披露，Salla 的融资时间线在投资人和媒体来源中基本一致。MAGNiTT 和 MENAbytes 均报道，Salla 完成由 STV 领投、现有种子轮支持方 Vision
              Ventures 和 Raed Ventures 参投的 $8.5 million Series A；MENAbytes 还报道，Vision Ventures 和 Raed Ventures 曾在 2018
              年投过一轮金额未披露的种子轮。STV 自己的投资博客把 Series A 论点表述为押注沙特和更广泛 MENA 地区的「软件赋能电商」；后续一篇 STV 博客「STV Doubles Down on
              Salla」描述了 2024 年之前的追加成长投资，但同样没有披露金额。证据最充分、也最近的一次事件是 2024 年 3 月的 Pre-IPO 轮：Investcorp 通过 Investcorp Saudi
              Pre-IPO Growth Fund LP，联合 Sanabil Investment（Public Investment Fund 全资公司）和现有股东 STV，领投 $130
              million。Wamda、AGBI、Decypha（Mubasher）、AbsoluteGeeks 以及 Investcorp 自己的新闻稿都确认了 $130 million 金额、三家点名投资人，以及
              Investcorp Principal Robin Mansour 加入 Salla 董事会。技术尽调服务商 Code & Co. 另行确认，它在该轮融资前为 Investcorp
              做了技术与产品尽调；尽管尽调结论没有公开，这仍是机构尽调已经发生的有用独立信号。本语料库没有任何来源披露 2024 年 3 月轮次对应的估值、已完成的 IPO 申报或公开资本结构表，因此本章把 Salla
              估值处理为未披露，而不是仅凭交易规模倒推。
