  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客群划分：分层商户订阅者、独立购物者基础，以及生态伙伴层
        blocks:
          - type: paragraph
            body: >-
              Salla 的客户基础可拆成三组，它们以不同方式付费、使用或通过平台交易。主要付费群体是商户：店主订阅四个公开套餐层级之一—— 可用于真实上架和交易的免费 “Salla Basic”、月费大约 SAR 99 至
              SAR 299 起的付费 “Plus” 和 “Pro”，以及面向高交易量商户、 定制价格的 “Salla Special”；这些信息来自 Salla 自己的 Tap Payments 合作伙伴内容和一篇 2026
              年独立平台对比评测。 Salla CEO 在 Entrepreneur Middle East 引述中称，商户基础覆盖“个人、中小品牌和成熟企业”； Salla Academy
              的公开课程目录（面向首次卖家的创业启动、dropshipping、数字产品和社交媒体营销课程） 也显示，公司有意聚焦个人和家庭创业者，而 Saudi commentary 反复把这一群体与女性主导企业联系起来。
              第二个不付费但关键的群体是购物者：终端消费者在 Salla 托管店铺前台上使用 mada、Apple Pay 或 Tabby/Tamara 先买后付购物， 支持 15+ 种货币，并按前文来源可发货到 79+
              个国家。第三组介于两者之间：生态伙伴——应用开发者和营销 / 物流机构， 基于 Salla API 构建产品，并在 Salla 自有 partners homepage
              上被引用为合作伙伴计划的满意“客户”。这种三分结构对尽调重要， 因为留存、满意度和集中度问题在每组里都不同，而公开来源更常把三者混在一起，而不是区分。
