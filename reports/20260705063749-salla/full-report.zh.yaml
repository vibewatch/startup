          - type: callout
            title: 市场规模与平台份额估算分歧很大，且没有来源单独切出 Salla 的 SaaS 专属 SOM
            body: >-
              独立分析机构对沙特当前电商市场规模的判断相差约 50%（Mordor Intelligence 的 2026 年 $31.29 billion 估算，相比 ResearchAndMarkets 的 2024 年
              $20.7 billion 数字向前外推），DataReportal 自己的互联网用户数也在 2024 与 2025 年版本之间无解释下滑。Aftership 的平台份额数据只覆盖约 44,500
              家店铺的技术图谱样本，远小于 Salla 在第 1 章中披露的任何商户数口径；因此，本语料库没有来源能干净地为 Salla 单独隔离出美元计价的 SaaS 赋能 SOM。
