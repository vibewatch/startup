      - number: '4.4'
        title: 公开业务进展对比私有指标，以及财务结论
        blocks:
          - type: paragraph
            body: >-
              Salla 的公开业务进展记录是真实的，但方法口径不一致。独立技术图谱追踪器 StoreLeads 在 2026 年报告中仅计数 22,342 个由 Salla 驱动的在线店铺；此前 2025
              年技术识别出现大幅下滑，2026 年部分反弹。Tap Payments 伙伴博客另称，超过 68,000 家沙特店铺运行「Salla 4.0」——独立技术图谱计数与支付伙伴报告数字之间约有 3
              倍差距，且两者衡量基础不同，日期也很可能不同。叠加其上的，是前文讨论过的 GMV 风格数字（自 2020 年以来促成 $7 billion 至 $10 billion，覆盖 80,000 至 100,000+
              名「活跃商户」，取决于来源和页面）。由于没有来源把任何业务进展数字与实际收入数字配对，本章无法计算 Salla 的抽成率、每商户收入估算，或经增长调整的估值倍数——这是完整财务承销视角的最大单一阻碍。


              合在一起看，正面情形是：Salla 已经运营多个变现面（订阅、能让第三方开发者真实赚钱的应用市场、原生 BNPL 集成、以及规模可观的伙伴推荐计划），完成了一轮大型且声誉较强的机构融资（$130
              million，Investcorp 领投，PIF 旗下 Sanabil 和现有投资人 STV 参投），并且基金结构释放出走向公开市场的意图。负面情形是：标准 SaaS
              或市场平台财务模型所需的几乎所有变量——价格、收入、毛利率、CAC、回本期、现金、烧钱和跑道——都掌握在私有端，本语料库无从获取；甚至 Salla 的顶层规模指标也会随来源和时间不同相差约 3 倍至 5
              倍。BigCommerce 连续三个财年持续净亏损，尽管它是公开、经审计、资本充足的既有玩家；Motley Fool 的独立评论还称，即使是品类领导者 Shopify，其估值也多次跑在增长之前。这些来自更广泛电商
              SaaS 品类的负面提醒说明，规模和资本通道本身并不保证清晰的利润率路径；本章也把这个警示延伸到对 Salla
              自身财务轨迹的任何前瞻判断。结论因此是：收入架构和业务进展信号方向上正面，但在管理层提供收入、利润率和现金数据之前，财务判断仍未解决。
