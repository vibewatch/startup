  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻市场与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Salla 切入的是沙特 B2C，以及越来越多的 B2B 线上零售赋能层：一套软件、支付和物流栈，让商户可以通过互联网把实物商品直接卖给买家。Statista 在 Saudi Arabia eCommerce
              Market Forecast 里的市场定义说明很明确：计入的是通过桌面或移动数字渠道向私人终端消费者销售的实物商品；不计入的是数字分发服务、数字媒体下载或流媒体、B2B 批发贸易，以及
              C2C/reCommerce 二手或维修商品转售。这个边界很重要，因为几个相邻且更大的数字经常被拿来和 Salla 的市场并列引用，但它们不是同一件事。沙特国家支付网络 Mada 在 2024 年处理了
              $52.6 billion 电商交易（Mordor Intelligence），其中包含账单支付和其他接近线下刷卡场景的零售 GMV 之外流量。GASTAT 另行报告，2024 年整个 Information
              and Communications Technology 行业运营收入为 SAR 249.8 billion，其中包括电信、云和硬件；trade.gov 也独立估算，更广泛的沙特 ICT 市场接近 $48
              billion。Mada 处理金额和 ICT 行业收入都不能与电商 GMV 互换，尽管媒体报道有时会混用。Salla 店铺的关键现状替代方案包括：只在 Amazon.sa 或 noon
              等市场平台销售（佣金制、没有自有店铺）；通过 Instagram/WhatsApp 做直接社交电商销售但不设置专门结账；以及继续做线下 POS 零售。即使沙特互联网渗透率达到
              99%，线下零售仍代表多数日常消费支出。
