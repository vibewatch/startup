      - number: '1.4'
        title: 里程碑、合作伙伴与警示信号
        blocks:
          - type: paragraph
            body: >-
              Salla 公开里程碑从 2016 年创立延续至今，主线是一系列支付、物流和市场合作，而不是剧烈产品转向。早期里程碑包括 2018 年种子轮和 2019 年前后的 Series A；随后公司通过 Tamara
              合作加入面向商户的 BNPL（MAGNiTT 称超过 10,000 名商户可在不增加商户费用的情况下提供分期付款），并根据 Salla 自己的帮助中心文档，把 BNPL 提供商 Tabby
              作为另一种结账选项接入。2024 年，Arab News 的「Startups of the Year」专题记录了三项同步动作：$130 million Pre-IPO 轮、与 Adjust 为 Salla
              原生移动应用搭建器做分析/归因集成，以及与 STC Bank（沙特首家持牌数字银行）合作，把数字银行结账加入由 Salla 驱动的店铺。同一篇 Arab News 文章把总部位于 Riyadh 的 Zid
              列为同获「Startup of the Year」的直接品类同行，这为竞争者章节提供了有用背景。Tap Payments 2026 年伙伴博客报道的 Salla「4.0」平台重启，把新仪表盘、120+
              个商户工具、覆盖 Google/YouTube/TikTok/Snapchat 的自有「Salla Ads」广告位，以及 Tap Payments
              处理合作打包在一起。本章的警示信号主要是披露缺口，而不是负面事件：本研究没有发现诉讼、监管处罚或领导层离职；实质缺口在于缺少公开估值、董事名单、经审计财务数据和一套统一的规模指标，所以下文把它们记录为证据缺口，而不是直接做假设。
