      - number: '7.4'
        title: 伙伴、依赖、财务与人员 / 执行风险
        blocks:
          - type: paragraph
            body: >-
              Salla 2026 年 “Salla 4.0” platform relaunch 加入了与 Tap Payments 的支付处理合作，将 Tap 定位为 mada 和 Apple Pay 之外的核心
              checkout dependency； 另一个 Tamara buy-now-pay-later partnership 按 MAGNiTT 报道，把分期支付扩展到 10,000+
              merchants，且不向商户额外收费， 使 Tamara（以及 Product & Technology 章节所述 Tabby）成为第二类具名 checkout-financing
              dependency；考虑到这些并行通道， 没有单一 payments 或 BNPL partner 看起来是 sole point of failure。资本侧，Investcorp 通过其 Saudi
              Pre-IPO Growth Fund 领投 Salla 2024 年 3 月 $130 million 轮，并持有唯一公开披露的 board seat（Robin Mansour），同轮共同投资人包括
              Sanabil Investment 和 STV；这使 Investcorp 成为 Salla 最集中的资本和治理对手方。 独立技术尽调服务商 Code & Co. 确认，其在该轮前为 Investcorp 做了
              technical and product diligence；这是积极的独立信号，尽管结果并未公开。 Aggregator GetLatka 的 Salla profile 称公司
              “bootstrapped...with no outside investment” 且有 843 名 employees，直接冲突于已经充分佐证的融资历史； 本章节将其视为该 aggregator
              的数据质量标记，而不是治理风险本身。但这也意味着，本语料没有可靠披露 Salla 的 headcount 和 Saudi-national employee ratio， 限制了本章节评估其是否符合 Saudi
              Arabia Nitaqat（Saudization）program 的能力——该制度按 Saudi-national headcount ratio 将私营雇主划入合规 tiers， 并可对不合规雇主阻止
              visa renewals、限制 business expansion 或 government tenders。公开领导层披露仍限于上述两名具名创始人和一名具名董事，
              本报告未找到更完整的董事会名单、委员会结构或其他 C-suite names；同时，Salla 的 mobile app distribution 完全依赖 Apple App Store 和 Google
              Play， 两者都对任何 listed app 保留单方面 policy-enforcement 和 delisting 权力。
