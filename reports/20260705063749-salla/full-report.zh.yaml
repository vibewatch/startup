      - number: '3.2'
        title: 竞争者画像、已披露规模、定价与能力对比
        blocks:
          - type: paragraph
            body: >-
              Salla 自身已披露的规模指标会随来源大幅变化：StoreLeads 的 2026 年技术图谱报告计数 22,342 家在线店铺，Tap Payments 伙伴博客称有超过 68,000 家沙特店铺运行
              Salla 4.0，Entrepreneur Middle East 则报告超过 55,000 名商户、累计销售额超过 SAR 21 billion。本章保留这组店铺/商户数定义冲突，而不尝试调和。Salla
              自己的伙伴生态页面另称，500+ 名注册应用开发者触达超过 60,000 名商户；这个公司来源数字位于第三方和投资人披露的 55,000 至 100,000+ 区间中间。相比之下，Shopify 的 SEC
              Form 10-K 披露 FY2024 经审计总收入 $8.9 billion（同比 +26%）和 GMV $292.3 billion（+24%）；Yahoo Finance 在 2026 年初给出的市值接近
              $155 billion，过去 12 个月 P/E 超过 100x。BigCommerce 自己的 10-K 显示，FY2024 净亏损收窄但仍有 $27.0 million（FY2023 为 $64.7
              million），累计亏损 $621.7 million；Small Cap Stocks 的独立评论把这与收入增速放缓（约同比 12%）以及 Shopify 竞争压力加剧联系起来，BigCommerce
              自己申报的数字也印证了这项负面证据。定价方面，Shopify Basic 层为 $29-39/月；BigCommerce 层级横跨 $39 至 $1,499+/月，两者均为自助、公开列表价；WooCommerce
              没有核心平台费，但托管成本为 $25-350/月，每个扩展为 $29-299/年；Salesforce Commerce Cloud 完全不发布自助价目表（「联系获取定价」），WooCommerce
              自己的跨平台比较器独立估算其约为 $1,000-5,000+/月或 GMV 的 1-3%，因此是本报告审阅中成本最高、最偏企业级的竞争者。能力方面，Shopify Plus 和 Salesforce
              Commerce Cloud 的 B2B Growth Edition 都明确营销专用批发/B2B 店铺和原生 POS/全渠道工具；本语料库没有任何地方证明 Salla 或 Zid 具备等同的 B2B 或 POS
              能力。尽管 ZATCA 电子发票合规是沙特强制性监管要求，本集合中的任何竞争者——包括 Salla——都没有直接证据显示其具备 ZATCA 电子发票合规声明。
