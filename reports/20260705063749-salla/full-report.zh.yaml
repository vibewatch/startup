      - number: '6.5'
        title: 扩张与集中度：App Store 向上销售和 BNPL 是真实杠杆；无来源披露头部客户集中度
        blocks:
          - type: paragraph
            body: >-
              Salla 披露最清楚的扩张机制，是第三方 App Store（apps.salla.sa / salla.partners）。Product & Technology 章节记录，
              该商店承载外部开发者构建的付费私有（“Private”）和公开（“Public”）应用——这是先落地再扩张的入口：商户从免费 Basic tier 起步后，
              可以在不升级核心订阅层级的情况下添加付费功能。第二个扩张杠杆是嵌入式 buy-now-pay-later：按 MAGNiTT 报道， Salla 与 Tamara 的合作把分期支付扩展到 10,000+
              merchants，且不向商户额外收费；Product & Technology 章节还记录了单独的 Tabby integration。 两者都能扩大平均 shopper basket size
              和商户收入，而不需要对应的订阅层级升级。集中度风险与多数 enterprise SaaS 方向相反： Salla 商户基础被描述为“个人、中小品牌和成熟企业”，本语料中也没有披露任何单一头部客户，
              因此单商户收入集中度风险看起来结构性较低；但 Salla 反而承担围绕自有 App Store 和 partner-agency layer（Radar Agency、ReturnPlus、 Cartat
              等）的渠道集中度风险，而这些伙伴对 Salla 的相对收入贡献均未披露。一个新浮现、相邻于集中度的独立风险，是移动分发中的品牌渠道集中： 第二个使用 “Salla” 名称的 Google Play
              条目（package com.faya.sala）注册在一个看似无关的 developer（“Faya Dev Ltd”，英国注册实体）名下， 而不是 Salla 自己的 developer
              account；无论它是授权白标版本，还是借品牌名运营的无关方，都是本章节无法用现有证据关闭的品牌完整性和渠道控制问题。 独立平台对比评测持续把 Zid
              列为沙特商户考虑切换时最接近的竞争替代，本章节将其视为持续的竞争性留存风险， 而不是已解决问题。
