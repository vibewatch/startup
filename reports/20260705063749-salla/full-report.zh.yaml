      - number: '5.3'
        title: 可靠性、集成与路线图：实时状态页和已确认的平台代际存在，但长期 SLA 或发布节奏未披露
        blocks:
          - type: paragraph
            body: >-
              Salla 运营公开系统状态页（status.salla.com），分别监控 7 个组件——App Store、Merchant APIs、Merchant Dashboard、 Store
              Websites、Mahally、Salla Website 和 Store APIs——在本章节来源抓取时均显示 “Operational（运行正常）”，并报告 100% uptime。
              这是一个真实但边界较窄的可靠性信号：它确认 Salla 做了正式的组件级状态监控，类似 Shopify、BigCommerce 等同业； 但这里捕捉的单一时点快照无法说明历史事故频率、平均恢复时间，或 Salla
              合同中向商户承诺的任何正式 uptime SLA。 Salla 还维护专门的公开 changelog/updates portal（changelog.salla.sa），按类别组织 release
              notes，确认公司通过结构化渠道沟通产品变化， 而不是临时博客；但抓取页面本身在可访问内容中没有呈现带日期的具体 release history，因此本章节无法仅凭该来源给出具体发布节奏（如每周、每月）。


              产品代际方面，Tap Payments 博客赞助报道在 Salla 的 Tap-powered payment stack 和商户工具语境下明确提到 “Salla 4.0” 平台版本，说明 Salla
              公开产品历史里至少有一个具名大版本里程碑；但所审阅来源没有说明该版本的具体发布日期， 因此本章节将 “Salla 4.0”
              视为已确认的具名里程碑，确切日期仍待解决。集成方面，同一来源记录了支付之外的具体第三方连接： 无需单独签约的物流承运商集成，以及覆盖 Klaviyo、Mailchimp
              和主要社交广告网络的营销栈集成——本章节可以确认这种集成广度， 尽管 Salla 运行所依赖的基础设施提供商（cloud host、CDN、database vendor）在本语料中均未披露。
