      - number: '3.3'
        title: 转换成本、锁定、多归属与分发权力
        blocks:
          - type: paragraph
            body: >-
              在 SaaS 供应商之间迁移一个正在运营的店铺，需要迁移商品目录、主题、结账和支付网关集成，以及应用或插件依赖——每个平台自身集成和开发者文档的广度，都证明了这类通用转换成本，从 Salla 的 Merchant
              API 和 Twilight 主题 SDK，到 Shopify 的伙伴和应用生态。Salla
              自己的平台文档把一键连接或断开支付网关和物流公司的开关，作为面向商户的简化功能来营销；按设计，同一套开关式架构也降低了新增本地集成的门槛，无需完整换平台。这是一把双刃剑：它会削弱纯粹锁定，同时加深 Salla
              的本地集成足迹。在需求生成层面，KSA 商户并不被限制在单一渠道：商户可以同时运营自有 Salla 或 Zid 店铺，并在 noon 或 Amazon.sa
              等市场平台上架商品；这意味着店铺加市场平台的多归属既可行，而且从 noon 持续增长和新近完成 $500 million 融资来看，已经足够常见，能支撑一个大型相邻市场平台业务。具体到分发权力，Shopify
              伙伴计划报告仅 2025 年就向伙伴支付 $1.3 billion，并声称结账转化率最高比竞争对手高 36%——这些自报数字仍然说明，其生态规模比 Salla 披露的 500+ 名伙伴开发者高出几个数量级，让
              Shopify 对商户和第三方应用开发者都拥有明显更强的议价力。WooCommerce
              位于另一个极端：零平台费、完全自托管模式让商户在软件层拥有完整技术控制权，也没有供应商锁定，但把托管、安全以及（隐含的）本地监管合规负担转移给商户或其代理机构。这种成本真实存在，却比订阅费更难直接观察。本章审阅的来源没有记录
              Salla、Zid 或任何被画像的全球竞争者存在合同排他或反多归属条款，因此形式上的（相对于行为层面的）分发权力机制仍是开放证据缺口。
            claimRefs:
              - CP023
              - CP024
              - CP025
              - CP026
              - CP027
              - CP028
              - CP029
      - number: '3.4'
        title: 护城河耐久性、商品化风险与负面证据
        blocks:
          - type: paragraph
            body: >-
              Salla 自称的核心护城河——深度阿语 RTL 和 KSA 本地化、原生本国支付网关与物流公司开关，以及增长中的区域伙伴生态——在本语料库中完全由 Salla
              自有官方来源和伙伴控制来源证明；没有找到独立、非伙伴证据，能说明这种本地化深度相对 Zid 或全球既有玩家正在进行的 KSA 专项投入究竟有多强。这一点重要，因为规模和公开市场通道本身显然不能保证电商 SaaS
              的护城河耐久。BigCommerce 作为上市、资金充足的既有玩家，尽管亏损收窄，过去三个财年仍逐年亏损（2022 年 $139.9 million、2023 年 $64.7 million、2024 年
              $27.0 million）；Motley Fool 的独立评论还认为，即使是品类领导者
              Shopify，其估值也多次跑在底层增长之前。这些负面证据说明，品类领导地位不会自动转化为持久定价权。市场低端已经显出商品化压力：WooCommerce
              自己发布的跨平台定价比较，把其零平台费模式定位为相对五个品牌竞争者（Shopify、BigCommerce、Salesforce Commerce Cloud、Wix Enterprise 和 Adobe
              Commerce）的最低总成本选择；这是真实向下定价压力的证据，Salla 这样更窄的区域平台不能忽视。在替代侧，noon 新披露的 $500 million
              融资，让这个有主权资本支持的市场平台竞争者拥有的资本明显超过 Salla 已披露的 $130 million Pre-IPO 轮；尽管两者商业模式不同（市场平台对自有店铺
              SaaS），这种规模不对称值得跟踪。最后，本报告审阅的语料库没有证据显示有直接法律、反垄断或竞争主管机关行动点名 Salla、Zid 或任何被画像竞争者；Zid
              自身除那篇联合专题外也没有单独规模画像——这两个明确且未解决的证据缺口，限制了本章对竞争耐久性的排序信心。
