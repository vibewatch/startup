  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入来源、定价与结构：变现面很宽，定价不透明
        blocks:
          - type: paragraph
            body: >-
              Salla
              至少通过五种不同机制变现，而不是靠单一标价。公司自己的帮助中心文档确认了带订阅、发票和升级路径的分层「店铺计划」；但本报告审阅的来源没有披露这项核心订阅产品的具体层级名称、价格或功能边界——这是本章收入模型图景中最大的单一缺口。Salla
              的伙伴生态站点另行披露了两项更具体的变现机制：一项推荐计划，在被推荐商户的订阅销售上支付 24 个月佣金；以及一个 App
              Store，第三方开发者可上架付费的「Private」或「Public」应用。同一页面的计算示例显示，当一个应用以每次订阅 SAR 59 的价格被订阅 100 次时，开发者预计赚取 SAR
              4,130；按算术倒推，Salla 大约保留应用订阅总收入的 30% 作为平台费，尽管 Salla 从未直接说明这个比例。Salla 还原生集成 Tabby，并据 MAGNiTT 2023 年报道，与
              Tamara 合作，把 BNPL 结账扩展到超过 10,000 家店铺；没有来源披露 Salla 是否从任一 BNPL 提供商获得推荐费或收入分成。


              最清晰的公开业务进展数字是 GMV 风格，而不是收入风格。Investcorp 自己的融资公告新闻稿和 STV 的「doubling down」博客都称，Salla 自 2020 年以来已在约 80,000
              名活跃商户中促成 $7 billion 电商销售；Investcorp 针对同一家公司的另一个组合页面则给出明显更高的数字：自 2020 年以来促成 $10 billion，覆盖 100,000+
              名活跃商户——同一领投方在两个不同页面发布了两套规模数字。Entrepreneur Middle East 的独立画像又加入第三个数据点：超过 55,000 名商户、累计销售额 SAR 21
              billion。这些数字都不是收入或抽成率：它们描述的是流经 Salla 托管店铺的交易量，而不是 Salla 自身从订阅、应用商店佣金或支付集成中收取的金额。相比之下，Shopify 的 FY2024 SEC
              Form 10-K 披露，在 $292.3 billion GMV 上实现经审计总收入 $8.9 billion（同比 +26%）——这是一组成对可比的收入/GMV 数据，而 Salla
              语料库里没有任何等价物，凸显 Salla 相比最大全球同行的财务透明度低得多。
