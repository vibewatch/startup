companyProfile:
  summary: >-
    Salla 是一家总部位于 Makkah 的沙特电商 SaaS 平台，成立于 2016 年，帮助商户搭建网店、收款、管理配送，并接入大型第三方应用生态。公司已从 Investcorp、Sanabil Investment 和 STV
    获得机构 Pre-IPO 资本，也多次被列为沙特少数主导型电商平台之一；但它没有公开估值、收入或利润率，自己披露的核心规模指标在不同来源之间也明显冲突。
