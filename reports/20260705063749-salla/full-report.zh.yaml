  - id: FR002
    title: 风险传导图：合规与安全风险如何流入信任、利润率和估值
    type: dag
    layout: wide
    summary: Salla 的监管、安全和消费者保护风险先汇聚到商户与买家信任，再传导到利润率、融资需求和估值风险。
    data:
      nodes:
        - id: regulatory
          label: 监管 / PDPL / 网络安全风险
          detail: PDPL 与 NCA 合规状态未披露。
          tone: warning
        - id: credential
          label: 凭证 / 信息窃取暴露
          detail: 恶意软件泄露库中有 91,000+ 条与 salla.sa 关联的凭证。
          tone: warning
        - id: consumer
          label: 消费者保护摩擦
          detail: Trustpilot 评分为差；有类欺诈店铺投诉。
          tone: warning
        - id: brand
          label: 品牌 / IP 控制缺口
          detail: com.faya.sala 上架未解决。
          tone: warning
        - id: trust
          label: 商户与买家信任
          detail: 采用平台并留在平台上的意愿。
          tone: warning
        - id: margin
          label: 利润率 / 合规成本压力
          detail: 潜在罚款和补救成本压缩经济性。
          tone: negative
        - id: growth
          label: 增长耐久性
          detail: 采用轨迹取决于信任能否持续。
          tone: warning
        - id: financing
          label: 融资需求
          detail: 合规补救或增长放缓会推高资本需求。
          tone: negative
        - id: valuation
          label: 估值风险
          detail: 未披露的合规问题和规模指标冲突会压缩下行支撑。
          tone: negative
      edges:
        - from: regulatory
          to: trust
        - from: regulatory
          to: margin
        - from: credential
          to: trust
        - from: consumer
          to: trust
        - from: brand
          to: trust
        - from: trust
          to: growth
        - from: margin
          to: financing
        - from: growth
          to: valuation
        - from: financing
          to: valuation
    claimRefs:
      - CR009
      - CR013
      - CR019
      - CR023
      - CR006
  - id: FR003
    title: 依赖图：具名支付、资本与分发交易对手
    type: dag
    layout: wide
    summary: Salla 披露的依赖网络横跨支付、BNPL、资本和应用商店分发交易对手，其中 Investcorp 和两大应用商店是最集中的单一节点。
    data:
      nodes:
