      - number: '2.3'
        title: 买方、用户、付款方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              Salla 的核心客群是沙特 SME 商户：个人或小企业主既购买 SaaS 订阅，也运营由此产生的店铺；终端消费者则是商品的用户和付款方。第二个增速更快的客群是 B2B 批发。Mordor
              Intelligence 报告称，仅 Zid 商户就通过启用发票融资的 B2B 门户处理 SAR 1.6 billion 年销售额；这为 Salla 同样有位置服务的相邻细分市场提供了证明点。第三个客群经过
              Monsha'at，即政府 SME 主管机构。它投入 SAR 800 million 来数字化 824 家 SME，并把补贴和 Zid、Salla
              等认证平台上的店铺激活里程碑绑定；在这里，至少在补贴入驻窗口内，预算所有者实际上是国家而不是商户。消费者侧采用越来越由金融科技推动：Salla 自己的 Tamara BNPL 集成以零新增商户费用触达超过
              10,000 名商户；STV 对 Salla 的投资论点也明确引用「MENA 快速增长的电商市场」，而不是任何单一指标。最清晰的现状竞争采用路径是只在市场平台销售：卖家直接在 Amazon.sa 或 noon
              上架，完全不采用自有 SaaS 店铺；总部在 Dubai 的 noon 自身完成了 $500 million 新融资，其中包括沙特 Public Investment Fund 出资，并推动潜在
              IPO，说明海湾主权资本正在广泛流入电商，而不只投向 Salla 这样的 SaaS 赋能平台。
