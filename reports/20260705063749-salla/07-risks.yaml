- id: mitigations-monitoring-and-kill-criteria
  title: Mitigations, monitoring indicators, and kill criteria
  body: 'The strongest disclosed mitigations in this corpus are governance-side: Investcorp''s institutional board seat and its pre-investment technical/product due diligence via Code & Co. are the best-evidenced checks against execution and key-person risk, and Salla''s use of two independent BNPL partners (Tamara and Tabby) plus mada and Apple Pay reduces single-point-of-failure risk in checkout relative to a single-processor dependency. A documented, functioning buyer-complaint escalation process is a partial mitigation for consumer-protection and dispute-mediation risk, though its aggregate effectiveness cannot be measured from public sources, and no disclosed compliance certification (PDPL registration, NCA cybersecurity-controls attestation, PCI DSS audit, or ISO 27001) was found anywhere in this report, so compliance-risk mitigation cannot be independently verified beyond company claims. This chapter converts its most material open questions into monitorable triggers: any published SDAIA or NCA enforcement decision naming Salla; a material quarter-over-quarter increase in infostealer-log credential counts tied to the salla.sa domain; the departure of either named co-founder without a disclosed successor; and escalation or resolution of the com.faya.sala brand-control question. A monitorable positive indicator would be Salla publishing one reconciled, audited merchant or store-count figure consistently across its own investor-relations and press materials, which would reduce the scale-metric uncertainty flagged across the Company Overview, Customers, and this chapter. Each of these triggers is paired with a specific diligence path in this chapter''s tables rather than left as an unresolved narrative point.'
