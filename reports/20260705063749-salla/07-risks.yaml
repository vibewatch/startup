  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pdpl-compliance-status-gap
    missingEvidence: Confirmation of Salla's Personal Data Protection Law registration status, any SDAIA compliance attestation, or a data-protection-officer disclosure.
    whyItMatters: PDPL is fully enforced (since 14 Sep 2024) with fines up to SAR 5 million and criminal exposure for serious violations, so an unverified compliance posture is a material, currently-unpriced regulatory risk for any acquirer or investor.
    diligencePath: Request Salla's SDAIA National Data Governance Platform registration record and any independent PDPL compliance audit.
    relatedQuestionRefs:
    - QR003
    relatedTableRefs:
    - TR001
  - type: access-blocked
    severity: minor
    topic: brand-control-gap
    missingEvidence: Confirmation of the relationship (if any) between Salla and the Faya Dev Ltd-registered com.faya.sala Google Play listing.
    whyItMatters: An unresolved brand-attribution question on a public app-distribution channel is a reputational and channel-control risk that this chapter cannot close without a direct company response.
    diligencePath: Request Salla's official position on the com.faya.sala listing, including whether it is licensed, affiliated, or unauthorized, and any trademark enforcement action taken.
    relatedQuestionRefs:
    - QR008
    - QR009
    relatedTableRefs:
    - TR001
  - type: missing-metric
    severity: material
    topic: hosting-infrastructure-disclosure-gap
    missingEvidence: Salla's hosting/cloud-infrastructure provider, a public status or incident page, or an independently verified uptime/SLA record.
    whyItMatters: Without this, this chapter cannot assess exposure to the NCA's Cloud Cybersecurity Controls, data-localization compliance, or operational resilience.
    diligencePath: Request Salla's hosting-provider identity, data-residency architecture, and any independent security or resilience audit.
    relatedQuestionRefs:
    - QR015
    - QR016
    relatedTableRefs:
    - TR002
  - type: missing-metric
    severity: material
    topic: litigation-history-disclosure-gap
    missingEvidence: A direct disclosure of Salla's litigation, arbitration, or regulatory-enforcement history.
    whyItMatters: Absence of public litigation records in this corpus does not confirm a clean record given Saudi Arabia's limited public visibility into commercial disputes; this is a common but material diligence blind spot.
    diligencePath: Request a direct litigation-history disclosure and any regulator correspondence from Salla and its lead investors.
    relatedQuestionRefs:
    - QR006
    relatedTableRefs:
    - TR001
  - type: missing-metric
    severity: material
    topic: headcount-nitaqat-disclosure-gap
    missingEvidence: Salla's verified headcount, Saudi-national employee ratio, and current Nitaqat compliance tier or band.
    whyItMatters: Nitaqat non-compliance can freeze visa renewals and restrict business expansion or government tenders, which would be material to execution risk for a pre-IPO technology company.
    diligencePath: Request Salla's current Nitaqat tier/band status directly, or via the Ministry of Human Resources and Social Development's employer lookup.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR004
  - type: access-blocked
    severity: minor
    topic: unctad-dataset-access-gap
    missingEvidence: A rendered view of the World Bank Data360 / UNCTAD dataset on global data-protection and e-commerce legislation for Saudi Arabia.
    whyItMatters: This dataset could provide an independent, standardized cross-country comparison point for Saudi Arabia's data-protection regulatory stringency, but the page did not render full content for this chapter's fetch.
    diligencePath: Access the dataset via its API or a authenticated session rather than a direct page fetch.
    relatedQuestionRefs:
    - QR004
