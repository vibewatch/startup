chapter:
  number: 7
  title: Risks
  summary: 'Salla''s most material disclosed risks cluster around regulatory and legal opacity rather than confirmed adverse events: Saudi Arabia''s Personal Data Protection Law (fully enforced since September 2024, fines up to SAR 5 million) and Cybersecurity Law/NCA cloud-security controls both apply to an e-commerce SaaS platform handling merchant and shopper data, but no source in this corpus discloses Salla''s PDPL registration status, a security certification, or its hosting provider. A breach-monitoring vendor independently documents tens of thousands of salla.sa-linked credentials circulating in infostealer-malware dumps, and independent buyer reviews document a pattern of scam-adjacent-store complaints and weak dispute mediation, both of which sit inside Saudi Arabia''s active e-commerce consumer-protection regime. Partner and dependency risk is moderate and diversified across named payments (Tap), BNPL (Tamara, Tabby) and capital (Investcorp, Sanabil, STV) counterparties, but key-person and governance risk is elevated because only two named executives and one named board member recur across all public sources. No public source discloses an active lawsuit, regulatory sanction, or enforcement action naming Salla, which this chapter treats as an evidence gap rather than a confirmed clean record, and it converts every unresolved item into a specific, monitorable diligence ask or kill criterion rather than an assumed answer.'
sections:
- id: severity-ranked-risk-overview
  title: Severity-ranked risk overview
  body: 'This chapter ranks Salla''s disclosed and inferred risks by severity and mitigation maturity rather than by topic alone. The two highest-severity, least-mitigated categories are regulatory/compliance opacity (Personal Data Protection Law, Cybersecurity Law, and NCA cloud-security controls all apply, but no source discloses a compliance certification or registration status) and an unresolved brand/IP-control question around a second Google-Play listing using the Salla name. Credential-exposure risk is already observed rather than hypothetical: an independent breach-monitoring vendor documents tens of thousands of salla.sa-linked credentials circulating in infostealer-malware dumps, split across customer, employee, and third-party categories, though this reflects device-side malware rather than a confirmed breach of Salla''s own systems. Partner concentration is moderate: Salla relies on named counterparties for payments (Tap), buy-now-pay-later (Tamara, Tabby), and lead capital (Investcorp), but none appears to be a single point of failure for a critical function given multiple parallel rails. Key-person and governance risk is elevated because only two named executives (CEO Nawaf Hariri, COO Salman Butt) and one named non-founder board member (Investcorp''s Robin Mansour) recur across every source in this corpus, with no disclosed succession plan or broader management bench. No source discloses an active lawsuit, regulatory sanction, or enforcement action naming Salla specifically; this chapter treats that absence as an evidence gap requiring direct diligence rather than as confirmation of a clean record, and the investment implication throughout is that Salla''s pre-IPO stage raises the bar for the disclosure depth a future public listing would require relative to today''s record.'
