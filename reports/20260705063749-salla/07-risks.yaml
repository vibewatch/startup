- id: partner-dependency-and-execution-risk
  title: Partner, dependency, financial, and people/execution risk
  body: Salla's 2026 'Salla 4.0' platform relaunch added a payments-processing partnership with Tap Payments, positioning Tap as a core checkout dependency alongside mada and Apple Pay, while a separate Tamara buy-now-pay-later partnership extended installment payments to more than 10,000 merchants at no extra merchant fee per MAGNiTT's coverage, making Tamara (and, per the Product & Technology chapter, Tabby) a second named checkout-financing dependency; no single payments or BNPL partner appears to be a sole point of failure given these parallel rails. On the capital side, Investcorp led Salla's $130 million March 2024 pre-IPO round and holds the only publicly disclosed board seat (Robin Mansour), alongside co-investors Sanabil Investment and STV, making Investcorp Salla's single most concentrated capital and governance counterparty; an independent technology-due-diligence vendor, Code & Co., confirms it ran technical and product diligence for Investcorp ahead of that round, a positive independent signal even though its findings are not public. Aggregator GetLatka's Salla profile, which describes the company as 'bootstrapped...with no outside investment' and reports 843 employees, directly conflicts with this documented funding history and is treated as a data-quality flag rather than a governance risk in itself, but it also means Salla's headcount and Saudi-national employee ratio are not reliably disclosed anywhere in this corpus, which limits this chapter's ability to assess compliance with Saudi Arabia's Nitaqat (Saudization) program -- a regime that ranks private-sector employers into compliance tiers by Saudi-national headcount ratio and can block visa renewals and restrict business expansion or government tenders for non-compliant employers. Public leadership disclosure remains limited to the two named founders and one named board member noted above, with no fuller board roster, committee structure, or additional C-suite names found anywhere in this report, and Salla's mobile app distribution depends entirely on the Apple App Store and Google Play, both of which retain unilateral policy-enforcement and delisting authority over any listed app.
