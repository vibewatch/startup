- id: reliability-integrations-and-roadmap
  title: 'Reliability, integrations, and roadmap: a real-time status page and a confirmed platform generation, but no long-run SLA or cadence disclosure'
  body: 'Salla operates a public system-status page (status.salla.com) that separately monitors seven components -- App Store, Merchant APIs, Merchant Dashboard, Store Websites, Mahally, Salla Website, and Store APIs -- all showing an "Operational" state and a reported 100% uptime figure at the time this chapter''s source was fetched. This is a genuine, if narrow, reliability signal: it confirms Salla runs formal, component-level status monitoring akin to peers like Shopify and BigCommerce, but the single point-in-time snapshot captured here says nothing about historical incident frequency, mean time to recovery, or any formal uptime SLA Salla contractually offers merchants. Salla also maintains a dedicated public changelog/updates portal (changelog.salla.sa) that organizes release notes by category, confirming the company communicates product changes through a structured channel rather than an ad hoc blog -- though the fetched page itself did not surface a specific, dated release history within the accessible content, so this chapter cannot state a concrete release cadence (e.g., weekly, monthly) from that source alone.


    On the product-generation side, sponsored coverage on Tap Payments'' blog describes a "Salla 4.0" platform version explicitly, in the context of Salla''s Tap-powered payment stack and merchant tooling, indicating at least one named major-version milestone exists in Salla''s public product history; however, the specific release date of that version is not stated in the reviewed source, so this chapter treats "Salla 4.0" as a confirmed named milestone with an unresolved exact date. On the integration side, the same source documents concrete third-party connectivity beyond payments: logistics-carrier integrations with no separate contracts required, and marketing-stack integrations spanning Klaviyo, Mailchimp, and major social ad networks -- integration breadth this chapter can confirm, even though the underlying infrastructure provider (cloud host, CDN, database vendor) Salla runs on is not disclosed anywhere in this corpus.'
