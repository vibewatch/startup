- id: FE004
  title: Product maturity / capability map
  type: matrix
  layout: wide
  summary: Salla's core storefront, payments, and Saudi-market localization are the most mature, best-evidenced capabilities; independent security certification, international support, and long-run reliability history are the weakest.
  data:
    columns:
    - Maturity
    - Evidence strength
    - Diligence gap
    rows:
    - label: Core storefront and merchant dashboard
      values:
      - label: high
        tone: positive
        detail: A decade of operating history and hundreds of thousands of merchant relationships across cited sources
      - label: strong
        tone: positive
        detail: Corroborated by company documentation and an independent merchant-side review
      - label: low
        tone: positive
        detail: Well-evidenced; remaining gaps are mostly around price-tier detail, covered in the Financials chapter
    - label: Native payments and BNPL
      values:
      - label: high
        tone: positive
        detail: Specific, named integrations (mada, Tabby, Apple Pay, Tamara) with reviewer-confirmed setup speed
      - label: strong
        tone: positive
        detail: Confirmed by both company content and independent review
      - label: medium
        tone: neutral
        detail: Fee/revenue-share terms with payment/BNPL partners remain undisclosed
    - label: Developer tooling and API (CLI, SDKs, docs)
      values:
      - label: medium-high
        tone: positive
        detail: Actively maintained npm packages, public GitHub org, documented REST API
      - label: medium
        tone: neutral
        detail: Confirmed via npm/GitHub, but total developer count and API SLA are undisclosed
      - label: medium
        tone: neutral
        detail: Zero Stack Overflow activity limits visibility into real-world developer pain points
    - label: Native mobile apps
      values:
      - label: medium
        tone: neutral
        detail: Both apps are live with real installs, but merchant app rating (3.3/5) trails best-in-class benchmarks
      - label: strong
        tone: positive
        detail: Independently aggregated Google Play data (rating, review count, install tier)
      - label: medium
        tone: warning
        detail: No sentiment breakdown behind the 3.3/5 rating is available
    - label: International (non-GCC) support
      values:
      - label: low
        tone: warning
        detail: Independent reviewer reports multi-country tax/shipping as manual and limited
      - label: medium
        tone: neutral
        detail: Single detailed independent review; not cross-confirmed by a second source
      - label: high
        tone: warning
        detail: No company-disclosed roadmap or timeline for improved international support found
    - label: Trust, security, and compliance certification
      values:
      - label: unverified
        tone: warning
        detail: PCI DSS, fraud detection, and ZATCA integration are company-claimed only
      - label: weak
        tone: warning
        detail: No independent certification, audit report, or attestation found in this corpus
      - label: high
        tone: warning
        detail: This is the single largest trust/security diligence gap identified in this chapter
    - label: Reliability / uptime disclosure
      values:
      - label: low-medium
        tone: neutral
        detail: A live, component-level status page exists, but only a single "100% operational" snapshot was captured
      - label: weak
        tone: warning
        detail: No historical incident log, MTTR data, or contractual SLA found
      - label: high
        tone: warning
        detail: Cannot assess reliability trend or resilience without a longer observation window
  approximationNotes: Ratings in this matrix are this chapter's qualitative synthesis of the evidence gathered, not a scored framework published by Salla or any third party; they are directional, not a certified maturity assessment.
  claimRefs:
  - CE030
  - CE041
  - CE037
  - CE039
  - CE032
  - CE029
callouts:
- calloutType: risk
  title: No independent security or compliance certification found
  body: Salla claims full PCI DSS compliance, AI fraud detection, 3D Secure, and direct ZATCA e-invoicing integration in its own marketing content, but no reviewed source -- audit firm, certification body, or regulator -- independently confirms any of these controls. This is the single largest trust-and-security diligence gap in this chapter and should be resolved before relying on Salla's own compliance statements for underwriting purposes.
  claimRefs:
  - CE006
  - CE008
  - CE041
- calloutType: insight
  title: A real, if modest, third-party developer ecosystem exists beyond Salla's own tooling
  body: Independent GitHub projects (a Python client, a Node.js Passport OAuth2 strategy, a Telegram bot wrapper, and an AI-agent MCP server) and at least one independent npm package (an n8n automation node) show organic developer investment in Salla's API surface that Salla itself did not build or fund -- a healthier ecosystem signal than official tooling alone would suggest, even though public Q&A visibility (zero Stack Overflow questions) remains thin.
  claimRefs:
  - CE027
  - CE028
  - CE026
  - CE029
- calloutType: assumption
  title: '"Salla 4.0" and the status-page snapshot are treated as point-in-time facts, not trends'
  body: This chapter treats the "Salla 4.0" platform-version reference and the "100% operational" status-page reading as accurate at the time each source was captured, not as evidence of a specific release cadence or long-run reliability trend. Any downstream use of either fact should be re-verified against a current fetch rather than assumed to persist.
  claimRefs:
  - CE032
  - CE034
