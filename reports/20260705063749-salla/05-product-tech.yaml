- id: architecture-and-developer-ecosystem
  title: 'Architecture and developer ecosystem: REST, OAuth2, webhooks, and a real (if small) third-party build surface'
  body: 'Salla''s own developer documentation describes a Merchant REST API secured by OAuth 2.0, a webhook system for real-time store-event notifications, a serverless "App Functions" layer for hosting custom app logic without merchant-facing infrastructure, and a Twilight theming framework for building and publishing custom storefront themes. This architecture is exposed to developers through the official `@salla.sa/cli` npm package -- described on its own package page as "the Official Salla Command Line Interface" -- which provides commands to create, serve, authenticate, link, delete, and upgrade a Salla App project from the command line, and republishes a working example at a public GitHub repository (SallaApp/Salla-CLI). Salla also publishes `@salla.sa/twilight` (a theme toolkit bundling web components, event handling, request utilities), `@salla.sa/twilight-components` (the underlying web-component library), and `@salla.sa/twilight-tailwind-theme` (a Tailwind CSS theme built on that toolkit) -- all at the same version number and all published within days of the runDate for this report, indicating an actively maintained, coordinated release train rather than an abandoned tool. `@salla.sa/twilight-tailwind-theme` alone reports roughly 15,000 weekly npm downloads and four dependent packages, a directional (not audited) proxy for how many themes or projects build on Salla''s official component layer.


    A meaningfully sized independent developer surface exists on top of Salla''s own tooling. A GitHub code search for "salla-api" surfaces multiple third-party, unofficial open-source projects: a Node.js Passport.js OAuth 2.0 authentication strategy scoped specifically to Salla''s login flow, a Python client library for the Salla API, a Telegram bot wrapper for Salla store data, and -- most notably given the runDate -- a "Salla Merchant API MCP Server," a Model Context Protocol server that would let AI agents interact with Salla merchant data programmatically. None of these are Salla-maintained; their existence indicates organic third-party investment in Salla''s API surface, but also means their reliability, security posture, and maintenance are entirely outside Salla''s control. Set against this, Salla''s public developer-community visibility on Stack Overflow is effectively nil: a search of the platform''s "salla" tag returns zero tagged questions as of this report''s runDate, in contrast to the real, if modest, activity visible on GitHub and npm -- suggesting that whatever developer support exists for Salla routes through its own Partners Portal, direct support channels, or informal channels rather than public Q&A. On the positive side, Salla''s Partners Portal was itself a nominee in the 2025 Developer Portal Awards, an independent, third-party-run recognition program, which is some evidence that Salla''s documentation quality is viewed favorably by at least one external developer-experience judging body -- though nomination is not the same as winning, and no source in this corpus confirms an award outcome.'
