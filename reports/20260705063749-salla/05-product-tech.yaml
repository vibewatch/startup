- id: TE002
  title: Workflow / use-case table
  columns:
  - user job
  - current workflow
  - Salla's solution
  - measurable benefit
  - limitation
  rows:
  - - Launch a new online store
    - Historically required custom development or a generic template builder with manual local-payment integration
    - Pick a template, add products, connect Mada/Tabby, go live -- per an independent reviewer, live within a day
    - Independently confirmed fast time-to-launch (under 1 hour for a basic store, per the same reviewer)
    - Setup speed is reviewer-observed for one case, not a benchmarked average across store types
  - - Accept local Saudi payments and BNPL
    - Merchants previously needed separate gateway contracts per payment method
    - One-dashboard native support for mada, Visa, Mastercard, Amex, Apple Pay, and Tabby BNPL
    - Reviewer reports 5-minute Mada/Tabby setup time
    - Fee/commission terms for these integrations are not disclosed in this corpus
  - - Sell to customers outside Saudi/GCC
    - Would otherwise require a separate international tax/shipping stack
    - Salla supports 15+ currencies for checkout
    - Currency breadth is a concrete, quantified claim
    - Independent reviewer reports multi-country tax setup and non-GCC shipping remain manual and limited
  - - Extend the store with custom functionality
    - Would otherwise require bespoke development against an undocumented backend
    - App Store (apps.salla.sa) plus a documented REST API, OAuth2, webhooks, and CLI/SDK tooling
    - A real, if modest, external developer ecosystem (npm packages, GitHub projects) already exists
    - Reviewer reports the plugin ecosystem is "much smaller than Shopify's," so specific integrations may not exist
  - - Analyze store performance
    - Would otherwise require exporting raw order data to a spreadsheet or BI tool
    - Built-in dashboard shows orders, inventory, and revenue in one place
    - Confirmed usable "out of the box" per independent reviewer
    - Free/basic-tier reporting omits sales-by-category breakdowns without a paid upgrade
  - - Resolve a buyer-merchant dispute
    - Marketplace platforms (Amazon, Noon) typically mediate disputes directly
    - Salla positions itself as a store builder, not a marketplace, and does not mediate
    - Clear structural expectation-setting for merchants who want full control
    - Cited third-party complaint alleges weak buyer recourse when a merchant does not respond
  notes: Benefit and limitation columns are drawn primarily from one detailed independent merchant-side review (ZatcaHub, 2026) corroborated where possible against Salla's own documentation and help-center articles; single-source observations are noted as such rather than generalized.
