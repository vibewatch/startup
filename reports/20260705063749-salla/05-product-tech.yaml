- id: TE003
  title: Technology / operating architecture table
  columns:
  - layer/component
  - role
  - dependency
  - risk
  rows:
  - - Merchant REST API
    - Core programmatic interface for reading/writing store data (products, orders, customers)
    - OAuth 2.0 authorization layer
    - No published rate-limit, versioning, or deprecation policy found in this corpus
  - - OAuth 2.0 authentication
    - Secures API and app access for merchants and third-party developers
    - Underlies every App Store and CLI-based integration
    - No independent security audit of the auth implementation found
  - - Webhooks
    - Real-time push notifications for store events (orders, inventory changes)
    - Consumed by third-party apps and integrations (e.g., marketing/automation tools)
    - No disclosed delivery-guarantee, retry, or latency SLA
  - - App Functions (serverless layer)
    - Hosts custom app backend logic without merchant-managed infrastructure
    - Underlying cloud/hosting provider not disclosed
    - Vendor lock-in and cold-start/latency characteristics are unknown
  - - Twilight theming framework + web components
    - Powers custom storefront themes and UI components
    - Distributed via `@salla.sa/twilight`, `@salla.sa/twilight-components`, `@salla.sa/twilight-tailwind-theme` npm packages
    - GPL-3.0 licensing on some packages may constrain certain commercial theme-resale models
  - - Salla CLI (@salla.sa/cli)
    - Local developer tool for creating, serving, and publishing Salla Apps
    - Requires Node.js/npm toolchain; Laravel/Express keywords suggest a PHP+Node hybrid backend ecosystem
    - Last published version (per npm) is roughly three months old versus the frontend/theme packages' three-day-old releases, a slower cadence for this specific tool
  - - Third-party unofficial SDKs (Python client, Node.js Passport strategy, Telegram bot, MCP server)
    - Extend Salla API access to additional languages/agents beyond official tooling
    - Entirely maintained outside Salla; depend on Salla's REST API remaining stable
    - Not vetted, security-reviewed, or supported by Salla; breakage risk on any API change
  - - Payment and BNPL integrations (mada, Tabby, Apple Pay, and via partner Tamara)
    - Handles transaction processing and buy-now-pay-later checkout
    - External payment/BNPL providers' own infrastructure and compliance
    - Fee/revenue-share terms and provider-side outage risk are not disclosed
  notes: Architecture facts are drawn from Salla's own developer documentation, npm package metadata, and GitHub search results; risk column reflects gaps this chapter could not independently verify rather than confirmed defects.
