  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pci-dss-certification-gap
    missingEvidence: An independent PCI Security Standards Council attestation of compliance, SOC 2 report, or ISO 27001 certificate for Salla.
    whyItMatters: Salla's own marketing claims strong security and compliance controls, but without independent certification this chapter cannot verify those claims meet any recognized third-party standard.
    diligencePath: Request Salla's most recent PCI DSS Attestation of Compliance, SOC 2 report, or ISO 27001 certificate directly from the company, or check the PCI Security Standards Council's list of validated service providers.
    relatedQuestionRefs:
    - QE010
  - type: access-blocked
    severity: minor
    topic: zatca-solution-provider-listing-gap
    missingEvidence: An independent confirmation, such as a listing in ZATCA's own compliant e-invoicing solution provider registry, that Salla is a certified ZATCA-compliant platform.
    whyItMatters: ZATCA e-invoicing compliance is a legal mandate for Saudi taxpayers; without independent confirmation, this chapter can describe the requirement but not verify Salla's own conformance.
    diligencePath: Search ZATCA's published solution-provider or vendor registry for a Salla listing, or request a compliance attestation directly from Salla.
    relatedQuestionRefs:
    - QE011
  - type: missing-source
    severity: minor
    topic: platform-version-date-gap
    missingEvidence: A specific, dated release announcement for the "Salla 4.0" platform version referenced in sponsored coverage.
    whyItMatters: Without a confirmed release date, this chapter cannot establish Salla's actual major-version release cadence or timing relative to competitor platform updates.
    diligencePath: Search Salla's own changelog/updates portal or press coverage archives for a dated "Salla 4.0" launch announcement.
    relatedQuestionRefs:
    - QE017
  - type: missing-source
    severity: material
    topic: hosting-infrastructure-gap
    missingEvidence: The specific cloud hosting provider, CDN, or database infrastructure Salla's platform runs on.
    whyItMatters: Infrastructure choice materially affects reliability, data-residency compliance, and disaster-recovery posture, none of which can be assessed without knowing the underlying provider.
    diligencePath: Request Salla's infrastructure and data-residency documentation directly from the company, or review any published case study from a cloud provider naming Salla as a customer.
    relatedQuestionRefs:
    - QE019
  - type: private-evidence-only
    severity: material
    topic: reliability-history-gap
    missingEvidence: A historical incident log, mean-time-to-recovery data, or a contractual uptime SLA for Salla's platform beyond the single status-page snapshot captured in this chapter.
    whyItMatters: A single "100% operational" reading says nothing about past outage frequency or severity, which is what a reliability underwriting decision actually requires.
    diligencePath: Request Salla's historical status-page incident archive or any merchant-facing SLA documentation directly from the company.
    relatedQuestionRefs:
    - QE028
  - type: missing-source
    severity: minor
    topic: developer-count-gap
    missingEvidence: A disclosed total count of unique third-party developers or apps built using Salla's official CLI, SDKs, and App Functions layer.
    whyItMatters: Without a developer-count figure, this chapter can describe the tooling's existence and activity level but cannot size the overall developer ecosystem relative to competitors like Shopify.
    diligencePath: Request developer-ecosystem metrics (registered developers, published apps, active integrations) directly from Salla's Partners team.
    relatedQuestionRefs:
    - QE006
