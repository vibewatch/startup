- id: trust-security-and-compliance
  title: 'Trust, security, and compliance: strong claimed controls, no independent certification found'
  body: 'Salla''s own marketing content claims a meaningful trust and security stack: AI-based fraud detection, 3D Secure card-verification, "full PCI DSS compliance," and direct electronic-invoice integration with Saudi Arabia''s Zakat, Tax and Customs Authority (ZATCA), alongside full Arabic-language support across the dashboard, storefront, and apps. These are real, specific claims -- more concrete than generic "secure and reliable" marketing language -- but every one of them is company-stated rather than independently certified in this corpus: no PCI Security Standards Council attestation of compliance, no SOC 2 report, no ISO 27001 certificate, and no third-party audit of Salla''s ZATCA e-invoicing conformance appears in any reviewed source, which is consistent with the unresolved ZATCA-compliance-status gap already identified in this report''s Financials chapter. Independent, arms-length evidence is more mixed than Salla''s own marketing suggests. A detailed third-party merchant-side review (ZatcaHub, 2026) corroborates several of Salla''s strengths first-hand -- a live store within a day, five-minute Mada/Tabby setup, and clean, non-technical-friendly Arabic UI -- but also documents concrete limitations: free/basic-tier analytics that omit basic sales-by-category breakdowns without an upgrade, a plugin/app ecosystem the same reviewer calls "much smaller than Shopify''s," and international shipping/multi-country tax configuration for non-GCC markets that requires significant manual work. The same review cites an unverified Trustpilot complaint alleging Salla does not effectively mediate buyer-merchant disputes, and explicitly frames Salla as "a store builder, not a marketplace" that does not intervene in disputes the way Amazon or Noon would -- a structural, not incidental, difference in buyer protection. Salla''s own official merchant-management app on Google Play (com.emoney.sallacp) carries a 3.3-out-of-5 rating across 5,800 reviews with 500,000-plus installs, a quantifiable, independently-aggregated satisfaction signal that sits below what a best-in-class merchant tool would typically carry, though Google Play does not disclose a review-sentiment breakdown in the fetched listing.'
