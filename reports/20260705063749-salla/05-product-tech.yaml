- id: FE002
  title: Customer workflow / operating flow
  type: flow
  layout: wide
  summary: A merchant's path from sign-up to an ongoing store mirrors a fast, locally-optimized setup flow, but hits real limits at analytics depth, international expansion, and buyer-dispute handling.
  data:
    nodes:
    - id: signup
      label: Merchant signs up
      detail: Self-serve account creation; free plan available for evaluation
      tone: positive
    - id: template
      label: Selects a storefront template
      detail: Twilight-based themes; independent reviewer reports live setup within a day
      tone: positive
    - id: payments
      label: Connects local payments
      detail: mada and Tabby configured in roughly 5 minutes per an independent reviewer
      tone: positive
    - id: catalog
      label: Lists products and shipping
      detail: Logistics-carrier connections available without separate contracts
      tone: positive
    - id: launch
      label: Store goes live
      detail: Dashboard shows orders, inventory, and revenue in one place
      tone: positive
    - id: extend
      label: Extends via App Store or custom app
      detail: Third-party apps or a merchant-generated native mobile app can be added post-launch
      tone: neutral
    - id: sell_intl
      label: Attempts to sell outside Saudi/GCC
      detail: Multi-country tax and international shipping setup reported as manual and limited
      tone: warning
    - id: analytics
      label: Reviews performance analytics
      detail: Free/basic tier omits sales-by-category breakdowns without a paid upgrade
      tone: warning
    - id: dispute
      label: Buyer-merchant dispute arises
      detail: Salla does not mediate; positions itself as a store builder, not a marketplace
      tone: negative
    edges:
    - from: signup
      to: template
    - from: template
      to: payments
    - from: payments
      to: catalog
