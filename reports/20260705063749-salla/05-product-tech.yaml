chapter:
  number: 5
  title: Product & Technology
  summary: Salla is a full-stack e-commerce SaaS platform -- storefront builder, merchant dashboard, native mobile apps, payments/BNPL, logistics, and marketing tooling -- wrapped around a REST API, OAuth2 authentication, a webhook event system, and a Twilight theming/component framework that a real (if modest-sized) external developer ecosystem builds on. Salla's own npm-scoped packages (CLI, theming toolkit, web components, Apple Pay SDK) show active, recently published tooling, and independent GitHub projects (an OAuth2 Passport strategy, a Python client, a Telegram bot wrapper, and an AI-agent "MCP server") confirm third parties build against Salla's API without official sponsorship. Public developer-community signal is uneven -- Salla has zero tagged questions on Stack Overflow, no disclosed hosting/infrastructure provider, and no independently certified security/compliance credential in this corpus -- PCI DSS compliance and ZATCA e-invoicing integration are company-claimed, not third-party-audited. A single independent merchant-side review corroborates fast setup and strong local-payment/Arabic-market fit, but also documents a materially smaller plugin ecosystem than Shopify's, thin free-tier analytics, limited non-GCC international shipping/tax support, and unresolved buyer-protection complaints given Salla's storefront-builder (not marketplace-mediator) model. This chapter can describe Salla's product surface and technical architecture with reasonable confidence, but cannot verify its security certifications, hosting resilience, or long-run release cadence beyond a single point-in-time status snapshot.
sections:
- id: product-overview-and-module-map
  title: 'Product overview and module map: a full merchant-operations suite, not just a storefront builder'
  body: 'Salla packages far more than a storefront template into one merchant product. Its own marketing content (via a 2026 sponsored feature on Tap Payments'' blog) describes a single dashboard that covers store setup, product listings, order and inventory management, native payment acceptance (mada, Visa, Mastercard, American Express, Apple Pay, and Tabby buy-now-pay-later, across 15-plus currencies), logistics-carrier connections with no separate contracts, built-in loyalty and rewards tooling, and marketing integrations spanning email (Klaviyo, Mailchimp), social advertising (Snapchat, Instagram, TikTok, X, Google), and WhatsApp order-confirmation messaging. A distinct native-app-builder module lets a merchant generate a branded Android or iOS shopping app "in 72 hours, no code," which stays synchronized with the main web store; this module is delivered separately from Salla''s own first-party mobile apps. Salla ships at least one confirmed first-party app on Google Play -- a merchant-management app (package com.emoney.sallacp, developer "Nawaf Hariri", 500,000-plus installs) for running an existing store from a phone. A second Google Play listing, "Salla | sala" (package com.faya.sala), markets itself as a cross-store consumer shopping app, but its developer field reads "Faya Dev Ltd" (a UK-registered entity) with only 100-plus downloads -- this corpus cannot confirm whether that listing is an official Salla-operated app, an authorized white-label build, or an unrelated third party trading on the Salla name, so it is treated as an open brand-attribution question rather than a confirmed first-party asset.


    Layered on top of this merchant-facing suite is a third-party App Store (apps.salla.sa) and a Partners Portal (docs.salla.dev / salla.partners) that let external developers list paid "Private" or "Public" apps and build custom integrations -- the same ecosystem quantified in this report''s Financials chapter. A real, if modest, external tooling layer backs that ecosystem: Salla publishes five distinct packages under the `@salla.sa` scope on npm (a CLI, a base UI kit, a web-component library, a Tailwind theme, and an Apple Pay SDK), and a search of the public npm registry for "salla" returns 53 total packages, including at least one independent community-built package (an n8n workflow-automation node) that is not part of Salla''s own scope -- evidence that outside developers invest engineering effort in Salla integrations beyond what Salla itself ships.'
