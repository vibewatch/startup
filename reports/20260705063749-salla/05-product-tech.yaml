      - docs.salla.dev / salla.partners
      outputs:
      - Paid third-party apps, custom integrations
    - label: Platform API layer
      detail: Merchant REST API secured by OAuth 2.0, webhooks, and a serverless App Functions layer
      tone: neutral
      modules:
      - REST API
      - OAuth 2.0
      - Webhooks
      - App Functions
      outputs:
      - Programmatic access, event notifications, custom app logic
    - label: Developer tooling layer
      detail: Official CLI and theming SDKs, plus organic third-party open-source projects
      tone: neutral
      modules:
      - '@salla.sa/cli'
      - '@salla.sa/twilight (+components, +tailwind-theme)'
      - Third-party Python/Node/Telegram/MCP projects
      outputs:
      - Local app/theme development, unofficial integrations
    - label: Trust and compliance layer
      detail: Company-claimed fraud detection, 3D Secure, PCI DSS, and ZATCA e-invoicing integration; no independent certification found
      tone: warning
      modules:
      - AI fraud detection (claimed)
      - 3D Secure (claimed)
      - PCI DSS (claimed)
      - ZATCA integration (claimed)
      outputs:
      - Claimed transaction security and tax compliance
