- id: milestones-partnerships-and-caution-flags
  title: Milestones, partnerships, and caution flags
  body: 'Salla''s public milestone record runs from its 2016 founding through a steady cadence of payments, logistics, and marketplace partnerships rather than dramatic product pivots. Early milestones include the 2018 seed round and 2019-era Series A; the company then added merchant-facing buy-now-pay-later via a Tamara partnership (enabling more than 10,000 merchants to offer installment payments at no extra merchant fee, per MAGNiTT) and, per Salla''s own help-center documentation, an integration for BNPL provider Tabby as an additional checkout option. In 2024, Arab News'' "Startups of the Year" profile documents three concurrent moves: the $130 million pre-IPO round, an analytics/attribution integration with Adjust for Salla''s native mobile-app builder, and a payments partnership with STC Bank (Saudi Arabia''s first licensed digital bank) to add digital-bank checkout across Salla-powered stores. The same Arab News piece names Riyadh-based Zid as a fellow "Startup of the Year" and a direct category peer, which is useful context for the Competitors chapter. Salla''s "4.0" platform relaunch, covered in a 2026 Tap Payments partner blog, bundled a new dashboard, 120+ merchant tools, in-house "Salla Ads" placements across Google/YouTube/TikTok/Snapchat, and a Tap Payments processing partnership. Caution flags for this chapter are primarily about disclosure gaps rather than adverse events: no lawsuit, regulatory sanction, or leadership departure surfaced in this research; the material gaps are the absence of a public valuation, board roster, audited financials, and a single reconciled scale metric, all of which are logged as evidence gaps below rather than assumed.'
