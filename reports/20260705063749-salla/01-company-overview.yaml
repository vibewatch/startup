- id: leadership-governance-and-conflicting-scale-claims
  title: Leadership, governance, and conflicting scale claims
  body: 'Public leadership disclosure for Salla is thin relative to its funding profile. Nawaf Hariri (CEO, co-founder) and Salman Butt (COO, co-founder) are the only two named executives that recur across independent sources; Investcorp''s board seat for Robin Mansour is the only named non-founder governance detail this research surfaced, and no source in this corpus discloses a full board roster, committee structure, or additional C-suite names, which is itself a notable disclosure gap for a company that has raised a $130 million institutional round. Scale metrics are where sources diverge most sharply, and the divergence looks like a genuine metric-definition conflict rather than simple error. Tap Payments'' 2026 partner blog cites "over 68,000" online stores; Salla''s own bilingual partner portal (salla.partners) independently displays "+67,000" and "+68,000" active-store counters and a developer-facing page on the same domain cites "over 60,000" merchants reachable through the App Store; the DevPortal Awards 2025 nomination for Salla''s developer portal also uses "over 60,000" stores and a "7,000+" partner-developer community. March 2024 round-announcement coverage (Wamda, AGBI, Decypha, Code & Co.) states Salla has enabled $7 billion in e-commerce sales since 2020 across "over 80 thousand active merchants," while Investcorp''s own portfolio page for Salla states a higher $10 billion in enabled sales and "over 100 thousand active merchants" -- a materially larger figure from the same lead investor, published on a different page than the funding announcement. Independent technographic tracker StoreLeads counted only 22,342 live Salla-powered storefronts as of its 2026 report, following a sharp technical-detection drop in 2025 and partial rebound into 2026. Aggregator GetLatka, updated September 2025, adds a fourth, contradictory data point: it describes Salla as "bootstrapped...with no outside investment to date" and reports 843 employees, which directly conflicts with the STV/Investcorp funding history documented above and should be treated as an aggregator data-quality flag rather than a corroborating source on funding status. Given this spread, the chapter does not adopt one canonical merchant or GMV figure; later chapters should cite the specific source and vintage for any Salla scale claim rather than a single number.'
