- id: funding-history-investors-valuation
  title: Funding history, investors, and valuation signals
  body: 'Salla''s funding chronology is reported consistently across investor and press sources even though a public cap table and valuation mark are not disclosed. MAGNiTT and MENAbytes both report an $8.5 million Series A round led by STV with participation from existing seed backers Vision Ventures and Raed Ventures; MENAbytes additionally reports an earlier, undisclosed-amount seed round from Vision Ventures and Raed Ventures in 2018. STV''s own investment blog frames its Series A thesis as a bet on "software-enabled e-commerce" in Saudi Arabia and the wider MENA region, and a later STV blog post ("STV Doubles Down on Salla") describes a follow-on growth investment ahead of 2024, again without disclosing an amount. The best-evidenced and most recent event is the March 2024 pre-IPO round: Investcorp, through its Investcorp Saudi Pre-IPO Growth Fund LP, led a $130 million investment alongside Sanabil Investment (a wholly owned Public Investment Fund company) and existing shareholder STV. Wamda, AGBI, Decypha (Mubasher), AbsoluteGeeks, and Investcorp''s own press release all corroborate the $130 million figure, the three named investors, and the addition of Investcorp Principal Robin Mansour to Salla''s board. Code & Co., a technology due-diligence vendor, separately confirms it ran tech-and-product due diligence for Investcorp ahead of the round, which is a useful independent signal that institutional diligence occurred even though its findings are not public. No source in this corpus discloses a resulting valuation for the March 2024 round, a completed IPO filing, or a public capitalization table, so this chapter treats Salla''s valuation as undisclosed rather than inferring one from deal size alone.'
