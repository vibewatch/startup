  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: valuation-and-cap-table
    missingEvidence: A disclosed post-money valuation for the March 2024 pre-IPO round, and any current capitalization table showing founder versus investor ownership.
    whyItMatters: Without a valuation mark, later Financials and Valuation chapters cannot benchmark Salla against public or private comparables with confidence.
    diligencePath: Request the Investcorp/Sanabil/STV round term sheet or a recent 409A-equivalent valuation directly from the company or its investors.
    relatedQuestionRefs:
    - QO007
    - QO024
    relatedTableRefs:
    - TO001
    - TO003
  - type: conflicting-data
    severity: material
    topic: merchant-and-gmv-scale-conflict
    missingEvidence: A single, reconciled definition and count of active merchants / live stores and cumulative GMV, ideally audited or independently verified.
    whyItMatters: Public figures range from 22,342 (StoreLeads) to 100,000+ (Investcorp), a nearly 5x spread that materially affects any revenue or market-share estimate in later chapters.
    diligencePath: Request Salla's internal merchant-activity dashboard definitions (e.g., "active" merchant criteria) and reconcile against StoreLeads' technographic detection methodology.
    relatedQuestionRefs:
    - QO008
    - QO009
    - QO021
    relatedTableRefs:
    - TO001
  - type: missing-source
    severity: material
    topic: governance-and-board-disclosure
    missingEvidence: A full board roster, committee structure, and named executives beyond the CEO, COO, and one investor-nominated board seat.
    whyItMatters: Governance concentration and board independence are core diligence issues ahead of any future IPO.
    diligencePath: Request the current board deck, org chart, and executive biographies from Salla or its lead investors.
    relatedQuestionRefs:
    - QO004
    relatedTableRefs:
    - TO002
  - type: stale
    severity: minor
    topic: ipo-timeline
    missingEvidence: Any confirmed IPO filing, listing venue, or timetable following the March 2024 pre-IPO round's stated ambitions.
    whyItMatters: Investcorp's public language ("potential future listing") signals intent but not commitment; conflating the two would overstate near-term liquidity prospects.
    diligencePath: Monitor Tadawul (Saudi Exchange) filings and Investcorp investor communications for a formal listing announcement.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO004
  - type: missing-source
    severity: minor
    topic: headcount-disclosure
    missingEvidence: A verified, current employee headcount for Salla; GetLatka's aggregator profile states 843 employees but this conflicts with the "bootstrapped" claim in the same profile and is not corroborated by any primary Salla or investor source.
    whyItMatters: Headcount is a common proxy for organizational scale and burn rate; an unverified figure from a single, internally-inconsistent aggregator should not be treated as authoritative in later Financials chapter work.
    diligencePath: Request current headcount directly from Salla's investor relations or corporate communications team, or cross-check via LinkedIn company-page employee counts at a future refresh.
    relatedQuestionRefs:
    - QO011
    relatedTableRefs:
    - TO001
