  evidenceGaps:
  - type: missing-source
    severity: material
    topic: subscription-pricing-gap
    missingEvidence: A published price card, tier names, or feature boundaries for Salla's own core store-subscription product.
    whyItMatters: Without a price card, no ARPU, revenue mix, or realized-versus-list-pricing comparison can be constructed for Salla's largest presumed revenue stream.
    diligencePath: Request Salla's current KSA and regional price card directly from the company, or locate an archived/cached version of its pricing page.
    relatedQuestionRefs:
    - QI002
  - type: missing-source
    severity: minor
    topic: bnpl-fee-disclosure-gap
    missingEvidence: A disclosed referral fee, revenue-share percentage, or commercial term between Salla and its Tabby or Tamara BNPL partners.
    whyItMatters: BNPL partnerships are a named monetization-adjacent mechanism, but without fee terms this chapter cannot size their contribution to Salla's economics.
    diligencePath: Request the commercial terms of Salla's Tabby and Tamara integration agreements directly from Salla or the BNPL providers.
    relatedQuestionRefs:
    - QI006
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency-gap
    missingEvidence: Any sales-cycle, CAC, payback, net revenue retention, or churn figure for Salla's merchant or partner-developer acquisition.
    whyItMatters: These are the standard proxies for judging go-to-market efficiency, and their complete absence prevents any sales-efficiency conclusion beyond ecosystem-scale signals.
    diligencePath: Request cohort-level acquisition, retention, and marketing-spend data from Salla's finance or growth team.
    relatedQuestionRefs:
    - QI011
  - type: access-blocked
    severity: minor
    topic: zatca-compliance-status-gap
    missingEvidence: A direct statement, from Salla or an independent auditor, confirming Salla's own platform is ZATCA e-invoicing compliant.
    whyItMatters: ZATCA compliance is mandatory for Saudi taxpayers; without an explicit confirmation, this chapter can describe the regulatory obligation but not verify Salla's own compliance status.
    diligencePath: Request a ZATCA compliance attestation or certification directly from Salla, or search ZATCA's own compliant-solution provider registry for Salla's listing.
    relatedQuestionRefs:
    - QI015
  - type: missing-source
    severity: blocking
    topic: capital-adequacy-disclosure-gap
    missingEvidence: Salla's current cash balance, monthly burn rate, and runway in months.
    whyItMatters: Without cash, burn, and runway data, this chapter cannot assess Salla's near-term financing need or dependence on a future capital raise, which is a core financial-diligence blocker.
    diligencePath: Request the latest balance sheet and cash-flow statement, or an investor-reported cash position, directly from Salla or its board-level investors.
    relatedQuestionRefs:
    - QI020
  - type: conflicting-data
    severity: material
    topic: scale-metric-conflict
    missingEvidence: A single, reconciled definition and count of Salla's "active merchant" or "live store" metric across StoreLeads, Tap Payments, Entrepreneur ME, and Investcorp's own two disclosures.
    whyItMatters: The roughly 3x-to-5x spread across these sources undermines confidence in any per-merchant revenue or take-rate estimate built on top of them.
    diligencePath: Request Salla's internal "active merchant" definition and methodology, and reconcile it against StoreLeads' technographic detection criteria.
    relatedQuestionRefs:
    - QI016
