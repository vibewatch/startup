callouts:
- calloutType: risk
  title: Revenue and margin are entirely undisclosed
  body: No reviewed source -- company, investor, aggregator, or press -- discloses Salla's annual revenue, ARR, gross margin, cash position, or burn rate. Every quantitative traction figure in this chapter is a GMV-style "enabled sales" or active-merchant count, not a revenue or profitability figure, which materially limits how confidently any valuation or financial-health judgment about Salla can be made.
  claimRefs:
  - CI008
  - CI036
- calloutType: assumption
  title: The 30% App Store take-rate is inferred, not disclosed
  body: This chapter's only numeric take-rate estimate (roughly 30%, from SAR 4,130 net of an implied SAR 5,900 gross at 100 subscriptions x SAR 59) is arithmetically derived from a single illustrative marketing example on Salla's own partner site, not a stated or audited blended take-rate. Treat any downstream use of this figure as a rough directional signal only.
  claimRefs:
  - CI004
