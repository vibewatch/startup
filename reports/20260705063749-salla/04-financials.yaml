chapter:
  number: 4
  title: Financials
  summary: Salla discloses a broad set of monetization surfaces -- tiered store subscriptions, a third-party app marketplace, native payment/BNPL integrations, and a partner-referral program -- but no reviewed source discloses Salla's own subscription price card, annual revenue, gross margin, cash position, or burn rate. Public traction is measured almost entirely in GMV-style "enabled sales" figures ($7 billion to $10 billion since 2020, depending on source and vintage) rather than audited revenue, and a single worked App Store earnings example implies roughly a 30% marketplace take-rate that is not stated outright. The company's only disclosed capital event is the $130 million pre-IPO round led by Investcorp in March 2024, structured through a fund explicitly named for pre-listing growth capital, which this chapter reads as a signal -- not a confirmation -- of an eventual public listing. Absent revenue, margin, and balance-sheet data, this chapter can describe Salla's revenue architecture and public traction signals but cannot underwrite its unit economics or capital adequacy with confidence.
sections:
- id: revenue-model-and-mix
  title: 'Revenue streams, pricing, and mix: broad monetization surface, opaque pricing'
  body: 'Salla monetizes through at least five distinct mechanisms rather than a single list price. Its own help-center documentation confirms tiered "store plans" with subscriptions, invoices, and upgrade paths, but no reviewed source discloses the specific tier names, prices, or feature boundaries of that core subscription product -- the single largest gap in this chapter''s revenue-model picture. Salla''s partner-ecosystem site separately discloses two additional, more concrete monetization mechanics: a referral program that pays a commission on a referred merchant''s subscription sales for 24 months, and an App Store where third-party developers list paid "Private" or "Public" apps; a worked example on that same page shows a developer earning an estimated SAR 4,130 when an app is subscribed to 100 times at SAR 59 per subscription, which arithmetically implies Salla retains roughly 30% of gross app-subscription revenue as a platform fee, though Salla never states that percentage directly. Salla also natively integrates Tabby and, per MAGNiTT''s 2023 coverage, partnered with Tamara to extend buy-now-pay-later checkout to over 10,000 stores; no source discloses whether Salla earns a referral fee or revenue share from either BNPL provider.


    The clearest public traction figures are GMV-style, not revenue-style. Investcorp''s own funding-announcement press release and STV''s "doubling down" blog post both state that Salla has enabled $7 billion in e-commerce sales since 2020 across roughly 80,000 active merchants, while Investcorp''s separate portfolio page for the same company states a materially higher $10 billion enabled since 2020 across 100,000-plus active merchants -- the same lead investor publishing two different scale figures on two different pages. Entrepreneur Middle East''s independent profile adds a third data point of over 55,000 merchants and SAR 21 billion in cumulative sales. None of these figures is a revenue or take-rate number: they describe transaction volume flowing across Salla-hosted storefronts, not what Salla itself collects from subscriptions, app-store commissions, or payment integrations. By contrast, Shopify''s FY2024 SEC Form 10-K discloses an audited $8.9 billion in total revenue (+26% year over year) on $292.3 billion of GMV -- a directly comparable revenue/GMV pair that has no equivalent anywhere in the Salla corpus, underscoring how much less financially transparent Salla is than its largest global peer.'
