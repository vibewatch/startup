- id: gtm-and-unit-economics
  title: 'GTM motion and unit economics: strong ecosystem signals, no cohort data'
  body: 'Salla''s go-to-market motion blends self-serve merchant sign-up with a large third-party partner and developer channel. The partner-ecosystem homepage advertises "+67,000" to "+68,000" active stores and over 1,000 verified partners, while the linked Apps page separately claims over 500 registered app developers reaching over 60,000 merchants -- Salla-sourced figures that sit inside the wider 55,000-to-100,000-plus range disclosed by third parties and investors. This partner channel is structurally similar to Shopify''s app-and-partner ecosystem, though far smaller in absolute terms: Shopify''s own partner page states it paid partners $1.3 billion in 2025 alone, roughly two orders of magnitude more than anything implied by Salla''s disclosed partner-earnings example. Salla''s developer documentation (a Merchant REST API, OAuth 2.0, a Twilight theming SDK, webhooks, and a serverless "App Functions" layer) supports this channel by letting agencies and freelance developers build and monetize integrations without requiring direct Salla sales-team involvement, which is a plausible low-CAC growth lever, though no source quantifies its contribution to net merchant additions.


    Beyond ecosystem scale, no reviewed source provides a sales cycle, CAC, payback period, net revenue retention, or churn figure for Salla at either the merchant or the partner-developer level. The only quantitative unit-economics anchor this chapter can construct is the App Store''s single worked earnings example (SAR 4,130 net of an implied SAR 5,900 gross at 100 subscriptions x SAR 59), which is illustrative marketing content rather than an audited or even a company-stated blended take-rate; it should be treated as a directional signal, not a metric. GetLatka''s aggregator profile, last updated September 2025, states plainly that it has no revenue information for Salla and reports 843 employees as of that date -- the only public headcount figure in this corpus -- but because GetLatka also incorrectly describes Salla as "bootstrapped...with no outside investment to date," directly contradicting the well-documented STV and Investcorp funding history, this headcount figure itself should be treated with caution rather than as a clean revenue-per-employee denominator.'
