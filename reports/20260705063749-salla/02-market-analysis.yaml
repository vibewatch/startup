  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market-size-estimate-conflict
    missingEvidence: A single, reconciled Saudi Arabia e-commerce market-size figure; Mordor Intelligence and ResearchAndMarkets differ by roughly 50% for adjacent years with no disclosed methodology bridge.
    whyItMatters: Any downstream Financials or Valuation chapter TAM-based benchmarking will produce materially different results depending on which publisher's estimate is used.
    diligencePath: Commission or obtain a primary GASTAT or SAMA e-commerce-specific GMV series, since GASTAT's public releases to date cover the ICT sector broadly rather than e-commerce GMV specifically.
    relatedQuestionRefs:
    - QM001
    - QM027
    relatedTableRefs:
    - TM002
  - type: enumeration-incomplete
    severity: material
    topic: salla-specific-som
    missingEvidence: A dollar-denominated, Salla-specific serviceable obtainable market (SOM) figure; the only platform-share data available (Aftership) measures a small technographic panel by store count, not GMV or revenue.
    whyItMatters: Without a defensible SOM, later Financials and Valuation chapters cannot benchmark Salla's revenue potential against the broader market with confidence.
    diligencePath: Request Salla's own GMV-per-merchant or take-rate data from the company or its investors to convert the store-count-based SOM proxy into a dollar figure.
    relatedQuestionRefs:
    - QM006
    - QM018
    relatedTableRefs:
