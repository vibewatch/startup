tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment/category
  - Included spend
  - Excluded spend
  - Buyer/payer
  - Relevance to Salla
  rows:
  - - B2C retail e-commerce (physical goods)
    - Online sales of physical goods to individual consumers via storefronts, apps, or marketplaces
    - Digital services, media downloads/streams, B2B wholesale, C2C/reCommerce (Statista definition)
    - Consumer end-payer; SME/brand merchant as seller
    - Core addressable market for Salla's SaaS storefronts
  - - B2B e-commerce / wholesale digital trade
    - Business-buyer digital purchase-order and invoice-financing transactions
    - Traditional offline wholesale distribution, informal cash trade
    - Business buyer as payer; SME/manufacturer as seller
    - Fast-growing adjacent segment (13.45% CAGR) that Salla and Zid are beginning to court via B2B portal features
  - - Payments/BNPL processing volume (Mada network)
    - Value of e-commerce transactions settled via card, wallet, or BNPL rails
    - Cash-on-delivery and offline card-present retail transactions
    - Consumer as payer; merchant/PSP as fee recipient
    - Adjacent enabling layer; a proxy for transaction activity, not the same quantity as GMV
  - - ICT sector revenue (broader digital economy)
    - Telecom, cloud, software, and hardware revenue across the whole economy
    - Non-digital retail and non-ICT services
    - Enterprises and consumers as payers across many sub-sectors
    - Broader macro context (GASTAT, trade.gov) that is NOT interchangeable with e-commerce GMV despite frequent press conflation
  - - Marketplace-only selling (Amazon.sa, noon)
    - Consumer purchases made directly on third-party marketplaces
    - Sales made via a merchant's own SaaS-hosted storefront
    - Consumer as payer; marketplace platform takes commission
    - Key status-quo substitute/competing distribution channel for merchants who could otherwise use Salla
  - - Offline/in-person retail
    - Brick-and-mortar point-of-sale transactions
    - All online transaction types above
    - Consumer as payer; retailer as seller
    - Baseline status quo that Salla's product exists to convert into online spend
  notes: Boundary follows Statista's published B2C e-commerce definition; Mada processing volume and ICT-sector revenue are shown for adjacency context and are explicitly excluded from the e-commerce GMV figures used elsewhere in this chapter.
