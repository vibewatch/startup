    severity: minor
    topic: digital-population-revision
    missingEvidence: An explanation for why DataReportal's internet-user and population figures fell between the 2024 and 2025 editions despite a stated constant 99.0% penetration rate.
    whyItMatters: A large, unexplained revision in a headline macro indicator undermines confidence in using DataReportal figures as a stable denominator for market-penetration analysis.
    diligencePath: Consult DataReportal's methodology notes or the underlying UN/ITU population and internet-use datasets directly to determine whether this is a base-year revision or a genuine decline.
