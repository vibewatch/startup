- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver/constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - 99% internet penetration and 78% 5G coverage
    - driver
    - short-to-medium term (0-4 years)
    - Removes access friction and supports the mobile-first checkout flows Salla depends on
    - Confirm whether 5G coverage claims include rural/Tier-2 regions where last-mile costs remain high
  - - Mada cash-to-card shift ($52.6B processed 2024, +25.8% YoY)
    - driver
    - short term (<=2 years)
    - Expands the addressable card/wallet payer base for Salla-connected merchants
    - Request Salla-specific payment-mix data (cash-on-delivery vs. card/wallet share) to confirm pass-through of this national trend
  - - Monsha'at SME digitization subsidies (SAR 800M, 824 SMEs)
    - driver
    - medium term (2-4 years)
    - Directly subsidizes onboarding onto platforms such as Salla and Zid, lowering merchant acquisition cost
    - Determine what share of Salla's disclosed merchant base originated from Monsha'at-referred SMEs
  - - Vision 2030 SME GDP-share target (35%)
    - driver
    - long term (>=4 years)
    - Sustained policy tailwind for SME digitization and, by extension, SaaS storefront adoption
    - Track whether the 35% target and associated funding commitments are reaffirmed in future budget cycles
  - - Gen-Z social-commerce and BNPL uptake
    - driver
    - short-to-medium term
    - Raises average order value and cross-sell via integrated fintech partners (Tamara, Tabby)
    - Obtain Salla-specific BNPL attach-rate and AOV-lift data rather than relying on category-wide estimates
  - - High last-mile delivery costs outside metro corridors
    - constraint
    - ongoing
    - Compresses SME merchant margins and slows adoption in rural/Tier-2 markets
    - Assess whether Salla's logistics-partner integrations materially reduce last-mile cost for non-metro merchants
  - - PDPL data-localization and cybersecurity compliance overhead
    - constraint
    - ongoing, tightening
    - Raises platform operating cost and can deter foreign SaaS entrants, indirectly benefiting Saudi-domiciled incumbents like Salla
    - Confirm Salla's own PDPL/NCA compliance posture and whether it markets compliance as a switching-cost moat
  - - GAC's 2024 enforcement uptick (459 investigations; scrutiny of exclusivity/RPM clauses)
    - constraint
    - near term (already active)
    - Could constrain SaaS platform terms that bundle payments/logistics exclusively, a common enablement-platform practice
    - Review Salla's merchant terms of service for exclusivity clauses that could draw GAC scrutiny
  - - Cross-border return-logistics complexity
    - constraint
    - ongoing
    - Limits international/marketplace-adjacent growth relative to domestic-only commerce
    - Evaluate whether Salla merchants selling cross-border face materially higher return rates or costs
  - - Corporate tax/VAT/zakat compliance burden for platforms and merchants
    - constraint
    - ongoing
    - Adds compliance overhead that SaaS platforms must absorb or pass through (e.g., ZATCA e-invoicing integration)
    - Confirm whether Salla provides native ZATCA e-invoicing compliance tooling as a merchant retention lever
  notes: Direction and timing are analyst judgments grounded in the cited sources' own driver/restraint framing (Mordor Intelligence) and regulatory guides (trade.gov, Bremer); none are Salla-specific disclosures unless stated.
