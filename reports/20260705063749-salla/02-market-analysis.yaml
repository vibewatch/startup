- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Buyer
  - User
  - Payer
  - Workflow
  - Budget owner
  - Adoption trigger
  rows:
  - - SME retail merchant (B2C)
    - Store owner/founder
    - Consumer shopper
    - Consumer pays for goods; merchant pays the SaaS subscription
    - Merchant signs up for Salla, builds a storefront, lists products, receives orders
    - Merchant's own working capital or a Monsha'at subsidy
    - Desire to sell online without hiring developers
  - - B2B wholesale merchant
    - Business owner/sales manager
    - Corporate buyer/procurement staff
    - Buyer pays on invoice/30-day terms; merchant pays SaaS and financing fees
    - Merchant lists a tiered catalog; buyer requests credit terms via a B2B portal
    - Merchant's treasury; buyer's procurement budget
    - Need for digital purchase-order and invoice-financing workflows
  - - Enterprise/large retail brand
    - Brand's e-commerce or digital-transformation lead
    - Consumer shopper (mass market)
    - Consumer pays; brand pays for an enterprise-tier subscription and custom integrations
    - Brand migrates from a legacy platform or launches a new DTC channel on Salla
    - Brand's marketing/IT budget
    - Need for higher-volume, higher-SLA storefront infrastructure
  - - Government-linked SME digitization cohort (Monsha'at)
    - Program administrator
    - Beneficiary SME and its customers
    - Monsha'at subsidizes onboarding; SME pays the ongoing subscription after the program period
    - SME enrolls in a Monsha'at digitization track and is directed to a certified platform (Salla or Zid)
    - Monsha'at (government) budget, SAR 800 million program
    - Policy mandate to raise SME GDP contribution toward Vision 2030's 35% target
  - - Marketplace-only seller (status-quo alternative)
    - Individual seller
    - Consumer shopper
    - Consumer pays; seller pays the marketplace commission (no Salla involvement)
    - Seller lists directly on Amazon.sa or noon without an owned storefront
    - Seller's own funds; no dedicated SaaS budget
    - 'Switching trigger: desire for owned customer data, branding, and lower long-run commission'
  - - BNPL/fintech-attached shopper
    - N/A (fintech partner enables checkout)
    - Consumer shopper
    - Consumer repays the BNPL provider in installments; merchant absorbs/discounts the BNPL fee
    - Consumer selects Tamara or Tabby at a Salla-storefront checkout
    - Merchant absorbs the BNPL merchant discount rate
    - Desire to raise average order value and reduce cart abandonment
  notes: Rows are grounded in Mordor Intelligence's segment analysis, Monsha'at program disclosures, and Salla's own partner/BNPL integration pages; workflow detail beyond these public disclosures (e.g. exact Monsha'at referral share) is a diligence gap.
