chapter:
  number: 2
  title: Market Analysis
  summary: Salla competes in Saudi Arabia's B2C/B2B online-retail enablement layer, a market independent analysts size very differently -- from a $20.7 billion 2024 GMV estimate (ResearchAndMarkets/BusinessWire) to a $31.29 billion 2026 estimate en route to $54.87 billion by 2031 (Mordor Intelligence) -- while a national payments network alone processed $52.6 billion in e-commerce transactions in 2024. Government programs (Monsha'at SME digitization, Vision 2030's 35% SME-GDP target) and infrastructure (99% internet penetration, Mada cash-to-card migration) are structural demand drivers, but last-mile logistics costs, PDPL compliance overhead, and intensifying competition-authority enforcement are material adoption constraints. This chapter preserves every sizing and platform-share conflict rather than averaging them into one number.
sections:
- id: market-boundary-and-definition
  title: Market boundary, adjacencies, and status-quo substitutes
  body: 'The market Salla addresses is Saudi Arabia''s B2C and, increasingly, B2B online-retail enablement layer: the software, payments, and logistics stack that lets a merchant sell physical goods directly to a buyer over the internet. Statista''s own market-definition notes for its Saudi Arabia eCommerce Market Forecast are explicit about what counts -- physical-goods sales via desktop or mobile digital channels to a private end consumer -- and what does not: digitally distributed services, digital media downloads or streams, B2B wholesale trade, and C2C/reCommerce resale of used or repaired goods. That boundary matters because several adjacent, larger numbers are routinely cited alongside Salla''s market without being the same quantity. Saudi Arabia''s national payments network, Mada, processed $52.6 billion in e-commerce transactions in 2024 (Mordor Intelligence), a figure that includes bill payments and other card-present-adjacent flows beyond retail GMV. GASTAT separately reports SAR 249.8 billion in 2024 operating revenue for the whole Information and Communications Technology sector -- telecom, cloud, and hardware included -- which trade.gov independently sizes at nearly $48 billion for the broader Saudi ICT market. Neither the Mada processing figure nor the ICT-sector revenue figure is interchangeable with e-commerce GMV, even though press coverage sometimes conflates them. Key status-quo substitutes for a Salla storefront include marketplace-only selling on Amazon.sa or noon (commission-based, no owned storefront), direct social-commerce selling via Instagram/WhatsApp without a dedicated checkout, and continued offline point-of-sale retail, which still represents most day-to-day Saudi consumer spending despite 99% internet penetration.'
