figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: A TAM/SAM/SOM view of Salla's addressable market shows a wide gap between the broadest analyst TAM estimate and any measurable SaaS-enablement-specific slice.
  data:
    items:
    - label: TAM -- Saudi Arabia total e-commerce market (2026 est.)
      value: $31.29B
      detail: Mordor Intelligence 2026 estimate; broadest lens across B2C and B2B online retail
    - label: SAM -- B2C online retail addressable via SaaS storefronts
      value: approx. $23.0B
      detail: Derived by applying Mordor's reported 73.54% B2C revenue share (2025) to its 2026 total estimate; an analyst approximation, not a directly published figure
    - label: SOM -- stores served by no-code SaaS enablement platforms (Salla, Zid, and peers)
      value: 44.11% of a ~44.5K-store technographic panel
      detail: Aftership platform-share proxy; expressed as a store-count share, not a dollar figure, because no source discloses a SaaS-specific dollar SOM
  approximationNotes: SAM = 0.7354 x $31.29B (Mordor's 2026 TAM) is approximately $23.0B; this multiplication is an analyst approximation layered onto two separately published Mordor figures, not an independently sourced SAM. SOM is a store-count share drawn from Aftership's smaller technographic detection panel and is not directly convertible to, or summable with, the dollar-denominated TAM/SAM figures above.
  claimRefs:
