- id: market-sizing-multiple-lenses
  title: Market sizing across multiple, conflicting lenses
  body: 'No single source anchors Saudi Arabia''s e-commerce market size, so this chapter carries five separate lenses rather than picking one. ResearchAndMarkets'' Q1 2024 databook (syndicated via BusinessWire) puts 2024 GMV at $20.7 billion, up 10.21% from $18.8 billion in 2023, forecasting an 8.53% CAGR to $28.7 billion by 2028. Mordor Intelligence''s 2026 industry report instead estimates the market at $27.96 billion in 2025 and $31.29 billion in 2026, growing at an 11.92% CAGR to $54.87 billion by 2031 -- roughly 50% higher than ResearchAndMarkets'' contemporaneous estimate for an adjacent year, with neither publisher disclosing enough raw methodology to reconcile the gap. A third, non-GMV lens is Mada''s processed e-commerce transaction volume ($52.6 billion in 2024, +25.8% year over year), which is larger than either GMV estimate because it captures a broader set of card-and-wallet-settled flows. A fourth lens, GASTAT''s ICT-sector revenue (SAR 249.8 billion, 2024), is broader still and not e-commerce-specific. A fifth, global lens from UNCTAD''s Digital Economy Report 2024 puts worldwide e-commerce sales above $27 trillion across 43 economies, situating Saudi Arabia''s market as a small single-digit fraction of the global total. Within Mordor''s framework, B2C held 73.54% of 2025 revenue versus a faster-growing B2B segment (13.45% CAGR); consumer electronics led product categories (27.06% share) while food and beverage grew fastest (13.72% CAGR); and smartphones drove 77.98% of B2C revenue share. Applying Mordor''s 73.54% B2C share to its own 2026 total yields an approximate $23.0 billion B2C-only slice -- an analyst-derived approximation, not a separately published figure.'
