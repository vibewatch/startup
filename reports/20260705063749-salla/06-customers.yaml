- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver / concentration risk
  - Impact
  - Diligence path
  rows:
  - - App Store upsell (apps.salla.sa / salla.partners)
    - Land-and-expand revenue without a core subscription-tier upgrade; documented in the Product & Technology chapter
    - Request Salla's own App Store attach-rate and per-merchant app-spend data
  - - Embedded BNPL (Tamara, Tabby)
    - Expands shopper basket size and merchant revenue; Tamara alone reached 10,000+ merchants per MAGNiTT
    - Request Salla's disclosed BNPL-attributable GMV or take-rate uplift
  - - Per-merchant revenue concentration
    - Appears structurally low given a broad individual/SME/enterprise merchant mix and no single named top customer
    - Request Salla's top-10-merchant revenue share directly, since no public source discloses it
  - - Partner/agency channel concentration
    - Named partners (Radar Agency, ReturnPlus, Cartat) are self-published testimonials with no disclosed relative revenue contribution
    - Request a breakdown of App Store / partner-channel revenue as a share of total Salla revenue
  - - Brand-channel concentration / mobile brand-attribution risk
    - A second "Salla"-branded Google Play consumer app is registered to an unrelated-looking developer (Faya Dev Ltd), an unresolved brand-control question
    - Request Salla's official position on the com.faya.sala listing and any brand-enforcement or licensing relationship
  - - Competitive switching risk (Zid)
    - Independent platform-comparison reviews consistently name Zid as the closest alternative for Saudi merchants considering a switch
    - Request Salla's own merchant-churn-to-competitor data, which is not publicly disclosed
  notes: This table pairs each expansion driver with its mirror-image concentration or dependency risk, following this chapter's mandate to distinguish land-and-expand upside from dependency downside rather than reporting only the positive side.
