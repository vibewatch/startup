callouts:
- calloutType: risk
  title: Salla's scale metrics disagree by up to 5x, now confirmed by two additional independent sources
  body: This chapter's own research found two new analytics sources (AfterShip and Middle East Commerce) whose store-count and market-share figures diverge from each other and from the Company Overview chapter's original StoreLeads/Investcorp/Wamda spread just as sharply -- from roughly 19,600 to over 70,000 stores, and from a 44 percent to a 60-plus percent claimed market share. No source in this corpus reconciles these figures, and diligence should request Salla's own internal store-count and merchant-count definitions directly rather than averaging across public estimates.
  claimRefs:
  - CU010
  - CU011
  - CU012
  - CU013
- calloutType: risk
  title: An unresolved brand-attribution question around a second "Salla"-branded consumer app
  body: A Google Play listing named "Salla | sala" (package com.faya.sala) markets itself as a cross-store consumer shopping app under the Salla brand, but its registered developer is "Faya Dev Ltd," a UK-registered entity unconnected to Salla's own developer account, with only 100-plus downloads. This chapter cannot confirm whether this is an authorized white-label build, a legitimate but separately incorporated affiliate, or an unrelated party trading on the Salla name, and flags it as a brand-integrity diligence item rather than treating it as a confirmed first-party Salla asset.
  claimRefs:
  - CU007
  - CU037
- calloutType: insight
  title: Named customer proof favors self-published partner testimonials over independently verifiable merchant logos
  body: Salla's strongest quantified customer-outcome claims (Radar Agency's SAR 25M+ in client sales, ReturnPlus's "wide segment of merchants" reach) come from Salla's own partners page rather than independent third parties, while the independently checkable named accounts this chapter located (a Trustpilot-named merchant dispute, two named Google Play reviewers) are real but narrow, single-incident data points rather than durable account-level proof. A general search for large, independently confirmed Salla merchant brands did not surface a verifiable match, which this chapter treats as a named-logo evidence gap rather than filling it with unverified claims.
  claimRefs:
  - CU019
  - CU020
  - CU024
  - CU025
