  evidenceGaps:
  - type: missing-metric
    severity: material
    topic: retention-metrics-gap
    missingEvidence: Net revenue retention, gross revenue retention, churn rate, renewal rate, or average contract length for Salla merchant subscribers.
    whyItMatters: Without these figures, this chapter cannot assess the durability of Salla's merchant base beyond point-in-time satisfaction proxies (app ratings, a single independent review), which is a material gap for any investment or acquisition diligence.
    diligencePath: Request cohort-level subscription-renewal and NRR/GRR data directly from Salla or its investors (Investcorp, Sanabil, STV).
    relatedQuestionRefs:
    - QU024
  - type: access-blocked
    severity: minor
    topic: g2-capterra-ratings-gap
    missingEvidence: G2 and Capterra's aggregate review ratings and review-count data for Salla.
    whyItMatters: These are two of the most commonly cited third-party SaaS review aggregators, and their absence leaves this chapter reliant on Trustpilot and Google Play as the only independently checkable satisfaction signals.
    diligencePath: Access G2 and Capterra via an authenticated browser session or a vendor-provided export rather than automated fetch, which both platforms currently block.
    relatedQuestionRefs:
    - QU027
  - type: missing-source
    severity: material
    topic: named-enterprise-merchant-gap
    missingEvidence: A verifiable, independently confirmed named enterprise-tier or large-brand Salla merchant.
    whyItMatters: Without at least one confirmed large or well-known named merchant, this chapter cannot assess whether Salla's "Salla Special" enterprise tier has real adoption at scale or remains a nominal price-list entry. The named-customer-proof table (TU003) is therefore a sample of independently checkable accounts, not a complete or representative census of Salla's merchant base.
    diligencePath: Request a reference-customer list from Salla directly, or search Salla's own case-study content once its bot-protection challenge pages can be bypassed with an authenticated session.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU003
  - type: missing-metric
    severity: material
    topic: top-customer-concentration-gap
    missingEvidence: Salla's top-10-merchant or top-agency-partner revenue concentration as a share of total platform revenue.
    whyItMatters: Even with a broad SME-oriented merchant base, revenue concentration could still be material if a small number of partner agencies or enterprise merchants generate a disproportionate share of Salla's own take-rate revenue.
    diligencePath: Request Salla's internal revenue-concentration breakdown by merchant tier and by partner-agency channel.
    relatedQuestionRefs:
    - QU028
  - type: contradictory-evidence
    severity: material
    topic: scale-metric-conflict-widened
    missingEvidence: A single, reconciled definition of "active store" or "active merchant" that Salla itself uses consistently across its own channels.
    whyItMatters: This chapter's own research found two additional independent sources (AfterShip, Middle East Commerce) whose figures widen, rather than narrow, the scale-metric spread first flagged in the Company Overview chapter, suggesting the conflict is structural rather than a one-off reporting inconsistency.
    diligencePath: Request Salla's own internal, consistently defined store-count and merchant-count figures directly, ideally with a live dashboard export rather than a marketing statistic.
    relatedQuestionRefs:
    - QU011
    - QU013
    - QU015
  - type: access-blocked
    severity: minor
    topic: brand-attribution-gap
    missingEvidence: Confirmation of the relationship (if any) between Salla and the "Faya Dev Ltd"-registered Google Play app using the Salla name.
    whyItMatters: An unresolved brand-attribution question on a public app-distribution channel is a reputational and channel-control risk that this chapter cannot close without a direct company response.
    diligencePath: Request Salla's official position on the com.faya.sala listing, including whether it is licensed, affiliated, or unauthorized.
    relatedQuestionRefs:
    - QU007
