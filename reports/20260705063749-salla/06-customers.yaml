tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer/user/payer role
  - Use case
  - Scale / revenue band
  - Strategic value
  - Evidence gap
  rows:
  - - Individual / home-based merchants
    - Payer and primary platform user
    - Launch a first store, often via the free Basic tier, per Salla Academy''s beginner course catalog
    - Free tier or low-end Plus tier (~SAR 99/month)
    - High volume, low average revenue per account; core top-of-funnel segment
    - No disclosed count of Basic-tier-only (non-paying) accounts versus paying accounts
  - - SME and traditional-retail merchants
    - Payer and platform user
    - Run an established, growing store with multiple staff accounts and marketing tools
    - Plus/Pro tiers (SAR 99-299/month)
    - Described by Salla''s CEO as a core constituency alongside individuals and enterprises
    - No disclosed average revenue per merchant or tier-mix breakdown
  - - Well-established enterprise brands
    - Payer and platform user
    - Custom, high-volume storefront operations
    - Custom-priced Salla Special tier
    - Highest strategic value per account if real, but no named enterprise account is independently confirmed
    - No independent source names a specific enterprise-tier merchant by name
  - - End shoppers / consumers
    - Buyer (non-paying to Salla directly)
    - Purchase from Salla-hosted storefronts using mada, Apple Pay, Tabby, or Tamara
    - N/A (transaction-based, not subscription-based)
    - Indirect revenue driver via merchant payment-processing and BNPL fee share
    - No disclosed shopper count, repeat-purchase rate, or basket-size data
  - - Ecosystem partners (app developers and marketing/logistics agencies)
    - Builds on and resells through Salla''s platform; itself a quoted "customer" of Salla''s partner program
    - List apps in the App Store or deliver services to Salla merchants
    - Revenue share or subscription to Salla''s Partners Portal, not separately disclosed
    - Expands Salla''s functional surface without Salla building every feature itself
    - No disclosed partner count, revenue share, or partner-level churn
  notes: Segment boundaries are drawn from Salla''s own plan-pricing content, CEO commentary reported by Entrepreneur Middle East, and Salla Academy''s public course catalog; no source publishes a formal segment-by-segment revenue or account-count breakdown, so the "scale / revenue band" column is qualitative rather than quantified.
