- id: retention-durability-and-satisfaction-signals
  title: 'Retention and satisfaction: no disclosed NRR/GRR/churn, but review-platform and app-store signals point in different directions'
  body: 'No source reviewed for this chapter -- official, investor, or independent -- discloses net revenue retention, gross revenue retention, churn, renewal rate, or contract length for Salla merchants; this chapter converts that absence into an explicit evidence gap rather than an estimate. The available proxy signals are mixed and measure different things. Salla''s official merchant-management app on Google Play holds a 3.3-out-of-5 rating across roughly 5,800 reviews with 500,000-plus installs -- a middling but review-rich signal specifically about merchants'' day-to-day tool experience. Trustpilot''s aggregate rating for the salla.sa domain is far lower: "Bad," 1.7 out of 5 across 21 reviews, dominated by buyer complaints about scam-adjacent stores and weak dispute mediation rather than complaints about Salla''s own software -- a distinct signal about buyer trust in the marketplace, not merchant satisfaction with the SaaS product. An independent merchant-side review (ZatcaHub, previously cited in the Financials and Product & Technology chapters) corroborates fast Arabic-first setup and strong local-payment integration as durability drivers, while also documenting a smaller plugin ecosystem than Shopify''s and thin free-tier analytics as friction points that could work against long-run retention for growing merchants. This chapter could not independently fetch G2 or Capterra review-aggregator pages, which return JavaScript-only content to automated retrieval; their headline ratings are logged as an access-blocked evidence gap rather than cited secondhand.'
