- id: named-customer-and-partner-proof
  title: 'Named customer proof: real but self-published partner testimonials, plus individually named app-store and review accounts'
  body: 'Direct, independently verifiable named-customer case studies for Salla are scarce; a general web search for specific major-brand names (large fragrance and retail chains sometimes associated with Salla in secondary commentary) did not independently confirm those brands as Salla merchants, and this chapter excludes unverified brand claims rather than repeating them. What is independently checkable is a smaller set of individually named accounts. Salla''s own partners homepage names specific ecosystem-partner testimonials with quantified outcomes: Radar Agency''s founder states the agency helped its client merchants reach sales exceeding SAR 25 million and more than 50 million impressions "with support and empowerment from the Salla platform," and named representatives of the ReturnPlus and Cartat apps describe reaching "a wide segment of merchants" through Salla''s App Store -- self-published testimonials, so treated as company-confirming rather than independent proof. Independently, a Trustpilot review thread for the salla.sa domain names a specific merchant, "alnasser sports," in a review describing "terrible service" but ultimately resolved through Salla''s complaint process, which independently corroborates that Salla''s official complaints system (documented on Salla''s own help-center pages) functions in at least one concrete case. Separately, two individually named Google Play reviewers of Salla''s merchant-management app -- Hend AlKadhi and Hassan Almadlouh -- describe specific, dated production-usage problems (a missing order-verification code and a post-update login lockout), which are useful as named, dated, production (not pilot) usage evidence even though neither reviewer discloses store size or vertical.'
