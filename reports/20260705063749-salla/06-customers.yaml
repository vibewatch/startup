company:
  name: Salla
chapter:
  number: 6
  title: Customers
  summary: Salla's paying customers are Saudi and GCC merchants who subscribe across a free Basic tier and paid Plus/Pro/Special tiers, while the platform's shoppers are the end consumers who buy from those merchant storefronts. Every public scale metric for this base -- store count, GMV, and merchant count -- conflicts across official, investor, and independent sources (roughly 19,600 to 100,000-plus stores/merchants, and SAR21 billion to $10 billion in cumulative sales), so this chapter treats scale as a disclosed metric-definition conflict rather than a single number. Named customer proof is real but thin -- Salla's own partner-testimonial page names specific agencies and app developers with quantified outcomes, and one independent merchant-side review and several individually named app-store and review-site accounts corroborate both strengths (fast Arabic-first setup, local payments) and adverse findings (weak buyer-protection mediation, a "Bad" 1.7-of-5 Trustpilot score across 21 reviews, and an unresolved brand-attribution question around a second "Salla"-branded consumer app). No source in this corpus discloses NRR, GRR, churn, cohort retention, or named top-customer concentration, so this chapter converts those gaps into explicit diligence asks rather than estimates.
sections:
- id: merchant-and-buyer-segmentation
  title: 'Segmentation: tiered merchant subscribers, a distinct shopper base, and an ecosystem-partner layer'
  body: 'Salla''s customer base separates into three groups that pay, use, or transact through the platform in different ways. The primary payer segment is the merchant: a store owner who subscribes to one of four public plan tiers -- a free "Salla Basic" tier usable for real listings and transactions, paid "Plus" and "Pro" tiers priced from roughly SAR 99 to SAR 299 per month, and a custom-priced "Salla Special" tier for high-volume merchants, per Salla''s own Tap Payments partner content and an independent 2026 platform-comparison review. Salla''s own CEO, quoted in Entrepreneur Middle East, describes this merchant base as spanning "individuals, small and medium brands, and well-established enterprises," and Salla Academy''s public course catalog (business-launch, dropshipping, digital-product, and social-media-marketing tracks aimed at first-time sellers) signals a deliberate focus on solo and home-based entrepreneurs, a segment Saudi commentary repeatedly associates with women-led businesses. A second, non-paying-but-essential segment is the shopper: the end consumer who buys from a Salla-hosted storefront using mada, Apple Pay, or Tabby/Tamara buy-now-pay-later, across more than 15 currencies and shipping to over 79 countries per prior chapters'' sourcing. A third segment sits between these two: ecosystem partners -- app developers and marketing/logistics agencies who build on Salla''s API and are themselves quoted as satisfied "customers" of Salla''s partner program on Salla''s own partners homepage. This three-part structure matters for diligence because retention, satisfaction, and concentration questions are different for each group, and public sources conflate them more often than they distinguish them.'
