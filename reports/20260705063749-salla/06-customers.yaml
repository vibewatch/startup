- id: adoption-trajectory-and-scale-conflict
  title: 'Adoption trajectory: every public scale metric disagrees, and two new sources widen the spread further'
  body: 'This chapter''s own source discovery reproduces and extends the scale-metric conflict flagged in the Company Overview chapter, rather than resolving it. Independent technographic tracker StoreLeads counted 22,342 live Salla storefronts in its 2026 report; e-commerce analytics vendor AfterShip''s regional statistics page, also dated 2026, counts 19,640 Salla-powered stores at a 44.11 percent share of tracked Saudi stores; a lower-reputation statistics blog (Middle East Commerce) claims "more than 70,000 active stores," over 100 million processed orders, and a 60-percent-plus market share for the same period, without disclosing its methodology; and Salla''s own bilingual partner portal and a 2026 Tap Payments-sponsored feature separately cite "over 68,000" stores. On the merchant-count and GMV side, March 2024 funding-round coverage (Wamda and peers) states 80,000-plus active merchants and $7 billion in enabled sales since 2020, while lead investor Investcorp''s own portfolio page states 100,000-plus merchants and $10 billion since 2020 -- a materially larger figure from the same institutional source published on a different page. Salla''s CEO, quoted separately by Entrepreneur Middle East, cites "more than 55,000" individuals and businesses and a lifetime SAR 21 billion in merchant sales, a figure that is denominated differently (lifetime SAR sales versus dated USD GMV) and cannot be reconciled against the other numbers without a shared methodology. This chapter does not pick a winner among these figures; it treats the spread itself -- now confirmed by two additional independent analytics sources beyond the Company Overview chapter''s original set -- as the primary adoption-trajectory finding.'
