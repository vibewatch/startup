- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Metric
  - Value / null
  - Segment
  - Confidence
  - Diligence ask
  rows:
  - - Net revenue retention (NRR)
    - 'null'
    - Merchant subscribers
    - n/a
    - Request Salla's or Investcorp's internal NRR figures directly; no public source discloses this
  - - Gross revenue retention / logo churn
    - 'null'
    - Merchant subscribers
    - n/a
    - Request cohort-level subscription-renewal data from Salla directly
  - - Merchant-app store rating
    - 3.3 / 5 (5,800 reviews, 500K+ installs)
    - Merchants using the mobile management app
    - medium
    - Request a breakdown of 1-star vs. 5-star review themes from Salla or Google Play's backend data
  - - Salla.sa Trustpilot rating
    - 1.7 / 5, rated "Bad" (21 reviews)
    - End shoppers buying from Salla-hosted stores
    - medium
    - Confirm whether this reflects a small, self-selected complainant sample versus a representative shopper-satisfaction measure
  - - Independent merchant-review sentiment (ZatcaHub)
    - Positive on setup speed and local payments; negative on plugin ecosystem depth and free-tier analytics
    - SME merchant evaluating Salla vs. alternatives
    - medium
    - Commission or locate additional independent merchant reviews beyond this single one to test representativeness
  - - G2 / Capterra aggregate ratings
    - 'null (access-blocked in this session)'
    - Merchant subscribers
    - n/a
    - Retrieve G2 and Capterra ratings via a browser session or vendor-provided export rather than automated fetch
  notes: Rows are deliberately left null where no public source discloses a figure, per this chapter's evidence-gap policy; the two populated rating rows measure different populations (merchants using the app vs. shoppers buying from stores) and should not be averaged together.
