figures:
- id: FU001
  title: Customer journey map
  type: journey-map
  layout: wide
  summary: Salla's merchant journey runs from free-tier trial through paid-tier subscription, App Store/BNPL expansion, and (for a subset) a partner-agency-mediated relationship, while a separate, thinner shopper journey runs in parallel.
  data:
    nodes:
    - id: discover
      label: Discover
      detail: Prospective merchants encounter Salla via Academy free courses, Tap Payments partner content, or word-of-mouth in Saudi entrepreneur communities.
      tone: positive
    - id: trial
      label: Free-tier trial
      detail: Salla Basic lets a merchant list real products and accept real payments at zero cost before committing to a paid tier.
      tone: positive
    - id: subscribe
      label: Paid subscription
      detail: A merchant upgrades to Plus, Pro, or the custom-priced Special tier as the store grows past Basic-tier limits.
      tone: neutral
    - id: expand
      label: App Store and BNPL expansion
      detail: Merchants add paid third-party apps and enable Tamara/Tabby BNPL to grow revenue without changing subscription tier.
      tone: positive
    - id: dispute
      label: Buyer dispute / retention risk
      detail: A minority of shopper transactions surface buyer-protection complaints that Salla's complaint system mediates with mixed public sentiment.
      tone: warning
  claimRefs:
  - CU001
  - CU004
  - CU007
  - CU026
  - CU029
  - CU033
