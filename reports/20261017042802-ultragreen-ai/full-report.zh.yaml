figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: UltraGreen 保留的里程碑记录了公司从收购传统 ICG 平台，走向上市、资本更充足的集成式荧光工作流业务。
    data:
      items:
        - date: '2015'
          label: Diagnostic Green 平台组建
          detail: 集团从 Pulsion Medical Systems 收购荧光成像 ICG 业务，成立美国和德国实体，并开始向第三方销售 ICG。
          tone: neutral
        - date: '2016'
          label: Verdye 和 IC-Flow 商业推出
          detail: 公司开始在美国和加拿大以外销售 Verdye；IC-Flow 则完成自我认证并在欧盟获得 CE 标志。
          tone: positive
        - date: '2018'
          label: EMEA 枢纽设立
          detail: Renew Pharmaceuticals Limited 在爱尔兰设立，用于支持营销、销售、监管、供应链和客户支持职能。
          tone: neutral
        - date: '2023'
          label: 美国 ICG 权利及 Perfusion Tech 少数股权
          detail: Renew Pharmaceuticals 收购 IC-GREEN NDA，UltraGreen 还买入 Perfusion Tech 的少数股权。
          tone: positive
        - date: '2024'
          label: 适应症和设备扩展
          detail: 公司获得更多 FDA 和 CE 认可的批准，包括新的 IC-GREEN 适应症，并推出下一代 IC-Flow 2.0 设备。
          tone: positive
        - date: '2025-01-17'
          label: 宣布收购 Perfusion Tech
          detail: UltraGreen 官方网站宣布收购 Perfusion Tech，作为其推进量化的一部分。
          tone: positive
        - date: 2025-06
          label: Perfusion Tech 完全并表
          detail: 2026 年 1 月的分析师材料称，UltraGreen 于 2025 年 6 月收购 Perfusion Tech 剩余股权，使其成为全资子公司。
          tone: positive
        - date: '2025-09-15'
          label: 战略轮完成
          detail: UltraGreen 宣布由 65 Equity Partners 和 Vitruvian 领投的 US$188 million 战略投资，股权估值为 US$1.3 billion。
          tone: positive
        - date: '2026-01-26'
          label: 公开市场分析师首次覆盖
          detail: SGX 托管的 2026 年 1 月报告将 UltraGreen 定位为全球 ICG 龙头，具有高利润率，同时明确提示执行、供应和监管风险。
          tone: neutral
        - date: '2026-04-28'
          label: 独立治理框架
          detail: ICAM 2026 年 4 月的首次覆盖认为，治理考验在于围绕已验证的 ICG 业务进行有纪律的资本配置，而不是让平台偏离方向。
          tone: warning
    claimRefs:
      - CO010
      - CO011
      - CO014
      - CO015
  - id: FM001
    title: 市场规模观察框架
    type: pyramid
    summary: 公开证据支持一条由手术范围、渗透率、区域增长、监管准入和实际商业覆盖组成的采用路径，而不是某个已披露的 TAM/SAM/SOM 漏斗。
    data:
      items:
        - label: 临床范围
          displayValue: 10 named procedure families
          detail: ISFGS 指南覆盖乳腺、结直肠、内分泌、前肠、妇科、肝胆胰、肝脏、儿科、整形和外科肿瘤工作流。
        - label: 美国渗透率缺口
          displayValue: <25% of eligible procedures
          detail: Beansprout 引述 Frost & Sullivan 称，尽管已有临床验证，美国荧光引导手术的渗透仍处于早期。
        - label: APAC 增长视角
          displayValue: 16.6% CAGR (2024-2030)
          detail: 同一分析预计，随着手术量和基础设施增长，亚太将成为增长最快的 ICG 区域。
        - label: APAC 份额变化
          displayValue: ≈9% to 14%
          detail: 同一 2024-2030 时间窗口内，预计该地区在全球 ICG 市场中的份额将提升。
        - label: 监管准备度
          displayValue: 41 Verdye countries / 45 IC-Flow markets
          detail: 2026 年 5 月官方数据显示覆盖范围增长，但 DBS 仍将染料获批视为新 APAC 地区真正的收入门槛。
        - label: 当前变现视角
          displayValue: 10m U.S. procedures vs 670k vials
          detail: ValueZoomer 转述管理层对机会的描述，显示仍有空间，但没有形成可核对的公开 SAM/SOM 模型。
    approximationNotes: 由于指定来源池没有一条可核对的 TAM/SAM/SOM 连接桥，这个金字塔结合了不同的公开分母——手术类别、渗透率、区域份额、获批情况和药瓶用量。
    claimRefs:
      - CM002
      - CM004
      - CM005
      - CM007
      - CM010
      - CM011
  - id: FP001
    title: 按工作流广度和手术嵌入度划分的竞争定位
    type: quadrant
    summary: UltraGreen 在集成工作流广度上得分最高，而替代方案和既有厂商凭借已部署工作流或默认采用，仍保有重要的手术切入点。
    data:
      xAxis:
        label: 工作流集成广度
        min: 1
        max: 5
        lowLabel: Single-layer
        highLabel: Full-stack
        description: 1 = one workflow component; 5 = agent, imaging, software, and data loop combined.
        scale: ordinal
      yAxis:
        label: 手术嵌入度 / 采用杠杆
        min: 1
        max: 5
        lowLabel: Niche
        highLabel: Embedded
        description: 1 = narrow or emerging use; 5 = broad installed base or default workflow presence.
        scale: ordinal
      points:
        - label: UltraGreen 集成平台
          x: 5
          'y': 4
        - label: 区域 ICG 制造商
          x: 2
          'y': 2
        - label: Perfusion 量化软件
          x: 3
          'y': 2
        - label: 机器人成像模块
          x: 3
          'y': 5
        - label: Tc-99m 示踪
          x: 2
          'y': 4
        - label: 白光现状
          x: 1
          'y': 5
    approximationNotes: 坐标轴采用有证据支持的 1-5 序数分数，依据来源中的堆栈广度、已部署工作流、手术默认状态和披露的监管覆盖得出；这些是比较性启发指标，不是实测市场份额结果。
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP005
      - CP006
      - CP009
      - CP011
      - CP012
  - id: FI001
    title: 收入模型连接桥
    type: flow
    summary: 公开证据支持一条由耗材主导的连接桥：从荧光手术需求走向重复染料收入和高毛利；硬件和软件被定位为扩展层，而非已披露的同等收入贡献者。
    data:
      nodes:
        - id: procedure-demand
          label: 荧光引导手术需求
          note: 手术采用是所有变现路径的活动基础。
        - id: icg-use
          label: 经常性 ICG 药瓶使用
          value: 68% global vial share / 63% revenue share
          note: 分析师覆盖将 ICG 定位为当前占主导地位的业务。
        - id: consumables-revenue
          label: 耗材收入引擎
          value: FY2025 revenue US$142.4m
          note: 第三方覆盖称，经常性 ICG 耗材是当前业务驱动力。
        - id: device-layer
          label: IC-Flow 成像部署
          note: 设备获批扩大未来覆盖面，但尚不意味着 APAC 近期会有实质性盈利贡献。
        - id: software-layer
          label: 量化软件 / Data Platform
          note: 官方材料将软件和 AI 描述为变现选择权，但未公开披露单独收入。
        - id: gross-profit
          label: 毛利池
          value: FY2025 gross margin about 85%
          note: 尽管完整的单位经济细节缺失，公开证据仍指向强劲的毛利经济性。
      edges:
        - from: procedure-demand
          to: icg-use
          label: 驱动
        - from: icg-use
          to: consumables-revenue
          label: 转化为
        - from: procedure-demand
          to: device-layer
          label: 也支持
        - from: device-layer
          to: software-layer
          label: 为……创造数据 / 工作流机会
        - from: consumables-revenue
          to: gross-profit
          label: 当前最明确地贡献于
        - from: software-layer
          to: gross-profit
          label: 未来可能贡献于
    approximationNotes: 份额和利润率标签照录指定来源；该图展示关系流，而不是各收入线之间的量化结构。
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI014
      - CI015
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开证据支持一个六层荧光引导手术堆栈，从手术流程规范延伸到数据采集和术后学习。
    data:
      layers:
        - label: 手术流程规范
          detail: 特定手术的剂量、给药途径和时机决定荧光成像能否在手术室中使用。
          outputs:
            - ISFGS 发布覆盖结直肠、肝脏、淋巴、整形和肿瘤应用的指南
        - label: 荧光耗材药剂
          detail: IC-GREEN 和 Verdye 提供支撑其余工作流的 ICG 信号。
          modules:
            - IC-GREEN（美国）
            - Verdye（美洲以外）
        - label: 成像采集硬件
          detail: IC-Flow V2 被定位为开放手术期间实时荧光可视化的设备层。
          outputs:
            - 灌注评估
            - 皮瓣循环可视化
            - 淋巴流可视化
        - label: 量化引擎
          detail: PerfusionWorks 被定位为将视觉信号转化为客观、可复现指标的层。
          modules:
            - 实时量化
            - 标准化解读支持
        - label: 云端和报告层
          detail: 公司将结构化报告、医院系统集成和数据复用描述为下一层软件能力。
          outputs:
            - 结构化报告
            - 术后洞察和复盘
            - 为未来分析创建数据集
        - label: 临床反馈闭环
          detail: 外科医生关系、研究合作和监管扩张推动采用与产品迭代。
          outputs:
            - 研究者主导的研究
            - 医院合作
            - 区域推出
    approximationNotes: 该堆栈根据指定公开材料重构，展示的是运营层，而非已披露的系统图或经过验证的数据流规范。
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE010
      - CE011
  - id: FU001
    title: 客户采用与扩张路径
    type: journey-map
    summary: 可站得住脚的顺序是从临床证据和获批，经过渠道准入，走向重复手术；平台扩张只有在机构采用之后才会发生。
    data:
      items:
        - label: 临床证据
          stage: 需求基础
          detail: 独立证据支持部分 ICG 引导手术结果，但其他应用仍不太确定。
          touchpoints:
            - SAGES 系统综述
            - 特定手术结果
        - label: 监管获批
          stage: 市场准入
          detail: 染料获批和成像系统获准可以开展商业化，但不能证明客户已经采用。
          touchpoints:
            - Verdye 获批
            - IC-Flow 获准
        - label: 渠道准入
          stage: 采购准入
          detail: 主要批发商将耗材纳入机构采购渠道。
          touchpoints:
            - Cencora
            - McKesson
            - Cardinal Health
        - label: 医院采用
          stage: 工作流转化
          detail: 外科医生和采购团队必须把荧光纳入临床及采购惯例。
          touchpoints:
            - 培训和熟悉度
            - 机构采购
        - label: 重复手术
          stage: 核心持久性
          detail: 与手术绑定的药瓶需求，是可观察的经常性经济活动。
          touchpoints:
            - 再订购
            - 使用深度
        - label: 平台扩张
          stage: 选择性扩张
          detail: 成像和数据工具可能加深工作流绑定，但搭售率和生产环境部署均未披露。
          touchpoints:
            - 成像硬件
            - 量化软件
    approximationNotes: 这是基于证据的概念性路径，而非实测转化漏斗；公开资料未披露各阶段之间的转化率。
    claimRefs:
      - CU002
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 在获批、制造或收入集中度可能拖慢商业转化的地方，剩余风险严重度最高，尽管整体势头积极。
    data:
      columns:
        - 低可能性
        - 中可能性
        - 高可能性
      rows:
        - label: 监管顺序
          values:
            - null
            - null
            - label: 高影响 / 高可能性
              tone: risk
              detail: 在几个新开放的 APAC 市场，设备获准范围比药品注册更广。
        - label: 制造与关税
          values:
            - null
            - label: 高影响 / 中可能性
              tone: warning
              detail: 爱尔兰生产加上对美国终端市场的依赖，可能在需求转弱前就挤压服务水平或利润率。
            - null
        - label: 外科医生主导的采用
          values:
            - null
            - null
            - label: 中影响 / 高可能性
              tone: warning
              detail: 扩张依赖一个相对集中的临床领军者和合作机构网络。
        - label: 云治理
          values:
            - null
            - label: 中影响 / 中可能性
              tone: warning
              detail: AI 和视频平台增加了集成、隐私及采购控制方面的问题，这些问题在指定资料池中仍未解决。
            - null
        - label: 公开市场纪律
          values:
            - label: 中影响 / 低可能性
              tone: neutral
              detail: SGX 上市提高了对执行的审视，也降低了市场对混杂市场进入信号的容忍度。
            - null
            - null
        - label: 投资者预期缺口
          values:
            - null
            - label: 低影响 / 中可能性
              tone: neutral
              detail: 资本市场支持很强，但证据仍需证明 AI 选择权能够转化为持久收入。
            - null
    claimRefs:
      - CR003
      - CR004
      - CR006
      - CR008
      - CR010
      - CR016
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 建议维持跟踪，因为历史盈利能力和融资证据真实存在，但最新公开证据仍未解决竞争、APAC 盈利转化和更新后的投资判断。
    data:
      nodes:
        - id: profitable-core
          label: FY2025 盈利基础
          detail: 收入 US$142.4m，调整后 EBITDA US$89.4m，毛利率 85%。
        - id: financed-balance-sheet
          label: 资本充足的资产负债表
          detail: IPO 资金包和战略轮融资降低了短期融资压力。
        - id: platform-optionality
          label: 平台选择权
          detail: PerfusionWorks 和 Data Platform 可能将变现范围扩展到耗材之外。
        - id: us-competition
          label: 美国竞争
          detail: 管理层正在等待观察竞争对手的定价、分销和客户方案。
        - id: apac-monetization
          label: APAC 证据仍待补齐
          detail: 新获批扩大了覆盖范围，但 DBS 表示 2026 年盈利影响可能有限。
        - id: track-call
          label: 跟踪而非买入
          detail: 当前价格相对过时锚点看似便宜，但更新后的投资判断尚不完整。
      edges:
        - from: profitable-core
          to: financed-balance-sheet
          relationship: 支撑下行韧性
        - from: financed-balance-sheet
          to: platform-optionality
          relationship: 为上行选择权提供资金
        - from: platform-optionality
          to: us-competition
          relationship: 上行空间必须超过
        - from: us-competition
          to: apac-monetization
          relationship: 保持对执行的关注
        - from: apac-monetization
          to: track-call
          relationship: 留下对价格敏感但不完整的局面
    approximationNotes: 流程顺序体现决策顺序，而不是量化的因果模型或隐含概率权重。
    claimRefs:
      - CV004
      - CV005
      - CV006
      - CV010
      - CV011
      - CV013
      - CV015
      - CV016
