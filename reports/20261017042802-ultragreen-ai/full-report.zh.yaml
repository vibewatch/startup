              最近最强的资产负债表信号是 2025 年 9 月的战略投资。多份保留来源将其对应到一笔 US$188 million 融资，按 US$1.3 billion 股权估值进行，由 65 Equity Partners
              和 Vitruvian 领投，August Global Partners 参与。2026 年 1 月的独立覆盖还显示，股东基础较为集中，由 Renew Group 领衔，另有 Anchor VI 和 Verde
              Taano；这对治理和未来流通股结构都很重要。运营规模方面，最清晰的收入数据来自 2026 年 1 月分析师模型：2025A 收入为 US$142 million，2024A 为 US$115
