              可能在药品注册前先打通设备路径，即使地域扩张的标题消息利好，各国商业准备度仍不均衡。第二，核心染料业务仍有制造和物流脆弱性：管理层称 ICG
              生产“极其复杂”，独立报道则称爱尔兰仍是制造基地，而美国仍是最大市场。第三，股权故事仍依赖把耗材驱动业务延伸成更广的软件和数据平台，但公开证据尚未证明客户集中度、附着率或云路线图的安全控制成熟度。
