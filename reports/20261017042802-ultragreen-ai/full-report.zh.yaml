              - CM010
              - CM011
      - number: '2.3'
        title: 买方、用户与采用路径
        blocks:
          - type: paragraph
            body: >
              最终用户是外科医生和手术团队，但采用与变现要经过层次更复杂的买方路径。UltraGreen 的来源强调医生教育、KOL
              关系、剂量指导和工作流标准化，因为医院扩大荧光使用前必须先形成临床拉动。商业转化仍取决于医院采购、报销逻辑、已安装的成像系统和当地经销商执行。不同产品层的买方图谱也不同：染料采购像经常性手术耗材，成像更像资本设备准入，而软件则取决于医院是否需要定量报告和数据整合。因此，这个市场在临床上可以很广，但在不同国家、专科和客户类型之间，商业表现并不均衡。
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM007
              - CM009
              - CM010
              - CM013
      - number: '2.4'
        title: 约束与未解决的尽调缺口
        blocks:
          - type: paragraph
            body: >
              市场的关键约束不是 ICG 原理上是否有效，而是医院、监管机构和竞争供应商要多快才能把临床效用转化为可重复的商业采用。DBS 2026 年 3
              月的报告清楚展示了亚太情况：成像系统获批范围扩大，但在新获批地区中，染料仍只有菲律宾完成注册，因此短期收入贡献仍小。竞争进入风险也真实存在。UltraGreen 2026 年 8
              月股东更新确认竞争供应商获得了新的美国批准，但管理层也指出，获批本身不等于上市或实现渗透。最后，公开覆盖数据还没有在“注册”“批准”“已销售”“豁免”和“监管覆盖”等定义之间统一，因此基于这些数字建立的市场份额或采用模型，在支撑估值级市场地图前仍需管理层核对。
            claimRefs:
              - CM008
              - CM014
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争集合是工作流方案，而非单一直接 SKU 同行
        blocks:
          - type: paragraph
            body: >-
              保留的证据指向分层竞争格局，而不是一个清晰的单公司同行集合。UltraGreen 将自身描述为把可信的 ICG 荧光剂、荧光成像、定量软件和 AI
              分析结合起来；独立评论则将同一方案拆成三层价值：耗材、成像系统和软件。因此，公司同时暴露于多类替代方案：区域性 ICG
              供应商、可以嵌入荧光能力的既有成像平台、独立的灌注定量工具，以及现状中的非荧光工作流。因此，竞争问题在于医院会不会购买更完整、由数据支撑的荧光工作流，还是继续使用只解决单一步骤的狭窄手术替代方案。
            claimRefs:
              - CP001
              - CP005
              - CP012
              - CP013
              - CP014
