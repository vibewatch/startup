        blocks:
          - type: paragraph
            body: >
              缓释逻辑有意义，但有条件。UltraGreen 于 2025 年 9 月宣布 US$188 million 战略投资；管理层后来告诉 CNA，公司每年产生的现金足以在近期避免再次上市；Straits Times
              报道管理层目前预计能够吸收关税成本。这些因素降低了即时融资压力，但不能替代商业转化和治理证据。如果 2026-2027 年的批准仍未带来可量化的亚太贡献，如果制造或关税条件不再可吸收，如果尽调后客户 /
              经销商集中度仍不透明，或云端手术数据平台无法证明企业级隐私、集成和医院采用控制，投资逻辑都应显著转弱。
            claimRefs:
              - CR004
              - CR009
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: 图表
        blocks:
          - type: callout
            title: 严重性最高的剩余风险
            body: 各国染料批准仍是“看似全球化的覆盖”无法转化为近期亚太收入的最清晰路径。
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR015
          - type: callout
            title: 在把上行空间计入投资判断前最重要的尽调要求
            body: 要求提供可读的逐司法辖区产品批准矩阵、量化的经销商 / 客户集中度，以及云端视频和 AI 平台的安全 / 隐私控制证据。
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR010
              - CR016
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资背景与公开定价
        blocks:
          - type: paragraph
            body: >-
              UltraGreen 看起来不需要救助资本。指定材料显示，公司在 2025 年末完成约 US$400 million 的 IPO 方案，并在同年早些时候获得 US$188 million
              的独立战略投资；投资者页面仍突出 FY2025 收入 US$142.4 million、调整后 EBITDA US$89.4 million 和 85% 毛利率。更难判断的是估值，而不是生存。截至 2026 年
              10 月 16 日，投资者页面显示最新成交价为 US$0.475，明显低于 US$1.45 的 IPO 价格，也低于所有引用的 2026
              年分析师目标价。这个差距带来表面上的便宜，但还不足以形成完整投资判断，因为指定材料中的公开记录没有披露更新后的完全稀释后股数、优先权 overhang 或刷新后的 FY2026 模型。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV016
      - number: '8.2'
        title: 投资逻辑、反方逻辑与市场争论
        blocks:
          - type: paragraph
            body: >-
              看多逻辑很直接：如果执行保持稳定，UltraGreen 仍像一家高毛利耗材公司；软件和平台期权也有足够证据，足以支持一定溢价。招股书和公司材料将 PerfusionWorks 与 UltraGreen Data
              Platform 描述为从染料驱动业务走向更广泛手术智能方案的路径，而更新后的监管证据仍让地域扩张故事保持活力。指定材料中的反方逻辑同样清晰。Singapore Business Review
              显示，管理层准备从定价、分销和客户方案入手应对新的美国进入者；DBS
              则认为最新亚太批准是铺垫，而不是近期盈利能力，因为大多数新地区的染料批准仍滞后。换句话说，股票可能便宜，但下一场争论关乎收入质量和竞争持久性，而不是市场认知度。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: 情景框架、入场纪律与最终判断
        blocks:
          - type: paragraph
            body: >-
              公开市场设置足够有吸引力，可以把 UltraGreen
              留在积极观察名单上，但仅凭这组证据还不够干净，无法给出完整的买入建议。若管理层证明美国竞争可控，且平台层能够为耗材业务增添价值而不是仅作装饰，当前报价未来有可能重新回到历史分析师区间，从而形成乐观情景。基准情景仍是跟踪：等待更新后的
              FY2026 数据、股权结构清晰化，以及亚太批准转化为商业成果而非象征性覆盖。悲观情景则是，市场正确地折价反映了一家面临美国定价压力、投资判断锚点过时、软件故事仍早于股权叙事的企业。
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 跟踪折价，但暂不把它计入投资判断
            body: UltraGreen 的历史质量和资本支持足以维持可投资性，但指定材料尚未证明 2026 年 10 月的折价是估值错误，而不是合理的估值下调。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV009
              - CV016
          - type: callout
            title: 升级信号是更新后的证据，而非叙事
            body: 从跟踪转为买入需要更新后的 FY2026 业绩、当前完全稀释后股数，以及美国竞争没有侵蚀价格、份额或利润率的证据。
            calloutType: assumption
            claimRefs:
              - CV003
              - CV011
              - CV013
              - CV016
          - type: callout
            title: 如果旧模型过时，低价仍可能很贵
            body: 现在买入折价的主要风险是，指定材料中的所有公开上行指标都是回顾性的 2026 年分析师锚点，而不是竞争后更新的投资判断依据。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV016
