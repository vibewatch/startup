        - 需要更新后的数字和可见的商业证据，而不只是叙事
        - 若定价压力或利润率走弱显示旧目标在结构上已经过时，情景就会失效
      - - 基准
        - 核心业务保持盈利，但市场等待竞争、APAC 扩张和软件变现的更明确证据
        - 维持跟踪立场；仍有上行空间，但仅凭价格不足以支持完整的投资判断跃升
