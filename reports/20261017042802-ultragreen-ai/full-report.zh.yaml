      - number: '5.3'
        title: 成熟度、批准与技术风险
        blocks:
          - type: paragraph
            body: >
              各产品层和各地域的成熟度并不均衡。积极的一面是，指定证据支持真实的商业和监管进展：Verdye 于 2026 年 5 月获得新加坡批准；联合发布的批准公告和 DBS 研究称，IC-Flow V2
              在印度、泰国、菲律宾和孟加拉国获批后，成像平台已覆盖 45 个地区。2026 年 8 月股东更新还显示，管理层正试图同时突出染料、成像和软件，把故事从单一染料业务重新定位，并称 PerfusionWorks
              已完成 MDR 符合性评估，但尚未拿到正式 CE 认证。


              主要风险在于，软件和平台故事在战略上比在运营上更清晰。FSMOne 称 PerfusionWorks 已获 FDA 510(k) clearance，但管理层之后的 2026 年 8 月更新称正式 CE
              认证仍在等待，FDA clearance 将在此后推进；这一差异需要监管原始文件核实。DBS
              还指出，数项亚太成像批准并不意味着相应染料已获批，因此不能假设完整平台会作为一个同步方案落地。对于医院软件尽调所关心的信任和可靠性，公开证据很薄弱：指定材料没有记录安全认证、正常运行时间或状态报告、接口标准，或围绕数据层的公开从业者
              / 开发者遥测。最后，地域叙事也需要核对，因为材料分别提到监管覆盖超过 43 个国家、45 个成像地区以及产品销售超过 55 个国家。因此，产品成熟度应以核对后的监管和商业覆盖来判断，而不是依据醒目的地域数字。
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE013
