              - CE009
      - number: '5.2'
        title: 工作流与运营架构
        blocks:
          - type: paragraph
            body: >
              指定证据所隐含的运营模式沿着术中工作流展开：按手术类型使用特定的给药时点和剂量方案；随后由近红外成像捕捉荧光信号；定量软件用于减少主观解读；云端 /
              数据层则计划把荧光观察转化为结构化报告和可复用数据集。ISFGS 剂量图尤其有用，因为它显示临床使用依赖按手术、剂量、给药途径和时点做出严谨的方案选择，而不是抽象的“AI 手术”。换句话说，Ultragreen
              的软件野心建立在一个已有具体技术操作约束的临床工作流之上。


              公司产品页面和收购 Perfusion Tech 的公告最明确地展示了软件野心。Innovation Pipeline
              页面称，公司正在“把定性评估转向定量、标准化洞察”，并建设与医院系统集成的云平台。临床研究页面补充称，PerfusionWorks 和 UltraGreen Data Systems
              计划将荧光转化为客观指标，并提供术后复盘能力；Perfusion Tech 公告则将实时可视化、定量分析、云端数据管理和 AI
              洞察描述为一个平台。这些主张足以支撑绘制架构图，但公开证据仍不够详细，无法单独验证数据模型、部署模式或软件保障控制。
