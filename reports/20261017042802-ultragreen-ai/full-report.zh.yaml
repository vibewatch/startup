    columns:
      - 论点
      - 方向
      - 证据
      - 哪些变化会改变判断
    rows:
      - - 高毛利历史基础
        - 正论
        - FY2025 收入 US$142.4m，调整后 EBITDA US$89.4m，毛利率 85%
        - 更新后的 FY2026 信息若显示利润率下滑或销量疲弱，这一基础就会削弱
      - - 资本缓解短期融资压力
        - 正论
        - 约 US$400m 的 IPO 资金包加上 US$188m 战略投资，为选择空间和耐心提供支撑
        - 若披露现金消耗、新一轮股权融资或期限负担较重的融资，资产负债表逻辑就会削弱
      - - 平台选择权可能扩大估值倍数
        - 正论
        - 招股书和公司材料将 PerfusionWorks 及 Data Platform 定位为下一层变现来源
        - 软件搭售率、定价和监管里程碑必须从承诺变成可量化的采用
      - - 美国竞争已不再只是理论
        - 反论
        - 管理层公开表示会先观察竞争对手的定价、分销和客户方案，再作应对
        - 只有在新进入者商业化失败，或其推出产品后公司份额 / 价格仍能守住时，反论才会缓解
      - - APAC 获批尚不足以证明盈利
        - 反论
        - DBS 表示，最新获批只是打基础，2026 年不太可能带来实质性增益，因为染料审批仍然滞后
        - 要改变判断，染料必须获批并完成商业转化，不能只看设备获准
    notes: 各行有意结合事实证据和决策标准；每一行都说明哪些具体公开证据会改变投资判断，而不是重复泛泛的尽调建议。
