      - number: '3.2'
        title: 护城河在耗材规模和监管覆盖上最强
        blocks:
          - type: paragraph
            body: >-
              关于可防御性的最强证据在 ICG 耗材，而不只是硬件。FSM Global 称，2024 年 UltraGreen 约占全球 ICG 瓶装量的 68% 和行业收入的
              63%，在美国和欧洲的份额尤其强；报告还称竞争厂商更偏区域化，批准和分销范围更窄。同一报告指出，获批可能需要数年，而一旦供应商进入医院体系，采购关系和医生熟悉度会让替换进展缓慢。UltraGreen 自身
              2026 年更新进一步强调覆盖广度，称 Verdye 覆盖 41 个国家、IC-Flow 覆盖 45 个市场；小型竞争者若要追上，就必须匹配更大的已部署地域。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP005
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP006
              - CP007
              - CP008
              - CP010
              - CP012
      - number: '3.3'
        title: 工作流广度有帮助，但替代方案仍能在部分手术中胜出
        blocks:
          - type: paragraph
            body: >-
              收购 Perfusion Tech 很重要，因为比较重点从单纯的图像可见性转向客观的灌注定量和结构化工作流数据。Biospectrum Asia 与 Perfusion Tech
              都将合并后的方案描述为朝标准化、可复现的决策支持发展；UltraGreen 自身的管线表述也明确将目标定为把定性成像转化为量化洞察。即便如此，替代工作流仍有说服力。在早期乳腺癌前哨淋巴结定位中，Frontiers
              研究报告称，单独使用 ICG 的患者级检出率为 90.6%，Tc-99m 为 97.1%，联合技术为 98.1%；这说明即使 ICG 在工作流和安全性上有优势，传统核医学路径仍能在特定任务上胜出。
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP010
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP006
              - CP009
              - CP010
              - CP012
      - number: '3.4'
        title: 持久性依赖采用广度，但证据并非普遍成立
        blocks:
          - type: paragraph
            body: >-
              本章最有力的正面论据是，UltraGreen
              能把每例手术产生的经常性耗材收入，与不断扩展的成像和软件层结合起来；机器人采用和新批准也在增加可使用荧光引导工作流的场所数量。主要反方是，临床和运营价值在不同手术中的表现并不均衡。SAGES 系统综述称，使用
              ICG 的 FIGS
              能改善部分应用，尤其是降低结直肠吻合口漏，但在其他场景中证据仍有限或依赖具体环境，而且许多地方的使用仍受限制。因此，护城河是真实的，但并非绝对：当买方看重完整荧光方案时，公司似乎具备差异化；但采购、定价、附着率和逐手术类型的优越性数据仍缺乏公开证据。
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.5'
        title: 图表
        blocks:
          - type: callout
            title: 竞争比拼的是完整工作流
            body: 关键竞争不是一种染料对另一种染料。UltraGreen 试图销售一套方案，把经常性的 ICG 需求与成像、定量和未来的数据层结合起来；而许多替代方案只能解决工作流中的一个环节。
            calloutType: insight
            claimRefs:
              - CP001
              - CP006
              - CP012
              - CP013
