  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 耗材驱动已披露的经济性
        blocks:
          - type: paragraph
            body: >-
              公开证据支持耗材驱动的收入模式，而不是三条业务线均衡贡献的组合。UltraGreen 投资者页面披露 FY2025 收入为 US$142.4 million、调整后 EBITDA 为 US$89.4
              million；同一页面和第三方摘要将 FY2025 毛利率置于约 85%。独立分析师称当前业务主要由经常性 ICG
              耗材驱动，这很关键，因为反复使用染料是目前唯一有清晰证据、能把手术量转化为重复收入的引擎。官方材料也将成像硬件、定量软件和 AI
              分析列为平台组成部分，但指定证据没有披露各自收入贡献、ASP、附着率或付费软件渗透率。因此，硬件和软件在战略上重要，但财务定义仍不充分，只是建立在强大耗材核心之上的上层。
            claimRefs:
