      - number: '4.2'
        title: 资本充足，但未来盈利转化仍取决于条件
        blocks:
          - type: paragraph
            body: >-
              公开记录显示了多个资本里程碑，但没有足以承销的完整现金跑道模型。IPO 启动时，媒体称 UltraGreen 以 US$1.45 推出约 112 million 股，约 US$150 million
              毛募资额归公司所有；管理层也将资金用途描述为核心产品开发、地域扩张和营运资金。上市前，Allen & Gledhill 描述了 2025 年 10 月按 US$1.3 billion
              股权估值进行的老股出售，之后的分析师摘要披露 FY2025 净现金为 US$173.0 million。因此，资本充足性比烧钱速度或现金跑道更有证据支撑，但下一阶段盈利并非没有阻力：Tickrs
              指出有效税率大幅上升，DBS 则认为，新的亚太设备批准主要带来期权价值，直到核心 ICG 染料在同一市场获批且收入超过小基数。
