  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：荧光引导手术，而非全部手术
        blocks:
          - type: paragraph
            body: >
              UltraGreen 的相关市场是荧光引导手术工作流，而不是普通医院 IT 或全部手术支出。公司自身将 ICG 荧光剂与近红外成像、定量软件和 AI
              分析结合起来；独立覆盖仍显示，经常性经济核心是手术中使用的耗材染料。这对估值很重要：除非手术使用荧光、医院配备兼容成像设备且工作流支持反复使用
              ICG，否则大部分手术支出都不属于可触达市场。最接近的现状替代方案仍是白光或非荧光手术；最接近的相邻替代方案则是捆绑硬件的荧光解决方案，而且未必会争夺每个医院客户。这个边界避免本章把“手术 AI”等同于
              UltraGreen 的可触达市场。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM010
      - number: '2.2'
        title: 多种测算视角指向增长空间，但没有清晰的公开 SAM/SOM
        blocks:
          - type: paragraph
            body: >
              最有力的公开证据支持多种测算视角，而不是一套清晰的 TAM/SAM/SOM。引用 Frost & Sullivan 的独立分析称，美国荧光引导手术在符合条件的手术中的渗透率仍低于 25%；预计到 2030
              年，亚太将成为增长最快的区域 ICG 市场。公司和 IPO 报道提供了第二个视角：2022 年至 2025 年上半年，UltraGreen 已在 54 个国家销售染料产品，自 2015 年以来出货 530
              万瓶。这说明现实采用已有规模，但不能代表剩余机会总量。第三个视角来自 ValueZoomer 转述的管理层评论：美国每年可触达手术量为 1,000 万例，而公司去年销售了 67
              万瓶。这说明仍有增长空间，但按地域、价格、附着率和产品组合拆分的 SAM/SOM 模型仍未完成核对，也无法审计。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM011
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM011
              - CM015
