      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              这家刚上市的医疗科技发行人，公开披露的领导班子纸面实力很强。Ravi Sajwan 仍是核心人物，兼任创始人和 CEO；分析材料将他与多个早期创业及 CTO
              职位联系起来，说明他兼具技术能力和建公司能力，符合创始人—市场匹配度。董事会主席 Kwa Chong Seng 曾任 ExxonMobil Asia Pacific、DBS、淡马锡和 Singapore
              Exchange 任职经历，为公司带来成熟的公开市场监督资历。不过，最尖锐的独立担忧并非履历不足，而是 IPO 后的经营纪律：ICAM 明确提出，真正的治理问题在于管理层会继续强化已验证的 ICG
              业务，还是会以超过经济性合理范围的速度扩展到软件、数据和相邻业务。因此，治理需要盯住 Sajwan 的权力集中、资本配置和战略边界，而不是财务困境或明显的控制权滥用。
