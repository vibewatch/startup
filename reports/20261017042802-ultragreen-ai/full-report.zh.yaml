        - 利润率压缩、2026 年更新疲弱，或公司在更弱议价地位下再次融资，都会触发该情景
    notes: 由于指定资料池没有足够的当前股数、市场共识或股权结构表证据来支撑自下而上的估值模型，情景采用方向性的估值逻辑，而不是单点估计。
