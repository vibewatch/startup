    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与平台
        blocks:
          - type: paragraph
            body: >-
              与其把 UltraGreen.ai 视作泛泛的 AI 医疗故事，不如将其明确定位为一家总部在新加坡、专注荧光引导手术的上市医疗公司。2026 年独立分析师覆盖和 2025 年 9
              月报道都将公司描述为总部在新加坡、业务聚焦荧光引导手术技术；官方产品页面则将商业方案围绕 ICG 染料、IC-Flow 成像硬件、PerfusionWorks 定量软件和 UltraGreen Data
              Systems
              展开。这一点影响整份报告的判断：公司的身份边界很宽，但保留下来的证据仍指向一个具体的运营核心——由染料主导、硬件、分析和云工具提供支撑的工作流。官方来源适合用于理解产品架构和定位，但除非有独立材料印证，否则应视为公司口径。
