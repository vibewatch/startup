      - number: '4.3'
        title: 结论：毛利率质量高，但单位经济性透明度低
        blocks:
          - type: paragraph
            body: >-
              最有证据支撑的结论是，UltraGreen 已在运营一个盈利、高毛利的模式，核心是经常性 ICG 耗材和全球覆盖。公开缺失的内容同样重要：指定来源没有给出实际染料价格、硬件
              ASP、软件合同结构、CAC、回本周期、销售周期、客户集中度、经销商集中度，或从净现金到现金跑道的桥接。最新披露股价显著低于 IPO
              价格，这不能证明存在融资缺口，但说明未来股权融资可能处于比上市时更弱的市场位置。因此，本章对收入质量和利润结构持正面看法，但对未来投资判断保持谨慎，因为资本强度和商业效率在公开材料中仍不透明。
