  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 一体化产品方案
        blocks:
          - type: paragraph
            body: >
              指定材料中的产品组合不止一瓶吲哚菁绿。公司控制的材料和第三方材料都将其描述为一套方案：从 ICG 耗材起步，延伸到近红外成像硬件，并计划围绕手术工作流增加定量软件和数据基础设施。2026 年 5 月 Verdye
              官方发布称，公司正在打造一套“综合荧光引导手术生态系统”，把药品、兼容成像硬件和 AI
              数据平台结合起来；招股书和分析师覆盖则将同一架构描述为垂直整合模式，而非纯耗材业务。这会改变护城河叙事和尽调范围：公司不只是在现有手术中销售染料，也在试图影响临床工作流、成像采集、解读以及最终的结构化术后数据。


              这套方案也有明显的成熟度分层。耗材层最成熟：美国使用 IC-GREEN，美洲以外使用 Verdye，二者都是核心临床输入。成像硬件也已有商业实质；独立覆盖和公司关联的批准公告都将 IC-Flow V2
              描述为一种手持式近红外系统，用于术中灌注和淋巴可视化。软件和数据层则更早期、更偏战略，尚未证明已实现规模化。公开材料强调 PerfusionWorks、定量、结构化报告和 AI
              洞察，但指定材料在集成深度、已安装基础采用、发布节奏和支持归属方面的细节远少于染料和设备层。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE012
