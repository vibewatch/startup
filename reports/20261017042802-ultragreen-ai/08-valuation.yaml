schemaVersion: report-v2
artifact: valuation
slug: ultragreen-ai
runDate: 2026-10-17
company:
  name: UltraGreen.ai
chapter:
  number: 8
  title: Valuation
  summary: >-
    UltraGreen combines unusual listed-medtech proof points—historical profitability, a large IPO, and a
    $188 million strategic financing—with a current share price that has fallen far below both the IPO price
    and the published 2026 sell-side targets in the assigned evidence pool. That setup supports a
    price-sensitive track call rather than a buy recommendation, because public evidence still shows fresh
    US competitive pressure, APAC monetization that remains pre-scale, and missing cap-table and refreshed
    FY2026 underwriting detail.
sections:
  - id: financing-and-trading-context
    title: Financing context and public pricing
    body: >-
      UltraGreen does not look like a business that needs rescue capital. The assigned pool shows a roughly
      US$400 million IPO package in late 2025, a separate US$188 million strategic investment earlier that
      year, and an investor page still highlighting FY2025 revenue of US$142.4 million, adjusted EBITDA of
      US$89.4 million, and 85% gross margin. The harder judgment is valuation rather than survival. As of
      16 October 2026, the investor page showed a US$0.475 last-done US-dollar line, which is materially
      below the US$1.45 IPO price and below every cited 2026 analyst target. That gap creates optical
      cheapness, but not yet a complete underwriting case, because the public record in this pool does not
      disclose an updated fully diluted share count, preference overhang, or refreshed FY2026 model.
    claimRefs: [CV001, CV003, CV004, CV005, CV006, CV010, CV016]
    tableRefs: [TV001]
  - id: thesis-and-anti-thesis
    title: Thesis, anti-thesis, and what the market is debating
    body: >-
      The long case is straightforward: UltraGreen still looks like a high-margin consumables franchise with
      enough evidence of software and platform optionality to justify some premium if execution holds. The
      prospectus and company materials frame PerfusionWorks and the UltraGreen Data Platform as a route from
      a dye-led business into a broader surgical-intelligence stack, while the refreshed regulatory evidence
      keeps the geographic expansion story alive. The anti-thesis is equally clear in the assigned pool.
      Singapore Business Review shows management preparing to respond to new US entrants based on pricing,
      distribution, and customer offer, while DBS argues the latest APAC approvals are groundwork rather
      than near-term earnings power because dye approvals still lag in most new territories. In other
      words, the stock may be cheap, but the next debate is about earnings quality and competitive durability,
      not awareness.
    claimRefs: [CV007, CV008, CV009, CV011, CV012, CV013, CV014, CV015]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: scenarios-and-diligence-asks
    title: Scenario framing, entry discipline, and final call
    body: >-
      The public-market setup is attractive enough to keep UltraGreen on an active watchlist, but not clean
      enough to underwrite a full buy recommendation from this evidence set alone. A bull case exists if the
      current quote eventually re-rates back toward the historical analyst range once management proves that
      US competition is manageable and that the platform layer can add to, rather than merely decorate, the
      consumables business. The base case is still track: wait for refreshed FY2026 numbers, cap-table
      clarity, and evidence that APAC approvals become commercial rather than symbolic. The bear case is that
      the market is correctly discounting a business facing US pricing pressure, stale underwriting anchors,
      and a software story that remains earlier than the equity pitch implies.
    claimRefs: [CV001, CV003, CV007, CV008, CV009, CV011, CV012, CV013, CV016]
    tableRefs: [TV003]
tables:
  - id: TV001
    title: Recommendation summary table
    columns: [Dimension, Assessment, Evidence, Decision implication]
    rows:
      - [Recommendation, Track, 'Current quote is optically cheap versus prior anchors but not yet refreshed on FY2026 evidence', 'Stay engaged, but do not underwrite a full position from this pool alone']
      - [Confidence, Medium, 'Multiple public sources support the historical setup, but key current underwriting details are still missing', 'Require refreshed operating and cap-table evidence before upgrading conviction']
      - [Risk rating, Medium-high, 'US competition and slow APAC earnings conversion can overwhelm a low headline share price', 'Position sizing should assume continued volatility']
      - [Valuation stance, 'Cheap versus stale anchors; unproven versus refreshed fundamentals', 'US$0.475 last-done price sits below the IPO price and cited 2026 analyst targets', 'Treat the discount as a signal to diligence, not a self-validating margin of safety']
      - [Entry discipline, 'Wait for proof', 'Need updated FY2026 model, fully diluted share count, and clearer competitive response', 'Upgrade only if refreshed evidence still supports material upside at the then-current price']
    notes: >-
      This is a public-evidence decision frame, not a complete fair-value model; the assigned pool lacks a
      current fully diluted share count, explicit preference stack detail, and refreshed FY2026 consensus.
    claimRefs: [CV001, CV003, CV007, CV008, CV009, CV010, CV016]
  - id: TV002
    title: Thesis / anti-thesis table
    columns: [Argument, Direction, Evidence, What would change the view]
    rows:
      - ['High-margin historical base', Thesis, 'FY2025 revenue US$142.4m, adjusted EBITDA US$89.4m, gross margin 85%', 'A refreshed FY2026 update showing margin erosion or volume weakness would weaken the base']
      - ['Capital reduces near-term financing stress', Thesis, 'Approx. US$400m IPO package plus US$188m strategic investment support optionality and patience', 'A disclosed cash draw, new equity raise, or term-heavy financing would weaken the balance-sheet case']
      - ['Platform optionality can expand the multiple', Thesis, 'Prospectus and company materials position PerfusionWorks and the Data Platform as the next monetization layer', 'Software attach rates, pricing, and regulatory milestones must move from promise to measurable adoption']
      - ['US competition is no longer theoretical', Anti-thesis, 'Management is openly waiting to see rival pricing, distribution, and customer propositions before responding', 'The anti-thesis eases only if new entrants fail to commercialize or if share/price holds despite their launch']
      - ['APAC approvals are not yet earnings proof', Anti-thesis, 'DBS says the latest approvals are groundwork and unlikely to be materially accretive in 2026 because dye approvals still lag', 'A view change requires dye approvals and commercial conversion, not just device clearances']
    notes: >-
      Rows intentionally mix factual proof and decision criteria; each row states what specific public
      evidence would move the investment view rather than repeating generic diligence advice.
    claimRefs: [CV001, CV004, CV005, CV006, CV010, CV011, CV012, CV013, CV014, CV015]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, 'Valuation / return logic', 'Probability signal', 'Downside / trigger']
    rows:
      - [Bull, 'US competition proves manageable, FY2026 results hold the high-margin profile, and platform milestones begin to monetize', 'Shares re-rate toward or above the cited 2026 analyst range because the market accepts software/platform upside on top of the consumables base', 'Needs refreshed numbers plus visible commercial proof, not just narrative', 'Fails if pricing pressure or weaker margins show the old targets were structurally stale']
      - [Base, 'Core business remains profitable but the market waits for cleaner proof on competition, APAC scaling, and software monetization', 'Track stance persists; upside exists, but price alone does not justify a full underwriting leap', 'Most consistent with assigned evidence because both thesis and anti-thesis are real', 'Stays stuck if public disclosures remain incomplete']
      - [Bear, 'New entrants compress pricing or slow share gains while APAC approvals remain commercially thin and the software story lags', 'The current discount persists or deepens because the market treats prior 2026 targets as obsolete', 'More likely if refreshed results disappoint or management cannot define a credible competitive response', 'Triggered by margin compression, weak 2026 updates, or another financing round from a weaker negotiating position']
    notes: >-
      Scenarios use directional valuation logic instead of a single point estimate because the assigned pool
      does not contain enough current share-count, consensus, or cap-table evidence for a defensible
      bottom-up valuation model.
    claimRefs: [CV003, CV007, CV008, CV009, CV011, CV012, CV013, CV016]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      The recommendation stays at track because historical profitability and funding proof are real, but the
      latest public evidence still leaves competition, APAC earnings conversion, and refreshed underwriting open.
    data:
      nodes:
        - id: profitable-core
          label: Profitable FY2025 base
          detail: Revenue US$142.4m, adjusted EBITDA US$89.4m, gross margin 85%.
        - id: financed-balance-sheet
          label: Capitalized balance sheet
          detail: IPO package and strategic round reduce immediate funding stress.
        - id: platform-optionality
          label: Platform optionality
          detail: PerfusionWorks and the Data Platform could expand monetization beyond consumables.
        - id: us-competition
          label: US competition
          detail: Management is waiting to see rival pricing, distribution, and customer offer.
        - id: apac-monetization
          label: APAC proof still pending
          detail: New approvals expand reach, but DBS says 2026 earnings impact is likely limited.
        - id: track-call
          label: Track, not buy
          detail: Current price screens cheap versus stale anchors, but refreshed underwriting is incomplete.
      edges:
        - from: profitable-core
          to: financed-balance-sheet
          relationship: Supports downside resilience
        - from: financed-balance-sheet
          to: platform-optionality
          relationship: Funds upside options
        - from: platform-optionality
          to: us-competition
          relationship: Upside must outrun
        - from: us-competition
          to: apac-monetization
          relationship: Keeps focus on execution
        - from: apac-monetization
          to: track-call
          relationship: Leaves price-sensitive but incomplete setup
    approximationNotes: >-
      Flow order reflects decision sequence rather than a quantified causal model or implied probability weight.
    claimRefs: [CV004, CV005, CV006, CV010, CV011, CV013, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Track the discount; do not underwrite it yet
    body: >-
      UltraGreen has enough historical quality and capital support to stay investable, but the assigned pool
      does not yet prove that the October 2026 discount is a valuation mistake rather than a justified de-rating.
    claimRefs: [CV003, CV007, CV008, CV009, CV016]
  - calloutType: assumption
    title: Upgrade trigger is refreshed proof, not narrative
    body: >-
      A move from track to buy would require refreshed FY2026 results, a current fully diluted share count,
      and evidence that US competition is not eroding price, share, or margin.
    claimRefs: [CV003, CV011, CV013, CV016]
  - calloutType: risk
    title: Low price can still be expensive if the old model is stale
    body: >-
      The main risk in buying the discount now is that all public upside markers in this pool are backward-looking
      2026 analyst anchors rather than a refreshed post-competition underwriting set.
    claimRefs: [CV007, CV008, CV009, CV016]
