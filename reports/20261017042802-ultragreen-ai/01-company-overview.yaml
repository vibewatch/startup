figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: UltraGreen's retained milestones trace the move from a legacy ICG platform acquisition into a listed, better-capitalized integrated fluorescence workflow story.
    data:
      items:
        - date: "2015"
          label: "Diagnostic Green platform assembled"
          detail: "The group acquired the fluorescence imaging ICG business from Pulsion Medical Systems, incorporated U.S. and German entities, and began selling ICG to third parties."
          tone: neutral
        - date: "2016"
          label: "Verdye and IC-Flow commercial rollout"
          detail: "The company began selling Verdye outside the U.S. and Canada, while IC-Flow was self-certified and CE marked in the EU."
          tone: positive
        - date: "2018"
          label: "EMEA hub established"
          detail: "Renew Pharmaceuticals Limited was established in Ireland to support marketing, sales, regulatory, supply chain, and customer support functions."
          tone: neutral
        - date: "2023"
          label: "U.S. ICG rights and Perfusion Tech minority stake"
          detail: "Renew Pharmaceuticals acquired the IC-GREEN NDA and UltraGreen also bought a minority interest in Perfusion Tech."
          tone: positive
        - date: "2024"
          label: "Indication and device expansion"
          detail: "The company won additional FDA and CE-recognized approvals, including new IC-GREEN indications and next-generation IC-Flow 2.0 device rollout."
          tone: positive
        - date: "2025-01-17"
          label: "Perfusion Tech acquisition announced"
          detail: "UltraGreen's official site announced the acquisition of Perfusion Tech as part of its quantification push."
          tone: positive
        - date: "2025-06"
          label: "Perfusion Tech fully consolidated"
          detail: "January 2026 analyst material says UltraGreen acquired the remaining equity interest in Perfusion Tech in June 2025, making it a wholly owned subsidiary."
          tone: positive
        - date: "2025-09-15"
          label: "Strategic round completed"
          detail: "UltraGreen announced a US$188 million strategic investment led by 65 Equity Partners and Vitruvian at a US$1.3 billion equity valuation."
          tone: positive
        - date: "2026-01-26"
          label: "Public-market analyst initiation"
          detail: "SGX-hosted January 2026 coverage framed UltraGreen as a global ICG leader with high margins and explicit execution, supply, and regulatory risks."
          tone: neutral
        - date: "2026-04-28"
          label: "Independent governance framing"
          detail: "ICAM's April 2026 initiation argued the governance test is disciplined capital allocation around the proven ICG franchise rather than platform drift."
          tone: warning
    claimRefs: [CO010, CO011, CO014, CO015]
callouts:
  - calloutType: insight
    title: "The platform story is real, but the earnings anchor is still ICG"
    body: "Across the retained official and independent sources, UltraGreen's identity broadens from dye into imaging, quantification, and cloud tooling, but the independent framing still anchors quality, valuation, and execution discipline on the consumables-led ICG franchise."
    claimRefs: [CO002, CO003, CO014]
  - calloutType: risk
    title: "Disclosure precision is still not where a reusable ground-truth chapter should ideally be"
    body: "The retained 2026 materials do not line up on approvals, countries sold, or exact geographic reach, and they do not disclose customer count, headcount, or the full governance terms of the September 2025 financing."
    claimRefs: [CO009, CO010, CO013]
