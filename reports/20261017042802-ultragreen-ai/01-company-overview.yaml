company:
  name: UltraGreen.ai
chapter:
  number: 1
  title: Company Overview
  summary: >-
    UltraGreen.ai presents as a Singapore-headquartered, publicly listed
    fluorescence-guided surgery platform whose current evidence-backed economic
    center remains ICG consumables rather than software. The retained 2025-2026
    sources support a meaningful capital raise, a broader hardware-and-software
    stack, and a credible public-market governance bench, while still leaving
    founding-date provenance, headcount, customer count, and even
    geographic-footprint definitions incomplete or inconsistent.
sections:
  - id: identity-and-platform
    title: Identity, stage, and platform
    body: >-
      UltraGreen.ai is best grounded as a Singapore-headquartered, publicly
      listed healthcare company focused on fluorescence-guided surgery rather
      than as a generic AI-health story. Independent 2026 analyst coverage and
      September 2025 reporting both describe the company as Singapore-based and
      centered on fluorescence-guided surgical technologies, while the official
      product pages frame the commercial stack around ICG dyes, IC-Flow imaging
      hardware, PerfusionWorks quantification software, and UltraGreen Data
      Systems. That matters for the rest of the report because the identity
      surface is broad, but the retained evidence still points to a concrete
      operating core: dye-led workflows supported by hardware, analytics, and
      cloud tooling. The retained official sources are useful for product
      architecture and positioning, but they should be treated as company claims
      unless matched by independent material.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership, governance, and key-person dependence
    body: >-
      The named leadership bench is strong on paper for a newly listed medtech
      issuer. Ravi Sajwan remains central as founder and CEO, and the analyst
      material ties him to multiple prior startup and CTO roles, which supports
      founder-market-fit on technical and company-building dimensions. The board
      chair role is held by Kwa Chong Seng, whose background spans ExxonMobil
      Asia Pacific, DBS, Temasek, and Singapore Exchange, giving the company
      established public-market oversight credentials. Even so, the sharpest
      independent concern is not résumé weakness but post-IPO discipline: ICAM
      explicitly argues that the real governance question is whether management
      reinforces the proven ICG franchise or broadens into software, data, and
      adjacent initiatives faster than the economics justify. That makes Sajwan
      concentration, capital allocation, and strategic scope the main governance
      watchpoints rather than distress or obvious control abuse.
    claimRefs: [CO005, CO006, CO014, CO015]
    tableRefs: [TO002]
  - id: capital-scale-and-milestones
    title: Capitalization, scale signals, and milestone chronology
    body: >-
      The strongest recent balance-sheet signal is the September 2025 strategic
      investment, which multiple retained sources tie to a US$188 million raise
      at a US$1.3 billion equity valuation led by 65 Equity Partners and
      Vitruvian, with August Global Partners participating. Independent January
      2026 coverage also shows a concentrated shareholder base led by Renew
      Group, plus Anchor VI and Verde Taano, which is relevant for both
      governance and future float dynamics. On operating scale, the cleanest
      retained revenue datapoint is the January 2026 analyst model that lists
      2025A revenue of US$142 million versus US$115 million in 2024A. The
      chapter also surfaces an important disclosure inconsistency: official and
      analyst materials do not agree on country approvals and commercial reach,
      citing 35+ approved markets, 54 countries sold, or 40 approvals and 55+
      countries sold. That inconsistency is material because later market,
      customer, and valuation arguments depend on the precise footprint
      definition.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013]
    tableRefs: [TO003]
    figureRefs: [FO001]
