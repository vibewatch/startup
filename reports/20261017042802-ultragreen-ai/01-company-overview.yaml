  evidenceGaps:
    - type: missing-source
      severity: material
      topic: founding-history
      missingEvidence: "A directly cited founding date plus pre-2024 predecessor ownership/control history from filings, prospectus extracts, or another primary corporate-history source in the assigned pool."
      whyItMatters: "Later chapters should not infer original company age, founder tenure, or control continuity from post-2015 milestones alone."
      diligencePath: "Use a primary listing prospectus or historical corporate filing already allocated to this run to anchor incorporation date and predecessor structure."
      relatedQuestionRefs: [QO008]
      relatedTableRefs: [TO002]
    - type: conflicting-data
      severity: material
      topic: geographic-footprint
      missingEvidence: "A single reconciled definition for approvals, registered markets, countries sold, and exemption sales across ICG and IC-Flow."
      whyItMatters: "Market, customer, and valuation chapters can overstate scale if they mix approval counts with commercial availability counts."
      diligencePath: "Obtain one current primary disclosure that breaks out product approvals, exemption sales, and active selling countries on a common date basis."
      relatedQuestionRefs: [QO007]
      relatedTableRefs: [TO001]
    - type: missing-source
      severity: material
      topic: undisclosed-scale-metrics
      missingEvidence: "Current customer-count and headcount disclosures from filings, investor materials, or a verified corporate fact sheet in the assigned pool."
      whyItMatters: "Cover metrics and operating-scale judgments are weaker when neither installed base nor workforce size is directly supportable."
      diligencePath: "Look for retained current investor-relations materials or listing documents that disclose accounts, installed systems, or employee count."
      relatedQuestionRefs: [QO004]
      relatedTableRefs: [TO001]
    - type: private-evidence-only
      severity: minor
      topic: financing-terms
      missingEvidence: "Per-investor allocations, governance rights, and any secondary-versus-primary split for the September 2025 strategic round."
      whyItMatters: "The round amount and valuation are visible, but governance and dilution consequences remain partly opaque."
      diligencePath: "Request the definitive financing announcement, shareholder circular, or investor deck that explains round structure and board rights."
      relatedQuestionRefs: [QO003]
      relatedTableRefs: [TO003]
