evidenceGaps:
  - type: missing-source
    severity: material
    topic: founding-history
    missingEvidence: >-
      A directly cited founding date plus pre-2024 predecessor ownership/control history from filings, prospectus
      extracts, or another primary corporate-history source in the assigned pool.
    whyItMatters: >-
      Later chapters should not infer original company age, founder tenure, or control continuity from post-2015
      milestones alone.
    diligencePath: >-
      Use a primary listing prospectus or historical corporate filing already allocated to this run to anchor
      incorporation date and predecessor structure.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: geographic-footprint
    missingEvidence: >-
      A single reconciled definition for approvals, registered markets, countries sold, and exemption sales across ICG
      and IC-Flow.
    whyItMatters: >-
      Market, customer, and valuation chapters can overstate scale if they mix approval counts with commercial
      availability counts.
    diligencePath: >-
      Obtain one current primary disclosure that breaks out product approvals, exemption sales, and active selling
      countries on a common date basis.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: undisclosed-scale-metrics
    missingEvidence: >-
      Current customer-count and headcount disclosures from filings, investor materials, or a verified corporate fact
      sheet in the assigned pool.
    whyItMatters: >-
      Cover metrics and operating-scale judgments are weaker when neither installed base nor workforce size is directly
      supportable.
    diligencePath: >-
      Look for retained current investor-relations materials or listing documents that disclose accounts, installed
      systems, or employee count.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: minor
    topic: financing-terms
    missingEvidence: >-
      Per-investor allocations, governance rights, and any secondary-versus-primary split for the September 2025
      strategic round.
    whyItMatters: The round amount and valuation are visible, but governance and dilution consequences remain partly opaque.
    diligencePath: >-
      Request the definitive financing announcement, shareholder circular, or investor deck that explains round
      structure and board rights.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sam-som-bridge
    missingEvidence: >-
      A geography-level bridge from clinical procedure opportunity to monetizable SAM/SOM by procedure, average selling
      price, distributor channel, and software attach rate.
    whyItMatters: Without that bridge, public evidence supports directional runway but not a valuation-grade market model.
    diligencePath: >-
      Request management’s regional procedure assumptions, realized vial conversion, and bundled-product attach rates
      used in internal planning.
    relatedQuestionRefs:
      - QM003
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: footprint-definitions
    missingEvidence: >-
      A reconciled market-by-market schedule defining registered, approved, sold, exemption, and regulatory-footprint
      counts on one consistent basis.
    whyItMatters: >-
      Different denominators can overstate adoption and make market-share or expansion claims look cleaner than they
      are.
    diligencePath: >-
      Reconcile IPO materials, analyst notes, and 2026 company updates into one dated territory matrix before relying on
      footprint metrics in valuation work.
    relatedQuestionRefs:
      - QM003
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-mix-and-software-attach
    missingEvidence: >-
      Channel mix by direct account versus distributor-led market, plus software attach rates and budget owners by
      geography and specialty.
    whyItMatters: >-
      The buyer map is directionally clear, but without channel and attach data the upside from software and new
      geographies remains qualitative.
    diligencePath: >-
      Ask management for cohort-level data on distributor concentration, hospital type, specialty mix, and
      PerfusionWorks attachment assumptions.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: >-
      Named peer price sheets, software license terms, distributor discounts, and hospital contract structures across
