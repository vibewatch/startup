    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: cash-runway
    missingEvidence: A dated cash-balance bridge, debt schedule, capex outlook, and management runway view.
    whyItMatters: >-
      Reported net cash is helpful, but it does not establish how much capital remains after inventory, receivables,
      capex, tax, and market-entry spending.
