      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: attach-rates-and-win-loss
    missingEvidence: >-
      Hospital attach rates between dye, imaging, and software plus named competitive win-loss data by procedure and
