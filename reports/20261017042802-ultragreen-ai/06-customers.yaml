company:
  name: UltraGreen.ai
chapter:
  number: 6
  title: Customers
  summary: UltraGreen.ai shows real adoption through growing procedure-linked ICG volume and broad regulatory and channel reach, but the retained evidence identifies wholesalers rather than named hospital deployments. Customer durability therefore rests on repeat consumable use and workflow embedding, while retention, end-customer concentration, and product attach rates remain material diligence gaps.
sections:
  - id: customer-segments
    title: The commercial base is a procedure-linked healthcare ecosystem
    body: |
      UltraGreen.ai serves a multi-party healthcare workflow rather than a conventional software account. Surgeons and operating-room teams use ICG fluorescence during procedures; hospitals and health systems control procurement and budgets; and pharmaceutical wholesalers connect the company to institutional ordering channels. The company also presents imaging hardware and data tools as extensions around the consumable. That segmentation matters because the recurring event is a procedure, not a seat renewal. Current customer quality should therefore be judged through vial use, institutional access, supply reliability, and clinical workflow adoption. Public materials describe the intended beneficiaries and platform logic, but they do not disclose revenue by buyer type, payer, hospital size, or individual account.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
    tableRefs:
      - TU001
  - id: adoption-trajectory
    title: Usage growth is visible, but active-account depth is not
    body: |
      Independent coverage provides the clearest adoption signal: FY2025 ICG volume reached 987.7 thousand vials, up from 872.9 thousand in FY2024, while both volume and average selling price increased. Revenue growth also appeared in both US and non-US markets. These measures show that commercial momentum was not solely a pricing effect, although vial growth cannot distinguish more procedures at existing sites from new account wins. Regulatory reach is also expanding, but the source set uses different denominators for dye approvals, imaging-system clearances, overall footprint, and countries sold into. Those measures should not be collapsed into a single customer count, and none substitutes for active hospitals, utilization per site, or repeat-purchase cohorts.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU010
      - CU011
    tableRefs:
      - TU002
  - id: named-proof-and-concentration
    title: Named proof stops at channel counterparties
    body: |
      The retained sources name Cencora, McKesson, and Cardinal Health as major US wholesalers, but they do not name production hospitals, health systems, or surgeon reference accounts. The three wholesalers represented 68.2% of revenue in 2024 according to DBS and 67.8% in FY2025 according to The SEA Analyst. That persistence supports broad channel access, yet it is a concentration statistic at the intermediary layer rather than proof of a diversified end-customer base. Individual wholesaler shares, downstream hospital concentration, contract duration, and switching behavior remain undisclosed. The result is strong distribution evidence but weak account-level reference quality: public diligence can verify that product moves through scaled channels, not which institutions use it, at what intensity, or with what renewal behavior.
    claimRefs:
      - CU008
      - CU009
      - CU012
    tableRefs:
      - TU003
  - id: durability-and-expansion
    title: Clinical utility supports repeat use, while conversion and retention remain open
    body: |
      Independent clinical evidence strengthens the rationale for hospital adoption in selected procedures. The SAGES systematic review reported lower colorectal anastomotic leak rates with ICG-guided surgery, while also warning that evidence remains limited in several other applications. Commercial durability still requires a separate proof layer. UltraGreen.ai itself cautions that regulatory approval does not establish launch, customer adoption, or market penetration, and independent analysis notes that surgeons and hospitals can change practice slowly. The credible expansion loop is therefore evidence to approval, institutional procurement, procedure-level repeat use, and only then hardware or data-platform attachment. Public sources support each strategic surface, but they do not quantify conversion rates, NRR, GRR, churn, renewals, contracts, or cross-product attach rates.
    claimRefs:
      - CU013
      - CU014
      - CU015
      - CU016
    figureRefs:
      - FU001
