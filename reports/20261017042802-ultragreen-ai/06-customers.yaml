    - type: conflicting-data
      severity: material
      topic: geographic-footprint
      missingEvidence: A reconciled bridge among dye approvals, imaging-system clearances, regulatory footprint, countries marketed, and countries with current sales.
      whyItMatters: Different geographic denominators can overstate commercial adoption if regulatory access is presented as active customer coverage.
      diligencePath: Obtain a country-by-country schedule showing approval status, launch date, channel partner, active accounts, revenue, and product availability.
