      whyItMatters: Aggregate channel reach can conceal dependence on a few intermediaries or weak conversion into the broader platform.
      diligencePath: Request top-20 customer and distributor schedules plus product-level cross-sell and attach-rate analysis for FY2024 through 2026 year to date.
