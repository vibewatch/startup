figures:
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: The defensible sequence runs from clinical evidence and clearance through channel access and repeat procedures; platform expansion comes only after institutional adoption.
    data:
      items:
        - label: Clinical evidence
          stage: Demand foundation
          detail: Independent evidence supports selected ICG-guided surgical outcomes, while other applications remain less certain.
          touchpoints:
            - SAGES systematic review
            - Procedure-specific outcomes
        - label: Regulatory clearance
          stage: Market access
          detail: Dye approval and imaging-system clearance permit commercialization but do not establish customer adoption.
          touchpoints:
            - Verdye approvals
            - IC-Flow clearances
        - label: Channel access
          stage: Procurement access
          detail: Major wholesalers place the consumable inside institutional ordering channels.
          touchpoints:
            - Cencora
            - McKesson
            - Cardinal Health
        - label: Hospital adoption
          stage: Workflow conversion
          detail: Surgeons and procurement teams must incorporate fluorescence into clinical and purchasing routines.
          touchpoints:
            - Training and familiarity
            - Institutional procurement
        - label: Repeat procedures
          stage: Core durability
          detail: Procedure-linked vial demand is the observable recurring economic motion.
          touchpoints:
            - Reorders
            - Utilization depth
        - label: Platform expansion
          stage: Optional expansion
          detail: Imaging and data tools may deepen workflow attachment, but attach rates and production deployments are not disclosed.
          touchpoints:
            - Imaging hardware
            - Quantification software
    approximationNotes: This is an evidence-based conceptual sequence, not a measured conversion funnel; no stage-to-stage rates are publicly disclosed.
    claimRefs:
      - CU002
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
callouts:
  - calloutType: risk
    title: Channel concentration is not end-customer concentration
    body: Three named wholesalers represented roughly two-thirds of revenue in both 2024 and FY2025, but the source set does not disclose their individual shares or the hospitals behind them.
    claimRefs:
      - CU008
      - CU009
  - calloutType: insight
    title: Approval expands the addressable surface, not the installed base
    body: Company disclosures distinguish regulatory permission from commercial launch and adoption, so country approvals should not be reported as customers or active deployments.
    claimRefs:
      - CU010
      - CU011
      - CU012
