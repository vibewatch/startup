      - Evidence boundary
    rows:
      - - Surgical users
        - Surgeons and operating-room teams use the product; hospitals or health systems procure it
        - Real-time fluorescence visualization during surgery
        - Repeat procedure use is the core economic event
        - No surgeon, specialty, or active-user counts are disclosed
      - - Institutional buyers
        - Hospital procurement and clinical leadership; payer allocation is not disclosed
        - Purchase ICG and compatible imaging capability for established workflows
        - Institutional workflow embedding can support repeat demand
        - No named hospital, account size, contract term, or utilization data are disclosed
      - - Pharmaceutical channel
        - Wholesalers and distributors intermediate access to hospital ordering systems
        - Logistics, inventory, ordering, and credit access
        - Three major US wholesalers carried a large aggregate revenue share
        - Aggregate channel share is not an end-customer concentration measure
      - - Expansion institutions
        - Healthcare institutions, teaching sites, and clinical partners in newer markets
        - Regional commercialization, training, and adoption seeding
        - Singapore approval creates a new commercialization surface
        - Named partners, live deployments, and revenue contribution are not disclosed
    notes: Segmentation combines company descriptions of intended users with independent analysis of the procedure-linked model; buyer-level revenue and payer responsibility are not publicly quantified.
