chapter:
  number: 2
  title: "Market Analysis"
  summary: |
    UltraGreen’s market is narrower than a generic “surgical AI” label and broader than a single dye SKU: it is the fluorescence-guided surgery workflow spanning recurring ICG consumables, compatible imaging systems, and emerging quantification software. Public evidence supports meaningful runway—U.S. penetration remains below 25% of eligible procedures and APAC is the fastest-growing regional lens—but the assigned source pool still does not disclose a reconciled public SAM/SOM bridge from clinical demand to monetizable revenue by geography and product layer.
sections:
  - id: "market-boundary"
    title: "Market boundary: fluorescence-guided surgery, not all surgery"
    body: |
      UltraGreen’s relevant market is the fluorescence-guided surgery workflow, not general hospital IT or all surgical spending. The company’s own positioning combines an ICG fluorescence agent with near-infrared imaging, quantification software, and AI-enabled analytics, while independent coverage still shows that the recurring economic core is the consumable dye used during procedures. That matters for valuation: most surgical spend remains outside the addressable pool unless a procedure uses fluorescence, the site has compatible imaging, and the workflow supports repeat ICG usage. The closest status-quo substitute is still white-light or non-fluorescence surgery, while the closest adjacent alternatives are hardware-bundled fluorescence offerings that may not compete for every hospital account. This boundary keeps the chapter from treating “surgical AI” as synonymous with UltraGreen’s addressable market.
    claimRefs: ["CM001", "CM002", "CM003", "CM010"]
    tableRefs: ["TM001"]
  - id: "sizing-lenses"
    title: "Sizing lenses point to runway, but not a clean public SAM/SOM"
    body: |
      The strongest public evidence supports multiple sizing lenses rather than a single clean TAM/SAM/SOM stack. Independent analysis citing Frost & Sullivan says U.S. fluorescence-guided surgery penetration remains below 25% of eligible procedures, while Asia-Pacific is forecast to be the fastest-growing regional ICG market through 2030. Company and IPO reporting add a second lens: UltraGreen had sold dye products in 54 countries from 2022 through the first half of 2025 and shipped 5.3 million vials since 2015, which shows meaningful real-world adoption but not the total remaining opportunity. A third lens comes from management commentary relayed by ValueZoomer, which frames 10 million annual U.S. addressable procedures against 670,000 vials sold last year. That signals headroom, but it is still not a reconciled, auditable SAM/SOM model by geography, price, attach rate, and product bundle.
    claimRefs: ["CM004", "CM005", "CM006", "CM007", "CM008", "CM011", "CM015"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "buyers-and-adoption"
    title: "Buyers, users, and adoption path"
    body: |
      The end user is the surgeon and operating team, but adoption and monetization move through a more layered buyer path. UltraGreen’s sources emphasize surgeon education, KOL relationships, dosing guidance, and workflow standardization because clinical pull is required before a hospital expands fluorescence usage. Commercial conversion, however, still depends on hospital procurement, reimbursement logic, installed imaging systems, and distributor execution in local markets. The buyer map also differs by product layer: dye purchasing behaves like a recurring procedural consumable, imaging behaves more like capital equipment access, and software depends on whether hospitals want quantitative reporting and data integration. This explains why the market can be clinically broad but commercially uneven across countries, specialties, and account types.
    claimRefs: ["CM009", "CM010", "CM012", "CM013"]
    tableRefs: ["TM003"]
  - id: "constraints-and-gaps"
    title: "Constraints and unresolved diligence gaps"
    body: |
      The key market constraint is not whether ICG works in principle; it is how quickly hospitals, regulators, and competing suppliers convert that clinical utility into repeatable commercial adoption. DBS’s March 2026 note makes that visible in APAC: imaging-system approvals expanded, but the dye remained registered only in the Philippines among the newly approved territories, keeping near-term revenue contribution small. Competitive entry risk is also real. UltraGreen’s August 2026 shareholder update confirms new U.S. approvals for rival suppliers, even as management argues that approval alone does not prove launch or penetration. Finally, public footprint statistics are not yet normalized across “registered,” “approved,” “sold,” “exemption,” and “regulatory footprint” definitions, so any market-share or adoption model built from those numbers still needs management reconciliation before it can support a valuation-grade market map.
    claimRefs: ["CM008", "CM014", "CM015"]
