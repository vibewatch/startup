company:
  name: "UltraGreen.ai"
chapter:
  number: 3
  title: "Competitors"
  summary: >-
    UltraGreen competes less as a single device vendor than as a vertically integrated
    fluorescence-guided-surgery stack spanning ICG consumables, imaging hardware, and
    quantification software. The retained evidence supports a consumables-led moat and
    increasing workflow breadth, but substitute workflows such as Tc-99m mapping and
    entrenched white-light surgery still matter because clinical superiority remains
    procedure-specific and procurement-level pricing is still opaque.
sections:
  - id: "competitive-landscape"
    title: "Competitive set is a workflow stack, not one direct SKU peer"
    body: >-
      The retained evidence points to a layered competitive landscape rather than a
      clean one-company peer set. UltraGreen describes itself as combining a trusted
      ICG agent, fluorescence imaging, quantification software, and AI-enabled analytics,
      while independent commentary frames the same stack as three value layers:
      consumables, imaging systems, and software. That means the company is exposed to
      several alternative solution classes at once: regional ICG suppliers, installed
      imaging platforms that can embed fluorescence capability, stand-alone perfusion
      quantification tools, and status-quo non-fluorescence workflows. The competitive
      question is therefore whether hospitals buy into a broader data-backed fluorescence
      workflow or stay with narrower procedural substitutes that solve only one step.
    claimRefs: ["CP001", "CP005", "CP012", "CP013", "CP014"]
    tableRefs: ["TP001"]
    figureRefs: ["FP001"]
  - id: "consumables-moat-and-incumbent-pressure"
    title: "The moat is strongest in consumables scale and regulatory breadth"
    body: >-
      The strongest evidence for defensibility sits in ICG consumables rather than
      hardware alone. FSM Global says UltraGreen held approximately 68% of global ICG
      vial volume and 63% of industry revenue in 2024, with especially strong US and
      European share, and it describes competing manufacturers as more regional with
      narrower approvals and distribution. The same report argues that approvals can
      take years, and that hospital procurement relationships and surgeon familiarity
      make displacement slow once a vendor is embedded. UltraGreen's own 2026 update
      reinforces the breadth point by citing 41 Verdye countries and 45 IC-Flow markets,
      which widens the installed territory a smaller rival would need to match.
    claimRefs: ["CP002", "CP003", "CP004", "CP005", "CP011"]
    tableRefs: ["TP002"]
  - id: "workflow-tradeoffs-and-substitutes"
    title: "Workflow breadth helps, but substitutes still win on some procedures"
    body: >-
      The acquisition of Perfusion Tech matters because it shifts the comparison from
      image visibility alone toward objective perfusion quantification and structured
      workflow data. Biospectrum Asia and Perfusion Tech both describe the combined
      offering as moving toward standardised, reproducible decision support, while
      UltraGreen's own pipeline language explicitly frames the goal as turning qualitative
      imaging into quantified insight. Even so, substitute workflows remain credible.
      In early-breast-cancer sentinel-node mapping, the Frontiers study reported a
      90.6% per-patient detection rate for ICG alone versus 97.1% for Tc-99m and 98.1%
      for the combined technique, showing that legacy nuclear-medicine pathways can still
      outperform on specific tasks even when ICG has workflow and safety advantages.
    claimRefs: ["CP006", "CP007", "CP009", "CP010", "CP012"]
    tableRefs: ["TP003"]
  - id: "durability-and-open-competitive-risks"
    title: "Durability rests on adoption breadth, but evidence is not universal"
    body: >-
      The chapter's best positive case is that UltraGreen can pair recurring
      per-procedure consumables with expanding imaging and software layers, while
      robotics adoption and new approvals increase the number of sites able to use
      fluorescence-guided workflows. The main counterpoint is that the clinical and
      operational case is uneven across procedures. The SAGES systematic review says
      FIGS with ICG improves some applications, especially colorectal leak reduction,
      but that evidence remains limited or context-specific elsewhere and access is still
      constrained in many settings. That leaves the moat real but not absolute: the
      company appears differentiated where buyers value a full fluorescence stack, yet
      procurement, pricing, attach-rate, and procedure-by-procedure superiority data
      remain missing from public evidence.
    claimRefs: ["CP008", "CP010", "CP011", "CP013", "CP014"]
