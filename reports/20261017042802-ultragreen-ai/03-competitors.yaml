        - { label: "White-light status quo", x: 1, y: 5 }
    approximationNotes: >-
      Axes use evidence-backed 1-5 ordinal scores derived from sourced stack breadth,
      installed workflow presence, procedural default status, and disclosed regulatory
      footprint; they are comparative heuristics, not measured market-share outputs.
    claimRefs: ["CP001", "CP003", "CP004", "CP005", "CP006", "CP009", "CP011", "CP012"]
callouts:
  - calloutType: "insight"
    title: "The competitive battle is workflow-level"
    body: >-
      The key competition is not simply one dye versus another. UltraGreen is trying to
      sell a stack that pairs recurring ICG demand with imaging, quantification, and a
      future data layer, while many alternatives solve only one part of the workflow.
    claimRefs: ["CP001", "CP006", "CP012", "CP013"]
  - calloutType: "risk"
    title: "Public evidence still misses procurement proof"
    body: >-
      The public record is strong on platform narrative and market-breadth claims, but it
      remains thin on direct pricing, attach rates, and named competitive win-loss data.
      That limits confidence about how much of the stack advantage is already monetized.
    claimRefs: ["CP005", "CP008", "CP013", "CP014"]
