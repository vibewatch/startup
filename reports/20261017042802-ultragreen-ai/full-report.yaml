      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >
              The end user is the surgeon and operating team, but adoption and monetization move through a more layered
              buyer path. UltraGreen’s sources emphasize surgeon education, KOL relationships, dosing guidance, and
              workflow standardization because clinical pull is required before a hospital expands fluorescence usage.
              Commercial conversion, however, still depends on hospital procurement, reimbursement logic, installed
              imaging systems, and distributor execution in local markets. The buyer map also differs by product layer:
              dye purchasing behaves like a recurring procedural consumable, imaging behaves more like capital equipment
              access, and software depends on whether hospitals want quantitative reporting and data integration. This
              explains why the market can be clinically broad but commercially uneven across countries, specialties, and
              account types.
            claimRefs:
              - CM009
              - CM010
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM007
              - CM009
              - CM010
              - CM013
      - number: '2.4'
        title: Constraints and unresolved diligence gaps
        blocks:
          - type: paragraph
            body: >
              The key market constraint is not whether ICG works in principle; it is how quickly hospitals, regulators,
              and competing suppliers convert that clinical utility into repeatable commercial adoption. DBS’s March
              2026 note makes that visible in APAC: imaging-system approvals expanded, but the dye remained registered
              only in the Philippines among the newly approved territories, keeping near-term revenue contribution
              small. Competitive entry risk is also real. UltraGreen’s August 2026 shareholder update confirms new U.S.
              approvals for rival suppliers, even as management argues that approval alone does not prove launch or
              penetration. Finally, public footprint statistics are not yet normalized across “registered,” “approved,”
              “sold,” “exemption,” and “regulatory footprint” definitions, so any market-share or adoption model built
              from those numbers still needs management reconciliation before it can support a valuation-grade market
              map.
            claimRefs:
              - CM008
              - CM014
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive set is a workflow stack, not one direct SKU peer
        blocks:
          - type: paragraph
            body: >-
              The retained evidence points to a layered competitive landscape rather than a clean one-company peer set.
              UltraGreen describes itself as combining a trusted ICG agent, fluorescence imaging, quantification
              software, and AI-enabled analytics, while independent commentary frames the same stack as three value
              layers: consumables, imaging systems, and software. That means the company is exposed to several
              alternative solution classes at once: regional ICG suppliers, installed imaging platforms that can embed
              fluorescence capability, stand-alone perfusion quantification tools, and status-quo non-fluorescence
              workflows. The competitive question is therefore whether hospitals buy into a broader data-backed
              fluorescence workflow or stay with narrower procedural substitutes that solve only one step.
