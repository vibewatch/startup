  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Consumables drive the disclosed economics
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a consumables-led revenue model rather than a balanced three-line mix.
              UltraGreen’s investor page reported FY2025 revenue of US$142.4 million and adjusted EBITDA of US$89.4
              million, while the same investor surface and third-party summaries put FY2025 gross margin at roughly 85%.
              Independent analyst coverage described the current business as mainly driven by recurring ICG consumables,
              which matters because recurring dye usage is the only clearly evidenced engine converting procedure volume
              into repeat revenue today. Official company materials also position imaging hardware, quantification
              software, and AI analytics as part of the platform, but the assigned evidence does not disclose separate
              revenue contribution, ASPs, attach rates, or paying-software penetration. That leaves hardware and
              software as strategically important but financially under-specified layers on top of a strong consumables
              core.
