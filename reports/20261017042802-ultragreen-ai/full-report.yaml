          approvals still lag
        - A view change requires dye approvals and commercial conversion, not just device clearances
    notes: >-
      Rows intentionally mix factual proof and decision criteria; each row states what specific public evidence would
      move the investment view rather than repeating generic diligence advice.
    claimRefs:
      - CV001
      - CV004
      - CV005
      - CV006
      - CV010
