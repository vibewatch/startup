      - number: '4.2'
        title: Capital exists, but forward earnings conversion is still conditional
        blocks:
          - type: paragraph
            body: >-
              The public record shows multiple capital milestones, but not a fully underwritable runway model. At IPO
              launch, press coverage said UltraGreen marketed about 112 million shares at US$1.45, with roughly US$150
              million of gross proceeds due to the company; management also framed the proceeds as funding core product
              development, geographic expansion, and working capital. Before listing, Allen & Gledhill described an
              October 2025 secondary sale at a US$1.3 billion equity valuation, and a later analyst summary reported
              FY2025 net cash of US$173.0 million. That means capital adequacy is better supported than burn or runway,
              yet the next leg of earnings is not frictionless: Tickrs highlighted a sharp rise in effective tax rate,
              and DBS argued new APAC device approvals mainly create option value until the core ICG dye is approved in
              the same markets and revenue scales beyond a small base.
