      - number: '3.3'
        title: Workflow breadth helps, but substitutes still win on some procedures
        blocks:
          - type: paragraph
            body: >-
              The acquisition of Perfusion Tech matters because it shifts the comparison from image visibility alone
              toward objective perfusion quantification and structured workflow data. Biospectrum Asia and Perfusion
              Tech both describe the combined offering as moving toward standardised, reproducible decision support,
              while UltraGreen's own pipeline language explicitly frames the goal as turning qualitative imaging into
              quantified insight. Even so, substitute workflows remain credible. In early-breast-cancer sentinel-node
              mapping, the Frontiers study reported a 90.6% per-patient detection rate for ICG alone versus 97.1% for
              Tc-99m and 98.1% for the combined technique, showing that legacy nuclear-medicine pathways can still
              outperform on specific tasks even when ICG has workflow and safety advantages.
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP010
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP006
              - CP009
              - CP010
              - CP012
      - number: '3.4'
        title: Durability rests on adoption breadth, but evidence is not universal
        blocks:
          - type: paragraph
            body: >-
              The chapter's best positive case is that UltraGreen can pair recurring per-procedure consumables with
              expanding imaging and software layers, while robotics adoption and new approvals increase the number of
              sites able to use fluorescence-guided workflows. The main counterpoint is that the clinical and
              operational case is uneven across procedures. The SAGES systematic review says FIGS with ICG improves some
              applications, especially colorectal leak reduction, but that evidence remains limited or context-specific
              elsewhere and access is still constrained in many settings. That leaves the moat real but not absolute:
              the company appears differentiated where buyers value a full fluorescence stack, yet procurement, pricing,
              attach-rate, and procedure-by-procedure superiority data remain missing from public evidence.
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The competitive battle is workflow-level
            body: >-
              The key competition is not simply one dye versus another. UltraGreen is trying to sell a stack that pairs
              recurring ICG demand with imaging, quantification, and a future data layer, while many alternatives solve
              only one part of the workflow.
            calloutType: insight
            claimRefs:
              - CP001
              - CP006
              - CP012
              - CP013
          - type: callout
            title: Public evidence still misses procurement proof
            body: >-
              The public record is strong on platform narrative and market-breadth claims, but it remains thin on direct
              pricing, attach rates, and named competitive win-loss data. That limits confidence about how much of the
              stack advantage is already monetized.
            calloutType: risk
            claimRefs:
