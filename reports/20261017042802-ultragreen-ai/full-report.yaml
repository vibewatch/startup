      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              The named leadership bench is strong on paper for a newly listed medtech issuer. Ravi Sajwan remains
              central as founder and CEO, and the analyst material ties him to multiple prior startup and CTO roles,
              which supports founder-market-fit on technical and company-building dimensions. The board chair role is
              held by Kwa Chong Seng, whose background spans ExxonMobil Asia Pacific, DBS, Temasek, and Singapore
              Exchange, giving the company established public-market oversight credentials. Even so, the sharpest
              independent concern is not résumé weakness but post-IPO discipline: ICAM explicitly argues that the real
              governance question is whether management reinforces the proven ICG franchise or broadens into software,
              data, and adjacent initiatives faster than the economics justify. That makes Sajwan concentration, capital
              allocation, and strategic scope the main governance watchpoints rather than distress or obvious control
              abuse.
