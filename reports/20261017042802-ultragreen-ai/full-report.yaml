  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Integrated product stack
        blocks:
          - type: paragraph
            body: >
              The product set in the assigned pool is broader than a single indocyanine green vial. Company-controlled
              and third-party materials consistently describe a stack that starts with ICG consumables, extends into
              near-infrared imaging hardware, and aims to add quantification software and data infrastructure around the
              surgical workflow. The official May 2026 Verdye release says the company is building a "comprehensive
              fluorescence-guided surgery ecosystem" that combines pharmaceutical products, compatible imaging hardware,
              and AI-powered data platforms, while the prospectus and analyst coverage describe the same architecture as
              a vertically integrated model rather than a pure consumables business. That matters because it changes
              both the moat narrative and the diligence surface: the business is not only selling dye into existing
              procedures, it is trying to influence clinical workflow, imaging capture, interpretation, and eventually
              structured post-operative data.


              The stack is also segmented by maturity. The consumable layer is the most established, with IC-GREEN in
              the US and Verdye outside the Americas positioned as the core clinical inputs. Imaging hardware appears
              commercially tangible as well: independent coverage and company-linked approval notices both describe
              IC-Flow V2 as a handheld near-infrared system used intraoperatively for perfusion and lymphatic
              visualization. The software and data layers look earlier and more strategic than proven at scale. Public
              materials emphasize PerfusionWorks, quantification, structured reports, and AI-powered insights, but the
              assigned pool provides much less implementation detail on integration depth, installed-base adoption,
              release cadence, or support ownership than it does on the dye and device layers.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE009
      - number: '5.2'
        title: Workflow and operating architecture
        blocks:
          - type: paragraph
            body: >
              The operating model implied by the assigned evidence follows the intraoperative workflow. ICG is
              administered using procedure-specific timing and dosing protocols; near-infrared imaging then captures the
              fluorescence signal; quantification software is meant to reduce subjective interpretation; and a
              cloud/data layer is intended to turn fluorescence observations into structured reports and reusable
              datasets. The ISFGS dosing chart is particularly useful here because it shows that clinical use depends on
              disciplined protocol choices by procedure, dose, route, and timing rather than on a generic "AI surgery"
              abstraction. In other words, Ultragreen's software ambitions sit on top of a clinical workflow that
              already has technique-specific operating constraints.


              The software ambition is most explicit in the company's product pages and the Perfusion Tech acquisition
              announcement. The Innovation Pipeline page says the company is "moving qualitative assessment to
              quantitative, standardized insights" and building a cloud platform that integrates with hospital systems.
              The clinical-research page adds that PerfusionWorks and UltraGreen Data Systems are intended to turn
              fluorescence into objective metrics and post-operative review capability, while the Perfusion Tech
              announcement describes real-time visualization, quantitative analytics, cloud-based data management, and
              AI-powered insights as one platform. That set of claims is coherent enough to author an architecture
              figure, but not detailed enough to validate data models, deployment models, or software assurance controls
              from public evidence alone.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE004
