      - number: '4.3'
        title: 'Verdict: high-quality gross margin, low transparency on unit economics'
        blocks:
          - type: paragraph
            body: >-
              The best-supported conclusion is that UltraGreen already operates a profitable, high-margin model anchored
              in recurring ICG consumables and global geographic reach. What is not public is equally important: the
              assigned sources do not provide realized dye pricing, hardware ASPs, software contract structure, CAC,
              payback, sales-cycle duration, customer concentration, distributor concentration, or a bridge from net
              cash to runway. The latest disclosed share price, materially below the IPO price, does not prove a funding
              shortfall, but it does suggest any future equity financing would happen from a weaker market position than
              at listing. For diligence, the chapter should therefore be read as positive on revenue quality and margin
              structure, but cautious on forward underwriting because capital intensity and commercial efficiency are
              still opaque in public materials.
            claimRefs:
              - CI003
              - CI004
              - CI010
              - CI016
              - CI017
