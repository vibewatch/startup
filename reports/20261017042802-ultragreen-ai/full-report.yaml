  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: fluorescence-guided surgery, not all surgery'
        blocks:
          - type: paragraph
            body: >
              UltraGreen’s relevant market is the fluorescence-guided surgery workflow, not general hospital IT or all
              surgical spending. The company’s own positioning combines an ICG fluorescence agent with near-infrared
              imaging, quantification software, and AI-enabled analytics, while independent coverage still shows that
              the recurring economic core is the consumable dye used during procedures. That matters for valuation: most
              surgical spend remains outside the addressable pool unless a procedure uses fluorescence, the site has
              compatible imaging, and the workflow supports repeat ICG usage. The closest status-quo substitute is still
              white-light or non-fluorescence surgery, while the closest adjacent alternatives are hardware-bundled
              fluorescence offerings that may not compete for every hospital account. This boundary keeps the chapter
              from treating “surgical AI” as synonymous with UltraGreen’s addressable market.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM009
              - CM010
      - number: '2.2'
        title: Sizing lenses point to runway, but not a clean public SAM/SOM
        blocks:
          - type: paragraph
            body: >
              The strongest public evidence supports multiple sizing lenses rather than a single clean TAM/SAM/SOM
              stack. Independent analysis citing Frost & Sullivan says U.S. fluorescence-guided surgery penetration
              remains below 25% of eligible procedures, while Asia-Pacific is forecast to be the fastest-growing
              regional ICG market through 2030. Company and IPO reporting add a second lens: UltraGreen had sold dye
              products in 54 countries from 2022 through the first half of 2025 and shipped 5.3 million vials since
              2015, which shows meaningful real-world adoption but not the total remaining opportunity. A third lens
              comes from management commentary relayed by ValueZoomer, which frames 10 million annual U.S. addressable
              procedures against 670,000 vials sold last year. That signals headroom, but it is still not a reconciled,
              auditable SAM/SOM model by geography, price, attach rate, and product bundle.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM011
              - CM015
