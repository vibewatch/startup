  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Probability signal
      - Downside / trigger
    rows:
      - - Bull
        - >-
          US competition proves manageable, FY2026 results hold the high-margin profile, and platform milestones begin
          to monetize
        - >-
          Shares re-rate toward or above the cited 2026 analyst range because the market accepts software/platform
          upside on top of the consumables base
        - Needs refreshed numbers plus visible commercial proof, not just narrative
        - Fails if pricing pressure or weaker margins show the old targets were structurally stale
      - - Base
        - >-
          Core business remains profitable but the market waits for cleaner proof on competition, APAC scaling, and
          software monetization
        - Track stance persists; upside exists, but price alone does not justify a full underwriting leap
        - Most consistent with assigned evidence because both thesis and anti-thesis are real
        - Stays stuck if public disclosures remain incomplete
      - - Bear
        - >-
          New entrants compress pricing or slow share gains while APAC approvals remain commercially thin and the
          software story lags
        - The current discount persists or deepens because the market treats prior 2026 targets as obsolete
        - More likely if refreshed results disappoint or management cannot define a credible competitive response
        - >-
          Triggered by margin compression, weak 2026 updates, or another financing round from a weaker negotiating
          position
    notes: >-
      Scenarios use directional valuation logic instead of a single point estimate because the assigned pool does not
      contain enough current share-count, consensus, or cap-table evidence for a defensible bottom-up valuation model.
    claimRefs:
      - CV003
      - CV007
      - CV008
      - CV009
      - CV011
      - CV012
      - CV013
      - CV016
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      UltraGreen's retained milestones trace the move from a legacy ICG platform acquisition into a listed,
      better-capitalized integrated fluorescence workflow story.
    data:
      items:
        - date: '2015'
          label: Diagnostic Green platform assembled
          detail: >-
            The group acquired the fluorescence imaging ICG business from Pulsion Medical Systems, incorporated U.S. and
            German entities, and began selling ICG to third parties.
          tone: neutral
        - date: '2016'
          label: Verdye and IC-Flow commercial rollout
          detail: >-
            The company began selling Verdye outside the U.S. and Canada, while IC-Flow was self-certified and CE marked
            in the EU.
          tone: positive
        - date: '2018'
          label: EMEA hub established
          detail: >-
            Renew Pharmaceuticals Limited was established in Ireland to support marketing, sales, regulatory, supply
            chain, and customer support functions.
          tone: neutral
        - date: '2023'
          label: U.S. ICG rights and Perfusion Tech minority stake
          detail: >-
            Renew Pharmaceuticals acquired the IC-GREEN NDA and UltraGreen also bought a minority interest in Perfusion
            Tech.
          tone: positive
        - date: '2024'
          label: Indication and device expansion
          detail: >-
            The company won additional FDA and CE-recognized approvals, including new IC-GREEN indications and
            next-generation IC-Flow 2.0 device rollout.
          tone: positive
        - date: '2025-01-17'
          label: Perfusion Tech acquisition announced
          detail: UltraGreen's official site announced the acquisition of Perfusion Tech as part of its quantification push.
          tone: positive
        - date: 2025-06
          label: Perfusion Tech fully consolidated
          detail: >-
            January 2026 analyst material says UltraGreen acquired the remaining equity interest in Perfusion Tech in
            June 2025, making it a wholly owned subsidiary.
          tone: positive
        - date: '2025-09-15'
          label: Strategic round completed
          detail: >-
            UltraGreen announced a US$188 million strategic investment led by 65 Equity Partners and Vitruvian at a
            US$1.3 billion equity valuation.
          tone: positive
        - date: '2026-01-26'
          label: Public-market analyst initiation
          detail: >-
            SGX-hosted January 2026 coverage framed UltraGreen as a global ICG leader with high margins and explicit
            execution, supply, and regulatory risks.
          tone: neutral
        - date: '2026-04-28'
          label: Independent governance framing
          detail: >-
            ICAM's April 2026 initiation argued the governance test is disciplined capital allocation around the proven
            ICG franchise rather than platform drift.
          tone: warning
    claimRefs:
      - CO010
      - CO011
      - CO014
      - CO015
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      Public evidence supports an adoption stack of procedure breadth, penetration, regional growth, regulatory access,
      and realized commercial footprint rather than one disclosed TAM/SAM/SOM waterfall.
    data:
      items:
        - label: Clinical breadth
          displayValue: 10 named procedure families
          detail: >-
            ISFGS guidance spans breast, colorectal, endocrine, foregut, gynecological, hepatobiliopancreatic, liver,
            pediatric, plastic, and surgical oncology workflows.
        - label: U.S. penetration gap
          displayValue: <25% of eligible procedures
          detail: >-
            Beansprout cites Frost & Sullivan saying U.S. fluorescence-guided surgery penetration remains early despite
            clinical validation.
        - label: APAC growth lens
          displayValue: 16.6% CAGR (2024-2030)
          detail: >-
            The same analysis expects Asia-Pacific to be the fastest-growing ICG region as surgical volumes and
            infrastructure expand.
        - label: APAC share shift
          displayValue: ≈9% to 14%
          detail: Projected regional share gain of the global ICG market over the same 2024-2030 window.
        - label: Regulatory readiness
          displayValue: 41 Verdye countries / 45 IC-Flow markets
          detail: >-
            Official May 2026 data shows footprint growth, but DBS still treats dye approvals as the real revenue gate
            in new APAC territories.
        - label: Current monetization lens
          displayValue: 10m U.S. procedures vs 670k vials
          detail: >-
            ValueZoomer relays management’s opportunity framing, which signals headroom but not a reconciled public
            SAM/SOM model.
    approximationNotes: >-
      This pyramid combines different public denominators—procedure families, penetration, regional share, approvals,
      and vial volume—because the assigned source pool does not contain a single reconciled TAM/SAM/SOM bridge.
    claimRefs:
      - CM002
      - CM004
      - CM005
      - CM007
      - CM010
      - CM011
  - id: FP001
    title: Competitive positioning by workflow breadth and procedural embedment
    type: quadrant
    summary: >-
      UltraGreen scores highest on integrated workflow breadth, while substitutes and incumbents retain meaningful
      procedural footholds through installed workflow or default adoption.
    data:
      xAxis:
        label: Workflow integration breadth
        min: 1
        max: 5
        lowLabel: Single-layer
        highLabel: Full-stack
        description: 1 = one workflow component; 5 = agent, imaging, software, and data loop combined.
        scale: ordinal
      yAxis:
        label: Procedural embedment / adoption leverage
        min: 1
        max: 5
        lowLabel: Niche
        highLabel: Embedded
        description: 1 = narrow or emerging use; 5 = broad installed base or default workflow presence.
        scale: ordinal
      points:
        - label: UltraGreen integrated platform
          x: 5
          'y': 4
        - label: Regional ICG manufacturers
          x: 2
          'y': 2
        - label: Perfusion quantification software
          x: 3
          'y': 2
        - label: Robotic imaging modules
          x: 3
          'y': 5
        - label: Tc-99m mapping
          x: 2
          'y': 4
        - label: White-light status quo
          x: 1
          'y': 5
    approximationNotes: >-
      Axes use evidence-backed 1-5 ordinal scores derived from sourced stack breadth, installed workflow presence,
      procedural default status, and disclosed regulatory footprint; they are comparative heuristics, not measured
      market-share outputs.
    claimRefs:
      - CP001
      - CP003
      - CP004
      - CP005
      - CP006
      - CP009
      - CP011
      - CP012
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence supports a consumables-led bridge from fluorescence procedure demand into repeat dye revenue and
      high gross profit, with hardware and software positioned as scaling layers rather than disclosed co-equal revenue
      contributors.
    data:
      nodes:
        - id: procedure-demand
          label: Fluorescence-guided surgery demand
          note: Procedure adoption is the activity base for every monetization path.
        - id: icg-use
          label: Recurring ICG vial use
          value: 68% global vial share / 63% revenue share
          note: Analyst coverage positions ICG as the dominant current franchise.
        - id: consumables-revenue
          label: Consumables revenue engine
          value: FY2025 revenue US$142.4m
          note: Third-party coverage says recurring ICG consumables are the current business driver.
        - id: device-layer
          label: IC-Flow imaging placements
          note: Device approvals broaden future reach but do not yet imply material near-term earnings contribution in APAC.
        - id: software-layer
          label: Quantification software / Data Platform
          note: >-
            Official materials present software and AI as monetization optionality, without public standalone revenue
            disclosure.
        - id: gross-profit
          label: Gross profit pool
          value: FY2025 gross margin about 85%
          note: Public evidence points to strong gross economics even though full unit-economics detail is missing.
      edges:
        - from: procedure-demand
          to: icg-use
          label: drives
        - from: icg-use
          to: consumables-revenue
          label: converts to
        - from: procedure-demand
          to: device-layer
          label: also supports
        - from: device-layer
          to: software-layer
          label: creates data / workflow opportunity for
        - from: consumables-revenue
          to: gross-profit
          label: currently contributes most clearly to
        - from: software-layer
          to: gross-profit
          label: could add future contribution to
    approximationNotes: >-
      Share and margin labels are copied from assigned sources; the figure shows relationship flow, not a quantified mix
      between revenue lines.
    claimRefs:
      - CI001
      - CI003
      - CI004
      - CI005
      - CI014
      - CI015
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Public evidence supports a six-layer fluorescence-guided surgery stack from procedure protocol through data
      capture and post-operative learning.
    data:
      layers:
        - label: Procedure protocol
          detail: Procedure-specific dose, route, and timing determine whether fluorescence imaging is usable in the OR.
          outputs:
            - ISFGS publishes guidance across colorectal, liver, lymphatic, plastic, and oncologic applications
        - label: Consumable fluorescence agent
          detail: IC-GREEN and Verdye provide the ICG signal that underpins the rest of the workflow.
          modules:
            - IC-GREEN (US)
            - Verdye (outside the Americas)
        - label: Imaging capture hardware
          detail: IC-Flow V2 is presented as the device layer for real-time fluorescence visualization during open surgery.
          outputs:
            - Perfusion assessment
            - Flap-circulation visualization
            - Lymphatic-flow visualization
        - label: Quantification engine
          detail: PerfusionWorks is positioned as the layer that converts visual signal into objective, reproducible metrics.
          modules:
            - Real-time quantification
            - Standardized interpretation support
        - label: Cloud and reporting layer
          detail: >-
            The company describes structured reports, hospital-system integration, and data reuse as the next software
            layer.
          outputs:
            - Structured reports
            - Post-operative insight and review
            - Dataset creation for future analytics
        - label: Clinical feedback loop
          detail: >-
            Surgeon relationships, research collaborations, and regulatory expansion feed adoption and product
            refinement.
          outputs:
            - Investigator-led studies
            - Hospital partnerships
            - Regional rollout
    approximationNotes: >-
      The stack is reconstructed from assigned public materials and shows operating layers, not a disclosed system
      diagram or validated data-flow specification.
    claimRefs:
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE010
      - CE011
  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      The defensible sequence runs from clinical evidence and clearance through channel access and repeat procedures;
      platform expansion comes only after institutional adoption.
    data:
      items:
        - label: Clinical evidence
          stage: Demand foundation
          detail: >-
            Independent evidence supports selected ICG-guided surgical outcomes, while other applications remain less
            certain.
          touchpoints:
            - SAGES systematic review
            - Procedure-specific outcomes
        - label: Regulatory clearance
          stage: Market access
          detail: Dye approval and imaging-system clearance permit commercialization but do not establish customer adoption.
          touchpoints:
            - Verdye approvals
            - IC-Flow clearances
        - label: Channel access
          stage: Procurement access
          detail: Major wholesalers place the consumable inside institutional ordering channels.
          touchpoints:
            - Cencora
            - McKesson
            - Cardinal Health
        - label: Hospital adoption
          stage: Workflow conversion
          detail: Surgeons and procurement teams must incorporate fluorescence into clinical and purchasing routines.
          touchpoints:
            - Training and familiarity
            - Institutional procurement
        - label: Repeat procedures
          stage: Core durability
          detail: Procedure-linked vial demand is the observable recurring economic motion.
          touchpoints:
            - Reorders
            - Utilization depth
        - label: Platform expansion
          stage: Optional expansion
          detail: >-
            Imaging and data tools may deepen workflow attachment, but attach rates and production deployments are not
            disclosed.
          touchpoints:
            - Imaging hardware
            - Quantification software
    approximationNotes: >-
      This is an evidence-based conceptual sequence, not a measured conversion funnel; no stage-to-stage rates are
      publicly disclosed.
    claimRefs:
      - CU002
      - CU012
      - CU013
      - CU014
      - CU015
      - CU016
