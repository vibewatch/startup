  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, stage, and platform
        blocks:
          - type: paragraph
            body: >-
              UltraGreen.ai is best grounded as a Singapore-headquartered, publicly listed healthcare company focused on
              fluorescence-guided surgery rather than as a generic AI-health story. Independent 2026 analyst coverage
              and September 2025 reporting both describe the company as Singapore-based and centered on
              fluorescence-guided surgical technologies, while the official product pages frame the commercial stack
              around ICG dyes, IC-Flow imaging hardware, PerfusionWorks quantification software, and UltraGreen Data
              Systems. That matters for the rest of the report because the identity surface is broad, but the retained
              evidence still points to a concrete operating core: dye-led workflows supported by hardware, analytics,
              and cloud tooling. The retained official sources are useful for product architecture and positioning, but
              they should be treated as company claims unless matched by independent material.
            claimRefs:
