        title: The moat is strongest in consumables scale and regulatory breadth
        blocks:
          - type: paragraph
            body: >-
              The strongest evidence for defensibility sits in ICG consumables rather than hardware alone. FSM Global
              says UltraGreen held approximately 68% of global ICG vial volume and 63% of industry revenue in 2024, with
              especially strong US and European share, and it describes competing manufacturers as more regional with
              narrower approvals and distribution. The same report argues that approvals can take years, and that
              hospital procurement relationships and surgeon familiarity make displacement slow once a vendor is
              embedded. UltraGreen's own 2026 update reinforces the breadth point by citing 41 Verdye countries and 45
              IC-Flow markets, which widens the installed territory a smaller rival would need to match.
            claimRefs:
