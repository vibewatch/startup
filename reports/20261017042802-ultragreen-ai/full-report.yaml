      - number: '5.3'
        title: Maturity, approvals, and technical risk
        blocks:
          - type: paragraph
            body: >
              Product maturity is uneven across layers and geographies. On the positive side, assigned evidence supports
              real commercial and regulatory progress: Verdye won Singapore approval in May 2026, while a syndicated
              approval notice and DBS research say IC-Flow V2 approvals in India, Thailand, the Philippines, and
              Bangladesh pushed the imaging platform to 45 territories. The August 2026 shareholder update also shows
              management trying to reposition the story beyond a single-dye franchise by highlighting dye, imaging, and
              software together and by saying PerfusionWorks completed MDR conformity assessment while awaiting formal
              CE certification.


              The main risk is that the software-and-platform story is more legible strategically than it is
              operationally. FSMOne says PerfusionWorks has FDA 510(k) clearance, but management's later August 2026
              update says formal CE certification is still pending and that FDA clearance would be pursued afterward;
              the discrepancy requires primary regulatory documentation. DBS also notes that several APAC imaging
              approvals do not yet imply corresponding dye approvals, so the full platform cannot be assumed to land as
              one synchronized bundle. The public evidence is thin on trust and reliability surfaces that matter for
              hospital software diligence: the assigned pool does not document security certifications, uptime or status
              reporting, interface standards, or public practitioner/developer telemetry around the data layer. Finally,
              the geography story needs reconciliation because materials variously refer to more than 43 countries in
              regulatory footprint, 45 imaging territories, and more than 55 countries of product sales.
              Product-by-product maturity should therefore be underwritten with reconciled regulatory and commercial
              coverage rather than headline geography counts.
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE011
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The moat claim is ecosystemal, not dye-only
            body: >-
              Management and third-party materials consistently frame Ultragreen.ai as trying to control more of the
              fluorescence-guided surgery workflow through dye, imaging, quantification, and data layers. That
              architecture is a stronger moat story than a stand-alone consumable, but it also broadens the technical
              diligence burden beyond pharmaceutical approvals.
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
              - CE011
              - CE012
          - type: callout
            title: Software governance remains under-evidenced
            body: >-
              The assigned pool supports the existence of a cloud/data ambition, but it does not provide public proof of
              security certifications, uptime history, integration standards, or release telemetry. For hospital
              underwriting, that makes the data layer materially less proven than the dye and imaging layers.
            calloutType: risk
            claimRefs:
              - CE004
              - CE007
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: The commercial base is a procedure-linked healthcare ecosystem
        blocks:
          - type: paragraph
            body: >
              UltraGreen.ai serves a multi-party healthcare workflow rather than a conventional software account.
              Surgeons and operating-room teams use ICG fluorescence during procedures; hospitals and health systems
              control procurement and budgets; and pharmaceutical wholesalers connect the company to institutional
              ordering channels. The company also presents imaging hardware and data tools as extensions around the
              consumable. That segmentation matters because the recurring event is a procedure, not a seat renewal.
              Current customer quality should therefore be judged through vial use, institutional access, supply
              reliability, and clinical workflow adoption. Public materials describe the intended beneficiaries and
              platform logic, but they do not disclose revenue by buyer type, payer, hospital size, or individual
              account.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU004
              - CU016
      - number: '6.2'
        title: Usage growth is visible, but active-account depth is not
        blocks:
          - type: paragraph
            body: >
              Independent coverage provides the clearest adoption signal: FY2025 ICG volume reached 987.7 thousand
              vials, up from 872.9 thousand in FY2024, while both volume and average selling price increased. Revenue
              growth also appeared in both US and non-US markets. These measures show that commercial momentum was not
              solely a pricing effect, although vial growth cannot distinguish more procedures at existing sites from
              new account wins. Regulatory reach is also expanding, but the source set uses different denominators for
              dye approvals, imaging-system clearances, overall footprint, and countries sold into. Those measures
              should not be collapsed into a single customer count, and none substitutes for active hospitals,
              utilization per site, or repeat-purchase cohorts.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU010
      - number: '6.3'
        title: Named proof stops at channel counterparties
        blocks:
          - type: paragraph
            body: >
              The retained sources name Cencora, McKesson, and Cardinal Health as major US wholesalers, but they do not
              name production hospitals, health systems, or surgeon reference accounts. The three wholesalers
              represented 68.2% of revenue in 2024 according to DBS and 67.8% in FY2025 according to The SEA Analyst.
              That persistence supports broad channel access, yet it is a concentration statistic at the intermediary
              layer rather than proof of a diversified end-customer base. Individual wholesaler shares, downstream
              hospital concentration, contract duration, and switching behavior remain undisclosed. The result is strong
              distribution evidence but weak account-level reference quality: public diligence can verify that product
              moves through scaled channels, not which institutions use it, at what intensity, or with what renewal
              behavior.
            claimRefs:
              - CU008
              - CU009
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU009
              - CU012
      - number: '6.4'
        title: Clinical utility supports repeat use, while conversion and retention remain open
        blocks:
          - type: paragraph
            body: >
              Independent clinical evidence strengthens the rationale for hospital adoption in selected procedures. The
              SAGES systematic review reported lower colorectal anastomotic leak rates with ICG-guided surgery, while
              also warning that evidence remains limited in several other applications. Commercial durability still
              requires a separate proof layer. UltraGreen.ai itself cautions that regulatory approval does not establish
              launch, customer adoption, or market penetration, and independent analysis notes that surgeons and
              hospitals can change practice slowly. The credible expansion loop is therefore evidence to approval,
              institutional procurement, procedure-level repeat use, and only then hardware or data-platform attachment.
              Public sources support each strategic surface, but they do not quantify conversion rates, NRR, GRR, churn,
              renewals, contracts, or cross-product attach rates.
            claimRefs:
              - CU013
              - CU014
              - CU015
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU002
              - CU012
              - CU013
              - CU014
              - CU015
              - CU016
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Channel concentration is not end-customer concentration
            body: >-
              Three named wholesalers represented roughly two-thirds of revenue in both 2024 and FY2025, but the source
              set does not disclose their individual shares or the hospitals behind them.
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
          - type: callout
            title: Approval expands the addressable surface, not the installed base
            body: >-
              Company disclosures distinguish regulatory permission from commercial launch and adoption, so country
              approvals should not be reported as customers or active deployments.
            calloutType: insight
            claimRefs:
              - CU010
              - CU011
              - CU012
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'Severity ranking: approvals, manufacturing, and concentration drive the residual risk stack'
        blocks:
          - type: paragraph
            body: >
              The current evidence points to a three-layer risk stack. First, regulatory timing remains the most
              material near-term exposure because UltraGreen can open device pathways ahead of pharmaceutical
              registrations, leaving commercial readiness uneven by country even after a favorable headline on
              geographic expansion. Second, the company's core dye business still carries manufacturing and logistics
              fragility: management described ICG production as "extremely complex," and independent reporting says
              Ireland remains the manufacturing base while the US is still the largest market. Third, the equity story
              still depends on extending a consumables-led franchise into a broader software and data platform without
              public evidence yet proving customer concentration, attach rates, or security-control maturity for the
              cloud roadmap.
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR007
              - CR008
              - CR010
              - CR011
              - CR016
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
              - CR016
      - number: '7.2'
        title: Regulatory risk is declining, but still sequenced market by market
        blocks:
          - type: paragraph
            body: >
              Regulatory progress is real: management disclosed a May 2026 Singapore Verdye approval and a 41-country /
              45-market installed approval footprint, while the company's March 2026 news archive highlighted new
              IC-Flow approvals across South and Southeast Asia. That lowers the probability of a broad platform
              rejection. The residual issue is sequencing. DBS explicitly warned that several new device-approval
              markets still lacked the matching dye approval or exemption pathway, which means footprint expansion does
              not automatically translate into near-term revenue. The same evidence base also leaves open a
              legal-visibility gap: the assigned pool did not surface readable prospectus risk factors, litigation
              detail, or privacy/security filings, so investors still need a direct public-record review before treating
              the regulatory story as fully de-risked.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR015
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR007
              - CR008
              - CR009
              - CR016
      - number: '7.3'
        title: Operational scaling depends on manufacturing reliability and surgeon-led distribution loops
        blocks:
          - type: paragraph
            body: >
              UltraGreen's operating model depends on more than regulatory wins. Company materials say fluorescence
              adoption remains fragmented by tooling, training, and integrated-platform access, and the
              innovation-pipeline page says expansion into new procedures comes from close relationships with pioneering
              surgeons and long-term clinical partnerships. That creates a credible adoption engine, but it also means
              the company depends on a relatively concentrated external ecosystem of clinicians, hospitals, and channel
              partners to move from pilot enthusiasm to routine procedural volume. The model is further concentrated
              economically: independent initiation coverage says the business is still mainly driven by recurring ICG
              consumables, while the company's AI and data-platform upside remains an execution layer rather than the
              already-proven revenue base.
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR004
              - CR006
              - CR010
              - CR011
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR006
              - CR008
              - CR010
              - CR016
      - number: '7.4'
        title: Mitigations exist, but the thesis should break if commercial proof does not catch up
        blocks:
          - type: paragraph
            body: >
              The mitigation case is meaningful but conditional. UltraGreen announced a US$188 million strategic
              investment in September 2025, management later told CNA that the business generates enough cash each year
              to avoid another listing in the near term, and Straits Times reported management currently expects tariff
              costs to be absorbable. Those factors reduce immediate financing stress. They do not remove the need for
              evidence on commercial conversion and governance. The thesis should weaken materially if 2026-2027
              approvals still fail to produce measurable APAC contribution, if manufacturing or tariff conditions stop
              being absorbable, if customer/distributor concentration remains opaque after diligence, or if the
              cloud-based surgical data platform cannot show enterprise-grade privacy, integration, and hospital
              adoption controls.
            claimRefs:
              - CR004
              - CR009
              - CR013
              - CR014
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-severity residual risk
            body: >-
              Country-by-country dye approvals are still the clearest path by which a seemingly global footprint can
              fail to become near-term APAC revenue.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR015
          - type: callout
            title: Most important diligence asks before underwriting upside
            body: >-
              Request a readable jurisdiction-by-jurisdiction product approval matrix, quantified distributor/customer
              concentration, and security/privacy control evidence for the cloud video and AI platform.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR010
              - CR016
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing context and public pricing
        blocks:
          - type: paragraph
            body: >-
              UltraGreen does not look like a business that needs rescue capital. The assigned pool shows a roughly
              US$400 million IPO package in late 2025, a separate US$188 million strategic investment earlier that year,
              and an investor page still highlighting FY2025 revenue of US$142.4 million, adjusted EBITDA of US$89.4
              million, and 85% gross margin. The harder judgment is valuation rather than survival. As of 16 October
              2026, the investor page showed a US$0.475 last-done US-dollar line, which is materially below the US$1.45
              IPO price and below every cited 2026 analyst target. That gap creates optical cheapness, but not yet a
              complete underwriting case, because the public record in this pool does not disclose an updated fully
              diluted share count, preference overhang, or refreshed FY2026 model.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV006
              - CV010
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV010
              - CV016
      - number: '8.2'
        title: Thesis, anti-thesis, and what the market is debating
        blocks:
          - type: paragraph
            body: >-
              The long case is straightforward: UltraGreen still looks like a high-margin consumables franchise with
              enough evidence of software and platform optionality to justify some premium if execution holds. The
              prospectus and company materials frame PerfusionWorks and the UltraGreen Data Platform as a route from a
              dye-led business into a broader surgical-intelligence stack, while the refreshed regulatory evidence keeps
              the geographic expansion story alive. The anti-thesis is equally clear in the assigned pool. Singapore
              Business Review shows management preparing to respond to new US entrants based on pricing, distribution,
              and customer offer, while DBS argues the latest APAC approvals are groundwork rather than near-term
              earnings power because dye approvals still lag in most new territories. In other words, the stock may be
              cheap, but the next debate is about earnings quality and competitive durability, not awareness.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV004
              - CV005
              - CV006
              - CV010
              - CV011
              - CV013
              - CV015
              - CV016
      - number: '8.3'
        title: Scenario framing, entry discipline, and final call
        blocks:
          - type: paragraph
            body: >-
              The public-market setup is attractive enough to keep UltraGreen on an active watchlist, but not clean
              enough to underwrite a full buy recommendation from this evidence set alone. A bull case exists if the
              current quote eventually re-rates back toward the historical analyst range once management proves that US
              competition is manageable and that the platform layer can add to, rather than merely decorate, the
              consumables business. The base case is still track: wait for refreshed FY2026 numbers, cap-table clarity,
              and evidence that APAC approvals become commercial rather than symbolic. The bear case is that the market
              is correctly discounting a business facing US pricing pressure, stale underwriting anchors, and a software
              story that remains earlier than the equity pitch implies.
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV013
              - CV016
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Track the discount; do not underwrite it yet
            body: >-
              UltraGreen has enough historical quality and capital support to stay investable, but the assigned pool
              does not yet prove that the October 2026 discount is a valuation mistake rather than a justified
              de-rating.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV009
              - CV016
          - type: callout
            title: Upgrade trigger is refreshed proof, not narrative
            body: >-
              A move from track to buy would require refreshed FY2026 results, a current fully diluted share count, and
              evidence that US competition is not eroding price, share, or margin.
            calloutType: assumption
            claimRefs:
              - CV003
              - CV011
              - CV013
              - CV016
          - type: callout
            title: Low price can still be expensive if the old model is stale
            body: >-
              The main risk in buying the discount now is that all public upside markers in this pool are
              backward-looking 2026 analyst anchors rather than a refreshed post-competition underwriting set.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV016
