company:
  name: UltraGreen.ai
chapter:
  number: 4
  title: Financials
  summary: 'UltraGreen’s public financial picture is strongest where consumables economics are visible: the company and third-party coverage align on roughly US$142 million of FY2025 revenue, about 85% gross margin, and a business still led by recurring ICG dye sales. Capital is not obviously constrained in the near term given reported FY2025 net cash, but underwriting remains limited by missing public disclosure on realized pricing, working-capital intensity, and go-to-market efficiency.'
sections:
- id: consumables-led-engine
  title: Consumables drive the disclosed economics
  body: |-
    Public evidence supports a consumables-led revenue model rather than a balanced three-line mix. UltraGreen’s investor page reported FY2025 revenue of US$142.4 million and adjusted EBITDA of US$89.4 million, while the same investor surface and third-party summaries put FY2025 gross margin at roughly 85%. Independent analyst coverage described the current business as mainly driven by recurring ICG consumables, which matters because recurring dye usage is the only clearly evidenced engine converting procedure volume into repeat revenue today. Official company materials also position imaging hardware, quantification software, and AI analytics as part of the platform, but the assigned evidence does not disclose separate revenue contribution, ASPs, attach rates, or paying-software penetration. That leaves hardware and software as strategically important but financially under-specified layers on top of a strong consumables core.
  claimRefs:
  - CI001
  - CI002
  - CI003
  - CI004
  - CI005
  tableRefs:
  - TI001
  - TI002
  figureRefs:
  - FI001
- id: capital-and-margin-constraints
  title: Capital exists, but forward earnings conversion is still conditional
  body: |-
    The public record shows multiple capital milestones, but not a fully underwritable runway model. At IPO launch, press coverage said UltraGreen marketed about 112 million shares at US$1.45, with roughly US$150 million of gross proceeds due to the company; management also framed the proceeds as funding core product development, geographic expansion, and working capital. Before listing, Allen & Gledhill described an October 2025 secondary sale at a US$1.3 billion equity valuation, and a later analyst summary reported FY2025 net cash of US$173.0 million. That means capital adequacy is better supported than burn or runway, yet the next leg of earnings is not frictionless: Tickrs highlighted a sharp rise in effective tax rate, and DBS argued new APAC device approvals mainly create option value until the core ICG dye is approved in the same markets and revenue scales beyond a small base.
  claimRefs:
  - CI006
  - CI007
  - CI008
  - CI009
  - CI010
  - CI013
  - CI014
  - CI015
  tableRefs:
  - TI003
- id: underwriting-verdict-and-gaps
  title: 'Verdict: high-quality gross margin, low transparency on unit economics'
  body: |-
    The best-supported conclusion is that UltraGreen already operates a profitable, high-margin model anchored in recurring ICG consumables and global geographic reach. What is not public is equally important: the assigned sources do not provide realized dye pricing, hardware ASPs, software contract structure, CAC, payback, sales-cycle duration, customer concentration, distributor concentration, or a bridge from net cash to runway. The latest disclosed share price, materially below the IPO price, does not prove a funding shortfall, but it does suggest any future equity financing would happen from a weaker market position than at listing. For diligence, the chapter should therefore be read as positive on revenue quality and margin structure, but cautious on forward underwriting because capital intensity and commercial efficiency are still opaque in public materials.
  claimRefs:
  - CI003
  - CI004
  - CI010
  - CI016
  - CI017
tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Current public evidence
  - Revenue quality
  - Diligence ask
  rows:
  - - ICG dye / consumables
    - Recurring per-procedure vial sales in fluorescence-guided surgery
    - Public sources describe recurring ICG consumables as the current business driver and the clearest disclosed revenue engine.
    - Highest-quality stream in the public record because use is repeatable and FY2025 gross margin is about 85%.
    - Disclose product-by-product revenue mix, realized pricing by geography, and customer concentration.
  - - IC-Flow imaging system
    - Device sales / placements that enable fluorescence imaging workflows
    - Official and analyst materials show active imaging-system approvals and positioning, but no disclosed installed base, ASP, or service revenue.
    - Strategically important, but revenue recurrence and margin profile are not public.
    - Disclose installed base, annual placements, ASPs, service terms, and device-to-dye attach rates.
  - - Quantification software / Data Platform
    - Software / analytics intended to support quantitative perfusion assessment and surgical decision support
    - Official materials position PerfusionWorks and the UltraGreen Data Platform as future monetization layers, but no standalone revenue is disclosed.
    - Potentially attractive if it increases retention or ASP, but currently unproven in public financial data.
    - Disclose pricing model, paying users, commercial launch status, and gross-margin profile for software.
  notes: Nulls and qualitative labels reflect absent public disclosure in the assigned evidence, not zero revenue or zero activity.
  claimRefs:
  - CI004
  - CI005
  - CI014
- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer
  - Public price / contract evidence
  - List vs realized pricing
  - Discounts / unknowns
  - Source basis
  rows:
  - - ICG dye / consumables
    - No public per-vial list price in the assigned pool.
    - Realized pricing is undisclosed publicly.
    - Discounting, reimbursement mix, and distributor economics are not disclosed.
    - Investor page, prospectus, and analyst summaries discuss the product line but not transactional pricing.
  - - IC-Flow imaging system
    - No public ASP or placement contract terms in the assigned pool.
    - Realized device economics are undisclosed publicly.
    - Bundling, maintenance, and capital-equipment financing terms are unknown.
    - DBS discusses regulatory approvals and market entry, not commercial terms.
  - - Quantification software / Data Platform
    - No public software subscription, license, or usage-based pricing found in assigned evidence.
    - Realized software monetization is undisclosed publicly.
    - Pilot-versus-production mix and attach to dye/device customers are unknown.
    - Official company materials describe capability and optionality, not monetization detail.
  notes: This table distinguishes public absence of pricing evidence from a claim that the company does not charge for the offer.
  claimRefs:
  - CI005
  - CI014
- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - FY2025 revenue
    - US$142.4m
    - High
    - Anchors current scale and sets the denominator for margin and cash-efficiency work.
    - Provide quarterly revenue bridge by product, geography, and customer type.
  - - FY2025 adjusted EBITDA
    - US$89.4m
    - High
    - Shows current operating earnings power, but not cash conversion.
    - Provide EBITDA-to-operating-cash-flow bridge and one-off adjustments.
  - - FY2025 gross margin
    - ~85%
    - High
    - Supports the view that the current mix is unusually strong for a medtech platform.
    - Break out gross margin by dye, device, and software.
  - - FY2025 net cash
    - US$173.0m
    - Medium
    - Suggests near-term liquidity, but does not establish runway without burn and working-capital data.
    - Provide cash balance date, minimum cash needs, debt, and monthly cash burn.
  - - Effective tax rate
    - 6.2% in FY2022 to 24.0% in 1H2025
    - Medium
    - A rising tax rate can compress net margin even if gross margin stays strong.
    - Explain jurisdiction mix, sustainable tax rate, and any one-off items.
  - - APAC near-term earnings impact
    - Small-base and not materially accretive to 2026 earnings
    - High
    - Prevents over-crediting regulatory wins before the dye is approved and sold at scale.
    - Disclose country-level approval status, launch timing, and expected ramp assumptions.
  notes: Values are copied from assigned public sources; missing CAC, payback, sales-cycle, and working-capital metrics remain open diligence items rather than estimates.
