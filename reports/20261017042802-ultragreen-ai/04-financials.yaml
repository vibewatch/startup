  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-transparency
    missingEvidence: Realized dye pricing by geography, device ASPs, software contract terms, and discounting policy.
    whyItMatters: List pricing is absent from the assigned sources, so public materials cannot show whether gross margin is being protected through mix, market power, or temporary launch dynamics.
    diligencePath: Request product-level price lists, realized ASP waterfalls, distributor terms, and top-customer contract samples.
    relatedQuestionRefs:
    - QI009
    relatedTableRefs:
    - TI002
  - type: private-evidence-only
    severity: material
    topic: go-to-market-efficiency
    missingEvidence: CAC, payback, sales-cycle duration, win rates, and direct-versus-distributor revenue mix.
    whyItMatters: A profitable consumables franchise can still destroy incremental value if expansion into new markets requires long working-capital cycles, costly distributor incentives, or slow device placements.
    diligencePath: Request cohort-level pipeline data, sales productivity metrics, distributor economics, and region-by-region launch assumptions.
    relatedQuestionRefs:
    - QI009
    relatedTableRefs:
    - TI003
  - type: missing-source
    severity: material
    topic: cash-runway
    missingEvidence: A dated cash-balance bridge, debt schedule, capex outlook, and management runway view.
    whyItMatters: Reported net cash is helpful, but it does not establish how much capital remains after inventory, receivables, capex, tax, and market-entry spending.
    diligencePath: Obtain the latest balance-sheet package, monthly cash-burn report, and board-approved operating plan.
    relatedQuestionRefs:
    - QI009
    relatedTableRefs:
    - TI003
