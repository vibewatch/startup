  evidenceGaps:
    - type: missing-source
      severity: material
      topic: software-governance
      missingEvidence: Public documentation for security certifications, privacy controls, hospital integration standards, uptime/SLA history, and software ownership boundaries for the cloud/data layer.
      whyItMatters: The software and reporting layer is central to the integrated-platform thesis, but hospital procurement risk cannot be underwritten from product-marketing copy alone.
      diligencePath: Request the product security pack, compliance certifications, interface documentation, uptime history, and named deployment references for the data platform and quantification stack.
      relatedQuestionRefs: [QE008]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: developer-signal
      missingEvidence: Public release notes, API documentation, community usage metrics, practitioner telemetry, or another documented proxy showing live software adoption and release cadence.
      whyItMatters: A quantification and data platform should have some observable implementation or practitioner signal; without it, software maturity is inferred mainly from company narrative.
      diligencePath: Ask for release history, installation counts, named surgeon or hospital references, and any practitioner-community evidence that can substitute for a public developer surface.
      relatedQuestionRefs: [QE008]
    - type: conflicting-data
      severity: material
      topic: geography-footprint
      missingEvidence: A reconciled product-by-product geography matrix separating dye registrations, device approvals, exemption supply, and commercial sales by country.
      whyItMatters: The assigned pool uses more than one denominator for geographic reach, which can overstate how much of the full stack is commercially available in each market.
      diligencePath: Request the current regulatory register by product, country, approval type, commercial launch date, and whether supply is ordinary registration or exemption-based.
      relatedQuestionRefs: [QE004]
    - type: conflicting-data
      severity: material
      topic: software-maturity
      missingEvidence: Primary FDA and European conformity documentation reconciling whether PerfusionWorks is FDA-cleared, awaiting CE certification, or still intended for a later FDA submission.
      whyItMatters: The software layer's regulatory maturity affects its deployability, claims scope, and the credibility of the integrated-platform roadmap.
      diligencePath: Obtain the FDA 510(k) number and decision letter, the European conformity certificate, and a dated management regulatory-status reconciliation.
      relatedQuestionRefs: [QE004, QE008]
      relatedTableRefs: [TE001]
