company:
  name: UltraGreen.ai
chapter:
  number: 5
  title: Product & Technology
  summary: Ultragreen.ai's assigned evidence supports a vertically integrated fluorescence-guided surgery stack that combines ICG consumables, IC-Flow imaging hardware, PerfusionWorks quantification software, and an emerging cloud/data layer rather than a stand-alone dye product. Product maturity is strongest in consumables and imaging approvals, while conflicting PerfusionWorks regulatory disclosures and limited software-governance evidence remain material diligence gaps.
sections:
  - id: integrated-stack
    title: Integrated product stack
    body: |
      The product set in the assigned pool is broader than a single indocyanine green vial. Company-controlled and third-party materials consistently describe a stack that starts with ICG consumables, extends into near-infrared imaging hardware, and aims to add quantification software and data infrastructure around the surgical workflow. The official May 2026 Verdye release says the company is building a "comprehensive fluorescence-guided surgery ecosystem" that combines pharmaceutical products, compatible imaging hardware, and AI-powered data platforms, while the prospectus and analyst coverage describe the same architecture as a vertically integrated model rather than a pure consumables business. That matters because it changes both the moat narrative and the diligence surface: the business is not only selling dye into existing procedures, it is trying to influence clinical workflow, imaging capture, interpretation, and eventually structured post-operative data.

      The stack is also segmented by maturity. The consumable layer is the most established, with IC-GREEN in the US and Verdye outside the Americas positioned as the core clinical inputs. Imaging hardware appears commercially tangible as well: independent coverage and company-linked approval notices both describe IC-Flow V2 as a handheld near-infrared system used intraoperatively for perfusion and lymphatic visualization. The software and data layers look earlier and more strategic than proven at scale. Public materials emphasize PerfusionWorks, quantification, structured reports, and AI-powered insights, but the assigned pool provides much less implementation detail on integration depth, installed-base adoption, release cadence, or support ownership than it does on the dye and device layers.
    claimRefs: [CE001, CE002, CE003, CE005, CE012]
    tableRefs: [TE001]
  - id: workflow-architecture
    title: Workflow and operating architecture
    body: |
      The operating model implied by the assigned evidence follows the intraoperative workflow. ICG is administered using procedure-specific timing and dosing protocols; near-infrared imaging then captures the fluorescence signal; quantification software is meant to reduce subjective interpretation; and a cloud/data layer is intended to turn fluorescence observations into structured reports and reusable datasets. The ISFGS dosing chart is particularly useful here because it shows that clinical use depends on disciplined protocol choices by procedure, dose, route, and timing rather than on a generic "AI surgery" abstraction. In other words, Ultragreen's software ambitions sit on top of a clinical workflow that already has technique-specific operating constraints.

      The software ambition is most explicit in the company's product pages and the Perfusion Tech acquisition announcement. The Innovation Pipeline page says the company is "moving qualitative assessment to quantitative, standardized insights" and building a cloud platform that integrates with hospital systems. The clinical-research page adds that PerfusionWorks and UltraGreen Data Systems are intended to turn fluorescence into objective metrics and post-operative review capability, while the Perfusion Tech announcement describes real-time visualization, quantitative analytics, cloud-based data management, and AI-powered insights as one platform. That set of claims is coherent enough to author an architecture figure, but not detailed enough to validate data models, deployment models, or software assurance controls from public evidence alone.
    claimRefs: [CE003, CE004, CE005, CE006, CE007]
    tableRefs: [TE002, TE003]
    figureRefs: [FE001]
  - id: maturity-risks
    title: Maturity, approvals, and technical risk
    body: |
      Product maturity is uneven across layers and geographies. On the positive side, assigned evidence supports real commercial and regulatory progress: Verdye won Singapore approval in May 2026, while a syndicated approval notice and DBS research say IC-Flow V2 approvals in India, Thailand, the Philippines, and Bangladesh pushed the imaging platform to 45 territories. The August 2026 shareholder update also shows management trying to reposition the story beyond a single-dye franchise by highlighting dye, imaging, and software together and by saying PerfusionWorks completed MDR conformity assessment while awaiting formal CE certification.

      The main risk is that the software-and-platform story is more legible strategically than it is operationally. FSMOne says PerfusionWorks has FDA 510(k) clearance, but management's later August 2026 update says formal CE certification is still pending and that FDA clearance would be pursued afterward; the discrepancy requires primary regulatory documentation. DBS also notes that several APAC imaging approvals do not yet imply corresponding dye approvals, so the full platform cannot be assumed to land as one synchronized bundle. The public evidence is thin on trust and reliability surfaces that matter for hospital software diligence: the assigned pool does not document security certifications, uptime or status reporting, interface standards, or public practitioner/developer telemetry around the data layer. Finally, the geography story needs reconciliation because materials variously refer to more than 43 countries in regulatory footprint, 45 imaging territories, and more than 55 countries of product sales. Product-by-product maturity should therefore be underwritten with reconciled regulatory and commercial coverage rather than headline geography counts.
    claimRefs: [CE008, CE009, CE010, CE011, CE013, CE014, CE015, CE016]
tables:
  - id: TE001
    title: Product module / asset matrix
    columns:
      - Module / asset
      - Primary user
      - Current status / maturity
      - Differentiation lens
      - Diligence gap
    rows:
      - ["IC-GREEN / Verdye ICG consumables", "Surgeons and OR teams", "Commercial core with broad installed clinical use", "Recurring procedure-linked consumable base tied to fluorescence workflow", "Reconcile product-by-product registrations and commercial availability by country"]
      - ["IC-Flow Imaging System V2", "Surgeons in open surgical settings", "Approved imaging device with recent APAC expansion", "Handheld near-infrared visualization for perfusion and lymphatic assessment", "Public pool does not show installed-base counts or utilization"]
      - ["PerfusionWorks quantification engine", "Surgeons and clinical researchers", "Acquired quantification software with conflicting public FDA and CE status disclosures", "Converts visual signal into quantitative perfusion assessment", "Reconcile regulatory status and obtain validation endpoints, release history, and deployment references"]
      - ["UltraGreen Data Platform / Data Systems", "Hospitals and post-operative review stakeholders", "Directionally described but under-documented", "Structured reporting and data reuse could deepen lock-in beyond dye sales", "Need architecture, privacy, security, and integration documentation"]
    notes: Public evidence clearly supports the existence of each module, but maturity differs by layer; imaging approvals, clinical adoption, software deployment, and geography are not interchangeable measures.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE009]
  - id: TE002
    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Company solution
      - Measurable benefit
      - Limitation
    rows:
      - ["Assess tissue perfusion intraoperatively", "Dose ICG and inspect fluorescence during surgery", "IC-GREEN or Verdye paired with IC-Flow visualization and quantification roadmap", "Better real-time perfusion visibility and potential reduction in subjective interpretation", "Public pool does not quantify sensitivity or workflow time impact"]
      - ["Visualize lymphatic flow or critical structures", "Use near-infrared fluorescence during open procedures", "IC-Flow V2 handheld imaging platform", "Supports lymphatic-flow and structure visualization in approved use settings", "Pool does not separate routine clinical use from pilot deployments"]
      - ["Standardize fluorescence interpretation", "Translate signal intensity into objective metrics", "PerfusionWorks quantification engine and AI quantification roadmap", "Aims for reproducible thresholds and structured decision support", "Public sources do not disclose validation dataset size or algorithm governance"]
      - ["Capture data for review and hospital learning", "Move from live visualization to structured reporting", "UltraGreen Data Platform / Data Systems with cloud-based workflow", "Could create reusable datasets and post-operative review loops", "No public documentation of integration interfaces, uptime, or privacy controls in assigned pool"]
    notes: Benefits are sourced from company and partner descriptions plus clinical workflow references; absent benchmark data, benefits should be treated as directional rather than as independently quantified outcomes.
    claimRefs: [CE003, CE004, CE005, CE006, CE007]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Dependency
      - Risk
    rows:
      - ["Procedure protocol and dosing", "Correct dose/route/timing determine usable fluorescence signal", "Specialty-specific technique guidance and clinician training", "Protocol error can degrade image quality before software can add value"]
      - ["Consumable dye layer", "Generates the fluorescence signal used downstream", "Product registration, manufacturing reliability, and OR supply continuity", "Imaging approvals without dye approvals limit full-stack rollout"]
      - ["Imaging capture layer", "Records near-infrared signal and visualizes perfusion during surgery", "Device approval and surgeon workflow fit", "Installed-base adoption and procedure mix are not disclosed publicly"]
      - ["Quantification and data layer", "Transforms images into metrics, reports, and reusable datasets", "Clinical validation, software assurance, and hospital integration", "Public evidence on security, release cadence, and integration standards is thin"]
    notes: This table separates clinical protocol, consumables, hardware, and software because each has different approval, deployment, and failure modes; public materials do not evidence a single frictionless platform rollout.
    claimRefs: [CE004, CE007, CE009, CE010]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Public evidence supports a six-layer fluorescence-guided surgery stack from procedure protocol through data capture and post-operative learning.
    data:
      layers:
        - label: Procedure protocol
          detail: Procedure-specific dose, route, and timing determine whether fluorescence imaging is usable in the OR.
          outputs:
            - ISFGS publishes guidance across colorectal, liver, lymphatic, plastic, and oncologic applications
        - label: Consumable fluorescence agent
          detail: IC-GREEN and Verdye provide the ICG signal that underpins the rest of the workflow.
          modules:
            - IC-GREEN (US)
            - Verdye (outside the Americas)
        - label: Imaging capture hardware
          detail: IC-Flow V2 is presented as the device layer for real-time fluorescence visualization during open surgery.
          outputs:
            - Perfusion assessment
            - Flap-circulation visualization
            - Lymphatic-flow visualization
        - label: Quantification engine
          detail: PerfusionWorks is positioned as the layer that converts visual signal into objective, reproducible metrics.
          modules:
            - Real-time quantification
            - Standardized interpretation support
        - label: Cloud and reporting layer
          detail: The company describes structured reports, hospital-system integration, and data reuse as the next software layer.
          outputs:
            - Structured reports
            - Post-operative insight and review
            - Dataset creation for future analytics
        - label: Clinical feedback loop
          detail: Surgeon relationships, research collaborations, and regulatory expansion feed adoption and product refinement.
          outputs:
            - Investigator-led studies
            - Hospital partnerships
            - Regional rollout
    approximationNotes: The stack is reconstructed from assigned public materials and shows operating layers, not a disclosed system diagram or validated data-flow specification.
    claimRefs: [CE003, CE004, CE005, CE006, CE007, CE010, CE011]
callouts:
  - calloutType: insight
    title: The moat claim is ecosystemal, not dye-only
    body: Management and third-party materials consistently frame Ultragreen.ai as trying to control more of the fluorescence-guided surgery workflow through dye, imaging, quantification, and data layers. That architecture is a stronger moat story than a stand-alone consumable, but it also broadens the technical diligence burden beyond pharmaceutical approvals.
    claimRefs: [CE001, CE004, CE011, CE012]
  - calloutType: risk
    title: Software governance remains under-evidenced
    body: The assigned pool supports the existence of a cloud/data ambition, but it does not provide public proof of security certifications, uptime history, integration standards, or release telemetry. For hospital underwriting, that makes the data layer materially less proven than the dye and imaging layers.
    claimRefs: [CE004, CE007]
