companyProfile:
  summary: >-
    UltraGreen.ai is a Singapore-based publicly listed medtech company focused on fluorescence-guided surgery. Its
    public materials describe an integrated stack spanning ICG consumables, IC-Flow imaging hardware, PerfusionWorks
    quantification software, and cloud-based surgical data workflows. The refreshed evidence still shows a profitable,
    high-margin core business, but it also leaves key diligence items unresolved: customer concentration, software
    monetization, and the cap-table mechanics behind the current public valuation.
