- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Provider
  - Public pricing posture
  - Packaging model
  - Budget implication
  - Key limitation
  rows:
  - - Harbinger
    - Acquisition-parity claim; specific fleet prices generally undisclosed
    - Platform/chassis plus upfit and dealer route
    - Can compete on TCO if incentives and route fit are strong
    - Public customer-level price sheets are not disclosed.
  - - Lion Electric
    - Public product specs available; broad pricing not prominently disclosed
    - Dedicated electric truck model
    - Competes where fleets want pure EV class-6 offering
    - Financial distress overshadows pricing posture.
  - - Xos
    - Public company and integrated electrification positioning
    - Vehicle plus energy-storage / charging angle
    - Can sell a broader system rather than only a truck
    - Economic proof still limited at public-company scale.
  - - Workhorse / Motiv
    - Broader medium-duty OEM packaging
    - Vehicle family and fleet-electrification path
    - May bundle breadth across buses and trucks
    - Integration and merger execution create uncertainty.
  - - Blue Bird
    - Scaled public EV product line in buses
    - Finished vehicle OEM model
    - Can absorb procurement budgets that might otherwise flow to trucks
    - Different vehicle class and budget pocket.
  - - ROUSH CleanTech
    - Alternative-fuel packaging rather than BEV pricing
    - Propane / alternative-fuel route
    - Lets fleets decarbonize with less charging capex
    - Does not deliver full zero-tailpipe-emissions proposition.
  notes: Public pricing transparency is limited across the set, so the comparison focuses on packaging logic and budget behavior rather than sticker-price precision.
