  figureRefs: []
- id: switching-costs-distribution-and-service
  title: Switching costs, distribution, and service leverage
  body: 'Medium-duty fleet competition is shaped as much by service and procurement friction as by drivetrain specs. Switching costs show up in charging buildout, body integration, service-parts inventory, driver training, public-bid compliance, and resale risk. Harbinger’s dealer network, Sourcewell availability, and product commonality across multiple body types are attempts to lower those frictions. But rivals also have leverage: Blue Bird has entrenched school-bus relationships, BYD brings scale, Xos emphasizes integrated charging and energy systems, and Workhorse/Motiv points to existing vehicles in the field and repeat-order learning. In practice, the winner in many accounts will be the provider that offers the cleanest package of route fit, service access, funding support, and organizational trust—not necessarily the vehicle with the flashiest headline spec.'
