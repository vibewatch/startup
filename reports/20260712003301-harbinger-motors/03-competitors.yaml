tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Company
  - Positioning
  - Proof / scale signal
  - Why it matters for Harbinger
  - Current caveat
  rows:
  - - Harbinger
    - Class 4-6 clean-sheet EV and hybrid chassis/platform OEM
    - FedEx order, 4,000 preorder book, serial production
    - Baseline company under review
    - Still private and disclosure-light.
  - - Lion Electric
    - Electric Class 6 truck and school-bus maker
    - Lion6 specs and legacy presence in medium-duty EVs
    - Closest class-focused direct EV peer on product type
    - Creditor protection and restructuring materially weaken threat level.
  - - Xos
    - Commercial fleet electrification plus mobile energy storage
    - Public company with investor relations and revenue disclosures
    - Operationally similar EV fleet platform and charging angle
    - Small market cap and still-subscale economics.
  - - Workhorse / Motiv
    - North American medium-duty electric truck and bus OEM after merger
    - Vehicles in field and scaled-manufacturing aspirations
    - Broad product breadth and installed-base learning
    - Merger execution and legacy credibility still have to hold.
  - - Blue Bird
    - Scaled public electric-bus manufacturer
    - $2.45B market cap and $1.48B annual sales on MarketBeat
    - Shows what commercial EV scale and public credibility can look like
    - Primarily bus-focused rather than stripped-chassis medium-duty.
  - - BYD
    - Large global electric truck and bus player
    - 15,065 battery-electric trucks sold worldwide per U.S. page
    - Demonstrates industrial scale and battery depth
    - North American product overlap is partial.
  - - ROUSH CleanTech
    - Alternative-fuel commercial-vehicle provider
    - Broad propane-focused product offering
    - Represents substitute budget path for fleets not ready for BEV
    - Not a direct battery-electric rival.
  notes: Rows intentionally mix direct peers, scaled adjacents, and substitutes because medium-duty fleet budgets can move across all three categories.
