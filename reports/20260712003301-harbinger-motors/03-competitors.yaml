- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Risk or moat factor
  - Current read
  - Why it helps or hurts Harbinger
  - Monitor
  rows:
  - - Medium-duty niche focus
    - Strength
    - Few peers match Harbinger’s exact stripped-chassis plus hybrid focus
    - Watch whether larger OEMs enter more directly.
  - - Vertical integration
    - Strength
    - Can improve cost control and product coherence
    - Check whether scale economics actually materialize in the field.
  - - Strategic investor/customer overlap
    - Strength
    - FedEx and THOR add signal beyond pure venture capital
    - Monitor whether these ties expand into repeat commercial orders.
  - - Service and channel depth
    - Mixed
    - Dealer and public-procurement routes help, but installed-base support remains a proving point
    - Track service coverage and parts performance.
  - - Direct-peer distress
    - Mixed
    - Weakens immediate rivalry but shows category fragility
    - Monitor whether Harbinger avoids the same capital trap.
  - - Scaled adjacent players
    - Risk
    - Blue Bird, BYD, and others can redirect budgets or broaden offerings
    - Watch for adjacent OEM entry into Harbinger-like use cases.
  - - Alternative-fuel substitutes
    - Risk
    - Propane, hybrid, and renewable-fuel routes can delay BEV conversion
    - Measure fleet win rates against non-BEV options.
  - - Market timing reset
    - Risk
    - Commercial EV demand is more selective after 2025
    - Monitor pilot-to-scale conversion and financing environment.
  notes: Moat durability is judged against commercial fleet buying behavior rather than consumer-brand dynamics.
