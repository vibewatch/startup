- id: moat-durability-and-adverse-signals
  title: Moat durability and adverse signals
  body: Harbinger’s moat today is situational rather than impregnable. It rests on focus in an under-served medium-duty niche, vertically integrated clean-sheet architecture, strategic investors who are also commercial validators, and flexibility across fleet, specialty, and public-agency channels. That is valuable, but not untouchable. Distressed direct peers prove how hard the category is, while BrightDrop’s shutdown shows even a deep-pocketed OEM can misread commercial EV timing. The moat is therefore durable only if Harbinger converts platform coherence into reliable field performance, repeat customer deployments, and service credibility before better-capitalized or more established players close the gap. Competition is weaker than the broader EV narrative sometimes implies, but that is because many rivals are struggling—not because the space lacks risk.
