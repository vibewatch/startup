- id: why-harbinger-earns-a-premium-and-why-it-does-not
  title: Why Harbinger earns a premium—and why it does not
  body: 'Harbinger does deserve a valuation premium to distressed EV micro-caps for several reasons: a larger private capital base, better strategic-customer signals, a cleaner product thesis, and fewer obvious governance or solvency alarms in the public record. But the company also deserves a discount to fully proven operators because almost every critical operating input is missing: revenue, gross margin, backlog conversion, cash burn, and field-reliability outcomes. In other words, Harbinger may deserve a premium to failing EV optionality, but not yet a peer-like valuation to public companies that have already demonstrated scaled shipments and earnings power. The premium and discount are both real, and they are what make scenario framing necessary. The valuation argument is strongest when framed as relative placement, not when framed as a precise fair value today.'
