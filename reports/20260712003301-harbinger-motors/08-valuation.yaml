company:
  name: Harbinger Motors
chapter:
  number: 8
  title: Valuation
  summary: Harbinger’s valuation can only be treated scenario-first, not precision-first. Public secondary-market signals conflict, public comparables are extremely dispersed, and Harbinger does not disclose the operating metrics needed for a conventional revenue- or EBITDA-multiple approach. The best-supported public view is that Harbinger deserves a premium to distressed micro-cap EV peers because of product coherence, funding, and customer quality, but a discount to fully proven profitable public operators like Blue Bird until deliveries, margins, and service execution are visible at scale.
sections:
- id: disclosed-private-valuation-signals
  title: Disclosed private valuation signals
  body: Public private-company valuation signals for Harbinger are useful but inconsistent. Forge reports a post-money valuation of roughly $1.08 billion with total funding around $339.9 million, while Harbinger’s own Series C materials support cumulative funding of $358 million. A separate secondary-market profile from Premier Alternatives reports a materially higher implied valuation of $2.4 billion and total funding of $354 million. This conflict is not unusual for private-company datasets, but it means the public valuation debate starts with ranges, not facts. The most defensible takeaway is that Harbinger crossed the unicorn threshold in late 2025 or early 2026 on at least some secondary-market sources, but the exact mark is not stable enough to treat as audited truth. That alone should push valuation work away from point estimates and toward confidence bands with explicit source-quality discounts.
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  tableRefs:
  - TV001
  figureRefs:
  - FV001
- id: public-comparable-context
  title: Public comparable context
  body: Public comparables show why Harbinger valuation work is so sensitive to execution assumptions. Blue Bird trades at a multi-billion-dollar market cap with positive earnings, positive free cash flow, and almost $1.5 billion of trailing revenue. Xos and Workhorse, by contrast, trade at tiny equity values with weak profitability and stressed balance-sheet metrics. Lion’s distress underscores how badly commercial EV stories can re-rate when financing or execution breaks. These peers do not give Harbinger a clean single multiple; they give it a valuation corridor defined by one profitable incumbent and several highly stressed or subscale EV specialists. Harbinger’s likely placement inside that corridor depends mainly on whether it becomes a scaled operator or stalls as a promising but under-monetized platform. The spread is so wide that comparator selection becomes almost as important as the number itself.
  claimRefs:
  - CV009
  - CV010
  - CV011
