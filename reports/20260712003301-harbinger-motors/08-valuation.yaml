- id: valuation-verdict
  title: Valuation verdict
  body: On public evidence alone, the most defensible valuation verdict is “credible unicorn, but not precision-underwritable.” A roughly $1.08 billion late-2025 mark looks directionally plausible as a private strategic-growth valuation. A materially higher $2.4 billion implied mark is possible in thin secondary markets, but it asks outsiders to assume more operating proof than Harbinger has publicly provided. The practical investment conclusion is that Harbinger’s value should be underwritten through milestones—deliveries, conversion, margin path, and service quality—not through a static headline mark. Until those milestones emerge, the right public stance is that Harbinger can be worth more than distressed EV peers and still be too opaque to value tightly. That does not make valuation impossible; it makes milestone discipline non-optional.
