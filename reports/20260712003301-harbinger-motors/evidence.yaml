evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation-gap
    missingEvidence: >-
      A definitive round-by-round cap-table reconciliation explaining the difference between Harbinger’s official $358M
      cumulative funding disclosure and Forge’s lower cumulative total.
    whyItMatters: >-
      Valuation and dilution analysis depend on a clean funding baseline, especially when the public record also uses a
      non-official $1.08B post-money estimate.
    diligencePath: >-
      Request the financing timeline, round labels, and any side vehicles or convertibles from management or a full
      private-market database.
    relatedQuestionRefs:
      - QO011
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Current board roster, investor ownership percentages, protective provisions, and any observer or control rights.
    whyItMatters: >-
      Governance concentration and control rights shape future financing flexibility and downside outcomes for new
      investors.
    diligencePath: Obtain the cap table, board list, and financing documents under NDA.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: minor
    topic: current-headcount
    missingEvidence: An up-to-date 2026 employee count and functional distribution by engineering, production, sales, and service.
    whyItMatters: >-
      Headcount is a useful proxy for scale readiness and burn, but current public disclosures stop at historical hiring
      ambitions.
    diligencePath: Request a current org chart and monthly headcount report from management.
    relatedQuestionRefs:
      - QO024
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology completeness
    missingEvidence: >-
      A fully exhaustive milestone chronology covering every hiring, manufacturing, certification, and commercial event
      between launch and current run date.
    whyItMatters: >-
      The public chronology is strong on major announcements but still omits some internal or non-press milestones that
      could explain pacing between funding, production, and customer deployments.
    diligencePath: >-
      Request an internal milestone tracker and operating-review deck to reconcile public milestones with factory,
      delivery, and hiring checkpoints.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: neutral dollar TAM for Harbinger wedge
    missingEvidence: >-
      A neutral, current market-sizing study that isolates Harbinger’s exact Class 4-6 served wedge instead of broader
      electric-truck categories.
    whyItMatters: >-
      Most public TAM figures are either route-fit proxies or self-interested market estimates, which makes valuation
      work sensitive to market-definition choices.
    diligencePath: >-
      Commission or obtain a paid medium-duty market model segmented by class, body type, duty cycle, and public versus
      private procurement channels.
    relatedQuestionRefs:
      - QM021
  - type: missing-source
    severity: minor
    topic: fleet conversion by segment
    missingEvidence: >-
      Segment-specific conversion rates from pilot to scaled electric deployment in parcel, vocational, municipal, and
      specialty fleets.
    whyItMatters: >-
      The market is clearly feasible, but public route-fit data does not directly reveal how quickly each segment
      converts from interest to recurring orders.
    diligencePath: Collect operator case studies, fleet procurement records, and repeat-order data by end market.
    relatedQuestionRefs:
      - QM025
  - type: private-evidence-only
    severity: material
    topic: public pricing precision
    missingEvidence: >-
      Current customer-level quote sheets or transaction pricing for Harbinger and its direct rivals by body type,
      battery size, and service package.
    whyItMatters: >-
      Public pricing opacity makes it hard to separate product-market superiority from financing, incentive, or channel
      effects.
    diligencePath: Collect dealer quotes, fleet procurement records, or customer invoices under NDA.
    relatedQuestionRefs:
      - QP024
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: field performance and repeat orders
    missingEvidence: Cross-company deployment data on uptime, warranty claims, repeat orders, and service response times.
    whyItMatters: Competitive durability in commercial fleets is decided by field performance more than brochure specs.
    diligencePath: Run customer references and service checks across named fleets and channel partners.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: cash burn and runway
    missingEvidence: Current cash on hand, monthly burn, working-capital usage, and management’s internal runway view.
    whyItMatters: Capital adequacy cannot be underwritten from funding totals alone in a manufacturing-heavy startup.
    diligencePath: Request monthly cash, burn, and liquidity reporting plus a board-approved budget.
    relatedQuestionRefs:
      - QI019
      - QI025
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: unit economics and gross margin
    missingEvidence: Vehicle-level ASP, BOM, warranty reserve assumptions, and contribution margin by product line.
    whyItMatters: >-
      The acquisition-parity and TCO story is central to the thesis but cannot be verified financially from public
      sources.
    diligencePath: Request unit-economics deck, warranty assumptions, and margin bridge by EV and hybrid SKU.
    relatedQuestionRefs:
      - QI023
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: minor
    topic: backlog conversion
    missingEvidence: Order-to-delivery conversion, cancellations, repeat orders, and channel mix.
    whyItMatters: The $400 million preorder book is only useful if it converts into shipped, paid vehicles with acceptable margins.
    diligencePath: Obtain sales pipeline and delivered-unit cohort reporting.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI001
      - TI005
  - type: private-evidence-only
    severity: material
    topic: fleet-scale reliability and battery health
    missingEvidence: >-
      Failure-rate, warranty-claim, battery-degradation, thermal-event, and uptime data from vehicles in sustained
      service.
    whyItMatters: >-
      The public architecture story is credible, but durability and energy-system proof is essential in medium-duty
      commercial deployment.
    diligencePath: Request fleet telemetry, reliability dashboards, and warranty-performance cohorts by product line.
    relatedQuestionRefs:
      - QE019
      - QE020
      - QE021
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: ADAS safety validation
    missingEvidence: >-
      Internal safety case, disengagement-style metrics, validation scenarios, intervention rates, and customer adoption
      data for Phantom-enabled features.
    whyItMatters: ADAS claims can strengthen the moat only if they are safe, robust, and meaningfully deployed.
    diligencePath: Request software safety documents, pilot metrics, and customer feature-usage data.
    relatedQuestionRefs:
      - QE014
      - QE016
      - QE022
    relatedTableRefs:
      - TE005
  - type: private-evidence-only
    severity: minor
    topic: platform-scope discipline
    missingEvidence: >-
      R&D allocation, roadmap sequencing, and engineering-resource tradeoffs across fleets, specialty, power, and
      robotics programs.
    whyItMatters: >-
      Too much adjacency can dilute the core medium-duty execution engine even when each technical idea is attractive on
      its own.
    diligencePath: Request product-roadmap governance materials and staffing by program.
    relatedQuestionRefs:
      - QE023
    relatedTableRefs:
      - TE002
      - TE005
  - type: private-evidence-only
    severity: material
    topic: delivered-customer cohorts
    missingEvidence: Units shipped by customer, delivery timing, reorder rates, cancellations, and deployment outcomes.
    whyItMatters: Named orders and partnerships are credible, but cohort data is needed to evaluate real traction quality.
    diligencePath: Request customer-by-customer delivery and reorder dashboards for the top accounts.
    relatedQuestionRefs:
      - QU019
      - QU020
      - QU024
    relatedTableRefs:
      - TU001
      - TU005
  - type: private-evidence-only
    severity: material
    topic: customer concentration and channel mix
    missingEvidence: Revenue by top customers, dealer versus direct mix, public-sector utilization, and Canada channel performance.
    whyItMatters: The GTM is intentionally multi-channel, but concentration and mix determine resilience.
    diligencePath: Request revenue concentration analysis and channel sell-through reporting.
    relatedQuestionRefs:
      - QU018
      - QU022
    relatedTableRefs:
      - TU002
      - TU005
  - type: private-evidence-only
    severity: minor
    topic: customer economics by segment
    missingEvidence: >-
      Margin, service burden, and sales-cycle characteristics by delivery, public sector, RV, healthcare, and
      power-system customers.
    whyItMatters: Some logos may be strategically important but less economically attractive than others.
    diligencePath: Request segment-level gross-margin and CAC / support-cost proxies.
    relatedQuestionRefs:
      - QU017
      - QU023
    relatedTableRefs:
      - TU003
      - TU004
  - type: private-evidence-only
    severity: material
    topic: field reliability and warranty outcomes
    missingEvidence: >-
      Failure rates, warranty-claim frequency, service-time metrics, battery degradation, and reserve performance by
      cohort.
    whyItMatters: These metrics determine whether Harbinger’s platform risks are contained or compounding in real fleet use.
    diligencePath: Request field-quality, warranty, and service dashboards by product line and customer cohort.
    relatedQuestionRefs:
      - QR012
      - QR017
      - QR019
    relatedTableRefs:
      - TR005
  - type: private-evidence-only
    severity: material
    topic: order conversion and customer timing
    missingEvidence: Cancellations, backlog aging, reorder behavior, and site-readiness blockers by account.
    whyItMatters: Harbinger’s biggest public adoption risk is timing and conversion rather than absence of interest.
    diligencePath: Request order-pipeline conversion and site-readiness tracking.
    relatedQuestionRefs:
      - QR005
      - QR020
      - QR021
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: minor
    topic: supplier and input exposure
    missingEvidence: Input-source concentration, cell allocation terms, and BOM sensitivity to tariffs or trade shocks.
    whyItMatters: Supply-chain risk may look manageable publicly while remaining acute inside the bill of materials.
    diligencePath: Request supplier concentration and tariff-sensitivity analysis.
    relatedQuestionRefs:
      - QR010
    relatedTableRefs:
      - TR005
  - type: private-evidence-only
    severity: material
    topic: operating metrics for comp valuation
    missingEvidence: Revenue, gross margin, EBITDA trajectory, backlog conversion, and unit contribution by product line.
    whyItMatters: Without operating metrics, public comp analysis cannot be translated into a reliable point estimate.
    diligencePath: Request audited financials and a board-level KPI package for revenue, margin, and backlog conversion.
    relatedQuestionRefs:
      - QV009
      - QV015
      - QV019
    relatedTableRefs:
      - TV002
      - TV003
      - TV005
  - type: private-evidence-only
    severity: material
    topic: runway and dilution risk
    missingEvidence: Current cash balance, burn, financing terms, liquidation preferences, and expected next-round timing.
    whyItMatters: Valuation is highly sensitive to whether Harbinger can scale without punitive dilution.
    diligencePath: Request cap table, financing docs, current cash/burn dashboard, and a financing plan.
    relatedQuestionRefs:
      - QV017
      - QV020
    relatedTableRefs:
      - TV004
      - TV005
  - type: private-evidence-only
    severity: minor
    topic: secondary-market mark quality
    missingEvidence: Methodology, volume, and recency behind secondary-market private valuation marks.
    whyItMatters: Conflicting private marks can mislead if they reflect thin or stale trading rather than broad investor consensus.
    diligencePath: Request round documents and any recent tender / secondary transaction details.
    relatedQuestionRefs:
      - QV001
      - QV002
      - QV023
    relatedTableRefs:
