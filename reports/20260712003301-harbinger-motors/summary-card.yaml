  topStrengths:
    - Stronger capital base and strategic-customer proof than many distressed commercial EV peers.
    - Coherent clean-sheet platform reused across EV, hybrid, vocational, RV, healthcare, and power-system applications.
    - Multi-channel GTM through direct fleets, dealers, Sourcewell procurement, and specialty partners.
    - Hybrid and HC expansions reduce reliance on ideal pure-BEV route conditions.
  topRisks:
    - Public revenue, margin, burn, and backlog-conversion disclosure remain absent.
    - Charging, utility, and customer-site readiness can slow adoption even if product-market fit is real.
    - Warranty, service-scale, and field-quality execution are under-disclosed and could impair the thesis if they slip.
    - Conflicting private-market marks make exact valuation precision weakly supported from public evidence.
  unresolvedGaps:
    - Revenue, gross margin, unit contribution, burn, and runway remain undisclosed.
    - Delivered-customer cohorts, repeat-order behavior, and cancellation rates are not public.
    - Field reliability, warranty-claim, and service-cohort data are still private.
    - The methodology and tradable depth behind public private-company valuation marks are unclear.
