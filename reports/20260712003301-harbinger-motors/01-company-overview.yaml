callouts:
- calloutType: strength
  title: Harbinger has moved beyond pitch-deck status
  body: The company now has public evidence of first customer delivery, serial production, a strategic battery supplier, a large binding preorder book, and a FedEx-backed financing round. That combination is materially stronger than many private EV stories that remain pre-production or customer-anecdotal.
  claimRefs:
  - CO021
  - CO024
  - CO026
  - CO028
  - CO041
- calloutType: risk
  title: Disclosure still lags the scale of the financing story
  body: Harbinger’s operating and fundraising narrative is increasingly detailed, but the public record still omits a current board roster, ownership percentages, revenue disclosure, and a fully reconciled valuation history. Investors can underwrite strategic progress, but not the complete economics of the cap table.
  claimRefs:
  - CO019
  - CO020
  - CO039
  - CO040
- calloutType: insight
  title: The company is widening its wedge from parcel fleets into specialty and adjacent markets
  body: RVs, mobile healthcare, public procurement, stationary energy storage, and defense robotics all extend the same core chassis-and-battery competence into different end markets. That broadens optionality, but it also raises the bar for focus and execution discipline.
  claimRefs:
  - CO031
  - CO032
  - CO033
  - CO034
  - CO042
