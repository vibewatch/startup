- id: leadership-team-and-governance
  title: Leadership team and governance visibility
  body: The visible leadership story is founder-led and operations-heavy. John Harris remains the public face and co-founder CEO, Phillip Weicker is the co-founder CTO, and the executive bench publicly includes production, finance, partnerships, and sales leaders. Fred DePerez’s 2025 appointment reinforced the shift from product development toward commercial scale-up. What remains far less visible is formal governance. Public sources identify management more clearly than they identify the current board, protective provisions, or investor control rights. Funding announcements occasionally note a board seat or strategic sponsor, but they do not disclose the whole governance map. For diligence purposes, Harbinger looks easy to identify operationally and harder to underwrite institutionally.
