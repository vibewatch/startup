company:
  name: Harbinger Motors
chapter:
  number: 1
  title: Company Overview
  summary: Harbinger Motors is a 2021-founded Garden Grove, California commercial-EV startup that has progressed from a 2022 platform reveal to serial production, hybrid and low-cab-forward product expansion, and strategic financing from THOR, Capricorn, and FedEx. Public evidence supports meaningful market validation in medium-duty fleets, but exact post-money valuation, board composition, and cap-table economics remain only partially visible.
sections:
- id: identity-footprint-product
  title: Identity, footprint, and business model
  body: 'Harbinger Motors presents itself as an American-made medium-duty commercial-vehicle manufacturer rather than as a passenger-EV transplant. The company’s current materials emphasize Class 4-6 fleet applications, a vertically integrated architecture, and product forms such as stripped chassis, cab chassis, step vans, and the HC Series Cab. The economic wedge is equally clear: Harbinger wants fleets to buy electrification for operating and acquisition economics, not for premium branding. Current pages and earlier launch materials consistently tie the company to Garden Grove, California, where headquarters, research, assembly, and battery-pack work are publicly located. That makes Harbinger best understood as an industrial platform company serving commercial fleets, upfitters, and specialty-vehicle builders.'
