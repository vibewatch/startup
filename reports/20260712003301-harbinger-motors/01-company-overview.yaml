  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: valuation-gap
    missingEvidence: A definitive round-by-round cap-table reconciliation explaining the difference between Harbinger’s official $358M cumulative funding disclosure and Forge’s lower cumulative total.
    whyItMatters: Valuation and dilution analysis depend on a clean funding baseline, especially when the public record also uses a non-official $1.08B post-money estimate.
    diligencePath: Request the financing timeline, round labels, and any side vehicles or convertibles from management or a full private-market database.
    relatedQuestionRefs:
    - QO011
  - type: private-evidence-only
    severity: material
    topic: governance-gap
    missingEvidence: Current board roster, investor ownership percentages, protective provisions, and any observer or control rights.
    whyItMatters: Governance concentration and control rights shape future financing flexibility and downside outcomes for new investors.
    diligencePath: Obtain the cap table, board list, and financing documents under NDA.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO002
    - TO003
  - type: private-evidence-only
    severity: minor
    topic: current-headcount
    missingEvidence: An up-to-date 2026 employee count and functional distribution by engineering, production, sales, and service.
    whyItMatters: Headcount is a useful proxy for scale readiness and burn, but current public disclosures stop at historical hiring ambitions.
    diligencePath: Request a current org chart and monthly headcount report from management.
    relatedQuestionRefs:
    - QO024
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: TO004 milestone chronology completeness
    missingEvidence: A fully exhaustive milestone chronology covering every hiring, manufacturing, certification, and commercial event between launch and current run date.
    whyItMatters: The public chronology is strong on major announcements but still omits some internal or non-press milestones that could explain pacing between funding, production, and customer deployments.
    diligencePath: Request an internal milestone tracker and operating-review deck to reconcile public milestones with factory, delivery, and hiring checkpoints.
    relatedTableRefs:
    - TO004
