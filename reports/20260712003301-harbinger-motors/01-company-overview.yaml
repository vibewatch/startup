- id: milestones-and-platform-expansion
  title: Milestones and platform expansion
  body: 'The operating timeline is fast by industrial-startup standards. Harbinger launched publicly in 2022, relocated to a larger Garden Grove base in 2023, delivered its first customer chassis to THOR in 2024, announced a large preorder book the same year, and formally started serial production in April 2025. Since then it has expanded in several directions: a plug-in hybrid platform, Panasonic battery sourcing, the HC Series Cab, the Phantom AI acquisition and ZF licensing tie-up, Harbinger Industria for off-grid energy storage, a Frazer healthcare partnership, and an American Rheinmetall robotics partnership. The positive interpretation is execution breadth around one core platform. The cautionary interpretation is that adjacent programs can outrun organizational focus before revenue, service depth, and governance disclosure catch up.'
  claimRefs:
