    trucks, specialty-vehicle integrations, ADAS/software adjacencies, and battery-backed power systems.
  customerFocus: >-
    Commercial delivery fleets, vocational and public-sector operators, RV and specialty-vehicle OEMs,
    healthcare/mobile-service partners, and adjacent industrial power customers.
  businessModel: >-
    Primarily hardware and platform monetization through vehicle chassis sales, specialty-program partnerships, dealer
    and procurement channels, and emerging adjacency revenue from power systems and software/licensing.
  stage: Series C private company
  fundingStatus: >-
