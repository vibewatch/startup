      - number: '3.2'
        title: Direct EV peers and positioning
        blocks:
          - type: paragraph
            body: >-
              Among current direct EV peers, Lion Electric, Xos, and Workhorse/Motiv matter most. Lion’s Lion6 proves
              there is established Class 6 electric competition on paper, but the company’s creditor-protection process
              sharply weakens its commercial threat. Xos combines commercial EVs with mobile energy storage and charging
              infrastructure, which makes it a more operationally similar competitor, although its public market value
              remains small and its revenue base is still modest. Workhorse’s merger with Motiv created a broader North
              American medium-duty electric truck and bus supplier, with road vehicles already in the field and explicit
              scale aspirations. Relative to those peers, Harbinger’s strengths are focus, platform coherence, and a
              cleaner strategic-capital story. Its risk is that more established peers may have deeper field-service or
              installed-base advantages even if their balance sheets or segment focus are mixed.
