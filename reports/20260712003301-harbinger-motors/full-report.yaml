companyProfile:
  summary: >-
    Harbinger Motors is a Southern California electric commercial vehicle company founded in 2021 and now based in
    Garden Grove. The company develops a vertically integrated medium-duty platform spanning electric chassis, plug-in
    hybrid chassis, low-cab-forward work trucks, specialty-vehicle programs, and auxiliary power systems. Public
    evidence shows roughly $358 million of disclosed cumulative funding, named customer and partner traction including
    FedEx, Bimbo Bakeries USA, THOR, Airstream, and Frazer, and a product strategy built around route-fit
    electrification rather than one narrow body style. The biggest diligence limitation is not market relevance but
    disclosure quality: Harbinger still does not publish revenue, gross margin, burn, backlog conversion, or
    service-cohort performance, which keeps both financial and valuation underwriting highly scenario-dependent.
  foundedDate: '2021-02-01'
