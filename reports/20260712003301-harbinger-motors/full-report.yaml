      - number: '3.3'
        title: Adjacent incumbents and substitutes
        blocks:
          - type: paragraph
            body: >-
              Blue Bird, BYD, and Roush CleanTech illustrate the adjacent competition Harbinger faces. Blue Bird is not
              a stripped-chassis peer, but it is a scaled public producer of electric school buses with real revenue and
              market capitalization, which matters because public and institutional buyers can allocate electric-vehicle
              budgets to buses or trucks depending on program goals. BYD’s North American truck and bus presence shows
              what global manufacturing scale can look like, even if its product mix and buyer set only partly overlap
              with Harbinger’s. Roush CleanTech shows the most important substitute threat: not every fleet will move
              from diesel directly to BEV if propane, hybrid, or other lower-emission alternatives clear procurement and
              uptime hurdles more easily. Harbinger therefore competes not only against other EV startups but also
              against budget alternatives that solve emissions or operating-cost problems with less infrastructure
              change.
