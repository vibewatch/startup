  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Charging, grid, and infrastructure risk
        blocks:
          - type: paragraph
            body: >-
              Charging remains the most visible system-level risk for Harbinger even though the company has sensibly
              designed around depot fleets and Level 2 compatibility. Sector sources continue to show uncertain federal
              charging trajectories, large infrastructure investment gaps, and uneven charger reliability. These risks
              matter because Harbinger’s customer thesis still depends on fleets being able to install, fund, maintain,
              and operate dependable charging workflows. Harbinger’s hybrid products partially blunt that risk, but they
              do not remove it for the core BEV thesis. The consequence is that adoption can slow even when the vehicle
              platform itself is competitive, simply because site power, utility timelines, or charger uptime lag
              customer interest. The practical risk is that customer projects can stall for reasons that look external
              to Harbinger but still damage bookings, perceptions of readiness, and fleet confidence in the category.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
