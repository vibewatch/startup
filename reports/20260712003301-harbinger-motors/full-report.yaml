            body: >-
              Harbinger does not publish classic startup GTM metrics such as CAC, payback, sales cycle, or funnel
              conversion. Instead, public evidence offers proxy signals. The May 2024 order-book release reported 4,000
              binding preorders worth about $400 million, while dealer partners were said to cover 78% of the U.S. and
              Canada population. Sourcewell adds a public-procurement route, Canada sales widen geography, and ETHERO
              plus other dealer relationships suggest a channel-led commercial model rather than pure direct selling.
              The FedEx order is even more important because it pairs strategic capital with demand. These signals do
              not substitute for hard sales-efficiency disclosure, but they do show that Harbinger is trying to scale
              through a combination of direct strategic accounts, dealer channels, cooperative procurement, and
              specialty-program partnerships rather than through one narrow route to market.
