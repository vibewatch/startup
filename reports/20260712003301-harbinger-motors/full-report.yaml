  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and Harbinger’s served wedge
        blocks:
          - type: paragraph
            body: >-
              Harbinger is not trying to electrify all trucking. Its practical market is medium-duty Class 4-6
              commercial and specialty vehicles that return to base, operate on relatively predictable routes, or need
              body-builder flexibility more than ultra-long-range linehaul performance. That boundary excludes most
              consumer pickup demand and the hardest class 8 highway applications, where charging, payload, and
              duty-cycle complexity remain much tougher. The company’s own materials focus on stripped chassis, cab
              chassis, step vans, low-cab-forward work trucks, and public-fleet procurement channels, which together
              imply a served wedge spanning parcel delivery, utilities, vocational service fleets, municipal agencies,
              specialty vehicle builders, RVs, and healthcare-response upfits. The key point is that Harbinger’s market
              is narrower than “all EV trucks” but broader than a single parcel-delivery niche.
            claimRefs:
