      - number: '7.5'
        title: Execution, warranty, and focus risk
        blocks:
          - type: paragraph
            body: >-
              Finally, Harbinger faces a set of internal execution risks. Vertical integration can improve cost and
              design control, but it also concentrates operational complexity inside the company. A long warranty
              promise, multiple product lines, specialty programs, ADAS integration, and robotics adjacencies all raise
              the burden on engineering, service, and quality systems. If warranty claims, field repairs, or software
              validation slip, Harbinger’s differentiation story could turn into a liability stack. Likewise, if the
              company expands too aggressively across fleets, RVs, power systems, and robotics, focus risk could erode
              the clean simplicity that currently makes the platform attractive. The public data supports optimism about
              engineering intent, but it also argues for caution on scaled execution. The near-term diligence question
              is not whether the roadmap is interesting, but whether the organization can keep quality, service, and
              prioritization ahead of ambition.
            claimRefs:
              - CR033
              - CR034
              - CR035
