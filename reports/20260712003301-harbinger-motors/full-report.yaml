      - number: '7.2'
        title: Fleet adoption and demand-quality risk
        blocks:
          - type: paragraph
            body: >-
              A second risk is that medium-duty EV adoption can remain bumpier and slower than product advocates expect.
              Multiple industry and policy sources point to persistent barriers around upfront cost, charging
              availability, reliability confidence, and route complexity. Harbinger’s own order-book and customer
              announcements prove demand interest, but public data still does not show delivered-cohort quality,
              cancellations, or retention. That gap means Harbinger could be directionally right on fleet
              electrification while still taking longer than expected to convert intent into durable revenue. In
              hardware markets, timing risk is often the real risk, and Harbinger is exposed to that timing problem.
              That is especially important in a category where CFOs and fleet operators often phase purchases instead of
              switching entire classes of vehicles at once.
            claimRefs:
              - CR009
              - CR010
