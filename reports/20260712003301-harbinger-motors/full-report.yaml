      - number: '1.5'
        title: Adverse signals and open questions
        blocks:
          - type: paragraph
            body: >-
              The public evidence set is constructive but not frictionless. Harbinger and sympathetic trade coverage
              stress price parity and an underserved market niche, yet those claims sit inside a commercial-ZEV market
              that trade media describes as having reset after 2025 uncertainty, with charging, incentives, and
              deployment timing still uneven. Public financial visibility also remains incomplete. Forge publishes a
              $1.08 billion post-money figure and a lower cumulative funding tally than Harbinger’s own releases, which
              suggests either database lag or round-structure complexity that outsiders cannot fully reconcile. Public
              materials likewise do not disclose current board composition, revenue, or ownership rights. Those
              omissions do not erase the progress to date, but they do mean later financial and valuation work should
              treat Harbinger as strategically promising rather than fully transparent.
