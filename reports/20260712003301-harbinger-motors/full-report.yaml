  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Landscape and direct peer set
        blocks:
          - type: paragraph
            body: >-
              Harbinger’s competitive set is broader than a single list of electric-truck startups. The most relevant
              direct peers are medium-duty electric or electrified platform suppliers such as Xos, Lion, and the
              post-merger Workhorse/Motiv combination. Adjacent competition comes from larger commercial-EV or bus
              manufacturers such as Blue Bird and BYD, as well as alternative-fuel providers like Roush CleanTech that
              give fleets a lower-disruption path than full battery-electric adoption. Still other substitutes include
              incumbent ICE chassis from traditional truck OEMs and hybrid or renewable-fuel solutions. The important
              observation is that Harbinger’s exact package—clean-sheet medium-duty stripped chassis, hybrid option,
              public-procurement route, and specialty-vehicle flexibility—is not directly mirrored by every competitor,
              which lowers exact one-to-one rivalry even while budget competition remains intense.
            claimRefs:
              - CP001
