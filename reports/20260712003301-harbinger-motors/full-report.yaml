      - number: '1.3'
        title: Capital base, investor syndicate, and early customer validation
        blocks:
          - type: paragraph
            body: >-
              Harbinger has raised material strategic capital for a still-private hardware company. Public releases
              support a $60 million Series A in 2023, a $100 million Series B in January 2025, and a $160 million Series
              C in November 2025, bringing official cumulative funding to $358 million. The investor list matters almost
              as much as the dollars: THOR and Ridgeline early, Capricorn and Leitmotif in the next phase, then FedEx
              alongside THOR and Capricorn in the most recent round. Demand validation also arrived relatively early. By
              May 2024 Harbinger said it had 4,000 binding preorders worth roughly $400 million, named Bimbo Bakeries
              USA and other customers, and said dealer partners already covered most of the U.S. and Canada population.
              FedEx then added a 53-vehicle order. On public evidence alone, Harbinger has crossed the line from concept
              enthusiasm into strategic ecosystem backing. today. externally.
