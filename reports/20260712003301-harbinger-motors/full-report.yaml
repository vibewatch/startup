      - number: '5.3'
        title: Hybrid and HC Series expansions
        blocks:
          - type: paragraph
            body: >-
              Harbinger’s hybrid and HC Series launches are strategically important because they admit a practical
              truth: not every medium-duty route is ready for pure battery electric today. The hybrid platform keeps
              Harbinger’s electric foundation but adds a gasoline generator for roughly 500 miles of range and multiple
              operating modes. The HC Series Cab then repackages the architecture into a low-cab-forward work truck with
              power take-off and exportable power features for vocational fleets. Third-party trade coverage aligns with
              the official message that these products target maneuverability, uptime, and jobsite capability rather
              than just zero-emission branding. That broadens the addressable market materially. It also shows product
              discipline. Instead of abandoning electrification constraints, Harbinger is creating a transitional
              architecture that fits longer or less predictable duty cycles while preserving platform commonality.
