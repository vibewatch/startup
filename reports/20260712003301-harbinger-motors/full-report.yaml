        title: Software, ADAS, and robotics adjacencies
        blocks:
          - type: paragraph
            body: >-
              The newest technical layer is software and autonomy adjacency. The Phantom AI acquisition plus ZF
              licensing agreement gives Harbinger a path to embed advanced driver-assistance features into commercial
              vehicles while also licensing the technology into passenger applications. Publicly, Harbinger frames this
              as safety and feature differentiation rather than full autonomy. The American Rheinmetall partnership
              widens the platform again by adapting Harbinger electrification and drive-by-wire capabilities for
              robotics and uncrewed ground vehicles. This is technically interesting because it validates the
              flexibility of steer-by-wire, control systems, and power architecture outside standard fleet trucks.
              However, these adjacencies are earlier-stage and less proven than the chassis business. Public materials
              do not yet disclose meaningful deployed ADAS metrics, software attach rates, or defense-program revenue.
