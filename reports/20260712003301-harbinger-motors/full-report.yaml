      - number: '2.3'
        title: Buyers, budget owners, and procurement path
        blocks:
          - type: paragraph
            body: >-
              The buyer stack in Harbinger’s market is more complex than “fleet operator buys truck.” In private fleets,
              the user is typically a delivery or service operation, the economic decision owner is procurement or fleet
              finance, and the integration path runs through route analysis, charging design, body upfitting, and
              service support. Public agencies add another procurement layer because city, county, utility, or
              school-district buyers often depend on cooperative purchasing, incentives, and compliance-friendly
              contract vehicles. Specialty and body-builder markets such as RVs or mobile healthcare add yet another
              layer in which the immediate buyer may be a manufacturer or upfitter rather than the eventual operator.
              This complexity favors suppliers that can package financing support, charging guidance, incentives help,
              and dealer or service access rather than just sell a vehicle platform.
