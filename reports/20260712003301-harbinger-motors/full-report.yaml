              - CV014
              - CV015
              - CV016
      - number: '8.3'
        title: Scenario-based valuation anchors
        blocks:
          - type: paragraph
            body: >-
              Given the disclosure gaps, a scenario framework is more honest than a formulaic comparable set. In a
              downside scenario, Harbinger converges toward the market’s treatment of thinly capitalized EV platform
              companies: low strategic value, financing dependence, and muted equity value regardless of technical
              merit. In a base scenario, Harbinger sustains its premium over those distressed peers because it has
              better funding, stronger customers, and a more coherent product stack. In an upside scenario, Harbinger
              begins to justify an upper-midrange industrial technology valuation because it proves deliveries,
              gross-margin direction, and service execution—without yet needing to match Blue Bird’s profitability. This
              is why the public case can support a billion-plus valuation as plausible, but not as fully proven.
              Investors should therefore think in terms of milestone-triggered re-pricing rather than assuming the
              latest mark is durable.
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
