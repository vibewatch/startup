      - number: '5.5'
        title: Technical verdict and open questions
        blocks:
          - type: paragraph
            body: >-
              Technically, Harbinger looks more like a platform company than a body builder, and that is the strongest
              positive in the public record. The company has a coherent component stack, route-fit charging logic, a
              pragmatic hybrid bridge, and credible adjacent programs in specialty vehicles and robotics. It also
              appears disciplined about designing for medium-duty realities such as upfit compatibility, uptime,
              serviceability, and exportable power. The open questions are mostly post-launch questions: durability in
              sustained fleet use, actual battery and warranty performance, software safety validation, and whether the
              same platform can stretch across too many adjacent markets without diluting focus. Public evidence
              supports a strong engineering thesis, but not yet a fully de-risked technical one.
