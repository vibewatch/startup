      - number: '5.2'
        title: Battery, charging, and power systems
        blocks:
          - type: paragraph
            body: >-
              The second layer of Harbinger’s technical moat is energy architecture. Company materials emphasize
              800-volt electrical architecture, modular battery pack sizing, Level 2 charging compatibility, and
              depot-oriented charging logic. Those choices aim at lower infrastructure friction for fleets that return
              to base each night. Panasonic’s designation as official cell supplier adds credibility to the battery
              stack, while the product-lineup materials and charging page suggest Harbinger is designing batteries and
              charging strategy around route-fit rather than around peak-spec marketing. Harbinger Industria extends
              this logic beyond vehicles by turning battery capability into off-grid power systems. The technology looks
              commercially rational: deploy energy-dense EV systems where route predictability is strong, then repurpose
              adjacent power know-how into complementary industrial products. The main missing proof points are battery
              degradation, charging uptime, and real-world thermal performance at scale.
