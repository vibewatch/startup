        title: Exhibits
        blocks:
          - type: callout
            title: Harbinger is easier to place directionally than precisely
            body: >-
              Public evidence supports placing Harbinger above distressed commercial EV micro-caps and below proven
              public winners, but not assigning a clean exact mark with conviction.
            calloutType: insight
            claimRefs:
              - CV009
              - CV010
              - CV017
              - CV033
