  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Disclosed private valuation signals
        blocks:
          - type: paragraph
            body: >-
              Public private-company valuation signals for Harbinger are useful but inconsistent. Forge reports a
              post-money valuation of roughly $1.08 billion with total funding around $339.9 million, while Harbinger’s
              own Series C materials support cumulative funding of $358 million. A separate secondary-market profile
              from Premier Alternatives reports a materially higher implied valuation of $2.4 billion and total funding
              of $354 million. This conflict is not unusual for private-company datasets, but it means the public
              valuation debate starts with ranges, not facts. The most defensible takeaway is that Harbinger crossed the
              unicorn threshold in late 2025 or early 2026 on at least some secondary-market sources, but the exact mark
              is not stable enough to treat as audited truth. That alone should push valuation work away from point
              estimates and toward confidence bands with explicit source-quality discounts.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
