    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, footprint, and business model
        blocks:
          - type: paragraph
            body: >-
              Harbinger Motors presents itself as an American-made medium-duty commercial-vehicle manufacturer rather
              than as a passenger-EV transplant. The company’s current materials emphasize Class 4-6 fleet applications,
              a vertically integrated architecture, and product forms such as stripped chassis, cab chassis, step vans,
              and the HC Series Cab. The economic wedge is equally clear: Harbinger wants fleets to buy electrification
              for operating and acquisition economics, not for premium branding. Current pages and earlier launch
              materials consistently tie the company to Garden Grove, California, where headquarters, research,
              assembly, and battery-pack work are publicly located. That makes Harbinger best understood as an
              industrial platform company serving commercial fleets, upfitters, and specialty-vehicle builders.
