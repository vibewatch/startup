      - number: '8.2'
        title: Public comparable context
        blocks:
          - type: paragraph
            body: >-
              Public comparables show why Harbinger valuation work is so sensitive to execution assumptions. Blue Bird
              trades at a multi-billion-dollar market cap with positive earnings, positive free cash flow, and almost
              $1.5 billion of trailing revenue. Xos and Workhorse, by contrast, trade at tiny equity values with weak
              profitability and stressed balance-sheet metrics. Lion’s distress underscores how badly commercial EV
              stories can re-rate when financing or execution breaks. These peers do not give Harbinger a clean single
              multiple; they give it a valuation corridor defined by one profitable incumbent and several highly
              stressed or subscale EV specialists. Harbinger’s likely placement inside that corridor depends mainly on
              whether it becomes a scaled operator or stalls as a promising but under-monetized platform. The spread is
              so wide that comparator selection becomes almost as important as the number itself.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV009
              - CV010
