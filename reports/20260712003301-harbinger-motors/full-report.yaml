      - number: '7.3'
        title: Capital intensity and sector-distress risk
        blocks:
          - type: paragraph
            body: >-
              Commercial EV startups do not only compete on product; they compete on survival. The sector’s recent
              history includes mergers, creditor protection, production slowdowns, and investor skepticism. Harbinger’s
              funding base is stronger than many peers, but it still operates in a market where the cost to electrify
              fleets at scale is huge and where public-market peers continue to exhibit stress. That matters because
              external distress can shrink customer confidence, tighten supplier terms, and raise the bar for follow-on
              financing even for better-positioned companies. Harbinger’s private status shields it from daily
              public-market pressure, but not from the underlying economics that produced trouble elsewhere. In other
              words, Harbinger must prove not only that its trucks work, but also that its balance sheet and service
              model can survive a skeptical market tape.
            claimRefs:
              - CR017
              - CR018
