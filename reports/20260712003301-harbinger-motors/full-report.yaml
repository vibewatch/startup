      - number: '7.4'
        title: Regulatory, policy, and supply-chain risk
        blocks:
          - type: paragraph
            body: >-
              Policy is both a tailwind and a dependency risk. Emissions rules, grant programs, and procurement pathways
              help Harbinger, but policy timing, funding reversals, and changing enforcement can all move slower or
              faster than expected. At the same time, batteries and electrified components remain exposed to global
              supply-chain and trade uncertainty. Harbinger’s Panasonic relationship helps, and its domestic
              manufacturing narrative should reduce some risk, but it cannot fully insulate the company from upstream
              volatility in cells, power electronics, or cross-border trade policy. The right conclusion is that
              Harbinger benefits from policy support while also depending on it more than an incumbent diesel platform
              would. A company selling lower-emission platforms into budget-conscious fleets therefore has to manage
              both regulatory upside and regulatory whiplash at the same time.
            claimRefs:
              - CR025
