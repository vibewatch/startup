          - type: callout
            title: The biggest valuation risk is mistaking strategic credibility for operating proof
            body: >-
              Funding, customers, and product coherence all matter, but until revenue, margins, and service quality are
              visible, a strong narrative can still outrun the underlying operating proof required to defend a higher
              mark.
            calloutType: risk
            claimRefs:
