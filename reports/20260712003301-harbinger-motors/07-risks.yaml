tables:
- id: TR001
  title: Charging risk table
  columns:
  - Risk
  - Public evidence
  - Why it matters for Harbinger
  - Mitigant
  - Residual exposure
  rows:
  - - Utility / site delays
    - IECI and IEA show uncertain charging rollout
    - Fleets may defer orders if sites are not ready
    - Level 2 and hybrid options
    - Still slows pure-BEV adoption.
  - - Charger reliability
    - Harvard/HBS found reliability concerns
    - Fleet uptime depends on dependable charging hardware
    - Depot design and controlled charging windows
    - Operational outages remain possible.
  - - High infrastructure cost
    - ATA-aligned report pegs electrification cost extremely high
    - Customer ROI can slip if charging capex swells
    - Incentives and depot focus
    - Small and mid-sized fleets remain sensitive.
  - - Grid constraints
    - IEA and MIT note power and grid bottlenecks
    - Interconnection delays can push deployment timelines
    - Hybrid bridge and phased rollout
    - Does not solve long-term site power needs.
  - - Customer capability variance
    - Not all customers manage charging equally well
    - Mis-execution by fleets can be blamed on vehicle economics
    - Dealer and partner support
    - Support burden may rise.
  - - Policy dependence
    - Charging buildout partly relies on programs and public funds
    - Support changes can ripple into customer timing
    - Diverse customer base
    - Still external and hard to control.
  notes: Charging risk can slow Harbinger adoption even if the vehicle platform itself performs as designed.
