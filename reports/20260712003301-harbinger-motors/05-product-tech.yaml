callouts:
- calloutType: strength
  title: The clean-sheet, reusable commercial platform is Harbinger’s strongest technical asset
  body: The public record consistently shows one integrated medium-duty platform reused across EV, hybrid, HC, specialty, and auxiliary-power applications. That creates a credible engineering narrative around packaging, upfit flexibility, and parts commonality.
  claimRefs:
  - CE001
  - CE005
  - CE006
  - CE017
  - CE020
  - CE033
- calloutType: risk
  title: The evidence is rich on architecture but thin on field validation
  body: Battery degradation, real-world service rates, warranty claims, software safety metrics, and continuous-duty export-power performance remain largely private. Harbinger’s technical story is strong, but many of the most important proof points still sit outside the public data room.
  claimRefs:
  - CE015
  - CE016
  - CE031
  - CE034
  - CE036
  - CE037
  - CE038
- calloutType: insight
  title: The hybrid and robotics moves are not thesis changes; they are route-fit and platform-flexibility extensions
  body: Hybrid broadens route coverage where charging uncertainty persists, while the Phantom AI and Rheinmetall programs show that Harbinger believes its control architecture can travel beyond standard fleet trucks. That increases option value, but also raises execution-scope risk.
  claimRefs:
  - CE018
  - CE022
  - CE025
