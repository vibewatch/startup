chapter:
  number: 5
  title: Product & Technology
  summary: 'Harbinger’s technical thesis is unusually coherent for a private medium-duty EV startup: a clean-sheet, vertically integrated platform reused across multiple body styles, a depot-friendly charging posture, and a hybrid bridge product for hard-to-electrify routes. The roadmap now extends into ADAS licensing, auxiliary power systems, and robotics partnerships, but public evidence still lacks deep field-performance and software-safety data.'
sections:
- id: platform-architecture-and-vertical-integration
  title: Platform architecture and vertical integration
  body: Harbinger’s core technical proposition is not a single truck; it is a reusable, clean-sheet commercial platform. Official product and technology materials consistently describe an in-house stack spanning the drivetrain, battery system, steering, brakes, and chassis, rather than an electrified retrofit of a legacy ICE frame. That matters because the medium-duty market punishes packaging compromises, service complexity, and body-upfit incompatibility. Harbinger’s platform has already been extended across electric chassis, plug-in hybrid chassis, step-van and low-cab-forward variants, which suggests the company designed around modular reuse from the start. The downloads hub and lineup PDF reinforce that message by presenting a coherent family rather than unrelated products. Public evidence does not prove superior field reliability yet, but it does show a thoughtfully integrated architecture built for commercial duty cycles instead of consumer-car carryover.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
