  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cash burn and runway
    missingEvidence: Current cash on hand, monthly burn, working-capital usage, and management’s internal runway view.
    whyItMatters: Capital adequacy cannot be underwritten from funding totals alone in a manufacturing-heavy startup.
    diligencePath: Request monthly cash, burn, and liquidity reporting plus a board-approved budget.
    relatedQuestionRefs:
    - QI019
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: unit economics and gross margin
    missingEvidence: Vehicle-level ASP, BOM, warranty reserve assumptions, and contribution margin by product line.
    whyItMatters: The acquisition-parity and TCO story is central to the thesis but cannot be verified financially from public sources.
    diligencePath: Request unit-economics deck, warranty assumptions, and margin bridge by EV and hybrid SKU.
    relatedQuestionRefs:
    - QI023
    relatedTableRefs:
    - TI002
    - TI003
  - type: private-evidence-only
    severity: minor
    topic: backlog conversion
    missingEvidence: Order-to-delivery conversion, cancellations, repeat orders, and channel mix.
    whyItMatters: The $400 million preorder book is only useful if it converts into shipped, paid vehicles with acceptable margins.
    diligencePath: Obtain sales pipeline and delivered-unit cohort reporting.
    relatedQuestionRefs:
    - QI024
    relatedTableRefs:
    - TI001
    - TI005
