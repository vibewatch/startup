- id: capital-adequacy-and-financing-dependence
  title: Capital adequacy and financing dependence
  body: 'Harbinger looks well-capitalized relative to many private EV peers, but still obviously capital-intensive. Public funding announcements support a $358 million cumulative raise by late 2025, with Series B explicitly earmarked for higher-volume production plus expanded sales, parts, and service operations. The Series C round added FedEx and reiterated the need to scale U.S.-built vehicles and meet larger-fleet demand. The same public record also shows heavy industrial commitments: headquarters and manufacturing expansion, battery-pack production, warranty obligations, software integration, and multiple product lines. Yet the critical financing inputs remain private. No public source discloses current cash, monthly burn, gross margin, working-capital needs, or runway. On that basis, the most defensible financial read is that Harbinger has enough public capital to be credible, but not enough public disclosure to conclude it is fully de-risked from future financing dependence.'
