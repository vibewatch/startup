- id: financial-verdict-and-gaps
  title: Financial verdict and diligence gaps
  body: 'Financially, Harbinger’s public case is promising but incomplete. The company has real top-of-funnel demand signals, strategic investors, and multiple visible monetization levers. It also has a coherent cost-reduction story rooted in platform design, charging fit, and hybrid optionality. But public investors and diligence teams still lack the basics that turn a hardware narrative into an underwritten financial model: actual revenue, backlog conversion, gross margin, unit contribution, capex cadence, cash balance, monthly burn, and the timing of any next financing need. The prudent conclusion is not that Harbinger lacks financial substance; it is that the public data room is still a product-and-capital deck rather than an operating-finance package. Later valuation work should therefore lean on scenario analysis and evidence gaps, not on false precision.'
