callouts:
- calloutType: strength
  title: Harbinger already shows more monetization breadth than many private EV stories
  body: Vehicle sales are still the anchor, but public sources also show specialty-program revenue, public-procurement channels, energy-storage systems, and a software-licensing adjacency. That is broader than a single-truck startup pitch.
  claimRefs:
  - CI001
  - CI004
  - CI006
  - CI007
  - CI008
- calloutType: risk
  title: The public data room is still missing the basic numbers that turn a hardware story into an underwritten financial model
  body: Revenue, gross margin, cash, burn, runway, conversion, and cap-table terms all remain undisclosed. Funding totals make Harbinger credible, but not yet financially transparent.
  claimRefs:
  - CI028
  - CI030
  - CI033
  - CI034
  - CI036
  - CI037
  - CI038
  - CI040
  - CI043
  - CI044
- calloutType: insight
  title: Capital adequacy is visible only through the lens of uses of funds
  body: Series B and C language makes clear that Harbinger is funding volume production, service, and product expansion. What remains invisible is whether the current balance sheet comfortably covers the full trip from scale-up to recurring healthy unit economics.
