- id: cost-structure-and-unit-economics
  title: Cost structure and unit-economics clues
  body: 'The public cost story is about design choices more than disclosed margins. Harbinger repeatedly argues that vertical integration, clean-sheet chassis design, limited supplier layers, and depot-friendly charging can lower acquisition cost and operating expense. The technology and charging pages reinforce that logic by highlighting Level 2 charging compatibility, modular battery increments, a 450,000-mile service-life target, and simplified serviceability. Panasonic battery sourcing should help supply assurance and performance consistency, while long warranty claims are intended to reduce customer anxiety but also imply future warranty liability if field performance underdelivers. The company’s TCO calculator and blog content make the strongest financial argument: fleets should care about fuel, maintenance, and break-even timing. What is missing is the quantitative bridge from those claims to public gross margin, warranty reserve, or per-unit contribution disclosure.'
