chapter:
  number: 4
  title: Financials
  summary: Harbinger’s public financial picture is still mostly a revenue-model and capital-adequacy story rather than a disclosed operating statement. Public evidence supports multiple monetization paths, clear commercial demand proxies, and a large capital base for a private industrial startup, but revenue, gross margin, burn, runway, and customer-conversion metrics remain undisclosed.
sections:
- id: revenue-model-and-monetization
  title: Revenue model and monetization
  body: 'Harbinger’s public revenue story starts with hardware, not software. The company sells electric and hybrid medium-duty chassis into delivery, vocational, public-sector, RV, healthcare, and specialty applications, and it increasingly frames the offering as a platform rather than a one-off truck. That leaves several monetization paths visible in public sources: chassis sales, hybrid variants for longer-duty-cycle fleets, channel sales through dealers, public-sector purchases through cooperative procurement, and specialty-program revenue through partners such as THOR or Frazer. Two newer adjacencies widen the model. Harbinger Industria turns battery expertise into standalone off-grid power systems, and the Phantom AI acquisition plus ZF licensing agreement opens a software and licensing stream. None of these paths has public revenue disclosure behind it yet, but the public business model is much richer than simple vehicle unit sales.'
