callouts:
- calloutType: strength
  title: Harbinger is pointed at one of the most practical early-adoption zones in trucking
  body: Short-route, medium-duty fleets with depot dwell time and strong upfit needs are much more compatible with current battery-electric and hybrid technology than long-haul class 8 operations are. That is precisely where Harbinger has concentrated.
  claimRefs:
  - CM001
  - CM003
  - CM012
  - CM014
- calloutType: risk
  title: The market is attractive, but not frictionless
  body: Charging buildouts, policy reversals, and fleet-capex timing still create real drag on adoption. Harbinger’s market may be more feasible than class 8 long-haul, but it is still infrastructure- and incentive-sensitive.
  claimRefs:
  - CM008
  - CM010
  - CM028
  - CM029
  - CM037
  - CM038
- calloutType: insight
  title: Market size is better read through route-fit and registration lenses than through one generic TAM statistic
  body: The strongest public evidence is that a large share of trucks already operate within BEV-friendly duty cycles and that medium-duty zero-emission registrations are still growing, even when the broader truck-ZEV market is under pressure.
  claimRefs:
  - CM003
  - CM004
  - CM015
  - CM016
