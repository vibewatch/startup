- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - EPA Phase 3 standards
    - Positive
    - 2027+
    - Raises long-term pressure to decarbonize truck fleets
    - Track how much real procurement pull the rule creates in medium-duty fleets.
  - - Short, predictable routes
    - Positive
    - Current
    - Supports MD battery-electric feasibility and depot charging
    - Validate actual customer route profiles against Harbinger range claims.
  - - Level 2 and depot charging fit
    - Positive
    - Current
    - Lowers infrastructure hurdle for smaller fleets versus public-fast-charging dependence
    - Check whether customer depots can electrify without major service upgrades.
  - - Incentives and grants
    - Positive but volatile
    - Current
    - Can reduce upfront cost and accelerate fleet economics
    - Map which incentives are durable versus funding-window dependent.
  - - Grid upgrades and depot capex
    - Negative
    - Current
    - Can delay fleet rollout and erode payback
    - Quantify typical interconnection and site-build timelines.
  - - Public charging scarcity
    - Negative
    - Current
    - Limits operational flexibility for less predictable duty cycles
    - Assess how much Harbinger demand depends on home-base charging.
  - - Substitute low-emission powertrains
    - Negative / mixed
    - Current
    - Propane, RNG, renewable diesel, and hybrids compete for transition budgets
    - Measure win rates against alternative-fuel incumbents.
  - - Market reset after 2025
    - Negative
    - Current
    - Makes customers and investors more demanding on TCO proof and service readiness
    - Test whether Harbinger can convert interest into scaled deployments in a colder market.
  notes: The same factor can help or hurt depending on fleet type; the table frames directional first-order effects rather than precise magnitudes.
