- id: TM002
  title: TAM / SAM / SOM or sizing lens table
  columns:
  - Lens
  - Source / year
  - Value / direction
  - Methodology / unit
  - Confidence
  - Limitation
  rows:
  - - Total electric potential (TEP)
    - Automotive Fleet / 2025
    - 14.4 million commercial trucks
    - Q1 2025 U.S. commercial truck fleet potential
    - medium
    - Includes vehicles beyond Harbinger’s served wedge.
  - - Commercial sub-100-mile routes
    - Automotive Fleet / 2025
    - 67% of commercial-use trucks
    - Share of commercial trucks traveling under 100 miles round trip
    - high
    - Feasibility is not the same as purchase readiness.
  - - All-truck sub-100-mile routes
    - Automotive Fleet / 2025
    - 75% of all trucks
    - Share of all trucks traveling under 100 miles round trip
    - high
    - Includes segments Harbinger does not target.
  - - Commercial pickups under 50 miles
    - Automotive Fleet / 2025
    - 69%
    - Short-range use pattern by fleet type
    - medium
    - Pickup TAM overstates Harbinger’s direct product fit.
  - - Cargo vans under 50 miles
    - Automotive Fleet / 2025
    - 72%
    - Short-range use pattern by fleet type
    - medium
    - Van data is illustrative, not a one-for-one Harbinger product map.
  - - Medium-duty ZE registration momentum
    - ICCT / 2025
    - 61.7% growth in zero-emission MDT registrations
    - Registration growth, not stock or revenue
    - medium
    - Overall bus-and-truck market still shrank in 2025.
  - - Industry-size proxy
    - Workhorse / 2025 and Clean Trucking / 2026
    - ~$23B medium-duty market framing
    - Vendor and trade commentary, not neutral census data
    - low
    - Self-interested and directional rather than definitive.
  - - Charging mix by 2030
    - NREL / 2024
    - Most MD/HD charging expected at depots
    - Infrastructure mode, not sales size
    - high
    - Does not specify Harbinger’s direct share.
  notes: These lenses intentionally mix route-fit, registration, and market-size proxies because public data does not offer one authoritative, neutral TAM number for Harbinger’s exact wedge.
