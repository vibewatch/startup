chapter:
  number: 2
  title: Market Analysis
  summary: 'Harbinger Motors plays in an attractive but still uneven market: medium-duty fleet electrification. Public evidence shows a very large route-fit vehicle base, tightening regulatory pressure, and strong medium-duty use cases such as last-mile delivery and vocational fleets, but adoption still depends on charging readiness, incentive timing, and fleets proving TCO beyond pilots.'
sections:
- id: market-boundary-and-served-wedge
  title: Market boundary and Harbinger’s served wedge
  body: Harbinger is not trying to electrify all trucking. Its practical market is medium-duty Class 4-6 commercial and specialty vehicles that return to base, operate on relatively predictable routes, or need body-builder flexibility more than ultra-long-range linehaul performance. That boundary excludes most consumer pickup demand and the hardest class 8 highway applications, where charging, payload, and duty-cycle complexity remain much tougher. The company’s own materials focus on stripped chassis, cab chassis, step vans, low-cab-forward work trucks, and public-fleet procurement channels, which together imply a served wedge spanning parcel delivery, utilities, vocational service fleets, municipal agencies, specialty vehicle builders, RVs, and healthcare-response upfits. The key point is that Harbinger’s market is narrower than “all EV trucks” but broader than a single parcel-delivery niche.
  claimRefs:
  - CM001
  - CM002
  - CM022
  - CM023
  - CM024
  - CM025
  - CM040
  tableRefs:
