- id: drivers-constraints-and-substitutes
  title: Growth drivers, constraints, and substitutes
  body: 'The strongest market drivers are regulatory pressure, route fit, TCO pressure, and the commercial need for quieter, lower-maintenance vehicles in dense urban or stop-start work. EPA’s Phase 3 heavy-duty greenhouse-gas rule raises long-term compliance pressure beginning with model year 2027, while Harbinger’s own funding and charging pages emphasize that fleets can combine route-fit analysis with incentives and overnight charging to reach attractive economics. But the constraints are equally real. Public charging is not expanding as quickly as vehicle sales, depot buildouts can require expensive grid upgrades, and policy reversals can quickly change fleet-payback math. Trade coverage in 2026 also shows that not every clean-truck alternative points to battery-electric adoption: propane, renewable fuels, and hybrid architectures all remain substitutes for operators not ready to commit fully to BEV deployment. Harbinger’s hybrid offering is therefore not a distraction from the market;
    it is a response to it.'
