tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend or units
  - Excluded spend or units
  - Buyer / payer
  - Why it matters for Harbinger
  rows:
  - - Private last-mile and parcel fleets
    - Class 4-6 vehicles, body-upfitted delivery and service fleets
    - Consumer pickups and long-haul Class 8 tractors
    - Fleet ops, procurement, finance
    - Best fit for predictable routes and depot charging.
  - - Vocational / field-service fleets
    - Box trucks, stake beds, flatbeds, work trucks with power needs
    - Off-road heavy equipment and non-road machinery
    - Operations leaders, fleet managers, municipalities
    - Matches HC Series Cab and exportable-power use cases.
  - - Public agencies and utilities
    - Municipal, county, school-district, and utility procurement
    - Agencies without procurement authority or charging path
    - Public procurement and fleet departments
    - Sourcewell and incentives can shorten adoption path.
  - - Specialty upfitters and RV makers
    - Body builders and OEM partners using Harbinger chassis
    - Passenger-car OEM demand
    - Manufacturers and channel partners
    - Harbinger sells a platform, not only a finished vehicle.
  - - Healthcare / emergency and specialty fleets
    - Mobile healthcare and similar specialty applications
    - Acute class 8 emergency platforms outside medium-duty use
    - Specialty operators and upfitters
    - Frazer partnership shows this vertical is commercially relevant.
  - - Defense-adjacent and robotic vehicles
    - Hybrid or drive-by-wire derivative programs
    - Traditional military heavy combat vehicles
    - Program offices and prime contractors
    - Rheinmetall tie-up widens optionality but is adjacent, not core today.
  notes: The table defines Harbinger’s served market boundary rather than the entire truck industry.
