  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: neutral dollar TAM for Harbinger wedge
    missingEvidence: A neutral, current market-sizing study that isolates Harbinger’s exact Class 4-6 served wedge instead of broader electric-truck categories.
    whyItMatters: Most public TAM figures are either route-fit proxies or self-interested market estimates, which makes valuation work sensitive to market-definition choices.
    diligencePath: Commission or obtain a paid medium-duty market model segmented by class, body type, duty cycle, and public versus private procurement channels.
    relatedQuestionRefs:
    - QM021
  - type: missing-source
    severity: minor
    topic: fleet conversion by segment
    missingEvidence: Segment-specific conversion rates from pilot to scaled electric deployment in parcel, vocational, municipal, and specialty fleets.
    whyItMatters: The market is clearly feasible, but public route-fit data does not directly reveal how quickly each segment converts from interest to recurring orders.
    diligencePath: Collect operator case studies, fleet procurement records, and repeat-order data by end market.
    relatedQuestionRefs:
    - QM025
