- id: market-implication-for-harbinger
  title: Market implication for Harbinger
  body: The underwriting takeaway is that Harbinger is aimed at one of the more practical early-adoption zones in trucking, not the hardest one. Medium-duty fleets with predictable routes, depot dwell time, incentive access, and upfitter needs are where battery-electric and hybrid offerings can most plausibly clear both performance and cost hurdles. That is why public route-fit data, depot-charging work, and medium-duty registration growth matter more than generic EV-TAM headlines. At the same time, investors should resist the temptation to call the market solved. Commercial ZEV adoption remains funding-sensitive, infrastructure-sensitive, and operationally contingent. Harbinger’s served market can be large enough to support a meaningful business, but the company still has to win procurement cycles, support body builders and fleets, and prove that economics hold once pilots turn into scaled deployments.
