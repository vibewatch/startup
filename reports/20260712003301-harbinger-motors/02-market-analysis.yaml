- id: sizing-lenses-and-adoption-feasibility
  title: Sizing lenses and adoption feasibility
  body: 'The cleanest public sizing lens is route feasibility rather than a single TAM dollar number. Automotive Fleet’s summary of Stephen Latin-Kasper’s 2025–2030 work says roughly 75% of all U.S. trucks and 67% of commercial-use trucks travel fewer than 100 miles per round trip, with a total electric potential of 14.4 million commercial trucks as of Q1 2025. That does not mean Harbinger can serve all of those vehicles, but it does show that a very large installed fleet already matches battery-electric operating envelopes better than many skeptics assume. A second lens is registration momentum: ICCT says the U.S. zero-emission bus and truck market shrank overall in 2025, yet medium-duty truck registrations still jumped sharply. A third lens is vendor and trade commentary that places the medium-duty commercial-BEV opportunity in the tens of billions of dollars, even if those estimates are less reliable than the route-fit and registration lenses.'
