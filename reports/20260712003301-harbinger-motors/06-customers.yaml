callouts:
- calloutType: strength
  title: Harbinger already has a credible customer-access network, not just a prototype audience
  body: Named strategic fleets, nationwide dealers, Sourcewell procurement, and specialty partners give Harbinger multiple routes into customers. That is a stronger GTM posture than a single-program pilot story.
  claimRefs:
  - CU001
  - CU003
  - CU009
  - CU010
  - CU011
  - CU017
- calloutType: risk
  title: Most public customer proof is still demand proof, not mature cohort proof
  body: Harbinger discloses named orders, partner relationships, and coverage, but not delivered units by account, repeat orders, cancellations, or revenue concentration. That makes the customer story credible but not fully underwritten.
  claimRefs:
  - CU002
  - CU004
  - CU033
  - CU034
  - CU035
  - CU036
  - CU040
- calloutType: insight
  title: The hybrid strategy is also a customer-segmentation strategy
  body: By offering a hybrid bridge and exportable-power capabilities, Harbinger is expanding beyond pure depot-delivery fleets into RV, healthcare, and other use cases where route or power constraints would otherwise block adoption.
