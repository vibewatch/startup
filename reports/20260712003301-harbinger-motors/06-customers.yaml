- id: concentration-risks-and-customer-gaps
  title: Concentration risks and customer gaps
  body: Customer quality is where Harbinger’s public file still thins out. There are enough names to support credibility, but not enough delivery or cohort data to support precise underwriting. Public sources do not disclose repeat-order rates, cancellation rates, customer concentration by revenue, delivered-units by account, or the split between dealer stocking and end-customer orders. FedEx is an especially valuable logo, but it also introduces concentration risk if the market begins to over-interpret one strategic customer as universal product-market fit. The prudent view is that Harbinger has demonstrated customer access and demand breadth, but not yet customer-base maturity in the public record.
  claimRefs:
  - CU033
  - CU034
  - CU035
  - CU036
  - CU037
  - CU038
  - CU039
  - CU040
