        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Harbinger
              的公开收入故事从硬件开始，而不是软件。公司向配送、专用、公共部门、RV、医疗和特种应用销售电动及混合动力中型底盘，并越来越多把产品包装成平台，而不是一款一次性卡车。公开来源中可见几条变现路径：底盘销售、面向更长工况车队的混合动力变体、经销商销售、合作采购进入公共部门，以及借
              THOR 或 Frazer 等伙伴获取特种项目收入。两个较新的相邻业务拓宽了模型。Harbinger Industria 把电池能力转成独立离网电源系统；Phantom AI 收购加 ZF
              授权协议，则打开软件和授权收入流。这些路径目前都没有公开收入披露支撑，但公开商业模式已经远比简单卖车更丰富。
