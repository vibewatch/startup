            title: 最大估值风险：把战略可信度误当成运营证明
            body: 融资、客户和产品连贯性都重要；但收入、利润率和服务质量可见之前，强叙事仍可能跑在支撑更高估值所需的运营证明前面。
            calloutType: risk
            claimRefs:
              - CV025
              - CV028
