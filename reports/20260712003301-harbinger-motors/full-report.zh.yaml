      - number: '7.3'
        title: 资本强度与行业困境风险
        blocks:
          - type: paragraph
            body: >-
              商用 EV 初创公司比的不只是产品，更是能不能活下来。这个赛道近年的历史里，有并购、债权人保护、减产，也有投资人怀疑。Harbinger
              的融资底盘比许多同行更稳，但它仍处在一个电动化车队规模化成本极高、上市同行持续承压的市场。外部困境会压低客户信心、收紧供应商账期，也会把后续融资门槛抬高，即便公司位置更好也躲不开。Harbinger
              还是私人公司，不必每天承受公开市场压力，但引发其他公司出问题的底层经济性仍然适用。换句话说，Harbinger 不只要证明车能跑，还要证明资产负债表和服务模式能在怀疑情绪浓的市场里活下来。
            claimRefs:
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
              - CR022
              - CR023
              - CR024
