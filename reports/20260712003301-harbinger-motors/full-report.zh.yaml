  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 已披露私人估值信号
        blocks:
          - type: paragraph
            body: >-
              Harbinger 的公开私营公司估值信号有用，但彼此不一致。Forge 报告的投后估值约 $1.08B，总融资约 $339.9M；Harbinger 自身 Series C 材料支持的累计融资为
              $358M。Premier Alternatives 的另一份二级市场资料给出明显更高的 $2.4B 隐含估值，以及 $354M
              总融资。私人公司数据集出现这种冲突并不罕见，但这意味着公开估值讨论从区间开始，而不是从事实开始。最站得住脚的结论是：按至少部分二级市场来源，Harbinger 在 2025 年末或 2026
              年初跨过独角兽门槛；但具体标记不够稳定，不能当作经审计事实。因此估值工作应远离点估计，转向带明确信源质量折扣的置信区间。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
