        blocks:
          - type: paragraph
            body: >-
              Harbinger 的客户基础不限于包裹或烘焙车队。THOR 和 Airstream 证明公司在特种和休闲应用中有进展；Frazer 把平台延伸到移动医疗；Harbinger Industria 则借
              Airstream 建立了离网电源客户案例。这些关系重要，因为它们说明，Harbinger
              可以卖进底盘只是更高价值成品一部分的应用，而不是整个终端解决方案本身。特种客户也给公司一条路径，在核心配送车队基础完全成熟前先证明平台灵活性。权衡在于，宽伙伴集合会让客户集中度分析更复杂：同一个平台可能服务许多终端市场叙事，但公开记录仍不确定哪些转化最快，哪些仍是战略实验。
