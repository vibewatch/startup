      - number: '5.3'
        title: 混合动力与 HC Series 扩张
        blocks:
          - type: paragraph
            body: >-
              Harbinger 推出混合动力和 HC Series，战略意义在于承认一个现实：不是每条中型路线今天都适合纯电。混合动力平台保留 Harbinger 的电动基础，但增加一台汽油发电机，提供约 500
              英里续航和多种运行模式。HC Series Cab
              则把这套架构重新包装成低入口前置驾驶室作业卡车，面向专用车队提供取力器和可外供电功能。第三方行业报道与官方信息一致：这些产品瞄准机动性、出勤率和工地能力，而不只是零排放品牌。这显著拓宽了可触达市场，也显示出产品纪律。Harbinger
              没有放弃电动化约束，而是在创造一种过渡架构：它适配更长或更不确定的工况，同时保留平台通用性。
