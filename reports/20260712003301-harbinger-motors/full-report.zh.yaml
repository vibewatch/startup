      - number: '2.5'
        title: 对 Harbinger 的市场含义
        blocks:
          - type: paragraph
            body: >-
              承销结论是，Harbinger
              瞄准的是卡车领域更现实的早期采用区之一，而不是最艰难的区。路线可预测、有场站停留时间、能拿到激励、需要改装的中型车队，最有可能让纯电和混合动力产品同时跨过性能和成本门槛。因此，公开路线适配数据、场站充电工作和中型注册量增长，比泛泛的
              EV TAM 标题更重要。与此同时，投资人不应急于宣布市场已经解决。商用 ZEV 采用仍受资金、基础设施和运营条件制约。Harbinger
              的服务市场可能足够大，足以支撑一门有意义的生意；但公司仍要赢下采购周期，支持车身制造商和车队，并证明试点转为规模化部署后经济性仍能成立。
