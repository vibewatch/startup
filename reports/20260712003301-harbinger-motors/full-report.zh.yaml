              中型车队竞争受服务和采购摩擦塑造，不亚于受动力总成参数塑造。切换成本体现在充电建设、车身集成、服务备件库存、司机培训、公共招标合规和残值风险中。Harbinger 的经销商网络、Sourcewell
              可采购性，以及跨多种车身类型的产品通用性，都是为了降低这些摩擦。但竞争对手也有杠杆：Blue Bird 有根深蒂固的校车关系，BYD 有规模，Xos 强调集成充电和能源系统，Workhorse/Motiv
