          - type: callout
            title: 混合动力策略也是风险管理策略
            body: 混合动力不只是扩大 TAM；它降低对理想充电条件的依赖，也让 Harbinger 能卖给尚未愿意纯 BEV 运营的客户。
            calloutType: insight
            claimRefs:
