      - number: '7.5'
        title: 执行、保修与聚焦风险
        blocks:
          - type: paragraph
            body: >-
              最后，Harbinger 还面对一组内部执行风险。垂直整合能改善成本和设计控制，但也把运营复杂度集中到公司内部。长期保修承诺、多条产品线、专用项目、ADAS
              集成和机器人相邻业务，都会加重工程、服务和质量体系负担。若保修索赔、现场维修或软件验证掉链子，Harbinger
              的差异化故事可能变成一叠负债。同样，如果公司在车队、RV、电力系统和机器人之间扩张过猛，聚焦风险会侵蚀当下让平台有吸引力的清晰简洁。公开数据支持对工程意图保持乐观，但也要求对规模化执行保持谨慎。近期尽调要问的不是路线图有多有意思，而是组织能否让质量、服务和优先级跑在野心前面。
            claimRefs:
              - CR033
              - CR034
              - CR035
              - CR036
              - CR037
              - CR038
              - CR039
              - CR040
      - number: '7.6'
        title: 图表要点
        blocks:
          - type: callout
            title: Harbinger 最大的外部风险：基础设施和客户节奏慢于产品就绪
            body: 公司可以围绕部分充电摩擦做设计，但无法单独解决公用事业接入延迟、充电桩可靠性或政策驱动的基础设施不确定性。
            calloutType: risk
            claimRefs:
