      - number: '8.2'
        title: 公开可比公司背景
        blocks:
          - type: paragraph
            body: >-
              公开可比公司说明了为什么 Harbinger 估值对执行假设如此敏感。Blue Bird 市值数十亿美元，盈利、自由现金流为正，过去 12 个月收入接近 $1.5B。相比之下，Xos 和 Workhorse
              股权价值很小，盈利能力薄弱，资产负债表指标承压。Lion 的困境凸显，一旦融资或执行断裂，商用 EV 故事会被市场大幅重估。这些同行不能给 Harbinger
              一个干净的单一倍数；它们给出的是一条估值走廊：一端是盈利的老牌公司，另一端是高度承压或规模不足的 EV 专业厂商。Harbinger
              最可能落在走廊哪里，主要取决于它能否成为规模化运营者，还是停在一个有前景但变现不足的平台。区间太宽，可比对象怎么选，几乎和数字本身一样重要。
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
              - CV015
              - CV016
