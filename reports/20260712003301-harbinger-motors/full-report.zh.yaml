      - number: '5.2'
        title: 电池、充电与电源系统
        blocks:
          - type: paragraph
            body: >-
              Harbinger 技术护城河的第二层是能源架构。公司材料强调 800-volt 电气架构、模块化电池包尺寸、Level 2
              充电兼容，以及面向场站的充电逻辑。这些选择瞄准的是每晚回场车队的更低基础设施摩擦。Panasonic 被指定为官方电芯供应商，增加了电池栈可信度；产品线材料和充电页面也显示，Harbinger
              围绕路线适配设计电池和充电策略，而不是围绕峰值参数营销。Harbinger Industria 把电池能力转成离网电源系统，将这套逻辑延伸到车辆之外。这项技术在商业上合理：在路线可预测性强的地方部署能量密度高的
              EV 系统，再把相邻电力 know-how 转成互补工业产品。主要缺失的验证点是电池衰减、充电 uptime，以及规模化后的真实热管理表现。
