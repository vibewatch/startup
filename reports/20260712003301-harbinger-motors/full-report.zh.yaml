      - number: '6.2'
        title: 渠道、经销商与公共采购
        blocks:
          - type: paragraph
            body: >-
              Harbinger 的客户路径明显是有意设计的多渠道。公开材料称，到 2024 年中，经销商伙伴覆盖美国和加拿大 78% 人口；后续发布又加入加拿大销售，以及 ETHERO
              这一具名经销商伙伴。Sourcewell 为政府和非营利买方增加了采购捷径；这很重要，因为中型市场不能只靠直接企业销售赢下。Harbinger
              看起来在搭建混合分销模型：直接战略车队客户、独立经销商、合作采购和特种改装伙伴。这个结构应比纯直销模型更快拓宽市场入口，但也让外部更难观察转化质量，因为渠道库存、终端客户 sell-through
              和区域组合都未公开披露。
