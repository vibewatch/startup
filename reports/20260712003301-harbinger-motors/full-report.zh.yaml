      - number: '5.4'
        title: 软件、ADAS 与机器人相邻业务
        blocks:
          - type: paragraph
            body: >-
              最新的技术层是软件和自动驾驶相邻业务。收购 Phantom AI 加上与 ZF 的授权协议，让 Harbinger 有路径把高级驾驶辅助功能嵌入商用车，同时也把技术授权到乘用车应用。公开口径中，Harbinger
              把这定位为安全和功能差异化，而不是完全自动驾驶。American Rheinmetall 合作再次拓宽平台，把 Harbinger
              的电动化和线控驾驶能力适配到机器人和无人地面车辆。这在技术上有意思，因为它验证了线控转向、控制系统和电力架构在标准车队卡车之外的灵活性。不过，这些相邻业务阶段更早、验证程度低于底盘业务。公开材料尚未披露有意义的
              ADAS 部署指标、软件附加率或国防项目收入。正确解读是选择权价值，而不是已经验证的护城河。
