              - CV039
          - type: callout
            title: Harbinger 有足够资本和客户证明，支撑其相对失败 EV 同行的溢价
            body: 不同于最弱的上市同行，Harbinger 融资更强，也少见明显偿付能力警报。因此，即便精确公允价值仍不确定，独角兽级标记也说得通。
            calloutType: strength
