      - number: '2.4'
        title: 增长驱动、约束与替代品
        blocks:
          - type: paragraph
            body: >-
              最强的市场驱动来自监管压力、路线适配、TCO 压力，以及密集城市或频繁启停作业中对更安静、维护更低车辆的商业需求。EPA Phase 3 重型温室气体规则从 2027
              款车型开始抬高长期合规压力；Harbinger
              自己的融资和充电页面则强调，车队可以把路线适配分析、激励和夜间充电组合起来，算出有吸引力的经济性。但约束同样真实。公共充电扩张没有车辆销售快，场站建设可能需要昂贵的电网升级，政策反转也会迅速改变车队回本账。2026
              年行业报道还显示，并非每一种清洁卡车替代方案都会指向纯电采用：丙烷、可再生燃料和混合动力架构，对尚未准备好全面部署 BEV 的运营方仍是替代选项。因此，Harbinger
              的混合动力产品不是偏离市场，而是在回应市场。
