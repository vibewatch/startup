          - type: callout
            title: 其他公司承压会抬高 Harbinger 的门槛，即便 Harbinger 资金更充足
            body: 商用 EV 的历史说明，产能爬坡、融资耐力和服务执行会压垮原本可信的车辆平台。Harbinger 不仅产品要赢，执行耐久性也要赢。
            calloutType: risk
