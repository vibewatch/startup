            title: Harbinger 更容易判断大致位置，而不是精确标价
            body: 公开证据支持把 Harbinger 放在困境中的商用 EV 微型股之上、已验证的上市赢家之下，但不足以有把握地给出干净精确估值。
            calloutType: insight
            claimRefs:
