        title: 平台架构与垂直整合
        blocks:
          - type: paragraph
            body: >-
              Harbinger 的核心技术主张不是单一卡车，而是一套可复用的全新商用平台。官方产品和技术材料持续描述一套内部栈，覆盖动力总成、电池系统、转向、制动和底盘；这不是把传统 ICE
              车架电动化改装。这个差别重要，因为中型市场会惩罚包装妥协、服务复杂度和车身改装不兼容。Harbinger
              的平台已经延展到电动底盘、插电式混合动力底盘、步进式货车和低入口前置驾驶室变体，说明公司从一开始就围绕模块化复用设计。下载中心和产品线 PDF
              呈现的是一个连贯家族，而不是互不相关的产品，进一步强化了这个信息。公开证据还不能证明一线可靠性更强，但确实显示，公司搭建了一套为商用工况设计、而非从乘用车迁移过来的深度整合架构。
