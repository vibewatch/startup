              辆 Class 5 和 Class 6 车辆。这些信号重要，因为它们说明 Harbinger
              既能吸引广泛管线需求，也至少能拿下一家蓝筹战略运营商。但它们也有限：预订订单不等于已交付收入，公开披露仍看不出多少具名需求已经转化为经常性车队关系。
