  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 充电、电网与基础设施风险
        blocks:
          - type: paragraph
            body: >-
              尽管 Harbinger 明智地围绕场站车队和 Level 2 兼容性设计，充电仍是最显眼的系统性风险。行业来源继续显示，美国联邦充电路径不确定、基础设施投资缺口大、充电桩可靠性不均衡。这些风险重要，因为
              Harbinger 的客户论点仍依赖车队能安装、出资、维护并运行可靠的充电流程。Harbinger 的混合动力产品能部分削弱这一风险，但不能把核心 BEV
              论点中的风险拿掉。结果是，即便车辆平台本身有竞争力，采用也可能放慢，只因为场地供电、公用事业时间表或充电 uptime 落后于客户兴趣。实际风险在于，客户项目可能因为看似外部于 Harbinger
              的原因停滞，却仍会损害订单、准备度认知，以及车队对这个品类的信心。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
