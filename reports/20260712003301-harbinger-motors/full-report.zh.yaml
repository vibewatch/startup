              年不确定性之后经历重置，充电、激励和部署节奏仍不均衡。公开财务能见度也不完整。Forge 发布 $1.08 billion 投后估值，累计融资统计又低于 Harbinger
              自己的新闻稿，说明可能存在数据库滞后，或外部人士无法完全对齐的轮次结构复杂性。公开材料同样没有披露当前董事会构成、收入或所有权权利。这些缺口不会抹掉迄今进展，但意味着后续财务和估值工作应把 Harbinger
              视作战略上有前景、而非已经完全透明的公司。
