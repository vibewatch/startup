              Harbinger 还是一家未上市硬件公司，却已经拿到可观战略资本。公开稿件支撑 2023 年 $60 million Series A、2025 年 1 月 $100 million Series B，以及
              2025 年 11 月 $160 million Series C，官方累计融资达到 $358 million。投资人名单几乎和金额一样重要：早期有 THOR 和 Ridgeline，下一阶段有
              Capricorn 和 Leitmotif，最近一轮又加入 FedEx，并与 THOR、Capricorn 同场。需求验证也来得相对早。到 2024 年 5 月，Harbinger 称其拥有 4,000
              份有约束力预订，价值约 $400 million，披露了 Bimbo Bakeries USA 等客户，并称经销商伙伴已覆盖美国和加拿大大多数人口。随后 FedEx 又追加 53
              辆车订单。仅看公开证据，Harbinger 已经从概念热情跨进战略生态背书，至少截至今天、从外部看是如此。
