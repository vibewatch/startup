        title: 竞争格局与直接可比公司
        blocks:
          - type: paragraph
            body: >-
              Harbinger 的竞争集并不是一张电动卡车初创公司名单就能概括。最贴近的直接同行，是 Xos、Lion、合并后的 Workhorse/Motiv 等中型电动或电动化平台供应商。相邻竞争来自 Blue
              Bird、BYD 等更大的商用 EV 或巴士制造商，也来自 Roush CleanTech 这类替代燃料供应商，它们给车队提供的转型路径比全面采用纯电更低扰动。其他替代品还包括传统卡车 OEM
              的内燃机底盘，以及混合动力或可再生燃料方案。重要观察是，Harbinger
              的确切组合——全新中型裸底盘、混合动力选项、公共采购路径和特种车辆灵活性——并不会被每个竞争对手直接复制；这降低了一对一的精确竞争，尽管预算竞争仍然激烈。
