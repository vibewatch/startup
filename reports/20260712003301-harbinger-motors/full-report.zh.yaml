              从财务角度看，Harbinger
              的公开案例有前景，但不完整。公司有真实的漏斗顶部需求信号、战略投资人和多条可见变现杠杆，也有一套植根于平台设计、充电适配和混合动力选择权的降本叙事。但公开投资人和尽调团队仍缺少把硬件故事变成可承销财务模型的基本项：实际收入、积压订单转化、毛利率、单车贡献、资本开支节奏、现金余额、月度烧钱，以及下一次融资需求的时间。审慎结论不是
