  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与 Harbinger 的服务切口
        blocks:
          - type: paragraph
            body: >-
              Harbinger 并不打算把所有卡车都电动化。它的实际市场是中型 Class 4-6
              商用和特种车辆：回场停放、路线相对可预测，或比超长续航干线性能更需要车身制造灵活性。这一边界排除了大多数消费者皮卡需求，也排除了最难的 Class 8
              高速公路场景；在那里，充电、载荷和工况复杂度仍高得多。公司自己的材料聚焦裸底盘、驾驶室底盘、步进式货车、低入口前置驾驶室作业卡车和公共车队采购渠道，合起来意味着它的服务切口横跨包裹配送、公用事业、专用服务车队、市政机构、特种车辆制造商、RV
              和医疗响应改装。关键在于，Harbinger 的市场窄于“所有 EV 卡车”，但宽于单一包裹配送细分。
