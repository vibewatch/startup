      - number: '2.3'
        title: 买方、预算拍板方与采购路径
        blocks:
          - type: paragraph
            body: >-
              Harbinger
              所在市场的买方栈，比“车队运营商买车”复杂得多。在私营车队里，使用者通常是配送或服务运营团队，经济拍板方是采购或车队财务，集成路径还要穿过路线分析、充电设计、车身改装和服务支持。公共机构又叠加一层采购流程，因为城市、县、公用事业或学区买方往往依赖合作采购、激励和合规友好的合同载体。RV
              或移动医疗等特种和车身制造市场再加一层：直接买方可能是制造商或改装厂，而不是最终运营方。这种复杂度有利于能打包融资支持、充电指导、激励申报帮助，以及经销商或服务入口的供应商，而不只是卖一个车辆平台。
