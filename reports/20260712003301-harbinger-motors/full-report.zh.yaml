      - number: '8.5'
        title: 估值结论
        blocks:
          - type: paragraph
            body: >-
              只看公开证据，最站得住脚的估值结论是「可信的独角兽，但无法精确定价承销」。2025 年末约 $1.08B 的标记，作为私人战略增长估值在方向上合理。二级市场清淡时，明显更高的 $2.4B
              隐含标记也可能出现，但它要求外部人士假设 Harbinger 已经拿出比公开材料更多的运营证明。实际投资结论是，Harbinger
              的价值应通过里程碑承销——交付、转化、利润率路径和服务质量——而不是通过静态头条估值。里程碑出现之前，正确的公开立场是：Harbinger 可以比困境 EV
              同行更值钱，但仍然太不透明，难以精确定价。估值并非不可能；里程碑纪律不可选。
            claimRefs:
              - CV033
              - CV034
              - CV035
              - CV036
              - CV037
              - CV038
              - CV039
              - CV040
