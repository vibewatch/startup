      - number: '5.5'
        title: 技术结论与未解问题
        blocks:
          - type: paragraph
            body: >-
              从技术上看，Harbinger
              更像平台公司，而不是车身制造商；这是公开记录里最强的正面因素。公司拥有连贯的组件栈、路线适配的充电逻辑、务实的混合动力桥梁，以及特种车辆和机器人等可信相邻项目。它也似乎围绕中型现实做设计：改装兼容、出勤率、可维护性和可外供电。开放问题大多是上市后的问题：持续车队使用中的耐久性，真实电池和质保表现，软件安全验证，以及同一平台能否在不稀释聚焦的情况下拉伸到过多相邻市场。公开证据支撑强工程论，但还不支撑完全去风险的技术论。
            claimRefs:
              - CE033
              - CE034
              - CE035
              - CE036
              - CE037
              - CE038
              - CE039
              - CE040
