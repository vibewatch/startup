              相较许多私营 EV 同行，Harbinger 看起来资本充足，但显然仍是资本密集型公司。公开融资公告支撑截至 2025 年底累计融资 $358 million，其中 Series B
              明确用于更高产量生产，以及扩大销售、零部件和服务运营。Series C 加入
              FedEx，并重申需要扩大美国制造车辆产能、满足更大车队需求。同一公开记录也显示沉重的工业投入：总部和制造扩张、电池包生产、质保义务、软件集成和多条产品线。但关键融资输入仍是私有信息。没有公开来源披露当前现金、月度烧钱、毛利率、营运资本需求或资金跑道。因此，最可辩护的财务判断是：Harbinger
              的公开资本足以支撑可信度，但公开披露不足以得出公司已完全摆脱未来融资依赖风险的结论。
