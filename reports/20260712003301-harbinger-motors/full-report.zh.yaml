      - number: '2.2'
        title: 规模测算视角与采用可行性
        blocks:
          - type: paragraph
            body: >-
              最干净的公开规模视角不是单一 TAM 金额，而是路线可行性。Automotive Fleet 对 Stephen Latin-Kasper 2025–2030 年研究的摘要称，约 75% 的美国全部卡车、67%
              的商用卡车单次往返少于 100 英里；截至 2025 年 Q1，总电动化潜力为 14.4 million 辆商用卡车。这并不意味着 Harbinger
              能服务所有这些车辆，但说明一个非常庞大的存量车队已经比许多怀疑者想象的更贴合纯电运行边界。第二个视角是注册势头：ICCT 称美国零排放巴士和卡车市场在 2025
              年整体收缩，但中型卡车注册量仍大幅跃升。第三个视角来自供应商和行业评论，它们把中型商用 BEV 机会放在数百亿美元量级；即便这些估算不如路线适配和注册视角可靠。
