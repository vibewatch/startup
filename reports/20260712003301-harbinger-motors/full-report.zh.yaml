        title: 身份定位、运营足迹和商业模式
        blocks:
          - type: paragraph
            body: >-
              Harbinger Motors 更像一家美国制造的中型商用车厂商，而不是乘用 EV 技术外溢的移植者。公司现有材料强调 Class 4-6 车队应用、垂直整合架构，以及裸底盘、驾驶室底盘、步进式货车和 HC
              Series Cab 等产品形态。经济切口同样清楚：Harbinger 希望车队为运营和采购经济性购买电动化，而不是为高端品牌溢价买单。现有页面和早期发布材料一直把公司与加州 Garden Grove
              绑定；总部、研发、组装和电池包工作都公开落在那里。因此，更适合把 Harbinger 理解成一家服务商用车队、改装厂和特种车辆制造商的工业平台公司。
