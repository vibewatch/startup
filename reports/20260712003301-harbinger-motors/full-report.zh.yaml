            body: >-
              公开客户证据也说明 Harbinger 最适合哪里。最强适配似乎是回场配送、专用、公共部门、RV、医疗和其他特种用途；这些场景重视路线可预测性、改装灵活性和可外供电。FedEx 和 Bimbo
              贴合商用配送论点，Sourcewell 则拓宽了触达市政和非营利车队的入口。THOR、Airstream 和 Frazer 显示，Harbinger
              的产品可以接入那些既关心电池备份电源系统、续航灵活性或安静运行，也关心零尾气排放的客户。混合动力发布尤其说明问题：Harbinger 明确在为路线或电力需求尚不完全适配纯 BEV 的客户设计。这可能是好的 GTM
