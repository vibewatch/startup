        - 电动 Class 6 卡车和校车制造商
        - Lion6 参数，以及在中型 EV 领域的早期存在感
        - 按产品类型看，是车型级别最接近的直接 EV 对手
        - 债权人保护和重组显著削弱威胁等级。
