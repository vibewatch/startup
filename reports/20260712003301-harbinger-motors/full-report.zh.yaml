            body: >-
              公开成本故事更多来自设计选择，而不是已披露利润率。Harbinger 反复强调，垂直整合、全新底盘设计、更少供应商层级和适合场站的充电，可以降低采购成本和运营费用。技术和充电页面通过强调 Level 2
              充电兼容、模块化电池增量、450,000 英里使用寿命目标和更简单的可维护性，进一步强化这套逻辑。Panasonic
              电池采购应有助于供应保障和性能一致性；长期质保承诺意在降低客户焦虑，但如果一线表现不达预期，也意味着未来质保负债。公司的 TCO
              计算器和博客内容给出最强的财务论点：车队应关心燃料、维护和回本时间。缺口在于，公司没有把这些主张量化桥接到公开毛利率、质保准备金或单车贡献披露。
