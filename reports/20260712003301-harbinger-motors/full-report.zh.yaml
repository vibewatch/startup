            body: >-
              第二个风险是，中型 EV 采用可能比产品支持者预期更颠簸、更缓慢。多项行业和政策来源指向持续障碍：前期成本、充电可用性、可靠性信心和路线复杂度。Harbinger
              自己的订单簿和客户公告证明存在需求兴趣，但公开数据仍没有显示已交付队列质量、取消或留存。这个缺口意味着，Harbinger
              在车队电动化方向上可能判断正确，却仍需要比预期更久才能把意向转成耐久收入。在硬件市场里，时点风险往往才是真正风险，Harbinger 暴露在这个时间问题中。CFO
              和车队运营商常常分阶段采购，而不是一次性切换整类车辆；在这个品类里，这一点尤其重要。
