      - number: '8.3'
        title: 基于情景的估值锚点
        blocks:
          - type: paragraph
            body: >-
              鉴于披露缺口，用情景框架比套公式的可比公司组更诚实。下行情景下，Harbinger 会收敛到市场对资本单薄的 EV
              平台公司的定价：战略价值低、依赖融资，即便技术不错，股权价值也有限。基准情景下，Harbinger 维持相对这些困境同行的溢价，因为它融资更好、客户更强、产品栈更连贯。上行情景下，Harbinger
              开始配得上中上区间的工业技术估值，因为它证明了交付、毛利率方向和服务执行——即便还不需要达到 Blue Bird
              的盈利水平。因此公开案例能支持十亿美元以上估值「合理」，但不能证明它已经完全成立。投资人应按里程碑触发的重定价思考，而不是假设最新标记可以长期维持。
