companyProfile:
  summary: >-
    Harbinger Motors 是一家南加州电动商用车公司，成立于 2021 年，现在总部位于 Garden
    Grove。公司开发垂直整合的中型平台，覆盖电动底盘、插电式混合动力底盘、低入口前置驾驶室作业卡车、特种车辆项目和辅助电源系统。公开证据显示，其披露累计融资约 $358 million；具名客户和合作伙伴包括 FedEx、Bimbo
    Bakeries USA、THOR、Airstream、Frazer；产品策略围绕适配路线的电动化展开，而不是押注单一车身形态。尽调最大的限制不在市场契合度，而在披露质量：Harbinger
    仍未公布收入、毛利率、烧钱速度、积压订单转化或服务队列表现，因此财务和估值承销都高度依赖情景假设。
