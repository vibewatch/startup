              Harbinger 不披露 CAC、回本期、销售周期或漏斗转化等经典创业公司 GTM 指标。公开证据只能提供代理信号。2024 年 5 月的订单簿发布称，公司拥有 4,000 份有约束力预订，价值约 $400
              million，经销商伙伴覆盖美国和加拿大 78% 人口。Sourcewell 增加了公共采购路径，加拿大销售拓宽地理范围，ETHERO 和其他经销商关系则显示，其商业模式更偏渠道驱动，而不是纯直销。FedEx
              订单更重要，因为它把战略资本和需求绑定在一起。这些信号不能替代硬性的销售效率披露，但确实说明 Harbinger
              试图靠直接战略客户、经销商渠道、合作采购和特种项目伙伴的组合扩张，而不是押注一条狭窄的市场进入路径。
