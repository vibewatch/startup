      - number: '8.4'
        title: Harbinger 为什么应有溢价，为什么又不应有
        blocks:
          - type: paragraph
            body: >-
              Harbinger 确实有理由相对困境中的 EV
              微型股享有估值溢价：私人资本底盘更大、战略客户信号更强、产品论点更清晰，公开记录里也少见明显治理或偿付能力警报。但公司也应相对已经完全验证的运营商打折，因为几乎所有关键运营输入都缺失：收入、毛利率、积压订单转化、现金消耗和现场可靠性结果。换句话说，Harbinger
              也许该高于失败 EV 期权，但还不该按已经证明规模化出货和盈利能力的上市公司同等定价。溢价和折扣都真实存在，这正是必须用情景框架的原因。估值论证放在相对位置上最有力，而不是放在今天精确公允价值上。
