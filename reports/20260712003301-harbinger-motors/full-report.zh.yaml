      - number: '7.4'
        title: 监管、政策与供应链风险
        blocks:
          - type: paragraph
            body: >-
              政策既是顺风，也是依赖风险。排放规则、补贴项目和采购路径都能帮 Harbinger
              借力，但政策节奏、资金回拨和执法变化都可能比预期更慢或更快。与此同时，电池和电动化部件仍暴露在全球供应链和贸易不确定性中。Harbinger 与 Panasonic
              的关系有帮助，国内制造叙事也能降一部分风险，但电芯、电力电子或跨境贸易政策的上游波动，不会被完全隔离。更准确的结论是，Harbinger
              受益于政策支持，同时也比现有柴油平台更依赖政策。它向预算敏感的车队销售低排放平台，因此必须同时管理监管上行空间和监管急转弯。
            claimRefs:
              - CR025
