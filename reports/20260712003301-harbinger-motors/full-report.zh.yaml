        - 商用车队电动化加移动储能
        - 上市公司，有投资者关系和收入披露
        - 运营上类似的 EV 车队平台和充电切入点
        - 市值小，经济性仍未成规模。
      - - Workhorse / Motiv
        - 合并后的北美中型电动卡车和巴士 OEM
        - 已有上路车辆，并有规模化制造目标
        - 产品线更宽，也能从存量车辆学习
        - 合并执行和历史信誉仍要经受检验。
      - - Blue Bird
        - 已有规模的上市电动巴士制造商
