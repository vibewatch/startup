              在当前直接 EV 同行中，Lion Electric、Xos 和 Workhorse/Motiv 最关键。Lion 的 Lion6 证明纸面上已有成熟的 Class 6
              电动竞争，但公司的债权人保护程序大幅削弱了商业威胁。Xos 把商用 EV 与移动储能、充电基础设施结合起来，运营上更像 Harbinger；不过它的公开市值仍小，收入基础也不大。Workhorse 与 Motiv
