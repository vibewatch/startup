  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 出口管制、制裁与最终用途合规
        blocks:
          - type: paragraph
            body: >-
              Tekever 同时落在三套出口管制制度的交叉点——UK ECJU、EU dual-use regulation 2021/821，以及潜在的 US EAR——并且在实际冲突中部署系统。AR3 和 AR5 是按
              UK Military List 分类的军用级 UAS；每一次出口到非 UK 目的地，都需要 Standard Individual Export Licence，或由 Open General Export
              Licence 覆盖。当前通过 Task Force Kindred 在 Ukraine 的部署，是最尖锐的合规触点：ECJU 施加强制最终用途监控义务，要求 Tekever
              核实所供系统没有被再转移给被禁止的最终用户。Taiwan APEX 合作引入了进一步辖区暴露——按当前 UK 管制，Taiwan 不被禁止，但地缘事件可能迅速改变这一状态。如果 US-origin
              受控组件在任何单一子系统中按价值超过 25%，US EAR de minimis 门槛可能适用。Brexit 后 UK 与 EU 管制分化，意味着 Tekever 必须为 UK 和 France
              业务维护并行合规计划，行政负担翻倍，也在两套部分分化的分类框架之间制造对账风险。没有发现公开执法行动证据，但公开信源无法评估 Tekever 合规计划的内部深度。
