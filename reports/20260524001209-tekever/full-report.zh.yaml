    title: 估值敏感性
    type: bar
    layout: standard
    summary: 在不同 P/S 倍数和年收入假设下推算企业价值，展示从悲观到乐观情景的区间，以及当前 £1B+ 标记对收入兑现的敏感性。
    data:
      items:
        - label: 悲观：£35M 收入 × 10× P/S
          value: 350
          unit: £M EV
        - label: 悲观：£50M 收入 × 12× P/S
          value: 600
          unit: £M EV
        - label: 基准：£80M 收入 × 12× P/S
          value: 960
          unit: £M EV
        - label: 基准：£110M 收入 × 15× P/S
          value: 1650
          unit: £M EV
        - label: 乐观：£180M 收入 × 15× P/S
          value: 2700
          unit: £M EV
        - label: 乐观：£220M 收入 × 20× P/S
          value: 4400
          unit: £M EV
        - label: 当前标记（约）
          value: 1000
          unit: £M EV
    approximationNotes: 收入估计来自已披露框架上限和可比项目运行率；P/S 倍数交叉参考上市和私营防务科技同业。当前标记近似取自新闻报道的 >£1B 轮估值。所有数值均为方向性估计。
    claimRefs:
      - CV013
      - CV024
      - CV025
      - CV026
      - CV041
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 截至 2026 年，Tekever 在乐观、基准和悲观情景下的企业价值区间，并给出各情景相对于当前 £1B+ 入场点的隐含回报倍数。
    data:
      items:
        - label: 悲观情景 EV（2026 证据）
          low: 300
          high: 600
          unit: £M
          note: OVERMATCH 延迟；仅法国扩建；收入 <£50M pa
        - label: 基准情景 EV（2027–28 视野）
          low: 960
          high: 1650
          unit: £M
          note: OVERMATCH 60% 利用率；EMSA 续约；法国适度爬坡
        - label: 乐观情景 EV（2027–28 视野）
          low: 2700
          high: 4400
          unit: £M
          note: OVERMATCH 全额执行；法国 €50M pa 收入；Project NYX 和美国市场进展
    approximationNotes: 区间是分析师估计，来自框架合同上限、可比 P/S 倍数和公开披露的项目承诺。Tekever 或任何投资人均未在公开文件中确认收入或 EV 数字。
    claimRefs:
      - CV024
      - CV025
      - CV026
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 截至 2026 年 5 月，面向 IC 的 Tekever 评分，覆盖市场、产品证据、护城河、经济性、风险、估值和证据质量维度。
    data:
      items:
        - label: 市场机会
          value: 8
          unit: /10
          note: 乌克兰之后，NATO 范围内主权 UAS 需求加速；TAM 大
        - label: 产品 / 证据
          value: 8
          unit: /10
          note: 10,000+ 战斗小时；EMSA 已运营；获 RAF 和 British Army 选择
        - label: 竞争护城河
          value: 7
          unit: /10
          note: 战斗履历难复制；ATLAS AI 平台；但硬件有可复制风险
        - label: 单位经济性
          value: 3
          unit: /10
          note: 无审计财务；“独特盈利”说法无法验证；爬坡资本密集
        - label: 风险画像
          value: 4
          unit: /10
          note: 客户集中度高；关键人依赖；股权结构表不透明；OVERMATCH 只是框架
        - label: 估值支撑
          value: 4
          unit: /10
          note: 乐观情景下 £1B+ 说得通；相对当前可验证收入基础偏高
        - label: 证据质量
          value: 3
          unit: /10
          note: 无审计账目；所有收入证据来自公司声称或框架公告
