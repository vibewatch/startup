      - number: '8.3'
        title: 融资背景、股权结构不确定性与估值机制
        blocks:
          - type: paragraph
            body: >-
              2025 年 5 月让 Tekever 跨入独角兽行列的融资之前，公司在 2024 年已完成 €70 million 成长股权融资，引入 NATO Innovation Fund、Ventura Capital
              等投资人。累计融资历史意味着公司已有多轮优先权堆叠和反稀释条款，但公开文件没有披露具体条款。到 2026 年本次报告运行日，UK Companies House 尚未显示 Tekever 主要实体（公司编号
              08684764）提交年度账目。该实体的备案历史确认公司于 2013 年成立，但没有披露损益表、资产负债表或董事报告，外部无法核验收入或 EBITDA。私营公司在这一阶段并非罕见，但也意味着 Ventura
              Capital 将 Tekever 称为「uniquely profitable」的投资人表述，无法从公开证据中得到佐证。


              OVERMATCH 计划被包装为首相层面作出的英国五年 £400 million
              承诺，但它是框架安排，不是绑定订单。实际提款曲线——围绕上限发出任务订单的顺序和规模——并未公开。在防务采购中，底层能力被运营采用后，框架合同生命周期内通常能达到 60–80 percent
              利用率；但框架也可能重新竞标、重组或延期，而不触发违约条款。把五年线性摊开得到每年 £80 million 的隐含收入，是最乐观口径；实际年收入更可能在第一、第二年从更低基数爬坡，等待制造和集成能力放量。


              法国 €100 million Tekever 投资承诺和 Cahors
              工业基地启动，支撑长期收入爬坡叙事，但代表的是资本投放（设施建设和本地供应链），不是即时签约收入。资本密集型计划执行带来的稀释，尤其是同时横跨两个主权市场，是仍未解决的尽调事项，也会影响当前入场价格下普通股回报预期。
