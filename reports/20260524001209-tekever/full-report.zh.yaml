      - number: '7.5'
        title: 监管、法律、安全与隐私风险
        blocks:
          - type: paragraph
            body: >-
              除出口管制外，Tekever 还面对一组独立的监管与法律风险，横跨 EASA 认证、自主系统问责和 GDPR 数据处理者义务。AR5 在 EU 成员国空域执行的每一次海上监视部署，都需要 SORA 框架下的
              EASA Specific-category Operational Authorisation，且每个辖区都要求单独安全论证。European Parliament 的 2025 研究简报反映，EU
              仍在进行立法讨论，可能在 Tekever OVERMATCH 交付时间线内，对 AI 赋能军用无人机系统 施加追溯性 human-in-the-loop 要求。UK Parliament
              防务委员会也在并行讨论。最尖锐的法律风险是平民伤害归因：已有文件显示 AR3 系统参与了摧毁 Russian 军事资产的行动。未来任何国际调查如果把平民伤害归因到 Tekever
              平台——尽管有记录的流程使这一可能性很低——都会触发出口许可监管暂停、EMSA 合同流失以及持续声誉传染。EMSA 作业中，监视影像在 EU 空域捕捉到个人数据时，GDPR 数据处理者义务适用。Tekever
              合规页面确认公司有合规计划，但其运营充分性无法从外部验证。关键是，本次研究覆盖的任何公开信源中，都没有发现执法行动。下方风险传导图展示了从战场事件到财务损害的因果链，包括每个阶段可用的制度断路器。
