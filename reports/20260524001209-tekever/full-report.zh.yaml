      - number: '6.5'
        title: 集中度风险、采购摩擦与客户缺口
        blocks:
          - type: paragraph
            body: >-
              Tekever 最实质的客户风险，是对 UK MOD 的极端集中。OVERMATCH 五年 £400 million 远超其他已披露客户合同合计价值（EMSA €30M、Spain MOI €5M、Nigeria
              隐含低个位数百万量级）。如果 UK 防务预算压力导致项目进度延迟、能力范围收缩，或 OVERMATCH 任一部分重新竞争，Tekever 的收入基础会受到实质损害。StormShroud
              的电子战任务分类让项目条款更不透明，也限制了对续约风险的独立评估。


              EU 采购摩擦是第二个结构性逆风。按 EU 采购指令，EMSA 框架合同结构要求每轮周期重新竞争招标，形成双边主权合同没有的系统性续约风险。EU 防务和民用安全采购常见 2–5 年 时间线，会拖慢向新 EU
              成员国客户扩张的速度，即使作业验证（EMSA 部署、Italy、Gulf of Genova）已经证明能力。


              关键客户数据缺口包括：没有按板块或客户披露收入；任何客户关系都没有披露 NRR 或 GRR；没有试点到生产转化率；没有按板块披露客户数；也没有关于赢单 / 输单率或客户相对替代方案偏好的独立竞争评估。这些缺口符合
              Tekever 所处阶段和私营公司身份的常态，但也对独立判断客户健康和收入韧性构成硬约束。
