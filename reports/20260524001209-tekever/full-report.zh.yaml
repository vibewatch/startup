            title: 真正顺风是欧洲主权 ISR，而不是泛无人机采用
            body: 最清晰的牛市逻辑不是「无人机在增长」，而是欧洲再武装和 C4ISR 支出快于整体防务预算，同时主权政策奖励本地生产和 ITAR-light 供应。Tekever 的公开证明点正好卡在这类支出模式上。
