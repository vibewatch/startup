            body: >-
              OVERMATCH 是 Tekever 投资人的定义性战略风险。£400M 五年计划与独角兽估值同时宣布，使两者在结构上无法切割：项目一旦大幅缩减，会直接损害投资逻辑。EMSA AR5
              框架协议是第二个已确认收入支柱，但披露价值明显更小。对一家处在该阶段的防务科技公司而言，客户集中在单一 UK 政府项目上，已处于风险谱系高端。历史 UK MoD 采购显示，长周期合同可以被重构：2010 和
              2015 支出审查都涉及重大无人机项目变动。OVERMATCH 有实质政治保护——它获得 Prime Minister
              层面背书，并被定位为本土产业政策成功案例——这会提高取消的政治成本，但不能消除取消风险。Tekever 的 QinetiQ strategic MOU 提供额外能力开发关系，但 MOU
