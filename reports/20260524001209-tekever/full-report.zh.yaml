    data:
      layers:
        - label: 情报层（ATLAS）
          detail: 浏览器端任务情报平台。任务前规划、带 AI 目标检测的实时画面监控、任务后证据提取和船舶交叉关联。
          items:
            - ATLAS Pre-Mission Planner（目标、标的、审批流程）
            - ATLAS Live Feed（视频、飞行路径、目标 ID、环境叠加层）
            - ATLAS Post-Mission Review（回放、证据导出、AIS 交叉引用）
            - AI 模块（目标检测、变化检测、分类、跟踪）
        - label: 自主与导航层
          detail: 机载和地面自主模块，使 AR3 EVO、AR5 和 ARX 平台能在 GNSS 拒止环境飞行、做边缘 AI 推理，并协同蜂群。
          items:
            - VBN（Visual-Based Navigation）— NVIDIA SoC 边缘 AI，独立于 GNSS 的 3D 定位
            - GNSS / GPS 主导航，GLONASS 备份
            - 自动起降（ATOL）— AR5
            - 蜂群协同逻辑 — ARX 平台（开发中）
        - label: 传感器与载荷层
          detail: 模块化即插即用载荷生态，覆盖监视、SAR、SIGINT、EW 和通信中继。AR3 EVO 支持热插拔；AR5 支持集成式同步运行。
          items:
            - GAMASAR（自研 SAR — 40 km 探测距离，全天候，Ka/Ku SATCOM 链路）
            - EO/IR 云台（Trillium HD80、HoodTech AC11/AC06、Tekever Gimbal、Octopus Epsilon）
            - SIGINT / RF（CRFS、ESROE、Revector、Lifeseeker 方案）
            - 通信 / SATCOM（Starlink、Iridium、Viasat、Link 16、Trellisware TSM、Silvus、Radionor）
            - EW（CRPA 天线、定向 EW、抗干扰模块）
            - 海事（AIS、EPIRB、VHF、LifeSaver、海事雷达）
        - label: 平台硬件层
          detail: Tekever 内部制造三款 UAS 机体，使用欧洲复合材料和电子器件。动力选项支持电动、内燃和重油配置。
          items:
            - AR3 EVO（25 kg MTOW，22h FW / 14h VTOL，4.2 m 翼展，弹射 / VTOL / 降落伞）
            - AR5（180 kg MTOW，20h 续航，7.3 m 翼展，双发，ATOL，不受 ITAR 约束）
            - ARX（蜂群部署平台 — 完整规格未披露）
    approximationNotes: 层级顺序反映逻辑拆分，不代表物理部署。ATLAS 是云 / 边缘混合；具体云服务商未公开确认。Head of Data & AI 博文（2024）将 VBN 芯片组识别为 NVIDIA SoC；具体 SoC 型号未披露。
