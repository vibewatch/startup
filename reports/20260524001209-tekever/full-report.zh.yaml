      - number: '2.2'
        title: TAM、SAM 与受证据约束的规模测算口径
        blocks:
          - type: paragraph
            body: >-
              公开市场规模数据有方向价值，但彼此不一致。保守的区域口径来自 MarketsandMarkets：欧洲 UAV 市场在 2025 年为 USD 5.0 billion，2030 年为 USD 7.98
              billion。Grand View 给出的更窄军事专项口径在 2024 年已达 USD 9.47 billion；Coherent 的全球军用无人机估计到 2026 年为 USD 27.2
              billion。Market Data Forecast 发布的欧洲数字更大，2025 年为 USD 14.74 billion；但从 2024 年 USD 4.10 billion
              的跳升很难与其他公开来源对齐，应视为离群值，而不是规划基准。更稳健的解读方式是把这些来源当作多重镜头：广义欧洲 UAV 市场、欧洲军用无人机子市场和全球军用无人机 TAM。Tekever 的 SAM
              比任何一个都窄，因为公开证明落在主权 ISR、海事监视、边境监控和协同防务项目。自下而上看，公开合同只能给出地板，不是干净的 SOM：仅 OVERMATCH 折年约 £80 million / 年，EMSA 约
              €7.5 million / 年。结论是市场足够大，值得重视，但公开来源无法精确切出 Tekever 的仅欧洲 SAM 或 SOM。
