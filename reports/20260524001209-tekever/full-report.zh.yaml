chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与商业模式
        blocks:
          - type: paragraph
            body: >-
              Tekever 于 2001
              年由专攻人工智能、机器学习和分布式系统的计算机科学家与研究人员在葡萄牙创立。公司从第一天起就靠自举推进，早期定位不是传统航空航天硬件，而是智能、高度分布式的自主系统。这个起点很关键：它解释了 Tekever
              区别于传统防务主承包商和 UAS 厂商的软件中心、AI 优先产品哲学。


              截至 2026 年，核心硬件组合覆盖三个平台。AR3 是战术无人航空系统，面向对抗性陆地和海上环境中的情报、监视和侦察。AR5 是固定翼 UAS，专为长航时海事监视打造，自 2017 年起已在 EMSA
              及欧洲多国机构投入运行。ARX 是最新平台，面向有人-无人协同等新任务类型。硬件之外，ATLAS AI 分析情报平台提供任务关键软件：FPV 视频串流、热力图跟踪、态势感知和 AI
              驱动的目标检测，把硬件接入可执行的情报工作流。另有两个业务单元——Tekever Digital（数字化转型服务）和 Tekever Space（卫星系统与技术）——把集团版图延伸到纯 UAS 之外。


              商业模式围绕政府和准政府采购。公开证据指向几类收入：长期框架合同（€30 million EMSA 协议）、单一项目合同（€5 million Spain Ministry of
              Interior）以及主权伙伴项目（英国 OVERMATCH，£400 million / 五年）。防务与民用 / 海事分部的收入拆分未公开。公司材料引用 Ventura Capital
              的说法，称其拥有「独特盈利且可持续的商业模式」，但没有审计财务支撑。
