      - number: '5.4'
        title: 部署流程、任务剖面与路线图
        blocks:
          - type: paragraph
            body: >-
              AR3 EVO 的部署流程围绕速度和极小后勤足迹设计。从运输箱到升空不到五分钟。操作员五天即可完成训练，明显低于同等能力传统军用 UAS 通常需要的数周或数月。Tekever
              自有无人机操作员和数据分析师团队，可提供端到端托管服务；客户拿到的是成品情报，而不是自己操作平台。这种部署模式已在 Ukraine 通过 UK 主导的 Task Force Kindred 计划规模化验证：AR3
              在对抗空域累计超过 10,000 战斗飞行小时，提供 ISR 支持。


              任务剖面覆盖四类主要构型：ISR（EO/IR 或 HD 云台、SAR、GMTI、SIGINT、战术数据链、激光指示器）；电子攻击（定向 EW
              天线、抗干扰模块、面向特定目标的通信节点）；通信中继（网状无线电、SATCOM/LTE、IFF/ADS-B 应答机）；海上广域监视（EO/IR、AIS 接收机、海事 VHF、SAR
              雷达）。每种任务剖面都能用热插拔载荷模块独立配置，意味着单架 AR3 EVO 机体可在连续架次中承担不同角色，地面周转时间很短。


              产品路线图正同时向两个方向扩张。向上进入有人-无人协同：Project NYX（British Army 忠诚僚机）要求 Tekever 快速开发并演示一款与 Apache 直升机协同的旋翼平台；作为
              OVERMATCH 承诺的一部分，新的 Tekever Centre for Autonomy and Engineering Hub 也将在 Bristol 开放。向下进入太空：DESIR 计划要求
              Tekever 交付 France 首个主权 SAR 卫星能力所需的有源 SAR 天线，把天基与空域 ISR 融合成多模态持续监视架构。Viasat BRLOS 合作与 CNES/DGA DESIR
              项目一起说明，Tekever 把空天数据融合视为中期产品核心方向，而不只是相邻研究议题。
