      - number: '5.2'
        title: 自主、感知与 AI 技术栈
        blocks:
          - type: paragraph
            body: >-
              Tekever 的技术差异化不主要来自机体本身，而是来自嵌在机体里的自主、感知和数据层。三块模块最关键：GAMASAR 合成孔径雷达、Visual-Based Navigation（VBN）系统，以及 ATLAS
              情报平台。


              GAMASAR 是 Tekever 自有 Space 部门设计并制造的 SAR 雷达，不是从第三方采购。GAMASAR 最初为航空与天基地球观测研发，如今已集成到 AR3 EVO 和 AR5
              平台。已披露的关键性能参数包括双侧视探测距离最高 40 km，以及全天候、昼夜目标探测；在 EMSA 作业的 North Atlantic 和 North Sea 条件下，这些能力让它适合广域海上监视。把 SAR
              集成到低于 200 kg 的平台并不简单：Tekever 的做法是让 GAMASAR 与平台飞控和传感器融合栈协同设计，集成深度不是外接第三方载荷能复制的。Tekever Space 部门还在为 CNES 和
              France DGA 的 DESIR 计划开发面向微卫星星座的 GAMASAR 变体，显示路线图正延伸到天基持续 ISR。再叠加 Ka/Ku-band SATCOM 链路在 BRLOS 模式下超过 4 Mbits
              的传输能力，AR5+GAMASAR 组合提供了一种持续、全天候 ISR 能力；Tekever 称，同重量级平台中没有匹配方案。


              Visual-Based Navigation（VBN）系统解决了 Ukraine 作战暴露出的脆弱点：GNSS 干扰和欺骗。VBN 用 AI
              驱动的计算机视觉和机器学习，从机载摄像头和传感器实时捕捉的环境特征中提取、分析并解读线索。边缘计算模块——具体为 NVIDIA 片上系统硬件——处理这些视觉线索，并与卫星数据比对，在不依赖 GNSS
              信号的情况下持续更新平台三维位置和姿态。该系统已经落地运行，不只是原型；公开描述称，它已在真实对抗环境部署中得到验证。这项能力补上了大多数竞品小型战术 UAS 在电子对抗战区作业时的关键短板。


              ATLAS 是把原始传感器数据转成决策级情报的软件层。ATLAS
              面向关键决策者和管理层员工，基于浏览器运行（无需安装软件），覆盖三个任务阶段：任务前规划（兴趣区域、目标、目标指定、审批流程）；任务中实时画面监控（视频、航迹、目标识别，以及风和洋流等环境叠加层）；任务后复盘和证据提取（任务回放、跨任务船只关联、AIS
              数据交叉引用）。平台 AI 重点做目标检测、变化检测、分类和跟踪。ATLAS 把 Tekever 的硬件平台从飞行器变成端到端情报服务——这也是 Tekever 将商业模式定义为
              Intelligence-as-a-Service，而不是 UAS 硬件销售的原因。
