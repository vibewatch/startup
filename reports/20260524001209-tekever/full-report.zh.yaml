    rows:
      - - AeroVironment (Puma AE / JUMP 20)
        - 直接同业（海事 ISR / 战术）
        - 上市公司（AVAV）；FY2024 收入 ~$609M；市值 $3B+
        - NATO / 盟国海上巡逻、战术 ISR、US DoD
        - NATO 采购记录已验证；STANAG 认证成熟；规模更大
        - US ITAR 约束限制 EU 销售；欧洲商业足迹有限；价格层级更高
      - - Schiebel (Camcopter S-100)
        - 直接同业（海事 VTOL ISR）
        - 私营（奥地利）；估计收入 ~€100M；14+ 个海军客户
        - 舰载海军行动；欧洲海岸警卫队；海上巡逻
        - VTOL 舰艇集成占优；已在 14+ 支海军验证；欧洲制造
        - 固定翼架构更适合长航程沿海巡逻；Schiebel 没有 AI 分析层
      - - Baykar (Bayraktar TB2)
        - 出口市场挑战者（MALE 战术）
        - 私营（土耳其）；估计收入 $1–2B；30+ 个国家客户
        - 东欧防务；NATO 出口市场；对出口价格敏感的买方
        - 单位成本低（估计 ~$5M）；乌克兰实战验证；30+ 国装机基础
        - 并非为海事 ISR 优化；土耳其地缘政治定位带来联盟风险
      - - Elbit Systems (Hermes 900 / Hermes 450)
        - MALE 传统厂商（欧洲业务）
        - 上市公司（ESLT）；2023 收入 ~$5.6B；NASDAQ 上市
        - NATO 成员；欧洲国防部；海上巡逻（较大项目）
        - 规模、工程深度和既有 EU 防务关系；Hermes 900 具备 MALE 级能力
        - 价格层级高得多；以色列公司身份限制 EDA 资格；AI 优先型架构较弱
      - - General Atomics (MQ-9A Reaper)
        - MALE 传统厂商（仅 US / US 盟友）
        - 私营（Linden Blue）；估计收入数十亿美元；美国政府为主要客户
        - US DoD；US 条约盟友；NATO 最大 MALE 项目
        - 27 小时续航；US DoD 平台已验证；重载荷（~1,700 kg）
        - 单位成本 ~$32M；US ITAR 严重限制 EU 销售；无 EU 注册地或 EDA 资格
      - - Shield AI (V-BAT)
        - AI 自主同业（海事 / 战术 VTOL）
        - 私营；已融资 $500M+；估值估计 $2.8B（2022）
        - US DoD 海上巡逻；特种作战；GPS 拒止环境 ISR
        - Hivemind AI 自主飞行员；V-BAT VTOL 适合舰载操作；US DoD 验证
        - 主要聚焦 US；欧洲民用海事存在感有限；监管语境不同
      - - Anduril Industries（Ghost-X / Lattice OS 平台）
        - AI 自主同业（自主防务）
        - 私营；已融资 $1.5B；估值估计 $14B（2024）
        - US DoD；盟国军队；自主拦截器；巡飞弹；战场 AI
        - Lattice OS AI C2 可规模化；自主防务资本基础最大；Ghost-X 战术 UAS
        - 主要服务 US DoD；Ghost-X 所在任务层级不同；EU ISR 存在感有限
      - - 有人海上巡逻机（P-8、C295）
        - 现状替代方案
        - 成熟市场；Airbus / Boeing；数十亿美元级机队项目
        - 反潜作战；远程海洋巡逻；重载荷任务
        - 重型 ASW 任务载荷大、航程远；敏感行动中由机组决策
        - 相比 UAS 成本，飞行小时成本 $5,000–$15,000+；机组和基础设施要求高
    notes: >-
      收入和估值数字为截至 May 2026 来自公开文件、媒体报道和分析师摘要的估计值。Baykar 财务来自媒体报道估计；Baykar 不披露财务。Schiebel 收入和客户数来自行业报告和公司材料。General
      Atomics 是私营公司；收入为分析师估计。Shield AI 和 Anduril 估值来自已发布融资新闻稿。AeroVironment 收入来自公开 SEC 文件（FY2024）。Tekever
      规模和估值来自公开公告（£1B+ 独角兽，May 2025）。未公开披露的单价使用市场估计。
