      - number: '3.3'
        title: MALE UAS 既有厂商——Elbit Systems 与 General Atomics
        blocks:
          - type: paragraph
            body: >-
              Elbit Systems 是 Tekever 最重要的大型欧洲竞争对手。2023 年收入约 $5.6 billion，并与欧洲 NATO 成员保持强关系，Elbit 带来的产品深度和机构可信度都不是
              Tekever 现阶段能匹配的。Hermes 900 Starliner——Elbit 的旗舰 MALE UAS——达到 36 小时航时、30,000 feet 升限和 180 kilogram
              载荷能力，在任务持续时间和载荷上大幅超过 AR5，但采购和运营成本也显著更高。Elbit 横跨海事监视和陆地 ISR 竞争，并且在欧洲防务项目（包括英国和 EU 市场）存在不断扩大，直接挤压 Tekever
              的扩张野心。关键在于，Elbit 缺少 Tekever 的欧洲注册优势，难以满足 EU 工业参与和 EDA 项目资金要求；这给 Tekever 在要求 EU 来源能力的合同中带来结构性欧洲采购优势。General
              Atomics 的 MQ-9A Reaper 属于 MALE 级系统，27 小时航时，估计单机成本 $32 million——与 Tekever 平台处在完全不同的价格层级。General Atomics
              几乎完全经由美国 DoD 和美国出口审批流程运作，因此对 Tekever 的竞争意义主要在最大型 NATO MALE UAS 项目，而不是 Tekever 所处的海事巡逻和小规模 ISR 细分。Baykar 的
              TB2 和 TB3 则在成本驱动的出口市场更具直接颠覆性。
