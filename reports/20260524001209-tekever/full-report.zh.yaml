      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              买方-用户-付款方地图比商业 SaaS 更机构化。买方通常是国防部、军种、海岸警卫队、边境和内政主管部门，或 EMSA 等 EU 机构；操作用户是飞手、任务机组、ISR
              分析员和指挥人员，他们需要持续数据，而不只是机体。付款方来自防务采购预算、海事安全机构预算，或更广泛的主权工业项目；这些项目把能力采购与本地制造、安全供应绑定。Tekever 的公开证据支持这一模式：EMSA
              是泛欧洲海事买方；英国政府同时是能力赞助方和产业政策参与者；Tekever 美国办公室更像支持和贴近客户的动作，并不能证明公司核心市场已经离开欧洲。采用路径通常始于买方需要比有人巡逻更经济的广域覆盖或更快 ISR
              输出，然后经历资金批准、采购、空域与集成工作，最后进入重复服务或制造承诺。能够把飞机平台、传感器、数据链、运营支持和主权生产布局组合起来的供应商，更容易吃到这条路径；单卖硬件则弱很多。
