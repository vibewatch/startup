  - id: FU001
    title: 客户旅程图 — Tekever 主权与海事客户分群
    type: journey-map
    summary: 展示英国防务、EMSA 海事、本土安全、合作伙伴 / 渠道以及早期美国特种作战客户从采购到投产的不同路径。
    data:
      items:
        - id: stage-sovereign-procurement
          label: 主权采购接触
          actor: UK MOD、Spain MOI、葡萄牙国家主管机构
          description: >-
            政府防务与安全采购机构通过正式招标、框架协议（OVERMATCH、EMSA）或直接授标接触 Tekever。UK MOD 走得最远——StormShroud、Project NYX、OVERMATCH
            多个项目并行。Spain MOI 通过边境巡逻竞争性招标进入；葡萄牙作为本土主权客户直接采购。
          channels:
            - UK MOD OVERMATCH 框架
            - EU 采购指令下的 EMSA 竞争性招标
            - 主权直接采购
        - id: stage-pilot-evaluation
          label: 运营评估或试点
          actor: 防务评估方、DSTL、NATO 伙伴
          description: >-
            Tekever 多数防务客户在承诺投产前会先走评估或演训阶段。USSOCOM 已完成一次作战演练（仍停在该阶段）。Project NYX 是开发合同，用来评估下一代概念。StormShroud
            已越过该阶段，进入生产服务。
          channels:
            - 受控军事演练（USSOCOM）
            - 开发合同（Project NYX）
            - NATO DIANA 评估网络
        - id: stage-production-deployment
          label: 生产 / 运营服务
          actor: RAF 操作方、EMSA 海事主管机构、海岸警卫队
          description: >-
            投产客户在核心任务中使用 Tekever 平台。StormShroud 进入 RAF 电子战服役；EMSA 在 EU 成员国部署 AR5；Italy Coast Guard 在 SAR 中使用 AR5；Spain
            MOI 部署 AR3 执行边境巡逻；Nigeria Navy 接收 AR3 硬件。
          channels:
            - RAF 电子战行动
            - EMSA 海上监视服务
            - Nigeria Navy Deep Blue 海域态势感知
        - id: stage-expansion-deepening
          label: 扩张 / 项目深化
          actor: 项目经理、Tekever 客户团队
          description: 投产客户扩大项目范围、增加平台，或部署到新地域。OVERMATCH 为此提供多年框架。EMSA 服务已在多个 EU 成员国扩展地域覆盖。Nigeria 从初始交付扩展到 Aerial Robotix 持续运营。
          channels:
            - OVERMATCH 分批采购扩张
            - EMSA 框架在成员国分批采购
            - 渠道伙伴任务扩张（Aerial Robotix）
        - id: stage-renewal-retention
          label: 框架续约 / 留存
          actor: 采购主管机构、UK MOD 项目经理
          description: 框架合同（EMSA、OVERMATCH）需要在既定周期续约或重新招标。EMSA 框架续约受 EU 竞争性采购规则约束。OVERMATCH 五年期结构降低了续约频率。各分群均无不续约记录。
          channels:
            - EU 采购重新招标（EMSA）
            - OVERMATCH 项目评审（UK MOD）
            - 双边主权关系管理
