      - number: '8.4'
        title: 乐观、基准与悲观情景分析
        blocks:
          - type: paragraph
            body: >-
              乐观情景假设 OVERMATCH 按框架上限完整执行，法国计划到 2028 年爬坡至每年 €50 million 收入，Project NYX British Army 合同转入系列化生产，并且 US SOF
              市场渗透带来增量收入。在该情景下，Tekever 到 2027–2028 年年收入可能达到 £180–220 million；作为 AI 加持且拥有双主权锚点的防务平台，可支撑 15–20× P/S 倍数，对应
              £2.7–4.4 billion 企业价值。该情景要求 OVERMATCH 不滑坡、法国执行风险不兑现，并且创始人领导力穿过最资本密集的增长阶段仍保持完整；每个条件单独看都合理，但联合概率中等。


              基准情景按 OVERMATCH 60 percent 利用率建模（五年提款 £240 million，平均每年 £48 million），EMSA 按当前 €30 million 费率续约，法国到 2028
              年缓慢爬坡至 €20–30 million。到 2027 年年收入 £80–110 million，按 12–15× P/S 倍数——与高增长防务 AI 平台同业区间一致——对应 £0.96–1.65
              billion 企业估值。只有收入爬坡很快启动、OVERMATCH 在 2025–2026 年开始提款，当前 £1 billion+ 标记才合理落在基准情景区间内。


              悲观情景假设 OVERMATCH 计划滑坡 12–24 个月，法国投资停留在建设阶段、没有签约收入，2026 年没有新增大规模客户。年收入 £30–50 million，按 10–12× P/S 倍数——较
              AeroVironment 历史 P/S 低点仅有温和溢价——对应 £0.3–0.6 billion 企业价值，较当前 £1 billion+ 入场价低 40–70
              percent。悲观情景不是中心判断，但很重要，因为公开证据无法排除。
