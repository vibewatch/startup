      - number: '6.2'
        title: 具名客户验证 — 量产状态与结果证据
        blocks:
          - type: paragraph
            body: >-
              Tekever 客户组合中最强的客户验证证据是 RAF StormShroud 计划。UK Prime Minister 官方新闻声明、DSTL 正式公告以及独立的 UK Defence Journal
              报道都确认，StormShroud 已进入 RAF 现役服役——不是评估，不是试点，而是正式作战服役。政府新闻办公室、防务实验室和专业媒体三方信源交叉佐证，构成了防务行业客户验证的黄金标准。Project
              NYX（British Army）是开发合同，不是量产部署，但仍证明了第二个 UK MOD 军种分支是活跃付费客户。


              EMSA 海上监视关系持续时间最长。AR5 自 2017 起就在 EMSA 作业服务中——九年连续生产部署，且有多次续约和任务公告记录。Italian Coast Guard 参与 EMSA 牵头的 SAR
              演习，Gulf of Genova 执行作业监视任务，证明 EMSA 关系转化成了真实作业产出，而不只是框架协议。EMSA 官方 THETIS 服务记录提供了独立的监管级佐证。


              Nigeria 的 Deep Blue Project 交付了 AR3 系统实物硬件给 Nigerian Navy——不是意向书或试点，而是已完成交付。Aerial Robotix
              合作把交付延伸为面向关键基础设施的持续作业监测任务。Spain Ministry of Interior €5 million 合同确认国土安全是单独的生产收入类别。USSOCOM
              作业演习已成功完成，但截至目前还没有转化为生产合同，也没有披露采购意向。
