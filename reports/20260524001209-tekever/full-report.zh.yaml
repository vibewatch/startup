      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 中等置信度下观察——买入需要数据室访问
            body: >-
              Tekever 获得中等置信度的观察建议。战略资产逻辑在欧洲防务科技中属于最强一档：经战场验证的 UAS、双主权锚点和 AI 软件定位，支撑溢价估值框架。但相对于可独立核验的证据基础，£1 billion+
              入场价偏紧。转为买入需要经审计收入确认每年 £60–80 million 以上的可信基底，厘清 OVERMATCH 前 18 个月提款时间表，并获得足以建模普通股回报的股权结构表透明度。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV017
              - CV032
              - CV034
              - CV040
          - type: callout
            title: OVERMATCH 框架是上限，不是已承诺订单簿
            body: >-
              英国 OVERMATCH 头部数字 £400 million 是框架承诺——五年内最高支出授权。实际任务订单发放和支出具有自由裁量。这一区分对估值逻辑极其关键：一个五年利用率 60 percent 的 £400
              million 框架，带来的是年均 £48 million 收入，不是 £80 million。投资人必须独立建模提款曲线，并把框架上限视为上限，而非基准。
            calloutType: risk
            claimRefs:
              - CV002
              - CV020
              - CV038
          - type: callout
            title: 主权验证相对商业可比公司带来真实但有边界的溢价
            body: >-
              NATO Innovation Fund 参与和首相层面的 OVERMATCH 公告，提供了主权可信度溢价，足以支撑高于纯商业防务科技可比公司的估值。但这一溢价有边界：Palantir 以 18–20×
              收入交易，是因为其软件护城河可通过公开备案独立核验；Tekever 的软件溢价论点，需要经审计收入拆分数据来证明总收入中 ATLAS 平台许可证与硬件交付各占多少，否则无法确认。溢价真实存在；幅度不确定。
            calloutType: insight
            claimRefs:
              - CV004
              - CV018
              - CV022
              - CV031
