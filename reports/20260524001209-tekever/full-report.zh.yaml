          - type: callout
            title: 第三方 SAR 与 SATCOM 依赖限制供应韧性
            body: >-
              尽管 Tekever 在机体和软件上垂直整合，两项任务关键能力——SAR（IMSAR NSP-3）和 BRLOS SATCOM（Viasat）——仍依赖 US-origin
              技术供应商。在防务出口或地缘压力场景下，US 出口管制限制或供应商优先级调整，都可能扰动 Tekever 交付完整配置平台的能力。GAMASAR 的研发会逐步降低 IMSAR 依赖，但替换 Viasat
              SATCOM 需要欧洲 SATCOM 替代方案，或使用 Starlink（后者自带地缘集中度风险）。
