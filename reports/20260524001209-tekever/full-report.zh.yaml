      - number: '5.5'
        title: 合规、信任控制与技术风险
        blocks:
          - type: paragraph
            body: >-
              Tekever 处在民用空域监管（欧洲的 EASA）、出口管制（关键产品 ITAR-free 认定）、数据安全（处理敏感 ISR 视频和位置情报）以及自主系统伦理（EU AI Act）的高度监管交叉点。AR5
              被明确宣传为 ITAR-free，并在欧洲 按符合 EASA 的制造标准生产；在适用 US-origin 技术限制的市场，这是一个战略差异点。EASA 规则管辖 EU 成员国 的 UAS 运营，并要求 AR5
              这一级别重量的系统满足适航标准。


              数据安全方面，ATLAS 被描述为提供基于浏览器的任务情报，支持可定制审批流程和基于角色的访问控制；主权军方和执法客户需要严格的数据托管，这些能力是必要条件。但 ATLAS 平台没有公开披露外部审计、ISO
              27001 证书或独立渗透测试记录，对机构买方构成尽调缺口。


              EU AI Act 于 2024 生效，将用于关键基础设施和执法的 AI 系统归为高风险，要求符合性评估、技术文档和持续监控。Tekever 的 AI 栈，尤其是 ATLAS 内的自主目标检测与跟踪模块以及
              VBN 系统，很可能落入高风险类别。公司 Head of Data and AI Nicolas van Hanxleden Houwert 在公开博客中承认，EU AI Act
              合规对公司越来越必要，但具体合规里程碑尚未公开披露。


              另一个技术风险是无人机机载边缘 AI 处理依赖 NVIDIA 芯片。先进半导体的出口管制，尤其是 GPU 和 AI SoC 设备，在地缘压力场景下制造了潜在供应链脆弱点。GNSS-denied VBN
              系统通过降低对卫星基础设施的依赖部分缓释了这一风险，但也引入自身失效模式：在视觉地标稀疏或被遮挡的低纹理环境（开阔海面、沙漠、厚云层）中，视觉导航性能会下降。Tekever 未公开披露这些限制。
