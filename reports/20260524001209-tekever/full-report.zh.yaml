  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >-
              Tekever 的乐观投资逻辑有三条相互咬合的支柱。第一，公司积累了稀缺的战场验证履历：AR3 在 Ukraine 超过 10,000 作业飞行小时，提供了实验室认证无法复制的现役验证；NATO
              盟友重视实战检验能力，这一资质能缩短采购周期。第二，UK OVERMATCH 计划——Prime Minister 层面同意的 £400 million、五年框架——是迄今宣布的欧洲成长型企业最大主权 UAS
              承诺；France €100 million 工业扩建在项目完全爬坡前又加入第二个重大主权锚点。第三，Tekever 以 AI 软件为中心的架构——用于任务管理、目标检测和态势感知的 ATLAS
              平台——支撑了相对纯硬件 OEM 同行的软件公司估值溢价；防务 AI 软件在 M&A 中可拿到 15–25× 收入倍数，显著高于同等规模战术 UAS 硬件业务的 8–12×。


              反向逻辑同样有分量。Tekever 没有向 UK Companies House 提交经审计账目，使外部无法独立核验支撑 £1 billion+ 估值的收入基础。OVERMATCH
              承诺是框架上限，不是有保证的订单簿；五年窗口内实际支出由裁量决定，项目交付里程碑也未公开披露。客户集中度很高：EMSA €30 million 框架和 OVERMATCH
              计划共同主导已知合同基础，任何一个项目取消或重新竞争，都会明显压缩收入轨迹。May 2025 轮次的股权结构、优先权条款和稀释水平未披露，形成优先权悬置不确定性，可能大幅侵蚀普通股回报。对创始人 CEO
              Ricardo Mendes 的关键人依赖很实质；退出流动性机制——并购出售或 IPO——也因军民两用出口管制制度和资产的政治敏感性面临结构性障碍。
