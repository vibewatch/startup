      - number: '1.2'
        title: 领导层、治理与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              Ricardo Mendes 是 Tekever 的 CEO，也是事实上的对外面孔；公开记录显示，公司对他有很强的关键人物依赖。他于 2001 年联合创办 Tekever，带领公司完成乌克兰转向、独角兽融资轮和
              £400 million OVERMATCH 公告，几乎所有重大公司公告和外部演讲都由他具名。Mendes 曾在 United Nations Counter-Terrorism Week (2023)
              发言，并持续公开主张用 AI 赋能的自主系统替代人员执行高风险防务与安全任务。他符合典型 founder-CEO 画像：个人身份和公司市场可信度高度绑定。


              除 Mendes 外，公开记录显示 Tekever 已搭起一个小而扩张中的高管层。Paulo Ferro 是战略发展 VP，代表 Tekever 参加 North Carolina
              美国办公室开幕，承担战略市场角色。Nadia Maaref 负责 Security Business Unit，并兼任 Tekever France 董事总经理，体现高管同时背负运营和商业职责。Kateryna
              Bezsudna 于 2025 年获任负责乌克兰运营和扩张，带来前线市场经验，并公开使命是把乌克兰建成自主系统创新的全球枢纽。António Relvas 负责创新。


              董事会构成、治理架构和正式投资人代表均未公开披露。公司没有公开董事名录；英国备案记录里，除标准备案外，没有发布公司章程修订；也没有披露股东协议。这在同阶段私营公司中很常见，但也意味着外部无法凭公开证据独立评估治理监督、接班规划和投资人否决权。Mendes
              的关键人物风险因此是第一优先尽调事项，必须拿到资料室材料才能充分回答。
