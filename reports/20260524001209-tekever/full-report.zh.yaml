            body: >-
              Tekever 的财务风险主要来自已承诺资本开支与收入兑现时点之间的缺口。Swindon 和 Cahors 两处建设都需要大量前置 capex，而 OVERMATCH 和 France
              防务付款要达到足以支撑持续运营的水平还需要时间。没有公开可得的经审计财务报表，无法独立核验现金头寸、烧钱速度或营运资本是否充足。独角兽估值在结构上锚定 OVERMATCH；SIPRI 的 2026 分析显示，UK
              财政约束可能在未来支出审查中影响长周期采购。治理不透明放大了财务风险：CEO Ricardo Mendes 是所有公开沟通中唯一具名高管，董事会构成、继任安排和审计委员会结构均未披露。Tekever
              的跨国投资人基础——NATO Innovation Fund、NSSIF、Baillie Gifford、Crescent Cove——提供了战略支持和政策通道，部分抵消治理风险；取消 OVERMATCH
              的政治成本也提供结构性缓冲。三个打破投资逻辑的场景——出口许可撤销、OVERMATCH 取消、战场事件——按发生概率和投资人影响在风险热力图中排序。人员 / 执行风险登记表与缓释 /
