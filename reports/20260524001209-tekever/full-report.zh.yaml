      - number: '5.3'
        title: 模块化架构与制造
        blocks:
          - type: paragraph
            body: >-
              AR3 EVO 的四支柱模块化架构，是 Tekever 宣称任务灵活性的产品哲学底座。四支柱分别是：载荷（可更换的传感器和效应器包，从 EO/IR 到 SAR、SIGINT、EW
              和激光指示器）；动力（可按任务在电动、燃烧或重油发动机之间选择，以优化续航、速度或高度）；部署（按作战场景选择 VTOL 或固定翼模式）；通信（即插即用支持 SATCOM、LTE 和视距链路，包括
              Starlink、Iridium、Link 16、Trellisware TSM、Silvus 网状网络和
              Radionor）。兼容的载荷和传感器生态很宽：Trillium（HD80）、HoodTech（AC11、AC06 LD）以及 Tekever 自有云台；IMSAR（NSP-3）的
              SAR；CRFS、ESROE、Revector 和 Lifeseeker 的 SIGINT；通过 CRPA 天线实现的 EW；包括 Mode S ADS-B 和 IFF Mode-5
              在内的应答机；以及用于海事作业的 AIS/VHF。官方产品手册记录了这种广度，使 AR3 EVO 真正具备多角色能力，而不是被限制在单一任务构型。


              Tekever 的制造模式贯穿全价值链垂直整合：航空设计、复合材料结构制造、电子设计与生产，以及软件开发（包括深厚的数据科学能力）。Viasat 合作公告突出这一点，公司材料也给出同样表述；这种整合让
              Tekever 比依赖分包供应商提供结构件或电子部件的同行更快把产品推向市场，也更快迭代。公司在 United Kingdom（OVERMATCH 计划下宣布了 Swindon 新工厂）和 Portugal
              拥有工程与生产设施；France 的 Toulouse 与 Cahors 基地分别聚焦 Space 和无人机生产。Cahors 工业基地在 early 2026 进入改造阶段，计划在 summer 2026
              前启动运营。


              制造模式也带来一个关键依赖风险：SAR（IMSAR NSP-3）、SATCOM（Viasat）以及若干 RF/通信模块（Silvus、Persistent
              Systems、Starlink）的关键载荷集成来自第三方。与定制集成方案相比，即插即用架构降低了锁定风险；但这些供应商中任何一家中断供给，尤其是在防务出口场景下，都可能限制 Tekever
              大规模交付任务关键构型的能力。
