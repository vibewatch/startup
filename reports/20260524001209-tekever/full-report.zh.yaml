      - number: '4.2'
        title: 资本结构、融资轮与融资依赖
        blocks:
          - type: paragraph
            body: >-
              Tekever 的资本史已在公司概览章节完整展开，显示两个清晰融资事件：November 2024 的 €70 million Series B，由 Baillie Gifford 和 NATO
              Innovation Fund 领投；随后 May 2025 独角兽确认轮由现有投资人足额认购，并由 Ventura Capital 领投。独角兽轮确认估值超过 £1 billion，按公告时汇率约等于 €1.2
              billion。本章不重复公司概览里的逐轮融资时间线，而是聚焦资本结构对未来运营意味着什么：资本充足性和融资依赖。


              Companies House 关于 Tekever Ltd（英国实体，公司号 08684764）的备案历史显示，截至 31 December 2024 的完整账目已于 13 October 2025
              提交。更早账目覆盖截至 31 December 2023（30 September 2024 提交）和 31 December 2022（26 September 2023 提交）。会计期间在 2022 年从
              31 March 缩短至 31 December，表明当时有一段公司重组。英国实体到 2022 年仍以小公司身份备案，2023 和 2024
              年升级为完整账目格式——这是公司英国资产负债表大幅增长时常见的过渡。通过标准 Companies House 搜索，外部无法以可读形式获取任何已提交账目。


              Tekever Ltd 的 charges register 显示，仅有一项未清偿押记（code 0868 4764 0001），受益人为 Barclays Security Trustee
              Limited，包含一项固定押记，创建于 10 May 2022、交付于 11 May 2022，状态为 Outstanding。这表明公司最晚自 May 2022
              起已使用由公司资产担保的银行债务融资——可能是循环信贷额度或定期贷款。该押记尚未清偿，说明债务额度仍在。这个发现具有结构性重要性：Tekever 并非纯股权融资。Barclays 押记与 Baillie
              Gifford、NIF、NSSIF、Ventura Capital 等股权融资并存，意味着资本结构混合了股权和有担保债务。


              OVERMATCH 项目承诺五年 £400 million，但 Tekever 明确表示这是公司投资承诺，而非客户付款时间表。这个区别对财务尽调至关重要：£400 million 代表 Tekever 计划投入
              R&D、生产基础设施、英国制造和项目交付的 capex 与运营支出，不是 £400 million 政府合同。Swindon 无人机工厂（254,000 sq ft，计划 2026
              年开业）是一项重大固定资产承诺。这些投资的资金必须来自股权轮、运营现金流、政府共同投资、债务额度和主权项目费用。项目收入能覆盖投资承诺到什么程度，公开信息没有量化。
