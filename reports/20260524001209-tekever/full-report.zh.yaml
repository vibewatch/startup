        - 持续监视 22h+，可在 GNSS 拒止环境运行
        - 纯 VTOL 模式载荷重量受限；通信距离依赖中继链
      - - 电子攻击 / 电子战
        - 专用 EW 飞机成本高、可用性有限
        - AR3 EVO 搭载定向 EW 天线、抗干扰模块
        - 25 kg 以下平台可快速部署，以低特征实施电子拒止
        - EW 有效距离和干扰功率未公开说明
      - - 海上广域监视
        - 直升机或有人巡逻机；成本高、航时有限
        - AR5 同步搭载 EO/IR、SAR、AIS、海事雷达；EMSA 自 2017 年起运营
        - 12–20h 航时，借助 SATCOM 达到 1000+ km 航程；ITAR-free 支持广泛出口
        - 天气会削弱光学传感器；SAR-only 模式把航时限制在约 12h
      - - 争夺环境通信中继
        - 卫星通信或地面中继器 — 部署慢，资产固定
        - AR3 EVO 搭载网状网络电台、SATCOM/LTE、IFF/ADS-B；作为空中中继节点
        - 可快速部署到 5x5m 受限空间，包括舰船甲板，用于 BVLOS 中继
        - 中继容量受 SATCOM 带宽限制；广域覆盖需要多架飞机
      - - 搜救 / LifeSaver 投放
        - 有人直升机；受天气制约，海上环境机组风险高
        - AR5 具备 LifeSaver 救生筏投放能力，搭载 EO/IR、AIS、EPIRB
        - 已在 Italian Coast Guard 演习中演示；无机组风险；响应快
        - 高海况下精准投放可靠性未获独立验证
