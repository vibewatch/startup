  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >-
              Tekever 的竞争环境最好拆成五类对手，每一类都代表不同的买方取舍和替代路径。第一，直接海事 ISR 同业：AeroVironment 的 Puma AE 和 JUMP 20 平台、Schiebel 的
              Camcopter S-100 VTOL UAS，在海军巡逻和海事监视任务中正面竞争。它们是 Tekever 在 EMSA 合同续约和欧洲海军采购中的主要威胁。第二，MALE 和战略 UAS 既有厂商：Elbit
              Systems 的 Hermes 900 和 General Atomics 的 MQ-9A Reaper 处于更高空、更长航时任务层，机体更大、价格点也显著更高（估计 $10–32M /
              架），因此是部分替代品，而不是 Tekever 主要海事 ISR 细分里的直接对手。第三，出口市场挑战者：土耳其 Baykar 凭 Bayraktar TB2 展示了异常强的出口动能——截至
              2025–2026，超过 30 个国家运营该平台，包括 EU NATO 成员波兰、拉脱维亚和阿尔巴尼亚——其价格点（估计每套 ~$5M）在价格敏感的东欧市场形成真实竞争压力。第四，AI 自主防务平台：Shield
              AI（Hivemind AI pilot、V-BAT VTOL）和 Anduril（Ghost-X、Lattice OS）最接近 Tekever 的 AI 优先定位，但主要运行在美国 DoD 生态，2026
              年在欧洲 UAS 商业存在有限。第五，现状替代品：有人海事巡逻机（Lockheed P-8 Poseidon、Airbus C295 Maritime Patrol）和商业卫星 ISR（Planet
              Labs、Maxar），是 Tekever 增长必须替代的基线。理解这五类，才能判断 Tekever 现有市场位置是否耐久，还是主要吃到了暂时性的监管和声誉优势。
