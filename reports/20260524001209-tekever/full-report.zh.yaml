      - number: '3.2'
        title: 美国防务科技同业——AeroVironment、Shield AI 与 Anduril
        blocks:
          - type: paragraph
            body: >-
              AeroVironment 是 Tekever 最可直接对比的上市竞争对手。其 FY2024 收入约 $609 million，约为 Tekever 估计规模的
              30–50x，因此工程基础和政府合同记录都大得多。AeroVironment 的 Puma AE 已获 STANAG 海事作业认证，并在美国及盟国海军中积累了大量作业小时。较新的 JUMP 20 平台（VTOL
              与固定翼混合转换）瞄准与 Tekever AR5 相同的长航时 ISR 任务，在 NATO 成员国合同中形成直接采购竞争。AeroVironment 的主要结构性优势是深厚的美国 DoD
              关系和成熟的美国政府采购载体；相对 Tekever 的主要结构性弱点，是欧洲商业布局有限，以及美国 ITAR 出口限制会拖慢或限制盟国销售。Tekever 的 AR3 EVO 与 Puma AE 在 10kg
              级战术 ISR 细分竞争；AR5 与 JUMP 20 在海事长航时任务中竞争。Shield AI 的 V-BAT VTOL 平台瞄准海事巡逻和陆地 ISR 任务，具备 11+ 小时航时和自有 Hivemind
              AI pilot，可在无 GPS 场景自主运行，与 Tekever 的 ATLAS 平台形成直接能力平行。Shield AI 截至 2022 年以估计 $2.8 billion 估值融资超过
              $500M，资本资源远超 Tekever。不过，Shield AI 商业重心主要是美国 DoD 和美国盟军，在欧洲民用海事存在有限。Anduril 的 Ghost-X 自主 UAS 和 Lattice OS AI
              指挥平台与 Tekever 的 AI 优先路径在理念上接近，但任务不同——主要是巡飞弹、自主拦截器和美国 DoD 战场管理——而不是欧洲海事 ISR。Anduril 的 $14 billion 估值（截至
              2024）和庞大资本基础，给了它 Tekever 无法匹配的长期 R&D 能力。
