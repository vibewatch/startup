      - number: '6.4'
        title: 扩张路径与合作伙伴 / 渠道模式
        blocks:
          - type: paragraph
            body: >-
              Tekever 的客户扩张策略是主权优先：先通过政府采购关系进入市场，再借这些部署形成的作业验证赢得相邻政府客户；在直接主权采购困难或缓慢的市场，选择性使用渠道伙伴（如 Nigeria 的 Aerial
              Robotix）。这种模式能带来高价值、嵌入机构流程的客户关系，但代价是获客周期慢、客户数量相对合同价值偏少，并且高度依赖少数主权项目承诺。


              基于 €100 million 投资承诺和 Cahors 工业设施，France 是近期最可信的扩张机会；但 France MOD 或 DGA 客户合同尚未公开披露，因此 France
              更像管线机会，不是当前客户。通过 North Carolina 办公室和 USSOCOM 接触进入 US 市场，显示出争取 US 防务客户关系的野心；但截至 2026，USSOCOM
              演习尚未转化为生产合同。NATO Innovation Fund 背书说明，NATO 成员国防务机构被视为可信的未来客户。


              Nigeria/Aerial Robotix 渠道模式为前沿市场渗透提供了重要模板：本地伙伴承接直接采购关系和作业复杂度，Tekever 提供平台和任务支持。Aerial Robotix
              渠道带来经常性作业任务，而不是一次性演示；在直接主权采购会耗费数年的其他市场，这一模式可以复制。不过，收入可见度和伙伴依赖风险也相应高于直接客户关系。
