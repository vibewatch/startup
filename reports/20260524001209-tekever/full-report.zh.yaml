      - number: '2.4'
        title: 增长驱动、采用约束、矛盾与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              最强增长驱动不是爱好者或巡检无人机的采用，而是欧洲转向再武装、主权供应链和 C4ISR 密集支出。SIPRI、McKinsey、与 EDA 有关的报道和 Strategy&
              都指向同一方向：防务预算扩张，装备采购急剧上升，ISR 密集型类别增速快于整体防务支出。具备欧洲或 ITAR-light 能力、海事场景匹配、并能接入指挥工作流的供应商应当受益。Tekever 靠 AR5
              海事巡逻、边境监视、搜救和英国协同防务项目，异常贴合这个需求模式。约束同样真实。Bruegel 强调长期碎片化和联合采购不足；European Parliament 和 Belfer
              都强调治理、出口管制和人类控制争论；EASA 加 EUROCONTROL 则显示，BVLOS
              扩张仍取决于指定空域和认证服务，而不只是围绕自主性的宽松叙事。主要分析矛盾在市场规模：面向看似相同地区和时期，公开欧洲估计从 USD 5.0 billion 到 USD 14.74 billion
              跨度很大。因此，核心尽调缺口不是需求是否存在，而是 Tekever 以欧洲为中心的防务 ISR、海事监视和军民两用服务组合究竟能服务多少需求。
