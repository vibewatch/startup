  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Tekever 面对的市场不是「所有无人机」。纳入支出是防务、安全和机构预算中的一个子集：采购持久空中情报、监视和侦察；海事巡逻和搜救 UAS 服务；以及可接入主权指挥工作流的自主协同能力。NATO
              的支出定义很重要，因为它明确包含 R&D、军民混合基础设施和联合采购，所以预算池比单纯飞机科目更宽。在这个池子里，Tekever 的公开证据集中在固定翼 ISR、海事态势感知、边境监视和 AI
              赋能的协同防务任务，而不是消费、农业或通用巡检工作负载。现实中的现状替代品仍是一组组合：有人巡逻机、直升机、载人海岸警卫出动、纯卫星任务分配和存量 UAV 机队。Tekever
              的楔子是持久性和软件定义感知：AR5 定位于海事巡逻、搜救和边境监视；OVERMATCH 和 StormShroud
              的公开项目证据则把公司接到自主协同防务工作流。因此，本章边界足够宽，能纳入军民两用海事服务；也足够窄，不会把无关无人机类别塞进来抬高 TAM。
