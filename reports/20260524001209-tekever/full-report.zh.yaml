  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台组合 — AR3 EVO、AR5 与 ARX
        blocks:
          - type: paragraph
            body: >-
              Tekever 的无人机硬件组合横跨三代平台，分别瞄准不同的任务续航、载荷等级和客户群。AR3 Evolution（AR3 EVO）在 September 2025 的 DSEI 亮相，是公司面向陆上与海上
              ISR 市场的旗舰战术 UAS。它的最大起飞重量为 25 kg（VTOL 构型最高 30 kg），载荷能力 6 kg，固定翼模式最长 22 hours、VTOL 模式 14 hours，巡航速度 46
              knots，通信距离最高 230 km。机体很紧凑——翼展 4.2 m、长度 1.96 m——从运输箱到起飞准备不到五分钟，操作员五天即可完成训练。AR3 EVO
              采用双部署系统：弹射起飞换取优化后的固定翼续航，精确 VTOL 则适配受限或移动环境，例如小至五米见方的舰船甲板。这种舰载能力是 AR3 前代型号没有的，显著打开了海军和海岸警卫队市场；CEO Ricardo
              Mendes 也把它描述为对 Ukraine 前线作战反馈的直接回应。


              AR5 是 Tekever 专为长航时海上监视打造的平台。它是双发动机、中空固定翼 UAS，翼展 7.3 m，MTOW 180 kg，载荷能力 50 kg，续航约 20 hours（按 Viasat
              合作公告，搭载 GAMASAR SAR 的构型为 12 hours）。AR5 可在未铺装跑道上自动起降（ATOL），配备 Viasat 宽带 SATCOM 后作战半径可超过 1,000 km。关键在于，AR5 是
              ITAR-free，因而能进入原本会受到 US-origin 硬件限制的市场。AR5 可同时搭载 EO/IR 云台、AIS 接收机、SAR、海事雷达、EPIRB，以及 LifeSaver 救生筏投放能力，是
              Tekever 机队中载荷密度最高的平台。自 2017 起，AR5 一直是 EMSA 欧洲海上监视框架的首选平台，最近一次对应 €30 million 合同。


              ARX 是最新、概念上也最激进的平台，在 Xponential 2024 发布。它的核心特征是在飞行中部署并协调一群小型无人机，把 ISR 覆盖面扩到单一大型平台无法达到的范围。ARX 把 Tekever
              推入有人-无人协同和忠诚僚机赛道；May 2026，Tekever 入选 Project NYX，为 British Army 开发与 Apache 直升机协同的旋翼忠诚僚机平台，进一步验证了这一市场。ARX
              的完整技术规格仍有部分未披露，这与它相较 AR3 EVO 和 AR5 仍处早期的状态一致。
