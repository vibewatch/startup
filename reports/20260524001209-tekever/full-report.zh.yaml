      - number: '1.3'
        title: 融资历史、估值与投资人地图
        blocks:
          - type: paragraph
            body: >-
              Tekever 的资本史现在分成两个清晰阶段：2024 年末 Series B 引入战略机构资本；随后 May 2025 的独角兽确认轮把估值重设到 £1 billion 以上。Series B 为 €70
              million，由 Baillie Gifford（Airbnb、Spotify、SpaceX 早期支持者）和 NATO Innovation Fund（代表全部 24 个 NATO
              盟国）领投，NSSIF、Crescent Cove、Iberis Semper 和 Cedrus Capital 参投。The Growth Stage 和 Houlihan Lokey 在该过程中担任公司顾问。


              独角兽轮于 May 2025 随 OVERMATCH 项目一同宣布，由 Ventura Capital 牵头的现有投资人足额认购，Baillie Gifford、NATO Innovation
              Fund、Iberis Capital 和 Crescent Cove 继续支持。该轮确认估值超过 £1 billion，使 Tekever 成为葡萄牙第七家独角兽。多家独立来源交叉印证这一里程碑，包括
              tech.eu、TechFundingNews、econews.pt、NSSIF 案例研究，以及 NATO Innovation Fund 自己的新闻稿。


              以公司阶段和所在地看，投资人质量很突出。Baillie Gifford（长期公共市场和成长股权）、NATO Innovation Fund（多国政府战略对齐）、NSSIF（英国政府国家安全使命）和
              Crescent Cove（Silicon Valley 防务专长）的组合，让 Tekever 拥有罕见的战略支撑网络。Ventura Capital
              称其商业模式「独特盈利且可持续」，这是强烈的公司口径信号；但没有审计财务，外部无法独立验证。
