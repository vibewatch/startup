      - number: '4.4'
        title: 财务结论：牵引信号强，但结构性不透明且存在 capex 依赖风险
        blocks:
          - type: paragraph
            body: >-
              Tekever 财务质量的正向判断靠四根支柱撑住。第一，Baillie Gifford（全球最有声誉的长周期成长投资者之一）
              关于盈利能力的说法本身可信，且多份独立融资沟通中的表述一致；按私营公司标准看，「盈利且增长」这条叙事的信号强度不寻常。第二，可见合同斩获的规模——€30M EMSA、€5M Spain MOI、~£270M
              UK-Ukraine 累计采购，加上未披露的 OVERMATCH 费用——支撑了与盈利说法相匹配的收入体量。第三，软件层 ATLAS
              给以项目制为主的收入加入了经常性元素；只要客户续签服务合同，利润率韧性就有支撑。第四，Barclays 银行押记记录显示公司已成功获得机构债务融资，这是一个正向信用信号。


              反向判断集中在三类风险。资本强度是第一位担忧：Swindon 工厂、Cahors 基地、Wales 培训学校、多条 R&D 计划以及 OVERMATCH 承诺，构成了规模很大且并行推进的基础设施扩张。在不知道
              OVERMATCH 和其他主权项目收入确认节奏的情况下，无法判断经营性现金流能否覆盖投资。集中度风险排第二：公开可见收入几乎完全依赖 UK 政府（MoD、RAF、British Army）和 EMSA。向
              Spain、France、Ukraine 的收入多元化仍处早期。UK 防务采购优先级一旦变化，影响会被放大。第三，AAIB 事件记录，以及任何 UAS
              平台规模化后固有的可靠性风险，都会给支持与质保成本留下尾部风险。


              财务结论是，Tekever 在公开材料中呈现出的财务健康证据，明显强于多数已到独角兽阶段的欧洲防务初创企业；但私营公司的不透明度仍然挡住了标准财务尽调。2023 和 2024 审计账目已提交 Companies
              House，但公开渠道没有可读版本。正式投资人资料室 申请应能拿到经审计 P&L、资产负债表、EBITDA、现金转换、应收账款天数，以及完整的 Barclays 授信安排。
