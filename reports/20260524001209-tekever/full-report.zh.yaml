      - number: '4.3'
        title: 成本结构、capex 驱动与利润率可见度
        blocks:
          - type: paragraph
            body: >-
              Tekever 的成本结构反映出一家兼具硬件和软件的防务公司，同时有显著制造野心。即便没有审计账目，主要成本驱动仍可识别。R&D 支出是 Series B 募资的主要声明用途，融资明确用于产品创新、增强现有
              UAS 平台并开发新产品线。产能爬坡是第二大驱动：Swindon 工厂（254,000 sq ft）是英国规划中最大的无人机生产设施，代表多年期固定资产建设。法国 Cahors 工业基地（2025 年宣布，计划在
              summer 2026 前启动运营）增加了第二个主要制造布局。West Wales Airport UAS Training School 自 January 2026
              起运营，构成第三项基础设施承诺。合在一起，OVERMATCH、法国和威尔士 所隐含的基础设施支出，符合一家在收入之前大举投资的公司画像。


              软件组件——ATLAS AI 平台——与硬件成本曲线完全不同。ATLAS 一旦开发完成，每增加一个客户的边际成本相对较低，这是正向利润率动态。Spain MOI 合同明确把 ATLAS
              平台访问权与硬件和培训放在一起，暗示软件并未单独定价，而是打包进系统交付。EMSA 合同聚焦 AR5 硬件和任务运营。两份合同均未披露毛利率、贡献利润率或软件附加率。


              AAIB 于 October 2021 发布的调查报告记录了 Tekever AR5 Evolution Mk 2（注册号 G-TEKV）在 December 2020 于 Kent
              上空发生双发动机停机。外部飞手安全回收了飞机；Tekever 在系统复飞前采取了硬件和软件安全措施。该事件在财务上重要，因为它是 AR5
              平台服役可靠性风险最可见的公开证据。任何重大可靠性问题都会推高支持成本、维护责任，并增加 EMSA
              等机构客户的声誉风险。公司的安全动作似乎已经解决了这一具体失效模式，但该事件建立了平台安全事件的公开记录，未来买方和投资人应继续追问。


              May 2026 的 Project NYX 公告确认，英国 Ministry of Defence 将向四家行业伙伴（包括 Tekever）投入 £10 million，用于开发 Apache
              忠诚僚机无人机设计。这是开发项目，而非生产合同，代表 UK MoD 参与度增量，而不是大型收入事件。RAF 对 StormShroud AR3 无人机追加 £19 million 投资（与独角兽轮同在 May
              2025 宣布）是更直接的收入信号，也说明 MoD 愿意在最初 StormShroud 项目之外继续投入预算。
