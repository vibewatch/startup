              - CP035
          - type: callout
            title: EMSA 和英国 OVERMATCH 客户集中度带来实质收入风险
            body: >-
              Tekever 两个公开披露的合同锚——EMSA 框架（约 €30M）和英国 OVERMATCH（£400M /
              五年）——代表其公开已知收入管线的主导部分。没有其他客户或合同金额被公开披露。这种双客户集中度带来实质风险：EMSA 在竞争性重新招标中流失，或 UK OVERMATCH 里程碑履约不足触发终止条款，都会显著影响
              Tekever 财务位置。EMSA 合同遵循 EU 采购规则，续约需要竞争性招标；Schiebel 和 AeroVironment
              都有技术能力提交合格投标。要合理承销当前估值，尽调必须先确认完整客户收入分布、续约概率，以及英国 OVERMATCH 履约条件结构。
            calloutType: risk
            claimRefs:
              - CP016
              - CP017
              - CP023
              - CP024
              - CP029
          - type: callout
            title: 欧洲监管对齐是 Tekever 最耐久、也最被低估的护城河
            body: >-
              在 Tekever 所有竞争差异化中，EU 注册地监管对齐——叠加 EMSA 认证和 EDA 资金资格——是美国竞争对手（AeroVironment、Shield AI、Anduril、General
              Atomics）不改注册地 或联盟身份就很难复制的护城河。美国 ITAR 限制在 EU 民用和防务项目中设置了真实采购壁垒。即便 Elbit（以色列）和 Baykar（土耳其）也面对 EDA 参与约束，而
              Tekever 没有。只要 EU 成员国在防务项目中继续优先考虑欧洲工业参与——这一趋势自 2022 年以来加速——Tekever 的葡萄牙-英国双注册地和 EMSA 认证，就构成一条独立于产品表现的护城河。与
              AI 或实战验证差异化相比，这道监管护城河讨论得更少，但在 EU 采购周期中可能更耐久。风险在政治端：如果 EU 成员国为填补紧急能力缺口而降低工业参与规则优先级，监管优势会部分侵蚀。
            calloutType: insight
            claimRefs:
