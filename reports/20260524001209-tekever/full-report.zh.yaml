  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 从市场证据、产品验证、融资和风险因素到中等置信度观察建议的证据链。
    data:
      nodes:
        - id: n1
          label: 市场验证
          detail: 主权需求已确认：EMSA €30M + OVERMATCH £400M 框架 + 法国 €100M
        - id: n2
          label: 产品验证
          detail: 乌克兰 10,000+ 战斗小时；RAF Stormshroud；Project NYX 入选
        - id: n3
          label: 收入不确定性
          detail: 无审计账目；OVERMATCH 是框架上限，不是订单簿
        - id: n4
          label: 股权结构表不透明
          detail: 优先股堆叠、稀释、反稀释条款未披露
        - id: n5
          label: 可比估值
          detail: £1B+ = 估计收入的 12–20×；较 AVAV 7–9× 偏高；与 Anduril 20–25× 一致
        - id: n6
          label: 关键人风险
          detail: 创始人兼 CEO Ricardo Mendes 撑起主权关系和项目可信度
        - id: n7
          label: 建议
          detail: 中等置信度下观察。买入需要审计收入、OVERMATCH 提款数据、股权结构表透明度
        - id: n8
          label: 投资逻辑破裂监测项
          detail: OVERMATCH 取消；CEO 离任；降价融资；到 2026 年底仍无账目
      edges:
        - from: n1
          to: n7
          label: 支撑乐观情景
        - from: n2
          to: n7
          label: 差异化因素
        - from: n3
          to: n7
          label: 压低置信度
