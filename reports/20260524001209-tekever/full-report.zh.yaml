      - number: '6.3'
        title: 留存、合同韧性与客户健康信号
        blocks:
          - type: paragraph
            body: >-
              Tekever 不披露任何板块的 NRR、GRR 或流失率。留存只能从隐含信号判断——这些信号都不如披露留存指标有力，但其中几项仍有意义。对 EMSA
              而言，九年连续生产部署且没有记录在案的不续约，是组合中最持久的隐含留存证据。EMSA 框架结构通过多个 EU 成员国 作业的订单调用合同形成经常性收入，并在不同国家场景中复制；单个不续约更难完全终止这段关系。


              UK MOD 的 OVERMATCH 框架提供结构性留存保障：五年、£400 million 承诺，采用年度项目审查，而不是逐年采购决策。OVERMATCH
              不保证完全按合同节奏部署，但多年期承诺相较单年合同，显著降低了逐年续约风险。公开信源中没有记录 Tekever 任何合同终止或试点转不成合同的案例。


              缺少披露指标本身就是反向信号。客户满意度、试点到生产转化率、合同续约年限和 NRR，都是高增长防务技术公司常见 KPI；公开沟通中缺席这些指标，限制了独立尽调。UK 防务采购不透明（StormShroud
              属敏感项目分类）进一步压缩了可披露范围。对 EMSA 而言，EU 采购规则要求每轮框架周期重新竞争招标，形成结构上高于双边主权合同的续约风险。
