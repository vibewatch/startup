      - number: '7.4'
        title: 供应链与零部件采购风险
        blocks:
          - type: paragraph
            body: >-
              军用级 ISR 无人机集成电光传感器、GNSS 模块、数据链系统和专用处理器，而这些部件本身也受制造国出口管制。Tekever 的 AR3 Evo 多传感器套件——包括电光、红外、SAR 和 SIGINT
              载荷——每一种载荷类型都需要专业分包商，放大单一来源风险。经过 Ukraine 战场检验的供应链，是在战时权宜条件下运转，速度压过结构化采购纪律；转向 Swindon
              的结构化工厂扩产后，会暴露冲突区作业没有显现的物流和质量管理脆弱点。SIPRI 的 2026 分析确认，相对当前再武装需求，欧洲 防务工业产能受限，电光和半导体级部件交付周期正在拉长。US NDAA
              Section 889 对防务系统中中国来源组件的限制，会在 Tekever 当前供应链包含受控中国制造 电子件时制造重新设计和重新认证风险。Tekever
              供应链按组件来源和受控货物分类的构成并不公开，无法独立评估 de minimis 暴露或 NDAA 来源风险——这是本章识别出的最大信息缺口。
            claimRefs:
              - CR017
