      - number: '3.4'
        title: 出口市场挑战者与欧洲同业
        blocks:
          - type: paragraph
            body: >-
              Baykar 的 Bayraktar TB2 是 Tekever 在欧洲出口市场面对的最具作战意义、也最有价格颠覆性的竞争对手。TB2 估计单机成本约 $5 million（含地面系统），价格低于 General
              Atomics 和 Elbit，同时提供经实战验证、27 小时 航时的中空平台。截至 2025–2026，超过 30 个国家运营 TB2，包括 EU NATO 成员波兰、拉脱维亚和 阿尔巴尼亚——这些地理市场都与
              Tekever AR5 竞争。土耳其在 2022–2024 的地缘政治中立姿态让部分 NATO 成员在采购上犹豫，但平台在乌克兰战争中的记录维持了需求。TB2 在海事 ISR——Tekever
              主场——的主要限制，是中空剖面和基于地面的 EO 传感器套件；与 Tekever 的 ATLAS 集成 AR5 海事平台相比，它对海岸和海洋巡逻的优化较弱。不过，在 Tekever AR3 EVO 竞争的陆基战术
              ISR 场景，TB2 经战斗验证的自主能力和更低单位经济性形成真实竞争压力。Schiebel 的 Camcopter S-100 是欧洲海事 ISR 中最接近 Tekever 的直接类比。S-100
              是奥地利制造的 VTOL 直升机式 UAS，10+ 小时 航时，约 50 kg 载荷，已在全球 14+ 支海军服役。Schiebel 的 VTOL 架构适合舰载发射作业，而 Tekever 的固定翼 AR5
              无法服务这类作业，在舰艇集成层面形成有意义的产品差异。Tekever 的 AR5 更适合陆基海岸发射和更长的沿海转场任务。更广泛的欧洲同业中，EU 资助的
              Eurodrone（Airbus/Leonardo/Dassault/ Indra 联盟）是瞄准 40 小时航时的 MALE 级项目，但截至 2026 年仍在开发，并不是已部署的竞争威胁。Tekever
              的欧洲注册地、EMSA 批准和乌克兰作战记录，建立了一个有意义的可信度差距，非欧洲竞争者很难快速缩小。
