      - number: '7.3'
        title: UK 与 France 制造落地风险
        blocks:
          - type: paragraph
            body: >-
              Swindon 和 Cahors 同时新建绿地工厂，是近期最具体的执行风险。Swindon 工厂是绿地开发：截至 May 2026，没有公开证据显示其已取得规划许可、开工建设或完成供应链配套。Cahors
              工业基地在 early 2026 亮相，目标是在 summer 2026 前启动运营；对任何需要从零完成监管审批、员工入职和设备调试的新防务制造设施而言，这个时间表都很激进。UK 专用 UAV
              制造的产业产能在结构上受限，Tekever 必须在紧张的 UK 防务劳动力市场中招聘并训练大量技术员工，同时兑现 OVERMATCH 里程碑。Tekever UK 子公司的 Companies House
              申报数据确认，其既有 UK 作业基础设施有限；这也确认 OVERMATCH 交付几乎需要一套全新增量 UK 制造能力。跨境治理复杂度——双国家雇佣法、并行 DGA 与 MoD
              接触、合并财务监督——又增加了执行负担。运营风险登记表记录了这一扩建阶段的主要风险、可能性评级和临时缓释措施。
