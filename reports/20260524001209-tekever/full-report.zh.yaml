      - number: '5.6'
        title: 展项
        blocks:
          - type: callout
            title: 战场打磨的模块化架构，已验证舰载触达
            body: >-
              AR3 EVO 的四支柱模块化（载荷、动力、部署、通信）是在 Ukraine 对抗空域数万作业小时 中打磨出来的，不是在实验室设计、再到靶场测试的方案。2025 年新增的 5×5 m VTOL
              舰载能力，打开了此前这一重量级平台无法进入的海军和海岸警卫队市场。没有欧洲同行公开过同等组合：经实战验证的战术 UAS、集成 SAR，以及自主 GNSS-denied 导航。
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE015
          - type: callout
            title: 自研 GAMASAR SAR 与 VBN 构成真实技术护城河
            body: >-
              Tekever 不是转售第三方 SAR，而是在内部打造 GAMASAR；不是只依赖 GNSS，而是把 Visual-Based Navigation 落地运行。两层自研能力给了 Tekever
              竞争对手无法简单授权获得的技术层。DESIR 计划选择 Tekever 交付 France 主权 SAR 卫星的有源 SAR 天线，验证了 Space 部门在轨道尺度的 RF
              设计可信度，也预示着一条难复制的空天融合 ISR 产品路线图。
            calloutType: strength
            claimRefs:
              - CE010
              - CE011
              - CE015
