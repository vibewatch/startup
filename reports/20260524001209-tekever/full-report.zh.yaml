  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础概览与分层
        blocks:
          - type: paragraph
            body: >-
              截至 2026，Tekever 的客户基础由两个已验证板块和两个新兴板块支撑。核心生产板块是主权防务，由 UK Ministry of Defence 牵头，包括 RAF StormShroud
              计划（AR3、电子战）、Project NYX（British Army，下一代自主能力）以及 DSTL 机构合作。OVERMATCH 框架承诺五年 £400 million，是 Tekever
              已披露合同价值中最大的单一客户关系。Ukraine 的 Task Force Kindred 是 UK 主导的计划，在实战中使用 AR3，贡献超过 10,000 已记录飞行小时的作战验证，也进一步加深了 UK
              政府客户关系。


              第二个成熟板块是民用海上监视，由 EMSA 的 €30 million AR5 框架合同牵头。EMSA 至少自 2017 起就是复购客户，是组合中持续时间最长的客户关系。在 EMSA 头部合同之下，Italian
              Coast Guard、Gulf of Genova 港务局等国家海事机构参与了 EMSA 框架下的现场作业部署。Portugal 国家海岸监视机构也是一个本土主权客户。


              国土安全是第三个、规模更小的板块：Spain Ministry of Interior 签署了 €5 million AR3 合同，用于边境巡逻和安全应用，证明 Tekever 能在 UK 和 EMSA
              渠道之外赢得欧洲政府采购。渠道伙伴客户（Nigeria Deep Blue 海域态势感知项目下的 Aerial Robotix）和萌芽中的 US 特种作战 接触（USSOCOM 演习，截至 2026
              无生产合同）补全了客户组合。所有已知客户都是政府或准政府买方；任何板块都没有确认的商业企业或私营部门客户。
            claimRefs:
              - CU018
              - CU028
              - CU036
