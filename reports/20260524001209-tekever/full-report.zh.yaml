  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型与公开牵引：主权合同占主导，多元化有限
        blocks:
          - type: paragraph
            body: >-
              Tekever 公开可见的收入模型几乎完全建立在政府和准政府采购上。公司通过四个可识别渠道创造收入：平台销售（向政府买方销售 AR3 和 AR5
              硬件系统）、服务与支持（与硬件交付打包的多年期维护和培训合同）、情报即服务（ATLAS 软件平台，以及面向边境监视和海事监控的 UAS-as-a-Service 订阅式安排），以及项目交付（OVERMATCH 和
              StormShroud 等长期主权能力建设合同，把硬件、软件和运营支持组合在一起）。


              合同收入最干净的量化证据来自三个主要来源。European Maritime Safety Agency (EMSA) 签署的 AR5 海事监视框架合同价值 €30
              million，初始两年，可延长至最多四年，并供应两套完整系统，每套包含两架 UAS。Spain Ministry of Interior 签署了接近 €5 million 的多用途合同，覆盖 AR3
              系统、附件、相机、ATLAS 平台访问权和最多三年培训，交付期在 2024 至 2025 年。英国政府披露，自 2022 年以来为乌克兰采购 Tekever 平台的总额已约 £270 million，其中包括经
              International Fund for Ukraine 的出资。这三个数据点——EMSA、Spain MOI 和英国乌克兰采购——构成公开合同证据的地板；按欧洲防务创业公司标准，它们已经加总出可观收入基础。


              关键在于，Tekever 自己的 Series B 公告称公司「已经盈利」，Baillie Gifford 投资经理 Chris Evdaimon 也单独称 Tekever
              是「一家快速增长且已经盈利的公司，这在防务、国家安全和航天创业公司中是罕见组合」。独角兽轮领投方 Ventura Capital 称 Tekever
              商业模式「独特盈利且可持续」。这些是公司口径和投资人口径的盈利信号，不是审计账目。不过，盈利说法在多份投资人沟通中保持一致，并进入 Baillie Gifford 面向公众的 Series B
              投资理由，因此权重高于平均水平。
