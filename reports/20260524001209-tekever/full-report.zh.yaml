      - number: '3.5'
        title: 护城河耐久性、转换成本与反向证据
        blocks:
          - type: paragraph
            body: >-
              Tekever 的竞争护城河落在四根支柱上，每根支柱都有具体耐久特征和失效模式。第一，EMSA 框架位置：Tekever 续签 European Maritime Safety Agency UAS
              监视合同，带来多年在位优势。EMSA 采购流程要求展示适航性、海事认证和运营记录——新进入者参赛前必须跨过这些门槛。不过，Baykar、Schiebel 和 AeroVironment
              都具备达标的技术成熟度，也一直活跃在欧洲海事监控采购中。Tekever 对两份主要合同（EMSA 和英国
              OVERMATCH）存在集中度风险：它们是公开披露的主要收入锚，失去任何一份都会对财务画像产生实质影响。第二，乌克兰实战品牌：到 2026 年，没有欧洲同业能匹配 AR3 在现役冲突中的 10,000+
              战斗飞行小时。这一记录让采购机构相信 Tekever 系统能在对抗条件下运行——对于评估战场可用 UAS 的 NATO 和 EU 客户，这是决定性优势。风险在于，这一优势有保质期：如果 Baykar 或
              AeroVironment 在未来冲突中积累可比记录，差异化会收窄。第三，AI 优先平台（ATLAS）：Tekever 的 AI 驱动海事情报层是技术护城河——但资本充足对手也最容易复制。Shield AI 的
              Hivemind 和 Anduril 的 Lattice OS 说明，美国防务科技公司正用大得多的 R&D 资源打造可比自主情报栈。第四，欧洲监管对齐：Tekever 的葡萄牙-英国双足迹和 EMSA
              认证，给了它美国竞争对手难以快速复制的欧洲监管姿态。美国原产系统受 ITAR 限制，为 AeroVironment 和 General Atomics 进入 EU
              项目设置了真实结构性壁垒。反向证据同样重要：Tekever 没有披露经审计收入，客户集中度无法独立验证。英国 OVERMATCH 的 £400M 承诺分五年、且取决于履约，并非保证。批评者指出，Tekever
              独角兽估值主要建立在已承诺而非已交付收入之上。
