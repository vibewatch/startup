            body: >-
              Tekever 的 ATLAS 目标检测和 VBN 系统很可能按 EU AI Act 归为高风险 AI，需要符合性评估、技术文档以及指定公告机构
              审查。公司没有公开披露符合性评估、公告机构接触或合规时间表。对受监管采购客户（EU 机构、NATO 伙伴）而言，不合规可能制造采购阻断，而这些阻断在当前收入和合同管线中并不显性。
