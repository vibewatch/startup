      - number: '8.5'
        title: 退出准备度、投资逻辑破裂触发因素与建议
        blocks:
          - type: paragraph
            body: >-
              Tekever 短期最现实的退出路径有两条：卖给寻求已验证 AI-UAS 能力的主承包商（NATO 市场 Tier 1 或 Tier 2 防务 OEM），或通过老股交易，在更长周期 IPO
              前为早期投资人提供流动性。公开上市理论上可行，但 2028–2029 年之前结构性难度较高：双用途出口管制尽调、LSE 或 Euronext
              上市资格所需的三年或以上审计账目，以及平台爬坡阶段常见的未盈利增长状态，都会形成约束。


              投资逻辑会被三类触发因素打破：（1）OVERMATCH 计划正式取消或缩减范围，导致框架上限减少超过 30 percent，这将同时发出收入风险和运营准备度问题的信号；（2）Ricardo Mendes
              离任且没有可信 CEO 继任者，这会削弱他所承载的主权计划关系；（3）出现低于 £800 million 估值的 down-round 或二级市场交易，说明成熟内部人已重估该资产。第四个较软触发因素，是到
              2026 年底仍没有任何经审计财务披露；那会让估值逻辑完全依赖投资人对公司自称财务数据的信任。


              总体建议是中等置信度下观察，风险评级高。投资逻辑真实且差异化——Tekever 在欧洲主权 UAS 市场拥有独特位置，任何 NATO 阵营竞争对手都难以快速复制。但相对于可独立核验的证据基础，£1
              billion+ 入场价偏紧。转为买入需要三项输入：取得经审计收入，确认每年 £60–80 million 以上的可信基底；厘清 OVERMATCH 前 18
              个月提款时间表；获得足以按当前优先权堆叠建模普通股回报的股权结构表透明度。缺少这些输入，投资人可能为战略叙事付出过高价格，而不是买入一项已验证的创收资产。
