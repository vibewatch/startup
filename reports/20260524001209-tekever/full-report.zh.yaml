      - number: '8.2'
        title: 可比估值与市场基准
        blocks:
          - type: paragraph
            body: >-
              公开防务技术基准给出了 Tekever 估值的外侧边界。AeroVironment（AVAV）是最接近的上市可比公司，2024 财年收入约 $717 million，市值在 $5–6 billion
              区间，对应市销率倍数约 7–9×。Elbit Systems 是 Israel 主导防务电子集团，2024 收入 $6.4 billion，交易估值为 1.5–2×
              收入——反映其规模更大、增长更低。这个分化说明，软件赋能、高增长战术 UAS 业务与多元化主承包商 之间已经分层：投资人定价的是增长速度和软件强度，不只是交付硬件数量。


              私募市场可比进一步放大了软件溢价论点。US 防务 AI 初创企业 Anduril Industries 在 2024 Series E 达到 $14 billion 估值——按估计 $500–700
              million 运行率收入计算约 20–25×，驱动因素是 Lattice OS AI 集成，以及 US Department of Defense 主权客户集中。Shield.AI 凭自主 AI 飞行员技术，在
              2024 Series F 估值约 $2.7 billion。两家公司倍数都明显高于纯硬件同行，因为投资人把 AI 软件飞轮价值和政府项目锁定一起定价。


              套到 Tekever 身上，£1 billion+ 入场估值需要满足三种情景之一：(i) 估计年收入已高于 £80 million，并按 12–15× P/S 倍数定价；(ii) 前瞻估值锚定 OVERMATCH
              完全执行后从第 2 年起每年 £80–100 million 的收入；或 (iii)
              主权买方愿意支付高于可比组倍数的战略控制权溢价。公开证据无法独立验证任何一种情景，因此这个估值只适合能进入私有资料室、用财务数据锚定收入分母的参与者。
