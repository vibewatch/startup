    title: 竞争对手画像表
    enumerationScope:
      coverage: partial
      basis: >-
        Seven primary competitor categories and status-quo substitutes relevant to Tekever's maritime ISR, tactical ISR,
        and AI-autonomous defense mission segments as of May 2026; excludes loitering munitions specialists and airborne
        early warning platforms not directly competing in Tekever's served markets.
    columns:
