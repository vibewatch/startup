      - number: '1.4'
        title: 里程碑、合同与国际扩张
        blocks:
          - type: paragraph
            body: >-
              Tekever 的公开里程碑比大多数同阶段公司更丰富，主要因为乌克兰部署持续产出可验证的作战证明。自 2022 年以来，AR3 通过 Task Force Kindred（英国主导项目）在乌克兰累计超过
              10,000 战斗飞行小时。Tekever 自己的传播和 NATO Innovation Fund 均确认，这些系统帮助摧毁了价值超过 £3 billion 的俄罗斯军事资产，包括两套 S-400
              防空系统。这是公司最强的单一市场差异化主张：在对抗环境中，经同行评审、作战印证的自主 AI 大规模表现。


              在英国，StormShroud 项目把搭载 Leonardo UK BriteStorm 电子战载荷的 AR3 交付给 Royal Air
              Force，从项目启动到交付不到六个月——这是值得注意的政府-工业界交付速度记录。Dstl 支持了能力开发。Project NYX 于 May 2026 入选，把关系延伸到 British
              Army，内容是开发一款忠诚僚机 旋翼平台，与 Apache 直升机协同作战。新的 Bristol Centre for Autonomy and Engineering Hub 与 NYX
              同步宣布。OVERMATCH 项目还宣布将在 Swindon 建新工厂生产 AR3 EVO，英国首相会见 Tekever 管理层以确认承诺。


              英国之外，商业和战略扩张正在提速。€30 million EMSA 框架合同覆盖 AR5 海事监视。€5 million Spanish Ministry of Interior
              合同覆盖边境和海上巡逻。法国方面，€100 million 投资由 Toulouse 和 Cahors 两处设施支撑，Cahors 首批无人机生产目标为 mid-2026，同时 CNES/DGA 已将其选入
              DESIR 主权 SAR 卫星项目。美国方面，首个办公室于 May 2026 在 Fayetteville, North Carolina 开设，并通过 NATO DIANA 展位亮相 SOF
              Week。这轮扩张覆盖英国、葡萄牙、法国、乌克兰、美国和 EMSA；对于一家三年前还只是中期私营 UAS 供应商的公司而言，非常少见。
