chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Tekever's product portfolio is anchored by three UAS hardware platforms — AR3 EVO (tactical, modular, shipborne-capable),
    AR5 (long-endurance maritime fixed-wing), and ARX (loyal-wingman swarm platform) — backed by the ATLAS
    intelligence-as-a-service software stack and proprietary autonomy modules including the GAMASAR SAR radar and
    Visual-Based Navigation (VBN) system. The company's vertically integrated design-and-manufacturing model, battle-proven
    across 10,000+ Ukraine combat hours, is a genuine technical differentiator; key open questions are manufacturing
    capacity constraints, EU AI Act compliance mechanics, and third-party dependency on partners such as IMSAR and Viasat
    for critical payload and SATCOM capabilities.
sections:
  - id: section-platform-portfolio
    title: Platform portfolio — AR3 EVO, AR5, and ARX
    body: >-
      Tekever's unmanned aerial hardware portfolio spans three distinct platform generations, each targeting
      different mission endurance, payload class, and customer segment. The AR3 Evolution (AR3 EVO), unveiled
      at DSEI in September 2025, is the flagship tactical UAS for the company's land and maritime ISR market.
      It carries a maximum take-off weight of 25 kg (up to 30 kg in VTOL configuration), a 6 kg payload
      capacity, endurance of up to 22 hours in fixed-wing mode or 14 hours in VTOL mode, a cruise speed of
      46 knots, and a communications range of up to 230 km. The aircraft is compact — 4.2 m wingspan by 1.96 m
      length — and can be prepared for flight in under five minutes from a transit case, with operator training
      achievable in five days. The AR3 EVO incorporates a dual deployment system: catapult launch for optimised
      fixed-wing endurance, and precision VTOL for confined or mobile environments such as ship decks as small
      as five metres by five metres. This shipborne capability — absent from the AR3's predecessor variants —
      significantly extends the platform's naval and coast-guard market reach and was cited by CEO Ricardo
      Mendes as a direct response to frontline feedback from Ukrainian operations.


      The AR5 is Tekever's purpose-built long-endurance maritime surveillance platform. It is a twin-engine,
      medium-altitude fixed-wing UAS with a 7.3 m wingspan, MTOW of 180 kg, a 50 kg payload capacity, and
      approximately 20 hours of endurance (12 hours in the GAMASAR SAR-equipped configuration, per the Viasat
      partnership announcement). The AR5 operates via automatic take-off and landing (ATOL) from unprepared
      runways and can achieve an operational range beyond 1,000 km when equipped with Viasat broadband SATCOM.
      Critically, the AR5 is ITAR-free, broadening its export eligibility to markets where US-origin hardware
      restrictions would otherwise apply. The AR5 carries simultaneous EO/IR gimbals, AIS receivers, SAR,
      maritime radar, EPIRB, and a LifeSaver life-raft drop capability — making it the most payload-dense
      platform in Tekever's fleet. Since 2017, the AR5 has been the platform of choice for EMSA's European
      maritime surveillance framework, most recently under a €30 million contract.


      The ARX is the newest and most conceptually ambitious platform, unveiled at Xponential 2024. Its defining
      feature is the ability to deploy and coordinate a swarm of smaller drones mid-flight, expanding ISR
      coverage beyond what a single large platform can achieve. ARX positions Tekever in the crewed-uncrewed
      teaming and loyal-wingman segment, a market that was further validated in May 2026 when the company was
      selected for Project NYX to develop a rotary loyal-wingman platform to operate alongside British Army
      Apache helicopters. The ARX's full technical specifications remain partially undisclosed, consistent with
      the product's early-stage status relative to AR3 EVO and AR5.
