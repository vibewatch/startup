  - id: section-autonomy-ai
    title: Autonomy, sensing, and AI technology stack
    body: >-
      Tekever's technical differentiation rests less on the airframes themselves than on the autonomy,
      sensing, and data layers embedded within them. Three modules are central to this claim: the GAMASAR
      synthetic aperture radar, the Visual-Based Navigation (VBN) system, and the ATLAS intelligence
      platform.


      GAMASAR is a SAR radar designed and manufactured by Tekever's own Space division rather than sourced
      from a third party. Originally developed to support aerial and space-based Earth observation, GAMASAR
      is now integrated on both the AR3 EVO and AR5 platforms. Key performance parameters disclosed include
      a dual-side-looking detection range of up to 40 km and all-weather, day-and-night target detection —
      capabilities that make it effective for wide-area maritime surveillance even in the North Atlantic and
      North Sea conditions where EMSA operates. The SAR integration on a sub-200 kg platform is technically
      non-trivial: Tekever addresses this by co-designing GAMASAR with the platform's flight control and
      sensor fusion stack, achieving a level of integration depth that a bolted-on third-party payload could
      not replicate. Tekever's Space division is also developing GAMASAR variants for micro-satellite
      constellations as part of the DESIR programme for CNES and the French DGA, signalling a roadmap
      extension into space-based persistent ISR. When combined with the Ka/Ku-band SATCOM link that delivers
      more than 4 Mbits in BRLOS mode, the AR5+GAMASAR combination offers a persistent, all-weather ISR
      capability that Tekever claims is unmatched in its weight class.


      The Visual-Based Navigation (VBN) system addresses a vulnerability exposed by Ukraine operations:
      GNSS jamming and spoofing. VBN uses AI-powered computer vision and machine learning to extract,
      analyse, and interpret environmental features captured in real time via onboard cameras and sensors.
      These visual cues are processed by edge computing modules — specifically NVIDIA system-on-chip
      hardware — and compared with satellite data to continuously update the platform's three-dimensional
      position and orientation independently of GNSS signals. The system has been operationalised, not merely
      prototyped, and is described as having been validated through actual contested-environment deployments.
      This capability closes a critical gap that limits most competing small tactical UAS when operating in
      electronically contested theatres.


      ATLAS is the software layer that converts raw sensor data into decision-ready intelligence. Designed
      for key decision-makers and management-level staff, ATLAS is browser-based (requiring no software
      installation) and provides three mission phases: pre-mission planning (areas of interest, objectives,
      target designation, approval workflow); during-mission live feed monitoring (video, flight path, object
      identification, environmental overlays including wind and currents); and post-mission review and
      evidence extraction (mission replay, vessel correlation across missions, AIS data cross-reference).
      The platform's AI focuses on object detection, change detection, classification, and tracking. ATLAS
      converts Tekever's hardware platforms from vehicles into an end-to-end intelligence service — which is
      why Tekever frames its business model as Intelligence-as-a-Service rather than UAS hardware sales.
