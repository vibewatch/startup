callouts:
  - calloutType: strength
    title: Battlefield-forged modular architecture with proven shipborne reach
    body: >-
      The AR3 EVO's four-pillar modularity (payloads, propulsion, deployment, comms) was refined through
      tens of thousands of operational hours in Ukraine's contested airspace — not designed in a lab and
      tested on a range. The addition of 5×5 m VTOL shipborne capability in 2025 opens the naval and
      coast-guard market that was previously inaccessible to a platform of this weight class. No
      European peer has published an equivalent combination of combat-proven tactical UAS with
      integrated SAR and autonomous GNSS-denied navigation.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE015
  - calloutType: strength
    title: Proprietary GAMASAR SAR and VBN create genuine technical moat
    body: >-
      Building GAMASAR in-house rather than reselling third-party SAR, and operationalising Visual-Based
      Navigation rather than relying solely on GNSS, gives Tekever two proprietary layers that competitors
      cannot simply license. The DESIR programme selection — delivering the active SAR antenna for France's
      sovereign SAR satellite — validates the Space division's RF design credibility at orbital scale, and
      foreshadows a space-air fused ISR product roadmap that will be difficult to replicate.
    claimRefs:
      - CE010
      - CE011
      - CE015
      - CE016
      - CE027
  - calloutType: risk
    title: Third-party SAR and SATCOM dependencies limit supply resilience
    body: >-
      Despite vertical integration in airframe and software, two mission-critical capabilities — SAR
      (IMSAR NSP-3) and BRLOS SATCOM (Viasat) — depend on US-origin technology vendors. In a defence
      export context or geopolitical stress scenario, US export-control restrictions or vendor prioritisation
      could disrupt Tekever's ability to deliver fully configured platforms. The GAMASAR development
      reduces the IMSAR dependency over time, but Viasat SATCOM replacement would require either a
      European SATCOM alternative or Starlink (which carries its own geopolitical concentration risk).
    claimRefs:
      - CE019
      - CE020
      - CE021
      - CE022
  - calloutType: risk
    title: EU AI Act compliance for high-risk autonomous systems is an open diligence gap
    body: >-
      Tekever's ATLAS object-detection and VBN systems likely qualify as high-risk AI under the EU AI Act,
      requiring conformity assessments, technical documentation, and designated notified-body review.
      No conformity assessment, notified-body engagement, or compliance timeline has been publicly disclosed.
      For regulated procurement customers (EU agencies, NATO partners), non-compliance could create
      procurement blockers that are not visible in the current revenue and contract pipeline.
    claimRefs:
      - CE030
      - CE031
      - CE032
      - CE033

