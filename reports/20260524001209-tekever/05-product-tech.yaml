  - id: section-deployment-workflow
    title: Deployment workflow, mission profiles, and roadmap
    body: >-
      The AR3 EVO's deployment workflow is designed for speed and minimal logistical footprint. From a
      transit case to airborne takes under five minutes. Operator training is achievable in five days,
      significantly below the weeks or months required for legacy military UAS of comparable capability.
      Tekever operates its own drone operator and data-analyst teams, providing an end-to-end managed
      service option where customers receive finished intelligence rather than operating the platform
      themselves. This deployment model has been proven at scale in Ukraine through the UK-led Task Force
      Kindred programme, where the AR3 accumulated more than 10,000 combat flight hours providing ISR
      support in contested airspace.


      Mission profiles span four principal configurations: ISR (EO/IR or HD gimbals, SAR, GMTI, SIGINT,
      tactical datalinks, laser designator); Electronic Attack (directional EW antennas, anti-jamming
      modules, target-specific comms nodes); Communications Relay (mesh radios, SATCOM/LTE, IFF/ADS-B
      transponders); and Maritime Wide-Area Surveillance (EO/IR, AIS receivers, maritime VHF, SAR radar).
      Each mission profile can be configured independently using hot-swappable payload modules, meaning
      a single AR3 EVO airframe can serve different roles on successive sorties with minimal ground time.


      The product roadmap is expanding in two directions simultaneously. Upwards into crewed-uncrewed
      teaming: Project NYX (British Army loyal wingman) requires Tekever to rapidly develop and demonstrate
      a rotary platform to operate alongside Apache helicopters, with a new Tekever Centre for Autonomy
      and Engineering Hub opening in Bristol as part of the OVERMATCH commitment. Downwards into space:
      the DESIR programme tasks Tekever with delivering the active SAR antenna for France's first sovereign
      SAR satellite capability, fusing space-based and air-domain ISR into a multimodal persistent
      surveillance architecture. The Viasat BRLOS partnership and the CNES/DGA DESIR engagement together
      signal that Tekever views space-air data fusion as a core medium-term product direction, not merely
      a research adjacency.
