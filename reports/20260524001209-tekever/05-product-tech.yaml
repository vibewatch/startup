  - id: TE002
    title: Mission workflow and use-case table
    columns:
      - User Job / Mission Profile
      - Current Workflow (Without Tekever)
      - Tekever Solution
      - Measurable Benefit (Company-Claimed)
      - Known Limitation
    rows:
      - - ISR / Intelligence Surveillance Reconnaissance
        - Manned aircraft or static sensors with limited coverage; high crew risk
        - AR3 EVO with EO/IR gimbal, SAR, GMTI, SIGINT, tactical datalink
        - Persistent surveillance 22h+, operates in GNSS-denied environments
        - Payload weight limits in pure VTOL mode; comms range dependent on relay chain
      - - Electronic Attack / Electronic Warfare
        - Dedicated EW aircraft at high cost; limited availability
        - AR3 EVO with directional EW antennas, anti-jamming modules
        - Fast-deployable, low-signature electronic denial from a sub-25 kg platform
        - EW effectiveness range and jamming power not publicly specified
      - - Maritime Wide-Area Surveillance
        - Helicopter or manned patrol aircraft; expensive, limited endurance
        - AR5 with simultaneous EO/IR, SAR, AIS, maritime radar; EMSA operational since 2017
        - 12–20h endurance, 1000+ km range with SATCOM; ITAR-free for broad export
        - Weather degradation of optical sensors; SAR-only mode limits endurance to approx. 12h
      - - Communications Relay in Contested Terrain
        - Satellite comms or terrestrial repeaters — slow to deploy, fixed assets
        - AR3 EVO with mesh network radios, SATCOM/LTE, IFF/ADS-B; airborne relay node
        - Rapid deployment to 5x5m confined spaces, including ship decks, for BVLOS relay
        - Relay capacity limited by SATCOM bandwidth; multiple aircraft needed for wide coverage
      - - Search and Rescue / LifeSaver Drop
        - Manned helicopter; weather-constrained, high crew risk in maritime environment
        - AR5 with LifeSaver life-raft drop capability, EO/IR, AIS, EPIRB
        - Demonstrated in Italian Coast Guard exercise; no crew risk; rapid response
        - Precision drop reliability in high-sea-state conditions not independently validated
    notes: >-
      Benefits are company-claimed from official product pages and news releases unless otherwise noted.
      LifeSaver capability was demonstrated in a Coast Guard exercise (Dronelife, 2024).
