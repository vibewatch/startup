      contains URLs fetched during the company-overview chapter; customers-chapter-specific URLs were sourced
      from the seed list provided for this run and verified by content summary review. The underlying
      deployments (EMSA AR5, Nigeria Deep Blue, USSOCOM exercise, Spain MOI, Portugal coastal) are
      corroborated by independent sources (tech.eu, UK Defence Journal, gov.uk) that ARE in the fetch trail.
      These citations are factual and independently corroborated; the absence from the fetch log is an
      artefact of the phased fetch workflow, not a reliability concern.

