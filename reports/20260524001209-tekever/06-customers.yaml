  - id: section-3
    title: Retention, Contract Durability, and Customer Health Signals
    body: >-
      Tekever does not disclose NRR, GRR, or churn rates for any segment. Retention must be assessed from
      implicit signals — none of which are as strong as disclosed retention metrics, but several of which
      are meaningful. For EMSA, nine years of continuous production deployment without a documented
      non-renewal constitutes the most durable implicit retention evidence in the portfolio. The EMSA
      framework structure — with call-off contracts across multiple EU member state operations — creates
      recurring revenue that is replicated across different national contexts, making it harder for a single
      non-renewal to terminate the relationship entirely.


      The OVERMATCH framework for UK MOD provides structural retention assurance: a five-year, £400 million
      commitment with annual programme reviews rather than year-by-year procurement decisions. OVERMATCH is
      not guaranteed to deploy fully at the contracted pace, but the multi-year nature of the commitment
      substantially reduces year-to-year renewal risk compared to single-year contracts. No contract
      terminations or pilot-to-no-contract transitions have been documented in any public source for Tekever.


      The absence of disclosed metrics is itself an adverse signal. Customer satisfaction scores, pilot-to-
      production conversion rates, contract renewal lengths, and NRR are all standard KPIs for high-growth
      defence technology companies and their absence from public communications limits independent diligence.
      UK defence procurement opacity (due to sensitive programme classification for StormShroud) further
      restricts what can be disclosed. For EMSA, EU procurement rules require competitive re-tendering at each
      framework cycle, creating renewal risk that is structurally higher than a bilateral sovereign contract.
    claimRefs:
      - CU020
      - CU021
      - CU022
      - CU023
      - CU025
      - CU038
    tableRefs:
      - TU004
    figureRefs:
      - FU004

  - id: section-4
    title: Expansion Trajectory and Partner/Channel Model
    body: >-
      Tekever's customer expansion strategy follows a sovereign-first model: enter markets through government
      procurement relationships, use operational proof from those deployments to win adjacent government
      customers, and selectively deploy channel partners (like Aerial Robotix in Nigeria) where direct
      sovereign procurement is difficult or slow. This model produces high-value, institutionally embedded
      customer relationships but at the cost of slow acquisition cycles, small customer counts relative to
      contract value, and heavy dependency on a small number of sovereign programme commitments.


      France represents the most credible near-term expansion opportunity based on the €100 million investment
      commitment and the Cahors industrial facility — but no French MOD or DGA customer contract has been
      publicly disclosed, making France a pipeline prospect rather than a current customer. US market expansion
      through the North Carolina office and USSOCOM engagement signals ambition for a US defence customer
      relationship, but the USSOCOM exercise has not converted to a production contract as of 2026. NATO
      Innovation Fund backing suggests that NATO member state defence authorities are considered credible
      future customers.


      The Nigeria/Aerial Robotix channel model offers an important template for frontier market penetration:
      a local partner absorbs the direct procurement relationship and operational complexity while Tekever
      provides platform and mission support. The Aerial Robotix channel produces recurring operational
      missions (not a one-off demonstration) and can be replicated in other markets where direct sovereign
      procurement would take years. However, the revenue visibility and partner dependency risks are
      correspondingly higher than direct customer relationships.
    claimRefs:
      - CU027
      - CU031
      - CU014
      - CU037
      - CU016
      - CU017
    tableRefs:
      - TU005
    figureRefs:
      - FU002

  - id: section-5
    title: Concentration Risk, Procurement Friction, and Customer Gaps
    body: >-
      The most material customer risk for Tekever is extreme concentration in UK MOD. OVERMATCH at £400 million
      over five years vastly exceeds the combined disclosed value of all other customer contracts (EMSA €30M,
      Spain MOI €5M, Nigeria implied low single-digit millions). If UK defence budget pressures lead to
      programme schedule delays, capability scope reductions, or re-competition of any OVERMATCH element,
      Tekever's revenue base is materially impaired. StormShroud's electronic warfare mission classification
      adds opacity to the programme terms, limiting independent assessment of renewal risk.


      EU procurement friction is the second structural headwind. EMSA's framework contract structure requires
      competitive re-tendering at each cycle under EU procurement directives, creating systematic renewal risk
      that a sovereign bilateral contract would not carry. The 2–5 year procurement timelines typical of EU
      defence and civil security procurement slow expansion into new EU member state customers, even when
      operational proof (EMSA deployments, Italy, Gulf of Genova) already demonstrates capability.


      Critical customer data gaps include: no disclosed revenue by segment or customer; no disclosed NRR or
      GRR for any relationship; no pilot-to-production conversion rate; no customer count by segment; and
      no independent competitive assessment of win/loss rates or customer preference versus alternatives.
      These gaps are typical for a company of Tekever's stage and private status but represent binding
      constraints on independent underwriting of customer health and revenue durability.
    claimRefs:
      - CU019
      - CU026
      - CU024
      - CU025
      - CU029
      - CU035
    tableRefs:
      - TU002
    figureRefs: []

