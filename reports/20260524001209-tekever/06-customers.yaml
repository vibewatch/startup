callouts:
  - id: CU-CALL-01
    calloutType: risk
    title: Extreme UK MOD Customer Concentration
    body: >-
      UK MOD OVERMATCH at £400 million over five years represents the dominant share of Tekever's disclosed
      contract value — vastly exceeding EMSA (€30M), Spain MOI (€5M), and all other combined. If UK defence
      budget pressures delay, reduce, or restructure OVERMATCH, Tekever's revenue base is materially impaired.
      No individual non-UK customer relationship approaches the scale of the OVERMATCH commitment.
    claimRefs:
      - CU019
      - CU026

  - id: CU-CALL-02
    calloutType: strength
    title: Production Proof Across Multiple Segments
    body: >-
      Tekever has converted evaluation and pilot relationships into production across multiple distinct segments:
      RAF StormShroud (formally in service), EMSA maritime (9+ year tenure), Spain MOI (contracted production),
      Nigeria Deep Blue (hardware delivered), and Ukraine combat operations (10,000+ flight hours). This breadth
      of production evidence is unusually strong for a company of Tekever's stage.
    claimRefs:
      - CU001
      - CU006
      - CU010
      - CU015

  - id: CU-CALL-03
    calloutType: risk
    title: EU Procurement Re-Tendering Creates Structural EMSA Renewal Risk
    body: >-
      EMSA's framework contracts are subject to EU competitive tendering requirements under Directive
      2014/24/EU, which mandates open competition at each procurement cycle. Despite 9+ years of service
      continuity, Tekever cannot guarantee EMSA renewal and faces structured competitive exposure at each
      re-tendering event — a risk that bilateral sovereign contracts (like OVERMATCH) do not carry.
    claimRefs:
      - CU038
      - CU024
