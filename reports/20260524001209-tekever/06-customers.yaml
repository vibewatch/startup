company:
  name: Tekever
chapter:
  number: 6
  title: Customers
  letter: U
  summary: >-
    Tekever's customer base is anchored in two high-value segments: sovereign defence (led by UK MOD / RAF under
    the £400 million OVERMATCH programme, with DSTL, British Army Project NYX, and Task Force Kindred in
    Ukraine) and civil maritime surveillance (led by EMSA's €30 million AR5 framework, with Italian Coast Guard,
    Gulf of Genova, and Portuguese national authority deployments). Secondary channels include homeland security
    (Spain Ministry of Interior €5 million AR3 deal), partner-led operations (Aerial Robotix / Nigeria Deep Blue
    Project), and a nascent US special-operations relationship (USSOCOM exercise). Production deployments
    substantially outnumber pilots. Critical gaps include no disclosed revenue by customer, no NRR or contract
    renewal terms publicly available, and extreme concentration in the UK sovereign programme which accounts for
    the majority of disclosed contract value.

