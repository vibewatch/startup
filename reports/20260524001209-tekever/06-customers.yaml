  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: customer-revenue-by-segment
      missingEvidence: >-
        Revenue contribution by customer or segment (UK MOD vs EMSA vs Spain MOI vs Nigeria) is not publicly
        disclosed. Tekever's private status means all revenue allocation is opaque, preventing quantitative
        concentration assessment.
      whyItMatters: >-
        Without segment-level revenue data, concentration risk can only be inferred from contract values, not
        from actual revenue weight. The OVERMATCH headline figure (£400M over 5 years) may overstate realized
        annual revenue if call-off draws are slower than projected.
      diligencePath: >-
        Request management accounts or audited financials via data room; seek segment P&L at minimum; crosscheck
        against Companies House filings for UK subsidiary revenue.
      relatedQuestionRefs:
        - QU023
        - QU024
        - QU018

    - type: private-evidence-only
      severity: material
      topic: retention-NRR-GRR-metrics
      missingEvidence: >-
        No NRR, GRR, churn rate, or renewal conversion data is publicly available for any Tekever customer
        segment. Retention is inferred from multi-year service continuity and absence of reported non-renewals.
      whyItMatters: >-
        Without retention metrics, long-term revenue durability cannot be assessed. Framework contracts (EMSA,
        OVERMATCH) have renewal cycles where competitive re-tendering could displace Tekever.
      diligencePath: >-
        Seek historical contract renewal rates from internal customer success data; request framework call-off
        history from EMSA and UK MOD contacts; model renewal risk scenarios from contract duration data.
      relatedQuestionRefs:
        - QU019
        - QU020
      relatedTableRefs:
        - TU004

    - type: missing-source
      severity: material
      topic: USSOCOM-post-exercise-procurement
      missingEvidence: >-
        No evidence exists for any procurement action by USSOCOM following the 2024 operational exercise.
        Whether the exercise led to a contract, expression of interest, or was a standalone evaluation is
        not publicly documented.
      whyItMatters: >-
        The USSOCOM exercise is a strong proof point for US military capability acceptance but does not
        constitute a customer relationship. Confirming conversion would materially change the US customer
        assessment.
      diligencePath: >-
        Check US federal procurement databases (SAM.gov, USASpending.gov, FPDS) for any Tekever contract
        awards or pending awards with USSOCOM or SOCOM components. Request update directly from Tekever
        management on US pipeline status.
      relatedQuestionRefs:
        - QU012

    - type: private-evidence-only
      severity: minor
      topic: France-sovereign-customer-pipeline
      missingEvidence: >-
        France's stated €100M investment commitment from Tekever and the Cahors facility imply a French defence
        customer relationship in development, but no specific French MOD or DGA contract is publicly disclosed.
      whyItMatters: >-
        France could represent a third major sovereign defence customer after UK and Portugal, substantially
        improving customer diversification. Without contract evidence, France is a pipeline item rather than
        a current customer.
      diligencePath: >-
        Monitor French DGA procurement announcements and Tekever press releases for any French MOD contract
        award. Check French public procurement database (BOAMP) for Tekever tender awards.
      relatedQuestionRefs:
        - QU016

    - type: missing-source
      severity: minor
      topic: EMSA-operational-outcome-metrics
      missingEvidence: >-
        No public data quantifies EMSA AR5 mission outcomes such as coverage area (km²), total flight hours
        logged under the EMSA framework, number of incidents detected or reported, or vessel intercepts. EMSA's
        RPAS service pages confirm deployments but do not publish mission-level performance statistics.
      whyItMatters: >-
        Without quantified operational metrics, "mission success" for the EMSA customer relationship rests on
        service continuity alone. Understanding mission performance would strengthen or challenge the case that
        Tekever is the preferred supplier on competitive re-tendering.
      diligencePath: >-
        Request EMSA THETIS service logs or RPAS mission performance summaries directly from Tekever; check
        EMSA annual reports for RPAS fleet performance data; review EU Maritime Safety Committee publications
        for deployment volume statistics.
      relatedQuestionRefs:
        - QU015

sections:
  - id: section-1
    title: Customer Base Overview and Segmentation
    body: >-
      Tekever's customer base as of 2026 is anchored in two proven segments and two emerging ones. The primary
      production segment is sovereign defence, led by the UK Ministry of Defence through the RAF StormShroud
      programme (AR3, electronic warfare), Project NYX (British Army, next-generation autonomous capability), and
      the DSTL institutional collaboration. The OVERMATCH framework — £400 million committed over five years — is
      the largest single customer relationship by disclosed contract value in Tekever's portfolio. Ukraine's Task
      Force Kindred, a UK-led programme operating AR3 in active combat, contributes over 10,000 documented flight
      hours of operational proof and further deepens the UK government customer relationship.


      The second established segment is civil maritime surveillance, led by EMSA's €30 million AR5 framework
      contract. EMSA has been a recurring customer since at least 2017, making it the longest-tenure customer
      relationship in the portfolio. Below the EMSA headline, national maritime authorities including the Italian
      Coast Guard and Gulf of Genova port authority have participated in live operational deployments under the
      EMSA framework. Portugal's national coastal surveillance authority is an additional domestic sovereign
      customer.


      Homeland security represents the third, smaller segment: Spain's Ministry of Interior signed a €5 million
      AR3 contract for border patrol and security applications, confirming that Tekever can win European
      government procurement beyond the UK and the EMSA channel. Partner-channel customers (Aerial Robotix in
      Nigeria under the Deep Blue maritime domain awareness project) and a nascent US special operations
      engagement (USSOCOM exercise, no production contract as of 2026) round out the portfolio. All known
      customers are government or quasi-government buyers — there are no confirmed commercial enterprise
      or private-sector customers across any segment.
    claimRefs:
      - CU018
      - CU028
      - CU036
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: section-2
    title: Named Customer Proof — Production Status and Outcome Evidence
    body: >-
      The strongest customer-proof evidence in Tekever's portfolio is the RAF StormShroud programme. The UK
      Prime Minister's official press statement, DSTL's formal announcement, and independent UK Defence Journal
      reporting all confirm that StormShroud has entered active RAF service — not evaluation, not pilot, but
      formal operational service. This triple-source corroboration across government press office, defence
      laboratory, and specialist media constitutes the gold standard of customer proof in the defence sector.
      Project NYX (British Army) is a development contract rather than a production deployment, but still
      demonstrates a second UK MOD service branch as an active paying customer.


      The EMSA maritime surveillance relationship is the longest-dated. The AR5 has been in EMSA operational
      service since 2017 — nine years of continuous production deployment documented across multiple renewals
      and mission announcements. The Italian Coast Guard's participation in EMSA-led SAR exercises and the
      Gulf of Genova operational surveillance missions confirm that the EMSA relationship translates into
      real operational outputs, not just framework agreements. EMSA's official THETIS service records provide
      independent regulatory-tier corroboration.


      Nigeria's Deep Blue Project resulted in a physical hardware delivery of AR3 systems to the Nigerian Navy
      — not a letter of intent or a pilot, but a completed delivery. The Aerial Robotix partnership extended
      this into sustained operational monitoring missions for critical infrastructure. Spain's Ministry of
      Interior €5 million contract confirms homeland security as a separate production revenue category.
      USSOCOM's operational exercise completed successfully but has not yet resulted in a production contract
      or disclosed expression of intent to procure.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU006
      - CU007
      - CU008
      - CU009
      - CU010
      - CU015
      - CU016
