      Risk ratings (HIGH/MEDIUM/POSITIVE) are qualitative assessments based on available public evidence.
      Revenue impact estimates for UK MOD concentration risk are illustrative; actual impact depends on
      programme structure and call-off commitments not publicly disclosed.

figures:
  - id: FU001
    title: Customer journey map — Tekever sovereign and maritime customer segments
    type: journey-map
    summary: >-
      Illustrates the distinct procurement-to-production paths for UK defence, EMSA maritime, homeland
      security, partner/channel, and nascent US special operations customers.
    data:
      items:
        - id: stage-sovereign-procurement
          label: Sovereign Procurement Engagement
          actor: UK MOD, Spain MOI, Portugal national authority
          description: >-
            Government defence and security procurement authority engages Tekever through formal tender,
            framework agreement (OVERMATCH, EMSA), or direct award. UK MOD is the most advanced — multiple
            concurrent programmes (StormShroud, Project NYX, OVERMATCH). Spain MOI entered via competitive
            tender for border patrol. Portugal engages directly as home-market sovereign customer.
          channels:
            - UK MOD OVERMATCH framework
            - EMSA competitive tender under EU procurement directives
            - Direct sovereign procurement
        - id: stage-pilot-evaluation
          label: Operational Evaluation or Pilot
          actor: Defence evaluators, DSTL, NATO partners
          description: >-
            Most Tekever defence customer engagements include an evaluation or exercise phase before
            production commitment. USSOCOM completed an operational exercise (still in this stage). Project NYX
            is a development contract (evaluation of next-gen concepts). StormShroud has transitioned past this
            stage to production service.
          channels:
            - Controlled military exercises (USSOCOM)
            - Development contracts (Project NYX)
            - NATO DIANA evaluation network
        - id: stage-production-deployment
          label: Production / Operational Service
          actor: RAF operators, EMSA maritime authorities, coast guards
          description: >-
            Production customers operate Tekever platforms in their primary missions. StormShroud enters RAF
            service for electronic warfare. EMSA deploys AR5 across EU member states. Italy Coast Guard uses
            AR5 in SAR. Spain MOI deploys AR3 for border patrol. Nigeria Navy receives AR3 hardware.
          channels:
            - RAF electronic warfare operations
            - EMSA maritime surveillance service
            - Nigeria Navy Deep Blue maritime domain awareness
        - id: stage-expansion-deepening
          label: Expansion / Programme Deepening
          actor: Programme managers, Tekever account team
          description: >-
            Production customers expand programme scope, add platforms, or deploy to new geographies.
            OVERMATCH provides a multi-year framework for this. EMSA service has expanded geographically
            across multiple EU member states. Nigeria expanded from initial delivery to recurring Aerial Robotix
            operations.
          channels:
            - OVERMATCH call-off expansion
            - EMSA framework call-off across member states
            - Channel partner mission expansion (Aerial Robotix)
        - id: stage-renewal-retention
          label: Framework Renewal / Retention
          actor: Procurement authorities, UK MOD programme managers
          description: >-
            Framework contracts (EMSA, OVERMATCH) require renewal or re-tendering at defined cycle points.
            EMSA framework renewal is subject to EU competitive procurement rules. OVERMATCH's five-year
            structure reduces renewal frequency. No documented non-renewal across any segment.
          channels:
            - EU procurement re-tendering (EMSA)
            - OVERMATCH programme review (UK MOD)
            - Bilateral sovereign relationship management
