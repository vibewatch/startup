        Request approved supplier list with export-control classifications, identify
        single-source dependencies and NDAA-origin status, and request current
        headcount by site plus planned hiring schedule through 2027.
      relatedQuestionRefs: [QR022, QR024]
      relatedTableRefs: [TR001]

sections:
  - id: R-S01
    title: Export Controls, Sanctions, and End-Use Compliance
    body: >-
      Tekever operates at the intersection of three distinct export-control regimes —
      UK ECJU, EU dual-use regulation 2021/821, and potentially US EAR — while deploying
      systems in active conflict. The AR3 and AR5 are military-grade UAS classified under
      the UK Military List; every export to a non-UK destination requires a Standard
      Individual Export Licence or coverage under an Open General Export Licence. The
      current Ukraine deployment under Task Force Kindred is the most acute compliance
      flashpoint: ECJU imposes mandatory end-use monitoring obligations requiring Tekever
      to verify that supplied systems are not re-transferred to prohibited end-users. The
      Taiwan APEX partnership introduces a further jurisdictional exposure — Taiwan is not
      prohibited under current UK controls, but geopolitical events could rapidly change
      this status. US EAR de minimis thresholds may apply if US-origin controlled
      components exceed 25% by value in any single sub-system. Post-Brexit divergence
      between UK and EU controls means Tekever must maintain parallel compliance programmes
      for UK and French operations, doubling administrative overhead and creating
      reconciliation risk between two partially divergent classification frameworks. No
      public evidence of enforcement action has been identified, but the internal depth of
      Tekever's compliance programme cannot be assessed from public sources.
    claimRefs: [CR001, CR002, CR003, CR004, CR005, CR006]
    tableRefs: [TR001]

  - id: R-S02
    title: Defence Procurement Concentration and Customer Dependency
    body: >-
      OVERMATCH is the defining strategic risk for Tekever investors. The £400M five-year
      programme was announced simultaneously with the unicorn valuation, making the two
      structurally inseparable: a material programme reduction would directly impair the
      investment thesis. EMSA's AR5 framework agreement is the second confirmed revenue
      pillar, but its disclosed value is materially smaller. Customer concentration in a
      single UK government programme is at the high end of the risk spectrum for a
      defence-tech company at this stage. Historical UK MoD procurement demonstrates that
      long-duration contracts can be restructured: spending reviews in 2010 and 2015 both
      involved significant uncrewed aircraft programme changes. OVERMATCH benefits from
      meaningful political protection — it was endorsed at Prime Minister level and
      positioned as a domestic industrial policy success — which raises the political cost
      of cancellation but does not eliminate it. Tekever's QinetiQ strategic MOU provides
      additional capability development relationships, but neither the MOU value nor any
      alternative revenue source has been disclosed at a level that would offset OVERMATCH
      exposure. The dependency map illustrates revenue and capability linkages and the
      primary risk transmission paths from programme disruption to financial impairment.
    claimRefs: [CR007, CR008, CR009, CR010, CR011, CR033, CR037]
    tableRefs: [TR003]
    figureRefs: [FR003]

  - id: R-S03
    title: UK and France Manufacturing Execution Risk
    body: >-
      Simultaneous greenfield factory buildouts in Swindon and Cahors represent the most
      concrete near-term execution risk. The Swindon factory is a greenfield development:
      as of May 2026, no public evidence of planning permissions, construction commencement,
      or supply-chain fit-out has been identified. The Cahors industrial site was unveiled
      in early 2026 with an ambitious operational start-up target ahead of summer 2026 —
      a timeline that is aggressive for any new defence manufacturing facility requiring
      regulatory approval, workforce onboarding, and equipment commissioning from scratch.
      UK industrial capacity for specialised UAV manufacture is structurally constrained,
      and Tekever must recruit and train a significant technical workforce in a tight UK
      defence labour market while delivering against OVERMATCH milestones. Companies House
      filing data for Tekever's UK subsidiary confirms limited pre-existing UK operational
      infrastructure, confirming that OVERMATCH delivery requires an almost entirely net-new
      UK manufacturing capability. Cross-border governance complexity — dual-country
      employment law, parallel DGA and MoD engagement, consolidated financial oversight —
      adds additional execution overhead. The operational risk register captures the
      principal risks, likelihood ratings, and interim mitigations for this buildout phase.
    claimRefs: [CR012, CR013, CR014, CR015, CR016]
    tableRefs: [TR002]

  - id: R-S04
    title: Supply Chain and Component Sourcing Risk
    body: >-
      Military-grade ISR drones integrate electro-optical sensors, GNSS modules, datalink
      systems, and purpose-built processors that are themselves export-controlled in their
      countries of manufacture. Tekever's AR3 Evo multi-sensor suite — including
      electro-optical, infrared, SAR, and SIGINT payloads — requires specialist
      sub-contractors for each payload type, compounding single-source risk. The
      battle-tested Ukraine supply chain operated under wartime expedient conditions
      where speed outweighed structured procurement discipline; transitioning to structured
      factory scaling at Swindon will expose logistics and quality-management vulnerabilities
      that conflict-zone operations did not surface. SIPRI's 2026 analysis confirms that
      European defence industrial capacity is constrained relative to current rearmament
      demand, with component delivery timelines extending for electro-optical and
      semiconductor-class items. US NDAA Section 889 restrictions on Chinese-origin
      components in defence systems create a redesign and re-certification risk if
      Tekever's current supply chain includes controlled Chinese-manufactured electronics.
      The composition of Tekever's supply chain by component origin and controlled-goods
      classification is not publicly available, preventing independent assessment of de
      minimis exposure or NDAA-origin risk — this is the most significant information gap
      identified in this chapter.
    claimRefs: [CR017, CR018, CR019, CR020, CR021]

  - id: R-S05
    title: Regulatory, Legal, Safety, and Privacy Risk
    body: >-
      Beyond export controls, Tekever faces a distinct cluster of regulatory and legal
      risks spanning EASA certification, autonomous systems accountability, and GDPR
      data-processor obligations. Every AR5 maritime surveillance deployment across EU
      member state airspace requires EASA Specific-category Operational Authorisation under
      the SORA framework, with each jurisdiction requiring a separate safety case. The
      European Parliament's 2025 research brief reflects a live EU legislative debate that
      could impose retroactive human-in-the-loop requirements on AI-enabled military drone
      systems within Tekever's OVERMATCH delivery timeline. UK Parliament defence committees
      are engaged in parallel debate. The most acute legal risk is civilian harm attribution:
      AR3 systems are documented as contributing to destruction of Russian military assets
      in Ukraine. Any future international investigation attributing civilian harm to a
      Tekever platform — however remote given documented protocols — would trigger
      regulatory suspension of export licences, loss of EMSA contracts, and sustained
      reputational contagion. GDPR data-processor obligations apply to EMSA operations
      where surveillance imagery captures personal data in EU airspace. Tekever's
      compliance page confirms a programme exists but its operational adequacy is
      unverifiable externally. Critically, no enforcement action has been identified in
      any public source reviewed during this research pass. The risk transmission map
      below illustrates the causal chain from a battlefield incident to financial impairment,
      including the institutional circuit-breakers available at each stage.
    claimRefs: [CR022, CR023, CR024, CR025, CR026, CR027, CR028]
    figureRefs: [FR002]

  - id: R-S06
    title: Financial, Governance, People, and Mitigation Risk
    body: >-
      Tekever's financial risk profile is dominated by the gap between committed capital
      expenditure and the timing of revenue realisation. Both the Swindon and Cahors
      buildouts require substantial upfront capex before OVERMATCH and French defence
      payments reach the levels needed to fund ongoing operations. No audited financial
      statements are publicly available, preventing independent verification of cash
      position, burn rate, or working capital adequacy. The unicorn valuation is
      structurally anchored to OVERMATCH, and SIPRI's 2026 analysis indicates UK fiscal
      constraints could affect long-duration procurement in future spending reviews.
      Governance opacity amplifies financial risk: CEO Ricardo Mendes is the sole named
      executive across all public communications, with board composition, succession, and
      audit committee structure undisclosed. Tekever's multinational investor base —
      NATO Innovation Fund, NSSIF, Baillie Gifford, Crescent Cove — provides strategic
      support and policy access that partially offsets governance risk, and the political
      cost of OVERMATCH cancellation provides a structural buffer. The three thesis-break
      scenarios — export-licence revocation, OVERMATCH cancellation, and a battlefield
      incident — are ranked by probability and investor impact in the risk heatmap. The
      people/execution risk register and the mitigation/kill-criteria table provide
      structured decision aids for ongoing monitoring and investment committee review.
    claimRefs: [CR029, CR030, CR031, CR032, CR033, CR034, CR035, CR036, CR038, CR039, CR040, CR041, CR042, CR043, CR044, CR045]
    tableRefs: [TR004, TR005]
    figureRefs: [FR001]

