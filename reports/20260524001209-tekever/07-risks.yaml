          off-take, cancellation provisions, and renegotiation trigger clauses
      - - 'Battlefield civilian harm attribution event'
        - >-
          ECJU end-use monitoring obligations; Task Force Kindred operational
          protocols; 10,000+ combat hours without documented major incident
        - >-
          International investigation formally attributing civilian harm to a
          Tekever platform; ICRC or EU Parliament inquiry; EMSA contract suspension
        - >-
          Request AR3 operational protocols and rules of engagement; incident
          reporting and investigation procedures; insurance for battlefield liability
      - - 'Factory buildout failure — Swindon or Cahors'
        - >-
          UK government political support; existing Portuguese manufacturing expertise;
          Cahors site unveiled with stated summer 2026 target
        - >-
          Planning permission denial; construction stop order; schedule slip exceeding
          six months; capex overrun disclosure; management delay announcement
        - >-
          Request Swindon planning status, construction contract, and factory fit-out
          timeline with milestone payments; confirm Cahors operational status
      - - 'Supply chain critical component disruption'
        - >-
          Ukraine-tested expedient supply procedures; AR3 Evo designed for payload
          modularity; no current supply disruption identified in public sources
        - >-
          Confirmed single-source EO/IR supplier failure; NDAA-origin compliance
          failure in US procurement context; lead-time extension exceeding six months
        - >-
          Request approved supplier list with export classifications, single-source
          dependencies and safety stock levels, and NDAA and EAR de minimis analysis
    claimRefs: [CR038, CR039, CR040, CR041, CR044, CR045]
    notes: >-
      Kill-criteria indicators are observable market signals or regulatory events that,
      if confirmed, would materially impair or invalidate the investment thesis independent
      of management remediation. Diligence asks reflect information required to move from
      inferred to verified risk assessment.

