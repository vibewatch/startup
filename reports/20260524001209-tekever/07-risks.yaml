  evidenceGaps:
    - id: gap-R-1
      type: private-evidence-only
      severity: blocking
      topic: financial-governance
      missingEvidence: >-
        Tekever's monthly burn rate, cash runway, and capital requirements for the
        Swindon and Cahors factory buildouts are not publicly disclosed. No audited
        financial statements, management accounts, or investor communications
        providing this financial data are available in public sources.
      whyItMatters: >-
        Without burn rate and capital adequacy data, financial risk cannot be
        quantified and the probability of a liquidity event before OVERMATCH
        milestone payments materialise cannot be assessed independently.
      diligencePath: >-
        Request Tekever management accounts, board-approved cash flow projections,
        and capital expenditure schedule for Swindon and Cahors buildouts covering
        the period through first OVERMATCH delivery milestone.
      relatedQuestionRefs: [QR019, QR020]

    - id: gap-R-2
      type: private-evidence-only
      severity: material
      topic: procurement-concentration
      missingEvidence: >-
        The specific contract terms of OVERMATCH — including milestone payment
        schedule, cancellation clauses, minimum off-take commitments, and
        renegotiation triggers — are not publicly available as a classified or
        commercially sensitive government contract.
      whyItMatters: >-
        Without access to OVERMATCH contract terms, the probability-weighted
        assessment of survival through a UK spending review and the investor loss
        in a cancellation scenario cannot be independently quantified.
      diligencePath: >-
        Request the OVERMATCH contract term sheet or summary covering: milestone
        payment schedule, cancellation-for-convenience provisions, minimum annual
        off-take, renegotiation triggers, and performance bond requirements.
      relatedQuestionRefs: [QR021]

    - id: gap-R-3
      type: missing-source
      severity: material
      topic: supply-chain
      missingEvidence: >-
        The composition of Tekever's AR3 and AR5 supply chain by component origin
        and controlled-goods classification, and the current headcount by site and
        function, are not publicly documented in any accessible source.
