company:
  name: Tekever
chapter:
  number: 7
  letter: R
  title: Risks
  summary: >-
    Tekever's investment thesis rests on the UK OVERMATCH programme, creating
    acute customer-concentration and export-control risk across three regulatory
    regimes simultaneously. Simultaneous greenfield factory buildouts in Swindon
    and Cahors, an undisclosed financial profile, and governance opacity amplify
    execution risk; institutional backing from NATO IF and NSSIF provides
    meaningful mitigation but does not eliminate the thesis-break scenarios of
    export-licence revocation, OVERMATCH cancellation, or a battlefield civilian
    harm attribution event.

