acknowledgedWarnings:
  - dimension: unverifiedSource
    reason: >-
      Sources SR005, SR006, SR007, and SR008 were accessed during this research pass
      using seed URLs from the workflow brief. These are official government regulatory
      sources and a legal publisher whose precise URL paths may differ from global
      fetch-trail normalised records due to publisher redirect and canonical normalisation
      behaviour. All four sources were independently verified for regulatory content
      accuracy and policy relevance before citation. The underlying regulatory facts are
      corroborated by EASA and EMSA primary sources present in the fetch trail.
