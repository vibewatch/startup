companyProfile:
  summary: >-
    Tekever is a Portuguese-British AI-driven defence and security company founded in 2001, best known
    for its AR3 tactical ISR drone and AR5 long-endurance maritime surveillance UAS. The company
    achieved unicorn status in May 2025 at a valuation above £1 billion, underpinned by the £400
    million UK OVERMATCH sovereign framework, a €30 million EMSA maritime surveillance contract,
    10,000+ AR3 combat flight hours in Ukraine, and the RAF StormShroud ACP delivery. Its ATLAS
    AI platform bundles object detection, heatmap tracking, and FPV streaming into a hardware-plus-
    software revenue model. Tekever claims profitability, but audited financials remain private.
  foundedDate: "2001-01-01"
  founders:
    - name: Ricardo Mendes
      role: CEO and co-founder
      background: >-
        Led Tekever from founding through the UAS pivot, Ukraine deployment, Series B, and unicorn
        milestone; primary face of sovereign programme relationships with UK and French governments.
      claimRefs: [CO002]
  foundingLocation: Lisbon, Portugal
  headquarters: "London, UK (Companies House no. 08684764); engineering centres in UK, Portugal, and France"
  productSummary: >-
    AR3 (tactical ISR UAS for land and maritime operations), AR5 (fixed-wing UAS for long-endurance
    maritime surveillance), ARX, and the ATLAS AI-powered analytics platform providing FPV streaming,
    heatmap tracking, SAR integration, and object detection. Revenue model spans hardware sales,
    services and maintenance, intelligence-as-a-service (ATLAS / UAS-as-a-Service), and sovereign
    programme delivery (OVERMATCH, StormShroud, Project NYX).
  customerFocus: >-
    NATO-allied government and institutional customers — UK MoD and RAF, EMSA, Spain Ministry of
    Interior, Ukraine (via UK International Fund for Ukraine), and NATO Innovation Fund-backed
    programmes. Expansion targets France, US (Fayetteville NC office opened), and wider NATO allies.
  businessModel: >-
    B2G/B2I prime-contractor model: platform sales, multi-year services and maintenance contracts,
    intelligence-as-a-service software licences, and sovereign programme delivery on milestone-gated
    frameworks. Hardware-plus-software bundling demonstrated in Spain MOI contract (AR3 + ATLAS).
  stage: late-stage private (unicorn, post-Series B)
  fundingStatus: >-
    €70 million Series B (2024) led by Baillie Gifford and NATO Innovation Fund; fully subscribed
    unicorn round (May 2025) at £1B+ valuation with Ventura Capital, Baillie Gifford, NATO
    Innovation Fund, Iberis Capital, and Crescent Cove. Total equity raised not publicly disclosed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO006, CO008, CO010, CO012, CO017, CO018, CI005]
summary:
  headline: >-
    Tekever is a rare battle-proven European UAS unicorn with credible sovereign demand anchors,
    but the £1B+ entry price is stretched against unaudited revenue and an undrawn OVERMATCH
    framework — track until data-room access confirms the financial thesis.
  overallScore: 5.8
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1270
    revenueRunRateUsdM: null
    arrUsdM: null
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 76
    customerCount: null
    headcount: 1300
  topStrengths:
    - >-
      10,000+ AR3 combat flight hours in Ukraine provide in-service battlefield validation unmatched
      by any other European UAS platform, directly accelerating NATO procurement cycles.
    - >-
      £400 million UK OVERMATCH programme and €100 million France ecosystem commitment establish
      dual sovereign anchors that provide multi-year revenue visibility unavailable to peers.
    - >-
      ATLAS AI software platform justifies a software-company valuation premium (15–25× revenue)
      above pure hardware OEM peers and creates platform stickiness across the customer base.
    - >-
      NATO Innovation Fund participation provides institutional sovereign-level validation and
      geopolitical insulation for future NATO-member procurement decisions.
    - >-
      RAF StormShroud ACP delivered in under six months, demonstrating execution speed for
      sovereign programme delivery and earning Dstl endorsement.
  topRisks:
    - >-
      No audited financial accounts publicly available — profitability claim and revenue base
      underpinning the £1B+ valuation cannot be independently verified.
    - >-
      OVERMATCH is a framework ceiling, not a guaranteed order book; actual spending is
      discretionary within the five-year window and drawdown milestones are undisclosed.
    - >-
      Severe customer concentration: EMSA €30M framework and OVERMATCH £400M framework together
      dominate the known contract base; either cancellation would materially compress revenue.
    - >-
      Cap-table structure, preference terms, and dilution from the May 2025 unicorn round are
      undisclosed, creating preference-overhang uncertainty for common-equity return modeling.
    - >-
      Key-person dependency on founder-CEO Ricardo Mendes is material across sovereign programme
      relationships and investor confidence; no public succession plan exists.
  unresolvedGaps:
    - >-
      Three years of audited P&L (FY2022–FY2024) required to verify revenue base and
      profitability claim before a buy decision can be underwritten.
    - >-
      First 24-month OVERMATCH task-order schedule and committed drawdown values not disclosed;
      framework ceiling ≠ contracted revenue timing or magnitude.
    - >-
      Cap-table, preference stack, anti-dilution provisions, and preference overhang not disclosed;
      common-equity returns at current entry cannot be modeled.
    - >-
      France €100M commitment has not converted to executed customer or programme contracts;
      capital commitment may not translate to billable revenue within the plan window.
    - >-
      Revenue concentration breakdown (EMSA / OVERMATCH / other as % of total) unavailable;
      customer concentration risk cannot be quantified for underwriting model.
