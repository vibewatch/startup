  topStrengths:
    - >-
      10,000+ AR3 combat flight hours in Ukraine provide in-service battlefield validation unmatched by any other
      European UAS platform, directly accelerating NATO procurement cycles.
    - >-
      £400 million UK OVERMATCH programme and €100 million France ecosystem commitment establish dual sovereign anchors
      that provide multi-year revenue visibility unavailable to peers.
    - >-
      ATLAS AI software platform justifies a software-company valuation premium (15–25× revenue) above pure hardware OEM
      peers and creates platform stickiness across the customer base.
    - >-
      NATO Innovation Fund participation provides institutional sovereign-level validation and geopolitical insulation
      for future NATO-member procurement decisions.
    - >-
      RAF StormShroud ACP delivered in under six months, demonstrating execution speed for sovereign programme delivery
      and earning Dstl endorsement.
  topRisks:
    - >-
      No audited financial accounts publicly available — profitability claim and revenue base underpinning the £1B+
      valuation cannot be independently verified.
    - >-
      OVERMATCH is a framework ceiling, not a guaranteed order book; actual spending is discretionary within the
      five-year window and drawdown milestones are undisclosed.
    - >-
      Severe customer concentration: EMSA €30M framework and OVERMATCH £400M framework together dominate the known
      contract base; either cancellation would materially compress revenue.
    - >-
      Cap-table structure, preference terms, and dilution from the May 2025 unicorn round are undisclosed, creating
      preference-overhang uncertainty for common-equity return modeling.
    - >-
      Key-person dependency on founder-CEO Ricardo Mendes is material across sovereign programme relationships and
      investor confidence; no public succession plan exists.
  unresolvedGaps:
    - >-
      Three years of audited P&L (FY2022–FY2024) required to verify revenue base and profitability claim before a buy
      decision can be underwritten.
    - >-
      First 24-month OVERMATCH task-order schedule and committed drawdown values not disclosed; framework ceiling ≠
      contracted revenue timing or magnitude.
    - >-
      Cap-table, preference stack, anti-dilution provisions, and preference overhang not disclosed; common-equity
      returns at current entry cannot be modeled.
    - >-
      France €100M commitment has not converted to executed customer or programme contracts; capital commitment may not
      translate to billable revenue within the plan window.
    - >-
      Revenue concentration breakdown (EMSA / OVERMATCH / other as % of total) unavailable; customer concentration risk
      cannot be quantified for underwriting model.
