summary:
  headline: >-
    Tekever is a rare battle-proven European UAS unicorn with credible sovereign demand anchors, but the £1B+ entry
    price is stretched against unaudited revenue and an undrawn OVERMATCH framework — track until data-room access
    confirms the financial thesis.
