chapter:
  number: 3
  title: Competitors
  summary: >-
    Tekever competes across five distinct competitor categories in the unmanned aerial systems and AI-driven
    intelligence market. Direct maritime ISR peers — AeroVironment (Puma AE, JUMP 20) and Schiebel
    (Camcopter S-100) — are its most immediate product-for-product competitors in EMSA and European naval
    surveillance. MALE UAS incumbents — Elbit Systems (Hermes 900) and General Atomics (MQ-9A Reaper) —
    occupy adjacent but larger mission sets with substantially higher price points and predominantly US-export
    constraints. Baykar's Bayraktar TB2 ($5M estimated per unit) represents the most credible
    export-market disruptor, already adopted across 30+ countries and several EU NATO members. US
    AI-autonomy platforms — Shield AI and Anduril — operate primarily in the US DoD ecosystem and have
    limited European commercial footprint today, but their AI-first positioning mirrors Tekever's and
    their capital bases are far larger. Status-quo substitutes (manned maritime patrol aircraft, satellite
    ISR) set the macro cost-displacement bar. Tekever's principal moats are its EMSA framework position,
    Ukraine combat proof, European regulatory alignment, and AI-first ATLAS platform — each real but each
    facing specific displacement risks that require careful diligence.

sections:
  - id: landscape-overview
    title: Competitive Landscape Overview
    body: >-
      Tekever's competitive environment is best understood across five distinct competitor categories,
      each representing a different buyer trade-off and displacement pathway. First, direct maritime ISR
      peers: AeroVironment's Puma AE and JUMP 20 platforms and Schiebel's Camcopter S-100 VTOL UAS
      compete head-to-head in naval patrol and maritime surveillance missions. These are Tekever's
      primary competitive threat for EMSA contract renewals and European naval procurement. Second,
      MALE and strategic UAS incumbents: Elbit Systems' Hermes 900 and General Atomics' MQ-9A Reaper
      occupy a higher-altitude, longer-endurance mission tier with substantially larger airframes and
      significantly higher price points (estimated $10–32M per unit), making them partial substitutes
      rather than direct competitors in Tekever's primary maritime ISR segment. Third, export-market
      challengers: Turkey's Baykar with its Bayraktar TB2 has demonstrated extraordinary export momentum
      — over 30 countries operating the platform as of 2025–2026, including EU NATO members Poland,
      Latvia, and Albania — and its price point (~$5M estimated per system) creates genuine competitive
      pressure in price-sensitive Eastern European markets. Fourth, AI-autonomy defense platforms: Shield
      AI (Hivemind AI pilot, V-BAT VTOL) and Anduril (Ghost-X, Lattice OS) represent the closest
      philosophical peers to Tekever's AI-first positioning but operate primarily in the US DoD ecosystem
      and have limited European UAS commercial presence in 2026. Fifth, status-quo substitutes: manned
      maritime patrol aircraft (Lockheed P-8 Poseidon, Airbus C295 Maritime Patrol) and commercial
      satellite ISR (Planet Labs, Maxar) represent the baseline Tekever must displace to grow. Understanding
      all five categories is essential to assessing whether Tekever's current market position is durable
      or whether it is primarily capturing a temporary regulatory and reputational advantage.
