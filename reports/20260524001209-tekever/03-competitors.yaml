  - id: moat-durability-and-switching-costs
    title: Moat Durability, Switching Costs, and Adverse Evidence
    body: >-
      Tekever's competitive moat rests on four pillars, each with specific durability characteristics
      and failure modes. First, the EMSA framework position: Tekever's renewal of its European Maritime
      Safety Agency UAS surveillance contract creates a multi-year incumbent advantage. EMSA's procurement
      process requires demonstrated airworthiness, maritime certification, and operational track record —
      barriers that new entrants must satisfy before competing. However, Baykar, Schiebel, and
      AeroVironment all have the technical maturity to qualify and have been active in European maritime
      monitoring procurement. Tekever's EMSA concentration in two major contracts (EMSA and UK OVERMATCH)
      represents a customer concentration risk: these are its primary publicly disclosed revenue anchors,
      and losing either would be material to its financial profile. Second, Ukraine combat-proven brand:
      10,000+ AR3 combat flight hours in active conflict is a differentiation that no European peer can
      match in 2026. This record provides procurement agencies with confidence that Tekever's systems
      perform under contested conditions — a decisive advantage for NATO and EU customers evaluating
      battlefield-ready UAS. The risk is that this advantage has a shelf life: if Baykar or AeroVironment
      accumulates comparable conflict records in future engagements, the differentiation narrows. Third,
      AI-first platform (ATLAS): Tekever's AI-driven maritime intelligence layer is its technology moat
      — but it is the most vulnerable to replication by well-capitalized competitors. Shield AI's Hivemind
      and Anduril's Lattice OS demonstrate that US defense tech companies are building comparable autonomous
      intelligence stacks with substantially greater R&D resources. Fourth, European regulatory alignment:
      Tekever's Portuguese-UK dual footprint and EMSA certification give it a European regulatory
      posture that US competitors cannot quickly replicate. ITAR restrictions on US-origin systems
      create a genuine structural barrier for AeroVironment and General Atomics in EU programs. Adverse
      evidence is material: Tekever has no disclosed audited revenue figures, making customer
      concentration impossible to independently verify. The UK OVERMATCH's £400M commitment is phased
      over five years and performance-contingent, not guaranteed. Critics have noted that Tekever's
      unicorn valuation rests primarily on committed rather than delivered revenue.
