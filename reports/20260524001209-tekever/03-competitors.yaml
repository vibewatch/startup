  - id: TP004
    title: Moat Durability / Competitive Risk Register
    columns:
      - Moat Claim
      - Challenger / Threat
      - Severity
      - Mitigation / Diligence Ask
    rows:
      - - EMSA framework incumbent position
        - Baykar, Schiebel, AeroVironment qualify for EMSA re-bid; procurement rules require open competition
        - High
        - Confirm renewal terms and competitive tender requirements; assess Tekever's bid pipeline strength
      - - Ukraine AR3 combat proof (10,000+ hours)
