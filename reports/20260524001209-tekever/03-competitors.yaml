callouts:
  - calloutType: risk
    title: Baykar Price Disruption in Eastern European Defense Markets
    body: >-
      Baykar's Bayraktar TB2 represents the most credible near-term competitive displacement risk for
      Tekever in Eastern European and NATO member markets. At an estimated $5 million per system — well
      below Elbit's $20–30 million and General Atomics' $32 million per unit — the TB2 offers combat-proven
      MALE capability at a price tier that NATO members with constrained defense budgets find attractive.
      EU NATO members Poland, Latvia, and Albania have already adopted the TB2. Tekever's AR5 and AR3 EVO
      operate in overlapping procurement windows. While Tekever's AI-integrated maritime ISR and EMSA
      certification provide defensible differentiation for maritime-specific programs, the TB2's lower
      cost and expanding installed base create pricing pressure in tactical ISR segments where Tekever's
      AR3 EVO competes directly. Investors should assess whether Tekever's pricing power in Eastern
      European markets is sustainable or eroding.
    claimRefs:
      - CP006
      - CP007
      - CP008
      - CP019
      - CP035

  - calloutType: risk
    title: EMSA and UK OVERMATCH Customer Concentration Creates Material Revenue Risk
    body: >-
      Tekever's two publicly disclosed contract anchors — the EMSA framework (approximately €30M) and UK
      OVERMATCH (£400M over five years) — represent the dominant share of its publicly known revenue
      pipeline. No other customers or contract values are publicly disclosed. This two-customer concentration
      creates a material risk profile: loss of EMSA in a competitive re-bid, or underperformance against
      UK OVERMATCH milestones that triggers termination clauses, would each be significant to Tekever's
      financial position. The EMSA contract operates under EU procurement rules requiring competitive
      tendering on renewal, and both Schiebel and AeroVironment have the technical capability to submit
      qualifying bids. Diligence must establish the full customer revenue distribution, renewal probability,
      and the structure of the UK OVERMATCH performance contingencies before the current valuation can be
      properly underwritten.
    claimRefs:
      - CP016
      - CP017
      - CP023
      - CP024
      - CP029

  - calloutType: insight
    title: European Regulatory Alignment Is Tekever's Most Durable and Underappreciated Moat
    body: >-
      Among all of Tekever's competitive differentiators, its EU-domicile regulatory alignment — combined
      with EMSA certification and EDA funding eligibility — is the moat that US competitors (AeroVironment,
      Shield AI, Anduril, General Atomics) cannot readily replicate without a structural change in domicile
      or alliance status. US ITAR restrictions create a genuine procurement barrier in EU civil and defense
      programs. Even Elbit (Israeli) and Baykar (Turkish) face EDA participation constraints that Tekever
      does not. For as long as EU member states prioritize European industrial participation in defense
      programs — a trend accelerating since 2022 — Tekever's Portuguese-UK dual domicile and EMSA
      certification constitute a moat that operates independently of its product performance. This regulatory
      moat is less discussed than the AI or combat-proof differentiation but may be more durable in
      EU procurement cycles. The risk is political: if EU member states deprioritize industrial participation
      rules for urgent capability gaps, the regulatory advantage partially erodes.
    claimRefs:
      - CP022
      - CP024
      - CP030
      - CP037
      - CP039

