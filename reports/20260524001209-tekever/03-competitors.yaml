  - id: us-defense-tech-peers
    title: US Defense-Tech Peers — AeroVironment, Shield AI, and Anduril
    body: >-
      AeroVironment is Tekever's most directly comparable publicly traded competitor. Its FY2024 revenue
      of approximately $609 million represents roughly 30–50x Tekever's estimated scale, giving it a
      substantially larger engineering base and government contract track record. AeroVironment's Puma
      AE is STANAG-certified for maritime operations and has accumulated significant operational hours
      with US and allied navies. Its newer JUMP 20 platform (hybrid VTOL to fixed-wing transition)
      targets the same long-endurance ISR mission Tekever's AR5 serves, creating direct procurement
      competition for NATO member contracts. AeroVironment's primary structural advantage is its deep
      US DoD relationship and established US government procurement vehicles; its primary structural
      weakness relative to Tekever is its limited European commercial footprint and US ITAR export
      restrictions that slow or restrict allied sales. Tekever's AR3 EVO competes against the Puma AE
      in the 10kg-class tactical ISR segment; the AR5 competes against the JUMP 20 in maritime endurance
      missions. Shield AI's V-BAT VTOL platform targets the maritime patrol and land ISR mission with
      11+ hour endurance and its proprietary Hivemind AI pilot — which enables GPS-denied autonomous
      operation, a direct capability parallel to Tekever's ATLAS platform. Shield AI raised over $500M
      in financing at an estimated $2.8 billion valuation as of 2022, giving it capital resources far
      exceeding Tekever's. However, Shield AI's commercial focus has been predominantly US DoD and
      US allied military, with limited European civil maritime presence. Anduril's Ghost-X autonomous
      UAS and Lattice OS AI command platform are philosophical peers to Tekever's AI-first approach but
      target different missions — primarily loitering munitions, autonomous interceptors, and US DoD
      battlefield management — rather than European maritime ISR. Anduril's $14 billion valuation (as
      of 2024) and large capital base give it long-term R&D capacity that Tekever cannot match.
    claimRefs:
      - CP003
      - CP004
      - CP005
      - CP020
