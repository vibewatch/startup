  - type: private-evidence-only
    severity: blocking
    topic: financials
    missingEvidence: >-
      Audited revenue, ARR, gross margin, EBITDA, and cash burn for Tekever are not publicly available. Ventura Capital
      describes the model as "uniquely profitable and sustainable" but no independent verification exists.
    whyItMatters: >-
      No valuation underwriting or investment-stage judgment is possible without private financials. The gap directly
      blocks any quantitative assessment of business quality.
    diligencePath: >-
      Request audited financial statements and management accounts for at least three years from the company directly;
      cross-reference with investor data rooms.
    relatedQuestionRefs:
