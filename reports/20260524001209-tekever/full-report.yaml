          - type: callout
            title: EU AI Act compliance for high-risk autonomous systems is an open diligence gap
            body: >-
              Tekever's ATLAS object-detection and VBN systems likely qualify as high-risk AI under the EU AI Act,
              requiring conformity assessments, technical documentation, and designated notified-body review. No
              conformity assessment, notified-body engagement, or compliance timeline has been publicly disclosed. For
              regulated procurement customers (EU agencies, NATO partners), non-compliance could create procurement
              blockers that are not visible in the current revenue and contract pipeline.
