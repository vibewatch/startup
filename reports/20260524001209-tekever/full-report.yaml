        - Revenue verification impossible; valuation purely faith-based in company statements
        - Place on watch list; do not deploy further capital without data-room access
      - - Customer concentration loss
        - EMSA contract non-renewal or OVERMATCH re-competition announcement
        - Revenue base falls below £30M pa; valuation support from comps collapses to <£0.3B
        - Immediate exit review; trigger mandatory IC discussion
    notes: >-
      Thresholds are set against publicly observable events where possible. Private triggers (down-round, no accounts)
      require secondary market monitoring or investor network sources.
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Audited revenue and EBITDA
        - Three years of audited P&L (FY2022–24)
        - Cannot verify P/S multiple denominator; profitability claim unsubstantiated
        - Data-room request; Companies House if filed by 2026
      - - OVERMATCH drawdown schedule
        - First 24-month task-order schedule and committed values
        - Framework ceiling ≠ order book; revenue timing and magnitude unverifiable
        - UK MOD FOIA or investor dialogue with Tekever finance team
      - - Cap-table and preference stack
        - Investor agreement or SHL register showing preference terms
        - Preference overhang and anti-dilution provisions determine common-equity return
        - Legal due diligence; Companies House SHL filings
      - - France contracted revenue
        - Executed customer or programme contracts under €100M commitment
        - Capital commitment ≠ revenue; France build-out may not convert to billable contracts in plan window
        - Commercial due diligence; Tekever France entity filings
      - - Revenue concentration breakdown
        - EMSA / OVERMATCH / other as percent of total revenue
        - Customer concentration risk quantification for underwriting model
        - Management accounts or investor data-room
      - - Headcount and burn rate
        - 2026 headcount by function and implied opex run-rate
        - Capital-intensive ramp across three geographies raises burn concern despite profitability claims
        - LinkedIn headcount triangulation; Companies House when accounts filed
    notes: >-
      Diligence paths are prioritised in order of importance; items 1–3 are blocking for a buy decision. Items 4–6 are
      material but can be partially addressed through reference checks and secondary research.
