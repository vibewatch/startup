      - number: '5.3'
        title: Modular architecture and manufacturing
        blocks:
          - type: paragraph
            body: >-
              The AR3 EVO's four-pillar modular architecture is the product philosophy that underlies Tekever's claim to
              mission flexibility. The four pillars are: Payloads (swappable sensor and effector packages from EO/IR
              through SAR, SIGINT, EW, and laser designators); Propulsion (electric, combustion, or heavy-fuel engines
              selectable per mission for endurance, speed, or altitude optimisation); Deployment (VTOL or fixed-wing
              mode, chosen per operational context); and Communications (plug-and-play support for SATCOM, LTE, and
              line-of-sight links, including Starlink, Iridium, Link 16, Trellisware TSM, Silvus mesh networking, and
              Radionor). The compatible payload and sensor ecosystem is extensive: gimbals from Trillium (HD80),
              HoodTech (AC11, AC06 LD), and Tekever's own; SAR from IMSAR (NSP-3); SIGINT from CRFS, ESROE, Revector,
              and Lifeseeker; EW via CRPA antennas; transponders including Mode S ADS-B and IFF Mode-5; and AIS/VHF for
              maritime operations. This breadth, documented in the official product brochure, makes the AR3 EVO
              genuinely multi-role rather than constrained to a single mission configuration.


              Tekever's manufacturing model is vertically integrated across the full value chain: aeronautical design,
              composite structures manufacturing, electronics design and production, and software development (including
              deep capability in data science). This integration, highlighted in the Viasat partnership announcement and
              confirmed by the company's own materials, allows Tekever to bring products to market faster and evolve
              them more rapidly than peers who depend on sub-contract suppliers for structural or electronics
              components. The company has engineering and production facilities in the United Kingdom (with a new
              factory in Swindon announced under the OVERMATCH programme) and Portugal, with the Toulouse and Cahors
              sites in France focusing on Space and drone production respectively. The Cahors industrial site entered
              its transformation phase in early 2026, with operational start-up planned ahead of summer 2026.


              The manufacturing model does carry a key dependency risk: critical payload integrations for SAR (IMSAR
              NSP-3), SATCOM (Viasat), and certain RF/comms modules (Silvus, Persistent Systems, Starlink) are
              third-party supplied. While the plug-and-play architecture reduces lock-in risk compared to a
              custom-integrated approach, disruption to any of these suppliers — particularly in a defence export
              context — could constrain Tekever's ability to deliver mission-critical configurations at scale.
            claimRefs:
