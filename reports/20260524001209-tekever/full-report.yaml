      - number: '2.2'
        title: TAM, SAM, and evidence-constrained sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Public market sizing is directionally useful but inconsistent. The conservative regional lens comes from
              MarketsandMarkets, which places the Europe UAV market at USD 5.0 billion in 2025 and USD 7.98 billion in
              2030. A narrower military-specific lens from Grand View is much larger already at USD 9.47 billion in
              2024, while Coherent’s global military-drone estimate reaches USD 27.2 billion in 2026. Market Data
              Forecast publishes an even larger Europe number of USD 14.74 billion in 2025, but the jump from USD 4.10
              billion in 2024 is hard to reconcile with other public sources and should be treated as an outlier, not a
              planning base. The more robust way to interpret these sources is as multiple lenses: a broad Europe UAV
              market, a Europe military-drone submarket, and a global military-drone TAM. Tekever’s SAM is narrower than
              any of them because its public proof sits in sovereign ISR, maritime surveillance, border monitoring, and
              collaborative defence programmes. On a bottom-up basis, public contracts imply only a floor, not a clean
              SOM: OVERMATCH alone annualises at roughly £80 million per year, while EMSA adds about €7.5 million per
              year. The conclusion is that the market is large enough to matter, but public sources do not isolate
              Tekever’s Europe-only SAM or SOM precisely.
