      - number: '6.2'
        title: Named Customer Proof — Production Status and Outcome Evidence
        blocks:
          - type: paragraph
            body: >-
              The strongest customer-proof evidence in Tekever's portfolio is the RAF StormShroud programme. The UK
              Prime Minister's official press statement, DSTL's formal announcement, and independent UK Defence Journal
              reporting all confirm that StormShroud has entered active RAF service — not evaluation, not pilot, but
              formal operational service. This triple-source corroboration across government press office, defence
              laboratory, and specialist media constitutes the gold standard of customer proof in the defence sector.
              Project NYX (British Army) is a development contract rather than a production deployment, but still
              demonstrates a second UK MOD service branch as an active paying customer.


              The EMSA maritime surveillance relationship is the longest-dated. The AR5 has been in EMSA operational
              service since 2017 — nine years of continuous production deployment documented across multiple renewals
              and mission announcements. The Italian Coast Guard's participation in EMSA-led SAR exercises and the Gulf
              of Genova operational surveillance missions confirm that the EMSA relationship translates into real
              operational outputs, not just framework agreements. EMSA's official THETIS service records provide
              independent regulatory-tier corroboration.


              Nigeria's Deep Blue Project resulted in a physical hardware delivery of AR3 systems to the Nigerian Navy —
              not a letter of intent or a pilot, but a completed delivery. The Aerial Robotix partnership extended this
              into sustained operational monitoring missions for critical infrastructure. Spain's Ministry of Interior
              €5 million contract confirms homeland security as a separate production revenue category. USSOCOM's
              operational exercise completed successfully but has not yet resulted in a production contract or disclosed
              expression of intent to procure.
            claimRefs:
