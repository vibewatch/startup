      - number: '6.3'
        title: Retention, Contract Durability, and Customer Health Signals
        blocks:
          - type: paragraph
            body: >-
              Tekever does not disclose NRR, GRR, or churn rates for any segment. Retention must be assessed from
              implicit signals — none of which are as strong as disclosed retention metrics, but several of which are
              meaningful. For EMSA, nine years of continuous production deployment without a documented non-renewal
              constitutes the most durable implicit retention evidence in the portfolio. The EMSA framework structure —
              with call-off contracts across multiple EU member state operations — creates recurring revenue that is
              replicated across different national contexts, making it harder for a single non-renewal to terminate the
              relationship entirely.


              The OVERMATCH framework for UK MOD provides structural retention assurance: a five-year, £400 million
              commitment with annual programme reviews rather than year-by-year procurement decisions. OVERMATCH is not
              guaranteed to deploy fully at the contracted pace, but the multi-year nature of the commitment
              substantially reduces year-to-year renewal risk compared to single-year contracts. No contract
              terminations or pilot-to-no-contract transitions have been documented in any public source for Tekever.


              The absence of disclosed metrics is itself an adverse signal. Customer satisfaction scores, pilot-to-
              production conversion rates, contract renewal lengths, and NRR are all standard KPIs for high-growth
              defence technology companies and their absence from public communications limits independent diligence. UK
              defence procurement opacity (due to sensitive programme classification for StormShroud) further restricts
              what can be disclosed. For EMSA, EU procurement rules require competitive re-tendering at each framework
              cycle, creating renewal risk that is structurally higher than a bilateral sovereign contract.
            claimRefs:
              - CU020
              - CU021
              - CU022
              - CU023
              - CU025
              - CU038
          - type: table
            tableRef: TU004
            claimRefs: []
