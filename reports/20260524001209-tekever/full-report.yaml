        title: Exhibits
        blocks:
          - type: callout
            title: Baykar Price Disruption in Eastern European Defense Markets
            body: >-
              Baykar's Bayraktar TB2 represents the most credible near-term competitive displacement risk for Tekever in
              Eastern European and NATO member markets. At an estimated $5 million per system — well below Elbit's
              $20–30 million and General Atomics' $32 million per unit — the TB2 offers combat-proven MALE capability at
              a price tier that NATO members with constrained defense budgets find attractive. EU NATO members Poland,
              Latvia, and Albania have already adopted the TB2. Tekever's AR5 and AR3 EVO operate in overlapping
              procurement windows. While Tekever's AI-integrated maritime ISR and EMSA certification provide defensible
              differentiation for maritime-specific programs, the TB2's lower cost and expanding installed base create
              pricing pressure in tactical ISR segments where Tekever's AR3 EVO competes directly. Investors should
              assess whether Tekever's pricing power in Eastern European markets is sustainable or eroding.
