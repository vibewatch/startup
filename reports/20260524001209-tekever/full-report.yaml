companyProfile:
  summary: >-
    Tekever is a Portuguese-British AI-driven defence and security company founded in 2001, best known for its AR3
    tactical ISR drone and AR5 long-endurance maritime surveillance UAS. The company achieved unicorn status in May 2025
    at a valuation above £1 billion, underpinned by the £400 million UK OVERMATCH sovereign framework, a €30 million
    EMSA maritime surveillance contract, 10,000+ AR3 combat flight hours in Ukraine, and the RAF StormShroud ACP
    delivery. Its ATLAS AI platform bundles object detection, heatmap tracking, and FPV streaming into a hardware-plus-
    software revenue model. Tekever claims profitability, but audited financials remain private.
