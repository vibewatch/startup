      - number: '1.4'
        title: Milestones, contracts, and international expansion
        blocks:
          - type: paragraph
            body: >-
              The public milestone record for Tekever is richer than most companies at this stage, largely because its
              Ukraine deployment created a continuous stream of verifiable operational proof. Since 2022, the AR3 has
              accumulated more than 10,000 combat flight hours in Ukraine through Task Force Kindred (a UK-led
              programme). Tekever's own communications and the NATO Innovation Fund confirm that those systems
              contributed to the destruction of over £3 billion worth of Russian military assets, including two S-400
              air-defence systems. This is the company's single strongest market differentiation claim: peer-reviewed,
              operationally corroborated autonomous AI performance at scale in contested environments.


              In the UK, the StormShroud programme delivered the AR3 equipped with Leonardo UK's BriteStorm electronic
              warfare payload to the Royal Air Force in under six months from programme initiation — a notable
              government- industry delivery speed record. Dstl supported the development of the capability. Project NYX,
              selected in May 2026, extends the relationship to the British Army and involves development of a
              loyal-wingman rotary platform designed to operate alongside Apache helicopters. A new Bristol Centre for
              Autonomy and Engineering Hub was announced alongside NYX. A new Swindon factory to produce the AR3 EVO was
              also announced for the OVERMATCH programme, with the UK Prime Minister meeting Tekever leadership to
              confirm the commitment.


              Beyond the UK, the commercial and strategic expansion is accelerating. The €30 million EMSA framework
              contract covers AR5 maritime surveillance. A €5 million Spanish Ministry of Interior contract covers
              border and sea patrol. In France, a €100 million investment is backed by Toulouse and Cahors facilities,
              with Cahors' first drone production targeted for mid-2026 and a CNES/DGA selection for the DESIR sovereign
              SAR satellite programme. In the United States, a first office opened in Fayetteville, North Carolina in
              May 2026, with representation at SOF Week through the NATO DIANA booth. The breadth of this expansion —
              UK, Portugal, France, Ukraine, US, plus EMSA — is exceptional for a company that was a mid-stage private
              UAS provider only three years ago.
