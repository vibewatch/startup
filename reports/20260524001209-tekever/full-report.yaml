      - number: '5.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Battlefield-forged modular architecture with proven shipborne reach
            body: >-
              The AR3 EVO's four-pillar modularity (payloads, propulsion, deployment, comms) was refined through tens of
              thousands of operational hours in Ukraine's contested airspace — not designed in a lab and tested on a
              range. The addition of 5×5 m VTOL shipborne capability in 2025 opens the naval and coast-guard market that
              was previously inaccessible to a platform of this weight class. No European peer has published an
              equivalent combination of combat-proven tactical UAS with integrated SAR and autonomous GNSS-denied
              navigation.
            calloutType: strength
