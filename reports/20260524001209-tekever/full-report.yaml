          - type: callout
            title: EMSA and UK OVERMATCH Customer Concentration Creates Material Revenue Risk
            body: >-
              Tekever's two publicly disclosed contract anchors — the EMSA framework (approximately €30M) and UK
              OVERMATCH (£400M over five years) — represent the dominant share of its publicly known revenue pipeline.
              No other customers or contract values are publicly disclosed. This two-customer concentration creates a
              material risk profile: loss of EMSA in a competitive re-bid, or underperformance against UK OVERMATCH
              milestones that triggers termination clauses, would each be significant to Tekever's financial position.
              The EMSA contract operates under EU procurement rules requiring competitive tendering on renewal, and both
              Schiebel and AeroVironment have the technical capability to submit qualifying bids. Diligence must
              establish the full customer revenue distribution, renewal probability, and the structure of the UK
              OVERMATCH performance contingencies before the current valuation can be properly underwritten.
