      - number: '1.2'
        title: Leadership, governance, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Ricardo Mendes is the CEO and de facto public face of Tekever, and the public record supports strong
              key-person dependence on him. He co-founded the company in 2001, has led its strategy through the Ukraine
              pivot, the unicorn funding round, and the £400 million OVERMATCH announcement, and he is the named
              executive in virtually every material company announcement and external address. Mendes has addressed the
              United Nations Counter-Terrorism Week (2023) and regularly advocates publicly for AI-enabled autonomous
              systems as a replacement for humans in high-risk defence and security missions. His profile fits the
              archetype of a founder-CEO whose identity and the company's market credibility are tightly fused.


              Beyond Mendes, the public record supports a small but growing senior leadership layer. Paulo Ferro, VP of
              Strategic Development, has represented Tekever at the North Carolina US office opening and plays a
              strategic-markets role. Nadia Maaref heads the Security Business Unit and also serves as Managing Director
              of Tekever France, reflecting the dual operating and commercial responsibility of senior staff. Kateryna
              Bezsudna was appointed in 2025 to lead Ukraine operations and expansion, bringing frontline-market
              expertise and a stated mission to make Ukraine a global hub for autonomous systems innovation. António
              Relvas leads Innovation.


              Board composition, governance structure, and formal investor representation are not publicly disclosed.
              The company has no public board directory, no published articles of association amendments in the UK
              filing record beyond standard filings, and no disclosed shareholder agreement. This is typical for a
              private company at this stage but means that governance oversight, succession planning, and investor veto
              rights cannot be independently assessed from public evidence. The key-person risk on Mendes is therefore a
              first- order diligence item that requires private-room access to address fully.
