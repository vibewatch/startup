      - number: '4.2'
        title: Capital structure, funding rounds, and financing dependency
        blocks:
          - type: paragraph
            body: >-
              Tekever's capital history, fully described in the Company Overview chapter, shows two clear funding
              events: a November 2024 Series B at €70 million led by Baillie Gifford and the NATO Innovation Fund,
              followed by a May 2025 unicorn-confirming round fully subscribed by existing investors and led by Ventura
              Capital. The unicorn round confirmed a valuation above £1 billion, equivalent to approximately €1.2
              billion at the time of the announcement. This chapter does not reproduce the round-by-round chronology
              from Company Overview but focuses instead on the capital adequacy and financing dependency that the
              capital structure implies for forward operations.


              The Companies House filing history for Tekever Ltd (UK entity, company number 08684764) shows that full
              accounts made up to 31 December 2024 were filed on 13 October 2025. Earlier sets of accounts covered year
              end 31 December 2023 (filed 30 September 2024) and 31 December 2022 (filed 26 September 2023). The
              accounting period was shortened from 31 March to 31 December in 2022, indicating a period of corporate
              restructuring. The UK entity filed as a small company through 2022 and upgraded to full accounts format
              for 2023 and 2024 — a common transition as a company's UK balance sheet grows materially. None of the
              filed accounts are publicly available in readable form through standard Companies House search.


              The charges register for Tekever Ltd reveals a single outstanding charge (code 0868 4764 0001) in favour
              of Barclays Security Trustee Limited, containing a fixed charge, created 10 May 2022 and delivered 11 May
              2022, with status Outstanding. This indicates the company accessed bank debt financing — likely a
              revolving credit facility or term loan — secured against company assets from at least May 2022. The charge
              has not been satisfied, suggesting the debt facility remains in place. This is a structurally important
              finding: Tekever is not purely equity-funded. The existence of a Barclays charge alongside equity rounds
              from Baillie Gifford, NIF, NSSIF, and Ventura Capital implies a blended capital structure with both equity
              and secured debt components.


              The OVERMATCH programme commits £400 million over five years, but Tekever has been explicit that this is a
              company investment commitment rather than a customer payment schedule. The distinction is critical for
              financial diligence: the £400 million represents Tekever's planned capex and operating expenditure across
              R&D, production infrastructure, UK manufacturing, and programme delivery — it is not a £400 million
              government contract. The Swindon drone factory (254,000 sq ft, due to open in 2026) represents a major
              fixed-asset commitment. Funding for these investments must come from equity rounds, operating cash flow,
              government co-investment, debt facilities, and sovereign programme fees. The extent to which programme
              revenues cover the investment commitment is not publicly quantified.
