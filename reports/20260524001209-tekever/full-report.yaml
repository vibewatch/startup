      - number: '7.6'
        title: Financial, Governance, People, and Mitigation Risk
        blocks:
          - type: paragraph
            body: >-
              Tekever's financial risk profile is dominated by the gap between committed capital expenditure and the
              timing of revenue realisation. Both the Swindon and Cahors buildouts require substantial upfront capex
              before OVERMATCH and French defence payments reach the levels needed to fund ongoing operations. No
              audited financial statements are publicly available, preventing independent verification of cash position,
              burn rate, or working capital adequacy. The unicorn valuation is structurally anchored to OVERMATCH, and
              SIPRI's 2026 analysis indicates UK fiscal constraints could affect long-duration procurement in future
              spending reviews. Governance opacity amplifies financial risk: CEO Ricardo Mendes is the sole named
              executive across all public communications, with board composition, succession, and audit committee
              structure undisclosed. Tekever's multinational investor base — NATO Innovation Fund, NSSIF, Baillie
              Gifford, Crescent Cove — provides strategic support and policy access that partially offsets governance
              risk, and the political cost of OVERMATCH cancellation provides a structural buffer. The three
              thesis-break scenarios — export-licence revocation, OVERMATCH cancellation, and a battlefield incident —
              are ranked by probability and investor impact in the risk heatmap. The people/execution risk register and
              the mitigation/kill-criteria table provide structured decision aids for ongoing monitoring and investment
