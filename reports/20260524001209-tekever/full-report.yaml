          - type: callout
            title: European Regulatory Alignment Is Tekever's Most Durable and Underappreciated Moat
            body: >-
              Among all of Tekever's competitive differentiators, its EU-domicile regulatory alignment — combined with
              EMSA certification and EDA funding eligibility — is the moat that US competitors (AeroVironment, Shield
              AI, Anduril, General Atomics) cannot readily replicate without a structural change in domicile or alliance
              status. US ITAR restrictions create a genuine procurement barrier in EU civil and defense programs. Even
              Elbit (Israeli) and Baykar (Turkish) face EDA participation constraints that Tekever does not. For as long
              as EU member states prioritize European industrial participation in defense programs — a trend
              accelerating since 2022 — Tekever's Portuguese-UK dual domicile and EMSA certification constitute a moat
              that operates independently of its product performance. This regulatory moat is less discussed than the AI
              or combat-proof differentiation but may be more durable in EU procurement cycles. The risk is political:
              if EU member states deprioritize industrial participation rules for urgent capability gaps, the regulatory
              advantage partially erodes.
