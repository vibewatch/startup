      - number: '7.4'
        title: Supply Chain and Component Sourcing Risk
        blocks:
          - type: paragraph
            body: >-
              Military-grade ISR drones integrate electro-optical sensors, GNSS modules, datalink systems, and
              purpose-built processors that are themselves export-controlled in their countries of manufacture.
              Tekever's AR3 Evo multi-sensor suite — including electro-optical, infrared, SAR, and SIGINT payloads —
              requires specialist sub-contractors for each payload type, compounding single-source risk. The
              battle-tested Ukraine supply chain operated under wartime expedient conditions where speed outweighed
              structured procurement discipline; transitioning to structured factory scaling at Swindon will expose
              logistics and quality-management vulnerabilities that conflict-zone operations did not surface. SIPRI's
              2026 analysis confirms that European defence industrial capacity is constrained relative to current
              rearmament demand, with component delivery timelines extending for electro-optical and semiconductor-class
              items. US NDAA Section 889 restrictions on Chinese-origin components in defence systems create a redesign
              and re-certification risk if Tekever's current supply chain includes controlled Chinese-manufactured
              electronics. The composition of Tekever's supply chain by component origin and controlled-goods
              classification is not publicly available, preventing independent assessment of de minimis exposure or
              NDAA-origin risk — this is the most significant information gap identified in this chapter.
            claimRefs:
              - CR017
              - CR018
              - CR019
              - CR020
              - CR021
      - number: '7.5'
        title: Regulatory, Legal, Safety, and Privacy Risk
        blocks:
          - type: paragraph
            body: >-
              Beyond export controls, Tekever faces a distinct cluster of regulatory and legal risks spanning EASA
              certification, autonomous systems accountability, and GDPR data-processor obligations. Every AR5 maritime
              surveillance deployment across EU member state airspace requires EASA Specific-category Operational
              Authorisation under the SORA framework, with each jurisdiction requiring a separate safety case. The
              European Parliament's 2025 research brief reflects a live EU legislative debate that could impose
              retroactive human-in-the-loop requirements on AI-enabled military drone systems within Tekever's OVERMATCH
              delivery timeline. UK Parliament defence committees are engaged in parallel debate. The most acute legal
              risk is civilian harm attribution: AR3 systems are documented as contributing to destruction of Russian
              military assets in Ukraine. Any future international investigation attributing civilian harm to a Tekever
              platform — however remote given documented protocols — would trigger regulatory suspension of export
              licences, loss of EMSA contracts, and sustained reputational contagion. GDPR data-processor obligations
              apply to EMSA operations where surveillance imagery captures personal data in EU airspace. Tekever's
              compliance page confirms a programme exists but its operational adequacy is unverifiable externally.
              Critically, no enforcement action has been identified in any public source reviewed during this research
              pass. The risk transmission map below illustrates the causal chain from a battlefield incident to
              financial impairment, including the institutional circuit-breakers available at each stage.
            claimRefs:
