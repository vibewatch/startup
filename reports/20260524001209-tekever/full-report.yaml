            title: Production Proof Across Multiple Segments
            body: >-
              Tekever has converted evaluation and pilot relationships into production across multiple distinct
              segments: RAF StormShroud (formally in service), EMSA maritime (9+ year tenure), Spain MOI (contracted
              production), Nigeria Deep Blue (hardware delivered), and Ukraine combat operations (10,000+ flight hours).
              This breadth of production evidence is unusually strong for a company of Tekever's stage.
            calloutType: strength
