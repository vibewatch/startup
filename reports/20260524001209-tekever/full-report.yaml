  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: >-
              Tekever's competitive environment is best understood across five distinct competitor categories, each
              representing a different buyer trade-off and displacement pathway. First, direct maritime ISR peers:
              AeroVironment's Puma AE and JUMP 20 platforms and Schiebel's Camcopter S-100 VTOL UAS compete head-to-head
              in naval patrol and maritime surveillance missions. These are Tekever's primary competitive threat for
              EMSA contract renewals and European naval procurement. Second, MALE and strategic UAS incumbents: Elbit
              Systems' Hermes 900 and General Atomics' MQ-9A Reaper occupy a higher-altitude, longer-endurance mission
              tier with substantially larger airframes and significantly higher price points (estimated $10–32M per
              unit), making them partial substitutes rather than direct competitors in Tekever's primary maritime ISR
              segment. Third, export-market challengers: Turkey's Baykar with its Bayraktar TB2 has demonstrated
              extraordinary export momentum — over 30 countries operating the platform as of 2025–2026, including EU
              NATO members Poland, Latvia, and Albania — and its price point (~$5M estimated per system) creates genuine
              competitive pressure in price-sensitive Eastern European markets. Fourth, AI-autonomy defense platforms:
              Shield AI (Hivemind AI pilot, V-BAT VTOL) and Anduril (Ghost-X, Lattice OS) represent the closest
              philosophical peers to Tekever's AI-first positioning but operate primarily in the US DoD ecosystem and
              have limited European UAS commercial presence in 2026. Fifth, status-quo substitutes: manned maritime
              patrol aircraft (Lockheed P-8 Poseidon, Airbus C295 Maritime Patrol) and commercial satellite ISR (Planet
              Labs, Maxar) represent the baseline Tekever must displace to grow. Understanding all five categories is
              essential to assessing whether Tekever's current market position is durable or whether it is primarily
              capturing a temporary regulatory and reputational advantage.
