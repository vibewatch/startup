            - ATLAS Live Feed (video, flight path, object ID, environmental overlays)
            - ATLAS Post-Mission Review (replay, evidence export, AIS cross-reference)
            - AI modules (object detection, change detection, classification, tracking)
        - label: Autonomy & Navigation Layer
          detail: >-
            Onboard and ground-based autonomy modules enabling GNSS-denied flight, edge AI inference, and swarm
            coordination across the AR3 EVO, AR5, and ARX platforms.
          items:
            - VBN (Visual-Based Navigation) — NVIDIA SoC edge AI, GNSS-independent 3D positioning
            - GNSS / GPS primary navigation with GLONASS backup
            - Automatic Take-Off and Landing (ATOL) — AR5
            - Swarm coordination logic — ARX platform (in development)
        - label: Sensor & Payload Layer
          detail: >-
            Modular plug-and-play payload ecosystem spanning surveillance, SAR, SIGINT, EW, and communications relay.
            Hot-swappable on AR3 EVO; integrated on AR5 for simultaneous operation.
          items:
            - GAMASAR (proprietary SAR — 40 km range, all-weather, Ka/Ku SATCOM-linked)
            - EO/IR gimbals (Trillium HD80, HoodTech AC11/AC06, Tekever Gimbal, Octopus Epsilon)
            - SIGINT / RF (CRFS, ESROE, Revector, Lifeseeker)
            - Comms / SATCOM (Starlink, Iridium, Viasat, Link 16, Trellisware TSM, Silvus, Radionor)
            - EW (CRPA antennas, directional EW, anti-jamming modules)
            - Maritime (AIS, EPIRB, VHF, LifeSaver, maritime radar)
        - label: Platform Hardware Layer
          detail: >-
            Three UAS airframes manufactured in-house using European composites and electronics. Propulsion options
            support electric, combustion, and heavy-fuel configurations.
          items:
            - AR3 EVO (25 kg MTOW, 22h FW / 14h VTOL, 4.2 m span, catapult / VTOL / parachute)
            - AR5 (180 kg MTOW, 20h endurance, 7.3 m span, twin-engine, ATOL, ITAR-free)
            - ARX (swarm deployment platform — full specs undisclosed)
    approximationNotes: >-
      Layer ordering reflects logical separation, not physical deployment. ATLAS is cloud/edge-hybrid; exact cloud
      provider not publicly confirmed. VBN chipset identified as NVIDIA SoC from the Head of Data & AI blog post (2024);
      specific SoC model not disclosed.
