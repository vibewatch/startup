      - number: '8.2'
        title: Comparable valuation and market benchmarks
        blocks:
          - type: paragraph
            body: >-
              Public defence-technology benchmarks frame the outer bounds for Tekever's valuation. AeroVironment (AVAV),
              the closest listed peer, reported approximately $717 million in fiscal year 2024 revenue and trades at a
              market capitalisation in the $5–6 billion range, implying a price-to-sales multiple of roughly 7–9×. Elbit
              Systems, Israel's dominant defence electronics group with $6.4 billion in 2024 revenue, trades at 1.5–2×
              revenue — reflecting its larger scale and lower growth profile. The divergence illustrates the bifurcation
              between software-enabled, high-growth tactical UAS businesses and diversified prime contractors: investors
              price growth velocity and software intensity, not just volume of hardware delivered.


              Private-market comparables amplify the software-premium argument. Anduril Industries, the US defence AI
              start-up, achieved a $14 billion valuation in its 2024 Series E — roughly 20–25× its estimated $500–700
              million run-rate revenue, driven by Lattice OS AI integration and sovereign customer concentration in the
              US Department of Defense. Shield.AI, with its autonomous AI pilot technology, was valued at approximately
              $2.7 billion in a 2024 Series F. Both commanded multiples materially above pure hardware peers because
              investors were pricing AI-software flywheel value alongside government programme lock-in.


              Applied to Tekever, a £1 billion+ entry valuation requires either (i) estimated annual revenue already
              above £80 million at a 12–15× P/S multiple, (ii) a forward-looking valuation anchored on OVERMATCH
              full-execution revenue of £80–100 million per annum from year 2, or (iii) a strategic control premium that
              a sovereign buyer would pay above comparable-set multiples. None of these scenarios is independently
              verifiable from public evidence, making the valuation investment-grade only for participants who can
              access private data-room financials to anchor the revenue denominator.
            claimRefs:
              - CV013
              - CV014
              - CV015
