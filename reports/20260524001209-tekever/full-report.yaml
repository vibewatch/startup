      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The buyer-user-payer map is more institutional than commercial SaaS. Buyers are typically ministries of
              defence, armed-service branches, coast guards, border and interior authorities, or EU agencies such as
              EMSA; the operational users are pilots, mission crews, ISR analysts, and command staff who need persistent
              data rather than just airframes. Payers sit in defence-procurement budgets, maritime-safety agency
              budgets, or broader sovereign industrial programmes that link capability procurement to local
              manufacturing and security of supply. Tekever’s public evidence supports that pattern: EMSA is a
              pan-European maritime buyer; the UK government is simultaneously a capability sponsor and an
              industrial-policy actor; and Tekever’s US office is framed as a support and proximity move, not proof that
              the company’s core market has shifted away from Europe. Adoption usually starts when a buyer needs
              wider-area coverage or faster ISR output than crewed patrol can deliver economically, then moves through
              funding approval, procurement, airspace and integration work, and finally into repeat service or
              manufacturing commitments. That path rewards vendors that can combine aircraft, sensors, data links,
              operating support, and sovereign production footprints rather than selling standalone hardware.
            claimRefs:
