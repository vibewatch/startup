      - number: '7.2'
        title: Defence Procurement Concentration and Customer Dependency
        blocks:
          - type: paragraph
            body: >-
              OVERMATCH is the defining strategic risk for Tekever investors. The £400M five-year programme was
              announced simultaneously with the unicorn valuation, making the two structurally inseparable: a material
              programme reduction would directly impair the investment thesis. EMSA's AR5 framework agreement is the
              second confirmed revenue pillar, but its disclosed value is materially smaller. Customer concentration in
              a single UK government programme is at the high end of the risk spectrum for a defence-tech company at
              this stage. Historical UK MoD procurement demonstrates that long-duration contracts can be restructured:
              spending reviews in 2010 and 2015 both involved significant uncrewed aircraft programme changes. OVERMATCH
              benefits from meaningful political protection — it was endorsed at Prime Minister level and positioned as
              a domestic industrial policy success — which raises the political cost of cancellation but does not
              eliminate it. Tekever's QinetiQ strategic MOU provides additional capability development relationships,
              but neither the MOU value nor any alternative revenue source has been disclosed at a level that would
              offset OVERMATCH exposure. The dependency map illustrates revenue and capability linkages and the primary
              risk transmission paths from programme disruption to financial impairment.
