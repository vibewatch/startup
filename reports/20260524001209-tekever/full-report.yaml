      - number: '4.3'
        title: Cost structure, capex drivers, and margin visibility
        blocks:
          - type: paragraph
            body: >-
              Tekever's cost structure reflects a hardware-plus-software defence company with significant manufacturing
              ambitions. The major cost drivers are identifiable even without audited accounts. R&D spending is the
              primary declared use of Series B proceeds, with the raise explicitly earmarked for product innovation,
              enhancing current UAS platforms, and developing new product lines. Production ramp-up is the second major
              driver: the Swindon factory (254,000 sq ft) is the UK's largest planned drone production facility and
              represents a multi-year fixed-asset build-out. The Cahors, France industrial site (announced 2025,
              operational start-up planned ahead of summer 2026) adds a second major manufacturing footprint. The West
              Wales Airport UAS Training School, operational since January 2026, adds a third infrastructure commitment.
              Taken together, the infrastructure spend implied by OVERMATCH, France, and Wales is consistent with a
              company investing heavily ahead of revenue.


              The software component — the ATLAS AI platform — has a fundamentally different cost profile from the
              hardware. Once developed, ATLAS scales with relatively low marginal cost per customer, which is a positive
              margin dynamic. The Spain MOI contract explicitly includes ATLAS platform access alongside hardware and
              training, suggesting a bundled pricing model where software is not separately priced but is packaged with
              system delivery. The EMSA contract focuses on AR5 hardware and mission operations. Neither contract
              discloses gross margin, contribution margin, or software attach rate.


              The AAIB investigation report published in October 2021 documents a double engine shutdown of a Tekever
              AR5 Evolution Mk 2 (registration G-TEKV) over Kent in December 2020. The aircraft was recovered safely by
              the external pilot, and Tekever took hardware and software safety actions before returning the system to
              service. The incident is financially relevant because it represents the most visible public evidence of
              in-service reliability risk on the AR5 platform. Any material reliability issues would increase support
              costs, maintenance liabilities, and reputational exposure with institutional customers like EMSA. The
              company's safety actions appear to have resolved this specific failure mode, but the incident establishes
              a public record of platform safety events that future buyers and investors should probe.


              The May 2026 Project NYX announcement confirmed a £10 million UK Ministry of Defence investment across
              four industry partners (including Tekever) to develop Apache loyal-wingman drone designs. This is a
              development programme rather than a production contract, and represents incremental UK MoD engagement
              rather than a large revenue event. The RAF's additional £19 million investment in StormShroud AR3 drones
              (announced May 2025 at the same time as the unicorn round) is a more direct revenue signal and indicates
              that MoD is willing to commit additional budget beyond the initial StormShroud programme.
