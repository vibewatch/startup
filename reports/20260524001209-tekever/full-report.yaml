  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Export Controls, Sanctions, and End-Use Compliance
        blocks:
          - type: paragraph
            body: >-
              Tekever operates at the intersection of three distinct export-control regimes — UK ECJU, EU dual-use
              regulation 2021/821, and potentially US EAR — while deploying systems in active conflict. The AR3 and AR5
              are military-grade UAS classified under the UK Military List; every export to a non-UK destination
              requires a Standard Individual Export Licence or coverage under an Open General Export Licence. The
              current Ukraine deployment under Task Force Kindred is the most acute compliance flashpoint: ECJU imposes
              mandatory end-use monitoring obligations requiring Tekever to verify that supplied systems are not
              re-transferred to prohibited end-users. The Taiwan APEX partnership introduces a further jurisdictional
              exposure — Taiwan is not prohibited under current UK controls, but geopolitical events could rapidly
              change this status. US EAR de minimis thresholds may apply if US-origin controlled components exceed 25%
              by value in any single sub-system. Post-Brexit divergence between UK and EU controls means Tekever must
              maintain parallel compliance programmes for UK and French operations, doubling administrative overhead and
              creating reconciliation risk between two partially divergent classification frameworks. No public evidence
              of enforcement action has been identified, but the internal depth of Tekever's compliance programme cannot
              be assessed from public sources.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
