      - number: '3.3'
        title: MALE UAS Incumbents — Elbit Systems and General Atomics
        blocks:
          - type: paragraph
            body: >-
              Elbit Systems is Tekever's most relevant large-scale European competitor. With approximately $5.6 billion
              in 2023 revenue and strong existing relationships across European NATO members, Elbit brings both product
              depth and institutional credibility that Tekever cannot match at its current scale. The Hermes 900
              Starliner — Elbit's flagship MALE UAS — achieves 36-hour endurance at 30,000 feet ceiling with a 180
              kilogram payload capacity, substantially exceeding the AR5's specifications in mission duration and
              payload, but at a significantly higher acquisition and operating cost. Elbit competes across both maritime
              surveillance and land ISR, and its growing presence in European defense programs (including UK and EU
              markets) means it is a direct competitive pressure for Tekever's expansion ambitions. Critically, Elbit
              lacks Tekever's Europe-domiciled advantage for EU industrial participation and EDA program funding, which
              gives Tekever a structural European procurement advantage for contracts requiring EU-sourced capability.
              General Atomics' MQ-9A Reaper is a MALE-class system with 27-hour endurance and an estimated unit cost of
              $32 million — placing it at an entirely different price tier from Tekever's platforms. General Atomics
              operates almost exclusively through the US DoD and US export approval process, making its competitive
              relevance for Tekever primarily in the largest NATO MALE UAS programs rather than the maritime patrol and
              smaller-scale ISR segment where Tekever competes. Baykar's TB2 and TB3 represent a more directly
              disruptive threat in the cost-driven export market segment.
