      - number: '3.4'
        title: Export-Market Challengers and European Peers
        blocks:
          - type: paragraph
            body: >-
              Baykar's Bayraktar TB2 is the most operationally significant and price-disruptive competitor Tekever faces
              in European export markets. The TB2 is estimated to cost approximately $5 million per unit (including
              ground systems), a price that undercuts General Atomics and Elbit while offering a combat-proven,
              medium-altitude platform with 27-hour endurance. As of 2025–2026, over 30 countries operate the TB2,
              including EU NATO members Poland, Latvia, and Albania — all geographies where Tekever's AR5 competes.
              Turkey's geopolitical neutrality posture through 2022–2024 created some procurement hesitation among NATO
              members, but the platform's Ukraine war track record has sustained demand. The TB2's principal limitation
              for maritime ISR — Tekever's home segment — is its medium-altitude profile and ground-based EO sensor
              suite, which is less optimized for coastal and ocean patrol than Tekever's ATLAS-integrated AR5 maritime
              platform. However, for land-based tactical ISR where Tekever's AR3 EVO competes, the TB2's combat-proven
              autonomy and lower unit economics create real competitive pressure. Schiebel's Camcopter S-100 is the
              closest direct analog to Tekever in European maritime ISR. The S-100 is an Austrian-built VTOL
              helicopter-type UAS with 10+ hour endurance and approximately 50 kg payload, and it is in active naval
              service with 14+ navies globally. Schiebel's VTOL architecture suits ship-launched operations that
              Tekever's fixed-wing AR5 cannot serve, creating a meaningful product differentiation at the ship
              integration level. Tekever's AR5 is better suited for land-based coastal launch and longer coastal transit
              missions. Among broader European peers, the EU-funded Eurodrone (Airbus/Leonardo/Dassault/ Indra
              consortium) is a MALE-class program targeting 40-hour endurance but remains in development as of 2026 —
              not yet a deployed competitive threat. Tekever's European domicile, EMSA approval, and Ukraine operational
              record establish a meaningful credibility gap that is difficult for non-European competitors to close
              quickly.
