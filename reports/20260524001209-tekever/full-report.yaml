      - number: '5.5'
        title: Compliance, trust controls, and technical risk
        blocks:
          - type: paragraph
            body: >-
              Tekever operates across a highly regulated intersection of civilian airspace regulation (EASA in Europe),
              export control (ITAR-free designation for key products), data security (handling sensitive ISR video and
              positional intelligence), and autonomous-systems ethics (EU AI Act). The AR5 is explicitly marketed as
              ITAR-free, produced in Europe under EASA-compliant manufacturing standards, which is a strategic
              differentiator in markets where US-origin technology restrictions apply. EASA regulations govern UAS
              operations across EU member states and require airworthiness standards for systems of the AR5's weight
              class.


              On data security, ATLAS is described as providing browser-based mission intelligence with customisable
              approval workflows and role-based access — essential for sovereign military and law-enforcement customers
              who require strict data custody. However, no external audit, ISO 27001 certificate, or independent
              penetration-testing record for the ATLAS platform has been publicly disclosed, representing a diligence
              gap for institutional buyers.


              The EU AI Act, which entered into force in 2024, classifies AI systems used in critical infrastructure and
              law enforcement as high-risk, requiring conformity assessments, technical documentation, and ongoing
              monitoring. Tekever's AI stack — particularly the autonomous target detection and tracking modules within
              ATLAS and the VBN system — likely falls within high-risk categories. The company's own Head of Data and
              AI, Nicolas van Hanxleden Houwert, acknowledged in a public blog post that EU AI Act compliance is an
              increased necessity for the company, though specific compliance milestones have not been publicly
              disclosed.


              A further technical risk is the reliance on NVIDIA silicon for edge AI processing aboard the drones.
              Export controls on advanced semiconductors, particularly GPU and AI SoC devices, create a potential
              supply-chain vulnerability in geopolitical stress scenarios. The GNSS-denied VBN system partially
              mitigates this by reducing dependence on satellite infrastructure, but it introduces its own failure mode:
              visual navigation degrades in low-texture environments (open ocean, desert, dense cloud cover) where
              visual landmarks are sparse or obscured. These limitations are not publicly disclosed by Tekever.
            claimRefs:
              - CE029
              - CE030
              - CE031
              - CE032
              - CE033
              - CE034
              - CE035
