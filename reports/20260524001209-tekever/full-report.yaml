  - id: TP001
    title: Competitor Profile Table
    enumerationScope:
      coverage: partial
      basis: >-
        Seven primary competitor categories and status-quo substitutes relevant to Tekever's maritime ISR, tactical ISR,
        and AI-autonomous defense mission segments as of May 2026; excludes loitering munitions specialists and airborne
        early warning platforms not directly competing in Tekever's served markets.
    columns:
      - Competitor / Alternative
      - Category
      - Scale / Funding
      - Target Segment
      - Key Differentiation vs. Tekever
      - Primary Limitation vs. Tekever
    rows:
      - - AeroVironment (Puma AE / JUMP 20)
        - Direct peer (maritime ISR / tactical)
        - Public (AVAV); ~$609M revenue FY2024; $3B+ market cap
        - NATO/allied maritime patrol, tactical ISR, US DoD
        - Proven NATO procurement track record; established STANAG certification; larger scale
        - US ITAR constraints on EU sales; limited European commercial footprint; higher price tier
      - - Schiebel (Camcopter S-100)
        - Direct peer (maritime VTOL ISR)
        - Private (Austrian); est. ~€100M revenue; 14+ navy customers
        - Naval ship-launched operations; European coast guard; maritime patrol
        - VTOL ship-integration advantage; proven in 14+ navies; European-made
        - Fixed-wing architecture serves longer-range coastal patrol better; Schiebel no AI analytics layer
      - - Baykar (Bayraktar TB2)
        - Export-market challenger (MALE tactical)
        - Private (Turkish); est. $1–2B revenue; 30+ country customers
        - Eastern European defense; NATO export markets; export-price-sensitive buyers
        - Low unit cost (~$5M estimated); Ukraine combat-proven; 30+ nation installed base
        - Not optimized for maritime ISR; Turkey's geopolitical positioning creates alliance risk
      - - Elbit Systems (Hermes 900 / Hermes 450)
        - MALE incumbent (European operations)
        - Public (ESLT); ~$5.6B revenue 2023; NASDAQ listed
        - NATO members; European defense ministries; maritime patrol (larger programs)
        - Scale, engineering depth, existing EU defense relationships; Hermes 900 MALE-class capability
        - Much higher price tier; Israeli company limits EDA eligibility; less AI-first architecture
      - - General Atomics (MQ-9A Reaper)
        - MALE incumbent (US/US-ally only)
        - Private (Linden Blue); est. multi-billion revenue; US government primary
        - US DoD; US-treaty allies; largest NATO MALE programs
        - 27-hour endurance; proven US DoD platform; heavy payload (~1,700 kg)
        - ~$32M unit cost; US ITAR severely restricts EU sales; no EU domicile or EDA eligibility
      - - Shield AI (V-BAT)
        - AI-autonomy peer (maritime / tactical VTOL)
        - Private; raised $500M+; est. $2.8B valuation (2022)
        - US DoD maritime patrol; special operations; GPS-denied ISR
        - Hivemind AI autonomous pilot; V-BAT VTOL for ship operations; US DoD validated
        - Primarily US-focused; limited European civil maritime presence; different regulatory context
      - - Anduril Industries (Ghost-X / Lattice OS)
        - AI-autonomy peer (autonomous defense)
        - Private; raised $1.5B; est. $14B valuation (2024)
        - US DoD; allied militaries; autonomous interceptors; loitering munitions; battlefield AI
        - Lattice OS AI C2 at scale; largest autonomous defense capital base; Ghost-X tactical UAS
        - Primarily US DoD; Ghost-X competes at a different mission tier; limited EU ISR presence
      - - Manned maritime patrol aircraft (P-8, C295)
        - Status-quo substitute
        - Established market; Airbus/Boeing; multi-billion fleet programs
        - Anti-submarine warfare; long-range ocean patrol; heavy payload missions
        - High payload and range for heavy ASW mission; crewed decision-making for sensitive ops
        - $5,000–$15,000+/flight hour vs UAS cost; large crew and infrastructure requirements
