          - type: callout
            title: Third-party SAR and SATCOM dependencies limit supply resilience
            body: >-
              Despite vertical integration in airframe and software, two mission-critical capabilities — SAR (IMSAR
              NSP-3) and BRLOS SATCOM (Viasat) — depend on US-origin technology vendors. In a defence export context or
              geopolitical stress scenario, US export-control restrictions or vendor prioritisation could disrupt
              Tekever's ability to deliver fully configured platforms. The GAMASAR development reduces the IMSAR
              dependency over time, but Viasat SATCOM replacement would require either a European SATCOM alternative or
              Starlink (which carries its own geopolitical concentration risk).
            calloutType: risk
            claimRefs:
              - CE019
              - CE020
              - CE021
