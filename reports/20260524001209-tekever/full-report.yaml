      - number: '7.3'
        title: UK and France Manufacturing Execution Risk
        blocks:
          - type: paragraph
            body: >-
              Simultaneous greenfield factory buildouts in Swindon and Cahors represent the most concrete near-term
              execution risk. The Swindon factory is a greenfield development: as of May 2026, no public evidence of
              planning permissions, construction commencement, or supply-chain fit-out has been identified. The Cahors
              industrial site was unveiled in early 2026 with an ambitious operational start-up target ahead of summer
              2026 — a timeline that is aggressive for any new defence manufacturing facility requiring regulatory
              approval, workforce onboarding, and equipment commissioning from scratch. UK industrial capacity for
              specialised UAV manufacture is structurally constrained, and Tekever must recruit and train a significant
              technical workforce in a tight UK defence labour market while delivering against OVERMATCH milestones.
              Companies House filing data for Tekever's UK subsidiary confirms limited pre-existing UK operational
              infrastructure, confirming that OVERMATCH delivery requires an almost entirely net-new UK manufacturing
              capability. Cross-border governance complexity — dual-country employment law, parallel DGA and MoD
              engagement, consolidated financial oversight — adds additional execution overhead. The operational risk
              register captures the principal risks, likelihood ratings, and interim mitigations for this buildout
              phase.
            claimRefs:
