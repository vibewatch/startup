  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Overview and Segmentation
        blocks:
          - type: paragraph
            body: >-
              Tekever's customer base as of 2026 is anchored in two proven segments and two emerging ones. The primary
              production segment is sovereign defence, led by the UK Ministry of Defence through the RAF StormShroud
              programme (AR3, electronic warfare), Project NYX (British Army, next-generation autonomous capability),
              and the DSTL institutional collaboration. The OVERMATCH framework — £400 million committed over five years
              — is the largest single customer relationship by disclosed contract value in Tekever's portfolio.
              Ukraine's Task Force Kindred, a UK-led programme operating AR3 in active combat, contributes over 10,000
              documented flight hours of operational proof and further deepens the UK government customer relationship.


              The second established segment is civil maritime surveillance, led by EMSA's €30 million AR5 framework
              contract. EMSA has been a recurring customer since at least 2017, making it the longest-tenure customer
              relationship in the portfolio. Below the EMSA headline, national maritime authorities including the
              Italian Coast Guard and Gulf of Genova port authority have participated in live operational deployments
              under the EMSA framework. Portugal's national coastal surveillance authority is an additional domestic
              sovereign customer.


              Homeland security represents the third, smaller segment: Spain's Ministry of Interior signed a €5 million
              AR3 contract for border patrol and security applications, confirming that Tekever can win European
              government procurement beyond the UK and the EMSA channel. Partner-channel customers (Aerial Robotix in
              Nigeria under the Deep Blue maritime domain awareness project) and a nascent US special operations
              engagement (USSOCOM exercise, no production contract as of 2026) round out the portfolio. All known
              customers are government or quasi-government buyers — there are no confirmed commercial enterprise or
              private-sector customers across any segment.
            claimRefs:
              - CU018
              - CU028
              - CU036
