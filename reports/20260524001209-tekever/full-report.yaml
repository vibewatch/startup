      - number: '8.4'
        title: Bull, base, and bear scenario analysis
        blocks:
          - type: paragraph
            body: >-
              The bull case assumes full OVERMATCH execution at the framework ceiling, France programme ramping to €50
              million per annum revenue by 2028, Project NYX British Army contract converting to series production, and
              US SOF market penetration generating incremental revenue. Under this scenario Tekever could reach £180–220
              million in annual revenue by 2027–2028, supporting a 15–20× P/S multiple for an AI-enabled defence
              platform with dual sovereign anchors — implying an enterprise value of £2.7–4.4 billion. This scenario
              requires no OVERMATCH slippage, no France execution risk materialising, and intact founder leadership
              through the most capital-intensive phase of growth; each condition is individually plausible but the joint
              probability is moderate.


              The base case models OVERMATCH at 60 percent utilisation (£240 million drawn over five years, or £48
              million per annum average), EMSA renewal at the current €30 million rate, and France ramping slowly to
              €20–30 million by 2028. Revenue of £80–110 million per annum by 2027 at a 12–15× P/S multiple — consistent
              with the peer range for a high-growth defence AI platform — implies an enterprise valuation of £0.96–1.65
              billion. The current £1 billion+ mark is plausibly within the base-case range only if the revenue ramp
              starts quickly and OVERMATCH drawdown begins in 2025–2026.


              The bear case models OVERMATCH programme slippage of 12–24 months, France investment staying in build-out
              mode without contracted revenue, and no new customer wins of scale in 2026. Revenue of £30–50 million per
              annum at a 10–12× P/S multiple — a modest premium over AeroVironment's historical P/S trough — implies an
              enterprise value of £0.3–0.6 billion, a 40–70 percent markdown from the current £1 billion+ entry price.
              The bear case is not the central view but is material because public evidence cannot rule it out.
            claimRefs:
              - CV002
              - CV005
              - CV009
              - CV020
