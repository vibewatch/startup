chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, products, and business model
        blocks:
          - type: paragraph
            body: >-
              Tekever was founded in 2001 in Portugal by computer scientists and researchers specialising in artificial
              intelligence, machine learning, and distributed systems. The company was bootstrapped from day one and
              built its initial identity around intelligent, highly distributed autonomous systems rather than
              conventional aerospace hardware. That origins story matters because it explains the software-centric,
              AI-first product philosophy that distinguishes Tekever from legacy defence prime contractors and
              traditional UAS manufacturers.


              As of 2026 the core hardware portfolio spans three platforms. The AR3 is a tactical unmanned aircraft
              system designed for intelligence, surveillance, and reconnaissance in contested land and maritime
              environments. The AR5 is a fixed-wing UAS purpose-built for long-endurance maritime surveillance and has
              been in operational service since 2017 with EMSA and multiple national authorities across Europe. The ARX
              is the newest platform, positioned for emerging mission sets including crewed-uncrewed teaming. Alongside
              the hardware portfolio, the ATLAS AI-powered analytical intelligence platform provides mission-critical
              software: FPV video streaming, heatmap tracking, situational awareness, and AI-driven object detection
              that tie the hardware into actionable intelligence workflows. Two additional business units — Tekever
              Digital (digital transformation services) and Tekever Space (satellite systems and technologies) — extend
              the group beyond pure UAS.


              The business model is government and quasi-government procurement-centric. Public evidence points to a
              combination of long-term framework contracts (the €30 million EMSA agreement), single-programme contracts
              (€5 million Spain Ministry of Interior), and sovereign-partner programmes (UK OVERMATCH at £400 million
              over five years). Revenue split between defence and civil/maritime segments is not publicly disclosed. The
              company's own materials describe a "uniquely profitable, sustainable business model" in the words of
              Ventura Capital but provide no audited financials to support that characterisation.
