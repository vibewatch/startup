- id: growth-drivers-and-constraints
  title: Growth drivers, adoption constraints, contradictions, and diligence gaps
  body: 'The strongest growth driver is not hobbyist or inspection-drone adoption; it is the European shift toward rearmament, sovereign supply chains, and C4ISR-heavy spending. SIPRI, McKinsey, EDA-linked reporting, and Strategy& all point in the same direction: defence budgets are expanding, equipment procurement is rising sharply, and ISR-heavy categories are growing faster than defence spend overall. This should favour vendors that offer European or ITAR-light capability, maritime relevance, and integration with command workflows. Tekever matches that demand pattern unusually well through AR5 maritime patrol, border surveillance, search and rescue, and its collaborative-defence UK programmes. The constraints are equally real. Bruegel highlights chronic fragmentation and poor joint procurement; the European Parliament and Belfer both emphasise governance, export-control, and human-control debates; and EASA plus EUROCONTROL show that BVLOS scaling still depends on designated airspace and
    certified services, not just a permissive narrative around autonomy. The main analytical contradiction is market sizing: public Europe estimates span from USD 5.0 billion to USD 14.74 billion for apparently similar geographies and periods. The main diligence gap is therefore not whether demand exists, but exactly how much of that demand is serviceable by Tekever’s Europe-centred mix of defence ISR, maritime surveillance, and dual-use services.'
