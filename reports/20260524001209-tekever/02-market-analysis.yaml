chapter:
  number: 2
  title: Market Analysis
  summary: Tekever sits inside a defence-ISR and maritime-surveillance market that is being pulled forward by European rearmament, sovereignty policy, and faster-growing C4ISR budgets rather than by generic consumer-drone demand. Public sizing supports a meaningful market, but Europe-specific estimates conflict enough that the safest underwriting stance is to use multiple lenses and treat Tekever’s visible programmes as a floor, not a precise SAM or SOM.
sections:
- id: market-boundary
  title: Market boundary, included spend, and status-quo substitutes
  body: 'Tekever’s relevant market is not “all drones.” The included spend is the subset of defence, security, and agency budgets that buys persistent airborne intelligence, surveillance, and reconnaissance; maritime patrol and search-and-rescue UAS services; and autonomous collaborative capabilities that can plug into sovereign command workflows. NATO’s expenditure definition matters because it explicitly includes R&D, mixed civilian-military infrastructure, and joint procurement, so the budget pool is broader than aircraft line-items alone. Within that pool, Tekever’s public evidence clusters around fixed-wing ISR, maritime domain awareness, border surveillance, and AI-enabled collaborative defence missions rather than consumer, agriculture, or generic inspection workloads. The practical status quo is still a mix of crewed patrol aircraft, helicopters, manned coast-guard sorties, satellite-only tasking, and legacy UAV fleets. Tekever’s wedge is persistence and software-defined sensing:
    the AR5 is positioned for maritime patrol, search and rescue, and border surveillance, while public programme evidence on OVERMATCH and StormShroud links the company to autonomous collaborative defence workflows. That makes the chapter boundary broad enough to include dual-use maritime services, but narrow enough to exclude unrelated drone categories that would inflate TAM.'
  claimRefs:
