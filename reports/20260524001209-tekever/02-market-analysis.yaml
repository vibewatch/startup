- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - European rearmament and procurement growth
    - Positive
    - Near term
    - More budget headroom for ISR, autonomy, and maritime surveillance programmes
    - Track which budget lines convert into actual drone tenders
  - - C4ISR growing faster than baseline defence spend
    - Positive
    - Near to medium term
    - Favours sensing, data, and autonomy vendors over pure platform incumbents
    - Test whether Tekever wins software-rich missions rather than only airframe supply
  - - Sovereignty and security-of-supply push
    - Positive
    - Near term
    - Supports European or ITAR-light manufacturing footprints and local production commitments
    - Verify how much of Tekever’s BOM and production can be localised by market
  - - Fragmented procurement and national preferences
    - Negative
    - Persistent
    - Raises selling cost, lengthens cycles, and limits scale economies
    - Quantify deal-cycle length and country-specific certification or tender friction
  - - Autonomy governance and export-control debate
    - Negative
    - Persistent
    - Could slow collaborative-autonomy deployments or narrow allowed operating concepts
    - Map where human-in-the-loop requirements or export restrictions bite first
  - - BVLOS and U-space implementation lag
    - Negative
    - Near term
    - Even capable platforms need designated airspace, certified services, and safety cases to scale operations
    - Check which countries or mission areas have actually operationalised advanced airspace processes
  notes: This table combines drivers and constraints because the chapter’s core diligence question is not whether demand exists, but how quickly spend becomes deployable programmes.
