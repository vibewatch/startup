  evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: market sizing
    missingEvidence: A harmonised Europe defence-ISR drone dataset that reconciles what counts as UAV, military drone, BVLOS system, and service revenue across publishers.
    whyItMatters: The published Europe estimates used here span from USD 5.0 billion to USD 14.74 billion for near-term years, making any single SAM number look more precise than the evidence supports.
    diligencePath: Request management’s internal market-definition memo and compare it with customer budget categories, then normalise analyst estimates to the same geography and mission scope.
    relatedQuestionRefs:
    - QM009
    - QM025
  - type: missing-source
    severity: material
    topic: SAM and SOM isolation
    missingEvidence: A Europe-only pipeline or revenue split showing how much of Tekever’s demand comes from maritime surveillance, defence ISR, and dual-use agency services separately.
    whyItMatters: Public contracts prove demand but do not reveal the exact serviceable share or repeatability of each mission segment, so SOM remains a floor rather than a clean operating model.
    diligencePath: Ask for the company’s segmented backlog and pipeline by geography, mission type, and buyer class, then tie it back to disclosed programmes and tender calendars.
    relatedQuestionRefs:
    - QM025
  - type: stale
    severity: minor
    topic: operational regulation
    missingEvidence: Country-by-country evidence on which European states have actually operationalised the most useful BVLOS or U-space pathways for defence-adjacent operations.
    whyItMatters: The legal framework is visible, but deployment speed depends on live national implementation rather than the rulebook alone.
    diligencePath: Build a country matrix of designated airspace, USSP certification, and defence or maritime exemptions in Tekever priority markets before underwriting fast roll-outs.
    relatedQuestionRefs:
    - QM023
