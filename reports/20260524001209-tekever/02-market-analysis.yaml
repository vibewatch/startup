callouts:
- calloutType: insight
  title: The real tailwind is European sovereign ISR, not generic drone adoption
  body: The cleanest bull case is not “drones are growing,” but that European rearmament and C4ISR spending are rising faster than defence budgets overall while sovereignty policies reward local production and ITAR-light supply. Tekever’s public proof points line up with exactly that spend pattern.
  claimRefs:
  - CM021
  - CM024
  - CM045
  - CM046
- calloutType: risk
  title: Sizing precision is weaker than demand proof
  body: Public demand evidence is strong, but Europe market estimates vary too widely to treat any single TAM or SAM number as authoritative. The safer view is to use a range and anchor Tekever-specific conviction on visible programmes and buyer workflows instead of one analyst headline.
  claimRefs:
  - CM032
  - CM033
  - CM035
  - CM036
  - CM038
- calloutType: assumption
  title: Public SOM is a floor, not a ceiling
  body: The >€90 million annualised figure is only a floor from public programme values. It excludes undisclosed renewals, smaller sovereign projects, and any revenue from the company’s broader Digital and Space lines, so it should not be mistaken for a full revenue proxy.
  claimRefs:
  - CM002
  - CM038
