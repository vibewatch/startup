  rows:
  - - Defence ISR drones
    - Airframes, sensors, payloads, mission software, support, command integration, sovereign production tied to military needs
    - Consumer drones, crop-spraying UAVs, hobby accessories
    - MoD, air force, joint ISR, defence procurement budgets
    - Core Tekever AR3 and collaborative-defence wedge
  - - Maritime surveillance UAS services
    - Agency frameworks, aircraft systems, operators, maritime radar, EO/IR, AIS, SATCOM, rescue support
    - Crewed aviation operating cost not switched to UAS, unrelated port software
    - EMSA, coast guards, border and maritime-safety agencies
    - Core AR5 proof point and strongest dual-use use case
  - - Autonomous collaborative platforms
    - Electronic-warfare teaming, loyal-wingman or adjunct capability, autonomy software, rapid prototyping
    - Generic munitions, crewed-fighter procurement, counter-UAS-only spend
    - Air forces, defence innovation and ACP-style programmes
    - Relevant through OVERMATCH, StormShroud, and adjacent autonomy demand
  - - Dual-use security services
    - Border surveillance, fisheries control, law-enforcement sensing, environmental monitoring, sea rescue
    - Municipal inspection drones, media capture, enterprise site surveys
    - Interior ministries, border agencies, EU agencies, rescue authorities
    - Important adjacency that broadens SAM without turning it into all civilian drones
  - - Status-quo substitutes
    - Crewed patrol aircraft, helicopters, manned sorties, satellite-only tasking, legacy UAV fleets
    - Drone categories that do not solve persistent ISR or maritime awareness jobs
    - Existing operating budgets and legacy fleet owners
    - Substitute baseline that Tekever must displace on ROI and persistence
  notes: Boundary emphasises the mission budgets and workflows public sources actually support. Excluded categories are listed to avoid inflating TAM with adjacent drone activity.
