summary:
  headline: Tekever 是少见的欧洲 UAS 独角兽，已经经受战场验证，也有可信主权需求锚点；但在收入未经审计、OVERMATCH 框架尚未实际提款的情况下，£1B+ 入场价偏高，应先观察，等数据室验证财务逻辑。
