  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: audited-financials
      missingEvidence: >-
        Tekever's audited P&L, balance sheet, gross margin, EBITDA, and cash position for 2023 and 2024
        are not publicly available, though full accounts have been filed at Companies House. The profitability
        claim from Baillie Gifford and the company is unverified by public audit.
      whyItMatters: >-
        Without signed accounts, the profitability narrative cannot be verified. Standard financial underwriting
        (including margin path, debt-service coverage, and capital adequacy) is impossible from public sources alone.
      diligencePath: >-
        Request the full audited accounts from Companies House directly (available to companies to file) or from
        the company's data room; obtain management accounts with auditor sign-off for FY2023 and FY2024.
      relatedQuestionRefs:
        - QI001
        - QI016
        - QI021
    - type: private-evidence-only
      severity: blocking
      topic: OVERMATCH-revenue-schedule
      missingEvidence: >-
        The £400M OVERMATCH investment commitment is a company spend plan; the government fee schedule,
        milestone payments, and revenue contract attached to the programme are not publicly disclosed.
      whyItMatters: >-
        Without knowing the revenue schedule that funds OVERMATCH, it is impossible to assess whether operating
        cash flow covers the investment, or whether equity and debt must be used to bridge the gap.
      diligencePath: >-
        Request the OVERMATCH programme contract (or summary), milestone payment schedule, and government
        co-investment structure from the company or MoD counterpart.
      relatedQuestionRefs:
        - QI006
        - QI020
        - QI021
