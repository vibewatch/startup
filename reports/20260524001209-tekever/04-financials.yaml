company:
  name: Tekever
chapter:
  number: 4
  title: Financials
  summary: >-
    Tekever's financial profile is unusually visible for a private company at its scale. Multiple investor and
    government sources confirm profitability, a £1B+ valuation, a €70M Series B, and a confirmed Barclays bank charge
    registered in 2022. Publicly visible revenue anchors include a €30M EMSA maritime contract, a €5M Spain MOI
    deal, a €100M France commitment, and approximately £270M in UK government purchases of Tekever platforms for
    Ukraine since 2022. The OVERMATCH £400M programme and a new 254,000 sq ft Swindon production facility signal
    heavy capex dependence on sovereign programme funding. Audited P&L, cash position, gross margin, and burn rate
    remain private, making quantitative underwriting impossible without a data room.
sections:
  - id: section-1
    title: 'Revenue model and public traction: sovereign contracts dominate, diversification limited'
    body: >-
      Tekever's publicly visible revenue model is built almost entirely on government and quasi-government
      procurement. The company generates revenue through four identifiable channels: platform sales (selling AR3
      and AR5 hardware systems to government buyers), services and support (multi-year maintenance and training
      contracts bundled with hardware delivery), intelligence-as-a-service (the ATLAS software platform and
      UAS-as-a-Service subscription-style arrangements for border surveillance and maritime monitoring), and
      programme delivery (long-term sovereign capability-building contracts like OVERMATCH and StormShroud that
      combine hardware, software, and operational support).


      The cleanest quantitative evidence on contract revenue comes from three primary sources. The European
      Maritime Safety Agency (EMSA) framework contract signed for AR5 maritime surveillance is valued at €30
      million, covers an initial two-year period with extensions to up to four years, and supplies two complete
      systems each comprising two UAS. Spain's Ministry of Interior signed a multi-purpose contract worth close
      to €5 million for AR3 systems, accessories, cameras, ATLAS platform access, and up to three years of
      training, delivered between 2024 and 2025. The UK government has disclosed that total purchases of Tekever
      platforms for Ukraine have reached approximately £270 million since 2022, including contributions through
      the International Fund for Ukraine. Those three data points — EMSA, Spain MOI, and UK Ukraine procurement
      — represent the floor of public contractual evidence, and they already sum to a substantial revenue base
      by European defence startup standards.


      Critically, Tekever's own Series B announcement described the company as "already profitable," and Baillie
      Gifford's investment manager Chris Evdaimon separately characterised Tekever as "a rapidly growing and
      already profitable company, a rare combination in defence, national security and space start-ups." Ventura
      Capital, the unicorn-round lead investor, described Tekever's business model as "uniquely profitable and
      sustainable." These are company-claimed and investor-claimed profitability signals, not audited accounts.
      However, the consistency of the profitability claim across multiple investor communications and its
      inclusion in Baillie Gifford's public-facing rationale for the Series B give it higher-than-average weight.
