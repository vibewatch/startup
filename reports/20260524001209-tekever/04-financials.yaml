  - id: TI005
    title: Public financial gaps table
    columns:
      - missing private metric
      - impact on underwriting
      - diligence path
    rows:
      - - Audited revenue, gross margin, and EBITDA for 2023 and 2024
        - Cannot confirm scale, margin quality, or profitability without signed accounts
        - Request Companies House full accounts directly from company; request management accounts with auditor sign-off.
      - - Revenue mix by stream (hardware vs software vs services vs programme)
        - Cannot assess revenue quality, concentration, or recurring fraction without segment data
        - Request revenue waterfall by stream, geography, and customer for FY2023 and FY2024.
      - - Cash and equivalents, burn rate, and runway
        - Capital adequacy cannot be assessed; OVERMATCH investment commitment creates liquidity pressure
        - Obtain treasury dashboard, quarterly cash bridge, and board runway scenarios under base and high-capex assumptions.
      - - Barclays debt facility terms
        - Unknown facility size, covenants, interest rate, and maturity create financial risk
        - Request facility agreement, drawdown schedule, covenant package, and any waiver history.
      - - OVERMATCH programme revenue schedule
        - The £400M is a company spend commitment; the contracted revenue that funds it is not public
        - Request OVERMATCH milestone payment schedule, government co-investment structure, and break-even timeline.
      - - ATLAS software ARR and retention
        - Recurring software economics drive valuation premium; no standalone ATLAS metrics are public
        - Request ATLAS ARR, active customers, churn, and gross margin separated from hardware revenue.
      - - Per-unit manufacturing cost and gross margin for AR3 and AR5
        - Platform margin cannot be assessed without cost-of-goods data on hardware systems
        - Request bill of materials, standard cost card, and historical margin trend for each platform.
    notes: >-
      These gaps represent the minimum private data requests needed to complete standard financial diligence.
      The AAIB event record for the AR5 also warrants a request for the full maintenance and reliability log
      and current CAA airworthiness certificate status.
