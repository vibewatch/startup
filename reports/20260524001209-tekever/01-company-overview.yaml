  - id: section-3
    title: Funding history, valuation, and investor map
    body: >-
      Tekever's capital history is now in two clearly separated phases: a Series B in late 2024 that brought in
      strategic institutional capital, followed by a unicorn-confirming round in May 2025 that reset the valuation
      above £1 billion. The Series B was a €70 million round led by Baillie Gifford (known as an early backer of
      Airbnb, Spotify, and SpaceX) and the NATO Innovation Fund (representing all 24 NATO allies), with NSSIF,
      Crescent Cove, Iberis Semper, and Cedrus Capital also participating. The company was advised by The Growth
      Stage and Houlihan Lokey during that process.


      The unicorn round, announced in May 2025 alongside the OVERMATCH programme, was fully subscribed by existing
      investors led by Ventura Capital, with Baillie Gifford, NATO Innovation Fund, Iberis Capital, and Crescent
      Cove all continuing their support. The round confirmed a valuation above £1 billion, making Tekever
      Portugal's seventh unicorn. Multiple independent sources corroborate the milestone including tech.eu,
      TechFundingNews, econews.pt, NSSIF's case study, and the NATO Innovation Fund's own press release.


      The investor quality is notable for a company of this stage and geography. The combination of Baillie
      Gifford (long-duration public and growth equity), NATO Innovation Fund (multi-government strategic alignment),
      NSSIF (UK government national-security mandate), and Crescent Cove (Silicon Valley defence specialist) gives
      Tekever an unusually well-connected strategic support structure. Ventura Capital's characterisation of the
      business model as "uniquely profitable and sustainable" is a strong company-claimed signal, but the absence
      of audited financials means this cannot be independently verified.
    claimRefs:
