    - type: private-evidence-only
      severity: blocking
      topic: financials
      missingEvidence: >-
        Audited revenue, ARR, gross margin, EBITDA, and cash burn for Tekever are not publicly available. Ventura
        Capital describes the model as "uniquely profitable and sustainable" but no independent verification exists.
      whyItMatters: >-
        No valuation underwriting or investment-stage judgment is possible without private financials. The gap
        directly blocks any quantitative assessment of business quality.
      diligencePath: >-
        Request audited financial statements and management accounts for at least three years from the company
        directly; cross-reference with investor data rooms.
      relatedQuestionRefs:
        - QO020
    - type: private-evidence-only
      severity: material
      topic: cap-table
      missingEvidence: >-
        Individual ownership percentages for Ventura Capital, Baillie Gifford, NATO Innovation Fund, NSSIF, Crescent
        Cove, Iberis, and management / employee pool are not publicly disclosed.
      whyItMatters: >-
        Without knowing ownership structure, preference stack, and liquidation mechanics, investment economics and
        dilution risk cannot be assessed.
      diligencePath: >-
        Obtain full cap table, shareholder agreements, and preference waterfall from the company or lead investor.
      relatedQuestionRefs:
        - QO005
      relatedTableRefs:
        - TO003
