callouts:
  - calloutType: strength
    title: Battlefield-proven AI autonomy with unique operational data
    body: >-
      No European peer has accumulated comparable continuous-combat ISR data at scale. The AR3's 10,000+ combat
      hours in Ukraine create a product-iteration flywheel and customer-confidence moat that cannot be replicated
      in test ranges or simulations, and the £3B+ Russian assets claim is independently echoed by investor
      materials and government announcements.
    claimRefs:
      - CO010
      - CO011
      - CO032
  - calloutType: strength
    title: Exceptional strategic investor and government-partner alignment
    body: >-
      NATO Innovation Fund (representing 24 allies), UK government NSSIF, and Baillie Gifford alongside Ventura
      Capital gives Tekever a capital structure that is simultaneously financial, strategic, and geopolitically
      credible. This mix is very rare for a private defence-tech company of this size.
    claimRefs:
      - CO008
      - CO009
      - CO032
      - CO034
  - calloutType: risk
    title: Private-company financial opacity is a first-order diligence gap
    body: >-
      Revenue, gross margin, ARR, and cap-table are not publicly disclosed. Investor characterisations of the
      business model as "uniquely profitable and sustainable" are strongly positive signals but are unaudited
      company-claimed data. Any valuation underwriting requires private-room financials.
    claimRefs:
