callouts:
  - calloutType: recommendation
    title: Track at medium confidence — buy requires data-room access
    body: >-
      Tekever earns a Track recommendation at medium confidence. The strategic asset case is among the
      strongest in European defence-tech: battle-proven UAS, dual sovereign anchors, and AI-software
      positioning justify a premium valuation frame. However, the £1 billion+ entry price is stretched
      relative to the independently verifiable evidence base. A move to Buy requires audited revenue
      confirming a credible base above £60–80 million per annum, clarity on OVERMATCH drawdown schedule
      for the first 18 months, and cap-table transparency sufficient to model common-equity returns.
    claimRefs:
      - CV001
      - CV017
      - CV032
      - CV034
      - CV040

  - calloutType: risk
    title: OVERMATCH framework is a ceiling, not a committed order book
    body: >-
      The headline £400 million UK OVERMATCH figure is a framework commitment — a maximum spend
      authorisation over five years. Actual task-order issuance and spend are discretionary. This
      distinction matters enormously for the valuation case: a £400 million framework that achieves
      60 percent utilisation over five years generates £48 million per annum average revenue, not
      £80 million. Investors must model the drawdown profile independently and treat the framework
      ceiling as an upper bound, not a baseline.
    claimRefs:
      - CV002
      - CV020
      - CV038

  - calloutType: insight
    title: Sovereign validation premium over commercial comps is real but bounded
    body: >-
      NATO Innovation Fund participation and the Prime-Minister-level OVERMATCH announcement provide
      a sovereign-credibility premium that justifies a valuation above pure commercial defence-tech
      comparables. However, this premium has limits: Palantir trades at 18–20× revenue because its
      software moat is independently verifiable through public filings; Tekever's software-premium
      argument cannot be confirmed without audited revenue-split data showing what share of total
      revenue is attributable to ATLAS-platform licences versus hardware delivery. The premium is
      real; its magnitude is uncertain.
    claimRefs:
      - CV004
      - CV018
      - CV022
      - CV031

