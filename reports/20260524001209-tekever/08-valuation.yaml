company:
  name: Tekever
chapter:
  number: 8
  title: Valuation
  summary: >-
    Tekever crossed the £1 billion valuation threshold in May 2025 on the back of a £400 million UK OVERMATCH
    framework, €100 million France commitment, and battle-hardened Ukraine combat-flight evidence, but audited
    financials remain private, the OVERMATCH framework has not yet converted to contracted order book, and the
    cap-table structure is opaque. A track recommendation at medium confidence reflects the compelling strategic
    asset story offset by insufficient revenue corroboration and preference-stack uncertainty at the current
    entry price.

sections:
  - id: section-1
    title: Investment thesis and anti-thesis
    body: >-
      The bull thesis for Tekever rests on three interlocking legs. First, the company has accumulated
      rare battle-proven pedigree: more than 10,000 AR3 operational flight hours in Ukraine provide
      in-service validation that no laboratory certification can replicate, a credential that shortens
      procurement cycles with NATO allies who prioritise combat-tested capabilities. Second, the UK
      OVERMATCH programme — a £400 million, five-year framework agreed at Prime Minister level —
      represents the largest sovereign UAS commitment to a European scale-up yet announced, and the
      France €100 million industrial build-out adds a second major sovereign anchor before the
      programme has fully ramped. Third, Tekever's AI-software-centric architecture — the ATLAS
      platform for mission management, object detection, and situational awareness — justifies a
      software-company valuation premium above pure hardware OEM peers; defence AI software
      commands 15–25× revenue multiples in M&A, well above the 8–12× earned by tactical UAS
      hardware businesses of similar scale.


      The anti-thesis is equally weighty. Tekever has filed no audited accounts with UK Companies
      House, making it impossible to independently verify the revenue base underpinning the £1 billion+
      valuation. The OVERMATCH commitment is a framework ceiling, not a guaranteed order book; actual
      spending is discretionary within the five-year window, and no programme delivery milestones have
      been publicly disclosed. Customer concentration is severe: the EMSA €30 million framework and
      the OVERMATCH programme together dominate the known contract base, and either programme
      cancellation or re-competition would meaningfully compress the revenue trajectory. The cap-table
      structure, preference terms, and dilution level from the May 2025 round are undisclosed,
      creating preference-overhang uncertainty that could substantially erode common-equity returns.
      Key-person dependence on founder-CEO Ricardo Mendes is material, and exit liquidity mechanisms
      — trade-sale or IPO — face structural barriers given the dual-use export-control regime and
      politically sensitive nature of the asset.
