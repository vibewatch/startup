  - id: section-3
    title: Financing context, cap-table uncertainty, and valuation mechanics
    body: >-
      The May 2025 round that triggered unicorn status was preceded by a €70 million growth-equity
      round in 2024 that brought in NATO Innovation Fund and Ventura Capital, among others. The
      cumulative raise history implies a multi-stage preference stack and anti-dilution provisions
      whose exact terms are unavailable in public filings. UK Companies House shows no annual accounts
      filed for the primary Tekever entity (company number 08684764) as of the 2026 run date. The
      filing history for that entity confirms incorporation in 2013 but reveals no income statement,
      balance sheet, or directors' report that would allow external revenue or EBITDA verification.
      This is not atypical for a private company at this stage, but it means that the investor
      characterisation of Tekever as "uniquely profitable" by Ventura Capital cannot be corroborated
      from public evidence.


      The OVERMATCH programme, framed as a £400 million five-year UK commitment made at Prime
      Minister level, is a framework arrangement rather than a binding order. The actual drawdown
      profile — the sequence and scale of task orders against the ceiling — is not publicly disclosed.
      In defence procurement, framework contracts commonly achieve 60–80 percent utilisation over
      their life when the underlying capability is operationally adopted, but can also be re-competed,
      restructured, or deferred without triggering contract-breach provisions. An implied annual revenue
      of £80 million per year (linear run-rate over five years) is the most optimistic framing; actual
      annual revenue is more likely to ramp from a lower base in years one and two as manufacturing
      and integration scale up.


      The France €100 million Tekever investment commitment and the Cahors industrial-site launch
      support the long-run revenue ramp narrative but represent capital deployment (facility build-out
      and local supply chain) rather than immediate contracted revenue. The dilution created by
      capital-intensive programme execution, particularly across two sovereign markets simultaneously,
      is an unresolved diligence item that affects common-equity return expectations at the current
      entry price.
