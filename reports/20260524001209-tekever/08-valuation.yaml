  - id: section-5
    title: Exit readiness, thesis-break triggers, and recommendation
    body: >-
      Tekever's most realistic near-term exit paths are a strategic trade-sale to a prime contractor
      seeking a validated AI-UAS capability (NATO-market Tier 1 or Tier 2 defence OEM), or a secondary
      transaction that provides early-investor liquidity ahead of a longer-horizon IPO. A public listing
      is theoretically possible but structurally difficult before 2028–2029 given dual-use export-control
      diligence, the need for three or more years of audited accounts for LSE or Euronext listing
      eligibility, and the current unprofitable-growth profile typical of platform ramp-up phases.


      The thesis breaks on any of three triggers: (1) formal OVERMATCH programme cancellation or
      de-scope that removes more than 30 percent of the framework ceiling, which would signal both
      revenue risk and operational readiness concerns; (2) departure of Ricardo Mendes without a
      credible CEO succession, which would undermine the sovereign-programme relationships he embodies;
      (3) evidence of a down-round or secondary-market transaction at below £800 million valuation,
      which would signal that sophisticated insiders have repriced the asset. A fourth softer trigger
      is the absence of any audited financial disclosure by end of calendar 2026, which would make
      the valuation case dependent entirely on investor confidence in company-claimed financials.


      The overall recommendation is Track at medium confidence with a high risk rating. The investment
      thesis is real and differentiated — Tekever has a unique position in the European sovereign UAS
      market that is unlikely to be replicated quickly by any NATO-aligned competitor. But the entry
      price of £1 billion+ is stretched relative to the independently verifiable evidence base. A
      move to Buy requires: access to audited revenue confirming a credible base above £60–80 million
      per annum; clarity on OVERMATCH drawdown schedule for the first 18 months; and cap-table
      transparency sufficient to model common-equity returns at the current preference stack. Absent
      those inputs, investors risk overpaying for a strategic narrative rather than a validated
      revenue-generating asset.
