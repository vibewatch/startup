callouts:
  - calloutType: risk
    title: "Efficacy Variability Constrains Broad Synthetic Replacement"
    body: >-
      While Pivot Bio's PROVEN 40 microbes consistently deliver early-season nitrogen, peer-reviewed findings from the
      University of Illinois indicate that atmospheric nitrogen contributions taper off during later reproductive stages.
      Because crop demand surges during late vegetative and grain-fill stages, biological inoculants cannot fully eliminate
      synthetic fertilizer without risking yield penalties under adverse weather conditions, cementing microbial nitrogen
      as a supplemental replacement rather than a standalone replacement.
    claimRefs:
      - CR001
      - CR002

  - calloutType: insight
    title: "Multiyear Price Locks Trade Margin Flexibility for Channel Stability"
    body: >-
      Pivot Bio's three-year price assurance agreement for the 2026, 2027, and 2028 growing seasons establishes fixed
      nitrogen pricing approximately 50% below synthetic fertilizer costs. While this program provides crucial budget
      predictability for farmers navigating volatile input markets, it commits Pivot Bio to absorbing unexpected biological
      fermentation cost spikes and caps upside if synthetic fertilizer prices surge.
    claimRefs:
      - CR010
      - CR011

