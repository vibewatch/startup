            title: Commercial Positioning Driven by Fertilizer Volatility
            body: >-
              Pivot Bio's commercial acceleration has been heavily catalyzed by external geopolitical shocks and natural
              gas price volatility affecting synthetic Haber-Bosch fertilizers. By pricing microbial nitrogen 50% below
              conventional fertilizer and offering three-year price locks, the company sells input cost certainty rather
              than disruptive yield premiums.
            calloutType: insight
            claimRefs:
