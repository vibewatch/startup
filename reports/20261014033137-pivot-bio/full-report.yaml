      - number: '2.3'
        title: Buyer Archetypes, Channel Distribution, and Frictionless Inoculation
        blocks:
          - type: paragraph
            body: >-
              Customer segmentation across row-crop farming centers on operating scale, risk tolerance, and channel
              procurement relationships. Large commercial enterprises managing over 2,000 acres evaluate microbial
              nitrogen primarily through operating cost hedging, taking advantage of multi-year price locks and volume
              discounts to lower breakeven per-bushel production costs. Mid-scale family farm operators, who finance
              seasonal inputs through agricultural operating credit lines, adopt microbial products to insure against
              mid-season fertilizer supply bottlenecks. Specialty row-crop operators, including cotton producers
              utilizing CERT-N across 30,000 trial acres, are incentivized by proven economic returns exceeding $30 per
              acre alongside lint yield uplifts. In all segments, adoption friction is minimized because the economic
              buyer (the farm principal) and the equipment operator integrate inoculants seamlessly into existing seed
              hoppers or liquid starter systems, removing capital barrier hurdles.
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM009
