      - number: '1.3'
        title: Financing History, Investor Syndicate, and Valuation Trajectory
        blocks:
          - type: paragraph
            body: >
              Pivot Bio has secured approximately $617 million in equity capital across five institutional funding
              rounds. The company's capitalization history illustrates escalating investor backing for biological
              climate tech and synthetic fertilizer displacement. Following early seed incubation and an approximate $17
              million Series A round, the enterprise closed a $70 million Series B in 2018. Momentum accelerated during
              the 2020 Series C round, which raised $100 million led by Breakthrough Energy Ventures and Singapore state
              investor Temasek.


              In July 2021, Pivot Bio completed a landmark $430 million Series D financing round co-led by DCVC and
              Temasek, with participation from institutional climate and agricultural investment vehicles. The Series D
              priced at a reported near-$2.0 billion post-money valuation mark ($1.66B-$2.0B range across market
              reports), reflecting rapid commercial adoption as treated acreage expanded past 1 million acres. In 2023,
              the enterprise announced that annual commercial product sales had crossed the $100 million threshold.
              However, because Pivot Bio operates as a private company, granular audited income statements, gross
              margins, recurring cash burn rates, and preference share stacking rights remain non-public, forming a
              critical focus area for investor diligence.
            claimRefs:
              - CO007
