      - number: '1.2'
        title: Executive Leadership, Governance Evolution, and Operational Scale
        blocks:
          - type: paragraph
            body: >
              Pivot Bio's executive leadership structure reflects a deliberate transition from an exploratory academic
              spinout to a commercially scaled agricultural input enterprise. The underlying synthetic biology platform
              was conceived by co-founders Dr. Christopher Voigt (head of Biological Engineering at MIT), Dr. Karsten
              Temme, and Dr. Alvin Tamsir. Dr. Temme served as founding Chief Executive Officer for more than a decade,
              guiding the technology through laboratory de-risking, early field testing, regulatory pathways, and
              initial commercial launches between 2011 and 2023.


              In August 2023, the board orchestrated a pivotal leadership transition by appointing Chris Abbott, a
              seasoned agriculture and fertilizer efficiency investor, as Chief Executive Officer. Dr. Temme
              transitioned into the full-time role of Chief Innovation Officer to head scientific research and
              next-generation strain development, while commercial scaling, pricing strategy, and supply chain expansion
              shifted to Abbott. Supporting Abbott's commercialization drive, Chief Commercial Officer Chris Turner
              oversees the retail distribution network and grower pricing programs, while Ryan Van Roekel leads
              commercial agronomy and field trial evaluations across more than 30 dedicated company agronomists.
              Headcount is reported at approximately 330 personnel distributed across Minnetonka/Minneapolis, Berkeley
              research facilities, St. Louis laboratory facilities, and regional field teams.
            claimRefs:
