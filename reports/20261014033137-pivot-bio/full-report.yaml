      - number: '6.3'
        title: Retention, Agronomic Efficacy Disclaimers, and Channel Friction
        blocks:
          - type: paragraph
            body: >-
              Customer retention and expansion in agricultural biologicals hinge upon predictable agronomic outcomes and
              yield parity across heterogeneous soils, tillage regimes, and weather conditions. While university trials
              and company studies confirm that Proven 40 reduces nitrate leaching by an average of 10 kilograms of
              nitrogen per hectare and can yield $12.50 per acre in net revenue under controlled conditions, real-world
              deployment faces agronomic variability. In trials with third-generation Proven G3, the product
              demonstrated an average replacement of 34 pounds of nitrogen with a modest yield advantage of 0.9 bushels
              per acre over untreated plots. Acknowledging that microbial nitrogen is not a one-size-fits-all product,
              Pivot Bio transitioned its commercial agronomy model to mandate field-by-field evaluations led by over 30
              staff agronomists. Crucially, Pivot Bio does not publicly report audited net revenue retention (NRR),
              gross retention rates (GRR), or customer cohort churn metrics. Furthermore, retail channel friction
              persists because agricultural retailers derive substantial margin volume from hauling and applying bulk
              synthetic fertilizer, creating potential disincentives to promote biological displacement unless offset by
              bundled service fees or carbon offset programs like N-Ovator.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
