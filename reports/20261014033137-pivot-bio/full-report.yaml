      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Strategic Positioning: Shifting from Green Premium to Commodity Price Discount'
            body: >-
              Pivot Bio's decision to cut product prices by 30% for the 2026 growing season represents a critical
              strategic pivot. By pricing microbial nitrogen at least 25% cheaper per pound of nitrogen replaced than
              synthetic fertilizer, the company shifts its core value proposition from an environmental ESG premium to a
              direct, deflationary input cost-reduction tool for economically squeezed row-crop growers.
            calloutType: insight
            claimRefs:
              - CO005
              - CO010
          - type: callout
            title: 'Technical Ceiling: Partial Nitrogen Replacement Limits Total Disruption'
            body: >-
              While Pivot Bio's gene-edited bacteria deliver reliable early-season root nutrition, current formulations
              replace approximately 25% to 35-40 pounds per acre of synthetic nitrogen. Because crops such as corn
              require 150 to 220 pounds per acre, growers remain dependent on synthetic fertilizer for the majority of
              crop nutrition, restricting Pivot Bio to a complementary input rather than a total replacement.
            calloutType: risk
            claimRefs:
              - CO002
              - CO003
  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundaries, Substituted Spend, and Status-Quo Economics
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio operates at the intersection of modern agricultural biologicals and the century-old industrial
              fertilizer sector. Rather than attempting an ideological overhaul of conventional farming practices, the
              company targets a strictly bounded subsegment of variable crop production costs: synthetic nitrogen
              fertilizer. Global ammonia synthesis via the Haber-Bosch process consumes 1% to 2% of worldwide energy and
              generates approximately 5% of global greenhouse emissions, yet synthetic nitrogen remains indispensable
              for row-crop productivity. On American corn acreage, growers apply between 150 and 220 pounds of synthetic
              nitrogen per acre every season. Pivot Bio bounds its initial addressable spend to displacing the first 30
              to 40 pounds of synthetic nitrogen per acre. This design positions microbial nitrogen not as an agronomic
              disruption requiring new machinery or altered cultivation routines, but as a direct drop-in replacement
              delivered through seed treatments or standard in-furrow planting equipment.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
