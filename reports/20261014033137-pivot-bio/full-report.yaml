  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Agronomic Workflow Integration
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio develops and commercializes biological crop nutrition solutions designed to address the
              volatility and environmental inefficiencies inherent to synthetic Haber-Bosch nitrogen fertilizers. Rather
              than applying industrial bulk chemicals that leach into groundwater or escape into the atmosphere as
              nitrous oxide, growers introduce living endophytic bacteria directly at planting. These specialized
              microbes colonize the developing crop root system, utilizing plant root exudate sugars as a biological
              carbon source while continually converting atmospheric nitrogen into plant-available ammonium throughout
              the growing season. The flagship corn product, PROVEN 40, is engineered to replace approximately 34 to 40
              pounds of synthetic nitrogen per acre, supplying roughly 20% to 25% of the total nitrogen requirement for
              standard commercial corn crops. Application integrates directly into existing farming practices via
              multiple delivery formulations: in-furrow liquid application injected during planting, pre-treated on-seed
              coatings, and dry planter-box treatments that can be blended directly into seed hoppers without dedicated
              liquid tractor plumbing. For the 2026 growing season, Pivot Bio implemented a 30% price reduction across
              its product lineup, positioning the per-pound cost of microbial nitrogen at least 25% lower than
              conventional synthetic alternatives and substantially reducing grower input expenditure.
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE001
              - CE002
