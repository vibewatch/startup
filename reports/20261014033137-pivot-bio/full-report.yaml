  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Register and Matrix
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio operates at the intersection of synthetic biology and industrial agronomy, exposing its
              commercial model to distinct legal, operational, partner, and financial risks. The company's core value
              proposition rests on replacing up to 40 pounds of synthetic nitrogen per acre with living microbial
              inoculants applied in-furrow or as seed treatments. While peer-reviewed academic validation from the
              University of Illinois confirms that PROVEN 40 fixes atmospheric nitrogen and increases early plant
              uptake, real-world efficacy remains variable across disparate soil chemistries, moisture profiles, and
              tillage regimes. This biological variability directly translates into customer economic risk, as
              inconsistent yield preservation can erode grower return on investment. Furthermore, macro fertilizer
              market volatility introduces substantial price competition; conventional synthetic fertilizer price
              declines narrow the net savings delivered by Pivot Bio's biological alternatives. The company has
              addressed this exposure by deploying long-term pricing assurance programs and expanding its domestic
              fermentation capacity, which requires 99% less capital investment to construct than conventional
              Haber-Bosch chemical facilities.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
