      - number: '2.2'
        title: 'Multi-Lens Market Sizing: Macro Fertilizer Spend vs. Replaceable Biological Wedge'
        blocks:
          - type: paragraph
            body: >-
              Evaluating Pivot Bio's total market requires distinguishing between theoretical macro fertilizer spend and
              the biologically addressable displacement wedge. At the broadest level, global synthetic nitrogen
              consumption exceeds $120 billion annually across all cropping systems. In North America, row-crop
              synthetic nitrogen represents an $8.5 billion to $10.0 billion market, anchored by roughly 90 million
              acres of corn. Because current microbial strains displace 20% to 25% of synthetic requirements rather than
              eliminating commercial fertilizer entirely, the immediate Serviceable Addressable Market (SAM) is capped
              between $2.0 billion and $2.5 billion. Pivot Bio has demonstrated commercial scaling across this wedge,
              expanding from 1 million commercial acres to an estimated 5 million acres in fiscal year 2023, and
              reaching nearly 20 million cumulative acres across North America. Capturing this Serviceable Obtainable
              Market (SOM) depends on competitive pricing schedules, where 2026 price cuts of 30% position microbial
              nitrogen at half the unit cost of volatile synthetic alternatives.
