chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Company Identity, Commercial Stage, and Technology Wedge
        blocks:
          - type: paragraph
            body: >
              Pivot Bio is a commercial-stage agricultural biotechnology enterprise developing gene-edited microbial
              solutions that provide biologically fixed nitrogen directly to the root zones of cereal and fiber crops.
              Founded in 2011 out of scientific collaboration at the University of California, Berkeley and the
              Massachusetts Institute of Technology, the company was established to address the acute economic and
              ecological inefficiencies inherent in synthetic Haber-Bosch nitrogen fertilizer. While conventional
              ammonia fertilizer application results in substantial volatilization, nitrate leaching, and greenhouse gas
              emissions, Pivot Bio's living bacterial inoculants adhere to crop roots and feed on plant-derived
              exudates, converting atmospheric dinitrogen gas into plant-available ammonia throughout the active
              vegetative growing season.


              The company's commercial architecture has shifted from an early California-based research initiative into
              an industrial Midwest operating business. Operational executive leadership and corporate headquarters
              recently relocated from Berkeley, California to Minnetonka, Minnesota, positioning the company directly
              within core North American corn and row-crop territory. Across its flagship PROVEN product line for corn,
              RETURN for small grains, and newly introduced CERT-N for cotton, Pivot Bio has demonstrated commercial
              deployment on millions of acres of United States farmland. For the 2026 growing season, the enterprise has
              adopted an aggressive commercial posture, implementing a 30% baseline product price reduction to ensure
              its microbial nitrogen alternative prices at least 25% below synthetic nitrogen per pound replaced,
              countering volatile global fertilizer commodity pricing.
            claimRefs:
              - CO001
              - CO002
