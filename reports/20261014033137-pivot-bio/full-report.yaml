      - number: '6.2'
        title: Adoption Trajectory, Cumulative Acreage, and Pricing Model
        blocks:
          - type: paragraph
            body: >-
              Commercial deployment has accelerated from early commercial pilots in 2019 to 1 million acres in 2021, 5
              million acres in 2023, and nearly 20 million cumulative acres by mid-2026 across North American cereal
              acreage. This expansion reflects growing farmer acceptance of microbial nitrogen as a dependable agronomic
              input rather than an experimental biological additive. To address cyclical farmer margins and tight farm
              economics caused by softer crop prices, Pivot Bio instituted an aggressive commercial reset for the 2026
              growing season. The company cut product pricing by 30% compared to prior seasons, ensuring the effective
              cost per pound of replaced nitrogen remains at least 25% below synthetic nitrogen benchmarks, with leading
              products priced approximately 50% lower than traditional synthetic alternatives. Furthermore, in March
              2026, Pivot Bio launched a multiyear price and supply assurance agreement covering the 2026, 2027, and
              2028 growing seasons. This structured pricing mechanism enables growers and agricultural retailers to lock
              in multi-season input costs, providing financial predictability and flexible payment structuring against
              global fertilizer volatility and geopolitical disruption in energy markets.
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
