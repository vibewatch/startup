          - type: callout
            title: Channel Margin Conflict and Agronomic Variability
            body: >-
              Because Pivot Bio relies on third-party ag retailers who generate substantial operational revenue from
              handling and applying bulk synthetic fertilizers, channel incentives remain fragile. Furthermore,
              agronomic results from Proven G3 show modest yield increases of 0.9 bushels per acre, making adoption
              vulnerable if biological handling fails or synthetic prices crash.
            calloutType: risk
            claimRefs:
