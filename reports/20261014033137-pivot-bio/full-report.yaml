      - number: '4.2'
        title: Go-to-Market Economics and Distribution Channel Transition
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio has fundamentally restructured its commercial go-to-market motion over the past twenty-four
              months. Initially launched through direct sales agronomists and seed-partner treatment channels, the
              company added more than 500 agricultural retail points of sale for its commercial footprint. This shift
              toward ag-retail partnerships leverages established grower purchasing habits, allowing local cooperatives
              and chemical retailers to distribute dry planter-box formulations and liquid products alongside existing
              crop input bundles. In addition to traditional retail product margins, Pivot Bio operates the N-OVATOR
              marketplace, which connects growers who document synthetic fertilizer reductions with corporate buyers
              seeking verified Scope 3 agricultural emissions reductions. Over three growing seasons, the program
              distributed $13 million in incentive payments directly to participating growers, creating an auxiliary
              financial return that improves grower retention and reduces gross churn. However, expanding through
              ag-retail channels requires dealer margin concessions and working capital support, which management has
              supplemented with 0% seasonal financing packages to accelerate farmer purchasing decisions.
            claimRefs:
              - CI001
              - CI003
              - CI005
              - CI007
          - type: table
            tableRef: TI002
            claimRefs:
              - CI002
              - CI005
              - CI006
