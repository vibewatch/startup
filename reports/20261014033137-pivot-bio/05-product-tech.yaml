  - id: TE002
    title: Workflow / use-case table
    columns:
      - User Job
      - Current Workflow
      - Pivot Bio Solution
      - Measurable Benefit
      - Technical & Operational Limitation
    rows:
      - - Pre-plant corn nitrogen nutrition
        - Bulk application of synthetic anhydrous ammonia or UAN
        - In-furrow liquid or on-seed PROVEN 40 applied at planting
        - Replaces up to 40 lbs synthetic N/acre with zero runoff
        - Replaces only ~25% of total seasonal crop nitrogen requirement
      - - Universal planter seed inoculation
        - Tractor liquid kit installation ($5,000–$25,000 capital expense)
        - Dry planter-box formulation mixed directly with seed
        - Zero specialized plumbing required; identical tractor pass
        - Requires thorough mechanical mixing to ensure uniform seed coverage
      - - Cereal grain fertility management
        - Broadcast urea top-dressing with high volatilization risk
        - Seed-applied or furrow-injected RETURN microbial inoculant
        - Continuous root-zone nitrogen delivery immune to heavy rainfall
        - Efficacy sensitive to soil temperature and timing of root emergence
      - - Cotton lint yield & nitrogen efficiency
        - Multiple synthetic side-dress fertilizer passes
        - CERT-N microbial inoculant applied at cotton planting
        - Replaces 20% synthetic nitrogen and adds up to 50 lbs lint/acre
        - Requires field-by-field agronomic calibration across varied soil textures
    notes: Workflow economics and operational comparisons compiled from Pivot Bio technical trial briefs and Farm Progress agronomy reporting; capital costs vary by equipment manufacturer.
