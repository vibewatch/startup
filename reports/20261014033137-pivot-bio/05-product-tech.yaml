figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Six-tier functional architecture of Pivot Bio's microbial crop nutrition platform, spanning genomic discovery, gene editing, precision fermentation, stabilization, field delivery, and symbiotic root-zone nitrogen transfer.
    approximationNotes: Functional architectural abstraction synthesized from scientific publications, patent disclosures, and company technical briefs.
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE008
    data:
      layers:
        - label: 'Tier 6: Agronomic Symbiosis & Root Uptake'
          detail: Continuous root-zone ammonia transfer to crop vascular system
          modules:
            - Endophytic colonization of corn, wheat, and cotton root hairs
            - Exchange of root exudate sugars for microbially fixed ammonium
            - In-season weatherproof nitrogen release immune to leaching
        - label: 'Tier 5: In-Field Delivery & Inoculation'
          detail: Flexible application workflows integrated into planting operations
          modules:
            - In-furrow liquid injection plumbing on tractor planter
            - Pre-treated on-seed (OS) dormant microbial coating
            - Planter-box dry powder treatment mixed directly with bulk seed
        - label: 'Tier 4: Inoculant Formulation & Stabilization'
          detail: Proprietary carrier chemistry protecting living bacterial cells
          modules:
            - Stabilizing polymers maintaining bacterial viability
            - Proprietary carbon additive enhancing early root colonization
            - Quality control testing for viable colony forming units (CFUs)
        - label: 'Tier 3: Precision Fermentation Biomanufacturing'
          detail: Industrial-scale production of living bacterial biomass
          modules:
            - Aerobic stirred-tank fermentation in St. Louis production facility
            - Zero Haber-Bosch chemical synthesis; 99.9% lower water utilization
            - 1/20,000th shipping volume relative to bulk synthetic fertilizer
        - label: 'Tier 2: Gene-Editing & Nitrogenase Derepression'
          detail: Non-transgenic precision editing of bacterial nif gene clusters
          modules:
            - Deactivation of ammonia-sensing genetic feedback repression
            - Hardwired continuous nitrogenase enzyme expression in high-N soils
            - Maintenance of wild-type metabolic fitness and colonization vigor
        - label: 'Tier 1: Genomic Discovery & Strain Selection'
          detail: High-throughput isolation of native endophytic soil diazotrophs
          modules:
            - Metagenomic screening of diverse agricultural soil microbiomes
            - Identification of naturally robust root-colonizing bacterial strains
            - Targeting non-transgenic internal DNA sequences to streamline regulatory path
callouts:
  - calloutType: strength
    title: Breakthrough Nitrogenase Derepression Without Transgenic Foreign DNA
    body: Pivot Bio's core technical moat resides in precision gene editing that disables the genetic off-switch in native root-colonizing diazotrophs. By editing native sequences rather than inserting foreign genetic material, the company achieved continuous nitrogen fixation even in high-nitrogen soils while streamlining U.S. regulatory clearance.
    claimRefs:
      - CE001
      - CE002
  - calloutType: risk
    title: Biological Ceiling and Environmental Vulnerability
    body: Microbial crop nutrition cannot currently replace 100% of synthetic fertilizer, ceiling at 20% to 25% replacement for corn. Furthermore, because efficacy depends on living bacteria colonizing root tissue, extreme weather, soil chemistry variations, and improper planter handling create inherent performance variability.
    claimRefs:
      - CE006
      - CE010
      - CE014
