            body: >-
              过去二十四个月，Pivot Bio 从根本上重构了商业市场进入方式。公司最初依靠直销农艺师和种子合作伙伴处理渠道，后来新增超过 500 个农业零售销售点。
              这一转向利用种植者既有采购习惯，让地方合作社和化学品零售商可以把干式播种箱配方及液体产品与现有作物投入品组合一并分销。 除传统零售产品利润外，Pivot Bio 还运营 N-OVATOR
              市场，将记录合成肥料减量的种植者与寻求经验证 Scope 3 农业减排的企业买家连接起来。三季种植期间，该项目直接向参与种植者发放 $13 million 激励付款，形成辅助性财务回报，提升留存并降低总体流失。
