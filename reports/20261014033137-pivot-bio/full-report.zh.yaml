  - id: FE001
    title: 产品架构图
    type: stack
    summary: Pivot Bio 微生物作物营养平台的六层功能架构，覆盖基因组发现、基因编辑、精准发酵、稳定化、田间交付和根际共生固氮转移。
    approximationNotes: 功能架构抽象综合科学出版物、专利披露和公司技术简报。
    claimRefs:
      - CE001
      - CE002
      - CE005
      - CE008
    data:
      layers:
        - label: 第 6 层：农艺共生与根部吸收
          detail: 持续将根际氨转移至作物维管系统
          modules:
            - 在玉米、小麦和棉花根毛中内生定殖
            - 用根系分泌糖交换微生物固定的铵
            - 生长季内抗天气的氮释放，不受淋溶影响
        - label: 第 5 层：田间交付与接种
          detail: 融入播种作业的灵活施用流程
          modules:
            - 拖拉机播种机上的沟施液体注入管路
            - 预处理种子（OS）休眠微生物涂层
            - 播种箱干粉处理，直接与散装种子混合
        - label: 第 4 层：接种剂配方与稳定化
          detail: 保护活细菌细胞的专有载体化学体系
          modules:
            - 维持细菌活性的稳定化聚合物
            - 增强早期根部定殖的专有碳添加剂
            - 对活菌落形成单位（CFU）进行质量控制检测
        - label: 第 3 层：精准发酵生物制造
          detail: 工业规模生产活细菌生物量
          modules:
            - 在 St. Louis 生产设施进行好氧搅拌罐发酵
            - 零 Haber-Bosch 化学合成；用水量低 99.9%
            - 相较散装合成肥料，运输体积为 1/20,000
        - label: 第 2 层：基因编辑与固氮酶去抑制
          detail: 对细菌 nif 基因簇进行非转基因精准编辑
          modules:
            - 关闭氨感知遗传反馈抑制
            - 在高氮土壤中硬编码持续表达固氮酶
            - 保持野生型代谢适应性和定殖活力
        - label: 第 1 层：基因组发现与菌株选择
          detail: 高通量分离天然内生型土壤固氮菌
          modules:
            - 对多样农业土壤微生物组进行宏基因组筛选
            - 识别天然强健、可定殖根部的细菌菌株
            - 以非转基因内部 DNA 序列为靶点，简化监管路径
  - id: FU001
    title: 客户旅程与采用扩张架构
    type: journey-map
    summary: 商业大田作物生产商采用微生物氮时的评估、采购、部署和多年扩张触点。
    data:
      items:
        - label: 1. 农艺评估
          touchpoints:
            - 土壤检测基线
            - 农艺师咨询
            - 农资成本比较
        - label: 2. 商业采购
          touchpoints:
            - 种子经销商下单
            - 配方选择
            - 保障计划锁定价格
        - label: 3. 播种与接种
          touchpoints:
            - 种子处理包衣
            - 沟内液体喷施
            - 播种箱粉剂
        - label: 4. 生长季内支持
          touchpoints:
            - 根部定殖
            - 持续供氮
            - 组织取样复核
        - label: 5. 收获与效果复盘
          touchpoints:
            - 产量持平复核
            - 减氮审计
            - 碳信用核验
        - label: 6. 多年扩张与续约
          touchpoints:
            - 多年保障计划续约
            - 承诺扩大种植面积
            - N-Ovator 信用额度兑付
    approximationNotes: 这是根据公司农艺指南和商业项目结构综合整理出的商业化大田作物采用标准运营阶段。
    claimRefs:
      - CU002
      - CU004
      - CU008
      - CU012
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 该矩阵评估 Pivot Bio 监管、农艺、供应链和市场等关键风险类别的发生可能性与运营影响。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
      rows:
        - label: 高可能性
          values:
            - N-OVATOR 信用额度价格波动
            - 农化产品混配阻力
            - 不同土壤类型下田间效果的波动
        - label: 中高可能性
          values:
            - 二级经销商库存滞后
            - 播种机施用校准漂移
            - 生长季天气冲击导致氮需求错配
        - label: 中等可能性
          values:
            - 州级肥料标签不一致
            - 拉丁美洲注册时间表延误
            - 合成肥料基准价格承压
        - label: 低中可能性
          values:
            - 自愿碳登记处方法修订
            - 冷链仓库温度偏差
            - 种子包衣保质期衰减
        - label: 低可能性
          values:
            - 国内供应链运输瓶颈
            - USDA 撤回生物经济规则
            - 欧盟生物制品市场准入受阻
        - label: 可忽略可能性
          values:
            - 核心固氮专利被宣告无效
            - 联邦生物接种剂召回令
            - 国内发酵产能完全丧失
    approximationNotes: 风险排序来自对高校田间试验、宏观商品报告和国际监管申报文件的专家分析。
    claimRefs:
      - CR001
      - CR004
      - CR008
      - CR011
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 该决策流程图展示农艺证据和业务规模如何连接到估值压力，并导向“继续研究”的建议。
    data:
      nodes:
        - id: proof
          label: 农艺证据
          detail: 田间研究显示植物氮含量提高 14%、生物量提高 12%；减少使用 34-37 磅合成氮时，产量仍可持平
          tone: positive
        - id: scale
          label: 商业规模
          detail: 累计应用面积超过 15M 英亩；设有多年定价计划，覆盖 500+ 个零售网点
          tone: positive
        - id: margin-pressure
          label: 价格与利润率压力
          detail: 2026 季价格下调 30%，反映作物价格挤压和农户预算约束
          tone: warning
        - id: financial-opacity
          label: 财务不透明
          detail: 私营公司财务数据未披露；缺少经审计的毛利率、现金消耗率和留存数据
          tone: negative
        - id: valuation-overhang
          label: 估值压力
          detail: D 轮峰值估值接近 $2B，而收入基础未披露，意味着倍数偏高
          tone: negative
        - id: diligence-trigger
          label: 尽调条件
          detail: 需要核实单位制造成本、经审计的利润率情况和客户留存
          tone: warning
        - id: stance
          label: 投资立场
          detail: 在财务信息披露前，维持“继续研究”评级和“估值偏高”判断
          tone: neutral
      edges:
        - from: proof
          to: scale
          label: 推动采用
        - from: scale
          to: margin-pressure
          label: 面临大宗商品逆风
        - from: margin-pressure
          to: financial-opacity
          label: 掩盖盈利能力
        - from: financial-opacity
          to: valuation-overhang
          label: 制造风险
        - from: valuation-overhang
          to: diligence-trigger
          label: 需要审计
        - from: diligence-trigger
          to: stance
          label: 决定投资判断
    approximationNotes: 对投资决策因素和准入要求的定性综合。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV013
      - CV014
      - CV015
