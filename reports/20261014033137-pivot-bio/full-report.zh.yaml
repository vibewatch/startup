  - id: TV002
    title: 正反论点表
    columns:
      - 支柱
      - 正方论点
      - 反方论据
      - 哪些变化会改变判断
    rows:
      - - 技术与农艺
        - 微生物氮可在作物体内稳定、抗天气地输送，替代 34-40 lbs N/acre
        - 活菌性能受土壤类型、耕作方式和本地微生物生态影响，差异显著
        - 标准化的多区域田间试验审计证实，在 95%+ 的不同土壤类型中产量相当
      - - 商业化势头
        - 覆盖面积扩展至数百万英亩，新增 500+ 个零售点并签订多年定价协议
        - 最近降价 30% 说明定价承压、农户利润紧张，而非具备定价权
        - 在没有稀释性商业补贴的情况下，证明具备定价权且毛利率持续扩张
      - - 单位经济性与利润率
        - 发酵生产所需资本比合成设施少 99%，运输体积为其 1/20,000
        - 高昂的发酵制造成本及冷链 / 易腐风险，可能将毛利率压低至 40% 以下
        - 经审计财务报表显示毛利率高于 50%，且经营现金流为正
      - - 政策与碳信用
        - USDA 关于生物燃料原料的最终规则及 N-OVATOR 计划带来额外收入（2024 年 $4.5M）
        - 碳信用和 Scope 3 嵌入式付款仍是小额收入补充，受不断变化的自愿框架影响
        - 颁布强制性的 Scope 3 企业脱碳合规标准，或实现联邦直接补贴平价
    notes: 核心投资争论因素，在农艺优势与经济、运营现实之间权衡。
    claimRefs:
      - CV005
      - CV006
      - CV007
      - CV008
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 关键假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观情景
        - 下一代 Proven G3 和 Cert-N 覆盖 30M+ acres；毛利率超过 55%；N-OVATOR 扩大规模；收入超过 $250M
        - 以 10-14x 倍数支撑 $2.5B-$3.5B 估值；可能上市或被大型农化企业战略收购
        - 国际扩张的监管障碍；现有农化企业报复性定价
        - 15% —— 需要利润率快速扩张且全球市场进入顺畅
      - - 基准情景
        - 商业化覆盖面积稳步扩大至 18-22M acres；降价 30% 后价格趋稳；收入达到 $120M-$160M
        - 公允价值约为 $1.0B-$1.4B（收入的 6-8x）；相较 Series D 估值持平至下行；持有期延长
        - 农业带利润挤压限制采用速度；土壤差异导致客户流失
        - 60% —— 符合历史大田作物生物制品的采用曲线
      - - 悲观情景
        - 功效不一致引发种植户流失；降价未能带动销量；发酵 COGS 居高不下；收入停滞在 $90M 以下
        - 估值压缩至 $400M-$600M（收入的 3-5x）；低价轮次资本重组或困境资产出售
        - 微生物无法可靠替代 >30 lbs N 的结构性问题；营运资金严重流失
        - 25% —— 考虑到资本密集度高且私人市场估值承压，下行风险并非为零
      - - 下行底线
        - 严重生物污染或产品召回；零售渠道合作伙伴信心完全丧失
        - 按资产价值清算或困境出售 IP（$150M-$250M）
        - 生物产品在田间条件下的稳定性完全崩溃
        - 低（尾部风险）——由 10 多年的研发和专利组合缓释
    notes: 情景概率信号和估值区间基于农业生物制品倍数及收入运行率区间。
    claimRefs:
      - CV009
      - CV010
      - CV011
      - CV012
