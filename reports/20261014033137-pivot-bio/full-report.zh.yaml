      - number: '6.3'
        title: 留存、农艺功效免责声明与渠道摩擦
        blocks:
          - type: paragraph
            body: >-
              农业生物制品的客户留存和扩张，取决于在异质土壤、耕作制度和天气条件下能否取得可预测的农艺结果和相当产量。 大学试验和公司研究确认，Proven 40 平均将每公顷硝酸盐淋失减少 10
              kilograms，并在受控条件下带来每英亩 $12.50 的净收入；但真实部署仍有农艺波动。 在第三代 Proven G3 试验中，产品平均替代 34 pounds 氮，相比未处理地块每英亩增产 0.9
              bushels。Pivot Bio 承认微生物氮并非适用于所有场景，已把商业农艺模式改为逐田评估，并由超过 30 名农艺师负责。 关键的是，Pivot Bio
              没有公开披露经审计的净收入留存率（NRR）、总收入留存率（GRR）或客户队列流失指标。 此外，零售渠道摩擦仍在：农业零售商从运输和施用散装合成肥料中获得大量利润，除非由捆绑服务费或 N-Ovator
              等碳抵消项目补偿，否则可能缺乏推动生物替代的动力。
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU013
              - CU014
              - CU015
          - type: table
            tableRef: TU003
            claimRefs:
              - CU008
              - CU010
              - CU011
              - CU012
      - number: '6.4'
        title: 展示项
        blocks:
          - type: callout
            title: 肥料波动驱动商业定位
            body: >-
              Pivot Bio 的商业加速很大程度上由外部地缘政治冲击和影响合成 Haber-Bosch 肥料的天然气价格波动催化。公司将微生物氮定价为传统肥料的 50%
              以下，并提供三年价格锁定，销售的是投入成本确定性，而不是颠覆式产量溢价。
            calloutType: insight
            claimRefs:
              - CU008
              - CU009
          - type: callout
            title: 渠道利润冲突与农艺波动
            body: >-
              Pivot Bio 依赖第三方农业零售商，而后者从处理和施用散装合成肥料中获得大量运营收入，因此渠道激励仍然脆弱。此外，Proven G3 的农艺结果仅显示每英亩 0.9 bushels
              的温和增产；若生物制品处理失败或合成肥料价格暴跌，采用就会受到冲击。
            calloutType: risk
            claimRefs:
              - CU011
              - CU012
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重性排序的风险登记表与矩阵
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio 位于合成生物学与工业农艺交界处，商业模式暴露于法律、运营、合作伙伴和财务等不同风险。公司的核心价值主张是用行间或种子处理施用的活微生物接种剂，每英亩替代最多 40 pounds 合成氮。
              University of Illinois 的同行评审学术验证确认 PROVEN 40 能固定大气氮并提高早期植物吸收，但真实功效在不同土壤化学、墒情和耕作制度间仍有差异。
              这种生物波动直接转化为客户经济风险：产量保持不稳定会侵蚀种植者投资回报。宏观肥料市场波动还带来明显价格竞争；合成肥料价格下跌会压缩 Pivot Bio 生物替代品带来的净节省。
              公司靠部署长期价格保障项目、扩大本土发酵能力来应对这一风险；其发酵设施建设所需资本投入比传统 Haber-Bosch 化工设施低 99%。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
