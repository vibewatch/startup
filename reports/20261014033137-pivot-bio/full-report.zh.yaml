      - CP004
  - id: TP002
    title: 农艺能力与购买标准矩阵
    columns:
      - 购买标准与特征
      - Pivot Bio（PROVEN G3 / RETURN）
      - 合成氮（Haber-Bosch）
      - 生物初创公司（如 Kula Bio）
      - 肥料效率工具（如 Sound Ag）
    rows:
      - - 氮输送方式
        - 内源性定殖根部的细菌从空气中固氮并直接输送给植物
        - 外源化学施用（无水氨、UAN、尿素）
        - 自由生活的土壤细菌将大气氮矿化
        - 通过生化方式激活本地土壤微生物群，不添加微生物
      - - 氮替代能力
        - 替代 34-40 磅氮 / 英亩（约占玉米总需求的 25%）
        - 提供作物基础氮需求的 100%（150-220 磅 / 英亩）
        - 试验地块宣称可提供 20-30 磅氮 / 英亩；商业规模未经核实
        - 宣称提升 25-50 磅氮的利用效率；依赖土壤现有养分储备
      - - 淋失与径流风险
        - 没有直接径流；微生物直接附着在根系上
        - 施用氮中有 40-60% 因环境淋失和挥发而损失
        - 中等；自由生活细菌留在土壤主体中，而不是附着于根部
        - 不适用；不会直接向土壤系统增加氮
      - - 施用工作流整合
        - 种子处理、液体沟施或播种箱干粉处理
        - 专用播前、播种时或侧施设备作业
        - 液体土壤喷施或沟施作业
        - 叶面喷施或液体沟施，可兼容标准作业
      - - 供应与价格稳定性
        - 多年价格保障（比合成肥料低 50%）；国内生产
        - 天然气、地缘政治扰动和运输导致价格高度波动
        - 长期定价结构未知；早期试点价格有补贴
        - 按英亩计价的特种化学品；不受天然气投入价格波动影响
    notes: 能力评估比较北美玉米生产中的商业化属性；数据反映 2024-2026 年的商业披露和试验基准。
    claimRefs:
      - CP005
      - CP006
      - CP007
      - CP008
  - id: TP003
    title: 商业定价模式与经济风险比较
    columns:
      - 解决方案 / 替代方案
      - 定价模式
      - 单位成本 / 经济基准
      - 多年供应保障
      - 种植户切换阻力
      - 经济风险与未知因素
    rows:
      - - Pivot Bio PROVEN G3 / 40
        - 按英亩计价的品牌生物投入品，2026 年季折价 30%
        - 按替代氮肥重量计价，约比合成氮低 50-60%（每英亩节省 0）
        - 提供 3 年期价格与供应保障计划（2026-2028）
        - 中等；需要将活菌附着于种子，或使用沟施设备
        - 田间胜率取决于施用位置、耕作方式和当地土壤化学性质
      - - 合成无水氨 / UAN
        - 按吨计价的商品现货价和远期合约价
        - 基准波动大，占每英亩运营成本的 33-50%
        - 仅限标准商业零售商远期签约合同
        - 低；经销商供应链成熟，农艺施用流程也已普及
        - 易受全球天然气价格、运输瓶颈和供应冲击影响
      - - 生物肥料（新兴）
        - 按英亩计价的试点价或初始零售价
        - 目录价通常以与合成氮替代品平价为基准
        - 未公开披露；只能按季现货供应
        - 高；种植户不愿试用未经验证的品牌和未经核实的田间试验
        - 生物活性在货架储存中的保持、分销稳定性和批次一致性均未知
      - - 增效化学品（生物刺激剂）
        - 按英亩计价的化学叶面 / 沟施添加剂
        - 每英亩额外支出（2-25/英亩），由理论上的减氮抵消
        - 遵循标准作物化学品零售分销条款
        - 低；可与标准除草剂或肥料施用流程进行罐混
        - ROI 高度取决于原生土壤有机质和微量营养素基准
      - - 可变速率施用服务
        - 软件订阅和硬件设备摊销
        - 设备资本开支（0,000-50,000+），另加按英亩计的平台费用
        - 不适用；多年软件许可合同
        - 高；需要遥测硬件、土壤测绘和农艺咨询
        - 在土壤均一的田地中回报递减；无法对冲底层商品成本
    notes: 经济指标反映 Agweek 和 Farm Progress 的商业定价数据；合成氮基准来自 USDA ERS 运营成本指标。
    claimRefs:
      - CP009
      - CP010
      - CP011
      - CP012
