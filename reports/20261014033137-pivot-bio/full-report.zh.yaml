      - number: '1.3'
        title: 融资历史、投资人联盟与估值轨迹
        blocks:
          - type: paragraph
            body: >
              Pivot Bio 通过五轮机构融资累计获得约 $617 million 股权资本。公司的资本化历史显示，投资人对生物气候科技和替代合成肥料的支持持续增强。 在早期种子孵化和约 $17 million 的
              Series A 后，公司于 2018 年完成 $70 million 的 Series B。2020 年 Series C 加速了势头，该轮由 Breakthrough Energy Ventures
              领投，Singapore state investor Temasek 参与，融资 $100 million。

              2021 年 7 月，Pivot Bio 完成具有里程碑意义的 $430 million Series D，由 DCVC 和 Temasek 共同领投，机构气候和农业投资工具跟投。Series D 据报道对应接近
              $2.0 billion 的投后估值；不同市场报道给出 $1.66B-$2.0B 区间。随着处理面积突破 1 million acres，公司商业采用快速增长。 2023 年，公司宣布年度商业产品销售额已超过
              $100 million。然而，Pivot Bio 是私营公司，细化的经审计损益表、毛利率、经常性现金消耗率和优先股堆叠权利仍未公开，这构成投资人尽调的关键关注点。
            claimRefs:
