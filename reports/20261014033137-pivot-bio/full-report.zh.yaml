              - CP010
              - CP011
          - type: callout
            title: 施用敏感性与农艺惯性拖累采用
            body: 微生物氮具备明确的环境和价格优势，但保守的种植习惯及生物敏感性会制造摩擦。Pivot Bio 早期胜率在优化布置前仅为 56%，田间结果波动也意味着农户往往把生物制品看作附加成本，而不是削减合成肥料基线。
            calloutType: risk
            claimRefs:
