      - number: '2.3'
        title: 买方类型、渠道分销与无摩擦接种
        blocks:
          - type: paragraph
            body: >-
              大田作物农业的客户分层取决于经营规模、风险承受力和渠道采购关系。管理超过 2,000 英亩的大型商业企业，主要从经营成本对冲角度评估微生物氮，利用多年价格锁定和批量折扣降低每蒲式耳生产成本的盈亏平衡点。
              通过农业经营信贷为季节性投入融资的中等规模家庭农场，会采用微生物产品来防范季中肥料供应瓶颈。使用 CERT-N、覆盖 30,000 英亩试验面积的棉花种植者，则受到每英亩超过 $30
              的已验证经济回报及籽棉产量提升激励。 在所有细分市场，经济买方（农场主）和设备操作员都能把接种剂无缝整合进现有种子箱或液体 starter 系统，资本投入障碍因此降低。
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM009
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
