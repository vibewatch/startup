      - number: '3.4'
        title: 护城河持久性、功效差异与替代风险
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio 的竞争护城河建立在专有基因编辑菌株和大量多季田间布置数据上。不同于土壤中存在合成氮时会下调固氮的未编辑接种剂，Pivot Bio 的专利微生物在富营养土壤中仍保持活性。
              但这一护城河面临重大农艺和竞争风险。早期商业试验的胜率差异很大，起初为 56%，随着农艺布置指引改进升至 93%。田间表现仍受土壤化学、有机质、耕作方式和施用时机影响。
              如果作物种植者看到产量表现不稳定，或出于谨慎不愿削减合成肥料基线，Pivot Bio 可能被当作可选的增产剂，而不是可靠的肥料替代品。 Nutrien、Corteva 和 Bayer
              等大型农化集团也持续重投生物制品和养分效率化学品；如果现有零售网络把竞争性生物制品直接捆绑进专有杂交种衣，长期替代风险会上升。
            claimRefs:
              - CP013
              - CP014
