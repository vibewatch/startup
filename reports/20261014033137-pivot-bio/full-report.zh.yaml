            title: 生物上限与环境脆弱性
            body: 微生物作物营养目前无法替代 100% 的合成肥料，对玉米的替代上限为 20% 至 25%。此外，功效取决于活细菌定殖根组织；极端天气、土壤化学变化和播种机操作不当都会造成固有表现波动。
            calloutType: risk
            claimRefs:
