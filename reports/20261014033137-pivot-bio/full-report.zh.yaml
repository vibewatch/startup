  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与农艺流程整合
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio 开发并商业化生物作物营养解决方案，针对合成 Haber-Bosch 氮肥的波动和环境低效。种植者不再施用会渗入地下水或以一氧化二氮逸入大气的工业散装化学品，而是在播种时直接引入活性内生细菌。
              这些专门微生物定殖于发育中的作物根系，以根系分泌糖作为生物碳源，在整个生长季持续把大气氮转为植物可利用的铵。旗舰玉米产品 PROVEN 40 经设计可替代每英亩约 34 to 40
              磅合成氮，约供应标准商业玉米总氮需求的 20% 至 25%。 施用可直接嵌入既有农业流程：播种时注入的液体行间施用、预处理种衣，以及可直接混入种子箱且无需专用液体拖拉机管路的干式播种箱处理。 2026
              年种植季，Pivot Bio 将全线产品价格下调 30%，使微生物氮每磅成本至少比传统合成替代品低 25%，显著减少种植者投入支出。
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
