  - id: TP001
    title: 作物营养竞争者与替代品分类
    columns:
      - 竞争者 / 替代品
      - 类别
      - 规模与融资
      - 目标细分市场
      - 关键差异化
      - 核心农艺局限
    rows:
      - - 合成氮（CF Industries、Nutrien、Yara）
        - 现有化学肥料
        - 数十亿美元级大宗商品收入；全球 Haber-Bosch 基础设施
        - 大面积大田作物（玉米、小麦、棉花）
        - 普遍确立的标准，速效植物可利用氮浓度最高
        - 波动性高，40-60% 通过径流 / 挥发造成环境损失，并产生温室气体排放
      - - Kula Bio（Kula-N）
        - 生物肥料同业
        - 0M+ 风险融资（A 轮阶段）；商业化前 / 区域试点
        - 大田作物和特色蔬菜
        - 非转基因 / 非基因编辑的储能细菌，延长土壤寿命
        - 商业规模化处于早期，大规模多季田间一致性尚未验证
      - - Sound Agriculture（SOURCE）
        - 肥料效率生物刺激剂
        - 50M+ 风险融资；商业零售分销
        - 寻求提升肥料效率的玉米和大豆种植者
        - 激活本地土壤微生物的生化叶面 / 沟施配方
        - 不会固定新的大气氮；依赖土壤现有氮储备
      - - 传统根瘤菌接种剂
        - 生物接种剂前身
        - 向大型农业企业供应大宗种子处理产品
        - 豆科作物（大豆、豆类、苜蓿）
        - 无需合成制造的天然共生固氮
        - 仅适用于豆科；谷类作物处于高氮土壤时会出现生物活性关闭
      - - 可变施率技术与精准氮（Climate FieldView）
        - 现状型农艺优化
        - 已在数百万英亩数字农业土地上广泛采用
        - 大规模商业大田作物运营者
        - 优化合成肥料的施用位置和时间以减少浪费
        - 需要资本设备投入；本质上仍依赖合成氮供应
    notes: 竞争者规模和融资基准来自公开行业报道及贸易媒体；局限反映农艺交付约束。
