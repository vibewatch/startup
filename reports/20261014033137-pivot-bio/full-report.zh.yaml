      - number: '5.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不引入转基因外源 DNA，突破固氮酶抑制
            body: Pivot Bio 的核心技术护城河在于精准基因编辑，关闭天然根部定殖固氮菌的遗传开关。公司编辑的是本土序列，而非插入外源遗传材料，因此即使在高氮土壤中也能持续固氮，同时简化 U.S. 监管审批。
            calloutType: strength
