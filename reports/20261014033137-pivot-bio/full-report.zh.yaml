        title: 展示项
        blocks:
          - type: callout
            title: 生物固氮：对冲商品波动的非对称工具
            body: >-
              Pivot Bio 对合成肥料的竞争切入点建立在经济可预测性，而非完全替代上。合成氮占玉米运营费用的 33% 至
              50%，并随天然气和地缘政治供应中断波动；把微生物氮锁定在一半成本，能为种植者提供结构性的利润率防护。
            calloutType: insight
            claimRefs:
