      - number: '6.2'
        title: 采用轨迹、累计面积与定价模式
        blocks:
          - type: paragraph
            body: >-
              商业部署从 2019 年早期试点加速至 2021 年 1 million acres、2023 年 5 million acres，并在 2026 年年中达到北美谷物种植面积累计近 20 million
              acres。 这一扩张说明农户越来越把微生物氮视为可靠的农艺投入，而非实验性生物添加剂。为应对作物价格走弱造成的农户利润周期和紧张的农场经济，Pivot Bio 在 2026 年种植季进行激进商业重置。
              公司相比此前季节降价 30%，确保替代每磅氮的有效成本至少比合成氮基准低 25%，主要产品价格约比传统合成替代品低 50%。 此外，Pivot Bio 于 2026 年 3 月推出覆盖 2026、2027 和
              2028 种植季的多年价格与供应保障协议。该定价机制让种植者和农业零售商锁定多季投入成本，以应对全球化肥波动和能源市场地缘政治冲击，同时获得财务可预测性和灵活付款安排。
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
              - CU009
