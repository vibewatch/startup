  - id: TV001
    title: 建议汇总表
    columns:
      - 指标 / 维度
      - 评估
      - 支持信号
      - 决策含义
    rows:
      - - 建议
        - 继续研究
        - 商业化面积已达 15M+ acres，但未经验证的利润率和私人市场估值压力抵消了进展
        - 在单位经济性得到验证前，不要以历史峰值估值参与老股转让或后续股权融资
      - - 信心
        - 中
        - 广泛的农场试验数据集（PTI、大学试验）验证了功效，但私人财务数据仍未披露
        - 投入资本前，要求完整财务披露，包括 GAAP 收入、COGS 和毛利率
      - - 风险评级
        - 高
        - 农户利润受压、降价 30%，以及不同土壤 / 耕作制度下的生物性能敏感性
        - 针对生物性能差异和化肥商品周期，维持严格的估值折扣
      - - 估值立场
        - 偏高
        - Series D 接近 $2B 的峰值代表对周期性农业投入品市场中预计低于 $150M 收入的高倍数定价
        - 以现实倍数（收入的 3-5x）锚定入场预期，而不是周期峰值的气候科技估值
    notes: 尽调结果综合，锚定已验证商业化面积和未经验证的财务指标。
