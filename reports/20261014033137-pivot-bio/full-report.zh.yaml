      - number: '5.2'
        title: 生物机制与发酵架构
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio 平台的核心技术创新，是解除天然土壤固氮菌生物固氮的遗传抑制。野生型土壤细菌天生拥有固氮所需的遗传机制（nif 基因簇），但一旦周围土壤基质检测到游离氮或合成肥料，就会迅速关闭固氮酶表达。
              Pivot Bio 科学创始人识别出强定殖根部的固氮菌株，并采用非转基因精准碱基编辑禁用这一生化反馈开关，使固氮酶即使在重施肥土壤中也保持产生，同时不引入外源重组 DNA。
              由于编辑依赖内部基因组序列修改，所得菌株作为非转基因生物投入品通过监管门槛。制造在 St. Louis 以集中式精准好氧发酵进行，耗水量降低 99.9%，运输体积仅为传统合成氮所需的 1/20,000th。 通过
              N-OVATOR，合成氮减量和避免的一氧化二氮排放得到量化、验证并打包为碳与可持续性积分，形成由 Nestlé 等跨国食品饮料企业购买的 Scope 3 减排资产。
            claimRefs:
              - CE001
              - CE002
              - CE008
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE001
              - CE002
              - CE008
              - CE014
      - number: '5.3'
        title: 商业产品组合与配方演进
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio 的商业产品架构已从最初的单一作物液体接种剂扩展为多作物生物营养组合。产品包括玉米 PROVEN 40 和第三代 Proven G3，小麦、大麦和谷物高粱 RETURN，以及棉花 CERT-N。
              第三代 Proven G3 含四种活细菌菌株、三种不同作用机制：两种基因编辑菌株专门负责持续固氮，另两种伴生微生物帮助宿主植物吸收铁和锰等微量营养素。
              在田间部署中，配方灵活性成为主要商业驱动。早期采用受限于液体行间拖拉机套件；如今种子上施用（OS）休眠聚合物处理和 2026 年干式播种箱配方，让农户无需为专用施用硬件投入资本即可采用微生物肥力。 公司技术由超过
              200 项专利组成的知识产权组合保护，覆盖工程微生物遗传学、发酵工艺、稳定添加剂和多菌株农业配方。
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE009
          - type: table
            tableRef: TE001
            claimRefs:
              - CE003
              - CE005
              - CE006
      - number: '5.4'
        title: 农艺差异化、质量控制与生物上限
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio 通过可测量、可预测的化学输出，将其产品与传统生物刺激剂和未编辑生物制品区分开来：每天向根区供氮，直接替代每英亩最多 40 pounds 合成肥料，同时保持作物产量相当。 在超过 20 所主要
              land-grant university 开展的多年试验中，微生物氮处理田块的玉米产量相当，环境硝酸盐淋失平均减少每英亩 9 to 10 pounds。 但农艺和生物限制仍然显著。Pivot Bio
              的微生物接种剂不能完全取代商业肥料；其替代上限是玉米氮需求的 20% 至 25%，农户仍须依赖传统化肥满足剩余 75% 至 80%。
              此外，产品由活生物体组成，功效容易受到极端土温波动、土壤有机质偏低、干旱以及强势本土土壤微生物群竞争影响。随着公司推进全球扩张——包括 2026 年 4 月加入 EuropaBio
              以跟踪欧洲生物技术框架，并部署到 Brazil 和 Kenya——在不同土壤生态中建立严格冷链质控和稳定的田间定殖遥测，仍是持续的运营重点。
            claimRefs:
              - CE006
              - CE007
              - CE010
              - CE013
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE005
              - CE006
