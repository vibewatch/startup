      - number: '1.2'
        title: 高管领导、治理演变与运营规模
        blocks:
          - type: paragraph
            body: >
              Pivot Bio 的高管架构显示，公司正有意从探索性学术分拆项目转向商业化农业投入品企业。合成生物学平台由联合创始人 Dr. Christopher Voigt（MIT Biological
              Engineering 负责人）、Dr. Karsten Temme 和 Dr. Alvin Tamsir 构想。 Dr. Temme 担任创始 Chief Executive Officer
              十余年，带领技术经历实验室去风险、早期田间测试、监管路径以及 2011 至 2023 年的初期商业发布。

              2023 年 8 月，董事会推动关键领导层交接，任命农业和肥料效率领域资深投资人 Chris Abbott 为 Chief Executive Officer。Dr. Temme 转任全职 Chief
              Innovation Officer，负责科研和下一代菌株开发；商业扩张、定价策略和供应链拓展转由 Abbott 负责。 Chief Commercial Officer Chris Turner
              负责零售分销网络和种植者定价项目，Ryan Van Roekel 负责商业农艺和田间试验评估，并统筹超过 30 名专职公司农艺师。公司据报约有 330 名员工，分布在
              Minnetonka/Minneapolis、Berkeley 研究设施、St. Louis 实验室设施和区域田间团队。
