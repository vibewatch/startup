            body: >-
              Pivot Bio 的经济可行性取决于维持低生物生产成本，以隔离 Haber-Bosch 氨合成所受的化石原料波动。合成氮同时依赖天然气作为燃料和化学原料，使传统肥料制造商和农户暴露于剧烈能源价格波动。
              Pivot Bio 以本土水、糖和基础营养物进行工业发酵，制造基因编辑微生物，据报道使生产成本与碳氢化合物市场脱钩。公司领导层称，生产效率让过去两年的资本强度下降
