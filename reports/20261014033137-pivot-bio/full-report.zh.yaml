        - 中 —— 与杀菌性种子处理剂共同施用时可能导致微生物意外死亡
        - 覆盖第三方化学投入品的完整兼容性矩阵尚未完全公开
    notes: 评估依据包括生物制造参数、大学田间试验结果和商业产品操作要求。
