      - number: '1.5'
        title: 展示项
        blocks:
          - type: callout
            title: 战略定位：从绿色溢价转向商品价格折扣
            body: >-
              Pivot Bio 在 2026 年种植季将产品价格下调 30%，代表一次关键战略转向。微生物氮肥每替代一磅氮的价格至少比合成肥料低 25%，因此公司的核心价值主张从环境 ESG
              溢价转为直接、通缩式的投入成本削减工具，服务利润承压的大田作物种植者。
            calloutType: insight
            claimRefs:
              - CO005
              - CO010
          - type: callout
            title: 技术上限：氮替代有限，难以彻底颠覆
            body: >-
              Pivot Bio 的基因编辑细菌能可靠地提供早季根部营养，但当前配方约替代每英亩 25% 至 35-40 磅的合成氮。玉米等作物每英亩需要 150 至 220
              磅氮，因此种植者仍依赖合成肥料满足大部分营养需求，Pivot Bio 只能作为补充投入品，而非完全替代品。
            calloutType: risk
            claimRefs:
              - CO002
              - CO003
  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、替代支出与现状经济学
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio 位于现代农业生物制品与百年工业化肥行业的交界处。公司并不试图从意识形态上重塑传统农业，而是瞄准可变作物生产成本中的一个严格限定子领域：合成氮肥。 Haber-Bosch
              工艺合成全球氨耗用全球能源的 1% 至 2%，产生约 5% 的全球温室气体排放，但合成氮对大田作物生产仍不可或缺。              美国玉米种植者每季每英亩施用 150 至 220 磅合成氮。
              Pivot Bio 初始可争取支出仅限于替代每英亩前 30 至 40 磅合成氮。这使微生物固氮成为通过种子处理或标准行间播种设备交付的直接替代品，而不是需要新机器或改变耕作流程的农艺颠覆。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM003
              - CM009
              - CM014
      - number: '2.2'
        title: 多视角市场规模：宏观肥料支出与可替代生物切入点
        blocks:
          - type: paragraph
            body: >-
              评估 Pivot Bio 的总市场，必须区分理论上的宏观肥料支出与生物技术可触达的替代空间。最宽口径下，全球各类种植系统每年消耗的合成氮超过 $120 billion。 在北美，大田作物合成氮市场规模为 $8.5
              billion 至 $10.0 billion，背后约有 90 million 英亩玉米。由于当前微生物菌株替代的是合成氮需求的 20% 至 25%，并非完全消除商业肥料，近期 Serviceable
              Addressable Market（SAM）上限为 $2.0 billion 至 $2.5 billion。 Pivot Bio 已在这一空间实现商业扩张：商业化面积从 1 million acres 增至
              2023 财年的估计 5 million acres，并达到北美累计近 20 million acres。能否获取 Serviceable Obtainable Market（SOM），取决于竞争性定价；2026
              年降价 30% 后，微生物氮的单位成本为波动性合成替代品的一半。
            claimRefs:
