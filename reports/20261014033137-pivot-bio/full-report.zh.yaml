      - 集中度
      - 失效情景
      - 严重性
      - 缓释措施
      - 剩余暴露
    rows:
      - - 零售分销网络
        - 近 500 家本地农业零售供应商
        - 产品备货、农户交付、种子处理施用
        - 高 —— 零售商是农户的主要触达点
        - 零售商整合，或优先销售传统化肥以保护利润
        - 高
        - 扩大网络；提供 0% 农户融资和 25% 降价，以增强渠道拉力
        - 中 —— 依赖本地经销商的积极性和农艺师推荐
      - - 学术与机构验证
        - University of Illinois、MIT 及 20+ 所研究型大学
        - 同行评审的功效验证、氮同位素吸收证明
        - 中 —— 可信度高度依托第三方试验
        - 不一致的田间研究结果公开发表，对替代方案的产量平价提出质疑
        - 中
        - 试验覆盖 172 个田地、97 个县及多州试验联盟
        - 低 —— 大量已发表文献证实基础生物固氮能力
      - - 全球化肥定价与供应渠道
        - 合成肥料大宗商品市场（尿素、UAN、无水氨）
        - 决定农户 ROI 和产品替代激励的定价基准
        - 高 —— 合成氮价格崩跌会侵蚀生物方案的成本优势
        - 全球天然气和合成氮大宗商品价格大幅下降
        - 高
        - 多年价格保障计划（2026-2028），锁定比合成氮低 50% 的费率
        - 中 —— 合成肥料价格长期低迷会压缩长期毛利率
      - - 碳与可持续价值购买方
        - N-OVATOR 计划的企业可持续发展合作伙伴
        - 购买经验证的农业氮排放减排信用
        - 中 —— 2024 年带来 $4.5M 付款的补充收入来源
        - 碳核算规则变化，或企业自愿气候支出收缩
        - 低
        - USDA 最终规则将生物氮确认为正式的低碳生物燃料原料信用
        - 低 —— 核心产品价值仍在于直接替代投入品，而非依赖信用
