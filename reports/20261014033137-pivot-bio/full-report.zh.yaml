chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、商业阶段与技术切入点
        blocks:
          - type: paragraph
            body: >
              Pivot Bio 是一家处于商业化阶段的农业生物科技企业，开发基因编辑微生物解决方案，直接向谷物和纤维作物的根区提供生物固定氮。 公司于 2011 年源自 University of California,
              Berkeley 与 Massachusetts Institute of Technology 的科研合作，成立初衷是解决合成 Haber-Bosch 氮肥带来的严重经济与生态低效。
              传统氨肥施用会造成大量挥发、硝酸盐淋失和温室气体排放；Pivot Bio 的活细菌接种剂则附着在作物根部，以植物产生的根系分泌物为养分，在整个活跃生长期把大气中的二氮转化为植物可利用的氨。

              公司的商业架构已从早期的加州研究项目转为中西部工业化运营业务。运营管理层和总部近期从 Berkeley, California 搬至 Minnetonka,
              Minnesota，直接置于北美玉米和大田作物核心区域。 其玉米旗舰 PROVEN 产品线、小粒谷物 RETURN 以及新推出的棉花 CERT-N，已在美国农田数百万英亩上实现商业部署。2026
              年种植季，公司采取激进商业策略，将基础产品价格下调 30%，确保微生物固氮替代每磅氮的价格至少比合成氮低 25%，以应对全球化肥商品价格波动。
