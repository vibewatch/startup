      - number: '1.4'
        title: 农艺里程碑、监管互动与不利因素
        blocks:
          - type: paragraph
            body: >
              Pivot Bio 过去十年的演进经历了科学概念验证、商业进入、快速市场扩张和国际机构整合。公司于 2018 年向美国农户推出首批商业固氮微生物，产品从液体行间施用扩展到干式种子处理配方。 到 2025-2026
              季，公司发布含四种活微生物、具有三种不同作用机制的第三代 PROVEN G3 配方，同时推出棉花产品 CERT-N 并扩充谷物配方。

              尽管商业进展显著，公司仍面临明确的技术和商业限制。              独立科学评估（包括 MIT Technology Review 的报道）指出，Pivot Bio
              的微生物产品目前只替代作物总氮需求的一部分，通常为每英亩 25% 至 35 磅，而不是完全替代合成肥料。 面对商品作物价格波动，农户通常不愿在没有经济保障的情况下改变标准施肥方案。对此，Pivot Bio
              引入多年价格锁定，并于 2026 年 4 月加入 EuropaBio，跟踪 European Union 监管和生物投入品标准。
