        - 高 —— 用于未经校准的氮管理方案时，产量响应存在差异
        - 缺乏覆盖多样微气候的实时土壤微生物组交互传感器
      - - 活微生物在储存和田间施用期间失去活性
        - 中
        - 高
        - 中 —— 采用带保护载体的沟施液体和播种箱干粉双重配方
        - 中 —— 农户操作失误或播种前暴露于极端温度
