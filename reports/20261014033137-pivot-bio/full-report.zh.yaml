  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与农业买方结构
        blocks:
          - type: paragraph
            body: >-
              Pivot Bio 面向 United States Corn Belt 及更广泛北美谷物带的商业谷物和大田作物生产者，重点覆盖玉米、小麦、大麦、高粱和棉花种植者。
              这一客群的经济买方通常是独立农场主兼经营者，或管理大面积土地的商业农场企业；氮肥是其最大的单项运营现金支出之一。
              在传统大田管理中，无水氨、尿素和尿素硝酸铵（UAN）等合成氮肥会随全球天然气原料价格和国际供应路线中断而大幅波动。 对商业谷物经营者而言，Pivot Bio 微生物接种剂提供了前置替代方案，每英亩可替代最多 40
              pounds 合成氮，约为玉米生产标准需求的 25%。 早期商业化主要通过独立玉米种子经销商把 Pivot Bio 定位为零售合作伙伴；如今分销生态已纳入农业零售商、种子处理供应商和认证商业农艺师。
              采用动态在寻求增量利润率的高效率种植者与暴露于季节性硝酸盐淋失的重施基肥经营者之间差异明显。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
