  - id: FO001
    title: Pivot Bio 公司、融资与产品演进时间线
    type: timeline
    summary: 按时间梳理 Pivot Bio 的创立、融资轮次、商业产品发布、高管交接和价格调整等里程碑。
    data:
      items:
        - label: '2011'
          detail: Dr. Karsten Temme、Dr. Christopher Voigt 和 Dr. Alvin Tamsir 在突破性合成固氮研究后于 Berkeley 创立公司。
        - label: '2018'
          detail: 完成 $70M Series B 融资，并向美国玉米种植户商业推出第一代微生物氮接种剂。
        - label: '2020'
          detail: 完成由 Breakthrough Energy Ventures 和 Temasek 共同领投的 $100M Series C 融资，以扩大商业分销。
        - label: '2021'
          detail: 完成由 DCVC 和 Temasek 共同领投的 $430M Series D 融资，估值接近 $2B；处理面积扩大至超过 1M acres。
        - label: '2022'
          detail: 被 AIM for Climate 选为 Innovation Sprint Partner，加速生物氮在北美农业中的覆盖。
        - label: '2023'
          detail: 任命 Chris Abbott 为 CEO，Dr. Temme 转任 Chief Innovation Officer；年度商业销售额超过 $100M。
        - label: '2024'
          detail: 产品覆盖每年 5M acres，并推出 CERT-N 棉花氮产品，同时提供 0% 融资激励。
        - label: '2025'
          detail: MIT Technology Review 突出介绍平台影响力；随着 2025 年田间试验数据成熟，运营总部在明尼苏达州 Minnetonka 设立。
        - label: '2026'
          detail: 宣布第三代 PROVEN G3 播种箱干粉配方，将 2026 年价格下调 30%，推出多年价格锁定，并加入 EuropaBio。
    approximationNotes: 日期和里程碑已与公司新闻稿、MIT Technology Review 及行业出版物核对。部分次要试点事件未纳入。
