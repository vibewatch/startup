  rows:
  - - Recommendation
    - research-more
    - Commercial progress on 15M+ acres offset by unverified margins and private valuation overhang
    - Do not participate in secondary or follow-on equity at historical peak valuations until unit economics are verified
  - - Confidence
    - medium
    - Broad on-farm trial dataset (PTI, university trials) validates efficacy, but private financials remain undisclosed
    - Require full financial disclosure including GAAP revenue, COGS, and gross margin before committing capital
  - - Risk rating
    - high
    - Farmer margin compression, 30% price cuts, and biological sensitivity across diverse soil/tillage regimes
    - Maintain strict valuation discount for biological performance variance and fertilizer commodity cycles
  - - Valuation stance
    - stretched
    - Series D peak near-$2B mark represents steep multiple on estimated sub-$150M revenue in cyclical ag input market
    - Anchor entry expectations at realistic multiples (3-5x revenue) rather than peak-cycle climate tech valuations
