  - type: missing-source
    severity: material
    topic: cap-table-overhang
    missingEvidence: Detailed capitalization table and liquidation preference schedule from Series D and subsequent extension financing.
    whyItMatters: Senior liquidation preferences from the $430M Series D could impair common equity and early-stage investor recoveries under base or bear exit valuations.
    diligencePath: Obtain fully diluted capitalization table and certificate of incorporation amendments from company counsel.
  - type: conflicting-data
    severity: minor
    topic: nitrogen-replacement-variance
    missingEvidence: Longitudinal grower field trial data measuring in-season nitrogen delivery variance across poorly drained clay versus sandy loam soils.
    whyItMatters: Variable efficacy in heavy soils could increase customer churn and elevate customer acquisition costs.
    diligencePath: Review multi-year university agronomy extension trial datasets and raw grower survey logs across Midwestern states.
