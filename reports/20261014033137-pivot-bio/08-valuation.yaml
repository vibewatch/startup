  - CV005
  - CV006
  - CV007
  - CV008
- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Key Assumptions
  - Valuation / Return Logic
  - Key Risks
  - Probability Signal
  rows:
  - - Bull Case
    - Next-gen Proven G3 and Cert-N achieve 30M+ acres; gross margin exceeds 55%; N-OVATOR scales; revenue passes $250M
    - Justifies $2.5B-$3.5B valuation at 10-14x multiple; potential public listing or strategic buyout by ag-chem major
    - Regulatory hurdles in international expansion; incumbent ag-chem pricing retaliation
    - 15% - requires rapid margin expansion and frictionless global market access
  - - Base Case
    - Commercial footprint expands steadily to 18-22M acres; prices stabilize post-30% cut; revenue reaches $120M-$160M
    - Fair value aligns around $1.0B-$1.4B (6-8x revenue); flat-to-down valuation vs Series D; extended hold period
    - Farm belt margin squeeze limits adoption velocity; customer churn due to soil variability
    - 60% - consistent with historical row crop biologicals adoption curves
  - - Bear Case
    - Efficacy inconsistencies trigger grower churn; price cuts fail to drive volume; fermentation COGS stay high; revenue stalls below $90M
    - Valuation compresses to $400M-$600M (3-5x revenue); down-round recapitalization or distressed asset sale
    - Structural inability of microbes to reliably replace >30 lbs N; severe working capital drain
    - 25% - non-zero downside given high capital intensity and private valuation overhang
  - - Downside Floor
    - Severe biological contamination or product recall; complete loss of retail channel partner confidence
    - Liquidation or distressed IP sale at asset value ($150M-$250M)
    - Total collapse of biological product stability in field conditions
    - Low (tail risk) - mitigated by 10+ years of R&D and patent portfolio
  notes: Scenario probability signals and valuation ranges based on ag-biologics multiples and revenue run-rate bands.
