- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Pillar
  - Thesis Argument
  - Anti-Thesis Counter
  - What Would Change View
  rows:
  - - Technology & Agronomy
    - Microbial nitrogen provides reliable weatherproof in-plant delivery replacing 34-40 lbs N/acre
    - Living bacteria performance varies significantly by soil type, tillage, and native microbial ecology
    - Standardized multi-region field trial audits confirming yield parity across 95%+ of varied soil types
  - - Commercial Traction
    - Expanded footprint to millions of acres with 500+ new retail points and multiyear pricing agreements
    - Recent 30% price reduction indicates pricing pressure and tight farmer margins rather than pricing power
    - Demonstrated pricing power and steady gross margin expansion without dilutive commercial subsidies
  - - Unit Economics & Margins
    - Fermentation-based production requires 99% less capital and 1/20,000th shipping volume vs synthetic facilities
    - High fermentation manufacturing costs and cold-chain/perishability risks could depress gross margins below 40%
    - Audited financial statements showing gross margins above 50% and positive operating cash flow
  - - Policy & Carbon Credits
    - USDA final rule on biofuel feedstocks and N-OVATOR program generate additional revenue ($4.5M in 2024)
    - Carbon and Scope 3 inset payments remain minor revenue supplements subject to changing voluntary frameworks
    - Enactment of mandatory Scope 3 corporate decarbonization compliance standards or direct federal subsidy parity
  notes: Core investment debate factors balancing agronomic advantages against economic and operational realities.
