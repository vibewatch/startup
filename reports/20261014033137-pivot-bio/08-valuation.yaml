callouts:
- calloutType: recommendation
  title: Valuation Discipline Requires Audited Unit Economics
  body: While Pivot Bio has demonstrated genuine field-scale biological efficacy across millions of acres, late-stage investors should not underwrite follow-on equity or secondary transactions at historical peak multiples near $2.0 billion. Until the company provides transparent GAAP revenue figures, verified gross margins post-30% price cuts, and cohort customer retention data, the risk-reward profile remains unsupportive of a buy recommendation.
