  topStrengths:
    - >-
      Field-validated agronomic performance across millions of acres with measurable nitrogen displacement and yield
      parity.
    - Commercial distribution now spans ag-retail, seed channels, and multiyear price-assurance programs.
    - Domestic fermentation and sustainability-linked monetization add operating and customer-retention flexibility.
  topRisks:
    - Private financial opacity blocks underwriting of margins, burn, and cap-table economics.
    - Biological efficacy remains partial and soil-dependent, limiting full synthetic replacement.
    - Price cuts and channel incentives may compress margins if synthetic fertilizer prices fall.
