companyProfile:
  summary: >-
    Pivot Bio is a late-stage private agricultural biotechnology company founded in 2011 out of UC Berkeley and MIT
    research. It engineers gene-edited microbes that colonize crop roots and fix atmospheric nitrogen for corn, wheat,
    barley, sorghum, and cotton, now operating across nearly 20 million treated acres in North America. The business has
    shifted its center of gravity toward Minnesota under CEO Chris Abbott, using ag-retail distribution, multiyear price
    assurance, and N-OVATOR sustainability payments to drive adoption.
