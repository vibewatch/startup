      - - Multi-Year Supply & Price Assurance Contracts
        - Multi-year fixed-price nitrogen supply agreements (2026-2028)
        - Per-acre multi-year grower commitment
        - Launched March 2026 for 2026-2028 seasons
        - Predictable forward cash receipts; potential fixed-price margin risk if input costs surge
        - Examine contract cancellation provisions, volume commitments, and working capital terms
    notes: >-
      Revenue streams reflect reported commercial lines as of 2026; company does not publicly disaggregate dollar
      revenue by product line or disclose take-rates on carbon insetting.
