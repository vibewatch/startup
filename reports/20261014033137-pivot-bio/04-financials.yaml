callouts:
  - calloutType: risk
    title: Private Financial Opacity Clouds Valuation and Self-Funding Prospects
    body: >-
      While Pivot Bio highlights reaching over $100 million in sales and 15 million cumulative acres, executive
      leadership explicitly refuses to disclose audited revenues, gross margins, or cash burn. Cutting list prices by
      30% amid pressurized grower margins may accelerate volume adoption, but without visibility into unit costs or
      operating burn, forward capital adequacy cannot be verified.
    claimRefs:
      - CI002
      - CI010
      - CI011
      - CI012
  - calloutType: insight
    title: Channel Realignment and Scope 3 Insetting Enhance Grower Retention
    body: >-
      Pivot Bio has transitioned from a pure direct sales and seed-treatment model to onboarding over 500 ag-retail
      points of sale. Combined with $13 million in N-OVATOR Scope 3 carbon payments paid directly to farmers over three
      seasons, this hybrid commercial structure embeds Pivot Bio products into retail routines and creates dual revenue
      mechanisms.
    claimRefs:
      - CI001
      - CI003
      - CI005
