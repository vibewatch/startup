        - Audit corporate buyer agreements, contract durations, and Pivot Bio take-rate
      - - Small Grains & Cotton Expansion (RETURN / CERT-N)
        - Specialty seed treatment and in-furrow biological nitrogen
        - Per-acre treated seed / liquid application unit
        - Early commercialization in sorghum and cotton across 8 states
        - Emerging volume; diversification away from pure corn-belt concentration
