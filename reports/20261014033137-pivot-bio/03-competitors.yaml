- id: TP001
  title: Crop Nutrition Competitor and Substitute Taxonomy
  columns:
  - Competitor / Alternative
  - Category
  - Scale & Funding
  - Target Segment
  - Key Differentiation
  - Core Agronomic Limitation
  rows:
  - - Synthetic Nitrogen (CF Industries, Nutrien, Yara)
    - Incumbent Chemical Fertilizer
    - Multi-billion commodity revenue; global Haber-Bosch infrastructure
    - Broad-acre row crops (corn, wheat, cotton)
    - Universally established standard, maximum immediate plant-available N concentration
    - High volatility, 40-60% environmental loss via runoff/volatilization, GHG emissions
  - - Kula Bio (Kula-N)
    - Biological Bio-fertilizer Peer
    - 0M+ venture funding (Series A stage); pre-commercial / regional pilots
    - Row crops and specialty vegetables
    - Non-GM / non-gene-edited energy-storing bacteria extending soil life
    - Early-stage commercial scaling, unproven multi-season field consistency at scale
  - - Sound Agriculture (SOURCE)
    - Nutrient Efficiency Biostimulant
    - 50M+ venture funding; commercial retail distribution
    - Corn and soybean growers seeking fertilizer efficiency
    - Biochemical foliar/in-furrow chemistry activating native soil microbes
    - Does not fix new atmospheric nitrogen; dependent on existing soil nitrogen bank
  - - Legacy Rhizobial Inoculants
    - Biological Inoculant Predecessor
    - Commodity seed-treatment supply across agribusiness majors
    - Legume crops (soybeans, pulses, alfalfa)
    - Natural symbiotic nitrogen fixation without synthetic manufacturing
    - Restricted to legumes; biological shutdown in high-nitrogen soils in cereal crops
  - - Variable Rate Technology & Precision N (Climate FieldView)
    - Status Quo Agronomic Optimization
    - Broad adoption across millions of digital agriculture acres
    - Large-scale commercial row crop operators
    - Optimizes synthetic fertilizer placement and timing to minimize waste
    - Requires capital equipment investment; still fundamentally dependent on synthetic N supply
