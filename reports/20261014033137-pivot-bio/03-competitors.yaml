callouts:
- calloutType: insight
  title: Biological Nitrogen as an Asymmetric Hedge Against Commodity Volatility
  body: Pivot Bio’s competitive wedge against synthetic fertilizer is anchored in economic predictability rather than total
    replacement. Because synthetic nitrogen accounts for 33% to 50% of operating expenses in corn and fluctuates with natural
    gas and geopolitical supply disruptions, locking in microbial nitrogen at half the cost provides growers with structural
    margin defense.
  claimRefs:
  - CP001
  - CP010
  - CP011
- calloutType: risk
  title: Application Sensitivity and Agronomic Inertia as Adoption Headwinds
  body: While microbial nitrogen offers clear environmental and price advantages, adoption faces friction from conservative
    grower practices and biological sensitivity. Pivot Bio’s early win rates were just 56% before refining placement, and
    variable field outcomes mean farmers often view biologicals as an add-on cost rather than cutting their synthetic baseline.
  claimRefs:
  - CP012
  - CP013
  - CP014
