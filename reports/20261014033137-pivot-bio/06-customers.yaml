callouts:
  - calloutType: "insight"
    title: "Commercial Positioning Driven by Fertilizer Volatility"
    body: "Pivot Bio's commercial acceleration has been heavily catalyzed by external geopolitical shocks and natural gas price volatility affecting synthetic Haber-Bosch fertilizers. By pricing microbial nitrogen 50% below conventional fertilizer and offering three-year price locks, the company sells input cost certainty rather than disruptive yield premiums."
    claimRefs:
      - "CU008"
      - "CU009"
  - calloutType: "risk"
    title: "Channel Margin Conflict and Agronomic Variability"
    body: "Because Pivot Bio relies on third-party ag retailers who generate substantial operational revenue from handling and applying bulk synthetic fertilizers, channel incentives remain fragile. Furthermore, agronomic results from Proven G3 show modest yield increases of 0.9 bushels per acre, making adoption vulnerable if biological handling fails or synthetic prices crash."
    claimRefs:
      - "CU011"
      - "CU012"
