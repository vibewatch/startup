        blocks:
          - type: paragraph
            body: >-
              市场逻辑更容易定性阐述，难以用公开信息量化。现有材料反复出现几个主题：AI 缩短入侵到造成影响的时间、企业担心 AI
              使用失控、市场需要数据主权，以及投资人看好驻留终端的预防能力。这些因素支持较大的漏斗顶端机会。但证据没有提供清晰的公开支出模型、品类 CAGR 或公司层面的 SAM/SOM 桥接，因此最稳妥的估算方式，是从广义
              AI 治理和内部风险问题集逐步收窄到已经在受监管或高控制环境中运行价值验证的大型企业。
