        blocks:
          - type: paragraph
            body: >-
              Ent 首次公开亮相时同步宣布了一笔异常大额的 $100 million 种子轮融资，由 Decibel 领投，Sequoia、Crosspoint、Craft、Shield、Felicis 和 In-Q-Tel
              等一线机构跟投。这一资本基础，加上工程和市场团队同步招聘，显示公司押注的是快速创建新品类，而不是克制的种子期烧钱节奏。商业证据方向上偏正面，但仍主要来自公司自述：Ent 称其已经服务酒店、金融服务和国防领域的
              Global 2000 客户；公司后续公告还引用 WestCap 的 CISO，称 WestCap 正在使用 Ent。这个唯一的具名参考并不能证明客户数量、定价、收入、留存或部署广度。抓取到的 CyberWire
              期刊已不再包含发现阶段出现的 Ent 条目，因此无法为该轮融资提供佐证。
