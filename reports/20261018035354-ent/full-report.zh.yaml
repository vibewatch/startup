      - number: '2.2'
        title: 买家、用户与采用路径
        blocks:
          - type: paragraph
            body: >-
              公开需求信号指向由企业安全团队主导的销售，而不是部门级生产力采购。Ent 的招聘措辞要求销售人员与 CISO 开拓具名账户、组织技术评估，并在员工至少 5,000
              人的企业中通过安全、隐私、法务和采购审查，意味着从首次会面到上线要经历漫长且多方参与的流程。目前有证据支持的行业——酒店、金融服务和国防——都对应重视数据主权、内部风险和 AI
              治理的买家。因此，最可服务的切口是受监管或安全成熟度较高的企业，它们有理由在工作空间层再部署一个预防控制点。
