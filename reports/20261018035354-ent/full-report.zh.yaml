  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与替代方案
        blocks:
          - type: paragraph
            body: >-
              现有证据不支持整齐的一对一同业集合，因此实际格局应按品类理解。Ent 被定位为意图感知工作空间安全这一新品类的直接供应商；相邻及替代方案包括现有终端和安全运营工具、安全浏览器或工作空间控制、AI
              代理治理与运行时身份层，以及内部开发或人工审核路径。这种广度很重要，因为买家仍是同一批大型企业安全团队；Ent 不是在填补没有预算的空白，而是在已有终端、身份和工作流控制的技术栈中要求 CISO
              优先配置一个新的控制点。
