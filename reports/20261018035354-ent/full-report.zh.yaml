  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 全球 2000 强客户部署扩大，客户可以作为参考案例，且私人指标显示定价能力强、增长效率高。
        - 只有这样才能为较高的私人市场定价辩护；当前公开证据不足以设定区间。
        - 现有厂商捆绑销售、漫长的企业销售周期和沉重的端点执行要求，仍需要被增长甩开。
        - 需要超越融资新闻标题的已披露商业牵引力。
      - - 基准
        - 产品和融资仍可信，但披露有限，试点需要时间才能成熟为可重复的企业收入。
        - 在私人尽调填补估值和单位经济性缺口前，最好定义为跟踪 / 继续研究。
        - 定价不透明、烧钱和资金续航未知，也没有公开集中度或留存数据。
        - 与当前证据集最为一致。
      - - 悲观
        - 融资光环继续领先于可量化采用，而现有平台厂商压低买方紧迫性或预算。
        - 如果牵引力落后于种子轮叙事，后续融资可能重置预期；没有公开数据可以排除这一点。
        - 品类教育风险、试点停滞，以及缺乏公开商业证明。
        - 独立的下行评论和披露缺口使这一情景仍然成立。
    notes: 情景逻辑是定性的，因为分配到的来源池未披露设定数字区间所需的估值、收入或利润率输入。
