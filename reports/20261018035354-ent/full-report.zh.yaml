  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代集合
        blocks:
          - type: paragraph
            body: >-
              Ent 围绕“工作空间安全”定义市场，而不是绑定某个现有预算科目。现有证据显示，其边界覆盖浏览器、应用、AI
              工作流、数据移动、本地运行时和终端活动，并在风险行为完成前监控和介入。因此，最接近的替代方案是终端检测与响应、DLP、内部风险监控、AI 治理控制和安全工作空间产品的组合，而非纯粹的 SOC
              分析层。独立评论也认为该产品更接近终端 DLP 和内部风险管理，而不是通用 AI 政策工具；实际市场因此集中在已经感受到数据外泄、影子 AI 和最后一公里防护痛点的买家。
