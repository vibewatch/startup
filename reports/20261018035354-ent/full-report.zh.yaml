      - number: '3.3'
        title: 商业流程与切换成本
        blocks:
          - type: paragraph
            body: >-
              销售和部署证据指向经典的企业销售，而不是自助式切口。公开定价缺失，产品面向至少 5,000 名员工的组织销售，销售岗位预期要经历技术评估、采购、安全审查和法务红线审阅。这与买家愿意让 Ent
              和现有控制并行、而不是替换旧系统的模式一致，降低了替代阻力，但也意味着 Ent 必须证明增量预算、代理开销和集成工作值得投入。换句话说，Ent
              可以与现有技术栈多栖共存；但这种共存虽便于采用，也削弱锁定，并让买家在比较评估中拥有更大议价权。
