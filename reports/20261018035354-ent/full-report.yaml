      - number: '1.3'
        title: Financing, commercial signals, and evidence limits
        blocks:
          - type: paragraph
            body: >-
              Ent's public debut was paired with an unusually large $100 million seed round led by Decibel and joined by
              a blue-chip syndicate that includes Sequoia, Crosspoint, Craft, Shield, Felicis, and In-Q-Tel. That
              capital base, plus simultaneous hiring across engineering and go-to-market, implies a strategy built
              around rapid category creation rather than a measured seed burn profile. Commercial proof is directionally
              positive but still mostly company-authored: Ent says it already serves Global 2000 customers across
              hospitality, financial services, and defense, while a later company release quotes WestCap's CISO saying
              WestCap uses Ent. This single named reference does not establish customer count, pricing, revenue,
              retention, or deployment breadth. The fetched CyberWire issue no longer contains the Ent item surfaced
              during discovery, so it cannot substantiate the round.
