  - id: FV001
    title: Recommendation logic
    type: flow
    summary: >-
      Strong financing and product signals flow into a track recommendation because price anchors and independent
      commercial proof are still missing.
    data:
      nodes:
        - id: funding
          label: $100M seed + top-tier syndicate
          note: Decibel-led round with Sequoia, Crosspoint, Craft, Shield, Felicis, and In-Q-Tel.
        - id: product
          label: General-availability product wedge
          note: Intent-aware, customer-cloud-hosted endpoint and browser coverage is already public.
        - id: traction
          label: Some deployment proof
          note: Company says Global 2000 customers already span hospitality, financial services, and defense.
        - id: gaps
          label: Commercial and pricing gaps
          note: No public valuation, ARR, pricing, burn, retention, or concentration data.
        - id: downside
          label: Execution and incumbent risk
          note: Endpoint build complexity and adjacent platform moves keep downside open.
        - id: recommendation
          label: Track / valuation unknown
          note: Move only after private diligence on terms, customers, and unit economics.
      edges:
