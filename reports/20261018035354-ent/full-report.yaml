  - id: FR001
    title: Risk heatmap
    type: matrix
    summary: >-
      Public evidence keeps Ent's highest residual exposure in proof, endpoint reliability, and enterprise-sales
      friction.
    data:
      columns:
        - label: Likelihood
          note: Based on current public evidence rather than incident-rate disclosure.
        - label: Impact
          note: Impact on underwriting if the risk materializes.
        - label: Mitigation maturity
          note: Publicly described mitigants only.
        - label: Residual exposure
          note: Analyst view after disclosed mitigants.
      rows:
