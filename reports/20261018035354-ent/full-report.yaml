      - number: '2.4'
        title: Constraints, proof burden, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The same sources that make the category legible also show why adoption could be slower than the financing
              headline implies. Ent is asking buyers to trust inferred intent and just-in-time intervention at the point
              of action, but the assigned evidence contains no independent false-positive rate, latency, or ROI
              benchmark. The go-to-market language also describes quarter-long enterprise evaluations and
              cross-functional approval chains, which means category education and proof burden likely remain high even
              when the threat narrative is compelling. Until public evidence includes clearer pricing, conversion, or
              efficacy data, valuation arguments should treat the market as promising but not yet cleanly quantified.
            claimRefs:
              - CM006
              - CM011
              - CM012
              - CM013
              - CM014
