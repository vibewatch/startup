              - CR010
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR004
              - CR005
              - CR007
              - CR008
              - CR009
              - CR010
      - number: '7.3'
        title: Commercial scaling depends on long enterprise cycles and ecosystem leverage
        blocks:
          - type: paragraph
            body: >-
              Ent's own hiring materials describe an enterprise motion that is credible but expensive to scale. The
              sales role assumes buyers with 5,000 or more employees, technical evaluations, security reviews, privacy
              reviews, legal redlines, procurement, and sales cycles measured in quarters. The same posting values
              existing CISO relationships and partner or reseller experience, which suggests pipeline generation and
              regional coverage still depend heavily on individual seller networks and ecosystem leverage rather than a
              repeatable low-friction playbook. Public partnership disclosure is still narrow, and the assigned sources
              do not surface named lighthouse customers who would shorten proof-of-value cycles. That leaves the company
              exposed to stalled pilots, elongated deal cycles, and concentration risk if a small number of design
              partners carry too much of the reference burden.
            claimRefs:
              - CR003
              - CR008
              - CR009
              - CR012
              - CR013
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR012
              - CR014
      - number: '7.4'
        title: Capital buys time, but the kill criteria are public-proof milestones
        blocks:
          - type: paragraph
            body: >-
              The $100 million seed round materially lowers near-term financing risk and gives Ent room to hire across
              engineering and go to market while expanding integrations and AI-governance capabilities. That matters,
              but it does not remove the key underwriting tests. The proof burden now shifts to whether Ent can convert
              public narrative into named production references, independent efficacy evidence, and cleaner enterprise
              adoption signals. Investors should watch for three thesis-break triggers: continued absence of named
              references after the launch window, no credible third-party benchmark or false-positive disclosure as
              deployments expand, and evidence that the enterprise motion remains relationship-led instead of
              repeatable. If those milestones do not improve, the company may remain a high-pedigree category story
              rather than a de-risked security platform.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR008
              - CR013
              - CR014
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The public launch still lacks the proof points security buyers usually ask for
            body: >-
              Even after a $100M debut, public evidence still does not name customers, size deployments, or publish
              independent false-positive and efficacy data. That makes referenceability and assurance the clearest
              near-term risk.
            calloutType: risk
            claimRefs:
              - CR003
              - CR004
              - CR005
          - type: callout
            title: The next de-risking milestone is external proof, not more narrative
            body: >-
              Fresh capital and technical ambition are real strengths, but the investment case only improves if Ent
              starts converting launch messaging into named references, benchmark evidence, and repeatable enterprise
              wins.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR008
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a watchlist posture rather than an invest-now call. The strongest positives are
              the $100 million seed round, the caliber of the syndicate, and a product narrative that has moved from
              stealth into general availability across endpoint and browser surfaces. The gating problem is that none of
              the retained public materials disclose post-money valuation, preference stack, ARR, pricing, burn, or
              retention, so there is no external anchor for whether current private pricing is attractive, fair, or
              already stretched. In practice, that makes the quality of the company easier to underwrite than the
              quality of the entry price, which is why the evidence favors track rather than buy.
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV007
              - CV008
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
