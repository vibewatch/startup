              - CV007
              - CV009
              - CV010
              - CV012
      - number: '8.2'
        title: Financing context and thesis balance
        blocks:
          - type: paragraph
            body: >-
              The financing itself is a meaningful signal: the round was led by Decibel with participation from Sequoia,
              Crosspoint, Craft, Shield, Felicis, and In-Q-Tel, and multiple coverage sources frame the raise as a bet
              on preventive, AI-native workspace security. That said, the public proof remains much stronger on investor
              enthusiasm and product framing than on commercial efficiency. Ent says it already serves Global 2000
              customers across hospitality, financial services, and defense, but named references, renewal behavior,
              pricing, and customer concentration are still absent. Public marketplace and job-profile commentary also
              flags incumbent adjacency and the risk that pilots stall before the category is fully established.
            claimRefs:
              - CV001
              - CV003
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV008
              - CV009
              - CV010
              - CV012
              - CV013
      - number: '8.3'
        title: Scenario framing and final diligence
        blocks:
          - type: paragraph
            body: >-
              Because valuation terms and operating metrics are undisclosed, the scenario framework here is a gating
              tool rather than a numeric underwriting model. The bull case requires proof that the company can turn its
              unusually large seed and strong product wedge into durable enterprise deployment, referenceable customers,
              and metrics that justify premium pricing before incumbents compress the category. The base case assumes
              technical promise with incomplete commercial disclosure, which is consistent with a track or research-more
              outcome. The bear case is that financing headlines outrun adoption proof, leaving the next round or exit
              path exposed to valuation compression. Private diligence on terms, customers, and economics is the
              shortest path to moving the recommendation.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV010
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
