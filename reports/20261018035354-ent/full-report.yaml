              - CU007
              - CU011
      - number: '6.3'
        title: Expansion logic is visible, but durability and concentration are still opaque
        blocks:
          - type: paragraph
            body: >-
              The go-to-market design implies a classic land-and-expand enterprise motion: direct named accounts,
              partner-assisted sourcing, proof-of-value work, and a handoff into production after security, privacy,
              legal, and procurement review. That is strategically coherent for a new security category, but it does not
              substitute for retention evidence. The retained public record does not disclose NRR, GRR, churn, renewal
              timing, contract length, partner-sourced mix, or top-customer concentration, and Simplify's own commentary
              explicitly flags the lack of named customers as a risk if pilots do not mature into durable production
              relationships. For investors, that means customer quality appears plausible, but durability, expansion
              pace, and concentration risk remain diligence questions rather than underwritten facts.
            claimRefs:
              - CU003
              - CU008
              - CU009
              - CU010
              - CU012
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Enterprise fit is clearer than logo proof
            body: >-
              Ent has a specific customer profile — Global 2000 security teams, regulated or sensitive environments, and
              a partner-assisted enterprise sales motion — which is stronger than many stealth-stage narratives. The
              weakness is not target ambiguity; it is the lack of named proof and durability disclosure.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: callout
            title: Retention underwriting is still impossible from public evidence
            body: >-
              The current source set does not disclose customer count, renewals, NRR, GRR, churn, contract terms, or
              concentration, so the public record cannot distinguish a handful of promising deployments from a
              repeatable retained customer base.
            calloutType: risk
            claimRefs:
              - CU007
              - CU008
              - CU010
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Disclosure and assurance risk remains the sharpest public gap
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence shows a company that can describe its architecture and target buyers in detail, but
              it still asks investors to bridge an unusually large public-proof gap. Independent coverage says Ent did
              not identify customers or disclose deployment scale, and Security Boulevard explicitly reported that the
              company has not publicly disclosed false-positive rates or independent testing for its intent-inference
              engine. Company materials emphasize customer-cloud deployment and data sovereignty for regulated buyers,
              which is directionally helpful, but that is not the same as showing third-party assurance, benchmark
              accuracy, or production references. For a security platform selling into financial services, defense, and
              other regulated environments, the missing proof is itself a core risk because referenceability and
              assurance evidence are often prerequisites for broader procurement approval.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR010
          - type: table
            tableRef: TR001
            claimRefs:
              - CR005
              - CR006
              - CR008
              - CR011
              - CR015
      - number: '7.2'
        title: The product promise implies meaningful endpoint and reliability risk
        blocks:
          - type: paragraph
            body: >-
              Ent is not pitching a lightweight analytics overlay; its own materials describe privileged endpoint
              components, on-device reasoning, real-time interventions, and cross-platform support. The Built In
              endpoint-engineering role says the macOS sensor spans multiple processes, runs privileged daemons and
              system extensions, processes thousands of events per second, and must resist tamper or evasion without
              degrading the machine. Security Boulevard also says the platform must coexist with incumbent EDR, SIEM,
              SOAR, and identity tools, which adds integration and policy-tuning burden on top of raw sensor
              reliability. Those disclosures make the likely failure modes clear: performance regressions, false
              positives, rollout friction, and support complexity can all erode the prevention narrative before the
              company has published independent efficacy data to offset them.
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR010
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR005
