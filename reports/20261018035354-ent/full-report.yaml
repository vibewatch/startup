            body: >-
              Ent's public story can map onto several large security categories, but the evidence-supported near-term
              wedge is much tighter: large enterprises, especially regulated or high-control accounts, willing to buy a
              new prevention layer through a CISO-led evaluation cycle.
            calloutType: insight
            claimRefs:
              - CM006
