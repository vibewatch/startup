      - number: '3.3'
        title: Commercial motion and switching costs
        blocks:
          - type: paragraph
            body: >-
              The sales and deployment evidence points to a classic enterprise motion rather than a self-serve wedge.
              Public pricing is absent, the product is sold into organizations with at least 5,000 employees, and the
              sales role expects technical evaluations, procurement, security review, and legal redlines. That is
              consistent with a buyer willing to layer Ent beside existing controls rather than rip out incumbents,
              which lowers displacement friction but also means Ent must justify incremental budget, agent overhead, and
              integration work. In other words, Ent can multi-home with the incumbent stack, but the same coexistence
              that eases adoption also weakens lock-in and gives buyers more leverage in comparative evaluations.
