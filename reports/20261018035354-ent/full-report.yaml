  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product scope and buyer workflow
        blocks:
          - type: paragraph
            body: >-
              Public materials consistently position Ent as an intent-aware workspace security platform built for human
              and AI-driven work rather than a narrow point tool. The recurring workflow is to observe activity where
              modern work happens — endpoints, browsers, applications, AI tools, and workflows — and decide whether a
              user or agent is acting within policy before the action completes. The reported buyer outcomes are
              insider-risk control, AI-governance enforcement, data-loss prevention, last-mile threat prevention, and
              faster investigation with more complete behavioral context. That is a meaningful product wedge because it
              reframes the product around decision-time intervention instead of only retrospective detection, but the
              strongest evidence for that wedge is still company-originated messaging echoed by press coverage rather
              than independent benchmark data.
