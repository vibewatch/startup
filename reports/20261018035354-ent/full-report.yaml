  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitute set
        blocks:
          - type: paragraph
            body: >-
              Ent is defining its market around "workspace security" rather than around a single incumbent budget line.
              In the assigned evidence, that boundary includes monitoring and intervening across browsers, applications,
              AI workflows, data movement, local runtimes, and endpoint activity before risky actions complete. That
              makes the closest substitutes a mix of endpoint detection and response, DLP, insider-risk monitoring,
              AI-governance controls, and secure-workspace products rather than a pure SOC analytics layer. Independent
              commentary also places the product closer to endpoint DLP and insider-risk management than to generic AI
              policy tooling, which narrows the practical market to buyers who already feel exfiltration, shadow-AI, and
              last-mile prevention pain.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM010
              - CM014
          - type: table
            tableRef: TM001
            claimRefs:
