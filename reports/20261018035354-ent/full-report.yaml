      - number: '1.1'
        title: Identity, stage, and product wedge
        blocks:
          - type: paragraph
            body: >-
              Public evidence consistently frames Ent as an intent-aware workspace security company built to intervene
              before risky human or AI-agent actions become incidents, rather than relying on post-event detection. The
              cleanest support comes from company-controlled launch and product materials, which also say the platform
              can run in the customer's cloud, preserve data sovereignty, and span Windows, macOS, Linux, and browser
              environments. Stage and scale signals are thinner: assigned evidence supports a seed-stage posture, a 2025
              founding year, and a 51-200 company-size band only through financing evidence and a company-profile
              directory, so those fields are usable as low-confidence snapshot context rather than fully corroborated
              ground truth.
