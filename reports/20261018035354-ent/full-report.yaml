      - number: '2.3'
        title: Evidence-constrained sizing and demand drivers
        blocks:
          - type: paragraph
            body: >-
              The market case is easier to articulate qualitatively than to size publicly. Across the assigned pool,
              repeated themes include AI compressing the time between compromise and impact, enterprise fear of
              unmanaged AI usage, demand for data sovereignty, and investor enthusiasm for endpoint-resident prevention.
              Those factors support a broad top-of-funnel opportunity. What the evidence does not provide is a clean
              public spend model, category CAGR, or company-specific SAM/SOM bridge, so the most defensible sizing
              approach is to narrow from a broad AI-governance and insider-risk problem set toward large enterprises
              already running proof-of-value cycles in regulated or high-control environments.
            claimRefs:
              - CM007
