        title: Durability and adverse evidence
        blocks:
          - type: paragraph
            body: >-
              The moat case today rests more on founder pedigree, funding, and narrative timing than on public proof.
              The $100 million seed, the RiskIQ and Microsoft lineage, and the on-device prevention thesis give Ent a
              credible opening, but the assigned evidence still lacks named public customers, third-party efficacy
              benchmarks, and transparent pricing. At the same time, adjacent vendor activity around AI-agent
              authorization, secure workspaces, and agentic identity is noisy, and even Simplify's own summary flags
              CrowdStrike and Microsoft as credible pressure points. Until Ent can show public wins or independent
