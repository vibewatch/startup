            Adds a new endpoint-plus-browser layer, but the evidence consistently centers on just-in-time intervention
            at the moment of risk.
          claimRefs:
            - CP002
            - CP004
            - CP014
        - label: Incumbent endpoint / XDR stack
          x: 1
          'y': 2
          tone: neutral
          detail: >-
            Lower incremental disruption because buyers already run these controls, but the assigned evidence frames
            them as more reactive on human and AI-agent intent.
          claimRefs:
            - CP004
            - CP005
        - label: Secure workspace / browser layer
          x: 4
          'y': 4
          tone: neutral
          detail: >-
            Workspace-centric products sit closer to user behavior than back-end SOC tooling, but the pool does not show
            the same endpoint breadth Ent claims.
          claimRefs:
            - CP012
            - CP015
        - label: AI-agent runtime identity
          x: 3
          'y': 4
          tone: neutral
          detail: >-
            Runtime authorization for AI agents is close to the decision point, but the evidence is identity- and
            policy-centric rather than endpoint-behavior centric.
          claimRefs:
            - CP012
            - CP015
        - label: Agent-security governance layer
          x: 3
          'y': 3
          tone: warning
          detail: >-
            Adjacent launches show fast-moving category overlap, but the assigned evidence does not disclose equivalent
            proof, pricing, or deployment scope.
          claimRefs:
            - CP011
            - CP012
        - label: Internal build / manual review
          x: 5
          'y': 1
          tone: negative
          detail: >-
            Building internally preserves control but shifts the burden onto the buyer and usually delays intervention
            compared with Ent's stated thesis.
          claimRefs:
            - CP005
            - CP015
