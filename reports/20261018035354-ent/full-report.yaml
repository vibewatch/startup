            body: >-
              The clearest architectural signal is that Ent is not described as a purely cloud-side SaaS policy engine.
              Instead, multiple sources describe a lightweight endpoint presence, customer cloud hosting, and on-device
              or near-device reasoning that evaluates intent in real time. Company hiring posts add unusually specific
              detail for an early-stage security vendor: the macOS sensor scope includes privileged daemons, per-user
              agents, system extensions, Endpoint Security, Network Extensions, FSEvents, IOKit, XPC, and high-volume
              event processing under hard deadlines. Together, those details imply a technically ambitious stack that
              spans data collection, local inference, policy enforcement, and downstream investigation context. The
              architectural picture is therefore specific enough to underwrite that Ent is building a real
              endpoint-grade product, but not specific enough to verify performance, false-positive rates, or how much
              of the inference stack is production-proven across each OS surface.
