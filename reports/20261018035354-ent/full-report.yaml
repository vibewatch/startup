      - number: '6.2'
        title: Production-use proof exists, but it remains logo-light and outcome-light
        blocks:
          - type: paragraph
            body: >-
              Ent does have stronger public adoption proof than a pure stealth deck story. Company-issued materials
              syndicated through Yahoo Finance and echoed by independent outlets state that the platform is already
              deployed with Global 2000 customers across hospitality, financial services, and defense, and that those
              customers use it for insider-risk detection, AI governance, data loss prevention, threat prevention, and
              incident investigation. General availability across Windows, macOS, Linux, and browser-extension
              deployments also supports the view that the product has moved beyond a pre-GA pilot phase. The missing
              piece is that none of the retained sources publish customer names, reference outcomes, account counts, or
              deployment scale, so the chapter can confirm production use but not the breadth or depth of that use. As
              market context rather than Ent-specific adoption proof, a CyberWire digest cites a 401-person Netrio
              survey in which 82% of U.S. mid-market enterprise IT leaders reported production AI use but only 26%
              reported enterprise-wide scaling and governance.
            claimRefs:
              - CU001
              - CU005
              - CU007
              - CU013
              - CU015
