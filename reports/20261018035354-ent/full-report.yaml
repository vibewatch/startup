  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Ent's public go-to-market narrative starts with large-enterprise security pain, moves through evaluation and
      governance review, and then seeks partner-assisted expansion after production.
    data:
      nodes:
        - label: CISO-led problem framing
          actor: CISO and security leaders
          phase: Land
          touchpoints:
            - Existing security relationships
            - Problem-led category pitch
            - Global 2000 account selection
          note: Large-enterprise ICP is explicit before feature comparison begins.
          tone: positive
        - label: Partner and direct account access
          actor: Account executives plus GuidePoint and other security partners
          phase: Land
          touchpoints:
            - Named-account planning
            - Joint account planning
            - Partner-sourced pipeline
          note: Channel leverage is a core access motion, not an afterthought.
          tone: opportunity
        - label: Technical evaluation
          actor: Security architects, engineers, and Ent technical staff
          phase: Evaluate
          touchpoints:
            - Proof of value
            - Clear yes-or-no evaluation
            - Engineer-supported deployment scoping
          note: Ent expects a real technical review rather than lightweight logo collection.
          tone: neutral
        - label: Governance and procurement review
          actor: IT and identity owners, privacy, legal, procurement, executive sponsor
          phase: Close
          touchpoints:
            - Security review
            - Privacy review
            - Legal redlines
            - Procurement sequencing
          note: The buying motion is multi-stakeholder and cycles are measured in quarters.
          tone: risk
        - label: Production deployment
          actor: Security operations and enterprise platform teams
          phase: Deploy
          touchpoints:
            - Customer-cloud hosting
            - Windows, macOS, Linux, and browser-extension coverage
            - Insider risk and AI governance use cases
          note: Public proof supports live deployment, but not deployment scale.
          tone: positive
        - label: Expansion and renewal proof gap
          actor: Customer success, sales leadership, and finance
          phase: Expand
          touchpoints:
            - Renewals not disclosed
            - NRR and churn not disclosed
            - Concentration not disclosed
          note: Expansion logic is visible, but public durability metrics are missing.
          tone: risk
