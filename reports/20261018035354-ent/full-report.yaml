              - CM014
      - number: '2.2'
        title: Buyer, user, and adoption path
        blocks:
          - type: paragraph
            body: >-
              Public demand signals point to an enterprise-security-led sale, not a departmental productivity purchase.
              Ent's own hiring language says sellers must open named accounts with CISOs, run technical evaluations, and
              survive security, privacy, legal, and procurement review inside organizations with at least 5,000
              employees, which implies a long, multi-stakeholder path from first meeting to production. The currently
              evidenced verticals — hospitality, financial services, and defense — all fit buyers with strong
              data-sovereignty, insider-risk, and AI-governance concerns. That combination suggests the serviceable
              wedge is regulated or otherwise security-mature enterprises that can justify another preventive control
              point at the workspace layer.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM007
              - CM011
