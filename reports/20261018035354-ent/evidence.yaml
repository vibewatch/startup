evidenceGaps:
  - type: missing-source
    severity: material
    topic: financing-governance
    missingEvidence: >-
      Post-money valuation, ownership percentages, board seats, protective provisions, and any secondaries or debt
      facilities tied to the seed round.
    whyItMatters: >-
      These terms determine how much real financial and governance leverage the headline $100 million round actually
      confers.
    diligencePath: Request the financing deck, cap table, and board consents from management or lead investors.
    relatedQuestionRefs:
      - QO004
      - QO005
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: ARR, pricing model, gross margin, burn, runway, and exact employee count.
    whyItMatters: >-
      The company-overview snapshot can show financing scale, but not operating efficiency or commercial maturity
      without these metrics.
    diligencePath: Obtain a board package or monthly KPI dashboard with the latest financial and headcount reporting.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership-and-founder-table
    missingEvidence: >-
      A complete public leadership and governance roster, including board members and non-founder executives beyond the
      two founders visible in assigned materials.
    whyItMatters: >-
      The leadership table is intentionally partial, so governance depth and succession risk cannot be judged from the
      public record alone.
    diligencePath: Request the board deck, org chart, and executive-team bios from management.
    relatedQuestionRefs:
      - QO003
      - QO004
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: >-
      Named customers, deployment depths, renewal behavior, and independent efficacy benchmarks for preventing AI-era
      threats.
    whyItMatters: >-
      Customer concentration and actual production outcomes are necessary to separate launch narrative from durable
      adoption.
    diligencePath: Request customer references, redacted contracts, proof-of-value reports, and renewal cohorts.
    relatedQuestionRefs:
      - QO004
      - QO006
      - QO007
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Independent market reports or public company disclosures that isolate the spend pool for workspace-layer
      prevention, AI-governance controls, or adjacent insider-risk / DLP budgets.
    whyItMatters: >-
      Without an external spend model, the chapter cannot defend a numeric TAM, SAM, or CAGR and must stop at an
      evidence-constrained wedge.
    diligencePath: >-
      Request analyst market maps, relevant public-company category disclosures, and any internal bottoms-up pipeline
      segmentation used by management.
    relatedQuestionRefs:
      - QM002
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: commercial-proof
    missingEvidence: >-
      Named customer references, deployment scale, pricing, pilot-to-production conversion, and budget source by
      segment.
    whyItMatters: >-
      Commercial proof would show whether the category narrative converts into repeatable budgeted demand or remains
      founder- and investor-led.
    diligencePath: >-
      Obtain customer references, pipeline conversion data, win-loss notes, and current pricing / packaging during
      management diligence.
    relatedQuestionRefs:
      - QM003
      - QM005
      - QM006
  - type: missing-source
    severity: material
    topic: benchmark-gap
    missingEvidence: >-
      Independent false-positive, latency, or intervention-efficacy benchmarks for intent-based controls at the endpoint
      and browser layer.
    whyItMatters: >-
      The market case depends on prevention quality; without external benchmarks, buyers may delay category adoption
      even if the threat narrative is strong.
    diligencePath: >-
      Request third-party testing, customer-operating metrics, and benchmark results from proofs of value or production
      deployments.
    relatedQuestionRefs:
      - QM007
      - QM008
  - type: private-evidence-only
    severity: material
    topic: competitive-pricing
    missingEvidence: >-
      Public pricing or packaging evidence for Ent plus direct and adjacent alternatives, including unit of pricing and
      evaluation terms.
    whyItMatters: >-
      Without published pricing or consistent commercial terms, the chapter cannot compare budget friction or
      discounting leverage across alternatives.
    diligencePath: >-
      Request current price sheets, packaging tiers, trial terms, and procurement notes from Ent and from the named
      incumbent or adjacent alternatives in active evaluations.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: competitive-proof
    missingEvidence: >-
      Named customer references, documented win-loss outcomes against incumbents, and third-party efficacy or
      false-positive benchmarks.
    whyItMatters: >-
      Durability and displacement risk hinge on whether Ent can prove differentiated outcomes in the field, not just a
      novel control-point narrative.
    diligencePath: >-
      Ask for reference calls, competitive bake-off notes, benchmark data, and production case studies tied to specific
      replacement or coexistence decisions.
  - type: private-evidence-only
    severity: material
    topic: pricing-disclosure
    missingEvidence: Contract terms, billing unit, list price, discount policy, ACV, and pilot-to-paid pricing conversion.
