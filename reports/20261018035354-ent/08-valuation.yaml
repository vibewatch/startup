company:
  name: Ent
chapter:
  number: 8
  title: Valuation
  summary: >-
    Ent has rare financing strength for a seed-stage cybersecurity company, but the public record still
    discloses no post-money valuation, commercial metrics, or customer concentration detail. That leaves
    the evidence strong enough for a watchlist recommendation and too thin for a price-backed buy call, so
    the valuation stance remains unknown pending private diligence.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      Public evidence supports a watchlist posture rather than an invest-now call. The strongest positives
      are the $100 million seed round, the caliber of the syndicate, and a product narrative that has moved
      from stealth into general availability across endpoint and browser surfaces. The gating problem is that
      none of the retained public materials disclose post-money valuation, preference stack, ARR, pricing,
      burn, or retention, so there is no external anchor for whether current private pricing is attractive,
      fair, or already stretched. In practice, that makes the quality of the company easier to underwrite
      than the quality of the entry price, which is why the evidence favors track rather than buy.
    claimRefs: [CV001, CV002, CV004, CV007, CV008, CV012]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-context-and-thesis-balance
    title: Financing context and thesis balance
    body: >-
      The financing itself is a meaningful signal: the round was led by Decibel with participation from
      Sequoia, Crosspoint, Craft, Shield, Felicis, and In-Q-Tel, and multiple coverage sources frame the
      raise as a bet on preventive, AI-native workspace security. That said, the public proof remains much
      stronger on investor enthusiasm and product framing than on commercial efficiency. Ent says it already
      serves Global 2000 customers across hospitality, financial services, and defense, but named references,
      renewal behavior, pricing, and customer concentration are still absent. Public marketplace and job-profile
      commentary also flags incumbent adjacency and the risk that pilots stall before the category is fully established.
    claimRefs: [CV001, CV003, CV009, CV010, CV011, CV012, CV014]
    tableRefs: [TV002]
  - id: scenario-framing-and-final-diligence
    title: Scenario framing and final diligence
    body: >-
      Because valuation terms and operating metrics are undisclosed, the scenario framework here is a gating
      tool rather than a numeric underwriting model. The bull case requires proof that the company can turn
      its unusually large seed and strong product wedge into durable enterprise deployment, referenceable
      customers, and metrics that justify premium pricing before incumbents compress the category. The base
      case assumes technical promise with incomplete commercial disclosure, which is consistent with a track
      or research-more outcome. The bear case is that financing headlines outrun adoption proof, leaving the
      next round or exit path exposed to valuation compression. Private diligence on terms, customers, and
      economics is the shortest path to moving the recommendation.
    claimRefs: [CV005, CV006, CV007, CV010, CV011, CV013, CV014]
    tableRefs: [TV003]
