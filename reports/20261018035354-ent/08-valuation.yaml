    columns:
      - Lens
      - Evidence-backed view
      - What would change the view
    rows:
      - ["Product wedge", "Intent-aware, customer-cloud-hosted prevention is differentiated and already generally available.", "Independent efficacy benchmarks, false-positive data, and named customer case studies would strengthen conviction."]
      - ["Capital and syndicate", "$100M seed plus a blue-chip investor set materially extends runway and category credibility.", "Post-money valuation and preference terms are required to tell whether the round quality also implies attractive entry."]
      - ["Commercial traction", "Management says Global 2000 buyers in hospitality, financial services, and defense are already deployed.", "Referenceable logos, pricing, ARR, concentration, and renewal evidence would convert the claim into investable proof."]
      - ["Competitive/downside", "Public marketplace and job-profile commentary flags adjacent security launches, moves by CrowdStrike and Microsoft, and the risk that unnamed pilots stall.", "Proof of repeatable wins against incumbents and disclosed expansion economics would reduce the downside case."]
    notes: Each row distinguishes what is supported now from what would have to be learned privately before the recommendation can improve.
    claimRefs: [CV001, CV003, CV004, CV008, CV009, CV010, CV012, CV013]
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Case
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - ["Bull", "Global 2000 deployments expand, customers become referenceable, and private metrics show strong pricing power plus efficient growth.", "Only then could premium private pricing be defended; current public evidence is insufficient to assign a range.", "Incumbent bundling, long enterprise sales cycles, and heavy endpoint execution demands still need to be outrun.", "Would require disclosed commercial traction beyond funding headlines."]
      - ["Base", "Product and financing remain credible, but disclosure stays limited and pilots take time to mature into repeatable enterprise revenue.", "Best framed as track/research-more until private diligence closes the valuation and unit-economics gaps.", "Opaque pricing, unknown burn/runway, and no public concentration or retention data.", "Most consistent with the current evidence set."]
      - ["Bear", "Funding optics stay ahead of measurable adoption, while incumbent platform vendors compress buyer urgency or budgets.", "A later round could reset expectations if traction lags the seed narrative; no public data exists to rule that out.", "Category education risk, stalled pilots, and lack of public commercial proof.", "Independent downside commentary and disclosure gaps keep this scenario live."]
    notes: Scenario logic is qualitative because the assigned source pool does not disclose valuation, revenue, or margin inputs needed for numeric ranges.
    claimRefs: [CV007, CV008, CV009, CV010, CV011, CV012, CV014]
