  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: valuation-terms
      missingEvidence: Post-money valuation, share count, liquidation preferences, pro-rata rights, and board or control terms for the 2026 seed round.
      whyItMatters: Entry price discipline and dilution risk cannot be assessed from round size alone.
      diligencePath: Request the latest cap table, term sheet, and board-rights summary under NDA before underwriting any position.
      relatedQuestionRefs: [QV002, QV008]
    - type: private-evidence-only
      severity: material
      topic: commercial-metrics
      missingEvidence: ARR, pricing, gross margin, burn, runway, net revenue retention, and customer concentration for the current enterprise cohort.
      whyItMatters: These metrics determine whether the product wedge can justify premium private pricing and whether the company is scaling efficiently.
      diligencePath: Obtain a current finance pack plus cohort-level customer metrics and reference calls with active deployments.
      relatedQuestionRefs: [QV003, QV006, QV008]
    - type: missing-source
      severity: material
      topic: independent-outcomes
      missingEvidence: Independent case studies or benchmark evidence showing measurable prevention efficacy, rollout speed, or expansion versus incumbents.
      whyItMatters: Public evidence today is much stronger on narrative and funding than on independently verified customer outcomes.
      diligencePath: Ask for blinded before-and-after operating data, competitive bake-off results, and referenceable customer introductions.
      relatedQuestionRefs: [QV004, QV006]
