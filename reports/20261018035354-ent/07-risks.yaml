    title: The public launch still lacks the proof points security buyers usually ask for
    body: >-
      Even after a $100M debut, public evidence still does not name customers, size deployments, or publish independent false-positive and efficacy data. That makes referenceability and assurance the clearest near-term risk.
    claimRefs:
      - CR003
      - CR004
      - CR005
  - calloutType: recommendation
    title: The next de-risking milestone is external proof, not more narrative
    body: >-
      Fresh capital and technical ambition are real strengths, but the investment case only improves if Ent starts converting launch messaging into named references, benchmark evidence, and repeatable enterprise wins.
    claimRefs:
      - CR001
      - CR008
      - CR014
