schemaVersion: report-v2
artifact: company-overview
slug: ent
runDate: 2026-10-18
company:
  name: Ent
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Ent is a very young seed-stage cybersecurity company positioning itself as an
    intent-aware workspace security layer for human and AI-driven work, with its
    public market debut tied to a $100 million seed round in June 2026. The
    strongest public evidence supports the financing, investor roster, deployment
    model, and product launches, while valuation, board structure, revenue, and
    precise customer depth remain undisclosed.
sections:
  - id: identity-positioning
    title: Identity, stage, and product wedge
    body: >-
      Public evidence consistently frames Ent as an intent-aware workspace
      security company built to intervene before risky human or AI-agent actions
      become incidents, rather than relying on post-event detection. The cleanest
      support comes from company-controlled launch and product materials, which
      also say the platform can run in the customer's cloud, preserve data
      sovereignty, and span Windows, macOS, Linux, and browser environments.
      Stage and scale signals are thinner: assigned evidence supports a seed-stage
      posture, a 2025 founding year, and a 51-200 company-size band only through
      financing evidence and a company-profile directory, so those fields are
      usable as low-confidence snapshot context rather than fully corroborated
      ground truth.
    claimRefs: [CO001, CO002, CO007, CO008, CO014, CO015]
    tableRefs: [TO001]
  - id: founders-leadership-governance
    title: Founders, leadership, and governance visibility
    body: >-
      Elias Manousos is the clearly documented public face of Ent as CEO and
      co-founder, while current hiring and company-profile pages also identify
      Brandon Dixon as a co-founder and connect the founding bench to RiskIQ and
      Microsoft Security Copilot. That pedigree gives the company credible
      founder-market fit for AI-era endpoint and workflow security. The main
      limitation is governance opacity: the
      assigned public evidence does not disclose a current board roster,
      independent directors, or investor governance rights, leaving key-person
      concentration and control terms as material diligence items.
    claimRefs: [CO010, CO011, CO012, CO013]
    tableRefs: [TO002]
  - id: financing-scale-and-commercial-signals
    title: Financing, commercial signals, and evidence limits
    body: >-
      Ent's public debut was paired with an unusually large $100 million seed
      round led by Decibel and joined by a blue-chip syndicate that includes
      Sequoia, Crosspoint, Craft, Shield, Felicis, and In-Q-Tel. That capital
      base, plus simultaneous hiring across engineering and go-to-market, implies
      a strategy built around rapid category creation rather than a measured seed
      burn profile. Commercial proof is directionally positive but still mostly
      company-authored: Ent says it already serves Global 2000 customers across
      hospitality, financial services, and defense, while a later company release
      quotes WestCap's CISO saying WestCap uses Ent. This single named reference
      does not establish customer count, pricing, revenue, retention, or
      deployment breadth. The fetched CyberWire issue no longer contains the Ent
      item surfaced during discovery, so it cannot substantiate the round.
    claimRefs: [CO003, CO004, CO005, CO006, CO013, CO016]
    tableRefs: [TO003]
  - id: milestone-readout
    title: Milestones since formation
    body: >-
      The timeline shows a compressed company history: a 2025 founding signal,
      a June 2026 stealth exit plus financing event, same-day claims of general
      availability and Global 2000 deployments, and a July 2026 expansion into
      AI visibility, data protection, and threat-aware application control. In
      other words, Ent already looks like a launch-stage commercial company, not
      a research project. The caveat is that nearly every milestone after
      founding still traces back to company-issued or company-amplified materials,
      including the WestCap reference, so later chapters should not assume
      customer depth or category leadership without additional independent proof.
    claimRefs: [CO001, CO003, CO006, CO008, CO009, CO015, CO016]
    figureRefs: [FO001]
tables:
  - id: TO001
    title: Snapshot KPI table
    columns:
      - Metric
      - Value / status
      - Date
      - Confidence
      - Gap / diligence ask
    rows:
      - [Headquarters, San Francisco, "2026-10-18", medium, "Validate legal entity address and office footprint from incorporation or compliance records."]
      - [Stage, Seed-stage private, "2026-10-18", low, "Confirm whether Ent still treats the company as seed-stage after the June 2026 financing."]
      - [Founded, "2025 (directory/profile evidence)", "2026-10-18", low, "Verify incorporation date and operating start from charter documents or state filings."]
      - [Total raised, "$100m seed financing announced", "2026-06-16", high, "Request cap table, instrument mix, and closing mechanics to confirm funded cash versus headline raise."]
      - [Deployment footprint, "Windows, macOS, Linux, browser environments; customer-cloud deployment emphasized", "2026-07-30", high, "Validate production architecture, browser coverage, and self-hosted versus SaaS mix in product diligence."]
      - [Customer proof, "Global 2000 deployment claim plus one named WestCap user reference", "2026-07-30", medium, "Obtain customer count, additional named logos, pilot-to-production status, and concentration data."]
      - [Headcount, null, "2026-10-18", low, "Only a 51-200 directory band appears in assigned evidence; request HRIS-backed employee count and location split."]
      - [Valuation, null, "2026-10-18", low, "Post-money valuation and preferred terms are not disclosed publicly; request financing documents."]
      - [Revenue / run-rate, null, "2026-10-18", low, "ARR, revenue, pricing, gross margin, burn, and runway are undisclosed in assigned evidence."]
    notes: >-
      Null means the assigned public evidence does not support a precise number;
      directory-style fields are low-confidence proxies and should be replaced by
      management data in diligence.
    claimRefs: [CO002, CO003, CO006, CO007, CO008, CO014, CO015, CO016]
  - id: TO002
    title: Leadership and founder table
    columns:
      - Person
      - Role
      - Background signal
      - Founder-market fit or functional coverage
      - Key-person dependency
    rows:
      - ["Elias Manousos", "CEO and co-founder", "Public face of the stealth launch and July product expansion", "Directly anchors category narrative around prevention-first endpoint and AI-agent security", "High: most public leadership proof in assigned evidence runs through Manousos."]
      - ["Brandon Dixon", "Co-founder (public hiring/profile pages)", "Named in third-party/hiring pages alongside RiskIQ and Microsoft Security Copilot background", "Adds technical founder continuity and product-security credibility, but official launch materials do not foreground him", "Medium-high: publicly visible but less independently documented than Manousos."]
    notes: >-
      Coverage is partial because assigned public evidence names founders but not
      a current board, CFO, CRO, or independent directors.
    enumerationScope:
      coverage: partial
      basis: Publicly named founders and leaders visible in assigned launch and hiring materials as of 2026-10-18.
    claimRefs: [CO010, CO011, CO012, CO013]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control or economic importance
      - Evidence
      - Diligence ask
    rows:
      - [Decibel, "Lead investor", "Lead status is disclosed; ownership and control rights are not", "Named lead in official and press coverage", "Request board seat, ownership %, pro-rata, and veto rights."]
      - [Sequoia, "Seed participant", "Participation is disclosed; check size and governance rights are not", "Named in official and press coverage", "Confirm check size and any observer rights."]
      - [Crosspoint Capital Partners, "Seed participant", "Participation is disclosed; check size and governance rights are not", "Named in official and press coverage", "Confirm ownership, governance rights, and portfolio conflicts."]
      - [Craft Ventures, "Seed participant", "Participation is disclosed; check size and governance rights are not", "Named in official and press coverage", "Confirm ownership, pro-rata rights, and side-letter terms."]
      - [Shield Capital, "Seed participant", "Participation is disclosed; check size and governance rights are not", "Named in official and press coverage", "Confirm ownership, information rights, and strategic obligations."]
      - [Felicis, "Seed participant", "Participation is disclosed; check size and governance rights are not", "Named in official and press coverage", "Confirm ownership, pro-rata rights, and side-letter terms."]
      - [In-Q-Tel (IQT), "Seed participant", "Participation is disclosed; check size and governance rights are not", "Named in official and press coverage", "Confirm ownership, information rights, and any customer or mission obligations."]
    notes: >-
      Exhaustive for investors named in the 16 Jun 2026 seed announcement; no
      ownership percentages, board seats, liquidation preferences, or secondary
      sales are public in assigned evidence.
    enumerationScope:
      coverage: exhaustive
      basis: All investors explicitly named in Ent's 16 Jun 2026 seed-financing announcement and corroborating press coverage.
    claimRefs: [CO003, CO004, CO005]
figures:
  - id: FO001
    title: Company milestone timeline
    type: timeline
    summary: >-
      Ent's public record moves quickly from 2025 formation signal to a June 2026
      stealth exit and funding event, then to a July 2026 product-scope expansion.
    data:
      items:
        - year: 2025
          label: Company founded (directory evidence)
          detail: Simplify lists Ent as founded in 2025, establishing a short operating history before the June 2026 launch.
          tone: neutral
          claimRefs: [CO015]
        - date: 2026-06-16
          label: Emerged from stealth
          detail: Ent publicly launched as an intent-aware workspace security company focused on preventing risky human and AI-agent actions before incidents occur.
          tone: positive
          claimRefs: [CO001, CO003]
        - date: 2026-06-16
          label: $100m seed financing announced
          detail: Official and independent coverage tied the launch to a $100 million seed round.
          tone: positive
          claimRefs: [CO003]
        - date: 2026-06-16
          label: Investor syndicate disclosed
          detail: Decibel led, with Sequoia, Crosspoint, Craft, Shield, Felicis, and IQT also named as participants.
          tone: positive
          claimRefs: [CO004, CO005]
        - date: 2026-06-16
          label: Commercial availability claimed
          detail: Ent said the platform was generally available across Windows, macOS, Linux, and browser-extension deployments.
          tone: positive
          claimRefs: [CO008]
        - date: 2026-06-16
          label: First customer sectors described
          detail: Ent said it was already deployed with Global 2000 customers in hospitality, financial services, and defense, without naming the customers.
          tone: neutral
          claimRefs: [CO006, CO016]
        - date: 2026-07-30
          label: Platform scope expanded
          detail: Ent announced AI visibility and control, endpoint data protection, and threat-aware application control capabilities.
          tone: positive
          claimRefs: [CO009]
        - date: 2026-07-30
          label: WestCap use reference published
          detail: Ent quoted WestCap's CISO saying WestCap uses the platform to secure its workspace.
          tone: neutral
          claimRefs: [CO016]
    claimRefs: [CO001, CO003, CO004, CO005, CO006, CO008, CO009, CO015, CO016]
callouts:
  - calloutType: risk
    title: Public disclosure is still thinner than the financing headline
    body: >-
      The assigned evidence is strong on funding, investor quality, deployment
      model, and product intent, but still thin on named customer proof,
      governance detail, and operating metrics. That makes Ent easy to recognize
      as a serious contender, but still hard to underwrite quantitatively.
    claimRefs: [CO003, CO006, CO013, CO016]
