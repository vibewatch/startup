company:
  name: Ent
chapter:
  number: 6
  title: Customers
  summary: >-
    Ent has credible early enterprise adoption proof, but that proof is still mostly sector-level
    and company-mediated rather than logo-level. Public materials consistently position the company
    in production with Global 2000 buyers across hospitality, financial services, and defense, yet
    they do not disclose named customers, retention metrics, or concentration data, leaving
    durability and expansion underwriting incomplete.
sections:
  - id: enterprise-icp
    title: Enterprise ICP is specific even if customer names are not
    body: >-
      Ent's public customer story is much clearer on who it targets than on who has already signed.
      The company and multiple news summaries consistently place the product inside Global 2000
      environments, and Ent's own sales postings narrow the target account list further to
      organizations with 5,000 or more employees. Those postings also make clear that the buyer
      is not a single champion: the sales motion runs through CISOs, security architects, IT and
      identity owners, procurement, legal, and executive sponsors, which is consistent with a
      complex enterprise security category. The same materials point to three initial verticals
      — hospitality, financial services, and defense — plus a customer-cloud deployment model
      designed to preserve data sovereignty for regulated or sensitive buyers.
    claimRefs: [CU001, CU002, CU004, CU011, CU014]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Production-use proof exists, but it remains logo-light and outcome-light
    body: >-
      Ent does have stronger public adoption proof than a pure stealth deck story. Company-issued
      materials syndicated through Yahoo Finance and echoed by independent outlets state that the
      platform is already deployed with Global 2000 customers across hospitality, financial
      services, and defense, and that those customers use it for insider-risk detection, AI
      governance, data loss prevention, threat prevention, and incident investigation. General
      availability across Windows, macOS, Linux, and browser-extension deployments also supports
      the view that the product has moved beyond a pre-GA pilot phase. The missing piece is that
      none of the retained sources publish customer names, reference outcomes, account counts, or
      deployment scale, so the chapter can confirm production use but not the breadth or depth of
      that use. As market context rather than Ent-specific adoption proof, a CyberWire digest cites
      a 401-person Netrio survey in which 82% of U.S. mid-market enterprise IT leaders reported
      production AI use but only 26% reported enterprise-wide scaling and governance.
    claimRefs: [CU001, CU005, CU007, CU013, CU015]
    tableRefs: [TU002, TU003]
  - id: durability-and-expansion
    title: Expansion logic is visible, but durability and concentration are still opaque
    body: >-
      The go-to-market design implies a classic land-and-expand enterprise motion: direct named
      accounts, partner-assisted sourcing, proof-of-value work, and a handoff into production after
      security, privacy, legal, and procurement review. That is strategically coherent for a new
      security category, but it does not substitute for retention evidence. The retained public
      record does not disclose NRR, GRR, churn, renewal timing, contract length, partner-sourced
      mix, or top-customer concentration, and Simplify's own commentary explicitly flags the lack
      of named customers as a risk if pilots do not mature into durable production relationships.
      For investors, that means customer quality appears plausible, but durability, expansion pace,
      and concentration risk remain diligence questions rather than underwritten facts.
    claimRefs: [CU003, CU008, CU009, CU010, CU012]
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - Segment
      - Buyer / user / payer
      - Public proof
      - Strategic value
      - Gap
    rows:
      - - Global 2000 hospitality enterprises
        - CISO-led buyer; security and IT teams are users; enterprise security budget is payer
        - Production deployment claimed across hospitality; use cases include insider risk and investigation
        - Shows live adoption in complex frontline operations
        - No named logo, contract size, or measured outcome
      - - Global 2000 financial-services enterprises
        - CISO and security architecture buyer; security operations users; regulated IT/security budget payer
        - Production deployment claimed across financial services; customer-cloud hosting and data sovereignty fit regulated buyers
        - Supports a wedge into data-sensitive enterprises
        - No bank name, renewal data, or procurement timeline
      - - Global 2000 defense and agency-adjacent organizations
        - Security leadership buyer; security operators and investigators are users; enterprise or mission security budget payer
        - Production deployment claimed in defense; In-Q-Tel quote points to agency demand for governance and forensic clarity
        - Strengthens public-sector-adjacent credibility
        - No named agency, award notice, or reference outcome
      - - Large enterprises sourced with and through partners
        - CISOs, security architects, IT/identity, procurement, and legal participate; partner ecosystem influences access
        - Sales role targets organizations with 5,000+ employees and calls GuidePoint plus other security partners core to pipeline
        - Expands route to market beyond founder-led selling
        - Partner concentration, attach rates, and close rates are undisclosed
    notes: >-
      Public segmentation is derived from Ent's sector claims and current enterprise-sales postings;
      it does not disclose customer counts, revenue by segment, or geography mix.
    claimRefs: [CU001, CU002, CU003, CU004, CU011, CU014]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric / signal
      - Public value
      - Date / source
      - Confidence
      - Implication / missing denominator
    rows:
      - - Production deployment claim
        - Global 2000 customers across hospitality, financial services, and defense
        - Jun 2026 official release plus multiple news echoes
        - High
        - Real deployment signal, but no account count or endpoint volume
      - - Product availability surface
        - Generally available across Windows, macOS, Linux, and browser-extension deployments
        - Jun 2026 SecurityBrief and ITTech Pulse
        - Medium
        - Suggests a live product, but not active usage or seat count
      - - Enterprise ICP size
        - Named accounts are organizations with 5,000+ employees
        - Current Built In and Simplify job listings
        - High
        - Indicates large-budget target buyers, not booked ARR
      - - Channel-assisted expansion motion
        - GuidePoint and other security partners are core to pipeline and co-selling
        - Current Built In strategic account executive posting
        - Medium
        - Shows access strategy, but partner-sourced share is missing
    notes: >-
      These are adoption and commercialization signals rather than audited customer metrics; the
      table intentionally distinguishes evidence of production use from missing denominators such as
      customer count, deployment size, or renewal rate.
    claimRefs: [CU001, CU002, CU003, CU012, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer proof
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - - Unnamed Global 2000 hospitality customer(s)
        - Hospitality
        - Insider-risk detection, data loss prevention, and incident investigation
        - Production per official and independent 2026 coverage
        - Confirms live sector adoption
        - No customer name, contract scope, or measurable outcome
      - - Unnamed Global 2000 financial-services customer(s)
        - Financial services
        - AI governance and customer-cloud monitoring in regulated environments
        - Production per official and independent 2026 coverage
        - Supports regulated-buyer relevance
        - No logo, renewal behavior, or procurement detail
      - - Unnamed Global 2000 defense customer(s)
        - Defense / agency-adjacent
        - Threat prevention plus forensic context for human and AI-driven work
        - Production per official and independent 2026 coverage; IQT quote reinforces demand context
        - Suggests mission-sensitive credibility
        - No named agency, award notice, or case-study outcome
    notes: >-
      Coverage is partial because the public record exposes only sector-level proof rather than
      named reference accounts; rows enumerate the disclosed deployment buckets, not a complete
      customer roster.
    enumerationScope:
      coverage: partial
      basis: >-
        Based on all retained public customer references in the assigned pool, which disclose only
        three sector buckets and no named customer roster or case-study list.
    claimRefs: [CU001, CU007, CU011]
figures:
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Ent's public go-to-market narrative starts with large-enterprise security pain, moves through
      evaluation and governance review, and then seeks partner-assisted expansion after production.
    data:
      nodes:
        - label: CISO-led problem framing
          actor: CISO and security leaders
          phase: Land
          touchpoints:
            - Existing security relationships
            - Problem-led category pitch
            - Global 2000 account selection
          note: Large-enterprise ICP is explicit before feature comparison begins.
          tone: positive
        - label: Partner and direct account access
          actor: Account executives plus GuidePoint and other security partners
          phase: Land
          touchpoints:
            - Named-account planning
            - Joint account planning
            - Partner-sourced pipeline
          note: Channel leverage is a core access motion, not an afterthought.
          tone: opportunity
        - label: Technical evaluation
          actor: Security architects, engineers, and Ent technical staff
          phase: Evaluate
          touchpoints:
            - Proof of value
            - Clear yes-or-no evaluation
            - Engineer-supported deployment scoping
          note: Ent expects a real technical review rather than lightweight logo collection.
          tone: neutral
        - label: Governance and procurement review
          actor: IT and identity owners, privacy, legal, procurement, executive sponsor
          phase: Close
          touchpoints:
            - Security review
            - Privacy review
            - Legal redlines
            - Procurement sequencing
          note: The buying motion is multi-stakeholder and cycles are measured in quarters.
          tone: risk
        - label: Production deployment
          actor: Security operations and enterprise platform teams
          phase: Deploy
          touchpoints:
            - Customer-cloud hosting
            - Windows, macOS, Linux, and browser-extension coverage
            - Insider risk and AI governance use cases
          note: Public proof supports live deployment, but not deployment scale.
          tone: positive
        - label: Expansion and renewal proof gap
          actor: Customer success, sales leadership, and finance
          phase: Expand
          touchpoints:
            - Renewals not disclosed
            - NRR and churn not disclosed
            - Concentration not disclosed
          note: Expansion logic is visible, but public durability metrics are missing.
          tone: risk
    approximationNotes: null
    claimRefs: [CU002, CU003, CU004, CU009, CU010, CU013, CU014]
callouts:
  - calloutType: strength
    title: Enterprise fit is clearer than logo proof
    body: >-
      Ent has a specific customer profile — Global 2000 security teams, regulated or sensitive
      environments, and a partner-assisted enterprise sales motion — which is stronger than many
      stealth-stage narratives. The weakness is not target ambiguity; it is the lack of named proof
      and durability disclosure.
    claimRefs: [CU001, CU002, CU003, CU004]
  - calloutType: risk
    title: Retention underwriting is still impossible from public evidence
    body: >-
      The current source set does not disclose customer count, renewals, NRR, GRR, churn, contract
      terms, or concentration, so the public record cannot distinguish a handful of promising
      deployments from a repeatable retained customer base.
    claimRefs: [CU007, CU008, CU010]
