  evidenceGaps:
    - type: enumeration-incomplete
      severity: material
      topic: named-customer-proof
      missingEvidence: Named customer references, case studies, procurement awards, or conference talks that identify live accounts and outcomes.
      whyItMatters: Without named proof, investors cannot test whether the disclosed sector claims translate into repeatable references or marquee logos.
      diligencePath: Request reference calls or named case studies by sector and cross-check them against procurement records or customer conference appearances.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: retention-metrics
      missingEvidence: Customer count, NRR, GRR, churn, renewal timing, contract length, and cohort behavior.
      whyItMatters: Durability determines whether current deployments represent repeatable retained revenue or only early pilots and first-wave wins.
      diligencePath: Ask management for cohort tables, renewal schedules, and top-customer revenue share by logo and by channel.
      relatedQuestionRefs: [QU004]
    - type: missing-source
      severity: material
      topic: channel-motion
      missingEvidence: Partner-sourced pipeline share, conversion rates, and customer concentration by channel or top account.
      whyItMatters: Channel leverage can accelerate access, but it can also hide dependence on a narrow reseller set or a handful of large buyers.
      diligencePath: Obtain pipeline mix, partner contribution, and top-10 customer concentration metrics from management and validate against board reporting.
      relatedQuestionRefs: [QU005]
