company:
  name: Ent
chapter:
  number: 3
  title: Competitors
  summary: 'Ent is selling a new intent-aware workspace-security layer into large enterprises, but the assigned evidence shows the real competition is broader than direct startup peers: incumbent endpoint suites, secure workspaces, AI-agent governance vendors, and internal build paths all solve parts of the same job. Its differentiation thesis is credible on control-point proximity, yet the lack of public pricing, named customer references, and third-party efficacy data leaves durability unproven and gives incumbents room to narrow the wedge.'
sections:
- id: landscape-and-alternative-set
  title: Landscape and alternative set
  body: The assigned evidence does not support a tidy one-for-one peer set, so the practical landscape is category-based. Ent is presented as a direct new-category vendor for intent-aware workspace security, while the adjacent and substitute set includes incumbent endpoint and security-operations tooling, secure-browser or workspace controls, AI-agent governance and runtime-identity layers, and internal build or manual review paths. That breadth matters because the buyer is still the same large-enterprise security team; Ent is not replacing budgetless whitespace, it is asking the CISO to prioritize one more control point inside a stack that already includes endpoint, identity, and workflow controls.
  claimRefs:
  - CP002
  - CP004
  - CP006
  - CP012
  - CP015
  tableRefs:
  - TP001
  figureRefs:
  - FP001
- id: differentiation-vs-incumbent-stack
  title: Differentiation versus the incumbent stack
  body: Ent's strongest evidence-backed differentiator is not a broad replacement claim; it is a control-point claim. Across the official launch copy and independent review, the product is described as evaluating intent at the moment of action, across browsers, apps, workflows, and local runtimes, and intervening before the risky action completes. That places Ent closer to the decision point than traditional EDR- or SIEM-centered response loops, but the same evidence also says the product sits alongside incumbent tooling. The competitive implication is that Ent can be sold as an additive layer for insider risk, AI governance, and last-mile threats, while the burden of proof stays high because buyers can compare that promise against tools they already operate.
  claimRefs:
  - CP002
  - CP003
  - CP004
  - CP009
  - CP014
  tableRefs:
  - TP002
- id: commercial-motion-and-switching-costs
  title: Commercial motion and switching costs
  body: The sales and deployment evidence points to a classic enterprise motion rather than a self-serve wedge. Public pricing is absent, the product is sold into organizations with at least 5,000 employees, and the sales role expects technical evaluations, procurement, security review, and legal redlines. That is consistent with a buyer willing to layer Ent beside existing controls rather than rip out incumbents, which lowers displacement friction but also means Ent must justify incremental budget, agent overhead, and integration work. In other words, Ent can multi-home with the incumbent stack, but the same coexistence that eases adoption also weakens lock-in and gives buyers more leverage in comparative evaluations.
  claimRefs:
  - CP004
  - CP005
  - CP006
  - CP007
  - CP010
  tableRefs:
  - TP003
- id: durability-and-adverse-evidence
  title: Durability and adverse evidence
  body: The moat case today rests more on founder pedigree, funding, and narrative timing than on public proof. The $100 million seed, the RiskIQ and Microsoft lineage, and the on-device prevention thesis give Ent a credible opening, but the assigned evidence still lacks named public customers, third-party efficacy benchmarks, and transparent pricing. At the same time, adjacent vendor activity around AI-agent authorization, secure workspaces, and agentic identity is noisy, and even Simplify's own summary flags CrowdStrike and Microsoft as credible pressure points. Until Ent can show public wins or independent efficacy evidence, the differentiation claim is plausible but not yet durable.
  claimRefs:
  - CP001
  - CP005
  - CP008
  - CP011
  - CP012
