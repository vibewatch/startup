artifact: financials
slug: ent
runDate: 2026-10-18
company:
  name: Ent
chapter:
  number: 4
  title: Financials
  summary: >-
    Ent has unusual seed-stage capitalization and visible enterprise-sales ambition, but its public evidence still stops well
    short of underwritable financial disclosure. The chapter supports a direct large-enterprise revenue model, meaningful
    delivery-cost complexity, and near-term hiring-led investment, while leaving pricing, revenue, margins, burn, and runway
    as material diligence gaps.
sections:
  - id: revenue-model-visibility
    title: Revenue model and monetization visibility
    body: >-
      Public evidence supports a software-led enterprise monetization model, but not a disclosed price sheet. Ent's company
      materials and launch coverage describe a workspace-security platform already in production with large enterprises, sold
      through technical evaluations and multistakeholder buying processes, yet none of the assigned sources publish list
      pricing, realized pricing, ARR, ACV, or contract duration. The result is a visible commercial workflow with an opaque
      economic outcome: investors can see how Ent wants to sell, but not what a closed deployment is worth or whether pricing
      compensates for deployment and support effort.
    claimRefs: [CI003, CI004, CI005, CI009, CI013]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: gtm-and-traction-proxies
    title: GTM motion and commercial traction proxies
    body: >-
      The cleanest public sales evidence comes from recruiting materials rather than customer contracts or reference accounts.
      Ent is hiring quota-carrying enterprise sellers for organizations with 5,000+ employees, expects security reviews,
      privacy review, legal redlines, and procurement to happen early, and describes sales cycles measured in quarters. That
      points to a direct, expensive, high-touch motion aimed at large regulated buyers. At the same time, Ent and third-party
      coverage cite Global 2000 deployments only at the sector level, leaving named-customer depth, pilot-to-production
      conversion, and renewal behavior unverified.
    claimRefs: [CI003, CI005, CI006, CI011]
    tableRefs: [TI003]
  - id: cost-structure-and-capital
    title: Cost structure and capital adequacy
    body: >-
      Ent's public architecture suggests that delivery economics will depend less on commodity cloud hosting and more on
      endpoint engineering, integrations, and customer-support intensity. The platform can run in the customer's cloud, but it
      also relies on endpoint agents, browser coverage, AI reasoning, high-fidelity telemetry, and escalation handling under
      strict performance budgets. Against that cost base, the $100 million seed round is a major financing advantage and the
      company has already said it will spend into engineering, sales, AI governance, and integrations. That improves the odds
      of funding product expansion, but it does not establish current cash, burn, runway, or the next financing trigger.
    claimRefs: [CI001, CI002, CI007, CI008, CI009, CI010, CI012]
  - id: verdict-and-blockers
    title: Financial verdict and diligence blockers
    body: >-
      Financially, Ent looks like a well-financed but still disclosure-light enterprise security company. The public record is
      enough to support a thesis of large-enterprise direct sales and a potentially capital-intensive delivery model, but not
      enough to underwrite revenue quality, gross-margin trajectory, or dilution risk. Until management provides pricing,
      contract structure, customer concentration, retention, burn, and runway, the financial case remains a watchlist story
      rather than a publishable operating model for investment underwriting.
    claimRefs: [CI004, CI011, CI012, CI013, CI014]
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - - Core workspace security platform
        - Direct enterprise platform sale after technical evaluation and enterprise review
        - Pricing unit undisclosed
        - In production with Global 2000 customers; no public revenue or ARR disclosed
        - Company-claimed traction with no contract economics
        - Provide sample order form, ACV, minimum term, and billing metric
      - - AI governance and integrations expansion
        - Product expansion funded from the seed round; packaging not disclosed
        - Add-on unit undisclosed
        - Public sources say proceeds will fund AI governance and integrations
        - Product roadmap visible; attach economics unavailable
        - Break out module packaging, attach rate, and upsell assumptions
      - - Hosting / deployment option
        - Customer-cloud or Ent-hosted deployment changes delivery economics more than published price
        - Surcharge or hosting fee undisclosed
        - Both deployment modes are described publicly
        - Architecture visible, monetization invisible
        - Clarify whether hosting changes price, support fees, or gross margin
      - - Services / proof-of-value labor
        - Technical evaluations, deployment work, and escalations imply nontrivial presales and support effort
        - Services pricing undisclosed
        - No separate services line is publicly described
        - Operational effort is visible but revenue treatment is not
        - Provide paid services policy, implementation scope, and support staffing ratios
    notes: >-
      Null-like descriptors reflect undisclosed public fields rather than zero values; the rows summarize publicly visible
      monetization surfaces and delivery touchpoints, not audited revenue segmentation.
    claimRefs: [CI003, CI004, CI005, CI007, CI008, CI009, CI013]
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Offer / motion
      - Price / unit / contract
      - List vs realized pricing
      - Discounts / unknowns
      - Source
    rows:
      - - Core platform sale
        - Public sources do not disclose list price, billing unit, or contract term
        - Only the enterprise-sales process is visible
        - Discounting, pilot policy, renewal uplift, and minimum commitments are unknown
        - Simplify job post; SiliconANGLE; TechCompanyNews
      - - Customer-hosted deployment option
        - Pricing impact not disclosed
        - Could change infrastructure pass-through versus Ent-hosted delivery, but no schedule is public
        - Hosting surcharge, implementation fee, and support premium are unknown
        - SiliconANGLE; Yahoo Finance / Business Wire
      - - Partner-assisted pipeline
        - Revenue-share economics not disclosed
        - Sources show partners can help source pipeline, not how bookings are split
        - Referral fees, reseller margin, and channel conflict are unknown
        - Simplify job post
    notes: >-
      Every row contains disclosure gaps; this table records what public evidence does and does not reveal about monetization,
      not a reconstructed price book.
    claimRefs: [CI004, CI005, CI006, CI009, CI013]
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Sales cycle proxy
        - Measured in quarters with security, privacy, legal, and procurement review
        - medium
        - Long cycles delay cash conversion and raise CAC requirements
        - Provide median cycle length, pilot-to-paid conversion, and stage win rates
      - - Customer segment proxy
        - Target buyers are organizations with 5,000+ employees; regulated-industry proof matters
        - medium
        - Large-enterprise focus implies high ACV ambition but slower ramp and concentration risk
        - Provide pipeline mix, average contract size, and first-year expansion behavior
      - - Gross margin
        - null
        - low
        - Customer-cloud deployment, endpoint agents, integrations, and escalations can widen service-cost variance
        - Provide GAAP and contribution gross margin with infrastructure and support allocation
      - - CAC / payback
        - null
        - low
        - Active sales hiring without bookings data prevents any public efficiency test
        - Provide fully loaded CAC, payback, seller ramp time, and quota attainment
      - - Burn / runway
        - null
        - low
        - A large seed improves optics but not sufficiency without cash and burn disclosure
        - Provide current cash, monthly burn, hiring plan, and next-round trigger
    notes: >-
      Null values mark metrics that are not publicly disclosed in the assigned evidence set; they are diligence blockers, not
      zeros.
    claimRefs: [CI001, CI004, CI005, CI008, CI010, CI012]
figures:
  - id: FI001
    title: Publicly visible revenue model bridge
    type: flow
    summary: Public evidence supports an enterprise sale-to-deployment workflow, but not disclosed pricing or gross profit.
    data:
      nodes:
        - id: prospecting
          label: Named-account enterprise prospecting
          detail: Account executives target organizations with 5,000+ employees using current CISO relationships plus outbound, events, and partners.
        - id: evaluation
          label: Technical evaluation / proof of value
          detail: Security teams run a technical evaluation with engineers before a clear yes/no decision.
        - id: procurement
          label: Security, privacy, legal, and procurement review
          detail: Enterprise reviews are sequenced early and push the sales cycle into quarters.
        - id: contract
          label: Signed enterprise contract
          detail: Exact pricing unit, contract term, and discount structure are not public.
        - id: deployment
          label: Customer-cloud or Ent-hosted deployment
          detail: The platform can run in the customer's cloud or be hosted by Ent, changing delivery economics.
        - id: gross-profit
          label: Gross profit visibility remains unavailable
          detail: Public sources expose delivery complexity and support effort, but not margin disclosure.
      edges:
        - from: prospecting
          to: evaluation
          label: self-sourced and partner-assisted pipeline
        - from: evaluation
          to: procurement
          label: engineer-supported proof of value
        - from: procurement
          to: contract
          label: budget and compliance approval
        - from: contract
          to: deployment
          label: full-cycle close to production rollout
        - from: deployment
          to: gross-profit
          label: cost drivers visible, economics undisclosed
    claimRefs: [CI005, CI006, CI009, CI013]
callouts:
  - calloutType: insight
    title: Capital is visible; operating metrics are not
    body: >-
      The $100 million seed round is a real financing advantage, but it does not substitute for revenue, gross-margin, burn,
      or runway disclosure.
    claimRefs: [CI001, CI002, CI012]
  - calloutType: risk
    title: Commercial proof still relies on company framing
    body: >-
      Ent can point to sector-level Global 2000 deployments, but public evidence still lacks named customer proof, pricing, and
      pilot-conversion detail, leaving category-risk questions unresolved.
    claimRefs: [CI003, CI004, CI011, CI014]
