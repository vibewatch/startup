callouts:
  - calloutType: "insight"
    title: "The serviceable wedge is narrower than the funding headline"
    body: >-
      Ent's public story can map onto several large security categories, but the
      evidence-supported near-term wedge is much tighter: large enterprises,
      especially regulated or high-control accounts, willing to buy a new
      prevention layer through a CISO-led evaluation cycle.
    claimRefs: ["CM006", "CM007", "CM013"]
  - calloutType: "risk"
    title: "Proof burden remains a market constraint"
    body: >-
      The current narrative is strong, but public evidence still lacks independent
      efficacy and ROI benchmarks while the sales motion itself implies long
      enterprise reviews. That combination can slow category creation even when
      buyer pain is real.
    claimRefs: ["CM011", "CM012", "CM014"]
