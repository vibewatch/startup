company:
  name: "Ent"
chapter:
  number: 2
  title: "Market Analysis"
  summary: >-
    Ent is trying to carve out a workspace-security layer that sits across endpoint,
    browser, AI-governance, insider-risk, and data-loss-prevention workflows rather
    than selling a generic security tool. The assigned evidence supports a
    serviceable wedge in large, regulated enterprises, but it does not provide a
    defensible public TAM/SAM/SOM or independent efficacy benchmark, so market
    sizing remains evidence-constrained.
sections:
  - id: "market-boundary"
    title: "Market boundary and substitute set"
    body: >-
      Ent is defining its market around "workspace security" rather than around a
      single incumbent budget line. In the assigned evidence, that boundary includes
      monitoring and intervening across browsers, applications, AI workflows, data
      movement, local runtimes, and endpoint activity before risky actions complete.
      That makes the closest substitutes a mix of endpoint detection and response,
      DLP, insider-risk monitoring, AI-governance controls, and secure-workspace
      products rather than a pure SOC analytics layer. Independent commentary also
      places the product closer to endpoint DLP and insider-risk management than to
      generic AI policy tooling, which narrows the practical market to buyers who
      already feel exfiltration, shadow-AI, and last-mile prevention pain.
    claimRefs: ["CM001", "CM002", "CM003", "CM010", "CM014"]
    tableRefs: ["TM001"]
  - id: "buyers-and-adoption"
    title: "Buyer, user, and adoption path"
    body: >-
      Public demand signals point to an enterprise-security-led sale, not a
      departmental productivity purchase. Ent's own hiring language says sellers
      must open named accounts with CISOs, run technical evaluations, and survive
      security, privacy, legal, and procurement review inside organizations with at
      least 5,000 employees, which implies a long, multi-stakeholder path from first
      meeting to production. The currently evidenced verticals — hospitality,
      financial services, and defense — all fit buyers with strong data-sovereignty,
      insider-risk, and AI-governance concerns. That combination suggests the
      serviceable wedge is regulated or otherwise security-mature enterprises that
      can justify another preventive control point at the workspace layer.
    claimRefs: ["CM004", "CM005", "CM006", "CM007", "CM011"]
    tableRefs: ["TM003"]
  - id: "sizing-and-drivers"
    title: "Evidence-constrained sizing and demand drivers"
    body: >-
      The market case is easier to articulate qualitatively than to size publicly.
      Across the assigned pool, repeated themes include AI compressing the time
      between compromise and impact, enterprise fear of unmanaged AI usage, demand
      for data sovereignty, and investor enthusiasm for endpoint-resident prevention.
      Those factors support a broad top-of-funnel opportunity. What the evidence does
      not provide is a clean public spend model, category CAGR, or company-specific
      SAM/SOM bridge, so the most defensible sizing approach is to narrow from a
      broad AI-governance and insider-risk problem set toward large enterprises
      already running proof-of-value cycles in regulated or high-control
      environments.
    claimRefs: ["CM007", "CM008", "CM009", "CM013", "CM014"]
    tableRefs: ["TM002"]
    figureRefs: ["FM001"]
  - id: "constraints-and-gaps"
    title: "Constraints, proof burden, and diligence gaps"
    body: >-
      The same sources that make the category legible also show why adoption could be
      slower than the financing headline implies. Ent is asking buyers to trust
      inferred intent and just-in-time intervention at the point of action, but the
      assigned evidence contains no independent false-positive rate, latency, or ROI
      benchmark. The go-to-market language also describes quarter-long enterprise
      evaluations and cross-functional approval chains, which means category
      education and proof burden likely remain high even when the threat narrative is
      compelling. Until public evidence includes clearer pricing, conversion, or
      efficacy data, valuation arguments should treat the market as promising but not
      yet cleanly quantified.
    claimRefs: ["CM006", "CM011", "CM012", "CM013", "CM014"]
