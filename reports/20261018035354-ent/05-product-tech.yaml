  evidenceGaps:
    - type: missing-source
      severity: material
      topic: trust-and-compliance-proof
      missingEvidence: Public trust-center material, certification records, or regulatory/compliance attestations tied to Ent's product.
      whyItMatters: Buyers in regulated sectors need independent proof of security, privacy, and control posture beyond product copy.
      diligencePath: Request trust-center artifacts, certification mappings, and third-party security review summaries from the company.
      relatedQuestionRefs:
        - QE006
    - type: private-evidence-only
      severity: material
      topic: efficacy-and-reliability
      missingEvidence: Quantified detection efficacy, false-positive rates, intervention latency, and any status or incident-history evidence.
      whyItMatters: The core underwriting question is whether real-time prevention works at enterprise scale without unacceptable friction.
      diligencePath: Ask for production benchmark data, customer references, and reliability reporting by deployment surface.
      relatedQuestionRefs:
        - QE006
        - QE008
    - type: private-evidence-only
      severity: material
      topic: integration-depth
      missingEvidence: Named integrations, connector coverage, and module-level architecture documentation by operating system and browser surface.
      whyItMatters: Integration depth and feature parity determine whether Ent can land as an additive control or requires heavy implementation effort.
      diligencePath: Request solution architecture documentation, supported-integration matrix, and platform-by-platform feature list.
      relatedQuestionRefs:
        - QE002
        - QE003
