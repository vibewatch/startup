companyProfile:
  summary: >-
    Pulumi is a Seattle-founded infrastructure software company launched in 2017. It began with a
    real-language infrastructure-as-code engine and has expanded into a broader cloud control plane
    spanning Pulumi Cloud state management, Deployments, ESC secrets/configuration, Insights & Governance,
    and the Neo AI platform engineer layer. Public evidence shows credible enterprise customer adoption,
    continued product expansion, and open-source traction, but limited public disclosure on revenue,
    retention, and the exact current financing mark.
  foundedDate: '2017-03-01'
  founders:
    - name: Joe Duffy
      role: Co-Founder & CEO
      background: Former Microsoft engineering leader; remains the key public product and strategy voice.
      claimRefs: [CO006, CO038]
    - name: Eric Rudder
      role: Co-Founder & Executive Chairman
      background: Former Microsoft executive; remains a visible founder-level governance and enterprise-software presence.
      claimRefs: [CO007]
  foundingLocation: Seattle, WA
  headquarters: Seattle, WA
  productSummary: >-
    Open-source infrastructure as code plus a commercial Pulumi Cloud control plane for deployments,
    secrets/configuration, governance, and AI-assisted infrastructure operations.
  customerFocus: >-
    Platform engineering teams, cloud infrastructure owners, and sophisticated mid-market to enterprise
    software and IT organizations standardizing cloud workflows.
  businessModel: >-
    Freemium open-source distribution with commercial SaaS and enterprise monetization around Pulumi Cloud,
    usage-based workflow features, premium plans, and higher-value control-plane modules.
  stage: Series D
  fundingStatus: >-
    Official public evidence clearly confirms the Seed, Series A, Series B, and $41M Series C in October 2023.
    Later tracker-style sources point to a reported 2025 Series D and roughly $1.5B post-money valuation,
    but that financing context should be treated as unverified until primary documents are reviewed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO003, CO005, CO006, CO007, CO014, CO019, CO020, CO026, CO027, CO037, CV003]
