  - id: FR003
    title: 依赖图谱
    type: dag
    layout: wide
    summary: Pulumi 掌握产品逻辑，但法律义务、provider 生态、客户信任和外部模型平台仍会牵制它。
    data:
      nodes:
        - id: pul
          label: Pulumi 控制平面
          detail: 状态、部署、治理和 Neo 上下文。
        - id: law
          label: 合同与隐私义务
          detail: PSA、隐私承诺和企业审查。
        - id: reg
          label: 监管环境
          detail: GDPR、AI 治理和采购标准。
        - id: cloud
          label: 云 / Provider API
          detail: 底层基础设施和 provider 兼容性。
        - id: git
          label: Git / CI 生态
          detail: 评审和执行触发器。
        - id: models
          label: 模型生态
          detail: 支撑 Neo 的外部模型提供方。
        - id: cust
          label: 企业客户
          detail: 采用深度、信任和集中度。
      edges:
        - from: law
          to: pul
          label: 设定合同义务
        - from: reg
          to: law
          label: 抬高合规标准
        - from: cloud
          to: pul
          label: 支撑或限制功能对等
        - from: git
          to: pul
          label: 推动工作流采用
        - from: models
          to: pul
          label: 支撑 AI 任务编排
        - from: cust
          to: pul
          label: 决定变现深度
    claimRefs:
