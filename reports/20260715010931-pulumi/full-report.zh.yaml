        - Pulumi Cloud Team / Enterprise / Business Critical，按用量计费
        - 有利于免费增值采用，但商业价值取决于控制平面挂载
      - - Terraform
        - 核心工具加 HCP Terraform 产品
        - 商业云 / 企业层
        - 对已在 Terraform 工作流上标准化的买家更熟悉
      - - OpenTofu
        - 开源、社区治理
        - 已审首页证据未显示同等集成控制平面
        - 重视开放性的 Terraform 用户切换摩擦更低
