  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 正确建议是继续研究：质量看得见，价格支撑还看不清
        blocks:
          - type: paragraph
            body: >-
              Pulumi
              已经拿出足够的产品质量和客户相关性证据，值得留在投资人的活跃名单里；但公开经济数据还不足以支撑在假定的后期价格上给出高确信买入。故事里最强的部分很清楚：可信的企业客户名单、有意义的开源分发、不断扩展的工作流模块，以及与平台工程和云治理趋势一致的品类。问题在估值纪律。公开来源无法清晰确认当前
              ARR、净留存、毛利率，甚至无法完全对齐当前融资估值标记。公司卖的是带多层挂载的基础设施平台，这些指标比叙事更重要。因此，结论是继续研究，而不是回避。业务可能不错，但支撑价格的证据不完整。如果私下尽调证明模块挂载强、留存耐久，且融资估值标记更接近公允而非拉伸，建议可能很快上调。
            claimRefs:
              - CV001
              - CV002
