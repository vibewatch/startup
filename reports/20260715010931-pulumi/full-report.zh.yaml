              作为一家后期私营基础设施公司，Pulumi 的披露模式制造了非常具体的尽调负担。公司在产品如何打包、客户如何运营化上异常透明， 但对当前 ARR、毛利率、净留存、流失率和现金消耗并不透明。今天的客户数有多少通过
              Pulumi Cloud 变现，又有多少来自开源使用或间接企业采用， 也不清楚。公开融资记录还在两条线之间分叉：一条是明确官方的 2017-2023 年融资，另一条是 2026 年由追踪器驱动的后续轮次断言。
              这些缺口并不让业务失去吸引力；它们只是让人无法仅凭公开证据得出清晰的单位经济和资本效率结论。任何从跟踪转向投资的投资人，
