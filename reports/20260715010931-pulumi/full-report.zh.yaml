            body: >-
              Pulumi 不公开披露收入或 ARR，所以任何财务解读都必须从间接证据开始。官方来源披露了客户和社区里程碑：2023 年 C 轮文章中的 2,000 名客户和 100 名员工，2025 年 9 月 Neo
              发布稿中的 3,700+ 客户，以及当前基础设施即代码页面上生产环境中的 4,000+ 家公司。这些是有意义的商业信号，因为它们指向一个很大的漏斗顶端和有真实企业渗透的产品，而不是小众开源项目。
              定价来源也暗示，当治理、自托管、支持和规模要求出现后，企业合同可进入数万到数十万美元区间。案例研究进一步说明，Pulumi 往往部署在生产关键环境，而不只是实验中。不过，收入质量仍不透明。公开信息没有拆分免费 /
              开源用户与付费云客户，没有披露净留存， 也没有披露服务强度。因此，后续估值分析应强调情景区间和变现架构质量，而不是假装精确知道当前 ARR。
