  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Pulumi 通常从平台或基础设施痛点切入，借标准化和工作流复用扩张，之后才成为更广的记录型控制平面。
    data:
      nodes:
        - stage: Pain point
          label: 云团队被脆弱的 YAML、手工脚本或不一致的资源预置流程困住
        - stage: Land
          label: 平台团队先在一个堆栈、环境或工作流族采用 Pulumi
        - stage: Enable
          label: 开发者复用语言原生模块和标准化模板
        - stage: Operationalize
          label: Pulumi Cloud、Automation API 或 Deployments 进入日常基础设施运维
        - stage: Expand
          label: 更多团队、区域或工作流采用共享策略、密钥和部署控制
        - stage: Platform of record
          label: Pulumi 成为资源预置、治理和修复的工作流中心
    approximationNotes: 这条旅程综合了 Atlassian、Wiz、Starburst 和企业引用中反复出现的模式，不是在描述一套通用导入路径。
