figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    layout: wide
    summary: Pulumi 的公开时间线显示，从 2017 年成立到 2025 年底，公司稳步走向更宽的平台和 AI 叙事。
    data:
      items:
        - date: 2017-03
          label: 成立
          detail: Pulumi 在 Seattle 成立，并获得种子轮支持。
        - date: 2017-11
          label: 首个客户
          detail: 成立当年开始商业验证。
        - date: 2018-06
          label: 开源发布
          detail: 开发者获客渠道变得清晰。
        - date: 2018-10
          label: Series A 轮 + 服务上线
          detail: 商业化 Pulumi Service 随 $15M Series A 轮同步推出。
        - date: 2019-09
          label: Pulumi 1.0
          detail: 核心 IaC 产品到达 1.0 里程碑。
