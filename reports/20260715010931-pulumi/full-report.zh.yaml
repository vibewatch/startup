      - number: '8.4'
        title: 剩下的工作很具体：核实估值标记、核实挂载、核实耐久性
        blocks:
          - type: paragraph
            body: >-
              Pulumi 离可投已经不远，只差正确证据，所以剩余尽调很具体，不抽象。第一，确认实际融资背景：轮次规模、投后估值、投资人条款，以及常被引用的 2025 年 Series D
              估值是否真实、当前且干净。第二，验证客户经济性：前 10 大客户集中度、模块挂载、NRR、GRR、合同期限，以及有多少客户在为更高价值控制平面层付费。第三，验证运营质量：可用性、安全流程，以及 Neo
              正在变成可变现、可信的工作流层，还是只是一场有用的 demo。如果这些检查结果扎实，尽管竞争风险存在，Pulumi
              仍值得认真做一次后期投资评估。如果结果不扎实，正确姿态仍是跟踪，或者避免追高。因此，打破论点的触发点很简单：如果估值标记相对真实 ARR 过高、挂载仍浅，或信任事故伤害平台中心性，估值支撑就会消失。
