      - number: '1.2'
        title: 创始人、领导班底与治理可见度
        blocks:
          - type: paragraph
            body: >-
              Pulumi 公司故事里最耐久的是创始班底。Joe Duffy 公开定位为联合创始人兼 CEO，Eric Rudder
              仍任联合创始人兼执行董事长，使公司有清晰的技术和企业软件血统。领导层页面还列出营销、财务、产品、客户工程、工程、人力和收入运营等职能负责人；
              在这个阶段，不少私营公司披露的运营纵深更少，这一点有帮助。董事会名单显示早期投资人仍有影响力：Madrona、Tola Capital 和 NEA 与 Eric Rudder、Joe Duffy
              一起保持可见。这足以证明连续性，但不足以回答更难的治理问题，例如股权集中度、独立董事比例、委员会结构， 或创始核心以下的接班规划。Joe Duffy
              仍是产品发布、融资文章和战略信息中的公开门面，所以即使管理班底已经拓宽，关键人风险仍然真实存在。 尽调上的实际解读是：创始人-市场匹配和品类可信度为正，但治理透明度还不够，达不到跨轮或 IPO
              阶段投资人想看的水平。
