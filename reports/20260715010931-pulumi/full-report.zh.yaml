      - number: '5.4'
        title: 发布节奏、生态依赖与主要产品解读
        blocks:
          - type: paragraph
            body: >-
              Pulumi 的发货节奏显示，公司在主动扩展平台，而不是进入维护模式。2025-2026 年博客流覆盖 Neo 发布、代码评审、集成、只读和计划模式、 ESC 导入和轮换、自托管
              Insights。这一节奏在战略上有用，因为它让公司持续贴近当前平台工程问题，例如 AI 治理、密钥蔓延和运营修复。 它也暴露了产品依赖模式。Pulumi 的核心价值仍依赖云厂商 API、用于部分
              provider 广度的 Terraform-bridge 生态、基于 Git 的开发者工作流，以及客户愿意把控制集中到 Pulumi Cloud。这些依赖对品类来说正常，但很重要。它们带来快速生态支持的上行，
              也带来依赖外部 provider 对齐和组织流程变化的下行。正确的产品解读是：Pulumi 已经搭出一个可信且有广度的基础设施平台；
              剩下的问题不是它能否发功能，而是客户能否把足够多功能运营化，形成持久的工作流引力。
