    title: 关键依赖图
    type: dag
    layout: wide
    summary: Pulumi 掌握工作流和控制逻辑，但仍依赖 provider 生态、Git 工作流、客户流程变更和外部模型集成。
    data:
      nodes:
        - id: dev
          label: 开发者 / 平台团队
          detail: 主要用户编写并运行工作流。
        - id: pul
          label: Pulumi 控制平面
          detail: 状态、策略、部署和 AI 上下文中心。
        - id: prov
          label: Provider 生态
          detail: 面向云和 SaaS 资源的原生与桥接 providers。
        - id: git
          label: Git / CI 系统
          detail: PR 驱动和自动化部署工作流。
        - id: pol
          label: 策略 / 合规层
          detail: 护栏、扫描、漂移和审计逻辑。
        - id: ai
          label: 模型与 agent 集成
          detail: Neo 依赖外部模型能力和上下文管线。
        - id: cust
          label: 客户运营模型
          detail: 团队必须真正集中工作流，才能拿到完整价值。
      edges:
        - from: dev
          to: pul
          label: 编写者和操作者
        - from: pul
          to: prov
          label: 预置资源
        - from: git
          to: pul
          label: 触发工作流
        - from: pol
          to: pul
          label: 约束动作
        - from: ai
          to: pul
          label: 增加任务自动化
        - from: cust
          to: pul
          label: 采用深度决定粘性
