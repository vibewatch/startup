        title: 法律、监管和安全义务可管理，但正在上升
        blocks:
          - type: paragraph
            body: >-
              Pulumi 不是受监管的资产负债表业务，但法律和监管层并不因此轻松。公司现在销售的软件可以存储基础设施状态、协调密钥和配置、 触发修复，并在企业环境中暴露 AI
              辅助的运营动作。即便没有行业特定经营牌照，这也会带来合同、隐私和合规义务。 公司的隐私政策、专业服务协议、安全页面和状态页面显示，Pulumi 已经把自己呈现为成熟企业供应商，这一点合适。风险在于，
              产品广度会放大失败的爆炸半径。如果 Pulumi 销售的是密钥编排、治理和 AI 驱动修复，客户会期待在数据处理、访问边界和变更安全上有强控制。 GDPR 和新兴 EU AI
              框架等更宽的政策环境今天不是直接阻碍，但会抬高 Pulumi 在国际企业账户中记录并治理数据和 AI 行为的标准。
