  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 最高风险栈在战略层面：竞争、附加深度和信任
        blocks:
          - type: paragraph
            body: >-
              Pulumi 最重要的风险是战略和运营风险，而非生死级监管风险。公司面对 Terraform 的装机基础、OpenTofu 的开源势能、 AWS 原生团队内部的 AWS
              CDK，以及广泛的平台工程或工作流工具市场。这意味着 Pulumi 不能只靠语法更顺手获胜。 它需要客户足够深入采用周边控制平面层——Deployments、ESC、治理和 Neo——让产品比独立 IaC
              引擎更难移除。 第二层风险是信任。Pulumi 越来越多地在企业工作流中管理状态、密钥、策略、修复和 AI 辅助动作。一旦出现重大宕机、 密钥处理问题或 AI
              修复错误，打击的正是客户付费让它集中化的核心区域。第三层是 GTM 适配。Pulumi 最好的买方是成熟平台团队，
              通常意味着高价值账户，但也意味着更长销售周期、更高实施预期，以及有限数量的可引用内部拥护者，影响不小。
