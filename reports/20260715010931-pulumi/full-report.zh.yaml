        - 开源 AWS 原生框架
        - 主要靠 AWS 用量变现，而不是单独的 CDK 平台账单
        - 如果能接受 AWS 锁定，采用门槛低
      - - Crossplane
        - 开源控制平面模型
        - 商业化取决于周边厂商 / 运营方
        - 能力可以很强，但要求更高的平台成熟度
      - - Ansible
        - 开源自动化加企业打包
        - 企业价值绑定更广义自动化平台
        - 往往作为更广义自动化的一部分采购，而非纯 IaC 决策
