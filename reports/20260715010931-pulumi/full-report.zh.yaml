          - type: paragraph
            body: >-
              Pulumi 的技术哲学在各模块之间保持一致：基础设施应该更像软件，平台工作流应该可编程，而不是由工单驱动。核心 IaC 页面强调真实语言构件、 单元测试、IDE 支持和 Git 原生评审。Deployments
              把这一哲学延伸到服务端执行，提供 review stacks、TTL stacks、定时部署、 漂移检测、自托管 runner 和 GitHub Enterprise 支持。Neo
              再进一步，让基础设施任务具备对话式和智能体式形态， 同时仍继承 Pulumi 的状态、策略和审批模型。客户证据说明，这些工作流原语不是纸面概念。Atlassian 用 Pulumi
              简化了多区域开发者环境；Starburst 使用 Automation API，后来又回到 Pulumi Cloud 以重新获得部署和状态功能；Wiz 把 Automation API
              嵌入到大规模多云供应系统。技术上，Pulumi 最强适配的是想搭建可复用内部工作流的组织，而不只是管理静态配置文件。
