        title: 扩张看起来合理；留存和满意度披露仍不足
        blocks:
          - type: paragraph
            body: >-
              Pulumi 的公开材料支持采用动能和部分扩张逻辑，但尚不足以支撑硬性的留存承销。公司披露的漏斗顶端客户数随时间上升——2023 年 C 轮公告约 2,000+，2025 年 Neo 发布稿为
              3,700+，当前产品页称生产环境中有 4,000+ 家公司。这条轨迹意味着采用仍在继续， 但不能证明付费账户质量或净留存。案例研究暗示先落地再扩张行为，因为多个客户跨团队、区域或工作流类型使用 Pulumi；
              但公开来源没有披露 GRR、NRR、客户流失、合同期限或扩张 ARR。第三方公开评论密度相对 Pulumi 所称规模也偏轻，
              意味着外部客户验证仍比理想状态薄。正确结论是：采用证据扎实，但耐久性指标仍是重大尽调请求。承销上，公开客户广度令人鼓舞， 但私有队列数据仍决定成败。
