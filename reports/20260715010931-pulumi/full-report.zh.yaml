      - number: '5.3'
        title: 信任、合规、质量，以及自动化周围的控制结构
        blocks:
          - type: paragraph
            body: >-
              Pulumi 的信任叙事已经不只是“我们有一个开源引擎”。当前产品页和 2025 年末公告显示出更明确的治理栈，围绕政策即代码、审计轨迹、 RBAC、SSO、漂移检测、客户自管密钥，以及针对合规问题的 AI
              辅助修复。Insights & Governance 现在把审计、修复和预防打包成一个生命周期； Neo 的代码评审、只读模式和计划模式则显示，公司试图把 AI
              执行包进运营护栏，而不是裸露代码生成。差异化是正向的， 因为多数基础设施智能体仍是外挂在现有工具上，而不是继承一等的基础设施图、状态历史和访问模型。风险在于，每增加一层治理或 AI，
              客户对可靠性和安全性的预期都会升高。实践中，当状态、策略、部署和 AI 等控制平面层相互强化时，Pulumi 的产品质量主张最强； 如果孤立评估某个功能，主张会弱一些。
