  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品模块、控制平面层，以及 Pulumi 现在销售的内容
        blocks:
          - type: paragraph
            body: >-
              Pulumi 的产品面已显著宽于“用 TypeScript 写基础设施即代码”。核心引擎仍围绕用主流语言供应基础设施、预览变更和维护状态。 在这个引擎周围，Pulumi
              搭建了托管控制平面，加入协作、访问控制、可审计性、通过 ESC 管理密钥和配置、通过 Deployments 编排部署、通过 Insights & Governance 处理搜索和策略工作流，以及现在通过 Neo
              提供 AI 原生运营层。战略上这很关键， 因为产品从语法选择变成了平台选择。客户可以从 OSS IaC 或基础云状态管理起步，再扩展到治理、策略修复、漂移运营和 AI 辅助工作流，
              而不必换工具。因此，最深的产品问题不是 Pulumi 能不能供应基础设施——它显然能——而是是否有足够多客户采用堆栈的多层能力， 使平台比简单开源引擎更难被替换。
