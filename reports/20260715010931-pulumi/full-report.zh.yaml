            body: >-
              融资能见度混杂。官方记录到 C 轮为止很扎实：2017 年种子轮、2018 年 $15 million A 轮、2020 年 $37.5 million B 轮，以及 2023 年 $41 million C
              轮。第三方追踪器对后续发生了什么分歧很大，Tracxn 仍锚定累计融资约 $99 million，而 StartupHub 指向后续 D 轮和约 $229 million
              累计融资。没有当前现金余额披露，投资人公开能做的最好事情是搭建启发式估算。 员工追踪器显示，2026 年 Pulumi 大约在 122 到 129 名员工区间。对于一家美国中心的云软件公司，叠加工程、GTM
              和支持层， 这意味着即使不算基础设施、合作伙伴和专业服务支出，年度运营成本基数也不小。好消息是，如果用量主要来自控制平面和状态管理经济， 而不是人力密集服务，Pulumi
              的产品模型可以支撑软件式毛利率。需要警惕的是，治理重的企业销售动作、迁移支持和高接触客户工程， 如果扩张依赖大量导入辅导，也会带来服务拖累。公开证据不足以高置信判断业务资本效率高或低。
