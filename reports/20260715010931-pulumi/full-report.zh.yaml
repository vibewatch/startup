        title: 护城河耐久性、定价姿态与主要竞争风险
        blocks:
          - type: paragraph
            body: >-
              Pulumi 的护城河真实存在，但不是攻不破。最强的耐久优势是语言灵活性、贴合软件工程的工作流，以及 Pulumi 已在核心引擎之上扩展到密钥、部署、治理和
              AI。客户一旦围绕更宽平台标准化，这些延伸会抬高切换成本，所以重要。 但护城河也有约束。Terraform 仍是生态基准，而且 IBM 收购 HashiCorp 后，它现在进入了更大的分发机器。OpenTofu
              给 Terraform 用户一条更容易的路径：保留工作流，同时绕开 BUSL 担忧，从而削弱 Pulumi 的开源定位。AWS CDK、Crossplane
              和自研平台都能吸收同一买方问题的部分切片。不利迁移叙事也显示，只有工作负载足够动态、足以证明这些优势时，Pulumi 的强项才最有价值。实践中，Pulumi
              的竞争耐久性取决于能否证明其一体化平台节省的工程时间和治理精力足以压过在位者熟悉度。 这是有力但并不自动成立的销售论点。
