chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品版图与当前阶段
        blocks:
          - type: paragraph
            body: >-
              作为一家开发者工具公司，Pulumi 的公开身份少见地一致：公司称自己的目标是让每位工程师都能用上云；现在的产品页把这一使命包装成面向基础设施团队的统一平台， 而不是单一用途的 IaC 工具。当前网站呈现的
              Pulumi 堆栈覆盖开源基础设施即代码、集中式密钥与配置、部署编排、治理， 以及名为 Neo 的 AI 智能体层。差异化仍来自推动早期采用的同一个想法：基础设施可以用
              TypeScript、Python、Go、C#、Java 甚至 YAML 等主流语言编写，而不只靠专有 DSL。官方产品页也显示，Pulumi 仍将开源引擎以 Apache 2.0
              提供，同时通过分层订阅和用量计量变现 Pulumi Cloud。落到尽调，这意味着投资人承销的不只是一个点状工具，而是一套平台策略：免费增值分发、开源开发者获客，以及不断扩张的商业控制平面。
              更不清晰的是阶段标签。官方公开材料仍把最具体的融资细节停留在 2023 年 C 轮，而 2026 年第三方追踪工具暗示后续轮次和更大的资本基础。 因此，本章把 Pulumi
              视为一家后期私营公司：公开产品叙事强，但当前融资记录仍有一部分不透明。
