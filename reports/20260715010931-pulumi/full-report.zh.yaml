      - number: '2.4'
        title: 增长驱动、约束及其对 Pulumi 的含义
        blocks:
          - type: paragraph
            body: >-
              最强需求驱动很直接：云支出持续上升，企业需要可重复的变更管理，多云运营抬高抽象需求，平台团队承压，要把基础设施从工单运维转成软件交付。 一旦组织达到中等规模，政策即代码、审计轨迹、漂移管理和 AI
              辅助修复也会从锦上添花变成可进入预算的功能。但约束同样真实。 Firefly 强调技能缺口、工具碎片化和 IaC
              覆盖不完整是持续阻塞。市场报告强调漂移、复杂度和合规负担。Platformengineering.org
              显示，许多团队仍没有很好地衡量成功，因此平台项目可能拿不到足够预算或难以证明合理性。生态里也挤满了够用的替代品， 尤其针对 AWS 中心或 Terraform 深度嵌入的团队。对 Pulumi
              来说，市场增长本身并不保证轻松拿份额。公司最适合那些更看重多云灵活性、 软件工程手感、平台团队自助服务和治理广度的买方，而不是更看重 Terraform 装机基础或云原生团队拼接多工具习惯的买方。
              这很有吸引力，但也意味着更长的企业教育周期和以证据为核心的销售，而不是纯粹自下而上的病毒式传播。
