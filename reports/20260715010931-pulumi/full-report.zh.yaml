      - number: '8.3'
        title: 多头逻辑很强；如果变现深度跟不上叙事宽度，反面论点同样成立
        blocks:
          - type: paragraph
            body: >-
              多头逻辑很直接：Pulumi 成为基础设施工作流的权威平台，而不只是更好的 IaC 界面。出现这种结果时，客户在核心引擎之上采用 Deployments、治理、ESC 和
              Neo，扩张改善，公司作为战略性基础设施控制平面拿到溢价倍数。基准情形更均衡：Pulumi
              仍是一家优质平台公司，有真实采用，但公开经济透明度有限，投资人在支付溢价前会要求有纪律的进入价格和更强尽调。空头情形是，公司依然被工程师欣赏，但相对产品雄心的宽度，变现太浅。只要模块挂载偏弱、竞争持续激烈，或高私募估值已经计入未来成功，即使业务本身并不“差”，下行也可能明显。因此，这里的估值工作不是绝对判断公司好不好，而是要求证明经济性配得上战略热情。
            claimRefs:
              - CV021
