      - number: '2.2'
        title: 市场规模、增速与采用渗透
        blocks:
          - type: paragraph
            body: >-
              公开市场数据方向上很强，但数字很嘈杂。The Business Research Company 估计基础设施即代码市场 2026 年约 $2.03 billion，2030 年达到 $5.25
              billion；Global Market Insights 则把 2026 年口径放在接近 $1.2 billion，2035 年为 $8.6 billion。这些差异很大，但并不致命，因为两者仍意味着持续处在
              20% 中段的 CAGR， 并且都把品类增长与云采用、DevOps 成熟、合规自动化和多云复杂度挂钩。从从业者侧看，Firefly 的 2025 State of IaC 数据称，89% 的受访者已经采用
              IaC，但只有 6% 完成全覆盖，68% 已经跨多个云运营，65% 表示过去两年云复杂度上升。 这组组合对 Pulumi
              很重要：市场在认知上并不早期，但在完整运营化上仍处早期。因此，增长少来自说服团队相信代码化基础设施有用， 更多来自帮助团队补上覆盖缺口、理顺碎片化工具，并把 IaC 延伸到平台、治理和 AI 辅助运营。
