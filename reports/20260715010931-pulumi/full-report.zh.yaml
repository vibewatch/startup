      - number: '1.3'
        title: 融资历史、规模标记与里程碑节奏
        blocks:
          - type: paragraph
            body: >-
              Pulumi 的里程碑记录在历史产品和融资节奏上很扎实。官方公司时间线记录：2017 年 3 月成立并完成 $5 million 种子轮，2017 年 11 月获得首位客户，2018 年 6 月开源发布，2018
              年 10 月推出 Pulumi Service 并完成 A 轮， 2019 年发布 Pulumi 1.0，2020 年发布 Pulumi 2.0 并完成 B 轮，2021 年发布 Pulumi 3.0，2022
              年推出 Universal IaC 和 Deployments，2023 年推出 Insights、ESC、平台团队定位并完成 C 轮。B 轮和 C 轮博客补充了有用背景： B 轮为 $37.5
              million，由 NEA 领投；C 轮为 $41 million，来自 Madrona、NEA、Tola 和 Strike。此后的规模标记更混杂。 2023 年 10 月，公司披露超过 2,000 名客户、超过
              150,000 名最终用户和 100 名员工；2025 年 9 月 Neo 新闻稿把客户数提高到超过 3,700；当前产品页称生产环境中已有 4,000+ 家公司；2026 年外部员工数追踪器集中在约 122 到
              129 人。这组信号支持持续增长的叙事， 但也说明后续章节为什么必须把官方公司说法、第三方估计和尚未确认的后期融资断言分开。
