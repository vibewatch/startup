      - number: '8.2'
        title: 可比语境支持战略相关性，但不能自动带来估值安全感
        blocks:
          - type: paragraph
            body: >-
              可比参照两面都能讲。正面看，基础设施自动化和平台工程资产仍然吸引资本和战略兴趣。IBM 以 $6.4 billion 收购 HashiCorp，LaunchDarkly
              也证明开发者基础设施平台可以达到数十亿美元级私募估值。谨慎看，这些可比公司不能自动给 Pulumi 的任何估值标记背书。HashiCorp 出售前规模大得多，已经上市，也定义了品类。LaunchDarkly
              的产品范围和变现画像不同。Spacelift、Humanitec、Firefly、env0、Massdriver
              等其他私营可比公司证明生态活跃，但公开收入和估值细节往往有限或未披露，无法提供干净的估值锚。实际结论是：Pulumi
              明确处在一个有战略价值的品类里，但公开证据仍不足以支撑虚假精确。投资人应把当前估值标记当作需要验证的假设，而不是必须接受的事实。
            claimRefs:
              - CV011
              - CV012
