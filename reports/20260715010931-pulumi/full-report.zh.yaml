      - number: '1.4'
        title: 反向信号、矛盾与未解决的证据缺口
        blocks:
          - type: paragraph
            body: >-
              Pulumi 概览章的主要警示不是产品弱，而是最新公司级指标的证据质量。官方网页对产品广度、客户故事、领导层姓名和 2017-2023 年融资弧线给了很好的信息，但没有公开确认任务背景中预研到的 2025 年
              10 月 D 轮。与此同时，追踪器分歧很大：Tracxn 仍显示截至 C 轮约 $99 million 融资，StartupHub 则指向后续 D 轮和累计融资约 $229
              million，其估值估算仍低于所给背景中的 $1.5 billion 投后估值。客户数和员工数信号也要谨慎处理：官方口径从 2023 年 2,000 名客户变为 2025 年新闻稿中的 3,700
              名客户，产品页现在称生产环境中有 4,000+ 家公司；外部员工追踪器则集中在 120 人出头，而非一个精确值。最后， Terraform-vs-Pulumi 分析中的对比内容进一步说明，Pulumi
              的可编程性是差异化点，但对技能混合的团队而言，也可能让产品感觉比声明式替代品更复杂。 因此，正确的尽调姿态是把 Pulumi
              视为一家可信的后期基础设施平台，品类契合度强；同时保留围绕当前融资条款、收入质量和装机基础精确规模的明确证据缺口。
