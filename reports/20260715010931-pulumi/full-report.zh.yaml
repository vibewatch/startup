  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接竞争者、替代品，以及为什么竞争场域是分层的
        blocks:
          - type: paragraph
            body: >-
              Pulumi 的竞争场域是分层的，因为团队购买“基础设施即代码”的方式，不像购买单一用途应用。Terraform 是许多多云组织的默认在位者， 仍通过 HCL、模块生态和多年企业采用定义市场重心。OpenTofu
              并不是一个全新品类，更像是在 HashiCorp 许可证变化后， 试图把 Terraform 运营模型保留在开放治理之下。AWS CDK 是强替代品，适合主要想用通用语言写基础设施、但主要活在 AWS
              内部的团队。 Crossplane 更从控制平面角度竞争，尤其面向希望把基础设施暴露为 Kubernetes API 的 Kubernetes 原生平台团队。Ansible 比核心 IaC
              厂商更宽、更老，但只要团队的自动化问题混合了供应、配置和编排，它仍是真实替代品。因此，Pulumi 的输赢不太取决于标题里的品类规模，而取决于每个账户如何权衡语言灵活性、平台团队工作流集成、治理广度和迁移成本。
