  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、相邻预算与现状替代品
        blocks:
          - type: paragraph
            body: >-
              Pulumi 并不是卖进一个边界干净的单一市场。最窄的镜头是基础设施即代码工具：通过代码而非手工流程来供应、版本化和治理基础设施的软件与服务。
              多家研究发布方采用这一框架，并明确把市场拆成工具与服务、声明式与命令式方法、云端与本地部署模型。但 Pulumi 真正的销售面比纯供应更宽。 它的商业平台现在把状态、密钥、部署、治理和 AI
              打包在一起，预算归属因而同时靠近平台工程和内部开发者平台，而不只是独立 IaC 预算。 这一更宽镜头很重要，因为买方往往不只拿 Pulumi 和 Terraform 或 OpenTofu 比，还会混合比较 AWS
              CDK、Crossplane、Ansible、 自研脚本和工单驱动的平台运营。换句话说，现状替代品通常是碎片化工作流，而不是某个直接在位产品。这种混合边界解释了为什么第三方报告的自上而下市场测算差距很大，
              也解释了为什么产品差异化越来越围绕工作流整合、开发者体验和治理，而不只是原始资源供应。
