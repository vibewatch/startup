  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入流、变现设计，以及 Pulumi 实际向什么收费
        blocks:
          - type: paragraph
            body: >-
              Pulumi 的公开变现设计比扁平的按席位开发者工具订阅更复杂。公司仍用开源分发和免费个人层播种采用， 但商业云产品把几个独立的控制平面行为分别变现：基础版本、托管资源、部署分钟数、ESC 密钥和 API
              调用。定价页明确显示， Team 层从相对低的固定入口起步，而 Enterprise 和 Business Critical 支持更宽的治理、自托管和合规用例。独立定价摘要大体同意，
              小团队可以从适度支出开始；但组织一旦需要 SSO、审计、自托管、漂移检测、高级支持或更高资源数，真正的企业合同就会变得有意义。 这一设计在战略上重要，因为 Pulumi 可以沿采用和用量两条轴扩张。客户可以从开源
              IaC 或小额 Team 订阅开始，之后再挂上部署、治理、 密钥和 AI 辅助运营等更高价值工作流。财务上行很明显；尽调难点在于，公开材料仍没有披露开源或免费使用转化为付费云账户或更高价值企业模块的精确比例。
