      - number: '3.2'
        title: 功能广度、工作流适配，以及 Pulumi 真正不同的地方
        blocks:
          - type: paragraph
            body: >-
              Pulumi 最清晰的技术差异化在于核心编写模型直接使用主流语言和软件工程构件，而不是要求团队学习专用 DSL。这一差异会进一步传导到测试、 IDE 支持、代码复用、内部包，以及通过 Automation API
              嵌入基础设施工作流。对比来源一致承认这一优势。它们也反复指出， Terraform 在 provider 广度、模块可用性以及已熟悉 HCL 的运维中心团队的简单熟悉感上仍更强。OpenTofu
              保留了大量相同体验， 同时恢复了开源治理叙事。AWS CDK 为 AWS 中心组织缩小了语言差距，但不能同等解决多云标准化问题。Crossplane 和 Ansible 在特定语境下各自比 Pulumi
              更适合相邻用例：Crossplane 适合 Kubernetes 原生控制平面，Ansible 适合混合配置与编排资产。
              正确视角不是“哪个工具全局最好”，而是“哪个工具最匹配团队运营模型”。当应用工程师和平台工程师需要一个跨云和治理层的可编程工作流时， Pulumi 最占优。
