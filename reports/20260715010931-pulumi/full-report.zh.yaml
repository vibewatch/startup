      - CR014
      - CR016
      - CR021
      - CR022
      - CR027
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 一边是强产品和客户质量，另一边是未解的定价与经济性，推荐结论就落在两者之间。
    data:
      nodes:
        - id: a
          label: 产品广度
          detail: 通用编程语言 IaC，加上 Deployments、ESC、Governance 和 Neo。
        - id: b
          label: 客户质量
          detail: 成熟平台团队背书和企业级标杆客户。
        - id: c
          label: 品类相关性
          detail: 基础设施自动化仍具战略重要性。
        - id: d
          label: 经济性不透明
          detail: ARR、NRR、利润率和附加渗透大多未披露。
        - id: e
          label: 定价不确定性
          detail: 公开证据对当前后期估值标记的支撑并不一致。
        - id: f
          label: 推荐意见
          detail: 继续研究；中等置信；高风险；估值立场为偏高至未知
      edges:
        - from: a
          to: f
          label: 支撑质量
        - from: b
          to: f
          label: 支撑相关性
        - from: c
          to: f
          label: 支撑战略兴趣
        - from: d
          to: f
          label: 压低确信度
        - from: e
          to: f
          label: 压低价格支撑
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV008
      - CV010
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 假设估值为 $1.5B，如果 Pulumi 实际经常性收入基数不同，隐含收入倍数会大幅变化。
    data:
      items:
        - label: $25M ARR 假设
          value: 60
        - label: $35M ARR 假设
          value: 42.9
        - label: $50M ARR 假设
          value: 30
        - label: $75M ARR 假设
          value: 20
        - label: $100M ARR 假设
          value: 15
    approximationNotes: 这些只是简单的投后估值 / ARR 敏感性比率，用用户提供的 $1.5B 估值作为待检验假设，而不是已确认的融资事实。
    claimRefs:
      - CV013
      - CV020
      - CV025
      - CV026
      - CV033
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 情景估值区间说明，Pulumi 如果入场价合适会有吸引力；但若当前定价已计入成功，仍会显得昂贵。
    data:
      items:
        - label: 悲观
          low: 0.6
          mid: 0.85
          high: 1.1
        - label: 基准
          low: 1
          mid: 1.35
          high: 1.7
        - label: 乐观
          low: 2
          mid: 2.45
          high: 3
        - label: 已报道 / 假设估值
          low: 1.5
          mid: 1.5
          high: 1.5
    approximationNotes: 区间是作者估算，锚定公开可比公司背景、战略质量，以及缺失 Pulumi 特定经济指标带来的不确定性。
    claimRefs:
      - CV012
      - CV014
      - CV027
      - CV028
      - CV029
      - CV030
