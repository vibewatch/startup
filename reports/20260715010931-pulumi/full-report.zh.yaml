      - number: '3.3'
        title: 迁移经济、证明点，以及真实世界证据说明什么
        blocks:
          - type: paragraph
            body: >-
              最强的支持 Pulumi 的证据并不来自抽象产品主张，而来自迁移和客户故事，它们展示了真实工作流变化。Atlassian 的 Bitbucket 团队从基于 DSL 的工具迁走，把环境维护时间削减了 50%
              以上。Starburst 表示，在替换以 Terraform 为中心的胶水工作流后， Pulumi 将多区域蓝绿部署周期从两周缩短到三小时。2026 年的对比和迁移文章也强化了更细的现实：Pulumi
              确实能减少代码量、 提升可测试性，并与应用代码共享逻辑；但状态仍然是状态，长尾生态中的 provider 滞后仍可能重要，Terraform + Pulumi
              混合资产只有在所有权边界明确时才跑得通。这些证据意味着竞争现实是分裂的。Pulumi 对绿地项目或高动态组合工作负载很有吸引力， 尤其当团队已经活在 TypeScript、Python 或 Go
              里。但对于稳定基础层、小众 provider 生态，或深度 Terraform 原生团队， 迁移 ROI 可能太小，不足以支撑整体替换。这使 Pulumi 的竞争动作比品类话术所暗示的更外科手术式、更以证明为先。
