  - id: TP004
    title: 护城河耐久度 / 竞争风险登记表
    columns:
      - 风险 / 护城河因素
      - 对 Pulumi 的方向
      - 证据
      - 重要性
      - 近期映射
    rows:
      - - 语言优先的开发者体验
        - 护城河
        - Pulumi 与对比来源都持续强调完整编程语言支持
        - 与应用牵头的基础设施团队高度契合
        - 有利于绿地项目和动态组合工作负载
      - - Terraform 生态引力
        - 风险
        - 对比资料和市场调查仍把 Terraform 视为默认既有厂商
        - 推高迁移与培训切换成本
        - 大型企业可能更偏好渐进式改变
      - - 开源定位
        - 混合
        - Pulumi 仍是 Apache 2.0，但 OpenTofu 也回应了许可证顾虑
        - 削弱了原本清晰的差异化论点
        - Pulumi 必须销售平台价值，而不只是开放性
      - - 超越置备的平台广度
        - 护城河
        - Pulumi 现已打包部署、治理、密钥和 AI 工作流
        - 提高挂载率和内部切换成本
        - 如果客户采用多个模块，可能改善扩张经济性
      - - 长尾生态中的 provider 对等性
        - 风险
        - 迁移叙事显示，某些桥接或小众 provider 场景存在滞后
        - 会拖慢 SaaS 密集环境中的采用
        - 迁移时需要克制地选择工作负载
      - - IBM 持有 HashiCorp
        - 风险
        - HashiCorp 现处于更大的厂商分销机器之中
        - 对部分企业买家，可能强化既有厂商信任
        - Pulumi 必须在开发者和平台 UX 上执行得更好
    notes: 护城河强度有条件：买家把 Pulumi 当平台采用时会增强；若只比较单一置备语法功能，护城河会变弱。
