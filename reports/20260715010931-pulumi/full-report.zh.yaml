  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 竞争、依赖和信任风险，会沿客户采用、附加渗透、留存和资本效率传导，最终影响估值。
    data:
      nodes:
        - id: comp
          label: 竞争
          detail: Terraform、OpenTofu、超大规模云厂商和相邻平台。
        - id: trust
          label: 信任 / 可靠性
          detail: 状态、密钥、AI 和控制平面完整性。
        - id: dep
          label: 生态依赖
          detail: Provider、Git 工作流、模型和平台伙伴。
        - id: adopt
          label: 采用与附加渗透
          detail: 先拿下初始客户，再扩展到多模块。
        - id: ret
          label: 留存与客户背书质量
          detail: 标杆客户是否耐久，证明材料是否够宽。
        - id: eff
          label: 资本效率
          detail: 销售效率和研发杠杆。
        - id: val
          label: 估值
          detail: 倍数支撑和融资信心。
      edges:
        - from: comp
          to: adopt
          label: 拖慢获客，或迫使打折
        - from: trust
          to: ret
          label: 损害续约和案例证明
        - from: dep
          to: adopt
          label: 造成同质化，或带来工作流摩擦
        - from: adopt
          to: eff
          label: 影响扩展效率
        - from: ret
          to: eff
          label: 决定耐久度
        - from: eff
          to: val
          label: 改变融资信心
        - from: adopt
          to: val
          label: 拉动平台溢价
    claimRefs:
