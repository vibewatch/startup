      - number: '2.3'
        title: 买方、用户、付款方与内部采用路径
        blocks:
          - type: paragraph
            body: >-
              Pulumi 最相关的买方不是泛泛的开发者，而是平台工程、云工程、DevOps 和重视安全的基础设施团队，他们想打造可复用的内部黄金路径。 Humanitec
              对平台工程的定义把内部开发者平台描述为一个抽象层，把基础设施访问变成有支持的产品，从而降低认知负荷。CNCF 和 SlashData 数据提供了当下证明：28% 的组织称有专门的平台工程团队，41%
              对内部平台采用多团队协作模型，35% 已经在 AI 工作流中采用混合平台方法。预算负责人通常来自平台、云或基础设施职能，但使用者可能是更广的工程人群， 他们消费模板、部署工作流和带策略护栏的自助服务。这一区分利好
              Pulumi，因为它的真实语言方法能触达应用开发者， 而云控制平面又服务中央平台团队。采用路径通常从一个团队在窄工作流里替换手工脚本或声明式工具链开始；平台团队证明复用和安全收益后，
              再扩展到自助服务、治理、密钥和全组织标准。
