  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 谁买 Pulumi、谁使用它，以及为什么买方地图重要
        blocks:
          - type: paragraph
            body: >-
              Pulumi 的公开客户证据集中在平台工程团队、云基础设施团队，以及需要跨多个团队或区域实现可重复云运营的安全敏感型工程组织。 付款方通常是企业平台、工程或中央 IT 预算，直接用户则是开发者、DevOps
              工程师或内部平台团队。具名引用显示， 产品最能打动已经具备显著软件复杂度的组织：Atlassian、Wiz、Starburst、Snowflake、BMW、Mercedes-Benz、Modivcare、
              Sourcegraph 和 SANS 都不是小型绿地买方。它们要么是数字原生软件公司，要么是内部平台需求很重的大型企业。这很重要， 因为 Pulumi 替换脆弱的 shell 脚本或重 YAML
              工作流，用可复用的内部自动化和策略控制来承接时，最容易证明价值。 这也意味着，即便公开留存经济仍稀疏，客户质量在战略上仍然强。
