    {
      "id": "public-gaps-and-diligence-priorities",
      "title": "Public financial gaps and the diligence questions that remain unanswered",
      "body": "For a late-stage private infrastructure company, Pulumi\u2019s disclosure pattern creates a very specific diligence burden. The company is unusually transparent about how its product is packaged and how customers might operationalize it, but it is not transparent about current ARR, gross margin, net retention, churn, or cash burn. It is also unclear how much of today\u2019s customer count is monetized through Pulumi Cloud versus open-source usage or indirect enterprise adoption. The public funding record also bifurcates between clearly official 2017-2023 financing and tracker-driven 2026 assertions about later rounds. These gaps do not make the business unattractive; they simply prevent a clean conclusion about unit economics and capital efficiency from public evidence alone. Any investor moving beyond a tracking posture should request revenue bridges by product module, usage-overage contribution, services mix, gross margin, burn, renewal cohorts, and conversion from open-source/community use into paid accounts. Those questions matter far more than a single unaudited ARR rumor because they determine whether Pulumi scales like a durable software control plane or like a more services-assisted enterprise platform.",
