    {
      "id": "revenue-quality-and-scale-signals",
      "title": "Revenue quality, customer scale, and the public signals that matter most",
      "body": "Pulumi does not publicly disclose revenue or ARR, so any financial read must start with indirect evidence. Official sources do disclose customer and community milestones: 2,000 customers and 100 employees in the 2023 Series C post, over 3,700 customers in the September 2025 Neo launch release, and 4,000-plus companies in production on the current infrastructure-as-code page. Those are meaningful commercial signals because they suggest a large top-of-funnel and a product with real enterprise penetration, not a niche open-source project. Pricing sources also imply that enterprise contracts can reach well into the tens or hundreds of thousands of dollars once governance, self-hosting, support, and scale requirements appear. Case studies reinforce that Pulumi is often deployed in production-critical environments rather than only in experiments. Still, revenue quality remains opaque. There is no public split between free/open-source users and paying cloud customers, no public net retention, and no disclosure of services intensity. That means later valuation analysis should emphasize scenario ranges and quality of monetization architecture rather than pretending to know current ARR precisely.",
