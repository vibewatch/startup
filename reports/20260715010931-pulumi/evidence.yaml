evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-funding-round
    missingEvidence: >-
      Authoritative confirmation of any post-2023 financing round, including date, amount, lead investors, and
      post-money valuation.
    whyItMatters: Current stage and valuation materially affect the company overview, financial posture, and valuation chapter.
    diligencePath: >-
      Obtain board materials, financing docs, or a top-tier news or investor confirmation that explicitly names the
      round terms.
    relatedQuestionRefs:
      - QO014
  - type: private-evidence-only
    severity: material
    topic: revenue-and-arr
    missingEvidence: Current revenue, ARR, burn, and gross margin figures as of 2026.
    whyItMatters: >-
      The report can assess product breadth and customer proof without these numbers, but not capital efficiency or
      valuation precision.
    diligencePath: Request management KPI packs or investor updates with current recurring revenue and cost structure details.
    relatedQuestionRefs:
      - QO024
  - type: missing-source
    severity: minor
    topic: governance-detail
    missingEvidence: Detailed board committee, independent-director, and ownership information.
    whyItMatters: Late-stage investors need better visibility into governance quality and control rights.
    diligencePath: Request board roster, committee assignments, and cap-table summary under NDA.
    relatedQuestionRefs:
      - QO025
  - type: conflicting-data
    severity: material
    topic: headcount-precision
    missingEvidence: One authoritative 2026 employee-count disclosure rather than several tracker estimates.
    whyItMatters: Headcount is often used as a proxy for burn and sales capacity, so dispersion weakens financial inference.
    diligencePath: Use payroll or HRIS export, or request a dated management headcount disclosure.
    relatedQuestionRefs:
      - QO016
  - type: conflicting-data
    severity: minor
    topic: customer-scale-language
    missingEvidence: A consistent official definition for customers versus companies in production versus end users.
    whyItMatters: Different denominators can overstate or understate commercial traction if reused without context.
    diligencePath: Ask management to define paid customers, active accounts, and community end users separately.
    relatedQuestionRefs:
      - QO015
  - type: missing-source
    severity: minor
    topic: TO002 leadership coverage gap
    missingEvidence: A fuller public org chart and succession disclosure for leaders below the named executive bench.
    whyItMatters: >-
      The leadership table is intentionally partial and later-stage investors typically want clearer management depth
      evidence.
    diligencePath: Request an internal org chart and succession plan for product, engineering, sales, and customer functions.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: minor
    topic: TO004 chronology completeness gap
    missingEvidence: >-
      Authoritative evidence for any post-2023 financing event and for private secondaries or debt facilities not shown
      on the public timeline.
    whyItMatters: >-
      The milestone table is the canonical chronology and should not silently omit a material financing or governance
      event.
    diligencePath: >-
      Verify the post-2023 timeline with board updates, investor letters, or a top-tier financing announcement before
      extending the chronology.
    relatedQuestionRefs:
      - QO014
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: TO003 investor map completeness gap
    missingEvidence: A complete cap table with ownership, board rights, preferences, secondaries, and any debt facilities.
    whyItMatters: >-
      The investor map is intentionally partial and cannot answer control, dilution, or liquidation-stack questions from
      public sources alone.
    diligencePath: Request the latest financing summary, cap-table extract, and board observer/committee rights under NDA.
    relatedQuestionRefs:
      - QO013
      - QO025
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: pulumi-specific-sam
    missingEvidence: >-
      A defensible breakdown of Pulumi’s reachable budget by buyer segment, cloud mix, and product module rather than
      generic IaC TAM data.
    whyItMatters: TAM alone does not tell an investor how much of the market matches Pulumi’s actual product and sales motion.
    diligencePath: >-
      Build a bottoms-up target-account model using customer counts, estimated seats, resource volumes, and attach rates
      for governance and secrets modules.
    relatedQuestionRefs:
      - QM019
      - QM025
  - type: conflicting-data
    severity: minor
    topic: market-estimate-conflict
    missingEvidence: A reconciled 2026 market definition showing why one source says ~$1.2B and another says ~$2.03B.
    whyItMatters: Unreconciled market-size numbers can mislead valuation framing if treated as directly comparable.
    diligencePath: Obtain methodology notes for each report or normalize to software-only versus software-plus-services scopes.
    relatedQuestionRefs:
      - QM006
  - type: private-evidence-only
    severity: minor
    topic: budget-owner-split
    missingEvidence: Actual Pulumi customer budget-owner data by function, industry, and deal size.
