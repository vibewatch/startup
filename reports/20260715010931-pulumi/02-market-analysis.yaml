    {
      "id": "market-size-growth-and-penetration",
      "title": "Market size, growth rate, and adoption penetration",
      "body": "The public market-data picture is directionally strong but numerically noisy. The Business Research Company puts the infrastructure-as-code market at roughly $2.03 billion in 2026 and $5.25 billion by 2030, while Global Market Insights frames 2026 nearer $1.2 billion and 2035 at $8.6 billion. Those disagreements are large, but not fatal, because both sources still imply sustained mid-20s CAGR and both tie the category to cloud adoption, DevOps maturity, compliance automation, and multi-cloud complexity. On the practitioner side, Firefly\u2019s 2025 State of IaC data says 89% of respondents have adopted IaC, but only 6% have complete coverage, 68% already operate across multiple clouds, and 65% say cloud complexity has increased over the last two years. That combination is important for Pulumi: the market is not early in awareness, but it is still early in full operationalization. Growth therefore comes less from convincing teams that code-based infrastructure is useful and more from helping them close coverage gaps, rationalize fragmented tooling, and extend IaC into platform, governance, and AI-assisted operations.",
      "claimRefs": [
        "CM010",
