  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "Pulumi operates inside two overlapping growth pools: the infrastructure-as-code tooling market itself and the broader platform-engineering stack that standardizes self-service cloud delivery. Public market reports disagree on the absolute size of the pure IaC market in 2026, but they consistently show strong double-digit growth, while cloud-native and platform-engineering sources show that buyers increasingly want reusable internal platforms, policy automation, and multi-cloud control rather than one-off scripts. That market structure favors Pulumi\u2019s language-first, platform-team positioning, but it also means the company competes inside a crowded toolchain rather than a greenfield budget line."
  },
  "sections": [
    {
      "id": "market-boundary-and-substitutes",
      "title": "Market boundary, adjacencies, and status-quo substitutes",
      "body": "Pulumi does not sell into a single cleanly bounded market. The narrowest lens is infrastructure-as-code tooling: software and services that provision, version, and govern infrastructure through code rather than manual processes. Multiple research publishers use that framing and explicitly segment the market into tools versus services, declarative versus imperative approaches, and cloud versus on-prem deployment models. But Pulumi\u2019s real selling surface is broader than pure provisioning. Its commercial platform now bundles state, secrets, deployments, governance, and AI, which pushes it toward platform engineering and internal developer platform budgets as much as stand-alone IaC budgets. That broader lens matters because buyers often compare Pulumi not just with Terraform or OpenTofu, but with a mix of AWS CDK, Crossplane, Ansible, in-house scripting, and ticket-driven platform operations. In other words, the status quo substitute is often fragmented workflow rather than a direct incumbent product. This mixed boundary helps explain why top-down market sizing varies so widely across third-party reports, and why product differentiation is increasingly about workflow consolidation, developer experience, and governance rather than raw resource provisioning alone.",
      "claimRefs": [
