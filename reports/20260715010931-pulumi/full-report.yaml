              platform-team positioning, and Series C in 2023. The Series B and Series C blog posts add useful context:
              Series B was $37.5 million led by NEA, while Series C was $41 million from Madrona, NEA, Tola, and Strike.
              Scale markers become more mixed after that. In October 2023 the company disclosed more than 2,000
              customers, over 150,000 end users, and 100 employees; the September 2025 Neo press release raised the
              customer figure to over 3,700; current product pages now say 4,000-plus companies in production; and
              external headcount trackers in 2026 cluster around roughly 122 to 129 employees. That combination supports
              a narrative of continued growth, but it also shows why later chapters must separate official company
              claims from third-party estimates and from still-unconfirmed late-round funding assertions.
