      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research the round, not just the product
            body: >-
              Pulumi looks credible as a company. The missing question is whether the current late-stage price is
              supported by retention, attach, and financing terms.
            calloutType: recommendation
            claimRefs:
