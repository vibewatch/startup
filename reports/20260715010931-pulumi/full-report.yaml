      - number: '2.3'
        title: Buyers, users, payers, and the internal adoption path
        blocks:
          - type: paragraph
            body: >-
              Pulumi’s most relevant buyers are not generic developers; they are platform engineering, cloud
              engineering, DevOps, and security-minded infrastructure teams trying to create reusable internal golden
              paths. Humanitec’s platform-engineering framing describes an internal developer platform as an abstraction
              layer that reduces cognitive load by turning infrastructure access into a supported product. The CNCF and
              SlashData data adds contemporary proof: 28% of organizations report dedicated platform engineering teams,
              41% use a multi-team collaboration model for internal platforms, and 35% are already using hybrid platform
              approaches for AI workflows. The budget owner is usually a platform, cloud, or infrastructure function,
              but the user may be a much broader engineering population consuming templates, deployment workflows, and
              policy-guarded self-service. That distinction benefits Pulumi because its real-language approach speaks to
              application developers while its cloud control plane speaks to central platform teams. The adoption path
              typically starts with one team replacing manual scripts or a declarative toolchain in a narrow workflow,
              then expands into self-service, governance, secrets, and organization-wide standards once the platform
              team proves reuse and security benefits.
