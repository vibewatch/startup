      - number: '3.2'
        title: Feature breadth, workflow fit, and where Pulumi is genuinely different
        blocks:
          - type: paragraph
            body: >-
              Pulumi’s clearest technical differentiation is that its core authoring model uses mainstream languages and
              software engineering constructs directly, rather than asking teams to learn a purpose-built DSL. That
              difference compounds into testing, IDE support, code reuse, internal packages, and embedding
              infrastructure workflows through the Automation API. Comparison sources consistently acknowledge this
              advantage. They also repeatedly note that Terraform retains stronger provider breadth, broader module
              availability, and simpler familiarity for ops-centric teams already comfortable with HCL. OpenTofu
              preserves much of that same experience while restoring an open-source governance story. AWS CDK narrows
              the language gap for AWS-centric organizations but does not solve the multi-cloud standardization problem
              as well. Crossplane and Ansible each serve adjacent use cases better than Pulumi in specific contexts:
              Crossplane for Kubernetes-native control planes and Ansible for mixed configuration-and-orchestration
              estates. The right lens is not “which tool is universally best,” but “which tool best matches the team’s
              operating model.” Pulumi is most advantaged where application engineers and platform engineers need one
              programmable workflow across clouds and governance layers.
