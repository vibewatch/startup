      - number: '7.4'
        title: 'The right mitigations are measurable: trust, attach, concentration, and velocity'
        blocks:
          - type: paragraph
            body: >-
              Pulumi’s risks are monitorable, which is why the name remains investable despite real uncertainty. The
              most important indicators are attach depth beyond core IaC, customer concentration, retention of flagship
              accounts, control-plane reliability, security posture, and whether Neo or governance features create
              measurable expansion rather than marketing noise. Competitive pressure should be monitored through
              win/loss trends against Terraform, OpenTofu, and hyperscaler-native tools, not just through GitHub stars
              or launch cadence. Legal and regulatory risk should be monitored by customer diligence friction, security
              questionnaire burden, and whether AI features remain clearly bounded by review and approval controls. The
              practical kill criteria are therefore not abstract. They are visible events: a serious secrets or
              control-plane incident, evidence that higher-value modules are not monetizing, major churn among
              platform-team references, or a financing round that implies weakening confidence without corresponding
              operating improvement. These triggers are practical and board-level. Daily.
            claimRefs:
              - CR031
