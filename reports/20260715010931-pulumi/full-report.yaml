      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: >-
              Pulumi’s largest risk is not regulation; it is failing to become a control plane of record before
              competitors commoditize the category
            body: >-
              If customers keep using Pulumi mainly as a nicer IaC layer, its strategic leverage weakens materially
              versus Terraform, OpenTofu, and hyperscaler-native tools.
            calloutType: risk
