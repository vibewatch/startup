chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product surface, and current stage
        blocks:
          - type: paragraph
            body: >-
              Pulumi’s public identity is unusually consistent for a devtools company: the company says its purpose is
              to democratize the cloud for every engineer, and its product pages now frame that mission as a unified
              platform for infrastructure teams rather than a single-purpose IaC utility. The current website presents
              Pulumi as a stack that spans open source infrastructure as code, centralized secrets and configuration,
              deployment orchestration, governance, and an AI agent layer called Neo. The differentiator remains the
              same idea that powered its early adoption: infrastructure can be authored in mainstream languages such as
              TypeScript, Python, Go, C#, Java, and even YAML rather than a proprietary DSL alone. Official product
              pages also show that Pulumi still keeps the open-source engine available under Apache 2.0 while monetizing
              Pulumi Cloud through tiered subscriptions and usage meters. In practical diligence terms, that means
              investors are underwriting not just a point tool but a platform strategy with freemium distribution,
              open-source developer acquisition, and an expanding commercial control plane. What remains less clean is
              stage labeling. Public official materials still give the most specific financing detail around the 2023
              Series C, while third-party trackers in 2026 suggest a later round and larger capital base. The chapter
              therefore treats Pulumi as a late-stage private company with a strong public product narrative and a
              partially opaque current financing record.
