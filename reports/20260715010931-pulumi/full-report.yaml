      - number: '1.4'
        title: Adverse read-throughs, contradictions, and open evidence gaps
        blocks:
          - type: paragraph
            body: >-
              The main caution in Pulumi’s overview chapter is not product weakness; it is evidence quality around the
              newest company-level metrics. Official web surfaces are excellent for product breadth, customer
              storytelling, leadership names, and the 2017-2023 funding arc, but they do not publicly confirm the
              pre-researched October 2025 Series D described in the task background. Meanwhile, trackers disagree
              materially: Tracxn still shows roughly $99 million raised through Series C, while StartupHub points to a
              later Series D and approximately $229 million total funding, and its valuation estimate is still below the
              $1.5 billion post-money figure in the supplied background. Customer count and headcount signals also
              require care: official claims moved from 2,000 customers in 2023 to 3,700 in a 2025 press release, while
              product pages now say 4,000-plus companies in production, and external workforce trackers cluster in the
              low 120s rather than one exact value. Finally, comparison content from Terraform-vs-Pulumi analyses
              reinforces that Pulumi’s programmability is a differentiator but can also make the product feel more
              complex than declarative alternatives for mixed-skill teams. The right diligence stance is therefore to
              treat Pulumi as a credible late-stage infrastructure platform with strong category fit, but to preserve
              explicit evidence gaps around current financing terms, revenue quality, and the precise scale of the
              installed base.
            claimRefs:
