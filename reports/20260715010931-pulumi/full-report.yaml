        title: Workflow architecture, Automation API, and developer-experience fit
        blocks:
          - type: paragraph
            body: >-
              Pulumi’s technical philosophy is consistent across its modules: infrastructure should behave more like
              software, and platform workflows should be programmable rather than ticket-driven. The core IaC page
              emphasizes real language constructs, unit testing, IDE support, and Git-native review. Deployments extends
              that philosophy into server-side execution with review stacks, TTL stacks, scheduled deployments, drift
              detection, self-hosted runners, and GitHub Enterprise support. Neo then pushes the idea further by making
              infrastructure tasks conversational and agentic while still inheriting Pulumi’s state, policy, and
              approval model. Customer proof reinforces that these workflow primitives are not theoretical. Atlassian
              used Pulumi to simplify multi-region developer environments, Starburst used Automation API and later
              returned to Pulumi Cloud to regain deployments and state functionality, and Wiz embedded Automation API
              into a massive multi-cloud provisioning system. Technically, Pulumi’s strongest fit is therefore with
              organizations that want to build reusable internal workflows, not just manage static configuration files.
