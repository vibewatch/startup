              - CV020
      - number: '8.3'
        title: The bull case is strong, but so is the anti-thesis if monetization depth lags narrative breadth
        blocks:
          - type: paragraph
            body: >-
              The bull case is straightforward: Pulumi becomes the platform of record for infrastructure workflows, not
              just a better IaC interface. In that outcome, customers adopt Deployments, governance, ESC, and Neo on top
              of the core engine, expansion improves, and the company earns a premium multiple as a strategic
              infrastructure control plane. The base case is more balanced. Pulumi remains a high-quality platform
              company with real adoption but still limited public economic transparency, causing investors to demand
              disciplined entry and stronger diligence before paying a premium. The bear case is that the company stays
              admired by engineers yet monetizes too shallowly relative to the breadth of its product ambitions. If
              module attach remains weak, competition stays intense, or a high private mark has already priced in future
              success, downside can be meaningful without the business being “bad.” That is why valuation work here is
              less about declaring the company attractive or unattractive in absolute terms and more about requiring
              proof that economics justify strategic enthusiasm.
            claimRefs:
              - CV021
              - CV022
              - CV023
