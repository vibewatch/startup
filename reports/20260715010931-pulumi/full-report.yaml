  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: The right recommendation is research-more because quality is visible, price support is not
        blocks:
          - type: paragraph
            body: >-
              Pulumi has enough evidence of product quality and customer relevance to stay on an investor’s active list,
              but not enough public economic disclosure to support a high-conviction buy at an assumed late-stage price.
              The strongest parts of the story are clear: the company has a credible enterprise roster, meaningful
              open-source distribution, expanding workflow modules, and a category aligned with platform-engineering and
              cloud-governance trends. The problem is valuation discipline. Public sources do not cleanly establish
              current ARR, net retention, gross margin, or even fully reconcile the current financing mark. When a
              company is selling an infrastructure platform with multiple attach layers, those metrics matter more than
              narrative. That is why the call is research-more rather than avoid. The business may be good, but the
              evidence supporting the price is incomplete. If private diligence proves strong module attach, durable
              retention, and a financing mark closer to fair than stretched, the recommendation could move quickly.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
