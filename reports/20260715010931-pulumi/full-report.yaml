        blocks:
          - type: paragraph
            body: >-
              Pulumi’s milestone record is strong on historical product and financing cadence. The official company
              timeline records founding and a $5 million seed in March 2017, first customer in November 2017, open
              source launch in June 2018, Pulumi Service launch and Series A in October 2018, Pulumi 1.0 in 2019, Pulumi
