      - number: '1.2'
        title: Founders, leadership bench, and governance visibility
        blocks:
          - type: paragraph
            body: >-
              The most durable part of Pulumi’s company story is its founding bench. Joe Duffy is publicly positioned as
              co-founder and CEO, while Eric Rudder remains co-founder and Executive Chairman, giving the company a
              clear technical and enterprise-software lineage. The leadership page also names current functional heads
              across marketing, finance, product, customer engineering, engineering, people, and revenue operations,
              which is helpful because many private companies at this stage reveal less about operating depth. The board
              list signals continued influence from the early investor base: Madrona, Tola Capital, and NEA all remain
              visible, alongside Eric Rudder and Joe Duffy. That is enough to establish continuity but not enough to
              answer harder governance questions such as ownership concentration, independent-director ratios, committee
              structure, or succession planning below the founding core. Joe Duffy is still the public face across
              product launches, funding posts, and strategy messaging, so key-person risk is real even though the
              management bench has broadened. For diligence, the practical read-through is positive on founder-market
              fit and category credibility, but incomplete on governance transparency compared with what a crossover or
              IPO-stage investor would want.
