  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct competitors, substitutes, and why the field is layered
        blocks:
          - type: paragraph
            body: >-
              Pulumi’s competitive field is layered because teams do not buy “infrastructure as code” the same way they
              buy a single-purpose application. Terraform is the default incumbent for many multi-cloud organizations
              and still defines the market’s center of gravity through HCL, its module ecosystem, and years of
              enterprise adoption. OpenTofu is not a wholly new category so much as an attempt to preserve that
              Terraform operating model under open governance after HashiCorp’s licensing shift. AWS CDK is a strong
              substitute for teams that mainly want infrastructure in general-purpose languages but live primarily
              inside AWS. Crossplane competes more from the control-plane angle, especially for Kubernetes-native
              platform teams that want infrastructure exposed as Kubernetes APIs. Ansible is broader and older than the
              core IaC vendors, but it remains a real substitute whenever a team’s automation problem mixes provisioning
              with configuration and orchestration. Pulumi therefore wins or loses less on headline category size than
              on how each account values language flexibility, platform-team workflow integration, governance breadth,
              and migration cost.
            claimRefs:
              - CP001
