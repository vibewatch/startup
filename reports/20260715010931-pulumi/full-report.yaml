  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary, adjacencies, and status-quo substitutes
        blocks:
          - type: paragraph
            body: >-
              Pulumi does not sell into a single cleanly bounded market. The narrowest lens is infrastructure-as-code
              tooling: software and services that provision, version, and govern infrastructure through code rather than
              manual processes. Multiple research publishers use that framing and explicitly segment the market into
              tools versus services, declarative versus imperative approaches, and cloud versus on-prem deployment
              models. But Pulumi’s real selling surface is broader than pure provisioning. Its commercial platform now
              bundles state, secrets, deployments, governance, and AI, which pushes it toward platform engineering and
              internal developer platform budgets as much as stand-alone IaC budgets. That broader lens matters because
              buyers often compare Pulumi not just with Terraform or OpenTofu, but with a mix of AWS CDK, Crossplane,
              Ansible, in-house scripting, and ticket-driven platform operations. In other words, the status quo
              substitute is often fragmented workflow rather than a direct incumbent product. This mixed boundary helps
              explain why top-down market sizing varies so widely across third-party reports, and why product
              differentiation is increasingly about workflow consolidation, developer experience, and governance rather
              than raw resource provisioning alone.
            claimRefs:
