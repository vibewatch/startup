              diligence burden. The company is unusually transparent about how its product is packaged and how customers
              might operationalize it, but it is not transparent about current ARR, gross margin, net retention, churn,
              or cash burn. It is also unclear how much of today’s customer count is monetized through Pulumi Cloud
              versus open-source usage or indirect enterprise adoption. The public funding record also bifurcates
              between clearly official 2017-2023 financing and tracker-driven 2026 assertions about later rounds. These
