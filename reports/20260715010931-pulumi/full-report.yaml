      - number: '7.3'
        title: Dependency, financial, and people risks determine downside severity
        blocks:
          - type: paragraph
            body: >-
              Pulumi’s downside is amplified by dependency concentration. The product depends on cloud-provider APIs,
              the health of provider ecosystems, Git-based workflows, model integrations for Neo, and customer
              willingness to make Pulumi Cloud a central control plane. That is not unusual for the category, but it
              means failures outside Pulumi’s direct control can still damage product perception or slow adoption.
              Financially, the risk is less about near-term insolvency and more about efficiency: if module attach stays
              shallow or enterprise deal cycles lengthen, a company with significant R&D ambition may need more capital
              before proving strong unit economics. People risk also matters. Pulumi’s narrative is closely tied to Joe
              Duffy’s product vision and to a small set of technically credible leaders who can bridge infrastructure,
              developer workflows, and AI. Leadership continuity is a positive today, but it also creates key-person
              sensitivity until a larger go-to-market and product bench is proven in scale operations.
            claimRefs:
              - CR021
              - CR022
              - CR023
              - CR024
              - CR025
              - CR026
              - CR027
              - CR028
              - CR029
              - CR030
