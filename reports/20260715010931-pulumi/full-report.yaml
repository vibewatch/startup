            body: >-
              Funding visibility is mixed. The official record is firm through Series C: seed in 2017, $15 million
              Series A in 2018, $37.5 million Series B in 2020, and $41 million Series C in 2023. Third-party trackers
              diverge on what happened later, with Tracxn still anchored around roughly $99 million total raised while
              StartupHub points to a later Series D and roughly $229 million total funding. Without current cash balance
              disclosure, the best investors can do publicly is build heuristics. Workforce trackers place Pulumi
              roughly in the 122-to-129 employee range in 2026. For a U.S.-centric cloud software company with
              engineering, GTM, and support layers, that implies a meaningful annual operating cost base even before
              infrastructure, partner, and professional-services spending. The good news is that Pulumi’s product model
              can support software-like gross margins if usage is mostly control-plane and state-management economics
              rather than people-heavy services. The caution is that governance-heavy enterprise sales motions,
              migration support, and high-touch customer engineering can also create services drag if expansion depends
              on heavy enablement. Public evidence is not enough to call the business capital efficient or inefficient
