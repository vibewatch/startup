            body: >-
              Pulumi does not publicly disclose revenue or ARR, so any financial read must start with indirect evidence.
              Official sources do disclose customer and community milestones: 2,000 customers and 100 employees in the
              2023 Series C post, over 3,700 customers in the September 2025 Neo launch release, and 4,000-plus
              companies in production on the current infrastructure-as-code page. Those are meaningful commercial
              signals because they suggest a large top-of-funnel and a product with real enterprise penetration, not a
              niche open-source project. Pricing sources also imply that enterprise contracts can reach well into the
