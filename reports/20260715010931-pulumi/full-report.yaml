  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product modules, control-plane layers, and what Pulumi now sells
        blocks:
          - type: paragraph
            body: >-
              Pulumi’s product surface is materially broader than “infrastructure as code in TypeScript.” The core
              engine still centers on provisioning infrastructure with mainstream languages, previewing changes, and
              maintaining state. Around that engine, Pulumi has built a managed control plane that adds collaboration,
              access controls, auditability, secrets and configuration management through ESC, deployment orchestration
              through Deployments, search and policy workflows through Insights & Governance, and now an AI-native
              operational layer through Neo. That matters strategically because it changes the product from a syntax
              choice into a platform choice. A customer can begin with OSS IaC or basic cloud state management, then
              expand into governance, policy remediation, drift operations, and AI-assisted workflows without changing
              tools. The deepest product question is therefore not whether Pulumi can provision infrastructure — it
              clearly can — but whether enough customers adopt multiple layers of the stack to make the platform harder
              to replace than a simple open-source engine.
