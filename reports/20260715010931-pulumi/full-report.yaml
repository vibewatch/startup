      - number: '8.4'
        title: 'The remaining work is specific: verify the mark, verify attach, verify durability'
        blocks:
          - type: paragraph
            body: >-
              Pulumi is close to investable with the right evidence, which means the remaining diligence is concrete
              rather than abstract. First, confirm the actual financing context: round size, post-money valuation,
              investor terms, and whether the often-cited 2025 Series D mark is real, current, and clean. Second, verify
              customer economics: top-10 concentration, module attach, NRR, GRR, contract duration, and the percentage
              of customers paying for higher-value control-plane layers. Third, verify operating quality: uptime,
              security process, and whether Neo is becoming a monetizable, trusted workflow layer or simply a useful
              demo. If those checks land well, Pulumi can justify a serious late-stage look despite competitive risk. If
              they do not, the right posture remains track or avoid paying up. The thesis-break triggers are therefore
              simple: valuation support evaporates if the mark is stretched relative to real ARR, if attach stays
              shallow, or if trust incidents damage platform centrality.
            claimRefs:
              - CV031
              - CV032
