  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: 'The top risk stack is strategic: competition, attach depth, and trust'
        blocks:
          - type: paragraph
            body: >-
              Pulumi’s most important risks are strategic and operational rather than existentially regulatory. The
              company competes against Terraform’s installed base, OpenTofu’s open-source momentum, AWS CDK inside
              native AWS shops, and a broad market of platform-engineering or workflow tooling. That means Pulumi cannot
              win only by being a more pleasant syntax. It needs customers to adopt the surrounding control-plane layers
              — Deployments, ESC, governance, and Neo — strongly enough that the product becomes harder to remove than a
              stand-alone IaC engine. The second layer of risk is trust. Pulumi increasingly manages state, secrets,
              policy, remediation, and AI-assisted actions inside enterprise workflows. A meaningful outage,
              secret-handling problem, or AI remediation error would therefore hit the exact areas customers pay it to
              centralize. The third layer is go-to-market fit. Pulumi’s best buyers are sophisticated platform teams,
              which usually means high-value accounts but also longer sales cycles, high implementation expectations,
              and a finite set of referenceable champions. materially.
