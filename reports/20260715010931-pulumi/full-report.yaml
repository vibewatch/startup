      - number: '3.3'
        title: Migration economics, proof points, and what real-world evidence says
        blocks:
          - type: paragraph
            body: >-
              The strongest pro-Pulumi proof does not come from abstract product claims; it comes from migration and
              customer stories that show real workflow changes. Atlassian’s Bitbucket team moved off a DSL-based tool
              and cut environment-maintenance time by more than 50 percent. Starburst says Pulumi reduced a multi-region
              blue-green deployment cycle from two weeks to three hours after replacing Terraform-centric glue
              workflows. Comparison and migration write-ups from 2026 also reinforce a more nuanced reality: Pulumi can
              genuinely reduce code volume, improve testability, and share logic with application code, but state
              remains state, provider lag can still matter in long-tail ecosystems, and hybrid Terraform-plus-Pulumi
              estates only work when ownership boundaries are explicit. That evidence implies a split competitive
              reality. Pulumi is compelling for greenfield or high-dynamic-composition workloads, especially when teams
              already live in TypeScript, Python, or Go. But for stable foundation layers, niche provider ecosystems, or
              deeply Terraform-native teams, the migration ROI can be too small to justify wholesale replacement. That
              makes Pulumi’s competitive motion more surgical and proof-led than category rhetoric alone might suggest.
            claimRefs:
              - CP020
              - CP021
              - CP022
              - CP023
              - CP024
              - CP025
