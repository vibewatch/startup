  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue streams, monetization design, and what Pulumi actually charges for
        blocks:
          - type: paragraph
            body: >-
              Pulumi’s public monetization design is more sophisticated than a flat per-seat devtools subscription. The
              company still uses open-source distribution and a free individual tier to seed adoption, but its
              commercial cloud product monetizes several separate control-plane behaviors: base editions, managed
              resources, deployment minutes, ESC secrets, and API calls. The pricing page makes clear that the Team tier
              starts at a relatively low fixed entry point while Enterprise and Business Critical support wider
              governance, self-hosting, and compliance use cases. Independent pricing summaries broadly agree that small
              teams can begin with modest spend, but that real enterprise contracts become meaningful once organizations
              need SSO, audit, self-hosting, drift detection, premium support, or higher resource counts. This design is
              strategically important because it lets Pulumi expand along both adoption and usage axes. A customer can
              begin with open-source IaC or a small Team subscription, then later attach higher-value workflows such as
              deployments, governance, secrets, and AI-assisted operations. The financial upside is obvious; the
              diligence challenge is that public materials still do not disclose the exact conversion rate from
              open-source or free use into paid cloud accounts or higher-value enterprise modules.
