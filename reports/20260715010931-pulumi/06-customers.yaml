    {
      "id": "durability-expansion-and-satisfaction",
      "title": "Expansion appears plausible; retention and satisfaction remain under-disclosed",
      "body": "Pulumi\u2019s public materials support adoption momentum and some expansion logic, but they do not yet support a hard retention underwriting case. The company has disclosed rising top-of-funnel customer counts over time \u2014 about 2,000+ in the 2023 Series C announcement, 3,700+ in the 2025 Neo launch release, and 4,000+ companies in production on current product pages. That trajectory implies continued adoption, although it does not prove paid account quality or net retention. Case studies suggest land-and-expand behavior because multiple customers use Pulumi across teams, regions, or workflow types, but public sources do not disclose GRR, NRR, logo churn, contract term, or expansion ARR. Third-party public review density also appears light relative to Pulumi\u2019s claimed scale, which means outside customer validation is still thinner than ideal. The right conclusion is that adoption proof is solid, while durability metrics remain a material diligence ask. For underwriting purposes, that means public customer breadth is encouraging, but private cohort data remains decisive.",
