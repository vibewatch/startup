  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Public evidence shows Pulumi has moved beyond experimentation into a credible enterprise customer base spanning software, financial services, automotive, healthcare, security, and education. The strongest proof comes from named production references such as Atlassian, BMW, Mercedes-Benz, Snowflake, Wiz, Sourcegraph, Starburst, Modivcare, and SANS Institute. However, the quality of proof is uneven. Pulumi discloses growing total customer counts and multiple case studies with concrete workflow outcomes, but it does not publish NRR, GRR, churn, contract length, or concentration. The chapter therefore supports real adoption and expansion potential while keeping durability and revenue concentration as unresolved diligence items."
  },
  "sections": [
    {
      "id": "who-buys-and-why",
      "title": "Who buys Pulumi, who uses it, and why the buyer map matters",
      "body": "Pulumi\u2019s public customer evidence clusters around platform engineering teams, cloud infrastructure groups, and security-conscious engineering organizations that need repeatable cloud operations across multiple teams or regions. The payer is usually an enterprise platform, engineering, or central IT budget, while the direct users are developers, DevOps engineers, or internal platform teams. Named references show the product resonates most with organizations that already have meaningful software complexity: Atlassian, Wiz, Starburst, Snowflake, BMW, Mercedes-Benz, Modivcare, Sourcegraph, and SANS are not small greenfield buyers. They are either digital-native software companies or large enterprises with substantial internal platform needs. This matters because Pulumi\u2019s product is easiest to justify when it replaces fragile shell-script or YAML-heavy workflows with reusable internal automation and policy controls. It also means customer quality is strategically strong even if public retention economics remain sparse.",
