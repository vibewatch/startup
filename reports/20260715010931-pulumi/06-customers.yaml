    {
      "id": "customer-risks-and-what-to-test-next",
      "title": "Customer quality is attractive, but concentration and procurement risk are unresolved",
      "body": "From an investor perspective, Pulumi\u2019s customer chapter is strongest on quality and weakest on concentration. The logo roster implies sophisticated buyers and non-trivial production use, which is a positive sign for eventual expansion economics. But the same evidence base also raises a normal enterprise-software concern: public proof is dominated by a finite set of referenceable flagship accounts, and those flagship accounts may account for a disproportionate share of strategic weight or ARR. In addition, Pulumi\u2019s broader platform message now spans IaC, secrets, governance, and AI, which can strengthen expansion but also lengthen procurement and implementation cycles. Without retention, cohort, and top-customer concentration data, an investor should assume both upside and risk remain live. The next diligence step should focus on cohort retention, top-10 ARR concentration, attach rates for higher-value modules, and reasons for stalled or failed enterprise evaluations. That makes private diligence on account concentration, procurement friction, and renewal behavior central before treating the logo set as equivalent to durable recurring revenue strength. This remains unresolved.",
