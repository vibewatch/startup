    {
      "id": "what-the-public-proof-actually-shows",
      "title": "Named customer proof is real, but the proof quality varies by account",
      "body": "Pulumi has a useful but incomplete public proof set. Several references clearly describe production deployments and workflow benefits, while others are more directional. Atlassian, Wiz, Starburst, Snowflake, BMW, Mercedes-Benz, Modivcare, Sourcegraph, and SANS all provide named customer evidence with at least some combination of deployment detail, scale, or measurable outcome. The best case studies do more than list a logo: they explain why a platform team adopted Pulumi, how it changed deployment or developer workflows, and what efficiency or consistency benefit resulted. Wiz is particularly important because it validates Automation API at very large scale. Starburst is important because it shows Pulumi was valuable enough to win the customer back after a period away from Pulumi Cloud. Even so, reference quality is uneven. Not every story provides quantified ROI, contract scope, or retention evidence, and the public set probably overrepresents successful flagship accounts.",
