    {
      "id": "legal-regulatory-and-security",
      "title": "Legal, regulatory, and security obligations are manageable but rising",
      "body": "Pulumi is not a regulated balance-sheet business, but that does not make the legal and regulatory layer trivial. The company now sells software that can store infrastructure state, coordinate secrets and configuration, trigger remediation, and expose AI-assisted operational actions inside enterprise environments. That creates contract, privacy, and compliance obligations even without a sector-specific operating license. The company\u2019s privacy policy, professional services agreement, security page, and status page show that Pulumi is already presenting itself as a mature enterprise vendor, which is appropriate. The risk is that product breadth increases the blast radius of failure. If Pulumi is selling secrets orchestration, governance, and AI-driven remediation, customers will expect strong controls on data handling, access boundaries, and change safety. Broader policy environments such as GDPR and the emerging EU AI framework are not direct blockers today, but they raise the standard for how Pulumi documents and governs data and AI behavior in international enterprise accounts.",
