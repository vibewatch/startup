  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Pulumi\u2019s risk profile is dominated by execution and dependency risk rather than classic regulatory overhang. The highest risks are competitive compression from Terraform/OpenTofu and hyperscaler tooling, failure to turn product breadth into multi-module paid attach, control-plane/security incidents in a product that now handles state, secrets, and AI-driven actions, and go-to-market dependence on sophisticated platform-team buyers who can be slow to convert. Legal and regulatory risk is lower than in fintech or healthtech, but it is not zero: Pulumi now operates managed infrastructure, secrets, and AI-assisted workflows inside enterprise environments, which raises privacy, contract, and compliance expectations even without a sector-specific license. The investment case remains viable, but only if product centrality, enterprise trust, and customer expansion keep strengthening faster than category competition."
  },
  "sections": [
    {
      "id": "top-risk-stack",
      "title": "The top risk stack is strategic: competition, attach depth, and trust",
      "body": "Pulumi\u2019s most important risks are strategic and operational rather than existentially regulatory. The company competes against Terraform\u2019s installed base, OpenTofu\u2019s open-source momentum, AWS CDK inside native AWS shops, and a broad market of platform-engineering or workflow tooling. That means Pulumi cannot win only by being a more pleasant syntax. It needs customers to adopt the surrounding control-plane layers \u2014 Deployments, ESC, governance, and Neo \u2014 strongly enough that the product becomes harder to remove than a stand-alone IaC engine. The second layer of risk is trust. Pulumi increasingly manages state, secrets, policy, remediation, and AI-assisted actions inside enterprise workflows. A meaningful outage, secret-handling problem, or AI remediation error would therefore hit the exact areas customers pay it to centralize. The third layer is go-to-market fit. Pulumi\u2019s best buyers are sophisticated platform teams, which usually means high-value accounts but also longer sales cycles, high implementation expectations, and a finite set of referenceable champions. materially.",
