    {
      "id": "release-cadence-dependencies-and-readthrough",
      "title": "Release cadence, ecosystem dependencies, and the main product read-throughs",
      "body": "Pulumi is shipping at a cadence that suggests active platform expansion rather than maintenance mode. The 2025-2026 blog stream covers Neo launch, code reviews, integrations, read-only and plan modes, ESC onboarding and rotation, and self-hosted Insights. That pace is strategically useful because it keeps the company positioned around current platform-engineering problems such as AI governance, secrets sprawl, and operational remediation. It also reveals the product\u2019s dependency pattern. Pulumi\u2019s core value still depends on cloud-provider APIs, the Terraform-bridge ecosystem for some provider breadth, Git-based developer workflows, and customer willingness to centralize control in Pulumi Cloud. Those dependencies are normal for the category but important. They create the upside of rapid ecosystem support and the downside of relying on external provider parity and organizational process change. The right product read-through is that Pulumi has built a credible infrastructure platform with meaningful breadth; the remaining question is not whether it can ship features, but whether its customers operationalize enough of them to create durable workflow gravity.",
