  "chapter": {
    "number": 5,
    "title": "Product & Tech",
    "summary": "Pulumi\u2019s product has evolved from a real-language IaC engine into a layered cloud control plane: core provisioning and state, ESC secrets/config, Deployments workflow orchestration, Insights/Governance, and Neo for AI-assisted infrastructure operations. The architecture favors platform teams that want one programmable workflow spanning provisioning, policy, and remediation. The open-source core remains a major distribution asset, but the company\u2019s higher-value monetization now depends on whether enterprises adopt the surrounding control-plane modules deeply enough to create durable workflow lock-in."
  },
  "sections": [
    {
      "id": "module-stack-and-surface-area",
      "title": "Product modules, control-plane layers, and what Pulumi now sells",
      "body": "Pulumi\u2019s product surface is materially broader than \u201cinfrastructure as code in TypeScript.\u201d The core engine still centers on provisioning infrastructure with mainstream languages, previewing changes, and maintaining state. Around that engine, Pulumi has built a managed control plane that adds collaboration, access controls, auditability, secrets and configuration management through ESC, deployment orchestration through Deployments, search and policy workflows through Insights & Governance, and now an AI-native operational layer through Neo. That matters strategically because it changes the product from a syntax choice into a platform choice. A customer can begin with OSS IaC or basic cloud state management, then expand into governance, policy remediation, drift operations, and AI-assisted workflows without changing tools. The deepest product question is therefore not whether Pulumi can provision infrastructure \u2014 it clearly can \u2014 but whether enough customers adopt multiple layers of the stack to make the platform harder to replace than a simple open-source engine.",
      "claimRefs": [
        "CE001",
