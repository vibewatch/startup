      ]
    },
    {
      "id": "trust-governance-and-quality",
      "title": "Trust, compliance, quality, and the control structures around automation",
      "body": "Pulumi\u2019s trust story is no longer just \u201cwe have an open-source engine.\u201d The current product pages and late-2025 announcements show a more explicit governance stack built around policy as code, audit trails, RBAC, SSO, drift detection, customer-managed keys, and AI-assisted remediation for compliance issues. Insights & Governance now packages audit, remediate, and prevent into one lifecycle, while Neo code reviews, read-only mode, and plan mode show the company trying to wrap AI execution in operational guardrails rather than raw code generation. That is productively differentiated because most infrastructure agents still bolt onto existing tools instead of inheriting a first-class infrastructure graph, state history, and access model. The risk is that every added governance or AI layer raises customer expectations for reliability and security. In practice, Pulumi\u2019s product quality claim is strongest when the control-plane layers reinforce each other \u2014 state, policy, deployments, and AI \u2014 rather than when any one feature is evaluated in isolation.",
