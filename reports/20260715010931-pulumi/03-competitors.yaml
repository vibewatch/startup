    {
      "id": "durability-and-risk-register",
      "title": "Moat durability, pricing posture, and the main competitive risks",
      "body": "Pulumi\u2019s moat is real but not unassailable. The strongest durable advantages are language flexibility, software-engineering workflow fit, and the fact that Pulumi has expanded into secrets, deployments, governance, and AI on top of the core engine. Those extensions matter because they raise switching cost once a customer standardizes on the broader platform. But the moat has constraints. Terraform remains the ecosystem benchmark and, after IBM\u2019s HashiCorp acquisition, now sits inside a much larger distribution machine. OpenTofu weakens Pulumi\u2019s open-source positioning by giving Terraform users an easier way to keep their workflows without the BUSL concern. AWS CDK, Crossplane, and in-house platforms can each absorb slices of the same buyer problem. And adverse migration narratives show that Pulumi\u2019s strengths are most valuable when the workload is dynamic enough to justify them. In practice, Pulumi\u2019s competitive durability depends on proving that its integrated platform saves enough engineering time and governance effort to overcome incumbent familiarity. That is a strong but not automatic sales argument.",
