    {
      "id": "funding-scale-and-milestones",
      "title": "Funding history, scale markers, and milestone cadence",
      "body": "Pulumi\u2019s milestone record is strong on historical product and financing cadence. The official company timeline records founding and a $5 million seed in March 2017, first customer in November 2017, open source launch in June 2018, Pulumi Service launch and Series A in October 2018, Pulumi 1.0 in 2019, Pulumi 2.0 plus Series B in 2020, Pulumi 3.0 in 2021, Universal IaC and Deployments in 2022, and Insights, ESC, platform-team positioning, and Series C in 2023. The Series B and Series C blog posts add useful context: Series B was $37.5 million led by NEA, while Series C was $41 million from Madrona, NEA, Tola, and Strike. Scale markers become more mixed after that. In October 2023 the company disclosed more than 2,000 customers, over 150,000 end users, and 100 employees; the September 2025 Neo press release raised the customer figure to over 3,700; current product pages now say 4,000-plus companies in production; and external headcount trackers in 2026 cluster around roughly 122 to 129 employees. That combination supports a narrative of continued growth, but it also shows why later chapters must separate official company claims from third-party estimates and from still-unconfirmed late-round funding assertions.",
