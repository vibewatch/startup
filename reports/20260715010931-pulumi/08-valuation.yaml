  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "Pulumi looks strategically credible, but the investability question is highly price-sensitive because public economics are thin and the current financing context is not fully corroborated by strong primary sources. The company has real customer proof, a broadening platform, and a market category with strategic relevance. However, revenue, retention, gross margin, and module-attach data remain largely undisclosed, while public evidence for the user-supplied 2025 Series D / $1.5B post-money mark is mixed across trackers. At a conservative diligence standard, that leads to a research-more recommendation rather than an outright buy. The upside case is meaningful if Pulumi is becoming the control plane of record for platform teams; the downside case is that valuation outruns monetization depth before the control-plane thesis is proven."
  },
  "sections": [
    {
      "id": "recommendation-and-price-discipline",
      "title": "The right recommendation is research-more because quality is visible, price support is not",
      "body": "Pulumi has enough evidence of product quality and customer relevance to stay on an investor\u2019s active list, but not enough public economic disclosure to support a high-conviction buy at an assumed late-stage price. The strongest parts of the story are clear: the company has a credible enterprise roster, meaningful open-source distribution, expanding workflow modules, and a category aligned with platform-engineering and cloud-governance trends. The problem is valuation discipline. Public sources do not cleanly establish current ARR, net retention, gross margin, or even fully reconcile the current financing mark. When a company is selling an infrastructure platform with multiple attach layers, those metrics matter more than narrative. That is why the call is research-more rather than avoid. The business may be good, but the evidence supporting the price is incomplete. If private diligence proves strong module attach, durable retention, and a financing mark closer to fair than stretched, the recommendation could move quickly.",
      "claimRefs": [
