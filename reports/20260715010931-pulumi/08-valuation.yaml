    {
      "id": "valuation-context-and-comparables",
      "title": "Comparable context supports strategic relevance, but not automatic valuation comfort",
      "body": "Comparable context cuts both ways. On the positive side, infrastructure-automation and platform-engineering assets still attract capital and strategic interest. IBM paid $6.4 billion for HashiCorp, and LaunchDarkly has demonstrated that developer-infrastructure platforms can reach multi-billion-dollar private valuations. On the cautionary side, those comparables do not automatically underwrite Pulumi at any particular mark. HashiCorp was materially larger, public, and category-defining before sale. LaunchDarkly has a different product scope and monetization profile. Other private comparables such as Spacelift, Humanitec, Firefly, env0, and Massdriver confirm ecosystem activity, but they do not provide a clean valuation anchor because public revenue and valuation detail is often limited or undisclosed. The practical conclusion is that Pulumi clearly sits inside a strategically valuable category, yet public evidence still does not support false precision. Investors should treat the current mark as a hypothesis to test, not a fact to accept.",
      "claimRefs": [
