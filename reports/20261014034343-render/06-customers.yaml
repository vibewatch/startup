callouts:
  - calloutType: insight
    title: "Developer Flywheel Driven by Heroku Disruption"
    body: "Render's primary customer acquisition wedge has been capturing orphaned developer mindshare following Heroku's free tier termination in 2022. By pairing Git-based deployment simplicity with managed PostgreSQL and native Dockerfile support, Render established a low-friction adoption ramp that now converts over 250,000 monthly developer signups into early-stage startup deployments."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU009"
  - calloutType: risk
    title: "Workspace Monetization Friction and Infrastructure Ceilings"
    body: "The August 2026 workspace migration introduces structural billing friction for scaling users. While Hobby plans remain free, the 5 GB bandwidth cap triggers $0.15/GB overage fees that can rapidly escalate costs for growing web apps. Coupled with single-region service architecture and 50-second free-tier cold starts, high-volume production accounts face migration incentives toward hyperscaler infrastructure as their scale matures."
    claimRefs:
      - "CU008"
      - "CU010"
      - "CU011"
      - "CU012"
