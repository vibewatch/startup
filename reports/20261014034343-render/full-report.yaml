  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Probability Signal
      - Core Operating Assumptions
      - Implied Valuation Logic
      - Downside Triggers / Key Risks
    rows:
      - - Bull Case
        - 25%
        - >-
          ARR scales past $50M at >100% YoY growth; workspace tiers successfully monetize enterprise teams; owned
          hardware improves gross margins to 70%.
        - >-
          $2.5B to $3.5B implied valuation (50x to 70x ARR multiple) driven by category leadership in AI agent runtime
          and sustained hypergrowth.
        - >-
          Failure to convert AI code generation hype into recurring enterprise contracts; hyperscalers simplify
          developer UX.
      - - Base Case
        - 50%
        - >-
          ARR reaches $25M to $35M with 60% to 80% growth; gross margins stabilize near 50% to 55% on public cloud
          re-hosting; moderate enterprise penetration.
        - >-
          $1.2B to $1.6B implied valuation (40x to 50x ARR multiple), supporting existing February 2026 Series C
          extension mark without immediate upside.
        - >-
          Multiple compression in developer tooling; pricing friction from August 2026 workspace fees slowing new team
          adoption.
