      - number: '5.4'
        title: Technical Differentiation, Security Governance, and Reliability Constraints
        blocks:
          - type: paragraph
            body: >-
              Render differentiates itself in the cloud infrastructure landscape by providing fixed, predictable
              instance pricing, built-in autoscaling ceilings, and long execution horizons tailored for stateful AI
              workloads, where serverless platforms frequently terminate multi-step tasks. In terms of governance and
              compliance, Render meets enterprise standards by providing active SOC 2 Type II certification, HIPAA
              compatibility, ISO 27001 alignment, GDPR readiness, and automated TLS certificate issuance from Let's
              Encrypt and Google Trust Services. However, technical and operational limitations remain evident in
              production. Free tier web services enter sleep states after fifteen minutes of inactivity, introducing
              cold-start penalties of up to thirty seconds. Furthermore, the August 2026 workspace pricing migration
              instituted fifteen-cent per gigabyte overages past modest bandwidth thresholds, while mid-2026 dashboard
              degradations underscore that control plane stability remains vulnerable during upstream infrastructure
              strain.
            claimRefs:
              - CE002
              - CE008
              - CE009
              - CE012
              - CE013
              - CE014
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Persistent Compute as an Architectural Advantage for Stateful AI
            body: >-
              Unlike serverless platforms where short execution timeouts terminate multi-step reasoning, Render's
              persistent background workers and 100-minute web service timeouts provide a natural runtime for
              long-running AI agents and stateful RAG pipelines.
            calloutType: insight
            claimRefs:
              - CE001
              - CE004
          - type: callout
            title: Bandwidth Overage Costs and Dashboard Operational Fragility
            body: >-
              Render's August 2026 pricing migration imposes a fifteen-cent per gigabyte overage on bandwidth beyond
              workspace allowances, while mid-2026 incidents demonstrate that dashboard and deployment queue
              degradations remain an operational risk during upstream infrastructure stress.
            calloutType: risk
            claimRefs:
