      - number: '4.2'
        title: Go-to-Market Economics and Cost Structure
        blocks:
          - type: paragraph
            body: >-
              Render's commercial model relies on a product-led growth motion that attracts developers with low-friction
              Git deployments and free evaluation compute before converting production apps into recurring workspace
              subscriptions. The company positions its standard $25 per month 2GB RAM instances as an order-of-magnitude
              cost saving compared to legacy PaaS platforms such as Heroku. This self-serve acquisition engine has
              expanded the user base to over 4.5 million registered developers, with more than 250,000 monthly signups
              and reported year-over-year revenue expansion exceeding 100%. However, platform cost structures introduce
              hidden expense drivers as applications scale. While internal networking is unmetered, public outbound
              bandwidth exceeding plan allowances is billed at $0.15 per gigabyte across all tiers. Because Hobby
              workspaces provide only 5 GB and Pro includes 25 GB, high-throughput applications face steep marginal
              egress fees that offset baseline compute savings.
