        - 25%
        - >-
          ARR stalls below $20M; heavy reliance on free-tier developers; custom hardware initiative balloons Capex;
          gross margins compress below 45%.
        - >-
          $400M to $750M implied valuation (20x to 30x ARR multiple), representing a 50% to 70% down-round correction
          relative to the $1.5B mark.
        - >-
          Prolonged platform outages eroding customer trust; competitor price war from usage-based platforms like
          Railway.
