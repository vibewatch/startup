      - number: '4.3'
        title: Enterprise Expansion Dynamics and Platform Constraints
        blocks:
          - type: paragraph
            body: >-
              As mid-market and enterprise teams adopt Render, organizational expansion requires stepping up to the $499
              per month Scale plan or custom Enterprise contracts to unlock compliance and governance controls. Scale
              workspaces provide 1 TB of included bandwidth, SAML single sign-on, SCIM provisioning, audit logs, and
              HIPAA Business Associate Agreement eligibility, with HIPAA workloads incurring an additional 20% compute
              surcharge. Despite these enterprise features, Render encounters structural platform constraints that cap
              its addressable contract value. Northflank's technical evaluations note that Render remains a strictly
              managed PaaS with no support for bring-your-own-cloud (BYOC) infrastructure, multi-cloud management,
              customer VPC deployments, or native GPU acceleration. Furthermore, Render hosts infrastructure across only
              five geographic regions, creating immediate compliance barriers for enterprise organizations requiring
              data residency in jurisdictions outside North America, Germany, or Singapore.
            claimRefs:
