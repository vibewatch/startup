      - number: '5.2'
        title: Infrastructure Architecture, Multi-Cloud Runtime, and Persistence
        blocks:
          - type: paragraph
            body: >-
              Underneath its declarative developer abstractions, Render operates a multi-region infrastructure footprint
              deployed across five major geographical locations: Oregon, Virginia, Ohio, Frankfurt, and Singapore. The
              runtime abstracts underlying hyperscaler compute into managed container instances, enabling engineering
              teams to select native language environments—including Node.js, Bun, Python, Ruby, Go, Rust, and Elixir—or
              supply custom Dockerfiles for specialized binary dependencies. A foundational architectural component is
              zero-configuration private networking, which allows internal microservices, background workers, and
              managed PostgreSQL databases to communicate over isolated network interfaces without traversing the public
              internet or incurring metered inter-service egress charges. Stateful services can attach encrypted
              persistent disks for local filesystem durability, though these volumes remain single-instance bound and
              preclude zero-downtime rolling deploys.
            claimRefs:
              - CE001
