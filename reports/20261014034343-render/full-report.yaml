  - id: FE001
    title: Product Architecture Map
    type: stack
    summary: Layered software and infrastructure stack powering Render's managed compute, networking, and data services.
    approximationNotes: >-
      Logical architectural layers abstracted from official multi-region specifications and runtime configuration
      documentation.
    data:
      layers:
        - label: Client & Edge Ingress Layer
          detail: >-
            Global CDN edge nodes providing DDoS protection, Brotli compression, automated TLS termination, and HTTP/2
            routing to regional origins.
          modules:
            - Global CDN Edge
            - TLS Termination Engine
            - DDoS Shield
          outputs:
            - Encrypted Ingress Traffic
            - Edge Cached Assets
        - label: Developer Experience & CI/CD Layer
          detail: >-
            Git repository webhooks triggering automated container builds, Preview Environments per pull request, and
            render.yaml Blueprints orchestration.
          modules:
            - Git Webhook Listener
            - Docker Build Pipeline
            - Preview Environment Engine
            - Blueprints IaC Parser
          outputs:
            - Deployable Container Artifacts
            - Ephemeral QA Environments
        - label: Core Compute & Service Runtime Layer
          detail: >-
            Containerized compute instances supporting web services (100-minute timeouts), private microservices, and
            native runtimes for Python, Node.js, Go, Rust, and Ruby.
          modules:
            - Web Service Containers
            - Private Service Mesh
            - Native Language Runtimes
            - Docker Engine
          outputs:
            - Synchronous API Endpoints
            - Internal Service Endpoints
        - label: Background Processing & Worker Layer
          detail: >-
            Persistent background workers and scheduled cron jobs executing long-running asynchronous tasks, vector
            embedding pipelines, and agent loops.
          modules:
            - Persistent Background Workers
            - Cron Scheduler
            - Queue Consumer Daemons
          outputs:
            - Asynchronous Job Results
            - Scheduled Task Execution
        - label: Managed Data & State Persistence Layer
          detail: >-
            Managed PostgreSQL with pgvector extension, Valkey-backed Redis-compatible Key Value datastores, and
            single-instance encrypted persistent disks.
          modules:
            - Managed PostgreSQL 16
            - pgvector Extension
            - Render Key Value (Valkey)
            - Encrypted Persistent Disks
          outputs:
            - Relational Data Storage
            - Vector Embeddings
            - Fast In-Memory Cache
        - label: Multi-Cloud Physical Infrastructure Layer
          detail: >-
            Underlying cloud virtualization spanning five global regions across North America, Europe, and Asia, backed
            by zero-config private networking.
          modules:
            - US Regions (Oregon, Virginia, Ohio)
            - EU Region (Frankfurt)
            - APAC Region (Singapore)
            - Software-Defined Private Network
          outputs:
            - Physical Compute & Memory
            - Unmetered Internal Data Transfer
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE008
      - CE010
      - CE011
