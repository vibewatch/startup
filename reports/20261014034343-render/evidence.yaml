evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-metrics
    missingEvidence: >-
      Audited financial statements confirming current GAAP revenue, ARR run rate, gross margin, cash burn rate, and
      runway.
    whyItMatters: >-
      Render disclosed $27M in revenue as of February 2026 against a $1.5B valuation (55.6x multiple), but private
      disclosures lack audited recurring revenue breakdown, making fundamental valuation underwriting uncertain.
    diligencePath: >-
      Request audited financial statements, management accounts, and cohort ARR waterfalls under NDA during investment
      diligence.
    relatedQuestionRefs:
      - QO004
  - type: private-evidence-only
    severity: minor
    topic: governance
    missingEvidence: Formal board of directors composition, voting control provisions, and cap table liquidation preference stack.
    whyItMatters: >-
      While Georgian and other major venture investors are identified as lead sponsors, exact board seat allocation and
      protective provisions are not public.
    diligencePath: >-
      Review the certificate of incorporation, investors rights agreement, and cap table summary provided in the data
      room.
    relatedQuestionRefs:
      - QO006
  - type: private-evidence-only
    severity: material
    topic: som-commercial-metrics
    missingEvidence: >-
      Audited paying customer counts, annual recurring revenue (ARR), net revenue retention (NRR), and customer
      concentration breakdowns for Render.
    whyItMatters: >-
      Without segmented paying customer numbers and revenue scale, determining Render's true serviceable obtainable
      market share versus raw registered accounts is speculative.
    diligencePath: >-
      Request private financial disclosures, audited ARR bridges, and cohort retention matrices during management
      diligence.
    relatedQuestionRefs:
      - QM007
      - QM009
  - type: conflicting-data
    severity: minor
    topic: egress-and-bandwidth-economics
    missingEvidence: >-
      Independent empirical benchmarking of real-world egress bandwidth usage and overage charges for high-traffic AI
      agent workloads on Render versus hyperscaler VPC endpoints.
    whyItMatters: >-
      While Render highlights predictable instance pricing and free private networking, high outbound traffic exceeding
      the workspace bandwidth allowances incurs $0.15 per GB overage, which could alter total cost of ownership
      comparisons.
    diligencePath: >-
      Conduct side-by-side load testing and egress billing analysis across simulated enterprise RAG and multi-modal
      agent workflows.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: multi-region-and-gpu-scale
    missingEvidence: >-
      Audited enterprise migration benchmarks showing customer churn rates from Render to hyperscale IaaS specifically
      triggered by multi-region routing or dedicated GPU availability.
    whyItMatters: >-
      Validates whether single-region constraints impose a hard ceiling on Render's net revenue retention as high-scale
      AI customers expand.
    diligencePath: >-
      Interview engineering leaders at scaled Series B/C startups migrating from Render to AWS/GCP to identify exact
      inflection thresholds.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited GAAP income statements, balance sheets, and cash flow statements detailing realized ARR, gross margins,
      and net burn.
    whyItMatters: >-
      Without audited financials, revenue estimates ranging from $19.3M to $23.4M and gross margin assumptions cannot be
      underwritten against a $1.5B valuation.
    diligencePath: >-
      Request confidential management financial package, trailing twelve-month revenue ledger, and current cohort
      retention curves under NDA.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: minor
    topic: customer-concentration
    missingEvidence: >-
      Disclosed breakdown of top 10 customer revenue concentration, enterprise contract renewal rates, and net revenue
      retention (NRR).
    whyItMatters: >-
      Evaluating customer lifetime value and expansion dynamics requires understanding whether revenue is driven by
      self-serve long-tail developers or concentrated enterprise accounts.
    diligencePath: >-
      Obtain enterprise customer account metrics, expansion waterfall data, and churn statistics during formal
      confirmatory diligence.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI001
  - type: missing-source
    severity: material
    topic: gpu-and-model-sandboxes
    missingEvidence: >-
      Audited production benchmarks, self-serve GPU pricing sheets, and native object storage availability timelines for
      Render's AI compute layer.
    whyItMatters: >-
      While Render raised $100M in Series C extension to target AI-native applications, self-serve access to specialized
      GPU accelerators and dedicated sandboxes remains unverified in public pricing.
    diligencePath: >-
      Request production capability matrices for dedicated GPU clusters, model inference latency SLA documentation, and
      roadmapped object storage availability from Render enterprise sales.
    relatedQuestionRefs:
      - QE008
