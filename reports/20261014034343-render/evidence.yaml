  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin breakdown between AWS/GCP re-hosting infrastructure and self-hosted server hardware tests.
    whyItMatters: >-
      PaaS providers operating on public hyperscalers face significant gross margin compression unless owned hardware
      unit economics prove accretive.
    diligencePath: Review infrastructure COGS schedules, server capacity utilization rates, and bandwidth egress cost allocations.
  - type: private-evidence-only
    severity: material
    topic: cap-table
    missingEvidence: >-
      Full capitalization table, liquidation preferences, seniority stack, and anti-dilution protections from the Series
      C-1 extension.
    whyItMatters: >-
      Senior liquidation preferences from late-stage extension rounds can materially impair common and earlier-round
      equity returns in base/bear scenarios.
    diligencePath: >-
      Examine the Series C and Series C-1 amended and restated certificate of incorporation and investor rights
      agreements.
