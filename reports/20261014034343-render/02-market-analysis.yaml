callouts:
  - calloutType: "insight"
    title: "Heroku Displacement Wedge"
    body: "Render's primary organic acquisition engine remains developer migration away from legacy PaaS platforms such as Heroku. By maintaining matching Git-push ergonomics while offering predictable fixed instance pricing and modern managed PostgreSQL, Render captures backend services without forcing teams to adopt Kubernetes."
    claimRefs:
      - "CM001"
      - "CM003"
  - calloutType: "risk"
    title: "Enterprise Tenancy Ceiling"
    body: "While Render provides SOC 2 Type II, ISO 27001, and HIPAA compliance, enterprise organizations subject to strict data sovereignty or internal cloud VPC requirements are constrained by Render's multi-tenant shared architecture. Without a dedicated in-VPC bring-your-own-cloud deployment tier, high-scale enterprises inevitably graduate to direct AWS or GCP tenancy."
    claimRefs:
      - "CM010"
      - "CM011"
      - "CM015"
