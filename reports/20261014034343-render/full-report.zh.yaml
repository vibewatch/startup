      - number: '1.2'
        title: 创始人、管理层与治理结构
        blocks:
          - type: paragraph
            body: >-
              Render 的管理层和创始愿景围绕创始人兼 CEO Anurag Goel 展开。Goel 曾是金融科技龙头 Stripe
              的第八名员工，参与搭建其基础支付基础设施。凭借对云端摩擦和运维复杂性的切身体会，Goel 创办 Render，希望恢复 Heroku
              等早期平台带来的部署便利，同时提供现代容器编排、企业合规和多区域可靠性。公司在旧金山 525 Brannan Street 设有总部，约有 100
              名员工，并在工程、基础设施和产品运营团队中配备全球分布的远程成员。关键人依赖仍集中在 Goel 身上，他既是首席架构负责人，也是公开发言人和公司愿景负责人。治理监督和董事会代表性由成长型股权投资机构
              Georgian 主导；该机构由合伙人 Emily Walsh 牵头，领投了原始 C 轮及 2026 年 2 月的 C 轮扩展融资。虽然 Render
              的股权结构表背后有经验丰富的多阶段风投支持，但完整的董事会投票分配、独立董事席位和详细优先股结构仍属非公开信息，是优先核查事项。
