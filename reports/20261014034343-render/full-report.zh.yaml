              单点登录、SCIM 配置、审计日志以及签订 HIPAA 商业伙伴协议的资格；HIPAA 工作负载还会产生额外 20% 的计算附加费。尽管具备这些企业功能，Render
              仍受到限制可签合同价值的结构性平台约束。Northflank 的技术评测指出，Render 仍是严格托管的 PaaS，不支持自带云（BYOC）基础设施、多云管理、客户 VPC 部署或原生 GPU
