  - id: FE001
    title: 产品架构图
    type: stack
    summary: 支撑 Render 托管计算、网络和数据服务的分层软件与基础设施栈。
    approximationNotes: 逻辑架构层抽象自官方多区域规格和运行时配置文档。
    data:
      layers:
        - label: 客户端与边缘入口层
          detail: 全球 CDN 边缘节点提供 DDoS 防护、Brotli 压缩、自动 TLS 终止，并将 HTTP/2 路由至区域源站。
          modules:
            - 全球 CDN 边缘
            - TLS 终止引擎
            - DDoS 防护
          outputs:
            - 加密入口流量
            - 边缘缓存资产
        - label: 开发者体验与 CI/CD 层
          detail: Git 仓库 webhook 触发自动容器构建、每个拉取请求对应的预览环境，以及 render.yaml Blueprints 编排。
          modules:
            - Git Webhook 监听器
            - Docker 构建流水线
            - 预览环境引擎
            - Blueprints IaC 解析器
          outputs:
            - 可部署容器制品
            - 临时 QA 环境
        - label: 核心计算与服务运行时层
          detail: 容器化计算实例支持 Web 服务（100 分钟超时）、私有微服务，以及 Python、Node.js、Go、Rust 和 Ruby 原生运行时。
          modules:
            - Web 服务容器
            - 私有服务网格
            - 原生语言运行时
            - Docker 引擎
          outputs:
            - 同步 API 端点
            - 内部服务端点
        - label: 后台处理与工作进程层
          detail: 持久化后台工作进程和定时 cron 作业执行长时间异步任务、向量嵌入流水线及 agent 循环。
          modules:
            - 持久化后台工作进程
            - Cron 调度器
            - 队列消费者守护进程
          outputs:
            - 异步作业结果
            - 定时任务执行
        - label: 托管数据与状态持久化层
          detail: 带 pgvector 扩展的托管 PostgreSQL、由 Valkey 支持的 Redis 兼容键值数据存储，以及单实例加密持久化磁盘。
          modules:
            - 托管 PostgreSQL 16
            - pgvector 扩展
            - Render Key Value（Valkey）
            - 加密持久化磁盘
          outputs:
            - 关系型数据存储
            - 向量嵌入
            - 高速内存缓存
        - label: 多云物理基础设施层
          detail: 底层云虚拟化覆盖北美、欧洲和亚洲的五个全球区域，并由零配置私有网络提供支持。
          modules:
            - 美国区域（俄勒冈、弗吉尼亚、俄亥俄）
            - 欧盟区域（法兰克福）
            - 亚太区域（新加坡）
            - 软件定义私有网络
          outputs:
            - 物理计算与内存
            - 不限量内部数据传输
    claimRefs:
      - CE001
      - CE003
      - CE005
      - CE008
      - CE010
      - CE011
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 客户从个人开发者评估，到采用协作工作区、预览测试和生产扩容的推进路径。
    approximationNotes: 阶段和触点综合自 Render 工作区迁移文档、定价结构及用户评价。
