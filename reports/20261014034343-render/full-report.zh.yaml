chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 管理层身份、定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Render 是一家总部位于美国加州旧金山、面向开发者的云平台即服务（PaaS）公司，为 Web 应用、API、后台工作器、定时任务、静态站点和托管数据库提供统一的部署与扩展基础设施。公司由前 Stripe
              早期基础设施工程师、现任 CEO Anurag Goel 于 2018 年创立，将自身定位为 Amazon Web Services 和 Google Cloud Platform
              等传统超大规模云厂商的精简现代替代方案。Render 直接连接开发者在 GitHub 和 GitLab 上的代码仓库，抽象掉复杂的云配置，并自动完成构建流水线、零停机容器部署、SSL
              证书生命周期管理和全球内容分发。Render 不强制采用短暂或无状态的无服务器计算范式，而是强调持久计算原语、原生 WebSockets、持久磁盘及服务间私有网络。该架构专为现代全栈系统和新兴 AI
              原生工作负载优化，包括长时间运行的自主代理和大语言模型推理流程。公司采用一体化订阅模式，把工作区管理层级与固定月度实例计算价格结合起来，让工程组织能在可预测的预算上限内扩展生产工作负载。
            claimRefs:
