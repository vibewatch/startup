      - number: '3.2'
        title: 计算架构与功能差异化
        blocks:
          - type: paragraph
            body: >-
              现代应用平台的架构差异主要体现在运行时抽象、容器隔离和数据库集成上。Render 在托管 Docker 容器的同时，原生识别 Node.js、Python、Go、Ruby 和 Rust
              等语言运行时，并执行带有自动 TLS 终止和按负载水平自动扩展的 Web 服务。与施加严格请求执行超时的无服务器平台不同，Render
              把长时间运行的后台工作器和定时任务作为一等原语，通过私有内部网络连接。这种私有网络消除了服务间数据传输费用，也避免数据库流量暴露在公共网络中。Fly.io 提供更接近硬件的低层 VM
              虚拟化，但要求开发者进行更深入的网络配置。相比之下，Heroku 传统的 slug 编译和老旧附加组件架构落后于 Render 原生 Docker 层缓存和 Blueprint 基础设施即代码能力，使
              Render 成为容器化应用迁移更实际的目标。
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP002
            claimRefs:
              - CP007
              - CP008
              - CP009
              - CP010
      - number: '3.3'
        title: 产品打包、定价可预测性与出站经济性
        blocks:
          - type: paragraph
            body: >-
              定价架构是 Render 与竞争性云服务商之间的关键战略楔子。2026 年 8 月，Render 完成商业模式改造，将组织级工作区订阅与按实例分配的计算分开。Railway 按 vCPU 秒和 GB
              秒计费，奖励突发或闲置工作负载、却惩罚持续内存消耗；Render 则采用固定月度实例层级。这种可预测定价保护成长型初创公司免受基于用量的超大规模云厂商常见的微额费用累积和数倍级账单冲击
              数倍级账单冲击。此外，Render 在同一区域的共置服务之间提供不限量内部数据传输，消除了跨可用区数据费用，而这类费用经常推高 AWS 上数据密集型 AI 和后台处理流水线的账单。不过，超出工作区额度后按每 GB
              15 美分计收的带宽超额费，会成为高出站 Web 应用的重要成本变量。
