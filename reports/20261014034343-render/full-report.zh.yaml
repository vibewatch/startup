      - number: '1.3'
        title: 资本化历史、估值与投资者联盟
        blocks:
          - type: paragraph
            body: >-
              Render 已形成可观的成长型资本结构，自最初种子轮融资以来通过机构投资轮累计募集 $258M 股权融资。2026 年 2 月，公司完成由回归投资者 Georgian 领投的 $100M C
              轮扩展融资，投后估值达到 $1.5B。投资者联盟包括 Addition、Bessemer Venture Partners、General Catalyst 和 01 Advisors
              等知名早期及成长型风投，且均参与本轮融资。这笔融资巩固了 Render 在 2025 年 1 月首次完成 $80M C 轮融资时达到的 $1.5B 独角兽估值。私募市场可比公司数据显示，Render
              在该轮融资时的年收入为 $27M，对应 55.6x 的第一四分位收入倍数。这个高溢价倍数说明投资者看好开发者基础设施乘上 AI 辅助软件生成浪潮的机会，但也同时带来严苛的执行要求：Render
              必须维持三位数的收入增速，并证明企业利润率扩张，才能支撑其 headline 企业估值。
