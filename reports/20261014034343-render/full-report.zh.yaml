    data:
      items:
        - label: 1. 探索与免费评估
          touchpoints:
            - 通过 Git push 部署静态网站或原型 Web 服务
            - 测试自动 TLS 和全球 CDN 端点
            - 体验免费层冷启动（最多延迟 50s）
        - label: 2. Starter 项目部署
          touchpoints:
            - 将 Web 服务升级至 Starter 层（$7/mo）
            - 配置托管 Starter PostgreSQL（$7/mo）
            - 配置后台工作进程或 cron 作业
        - label: 3. 团队协作迁移
          touchpoints:
            - 创建共享组织工作区
            - 升级至 Pro 工作区计划（$25/mo）
            - 邀请团队协作者并统一计费
        - label: 4. CI/CD 预览环境
          touchpoints:
            - 为每个 GitHub PR 自动创建临时预览环境
            - 使用分支数据库进行全栈集成测试
            - 加快 QA 周期和利益相关方评审
        - label: 5. 生产扩容与合规
          touchpoints:
            - 配置 CPU / 内存水平自动扩缩容
            - 启用私有网络和持久化磁盘存储
            - 验证 SOC 2 Type II 和 HIPAA 合规控制
        - label: 6. 企业扩张或平台天花板
          touchpoints:
            - 升级到 Scale 工作区（$499/mo，含 1 TB 带宽）
            - 监控带宽超额费用（$0.15/GB）
            - 评估迁移到多区域或超大规模云厂商 VPC
