  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与平台范围
        blocks:
          - type: paragraph
            body: >-
              Render 处于云平台即服务（PaaS）市场，为 Web 应用、API、后台工作器、定时任务和托管数据库提供全托管部署环境。其核心价值主张是开发者体验：连接 Git
              仓库后即可触发自动构建、容器打包、零停机滚动部署和私有网络，无需手工编排 Kubernetes。不过，Render 与前端内容分发网络的市场边界十分清晰。行业部署评测强调，前端营销站点和静态 Web
              属性主要部署在 Vercel、Netlify 或 Cloudflare CDN 等专业平台，而 Render 被选来承载站点背后的后端服务、REST 和 GraphQL API 及数据库。Render
              不直接争夺边缘交付，而是将自身定位为现代后端计算层。客户从 Salesforce Heroku 迁移是 Render 的主要获客渠道，驱动力来自 Heroku 提价、平台停滞和免费层取消。凭借类似的 Git
              push 操作体验、现代容器运行时和有竞争力的性价比，Render 吸引了希望保持运维简洁、又不想承担超大规模云厂商开销的后端工作负载。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 市场规模与可服务机会
        blocks:
          - type: paragraph
            body: >-
              评估 Render 的可服务市场，需要把广义云基础设施宏观数据与专业开发者容器 PaaS 细分市场区分开来。全球公共云服务的总可服务市场超过 $700B，云应用平台层约为 $125B；但 Render
              的现实可服务市场集中在 $14B–$18B 的开发者托管层。Render 已展现出强劲的漏斗前端动能：截至 2026 年，公司称平台上有超过 450 万名注册开发者，每月新增开发者超过 250,000
              名。用户扩张支撑了 2026 年 2 月的 $100M C 轮扩展融资，公司估值达到 $1.5B，累计股权融资升至 $258M。然而，报告透明度不足限制了对 Render
              实际商业捕获规模的判断。公司没有公开披露付费客户转化率、年度经常性收入（ARR）、净收入留存率或毛利率。与此同时，Render
              可获得市场的上限也受到结构性约束：数字原生公司将云用量扩大到较高年度规模后，往往从托管 PaaS 供应商转向 AWS 或 GCP 直接采购基础设施，以降低单位成本。
            claimRefs:
              - CM004
              - CM005
              - CM012
              - CM015
