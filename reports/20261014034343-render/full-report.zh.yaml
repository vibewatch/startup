        - ARR 规模超过 $50M 且同比增长 >100%；工作区层级成功实现企业团队变现；自有硬件将毛利率提升至 70%。
        - 隐含估值为 $2.5B 至 $3.5B（ARR 倍数 50x 至 70x），由 AI agent 运行时的品类领导地位和持续超高速增长驱动。
        - 未能将 AI 代码生成热潮转化为经常性企业合同；超大规模云简化开发者体验。
      - - 基准情景
        - 50%
        - ARR 达到 $25M 至 $35M，增长 60% 至 80%；依靠公有云重新托管，毛利率稳定在 50% 至 55% 附近；企业渗透率中等。
        - 隐含估值为 $1.2B 至 $1.6B（ARR 倍数 40x 至 50x），支撑现有 2026 年 2 月 Series C 增资轮估值，但短期没有上行空间。
        - 开发者工具估值倍数压缩；2026 年 8 月工作区费用带来的定价摩擦拖慢新团队采用。
      - - 悲观情景
        - 25%
        - ARR 停滞在 $20M 以下；高度依赖免费层开发者；定制硬件计划推高 Capex；毛利率压缩至 45% 以下。
        - 隐含估值为 $400M 至 $750M（ARR 倍数 20x 至 30x），相对于 $1.5B 估值下修 50% 至 70%。
        - 平台长期中断削弱客户信任；Railway 等按用量计费的平台发起竞争性价格战。
    notes: 情景倍数反映截至 2026 年私有开发者工具和云运行时的估值区间。 实际 ARR 未公开披露；估值倍数以估算收入基线为前提。
    claimRefs:
      - CV001
      - CV006
      - CV010
      - CV011
      - CV012
      - CV014
