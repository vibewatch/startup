      - number: '3.4'
        title: 转换成本、平台风险与护城河持久性
        blocks:
          - type: paragraph
            body: >-
              对 Render 长期竞争持久性的评估显示，其转换壁垒不高，但开发者工作流粘性较强。由于 Render 采用 Dockerfile、标准 PostgreSQL
              数据库导出和透明环境配置，技术锁定较低；工程团队几天内就能把容器化工作负载重新部署到其他云上。留存依赖的不是技术绑定，而是开发者体验和运维可靠性。2025 和 2026 年，PaaS
              同业的可靠性记录明显分化：Railway 因 Google Cloud 账户被暂停而经历 8 小时全平台中断，Render 则保持计算可用性稳定，仅出现轻微仪表盘降级。然而，Render
              也面临清晰的架构上限。截至 2026 年，平台缺少原生 active-active 多区域集群和专用 GPU 硬件，这让高规模机器学习团队及对延迟敏感的国际部署面临结构性迁移风险，并最终转向 AWS 或 GCP。
            claimRefs:
              - CP013
              - CP014
              - CP015
