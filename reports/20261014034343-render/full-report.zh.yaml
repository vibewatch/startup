      - number: '2.3'
        title: 买方画像与预算动态
        blocks:
          - type: paragraph
            body: >-
              Render 的商业模式覆盖不同买方画像，从使用个人支付卡的软件工程师，到分配部门集中预算的工程总监。典型决策者是重视开发效率、而不是精细基础设施配置的技术创始人、CTO 或首席软件架构师。2026 年 8
              月，Render 进行结构性定价改造，将所有工作区迁移到解耦模式，把组织订阅层级与按服务计费的计算实例分开。工作区目录包括 $0 的 Hobby、每月 $25 且席位不限并含 25 GB 带宽的 Pro、每月
              $499 且含 1 TB 带宽的 Scale，以及协商确定的 Enterprise 层级。服务计算实例从每月 $7 的 Starter 起步，高内存层级最高每月 $450–$6,200；超出带宽则按
              $0.15/GB 计费。与将短暂调用计量至零的无服务器平台不同，Render 使用持久实例模式，已配置的计算资源无论流量大小都会持续产生费用。为支持商业采用，Render 提供 SOC 2 Type II、ISO
              27001 和 HIPAA 合规能力，让成长型初创公司无需维持专门 DevOps 团队，也能通过企业客户的供应商安全审查。
            claimRefs:
              - CM006
              - CM007
              - CM010
              - CM013
              - CM014
          - type: table
            tableRef: TM003
            claimRefs:
              - CM006
              - CM007
              - CM010
              - CM013
              - CM014
      - number: '2.4'
        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              Render 市场机会的扩大由两项主要结构性因素推动：AI 原生软件应用快速普及，以及组织对不可预测超大规模云账单的反弹加剧。现代 AI
              应用和检索增强生成（RAG）流水线会在后端服务与向量数据存储之间产生高度不可预测、数据密集型的流量。Render
              积极推广固定费率实例定价及免费的零配置内部私有网络，将其作为应对超大规模云厂商波动性出站费用和多可用区传输附加费的策略。无服务器函数架构会施加严格的 15 分钟执行超时、终止复杂代理工作流；相比之下，Render
              的原生后台工作器和持久磁盘可容纳没有时长上限的长期自主进程。反过来，明显的结构性约束限制了 Render 的企业渗透率。需要在自有 AWS、Azure 或 GCP
              虚拟私有云中进行严格单租户托管的高度监管组织和成熟企业无法采用 Render 的托管多租户环境。这类组织要么自建专有 Kubernetes 平台，要么采用 Porter 等自带云方案。因此，Render
              的上限取决于愿意用深度云租户控制换取托管运维简洁性的团队。
            claimRefs:
              - CM008
              - CM009
              - CM011
              - CM014
              - CM015
      - number: '2.5'
        title: 展品
        blocks:
          - type: callout
            title: Heroku 替代楔子
            body: >-
              Render 的主要自然获客引擎仍是开发者从 Heroku 等传统 PaaS 平台迁移。Render 保持相近的 Git push 操作体验，同时提供可预测的固定实例定价和现代托管
              PostgreSQL，因此能承接后端服务，而不迫使团队采用 Kubernetes。
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
          - type: callout
            title: 企业租户上限
            body: >-
              虽然 Render 提供 SOC 2 Type II、ISO 27001 和 HIPAA 合规能力，但受严格数据主权或内部云 VPC 要求约束的企业，会受到 Render 多租户共享架构的限制。没有专用的 VPC
              内自带云部署层级，高规模企业最终不可避免地会转向 AWS 或 GCP 直接租户。
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM015
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与云替代方案
        blocks:
          - type: paragraph
            body: >-
              Render 所处的开发者云生态竞争激烈，一边是 Heroku 被收购后衰落留下的空白，另一边是管理超大规模云厂商底层原语的持续摩擦。竞争环境分为三类主要替代方案：Railway 和 Fly.io 等现代直接
              PaaS 竞争者；Vercel 和 Netlify 等专业前端平台；以及 Amazon Web Services 和 Google Cloud Platform
              等现状超大规模云厂商。前端平台主导静态站点生成和无服务器 Next.js 运行时，而 Render 面向需要持久进程生命周期、后台工作器队列和托管关系数据库的全栈后端工作负载。Railway
              等直接同业者强调无摩擦的画布式开发者体验和纯用量定价，Fly.io 则凭借跨 18 个区域部署 Firecracker microVM，突出全球分布能力。Render 将自身定位为可靠、面向企业的 Heroku
              继任者，把零停机 Git 部署与明确的容器规格和生产合规控制结合起来。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: figure
            figureRef: FP001
            claimRefs:
