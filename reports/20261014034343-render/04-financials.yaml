callouts:
  - calloutType: "insight"
    title: "Predictable Workspace Floors De-Risk Infrastructure TCO"
    body: "Render's decoupled billing architecture establishes predictable base subscriptions while isolating compute autoscaling within defined ceilings, protecting customers from the compounding egress and API gateway surcharges common in hyperscaler architectures."
    claimRefs:
      - "CI001"
      - "CI003"
      - "CI007"
  - calloutType: "risk"
    title: "Lack of BYOC and GPU Primitives Limits Enterprise ACV"
    body: "Render's inability to deploy workloads into customer-owned cloud accounts or support native GPU acceleration forces enterprise customers with data sovereignty mandates or heavy AI training pipelines onto competing platforms like Northflank, capping long-term enterprise contract values."
    claimRefs:
      - "CI012"
      - "CI013"
      - "CI014"
