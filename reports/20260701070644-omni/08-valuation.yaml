  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: absolute-arr-denominator
    missingEvidence: Current absolute ARR or revenue run rate with a bridge from the cited 4x growth commentary.
    whyItMatters: Without the denominator, the current valuation can only be assessed through threshold math and not through a real multiple or return model.
    diligencePath: Request the current ARR bridge, monthly recurring revenue trend, and trailing-twelve-month revenue from finance.
    relatedQuestionRefs:
    - QV006
    - QV018
    - QV019
    - QV020
    - QV021
    - QV022
    - QV023
    - QV028
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: Net retention, gross retention, cohort renewal behavior, and revenue concentration across top accounts.
    whyItMatters: Strong logos do not justify a premium multiple if expansion quality is weak or if a few customers dominate the economics.
    diligencePath: Review cohort tables, top-customer schedules, and board retention dashboards.
    relatedQuestionRefs:
    - QV024
    - QV025
    - QV026
    - QV029
    - QV030
  - type: private-evidence-only
    severity: material
    topic: series-c-round-terms
    missingEvidence: Cap-table detail, liquidation preferences, participation rights, and any other terms that affect common-equity quality.
    whyItMatters: A headline valuation can overstate investment quality if the security structure contains strong downside protection or other preference overhang.
    diligencePath: Review executed financing documents and the current capitalization table with counsel or finance.
    relatedQuestionRefs:
    - QV027
    - QV028
    - QV029
  - type: missing-source
    severity: material
    topic: price-realization
    missingEvidence: Realized contract archetypes, discounting norms, module attach rates, and ACV ranges by customer segment.
    whyItMatters: Quote-led pricing can hide whether the product is truly supporting premium price realization or merely premium narrative.
    diligencePath: Sample executed customer contracts and inspect sales-ops pricing exports.
    relatedQuestionRefs:
    - QV009
    - QV010
    - QV025
  - type: enumeration-incomplete
    severity: minor
    topic: comparable valuation table coverage
    missingEvidence: A fuller comp sheet with more public analytics and data-platform names plus a direct view of current EV or NTM revenue methodology.
    whyItMatters: The current comp set is good enough for boundary logic but not exhaustive enough for a full investment-committee comp pack.
    diligencePath: Expand TV004 with a larger public comp screen once the denominator and intended peer set are known.
    relatedTableRefs:
    - TV004
