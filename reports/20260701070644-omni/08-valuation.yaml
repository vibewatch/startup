- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Absolute ARR or revenue run rate
    - Current recurring-revenue base and bridge from the cited growth rate
    - Without the denominator the public valuation cannot be judged cleanly
    - CFO data room or board materials
  - - Retention
    - NRR or GRR by cohort and product
    - Premium multiples only hold if growth quality is durable
    - Cohort retention pack and renewal analysis
  - - Customer concentration
    - Revenue mix across top accounts and embedded-heavy logos
    - Named logos are helpful but not enough if one or two customers dominate ARR
    - Customer concentration schedule
  - - Gross margin
    - Hosting or support burden and services mix
    - Needed to know whether Omni behaves like premium software or heavier implementation tooling
    - Audited P&L plus segment notes
  - - Contract archetypes and realized pricing
    - ACV bands, discounting, module attach, and term structure
    - Quote-led pricing can hide both upside and pressure
    - Sales-ops and procurement sample contracts
  - - Series C security terms
    - Liquidation preferences, participation rights, and any other structural protections
    - Headline valuation quality can diverge from common-equity economics
    - Financing counsel and cap-table review
  - - Cash burn and runway
    - Current cash balance and base-case to downside financing need
    - Profitability commentary alone does not prove durable self-funding
    - Treasury forecast and board operating plan
  notes: These asks are the explicit unsupported metrics and evidence gaps that prevent a stronger recommendation today.
