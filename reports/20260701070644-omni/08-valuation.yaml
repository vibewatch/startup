- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold or event
  - Transmission to thesis
  - Action implication
  rows:
  - - ARR denominator disappointment
    - Disclosed ARR is materially below roughly $100M
    - The current premium band falls toward a much lower support zone
    - Recut the case toward base or bear and avoid aggressive entry
  - - Retention or concentration weakness
    - NRR or GRR is weak or revenue is concentrated in a few logos
    - Customer proof stops translating into durable valuation quality
    - Downgrade the multiple and require cohort-level evidence
  - - Preference-heavy round terms
    - Series C economics materially favor preferred holders or embed protection not visible in headlines
    - The headline valuation overstates common-equity quality
    - Re-underwrite from the cap table rather than the press release
  - - Bundle acceptance by buyers
    - Win-loss data shows native Snowflake, Databricks, dbt, or Microsoft options are often good enough
    - Scarcity premium erodes and pricing power compresses
    - Apply a structural multiple haircut
  - - Product-maturity drag
    - Large-dashboard lag, feature gaps, or documentation debt persist as the customer base scales
    - More implementation friction reduces premium-software quality
    - Demand lower entry discipline until proof improves
  notes: These triggers express the haircut logic in operational terms instead of treating the valuation debate as a single yes or no judgment.
