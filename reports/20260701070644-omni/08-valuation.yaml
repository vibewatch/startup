- id: recommendation-and-final-diligence-asks
  title: Recommendation and Final Diligence Asks
  body: 'The chapter conclusion should be valuation-sensitive, not company-quality-blind. Omni looks like a serious late-stage analytics company with real customer proof, a credible semantic-layer-for-AI architecture, and enough efficiency signals to justify continued interest. The bull case is straightforward: if the hidden ARR denominator is already large enough, if embedded and AI workflows are monetizing cleanly, and if retention and concentration are healthy, then the Series C could look reasonable or even smart in hindsight. The anti-thesis is equally straightforward: if the undisclosed ARR base is still modest, if price realization is weaker than the narrative suggests, or if buyers increasingly accept bundled warehouse-native semantics, then the company could be priced for more certainty than the evidence warrants.

    That is why the right call is Track rather than buy. Public evidence is good enough to say the valuation is credible, but not good enough to say it is clearly attractive. The diligence burden before underwriting the price is mechanical rather than philosophical: absolute ARR, NRR or GRR, gross margin, customer concentration, cash burn and runway, contract archetypes, and exact Series C economic terms. If those metrics show a high-quality, scalable business already above roughly $100M ARR with strong retention, the case can upgrade. If they do not, the multiple support compresses quickly. Until then, the fairest description of the current mark is fair-to-stretched, with more downside from opacity than upside from narrative alone.'
