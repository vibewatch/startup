company:
  name: Omni
chapter:
  number: 8
  title: Valuation
  summary: 'Omni''s April 2026 Series C at a $1.5B valuation is credible as a market event and not obviously reckless on the surface, given 4x ARR growth commentary, first-time profitability, roughly 200 employees, and visible customer-facing monetization. But the public record still omits the absolute ARR base, retention, concentration, gross margin, burn, and round terms, while bundle risk from Snowflake, Databricks, dbt, and Microsoft keeps rising. The most supportable output is therefore a valuation lens rather than a precision fair value: Track, with a fair-to-stretched stance that depends heavily on whether Omni is already above roughly $100M of ARR with strong retention.'
sections:
- id: current-price-anchor-and-disclosure-gap
  title: Current Price Anchor and Disclosure Gap
  body: 'The strongest fact in Omni''s public valuation file is the financing step-up itself. Omni''s official April 2026 press release and founder letter both state that the company raised $120M at a $1.5B valuation, led by ICONIQ, and paired the round with a $30M employee tender. Yahoo/Fortune and Silicon Valley Daily corroborate that the company was being priced around $1.5B to $1.51B, so the headline valuation is real enough to use as an anchor. The prior anchor is also unusually clear for a private company: Omni''s March 2025 Series B post said it raised $69M at a $650M valuation. That means the market marked the company up by roughly 2.3x in a little over a year.

    The problem is not whether a markup happened; it is what the markup was actually buying. Omni''s founder letter says ARR scaled 4x over the prior year, and Yahoo/Fortune adds that ARR grew nearly fourfold, the company hit profitability in the month before the round, and headcount was roughly 200. Those are meaningful positives, especially because they suggest capital efficiency rather than pure hiring-led expansion. But none of the public Series B or Series C sources discloses the absolute ARR denominator, NRR, concentration, gross margin, burn, or the economic details of the Series C security. So the public file is good enough to verify a real market price and directionally strong momentum, yet still too thin to support a traditional intrinsic model or a clean point estimate on fair value.'
