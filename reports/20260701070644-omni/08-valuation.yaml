- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Growth
    - 4x ARR growth commentary and first-time profitability suggest genuine operating leverage
    - The public file still hides the ARR denominator and gross-margin quality
    - Audited ARR bridge plus gross-margin disclosure
  - - Monetization surface
    - Embedded analytics and AI workflows can raise contract value beyond plain dashboard seats
    - Public evidence still does not show realized expansion or renewal math
    - Module-level ARR and renewal cohorts
  - - Pricing power
    - Quote-led packaging can support premium enterprise contracts
    - Lack of transparent pricing can also hide discounting pressure or uneven price realization
    - Contract archetypes and realized ACV bands
  - - Category position
    - Omni's semantic-layer-for-AI framing is timely and customer-facing use cases are distinctive
    - Snowflake, Databricks, dbt, and Microsoft reduce scarcity with bundled alternatives
    - Win-loss data against native and bundled substitutes
  - - Capital efficiency
    - Roughly 200 employees and profitability commentary imply better efficiency than a pure headcount-fueled story
    - One profitability month is not the same as durable cash generation
    - Cash-flow history and burn or runway detail
  notes: The anti-thesis is mainly about valuation support and category crowding, not about a lack of real product demand.
