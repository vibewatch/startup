- id: TI003
  title: Unit Economics Table
  columns:
  - Metric
  - Value / public proxy
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - ARR / revenue run rate
    - null
    - Low
    - Core scale indicator for underwriting and valuation work
    - Provide current ARR, trailing-12-month revenue, and a quarterly bridge from FY2025 to current
  - - Growth rate
    - Series C said revenue grew 4x YoY; Fortune/Yahoo said ARR grew nearly fourfold
    - Medium
    - Shows demand velocity even though the absolute base is hidden
    - Reconcile exact revenue vs ARR definitions and show the starting denominator
  - - Profitability status
    - Fortune/Yahoo said Omni became profitable in the month before the Series C
    - Medium
    - Positive capital-efficiency signal, but metric basis is unspecified
    - Specify whether profitability means GAAP operating profit, EBITDA, or cash-flow positivity
  - - Gross margin
    - null
    - Low
    - Needed to judge whether embedded deployment and support still look software-like
    - Provide GAAP and non-GAAP gross margin, plus margin by core platform vs services/support
  - - CAC payback
    - null
    - Low
    - Determines whether rapid growth is efficient or financing-dependent
    - Provide sales and marketing spend, new ARR, and standard payback calculation
  - - Deployment / time-to-value proxy
    - BambooHR launched to 30K+ in 4 months; Cribl rebuilt ~100 dashboards in 5 weeks; Guitar Center shut Tableau in under 6 months
    - Medium
    - Fast deployment can support better close rates and faster ROI realization
    - Share median time from signature to first production value by segment
  - - Support / service intensity
    - Customer migrations, granular permissions work, and adverse review complaints imply nontrivial delivery effort
    - Medium
    - High-touch enablement can mute gross margin or slow scaling
    - Disclose onboarding hours, support ratios, and margin on implementation services if any
  - - Customer scale proxy
    - '>200 companies by March 2025 plus named enterprise logos in 2026'
    - Medium
    - Supports traction quality, but not contract size or concentration
    - Provide paying-customer count, top-10 revenue concentration, and enterprise vs mid-market mix
  notes: Nulls are real public-data gaps. Usable public proxies come from growth commentary, profitability commentary, customer deployments, and adverse review evidence.
