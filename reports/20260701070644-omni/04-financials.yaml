- id: TI007
  title: Financial Signal Triangulation / Scenario Table
  columns:
  - Scenario lens
  - Public inputs
  - What it suggests
  - What remains unknowable
  - Underwriting implication
  rows:
  - - Efficient growth case
    - 4x/near-4x growth commentary, profitability claim, ~200 employees, and large enterprise logos
    - Omni may be scaling efficiently for a private analytics company
    - Absolute ARR, gross margin, and cash conversion are missing
    - Treat as plausible upside, not a concluded efficiency fact
  - - Embedded expansion case
    - BambooHR Elite tier, embedded monetization language, finance workflows, APIs and AI surfaces
    - Wallet share may expand beyond classic BI seats into platform and product workflows
    - Attach rates and revenue mix by module are undisclosed
    - Expansion narrative is credible but not yet quantifiable
  - - Fast-payback replacement case
    - Cribl, Guitar Center, Synthesia, and customer-hub migration evidence
    - Rapid deployment and consolidation could support healthy payback and low-friction replacement sales
    - No CAC payback, ACV, or post-sale services cost data
    - Strong GTM proxy, but still only a proxy
  - - Margin-pressure case
    - Granular permissions work, support intensity, lag on large dashboards, missing chart types, and documentation lag
    - Support and enablement could keep margins below best-in-class pure-play software levels
    - No gross margin or services revenue disclosure
    - Do not underwrite elite software margins without proof
  - - Valuation-risk case
    - $650M in March 2025 to about $1.5B in April 2026 without disclosed ARR denominator
    - If growth and profitability hold, the mark may be justified; if the revenue base is smaller than assumed, the mark could be stretched
    - No denominator for valuation multiples and no downside runway view
    - Preserve valuation risk explicitly and diligence the denominator first
  notes: Scenario rows use only public inputs, directional estimates, and explicit unknowns; they do not assume undisclosed SaaS metrics.
