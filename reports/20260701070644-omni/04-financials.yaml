  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: ARR and revenue denominator
    missingEvidence: Current ARR, trailing revenue, and a quarterly bridge from the March 2025 Series B window through the current quarter.
    whyItMatters: The denominator is required to convert valuation into a multiple and to judge whether 4x growth implies breakout scale or early-base acceleration.
    diligencePath: Request the latest board KPI pack or finance dashboard with ARR, revenue, growth bridge, and customer mix by segment.
    relatedQuestionRefs:
    - QI010
    - QI021
    - QI022
    relatedTableRefs:
    - TI003
    - TI005
    - TI007
  - type: private-evidence-only
    severity: material
    topic: Burn cash and runway
    missingEvidence: Current cash balance, gross and net burn, runway, and any debt-like obligations or cloud commitments.
    whyItMatters: Large financing rounds do not prove balance-sheet durability without knowing current burn or covenant-style constraints.
    diligencePath: Request the latest balance sheet, monthly cash bridge, venture-debt schedule, and base/downside runway model.
    relatedQuestionRefs:
    - QI011
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
  - type: private-evidence-only
    severity: material
    topic: Gross margin and sales efficiency
    missingEvidence: GAAP and non-GAAP gross margin, CAC payback, NRR, churn, and implementation/support cost by cohort or segment.
    whyItMatters: These metrics determine whether Omni is scaling like elite software or carrying a heavier support and deployment burden.
    diligencePath: Request P&L detail, gross-margin bridge, S&M efficiency metrics, and cohort retention tables.
    relatedQuestionRefs:
    - QI009
    - QI012
    - QI020
    relatedTableRefs:
    - TI003
    - TI005
    - TI007
  - type: private-evidence-only
    severity: material
    topic: Realized pricing and expansion mix
    missingEvidence: Contract structures showing seats, usage, embedded entitlements, AI packaging, discounts, and module-level expansion contribution.
    whyItMatters: Official pages prove monetization vectors but do not reveal how value is captured commercially or how pricing scales across workflows.
    diligencePath: Review recent customer contracts and bookings reports segmented by core platform, embedded analytics, spreadsheets, and AI-related modules.
    relatedQuestionRefs:
    - QI002
    - QI003
    - QI005
    - QI018
    relatedTableRefs:
    - TI001
    - TI002
    - TI005
