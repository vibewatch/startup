  title: The strongest public proof is on customer monetization, not Omni tariff design
  body: Omni publicly proves that customers can launch premium analytics tiers, migrate large dashboard estates quickly, and widen analytics access, but it still does not publish the seat, usage, or discount mechanics that convert those outcomes into vendor revenue quality.
