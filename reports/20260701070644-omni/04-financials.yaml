- id: TI002
  title: Pricing / Monetization Table
  columns:
  - Source / plan signal
  - Price / unit / contract
  - List vs realized
  - Included capabilities
  - Discounts / unknowns
  - Implication
  rows:
  - - Omni official product pages
    - No public list price
    - Realized pricing unknown
    - Semantic model, dashboards, embedded analytics, AI, spreadsheets, APIs
    - Seat counts, module gating, term, and discounts are undisclosed
    - Omni appears to sell through enterprise ROI rather than a transparent rate card
  - - BambooHR Elite tier case study
    - Customer launched a higher analytics tier, but Omni take rate is not public
    - Customer monetization signal, not vendor list price
    - Embedded analytics, self-serve reporting, permissions, customization
    - No public breakdown of how BambooHR prices the feature or what Omni captures
    - Shows Omni can power upsellable product packaging even when its own tariff stays private
  - - Microsoft Power BI pricing
    - Free; Pro $14/user/month; Premium Per User $24/user/month; higher capacity for some license-free sharing
    - Public list anchor
    - Incumbent BI seats plus capacity and sharing model
    - Enterprise capacity spend and real discounts still vary
    - Provides a low-end incumbent budget anchor against which Omni must prove higher ROI
  - - Tableau pricing
    - Viewer $15; Explorer $42; Creator $75 per user/month; Cloud+ and Tableau+ contact sales
    - Public list plus bundle signal
    - Role-based analytics plus higher-end agentic bundles
    - Enterprise bundle pricing and discounts remain opaque
    - Shows buyers can benchmark Omni against known seat economics even if advanced bundles are custom
  - - Omni finance-workflow blog
    - No public SKU price
    - Expansion-surface signal only
    - Live spreadsheet modeling, ARR reporting, monthly reporting
    - No disclosure of whether spreadsheets lift ACV or require premium packaging
    - Suggests Omni can widen wallet share into finance without proving realized monetization publicly
  - - Case-study ROI narrative
    - Faster launches, engineering savings, and tool shutdowns rather than public vendor list price
    - Outcome proxy, not price
    - Migration speed, consolidation, product differentiation, self-service
    - Cannot translate directly into gross profit or payback
    - Commercial story is value-led and must be diligence-tested at the contract level
  notes: The table separates public list anchors from value proof so customer ROI is not mistaken for Omni's realized revenue or margin.
