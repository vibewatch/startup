- id: traction-and-unit-economics-proxies
  title: Traction and Unit-Economics Proxies
  body: 'Omni discloses directional traction far more readily than absolute scale. The March 2025 Series B materials said revenue and customer usage were both growing 8x year over year and that more than 200 companies were already using the platform. The April 2026 Series C materials then shifted from usage language to financial language, saying revenue grew 4x year over year, while the Fortune story syndicated on Yahoo said ARR grew nearly fourfold, Omni became profitable in the prior month, and headcount was roughly 200. Those are meaningful signals because they point to a company scaling quickly without a giant disclosed workforce. They are still incomplete because the denominator is absent: no public ARR base, no TTM revenue, no NRR, no gross margin, and no CAC payback.


    Customer deployments are therefore the best proxy for unit economics and sales efficiency. BambooHR launched a new analytics tier to 30,000+ people in four months and later 100,000+ people, directly tying Omni to an upsellable embedded product. Cribl rebuilt roughly 100 dashboards in five weeks, migrated fully in three months, and cited migration CSAT near 89 plus at least one user saving 15 hours per month. Guitar Center replaced 150+ dashboards and shut Tableau down inside six months, while Synthesia used Omni to speed forecasting and self-service in under three months. These case studies support a fast time-to-value and consolidation story. But the adverse evidence matters too: AWS Marketplace-syndicated reviews cite a learning curve, lag on large dashboards, missing chart types, occasional instability, and documentation lag. That means Omni''s deployment economics may be better than legacy BI on business value, yet still carry nontrivial support and onboarding cost that public materials
    do not quantify.'
