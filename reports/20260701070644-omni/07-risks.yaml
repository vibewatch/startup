company:
  name: Omni
chapter:
  number: 7
  title: Risks
  summary: Omni's main risks come less from lack of market interest than from defending a governed-semantic-and-agent wedge against bundled incumbents while carrying a $1.5B valuation on still-thin public durability data. The company has real mitigants in permissions, security controls, and a coherent semantic architecture, but the biggest open questions remain customer-quality disclosure, runtime AI accuracy evidence, product-surface maturity, and dependence on external stacks that are themselves moving up the semantic-layer stack.
sections:
- id: structural-market-and-valuation-risk
  title: Structural market pressure and valuation risk
  body: |-
    Omni's hardest risk is structural: the same category wave that created demand for governed semantic layers is also letting bigger platforms absorb more of that value. Snowflake now stores semantic concepts directly in database-level semantic views and feeds them into Cortex Analyst, Databricks puts centralized metric views inside Unity Catalog and lets them flow into Genie, dashboards, alerts, and external BI tools, dbt markets one semantic layer for metrics, embedded apps, and AI workflows, and Microsoft bundles Copilot into Fabric and Power BI capacity controls that many enterprises already license. Independent comparison pages from Cube, Holistics, and Labs4Change all point to the same pressure pattern: semantic governance and AI-safe metrics are no longer a niche wedge by themselves. In simpler one-warehouse deployments, a native or already-paid stack can become good enough even if Omni's architecture is cleaner.

    That structural pressure matters more because Omni now carries a late-stage valuation that assumes category leadership and durable expansion rather than just product novelty. The April 2026 raise at a $1.5B valuation came with strong growth claims, but the public denominator set is still thin: there is no audited public P&L, no public gross-margin curve, no disclosed NRR or churn cohorts, and no clear concentration disclosure. That leaves investors underwriting not only whether Omni wins, but whether it wins fast enough and durably enough to outrun bundled competition before the category commoditizes.
  claimRefs:
