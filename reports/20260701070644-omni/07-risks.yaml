- id: ai-governance-and-product-maturity-risk
  title: AI governance, implementation complexity, and product maturity risk
  body: |-
    Omni's product story is coherent, but that coherence also exposes where implementation risk can show up. The governed path works best when customers keep work inside shared topics, permissioned workbooks, and controlled agent surfaces. Yet Omni's own docs show that advanced SQL editing can create query-specific fields outside the shared model, spreadsheet tabs cannot promote their logic back into the governed layer, and MCP use requires organizations to enable the feature, manage PAT or OAuth settings, and align roles correctly. In other words, the product's accuracy and governance story is not automatic; it is conditional on admin quality, modeling discipline, and thoughtful rollout decisions.

    The public proof for AI accuracy is also thinner than the public proof for AI architecture. Omni's funding announcement and query API examples explain how governed definitions and permissions flow into AI queries, and Checkr's case study shows why customers wanted context and reliability loops. But the public corpus still does not disclose benchmarked hallucination rates, false-answer rates, permission-escape tests, or incident counts specific to AI outputs. Review and practitioner evidence adds a second layer of risk: large dashboards can lag or crash, chart coverage is still growing, documentation can trail new releases, and even the external developer surface has seen visible deprecation and consolidation. That does not invalidate the product thesis, but it does mean operational polish remains part of the underwriting question.
  claimRefs:
