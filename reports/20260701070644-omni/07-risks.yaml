- id: TR006
  title: Mitigation and kill criteria table
  columns:
  - Risk class
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - structural
    - Bundle pressure
    - Native warehouse or suite tools win core governed-metrics decisions
    - Win/loss mix shifts materially toward “good enough in-stack” losses
    - Lower terminal differentiation and compress valuation assumptions.
  - - structural
    - Valuation / disclosure gap
    - New financing or tender arrives without richer denominators
    - Another step-up valuation before public retention or margin evidence improves
    - Demand a stronger downside case and tighter price discipline.
  - - execution
    - AI runtime accuracy
    - Repeated mis-answers, permission leaks, or absent eval evidence
    - Management cannot show controlled evals, rollback, and audit metrics
    - Treat the AI thesis as unproven rather than merely early.
  - - execution
    - Customer durability
    - Large-logo churn or weak renewal cohorts
    - NRR, GRR, or top-account concentration underperform expectation
    - Re-cut revenue durability and support-cost assumptions.
  - - execution
    - Platform quality and dependency
    - Outages, dashboard instability, or doc churn persist
    - Incident metrics or support tickets show repeated high-severity issues
    - Treat execution capacity as the gating risk before expansion upside.
  notes: The kill criteria focus on events that would change underwriting, not on generic product concerns that any growth company could claim.
