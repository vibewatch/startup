  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: retention-durability
    missingEvidence: Logo-level NRR, GRR, churn, renewal cohorts, top-account concentration, and services mix by deployment type.
    whyItMatters: These metrics determine whether the $1.5B valuation rests on durable expansion economics or on early flagship wins with unknown renewal quality.
    diligencePath: Request board-style cohort tables plus top-20 account concentration and renewal summaries for the last four quarters.
    relatedQuestionRefs:
    - QR028
    relatedTableRefs:
    - TR004
  - type: private-evidence-only
    severity: material
    topic: incident-metrics
    missingEvidence: Severity-tagged incident counts, MTTR, customer-impact summaries, and postmortem examples beyond public maintenance notices.
    whyItMatters: Operational quality is a top risk because dashboard stability, request failures, and rollout trust directly affect expansion and support burden.
    diligencePath: Request the last 12 months of incident metrics, postmortem templates, and customer-notification examples.
    relatedQuestionRefs:
    - QR029
    relatedTableRefs:
    - TR002
    - TR006
  - type: missing-source
    severity: material
    topic: ai-evals
    missingEvidence: Public or private eval scorecards, hallucination/error rates, permission-escape tests, and rollback controls for Omni Agent and MCP-connected AI clients.
    whyItMatters: Architecture claims alone do not show runtime accuracy under messy enterprise prompts, especially when the product thesis is explicitly about governed AI answers.
    diligencePath: Request internal AI evaluation dashboards, red-team or permission-boundary tests, and examples of blocked or corrected unsafe outputs.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR001
    - TR002
    - TR006
