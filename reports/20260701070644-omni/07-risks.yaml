- id: legal-security-and-platform-dependence
  title: Legal, security, and platform-dependence risk
  body: |-
    Omni is better positioned than many young analytics vendors on trust signaling, but the public legal and compliance surface still leaves work for buyers to do. The Terms of Use are standard California-governed website terms, the privacy policy explicitly says customer data is governed by contracts rather than the public policy, the security page highlights annual SOC 2 Type II audits and broad compliance claims, and the Trust Center plus CSA STAR listing improve procurement optics. Those are real mitigants, especially for a product that wants to become the semantic and AI control plane for enterprise data. They are not the same thing as public proof that every enterprise deployment has a mature DPA, subprocessor posture, support-access boundary, incident workflow, or customer-specific row-level and agent-control implementation.

    Dependency risk compounds the legal and security picture. Omni depends on AWS infrastructure, centralized authentication, and customer-side permission design, while also trying to bridge into dbt, Snowflake semantic views, Databricks metric views, embedded applications, and external AI clients over MCP. That bridge strategy is strategically smart, but every extra bridge is another place where rollout quality, compatibility drift, or upstream vendor product moves can weaken Omni's control over the end-to-end experience. For European and more regulated buyers, the AI Act and NIST-style trustworthy-AI expectations also raise the bar for transparency, monitoring, and documented controls around how AI-assisted answers are generated and reviewed.
