- id: mitigants-monitoring-and-thesis-breakers
  title: Mitigants, monitoring indicators, and thesis-break triggers
  body: |-
    The good news is that Omni's risks are not unbounded and the public mitigants are substantive. The product is built around governed definitions rather than free-form prompting, permissions are granular, customer examples show the platform can underpin real analytics products, and the security posture is stronger than a typical early-stage startup's. The company also appears self-aware about the AI problem it is trying to solve: both its own messaging and Checkr's case study emphasize that context, permissions, and testing loops matter more than raw model cleverness. That is the right conceptual foundation.

    The underwriting challenge is that the strongest mitigants mostly reduce execution risk rather than eliminating structural risk. If bundled incumbents keep improving, if public durability data remains thin, or if AI runtime quality cannot be measured cleanly, architecture alone will not save the thesis. The right diligence response is therefore event-driven: require renewal and concentration data, ask for AI eval scorecards, inspect incident and support metrics, and test how much of the customer value survives if a buyer standardizes on one vendor stack. Those are the signals that distinguish a differentiated control plane from a strong but replaceable product narrative.
