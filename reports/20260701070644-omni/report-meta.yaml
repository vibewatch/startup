companyProfile:
  summary: >-
    Omni is a San Francisco-based AI analytics company founded in 2022 by Colin Zima, Jamie
    Davidson, and Chris Merrick, whose backgrounds span Looker, Google, Stitch, and Talend.
    The product centers on a governed semantic layer reused across internal BI, embedded
    analytics, APIs, MCP, and AI workflows so teams can keep one trusted business model across
    dashboards and agents. Since launch, Omni has progressed from a $26.9M seed-plus-Series-A
    financing to a $120M Series C at a $1.5B valuation, with public traction signals including
    200+ companies using the platform in 2025 and named customers such as BambooHR, Checkr,
    Cribl, dbt Labs, Mercury, Pendo, and Synthesia.
  foundedDate: "2022-02-01"
  founders:
    - name: Colin Zima
      role: CEO & Co-founder
      background: Former Looker chief analytics officer and vice president of product.
      claimRefs: [CO016, CO019, CO020]
    - name: Jamie Davidson
      role: President & Co-founder
      background: Former Looker and Google leader before co-founding Omni.
