  topStrengths:
    - Founder-market fit is unusually strong, with leadership drawn from Looker, Google, Stitch, and Talend.
    - One governed semantic model is reused across BI, embedded analytics, APIs, MCP, and AI workflows.
    - Public customer proof shows real migration speed and hybrid internal-plus-embedded deployments.
    - 4x ARR growth commentary and first-time profitability suggest credible capital-efficiency momentum.
  topRisks:
    - A $1.5B valuation is hard to underwrite without disclosed ARR, retention, gross margin, or concentration.
    - Incumbent suites and warehouse-native semantic layers are bundling similar governed-AI narratives.
    - Product scope now spans BI, embeds, APIs, MCP, and external agents, increasing execution and support complexity.
    - Public evidence still suggests visualization depth and embedded UX flexibility may trail top BI incumbents.
  unresolvedGaps:
    - Absolute ARR, current revenue run rate, and customer-count disclosure remain absent.
    - NRR, churn, renewal cohorts, contract length, and top-customer concentration are still undisclosed.
    - Gross margin, burn, runway, and realized pricing mechanics are not public.
    - Full board composition, incident-severity history, AI eval evidence, and exact Series C terms remain unclear.
