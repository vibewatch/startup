  foundingLocation: San Francisco, California, USA
  headquarters: San Francisco, California, USA
  productSummary: >-
    SQL-first analytics platform built on a governed semantic model that powers dashboards,
    spreadsheets, embedded analytics, REST/API access, MCP-based agent workflows, and AI
    querying from the same business-logic layer.
  customerFocus: >-
    Mid-market and enterprise data, analytics, product, finance, and customer-facing teams that
    want one governed model for internal BI, embedded analytics, and AI-assisted analysis.
  businessModel: >-
    Sales-led B2B software monetization across internal BI, embedded analytics, and AI-access
    workflows, with expansion tied to wider self-service usage and customer-facing premium
    analytics tiers.
  stage: Series C (private, venture-backed)
  fundingStatus: >-
