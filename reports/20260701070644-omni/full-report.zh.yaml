      - number: '6.4'
        title: 独立评价信号、支持与上线启示
        blocks:
          - type: paragraph
            body: >-
              独立证据方向上支持 Omni，但比官方案例集薄得多。TrustRadius 只有两条评论，给 Omni 8.6/10；AWS Marketplace 则基于 65 条同步的 G2 评论显示
              4.8/5。这些评论稳定称赞灵活的仪表盘、受治理指标、SQL
              加电子表格工作流，以及响应快的支持。它们也补上官方案例淡化的买方细节：一些用户最初觉得搭建流程不好理解，一些大型仪表盘会卡顿或崩溃，一些图表类型仍需要写代码，文档有时跟不上近期发布。一位 B2B2C
              风格的评论者还抱怨，数千名终端用户只是偶尔访问分析时，按席位计费会显得别扭。[CU035] [CU036] [CU037] [CU038] [CU039]


              这些评论模式与实施故事相互印证。BambooHR、SWBC 等更大或受监管更强的客户强调权限、负载测试、产品上手和战略性厂商支持。Cribl 和 Checkr
              强调的是上下文工程、模型治理和变更管理闭环，而不只是迁移仪表盘。Spicy Data 的嵌入式实施复盘尤其有用：它确认 Omni 为什么能赢下一些客户侧场景——Git/dbt
              工作流、血缘、灵活授权——同时也呈现新平台的真实运营取舍，包括界面仍在演进、图表库仍在扩充。归根结底，上线和支持看起来是产品的一部分，不是事后补救；但买方应预期，模型设计和上线节奏会影响结果。[CU013]
