      - number: '1.4'
        title: 里程碑、控制与负面信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，Omni 从商业智能有序扩展到 AI 基础设施。2022 年发布公告把 Omni 定义为灵活分析与 企业治理之间的桥。此后的产品、文档和演示页面显示，平台沿三条线拓宽：更深的建模和数仓支持，
              面向客户的嵌入式分析，以及 Blobby、MCP 连接、按用户 API token、AI 会话历史、Snowflake Cortex 模型选择和 Agentic 查询 API 等 AI
              接口。因此，公司产品时间线与当前「AI 语义层」叙事吻合， 而不是把 AI 话术硬套到没有变化的 BI 产品上。


              控制图景有瑕疵但仍可投。正面看，Omni 反复强调权限、受治理指标、基于 Git 的工作流、CI/CD 式变更管理，
              以及客户数据不会用于训练模型。负面看，第三方用户评论称，产品一开始可能难懂，大型仪表盘可能卡顿或崩溃， 部分高级功能藏得较深，图表覆盖仍落后成熟在位者，文档也可能滞后于新版本。因此，公开证据支持一个更细的判断：
              Omni 有真实技术深度和品类洞察，但在向独角兽估值扩张时，产品易用性和完整度仍在成熟。绝对 ARR、客户数和完整董事会 构成等没有支撑的封面指标，应明确保持开放，而不是从叙事里猜出来。
