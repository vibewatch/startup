      - number: '8.3'
        title: 情景测算与风险折扣
        blocks:
          - type: paragraph
            body: >-
              由于 Omni 没有披露绝对 ARR，评估 $1.5B 最诚实的方法，是反推收入倍数数学，而不是在证据支撑不了的地方断言公允价值。按 20x 收入计算，当前价格只隐含约 $75M ARR 或收入。按 15x 约为
              $100M。按 12x 约为 $125M。按 10x 约为 $150M，按 8x 到 7x 则约为 $188M 到 $214M。这些阈值有用，因为它们显示结论对投资者目前看不见的分母有多敏感。如果 Omni
              已经高于约 $100M 的高留存 ARR，并具备持久的嵌入式变现和不错毛利率，$1.5B 可以放进高端分析叙事里。如果真实基数明显更小，估值就开始显得很满。

              折扣逻辑也两头都成立。盈利评论、约 200 人团队，以及 Omni 帮客户构建可变现分析产品的证据，都支持给出高于大宗 BI
              工具的倍数。但定价不透明、留存和集中度公开披露弱，以及打包语义层越来越容易获得，都要求从任何完美 AI 平台倍数上削掉几圈。评论又带来一点温和折扣：G2 和 AWS Marketplace
              的反馈总体正面，但仍指出学习曲线成本、功能缺口、文档滞后，以及大型仪表盘性能偏软。换句话说，公开材料支持相对普通仪表盘软件的有意义溢价，但不支持一种英雄式溢价，仿佛执行摩擦和打包压力都不存在。
