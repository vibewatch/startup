  - id: FR003
    title: 依赖图
    type: dag
    layout: wide
    summary: Omni 处在数仓、数据转换、AI 客户端、嵌入式宿主和客户管理配置的交汇处。
    data:
      nodes:
        - id: aws
          label: AWS / IdP
          detail: 基础设施、存储和身份边界。
        - id: snowflake
          label: Snowflake
          detail: 原生语义视图和 Cortex Analyst 路径。
        - id: databricks
          label: Databricks
          detail: Unity Catalog 指标视图和 Genie 路径。
        - id: dbt
          label: dbt
          detail: 元数据、模型和竞争性语义层。
        - id: ai
          label: 外部 AI 客户端
          detail: Claude、ChatGPT、Cursor、VS Code 和其他 MCP 消费方。
        - id: admins
          label: 客户管理员
          detail: 权限、PAT、嵌入和上线纪律。
        - id: hosts
          label: 嵌入式宿主应用
          detail: 产品 UX、品牌化和租户上下文。
        - id: omni
          label: Omni 核心平台
          detail: 语义模型、工作簿、API 和代理层。
        - id: cust
          label: 企业客户
          detail: 买方决定 Omni 是核心控制平面还是可选层。
      edges:
        - from: aws
          to: omni
        - from: snowflake
          to: omni
        - from: databricks
          to: omni
        - from: dbt
          to: omni
        - from: ai
          to: omni
        - from: admins
          to: omni
        - from: hosts
          to: omni
        - from: omni
          to: cust
        - from: snowflake
          to: cust
        - from: databricks
          to: cust
    approximationNotes: 该图突出最高杠杆的依赖节点，而不是来源集中的每个集成或市场拓展关系。
    claimRefs:
      - CR028
      - CR029
      - CR030
      - CR036
      - CR038
      - CR039
      - CR041
      - CR042
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: standard
    summary: 决策路径从可信的私募市场估值锚出发，经过分母不透明和套件风险，落到跟踪立场。
    data:
      nodes:
        - id: price
          label: $1.5B 价格锚
          detail: Series C 估值已有佐证
        - id: proof
          label: 真实动能
          detail: 4x ARR 说法、盈利、约 200 名员工
        - id: opacity
          label: 分母缺失
          detail: ARR、留存、利润率、集中度和条款未披露
        - id: bundle
          label: 套件风险
          detail: Snowflake、Databricks、dbt 和 Microsoft 削弱稀缺性
        - id: outcome
          label: 跟踪
          detail: 在尽调补齐缺口前，估值介于合理到偏高之间
      edges:
        - from: price
          to: proof
          label: 支持继续研究
        - from: proof
          to: opacity
          label: 抵消
        - from: opacity
          to: bundle
          label: 放大
        - from: bundle
          to: outcome
          label: 导致
    claimRefs:
      - CV010
      - CV019
      - CV021
      - CV028
      - CV050
      - CV051
      - CV052
      - CV056
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: $1.5B 的固定价格下，最终能站住脚的收入倍数不同，所需 ARR 门槛会差很多。
    data:
      items:
        - label: 20x 收入倍数
          value: 75
        - label: 15x 收入倍数
          value: 100
        - label: 12x 收入倍数
          value: 125
        - label: 10x 收入倍数
          value: 150
        - label: 8x 收入倍数
          value: 187.5
        - label: 7x 收入倍数
          value: 214.3
      yAxis:
        label: 支撑 $1.5B 所需 ARR 或收入（USD M）
    approximationNotes: 这些数值用 $1.5B 除以各档倍数倒推出门槛；它们只是情景工具，不是 Omni 披露的指标。
    claimRefs:
      - CV029
      - CV044
      - CV045
      - CV046
      - CV047
      - CV048
      - CV049
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 证据质量越弱，能支撑的倍数区间会迅速收窄；这还没计入结构或集中度带来的下行。
    data:
      items:
        - label: 乐观情景支撑区间
          low: 15
          mid: 17
          high: 20
          detail: 只有 ARR 规模和留存已经显出溢价水平才成立
        - label: 基准情景支撑区间
          low: 10
          mid: 11
          high: 12
          detail: 假设增长真实，同时因不透明度和竞争压力计入明显折价
        - label: 悲观情景支撑区间
          low: 7
          mid: 8
          high: 9
          detail: 反映套件化压力
          weaker quality: null
          or a smaller hidden denominator: null
    approximationNotes: 图中展示的是可支撑的收入倍数区间，不是股权价值点估计；当前价格固定，但缺失的分母并未固定。
    claimRefs:
      - CV029
      - CV038
      - CV051
      - CV052
      - CV054
      - CV055
