      - number: '2.3'
        title: 买方、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Omni 的购买动作天然是多角色参与，这会同时影响 GTM 和市场规模测算。Microsoft 明确把 Power BI 卖给业务用户、 报告创建者和开发者；Tableau 则通过
              Creator、Explorer 和 Viewer 分层，面向分析师、高管、业务用户和其他角色。 Databricks metric views 可被 notebook、仪表盘、告警、Genie Spaces
              和外部 BI 工具查询，把平台工程和分析用户放进 同一工作流。Omni 的嵌入式分析页面进一步扩大买方地图，把受治理指标绑定到面向客户的产品体验、更快部署和溢价机会。 因此，付款方可能是经典自助部署里的 BI
              或数据负责人，也可能是语义层靠近数仓时的平台或数据工程负责人，或分析嵌入软件体验时的 产品 / 应用负责人。采用通常从窄试点开始，而不是企业级一次性铺开。Basedash 建议先集中一小组核心指标，再分阶段扩展；
              Promethium 则认为，把自助服务当作纯软件采购会制造混乱。实践中，Omni 赢在买方想复用同一套受治理模型，贯通内部 BI、 产品分析和 AI 工作流，而不是每个场景都用分散工具和指标定义。
