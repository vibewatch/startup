      - number: '6.3'
        title: 先落地后扩张动作与产品包装
        blocks:
          - type: paragraph
            body: >-
              Omni 客户故事最有吸引力的地方，是清晰可见的先落地再扩张逻辑。BambooHR 把分析能力当作可变现的产品档位，而不是后台仪表盘功能；ActiveProspect 将 Create Mode
              描述为面向高参与客户的高阶产品；Brevo 则称，嵌入式分析叠加 AI 和定制化，帮助客户转向高级档位。WorkRamp 和 SWBC 评估 Omni
              时，看的也不只是仪表盘，而是带品牌的客户侧分析能否成为自身产品包装里的差异化模块。Omni 的嵌入式分析页面进一步强化了这套商业化叙事：它明确承诺高阶定价机会、客户自助服务，以及可安全面向客户部署的
              AI。[CU005] [CU012] [CU017] [CU021] [CU023] [CU024]


              扩张路径也跨职能。Ordermentum 用同一个平台服务 SQL 用户、习惯电子表格的业务用户，以及自然语言 AI 工作流。Feeld 把财务和营销工作迁到同一套受治理层上；Checkr 和 Cribl 把
              Omni 当作支撑人工与 AI 分析的语义底座；SWBC 的上线故事则显示，产品、客户成功和高管用户都会在早期验证价值。换句话说，Omni
              常常不是靠增加仪表盘查看席位在一个客户内部扩张，而是横跨不同角色。风险在于，公开来源对扩张路径说得多，对已兑现的扩张数学说得少：没有一个审阅来源披露附加率、按同期群的席位增长、嵌入式与内部部署占比，或从早期试点续转为长期企业合同的比例。[CU019]
