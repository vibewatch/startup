      - number: '7.4'
        title: 客户质量不透明与执行能力风险
        blocks:
          - type: paragraph
            body: >-
              客户故事足以证明真实需求，但仍过于不透明，无法证明收入持久性。Omni 的公开案例集在部署速度和使用野心上很亮眼：BambooHR 很快推出 Elite analytics tier，并增长到 100,000+
              下游用户；Checkr 把 Omni 当作受治理的 AI 上下文层；更广泛的案例库强调迁移速度、支持和嵌入式价值。这些都是有用信号，因为它们说明产品已经进生产，并且能在战略上影响客户。但它们没有回答 $1.5B
              估值下最关键的问题：有多少客户续约？NRR 或 GRR 是多少？收入在少数旗舰 logo 中有多集中？有多少扩张来自内部 BI、嵌入式分析或 AI 工作流？


              执行风险自然来自这种不透明。语义层品类里，支持和上线是产品的一部分，因为价值取决于模型质量、权限、数据合同和买方教育。公开评论样本很薄，隐藏高级功能、仪表盘不稳定和文档滞后的混合投诉，也让人很难判断产品质量是否能在长尾账户中干净扩展，还是
              Omni 目前获胜的一部分原因在于团队对早期采用者异常手把手。这在增长阶段可管理，但当公司要在更大套件面前同时守住估值和品类领导地位时，问题会更实质。
