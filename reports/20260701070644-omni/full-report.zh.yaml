      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人故事是 Omni 最强的投资加分项之一。官方公司材料列出 Colin Zima、Jamie Davidson 和 Chris Merrick 为联合创始人；About 页面和投资人材料把
              Zima、Davidson 与 Looker、Google 相连，把 Merrick 与 Stitch、Talend 相连。这是 Omni 所攻赛道里真正的创始人-市场匹配。Zima 是公司对外代表，反复解释
              AI 为什么需要受治理的业务上下文。Davidson 以总裁身份出现，也是演示和公司页面里可见的产品建设者； Merrick 则在第三方公司资料中列为
              CTO。结果是一组三角领导层：技术可信，且直接匹配产品高度依赖架构的 价值主张。


              治理披露比创始人披露薄。公开材料清楚展示了创始人、当前招聘广度，以及至少一个具名董事会信号： 2022 年 Redpoint 合伙人 Tomasz Tunguz 称自己在领投 A 轮后加入 Omni
              董事会。除此之外，Omni 官方页面没有发布完整董事会名单、委员会结构或财务负责人梯队。第三方数据库提示可能还有其他独立董事，
              但这些信息没有得到官方治理页面佐证。尽调结论不应是治理薄弱，而应是治理透明度低于融资动能和产品叙事。 公司看起来仍以创始人为中心，Zima 的市场叙事和创始团队过往 BI 声誉构成关键人物集中。
