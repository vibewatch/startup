chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品与阶段
        blocks:
          - type: paragraph
            body: >-
              Omni 一贯把自己定位成 AI 分析平台，而不是单点 BI 插件。无论是官网首页、平台页、AI 文档， 还是 2026 年 4 月融资材料，核心承诺都一样：在原始数仓数据与下游用户或 Agent
              之间放入受治理语义模型， 把公司数据变成 AI 和分析都可信的事实来源。公司称，用户可以用自然语言提问，在工作簿里细化答案， 切换到 SQL 或电子表格式公式，再把同一套受治理逻辑复用到仪表盘、嵌入式分析、API
              和接入 MCP 的外部 AI 工具里。这个产品叙事很关键：Omni 卖的已不只是仪表盘替代品，而是 AI 时代数据解读的控制层。


              对一家私有基础设施创业公司而言，Omni 的公开身份也异常清晰。Omni 官方 About 页面称，创始人此前在 Looker、Google、Stitch 和 Talend 工作，2022
              年重新聚首；多份第三方资料则把总部放在旧金山。 同一批官方页面显示，公司运营足迹横跨旧金山、Santa Cruz、Philadelphia、Toronto、Dublin 和 Sydney，
              也与当前北美、欧洲和澳大利亚支持及销售岗位招聘相符。合并来看，证据支撑的是一家后期私营公司的身份： 创始人主导，面向企业客户，GTM 覆盖已经全球化，架构围绕语义层命题展开，管理层如今也明确把这套命题 绑定到
              AI Agent 的可靠性。
