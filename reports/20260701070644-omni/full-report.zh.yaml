      - number: '5.4'
        title: 治理、安全与变更管理
        blocks:
          - type: paragraph
            body: >-
              Omni 信任模型的最强公开证据很具体，不是愿景口号。内容设置可以强制 pull-request 发布、禁用有风险的文档动作，并限制低权限用户能做什么。 SQL 创建和 SQL
              结果可见性明确隔离到高权限角色；viewer 的工作簿访问则排除 SQL 标签页和 non-topic 标签页。运营侧，Omni 称其信息安全计划 由 CTO 负责审阅，每年接受 SOC 2 Type II
              审计，并通过最小权限、MFA、日志记录和可撤销支持访问执行。嵌入式部署使用签名 URL 加用户属性做 行级过滤；Snowflake Cortex 选项则把 AI 流量留在 Snowflake
              边界内，而不是把上下文送到单独供应商端点。变更管理也比许多 BI 同业更像软件开发： 模型分支、pull requests、YAML 模式和 checksum 冲突检测都写进文档界面，即便公开 CI/CD
              深度仍比完整 DevOps 操作手册轻。
