  - id: TE001
    title: 产品模块 / 资产矩阵
    columns:
      - 模块
      - 主要用户
      - 当前角色
      - 差异化
      - 尽调缺口
    rows:
      - - 共享语义模型
        - 数据和分析团队
        - 跨 BI 与 AI 复用的指标、关联和业务逻辑治理源
        - 同一个模型可在工作簿、API、MCP 和嵌入式界面复用
        - 公开文档没有给出完整语义语言参考，也没有正式 OSI 导出路线图
      - - 工作簿和仪表盘
        - 分析师和业务用户
        - 主要的自助分析与展示界面
        - 用户可在聊天、点选式操作、SQL 和已保存工作簿流程之间切换
        - 可视化深度的公开文档不如 Tableau 或 Power BI 等品类领导者清楚
      - - 电子表格 / 计算
        - 财务和运营用户
        - 工作簿内基于实时数据的 Excel 式分析
        - 连接实时数据的电子表格页面避免 CSV 导出，同时让公式贴近受治理数据
        - 纯电子表格逻辑无法提升回共享语义定义，部分电子表格功能也被有意省略
      - - Omni AI agent
        - 业务用户和分析师
        - 自然语言分析、摘要和多步问答
        - 先走语义查询的 AI，相比直接用原始表提示模型，更能守住定义一致性
        - 关于延迟、评测质量和失败案例的公开基准测试有限
      - - 嵌入式分析
        - 产品和平台团队
        - 面向客户的仪表盘、工作簿和 AI 工作流
        - 白标、行级隔离、API 和 MCP 都在同一套栈里
        - 运营规模上限和推出模式还需要更多公开细节
      - - API、MCP 和 Model IDE
        - 开发者和分析工程师
        - 程序化访问加代码式模型治理
        - REST 端点、MCP 认证模式、PR 发布和 YAML API，都指向软件工程式运营
        - 开发者工具仍在演进，插件废弃和代码库整合就是信号
    notes: 来源组合包括 Omni 产品页、技术文档、Holistics 和 TrustRadius；差异化字段只汇总公开证据。
