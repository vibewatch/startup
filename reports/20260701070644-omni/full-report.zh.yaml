companyProfile:
  summary: >-
    Omni 是一家总部位于旧金山的 AI 分析公司，由 Colin Zima、Jamie Davidson 和 Chris Merrick 于 2022 年创立， 三人的履历覆盖 Looker、Google、Stitch 和
    Talend。产品围绕一套受治理语义层展开，并把这套层复用到内部 BI、嵌入式分析、API、MCP 和 AI 工作流里，让团队在仪表盘和 Agent 之间守住同一套可信业务模型。发布以来， Omni 已从 $26.9M 的种子轮加
    A 轮融资推进到以 $1.5B 估值完成 $120M C 轮；公开牵引力信号包括 2025 年有 200+ 家公司使用平台，以及 BambooHR、Checkr、Cribl、dbt
    Labs、Mercury、Pendo、Synthesia 等具名客户。
