      - number: '4.4'
        title: 财务结论、情景与尽调阻塞点
        blocks:
          - type: paragraph
            body: >-
              公开结论是业务动能为正，财务信息仍不完整。Omni 看起来是一家真实的成长期软件公司：企业客户可信，产品扩张面多，迁移和部署证明快， 投资人愿意在一年多一点时间内把公司估值从 $650M 激进重定价到约
              $1.5B。最乐观的读法是，作为一家分析基础设施公司，Omni 已表现出 异常强的资本效率：ARR 快速增长，近期实现盈利，且产品证据显示嵌入式分析可以推动客户高级层级和更广工作流采用。


              谨慎情境同样关键。没有公开 ARR 分母，估值就无法转成可靠倍数。没有毛利率，就无法判断实施、支持、权限工程和大型仪表盘调优到底像轻量企业软件 开销，还是更重的服务层。没有烧钱或现金披露，已融资额只能说明
              Omni 拿得到钱，不能说明慢增长情境下能自我供血多久。因此，正确投资姿态应是 证据驱动且带条件：把披露增长、盈利评论和客户证明视为真实正面因素，但在收入质量、利润率路径、集中度和现金续航上保留明确缺口，而不是用
              SaaS 默认值填补。
