  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              界定 Omni 市场，最干净的方式不是把它归入通用商业智能软件，也不是把它看成独立语义层工具。Omni 自己的产品页 展示的是一个平台：团队可以定义并信任共享指标，在内部 BI
              使用这些指标，再把同一套受治理逻辑推到面向客户的分析里。 其语义层文章走得更远，把语义层框定为控制平面，决定仪表盘、notebook 和 AI 答案到底共享同一套业务定义，还是各自漂移。
              第三方品类来源也指向同一方向。AtScale 称语义层已从 BI 便利工具跨入关键 AI 基础设施，Futurum 称价值正从可视化仪表盘 迁移到逻辑指标库，Gartner 预测通用语义层到 2030
              年会成为关键基础设施。这意味着，这个支出池包括语义建模、 受治理指标、内部分析、嵌入式分析和 AI grounding 工作流；不包括原始数仓支出、通用数据集成、独立模型训练预算， 或没有受治理分析层的定制应用
              UI。因此，替代集合很宽：在位 BI 有 Power BI 和 Tableau，数仓原生语义有 Databricks 和 Snowflake，另有团队在没有共享业务模型的情况下直接采用 text-to-SQL
              来回答自然语言问题。
