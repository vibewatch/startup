  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模型、定价与变现
        blocks:
          - type: paragraph
            body: >-
              公开证据支持的是销售驱动的企业软件模型，带有多个扩张面，而不是单座席 BI 资费。Omni 自己的平台和嵌入式分析页面显示， 一套受治理语义层服务内部仪表盘、工作簿与电子表格工作流、面向客户的嵌入式分析、API
              与 MCP 式外部访问，以及 AI 查询。 这一点在财务上重要，因为它意味着合同价值可以跨部署类型扩张，而不必依赖单一仪表盘座席数。最强的变现证明不是已发布的 Omni
              价目表，因为审阅过的官方页面没有价目表。真正的证明来自客户包装证据。BambooHR 用 Omni 推出 Elite Analytics 层级， Omni
              自己的嵌入式分析页面也明确告诉潜在客户，他们可以创造新收入流和溢价机会。内部场景里，Omni 还把基于电子表格的财务工作流 卖给使用实时 ERP、CRM 和 HRIS 数据的团队，把产品表面拓展到 RevOps
              和财务报告。


              投资判断限制在于：标价缺失，但买方预算锚点不缺。Omni 官方页面对价格实现、折扣、模块门控，以及 AI 或嵌入式工作流是打包还是 单独变现仍不透明。相比之下，Microsoft 和 Tableau
              发布座席和套餐锚点，即便这些在位者不披露企业实际折扣，买方也可以用它们 对标 Omni。因此，财务读数很清楚：Omni 看起来通过高价值平台合同、嵌入式分析和工作流扩张变现，但公开记录仍无法说明起步价、
              平均合同价值或扩张机制到底是什么。
