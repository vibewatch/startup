      - number: '7.3'
        title: 法律、安全与平台依赖风险
        blocks:
          - type: paragraph
            body: >-
              在信任信号上，Omni 比许多年轻分析厂商位置更好，但公开法律与合规表面仍给买方留下功课。使用条款是标准的加州法管辖网站条款；隐私政策明确称，客户数据由合同而非公开政策约束；安全页面强调年度 SOC 2 Type
              II 审计和广泛合规声明；Trust Center 以及 CSA STAR 登记改善了采购观感。对于一个想成为企业数据语义和 AI 控制平面的产品，这些是真实缓释因素。它们不同于公开证明：每个企业部署都拥有成熟的
              DPA、子处理方姿态、支持访问边界、事件流程，或客户特定的行级权限与 agent 控制实施。


              依赖风险会叠加到法律和安全图景上。Omni 依赖 AWS 基础设施、集中式认证和客户侧权限设计，同时还试图通过 MCP 桥接 dbt、Snowflake semantic views、Databricks
              metric views、嵌入式应用和外部 AI 客户端。这套桥接策略在战略上聪明，但每多一座桥，就多一个可能因上线质量、兼容性漂移或上游厂商产品动作而削弱 Omni
              端到端体验控制力的环节。对欧洲以及监管更强的买方来说，AI Act 和 NIST 风格的可信 AI 预期，也会提高透明度、监控和成文控制的门槛，尤其是围绕 AI 辅助答案如何生成和审查。
