  - id: TP001
    title: 竞争对手画像表
    columns:
      - 竞争对手 / 类别
      - 品类
      - 规模 / 分发信号
      - 目标细分市场
      - 差异化
      - 关键限制
    rows:
      - - Omni
        - 统一语义 BI + 嵌入式 + AI 分析
        - 私营 AI 分析厂商，近期大额私募融资已在第 1 章背景中披露
        - 现代数据团队、产品团队，以及希望一个受治理模型贯穿 BI 和 AI 的企业
        - 一个受治理模型可复用于 BI、嵌入、API、MCP 和 AI 助手
        - 私有定价和有限公开赢单 / 输单证据，让商业耐久性仍缺一部分验证
      - - Looker
        - 既有云 BI + 语义层
        - Google Cloud 分发能力和既有 BigQuery / IAM 足迹
        - 已靠近 Google Cloud 的企业内部 BI 和嵌入式分析买方
        - LookML 语义层、嵌入式 API、智能体式 BI 叙事、强云安全姿态
        - 定价多由销售主导，且常嵌在更大的 Google 合同里，而不是清晰的独立采购决策
      - - Tableau
        - 以可视化为主的既有 BI
        - 庞大的 Salesforce 装机基础和成熟企业分析足迹
        - 重视可视化广度和受治理报告的数据与业务团队
        - 强可视化、广泛按角色授权，以及新的 Tableau Next / 语义层路径
        - 规模化后成本高，产品组合 / 套装结构复杂
      - - Power BI
        - 既有捆绑式 BI 平台
        - 通过 Fabric、Azure 和 M365 获得巨大的 Microsoft 分发
        - 已在 Microsoft 身份和生产力技术栈上标准化的组织
        - 免费 / 低成本入口、Fabric 集成、嵌入路径和 Copilot 路线图
        - AI 和免许可共享往往需要更高容量 SKU；产品复杂度仍是常见抱怨
      - - Sigma
        - 数仓原生协作 BI / AI 应用
        - 企业 SaaS，定位于实时数仓，并强调强合规
        - 希望用类电子表格探索和受治理 AI 应用的云数据仓库客户
        - 实时查询架构、受治理数据模型、嵌入式分析和面向动作的 AI 应用叙事
        - 公开定价仍由销售主导，仪表盘向应用迁移的价值还需要销售说服
      - - Hex
        - 笔记本 + 应用 + 智能体分析
        - 在技术用户中有强心智，计算和协作模型灵活
        - 希望在一个界面里同时使用笔记本和应用的分析工程师、分析师和产品团队
        - 结合笔记本、数据应用、智能体、Slack/MCP 和可复用语义组件
        - 对经典仪表盘重资产团队来说，不太像标准化的广义既有 BI 替代品
      - - ThoughtSpot
        - 搜索优先的企业 BI / AI 分析师
        - 成熟企业分析品牌，自助式搜索定位很强
        - 希望规模化使用搜索和对话式分析的大型企业
        - Spotter AI、关系型搜索、liveboards 和语义模型训练闭环
        - 评论证据显示，可视化灵活性和定价可能落后于 Power BI 或 Tableau 预期
      - - Metabase
        - 开源 BI 和嵌入式替代方案
        - 开源和自托管入口，配简单 SaaS 向上销售
        - 追求成本和速度的初创公司、中小企业和工程主导团队
        - 低初始现金成本、嵌入、SQL 逃生口，以及基础语义层 / AI 功能
        - 企业深度功能和大规模性能弱于高端平台
      - - Cube
        - 开放语义层 + BI / 嵌入式分析
        - 开源语义核心，配自助和订单式包装
        - 构建面向客户分析的数据平台团队和 SaaS 厂商
        - 代码优先语义层、Semantic SQL、API、缓存，以及可供智能体使用的模型抽象
        - 团队必须接受语义层架构，而不是更简单的纯仪表盘工具
      - - AtScale
        - 通用语义层专家
        - 面向主流 BI 工具和 AI 智能体的企业语义基础设施定位
        - 希望在不移动数据的前提下复用语义的大型企业
        - 无需搬动数据的通用语义层、受治理指标、CI/CD，以及 AI/BI 互操作
        - 公开定价和广泛 SMB 式自助证据有限
      - - dbt Semantic Layer（语义层）
        - 分析工程语义层
        - dbt 生态分发，加上明确的查询指标包装
        - 以 dbt 为中心、为报告、应用和 AI 工作流标准化指标的团队
        - 指标定义贴近分析工程工作流，并可供多种下游界面使用
        - 它是语义基础，不是完整的一方 BI 前端
      - - 数仓原生 + 内部自建
        - Snowflake / Databricks 语义能力，加上 Metabase 或自定义 UI
        - 从既有数仓和工程支出中拉预算
        - 已在数仓、笔记本或自定义产品界面上标准化的团队
        - 业务逻辑贴近数据，也可搭配既有 BI 或定制应用层
        - 需要更多内部工程，且打包体验比 Omni 更缺少明确产品主张
    notes: 覆盖面有意保持部分但足够宽：纳入点名的直接同业、既有巨头、语义层邻近玩家，以及在审查过的 2026 年来源集中可见、最现实的数仓原生或内部自建替代方案。
    enumerationScope:
