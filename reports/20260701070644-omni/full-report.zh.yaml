      - number: '8.4'
        title: 建议与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              本章结论应对估值敏感，而不是无视公司质量。Omni 看起来是一家严肃的后期分析公司：客户证据真实，面向 AI 的语义层架构可信，也有足够效率信号支持继续关注。乐观情景很直接：如果隐藏的 ARR
              分母已经足够大，如果嵌入式和 AI 工作流变现顺畅，如果留存和集中度健康，那么 Series C 事后看可能合理，甚至聪明。反面论点也同样直接：如果未披露的 ARR
              基数仍不大，如果价格兑现弱于叙事，或者买方越来越接受仓库原生的打包语义层，那么公司的定价可能已经包含了超过证据所能支持的确定性。

              因此，正确结论是继续跟踪，而不是买入。公开证据足以说明估值可信，但不足以说明它明显有吸引力。承销价格前的尽调负担是机械性的，不是哲学性的：绝对 ARR、NRR 或
              GRR、毛利率、客户集中度、现金消耗和资金续航期、合同类型，以及 Series C 经济条款的精确细节。如果这些指标显示，公司已经超过约 $100M
              ARR，且业务高质量、可扩展、留存强，判断可以上调。否则，倍数支撑会很快压缩。在那之前，对当前估值最公平的描述是合理到偏紧；来自不透明的下行空间，大于单靠叙事带来的上行空间。
