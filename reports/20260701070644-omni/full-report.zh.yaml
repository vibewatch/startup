  - id: TE002
    title: 工作流 / 使用场景表
    columns:
      - 用户任务
      - 当前工作流
      - Omni 路径
      - 可衡量或结构性收益
      - 已知限制
    rows:
      - - 业务用户提问
        - 先从聊天开始，再检查结果
        - Omni Agent 或 Workbook Agent 生成建模查询和工作簿输出
        - 让答案绑定受治理定义和可见 SQL
        - 信任仍取决于模型质量和权限设计
      - - 分析师做 ad hoc 分析
        - 使用带字段选择器或 SQL 的工作簿标签页
        - 在点选式操作、Omni SQL 和直接 SQL 标签页之间切换
        - 减少单一分析界面内的工具切换
        - 直接 SQL 标签页绕过共享模型
      - - 财务或运营用户想在实时数据上使用 Excel 式逻辑
        - 把工作簿查询连接到电子表格标签页
        - 在 Omni 内使用公式、导入和受保护的查询页面
        - 避免 CSV 导出，并保留到查询输出的实时链接
        - 没有数据透视表或表内图表，纯电子表格数据仍留在本地
      - - 产品团队发布客户分析
        - 用属性和行级过滤创建签名嵌入 URL
        - 使用 iframe 嵌入、品牌化和 API
        - 同一个语义层可支撑内部和外部分析
        - 公开文档谈设置机制多，谈硬性规模上限少
      - - 外部 AI 客户端需要受治理答案
        - 通过 MCP 用 OAuth 或 API key 连接
        - 使用 MCP 工具执行查询和长时间运行的 askOmni 任务
        - 团队可在 Claude、Cursor 或其他客户端复用语义治理
        - 外部工具的数据处理仍取决于与 MCP 配套使用的宿主 AI 工具
