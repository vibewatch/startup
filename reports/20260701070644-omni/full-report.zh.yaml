    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 绝对 ARR 或收入年化额
        - 当前经常性收入基数，以及从引用增长率推回的桥
        - 没有分母，就无法干净判断公开估值
        - CFO 资料室或董事会材料
      - - 留存
        - 按队列和产品拆分的 NRR 或 GRR
        - 只有增长质量可持续，溢价倍数才站得住
        - 队列留存包和续约分析
      - - 客户集中度
        - 头部客户和重嵌入型客户的收入结构
        - 有知名客户有帮助，但若一两个客户主导 ARR，仍远远不够
        - 客户集中度明细表
      - - 毛利率
        - 托管或支持负担，以及服务收入结构
        - 需要借此判断 Omni 更像优质软件，还是更重的实施工具
        - 经审计 P&L 加分部备注
      - - 合同类型与实际成交价
        - ACV 区间、折扣、模块附加率和期限结构
        - 以报价为主的定价，可能同时藏住上行和压力
        - 销售运营和采购样本合同
      - - Series C 轮证券条款
        - 清算优先权、参与权及其他结构性保护
        - 头条估值质量可能偏离普通股经济性
        - 融资律师和股权结构表审查
      - - 现金消耗与资金续航期
        - 当前现金余额，以及基准到下行情形的融资需求
        - 仅有盈利表述，不能证明公司能持续自我供血
        - 资金预测和董事会运营计划
    notes: 这些问题就是目前缺失的指标和证据缺口；它们让我们今天无法给出更强推荐。
