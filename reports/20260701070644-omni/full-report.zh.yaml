      - CP025
      - CP029
      - CP030
      - CP034
      - CP036
      - CP039
  - id: TP005
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 支持证据
      - 主要威胁
      - 严重度
      - 可能失效的原因
      - 尽调追问
    rows:
      - - BI、嵌入式和 AI 共用统一模型
        - Omni 产品和文档显示，一个受治理界面可在三类场景中复用
        - 既有厂商把同样层级加进更大的套件
        - 高
        - Looker、Tableau Next、Power BI/Fabric 和 ThoughtSpot 已在营销中强调智能体能力和语义覆盖宽度
        - 按替换目标和部署范围索取近期竞争胜负记录
      - - 基于语义的 AI 信任
        - Omni 和许多对手如今都把语义层说成可信 AI 的控制平面
        - 叙事商品化
        - 高
        - Databricks、Snowflake、AtScale、Cube、dbt 和既有厂商都使用类似的可信语义话术
        - 要求提供相较传统 BI 和仓库原生替代方案的答案质量或采用率增量实测
      - - 嵌入式分析作为粘性楔子
        - Omni、Cube、Metabase、Hex、Looker 和 Power BI 都提供嵌入路径
        - 嵌入式成为标配
        - 中
        - API 和 iframe 交付已经常见，因此分发和落地速度比是否有嵌入功能本身更重要
        - 索取嵌入式客户相对内部纯 BI 客户的附加率和续约数据
      - - 企业级信任 / 合规姿态
        - Omni 有可信的安全页面和功能清单
        - 云平台既有厂商继承更大的合规生态
        - 中
        - 当每个入围工具都有强控制时，安全就成了必要条件，而不是差异点
        - 询问买家，Omni 相比 Microsoft、Google 和 Salesforce 具体赢下或输掉哪些合规异议
      - - 仓库中立的灵活性
        - Omni 位于仓库数据之上，避免强推仓库原生锁定
        - 仓库原生语义降低了另加一层的必要性
        - 高
        - Databricks metric views 和 Snowflake semantic views 把逻辑留得更贴近数据，同时仍服务外部工具
        - 索取从 Databricks 或 Snowflake 标准化账户迁出的证据
      - - 替换既有仪表盘的成本
        - 评论证据显示，既有厂商可能成本高或体验差
        - 既有用户仍可能因分发和熟悉度而忍痛继续使用
        - 中
        - 如果技术栈已经付费并受治理，糟糕 UX 很少单独触发迁移
        - 索取相对 Power BI 和 Tableau 替换项目的价值达成时间与重建速度证据
      - - 现状下内部自建对多数买家太难
        - Metabase 加仓库原生语义，比购买 Omni 需要更多工程投入
        - 工程能力强的买家可能更偏好较低现金支出
        - 中
        - 对技术团队来说，内部自建第一年可能足够好且更便宜
        - 索取 Omni 在总成本和落地风险上击败 Metabase / 自定义构建的客户画像
      - - 执行护城河
        - 公开证据支持真实楔子，但不足以证明决定性锁定
        - 未能把产品宽度转化为可重复的商业胜利
        - 高
        - 公开语料缺少许多新 AI 功能的实际定价、迁移摩擦和使用深度数据
        - 优先尽调实际定价、切换成本、产品采用，以及按部署类型拆分的扩张
    notes: 严重度反映对持久定价权和替换经济性的风险，而不是对品类存在本身的风险；本表强调最直接削弱或支撑长期防御力的证据。
