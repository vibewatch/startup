  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户细分与部署原型
        blocks:
          - type: paragraph
            body: >-
              Omni 的公开客户集合没有集中在单一买方画像或单一部署风格。最强的重复模式是，数据、分析或产品负责人购买一层受治理分析层， 同时服务内部团队和下游终端用户。ActiveProspect
              明确想要一个平台，同时支撑嵌入式分析和内部 BI；Brevo 把五套内部 BI 工具和面向客户的报告 合并起来；SWBC 则把 Omni
              评估为一个可服务内部和客户报告的平台。产品和数据团队也共同出现在购买动作里：BambooHR 把分析包装成产品层级决策， WorkRamp 为数千外部用户优化且不允许停机，Checkr 和 Cribl 则把
              Omni 用作内部自助服务的受治理 AI 与分析基础。Logo 集横跨 HR 软件、 营销自动化、安全、背景调查、酒店订餐、消费应用和电商；投资人和媒体来源还补充了
              Perplexity、Writer、BuzzFeed、Mercury、Pendo 和 Guitar Center 等更广名称。[CU002] [CU006] [CU010] [CU011] [CU015]
              [CU016] [CU020] [CU021] [CU023] [CU027] [CU028] [CU031] [CU032] [CU033] [CU034]


              因此，实际细分是三分法，而不是二分法。第一类是内部 BI 部署，围绕自助服务、受治理指标和面向业务团队的 AI 辅助分析展开， Caraway、Feeld、Cribl 和 Checkr
              都是例子。第二类是混合部署，同一语义层同时支持内部用户和面向客户的分析，ActiveProspect、Brevo、 Ordermentum 和 SWBC
              最清楚地展示了这一路径。第三类是嵌入式优先或产品驱动部署，分析成为客户自有产品体验的一部分，BambooHR 和 WorkRamp 体现了这一点。这种组合很重要，因为它意味着 Omni
