  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 结构性压力和执行失误都会传导为扩张放慢、支持负担加重和估值压缩。
    data:
      nodes:
        - id: bundle
          label: 套件挤压
          detail: 原生语义和 AI 功能在更大套件内部扩张。
        - id: accuracy
          label: AI 准确性缺口
          detail: 运行时质量的公开证据弱于架构主张。
        - id: config
          label: 配置复杂度
          detail: 权限、SQL 路径、电子表格和 MCP 设置都需要严格管控。
        - id: disclosure
          label: 披露偏薄
          detail: 留存、集中度和单位经济分母仍未公开。
        - id: quality
          label: 质量摩擦
          detail: 延迟、崩溃、文档和图表深度投诉拖慢信任建立。
        - id: expansion
          label: 扩张放慢
          detail: 信任或差异化变弱时，先落地再扩张的打法会走弱。
        - id: support
          label: 支持负担加重
          detail: 手把手落地和故障排查会吞噬利润率和管理层注意力。
        - id: valuation
          label: 估值压缩
          detail: 如果增长质量或差异化低于预期，溢价倍数会收窄。
      edges:
        - from: bundle
          to: expansion
          label: 压缩赢面
        - from: accuracy
          to: expansion
          label: 削弱信任
        - from: config
          to: quality
          label: 制造
        - from: quality
          to: support
          label: 抬高
        - from: disclosure
          to: valuation
          label: 压低确信度
        - from: expansion
          to: valuation
          label: 传导
        - from: support
          to: valuation
          label: 施压
        - from: config
          to: accuracy
          label: 可能加重
        - from: quality
          to: expansion
          label: 拖慢
        - from: bundle
          to: valuation
          label: 压缩倍数
    approximationNotes: null
    claimRefs:
      - CR006
      - CR007
      - CR008
      - CR009
      - CR022
      - CR023
      - CR038
      - CR040
      - CR041
      - CR043
