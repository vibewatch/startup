    title: 投资假设失效与止损触发因素表
    columns:
      - 触发因素
      - 阈值或事件
      - 对投资假设的传导
      - 行动含义
    rows:
      - - ARR 分母不及预期
        - 披露的 ARR 明显低于约 $100M
        - 当前溢价区间会下移到低得多的支撑区
        - 按基准或悲观情形重切模型，避免激进入场
      - - 留存或集中度偏弱
        - NRR 或 GRR 偏弱，或收入集中在少数客户
        - 客户背书不再转化为可持续的估值质量
        - 下调倍数，并要求队列级证据
      - - 优先权过重的融资条款
        - Series C 轮经济条款明显偏向优先股持有人，或嵌入标题看不出的保护
        - 头条估值高估了普通股权益质量
        - 以股权结构表重新测算，而不是按新闻稿下结论
      - - 买方接受捆绑方案
        - 赢单 / 输单数据显示，Snowflake、Databricks、dbt 或 Microsoft 的原生方案往往够用
        - 稀缺性溢价被侵蚀，定价权被压缩
        - 对倍数做结构性折价
      - - 产品成熟度拖累
        - 客户规模扩大后，大型仪表盘卡顿、功能缺口或文档欠账仍未消失
        - 落地摩擦增加，会削弱优质软件属性
        - 在证据改善前，坚持更低入场价和更强纪律
    notes: 这些触发因素把折价逻辑落到运营动作上，而不是把估值争论简化成一个是 / 否判断。
