  - id: TP004
    title: 切换成本 / 多归属表
    columns:
      - 层级
      - 粘性来源
      - 仍可多归属的部分
      - 证据信号
      - 对 Omni 的含义
    rows:
      - - 语义模型
        - 指标定义、连接关系、权限和业务词汇会沉淀机构知识
        - 迁移时，外部 BI 工具和应用通常可以指向同一语义层或新语义层
        - Cube、dbt、Databricks 和 Snowflake 都描述可复用的受治理定义，而不是单体前端
        - 拿下语义层有帮助，但不会自动锁住整套分析栈
      - - 仪表盘 / 工作簿 / 实时看板
        - 报表逻辑、筛选器、告警和用户习惯重建起来很费事
        - 过渡期团队仍可并行运行多个 BI 前端
        - Metabase 文档、ThoughtSpot、Tableau 和 Power BI 都默认仪表盘与报表工作流会持续存在
        - 替换式销售会遇到迁移阻力，但不是无法突破的技术锁定
      - - 嵌入式分析
        - 面向客户的报表、品牌化和权限映射重做成本高
        - API 和 iframe 让部分买家无需整体重写就能试用替代方案
        - Omni、Looker、Power BI、Metabase、Hex 和 Cube 都提供嵌入路径
        - 相比纯 BI 场景，嵌入式部署最有机会给 Omni 带来更强的运营粘性
      - - AI / 聊天体验
        - 提示词模式、信任调校和模型上下文会随使用改进
        - 助手层可能比仪表盘或仓库迁移跑得更快
        - Omni、Looker、Power BI、ThoughtSpot、Hex、Cube、Snowflake 和 Databricks 都在推自然语言分析
        - AI 界面正变得足够可迁移，速度和信任比新奇感更重要
      - - 身份 / 治理集成
        - SAML、群组映射、行级规则和审计预期会压低轻率换工具的意愿
        - 既有云身份体系仍可很快扩展到新应用
        - Omni、Hex、ThoughtSpot、Metabase、Microsoft 和 Google 都强调治理挂钩
        - 身份与合规已经集中化的地方，既有厂商保留优势
      - - 仓库原生语义 + 内部自建
        - 把定义留在仓库里，可以尽量减少新的活动部件
        - Metabase 这类轻量前端可以被替换或叠加
        - Databricks 和 Snowflake 都把语义向外开放给外部 BI 工具；Metabase 和自定义应用可以坐在其上
        - 这是现金支出最低、最干净的多归属路径，也是 Omni 最清晰的中期护城河威胁
    notes: 表格关注运营粘性，而不是法律合同锁定；迁移工作量真实存在，但 2026 年来源组反复显示，买家可以把语义、BI 和应用层混搭。
    claimRefs:
