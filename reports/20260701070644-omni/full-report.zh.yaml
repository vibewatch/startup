      - number: '1.3'
        title: 融资历史、牵引力与利益相关方
        blocks:
          - type: paragraph
            body: >-
              Omni 的融资节奏明显加速。2022 年 8 月发布公告披露 $26.9M 融资，包括 Redpoint 领投的 $17.5M A 轮和 First Round 领投的 $9.4M 种子轮，GV、Box
              Group、Quiet、Scribble 以及 100 多位天使 参与。到 2025 年 3 月，ICONIQ 公开以 B 轮领投方身份站台，称平台采用强劲，并已有 200 多家公司 使用。一年后，Omni
              宣布以 $1.5B 估值完成 $120M C 轮，由 ICONIQ 领投，Theory Ventures、First Round Capital、Redpoint Ventures 和 GV 跟投，另有 $30M
              员工股份要约交易。第三方融资数据库显示， 公司已披露生命周期融资到 2026 年 4 月约达 $236M，并把上一轮估值放在 2025 年 3 月的 $650M，意味着 本轮估值大幅上调。


              尽管公司不披露绝对 ARR 基数，牵引力披露仍方向性很强。C 轮材料称 ARR 上一年增长 4x， Business Wire 则称在此前 4x 增长之后，年初至今收入又增长三倍。Fortune 2026 年 4
              月报道还补充， Omni 在本轮融资前一个月实现盈利，员工约 200 人。客户证明异常具体：Omni 及其投资人点名 BambooHR、 Checkr、Cribl、dbt Labs、Guitar
              Center、Heidi AI、Mercury、Pendo、Synthesia、Perplexity、Writer 和 BuzzFeed；客户页面还量化迁移速度、仪表盘重建和部署规模。资本结构、客户 logo
              和参考架构合在一起， 支撑的是真正的后期企业软件轨迹，而不是纯叙事型 AI 融资。
