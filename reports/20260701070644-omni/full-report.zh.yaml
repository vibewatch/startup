  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 结构性市场压力与估值风险
        blocks:
          - type: paragraph
            body: >-
              Omni 最难处理的风险是结构性的：催生受治理语义层需求的同一股品类浪潮，也让更大的平台吸收更多价值。Snowflake 现在把语义概念直接存进数据库级 semantic views，并输入 Cortex
              Analyst；Databricks 把集中式 metric views 放进 Unity Catalog，并让它们流入 Genie、仪表盘、告警和外部 BI 工具；dbt 将一套语义层用于指标、嵌入式应用和
              AI 工作流；Microsoft 则把 Copilot 打包进 Fabric 和 Power BI 容量控制，而许多企业已经购买这些授权。Cube、Holistics 和 Labs4Change
              的独立比较页都指向同一种压力：语义治理和 AI 安全指标本身已经不再是小众切入口。在较简单的单仓库部署里，原生或已经付费的技术栈即便架构不如 Omni 干净，也可能足够好。


              这种结构性压力更重要，因为 Omni 现在背负的是后期估值，假设公司能成为品类领导者并持续扩张，而不只是有产品新意。2026 年 4 月，公司以 $1.5B
              估值融资，同时给出强劲增长说法；但公开分母仍很薄：没有经审计公开 P&L，没有公开毛利率曲线，没有披露 NRR 或流失 cohort，也没有清晰集中度披露。投资者承销的不只是 Omni
              能否赢，而是它能否赢得足够快、足够持久，在品类商品化前跑赢被打包的竞争。
