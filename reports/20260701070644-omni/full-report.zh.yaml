      - - Omni 官方产品页
        - 无公开标价
        - 实际成交价未知
        - 语义模型、仪表盘、嵌入式分析、AI、电子表格、API
        - 席位数、模块闸门、期限和折扣未披露
        - Omni 似乎靠企业 ROI 销售，而不是透明价目表
      - - BambooHR Elite 层级案例研究
        - 客户推出更高阶分析层级，但 Omni 抽成率未公开
        - 客户变现信号，不是厂商标价
        - 嵌入式分析、自助报告、权限、定制
        - BambooHR 如何为该功能定价、Omni 捕获多少，均无公开拆分
        - 说明 Omni 能支撑可向上销售的产品包装，即便自身费率表仍不公开
      - - Microsoft Power BI 定价
        - Free；Pro $14/user/month；Premium Per User $24/user/month；部分免许可证分享需要更高容量
        - 公开标价锚点
        - 既有 BI 席位，叠加容量与分享模型
        - 企业容量支出和真实折扣仍会变化
        - 提供低端既有预算锚点，Omni 必须相对它证明更高 ROI
      - - Tableau 定价
        - Viewer $15；Explorer $42；Creator $75/user/month；Cloud+ 和 Tableau+ 联系销售
        - 公开标价加套餐信号
        - 按角色分析，叠加高端智能体化套餐
        - 企业套餐定价和折扣仍不透明
        - 说明买家即便面对定制化高级套餐，也能用已知席位经济性来对标 Omni
      - - Omni 财务工作流博客
        - 无公开 SKU 价格
        - 仅是扩张界面信号
        - 实时电子表格建模、ARR 报告、月度报告
        - 未披露电子表格是否提升 ACV 或需要高级包装
        - 暗示 Omni 可以把钱包份额扩到财务，但未公开证明实际变现
      - - 案例研究 ROI 叙事
        - 更快上线、工程节省和工具关停，而不是公开厂商标价
        - 结果代理，不是价格
        - 迁移速度、整合、产品差异化、自助服务
        - 无法直接换算为毛利或回本周期
        - 商业故事由价值驱动，必须在合同层面尽调检验
    notes: 本表把公开标价锚点与价值证明分开，避免把客户 ROI 误当成 Omni 的实际收入或利润率。
