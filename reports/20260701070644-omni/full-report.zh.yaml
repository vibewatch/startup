      - number: '7.5'
        title: 缓释因素、监控指标与投资论点破裂触发点
        blocks:
          - type: paragraph
            body: >-
              好消息是，Omni 的风险并非无边界，公开缓释因素也实在。产品围绕受治理定义构建，而不是自由式提示；权限颗粒度细；客户案例显示平台可以支撑真实的分析产品；安全姿态强于典型早期创业公司。公司看起来也清楚自己要解决的
              AI 问题：无论自家话术还是 Checkr 案例，都强调上下文、权限和测试闭环比模型本身的聪明程度更重要。这是正确的概念基础。


              承销挑战在于，最强的缓释因素主要降低执行风险，而不是消除结构性风险。如果被打包的在位厂商持续改进，如果公开持久性数据仍然很薄，或者 AI
              运行时质量无法被清晰衡量，单靠架构救不了投资论点。因此，正确的尽调回应应是事件驱动：要求续约和集中度数据，索取 AI
              评估评分卡，检查事故和支持指标，并测试如果买方标准化到单一厂商栈，客户价值还能保留多少。这些信号能区分一个差异化控制平面和一个强但可替代的产品叙事。
