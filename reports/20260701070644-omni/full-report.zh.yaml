      - number: '4.2'
        title: 牵引力与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              Omni 更愿意披露方向性牵引力，而不是绝对规模。2025 年 3 月 B 轮材料称，收入和客户使用量同比都增长 8x，已有 200 多家公司使用平台。2026 年 4 月 C
              轮材料随后从使用量语言转向财务语言，称收入同比增长 4x；Yahoo 转载的 Fortune 报道称 ARR 近乎四倍增长，Omni 在上月实现盈利，员工约 200
              人。这些信号有意义，因为它们指向一家在没有披露庞大员工队伍的情况下 快速扩张的公司。但它们仍不完整，因为分母缺席：没有公开 ARR 基数、没有 TTM 收入、没有 NRR、没有毛利率，也没有 CAC 回收期。


              因此，客户部署是判断单位经济和销售效率的最佳代理指标。BambooHR 四个月内把一个新分析层级推给 30,000+ 人，之后扩到 100,000+ 人，直接把 Omni 绑定到可加售的嵌入式产品。Cribl
              五周内重建约 100 个仪表盘，三个月内完成迁移，并提到迁移 CSAT 接近 89， 且至少一名用户每月节省 15 小时。Guitar Center 替换 150+ 个仪表盘，并在六个月内关闭
              Tableau；Synthesia 则用 Omni 在不到三个月内 加速预测和自助服务。这些案例支撑的是快速价值兑现和整合故事。但负面证据也重要：AWS Marketplace 同步的评论提到学习曲线、
              大型仪表盘卡顿、缺少图表类型、偶发不稳定和文档滞后。这意味着，Omni 的部署经济性在业务价值上可能优于传统 BI，但仍带有不可忽视的 支持和导入成本，公开材料没有量化这些成本。
