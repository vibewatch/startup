      - number: '8.2'
        title: 可比背景、定价与打包风险
        blocks:
          - type: paragraph
            body: >-
              Omni 的估值论证必须同时放在变现证据和品类拥挤度下看。正面看，Omni 展示的是一个横跨内部分析、受治理指标、客户侧分析和 AI
              工作流的平台。其嵌入式分析页面明确称，客户可以创造新收入流和高阶定价机会；这很重要，因为它意味着产品能支撑平台型合同，而不是狭窄的仪表盘席位销售。Vendr 的 2026 年定价摘要也显示，Omni
              的定价更像企业软件，而不是轻量自助式 BI：席位、分层、合同期限和部署形态都会影响价格，企业定价仍需询价。

              负面看，定价不透明和打包风险都真实存在。Microsoft、Tableau 和 ThoughtSpot 都发布官方定价页面，而 Omni
              的公开页面没有披露可比的企业价目表。更重要的是，语义层市场已经不稀缺。Basedash、Atlan 和 TypeDef AI 都描述了一个拥有多种可行路径的 2026
              年格局；Snowflake、Databricks 和 dbt 也各自营销原生或紧密集成的语义层能力。Snowflake 现在把业务概念直接存进 Semantic Views，Databricks 通过 Unity
              Catalog metric views 治理标准化指标，dbt 则销售一次定义、跨工具复用的指标层。这并不意味着 Omni 没有差异化；其嵌入式和 AI 定位是真实的。但它意味着投资者不应像受治理指标和 AI
              安全语义只有一家供应商能提供那样，支付稀缺性溢价。

              公开市场背景也强化同一谨慎结论。Multiples.vc 称，2026 年 6 月软件估值高度分化，并深受 AI 相关性和技术深度影响；PublicComps 和 BVP Emerging Cloud Index
              更像动态基准，而不是单一数字答案。Datadog 的 2026 年 Q1 业绩，以及 Datadog、Snowflake、MongoDB、Confluent 和 Cloudflare 在 2026 年 7
              月的市值快照，清楚显示了规模错配：最佳公开分析和数据平台可比公司都比 Omni 大得多、披露更多、业务更多元。它们适合设定合理边界条件，但不能用来假装 Omni 在没有私营公司不透明折价的情况下就该拿同样倍数。
