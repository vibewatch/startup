        title: 资本充足性、融资与估值信号
        blocks:
          - type: paragraph
            body: >-
              资本故事方向性强，但不完整。Omni 的公开融资路径从 2022 年发布时披露的 $26.9M，推进到 2025 年 3 月以 $650M 估值完成 $69M B 轮，再到 2026 年 4 月以 $1.5B
              估值完成 $120M C 轮，并伴随 $30M 员工股份要约交易。这个台阶足够大， 在财务上值得重视：它说明投资人看到的是品类动能和公司特定执行，而不只是泛 AI 热情。官方和转载报道也一致认为，2026
              年这一轮融资 由快速收入增长和企业采用增加支撑；Yahoo 转载的 Fortune 版本还补充了融资前刚实现盈利的里程碑。


              公开证据仍无法让投资人完整判断经典资本充足性。没有审阅来源披露账上现金、月度烧钱、基准情境现金续航、风险债， 或任何类债务义务。募资用途只以高层次语言描述为扩展 AI
              分析平台和企业采用，而不是详细预算。这并不意味着 Omni 资本不足。 鉴于 2025-2026 年已披露一级资本在更早轮次之前就有 $189M，它大概率并不缺钱。正确解读是：Omni 拥有充足的头部融资支持，
              但公开资产负债表细节不足，无法建模下一轮时间、下行情境现金续航，或增长正常化时有多少估值保护。
