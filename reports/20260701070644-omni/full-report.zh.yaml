  - id: TP003
    title: 定价 / 包装对比
    columns:
      - 厂商 / 类别
      - 公开定价信号
      - 合同模式
      - 包含 / 门槛能力
      - 未知项
      - 含义
    rows:
      - - Omni
        - 保留来源中没有公开标价
        - 销售主导的企业软件
        - 统一语义 BI、嵌入、API、MCP、AI 分析
        - 实际价格、折扣和扩张机制均为私有
        - Omni 必须靠 ROI 和技术栈简化取胜，而不是靠入门价透明
      - - Looker
        - 联系销售；版本包含用户和 API 配额
        - 年度订阅，平台 + 用户定价
        - Standard、Enterprise 和 Embed 版本；对话 token 配额和超额费用
        - 实际版本定价和折扣不公开
        - 适合大客户，但不透明定价会加剧套装 / 对比压力
      - - Tableau
        - Viewer $15、Explorer $42、Creator $75，按月计费、按年付费；Cloud+ / Tableau+ 联系销售
        - 按角色计费席位，加套餐升级
        - 传统 BI 席位仍有标价，智能体能力则被放进更高阶套餐
        - 企业实际成交价、站点数量和数据积分经济账都不透明
        - 强但贵的组合逻辑会偏向既有厂商，而不是从零部署的简单方案
      - - Power BI
        - Free、Pro $14、Premium Per User $24，嵌入式价格浮动
        - 按用户收费，叠加 Fabric / Premium 容量
        - 入门成本低、分享范围广，但部分 AI / 免许可证场景需要更高 SKU
        - 实际 Fabric 容量支出取决于规模和工作负载组合
        - 在 Microsoft 占主导的客户里，这是 Omni 最尖锐的商业套餐威胁
      - - Sigma
        - 公开页面导向联系销售，而不是给出标价
        - 销售主导的企业合同
        - AI 应用、仓库原生 BI、治理和嵌入能力打包成一个平台售卖
        - 留存来源未公开席位、用量或应用定价
        - 商业不透明会拖慢评估，但也保留谈判弹性
      - - Hex
        - 免费层，叠加按分钟计费的计算资源、付费积分 / 更高阶方案
        - 自助购买与企业升级的混合模式
        - 智能体、笔记本、应用和协作能力随方案层级加深
        - 企业客户如何把席位、积分和计算资源一起采购仍未公开
        - 灵活试验能力强，但 TCO 取决于工作负载形态
      - - ThoughtSpot
        - 数据定价和用户定价都有公开信号；更高阶企业能力似乎由套餐驱动
        - 用户、用量与企业套餐混合包装
        - Spotter、面向智能体的语义层、MCP 服务器和更高规模能力
        - 最终企业合同结构仍靠谈判确定
        - 用户评论里，ThoughtSpot 可能看起来比 Tableau 便宜，但仍明显高于 Power BI
      - - Metabase
        - 开源自托管，可选用量费，嵌入式从 $575/month 起
        - 开源，叠加云端 / 企业升级
        - 低成本入门，AI token、转换和嵌入式分析作为附加项售卖
        - 大型企业支持的经济账取决于部署方式和 SLA 需求
        - 愿意接受较少企业功能的成本敏感团队，现金门槛最低
      - - Cube
        - 没有简单公开的席位价目表；按月自助和年度订单合同都明确存在
        - 按月自助或年度企业订单合同
        - 语义层、BI 界面、API、缓存和智能体连接器
        - 除包装机制外，用量、席位和超额费用未公开
        - 这种包装更适合严肃的平台团队，而不是随手采购的部门级 BI 买家
      - - dbt Semantic Layer（语义层）
        - Starter $100/user/month；查询指标上限明确
        - 开发者席位订阅，带使用上限和企业升级
        - 基础语义层早期即可使用，高级语义层和 Mesh 上移到高端
        - 下游 BI 和应用成本仍在 dbt 之外
        - dbt 更容易被按指标治理来核算，而不是作为完整的 Omni 替代品
    notes: 定价行把已发布标价与明显由销售主导或混合包装的方案分开；未知单元格明确保留，因为多数厂商的实际折扣、积分和企业套餐条款并未公开。
