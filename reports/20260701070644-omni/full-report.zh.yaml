    title: 估值
    sections:
      - number: '8.1'
        title: 当前价格锚与披露缺口
        blocks:
          - type: paragraph
            body: >-
              Omni 公开估值档案中最强的事实，是融资估值本身的跃升。Omni 官方 2026 年 4 月新闻稿和创始人信都称，公司以 $1.5B 估值融资 $120M，由 ICONIQ 领投，并搭配 $30M
              员工股权要约。Yahoo/Fortune 和 Silicon Valley Daily 也佐证公司定价约在 $1.5B 至
              $1.51B，因此头部估值足够真实，可以作为锚。上一轮锚对一家私营公司来说也异常清楚：Omni 2025 年 3 月 Series B 公告称，公司以 $650M 估值融资
              $69M。这意味着市场在一年多一点的时间里把公司估值上调了约 2.3x。

              问题不在于估值是否上调，而在于这次上调实际买的是什么。Omni 创始人信称 ARR 在上一年扩大 4x，Yahoo/Fortune 又补充说 ARR 近乎增长四倍、公司在融资前一个月实现盈利、员工约 200
              人。这些是有意义的正面信号，尤其因为它们暗示的是资本效率，而不是纯靠招人驱动扩张。但公开 Series B 或 Series C 来源都没有披露绝对 ARR 分母、NRR、集中度、毛利率、烧钱情况，或
              Series C 证券的经济细节。因此，公开材料足以验证真实市场价格和方向上强劲的动能，却仍太薄，无法支撑传统内在价值模型或对公允价值给出干净点估计。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
