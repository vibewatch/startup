      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              Omni 品类的增长逻辑很强，因为底层 AI 和分析问题正在变得更贵，而不是更便宜。Deloitte 称 AI 正在带来效率提升， 但真正重塑业务的组织只有 34%；Morgan Stanley 则把 AI
              描述为一场工业级建设，前方仍有近 $3T 基础设施支出。 Futurum 调查把这股宏观顺风细化为品类需求：准确性和幻觉风险是用 GenAI 替代传统分析的首要顾虑，语义层拿到增量预算，
              部分原因正是它能约束这些失效模式。Gartner 警告，到 2030 年，AI Agent 部署失败的一半可能来自运行时治理和互操作性不足， 这强化了同一观点。Snowflake 的 Autopilot
              发布、Databricks metric views、dbt benchmark 和 Omni 自己的语义层论证， 都说明受治理指标正在成为可信 AI 的控制平面。约束同样关键。Futurum
              提到集成复杂度、缺少事务性回写和技能短缺加剧； Basedash 与 Promethium 都展示了信任侵蚀、支持工单过载、治理薄弱和陈旧仪表盘如何毁掉自助采用；Snowflake、Databricks、
              Microsoft 和 Tableau 原生能力增强，也可能削弱 Omni 赢下简单账户的必要性。因此，市场真实且增长，但执行风险在部署复杂度、 组织准备度和在位者套餐压力，而不在品类是否存在。
