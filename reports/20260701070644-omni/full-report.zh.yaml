      - number: '7.2'
        title: AI 治理、实施复杂度与产品成熟度风险
        blocks:
          - type: paragraph
            body: >-
              Omni 的产品故事自洽，但这种自洽也暴露了实施风险可能出现的位置。当客户把工作留在共享主题、有权限的工作簿和受控 agent 界面内时，受治理路径最有效。但 Omni 自己的文档显示，高级 SQL
              编辑可以在共享模型之外创建查询特定字段，电子表格标签页不能把其逻辑提升回受治理层，MCP 使用还要求组织启用功能、管理 PAT 或 OAuth
              设置，并正确对齐角色。换句话说，产品的准确性和治理叙事不是自动兑现的；它取决于管理员质量、建模纪律和审慎的上线决策。


              公开证据对 AI 准确性的证明，也比对 AI 架构的证明更薄。Omni 的融资公告和 query API 示例说明，受治理定义和权限如何流入 AI 查询；Checkr
              的案例也解释了客户为什么需要上下文和可靠性闭环。但公开材料仍没有披露针对 AI
              输出的幻觉率基准、错误答案率、权限逃逸测试或事故数量。评论和从业者证据又增加一层风险：大型仪表盘会卡顿或崩溃，图表覆盖仍在增长，文档可能落后于新版本，甚至外部开发者界面也出现过可见的废弃和整合。这不会推翻产品投资论点，但意味着运营打磨仍是承销问题的一部分。
