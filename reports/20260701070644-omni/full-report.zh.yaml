      - number: '6.5'
        title: 集中度、持久性，以及公开证据仍未说明的内容
        blocks:
          - type: paragraph
            body: >-
              Omni 的客户证据足以证明真实采用，但不足以承销集中度或留存。公开来源披露了客户名称、上线速度、少数嵌入式部署的下游用户数，以及 200+
              公司等方向性规模说法。它们没有披露精确客户数、嵌入式与内部部署组合、NRR、GRR、流失率、合同期限、续约同期群或头部客户集中度。这个缺口重要，因为许多最亮眼的公开故事——BambooHR、WorkRamp、ActiveProspect、SWBC——正是旗舰部署的类型：足以构成好看的叙事，却仍让收入质量不透明。[CU011]
              [CU023] [CU032] [CU033] [CU045] [CU046]


              这里至少有一个反向来源也值得看。Embeddable 的竞品比较认为，Omni 仍更像以 BI 容器为中心，而不是完全原生 UI 的分析平台；在多租户 SaaS
              体验上，可能需要额外配置。即便打折竞品偏见，这个批评仍有用：它强化了独立评论已经暗示的结论——当买方更看重受治理指标、自助服务和快速部署，而不是像素级控制或续约深度的公开证明时，Omni
              最强。因此，本章应得出的结论是：客户采用真实，logo 质量不错，先落地再扩张逻辑可见；但确切的持久性、集中度和部署组合经济性仍是尽调项，不是公开事实。[CU042] [CU043] [CU044]
