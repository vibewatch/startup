      - number: '2.2'
        title: 规模测算口径与有边界的 SAM/SOM
        blocks:
          - type: paragraph
            body: >-
              Omni 所在品类的公开规模数据只有在边界处理谨慎时才有用。已审阅材料中最窄的发布口径，是 Intel Market Research 对 AI 语义层的估计：2026 年 $0.95B，2034 年增至
              $2.10B。Futurum 给出另一条同样重要的口径：不是干净的收入总额， 而是一条增长轨迹，语义层增速从 2026 年 16.0% 加速到 2031 年 30.0%，并跑赢传统商业智能。Futurum
              调查还给出 预算分配口径：44.5% 的企业计划增加语义层支出，另有 14.4% 计划首次采用。在位平台定价进一步说明，机会比纯语义软件数字 更宽。Power BI
              把支出分散在免费、Pro、Premium、Fabric 和 Embedded 模式上，Tableau 则分散在 Creator、Explorer、 Viewer、Cloud+ 和 Tableau+
              套餐里。这些定价结构证明，受治理分析和嵌入式交付已经有真实预算，但它们不能切出应计入 Omni 可服务市场的比例。因此，正确结论应是有边界而非精确：Omni 的实际机会大于狭义语义层软件，小于全部在位 BI
              支出； 任何 SAM 或 SOM 都应被视为方向性投资判断区间，而不是已发布市场事实。
