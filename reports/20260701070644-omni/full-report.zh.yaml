  - id: FM001
    title: 市场规模测算视角
    type: pyramid
    layout: standard
    summary: Omni 夹在狭义公开语义层软件市场和更宽的既有分析平台预算池之间；可投资视角应是重叠区间，而不是单一 TAM 数字。
    data:
      nodes:
        - id: tam
          label: TAM — 广义既有分析与嵌入式预算池
          detail: 范围太宽，不能直接使用；包括 Power BI、Tableau 以及相邻分析平台支出，超过 Omni 真正重叠市场
        - id: sam
          label: SAM — Omni 相关重叠：~$1.0B-$4.0B（2026 est.）
          detail: 方向性分析区间，下界由狭义语义层软件限定，上界由更宽的受治理 BI / 嵌入式 / AI 控制平面预算限定
        - id: som
          label: SOM — 近期可触达楔子市场：~$0.2B-$0.8B
          detail: 需要在 BI、嵌入式分析和 AI 之间共用一个受治理模型的账户，而不是只买原生点工具
    approximationNotes: SAM 和 SOM 是明确的低置信度投资测算边界，因为没有公开来源隔离 Omni 的精确重叠市场；外层 TAM 刻意保持定性，因为既有平台预算太宽，不能直接当作 Omni 收入机会。
