  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 语义层与产品覆盖面
        blocks:
          - type: paragraph
            body: >-
              Omni 的产品命题异常明确：语义层不是后台建模便利工具，而是 BI、嵌入式分析、API、MCP 和 AI 的共享控制平面。
              官方网站反复把模型定位成专家定义指标和业务逻辑的地方，让下游用户可以提问、迭代并继续探索，而不必在每个表面重新编码定义。 独立对比文章与这一框架方向一致。Holistics 描述了一套分层 YAML 模型，含
              schema、shared 和 workbook 层； TrustRadius 则强调共享模型一致性与 SQL 自由度的组合。实际结论是，Omni 卖的是一套受治理模型，并把它复用到多个界面，
              而不是把彼此独立的产品用胶带粘在一起。相较于 AI、嵌入式和语义治理分别落在不同子系统里的工具，这是有意义的架构差异。
