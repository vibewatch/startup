            body: >-
              核心用户工作流灵活，但有明确取舍。Omni 文档列出多个分析入口：独立 Omni Agent、Workbook Agent、点选式工作簿探索、 可编辑 Omni SQL、直接 SQL
              标签页、上传和电子表格标签页。关键实现细节在于，AI 路径理解模型，而不是先写原始 SQL。Omni 称， Agent 会规划动作，通过共享模型生成语义查询，再把它们翻译成 SQL，并让用户在工作簿里检查
              SQL。这让产品拥有比许多 AI 外壳更强的 治理故事，但灵活性有边界。SQL 标签页完全绕过模型；电子表格标签页对实时连接的 Excel 式工作流很强，但在治理上仍是二等路径，
              因为只存在于电子表格里的逻辑无法回流到共享模型或其他查询。团队清楚区分哪些工作应进入共享语义定义、哪些应留在临时工作簿或电子表格空间时， Omni 最强。
