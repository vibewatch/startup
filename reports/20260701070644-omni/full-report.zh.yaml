  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 格局与解决方案类别
        blocks:
          - type: paragraph
            body: >-
              Omni 面对的不是一组整齐的竞争对手。买方可以用在位 BI 套件、AI 优先的分析产品、语义层专家、数仓原生语义， 或由开源和云原生组件拼出的内部栈，解决同一个任务。直接同类是 Sigma、Hex 和
              ThoughtSpot，因为它们都在推带 AI 辅助和一定受治理上下文的现代分析界面。在位者是 Looker、Tableau 和 Power BI，它们把语义、嵌入式和 Agentic
              功能包进更大的企业合同。相邻集合是 Cube、dbt Semantic Layer 和 AtScale，它们从受治理指标层给 Omni 施压， 不要求客户全面标准化到经典 BI。替代集合则是 Databricks
              metric views、Snowflake semantic views，以及把数仓语义 与 Metabase 或定制应用表面配在一起的内部构建模式。这个广度很关键：只有当「一套模型贯通 BI、嵌入式和
              AI」的故事 比上述组合明显更容易购买和部署时，Omni 的切入点才真正成立。
