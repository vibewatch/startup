        - 4x ARR 增长表述和首次盈利，说明经营杠杆可能是真实的
        - 公开材料仍隐藏 ARR 分母和毛利率质量
        - 经审计 ARR 桥接和毛利率披露
      - - 变现界面
        - 嵌入式分析和 AI 工作流可把合同价值抬到普通仪表板席位之上
        - 公开证据仍未显示已兑现的扩张或续约数学
        - 模块级 ARR 和续约分群
      - - 定价权
        - 报价制包装可支撑高价企业合同
        - 定价不透明也可能掩盖折扣压力或不均匀的价格实现
        - 合同原型和已实现 ACV 区间
      - - 品类位置
        - Omni 的 AI 语义层叙事踩准时点，客户侧用例也有差异
        - Snowflake、Databricks、dbt 和 Microsoft 用捆绑替代品削弱稀缺性
        - 面对原生和捆绑替代品时的赢单 / 输单数据
      - - 资本效率
        - 约 200 名员工加上盈利表述，说明效率可能好过纯靠堆人头的故事
        - 单月盈利不等于持续现金生成
        - 现金流历史，以及现金消耗或资金续航细节
    notes: 反向论点主要指向估值支撑和品类拥挤，而不是缺少真实产品需求。
