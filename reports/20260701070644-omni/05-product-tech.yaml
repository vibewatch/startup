  - - Finance or ops user wants Excel-style logic on live data
    - Connect workbook queries to spreadsheet tabs
    - Use formulas, imports, and protected query sheets inside Omni
    - Avoids CSV export and keeps live links to query outputs
    - No pivot tables or in-sheet charts and spreadsheet-only data stays local
  - - Product team ships customer analytics
    - Create signed embed URLs with attributes and row-level filters
    - Use iframe embedding plus branding and APIs
    - One semantic layer can back internal and external analytics
    - Public docs say less about hard scale ceilings than about setup mechanics
  - - External AI client needs governed answers
    - Connect via MCP using OAuth or API key
    - Use MCP tools for query execution and long-running askOmni jobs
    - Lets teams reuse semantic governance in Claude, Cursor, or other clients
    - External-tool data handling still depends on the host AI tool used with MCP
  - - dbt-native team wants metric reuse
    - Enable dbt integration and semantic-layer import
    - Use omni_dbt schemas and environment switching in branch mode
    - Reduces rework between transformation and BI layers
    - Cumulative dbt metrics are explicitly unsupported today
