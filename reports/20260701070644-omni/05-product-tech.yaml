- id: integrations-and-interfaces
  title: Integrations, warehouses, and external interfaces
  body: 'Omni''s current technical breadth is strongest where a governed SQL-warehouse workflow already exists. Its docs show direct setup guides for Snowflake, Databricks, and BigQuery, while the dbt integration reaches beyond raw connection plumbing into schema refreshes, metadata pull-through, dbt environment switching, and first-class dbt Semantic Layer mapping. Omni is also trying to avoid becoming a semantic dead end. It can import Snowflake semantic views, export topics to Databricks metric views through the SDK, expose governed access over REST, and provide MCP access for external AI clients. That combination gives Omni a more bridge-like posture than warehouse-native semantic layers, which is why independent reviewers treat Omni as comparatively flexible for mixed BI, embedded, and AI use cases. The tradeoff is that more moving parts now sit in the critical path: warehouse setup, dbt configuration, MCP auth, API governance, and model branching all have to stay aligned.'
