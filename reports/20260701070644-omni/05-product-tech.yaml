- id: competitive-context-and-limitations
  title: Comparative context and known technical limits
  body: 'The comparison set matters because Omni is no longer competing only with legacy BI tools. Snowflake Semantic Views and Databricks Metric Views now give warehouse-native teams real alternatives, while dbt''s Semantic Layer keeps pushing the code-first, tool-agnostic path. Omni''s advantage is that it can sit between those worlds: it reads dbt semantics, pulls in Snowflake semantic views, exports to Databricks metric views, and keeps a usable BI and embedded surface on top. The downside is that some logic remains less governed than the headline suggests. Holistics specifically calls out workbook- or spreadsheet-level logic for some cross-grain calculations and says CI/CD depth still needs more public clarity. Spreadsheet docs also make clear that pivot tables and in-sheet charts are not supported there, and comparative review evidence still gives Tableau and Power BI the edge on visualization flexibility. So the product is strongest as a governed analytics operating system, not necessarily
    as the deepest charting canvas in the category.'
