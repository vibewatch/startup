- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer or component
  - Role
  - Public dependency
  - Documented risk or constraint
  rows:
  - - Warehouse connections
    - Run modeled and direct queries against customer data
    - Snowflake, Databricks, and BigQuery setup guides are public
    - Public materials imply a SQL-warehouse-centered architecture rather than true federated non-SQL analytics
  - - Schema / shared / workbook model layers
    - Separate raw structure, governed logic, and local extensions
    - Model IDE plus workbook promotion workflows
    - Workbook logic can remain local if teams do not promote it into the shared layer
  - - Omni SQL and SQL tabs
    - Serve power users who need editable query control
    - Dialect SQL plus Omni SQL helper functions
    - SQL tabs bypass the model and therefore weaken governance if overused
  - - dbt integration
    - Pull metadata, switch environments, and query dbt semantic definitions
    - dbt repository, omni_dbt virtual schemas, and branch mode
    - Cumulative dbt metrics are unsupported and environment setup has to be maintained carefully
  - - MCP and REST APIs
    - Expose governed querying and management workflows outside the UI
    - MCP clients, API keys or OAuth, and Omni instance API base URL
    - More integration power means more credential and permission surface to administer
  - - Git / PR and YAML endpoints
    - Support branch-based model editing and publish controls
    - Model branches, pull requests, YAML file modes, checksum validation
    - Public docs show the primitives but not a full opinionated CI/CD reference architecture
  - - Warehouse-native semantic bridges
    - Import Snowflake semantic views and export Databricks metric views
    - Snowflake semantic views, Databricks Unity Catalog metric views
    - Both adjacent systems remain warehouse-native and carry their own ecosystem lock-in constraints
  notes: The table describes public architecture boundaries, not unpublished internal service decomposition or proprietary runtime internals.
