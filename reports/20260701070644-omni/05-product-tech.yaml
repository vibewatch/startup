- id: governance-security-change-management
  title: Governance, security, and change management
  body: The strongest public evidence on Omni's trust model is concrete rather than aspirational. Content settings can force pull-request publication, disable risky document actions, and restrict what lower-permission users can do. SQL creation and SQL-result visibility are explicitly fenced to higher-permission roles, while viewer workbook access excludes SQL tabs and non-topic tabs. On the operational side, Omni states that its information security program is reviewed under the CTO, audited annually through SOC 2 Type II, and enforced with least-privilege, MFA, logging, and revocable support access. Embedded deployments use signed URLs plus user attributes for row-level filtering, and the Snowflake Cortex option keeps AI traffic inside Snowflake's boundary rather than shipping context to a separate provider endpoint. Change management also looks more software-like than many BI peers because model branches, pull requests, YAML modes, and checksum conflict detection are all part of the documented
    interface, even if public CI/CD depth is still lighter than a full DevOps playbook.
