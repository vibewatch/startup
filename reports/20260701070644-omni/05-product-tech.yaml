tables:
- id: TE001
  title: Product module / asset matrix
  columns:
  - Module
  - Primary user
  - Current role
  - Differentiation
  - Diligence gap
  rows:
  - - Shared semantic model
    - Data and analytics teams
    - Governed source of metrics, joins, and business logic reused across BI and AI
    - One model is reused across workbooks, APIs, MCP, and embedded surfaces
    - Public docs stop short of giving an exhaustive semantic-language reference or formal OSI export roadmap
  - - Workbooks and dashboards
    - Analysts and business users
    - Main self-serve analysis and presentation surface
    - Users can move between chat, point-and-click, SQL, and saved workbook flows
    - Visualization depth is less clearly documented than category leaders like Tableau or Power BI
  - - Spreadsheet / Calculations
    - Finance and operations users
    - Live-data Excel-style analysis inside workbooks
    - Connected spreadsheet sheets avoid CSV export while keeping formulas close to governed data
    - Spreadsheet-only logic cannot be promoted back into shared semantic definitions and some spreadsheet features are intentionally absent
  - - Omni AI agents
    - Business users and analysts
    - Natural-language analysis, summaries, and multi-step question answering
    - Semantic-query-first AI improves definition consistency versus raw-table prompting
    - Public benchmarks on latency, eval quality, and failure cases are limited
  - - Embedded analytics
    - Product and platform teams
    - Customer-facing dashboards, workbooks, and AI workflows
    - White-labeling, row-level isolation, APIs, and MCP are all part of the same stack
    - More public detail is needed on operational scale limits and rollout patterns
  - - APIs, MCP, and Model IDE
    - Developers and analytics engineers
    - Programmatic access plus code-style model governance
    - REST endpoints, MCP auth patterns, pull-request publishing, and YAML APIs point to software-engineering style operations
    - Developer tooling is still evolving, as shown by plugin deprecation and repo consolidation
  notes: Source mix combines Omni product pages, technical docs, Holistics, and TrustRadius; differentiation fields summarize only public evidence.
