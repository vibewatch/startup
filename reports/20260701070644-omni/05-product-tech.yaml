- id: roadmap-release-signals-and-gaps
  title: Roadmap signals and unresolved diligence gaps
  body: 'The public corpus is good enough to understand Omni''s product direction, but it still leaves important underwriting questions open. The release signal is clear: by February 2026 Omni was publicly demoing itself as an MCP product surface, and the current docs now pair MCP, Snowflake Cortex, modeling agents, and Databricks metric-view export as first-class workflows rather than experimental side projects. At the same time, the public evidence is thinner on hard performance benchmarks, exhaustive visualization coverage, and end-to-end CI/CD detail. The deprecated Cursor plugin also shows how fast the external developer surface is changing; consolidation into a broader agent-skills repo is sensible, but it means buyers should expect some interface churn as Omni standardizes its AI tooling. Net: the architecture looks deliberate and current, yet there is still a diligence gap between feature availability and the level of implementation transparency a technical buyer might want before
    making Omni the central semantic control plane.'
