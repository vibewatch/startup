  summary: Omni layers a shared semantic core under multiple user interfaces, external interfaces, and AI controls rather than treating BI and AI as separate stacks.
  data:
    layers:
    - label: Warehouse and source connectivity
      detail: Customer data stays in connected SQL warehouses such as Snowflake, Databricks, and BigQuery.
      modules:
      - Snowflake
      - Databricks
      - BigQuery
    - label: Schema / semantic modeling layer
      detail: Schema, shared, and workbook model tiers define how raw structure becomes governed logic and local extension points.
      modules:
      - Schema model
      - Shared model
      - Workbook model
    - label: Query and workbook runtime
      detail: The runtime supports point-and-click querying, Omni SQL helpers, direct SQL tabs, workbook history, and saved documents.
      modules:
      - Point-and-click
      - Omni SQL
      - SQL tabs
      - Workbook version history
    - label: Spreadsheet and calculations layer
      detail: Spreadsheet tabs and Excel-style calculations sit on top of live query sheets for finance and planning use cases.
      modules:
      - Spreadsheet tabs
      - Protected query sheets
      - Excel-style formulas
    - label: AI and semantic orchestration
      detail: Agents generate semantic queries, use model metadata, and can optionally run through Snowflake Cortex or other providers.
      modules:
      - Omni Agent
      - Workbook Agent
      - Modeling Agent
      - Snowflake Cortex option
    - label: External delivery surfaces
      detail: The same semantic core is exposed to embedded analytics, REST APIs, and MCP clients.
      modules:
      - Embedded iframes
      - REST API
      - MCP Server
