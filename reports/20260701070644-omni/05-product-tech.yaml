chapter:
  number: 5
  title: Product & Technology
  summary: Omni's product stack is coherently organized around a governed semantic model reused across BI, embedded analytics, REST, MCP, and AI rather than separate logic silos. Public evidence is strong on workflow breadth, integration depth, and security primitives, but still lighter on benchmarked performance, full CI/CD detail, and exact visualization ceilings versus best-in-class BI peers.
sections:
- id: semantic-foundation
  title: Semantic layer and product surface
  body: 'Omni''s product thesis is unusually explicit: the semantic layer is not a back-office modeling convenience but the shared control plane for BI, embedded analytics, APIs, MCP, and AI. The official site repeatedly positions the model as the place where experts define metrics and business logic so that downstream users can ask questions, iterate, and keep exploring without re-encoding definitions in every surface. Independent comparison coverage is directionally consistent with that framing. Holistics describes a layered YAML model with schema, shared, and workbook tiers, while TrustRadius emphasizes the mix of shared-model consistency and SQL freedom. The practical takeaway is that Omni is selling one governed model reused across many interfaces, not separate products duct-taped together. That is a meaningful architectural distinction versus tools where AI, embedded, and semantic governance live in separate subsystems.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE005
  - CE048
  - CE053
  tableRefs:
  - TE001
  figureRefs:
  - FE001
- id: analysis-modes-and-ai
  title: Analysis modes and AI mechanics
  body: 'The core user workflow is flexible but still opinionated. Omni documents several entry points into analysis: a standalone Omni Agent, a Workbook Agent, point-and-click workbook exploration, editable Omni SQL, direct SQL tabs, uploads, and spreadsheet tabs. The important implementation detail is that the AI path is model-aware rather than raw-SQL-first. Omni says the agent plans actions, generates semantic queries through the shared model, translates those into SQL, and lets the user inspect the SQL in a workbook. That gives the product a stronger governance story than many AI overlays, but the flexibility has limits. SQL tabs bypass the model entirely, and spreadsheet tabs stay excellent for live connected Excel-style workflows while remaining second-class for governance because spreadsheet-only logic cannot flow back into the shared model or other queries. This makes Omni strongest when teams know which work belongs in shared semantic definitions versus ad hoc workbook or spreadsheet
    space.'
  claimRefs:
