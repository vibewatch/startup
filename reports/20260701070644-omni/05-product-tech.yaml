  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: performance-benchmarks
    missingEvidence: Public latency, concurrency, cache-hit, and failure-rate benchmarks for large workbook, embedded, and MCP workloads.
    whyItMatters: Omni positions itself as the shared runtime for BI and AI, so performance under mixed interactive and agentic load is central to implementation risk.
    diligencePath: Request architecture review materials, customer references with scale metrics, and observed benchmark runs in a live proof-of-concept.
    relatedQuestionRefs:
    - QE025
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: visualization-coverage
    missingEvidence: An exhaustive public chart-type and interaction matrix versus Tableau or Power BI, especially for embedded and spreadsheet-adjacent workflows.
    whyItMatters: Independent review evidence suggests Omni is not the category leader on visualization flexibility, but the exact boundary of that tradeoff is still hard to quantify from public docs alone.
    diligencePath: Run a scripted feature bake-off against a target dashboard backlog and request product demonstrations of the most specialized chart and interaction patterns.
    relatedQuestionRefs:
    - QE024
    - QE025
    relatedTableRefs:
    - TE002
    - TE005
  - type: missing-source
    severity: material
    topic: ci-cd-depth
    missingEvidence: A fuller public deployment reference showing tests, rollback, promotion, audit, and environment management across model and content changes.
    whyItMatters: Omni clearly exposes Git, branches, pull requests, and YAML APIs, but buyers treating the platform like production software infrastructure need more than primitives.
    diligencePath: Ask Omni for an end-to-end SDLC walkthrough covering branch isolation, automated validation, promotion, rollback, and audit instrumentation.
    relatedQuestionRefs:
    - QE018
    - QE022
    - QE025
    relatedTableRefs:
    - TE004
    - TE005
  - type: missing-source
    severity: minor
    topic: connector-boundaries
    missingEvidence: A single current public matrix that exhaustively states which non-SQL, federated, or multi-warehouse patterns are unsupported or only partially supported.
    whyItMatters: The public setup guides strongly indicate SQL-warehouse centricity, but the exact edge of unsupported federated analytics still has to be inferred from scattered docs and comparisons.
    diligencePath: Request a connector support matrix and explicit statements on unsupported non-SQL, cross-warehouse, and federation patterns before architecture lock-in.
    relatedQuestionRefs:
    - QE011
    - QE012
    - QE025
    relatedTableRefs:
    - TE003
