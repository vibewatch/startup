- id: concentration-durability-and-public-gaps
  title: Concentration, durability, and what public evidence still does not show
  body: 'Omni''s customer proof is good enough to establish real adoption, but not good enough to underwrite concentration or retention. Public sources disclose logo names, rollout speed, downstream-user counts in a few embedded deployments, and directional scale claims such as 200+ companies. They do not disclose exact customer count, embedded-versus-internal deployment mix, NRR, GRR, churn, contract length, renewal cohorts, or top-customer concentration. That omission matters because many of the most impressive public stories are exactly the kind of flagship deployments—BambooHR, WorkRamp, ActiveProspect, SWBC—that can create an attractive narrative while still leaving revenue quality opaque. [CU011] [CU023] [CU032] [CU033] [CU045] [CU046]


    At least one adverse source also matters here. Embeddable''s competitor comparison argues that Omni remains more BI-container-centric than fully native UI analytics platforms and may require extra configuration for multi-tenant SaaS experiences. Even after discounting competitor bias, the critique usefully reinforces what the independent reviews already suggest: Omni is strongest when the buyer values governed metrics, self-service, and rapid deployment more than pixel-perfect control or public proof of renewal depth. The chapter should therefore conclude that customer adoption is real, logo quality is respectable, and land-and-expand logic is visible—but exact durability, concentration, and deployment-mix economics remain diligence items, not public facts. [CU042] [CU043] [CU044] [CU045] [CU046]'
