  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: durability-gap
    missingEvidence: Net and gross revenue retention, logo churn, renewal cohorts, and contract length by customer segment and deployment type.
    whyItMatters: The public customer story is strong on logos and implementation speed but too weak on durability to underwrite expansion or renewal quality.
    diligencePath: Request cohort retention tables, renewal rates, and contraction-versus-expansion data split between internal BI and embedded deployments.
    relatedQuestionRefs:
    - QU018
    - QU025
    relatedTableRefs:
    - TU004
    - TU005
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: Top-10 customers by ARR, largest-customer share, and ARR mix across lighthouse embedded accounts versus internal-only deployments.
    whyItMatters: The public narrative leans on a handful of standout customers, so concentration could be better or worse than logos alone imply.
    diligencePath: Request customer concentration schedule, ACV bands, and exposure to the largest embedded deployments before underwriting scale claims.
    relatedQuestionRefs:
    - QU019
    - QU024
    relatedTableRefs:
    - TU003
    - TU005
  - type: enumeration-incomplete
    severity: minor
    topic: deployment-mix-gap
    missingEvidence: 'Customer counts by deployment archetype: internal-only, hybrid, and embedded-first.'
    whyItMatters: The chapter can describe deployment patterns, but not the exact current mix or how representative the public case studies are.
    diligencePath: Ask management for a simple deployment-archetype distribution and cross-check against top logos and renewal behavior.
    relatedQuestionRefs:
    - QU023
    relatedTableRefs:
    - TU001
    - TU002
  - type: missing-source
    severity: material
    topic: support-economics
    missingEvidence: Average implementation duration, services attach, partner versus in-house customer-success coverage, and support intensity by segment.
    whyItMatters: Independent reviews and official case studies imply support matters to adoption, but the public record does not show whether that support scales efficiently.
    diligencePath: Request onboarding playbooks, implementation resource model, and gross-margin impact for high-touch enterprise or embedded accounts.
    relatedQuestionRefs:
    - QU021
    relatedTableRefs:
    - TU004
acknowledgedWarnings:
- dimension: figureType
  reason: No public retention time-series exists for Omni, so a cohort figure would imply retention data the source set does not actually disclose.
