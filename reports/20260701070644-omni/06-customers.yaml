- id: FU001
  title: Customer journey map
  type: journey-map
  layout: standard
  summary: Omni usually lands with a data or product pain point, proves value quickly, and then expands into broader governed self-service or customer-facing analytics.
  approximationNotes: This is a structural journey synthesized from public case studies and reviews, not a disclosed CRM funnel.
  data:
    items:
    - label: Pain recognition
      note: A data, product, or analytics leader hits limits in legacy BI, fragmented tools, or hard-coded reporting.
    - label: Evaluation
      note: The buyer compares governed self-service, embedded depth, pricing, and implementation burden across vendors.
    - label: Fast deployment
      note: Teams rebuild or migrate key dashboards in weeks to a few months, often with support from Omni or a partner.
    - label: Internal self-service adoption
      note: Business, finance, product, and executive users start working from a shared semantic layer and AI-assisted workflows.
    - label: Customer-facing or premium rollout
      note: Some logos extend the same model into branded external analytics, new product tiers, or client portals.
    - label: Expansion or friction
      note: Accounts either widen across roles and products or hit pricing, charting, documentation, and customization constraints.
