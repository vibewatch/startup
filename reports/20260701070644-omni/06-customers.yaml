  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Deployment mode
  - Named evidence
  - Strategic value
  - Main gap
  rows:
  - - Internal self-service teams
    - Data or analytics leader buys; business, finance, or ops users consume; budget usually centralized
    - Internal BI / AI analytics
    - Caraway, Feeld, Cribl, Checkr
    - Shows Omni can replace legacy BI and drive governed self-service
    - No public seat counts, contract lengths, or renewal cohorts
  - - Hybrid internal + customer-facing SaaS vendors
    - Product/data leaders buy; internal teams and external customers use; payer is product or platform budget owner
    - Shared semantic layer across internal and external analytics
    - ActiveProspect, Brevo, Ordermentum, SWBC
    - Supports land-and-expand across departments and product surfaces
    - Public sources do not quantify internal-versus-external revenue mix
  - - Embedded-first B2B2C platforms
    - Product team buys; end customers and customer success teams use; payer is software vendor
    - Embedded analytics / branded data product
    - BambooHR, WorkRamp
    - Creates upsell, retention, and differentiation hooks
    - Per-seat economics and downstream-user monetization are undisclosed
  - - Finance and executive workflows
    - Finance, product finance, or executives buy and use with analyst support
    - Internal governed reporting plus AI
    - SWBC, Feeld, Cribl
    - Expands Omni beyond classic BI into decision workflows
    - No public proof of finance-specific ACV uplift
  - - High-scale downstream-user deployments
    - Vendor product org pays; thousands of end users consume
    - Customer-facing analytics at scale
    - BambooHR 30K+ then 100K+ people; WorkRamp thousands of users
    - Shows operational readiness beyond small pilot accounts
    - No public uptime, support-load, or gross-margin data by deployment
  - - Broad logo-awareness / reference layer
    - Investor and buyer community observes logos more than contract details
    - Reference and validation surface
    - BambooHR, Perplexity, Writer, BuzzFeed, Mercury, Pendo, Guitar Center
    - Improves credibility in evaluation cycles
    - Logo awareness does not prove revenue concentration or retention
  notes: Segmentation is based on public case studies, funding coverage, and review surfaces; it is a deployment-pattern map, not a disclosed revenue segmentation.
