- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Surface
  - Public signal
  - Positive read-through
  - Negative / adverse read-through
  - Support / onboarding implication
  - Diligence ask
  rows:
  - - AWS Marketplace / syndicated G2
    - 4.8/5 from 65 ratings
    - Usability, flexibility, and metric consistency resonate with real users
    - Samples are review-site self-selection rather than renewal math
    - Support quality appears to matter in adoption
    - Request cohort retention and deployment size behind reviewed accounts
  - - TrustRadius
    - 8.6/10 from 2 reviews
    - Directionally positive independent signal
    - Too thin to underwrite broad customer satisfaction
    - Reference quality is real but sparse
    - Request larger review or NPS sample by segment
  - - AWS review drawbacks
    - Learning curve, lag on large dashboards, limited chart types, docs lag
    - Normal issues for a newer platform can be solved in deployment
    - Implementation burden may rise with complex models or heavier dashboard estates
    - Customer success and technical enablement likely matter in early rollout
    - Ask for average onboarding length and time-to-first-dashboard by segment
  - - B2B2C pricing complaint
    - $15/user/month concern from one reviewer with thousands of end users
    - Shows embedded monetization value exists
    - Seat-based economics can clash with occasional-use downstream users
    - Pricing and customer-success design matter for high-scale embed accounts
    - Request current embedded pricing mechanics and large-user exceptions
  - - Official support stories
    - ActiveProspect, SWBC, and Cribl all emphasize responsive vendor support
    - Strong partnership may accelerate time-to-value
    - Could imply a meaningful services or support burden behind deployments
    - High-touch onboarding may be part of winning larger accounts
    - Request support staffing, partner mix, and implementation gross-margin profile
  - - Public retention metrics
    - No NRR, GRR, churn, contract length, or renewal cohorts disclosed
    - Gap is clearly identified rather than hidden
    - Durability cannot be publicly underwritten
    - Retention diligence must be management-provided
    - Request gross / net retention, renewal by segment, and cancellation reasons
  notes: Independent review surfaces are useful for implementation and onboarding color, but they do not replace management-grade retention or support-efficiency data.
