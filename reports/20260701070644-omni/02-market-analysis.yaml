- id: growth-drivers-and-adoption-constraints
  title: Growth Drivers and Adoption Constraints
  body: 'The growth case for Omni''s category is strong because the underlying AI and analytics problems are getting more expensive, not less. Deloitte says AI is producing efficiency gains even though only 34% of organizations are truly reimagining the business, while Morgan Stanley describes AI as an industrial buildout with nearly $3 trillion of infrastructure spending still ahead. Futurum''s survey sharpens that macro tailwind into category-specific demand: accuracy and hallucination risk are the leading reservations about replacing traditional analytics with GenAI, and semantic layers are receiving incremental budget partly because they constrain those failure modes. Gartner''s warning that half of AI agent deployment failures could stem from insufficient runtime governance and interoperability by 2030 reinforces the same point. Snowflake''s Autopilot launch, Databricks metric views, dbt''s benchmark, and Omni''s own semantic-layer argument all suggest that governed metrics are becoming
    a control plane for trustworthy AI. The constraints are just as important. Futurum flags integration complexity, lack of transactional write-back, and rising skills shortages; Basedash and Promethium both show how trust erosion, support-ticket overload, weak governance, and stale dashboards can wreck self-service adoption; and stronger native capabilities from Snowflake, Databricks, Microsoft, and Tableau may reduce Omni''s need to win simpler accounts. So the market is real and growing, but execution risk sits in deployment complexity, organizational readiness, and incumbent bundle pressure rather than in whether the category exists.'
