  name: Omni
chapter:
  number: 2
  title: Market Analysis
  summary: Omni sits in a governed analytics market that overlaps semantic layers, self-serve BI, embedded analytics, and AI control planes rather than any one legacy BI bucket. Public evidence supports strong demand drivers around AI trust and metric governance, but no clean published Omni-specific SAM or SOM exists, so the chapter uses bounded market lenses and preserves the remaining sizing gaps explicitly.
sections:
- id: market-boundary-and-substitutes
  title: Market Boundary and Status-Quo Substitutes
  body: 'The cleanest way to define Omni''s market is not as generic business intelligence software, and not as a standalone semantic-layer utility either. Omni''s own product pages present one platform that lets teams define and trust shared metrics, use those metrics in internal BI, and push the same governed logic into customer-facing analytics. Its semantic-layer article goes further and frames the semantic layer as the control plane that determines whether dashboards, notebooks, and AI answers share one business definition or drift apart. Third-party category sources point in the same direction. AtScale says the semantic layer has crossed from BI convenience to essential AI infrastructure, Futurum says value is moving from the visual dashboard to the logical metric store, and Gartner predicts universal semantic layers will become critical infrastructure by 2030. That means the relevant spend pool includes semantic modeling, governed metrics, internal analytics, embedded analytics, and
    AI-grounding workflows. It excludes raw warehouse spend, generic data integration, standalone model-training budgets, and bespoke application UI that has no governed analytics layer. The substitute set is therefore broad: Power BI and Tableau for incumbent BI, Databricks and Snowflake for warehouse-native semantics, and direct text-to-SQL approaches for teams that try to answer natural-language questions without a shared business model.'
