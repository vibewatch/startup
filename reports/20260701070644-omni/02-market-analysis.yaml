- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Primary buyer
  - Primary user
  - Payer / budget owner
  - Workflow
  - Adoption trigger
  - Why Omni can matter
  rows:
  - - Modern data / BI team
    - Head of data, analytics, or BI
    - Analysts, business users, and report creators
    - Central analytics budget
    - Governed self-serve BI and shared KPI definitions
    - Conflicting dashboards or trust problems across teams
    - Omni unifies semantic governance with front-end analytics
  - - Platform / analytics engineering
    - VP / director of data platform or analytics engineering
    - Analytics engineers, platform engineers, and model owners
    - Data platform budget
    - Define metrics once and expose them across warehouse, BI, and AI surfaces
    - Warehouse-native semantic work creates pressure for reusable metric logic
    - Omni competes as a higher-level governed control plane
  - - Product / embedded analytics owner
    - VP product, GM, or engineering leader
    - Developers and end customers
    - Product or application budget
    - Customer-facing analytics and monetized data products
    - Need for branded, fast, trusted embedded reporting
    - Omni combines metrics governance with embedded delivery and pricing upside
  - - AI / automation sponsor
    - AI platform or data/AI program leader
    - Internal copilots, agents, and downstream business users
    - Executive AI or innovation budget
    - Ground AI answers in deterministic metrics and permissions
    - Hallucination or governance failures in AI analytics pilots
    - Omni sells the semantic layer as AI trust infrastructure
  - - Microsoft-centered enterprise
    - Power Platform / Fabric owner
    - Business users and report creators
    - Microsoft platform budget
    - Power BI semantic models, Fabric, and embedded reporting
    - Desire to stay within Microsoft stack
    - Omni must displace a strong incumbent, not a blank slate
  - - Tableau / Salesforce-centered enterprise
    - Analytics center of excellence or business intelligence leader
    - Creators, explorers, viewers, and executives
    - Analytics or line-of-business budget
    - Role-based analytics with governance and agentic add-ons
    - Need to modernize or extend incumbent BI estate
    - Omni competes when one governed model across BI, AI, and embedded use cases matters more than incumbent seat reuse
  notes: Buyer and payer roles are synthesized from official incumbent product positioning, pricing roles, warehouse-semantic workflows, and Omni's embedded analytics message; real ownership can shift by company size and architecture maturity.
