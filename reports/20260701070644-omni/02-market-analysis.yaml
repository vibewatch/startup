- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Enterprise AI activation
    - Driver
    - Current / 2026-2028
    - More AI use cases increase demand for governed business context and reliable metrics
    - Test how often Omni is budgeted as AI-enablement rather than BI replacement
  - - Accuracy and hallucination risk
    - Driver
    - Current / ongoing
    - Trust gaps make semantic layers easier to justify as control planes for AI and analytics
    - Request proof that Omni reduces wrong-answer rates or analyst review load
  - - Warehouse-native semantic standardization
    - Driver
    - Current / ongoing
    - Validates the category and familiarizes buyers with metric-governance workflows
    - Measure whether native semantic adoption expands Omni's top-of-funnel or cannibalizes easier deals
  - - Embedded analytics monetization
    - Driver
    - Current / ongoing
    - Moves spend from pure reporting productivity to product revenue and customer retention
    - Ask for attach rates, gross-margin impact, and expansion from embedded deployments
  - - Integration complexity
    - Constraint
    - Current / ongoing
    - Slows time-to-value and raises services / onboarding burden
    - Review implementation requirements across warehouse, dbt, permissions, and downstream apps
  - - Skills shortages
    - Constraint
    - Current / ongoing
    - Can delay rollout even when budget exists
    - Quantify customer-success and solution-engineering load needed to reach production
  - - Transactional write-back limits
    - Constraint
    - Current / near-term
    - Can block some agentic or closed-loop workflows even if analytics is trusted
    - Clarify what Omni supports today versus roadmap-only action loops
  - - Trust erosion and self-service failure
    - Constraint
    - Current / ongoing
    - Poor governance or stale dashboards can kill adoption before category value is realized
    - Inspect Omni customer references for rollout discipline, training, and metric ownership
  - - Security / governance overhead
    - Constraint
    - Current / ongoing
    - More governed systems mean more policy design, review, and change management
    - Validate how permissions, auditability, and lifecycle management scale in large enterprises
  - - Incumbent bundle pressure
    - Constraint
    - Current / ongoing
    - Power BI, Tableau, Snowflake, and Databricks can win simpler accounts with existing contracts
    - Model Omni win rates by architecture, stack concentration, and embedded/AI complexity
  notes: 'Several factors work in both directions: they create demand for governed analytics while also increasing the implementation, training, and competitive friction needed to realize that demand.'
