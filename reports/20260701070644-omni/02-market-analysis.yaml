      detail: Directional analytical range bounded between narrow semantic-layer software and broader governed BI / embedded / AI-control-plane budgets
    - id: som
      label: 'SOM — near-term reachable wedge: ~$0.2B-$0.8B'
      detail: Accounts that need one governed model across BI, embedded analytics, and AI rather than native point tools
  approximationNotes: SAM and SOM are explicit low-confidence underwriting bounds because no public source isolates Omni's exact overlap market; the outer TAM layer is intentionally qualitative because incumbent platform budgets are too broad to treat as Omni revenue opportunity.
