- id: sizing-lenses-and-bounded-sam
  title: Sizing Lenses and Bounded SAM/SOM
  body: 'Public sizing for Omni''s category is useful only if the boundary is handled carefully. The narrowest published lens in the reviewed pack is Intel Market Research''s AI semantic layer estimate of $0.95 billion in 2026 growing to $2.10 billion by 2034. Futurum supplies a different but equally important lens: not a clean revenue total, but a growth trajectory in which semantic-layer growth accelerates from 16.0% in 2026 to 30.0% by 2031 and outpaces legacy business-intelligence growth. Futurum''s survey adds a budget-allocation lens, with 44.5% of enterprises planning to increase spending on semantic layers and another 14.4% planning to newly adopt. Incumbent platform pricing then shows why the opportunity is broader than the semantics-only figure. Power BI spreads spend across free, Pro, Premium, Fabric, and Embedded models, while Tableau spreads it across Creator, Explorer, Viewer, Cloud+, and Tableau+ bundles. Those pricing structures prove that real budget already exists for governed
    analytics and embedded delivery, but they do not isolate the fraction that should count as Omni''s serviceable market. The right conclusion is therefore bounded rather than precise: Omni''s practical opportunity is larger than narrow semantic-layer software and smaller than all incumbent BI spend, so any SAM or SOM should be treated as a directional underwriting range rather than a published market fact.'
