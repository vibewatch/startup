  evidenceGaps:
  - type: missing-source
    severity: material
    topic: omni-sam-som-isolation
    missingEvidence: A bottom-up public source or management disclosure that isolates Omni's true semantic-layer-plus-embedded-plus-AI overlap market and quantifies reachable budget by stack and company size.
    whyItMatters: Without that evidence, SAM and SOM remain analytical bounds rather than auditable market facts.
    diligencePath: Request management's TAM/SAM model, pipeline segmentation by incumbent stack, and win-rate assumptions against Power BI, Tableau, Snowflake, and Databricks.
    relatedQuestionRefs:
    - QM006
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: embedded-budget-ownership
    missingEvidence: Customer-level evidence on who signs, funds, and expands Omni embedded analytics deals versus internal BI deployments, including monetization and attach-rate data.
    whyItMatters: Embedded analytics materially broadens the buyer map, but the exact payer mix determines how large Omni's product-led wedge really is.
    diligencePath: Ask for closed-won embedded deal examples, pricing constructs, upsell paths, and expansion data by product-led versus analytics-led account.
    relatedQuestionRefs:
    - QM010
    relatedTableRefs:
    - TM003
