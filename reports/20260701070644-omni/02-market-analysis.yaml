tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Primary buyer / payer
  - Omni relevance
  rows:
  - - Governed semantic layer / business semantics
    - Metric definitions, joins, grain, permissions, and governed business logic above raw data
    - Raw warehouse storage and unmanaged SQL exploration
    - Data / BI leader or analytics engineering owner
    - Core category anchor and narrowest clean lens
  - - Self-serve enterprise BI
    - Internal dashboards, governed exploration, report sharing, and metric consumption
    - Custom app UI without reusable governed analytics logic
    - BI leader, business unit analytics owner, or CIO-backed analytics budget
    - Important adjacent spend because Omni bundles BI with semantics
  - - Embedded / customer-facing analytics
    - Branded in-product reporting, customer dashboards, and monetized data experiences
    - Generic front-end product work with no reusable analytics layer
    - Product, engineering, or platform owner
    - Critical adjacency because Omni explicitly sells this workflow
  - - Warehouse-native semantic services
    - Metric views, semantic views, and AI-governance layers inside data platforms
    - General-purpose warehouse compute unrelated to governed metrics
    - Platform engineering or central data platform budget
    - Direct substitute and category validator
  - - AI analytics control plane
    - AI answers grounded in governed metrics, permissions, and auditable logic
    - Standalone model training or consumer chatbots without enterprise data governance
    - AI / data platform owner or executive AI program
    - Fastest-growing strategic framing for the category
  - - Direct text-to-SQL analytics
    - Natural-language querying and ad hoc exploration against modeled data
    - Deterministic metric governance when every query is generated from scratch
    - Innovation or experimentation budget
    - Adjacent substitute that highlights Omni's trust positioning
  notes: The table intentionally narrows Omni's addressable market to governed analytics layers that can be reused across BI, embedded analytics, and AI; it excludes raw data infrastructure and generic software spend that lacks governed semantic logic.
