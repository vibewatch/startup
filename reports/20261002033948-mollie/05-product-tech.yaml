  title: "Product & Technology"
  summary: "Mollie operates a European payment gateway and financial services platform enabling over 250,000 merchants to accept more than 35 payment methods, running a microservices architecture hosted on Google Cloud and orchestrated by Temporal. The company pairs developer-friendly REST APIs with no-code platform plugins, while enforcing strict merchant risk screening and expanding upmarket through Mollie Connect and in-person point-of-sale solutions."
sections:
  - id: "product-architecture-and-developer-experience"
    title: "Payment Platform Architecture and Developer Experience"
    body: "Mollie structures its core processing platform as a modular payments infrastructure engineered to abstract European payment fragmentation for webshops, software platforms, and enterprise merchants [CE001]. The platform supports over 35 local and international payment methods—including iDEAL, Cartes Bancaires, Visa, Mastercard, PayPal, and Klarna—through a single unified API and embeddable front-end Components [CE001, CE002]. Developers interact with the payment engine via idiomatic software development kits such as @mollie/api-client, initiating payments with simple REST calls specifying currency, amounts, redirect targets, and asynchronous webhook URLs for real-time transaction state updates [CE002]. Beyond direct REST API integrations, Mollie provides pre-built plugins for leading enterprise and mid-market commerce environments, including Adobe Commerce Cloud, WooCommerce, and Salesforce Commerce Cloud, eliminating manual data handoffs and automating order-to-cash reconciliation across external enterprise stacks [CE003]."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE003"
    tableRefs:
      - "TE001"
    figureRefs:
      - "FE001"
  - id: "infrastructure-reliability-and-workflow-orchestration"
    title: "Infrastructure Migration, Workflow Orchestration, and Scalability"
    body: "To support rapid transaction volume growth across European markets, Mollie transitioned its core application infrastructure from dedicated on-premises servers running monolithic virtual machines into a cloud-native microservices architecture hosted on Google Cloud [CE004]. The engineering organization containerized services onto Google Kubernetes Engine (GKE) and adopted Terraform for infrastructure-as-code automation and database pipeline management, lowering transaction latency between application runtimes and backing datastores [CE004, CE005]. As part of this architectural evolution away from a legacy PHP monolith, Mollie transitioned critical transactional domains to a dynamic Java microservices ecosystem orchestrated by Temporal [CE006]. In the merchant onboarding domain, Temporal workflows execute fault-tolerant, long-running business processes mapped directly to code, handling concurrent verification tasks and ensuring transactional resilience during high-throughput peaks [CE006]."
    claimRefs:
      - "CE004"
      - "CE005"
      - "CE006"
    tableRefs:
      - "TE003"
  - id: "platform-expansion-and-merchant-governance"
    title: "Platform Expansion, In-Person Commerce, and Risk Governance"
    body: "Mollie has broadened its product footprint beyond standard e-commerce acquiring into embedded platform finance and omnichannel point-of-sale operations [CE007, CE008]. Through Mollie Connect, software platforms, marketplaces, and SaaS providers embed and monetize payment processing and financial services for sub-merchants, supported by dedicated solutions engineering teams managing complex multi-entity onboarding, regulatory compliance, and marketplace fund flows [CE007]. Simultaneously, Mollie introduced physical payment terminals and mobile application solutions alongside Mollie Capital, providing merchants with integrated in-person transaction acceptance and flexible working capital financing directly from payment cash flows [CE008]. To protect platform integrity and comply with European payments regulations, Mollie enforces rigorous automated and manual merchant acceptance policies, outright prohibiting high-risk categories including illegal activities, deceptive marketing, unlicensed gambling, and unapproved pharmaceuticals [CE009, CE010]."
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE010"
    tableRefs:
      - "TE002"
