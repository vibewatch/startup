callouts:
  - calloutType: "insight"
    title: "Architectural Decoupling via Temporal Workflows"
    body: "Mollie's adoption of Temporal workflows represents a pivotal technical inflection point in its transition away from a monolithic PHP architecture. By mapping complex multi-step merchant onboarding processes directly to code, the platform achieves deterministic fault tolerance and concurrency across distributed microservices, significantly mitigating operational failure modes during periods of rapid merchant expansion [CE006]."
    claimRefs:
      - "CE006"
  - calloutType: "risk"
    title: "Platform Governance and Strict Merchant Policy Exclusions"
    body: "While Mollie's automated onboarding enables swift merchant setup, the platform maintains non-negotiable policy exclusions against high-risk categories, including bidding auctions, trust services, and unlicensed digital services. Strict compliance gating ensures platform safety and acquirer trust but restricts addressable merchant volume compared to less risk-averse competitors [CE009, CE010]."
    claimRefs:
      - "CE009"
      - "CE010"
