callouts:
  - calloutType: insight
    title: Strategic Advantage of Hyper-Localized Payment Rail Integration
    body: >-
      Unlike US-centric payment processors that rely primarily on credit card networks, European ecommerce conversion is heavily dictated by domestic payment methods such as iDEAL in the Netherlands and Bancontact in Belgium. Mollie's single-API integration of over 35 local methods creates an immediate conversion lift for merchants expanding across borders within the EEA, serving as its primary adoption wedge against global competitors.
    claimRefs:
      - CM003
      - CM006
      - CM007
  - calloutType: risk
    title: Underwriting Friction and Account Action Vulnerability in SMB Scaling
    body: >-
      As a Payment Facilitator operating under Dutch DNB and UK FCA regulatory supervision, Mollie enforces rigorous automated anti-money laundering and risk controls. Review aggregator evidence highlights merchant dissatisfaction regarding unexpected fund holds, transaction freezes, and opaque dispute handling during risk re-assessments, representing an operational friction point that threatens merchant retention.
    claimRefs:
      - CM012
      - CM013
      - CM014
