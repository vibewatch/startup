    title: Market Boundary Definition and Addressable Spend Taxonomy
    columns:
      - Category
      - Included Spend
      - Excluded Spend
      - Primary Buyer
      - Strategic Relevance
    rows:
      - - Online Checkout & APMs
        - Domestic debit (iDEAL, Bancontact), credit cards, digital wallets, and regional BNPL
        - Direct bilateral interchange contracts negotiated with global enterprises
        - SMB Founder / Head of Ecommerce
        - Foundation of Mollie's volume and transaction-based margin across the EEA
      - - In-Person POS Payments
        - Integrated smart terminals (Mollie Tap, POS terminals), card processing, and omnichannel sync
        - Proprietary legacy electronic cash register hardware leases
        - Retail Store Owner / Operations Manager
        - Critical driver for unified commerce expansion and in-store merchant retention
      - - Embedded Platform Payments
        - Sub-merchant KYC onboarding, split payouts, marketplace fee deduction (Mollie Connect)
        - Full banking balance sheet credit intermediation and white-label consumer banking
        - Platform CTO / VP Product
        - High-growth distribution channel leveraging vertical SaaS ecosystems across Europe
      - - Growth Financing & Working Capital
        - Revenue-based advances (€500 to €500,000) repaid through daily merchant transaction settlement
        - Long-term fixed commercial real estate bank debt and revolving credit lines
        - Chief Financial Officer / Business Owner
        - Value-added monetization layer improving merchant stickiness and platform lifetime value
    notes: "Taxonomy established from Mollie official growth and legal documentation (2026), reflecting service boundary definitions."
