    rows:
      - - Digital SMB Ecommerce
        - Founder / Head of Ecommerce
        - Multi-method web checkout (iDEAL, Bancontact, Cards, Klarna, Riverty)
        - Marketing / Digital Operations Budget
        - Fast no-code / low-code plugin setup without upfront fees or long-term contracts
        - Sensitivity to transaction fee markups and automated risk reserve holds
      - - Omnichannel Mid-Market
        - Chief Commercial / Operating Officer
        - Unified online and offline payment tracking via Mollie Terminal & Tap
        - Commercial / IT Operations Budget
        - Single consolidated dashboard replacing disparate in-store and online merchant providers
        - Limited 24/7 dedicated enterprise support compared to global corporate processors
      - - Vertical SaaS & Marketplaces
        - VP Product / Platform CTO
        - Embedded sub-merchant onboarding, automated split payments, and platform fee routing
        - Product Development & Technology Budget
        - Regulatory relief under Mollie's Payment Facilitator / EMI licensing framework
        - Liability allocation under platform user agreement and strict prohibited industry lists
    notes: "Derived from comparative operational reviews (VerityStrat, OPP, RFP.wiki) and Mollie platform agreement terms."
