  - id: TM002
    title: Market Sizing Layers and Serviceable Opportunity Lenses
    columns:
      - Sizing Layer
      - Geographic Scope
      - Key Market Segments
      - Typical Economics
      - Adoption Drivers
      - Sizing Constraints
    rows:
      - - Total Addressable Market (TAM)
        - Pan-European / EEA & UK
        - Total retail & digital commerce payments across 30+ EEA nations
        - Low net-take-rate wholesale volume across international card rails
        - Shift from cash to electronic payments; cross-border single market commerce
        - Dominated by sovereign banking clearing systems and wholesale tier-1 acquirers
      - - Serviceable Addressable Market (SAM)
        - 30 EEA Markets, UK, Switzerland
        - European SMB, mid-market ecommerce, and vertical SaaS platforms
        - Blend of transaction-based processing fees and value-added SaaS subscriptions
        - Hyper-localized payment method coverage (35+ APMs) and simplified API integration
        - Enterprise buyers migrating to custom interchange-plus direct scheme connections
      - - Serviceable Obtainable Market (SOM)
        - Core markets (Benelux, DACH, France, UK)
        - Digital-first SMBs, webshop merchants, and integrated platform sub-merchants
        - Standardized transparent transaction fee structure with zero setup or monthly lock-in
        - Prebuilt plugins for Shopify, WooCommerce, Shopware, and rapid self-serve KYC
        - Competition from regional specialists and operational risk controls capping merchant volume
    notes: "Sizing lenses reflect European merchant payment processing structures and Mollie's declared operational footprint."
    claimRefs:
