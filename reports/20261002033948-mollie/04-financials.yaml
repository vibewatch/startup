company:
  name: "Mollie"
chapter:
  number: 4
  title: "Financials"
  summary: "Company-supplied 2024 results reported EUR 214 million of revenue, EUR 115 million of gross profit, and positive EBITDA, but public evidence does not disclose current cash, burn, runway, realized pricing, or cohort unit economics. Mollie's usage-linked payment model has credible operating leverage, while capital adequacy and revenue quality remain material data-room questions rather than underwritten conclusions."
sections:
  - id: "revenue-model"
    title: "Revenue model and monetization"
    body: >-
      Mollie monetizes a broad financial-services surface rather than a single
      subscription product. Its current site presents online and in-person
      payments, subscriptions, funding, reconciliation, and fraud prevention,
      while the user agreement identifies transaction and POS processing fees,
      risk-service charges, and other account-related fees [CI001, CI003].
      Standard merchant messaging is usage-led: Mollie says there are no minimum
      costs and no lock-in contracts, although that statement is not evidence of
      realized pricing for larger merchants [CI002]. Additional mechanisms
      include a usual 2% foreign-exchange mark-up unless otherwise agreed and
      Mollie Connect economics involving application fees, payment splitting,
      referral commissions, and potentially separately invoiced gross
      settlements [CI004, CI005]. This mix links revenue to merchant activity,
      payment-method mix, negotiated rates, and attachment of adjacent products;
      the public pool does not quantify revenue mix by stream.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
    tableRefs:
      - "TI001"
  - id: "commercial-motion"
    title: "Pricing, distribution, and commercial traction"
    body: >-
      The public commercial motion combines direct, low-friction merchant
      acquisition with platform distribution. Mollie's current site says test
      keys are available without a sales call or contract, while Mollie Connect
      lets platforms manage sub-merchants and participate in payment economics
      [CI002, CI005]. A company-issued UK announcement syndicated by FF News said
      the UK team grew from 16 to 26 people after triple-digit year-over-year
      growth in the first quarter of 2024; this is a directional GTM signal, not
      a disclosed CAC or payback measure [CI011]. Company surfaces also report
      serving at least 250,000 businesses, but neither account-level activity nor
      customer concentration is available [CI010]. Historical transaction
      volume demonstrates scale rather than current revenue: Mollie said it
      processed more than EUR 10 billion in 2020 and expected more than EUR 20
      billion in 2021 [CI012]. Current TPV, realized take rate, sales cycle,
      channel commissions, and cohort retention remain unavailable.
    claimRefs:
      - "CI002"
      - "CI005"
      - "CI010"
      - "CI011"
      - "CI012"
    tableRefs:
      - "TI002"
  - id: "economics-and-capital"
    title: "Economics, cost structure, and capital adequacy"
    body: >-
      A syndicated company-results article reported 2024 revenue of EUR 214
      million, up 28%, and gross profit of EUR 115 million, up 30% [CI006,
      CI007]. Those values imply a 53.7% gross-profit-to-revenue ratio, calculated
      from the reported figures rather than independently filed accounts
      [CI008]. The same article said operating expenses were stable and EBITDA
      became positive for the first time since 2018, but it did not disclose the
      EBITDA amount, operating cash flow, or net income [CI009]. The legal terms
      show that transaction economics can include financial-institution charges,
      risk-based costs, reserves, chargeback exposure, and delayed settlements;
      the allocation of these effects between reported revenue, cost of revenue,
      and working capital cannot be reconstructed from the pool [CI003]. A
      third-party modeling page explicitly says its underlying deck disclosed no
      revenue, EBITDA, or net-revenue figures and labels take-rate inputs as
      industry benchmarks, so its scenario values are not treated as Mollie
      actuals [CI015].
    claimRefs:
      - "CI003"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI009"
      - "CI015"
    tableRefs:
      - "TI003"
  - id: "underwriting-verdict"
    title: "Underwriting verdict and blockers"
    body: >-
      The strongest public signal is improving 2024 operating leverage: gross
      profit grew slightly faster than revenue while reported operating expenses
      remained stable and EBITDA turned positive [CI006, CI007, CI009]. The
      historical capital base is substantial but should not be confused with
      liquidity: Mollie and Tracxn describe an USD 800 million Series C in 2021
      and more than USD 940 million of cumulative funding, yet neither source
      establishes cash available in 2026 [CI013]. Mollie remains private, and
      public secondary-market pages either provide no public financial value or
      place revenue and financial details behind investor onboarding [CI014].
      Revenue quality is therefore promising but not fully underwritable. The
      central diligence blockers are current TPV and net take rate, payment-method
      and geography mix, merchant churn and concentration, exact EBITDA and cash
      conversion, cash and debt balances, burn, runway, and forward financing
      triggers. Mollie's explicit exclusion of businesses presenting legal,
      regulatory, financial, compliance, or reputational risk also creates a
      real merchant-eligibility boundary that must be reflected in volume
      forecasts [CI016].
    claimRefs:
      - "CI006"
      - "CI007"
      - "CI009"
      - "CI013"
      - "CI014"
      - "CI016"
    figureRefs:
      - "FI001"
