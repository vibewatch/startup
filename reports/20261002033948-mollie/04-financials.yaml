  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "capital-adequacy"
      missingEvidence: "Current unrestricted cash, operating cash flow, accounting burn, runway, debt facilities, covenants, planned use of funds, and next financing trigger."
      whyItMatters: "Historical funding raised cannot establish current liquidity or the capacity to fund growth and obligations."
      diligencePath: "Obtain the latest signed balance sheet, monthly cash-flow statement, debt schedule, covenant package, board-approved budget, and downside financing plan."
      relatedQuestionRefs:
        - "QI006"
      relatedTableRefs:
        - "TI003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "unit-economics"
      missingEvidence: "Current TPV, gross and net take rate, payment-method mix, CAC, payback, logo churn, NRR, LTV, and merchant concentration by cohort."
      whyItMatters: "These inputs determine whether reported growth reflects durable cohort expansion and attractive acquisition economics."
      diligencePath: "Request quarterly merchant cohorts by acquisition channel, geography, size, and payment method with reconciled TPV, revenue, direct cost, and churn."
      relatedTableRefs:
        - "TI002"
        - "TI003"
    - type: "missing-source"
      severity: "material"
      topic: "financial-statements"
      missingEvidence: "Signed primary financial statements supporting 2024 revenue, gross profit, EBITDA, net income, cash flow, and revenue-recognition classifications."
      whyItMatters: "The retained 2024 results are company-supplied metrics syndicated by a news outlet rather than complete primary accounts."
      diligencePath: "Obtain statutory filings or audited statements and reconcile each reported KPI to the financial statements."
      relatedTableRefs:
        - "TI003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "revenue-mix"
      missingEvidence: "Revenue and gross-profit mix by product, payment method, geography, merchant segment, channel, and list-versus-realized pricing."
      whyItMatters: "Without mix and realized pricing, the durability of take rate and the source of gross-profit growth cannot be isolated."
      diligencePath: "Request monthly revenue and contribution-profit bridge by stream with rate cards, discounts, channel shares, and accounting treatment."
      relatedTableRefs:
        - "TI001"
        - "TI002"
