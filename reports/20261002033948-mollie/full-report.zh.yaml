      - number: '2.4'
        title: 图表
        blocks:
          - type: callout
            title: 超本地化支付轨道集成的战略优势
            body: >-
              与主要依赖信用卡网络、以美国为中心的支付处理商不同，欧洲电商转化高度受 iDEAL（荷兰）和 Bancontact（比利时）等国内支付方式影响。Mollie 通过单一 API 集成超过 35 种本地方式，为在
              EEA 内跨境扩张的商户立即提升转化率，成为其对抗全球竞争者的主要切入口。
            calloutType: insight
            claimRefs:
              - CM003
              - CM006
              - CM007
          - type: callout
            title: 中小企业扩张中的承保摩擦与账户处置风险
            body: >-
              Mollie 作为受荷兰 DNB 和英国 FCA 监管的 Payment
              Facilitator，执行严格的自动化反洗钱和风险控制。评论聚合平台的证据显示，商户对风险重新评估期间意外冻结资金、暂停交易及争议处理不透明感到不满，这种运营摩擦可能威胁商户留存。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
              - CM014
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 欧洲支付格局与竞争定位
        blocks:
          - type: paragraph
            body: >-
              欧洲支付服务市场高度碎片化，既有根深蒂固的传统银行收单商、全球企业支付平台，也有现代区域金融科技公司。过去，商户面对传统国家级收单商时，往往要承担高昂启动成本、僵化的多年合同和繁琐集成。Mollie 以 API
              优先的支付服务商（PSP）模式正面竞争：无最低承诺、无锁定合同，并支持快速数字化入驻。根据战略文件，公司希望从传统玩家手中承接流失商户，服务中小企业，并向上拓展至总支付量（TPV）在 €1 million 至
              €50 million 的中型商户。相比 Adyen 等全球企业型竞争者和 Stripe 等开发者平台，Mollie 以欧洲本地化为核心，支持荷兰 iDEAL、比利时 Bancontact、德国 Giropay
              等主流国内方案，同时覆盖泛欧洲 SEPA 银行转账和直接借记。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
