        - 跟踪
        - 覆盖 250,000 多家企业，SME 市场基础广泛，但近期缺少经审计的合并财务披露。
        - 保持主动跟踪；在估值重置或出现合并审计前，不新增股权资本承诺。
      - - 信心
        - 中
        - 已有经核实的资本化和融资轮定价数据，但 2021 年后的二级市场估值及 GoCardless 整合指标未公开。
        - 在纳入投资判断前，需针对客户群净留存和合并经营利润率开展尽调。
      - - 风险评级
        - 中
        - $800M Series C 提供现金缓冲，资产负债表资不抵债风险较低，但需权衡倍数压缩和执行负担。
        - 任何私募大宗购买都应设置清算优先权、反稀释条款等下行保护。
      - - 估值立场
        - 偏高
        - 最近一轮定价 $6.5B，对应收入 26.4 倍，显著高于正常化后的公开支付公司倍数。
        - 在二级市场交易中，争取以低于 Series C 投后估值 35% 至 50% 的价格入场。
