      - number: '2.2'
        title: 市场规模视角与细分约束
        blocks:
          - type: paragraph
            body: >-
              评估 Mollie
              的可服务机会，不能只看一个笼统的全球支付数字，而要按不同可服务边界拆分支付总量。欧洲数字商业和支付处理总市场的交易总额达数千亿美元，但独立网关可获得的净商户服务费（MSC）收入会受到代收代付的卡组织费和交换费限制。在欧洲经济区和英国，Mollie
              的可服务市场聚焦于中小企业、中型零售商，以及在 30 多个欧洲国家运营的平台商户。荷兰 iDEAL、比利时 Bancontact 和 Riverty 等区域 BNPL 方式扩大了本地支付覆盖，推动增长。但
              Adyen 等玩家掌握企业级客户，且客户不愿在没有定制交换费加价定价的情况下承担按交易计费的利润空间，市场份额仍受约束。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.3'
        title: 买方画像、增长驱动与运营约束
        blocks:
          - type: paragraph
            body: >-
              Mollie 的核心客户分为三类买方画像：数字原生中小商户、正在扩张的中型全渠道零售商，以及提供嵌入式金融流程的软件即服务（SaaS）平台。在中小企业中，经济决策人通常是创始人、总经理或电商负责人，他们看重在
              Shopify、Shopware、WooCommerce 等主流电商平台上快速即插即用。对中型市场和 SaaS 平台商户而言，技术负责人和财务控制人掌握采购决策，会评估合作伙伴 API、Mollie
              Connect 的分账逻辑，以及与后端 ERP 系统的对账能力。主要增长动力包括 PSD2/PSD3
              等监管顺风、即时银行支付扩张，以及把网页结账连接到线下终端的统一商务需求上升。限制因素则是运营摩擦：承保审查期间因风险触发资金冻结或商户账户限额、缺少定制化非欧盟收单轨道，以及开发团队对复杂多市场税务和结算报告进行对账的额外负担。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM014
