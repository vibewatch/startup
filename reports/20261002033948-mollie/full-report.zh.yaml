              - CV003
              - CV004
              - CV007
              - CV010
      - number: '8.2'
        title: 融资历史、倍数变化与反论点
        blocks:
          - type: paragraph
            body: >-
              Mollie 的资本化经历三轮核心股权融资：2019 年 7 月 $28 million A 轮，2020 年 9 月由 TCV 领投、估值超过 $1 billion 的 $106 million B 轮，以及
              2021 年 6 月由 Blackstone Growth 领投、EQT Growth、General Atlantic、HMI Capital、Alkeon Capital 和 TCV 参与的 $800
              million C 轮。根据私募市场可比公司分析，C 轮按 $246 million 已记录收入对应 26.4x 隐含收入倍数定价，高于 B 轮的 16.7x（收入 $60 million）。反论点是，26.4x
              反映 2021 年市场高峰，如今欧洲及全球可比上市支付处理商的倍数已压缩至 5x 至 9x。此外，IPO 前和二级交易平台披露，私人投资仍缺乏流动性且具投机性，存在全部损失风险；Mollie
              标准用户协议也明确将公司定位为技术服务商，不对商户交易承担直接责任。
            claimRefs:
              - CV002
              - CV003
              - CV005
              - CV006
              - CV007
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
