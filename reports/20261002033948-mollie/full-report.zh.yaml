      - number: '3.2'
        title: 产品能力、定价结构与套餐
        blocks:
          - type: paragraph
            body: >-
              Mollie 的商业模式是透明的按交易计费混合定价，标准线上套餐不收月度维护费；传统收单商则常收复杂账单费和终端租赁费。在 EEA 内线上收卡，Mollie 对 Visa 和 Mastercard
              标准消费者卡列价 1.80% + €0.25，商业卡为 2.90% + €0.25，非 EEA 卡为 3.25% + €0.25。国内账户到账户方式按固定费率收费，例如 SEPA Bank Transfer
              €0.25、SEPA Direct Debit €0.35。对增长型和高交易量商户，月交易量超过 €100,000 时可提供定制 Interchange++（IC++）定价。除电商网关外，Mollie 还以
              Mollie Terminal 拓展统一商务：Pay as you go 线下套餐月费 €0、国内卡交易费率 1.20%；Pro 套餐月费 €20，将交易费率降至 0.85% + €0.10。此外，Mollie
              提供每月 $9 的集成 Business Accounts（促销期 12 个月免费），包括专属 IBAN、多币种处理和费用卡。
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP009
