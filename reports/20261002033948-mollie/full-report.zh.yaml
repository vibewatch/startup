chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、监管定位与商业模式
        blocks:
          - type: paragraph
            body: >-
              Mollie B.V. 是一家荷兰支付及金融服务提供商，由 Adriaan Mol 于 2004 年在阿姆斯特丹创办（CO001）。集团作为持牌支付服务商运营，受 De Nederlandsche Bank
              监管，客户编号为 F0038；并以关联基金会 Stichting Mollie Payments（SMP）隔离和保障商户资金（CO002）。Mollie 按国家和支付方式收取交易费，从卡组织、SEPA 直接借记及
              iDEAL 等本地方式的支付处理中获利。公司明确定位为支付促进商，而非 Merchant of Record，因此商户承担直接的卖方法律责任和税务申报责任（CO003）。根据用户协议，Mollie
              不对商户产品承担责任，严格禁止掠夺性或高风险服务，并采用滚动准备金、总费用结算等自动化风险控制（CO004）。除核心数字支付处理外，Mollie 还扩展至线下支付、营运资金融资和嵌入式企业银行服务（CO005）。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
