      - number: '3.3'
        title: 护城河韧性、切换动态与市场空白
        blocks:
          - type: paragraph
            body: >-
              Mollie 的竞争护城河来自欧洲支付方案的深度本地化、为 WooCommerce、Adobe Commerce/Magento 和 Shopify
              等电商平台预制插件，以及相较传统收单商更高的客户满意度。基础处理不收固定月费且没有锁定合同，降低了成长型网店的采用门槛。但没有合同锁定也带来多归属风险：若价格或结算条款恶化，商户可把交易转向其他网关或竞争者。Stripe、Adyen
              等全球巨头拥有更深的国际结算网络、更成熟的跨境税务工具和更强资本实力；Square、SumUp 等专业玩家则在微型商户线下 POS 中拥有强品牌。Mollie
              严格的可接受使用政策限制高风险金融服务、未监管博彩和成人娱乐，既保护平台合规，也缩小可服务商户范围。Mollie 能否长期留住中小及中型商户，将取决于账单、资本融资和企业账户等更广泛金融运营软件的采用。
            claimRefs:
              - CP002
              - CP011
              - CP012
              - CP015
              - CP016
      - number: '3.4'
        title: 图表
        blocks:
