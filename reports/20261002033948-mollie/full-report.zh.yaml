  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Mollie 变现的是广泛的金融服务，而非单一订阅产品。官网展示线上和线下支付、订阅、融资、对账及反欺诈；用户协议则列明交易和 POS 处理费、风险服务费及其他账户费用 [CI001,
              CI003]。标准商户信息以使用量为核心：Mollie 声称无最低费用、无锁定合同，但这不能证明大型商户的实际定价 [CI002]。其他机制包括通常 2% 的外汇加价（除非另有约定），以及 Mollie
              Connect 的申请费、分账、推荐佣金和可能单独开票的总额结算 [CI004, CI005]。收入因此取决于商户活动、支付方式组合、协商费率及相邻产品附着率；公开资料没有量化各收入来源的占比。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
