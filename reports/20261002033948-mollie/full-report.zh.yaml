        - EBA / 国家主管机构（DNB）
        - 严格的 ICT 第三方风险管理、数字运营韧性测试与统一事件报告
        - 管理 Google Cloud 的云供应商 SLA，并实施故障切换冗余协议
        - 中
      - - Payment Card Scheme Rules (PCI-DSS)
        - Visa / Mastercard / PCI Security Standards Council
        - 持卡人数据安全合规、年度 PCI Level 1 AOC 鉴证与拒付监控计划阈值
        - 采用令牌化支付组件，将持卡人数据与商户应用层隔离
        - 高
