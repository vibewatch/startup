      - number: '4.2'
        title: 定价、分销与商业进展
        blocks:
          - type: paragraph
            body: >-
              公开商业动作结合了直接、低摩擦的商户获客与平台分销。Mollie 官网称无需销售沟通或签约即可获取测试密钥；Mollie Connect 则允许平台管理子商户并参与支付经济 [CI002, CI005]。FF
              News 转发的一则公司发布英国公告称，英国团队在 2024 年第一季度实现三位数同比增长后，人数从 16 人增至 26 人；这只是方向性 GTM 信号，并非披露的 CAC 或回本指标
              [CI011]。公司渠道还称服务至少 250,000 家企业，但账户层面的活跃度和客户集中度均不可得 [CI010]。历史交易量证明的是规模，不是当前收入：Mollie 称 2020 年处理超过 EUR 10
              billion，预计 2021 年超过 EUR 20 billion [CI012]。当前 TPV、实际 take rate、销售周期、渠道佣金和队列留存仍不可得。
            claimRefs:
