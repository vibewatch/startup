  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 支付平台架构与开发者体验
        blocks:
          - type: paragraph
            body: >-
              Mollie 将核心处理平台做成模块化支付基础设施，为网店、软件平台和企业商户抽象欧洲支付碎片化 [CE001]。平台通过统一 API 和可嵌入前端 Components 支持超过 35
              种本地及国际支付方式，包括 iDEAL、Cartes Bancaires、Visa、Mastercard、PayPal 和 Klarna [CE001, CE002]。开发者可用
              @mollie/api-client 等惯用 SDK 操作支付引擎，以简单 REST 调用指定币种、金额、跳转目标和异步 webhook URL，实时更新交易状态 [CE002]。除直接 REST API
              集成外，Mollie 还为 Adobe Commerce Cloud、WooCommerce 和 Salesforce Commerce Cloud
              等企业及中型市场环境提供预制插件，减少人工数据交接，自动完成外部企业系统中的订单到现金对账 [CE003]。
            claimRefs:
              - CE001
              - CE002
              - CE003
