  - id: FE001
    title: Mollie 支付技术与架构栈
    type: stack
    summary: 六层架构覆盖开发者接入点、工作流编排、云基础设施及合作伙伴网络。
    data:
      layers:
        - label: 客户集成层
          detail: 可嵌入组件、托管结账页面及 SDK（@mollie/api-client）
        - label: API 网关与入口
          detail: 处理支付创建、令牌化和身份验证的 REST 端点
        - label: 工作流编排引擎
          detail: 管理容错商户接入和状态的 Temporal 工作流集群
        - label: 应用与微服务层
          detail: 管理支付生命周期和 webhooks 的 Java、PHP 容器化服务
        - label: 云与数据基础设施
          detail: Google Kubernetes Engine（GKE）、Cloud SQL 数据库及 Terraform 流水线
        - label: 支付清算与结算
          detail: 直接连接欧洲支付体系（iDEAL、CB）、卡组织及 Klarna
    approximationNotes: 基于经核实的公开技术演示、职位说明和云案例研究的逻辑架构表示。
    claimRefs:
      - CE002
      - CE004
      - CE006
      - CE011
  - id: FU001
    title: 客户采用与扩张旅程
    type: journey-map
    summary: 从资格审查到支付采用、平台扩张和持久性监控的非量化流程。
    data:
      items:
        - label: 资格审查
          detail: 企业核查其产品、服务和司法管辖区是否符合 Mollie 的受理政策。
          touchpoints:
            - 可接受使用指南
            - 账户申请
        - label: 验证
          detail: Mollie 在开放完整服务访问和余额打款前，核查企业、所有权及风险。
          touchpoints:
            - 注册
            - KYC 信息请求
        - label: 支付启用
          detail: 商户接入线上或线下收款，并选择相关支付方式。
          touchpoints:
            - 支付集成
            - 控制面板
        - label: 运营采用
          detail: 财务和支持团队使用对账、退款、争议及报告工作流。
          touchpoints:
            - 对账
            - 退款与争议处理
        - label: 平台扩张
          detail: 市场可以通过 Connect 连接子商户、收取费用，并路由或拆分支付。
          touchpoints:
            - Mollie Connect
            - 合作伙伴支付方式
        - label: 持久性审查
          detail: 留存、打款摩擦、地域适配度和客户集中度需要客户群与投资组合证据。
          touchpoints:
            - 风险审查
            - 续约与客户群尽调
    approximationNotes: 基于官方条款和指定客户证据综合出的分析流程；不衡量转化率、持续时间或阶段间留存。
    claimRefs:
      - CU011
      - CU012
      - CU013
      - CU015
