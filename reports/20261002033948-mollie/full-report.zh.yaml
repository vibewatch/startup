      - number: '7.2'
        title: 商户承保、拒付敞口与交易对手信用风险
        blocks:
          - type: paragraph
            body: >-
              作为商户收单商和支付服务商，Mollie 承担由商户经营失败、消费者争议和拒付引发的重大二阶交易对手信用风险与运营责任 [CR005, CR006]。根据 Visa、Mastercard
              及欧洲直接借记方案制定的国际卡组织规则，若商户破产或未能交付预付商品或服务，商户收单商最终仍须向持卡人退款 [CR005]。 为防范灾难性信用和欺诈损失，Mollie
              严格划分商户风险，并明确禁止未经授权的药品、无牌博彩、二元期权和欺骗性营销 [CR006]。用户协议允许平台在争议率升高、交易速度异常或欺诈信号增强时要求滚动准备金、扣留商户结算款或立即单方面冻结账户
              [CR005, CR007]。这些风险扣留可隔离无法追回的拒付，但也会让调查期间现金流受扰的合规商户承受摩擦 [CR005, CR007]。除标准收单争议外，Mollie 通过 Mollie Capital
              扩展商户现金预支，带来资产负债表信用敞口和违约风险；在零售需求收缩的宏观环境下，中小企业商户队列尤为脆弱 [CR008]。
