        blocks:
          - type: paragraph
            body: >-
              Mollie 将产品范围从标准电商收单扩展到嵌入式平台金融和全渠道 POS 运营 [CE007, CE008]。借助 Mollie Connect，软件平台、市场和 SaaS
              提供商可为子商户嵌入并变现支付处理和金融服务；专门的解决方案工程团队负责复杂的多实体入驻、监管合规和市场资金流 [CE007]。同时，Mollie 推出实体支付终端和移动应用方案，并配合 Mollie
              Capital，让商户直接从支付现金流获得一体化线下收款和灵活营运资金融资 [CE008]。为保护平台完整性并遵守欧洲支付监管，Mollie
              严格执行自动和人工商户准入政策，明确禁止非法活动、欺骗性营销、无牌博彩和未经批准的药品等高风险类别 [CE009, CE010]。
