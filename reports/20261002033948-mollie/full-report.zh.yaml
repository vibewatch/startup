        - id: fee-events
          label: 产生费用的事件
          detail: 交易、POS、FX、Connect 及风险服务
        - id: revenue
          label: 2024 年收入
          value: EUR 214 million
          detail: 公司披露；增长 28%
        - id: direct-costs
          label: 直接交付成本
          detail: 金额和方式组合不可用
        - id: gross-profit
          label: 2024 年毛利
          value: EUR 115 million
          detail: 公司披露；增长 30%
        - id: operating-expenses
          label: 运营费用
          detail: 披露为稳定；金额不可用
        - id: ebitda
          label: 2024 年 EBITDA
          value: Positive
          detail: 具体金额和利润率不可用
      edges:
        - from: merchant-activity
          to: fee-events
          label: 活动与产品使用
        - from: fee-events
          to: revenue
          label: 实现的定价与组合
        - from: revenue
          to: direct-costs
