      - number: '4.3'
        title: 经济性、成本结构与资本充足性
        blocks:
          - type: paragraph
            body: >-
              一篇公司业绩文章经转载披露，Mollie 2024 年收入为 EUR 214 million，同比增长 28%；毛利润为 EUR 115 million，同比增长 30% [CI006,
              CI007]。据此计算，毛利润 / 收入比为 53.7%，但计算依据是报道数字，而非独立提交的账目 [CI008]。文章还称运营费用稳定，EBITDA 自 2018 年以来首次转正，但未披露 EBITDA
              金额、经营现金流或净利润 [CI009]。法律条款显示，交易经济性可能包含金融机构费用、风险成本、准备金、拒付风险及延迟结算；这些影响如何分摊至报告收入、收入成本和营运资金，无法从公开资料还原
              [CI003]。第三方建模页面明确称其底层材料没有披露收入、EBITDA 或净收入数字，并将 take rate 输入标为行业基准，因此其情景值不视为 Mollie 实际数据 [CI015]。
            claimRefs:
              - CI003
              - CI006
              - CI007
              - CI008
              - CI009
              - CI015
