  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、支出分类与欧洲碎片化
        blocks:
          - type: paragraph
            body: >-
              欧洲数字支付行业与北美市场的结构性差异在于地理高度碎片化：国内借记支付轨道和本地化替代支付方式（APM）占据大量消费者交易量，超过国际卡组织。Mollie
              主要处于欧洲商户收单和支付促进商（PayFac）层，为线上结账、线下 POS 终端和经常性账单提供统一 API
              集成。可服务支出包括交易处理费、交换费加价，以及欧洲商户、电商网店和嵌入支付的软件平台产生的增值软件费。企业定制清算合同、非欧洲卡组织的全球交换费优化及高风险投机性金融交易则不在 Mollie
              平台架构范围内。替代方案从传统国内银行清算系统到全栈全球支付处理商不等，迫使 Mollie 在 EEA 内维持本地化合规，同时提供标准化自助入驻。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM009
          - type: figure
            figureRef: FM001
            claimRefs:
