      - number: '4.4'
        title: 投资判断与阻碍
        blocks:
          - type: paragraph
            body: >-
              最强的公开信号是 2024 年经营杠杆改善：毛利润增速略高于收入，报告的运营费用保持稳定，EBITDA 转正 [CI006, CI007, CI009]。历史资本基础可观，但不能等同于流动性：Mollie 和
              Tracxn 都提到 2021 年 USD 800 million C 轮及累计超过 USD 940 million 融资，但都没有证明 2026 年可用现金 [CI013]。Mollie
              仍是非上市企业；公开二级市场页面没有披露公开财务估值，或者把收入和财务细节置于投资者入驻之后 [CI014]。因此，收入质量有潜力，但还不足以完全纳入投资判断。核心尽调阻碍包括当前 TPV 和净 take
              rate、支付方式及地域组合、商户流失与集中度、确切 EBITDA 和现金转换、现金及债务余额、消耗、现金跑道和未来融资触发条件。Mollie
              明确排除存在法律、监管、金融、合规或声誉风险的企业，这也构成真实的商户准入边界，必须反映在交易量预测中 [CI016]。
