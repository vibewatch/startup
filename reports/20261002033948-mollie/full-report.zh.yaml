      - number: '5.2'
        title: 基础设施迁移、工作流编排与可扩展性
        blocks:
          - type: paragraph
            body: >-
              为支持欧洲市场交易量快速增长，Mollie 将核心应用基础设施从运行单体虚拟机的专用本地服务器迁移至托管在 Google Cloud 的云原生微服务架构 [CE004]。工程团队把服务容器化部署到 Google
              Kubernetes Engine（GKE），并采用 Terraform 自动化基础设施即代码和数据库流水线管理，降低应用运行时与后端数据存储之间的交易延迟 [CE004, CE005]。在摆脱旧 PHP
              单体架构时，Mollie 将关键交易域迁至由 Temporal 编排的动态 Java 微服务生态 [CE006]。在商户入驻域，Temporal
              工作流把长时间运行且容错的业务流程直接映射为代码，处理并发验证任务，在高吞吐峰值保持交易韧性 [CE006]。
