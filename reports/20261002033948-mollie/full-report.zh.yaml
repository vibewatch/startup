figures:
  - id: FO001
    title: Mollie 公司、融资与扩张里程碑时间线
    type: timeline
    summary: Mollie 从自力启动的支付网关发展为泛欧洲金融服务集团的时间演进。
    data:
      items:
        - label: 2004 成立
          detail: Mollie 由 Adriaan Mol 在 Amsterdam 创立，定位为面向网店的易用在线支付网关。
          tone: positive
        - label: 2019 Series A
          detail: 盈利自力运营 15 年后完成 $25M Series A 融资，用于欧洲扩张。
          tone: positive
        - label: 2020 Series B
          detail: 完成由 TCV 领投的 €90M（$106M）Series B，以超过 $1B 的估值晋身独角兽。
          tone: positive
        - label: 2021 Series C
          detail: 完成由 Blackstone Growth 领投的 $800M（€665M）Series C，估值达到 $6.5B。
          tone: positive
        - label: 2022 Mollie Capital
          detail: 在 Netherlands 和 UK 推出 Mollie Capital，提供快速、灵活的收入分成融资。
          tone: positive
        - label: 2023 Mollie Terminal
          detail: 推出 Mollie Terminal 和线下支付，进入欧洲统一商业市场。
          tone: positive
        - label: 2023 UK FCA 牌照
          detail: 从临时 EU passport 转为 UK FCA 授予的正式支付机构牌照。
          tone: positive
        - label: 2025 GoCardless 交易
          detail: 签署收购英国银行支付金融科技公司 GoCardless 的协议，整合经常性借记卡与卡支付。
          tone: positive
        - label: 2026 EEA 完成覆盖
          detail: 随着 Croatia 和 Iceland 上线，完成 EEA 30 个市场的全面覆盖，并承诺投入 €350M 促进欧洲增长。
          tone: positive
    approximationNotes: 日期代表经核实公司公告中的日历年或季度。
    claimRefs:
      - CO001
      - CO005
      - CO011
      - CO012
      - CO014
      - CO015
  - id: FM001
    title: 欧洲支付处理规模与市场机会分层
    type: pyramid
    summary: 概念性层级展示从欧洲数字商业总量到 Mollie 可获取的 SMB 商户交易量的结构性漏斗。
    data:
      items:
        - label: 欧洲商业总量（TAM）
          description: 最宽口径的交易量层，涵盖 30 多个欧洲国家的数字零售总支出。
        - label: 本地化网关服务层（SAM）
          description: 可触达的欧洲 SMB 与中型市场网店，需要本地 APM 和统一多币种结账。
        - label: 嵌入式平台与 PayFac 层
          description: 欧洲垂直 SaaS 平台和市场将子商户接入及分账支付嵌入其中。
        - label: 核心区域覆盖（SOM）
          description: 运营重点集中在转化率较高的 Benelux、DACH、French 和 UK 电商通道。
        - label: 活跃存量商户基础
          description: 已披露的活跃商户群超过 250,000 家，使用 Mollie 支付集成。
        - label: 增值变现层
          description: 存量商户采用销售点终端、Mollie Capital 预付款及账单自动化。
