      - number: '7.3'
        title: 市场集中、地域逆风与竞争替代
        blocks:
          - type: paragraph
            body: >-
              Mollie 面临 Stripe、Adyen 等全球全栈支付巨头，以及 Airwallex、Braintree 等跨境金融科技公司的强大战略和竞争压力 [CR009, CR010]。Mollie
              过去依靠荷兰、比利时和德国的本地支付轨道优势立足，但仍高度集中在西北欧电商走廊 [CR009, CR011]。竞争者通过统一全球收单架构、自有多币种账户和自动外汇转换，降低跨境交易成本，积极争夺 Mollie
              的软件平台、市场和中型网店客户 [CR010]。现代国际支付平台尤其将 Mollie 依赖固定交换费加价模式和本地支付覆盖，视为欧洲商户拓展北美或亚太市场时的结构性劣势
              [CR010]。大型电商及软件平台也可能采用原生嵌入式金融基础设施，或直接与全球处理网络签约，绕开纯支付网关 [CR010, CR012]。为守住净 take rate 利润率，Mollie 必须在通过
              Mollie Connect 积极向上销售、严格合规承保和资本效率之间取得平衡 [CR011, CR012]。
