  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管合规、牌照框架与监督治理
        blocks:
          - type: paragraph
            body: >-
              Mollie 以持牌 Payment Institution 身份在 EEA 运营，接受 De Nederlandsche Bank（DNB）直接授权和监督，并遵循 European Banking
              Authority 框架 [CR001]。依据荷兰金融监管法和欧洲 PSD2 指令，Mollie 将支付机构牌照通行至欧盟成员国，以开展收单、资金保障和结算服务 [CR001,
              CR002]。这些法定要求带来持续且广泛的治理义务，包括反洗钱（AML）控制、反恐融资（CTF）筛查，以及识别所有商户交易对手的最终受益人（UBO）[CR002,
              CR003]。商户必须提交完整公司身份文件、注册证明以及董事和主要股东的政府身份证明，账户才能获准完整结算 [CR002, CR003]。若合规流程不严密，机构可能遭受监管罚款、交易限制或行政牌照暂停等严厉制裁
              [CR001, CR004]。此外，DORA 实施和即将到来的 PSD3 等欧洲监管修订，要求持续投入第三方 ICT 风险监督、事故报告流程和多云运营韧性架构 [CR001, CR004]。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
