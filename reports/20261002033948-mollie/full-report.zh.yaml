              - CV012
              - CV013
      - number: '8.3'
        title: 情景估值建模与退出尽调
        blocks:
          - type: paragraph
            body: >-
              评估 Mollie 的乐观、基准和悲观情景，需要拆分交易量扩张、GoCardless 整合后的合并收入运行率以及可持续 EBITDA 利润率转换。基准情景假设商户收入持续两位数增长、欧洲市场份额稳定，对应内在估值
              $3.2 billion 至 $4.0 billion（8x 至 10x 净收入倍数），显著低于历史 $6.5 billion C 轮基准。乐观情景下，GoCardless
              经常性直接借记快速交叉销售、国际企业采用，以及 EBITDA 利润率升至 25% 以上，在有利的公开市场退出条件下可支撑估值回升至 $5.5 billion 至 $6.5
              billion。悲观情景假设整合摩擦持续、欧洲商户交易量停滞、收入倍数压缩至 4x 至 6x，对应下行估值 $1.8 billion 至 $2.4
              billion。要收敛这些估值区间，必须解决经审计合并账目和商户留存指标等关键尽调缺口。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV007
              - CV010
              - CV014
