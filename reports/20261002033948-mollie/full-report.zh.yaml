      - number: '8.4'
        title: 图表
        blocks:
          - type: callout
            title: 建议立场：等待估值重新锚定后跟踪
            body: >-
              Mollie 仍是欧洲领先的独立 PSP 平台之一，在 Benelux 深度集成，并持续扩展德国业务。但公开可比公司倍数自 2021 年中已收缩 50% 至 70%，潜在投资者不应按 $6.5 billion C
              轮估值基准或其附近价格进行投资判断。应暂缓投入资本，等待二级交易或新一轮一级融资把估值重新锚定到更接近基准情景倍数的水平。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV010
          - type: callout
            title: 结构性流动性与估值压缩风险
            body: >-
              UpMarket 等二级交易平台强调，IPO 前金融科技股缺乏流动性，存在全部损失风险。对 Mollie 而言，C 轮投资者 $800 million 清算优先权形成的悬置，加上历史隐含收入倍数
              26.4x，使普通股和早期轮次股权持有人在任何资本重组事件中都面临严重稀释或减值。
            calloutType: risk
            claimRefs:
              - CV002
