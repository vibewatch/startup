      - 投资正论
      - 投资反论
      - 论点失效或转向触发条件
    rows:
      - - 规模与覆盖
        - 覆盖 EEA 250,000 多家企业，以统一 API 无缝接入本地化支付通道。
        - 商户主要是小微 SME，宏观周期性倒闭率和支付量流失率更高。
        - 公开申报显示商户年流失率超过 20%，或活跃商户数连续下降。
      - - 融资基础
        - 股权融资额超过 $922M-$940M，背后有 Blackstone Growth、EQT、TCV 和 General Atlantic 等一线投资方支持。
        - 大额 Series C 优先股堆叠使估值低于 $6.5B 时普通股股东面临清算悬置。
        - 结构化降价轮融资或二级股份交易以低于 Series C 估值 50% 以上的折价成交。
      - - 估值倍数
        - 2021 年定价 $6.5B，反映出品类领先的 600% 区域扩张及交易处理快速增长。
        - 在利率正常化后的高利率环境中，公开可比公司按收入 5x 至 9x 交易，历史 26.4x 难以持续。
        - 后续经审计报表无法证明有机净收入同比增长超过 25%。
      - - 运营模式
        - 轻资产技术平台以技术服务商身份运营，标准商户协议限制其直接交易责任。
        - 合同责任免责声明及严格的接入可接受使用政策，限制了可触达的高交易量商户类别。
        - 监管机构重新分类，要求对商户交易对手信用风险进行全资产负债表层面的信用评估。
    notes: 综合监管文件、私募可比公司及平台披露中记录的竞争优势与结构性估值压力。
