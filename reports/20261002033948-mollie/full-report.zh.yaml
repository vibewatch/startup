        title: 高管领导、治理与运营规模
        blocks:
          - type: paragraph
            body: >-
              Mollie 的公司领导结构由创始人把舵、资深高管负责执行。创始人 Adriaan Mol 继续引领公司愿景；曾任 Klarna 首席技术官的首席执行官 Koen Köppen 负责日常运营。首席财务官
              Vincent Toolan 负责财务报告和资本配置；首席产品官 Rogier Schoute 与首席技术官 Marco dos Santos 负责产品开发和技术基础设施。公司运营规模超过 1,000
              名员工，员工来自 50 多个国籍，分布在阿姆斯特丹、里斯本、基尔和米兰等欧洲核心枢纽（CO009）。
            claimRefs:
