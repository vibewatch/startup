            title: 本地化：对抗全球网关的竞争护城河
            body: Mollie 在荷兰、比利时和德国等欧洲重点市场深度本地化，并集成 38 种支付方式，相较优先支持信用卡、忽视区域银行支付轨道的标准化全球网关，具备转化优势。
            calloutType: strength
            claimRefs:
              - CP002
              - CP005
              - CP013
          - type: callout
            title: 零锁定合同下的多归属风险
            body: Mollie 没有合同锁定，且按交易透明定价，因此商户切换壁垒相对较低。随着处理规模扩大，价格敏感型商户可以拆分交易量，或转向竞争收单商。
            calloutType: risk
            claimRefs:
