      - number: '1.3'
        title: 资本化历史、估值标记与战略里程碑
        blocks:
          - type: paragraph
            body: >-
              Mollie 前 15 年一直是创始人出资、自力成长且盈利的企业，之后才启动机构成长股融资。2020 年 9 月，Mollie 完成由 TCV 领投的 $106 million（€90 million）B
              轮融资，以超过 $1 billion 的估值跻身独角兽（CO011）。2021 年 6 月，公司完成由 Blackstone Growth 领投的 $800 million（€665 million）C
              轮融资，EQT Growth、General Atlantic、HMI Capital、Alkeon Capital Management 和 TCV 参与，投后估值达到 $6.5
              billion（CO012）。三轮主要机构融资累计带来超过 $940 million 外部成长股资金；之后，部分老股在 EquityZen 等私人流动性平台上挂牌（CO013）。2025 年 12
              月，Mollie 同意收购英国银行支付专业公司 GoCardless，推进重大整合，并将直接借记和开放银行能力扩展至合计超过 350,000 家商户（CO014）。2026 年 6 月，在完成 EEA
              市场覆盖后，Mollie 承诺投入 €350 million，在五年内支持欧洲增长和覆盖整个 EEA 的基础设施建设（CO015）。
