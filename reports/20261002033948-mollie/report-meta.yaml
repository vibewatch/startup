  topStrengths:
    - Large European merchant footprint with broad product coverage across payments, banking, and financing.
    - Reported 2024 revenue and gross profit show positive operating leverage and EBITDA inflection.
    - Disclosed capital base and historical funding support a substantial long-duration platform.
  topRisks:
    - Audited consolidated accounts and current cash-flow visibility remain missing after the GoCardless transaction.
    - Merchant retention, concentration, and unit economics are still not publicly underwritten.
    - Historical valuation remains rich versus post-2021 fintech multiples.
  unresolvedGaps:
    - >-
      Audited consolidated 2025 and 2026 financial statements reflecting GoCardless integration, balance sheet reserves,
      and segment profitability.
    - Merchant cohort-level churn, NRR, and LTV/CAC ratios remain undisclosed.
    - Revenue breakdown by geography and payment method remains undisclosed, limiting concentration analysis.
    - Current cash, burn, runway, debt, and financing trigger details remain unavailable.
