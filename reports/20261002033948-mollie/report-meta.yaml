companyProfile:
  summary: >-
    Mollie is a Dutch payments and financial-services platform founded in Amsterdam in 2004. It serves merchants across
    online and in-person payments, business accounts, financing, reconciliation, and fraud prevention, with a footprint
    above 250,000 businesses and more than $940 million in disclosed external capital. The company remains privately
    held, has completed EEA-wide expansion, and is working through the GoCardless transaction and its operating
    integration implications.
