callouts:
  - calloutType: "insight"
    title: "Proof of breadth is stronger than proof of durability"
    body: "Named users, company case studies, and the stated merchant base support broad adoption, but they do not reveal retained revenue, renewal behavior, or concentration. Investment diligence should therefore treat breadth and durability as separate hypotheses."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU005"
      - "CU008"
      - "CU016"
  - calloutType: "risk"
    title: "Risk controls can become customer friction"
    body: "Verification is a documented prerequisite to full access and payout, while a competitor-comparison page reports reviewer complaints about holds, blocks, and payout friction. The evidence identifies a mechanism and an adverse signal, not a measured churn impact."
    claimRefs:
      - "CU011"
      - "CU013"
