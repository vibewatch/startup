slug: "mollie"
runDate: "2026-10-02"
company:
  name: "Mollie"
chapter:
  number: 6
  title: "Customers"
  summary: "Mollie presents broad European merchant reach and publishes multiple quantified customer outcomes, while external technographic evidence supplies additional named-user examples. The evidence does not establish a single current customer-count baseline, cohort retention, renewal economics, or customer concentration, so adoption breadth is more defensible than durability."
sections:
  - id: "customer-base-and-segments"
    title: "Customer base and segments"
    body: >
      Mollie addresses business organizations rather than consumers: merchants use the service to
      accept online or in-person payments, while their end customers choose a payment method at
      checkout. Public evidence spans small digital merchants, established retailers and
      manufacturers, and software or marketplace platforms that connect sub-merchants. Mollie's
      own surfaces market a base above 250,000 European businesses and a single integration for
      38 payment methods, but the current homepage also renders an alternative "over 300,000"
      figure. Those variants should not be blended into a growth rate because neither defines
      active, paying, transacting, or cumulative accounts. The segment map is therefore directional,
      not a revenue-weighted customer census.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU015"
    tableRefs:
      - "TU001"
  - id: "adoption-and-customer-proof"
    title: "Adoption and customer proof"
    body: >
      Adoption proof is strongest at two different levels. First, an August 2026 third-party tear
      sheet repeats the claim that Mollie serves more than 250,000 businesses, which corroborates
      broad scale but ultimately relies on public disclosures. Second, Mollie's success-story index
      names merchants and displays outcomes such as a 95.45% acceptance rate for Dieti Natura, a
      73% conversion-rate increase for smartport, and a 40% decrease in monthly reconciliation time
      for NUDIENT. These are useful deployment signals, but they remain company-selected case-study
      claims without disclosed baselines, observation windows, sample definitions, or counterfactuals.
      Apps Run The World adds named-user evidence from another domain, yet its fetched page does not
      reveal transaction volume or distinguish current production use from an evaluation or legacy
      installation.
    claimRefs:
      - "CU003"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU008"
    tableRefs:
      - "TU002"
      - "TU003"
  - id: "platform-distribution-and-expansion"
    title: "Platform distribution and expansion"
    body: >
      Platforms and marketplaces provide an expansion route beyond direct merchant acquisition.
      A syndicated Mollie-PayPal announcement says marketplaces can add PayPal through Mollie
      without a separate PayPal integration or re-onboarding every seller. Mollie's contract
      defines Connect more broadly: a platform merchant can manage sub-merchants, charge fees,
      route and split payments, and receive referral commissions. This creates a plausible
      land-and-expand loop from payment acceptance into embedded administration and monetization,
      but the assigned evidence gives no platform count, connected-seller count, payment volume,
      attachment rate, or partner-sourced revenue. The mechanism is documented; its economic
      contribution and dependence on any one distribution partner remain unquantified.
    claimRefs:
      - "CU009"
      - "CU010"
    figureRefs:
      - "FU001"
  - id: "durability-and-risk-friction"
    title: "Durability and risk friction"
    body: >
      Durability is the central unresolved customer question. A competitor-comparison page
      summarizes reviewer complaints about holds, blocks, and payout friction during risk reviews,
      and also flags geographic and currency limits for businesses planning aggressive expansion
      outside Europe. Those observations are adverse signals rather than an independent benchmark:
      the page is a comparison publisher, its review methodology is not established here, and it
      should not be treated as a measured churn rate. Mollie's own terms add a concrete source of
      onboarding friction by conditioning full service access and balance payout on verification.
      The public pool does not disclose GRR, NRR, logo churn, renewal rates, contract length,
      cohort behavior, or top-customer concentration, preventing a defensible retention or
      concentration conclusion.
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU016"
