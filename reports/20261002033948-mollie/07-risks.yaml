callouts:
  - calloutType: "risk"
    title: "Regulatory Licensing Dependencies and Supervisory Scrutiny"
    body: "Operating under a Payment Institution license from De Nederlandsche Bank requires Mollie to maintain exhaustive compliance with EU AML and customer due diligence directives. Any compliance lapses or failure to properly identify Ultimate Beneficial Owners during merchant onboarding could trigger formal regulatory sanctions, statutory fines, or operational restrictions that would directly impair merchant processing [CR001, CR002]."
    claimRefs:
      - "CR001"
      - "CR002"
  - calloutType: "risk"
    title: "Contractual Reserve Mechanisms and Merchant Friction"
    body: "Mollie's standard User Agreement grants unilateral authority to impose rolling reserves, hold settlement balances, or suspend merchant accounts when elevated chargebacks or suspicious transactional velocity are detected [CR005]. While this safeguard shields Mollie from underwriting liabilities, it creates notable friction for growing merchants facing liquidity bottlenecks, prompting adverse merchant reviews and potential platform switching [CR005, CR007]."
    claimRefs:
      - "CR005"
      - "CR007"
