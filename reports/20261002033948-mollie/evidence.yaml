evidenceGaps:
  - type: missing-source
    severity: material
    topic: financial-reporting
    missingEvidence: >-
      Audited consolidated 2025 and 2026 financial statements reflecting GoCardless integration, balance sheet reserves,
      and segment profitability.
    whyItMatters: >-
      Selective press disclosures reporting net revenue of €147M cannot substitute for complete statutory financial
      statements when assessing EBITDA, cash burn, and capital sufficiency.
    diligencePath: >-
      Obtain Dutch Chamber of Commerce (KvK) official statutory filings for Mollie B.V. and UK Companies House filings
      for GoCardless post-closing.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: merchant-retention-and-churn
    missingEvidence: >-
      Audited merchant cohort retention schedules, churn rates, and gross transaction volume (GTV) breakdown across
      individual EEA member states.
    whyItMatters: >-
      Prevents precise calculation of net dollar retention, customer lifetime value, and geographic revenue
      concentration within the European payments footprint.
    diligencePath: >-
      Request management disclosure of regional cohort retention tables and merchant volume distributions during formal
      sponsor review.
    relatedQuestionRefs:
      - QM008
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, operating cash flow, accounting burn, runway, debt facilities, covenants, planned use
      of funds, and next financing trigger.
    whyItMatters: Historical funding raised cannot establish current liquidity or the capacity to fund growth and obligations.
    diligencePath: >-
      Obtain the latest signed balance sheet, monthly cash-flow statement, debt schedule, covenant package,
      board-approved budget, and downside financing plan.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Current TPV, gross and net take rate, payment-method mix, CAC, payback, logo churn, NRR, LTV, and merchant
      concentration by cohort.
    whyItMatters: >-
      These inputs determine whether reported growth reflects durable cohort expansion and attractive acquisition
      economics.
    diligencePath: >-
      Request quarterly merchant cohorts by acquisition channel, geography, size, and payment method with reconciled
      TPV, revenue, direct cost, and churn.
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: financial-statements
    missingEvidence: >-
      Signed primary financial statements supporting 2024 revenue, gross profit, EBITDA, net income, cash flow, and
      revenue-recognition classifications.
    whyItMatters: >-
      The retained 2024 results are company-supplied metrics syndicated by a news outlet rather than complete primary
      accounts.
    diligencePath: Obtain statutory filings or audited statements and reconcile each reported KPI to the financial statements.
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: revenue-mix
    missingEvidence: >-
      Revenue and gross-profit mix by product, payment method, geography, merchant segment, channel, and
      list-versus-realized pricing.
    whyItMatters: >-
      Without mix and realized pricing, the durability of take rate and the source of gross-profit growth cannot be
      isolated.
    diligencePath: >-
      Request monthly revenue and contribution-profit bridge by stream with rate cards, discounts, channel shares, and
      accounting treatment.
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: architecture-sla-metrics
    missingEvidence: >-
      Empirical p99 payment processing latency, acquirer routing failover success rates, and availability SLA metrics
      across European availability zones.
    whyItMatters: >-
      Enterprise platforms evaluating Mollie Connect require hard latency and failover performance benchmarks to assess
      transactional reliability under peak retail loads.
    diligencePath: >-
      Request historical technical incident post-mortems and audited multi-region uptime reports during technical
      management diligence.
    relatedQuestionRefs:
      - QE002
      - QE004
  - type: private-evidence-only
    severity: minor
    topic: mollie-capital-underwriting
    missingEvidence: >-
      Underwriting model parameters, historical default rates, and loss ratios for the automated Mollie Capital
      financing product.
    whyItMatters: >-
      Assessing credit risk exposure and whether lending algorithms adequately withstand macroeconomic downturns across
      SME merchant cohorts.
    diligencePath: Examine loan book performance data and capital partner risk-sharing agreements in confidential data room.
    relatedQuestionRefs:
      - QE008
  - type: conflicting-data
    severity: material
    topic: customer-scale
    missingEvidence: A dated definition and reconciliation of the homepage's over-250,000 and over-300,000 business claims.
    whyItMatters: >-
      Without a consistent denominator, the public figures cannot support a customer growth rate or active-customer
      baseline.
    diligencePath: >-
      Request a quarterly series of active, transacting, and paying merchants with additions, reactivations, and
      closures separated.
    relatedQuestionRefs:
      - QU002
      - QU005
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-proof
    missingEvidence: >-
      A complete named-customer roster with live status, products used, payment volume, start date, and
      customer-confirmed outcomes.
    whyItMatters: Public case studies are a selected sample and the technographic list does not establish current production depth.
    diligencePath: >-
      Reconcile CRM and processor records to a sampled customer reference list and obtain direct references across
      merchant tiers.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      GRR, NRR, logo churn, renewal rates, contract lengths, and cohort retention by merchant size and acquisition
      channel.
    whyItMatters: Customer breadth does not establish durable payment volume or retained revenue.
    diligencePath: >-
      Review monthly merchant and revenue cohorts, separating inactivity, involuntary risk exits, voluntary churn, and
      expansion.
    relatedQuestionRefs:
      - QU009
  - type: private-evidence-only
    severity: material
    topic: customer-concentration
    missingEvidence: Top-10 and top-20 customer and partner shares of payment volume, net revenue, and gross profit.
    whyItMatters: >-
      A large logo count can coexist with material economic dependence on a small set of merchants or distribution
      partners.
    diligencePath: >-
      Request concentration schedules by merchant, platform, partner, geography, and payment method for the latest
      twelve months.
    relatedQuestionRefs:
      - QU010
  - type: private-evidence-only
    severity: material
    topic: supervisory-audit-findings
    missingEvidence: >-
      Confidential De Nederlandsche Bank supervisory examination findings, specific capital adequacy ratios, and
      proprietary compliance audit reports.
    whyItMatters: >-
      Independent assessment of regulatory sanction risks requires visibility into whether DNB has issued formal
      operational remediation orders or capital add-on requirements.
    diligencePath: >-
      Review confidential regulatory correspondence and formal supervisory inspection letters in the virtual data room
      under strict NDA.
    relatedQuestionRefs:
      - QR001
      - QR002
  - type: private-evidence-only
    severity: material
    topic: chargeback-loss-loss-rates
    missingEvidence: >-
      Net unrecoverable chargeback loss ratios and gross dollar volumes of merchant reserve holdbacks across European
