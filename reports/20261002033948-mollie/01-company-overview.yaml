chapter:
  number: 1
  title: "Company Overview"
  summary: "Founded in 2004 by Adriaan Mol and headquartered in Amsterdam, Mollie B.V. is a European financial technology group providing online and in-person payment processing, business accounts, and financing. The company has raised over $940 million in external capital, including a June 2021 Series C valuing it at $6.5 billion, and serves over 250,000 to 300,000 business merchants."
sections:
  - id: "corporate-identity-and-business-model"
    title: "Corporate Identity, Regulatory Positioning, and Business Model"
    body: "Mollie B.V. is a Dutch payments and financial services provider founded in Amsterdam in 2004 by Adriaan Mol (CO001). The group operates as a licensed payment service provider supervised by De Nederlandsche Bank under client number F0038, using Stichting Mollie Payments (SMP) as an affiliated foundation to segregate and safeguard merchant funds (CO002). Mollie monetizes payments processing via country- and method-based transaction fees across card schemes, SEPA direct debits, and local methods such as iDEAL, while explicitly operating as a payment facilitator rather than a Merchant of Record, keeping direct legal seller liability and tax filing on the merchant (CO003). Under its user agreement, Mollie disclaims liability for merchant products, maintains a strict prohibited-activities policy covering predatory or high-risk services, and applies automated risk controls such as rolling reserves and gross fee settlement terms (CO004). In addition to core digital payment processing, Mollie expanded its service surface to include in-person payments, working capital financing, and embedded business banking (CO005)."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
      - "CO005"
    tableRefs:
      - "TO001"
  - id: "executive-leadership-and-governance"
    title: "Executive Leadership, Governance, and Operational Scale"
    body: "Mollie's corporate leadership structure combines founder stewardship with experienced executive management. Founder Adriaan Mol continues to guide corporate vision, while chief executive officer Koen Köppen, formerly chief technology officer at Klarna, oversees day-to-day operations. Financial reporting and capital allocation are led by chief financial officer Vincent Toolan, while product development and technical infrastructure are directed by chief product officer Rogier Schoute and chief technology officer Marco dos Santos. Operational scale spans over 1,000 employees representing more than 50 nationalities operating across core European hubs including Amsterdam, Lisbon, Kiel, and Milan (CO009)."
    claimRefs:
      - "CO006"
      - "CO007"
      - "CO009"
    tableRefs:
      - "TO002"
  - id: "capitalization-history-and-ownership-structure"
    title: "Capitalization History, Valuation Marks, and Strategic Milestones"
    body: "Mollie operated as a bootstrapped, founder-funded profitable business for its first fifteen years before executing an institutional growth equity financing strategy. In September 2020, Mollie closed a $106 million (€90 million) Series B funding round led by TCV that established unicorn status at a valuation exceeding $1 billion (CO011). In June 2021, the company closed an $800 million (€665 million) Series C financing round led by Blackstone Growth, with participation from EQT Growth, General Atlantic, HMI Capital, Alkeon Capital Management, and TCV, establishing a post-money valuation of $6.5 billion (CO012). Across three primary institutional rounds, Mollie accumulated over $940 million in external growth equity, with secondary shares later made available on private liquidity venues including EquityZen (CO013). In December 2025, Mollie executed a major consolidation move by agreeing to acquire UK bank-payment specialist GoCardless, expanding direct debit and open banking capabilities across more than 350,000 combined merchants (CO014). In June 2026, Mollie committed €350 million to fuel European growth and EEA-wide infrastructure over five years following completion of its EEA market footprint (CO015)."
    claimRefs:
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO015"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
