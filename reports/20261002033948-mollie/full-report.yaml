      - number: '1.2'
        title: Executive Leadership, Governance, and Operational Scale
        blocks:
          - type: paragraph
            body: >-
              Mollie's corporate leadership structure combines founder stewardship with experienced executive
              management. Founder Adriaan Mol continues to guide corporate vision, while chief executive officer Koen
              Köppen, formerly chief technology officer at Klarna, oversees day-to-day operations. Financial reporting
              and capital allocation are led by chief financial officer Vincent Toolan, while product development and
              technical infrastructure are directed by chief product officer Rogier Schoute and chief technology officer
              Marco dos Santos. Operational scale spans over 1,000 employees representing more than 50 nationalities
              operating across core European hubs including Amsterdam, Lisbon, Kiel, and Milan (CO009).
            claimRefs:
              - CO006
              - CO007
              - CO009
