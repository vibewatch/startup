            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
              - CO009
      - number: '1.3'
        title: Capitalization History, Valuation Marks, and Strategic Milestones
        blocks:
          - type: paragraph
            body: >-
              Mollie operated as a bootstrapped, founder-funded profitable business for its first fifteen years before
              executing an institutional growth equity financing strategy. In September 2020, Mollie closed a $106
              million (€90 million) Series B funding round led by TCV that established unicorn status at a valuation
              exceeding $1 billion (CO011). In June 2021, the company closed an $800 million (€665 million) Series C
              financing round led by Blackstone Growth, with participation from EQT Growth, General Atlantic, HMI
              Capital, Alkeon Capital Management, and TCV, establishing a post-money valuation of $6.5 billion (CO012).
              Across three primary institutional rounds, Mollie accumulated over $940 million in external growth equity,
              with secondary shares later made available on private liquidity venues including EquityZen (CO013). In
              December 2025, Mollie executed a major consolidation move by agreeing to acquire UK bank-payment
              specialist GoCardless, expanding direct debit and open banking capabilities across more than 350,000
              combined merchants (CO014). In June 2026, Mollie committed €350 million to fuel European growth and
              EEA-wide infrastructure over five years following completion of its EEA market footprint (CO015).
