  - id: FU001
    title: Customer adoption and expansion journey
    type: journey-map
    summary: >-
      A non-quantitative sequence from eligibility through payment adoption, platform expansion, and durability
      monitoring.
    data:
      items:
        - label: Eligibility
          detail: >-
            A business organization checks whether its products, services, and jurisdiction fit Mollie's acceptance
            policy.
          touchpoints:
            - Acceptable-use guidance
            - Account application
        - label: Verification
          detail: Mollie performs business, ownership, and risk checks before full service access and balance payout.
          touchpoints:
            - Registration
            - KYC information request
        - label: Payment activation
          detail: The merchant integrates online or in-person acceptance and selects relevant payment methods.
          touchpoints:
            - Payment integration
            - Dashboard
        - label: Operational adoption
          detail: Finance and support teams use reconciliation, refund, dispute, and reporting workflows.
          touchpoints:
            - Reconciliation
            - Refund and dispute handling
        - label: Platform expansion
          detail: A marketplace can connect sub-merchants, charge fees, and route or split payments through Connect.
          touchpoints:
            - Mollie Connect
            - Partner payment methods
        - label: Durability review
          detail: >-
            Retention, payout friction, geographic fit, and customer concentration require cohort and portfolio
            evidence.
          touchpoints:
            - Risk review
            - Renewal and cohort diligence
    approximationNotes: >-
      Analytical sequence synthesized from official terms and assigned customer evidence; it does not measure
      conversion, duration, or stage-to-stage retention.
