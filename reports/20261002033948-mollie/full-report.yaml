chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Regulatory Positioning, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Mollie B.V. is a Dutch payments and financial services provider founded in Amsterdam in 2004 by Adriaan
              Mol (CO001). The group operates as a licensed payment service provider supervised by De Nederlandsche Bank
              under client number F0038, using Stichting Mollie Payments (SMP) as an affiliated foundation to segregate
              and safeguard merchant funds (CO002). Mollie monetizes payments processing via country- and method-based
              transaction fees across card schemes, SEPA direct debits, and local methods such as iDEAL, while
              explicitly operating as a payment facilitator rather than a Merchant of Record, keeping direct legal
              seller liability and tax filing on the merchant (CO003). Under its user agreement, Mollie disclaims
              liability for merchant products, maintains a strict prohibited-activities policy covering predatory or
              high-risk services, and applies automated risk controls such as rolling reserves and gross fee settlement
              terms (CO004). In addition to core digital payment processing, Mollie expanded its service surface to
              include in-person payments, working capital financing, and embedded business banking (CO005).
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
