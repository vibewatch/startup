  - id: TV003
    title: Bull, Base, and Bear Scenario Projections
    columns:
      - Scenario
      - Key Operating Assumptions
      - Implied Net Multiple
      - Valuation Range (USD)
      - Probability Signal
      - Downside Triggers & Breakpoints
    rows:
      - - Bull Case
        - >-
          GoCardless integration unlocks high-margin open-banking recurring payments; merchant count tops 350,000;
          revenue exceeds $450M with EBITDA margins >25%.
        - 12.0x - 14.0x Net Rev
        - $5.5B - $6.5B
        - 20% (Low-Medium)
        - Accelerated European cross-border adoption and successful public IPO window in London or Amsterdam.
      - - Base Case
        - >-
          Steady SME payments growth; revenue run-rate matures around $320M-$380M; moderate EBITDA profitability; stable
          market share in Benelux and Germany.
        - 8.0x - 10.0x Net Rev
        - $3.2B - $4.0B
        - 55% (High)
        - >-
          Merchant cohort growth decelerates below 15%; multiple remains bounded by public European payment processor
          averages.
      - - Bear Case
        - >-
          Post-merger organizational friction; heightened SME churn from economic slowdown; aggressive price competition
          from Adyen and Stripe compressing net take rates.
        - 4.5x - 6.0x Net Rev
        - $1.8B - $2.4B
        - 25% (Medium)
        - >-
          Loss of key localized distribution channels or major compliance enforcement driving payment volume
          contractions.
    notes: >-
      Scenario multiples and valuations estimated based on private market comp benchmarks, historical growth rates, and
      prevailing fintech peer trading ranges.
    claimRefs:
