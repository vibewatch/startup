figures:
  - id: FO001
    title: Mollie Corporate, Financing, and Expansion Milestone Timeline
    type: timeline
    summary: Chronological evolution of Mollie from bootstrapped payment gateway to pan-European financial services group.
    data:
      items:
        - label: 2004 Founding
          detail: Mollie founded in Amsterdam by Adriaan Mol as an accessible online payment gateway for webshops.
          tone: positive
        - label: 2019 Series A
          detail: Closed $25M Series A financing after 15 years of profitable bootstrapping to fund European expansion.
          tone: positive
        - label: 2020 Series B
          detail: Raised €90M ($106M) Series B led by TCV, achieving unicorn status at a valuation exceeding $1B.
          tone: positive
        - label: 2021 Series C
          detail: Raised $800M (€665M) Series C led by Blackstone Growth, achieving a valuation of $6.5B.
          tone: positive
        - label: 2022 Mollie Capital
          detail: Launched Mollie Capital in the Netherlands and UK to offer fast, flexible revenue-based funding.
          tone: positive
        - label: 2023 Mollie Terminal
          detail: Introduced Mollie Terminal and in-person payments, entering the unified commerce market across Europe.
          tone: positive
        - label: 2023 UK FCA License
          detail: Transitioned from temporary EU passport to formal Payment Institution license granted by UK FCA.
          tone: positive
        - label: 2025 GoCardless Deal
          detail: Signed agreement to acquire UK bank payment fintech GoCardless to unite recurring debit and card payments.
          tone: positive
        - label: 2026 EEA Completion
          detail: >-
            Completed full 30-market EEA coverage with Croatia and Iceland launches and committed €350M to European
            growth.
          tone: positive
    approximationNotes: Dates represent calendar years or quarters of verified corporate announcements.
    claimRefs:
      - CO001
      - CO005
      - CO011
      - CO012
      - CO014
      - CO015
  - id: FM001
    title: European Payment Processing Sizing and Market Opportunity Layers
    type: pyramid
    summary: >-
      Conceptual hierarchy illustrating the structural funnel from total European digital commerce down to Mollie's
      obtainable SMB merchant volume.
    data:
      items:
        - label: European Gross Commerce (TAM)
          description: Broadest transaction volume layer encompassing total digital retail spend across 30+ European nations.
        - label: Localized Gateway Service Layer (SAM)
          description: >-
            Addressable European SMB and mid-market webshops requiring domestic APMs and unified multi-currency
            checkout.
        - label: Embedded Platform & PayFac Layer
          description: European vertical SaaS platforms and marketplaces embedding sub-merchant onboarding and split payments.
        - label: Core Regional Footprint (SOM)
          description: Prime operating focus concentrated across high-conversion Benelux, DACH, French, and UK ecommerce corridors.
        - label: Active Installed Merchant Base
          description: Disclosed active merchant cohort exceeding 250,000 businesses utilizing Mollie payment integrations.
        - label: Value-Added Monetization Tier
          description: Retained merchant base adopting point-of-sale terminals, Mollie Capital advances, and billing automation.
