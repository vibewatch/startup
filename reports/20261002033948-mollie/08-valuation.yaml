callouts:
  - calloutType: "recommendation"
    title: "Recommendation Stance: Track Pending Valuation Realignment"
    body: "Mollie remains one of Europe's premier independent PSP platforms with deep integration across Benelux and expanding German operations. However, prospective investors should not underwrite entry at or near the $6.5 billion Series C valuation benchmark given that public comparable multiples have contracted by 50% to 70% since mid-2021. Capital should be withheld until secondary trades or fresh primary rounds re-anchor valuation closer to base-case scenario multiples."
    claimRefs:
      - "CV002"
      - "CV003"
      - "CV004"
      - "CV007"
      - "CV010"
  - calloutType: "risk"
    title: "Structural Liquidity and Valuation Compression Risk"
    body: "Secondary trading platforms including UpMarket highlight that pre-IPO fintech shares are illiquid and carry risk of total loss. For Mollie, the combination of an $800 million liquidation preference overhang from Series C investors and an implied historical revenue multiple of 26.4x leaves common and early-series equity holders vulnerable to severe dilution or impairment in any recapitalization event."
    claimRefs:
      - "CV002"
      - "CV007"
      - "CV008"
      - "CV010"
