        - "Public filing of merchant churn exceeding 20% annually or sequential decline in active merchant counts."
      - - "Financing Base"
        - "Raised over $922M-$940M in equity funding with backing from tier-one sponsors Blackstone Growth, EQT, TCV, and General Atlantic."
        - "Substantial Series C preference stack creates liquidation overhang for common shareholders at valuations below $6.5B."
        - "Structured down-round financing or secondary share transactions clearing at greater than 50% discount to Series C."
      - - "Valuation Multiple"
        - "Priced at $6.5B in 2021 reflecting category-leading 600% regional expansion and rapid transaction processing growth."
        - "The 26.4x historical multiple is unsustainable in a normalized higher-rate regime where public comps trade between 5x and 9x revenue."
        - "Inability to demonstrate organic net revenue growth exceeding 25% year-over-year in upcoming audited statements."
      - - "Operating Model"
        - "Asset-light tech platform operating as technical service provider with standard merchant agreements limiting direct transaction liability."
