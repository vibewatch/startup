  evidenceGaps:
  - type: missing-source
    severity: material
    topic: som
    missingEvidence: A bottom-up customer-count and spend model for Zyphra's realistic serviceable market.
    whyItMatters: Top-down TAM figures are too wide to anchor near-term expectations for this company.
    diligencePath: Model target buyer cohorts by region, workload, and deployment preference using pipeline data and customer interviews.
    relatedQuestionRefs:
    - QM021
    - QM024
    relatedTableRefs:
    - TM001
  - type: private-evidence-only
    severity: material
    topic: buyer-segments
    missingEvidence: Named Zyphra customers and production use cases by vertical, size, and geography.
    whyItMatters: Without customer proof, market-fit claims remain partly inferential.
    diligencePath: Request pipeline segmentation, customer logos, and production-reference calls.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM003
  - type: private-evidence-only
    severity: minor
    topic: willingness-to-pay
    missingEvidence: Zyphra-specific pricing realization, average contract value, and retention by product line.
    whyItMatters: Macro willingness to pay does not automatically translate into Zyphra monetization quality.
    diligencePath: Review bookings, ACV, and renewal cohorts for inference, compute, and agent products.
    relatedQuestionRefs:
    - QM017
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: competition
    missingEvidence: A consistent competitor-by-competitor deployment win/loss dataset for sovereign and enterprise accounts.
    whyItMatters: The market is crowded and official positioning pages do not prove switching wins.
    diligencePath: Ask management for displacement cases, procurement objections, and cloud-partner funnel data.
    relatedQuestionRefs:
    - QM019
    - QM023
    relatedTableRefs:
    - TM004
  - type: stale
    severity: minor
    topic: market-size
    missingEvidence: A 2026 or 2027 Zyphra-authored investor framing that narrows which parts of AI spend it actually targets.
    whyItMatters: The macro market is expanding quickly, but the company's own wedge could move as products evolve.
