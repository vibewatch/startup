  title: Sovereign deployment demand drivers
  columns:
  - Driver
  - External evidence
  - Implication for Zyphra
  - Constraint
  rows:
  - - Data residency and legal control
    - Deloitte and MarketsandMarkets both highlight sovereignty and localization
    - Supports self-hosted, auditable deployment messaging
    - Long sales cycles and compliance reviews.
  - - Government and public sector demand
    - MarketsandMarkets calls government the leading sovereign-AI segment
    - Creates room for security-first and infrastructure-aware offerings
    - Requires procurement trust and certifications.
  - - Hardware flexibility
    - Zyphra compute page emphasizes AMD-native control
    - Can appeal where buyers want alternatives to one hyperscaler stack
    - ROCm ecosystem maturity remains under scrutiny.
  - - Long-horizon agents
    - Inference and MAIA pages emphasize context and multi-step workflows
    - Matches buyers solving complex internal workflows
    - Agent governance maturity is still low.
  notes: The market tailwind is not just macro spend; it is the mix of compliance, control, and infrastructure requirements attached to that spend.
