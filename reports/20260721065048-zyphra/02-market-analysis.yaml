- id: TM005
  title: Adoption constraints and implications
  columns:
  - Constraint
  - Public evidence
  - Market effect
  - Implication for Zyphra
  rows:
  - - Agent governance immaturity
    - Deloitte says only about one in five companies has mature governance for autonomous agents
    - Slows adoption in higher-risk workflows
    - MAIA and long-horizon agents may require longer enterprise proof cycles.
  - - Low current agent deployment
    - Stanford HAI says agent deployment remains in single digits across most functions
    - Shows the market is early, not saturated
    - Upside exists, but near-term demand may be narrow.
  - - Talent scarcity and capex intensity
    - MarketsandMarkets flags both as major sovereign-AI restraints
    - Pushes buyers toward proven vendors or managed offerings
    - Zyphra must make operating complexity easier, not just offer open models.
  - - Open-weight commoditization
    - Meta, Mistral, and Stability keep open competition intense
    - Reduces differentiation from openness alone
    - Monetization must come from deployment value and workflow outcomes.
  notes: These are the constraints most likely to compress Zyphra's realized market share relative to broad TAM narratives.
