- id: funding-investors-and-public-scale-markers
  title: Funding, investors, and public scale markers
  body: The funding story is directionally consistent but not perfectly reconciled across the retained source pack. IBM's October 2025 release says Zyphra had recently closed a Series A round at a $1B valuation. VCBacked and Nextomoro both anchor a $100M Series A in June 2025, while Tracxn shifts the dated round marker to October 2025 and shows IBM and AMD as institutional investors tied to that financing. GetLatka estimates $111.4M total capital, $8.8M of 2024 revenue, and roughly 44 employees; CB Insights confirms Series A status, a San Francisco headquarters, and an investor set including AMD, Intel Capital, Future Ventures, Bison Ventures, and Transpose Platform. Forbes adds a newer but still unconfirmed 2026 signal by reporting a $500M raise in progress at at least a $5B valuation, with AMD participating. The right conclusion is that Zyphra clearly crossed the unicorn threshold, but the exact round chronology, cap table, and operating-scale metrics still rely partly on database estimates
    and rumor-aware press coverage rather than detailed primary disclosure.
