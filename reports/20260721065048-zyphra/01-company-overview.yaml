    - QO021
    relatedTableRefs: []
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board list, committee structure, and investor control-rights summary.
    whyItMatters: Board control and founder dependence shape decision velocity, risk tolerance, and refresh risk.
    diligencePath: Request charter documents, board composition, and lead-investor governance rights.
