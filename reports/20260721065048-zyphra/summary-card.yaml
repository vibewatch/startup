summary:
  headline: |
    Zyphra has unusually strong public technical and partner evidence for a private AI startup, but its
    customer proof and economics disclosure are still too thin to justify price-insensitive underwriting.
    The report supports a research-more / track stance: constructive near the last supported unicorn mark,
    but cautious toward rumored 2026 step-up pricing until customer and financial proof improves.
