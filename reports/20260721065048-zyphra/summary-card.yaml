  topStrengths:
    - Public technical record is unusually rich for stage, with Zamba2 and ZAYA1 research plus open model distribution.
    - IBM and AMD provide meaningful partner validation and infrastructure credibility.
    - The product thesis joins models, compute, and workflow software rather than relying on a single surface.
    - Sovereign-control and AMD-native positioning align with real enterprise and public-sector demand trends.
    - The last supported $1B valuation still leaves room for upside if customer proof improves substantially.
  topRisks:
    - Customer breadth, production proof, and retention remain under-disclosed relative to valuation ambition.
    - AMD/ROCm ecosystem dependence could behave like execution concentration rather than a durable moat.
    - Burn, runway, and margin profile are not public, leaving capital adequacy unresolved.
    - Competitors such as OpenAI, Anthropic, Mistral, Cohere, and xAI have more scale, proof, or capital.
    - A rumored 2026 valuation step-up is not well supported by current public customer and economics evidence.
  unresolvedGaps:
    - Named production customers with buyer, user, payer, outcome, and renewal context.
    - Revenue by stream, ACV, gross margin, burn, runway, and retention metrics.
    - Closed terms and status of any 2026 financing beyond the last supported unicorn-stage round.
    - Runtime reliability, security, and compliance materials for enterprise deployments.
    - Conversion path from open-source or developer adoption into paid Zyphra cloud, compute, or MAIA contracts.
