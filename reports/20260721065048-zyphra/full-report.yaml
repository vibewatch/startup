      - number: '2.3'
        title: Buyers, willingness to pay, and competitive overlap
        blocks:
          - type: paragraph
            body: >-
              Public market evidence suggests enterprises are moving beyond experimentation, but the buying center is
              still selective. Stanford HAI and Deloitte show rising AI usage, while State of AI adds a more commercial
              layer: more U.S. businesses now pay for AI tools, average contracts are substantial, and AI-first startups
              are growing faster than peers. That makes knowledge-intensive enterprise functions, public sector teams,
              and regulated industries plausible target buyers for Zyphra. The issue is that these are exactly the
              accounts already being courted by Mistral, Cohere, AI21, OpenAI, Anthropic, and Aleph Alpha. Mistral and
              Cohere both emphasize enterprise deployments and agentic workflows; OpenAI and Anthropic already showcase
              broad customer proof; Meta and Stability keep the open-model pressure high; and Aleph Alpha leans hard
              into sovereignty. Zyphra therefore benefits from a live budget category, but it is not entering an empty
              field. Winning requires a sharper value proposition around hardware flexibility, long-context inference
              economics, or deployment control than the larger incumbents and better-funded peers can offer.
