      - number: '8.3'
        title: Price sensitivity and scenarios
        blocks:
          - type: paragraph
            body: >-
              The recommendation is highly price-sensitive. Near the last supported $1B mark, a constructive case
              exists: Zyphra could still be bought as an option on customer conversion if diligence later confirms
              revenue quality, partner resilience, and MAIA monetization. Above the rumored $5B level, the public
              evidence pack becomes too thin. The customer chapter is still mostly partner-proof and developer-signal
              heavy; the financial chapter is still missing the metrics that justify premium late-stage pricing; and the
              risk chapter still carries meaningful financing, partner, and regulatory uncertainty. That does not make
              the company unattractive. It makes the stock of evidence inadequate for an aggressive entry price. The
              correct base case is therefore not “avoid forever,” but “research more or track unless price and proof
              improve together.” That base case also reflects a simple reality: valuation cannot be separated from
              evidence density. If management can quickly close the proof gaps, the same company could deserve a
              materially different price discussion.
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV022
              - CV033
              - CV034
              - CV035
              - CV036
              - CV038
      - number: '8.4'
        title: Recommendation and diligence path
        blocks:
          - type: paragraph
            body: >-
              The cleanest overall recommendation is disciplined optionality. Zyphra deserves attention because the
              technical and strategic story is materially better than the median AI startup story, and IBM/AMD partner
              proof lowers the chance that the whole narrative is vapor. But it does not yet deserve price-insensitive
              underwriting. Confidence should stay at medium, risk rating at high, and valuation stance at “watchful /
              evidence-gated.” The few diligence asks that matter most are obvious: named production customers, revenue
              by stream, burn and runway, realized pricing, and whether the 2026 fundraising process actually closed.
              Those answers could move the call quickly. Until then, the valuation verdict is that Zyphra is interesting
              enough to follow closely and possibly back at the right price, but not yet evidenced enough to chase at
              peak sentiment. The same diligence package would also clarify dilution risk, partner dependence, and how
              much pricing power really exists in each product layer. Until those items are answered, an investor is
              effectively paying for potential twice: once in the company narrative and again in the entry price. That
              double-counting risk is exactly what disciplined valuation work is supposed to prevent.
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV027
              - CV028
