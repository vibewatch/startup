  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and growth lenses
        blocks:
          - type: paragraph
            body: >-
              Zyphra should not be analyzed against the whole of “AI” as one monolithic market. Its public narrative
              sits at the intersection of enterprise foundation-model spend, sovereign or self-hosted deployment, and
              long-horizon agent workflows. That matters because top-down numbers vary widely depending on what each
              analyst includes. Mordor Intelligence estimates a much larger 2026 enterprise-AI market than Grand View
              Research, while Stanford HAI focuses on investment flows and adoption rather than software revenue alone.
              The common signal across these sources is strong directionality: corporate AI investment accelerated
              sharply in 2025, adoption rates moved higher, and new private funding remains abundant. The right market
              lens for Zyphra is therefore not “all AI software,” but the subset of model, infrastructure, and
              deployment spend where buyers need customization, control over data, or non-NVIDIA infrastructure choices.
              That is still a large opportunity, but it is materially smaller and more procurement-heavy than generic
              consumer or API-scale AI demand.
