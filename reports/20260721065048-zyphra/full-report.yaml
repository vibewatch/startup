      - number: '2.2'
        title: Sovereign AI and deployment control as procurement drivers
        blocks:
          - type: paragraph
            body: >-
              The most important strategic tailwind for Zyphra may be the rise of sovereign AI as a real buying
              criterion. Zyphra's own mission language emphasizes sovereign control, and external market sources show
              why that positioning can resonate. Deloitte explicitly defines sovereign AI around control over laws,
              infrastructure, and data; MarketsandMarkets goes further by turning that into a dedicated market forecast,
              arguing that governments and regulated enterprises are increasingly treating AI as a strategic asset
              rather than a mere productivity feature. The same report says government and public sector currently lead
              sovereign-AI demand, while regulation, data localization, and export-control pressures are reshaping
              deployment choices. Zyphra's compute and inference pages line up neatly with those needs: long context,
              bare-metal AMD infrastructure, and deep ROCm integration are all messages that appeal to buyers who want
              portability or auditable control. The limitation is that many established competitors now offer some
              version of self-hosted or sovereign deployment too, so sovereign positioning is a strong market tailwind
              but not an automatic moat.
            claimRefs:
