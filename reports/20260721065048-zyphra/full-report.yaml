      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The company may be better than the price
            body: >-
              Zyphra can be an interesting business and still be a bad buy at the wrong valuation. Public evidence is
              good enough for interest, not for blind price-taking.
            calloutType: insight
            claimRefs:
              - CV014
              - CV015
              - CV016
              - CV040
          - type: callout
            title: Customer proof is the fulcrum
            body: >-
              The single biggest item that would move valuation support upward is named production customer proof paired
              with economics visibility.
            calloutType: risk
            claimRefs:
              - CV019
              - CV030
