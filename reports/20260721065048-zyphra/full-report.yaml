  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The pro-thesis for Zyphra is straightforward and real. The company has a coherent story that ties together
              efficient model research, open distribution, AMD-native infrastructure, and an application-layer workflow
              product in MAIA. That is more substance than many AI startups show publicly. The anti-thesis is just as
              clear: public customer proof, retention, and economics trail the ambition. Investors are therefore not
              choosing between “good company” and “bad company,” but between paying for an execution option versus
              paying for already-demonstrated commercial quality. That distinction drives everything else in the
              valuation chapter. In other words, the debate is fundamentally about timing and price, not about whether
              the company has any real assets.
            claimRefs:
              - CV011
              - CV012
              - CV013
              - CV020
              - CV021
