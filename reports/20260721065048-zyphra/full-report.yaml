        - After next financing cycle
        - Commercial narrative remains too speculative
        - Do not pay premium private mark
      - - Funding closes only at stretched terms
        - High dilution or weak terms
        - Confirms financing dependence
        - Recut ownership and risk return
      - - AMD / partner execution stalls
        - Cluster expansion or reliability issues slip
        - Damages full-stack differentiation story
        - Reduce conviction materially
      - - New legal or claims friction emerges
        - Formal dispute or enforcement signal
        - Adds cost and slows enterprise adoption
        - Increase reserve and lower price tolerance
    notes: These are the few signals that would most quickly change the recommendation.
    claimRefs:
      - CV026
      - CV030
      - CV034
      - CV040
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Customer proof
        - Named production accounts with outcomes and renewals
        - Primary gap versus richer-priced peers
        - Management + customer references
      - - Revenue quality
        - Revenue by stream, ACV, margin, retention
        - Needed to justify premium pricing
        - Finance package / board deck
      - - 2026 round status
        - Closed terms, dilution, lead investor
        - Determines true entry price and confidence
        - Management + lead investors
      - - Pricing realization
        - Actual contract pricing and discounts
        - Tests monetization quality
        - Sales ops / deal memos
      - - Runtime reliability
        - Serving uptime, incidents, security controls
        - Tests whether technical story generalizes to production
        - Engineering / security review
    notes: These asks are ordered by expected impact on the recommendation.
    claimRefs:
      - CV018
