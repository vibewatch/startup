chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and public product surface
        blocks:
          - type: paragraph
            body: >-
              Zyphra is not presenting itself as a single-purpose model API startup. Across the homepage, about page,
              cloud pages, model index, and MAIA page, the company frames itself as a vertically integrated
              open-superintelligence platform that combines a research lab, product company, and infrastructure layer.
              The central promise is sovereign control: Zyphra says organizations should be able to deploy AI with
              transparency, safety, alignment, and hardware flexibility rather than depend on one closed vendor stack.
              That narrative is reinforced by the public product map. Zyphra Research covers open foundation models;
              Zyphra Cloud covers compute, inference, and enterprise delivery; and MAIA is pitched as the higher-level
              agent product for coordinated team workflows. The model catalog itself is already segmented into language,
              audio, thought, and vision lines. The commercial implication is that Zyphra wants to monetize not only
              model weights, but also hosting, inference, compute capacity, and workflow software built around those
              models.
