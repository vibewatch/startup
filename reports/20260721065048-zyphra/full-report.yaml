      - number: '3.3'
        title: Feature positioning and switching dynamics
        blocks:
          - type: paragraph
            body: >-
              On positioning, Zyphra appears closest to the overlap between open-weight distribution, enterprise agent
              workflows, and infrastructure control. Mistral is the nearest public analogue on enterprise deployment
              flexibility; Aleph Alpha overlaps on sovereignty; Cohere and AI21 overlap more on productivity packaging;
              OpenAI and Anthropic dominate on workflow trust and customer references; and Meta raises the floor on what
              open distribution means. That creates a competitive environment with relatively low conceptual switching
              costs. Enterprises can mix and match open models, vendor APIs, and internal orchestration layers rather
              than committing forever to one vendor. Zyphra's strongest public edge is not that it is open, because
              others are open too, but that it pairs openness with explicit AMD-native training and deployment
              partnerships and long-context or agentic claims. Even so, public sources do not yet support a precise
              feature-by-feature or price-by-price verdict, so the matrix should be read as directional rather than
              conclusive.
