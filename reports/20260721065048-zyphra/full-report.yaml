      - number: '1.2'
        title: Founders, leadership, and location signals
        blocks:
          - type: paragraph
            body: >-
              The public identity stack is strong enough to name the company and its mission, but still uneven on formal
              governance. First-party pages and IBM's press release clearly place Zyphra in San Francisco and use the
              415 Mission Street address, while third-party databases still echo Palo Alto as a legacy location marker.
              Leadership is partly corroborated but still more dependent on external profiles than on a robust executive
              or board page maintained by the company itself. Nextomoro provides the clearest founder roster—Krithik
              Puthalath, Beren Millidge, Tomás Figliolia, and Danny Martinelli—with functional role assignments for the
              first three, and IBM separately quotes Puthalath as CEO and chairman. The official site does confirm
              hiring activity in both San Francisco and London, suggesting an operating footprint beyond one city. What
              remains missing is a current board list, committee structure, or detailed governance page. That gap
              matters because the company's strategy is founder-heavy, technically ambitious, and capital intensive,
              which raises key-person and control-rights diligence questions.
