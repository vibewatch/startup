      - number: '2.4'
        title: Constraints, adoption friction, and market verdict
        blocks:
          - type: paragraph
            body: >-
              The market is attractive, but it is not frictionless. Deloitte says many firms are still early in agent
              governance, and Stanford HAI says AI-agent deployment remains low even as broader generative-AI adoption
              rises. MarketsandMarkets highlights the same structural brakes at a macro level: talent scarcity, capex
              intensity, and semiconductor supply fragmentation. For Zyphra, those generic frictions combine with
              company-specific ones. Open-weight distribution lowers developer barriers but also means openness alone
              cannot differentiate the company from Mistral or Meta. AMD-native infrastructure creates a contrarian
              procurement angle, but AInvest-style skepticism about the ROCm ecosystem shows the market may still
              discount that angle until more real deployments prove out. The result is a favorable but demanding market:
              there is clearly enough spending, compliance pressure, and workflow demand to support Zyphra's thesis, yet
              the company still needs customer evidence and repeatable enterprise motion before anyone can responsibly
              convert macro tailwinds into a tight serviceable-market assumption.
