  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue architecture and monetization
        blocks:
          - type: paragraph
            body: >-
              Zyphra's public product surface implies a hybrid revenue model rather than a clean single-line SaaS
              business. The company appears capable of monetizing model and inference services, AMD-based compute or
              infrastructure access, and workflow software around MAIA. That mix matters because each stream would
              likely carry different margin and sales characteristics. Compute or cluster-linked services usually bring
              heavier delivery cost and capital dependence, while workflow or software layers can carry better long-term
