      - number: '8.2'
        title: Valuation context and comparables
        blocks:
          - type: paragraph
            body: >-
              On available evidence, the last solid valuation anchor is Zyphra's unicorn-stage financing context around
              $1B. Multiple sources support that. A much higher 2026 number exists in the form of a Forbes fundraising
              report, but that should be treated as a market signal, not a closed fact. Comparable evidence suggests a
              broad private-band context: AI21 only modestly above Zyphra, Mistral and Cohere far above it, and xAI at a
              different order of magnitude altogether. The right takeaway is not that Zyphra deserves those marks, but
              that the market is willing to award large premiums to AI companies that can show enough combination of
              product depth, customer proof, and strategic narrative. Zyphra clearly has the narrative and technical
              depth; it has not yet shown the same degree of public customer validation. That is why comparables should
              be used as boundary markers and bargaining context, not as a shortcut to a false-precision price target.
            claimRefs:
