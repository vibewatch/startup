companyProfile:
  summary: |
    Zyphra is a 2021-founded San Francisco AI startup building what it calls the full-stack for open
    superintelligence. Public materials position the company across research, inference cloud, AMD-native
    compute, and MAIA, a shared-context superagent for enterprise knowledge work. The company's technical
    identity centers on efficient multimodal and long-context models such as Zamba2 and ZAYA1, plus deep
    co-design with AMD and IBM for large-scale training infrastructure. Public financing evidence supports
    a 2025 unicorn-stage Series A context, while 2026 reporting suggests Zyphra explored a much larger
    fundraising step-up that remains unconfirmed as a closed round.
