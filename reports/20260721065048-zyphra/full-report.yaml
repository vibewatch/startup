  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: direct peers and incumbents'
        blocks:
          - type: paragraph
            body: >-
              The relevant competitor set for Zyphra spans two categories. The first is direct peers that also market
              enterprise-deployable or open-weight AI systems, including Mistral, Cohere, AI21, Aleph Alpha, Stability
              AI, xAI, and to a lesser extent Inflection. The second is incumbent giants with stronger distribution and
              customer proof, especially OpenAI, Anthropic, Google, and Meta. This matters because Zyphra does not only
              compete on raw model quality; it competes on whether buyers choose a sovereignty-friendly stack over a
              deeply adopted workflow suite, a branded frontier vendor, or an internal build around widely distributed
              open weights. Public sources show that Mistral and Cohere already speak the language of enterprise
              deployments, while OpenAI and Anthropic have broader installed bases and stronger visible customer
              references. As a result, Zyphra is not entering a whitespace category; it is entering a market where the
              jobs-to-be-done are already heavily contested from both above and beside.
