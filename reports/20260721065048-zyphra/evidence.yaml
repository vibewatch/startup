evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: customers
    missingEvidence: >-
      Named production customers, deployment counts, and renewal metrics for MAIA, cloud inference, or enterprise model
      programs.
    whyItMatters: Customer proof is needed to distinguish technical visibility from repeatable commercialization.
    diligencePath: Request customer references, production case studies, and cohort data during management diligence.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs: []
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current board list, committee structure, and investor control-rights summary.
    whyItMatters: Board control and founder dependence shape decision velocity, risk tolerance, and refresh risk.
    diligencePath: Request charter documents, board composition, and lead-investor governance rights.
    relatedQuestionRefs:
      - QO022
    relatedTableRefs:
      - TO002
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: A reconciled round-by-round financing ledger with dates, amounts, and investor allocations.
    whyItMatters: Public databases disagree on amount raised, round date, and whether a 2026 round is only rumored or committed.
    diligencePath: Obtain company financing deck, board consents, and cap-table summary.
    relatedQuestionRefs:
      - QO023
      - QO025
    relatedTableRefs:
