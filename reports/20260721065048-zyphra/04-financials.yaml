- id: capital-intensity-and-adequacy
  title: Capital intensity and adequacy
  body: 'Public evidence is far stronger on financing access and capital intensity than it is on day-to-day performance. IBM and AMD describe a large-scale cluster, early deployment in September 2025, and expansion plans in 2026. AMD adds operational details that make the capital profile tangible: hundreds of high-end GPUs, specialized networking, and Zyphra-built optimization layers. Even if part of that footprint is provided by partners rather than owned outright, the strategy still lives inside a capital-intensive compute ecosystem. Public-company SEC filings from supplier-side peers help reinforce that frontier AI infrastructure is embedded in a costly semiconductor and datacenter stack, even if they do not disclose Zyphra''s own burn. On the financing side, multiple sources support a $1B Series A context, while Forbes suggests a much larger 2026 round was in market. That is enough to conclude that capital access is strong; it is not enough to conclude that runway is comfortable or that
    the next round is optional.'
  claimRefs:
  - CI006
