- id: financial-verdict-and-blockers
  title: Financial verdict and blockers
  body: The most supportable financial verdict is cautiously positive on access to capital and cautiously negative on disclosure quality. Zyphra has clearly attracted serious investors and infrastructure partners, and its product stack suggests multiple ways to monetize enterprise demand. Yet nearly every metric needed for hard underwriting—customer concentration, margin, burn, runway, renewal, or CAC efficiency—remains private. That absence matters more here than in some earlier chapters because valuation and recommendation ultimately depend on whether the business can convert technical credibility into repeatable, profitable revenue. The right investment posture is therefore not to reject the company for lack of public detail, but to treat financial diligence as gating. Without management-level data, the market story risks outrunning the economics story. In short, the company looks fundable; the business model is not yet publicly auditable. That means the next diligence step is not a spreadsheet
    exercise built from public proxies alone, but a management-data review focused on stream mix, infrastructure commitments, and whether enterprise contracts are repeatable rather than opportunistic pilot revenue.
  claimRefs:
  - CI013
  - CI016
  - CI026
  - CI032
  - CI033
  - CI036
  - CI038
