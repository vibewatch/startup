summary:
  headline: |
    作为一家私有 AI 创业公司，Zyphra 的公开技术证据和伙伴证据异常强，但客户证明和经济性披露仍太薄，无法支持不看价格的测算。
    本报告支持继续研究 / 观察：在最近一次有证据支撑的独角兽估值附近可以建设性看待；但在客户和财务证据改善前，对传闻中的 2026 年估值跳升应保持谨慎。
