  topStrengths:
    - 以公司阶段看，公开技术记录异常丰富，既有 Zamba2 和 ZAYA1 研究，也有开放模型分发。
    - IBM 和 AMD 提供了有分量的伙伴验证和基础设施可信度。
    - 产品逻辑把模型、算力和工作流软件接在一起，而不是押注单一表面。
    - 主权控制和 AMD 原生定位，契合企业与公共部门的真实需求趋势。
    - 最近一次有证据支撑的 $1B 估值仍留有上行空间，前提是客户证据显著改善。
  topRisks:
    - 相比估值野心，客户广度、生产环境证明和留存披露仍不足。
    - 对 AMD / ROCm 生态的依赖可能更像执行集中度，而不是耐久护城河。
    - 烧钱速度、现金跑道和利润率结构都未公开，资本充足性仍无答案。
    - OpenAI、Anthropic、Mistral、Cohere 和 xAI 等竞争对手拥有更大规模、更多证据或更多资本。
    - 当前公开客户和经济性证据不足以有力支撑传闻中的 2026 年估值跳升。
  unresolvedGaps:
    - 具名生产环境客户，以及买方、用户、付款方、结果和续约背景。
    - 按业务流拆分的收入、ACV、毛利率、烧钱速度、现金跑道和留存指标。
    - 最近一次有证据支撑的独角兽阶段融资之后，任何 2026 年融资的已签条款和状态。
    - 企业部署所需的运行时可靠性、安全和合规材料。
    - 从开源或开发者采用转化为付费 Zyphra 云、算力或 MAIA 合同的路径。
