- id: residual-risk-and-kill-criteria
  title: Residual risk and kill criteria
  body: 'The right way to read Zyphra''s risks is cumulatively. No single disclosed issue currently destroys the thesis. The problem is that several medium-to-high risks could reinforce one another: regulation could slow deployment, AMD friction could slow performance or scale, absent customer proof could delay revenue, and financing dependence could raise dilution pressure or strategic fragility. The company does have real mitigation signals—strong partners, real technical outputs, and explicit fault-tolerance work—but they are concentrated in the technical layer. Public evidence remains thinner on governance, commercialization, and operating controls. Diligence should therefore look for clear kill criteria: delayed infrastructure expansion, inability to show named production customers, escalating legal friction, or a need for capital without matching commercial proof. If those indicators cluster, the thesis breaks not because the technology is weak, but because the business system around
    it is incomplete. Investors should also ask whether management has a pre-committed response plan for adverse regulatory change, supplier disruption, or slower-than-expected enterprise conversion. If those scenarios have not been rehearsed, residual risk should be considered higher than the technical story alone implies. Early.'
