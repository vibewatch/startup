  figureRefs:
  - FR001
- id: operational-and-dependency-risk
  title: Operational and dependency risk
  body: Operational risk follows directly from Zyphra's differentiation strategy. The company gains attention by coupling model research to AMD-native infrastructure and IBM-scale cluster design, but that same choice concentrates execution risk. The more Zyphra depends on specialized hardware, networking, and custom kernels, the more exposed it becomes to ecosystem maturity, supplier priorities, and cluster-scale failure modes. AMD and IBM materials prove sophistication, yet they also reveal how many moving parts are required for the thesis to work. AInvest adds the adverse view that ROCm maturity remains a constraint. Public evidence on production serving and incident management remains much thinner than public evidence on training. As a result, the company's technical credibility is real, but the operational residual risk remains high until runtime reliability and partner resilience are better documented.
  claimRefs:
  - CR008
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
