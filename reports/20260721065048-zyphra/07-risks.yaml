chapter:
  number: 7
  title: Risks
  summary: Zyphra's main risks are not abstract AI concerns; they cluster around evolving regulation, AMD/IBM dependency, financing needs, and commercialization proof. The company has credible mitigations on technical depth and partner quality, but much weaker public evidence on governance, runtime reliability, and customer conversion discipline.
sections:
- id: regulatory-and-legal-risk
  title: Regulatory and legal risk
  body: Zyphra operates in a part of AI where the rulebook is still moving. The EU AI Act expands compliance expectations for providers and deployers, U.S. copyright policy remains unsettled around training and outputs, and FTC scrutiny of AI accuracy claims is rising. For a company that markets open, multimodal, enterprise-ready systems, this mix creates a genuine legal stack rather than one isolated issue. The problem is not merely that any single regime could be costly; it is that several regimes are evolving at the same time, across multiple geographies and product layers. Public sources do not suggest a live enforcement action against Zyphra, but they do establish an environment in which weak governance or aggressive claims could become expensive quickly. Legal risk therefore sits near the top of the register even before customer scale is large. That burden can compound quickly if products cross borders or mix foundation-model distribution with enterprise workflow claims.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR023
  - CR031
  - CR038
  tableRefs:
