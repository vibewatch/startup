companyProfile:
  summary: |
    Zyphra is a 2021-founded San Francisco AI startup building what it calls the full-stack for open
    superintelligence. Public materials position the company across research, inference cloud, AMD-native
    compute, and MAIA, a shared-context superagent for enterprise knowledge work. The company's technical
    identity centers on efficient multimodal and long-context models such as Zamba2 and ZAYA1, plus deep
    co-design with AMD and IBM for large-scale training infrastructure. Public financing evidence supports
    a 2025 unicorn-stage Series A context, while 2026 reporting suggests Zyphra explored a much larger
    fundraising step-up that remains unconfirmed as a closed round.
  foundedDate: '2021-01-01'
  founders:
    - name: Krithik Puthalath
      role: Co-founder, CEO, Chairman
      background: Public sources identify him as Zyphra's co-founder and CEO leading the company's open-superintelligence strategy.
      claimRefs: [CO011, CO012, CO015]
    - name: Beren Millidge
      role: Co-founder, Chief Scientist
      background: Public sources identify him as co-founder and chief scientist, anchoring Zyphra's novel-architecture research agenda.
      claimRefs: [CO011, CO013]
    - name: Tomás Figliolia
      role: Co-founder, Head of AI Model Architecture
      background: Public sources identify him as a co-founder responsible for AI model architecture.
      claimRefs: [CO011, CO014]
  foundingLocation: San Francisco, California
  headquarters: San Francisco, California
  productSummary: |
    Zyphra sells a blended stack: open and enterprise-deployable multimodal models, long-context inference,
    AMD-native compute and training infrastructure, and MAIA as a workflow layer for team productivity.
    The public product record is strongest on model and infrastructure engineering, including Zamba2,
    ZAYA1, and a large AMD/IBM training cluster, and weaker on enterprise runtime and customer operating proof.
  customerFocus: Enterprise knowledge-work teams, sovereign or regulated organizations, and AI builders seeking controllable deployment and AMD-native infrastructure.
  businessModel: Hybrid model of inference services, cloud/compute infrastructure, and higher-level enterprise workflow software around MAIA; public pricing and margin realization remain undisclosed.
  stage: Series A private company
  fundingStatus: Supported by a 2025 $100M Series A / $1B valuation context with investors including AMD, IBM, Intel Capital, Future Ventures, Bison Ventures, and Jaan Tallinn; a larger 2026 fundraising process was reported but not confirmed closed.
  disclosureProfile: private-undisclosed
  claimRefs: [CO011, CO019, CO020, CO021, CO028, CO029, CO030, CO035, CE001, CE012]

summary:
  headline: |
    Zyphra has unusually strong public technical and partner evidence for a private AI startup, but its
    customer proof and economics disclosure are still too thin to justify price-insensitive underwriting.
    The report supports a research-more / track stance: constructive near the last supported unicorn mark,
    but cautious toward rumored 2026 step-up pricing until customer and financial proof improves.
  overallScore: 6.4
  recommendation: research-more
  confidence: medium
  riskRating: high
  valuationStance: stretched
  keyMetrics:
    valuationUsdM: 1000
    revenueRunRateUsdM: null
    arrUsdM: 8.8
    revenueGrowthYoYPct: null
    grossMarginPct: null
    nrrPct: null
    totalRaisedUsdM: 111.4
    customerCount: null
    headcount: 44
  topStrengths:
    - Public technical record is unusually rich for stage, with Zamba2 and ZAYA1 research plus open model distribution.
    - IBM and AMD provide meaningful partner validation and infrastructure credibility.
    - The product thesis joins models, compute, and workflow software rather than relying on a single surface.
    - Sovereign-control and AMD-native positioning align with real enterprise and public-sector demand trends.
    - The last supported $1B valuation still leaves room for upside if customer proof improves substantially.
  topRisks:
    - Customer breadth, production proof, and retention remain under-disclosed relative to valuation ambition.
    - AMD/ROCm ecosystem dependence could behave like execution concentration rather than a durable moat.
    - Burn, runway, and margin profile are not public, leaving capital adequacy unresolved.
    - Competitors such as OpenAI, Anthropic, Mistral, Cohere, and xAI have more scale, proof, or capital.
    - A rumored 2026 valuation step-up is not well supported by current public customer and economics evidence.
  unresolvedGaps:
    - Named production customers with buyer, user, payer, outcome, and renewal context.
    - Revenue by stream, ACV, gross margin, burn, runway, and retention metrics.
    - Closed terms and status of any 2026 financing beyond the last supported unicorn-stage round.
    - Runtime reliability, security, and compliance materials for enterprise deployments.
    - Conversion path from open-source or developer adoption into paid Zyphra cloud, compute, or MAIA contracts.

