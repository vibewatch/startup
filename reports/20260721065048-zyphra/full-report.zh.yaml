              融资报道，但应按市场信号处理，而非已交割事实。可比证据给出一个宽泛私募区间背景：AI21 只略高于 Zyphra，Mistral 和 Cohere 远高于它，xAI 则完全是另一数量级。正确结论不是 Zyphra
