              初创公司公开展现的内容更有实质。反论点同样清晰：公开客户证明、留存和经济性落后于野心。因此，投资者不是在“好公司”和“坏公司”之间选择，而是在为一个执行期权付费，还是为已经证明的商业质量付费之间选择。这个区分决定了估值章节的其余内容。换句话说，争论根本上关乎时点和价格，而不是公司是否拥有真实资产。
