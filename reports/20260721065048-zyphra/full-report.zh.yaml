        title: 收入架构与变现
        blocks:
          - type: paragraph
            body: >-
              Zyphra 的公开产品界面暗示的是混合收入模型，而非清晰单线 SaaS 业务。公司看起来可以通过模型和推理服务、基于 AMD 的算力或基础设施访问，以及 MAIA
              周边工作流软件变现。这种组合重要，因为每条收入流很可能有不同毛利和销售特征。算力或集群绑定服务通常带来更重交付成本和资本依赖；工作流或软件层一旦真正落地，则可能具备更好的长期经济性。但公开来源没有说明今天的收入有多少来自任一收入流，也没有披露实际合同结构。因此，收入模式可以从概念和战略上描述，却还不能精确量化。尽调时，正确立场是：变现路径可见，但变现质量大体未披露。目前。公开层面。
