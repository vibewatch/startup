        title: 产品界面与客户任务
        blocks:
          - type: paragraph
            body: >-
              Zyphra 的公开界面要按一个栈来理解，而不是单点产品。公司销售模型家族、推理软件、云和裸金属算力，并把 MAIA
              定位成面向知识工作者的应用层“超级智能体”。这给业务提供了连贯客户故事：企业或模型团队想要高效多模态模型，同时需要比封闭 API 供应商更多的部署控制。Hugging Face 和 GitHub
              上的开放分发进一步说明，公司不只是在卖托管访问；它试图成为可信的构建者平台和企业部署伙伴。同时，公开证据显示这个栈不同层成熟度不一。模型家族和技术产物记录充分，详细生产、定价和运营参考仍较薄。因此，产品章节必须把研究可信度和商业运营成熟度分开，而不能把二者当作同样已证明。这一区分对投资者和企业买家都重要，因为他们要评估的是即时可部署性与研究期权。
