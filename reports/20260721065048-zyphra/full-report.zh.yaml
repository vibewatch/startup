              本章最大问题不是没有故事，而是缺硬指标。一个估算级来源将 Zyphra 2024 年 ARR 放在
              $8.8M，但保留的官方来源都没有确认收入、预订额、毛利率或客户集中度。公开公司档案数据库和生态写作提供背景，但不能替代运营披露。结果形成不对称：投资者能看到强技术势能和伙伴可信度，却还看不到收入是否多元、经常性强，或是否以高效率取得。AI
              基础设施和部署业务尤其需要区分这一点，因为产品热度可以和薄弱或波动的经济性并存。因此财务判断必须保持保守：Zyphra 可能已经产生有意义收入，但若没有管理层确认，公开记录不足以把它视为高质量经常性软件收入。
