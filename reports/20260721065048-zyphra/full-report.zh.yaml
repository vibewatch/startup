              水平，公开证据包就太薄了。客户章节仍主要靠合作伙伴证明和开发者信号支撑；财务章节仍缺少能支撑高端后期定价的指标；风险章节也仍有实质性的融资、伙伴和监管不确定性。这并不说明公司没有吸引力，而是现有证据不足以支撑激进入场价。因此，正确的基准情景不是“永远回避”，而是“除非价格和证据一起改善，否则继续研究或观察”。这个基准也反映一个简单现实：估值不能脱离证据密度。管理层如果能快速补上证明缺口，同一家公司就可能值得开启完全不同的价格讨论。
