chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与公开产品版图
        blocks:
          - type: paragraph
            body: >-
              Zyphra 并没有把自己包装成单一用途的模型 API 初创公司。官网、关于页面、云页面、模型索引和 MAIA
              页面共同给出一个垂直整合的开放超级智能平台叙事：公司同时做研究实验室、产品公司和基础设施层。核心承诺是主权控制。Zyphra 认为，组织部署 AI
              时应当获得透明度、安全性、对齐能力和硬件灵活性，而不是依赖某个封闭供应商栈。公开产品地图强化了这条叙事：Zyphra Research 覆盖开放基础模型；Zyphra Cloud
              覆盖算力、推理和企业交付；MAIA 则被定位成面向协同团队工作流的更高层智能体产品。模型目录本身已经拆成语言、音频、思维和视觉几条线。商业含义很清楚：Zyphra
              不只想靠模型权重变现，也想卖托管、推理、算力容量，以及围绕这些模型搭建的工作流软件。
