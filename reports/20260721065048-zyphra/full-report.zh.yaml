companyProfile:
  summary: >
    Zyphra 是一家 2021 年成立的旧金山 AI 初创公司，正在搭建其所称的开放超级智能全栈。公开材料把公司定位在研究、推理云、AMD 原生算力和 MAIA 之间；MAIA
    是面向企业知识工作的共享上下文超级智能体。公司的技术身份围绕 Zamba2、ZAYA1 等高效多模态和长上下文模型展开，也与 AMD、IBM 深度共设大规模训练基础设施。公开融资证据支撑 2025 年独角兽阶段的 Series A
    背景；2026 年报道则显示 Zyphra 探索过更大一轮融资，但尚未证实为已交割轮次。
