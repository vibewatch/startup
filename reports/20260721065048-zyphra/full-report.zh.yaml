        title: 版图：直接同行与在位巨头
        blocks:
          - type: paragraph
            body: >-
              Zyphra 的竞争者分成两类。第一类是也销售企业可部署或开放权重 AI 系统的直接同行，包括 Mistral、Cohere、AI21、Aleph Alpha、Stability AI、xAI，以及程度较低的
              Inflection。第二类是在位巨头，分发和客户证明更强，尤其是 OpenAI、Anthropic、Google 和 Meta。这一点重要，因为 Zyphra
              不只在原始模型质量上竞争；它还在争夺买家是否选择一个偏主权友好的技术栈，而不是采用率很深的工作流套件、有品牌的前沿模型供应商，或围绕广泛分发开放权重自建内部系统。公开来源显示，Mistral 和 Cohere
              已经熟练使用企业部署话术，而 OpenAI 和 Anthropic 拥有更广的装机基础和更强可见客户参考。因此，Zyphra 不是进入白地品类；它进入的是一个买家需求已经被上方巨头和侧面同行共同激烈争夺的市场。
