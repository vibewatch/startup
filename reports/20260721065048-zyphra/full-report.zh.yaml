              基础设施；Zyphra 则贡献自定义内核、优化器工作、容错和检查点系统。这些细节不只是营销话术：它们描述了一套具体运营架构，依赖项可识别，声称结果也可衡量，例如 PFLOPs 性能、8x KV-cache
              压缩和更快检查点。这让 Zyphra 不再只是模型实验室，而是作为技术基础设施运营者也格外可辨。成本是依赖集中。如果 AMD 供给、ROCm 性能或伙伴执行不及预期，Zyphra
