  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Zyphra 所处的 AI 领域，规则书仍在改写。EU AI Act 扩大了对提供方和部署方的合规预期；美国版权政策围绕训练和输出仍未稳定；FTC 对 AI 准确性声明的审查也在上升。Zyphra
              销售开放、多模态、企业就绪系统，这些因素叠加成一整套真实法律栈，而非孤立问题。问题不只是某个单一制度可能带来成本；而是多个制度正在多个地域和产品层同时演进。公开来源没有显示 Zyphra
              面临正在进行的执法行动，但它们确立了一个环境：治理薄弱或主张激进，都可能迅速变贵。因此，即使客户规模还不大，法律风险也位于风险清单靠前位置。如果产品跨境，或把基础模型分发与企业工作流主张混在一起，这个负担会快速叠加。
