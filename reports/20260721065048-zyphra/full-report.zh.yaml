  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 可能客户是谁
        blocks:
          - type: paragraph
            body: >-
              公开记录支持 Zyphra 的三类主要客户。第一类是可能使用 MAIA 或长上下文工作流的企业 AI 和知识工作团队。第二类是重视部署控制、数据治理或硬件灵活性的受监管或主权敏感组织。第三类是需要 AMD
              原生训练或推理容量的模型构建者或 AI 基础设施团队。这些群体符合公司的产品页面，也符合围绕主权 AI、企业 AI
              预算和长期智能体负载的更广泛外部市场证据。公开来源没有做到的，是把这些合乎逻辑的细分转成清晰具名客户名单。因此，细分有更强支撑，采用证明较弱。买家地图可信，但目前更像论点驱动，而不是 logo
              驱动。主要分析警示是，细分匹配不应与细分渗透混为一谈。许多 AI 公司都能讲出同一张买家地图；能证明地图已转化成可重复购买行为的公司少得多。目前如此。
