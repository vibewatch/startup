      - number: '2.2'
        title: 主权 AI 与部署控制成为采购驱动
        blocks:
          - type: paragraph
            body: >-
              Zyphra 最重要的战略顺风，可能是主权 AI 真正成为采购标准。Zyphra 自己的使命语言强调主权控制，外部市场来源也说明这种定位为什么能引发共鸣。Deloitte 明确定义主权 AI
              围绕法律、基础设施和数据控制；MarketsandMarkets 进一步把它转化成独立市场预测，认为政府和受监管企业越来越把 AI 当作战略资产，而不只是生产力功能。同一份报告称，政府和公共部门当前引领主权 AI
              需求，监管、数据本地化和出口管制压力正在重塑部署选择。Zyphra 的算力和推理页面与这些需求契合：长上下文、裸金属 AMD 基础设施和深度 ROCm
              集成，都会吸引想要可移植性或可审计控制的买家。限制在于，许多成熟竞争者现在也提供某种自托管或主权部署，因此主权定位是强市场顺风，但不是自动护城河。
