        title: 残余风险与否决标准
        blocks:
          - type: paragraph
            body: >-
              解读 Zyphra 风险，正确方式是累积看。当前没有单一已披露问题足以摧毁论点。问题在于，几个中高风险可能彼此强化：监管可能拖慢部署，AMD
              摩擦可能拖慢性能或规模，缺少客户证明可能推迟收入，融资依赖可能抬高稀释压力或战略脆弱性。公司确实有真实缓释信号——强伙伴、真实技术输出和明确容错工作——但它们集中在技术层。公开证据在治理、商业化和运营控制上仍更薄。因此，尽调应寻找清晰否决标准：基础设施扩张延迟、无法展示具名生产客户、法律摩擦升级，或缺少匹配商业证明却仍需要资本。如果这些指标聚集，论点破裂不是因为技术弱，而是因为技术周边的业务系统不完整。投资者还应追问，管理层是否预先制定了面对不利监管变化、供应商中断或企业转化慢于预期的响应计划。如果这些场景没有演练，残余风险就应高于单看技术故事的水平。仍处早期。
