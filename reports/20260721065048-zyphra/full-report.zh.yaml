              效率——仍是私人信息。这个缺口在本章比在前几章更重要，因为估值和建议最终取决于业务能否把技术可信度转成可重复、可盈利的收入。因此，正确投资姿态不是因为缺少公开细节而否决公司，而是把财务尽调设为门槛。没有管理层级数据，市场故事可能跑在经济性故事前面。简言之，公司看起来融得到钱；商业模式还不能被公开审计。这意味着下一步尽调不是只靠公开代理变量搭一张表，而是审阅管理层数据，重点看收入流组合、基础设施承诺，以及企业合同是可重复收入还是机会型试点收入。
