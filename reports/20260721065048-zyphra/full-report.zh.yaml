            body: >-
              最干净的总体建议，是有纪律地保留期权。Zyphra 值得关注，因为它的技术和战略叙事明显好于 AI 初创公司的中位数，IBM/AMD
              的伙伴证明也降低了整套叙事只是泡沫的概率。但它还不足以支撑不看价格的投资假设。信心应保持中等，风险评级保持高，估值立场保持“谨慎观察 /
              证据闸门”。最关键的几项尽调要求很清楚：具名生产客户、按收入流拆分的收入、烧钱速度和现金跑道、实际定价，以及 2026 年融资流程是否真的完成。这些答案可能很快改变判断。在此之前，估值结论是：Zyphra
              有趣到值得紧密跟踪，也可能在合适价格支持，但公开证据还不足以在情绪高点追价。同一套尽调材料也会厘清稀释风险、伙伴依赖，以及每个产品层到底有多少定价权。在这些问题得到回答前，投资人实际上为潜力付了两次钱：一次在公司叙事里，一次在入场价格里。估值工作要防的，正是这种重复计价风险。
