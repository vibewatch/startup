            body: >-
              正确整体结论是，Zyphra 具备可信买家匹配和有意义伙伴验证，但公开客户证明不完整。私人 AI
              初创公司常见这种情况，但它仍然重要，因为估值敏感判断需要证据证明用户能变成客户，客户能变成稳固账户。最尖锐的不利解读是，开源关注度和重量级基础设施伙伴关系，可能比实际变现采用领先更久，超出投资者预期。更建设性的解读是，Zyphra
              只是披露仍早，不一定部署仍早。目前证据无法解开这个张力。因此，客户尽调必须聚焦具名部署、生产状态、合同规模、续约，以及社区认知向付费使用的转化。在此之前，客户章节支持保持关注，而不是高确信的商业规模证明。近期最重要的证明，是
              3 到 5 个具名生产部署，并明确买家、用户、结果和续约背景。那会立刻让客户质量和估值判断都更锋利。公开层面目前仍是如此。
