      - number: '2.4'
        title: 约束、采用摩擦与市场结论
        blocks:
          - type: paragraph
            body: >-
              市场有吸引力，但并不顺滑。Deloitte 称，许多公司在智能体治理上仍处早期；Stanford HAI 称，尽管更广泛的生成式 AI 采用率上升，AI 智能体部署仍偏低。MarketsandMarkets
              在宏观层面指出同样结构性刹车：人才稀缺、资本开支强度高、半导体供应碎片化。落到 Zyphra 身上，这些通用摩擦还叠加公司自身问题。开放权重分发降低了开发者门槛，但也意味着单靠开放无法与 Mistral 或
              Meta 拉开差距。AMD 原生基础设施创造了逆向采购角度，但 AInvest 式的 ROCm
              生态怀疑表明，市场在更多真实部署跑通之前可能仍会打折。结果是一个有利但苛刻的市场：支出、合规压力和工作流需求显然足以支撑 Zyphra
              论点；但在把宏观顺风转化成紧凑可服务市场假设之前，公司仍需要客户证据和可重复的企业销售动作。
