        - id: discover
          label: 发现 Zyphra
          description: 团队最初通过开放模型、GitHub 项目或伙伴公告接触 Zyphra。
        - id: evaluate
          label: 评估契合度
          description: 买家把主权控制、长上下文或 AMD 原生需求拿到现有工作流里测试。
        - id: partnerproof
          label: 伙伴信心
          description: IBM、AMD 和 TensorWave 提供生态证明，说明这套栈具备严肃落地基础。
        - id: pilot
          label: 试点 / 概念验证
          description: 公开来源没有清楚披露有多少评估进入试点。
        - id: deploy
          label: 部署模型或基础设施
          description: 部分买家可能先从模型或基础设施部署切入，再采购更高层软件。
        - id: expand
          label: 扩展到 MAIA 工作流
          description: 期望中的扩张循环，是从基础设施 / 模型使用延伸到更广泛的知识工作自动化。
    approximationNotes: 此旅程依据公开产品和伙伴材料推断；客户背书有限。
    claimRefs:
      - CU001
      - CU008
      - CU013
      - CU018
      - CU032
  - id: FU002
    title: 采用 / 部署漏斗
    type: funnel
    layout: standard
    summary: 随着 Zyphra 从认知入口走向具名付费部署，公开证据明显变薄。
    data:
      items:
        - label: 认知入口
          value: 4
          unit: public channels
          tone: positive
        - label: 具名伙伴证明点
          value: 4
          unit: references
          tone: neutral
        - label: 具名终端客户证明
          value: 0
          unit: retained disclosures
          tone: warning
        - label: 公开留存指标
          value: 0
          unit: retained metrics
          tone: risk
    approximationNotes: 0 表示已纳入来源没有公开披露，不是经济零客户。
    claimRefs:
      - CU004
      - CU006
      - CU007
      - CU008
      - CU014
      - CU015
  - id: FU003
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 证据质量在伙伴验证上最强，在收入、留存和生产阶段证明上最弱。
    data:
      columns:
        - 低
        - 中
        - 高
      rows:
        - label: 具名终端客户证明
          values:
            - Zyphra 公开记录
            - 竞争对手类比
            - N/A
        - label: 伙伴 / 生态证明
          values:
            - N/A
            - TensorWave
            - IBM / AMD 集群引用
        - label: 开发者信号可见性
          values:
            - N/A
            - GitHub
            - Hugging Face + GitHub 分发
        - label: 留存可见性
          values:
            - Zyphra 公开记录
            - N/A
            - N/A
    approximationNotes: 这个矩阵评估证据质量，不评估客户满意度。
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
      - CU021
      - CU022
      - CU035
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高剩余风险集中在监管、伙伴依赖、融资和客户转化上，而不是单一技术缺陷。
    data:
      columns:
        - 低
        - 中
        - 高
      rows:
        - label: 法律 / 监管
          values:
            - 常规合规
            - AI 声明审查
            - EU AI Act + 版权不确定性
        - label: 运营 / 技术
          values:
            - 孤立 bug
            - 集群调优问题
            - ROCm 成熟度 + 服务证据缺口
        - label: 融资 / 业务
          values:
            - 可选资本
            - 正常扩张需求
            - 资本依赖 + 披露有限
        - label: 商业化
          values:
            - 早期好奇心
            - 伙伴证明
            - 客户转化仍薄弱
    approximationNotes: 这是基于来源包搭建的序位剩余风险图，不是量化模型。
    claimRefs:
      - CR001
      - CR010
      - CR014
      - CR021
      - CR026
      - CR038
  - id: FR002
    title: 风险传导图
    type: dag
    layout: standard
    summary: 多个中等风险若同时发生，可能叠加成收入和估值压力。
    data:
      nodes:
        - id: legal
          label: 法律 / AI 治理变化
          tone: risk
        - id: amd
          label: AMD / 基础设施摩擦
          tone: risk
        - id: customer
          label: 客户转化弱
          tone: risk
        - id: finance
          label: 融资压力
          tone: risk
        - id: valuation
          label: 收入 / 估值压缩
          tone: critical
      edges:
        - from: legal
          to: customer
          label: 采购变慢
        - from: amd
          to: customer
          label: 性能 / 交付风险
        - from: customer
          to: finance
          label: 证明更弱
        - from: finance
          to: valuation
          label: 摊薄 / 重新定价
        - from: amd
          to: valuation
          label: 成本 / 延误压力
    approximationNotes: 箭头概括各章节和表格中讨论的可能传导路径。
    claimRefs:
      - CR024
      - CR029
      - CR030
      - CR036
      - CR040
  - id: FR003
    title: 依赖图
    type: dag
    layout: standard
    summary: 风险架构高度依赖少数外部系统和交易对手。
    data:
      nodes:
        - id: amd
          label: AMD 硬件 + ROCm
          tone: warning
        - id: ibm
          label: IBM Cloud 集群
          tone: warning
        - id: rules
          label: 变化中的法律 / 监管规则
          tone: warning
        - id: capital
          label: 未来资本市场准入
          tone: warning
        - id: zyphra
          label: Zyphra 运营体系
          tone: neutral
      edges:
        - from: amd
          to: zyphra
          label: 训练底座
        - from: ibm
          to: zyphra
          label: 集群规模
        - from: rules
          to: zyphra
          label: 合规负担
        - from: capital
          to: zyphra
          label: 现金跑道和扩张
    approximationNotes: 这张图突出外部依赖，而不是内部团队。
    claimRefs:
      - CR008
      - CR013
      - CR014
      - CR024
      - CR033
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 推荐意见沿着市场和产品强度、客户 / 经济性缺口，再到价格敏感纪律这条链条形成。
    data:
      nodes:
        - id: market
          label: 大型 AI 和主权 AI 需求
          tone: opportunity
        - id: product
          label: 技术和伙伴证明强
          tone: opportunity
        - id: customer
          label: 客户和经济性证明薄
          tone: warning
        - id: price
          label: 价格敏感性很重要
          tone: warning
        - id: call
          label: 继续研究 / 观察
          tone: neutral
      edges:
        - from: market
          to: product
        - from: product
          to: customer
        - from: customer
          to: price
        - from: price
          to: call
    approximationNotes: 这条逻辑链概括前文各章，不产出公式化模型。
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV016
      - CV038
      - CV040
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: 最重要的敏感项不是市场规模，而是投资者在入场时愿意容忍多少证明缺口。
    data:
      items:
        - label: 客户证明敏感性
          value: 10
          unit: high impact
          tone: warning
        - label: 收入质量敏感性
          value: 9
          unit: high impact
          tone: warning
        - label: 融资条款敏感性
          value: 8
          unit: high impact
          tone: warning
        - label: 伙伴执行敏感性
          value: 7
          unit: high impact
          tone: neutral
        - label: 市场顺风敏感性
          value: 6
          unit: supportive
          tone: opportunity
    approximationNotes: 数值是供投委会讨论的序位评分，不是市场推导系数。
    claimRefs:
      - CV015
      - CV018
      - CV025
      - CV026
      - CV029
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支持较宽估值区间；价格跑得比证明更快时，信心会明显下台阶。
    data:
      items:
        - label: 纪律性入场区间
          low: 1000
          high: 1500
          unit: US$M post-money context
          tone: neutral
        - label: 拉伸 / 流程区间
          low: 5000
          high: 5500
          unit: US$M process rumor
          tone: warning
        - label: 证据信心
          low: 2
          high: 6
          unit: 10-point confidence band
          tone: risk
    approximationNotes: 上沿反映的是据报道的融资流程，不是已确认完成的估值。
    claimRefs:
      - CV001
      - CV002
      - CV014
      - CV015
      - CV016
      - CV034
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: KPI 卡片压缩了这幅复杂图景：市场和产品强，证明和经济性可见度弱。
    data:
      items:
        - label: 市场吸引力
          value: 8
          unit: /10
          tone: opportunity
        - label: 产品 / 护城河证据
          value: 7
          unit: /10
          tone: opportunity
        - label: 客户证明
          value: 3
          unit: /10
          tone: warning
        - label: 经济性可见度
          value: 2
          unit: /10
          tone: risk
        - label: 估值超过 $5B 时的价格接受度
          value: 1
          unit: /10
          tone: adverse
    approximationNotes: 分数是本报告的判断性摘要，不是基准测试输出。
    claimRefs:
      - CV011
      - CV012
      - CV015
      - CV027
      - CV028
      - CV029
