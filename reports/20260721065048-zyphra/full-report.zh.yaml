      - number: '2.3'
        title: 买家、付费意愿与竞争重叠
        blocks:
          - type: paragraph
            body: >-
              公开市场证据显示，企业正在走出实验阶段，但购买中心仍然挑剔。Stanford HAI 和 Deloitte 显示 AI 使用率上升，State of AI 又补上一层商业信号：更多美国企业开始为 AI
              工具付费，平均合同金额可观，AI-first 初创公司增长快于同类公司。这让知识密集型企业职能、公共部门团队和受监管行业成为 Zyphra 的合理目标买家。问题在于，这些账户也正是
              Mistral、Cohere、AI21、OpenAI、Anthropic 和 Aleph Alpha 争抢的对象。Mistral 和 Cohere 都强调企业部署和智能体工作流；OpenAI 和
              Anthropic 已经展示广泛客户证明；Meta 和 Stability 持续施加开放模型压力；Aleph Alpha 则重押主权。Zyphra
              因此受益于一个真实预算类别，但并不是进入空白市场。要赢，它必须围绕硬件灵活性、长上下文推理经济性或部署控制，拿出比大型在位者和资金更充足同行更尖锐的价值主张。
