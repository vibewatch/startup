            body: >-
              融资和公开证据都明显向 Zyphra 对手倾斜。新闻报道将 Cohere 和 Mistral 的估值放在 Zyphra 最后有支撑的独角兽标记之上，AI21 略高于它，xAI
              则处在完全不同的资本量级。OpenAI 和 Anthropic
              同样享有更强客户证明，即便本章对它们更多依赖官方部署证据，而不是逐轮资本数据。这些差异重要，因为资本能买来分发、算力访问，以及对漫长企业销售周期的耐心。它也提高了在位者压低价格或打包功能来守住账户的概率。相比之下，Zyphra
              的公开足迹仍更轻，技术野心和基础设施合作证据强于具名商业胜利。这并不意味着公司没有竞争力，但任何承销案例都必须计入全场资源不对称。Inflection 部分收缩也提醒我们，大额融资本身不能保证持久 GTM
