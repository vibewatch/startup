      - number: '1.4'
        title: 里程碑、伙伴关系与一阶风险信号
        blocks:
          - type: paragraph
            body: >-
              Zyphra 的可见里程碑集中在三条线：开放模型发布、AMD 原生基础设施，以及把这些资产转化为企业智能体工作流的尝试。VentureBeat 早期通过 Zamba
              发布注意到这家公司，帮助其建立高效开放模型的身份。官方 ZAYA1 材料和 AMD 自己的技术复盘随后把叙事从研究新意抬升到基础设施证明点，称 Zyphra 在 AMD 硬件、软件和网络上端到端训练了
              ZAYA1-base。IBM 与 Zyphra 后来把这条线延伸为多年集群合作，用来支撑多模态模型和 MAIA。这些里程碑支持一个判断：Zyphra 试图靠开放权重模型，加上非 NVIDIA
              基础设施上的主权部署来竞争。迄今最清晰的不利公开论点不是法律风险，而是战略风险：AInvest 认为，只有 ROCm 和更广泛 AMD 生态能够对标 CUDA 扩展时，模型证明才有意义。因此，Zyphra
              的姿态差异化明确，但市场耐久性仍取决于生态执行、客户证明和资本部署纪律。
