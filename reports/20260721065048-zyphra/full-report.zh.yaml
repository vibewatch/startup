  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与增长视角
        blocks:
          - type: paragraph
            body: >-
              分析
              Zyphra，不该把它放进一个笼统的“AI”整体市场里。它的公开叙事落在企业基础模型支出、主权或自托管部署、长期智能体工作流的交叉点。这一点重要，因为自上而下的数字会随分析师纳入范围不同而大幅变化。Mordor
              Intelligence 估算的 2026 年企业 AI 市场远大于 Grand View Research，而 Stanford HAI
              关注投资流向和采用率，不只看软件收入。这些来源给出的共同信号是方向很强：2025 年企业 AI 投资快速加速，采用率上行，新的私人融资仍然充裕。因此，Zyphra 的正确市场镜头不是“所有 AI
              软件”，而是买家需要定制、数据控制或非 NVIDIA 基础设施选择时产生的模型、基础设施和部署支出子集。这仍是一个大机会，但比泛化消费者或 API 规模 AI 需求明显更小，也更受采购流程约束。
