  - FE002
- id: architecture-and-research-depth
  title: Architecture and research depth
  body: 'The deepest public evidence sits in Zyphra''s technical materials. The Zamba2 report documents a suite of hybrid Mamba2-transformer models optimized for efficiency, with open-source weights and the Zyda-2 dataset. Separate ZAYA1 reports show the company stretching into mixture-of-experts reasoning and multimodal systems beyond the smaller efficient-model story. This is important because it suggests Zyphra is not boxed into one narrow architecture; rather, it is experimenting across efficient hybrid models, multimodal systems, and agent-friendly inference. External coverage of the original Zamba launch and later ZAYA1 release reinforces the same theme: Zyphra is intentionally pushing efficiency and deployability, not just benchmark maximalism. The public research corpus is unusually rich for a young company, and it materially strengthens the credibility of the product thesis even before customer proof is abundant.'
  claimRefs:
  - CE002
  - CE003
  - CE004
  - CE005
  - CE020
  - CE021
  - CE022
  - CE033
  - CE037
  tableRefs: []
  figureRefs: []
- id: amd-native-infrastructure-and-dependencies
  title: AMD-native infrastructure and dependencies
  body: 'Zyphra''s most distinctive public technology bet is its deep coupling to AMD hardware and software. AMD and IBM both describe a jointly engineered training environment using MI300X GPUs, Pollara networking, and IBM Cloud infrastructure, with Zyphra contributing custom kernels, optimizer work, fault tolerance, and checkpointing systems. Those details go beyond marketing fluff: they describe a specific operating architecture with identifiable dependencies and measurable claimed outcomes such as PFLOPs performance, 8x KV-cache compression, and faster checkpointing. This makes Zyphra unusually legible as a technical infrastructure operator, not just a model lab. The cost is dependency concentration. If AMD supply, ROCm performance, or partner execution disappoints, a meaningful piece of Zyphra''s product differentiation weakens with it. The technical upside and the ecosystem risk are therefore inseparable parts of the same architecture decision.'
  claimRefs:
  - CE006
  - CE007
  - CE008
  - CE009
  - CE010
  - CE011
  - CE012
  - CE013
  - CE023
  - CE024
