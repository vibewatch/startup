company:
  name: Zyphra
chapter:
  number: 5
  title: Product & Technology
  summary: 'Zyphra presents a real full-stack AI product thesis rather than a single model launch: open-weight models, long-context inference, AMD-native infrastructure, and a MAIA agent layer. The strongest public evidence supports research depth and training-stack sophistication; the weakest area is enterprise runtime, trust, and production-operating proof.'
sections:
- id: product-surface-and-customer-job
  title: Product surface and customer job
  body: 'Zyphra''s public surface should be understood as a stack rather than a point product. The company markets model families, inference software, cloud and bare-metal compute, and MAIA as an application-layer “superagent” for knowledge workers. That gives the business a coherent customer story: enterprises or model teams that want efficient multimodal models plus more deployment control than a closed API vendor offers. Open distribution on Hugging Face and GitHub reinforces that the company is not just selling hosted access; it is trying to become a credible builder platform and enterprise deployment partner. At the same time, public evidence shows different maturity levels across the stack. The model families and technical artifacts are well documented, while detailed production, pricing, and operational references remain thinner. The product chapter therefore has to separate research credibility from commercial-operational maturity rather than treating both as equally proven. That
    distinction is important for both investors and enterprise buyers evaluating immediate deployability versus research optionality.'
  claimRefs:
  - CE001
  - CE016
  - CE017
  - CE018
  - CE035
  - CE036
  tableRefs:
  - TE001
  - TE002
  figureRefs:
