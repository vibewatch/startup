    - Named production customers emerge, MAIA monetizes, AMD/IBM execution scales smoothly
    - Value expands well above unicorn level on stronger customer proof
    - Execution and financing still matter
    - Would require rapid improvement in public or diligence-only proof
  - - Base
    - Technical credibility remains high but customer proof builds gradually
    - Company remains interesting but price support stays selective
    - Revenue-quality gap persists
    - Best fits current evidence pack
  - - Bear
    - Customer proof remains thin, financing becomes more expensive, AMD ecosystem frictions linger
