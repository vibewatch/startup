- id: recommendation-and-diligence-path
  title: Recommendation and diligence path
  body: 'The cleanest overall recommendation is disciplined optionality. Zyphra deserves attention because the technical and strategic story is materially better than the median AI startup story, and IBM/AMD partner proof lowers the chance that the whole narrative is vapor. But it does not yet deserve price-insensitive underwriting. Confidence should stay at medium, risk rating at high, and valuation stance at “watchful / evidence-gated.” The few diligence asks that matter most are obvious: named production customers, revenue by stream, burn and runway, realized pricing, and whether the 2026 fundraising process actually closed. Those answers could move the call quickly. Until then, the valuation verdict is that Zyphra is interesting enough to follow closely and possibly back at the right price, but not yet evidenced enough to chase at peak sentiment. The same diligence package would also clarify dilution risk, partner dependence, and how much pricing power really exists in each product layer.
    Until those items are answered, an investor is effectively paying for potential twice: once in the company narrative and again in the entry price. That double-counting risk is exactly what disciplined valuation work is supposed to prevent.'
