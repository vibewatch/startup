- id: price-sensitivity-and-scenarios
  title: Price sensitivity and scenarios
  body: 'The recommendation is highly price-sensitive. Near the last supported $1B mark, a constructive case exists: Zyphra could still be bought as an option on customer conversion if diligence later confirms revenue quality, partner resilience, and MAIA monetization. Above the rumored $5B level, the public evidence pack becomes too thin. The customer chapter is still mostly partner-proof and developer-signal heavy; the financial chapter is still missing the metrics that justify premium late-stage pricing; and the risk chapter still carries meaningful financing, partner, and regulatory uncertainty. That does not make the company unattractive. It makes the stock of evidence inadequate for an aggressive entry price. The correct base case is therefore not “avoid forever,” but “research more or track unless price and proof improve together.” That base case also reflects a simple reality: valuation cannot be separated from evidence density. If management can quickly close the proof gaps, the
    same company could deserve a materially different price discussion.'
  claimRefs:
  - CV014
  - CV015
  - CV016
  - CV022
