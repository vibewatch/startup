  - TP001
  figureRefs:
  - FP001
- id: scale-funding-and-proof-advantages
  title: Scale, funding, and proof advantages of the field
  body: Funding and public proof skew heavily toward Zyphra's rivals. News coverage places Cohere and Mistral at valuations well above Zyphra's last supported unicorn mark, AI21 modestly above it, and xAI at an entirely different capital scale. OpenAI and Anthropic similarly benefit from far greater customer proof, even if this chapter relies more on official deployment evidence than round-by-round capital data for them. These differences matter because capital buys distribution, compute access, and patience for long enterprise sales cycles. They also raise the odds that incumbents can compress pricing or bundle functionality to defend accounts. By contrast, Zyphra's public footprint is still lighter, with stronger evidence on technical ambition and infrastructure partnerships than on named commercial wins. That does not make the company uncompetitive, but it does mean any underwriting case must account for asymmetric resources across the field. Inflection's partial retrenchment is the adverse
    reminder that large raises alone do not guarantee durable GTM execution or independence.
  claimRefs:
  - CP015
  - CP016
  - CP017
  - CP018
  - CP019
  - CP022
  - CP030
  - CP031
  tableRefs: []
  figureRefs:
