company:
  name: "Statsig"
chapter:
  number: 4
  title: "Financials"
  summary: "Statsig disclosed $40 million of ARR in May 2025, while Sacra separately estimated the same ARR and reported more than 300 paying customers; neither figure establishes accounting revenue, profitability, or current cash generation. Public evidence supports an event-linked software model and substantial historical financing, but gross margin, retention, acquisition efficiency, cash, burn, runway, and post-transition contract economics remain material underwriting gaps."
sections:
  - id: "revenue-streams-and-pricing-architecture"
    title: "Revenue Streams, Event Metering, and Pricing Mechanics"
    body: "The retained evidence supports an event-linked software model, but not a complete current price book. TechCrunch reported that Statsig expanded its free feature-management allowance from 5 million to 500 million monthly events in February 2023 while keeping advanced analytics paid. A July 2025 company comparison described pricing as usage-based, without seat or monthly-active-user charges, but supplied no numeric rate card. Current technical documentation presents both Statsig-hosted and warehouse-native delivery. Sacra describes metering across feature-flag exposures, experiment participants, and analytics events; that is an analyst characterization rather than a disclosed contract schedule. Statsig's own educational material distinguishes ARR from total revenue, so the May 2025 $40 million ARR figure cannot be treated as accounting revenue."
    claimRefs:
      - "CI001"
      - "CI003"
      - "CI004"
      - "CI006"
      - "CI009"
      - "CI016"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "gtm-motion-and-cost-structure"
    title: "GTM Motion, Sales Efficiency, and Delivery Cost Structure"
    body: "The 2023 free-tier expansion documents a product-led acquisition mechanism, not its conversion efficiency. Statsig's chief executive told TechCrunch that feature management was relatively inexpensive to operate, that large-customer analytics workloads carried significant costs, and that conversion by only a few free users could cover the free plan; no conversion cohort or contribution-margin schedule was supplied. Sacra says warehouse-native deployment can lower Statsig's infrastructure cost because analysis occurs inside a customer's data environment, but public evidence does not quantify the saving or prove a high-margin outcome. The assigned sources disclose no sales cycle, customer-acquisition cost, CAC payback, gross margin, or net retention. Those omissions prevent a reliable judgment on whether usage expansion produces attractive incremental economics."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI005"
      - "CI008"
    tableRefs:
      - "TI003"
    figureRefs:
      - "FI001"
  - id: "traction-capital-adequacy-and-transition"
    title: "Public Traction, Capital Adequacy, and Corporate Transition"
    body: "GeekWire reported Statsig's company-disclosed $40 million ARR in May 2025, and Sacra separately estimated $40 million ARR for that month and reported more than 300 paying customers. The agreement between those two sources does not replace an audited ARR bridge, and GeekWire said Statsig declined further financial detail or a profitability disclosure. Sacra reported that the $100 million Series C comprised $80 million of primary capital and $20 million of employee secondary sales, while GeekWire and Sacra put cumulative funding above $153 million. Funding raised is not cash available: none of the assigned sources provides current cash, burn, debt, runway, or post-close capital obligations. Convert, a competitor in experimentation software, later reported that Amplitude would take on the Statsig brand and customers in May 2026; its account makes renewal pricing and contract continuity diligence priorities, but is not an independent benchmark."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI010"
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
      - "CI015"
      - "CI016"
