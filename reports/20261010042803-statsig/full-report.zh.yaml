      - number: '3.2'
        title: 功能能力与统计架构
        blocks:
          - type: paragraph
            body: >-
              Statsig 将应用内功能开关、产品分析和企业级统计引擎紧密统一为一条开发者工作流，以此形成核心差异化。 平台除自动诊断样本比例失配外，还提供 CUPED 方差缩减、带始终有效 p 值的序贯检验等高级统计方法。
              这些统计处理可在不抬高假阳性率的情况下，把所需样本量和实验周期缩短 30%-50%，从而加快实验速度。 Adobe Analytics 等传统企业套件把实验当作事后补充，依赖 Adobe Target
              等独立附加工具，统计框架也较为基础。 开源替代方案 GrowthBook 同样支持 CUPED 和本地进程内 SDK 评估；但 Statsig 的开箱即用统计自动化无需团队自建 SQL 管道，
              就能让工程团队立即获得严谨的统计能力。
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP011
              - CP015
