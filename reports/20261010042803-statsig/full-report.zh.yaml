              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.2'
        title: 估值倍数、并购先例与情景投资判断
        blocks:
          - type: paragraph
            body: >-
              把 Statsig 的 $1.1B 估值与软件行业基准比较，可以看到明显的估值拉伸。以 $40M ARR 计算，Statsig 的 27.5 倍收入倍数超过高增长
              私有企业软件供应商当前中位数的两倍。并购动态显示市场整合正在加速：据报道，Statsig 拒绝了 Datadog 的收购要约，随后 Datadog 以约 $220M 收购实验竞争对手
              Eppo，把测试能力嵌入可观测性技术栈。之后，OpenAI 宣布以 $1.1B 股票收购 Statsig，彻底改变流动性格局。 在情景投资判断中，基准情景假设收入扩张至 $70M，并按正常化的 10 倍 ARR
              倍数得出 $700M 公允价值，较 C 轮定价折价 36%。 悲观情景假设平台吸收加速，估值收缩至 $225M；乐观情景则要求 ARR 增长至 $120M、倍数达到 18 倍，才能实现 $2.16B 结果。
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV009
              - CV013
      - number: '8.3'
        title: 退出准备度、尽调重点与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              Statsig 的退出路径在 OpenAI 宣布 $1.1B 收购协议后，已从独立 IPO 永久转向战略吸收。 对评估老股交易或合成敞口的潜在投资者而言，公开申报中仍有关键尽调盲区。尤其是，Statsig
              尚未公开毛利率画像、净收入留存率（NRR）、 客户获客成本（CAC）回收期或头部客户收入集中度。这些遗漏阻碍了对现金流持久性的精确投资判断。 如果 Statsig 在独立商业治理下证明 NRR 超过
              130%，同时收入持续同比增长超过 80%，投资论点可能向好地失效。 反向触发器包括企业客户加速流失至捆绑式可观测性功能，或公司所有权过渡后续约流失严重。
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
      - number: '8.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 27.5 倍高估值下避免投入新增资本
            body: 在 $40 million ARR、估值 $1.1 billion（27.5x 倍数）的基础上，OpenAI 的收购协议又重塑了未来治理和上行空间；此时再投入风险资本，无法提供有利的风险调整后回报。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV009
          - type: callout
            title: 平台商品化与竞争应对
            body: Statsig 拒绝 Datadog 的收购报价后，Datadog 以 $220 million 收购竞争对手 Eppo，将功能实验直接整合进主流可观测性平台，进一步加剧获客和客户留存压力。
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV010
