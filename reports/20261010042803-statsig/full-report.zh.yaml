      - number: '1.3'
        title: 资本化历史与所有权结构
        blocks:
          - type: paragraph
            body: >-
              在独立运营的风险投资阶段，Statsig 通过三轮机构融资累计募集约 $153.4M 股权资本。公司于 2021 年 8 月完成 $10.4M A 轮，并于 2022 年 4 月完成 $43M B 轮；两轮均由
              Sequoia Capital 领投，区域风投 Madrona Venture Group 持续跟投。2025 年 5 月，Statsig 完成由 ICONIQ Growth 领投的 $100M C 轮，投后估值
              $1.1B，其中 $80M 是公司新增成长资本， $20M 用于员工股东的老股流动性。仅四个月后，2025 年 9 月，OpenAI 宣布以价值 $1.1B 的全股票交易收购 Statsig， 成为 OpenAI
              历史上规模最大的公司收购之一。2026 年 5 月，Amplitude 进入最终战略合作协议，接管客户群、平台软件和运营收入流， 所有权结构再次发生变化。
            claimRefs:
