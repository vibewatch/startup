  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 残余风险排序
        blocks:
          - type: paragraph
            body: >-
              证据支持把尽调重点放在保证可见性和配置治理上，而不是声称已经发生数据泄露或中断。Statsig 称客户数据可能敏感，自称已通过 SOC 2 Type II 审计，
              并发布风险管理和事件响应控制。尽管如此，RiscLens 报告称无法确认公开 SOC 2 报告，并说明其画像仅基于公开可观察的自动化发现。
              最稳妥的处理方式是把这视为证据获取缺口：要求当前报告、适用范围、例外项、桥接函和收购后的控制归属，而不要把公开未找到材料解读为认证失败。 第二层风险涉及实时配置、分析有效性和可用性。Statsig
              自己披露的规模和正常运行时间数据未经审计，独立实施指南则警告， 功能开关成功发布本身并不能证明实验分析正确。因此，热力图表达的是定性尽调紧迫性，而非观察到的事故频率。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR012
              - CR014
              - CR016
