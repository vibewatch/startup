        - 采购延迟，或例外与排除条款不明
        - 获取当前报告、桥接函、例外日志、适用范围及整改状态
      - - 隐私与敏感数据处理
        - 欧盟、加州及其他客户所在司法辖区
        - 公司文件列出了 GDPR 和 CCPA 资源，但证据池缺少可执行条款
        - 中
        - 高
        - 安全控制已有描述；合同与传输细节未经核实
        - 部署特定的收集、存储地域、删除或传输义务
        - 审阅 DPA、保留与删除条款、数据地图、传输机制及 DSAR 流程
      - - 分处理商与关联方治理
        - 客户与分处理商运营所在的司法辖区
        - Statsig 指向一家 Amplitude 关联方及分处理商名单
        - 中
        - 中
        - 已有披露；指定证据未涵盖审计权与变更控制
        - 下游数据处理、通知及事件响应依赖
        - 按数据类别和地区梳理每个处理方；检查通知、异议、审计及违约条款
    notes: 定性可能性和严重程度是分析师基于指定公开来源作出的判断；证据池中没有监管机构 案卷、法院记录、DPA 或审计报告。
    enumerationScope:
