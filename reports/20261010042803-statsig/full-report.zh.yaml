      - number: '7.2'
        title: 运营、安全与依赖暴露
        blocks:
          - type: paragraph
            body: >-
              Statsig 描述了分层缓解措施：按需访问生产数据、记录员工访问、风险评估、事件响应计划、备份、多云基础设施和细粒度权限。 Releasebot 转发的近期公司发布说明还提到更窄的编辑/删除权限、项目级和角色级
              MCP 范围，以及更安全的单用户覆盖删除路径。 这些都是有意义的控制，但也暴露了管理层试图压制的故障模式：用户或代理权限过大、配置并发变更、发现延迟和恢复失败。 部署选择只能转移依赖，不能消除依赖。托管模式依赖
              Statsig 和云服务商；数据仓库原生模式则依赖客户数据仓库的可用性、权限、查询治理和计算预算。 Statsig 还称可能使用分包商和 Amplitude
              关联方。指定来源池的公开材料没有量化供应商集中度、恢复目标、分包商暴露或事件对客户的影响， 因此这些仍是尽调事项，而不是估算事实。
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
