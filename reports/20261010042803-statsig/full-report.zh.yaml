  - id: FE001
    title: Statsig 统一产品与技术架构栈
    type: stack
    summary: 六层功能栈展示 Statsig 从客户端 / 服务端 SDK 到底层分析与数据仓库基础设施的端到端架构。
    approximationNotes: 分层抽象依据公开技术规格，建模托管 SaaS 与仓库原生两种执行路径。
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE006
      - CE007
    data:
      layers:
        - label: 开发者与应用 SDK 层
          detail: 30 多个开源客户端、服务端和边缘 SDK，提供亚毫秒级本地评估
          modules:
            - 客户端 SDK（React、iOS、Android）
            - 服务端 SDK（Node、Python、Go、Java）
            - 边缘中间件与 CDN 适配器
        - label: 边缘与路由评估网关
          detail: 分布式 CDN 边缘评估节点，配有缓存规则载荷和动态配置
          modules:
            - 边缘配置缓存
            - 本地评估引擎
            - 动态参数存储
        - label: 流式遥测摄取
          detail: 高吞吐流式管道，每日处理超过 1 万亿个暴露与分析事件
          modules:
            - 事件摄取网关
            - 遥测去重
            - Databricks 流式湖仓
        - label: 统计计算与方差缩减
          detail: 专有统计引擎执行频率学派、序贯及 CUPED 方差缩减实验测试
          modules:
            - CUPED 引擎
            - 序贯测试
            - Autotune 多臂老虎机
            - 留出组诊断
        - label: 存储与仓库原生执行
          detail: 混合持久化，支持 Statsig 管理的云存储或客户数据仓库原地执行（Snowflake、Databricks、BigQuery）
          modules:
            - Statsig 云托管存储
            - 仓库原生连接器
            - 零 ETL SQL 查询编译器
        - label: 统一控制台与治理平面
          detail: 集中式 Web 控制台，管理定向规则、留出组、Autotune 及企业 RBAC 策略
          modules:
            - 功能门控控制台
            - 实验仪表板
            - 会话回放浏览器
            - 企业 RBAC 与审计日志
  - id: FU001
    title: 客户旅程与扩张生命周期图
    type: journey-map
    summary: 客户从最初由开发者主导的功能门控，逐步走向全组织的仓库原生实验与治理。
    approximationNotes: 工作流阶段反映客户案例和产品更新日志记录的标准采用模式；转化时间因客户规模而异。
    claimRefs:
      - CU003
      - CU004
      - CU013
      - CU014
    data:
      items:
        - label: 阶段 1：开发者功能门控
          touchpoints:
            - 开源 SDK 集成
            - 控制台功能门控设置
            - 开发者主导的实验
          detail: 工程团队使用免费或低价层功能门控，安全控制代码发布，并将部署与发布解耦。
        - label: 阶段 2：自助式产品分析
          touchpoints:
            - 事件流摄取
            - 指标浏览器配置
            - 会话回放检查
          detail: 产品经理和分析师将用户事件连接到功能门控，无需提交数据工程工单即可衡量基础发布影响。
        - label: 阶段 3：受控 A/B 测试
          touchpoints:
            - 假设设计
            - 自动样本量测算
            - CUPED 方差缩减
          detail: 团队启动多变量实验，利用自动化统计引擎确定对转化指标的因果影响。
        - label: 阶段 4：迁移至仓库原生
          touchpoints:
            - Snowflake / Databricks 连接
            - 零 ETL SQL 生成
            - 数据治理评审
          detail: 企业将实验直接连接到云数据仓库，以遵守数据驻留规则，并摆脱第三方数据锁定。
        - label: 阶段 5：企业治理与 MCP
          touchpoints:
            - 控制台 API 评审工作流
            - Model Context Protocol 工具
            - 审计日志跟踪
          detail: 组织正式建立多团队变更管理政策，并向 AI 编码代理授予受治理的功能门控访问权限。
        - label: 阶段 6：平台迁移与续约
          touchpoints:
            - Amplitude 合同对齐
            - OpenAI 工程团队迁移评审
            - 平台连续性评估
          detail: Amplitude 接管运营、OpenAI 收购人才后，客户重新评估路线图归属和定价结构。
  - id: FR001
    title: 定性剩余风险热力图
    type: matrix
    summary: 九个尽调主题按定性影响和可能性定位；由于无法获得事件频率和损失数据，位置仅表示方向性判断。
    data:
      columns:
        - 较低可能性
        - 中等可能性
        - 较高可能性
      rows:
        - label: 关键影响
          values:
            - value: Hosted availability failure
              detail: 已描述控制措施，但缺少经过测试的 RTO/RPO 和事件历史。
            - value: Privileged configuration error
              detail: 细粒度权限可以缓解，但无法消除线上变更风险。
            - value: Material assurance exception
              detail: 如果范围或例外条款削弱受监管采购，影响就属于关键级别。
        - label: 高影响
          values:
            - value: Subprocessor disruption
              detail: 存在已点名的依赖，但集中度和替代时点尚不清楚。
            - value: Experiment-analysis error
              detail: 正确完成上线，并不能证明推理结果正确。
            - value: Warehouse compute overrun
              detail: 成本标签有助于发现问题，但底层用量仍会波动。
        - label: 重大影响
          values:
            - value: Public assurance mismatch
              detail: 公开可见信息相互矛盾，可能拖慢采购，但不能证明控制失效。
            - value: Concurrent override mutation
              detail: 定向删除可以缩小变更范围。
            - value: Suite-governance sprawl
              detail: 集成范围越广，需要治理的权限和工作流就越多。
        - label: 中等影响
          values:
            - value: Internal-access exception
              detail: 按需且留有日志的访问，仍需定期复核授权。
            - value: Replication mismatch
              detail: 系统韧性取决于具体部署的复制要求。
            - value: MCP scope drift
              detail: 项目、角色和令牌的权限范围必须保持一致。
        - label: 有限影响
          values:
            - value: Subprocessor notice delay
              detail: 合同条款和提出异议的期限决定实际暴露程度。
            - value: Cost-tag coverage gap
              detail: 归因能提高可见性，但不能限制数据仓库支出。
            - value: Diagnostic review delay
              detail: 自动化信号仍需由明确负责的人复核。
        - label: 低影响
          values:
            - value: Documentation lag
              detail: 公开材料可能落后于当前的非公开保障证据。
            - value: Role-alias mapping error
              detail: 配置流程转换需要针对身份提供商的变更测试。
            - value: Pilot workflow friction
              detail: 代表性试点能在上线前暴露配置和对账缺口。
    approximationNotes: 可能性和影响是分析师的定性判断，不是经过测量的事故概率或损失估算。
    claimRefs:
      - CR003
      - CR005
      - CR009
      - CR010
      - CR011
      - CR012
      - CR015
      - CR016
