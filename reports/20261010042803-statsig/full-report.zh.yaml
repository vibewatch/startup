        - 不按公告估值参与新的一级股权融资
      - - 建议置信度
        - 高
        - 已交叉验证的 Series C 条款（$1.1B 估值、$100M 融资、$40M ARR）
        - 关于估值倍数和战略交易立场的公开证据充分
      - - 基本面风险评级
        - 高
        - 27.5 倍 ARR；Datadog / Eppo 整合；NRR 和利润率未经核实
        - 需要大幅扩大利润率并留住客户，才能支撑该价格
      - - 估值立场
        - 偏高
        - 27.5 倍 ARR，对比公开 SaaS 倍数中位数 8 倍至 12 倍
        - 估值已按完美执行定价，独立资本没有安全边际
    notes: 建议评估的是在 Statsig 已报告的 $1.1B Series C 估值下进行新增独立风险投资；已宣布的战略交易限制了退出路径和治理空间。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV007
      - CV009
  - id: TV002
    title: 核心投资论点与反论点平衡表
    columns:
      - 支柱
      - 类别
      - 核心分析论点
      - 论点失效 / 论点破坏触发条件
    rows:
      - - 统一平台采用
        - 正论
        - 将功能门控、A/B 测试和分析整合进一个控制台，消除多供应商割裂，让数据团队效率提升 50%。
        - 竞争对手把实验能力免费并入核心可观测性或分析套件，Statsig 因此难以继续扩张。
      - - 仓库原生架构
        - 正论
        - 在客户数据仓库中执行分析查询，降低托管计算负担，并打开受监管企业客户市场。
        - 数据仓库计算费用超出客户预期，促使客户迁回托管式点解决方案。
      - - 过高的进入倍数
        - 反论
        - 27.5 倍 ARR 倍数（$40M ARR 对应 $1.1B）相较正常化软件市场倍数，体现出极端的私募估值泡沫。
        - 收入持续实现超过 100% 的同比增长，且已证明毛利率超过 80%。
      - - 平台吸收与并购悬念
        - 反论
        - Datadog 收购 Eppo、OpenAI 收购 Statsig，既消除了独立流动性选项，也加剧了平台的直接竞争。
        - Statsig 保持独立商业运营，并将多云企业 ARR 做到超过 $100M。
    notes: 论点综合运营和财务证据；失效触发条件定义了可观察的运营里程碑，一旦出现，投资判断就会改变。
    claimRefs:
      - CV003
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
      - CV014
  - id: TV003
    title: 情景投资判断：乐观、基准与悲观情景矩阵
    columns:
      - 情景案例
      - 假设 ARR 与增长
      - 目标倍数与隐含价值
      - 关键运营假设
      - 下行 / 上行触发因素
      - 概率信号
    rows:
      - - 乐观情景
        - ARR 从 $40M 增长至 $120M（75%+ CAGR）
        - 18.0 倍 ARR（$2.16B 估值）
        - 仓库原生模式主导企业市场；AI 工具带来海量实验；多产品交叉销售成功
        - 融入 OpenAI 生态，加速企业 AI 功能在全球上线
        - 20%（低）
      - - 基准情景
        - ARR 从 $40M 增长至 $70M（35% CAGR）
        - 10.0 倍 ARR（$700M 估值）
        - Datadog / Eppo 与 PostHog 激烈竞争，增长放缓；未经核实的毛利率限制倍数扩张
        - 相对 $1.1B Series C 入场价格发生降价融资或倍数压缩
        - 55%（中等）
      - - 悲观情景
        - ARR 停滞在 $45M（<15% CAGR）
        - 5.0 倍 ARR（$225M 估值）
        - 独立实验能力被可观测性套件商品化；OpenAI 收购改变独立客户关系
        - 大型企业流失，开源替代品激进降价
        - 25%（显著）
    notes: 估值倍数参考软件市场可比公司；概率信号反映在已宣布收购交易背景下的风险加权预期价值分析。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV007
      - CV008
      - CV010
      - CV011
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 记录 2021 至 2026 年间关键的创立、融资、产品、收购及运营里程碑。
    approximationNotes: 所有里程碑日期均来自官方新闻稿、博客发布及经核实的交易报道。
    claimRefs:
      - CO002
      - CO003
      - CO004
      - CO005
      - CO007
      - CO008
      - CO013
    data:
      items:
        - label: Statsig 成立
          date: '2021-02-01'
          detail: Vijaye Raji 离开 Meta 后在西雅图地区注册成立 Statsig，打造企业级功能门控与实验平台。
          tone: positive
        - label: Series A 融资（$10.4M）
          date: '2021-08-01'
          detail: Sequoia Capital 领投 $10.4M Series A 轮，Madrona Venture Group 参与，资金用于加快初期产品工程建设。
          tone: positive
        - label: Series B 融资（$43M）
          date: '2022-04-01'
          detail: Sequoia Capital 领投 $43M Series B 轮，Statsig 同期推出仓库原生实验与分析工具。
          tone: positive
        - label: Series C 融资（$100M）
          date: '2025-05-01'
          detail: ICONIQ Growth 领投 $100M Series C 轮（$80M 新股、$20M 老股），估值 $1.1B；ARR 预计达到 $40M。
          tone: positive
        - label: OpenAI 收购（$1.1B）
          date: '2025-09-02'
          detail: OpenAI 宣布以 $1.1B 股票收购 Statsig；创始人 Vijaye Raji 出任 Applications CTO，团队仍留在西雅图。
          tone: neutral
        - label: Amplitude 战略合作
          date: '2026-05-05'
          detail: Amplitude 宣布接手 Statsig 的品牌、客户和 SaaS 平台；原工程团队留在 OpenAI。
          tone: warning
        - label: 市场对运营拆分的质疑
          date: '2026-05-08'
          detail: 行业分析师和竞争对手质疑产品代码与原团队分离，指出客户不确定性和支持风险。
          tone: adverse
        - label: Phase 1 平台路线图发布
          date: '2026-06-17'
          detail: Amplitude 宣布由 Chris Yu 牵头的 Phase 1 开发计划，重点是治理工具、AI 工作流和数据层集成。
