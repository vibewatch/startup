        title: 切换成本与战略并购风险
        blocks:
          - type: paragraph
            body: >-
              Statsig 客户的切换壁垒主要来自深度代码埋点、自定义指标配置和历史实验档案。替换 Statsig 要求工程团队从生产代码库中逐一拆除并替换 SDK 调用，在其他 BI
              或数据仓库工具中重新定义指标，并在迁移平台前导出实验结果。这些技术切换壁垒又叠加了公司所有权变更造成的 路线图高度不确定性。OpenAI 于 2025 年 9 月收购 Statsig 以强化原生 AI
              评估，Amplitude 则于 2026 年 5 月收购品牌和客户群， 核心工程团队仍留在 OpenAI。这种双重转移造成长期整合和支持上的模糊地带：Amplitude
              正分阶段将平台并入自身分析产品，却没有原始构建者参与。
