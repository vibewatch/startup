  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、分类与产品范围
        blocks:
          - type: paragraph
            body: >-
              Statsig 横跨现代软件交付的三类相邻领域：功能管理与渐进式发布、统计 A/B 实验，以及一体化产品分析。过去，软件组织通常为每项工作流分别采购 工具：用 LaunchDarkly 或 Split
              做功能闸门，用 Optimizely 或 VWO 做实验，用 Amplitude、Mixpanel 或 Heap 跟踪用户行为。 这种割裂带来明显摩擦，包括 SDK
              网络开销重复、用户曝光日志不一致，以及遥测系统与实验引擎之间的数据管道同步耗时。 Statsig 的核心架构主张是把这些层合并为一条工作流：每次功能开关发布都会自动成为带有埋点的实验，并由内置统计评估支持。
              此外，Statsig 首创 Warehouse Native 部署，让企业数据团队直接在 Snowflake、BigQuery 和 Databricks 等云数据仓库中计算实验指标， 无需把数据通过外部 ETL
              导出。这个边界覆盖核心的开发者优先实验和功能开关，明确排除传统可视化网页构建器、静态配置管理和通用企业 BI 套件。
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM008
              - CM011
      - number: '2.2'
        title: 不同运营模式下的 TAM、SAM 与测算视角
        blocks:
          - type: paragraph
            body: >-
              要量化 Statsig 的可触达机会，需要从多个运营视角拆分更广泛的软件遥测与实验市场。传统行业估算往往用狭窄的网页优化视角看待 A/B 测试。 根据 Convert Experiences 的 2026
              年市场分析，独立网页实验的 TAM 约为 $1.0B，年扩张速度放缓至约 10%，说明传统前端营销买方 正在成熟并趋于饱和。然而，Statsig
              服务工程驱动的产品开发，并接入现代数据仓库基础设施，因此面对的技术市场大得多。 Sacra 估算，更广泛的云数据仓库分析生态每年企业支出超过 $10B。在这一交集内，开发者优先的功能管理与统计实验 SAM 估计为
              $350M-$500M，年增速为 15%-20%。受客户成熟度和高速工程要求约束，Statsig 的 SOM 估计为 $50M-$75M； 收购前，其超过 300 个企业账户据报贡献了 $40M ARR。
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM012
      - number: '2.3'
        title: 企业买方画像、预算归属与采购模式
        blocks:
          - type: paragraph
            body: >-
              Statsig 的采用由初创、成长型公司和企业层级中不同的买方及用户画像构成。早期初创公司和成长团队通常由工程负责人自下而上推动， 目标是淘汰脆弱的内部配置数据库。Statsig 的 Free Developer
              版本每月最多支持 100 万个跟踪用户（MTU）且席位不限，构成低摩擦获客漏斗。 在中型市场和企业组织中，预算转向产品副总裁和数据负责人；他们会根据统计严谨性（例如 CUPED
              方差缩减）以及合并工具的总拥有成本来评估平台。 根据 Vendr 的采购交易基准，Statsig 的商业套餐主要按暴露于功能开关或测试的独立 MTU 数量，以及席位档位扩容。 起价 $150/月的 Pro
              合同中，中型市场团队通常会谈下 15%-25% 的年度合同折扣；超过 10M MTU 的企业部署，相对初始报价可获得 20%-35% 折扣。对于受监管的金融服务和医疗企业，CTO
              和首席数据官是关键把关人，要求数据仓库原生架构以满足严格的数据驻留、 SOC 2 和 GDPR 治理约束。
            claimRefs:
              - CM002
              - CM003
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM010
              - CM013
      - number: '2.4'
        title: 市场整合、增长驱动因素与并购后的尽调缺口
        blocks:
          - type: paragraph
            body: >-
              宏观经济下的预算理性化和 AI 辅助软件生成兴起，推动实验市场进入快速结构性整合期。生成式 AI 大幅降低代码生成成本后，
              软件工程瓶颈已从交付功能转向验证生产环境中什么真正有效。无法超越简单前端网页测试的独立工具，被更广泛的平台吸收： Datadog 于 2025 年 5 月以 $220M 收购 Eppo，Harness 收购
              Split，Everstone 则将 VWO 与 AB Tasty 合并，打造私募股权滚动平台。 Statsig 走出了前所未有的双重退出路径：2025 年 9 月，OpenAI 以 $1.1B 股票收购
              Statsig，以吸收其运行时控制平面和人才，并任命创始人 Vijaye Raji 为应用业务 CTO。随后，2026 年 5 月 5 日，Amplitude 宣布战略合作，接手 Statsig
              的品牌、运营连续性和客户关系。 这次交接虽然确保 SaaS 支持延续，却带来商业摩擦和尽调不确定性。净收入留存率、Amplitude 旗下的合同续约条款，以及数据仓库原生处理 与 Amplitude
              事件流基础设施的长期融合等关键运营指标，仍未向私募市场尽调公开。
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM014
      - number: '2.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 实验市场的两极分化：独立工具承压与生态扩张
            body: >-
              实验市场已分成两边：增速放缓的独立网页测试套件（约 10% 增长，天花板 $1B），以及整合功能闸门、遥测和数据仓库原生计算的高增长开发者优先平台。 Statsig 可直接运行在
              Snowflake、BigQuery 和 Databricks 等云数据仓库中，因此能够切入更大的 $10B+ 数据仓库分析生态，避开传统 SaaS 数据重复带来的利润率挤压。
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM011
          - type: callout
            title: OpenAI 过渡与 Amplitude 商业摩擦
            body: >-
              OpenAI 于 2025 年 9 月以 $1.1B 收购 Statsig，随后在 2026 年 5 月把客户关系转给 Amplitude，企业买方因此面临续约不确定性。 平台从独立产品转为与 Amplitude
              合作的商业结构，令合同折扣（企业规模历史上为 15%-35%）以及数据仓库原生工作流与 Amplitude 事件流基础设施的长期架构协同都出现疑问。
            calloutType: risk
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM014
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局与分类
        blocks:
          - type: paragraph
            body: >-
              Statsig 所处竞争格局分为三类主要架构：企业级功能管理供应商、数据仓库原生实验平台，以及一体化产品分析套件。 LaunchDarkly 等企业功能管理老牌厂商重点服务 DevOps
              发布工作流、细粒度访问治理和广泛的多语言 SDK 生态；但它们过去通常把深层因果实验 和发布后产品分析当作次要模块或附加包。相比之下，GrowthBook 和 Eppo
              等数据仓库原生替代方案直接运行在企业数据仓库上，包括 Snowflake、BigQuery 和 Databricks，避免重复事件管道，同时把数据严格留在客户控制的基础设施内。PulseCRO
              等专门营销工具面向非技术增长团队， 提供可视化无代码页面编辑器，与 Statsig 以开发者为中心的 SDK 架构形成对比。
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP008
              - CP014
