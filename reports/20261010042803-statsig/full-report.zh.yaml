      - number: '1.2'
        title: 创始领导层与治理分拆
        blocks:
          - type: paragraph
            body: >-
              Statsig 由资深科技高管 Vijaye Raji 创办。此前他在 Microsoft 积累了近十年的软件工程领导经验，后来担任 Facebook 西雅图负责人及娱乐业务副总裁。Raji 推动 Statsig
              快速迭代产品并建立开发者响应文化，兼任创始人、CEO 和前端负责人。 OpenAI 于 2025 年 9 月收购 Statsig 后，Raji 出任 OpenAI 应用业务 CTO。2026 年 5
              月，OpenAI 执行了一次少见的结构性剥离， 将 Statsig 的商业品牌、客户关系和运营平台代码转给分析服务商 Amplitude，而 Raji 和原 Statsig 核心工程团队仍留在 OpenAI。
              为维持平台连续性，Amplitude 任命产品管理副总裁 Chris Yu，负责约 50 人的专门团队。不过，这种两头分立的安排已受到行业观察人士
              和竞争对手批评：他们认为，把运营软件代码库与最初的创始人才拆开，会让客户面临明显的关键人依赖和技术支持风险。
            claimRefs:
