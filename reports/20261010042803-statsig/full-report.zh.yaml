  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、反论点与融资背景
        blocks:
          - type: paragraph
            body: >-
              Statsig 的高确信度产品论点聚焦开发者速度：它把功能管理、A/B 测试和分析合并为一个平台，已为工程组织带来运营效率提升。
              公司的架构创新，尤其是数据仓库原生部署模式，通过把分析计算转移到客户管理的数据仓库，保护核心利润率。 但反论点来自极高的估值和竞争性吸收。Statsig 通过三轮融资累计募集 $153M，其中包括 2022 年以
              $420M 估值完成的 $43M B 轮， 以及 2025 年 5 月由 Iconiq Growth 领投、Sequoia Capital 和 Madrona Venture Group 跟投的 $100M C
              轮。 C 轮以 $40M ARR 对应 $1.1B 投后估值，即 27.5 倍的昂贵倍数。叠加点式解决方案整合和开源工具带来的竞争压力， 新增独立资本的风险回报并不划算，因此应以高确信度回避。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV010
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
