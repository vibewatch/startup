chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与产品模式
        blocks:
          - type: paragraph
            body: >-
              Statsig 于 2021 年在西雅图都会区成立，目标是打造现代化的一体化产品开发平台，把企业级功能开关、统计 A/B
              测试和产品分析整合在一起。它没有让软件工程团队和产品数据团队分别拼接发布闸门与分析工具，而是提供一套统一架构，同时支持多租户云端 SaaS，以及直接运行在 Snowflake、BigQuery 和
              Databricks 上的数据仓库原生部署。平台面向企业规模运行高吞吐基础设施， 每天处理超过 1 万亿个事件，每月约评估 2.5B 个独立实验对象，服务超过 300 个付费商业账户。行业估算显示， 收购前公司在
              2025 年 5 月的 ARR 收入运行率约为 $40M；其按事件计量的消费模式会随客户产品发布量增长而扩张。
            claimRefs:
