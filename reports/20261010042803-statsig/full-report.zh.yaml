      - number: '3.3'
        title: 定价结构与总拥有成本
        blocks:
          - type: paragraph
            body: >-
              总拥有成本会随商业计费所依据的指标单位大幅变化。Statsig 以慷慨的免费层吸引早期采用：每月免费提供 2M 个事件且席位不限， 自助服务层随后按用量计费，约为每百万个事件
              $400。不过，对于只把平台用于运营性功能开关、而非高事件量行为分析的团队， 这种按事件定价可能带来惩罚。Rollgate 等专业挑战者利用这一摩擦，按固定 SDK
              请求而非分析事件收费，并在标准套餐中默认提供欧盟数据托管。 相比之下，Statsig 只在定制企业协议中提供专门的欧盟数据驻留，迫使使用标准 Pro 套餐的欧洲团队通过标准合同条款处理跨境数据传输合规。
