            body: >-
              Statsig 的底层技术架构围绕解耦的边缘评估、高吞吐流式摄取和灵活的存储执行构建。 客户端和服务器 SDK 在启动时下载定向配置，在本地执行功能闸门检查和动态配置评估，无需网络开销即可达到亚毫秒评估延迟。
              曝光检查和下游用户互动产生的遥测数据经摄取管道流入，系统每天可处理超过 1 万亿个事件，系统可用性为 99.99%。 与 Databricks 等基础设施供应商的战略合作，过去使 Statsig
