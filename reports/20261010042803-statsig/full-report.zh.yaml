      - number: '7.3'
        title: 缓解措施、监测指标与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              投资判断应建立在控制确实运行的证据上，而不只是存在控制描述。承诺投资前，应取得当前独立保证、渗透测试和灾难恢复摘要、
              事件及重大中断历史、恢复时间和恢复点目标，以及按部署模式绘制的数据流图。针对实时产品风险，应要求高影响闸门的审批工作流、 最小权限 MCP
              和控制台角色、经核对的分配及曝光日志、样本比例失配监测、预先约定的停止规则，以及经过测试的回滚路径。 针对数据仓库原生经济性，应按实验和重新加载监测查询支出，因为 2026
              年发布说明明确增加了成本归因标签来暴露这项支出。 论点失效触发器应包括未修复的重大保证例外、拒绝提供事件记录、反复绕过控制、未核对且改变决策的实验数据、
              未达到合同恢复目标，或部署成本抹平整合节省。仅凭本章来源池无法量化收入烧钱、客户集中度和合同责任；应保持开放，不要编造阈值。
            claimRefs:
              - CR003
              - CR004
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.4'
        title: 展示材料
        blocks:
          - type: callout
            title: 不要推断未发生事件
            body: 指定来源描述了控制和公开信号，但没有提供完整的事件、中断、诉讼或执法历史；来源池中没有记录，不等于这些事情从未发生。
            calloutType: risk
            claimRefs:
              - CR004
              - CR016
