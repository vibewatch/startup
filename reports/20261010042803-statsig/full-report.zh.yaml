        title: 公司里程碑与整合展望
        blocks:
          - type: paragraph
            body: >-
              Statsig 从早期实验初创公司成长为核心基础设施资产，经历了三个运营阶段：独立风险投资扩张、并入 OpenAI 的应用开发栈， 以及随后由 Amplitude 商业吸收。OpenAI 最初的整合重点是把
              Statsig 的运行时评估工具用于内部 AI 应用；2026 年 5 月的交易则要求 Amplitude 对外运营企业 SaaS 平台。2026 年 6 月，Amplitude
              列出第一阶段技术重点，包括企业控制与治理工具、原生 Model Context Protocol 集成，以及把 Statsig 的统计引擎接入 Amplitude
              的行为分析管道。然而，交易后的毛利率、净收入留存率，以及企业客户在 Amplitude 统一治理下即将续约时面对的合同定价条款，仍存在关键尽调缺口。
