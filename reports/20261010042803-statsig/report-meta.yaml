  topStrengths:
    - >-
      Clear product depth across experimentation, feature management, product analytics, and warehouse-native
      deployment.
    - Evidence of meaningful customer traction, including more than 300 paying customers and high reported event volume.
    - Usage-based monetization aligns pricing with adoption and preserves an enterprise upsell path.
  topRisks:
    - OpenAI and Amplitude now split the operating model, creating roadmap, support, and renewal uncertainty.
    - Gross margin, NRR, CAC payback, cash, and runway remain private and unverified.
    - The implied valuation still looks stretched relative to a $40M ARR base.
    - Standalone differentiation faces pressure as competitors bundle experimentation into broader platforms.
  unresolvedGaps:
    - Final post-close ownership, support, and roadmap responsibilities across OpenAI and Amplitude.
    - NRR, gross margin, CAC/payback, top-customer concentration, and contract-duration data.
    - A representative warehouse-native cost model plus regulated-customer proof under the current operating structure.
