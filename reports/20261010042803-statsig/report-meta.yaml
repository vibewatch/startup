companyProfile:
  summary: >-
    Statsig is a developer-oriented experimentation, feature-management, and product-analytics platform that serves
    engineering-led teams and supports both hosted and warehouse-native deployment. The company was founded by Vijaye
    Raji in 2021, reached roughly $40M ARR and more than 300 paying customers by May 2025, and then entered a 2025-2026
    ownership transition in which OpenAI acquired the original company while Amplitude took over the brand, customer
    base, and platform operations.
  foundedDate: '2021-02-01'
  founders:
