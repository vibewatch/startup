  topStrengths:
    - 覆盖实验、功能管理、产品分析和仓库原生部署，产品纵深清晰。
    - 客户增长势头已有实质证据：付费客户超过 300 家，报告的事件量也很高。
    - 按用量收费让价格与采用程度挂钩，也保留了向企业客户增购的路径。
  topRisks:
    - OpenAI 与 Amplitude 现在拆分运营模式，路线图、支持和续约都存在不确定性。
    - 毛利率、NRR、CAC 回收期、现金和资金续航仍属非公开信息，且未经验证。
    - 相对于 $40M ARR 基础，隐含估值仍显得偏高。
    - 竞争对手把实验能力打包进更广的平台，Statsig 的独立差异化承压。
  unresolvedGaps:
    - 交割后 OpenAI 与 Amplitude 之间最终的所有权、支持和路线图职责。
    - NRR、毛利率、CAC / 回收期、头部客户集中度和合同期限数据。
    - 一套有代表性的仓库原生成本模型，以及当前运营结构下受监管客户的证明。
