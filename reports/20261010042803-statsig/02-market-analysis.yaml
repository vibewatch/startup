callouts:
  - calloutType: "insight"
    title: "Bifurcation of the Experimentation Market: Standalone Squeeze vs. Ecosystem Expansion"
    body: "The experimentation category has split between slowing standalone web-testing suites (growing at ~10% with a $1B ceiling) and high-growth developer-first platforms that integrate feature gates, telemetry, and warehouse-native compute. Statsig's ability to operate directly inside cloud warehouses (Snowflake, BigQuery, Databricks) positions it to tap into the larger $10B+ warehouse analytics ecosystem, avoiding the margin squeeze of traditional SaaS data duplication."
    claimRefs:
      - "CM004"
      - "CM005"
      - "CM011"
  - calloutType: "risk"
    title: "Post-OpenAI Transition and Amplitude Commercial Friction"
    body: "Following OpenAI's $1.1B acquisition of Statsig in September 2025 and subsequent transfer of customer relationships to Amplitude in May 2026, enterprise buyers face renewal uncertainty. The transition from an independent platform to an Amplitude-partnered commercial structure creates questions around contractual discounting (historically 15–35% for enterprise scale) and long-term architectural alignment between warehouse-native workflows and Amplitude's event stream infrastructure."
    claimRefs:
      - "CM002"
      - "CM003"
      - "CM007"
      - "CM014"
