figures:
  - id: "FR001"
    title: "Qualitative residual-risk heatmap"
    type: "matrix"
    summary: "Nine diligence themes are positioned by qualitative impact and likelihood; placement is directional because incident frequencies and loss data are unavailable."
    data:
      columns:
        - "Lower likelihood"
        - "Medium likelihood"
        - "Higher likelihood"
      rows:
        - label: "Critical impact"
          values:
            - value: "Hosted availability failure"
              detail: "Controls are described, but tested RTO/RPO and incident history are absent."
            - value: "Privileged configuration error"
              detail: "Granular permissions mitigate but do not remove live-change risk."
            - value: "Material assurance exception"
              detail: "Impact is critical if scope or exceptions undermine regulated procurement."
        - label: "High impact"
          values:
            - value: "Subprocessor disruption"
              detail: "Named dependency exists; concentration and substitution timing are unknown."
            - value: "Experiment-analysis error"
              detail: "Correct rollout does not establish correct inference."
            - value: "Warehouse compute overrun"
              detail: "Cost tags improve detection, while underlying usage remains variable."
        - label: "Material impact"
          values:
            - value: "Public assurance mismatch"
              detail: "Conflicting public visibility can slow procurement without proving control failure."
            - value: "Concurrent override mutation"
              detail: "Targeted deletion narrows the change surface."
            - value: "Suite-governance sprawl"
              detail: "Integrated breadth increases the number of permissions and workflows to govern."
        - label: "Moderate impact"
          values:
            - value: "Internal-access exception"
              detail: "Need-based, logged access still requires periodic entitlement review."
            - value: "Replication mismatch"
              detail: "Resiliency depends on deployment-specific replication requirements."
            - value: "MCP scope drift"
              detail: "Project, role, and token scopes must remain aligned."
        - label: "Limited impact"
          values:
            - value: "Subprocessor notice delay"
              detail: "Contract terms and objection windows determine practical exposure."
            - value: "Cost-tag coverage gap"
              detail: "Attribution improves visibility but does not cap warehouse spend."
            - value: "Diagnostic review delay"
              detail: "Automated signals still require accountable human review."
        - label: "Low impact"
          values:
            - value: "Documentation lag"
              detail: "Public materials may trail current private assurance evidence."
            - value: "Role-alias mapping error"
              detail: "Provisioning translations require testing against identity-provider changes."
            - value: "Pilot workflow friction"
              detail: "A representative pilot can expose setup and reconciliation gaps before rollout."
    approximationNotes: "Likelihood and impact are qualitative analyst judgments, not measured incident probabilities or loss estimates."
    claimRefs:
      - "CR003"
      - "CR005"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR015"
      - "CR016"
