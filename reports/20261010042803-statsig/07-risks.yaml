chapter:
  number: 7
  title: "Risks"
  summary: "Statsig publishes substantial security and governance controls, but the retained evidence leaves material assurance, incident-history, dependency, and unit-economics questions open. The most decision-relevant residual risks are the mismatch between public and company SOC 2 signals, configuration and experiment-governance failure, and concentration in cloud, subprocessor, and customer-warehouse dependencies."
sections:
  - id: "ranked-risk-view"
    title: "Ranked residual-risk view"
    body: >-
      The evidence supports a high-priority diligence focus on assurance visibility and
      configuration governance, not a claim that a breach or outage has occurred. Statsig says
      customer data can be sensitive, describes itself as SOC 2 Type II audited, and publishes
      risk-management and incident-response controls. RiscLens nevertheless reports that it could
      not confirm a public SOC 2 report and says its profile is based only on publicly observable,
      automated discovery. That conflict is best treated as an evidence-access gap: request the
      current report, scope, exceptions, bridge letter, and post-acquisition control ownership
      rather than interpreting public non-discovery as failed certification. The second risk tier
      covers live configuration, analytical validity, and availability. Statsig's own scale and
      uptime figures are unaudited company claims, while independent implementation guidance warns
      that a successful flag rollout alone does not prove that experiment analysis is correct.
      The heatmap is therefore qualitative and ranks diligence urgency, not observed incident
      frequency.
    claimRefs:
      - "CR001"
      - "CR002"
      - "CR003"
      - "CR004"
      - "CR012"
      - "CR014"
      - "CR016"
    tableRefs:
      - "TR001"
    figureRefs:
      - "FR001"
  - id: "operational-and-dependency-exposure"
    title: "Operational, security, and dependency exposure"
    body: >-
      Statsig describes layered mitigations: need-based production-data access, logged employee
      access, risk assessments, an incident-response plan, backups, multi-cloud infrastructure,
      and granular permissions. Recent company-issued release notes syndicated by Releasebot also
      describe narrower edit/delete permissions, project- and role-level MCP scopes, and a safer
      single-user override deletion path. These are meaningful controls, but they also identify the
      failure modes management is trying to contain: over-permissioned users or agents, concurrent
      configuration mutation, delayed detection, and recovery failure. Deployment choices shift
      rather than eliminate dependency. Hosted use depends on Statsig and cloud providers; the
      warehouse-native option depends on the customer's warehouse availability, permissions,
      query governance, and compute budget. Statsig further says it may use subprocessors and
      Amplitude affiliates. Public materials in the assigned pool do not quantify provider
      concentration, recovery objectives, subprocessor exposure, or the customer impact of an
      incident, so those fields remain diligence items rather than estimated facts.
    claimRefs:
      - "CR004"
      - "CR005"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR015"
    tableRefs:
      - "TR002"
      - "TR003"
  - id: "mitigations-monitors-and-kill-criteria"
    title: "Mitigations, monitoring indicators, and thesis-break triggers"
    body: >-
      The investment case should be conditioned on evidence that controls operate, not merely that
      control descriptions exist. Before commitment, obtain current independent assurance,
      penetration-test and disaster-recovery summaries, the incident and material-outage history,
      recovery-time and recovery-point objectives, and a deployment-specific data-flow map. For
      live product risk, require approval workflows for high-impact gates, least-privilege MCP and
      console roles, reconciled assignment and exposure logs, sample-ratio-mismatch monitoring,
      pre-agreed stopping rules, and a tested rollback path. For warehouse-native economics,
      monitor query spend by experiment and reload because the 2026 release notes explicitly added
      cost-attribution tags to expose that spend. Thesis-break triggers should include an
      unremediated material assurance exception, failure to provide an incident record, repeated
      control bypass, unreconciled experiment data that changes decisions, missed contractual
      recovery objectives, or deployment costs that erase consolidation savings. Revenue burn,
      customer concentration, and contractual liability cannot be quantified from this chapter's
      pool and should remain open rather than receiving invented thresholds.
    claimRefs:
      - "CR003"
      - "CR004"
      - "CR009"
      - "CR010"
      - "CR011"
      - "CR012"
      - "CR013"
      - "CR016"
