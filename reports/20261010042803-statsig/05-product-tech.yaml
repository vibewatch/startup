    data:
      layers:
        - label: Developer & Application SDK Layer
          detail: 30+ open-source client-side, server-side, and edge SDKs delivering sub-millisecond local evaluations
          modules:
            - Client SDKs (React, iOS, Android)
            - Server SDKs (Node, Python, Go, Java)
            - Edge Middleware & CDN Adapters
        - label: Edge & Routing Evaluation Gateway
          detail: Distributed CDN edge evaluation nodes with cached rule payloads and dynamic configurations
          modules:
            - Edge Config Caching
            - Local Evaluation Engine
            - Dynamic Parameter Stores
        - label: Streaming Telemetry Ingestion
          detail: High-throughput streaming pipelines processing over 1 trillion daily exposure and analytics events
          modules:
            - Event Ingestion Gateways
            - Telemetry De-duplication
            - Databricks Streaming Lakehouse
        - label: Statistical Computation & Variance Reduction
          detail: Proprietary stats engine executing frequentist, sequential, and CUPED variance-reduced experimentation tests
          modules:
            - CUPED Engine
            - Sequential Testing
            - Autotune Bandits
            - Holdout Diagnostics
        - label: Storage & Warehouse Native Execution
          detail: >-
            Hybrid persistence supporting Statsig-managed cloud stores or in-situ customer warehouse execution
            (Snowflake, Databricks, BigQuery)
          modules:
            - Statsig Cloud Managed Store
            - Warehouse Native Connector
            - Zero-ETL SQL Query Compiler
        - label: Unified Console & Governance Plane
          detail: Centralized web console managing targeting rules, holdouts, autotune, and enterprise RBAC policies
          modules:
            - Feature Gate Console
            - Experimentation Dashboard
            - Session Replay Explorer
            - Enterprise RBAC & Audit Logs
