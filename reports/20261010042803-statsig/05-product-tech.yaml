        - Proprietary stats engine opacity vs open-source verification
      - - Product Analytics & Metrics Explorer
        - Data Teams & Growth Engineers
        - Production / Mature
        - Integrated event exploration directly linked to experiment exposures
        - Event-based ingestion volume cost scaling at high throughput
      - - Warehouse Native (WHN)
        - Enterprise Data & Infrastructure Engineers
        - Production / Expanding
        - Direct in-warehouse execution in Snowflake, BigQuery, Databricks with zero ETL
        - Warehouse query compute shadow costs and query latency
      - - Session Replay & Dev Tools
        - Frontend Engineers & UX Designers
        - Production / Newer addition
        - Session recordings attached directly to feature flag evaluations and errors
        - Bandwidth consumption and qualitative user feedback depth
    notes: >-
      Module inventory synthesized from Statsig official product documentation and independent platform coverage;
