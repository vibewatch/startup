  - id: TE002
    title: Core Workflow and Use-Case Analysis
    columns:
      - User Job
      - Current Workflow
      - Company Solution
      - Measurable Benefit
      - Limitation
    rows:
      - - Safe Feature Rollouts
        - Manual config updates or separate flag tools without metrics
        - Statsig Feature Gates with automated metric guardrails and instant kill switches
        - Sub-millisecond flag evaluations and automatic regression alerts
        - Requires engineer-led code instrumentation
      - - Experiment Analysis & Decisioning
        - Fragmented A/B tooling requiring manual ETL into analytics pipelines
        - Unified stats engine with CUPED variance reduction and automated diagnostics
        - Reported 50% reduction in time spent by data scientists (Brex)
        - Statistical calculations are proprietary and closed-source
      - - Regulated Enterprise Experimentation
        - Exporting PII and event data to third-party multi-tenant SaaS clouds
        - Warehouse Native architecture running compute inside customer Snowflake/Databricks
        - Event underreporting reduced from 10% to 1-2% (Secret Sales)
        - Pushes computational query overhead onto customer warehouse bill
      - - Observing AI Feature Behavior
        - Disjointed monitoring of non-deterministic LLM output variations
        - Model Context Protocol server and integrated session replays with feature flags
        - Faster iteration on AI prompt and feature variants
        - Lacks integrated active qualitative user-in-the-loop surveys
    notes: >-
      Workflows and metrics derived from published customer deployments and competitor architecture analyses;
      customer-specific ROI varies with traffic scale.
    claimRefs:
      - CE001
      - CE003
      - CE008
      - CE009
      - CE012
      - CE014
