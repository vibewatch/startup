      The May 2026 transaction transferring Statsig's brand and customer base to Amplitude while original engineering
      remained at OpenAI creates technical governance and roadmap risk, exposing enterprise deployments to potential
      support dilution and core engine divergence.
    claimRefs:
      - CE010
      - CE011
