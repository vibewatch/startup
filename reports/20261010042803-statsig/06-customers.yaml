chapter:
  number: 6
  title: "Customers"
  summary: "Statsig serves over 300 paying enterprise and growth-stage customers—dominated by product and data leaders scaling experimentation velocity—while Bloomberry DNS telemetry detects 490 active organizations. However, the announced May 2026 transaction splitting platform ownership to Amplitude while OpenAI retains original engineering leadership introduces significant operational uncertainty and renewal scrutiny across its customer base."
sections:
  - id: "customer-base-segmentation"
    title: "Customer Base Segmentation and Buyer Persona"
    body: "Statsig's commercial penetration is concentrated within engineering-driven, product-led technology organizations where rapid experimentation directly impacts top-line business metrics. Third-party firmographic analysis of job listings and LinkedIn telemetry reveals that purchasing decisions are predominantly driven by Senior Product Managers (accounting for 18% of mentions) and Directors of Data Analytics (8%), with operational usage distributed across Senior Data Scientists (15%), Senior Product Analysts (12%), and Growth Engineers (10%). The customer roster exhibits a heavy structural skew toward mature venture-backed and public enterprises: companies utilizing Statsig are 1,216 times more likely to be at Series F and 768 times more likely to be at Series D or E funding than the baseline software population. By industry vertical, software development represents 36% of active accounts, followed by technology platforms at 12% and financial services at 12%, with mid-market firms (51 to 200 employees, 24%) and large enterprises (1,001 to 5,000 employees, 21%) forming the backbone of the deployed base."
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-trajectory-and-scale"
    title: "Adoption Trajectory, Enterprise Scale, and Usage Growth"
    body: "Operational adoption has scaled from early developer-led feature flagging into high-throughput enterprise infrastructure. Independent research estimates that Statsig surpassed 300 paying customers and reached an estimated $40 million in ARR prior to its announced acquisition, supported by carrier-grade platform reliability. Production telemetry reflects immense daily workload throughput: Statsig's distributed services ingest and evaluate over 1 trillion events per day and touch 2.5 billion unique monthly experiment subjects across web, server, and mobile client endpoints. Technical adoption demonstrates high stickiness within complex multi-product environments, where organizations deploy Statsig alongside developer experience tools like DX and enterprise search platforms like Glean. Enterprise expansion is particularly pronounced among organizations adopting Statsig's Warehouse-Native architecture, which executes SQL-based statistical calculations directly inside customer Snowflake, BigQuery, and Databricks clusters without requiring third-party data extraction pipelines."
    claimRefs:
      - "CU002"
      - "CU005"
      - "CU006"
      - "CU008"
      - "CU013"
    tableRefs:
      - "TU002"
  - id: "retention-partner-split-and-concentration-risks"
    title: "Customer Durability, M&A Transition Friction, and Retention Scrutiny"
    body: "While verified production case studies at Brex, Notion, Bluesky, and Secret Sales prove substantial operational benefits—including Brex's reported 50% data scientist time reduction and 20% analytics tooling cost savings—customer durability faces unprecedented structural friction. The May 2026 transaction structure fundamentally bifurcated Statsig's organization: Amplitude assumed commercial ownership of the Statsig brand, platform maintenance, and customer relationships, whereas OpenAI retained the founding engineering team, technical leadership, and statistical researchers. This split has sparked acute concern among enterprise buyers who chose Statsig specifically for its blistering engineering pace and developer intimacy. Competitors like Optimizely have publicly targeted this operational vulnerability, terming the orphaned platform a 'race car without a driver' and predicting support degradation and eventual product consolidation. Third-party telemetry indicates that 38 companies have already churned and 48 enterprise contracts face upcoming renewal within 90 days, creating an immediate test of customer retention."
    claimRefs:
      - "CU007"
      - "CU009"
      - "CU010"
      - "CU011"
      - "CU012"
      - "CU014"
      - "CU015"
    tableRefs:
      - "TU003"
