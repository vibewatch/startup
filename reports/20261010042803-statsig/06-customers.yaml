figures:
  - id: "FU001"
    title: "Customer journey and expansion lifecycle map"
    type: "journey-map"
    summary: "Customer progression from initial developer-led feature flagging to organization-wide warehouse-native experimentation and governance."
    approximationNotes: "Workflow stages reflect standard adoption patterns documented in customer case studies and product update logs; conversion timing varies by customer size."
    claimRefs:
      - "CU003"
      - "CU004"
      - "CU013"
      - "CU014"
    data:
      items:
        - label: "Stage 1: Developer Feature Flagging"
          touchpoints:
            - "Open-source SDK integration"
            - "Console feature gate setup"
            - "Developer-led experimentation"
          detail: "Engineering teams implement free or low-tier feature flags to safely gate code releases and decouple deployment from release."
        - label: "Stage 2: Self-Service Product Analytics"
          touchpoints:
            - "Event stream ingestion"
            - "Metrics explorer configuration"
            - "Session replay inspection"
          detail: "Product managers and analysts connect user events to feature gates to measure basic release impact without data engineering tickets."
        - label: "Stage 3: Controlled A/B Testing"
          touchpoints:
            - "Hypothesis design"
            - "Automated sample sizing"
            - "CUPED variance reduction"
          detail: "Teams launch multivariate experiments and utilize automated statistical engines to establish causal impact on conversion metrics."
        - label: "Stage 4: Warehouse-Native Migration"
          touchpoints:
            - "Snowflake/Databricks connection"
            - "Zero-ETL SQL generation"
            - "Data governance review"
          detail: "Enterprises connect experiments directly to their cloud data warehouse to comply with data residency rules and eliminate third-party data lock-in."
        - label: "Stage 5: Enterprise Governance & MCP"
          touchpoints:
            - "Console API review workflows"
            - "Model Context Protocol tools"
            - "Audit log tracking"
          detail: "Organizations formalize multi-team change management policies and grant AI coding agents governed access to feature flags."
        - label: "Stage 6: Platform Transition & Renewal"
          touchpoints:
            - "Amplitude contract alignment"
            - "OpenAI engineering transition review"
            - "Platform continuity evaluation"
          detail: "Customers review roadmap ownership and pricing structures following Amplitude's operational takeover and OpenAI's talent acquisition."
callouts:
  - calloutType: "risk"
    title: "Customer Friction and Roadmap Uncertainty from the Amplitude-OpenAI Split"
    body: "The split of Statsig's operating business—where Amplitude assumes the brand, customer relationships, and platform maintenance while OpenAI retains the original engineering founders and technical team—creates severe strategic uncertainty for enterprise accounts. With competitor Optimizely publicly characterizing the platform as a 'race car without a driver' and third-party monitoring detecting 38 churned accounts and 48 upcoming renewals, enterprise procurement teams face elevated platform-continuity risks."
    claimRefs:
      - "CU007"
      - "CU014"
      - "CU015"
  - calloutType: "insight"
    title: "Product-Led Growth Backed by Mature Enterprise Infrastructure"
    body: "Unlike legacy point-solution testing tools, Statsig's customer expansion relies on bottom-up developer adoption paired with warehouse-native deployment. By eliminating data extraction pipelines and running statistical computation directly within Snowflake, BigQuery, or Databricks, Statsig attracts highly sophisticated, engineering-driven scale-ups that prioritize internal development velocity over traditional sales-led enterprise procurement."
    claimRefs:
      - "CU001"
      - "CU003"
      - "CU011"
