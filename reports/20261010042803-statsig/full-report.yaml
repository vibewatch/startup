            body: >-
              The split of Statsig's operating business—where Amplitude assumes the brand, customer relationships, and
              platform maintenance while OpenAI retains the original engineering founders and technical team—creates
              severe strategic uncertainty for enterprise accounts. With competitor Optimizely publicly characterizing
