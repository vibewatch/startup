  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked residual-risk view
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a high-priority diligence focus on assurance visibility and configuration
              governance, not a claim that a breach or outage has occurred. Statsig says customer data can be sensitive,
              describes itself as SOC 2 Type II audited, and publishes risk-management and incident-response controls.
              RiscLens nevertheless reports that it could not confirm a public SOC 2 report and says its profile is
              based only on publicly observable, automated discovery. That conflict is best treated as an
              evidence-access gap: request the current report, scope, exceptions, bridge letter, and post-acquisition
              control ownership rather than interpreting public non-discovery as failed certification. The second risk
              tier covers live configuration, analytical validity, and availability. Statsig's own scale and uptime
              figures are unaudited company claims, while independent implementation guidance warns that a successful
              flag rollout alone does not prove that experiment analysis is correct. The heatmap is therefore
              qualitative and ranks diligence urgency, not observed incident frequency.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR012
