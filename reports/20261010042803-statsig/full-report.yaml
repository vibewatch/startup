  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis, Anti-Thesis, and Financing Context
        blocks:
          - type: paragraph
            body: >-
              Statsig presents a high-conviction product thesis centered on developer velocity, pairing feature
              management, A/B testing, and analytics into a single platform that delivers demonstrated operational
              efficiency gains for engineering organizations. The company's architectural innovation—specifically its
              warehouse-native deployment model—shields core margins by offloading analytical compute to
              customer-managed data warehouses. However, the investment anti-thesis is driven by extreme valuation
              pricing and competitive absorption. Statsig raised $153 million in cumulative venture capital across three
              financing rounds, including a $43 million Series B at a $420 million valuation in 2022 and a $100 million
              Series C in May 2025 led by Iconiq Growth alongside Sequoia Capital and Madrona Venture Group. The Series
              C set a $1.1 billion post-money valuation against $40 million in ARR, representing an expensive 27.5x
              multiple. Coupled with emerging competitive pressure from point-solution consolidation and open-source
              tooling, new standalone capital faces an unfavorable risk-reward profile, justifying an avoid stance with
              high conviction.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV006
              - CV010
              - CV012
              - CV014
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV007
              - CV008
              - CV010
              - CV011
              - CV012
              - CV014
      - number: '8.2'
        title: Valuation Multiples, M&A Precedents, and Scenario Underwriting
        blocks:
          - type: paragraph
            body: >-
              Evaluating Statsig's $1.1 billion valuation against software industry benchmarks highlights significant
              valuation stretch. At $40 million in ARR, Statsig's 27.5x revenue multiple sits at more than double the
              prevailing median for high-growth private enterprise software vendors. M&A dynamics illustrate
              accelerating market consolidation: Statsig reportedly rejected an acquisition takeover bid from Datadog,
              after which Datadog acquired experimentation competitor Eppo for roughly $220 million to embed testing
              into its observability stack. Subsequently, OpenAI announced an agreement to acquire Statsig for $1.1
              billion in stock, fundamentally altering the liquidity landscape. Under scenario underwriting, our base
              case yields a $700 million fair value at a normalized 10x ARR multiple assuming revenue expands to $70
              million, indicating a 36% valuation haircut from Series C pricing. The bear case models contraction to
              $225 million if platform absorption accelerates, while the bull case requires expansion to $120 million
              ARR at an 18x multiple to achieve a $2.16 billion outcome.
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV009
              - CV011
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV007
              - CV008
              - CV010
              - CV011
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
              - CV009
              - CV013
      - number: '8.3'
        title: Exit Readiness, Diligence Priorities, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Statsig's exit trajectory has shifted permanently from an independent initial public offering to strategic
              absorption following OpenAI's announced $1.1 billion acquisition agreement. For prospective investors
              evaluating secondary transactions or synthetic exposure, critical diligence blind spots remain unresolved
              in public filings. Crucially, Statsig has not publicly disclosed gross margin profiles, net revenue
              retention (NRR) rates, customer acquisition cost (CAC) payback periods, or top-customer revenue
              concentration. These omissions prevent precise underwriting of cash flow durability. The underwriting
              thesis would break favorably if Statsig demonstrates verified NRR exceeding 130% alongside sustained
              revenue growth above 80% year-over-year while operating under independent commercial governance.
              Conversely, negative triggers include accelerating enterprise churn toward bundled observability features
              or severe renewal attrition following corporate ownership transitions.
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Avoid Fresh Capital Allocation at Stretched 27.5x Multiple
            body: >-
              At a $1.1 billion valuation on $40 million in ARR (a 27.5x multiple) and with OpenAI's acquisition
              agreement restructuring future governance and upside, fresh venture equity provides no favorable
              risk-adjusted return profile.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV003
              - CV009
          - type: callout
            title: Platform Commoditization and Competitive Response
            body: >-
              Following Statsig's rejection of Datadog's acquisition bid, Datadog's $220 million purchase of competitor
              Eppo directly integrates feature experimentation into the dominant observability platform, heightening
              customer acquisition and retention headwinds.
            calloutType: risk
            claimRefs:
              - CV007
              - CV008
              - CV010
