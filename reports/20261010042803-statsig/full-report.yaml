      - number: '5.4'
        title: Technical Differentiation, Governance, and Platform Risks
        blocks:
          - type: paragraph
            body: >-
              Statsig differentiates technically through deep statistical sophistication and flexible data deployment,
              yet the platform faces operational critiques and substantial ownership governance risks. Competitors
              highlight that Statsig's metered event-volume pricing can penalize experimentation scale and that its
              proprietary statistics calculations lack the full query transparency of open-source SQL alternatives. More
              critically, corporate transitions have introduced significant technical uncertainty: following OpenAI's
              acquisition of Statsig in September 2025, the Statsig brand and customer base were transferred to
              Amplitude in May 2026 under a perpetual non-exclusive license, while the founding engineering team
              remained at OpenAI. Competitors like GrowthBook and Conductrics emphasize that this split creates acute
              roadmap, support, and maintenance risks as platform stewardship transitions to a new engineering
              organization. From a compliance perspective, Statsig supports SOC 2 Type II controls and GDPR
              requirements, leveraging customer warehouse boundaries to satisfy strict data governance standards.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Sub-Millisecond Evaluation with Flexible Warehouse Execution
            body: >-
              Statsig's combination of local SDK rule caching (<1ms evaluation latency) and dual deployment models
              (hosted cloud vs. Warehouse Native without ETL) allows engineering teams to implement high-velocity
              experimentation while giving data-sensitive enterprises control over raw telemetry.
            calloutType: strength
            claimRefs:
              - CE001
              - CE003
              - CE004
          - type: callout
            title: Organizational Handoff and Roadmap Continuity Uncertainty
            body: >-
              The May 2026 transaction transferring Statsig's brand and customer base to Amplitude while original
              engineering remained at OpenAI creates technical governance and roadmap risk, exposing enterprise
              deployments to potential support dilution and core engine divergence.
            calloutType: risk
            claimRefs:
              - CE010
              - CE011
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation and Buyer Persona
        blocks:
          - type: paragraph
            body: >-
              Statsig's commercial penetration is concentrated within engineering-driven, product-led technology
              organizations where rapid experimentation directly impacts top-line business metrics. Third-party
              firmographic analysis of job listings and LinkedIn telemetry reveals that purchasing decisions are
              predominantly driven by Senior Product Managers (accounting for 18% of mentions) and Directors of Data
              Analytics (8%), with operational usage distributed across Senior Data Scientists (15%), Senior Product
              Analysts (12%), and Growth Engineers (10%). The customer roster exhibits a heavy structural skew toward
              mature venture-backed and public enterprises: companies utilizing Statsig are 1,216 times more likely to
              be at Series F and 768 times more likely to be at Series D or E funding than the baseline software
              population. By industry vertical, software development represents 36% of active accounts, followed by
              technology platforms at 12% and financial services at 12%, with mid-market firms (51 to 200 employees,
              24%) and large enterprises (1,001 to 5,000 employees, 21%) forming the backbone of the deployed base.
            claimRefs:
              - CU001
              - CU002
