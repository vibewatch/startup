        title: GTM Motion, Sales Efficiency, and Delivery Cost Structure
        blocks:
          - type: paragraph
            body: >-
              The 2023 free-tier expansion documents a product-led acquisition mechanism, not its conversion efficiency.
              Statsig's chief executive told TechCrunch that feature management was relatively inexpensive to operate,
              that large-customer analytics workloads carried significant costs, and that conversion by only a few free
              users could cover the free plan; no conversion cohort or contribution-margin schedule was supplied. Sacra
              says warehouse-native deployment can lower Statsig's infrastructure cost because analysis occurs inside a
              customer's data environment, but public evidence does not quantify the saving or prove a high-margin
              outcome. The assigned sources disclose no sales cycle, customer-acquisition cost, CAC payback, gross
              margin, or net retention. Those omissions prevent a reliable judgment on whether usage expansion produces
              attractive incremental economics.
