      - number: '6.3'
        title: Customer Durability, M&A Transition Friction, and Retention Scrutiny
        blocks:
          - type: paragraph
            body: >-
              While verified production case studies at Brex, Notion, Bluesky, and Secret Sales prove substantial
              operational benefits—including Brex's reported 50% data scientist time reduction and 20% analytics tooling
              cost savings—customer durability faces unprecedented structural friction. The May 2026 transaction
              structure fundamentally bifurcated Statsig's organization: Amplitude assumed commercial ownership of the
              Statsig brand, platform maintenance, and customer relationships, whereas OpenAI retained the founding
              engineering team, technical leadership, and statistical researchers. This split has sparked acute concern
              among enterprise buyers who chose Statsig specifically for its blistering engineering pace and developer
              intimacy. Competitors like Optimizely have publicly targeted this operational vulnerability, terming the
              orphaned platform a 'race car without a driver' and predicting support degradation and eventual product
              consolidation. Third-party telemetry indicates that 38 companies have already churned and 48 enterprise
              contracts face upcoming renewal within 90 days, creating an immediate test of customer retention.
