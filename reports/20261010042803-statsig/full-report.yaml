      - number: '6.2'
        title: Adoption Trajectory, Enterprise Scale, and Usage Growth
        blocks:
          - type: paragraph
            body: >-
              Operational adoption has scaled from early developer-led feature flagging into high-throughput enterprise
              infrastructure. Independent research estimates that Statsig surpassed 300 paying customers and reached an
              estimated $40 million in ARR prior to its announced acquisition, supported by carrier-grade platform
              reliability. Production telemetry reflects immense daily workload throughput: Statsig's distributed
              services ingest and evaluate over 1 trillion events per day and touch 2.5 billion unique monthly
              experiment subjects across web, server, and mobile client endpoints. Technical adoption demonstrates high
              stickiness within complex multi-product environments, where organizations deploy Statsig alongside
              developer experience tools like DX and enterprise search platforms like Glean. Enterprise expansion is
              particularly pronounced among organizations adopting Statsig's Warehouse-Native architecture, which
              executes SQL-based statistical calculations directly inside customer Snowflake, BigQuery, and Databricks
              clusters without requiring third-party data extraction pipelines.
            claimRefs:
              - CU002
