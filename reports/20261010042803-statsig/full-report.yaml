      - number: '7.2'
        title: Operational, security, and dependency exposure
        blocks:
          - type: paragraph
            body: >-
              Statsig describes layered mitigations: need-based production-data access, logged employee access, risk
              assessments, an incident-response plan, backups, multi-cloud infrastructure, and granular permissions.
              Recent company-issued release notes syndicated by Releasebot also describe narrower edit/delete
              permissions, project- and role-level MCP scopes, and a safer single-user override deletion path. These are
              meaningful controls, but they also identify the failure modes management is trying to contain:
              over-permissioned users or agents, concurrent configuration mutation, delayed detection, and recovery
              failure. Deployment choices shift rather than eliminate dependency. Hosted use depends on Statsig and
              cloud providers; the warehouse-native option depends on the customer's warehouse availability,
              permissions, query governance, and compute budget. Statsig further says it may use subprocessors and
              Amplitude affiliates. Public materials in the assigned pool do not quantify provider concentration,
              recovery objectives, subprocessor exposure, or the customer impact of an incident, so those fields remain
              diligence items rather than estimated facts.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
