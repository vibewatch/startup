      - number: '3.2'
        title: Feature Capabilities & Statistical Architecture
        blocks:
          - type: paragraph
            body: >-
              Statsig differentiates its core offering by tightly unifying in-application feature flagging, product
              analytics, and an enterprise-grade statistical engine into a cohesive developer workflow. The platform
              provides automated sample-ratio mismatch diagnostics alongside advanced statistical methodologies,
              specifically CUPED variance reduction and sequential testing with always-valid p-values. These statistical
              treatments accelerate experiment velocity by reducing required sample sizes and experiment durations by
              30% to 50% without inflating false-positive rates. Traditional enterprise suites like Adobe Analytics
              treat experimentation as an afterthought, relying on separate add-on tools such as Adobe Target with basic
              frequentist statistical frameworks. While open-source alternative GrowthBook also supports CUPED and local
              in-process SDK evaluation, Statsig's turnkey statistical automation provides immediate statistical rigor
              for engineering teams without requiring bespoke SQL pipeline development.
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP011
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP015
      - number: '3.3'
        title: Pricing Structures & Total Cost of Ownership
        blocks:
          - type: paragraph
            body: >-
              Total cost of ownership varies substantially based on the metric unit governing commercial billing.
              Statsig anchors its entry-level adoption on an unusually generous free tier granting 2 million events
              monthly across unlimited seats, followed by usage-based pricing scaling at approximately $400 per million
              events on self-service tiers. However, this event-based pricing structure can penalize teams utilizing the
              platform purely for operational feature flags rather than event-heavy behavioral analytics. Specialized
              challengers like Rollgate capitalize on this friction by pricing on flat SDK requests rather than
              analytics events, while providing default European Union data hosting across standard tiers. By contrast,
              Statsig restricts dedicated European Union data residency to custom enterprise agreements, forcing
              European teams on standard Pro tiers to address international data transfer compliance through standard
              contractual clauses.
            claimRefs:
              - CP006
              - CP007
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP009
              - CP011
              - CP012
      - number: '3.4'
        title: Switching Costs & Strategic M&A Risks
        blocks:
          - type: paragraph
            body: >-
              Switching barriers for Statsig customers center around deep code instrumentation, custom metric
              configurations, and historical experiment archives. Replacing Statsig requires engineering teams to rip
              and replace SDK calls embedded across production codebases, re-establish metric definitions in alternative
              BI or warehouse tools, and export experiment results before platform migrations. These technical switching
              barriers are compounded by acute roadmap uncertainty stemming from corporate ownership shifts. Following
              OpenAI's acquisition of Statsig in September 2025 to bolster AI-native evaluations, Amplitude acquired the
              Statsig brand and customer base in May 2026 while the core engineering team remained at OpenAI. This dual
              transfer creates long-term integration and support ambiguity as Amplitude executes a phased convergence
              into its own analytics product without the platform's original builders.
            claimRefs:
              - CP009
              - CP010
              - CP012
              - CP013
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Roadmap and Governance Friction Post-Amplitude Handover
            body: >-
              The two-stage acquisition of Statsig—first to OpenAI in September 2025 for AI-native development, and then
              the commercial handover of the brand and customer base to Amplitude in May 2026 without the founding
              engineering team—creates acute vendor risk. Buyers must evaluate potential platform convergence friction,
              support divergence, and uncertain long-term warehouse-native roadmap investment.
            calloutType: risk
            claimRefs:
              - CP009
              - CP010
          - type: callout
            title: Architectural Divide Between Warehouse-Native and Managed SaaS
            body: >-
              The experimentation market has fractured into two distinct architectures: warehouse-native platforms like
              GrowthBook and Eppo that operate directly on customer data warehouses, and integrated managed suites like
              Statsig that combine an advanced stats engine with optional warehouse querying. For engineering-led teams,
              this architectural choice dictates long-term data pipeline maintenance and metric governance.
            calloutType: insight
            claimRefs:
              - CP002
              - CP004
              - CP015
