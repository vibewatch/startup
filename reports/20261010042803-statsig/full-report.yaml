        - Corroborated Series C terms ($1.1B valuation, $100M raise, $40M ARR)
        - Sufficient public proof on valuation multiple and strategic deal posture
      - - Fundamental Risk Rating
        - High
        - 27.5x ARR multiple; Datadog/Eppo consolidation; unverified NRR and margins
        - Requires substantial margin expansion and customer retention to justify price
      - - Valuation Stance
        - Stretched
        - 27.5x ARR multiple vs 8x-12x median public SaaS multiples
        - Priced for perfect execution with no margin of safety for standalone capital
    notes: >-
      Recommendation assesses fresh standalone venture investment in Statsig at its reported $1.1B Series C valuation;
      exit paths and governance are constrained by announced strategic transactions.
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV007
      - CV009
  - id: TV002
    title: Core Investment Thesis and Anti-Thesis Balance Sheet
    columns:
      - Pillar
      - Category
      - Core Analytical Argument
      - Invalidation / Thesis-Break Trigger
    rows:
      - - Unified Platform Adoption
        - Thesis
        - >-
          Combining feature flags, A/B testing, and analytics into one console eliminates multi-vendor fragmentation and
          delivers 50% data team efficiency gains.
        - >-
          Competitors bundle experimentation into core observability or analytics suites at zero marginal cost, halting
          Statsig expansions.
      - - Warehouse-Native Architecture
        - Thesis
        - >-
          Executing analytical queries in customer data warehouses lowers hosting compute burdens and unlocks regulated
          enterprise clients.
        - Data warehouse compute fees exceed client expectations, prompting migrations back to hosted point solutions.
      - - Excessive Entry Multiple
        - Anti-Thesis
        - >-
          A 27.5x ARR multiple ($1.1B on $40M ARR) reflects extreme private valuation froth compared to normalized
          software market multiples.
        - Sustained revenue growth exceeding 100% year-over-year with demonstrated gross margins above 80%.
      - - Platform Absorption & M&A Overhang
        - Anti-Thesis
        - >-
          Datadog acquiring Eppo and OpenAI acquiring Statsig removes standalone liquidity options and increases direct
          platform competition.
        - Statsig maintains independent commercial operations and scales multi-cloud enterprise ARR beyond $100M.
    notes: >-
      Thesis arguments synthesize operational and financial evidence; invalidation triggers define observable operating
      milestones that would change the underwriting view.
    claimRefs:
      - CV003
      - CV007
      - CV008
      - CV010
      - CV011
      - CV012
      - CV014
  - id: TV003
    title: 'Scenario Underwriting: Bull, Base, and Bear Case Matrix'
    columns:
      - Scenario Case
      - Assumed ARR & Growth
      - Target Multiple & Implied Value
      - Key Operating Assumptions
      - Downside / Upside Triggers
      - Probability Signal
    rows:
      - - Bull Case
        - Scales from $40M ARR to $120M ARR (75%+ CAGR)
        - 18.0x ARR multiple ($2.16B valuation)
        - >-
          Warehouse-native dominates enterprise; AI tooling drives massive experiment volumes; successful multi-product
          cross-sell
        - OpenAI ecosystem integration accelerates enterprise AI feature rollouts globally
        - 20% (Low)
      - - Base Case
        - Grows from $40M ARR to $70M ARR (35% CAGR)
        - 10.0x ARR multiple ($700M valuation)
        - >-
          Growth moderates as Datadog/Eppo and PostHog compete aggressively; unverified gross margins limit multiple
          expansion
        - Down-round or multiple compression relative to $1.1B Series C entry price
        - 55% (Moderate)
      - - Bear Case
        - Stagnates at $45M ARR (<15% CAGR)
        - 5.0x ARR multiple ($225M valuation)
        - >-
          Standalone experimentation commoditized into observability suites; OpenAI acquisition alters independent
          customer relationships
        - Large enterprise churn and aggressive price-cutting by open-source alternatives
        - 25% (Material)
    notes: >-
      Valuation multiples reflect software market comps; probability signals reflect risk-weighted expected value
      analysis given announced acquisition transactions.
