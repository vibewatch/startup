      - number: '7.3'
        title: Mitigations, monitoring indicators, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The investment case should be conditioned on evidence that controls operate, not merely that control
              descriptions exist. Before commitment, obtain current independent assurance, penetration-test and
              disaster-recovery summaries, the incident and material-outage history, recovery-time and recovery-point
              objectives, and a deployment-specific data-flow map. For live product risk, require approval workflows for
              high-impact gates, least-privilege MCP and console roles, reconciled assignment and exposure logs,
              sample-ratio-mismatch monitoring, pre-agreed stopping rules, and a tested rollback path. For
              warehouse-native economics, monitor query spend by experiment and reload because the 2026 release notes
              explicitly added cost-attribution tags to expose that spend. Thesis-break triggers should include an
              unremediated material assurance exception, failure to provide an incident record, repeated control bypass,
              unreconciled experiment data that changes decisions, missed contractual recovery objectives, or deployment
              costs that erase consolidation savings. Revenue burn, customer concentration, and contractual liability
              cannot be quantified from this chapter's pool and should remain open rather than receiving invented
              thresholds.
            claimRefs:
              - CR003
              - CR004
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR016
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not infer incident absence
            body: >-
              The assigned sources describe controls and public signals but do not provide a complete incident, outage,
              litigation, or enforcement history; absence from this pool is not evidence that none occurred.
            calloutType: risk
            claimRefs:
              - CR004
              - CR016
          - type: callout
            title: Gate investment on control evidence
            body: >-
              Require current assurance, control-test results, incident history, deployment economics, and a
              production-like rollback and experiment-integrity exercise before relying on the published control
              narrative.
            calloutType: recommendation
            claimRefs:
              - CR003
              - CR004
              - CR009
