chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity and Product Model
        blocks:
          - type: paragraph
            body: >-
              Statsig was established in 2021 in the Seattle metropolitan area to build a modern, unified product
              development platform combining enterprise feature flagging, statistical A/B testing, and integrated
              product analytics. Rather than forcing software engineering and product data organizations to stitch
              together disparate point solutions for release gating and analytics, Statsig introduced a single
              integrated architecture that supports both multitenant cloud software-as-a-service and warehouse-native
              deployments directly on Snowflake, BigQuery, and Databricks. At enterprise scale, the platform operates
              with high-throughput infrastructure, processing over one trillion events per day and evaluating
              approximately 2.5 billion unique monthly experiment subjects across more than 300 paying commercial
              accounts. Industry estimates indicated the business scaled to an annual recurring revenue run-rate of
              approximately $40 million by May 2025 before its acquisition, underpinned by an event-metered consumption
              model that expands alongside customer product rollout volumes.
            claimRefs:
              - CO001
              - CO009
              - CO010
          - type: table
            tableRef: TO001
            claimRefs:
              - CO003
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
      - number: '1.2'
        title: Founding Leadership and Governance Split
        blocks:
          - type: paragraph
            body: >-
              Statsig was founded by veteran technology executive Vijaye Raji, who previously accumulated almost a
              decade of software engineering leadership at Microsoft and later served as Vice President of Entertainment
              and Head of Facebook Seattle. Raji guided Statsig's rapid product iteration and culture of developer
              responsiveness, serving as founder, chief executive, and lead frontend developer. Following OpenAI's
              acquisition of Statsig in September 2025, Raji assumed the role of Chief Technology Officer of
              Applications at OpenAI. In May 2026, OpenAI executed a novel structural carve-out that transferred
              Statsig's commercial brand, customer relationships, and operational platform code to analytics provider
              Amplitude, while Raji and the original Statsig core engineering team remained at OpenAI. To steward
              platform continuity, Amplitude assigned Vice President of Product Management Chris Yu to lead a dedicated
              organization of approximately 50 personnel. However, this bifurcated arrangement has drawn criticism from
              industry observers and competitors, who argue that separating the operational software codebase from its
              original founding talent creates substantial key-person dependencies and technical support risks for
              customers.
            claimRefs:
              - CO002
              - CO005
              - CO006
              - CO011
              - CO012
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO004
              - CO005
              - CO006
      - number: '1.3'
        title: Capitalization History and Ownership Structure
        blocks:
          - type: paragraph
            body: >-
              Across its independent venture lifecycle, Statsig raised approximately $153.4 million in equity capital
              across three institutional funding rounds. The company completed a $10.4 million Series A round in August
              2021 and a $43 million Series B round in April 2022, both led by Sequoia Capital with recurring
              participation from regional venture firm Madrona Venture Group. In May 2025, Statsig completed a $100
              million Series C financing led by ICONIQ Growth at a post-money valuation of $1.1 billion, consisting of
              $80 million in primary corporate growth capital and $20 million in secondary liquidity for employee
              shareholders. Just four months later, in September 2025, OpenAI announced an agreement to acquire Statsig
              in an all-stock transaction valued at $1.1 billion, representing one of the largest corporate acquisitions
              in OpenAI's history. The ownership structure transitioned again in May 2026 when Amplitude entered into a
              definitive strategic partnership to take custody of the customer base, platform software, and operating
              revenue stream.
            claimRefs:
              - CO003
              - CO004
              - CO007
              - CO008
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO007
              - CO008
      - number: '1.4'
        title: Corporate Milestones and Integration Outlook
        blocks:
          - type: paragraph
            body: >-
              Statsig's evolution from an early-stage experimentation startup into a core infrastructure asset spans
              three distinct operating eras: independent venture expansion, incorporation into OpenAI's application
              development stack, and subsequent commercial absorption by Amplitude. While initial integration under
              OpenAI focused on utilizing Statsig's runtime evaluation tools for internal AI applications, the May 2026
              transaction tasked Amplitude with operating the enterprise SaaS platform externally. In June 2026,
              Amplitude outlined its Phase 1 technical priorities, which focus on enterprise control and governance
              tooling, native Model Context Protocol integrations, and connecting Statsig's statistical engine with
              Amplitude's behavioral analytics pipeline. Critical diligence gaps remain, however, regarding post-deal
              gross margins, net revenue retention rates, and the contractual pricing terms that enterprise customers
              will face during their upcoming renewal cycles under Amplitude's consolidated governance.
            claimRefs:
              - CO003
              - CO004
              - CO005
              - CO013
              - CO014
