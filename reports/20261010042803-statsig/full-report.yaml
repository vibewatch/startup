  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Taxonomy, and Product Scope
        blocks:
          - type: paragraph
            body: >-
              Statsig operates across three converging categories in modern software delivery: feature management and
              progressive rollouts, statistical A/B experimentation, and integrated product analytics. Historically,
              software organizations procured discrete point solutions for each workflow: LaunchDarkly or Split for
              feature gating, Optimizely or VWO for experimentation, and Amplitude, Mixpanel, or Heap for user
              behavioral tracking. This fragmentation created substantial friction, including duplicated SDK network
              overhead, inconsistent user exposure logging, and time-consuming data pipeline synchronization between
              telemetry systems and experimentation engines. Statsig's core architectural thesis consolidates these
              layers into a single workflow where every feature flag rollout automatically acts as an instrumented
              experiment backed by built-in statistical evaluation. Additionally, Statsig pioneered Warehouse Native
              deployment, allowing enterprise data teams to compute experimental metrics directly inside cloud data
              warehouses like Snowflake, BigQuery, and Databricks without external ETL data egress. This boundary
              definition encompasses core developer-first experimentation and feature flags while explicitly excluding
              legacy visual web page builders, static configuration management, and general-purpose enterprise business
              intelligence suites.
            claimRefs:
              - CM001
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM008
              - CM011
      - number: '2.2'
        title: TAM, SAM, and Sizing Lenses Across Operating Models
        blocks:
          - type: paragraph
            body: >-
              Quantifying Statsig's addressable opportunity requires segmenting the broader software telemetry and
              experimentation landscape across multiple operational lenses. Traditional industry estimates often view
              A/B testing through a narrow web-optimization lens. According to Convert Experiences' 2026 market
              analysis, the standalone web-only experimentation total addressable market sits at approximately $1.0
              billion with annual expansion slowing to roughly 10%, indicating maturation and saturation among
              traditional front-end marketing buyers. However, Statsig addresses a substantially larger technical market
              by serving engineering-led product development and integrating into modern data warehouse infrastructure.
              Sacra estimates that the broader cloud data warehouse analytics ecosystem exceeds $10 billion in annual
              enterprise spend. Within this intersection, the serviceable addressable market (SAM) for developer-first
              feature management and statistical experimentation is estimated between $350 million and $500 million,
              expanding at 15% to 20% annually. Constrained by customer maturity and high-velocity engineering
              requirements, Statsig's serviceable obtainable market (SOM) is estimated at $50 million to $75 million,
              anchored by its reported $40 million ARR base across over 300 enterprise accounts prior to acquisition.
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM012
          - type: table
            tableRef: TM002
            claimRefs:
              - CM004
              - CM005
              - CM012
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM004
              - CM005
              - CM011
              - CM012
      - number: '2.3'
        title: Enterprise Buyer Personas, Budget Ownership, and Procurement Patterns
        blocks:
          - type: paragraph
            body: >-
              Adoption of Statsig is characterized by distinct buyer and user personas across startup, scale-up, and
              enterprise tiers. At early-stage startups and growth teams, adoption is typically bottom-up and
              developer-led, initiated by engineering leads seeking to deprecate fragile internal config databases.
              Statsig's Free Developer tier, offering up to 1 million monthly tracked users (MTUs) and unlimited seats,
              acts as an effective low-friction adoption funnel. In mid-market and enterprise organizations, budget
              ownership shifts toward the VP of Product and Head of Data, who evaluate platforms based on statistical
              rigor (such as CUPED variance reduction) and the total cost of ownership across combined tooling.
              According to Vendr procurement transaction benchmarks, Statsig's commercial packaging scales primarily on
              unique MTUs exposed to flags or tests, combined with seat tiers. Mid-market teams on Pro contracts
              starting at $150/month commonly negotiate 15% to 25% annual contract discounts, while enterprise
              deployments exceeding 10M MTUs achieve 20% to 35% discounts against initial quotes. For regulated
              financial services and healthcare enterprises, the Chief Technology Officer and Chief Data Officer serve
              as critical gatekeepers, demanding warehouse-native architecture to satisfy stringent data residency, SOC
              2, and GDPR governance constraints.
            claimRefs:
              - CM002
              - CM003
              - CM010
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM002
              - CM003
              - CM010
              - CM013
      - number: '2.4'
        title: Market Consolidation, Growth Drivers, and Post-M&A Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              The experimentation category has entered an era of rapid structural consolidation driven by macroeconomic
              budget rationalization and the rise of AI-assisted software generation. As generative AI dramatically
              cheapens code generation, the software engineering bottleneck has shifted from shipping features to
              verifying what works in production. Standalone point solutions unable to scale beyond simple front-end web
              tests have been absorbed by broader platforms: Datadog acquired Eppo for $220 million in May 2025, Harness
              acquired Split, and Everstone merged VWO with AB Tasty to create a private-equity rollup. Statsig followed
              an unprecedented dual-exit path: in September 2025, OpenAI acquired Statsig for $1.1 billion in stock to
              absorb its runtime control plane and talent, appointing founder Vijaye Raji as CTO of Applications.
              Subsequently, on May 5, 2026, Amplitude announced a strategic partnership assuming Statsig's brand,
              operational continuity, and customer relationships. While this handover ensures ongoing SaaS support, it
              introduces commercial friction and diligence uncertainty. Key operational metrics—including net revenue
              retention, contract renewal terms under Amplitude, and the long-term convergence of warehouse-native
              processing with Amplitude's event stream infrastructure—remain undisclosed to private market diligence.
            claimRefs:
              - CM006
              - CM007
              - CM008
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Bifurcation of the Experimentation Market: Standalone Squeeze vs. Ecosystem Expansion'
            body: >-
              The experimentation category has split between slowing standalone web-testing suites (growing at ~10% with
              a $1B ceiling) and high-growth developer-first platforms that integrate feature gates, telemetry, and
              warehouse-native compute. Statsig's ability to operate directly inside cloud warehouses (Snowflake,
              BigQuery, Databricks) positions it to tap into the larger $10B+ warehouse analytics ecosystem, avoiding
              the margin squeeze of traditional SaaS data duplication.
            calloutType: insight
            claimRefs:
              - CM004
              - CM005
              - CM011
          - type: callout
            title: Post-OpenAI Transition and Amplitude Commercial Friction
            body: >-
              Following OpenAI's $1.1B acquisition of Statsig in September 2025 and subsequent transfer of customer
              relationships to Amplitude in May 2026, enterprise buyers face renewal uncertainty. The transition from an
              independent platform to an Amplitude-partnered commercial structure creates questions around contractual
              discounting (historically 15–35% for enterprise scale) and long-term architectural alignment between
              warehouse-native workflows and Amplitude's event stream infrastructure.
            calloutType: risk
            claimRefs:
              - CM002
              - CM003
              - CM007
              - CM014
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape & Categorization
        blocks:
          - type: paragraph
            body: >-
              The competitive landscape surrounding Statsig divides into three primary architectures: dedicated
              enterprise feature management vendors, warehouse-native experimentation platforms, and all-in-one product
              analytics suites. Dedicated enterprise feature management incumbents like LaunchDarkly focus heavily on
              DevOps release workflows, fine-grained access governance, and extensive multi-language SDK ecosystems, but
              historically treat deep causal experimentation and post-release product analytics as secondary modules or
              add-on packages. In contrast, warehouse-native alternatives such as GrowthBook and Eppo operate directly
              against enterprise data warehouses—including Snowflake, BigQuery, and Databricks—avoiding redundant event
              pipelines while keeping data strictly within customer-controlled infrastructure. Specialized marketing
              tools like PulseCRO target non-technical growth teams with visual no-code page editors, contrasting with
              Statsig's developer-centric SDK architecture.
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP008
              - CP014
