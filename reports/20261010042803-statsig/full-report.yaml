        title: Exhibits
        blocks:
          - type: callout
            title: Organizational Split Between Talent and SaaS Infrastructure
            body: >-
              The May 2026 transaction between OpenAI and Amplitude created an unprecedented corporate structure where
              the software platform and customer contracts transitioned to Amplitude while the original engineering and
              research team remained at OpenAI. This separation creates key-person dependencies and technical transition
              risks for existing customers relying on continuous innovation in warehouse-native experimentation.
