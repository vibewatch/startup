  - id: FE001
    title: Statsig Unified Product and Technology Architecture Stack
    type: stack
    summary: >-
      Six-layer functional stack illustrating Statsig's end-to-end architecture from client/server SDKs to the
      underlying analytics and warehouse infrastructure.
    approximationNotes: >-
      Layer abstraction models both hosted SaaS and Warehouse Native execution paths based on public technical
      specifications.
    claimRefs:
      - CE001
      - CE003
      - CE004
      - CE006
      - CE007
    data:
      layers:
        - label: Developer & Application SDK Layer
          detail: 30+ open-source client-side, server-side, and edge SDKs delivering sub-millisecond local evaluations
          modules:
            - Client SDKs (React, iOS, Android)
            - Server SDKs (Node, Python, Go, Java)
            - Edge Middleware & CDN Adapters
        - label: Edge & Routing Evaluation Gateway
          detail: Distributed CDN edge evaluation nodes with cached rule payloads and dynamic configurations
          modules:
            - Edge Config Caching
            - Local Evaluation Engine
            - Dynamic Parameter Stores
        - label: Streaming Telemetry Ingestion
          detail: High-throughput streaming pipelines processing over 1 trillion daily exposure and analytics events
          modules:
            - Event Ingestion Gateways
            - Telemetry De-duplication
            - Databricks Streaming Lakehouse
        - label: Statistical Computation & Variance Reduction
          detail: Proprietary stats engine executing frequentist, sequential, and CUPED variance-reduced experimentation tests
          modules:
            - CUPED Engine
            - Sequential Testing
            - Autotune Bandits
            - Holdout Diagnostics
        - label: Storage & Warehouse Native Execution
          detail: >-
            Hybrid persistence supporting Statsig-managed cloud stores or in-situ customer warehouse execution
            (Snowflake, Databricks, BigQuery)
          modules:
            - Statsig Cloud Managed Store
            - Warehouse Native Connector
            - Zero-ETL SQL Query Compiler
        - label: Unified Console & Governance Plane
          detail: Centralized web console managing targeting rules, holdouts, autotune, and enterprise RBAC policies
          modules:
            - Feature Gate Console
            - Experimentation Dashboard
            - Session Replay Explorer
            - Enterprise RBAC & Audit Logs
  - id: FU001
    title: Customer journey and expansion lifecycle map
    type: journey-map
    summary: >-
      Customer progression from initial developer-led feature flagging to organization-wide warehouse-native
      experimentation and governance.
    approximationNotes: >-
      Workflow stages reflect standard adoption patterns documented in customer case studies and product update logs;
      conversion timing varies by customer size.
    claimRefs:
      - CU003
      - CU004
      - CU013
      - CU014
    data:
      items:
        - label: 'Stage 1: Developer Feature Flagging'
          touchpoints:
            - Open-source SDK integration
            - Console feature gate setup
            - Developer-led experimentation
          detail: >-
            Engineering teams implement free or low-tier feature flags to safely gate code releases and decouple
            deployment from release.
        - label: 'Stage 2: Self-Service Product Analytics'
          touchpoints:
            - Event stream ingestion
            - Metrics explorer configuration
            - Session replay inspection
          detail: >-
            Product managers and analysts connect user events to feature gates to measure basic release impact without
            data engineering tickets.
        - label: 'Stage 3: Controlled A/B Testing'
          touchpoints:
            - Hypothesis design
            - Automated sample sizing
            - CUPED variance reduction
          detail: >-
            Teams launch multivariate experiments and utilize automated statistical engines to establish causal impact
            on conversion metrics.
        - label: 'Stage 4: Warehouse-Native Migration'
          touchpoints:
            - Snowflake/Databricks connection
            - Zero-ETL SQL generation
            - Data governance review
          detail: >-
            Enterprises connect experiments directly to their cloud data warehouse to comply with data residency rules
            and eliminate third-party data lock-in.
        - label: 'Stage 5: Enterprise Governance & MCP'
          touchpoints:
            - Console API review workflows
            - Model Context Protocol tools
            - Audit log tracking
          detail: >-
            Organizations formalize multi-team change management policies and grant AI coding agents governed access to
            feature flags.
        - label: 'Stage 6: Platform Transition & Renewal'
          touchpoints:
            - Amplitude contract alignment
            - OpenAI engineering transition review
            - Platform continuity evaluation
          detail: >-
            Customers review roadmap ownership and pricing structures following Amplitude's operational takeover and
            OpenAI's talent acquisition.
  - id: FR001
    title: Qualitative residual-risk heatmap
    type: matrix
    summary: >-
      Nine diligence themes are positioned by qualitative impact and likelihood; placement is directional because
      incident frequencies and loss data are unavailable.
    data:
      columns:
        - Lower likelihood
        - Medium likelihood
        - Higher likelihood
      rows:
        - label: Critical impact
          values:
            - value: Hosted availability failure
              detail: Controls are described, but tested RTO/RPO and incident history are absent.
            - value: Privileged configuration error
              detail: Granular permissions mitigate but do not remove live-change risk.
            - value: Material assurance exception
              detail: Impact is critical if scope or exceptions undermine regulated procurement.
        - label: High impact
          values:
            - value: Subprocessor disruption
              detail: Named dependency exists; concentration and substitution timing are unknown.
            - value: Experiment-analysis error
              detail: Correct rollout does not establish correct inference.
            - value: Warehouse compute overrun
              detail: Cost tags improve detection, while underlying usage remains variable.
        - label: Material impact
          values:
            - value: Public assurance mismatch
              detail: Conflicting public visibility can slow procurement without proving control failure.
            - value: Concurrent override mutation
              detail: Targeted deletion narrows the change surface.
            - value: Suite-governance sprawl
              detail: Integrated breadth increases the number of permissions and workflows to govern.
        - label: Moderate impact
          values:
            - value: Internal-access exception
              detail: Need-based, logged access still requires periodic entitlement review.
            - value: Replication mismatch
              detail: Resiliency depends on deployment-specific replication requirements.
            - value: MCP scope drift
              detail: Project, role, and token scopes must remain aligned.
        - label: Limited impact
          values:
            - value: Subprocessor notice delay
              detail: Contract terms and objection windows determine practical exposure.
            - value: Cost-tag coverage gap
              detail: Attribution improves visibility but does not cap warehouse spend.
            - value: Diagnostic review delay
              detail: Automated signals still require accountable human review.
        - label: Low impact
          values:
            - value: Documentation lag
              detail: Public materials may trail current private assurance evidence.
            - value: Role-alias mapping error
              detail: Provisioning translations require testing against identity-provider changes.
            - value: Pilot workflow friction
              detail: A representative pilot can expose setup and reconciliation gaps before rollout.
    approximationNotes: Likelihood and impact are qualitative analyst judgments, not measured incident probabilities or loss estimates.
    claimRefs:
      - CR003
      - CR005
      - CR009
      - CR010
      - CR011
      - CR012
      - CR015
      - CR016
