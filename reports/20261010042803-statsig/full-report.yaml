            body: >-
              GeekWire reported Statsig's company-disclosed $40 million ARR in May 2025, and Sacra separately estimated
              $40 million ARR for that month and reported more than 300 paying customers. The agreement between those
              two sources does not replace an audited ARR bridge, and GeekWire said Statsig declined further financial
