      - number: '5.2'
        title: Technology Architecture and Ingestion Operating Model
        blocks:
          - type: paragraph
            body: >-
              The underlying technical architecture of Statsig is structured around decoupled edge evaluation,
              high-throughput streaming ingestion, and flexible storage execution. Client and server SDKs download
              targeting payloads upon startup to execute feature gate checks and dynamic configuration evaluations
              locally, achieving sub-millisecond evaluation latency without network overhead. Telemetry from exposure
              checks and downstream user interactions streams through ingestion pipelines capable of processing over one
              trillion events daily at 99.99% system availability. Strategic partnerships with infrastructure providers
              like Databricks historically enabled Statsig to process tens of billions of daily data events through
              scalable lakehouse streaming pipelines without manual cluster intervention. For organizations with
              rigorous data sovereignty requirements, Statsig's Warehouse Native option evaluates experiment data
              directly within customer-hosted Snowflake, BigQuery, or Databricks instances, preventing sensitive raw
              event extraction while maintaining statistical rigor. APIs act as the essential connective tissue linking
              these modular microservices into a cohesive deployment model.
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE007
          - type: table
