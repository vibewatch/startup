  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Core Module Portfolio
        blocks:
          - type: paragraph
            body: >-
              Statsig defines its core product offering as a modern, unified product development platform that
              integrates five principal capabilities within a single console and software development kit. Rather than
              forcing engineering and growth teams to stitch together disparate point tools, Statsig consolidates
              feature management, A/B testing experimentation, product analytics, session replay, and warehouse-native
              analytics. This unified model is engineered to remove context switching between deployment and evaluation,
              allowing teams to wrap new capabilities in feature gates and observe downstream metric impacts
              immediately. Advanced capabilities such as CUPED variance reduction, sequential testing, dynamic
              configurations, autotune, and holdouts are natively embedded into the experimentation workflow. Founder
              Vijaye Raji framed this architectural approach around building a one-stop product-building platform that
              unifies conceiving, releasing, and observing software behaviors as rapid artificial intelligence adoption
              accelerates release velocity and behavioral complexity.
            claimRefs:
              - CE001
              - CE002
              - CE006
              - CE014
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
