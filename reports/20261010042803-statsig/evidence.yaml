evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: private-economics
    missingEvidence: >-
      Audited financial statements confirming post-acquisition gross margins, net revenue retention, customer
      concentration, and renewal contract pricing under Amplitude.
    whyItMatters: >-
      Without primary accounting disclosures, long-term customer economics and unit profitability cannot be confirmed
      following the ownership division between OpenAI and Amplitude.
    diligencePath: >-
      Request customer renewal pricing schedules and audited operating statements during commercial or secondary
      transaction due diligence.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-and-founder-table
    missingEvidence: >-
      Complete roster of former Statsig engineering and research employees who transitioned to OpenAI versus the full
      50-person Ampliteer support team.
    whyItMatters: >-
      Individual employee retention and key-person technical ownership affect the long-term supportability of the
      warehouse-native statistical engine.
    diligencePath: Inspect engineering transition agreements and team assignments between OpenAI and Amplitude.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: diligence-gaps
    missingEvidence: >-
      Audited post-acquisition customer renewal rates, net revenue retention (NRR), and contractual churn figures
      following the May 2026 Amplitude partnership transition.
    whyItMatters: >-
      Without customer retention data, it is impossible to verify whether the ownership transfer from OpenAI to
      Amplitude caused enterprise customer attrition or pricing friction.
    diligencePath: >-
      Request customer cohort retention and NRR data during commercial diligence with Amplitude and Statsig sales
      leadership.
    relatedQuestionRefs:
      - QM009
  - type: missing-source
    severity: material
    topic: data-residency-compliance
    missingEvidence: >-
      Direct empirical telemetry and enterprise procurement case studies documenting the compliance failure rate of
      European enterprise prospects due to Statsig's Enterprise-only EU data residency gate.
    whyItMatters: >-
      Determines whether EU data localization policies create a decisive barrier against European enterprise expansion
      or if standard DPAs and SCCs sufficiently satisfy local DPOs.
    diligencePath: >-
      Review European RFP records, DPA acceptance rates, and win/loss analyses for EU-headquartered customer
      evaluations.
    relatedQuestionRefs:
      - QP009
  - type: private-evidence-only
    severity: material
    topic: unit-economics-benchmarks
    missingEvidence: >-
      Audited gross margin percentage, net revenue retention (NRR) cohorts, and customer acquisition cost (CAC) payback
      figures.
    whyItMatters: >-
      Without audited gross margin and cohort NRR, an underwriter cannot evaluate underlying unit profitability or
      compute cost burdens across high-event tiers.
    diligencePath: >-
      Obtain management accounts and cohort-level retention ledgers separating multi-tenant cloud accounts from
      warehouse-native enterprise accounts.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: Current cash balance, monthly cash burn, runway, debt, post-close obligations, and use-of-funds reconciliation.
    whyItMatters: Historical funding raised cannot establish cash currently available or the need for additional capital.
    diligencePath: >-
      Obtain the latest balance sheet, monthly cash flow, debt schedule, transaction transfers, and board-approved
      operating plan.
    relatedQuestionRefs:
      - QI004
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: renewal-contract-terms
    missingEvidence: >-
      Primary commercial agreements, pricing schedules, and customer notices governing the reported Amplitude
      transition.
    whyItMatters: >-
      A competitor-issued account identifies renewal pricing and roadmap integration as open, but cannot establish
      actual customer terms.
    diligencePath: >-
      Review Amplitude and Statsig transaction documents, customer notices, master service agreements, and renewal
      amendments.
    relatedQuestionRefs:
      - QI005
  - type: private-evidence-only
    severity: material
    topic: performance
    missingEvidence: >-
      Independent third-party latency benchmarks and warehouse compute cost telemetry under high-throughput Warehouse
      Native customer workloads.
    whyItMatters: >-
      Competitors claim warehouse-native processing imposes significant hidden cloud compute overhead on customer
      warehouses, but detailed customer billing data is private.
    diligencePath: >-
      Request customer warehouse compute audit logs and query profiling records across Snowflake and Databricks
      production deployments.
    relatedQuestionRefs:
      - QE004
      - QE007
  - type: conflicting-data
    severity: material
    topic: roadmap
    missingEvidence: >-
      Detailed technical roadmap commitments and SLA definitions from Amplitude following the post-acquisition
      transition from OpenAI.
    whyItMatters: >-
      Enterprise buyers need assurance that core SDK maintenance, statistics engine enhancements, and enterprise support
      will maintain previous velocity.
    diligencePath: Review Amplitude's formal platform convergence roadmap and contractual developer support guarantees.
    relatedQuestionRefs:
      - QE006
  - type: private-evidence-only
    severity: material
    topic: Customer retention metrics and cohort durability
    missingEvidence: >-
      Audited net revenue retention (NRR), gross revenue retention (GRR), and logo retention figures across annual
      enterprise cohorts.
    whyItMatters: >-
      Without formal cohort-level retention data, the long-term durability of Statsig's customer expansion cannot be
      separated from top-of-funnel customer acquisition velocity.
    diligencePath: >-
      Request customer renewal cohort data, logo retention schedules, and ARR expansion curves from Amplitude and
      Statsig commercial leadership during confirmatory diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: Full commercial customer contract registry
    missingEvidence: Exhaustive registry of paying enterprise accounts, ACV distribution, and contract terms.
    whyItMatters: >-
      Third-party DNS telemetry identifies 490 active deployments but cannot verify contract tiering, paid vs free tier
      usage, or top-customer revenue concentration.
    diligencePath: >-
      Review the confidential master services agreement (MSA) schedule and ACV concentration waterfall in the vendor
      data room.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: soc2
    missingEvidence: >-
      Current SOC 2 report, bridge letter, scope, exceptions, auditor identity, and remediation status, plus operative
      privacy terms and data-transfer mechanisms.
    whyItMatters: >-
      Public-source conflict cannot distinguish a disclosure gap from a scope or control weakness, and the answer can
      affect enterprise procurement.
    diligencePath: >-
      Request the documents under NDA and have security and privacy counsel map their scope to the intended deployment
      and post-acquisition control owner.
