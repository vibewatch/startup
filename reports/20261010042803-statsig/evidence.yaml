      - QR008
    relatedTableRefs:
      - TR001
  - type: missing-source
    severity: material
    topic: incident-history
    missingEvidence: >-
      Complete security-incident, material-outage, SLA-attainment, control-test, RTO/RPO, litigation, and enforcement
      history.
    whyItMatters: >-
      Control descriptions and company uptime claims do not establish how controls performed during real failures or
      whether undisclosed liabilities exist.
    diligencePath: >-
      Obtain incident and claims registers, status-page exports, insurer loss runs, customer notices, penetration-test
