callouts:
  - calloutType: "risk"
    title: "Roadmap and Governance Friction Post-Amplitude Handover"
    body: "The two-stage acquisition of Statsig—first to OpenAI in September 2025 for AI-native development, and then the commercial handover of the brand and customer base to Amplitude in May 2026 without the founding engineering team—creates acute vendor risk. Buyers must evaluate potential platform convergence friction, support divergence, and uncertain long-term warehouse-native roadmap investment."
    claimRefs:
      - "CP009"
      - "CP010"
  - calloutType: "insight"
    title: "Architectural Divide Between Warehouse-Native and Managed SaaS"
    body: "The experimentation market has fractured into two distinct architectures: warehouse-native platforms like GrowthBook and Eppo that operate directly on customer data warehouses, and integrated managed suites like Statsig that combine an advanced stats engine with optional warehouse querying. For engineering-led teams, this architectural choice dictates long-term data pipeline maintenance and metric governance."
    claimRefs:
      - "CP002"
      - "CP004"
      - "CP015"
