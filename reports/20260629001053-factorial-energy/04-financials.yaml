schemaVersion: report-v2
artifact: financials
slug: factorial-energy
runDate: '2026-06-29'
company:
  name: Factorial Energy
chapter:
  number: 4
  title: Financials
  summary: >-
    Factorial entered Q1 2026 as a pre-revenue development-stage battery company with $25.5 million of cash,
    a $8.6 million quarterly net loss, and $6.1 million of operating cash burn, then materially improved liquidity
    through its June 2026 de-SPAC close to approximately $116.6 million of cash. The filings also show why the
    balance still cannot be read as abundant: management expects burn and capex to rise during line expansion,
    disclosed a material weakness in internal controls, and says the current plan funds operations only into Q1 2028.
sections:
  - id: revenue-model-and-monetization
    title: Revenue Model and Monetization Reality
    body: >-
      The public record is unusually clear about what Factorial is not yet: it had no revenue to date as of March 31,
      2026, so this chapter should not imply any commercial sales ramp that management has not disclosed. What the
      record does show is a planned monetization architecture rather than realized revenue quality. The March 2026
      investor presentation describes four future lanes—development and service revenue, technology license or
      royalty revenue, material supply revenue, and eventual manufacturing or battery-cell sales—while the same deck
      frames defense, robotics, and other high-spec applications as earlier, higher-margin opportunities before EV
      scale. That strategic framing fits the SEC and listing-release language around a capital-light, partner-led
      commercialization path. But as of Q1 2026 the only concrete economic signal is that receipts from joint
      development partners were recorded net against research and development expense, not that Factorial had begun
      recognizing product revenue. Public sources therefore support a mechanism story, not a proven revenue-quality
      story, and they leave pricing, realized ASPs, royalties, and contract economics unverified.
    claimRefs:
      - CI001
      - CI012
      - CI013
      - CI014
      - CI015
      - CI026
      - CI028
      - CI030
      - CI039
      - CI041
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: cost-structure-burn-and-unit-economics
    title: Cost Structure, Burn, and Unit-Economics Visibility
    body: >-
      Factorial's Q1 2026 filing gives enough to sketch a cost structure but not enough to underwrite product
      margins. Net loss was approximately $8.6 million and operating cash use was $6.1 million in the quarter.
      Research and development expense fell sharply year over year to about $1.9 million, but that decline was not a
      sign of mature efficiency; management says it was driven mainly by $3.4 million of receipts from joint
      development partners that were recorded net against R&D, plus the prior exit of the Methuen facility.
      General and administrative expense also fell year over year, mainly because stock-based compensation declined,
      even as legal, audit, and advisory costs rose ahead of public-company life. On a cash basis, the filing says
      operating outflows were payroll, materials, facilities, and professional services, while receivables under
      collaboration agreements rose $2.2 million and softened the cash draw. Public unit economics still stop there.
      There is no disclosed list pricing, gross margin, yield-based cost curve, customer acquisition analogue,
      or revenue-recognition detail sufficient to decide whether partner validation can translate into profitable
      commercialization.
    claimRefs:
      - CI002
      - CI003
      - CI015
      - CI016
      - CI017
      - CI024
      - CI039
      - CI041
    tableRefs:
      - TI003
