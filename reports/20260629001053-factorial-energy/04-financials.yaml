  - id: FI004
    title: Capital intensity / cash-flow map
    type: matrix
    layout: wide
    summary: >-
      Factorial's financial profile is best understood as a matrix of where scale-up cash is needed, what is publicly proven, and where
      financing risk still sits.
    data:
      columns:
        - Manufacturing footprint
        - Cash demand driver
        - Public evidence quality
        - Financing implication
      rows:
        - label: Existing U.S. and Korea line expansion
          values:
            - label: Defined
              tone: positive
              detail: >-
                Filings explicitly describe expansion of existing fabrication lines in South Korea and the United States.
            - label: Medium
              tone: warning
              detail: >-
                Cash demand is visible through $0.5M Q1 capex and ~$7.5M remaining-2026 capex guidance.
            - label: High
              tone: positive
              detail: >-
                This is directly described in the SEC MD&A with timing through end-2027.
            - label: Moderate
              tone: neutral
              detail: >-
                Manageable if partner-led scale works; harder if in-house capacity needs grow.
        - label: Partner-led scale-up beyond initial lines
          values:
            - label: Intended
              tone: positive
              detail: >-
                Management says demand growth should be served primarily through partner manufacturing.
            - label: Potentially lower
              tone: positive
              detail: >-
                Could reduce self-funded gigafactory capex versus peer approaches.
            - label: Medium
              tone: neutral
              detail: >-
                Public sources explain the strategy, but not the economics or partner obligations.
            - label: Execution risk
              tone: warning
              detail: >-
                If partners move slowly, Factorial may need more equity or debt than currently planned.
        - label: Public-company overhead and controls remediation
          values:
            - label: Immediate
              tone: warning
              detail: >-
                Becoming public requires more accounting, legal, audit, insurance, and director-fee expense.
            - label: Rising
              tone: warning
              detail: >-
                Management expects additional annual public-company expenses plus about $0.8M of control-remediation cost.
            - label: High
              tone: positive
              detail: >-
                The filing directly describes the material weakness and remediation timeline through 2027.
            - label: Shorter runway
              tone: negative
              detail: >-
                Even without plant overspend, public-company costs should lift burn above the Q1 pre-close run rate.
        - label: Commercialization timing and yield risk
          values:
            - label: Unresolved
              tone: warning
              detail: >-
                Validation milestones exist, but binding high-volume commercial economics are not public.
            - label: Potentially high
              tone: negative
              detail: >-
                Delays can force more spending on engineering, working capital, and partner support before revenue.
            - label: Medium
              tone: neutral
              detail: >-
                Industry and company sources describe the challenge, but not current yield or price realization.
            - label: Most likely trigger for new capital
              tone: negative
              detail: >-
                This is the main path by which Factorial could exhaust current cash earlier than guided.
    approximationNotes: >-
      Qualitative matrix built from filing disclosures, partner-manufacturing claims, and peer context. It is intended to show where the cash
      burden sits rather than to quantify each burden precisely.
    claimRefs:
      - CI019
      - CI020
      - CI021
      - CI025
      - CI026
