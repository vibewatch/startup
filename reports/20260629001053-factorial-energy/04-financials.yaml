  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-gap
      missingEvidence: Realized pricing, royalty schedules, and customer-specific commercial terms for each disclosed revenue lane.
      whyItMatters: Without price and contract data, revenue quality and gross-profit potential cannot be underwritten.
      diligencePath: Obtain executed OEM and partner contracts, invoice samples, and pricing approval materials.
      relatedQuestionRefs: [QI003]
      relatedTableRefs: [TI002, TI005]
    - type: private-evidence-only
      severity: material
      topic: debt-gap
      missingEvidence: Full schedule of debt, equipment finance, guarantees, liens, or manufacturing-capacity prepayment obligations.
      whyItMatters: Hidden financing or vendor commitments could shorten runway far faster than the headline cash balance suggests.
      diligencePath: Request the complete debt schedule, board materials on financing strategy, and all material manufacturing or supply commitments.
      relatedQuestionRefs: [QI016]
      relatedTableRefs: [TI004, TI005]
    - type: private-evidence-only
      severity: material
      topic: collaboration-economics
      missingEvidence: Contract-level explanation of the $3.4M partner receipts netted against R&D and the $2.2M receivable increase under collaboration agreements.
      whyItMatters: These items may materially change the underlying cost structure and commercialization economics if they are reimbursements rather than recurring revenue.
      diligencePath: Review collaboration agreements, accounting memos, quarter-end receivables aging, and cash collections after March 31, 2026.
      relatedQuestionRefs: [QI024]
      relatedTableRefs: [TI001, TI003, TI005]
    - type: stale
      severity: material
      topic: post-close-burn
      missingEvidence: Q2 2026 post-close cash balance, quarterly burn, and updated capex cadence after one full public quarter.
      whyItMatters: Q1 2026 was largely a pre-close quarter, so it likely understates recurring public-company and scale-up spending.
      diligencePath: Review the expected August 2026 quarterly filing or earnings materials immediately when released.
      relatedQuestionRefs: [QI025]
      relatedTableRefs: [TI004, TI005]
    - type: private-evidence-only
      severity: material
      topic: gross-margin-gap
      missingEvidence: Pilot-line and expected first-commercial gross margin, including yield, scrap, materials, and labor assumptions.
      whyItMatters: The entire capital-light thesis depends on whether partner-led scale can deliver positive contribution economics.
      diligencePath: Request pilot-line P&L, yield history, and management's margin bridge by commercialization phase.
      relatedQuestionRefs: [QI003, QI021]
      relatedTableRefs: [TI003, TI005]
