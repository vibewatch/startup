      - CI037
      - CI038

callouts:
  - calloutType: insight
    title: De-SPAC proceeds fixed liquidity, not disclosure depth
    body: >-
      The June 2026 listing materially improved cash, but it did not solve the core underwriting gap: public sources still do not show
      realized pricing, margins, or partner contract economics.
    claimRefs:
      - CI005
      - CI007
      - CI039
  - calloutType: risk
    title: Heavy redemptions reduced the trust contribution
    body: >-
      More than 23 million SPAC shares were redeemed for about $240 million, so usable post-close capital depended much more on PIPE support
      than on legacy trust cash.
    claimRefs:
      - CI008
      - CI009

