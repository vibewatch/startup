tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit / commercial trigger
      - Current value / status
      - Revenue quality
      - Diligence ask
    rows:
      - - Joint development partner receipts
        - Partner reimbursements recorded net against R&D expense rather than disclosed product revenue
        - Collaboration milestones and cost-sharing arrangements
        - $3.4M receipts from joint development partners in Q1 2026; no revenue recognized to date
        - Medium at best — shows partner engagement but not standalone recurring revenue
        - Provide the underlying contracts, accounting treatment, and whether any amounts will convert to recognized revenue
      - - Development / service revenue
        - Engineering, validation, and development services for partners
        - Program milestones or service statements of work
        - Presented as a future business-model lane; no public realized revenue disclosed
        - Unproven — concept disclosed, unit economics absent
        - Break out historical and forecast service revenue by partner and milestone
      - - Technology license / royalty revenue
        - Licensing of battery IP and manufacturing know-how
        - Royalty rate, volume trigger, and field-of-use definitions
        - Shown in investor presentation; no public contract economics disclosed
        - Unproven — attractive if real, but no evidence of realization yet
        - Disclose license structure, minimums, and audit rights
      - - Material supply revenue
        - Sale of electrolyte or related battery materials into partner manufacturing networks
        - Price per unit and validated production qualification
        - Shown in investor presentation; no public pricing or volume disclosed
        - Unproven — possible bridge between IP and cell sales, but unsupported publicly
        - Provide material BOM economics, yield, and supply agreement terms
      - - Manufacturing / battery-cell sales
        - Sale of finished cells through expanded pilot lines and partner-led production
        - Qualified production volumes with OEM partners
        - Future lane only; Q1 2026 filing still says no revenue to date
        - Lowest current visibility — depends on qualification, scale, and pricing
        - Provide launch customers, contracted volumes, and gross-margin targets
    notes: >-
      Public sources support a planned four-lane monetization model but only one current economic signal: joint-development receipts
      recorded net against R&D. The filings do not disclose recognized product revenue, royalty terms, or realized ASPs.
    claimRefs:
      - CI001
      - CI012
      - CI013
      - CI014
      - CI015
      - CI039
      - CI041
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Product / lane
      - Public price or unit
      - What is actually disclosed
      - Key caveat
      - Best next diligence step
    rows:
      - - Automotive solid-state cells
        - Not publicly disclosed
        - Performance data and partner validation are disclosed; commercial pricing is not
        - No list price, contract price, or revenue-per-kWh in public sources
        - Request partner term sheets and sample commercial quotes
      - - Development / service work
        - Not publicly disclosed
        - Only model category in the investor deck; no signed-value disclosure
        - Could be milestone-based, reimbursable, or partly netted against R&D
        - Reconcile receipts from partners to executed work scopes and invoices
      - - Technology license / royalty
        - Not publicly disclosed
        - Investor presentation names the lane but not rates, floors, or timing
        - Could be strategically important yet currently impossible to model
        - Obtain licensing framework, royalty stack, and IP field-of-use boundaries
      - - Material supply
        - Not publicly disclosed
        - Investor deck lists material supply as a lane; public contracts not disclosed
        - No evidence on contribution margin or who bears working capital burden
        - Request sample supply agreements, payment terms, and yield assumptions
      - - Collaboration reimbursements
        - $3.4M partner receipts in Q1 2026
        - Filing says receipts from joint development partners are recorded net in R&D expense
        - This is a reimbursement signal, not disclosed recurring pricing
        - Request accounting memo and partner-by-partner reimbursement schedule
    notes: >-
      This is intentionally a disclosure table, not a pricing table in the conventional sense. Public sources reveal almost no monetary terms,
      so the most accurate presentation is what remains undisclosed and why that blocks underwriting.
    claimRefs:
      - CI012
      - CI014
      - CI015
      - CI039
      - CI041
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Public value / proxy
      - Confidence
      - Why it matters
      - Exact diligence ask
    rows:
      - - Q1 2026 net loss
        - $8.6M
        - high
        - Baseline measure of current expense load before meaningful commercialization
        - Reconcile to cash burn by functional area and stock-based or non-cash items
      - - Q1 2026 operating cash use
        - $6.1M
        - high
        - Best direct cash-burn signal in public filing
        - Provide monthly bridge by payroll, materials, facilities, and external services
      - - Q1 2026 R&D expense
        - $1.9M
        - high
        - Appears light for a battery company unless partner receipts are understood
        - Break out gross R&D spend before partner offsets and facility reallocations
      - - Q1 2026 partner receipts netted against R&D
        - $3.4M
        - high
        - Critical for distinguishing underlying R&D intensity from reimbursed spend
        - Show gross-vs-net R&D presentation and associated contracts
      - - Receivables under collaboration agreements change
        - +$2.2M in Q1 2026
        - medium
        - Suggests commercialization-adjacent partner activity without enough accounting context
        - Explain whether receivables relate to reimbursable engineering, milestones, or other items
      - - Q1 2026 paid capex
        - $0.5M
        - high
        - Indicates expansion has started but is still in early cash-use phase
        - Provide detailed capex ledger by Korea line, U.S. line, and tooling category
      - - Remaining 2026 capex guidance
        - ~$7.5M
        - medium
        - Signals a coming burn step-up versus Q1 run rate
        - Provide month-by-month capex schedule and vendor commitments
      - - Gross margin
        - Not publicly disclosed
        - low
        - Core determinant of whether validation can turn into durable economics
        - Provide pilot-line gross margin and target margin at first commercial scale
      - - Realized price / ASP
        - Not publicly disclosed
        - low
        - Required to convert battery-performance claims into revenue quality
        - Provide price per cell, per kWh, and any service or royalty overlays
    notes: >-
      The filing is rich on loss, burn, and planned capex, but poor on realized commercial economics. Null-style disclosure gaps are explicit
      because public sources do not support gross margin, ASP, or yield-based unit-cost inference.
    claimRefs:
      - CI002
      - CI003
      - CI015
      - CI017
      - CI018
      - CI024
      - CI039
      - CI041
  - id: TI004
    title: Capital adequacy table
    columns:
      - Metric
      - Value / status
      - Source lens
      - Why it matters
      - Diligence ask
    rows:
      - - Cash and cash equivalents at March 31, 2026
        - $25.5M
        - SEC MD&A
        - Shows how thin liquidity was before the listing close
        - Confirm minimum operating cash threshold management considered acceptable
      - - Cash and cash equivalents on June 10, 2026
        - ~$116.6M
        - SEC MD&A after close
        - Best post-close liquidity anchor for runway assessment
        - Confirm whether this excludes or includes restricted cash and remaining fees
      - - Net cash increase from business combination
        - ~$92.0M
        - SEC MD&A
        - Quantifies how much usable cash the transaction actually added
        - Reconcile this figure to pro forma tables and bank balances
      - - Gross transaction proceeds
        - ~$112.1M
        - 8-K / listing release / MD&A
        - Headline source of fresh capital
        - Break out trust, PIPE, and any note-conversion-related cash contributions
      - - Actual-redemptions trust proceeds
        - $47.379M
        - Pro forma transaction table
        - Shows how much SPAC trust cash survived redemptions
        - Confirm final trust release and interest treatment at close
      - - Actual-redemptions PIPE proceeds
        - $64.681M gross
        - Pro forma transaction table
        - Shows how much of the usable funding came from the PIPE instead of the trust
        - Confirm whether any shares were effectively discounted through sponsor transfers
      - - Shareholder redemptions
        - 23,051,313 shares; ~$240.1M redeemed
        - 8-K / pro forma
        - Redemptions explain why trust contribution was modest
        - Provide final redemption waterfall including NRA-share effects
      - - Q1 2026 financing activity before close
        - $4.3M received in Q1; $5.4M received by June 10 from convertible notes
        - MD&A
        - Shows pre-close bridge financing and note conversion dependence
        - Share note terms, discount, maturity, and investor identities
      - - Remaining 2026 capex
        - ~$7.5M expected after Q1
        - MD&A
        - Indicates line-expansion cash demand still ahead
        - Provide capex schedule, vendor contracts, and cancellation flexibility
      - - Runway guidance
        - At least 12 months; into Q1 2028 on current plan
        - MD&A
        - Management's official view is much more conservative than a static Q1 burn extrapolation
        - Provide board-approved base, upside, and downside cash plans
      - - Debt / project finance obligations
        - No public facility disclosed beyond converted Jan-2026 notes
        - Public filings and IR materials
        - Important because undisclosed vendor financing or project obligations could shorten runway
        - Confirm all debt, guarantees, liens, and manufacturing-capacity prepayment commitments
    notes: >-
      The capital story is a de-SPAC-plus-PIPE story, not a trust-rich SPAC story. Heavy redemptions left trust cash relatively small, so
      post-close liquidity depends heavily on PIPE support and on management's ability to keep scale-up more capital-light than peers.
