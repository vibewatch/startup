      - FI002
  - id: capital-adequacy-and-de-spac-cash-bridge
    title: Capital Adequacy, De-SPAC Proceeds, and Near-Term Runway
    body: >-
      The core financial event is the June 2026 de-SPAC close. Factorial reported $25.5 million of cash and cash
      equivalents at March 31, 2026 and approximately $116.6 million on June 10, 2026 after closing. Management
      attributes the change to a roughly $92.0 million net increase in cash, built from about $112.1 million of
      gross proceeds and about $21.1 million of closing expenses. The capital raise came despite heavy redemptions:
      23.1 million CGC Class A shares were redeemed for roughly $240.1 million, leaving only 4.55 million public
      shares not redeemed, including 3.47 million non-redemption-agreement shares bought by PIPE investors. The pro
      forma transaction table shows the actual-redemptions case more explicitly as $47.4 million of trust cash,
      $64.7 million of PIPE cash, and $21.4 million of cash transaction expenses. This makes the post-close balance
      meaningful but not lavish, especially because management expects burn to rise materially, expects about
      $7.5 million of remaining 2026 capex after the $0.5 million spent in Q1, and still reserves the right to seek
      additional equity or debt if commercialization, supplier, or regulatory timelines slip.
