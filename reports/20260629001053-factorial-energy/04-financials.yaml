  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing metric or disclosure
      - Why it matters
      - Current public signal
      - Exact diligence path
    rows:
      - - Realized cell pricing, service pricing, and royalty rates
        - Without actual price points, no top-down revenue model can be trusted
        - Public materials describe revenue lanes but disclose no monetary terms
        - Obtain executed OEM and partner contracts, invoices, and pricing schedules
      - - Gross margin and underlying cost stack
        - Battery underwriting depends on yield, materials cost, and scrap assumptions
        - No public gross margin, COGS, or yield curve is disclosed
        - Request pilot-line P&L, bill of materials, yield history, and margin bridge
      - - Collaboration accounting and receivables detail
        - Netting receipts against R&D can mask the true cost structure if not unpacked
        - Filing cites $3.4M partner receipts and +$2.2M receivables under collaboration agreements
        - Review accounting memo, partner contracts, and quarter-end receivables aging
      - - Debt, guarantees, and project-finance obligations
        - Hidden obligations can consume more cash than headline burn suggests
        - Public record only clearly discloses Jan 2026 convertible notes that converted at close
        - Request full debt schedule, liens, guarantees, equipment leases, and vendor-finance agreements
      - - Post-close Q2 2026 cash and burn
        - Q1 pre-close burn understates the cost of being newly public and scaling lines
        - Company said it expects to report Q2 2026 results on or about August 13, 2026
        - Review Q2 2026 financial statements and board cash forecast after the first full public quarter
      - - Commercial launch volumes and contracted customer commitments
        - Demand validation is not the same as bankable revenue visibility
        - Partner and demo milestones are public, but binding commercial volumes are not
        - Obtain demand forecasts, launch schedules, volume commitments, and cancellation terms by customer
    notes: >-
      These are not incidental omissions. They are the core missing disclosures that separate a technically validated battery company from an
      underwritable financial model.
    claimRefs:
      - CI014
      - CI030
      - CI039
      - CI040
      - CI041
      - CI042

figures:
  - id: FI001
    title: Revenue model bridge
    type: flow
    layout: wide
    summary: >-
      Factorial has disclosed a multi-lane monetization plan, but the bridge still runs from partner-funded development toward future
      commercial sales rather than from current recognized revenue toward stable gross profit.
    data:
      nodes:
        - id: validation
          label: OEM validation and joint development programs
          detail: >-
            Mercedes, Stellantis, Karma, and other partners validate demand and create commercialization pathways, but they do not yet
            prove scaled revenue.
          tone: positive
        - id: reimbursements
          label: Partner receipts netted against R&D
          detail: >-
            The clearest current economic signal is $3.4M of joint-development-partner receipts recorded net against R&D in Q1 2026.
          tone: neutral
        - id: planned_lanes
          label: Planned monetization lanes
          detail: >-
            Investor materials list development/service revenue, technology license or royalty revenue, material supply revenue,
            and manufacturing or cell sales.
          tone: positive
        - id: zero_revenue
          label: No recognized revenue to date
          detail: >-
            The SEC MD&A still says Factorial had no revenue to date at March 31, 2026.
          tone: warning
        - id: unknown_profit
          label: Gross profit and ASP unknown
          detail: >-
            Public sources do not disclose price, gross margin, or realized unit economics for any lane.
          tone: negative
      edges:
        - from: validation
          to: reimbursements
        - from: validation
          to: planned_lanes
        - from: reimbursements
          to: zero_revenue
        - from: planned_lanes
          to: zero_revenue
        - from: zero_revenue
          to: unknown_profit
    approximationNotes: >-
      Mechanism figure only. It distinguishes current partner-funded activity from future revenue lanes; it does not imply that any listed lane
      is already commercial or profitable.
    claimRefs:
      - CI001
      - CI012
      - CI013
      - CI015
      - CI030
      - CI039
      - CI041
  - id: FI002
    title: Unit economics bridge
    type: flow
    layout: wide
    summary: >-
      Public evidence supports a clear spending path from engineering work to scale-up, but the bridge breaks before price and gross
      margin become visible.
    data:
      nodes:
        - id: r_and_d_base
          label: Engineering and validation spend
          detail: >-
            Cash operating use is driven by payroll, materials, facilities, and professional services while products remain pre-revenue.
          tone: neutral
        - id: partner_offsets
          label: Partner reimbursements and collaboration receivables
          detail: >-
            Q1 2026 included $3.4M of partner receipts netted against R&D and a $2.2M increase in collaboration receivables.
          tone: positive
        - id: capex_stepup
          label: Capex and pilot-line expansion
          detail: >-
            Q1 paid capex was only $0.5M, but management expects another ~$7.5M during the remainder of 2026.
          tone: warning
        - id: commercialization
          label: Partner-led commercial scale-up
          detail: >-
            Management plans to expand U.S. and Korea lines for initial production, then scale mainly through partner manufacturing.
          tone: positive
        - id: margin_gap
          label: Missing ASP and gross-margin layer
          detail: >-
            No public price, gross margin, or yield curve lets investors convert technical milestones into unit economics.
          tone: negative
      edges:
        - from: r_and_d_base
          to: partner_offsets
        - from: partner_offsets
          to: capex_stepup
        - from: capex_stepup
          to: commercialization
        - from: commercialization
          to: margin_gap
    approximationNotes: >-
      Uses disclosed cash-flow and capex facts plus management's stated commercialization path. The figure intentionally stops at the margin
      layer because public data does.
    claimRefs:
      - CI003
      - CI015
      - CI017
      - CI018
      - CI019
      - CI024
      - CI039
      - CI041
  - id: FI003
    title: Financial estimate range
    type: range
    layout: wide
    summary: >-
      The relevant numeric range is not revenue but funding capacity: pre-close cash, post-close cash, near-term capex, and the spread
      between a static burn extrapolation and management's more conservative runway guidance.
    data:
      items:
        - label: Quarter-end cash before de-SPAC close
          low: 25.5
          high: 25.5
          displayValue: $25.5M
          detail: >-
            Cash and cash equivalents as of March 31, 2026 per the SEC MD&A.
          tone: warning
        - label: Post-close cash on June 10, 2026
          low: 116.6
          high: 116.6
          displayValue: ~$116.6M
          detail: >-
            Cash and cash equivalents after the business combination closed.
          tone: positive
        - label: Remaining 2026 capex guidance
          low: 7.5
          high: 7.5
          displayValue: ~$7.5M
          detail: >-
            Management's expected capital expenditures for the remainder of 2026 after the $0.5M paid in Q1.
          tone: neutral
        - label: Transaction-cost lens
          low: 21.1
          high: 22.1
          displayValue: ~$21.1M–$22.1M
          detail: >-
            MD&A summarized approximately $21.1M of closing expenses, while the pro forma actual-redemptions model used about $22.1M.
          tone: warning
        - label: Runway lens — management guide vs static Q1 burn
          low: 21
          high: 57
