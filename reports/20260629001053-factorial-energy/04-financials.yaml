          detail: >-
            Low end converts management's "into Q1 2028" runway from the June 10, 2026 filing date into roughly 21 months. High end
            annualizes Q1 operating cash use only and therefore overstates runway if burn steps up as management expects.
          tone: warning
    approximationNotes: >-
      All values are sourced from Q1 2026 filings except the runway-month conversion, which is an estimated translation of management's
      stated timeline and a simple annualization of Q1 operating cash use. Amounts are USD millions except runway months.
    claimRefs:
