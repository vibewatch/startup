  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 技术放大和可制造性风险
        blocks:
          - type: paragraph
            body: >-
              Factorial 的核心风险已经不再是汽车伙伴是否看好这套化学体系，而是公司能否在时间、资金和竞争对手时间表追上之前，把这套化学体系工业化。公开证据链仍明显偏向 FEST 和伙伴验证，而不是 Solstice
              生产。Mercedes 和 Stellantis 说明 Factorial 已经从实验室电芯跨到整车级测试，但更新的 Solstice 平台仍被公开描述为 A 样阶段项目，采用 40 Ah
              规格，并押注更高上限的干法正极制造故事。它有前景，但还不能兑现。公司自己给出的最清晰可制造性信号是良率：Factorial 称试点良率从约 10% 提升到约
              85%。但即便按公司口径，千兆工厂经济性也不止需要良率。独立行业评论更不宽容，强调真正的全固态体系仍要跨过界面、压力和制造集成障碍，高批量商业化很可能推迟到近期炒作周期之后。承销含义是，技术风险已经从电化学可信度，转向可重复的过程控制、成本、报废率和吞吐量。
