  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 当前公开估值接近上市基准，因为战略期权价值抵消了收入前现实；但稀释和时点风险让建议维持在跟踪。
    data:
      nodes:
        - id: n1
          label: 合作伙伴证明已存在
          detail: Mercedes、Stellantis、Karma、PowerCo 让战略选择权还活着
          tone: positive
        - id: n2
          label: 尚未产生收入
          detail: 至今没有收入；也没有公开定价或利润率数据
          tone: negative
        - id: n3
          label: 现金有限
          detail: 交易后约 ~$116.6M，计划资金只够支撑运营到 2028 年 Q1
          tone: negative
        - id: n4
          label: 稀释压力
          detail: 认股权证、期权、RSU、登记权和分阶段锁定安排都要纳入判断
          tone: negative
        - id: n5
          label: 同业参照
          detail: 相对 SLDP 和 SES 有估值溢价，相对 QS 有折价
          tone: neutral
        - id: n6
          label: DCF 支撑不足
          detail: 公开输入太薄，撑不起精确公允价值
          tone: negative
        - id: n7
          label: 建议：跟踪 / 估值偏紧
          detail: 先看单位经济性和合同转化，再考虑上调评级
          tone: neutral
    approximationNotes: 流程图把决策链简化为影响估值的驱动因素；它不是完整投资备忘录。
    claimRefs:
