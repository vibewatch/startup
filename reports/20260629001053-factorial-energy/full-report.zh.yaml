            body: >-
              Factorial 可见客户宇宙狭窄、技术性强、由项目驱动，而不是广泛交易型。公开文件首先指向全球汽车
              OEM，其次是更小的一组细分车辆项目和无人机系统集成商。这很重要，因为多数关系里买方、用户和付款方不是同一个人。可能的买方是先进电池负责人、CTO
              组织和车辆项目高管，他们控制评估预算并提名供应商。日常用户是工程、验证和 pack 集成团队，他们要让新化学体系在真实车辆或无人机电池包里跑起来。最终付款方会是 OEM
              采购或系统集成商采购职能，但前提是技术验证转化为量产订单。这一区分是尽调核心。初创公司可以在用户层面有很强互动，却仍缺少把共同开发项目转化为经常性收入的采购转化。Factorial
              公开材料还显示，非汽车需求真实到足以纳入判断，尤其是在无人机和机器人里；但这条路径阶段更早，经济性也比汽车路径更不透明。
