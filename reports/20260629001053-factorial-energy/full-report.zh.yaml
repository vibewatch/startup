  - id: FU001
    title: 客户旅程图
    type: journey-map
    layout: wide
    summary: Factorial 的客户路径通常始于战略对齐和技术评估，再向验证和采购转化攀升。
    data:
      nodes:
        - id: strategic-alignment
          label: 战略对齐
          detail: 投资、JDA 或合作协议建立关系
        - id: sample-delivery
          label: 样品交付
          detail: 电芯从实验室主张进入评估硬件或 B-samples
        - id: engineering-validation
          label: 工程验证
          detail: 开展实验室测试、电池包架构工作和里程碑核验
        - id: vehicle-or-pack-integration
          label: 车辆或电池包集成
          detail: 电芯被集成进真实车辆或无人机电池包
        - id: public-road-or-flight-proof
          label: 公开道路或飞行验证
          detail: 真实世界测试开始，外部受众可以检查进展
        - id: procurement-conversion-gap
          label: 采购转化缺口
          detail: 公开记录仍需要价格、产量、期限和经常性收入证明
