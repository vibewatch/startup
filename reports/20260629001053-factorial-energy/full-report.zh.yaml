  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集与技术架构
        blocks:
          - type: paragraph
            body: >-
              Factorial 应同时放在两类竞争者面前比较。第一类是直接的固态或锂金属开发商：QuantumScape、Solid Power、SES AI 和
              ProLogium。第二类是战略性既有厂商和内部自建替代方案，它们能占用同一批 OEM 项目名额：Toyota 与 Idemitsu、PPES，Honda，Samsung SDI，以及规模化锂离子既有厂商
              CATL。放在这个集合里，Factorial 自身定位异常宽。它不只把固态电池卖给 eMobility，也面向国防、航空航天、AI
              机器人和数据中心工作负载；同时仍主张其制造路径可借助合作伙伴扩展，而不是完全自有的 gigafactory 栈。相对这个集合，架构分化很关键。QuantumScape 是以 QSE-5 和 Cobra
              制造隔膜为中心的锂金属隔膜平台。Solid Power 本质上是围绕硫化物固态电解质搭建的电解质和 IP 公司。SES AI 仍把锂金属 EV 部署描述为技术上可能、商业上不确定。Toyota 和
              Idemitsu 正推进硫化物电解质生产，为之后的 OEM 发布做准备；Samsung SDI 则推进无负极全固态设计。CATL
              不是化学体系最接近的对手，却是最重要的替代品，因为买方可以继续按工业规模采购快速改进的液态电解质电池。ProLogium 另成一类，声称拥有可量产的全无机固态架构并已有多年出货。结论是，Factorial
              的竞争不只是一个化学标签，而是能否比初创公司和既有厂商更好地组合车企验证、可制造性和时点。
