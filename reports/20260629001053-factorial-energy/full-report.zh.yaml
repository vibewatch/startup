  - id: TV005
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        Selected June 2026 public battery peers with directly observable market-cap pages and recent liquidity or
        revenue disclosures; chosen for valuation framing rather than exhaustive category coverage.
    columns:
      - 可比对象
      - 公开估值 / 指标
      - 最新流动性或收入锚点
      - 相关性
      - 主要限制
    rows:
      - - Factorial Energy
        - 市值 ~$1.22B；~107.0M 股；收入约为 0
        - 交割后现金 ~$116.6M；跑道延伸至 2028 年 Q1
        - 直接研究对象；显示市场已为合作伙伴背书的期权价值支付多少
        - 除烧钱和时间表外，公开经济性信息非常有限
      - - QuantumScape
        - 市值 ~$4.40B
        - 现金、现金等价物及有价证券 ~$904.7M
        - 最接近的公开高溢价固态电池基准，流动性深得多
        - 规模不同，公开历史更长，工业化细节披露更多
      - - Solid Power
        - 市值 ~$582.7M
        - 流动性 ~$435.3M，2026 年 Q1 收入 $3.1M
        - 有参考价值的轻资产美国同业，拥有 OEM 关系和部分收入
        - 仍未规模化，估值只略高于流动性
      - - SES AI
        - 市值 ~$332.2M
        - 流动性 ~$178M，2026 年收入指引 $30M 至 $35M
        - 说明即便已有收入的电池公司，交易价格仍可能远低于 Factorial
        - 产品组合不同，AI / ESS 组合降低直接可比性
      - - De-SPAC 基准
        - 上市时公开股权框架约 ~$1.3B；向存续股东支付的合并对价 $1.1B
        - 总募集 ~$112.1M；23.1M 股出现高额赎回
        - 表明今天的公开价值相对交易框架并未大幅降级
        - SPAC 基准是谈判产物，不是经营市场可比公司
    notes: 对比重点放在估值相对流动性和商业化证明上，因为对基本无收入的电池公司，EV/revenue 和 DCF 方法都很弱。
