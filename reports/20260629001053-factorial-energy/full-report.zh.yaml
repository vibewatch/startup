            body: >-
              可制造性是这个故事真正的摆动因素。Factorial 自身材料反复强调与现有生产系统兼容，但更有信息量的是公司谈及合作伙伴、工艺工程和良率的频率。Philenergy MOU
              明确显示外部生产基础设施属于扩产策略的一部分，并点名 Factorial 认为关键的具体制造能力：激光切口、精密堆叠、卷绕和智能装配。公司的良率博客说得更进一步，称试点良率从 10% 提升到约
              85%，并主张良率才是真正的商业准备度指标。但这个数字仍由公司自行发布，并未经合作伙伴或监管文件公开审计。Gammatron
              也嵌在同一个工业化故事里。它不只是研究点缀，而是被定位为数字孪生和可追溯层，帮助缩短验证周期、调校充电协议，并监测生产链上的工艺偏差。产品技术结论是，Factorial
              不只想靠电解质化学取胜，也想靠工艺控制和合作伙伴编排取胜。
