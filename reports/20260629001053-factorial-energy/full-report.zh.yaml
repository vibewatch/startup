  - id: FI001
    title: 收入模型桥
    type: flow
    layout: wide
    summary: Factorial 披露了多条变现路径，但这座桥仍是从合作伙伴资助的开发走向未来商业销售，而不是从当前已确认收入走向稳定毛利。
    data:
      nodes:
        - id: validation
          label: OEM 验证与联合开发项目
          detail: Mercedes、Stellantis、Karma 等合作伙伴验证需求，也搭出商业化路径，但还不能证明规模化收入。
          tone: positive
        - id: reimbursements
          label: 合作伙伴款项冲减研发
          detail: 当前最清晰的经济信号，是 2026 年 Q1 有 $3.4M 联合开发合作伙伴款项冲减研发费用。
          tone: neutral
        - id: planned_lanes
          label: 计划中的变现路径
          detail: 投资者材料列出开发 / 服务收入、技术许可或 royalty 收入、材料供应收入，以及制造或电芯销售。
          tone: positive
        - id: zero_revenue
          label: 至今未确认收入
          detail: SEC MD&A 仍称，截至 2026 年 3 月 31 日，Factorial 尚无收入。
          tone: warning
        - id: unknown_profit
          label: 毛利与 ASP 未知
          detail: 公开来源没有披露任何路径的价格、毛利率或已实现单位经济性。
          tone: negative
      edges:
        - from: validation
          to: reimbursements
        - from: validation
          to: planned_lanes
        - from: reimbursements
          to: zero_revenue
        - from: planned_lanes
          to: zero_revenue
        - from: zero_revenue
          to: unknown_profit
    approximationNotes: 仅为机制图。它区分当前由合作伙伴资助的活动与未来收入路径；并不意味着列出的任何路径已经商业化或盈利。
