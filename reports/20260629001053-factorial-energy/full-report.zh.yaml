      - number: '7.2'
        title: 伙伴集中、合同深度和项目延误风险
        blocks:
          - type: paragraph
            body: >-
              Factorial 的伙伴名单亮眼，但也很集中。Mercedes、Stellantis、Hyundai/Kia、PowerCo、Philenergy 和 Karma
              承担了公开证据的大部分重量。集中度很重要，因为多数可见关系仍围绕开发、验证、里程碑或工作说明书搭建，而不是已披露的最低采购义务。PowerCo JDA
              尤其说明问题：它是一份带里程碑、交付物、付款和终止权的合同；后续任何供货关系都取决于技术成功和未来协议。Karma 给出了更具体的上市叙事，但该项目也指向 2027 年末，并且承认在 Factorial
              介入前曾经延期。无人机、机器人等专业垂直场景扩大了覆盖面，但还不能抵消对少数汽车或战略制造伙伴的依赖。因此，投资者应把这里的客户集中度理解为项目集中和伙伴执行集中，而不是收入集中，因为仍没有披露可供分散的经常性收入基础。
