      - number: '5.2'
        title: FEST 与 Solstice 架构对比
        blocks:
          - type: paragraph
            body: >-
              最重要的技术区别在于 Factorial 当前已验证的 FEST 平台和更新的 Solstice 平台。公开证据显示，FEST 是验证记录最清晰的准固态或锂金属化学体系家族：Stellantis 公布
              77Ah、375 Wh/kg、超过 600 次循环、18 分钟内从 15% 充至 90%，并可在 -30°C 至 45°C 运行；Mercedes 则把 Factorial 锂金属电芯装进基于 EQS
              的测试车，上了公开道路。相比之下，Solstice 被营销为全固态继任者。公司公告称其基于硫化物，目标最高 450 Wh/kg、能量密度最高提升 80%，并在 90°C
              以上保持运行稳定；干法阴极或干法涂布工艺意在降低制造能耗和溶剂使用。因此，本章把 FEST 视为当前公开证明引擎，把 Solstice
              视为回报更高但独立验证更少的架构。这一区分是尽调核心，因为公司上行叙事越来越指向 Solstice，而最可支撑的验证仍指向 FEST。
