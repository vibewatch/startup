      - number: '3.3'
        title: 制造路径、资本强度与商业化时点
        blocks:
          - type: paragraph
            body: >-
              最大竞争分野不是实验室结果，而是背后的制造模式。Factorial 正试图通过合作伙伴制造和资本轻的公开市场叙事完成工业化。这降低了直接 capex 压力，但也意味着一旦资质认证拉长或 OEM 重新排序，公司比
              Toyota、Honda、Samsung 或 CATL 更缺少缓冲。QuantumScape 也在走向合作伙伴牵头路径，依靠 PowerCo 里程碑资金和许可产出权，而不是独立建设第一座工厂。Solid
              Power 更明确：它想通过硫化物电解质、工艺 IP 和合作伙伴产线变现，而不是成为高产量成品电芯制造商。相反，Honda 已在示范线上投入约 ¥43 billion；Toyota 与 PPES
              相关的下一代生产从 2026 年开始，年产 9 GWh；Samsung SDI 运营 S-Line 试点线，目标 2027 年量产；CATL 已有 772 GWh 全球产能，另有 321 GWh
              在建。ProLogium 声称走中间路线：仍像初创公司，但拥有 Taoyuan GWh 级产线、出货记录和从 2028 年底开始爬坡的 Dunkirk
              建设。上述差异决定商业化时点。如果合作伙伴产线完成转化，Factorial 看起来足够早，有机会拿下高端车型发布名额；但其披露的资产负债表纵深不如 Solid
              Power，更远低于亚洲既有厂商的工业冗余。因此，资本强度是实际竞争问题，而不只是财务脚注。
