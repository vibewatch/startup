    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 高端 / 性能乘用 EV 固态电芯
        - 高端或性能 EV 项目中的电芯、模块和电池包支出；续航、快充、安全或重量可以支撑化学体系切换
        - 大众市场商品化 BEV 电池包、车队商品化采购、多数 PHEV / REEV 电池包
        - 豪华和性能 OEM 电池、整车及采购团队
        - Factorial 式技术最清晰的早期汽车楔子
      - - OEM 示范车队和验证车辆
        - 工程验证电芯、电池包集成工作、开发车辆和小批量试点采购
        - SOP 前或规模化采购前的零售车辆需求
        - OEM 工程、产品规划和验证预算
        - 技术证明与合同化生产项目之间的桥
      - - 防务 / UAV / 机器人高规格电池
        - 任务关键电芯和电池包；重量、低温运行、高功率或续航影响异常大
        - 商品化消费无人机电芯和通用工业电池
        - 系统集成商、项目办公室和工业机器人 OEM
        - 性能可压过最低成本化学体系的相邻场景
      - - 超大规模数据中心 / 固定储能相邻场景
        - 高规格储能模块；安全、占地、正常运行时间或能量密度可能影响下一代能源系统
        - 以最低成本 LFP 系统为核心的广泛商品化电网储能采购
        - Hyperscaler、储能开发商和基础设施能源团队
        - 真实相邻场景，但公开商业证据仍薄
      - - 制造赋能层
        - 让固态可融资所需的工艺工程、产线复用、模块集成和生产伙伴能力
        - 与固态商业化无关的原生采矿、商品正极销售和通用电池设备支出
        - 电芯开发商加 OEM 或制造伙伴 capex 负责人
        - 关键所在，因为采用既取决于电芯性能，也取决于可制造性
    notes: 本表把 Factorial 的市场定义为更广泛电池需求中的性能受限楔子；排除类别明确列出，以免读者把宽泛 EV TAM 误认为公司近期 SAM。
