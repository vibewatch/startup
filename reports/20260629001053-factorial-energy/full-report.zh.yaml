      - - 国防 / UAV 集成商
        - 系统集成商或任务项目买方
        - 飞行员、操作员、自主系统
        - 项目办公室或集成商 P&L
        - 台架测试 -> 平台集成 -> 野外验证
        - 任务系统和采购负责人
        - 重量、高度、低温和航程优势
      - - 工业机器人 / 移动系统
        - 机器人 OEM 或工业集成商
        - 机器人平台和运营团队
        - 制造或自动化预算负责人
        - 模块适配 -> 工况循环测试 -> 现场部署
        - 自动化 / 工业系统负责人
        - 更高工况循环或更轻移动平台
      - - 超大规模数据中心 / 固定式储能
        - 储能开发商或 hyperscaler 能源团队
        - 电力管理和设施运营方
        - 基础设施 / 能源资本开支负责人
        - 储能系统设计 -> 安全审查 -> 站点集成
        - 能源和基础设施负责人
        - 安全性、占地、在线率或长时储能经济性
    notes: 在这个市场里，买方、用户和付款方往往不是同一方。公开来源能更清楚地指出应用切入点和试点项目，但很少交代精确商业条款或预算规模。
