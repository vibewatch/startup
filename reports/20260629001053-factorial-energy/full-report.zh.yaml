      - number: '4.3'
        title: 资本充足性、de-SPAC 募资与近期 runway
        blocks:
          - type: paragraph
            body: >-
              核心财务事件是 2026 年 6 月 de-SPAC 交割。Factorial 报告 2026 年 3 月 31 日现金及现金等价物为 $25.5 million，2026 年 6 月 10 日交割后约
              $116.6 million。管理层把变化归因于约 $92.0 million 净现金增加，由约 $112.1 million 总募集资金和约 $21.1 million
              交割费用构成。此次融资发生在大规模赎回之下：23.1 million 股 CGC Class A 股票被赎回，金额约 $240.1 million，仅剩 4.55 million 股公众股未赎回，其中包括
              PIPE 投资者购买的 3.47 million 股非赎回协议股份。备考交易表更明确地显示实际赎回情形：$47.4 million 信托现金、$64.7 million PIPE 现金，以及 $21.4
              million 现金交易费用。因此，交割后余额有意义但不宽裕，尤其是管理层预计 burn 将显著上升，2026 年剩余 capex 约 $7.5 million（Q1 已花 $0.5
              million），并仍保留在商业化、供应商或监管时间线滑坡时寻求额外股权或债务融资的权利。
