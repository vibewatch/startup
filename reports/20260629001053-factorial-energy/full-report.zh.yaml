          low: 7.5
          high: 7.5
          displayValue: ~$7.5M
          detail: Q1 已支付 $0.5M 后，管理层预计 2026 年余下时间的资本支出。
          tone: neutral
        - label: 交易成本视角
          low: 21.1
          high: 22.1
          displayValue: ~$21.1M–$22.1M
          detail: MD&A 概述的交割费用约为 $21.1M，而 pro forma 实际赎回模型使用约 $22.1M。
          tone: warning
        - label: Runway 视角——管理层指引 vs 静态 Q1 烧钱
          low: 21
          high: 57
          displayValue: ~21-57 months
          detail: 低端把管理层「延续到 2028 年 Q1」的 runway，从 2026 年 6 月 10 日申报日折算为约 21 个月。高端仅将 Q1 经营现金消耗年化，因此如果烧钱如管理层预期上台阶，会高估 runway。
          tone: warning
    approximationNotes: 除 runway 月数换算外，所有数值均来自 2026 年 Q1 申报文件；runway 月数是对管理层所述时间线的估算翻译，并对 Q1 经营现金消耗做简单年化。除 runway 月数外，金额均为百万美元。
