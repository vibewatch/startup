      - number: '7.3'
        title: 市场采用延迟和竞争追赶风险
        blocks:
          - type: paragraph
            body: >-
              Factorial 最危险的外部风险是，公司推进工业化时，其他玩家并没有停下。TrendForce 将 2025–2026 年描述为工程验证阶段，并称日本和韩国玩家在试点规模验证上略微领先。Honda
              已经建成示范生产线，用来验证量产方法。Toyota 和 Idemitsu 继续公开谈论 2027–2028 年商业化，以及硫化物固态电解质的量产工作。Solid Power
              虽然采用不同商业模式，但仍展现出更深的流动性和跨洲工业足迹。在这一背景下，Factorial 的混合 FEST
              路径有助于近期可制造性，但也意味着公司必须在同行缩小性能差距，或凭更清晰的工业规模反超之前，把验证转化为合同。独立的 2026 年评论更直白：准固态体系可能先于真正全固态电池落地，而后者的高批量商业化可能偏向
              2030 年代初。如果品类采用速度慢于当前叙事，Factorial 的溢价时点假设和公开市场倍数，可能在技术被证伪之前就先被压缩。
