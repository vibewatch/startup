            body: 本章避免 DCF 精确度，因为公开来源没有按商业通道披露价格、上市量、毛利率或 capex 节奏。牛、基准、熊三档明确是分析区间，由已披露流动性、同业估值和里程碑时点搭建。
            calloutType: assumption
            claimRefs:
              - CV037
              - CV038
              - CV039
              - CV040
              - CV041
          - type: callout
            title: 战略期权价值真实存在，但普通股捕获取决于条件
            body: Mercedes、Stellantis、Karma 和 PowerCo 围绕商业化创造了真实期权价值，但只有当上市时点改善快过解禁供给、烧钱和稀释扩张时，上行空间才会到达普通股股东手里。
            calloutType: insight
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV043
          - type: callout
            title: 跟踪——只有经济性披露或价格更好时才上调
            body: 该股值得监测，因为对一家收入前电池公司来说，其技术和伙伴进展并不常见；但当前估值证据太轻，不足以买入。上调需要披露商业经济性、更清晰的稀释可见度，以及更好地证明 2027 年时点不只是叙事。
            calloutType: recommendation
            claimRefs:
              - CV021
              - CV042
              - CV044
