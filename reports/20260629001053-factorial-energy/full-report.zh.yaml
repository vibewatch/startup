            body: >-
              主要技术风险在于固态电芯的承诺还必须经受 pack
              层面的现实。独立来源仍清楚指出，堆叠压力、界面电阻、更高运行温度需求、湿气敏感性、耐久性开裂和新的安全标准需求，都可能在单个电芯指标看起来强劲时仍拖慢商业化。Toyota 仍把耐久性列为核心挑战；Honda
              试点线也说明量产前必须解决大量工艺工程问题。Factorial 确实有真实质量信号：OEM 相关验证、工艺工程招聘增加，以及公司声称 Gammatron
              改善可追溯性和循环寿命优化。但公开记录仍达不到承销级尽调文件所需水平。没有公开披露 pack
              压力目标、外部滥用测试报告、认证状态、保修阈值、经审计产线经济性，或商业定价和销量条款。这些遗漏不抹掉技术进展，但意味着工程风险负担仍大幅开放，尤其是在 Solstice
