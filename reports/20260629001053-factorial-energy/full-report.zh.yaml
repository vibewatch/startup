  - id: TV006
    title: 论点破裂与终止触发表
    columns:
      - 触发项
      - 观察阈值
      - 对投资论点的传导
      - 行动含义
    rows:
      - - 商业化时间滑坡
        - 关键 OEM 或 Karma 时间表从 2027 年底滑向 2028 年以后，且没有更深合同来抵消
        - 期权价值衰减快于当前公开估值反映
        - 将估值立场下调至昂贵 / 回避
      - - 烧钱恶化或现金指引缩短
        - 证据显示交割后烧钱显著高于 Q1 基线，或跑道不再能撑到 2028 年 Q1
        - 迫使更早融资，并加重稀释风险
        - 在情景中假设下轮降价或后续股权压力
      - - 解锁 / 转售压力开始咬人
        - 注册和锁定窗口打开后，出现有意义的内部人或 PIPE 转售活动
        - 即便技术里程碑继续推进，公开市场也可能压住上行空间
        - 增加敞口前要求更大的入场折价
      - - 没有有约束力的商业经济性
        - 后续合作伙伴里程碑之后，仍没有定价、版税或最低采购量承诺
        - 估值停留在期权空间，而不是可承销空间
        - 维持跟踪 / 继续研究，而不是买入
      - - 合作伙伴证据反转
        - Mercedes、Stellantis、PowerCo 或 Karma 路径被推迟、缩窄或终止
        - 抽掉溢价倍数的核心战略理由
        - 视为投资论点破裂，而非普通执行波动
    notes: 这些触发项面向公开市场跟踪，直接对应估值压缩机制，而不是泛泛的运营评论。
    claimRefs:
      - CV015
      - CV020
      - CV034
      - CV035
      - CV036
      - CV043
  - id: TV007
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 商业合同经济性
        - 按合作伙伴项目列出的定价、版税、最低采购量和付款条款
        - 没有这些，就无法搭出可防守的 DCF 或 EV/revenue 桥
        - 要求提供已签署条款清单、JDA 修订和首批商业供货草案
      - - 更新后的烧钱和 capex
        - 交割后月度现金桥、capex 计划和情景下行案例
        - 今天驱动估值的更多是跑道和稀释风险，而不是收入
        - 要求提供董事会批准的运营计划和月度资金包
      - - 完全稀释股本表
        - 按持有人列示权证、期权、RSU、注册权和锁定期安排
        - 普通股最终实现回报取决于供给和稀释时点
        - 要求提供交割后股本表和出售限制矩阵
      - - OEM 转化证据
        - 有约束力的授标函、产能预留或项目付款计划
        - 能把战略期权价值转化为可承销需求
        - 要求提供合作伙伴侧信函或已签署量产里程碑
      - - 制造经济性
        - 按产线列示良率、报废率、每 kWh 成本和贡献利润率假设
        - 需要用它区分技术胜利和经济胜利
        - 要求提供工厂级 KPI 材料和按产品线拆分的利润率桥
    notes: 这些问题是从情景框架推进到基于证据承销公允价值所需的最低材料包。
    claimRefs:
      - CV037
      - CV042
      - CV044
