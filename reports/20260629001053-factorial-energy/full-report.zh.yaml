      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              领导层延续性是公开记录中最强的已验证事实之一。Siyu Huang 和 Alex Yu 都可追溯到 Lionano，这家前身业务由两人在 2013 年至 2019 年运营；两人自 2019 年 8
              月起均在董事会任职。Huang 自 2020 年 1 月起担任 CEO；Yu 则从早期 CEO 转为总裁，再转任 CTO，让创始人在商业和技术方向上继续掌控。上市后，公众能看到更多公司治理细节。Richard
              Wei 在先担任公司顾问后，于 2025 年 12 月加入担任 CFO，这与文件披露中 Factorial 为满足上市公司要求而扩充财务人员的说法一致。董事会还包括执行主席 Joe Taylor、来自
              Mercedes-Benz 电池开发的 Uwe Keller、Dieter Zetsche、Liad Meidar 和 Jon
              Nelson；委员会分工显示公司已建立正式的审计、薪酬、提名与治理结构。因此，治理图景强于许多私营电池初创公司，但仍集中在一对创始人夫妇和与车企关联的董事周围，关键人依赖和战略合作伙伴依赖仍是实际概览风险。
