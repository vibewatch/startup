            body: >-
              公开可比公司不能证明这里的公允价值，但能显示市场在奖励什么、拒绝承销什么。QuantumScape 市值约 $4.4 billion，截至 2026 年 3 月 31 日拥有约 $904.7 million
              的现金、现金等价物和有价证券，流动性缓冲远大于 Factorial。Solid Power 收盘市值约 $582.7 million，却报告总流动性 $435.3 million、Q1 收入 $3.1
              million；即便其模式更明确地轻资本，市场给出的估值也只比现金略高。SES AI 市值约 $332.2 million，流动性约 $178 million，并指引 2026 年收入 $30 million 至
              $35 million。Factorial 披露零收入，却在公开估值上高于 Solid Power 和 SES，说明市场买的是 Mercedes 路测、Stellantis 验证、Karma 2027
              年末时点和未来 PowerCo 转化所附带的战略期权价值，而不是当前经济性。该期权价值真实存在，但应放在情景框架里，而不是反推成虚假的 DCF
              精确度。因此，下方牛、基准、熊三档是分析括号，锚定当前市场定价、同业降级和已披露商业化时点，而不是受支撑的公允价值目标。
