  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代品
        blocks:
          - type: paragraph
            body: >-
              定义 Factorial 市场的最干净方式，不是“所有 EV 电池”，而是那些在大众商品市场之前就能为新化学体系付费的高端和性能导向电池项目。公开文件、技术页面和合作伙伴公告都持续把 Factorial
              放在高要求应用里：高端乘用 EV、开发车队、无人机、机器人、国防邻近系统，以及储能或 hyperscale 数据中心邻近场景。这个框架重要，是因为这些细分市场的采购逻辑不同于主流电池采购。豪华或性能 OEM
              如果电池能让车辆差异化，就可能为更好续航、充电、安全或热性能付费；无人机或机器人买家则可能最看重重量、高海拔性能或低温运行。相反，被排除的基准市场是大众市场锂离子采购；成熟 LFP 和 NMC
              供应链，尤其是以中国为中心的供应链，已经能以巨大规模提供低成本。除这些既有化学体系外，插电混动和增程方案也属于现状替代品，因为它们会整体降低电池容量需求。因此，本章把 Factorial
              的真实市场视为更大电池需求中的一个受性能约束的切口。
