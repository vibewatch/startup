  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品平台与客户工作流
        blocks:
          - type: paragraph
            body: >-
              Factorial 的公开产品定义不只是单一固态电芯 SKU。2026 年，公司展示了三项有名称的资产：FEST® 是目前已获验证、正进入 OEM 认证流程的电池平台；Solstice™
              是上限更高的全固态架构；Gammatron™ 是用于加速开发的数据和仿真层。这很重要，因为真实客户工作流不是“从货架上买一块电池”。OEM 和集成商客户会与 Factorial
              及其合作伙伴一起经历联合开发、样品评估、pack 集成、验证，最终走向制造扩产。因此，工作流既是产品，也是工程服务和工业化 playbook。公开材料还显示，Factorial 有意把用户地图从高端乘用 EV
              扩到无人机、机器人、国防邻近系统和未来消费电子用例。把它看作一个组合化学体系、验证数据和合作伙伴牵头部署的平台栈，而不是成熟商业电池项目目录时，产品论点最强。
