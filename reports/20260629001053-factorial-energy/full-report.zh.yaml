  - id: FI002
    title: 单位经济性桥
    type: flow
    layout: wide
    summary: 公开证据支撑一条清晰的支出路径：从工程工作走向扩产；但这座桥在价格和毛利率可见之前就断开了。
    data:
      nodes:
        - id: r_and_d_base
          label: 工程与验证支出
          detail: 产品仍处于收入前阶段，现金经营支出主要由薪酬、材料、设施和专业服务驱动。
          tone: neutral
        - id: partner_offsets
          label: 合作伙伴报销与协作应收款
          detail: 2026 年 Q1 包括 $3.4M 合作伙伴款项冲减研发，以及协作应收款增加 $2.2M。
          tone: positive
        - id: capex_stepup
          label: 资本开支与试产线扩张
          detail: Q1 已支付资本开支仅 $0.5M，但管理层预计 2026 年余下时间还要支出约 $7.5M。
          tone: warning
        - id: commercialization
          label: 合作伙伴主导的商业化扩产
          detail: 管理层计划扩建美国和韩国产线用于初始生产，随后主要靠合作伙伴制造来放大规模。
          tone: positive
        - id: margin_gap
          label: 缺失 ASP 与毛利率层
