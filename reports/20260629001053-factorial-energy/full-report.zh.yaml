      - number: '2.4'
        title: 采用约束、制造摩擦与份额获取风险
        blocks:
          - type: paragraph
            body: >-
              这个市场里最强的反证不是需求崩塌，而是商业化摩擦。DOE 仍把电池成功框定在最终低于 $100/kWh 并走向 $80/kWh、300 英里续航和 15
              分钟充电，因此固态电池要对抗的是持续移动的既有基准，而不是固定靶子。BNEF 称电池仍是 EV 主要成本项，中国保有制造和供应链成本优势，主要欧洲市场 BEV 相比同级 ICE 车辆仍有 17%
              价格溢价。Honda 的示范线专门用来验证成本和量产方法；BMW 和 Solid Power 则表示，要让全固态电芯在完整储能系统中具备竞争力，还需要进一步开发。IEEE Spectrum
              更直白：商业化目标可能继续后移，因为把化学体系放大所需时间，可能远长于实验室或试点公告所暗示的时间。合在一起看，证据表明固态电池可能先在高端或任务关键细分市场赢得份额；但如果改良锂离子化学体系继续降本，并对多数买方已经足够好，本十年内的大范围份额获取远非确定。
