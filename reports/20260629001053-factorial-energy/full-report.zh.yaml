  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开市场价值和收入前现实
        blocks:
          - type: paragraph
            body: >-
              估值的起点是，Factorial 已经上市，流动性足以每日标价，但本质上仍处于收入前阶段。Yahoo Finance 和 Stock Analysis 都显示，FAC 在 2026 年 6 月 26 日收于
              $11.42，流通股约 107.0 million 股，股权市值约 $1.22 billion。这只比公司在 Nasdaq 上市时采用的约 $1.3 billion 股权口径略低，尽管截至 2026 年 3 月
              31 日的财务记录仍显示迄今无收入、季度净亏损 $8.6 million、经营现金消耗 $6.1 million。管理层还表示，交割后资本计划只为运营提供资金到 2028 年 Q1。按公司披露的交割后约
              $116.6 million 现金计算，公开市场实际上在尚无定价、毛利率或系列生产需求证明前，就把经营业务估在约 $1.10 billion 至 $1.11 billion。这意味着估值无法用传统
              EV/revenue 或 DCF 方法支撑。当前报价更应理解为市场对商业化时点和战略伙伴转化期权价值给出的出清价格。
