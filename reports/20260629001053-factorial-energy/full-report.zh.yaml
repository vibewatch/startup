      - number: '2.3'
        title: 买方、用户、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              Factorial 的买方地图较分散，这也是市场必须谨慎定义的另一原因。在汽车领域，买方通常是 OEM
              的电池、整车平台或采购组织；用户是工程团队加上最终驾驶者；付款方是产品规划和供应链预算负责人，他们为差异化、合规与毛利取舍背书。在无人机、机器人和国防邻近系统中，买方更可能是系统集成商或项目负责人，用户是机器或操作员，付款方只在任务收益清楚时容忍更高电芯成本。在固定式储能和数据中心邻近场景中，买方和付款方转向能源、基础设施或储能开发团队，他们关心安全、密度和运营经济性。所有这些细分市场的采用通常遵循分阶段路径：电芯验证、pack
              集成、道路或现场测试、低量高端部署，之后只有在制造成本、良率和可靠性收敛时才进入更大规模。这一顺序解释了为什么高端 OEM 和特种平台常成为下一代电池的第一批商业验证场。
