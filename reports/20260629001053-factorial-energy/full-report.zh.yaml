      - number: '7.4'
        title: 治理、资金 runway 和稀释风险
        blocks:
          - type: paragraph
            body: >-
              尽管已经在 Nasdaq 上市，Factorial
              的财务和治理画像仍像一家初创公司。公司仍处于收入前阶段，仍在烧钱，仍依赖外部资本和伙伴进展，而不是内部产生的经营现金流。业务合并显著改善了流动性，但管理层自己的计划只把运营资金覆盖到 2028
              年第一季度，并假设当前经营计划不变。对一家固态电池公司来说，余量很薄：若上市项目滑期、试点或工艺扩张需要更多
              capex，或上市公司成本快于预期上升，都会吃掉缓冲。已披露的重大缺陷因此不是脚注，而是真实的风险放大器。披露控制薄弱会拖慢融资、增加伙伴尽调难度，并在开发阶段公司最需要信任时削弱投资者信心。联合开发伙伴付款被冲减
              R&D 费用，而不是确认为产品收入，也传递同一信息：商业化在经济上仍未被证明。主要融资风险不是马上破产，而是在公司仍需证明制造可重复性和合同化需求时，未来发生稀释。
