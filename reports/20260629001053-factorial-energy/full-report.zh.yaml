      - number: '4.4'
        title: 财务结论、同业参照与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              可投资的结论不是 Factorial 通过上市解决了融资问题，而是公司给自己买了时间。相对公开固态同业，Factorial 现在的资金状况明显好于交割前，但财务火力仍显著小于 Solid Power 或
              QuantumScape。Solid Power 在 2026 年 Q1 末有 $435.3 million 流动性，季度 capex 仅 $1.7 million；QuantumScape 即便录得约
              $100.8 million 季度净亏损和 $10.0 million 设备支出，仍持有约 $904.7 million 现金和有价证券。同业参照很关键，因为 Factorial
              正以小得多的现金垫推进相似的扩产目标，尽管其合作伙伴牵头制造模式所需自筹工厂投资应低于完全内部自建。反向视角同样重要：近期行业评论认为，真正高产量固态商业化更可能发生在 2030 年代初，而不是 2020
              年代末，因为制造集成仍未解决。叠加 Factorial 已披露的重大缺陷、缺失的定价和利润率数据，以及 de-SPAC 后当前季度 burn 没有公开可见度，财务结论是有希望，但没有更深数据室之前仍无法承销。
