  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动因素 / 约束
      - 方向
      - 时间
      - 含义
      - 尽调追问
    rows:
      - - 全球 EV 销量增长、电动化占比上升
        - 正向
        - 近到长期
        - 扩大高端固态可承接增长的整体电池背景
        - 哪些高端或性能细分市场真的受电池约束，足以切换化学体系？
      - - 固定式储能需求增长
        - 正向
        - 中期
        - 即便乘用 EV 仍是主要切入点，数据中心和储能邻近市场也能提供支撑
        - 除叙事定位外，Factorial 是否已有具名储能客户、集成商或设计定点？
      - - 高端 OEM 需要续航和快充差异化
        - 正向
        - 近期
        - 豪华或性能车型先落地，比立即进入大众市场更可信
        - 哪些车型项目已有绑定里程碑、产量和上市闸门？
      - - 现有锂离子设备可能复用
        - 正向
        - 近期
        - 若产线兼容性真实成立，可降低资本开支冲击
        - 经过完整工业认证和良率目标后，产线复用比例还能剩多少？
      - - 既有电池成本下降、中国规模优势
        - 负向
        - 当前
        - 除非固态既更好又可融资，否则主流买方更难切换
        - 按车型项目看，高端 OEM 能承受多高的交付电池包成本溢价？
      - - 制造良率、压力控制和电芯膨胀管理
        - 负向
        - 当前
        - 原型成功不等于系统经济性有竞争力
        - 试点线良率、吞吐、报废率和压力管理要求是多少？
      - - 电池尺寸优化以及 PHEV / REEV 组合迁移
        - 负向
        - 近期
        - 电池包变小，会压缩需要昂贵下一代电芯的需求占比
        - 目标客户需求中，有多少来自大型高端 BEV，而不是小电池混动车？
      - - 缺少从试点到 SOP 的公开产量、ASP 和转化率
        - 负向
        - 当前
        - 市场头条无法干净转化为 SOM 和收入
        - 要求管理层按客户提供产量爬坡、ASP 和转化假设
    notes: 同一个市场可以在增长，但固态新进入者仍很难赢。本表把需求扩张和化学体系选择摩擦拆开，并列出弥合差距所需的私有数据。
