              最难回答的客户问题，公开材料仍没有给出答案。Factorial
              的申报文件、伙伴公告和二级报道里程碑很多，变现细节很少。本章保留的资料没有披露合同金额、最低采购承诺、续约日期、照付不议机制、按收入计算的客户集中度、NRR、GRR、流失率，或按账户划分的质保和现场退货表现。PowerCo
              协议尤其有参考价值，因为它把结构说清楚了：这是一份围绕开发、测试、里程碑和技术演示样件的联合开发协议。它能证明工业侧认可，但不是公开采购订单。SEC 文件里 Hyundai/Kia 的表述也是同一性质；即便
              Mercedes 和 Stellantis 证据最强，仍然落在验证、校准和工业化进展框架里。因此，反向解读很简单，也很关键：JDA 和项目可能是未来收入的必要前提，但本身不能证明经常性收入。Smartcarz
              把风险说得很直接：决定 Factorial 会成为突破性领导者，还是又一家有前景的先驱，关键不是实验室成功，而是制造规模。这一结论与公开客户档案吻合。
