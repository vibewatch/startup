      - number: '1.3'
        title: 资本结构与财务位置
        blocks:
          - type: paragraph
            body: >-
              最清楚的资本事件是 2026 年 6 月与 Cartesian Growth Corporation III 的合并。公司和 SEC 材料一致显示，该交易隐含约 $1.3 billion 股权价值，并带来超过
              $100 million 总募集资金；MD&A 给出了更精确的桥接：$112.1 million 总 PIPE 融资、约 $21.1 million 交易费用，相比 2026 年 3 月 31
              日资产负债表，净现金增加约 $92.0 million。同一批文件也揭示了上市故事背后的近期财务现实。Factorial 至今没有收入，季度净亏损约 $8.6 million，一季度经营活动耗用现金约 $6.1
              million，截至 2026 年 3 月 31 日累计亏损约 $264.2 million。季末现金及现金等价物约 $25.5 million，交割后约 $116.6
              million。管理层还披露财务报告内部控制存在重大缺陷，并预计整改工作将持续到 2027 年。公开来源仍无法确认的是历次私募融资的确切累计金额、合并后的持股比例，以及合作伙伴和制造协议的经济条款。
