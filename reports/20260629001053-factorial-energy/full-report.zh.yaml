        - 公司网站称拥有全球最大试点线；既有大型电池业务基础
        - BMW / Solid Power 评估，加高端 EV 电池业务
        - 独立客户、良率和产量细节仍少
      - - CATL
        - 既有替代者
        - 先进锂离子、钠离子、双动力和储能系统
