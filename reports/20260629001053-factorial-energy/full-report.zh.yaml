      - number: '2.2'
        title: 规模测算视角与电池需求增长
        blocks:
          - type: paragraph
            body: >-
              自上而下看，需求增长真实存在，但这个口径太宽，不能当作 Factorial 的即时市场。BloombergNEF 预计 2026 年乘用 EV 销量为 23.3 million 辆，占新车销量 27%，到
              2035 年乘用车销量中超过一半将是电动车。RMI 也概括近期展望称，2025 年超过四分之一汽车销量将转为电动车；ICCT 则表示，已宣布的电池产能到 2030 年仍高于预期 EV
              需求，按已宣布口径可覆盖美国国内需求的 130%。这些事实说明电池大背景庞大且在增长，但也意味着整体市场增长本身并不能保证新化学体系拿到份额。更好的测算方法是分层：广义 TAM 是全球 EV
              和固定式储能电池需求；更窄的 SAM 是高性能车辆和特种应用需求，在这些场景中，续航、充电时间、重量或热韧性足以支撑溢价；初始 SOM
              则是能够容忍试点量和学习曲线成本的高端车型发布、示范车队和特种部署子集。公开来源没有给出这个切口的独立美元规模，因此本章保留多个视角，而不是强行合成一个 TAM 数字。
