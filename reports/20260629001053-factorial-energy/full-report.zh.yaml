      - number: '8.2'
        title: 稀释、认股权证和解禁压力
        blocks:
          - type: paragraph
            body: >-
              下一个估值问题不只是公司值多少钱，而是资本结构打开后，普通股股东实际能留住多少价值。交割 8-K 和委托书 / 招股书显示，实际赎回情形下流通股为 107,023,245 股，另有 13.8 million
              份行权价 $11.50 的公众认股权证、6.8 million 份私募认股权证，以及 19.6 million 份期权和 5.1 million 份 RSU。若全部认股权证行权，Factorial
              会收到有用的总现金，但基本股数仍将上升约 19%；加入期权和 RSU 后，基本加奖励股本约 152.4 million 股，比基本股本高约 42%。悬顶压力不只是数字。公司同意为约 80.6 million 股
              Series A 股份进行转售登记，约占交割后已发行且流通 Series A 股份的 88.1%。锁定期分层释放——180 天释放 25%，270 天释放 25%，一年释放 50%——若 20 日 VWAP 达到
              $12、$14 和 $16，可提前释放。FAC 收盘只略低于第一个 $12 门槛，因此任何温和重估都可能加速供给，而不只是奖励现有持有人。任何情景分析都应给出执行折价。
