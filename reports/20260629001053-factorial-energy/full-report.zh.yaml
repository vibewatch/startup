    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              到 2026 年，Factorial 将自己定位为一家在美国大波士顿地区创立、现已登陆 Nasdaq 的固态电池开发商。一级文件中最精确的注册地址是 Massachusetts 州 Billerica 的 805
              Middlesex Turnpike；投资者关系首页以及多份公司和合作伙伴公告仍使用“greater Boston area”或“U.S.-headquartered”等更宽泛说法。这足以确立公司当前的
              Massachusetts 身份，但不足以证明一条单一且从未中断的总部叙事，因为较早的合作伙伴材料也曾称 Factorial 位于 Woburn。产品身份比公司沿革更清楚。技术页面把平台组合集中在
              FEST、Solstice 和 Gammatron；2026 年 6 月上市材料则描述了一条围绕联合制造伙伴展开的商业化策略，而不是披露自筹资金建设 gigafactory 的计划。财务阶段也很明确：SEC
              材料称，截至 2026 年 3 月 31 日，Factorial 至今没有收入，仍是无收入的开发阶段公司。因此，概览应把这家公司视为技术上已获验证、但商业化仍未被证明。
