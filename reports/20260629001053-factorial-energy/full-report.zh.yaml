      - number: '2.5'
        title: 规模测算缺口及其对估值的重要性
        blocks:
          - type: paragraph
            body: >-
              主要尽调问题不是市场太小，而是 Factorial 能够最先实际变现的部分，比广义 EV
              或储能标题所暗示的要窄得多，也更难观察。公开来源显示需求确实增长、高端应用已有清楚证明点、相邻细分也有多个，但它们没有披露把这些证明点转化为可融资 SOM 所需的合同量、电芯
              ASP、试点到量产转化率或制造良率。这种不确定性直接影响估值。如果 Factorial 能把高端 OEM
              验证和特种细分转化为可重复的低量发布，同时保持较高产线复用率，市场切口可以快速扩张。否则，公司可能长期卡在试点项目里，而既有锂离子系统拿走大部分近期支出。因此，合适的分析姿态是保留彼此矛盾或不完整的规模测算视角，说明干净隔离
              TAM/SAM/SOM 不可得，并优先尽调定价、项目量和制造经济性，而不是假设广义 EV 增长会自动转化为固态份额。
