      - number: '3.2'
        title: 验证阶段、客户与项目证明
        blocks:
          - type: paragraph
            body: >-
              Factorial 最好的公开证据在汽车验证上强于规模。Stellantis 披露已验证 77 Ah FEST 电芯：375 Wh/kg、超过 600 次循环、18 分钟快充和宽温运行。Mercedes-Benz
              又进一步把 Factorial 电芯装进基于 EQS 的测试车，2025 年初开始道路测试，并在之后披露 Stuttgart 至 Malmö 的 1,205 km
              行驶。公开材料中，很少有同业项目能同时拿出汽车尺寸电芯数据和道路使用证据。QuantumScape 披露了 B1 样品出货、基于 Cobra 的隔膜和与 Ducati
              相关的车辆项目，但披露仍停在样品和试点线阶段。Solid Power 有 BMW 测试车证据，以及与 Samsung SDI 的三方评估结构，但其模式仍取决于合作伙伴把电解质和许可变成实际电芯。ProLogium
              的证明不同：公开出货数量、与 OEM 的样品历史，以及声称的 GWh 级产线。Toyota、Honda 和 Samsung
              的工业基础更深，但其公开证明仍被描述为试点线、内部开发或未来商业化窗口，而不是当前与初创伙伴绑定的公开道路验证包。SES AI 在这里落后，因为其自身文件仍警告锂金属 EV
              部署未经验证且可能延迟。客户证明上，Factorial 的名单真实存在；但竞争层面的启示是，合作伙伴名字不如每个项目在“电芯验证—车队使用—可重复生产”阶梯上的位置重要。
