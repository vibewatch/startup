      - number: '8.4'
        title: 建议以及会改变建议的条件
        blocks:
          - type: paragraph
            body: >-
              对价格敏感的结论是跟踪，而不是买入。Factorial 的技术和伙伴证据足以让它留在观察名单上，但公开经济性证据不足，不能把当前市值承销为便宜。买入判断需要今天尚未公开的证据：合同层面的定价或 royalty
              条款、交割后更新的烧钱和 capex 节奏、更清晰的完全稀释股本表，以及至少一条来自 OEM 或制造伙伴的有约束力商业采购量路径。反向来源强化了这一谨慎。TrendForce
              仍把行业置于工程验证阶段，Battery Technology Online 则认为，真正的高批量固态商业化更可能发生在 2030 年代初，而不是 2020 年代末。Zacks 和 AInvest 也把
              Factorial 描述为不如成熟上市同业被证明充分，并提示 SPAC
              结构的稀释机制。最干净的估值表述是：估值紧，但并非无趣。股票并非明显非理性，因为战略期权价值存在；但相对于当前已披露证据，它偏贵。如果时点滑期、锁定期后供给淹没需求，或烧钱上升却没有合同转化，投资逻辑就会破裂。
