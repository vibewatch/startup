  - id: FI004
    title: 资本强度 / 现金流地图
    type: matrix
    layout: wide
    summary: 理解 Factorial 的财务画像，最好看成一个矩阵：哪里需要扩产现金，什么已经公开证明，融资风险还停在哪里。
    data:
      columns:
        - 制造版图
        - 现金需求驱动项
        - 公开证据质量
        - 融资含义
      rows:
        - label: 现有美国与韩国产线扩张
          values:
            - label: 已定义
              tone: positive
              detail: 申报文件明确描述了在韩国和美国扩建现有制造产线。
            - label: 中
              tone: warning
              detail: 现金需求可通过 $0.5M Q1 资本开支和约 $7.5M 2026 年剩余资本开支指引看到。
            - label: 高
              tone: positive
              detail: SEC MD&A 直接描述了这一路径，时间延伸至 2027 年底。
            - label: 中等
              tone: neutral
              detail: 如果合作伙伴主导扩产跑通，压力可控；如果自有产能需求增加，难度会上升。
        - label: 初始产线之外的合作伙伴主导扩产
          values:
            - label: 计划中
              tone: positive
              detail: 管理层称，需求增长应主要由合作伙伴制造来承接。
            - label: 可能更低
              tone: positive
              detail: 相比同行路径，或可减少自筹资金建设 gigafactory 的资本开支。
            - label: 中
              tone: neutral
              detail: 公开来源解释了策略，但没有披露经济性或合作伙伴义务。
            - label: 执行风险
              tone: warning
              detail: 如果合作伙伴推进缓慢，Factorial 可能需要比当前计划更多的股权或债务融资。
        - label: 上市公司开销与控制整改
          values:
            - label: 立即发生
              tone: warning
              detail: 上市后需要更多会计、法律、审计、保险和董事费用。
            - label: 上升
              tone: warning
              detail: 管理层预计将增加年度上市公司费用，另有约 $0.8M 控制整改成本。
            - label: 高
              tone: positive
              detail: 申报文件直接描述了重大缺陷，以及延伸至 2027 年的整改时间线。
            - label: Runway 缩短
              tone: negative
              detail: 即便工厂没有超支，上市公司成本也会把烧钱率抬到 Q1 交割前水平之上。
        - label: 商业化时点与良率风险
          values:
            - label: 未解决
              tone: warning
              detail: 验证里程碑存在，但公开文件没有绑定的大批量商业经济性。
            - label: 可能较高
              tone: negative
              detail: 延迟会迫使公司在收入之前继续投入工程、营运资本和合作伙伴支持。
            - label: 中
              tone: neutral
              detail: 行业和公司来源描述了挑战，但没有披露当前良率或价格实现情况。
            - label: 最可能触发新资本
              tone: negative
              detail: 这是 Factorial 可能早于指引耗尽现有现金的主要路径。
    approximationNotes: 定性矩阵基于申报披露、合作伙伴制造说法和同行背景构建。它旨在展示现金负担落在哪里，而不是精确量化每项负担。
    claimRefs:
      - CI019
      - CI020
      - CI021
      - CI025
      - CI026
      - CI031
      - CI032
      - CI037
      - CI038
