        title: 法律和监管状态：公开悬而未决事项有限，合规义务真实存在
        blocks:
          - type: paragraph
            body: >-
              已审阅的 2026
              年公开材料没有指向明显的在审诉讼、召回或执法行动，也没有把这些作为定义性风险。这很重要，因为本章仍锚定运营、技术和商业执行，而不是编造法律戏剧。但看不到诉讼，不等于法律档案干净无风险。Factorial 的
              8-K 明确通过引用纳入招股书的法律程序章节，因此尽调仍需完整附表。更重要的是，公司真实的监管负担很实际，也很近：上市公司披露整改、跨境合同合规，以及锂电池运输规则。PowerCo
              合同把已发货材料的出口和海关责任分配给 Factorial；PHMSA 将锂电池视为危险材料，并要求设计通过 UN 38.3
              测试且运输文件合规。换句话说，今天的公开法律图景看起来可控，但执行仍可能被合规失误绊倒，尤其是样品运输和试点项目跨境放大时。因此，正确的法律结论是：「未发现明显公开行动，但有意义的合规管线仍然重要。」
