      - number: '1.4'
        title: 里程碑、验证与可见风险
        blocks:
          - type: paragraph
            body: >-
              Factorial 的里程碑记录在技术验证上强于商业收入。Mercedes-Benz 先在 2021 年宣布战略合作和投资，随后于 2025 年 2 月开始测试搭载 Factorial 电池的
              EQS，之后披露车辆一次充电从 Stuttgart 行驶到 Malmö，里程 1,205 公里。Stellantis 另行验证了 77Ah FEST 电芯：375 Wh/kg、超过 600 次循环、18 分钟从
              15% 充至 90%、可在零下 30 至 45 摄氏度运行；随后在 2026 年 6 月把电芯装入 Dodge Charger Daytona 开发车并开始道路测试。2026 年，路线图又通过
              Philenergy、IQT、POSCO Future M 和 Karma Automotive 扩展，显示公司由合作伙伴牵头推进制造、无人机与机器人，以及 2027
              年底美国乘用车项目。与此同时，公开记录仍有实质警示信号。公司尚无收入，公开来源无法验证当前员工数或商业客户数量，SEC 文件披露仍有活跃的重大缺陷。因此，本章支持的判断是：Factorial
              技术可信、战略连接较强，但商业风险尚未解除。
