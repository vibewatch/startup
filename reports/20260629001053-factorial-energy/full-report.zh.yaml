companyProfile:
  summary: >-
    Factorial Energy 是一家大波士顿地区固态电池开发商，2026 年 6 月通过与 Cartesian Growth Corporation III 合并上市。最强公开证据来自车企验证：Mercedes-Benz 已用
    Factorial 电池上路测试车辆，Stellantis 在把电芯装进 Dodge Charger Daytona 开发车之前，也公布了高性能 FEST 电芯数据。公司商业化路径不是完全自建 gigafactory，而是围绕
    FEST、高上限 Solstice 平台和 Gammatron 开发栈，由合作伙伴牵头推进。与此同时，截至 2026 年 3 月 31 日，Factorial 仍处于无收入阶段，披露了内部控制重大缺陷；de-SPAC
    交割后现金仅增至约 $116.6 million，商业化落地和稀释纪律仍是核心承销问题。
