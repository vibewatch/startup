        - 低到中等，因为公开证据仍偏里程碑、少见合同约束
        - 发布节奏滑坡，或解锁供给吃掉任何重估
      - - 基准
        - 现金跑道仍能撑到 2028 年，合作伙伴里程碑继续推进，2027 年发布叙事在缺乏硬收入证明下仍能维持
        - 股权价值 ~$1.0B 至 $1.3B，大致落在当前市场区间
        - 概率最高，因为它更需要运营延续，而不是突破
        - 市场最终要求更清晰的经济性，才愿意支付同样倍数
      - - 熊市
        - 商业化时间滑向 2030 年代初，公开市场下调无收入电池公司的估值，或稀释 / 出售压力压过需求
        - 股权价值 ~$0.5B 至 $0.8B，更接近现金加期权框架，而非成长溢价
        - 中等，因为反向来源已经质疑近期大批量时间表
        - 在有约束力的需求出现前，烧钱上升且后续融资到来
      - - 模型不支持的提示
        - DCF 或精确收入倍数目标需要价格、销量、利润率、capex 和合同输入，而公开记录并不包含这些信息
        - 情景区间是分析括号，不是公允价值目标
        - 确定
        - 虚假精确会夸大尽调信心
    notes: 所有情景区间都是以美元计的股权价值分析估计，基于当前市场定价、同业估值区间、已披露流动性和商业化时间。它们不应被解读为公司指引目标。
    claimRefs:
      - CV037
      - CV038
      - CV039
      - CV040
