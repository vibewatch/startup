      - number: '3.4'
        title: 切换成本、既有厂商压力与替代路径
        blocks:
          - type: paragraph
            body: >-
              即便 Factorial 的电芯指标保持强劲，买方也不会只因为能量密度就切换。独立技术来源称，真正的固态项目仍面临界面控制、堆叠压力、水分处理和 pack
              集成问题，这些都会改变整车层面的设计负担。这意味着切换成本不仅在电芯 BOM，也在认证工作、压缩策略、热管理、保修信心和供应保障。这有利于既有厂商和内部自建者。Toyota、Honda 和 Samsung
              可以在自家组织内迭代这些选择；CATL 可以持续改良传统锂离子和相邻化学体系，同时提供经验证的超大规模供应。因此，Factorial 竞争的不是一个真空市场，而是一个“足够好”的既有世界。QuantumScape
              和 Solid Power 也受益于大型合作伙伴渠道，ProLogium 则受益于公开的制造准备度叙事。替代风险在大众 EV 中尤其尖锐，因为 2020
              年代末的固态时间线会撞上快速改进的液态电解质电池。更可防守的早期切口仍是高端、性能或特种平台，在这些场景中，续航、重量、充电或任务剖面可以支撑额外集成工作。这个切口帮助
              Factorial，但也限制近期可服务份额，并让商业化时点暴露在 OEM 排期决策下。
