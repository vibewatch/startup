    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与变现现实
        blocks:
          - type: paragraph
            body: >-
              公开记录异常清楚地说明 Factorial 还不是什么：截至 2026 年 3 月 31
              日，公司至今没有收入，因此本章不应暗示管理层尚未披露的任何商业销售爬坡。记录显示的是一套计划中的变现架构，而不是已经实现的收入质量。2026 年 3
              月投资者演示材料描述了四条未来路径——开发和服务收入、技术许可或 royalty、材料供应收入，以及最终制造或电芯销售；同一份材料还把国防、机器人和其他高规格应用描述为早于 EV
              规模化、且毛利更高的机会。这一战略框架与 SEC 和上市公告中关于资本轻、合作伙伴牵头商业化路径的语言一致。但截至 2026 年 Q1，唯一具体经济信号是：来自联合开发伙伴的收款被净额冲减研发费用，而不是
              Factorial 已开始确认产品收入。公开来源因此支持的是机制故事，不是已验证的收入质量故事；定价、已实现 ASP、royalty 和合同经济性仍未验证。
