      - number: '3.5'
        title: Factorial 领先之处、落后之处，以及公开资料仍无法承销的内容
        blocks:
          - type: paragraph
            body: >-
              正面看，Factorial 在汽车证明上似乎好于 SES AI，道路验证也强于多数初创同业。它同时拥有 Stellantis 的实验室验证和 Mercedes-Benz
              的真实道路证据，这是本次比较中最清晰的公开示范包。相对 QuantumScape，Factorial 在当前车辆证明上更强，但在已披露隔膜工艺工业化和许可经济性上更弱。相对 Solid
              Power，Factorial 在直接车辆验证上更强，但披露流动性更弱；在 OEM logo 价值上也没那么差异化，因为 BMW、Samsung、PowerCo 和 Stellantis
              都说明合作关系可能保持非独家。相对 ProLogium，Factorial 的美国汽车故事更干净，但 ProLogium 的公开出货和产线历史叙事更强。相对 Toyota、Honda、Samsung 和
              CATL，Factorial 披露的制造规模和内部 capex 肌肉明显更少。最重要的未解缺口仍是商业层面：没有公开项目量、没有已实现良率、没有保修条款、没有电芯
              ASP，也看不到合作伙伴牵头扩产能否在高端细分之外保持成本竞争力。这些遗漏并不否定进展，但足以阻止得出一个干净结论：Factorial 当前技术领先已经能在工业规模上持久。
