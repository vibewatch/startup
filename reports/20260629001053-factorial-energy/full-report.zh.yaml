          label: 样品移交
          detail: Mercedes B-samples 和评估电芯进入 OEM 工作流
        - id: validated-cells
          label: 已验证电芯
          detail: Stellantis 77Ah FEST 指标跨过公开技术里程碑
        - id: integrated-platform
