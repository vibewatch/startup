company:
  name: Factorial Energy
chapter:
  number: 1
  title: Company Overview
  summary: Factorial Energy is a greater-Boston solid-state battery developer that became public in June 2026 via its merger with Cartesian Growth Corporation III. Public filings and partner announcements show strong automotive validation and a capital-light joint-manufacturing model, but they also show that the company remained pre-revenue at March 31, 2026, carried an accumulated deficit of about $264.2 million, and disclosed a material weakness in internal controls. Leadership continuity around co-founders Siyu Huang and Alex Yu is strong, while precise lifetime funding, current headcount, and commercial contract economics remain evidence gaps.
sections:
- id: identity-stage-and-business-model
  title: Identity, Stage, and Business Model
  body: 'Factorial presents itself in 2026 as a U.S. solid-state battery developer founded in the greater Boston area and now operating as a Nasdaq-listed public company. The most precise legal address in primary filings is 805 Middlesex Turnpike, Billerica, Massachusetts, while the investor-relations homepage and multiple company and partner releases still use broader wording such as “greater Boston area” or “U.S.-headquartered.” That is enough to establish the company’s current Massachusetts identity, but not enough to prove one single uninterrupted headquarters narrative because older partner materials also described Factorial as based in Woburn. Product identity is clearer than corporate chronology. The technology page centers the platform set on FEST, Solstice, and Gammatron, and the June 2026 public-listing materials describe a commercialization strategy built around joint manufacturing partnerships rather than a disclosed self-funded gigafactory buildout. The financial stage is also
    clear: SEC materials say Factorial had no revenue to date and remained a pre-revenue development-stage company as of March 31, 2026. That means the overview should treat the business as technically validated but still commercially unproven.'
