  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount-gap
    missingEvidence: An exact current employee count and site-by-site staffing split as of June 2026.
    whyItMatters: Headcount is a standard scale and burn-rate proxy for battery startups and affects commercialization readiness judgment.
    diligencePath: Request a current org chart or employee census from management and reconcile it against payroll or benefits records.
    relatedQuestionRefs:
    - QO021
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance-coverage-gap
    missingEvidence: Full public biographies and role coverage for every current director and committee member beyond the subset most material to chapter-one diligence.
    whyItMatters: The leadership table intentionally focuses on founders, finance leadership, and committee chairs, so a reader should not assume it is a complete board dossier.
    diligencePath: Pull the full board packet, committee charters, and any governance questionnaires to complete director-by-director coverage.
    relatedQuestionRefs:
    - QO007
    relatedTableRefs:
    - TO002
  - type: missing-source
    severity: material
    topic: capital-gap
    missingEvidence: A complete lifetime funding history and post-close ownership table covering legacy investors, PIPE investors, and strategic investors.
    whyItMatters: Without a full cap-table view, dilution, control, and remaining financing capacity cannot be underwritten precisely.
    diligencePath: Request the capitalization table, merger closing cap table, and any investor-rights summary from the data room.
    relatedQuestionRefs:
    - QO022
    - QO024
    relatedTableRefs:
    - TO003
  - type: conflicting-data
    severity: minor
    topic: headquarters-history
    missingEvidence: A clean chronology for company incorporation, rebranding, and headquarters moves from predecessor Lionano through current Factorial Energy Inc.
    whyItMatters: The overview can establish current Billerica identity, but not a perfect historical founding and location chain from public marketing sources alone.
    diligencePath: Request certificate-of-incorporation history, name-change records, and internal timeline materials covering Lionano to Factorial rebrand events.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
    - TO004
  - type: private-evidence-only
    severity: material
    topic: commercial-gap
    missingEvidence: Commercial contract economics, committed volumes, pricing terms, and launch gates for Mercedes, Stellantis, Karma, Philenergy, and other named partners.
    whyItMatters: Technical validation does not by itself prove future revenue, gross margin, or bankable production demand.
    diligencePath: Request signed JDA or supply-agreement summaries, milestone schedules, and revenue forecasts tied to each partner program.
    relatedQuestionRefs:
    - QO024
    - QO025
    relatedTableRefs:
    - TO003
    - TO004
  - type: private-evidence-only
    severity: material
    topic: commercial-gap
    missingEvidence: A dated commercialization plan showing when Factorial expects first material recurring revenue rather than pilot or development funding.
    whyItMatters: The company is public and pre-revenue, so timing to first meaningful revenue is central to runway and valuation assessment.
    diligencePath: Request the internal operating plan, customer milestone schedule, and 2026-2028 revenue bridge used by management and the board.
    relatedQuestionRefs:
    - QO025
    relatedTableRefs:
    - TO001
