- id: capital-structure-and-financial-position
  title: Capital Structure and Financial Position
  body: 'The clearest capital event is the June 2026 merger with Cartesian Growth Corporation III. Company and SEC materials align that the transaction implied about a $1.3 billion equity value and more than $100 million of gross proceeds, while the MD&A gives the more precise bridge: $112.1 million of gross PIPE financing, about $21.1 million of transaction expenses, and a resulting net cash increase of roughly $92.0 million versus the March 31, 2026 balance sheet. Those same filings establish the near-term financial reality behind the listing story. Factorial had no revenue to date, posted a quarterly net loss of about $8.6 million, used about $6.1 million of cash in operations in the first quarter, and had accumulated deficits of about $264.2 million by March 31, 2026. Cash and cash equivalents were about $25.5 million at quarter-end and about $116.6 million after the close. Management also disclosed a material weakness in internal control over financial reporting and expects remediation
    work to continue into 2027. What public sources still do not establish is exact lifetime capital raised across private rounds, ownership percentages after the merger, or the economics of partner and manufacturing agreements.'
