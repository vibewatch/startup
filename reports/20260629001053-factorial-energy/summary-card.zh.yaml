  topStrengths:
    - 在固态电池初创公司里，Factorial 的公开 OEM 验证更强，包括 Mercedes-Benz 路测和 Stellantis 电芯加整车里程碑。
    - 如果认证能转成量产，合作伙伴主导的制造策略可以比完全自建 gigafactory 少压资本。
    - 上市公司身份和交割后约 $116.6M 现金余额，让 Factorial 相比许多私有电池同行披露更多，也多一点近端融资弹性。
    - FEST 已经释放可信性能信号；Solstice 和 Gammatron 则在可制造性改善后拉高长期上行空间。
  topRisks:
    - 截至 2026 年 3 月 31 日，公司仍处于收入前阶段；公开客户验证还不等于签约经常性收入或承诺采购量。
    - 商业化风险仍高，最难的问题已经从电芯可信度转到可重复的制造良率、成本和产能。
    - 2026 年 6 月上市改善了流动性，但按当前计划只够支撑运营到约 2028 年 Q1，产品延误或 capex 上行的缓冲很薄。
    - 认股权证、期权、RSU、转售登记权和分阶段 lock-up 释放，在当前报价附近形成实质稀释和供给压力。
    - 已披露的内控重大缺陷，会在公司最需要公开市场信任的节点增加治理和融资摩擦。
  unresolvedGaps:
    - 尚无约束性采购承诺、定价、royalty 费率或 unit economics 的公开披露，投资人无法据此推演当前 OEM 项目能否转成收入。
    - 当前员工数、完整私募融资生命周期，以及交割后所有权和完全摊薄股权结构结果，都没有清晰公开视图。
    - 2026 年 6 月 10 日之后没有公开月末现金更新，也没有足够细的交割后烧钱路径，难以判断现金跑道究竟多稳。
    - 从 Lionano 到当前 Factorial Energy Inc. 的确切创立日期和公司沿革，在公开资料中仍记录不完整。
