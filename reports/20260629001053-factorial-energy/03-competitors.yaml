- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Company / group
  - Public economics disclosed
  - Commercial model
  - Included capabilities
  - Main unknowns
  - Implication
  rows:
  - - Factorial
    - Public listing implied ~$1.3B equity value; no cell ASP disclosed
    - Partner-led battery commercialization
    - Validated cells, OEM integration, non-auto expansion
    - Program volumes, yields, warranty terms, realized pricing
    - Technical proof is ahead of commercial transparency
  - - QuantumScape
    - PowerCo milestone payments and licensed output rights disclosed; no cell ASP disclosed
    - Licensing and technology transfer
    - QSE-5 development, pilot ramp, partner production rights
    - End-market pricing, yield, and partner economics beyond milestones
    - Economics are visible at partnership level, not product level
  - - Solid Power
    - Revenue, liquidity, and equity funding disclosed; no public electrolyte price list
    - Electrolyte sales plus IP licensing
    - Electrolyte supply, pilot lines, partner cell programs
    - Long-run gross margin, customer pricing, and commercial-scale conversion
    - More finance transparency than product-pricing transparency
  - - SES AI
    - Public filing and results exist; no automotive cell pricing disclosed
    - Battery development plus broader AI and service ambitions
    - EV, UAM, robotics, and BESS targeting
    - Named OEM deals, vehicle economics, and commercialization dates
    - Hard to underwrite as a near-term auto cell supplier
  - - Toyota / Honda
    - Pilot and production investments disclosed; no cell ASP disclosed
    - Internal-build OEM battery strategy
    - Solid electrolytes, demo lines, captive vehicle integration
    - External availability, pack cost, and launch volumes
    - Internal build can crowd out startup share without revealing pricing
  - - Samsung SDI
    - Energy-density target and 2027 timing disclosed; no customer pricing disclosed
    - Scaled incumbent adding ASSB option
    - Pilot line, sample supply, premium EV battery business
    - Customer list, unit economics, and eventual ASSB volumes
    - Potentially formidable if pilot converts, but public economics are thin
  - - CATL
    - Large revenue, profit, and capacity disclosures; no direct solid-state pricing
    - Integrated high-scale battery supply
    - Mainstream EV, storage, swapping, and adjacent technologies
    - Specific price-per-kWh by program
    - Incumbent cost curve keeps pressure on next-gen entrants
  - - ProLogium
    - $3.8B pre-money value and subsidy-backed expansion disclosed; no cell ASP disclosed
    - Integrated manufacturing and expansion financing
    - Taoyuan line, Dunkirk build, Gen4 platform
    - Automotive contract economics and realized margins
    - Manufacturing-readiness story is ahead of pricing transparency
  notes: 'This table preserves the central evidence gap: public disclosures emphasize funding, milestones, or pilot plants, not realized battery pricing. Unknown cells are intentional rather than missing work.'
