- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Mitigation / diligence ask
  rows:
  - - Automotive proof through Stellantis and Mercedes
    - A pilot or road-test lead may not survive if partner lines fail to scale or shift sourcing
    - high
    - Request joint manufacturing plan, validation-to-production gate chart, and sole-source versus dual-source terms.
  - - Capital-light commercialization model
    - Partners retain leverage over timing, capex, and allocation versus captive battery programs
    - high
    - Ask which lines Factorial truly controls and what minimum committed volumes exist.
  - - Lithium-metal performance advantage
    - Independent technical sources say interface control, pressure, and moisture handling can erase lab advantages at pack scale
    - high
    - Review full durability, stack-pressure, and pack-integration data against incumbent alternatives.
  - - Blue-chip OEM roster
    - BMW, Samsung, PowerCo, and Toyota show OEM relationships are often non-exclusive
    - medium
    - Confirm exclusivity, geography, platform scope, and renewal rights for each JDA or supply program.
  - - U.S. startup optionality beyond autos
    - Expansion into defense, aerospace, and robotics could distract management before auto scale is proven
    - medium
    - Test whether non-auto programs share the same line economics or require separate qualification.
  - - Technology lead versus startups
    - QuantumScape and ProLogium may be ahead on disclosed process industrialization or shipment history
    - medium
    - Benchmark Factorial's current yields, separator or electrolyte readiness, and production throughput against those peers.
  - - Shield from incumbent response
    - CATL and OEM internal-build efforts can keep improving existing batteries while waiting out startup delays
    - high
    - Model adoption only in premium or specialty wedges until cost parity and supply assurance are proven.
  - - Road-test signaling advantage
    - Mercedes road proof is strong, but it does not reveal warranty, service, or cost outcomes
    - medium
    - Ask for fleet telemetry, degradation curves, and pack-serviceability data from the demo programs.
  notes: Severity scores are author judgments based on retained evidence. The most material risks come from manufacturability, partner dependence, and incumbent scale rather than from one isolated chemistry metric.
