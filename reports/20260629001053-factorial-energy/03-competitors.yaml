  evidenceGaps:
  - type: missing-source
    severity: material
    topic: pricing and yields
    missingEvidence: Public cell ASPs, gross margins, line yields, warranty terms, and scrap assumptions for Factorial and the main startup peers.
    whyItMatters: Without realized economics it is impossible to tell whether current validation wins can convert into durable share beyond premium niches.
    diligencePath: Request program-level commercial terms, pilot-line yield curves, and cost-per-kWh bridges from management and anchor OEMs.
    relatedQuestionRefs:
    - QP023
    - QP025
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: program volumes and sourcing rights
    missingEvidence: Committed fleet size, launch volume, sole-source scope, and geographic rights for Factorial, QuantumScape, Solid Power, and ProLogium partner programs.
    whyItMatters: Named partners alone do not show whether a program can scale or whether an OEM is merely keeping an option open.
    diligencePath: Ask each company for signed volume commitments, sourcing structure, and qualification gate status by vehicle platform.
    relatedQuestionRefs:
    - QP008
    - QP025
    relatedTableRefs:
    - TP001
  - type: enumeration-incomplete
    severity: material
    topic: OEM customer disclosure
    missingEvidence: Named automotive customers and present validation stage for Samsung SDI, ProLogium, and SES AI programs remain incomplete in retained public evidence.
    whyItMatters: Customer opacity makes it harder to benchmark true competitive traction against Factorial's more visible OEM roster.
    diligencePath: Request customer reference lists, sample counts, and current validation stage by named OEM under NDA if necessary.
    relatedQuestionRefs:
    - QP008
    - QP024
    relatedTableRefs:
    - TP001
    - TP002
  - type: private-evidence-only
    severity: material
    topic: incumbent internal-build economics
    missingEvidence: Pack-level cost, yield, and launch-volume economics for Toyota, Honda, and Samsung internal all-solid-state programs are not public.
    whyItMatters: Those internal-build programs are among the hardest competitors to underwrite because they can absorb delay but reveal little about cost readiness.
    diligencePath: Use supplier checks and OEM diligence to obtain pilot output, scrap rates, and projected cost-per-kWh ranges for internal programs.
