- id: switching-costs-incumbent-pressure-and-substitutes
  title: Switching Costs, Incumbent Pressure, and Substitute Pathways
  body: Even if Factorial's cell metrics remain strong, buyers do not switch on energy density alone. Independent technical sources say true solid-state programs still face interface control, stack-pressure, moisture-handling, and pack-integration problems that change the design burden at the vehicle level. That means switching costs sit in qualification work, compression strategy, thermal management, warranty confidence, and supply assurance as much as in the cell bill of materials. This favors incumbents and internal builders. Toyota, Honda, and Samsung can iterate those choices inside their own organizations; CATL can keep improving conventional lithium-ion and adjacent chemistries while offering proven supply at immense scale. Factorial therefore competes against a good-enough incumbent world, not against a vacuum. QuantumScape and Solid Power also benefit from large-partner channels, and ProLogium benefits from a public manufacturing-readiness narrative. The substitute risk is especially
    acute in mass-market EVs, where late-2020s solid-state timelines collide with rapidly improving liquid-electrolyte batteries. The more defensible early wedge remains premium, performance, or specialty platforms where range, weight, charging, or mission profile can justify extra integration effort. That wedge helps Factorial, but it also limits near-term addressable share and keeps commercial timing exposed to OEM scheduling decisions.
