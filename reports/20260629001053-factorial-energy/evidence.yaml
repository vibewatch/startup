evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: headcount-gap
    missingEvidence: An exact current employee count and site-by-site staffing split as of June 2026.
    whyItMatters: >-
      Headcount is a standard scale and burn-rate proxy for battery startups and affects commercialization readiness
      judgment.
    diligencePath: >-
      Request a current org chart or employee census from management and reconcile it against payroll or benefits
      records.
    relatedQuestionRefs:
      - QO021
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance-coverage-gap
    missingEvidence: >-
      Full public biographies and role coverage for every current director and committee member beyond the subset most
      material to chapter-one diligence.
    whyItMatters: >-
      The leadership table intentionally focuses on founders, finance leadership, and committee chairs, so a reader
      should not assume it is a complete board dossier.
    diligencePath: >-
      Pull the full board packet, committee charters, and any governance questionnaires to complete director-by-director
      coverage.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: capital-gap
    missingEvidence: >-
      A complete lifetime funding history and post-close ownership table covering legacy investors, PIPE investors, and
      strategic investors.
    whyItMatters: >-
      Without a full cap-table view, dilution, control, and remaining financing capacity cannot be underwritten
      precisely.
    diligencePath: Request the capitalization table, merger closing cap table, and any investor-rights summary from the data room.
    relatedQuestionRefs:
      - QO022
      - QO024
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headquarters-history
    missingEvidence: >-
      A clean chronology for company incorporation, rebranding, and headquarters moves from predecessor Lionano through
      current Factorial Energy Inc.
    whyItMatters: >-
      The overview can establish current Billerica identity, but not a perfect historical founding and location chain
      from public marketing sources alone.
    diligencePath: >-
      Request certificate-of-incorporation history, name-change records, and internal timeline materials covering
      Lionano to Factorial rebrand events.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO001
      - TO004
  - type: private-evidence-only
    severity: material
    topic: commercial-gap
    missingEvidence: >-
      Commercial contract economics, committed volumes, pricing terms, and launch gates for Mercedes, Stellantis, Karma,
      Philenergy, and other named partners.
    whyItMatters: Technical validation does not by itself prove future revenue, gross margin, or bankable production demand.
    diligencePath: >-
      Request signed JDA or supply-agreement summaries, milestone schedules, and revenue forecasts tied to each partner
      program.
    relatedQuestionRefs:
      - QO024
      - QO025
    relatedTableRefs:
      - TO003
      - TO004
  - type: private-evidence-only
    severity: material
    topic: commercial-gap
    missingEvidence: >-
      A dated commercialization plan showing when Factorial expects first material recurring revenue rather than pilot
      or development funding.
    whyItMatters: >-
      The company is public and pre-revenue, so timing to first meaningful revenue is central to runway and valuation
      assessment.
    diligencePath: >-
      Request the internal operating plan, customer milestone schedule, and 2026-2028 revenue bridge used by management
      and the board.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: solid-state-sam-gap
    missingEvidence: >-
      A clean third-party dataset isolating 2026-2030 TAM, SAM, and SOM for premium automotive solid-state cells plus
      defense, robotics, and data-center adjacencies.
    whyItMatters: >-
      Without a clean niche-market isolate, investors can easily mistake broad EV battery headlines for Factorial’s
      realistic near-term addressable market.
    diligencePath: >-
      Request management’s internal segmentation model, then reconcile it against named customer programs, pilot
      volumes, and external analyst assumptions.
    relatedQuestionRefs:
      - QM005
      - QM022
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-volume-gap
    missingEvidence: >-
      Customer-level pilot volumes, launch ramps, battery ASPs, and any premium-to-incumbent pricing assumptions for
      Mercedes, Stellantis, Karma, drones, robotics, or storage programs.
    whyItMatters: >-
      Market attractiveness does not convert into valuation support unless the company can show bankable volume and
      price realization in its target wedge.
    diligencePath: >-
      Request customer program sheets, signed supply or JDA economics, and the revenue bridge from pilot validation to
      production spend.
    relatedQuestionRefs:
      - QM023
      - QM025
    relatedTableRefs:
      - TM003
      - TM004
  - type: private-evidence-only
    severity: material
    topic: manufacturing-yield-gap
    missingEvidence: >-
      Pilot-line yield, scrap, throughput, pressure-management, and pack-integration economics for Factorial’s
      manufacturing path.
    whyItMatters: >-
      Most public evidence shows promise at validation stage, but manufacturing economics determine whether solid-state
      can capture broad share or stay trapped in low-volume pilots.
    diligencePath: >-
      Request pilot-line KPI dashboards, line-reuse assumptions, and costed manufacturing models from Factorial and any
      production partners.
    relatedQuestionRefs:
      - QM013
      - QM021
      - QM024
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: data-center-demand-gap
    missingEvidence: >-
      Named hyperscale or stationary-storage customers, deployment schedules, and revenue assumptions for Factorial’s
      data-center or next-generation energy-system narrative.
    whyItMatters: >-
      Storage adjacency can expand the market story materially, but without named customers it remains more thematic
      than underwritten.
    diligencePath: Ask for signed LOIs, design wins, or joint-development summaries covering storage and data-center applications.
    relatedQuestionRefs:
      - QM018
      - QM025
    relatedTableRefs:
      - TM001
      - TM003
  - type: conflicting-data
    severity: minor
    topic: commercialization-timing-gap
    missingEvidence: >-
      A reconciled commercialization calendar showing when premium pilots, specialty deployments, and broader automotive
      programs are expected to move from validation to recurring revenue.
    whyItMatters: >-
      Public sources provide multiple pilot and prototype milestones but not one definitive timing map for market entry,
      which makes valuation timing sensitive to assumption choice.
    diligencePath: >-
      Request management’s launch calendar and map every named program to validation stage, SOP target, and expected
      revenue start date.
    relatedQuestionRefs:
      - QM012
      - QM024
    relatedTableRefs:
      - TM002
      - TM004
  - type: missing-source
    severity: material
    topic: pricing and yields
    missingEvidence: >-
      Public cell ASPs, gross margins, line yields, warranty terms, and scrap assumptions for Factorial and the main
      startup peers.
    whyItMatters: >-
      Without realized economics it is impossible to tell whether current validation wins can convert into durable share
      beyond premium niches.
    diligencePath: >-
      Request program-level commercial terms, pilot-line yield curves, and cost-per-kWh bridges from management and
      anchor OEMs.
    relatedQuestionRefs:
      - QP023
      - QP025
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: program volumes and sourcing rights
    missingEvidence: >-
      Committed fleet size, launch volume, sole-source scope, and geographic rights for Factorial, QuantumScape, Solid
      Power, and ProLogium partner programs.
    whyItMatters: Named partners alone do not show whether a program can scale or whether an OEM is merely keeping an option open.
    diligencePath: >-
      Ask each company for signed volume commitments, sourcing structure, and qualification gate status by vehicle
      platform.
    relatedQuestionRefs:
      - QP008
      - QP025
    relatedTableRefs:
      - TP001
  - type: enumeration-incomplete
    severity: material
    topic: OEM customer disclosure
    missingEvidence: >-
      Named automotive customers and present validation stage for Samsung SDI, ProLogium, and SES AI programs remain
      incomplete in retained public evidence.
    whyItMatters: >-
      Customer opacity makes it harder to benchmark true competitive traction against Factorial's more visible OEM
      roster.
    diligencePath: Request customer reference lists, sample counts, and current validation stage by named OEM under NDA if necessary.
    relatedQuestionRefs:
      - QP008
      - QP024
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: incumbent internal-build economics
    missingEvidence: >-
      Pack-level cost, yield, and launch-volume economics for Toyota, Honda, and Samsung internal all-solid-state
      programs are not public.
    whyItMatters: >-
      Those internal-build programs are among the hardest competitors to underwrite because they can absorb delay but
      reveal little about cost readiness.
    diligencePath: >-
      Use supplier checks and OEM diligence to obtain pilot output, scrap rates, and projected cost-per-kWh ranges for
      internal programs.
    relatedQuestionRefs:
      - QP014
      - QP020
      - QP025
    relatedTableRefs:
      - TP001
      - TP004
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: Realized pricing, royalty schedules, and customer-specific commercial terms for each disclosed revenue lane.
    whyItMatters: Without price and contract data, revenue quality and gross-profit potential cannot be underwritten.
    diligencePath: Obtain executed OEM and partner contracts, invoice samples, and pricing approval materials.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI002
      - TI005
  - type: private-evidence-only
    severity: material
    topic: debt-gap
    missingEvidence: Full schedule of debt, equipment finance, guarantees, liens, or manufacturing-capacity prepayment obligations.
    whyItMatters: Hidden financing or vendor commitments could shorten runway far faster than the headline cash balance suggests.
    diligencePath: >-
      Request the complete debt schedule, board materials on financing strategy, and all material manufacturing or
      supply commitments.
    relatedQuestionRefs:
      - QI016
    relatedTableRefs:
      - TI004
      - TI005
  - type: private-evidence-only
    severity: material
    topic: collaboration-economics
    missingEvidence: >-
      Contract-level explanation of the $3.4M partner receipts netted against R&D and the $2.2M receivable increase
      under collaboration agreements.
    whyItMatters: >-
      These items may materially change the underlying cost structure and commercialization economics if they are
      reimbursements rather than recurring revenue.
    diligencePath: >-
      Review collaboration agreements, accounting memos, quarter-end receivables aging, and cash collections after March
      31, 2026.
    relatedQuestionRefs:
      - QI024
    relatedTableRefs:
      - TI001
      - TI003
      - TI005
  - type: stale
    severity: material
    topic: post-close-burn
