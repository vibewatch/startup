  topStrengths:
    - Stronger public OEM validation than most solid-state startups, including Mercedes-Benz road testing and Stellantis cell-plus-vehicle milestones.
    - Partner-led manufacturing strategy can reduce the capital burden versus a fully self-funded gigafactory approach if qualification converts into production.
    - Public-company status and a roughly $116.6M post-close cash balance give Factorial more disclosure and near-term financing flexibility than many private battery peers.
    - FEST already shows credible performance signals, while Solstice and Gammatron widen the long-term upside if manufacturability improves.
  topRisks:
    - The company remained pre-revenue as of March 31, 2026, so public customer proof still does not equal contracted recurring revenue or committed volume.
    - Commercialization risk remains high because the hardest problem has shifted from cell credibility to repeatable manufacturing yield, cost, and throughput.
    - The June 2026 listing improved liquidity but only funds operations into roughly Q1 2028 under the current plan, leaving little room for launch slippage or rising capex.
    - Warrants, options, RSUs, resale registration rights, and staged lock-up releases create meaningful dilution and supply overhang near the current quote.
    - A disclosed material weakness in internal controls adds governance and financing friction at the exact point where the company needs public-market trust.
  unresolvedGaps:
    - No public disclosure of binding purchase commitments, pricing, royalty rates, or unit economics that would let investors underwrite revenue conversion from current OEM programs.
    - No clean public view of current headcount, full lifetime private funding, or the post-close ownership and fully diluted cap-table outcomes.
    - No public month-end cash update after June 10, 2026 or sufficiently detailed post-close burn trajectory to judge how durable the runway really is.
    - The exact founding-date and corporate chronology from Lionano to current Factorial Energy Inc. remain imperfectly documented in public sources.
