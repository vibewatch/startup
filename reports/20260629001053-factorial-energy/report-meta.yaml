companyProfile:
  summary: >-
    Factorial Energy is a greater-Boston solid-state battery developer that became public in June
    2026 through its merger with Cartesian Growth Corporation III. Its strongest public proof comes
    from automotive validation: Mercedes-Benz has road-tested Factorial-powered vehicles and
    Stellantis has published high-performance FEST cell data before moving into a Dodge Charger
    Daytona development vehicle. The company is commercializing through a partner-led model built
    around FEST, the higher-upside Solstice platform, and the Gammatron development stack rather
    than a fully self-funded gigafactory strategy. At the same time, Factorial remained pre-revenue
    as of March 31, 2026, disclosed a material weakness in internal controls, and only extended its
    cash position to roughly $116.6 million after the de-SPAC close, leaving commercialization and
    dilution discipline as the core underwriting questions.
  founders:
    - name: Siyu Huang
      role: Co-founder, CEO, director
      background: Former Lionano operator who has served as CEO since January 2020 and remains the company's primary commercial and strategic leader.
      claimRefs: [CO001, CO002]
    - name: Alex Yu
      role: Co-founder, CTO, director
      background: Former Lionano founder-operator who previously served as CEO and president before taking the CTO role, preserving founder continuity over the technical roadmap.
      claimRefs: [CO001, CO003]
  foundingLocation: Greater Boston area, Massachusetts, USA
  headquarters: 805 Middlesex Turnpike, Billerica, Massachusetts 01821, USA
  productSummary: >-
    FEST lithium-metal battery cells, the next-generation Solstice all-solid-state platform, and
    Gammatron software/digital-twin tooling sold through joint development, validation,
