      - number: '6.2'
        title: Mercedes and Stellantis are the best public reference accounts
        blocks:
          - type: paragraph
            body: >-
              Mercedes-Benz and Stellantis are the two relationships that most clearly moved beyond logo-level
              partnership language into technical proof that outsiders can evaluate. Mercedes provides the richest
              public record. Its disclosures describe the handoff from B-sample cells into an EQS-based validation
              vehicle, bench and vehicle tests in Stuttgart, February 2025 road testing, and a later 1,205 kilometer
              demonstration drive to Malmö as part of a broader validation program aimed at accelerating the path to
              series production. Stellantis is close behind. Public sources first showed validated 77Ah FEST cells with
              375 Wh/kg energy density, more than 600 cycles, 18-minute 15%-90% charging, and operation from -30°C to
              45°C, then moved into a Dodge Charger Daytona development vehicle and a June 2026 road-testing program.
              Together these two OEMs give Factorial far stronger reference-customer quality than most pre-scale battery
              startups can show. But they still do not close the commercial loop. Public evidence proves engineering
              depth, vehicle integration, and validation momentum; it does not yet prove serial purchase orders,
              committed volume ramps, pricing, or recurring revenue.
