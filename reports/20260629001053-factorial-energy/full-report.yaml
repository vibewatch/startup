            body: >-
              The hardest customer questions remain unanswered in public. Factorial's filings, partner announcements,
              and secondary coverage are rich on milestones but poor on monetization detail. No retained source in this
              chapter discloses contract value, minimum purchase commitments, renewal dates, take-or-pay mechanics,
              customer concentration by revenue, NRR, GRR, churn, or warranty and field-return performance by account.
