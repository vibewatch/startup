      - number: '2.3'
        title: Buyer, User, Payer, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              Factorial’s buyer map is fragmented, which is another reason the market must be defined carefully. In
              automotive, the buyer is typically an OEM battery, vehicle-platform, or procurement organization; the user
              is engineering plus the eventual driver; and the payer is product planning and supply-chain budget owners
              who underwrite differentiation, compliance, and gross-margin tradeoffs. In drones, robotics, and
              defense-adjacent systems, the buyer is more likely a system integrator or program owner, the user is the
              machine or operator, and the payer tolerates higher cell cost if the mission benefit is clear. In
              stationary storage and data-center adjacencies, the buyer and payer shift toward energy, infrastructure,
              or storage-development teams that care about safety, density, and operating economics. Across all of these
              segments, adoption typically follows a staged path: cell validation, pack integration, road or field
              testing, low-volume premium deployment, then broader scale only if manufacturing cost, yield, and
              reliability converge. That sequence helps explain why premium OEMs and specialty platforms often become
              the first commercial proving grounds for next-generation batteries.
