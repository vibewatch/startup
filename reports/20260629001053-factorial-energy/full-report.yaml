      - number: '3.3'
        title: Manufacturing Paths, Capital Intensity, and Commercialization Timing
        blocks:
          - type: paragraph
            body: >-
              The biggest competitive separator is not a lab result but the manufacturing model behind it. Factorial is
              trying to industrialize through partner manufacturing and a capital-light public-market story. That
              reduces direct capex burden, but it also means the company is less insulated than Toyota, Honda, Samsung,
              or CATL if qualification stretches or an OEM reprioritizes. QuantumScape is also moving toward a
              partner-led path, with PowerCo milestone funding and licensed output rights rather than a standalone
              first-factory build. Solid Power is even more explicit: it wants to monetize sulfide electrolyte, process
              IP, and partner lines rather than become a high-volume finished-cell producer. By contrast, Honda is
              already spending about ¥43 billion on a demonstration line, Toyota's PPES-linked next-generation
              production begins from 2026 with 9 GWh per year, Samsung SDI is operating the S-Line pilot with a 2027
              mass-production target, and CATL already has 772 GWh of global capacity plus 321 GWh under construction.
              ProLogium claims a middle path: still startup-like, but with a Taoyuan GWh line, shipments, and a Dunkirk
              buildout that would ramp from late 2028. These differences shape commercialization timing. Factorial looks
              early enough to win premium launch slots if partner lines convert, but it has less disclosed balance-sheet
              depth than Solid Power and far less industrial slack than the Asian incumbents. That makes capital
              intensity a real competitive issue rather than a finance-only footnote.
