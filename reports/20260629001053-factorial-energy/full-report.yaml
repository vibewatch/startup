            body: >-
              Factorial's Q1 2026 filing gives enough to sketch a cost structure but not enough to underwrite product
              margins. Net loss was approximately $8.6 million and operating cash use was $6.1 million in the quarter.
              Research and development expense fell sharply year over year to about $1.9 million, but that decline was
              not a sign of mature efficiency; management says it was driven mainly by $3.4 million of receipts from
              joint development partners that were recorded net against R&D, plus the prior exit of the Methuen
              facility. General and administrative expense also fell year over year, mainly because stock-based
              compensation declined, even as legal, audit, and advisory costs rose ahead of public-company life. On a
              cash basis, the filing says operating outflows were payroll, materials, facilities, and professional
              services, while receivables under collaboration agreements rose $2.2 million and softened the cash draw.
