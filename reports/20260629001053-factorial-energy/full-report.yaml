      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >-
              Leadership continuity is one of the strongest verified facts in the public record. Siyu Huang and Alex Yu
              both trace back to Lionano, the predecessor business they ran from 2013 to 2019, and both have sat on the
              board since August 2019. Huang has served as CEO since January 2020, while Yu shifted from early CEO to
              president and then to CTO, preserving founder control over commercial and technical direction.
              Public-company governance has become more visible after the listing. Richard Wei joined as CFO in December
              2025 after first advising the company, which aligns with the filing disclosure that Factorial had been
              expanding finance staffing ahead of public-company requirements. The board also includes Joe Taylor as
              executive chairman, Uwe Keller from Mercedes-Benz battery development, Dieter Zetsche, Liad Meidar, and
              Jon Nelson, with committee assignments showing formal audit, compensation, and nominating and governance
              structures. The governance picture is therefore stronger than for many private battery startups, but it is
              still concentrated around a founder couple and automotive-linked directors, so key-person and
              strategic-partner dependence remain real overview risks.
