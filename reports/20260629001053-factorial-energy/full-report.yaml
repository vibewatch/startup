  - id: FE001
    title: Product architecture map
    type: stack
    layout: wide
    summary: >-
      Five-layer view of Factorial’s product stack, showing where chemistry proof ends and industrialization support
      begins.
    data:
      layers:
        - label: Application programs
          detail: Passenger EV, drone, robotics, defense-adjacent, and prospective consumer-electronics deployments
        - label: Pack and vehicle integration
          detail: >-
            OEM battery-system design, calibration, and road-test execution for Mercedes, Stellantis, and later launch
            programs
        - label: Cell platforms
          detail: FEST for current validation and Solstice for future all-solid-state scale-up
        - label: Manufacturing process layer
          detail: Existing-line compatibility messaging plus dry cathode / dry coating and partner infrastructure
        - label: Data and validation layer
