  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Substitutes
        blocks:
          - type: paragraph
            body: >-
              The cleanest way to define Factorial’s market is not “all EV batteries” but premium and
              performance-oriented battery programs that can justify a new chemistry before commodity markets can.
              Public filings, technology pages, and partner releases consistently place Factorial in demanding
              applications: premium passenger EVs, development fleets, drones, robotics, defense-adjacent systems, and
              energy-storage or hyperscale-data-center adjacencies. That framing matters because the buying logic in
              these niches is different from the logic of mainstream battery procurement. A luxury or performance OEM
              can pay for better range, charging, safety, or thermal performance if the battery differentiates the
              vehicle, while a drone or robotics buyer may care most about weight, altitude performance, or
              low-temperature operation. By contrast, the excluded benchmark market is mass-market lithium-ion
              procurement where mature LFP and NMC supply chains, especially China-centered ones, already deliver low
              cost at huge scale. Those incumbent chemistries remain the status-quo substitute, alongside plug-in-hybrid
              and range-extender designs that reduce battery size needs altogether. This chapter therefore treats
              Factorial’s real market as a performance-constrained wedge inside much larger battery demand.
            claimRefs:
