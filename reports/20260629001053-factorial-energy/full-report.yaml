    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Stage, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Factorial presents itself in 2026 as a U.S. solid-state battery developer founded in the greater Boston
              area and now operating as a Nasdaq-listed public company. The most precise legal address in primary
              filings is 805 Middlesex Turnpike, Billerica, Massachusetts, while the investor-relations homepage and
              multiple company and partner releases still use broader wording such as “greater Boston area” or
              “U.S.-headquartered.” That is enough to establish the company’s current Massachusetts identity, but not
              enough to prove one single uninterrupted headquarters narrative because older partner materials also
              described Factorial as based in Woburn. Product identity is clearer than corporate chronology. The
              technology page centers the platform set on FEST, Solstice, and Gammatron, and the June 2026
              public-listing materials describe a commercialization strategy built around joint manufacturing
              partnerships rather than a disclosed self-funded gigafactory buildout. The financial stage is also clear:
              SEC materials say Factorial had no revenue to date and remained a pre-revenue development-stage company as
              of March 31, 2026. That means the overview should treat the business as technically validated but still
              commercially unproven.
