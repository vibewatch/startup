      - number: '1.4'
        title: Milestones, Validation, and Visible Risks
        blocks:
          - type: paragraph
            body: >-
              Factorial’s milestone record is stronger on technical validation than on commercial revenue. Mercedes-Benz
              first announced a strategic partnership and investment in 2021, then began road testing a
              Factorial-powered EQS in February 2025, and later reported a 1,205-kilometer drive from Stuttgart to Malmö
              on a single charge. Stellantis separately validated 77Ah FEST cells at 375 Wh/kg, more than 600 cycles,
              charging from 15% to 90% in 18 minutes, and performance from minus 30 to 45 degrees Celsius, then moved in
              June 2026 to a Dodge Charger Daytona development vehicle with road testing underway. The roadmap broadened
              in 2026 through Philenergy, IQT, POSCO Future M, and Karma Automotive, showing a partner-led push into
              manufacturing, drones and robotics, and a late-2027 U.S. passenger-vehicle program. At the same time, the
              public record still carries material caution signs. The company is pre-revenue, public sources do not
              verify current headcount or commercial customer counts, and the SEC filing disclosed an active material
              weakness. This chapter therefore supports a view of Factorial as technically credible and strategically
              connected, but not yet commercially de-risked.
