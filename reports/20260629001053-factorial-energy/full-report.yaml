  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Technology scale-up and manufacturability risk
        blocks:
          - type: paragraph
            body: >-
              Factorial’s core risk is no longer whether automotive partners find the chemistry interesting; it is
              whether the company can industrialize that chemistry before time, money, and competitor timelines catch
              up. The public proof stack still leans heavily toward FEST and partner validation rather than Solstice
              production. Mercedes and Stellantis show that Factorial has crossed the threshold from lab cells into
              vehicle-level testing, but the newer Solstice platform is still described publicly as an A-sample-stage
              program with a 40 Ah format and a higher-upside dry-cathode manufacturing story. That is promising, not
              bankable. The clearest company-authored manufacturability signal is yield: Factorial says pilot yield
              improved from roughly 10% to roughly 85%. Even on the company’s own framing, however, gigafactory
              economics require more than that. Independent industry commentary is less forgiving, stressing that true
              all-solid-state systems still face interface, pressure, and manufacturing-integration hurdles that likely
              delay high-volume commercialization beyond the near-term hype cycle. The underwriting implication is that
              technology risk has migrated from electrochemical credibility toward repeatable process control, cost,
              scrap, and throughput.
            claimRefs:
