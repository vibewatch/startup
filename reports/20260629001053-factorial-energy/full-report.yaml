        title: Validation Stage, Roadmap, and Readiness
        blocks:
          - type: paragraph
            body: >-
              Public readiness is uneven across the stack. FEST has crossed from lab-only data into externally visible
              validation: Mercedes integrated the cells into an EQS test car, started road testing in early 2025, and
              later published a 1,205-kilometer demonstration drive; Stellantis first validated automotive-size cell
              metrics and then moved the cells into a Dodge Charger Daytona development vehicle in 2026. Those are
              meaningful maturity signals because they show cell-to-pack and pack-to-vehicle work, not only pouch-cell
              claims. The roadmap also stretches further out through Karma’s late-2027 passenger-vehicle target and
              drone-system integrations across multiple regions. Even so, Solstice remains at an earlier stage in public
              evidence. The market has architecture claims, a manufacturing MOU, and strategic customer language, but
              not a public FEST-equivalent validation dataset. Comparative sources from Honda, Toyota, and Samsung
              reinforce that this is normal for all-solid-state programs: pilot lines, process verification, and staged
              commercialization targets still dominate the field. Factorial therefore looks ahead of many peers on
