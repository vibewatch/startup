        - Closest public premium solid-state benchmark with much deeper liquidity
        - Different scale, longer public history, and more disclosed industrialization detail
      - - Solid Power
        - ~$582.7M market cap
        - ~$435.3M liquidity and $3.1M Q1 2026 revenue
        - Useful capital-light U.S. peer with OEM links and some revenue
        - Still pre-scale and valued only modestly above liquidity
      - - SES AI
        - ~$332.2M market cap
        - ~$178M liquidity and 2026 revenue guidance of $30M to $35M
        - Shows how revenue-bearing battery companies can still trade far below Factorial
        - Different product mix and AI / ESS mix reduce direct comparability
      - - De-SPAC benchmark
        - ~$1.3B public-equity framing at listing; $1.1B merger consideration to legacy holders
        - Gross proceeds ~$112.1M; heavy redemptions of 23.1M shares
        - Shows that today's public value has not de-rated much from transaction framing
        - SPAC benchmarks are negotiated constructs, not operating-market comps
    notes: >-
      Comparison emphasizes valuation versus liquidity and commercialization proof, because EV/revenue and DCF methods
      are weak for largely pre-revenue battery names.
