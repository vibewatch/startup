        title: Revenue Model and Monetization Reality
        blocks:
          - type: paragraph
            body: >-
              The public record is unusually clear about what Factorial is not yet: it had no revenue to date as of
              March 31, 2026, so this chapter should not imply any commercial sales ramp that management has not
              disclosed. What the record does show is a planned monetization architecture rather than realized revenue
              quality. The March 2026 investor presentation describes four future lanes—development and service revenue,
              technology license or royalty revenue, material supply revenue, and eventual manufacturing or battery-cell
              sales—while the same deck frames defense, robotics, and other high-spec applications as earlier,
              higher-margin opportunities before EV scale. That strategic framing fits the SEC and listing-release
              language around a capital-light, partner-led commercialization path. But as of Q1 2026 the only concrete
              economic signal is that receipts from joint development partners were recorded net against research and
              development expense, not that Factorial had begun recognizing product revenue. Public sources therefore
              support a mechanism story, not a proven revenue-quality story, and they leave pricing, realized ASPs,
              royalties, and contract economics unverified.
