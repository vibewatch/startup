            body: >-
              The investable takeaway is not that Factorial solved its financing problem by going public; it is that the
              company bought itself time. Against public solid-state peers, Factorial now looks much better funded than
              it did pre-close but still materially smaller in financial firepower than Solid Power or QuantumScape.
              Solid Power ended Q1 2026 with $435.3 million of liquidity and reported only $1.7 million of quarterly
              capex, while QuantumScape held about $904.7 million of cash and marketable securities even after a roughly
              $100.8 million quarterly net loss and $10.0 million of equipment spending. That peer context matters
              because Factorial is pursuing similar scale-up goals with a much smaller cash cushion, even if its
              partner-led manufacturing model should require less self-funded plant investment than a fully in-house
              buildout. The adverse lens matters too: recent industry commentary argues that true high-volume
              solid-state commercialization is still more likely in the early 2030s than the late 2020s because
              manufacturing integration remains unresolved. Combined with Factorial's disclosed material weakness,
              absent pricing and margin data, and no public visibility into current quarter burn after the de-SPAC, the
