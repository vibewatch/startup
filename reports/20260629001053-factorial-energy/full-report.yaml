      - number: '5.2'
        title: FEST versus Solstice Architecture
        blocks:
          - type: paragraph
            body: >-
              The most important technical distinction is between Factorial’s currently validated FEST platform and the
              newer Solstice platform. Public evidence shows FEST as the chemistry family with the clearest
              quasi-solid-state or lithium-metal validation record: Stellantis published 77Ah, 375 Wh/kg, more than 600
              cycles, 15%-90% charging in 18 minutes, and operation from -30°C to 45°C, while Mercedes took Factorial
              lithium-metal cells onto public roads in an EQS-based test vehicle. Solstice, by contrast, is marketed as
              the all-solid-state successor. Company releases describe it as sulfide-based, targeting up to 450 Wh/kg,
              up to 80% higher energy density, and operating stability above 90°C, with a dry-cathode or dry-coating
              process intended to cut manufacturing energy and solvent use. The chapter therefore treats FEST as the
              current public proof engine and Solstice as the higher-reward but less independently validated
              architecture. That distinction is central to diligence, because the company’s upside narrative
              increasingly points to Solstice while its most supportable validation still points to FEST.
