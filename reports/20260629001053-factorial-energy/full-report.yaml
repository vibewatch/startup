            body: >-
              The second tier of named adopters makes the customer story broader, but not equally deep. Hyundai and Kia
              matter because their August 2021 JDA was Factorial's first major OEM strategic investment, and the
              SEC-filed description is more concrete than a casual partnership label: it covers supply and evaluation of
              cells, joint R&D, and potential joint manufacturing under statements of work. Yet the reviewed public
              record still does not show Hyundai or Kia road-testing a Factorial-equipped vehicle or naming a production
              program. Karma Automotive offers a different kind of signal. It announced the first U.S. solid-state
              passenger-vehicle production program with Factorial in February 2026, beginning with the Kaveya
              super-coupe targeted for late 2027. That is commercially meaningful because it creates a named launch
              path, but it is still future tense. The drone network with IQT, KULR, Tulip, JRES, and Avidrone similarly
              broadens the visible adopter set and supports the idea that Factorial's cells can matter outside passenger
              EVs. Even there, however, the strongest public evidence is still pack integration, demonstration hardware,
              and flight-preparation work, not disclosed field revenue or repeat contracts.
