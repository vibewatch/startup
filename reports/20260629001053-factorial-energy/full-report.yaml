          tone: negative
        - id: n3
          label: Cash is finite
          detail: ~$116.6M post-close and plan funds operations only into Q1 2028
          tone: negative
        - id: n4
          label: Dilution overhang
          detail: Warrants, options, RSUs, registration rights, and staged lock-ups matter
          tone: negative
