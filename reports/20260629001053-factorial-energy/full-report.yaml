      - number: '2.5'
        title: Sizing Gaps and Why They Matter for Valuation
        blocks:
          - type: paragraph
            body: >-
              The main diligence problem is not that the market is small; it is that the portion Factorial can
              realistically monetize first is much narrower and less observable than broad EV or storage headlines
              imply. Public sources show real demand growth, clear premium-application proof points, and multiple
              adjacent niches, but they do not disclose the contract volumes, cell ASPs, pilot-to-production conversion
              rates, or manufacturing yields needed to turn those proof points into a bankable SOM. That uncertainty
              matters directly for valuation. If Factorial can convert premium OEM validation and specialty niches into
              repeatable low-volume launches while keeping line reuse high, the market wedge can expand quickly. If not,
              the company could remain stuck in pilot programs while incumbent lithium-ion systems capture most
              near-term spend. The appropriate analytical posture is therefore to preserve contradictory or incomplete
              sizing lenses, state that clean TAM/SAM/SOM isolation is unavailable, and prioritize diligence on pricing,
              program volume, and manufacturing economics rather than assuming that broad EV growth automatically
              translates into solid-state share.
            claimRefs:
              - CM031
              - CM032
              - CM035
              - CM036
