  - id: TV006
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold to watch
      - Transmission to thesis
      - Action implication
    rows:
      - - Commercialization timing slips
        - Key OEM or Karma timing moves from late 2027 toward 2028+ without offsetting contract depth
        - Option value decays faster than public valuation currently reflects
        - Downgrade valuation stance toward expensive / avoid
      - - Burn worsens or cash guide shortens
        - Evidence that post-close burn materially exceeds the Q1 baseline or runway no longer reaches Q1 2028
        - Forces earlier capital raising and worsens dilution risk
        - Assume down-round or follow-on-equity pressure in scenarios
      - - Unlock / resale pressure bites
        - Meaningful insider or PIPE resale activity appears as registration and lock-up windows open
        - Public market may cap upside even if technical milestones continue
        - Require wider entry discount before adding exposure
      - - No binding commercial economics emerge
        - Still no pricing, royalties, or minimum-volume commitments after further partner milestones
        - Keeps valuation in option space rather than underwriting space
        - Maintain track / research-more rather than buy
      - - Partner proof reverses
        - A Mercedes, Stellantis, PowerCo, or Karma pathway is delayed, narrowed, or terminated
        - Removes the core strategic justification for the premium multiple
        - Treat as thesis break, not a normal execution wobble
    notes: >-
      Triggers are designed for public-market monitoring and tie directly to valuation compression mechanisms rather
      than generic operational commentary.
    claimRefs:
      - CV015
      - CV020
      - CV034
      - CV035
      - CV036
      - CV043
  - id: TV007
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Commercial contract economics
        - Pricing, royalty, minimum-volume, and payment terms by partner program
        - Without these, no defensible DCF or EV/revenue bridge exists
        - Request executed term sheets, JDA amendments, and first commercial supply drafts
      - - Updated burn and capex
        - Monthly post-close cash bridge, capex plan, and scenario downside cases
        - Runway and dilution risk drive valuation more than revenue today
        - Request board-approved operating plan and monthly treasury pack
      - - Fully diluted cap table
        - Holder-level warrants, options, RSUs, registration rights, and lock-up schedule
        - Realized common-equity returns depend on supply and dilution timing
        - Request post-close cap table and selling-restriction matrix
      - - OEM conversion evidence
        - Binding award letters, volume reservations, or program payment schedules
        - Would convert strategic option value into underwritable demand
        - Request partner-side letters or executed production milestones
      - - Manufacturing economics
        - Yield, scrap, cost-per-kWh, and contribution-margin assumptions by line
        - Needed to distinguish a technical win from an economic win
        - Request plant-level KPI deck and margin bridge by product lane
    notes: >-
      These asks are the minimum package required to move from scenario framing to evidence-based fair-value
      underwriting.
    claimRefs:
      - CV037
      - CV042
      - CV044
