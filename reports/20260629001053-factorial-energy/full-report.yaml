      - number: '3.5'
        title: Where Factorial Leads, Where It Lags, and What Still Cannot Be Underwritten Publicly
        blocks:
          - type: paragraph
            body: >-
              On the positive side, Factorial appears better positioned than SES AI on automotive proof and more
              road-validated than most startup peers. It also benefits from having both lab validation through
              Stellantis and real-road evidence through Mercedes-Benz, which is the clearest public demonstration
              package in this comparison. Against QuantumScape, Factorial looks stronger on current vehicle proof but
              weaker on disclosed separator-process industrialization and licensing economics. Against Solid Power,
              Factorial looks stronger on direct vehicle validation but weaker on disclosed liquidity and less
              differentiated on the value of OEM logos, because BMW, Samsung, PowerCo, and Stellantis all demonstrate
              that partnerships can remain non-exclusive. Against ProLogium, Factorial has the cleaner U.S.-auto story,
              but ProLogium has the stronger public shipment and line-history narrative. Against Toyota, Honda, Samsung,
              and CATL, Factorial simply has less disclosed manufacturing scale and internal capex muscle. The most
              important unresolved gaps are still commercial: no public program volumes, no realized yields, no warranty
              terms, no cell ASPs, and no visibility into whether partner-led scale preserves cost competitiveness
              outside premium niches. Those omissions do not negate the progress, but they do prevent a clean conclusion
              that Factorial's current technical lead is already durable at industrial scale.
