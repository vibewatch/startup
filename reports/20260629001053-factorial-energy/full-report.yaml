      - number: '3.2'
        title: Validation Stage, Customers, and Program Proof
        blocks:
          - type: paragraph
            body: >-
              Factorial's best public evidence is stronger on automotive proof than on scale. Stellantis disclosed
              validation of 77 Ah FEST cells at 375 Wh/kg, more than 600 cycles, 18-minute fast charging, and
              wide-temperature operation. Mercedes-Benz then went further by putting Factorial cells into an EQS-based
              test car, beginning road tests in early 2025 and later disclosing a 1,205 km Stuttgart-to-Malmö drive. Few
              peer programs have matched that combination of automotive-sized cell data plus road-use evidence in
              public. QuantumScape has disclosed B1 sample shipments, Cobra-based separators, and a Ducati-linked
              vehicle program, but its disclosures still sit at sample and pilot-line stage. Solid Power has BMW
              test-vehicle evidence and a three-way evaluation structure with Samsung SDI, yet its model still depends
              on partners turning electrolyte and licenses into actual cells. ProLogium's proof is different: public
              shipment counts, sample history with OEMs, and a claimed GWh-scale line. Toyota, Honda, and Samsung have
              deeper industrial bases, but their public proof is still framed as pilot lines, internal development, or
              future commercialization windows rather than a current public road-validation package tied to a startup
              partner. SES AI is the laggard here because its own filing still warns that lithium-metal EV deployment is
              untested and subject to delays. On customer proof, Factorial's roster is real, but the competitive lesson
              is that partner names matter less than where each program sits on the ladder from cell validation to fleet
              use to repeatable production.
