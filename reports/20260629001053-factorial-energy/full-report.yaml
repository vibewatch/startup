        title: Product Platforms and Customer Workflow
        blocks:
          - type: paragraph
            body: >-
              Factorial’s public product definition is broader than a single solid-state cell SKU. The company presents
              three named assets in 2026: FEST® as the validated battery platform now moving through OEM qualification,
              Solstice™ as the higher-upside all-solid-state architecture, and Gammatron™ as the data and simulation
              layer used to accelerate development. That matters because the real customer workflow is not “buy a
              battery off the shelf.” OEM and integrator customers instead move through joint development, sample
              evaluation, pack integration, validation, and eventually manufacturing scale-up with Factorial and its
              partners. The workflow is therefore part product, part engineering service, and part industrialization
              playbook. Public materials also show that Factorial is intentionally widening the user map beyond premium
              passenger EVs into drones, robotics, defense-adjacent systems, and future consumer-electronics use cases.
              The product thesis is strongest when viewed as a platform stack that combines chemistry, validation data,
              and partner-led deployment rather than as a mature catalog of commercial battery programs.
