companyProfile:
  summary: >-
    Factorial Energy is a greater-Boston solid-state battery developer that became public in June 2026 through its
    merger with Cartesian Growth Corporation III. Its strongest public proof comes from automotive validation:
    Mercedes-Benz has road-tested Factorial-powered vehicles and Stellantis has published high-performance FEST cell
    data before moving into a Dodge Charger Daytona development vehicle. The company is commercializing through a
    partner-led model built around FEST, the higher-upside Solstice platform, and the Gammatron development stack rather
    than a fully self-funded gigafactory strategy. At the same time, Factorial remained pre-revenue as of March 31,
    2026, disclosed a material weakness in internal controls, and only extended its cash position to roughly $116.6
    million after the de-SPAC close, leaving commercialization and dilution discipline as the core underwriting
    questions.
