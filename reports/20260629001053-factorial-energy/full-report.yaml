      - number: '7.3'
        title: Market adoption delay and competitive catch-up risk
        blocks:
          - type: paragraph
            body: >-
              Factorial’s most dangerous external risk is that the rest of the field is not standing still while it
              works through industrialization. TrendForce describes 2025–2026 as an engineering-validation phase and
              says Japanese and Korean players are slightly ahead in pilot-scale validation. Honda already has a
              demonstration production line built to verify mass-production methods. Toyota and Idemitsu continue to
              talk openly about 2027–2028 commercialization and mass-production work on sulfide solid electrolytes.
              Solid Power, while pursuing a different business model, still shows deeper liquidity and a multi-continent
              industrial footprint. Against that backdrop, Factorial’s hybrid FEST path can help near-term
              manufacturability, but it also means the company must convert validation into contracts before peers
              either narrow the performance gap or surpass it with clearer industrial scale. Independent 2026 commentary
              is even blunter: quasi-solid systems may arrive before true all-solid-state batteries, and high-volume
              commercialization for the latter may skew into the early 2030s. If the category adopts more slowly than
              current narratives imply, Factorial’s premium timing assumptions and public-market multiple can compress
              well before the technology is disproven.
            claimRefs:
              - CR028
