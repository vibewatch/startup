  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Set and Technology Architectures
        blocks:
          - type: paragraph
            body: >-
              Factorial should be compared against two different kinds of rivals at once. The first group is direct
              solid-state or lithium-metal developers: QuantumScape, Solid Power, SES AI, and ProLogium. The second
              group is strategic incumbents and internal-build alternatives that can occupy the same OEM program slots:
              Toyota with Idemitsu and PPES, Honda, Samsung SDI, and scaled lithium-ion incumbent CATL. Factorial's own
              positioning is unusually broad for this set. It pitches solid-state batteries not only for eMobility but
              also for defense, aerospace, AI-robotics, and data-center workloads, while still arguing that its
              manufacturing path can remain scalable through partners rather than a fully captive gigafactory stack.
              Relative to that set, the architecture split matters. QuantumScape is a lithium-metal separator platform
              centered on QSE-5 and Cobra-made separators. Solid Power is effectively an electrolyte-and-IP company
              built around sulfide solid electrolyte. SES AI is still framing lithium-metal EV deployment as technically
              possible but commercially uncertain. Toyota and Idemitsu are advancing sulfide-electrolyte production for
              a later OEM launch, while Samsung SDI is pushing an anode-less all-solid-state design. CATL is not the
              closest chemistry match, but it is the most important substitute because buyers can keep purchasing
              rapidly improving liquid-electrolyte batteries at industrial scale. ProLogium stands apart by claiming a
              mass-producible all-inorganic solid-state architecture plus years of shipments. The upshot is that
              Factorial competes less on one chemistry label than on whether it can combine automotive validation,
              manufacturability, and timing better than both startups and incumbents.
