            body: >-
              Manufacturability is the real swing factor in this story. Factorial’s own materials repeatedly emphasize
              compatibility with existing production systems, but the more revealing evidence is how often the company
              talks about partners, process engineering, and yield. The Philenergy MOU is explicit that external
              production infrastructure is part of the scale-up strategy, and it names the specific manufacturing
              capabilities that Factorial believes matter: laser notching, precision stacking, winding, and intelligent
