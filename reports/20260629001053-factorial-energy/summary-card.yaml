summary:
  headline: >-
    Factorial has unusually strong OEM validation for a solid-state battery startup, but the stock already prices in
    strategic option value despite zero revenue, finite runway, dilution overhang, and unresolved manufacturing-scale
    risk.
  overallScore: 5.9
  recommendation: track
  confidence: medium
