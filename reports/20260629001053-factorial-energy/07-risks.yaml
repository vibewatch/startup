- id: governance-runway-and-dilution
  title: Governance, runway, and dilution risk
  body: 'The financial and governance profile remains startup-like despite the new Nasdaq listing. Factorial is still pre-revenue, still burning cash, and still reliant on external capital and partner progress rather than internally generated operating cash flow. The business combination materially improved liquidity, but management’s own plan only funds operations into the first quarter of 2028 and assumes the current operating plan holds. That leaves little margin for a solid-state company if launch programs slip, if more capex is required for pilot or process expansion, or if public-company costs rise faster than expected. The disclosed material weakness is therefore not a footnote; it is a real risk amplifier. Weak disclosure controls can slow financing, complicate partner diligence, and reduce investor confidence right when a development-stage company most needs trust. Receipts from joint development partners being netted against R&D expense rather than recognized as product revenue
    reinforce the same message: commercialization is still economically pre-proof. The main financing risk is not immediate insolvency, but future dilution at a time when the company still has to prove both manufacturing repeatability and contracted demand.'
