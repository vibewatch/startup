- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - risk
  - monitorable trigger
  - threshold / event
  - action implication
  rows:
  - - Runway and dilution risk
    - Cash runway update
    - Management guidance stops covering at least 12 months beyond the next planned program milestone set
    - Assume capital raise or strategic financing is imminent; revisit valuation discipline
  - - Control weakness and disclosure quality
    - Quarterly controls progress
    - No clean evidence of remediation progress by late 2027 or repeat reporting restatements / late filings
    - Escalate governance discount and treat financing friction as a base-case risk
  - - Manufacturability risk
    - Yield and line-quality metrics
    - No audited evidence that pilot yield stays near or above company claims while throughput rises
    - Move commercialization timing assumptions outward and cut probability of automotive-scale gross-margin proof
  - - Program-conversion risk
    - Partner contract depth
    - No disclosed serial-award, minimum-volume, or supply-agreement signal after more road-test milestones
    - Treat validation as strategically interesting but commercially weak
  - - Competitive catch-up risk
    - Peer timeline compression
    - Toyota/Honda/Solid Power or another rival reaches clearer 2027–2028 scale proof while Factorial remains at pilot/JDA stage
    - Reduce moat assumptions and compress exit-multiple expectations
  - - Regulatory / logistics execution risk
    - Shipping and compliance events
    - Any UN 38.3, hazmat, customs, or export-control lapse disrupts sample or pilot shipments
    - Treat operational discipline as a gating risk rather than an administrative footnote
  notes: These are intended as decision triggers rather than static descriptions. Each threshold links to a concrete underwriting action rather than a generic concern.
