    - Commercial path can still fail if validation misses targets or later supply terms stall
    - Request current milestone tracker, acceptance history, and draft follow-on supply framework
  - - DOT / PHMSA lithium-battery transport compliance
    - United States
    - Hazmat rules active now for sample and pilot shipments
    - Medium
    - Medium-High
    - UN 38.3-tested designs, test-summary availability, hazmat packaging and training
    - Any documentation or packaging failure can delay shipments or create penalties before volume scale
    - Review latest UN 38.3 packets, shipping SOPs, carrier exceptions, and training logs
  - - Public legal-proceedings visibility
    - United States
    - Reviewed retained 2026 filings did not highlight a defining lawsuit or enforcement action, but 8-K points readers to incorporated prospectus legal sections
    - Low to medium
    - Medium
    - Current retained public file appears quieter than many listed startups on litigation headlines
    - Residual uncertainty remains until definitive legal schedules and counsel views are reviewed
    - Pull the definitive prospectus legal-proceedings appendix and management representation letters
  notes: Rows are ordered by likely transmission into financing, partner trust, or execution. The current public file suggests limited headline litigation, so the highest legal-risk items are controls, contract execution, and transport compliance.
