  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: contract-economics
    missingEvidence: Public minimum purchase commitments, take-or-pay terms, royalty rates, and serial-award volumes for Mercedes, Stellantis, Hyundai/Kia, PowerCo, and Karma.
    whyItMatters: Without commercial terms, investors cannot distinguish validation theater from bankable demand or quantify customer concentration by revenue.
    diligencePath: Request executed JDAs, statements of work, milestone schedules, and any volume or minimum-purchase side letters by partner.
    relatedQuestionRefs:
    - QR006
    - QR012
    - QR026
    - QR028
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: manufacturing-yield
    missingEvidence: Audited pilot-line yield, scrap rate, throughput, capex per GWh-equivalent, and evidence that 85% pilot yield is repeatable outside company-authored materials.
    whyItMatters: Manufacturability is the dominant thesis variable, and unaudited company blog claims are not enough to underwrite scale economics.
    diligencePath: Request plant dashboards, independent QA reports, partner yield reviews, and any line-capacity or scrap-rate board materials.
    relatedQuestionRefs:
    - QR010
    - QR027
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: legal-proceedings-schedule
    missingEvidence: The full legal-proceedings schedule from the definitive prospectus or later periodic filings, plus counsel views on whether any ordinary-course matters could become material after listing.
    whyItMatters: The 8-K incorporates legal-proceedings sections by reference, so a headline-only review can miss small but accumulative public-company legal exposure.
    diligencePath: Pull the definitive prospectus legal-proceedings appendix and management representation letters from listing counsel.
    relatedQuestionRefs:
    - QR021
    - QR022
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: transport-and-compliance
    missingEvidence: UN 38.3 test summaries, hazmat shipping SOPs, export-control classifications, and any customs or product-safety audits for partner shipments.
    whyItMatters: Cross-border sample and pilot shipments can become a gating item long before mass production if documentation or packaging discipline is weak.
    diligencePath: Request the latest UN 38.3 packets, hazmat training records, export classifications, and any carrier exception logs.
    relatedQuestionRefs:
    - QR020
    - QR023
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: post-close-burn-and-dilution
    missingEvidence: Current quarterly burn, updated 2026–2028 capex plan, fully diluted share count, and management contingency plan if partner or launch timing slips.
    whyItMatters: Runway into Q1 2028 is only as good as the current operating plan, and any acceleration in burn or slower conversion can trigger dilution sooner than the public base case.
    diligencePath: Request board-approved operating plan, monthly cash bridge, cap table, warrant/earnout schedule, and downside financing scenarios.
    relatedQuestionRefs:
    - QR002
    - QR025
    relatedTableRefs:
    - TR005
