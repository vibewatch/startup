- id: legal-regulatory-status-and-what-to-watch
  title: 'Legal and regulatory status: limited public overhang, real compliance duties'
  body: 'Reviewed 2026 public materials do not point to an obvious active lawsuit, recall, or enforcement action as the defining risk. That is important because it keeps this chapter anchored on operational, technology, and commercial execution rather than inventing legal drama. But the absence of a visible lawsuit should not be confused with a clean no-risk legal file. Factorial’s 8-K explicitly incorporates prospectus legal-proceedings sections by reference, so diligence still needs the full schedules. More importantly, the company’s actual regulatory burden is practical and near-term: public-company disclosure remediation, cross-border contract compliance, and lithium-battery transport rules. The PowerCo contract assigns export and customs responsibilities to Factorial for shipped material, while PHMSA treats lithium batteries as hazardous materials and requires UN 38.3-tested designs and compliant transport documentation. In other words, the public legal picture looks manageable today,
    but execution can still be tripped by compliance mistakes, especially as sample shipments and pilot programs scale across borders. The right legal conclusion is therefore “no obvious public action found, but meaningful compliance plumbing still matters.”'
