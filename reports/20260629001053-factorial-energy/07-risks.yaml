- id: partner-and-program-concentration
  title: Partner concentration, contract depth, and program slippage risk
  body: 'Factorial’s partner roster is impressive, but it is also concentrated. Mercedes, Stellantis, Hyundai/Kia, PowerCo, Philenergy, and Karma carry a disproportionate share of the public proof burden. That concentration matters because most of the visible relationships are still structured around development, validation, milestones, or statements of work rather than disclosed minimum purchase obligations. The PowerCo JDA is especially revealing: it is a milestone-and-deliverable contract with payments and termination rights, while any later supply relationship is conditional on technical success and future agreements. Karma offers a more concrete launch narrative, yet even that program points to late 2027 and itself acknowledges an earlier delay before Factorial entered the picture. Specialty verticals such as drones and robotics widen the surface area but do not yet offset the dependence on a handful of automotive or strategic manufacturing partners. Investors therefore should treat
    customer concentration here as program concentration and partner-execution concentration, not revenue concentration, because there is still no disclosed recurring revenue base to diversify against.'
