- id: adoption-constraints-and-share-capture
  title: Adoption Constraints, Manufacturing Friction, and Share-Capture Risk
  body: 'The strongest disconfirming evidence in this market is not demand collapse but commercialization friction. DOE still frames battery success around cost below $100/kWh ultimately to $80/kWh, 300-mile range, and 15-minute charging, so solid-state has to compete against a moving incumbent benchmark rather than a fixed one. BNEF says batteries remain the main EV cost component, that China retains manufacturing and supply-chain cost advantages, and that BEVs in major European markets still carry a 17% price premium over comparable ICE vehicles. Honda’s demonstration line exists specifically to verify costs and mass-production methods, while BMW and Solid Power say further development is required to make all-solid-state cells competitive in a full storage system. IEEE Spectrum is more explicit still: commercialization targets may keep slipping because scaling the chemistry can take far longer than lab or pilot announcements imply. Taken together, the evidence suggests solid-state may
    win early share in premium or mission-critical segments, but broad share capture this decade is far from assured if improved lithium-ion chemistries keep getting cheaper and good enough for most buyers.'
