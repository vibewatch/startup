  evidenceGaps:
  - type: missing-source
    severity: material
    topic: solid-state-sam-gap
    missingEvidence: A clean third-party dataset isolating 2026-2030 TAM, SAM, and SOM for premium automotive solid-state cells plus defense, robotics, and data-center adjacencies.
    whyItMatters: Without a clean niche-market isolate, investors can easily mistake broad EV battery headlines for Factorial’s realistic near-term addressable market.
    diligencePath: Request management’s internal segmentation model, then reconcile it against named customer programs, pilot volumes, and external analyst assumptions.
    relatedQuestionRefs:
    - QM005
    - QM022
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-and-volume-gap
    missingEvidence: Customer-level pilot volumes, launch ramps, battery ASPs, and any premium-to-incumbent pricing assumptions for Mercedes, Stellantis, Karma, drones, robotics, or storage programs.
    whyItMatters: Market attractiveness does not convert into valuation support unless the company can show bankable volume and price realization in its target wedge.
    diligencePath: Request customer program sheets, signed supply or JDA economics, and the revenue bridge from pilot validation to production spend.
    relatedQuestionRefs:
    - QM023
    - QM025
    relatedTableRefs:
    - TM003
    - TM004
  - type: private-evidence-only
    severity: material
    topic: manufacturing-yield-gap
    missingEvidence: Pilot-line yield, scrap, throughput, pressure-management, and pack-integration economics for Factorial’s manufacturing path.
    whyItMatters: Most public evidence shows promise at validation stage, but manufacturing economics determine whether solid-state can capture broad share or stay trapped in low-volume pilots.
    diligencePath: Request pilot-line KPI dashboards, line-reuse assumptions, and costed manufacturing models from Factorial and any production partners.
    relatedQuestionRefs:
    - QM013
    - QM021
    - QM024
    relatedTableRefs:
