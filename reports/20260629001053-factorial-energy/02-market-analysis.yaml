tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Premium / performance passenger EV solid-state cells
    - Cell, module, and pack spend for premium or performance EV programs where range, fast charging, safety, or weight can justify chemistry change
    - Mass-market commodity BEV packs, fleet commodity procurement, most PHEV / REEV battery packs
    - Luxury and performance OEM battery, vehicle, and procurement teams
    - Clearest initial automotive wedge for Factorial-style technology
  - - OEM demo fleets and validation vehicles
    - Engineering-validation cells, pack integration work, development vehicles, and low-volume pilot procurement
    - Retail vehicle demand before start-of-production or scaled sourcing
    - OEM engineering, product-planning, and validation budgets
    - Bridge between technical proof and contracted production programs
  - - Defense / UAV / robotics high-spec batteries
    - Mission-critical cells and packs where weight, low-temperature operation, high power, or range matter disproportionately
    - Commodity consumer-drone cells and general industrial batteries
    - System integrators, program offices, and industrial robotics OEMs
    - Adjacency where performance can outrank lowest-cost chemistry
  - - Hyperscale data-center / stationary-storage adjacency
    - High-spec storage modules where safety, footprint, uptime, or density can matter for next-generation energy systems
    - Broad commodity grid-storage procurement centered on lowest-cost LFP systems
    - Hyperscalers, storage developers, and infrastructure-energy teams
    - Real adjacency, but public commercial evidence is still thin
  - - Manufacturing-enablement layer
    - Process engineering, line reuse, module integration, and production-partner capability needed to make solid-state bankable
    - Virgin mining, commodity cathode sales, and generic battery equipment spend unrelated to solid-state commercialization
    - Cell developer plus OEM or manufacturing partner capex owners
    - Critical because adoption depends on manufacturability as much as cell performance
  notes: This table defines Factorial’s market as a performance-constrained wedge inside broader battery demand; excluded categories are shown explicitly so readers do not mistake the broad EV TAM for the company’s near-term SAM.
