- id: sizing-lenses-and-demand-growth
  title: Sizing Lenses and Battery-Demand Growth
  body: 'Top-down demand growth is real, but it is too broad to be treated as Factorial’s immediate market. BloombergNEF expects 23.3 million passenger EV sales in 2026, or 27% of new car sales, and over half of passenger vehicle sales to be electric by 2035. RMI similarly summarizes recent outlooks as showing more than one in four car sales becoming electric in 2025, while ICCT says announced battery production capacity still exceeds expected EV demand through 2030 and could cover 130% of U.S. domestic demand by 2030 on an announced basis. Those facts imply a large and growing battery backdrop, but they also imply that overall market growth alone does not guarantee share for a new chemistry. A better sizing approach is layered: the broad TAM is global EV and stationary-storage battery demand; the narrower SAM is high-performance vehicle and specialty-application demand where range, charge time, weight, or thermal resilience justify a premium; and the initial SOM is the subset of premium
    launches, demo fleets, and specialty deployments that can tolerate pilot volumes and learning-curve costs. Public sources do not provide a clean standalone dollar figure for that wedge, so this chapter preserves multiple lenses instead of forcing one blended TAM number.'
