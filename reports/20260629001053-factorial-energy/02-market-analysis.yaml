- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Global EV sales growth and rising electric share
    - positive
    - near-to-long term
    - Expands the broad battery backdrop that premium solid-state can grow inside
    - Which premium or performance subsegments are actually battery-constrained enough to switch chemistry?
  - - Stationary-storage demand growth
    - positive
    - mid term
    - Supports data-center and energy-storage adjacency even if passenger EVs remain the primary wedge
    - Does Factorial have named storage customers, integrators, or design wins beyond narrative positioning?
  - - Premium OEM demand for range and fast-charging differentiation
    - positive
    - near term
    - Makes luxury or performance launches more plausible than immediate mass-market adoption
    - What vehicle programs have binding milestones, volumes, and launch gates?
  - - Potential reuse of existing lithium-ion equipment
    - positive
    - near term
    - Reduces capex shock if real line compatibility holds
    - What percentage of line reuse survives full industrial qualification and yield targets?
  - - Falling incumbent battery costs and China scale advantage
    - negative
    - current
    - Makes mainstream buyer switching harder unless solid-state is both better and bankable
    - What delivered pack-cost premium can premium OEMs tolerate by program?
  - - Manufacturing yield, pressure control, and cell-expansion management
    - negative
    - current
    - Prototype success does not guarantee competitive system economics
    - What are pilot-line yields, throughput, scrap, and pressure-management requirements?
  - - Battery-size optimization and PHEV / REEV mix shift
    - negative
    - near term
    - Smaller packs reduce the share of demand that needs expensive next-generation cells
    - How much of targeted customer demand is for large premium BEVs rather than smaller-battery hybrids?
  - - Lack of public volumes, ASPs, and conversion rates from pilots to SOP
    - negative
    - current
    - Prevents clean SOM and revenue translation from market headlines
    - Request customer-by-customer volume ramps, ASPs, and conversion assumptions from management
  notes: The same market can be growing and still be hard for solid-state entrants to win. This table separates demand expansion from chemistry-selection friction and asks for the private data needed to bridge that gap.
