    - id: specialty-adjacent
      label: Specialty adjacent deployments
      description: Drones, robotics, defense-adjacent, or storage uses can branch off once performance fit is proven.
    - id: broad-scale
      label: Broader scale share
      description: Mass-market capture only if cost, yield, and manufacturability become competitive.
