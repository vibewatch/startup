- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / process
  - Role in system
  - Primary dependency
  - Key risk
  rows:
  - - FEST quasi-solid / lithium-metal cell system
    - Current validated electrochemical platform for automotive programs
    - OEM qualification, pack integration, and stable interfacial behavior
    - Cell metrics may not fully translate to pack-level cost and durability
  - - Solstice sulfide all-solid-state system
    - Higher-upside future platform for density, safety, and thermal resilience
    - Dry cathode execution, sulfide-electrolyte manufacturability, customer qualification
    - Architecture claims are ahead of public validation depth
  - - Lithium-metal / high-energy anode pathway
    - Enables higher gravimetric energy density versus incumbent Li-ion
    - Stable interfaces, dendrite control, and moisture-safe handling
    - Independent sources still flag dendrite, stress, and safety complexity
  - - Dry cathode / dry coating manufacturing
    - Cuts solvents and some energy-intensive process steps
    - Process control, formation-path changes, and equipment integration
    - Could be difficult to scale repeatably without yield loss
  - - Digital twin and traceability layer
    - Predicts performance, tunes charging, and supports faster iteration
    - High-quality lab data, model calibration, and manufacturing telemetry
    - Company claims outpace public third-party benchmarks
  - - Partner manufacturing and integration layer
    - Turns validated cells into pack and vehicle programs without a captive gigafactory
    - Philenergy capabilities, OEM pack engineering, and hiring depth
    - Execution is shared across external partners rather than fully owned
  notes: The architecture stack blends chemistry, process, data, and partner infrastructure; diligence should not separate battery performance from the production system that makes it repeatable.
