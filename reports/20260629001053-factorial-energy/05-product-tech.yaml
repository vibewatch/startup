  rows:
  - - Published FEST validation metrics
    - Present
    - 77Ah, 375 Wh/kg, >600 cycles, 18-minute 15%-90% charge, -30°C to 45°C
    - Shows the company has public, automotive-size proof beyond coin-cell claims
    - Protocol details and retention curves are not public
  - - Mercedes and Stellantis vehicle integration
    - Present
    - EQS road-test program and Dodge Charger Daytona development vehicle
    - Demonstrates cell-to-pack and vehicle-level engineering work
    - No public warranty, abuse-test, or pack-pressure targets
  - - Yield and process traceability claims
    - Present but company-authored
    - ~85% pilot yield plus Gammatron manufacturing traceability claims
    - Suggests industrialization discipline, not just chemistry progress
    - No public partner audit or filing-level corroboration
  - - Safety and compliance signaling
    - Partial
    - Solstice EUCAR 2 target and partner statements on stability / passive cooling
    - Shows safety is part of the product message
    - No public third-party certification or homologation package
  - - External standards and engineering benchmarks
    - Adverse context exists
    - Exponent, Fraunhofer, Toyota, and Honda all highlight unresolved commercialization hurdles
    - Prevents over-reading company PR as if commercialization were solved
    - Confirms the need for deeper diligence before underwriting scale claims
  notes: Quality evidence is meaningful but incomplete; public trust signals still rely heavily on company and partner statements rather than independent certification packages.
