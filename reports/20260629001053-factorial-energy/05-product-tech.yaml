- id: safety-quality-controls-and-open-risks
  title: Safety, Quality Controls, and Open Technical Risks
  body: 'The main technical risk is that solid-state cell promise still has to survive pack-level reality. Independent sources remain clear that stack pressure, interfacial resistance, higher operating-temperature demands, moisture sensitivity, durability cracking, and new safety-standard needs can all delay commercialization even when a cell metric looks strong. Toyota still identifies durability as a core challenge, while Honda’s pilot line shows how much process engineering must be solved before mass production. Factorial does have real quality signals: OEM-linked validation, growing process-engineering hiring, and company claims that Gammatron improves traceability and cycle-life optimization. But the public record still stops short of what an underwriting-grade diligence file would require. There is no public disclosure of pack-pressure targets, external abuse-test reports, homologation status, warranty thresholds, audited line economics, or commercial pricing and volume terms. Those
    omissions do not erase the technical progress, but they do mean the engineering-risk burden remains materially open, especially for Solstice and for any claim that partner manufacturing is already de-risked.'
