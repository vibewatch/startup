  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pilot-yield
    missingEvidence: Independent line-yield, scrap, throughput, and rework data that corroborate the company-reported ~85% pilot yield.
    whyItMatters: Yield determines whether the partner-manufacturing model can reach acceptable unit economics instead of staying in expensive pilot mode.
    diligencePath: Request time-series pilot-line dashboards or partner-reviewed manufacturing KPI decks covering yield, scrap, throughput, and first-pass quality by cohort.
    relatedQuestionRefs:
    - QE010
    - QE022
  - type: missing-source
    severity: material
    topic: cycle-life-protocol
    missingEvidence: Detailed test protocol, retention endpoint, sample size, temperature, pressure, and duty-cycle conditions behind the published >600-cycle FEST result.
    whyItMatters: A headline cycle count is hard to underwrite without knowing whether the test conditions map to automotive operating realities.
    diligencePath: Request the validation report or OEM-reviewed test matrix behind the Stellantis milestone, including capacity-retention curves and failure modes.
    relatedQuestionRefs:
    - QE003
    - QE014
  - type: missing-source
    severity: material
    topic: pack-integration-controls
    missingEvidence: Disclosed pack-pressure targets, compression strategy, abuse-test outputs, coolant design choices, and warranty criteria for FEST or Solstice packs.
    whyItMatters: Solid-state cells can lose practical value if pack-level pressure, thermal control, or crash safety requirements add weight, cost, or failure risk.
    diligencePath: Ask for pack design requirements, validation protocols, and post-test teardown summaries from the Mercedes and Stellantis vehicle programs.
    relatedQuestionRefs:
    - QE019
    - QE020
    relatedTableRefs:
    - TE004
  - type: missing-source
    severity: material
    topic: solstice-readiness
    missingEvidence: A/B-sample status, cell format, independent validation metrics, and customer qualification milestones for Solstice.
    whyItMatters: Solstice drives the long-term upside case, but the public record is still architecture-heavy and validation-light relative to FEST.
    diligencePath: Request Solstice sample history, cell format data, qualification gates, and any third-party test results from Mercedes-Benz or manufacturing partners.
    relatedQuestionRefs:
    - QE015
    - QE016
    relatedTableRefs:
    - TE005
  - type: missing-source
    severity: material
    topic: commercial-readiness
    missingEvidence: Program volumes, SOP commitments, ASP or licensing economics, and field-service obligations for FEST or Solstice launches.
    whyItMatters: Technical validation alone does not prove that Factorial can convert pilot programs into repeatable, profitable product revenue.
    diligencePath: Request signed program milestones, pricing frameworks, warranty terms, and partner volume assumptions for the first commercial launches.
    relatedQuestionRefs:
    - QE022
    - QE025
    relatedTableRefs:
    - TE002
    - TE005
  - type: missing-source
    severity: material
    topic: safety-certification
    missingEvidence: Third-party safety certification, homologation, or regulator-facing test reports for Factorial cells or packs.
    whyItMatters: Without external certification or test reports, investors must rely mainly on company and partner statements about safety and thermal resilience.
    diligencePath: Request certification pathways, external lab reports, and OEM homologation packages covering abuse, penetration, crush, and thermal-runaway testing.
    relatedQuestionRefs:
    - QE019
    - QE025
    relatedTableRefs:
    - TE004
