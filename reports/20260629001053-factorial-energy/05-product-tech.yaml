- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Factorial solution
  - Measurable benefit
  - Current limitation
  rows:
  - - Premium EV platform team needs longer range without major pack growth
    - Validate cells, design pack, tune vehicle controls, then road-test in fleet
    - FEST validation plus OEM co-development and development-vehicle integration
    - Published 375 Wh/kg, fast charging, cold-weather operation, and road-test evidence
    - No public SOP volume or warranty disclosure
  - - Advanced battery group needs next-step all-solid-state architecture
    - Screen future chemistry, production path, and safety envelope before broad vehicle qualification
    - Solstice all-solid-state platform with dry cathode and partner-manufacturing narrative
    - Higher stated energy-density ceiling and higher thermal ceiling than current Li-ion
    - Public validation is still thinner than FEST
  - - Battery program manager needs faster validation loops
    - Run long cycle tests and simulation work before partner signoff
    - Gammatron digital twin and protocol optimization
    - Two-week-to-forecast claim and cycle-life tuning claim compress engineering loops
    - Impact is company-reported, not independently audited
  - - Drone or robotics integrator needs lighter battery system for high-spec missions
    - Prototype cell integration with specialty system integrators
    - Factorial partner network for drone-system integration across three continents
    - Potential weight, range, and temperature advantages in mission-critical profiles
    - Public program economics and deployed field data are sparse
  - - Passenger-vehicle launch team needs first U.S. production program
    - Move from validation hardware into launch vehicle planning
    - Karma late-2027 passenger-vehicle program using Factorial batteries
    - Creates a visible bridge from validation to named production target
    - Volume, pricing, and actual SOP obligations are undisclosed
  notes: This workflow table focuses on how Factorial is bought and deployed in practice; the weak point is still conversion from validation milestones into contracted commercial programs.
