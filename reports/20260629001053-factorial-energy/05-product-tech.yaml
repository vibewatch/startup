- id: TE001
  title: Product module / asset matrix
  columns:
  - Asset
  - Primary user
  - Current public status
  - Differentiation
  - Diligence gap
  rows:
  - - FEST®
    - Automotive OEM battery and vehicle teams
    - Externally validated 77Ah platform with Mercedes and Stellantis programs
    - Best-supported public proof set; lithium-metal / quasi-solid positioning with automotive-size metrics
    - Need full cycle-life protocol, warranty criteria, and commercial volume data
  - - Solstice™
    - OEM advanced-battery teams; future consumer-electronics partners
    - All-solid-state platform announcement plus manufacturing MOU
    - Higher claimed energy density, >90°C stability, dry cathode / dry coating story
    - Need sample status, validation dataset, and customer qualification milestones
  - - Gammatron™
    - Factorial internal teams and select co-development partners
    - Launched as tech-enabled service in 2025
    - Digital twin, early-performance prediction, fast-charge optimization, electrolyte discovery
    - Need independent evidence of impact beyond company case studies
  - - Partner manufacturing playbook
    - OEMs and production partners
    - Active strategy via Philenergy and existing-line compatibility messaging
    - Capital-light scale-up route instead of first-party gigafactory spend
    - Need named line ownership, throughput, and economic responsibilities
  - - Multi-end-market integration programs
    - Automotive, drone, robotics, and defense-adjacent integrators
    - Publicly expanding but mostly pre-commercial
    - Lets Factorial learn in high-spec niches before broad auto scale
    - Need program sizes, economics, and conversion from pilots to revenue
  notes: Rows separate chemistry platforms from enabling assets because Factorial’s product offering is part cell platform and part industrialization capability.
