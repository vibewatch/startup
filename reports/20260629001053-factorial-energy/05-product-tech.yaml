- id: manufacturability-dry-cathode-and-partner-production
  title: Manufacturability, Dry Cathode, and Partner Production
  body: 'Manufacturability is the real swing factor in this story. Factorial’s own materials repeatedly emphasize compatibility with existing production systems, but the more revealing evidence is how often the company talks about partners, process engineering, and yield. The Philenergy MOU is explicit that external production infrastructure is part of the scale-up strategy, and it names the specific manufacturing capabilities that Factorial believes matter: laser notching, precision stacking, winding, and intelligent assembly. The company’s yield blog goes even further, saying pilot yield climbed from 10% to roughly 85% and arguing that yield is the true commercial readiness metric. Yet that same figure is still company-authored, not publicly audited by partners or filings. Gammatron fits this same industrialization story. It is not just a research flourish; it is positioned as a digital-twin and traceability layer that helps shorten validation cycles, tune charging protocols, and watch
    process deviations across the production chain. The product-tech takeaway is that Factorial is trying to win as much on process control and partner orchestration as on electrolyte chemistry.'
