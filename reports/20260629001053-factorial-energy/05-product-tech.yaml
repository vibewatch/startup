chapter:
  number: 5
  title: Product & Technology
  summary: Factorial Energy’s product story is strongest where FEST has already moved from cell validation into Mercedes and Stellantis vehicle programs, with publicly disclosed 77Ah, 375 Wh/kg, >600-cycle, 18-minute fast-charge, and -30°C to 45°C metrics. Solstice and Gammatron widen the upside through an all-solid-state, dry-cathode architecture and an AI-enabled digital-twin layer, but public manufacturability evidence is still thinner than the marketing claims, especially around audited yield, pack-level controls, and commercial launch economics.
sections:
- id: product-platforms-and-customer-workflow
  title: Product Platforms and Customer Workflow
  body: 'Factorial’s public product definition is broader than a single solid-state cell SKU. The company presents three named assets in 2026: FEST® as the validated battery platform now moving through OEM qualification, Solstice™ as the higher-upside all-solid-state architecture, and Gammatron™ as the data and simulation layer used to accelerate development. That matters because the real customer workflow is not “buy a battery off the shelf.” OEM and integrator customers instead move through joint development, sample evaluation, pack integration, validation, and eventually manufacturing scale-up with Factorial and its partners. The workflow is therefore part product, part engineering service, and part industrialization playbook. Public materials also show that Factorial is intentionally widening the user map beyond premium passenger EVs into drones, robotics, defense-adjacent systems, and future consumer-electronics use cases. The product thesis is strongest when viewed as a platform stack
    that combines chemistry, validation data, and partner-led deployment rather than as a mature catalog of commercial battery programs.'
