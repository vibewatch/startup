- id: dilution-warrants-and-unlock-pressure
  title: Dilution, Warrants, and Unlock Pressure
  body: The next valuation question is not just what the company is worth, but how much of that value common shareholders can actually keep as the capitalization stack opens up. The closing 8-K and proxy/prospectus show 107,023,245 shares outstanding in the actual-redemptions case, plus 13.8 million public warrants and 6.8 million private warrants struck at $11.50, plus 19.6 million options and 5.1 million RSUs. If all warrants exercised, Factorial would receive useful gross cash, but basic share count would still rise by about 19%; adding options and RSUs pushes the basic-plus-awards share base to roughly 152.4 million, about 42% above basic. Overhang is not only numerical. The company agreed to resale registration for approximately 80.6 million Series A shares, or about 88.1% of issued and outstanding Series A shares after closing. Lock-ups are staggered—25% at 180 days, 25% at 270 days, and 50% at one year—with early release if the 20-day VWAP reaches $12, $14, and $16. FAC closed only
    slightly below the first $12 threshold, so any modest rerating can accelerate supply rather than purely reward incumbent holders. That warrants an execution discount in any scenario analysis.
