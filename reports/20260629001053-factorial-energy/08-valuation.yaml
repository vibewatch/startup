- id: TV004
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - What has to be true
  - Equity-value framing
  - Probability signal
  - Key failure mode
  rows:
  - - Bull
    - Mercedes, Stellantis, Karma, and PowerCo pathways convert into visibly binding commercial programs; pricing and burn disclosures improve; common stock sustains levels that make warrant cash additive rather than purely dilutive
    - ~$1.6B to $2.3B equity value as a strategic-option premium on contracted commercialization
    - Low to medium because public proof is still milestone-heavy rather than contract-heavy
    - Launch slips or unlock supply absorbs any rerating
  - - Base
    - Runway still reaches into 2028, partner milestones continue, and 2027 launch narrative survives without hard revenue proof
    - ~$1.0B to $1.3B equity value, roughly around the current market range
    - Highest probability because it requires operational continuity more than a breakthrough
    - Market eventually demands clearer economics before paying the same multiple
  - - Bear
    - Commercialization timing drifts toward the early 2030s, public markets de-rate pre-revenue battery names, or dilution/selling pressure overwhelms demand
    - ~$0.5B to $0.8B equity value, closer to cash-plus-option framing than to a growth premium
    - Medium because adverse sources already question near-term high-volume timing
    - Burn rises and follow-on financing arrives before binding demand
  - - Unsupported model caveat
    - A DCF or precise revenue-multiple target would require price, volume, margin, capex, and contract inputs the public record does not contain
    - Scenario bands are analytical brackets, not fair-value targets
    - Certain
    - False precision would overstate diligence confidence
  notes: All scenario ranges are analytical estimates in USD equity value, built from current market pricing, peer valuation ranges, disclosed liquidity, and commercialization timing. They should not be read as company-guided targets.
