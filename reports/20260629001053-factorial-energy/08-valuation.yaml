  title: Scenario Bands Are Framing Tools, Not Fair-Value Targets
  body: The chapter avoids DCF precision because public sources do not disclose prices, launch volumes, gross margins, or capex cadence by commercial lane. The bull, base, and bear bands are explicitly analytical ranges built from disclosed liquidity, peer valuation, and milestone timing.
  claimRefs:
