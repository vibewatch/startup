- id: TV003
  title: Dilution, warrant, and unlock-overhang table
  columns:
  - Overhang item
  - Public quantity / term
  - Transmission to valuation
  - What would improve the read
  rows:
  - - Public warrants
    - 13.8M warrants at $11.50 strike
    - Adds potential dilution if the equity stays above strike while also offering cash proceeds
    - Clarify expected exercise behavior and any redemption terms
  - - Private warrants
    - 6.8M warrants at $11.50 strike
    - Further enlarges fully diluted share count and overhang
    - Provide holder detail and likely monetization path
  - - Employee equity awards
    - 19.64M options plus 5.12M RSUs
    - Means basic share count understates eventual common-equity exposure
    - Disclose vesting cadence and refresh expectations
  - - Registration rights
    - ~80.6M Series A shares; ~88.1% of outstanding A shares
    - Potentially accelerates resale supply once registrations are effective
    - Show actual registration timing and insider-sale intentions
  - - Lock-up schedule
    - 25% at 180 days, 25% at 270 days, 50% at 1 year; early release at $12/$14/$16 VWAP
    - Rising price can bring forward supply instead of only raising upside
    - Monitor VWAP thresholds and filed selling plans
  - - Current warrant/common setup
    - FAC closed at $11.42 while FACWW closed at $1.45 on 2026-06-26
    - Shows the market is close to the first unlock and warrant-in-the-money zone but not through it decisively
    - Need sustained trading support above thresholds, not one-day prints
  notes: The table mixes contractual dilution sources with market-structure supply pressure because both affect realized common-equity returns.
