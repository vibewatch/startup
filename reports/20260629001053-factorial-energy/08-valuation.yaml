  - CV039
  - CV040
  - CV041
- calloutType: insight
  title: Strategic Option Value Is Real but Common-Equity Capture Is Conditional
  body: Mercedes, Stellantis, Karma, and PowerCo create genuine option value around commercialization, but that upside reaches common shareholders only if launch timing improves faster than unlock supply, burn, and dilution expand.
