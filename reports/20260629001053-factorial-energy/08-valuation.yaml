- id: peer-framing-and-scenario-valuation
  title: Peer Framing, Strategic Option Value, and Scenario Valuation
  body: Public comps do not prove fair value here, but they do show what the market is rewarding and what it is refusing to underwrite. QuantumScape carried about a $4.4 billion market cap and approximately $904.7 million of cash, cash equivalents, and marketable securities at March 31, 2026, leaving a much larger liquidity buffer than Factorial. Solid Power closed at a roughly $582.7 million market cap yet reported $435.3 million of total liquidity and $3.1 million of Q1 revenue, so the market is valuing it only modestly above cash despite a more explicitly capital-light model. SES AI carried about a $332.2 million market cap and approximately $178 million of liquidity while guiding to $30 million to $35 million of 2026 revenue. Factorial sits above Solid Power and SES on public valuation despite disclosing zero revenue, which implies the market is paying for strategic option value attached to Mercedes road tests, Stellantis validation, late-2027 Karma timing, and future PowerCo conversion
    rather than current economics. That option value is real, but it should be scenario-framed rather than reverse-engineered into false DCF precision. The bull, base, and bear bands below are therefore analytical brackets anchored on current market pricing, peer de-rating, and disclosed commercialization timing—not supported fair-value targets.
