company:
  name: Factorial Energy
chapter:
  number: 8
  title: Valuation
  summary: Factorial traded near a $1.22 billion public-market value on June 26, 2026, implying roughly $1.11 billion of enterprise value against the last disclosed post-close cash balance of about $116.6 million despite zero revenue and a sizeable warrant, option, RSU, registration-rights, and lock-up overhang. The most defensible read is that the market is paying for strategic option value tied to Mercedes, Stellantis, Karma, and PowerCo rather than current economics, which supports a track / stretched stance until commercialization terms, burn, and dilution are better disclosed.
sections:
- id: public-market-value-and-pre-revenue-reality
  title: Public-Market Value and the Pre-Revenue Reality
  body: The starting point for valuation is that Factorial is already public, already liquid enough to be marked daily, and still fundamentally pre-revenue. Yahoo Finance and Stock Analysis both showed FAC closing at $11.42 on June 26, 2026 with roughly 107.0 million shares outstanding and an equity market value of about $1.22 billion. That is only modestly below the roughly $1.3 billion equity framing used when the company listed on Nasdaq, even though the March 31, 2026 financial record still showed no revenue to date, an $8.6 million quarterly net loss, and $6.1 million of operating cash burn. Management also said the post-close capital plan funds operations only into Q1 2028. Using the company-disclosed approximately $116.6 million of cash after closing, the public market is effectively valuing the operating business at roughly $1.10 to $1.11 billion before any proof of pricing, gross margin, or serial-production demand. That means valuation cannot be defended with conventional EV/revenue
    or DCF methods. The current quote is better understood as a market-clearing price for option value on commercialization timing and strategic partner conversion.
