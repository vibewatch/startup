- id: recommendation-and-diligence-conditions
  title: Recommendation and the Conditions That Would Change It
  body: 'The price-sensitive conclusion is track, not buy. Factorial has enough technical and partner proof to justify staying on the list, but not enough public economic proof to justify underwriting the current market cap as a bargain. A buy call would require evidence that is simply not public today: contract-level pricing or royalty terms, updated post-close burn and capex cadence, a cleaner fully diluted cap table, and at least one binding commercial volume path from an OEM or manufacturing partner. Adverse sources reinforce that caution. TrendForce still places the sector in engineering validation, while Battery Technology Online argues that true high-volume solid-state commercialization is more realistic in the early 2030s than the late 2020s. Zacks and AInvest also frame Factorial as less proven than established public peers and flag the dilution mechanics of the SPAC structure. The cleanest way to express the valuation stance is stretched but not uninteresting: the stock is not
    obviously irrational, because strategic option value exists, but it is expensive relative to the evidence currently disclosed. The thesis breaks if timing slips, if post-lock-up supply swamps demand, or if burn rises without contract conversion.'
