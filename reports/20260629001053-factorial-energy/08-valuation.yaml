- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Current read
  - Evidence anchor
  - Decision implication
  rows:
  - - Recommendation
    - Track
    - Strategic option value is real, but disclosed economics are still missing
    - Do not chase the current quote as if commercialization is already underwritten
  - - Confidence
    - Medium
    - Public filings and quote pages are clear on valuation and liquidity, but commercial contract economics are absent
    - Enough evidence to rate the setup, not enough to issue a precision buy target
  - - Risk rating
    - High
    - Pre-revenue status, dilution overhang, and timing risk dominate upside
    - Treat the stock as milestone-sensitive rather than compounding-like
  - - Valuation stance
    - Stretched
    - Current market cap remains close to the de-SPAC benchmark despite zero revenue
    - Require either de-rating or materially better evidence before upgrading
  - - Entry discipline
    - Evidence-led only
    - Wait for disclosed pricing, volumes, burn trajectory, or a materially lower market cap
    - Upgrade only if economics improve faster than dilution and supply overhang
  notes: This is a decision table, not a fair-value model. The conclusion is anchored on current public valuation, disclosed liquidity, commercialization timing, and dilution mechanics.
