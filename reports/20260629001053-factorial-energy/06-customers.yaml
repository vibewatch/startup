- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration risk
  - Impact
  - Current public signal
  - Diligence path
  rows:
  - - Mercedes road tests could convert into broader OEM sourcing
    - If Mercedes stops at validation, the best reference account still may not produce recurring revenue
    - High impact on credibility and future awards
    - Strong technical proof but no public serial-award disclosure
    - Ask for sourcing stage, nomination status, and target launch vehicle
  - - Stellantis Charger development vehicle could lead to broader STLA platform adoption
    - If road testing stalls, the 2026 milestone remains a demo not a revenue engine
    - High impact on near-term commercialization narrative
    - Validation plus road testing are public; commercial terms are not
    - Ask for platform roadmap, procurement gate, and volume timing
  - - Hyundai/Kia could broaden OEM diversity if the 2021 JDA converts
    - If not, the relationship remains option value rather than monetization proof
    - Medium-high impact on customer diversification
    - Technical engagement is public but deployment proof is absent
    - Ask for current SOWs, samples delivered, and vehicle-program status
  - - Karma could become the first named U.S. passenger-vehicle launch
    - A late-2027 slip would weaken the first-production-program narrative
    - Medium impact on visible launch proof
    - Program announced but future-dated
    - Ask for launch gating items, PPAP-equivalent milestones, and pilot-line readiness
  - - Drone integrators widen end markets and may create faster niche adoption
    - Demo-stage drone work may never scale into material recurring revenue
    - Medium impact on optionality, lower impact on core OEM thesis
    - Pack demos and integration work are public
    - Ask for paid pilots, deployed fleets, and repeat order cadence
  - - Capital-light joint manufacturing model may help scale faster
    - Dependence on outside manufacturing partners can concentrate schedule, quality, and margin risk
    - High impact on conversion from proof to revenue
    - Public listing materials explicitly describe joint manufacturing partnerships
    - Ask for who owns yield, capex, QA responsibility, and gross-margin split by program
  notes: Expansion is visible in the milestone ladder, but concentration and economics remain mostly private.
