chapter:
  number: 6
  title: Customers
  summary: >-
    Public customer proof for Factorial is strongest with Mercedes-Benz and
    Stellantis, where the record reaches B-sample delivery,
    development-vehicle integration, and real-world validation. Hyundai/Kia,
    Karma, PowerCo, IQT, KULR, Tulip, JRES, and Avidrone widen the visible
    counterparty set, but the key commercial gap remains the same across almost
    every relationship: JDAs, pilot programs, and validation milestones are not
    the same thing as disclosed recurring revenue, purchase commitments, or
    renewal durability.
sections:
- id: customer-map-and-buyer-user-payer
  title: Customer map and buyer / user / payer reality
  body: Factorial's visible customer universe is narrow, technical, and program-led rather than broad and transactional. The public file points first to global automotive OEMs, then to a smaller set of niche vehicle programs and drone-system integrators. That matters because the buyer, user, and payer are not the same person in most of these relationships. The likely buyers are advanced-battery leaders, CTO organizations, and vehicle-program executives who control evaluation budgets and nominate suppliers. The day-to-day users are engineering, validation, and pack-integration teams trying to make a new chemistry work inside a real vehicle or drone battery pack. The eventual payer would be OEM procurement or a system-integrator purchasing function, but only after technical validation converts into a production award. This distinction is central to diligence. A startup can have excellent user-level engagement and still lack the procurement conversion that turns a co-development program into recurring revenue. Factorial's public materials also show that non-automotive demand is real enough to matter, especially in drones and robotics, but that lane is earlier-stage and even less transparent on economics than the automotive lane.
