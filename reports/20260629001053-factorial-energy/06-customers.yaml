- id: TU006
  title: JDA and program-to-revenue evidence table
  columns:
  - Counterparty
  - Publicly proven
  - Not publicly proven
  - Governing instrument or framing
  - Why it matters
  rows:
  - - Hyundai and Kia
    - JDA, cell evaluation, joint R&D, potential joint manufacturing
    - Vehicle integration, road tests, purchase commitments, launch timing
    - JDA plus statements of work
    - Shows why a formal OEM deal can still be pre-revenue
  - - Mercedes-Benz
    - B-samples, EQS integration, road tests, 1,205 km validation drive
    - Serial award, pricing, committed volume, recurring revenue
    - Collaboration agreement plus ongoing validation program
    - Strongest technical proof still stops short of public commercial proof
  - - Stellantis
    - 77Ah cell validation, Dodge Charger Daytona development vehicle, road testing
    - Supply contract economics, unit volumes, recurring revenue
    - Collaboration agreement with milestones and deliverables
    - Best example of progress from lab metrics to a real vehicle without public revenue disclosure
  - - Karma Automotive
    - First U.S. passenger-vehicle production program announcement and late-2027 target
    - SOP completion, shipped vehicles, purchase value, ongoing replenishment economics
    - Program announcement / production framing
    - Future launch target is not the same as present recurring revenue
  - - PowerCo
    - Development and validation JDA with milestones, deliverables, and demonstrator objective
    - Purchase order, long-term supply contract, committed volumes
    - Filed joint development agreement
    - Explicit contract structure shows industrialization work can exist without near-term sales proof
  notes: >-
    This table isolates the central diligence question for the chapter: where
    public proof ends and monetization proof still begins.
