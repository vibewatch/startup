- id: contract-depth-durability-and-concentration-still-lack-public-proof
  title: Contract depth, durability, and concentration still lack public proof
  body: >-
    The hardest customer questions remain unanswered in public. Factorial's
    filings, partner announcements, and secondary coverage are rich on
    milestones but poor on monetization detail. No retained source in this
    chapter discloses contract value, minimum purchase commitments, renewal
    dates, take-or-pay mechanics, customer concentration by revenue, NRR, GRR,
    churn, or warranty and field-return performance by account. The PowerCo
    agreement is especially instructive because it makes the structure explicit:
    it is a joint development agreement around development, testing, milestones,
    and a technology demonstrator. That is useful industrial proof, but it is
    not a public purchase order. The Hyundai/Kia language in the SEC filing has
    the same character, and even the strongest Mercedes and Stellantis evidence
    is still framed as validation, calibration, and industrialization progress.
    The adverse interpretation is therefore simple and important: JDAs and
    programs may be necessary preconditions for future revenue, but they do not
    by themselves prove recurring revenue. Smartcarz frames the risk bluntly by
    arguing that manufacturing scale, not laboratory success, will decide
    whether Factorial becomes a breakthrough leader or another promising
    pioneer. That conclusion fits the public customer file.
