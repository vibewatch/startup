- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Representative names
  - Buyer / user / payer
  - Public proof
  - What is proven
  - Main gap
  rows:
  - - Premium automotive validation accounts
    - Mercedes-Benz
    - Buyer=advanced battery and vehicle leadership; user=validation and integration teams; payer=OEM procurement only after SOP award
    - OEM-authored road-test and range-validation pages
    - Vehicle-level integration and long-distance validation are real
    - No public serial-award, pricing, or volume disclosure
  - - Mass-market automotive validation accounts
    - Stellantis
    - Buyer=CTO and platform engineering leadership; user=cell, pack, and calibration teams; payer=OEM procurement after platform approval
    - OEM and Factorial road-test announcements plus 2025 milestone coverage
    - Lab validation progressed into a Dodge Charger Daytona development vehicle
    - No public recurring-revenue or purchase-commitment disclosure
  - - Strategic OEM JDA partners
    - Hyundai and Kia
    - Buyer=strategy and battery programs; user=joint R&D teams; payer=unclear until any production award
    - SEC-filed JDA description plus 2021 coverage
    - Formal JDA and technical engagement are proven
    - No public vehicle-integration or launch-program evidence found by the 2026 run date
  - - Niche launch partner
    - Karma Automotive
    - Buyer=vehicle program leadership; user=EV architecture and battery teams; payer=Karma if launch reaches production sourcing
    - Company and trade-press program announcement
    - Named U.S. passenger-vehicle program and late-2027 target exist
    - SOP timing, shipped units, and economics are undisclosed
  - - Drone-system integrators
    - KULR, Tulip Tech, JRES, Avidrone
    - Buyer=platform and mission-system leads; user=pack-integration and flight-test teams; payer=integrators or end-OEMs if deployment scales
    - KULR announcement, drone-industry coverage, and SEC filing
    - Pack integration, demo packs, and flight-preparation work are visible
    - Field revenue, repeat contracts, and deployed fleet size are not public
  notes: Rows separate visible counterparties by economic role because engineering usage is much better evidenced than procurement conversion.
