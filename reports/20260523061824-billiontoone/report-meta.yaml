subtitle: >
  Strong post-IPO diagnostics execution is real, but May 2026 valuation already
  discounts much of the good news and leaves limited margin of safety against
  reimbursement, litigation, and control risk.
coverageNotes: >
  BillionToOne is now a public company, so evidence quality is materially
  better than for most private diagnostics names: the core factual anchors are
  the S-1, 2025 10-K, Q1 2026 10-Q, investor-relations releases, company
  product pages, and peer-reviewed validation papers. Public evidence is
  strongest on revenue growth, margin expansion, product footprint,
  payer/workflow milestones, and peer-multiple framing. Remaining gaps are
  current headcount, live Epic utilization, payer concentration and denial
  rates, product-level margins, the exact economics of the note-purchase
  facility, and the eventual cost or operational effect of active litigation.
