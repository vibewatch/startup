summary:
  headline: >
    BillionToOne merits a TRACK rating: the platform, growth, and liquidity are
    strong, but at roughly $3.95 billion and about 8.5x-8.8x 2026 revenue the
    shares look fairly valued versus unresolved reimbursement, litigation, and
    control risk.
