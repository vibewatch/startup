  foundingLocation: Menlo Park, California, USA
  headquarters: Menlo Park, California, USA
  productSummary: >
    BillionToOne sells centralized molecular diagnostics built on QCT-backed
    single-molecule sequencing. In prenatal testing, UNITY Complete and related
    offerings use a single maternal blood draw to assess recessive, X-linked,
    aneuploidy, and fetal-antigen risk, while Unity Confirm extends the
    workflow into non-invasive confirmation after a high-risk screen. In
    oncology, Northstar Select is an 84-gene liquid biopsy for therapy
    selection and Northstar Response is a methylation-based monitoring assay,
    with newer PGx and clonal-hematopoiesis add-ons ordered from the same blood
    draw.
  customerFocus: >
    The company targets obstetricians, maternal-fetal medicine practices,
    health systems, and community prenatal providers on the women's-health
    side, plus oncology clinics, community practices, and cancer centers on the
    liquid-biopsy side.
  businessModel: >
    BillionToOne operates as a centralized diagnostics lab business. Public
    filings say the predominance of revenue comes from third-party insurance
    carriers, with prenatal testing still the primary revenue engine and
    oncology representing a smaller but faster-growing contribution. Commercial
    growth depends on reimbursement, payer contracting, and workflow embedding
    rather than on direct software subscription revenue.
  stage: "Public (Nasdaq: BLLN)"
  fundingStatus: >
    BillionToOne raised $130 million in an oversubscribed June 2024 Series D at
    a valuation above $1 billion, said total private capital raised was nearly
    $400 million, and then completed a Nasdaq IPO in November 2025 that closed
    at about $314 million of gross proceeds. Public filings also reference a
    note-purchase / non-dilutive financing facility, but the detailed economics
    remain incompletely disclosed in the reviewed source set.
