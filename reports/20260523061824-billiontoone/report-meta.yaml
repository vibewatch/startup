companyProfile:
  summary: >
    BillionToOne is a Menlo Park precision diagnostics company founded in 2016
    by Oguzhan Atay and David Tsao that commercializes a shared
    molecular-counting platform across prenatal screening and oncology liquid
    biopsy. Its core commercial surfaces are UNITY Complete and related
    prenatal add-ons on one side and Northstar Select plus Northstar Response
    on the other, with the same QCT/single-molecule sequencing architecture
    reused across both verticals. The company scaled through a June 2024 Series
    D that raised $130 million at a valuation above $1 billion, said private
    capital raised was nearly $400 million, and then completed a November 2025
    Nasdaq IPO that closed at about $314 million of gross proceeds. Since
    listing, BillionToOne has reported $305.1 million of 2025 revenue, $108.4
    million of Q1 2026 revenue, 73% first-quarter gross margin, and raised 2026
    guidance to $450 million-$465 million. Governance remains founder-led via
    dual-class shares, while commercial expansion is being helped by Epic
    ordering integration, UnitedHealthcare in-network access, and MolDx-backed
    oncology coverage. The core underwriting debate is not whether the platform
    is real, but whether reimbursement quality, workflow conversion, and
    litigation/control remediation can keep pace with post-IPO expectations.
  foundedDate: '2016-01-01'
  founders:
    - name: Oguzhan Atay
      role: Co-founder, CEO, and Chair
      background: >
