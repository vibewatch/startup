summary:
  headline: |
    BillionToOne 值得观察：平台、增长和流动性都强，但估值约 $3.95 billion、相当于 2026 年收入约 8.5x-8.8x；在报销、诉讼和内控风险仍未解开之前，股价看起来已接近公允。
