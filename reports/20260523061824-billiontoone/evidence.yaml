evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: >-
      A current board and committee matrix showing independence status, ownership percentages, and committee memberships
      beyond Anthony Pagano’s audit role.
    whyItMatters: >-
      Company-overview governance is still founder-led and later chapters will need to know whether outside directors
      meaningfully constrain capital allocation, disclosures, and litigation response.
    diligencePath: >-
      Request the latest proxy deck or board materials and cap-table summary from investor relations or counsel; confirm
      committee composition and director independence status.
    relatedQuestionRefs:
      - QO011
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: financing
    missingEvidence: >-
      The debt agreement, lender term sheet, or covenant summary for the publicly cited $140 million non-dilutive
      financing agreement.
    whyItMatters: >-
      A non-dilutive facility can improve growth flexibility or introduce cash-flow covenants, liens, and
      dilution-equivalent pressure that matter for risk and valuation.
    diligencePath: >-
      Ask management or lenders for the executed financing documents, draw schedule, security package, maturity profile,
      and covenant package; reconcile proceeds to cash balances.
    relatedQuestionRefs:
      - QO015
      - QO027
    relatedTableRefs:
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: >-
      A current companywide employee count by function and site, including whether contractor-heavy lab staffing is
      excluded from public hiring pages.
    whyItMatters: >-
      Headcount is a core maturity and operating-efficiency metric, and the available public evidence stops at 500-plus
      employees in 2024 plus current open roles.
    diligencePath: >-
      Request current HR dashboards or payroll-based employee counts segmented by prenatal, oncology, commercial, and
      G&A teams.
    relatedQuestionRefs:
      - QO021
      - QO027
    relatedTableRefs:
