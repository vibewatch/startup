company:
  name: BillionToOne
chapter:
  number: 5
  title: Product & Technology
  summary: 'BillionToOne’s product story is unusually coherent: one patented molecular-counting core is being reused across prenatal cfDNA, fetal-cell confirmation, liquid genomic profiling, and methylation-based response monitoring. The prenatal side looks the most mature because it pairs multiple peer-reviewed studies with live commercial workflows, while oncology still shows strong base-assay validation but newer 2026 add-ons and some operating details that remain company-led or undisclosed. The main diligence swing factors are whether Unity Confirm and the Northstar add-ons can accumulate external validation as quickly as the underlying QCT or smNGS platform has.'
sections:
- id: core-platform-and-product-stack
  title: Core Platform, Product Stack, and Differentiation
  body: 'The most important product-tech fact is that BillionToOne is not presenting unrelated prenatal and oncology businesses. The public record shows one reusable molecular-counting architecture moving from prenatal single-gene testing into liquid biopsy. The 2019 Scientific Reports paper explains why this matters: standard NGS workflows lose clean information about how many molecules were actually present, while QCT inserts co-amplifying templates with embedded molecular identifiers before PCR so molecule counts can be reconstructed after sequencing. BillionToOne’s current technology and product pages keep the same framing, describing smNGS as a single-molecule platform and using that language across Unity and Northstar. In practice, that architecture supports two strategic product choices. First, prenatal workflows can go after sparse, clinically important signals such as recessive variants or fetal antigens from one maternal sample without requiring partner collection. Second, oncology
    workflows can spend panel budget on sensitivity rather than only on breadth, which is why Northstar Select is marketed around actionable yield rather than the largest gene count in the category. The platform also has an IP spine behind it: the company’s patent-marking page and later issued patents extend QCT from assay-validity control into target-associated molecule quantification and sequencing-output analysis. What is still missing is the operating layer. BillionToOne explains the assay principle, but it does not publicly disclose throughput, automation design, or failure-rate data that would show how elegantly the science scales in routine production.'
