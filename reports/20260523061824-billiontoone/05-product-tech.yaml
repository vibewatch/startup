- id: integration-operations-ip-and-risks
  title: Integration, Lab Operations, IP, and Remaining Product-Tech Risks
  body: 'BillionToOne’s workflow credibility is stronger than a typical diagnostics website because it shows both operating and integration scaffolding around the assays. The company publicly discloses separate prenatal and oncology lab sites, and the Union City CAP certificate plus the Menlo Park CMS CLIA certificate provide concrete evidence that prenatal and oncology operations are not just brand wrappers around one undifferentiated lab. Epic matters for a different reason: the January 2026 collaboration and Epic Showroom listing show that BillionToOne is trying to land inside existing clinical software rather than forcing clinicians into a standalone send-out process. That should matter in obstetrics and oncology, where ordering friction kills adoption. The product-tech diligence problem is that some of the evidence surfaces are fresher than others. The Menlo Park CAP PDF linked on the live contact page appears stale relative to run date, and the company still does not publish operating
    metrics such as sample rejection, uptime, or module-level turnaround. Those are not cosmetic gaps; they separate analytically impressive assays from durable service operations. The IP and publication trail helps on moat. Later patents broaden the QCT story from assay quality control into richer target-associated-molecule quantification, and the product stack shows that BillionToOne is actually shipping that logic into multiple workflows. But underwriting should still discount the newest modules until the public validation package catches up with the launch cadence.'
