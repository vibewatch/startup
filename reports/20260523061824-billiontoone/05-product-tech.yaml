- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - BillionToOne solution
  - Measured benefit / proof
  - Limitation
  rows:
  - - Screen a pregnancy early for inherited and chromosomal risk
    - Single maternal blood draw from about 9 weeks with cfDNA analysis
    - Unity Complete
    - Company says one sample can cover recessive, X-linked, and aneuploid risk without partner sample
    - Public materials do not disclose module-level failure rates or turnaround splits
  - - Resolve a high-risk aneuploidy screen without immediate invasive sampling
    - High-risk Unity Aneuploidy result can reflex to fetal-cell workflow
    - Unity Confirm
    - Public 2026 summary reports 16 of 16 concordance with diagnostic testing
    - Not available for several pregnancy scenarios and still early in public validation depth
  - - Manage alloimmunized pregnancies without invasive antigen typing
    - Maternal blood cfDNA antigen genotyping from 10 weeks onward
    - UNITY fetal antigen NIPTs
    - Published antigen studies report 100% sensitivity and specificity in validation and concordance with neonatal outcomes
    - Public record does not show adoption, reimbursement, or protocol utilization rates
  - - Profile an advanced solid tumor when tissue is limited or low-shedding disease is likely
    - Blood draw for tissue-naive liquid CGP
    - Northstar Select
    - Peer-reviewed head-to-head study found more actionable alterations with fewer null reports
    - Workflow economics and failure modes are not disclosed publicly
  - - Monitor therapy response between imaging scans
    - Serial blood draws with longitudinal methylation-based tumor burden tracking
    - Northstar Response
    - Company and paper describe earlier or more precise response insight than standard imaging-only cadence
    - Clinical utility evidence remains narrower than the pan-cancer commercial ambition
  - - Add pharmacogenomics to treatment-selection planning
    - Order add-on at initial liquid-biopsy request from same specimen
    - Northstar PGx
    - Company says DPYD and UGT1A1 insights return without extending stated average turnaround time
    - External peer-reviewed validation was not located in this run
  - - Reduce biological false positives in cfDNA interpretation
    - Add buffy-coat-informed CH adjudication to the base liquid-biopsy workflow
    - Northstar Select CH
    - Company cites >99% PPA and >99% NPA and integrates output into the same report
    - Public evidence is presently company-led rather than independently replicated
  notes: Rows combine current product pages, publication summaries, and 2026 launch materials. Limits are listed where public workflow evidence stops or remains company-led.
