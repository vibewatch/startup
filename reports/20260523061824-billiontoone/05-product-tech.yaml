  evidenceGaps:
  - type: missing-source
    severity: material
    topic: oncology-cap-public-proof
    missingEvidence: A refreshed public Menlo Park CAP certificate or direct CAP directory record dated after 2025-10-27.
    whyItMatters: The company clearly operates an oncology lab, but the stale public CAP PDF weakens external confirmation of current accreditation status at run date.
    diligencePath: Request the current Menlo Park CAP certificate or a live CAP directory screenshot tied to CAP 9568790.
    relatedQuestionRefs:
    - QE022
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: unity-confirm-validation
    missingEvidence: A larger peer-reviewed multicenter Unity Confirm validation with outcome-linked concordance and failure-rate detail.
    whyItMatters: Unity Confirm is strategically important to the prenatal workflow, but the public 2026 evidence is still a small 16-case outcome summary.
    diligencePath: Ask management for the full validation manuscript, study protocol, and current commercial utilization metrics for Unity Confirm.
    relatedQuestionRefs:
    - QE010
    - QE025
    relatedTableRefs:
    - TE004
    - TE005
  - type: private-evidence-only
    severity: material
    topic: northstar-addons
    missingEvidence: Independent peer-reviewed validation for Northstar PGx and Northstar Select CH, including concordance, turnaround, and decision-impact data.
    whyItMatters: The add-ons expand clinical utility, but current public proof is materially thinner than the base Northstar Select evidence package.
    diligencePath: Request validation decks, manuscripts, and any external posters or conference abstracts for PGx and CH.
    relatedQuestionRefs:
    - QE019
    - QE025
    relatedTableRefs:
    - TE001
    - TE005
  - type: missing-source
    severity: material
    topic: operations-metrics
    missingEvidence: Public module-level throughput, sample rejection, redraw, average turnaround by assay, and uptime or incident metrics.
    whyItMatters: Analytical validity is better documented than operating reliability, making implementation risk harder to underwrite.
    diligencePath: Request lab KPI dashboards, sample-quality reports, and service-level metrics by prenatal and oncology workflow.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE003
    - TE005
