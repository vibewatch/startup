  title: Customer workflow / operating flow
  type: flow
  layout: wide
  summary: Observed workflow from order entry through result interpretation, with prenatal and oncology branches built on the same sample-to-report model.
  approximationNotes: This flow abstracts lab-internal automation that BillionToOne does not publish. It focuses on the externally documented steps visible to clinicians and patients.
