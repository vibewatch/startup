  rows:
  - - Unity Complete
    - OB/GYN, MFM, patients
    - Core and mature
    - Single-sample direct fetal-risk workflow for recessive, X-linked, and aneuploid conditions without partner sample
    - Company product pages plus multiple published prenatal studies
    - No public module-level rejection, throughput, or payer-mix metrics
  - - Unity Aneuploidy
    - OB/GYN, MFM, patients
    - Core and mature
    - Integrated aneuploidy workflow that can sit alongside RhD and antigen options inside UNITY
    - Publication page cites general-risk performance and current product availability
    - Public site does not break out performance by gestation, twins, or sample-failure mode
  - - Unity Confirm
    - High-risk prenatal follow-up
    - New 2026 launch
    - Circulating fetal cell capture to bridge screening and invasive diagnostics
    - May 2026 launch materials and 16-case public outcome summary
    - No full peer-reviewed multicenter publication located in this run
  - - UNITY fetal antigen NIPTs
    - Alloimmunized pregnancy management
    - Live and clinically evidenced
    - QCT-based cfDNA antigen genotyping extends beyond RhD into multi-antigen and platelet workflows
    - Scientific Reports, Obstetrics & Gynecology, and 2026 launch coverage
    - Operational adoption, reimbursement, and exact panel uptake are not public
  - - Northstar Select
    - Medical oncologists
    - Core and mature
    - 84-gene smNGS liquid CGP with unusually low LOD and strong low-VAF performance
    - Product page, AACR abstract, peer-reviewed head-to-head JLB paper
    - No public reimbursement map, exact sample-failure rate, or adoption by tumor type
  - - Northstar Response
    - Medical oncologists
    - Commercial but still scaling evidence
    - Tumor-naive methylation monitoring without tissue using quantitative Tumor Methylation Score
    - Product page plus Nature Scientific Reports validation
    - Public commercial page and paper use different granularity descriptors for the methylation target set
  - - Northstar PGx / Select CH
    - Medical oncologists
    - Add-on 2026 modules
    - Same-blood-draw pharmacogenomics and CH adjudication expand the base Select workflow
    - Launch materials, product page, and trade coverage
    - Peer-reviewed external validation remains thinner than for Northstar Select
  notes: Status reflects public evidence as of 2026-05-23. Maturity combines launch timing, publication depth, and workflow specificity rather than internal revenue or installed-base data.
