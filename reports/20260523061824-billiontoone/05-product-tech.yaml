- id: oncology-workflow-and-validation
  title: Oncology Workflow, Validation Strength, and Assay Constraints
  body: 'Northstar is not just a prenatal adjacency play; it is the oncology expression of the same platform logic. Northstar Select is the stronger of the two core oncology products because it already has a peer-reviewed head-to-head validation package, an AACR abstract, and consistent product-page positioning around low-VAF sensitivity. The assay is narrower than some broad-panels at 84 genes, but the argument is deliberate: clinical actionability plus better sensitivity below the levels where many liquid biopsies become unreliable. The public evidence backs that positioning better than usual. The Journal of Liquid Biopsy paper reports 0.15% VAF sensitivity for SNV or indels and better CNV, fusion, and MSI performance, while the head-to-head study shows more actionable findings and fewer null reports. Northstar Response addresses a different job: treatment monitoring rather than therapy selection. Its public paper is also technically interesting because it uses methylation, QCT-backed
    molecule counting, and buffy-coat subtraction to get around the noise and mutation-sparsity problems that weaken many tumor-naive monitoring assays. The commercial page, however, is ahead of the clinical literature in ambition. It markets pan-cancer utility and very low tumor-fraction detection, whereas the public outcome evidence is still narrower than the product positioning. The same maturity gap is more obvious in the 2026 add-ons. Northstar PGx and Northstar Select CH make workflow sense, especially because CH is a real confounder in advanced-cancer liquid biopsy and can distort PARP-related findings, but the proof package is still mostly launch material plus a product page rather than a full external validation stack.'
