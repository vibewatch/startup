- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Key dependency
  - Why it matters
  - Primary risk
  rows:
  - - QCT molecular-counting layer
    - Converts sequencing output into molecule counts before downstream calling
    - Patented template design plus bioinformatics
    - Underpins both prenatal direct-fetal-risk and oncology low-abundance detection claims
    - Public proof explains principle but not current production throughput
  - - smNGS amplicon sequencing workflow
    - Provides single-molecule resolution for sparse cfDNA targets
    - Sample prep, amplification quality, sequencing accuracy
    - Lets BillionToOne pursue low-VAF oncology and single-gene prenatal use cases on one platform family
    - No public hardware, automation, or redundancy architecture is disclosed
  - - Prenatal cfDNA risk engine
    - Combines maternal genotype, fetal fraction, and direct variant evidence into personalized fetal-risk calls
    - Maternal blood quality and computational modeling
    - Differentiates UNITY from carrier-screening workflows that rely on partner sampling
    - Public pages do not quantify no-call rates by product line
  - - Fetal-cell capture pathway
    - Adds cell-based confirmation after high-risk screening results
    - Successful isolation and sequencing of intact circulating fetal cells
    - Creates a non-invasive bridge between screening and invasive diagnostics
    - Current public evidence remains much smaller than for mature cfDNA modules
  - - Northstar Select CGP stack
    - Calls SNV or indels, CNVs, fusions, and MSI from plasma
    - Low-VAF sensitivity and clinically focused panel design
    - Therapy-selection yield depends on finding actionable variants below standard liquid-biopsy LODs
    - Commercial validation is strong but reimbursement and real-world adoption remain opaque
  - - Northstar Response methylation stack
    - Aggregates methylated ctDNA loci into Tumor Methylation Score for longitudinal monitoring
    - Paired plasma and buffy-coat processing plus locus panel design
    - Supports tissue-free monitoring where imaging cadence is slow or ambiguous
    - Public documents describe assay precision but not routine clinical failure or redraw rates
  - - Buffy-coat or WBC correction layer
    - Filters non-tumor background in both response monitoring and CH adjudication
    - Additional specimen handling and sequencing
    - Helps reduce false positives in cancer workflows where blood-derived variants matter
    - Operational complexity is higher than a plasma-only workflow
  - - Ordering and results integration
    - Routes orders, status, and results through provider portal and Epic
    - EHR integration and clinician workflow adoption
    - Makes the assay easier to use inside OB, MFM, and oncology workflows
    - Public evidence names deployability but not actual go-live counts or site-specific utilization
  notes: Architecture is synthesized from product pages, peer-reviewed papers, and patent/publication materials. Risks focus on what remains undisclosed or newly launched rather than on hypothetical lab-science failure modes.
