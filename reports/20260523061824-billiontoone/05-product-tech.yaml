- id: prenatal-workflow-and-validation
  title: Prenatal Workflow, Validation Depth, and Clinical Boundaries
  body: 'The prenatal portfolio is where BillionToOne looks most mature. Unity Complete is positioned as a one-sample workflow that gives direct fetal-risk assessment for recessive, X-linked, and aneuploid conditions as early as nine weeks without needing a partner sample, and the publication set behind that claim is now non-trivial. The reflex single-gene workflow has a large general-population paper behind it, while the fetal-antigen program has both analytical validation and real-world clinical-use data. Unity’s publications page also gives a separate common-aneuploidy performance lens for general-risk patients. The newest piece is Unity Confirm. Strategically, it is important because it tries to solve the awkward handoff between a high-risk cfDNA screen and invasive diagnostics by using circulating fetal cells from maternal blood. That is genuinely differentiated. The current proof, however, is still early: the public 2026 evidence is a 16-case outcome summary plus launch materials,
    not the same depth of peer-reviewed multicenter evidence available for the older cfDNA workflows. The company’s 2026 expansion into red-blood-cell and platelet fetal antigen NIPTs shows how the prenatal stack keeps broadening without leaving the same molecular-counting backbone. Still, ACOG and SMFM matter here. Their current guidance continues to frame cfDNA as screening rather than diagnosis and pushes microdeletion or broader copy-number questions back toward diagnostic testing. That means BillionToOne’s prenatal story is strongest when it is sold as earlier, more actionable triage; it becomes more speculative when marketed as a replacement for the diagnostic boundary itself.'
