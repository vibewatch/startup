    "number": 3,
    "title": "Competitors",
    "summary": "BillionToOne faces two very different competitive fights. In prenatal screening it competes against entrenched send-out incumbents such as Natera Panorama, Labcorp MaterniT21, Quest QNatal, Myriad Prequel/Foresight, Illumina’s VeriSeq-enabled workflows, and Harmony’s legacy installed base, where payer navigation and workflow familiarity matter as much as assay novelty. In oncology liquid biopsy, Guardant, Foundation Medicine, Tempus, Natera Signatera, and Personalis already hold stronger reimbursement, FDA, or personalization positions, so BillionToOne’s moat reads strongest on differentiated scope and workflow embedding rather than on channel power alone."
