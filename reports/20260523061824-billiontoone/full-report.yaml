  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Platform, Product Stack, and Differentiation
        blocks:
          - type: paragraph
            body: >-
              The most important product-tech fact is that BillionToOne is not presenting unrelated prenatal and
              oncology businesses. The public record shows one reusable molecular-counting architecture moving from
              prenatal single-gene testing into liquid biopsy. The 2019 Scientific Reports paper explains why this
              matters: standard NGS workflows lose clean information about how many molecules were actually present,
              while QCT inserts co-amplifying templates with embedded molecular identifiers before PCR so molecule
              counts can be reconstructed after sequencing. BillionToOne’s current technology and product pages keep the
              same framing, describing smNGS as a single-molecule platform and using that language across Unity and
              Northstar. In practice, that architecture supports two strategic product choices. First, prenatal
              workflows can go after sparse, clinically important signals such as recessive variants or fetal antigens
              from one maternal sample without requiring partner collection. Second, oncology workflows can spend panel
              budget on sensitivity rather than only on breadth, which is why Northstar Select is marketed around
              actionable yield rather than the largest gene count in the category. The platform also has an IP spine
              behind it: the company’s patent-marking page and later issued patents extend QCT from assay-validity
              control into target-associated molecule quantification and sequencing-output analysis. What is still
              missing is the operating layer. BillionToOne explains the assay principle, but it does not publicly
              disclose throughput, automation design, or failure-rate data that would show how elegantly the science
              scales in routine production.
            claimRefs:
              - CE001
