      - number: '8.3'
        title: Public Comps, Revenue-Multiple Lenses, and Bull/Base/Bear Ranges
        blocks:
          - type: paragraph
            body: >-
              The comp set argues for discipline rather than dismissal. On current public market data, BillionToOne
              trades at about 11.1 times trailing revenue and about 8.5 to 8.8 times current-year guidance. That is
              cheaper than Natera and Guardant, which still command roughly low-teens forward multiples, but richer than
              Tempus, Illumina, and far richer than Labcorp. This relative placement makes intuitive sense. BillionToOne
              is growing much faster than mature tools or lab companies and already looks cleaner on gross margin than
              many investors would expect, but it is not yet as fully de-risked as the most established premium
              diagnostics winners. Exact Sciences is no longer a live public comp because Abbott has already acquired
              it, so the Exact datapoint now belongs in M&A context rather than in live multiple benchmarking. That deal
              is useful because it proves strategic appetite for scaled cancer diagnostics assets, but control-premium
              takeouts do not justify paying any public multiple without margin of safety. Using these lenses, a bull
              case works only if ASP durability and oncology reimbursement keep improving; a base case keeps
              BillionToOne in a premium-growth band but not at the very top of diagnostics valuation; and a bear case
              appears quickly if reimbursement quality, litigation, or controls force the market to re-rate the company
              toward lower-quality or earlier-stage peers.
