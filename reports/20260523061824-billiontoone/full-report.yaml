      - number: '4.3'
        title: Capital Adequacy, Balance-Sheet Flexibility, and Diligence Gaps
        blocks:
          - type: paragraph
            body: >-
              Near-term capital adequacy looks strong on public evidence. BillionToOne exited 2025 with about $496
              million of cash and ended the first quarter of 2026 with $537.5 million, while also reporting $15.4
              million of operating cash flow and about $11.0 million of cash flow after capex in the quarter. That
              cushion was built from multiple financing layers: a $130 million Series D in mid-2024, about $286.9
              million of net IPO proceeds after the November 2025 listing, and a note purchase facility that had $50
              million drawn by year-end 2025 and then added another $30 million in the first quarter of 2026. The
              balance sheet therefore does not read like a company scrambling for survival capital; it reads like a
              company using abundant equity capital plus a venture-style debt line to accelerate scale. The main public
              risk signals are subtler. Accounts receivable rose to $61.3 million, which implies about 51 days of sales
              outstanding, and long-term debt rose to $90.0 million. At the same time, public filings still do not
              disclose product-level payer mix, denial rates, segment-level gross margins, provider concentration, CAC
              or payback, or the detailed pricing and covenant package on the note facility. The 10-K also says no
              customer represented more than 10% of revenue or receivables, which is helpful, but that is not the same
              as knowing how dependent 2026 guidance is on a handful of contracts or payors. The underwriting conclusion
              is therefore favorable but incomplete: liquidity looks ample, but the durability of 2026 profitability
              still depends on reimbursement realization and oncology margin progression more than on balance-sheet
              scarcity.
