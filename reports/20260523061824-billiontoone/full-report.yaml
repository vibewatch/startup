    data:
      layers:
        - label: Specimen intake
          detail: >-
            Maternal blood, plasma cfDNA, and paired buffy-coat or WBC samples enter distinct prenatal and oncology
            workflows.
          items:
            - Maternal blood draw
            - Plasma cfDNA extraction
            - Buffy-coat or WBC handling
        - label: Molecular-counting core
          detail: >-
            QCT or related target-associated molecules encode molecule counts before sequencing to reduce preparation
            noise.
          items:
            - QCT spike-ins
            - Embedded molecular identifiers
            - Single-molecule quantification logic
        - label: Assay modules
          detail: Different assays reuse the same counting logic with different biological readouts.
          items:
            - Unity Complete direct fetal-risk calls
            - Unity fetal antigen genotyping
            - Unity Confirm fetal-cell sequencing
            - Northstar Select CGP
            - Northstar Response methylation monitoring
            - Northstar PGx / CH add-ons
        - label: Interpretation and reporting
          detail: >-
            Bioinformatics and clinical reporting translate quantified molecules into fetal-risk, genomic-profile, or
            response outputs.
          items:
            - Personalized fetal-risk models
            - Variant, CNV, fusion, and MSI calling
            - Tumor Methylation Score trends
            - Integrated add-on reporting
        - label: Workflow integration and governance
          detail: >-
            Provider portals, Epic Aura, lab accreditations, and patent coverage shape how the assays are deployed in
            care.
          items:
            - Unity provider workflow
            - Epic Aura and MyChart
            - Union City prenatal lab
            - Menlo Park oncology lab
            - Patent-marking and QCT IP family
