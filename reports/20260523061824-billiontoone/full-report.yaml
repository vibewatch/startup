      - number: '3.4'
        title: Moat Durability, Legacy Weaknesses, and Adverse Competitor Evidence
        blocks:
          - type: paragraph
            body: >-
              The most durable part of BillionToOne’s competitive story is not that no one else offers NIPT or liquid
              biopsy; clearly many do. The durable part is the combination of broader prenatal scope, oncology
              sensitivity messaging, and workflow embedding across both businesses. That can matter if buyers want fewer
              vendor handoffs and if a single brand can serve OB, MFM, and oncology teams through the same operational
              rails. But durability weakens quickly if incumbents can match bundle breadth, hide pricing behind
              contracts that buyers already understand, or use reimbursement and channel depth to make switching feel
              operationally risky. Public evidence already shows that many competitors have those tools.  The adverse
              evidence is meaningful. Guardant’s large false-advertising verdict against Natera is a reminder that
              aggressive comparative marketing in MRD can become a legal liability, not just a sales tactic. Harmony’s
              migration into BioReference and Invitae’s asset sale into Labcorp show that once-distinct prenatal brands
              can be absorbed into larger portfolio machines rather than remaining independent innovation centers. CMS
              MolDX also keeps the field honest by emphasizing limited coverage and requiring equivalent or superior
              performance against existing methodologies. For BillionToOne, the implication is balanced: there is room
              to win with differentiated scope and workflow, but the company is competing in categories where incumbents
              already own the reimbursement rails, channel memory, and legal-regulatory muscle that often decide
              category profit pools.
