  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segments, Buyers, and Ordering Surfaces
        blocks:
          - type: paragraph
            body: >-
              BillionToOne's customer map is more layered than a simple lab-send-out model. In prenatal care, the
              practical buyers and daily users are general OB/GYN clinicians, maternal-fetal medicine specialists,
              genetic counselors, and the pregnant patients who have to agree to screening and follow-up; payers still
              function as the economic gatekeepers because customer access depends on in-network status, Medicaid
              acceptance, and predictable reimbursement. Public workflow materials show why the company has won share in
              that segment: Unity Complete is positioned as a first-line screen for the general obstetric population,
              uses one maternal blood draw, removes the need for partner samples, and is marketed as a one-patient-bill
              workflow. Specialty prenatal use cases sit on top of that base. BillionToOne has expanded fetal-antigen
              testing for alloimmunized pregnancies, which makes MFM and high-risk pregnancy programs a separate
              specialty segment rather than just an edge case. On the oncology side, the buyer set shifts toward
              community oncologists, hospital-based oncologists, and academic cancer centers that need either
              therapy-selection liquid biopsy or longitudinal treatment monitoring. The January 2026 Epic collaboration
              is important in customer terms because it promises access through the incumbent EHR rather than through a
              standalone lab portal. That means integrated delivery networks, community practices, and specialty clinics
              can all be reached through the same ordering surface, with lab operations hidden behind a
              clinician-friendly front end.
