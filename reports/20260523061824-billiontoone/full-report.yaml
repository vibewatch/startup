  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: >-
      Observed workflow from order entry through result interpretation, with prenatal and oncology branches built on the
      same sample-to-report model.
    approximationNotes: >-
      This flow abstracts lab-internal automation that BillionToOne does not publish. It focuses on the externally
      documented steps visible to clinicians and patients.
    data:
      nodes:
        - id: n1
          label: Order in portal or EHR
          detail: OB, MFM, and oncology clinicians can order through provider workflow or Epic Aura surfaces.
        - id: n2
          label: Collect blood specimen
          detail: A maternal blood draw or oncology blood draw starts the assay journey.
        - id: n3
          label: Run assay-specific prep
          detail: Prenatal cfDNA, fetal-cell capture, CGP, methylation, or buffy-coat workflows are selected.
        - id: n4
          label: QCT-backed sequencing and counting
          detail: smNGS or related counting methods quantify molecules and suppress preparation noise.
        - id: n5
          label: Clinical interpretation
          detail: Fetal-risk, antigen, CGP, methylation, PGx, or CH logic turns molecules into actionable signals.
        - id: n6
          label: Deliver report and next step
