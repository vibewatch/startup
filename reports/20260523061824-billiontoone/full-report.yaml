      - number: '7.2'
        title: Workflow, Quality, and Customer-Trust Risk
        blocks:
          - type: paragraph
            body: >-
              BillionToOne’s workflow story is directionally strong, but the risk chapter has to separate announced
              capability from proven live utilization. The Epic collaboration clearly helps the company claim a cleaner
              ordering-and-results surface across health systems, community practices, maternal-fetal medicine, and
              oncology clinics. What is not disclosed is how many sites are live, what percentage of orders actually
              route through Epic, or whether those integrations improve repeat ordering economics. That matters because
              diagnostics stickiness depends on operational reality, not just on a signed distribution surface. The
              prenatal confirmatory pathway is similar. Unity Confirm is strategically smart because it tries to close
              the gap between high-risk screening and invasive diagnostics, but the launch materials themselves show
              that the product is early: the company cites a tiny 16-sample validation set and a new 1,000-patient study
              to validate it at scale. The Swieczkowski record shows why this matters: when a screening test is heard as
              diagnostic, false-positive or false-negative implications become more than abstract clinical caveats; they
              become legal, reputational, and counseling failures. BBB complaints do not prove systemic harm, but they
              reinforce that customer experience and billing communication remain part of the underwriting problem.
              Residual exposure is therefore not only assay performance; it is also whether the company can
              operationalize follow-up, counseling, billing clarity, and EHR integration before growth pressure outruns
              process maturity.
