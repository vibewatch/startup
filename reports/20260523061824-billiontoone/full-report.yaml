chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Platform, and Operating Footprint
        blocks:
          - type: paragraph
            body: >-
              BillionToOne should be treated as a precision diagnostics platform company, not just a prenatal screening
              vendor. Official pages describe a Menlo Park company focused on making molecular diagnostics more
              powerful, efficient, and accessible, and public investor materials repeat that the same QCT and
              single-molecule sequencing architecture now supports both prenatal testing and oncology liquid biopsy. The
              prenatal franchise centers on UNITY Complete and related fetal-risk and fetal-antigen offerings, while the
              oncology franchise centers on Northstar Select and Northstar Response. That dual-vertical model matters
              because it gives later chapters a reusable operating definition: one underlying counting platform is being
              commercialized across pregnancy and cancer rather than across unrelated product lines. The footprint is
              also more than a single office. SEC filings and company materials anchor headquarters at 1035 O’Brien
              Drive in Menlo Park, while accreditation disclosures and hiring pages show prenatal lab activity tied to
              Union City and oncology operations in Menlo Park. Investor relations pages add scale markers of 1
              million-plus molecular tests, 225 million-plus covered lives, and 90-plus issued patents and pending
              applications, though those are company claims rather than independently audited KPIs.
