      - number: '3.3'
        title: Switching Cost, Distribution Power, and Multi-homing Reality
        blocks:
          - type: paragraph
            body: >-
              The practical competitive question is not who has the best headline sensitivity claim; it is which vendors
              are hardest to displace once a buyer’s workflow is already in motion. Prenatal switching costs are
              relatively moderate compared with oncology. OB and maternal-fetal-medicine sites can multi-home, and the
              public pages from Natera and Quest show that patient-liability support, prior authorization help, and
              reimbursement predictability are core selling tools. That dynamic favors incumbents with large send-out
              volumes and broad contracting muscle even when a challenger offers a technically broader bundle.
              BillionToOne’s Epic integration matters here because it reduces ordering friction and improves result
              delivery, but it is still one distribution lever competing against incumbents that already publish clearer
              patient-navigation and cost-expectation programs.  Oncology has stickier economics. Signatera explicitly
              requires tissue and matched-normal onboarding before serial blood monitoring becomes simple, which means a
              site that starts tumor-informed MRD with Natera absorbs meaningful switching friction. Guardant and
              Foundation create a different form of lock-in through broad coverage and FDA-linked therapy-selection
              usage, while Tempus competes through platform adjacency and rapid turnaround. CMS MolDX reinforces all of
              this by making coverage limited and evidence-dependent rather than automatic. That means buyers can still
              multi-home across therapy selection, MRD, and monitoring, but they do so inside a reimbursement
              architecture that rewards already-validated incumbents. BillionToOne’s opportunity is to turn sensitivity
              and integrated workflow into a wedge; the risk is that entrenched reimbursement and personalization paths
              keep those wedges narrow until larger accounts see more clinical and economic proof.
