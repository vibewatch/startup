      - number: '6.4'
        title: Durability Gaps, Named-Proof Scarcity, and Customer Risks
        blocks:
          - type: paragraph
            body: >-
              The underwriting gaps are as important as the positive adoption signals. Public materials do not disclose
              NRR, GRR, churn, renewal cohorts, or top-customer concentration, so there is no clean way to separate
              sticky repeat ordering from rapid but potentially shallow account acquisition. Public named proof is also
              uneven. Prenatal evidence is strongest at scale and in one rural specialist anecdote, while oncology
              evidence is strongest in studies, academic collaborations, and conference presence. That makes it harder
              to judge how many integrated delivery networks, community clinics, or commercial oncology groups are in
              steady-state production use. Customer experience risk is also not theoretical. BBB hosts a complaints page
              for BillionToOne, and the Swieczkowski case shows that patient trust and communication around prenatal
              results can become litigation issues when screening outputs are interpreted too confidently. Even if the
              company ultimately prevails, the case is a reminder that diagnostics adoption depends on clear messaging,
              ordering economics, and follow-up workflow as much as on assay sensitivity. The practical diligence
              conclusion is that BillionToOne's customer base looks real and expanding, but durability and concentration
              still need management-only data to move from plausible to underwritten.
