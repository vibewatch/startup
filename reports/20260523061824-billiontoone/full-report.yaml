  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Trajectory, Mix, and Recognition
        blocks:
          - type: paragraph
            body: >-
              BillionToOne’s financial story now has a clean public trail, and the most important conclusion is that the
              IPO did not reset or contradict the private-era trajectory. The S-1/A marketed a business already running
              at roughly $209 million of annualized revenue by mid-2025 with 508,000 LTM tests accessioned, a 65% gross
              margin, and more than 225 million covered lives. Public filings and earnings releases then extended that
              arc: 2025 revenue reached $305.1 million, exactly double 2024, with prenatal still carrying the economic
              load at $277.1 million and oncology scaling from a small base to $25.0 million. The first quarter of 2026
              kept the same pattern, with $108.4 million of revenue, $96.5 million from prenatal, and $10.7 million from
              oncology. The important underwriting nuance is that reported diagnostics revenue is not a simple volume
              times list-price exercise. The 10-Q says the predominance of revenue comes from third-party insurance
              carriers and is recognized using expected-value variable consideration that factors in reimbursement
              disallowances, historical payment trends, contractual arrangements, and known changes in insurance
              coverage. That accounting choice matters in practice: first-quarter 2026 included $9.2 million of revenue
              recognized on prior-period obligations after new payor agreements increased expected payment. In other
              words, realized pricing, coverage wins, and retroactive collections are materially shaping the top line,
              so headline revenue growth should be read as both demand growth and reimbursement execution.
