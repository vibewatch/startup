      - number: '2.2'
        title: Sizing Lenses, Estimate Spread, and What the Numbers Really Mean
        blocks:
          - type: paragraph
            body: >-
              The raw market numbers are directionally useful but only if the lenses are kept separate. Prenatal volume
              has a hard demographic ceiling: the United States recorded about 3.62 million births in provisional 2024
              data and about 3.61 million in provisional 2025 data. That ceiling matters because it limits how much
              domestic prenatal volume can grow without either higher penetration, richer panels, or international
              expansion. Public analyst TAMs then fan out depending on how broad the category becomes. MarketsandMarkets
              Blog frames U.S. NIPT at about USD 1.86 billion, The Business Research Company puts global NIPT at USD
              6.27 billion in 2025, and Precedence pushes a broader prenatal-plus-newborn genetics lens above USD 10
              billion in 2026. The oncology side shows the same pattern: Persistence cites a USD 2.1 billion U.S.
              liquid-biopsy market in 2026, while Grand View gives a USD 13.6 billion global category. Those figures are
              not wrong so much as non-equivalent. They mix geography, use case, and adjacency scope. For diligence, the
              more reliable sizing lens is a constrained one: pair demographic or disease-volume ceilings with
              reimbursed workflows and peer throughput, then ask how much of that wedge a centralized send-out lab can
              realistically win.
