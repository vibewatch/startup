      - number: '3.2'
        title: Oncology Liquid-Biopsy Leaders and Where BillionToOne Fits
        blocks:
          - type: paragraph
            body: >-
              The oncology field is less forgiving than prenatal because the bar is not just analytical performance; it
              is coverage, regulatory posture, and installed clinical habit. Guardant’s public surface ties
              therapy-selection liquid biopsy directly to broad Medicare and commercial coverage, plus FDA-approved
              Guardant360 CDx and sub-seven-day turnaround. Foundation Medicine pairs a pan-tumour liquid-biopsy
              narrative with companion-diagnostic status and broad financial-responsibility messaging for insured and
              Medicare patients. Tempus pushes a different wedge: a 105-gene xF clinical panel, broader xF+ expansion,
              and a data-platform framing that appeals to oncology programs that want one vendor spanning genomic
              profiling and AI-enabled workflows. Natera’s Signatera and Personalis’ NeXT Personal are more directly
              relevant to BillionToOne’s monitoring ambition because both lean into MRD-style longitudinal monitoring;
              Personalis adds newly expanded Medicare coverage for immunotherapy monitoring, while Signatera deepens
              lock-in through personalized tissue-informed test design.  That context is why BillionToOne’s oncology
              moat reads promising but early. BillionToOne’s own pages say Northstar Select is optimized for therapy
              selection and Northstar Response for monitoring, with a sensitivity-oriented positioning and Epic workflow
              embedding that could reduce operational friction. Yet the public evidence set does not show comparable
              FDA-cleared companion-diagnostic positioning or equally mature reimbursement language across the same
              range of advanced-solid-tumor workflows that Guardant and Foundation already market. In other words,
              Northstar can still win where sensitivity, workflow simplicity, or single-vendor alignment matter most,
              but the incumbents retain stronger proof that large oncology accounts can adopt their assays with less
              reimbursement uncertainty.
