    {
      "id": "reimbursement-and-operating-leverage",
      "title": "Reimbursement Economics, Margin Path, and Operating Leverage",
      "body": "The pricing and margin story is increasingly payer-driven. Management’s public commentary ties new in-network contracts with UnitedHealthcare and Anthem to a coverage footprint of roughly 300 million contracted lives, or more than 90% of the U.S. population, and explicitly says those agreements should make ASPs higher and more predictable. That shows up in the numbers: blended ASP reached $571 per test in the first quarter of 2026, up 28% year over year, while true-up revenue also rose as earlier tests were repriced through new contracts. Prenatal economics benefit from growing commercial access and lower ordering friction, including UnitedHealthcare’s April 2025 removal of prior authorization for cell-free fetal DNA testing, even though reimbursement still depends on medical necessity. Oncology monetization is more conditional. Northstar Select won MolDX-backed Medicare access for advanced solid tumors effective February 2025, but LCD L38043 still narrows covered use cases and repeat-testing logic, and management says Northstar Response remains uncovered by Medicare and therefore structurally lower margin. Even with those limits, public results show strong operating leverage. Gross margin improved from 53% in 2024 to 68% in 2025 and then to 73% in the first quarter of 2026. Revenue grew faster than operating expense in both 2025 and the latest quarter, and estimated first-quarter gross profit per delivered test was about $421. The best interpretation is that the platform is already scaling, but continued margin expansion still depends on product mix, reimbursement mix, and the pace of oncology coverage wins rather than on test volume alone.",
