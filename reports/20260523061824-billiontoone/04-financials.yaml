  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "BillionToOne entered the public market with an unusually strong diagnostics growth profile: revenue doubled to $305.1 million in 2025, first-quarter 2026 revenue reached $108.4 million, gross margin rose to 73%, and the company remained cash generative after capex while holding $537 million of cash. The financial story is high quality but not frictionless: ASP expansion is increasingly driven by payer contracting and true-up effects, oncology monetization still depends on narrower coverage pathways than prenatal, and public disclosures still omit payer mix, denial rates, segment gross margins, CAC or payback, and full debt-facility economics. The underwriting read is therefore positive on scale, margin path, and liquidity, but still contingent on reimbursement durability rather than on raw test volume alone."
  },
