      "id": "capital-public-market-and-scale",
      "title": "Capital Formation, Public-Market Transition, and Scale",
      "body": "BillionToOne’s capital and scale arc is unusually well disclosed for a diagnostics company that only recently crossed into the public market. The milestones page lays out Series A, B, and C financing events during the build-out of UNITY and then oncology, while the 2024 Series D press release fixed a $130 million round at a valuation above $1 billion and said total capital raised was nearly $400 million. A later executive-hiring release added another capital datapoint — a recent $140 million non-dilutive financing agreement — but did not disclose structure or covenants. The public-market step came quickly after that. The IPO priced on November 5, 2025 at $60 per share, began trading on Nasdaq the next day under BLLN, and closed at roughly $314 million of gross proceeds after full exercise of the over-allotment option. Operating performance after listing has been strong. Full-year 2025 revenue reached $305.1 million with 68% gross margin, and first-quarter 2026 revenue reached $108.4 million with 73% gross margin, $17.8 million of operating income, and $18.0 million of net income. Management then raised 2026 revenue guidance three times in five months, ending at $450 million to $465 million. What remains less sturdy is the run-date valuation snapshot and current headcount: the fetched record gives historical valuation markers and a 2024 workforce marker, but not a canonical May 2026 figure for either.",
