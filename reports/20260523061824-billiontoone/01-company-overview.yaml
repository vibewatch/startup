      "id": "milestones-partnerships-adverse-and-gaps",
      "title": "Milestones, Partnerships, Adverse Signals, and Remaining Gaps",
      "body": "The company-overview chronology is not just a financing story. BillionToOne’s historical path moves from early NIH and Baylor-backed single-gene NIPT work, through first commercial UNITY samples, into the 2023 Northstar oncology expansion, then into a visibly broader 2026 product and workflow push. January 2026 alone brought Northstar Select’s selection for Japan’s LC-SCRUM-TRY study and an Epic collaboration signed in December 2025 that embedded UNITY Complete and Northstar results into Aura and MyChart workflows. February added new fetal antigen offerings, and May added Unity Confirm, a fetal-cell-based non-invasive confirmatory assay that the company says showed 100% concordance across 16 of 16 validation samples and is now entering a 1,000-patient study. The adverse side of the chapter matters too. In May 2026 Illumina sued BillionToOne over alleged infringement of three NIPT patents and sought injunctive and monetary relief, while a separate public Illinois docket shows a 2024 lawsuit by the Swieczkowski plaintiffs. The company’s May 2026 10-Q still said it did not view then-current legal matters as material, which means the litigation picture for later chapters must be refreshed rather than frozen to quarter-end language. The biggest remaining gaps are still current valuation framing, current headcount, and the exact economics of the non-dilutive financing facility.",
