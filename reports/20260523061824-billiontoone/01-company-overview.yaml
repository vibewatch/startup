      "id": "leadership-and-governance",
      "title": "Founders, Leadership, and Governance",
      "body": "Leadership remains unusually founder-centric for a company that is already public. Oguzhan Atay remains co-founder, chief executive officer, and board chair, while David Tsao remains co-founder, chief technology officer, and a board member. Their biographies tie the company’s core technology and strategic direction directly to the founding team, and the S-1 makes clear that founder influence is not merely cultural: the IPO introduced a dual-class structure in which Class B shares carry 15 votes each, and the co-founders were disclosed as owning 100% of that super-voting class at the time of the offering. The executive bench has broadened materially around them. Ross Taylor arrived as CFO in early 2024 with prior public-company finance experience, John Lister covers legal and operating infrastructure as chief administrative officer, Shan Riku spans product and clinical go-to-market, Nancy Johnson runs commercial operations, and Allen Chen joined in April 2026 to deepen oncology medical affairs. Public governance visibility is still incomplete, but the board now visibly includes outside finance voices such as Premji’s Akshay Rai and Genmab CFO Anthony Pagano, who became audit committee chair in 2026. The result is a company that has added experienced operators and independent directors without diluting obvious founder control.",
