  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入轨迹、组合与确认
        blocks:
          - type: paragraph
            body: >-
              BillionToOne 的财务故事现在有清晰公开轨迹，最重要结论是 IPO 没有重置或推翻私募阶段轨迹。S-1/A 营销的是一个到 2025 年中期已约有 $209 million 年化收入、LTM 入库检测
              508,000 次、65% 毛利率和超过 225 million 覆盖人群的业务。公开文件和业绩公告随后延展了这条曲线：2025 年收入达到 $305.1 million，正好是 2024
              年两倍；产前仍承担经济主力，收入 $277.1 million，肿瘤从小基数扩至 $25.0 million。2026 年一季度延续同一模式，收入 $108.4 million，其中产前 $96.5
              million，肿瘤 $10.7 million。重要的投资判断细节是，报告诊断收入不是简单的检测量乘标价。10-Q
              称，收入主要来自第三方保险公司，并用预期价值法可变对价确认，纳入报销拒付、历史付款趋势、合同安排和保险覆盖已知变化。这种会计选择在实践中重要：Q1 2026 有 $9.2 million
              收入来自新支付方协议提高预期付款后，对前期履约义务的确认。也就是说，实际定价、覆盖突破和追溯回款已经在实质塑造收入线，因此表观 收入增长应同时读作需求增长和报销执行。
