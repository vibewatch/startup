      - number: '8.2'
        title: 财务质量、收入质量，以及当前倍数假设了什么
        blocks:
          - type: paragraph
            body: >-
              财务证据足够强，不能把它简单打成没有经营证明的投机性诊断 IPO。BillionToOne 在 2025 年把收入翻倍至 $305.1 million，Q1 2026 收入达到 $108.4
              million，毛利率达到 73%，产生 $17.8 million 经营利润，季度末持有 $537.5 million
              现金。这些事实解释了为什么股票相对成熟诊断和实验室同行仍有溢价。但收入质量并不只是检测量乘以一张透明标价表这么简单。10-Q
              称，收入主要由第三方保险支付，通过预期价值法下的可变对价估计，并受到合同变化和覆盖更新的显著影响。实践中这已经很重要，因为第一季度收入中有 $9.2 million 来自以前期间义务，其中超过一半与 2025
              年服务在新支付方协议后重新定价有关。UnitedHealthcare 网内合同是真正的正面因素，因为它应改善可及性和 ASP
              可预测性；但它也凸显估值依赖：现在支撑部分倍数的不只是检测量，还有报销执行。因此，正确解读是正面但不能无忧。业务有真实规模和流动性，但当前股价已经假设报销机器继续支撑业务。
