      - number: '4.3'
        title: 资本充足性、资产负债表灵活性与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，近期资本充足性强。BillionToOne 2025 年末现金约 $496 million，2026 年一季度末为 $537.5 million，同时报告该季度经营现金流 $15.4
              million，扣除资本开支后现金流约 $11.0 million。现金垫来自多层融资：2024 年中 $130 million Series D、2025 年 11 月上市后的约 $286.9 million
              IPO 净收益，以及一项票据购买工具；2025 年末已提款 $50 million，一季度又增加 $30 million。因此，资产负债表不像是在抢生存资本的公司，更像是用充足股权资本加一条风险债务式
              信贷额度加速规模化的公司。主要公开风险信号更细。应收账款升至 $61.3 million，意味着约 51 天 DSO；长期债务升至 $90.0
              million。同时，公开文件仍未披露产品层面支付方组合、拒付率、分部层面毛利率、医疗服务方集中度、CAC 或回本周期，以及票据工具的详细定价和契约组合。10-K 还称没有客户占收入或应收账款超过
              10%，这有帮助，但并不等于知道 2026 年指引对少数合同或支付方有多依赖。因此，投资判断结论是有利但不完整：流动性充足，但 2026 年盈利能力的耐久性更取决于报销兑现和肿瘤毛利率推进，而不是资产负债表稀缺。
