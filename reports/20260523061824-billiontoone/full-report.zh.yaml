        - Core、ESS、SCA 和全基因组选项
        - 患者自付区间和净实际定价
        - 实验室规模能抵消公开价格透明度不足
      - - Foundation Medicine
        - 引用数据集中，64% 商业保险和 97% Medicare / MA 患者无需承担费用
        - 以支付覆盖为先的肿瘤分子谱分析，按伴随诊断来定位
        - 324 基因液体 CDx 和治疗匹配
        - 按支付方和适应症拆分的当前合同费率
        - 支付覆盖定位降低晚期实体瘤项目的采购顾虑
      - - Guardant
        - 晚期实体瘤有广泛商业保险和 Medicare 覆盖；保留来源集中没有公开标价
