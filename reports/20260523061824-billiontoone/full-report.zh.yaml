  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 维度
      - 投资逻辑
      - 反向逻辑
      - 改变观点的证据
    rows:
      - - 增长质量
        - 2025 年收入翻倍，2026 年 Q1 仍保持 84% 增长，毛利率 73%。
        - 近期收入质量仍有一部分依赖支付方重新定价和追补调整，而不只是干净的检测量增长。
        - 展示数个季度的 ASP 稳定性，且没有异常大额前期追补收入。
      - - 报销
        - UnitedHealthcare 网内状态可改善准入和 ASP 可预测性。
        - 文件仍称收入主要由保险方支付，并通过可变对价估计。
        - 按产品和支付方队列提供支付方组合、拒付趋势和实际 ASP。
      - - 流动性
        - 现金超过 $537 million，公司有时间执行。
        - 若执行放慢，债务分期和任何隐藏稀释仍会压低上行空间。
        - 提供完全摊薄股权结构表，以及截至 2027 年的票据融资安排衔接表。
      - - 风险姿态
        - 公司已有足够规模吸收正常上市公司摩擦。
        - Illumina 诉讼、Swieczkowski 和未整改内控缺陷不是普通背景噪音；它们就是估值输入。
        - 用清晰的审计师和管理层证据消除诉讼敞口并修复内控。
      - - 可比公司框架
        - BillionToOne 相比成熟诊断和实验室同行应享有溢价。
        - 没有更干净的肿瘤和报销证据前，它还不该拿到完整的 Natera 或 Guardant 溢价。
        - 展示足以支撑更高估值带的肿瘤经济性和报销深度。
      - - M&A 语境
        - Abbott 收购 Exact 显示，规模化癌症诊断具备战略价值。
        - 控制权溢价收购不能成为解释 BillionToOne 当前公开市场价格的捷径。
        - 除非出现真实流程或战略稀缺信号，否则仅把 M&A 视为背景。
    notes: 核心分歧很明确：公司质量逻辑很强，但截至运行日锚点，公开市场价格逻辑只是合理。
