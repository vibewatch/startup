      - number: '1.4'
        title: 里程碑、合作、反向信号与剩余缺口
        blocks:
          - type: paragraph
            body: >-
              公司概况的时间线不只是融资故事。BillionToOne 的历史路径从早期 NIH 和 Baylor 支持的单基因 NIPT 工作起步，经过首批商业 UNITY 样本，进入 2023 年 Northstar
              肿瘤扩张，再到 2026 年更明显的产品和工作流推进。仅 2026 年 1 月就包括 Northstar Select 入选日本 LC-SCRUM-TRY 研究，以及 2025 年 12 月签署的 Epic
              合作，把 UNITY Complete 和 Northstar 结果嵌入 Aura 和 MyChart 工作流。2 月新增胎儿抗原产品，5 月新增 Unity
              Confirm——一种基于胎儿细胞的无创确认检测；公司称该检测在 16/16 个验证样本中达到 100% 一致性，并正进入 1,000 名患者研究。本章的反面也重要。2026 年 5 月，Illumina 就三项
              NIPT 专利涉嫌侵权起诉 BillionToOne，并寻求禁令和金钱救济；另一个公开 Illinois 案卷显示，Swieczkowski 原告在 2024 年提起诉讼。公司 2026 年 5 月 10-Q
              仍称，不认为当时现有法律事项具有重大性；这意味着后续章节不能把诉讼图景冻结在季度末措辞上，而要持续刷新。最大剩余缺口仍是当前估值框架、当前员工数，以及非稀释融资工具的具体经济条款。
