companyProfile:
  summary: >
    BillionToOne 是 Menlo Park 的精准诊断公司，由 Oguzhan Atay 和 David Tsao 于 2016 年创立，把一个共享的分子计数平台商业化到产前筛查和肿瘤液体活检。核心商业产品一边是 UNITY
    Complete 及配套产前附加检测，另一边是 Northstar Select 加 Northstar Response，两条线复用同一套 QCT / 单分子测序架构。公司借 2024 年 6 月 Series D
    融资扩张，该轮募得 $130 million，估值超过 $1 billion；公司称私募累计融资接近 $400 million，随后在 2025 年 11 月完成 Nasdaq IPO，总募资约 $314
    million。上市后，BillionToOne 披露 2025 年收入 $305.1 million、Q1 2026 收入 $108.4 million、一季度毛利率 73%，并把 2026 年指引上调至 $450
    million-$465 million。治理仍由创始人通过双重股权结构主导，商业扩张则受益于 Epic 下单集成、UnitedHealthcare 网络内准入和 MolDx
    支持的肿瘤覆盖。投资判断的核心争议不在平台是否真实，而在报销质量、工作流转化和诉讼 / 控制权修复能否跟上 IPO 后预期。
