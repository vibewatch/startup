chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、平台与运营足迹
        blocks:
          - type: paragraph
            body: >-
              BillionToOne 应被视为精准诊断平台公司，不只是产前筛查供应商。官方页面描述的是一家 Menlo Park 公司，目标是让分子诊断更强大、更高效、更可及；公开投资者材料也反复强调，同一套 QCT
              和单分子测序架构如今同时支撑产前检测和肿瘤液体活检。产前业务以 UNITY Complete 及胎儿风险、胎儿抗原配套产品为中心，肿瘤业务以 Northstar Select 和 Northstar
              Response 为中心。这种双垂直模式重要，因为它给后续章节提供了可复用的运营定义：公司把一个底层计数平台商业化到妊娠和癌症两类场景，而不是铺到彼此无关的产品线。足迹也不止一个办公室。SEC
              文件和公司材料把总部锚定在 Menlo Park 的 1035 O’Brien Drive；认证披露和招聘页面显示产前实验室活动挂钩 Union City， 肿瘤运营在 Menlo
              Park。投资者关系页面还给出超过 1 million 次分子检测、覆盖超过 225 million 人的保险人群、超过 90 项已授权专利及待审申请等规模标记，但这些是公司口径，不是独立审计 KPI。
