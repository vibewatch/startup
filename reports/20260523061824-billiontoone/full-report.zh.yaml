      - number: '3.4'
        title: 护城河耐久性、遗留弱点与竞争对手反向证据
        blocks:
          - type: paragraph
            body: >-
              BillionToOne 竞争叙事最耐久的部分，不是没有其他人做 NIPT
              或液体活检；显然很多人在做。耐久点在于更宽的产前范围、肿瘤灵敏度叙事和横跨两门业务的工作流嵌入组合。如果买方想减少供应商交接，且单一品牌能通过同一套运营轨道服务 OB、MFM
              和肿瘤团队，这会有价值。但如果既有厂商能够匹配组合宽度、把价格藏在买方已经理解的合同里，或用报销和渠道深度让切换显得运营风险很高，耐久性会迅速变弱。公开证据已经显示，许多竞争对手拥有这些工具。反向证据有分量。Guardant
              针对 Natera 赢得的大额虚假广告判决提醒，MRD 中激进比较营销可能成为法律责任，而不只是销售策略。Harmony 迁入 BioReference、Invitae 资产卖给
              Labcorp，说明曾经独立的产前品牌可以被吸收到更大的组合机器中，而不是继续作为独立创新中心。CMS MolDX 也通过强调有限覆盖并要求相对现有方法达到等同或更优表现，持续约束该领域。对
              BillionToOne 的含义是平衡的：凭差异化范围和工作流有赢的空间，但公司竞争的品类里，既有厂商已经拥有报销轨道、渠道记忆和法律监管肌肉，而这些往往决定品类利润池。
