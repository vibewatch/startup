      - number: '5.4'
        title: 集成、实验室运营、IP 与剩余产品技术风险
        blocks:
          - type: paragraph
            body: >-
              BillionToOne 的工作流可信度强于典型诊断网站，因为它围绕检测展示了运营和集成脚手架。公司公开披露了独立的产前和肿瘤实验室站点，Union City CAP 证书加 Menlo Park CMS
              CLIA 证书提供了具体证据：产前和肿瘤运营不只是一个无差异实验室外面套的品牌。Epic 重要则是另一个原因：2026 年 1 月合作和 Epic Showroom 条目显示，BillionToOne
              试图落进现有临床软件，而不是强迫临床医生进入独立外送流程。这在产科和肿瘤都应重要，因为下单摩擦会扼杀采用。产品技术尽调的问题在于，有些证据来源比另一些更新。线上 联系页面链接的 Menlo Park CAP
              PDF 相对报告日期显得过时，公司仍未发布样本拒收、正常运行时间 或模块级周转时间等运营指标。这些不是装饰性缺口；它们区分分析上漂亮的检测和耐久的服务运营。IP 和发表轨迹有助于护城河。后续专利把 QCT
              故事从检测质量控制拓宽到更丰富的靶标关联分子定量，产品栈也显示 BillionToOne 确实把这套逻辑落地到多个工作流。但投资判断仍应折扣最新模块，直到公开验证包追上发布节奏。
