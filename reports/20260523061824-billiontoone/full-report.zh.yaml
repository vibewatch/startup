    rows:
      - - BillionToOne
        - 直接产前 + 肿瘤挑战者
        - 单一品牌横跨 UNITY 和 Northstar，并集成 Epic
        - OB/GYN、MFM、肿瘤诊所
        - 更宽的捆绑产前范围，叠加偏重敏感性的肿瘤工作流
        - 相比领先在位者，公开报销和监管根基更浅
      - - Natera Panorama / Signatera
        - 直接产前 + MRD 同业
        - 2025 年 10-K 明确把收入集中度同 Signatera、Panorama 和 Horizon 绑定
        - OB/MFM 和肿瘤纵向监测
        - 产前以三倍体形成差异化；肿瘤以肿瘤知情 MRD 接入流程形成差异化
        - 高度依赖报销，且近期因竞争营销遭遇不利诉讼
      - - Quest QNatal
        - 产前在位参考实验室服务
        - 全国诊断服务打法，配有患者导航员和预授权支持
        - OB/GYN 和社区产科
        - 可预期的患者责任说明和付款方导航支持
        - 相比 Natera、BillionToOne 或全基因组工作流，检测差异化不够可见
      - - Labcorp MaterniT21
        - 产前在位参考实验室服务
        - 累计 3M+ 次 NIPS 检测，2024 年公司收入 $13.0B
        - OB/GYN、MFM、医疗系统
        - 装机基础规模、双胎数据和全基因组菜单宽度
        - 差异化更多依靠面板宽度和实验室规模，而不是新型工作流主张
      - - Myriad Prequel + Foresight
        - 生殖遗传专科厂商
        - 聚焦生殖遗传的厂商，拥有配套产前和携带者筛查产品
        - 生育、孕前、OB/GYN
        - 产前 + 携带者捆绑，以及低失败率营销
        - 相比 BillionToOne 的双垂直叙事，公开肿瘤重叠有限
      - - Illumina VeriSeq
        - 相邻平台供应商
        - 工作流和试剂供应商，而不是单一品牌外送实验室
        - 运行院内或参考实验室 NIPT 的医院或合作实验室
        - 全基因组 IVD 工作流，异常覆盖广
        - 间接竞争者，成功取决于运营实验室，而不只靠临床医生品牌拉力
      - - Harmony / BioReference 传统业务
        - 传统产前在位者
        - 被广泛研究的品牌，在美国业务转让前已完成 1.5M+ 次检测
        - 传统产前外送账户
        - 临床熟悉度和符合指南的定位
        - 所有权和商业化路径碎片化，使其今天不太像纯粹创新标杆
      - - Guardant
        - 肿瘤液体活检在位者
        - 报销覆盖牵引的晚期实体瘤平台，拥有 FDA 批准的 Guardant360 CDx
        - 肿瘤医生和晚期实体瘤项目
        - 覆盖广、周转快，治疗选择叠加 Reveal 监测
        - 没有产前重叠，且强在位者经济性提高替代难度
      - - Foundation Medicine
        - 肿瘤液体活检在位者
        - Roche 支持的精准肿瘤平台，定位泛肿瘤
        - 肿瘤医生、分子项目、药企关联工作流
        - 324 基因液体 CDx，具备伴随诊断地位，报销叙事强
        - 液体阴性结果仍会回流到组织检测，保留替代工作流
      - - Tempus xF
        - 肿瘤分析平台
        - 快速周转的 ctDNA 面板，接在更宽的数据和 AI 平台上
        - 需要分析和工作流数据集成的肿瘤项目
        - 105 基因临床面板，并向更宽的 xF+ 扩展
        - 公开的 MRD 专项报销姿态不如 Signatera 或 Guardant 明确
      - - Personalis NeXT Personal
        - 肿瘤 MRD 专科厂商
        - 覆盖扩张中的 MRD 检测，推动免疫治疗监测
        - 晚期实体瘤监测和精准肿瘤项目
        - 超高灵敏度监测和增长中的 Medicare 覆盖足迹
        - 规模和撬动切换的能力仍比 Guardant 或 Foundation 更依赖覆盖
    notes: 规模 / 状态只使用公开代理指标：监管文件、装机基础宣称、产品定位和覆盖披露，而不是未公开产品 P&L。
