        - 有可能，但需要再拿出几个干净季度。
      - - 基准
        - 收入持续复合增长，报销仍有支撑，公司维持高增长但非一线诊断倍数。
        - $3.6B-$4.7B 股权价值；当前 $3.95B 市值落在区间内。
        - 如果良好执行只是符合投资者已有预期，股价可能横盘。
        - 这是当前公开记录最能支撑的情景。
      - - 悲观
        - ASP 改善消退，拒付或追偿上升，诉讼或内控问题扩大，或市场将公司重估到低质量同行区间。
        - $2.25B-$3.02B 股权价值，按约 5x-6.5x 指引计算。
        - 报销质量以及法律 / 治理内控问题会直接传导到估值倍数。
        - 如果价格跑在证据质量前面，下行风险真实存在。
    notes: 这些区间是承销带，不是正式目标价。锚点包括当前公开市值、2026 年指引、可比公司区间和可见风险传导。
