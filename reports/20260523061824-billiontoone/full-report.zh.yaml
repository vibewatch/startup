      - number: '2.2'
        title: 测算镜头、估计分歧与数字的真实含义
        blocks:
          - type: paragraph
            body: >-
              原始市场数字有方向价值，但前提是各个镜头不能混在一起。产前量有硬性人口天花板：美国临时 2024 数据记录约 3.62 million 出生，临时 2025 数据约 3.61
              million。这个天花板重要，因为若没有更高渗透率、更丰富检测面板 或国际扩张，国内产前量很难增长。品类边界越宽，公开分析师 TAM 越发散。MarketsandMarkets Blog 将美国 NIPT
              描述为约 USD 1.86 billion；The Business Research Company 给出 2025 年全球 NIPT 为 USD 6.27 billion；Precedence
              用更宽的产前加新生儿基因镜头，把 2026 年规模推到 USD 10 billion 以上。肿瘤侧也是同一模式：Persistence 引用 2026 年美国液体活检市场 USD 2.1
              billion，Grand View 则给出全球品类 USD 13.6
              billion。这些数字不算错误，更准确地说是不可等同。它们混合了地域、用例和邻近范围。尽调中更可靠的测算镜头应更受约束：把人口或疾病量天花板与可报销工作流、同业处理量配对，再问一家中心化外送实验室现实中能赢下这个切口的多少。
