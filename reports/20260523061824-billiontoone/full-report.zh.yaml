      - number: '7.4'
        title: 公开市场与执行风险
        blocks:
          - type: paragraph
            body: >-
              BillionToOne 已不能再像一家私人诊断故事公司那样，用增长叙事遮住流程缺口。IPO
              募集了大量资本，但公开市场负担直接写进文件：增量法律、会计、合规和报告成本；已披露的内控重大缺陷；以及在报销、供应链和人员成本同步变化时仍需守住毛利率。这个季度还显示，应收账款堆得比投资者在报销质量或回款走弱时愿意看到的更快。单看任何一个问题，今天都不足以击穿投资逻辑；但合在一起，它们解释了为什么剩余暴露仍高。公司仍必须证明，它能吸收诉讼、让报销变成可收回现金、在大型医疗系统内执行，并在运行上市公司控制的同时维持产前和肿瘤双垂直增长。实际投资读数很清楚：退出标准不是罕见的科学失败，而是运营和财务信号，例如
              ASP 停滞、拒付或追回上升、集成证据薄弱、应收恶化、控制问题未解决，或改变产前经济性的法律进展。也因此，本章把 IPO 后执行压力视为风险放大器，而不是单独脚注。
