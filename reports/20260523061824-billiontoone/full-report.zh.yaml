  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心平台、产品栈与差异化
        blocks:
          - type: paragraph
            body: >-
              最重要的产品技术事实是，BillionToOne 并没有把产前和肿瘤包装成两门彼此无关的业务。公开记录显示，一个可复用的分子计数架构正从产前单基因检测走向液体活检。2019 年 Scientific
              Reports 论文解释了为什么这重要：标准 NGS 工作流会丢失关于实际存在多少分子的干净信息，而 QCT 在 PCR 前插入带嵌入分子标识的共扩增模板，因此测序后可以重建分子计数。BillionToOne
              当前技术页和产品页延续同一框架，把 smNGS 描述为单分子平台，并在 Unity 和 Northstar
              上使用同一套语言。实践中，这个架构支撑两类战略产品选择。第一，产前工作流可以用一次母体样本捕捉稀疏但临床重要的信号，如隐性变异或胎儿抗原，而无需伴侣样本。第二，肿瘤工作流可以把
              检测面板预算用在灵敏度上，而不只是宽度上；这也是 Northstar Select 围绕可行动检出而非品类最大基因数营销的原因。平台背后也有 IP 脊柱：公司的专利标记页面和后续授权专利，把 QCT
              从检测有效性控制延伸到靶标关联分子定量和测序输出分析。仍缺的是运营层。BillionToOne 解释了检测原理，但没有公开披露通量、自动化设计或失败率数据，无法显示这套科学在日常生产中能否优雅扩展。
