      - number: '6.4'
        title: 持久性缺口、具名证据稀缺与客户风险
        blocks:
          - type: paragraph
            body: >-
              投资论证缺口和正面采用信号一样重要。公开材料没有披露
              NRR、GRR、流失率、续约队列或头部客户集中度，因此很难把有粘性的重复下单，与快速但可能浅层的账户获取区分开。公开具名证据也不均衡。产前证据在规模和一个农村专科医生轶事上最强；肿瘤证据则在研究、学术合作和会议露出上最强。这使外部更难判断，到底有多少综合医疗网络、社区诊所或商业肿瘤集团处于稳定生产使用。客户体验风险也不是理论问题。BBB
              上有 BillionToOne 的投诉页面，Swieczkowski
              案则显示，当筛查结果被过度当成确定诊断时，患者对产前结果的信任和沟通可能变成诉讼问题。即使公司最终胜诉，该案也提醒投资人：诊断采用既靠检测灵敏度，也同样靠清晰信息、下单经济性和随访工作流。实际尽调结论是，BillionToOne
              的客户基础看起来真实且在扩张，但持久性和集中度仍需要管理层私有数据，才能从看似可信走到可被投资论证支撑。
