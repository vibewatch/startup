      - number: '2.4'
        title: 采用驱动因素、约束与估值意义
        blocks:
          - type: paragraph
            body: >-
              乐观逻辑很清楚。产前分子诊断受益于普遍提供的指南、母亲年龄和安全需求，以及核心适应证被覆盖时支付方支持的可负担性。肿瘤液体活检受益于持续庞大的癌症负担、非侵入式获取需求、不断扩展的伴随诊断用途，以及增长中的
              MRD 式监测工作流。Natera 和 Guardant
              的同业披露显示，这些工作流已经在放量。但约束同样重要。产前检测仍有假阳性、结果不确定和确认路径摩擦；肿瘤仍依赖临床效用资料包、支付方审查，并会继续与组织分析共存。扩大准入的合作也需要证据生成、预算协调和实验室产能。FDA
              近期在 LDT 上的反复，又给新实验室自建检测多快能被常态化增加了一层不确定性。估值上，这意味着不能把最大公开 TAM 数字全额计入
              BillionToOne。市场有吸引力，因为两个切口都是数十亿美元级且仍在增长；但价值应押在可报销工作流渗透率、更高价值检测面板的附加率， 以及有证据支撑地扩展到重复肿瘤监测，而不是押在最宽泛诊断品类的数学上。
