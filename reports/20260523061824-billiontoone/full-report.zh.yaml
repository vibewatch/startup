      - number: '3.2'
        title: 肿瘤液体活检龙头与 BillionToOne 的位置
        blocks:
          - type: paragraph
            body: >-
              肿瘤领域比产前更不宽容，因为门槛不只是分析性能，还包括覆盖、监管姿态和既有临床习惯。Guardant 的公开表面把治疗选择液体活检直接连到广泛 Medicare 和商业覆盖，以及 FDA 批准的
              Guardant360 CDx 和不到 7 天周转。Foundation Medicine 把泛肿瘤液体活检叙事与伴随诊断地位、面向参保和 Medicare 患者的广泛财务责任信息配在一起。Tempus
              则打不同切口：105 基因 xF 临床 检测面板、更宽的 xF+ 扩展，以及吸引那些希望一个供应商横跨基因组分析和 AI 工作流的肿瘤项目的数据平台叙事。Natera 的 Signatera 和
              Personalis 的 NeXT Personal 与 BillionToOne 的监测野心关系更直接，因为两者都押注 MRD 式纵向监测；Personalis 新增扩大了免疫治疗监测的 Medicare
              覆盖，Signatera 则通过个体化组织知情测试设计加深锁定。这个背景说明，BillionToOne 的肿瘤护城河读起来有潜力但仍早。BillionToOne 自己的页面称，Northstar Select
              针对治疗选择优化，Northstar Response 针对监测优化，定位强调灵敏度，并用 Epic 工作流嵌入来降低运营摩擦。但公开证据集没有显示其具备可比的 FDA 许可伴随诊断定位，也没有在
              Guardant 和 Foundation 已经营销的同等范围晚期实体瘤工作流中，给出同样成熟的报销语言。换句话说，在灵敏度、工作流简单性或单一供应商协同最重要的场景，Northstar
              仍可能赢；但既有龙头有更强证据证明，大型肿瘤账户采用其检测时，报销不确定性更低。
