  - id: TV005
    title: 投资逻辑破裂及否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - ASP 持续性失守
        - 支付方补价效应消退后，实际 ASP 停滞或回落
        - 当前倍数失去最干净的溢价增长支撑
        - 把估值重置到悲观情景区间，并要求新的支付方队列证据
      - - 诉讼恶化
        - Illumina 在禁令、特许权使用费或高成本和解条款上取得筹码
        - 产前检测经济性和估值溢价同步压缩
        - 提高法律折价，并重新评估“观察”是否应转为“继续研究”
      - - 内控仍然薄弱
        - 重大缺陷又持续一个报告周期，且没有可信整改进展
        - 治理折价固化，公开市场信任恶化
        - 下调信心，并扩大下行情景区间
      - - 肿瘤检测报销不及预期
        - 覆盖扩张放慢，或肿瘤业务利润率仍系统性低于预期
        - 第二增长支柱不再支撑溢价估值
        - 下调乐观情景概率，并收窄上行区间
      - - 融资需求再现
        - 债务提款使用或现金消耗显示，在经济性完全跑通前还需要再融资
        - 股权上行被稀释吃掉，而不是留给复利
        - 把估值判断从合理调向偏高
    notes: 这些触发项都能跟踪，并且直接对应倍数压缩，而不是抽象的公司质量担忧。
    claimRefs:
