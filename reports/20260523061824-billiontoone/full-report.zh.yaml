      - number: '1.3'
        title: 资本形成、公开市场转换与规模
        blocks:
          - type: paragraph
            body: >-
              对一家刚进入公开市场不久的诊断公司来说，BillionToOne 的资本与规模曲线披露异常充分。里程碑页面列出 UNITY 建设期以及后来肿瘤业务建设期的 Series A、B、C 融资；2024 年
              Series D 新闻稿则把该轮定格为 $130 million、估值超过 $1 billion，并称累计融资接近 $400 million。后来一份高管招聘公告又补充了资本数据点——近期 $140
              million 非稀释融资协议——但没有披露结构或契约。公开市场步骤很快到来。IPO 于 2025 年 11 月 5 日按每股 $60 定价，次日在 Nasdaq 以 BLLN
              开始交易；承销商全额行使超额配售权后，总募资约 $314 million。上市后经营表现强劲。2025 全年收入达到 $305.1 million，毛利率 68%；Q1 2026 收入达到 $108.4
              million，毛利率 73%，营业收入 $17.8 million，净利润 $18.0 million。管理层随后在五个月内三次上调 2026 年收入指引，最终给到 $450 million 至 $465
              million。较不扎实的是本报告日期的估值快照和当前员工数：抓取记录给出了历史估值标记和 2024 年员工标记，但没有给出 2026 年 5 月的权威数字。
