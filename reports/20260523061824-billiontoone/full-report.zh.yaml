      - number: '6.3'
        title: 支付方杠杆、工作流契合与扩张机制
        blocks:
          - type: paragraph
            body: >-
              这里的客户采用与报销和工作流契合紧密相连，而不只是技术差异化。最新投资者公告称，截至 Q1 2026，BillionToOne 在美国达到约 300 million 签约覆盖人群；GenomeWeb
              另指出，UnitedHealthcare 网内身份是直接增长驱动因素，因为它应能改善患者可及性，并让付款更可预期。肿瘤可及性也实质推进，Northstar Select 已在 MolDx
              下获得面向符合条件的晚期实体瘤患者的 Medicare
              报销。这些支付方变化很重要，因为诊断客户不会只因临床效用而采用；下单、计费和随访必须嵌进常规诊疗运营。也因此，Epic、一次采血的产前下单，以及新的随访或加项产品，都是客户信号，而不只是产品功能。Unity
              Confirm 就是例子。它存在，是因为高风险产前筛查仍会制造工作流痛点：侵入性确认可能难以获得，许多患者会拒绝，公司则试图把患者留在非侵入性护理路径里。Northstar 在 2026 年 2
              月推出的药物基因组和克隆性造血加项，在肿瘤领域指向同一件事。公司不只是卖一个核心检测；它试图把临床相邻决策加进同一套采血和报告工作流，从而在既有账户内扩份额。
