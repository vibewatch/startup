      - number: '2.3'
        title: 买方、用户与支付方分层
        blocks:
          - type: paragraph
            body: >-
              买方地图在业务两侧都比面向消费者更机构化。产前检测中，患者是检测对象，但实际买方—用户栈穿过 OB/GYN 和母胎医学临床医生、医疗系统或参考实验室工作流，以及决定报销范围的支付方医疗政策。Cigna 和
              UnitedHealthcare 通过规定哪些核心 cfDNA 适应证被覆盖、哪些附加项不在标准覆盖范围内，把这种结构正式化。Natera
              的账单页面随后说明这些政策为什么有商业意义：可负担性和自付摩擦会改变转化。肿瘤液体活检有一张平行但病情更重的地图。肿瘤医生、分子肿瘤项目、医疗系统和支付方政策团队共同决定血液分析或 MRD
              是否适合可报销工作流。Medicare 和 MolDX
              给出临床可接受且可计费的基线，商业支付方和医疗系统则决定检测部署多广。采用路径也因垂直而异。产前检测通常是每次妊娠一次的决策，后面接咨询和确认。肿瘤检测可在诊断、治疗选择、进展和治疗后监测中反复发生，所以即便初始装机基础建立较慢，肿瘤也能承载更多复购经济。
