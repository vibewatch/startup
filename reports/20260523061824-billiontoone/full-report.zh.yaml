      - number: '5.3'
        title: 肿瘤工作流、验证强度与检测约束
        blocks:
          - type: paragraph
            body: >-
              Northstar 不只是产前邻近业务；它是同一平台逻辑在肿瘤中的表达。Northstar Select 是两个核心肿瘤产品中更强的一个，因为它已有同行评议的头对头验证包、AACR 摘要，以及围绕低 VAF
              灵敏度的一致产品页定位。该检测 84 个基因，比部分宽检测面板 更窄，但论点是有意为之：临床可行动性，加上在许多液体活检变得不可靠的水平以下仍有更好灵敏度。公开证据比通常更能支撑这种定位。Journal of
              Liquid Biopsy 论文报告 SNV 或 indel 的 0.15% VAF 灵敏度，以及更好的 CNV、fusion 和 MSI 表现；头对头研究显示更多可行动发现和更少空报告。Northstar
              Response 处理另一件事：治疗监测，而非治疗选择。其公开论文在技术上也有意思，因为它用甲基化、QCT
              支持的分子计数和白细胞层扣减，绕开削弱许多不依赖肿瘤先验监测检测的噪音和突变稀疏问题。不过商业页面的野心领先于临床文献。它营销泛癌种用途和极低肿瘤分数检测，而公开结局证据仍窄于产品定位。2026
              年附加项中的成熟度缺口更明显。Northstar PGx 和 Northstar Select CH 有工作流意义，尤其 CH 是晚期癌症液体活检中的真实混杂因素，会扭曲 PARP
              关联发现；但证明包仍主要是发布材料加产品页面，而不是完整外部验证栈。
