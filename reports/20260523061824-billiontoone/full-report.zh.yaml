      - number: '7.2'
        title: 工作流、质量与客户信任风险
        blocks:
          - type: paragraph
            body: >-
              BillionToOne 的工作流叙事方向上很强，但风险章节必须把已宣布能力与已验证现场使用拆开。Epic
              合作显然帮助公司宣称，在医疗系统、社区诊所、母胎医学和肿瘤诊所之间，下单和结果回传界面更干净。未披露的是：多少站点已经上线，实际有多少比例订单通过 Epic
              流转，以及这些集成是否改善重复下单经济性。这很重要，因为诊断粘性取决于运营现实，而不只是签了一条分销界面。产前确认路径也类似。Unity Confirm
              在战略上聪明，因为它试图补上高风险筛查与侵入性诊断之间的缺口；但发布材料本身显示产品仍早期：公司引用的是只有 16 个样本的极小验证集，以及一项新的 1,000 人研究来做规模化验证。Swieczkowski
              记录说明了这件事为什么重要：当筛查测试被听成诊断时，假阳性或假阴性的含义不再只是抽象的临床限定，而会变成法律、声誉和咨询失败。BBB
              投诉不能证明系统性伤害，但它强化了一点：客户体验和账单沟通仍是投资论证问题的一部分。因此，剩余暴露不只是检测性能，还包括公司能否在增长压力跑到流程成熟度前面之前，把随访、咨询、账单清晰度和 EHR
              集成落到运营里。
