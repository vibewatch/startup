      - number: '4.2'
        title: 报销经济、毛利率路径与经营杠杆
        blocks:
          - type: paragraph
            body: >-
              定价和毛利率故事越来越由支付方驱动。管理层公开评论把 UnitedHealthcare 和 Anthem 的新网络内合同，与约 300 million 受合同覆盖人群、即美国人口 90%
              以上的覆盖足迹连接起来，并明确称这些协议应让 ASP 更高、更可预测。数字已经体现出来：Q1 2026 混合 ASP 达每次检测 $571，同比上升
              28%；早期检测通过新合同重新定价后，追补收入也上升。产前经济受益于商业准入扩大和下单摩擦降低，包括 UnitedHealthcare 在 2025 年 4 月取消无细胞胎儿 DNA
              检测事前授权，尽管报销仍取决于医疗必要性。肿瘤变现更有条件。Northstar Select 从 2025 年 2 月起获得 MolDX 支持的晚期实体瘤 Medicare 准入，但 LCD L38043
              仍收窄覆盖用例和重复检测逻辑；管理层称 Northstar Response 仍未被 Medicare 覆盖，因此结构性毛利率更低。即便存在这些限制，公开业绩仍显示强劲经营杠杆。毛利率从 2024 年 53%
              提升到 2025 年 68%，再到 Q1 2026 的 73%。2025 年和最新季度收入增长都快于运营费用，估计一季度每次交付检测毛利润约
              $421。最佳解读是平台已经在放大，但持续毛利率扩张仍取决于产品组合、报销组合和肿瘤覆盖突破节奏，而不只是检测量。
