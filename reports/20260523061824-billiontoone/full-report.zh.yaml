  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 为何可比
      - 局限
    rows:
      - - BillionToOne
        - 当前公开市场视角
        - $3.95B 市值；约 11.1x 往绩收入；约 8.5x-8.8x 2026 年指引
        - 作为本章价格敏感判断的锚点
        - 上市历史短，报销驱动的收入质量仍很重要
      - - Natera
        - 公开高增长诊断可比
        - $29.10B 市值；约 11.6x 往绩；约 10.3x-10.6x 远期
        - 所抓取样本中最接近的产前增长溢价参照
        - 规模更大、证据基础更广，肿瘤组合也不同
      - - Guardant Health
        - 公开肿瘤权重较高的诊断可比
        - $15.77B 市值；约 14.6x 往绩；约 12.0x 远期
        - 公开样本中最佳的肿瘤增长溢价可比
        - 筛查和肿瘤版图更广、更成熟
      - - Tempus AI
        - 公开 AI 赋能精准医疗可比
        - $8.29B 市值；约 6.1x 往绩；约 5.2x 远期
        - 显示仍在扩张的精准医疗平台可落在较低溢价带
        - 业务组合不同，软件 / 数据敞口也不同
      - - Illumina / Labcorp
        - 成熟诊断背景
        - Illumina 约 4.7x-4.8x 远期；Labcorp 约 1.5x 往绩
        - 提供成熟工具和实验室估值地板作为背景
        - 增长慢得多，经济结构也不同
      - - Exact Sciences / Abbott
        - M&A 背景，不是当前交易可比公司
        - Abbott 同意以每股 $105 收购 Exact，对应约 $21B 股权价值 / $23B EV；Exact 于 2026 年 3 月退市
        - 可作为规模化癌症诊断战略收购的参考背景
        - 含控制权溢价，且不再是独立上市公司的交易倍数
    notes: 这张表刻意把实时公开市场倍数与一个战略收购参照放在一起，方便读者区分交易可比公司和 M&A 稀缺性。
