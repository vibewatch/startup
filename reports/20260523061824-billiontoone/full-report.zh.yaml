  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户细分、买方与下单界面
        blocks:
          - type: paragraph
            body: >-
              BillionToOne 的客户版图比简单的实验室外送检测模式更复杂。产前护理里，真正买单、每天使用的人包括普通 OB/GYN
              医生、母胎医学（MFM）专家、遗传咨询师，以及必须同意筛查和后续随访的孕妇；支付方仍是经济闸门，因为客户触达取决于是否在网、是否接受
              Medicaid，以及报销是否可预期。公开工作流材料解释了公司为什么能在这个细分市场拿份额：Unity Complete
              被定位为面向普通产科人群的一线筛查，只需要一次母体采血，不需要伴侣样本，并以单一患者账单流程销售。专科产前场景则叠在这个基础之上。BillionToOne 已扩大面向同种免疫妊娠的胎儿抗原检测，使 MFM
              和高危妊娠项目成为单独专科细分，而不只是边缘用例。肿瘤侧，买方转向社区肿瘤医生、医院肿瘤医生，以及需要治疗选择液体活检或纵向治疗监测的学术癌症中心。2026 年 1 月与 Epic
              的合作在客户侧重要，因为它承诺通过既有 EHR 触达，而不是让医生再进独立实验室门户。也就是说，综合医疗网络、社区诊所和专科诊所都可以通过同一个下单界面进入，实验室操作则藏在一个对临床医生友好的前端后面。
