  - id: TV006
    title: 最终尽调清单表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 完全稀释后股权结构表
        - 期权、RSU、认股权证及其他按转换口径计算的稀释桥
        - 若隐藏稀释规模较大，当前报价市值可能高估上行空间
        - 索取最新董事会股权结构表材料，以及基本股本到完全稀释股本的桥
      - - 支付方集中度与拒付
        - 按产品拆分的头部支付方敞口、拒付率、申诉胜率和追偿
        - 估值更依赖报销韧性，而不是标价
        - 索取产前和肿瘤业务的月度支付方仪表盘
      - - 肿瘤业务单位经济性
        - 按检测项目拆分的 Northstar ASP、利润率、结构和报销
        - 上行情景需要第二个利润引擎，不能只靠产前业务规模
        - 索取产品级贡献利润分析和支付方队列数据
      - - 诉讼经济性
        - 保险限额、准备金立场、外部律师损失区间和可能时间表
        - 市场无法仅凭新闻标题给法律下行风险定价
        - 索取法律顾问备忘录和董事会诉讼摘要
      - - 内控整改
        - 正式整改状态、测试证据，以及审计师的任何意见
        - 只有拿到硬证据，内控薄弱折价才应收窄
        - 索取 SOX 路线图、负责人、里程碑和测试结果
      - - 收入质量桥
        - 按季度拆分干净的当期回款，以及前期重定价或追补
        - 需要用它判断当前倍数是否建立在可持续现金经济性上
        - 索取自 2025 年 1 月以来的队列回款桥
    notes: 这些尽调事项是将建议从观察推向买入或继续研究，并提升信心的最短路径。
