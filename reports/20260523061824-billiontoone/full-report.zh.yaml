      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              公司已经上市，领导层仍罕见地以创始人为中心。Oguzhan Atay 仍是联合创始人、首席执行官兼董事会主席，David Tsao
              仍是联合创始人、首席技术官兼董事。两人的履历把公司核心技术和战略方向直接连回创始团队；S-1 也说明，创始人影响力不只是文化层面：IPO 引入双重股权结构，Class B 股每股有 15
              票，发行时披露两位联合创始人拥有该超级投票类别的 100%。围绕他们的高管梯队已经明显扩展。Ross Taylor 于 2024 年初加入任 CFO，带来上市公司财务经验；John Lister
              以首席行政官身份覆盖法律和运营基础设施；Shan Riku 横跨产品和临床商业化落地；Nancy Johnson 负责商业运营；Allen Chen 于 2026 年 4
              月加入，强化肿瘤医学事务。公开治理可见度仍不完整，但董事会如今明确有外部财务声音，例如 Premji 的 Akshay Rai 和 Genmab CFO Anthony Pagano；后者在 2026
              年成为审计委员会主席。结果是，公司增加了有经验的运营者和独立董事，却没有淡化清晰的创始人控制。
