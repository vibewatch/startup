  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开市场锚点、股权结构重置，以及股价真正计入了什么
        blocks:
          - type: paragraph
            body: >-
              估值锚点不再是 2024 年 6 月的独角兽轮，而是 IPO 后公开股权结构和投资者真正能买入的交易价格。2024 年 Series D 轮仍重要，因为它说明，在业务拿出上市公司级证明之前，私募投资人已经愿意给
              BillionToOne 超过 $1 billion 门槛的资金支持；但更重要的重置发生在 2025 年 11 月。招股书和 IPO 交割 8-K 显示，公司以每股 $60 出售 5.23 million 股
              Class A 股，获得约 $314 million 总募资和 $286.9 million 净募资；若超额配售权全额行使，发行后股数约为 45.4 million。按招股书股数计算，IPO 隐含约 $2.72
              billion 股权价值。到 2026 年 5 月 22 日，公开市场给 BillionToOne 的估值约为 $3.95 billion，约为 IPO 标记的 1.45 倍；市场数据页面显示约 46.0
              million 股在外，10-Q 披露 41.44 million 股 Class A 加 4.55 million 股 Class B。这意味着公开市场没有把 BillionToOne
              重新压到后期私募基准以下，而是再次抬高了公司估值。因此，关键问题不是 BillionToOne 是否是优质资产，而是当前公开股权价值是否已经计入了大部分运营好消息，却给报销、诉讼和治理意外留下太少余地。
