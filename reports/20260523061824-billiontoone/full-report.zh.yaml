      - number: '8.3'
        title: 公开可比公司、收入倍数视角与乐观 / 基准 / 悲观区间
        blocks:
          - type: paragraph
            body: >-
              可比公司组要求纪律，而不是否定。按当前公开市场数据，BillionToOne 交易在约 11.1 倍过去收入，以及约 8.5 至 8.8 倍当年指引。这比仍能拿到低十几倍远期倍数的 Natera 和
              Guardant 便宜，但比 Tempus、Illumina 贵，也远比 Labcorp 贵。这个相对位置直觉上合理。BillionToOne
              增长远快于成熟工具或实验室公司，毛利率也已经比许多投资人预期更干净，但还没有像最成熟的高溢价诊断赢家那样充分去风险。Exact Sciences 已不再是实时公开可比公司，因为 Abbott 已经收购它；因此
              Exact 数据点现在属于 M&A
              语境，而不是实时倍数基准。该交易有用，因为它证明战略买家对规模化癌症诊断资产有胃口，但带控制权溢价的收购不能证明任何公开市场倍数都可以在没有安全边际时买入。用这些视角看，乐观情景只有在 ASP
              持久性和肿瘤报销继续改善时才成立；基准情景让 BillionToOne 留在高增长溢价区间，但不到诊断估值最顶端；如果报销质量、诉讼或控制问题迫使市场把公司重估到质量更低或阶段更早的同行区间，悲观情景会很快出现。
