  - id: FU001
    title: BillionToOne 客户下单与扩张流程
    type: flow
    layout: wide
    summary: 覆盖和工作流匹配之后，客户获取才启动；随后靠采血便利性、集成化结果交付，以及同一账户内的后续检测或加购产品不断叠加。
    data:
      nodes:
        - id: segment-entry
          label: 细分市场进入
          detail: 普通 OB/GYN、MFM、肿瘤科和学术用户会因临床需求、销售触达或会议曝光接触 BillionToOne。
        - id: coverage-fit
          label: 覆盖与渠道匹配
          detail: 保险接受度、合约覆盖人群、Medicare 覆盖和 Epic 可用性，会决定下单是否可行。
        - id: prenatal-order
          label: 产前下单
          detail: OB/GYN 或 MFM 只需一次母体采血、无需伴侣样本即可下单 Unity。
        - id: oncology-order
          label: 肿瘤下单
          detail: 肿瘤医生从采血下单 Northstar Select 或 Response，而不是先走组织样本工作流。
        - id: central-lab
          label: 中心实验室处理
          detail: 样本进入 BillionToOne 的产前或肿瘤实验室工作流，并返回结构化报告。
        - id: results-surface
          label: 结果进入工作流
          detail: 结果可通过既有医生界面返回，包括已配置的 Epic 和 MyChart。
        - id: prenatal-next-step
          label: 产前下一步
          detail: 高风险结果之后，患者和医生进入咨询、胎儿抗原管理或 Unity Confirm。
        - id: oncology-next-step
          label: 肿瘤下一步
          detail: 医生进入治疗选择、治疗调整或疗效反应解读。
        - id: billing-access
          label: 账单与可及性结果
          detail: 覆盖清晰度和患者账单体验，会影响工作流是否显得可重复。
        - id: repeat-monitoring
          label: 重复监测
          detail: 账户启用后，Northstar Response 支持序列监测和后续采血。
        - id: module-expansion
          label: 模块扩张
          detail: 账户可随时间加入胎儿抗原检测、Unity Confirm、PGx 或 CH 模块。
        - id: channel-scale
          label: 渠道放大
          detail: Epic 和支付方突破能扩大可触达的社区和 IDN 账户数量。
      edges:
        - from: segment-entry
          to: coverage-fit
          label: 临床需求遇到报销现实
