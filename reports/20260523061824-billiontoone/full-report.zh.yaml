  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 从下单到结果解读的可观察流程；产前和肿瘤分支都建立在同一套样本到报告模型上。
    approximationNotes: 本流程抽象掉 BillionToOne 未公开的实验室内部自动化，聚焦临床医生和患者能看到的外部文档步骤。
    data:
      nodes:
        - id: n1
          label: 在门户或 EHR 下单
          detail: OB、MFM 和肿瘤科临床医生可通过医生工作流或 Epic Aura 界面下单。
        - id: n2
          label: 采集血液样本
          detail: 一次母体采血或肿瘤患者采血启动检测旅程。
        - id: n3
          label: 运行检测专属制备
          detail: 按产前 cfDNA、胎儿细胞捕获、CGP、甲基化或白膜层工作流选择制备路径。
        - id: n4
          label: QCT 支撑的测序与计数
          detail: smNGS 或相关计数方法定量分子，并压低制备噪声。
        - id: n5
          label: 临床解读
          detail: 胎儿风险、抗原、CGP、甲基化、PGx 或 CH 逻辑把分子转成可操作信号。
        - id: n6
          label: 交付报告并给出下一步
          detail: 结果回流给临床医生；在已配置场景下，也进入 Epic 或 MyChart；下一步可包括确认性检测或治疗调整。
        - id: n7
          label: 升级未解决边缘案例
          detail: 适应症不可用、证据深度低或运营指标缺失，会给尽调和照护路径带来约束。
