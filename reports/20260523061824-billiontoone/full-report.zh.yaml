          detail: 生物信息学和临床报告把定量后的分子转成胎儿风险、基因组谱或疗效反应输出。
          items:
            - 个性化胎儿风险模型
            - 变异、CNV、融合和 MSI 判读
            - Tumor Methylation Score 趋势
            - 集成加项报告
        - label: 工作流集成与治理
          detail: 医生门户、Epic Aura、实验室认证和专利覆盖共同决定检测如何进入照护流程。
          items:
            - Unity 医生工作流
            - Epic Aura 和 MyChart
            - Union City 产前实验室
            - Menlo Park 肿瘤实验室
            - 专利标记与 QCT IP 家族
