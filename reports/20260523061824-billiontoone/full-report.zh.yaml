        - 没有组合，投资人无法判断 ASP 提升到底有多持久
        - 签约覆盖人数和政策胜利公开，但组合不公开
        - 重大
        - 按支付方桶和网内状态索取季度收入、检测量和回款
      - - 拒付率、申诉和坏账经验
        - 收入确认依赖可变对价，因此回款质量直接影响盈利质量
        - Q1 调整收入和应收账款增长
        - 重大
        - 要求提供按付款方拆分的拒付瀑布、核销率和申诉成功率
      - - 产前与肿瘤产品级毛利率和 ASP
        - 合并毛利率掩盖了肿瘤业务放量到底增厚还是摊薄利润
        - Q1 公司整体毛利率，以及业绩会中关于肿瘤业务毛利率较低的表述
        - 重大
        - 提供分部毛利桥，以及 Select 与 Response 的经济性对比
      - - CAC、回本周期和服务方队列留存
        - 经营杠杆已经显现，但销售效率还无法清楚评估
        - 只能用收入和运营开支增长做代理指标
        - 重大
        - 要求提供按渠道拆分的队列获客成本、复购节奏和服务方留存
      - - 增长背后的服务方或医疗体系集中度
        - 未见 >10% 客户集中披露是正面信息，但颗粒度太粗，难以支撑实操尽调
        - 10-K 集中度说明和已点名合作关系
        - 轻微
        - 提供前 10 大服务方账户、按下单集团拆分的集中度和最低量条款
      - - 债务融资经济性和契约条款
        - 当前债务规模或许不大，但契约或认股权证条款仍可能限制未来灵活性
        - 公开文件披露了分期结构，但没有达到放贷方尽调所需的条款清单
        - 重大
        - 要求提供票据购买协议摘要，涵盖定价、触发条件、契约、抵押品和提前还款规则
      - - Northstar Response 报销时间线和预期费率
        - 肿瘤业务毛利率和估值上行取决于补上这一覆盖缺口
        - 管理层称 MolDX 评审仍在推进；没有覆盖时毛利率仍较低
        - 阻塞性
        - 取得付款方提交材料、回复时间线，以及有无 Medicare 支持下的经济性模型
    notes: 这些不是泛泛的尽调清单；它们是仍然阻碍完整评估收入质量、毛利率韧性和融资灵活性的具体缺失数据点。
