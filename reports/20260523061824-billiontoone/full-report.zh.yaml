      - number: '5.2'
        title: 产前工作流、验证深度与临床边界
        blocks:
          - type: paragraph
            body: >-
              产前组合是 BillionToOne 最成熟的地方。Unity Complete 被定位为一次样本工作流，最早九周即可直接评估隐性、X
              连锁和非整倍体疾病的胎儿风险，无需伴侣样本；支撑该主张的发表集已经不算薄。反射式单基因工作流背后有一篇大型一般人群论文，胎儿抗原项目则同时有分析验证和真实世界临床使用数据。Unity
              的发表页面还为一般风险患者提供了单独的常见非整倍体性能镜头。最新一块是 Unity Confirm。战略上它重要，因为它试图用母体血液中的循环胎儿细胞，解决高风险 cfDNA
              筛查和侵入式诊断之间尴尬的交接。这确实有差异化。但当前证据仍早：2026 年公开证据是 16 例结果摘要加发布材料，还达不到老 cfDNA 工作流那样的同行评议多中心证据深度。公司 2026
              年扩展到红细胞和血小板胎儿抗原 NIPT，说明产前栈继续变宽，同时没有离开同一条分子计数骨架。不过 ACOG 和 SMFM 在这里仍重要。现行指南继续把 cfDNA 定位为筛查而非诊断，并把微缺失或更广拷贝数
              问题推回诊断检测。这意味着 BillionToOne 的产前故事在被销售为更早、更可行动的分诊时最强；如果把它营销成诊断边界本身的替代品，就更具投机性。
