      - number: '7.3'
        title: 依赖与竞争替代风险
        blocks:
          - type: paragraph
            body: >-
              覆盖和工作流的胜利也暴露集中风险可能落在哪里。产前领域，广泛 NIPT 覆盖是真实的，但不同子适应症并不均匀，具体政策仍区分主流非整倍体筛查和更窄的胎儿基因型或专科用例。肿瘤领域，Northstar Select
              的 MolDx 状态是重大正面因素，但也凸显公司依赖一个管理层无法完全控制的报销框架。除此之外，竞争对手并没有原地不动。BillionToOne 自己的文件点名
              Illumina、Labcorp、Myriad、Natera 和 Quest 参与产前检测，第三方和竞争对手来源也显示，这些既有巨头仍在营销高性能工作流或差异化主张。肿瘤集合更难打：Guardant
              营销一款覆盖广的 FDA 批准检测面板，Foundation 和 Tempus 有明确监管定位，Personalis 正在扩大 Medicare 支持的监测。上述事实都不意味着 Northstar
              不能赢，但它们意味着 BillionToOne
              正在与装机基础更大、披露报销更广或正式监管标签更深的同行竞争规模化。剩余风险因此上升：支付方胜利可能只是必要不充分。公司也许仍要在证据生成和商业执行上大量投入，才能守住当前轨迹，更不用说替代根基更深的竞争对手。
