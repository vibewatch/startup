  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 边界、纳入支出与替代工作流
        blocks:
          - type: paragraph
            body: >-
              第一步是画出足够紧、才有经济意义的边界。BillionToOne 的产前市场不是“所有女性健康诊断”；它是夹在指南驱动 OB 护理和侵入式确认之间的母体血液分子筛查切口。ACOG 和 SMFM
              支持向所有产科患者常规提供
              cfDNA，并称其是常见非整倍体最敏感、最特异的筛查测试；但两者也保留了微缺失、多胎、结果不确定和继发发现等注意事项。也就是说，侵入式诊断、咨询和现状超声路径仍是替代或后续工作流，不会从护理路径中消失。肿瘤侧同样具体。BillionToOne
              竞争的不是全部癌症诊断支出；它在血浆基因组分析和复发监测工作流里竞争，液体活检可以替代或补充组织分析。CMS、MolDX
              和商业支付方政策重要，因为它们定义这些分子工作流何时值得支付。因此，实用市场边界是产前分子筛查加肿瘤液体活检；侵入式确认、组织病理、新生儿筛查和宽泛多癌种邻近市场，应视为替代或外缘邻近，而不是直接 SAM。
