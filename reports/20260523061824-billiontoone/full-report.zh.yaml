      - number: '3.3'
        title: 切换成本、分销能力与多供方现实
        blocks:
          - type: paragraph
            body: >-
              实际竞争问题不是谁的灵敏度口号最强，而是谁在买方工作流已经运转后最难被替换。与肿瘤相比，产前切换成本相对中等。OB 和母胎医学站点可以多供方并用；Natera 和 Quest
              的公开页面显示，患者责任支持、事前授权帮助和报销可预测性都是核心销售工具。即使挑战者提供技术上更宽的组合，这种动态也有利于拥有大外送量和广合同能力的既有厂商。BillionToOne 的 Epic
              集成在这里重要，因为它减少下单摩擦并改善结果交付，但它仍只是一个分销杠杆，要与已经发布更清晰患者导航和成本预期项目的既有厂商竞争。肿瘤经济更黏。Signatera
              明确要求先完成组织和匹配正常样本建档，之后序列血液监测才变简单；因此，一个站点一旦用 Natera 开始肿瘤知情 MRD，就会吸收有意义的切换摩擦。Guardant 和 Foundation 通过广泛覆盖和
              FDA 关联治疗选择使用形成另一类锁定，Tempus 则靠平台邻近和快速周转竞争。CMS MolDX 通过把覆盖限定为有证据支撑而非自动，强化了这一切。这意味着买方仍可在治疗选择、MRD
              和监测之间多供方并用，但他们是在一个奖励已验证既有厂商的报销架构内这么做。BillionToOne
              的机会是把灵敏度和集成工作流变成切口；风险是，根深蒂固的报销路径和个体化路径会让这些切口保持狭窄，直到更大账户看到更多临床和经济证明。
