    rows:
      - - cfDNA 普筛建议
        - 正向
        - 当前
        - 降低产前护理中的品类摩擦，扩大符合条件的临床医生范围
        - 衡量 BillionToOne 产前检测量中，有多少来自平均风险人群，而不是历史上的高风险队列
      - - 高龄产妇和安全偏好
        - 正向
        - 当前
        - 即便出生数持平，也能支撑无创产前检测需求
        - 按产妇年龄段和面板类型索取检测量增长
      - - 付款方覆盖和可负担性
        - 正向
        - 当前
        - 把临床医生意图转化为已付费检测量，并降低患者放弃率
        - 按付款方维度审查拒付率、预授权负担和自付金额分布
      - - 稳定或下降的出生队列
        - 反向
        - 结构性
        - 限制美国产前检测量增长，除非渗透率或 ASP 上升
        - 在出生数持平而非假设人口扩张的情景下测算产前上行空间
      - - 无法判读结果和确认性诊断
        - 反向
        - 当前
        - 让咨询成本和侵入性随访继续留在路径里
        - 量化无结果率、咨询负担和确认转化
      - - CMS / MolDX 肿瘤覆盖
        - 正向
        - 当前
        - 验证可报销的液体活检工作流，并打开 Medicare 需求
        - 梳理 BillionToOne 哪些肿瘤适应证符合现有 LCD，哪些仍需证据
      - - 复测 MRD 和随访工作流
        - 正向
        - 中期
        - 在一次性诊断之外创造经常性收入潜力
        - 将肿瘤订单拆分为治疗选择和连续监测用例
      - - 临床效用和证据要求
        - 反向
        - 当前
        - 放慢新适应证发布和付款方扩张
        - 索取研究路线图、发表节奏和付款方证据包状态
      - - 分布式检测和工作流合作
        - 正向
        - 中期
        - 可借助医疗系统和本地检测触点扩大可及性
        - 测试合作关系究竟缩短采用周期，还是只是增加实施工作
      - - LDT 和实验室产能波动
        - 反向
        - 当前
        - 给产前和肿瘤扩张都增加监管和运营压力
        - 审查合规路线图、实验室吞吐瓶颈，以及各检测项目的人员密集度
    notes: 市场有吸引力，因为两个垂直方向都有真实结构性需求；但运营和监管约束足够重，估值应基于可报销执行，而不是抽象 TAM。
