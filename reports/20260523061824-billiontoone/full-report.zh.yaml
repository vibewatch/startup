  productSummary: >
    BillionToOne 销售基于 QCT 单分子测序的中心化分子诊断。产前检测中，UNITY Complete 及配套产品通过一次母体抽血评估隐性遗传、X 连锁、非整倍体和胎儿抗原风险；Unity Confirm
    则把流程延伸到高风险筛查之后的无创确认。肿瘤领域，Northstar Select 是用于治疗选择的 84 基因液体活检，Northstar Response 是基于甲基化的监测检测；新的 PGx
    和克隆性造血附加项也可来自同一次抽血。
  customerFocus: |
    公司在女性健康侧面向产科医生、母胎医学机构、医疗系统和社区产前服务提供者；在液体活检侧面向肿瘤诊所、社区机构和癌症中心。
  businessModel: |
    BillionToOne 以中心化诊断实验室运营。公开文件称，收入主要来自第三方保险公司；产前检测仍是主要收入引擎，肿瘤贡献较小但增长更快。商业增长靠报销、支付方合同和嵌入工作流，而不是直接的软件订阅收入。
  stage: 'Public (Nasdaq: BLLN)'
