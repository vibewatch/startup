      - number: '8.4'
        title: 建议、杀伤触发条件，以及会改变判断的尽调工作
        blocks:
          - type: paragraph
            body: >-
              当前证据下，最干净的建议是观察，不是买入。BillionToOne
              已经赢得了严肃估值：公司已上市、资本充足、增长很快、经营利润线已盈利，并且仍在增加报销支持。问题不在公司质量，而在当前公开市场价值已经落入合理基准情景区间，新资金承担报销、诉讼和控制整改风险时，已经拿不到清晰折价。反向逻辑也异常具体。Illumina
              已经寻求禁令和版税式救济，Swieczkowski
              案挺过驳回动议，披露控制仍因重大缺陷尚未整改而无效，公开文件对完全稀释股权结构、支付方集中度、拒付率和诉讼经济性的展示也不够紧，支撑不了高确信买入。决策规则因此很直接。只有当 ASP
              提升能跨过一次性追补调整继续存在、肿瘤报销扩大且不侵蚀利润率、治理 /
              控制整改清晰可见时，投资人才能上调判断。如果拒付或追回上升、诉讼经济性恶化，或肿瘤成为持久第二利润池之前融资需求重新出现，就应迅速下调。在此之前，BillionToOne 看起来是估值合理到略满，而不是明显错价。
