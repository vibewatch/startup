    summary: 当前公开市场市值落在基准情景内，仍有上行空间，但安全边际不足以支撑买入建议。
    data:
      items:
        - label: 悲观情景
          low: 2.25
          mid: 2.64
          high: 3.02
          unit: $B
          displayValue: $2.25B-$3.02B
          detail: 报销质量走弱，或诉讼 / 内控问题迫使估值倍数压缩。
        - label: 基准情景
          low: 3.6
          mid: 4.15
          high: 4.7
          unit: $B
          displayValue: $3.6B-$4.7B
          detail: 增长仍强，但公司停留在中等溢价区间。
        - label: 乐观情景
          low: 4.8
          mid: 5.2
          high: 5.6
          unit: $B
          displayValue: $4.8B-$5.6B
          detail: 指引、ASP 和肿瘤业务经济性持续改善。
        - label: 当前公开市场价值
