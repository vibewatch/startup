      - number: '6.2'
        title: 按垂直场景看采用轨迹和具名证据
        blocks:
          - type: paragraph
            body: >-
              本章最强的客户证据是覆盖广度，而不是客户标识密度。对一家刚上市不久的诊断公司而言，产前采用已经给出少见的规模信号：2023 年 UNITY 临床结果论文覆盖超过 42,000 名患者、811 家临床实践机构和
              45 个州，Y Combinator 后来还写道，美国每 11 个婴儿中就有 1 个使用 BillionToOne 的胎儿基因检测。近期经营指标进一步说明业务并非静止：公司在 Q4 2025 交付 170,000
              次检测，新增活跃下单医生创纪录，随后又在 Q1 2026 交付 188,000 次检测。产前具名证据更薄，但不是没有。最好的公开例子是 Sanford Clinic，一名母胎医学专家称，UNITY Fetal
              Antigen NIPT 减少了农村高危妊娠患者每周上百英里的往返需求。肿瘤证据又是另一种形态。公开材料没有列出一长串商业癌症中心 标识；最具体的证据是机构和研究层面：Northstar Select 被日本
              National Cancer Center Hospital East 的 LC-SCRUM-TRY 网络选用，较早的 Northstar 合作与 UC San Diego 公布，头对头验证集包括 6
              家社区肿瘤诊所和 1 家大型医院。结论是，BillionToOne 显然有真实客户和真实用户，但公开证据更偏向大规模产前使用，以及由研究或试验牵头的肿瘤验证，而不是完整披露的生产账户名单。
