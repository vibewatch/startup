  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 产前格局、直接重叠与现状替代
        blocks:
          - type: paragraph
            body: >-
              BillionToOne 的产前故事有差异化，但并非没有争夺。它自己的产品页和 Epic 集成页主张，UNITY Complete 如今承担的工作比经典只看非整倍体的 NIPT 更宽：用一次母体样本直接评估多达
              14 种隐性遗传和 X 连锁疾病的胎儿风险，加上非整倍体，并交付在可直接嵌入 Epic 的工作流中。这是实在的范围优势，尤其是面对公共口径仍围绕标准染色体筛查的测试。但直接产前重叠仍然很重。Natera 的
              Panorama 仍宣称品类中最强的单点话术——三倍体检测——同时也营销微缺失筛查。Labcorp 的 MaterniT21 PLUS 强调装机基础规模、双胎数据和全基因组菜单宽度。Quest
              以全国实验室服务打法竞争，重点是患者导航、事前授权支持和有上限的患者责任，而不是新颖检测科学。Myriad 通过把 Prequel 与 Foresight 携带者筛查搭配，维持生殖遗传组合；这点重要，因为
              BillionToOne 自身差异化部分取决于买方是否想在相邻产前工作流中使用一个供应商关系。另一股产前压力来自邻近市场和遗留结构。Illumina 的 VeriSeq 不像 Panorama 或
              MaterniT21 那样是品牌化外送实验室，但它重要，因为它让实验室能够运行全基因组 NIPT
              工作流，覆盖广泛异常且失败率低。它可以把高性能筛查变成实验室基础设施，而不是单一供应商目的地，从而压缩差异化。Harmony 则相反：临床上仍熟悉，Roche 仍在营销该品牌，但 BioReference 收购
              Ariosa 的美国中心化业务说明，临床历史不等于当下竞争强度。现状替代也依然存在。这些供应商仍把产品描述为筛查工具，而不是最终诊断；即使菜单宽度扩大，超声、咨询和侵入式确认仍留在护理路径中。
            claimRefs:
