  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 法律、监管与报销风险
        blocks:
          - type: paragraph
            body: >-
              最直接的下行如今已经外部可见，而不是假设。Illumina 已就三项产前检测专利起诉 BillionToOne，寻求禁令和金钱救济；公司公开反驳仅限于称诉求没有依据，并会积极抗辩。另一个重要事项是
              Swieczkowski 诉讼，因为它不只是常规产品责任纠纷；法院允许消费者欺诈、欺诈和过失虚假陈述等理论在驳回动议阶段保留下来，底层指控直指产前筛查的核心风险：筛查产品可能被患者听成诊断确定性。监管侧，短期
              LDT 悬顶风险比 2024 年看起来低，因为 FDA 的 LDT
              最终规则已被撤销且未上诉，但这只移除了眼前按医疗器械方式分阶段实施的压力。政策波动和未来联邦行动的可能性并没有消失。报销风险仍与法律姿态紧紧绑在一起。Northstar Select 的 MolDx
              覆盖确实降风险，但覆盖路径仍穿过承包商管理的规则，这些规则可以被修订；商业支付方也仍可收窄覆盖、拖延付款或要求追回款项。投资判断结论是，诉讼和支付方管理现在足以更快放大下行，单靠检测需求未必追得上。
