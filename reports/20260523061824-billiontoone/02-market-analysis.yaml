    {
      "id": "boundary-and-substitutes",
      "title": "Boundary, Included Spend, and Substitute Workflows",
      "body": "The first step is to draw a boundary tight enough to be economically useful. For BillionToOne, the prenatal market is not “all women’s health diagnostics”; it is the maternal-blood molecular screening wedge that sits between guideline-driven OB care and invasive confirmation. ACOG and SMFM support routine cfDNA availability for all obstetrical patients and describe it as the most sensitive and specific screening test for common aneuploidies, but they also preserve microdeletion, multifetal, inconclusive-result, and secondary-finding caveats. That means invasive diagnostics, counseling, and status-quo ultrasound pathways remain substitutes or follow-on workflows rather than disappearing from the care pathway. The oncology side is similarly specific. BillionToOne is not competing for all cancer diagnostics spend; it is competing inside plasma-based genomic profiling and recurrence-monitoring workflows where liquid biopsy can substitute for or complement tissue-based profiling. CMS, MolDX, and commercial payer policies matter because they define when these molecular workflows are reasonable to pay for. The practical market boundary is therefore prenatal molecular screening plus oncology liquid biopsy, with invasive confirmation, tissue pathology, newborn screening, and broad multi-cancer adjacencies treated as substitutes or outer-edge adjacencies rather than direct SAM.",
