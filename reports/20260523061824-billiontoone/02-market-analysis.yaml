  "chapter": {
    "number": 2,
    "title": "Market Analysis",
    "summary": "BillionToOne sits inside two adjacent but materially different markets: prenatal molecular screening, where annual birth volume caps top-line addressability, and oncology liquid biopsy, where recurring treatment-selection and monitoring workflows can compound demand. Public TAM estimates are genuinely broad but not directly comparable — U.S. NIPT is cited around USD 1.86 billion, broader prenatal and newborn genetics around USD 3.84 billion in the U.S. or USD 10.48 billion globally, U.S. liquid biopsy around USD 2.1 billion, and global liquid biopsy around USD 13.6 billion — so serviceable value depends more on reimbursement, workflow fit, and evidence thresholds than on one generic diagnostics TAM. The key market takeaway is that BillionToOne’s valuation should be tied to its ability to win reimbursed send-out volumes in OB/MFM and oncology accounts, not to the largest public diagnostics estimate."
  },
