      "id": "drivers-constraints-and-valuation-meaning",
      "title": "Adoption Drivers, Constraints, and Valuation Relevance",
      "body": "The bullish case is clear. Prenatal molecular diagnostics benefits from universal-offer guidance, maternal-age and safety demand, and payer-backed affordability when core indications are covered. Oncology liquid biopsy benefits from large ongoing cancer burden, demand for noninvasive access, expanding companion-diagnostic utility, and growing MRD-style surveillance workflows. Peer disclosures from Natera and Guardant suggest these workflows are already scaling. But the constraints are equally important. Prenatal testing still carries false-positive, inconclusive, and confirmatory-pathway friction; oncology still depends on clinical-utility dossiers, payer review, and continued coexistence with tissue-based profiling. Partnerships that widen access also require evidence generation, budget coordination, and lab capacity. FDA’s recent LDT reversals add another layer of uncertainty around how quickly new lab-developed assays will be normalized. For valuation, this means BillionToOne should not receive full credit for the largest public TAM figures. The market is attractive because both wedges are multi-billion-dollar and still growing, but value should be underwritten against reimbursed workflow penetration, attach rates for higher-value panels, and evidence-backed expansion into repeat oncology monitoring rather than against the broadest diagnostics category math.",
