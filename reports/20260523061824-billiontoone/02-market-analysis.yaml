    {
      "id": "buyers-payers-and-adoption-paths",
      "title": "Buyer, User, and Payer Segmentation",
      "body": "The buyer map is more institutional than consumer-facing on both sides of the business. In prenatal testing, the patient is the subject of the test, but the practical buyer-user stack runs through OB/GYN and maternal-fetal medicine clinicians, health-system or reference-lab workflows, and payer medical policies that determine what gets reimbursed. Cigna and UnitedHealthcare formalize that structure by specifying what core cfDNA indications are covered and which add-ons sit outside standard coverage. Natera’s billing page then shows why those policies matter commercially: affordability and out-of-pocket friction change conversion. Oncology liquid biopsy has a parallel but higher-acuity map. Oncologists, molecular tumor programs, health systems, and payer policy teams decide whether blood-based profiling or MRD fits a reimbursed workflow. Medicare and MolDX create the baseline for what is clinically acceptable and billable, while commercial payers and health systems decide how widely tests are deployed. The adoption path also differs by vertical. Prenatal testing is usually a once-per-pregnancy decision with follow-on counseling and confirmation. Oncology can be repeated at diagnosis, therapy selection, progression, and post-treatment monitoring, which is why oncology can carry more recurring economics even when the initial installed-base build is slower.",
