company:
  name: BillionToOne
chapter:
  number: 7
  title: Risks
  summary: BillionToOne’s residual risk is concentrated less in raw demand than in whether reimbursement, workflow discipline, and legal exposure stay contained as a newly public diagnostics company scales two product lines at once. The de-risking evidence is real—MolDx coverage, UnitedHealthcare access, Epic distribution, and a company rebuttal to the Illumina suit—but public gaps around payer concentration, Epic live utilization, litigation economics, and confirmatory funnel conversion keep residual exposure high rather than moderate.
sections:
- id: legal-regulatory-and-reimbursement-risk
  title: Legal, Regulatory, and Reimbursement Risk
  body: The most immediate downside is now externally visible rather than hypothetical. Illumina has already sued BillionToOne over three prenatal-testing patents and is seeking injunctive and monetary relief, while the company’s public rebuttal is limited to saying the claims are without merit and will be defended vigorously. Separately, the Swieczkowski litigation matters because it is not just a routine product-liability dispute; the court allowed consumer-fraud, fraud, and negligent-misrepresentation theories to survive a motion to dismiss, and the underlying allegations go directly to the core prenatal-screening risk that a screening product can be heard by patients as diagnostic certainty. On the regulatory side, the near-term LDT overhang is lower than it looked in 2024 because the FDA’s LDT final rule was vacated and not appealed, but that only removes the immediate device-style phase-in. It does not remove policy volatility or the possibility of future federal action. Reimbursement
    risk remains tightly coupled to that legal posture. Northstar Select’s MolDx coverage is a real de-risker, yet the coverage path still runs through contractor-administered rules that can be revised, and commercial payers can still narrow coverage, delay payment, or demand recoupments. The underwriting takeaway is that litigation and payer administration can now move the downside faster than pure assay demand can rescue it.
