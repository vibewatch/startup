  evidenceGaps:
  - type: missing-source
    severity: material
    topic: payer-concentration-disclosure
    missingEvidence: Public disclosure of top-payer share, denial rate, appeal win rate, and recoupment rate by prenatal versus oncology product line.
    whyItMatters: Residual reimbursement risk cannot be fully underwritten without knowing whether access and cash conversion depend on a narrow payer set or fragile claims quality.
    diligencePath: Request payer mix, out-of-network share, denial waterfall, and recoupment statistics by product, payer, and quarter.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: material
    topic: epic-live-utilization
    missingEvidence: Live Epic site count, implementation timelines, Epic-routed order share, and post-go-live reorder behavior.
    whyItMatters: The Epic dependency could be a real distribution advantage or only a narrative boost; without utilization evidence, the workflow upside cannot be underwritten as durable.
    diligencePath: Request number of live sites, time-to-go-live, order share through Epic, and evidence that Epic-integrated accounts reorder more than non-integrated accounts.
    relatedQuestionRefs:
    - QR022
    relatedTableRefs:
    - TR002
    - TR003
  - type: missing-source
    severity: material
    topic: litigation-reserve-and-insurance
    missingEvidence: Public reserve analysis, indemnity posture, IP insurance coverage, or outside-counsel assessment for the active litigation matters.
    whyItMatters: The filings disclose that legal matters may not be material as of quarter-end, but investors still lack the economics needed to size downside from injunction, settlement, or defense cost.
    diligencePath: Request reserve disclosure, insurance and indemnity summary, and board-level process for assessing the Illumina and Swieczkowski matters.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR001
  - type: missing-source
    severity: material
    topic: confirmatory-funnel
    missingEvidence: Public conversion data from high-risk prenatal screen to Unity Confirm, invasive testing, pregnancy-management change, or no follow-up.
    whyItMatters: False-positive or false-negative implications are economically and clinically transmitted through the follow-up funnel, not just through headline assay metrics.
    diligencePath: Request funnel conversion metrics by site type, gestational age, payer status, and whether counseling occurred before patients declined invasive confirmation.
    relatedQuestionRefs:
    - QR015
    - QR028
    relatedTableRefs:
    - TR002
  - type: missing-source
    severity: material
    topic: oncology-reimbursement-quality
    missingEvidence: Public MolDx audit outcomes, Z-code denial rates, commercial oncology appeal win rates, and net-collection performance for Northstar products.
    whyItMatters: Northstar Select coverage is a milestone, but the investment thesis still depends on collectible reimbursement quality and not only on technical coverage eligibility.
    diligencePath: Request oncology denial, appeal, and recoupment metrics by payer, along with evidence that additional payer wins are converting into stable ASP and cash collection.
    relatedQuestionRefs:
    - QR010
    - QR020
    - QR021
    relatedTableRefs:
    - TR002
    - TR003
