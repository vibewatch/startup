- id: TR005
  title: Mitigation and exit-criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Illumina patent suit
    - Case posture worsens
    - Adverse claim-construction signal, injunction briefing, or disclosed reserve tied to the case
    - Move view from hold-and-monitor to hard downside underwriting until remedy scope is clearer
  - - Swieczkowski / screening-labeling risk
    - Adverse legal or complaint trend
    - Additional suits, materially rising complaint count, or evidence that counseling language still implies diagnostic certainty
    - Treat prenatal gross-margin assumptions and brand durability as impaired
  - - Oncology reimbursement quality
    - Coverage or collections weaken
    - MolDx challenge, elevated denials, or commercial ASP stops improving despite volume growth
    - Reduce confidence in oncology scale-up and margin leverage
  - - Epic / workflow dependence
    - Channel remains narrative-only
    - No disclosed live-site evidence or Epic-routed volume over the next refresh cycle
    - Discount workflow-multiple upside and treat integration as optional rather than structural
  - - Competitive displacement
    - Peers widen their advantage
    - Another peer wins materially broader payer coverage or adds formal CDx labels where Northstar stays uncovered
    - Assume higher customer-acquisition cost and slower oncology penetration
  - - Public-company execution
    - Controls or cash-conversion slip
    - Material-weakness remediation stalls, receivables keep outgrowing revenue, or public-company cost growth erodes operating leverage
    - Shift valuation stance to evidence-waiting rather than execution-trusting
  notes: These are investment decision criteria, not management aspirations. Each trigger is intentionally tied to an observable legal, reimbursement, workflow, competitive, or cash-conversion event.
