- id: public-market-and-execution-risk
  title: Public-Market and Execution Risk
  body: 'BillionToOne is no longer being judged like a private diagnostics story that can paper over process gaps with growth narratives. The IPO raised substantial capital, but the public-market burden shows up directly in the filings: incremental legal, accounting, compliance, and reporting costs; disclosed material weaknesses in internal control; and a stated need to preserve gross margin while reimbursement, supply chain, and personnel costs all move at once. The quarter also showed accounts receivable building faster than investors would want to see if reimbursement quality or collections ever soften. None of those issues alone breaks the thesis today, but together they explain why residual exposure stays high. The company still has to prove it can absorb litigation, keep reimbursement collectible, execute inside large health systems, and sustain dual-vertical growth while running public-company controls. The practical investment read-through is clear: the exit criteria are not exotic
    science failures. They are operational and financial signals such as stalled ASP, rising denials or recoupments, weak integration evidence, worsening receivables, unresolved control issues, or legal developments that shift the prenatal economics. That is why this chapter treats post-IPO execution pressure as a risk multiplier rather than a standalone footnote.'
