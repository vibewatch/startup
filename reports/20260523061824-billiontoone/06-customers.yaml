- id: adoption-proof-by-vertical
  title: Adoption Trajectory and Named Proof by Vertical
  body: 'The strongest customer proof in this chapter is breadth, not logo density. Prenatal adoption has unusually good scale signals for a still-young public diagnostics company: the 2023 UNITY clinical-outcomes paper spanned more than 42,000 patients, 811 clinical practices, and 45 states, and Y Combinator later wrote that 1 in 11 U.S. babies are tested with BillionToOne''s fetal genetic test. Recent operating metrics reinforce that the business is not static: the company delivered 170,000 tests in Q4 2025, added a record number of new active ordering providers, then delivered 188,000 tests in Q1 2026. Named prenatal proof is thinner but not absent. The best public example is Sanford Clinic, where a maternal-fetal medicine specialist said UNITY Fetal Antigen NIPT reduced the need for hundred-mile weekly trips in rural high-risk pregnancies. Oncology evidence is different again. Instead of a long public list of commercial cancer-center logos, the most concrete proof points are institutional
    and study-based: Northstar Select was chosen for Japan''s LC-SCRUM-TRY network at National Cancer Center Hospital East, earlier Northstar collaboration was announced with UC San Diego, and the head-to-head validation set included six community oncology clinics and one large hospital. The implication is that BillionToOne clearly has real customers and real users, but public proof skews toward large-scale prenatal utilization and research or study-led oncology validation rather than fully disclosed production account rosters.'
