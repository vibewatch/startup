  evidenceGaps:
  - type: missing-source
    severity: material
    topic: retention-metrics
    missingEvidence: Public NRR, GRR, churn, renewal, and cohort data split by prenatal versus oncology accounts.
    whyItMatters: Without disclosed retention data, test-volume growth cannot be separated from one-time ordering spikes or channel expansion.
    diligencePath: Request cohort retention, reorder rates, and renewal behavior by product line, payer status, and customer segment.
    relatedQuestionRefs:
    - QU019
    relatedTableRefs:
    - TU007
  - type: missing-source
    severity: material
    topic: concentration-disclosure
    missingEvidence: Top-10 customer share, ordering-provider concentration, and payer mix split across prenatal and oncology volumes.
    whyItMatters: Customer-quality risk could sit in a small set of payers, high-volume OB groups, or a narrow oncology-account base.
    diligencePath: Request top-10 account revenue and test-volume share, plus payer mix and ordering-provider concentration by business line.
    relatedQuestionRefs:
    - QU020
    relatedTableRefs:
    - TU008
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-scarcity
    missingEvidence: A named production-customer list across OB/GYN, MFM, IDN, community-clinic, and oncology settings with deployment status and outcomes.
    whyItMatters: Current public proof is strong on broad prenatal scale and study-led oncology use, but thin on fully disclosed production accounts.
    diligencePath: Ask management for 10 to 20 named reference accounts, whether each is pilot or production, and what measurable outcomes each account achieved.
    relatedQuestionRefs:
    - QU011
    - QU012
    - QU027
    relatedTableRefs:
    - TU004
  - type: missing-source
    severity: material
    topic: epic-live-sites
    missingEvidence: Live Epic Aura site count, implementation timelines, activated modules, and percentage of ordering volume running through Epic.
    whyItMatters: Channel value cannot be underwritten without proof that Epic integrations are live and used rather than merely contracted or marketed.
    diligencePath: Request number of live Epic customers, time-to-go-live, MyChart activation rate, and order-volume share routed through Aura.
    relatedQuestionRefs:
    - QU018
    - QU024
    relatedTableRefs:
    - TU006
  - type: missing-source
    severity: material
    topic: ordering-mix
    missingEvidence: Split of active ordering providers and repeat-order behavior between prenatal and oncology accounts, and between commercial versus research use.
    whyItMatters: Repeat usage and commercial quality could differ materially across segments even if total delivered tests keep rising.
    diligencePath: Request active-ordering-provider cohorts, tests per active provider, and research-versus-commercial volume share by quarter.
    relatedQuestionRefs:
    - QU021
    - QU027
    relatedTableRefs:
    - TU003
    - TU007
