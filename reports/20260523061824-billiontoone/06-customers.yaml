- id: TU005
  title: Payer influence and access table
  columns:
  - Access lever
  - Public evidence
  - Covered cohort / segment
  - Customer impact
  - Limitation
  rows:
  - - Unity insurance acceptance
    - Unity says it accepts all insurances including Medicaid and is in network with the majority of plans
    - Prenatal patients
    - Reduces front-end adoption friction for OB and MFM practices
    - No payer-by-payer mix or denial-rate disclosure
  - - Q1 2026 contracted lives
    - BillionToOne said payor contracts reached ~300 million contracted lives
    - Prenatal and oncology ordering base
    - Should expand the reachable provider and patient base
    - Contracted lives do not reveal actual utilization
  - - UnitedHealthcare in-network status
    - GenomeWeb said UHC access should improve patient access and make payment more predictable
    - Commercially insured prenatal and oncology patients
    - Directly supports ASP and ordering confidence
    - No disclosed post-go-live conversion or reorder data
  - - MolDx / Medicare coverage for Northstar Select
    - GenomeWeb and PR Newswire say eligible advanced solid tumor patients gained reimbursement effective Feb. 14, 2025
    - Medicare oncology patients
    - Improves oncologist willingness to order therapy-selection liquid biopsy
    - Northstar Response still lacks the same disclosed reimbursement footing
  - - Northstar Response reimbursement gap
    - GenomeWeb said the company hoped to receive MolDx coverage for Northstar Response by the end of 2026
    - Longitudinal oncology monitoring
    - Suggests monitoring adoption still sits behind therapy-selection access
    - No current covered-lives count for Response
  - - Billing-support narrative
    - Unity and BBB together imply that billing and complaint handling remain part of the customer experience
    - Prenatal patients
    - Customer adoption depends on both coverage and clear billing execution
    - Complaint specifics are not fully visible in public BBB text
  notes: Payer coverage is treated here as a customer-adoption input, because diagnostics demand depends on whether clinicians believe ordering will be reimbursed and explainable to patients.
