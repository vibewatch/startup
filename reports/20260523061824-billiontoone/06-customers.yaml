- id: TU008
  title: Expansion and concentration risk table
  columns:
  - Expansion driver or risk
  - Public evidence
  - Impact
  - Current read
  - Diligence path
  rows:
  - - Epic-based distribution expansion
    - Epic ordering and MyChart result flow broaden reach across IDNs and community sites
    - Positive channel leverage
    - Credible but unquantified
    - Request live Epic site count, go-live pace, and Epic-sourced volume
  - - Reimbursement-driven expansion
    - 300 million contracted lives plus UHC in-network status and MolDx coverage
    - Positive but payer-dependent
    - Strongest visible 2026 customer-growth lever
    - Request payer mix, denial trends, and per-contract volume lift
  - - Land-and-expand via same-workflow modules
    - Unity Confirm, fetal-antigen expansions, and Northstar PGx / CH add-ons
    - Positive wallet-share opportunity
    - Real but early
    - Request attach rates and module penetration inside existing accounts
  - - Named-logo scarcity
    - Public pack names Sanford, NCCHE/LC-SCRUM, and UCSD but few production commercial health systems
    - Negative evidence gap
    - Material
    - Request named production references across OB/GYN, MFM, IDN, community-clinic, and oncology segments
  - - Concentration disclosure gap
    - No top-customer or ordering-account concentration metrics are public
    - Negative disclosure gap
    - Material
    - Request top-10 account share and payer concentration by business line
  - - Follow-up workflow limitations
    - Unity Confirm is gated to Unity Aneuploidy users and pre-16-week gestation
    - Can cap conversion from screening to confirmation
    - Real product-boundary friction
    - Request conversion funnel from high-risk screen to confirmatory action
  - - Billing and trust risk
    - BBB complaints and the Swieczkowski litigation show communication and customer-experience downside
    - Could slow provider or patient willingness to adopt
    - Material but still bounded by incomplete public detail
    - Request complaint mix, legal reserve posture, and corrective communication practices
  notes: The main risk pattern is not a lack of demand signal; it is that growth looks highly workflow- and reimbursement-mediated while account-level durability remains opaque.
