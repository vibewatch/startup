- id: reimbursement-and-channel-leverage
  title: Payer Leverage, Workflow Fit, and Expansion Mechanics
  body: 'Customer adoption here is tightly linked to reimbursement and workflow fit rather than to technical differentiation alone. The latest investor release says BillionToOne reached roughly 300 million contracted lives in the U.S. by Q1 2026, and GenomeWeb separately identified UnitedHealthcare in-network status as a direct growth driver because it should improve patient access and make payment more predictable. Oncology access has also moved materially forward, with Northstar Select gaining Medicare reimbursement for eligible advanced-solid-tumor patients under MolDx. Those payer changes matter because diagnostics customers do not adopt purely on clinical utility; they adopt when ordering, billing, and follow-up fit inside normal practice operations. That is why Epic, one-blood-draw prenatal ordering, and newer follow-up or add-on products are customer signals rather than just product features. Unity Confirm is a good example. It exists because a high-risk prenatal screen still creates
    workflow pain: invasive confirmation can be hard to access, many patients decline it, and the company is trying to keep that patient inside a non-invasive care path. Northstar''s February 2026 pharmacogenomic and clonal-hematopoiesis add-ons point the same way in oncology. The company is not only selling a core test; it is trying to expand share inside existing accounts by adding clinically adjacent decisions to the same blood-draw and reporting workflow.'
