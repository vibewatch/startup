figures:
- id: FU001
  title: BillionToOne customer ordering and expansion flow
  type: flow
  layout: wide
  summary: Customer acquisition starts when coverage and workflow fit line up, then compounds through blood-draw convenience, integrated result delivery, and same-account follow-up or add-on products.
  data:
    nodes:
    - id: segment-entry
      label: Segment entry
      detail: General OB/GYN, MFM, oncology, and academic users encounter BillionToOne through clinical need, sales outreach, or conference visibility.
    - id: coverage-fit
      label: Coverage and channel fit
      detail: Insurance acceptance, contracted lives, Medicare coverage, and Epic availability shape whether ordering feels viable.
    - id: prenatal-order
      label: Prenatal order
      detail: OB/GYN or MFM orders Unity from a single maternal blood draw with no partner sample.
    - id: oncology-order
      label: Oncology order
      detail: Oncologist orders Northstar Select or Response from a blood draw rather than a tissue-first workflow.
    - id: central-lab
      label: Central lab processing
      detail: Samples route into BillionToOne's prenatal or oncology lab workflow and return a structured report.
    - id: results-surface
      label: Results in workflow
      detail: Results can come back through existing provider surfaces, including Epic and MyChart where configured.
    - id: prenatal-next-step
      label: Prenatal next step
      detail: Patients and providers move to counseling, fetal-antigen management, or Unity Confirm after a high-risk result.
    - id: oncology-next-step
      label: Oncology next step
      detail: Providers move to therapy selection, treatment change, or response interpretation.
    - id: billing-access
      label: Billing and access outcome
      detail: Coverage clarity and patient-bill experience influence whether the workflow feels repeatable.
    - id: repeat-monitoring
      label: Repeat monitoring
      detail: Northstar Response supports serial monitoring and later blood draws once the account is live.
    - id: module-expansion
      label: Module expansion
      detail: Accounts can add fetal-antigen testing, Unity Confirm, PGx, or CH modules over time.
    - id: channel-scale
      label: Channel scale-up
      detail: Epic and payer wins can widen the number of reachable community and IDN accounts.
