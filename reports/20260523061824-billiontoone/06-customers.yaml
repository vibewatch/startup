callouts:
- calloutType: strength
  title: Broad prenatal scale is real even though public logos are scarce
  body: 'BillionToOne has stronger customer-breadth proof than customer-logo proof: the 811-practice outcomes cohort, 1-in-11-babies claim, and continued 2026 test growth all point to genuine adoption.'
