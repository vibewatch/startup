- id: TU002
  title: Ordering and workflow evidence table
  columns:
  - Workflow stage
  - Prenatal path
  - Oncology path
  - Integration / lab touchpoint
  - Benefit
  - Friction
  rows:
  - - Initial order
    - OB/GYN or MFM orders Unity from one maternal blood draw
    - Oncologist orders Northstar blood test for advanced solid tumor care
    - Provider portal or Epic ordering; sample ships to BillionToOne lab
    - Keeps both verticals in a blood-based send-out workflow
    - No public data on order abandonment or failed onboarding
  - - Screening / profiling
    - Unity provides fetal risk without partner sample
    - Northstar Select profiles 84 genes for therapy selection
    - Central lab processing under company workflow
    - Reduces partner-sample and tissue-biopsy friction
    - Sensitivity and access still matter more than marketing claims
  - - Results return
    - Prenatal results can flow back into Epic and MyChart
    - Oncology results can flow back into Epic and MyChart
    - Discrete results returned to EHR
    - Fits inside normal clinical documentation workflow
    - Live Epic utilization metrics are undisclosed
  - - High-risk follow-up
    - Unity Confirm keeps some patients inside a non-invasive path after high-risk screening
    - Not applicable in same way; oncology uses repeat blood monitoring instead
    - Requires Unity Aneuploidy as frontline screen and gestational-age limits
    - Addresses a major prenatal handoff gap
    - Not universal and still gated by product eligibility
  - - Longitudinal use
    - Specialty prenatal accounts can add fetal-antigen testing
    - Northstar Response supports serial monitoring from blood draws
    - Same company platform and reporting surfaces
    - Creates repeat-use potential beyond one-time screening
    - Public reorder rates are not disclosed
  - - Workflow expansion
    - Prenatal users can add specialty antigen testing
    - Northstar users can add PGx and CH modules in the same workflow
    - Same-blood-draw and same-report expansion paths
    - Supports land-and-expand inside existing accounts
    - No attach-rate or module-usage disclosure
  notes: This table focuses on customer workflow mechanics rather than assay science, emphasizing where BillionToOne removes friction and where handoff risk still remains.
