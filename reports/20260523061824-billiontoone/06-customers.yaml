tables:
- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Public scale / proof
  - Revenue / strategic value
  - Gap
  rows:
  - - General OB/GYN practices
    - 'Buyer: OB/GYN; user: clinician and pregnant patient; payer: commercial / Medicaid'
    - First-line prenatal screening for recessive conditions and aneuploidy
    - Unity is marketed for the general obstetric population with one blood draw and no partner sample
    - Core prenatal revenue engine
    - No named national OB group roster is public
  - - Maternal-fetal medicine and rural high-risk programs
    - 'Buyer: MFM; user: high-risk pregnancy teams and patients; payer: insurer / health system'
    - Alloimmunization, fetal antigen risk, complex follow-up
    - Sanford Clinic anecdote shows rural MFM workflow value
    - High strategic value because it solves painful care-access gaps
    - Proof is anecdotal rather than a broad named customer list
  - - Alloimmunized specialty prenatal care
    - 'Buyer: MFM / specialty OB; user: clinicians managing HDFN or FNAIT risk; payer: insurer'
    - Fetal antigen determination and reduced unnecessary surveillance
    - Expanded RBC and platelet antigen launch is positioned for this niche
    - Specialty expansion within existing prenatal accounts
    - No disclosed volume split for this subsegment
  - - Community oncology and hospital oncology practices
    - 'Buyer: oncologist / practice; user: cancer-care team; payer: Medicare / commercial'
    - Therapy selection and response monitoring for late-stage solid tumors
    - Northstar validation included six community oncology clinics and one large hospital
    - Fastest-growing but smaller revenue base than prenatal
    - Named commercial cancer-center roster is not public
  - - Academic and study-based oncology users
    - 'Buyer: academic investigators; user: research and translational oncology teams; payer: grants / institutional budgets'
    - Clinical studies, translational validation, and longitudinal NSCLC work
    - LC-SCRUM-TRY and UC San Diego are named public references
    - Important proof of technical credibility and international reach
    - Research use is not the same as broad commercial production use
  - - Epic-enabled IDNs and community practices
    - 'Buyer: provider org / lab / IT sponsor plus clinicians; user: prenatal and oncology practices; payer: existing reimbursement channels'
    - Order and receive results inside the incumbent EHR
    - Epic release names health systems, community practices, MFM practices, and oncology clinics
    - Potential distribution multiplier if live sites materialize
    - No live-site count, time-to-go-live, or Epic-routed volume is public
  notes: Rows separate clinical end users from reimbursement gatekeepers and channel enablers because BillionToOne adoption depends on all three layers at once.
