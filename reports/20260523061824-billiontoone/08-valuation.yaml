  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: fully-diluted-overhang
    missingEvidence: A full cap-table bridge covering options, RSUs, warrants, and any other as-converted dilution beyond reported Class A and Class B shares.
    whyItMatters: Current market cap looks fair on reported shares, but hidden employee or warrant dilution can reduce upside for new investors at the same quoted price.
    diligencePath: Request the current capitalization table, equity incentive schedule, warrant schedule, and basic-to-fully-diluted bridge used internally for board and banker materials.
    relatedQuestionRefs:
    - QV025
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: payer-concentration-and-denials
    missingEvidence: Product-level payer mix, payer concentration, denial rates, appeal win rates, and recoupment history for prenatal and oncology testing.
    whyItMatters: The valuation case depends on ASP durability and reimbursement quality, but the public record still does not show how concentrated or fragile those cash flows are.
    diligencePath: Request a payer dashboard showing top payors, in-network rollout by product, denials and recoupments, and monthly realized ASP since the UnitedHealthcare contract went live.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV006
  - type: private-evidence-only
    severity: material
    topic: litigation-economics
    missingEvidence: Insurance coverage, reserve posture, outside-counsel assessment, and possible royalty or settlement economics for the Illumina and Swieczkowski matters.
    whyItMatters: Litigation is already public, but investors still cannot price the cash-cost and injunction scenarios tightly enough to treat the current multiple as obviously cheap.
    diligencePath: Request counsel memos, D&O and IP insurance limits, reserve analysis, and a board-level summary of likely timing, downside ranges, and operational remedies.
    relatedQuestionRefs:
    - QV026
    relatedTableRefs:
    - TV005
    - TV006
  - type: private-evidence-only
    severity: material
    topic: oncology-unit-economics
    missingEvidence: Separate oncology ASP, gross margin, payer mix, and contribution margin for Northstar Select and related add-ons.
    whyItMatters: The upside case depends on oncology becoming a second value driver, but public disclosures still do not show whether that mix shift is accretive enough to support a higher multiple.
    diligencePath: Request monthly oncology volume, ASP, reimbursement, and gross-margin cohorts by test and by payer channel for 2025 and year-to-date 2026.
    relatedTableRefs:
    - TV003
    - TV006
  - type: missing-source
    severity: minor
    topic: comparable-set-coverage-gap-for-TV004
    missingEvidence: A broader, same-day public comp pack for diagnostics names that cleanly separates live trading comps from M&A control-premium references.
    whyItMatters: TV004 is intentionally a sample because BillionToOne sits across prenatal diagnostics, oncology diagnostics, and broader lab context, but a wider comp pack would tighten the multiple band around the base case.
    diligencePath: Build a banker-style comparable set with same-day market caps, net cash or debt, and consensus revenue for a wider diagnostics universe, then rerun the multiple grid.
    relatedQuestionRefs:
    - QV023
    - QV024
    relatedTableRefs:
    - TV004
