company:
  name: BillionToOne
chapter:
  number: 8
  title: Valuation
  summary: 'BillionToOne now has enough public operating proof to justify a premium diagnostics multiple, but the May 2026 public value of about $3.95 billion already captures much of that progress. At roughly 11.1x trailing revenue and 8.5x-8.8x current-year guidance, the stock sits below Natera and Guardant but above Tempus, Illumina, and Labcorp, which makes the cleanest stance fair rather than cheap. The chapter therefore lands on track with medium confidence: upside still exists, but reimbursement quality, litigation, control remediation, and undisclosed dilution leave too little margin of safety for a buy call today.'
sections:
- id: public-anchor-and-financing-reset
  title: Public-Market Anchor, Cap-Table Reset, and What the Stock Is Actually Pricing
  body: The valuation anchor is no longer the June 2024 unicorn round; it is the post-IPO public cap table and the trading level that investors can actually buy. The 2024 Series D still matters because it established that private investors were willing to fund BillionToOne above the $1 billion threshold before the business had public-company proof, but the more important reset happened in November 2025. The prospectus and IPO closing 8-K show a company that sold 5.23 million Class A shares at $60, took in about $314 million of gross proceeds and $286.9 million of net proceeds, and emerged with roughly 45.4 million post-offering shares if the option was fully exercised. Using that prospectus share count, the IPO implied about $2.72 billion of equity value. By May 22, 2026 the public market was valuing BillionToOne at about $3.95 billion, or roughly 1.45 times the IPO mark, with about 46.0 million shares out on market-data pages and 41.44 million Class A plus 4.55 million Class B shares disclosed
    in the 10-Q. That means the public market did not reset BillionToOne below its late-private benchmark; it stepped the company up again. The key question is therefore not whether BillionToOne is a quality asset. It is whether the current public equity value already capitalizes most of the operational good news while leaving too little room for reimbursement, litigation, and governance surprises.
