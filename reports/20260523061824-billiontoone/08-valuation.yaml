- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - ASP durability breaks
    - Realized ASP stalls or reverses after the payor true-up effect rolls off
    - Current multiple loses its cleanest premium-growth support
    - Reset valuation toward bear-case band and demand new payer-cohort evidence
  - - Litigation worsens
    - Illumina gains leverage on injunction, royalties, or costly settlement economics
    - Prenatal economics and valuation premium both compress
    - Increase legal haircut and revisit whether track should become research-more
  - - Controls remain weak
    - Material weaknesses persist through another reporting cycle without credible remediation progress
    - Governance discount hardens and public-market trust deteriorates
    - Lower confidence and widen downside range
  - - Oncology reimbursement disappoints
    - Coverage expansion slows or oncology margins remain structurally weaker than expected
    - The second growth leg stops supporting premium valuation
    - Cut bull-case probability and narrow upside range
  - - Financing need reappears
    - Debt draw usage or cash burn suggests another raise before economics are fully proven
    - Equity upside leaks to dilution rather than to compounding
    - Move valuation stance from fair toward stretched
  notes: The triggers are monitorable and explicitly tied to multiple compression rather than to abstract company-quality concerns.
