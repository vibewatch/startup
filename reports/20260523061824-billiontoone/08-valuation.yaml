- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Evidence-backed implication
  rows:
  - - Recommendation
    - track
    - Current market cap sits inside the supportable base-case range rather than at a clear discount.
  - - Confidence
    - medium
    - Public evidence is strong on revenue, margin, and liquidity but incomplete on fully diluted share count, payer concentration, and litigation economics.
  - - Risk rating
    - high
    - Reimbursement quality, active litigation, and unremediated control weaknesses can all transmit into multiple compression.
  - - Valuation stance
    - fair
    - BillionToOne trades below Natera and Guardant but above Tempus and mature diagnostics peers, which fits the current operating profile.
  - - Decision implication
    - Wait for either better evidence or a cheaper entry
    - A buy case needs more proof of durable ASP, oncology reimbursement, and cleaner governance than the current public packet provides.
  notes: This summary is intentionally price-sensitive. The company can be good while the current public entry still lacks enough margin of safety for a buy call.
