- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Thesis
  - Anti-thesis
  - What would change the view
  rows:
  - - Growth quality
    - 2025 revenue doubled and Q1 2026 stayed at 84% growth with 73% gross margin.
    - Part of near-term revenue quality still depends on payor repricing and true-ups rather than only on clean volume growth.
    - Show several quarters of ASP durability without unusually large prior-period catch-up revenue.
  - - Reimbursement
    - UnitedHealthcare in-network status can improve access and ASP predictability.
    - The filing still says revenue is predominantly insurer-paid and estimated through variable consideration.
    - Provide payer mix, denial trends, and realized ASP by product and by payer cohort.
  - - Liquidity
    - More than $537 million of cash gives the company time to execute.
    - Debt tranches and any hidden dilution can still reduce upside if execution slows.
    - Provide a fully diluted cap table and note-facility bridge through 2027.
  - - Risk posture
    - The company has enough scale to absorb normal public-company friction.
    - Illumina litigation, Swieczkowski, and unremediated control weaknesses are not normal background noise; they are valuation inputs.
    - Close litigation exposure and remediate controls with clean auditor and management evidence.
  - - Comparable framing
    - BillionToOne deserves a premium to mature diagnostics and lab peers.
    - It does not yet deserve full Natera or Guardant premium without cleaner oncology and reimbursement proof.
    - Show oncology economics and reimbursement depth that justify a higher band.
  - - M&A context
    - Abbott’s Exact acquisition shows strategic value for scaled cancer diagnostics.
    - Control-premium takeouts are not a shortcut to justifying a public-market price for BillionToOne today.
    - Treat M&A as context only unless a real process or strategic scarcity signal emerges.
  notes: 'The core split is explicit: the company-quality thesis is strong, but the public-price thesis is only fair as of the run-date anchor.'
