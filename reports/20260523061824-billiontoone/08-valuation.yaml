- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Core assumptions
  - Valuation / return logic
  - Key risks
  - Probability signal
  rows:
  - - Bull
    - Guidance keeps rising, UnitedHealthcare and other contracts make ASP gains durable, oncology reimbursement broadens, and controls are remediated.
    - $4.8B-$5.6B equity value using a premium growth-diagnostics band nearer lower-end Natera or Guardant forward multiples.
    - Litigation remains containable and no new financing is needed.
    - Possible, but it needs several additional clean quarters.
  - - Base
    - Revenue keeps compounding, reimbursement remains supportive, and the company holds a premium-growth but not top-tier diagnostics multiple.
    - $3.6B-$4.7B equity value; current $3.95B market cap sits inside this range.
    - The stock can stagnate if good execution merely matches what investors already expect.
    - Most supportable on the current public record.
  - - Bear
    - ASP gains fade, denials or recoupments rise, litigation or control issues grow, or the market re-rates the company toward lower-quality peers.
    - $2.25B-$3.02B equity value using roughly 5x-6.5x guidance.
    - Reimbursement quality and legal/gov-control issues transmit directly into the multiple.
    - Real downside if price outruns evidence quality.
  notes: Ranges are underwriting bands rather than formal target prices. They are anchored on current public market cap, 2026 guidance, comp bands, and visible risk transmission.
