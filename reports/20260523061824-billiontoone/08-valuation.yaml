- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - BillionToOne
    - Current public lens
    - $3.95B market cap; ~11.1x trailing revenue; ~8.5x-8.8x 2026 guidance
    - Anchor for the chapter’s own price-sensitive judgment
    - Young public history and reimbursement-driven revenue quality still matter
  - - Natera
    - Public growth diagnostics comp
    - $29.10B market cap; ~11.6x trailing; ~10.3x-10.6x forward
    - Closest premium prenatal-growth reference in the fetched set
    - Larger scale, broader evidence base, and different oncology mix
  - - Guardant Health
    - Public oncology-heavy diagnostics comp
    - $15.77B market cap; ~14.6x trailing; ~12.0x forward
    - Best premium oncology-growth comp in the public set
    - Screening and oncology footprint are broader and more mature
  - - Tempus AI
    - Public AI-enabled precision medicine comp
    - $8.29B market cap; ~6.1x trailing; ~5.2x forward
    - Shows a lower premium band for a still-scaling precision-medicine platform
    - Different business mix and software/data exposure
  - - Illumina / Labcorp
    - Mature diagnostics context
    - Illumina ~4.7x-4.8x forward; Labcorp ~1.5x trailing
    - Provide mature tool and lab floors for valuation context
    - Much slower growth and structurally different economics
  - - Exact Sciences / Abbott
    - M&A context, not live comp
    - Abbott agreed to pay $105 per share for Exact at about $21B equity / $23B EV; Exact delisted March 2026
    - Useful as strategic takeout context for scaled cancer diagnostics
    - Control premium and no longer a standalone public multiple
  notes: This table deliberately mixes live public multiples with one strategic takeout reference so the reader can separate trading comparables from M&A scarcity.
