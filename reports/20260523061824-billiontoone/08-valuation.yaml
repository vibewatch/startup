- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Fully diluted cap table
    - Option, RSU, warrant, and other as-converted dilution bridge
    - Current quoted market cap may overstate upside if hidden dilution is material
    - Request latest board cap-table package and basic-to-fully-diluted bridge
  - - Payer concentration and denials
    - Top payor exposure, denial rates, appeal win rates, and recoupments by product
    - Valuation depends on reimbursement durability more than on list price
    - Request monthly payer dashboard for prenatal and oncology
  - - Oncology unit economics
    - Northstar ASP, margin, mix, and reimbursement by test
    - Upside case needs a second profit engine, not just prenatal scale
    - Request product-level contribution analysis and payer cohort data
  - - Litigation economics
    - Insurance limits, reserve posture, outside-counsel loss ranges, and likely timing
    - The market cannot underwrite legal downside from headlines alone
    - Request counsel memo and board litigation summary
  - - Control remediation
    - Formal remediation status, testing evidence, and any auditor commentary
    - Control weakness discount should narrow only on hard proof
    - Request SOX roadmap, owner, milestones, and testing results
  - - Revenue quality bridge
    - Quarterly split between clean current-period collections and prior-period repricing or catch-up
    - Needed to judge whether current multiple rests on durable cash economics
    - Request cohort collection bridge since January 2025
  notes: These diligence asks are the shortest path to moving the recommendation from track to either buy or research-more with higher confidence.
