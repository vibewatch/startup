- id: recommendation-and-diligence-gates
  title: Recommendation, Kill Triggers, and the Diligence Work That Would Move the Call
  body: 'The cleanest recommendation on current evidence is track, not buy. BillionToOne has earned a serious valuation: it is public, well capitalized, growing quickly, profitable at the operating line, and still adding reimbursement support. The problem is not company quality. The problem is that the current public value already sits inside a reasonable base-case range, so new capital is no longer getting a clear discount for taking reimbursement, litigation, and control-remediation risk. The anti-thesis is also unusually concrete. Illumina is already seeking injunction and royalty-style remedies, the Swieczkowski case survived dismissal, disclosure controls remain ineffective because material weaknesses were not yet remediated, and the public filings still do not show the fully diluted cap table, payer concentration, denial rates, or litigation economics tightly enough for a conviction buy. That leaves the decision rule straightforward. Investors should upgrade only if ASP gains survive
    beyond one-time true-ups, oncology reimbursement broadens without margin erosion, and governance/control remediation becomes cleanly visible. They should downgrade quickly if denials or recoupments rise, litigation economics worsen, or financing needs reappear before oncology becomes a durable second profit pool. Until then, BillionToOne looks fairly valued to slightly full rather than obviously mispriced.'
