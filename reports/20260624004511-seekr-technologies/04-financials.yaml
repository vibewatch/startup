callouts:
  - calloutType: strength
    title: "Strategically valuable, government-anchored revenue base"
    body: >-
      $18M+ 2024 revenue, 30+ customers, and disclosed Army SBIR contracts give
      Seekr a real, trust-barriered government and regulated-enterprise revenue
      base that is hard for competitors to replicate quickly.
    claimRefs: [CI011, CI002, CI004]
  - calloutType: risk
    title: "Unit economics and cash position are undisclosed"
    body: >-
      Gross margin, CAC, burn, cash on hand, and runway are all unpublished, and
      the services/compute-intensive air-gapped model likely runs below SaaS
      margins - making the path to the stated breakeven unverifiable today.
    claimRefs: [CI006, CI008, CI017]
  - calloutType: risk
    title: "Conflicting revenue figures and unconfirmed round closing"
    body: >-
      Company revenue of $18M conflicts with a $22M ARR tracker figure, and the
      $100M round is described as a first close rather than fully funded - two
      facts that must be reconciled before relying on either.
    claimRefs: [CI012, CI016, CI033]
  - calloutType: assumption
    title: "Runway and margin are estimates, not findings"
    body: >-
      The ~2-year runway and 50-70% gross-margin band are inferences from
      undisclosed inputs; both should be replaced with audited figures in
      diligence.
    claimRefs: [CI006, CI018, CI037]

