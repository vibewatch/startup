schemaVersion: "report-v2"
artifact: financials
slug: "seekr-technologies"
runDate: "2026-06-24"
company:
  name: "Seekr Technologies"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Seekr disclosed >$18M of 2024 revenue (one tracker cites ~$22M ARR), 30+
    customers, 100,000+ end users, and a stated goal of cash-flow breakeven, but
    the financial picture remains thin: gross margin, CAC, burn, cash on hand,
    and runway are all undisclosed. The June 2025 $100M round at a $1.2B
    valuation (Danu Venture Group, AMD Ventures; Guggenheim advising) brought
    total funding to roughly $125M. Revenue quality looks government- and
    contract-weighted; the central underwriting blocker is the absence of audited
    unit economics and a verified cash/runway position.

sections:
  - id: revenue-model-and-monetization
    title: "Revenue streams, pricing, and monetization"
    body: >-
      Seekr's revenue is built around the SeekrFlow platform - an all-in-one
      stack for building, validating, and deploying generative-AI models and
      agents - sold to enterprise and government customers, supplemented by
      government program contracts (notably U.S. Army SBIR work under award
      W5170125CA093) and the professional services required to stand up
      air-gapped, accredited deployments. Public disclosure does not break out
      the mix, but the customer profile (defense, intelligence, telecom, supply
      chain) and the SBIR/OTA contracts imply a revenue base weighted toward
      government and large regulated enterprises rather than self-serve SaaS.
      Pricing is undisclosed: platform licenses, contract vehicles, and services
      are all sold through negotiated enterprise/agency agreements, so there is no
      public list price, per-seat rate, or consumption tariff to anchor a model.
      Revenue recognition is therefore likely a blend of subscription/license
      ratable revenue and milestone- or deliverable-based contract revenue, the
      latter introducing lumpiness and the kind of percentage-of-completion
      recognition questions that require audited statements to resolve. The
      monetization story is plausible but, on public evidence alone, not
      underwritable at the line-item level.
    claimRefs: [CI001, CI002, CI003, CI004, CI005, CI030]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: unit-economics-and-cost-structure
    title: "Unit economics, gross margin, and cost structure"
    body: >-
      Seekr discloses none of the canonical unit-economics metrics - gross
      margin, CAC, payback, net revenue retention, or average contract value - so
      every figure in this section is a proxy or an explicit gap. For an
      air-gapped, services-heavy government-AI platform, gross margins are
      typically below the 75-85% benchmark of pure SaaS because on-prem
      deployment, accreditation, and professional services carry real delivery
      cost; an estimate in the 50-70% band is reasonable but unverified. Inference
      and compute cost is a structural COGS driver, which is precisely why the
      AMD Ventures relationship (hardware optimization) matters to margins. On the
      operating side, the company's stated push toward cash-flow breakeven implies
      disciplined burn relative to its raise, but no monthly burn, headcount cost,
      or capex figure is public; reported headcount of roughly 110-130 gives a
      rough opex floor but not a verified cost structure. Working capital is also
      opaque - milestone-based government contracts can tie up receivables and
      lengthen the cash-conversion cycle. Without audited COGS and opex splits,
      the margin path is an assumption, not a finding, and is flagged as a primary
      diligence blocker.
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI031, CI032]
    tableRefs: [TI003]
    figureRefs: [FI002]
  - id: traction-and-public-metrics
    title: "Public traction versus private-metric gaps"
    body: >-
      The public traction set is genuine but shallow. Seekr reports more than
      $18M of 2024 revenue, 30+ customers, and over 100,000 end users, and one
      third-party tracker (Latka) cites roughly $22M ARR - a figure that exceeds
      the company's own revenue disclosure and is itself a small contradiction
      worth reconciling. Tracxn places total funding near $125M across multiple
      rounds including a Series B and a Series C. What is missing dwarfs what is
      present: there is no disclosed revenue growth rate, no segment or geographic
      revenue split, no churn or retention metric, no utilization or
      consumption data, and no audited financial statements. The end-user count
      (100,000+) is an engagement proxy that does not map cleanly to paid seats or
      revenue. For a company valued at $1.2B, the gap between public traction and
      the private metrics required to underwrite that valuation is the defining
      feature of this chapter, and it is catalogued explicitly in the public
      financial gaps table.
    claimRefs: [CI011, CI012, CI013, CI014, CI033, CI034]
    tableRefs: [TI005]
    figureRefs: [FI003]
  - id: capital-adequacy-and-financing
    title: "Capital adequacy, burn, and financing dependency"
    body: >-
      Seekr's June 2025 round - a $100M raise at a $1.2B valuation led by Danu
      Venture Group and AMD Ventures, with Guggenheim Securities advising -
      brought total funding to roughly $125M; the full round-by-round chronology
      is covered in Company Overview and is referenced here only to size capital
      adequacy. Importantly, multiple accounts describe the round as being
      raised/opened (a first close) rather than fully closed, which matters for
      how much cash is actually on the balance sheet. Cash on hand, monthly burn,
      and runway are all undisclosed; the company's public guidance is a goal of
      reaching cash-flow breakeven, which, if achieved, would reduce financing
      dependency, but no audited trajectory supports it yet. Assuming the round
      funds and burn stays moderate, a $100M injection plausibly supports two-plus
      years of runway, but that is an estimate built on undisclosed inputs. There
      is no public evidence of debt or project-finance obligations. The next-round
      trigger and use of funds (scaling go-to-market, compute, and government
      delivery) are directionally clear but not quantified, leaving financing
      dependency an open question.
    claimRefs: [CI015, CI016, CI017, CI018, CI019, CI020, CI035, CI036]
    tableRefs: [TI004]
    figureRefs: [FI004]
  - id: financial-verdict
    title: "Financial verdict: revenue quality, margin path, and blockers"
    body: >-
      On revenue quality, Seekr's base looks real and strategically valuable
      (government and regulated-enterprise contracts with high trust barriers) but
      contract- and services-weighted revenue is lumpier and lower-margin than
      pure SaaS, and the lack of a disclosed growth rate prevents confirming the
      trajectory implied by a $1.2B valuation. On margin path, the air-gapped,
      services-intensive model and compute COGS suggest gross margins below
      software benchmarks, partially mitigated by the AMD hardware relationship,
      but this is unverified. On capital intensity, the business is not capex-
      heavy in a manufacturing sense, yet compute and accreditation costs plus
      working-capital drag from milestone contracts make it more cash-intensive
      than a self-serve SaaS peer. The decisive diligence blockers are: audited
      financial statements; gross-margin and CAC/payback disclosure; verified cash
      on hand, burn, and runway; reconciliation of the $18M revenue versus $22M
      ARR figures; and confirmation of whether the $100M round has fully closed.
      Until those clear, the financial profile supports interest but not
      underwriting.
    claimRefs: [CI021, CI022, CI023, CI024, CI025, CI037]

tables:
  - id: TI001
    title: "Revenue streams table"
    columns: ["Stream", "Description", "Pricing model", "Est. mix (qualitative)", "Recognition note"]
    rows:
      - ["SeekrFlow platform", "Build/validate/deploy GenAI platform + agents", "Enterprise/agency license", "Core / largest", "Likely ratable subscription/license"]
      - ["Government program contracts", "Army SBIR (W5170125CA093), mission AI agents", "Contract / milestone", "Significant", "Milestone or deliverable-based; lumpy"]
      - ["Professional services", "Air-gapped deployment, accreditation, integration", "Time & materials / fixed-fee", "Supporting", "Service revenue; lower margin"]
      - ["Trust/data products (SeekrScore, SeekrAlign, geospatial)", "Trust scoring, alignment, remote-sensing AI", "Bundled / add-on", "Emerging", "Likely bundled with platform"]
    notes: >-
      Mix is qualitative; Seekr does not publicly break out revenue by stream.
      Streams inferred from product pages, customer profile, and disclosed Army
      SBIR contracts. Recognition notes flag where milestone-based contract
      revenue introduces lumpiness requiring audited statements.
    claimRefs: [CI001, CI002, CI003, CI004]
  - id: TI002
    title: "Pricing / monetization table"
    columns: ["Offering", "Pricing basis", "Contract length", "Public visibility", "Implication"]
    rows:
      - ["SeekrFlow license", "Negotiated enterprise/agency", "Multi-year typical", "Undisclosed", "No public ACV anchor"]
      - ["Government contracts", "Award value (SBIR up to ~$2M)", "Program period (e.g. through Sep 2026)", "Partial (award records)", "Contract value visible; margin not"]
      - ["Professional services", "T&M / fixed-fee", "Project-based", "Undisclosed", "Drags blended gross margin"]
      - ["Compute/inference (AMD-aligned)", "Pass-through / bundled", "n/a", "Undisclosed", "Key COGS lever; AMD relationship relevant"]
    notes: >-
      Pricing is opaque across all offerings except government award values
      visible in contract records. Entries describe pricing structure, not list
      prices. The absence of a public ACV is itself an evidence gap.
    claimRefs: [CI005, CI002, CI031]
  - id: TI003
    title: "Unit economics table"
    columns: ["Metric", "Estimate / proxy", "Basis", "Confidence", "Gap"]
    rows:
      - ["Gross margin", "~50-70% (est.)", "Air-gapped + services + compute COGS vs SaaS benchmark", "Low", "No disclosed COGS"]
      - ["CAC / payback", "Unknown", "No S&M or customer-add disclosure", "n/a", "Fully undisclosed"]
      - ["Sales cycle", "Long (6-18 mo, gov proxy)", "Government ATO/procurement norms", "Low", "Not company-confirmed"]
      - ["Net revenue retention", "Unknown", "No cohort data", "n/a", "Fully undisclosed"]
      - ["Average contract value", "Unknown", "No pricing disclosure", "n/a", "Fully undisclosed"]
    notes: >-
      Every row is a proxy or explicit gap; Seekr discloses no canonical unit
      economics. The ~50-70% gross-margin band reflects services/compute
      intensity versus a 75-85% pure-SaaS benchmark and is unverified.
    claimRefs: [CI006, CI007, CI008, CI032]
  - id: TI004
    title: "Capital adequacy table"
    columns: ["Item", "Value / estimate", "Source basis", "Note"]
    rows:
      - ["Total funding raised", "~$125M", "Tracxn funding records", "Across multiple rounds incl. Series B/C"]
      - ["Latest round", "$100M at $1.2B valuation (Jun 2025)", "PRNewswire / company / news", "Led by Danu Venture Group, AMD Ventures"]
      - ["Round status", "Raised/opened (first close)", "Multiple accounts", "Full closing not publicly confirmed"]
      - ["Cash on hand", "Undisclosed", "No disclosure", "Cannot verify balance-sheet cash"]
      - ["Burn / runway", "Undisclosed; breakeven targeted", "Company guidance", "~2+ yr runway if round funds (est.)"]
      - ["Debt / project finance", "None disclosed", "No public evidence", "Assumed equity-financed"]
    notes: >-
      Values combine company statements, news coverage, and Tracxn records.
      Round-status nuance (first close vs fully closed) materially affects how
      much cash is actually available. Runway is an estimate from undisclosed
      burn.
    claimRefs: [CI015, CI016, CI017, CI018, CI019]
  - id: TI005
    title: "Public financial gaps table"
    columns: ["Metric", "Public value", "Private gap", "Why it matters", "Diligence path"]
    rows:
      - ["Revenue", "$18M+ (2024)", "No growth rate or segment split", "Trajectory underpins $1.2B valuation", "Audited statements, MRR/ARR by segment"]
      - ["ARR", "~$22M (Latka, conflicting)", "Conflicts with $18M revenue figure", "Discrepancy undermines metric trust", "Reconcile revenue vs ARR definitions"]
      - ["Gross margin", "None", "No COGS disclosure", "Determines profitability path", "COGS breakdown; compute vs services"]
      - ["Burn / runway", "None", "No cash or burn figure", "Financing dependency / dilution risk", "Bank statements, board burn reports"]
      - ["Customer economics", "30+ customers; 100k+ users", "No ACV, churn, or NRR", "Quality of revenue / retention", "Cohort and churn analysis"]
    notes: >-
      Captures the gap between disclosed public traction and the private metrics
      required to underwrite the valuation. The ARR-versus-revenue conflict is a
      flagged contradiction, not a confirmed figure.
    claimRefs: [CI011, CI012, CI013, CI033]

