callouts:
  - calloutType: strength
    title: "Mission-critical defense proof, independently corroborated"
    body: >
      Seekr's Army engagements — Project Linchpin, DEVCOM AvMC missile-defense cyber, and multiple SBIR awards — are
      named, fresh, and verifiable in SBIR.gov filings as well as company and trade-press releases, a far stronger
      evidence base than most defense-AI startups can show.
    claimRefs: [CU009, CU012, CU013]
  - calloutType: strength
    title: "GDIT channel and Tradewinds awardability scale reach"
    body: >
      The 2026 GDIT collaboration plus CDAO Tradewinds awardability give Seekr procurement vehicles and integration
      muscle to reach federal civilian, state-and-local, and additional defense customers beyond direct Army sales.
    claimRefs: [CU007, CU014]
  - calloutType: risk
    title: "Heavy government/Army concentration"
    body: >
      The verifiable customer base is dominated by the U.S. Army and DoD, exposing revenue to defense budget cycles,
      procurement timing, and program-funding politics; a single large program slipping could materially affect results.
    claimRefs: [CU022, CU020]
  - calloutType: risk
    title: "Commercial traction is asserted, not evidenced"
    body: >
      The 30+ customers and 100,000+ users claims lack named commercial logos, case studies, or disclosed retention,
      so commercial diversification and durability cannot be independently validated.
    claimRefs: [CU006, CU023, CU016]
