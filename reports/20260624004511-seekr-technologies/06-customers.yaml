      - ["Production vs pilot", "Mix of funded prototypes and stated deployments", "Partially production; some early-stage"]
    notes: "Durability is inferred from contract and program structure because Seekr publishes no retention metrics; assessment column states the resulting confidence level."
    claimRefs: [CU016, CU017, CU018, CU019]
  - id: TU005
    title: "Expansion and concentration risk"
    columns: ["Factor", "Signal", "Risk direction"]
    rows:
      - ["Land-and-expand (Army)", "Multiple distinct Army mission areas", "Positive"]
      - ["Channel dependence (GDIT)", "Pipeline routed via partner ecosystem", "Mixed — reach vs dependence"]
      - ["Government concentration", "Verifiable base dominated by DoD/Army", "Negative — budget/procurement exposure"]
      - ["Commercial disclosure gap", "30+ customers/100k users unnamed", "Negative — unverifiable diversification"]
    notes: "Risk-direction column is an analyst assessment; concentration on defense and the commercial-evidence gap are the dominant negative factors offsetting positive intra-Army expansion."
    claimRefs: [CU020, CU021, CU022, CU023]
