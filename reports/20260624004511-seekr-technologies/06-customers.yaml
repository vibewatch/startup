company:
  name: "Seekr Technologies"
chapter:
  number: 6
  title: "Customers"
  summary: "Seekr's verifiable customer base is concentrated in the U.S. defense and intelligence sector — the U.S. Army (Project Linchpin and DEVCOM AvMC), U.S. Navy, and other defense agencies — reached directly via SBIR contracts and through channel partners GDIT and the CDAO Tradewinds Marketplace. The company claims 30+ customers and 100,000+ end users, but named commercial enterprise logos are largely undisclosed, leaving concentration, durability, and commercial-traction questions open."
sections:
  - id: customer-base-and-segmentation
    title: "Who pays and uses SeekrFlow"
    body: >
      Seekr's customer base spans two clearly different motions. The first, and by far the most documented, is U.S.
      government and defense: SeekrFlow is described by the company and partners as "deployed across the U.S. Army, U.S.
      Navy, and other defense agencies," and is awardable through the Chief Digital and AI Office (CDAO) Tradewinds
      Solutions Marketplace. Within this segment the buyer is a federal contracting office (for example U.S. Army SBIR
      program offices and DEVCOM Aviation & Missile Center), the payer is the U.S. government, and the users are
      soldiers, analysts, and mission owners operating in intelligence, acquisition, operations, logistics, and cyber
      roles — frequently in air-gapped, disconnected, or tactical-edge settings. The second motion is commercial
      enterprise, where Seekr cites adoption across sectors such as telecom and supply chain and reports an aggregate
      of more than 30 customers and over 100,000 end users; however, unlike the government wins, named commercial
      logos and case studies are largely absent from public materials. Geographically the disclosed footprint is
      U.S.-centric, consistent with the defense and sovereign-data positioning. Channel structure matters: the
      January 2026 strategic collaboration with General Dynamics Information Technology (GDIT) extends reach to
      federal civilian, state-and-local, and additional defense customers through GDIT's integration ecosystem,
      Digital Accelerators, and Centers of Excellence. The result is a customer base that is credible and
      mission-critical on the government side but thinly evidenced on the commercial side, a segmentation that shapes
      both the growth thesis and the concentration risk.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU006, CU007]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-trajectory-and-named-proof
    title: "Adoption trajectory and named customer proof"
    body: >
      The adoption trajectory is anchored by a sequence of verifiable government milestones. In September 2024 Seekr
      launched a self-service version of the SeekrFlow enterprise platform to broaden access. In May 2025 the U.S.
      Army awarded Seekr two SBIR contracts under the OUSD Research & Engineering "Trusted AI and Autonomy" critical
      technology area: a Direct-to-Phase-II award partnering with Project Linchpin — the Army's standardized AI/MLOps
      pipeline — for advanced analytics across PEO IEW&S sensor modernization, and a Phase I award for AI/ML in edge
      and austere environments. Public SBIR records corroborate the dollar values: a Phase II award (tracking A2D-2579)
      of $1,998,551 for SeekrAlign bias-scoring and situational awareness, and two Phase I awards of $248,485
      (A244-P037-1787, edge LLM development referencing TITAN and EWPMT) and $249,684 (A254-006-0250, cyber for
      aviation and missile systems). In January 2026 the Army's DEVCOM Aviation & Missile Center selected Seekr to
      deploy agentic AI for cyber resilience of mission-critical weapon systems including Patriot and THAAD missile
      batteries. In 2026 the GDIT collaboration added a channel route to market. Named, production-grade proof is
      therefore strong and fresh on the defense side — multiple distinct Army organizations, corroborated by both
      company press releases and independent SBIR.gov filings — while commercial named proof remains the principal
      gap. The named-proof table enumerates the documented engagements and their evidence quality.
    claimRefs: [CU008, CU009, CU010, CU011, CU012, CU013, CU014, CU015]
    tableRefs: [TU002, TU003]
    figureRefs: [FU002, FU003]
  - id: retention-durability-and-expansion
    title: "Retention, durability, expansion, and concentration"
    body: >
      Durability evidence is structural rather than metric-based. Seekr does not publish net revenue retention (NRR),
      gross retention, churn, or renewal rates, so durability must be inferred from contract type and program design.
      The SBIR pathway is inherently staged — Phase I feasibility into Phase II prototyping, with a Direct-to-Phase-II
      award signaling the Army's confidence to skip Phase I — and Project Linchpin is explicitly built as a repeatable
      pipeline to operationalize and scale trusted AI, which favors follow-on work if prototypes succeed. The DEVCOM
      AvMC win and the Linchpin partnership indicate land-and-expand within the Army across distinct mission areas
      (sensor modernization, cyber resilience, edge analytics), a positive expansion signal. The GDIT collaboration is
      a classic channel-leverage move that can multiply reach but also introduces channel dependence: a meaningful
      share of future government pipeline may flow through GDIT's mission and integration relationships rather than
      Seekr's direct sales. Concentration risk is the dominant theme: the verifiable customer set is heavily weighted
      to the U.S. Army and the broader DoD, exposing Seekr to defense budget cycles, procurement timing, and the
      politics of program funding. On the commercial side, the absence of named accounts and disclosed retention
      means the 30+ customer and 100,000+ user claims cannot be independently validated, and a single large
      government program slipping could materially affect revenue. These dynamics make customer durability a
      diligence priority despite the impressive defense logos.
    claimRefs: [CU016, CU017, CU018, CU019, CU020, CU021, CU022, CU023]
    tableRefs: [TU004, TU005]
    figureRefs: [FU004]
