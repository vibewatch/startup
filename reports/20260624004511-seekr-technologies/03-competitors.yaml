      - ["Workflow lock-in once accredited", "Incumbents are already accredited and deployed", "High", "Measure displacement win rate vs incumbents"]
      - ["Trust/governance differentiation", "Governance startups out-iterate; hyperscalers bundle free", "High", "Track feature parity cadence vs Credo/Arthur"]
      - ["Full-platform breadth", "Foundation-model commoditization erodes value of orchestration", "High", "Stress-test moat beyond model quality"]
      - ["Strategic-investor (AMD) alignment", "Non-exclusive; rivals access same compute", "Medium", "Confirm exclusivity and co-sell commitments"]
    notes: >-
      Severity reflects combined likelihood and impact on Seekr's defensibility
      over a 2026-2028 horizon. Each row pairs a stated moat with its most
      credible threat and a concrete diligence ask, not a resolved verdict.
    claimRefs: [CP012, CP013, CP014, CP015, CP016, CP017]

