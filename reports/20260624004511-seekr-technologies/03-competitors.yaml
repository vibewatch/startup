  - id: TP003
    title: "Pricing / packaging comparison"
    columns: ["Vendor", "Contract model", "Unit", "Included capabilities", "Discount / unknowns", "Implication"]
    rows:
      - ["Seekr (SeekrFlow)", "Enterprise / gov contract", "Platform license + services", "Build, validate, deploy, scoring, air-gapped", "Pricing undisclosed", "Cannot benchmark ACV without data room"]
      - ["Palantir", "Large multi-year contract", "Platform + heavy services", "Foundry/AIP + delivery", "Famously high TCV; bespoke", "Premium pricing limits SMB/mid-tier reach"]
      - ["Azure Government", "Consumption + EA", "Per-token / per-service", "Cloud + Azure OpenAI", "Volume discounts; egress costs", "Bundling pressures standalone platforms"]
      - ["AWS Bedrock/GovCloud", "Consumption", "Per-token / per-instance", "Model hosting + infra", "Marketplace discounts", "Low entry cost favors build-it-yourself"]
      - ["Credo AI / Arthur", "SaaS subscription", "Per-seat / per-model", "Governance / monitoring", "Tiered; some usage-based", "Cheap point tools undercut trust premium"]
      - ["Cohere", "Enterprise license / API", "Per-token / deployment", "Private LLM deployment", "Negotiated", "Model-layer pricing pressures platform margins"]
    notes: >-
      Pricing is largely opaque across the field; entries describe contract
