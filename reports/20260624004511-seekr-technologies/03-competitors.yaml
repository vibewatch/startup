callouts:
  - calloutType: strength
    title: "Unique combination of air-gapped deployment plus native trust scoring"
    body: >-
      No single rival pairs accredited air-gapped/disconnected operation with a
      built-in trustworthiness score in one build-deploy platform; that
      combination is Seekr's clearest differentiator versus both hyperscalers and
      pure-play governance startups.
    claimRefs: [CP006, CP007, CP012]
  - calloutType: risk
    title: "Capital and distribution asymmetry versus incumbents"
    body: >-
      Palantir, Microsoft, AWS, and OpenAI operate with orders of magnitude more
      capital and entrenched accreditation/distribution, letting them bundle
      governance and undercut a venture-scale challenger on reach and price.
    claimRefs: [CP008, CP011, CP014]
  - calloutType: risk
    title: "Commoditization and free-bundled governance threaten the moat"
    body: >-
      Open-weight foundation models closing the quality gap, plus hyperscalers
      bundling governance for free and governance startups iterating quickly, are
      the three forces most likely to erode Seekr's differentiation by 2028.
    claimRefs: [CP015, CP016, CP033]
  - calloutType: assumption
    title: "Patent and pricing strength cannot be verified from public sources"
    body: >-
      Seekr's patent breadth and ACV are undisclosed; the moat assessment treats
      both as open questions pending a claims analysis and data-room pricing
      review.
    claimRefs: [CP013, CP031, CP034]

