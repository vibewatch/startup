      - ["Built-in hallucination/bias scoring", "Strong (SeekrScore)", "Partial", "Via partners", "Strong (governance)", "Partial"]
      - ["Full build-validate-deploy platform", "Strong (SeekrFlow)", "Strong", "Strong", "Weak (point tool)", "Partial (model-centric)"]
      - ["Government accreditation footprint", "Growing (SOC 2; SBIR)", "Strong (entrenched)", "Strong (FedRAMP High/IL)", "Limited", "Limited"]
      - ["Model flexibility / open-weight support", "Strong (multi-model)", "Partial", "Strong (Azure OpenAI + OSS)", "n/a (model-agnostic)", "Own models"]
      - ["Scale of capital & distribution", "Weak (venture-scale)", "Very strong", "Very strong", "Weak", "Moderate"]
    notes: >-
      Ordinal strength ratings (strong/partial/weak) are evidence-backed
      qualitative assessments from vendor materials and third-party reviews, not
      benchmarked scores. Unsupported or non-applicable cells are marked 'n/a' or
      'via partners'. Seekr leads on air-gapped trust, trails badly on capital.
