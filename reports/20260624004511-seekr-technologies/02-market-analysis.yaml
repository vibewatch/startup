callouts:
  - calloutType: insight
    title: "Headline TAM massively overstates Seekr's reachable demand"
    body: >-
      The $55B+ 2026 generative-AI TAM bundles training capex, consumer apps, and
      cloud infrastructure Seekr does not sell. The serviceable pool - air-gapped,
      regulated, government-grade GenAI plus governance tooling - is a low-tens-of-
      billions SAM, and Seekr's realized revenue implies a sub-1% obtainable share.
    claimRefs: [CM005, CM012, CM013]
  - calloutType: strength
    title: "Regulatory and trust tailwinds align with Seekr's positioning"
    body: >-
      NIST AI RMF and GAO oversight push agencies toward auditable, low-
      hallucination AI, and the responsible-AI/governance category is growing
      ~35-47% annually - directly favoring SeekrScore/SeekrGuard differentiation.
    claimRefs: [CM019, CM010, CM011]
  - calloutType: risk
    title: "Procurement cycles and model commoditization throttle conversion"
    body: >-
      Six-to-eighteen-month ATO cycles and rapidly commoditizing foundation
      models are the two forces most likely to slow Seekr's pilot-to-production
      conversion and compress pricing power over 2026-2028.
    claimRefs: [CM023, CM024, CM035]
  - calloutType: assumption
    title: "SAM is bounded, not pinpointed"
    body: >-
      Absent an audited government-GenAI-platform market study, the SAM is derived
      by combining defense-AI, responsible-AI, and governance lenses; treat the
      $8-18B band as a planning estimate pending primary diligence.
    claimRefs: [CM032, CM036, CM037]

