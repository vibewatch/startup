callouts:
  - calloutType: risk
    title: "Defense concentration is the dominant risk"
    body: >
      The verifiable customer base is heavily U.S. Army/DoD-weighted, exposing revenue to appropriations, continuing
      resolutions, ATO timelines, and SBIR phase transitions. A program cut or shutdown freezing the Army pipeline is the
      single most consequential thesis-break trigger.
    claimRefs: [CR001, CR002, CR004]
  - calloutType: risk
    title: "Trust thesis rests on unverified efficacy"
    body: >
      The hallucination/bias-reduction advantage that justifies Seekr's premium is measured internally, not by independent
      benchmark. A credible third-party evaluation showing no advantage would compress the valuation and undercut the
      product narrative.
    claimRefs: [CR031, CR032]
  - calloutType: risk
    title: "Concentrated strategic dependencies (AMD, GDIT, base models)"
    body: >
      Compute is tilted to AMD, government go-to-market increasingly runs through GDIT, and models are fine-tuned from
      third-party open bases. Each is manageable alone, but together they expose roadmap, economics, and pipeline to
      external decisions.
    claimRefs: [CR023, CR024, CR025]
  - calloutType: recommendation
    title: "Convert private facts to verified evidence before underwriting"
    body: >
      Priority diligence asks: FedRAMP/ATO/SOC 2 certification package; named commercial references and retention cohorts;
      an independent hallucination/bias benchmark; and a contract-by-contract revenue and runway schedule. These resolve
      the most material residual exposures.
    claimRefs: [CR037, CR040, CR043, CR044]
