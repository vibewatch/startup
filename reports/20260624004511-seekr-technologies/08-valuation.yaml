callouts:
  - calloutType: recommendation
    title: "Participate only with downside structure"
    body: >-
      At ~67x trailing revenue the entry prices in near-flawless execution. We would participate
      only via a senior liquidation preference, anti-dilution protection, pro-rata rights, and
      milestone-gated tranches — not at a flat common-equivalent entry.
    claimRefs: [CV003, CV031, CV034]
  - calloutType: risk
    title: "Multiple compression is the dominant return risk"
    body: >-
      Public comps (Palantir ~54x on multi-$B revenue, C3.ai ~7x) and the 10-20x defense-AI
      private band imply mean-reversion risk. A normalization to even 20x revenue without
      offsetting growth would materially impair the entry.
    claimRefs: [CV006, CV008, CV010, CV031]
  - calloutType: strength
    title: "Genuine defense-AI demand and strategic alignment"
    body: >-
      SBIR/Army selection (Project Linchpin), 30+ customers, 100k+ users, and AMD Ventures'
      strategic backing give the thesis a real, fundable core that distinguishes Seekr from
      generic enterprise-AI startups.
    claimRefs: [CV013, CV014, CV023]
  - calloutType: assumption
    title: "Scenario ranges are directional, not modeled"
    body: >-
      Bull/base/bear outcomes anchor on the $1.2B entry and comparable multiple bands as
      analyst estimates; they are not DCF outputs and depend on unverified margin and growth
      inputs that the diligence asks must confirm.
    claimRefs: [CV017, CV018, CV019]
