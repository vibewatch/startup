      - number: '2.4'
        title: 增长驱动、采用约束与市场测算缺口
        blocks:
          - type: paragraph
            body: >-
              需求顺风真实存在，但分布不均。最强结构性驱动是监管和信任压力：NIST 的 AI Risk Management Framework 和 GAO 对联邦 AI
              的监督，推动机构转向可审计、低幻觉、可治理系统——这正好贴合 Seekr 定位。国防现代化预算、Seekr 战略投资者带来的 AMD / compute
              对齐，以及气隙部署溢价上升，也强化需求。反过来，采用约束很实在：政府采购和 ATO 周期通常长达 6 至 18 个月；foundation-model
              商品化压缩差异化，开放模型补齐质量差距；预算不确定性——continuing resolutions 和拨款调整——推迟项目启动。切换成本两面作用：它更保护 incumbent（hyperscaler
              政府云），而不是 venture-scale 挑战者。最大的市场测算缺口包括：发布方之间分散很大（基年、地理范围和“GenAI”范围差异足以让总量不可直接比较）；缺少独立、经审计的政府 GenAI 平台
              SAM；以及缺少 Seekr 披露的 unit economics，无法把市场份额转成收入。这些缺口应保留为证据缺口，而不是用单点估算掩盖。
