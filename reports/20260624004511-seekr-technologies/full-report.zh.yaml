              - CV034
      - number: '8.6'
        title: 展示材料
        blocks:
          - type: callout
            title: 只有带下行结构才参与
            body: >-
              ~67x trailing revenue 的入场价已经计入近乎无瑕疵的执行。我们只会通过 senior liquidation preference、反稀释保护、pro-rata
              权利和里程碑分期参与，而不会以普通股等价的平价入场。
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV031
              - CV034
          - type: callout
            title: 倍数压缩是主导回报风险
            body: >-
              公开 comps（Palantir 在数十亿美元收入上约 ~54x，C3.ai 约 ~7x）和 10-20x defense-AI 私募区间都指向均值回归风险。即便只正常化到 20x
              revenue，若没有增长抵消，也会实质损害入场。
            calloutType: risk
            claimRefs:
              - CV006
              - CV008
              - CV010
              - CV031
          - type: callout
            title: 真实的 defense-AI 需求与战略对齐
            body: >-
              SBIR / Army 入选（Project Linchpin）、30+ 客户、100k+ 用户，以及 AMD Ventures 的战略背书，让这一论点拥有真实、可融资的核心，使 Seekr 有别于通用
              enterprise-AI 初创公司。
            calloutType: strength
            claimRefs:
              - CV013
              - CV014
              - CV023
          - type: callout
            title: 情景区间是方向性估计，不是模型输出
            body: Bull/base/bear 结果以 $1.2B 入场和可比倍数区间为锚，是分析师估计，不是 DCF 输出；它们依赖未经验证的毛利和增长输入，需由尽调事项确认。
            calloutType: assumption
            claimRefs:
              - CV017
              - CV018
              - CV019
