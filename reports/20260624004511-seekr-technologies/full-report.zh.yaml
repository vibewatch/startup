      - number: '2.3'
        title: 买方、用户与付款方分层
        blocks:
          - type: paragraph
            body: >-
              买方格局可拆成四类，每类预算所有者和采用触发点不同。国防与情报买方（项目办公室、combatant commands）通过 SBIR / OTA 和 program-of-record
              载体采购；用户是作战人员或分析师，付款方是项目预算，采用触发点是经过验证、且能通过安全认证的任务能力。联邦民事机构通过 GSA / FedRAMP 渠道采购，CIO / CDO 掌握预算，现代化 mandates
              触发采购。受监管商业企业——电信、金融服务、供应链——通过业务线和 IT 预算采购；触发点是法律与风险团队会批准的合规级 GenAI 用例。一般商业企业数量最大，但切换壁垒最低，Seekr 护城河也最薄，因为
              hyperscalers 和开放模型直接竞争。各细分中，付款方和用户经常不同于经济买方，拉长销售周期。实际采用路径从 awareness / RFI 到试点，再到安全审查与 ATO、生产和扩张；其中 ATO /
              安全关口是把试点和收入分开的最大瓶颈。
