      - number: '4.5'
        title: 财务结论：收入质量、利润率路径与阻塞项
        blocks:
          - type: paragraph
            body: >-
              收入质量上，Seekr 的基础真实且具战略价值（带高信任门槛的政府和受监管企业合同），但合同与服务权重较高的收入比纯 SaaS 更波动、毛利更低；未披露增长率也让人无法确认 $1.2B
              估值暗含的轨迹。利润率路径上，气隙、服务密集模型和 compute COGS 暗示毛利率低于软件基准，AMD 硬件关系可部分缓解，但尚未验证。资本强度上，业务并非制造业意义上的 capex-heavy，但
              compute 和认证成本，加上里程碑合同带来的营运资本拖累，使其比 self-serve SaaS 同业更耗现金。决定性尽调阻塞项包括：经审计财务报表；毛利率和 CAC / payback
              披露；经验证的现金余额、burn 和 runway；核对 $18M 收入与 $22M ARR；以及确认 $100M 轮次是否完全关闭。在这些问题解决前，财务画像支持继续关注，但不足以承销。
