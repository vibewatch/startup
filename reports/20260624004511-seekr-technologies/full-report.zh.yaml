  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局：直接对手、incumbents、相邻玩家与替代方案
        blocks:
          - type: paragraph
            body: >-
              Seekr 位于三个竞争场域的交汇点，因此对手并不是一个干净的同业集合。第一类是政府级 AI 平台和集成商——Palantir 的 AIP、Scale AI 公共部门业务、C3.ai，以及 Booz Allen
              Hamilton 这类服务牵引的 primes；这些玩家已经握有 Seekr 正在争夺的机构关系、认证和项目载体。第二类是 hyperscaler 政府云：Microsoft Azure Government（含
              Azure OpenAI）、AWS GovCloud 和 Bedrock、Databricks 联邦业务；它们可以把生成式 AI 捆进既有、已认证基础设施，也是主导性的现状替代方案。第三类是可信 AI 和 AI
              治理领域——Credo AI、Arthur、TrojAI，以及原 Robust Intelligence（现 Cisco）；它们的幻觉控制、监控和 guardrail 产品与
              SeekrScore、SeekrGuard 重叠。Foundation-model 厂商（Anthropic 的 Claude Gov、OpenAI for government、Cohere 的私有 /
              安全部署）同时是供应商、合作伙伴和潜在进入者。最容易被低估的竞争对手是内部自建：机构和企业自己把 open-weight models 接到检索上，完全绕过平台采购。
