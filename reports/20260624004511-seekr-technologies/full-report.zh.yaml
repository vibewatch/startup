  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重度排序的风险概览
        blocks:
          - type: paragraph
            body: >
              Seekr 的风险画像来自其吸引力本身：这是一家防务和政府权重高、以信任为中心的 AI 平台，估值 $1.2B，而 2024 年收入约
              $18M。最高严重度风险是客户和收入集中在美国防务部门；需求真实且黏性强，但资金受年度拨款、持续决议、Authorization-to-Operate（ATO）时间线和 SBIR
              阶段转换约束，原型转为实地项目可能卡住。第二是竞争与商品化风险：hyperscalers（Microsoft Azure Government、AWS GovCloud、Google）、defense-AI
              既有玩家（Palantir）以及快速进步的开放模型会压缩差异化窗口，并可能压低定价。第三是监管与法律风险，最尖锐的是 EU AI Act 的高风险和通用 AI 义务将在 2026 年持续生效，罚金最高可达
              €35M 或全球营业额 7%；同时美国 AI 政策围绕 NIST AI Risk Management Framework 演进。第四是合作伙伴和依赖风险，横跨 AMD 算力、GDIT
              渠道、云基础设施和第三方基础模型。第五是财务与模型风险：高估值倍数、未披露的 burn 和 runway，以及支撑产品论点但由内部衡量、尚未证明的幻觉 / 偏见降低主张。Seekr
              是私人公司，在留存、毛利、认证和基准效果上披露很少，因此上述几类剩余暴露并不轻微；投资含义是，在承销信任和集中度叙事之前，尽调必须把私人事实转化为已验证证据。
