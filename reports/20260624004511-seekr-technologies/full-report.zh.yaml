  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场定义、边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              Seekr 的可服务市场最好理解为三个支出池的重叠，而不是笼统的“生成式 AI”总量。第一层是企业生成式 AI 平台层：构建 / 验证 / 部署工具、检索、微调和推理编排，SeekrFlow
              正是卖进这一层。第二层是政府和国防 AI，采购通过 Army Project Linchpin 等项目推进，且气隙、ATO-ready 部署是硬要求。第三层是更新的可信 / 负责任 AI 与 AI
              治理类别，即降低幻觉、缓解偏见和可审计工具，SeekrScore 与 SeekrGuard 瞄准这一类。纳入的支出包括卖给企业和机构的平台许可、托管服务和合规工具。Seekr 可服务边界之外，则是原始
              foundation-model 训练 capex、消费者聊天机器人和纯 GPU / 云基础设施，尽管这些经常被计入宽泛的“GenAI market”总量。主导性的现状替代方案是 hyperscaler
              政府云（Azure Government、AWS GovCloud）、由 incumbent integrators 包装商业 LLMs，以及干脆不做——出于信任与安全顾虑，把敏感工作流完全留在生成式 AI
              之外。
            claimRefs:
