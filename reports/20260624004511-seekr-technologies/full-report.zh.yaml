      - number: '6.2'
        title: 采用轨迹与具名客户证明
        blocks:
          - type: paragraph
            body: >
              Seekr 的采用轨迹由一串可验证的政府里程碑锚定。2024 年 9 月，Seekr 推出 SeekrFlow 企业平台的自助版本，以扩大访问范围。2025 年 5 月，U.S. Army 在 OUSD
              Research & Engineering “Trusted AI and Autonomy” 关键技术领域向 Seekr 授予两份 SBIR 合同：一份 Direct-to-Phase-II，合作方是
              Project Linchpin——陆军标准化 AI/MLOps 管线——用于 PEO IEW&S 传感器现代化中的高级分析；另一份 Phase I，用于边缘和艰苦环境中的 AI/ML。公开 SBIR
              记录佐证了金额：一份 Phase II（追踪号 A2D-2579）金额 $1,998,551，用于 SeekrAlign 偏见评分和态势感知；两份 Phase I 分别为
              $248,485（A244-P037-1787，边缘 LLM 开发，提到 TITAN 和 EWPMT）和 $249,684（A254-006-0250，航空与导弹系统网络安全）。2026 年 1 月，Army 的
              DEVCOM Aviation & Missile Center 选择 Seekr 部署 agentic AI，用于 Patriot 和 THAAD 导弹连等任务关键武器系统的网络韧性。2026 年，GDIT
              合作又补上一条渠道型商业化路径。因此，防务侧的具名、生产级证明强且新鲜——多个不同的 Army 组织，并由公司新闻稿和独立 SBIR.gov
              文件共同佐证；商业具名证明仍是主要缺口。具名证明表列出了已记录合作及其证据质量。
