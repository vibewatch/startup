              - CV020
      - number: '8.4'
        title: 可比估值基准
        blocks:
          - type: paragraph
            body: >-
              公开可比公司能框定 Seekr ~67x trailing multiple 的激进程度。Palantir 是最接近的上市 government-AI analog，市值约 $280B，trailing
              price-to-sales ratio 约 53.5x；按历史序列，在 AI 周期高点曾显著高于 60-100x，但 Palantir 建立在数十亿美元收入、GAAP 盈利和已验证联邦护城河之上。C3.ai
              是有政府敞口的 enterprise-AI 公司，sales multiple 低得多，约 6-9x，反映增长放缓和持续亏损；它是未盈利 enterprise-AI 平台的下行警示可比。私有市场中，Scale
              AI 在 Meta 投资后于 2025 年被标记约 $29B，纯 defense-AI 私募 round 通常落在 10-20x revenue 区间，广义 enterprise SaaS 为
              4-18x。因此，Seekr 的 ~67x 把它定价成收入基数小得多、且缺少支撑 Palantir 溢价的盈利能力和合同规模的“峰值 Palantir”。只有当投资者承销 Palantir-like
              轨迹——快速转成 programs of record、毛利扩张、信任 / 可解释性护城河变宽——该倍数才站得住。否则，向 10-20x defense-AI 区间均值回归就是核心估值风险，也是上述 bear 和
              base 结果的单一最大驱动因素。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV031
