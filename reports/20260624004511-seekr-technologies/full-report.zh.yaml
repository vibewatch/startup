      - number: '5.5'
        title: 信任、安全、安保、隐私与合规控制
        blocks:
          - type: paragraph
            body: >
              Seekr 把信任与合规作为核心卖点，而不是事后补上的功能。SeekrFlow 的可解释性会把模型回答追溯到来源：在 agentic 工作流中追踪检索到的上下文（context attribution，可用于
              Agent Chat、API 和 SDK），在微调中追踪训练样本（training-data attribution，可用于 API 和
              SDK），并精确到源文档中每个检索片段的位置，帮助调试、审计和优化数据集。其启用材料明确映射到 NIST AI 可解释性原则和 NIST 零信任架构；“你的数据中心 / air-gapped”
              部署路径则把检索、推理和日志留在客户网络边界内，服务高安全与主权数据需求。Seekr 将这些能力包装成面向 EU AI Act 等新规的合规基础设施；该法案的可解释性和审计义务会在 2026
              年持续加码。原则对齐层通过约束输出遵循领域原则、支持自我批判和人工复核，承担安全控制角色；质量与偏见评分把信任信号延伸到文本、音频和多模态数据，Seekr
              尤其强调其在防务决策支持中的用途。企业控制（RBAC、团队路由）和对数据主权的强调进一步支撑安全与治理姿态。但关键注意事项仍在：Seekr 没有在这些技术页面公开列出已完成的第三方认证（例如 FedRAMP
              授权状态或 SOC 2 报告范围），买方必须通过直接技术尽调确认认证状态，以及评分主张背后的幻觉 / 偏见降低实证证据，而不能只依赖营销表述。
