      - number: '2.2'
        title: 多镜头市场测算：TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >-
              单一数字无法概括 Seekr 的机会，因此我们用多个独立发布方交叉校准。最宽的镜头是全球生成式 AI：Precedence Research 估算 2026 年约 $55.5B（高于 2025 年约
              $37.9B），以约 37% CAGR 增长，2035 年接近约 $1.2T；Mordor Intelligence、Grand View、MarketsandMarkets 和 Statista 也佐证
              >34% CAGR，但范围和基年不同。这个总量大幅高估了 Seekr 可触达需求。更窄的 SAM 镜头，把国防与安全 AI（The Business Research Company：2026 年约
              $16.0B，约 12.5% CAGR，到 2030 年约 $25.6B）叠加负责任 AI 市场（2026 年约 $2.7B，约 38.8% CAGR）和 AI 治理平台（Precedence：2026 年约
              $0.42B，约 34% CAGR；Coherent：约 47% CAGR）。政府级与受监管企业 GenAI 合并后，可服务池大致在低双位数十亿美元区间。SOM 镜头锚定 Seekr 披露的 2024 年收入
              >$18M 和 30+ 客户，意味着近期可获得份额即便在窄 SAM 中也远低于 1%；headline TAM 与已实现收入之间的落差，是本章市场测算的核心提示。
