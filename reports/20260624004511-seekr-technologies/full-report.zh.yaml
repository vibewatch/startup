      - number: '1.4'
        title: 封面指标、规模信号与披露边界
        blocks:
          - type: paragraph
            body: >-
              Seekr 披露的信息足以证明有意义的商业牵引，但不足以仅靠公开资料完成业务承销。最强公开规模信号是 2024 年收入超过 $18M、30+ 客户、100,000+ 终端用户，以及接近现金流 breakeven
              的目标。第三方追踪器 Latka 列出更高的约 $22M ARR，说明这类估算分散度需要直接向管理层核对。公开数据库只松散支持员工数（低到中百人区间），未找到官方当前员工总数，因此本文对 headcount
              给予低置信度。

              披露画像可以概括为：财务颗粒度仍是私有未披露，但身份、领导层、产品和里程碑异常透明。支撑较充分的公开封面指标包括估值（$1.2B）、$100M
              融资、客户数（30+）和终端用户（100,000+）；仍是缺口的封面指标包括经审计收入、毛利率、ARR、net revenue retention、确切员工数和清晰累计融资额。信任与合规姿态是相对强项：Seekr
              于 2025 年 12 月取得 SOC 2 Type II 合规，并将 SeekrGuard 包装为符合美国 AI Action Plan 的路径。外部验证出现在 2026 年 5 月，Seekr 入选 CB
              Insights AI 100，该名单从 40,000 多家公司中筛选。这些都是有用的尽调线索，但底层财务文件仍属私有，应在 NDA 下索取。
