      - number: '4.2'
        title: Unit economics、毛利率与成本结构
        blocks:
          - type: paragraph
            body: >-
              Seekr 没有披露任何标准 unit-economics 指标——毛利率、CAC、payback、net revenue retention
              或平均合同价值——因此本节所有数字都是代理指标或明确缺口。对气隙、服务较重的政府 AI 平台而言，毛利率通常低于纯 SaaS 的 75-85% 基准，因为本地部署、认证和专业服务都有真实交付成本；50-70%
              区间估算合理但未验证。推理和 compute 成本是结构性 COGS 驱动，这正是 AMD Ventures 关系（硬件优化）会影响利润率的原因。运营端，公司宣称推进现金流
              breakeven，意味着相对融资规模保持克制烧钱，但月度 burn、员工成本和 capex 均未公开；据报约 110-130 名员工给出粗略 opex
              下限，却不能验证成本结构。营运资本也不透明——基于里程碑的政府合同可能占用应收并拉长现金转换周期。缺少经审计 COGS 和 opex 拆分时，利润率路径只是一个假设，不是结论，并被标记为首要尽调阻塞项。
