      - number: '5.4'
        title: 差异化：专利、原则对齐与数据策略
        blocks:
          - type: paragraph
            body: >
              Seekr 的可防守性主要落在围绕 domain principle-alignment 和内容质量评分的专利组合上。公开 USPTO 记录（经 Justia）显示，已授权专利和待审申请包括专利
              12,293,272（“Agentic workflow system and method for generating synthetic data for training or post training
              AI models to be aligned with domain-specific principles”）、专利 11,921,731（一条生成、训练、测试和实现文档评分模型的 pipeline），以及
              20260119983 和 20250322307（通过带领域特定原则的 post-training 对齐 LLMs / LMMs）、20250200124 和
              20250139184（带来源和行业评分因子的质量评分，包括 SaaS 架构）、20250078826（音频内容 civility score）等申请。主线是“principle alignment”：Seekr
              不只做 retrieval-augmented prompting，而是生成 synthetic question-answer pairs 和对齐流程，对模型进行 post-train 或
              fine-tune，使其遵循某个领域的原则，并在权重层面降低幻觉和偏见。质量 / 可解释性评分补充这一点，把输出追溯到检索上下文和训练样本。数据策略最值得注意的是它没有做什么：Seekr 的公开 Hugging
              Face organization 显示零公开模型和零数据集，说明它采取 closed-weights、IP-protected 姿态，而不是开源分发——这对政府和受监管客户是有意选择，但相较
              open-model 竞争对手，外部开发者采用信号也更薄。因此，差异化集中在专利对齐方法、可解释性工具和部署触达，而不是开放社区牵引。
