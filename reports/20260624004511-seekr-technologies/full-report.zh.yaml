      - number: '7.2'
        title: 监管、法律与 IP 风险
        blocks:
          - type: paragraph
            body: >
              监管暴露有两面。需求侧，AI 监管趋严利好信任与可解释性供应商；合规侧，则意味着成本和责任。EU AI Act 是最锋利的工具：高风险系统的风险管理、数据治理、透明度、人工监督和合格评估义务，以及通用 AI
              的文档义务，会在 2026 年持续生效；违禁行为罚款最高 €35M 或全球营业额 7%，高风险不合规最高 €15M 或 3%。任何触及 EU 人员或卖给面向 EU 客户的 Seekr
              部署都会继承这些义务。在美国，没有单一 AI 法；义务来自 NIST AI RMF、机构指引、联邦采购规则和行政行动，Congressional Research Service
              已将其归纳为一个不断演进、会约束承包商的框架。对于政府供应商，FedRAMP 授权和 DoD ATO 是法律与运营门槛，但 Seekr 没有公开确认状态。IP 风险双向存在：Seekr
              围绕原则对齐和质量评分的专利组合是防御资产，但更广泛的 LLM 领域正面对活跃的版权与训练数据诉讼（例如法律媒体追踪的高关注案件），结果可能在全行业限制数据实践。专利可执行性、相对大厂的
              freedom-to-operate，以及客户数据隐私义务，共同构成法律暴露面。监管 / 法律登记表按可能性和剩余暴露列出了这些风险。
