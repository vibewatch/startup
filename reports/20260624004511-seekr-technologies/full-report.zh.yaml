      - number: '3.3'
        title: 切换成本、锁定与护城河耐久度
        blocks:
          - type: paragraph
            body: >-
              Seekr 的可防守性建立在三条声称的护城河上：hyperscalers 难以轻易复制的已认证气隙部署、专利 trust / scoring
              技术，以及系统一旦认证并进入生产后具有高切换成本的嵌入式政府工作流。三者都真实存在，但都可被挑战。气隙部署确实是技术与合规门槛，但 Microsoft、AWS 和 Palantir 都提供 classified
              或 disconnected 选项，并拥有远多于 Seekr 的资本去补齐差距。专利差异化若无权利要求分析，很难评估；在能力被快速复制的领域，专利保护偏弱。工作流锁定更有利于已经认证并部署的玩家——今天更常见的是
              incumbent，而不是 Seekr。Multi-homing 很普遍：买方同时运行多个模型和治理工具，稀释任何单一供应商的锁定。最严重的耐久度威胁是 foundation-model
              商品化（open-weight models 缩小质量差距并压低价格）、资金充足的 incumbents 免费捆绑治理，以及快速迭代的治理 startups 在信任功能上跑赢
