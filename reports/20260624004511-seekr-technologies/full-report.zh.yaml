            body: >-
              可复用的公司时间线从 2021 年成立一路延伸到 2025-2026 年加速期。公开资料支持：数据库重构的 2023 年 Series B；2025 年 5 月在“Trusted AI and
              Autonomy”关键技术领域获得两项美国陆军 SBIR 合同（包括 Phase II 合同 W51701-25-C-A093，最高 $2M，执行至 2026 年 9 月）；2025 年 6 月以 $1.2B
              估值融资 $100M；2025 年 12 月取得 SOC 2 Type II 合规并推出 SeekrGuard；2026 年 1 月，美国陆军选择 Seekr AI agents
              用于导弹防御网络韧性（DEVCOM Aviation & Missile Center，保护 Patriot、THAAD 等系统）；2026 年 2 月 SeekrGeo beta；2026 年 3 月与
              GDIT 和 Arcas 合作；2026 年 5 月获 CB Insights AI 100 认可。这个序列显示，公司正在快速叠加政府可信度和产品宽度。

              负面与观察信号更集中，而非急性。标志性融资是首次交割事件，不是已完成轮次，且收入倍数偏高；业务高度依赖美国政府需求和单一创始人
              CEO；收入、员工数、累计融资等多项规模指标要么来自自报，要么由第三方重构，而非经审计。截至运行日期，公开资料未发现诉讼、监管执法或治理丑闻。后续章节可复用这套框架：强可信 AI
