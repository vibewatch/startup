      - number: '5.2'
        title: 架构、模型适配与 agent runtime
        blocks:
          - type: paragraph
            body: >
              架构上，SeekrFlow 是一套全生命周期栈：数据准备和 Data Jobs 供给模型适配，模型适配供给部署，部署再被 agents 和应用消费，可解释性贯穿每一层。模型适配支持多种已公开的
              fine-tuning 方法：instruction fine-tuning（在与任务指令对齐的问答对上训练，把领域知识直接嵌入参数）、context-grounded fine-tuning，以及用 GRPO
              做 reinforcement tuning，使输出贴合主观质量标准、品牌语气和人类反馈。Fine-tuning 建立在结构化 Q&A pairs 之上；SeekrFlow
              自动生成数据集、管理训练工作流，并部署生成的 custom endpoints。Deployments 在专用 compute 上托管基础或微调模型，由 instance count 和硬件分配配置，通过
              SeekrFlow API 暴露给直接推理或 agent 集成，并支持 pause / resume / delete 生命周期操作，以及用于可观测性的 event timeline。Agent runtime
              将 agent 视为模型、工具、指令和推理方法的配置，并可调 reasoning effort 和控制 plan variability 的 temperature 参数（默认 0.6）。硬件上，Seekr
              明确是 multi-accelerator：第三方和公司沟通材料称其支持 AMD Instinct GPUs、Intel Gaudi 与 Intel Tiber 环境、NVIDIA
              GPUs，并做了抽象，使工作负载可跨供应商运行。AMD 的战略投资让 Seekr 路线图与 AMD Instinct compute 对齐。这种硬件无关操作模式，是 Seekr
              声称同一平台无需重新架构即可运行在托管云、客户云、本地数据中心，以及气隙或边缘环境的核心。
