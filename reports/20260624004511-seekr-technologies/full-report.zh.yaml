      - number: '8.5'
        title: 退出准备度与最终尽调事项
        blocks:
          - type: paragraph
            body: >-
              退出准备度有可能成立，但尚未证明。最可能路径是被 prime contractor、hyperscaler 或 silicon partner 战略并购，后者寻求 trusted-AI 工具和具
              clearance 的客户关系；上市是次要路径，前提是达到可持续盈利和 $100M+ 收入规模。两条路径奖励同一组里程碑：programs of record、多年合同 backlog、披露毛利，以及在 30+
              客户基础上证明留存。投入资本前的决定性尽调事项包括：审计财务和 GAAP 收入 bridge，用以对账公司 $18M 口径与追踪器 ~$22M 口径；cohort 级客户和收入集中度拆分（政府 vs.
              商业、头部账户占比）；已实现和已签约 SBIR / Army 合同金额及 transition-to-program-of-record 状态；对照 cash-flow-breakeven 主张披露毛利和
              burn rate；$1.2B post-money 背后的最终 round size、preference stack 和 option-pool 处理；以及核心专利的 FTO /
              有效性确认。会让参与作废的论点破裂触发器包括 Project Linchpin 转化失败、重大政府预算或 ATO 停滞、失去头部客户，或低于入场价的 down-round
              repricing。只有这些事项得到有利解决且下行结构锁定后，我们才会从 Hold 转为参与。
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV031
              - CV034
