      - number: '6.3'
        title: 留存、耐久性、扩张与集中度
        blocks:
          - type: paragraph
            body: >
              耐久性证据更多来自结构，而不是指标。Seekr 不披露净收入留存（NRR）、总留存、流失或续约率，因此只能从合同类型和项目设计推断耐久性。SBIR 路径天然分阶段：Phase I 可行性进入 Phase II
              原型，Direct-to-Phase-II 则说明 Army 有信心跳过 Phase I；Project Linchpin 明确被设计成可重复管线，用于落地和规模化可信
              AI，若原型成功，会利好后续工作。DEVCOM AvMC 成单和 Linchpin 合作表明 Seekr 可在 Army 内跨不同任务领域
              land-and-expand（传感器现代化、网络韧性、边缘分析），这是积极扩张信号。GDIT 合作是典型渠道杠杆动作，可放大触达，但也引入渠道依赖：未来政府 pipeline 的重要部分可能通过 GDIT
              的任务和集成关系流入，而不是 Seekr 直销。集中度风险是主线：可验证客户集高度偏向 U.S. Army 和更广泛的 DoD，使 Seekr
              暴露于防务预算周期、采购节奏和项目拨款政治。商业侧缺少具名账户和披露留存，30+ 客户与 100,000+
              用户主张无法独立验证；若单个大型政府项目延迟，收入可能受到实质影响。即便防务标识亮眼，这些动态仍让客户耐久性成为尽调重点。
