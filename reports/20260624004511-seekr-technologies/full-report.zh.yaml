      - number: '1.2'
        title: 创始人、领导班底与关键人依赖
        blocks:
          - type: paragraph
            body: >-
              Seekr 由 Pat Condo 于 2021 年创立，Condo 现任创始人兼首席执行官。按公司说法，Condo 是连续创业者，创办过六家搜索公司，其中两家在 NASDAQ
              上市并实现超过十亿美元退出；此前应用场景横跨国防、情报和电信。这种创始人与市场的匹配，是 Seekr 切入受监管行业的核心，但也把战略、融资和叙事依赖集中到单一人物身上，构成本章主要关键人风险。Condo
              仍是公司的公开门面，2026 年 5 月曾登上 Fox Business 讨论美中 AI 竞赛。

              以该收入规模衡量，Seekr 的高管班底异常深，且明显偏向企业软件和国家安全背景。团队包括总裁 Rob Clark（20+ 年 AI 与 web-scale 技术经验）、首席技术与 AI 官 Stefanos
              Poulis 博士（搜索、NLP、推荐）、COO Doug Dubiel（前 Merrill Lynch、Rockefeller Capital Management）、CFO Matt Jones（前
              NTENT CFO）、首席人力官 Darcey Villasenor、首席营收官 Lloyd Cope（前 Palantir、前 Altana AI）和首席营销官 Colby Proffitt（2026 年 5
              月任命）。面向政府的招聘强化了国防论点：政府业务 SVP Derek Britton（前 SAS、IBM、Raytheon；前空军情报军官），以及 2026 年 2 月加入、出任 Army and SOCOM
              Programs 副总裁的退役上校 Joel Babbitt。由国家安全和金融领导者组成的 AI Advisory Board——包括退役海军中将 Mat Winter（领投方 Danu Venture
              Group 普通合伙人）和 Dr. Lisa Costa（前美国 Space Force 首席技术与创新官）——把 cap table、治理和客户基础连在一起。
