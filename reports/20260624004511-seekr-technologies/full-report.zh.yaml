chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、总部与商业模式
        blocks:
          - type: paragraph
            body: >-
              Seekr Technologies, Inc. 是一家私有人工智能公司，总部位于 11911 Freedom Drive, Suite 1140, Reston,
              Virginia；公司自有结构化披露和独立数据库均将成立时间指向 2021 年。公司把自己定位为“decision-ready, explainable, sovereign
              AI”的供应商，服务政府和企业客户；这些客户处在高风险、强监管环境中，准确性、透明度和合规性是硬要求。它的一句话商业模式是软件基础设施：Seekr 销售 SeekrFlow，这是一套端到端 AI
              操作系统，可在组织自有数据上构建、训练、验证、部署和治理 AI agents，并延伸出 SeekrGuard、SeekrIntel、SeekrGeo 等产品家族。收入来自企业和政府软件合同、市场上架（AWS
              Marketplace、AWS GovCloud、Oracle Cloud Infrastructure）和联邦奖项，而不是消费者广告。

              公司的差异化落在专利技术上：Seekr 称该技术可在所有数据类型、任何 AI 应用中降低幻觉和偏见，并能部署到云端、本地、边缘以及完全气隙 / 断连环境。Seekr
              服务政府与国防、金融、电信、供应链、公用事业等受监管和任务关键行业。身份边界比许多私有同行更清晰：公开资料明确区分了 Seekr
              Technologies（seekr.com，Reston）、无关联且已关闭的都柏林“Seekr.AI”，以及澳大利亚“SEEK Limited”。后续章节应把 Seekr 视为一家后期私有“可信
              AI”基础设施供应商：国防 / 情报是重心，同时带有商业企业侧翼。
