companyProfile:
  summary: >-
    Seekr Technologies 是一家私有生成式 AI 公司，2021 年成立，总部位于弗吉尼亚州 Reston。公司销售 SeekrFlow——一套端到端 AI
    操作系统，用于为政府、国防、情报和受监管商业客户构建、训练、验证和部署可信、可解释模型，并支持云端、本地、气隙和边缘部署。产品家族还包括 SeekrGuard、SeekrIntel 和
    SeekrGeo；公司强调降低幻觉、缓解偏见，以及拥有专利的对齐和评分技术。公开证据显示，美国陆军 SBIR 奖项（包括 Project Linchpin 工作）、2026 年 1 月导弹防御网络安全入选、与 GDIT 合作、30+
    客户和 100,000+ 终端用户，以及 2024 年收入据报超过 $18M。2025 年 6 月，Seekr 宣布按 $1.2B 估值启动 $100M 首次交割，由 Danu Venture Group 和 AMD
    Ventures 共同领投，Guggenheim Securities 担任顾问。核心尽调限制在于承销透明度：经审计收入、毛利率、烧钱、客户集中度和详细融资条款均未披露，约 67x 的 trailing revenue
    倍数缺少公开经济性支撑。
