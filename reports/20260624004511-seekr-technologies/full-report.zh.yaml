      - number: '1.3'
        title: 资本形成、估值与投资者基础
        blocks:
          - type: paragraph
            body: >-
              Seekr 最醒目的融资事件，是 2025 年 6 月启动的一轮 $100M 融资，post-money 估值 $1.2B，由 Danu Venture Group 和 AMD Ventures
              领投，Guggenheim Securities 担任财务顾问。该轮融资将 Seekr 推入独角兽行列，并让公司同时绑定战略硅片伙伴（AMD）和偏国家安全的风险投资机构（Danu，顾问委员会成员 Mat
              Winter 是其普通合伙人）。资金用途是扩张 SeekrFlow、扩大 go-to-market，并支持公司达到现金流 breakeven 的既定目标。

              两个尽调细节很关键。第一，多方资料把该轮描述为只“commenced”或完成首次交割，而非完全关闭且超额认购；叠加较高的隐含收入倍数后，投资人对 $1.2B 估值是否完全站得住给出克制怀疑。第二，2025
              年前的融资历史只披露了一部分：Tracxn 等第三方数据库重构了早期轮次（例如 2023 年约 $25M 的 Series B），并将累计融资放在约 $125M 至 $164M 之间，但 Seekr
              自有新闻稿没有逐轮列出干净融资栈。后续章节最稳的 canonical facts 是 $1.2B 估值和 2025 年 6 月 $100M
              融资；累计融资与轮次历史应按方向性信息处理，并用一手融资文件确认。除纯股权外，AMD、Intel、Oracle 和 AWS 这些基础设施关系，也同时塑造成本基础和部署叙事的可信度。
