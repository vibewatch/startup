  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 谁付费、谁使用 SeekrFlow
        blocks:
          - type: paragraph
            body: >
              Seekr 的客户基础分成两条明显不同的路径。第一条，也是公开材料最充分的一条，是美国政府和防务：公司和合作伙伴称 SeekrFlow “已部署到 U.S. Army、U.S. Navy
              和其他防务机构”，并可通过 Chief Digital and AI Office（CDAO）Tradewinds Solutions Marketplace 授标。在这一客群里，买方是联邦采购办公室（例如
              U.S. Army SBIR 项目办公室和 DEVCOM Aviation & Missile
              Center），付款方是美国政府，用户则是士兵、分析师和任务负责人，工作场景覆盖情报、采购、作战、后勤和网络安全，且常在 air-gapped、断连或战术边缘环境中运行。第二条是商业企业，Seekr
              称其在电信、供应链等行业已有采用，并报告累计超过 30 家客户、超过 100,000
              名终端用户；但不同于政府侧成果，公开材料中几乎没有具名商业标识和案例研究。地域上，已披露足迹以美国为中心，也符合其防务和主权数据定位。渠道结构很关键：2026 年 1 月与 General Dynamics
              Information Technology（GDIT）的战略合作，借助 GDIT 的集成生态、Digital Accelerators 和 Centers of
              Excellence，把触达扩展到联邦民用、州和地方以及更多防务客户。结果是：政府侧客户基础可信且任务关键，商业侧证据很薄；这一分层同时塑造增长论点和集中度风险。
