      - number: '8.2'
        title: 入场价格、融资背景与稀释纪律
        blocks:
          - type: paragraph
            body: >-
              融资背景是 2025 年 6 月 18 日宣布的 $100M 融资，post-money 估值 $1.2B，由 Danu Venture Group 和 AMD Ventures 领投，Guggenheim
              Securities 担任顾问，结构上是 first close，而非已全额认购的 round。相对公司报告的 2024 年收入超过 $18M，隐含 trailing revenue multiple 约
              67x；即便采用追踪器中流传的乐观 forward ARR（约 $22M），倍数仍高于 50x。第三方追踪器把累计融资放在约
              $125M，意味着新融资大约让投入资本翻倍，并在普通股之前堆出较大的优先权栈。因此入场纪律比平时更重要：在这个倍数下，价格已经嵌入未来几年 >70% 复合收入增长和毛利扩张，任何滑坡都会迫使 down-round
              或重结构桥融资。审慎参与应争取 senior liquidation preference、反稀释保护、用于在现金流 break-even 拐点期间守住持股的 pro-rata
              权利，以及董事会或观察员信息权，以监控 burn 是否匹配公司声称的 breakeven 时间线。由于这是 first close，后续 tranche 可能以不同有效价格完成，尽调投资者应在承销
              ownership math 前确认最终 round size、option-pool top-up，以及 headline post-money 是 pre-pool 还是 post-pool。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV013
              - CV015
              - CV016
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV018
      - number: '8.3'
        title: Bull、base 与 bear 情景
        blocks:
          - type: paragraph
            body: >-
              我们围绕 $1.2B 入场构建三种情景。Bull case 中，Seekr 将 Army / IC pilot 转成 programs of record，乘上可解释 AI 合规顺风（EU AI Act
              执法、NIST RMF 采用），三到四年内把收入从 ~$18M 推向 $80-120M，并通过战略收购或 IPO 退出，以 defense-AI 溢价倍数支撑 $3.5-5B+ 结果和入场价上的 3-4x
              gross return。Base case 是政府节奏下稳健但更慢的增长，收入约 $45-70M；随着私有 AI 倍数向 10-20x defense-AI 区间正常化，倍数部分压缩，结果为
              $1.8-2.6B——约 1.5-2x，并伴随采购周期带来的时间风险。Bear case 叠加客户集中冲击、持续决议或停摆导致的合同延误、LLM 商品化侵蚀定价，以及广泛 AI 倍数重置；收入停在约
              $20-30M，结构化 down-round 重置 cap table，普通股等价持有人在优先权之后面对 0.3-0.7x
              甚至更差结果。定性加权后，入场价下的分布很宽且左偏：上行真实存在，但一旦认真考虑倍数正常化，众数结果会聚在 break-even 到 modest gain 附近。不对称性支持结构优先于价格。
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV031
              - CV032
              - CV033
          - type: table
            tableRef: TV003
            claimRefs:
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
          - type: figure
            figureRef: FV003
