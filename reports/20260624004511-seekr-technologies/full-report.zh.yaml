      - number: '7.4'
        title: 财务、模型与执行风险
        blocks:
          - type: paragraph
            body: >
              财务上，核心风险是估值与基本面紧张：以约 $18M 的 2024 年收入支撑 $1.2B 估值，隐含非常高的收入倍数，前提是增长快速且可持续，政府原型能成功转成规模化项目。Burn rate、现金 runway
              和毛利未披露，资本充足性无法独立评估；$100M 融资（2025 年 6 月 first close，由 Danu Venture Group 和 AMD Ventures
              领投）提供缓冲，但公司释放的是目标在十二个月内达到现金流 break-even，而非已实现；分阶段 SBIR 资金又把近期收入系在里程碑完成和拨款节奏上，降低可预测性。Down round 或完整 close
              延迟会同时压迫资产负债表和士气。模型风险是另一回事：整个信任论点依赖原则对齐和评分，其幻觉 / 偏见降低效果来自内部测量，不是独立评估；若基准或公开失败削弱这一主张，溢价会被压缩。执行和人风险集中在创始人 /
              领导团队（President Rob Clark
              和高级领导层）同时推进防务规模化、商业扩张、监管合规和多供应商硬件路线图——对这个体量的公司来说，战线很宽。关键人集中、招聘速度，以及在防务、商业和平台押注之间保持优先级纪律，都是实质执行风险。财务和人员登记表、缓释表以及下方
              kill criteria，把这些风险转化为投资者可监控指标和论点破裂触发器。
