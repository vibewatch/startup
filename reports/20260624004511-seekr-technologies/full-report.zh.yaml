        title: 收入流、定价与变现
        blocks:
          - type: paragraph
            body: >-
              Seekr 的收入围绕 SeekrFlow 平台展开——这是一套用于构建、验证和部署生成式 AI 模型及 agents 的一体化栈——卖给企业和政府客户，并由政府项目合同（尤其是美国陆军 SBIR award
              W5170125CA093）和落地气隙、已认证部署所需的专业服务补充。公开披露没有拆分收入结构，但客户画像（国防、情报、电信、供应链）和 SBIR / OTA 合同意味着，收入基础更偏政府和大型受监管企业，而不是
              self-serve SaaS。定价未披露：平台许可、合同载体和服务都通过企业 / 机构谈判协议销售，因此没有公开 list price、per-seat rate 或 consumption tariff
              可锚定模型。收入确认很可能混合了订阅 / 许可的按期确认收入，以及按里程碑或交付物确认的合同收入；后者带来波动，也引出 percentage-of-completion
              确认问题，需要经审计报表才能解决。变现叙事可信，但仅凭公开证据，无法在 line-item 层面承销。
