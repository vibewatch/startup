  topStrengths:
    - Real, fundable defense/intelligence demand evidenced by U.S. Army SBIR awards, Project Linchpin work, a January 2026 missile-defense cyber selection, and a GDIT collaboration.
    - Differentiated trustworthy-AI positioning — explainability, alignment, hallucination reduction, and air-gapped/edge deployment — fits regulated and sovereign buyers underserved by generic LLM platforms.
    - Strategic AMD Ventures backing aligns Seekr with a merchant-silicon roadmap relevant to secure and edge deployment, alongside Oracle and AWS infrastructure/channel partnerships.
    - Reported 2024 revenue above $18M with a stated cash-flow-breakeven target, plus 30+ customers and 100,000+ end users, is meaningful early commercial proof.
  topRisks:
    - At roughly 67x trailing revenue the entry price embeds Palantir-like trajectory with no cushion; public comps (Palantir ~54x on multi-$B revenue, C3.ai ~7x) imply material multiple-compression risk.
    - High government/customer and contract concentration with few disclosed programs of record exposes revenue to appropriations, continuing-resolution, shutdown, and ATO timing risk.
    - Public disclosure omits audited revenue, gross margin, burn, runway, payer/customer mix, and detailed financing terms, blocking a full underwrite of the unicorn mark.
    - Competition from far better-capitalized incumbents (Palantir, Scale AI, Microsoft, AWS) and LLM commoditization threaten pricing power and differentiation.
  unresolvedGaps:
    - Audited financials and a GAAP revenue bridge reconciling the company's >$18M figure against the ~$22M tracker ARR.
    - Gross margin, operating burn, runway, and customer/revenue concentration (government vs. commercial, top-account share).
    - Final round size, liquidation-preference stack, and option-pool treatment behind the $1.2B post-money first close.
    - Realized SBIR/Army contract values and whether any pilot has transitioned to a multi-year program of record, plus patent FTO/validity confirmation.
