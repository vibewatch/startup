  topStrengths:
    - 防务 / 情报需求真实且可融资：U.S. Army SBIR 奖项、Project Linchpin 工作、2026 年 1 月导弹防御网络安全入选，以及 GDIT 合作都提供了证据。
    - 可信 AI 定位有差异：可解释性、对齐、降低幻觉，以及隔离 / 边缘部署，契合通用 LLM 平台服务不足的受监管和主权买家。
    - AMD Ventures 战略背书让 Seekr 接上与安全和边缘部署相关的商用硅路线图，同时还有 Oracle 与 AWS 的基础设施 / 渠道合作。
    - 据称 2024 年收入超过 $18M，并设定现金流打平目标；30+ 客户和 100,000+ 终端用户构成有意义的早期商业证明。
  topRisks:
    - 约 67x 过去 12 个月收入的入场价格已经嵌入 Palantir 式轨迹，几乎没有缓冲；上市可比公司（Palantir 在数十亿美元收入上约 54x，C3.ai 约 7x）暗示显著倍数压缩风险。
    - 政府 / 客户和合同集中度高，公开的正式列装项目很少；收入暴露于拨款、持续决议、政府停摆和 ATO 时间风险。
    - 公开披露缺少审计收入、毛利率、烧钱速度、现金跑道、付款方 / 客户组合和详细融资条款，无法完整承销独角兽估值。
    - Palantir、Scale AI、Microsoft、AWS 等资本更厚的既有厂商，以及 LLM 商品化，会威胁定价权和差异化。
  unresolvedGaps:
    - 审计财务，以及按 GAAP 口径调节公司 >$18M 数字与约 $22M 跟踪 ARR 的收入桥。
    - 毛利率、经营烧钱速度、现金跑道，以及客户 / 收入集中度（政府与商业、头部账户占比）。
    - 支撑 $1.2B 投后首关的最终轮次规模、清算优先权堆叠和期权池处理方式。
    - 已实现的 SBIR / Army 合同金额，是否有任何试点转为多年正式列装项目，以及专利 FTO / 有效性确认。
