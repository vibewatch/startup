  - id: capital-and-investors
    title: Capital formation, valuation, and investor base
    body: >-
      Seekr's headline financing event is a $100 million round commenced in June 2025 at a $1.2 billion
      post-money valuation, led by Danu Venture Group and AMD Ventures, with Guggenheim Securities serving as
      financial advisor. This is the round that moved Seekr into unicorn territory and aligns the company with
      a strategic silicon partner (AMD) alongside a national-security-oriented venture group (Danu, where
      advisory-board member Mat Winter is a general partner). The funding is intended to scale SeekrFlow,
      expand go-to-market, and support the company's stated goal of reaching cash-flow breakeven.

      Two diligence nuances matter. First, multiple sources describe the round as having only "commenced" or
      reached a first close rather than being fully closed and oversubscribed, which — paired with a high
      implied revenue multiple — has drawn measured investor skepticism about whether the $1.2B mark is fully
      supported. Second, the pre-2025 capital history is only partially disclosed: third-party databases such
      as Tracxn reconstruct earlier rounds (for example, a 2023 Series B around $25M) and place cumulative
      funding somewhere between roughly $125M and $164M, but Seekr's own releases do not enumerate a clean
      round-by-round stack. The safest canonical facts for later chapters are the $1.2B valuation and the
      $100M June 2025 raise; total-raised and round history should be treated as directional and confirmed
      against primary financing documents. Beyond pure equity, AMD, Intel, Oracle, and AWS function as
      infrastructure relationships that shape both the cost base and the credibility of the deployment story.
    claimRefs:
      - CO014
      - CO015
      - CO016
      - CO017
