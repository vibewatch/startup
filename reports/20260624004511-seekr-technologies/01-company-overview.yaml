callouts:
  - calloutType: strength
    title: Trusted-AI positioning with credible defense and enterprise traction
    body: >-
      Seekr pairs a differentiated "explainable, air-gapped-capable" product thesis with concrete government
      proof points (multiple U.S. Army SBIR awards and program selections) and strategic backing from AMD
      Ventures and Danu Venture Group. This combination gives the company a defensible center of gravity in
      regulated, security-sensitive markets that big-tech generalists serve less comfortably.
    claimRefs:
      - CO002
      - CO014
      - CO027
      - CO028
      - CO029
  - calloutType: risk
    title: First-close financing at a high multiple, with concentration risk
    body: >-
      The marquee $100M round is described as commenced/first close rather than fully closed, and the implied
      multiple on stated 2024 revenue is rich. Combined with heavy reliance on U.S. government demand and a
      founder-CEO who anchors the narrative, the company should not be treated as a fully de-risked late-stage
      software business until the round closes and audited financials are reviewed.
    claimRefs:
      - CO016
      - CO021
      - CO035
      - CO038
  - calloutType: insight
    title: Disclosure is strong on identity but thin on financial granularity
    body: >-
      Seekr is unusually transparent about leadership, products, partnerships, and milestones while keeping
      audited revenue, gross margin, ARR, NRR, total raised, and exact headcount private or self-reported. The
      gap between narrative transparency and financial transparency is the defining diligence theme for later
      chapters.
    claimRefs:
      - CO005
      - CO021
      - CO023
      - CO024
