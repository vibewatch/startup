company:
  name: Seekr Technologies
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Seekr Technologies is a private, Reston, Virginia-based generative AI company founded in 2021 and led by
    serial search-software founder Pat Condo. Its SeekrFlow platform builds, validates, and deploys trusted,
    explainable AI agents across cloud, on-premises, edge, and air-gapped environments for government and
    enterprise. In June 2025 Seekr commenced a $100M funding round at a $1.2B valuation led by Danu Venture
    Group and AMD Ventures (Guggenheim Securities advising), against 2024 revenue of more than $18M, 30+
    customers, and 100,000+ end users. The main diligence caveats are an un-closed (first-close) financing, a
    high revenue multiple, heavy government dependence, and key-person concentration around the founder-CEO.
sections:
  - id: identity-and-model
    title: Identity, headquarters, and business model
    body: >-
      Seekr Technologies, Inc. is a private artificial-intelligence company headquartered at 11911 Freedom
      Drive, Suite 1140, Reston, Virginia, with founding consistently dated to 2021 across the company's own
      structured disclosures and independent databases. The company positions itself as the provider of
      "decision-ready, explainable, sovereign AI" for government and enterprise customers operating in
      high-stakes, regulated environments where accuracy, transparency, and compliance are paramount. Its
      one-line business model is software infrastructure: Seekr sells SeekrFlow, an end-to-end AI operating
      system to build, train, validate, deploy, and govern AI agents on an organization's own data, plus a
      growing product family (SeekrGuard, SeekrIntel, SeekrGeo). Revenue comes from enterprise and government
      software contracts, marketplace listings (AWS Marketplace, AWS GovCloud, Oracle Cloud Infrastructure),
      and federal awards rather than consumer advertising.

      The company's differentiation rests on patented technology that the company says reduces hallucinations
      and bias in any AI application across all data types, deployable on-cloud, on-premises, at the edge, and
      in fully air-gapped/disconnected settings. Seekr serves regulated and mission-critical sectors including
      government and defense, finance, telecommunications, supply chain, and utilities. The identity is
      cleaner than many private peers: there is an explicit public disambiguation distinguishing Seekr
      Technologies (seekr.com, Reston) from the unrelated, now-closed "Seekr.AI" of Dublin and from Australia's
      "SEEK Limited." For later chapters, Seekr should be treated as a late-stage private "trusted AI"
      infrastructure vendor with a defense/intelligence center of gravity and a commercial enterprise wing.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
      - CO005
      - CO006
      - CO007
      - CO031
      - CO037
    figureRefs:
