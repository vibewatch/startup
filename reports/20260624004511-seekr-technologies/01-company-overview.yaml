  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: total raised
      missingEvidence: A clean, company-confirmed round-by-round funding stack and total capital raised.
      whyItMatters: >-
        Third-party reconstructions of total raised range from roughly $125M to $164M and conflict with the
        company's selective disclosures, affecting dilution and capital-efficiency analysis.
      diligencePath: Request the financing history and cap table under NDA; reconcile against SEC Form D filings.
      relatedQuestionRefs:
        - QO007
      relatedTableRefs:
        - TO003
    - type: conflicting-data
      severity: material
      topic: round status
      missingEvidence: Confirmation of whether the $100M round has fully closed versus a first close.
      whyItMatters: >-
        A round that has only commenced/first-closed carries higher execution risk and may not reflect a fully
        subscribed $1.2B valuation.
      diligencePath: Obtain the closing documents and confirm committed vs. funded capital with management.
      relatedQuestionRefs:
        - QO010
    - type: missing-source
      severity: minor
      topic: headcount
      missingEvidence: An official, current employee headcount.
      whyItMatters: Headcount informs burn, scale, and the credibility of the breakeven target.
      diligencePath: Request HR headcount and org chart; cross-check LinkedIn and payroll data.
      relatedQuestionRefs:
        - QO024
    - type: enumeration-incomplete
      severity: minor
      topic: leadership roster
      missingEvidence: A complete below-VP org chart and full leadership roster.
      whyItMatters: The public leadership table covers only the named C-suite and senior government hires.
      diligencePath: Request a full org chart and confirm reporting lines and tenure.
      relatedQuestionRefs:
        - QO005
      relatedTableRefs:
        - TO002
    - type: enumeration-incomplete
      severity: minor
      topic: milestones
      missingEvidence: A complete dated milestone record including minor releases and internal governance events.
      whyItMatters: The milestone table prioritizes material public events and may omit smaller product or hiring milestones.
      diligencePath: Request an internal corporate timeline and product-release log to fill gaps.
      relatedTableRefs:
        - TO004
    - type: private-evidence-only
      severity: material
      topic: cap table
      missingEvidence: Ownership percentages, voting control, and implied dilution across rounds.
      whyItMatters: The advisor-investor overlap (Danu GP on the advisory board) and undisclosed cap table affect governance and control analysis.
      diligencePath: Request the cap table and shareholder agreements; assess founder control vs. investor protections.
      relatedQuestionRefs:
        - QO026
