evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: total raised
    missingEvidence: A clean, company-confirmed round-by-round funding stack and total capital raised.
    whyItMatters: >-
      Third-party reconstructions of total raised range from roughly $125M to $164M and conflict with the company's
      selective disclosures, affecting dilution and capital-efficiency analysis.
    diligencePath: Request the financing history and cap table under NDA; reconcile against SEC Form D filings.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: round status
    missingEvidence: Confirmation of whether the $100M round has fully closed versus a first close.
    whyItMatters: >-
      A round that has only commenced/first-closed carries higher execution risk and may not reflect a fully subscribed
      $1.2B valuation.
    diligencePath: Obtain the closing documents and confirm committed vs. funded capital with management.
    relatedQuestionRefs:
      - QO010
  - type: missing-source
    severity: minor
    topic: headcount
    missingEvidence: An official, current employee headcount.
    whyItMatters: Headcount informs burn, scale, and the credibility of the breakeven target.
    diligencePath: Request HR headcount and org chart; cross-check LinkedIn and payroll data.
    relatedQuestionRefs:
      - QO024
  - type: enumeration-incomplete
    severity: minor
    topic: leadership roster
    missingEvidence: A complete below-VP org chart and full leadership roster.
    whyItMatters: The public leadership table covers only the named C-suite and senior government hires.
    diligencePath: Request a full org chart and confirm reporting lines and tenure.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: minor
    topic: milestones
    missingEvidence: A complete dated milestone record including minor releases and internal governance events.
    whyItMatters: The milestone table prioritizes material public events and may omit smaller product or hiring milestones.
    diligencePath: Request an internal corporate timeline and product-release log to fill gaps.
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: cap table
    missingEvidence: Ownership percentages, voting control, and implied dilution across rounds.
    whyItMatters: >-
      The advisor-investor overlap (Danu GP on the advisory board) and undisclosed cap table affect governance and
      control analysis.
    diligencePath: Request the cap table and shareholder agreements; assess founder control vs. investor protections.
    relatedQuestionRefs:
      - QO026
  - type: missing-source
    severity: material
    topic: government-GenAI-platform SAM (TM002, FM002)
    missingEvidence: An independent, audited market study sizing the government-grade generative-AI platform segment specifically.
    whyItMatters: >-
      Without it, Seekr's SAM is a combination of proxy lenses (defense AI + responsible AI + governance) rather than a
      measured figure, widening valuation uncertainty.
    diligencePath: >-
      Commission or obtain a government-AI-platform market study; triangulate with federal AI obligations data and
      agency procurement records.
    relatedQuestionRefs:
      - QM008
      - QM023
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: Seekr unit economics for SOM conversion
    missingEvidence: Disclosed gross margin, per-customer ACV, and pilot-to-production conversion rates.
    whyItMatters: >-
      These determine whether market share translates into durable revenue and are required to validate the SOM and
      revenue trajectory.
    diligencePath: 'Request management data room metrics: ACV by segment, gross margin, conversion funnel, and net revenue retention.'
    relatedQuestionRefs:
      - QM024
  - type: conflicting-data
    severity: minor
    topic: generative-AI TAM dispersion across publishers (TM002)
    missingEvidence: >-
      Reconciliation of base year, geography, and scope across Precedence, Mordor, Grand View, MarketsandMarkets, and
      Statista.
    whyItMatters: Wide dispersion means headline TAM cannot be used as a precise anchor; only a bounded range is defensible.
    diligencePath: Normalize each estimate to a common base year and scope before using in valuation.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: switching-cost asymmetry vs hyperscaler government clouds
    missingEvidence: Evidence on whether Seekr's switching costs exceed those protecting Azure Government / AWS GovCloud incumbents.
    whyItMatters: Determines whether Seekr can defend accounts against incumbent platform lock-in.
    diligencePath: Interview customers on migration friction and contract lock-in; review displacement win/loss data.
    relatedQuestionRefs:
      - QM021
  - type: private-evidence-only
    severity: material
    topic: Seekr pricing and ACV for pricing-packaging-comparison (TP003)
    missingEvidence: Disclosed list pricing, contract model, and average contract value by segment.
    whyItMatters: >-
      Without pricing, head-to-head ACV and margin comparison with Palantir, hyperscalers, and governance startups is
      impossible, leaving competitive economics unverified.
    diligencePath: 'Request data-room pricing: ACV by segment, discounting policy, and win/loss pricing data versus named competitors.'
    relatedQuestionRefs:
      - QP011
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: Seekr patent breadth and freedom-to-operate
    missingEvidence: A patent-claims analysis establishing the scope and defensibility of Seekr's trust/scoring IP.
    whyItMatters: >-
      Patent strength is a core stated moat; without claims analysis it cannot be relied upon as durable
      differentiation.
    diligencePath: Commission IP counsel to review granted claims, pending applications, and freedom-to-operate versus competitors.
    relatedQuestionRefs:
      - QP013
    relatedTableRefs:
      - TP004
  - type: missing-source
    severity: minor
    topic: AMD strategic-investor exclusivity
    missingEvidence: Terms establishing whether Seekr's AMD alignment is exclusive or a co-sell commitment unavailable to rivals.
    whyItMatters: Determines whether the investor relationship is a real distribution/compute moat or a non-exclusive arrangement.
    diligencePath: Review investor and commercial agreements for exclusivity, co-sell, and compute-access terms.
    relatedQuestionRefs:
      - QP022
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: blocking
    topic: unit economics for unit-economics-table (TI003)
    missingEvidence: Audited gross margin, CAC/payback, NRR, and ACV.
    whyItMatters: >-
      These determine profitability and sales efficiency and are required to underwrite a $1.2B valuation; all are
      currently undisclosed.
    diligencePath: >-
      Obtain audited financials and a data-room metrics pack: COGS split, S&M efficiency, cohort retention, and ACV by
      segment.
    relatedQuestionRefs:
      - QI006
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash on hand, burn, and runway (capital-adequacy-table, TI004)
    missingEvidence: Verified balance-sheet cash, monthly burn, and runway.
    whyItMatters: Financing dependency and dilution risk cannot be assessed without these; the breakeven goal is unverifiable.
