callouts:
  - calloutType: strength
    title: "Patented principle-alignment is a genuine technical moat"
    body: >
      Seekr's issued and pending patents on domain principle-alignment and quality/bias scoring (e.g. 12,293,272 and
      11,921,731) target the post-training and synthetic-data layer, not just prompting — a defensible position for
      regulated buyers who need weight-level domain compliance and auditable scoring rather than generic LLM access.
    claimRefs: [CE025, CE026, CE030]
  - calloutType: strength
    title: "Deployment reach from managed cloud to air-gapped edge"
    body: >
      Documented support for managed cloud, customer cloud, on-premises, fully air-gapped data centers, and edge
      devices — across AMD, Intel, and NVIDIA compute — directly addresses defense and sovereign-data requirements that
      most commercial GenAI platforms cannot meet without re-architecture.
    claimRefs: [CE013, CE017, CE036]
  - calloutType: risk
    title: "Thin open developer footprint and unproven external traction"
    body: >
      Seekr's public Hugging Face organization shows zero public models and datasets, and there are no published SLAs,
      uptime data, or independent reliability benchmarks. The closed posture fits the security narrative but leaves
      external adoption, performance, and reliability claims dependent on private validation.
    claimRefs: [CE031, CE023, CE039]
  - calloutType: assumption
    title: "Hallucination/bias-reduction efficacy assumed, not independently proven"
    body: >
      Seekr's hallucination- and bias-reduction claims rest on its alignment methodology and internal scoring; no
      independent benchmark quantifying the reduction was located. Diligence assumes the mechanism is sound but should
      require empirical, third-party evaluation before underwriting it as a hard differentiator.
    claimRefs: [CE029, CE035]
