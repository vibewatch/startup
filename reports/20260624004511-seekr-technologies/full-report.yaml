      - number: '2.2'
        title: 'Multi-lens market sizing: TAM, SAM, and SOM'
        blocks:
          - type: paragraph
            body: >-
              No single number captures Seekr's opportunity, so we triangulate across independent publishers. The
              broadest lens - global generative AI - is sized by Precedence Research at roughly $55.5B in 2026 (up from
              ~$37.9B in 2025) growing at a ~37% CAGR toward ~$1.2T by 2035, with Mordor Intelligence, Grand View,
              MarketsandMarkets, and Statista corroborating a >34% CAGR but using different scope and base years. That
              total massively overstates Seekr's reachable demand. A tighter SAM lens layers AI-in-defense-and- security
              (The Business Research Company: ~$16.0B in 2026, ~12.5% CAGR to ~$25.6B by 2030) with the responsible-AI
              market (~$2.7B in 2026, ~38.8% CAGR) and AI-governance platforms (Precedence: ~$0.42B in 2026, ~34% CAGR;
              Coherent: ~47% CAGR). Combining government-grade and regulated-enterprise GenAI yields a serviceable pool
              in the low tens of billions. The SOM lens anchors on Seekr's disclosed 2024 revenue of >$18M and 30+
              customers, implying a near-term obtainable share well under 1% of even the narrow SAM - the gap between
              headline TAM and realized revenue is the central sizing caveat for this chapter.
