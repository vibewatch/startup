      - number: '8.3'
        title: Bull, base and bear scenarios
        blocks:
          - type: paragraph
            body: >-
              We frame three scenarios anchored on the $1.2B entry. In the bull case, Seekr converts Army/IC pilots into
              programs of record, rides the explainable-AI compliance tailwind (EU AI Act enforcement, NIST RMF
              adoption), scales revenue from ~$18M toward $80-120M over three to four years, and exits via strategic
              acquisition or IPO at a defense-AI premium multiple, supporting a $3.5-5B+ outcome and a 3-4x gross return
              on the entry. The base case sees steady but slower government-paced growth to roughly $45-70M revenue,
              partial multiple compression as private AI multiples normalize toward the 10-20x defense-AI band, and a
              $1.8-2.6B outcome — roughly 1.5-2x, with timing risk from procurement cycles. The bear case combines
              customer concentration shock, a continuing-resolution or shutdown-driven contract delay, LLM
              commoditization that erodes pricing, and a broad AI multiple reset; revenue stalls near $20-30M, a
              structured down-round resets the cap table, and common-equivalent holders face a 0.3-0.7x outcome or worse
              after preferences. Probability-weighting these qualitatively, the distribution is wide and left-skewed at
              the entry price: the upside is genuine but the modal outcome clusters around break-even-to-modest-gain
              once multiple normalization is taken seriously. The asymmetry argues for structure over price.
