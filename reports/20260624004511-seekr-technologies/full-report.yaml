      - number: '1.5'
        title: Milestones, adverse signals, and what later chapters can reuse
        blocks:
          - type: paragraph
            body: >-
              The reusable company chronology runs from a 2021 founding through a rapid 2025-2026 acceleration. Public
              sources support a 2023 Series B reconstructed by databases, the May 2025 award of two U.S. Army SBIR
              contracts under the "Trusted AI and Autonomy" critical technology area (including a Phase II contract,
              W51701-25-C-A093, valued up to $2M and running through September 2026), the June 2025 $100M raise at a
              $1.2B valuation, SOC 2 Type II compliance and the SeekrGuard launch in December 2025, a January 2026 U.S.
              Army selection of Seekr AI agents for missile-defense cyber resilience (DEVCOM Aviation & Missile Center,
              protecting systems such as Patriot and THAAD), a February 2026 SeekrGeo beta, March 2026 collaborations
              with GDIT and Arcas, and the May 2026 CB Insights AI 100 recognition. This sequence shows a company
              compounding government credibility and product breadth quickly.

              The adverse and watch-item signals are concentrated rather than acute. The marquee financing is a
              first-close event, not a completed round, and carries a high revenue multiple; the business is heavily
              dependent on U.S. government demand and on a single founder-CEO; and several scale metrics (revenue,
              headcount, total raised) are either self-reported or reconstructed by third parties rather than audited.
              No litigation, regulatory enforcement, or governance scandal surfaced in public sources as of the run
              date. Later chapters can reuse this frame: strong trusted-AI positioning and defense traction, backed by a
              marquee but not-yet-closed round, paired with disclosure gaps and concentration risks that diligence must
              probe directly.
