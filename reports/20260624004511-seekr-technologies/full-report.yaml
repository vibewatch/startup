            body: >
              Durability evidence is structural rather than metric-based. Seekr does not publish net revenue retention
              (NRR), gross retention, churn, or renewal rates, so durability must be inferred from contract type and
              program design. The SBIR pathway is inherently staged — Phase I feasibility into Phase II prototyping,
