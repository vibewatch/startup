      - number: '7.4'
        title: Financial, model, and execution risk
        blocks:
          - type: paragraph
            body: >
              Financially, the headline risk is valuation-to-fundamentals tension: a $1.2B valuation on roughly $18M of
              2024 revenue implies a very high revenue multiple that assumes durable, rapid growth and successful
              conversion of government prototypes into scaled programs. Burn rate, cash runway, and gross margin are
              undisclosed, so capital adequacy cannot be independently assessed; the $100M round (first close June 2025,
              led by Danu Venture Group and AMD Ventures) provides a buffer, but the company has signaled it is
              targeting cash-flow breakeven rather than declaring it achieved, and staged SBIR funding ties near-term
              revenue to milestone completion and appropriations timing, reducing predictability. A down round or
              delayed full close would pressure both balance sheet and morale. Model risk is distinct: the entire trust
              thesis rests on principle-alignment and scoring whose hallucination/bias-reduction efficacy is asserted
              from internal measurement, not independent evaluation; if a benchmark or a public failure undercut the
              claim, the premium would compress. Execution and people risk centers on a founder/leadership team
              (President Rob Clark and senior leaders) steering simultaneous defense scaling, commercial expansion,
              regulatory compliance, and a multi-vendor hardware roadmap — a wide aperture for a company of this size.
              Key-person concentration, hiring velocity, and the discipline to prioritize among defense, commercial, and
              platform bets are genuine execution risks. The financial and people registers, the mitigation table, and
              the kill-criteria below translate these into monitoring indicators and thesis-break triggers for an
              investor.
