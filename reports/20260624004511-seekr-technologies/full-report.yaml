          - type: paragraph
            body: >-
              Public comparables frame how aggressive Seekr's ~67x trailing multiple is. Palantir, the closest listed
              government-AI analog, trades around a 53.5x trailing price-to-sales ratio on a market capitalization near
              $280B, having ranged well above 60-100x at AI-cycle peaks per historical series — but it does so on
              multi-billion-dollar revenue, GAAP profitability and a proven federal moat. C3.ai, an enterprise-AI name
              with government exposure, trades far lower at roughly 6-9x sales, reflecting decelerating growth and
              persistent losses; it is the cautionary downside comparable for an unprofitable enterprise-AI platform. On
              the private side, Scale AI was marked at about $29B in 2025 following Meta's investment, and pure-play
              defense-AI private rounds generally clear in a 10-20x revenue band, with broad enterprise SaaS at 4-18x.
              Seekr's ~67x therefore prices it like peak-Palantir on a fraction of the revenue base and without the
              profitability or contract scale that justified Palantir's premium. The multiple is defensible only if
              investors underwrite Palantir-like trajectory: rapid program-of-record conversion, expanding gross margin,
              and a widening trust/explainability moat. Absent that, mean-reversion toward the 10-20x defense-AI band is
              the central valuation risk, and it is the single largest driver of the bear and base outcomes above.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV031
          - type: table
            tableRef: TV004
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV031
          - type: figure
            figureRef: FV002
            claimRefs:
              - CV003
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
      - number: '8.5'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Exit readiness is plausible but unproven. The most likely path is strategic M&A by a prime contractor,
              hyperscaler, or silicon partner seeking trusted-AI tooling and cleared customer relationships, with a
              public listing a secondary path contingent on reaching durable profitability and $100M+ revenue scale.
              Both paths reward the same milestones: programs of record, multi-year contract backlog, disclosed gross
              margin, and demonstrated retention across the 30+ customer base. The decisive diligence asks before
              committing capital are: audited financials and a GAAP revenue bridge reconciling the $18M company figure
              against the ~$22M tracker figure; a cohort-level customer and revenue-concentration breakdown (government
              vs. commercial, top-account share); the realized and contracted SBIR/Army contract values and
              transition-to-program-of-record status; gross-margin and burn-rate disclosure against the
              cash-flow-breakeven claim; the final round size, preference stack, and option-pool treatment behind the
              $1.2B post-money; and FTO/validity confirmation on the core patents. Thesis-break triggers that would void
              participation include a failed Project Linchpin transition, a material government-budget or ATO stall,
              loss of a top customer, or a down-round repricing below the entry. We would convert from Hold to
              participate only if these asks resolve favorably and downside structure is secured.
            claimRefs:
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
              - CV031
              - CV034
          - type: table
            tableRef: TV005
            claimRefs:
              - CV022
              - CV024
              - CV031
              - CV032
              - CV033
          - type: table
            tableRef: TV006
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
              - CV034
      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Participate only with downside structure
            body: >-
              At ~67x trailing revenue the entry prices in near-flawless execution. We would participate only via a
              senior liquidation preference, anti-dilution protection, pro-rata rights, and milestone-gated tranches —
              not at a flat common-equivalent entry.
            calloutType: recommendation
            claimRefs:
              - CV003
              - CV031
              - CV034
          - type: callout
            title: Multiple compression is the dominant return risk
            body: >-
              Public comps (Palantir ~54x on multi-$B revenue, C3.ai ~7x) and the 10-20x defense-AI private band imply
              mean-reversion risk. A normalization to even 20x revenue without offsetting growth would materially impair
              the entry.
            calloutType: risk
            claimRefs:
              - CV006
              - CV008
              - CV010
              - CV031
          - type: callout
            title: Genuine defense-AI demand and strategic alignment
            body: >-
              SBIR/Army selection (Project Linchpin), 30+ customers, 100k+ users, and AMD Ventures' strategic backing
              give the thesis a real, fundable core that distinguishes Seekr from generic enterprise-AI startups.
            calloutType: strength
            claimRefs:
              - CV013
              - CV014
              - CV023
          - type: callout
            title: Scenario ranges are directional, not modeled
            body: >-
              Bull/base/bear outcomes anchor on the $1.2B entry and comparable multiple bands as analyst estimates; they
              are not DCF outputs and depend on unverified margin and growth inputs that the diligence asks must
              confirm.
            calloutType: assumption
            claimRefs:
              - CV017
              - CV018
              - CV019
