            body: >-
              Seekr's revenue is built around the SeekrFlow platform - an all-in-one stack for building, validating, and
              deploying generative-AI models and agents - sold to enterprise and government customers, supplemented by
              government program contracts (notably U.S. Army SBIR work under award W5170125CA093) and the professional
