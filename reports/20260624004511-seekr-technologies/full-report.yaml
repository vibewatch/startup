      - number: '3.2'
        title: Capability, pricing, and go-to-market comparison
        blocks:
          - type: paragraph
            body: >-
              On capability, Seekr's distinctive claims are air-gapped/disconnected deployment, a proprietary
              trustworthiness score (SeekrScore), and built-in bias/hallucination mitigation packaged in one platform.
              Palantir matches the mission-AI and security depth but is far larger and pricier; hyperscalers match
              accreditation and scale but lean on third-party governance; pure-play governance vendors match trust
              tooling but lack a full build-deploy platform or air-gapped operation. No single competitor combines all
              of Seekr's attributes, but each dominates at least one axis Seekr also needs to win. On pricing, the field
              is opaque: Palantir and hyperscalers sell large multi-year enterprise/agency contracts, governance
              startups sell per-seat or usage SaaS, and Seekr's own pricing is undisclosed, making head-to-head ACV
              comparison impossible without a data room. On go-to-market and distribution, incumbents have a decisive
              edge - existing ATOs, marketplace listings, prime relationships, and cloud-marketplace billing - while
              Seekr relies on SBIR/OTA entry points, strategic-investor (AMD) reach, and integrator partnerships.
              Distribution power, not raw model quality, is the axis where Seekr is most structurally disadvantaged
