      - number: '1.2'
        title: Founders, leadership bench, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              Seekr was founded in 2021 by Pat Condo, who serves as Founder and Chief Executive Officer. Condo is a
              serial entrepreneur who, by the company's account, founded six search companies, two of which were
              NASDAQ-listed with exits exceeding one billion dollars, with prior applications spanning defense,
              intelligence, and telecommunications. That founder-market fit is central to Seekr's go-to-market in
              regulated sectors, but it also concentrates strategic, fundraising, and narrative dependence in a single
              person, which is the chapter's primary key-person risk. Condo remains the public face of the company,
              appearing on Fox Business in May 2026 to discuss the U.S.-China AI race.

              The executive bench is unusually deep for a company of this revenue scale and is weighted toward
              enterprise software and national-security pedigree. The team includes President Rob Clark (20+ years in AI
              and web-scale technologies), Chief Technology and AI Officer Stefanos Poulis, PhD (search, NLP,
              recommendation), COO Doug Dubiel (ex-Merrill Lynch, Rockefeller Capital Management), CFO Matt Jones
              (former CFO of NTENT), Chief People Officer Darcey Villasenor, Chief Revenue Officer Lloyd Cope (ex-
              Palantir, ex-Altana AI), and Chief Marketing Officer Colby Proffitt (named May 2026). Government-facing
              hires reinforce the defense thesis: SVP Government Derek Britton (ex-SAS, IBM, Raytheon; former Air Force
              intelligence officer) and, in February 2026, Colonel (Ret.) Joel Babbitt as VP, Army and SOCOM Programs.
              An AI Advisory Board of national-security and finance leaders — including retired Navy Vice Admiral Mat
              Winter (a general partner at lead investor Danu Venture Group) and Dr. Lisa Costa (former U.S. Space Force
              Chief Technology and Innovation Officer) — links the cap table, governance, and customer base.
