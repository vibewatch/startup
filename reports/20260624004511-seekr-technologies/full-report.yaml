              - CR003
              - CR009
              - CR023
              - CR026
              - CR031
      - number: '7.2'
        title: Regulatory, legal, and IP risk
        blocks:
          - type: paragraph
            body: >
              Regulatory exposure is two-sided. On the demand side, tightening AI regulation is a tailwind for a
              trust-and- explainability vendor; on the compliance side it is a cost and liability. The EU AI Act is the
              sharpest instrument: its risk-management, data-governance, transparency, human-oversight, and
              conformity-assessment obligations for high-risk systems and its general-purpose-AI documentation duties
              phase in through 2026, with fines up to €35M or 7% of worldwide turnover for prohibited practices and up
              to €15M or 3% for high-risk non-compliance. Any Seekr deployment touching EU persons or sold to EU-facing
              customers inherits these duties. In the U.S., there is no single AI statute; obligations flow through the
              NIST AI RMF, agency guidance, federal procurement rules, and executive action, which the Congressional
              Research Service has catalogued as an evolving, contractor-binding framework. For a government vendor,
              FedRAMP authorization and DoD ATO are gating legal-operational requirements, and Seekr does not publicly
              confirm their status. IP risk cuts both ways: Seekr's patent portfolio on principle-alignment and quality
              scoring is a defensive asset, but the broader LLM field carries active copyright and training-data
              litigation (e.g., high-profile suits tracked by legal press) whose outcomes could constrain data practices
              industry-wide. Patent enforceability, freedom-to-operate against larger players, and privacy obligations
              on customer data round out the legal surface. The regulatory/legal register table enumerates these with
              likelihood and residual exposure.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
