      - number: '3.3'
        title: Switching costs, lock-in, and moat durability
        blocks:
          - type: paragraph
            body: >-
              Seekr's defensibility rests on three claimed moats: accredited air-gapped deployment that hyperscalers
              cannot trivially match, patented trust/scoring technology, and embedded government workflows with high
              switching costs once a system is accredited and in production. Each is real but contestable. Air-gapped
              deployment is a genuine technical and compliance barrier, yet Microsoft, AWS, and Palantir all offer
              classified or disconnected options and have vastly more capital to close gaps. Patent-based
              differentiation is hard to assess without claims analysis and is weak protection in a field where
              capability is replicated quickly. Workflow lock-in favors whoever is already accredited and deployed -
              today that is more often the incumbent than Seekr. Multi-homing is common: buyers run several models and
              governance tools simultaneously, diluting any single vendor's lock-in. The most serious durability threats
              are foundation-model commoditization (open-weight models closing the quality gap and undercutting
              pricing), well-funded incumbents bundling governance for free, and fast-moving governance startups
              out-iterating Seekr on trust features. These adverse forces are catalogued in the risk register and
              treated as the central diligence question for this chapter.
