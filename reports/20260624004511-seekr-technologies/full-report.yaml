  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Who pays and uses SeekrFlow
        blocks:
          - type: paragraph
            body: >
              Seekr's customer base spans two clearly different motions. The first, and by far the most documented, is
              U.S. government and defense: SeekrFlow is described by the company and partners as "deployed across the
              U.S. Army, U.S. Navy, and other defense agencies," and is awardable through the Chief Digital and AI
              Office (CDAO) Tradewinds Solutions Marketplace. Within this segment the buyer is a federal contracting
              office (for example U.S. Army SBIR program offices and DEVCOM Aviation & Missile Center), the payer is the
              U.S. government, and the users are soldiers, analysts, and mission owners operating in intelligence,
              acquisition, operations, logistics, and cyber roles — frequently in air-gapped, disconnected, or
              tactical-edge settings. The second motion is commercial enterprise, where Seekr cites adoption across
              sectors such as telecom and supply chain and reports an aggregate of more than 30 customers and over
              100,000 end users; however, unlike the government wins, named commercial logos and case studies are
              largely absent from public materials. Geographically the disclosed footprint is U.S.-centric, consistent
              with the defense and sovereign-data positioning. Channel structure matters: the January 2026 strategic
              collaboration with General Dynamics Information Technology (GDIT) extends reach to federal civilian,
              state-and-local, and additional defense customers through GDIT's integration ecosystem, Digital
              Accelerators, and Centers of Excellence. The result is a customer base that is credible and
              mission-critical on the government side but thinly evidenced on the commercial side, a segmentation that
              shapes both the growth thesis and the concentration risk.
