      - number: '1.4'
        title: Cover metrics, scale signals, and disclosure limits
        blocks:
          - type: paragraph
            body: >-
              Seekr discloses enough to establish meaningful commercial traction but withholds the granular metrics
              needed to underwrite the business from public sources alone. The strongest public scale signals are 2024
              revenue of more than $18 million, more than 30 customers, and more than 100,000 end users, alongside a
              stated objective of approaching cash-flow breakeven. A third-party tracker (Latka) lists a higher figure
              of roughly $22M ARR, illustrating the kind of estimate dispersion that should be reconciled directly with
              management. Headcount is only loosely supported by public databases (low-to-mid hundreds), and no official
              current employee total was found, so headcount is treated as low-confidence here.

              The disclosure profile is best described as private-undisclosed on financial granularity but unusually
              transparent on identity, leadership, products, and milestones. Public cover metrics that are well
              supported include valuation ($1.2B), the $100M raise, customer count (30+), and end users (100,000+);
              cover metrics that remain gaps include audited revenue, gross margin, ARR, net revenue retention, exact
              headcount, and a clean total-raised figure. Trust and compliance posture is a relative strength: Seekr
              achieved SOC 2 Type II compliance in December 2025 and markets SeekrGuard as a route to compliance with
              the U.S. AI Action Plan. External validation arrived in May 2026 when Seekr was named to the CB Insights
              AI 100, selected from more than 40,000 companies. These are useful diligence breadcrumbs, but the
              underlying financial documents remain private and should be requested under NDA.
