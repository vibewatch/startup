  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              We assign a conditional Hold / selective-participate rating to Seekr Technologies at the June 2025
              first-close terms of a $100M round at a $1.2B post-money valuation, with confidence rated medium. The
              investment thesis rests on four pillars: a defensible position in trustworthy, explainable generative AI
              for regulated government and enterprise buyers; durable U.S. Army and intelligence-community demand
              evidenced by SBIR awards and Project Linchpin selection; a strategic AMD Ventures relationship that aligns
              Seekr with a merchant-silicon roadmap for air-gapped deployment; and reported 2024 revenue above $18M with
              a stated cash-flow-breakeven target inside twelve months. The anti-thesis is equally concrete. The entry
              multiple of roughly 67x trailing revenue is extreme relative to public defense/enterprise-AI names and
              leaves no room for execution error. Revenue is small in absolute terms, customer and contract
              concentration is high, and the platform competes against far better-capitalized incumbents (Palantir,
              Scale AI, Microsoft, AWS). A confirmed revenue conflict in third-party trackers, thin public
              unit-economics disclosure, and dependence on appropriations-sensitive government budgets all widen the
              band of plausible outcomes. On balance we would participate only with structural downside protection
              (preference, ratchet, or information rights) and milestone-gated tranches, not at a flat common-equivalent
              entry.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV013
