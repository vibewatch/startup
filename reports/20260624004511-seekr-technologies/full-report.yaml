      - number: '2.4'
        title: Growth drivers, adoption constraints, and sizing gaps
        blocks:
          - type: paragraph
            body: >-
              Demand tailwinds are real but uneven. The strongest structural driver is regulatory and trust pressure:
              NIST's AI Risk Management Framework and GAO oversight of federal AI push agencies toward auditable,
              low-hallucination, governable systems - exactly Seekr's positioning. Defense modernization budgets, the
              AMD/compute alignment from Seekr's strategic investors, and a growing premium on air-gapped deployment
              reinforce demand. Against these, adoption constraints are material: government procurement and ATO cycles
              routinely run six to eighteen months, foundation-model commoditization compresses differentiation as open
              models close the quality gap, and budget uncertainty - continuing resolutions and shifting appropriations
              - delays program starts. Switching costs cut both ways: they protect incumbents (hyperscaler government
              clouds) more than a venture-scale challenger. The biggest sizing gaps are the wide dispersion across
              publishers (base years, geography, and "GenAI" scope differ enough that totals are not directly
              comparable), the absence of an independent, audited government-GenAI-platform SAM, and the lack of
              disclosed Seekr unit economics to convert market share into revenue. These gaps are preserved as evidence
              gaps rather than papered over with a single point estimate.
