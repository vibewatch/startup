      - number: '8.2'
        title: Entry price, financing context and dilution discipline
        blocks:
          - type: paragraph
            body: >-
              The financing context is a $100M round announced June 18, 2025 at a $1.2B post-money valuation led by Danu
              Venture Group and AMD Ventures, with Guggenheim Securities advising, structured as a first close rather
              than a fully subscribed round. Against reported 2024 revenue of more than $18M, the implied trailing
              revenue multiple is approximately 67x; even on an optimistic forward ARR figure circulating in trackers
              (around $22M) the multiple remains above 50x. Third-party trackers place cumulative capital raised near
              $125M, implying the new round roughly doubles invested capital and concentrates a large preference stack
              ahead of common. Entry discipline therefore matters more than usual: at this multiple, the price embeds
              several years of >70% compound revenue growth with margin expansion, and any slippage forces a down-round
              or structure-heavy bridge. Prudent participation would seek a senior liquidation preference, anti-dilution
              protection, pro-rata rights to defend ownership through the cash-flow-breakeven inflection, and board or
              observer information rights to monitor burn against the stated breakeven timeline. Because this is a first
              close, later tranches may clear at different effective prices, so a diligent investor should confirm the
              final round size, the option-pool top-up, and whether the headline post-money is pre- or post-pool before
              underwriting ownership math.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV013
              - CV015
              - CV016
