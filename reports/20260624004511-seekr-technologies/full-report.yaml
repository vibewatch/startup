  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market definition, boundaries, and substitutes
        blocks:
          - type: paragraph
            body: >-
              Seekr's addressable market is best framed as the overlap of three spend pools rather than the headline
              "generative AI" total. The first is the enterprise generative-AI platform layer (build/validate/deploy
              tooling, retrieval, fine-tuning, and inference orchestration) that SeekrFlow sells into. The second is
              government and defense AI, where procurement runs through programs such as the Army's Project Linchpin and
              where air-gapped, ATO-ready deployment is a hard requirement. The third is the newer
              trustworthy/responsible-AI and AI-governance category - tooling for hallucination reduction, bias
              mitigation, and auditability - which Seekr's SeekrScore and SeekrGuard products target. Included spend is
              platform licenses, managed services, and compliance tooling sold to enterprises and agencies. Excluded
              from Seekr's serviceable boundary is raw foundation-model training capex, consumer chatbots, and pure
              GPU/cloud infrastructure, even though these often appear inside broad "GenAI market" totals. The dominant
              status-quo substitutes are hyperscaler government clouds (Azure Government, AWS GovCloud), incumbent
              integrators wrapping commercial LLMs, and simply doing nothing - keeping sensitive workflows off
              generative AI entirely because of trust and security concerns.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM030
              - CM031
