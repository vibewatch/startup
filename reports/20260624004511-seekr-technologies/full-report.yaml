      - number: '7.5'
        title: Mitigations, monitoring indicators, and kill criteria
        blocks:
          - type: paragraph
            body: >
              Seekr already runs meaningful mitigations against its top risks. Concentration is being addressed through
              the GDIT channel and Tradewinds awardability (broadening the reachable government base) and through stated
              commercial expansion, though the latter remains unproven. Regulatory risk is partly converted into product
              positioning — explainability and audit trails marketed as compliance infrastructure for the EU AI Act and
              NIST RMF — and into a patent moat around alignment methodology. Partner risk is diversified in principle
              by hardware-agnostic support for AMD, Intel, and NVIDIA and multi-cloud deployment, even if compute is
              tilted to AMD. Model risk is mitigated by the principle-alignment and scoring layers and by deployment
              controls (air-gapped, on-prem) that reduce data-exfiltration and third-party-API exposure. For an
              investor, the key monitoring indicators are: pace and dollar size of SBIR Phase III / production
              conversions; appearance of named, referenceable commercial customers; disclosure or third-party validation
              of hallucination/bias-reduction efficacy; confirmation of FedRAMP/ATO and SOC 2 status; the terms and
              timing of the full $100M close and any subsequent round; and net revenue retention once disclosed. The
              thesis-break (kill) triggers are concrete: a material defense budget/program cut or shutdown that freezes
              Seekr's Army pipeline; a credible independent benchmark showing no hallucination/bias advantage; loss of
              the AMD or GDIT relationship on adverse terms; a security or trust failure in a mission deployment; or a
              down round signaling eroded growth. The mitigation-and-kill-criteria table maps each top risk to its
              mitigation, monitoring metric, and break trigger; the priority diligence asks are the certification
              package, retention cohorts, an independent efficacy benchmark, and a contract-by-contract revenue and
