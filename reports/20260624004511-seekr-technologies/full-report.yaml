  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-ranked risk overview
        blocks:
          - type: paragraph
            body: >
              Seekr's risk profile is shaped by what makes it attractive: a defense-and-government-weighted,
              trust-centric AI platform at a $1.2B valuation on roughly $18M of 2024 revenue. The highest-severity risk
              is customer and revenue concentration in the U.S. defense sector, where demand is real and sticky but
              funding is governed by annual appropriations, continuing resolutions, Authorization-to-Operate (ATO)
              timelines, and SBIR phase transitions that can stall conversion from prototype to fielded program. Second
              is competitive and commoditization risk: hyperscalers (Microsoft Azure Government, AWS GovCloud, Google),
              defense-AI incumbents (Palantir), and rapidly improving open models compress the differentiation window
              and can pressure pricing. Third is regulatory and legal risk, most acutely the EU AI Act's high-risk and
              general-purpose-AI obligations phasing in through 2026 with penalties up to €35M or 7% of global turnover,
              alongside evolving U.S. AI policy anchored on the NIST AI Risk Management Framework. Fourth is partner and
              dependency risk spanning AMD compute, the GDIT channel, cloud infrastructure, and third-party base models.
              Fifth is financial and model risk: a high valuation multiple, undisclosed burn and runway, and an
              unproven, internally-measured hallucination/bias-reduction claim that anchors the product thesis. Because
              Seekr is private and discloses little on retention, margins, certifications, and benchmark efficacy,
              residual exposure on several of these is material rather than minor, and the investment implication is
              that diligence must convert privately-held facts into verified evidence before underwriting the trust and
              concentration narratives.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
          - type: figure
            figureRef: FR001
