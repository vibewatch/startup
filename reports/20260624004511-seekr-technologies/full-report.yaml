            body: >-
              Seekr discloses none of the canonical unit-economics metrics - gross margin, CAC, payback, net revenue
              retention, or average contract value - so every figure in this section is a proxy or an explicit gap. For
              an air-gapped, services-heavy government-AI platform, gross margins are typically below the 75-85%
              benchmark of pure SaaS because on-prem deployment, accreditation, and professional services carry real
              delivery cost; an estimate in the 50-70% band is reasonable but unverified. Inference and compute cost is
              a structural COGS driver, which is precisely why the AMD Ventures relationship (hardware optimization)
              matters to margins. On the operating side, the company's stated push toward cash-flow breakeven implies
              disciplined burn relative to its raise, but no monthly burn, headcount cost, or capex figure is public;
              reported headcount of roughly 110-130 gives a rough opex floor but not a verified cost structure. Working
              capital is also opaque - milestone-based government contracts can tie up receivables and lengthen the
              cash-conversion cycle. Without audited COGS and opex splits, the margin path is an assumption, not a
