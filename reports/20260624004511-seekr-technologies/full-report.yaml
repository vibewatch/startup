  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What SeekrFlow delivers and its module surface
        blocks:
          - type: paragraph
            body: >
              SeekrFlow is positioned as a complete AI development platform that lets organizations build, customize,
              and scale generative and agentic AI with visibility and control over how models learn, reason, and deliver
              results. In customer-workflow terms, a solutions architect or developer starts from a base open model (for
              example meta-llama/Llama-3.1-8B-Instruct), uploads proprietary data, generates aligned training pairs,
              fine-tunes or post-trains the model, deploys it as an endpoint, and then composes agents and tools on top
              of it — all through a unified UI or the seekrai Python SDK and REST API. The platform surface is organized
              around several core components documented publicly: Agents (configurable systems that reason and execute
              tasks), Fine-tuning (adapt models to specific domains), Deployments (launch and manage model endpoints),
              and Explainability (trace the sources and training data behind responses). Embeddings/vector databases,
              file ingestion, Data Jobs, and a tool framework round out the surface. The official enablement repository
              describes five standalone tool types — FileSearch, RunPython, WebSearch, AgentAsTool, and MCPConnector —
              that agents can be granted, with agent-as-tool enabling multi-agent orchestration. SeekrFlow also ships
              prebuilt solutions for enterprise and government use cases such as geospatial intelligence, threat
              analysis, procurement automation, and content moderation, each customizable with organization-specific
              data while preserving security and compliance requirements. This makes the product simultaneously a
              developer platform (API/SDK first) and a packaged-solution catalog, a dual posture that lets Seekr serve
              both hands-on engineering teams and mission owners who want turnkey capabilities.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
