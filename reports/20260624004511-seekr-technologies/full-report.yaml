      - number: '7.3'
        title: Operational, security, and partner/dependency risk
        blocks:
          - type: paragraph
            body: >
              Operationally, Seekr's product promise — trustworthy, low-hallucination AI in air-gapped and tactical-edge
              settings — is also its largest operational liability if it underperforms. A hallucination, bias, or
              security failure in a mission-critical defense deployment (for example missile-defense cyber or
              intelligence analytics) carries consequences far beyond a commercial SaaS outage, and the efficacy of the
              reduction is measured internally rather than by independent benchmark. Security posture for sovereign and
              classified workloads must be flawless, yet Seekr does not publicly enumerate completed certifications.
              Reliability is unproven publicly: no SLAs, uptime history, or third-party load benchmarks are disclosed.
              Talent is a structural operational risk — a small, specialized AI team competing for scarce alignment and
              federal-cleared engineers against far better-capitalized rivals. Partner and dependency risk is
              concentrated and strategic: compute is aligned to AMD (a strategic investor), which is a benefit but also
              a single-vendor tilt; go-to-market increasingly runs through GDIT and the CDAO Tradewinds Marketplace,
              creating channel dependence; cloud delivery leans on partners such as Oracle Cloud Infrastructure and
              other hyperscalers; and the models themselves are fine-tuned from third-party open base models (e.g.,
              Llama), whose licensing, availability, or capability shifts Seekr does not control. Each dependency is
              individually manageable but collectively they mean Seekr's roadmap, economics, and pipeline are exposed to
              decisions made by AMD, GDIT, cloud providers, and base-model labs. The operational and partner registers
              detail these with mitigation maturity.
