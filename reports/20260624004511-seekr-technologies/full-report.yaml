        title: Likely entrants and net competitive assessment
        blocks:
          - type: paragraph
            body: >-
              Beyond today's field, two entrant vectors could reshape the landscape by 2028. The first is
              foundation-model labs moving down the stack: Anthropic's Claude Gov and OpenAI's government offerings
              already target national security, and either could add deployment, governance, and air-gapped tooling that
              compresses Seekr's differentiation into a feature. The second is well-capitalized defense-tech challengers
              and primes building or acquiring trustworthy-AI capability, leveraging existing program access. Databricks
              and Snowflake, repeatedly named as the leading data-and-AI platform rivals for 2026, can extend into
              governed federal GenAI from a large installed base. Net, Seekr is genuinely differentiated on the narrow
              but valuable axis of accredited air-gapped trust, yet it is contested on every other axis - capital,
