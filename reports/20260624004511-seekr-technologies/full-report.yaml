              mix, but the customer profile (defense, intelligence, telecom, supply chain) and the SBIR/OTA contracts
              imply a revenue base weighted toward government and large regulated enterprises rather than self-serve
              SaaS. Pricing is undisclosed: platform licenses, contract vehicles, and services are all sold through
              negotiated enterprise/agency agreements, so there is no public list price, per-seat rate, or consumption
              tariff to anchor a model. Revenue recognition is therefore likely a blend of subscription/license ratable
              revenue and milestone- or deliverable-based contract revenue, the latter introducing lumpiness and the
              kind of percentage-of-completion recognition questions that require audited statements to resolve. The
