  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Competitive landscape: direct, incumbent, adjacent, and substitutes'
        blocks:
          - type: paragraph
            body: >-
              Seekr sits at the intersection of three competitive arenas, so its rivals do not form a single clean peer
              set. The first arena is government-grade AI platforms and integrators - Palantir's AIP, Scale AI's
              public-sector unit, C3.ai, and services-led primes like Booz Allen Hamilton - which already hold the
              agency relationships, accreditations, and program vehicles Seekr is pursuing. The second arena is
              hyperscaler government clouds: Microsoft Azure Government (with Azure OpenAI), AWS GovCloud and Bedrock,
              and Databricks' federal practice, which can bundle generative AI into existing, accredited infrastructure
              and represent the dominant status-quo substitute. The third arena is the trustworthy-AI and AI-governance
              field - Credo AI, Arthur, TrojAI, and the former Robust Intelligence (now Cisco) - whose hallucination
              control, monitoring, and guardrail products overlap with SeekrScore and SeekrGuard. Foundation-model
              vendors (Anthropic's Claude Gov, OpenAI for government, Cohere's private/secure deployments) are
              simultaneously suppliers, partners, and entrants. The most underrated competitor is the internal build:
              agencies and enterprises wiring open-weight models to retrieval themselves, bypassing a platform purchase
              entirely.
