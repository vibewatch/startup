      - number: '2.3'
        title: Buyer, user, and payer segmentation
        blocks:
          - type: paragraph
            body: >-
              The buyer landscape splits into four segments with distinct budget owners and adoption triggers. Defense
              and intelligence buyers (program offices, combatant commands) purchase through SBIR/OTA and
              program-of-record vehicles; the user is the warfighter or analyst, the payer is the program budget, and
              the adoption trigger is a validated mission capability that survives security accreditation. Federal
              civilian agencies buy through GSA/FedRAMP channels, with CIO/CDO budget ownership and modernization
              mandates as triggers. Regulated commercial enterprises - telecom, financial services, supply chain - buy
              through line-of-business and IT budgets, where the trigger is a compliance-grade GenAI use case that legal
              and risk teams will approve. General commercial enterprises represent the largest unit count but the
              lowest barrier-to-switch and the thinnest moat for Seekr, since hyperscalers and open models compete
              directly. Across segments the payer and the user frequently differ from the economic buyer, lengthening
              sales cycles. The practical adoption path runs awareness/RFI to pilot to security review and ATO to
              production to expansion, with the ATO/security gate being the dominant bottleneck that separates pilots
              from revenue.
            claimRefs:
              - CM014
              - CM015
              - CM016
              - CM017
              - CM018
              - CM030
              - CM034
          - type: table
            tableRef: TM003
            claimRefs:
