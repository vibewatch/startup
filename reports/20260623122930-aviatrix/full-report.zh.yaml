  - id: FP003
    title: Aviatrix 竞争护城河和就绪度 KPI
    type: kpi
    layout: standard
    summary: |
      基于现有证据，对 Aviatrix 竞争护城河维度做定性评估，并按三级尺度（强 / 中 / 弱）评级。
    data:
      items:
        - label: 云中立控制平面粘性
          value: Strong
          description: |
            多云拓扑一旦部署，切换成本高；竞争对手若要替换，必须提供迁移工具
        - label: 合作伙伴 NGFW 生态宽度
          value: Moderate
          description: |
            与 Palo Alto、Fortinet、Check Point 的集成是优势；若合作伙伴自建竞争性传输产品，则存在风险
        - label: 分销 / 渠道力量
          value: Weak
          description: |
            Cisco、Palo Alto、Fortinet 的存量客户关系更深，打包杠杆强于 Aviatrix
        - label: 多云宽度（AWS + Azure + GCP + OCI）
          value: Strong
          description: |
            在纯软件同业中支持的云足迹最宽；区别于 hyperscaler 原生替代方案
        - label: SASE 和 ZTNA 原生能力
          value: Weak
