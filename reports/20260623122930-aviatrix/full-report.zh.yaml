  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户画像与市场分层
        blocks:
          - type: paragraph
            body: >-
              Aviatrix 的买方画像集中在正在推进多云或混合云迁移的大型和中端市场企业。根据 PeerSpot 研究数据，大型企业群体约占评估 Aviatrix 的研究者 50%；金融服务公司占全部产品浏览量的
              16%，是最大的单一行业垂直。制造、外包、零售、建筑、医疗、通信和保险构成第二梯队垂直。公司瞄准的对象是需要管理两个或更多云服务商连接的组织中的云架构师、高级网络工程师、DevOps 负责人和安全团队。

              核心买方 persona 是负责多云基础设施的企业 IT 负责人，需要一个厂商中立控制平面，抽象 AWS、Azure、GCP 和 OCI
              的网络差异。用例横跨多云中转网络（基础入口点）、零信任网络分段、出口成本优化、基于 FQDN 的防火墙策略、M&A 基础设施整合、FAA/HIPAA/PCI-DSS 合规工作负载，以及 AI
              工作负载隔离。受监管行业——金融服务、医疗、航空和保险——在 Aviatrix 公开参考客户中占比更高，大概率是因为合规要求强力拉动厂商中立、可审计的网络层。

              Aviatrix 称其客户覆盖 Fortune 500 的 10%，该数字见于其金融服务解决方案页面。地域覆盖横跨北美、欧洲（丹麦 GN、德国 HAPEV、荷兰 Aegon、法国 Amundi）、亚太（Yara
              全球、IHG 全球）和中东——不过评论者指出 GCC 地区本地支持人员有限。ACE（Aviatrix Certified Engineer）认证项目起到管道建设作用，截至运行日期有 8,366
              名注册社区成员，形成一批实践者，在潜在企业客户内部推广平台。
