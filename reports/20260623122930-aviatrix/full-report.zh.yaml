      - number: '3.4'
        title: SASE、零信任与相邻安全玩家
        blocks:
          - type: paragraph
            body: >
              Gartner 推广的 SASE 类别，把 SD-WAN、云网络和 Security Service
              Edge（SSE）功能——firewall-as-a-service、CASB、DLP、SWG、ZTNA——汇聚成统一的云原生服务。Cato Networks 既是 SASE
              先行供应商，也直接描述了买方讨论的走向：身份驱动、云原生、全球分布，并覆盖每一个边缘。Cato Global Cloud Network 以托管服务提供优化全球路由，而不是部署式 overlay，因此直接竞争
              Alkira Global Backbone-as-a-Service 和 Aviatrix 多云传输。Cato 客户报告的结果包括「faster, more secure, happy users, happy
              team—all for less cost and more business value」，把 Cato SASE 套件定位为包括 Aviatrix 在内的点状方案整合替代。


              Netskope One Private Access 通过 Netskope One Platform 提供通用 ZTNA，把 SSE、SASE 和融合网关服务结合在 NewEdge 全球网络上。Zscaler
              Private Access（ZPA）称自己是全球部署最广的 ZTNA 方案，并把价值主张放在对比 VPN 和网络中心化方法上：91% 的组织担心 VPN 损害安全，56% 的组织在 2023–2024
              年遭遇一次或多次 VPN 相关攻击。ZPA 的论点是，把用户连接到应用而不是网络，可以降低横向移动风险；这在概念上与 Aviatrix 的网络中心架构相冲突。若买方接受 ZTNA
              框架，就可能降低多云网络层优先级，转向基于身份的访问，从而压缩 Aviatrix 的可触达范围。


              Illumio 位于与 Aviatrix 相邻的微分段和入侵 containment 空间。Illumio 被评为 2024 Forrester Wave 微分段 Leader，以及 2026 Gartner
              Customers' Choice for Network Security Microsegmentation（59 条评论，4.8/5）；其 AI security graph
              在混合和多云环境中按工作负载级别执行零信任分段，而不是在网络层执行。多数部署中两者互补，但在寻求供应商整合的组织里，会争夺同一条安全预算。


              Wiz 获得超过 50% Fortune 100 公司的信任，并通过 200+ 集成提供云和 AI 安全态势管理。Wiz
              位于可见性和风险优先级排序层（基础设施、模型、数据、运行时），不执行网络级流量策略，因此不是数据平面上的直接竞争对手。但 Wiz 和 Aviatrix 都卖给同一个云安全买方；在平台整合交易中，对 Wiz 广义
              CSPM 平台的投入，可能挤掉 Aviatrix 较窄多云网络层的预算。
