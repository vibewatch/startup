      - number: '8.5'
        title: 投资立场、尽调问题与论点破裂触发器
        blocks:
          - type: paragraph
            body: >
              对 Aviatrix 的投资立场是持有 / 观察——在接近 Series E 标记的任何价格上，都不适合作为新投资；即使在约 $411M
              水平做二级购买，也需要积累大量证据后才有吸引力。正向论点建立在真实的产品差异化之上：跨云的多云网络 / 安全能力、 庞大的可服务市场，以及早期客户基础较强（550+ 家企业）。反向论点集中在 $2B
              优先权压力、未确认财务、板块倍数压缩， 以及中期产品战略转向带来的执行风险。推荐逻辑来自五个因素：（1）市场 / 证明——云安全市场庞大且增长，Aviatrix 有可验证客户证明，但规模仍未确认；（2）产品 /
              护城河——多云原生架构有防御性，但正受到 PANW、Cisco 和超大云厂商 更强挑战；（3）财务——ARR 估算显示中等增长，但在财务透明度有限的情况下融资 $200M 是红旗；（4）风险——竞争、
              执行和优先权压力风险都高；（5）估值——$411M 的二级价格与基准情景一致，但不是折价，$2B 入场价无法辩护。最终尽调 问题应围绕确认 ARR（目标区间 $80–100M）、毛利率（SaaS 应为
              70%+）、净留存率（强 SaaS 应 >110%）、优先权堆栈细节、 董事会构成，以及任何 M&A 接触或战略进程。论点破裂触发器包括：ARR 低于 $60M（暗示增长反转）、超大云厂商功能侵入 已确认替代
              Aviatrix 核心用例，或按低于 $500M pre-money 的估值进行下轮融资。退出准备度低：Aviatrix 缺少近期 IPO 所需的 $150M+ ARR
              规模、上市可比公司的利润率，以及清晰的优先权分配瀑布。若增长延续且市场修复，2027–2028 年 IPO 窗口仍有可能，但需要多个有利条件同时成立。2026–2028 年期间，M&A
              仍是更可能的退出路径，除非规模大幅改善，否则估值 大概率在 $400M–$700M。
