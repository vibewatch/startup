  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 融资历史与当前估值背景
        blocks:
          - type: paragraph
            body: >
              Aviatrix 在 2015 至 2022 年间完成六轮已披露融资，合计约 $346M–$414M（不同来源口径不一）。标志性事件是 2021 年 9 月的 Series E：以 $2B post-money
              估值融资 $200M，由 TCV 共同领投（TCV General Partner Tim McAdam 加入董事会），Insight Partners 和 Tiger Global 参投，既有投资者
              CRV、General Catalyst 和 Greenspring Associates 跟投。当时，Aviatrix 称 ARR 为 $15.7M（Latka 口径，2021 年 4 月），隐含 Series
              E 入场倍数约 127x ARR——即使按 ZIRP 峰值标准也极端，除非 ARR 被显著低估，否则很难与任何前瞻增长模型对齐。Series E 之后 4.5
              年多没有宣布新一级股权融资。融资空窗具有歧义：可能说明资本效率和内部现金生成，也可能说明难以按可接受条款获得新资本，或是在有意等待更好的 IPO 条件。截至 2026 年 6 月 23 日，Forge
              pre-IPO 平台列出 Aviatrix（AVIA.PVT）没有当前「Last Matched Price」，说明二级市场流动性不足。Yahoo Finance 和 PM Insights 引用 Forge
              截至 2026 年 6 月 22 日的价格 $3.48/股。使用 Forge 报告的某一优先股类别流通股 11,806,794 股（相对完全摊薄股数大概率不完整），并与其他地方推导出的 $411M
              隐含估值交叉核对，估计完全摊薄股数约 118M 股。EquityZen 另报总融资 $414M 和 550+ 客户，Tracxn 和 Crunchbase 报 $346M
              及其他不同数字。这些差异反映私营公司数据聚合器的正常口径差异，并不表示融资记录存在重大出入。SEC Form D accession 0001792033-19-000002（2019 年 11 月）确认
              Aviatrix Systems, Inc. 是 Delaware corporation，营业地址为 2901 Tasman Drive, Suite 109, Santa Clara, CA 95054，并有
              $46M Series C 发行。截至 2026 年 6 月，SEC EDGAR 未出现 S-1 或类似 IPO 文件，确认 Aviatrix 仍为私营状态。
