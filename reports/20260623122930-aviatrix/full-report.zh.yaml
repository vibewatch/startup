            ZTNA 依赖合作伙伴集成；若买方整合到包含传输能力的单一 SASE 平台，Aviatrix 会受冲击
        - label: CoPilot 可观测性和运维流程锁定
          value: Moderate
          description: |
            运营仪表盘和排障流程制造流程层粘性；仍需持续拉开与云原生工具的差异
        - label: 相对 hyperscaler 原生方案的定价竞争力
          value: Weak
