            对已承诺云支出的买方，AWS TGW 和 Azure vWAN 的增量成本接近零；Aviatrix 必须在中等复杂度门槛上证明 TCO 合理
    approximationNotes: |
      所有评级都是基于产品文档、竞争定位和公开信号的定性判断。没有 win-rate、续费率或 NPS 数据可独立验证这些评估。实际护城河强度应对照 Aviatrix 的流失数据、竞争替换事件和客户扩张模式来检验。
