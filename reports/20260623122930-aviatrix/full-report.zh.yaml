      - number: '8.6'
        title: 附录
        blocks:
          - type: callout
            title: 财务不透明造成重大估值不确定性
            body: >
              Aviatrix 尚未公开披露 ARR、收入、毛利率或任何其他财务指标。本分析使用的所有数字均为第三方估算（Latka、Growjo、 Sacra）。最可靠估算（Latka 2024 年 10 月
              $64M）与最高估算（Growjo $135M）之间相差 2x——这一差距会让基准情景 企业价值移动 $425M–$675M。拿到一手财务披露之前，投资者必须把所有估值情景都视为置信区间很宽的估算。
            calloutType: risk
            claimRefs:
              - CV030
