      - number: '3.2'
        title: 扩展云能力的 incumbent
        blocks:
          - type: paragraph
            body: >
              Cisco Multicloud Defense 提供单一 SaaS 控制平面，跨公有云和私有云环境管理安全策略，从一个管理平面提供入站、出站和东西向流量检查。它直接重叠 Aviatrix Distributed
              Cloud Firewall 的价值主张——阻断入站攻击、横向移动和数据外泄。Cisco 的差异化来自底层云网络构造自动化和原生 Infrastructure-as-Code（IaC）集成，并把
              Multicloud Defense 打包进更广义的 Hybrid Mesh Firewall 叙事，覆盖园区、数据中心和云端执行，统一策略。Cisco 的 go-to-market 优势是 Secure
              Firewall 和 Meraki 的庞大既有客户群，能够交叉销售，不需要 Aviatrix 的绿地优势。


              Palo Alto Networks 采取平台整合路径，产品包括 Prisma Cloud（code-to-cloud 安全，每天分析 1 trillion 事件并检测 1.5 million 新攻击）和
              Prisma SASE（公司称其为「most comprehensive SASE」，覆盖多云架构上的用户、应用、数据和设备）。Palo Alto 的 Cortex 平台战略把网络安全、端点、云安全态势和 SOC
              能力聚合到一个供应商之下，使其成为企业账号中的强势 incumbent。对 Aviatrix 来说，风险在 Palo Alto 账号已经使用 Prisma SD-WAN 或 Prisma Access
              的场景最大，因为 Palo Alto 有动力把这些客户延展到多云网络，而不是允许 Aviatrix 这样的第三方落地。


              Fortinet 在全球网络防火墙排名第 1，全球市场份额超过 50%，背后有专利 ASIC 处理和 AI/ML 驱动的威胁情报（FortiGuard）支撑。FortiGate NGFW 内置 ZTNA
              能力并集成 SD-WAN，使 Fortinet 能提供端到端方案，与 Aviatrix-plus-NGFW 组合竞争。Fortinet 还支持量子安全密码（post-quantum IPsec
              VPN）并拥有量子安全路线图，这在政府和受监管行业账号中很重要。其分发优势——防火墙市场最大的装机基础——是 Aviatrix 在棕地企业环境竞争时必须纳入考量的结构性障碍。
