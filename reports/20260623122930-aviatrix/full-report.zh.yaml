      - number: '6.2'
        title: 采用轨迹与增长证据
        blocks:
          - type: paragraph
            body: >-
              Aviatrix 在网站和新闻材料中自报 500+ 企业客户；该数字至少自 2024 年中以来被持续引用，并在 2024 年 5 月「Building an Iconic Business」新闻稿和 2025 年
              Deloitte Technology Fast 500 公告中得到确认。未找到 2026 年精确客户数更新，因此 500+ 是最新公开数据点。Latka 的第三方估计显示，截至 2024 年 10 月，ARR
              约 $63.9M，较 2023 年 $35.3M 同比增长约 81%；这与客户基数以双位数速度扩张相一致。Aviatrix 连续四年（2022–2025）入选 Deloitte Technology Fast
              500，佐证持续收入增长，而不是单年跳升。

              Vendr 采购数据显示，年度合同价值（ACV）中位数约 $194,034，区间为 $153,513 至 $798,362，反映消费型模式下支出随网关数量和云资源使用扩张。月度标价按层级在 $2,500 至
              $15,000 之间。这些 ACV 指向中大型企业购买模式，符合 6 到 12 个月采购周期和多利益相关方签批。

              社区增长信号补充了收入轨迹。Aviatrix 社区（community.aviatrix.com）显示有 8,366 名注册成员、969 个主题和 1,355 条回复，ACE 认证仍在以可见节奏发放。公司将
              ACE 项目称为「行业领先的多云网络与安全认证」；它既是需求生成动作，也通过在客户工程团队内部积累深平台专长，成为留存抓手。Aviatrix 的 Azure Marketplace 上架和此前 AWS
              Marketplace 存在，借云服务商 committed-spend 项目扩展采购选择，降低云原生买方摩擦。
