      - number: '6.5'
        title: 留存、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              Aviatrix 未公开披露任何 NRR、GRR、流失、cohort 或合同续约指标。这是客户分析中最大的单一尽调缺口。没有 NRR 数据，就无法验证所报告的 500+ 客户数代表健康、持久的客户关系，还是新
              logo 增长掩盖了较高流失。81% 的 ARR 增长估计（Latka，2024）与高增长轨迹一致，但无法说明净留存与新 logo 构成。

              land-and-expand 模式有定性证据：Aegon 从基础 VPC 连接扩展到企业级分布式防火墙；IHG 从 AWS 延伸到 GCP，并增加 Equinix edge fabric；AB InBev
              持续发现新用例（「随着 AB InBev 团队探索更多 Aviatrix 能力，团队继续发现更多 use-cases」）。拥有 8,366 名社区成员的 ACE
              认证项目也构成留存护城河——已在平台上获得认证的工程师有实际切换成本。不过，所有扩张证据都来自公司发布的案例研究，多产品采用程度（例如 CNSF + DCF + HPE 组合采用）未经独立验证。

              客户集中度风险未知。公开参考客户基础由 Global 2000 账户主导；其中一个或数个账户是否贡献了不成比例的收入份额，公开数据无法判断。合作伙伴渠道（AWS Marketplace、Azure
              Marketplace、Equinix、WWT、Presidio）增加购买路径，但也引入了对云服务商 committed-spend 项目的依赖；这些项目可能在合同重新谈判中变化。地域集中于北美和欧洲，加上中东和
              APAC 现场覆盖有限，限制公司进入高增长云市场。
