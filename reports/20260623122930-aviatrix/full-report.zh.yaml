  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 直接竞争对手与云网络纯玩家
        blocks:
          - type: paragraph
            body: >
              在纯多云网络基础设施类别中，Alkira 是 Aviatrix 最接近的直接竞争对手。Alkira 将自己定位为 Network
              Infrastructure-as-a-Service（NIaaS）平台，用拖拽界面、集成 ZTNA 和嵌入式下一代防火墙能力，抽象 AWS、Azure、GCP 和 Oracle Cloud
              Infrastructure（OCI）之间的连接。其营销口径称，云搭建时间减少 96%，网络管理时间减少 47%，总体拥有成本较替代方案最多降低 40%。Alkira
              采用基于用量的定价，并提供承诺用量选项，计费依据包括网络元素大小、连接器、NGFW 实例和出站流量。其生态集成与 Aviatrix 相似：Cisco SD-WAN、Palo Alto
              Networks、Fortinet NGFW、F5、Splunk 和 ServiceNow。Alkira 引用的企业客户包括 Michaels（1,400 家门店）、Koch Industries 和
              SITA（航空）。与 Aviatrix 的功能重叠很大——两者都提供多云传输、单一视图可见性和伙伴 NGFW 嵌入——因此买方评估会集中在运营成熟度、生态深度和定价模型。


              Prosimo 是第二个直接 NIaaS 竞争对手，曾瞄准分布式云网络领域。由于 prosimo.io 域名无法访问，本次研究未能独立验证 Prosimo 的产品范围、当前融资状态和 go-to-market
              策略。这是重大证据缺口；应咨询独立分析师和渠道来源，判断 Prosimo 是否仍是活跃竞争者，或已转向、被收购、退出市场。PeerSpot 评论数据把 Aviatrix 与 Cisco ACI、Meraki
              SD-WAN 和 Megaport 放在一起比较，但没有在高频竞争比较中浮现 Prosimo，说明其企业心智有限，或评论网站采用数据存在缺口。


              Aviatrix 自身在 PeerSpot 评分为 8.0/10，在 Software Defined Networking 排名第 3，最常被拿来与 Cisco ACI 比较。其 PeerSpot
              用户群偏大型企业（50%），金融服务占 16%——这些高价值账号验证了企业可信度，但也正是 Palo Alto、Cisco 和 Fortinet 已经通过既有安全与网络关系深度渗透的买方细分。
