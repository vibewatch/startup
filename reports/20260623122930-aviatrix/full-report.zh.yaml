  - id: TV002
    title: 投资论点 / 反论点表
    columns:
      - 论点类型
      - 论点
      - 什么会改变判断
    rows:
      - - 投资论点
        - 云无关的多云网络 / 安全架构具备防御性：拥有 3 个以上云环境的企业需要厂商中立的控制平面，超大规模云厂商难以将其消解。
        - 超大规模云厂商以更低成本扩展原生跨云管理，并在功能上达到与 Aviatrix 相当的水平；或一家大型安全厂商收购该品类。
      - - 投资论点
        - Aviatrix 转向云网络安全，正好贴合企业安全支出增长最快的板块，可能扩大 TAM，并支撑更高倍数。
        - 转向停滞：ARR 增速降至 15% 以下，说明从网络到安全的迁移没有打动买方。
      - - 反论点
        - $2B 的 Series E 估值内含超高速 ARR 增长假设，但增长没有按预期兑现；清算优先权压力让普通股在任何现实的近期退出中几乎没有价值。
        - 新一轮 primary 以 $2B+ pre-money 融资，或经确认的 $200M+ ARR 且利润率强劲，才会迫使重新评估。
      - - 反论点
        - >-
          SaaS 板块倍数压缩——2026 年一季度 AI 生存风险叙事又放大了这一点——构成结构性逆风：即便 ARR 增长强劲，也难以恢复 ZIRP 时代倍数，而 Aviatrix 需要那些倍数来证明上一轮 primary
          标记价合理。
        - 板块重估（ZS/CRWD 倍数回到 15x+），叠加已验证的盈利能力和 ARR 规模，才会让 $2B 标记价在 5–7 年周期内有机会收回。
    notes: |
      所有投资论点 / 反论点均由公开可得的竞争、市场和财务数据综合得出。 ARR 数字为第三方估算。
