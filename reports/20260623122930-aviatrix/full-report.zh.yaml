      - number: '6.4'
        title: 评论站情绪与采用摩擦
        blocks:
          - type: paragraph
            body: >-
              独立评论平台呈现出中度正面、但清楚感知摩擦的图景。PeerSpot 基于九篇深度评论给 Aviatrix 8.0/10 的综合评分，大型企业买方（500+
              员工组织）占比更高。反复出现的称赞点包括多云服务商支持、集中化拓扑和可见性、VPN 高吞吐捆绑、CIDR 重叠解决，以及 Terraform 模块一致性。TrustRadius 的九篇评论给出较低的
              7.1/10；评论者特别提到缺少 VPN admin-down 控制、IPS 定制有限、告警泛滥和手工更新负担。

              定价是所有平台上最一致的摩擦点。多名 PeerSpot 评论者将 Aviatrix 描述为「相当昂贵的解决方案」，并指出支持与许可证强制捆绑（「不买支持就不能买产品」）。Vendr 数据也印证了这一点：$194K
              的 ACV 中位数让 Aviatrix 明显高于典型 SMB 和中端市场网络软件支出。消费型模式让快速扩张网关数量的客户面临预算不可预测性。

              上手复杂、学习曲线陡，是第二常见摩擦来源：评论者指出，不熟悉多云网络概念的用户需要专门培训后才能兑现价值。这与 ACE 项目作为正式前置能力建设路径的存在一致。至少一名位于 UAE 的 PeerSpot 评论者称
              GCC 区域支持不足，找不到本地 Aviatrix 员工提供面对面技术指导。2025 年 1 月，Aviatrix Controller 中的关键
              CVE（CVE-2024-50603）被攻击者在野外主动利用，部署加密货币矿工和后门——这给客户带来重大补丁负担，也在公司推动零信任营销时制造信誉风险。
