  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 战略与竞争风险
        blocks:
          - type: paragraph
            body: >
              Aviatrix 的主要战略风险，是 hyperscaler 将其核心中转网络用例商品化。AWS Cloud WAN 提供托管广域网服务，只需少量点击即可连接分支机构、数据中心和
              VPC，并提供集中化策略管理——与 Aviatrix 的中转网络价值主张直接重叠。Azure Virtual WAN 提供 full-mesh、hub-and-spoke
              托管架构，整合路由、加密、site-to-site VPN 和 ExpressRoute，并具备自动扩缩和内置 Azure Firewall 集成。Google Network Connectivity
              Center 增加了面向 AWS 和 Azure 的 Partner Cross-Cloud Interconnect，让组织可用 GCP 作为 WAN backbone——挤压 Aviatrix
              开创的多云网络利基。AWS Transit Gateway 和 Network Firewall 仍是单云 AWS 环境的基准竞争栈，具备免费层集成和原生扩展能力，Aviatrix
              必须在性价比论证上压过它。Cisco Multicloud Defense 和 Palo Alto Prisma Cloud 是云防火墙领域成熟的企业替代方案；Cisco 带着既有企业关系，Aviatrix
              较新的渠道项目必须替换这些关系。Wiz 平台在保持大型开发者生态的同时向检测与响应能力扩展，从 CNAPP 方向构成可信邻近威胁。CEO 主导的从网络到安全转型又增加一层战略风险：竞争版图扩展到 SASE
              厂商、CNAPP 玩家和零信任厂商，这些过去只与 Aviatrix 部分重叠。在转型完全落地前，公司可能卡在原有网络身份和拥挤安全市场之间。
