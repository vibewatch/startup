      - number: '1.4'
        title: 规模指标与市场存在感
        blocks:
          - type: paragraph
            body: >
              Aviatrix 公开称，截至 2025–2026 年，其全球企业客户超过 500 家，据称客户群包括约 10% 的 Fortune 500。公司客户页面可见的具名标杆包括 Anheuser-Busch
              InBev、IHG Hotels and Resorts、Republic Airways 和金融服务公司
              Better，覆盖金融服务、酒店、交通和制造业。公司瞄准管理多云基础设施的大型企业——主要是云安全团队、云架构师、网络工程团队和 FinOps 从业者——且集中在受监管行业。ACE 认证项目强化从业者黏性，也把
              Aviatrix 定位为多云网络教育标准。

              最近一次公开披露员工数是在 2023 年中 CEO 交接期间，约 350 人。抓取来源未给出 2024 或 2026 年更新员工数；公司在全球实行 remote-first 文化。截至 2026 年 6
              月，GitHub 组织 AviatrixSystems 维护 39+ 个公开仓库，包括活跃的 Terraform providers、ACE lab guides、Kubernetes firewall
              charts 和 Splunk 集成，显示其开发者和伙伴生态已有相当规模。收入、ARR、毛利率、NRR 和烧钱速度均未披露。Aviatrix 采用订阅软件模式并配套专业服务；具体定价为私有信息。下方
              Company Snapshot 流程图把身份、产品、客户、资本和生态依赖如何结构性连接可视化。
