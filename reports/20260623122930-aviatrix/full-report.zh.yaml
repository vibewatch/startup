            body: >
              Aviatrix 成为 Microsoft Agent Control Specification 的首批多云网络层执行基底之一；该开放标准发布于 Microsoft Build 2026。借此，Aviatrix
              把 CNSF 定位为 Microsoft 生态中 AI agent 治理的网络执行补充。如果 ACS 获得 Microsoft 预期的跨厂商采用，Aviatrix 将在执行基底市场握有先发优势。风险在于，ACS
