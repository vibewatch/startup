      - number: '2.5'
        title: 尽调缺口、矛盾估算与 SAM 不确定性
        blocks:
          - type: paragraph
            body: >-
              本章保留重大不确定性，而不是人为消解。最重要的缺口是：没有任何分析师来源给出 Aviatrix 特定「分布式云防火墙 + 多云网络」边界的 SAM 或 SOM。三个最近代理——云安全（2026 年 USD
              34–46 billion，取决于来源口径）、SASE（2026 年 USD 19.19 billion）和多云网络（到 2027 年 USD 7.6
              billion）——不可比较，覆盖不同支出类别，也没有一个能干净映射到 Aviatrix 的实际产品范围。MnM 2026 年云安全估算 USD 34.37 billion，与 GVR 2024 年基线 USD
              35.84 billion（按 GVR 13.3% CAGR 外推到 2026 年约 USD 46 billion）之间的口径差，意味着大致同一时期、同一标题类别出现超过 30%
              的差距。两家公司都未解释差异来源。第二个缺口涉及 Aviatrix 私有财务指标：没有披露 ARR、没有 2021 年后估值更新，也没有确认 2024–2026
              年员工数，因此无法用任何规模测算视角评估当前市场份额。公司 500+ 企业客户和 10% Fortune 500 渗透率确认了有意义的牵引力；但没有单客户收入，这些指标无法从宽口径 TAM 桥接到
              Aviatrix 的实际收入捕获。第三，多云网络市场估算（MnM 2022 年 9 月）早于 Aviatrix 2023–2026 年安全转向，可能低估了如今支撑 Aviatrix
              叙事的安全执行层。这些缺口必须作为开放尽调问题保留，不能靠假设解决。
