      - number: '8.3'
        title: 私募市场信号、ARR 框架与不确定性披露
        blocks:
          - type: paragraph
            body: >
              这项估值分析受两项结构性难题约束：（1）Aviatrix 不公开披露财务结果，所有 ARR 和收入数字都只能依赖第三方估算； （2）Aviatrix
              股份二级市场流动性不足，二级价格不能作为精确估值工具。解读任何情景区间时，这些限制都很重要， 必须放在最前面。当前最好的 ARR 锚点是 Latka 对 2024 年 10 月的 $63.9M 估算（此前
              2023 年 11 月为 $35.3M， 隐含约 81% 同比增长）。Growjo 的 $135M 算法估算很可能偏高。沿用 Latka 轨迹，并对 2026 年中采用更保守的 25–35% 增长率，估算 ARR
              为 $85–97M。Aviatrix 从多云网络转向云网络安全，这一战略转向又增加了不确定性： 产品打包变化后，ARR 确认模式可能变化。SaaS Capital Index（SCI）提供了重要市场背景。其
              2026 年 Q1 分析确认， AI 生存风险叙事主导市场情绪后，ARR 倍数跌至十余年来低位；ARRG 倍数（ARR 倍数除以增长率）仍高于此前低点， 说明一旦增长减速，估值还有进一步脆弱性。私营 SaaS
              公司通常较增长和规模相近的上市可比公司折价 20–35%， 反映流动性溢价、信息不对称和优先股压力。将该折价套用到 6–10x 的上市可比 EV/revenue 区间（同类画像同行）， Aviatrix
              的私募市场可比区间约为 4–8x ARR。Forge/Yahoo 二级价格（$3.48/股 → $411M）与基准情景大体一致， 但近期缺少撮合成交，说明流动性极端不足。对优先权堆栈较重的公司（Series E
              估值 $2B）而言，二级价格可能在结构上 误导：如果退出估值低于 $2B，带清算优先权的优先股股东可能拿走大部分企业价值，使二级市场中的普通股 / 次级优先股 处在结构性劣势。
