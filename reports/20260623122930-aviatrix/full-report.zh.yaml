      - number: '5.3'
        title: AI 安全与 2026 年路线图
        blocks:
          - type: paragraph
            body: >
              Aviatrix 于 2026 年 6 月以 early access 形式推出 AgentGuard，瞄准 AI agent 治理。产品采取网络原生路径：安全团队部署时不需要开发者安装 SDK
              或修改应用代码。Shadow AI Discovery 已在 early access 中立即可用，它会分析 VPC Flow Logs、DNS 日志和 Cloud Asset Inventory，在 15
              分钟内浮现云环境中的每个 AI agent、MCP server 和 LLM endpoint，包括应用团队未授权的 shadow agents。产品会按 blast radius 为每个发现的工作负载打风险分。

              AgentGuard 包含四项逐步推进的能力：（1）Shadow AI Discovery（现已 early access）；（2）Network Enforcement，今天可通过 Zero Trust for
              AI Workloads 使用；（3）Deep AI Observability（MCP 调用和工具流量检查）；（4）Advanced AI Guardrails——第 3 和第 4 项都在 2026 年 Q3
              路线图上。AgentGuard 覆盖包括 Strands、LangChain 和 AutoGen 在内的 AI agent 框架，并支持主要 LLM
              提供商（OpenAI、Anthropic、Bedrock、Vertex、Cohere、Mistral）。

              2026 年 6 月 4 日，Aviatrix 宣布成为 Microsoft Agent Control Specification（ACS）的首批多云网络层执行基底之一；ACS 是 Microsoft
              Build 2026 发布的开放标准。该集成通过 CI/CD，把一份 .guardrails.yaml 策略文件从 agent runtime 带入 AWS、Azure、GCP 和本地 Kubernetes
              上的实时网络执行。Aviatrix CPO Chris McHenry 指出：「在私有预览中运行 Microsoft Agent Control Specification
              之后，清楚的一点是，共享标准的强度，取决于能在 agent 运行的所有地方执行它的那一层。」该集成对现有 Aviatrix 客户不额外收费。

              2026 年 6 月 8 日，Aviatrix 作为联盟成员加入 OISF，推动 Suricata 面向云原生环境演进。自最初集成以来，Suricata 就嵌入 Aviatrix 平台，作为核心 IPS
              引擎——执行深度包检查、处理自定义规则集，并在 IPS + TLS Decrypt 模式下解密 TLS 流量。Aviatrix 已为 AI 特定威胁类别开发 556 条专用 Suricata 规则：提示注入和
              jailbreak 检测、敏感数据泄露、恶意工具使用、数据外泄，以及 agent-to-agent 威胁。Aviatrix 的 OISF
              会员身份会把这些规则和多云参考架构（AWS、Azure、GCP）回馈给开源社区。

              OWASP 2025 Top 10 for Agentic Applications 以及 LiteLLM 供应链攻击（2026 年 3 月，影响 1.82.7–1.82.8
              版本）从外部验证了网络层执行论点：在受信任进程内运行的被污染依赖，可以把凭据外泄到外部 endpoint，绕过任何 SDK guardrail。Deep AI Observability 和 Advanced
              AI Guardrails 仍是路线图项目，2026 年 Q3 时间线尚未验证。
