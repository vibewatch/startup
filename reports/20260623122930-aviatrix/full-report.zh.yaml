      - number: '1.3'
        title: 融资、估值与资本结构
        blocks:
          - type: paragraph
            body: >
              Aviatrix 最近且最大的一轮融资，是 2021 年 9 月完成的 $200 million Series E，由 TCV（Technology Crossover Ventures）领投，投后估值 $2
              billion，跻身独角兽。CRN 关于 2023 年 CEO 交接的报道明确确认 TCV 的领投角色。更早轮次至少包括 Series B 和 Series C；Ignition Partners
              参与了早期轮次，公司 About 页面展示了创立早期董事 Nick Sturiale（Ignition Managing Partner），也提供了旁证。分析师和媒体报道通常称累计融资约 $340
              million，但本次研究未能从一手来源独立确认该数字，因此作为证据缺口保留。

              截至 2026 年 6 月 23 日研究日期，2021 年 Series E 之后，公司未公开宣布新融资或 IPO。Aviatrix 仍为私营公司，没有公开财务披露。抓取时，TCV 的 Aviatrix
              投资人页面返回 404，TechCrunch 原始 Series E
              报道也无法访问，降低了独立佐证强度。任何更新估值——无论来自二级交易、下轮融资压力还是新融资——均未知。尽调必须独立取得资本表，确认投资人权利（包括清算优先权、按比例认购权和反稀释条款），识别任何债务融资，并判断
              2021 年至今是否发生二级交易。下方 Stakeholder/Investor Map 表列出已知经济相关方和未完成尽调问题。
