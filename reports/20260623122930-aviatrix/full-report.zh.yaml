      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >-
              2026 年，多重结构性力量正在加速云网络安全平台需求。多云采用在受访组织中已接近饱和：Flexera 2024 State of the Cloud Report 显示，89% 使用多云，高于上一年的
              87%；大型企业中 61% 明确使用多云安全工具。基于身份的攻击向量已成为主要云威胁驱动：Unit 42 2026 Global Incident Response Report（750+ 案例）发现，89%
              调查中身份弱点被利用，65% 初始访问由基于身份的技术推动，87% 攻击同时跨越多个表面。政府强制要求创造了合规驱动的需求底线：NIST SP 800-207 定义了权威的联邦 ZTA 框架，OMB
              M-22-09 要求所有美国联邦民用机构采用零信任架构。CISA Zero Trust Maturity Model Version 2.0 提供五支柱实施路线图。DevSecOps
              和云原生开发趋势要求把安全整合进应用生命周期，扩大云安全买方基础。AI 工作负载暴露论点引入新的需求向量：企业在多云环境中部署 AI agent 后，工作负载到工作负载治理成为新的执行表面，与 Aviatrix
              的 Agentguard 产品一致。采用约束同样显著。云预算审查很紧：管理云支出连续两年是首要挑战（Flexera），超过 29% 的组织每年公有云支出超过 USD 12 million。既有
              hyperscaler 原生工具和 incumbent SASE 平台的投资形成切换成本，是结构性障碍。Cisco
              强调，量子计算最终会让传统安全协议过时，需要迁移到后量子密码。GDPR、CCPA、HIPAA、SOX 和 FedRAMP 等监管复杂度，也给多云环境实施增加摩擦。
