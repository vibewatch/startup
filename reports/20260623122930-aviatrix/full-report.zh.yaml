      - number: '2.3'
        title: 买方、用户与付款方分层及采用路径
        blocks:
          - type: paragraph
            body: >-
              Aviatrix 的可触达买方群体，是运营多云基础设施并需要集中、可编程执行网络安全策略的企业。公开来源显示三类主要买方。第一类是跨两个或更多 hyperscaler 运营的大型企业（10,000+
              员工），主要在金融服务、医疗和政府领域——Grand View Research 将这些行业识别为云安全支出最高的垂直领域。大型企业贡献了 2024 年云安全市场收入的 74%
              以上（GVR）。在这些组织中，云安全团队和云架构师是 champion users，预算权通常落在 CISO、VP of Cloud Infrastructure 或 Chief Network
              Architect 层级。第二类是正在积极云迁移的中型市场组织，平台工程和 FinOps 团队负责工具评估；Flexera 发现，连续两年管理云支出都是头号挑战，且超过 29% 的组织每年公有云支出超过 USD
              12 million，这是该细分的交易摩擦信号。第三类是受 OMB M-22-09 推动、需在明确期限前采用零信任架构的美国联邦机构和受监管行业组织。2024 年 TechTarget Enterprise
              Strategy Group 报告中，超过三分之二受访组织表示正在实施零信任策略（IBM 引用 ESG 2024）。所有细分的采用路径相同：先开始多云部署，再出现策略碎片化痛点（IP 枯竭、Azure NAT
              gateway 变化），随后主动评估和概念验证，最后进入企业级部署并扩展使用场景。Aviatrix CMO 在 2025 年 2 月新闻稿中称，IP 枯竭、Azure NAT gateway
              策略变化和基础设施现代化是主要采用触发因素；这与公司报告的 500+ 企业客户基础和 10% Fortune 500 渗透率一致。
