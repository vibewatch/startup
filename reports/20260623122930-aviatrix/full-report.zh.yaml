  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 平台架构——云原生安全织网
        blocks:
          - type: paragraph
            body: >
              Aviatrix 将 Cloud Native Security Fabric（CNSF）定位为旗舰平台伞形架构，下设两条产品线：Zero Trust for Workloads（云工作负载运行时执行）和
              Zero Trust for Networking（跨云网络的加密连接）。两条线共享同一个控制平面——Aviatrix Controller；它对接 AWS、Azure、GCP 和 OCI 的云服务商
              API，自动盘点工作负载、分发策略并编排网关生命周期。CNSF 以无 agent 方式运行：不需要改 SDK、不需要内核模块，也不需要重写应用。Spoke gateways 作为软件实例部署在每个 VPC 或
              VNet 内，在第一跳执行内联 L4-L7 检查，消除集中式防火墙设备带来的发夹路由延迟。

              这套架构的核心组织原则是「Containment Architecture」，区别于「Chokepoint Security」。在 chokepoint 模型（传统 NGFW
              或中转防火墙）里，只有经过检查点的流量受管；东西向 VPC 流量、Kubernetes pod 出口流量和新部署的工作负载都可能绕过。在 Containment Architecture
              中，策略会在部署时自动传播到所有支持云上的每个工作负载，在工作负载边界执行一对一通信治理，而不是在共享出口点执行。Aviatrix CoPilot
              在这张分布式执行织网上提供统一的跨云可见性、监控和合规报告层。平台文档托管在 docs.aviatrix.com；截至 2026 年 6 月，生产版本为 9.0。
