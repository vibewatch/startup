      - number: '7.3'
        title: 领导力、治理与执行风险
        blocks:
          - type: paragraph
            body: >
              Aviatrix 在 2023 年 7 月经历 CEO 交接：创始人 Steve Mullaney——把公司从零做到 $2B 估值的人——将领导权交给 Splunk 前总裁兼 CEO Doug Merritt。在
              Splunk，Merritt 用六年时间把年度经常性收入从约 $100M 做到接近 $3B。战略能力有充分记录，但 Aviatrix 的转型结构上不同：Merritt
              是把公司重新定位到拥挤的安全市场，而不是扩张一个已经占优的分析平台。他离开 Splunk 发生在 2021 年 Silver Lake 进行 $1B
              私募股权投资之后；他此前也没有在直接竞争的安全品类中完成过有机增长轨迹。

              Aviatrix 在 2024–2025 年聘入多名高级领导者——CRO Ken Horner（前 Cloudflare，曾连续两年推动企业业务约 100% YoY 增长）、CMO Scott
              Leatherman，以及多名 VP——说明转型伴随显著领导层更替。2025 年 7 月 BankInfoSecurity 报告确认，Merritt
              专门以网络安全专长重建领导团队，也等于承认原团队并非最适合新的安全方向。新班底经验丰富，但 CRO、CMO 和多个职能 VP 同时更换，代表 GTM
              层执行风险升高，尤其是在新渠道伙伴项目也同步推出的情况下。关键人风险也集中在 Merritt 本人：公开信息未列出 Chief Operating Officer，如果他离任，运营连续性风险升高。
