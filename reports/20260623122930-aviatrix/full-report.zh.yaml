      - number: '5.5'
        title: 部署、集成与差异化
        blocks:
          - type: paragraph
            body: >
              CNSF 以软件定义 overlay 形式部署。Spoke gateways 作为云计算实例部署在客户自有 VPC 和 VNet 内（无硬件设备、无需重构网络架构）。Aviatrix Controller
              自动完成供应、隧道编排、策略执行和生命周期操作，包括集中化密钥管理。单一 Terraform provider（registry.terraform.io 上的
              AviatrixSystems/aviatrix）支持完整基础设施即代码集成，把网络和应用 CI/CD 流水线合在一起。平台可通过 AWS Marketplace 和 Azure Marketplace
              获取；Aviatrix Enterprise 在两处都提供 30 天免费试用。免费的 Workload Attack Path Assessment 工具无需部署即可提供 breach-chain
              可视化和风险发现。Peerspot 评论（2026）确认客户在多云企业环境中使用该产品。

              相比云原生控制（AWS Network Firewall、Azure Firewall、GCP VPC Firewall），核心差异化在策略一致性：原生工具按云、按区域、基于 IP
              工作，需要分别管理。Aviatrix CNSF 只定义一次策略，就能跨云执行，无需各云单独工具或手工协调。相比传统 chokepoint 防火墙（Palo Alto Networks Prisma、Cisco
              Multicloud Defense），Aviatrix 在工作负载边界执行，避开发夹路由。相比 Illumio（带 endpoint agent 的微分段），Aviatrix 无 agent
              运行，并延伸到网络和加密。相比 Zscaler（SASE/ZTNA，聚焦 user-to-app），Aviatrix 处理 ZTNA 架构不治理的 workload-to-workload 通信。

              最弱的差异化主张是 AgentGuard：产品尚未 GA，Advanced AI Guardrails 和 Deep AI Observability 仍是路线图项目，15 分钟发现声明和
              blast-radius 量化尚未被独立验证。Microsoft ACS 集成于 2026 年 6 月发布，也处于 early access，因此生产记录有限。HPE 的 100+ Gbps 和 1 Tbps+
              性能数字为公司声称，尚无独立基准验证。
