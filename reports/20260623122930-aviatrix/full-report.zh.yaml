      - number: '1.2'
        title: 领导层、创始人与治理
        blocks:
          - type: paragraph
            body: >
              Aviatrix 的创立故事围绕一位女性创业者展开，公司名称也嵌入了她的愿景。公司 About 页面明确称名称致敬「our female founder」，但抓取到的公开来源没有直接点名创始人。此前行业背景资料将
              Sherry Wei 列为联合创始人，与 About 页面叙事一致；但本次抓取来源未能独立验证，因此作为证据缺口保留。Steve Mullaney 曾任 Nicira CEO（2012 年被 VMware
              收购）和 Palo Alto Networks 高管，2019 年加入 Aviatrix 担任 CEO，距后续领导层交接早四年。Mullaney 将自己的领导甜区描述为 $1M–$100M 增长期，并承认
              Doug Merritt 的能力更适合 $100M–$1B 阶段，由此推动了一次有序 CEO 继任，2023 年 7 月 6 日生效。Mullaney 任内，公司完成 $2 billion 估值的 Series
              E 融资，并推出 Distributed Cloud Firewall 产品。

              Doug Merritt 于 2023 年 7 月出任 Aviatrix CEO 兼总裁；此前他担任 Splunk CEO 六年（2015–2021），期间 Splunk ARR 从约 $100 million
              增至接近 $3 billion。加入 Aviatrix 后，Merritt 大举补强高管层，从 Cloudflare（CRO Ken Horner）、Google（VP Engineering Murali
              Damisetti）、Cisco（Chief Network Architect Satish Mahadevan）、Walmart（Chief Architect Georgi Khomeriki）和
              SAP（CMO Scott Leatherman）招募了具备深厚网络安全和云背景的高管。2026 年 6 月 Microsoft ACS 公告确认，Chris McHenry 担任首席产品官。早期投资方
              Ignition Partners 的 Managing Partner Nick Sturiale 持有董事席位。对 Merritt 的关键人物依赖评估为高：他掌握战略愿景、GTM
              和产品路线图转型；若离任，将造成实质性领导断层。由于公司仍为私营，其他投资人的董事会构成和治理权利仍不透明。
