            title: 云规模下的无 agent Containment Architecture
            body: >
              CNSF 在每个工作负载上执行策略，不需要 agent、SDK 或应用改动。DCF SmartGroups 和内联 spoke gateway 执行，让安全团队能单方面控制工作负载通信治理——独立于开发者工作流或
              runtime trust。这在结构上优于面向 AI agents 的 SDK guardrails，也优于用于东西向治理、基于 IP 的云原生安全组。
