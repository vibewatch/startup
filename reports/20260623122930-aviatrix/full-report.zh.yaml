          - type: callout
            title: 持有 / 观察——接近 Series E 标记时不可操作
            body: >
              按 $2B Series E 估值，Aviatrix 需要在当前市场倍数下达到 $250–333M ARR——约为第三方估算当前 ARR 的 3–5x。 低于 $500M
              的二级购买在基准情景下更能辩护，但需要满足：（1）确认 ARR ≥ $80M，（2）NRR > 110%，（3）明确退出催化剂 （IPO 或
              M&A），以及（4）完成优先权堆栈的股权结构尽调。在这些条件满足前，立场应为持有 / 观察。
            calloutType: recommendation
