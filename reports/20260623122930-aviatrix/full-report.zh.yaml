  - id: TM001
    title: 市场定义表
    type: data
    summary: >-
      Included and excluded spend for Aviatrix's market boundary, with relevant buyer and payer groups. Coverage is
      partial because a single agreed definition for cloud network security enforcement does not exist in the analyst
      literature.
    columns:
      - 细分 / 品类
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 贴合度
    rows:
      - - 云网络安全执行
        - 分布式云防火墙、工作负载到工作负载策略、网络分段、东西向流量执行、Kubernetes 网络策略
        - 终端安全、SIEM、SaaS 邮件安全、单云原生控制的孤立使用
        - 云安全团队、云架构师、CISO；IT 安全或云基础设施预算
        - Aviatrix CNSF 和 Distributed Cloud Firewall 的核心产品层
      - - 多云网络基础设施
        - 云中转网关、云路由、面向云的 SD-WAN、多云连接编排、可视化工具
        - 物理 WAN/LAN 设备、本地交换 / 路由
        - 云架构师、网络工程师；基础设施平台预算
        - 与 Aviatrix 网络基因一致的核心基础设施层
      - - 零信任网络访问（ZTNA）
        - 应用层访问执行、基于身份的东西向 / 南北向访问、面向工作负载的 ZTNA 覆盖层
        - 纯 IdP/SSO 软件、孤立终端 agent、与网络执行无关的身份管理
        - CISO、网络安全团队；安全预算
        - 相邻安全层；属于 SASE/SSE 支出的一部分，并与 Aviatrix 姿态部分重叠
      - - SASE / 安全访问服务边缘
        - SD-WAN 加 SSE 融合层、FWaaS、CASB、SWG，即网络与安全融合处
        - 纯邮件安全、纯终端 DLP、非网络安全支出
        - CISO、网络、云团队；融合网络与安全预算
        - Aviatrix 争夺融合平台预算时所处的更大品类
      - - 云原生应用安全（相邻）
        - 当策略表面与网络执行重叠时的 CNAPP、CWPP、CSPM
        - SAST、DAST、代码扫描、代码仓库、非网络层
        - DevSecOps、云安全；工程安全预算
        - Aviatrix CNSF 与云工作负载安全平台相交的相邻领域
    notes: >-
      不同分析机构的边界定义不同；MnM 和 GVR 在云安全下纳入的子品类不同，导致规模章节提到同一预测期存在 30%+ 范围差异。现状替代品 （超大云厂商原生工具、SASE
      既有厂商）不纳入已纳入支出，因为它们代表买方替代方案，而不是 Aviatrix 正在捕获的支出。
