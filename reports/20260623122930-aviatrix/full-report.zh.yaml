      - CE008
      - CE013
      - CE019
      - CE023
      - CE029
      - CE034
  - id: TE003
    title: 技术与架构组件
    columns:
      - 层级 / 组件
      - 作用
      - 技术
      - 关键依赖
      - 风险
    rows:
      - - Aviatrix Controller
        - 中央策略引擎；集成云 API；编排路由；管理密钥
        - SaaS 控制平面（基于 Python）
        - 云厂商 API（AWS、Azure、GCP、OCI）；计算资源可用性
        - 单一编排点；CVE-2024-50603 暴露未认证 RCE 风险；必须配置 HA
      - - Spoke Gateway
        - 在每个 VPC/VNet 内联执行策略；第一跳检查 L4-L7 流量
        - 运行在云计算资源上的软件实例（EC2、Azure VM、GCE）
        - 云计算预算；VPC 路由表
        - 性能取决于 VM 实例类型；成本随流量规模上升
      - - SmartGroups
        - 按身份给工作负载分组并套用策略；横跨多云
        - Cloud Asset Inventory 元数据 + 云标签
        - 云厂商标签治理质量
        - 陈旧或配置错误的标签可能导致策略错配
      - - Suricata IPS Engine
        - 内联深度包检测；匹配 AI 威胁规则；TLS 解密
        - 开源 Suricata（OISF 联盟成员）；556 条 AI 专用自定义规则
        - OISF 开源社区维护；TLS 解密会增加延迟
        - 规则更新周期跟随平台发布；IPS + TLS Decrypt 模式的性能影响未做基准测试
      - - 高性能加密（HPE）引擎
        - 面向东西向、南北向、跨云流量的软件定义加密
        - 在云 CPU 上跑专利多隧道 ECMP；无硬件卸载
        - 云计算 CPU 容量
        - CPU 成本随加密吞吐量上升；PQC 尚未部署（crypto-agility 路线图）
      - - CoPilot Analytics
        - 可见性、监控、合规遥测、策略可视化
        - 由 Controller 供数的 SaaS 分析层
        - Controller 数据管道；遥测交付延迟
        - 单一监控平面；高流量环境可能滞后
      - - Terraform Provider
        - 用基础设施即代码自动化网关和策略生命周期
        - registry.terraform.io 上的 AviatrixSystems/aviatrix provider
        - Terraform 版本兼容性；Aviatrix API 稳定性
        - API 变更可能打断 IaC 管道；需要严格管理 provider 版本
      - - AgentGuard Discovery (Shadow AI)
        - 借助网络遥测盘点影子 AI agent；不需要网关
        - VPC Flow Logs + DNS logs + Cloud Asset Inventory 分析
        - 云厂商日志启用状态（必须开启 VPC Flow Logs）
        - 必须显式启用 Flow Logs 和 DNS logs；非标准端口出站可能抓不到
    notes: >-
      技术细节来自 aviatrix.ai 产品页和 docs.aviatrix.com。CVE 历史来自 NVD 和 The Hacker News。 Terraform provider 来自
      registry.terraform.io。
