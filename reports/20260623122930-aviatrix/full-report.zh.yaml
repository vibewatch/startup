  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Aviatrix
              竞争在多云网络基础设施和云原生安全执行的交叉地带，这个类别无法干净落到任何单一分析师定义上。纳入支出包括多云和混合云环境中的工作负载到工作负载流量执行（东西向和南北向流量）、分布式云防火墙策略管理、多云网络可见性和分析、面向用户到应用以及工作负载到工作负载流量的零信任网络访问（ZTNA）、包含传输网关和路由管理的云网络运营工具，以及
              Kubernetes 网络安全策略执行。排除支出包括端点检测与响应（EDR）、邮件安全网关、SIEM/SOAR 平台、孤立使用且没有跨云策略的单云原生控制（AWS Security Groups、Azure
              NSGs）、物理网络设备，以及与网络执行无关的数据丢失防护工具。现状替代方案包括 hyperscaler 的云原生网络和防火墙服务（AWS Network Firewall、Azure
              Firewall、Google Cloud Firewall）、向云延伸的传统网络安全厂商（Palo Alto Prisma、Cisco Multicloud Defense）、具备竞争性云网络能力的 SASE
              平台（Zscaler、Netskope、Cloudflare One），以及基于开源传输或路由工具自建的内部多云网络。该市场处在云安全与更广义企业网络安全的结构性汇合处：MarketsandMarkets 估算
              2026 年云安全为 USD 34.37 billion，Grand View Research 估算 2024 年为 USD 35.84 billion；MarketsandMarkets
              预计更广义企业网络安全 2025 年达到 USD 84.50 billion。任何规模测算前必须先精确定义边界：Aviatrix 的价值主张跨越两个类别，但并不能捕获任一类别的全部支出。
