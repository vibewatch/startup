      - number: '7.5'
        title: 监管、法律与合规风险
        blocks:
          - type: paragraph
            body: >
              Aviatrix 面对的监管环境越来越严，主要来自三条线。第一，CISA Known Exploited Vulnerabilities 目录将 CVE-2024-50603 纳入联邦补丁强制清单，要求 FCEB
              机构在 2025 年 2 月 6 日前修复——如果受支持版本客户未及时打补丁，Aviatrix 可能失去联邦企业关系。第二，Aviatrix 在受监管垂直（金融服务、政府、医疗）的客户越来越要求符合 NIST
              SP 800-207 Zero Trust Architecture、政府云部署取得 FedRAMP 授权，以及欧洲运营符合 EU GDPR/NIS2。Aviatrix trust center 声称 SOC 2
              合规，但未公开审计范围或 Type II attestation report，留下企业采购团队必须通过直接询问弥合的透明度缺口。第三，CSA Cloud Controls Matrix
              定义了云服务商必须向企业客户证明的安全要求——Aviatrix 的竞争位置取决于持续对齐演进中的 CCM 版本。截至 2026 年 6 月，未识别出针对 Aviatrix 的已知监管执法、IP 诉讼或集体诉讼；但
              CVE 利用活动制造了潜在责任风险，如果客户能证明延迟披露或补丁通知不足造成损失。Aviatrix 的 SEC Form D（2019）显示其在 Delaware 注册、总部位于 CA Santa
              Clara——这对风投支持公司很标准——但 $200M Series E 后没有任何公开提交的后续融资文件，限制了监管和投资者透明度。
