      - number: '3.5'
        title: 护城河耐久度、切换成本与竞争风险
        blocks:
          - type: paragraph
            body: >
              Aviatrix 的主要竞争护城河，是深嵌客户云网络拓扑的云中立、服务商无关控制平面。一旦企业通过 Aviatrix controller，在 AWS、Azure 和 GCP 上部署 Aviatrix
              transit gateway fabric，并配置 route tables、security domains、firewall associations 和 BGP
              peering，切换成本就很高。迁移多云网络拓扑需要在 VPCs、VNets、防火墙规则、路由表和运营 runbooks 之间协调重配。Aviatrix CoPilot
              的可见性和故障排查能力进一步强化黏性；它们嵌入网络运营流程，形成流程级锁定。


              但护城河有明显破口。第一，绿地账号——刚开始多云旅程的企业——可能从一开始就采用 Alkira 或 hyperscaler 原生路径，完全绕开 Aviatrix。Alkira 拖拽界面和 NIaaS
              定价，让还没有建立 Aviatrix 运营熟悉度的组织觉得它更适合作为首选。第二，Cisco 和 Palo Alto 拥有 Aviatrix 缺乏的既有安全与网络合同分发力；这些 incumbent
              可以把多云网络能力作为更广平台续约的增量功能提供，而不是要求新采购。第三，SASE 把网络安全重新框定为用户访问问题（零信任、身份优先）而不是路由问题，可能降低安全优先买方对专用多云网络层的感知价值。


              Multi-homing 不常见，但并非不可能：一些企业同时部署 Aviatrix（用于东西向执行）和 SASE 方案（用于用户到应用访问），形成并行架构，增加整体 IT 复杂度。这可能对 Aviatrix
              有利（它能与 SASE 共存），也可能不利（买方最终寻求整合）。商品化风险在低端最尖锐：多云复杂度有限的企业可能认为 AWS TGW 加原生防火墙，或 Azure vWAN 加 Azure Firewall
              已经「足够好」，无需第三方 overlay。Aviatrix 的 partner-NGFW 集成模式——把 Palo Alto、Fortinet 或 Check Point 防火墙嵌入 transit
              fabric——也制造了共同依赖：若某个伙伴 NGFW 厂商构建自己的原生多云传输能力，取代 Aviatrix 编排层，集成就会从护城河变成竞争入口。
