      - number: '3.3'
        title: Hyperscaler 原生替代与现状选项
        blocks:
          - type: paragraph
            body: >
              Aviatrix 最直接的现状替代方案，是各云服务商自己的原生网络栈：AWS Transit Gateway 用于 VPC 互联，AWS Network Firewall 用于边界执行，Azure Virtual
              WAN 用于全球 hub-and-spoke，Azure Firewall 用于策略执行，Google Cloud 的 hierarchical firewall policies 搭配 Cloud Next
              Generation Firewall（Cloud
              NGFW）。每个方案都深度集成对应服务商的身份、日志和计费基础设施，并以边际成本定价或打包在既有云承诺支出协议内——对已经在单一云上规模化运营的组织来说，增量成本近乎为零。


              Hyperscaler 原生方案的结构性限制是单云范围。AWS Transit Gateway 可以连接跨 AWS 区域的数千个 VPC，但无法原生管理 Azure VNets 或 GCP VPCs。Azure
              Virtual WAN 同样在 Microsoft 生态内运作。GCP Cloud NGFW 在 VPC
              层执行策略，但没有跨云控制平面。对只在单一云服务商上运营，或主要在单一云上运营的组织，这一限制可能可以接受，Aviatrix
              的价值主张在这类场景最弱。但对运行两个或更多云的组织——也就是大多数大型企业——管理分散原生栈的运营复杂度，正是 Aviatrix（和 Alkira）解决的问题。


              内部自建或手工配置的现状——把原生 TGW、VPC peering、BGP routing 和原生 firewall rules 拼接起来——是大多数企业的起点，随着云足迹扩大又逐步放弃。Aviatrix
              的客户获取模式历史上沿着这条曲线展开：企业长出原生网络复杂度后转为买方。风险在于，hyperscaler 持续改进跨账号、跨区域管理，最终从下方吸收多云 overlay 用例。AWS inter-region
              peering 和 GCP hierarchical policies 是近期能力，正在抬高第三方工具变得必要的门槛。
