      - number: '8.2'
        title: 上市可比公司组与市场倍数分析
        blocks:
          - type: paragraph
            body: >
              Aviatrix 站在云网络与网络安全的交叉点，可比公司横跨几类：纯云安全厂商（Zscaler、CrowdStrike）、 综合网络安全平台（Palo Alto
              Networks、Fortinet），以及贴近基础设施的网络 / 身份厂商（Cloudflare、Okta）。 截至 2026 年 6 月，公开可观察的 EV/revenue
              倍数跨度很大，反映出增长曲线和市场叙事的分化。Zscaler（ZS） 是最直接的功能类比标的，作为云原生安全厂商，其交易价格约为过去十二个月收入的 6.6x——较 2025 年 10 月 P/S 峰值 18.2x
              大幅压缩（据 Macrotrends 历史数据）。Zscaler 市值同比约下跌 55%，主要受增长预期放缓和 AI 颠覆担忧拖累。其 FY2025 10-K（SEC 申报，2025 年 9 月）确认收入
              $2,673M（增长 23.3%），且仍录得 $41.5M 净亏损。Palo Alto Networks（PANW）凭平台整合溢价和 $3.5B+ 的强 ARR，享有 22.4x 倍数。
              CrowdStrike（CRWD，34.5x）和 Cloudflare（NET，34.9x）因更高增长率（21-32%）享有高倍数。Fortinet （FTNT，15.3x）受益于多元化的硬件 -
              软件模式和正收益。Okta（OKTA，6.9x）因增长较慢和身份市场饱和而折价。 Aviatrix 是一家中等规模私营公司，ARR 增长不确定、财务披露不完整，适用估值区间应集中在 5–10x：该区间混合
              了增长较慢的可比公司（ZS、OKTA、FTNT），并相对可比上市同行计入 20–35% 的私企折价。Damodaran 2025 年 1 月数据集显示，EBITDA 为正的软件公司 EV/Sales 中位数为
              9.01x，互联网软件公司为 9.56x，与该区间一致。 DealMatrix 将 Privacy and Security 板块的 EV/Sales 中位数定在约 7.3x。
