        - 经确认 ARR 低于 $60M，或同比增长低于 10%
        - 摧毁基准情景；迫使倍数压缩到 3x 或以下；企业价值降至 $210M 或更低
        - 触发战略复盘；标记 M&A 贱卖风险或 down round primary 风险。
      - - 被超大规模云厂商替代
        - AWS、Azure 或 GCP 推出原生多云网络功能集，取代 Aviatrix 的网关架构
        - TAM 被侵蚀；竞争护城河变弱；NRR 收缩；估值落入熊市情景或更低
        - 退出二级市场头寸；监测三大超大规模云厂商的季度产品公告。
      - - Down-Round Primary 融资
        - 新股权轮 pre-money 估值低于 $500M
        - 确认内部人对价值的评估低于 Series E；意味着清算优先权结构很可能重组
        - 立即重新评估；down round 表明困境或重大价值毁损。
      - - SaaS 板块重估逆转
        - ZS 和同业 EV/Revenue 中位数从今天的 6.6x 降至 4x 以下
        - 将 Aviatrix 基准情景压到 $340M 以下；届时 <$500M 的 M&A 将成为唯一流动性路径
        - 用板块指数 put 对冲，或降低后期私有 SaaS 暴露。
      - - 管理团队离任
        - CEO Steve Mullaney 或 CTO 离任且没有战略继任计划
        - 安全转向执行风险上升；客户信心承压；竞争威胁加速
        - 作出任何投资决定前，要求管理层交代过渡安排。
    notes: 阈值为示例，获得一手来源确认的 ARR 数据后，应重新校准。
    claimRefs:
      - CV032
      - CV033
      - CV034
      - CV038
      - CV043
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 经确认 ARR 与增长率
        - Aviatrix 未公开披露 ARR、收入或增长率；只有第三方估算（$64–135M 区间）可用。
        - ARR 是最重要的估值驱动因素；ARR 少 $30M，会让基准情景企业价值下移 $150–210M。
        - 在正式尽调流程中由管理层披露；要求提供经审计年度财务报表，或管理层编制的财务报表。
      - - 毛利率与成本结构
        - 没有公开数据说明毛利率、OpEx 拆分或盈利路径。
        - 毛利率低于 65% 会使 SaaS 溢价倍数失效；盈利时间表影响后续稀释需求。
        - 要求提供利润表数据：收入成本、R&D、S&M、G&A，以及任何经营利润指标。
      - - 净收入留存率（NRR）
        - 未披露 NRR；客户扩张或流失模式未知。
        - NRR > 120% 支撑高倍数情景；NRR < 100% 提示收缩风险。
        - 要求按 cohort / vintage 提供分析或 ARR bridge（新增 ARR、扩张、流失）。
      - - 股权结构与清算优先权瀑布
        - Series A–E 的清算优先权结构未公开披露；优先权倍数和参与权未知。
        - 任何低于 $2B 的退出中，清算优先权压力决定普通股价值；对二级买方至关重要。
        - 要求提供带优先权条款、反稀释条款和董事会观察员权利的 cap table。
      - - IPO 或战略进程状态
        - 截至 2026 年 6 月，没有 S-1、IPO 路演或经确认的 M&A 进程；退出时间完全不透明。
        - 没有退出催化剂，流动性折价会很重；二级投资人面临无限期持有。
        - 直接询问管理层；监测 SEC EDGAR 是否出现 S-1、Form 8-A 或投行聘用公告。
    notes: 尽调问题源于 Aviatrix 作为私人公司没有任何公开财务披露。形成任何高确信度投资建议前，上述项目都必须补齐。
