            body: >-
              截至运行日期，Aviatrix 在官网发布至少 14 个具名案例研究，覆盖广泛行业、地域和用例。所有被引用部署都描述为生产环境，而非试点。证据质量中等：部分客户给出量化结果（Republic Airways 将
              MTTR 从数天降至不到一小时；Aegon 将隧道搭建从数小时降至数秒；HAPEV 通过 IaC 在不到一小时内部署新工作负载），许多其他案例只给出定性结果。所有案例都列名并引用客户高管，参考质量高于只有
              logo 的主张。

              案例研究由 Aviatrix 发布，带有公司控制的叙事框架；未找到第三方独立审计结果。PeerSpot 和 TrustRadius 的评论站数据通过不受控的企业用户评论提供一些佐证，其中 PeerSpot
              在大型企业用户中形成 8.0/10 的共识。识别出的最新案例研究（Across AI，一家 agentic AI 初创公司）发布于 2026 年，主题是 AI
              工作负载安全——这一新鲜度信号与公司转向「Containment Era」和 AI 安全用例的战略相一致。

              具名客户集偏向 Global 2000 和 Fortune 500 组织：AB InBev 是全球最大啤酒商，80% 基础设施在云上；IHG 在 100+ 国家运营 6,000+ 家酒店；Aegon 拥有
              $882B 收入和全球 31.7M 客户；Amundi 管理超过 €2T 资产。这一参考客户基础强化了企业叙事，但 SMB
