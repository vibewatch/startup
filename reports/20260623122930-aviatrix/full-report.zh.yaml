      - number: '1.5'
        title: 里程碑与战略演进
        blocks:
          - type: paragraph
            body: >
              Aviatrix 的战略演进可分为三个阶段。第一阶段（2014–2019）是创立与早期产品期，建立公司的多云网络抽象层。第二阶段（2019–2023）由 Steve Mullaney 主导，借 2021 年
              Series E 快速扩张至独角兽，并初步定位为「cloud networking expert」。2023 年 Distributed Cloud Firewall 上线，标志安全转向开始。第三阶段（2023
              年至今）由 Doug Merritt 牵头，执行从网络到安全优先平台的刻意再定位——Cloud Native Security Fabric——并与「Containment
              Era」论点对齐：预防和检测不够，工作负载级 containment 才是必要的架构答案。

              一个实质性负面数据点塑造了这次转向叙事：2025 年 7 月 BankInfoSecurity 对 Merritt 的采访显示，客户早已主要因为安全能力而不是网络能力选择
              Aviatrix。这说明转向更像是对客户认知的反应，而非主动创建类别；这一区别会重要影响 Aviatrix 的竞争护城河和类别所有权判断。2026 年 6 月 Microsoft Agent Control
              Specification 集成、Microsoft Security Store 合作和 OISF 会员身份，显示伙伴动能仍在延续。下方 Milestone 表和 Company Timeline
              图完整记录融资、产品、治理和合作事件；缺乏独立确认的里程碑条目以证据缺口标注。
