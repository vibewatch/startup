        - 以 AWS 为中心的企业
        - 深度 AWS 集成、近乎零增量成本、跨区域共享 DNS/AD/IPS
        - 仅限单云；无 Azure/GCP 可视性；跨云策略粒度有限
      - - Azure Virtual WAN + Firewall
        - 超大云厂商原生替代品
        - Azure（MSFT）云服务；计入已承诺支出
        - 以 Azure 为中心的企业
        - 全球 hub-and-spoke、原生 Azure Firewall Policy 管理
        - 仅限单云；无 AWS/GCP 集成；多云编排有限
      - - GCP Cloud NGFW
        - 超大云厂商原生替代品
        - GCP（GOOGL）云服务；计入已承诺支出
        - 以 GCP 为中心的企业
        - 分层防火墙策略、VPC 级 Cloud NGFW
        - 仅限单云；相较 AWS 和 Azure 云网络服务还不成熟
      - - Cato Networks
        - SASE 替代品
        - 私有公司；已融资 $773M（据公开报道）；估值 $1B+
        - 分布式企业；聚焦混合办公员工
        - 融合 SD-WAN + Cloud Network + SSE、全球 PoP 骨干网、身份驱动
        - 聚焦用户访问而非云工作负载东西向；对大规模云足迹的多云传输有限
      - - Netskope
        - SASE/ZTNA 替代品
        - 私有公司；已融资 $1B+（据公开报道）
        - 企业；混合办公和云应用访问
        - Universal ZTNA、NewEdge 全球网络、融合 SSE/SASE
        - 偏向 ZTNA；多云网络织构弱于 Aviatrix
      - - Zscaler（ZPA）
        - ZTNA 替代品
        - 上市公司（ZS）；ARR 运行率 $8B+
        - 企业；远程访问和零信任访问
        - 全球部署最广的 ZTNA、AI 驱动的用户到应用分段、工作负载到工作负载
        - 不提供多云路由或传输；把网络层访问定位为不必要
      - - Illumio
        - 相邻品类（微分段）
        - 私有公司；机构投资者支持力度大（Franklin Templeton 等）
        - 企业；安全运营、入侵遏制
        - Forrester Wave 2024 微分段领导者、Gartner Customers' Choice 2026
        - 工作负载级执行，不做网络路由；互补而非替代
      - - Wiz
        - 相邻品类（CSPM/AI 安全）
        - 私有公司；已融资 $300M；估值 $12B（Series E 后，据先前报道）
        - 大型企业；云原生团队
        - Fortune 100 渗透率超过 50%、200+ 集成、云和 AI 安全态势
        - 可视化和态势层，没有网络执行；争夺安全预算，而非数据平面控制
