      - number: '7.2'
        title: 安全与技术风险
        blocks:
          - type: paragraph
            body: >
              CVE-2024-50603 是 Aviatrix Controller 中一个 CVSS 10.0、无需认证的远程代码执行漏洞，于 2025 年 1 月披露，并立即在野外被武器化。Wiz
              跟踪到多起活跃事件，发现约 3% 的云企业环境运行 Aviatrix Controller，其中 65% 存在通往管理型云控制平面权限的横向移动路径。主动利用部署了 XMRig 加密货币矿工和 Sliver
              命令控制框架；研究人员指出，攻击者很可能借枚举出的云权限外泄数据。CISA 于 2025 年 1 月 16 日将该漏洞加入 Known Exploited Vulnerabilities（KEV）目录，要求
              Federal Civilian Executive Branch 机构在 2025 年 2 月 6 日前修补。披露时已有公开 proof-of-concept。Aviatrix 于 2024 年 11 月初发布
              hot patch，并在 2024 年 12 月 19 日为受支持的 Controller 7.1 和 7.2 版本发布永久修复；使用不受支持版本的客户在整个窗口期都暴露在风险中。

              除具体 CVE 外，Controller 在策略执行中的中心角色带来内生单点故障风险：Controller 被攻破或宕机会影响所有受管工作负载和云的策略执行与可见性。已有文档显示，AWS Cloud 环境默认允许
              Aviatrix Controller 权限提升，这会放大未来任何 Controller compromise 的 blast radius。平台的无 agent 架构虽是运营优势，但完全依赖
              hyperscaler API 稳定性；服务商侧 API 变化、弃用或配额限制可能悄然破坏连接或执行策略。G2 和 TrustRadius
              客户评论记录的高实施复杂度提高了运营误配置概率，可能打开横向移动路径或策略缺口。
