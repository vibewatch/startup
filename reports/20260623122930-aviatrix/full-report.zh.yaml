            全云多云传输，嵌入合作伙伴 NGFW；网络 fabric 强，安全执行靠集成合作伙伴产品落地
        - label: Alkira
          x: 4
          'y': 3
          description: |
            多云宽度相当（AWS/Azure/GCP/OCI）；集成 ZTNA 和 NGFW；定位类似 Aviatrix，采用用量定价
        - label: Cisco Multicloud Defense
          x: 3
          'y': 4
          description: |
            跨云策略控制，安全深度强（入口 / 出口 / 东西向）；多云路由宽度窄于 Aviatrix
        - label: Palo Alto Prisma（云安全）
          x: 3
          'y': 5
          description: |
            安全栈最深（代码到云、1T 事件 / 天）；多云支持靠 SASE PoP，而不是专用传输 fabric
        - label: Fortinet FortiGate
          x: 2
          'y': 5
          description: |
            安全深度最高（全球 NGFW 份额 >50%，ASIC 支撑）；以云 VM 部署，而非云原生 SaaS；多云宽度较低
        - label: AWS TGW + ANFW
          x: 1
          'y': 2
          description: |
            仅 AWS；集成深但单云；防火墙只在 VPC 边界
        - label: Azure vWAN + Firewall（Azure 防火墙）
          x: 1
          'y': 2
          description: |
            仅 Azure；全球 hub-and-spoke；跨云能力有限
        - label: Cato Networks
          x: 3
          'y': 4
          description: |
            全球 PoP 骨干、完整 SASE 栈，用户访问侧强；大型云部署中的工作负载东西向能力较弱
        - label: Zscaler ZPA
          x: 2
          'y': 3
          description: |
            零信任用户到应用访问很强；聚焦 ZTNA，不是多云传输 fabric
        - label: Illumio
          x: 3
          'y': 3
          description: |
            通过工作负载 agent 做多云微分段；东西向能力强；不是路由覆盖层
        - label: Wiz
          x: 4
          'y': 2
          description: |
            在态势 / 可见性层覆盖最宽的云（所有 hyperscaler + AI）；没有网络执行数据平面
    approximationNotes: >
      坐标轴为 1-5 序数刻度。多云宽度：1=单云，5=所有主要云加 OCI 和本地环境。安全深度：1=仅连接，5=完整代码到云安全栈。所有位置均从供应商产品文档和营销主张推断；不反映独立分析师基准数据或 win-rate
      数据。Wiz 和 Illumio 处在相邻而非直接竞争的位置，但为补全买方视野而纳入。
