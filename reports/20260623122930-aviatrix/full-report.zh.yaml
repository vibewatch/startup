    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与产品重点
        blocks:
          - type: paragraph
            body: >
              Aviatrix Systems, Inc. 以 Aviatrix® 对外经营，是一家云网络安全公司，总部位于 2901 Tasman Drive, Santa Clara, California
              95054。「Aviatrix」意为「女飞行员」，致敬公司的女性创始人，也承载其在云时代的创新精神。Aviatrix 成立于 2014 年，最初开发云网络抽象层，在 AWS、Azure、Google Cloud
              和 Oracle Cloud 之间提供多云连接和高级路由。到 2024–2026 年，管理层围绕 Cloud Native Security
              Fabric（CNSF）重新定位公司：它是嵌入式执行平台，在网络层治理工作负载之间的通信，而不是把流量压到中央边界瓶颈。公司把这种架构差异称为「containment
              architecture」，相对于传统「chokepoint security」；其论点是，92% 运行多云环境的组织需要在每个工作负载处执行策略，而不是依赖共享传输防火墙。

              Aviatrix 当前旗舰产品 Cloud Native Security Fabric，把公有云和 Kubernetes 环境中的云网络与安全统一起来。核心产品包括 Distributed Cloud
              Firewall（DCF，2023 年推出）、用于 AI 工作负载保护的 Agentguard，以及 2026 年 6 月发布的 Microsoft Agent Control Specification
              集成，支持用单一策略文件治理跨 AWS、Azure、Google Cloud 和本地 Kubernetes 的 AI agent。公司还运营 Aviatrix Certified
              Engineer（ACE）项目，称其为行业领先的多云网络与安全认证。截至 2026 年 6 月，Aviatrix 运营 Threat Research Center，其中包括交互式 Cloud Threat
              Command Center，并正借「Containment Era」思想领导力系列切入 agentic AI 安全类别。收入和定价仍为私有信息。下方 Snapshot KPI 表和 Summary KPI
              图总结关键封面指标；Company Snapshot 流程图展示身份、产品、客户和资本如何连接。
