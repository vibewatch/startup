  - id: FU001
    title: Aviatrix 客户旅程图 — 细分、触点和扩张循环
    type: journey-map
    layout: wide
    summary: 描绘企业买方从初始发现到多云部署扩张的路径，并标注来自具名客户案例研究的证据。
    data:
      items:
        - label: 阶段 1 — 发现（ACE Community & Marketplace）
          description: >-
            ACE 认证社区（8,366 名成员）和 Aviatrix 博客吸引从业者；AWS 和 Azure Marketplace 让平台在云采购评审中浮现；Equinix 和 VAR
            伙伴转介（Presidio、WWT）在金融服务和工业客户中推动自上而下的引荐。代表性细分：大型企业金融服务、酒店、工业。
        - label: 阶段 2 — 评估（POC & IaC Assessment）
          description: >-
            POC 通常围绕一个边界清晰的用例——多云传输或出口控制；跨云 Terraform 模块一致性和 CoPilot 可见性演示，使其区别于 CSP 原生工具；ACE
            培训降低评估中的技术摩擦。代表性细分：所有企业，其中受监管行业（金融服务、医疗、航空）的合规驱动周期更长。
        - label: 阶段 3 — 部署（初始生产）
          description: >-
            初始生产部署包括传输网关和 Aviatrix Controller；IaC 自动化支持一小时内工作负载预置（HAPEV）；Equinix 边缘集成把连接延伸到托管机房节点；合规工作负载（FAA、HIPAA、PCI
            DSS）推动初始安全策略配置。全部 14 个具名案例研究均确认其为生产状态（不是试点）。
        - label: 阶段 4 — 扩张（Land-and-Expand）
          description: >-
            初始传输部署后，客户增加 Distributed Cloud Firewall、CNSF、HPE 加密和 FQDN 过滤；AB InBev 和 Aegon 的 M&A 集成用例释放更多工作负载；AI
            工作负载安全模块（AgentGuard、CNSF）越来越多地面向已有 AI 基础设施账户销售。Across AI（2026）代表新的 agentic AI 垂直扩张模式。
    approximationNotes: 旅程阶段由案例研究叙事和社区数据推断；Aviatrix 未披露官方客户旅程漏斗转化指标。
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU038
      - CU039
      - CU040
  - id: FU002
    title: Aviatrix 采用与部署漏斗 — 从发现到扩张
    type: funnel
    layout: standard
    summary: 展示 Aviatrix 从企业发现到部署再到扩张的路径，并突出已有证据和仍存在的缺口。
    data:
      items:
        - label: 社区 / ACE 认知池
          value: 8366
          note: 2026 年 6 月注册社区成员；包括潜在客户，不只是客户
        - label: 云 Marketplace 采购渠道
          value: 2
          note: AWS Marketplace + Azure Marketplace；可抵扣已承诺云支出
        - label: 签约企业客户（自报最低值）
          value: 500
          note: 公司声称的数字；确切数量未经审计；未按状态拆分
        - label: 已公开点名的生产部署
          value: 14
          note: aviatrix.ai 上的案例研究；只覆盖 500+ 客户群中的一小部分
    approximationNotes: 社区成员数可直接观察；客户数来自公司自报；所有 null 值都代表未披露指标。漏斗转化率未知。
    claimRefs:
      - CU001
      - CU003
      - CU013
      - CU015
  - id: FU003
    title: 客户证据质量矩阵——按点名账户评估证据
    type: matrix
    layout: wide
    summary: 从证据质量、结果具体性、生产确认情况和客户侧引用人的级别，给每个点名客户打分。
    data:
      columns:
        - 证据质量（高 / 中 / 低）
        - 结果具体性
        - 已确认生产部署
        - 引用人级别
      rows:
        - label: Republic Airways
          values:
            - 高
            - 量化：MTTR 从数天降至 <1hr；吞吐量 +150Mbps；区域部署当天完成
            - 是
            - 高级网络工程师（Brent Fowler）
        - label: Aegon
          values:
            - 高
            - 量化：隧道配置从数小时缩至数秒；规模扩大但团队人数不变
            - 是
            - 基础设施负责人（Glynis Coutee）
        - label: HAPEV
          values:
            - 高
            - 量化：借助 IaC，新工作负载部署 <1hr；备份时间缩短
            - 是
            - 网络与安全工程师（Radu Alexa）
        - label: Better（金融科技）
          values:
            - 中
            - 定性：满足合规要求；出站流量成本下降
            - 是
            - CISO（Ali Khan）
        - label: AB InBev
          values:
            - 中
            - 定性：打通 M&A 整合；成本 API 可见
            - 是
            - DevOps 与云工程总监（Manaswinee Mohanty）
        - label: Amundi
          values:
            - 中
            - 定性：多区域扩张；客户上线提速
            - 是
            - 全球 IT 网络负责人（Thomas Mouilleseaux）
        - label: IHG Hotels & Resorts
          values:
            - 中
            - 定性：全球酒店扩张简化；应用可用性提升
            - 是
            - 基础设施、架构与创新负责人（Eric Norman）
        - label: Yara
          values:
            - 中
            - 定性：Day-2 运维简化；多个 CSP 接入
            - 是
            - 农场与田间数据总监（David Van Damme）
        - label: GN Store Nord
          values:
            - 中
            - 定性：M&A 整合；2 人团队管理完整骨干网
            - 是
            - 云网络架构师（Przemek Konitz）
        - label: Inmarsat
          values:
            - 中
            - 定性：OCI 连接问题解决；故障排查提速
            - 是
            - 高级网络工程师（Sheldon Parsons）
        - label: Across AI
          values:
            - 低
            - 定性：AI 工作负载安全；企业上线更快
            - 是（生产 AI 基础设施）
            - 联席 CEO 兼联合创始人（Nilou Salehi）
        - label: PipelineRx
          values:
            - 低
            - 定性：问题解决从数天缩至数小时；上线更快
            - 是
            - DevOps 工程师（Darren Lombardi）
    approximationNotes: 证据质量评级由分析师按是否存在量化结果或仅有定性叙述来判定；「高」要求至少一个量化指标，「中」要求点名高管引用且包含结果主张，「低」只有点名引用。
    claimRefs:
      - CU017
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
      - CU023
      - CU024
      - CU025
      - CU026
  - id: FR001
    title: 风险热力图——可能性 vs. 影响
    type: matrix
    layout: wide
    summary: |
      按分析师评估的发生可能性（行）和对投资影响的严重程度（列）定位风险；单元格写明具体风险驱动因素。
    data:
      columns:
        - 低影响
        - 中等影响
        - 高影响
        - 关键影响
      rows:
        - label: 低可能性
          values:
            - IP / 专利诉讼
            - FedRAMP 授权延迟
            - GDPR 合规缺口
            - null
        - label: 中等可能性
          values:
            - 财务不透明带来投资者阻力
            - 渠道执行缺口
            - 估值下调风险
            - 品类转向执行失误
        - label: 高可能性
          values:
            - AWS/Azure API 变化
            - 客户集中度（未知）
            - Controller 单点故障风险
            - 超大云厂商功能追平
        - label: 几乎确定
          values:
            - null
            - 监管合规投入
            - 领导层流失
            - CVE-2024-50603 信任赤字
    approximationNotes: |
      可能性行自上而下为：低、中、高、几乎确定。评级是分析师基于公开证据和可比 SaaS 风险画像作出的判断；不是模型生成的概率。
    claimRefs:
      - CR001
      - CR007
      - CR008
      - CR016
      - CR021
      - CR029
      - CR030
      - CR034
  - id: FR002
    title: 风险传导图——风险如何层层影响投资结果
    type: dag
    layout: wide
    summary: |
      该有向无环图展示因果路径：根因风险先触发中间影响，再传导到投资论点结果。
    data:
      nodes:
        - id: hyperscaler-parity
          label: 超大云厂商功能追平
        - id: cve-trust
          label: CVE 利用 / 信任赤字
        - id: ceo-pivot
          label: CEO 战略转向风险
        - id: financial-opacity
          label: 财务不透明
        - id: revenue-pressure
          label: 收入 / ARR 压力
        - id: customer-trust
          label: 客户信任流失
        - id: valuation-risk
          label: 估值下行
        - id: exit-risk
          label: IPO / 退出延迟
      edges:
        - from: hyperscaler-parity
          to: revenue-pressure
          label: 定价压力
        - from: cve-trust
          to: customer-trust
          label: 信任侵蚀
        - from: ceo-pivot
          to: revenue-pressure
          label: GTM 执行缺口
        - from: financial-opacity
          to: valuation-risk
          label: 投资者不确定性
        - from: revenue-pressure
          to: valuation-risk
          label: 倍数压缩
        - from: customer-trust
          to: revenue-pressure
          label: 流失 / 丢单
        - from: valuation-risk
          to: exit-risk
          label: 下调 / 延迟
    claimRefs:
      - CR001
      - CR007
      - CR016
      - CR021
      - CR023
      - CR030
      - CR033
  - id: FR003
    title: 依赖图——关键平台和资本依赖
    type: dag
    layout: wide
    summary: |
      Aviatrix 在运营、财务和 GTM 上的关键依赖，以及每项依赖带来的失效场景。
    data:
      nodes:
        - id: aws-apis
          label: AWS API / Transit Gateway / Cloud WAN 控制
        - id: azure-apis
          label: Azure API / Virtual WAN
        - id: gcp-apis
          label: GCP API / Network Connectivity Center 控制
        - id: controller
          label: Aviatrix Controller（控制平面）
        - id: marketplaces
          label: AWS + Azure 市场
        - id: channel
          label: 渠道伙伴（VARs / ISVs）
        - id: investors
          label: TCV / Insight / 其他 VC
        - id: customers
          label: 企业客户（500+）
      edges:
        - from: aws-apis
          to: controller
          label: API 依赖
        - from: azure-apis
          to: controller
          label: API 依赖
        - from: gcp-apis
          to: controller
          label: API 依赖
        - from: controller
          to: customers
          label: 平台交付
        - from: marketplaces
          to: customers
          label: 获客渠道
        - from: channel
          to: customers
          label: 间接销售
        - from: investors
          to: controller
          label: 资本 / 连续性
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR034
      - CR035
      - CR043
  - id: FV001
    title: 建议逻辑流
    type: flow
    layout: standard
    summary: |
      从市场 / 证据、产品 / 护城河、财务、风险和估值输入，推导出对 Aviatrix 的持有 / 观察投资建议。
    data:
      nodes:
        - id: market-proof
          label: 市场与证据：云安全 TAM $50B+；确认 550+ 企业客户；产品可信度已验证
        - id: product-moat
          label: 产品与护城河：多云原生架构具备防御性；但 PANW、Cisco 和超大云厂商正在扩大重叠
        - id: financials
          label: 财务：估计 ARR $85–95M（2026）；2023–2024 增长约 81%；无已确认 P&L；资本效率低于基准
        - id: risks
          label: 风险：高——$2B 优先清算权压力；竞争侵蚀；板块倍数压缩；执行转向风险
        - id: valuation
          label: 估值：二级市场约 $411M vs. Series E 轮 $2B；基准区间 $425M–$595M；按当前倍数，Series E 轮入场价难以支撑
        - id: recommendation
          label: 建议：持有 / 观察——接近 $2B 标记价时不可操作；二级市场 <$500M 入场需要确认 ARR ≥ $85M
      edges:
        - from: market-proof
          to: recommendation
        - from: product-moat
          to: recommendation
        - from: financials
          to: recommendation
        - from: risks
          to: recommendation
        - from: valuation
          to: recommendation
    approximationNotes: 建议逻辑是对前文所有证据的定性综合；节点权重未经过正式校准。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV039
      - CV040
  - id: FV002
    title: 估值敏感性——EV/ARR 倍数 vs. ARR
    type: bar
    layout: wide
    summary: >
      展示在三个 ARR 情景（熊市 $70M、基准 $85M、牛市 $95M）下，企业价值如何随 3x–10x EV/ARR 倍数区间变化；同时标注 Forge 二级市场隐含的 $411M 和 Series E 轮 $2B
      作为参照。
    data:
      items:
        - label: 熊市 ARR $70M @ 3x
          value: 210
        - label: 熊市 ARR $70M @ 5x
          value: 350
        - label: 基准 ARR $85M @ 5x
          value: 425
        - label: 基准 ARR $85M @ 7x
          value: 595
        - label: 牛市 ARR $95M @ 8x
          value: 760
        - label: 牛市 ARR $95M @ 10x
          value: 950
        - label: Forge 二级市场隐含估值
          value: 411
        - label: Series E 轮估值（2021）
          value: 2000
    approximationNotes: |
      所有 ARR 数值均为第三方估计。倍数区间来自公开网络安全可比公司，并加入 20–35% 私有公司折价。Series E 轮 $2B 是基准标记，不是当前可投资价格。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
  - id: FV003
    title: 估值 / 回报区间——情景结果
    type: range
    layout: standard
    summary: |
      展示牛市、基准和熊市情景下企业价值从低到高的区间，以及 Series E 轮投资者隐含回报；也凸显 Series E 轮持有人相对二级市场买家的回报难度。
    data:
      items:
        - label: 熊市情景（EV）
          low: 210
          high: 280
        - label: 基准情景（EV）
          low: 425
          high: 595
        - label: 牛市情景（EV）
          low: 760
          high: 950
        - label: Series E 轮盈亏平衡（1x 回报所需 EV）
          low: 2000
          high: 2000
    approximationNotes: |
      区间基于估计 ARR × EV/ARR 倍数情景。回报针对假设的 Series E 轮投资者，前提是以 $2B 投后估值投入 $200M。未建模优先清算瀑布或稀释；实际每股回报需要完整股权结构分析。
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV035
      - CV036
  - id: FV004
    title: 投资 KPI——可提交 IC 的评分
    type: kpi
    layout: standard
    summary: |
      从市场机会、产品证据、竞争护城河、财务经济性、风险画像、估值和证据质量几个维度，给出可提交投资委员会讨论的评分。
    data:
      items:
        - label: 市场机会
          value: 7
          max: 10
          note: TAM 大（云安全 $50B+），CAGR 25%+；企业需求信号清晰。
        - label: 产品证据
          value: 6
          max: 10
          note: 550+ 企业客户，Deloitte Fast 500（4x），但 ARR 规模未确认。
        - label: 竞争护城河
          value: 5
          max: 10
          note: 云中立架构有差异化；PANW、Cisco 和超大云厂商扩张正在侵蚀优势。
        - label: 财务经济性
          value: 4
          max: 10
          note: ARR 估计 $64–95M；资本效率约 18%；没有已确认的利润率或盈利能力数据。
        - label: 风险画像
          value: 3
          max: 10
          note: 高：$2B 优先清算权压力、板块倍数压缩、执行转向风险、二级市场流动性不足。
        - label: 估值（二级市场约 $411M）
          value: 5
          max: 10
          note: 与基准情景一致；如果 ARR 得到确认，入场可接受；相对风险画像没有折价。
        - label: 证据质量
          value: 4
          max: 10
          note: 没有一手财务披露；所有 ARR / 收入数据均为第三方估计或算法生成。
    approximationNotes: |
      KPI 评分是分析师在 1–10 分制上的定性判断，不是量化模型输出。它用于 IC 讨论框架，不是最终评级。
    claimRefs:
      - CV039
      - CV040
      - CV042
      - CV046
