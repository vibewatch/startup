        - 集中度风险：工程师依赖单一平台
        - 低（正向）——降低流失风险
        - 跟踪 ACE 认证同比增速；与续约率关联
      - - 头部客户集中度
        - 未知；Global 2000 参考客户集意味着少数大客户可能贡献大部分 ARR
        - 如果前 5 大客户贡献 >30% ARR，则风险高
        - 高——无公开披露；无法评估
        - 向资料室索取前 10 大客户收入集中度
      - - 云市场依赖
        - AWS 和 Azure Marketplace 上架，形成承诺消费采购渠道
        - 提供商政策变化（费率结构、市场独占）可能推高成本
        - 中——提供商议价权随时间上升
        - 确认新增 ARR 中通过 marketplace 与直销流入的比例
      - - 地域集中度
        - 北美和欧洲在具名客户基础中占主导；GCC 和 APAC 渗透不足
        - 如果北美 / 欧洲云支出放缓，收入承压；低渗透市场仍有扩张空间
        - 中——限制 TAM 兑现，也让收入暴露于区域宏观波动
        - 索取地域 ARR 拆分；评估 APAC / GCC 的 go-to-market 投入
      - - 渠道伙伴依赖（Presidio、WWT、Equinix）
        - 在金融服务解决方案页具名；扮演影响者和实施伙伴
        - 关键伙伴流失可能削弱转介绍管线
        - 低-中——伙伴组合多元，降低单一伙伴风险
        - 确认交易中由渠道伙伴影响和由渠道伙伴来源的比例
    notes: 头部客户集中度和多产品挂载率未知；所有严重性评估都基于公开案例研究数据中的可观察模式。
