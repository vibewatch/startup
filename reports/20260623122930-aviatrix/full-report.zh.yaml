      - number: '2.2'
        title: 多重规模测算视角——TAM 背景与融合层
        blocks:
          - type: paragraph
            body: >-
              没有一个分析师估算能干净代表 Aviatrix 的可服务可获得市场，因为公司横跨多个相邻类别。最宽的代理是全球云安全市场：MarketsandMarkets 估算 2026 年为 USD 34.37
              billion，到 2031 年增至 USD 59.34 billion，CAGR 为 11.5%；Grand View Research 估算 2024 年为 USD 35.84 billion，到 2030
              年增至 USD 75.26 billion，CAGR 为 13.3%。这些数字不可直接比较——GVR 2024 年 USD 35.84 billion 基线已经高于 MnM 2026 年 USD 34.37
              billion 估算，若把 GVR 轨迹向前外推，在大致相同时间点显示超过 30% 的口径差异。更广义网络安全市场提供外部边界，2025 年为 USD 84.50 billion（MnM）。对 Aviatrix
              云网络与安全的具体融合点，SASE 市场（2026 年 USD 19.19 billion，到 2030 年增至 USD 68.06 billion，CAGR 28.8%）和更窄的多云网络细分（2027 年
              USD 7.6 billion，CAGR 22.5%）是更接近的规模参照。Zero Trust Security 市场（到 2029 年 USD 78.7 billion，CAGR 16.6%）和 Zero
              Trust Architecture 细分（到 2028 年 USD 38.5 billion，CAGR 17.3%）为推动云网络采用的安全态势转移提供需求侧背景。在云安全内部，CNAPP 细分到 2031
              年的子类别 CAGR 最高，为 14.6%（MnM），呼应 Aviatrix 的 CNSF 论点：工作负载级执行是下一代架构。没有分析师公司发布独立报告，直接匹配 Aviatrix
              精确产品边界所对应的分布式云防火墙或云网络安全执行市场；公司特定 SAM 必须从 SASE 交叉区和多云网络层自下而上估算。
