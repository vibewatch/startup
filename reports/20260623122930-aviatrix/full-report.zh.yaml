      - number: '8.4'
        title: 情景分析与估值区间
        blocks:
          - type: paragraph
            body: >
              三个情景均以 ARR 为主要价值驱动，以 EV/ARR 作为倍数。所有情景都采用第三方估算 ARR 输入，应视为分析构造， 而非已确认预测。牛市情景假设云安全转型执行成功，ARR 到 2026 年中强劲增长至约
              $95M，并因板块重估和私营云安全 纯标的稀缺性获得 8–10x 溢价倍数，对应估值 $760M–$950M。要达成该情景，Aviatrix 需要持续 25%+ 增长、利润率改善，
              且云安全倍数市场情绪好转。基准情景最符合现有证据，假设 ARR 为 $85M（与 Latka 的保守外推一致），并采用 5–7x 倍数反映当前 SaaS 资本市场环境，对应 $425M–$595M。该区间包住
              Forge 隐含的 $411M；考虑流动性折价，$411M 代表下沿。熊市情景假设 ARR 增长减速至 $70M（可能反映 AI 原生网络工具冲击、超大云厂商功能侵入，或安全转型期间
              的执行风险），且倍数进一步压缩至 3–4x，对应 $210M–$280M。竞争替代或市场环境继续恶化会触发该情景。敏感性分析显示， 倍数是主导变量：在 $85M ARR 下，倍数从 4x 升至 8x，估值从
              $340M 移到 $680M。ARR 不确定性次之，但仍重要： 在 6x 倍数下，ARR 少 $20M 会损失 $120M 价值。若价格接近 $2B Series E，投资回报画像并不友好：Series E
              投资人 需要 $10B+ 退出（5× 回报）才能达到机构门槛，要求 Aviatrix 在 8–10x 倍数下做到 $1B+ ARR——按当前增长假设， 这是跨数十年的路径。按 $411M
              买入的二级买家回报数学更现实，但仍暴露在优先权堆栈稀释之下。
