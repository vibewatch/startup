          note: 按网关订阅；标价约 ~$0.14/hr
        - id: arr-recognized
          label: 年度订阅收入
          note: 估计约 ~$64M ARR（2024，Latka）；按期确认
        - id: cost-of-revenue
          label: 收入成本
          note: 云托管、技术支持；毛利率未披露
