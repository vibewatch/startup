      - number: '5.2'
        title: 核心产品模块
        blocks:
          - type: paragraph
            body: >
              **Distributed Cloud Firewall（DCF）** 是主要的工作负载执行产品。DCF 借助 Cloud Asset Inventory（CAI）发现 AWS、Azure 和 GCP
              上的每个工作负载，并将其归入基于身份的 SmartGroups，让策略一次编写、跨云一致执行，无需 IP 地址规则或各云单独工具。Spoke gateways
              的内联执行会在第一跳（L4-L7）丢弃未授权连接，在横向移动扩散前阻断。南北向互联网出口由 WebGroups 控制，支持 FQDN 和完整 URL 路径过滤。ExternalGroups
              管理外部目的地策略。所有 DCF 策略都通过 Terraform 和 CI/CD 流水线按代码管理，支持版本控制、同行评审和自动化部署。Aviatrix Controller 和 CoPilot
              提供单一规则引擎和统一可见层。

              **High Performance Encryption（HPE）** 建在一项获得专利的多隧道、多核心架构上，突破单核心 VPN 瓶颈——标准 AWS 或 Azure VPN 网关每条隧道上限约 1.25
              Gbps。HPE 通过并行隧道和 ECMP 实现 100+ Gbps 混合吞吐，以及最高 1 Tbps+ 云到云吞吐。所有加密都由软件定义，随云计算资源扩展，不需要硬件设备。HPE 包含
              Crypto-Agility Engine，设计目标是无缝升级算法，包括为后量子密码（PQC）做好准备。

              **Workload Threat Visibility（WTV）** 将 Aviatrix NAT Gateways 转成智能安全传感器，提供统一的跨云工作负载出站连接可见性——暴露恶意出口目的地，并降低
              NAT 成本和复杂度。WTV 为 DORA、NIS2 和 PCI DSS 4.0 输入可用于合规的遥测数据。

              **CoPilot** 是集中化的可见性、监控和分析层。它为所有云上的流量流、威胁事件、策略状态和合规姿态提供单一视图。
