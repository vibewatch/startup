      - number: '5.4'
        title: 信任、合规与安全控制
        blocks:
          - type: paragraph
            body: >
              Aviatrix 的 Trust Center（trust.aviatrix.com）列出五项审计和认证：SOC 2（文档可获取）、ISO 27001、TISAX、GDPR 合规和 CCPA 合规。另有 30
              份文档覆盖政策（15）、渗透测试报告（2）、HR 实践（6）及其他类别。平台层面的产品主张包括：通过 CoPilot 生成、由 HPE 执行的审计就绪合规遥测，支持 HIPAA 2025、PCI DSS
              4.0、DORA、NIS2 和 CISA Zero Trust Maturity Model（ZTMM）2.0。

              最重要的安全风险是 CVE-2024-50603：Aviatrix Controller API 中一个 CVSS 10.0、无需认证的远程代码执行漏洞，由 Securing 的 Jakub Korepta
              发现，并在 2024 年 10 月末首次披露。漏洞源于 API endpoint 未能清理用户提交输入，允许 OS 命令注入。Wiz 报告称，3% 的云企业环境部署了 Aviatrix Controller；其中
              65% 的环境在 AWS 上默认存在通往管理型云控制平面权限的横向移动路径。2025 年 1 月观察到主动利用，攻击者部署 XMRig 加密货币矿工和 Sliver C2 框架。CISA 于 2025 年 1 月
              16 日将 CVE-2024-50603 加入 Known Exploited Vulnerabilities 目录，要求联邦机构在 2025 年 2 月 6 日前修补。Aviatrix 于 2024 年 11
              月初为低至 6.7 的版本（包括部分停止支持版本）发布 hot patch，并于 2024 年 12 月 19 日为受支持的 7.1（v7.1.4191）和
              7.2（v7.2.4996）分支发布永久修复——早于公开 PoC exploit 可用。公司开展了定向客户触达，并推送产品内 banner，以在 2025 年 1 月 7 日公开披露前尽量扩大补丁覆盖。

              Controller 作为单一编排点的架构是结构性风险：一旦 Controller 被攻破，可能影响整个企业多云资产的策略执行。Aviatrix 支持 Controller HA 配置；spoke
              gateways 在与 Controller 断连时会继续执行最后已知良好策略。但 CVE-2024-50603 事件凸显，Controller 访问加固必须足够严格。
            claimRefs:
