          - type: callout
            title: Controller 是关键 blast-radius 风险
            body: >
              CVE-2024-50603（CVSS 10.0、CISA KEV、2025 年 1 月被利用）证明，Aviatrix Controller——所有云的单一策略编排点——是有吸引力且影响巨大的攻击目标。65%
              部署了 Controller 的 AWS 环境默认存在通往管理员云控制平面权限的横向移动路径，因此 Controller 被攻破可能级联成云资产接管。Aviatrix
              快速且主动地打了补丁，但这一架构风险是结构性的，必须向买方披露。
