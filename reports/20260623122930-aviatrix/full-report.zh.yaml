  - id: TE002
    title: Aviatrix 工作流与使用场景表
    columns:
      - 用户任务
      - 当前问题
      - Aviatrix 方案
      - 声称可量化收益
      - 局限
    rows:
      - - 阻止多云横向移动
        - 各云厂商各自按 IP 写规则；没有跨云治理；东西向 VPC 流量无人管
        - DCF SmartGroups 在 AWS/Azure/GCP 的第一跳内联执行策略
        - 未授权东西向连接在源头被丢弃；新工作负载部署时自动纳入安全策略
        - Controller 是单一编排点；CVE-2024-50603 表明 controller 可被利用
      - - 大规模加密全部跨云流量
        - 单条 IPsec VPN 在每个 AWS 或 Azure VPN 网关最高 1.25 Gbps；硬件 VPN 增加延迟和成本
        - HPE 在云计算资源上跑多隧道 ECMP
        - 混合场景 100+ Gbps，云到云最高 1 Tbps+（公司声称）
        - 性能未经过独立基准测试；CPU 成本随流量放大
      - - 发现并治理影子 AI agent
        - 未授权 AI agent 调用 LLM 时没有可见性；基于代码的工具漏掉网络原生的影子 AI
        - AgentGuard Shadow AI Discovery 借助 VPC Flow Logs、DNS 和 Cloud Asset Inventory
        - 首次发现耗时 15 分钟（公司声称）；每个 AI agent 按爆炸半径评分风险
        - 仅 Early Access；高级能力（Deep AI Observability、Advanced AI Guardrails）尚未 GA
      - - 治理 AI agent，防止外泄和 C2
        - 越狱提示或被投毒依赖可骗过 SDK guardrails（如 2026 年 3 月 LiteLLM）
        - ACS 集成把策略文件编译进 DCF 网络执行层；即使 SDK 失效，网络层仍能守住
        - 执行不依赖架构；也不依赖检测（告警触发前就能生效）
        - 截至 2026 年 6 月，ACS 集成仍处 Early Access；生产履历有限
      - - 生成合规证据（HIPAA/PCI DSS/DORA）
        - 各云遥测碎片化；每家云厂商都要单独工具
        - CoPilot 提供审计就绪遥测；HPE 加密覆盖 CISA ZTMM 2.0、NIST 800-207 对齐要求
        - 支持 HIPAA 2025、PCI DSS 4.0、DORA、NIS2 合规报告
        - 合规支持属于产品对齐声明；QSA / 第三方审计范围未公开
      - - 降低 NAT Gateway 出站成本，同时获得可见性
        - NAT Gateway 账单随出站流量放大；出站内容不可见
        - WTV 把 NAT Gateways 变成安全传感器，提供跨云出站遥测
        - 降低 NAT 复杂度；为 NIS2、DORA、PCI DSS 4.0 提供合规遥测
        - 覆盖边界（如 serverless 出站）尚未完整披露
    notes: “声称可量化收益”列来自 Aviatrix 官方产品页和新闻稿；多数条目没有独立客户指标。
