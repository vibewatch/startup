  - id: sase-ztna-adjacent
    title: SASE, Zero-Trust, and Adjacent Security Players
    body: >
      The SASE category, popularized by Gartner, converges SD-WAN, cloud networking, and Security Service
      Edge (SSE) functions—firewall-as-a-service, CASB, DLP, SWG, and ZTNA—into a unified cloud-native
      service. Cato Networks is both a pioneering SASE vendor and a direct description of where the buyer
      conversation is heading: identity-driven, cloud-native, globally distributed, and covering every edge.
      Cato's Global Cloud Network competes directly with Alkira's Global Backbone-as-a-Service and
      Aviatrix's multicloud transit by delivering optimized global routing as a managed service rather than
      as a deployed overlay. Cato's customers report outcomes such as "faster, more secure, happy users,
      happy team—all for less cost and more business value," positioning the Cato SASE bundle as a
      consolidated alternative to point solutions including Aviatrix.


      Netskope's Netskope One Private Access delivers universal ZTNA via the Netskope One Platform,
      combining SSE, SASE, and converged gateway services on its NewEdge global network. Zscaler Private
      Access (ZPA) claims to be the world's most deployed ZTNA solution and frames its value proposition
      against VPN and network-centric approaches: 91% of organizations are concerned that VPNs compromise
      security, and 56% of organizations suffered one or more VPN-related attacks in 2023-2024. ZPA's
      argument—that connecting users to applications rather than the network reduces lateral movement
      risk—is conceptually at odds with Aviatrix's network-centric architecture. If buyers accept the
      ZTNA framing, they may deprioritize the multicloud networking layer in favor of identity-based
      access, reducing Aviatrix's addressable footprint.


      Illumio occupies the microsegmentation and breach-containment space adjacent to Aviatrix. Named a
      2024 Forrester Wave Leader in Microsegmentation and a 2026 Gartner Customers' Choice for Network
      Security Microsegmentation (4.8/5 from 59 reviews), Illumio's AI security graph enforces zero-trust
      segmentation across hybrid and multi-cloud environments at the workload level rather than the network
      layer. This is complementary in most deployments but competes for the same security budget line item
      in organizations seeking to consolidate vendors.


      Wiz is trusted by more than 50% of Fortune 100 companies and provides cloud and AI security posture
      management with 200+ integrations. Wiz operates at the visibility and risk-prioritization layer
      (infrastructure, models, data, runtime) and does not enforce network-level traffic policy, so it is
      not a direct competitor at the data plane. However, both Wiz and Aviatrix are sold to the same
      cloud security buyer, and in consolidated-platform deals, investment in Wiz's broad CSPM platform
      may displace budget for Aviatrix's narrower multicloud networking layer.
