  - id: hyperscaler-native
    title: Hyperscaler-Native Substitutes and the Status-Quo Option
    body: >
      The most immediate status-quo substitute for Aviatrix is each cloud provider's native networking
      stack: AWS Transit Gateway for VPC interconnect, AWS Network Firewall for perimeter enforcement,
      Azure Virtual WAN for global hub-and-spoke, Azure Firewall for policy enforcement, and Google Cloud's
      hierarchical firewall policies with Cloud Next Generation Firewall (Cloud NGFW). Each is deeply
      integrated with its respective provider's identity, logging, and billing infrastructure, and is priced
      at marginal cost or bundled within existing cloud committed-spend agreements—effectively zero
      incremental cost for organizations already operating at scale on one cloud.


      The structural limitation of hyperscaler-native solutions is single-cloud scope. AWS Transit Gateway
      connects thousands of VPCs across AWS regions but cannot natively manage Azure VNets or GCP VPCs.
      Azure Virtual WAN similarly operates within the Microsoft ecosystem. GCP's Cloud NGFW enforces
      policies at the VPC level but has no cross-cloud control plane. For organizations operating
      exclusively or predominantly on a single cloud provider, this limitation may be acceptable, and
      Aviatrix's value proposition is weakest there. But for organizations running two or more clouds—a
      majority of large enterprises—the operational complexity of managing separate native stacks creates
      exactly the problem Aviatrix (and Alkira) solve.


      The internal-build or manual-configuration status quo—stitching together native TGW, VPC peering,
      BGP routing, and native firewall rules—is the path most enterprises start with and progressively
      abandon as their cloud footprint grows. Aviatrix's customer acquisition pattern historically tracked
      this curve: enterprises that outgrow native networking complexity become buyers. The risk is that
      hyperscalers continue to improve cross-account, cross-region management and eventually absorb the
      multicloud overlay use case from below. AWS's inter-region peering and GCP's hierarchical policies
      are recent capabilities that shift the threshold at which third-party tools become necessary.
