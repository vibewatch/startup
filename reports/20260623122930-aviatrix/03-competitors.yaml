company:
  name: Aviatrix

chapter:
  number: 3
  title: Competitors
  summary: >
    Aviatrix operates in a competitive field spanning direct NIaaS pure-plays (Alkira), expanded incumbents
    (Cisco Multicloud Defense, Palo Alto Prisma), hyperscaler-native substitutes (AWS Transit Gateway plus
    Network Firewall, Azure Virtual WAN plus Firewall, GCP Cloud NGFW), and SASE/ZTNA substitutes (Cato
    Networks, Netskope, Zscaler ZPA). Adjacent players such as Wiz and Illumio address overlapping security
    budgets without directly competing at the network enforcement layer. Aviatrix's primary moat is its
    cloud-neutral, provider-agnostic control plane and the switching cost embedded in deployed multicloud
    topology, but the platform faces displacement risk from hyperscaler-native consolidation at the low end,
    incumbent channel power (Palo Alto, Fortinet, Cisco) at the enterprise tier, and SASE budget competition
    that re-frames "network security" as a cloud-delivered subscription rather than a routing and policy layer.

sections:
  - id: direct-competitors
    title: Direct Competitors and Cloud Networking Pure-Plays
    body: >
      Alkira is the closest direct competitor to Aviatrix in the pure-play multicloud networking
      infrastructure category. Alkira positions itself as a Network Infrastructure-as-a-Service (NIaaS)
      platform that abstracts connectivity across AWS, Azure, GCP, and Oracle Cloud Infrastructure (OCI)
      with a drag-and-drop interface, integrated ZTNA, and embedded next-generation firewall capabilities.
      Its marketing claims 96% reduction in cloud setup time, 47% reduction in network management time,
      and up to 40% lower total cost of ownership versus alternatives. Alkira's pricing is consumption-based
      with commitment-based options, charging based on network element size, connectors, NGFW instances, and
      egress. Its ecosystem integrations mirror Aviatrix's: Cisco SD-WAN, Palo Alto Networks, Fortinet
      NGFW, F5, Splunk, and ServiceNow. Enterprise customers cited by Alkira include Michaels (1,400 stores),
      Koch Industries, and SITA (aviation). The feature overlap with Aviatrix is material—both provide
      multicloud transit, single-pane visibility, and partner-NGFW embedding—which means buyer evaluation
      will center on operational maturity, ecosystem depth, and pricing model.


      Prosimo is a second direct NIaaS competitor that has targeted the distributed cloud networking space.
      Prosimo's product scope, current funding status, and go-to-market strategy could not be independently
      verified during this research run because the prosimo.io domain was inaccessible. This is a material
      evidence gap; independent analyst and channel sources should be consulted to determine whether Prosimo
      remains an active competitor or has pivoted, been acquired, or exited the market. PeerSpot review data
      groups Aviatrix comparisons with Cisco ACI, Meraki SD-WAN, and Megaport, but does not surface Prosimo
      in top-of-mind competitive comparisons, suggesting either limited enterprise mindshare or a gap in
      review-site adoption.


      Aviatrix itself is rated 8.0 out of 10 on PeerSpot, ranked #3 in Software Defined Networking, and is
      most commonly compared to Cisco ACI. Its PeerSpot user base skews to large enterprises (50%) with
      16% from financial services—high-value accounts that validate enterprise credibility but also represent
      a buyer segment that Palo Alto, Cisco, and Fortinet already penetrate deeply through existing security
      and networking relationships.
