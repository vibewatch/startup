            Comparable multicloud breadth (AWS/Azure/GCP/OCI); integrated ZTNA and NGFW;
            similar positioning to Aviatrix with consumption pricing
        - label: Cisco Multicloud Defense
          x: 3
          y: 4
          description: >
            Cloud-spanning policy control with strong security depth (ingress/egress/east-west);
            narrower multicloud routing compared to Aviatrix
        - label: Palo Alto Prisma
          x: 3
          y: 5
          description: >
            Deepest security stack (code-to-cloud, 1T events/day); multicloud support via SASE
            PoPs rather than dedicated transit fabric
        - label: Fortinet FortiGate
          x: 2
          y: 5
          description: >
            Highest security depth (>50% global NGFW share, ASIC-backed); cloud-VM deployment
            rather than cloud-native SaaS; lower multicloud breadth
        - label: AWS TGW + ANFW
          x: 1
          y: 2
          description: >
            AWS-only; deep integration but single-cloud; firewall at VPC perimeter only
        - label: Azure vWAN + Firewall
          x: 1
          y: 2
          description: >
            Azure-only; global hub-and-spoke; limited cross-cloud capability
        - label: Cato Networks
          x: 3
          y: 4
          description: >
            Global PoP backbone, full SASE stack, strong user-access focus; weaker
            workload east-west for large cloud deployments
        - label: Zscaler ZPA
