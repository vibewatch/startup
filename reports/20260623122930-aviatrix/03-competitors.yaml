  - id: incumbent-vendors
    title: Incumbents with Expanded Cloud Capabilities
    body: >
      Cisco Multicloud Defense provides a single SaaS control plane that manages security policy across
      public and private cloud environments, offering ingress, egress, and east-west traffic inspection from
      one management plane. This directly overlaps with Aviatrix's Distributed Cloud Firewall value
      proposition—blocking inbound attacks, lateral movement, and data exfiltration. Cisco differentiates
      through automation of underlying cloud network constructs and native Infrastructure-as-Code (IaC)
      integration, and it bundles Multicloud Defense within a broader Hybrid Mesh Firewall narrative that
      spans campus, data center, and cloud enforcement under unified policy. Cisco's go-to-market advantage
      is its large existing account base for Secure Firewall and Meraki, which enables cross-sell without
      Aviatrix's greenfield advantage.


      Palo Alto Networks takes a platform-consolidation approach with Prisma Cloud (code-to-cloud security
      analyzing 1 trillion events per day and detecting 1.5 million new attacks daily) and Prisma SASE (the
      company's "most comprehensive SASE" claim covering users, apps, data, and devices on a multicloud
      architecture). Palo Alto's Cortex platform strategy aggregates network security, endpoint, cloud
      security posture, and SOC capabilities under one vendor, making it a formidable incumbent in
      enterprise accounts. The risk to Aviatrix is greatest where a Palo Alto account already uses Prisma
      SD-WAN or Prisma Access, because Palo Alto has incentives to extend those customers into multicloud
      networking rather than allow a third-party like Aviatrix to land.


      Fortinet holds the #1 position in network firewalls worldwide with more than 50% global market share,
      backed by patented ASIC-based processing and AI/ML-powered threat intelligence (FortiGuard). FortiGate
      NGFWs include built-in ZTNA capabilities and SD-WAN integration, enabling Fortinet to offer an
      end-to-end solution that competes with the Aviatrix-plus-NGFW bundle. Fortinet also supports
      quantum-safe cryptography (post-quantum IPsec VPN) and has a quantum-safe roadmap, which matters in
      government and regulated-industry accounts. Its distribution advantage—largest installed base in the
      firewall market—is a structural barrier Aviatrix must account for when competing in brownfield
      enterprise environments.
