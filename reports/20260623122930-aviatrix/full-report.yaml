              AgentGuard's Deep AI Observability and Advanced AI Guardrails—the two capabilities that close the gap with
              in-process AI security tools—are Q3 2026 roadmap items. The ACS integration is in early access with
              limited production deployments. Buyers whose AI security requirements are current rather than aspirational
              should evaluate the product at GA, request reference customers running AgentGuard Network Enforcement in
              production, and confirm independent validation of the 15-minute shadow AI discovery claim.
            calloutType: recommendation
