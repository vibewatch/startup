  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing History and Current Valuation Context
        blocks:
          - type: paragraph
            body: >
              Aviatrix completed six disclosed funding rounds totaling approximately $346M–$414M (sources vary) between
              2015 and 2022. The defining event was the September 2021 Series E: $200M raised at a $2 billion post-money
              valuation, co-led by TCV (with TCV General Partner Tim McAdam joining the board) and joined by Insight
              Partners and Tiger Global alongside existing investors CRV, General Catalyst, and Greenspring Associates.
              At the time, Aviatrix claimed $15.7M ARR (April 2021 per Latka), implying a Series E entry multiple of
              approximately 127x ARR — extreme even by peak-ZIRP standards and difficult to reconcile with any
              forward-growth model unless ARR was significantly understated. No new primary equity round has been
              announced in the 4.5+ years since the Series E. The funding gap is ambiguous: it may indicate capital
              efficiency and internal cash generation, difficulty accessing new capital on acceptable terms, or
              deliberate patience waiting for better IPO conditions. As of June 23, 2026, Forge's pre-IPO platform lists
              Aviatrix (AVIA.PVT) with no current "Last Matched Price," indicating secondary-market illiquidity. Yahoo
              Finance and PM Insights reference a Forge price of $3.48/share as of June 22, 2026. Using the
              Forge-reported shares outstanding of 11,806,794 for one preferred class (likely incomplete versus
              fully-diluted share count), and cross-referencing with the $411M implied valuation derived elsewhere, the
              fully-diluted share count is estimated at approximately 118M shares. EquityZen separately reports total
              funding of $414M and 550+ customers, while Tracxn and Crunchbase report $346M and various figures. These
              discrepancies reflect normal data aggregator variance for private companies and do not indicate material
              discrepancies in the financing record. The SEC Form D accession 0001792033-19-000002 (November 2019)
              confirms Aviatrix Systems, Inc. as a Delaware corporation with a business address at 2901 Tasman Drive,
              Suite 109, Santa Clara, CA 95054 and a $46M Series C offering. No S-1 or comparable IPO filing appears in
              SEC EDGAR as of June 2026, confirming Aviatrix remains in private status.
