            title: Controller as Critical Blast-Radius Risk
            body: >
              CVE-2024-50603 (CVSS 10.0, CISA KEV, exploited Jan 2025) demonstrated that the Aviatrix Controller—the
              single policy orchestration point for all clouds—is an attractive, high-impact attack target. With 65% of
              Controller-deployed AWS environments having a default lateral-movement path to admin cloud control plane
              permissions, a Controller compromise can cascade to cloud-estate takeover. Aviatrix patched rapidly and
              proactively, but this architecture risk is structural and must be disclosed to buyers.
