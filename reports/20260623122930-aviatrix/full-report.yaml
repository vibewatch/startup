  - id: FV001
    title: Recommendation Logic Flow
    type: flow
    layout: standard
    summary: >
      Chain from market/proof, product/moat, financials, risks, and valuation inputs to the Hold/Watch investment
      recommendation for Aviatrix.
    data:
      nodes:
        - id: market-proof
          label: 'Market & Proof: Cloud security TAM $50B+; 550+ enterprise customers confirmed; product credibility validated'
        - id: product-moat
          label: 'Product & Moat: Multicloud-native architecture defensible; but PANW, Cisco, hyperscalers expanding overlap'
        - id: financials
          label: >-
            Financials: Est. $85–95M ARR (2026); ~81% growth 2023–2024; no confirmed P&L; capital efficiency below
            benchmark
        - id: risks
          label: >-
            Risks: High — $2B preference overhang; competitive encroachment; sector multiple compression; execution
            pivot risk
        - id: valuation
          label: >-
            Valuation: Secondary ~$411M vs. Series E $2B; base range $425M–$595M; Series E entry not supportable at
            current multiples
        - id: recommendation
          label: >-
            Recommendation: Hold / Watch — not actionable near $2B mark; secondary at <$500M requires confirmed ARR ≥
            $85M
      edges:
        - from: market-proof
          to: recommendation
        - from: product-moat
          to: recommendation
        - from: financials
          to: recommendation
        - from: risks
          to: recommendation
        - from: valuation
          to: recommendation
    approximationNotes: >-
      Recommendation logic is qualitative synthesis of all prior chapter evidence; node weights are not formally
      calibrated.
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV039
      - CV040
  - id: FV002
    title: Valuation Sensitivity — EV/ARR Multiple vs. ARR
    type: bar
    layout: wide
    summary: >
      Illustrates how enterprise value shifts across a 3x–10x EV/ARR multiple range at three ARR scenarios ($70M bear,
      $85M base, $95M bull), with the Forge secondary-implied $411M and Series E $2B marked for reference.
    data:
      items:
        - label: Bear ARR $70M @ 3x
          value: 210
        - label: Bear ARR $70M @ 5x
          value: 350
        - label: Base ARR $85M @ 5x
          value: 425
        - label: Base ARR $85M @ 7x
          value: 595
        - label: Bull ARR $95M @ 8x
          value: 760
        - label: Bull ARR $95M @ 10x
          value: 950
        - label: Forge Secondary Implied
          value: 411
        - label: Series E Valuation (2021)
          value: 2000
    approximationNotes: >
      All ARR values are third-party estimates. Multiple range derived from public cybersecurity peer set with 20–35%
      private discount. Series E $2B is a benchmark mark, not a current investable price.
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV034
  - id: FV003
    title: Valuation / Return Range — Scenario Outcomes
    type: range
    layout: standard
    summary: >
      Low-to-high enterprise value and implied Series E investor return across bull, base, and bear scenarios,
      illustrating the challenging return profile for Series E holders versus secondary buyers.
    data:
      items:
        - label: Bear Case (EV)
          low: 210
          high: 280
        - label: Base Case (EV)
          low: 425
          high: 595
        - label: Bull Case (EV)
          low: 760
          high: 950
        - label: Series E Break-Even (EV needed for 1x return)
          low: 2000
          high: 2000
    approximationNotes: >
      Ranges are based on estimated ARR × EV/ARR multiple scenarios. Return is for hypothetical Series E investor
      assuming $200M entry at $2B post-money. Does not model preference waterfall or dilution; actual per-share returns
      require full cap table analysis.
    claimRefs:
      - CV031
      - CV032
      - CV033
      - CV035
      - CV036
  - id: FV004
    title: Investment KPIs — IC-Ready Scoring
    type: kpi
    layout: standard
    summary: >
      Investment committee-ready scoring across market opportunity, product proof, competitive moat, financial
      economics, risk profile, valuation, and evidence quality.
    data:
      items:
        - label: Market Opportunity
          value: 7
          max: 10
          note: Large TAM ($50B+ cloud security), growing at 25%+ CAGR; clear enterprise demand signal.
        - label: Product Proof
          value: 6
          max: 10
          note: 550+ enterprise customers, Deloitte Fast 500 (4x), but ARR scale is unconfirmed.
        - label: Competitive Moat
          value: 5
          max: 10
          note: Cloud-agnostic architecture is differentiated; eroding from PANW, Cisco, hyperscaler expansion.
        - label: Financial Economics
          value: 4
          max: 10
          note: ARR estimated $64–95M; capital efficiency ~18%; no confirmed margin or profitability data.
        - label: Risk Profile
          value: 3
          max: 10
          note: 'High: $2B preference overhang, sector multiple compression, execution pivot risk, illiquid secondary.'
        - label: Valuation (at secondary ~$411M)
          value: 5
          max: 10
          note: In-line with base case; acceptable entry IF ARR confirmed; not discounted vs. risk profile.
        - label: Evidence Quality
          value: 4
          max: 10
          note: No primary financial disclosures; all ARR/revenue data is third-party estimated or algorithmic.
    approximationNotes: >
      KPI scores are qualitative analyst judgment on a 1–10 scale. Not a quantitative model output. Intended as an IC
      discussion framework, not a definitive rating.
    claimRefs:
      - CV039
      - CV040
      - CV042
      - CV046
