      - number: '2.5'
        title: Diligence Gaps, Contradictory Estimates, and SAM Uncertainty
        blocks:
          - type: paragraph
            body: >-
              This chapter preserves material uncertainties rather than resolving them artificially. The most
              significant gap is the absence of any analyst-sourced SAM or SOM for Aviatrix's specific
              distributed-cloud-firewall-plus-multicloud-networking boundary. The three nearest proxies — cloud security
              (USD 34–46 billion in 2026 depending on source scope), SASE (USD 19.19 billion in 2026), and multi-cloud
              networking (USD 7.6 billion by 2027) — are non-comparable, address different spend categories, and none
              maps cleanly to Aviatrix's actual product scope. The scope discrepancy between MnM's 2026 cloud security
              estimate of USD 34.37 billion and GVR's 2024 baseline of USD 35.84 billion (which extrapolates to
              approximately USD 46 billion by 2026 at GVR's 13.3% CAGR) represents a more than 30% spread for the same
              headline category in roughly the same period. Neither firm explains what drives the discrepancy. A second
              gap concerns Aviatrix's private financial metrics: with no disclosed ARR, no post-2021 valuation update,
              and no 2024-2026 headcount figure confirmed, it is impossible to assess current market share against any
              of the sizing lenses. The company's 500+ enterprise customer count and 10% Fortune 500 penetration confirm
              meaningful traction, but without revenue per customer, these metrics cannot bridge from broad TAM to
              Aviatrix's actual revenue capture. Third, the multi-cloud networking market estimate (MnM September 2022)
              predates Aviatrix's 2023-2026 security pivot and may underweight the security enforcement layer that now
              anchors Aviatrix's pitch. These gaps must be preserved as open diligence asks and not resolved through
              assumption.
