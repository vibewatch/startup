  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Strategic and Competitive Risks
        blocks:
          - type: paragraph
            body: >
              Aviatrix's primary strategic risk is hyperscaler commoditization of its core transit-networking use case.
              AWS Cloud WAN provides a managed wide-area network service connecting branch offices, data centers, and
              VPCs with only a few clicks and centralised policy management—directly overlapping Aviatrix's transit
              networking value proposition. Azure Virtual WAN offers a full-mesh, hub-and-spoke managed architecture
              integrating routing, encryption, site-to-site VPN, and ExpressRoute, with auto-scaling and built-in Azure
              Firewall integration. Google Network Connectivity Center adds Partner Cross-Cloud Interconnect for AWS and
              Azure, enabling organisations to use GCP as a WAN backbone—squeezing the multicloud networking niche that
              Aviatrix pioneered. AWS Transit Gateway and Network Firewall remain the baseline competing stack for
              single-cloud AWS environments, offering free-tier integration and native scaling that Aviatrix must
              overcome on price-performance justification. Cisco Multicloud Defense and Palo Alto Prisma Cloud are
              established enterprise alternatives in the cloud firewall segment, with Cisco carrying existing enterprise
              relationships that Aviatrix's newer channel program must displace. Wiz's platform expands into detection
              and response capabilities while maintaining a large developer ecosystem, creating a credible adjacent
              threat from the CNAPP direction. The CEO-led pivot from networking to security adds a second layer of
              strategic risk: expanding the competitive landscape to include SASE vendors, CNAPP players, and zero-trust
              vendors who were previously only partial overlaps. The company risks being caught between its original
              networking identity and a crowded security market before the pivot is fully executed.
