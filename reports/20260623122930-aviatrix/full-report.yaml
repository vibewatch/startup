  - id: FU001
    title: Aviatrix Customer Journey Map — Segments, Touchpoints, and Expansion Loops
    type: journey-map
    layout: wide
    summary: >-
      Maps the enterprise buyer's path from initial discovery through multicloud deployment expansion, annotated with
      evidence from named customer case studies.
    data:
      items:
        - label: Stage 1 — Discover (ACE Community & Marketplace)
          description: >-
            ACE certification community (8,366 members) and Aviatrix blog attract practitioners; AWS and Azure
            Marketplace listings surface the platform during cloud procurement reviews; Equinix and VAR partner
            referrals (Presidio, WWT) drive top-down introductions at financial services and industrial accounts.
            Representative segments: large enterprise FS, hospitality, industrial.
        - label: Stage 2 — Evaluate (POC & IaC Assessment)
          description: >-
            Proof-of-concept on a bounded use case — typically multi-cloud transit or egress control; Terraform module
            consistency across clouds and CoPilot visibility demo differentiate vs. native CSP tools; ACE training
            reduces technical friction during evaluation. Representative segments: all enterprise, with regulated
            industries (FS, healthcare, aviation) having longer compliance-driven cycles.
        - label: Stage 3 — Deploy (Initial Production)
          description: >-
            Initial production deployment of transit gateways and Aviatrix Controller; IaC automation enables
            sub-one-hour workload provisioning (HAPEV); Equinix edge integration extends connectivity to co-location
            points; compliance workloads (FAA, HIPAA, PCI DSS) drive initial security policy configuration. All 14 named
            case studies confirm production (not pilot) status.
        - label: Stage 4 — Expand (Land-and-Expand)
          description: >-
            Customers add Distributed Cloud Firewall, CNSF, HPE encryption, and FQDN filtering after initial transit
            deployment; M&A integration use cases at AB InBev and Aegon unlock additional workloads; AI workload
            security modules (AgentGuard, CNSF) increasingly targeted at existing accounts with AI infrastructure.
            Across AI (2026) represents a new agentic AI vertical expansion pattern.
