            body: >
              Gross margin, NRR, CAC, burn, and runway are all private. Available ARR figures are third-party estimates.
              Investment underwriting requires audited gross margin, cohort NRR by vintage, monthly burn and runway, and
              a confirmed ARR schedule. These cannot be estimated with precision from public data. The absence of a new
              primary raise in 4+ years is ambiguous: the company may be capital-efficient and profitable, or it may be
