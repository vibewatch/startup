            title: Hold/Watch — Not Actionable Near Series E Mark
            body: >
              At the $2B Series E valuation, Aviatrix would require $250–333M ARR at current market multiples —
              approximately 3–5x its third-party-estimated current ARR. Secondary purchases below $500M are more
              defensible on a base-case basis, but require: (1) confirmed ARR ≥ $80M, (2) NRR > 110%, (3) a clear exit
              catalyst (IPO or M&A), and (4) cap table diligence on the preference stack. Until these conditions are
              met, the stance is Hold/Watch.
