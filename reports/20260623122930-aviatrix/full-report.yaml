      - number: '5.3'
        title: AI Security and 2026 Roadmap
        blocks:
          - type: paragraph
            body: >
              Aviatrix launched AgentGuard in early access (June 2026) to address AI agent governance. The product takes
              a network-native approach: security teams deploy it without requiring developers to install SDKs or change
              application code. Shadow AI Discovery—available immediately in early access—analyzes VPC Flow Logs, DNS
              logs, and Cloud Asset Inventory to surface every AI agent, MCP server, and LLM endpoint in a cloud
              environment within 15 minutes, including shadow agents that application teams did not authorize. The
              product risk-scores each discovered workload by blast radius.

              AgentGuard comprises four progressive capabilities: (1) Shadow AI Discovery (early access now); (2)
              Network Enforcement, available today via Zero Trust for AI Workloads; (3) Deep AI Observability (MCP
              invocation and tool traffic inspection); and (4) Advanced AI Guardrails—both #3 and #4 are on the roadmap
              for Q3 2026. AgentGuard covers AI agent frameworks including Strands, LangChain, and AutoGen, and supports
              major LLM providers (OpenAI, Anthropic, Bedrock, Vertex, Cohere, Mistral).

              On June 4, 2026, Aviatrix announced it is one of the first multicloud network-layer enforcement substrates
              for the Microsoft Agent Control Specification (ACS)—an open standard unveiled at Microsoft Build 2026. The
              integration carries a single .guardrails.yaml policy file from the agent runtime into live network
              enforcement across AWS, Azure, GCP, and on-premises Kubernetes via CI/CD. Aviatrix's CPO Chris McHenry
              noted: "After running Microsoft Agent Control Specification in private preview, what became clear is that
              a shared standard is only as strong as the layer that enforces it everywhere the agent operates." The
              integration is available at no additional cost to existing Aviatrix customers.

              On June 8, 2026, Aviatrix joined OISF as a consortium member to advance Suricata for cloud-native
              environments. Suricata has been embedded in the Aviatrix platform as its core IPS engine since initial
              integration—performing deep packet inspection, processing custom rulesets, and decrypting TLS traffic in
              IPS + TLS Decrypt mode. Aviatrix has developed 556 purpose-built Suricata rules for AI-specific threat
              categories: prompt injection and jailbreak detection, sensitive data leakage, malicious tool usage, data
              exfiltration, and agent-to-agent threats. Aviatrix's OISF membership contributes these rules and
              multicloud reference architectures (AWS, Azure, GCP) back to the open-source community.

              OWASP's 2025 Top 10 for Agentic Applications and the LiteLLM supply chain attack (March 2026, affecting
              versions 1.82.7–1.82.8) provide external validation of the network-layer enforcement thesis: a poisoned
              dependency running inside the trusted process can exfiltrate credentials to external endpoints, bypassing
              any SDK guardrail. Deep AI Observability and Advanced AI Guardrails remain roadmap items with an
              unverified Q3 2026 timeline.
