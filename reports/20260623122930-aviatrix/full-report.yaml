  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Included Spend, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Aviatrix competes at the intersection of multi-cloud networking infrastructure and cloud-native security
              enforcement, a category that does not map cleanly onto any single analyst definition. Included spend
              encompasses workload-to-workload traffic enforcement across multi-cloud and hybrid-cloud environments
              (east-west and north-south flows), distributed cloud firewall policy management, multi-cloud network
              visibility and analytics, zero trust network access (ZTNA) for both user-to-application and
              workload-to-workload traffic, cloud networking operations tooling including transit gateways and route
              management, and Kubernetes network security policy enforcement. Excluded spend includes endpoint detection
              and response (EDR), email security gateways, SIEM/SOAR platforms, single-cloud native controls (AWS
              Security Groups, Azure NSGs) used in isolation without cross-cloud policy, physical network appliances,
              and data loss prevention tooling unrelated to network enforcement. Status-quo substitutes include
              cloud-native networking and firewall services from hyperscalers (AWS Network Firewall, Azure Firewall,
              Google Cloud Firewall), traditional network security vendors extending to cloud (Palo Alto Prisma, Cisco
              Multicloud Defense), SASE platforms with competing cloud networking capabilities (Zscaler, Netskope,
              Cloudflare One), and in-house custom multi-cloud networking built on open-source transit or routing tools.
              The market sits at the structural convergence of cloud security — estimated at USD 34.37 billion in 2026
              by MarketsandMarkets and USD 35.84 billion in 2024 by Grand View Research — and the broader enterprise
              network security category projected at USD 84.50 billion in 2025 (MarketsandMarkets). Defining the
              boundary precisely before any sizing exercise is essential: Aviatrix's value proposition spans both
              categories but does not capture the full spend of either.
            claimRefs:
