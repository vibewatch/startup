      - number: '8.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Financial Opacity Creates Material Valuation Uncertainty
            body: >
              Aviatrix has not publicly disclosed ARR, revenue, gross margin, or any other financial metric. All figures
              used in this analysis are third-party estimates (Latka, Growjo, Sacra). The spread between the most
              reliable estimate ($64M Latka, Oct 2024) and the highest estimate ($135M Growjo) is a 2x range — a
              difference that shifts the base-case enterprise value by $425M–$675M. Investors must treat all valuation
              scenarios as wide-confidence-interval estimates until primary financial disclosure is obtained.
