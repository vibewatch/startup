      - number: '4.4'
        title: Unit Economics, Margins, and Comparable Context
        blocks:
          - type: paragraph
            body: >
              Aviatrix discloses no standard SaaS operating metrics. Gross margin, net revenue retention (NRR), gross
              revenue retention (GRR), customer acquisition cost (CAC), lifetime value (LTV), and payback period are all
              private. Using public-company comparables as a proxy: Zscaler (the closest public peer in cloud network
              security) reports non-GAAP gross margins of approximately 80–81%; Cloudflare reports approximately 75–77%
              non-GAAP gross margins. Software-only deployment models (Aviatrix does not operate managed infrastructure
              beyond controllers) typically support gross margins of 70–80% for mature SaaS companies. Aviatrix's cost
              structure is likely dominated by R&D (engineering for platform development and cloud-provider
              integrations) and sales and marketing (enterprise field sales, channel enablement, and customer success).
              Professional services costs may compress blended gross margins if implementation revenue is included in
              the top-line ARR figures.

              For valuation context, the SaaS Capital Index showed a median public SaaS ARR multiple of 7.0x as of early
              2025. The DealMatrix benchmark for the privacy and security sector (Q1 2025) was 3.8x EV/ARR as a median
              for private companies. Using Latka's 2024 ARR estimate of $63.9M and Aviatrix's $2B Series E valuation,
              the implied multiple is approximately 31x — reflecting peak-2021 conditions that are structurally stale.
              Applying the Forge secondary market implied valuation of $411M yields approximately 6.4x on 2024 ARR — at
              the upper bound of the private security SaaS median (3.8x) but below the public SaaS sector median. Growjo
              estimates revenue per employee at approximately $259K based on ~521 employees and $135M estimated ARR,
              below the ~$300K benchmark associated with efficient enterprise SaaS at scale.
