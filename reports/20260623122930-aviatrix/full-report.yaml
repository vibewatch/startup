            body: >
              CNSF enforces policy at every workload without agents, SDKs, or application changes. DCF SmartGroups and
              inline spoke gateway enforcement give security teams unilateral control over workload communication
              governance—independently of developer workflows or runtime trust. This is structurally superior to
              SDK-based guardrails for AI agents and to IP-based native cloud security groups for east-west governance.
