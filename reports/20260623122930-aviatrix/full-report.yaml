      - number: '4.3'
        title: Capital Adequacy and Funding Position
        blocks:
          - type: paragraph
            body: >
              Aviatrix has raised approximately $346M (Tracxn) to $383M (Yahoo Finance / Sacra) across six rounds since
              founding in 2014. The funding history — Series A ($10M, Sep 2015), Series B ($15M, Jan 2017), Series C
              ($46M, Oct 2019), Series D ($75M, Feb 2021), and Series E ($200M, Sep 2021) — reflects an increasingly
              rapid cadence that peaked in 2021 alongside the broader SaaS market. The Series E was led by TCV with
              participation from Insight Partners and Tiger Global as new investors, and existing investors including
              CRV, General Catalyst, Greenspring Associates, Meritech Capital, TrueBridge Capital Partners, Ignition
              Partners, and Liberty Global Ventures. The round established a $2B valuation, more than doubling the
              company's value in six months from the Series D.

              As of June 2026, more than four years have elapsed since the last primary funding round with no public
              announcement of a new raise. This absence could indicate the company is approaching profitability or
              operating on strong internal cash generation, or alternatively that market conditions made an equity raise
              unattractive at the $2B Series E mark. The Forge secondary market price of $3.48/share as of June 22, 2026
              implies a market capitalization of approximately $411M — a roughly 79% markdown from the Series E
              valuation, consistent with the 60–70% post-peak contraction seen across private high-growth SaaS companies
              since 2022. Cash on hand, monthly burn rate, and runway are not publicly disclosed. No public evidence of
              debt financing, credit facilities, or project-finance obligations has been identified, but these cannot be
              ruled out for a private company at this scale. The appointment of a new CFO (Ken Tinsley) as reported in
              November 2025 signals continued financial infrastructure investment and possible preparation for a future
              capital event.
