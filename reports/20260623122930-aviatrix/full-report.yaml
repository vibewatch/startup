      - number: '7.3'
        title: Leadership, Governance, and Execution Risks
        blocks:
          - type: paragraph
            body: >
              Aviatrix underwent a CEO transition in July 2023 when founder Steve Mullaney— who built the company from
              scratch to a $2 billion valuation—handed leadership to Doug Merritt, the former president and CEO of
              Splunk. At Splunk, Merritt grew annual recurring revenue from approximately $100 million to nearly $3
              billion over six years. The strategic competence is well-documented, but the Aviatrix pivot is
              structurally different: Merritt is repositioning the company in a crowded security market rather than
              scaling an already-dominant analytics platform. His departure from Splunk followed a $1 billion Silver
              Lake private equity investment in 2021, and he has not previously completed an organic growth trajectory
              in a directly competitive security category.

              Aviatrix hired several senior leaders in 2024-2025—CRO Ken Horner (ex-Cloudflare, where he drove ~100% YoY
              enterprise growth for two consecutive years), CMO Scott Leatherman, and multiple VPs—indicating that
              significant leadership churn accompanied the pivot. The BankInfoSecurity report from July 2025 confirms
              that Merritt rebuilt the leadership team specifically with cybersecurity expertise, conceding that the
              prior team was not optimally configured for the new security direction. While the incoming bench is
              experienced, the simultaneous replacement of CRO, CMO, and multiple functional VPs represents elevated
              execution risk at the GTM layer, particularly with a new channel partner program simultaneously being
              launched. Key-person risk also centers on Merritt himself: without a Chief Operating Officer listed
              publicly, operational continuity risk is elevated if he were to depart.
            claimRefs:
              - CR014
