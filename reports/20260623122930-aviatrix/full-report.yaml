      - number: '8.2'
        title: Public Comparable Set and Market Multiple Analysis
        blocks:
          - type: paragraph
            body: >
              Aviatrix operates at the intersection of cloud networking and network security, placing it in a comparable
              set that spans pure-play cloud security vendors (Zscaler, CrowdStrike), broad cybersecurity platforms
              (Palo Alto Networks, Fortinet), and infrastructure-adjacent networking/identity plays (Cloudflare, Okta).
              As of June 2026, the publicly observable EV/revenue multiples span a wide range reflecting divergent
              growth profiles and market narratives. Zscaler (ZS), the most direct functional analog as a cloud-native
              security vendor, trades at approximately 6.6x trailing-twelve-months revenue — a severe compression from
              its October 2025 peak P/S ratio of 18.2x (per Macrotrends historical data). Zscaler's market cap has
              declined approximately 55% year-over-year, driven by slower growth outlook and AI-disruption concerns. Its
              FY2025 10-K (SEC filing, September 2025) confirms $2,673M revenue (23.3% growth) and continued net losses
              of $41.5M. Palo Alto Networks (PANW) commands a 22.4x multiple on its platform-consolidation premium and
              strong ARR of $3.5B+. CrowdStrike (CRWD, 34.5x) and Cloudflare (NET, 34.9x) trade at high multiples on
              superior growth rates (21-32%). Fortinet (FTNT, 15.3x) benefits from diversified hardware-software model
              with positive earnings. Okta (OKTA, 6.9x) trades at a discount reflecting slower growth and identity
              market saturation. The relevant valuation band for Aviatrix — a mid-scale private company with uncertain
              ARR growth and incomplete financials — centers on the 5–10x range, reflecting a peer-company blend of the
              slower-growth comps (ZS, OKTA, FTNT) with a private-company discount of 20–35% versus comparable public
              peers. Damodaran's January 2025 dataset confirms a median EV/Sales of 9.01x for EBITDA-positive software
              companies and 9.56x for Internet software firms, consistent with this range. DealMatrix benchmarks the
              Privacy and Security sector at a median EV/Sales of approximately 7.3x.
