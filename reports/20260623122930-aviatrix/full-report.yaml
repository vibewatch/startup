      - number: '4.2'
        title: Pricing Architecture and GTM Economics
        blocks:
          - type: paragraph
            body: >
              Aviatrix uses a custom-quoted enterprise pricing model with no public list price. As of June 2026,
              CostBench documents two tiers — Basic and Enterprise — ranging from approximately $2,500 to $15,000 per
              month. The per-unit infrastructure layer charges approximately $0.14 per hour per gateway (~$102/month)
              and ~$0.16 per hour per VPC attachment (~$117/month). Vendr's buyer-side benchmarks, drawn from actual
              enterprise purchasing data, show a median annual contract value of $194,034. There are documented hidden
              costs beyond list price — implementation fees, training, and add-on modules — estimated at 15–23% of the
              contract total, pushing all-in median spend higher. High-availability deployments requiring redundant
              gateways effectively double gateway costs.

              Aviatrix's go-to-market strategy is structured around a direct enterprise sales force (led by CRO Ken
              Horner, appointed in 2025) and an indirect channel spanning value-added resellers (VARs), independent
              software vendors (ISVs), and cloud service providers (CSPs). The company publicly references 10% Fortune
              500 penetration and 500+ total enterprise customers, suggesting a typical ACV in the low-to-mid six
              figures that is consistent with the Vendr median. Sales cycle, customer acquisition cost (CAC), and
              payback period are not publicly disclosed. The CAC structure is likely elevated given the enterprise
              motion and the technical complexity of multicloud deployments, but no proxy data is available to quantify
              this. The channel partner program formally launched in 2024–2025 and is positioned as a key lever for
              scaling revenue without proportional headcount growth, though no channel revenue split has been disclosed.
