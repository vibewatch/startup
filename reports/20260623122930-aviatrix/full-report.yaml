              cloud resource usage. Monthly list pricing ranges from $2,500 to $15,000 depending on tier. These ACVs
              indicate a mid-to-large enterprise buying pattern consistent with six-to-twelve-month procurement cycles
              and multi-stakeholder sign-off.

              Community growth signals complement the revenue trajectory. The Aviatrix community
              (community.aviatrix.com) shows 8,366 registered members, 969 topics, and 1,355 replies, with ACE
