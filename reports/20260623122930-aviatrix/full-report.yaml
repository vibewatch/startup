    data:
      columns:
        - Low Impact
        - Medium Impact
        - High Impact
        - Critical Impact
      rows:
        - label: Low Likelihood
          values:
            - IP / patent litigation
            - FedRAMP authorization delay
            - GDPR compliance gap
            - null
        - label: Medium Likelihood
          values:
            - Financial opacity investor friction
            - Channel execution gap
            - Valuation markdown risk
            - Category-pivot misexecution
        - label: High Likelihood
          values:
            - AWS/Azure API change
            - Customer concentration (unknown)
            - Controller SPOF risk
            - Hyperscaler feature parity
        - label: Near-Certain
          values:
            - null
            - Regulatory compliance investment
            - Leadership attrition
            - CVE-2024-50603 trust deficit
    approximationNotes: >
      Likelihood rows from top: Low, Medium, High, Near-Certain. Ratings are analyst judgments based on public evidence
      and comparable SaaS risk profiles; not model-generated probabilities.
