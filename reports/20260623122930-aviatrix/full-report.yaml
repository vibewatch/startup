      - number: '3.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Hyperscaler-Native Displacement Risk at the Low End
            body: >
              Enterprises starting their multicloud journey may find AWS Transit Gateway plus Network Firewall or Azure
              Virtual WAN plus Azure Firewall sufficient for their initial needs—at near-zero incremental cost within
              existing cloud committed spend. Aviatrix's addressable window opens only when multicloud complexity
              exceeds a threshold that hyperscaler tools cannot manage. If hyperscalers continue to improve
              cross-account and cross-region orchestration, that threshold rises, shrinking the addressable market that
              requires a third-party overlay.
            calloutType: risk
            claimRefs:
              - CP021
              - CP037
              - CP047
          - type: callout
            title: Incumbent Platform Bundling as a Structural GTM Barrier
            body: >
              Cisco's ability to bundle Multicloud Defense into Enterprise License Agreements and Palo Alto's
              Cortex/Prisma platform incentive structure means both incumbents can offer multicloud networking
              capabilities as a near-zero incremental cost add to an existing renewal. Aviatrix requires a net-new
              procurement decision. In enterprise accounts where Cisco or Palo Alto already holds a dominant position,
              Aviatrix faces an asymmetric buying process that favors the incumbent regardless of technical merit.
            calloutType: risk
            claimRefs:
              - CP038
              - CP043
              - CP046
          - type: callout
            title: Aviatrix Co-Sells with the Vendors That Threaten It Most
            body: >
              Aviatrix's integration with Palo Alto, Fortinet, and Cisco creates both a co-sell GTM advantage and a
              structural co-dependency. The integration model is a near-term win—it lets Aviatrix embed in large Palo
              Alto or Fortinet accounts—but is a long-term vulnerability: if any partner develops its own multicloud
              transit capability (as Cisco has done with Multicloud Defense), the integration becomes a competitive
              entry point. Aviatrix must continuously monitor partner product roadmaps and ensure its orchestration
              capabilities remain indispensable rather than replicable.
            calloutType: insight
            claimRefs:
              - CP005
