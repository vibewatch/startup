        title: Scale Metrics and Market Presence
        blocks:
          - type: paragraph
            body: >
              Aviatrix publicly claims 500+ enterprise customers globally as of 2025–2026, with the customer base
              reportedly including approximately 10% of the Fortune 500. Named reference customers visible on the
              company's customers page include Anheuser-Busch InBev, IHG Hotels and Resorts, Republic Airways, and
