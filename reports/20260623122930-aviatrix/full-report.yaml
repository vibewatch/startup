              meaningful switching costs. However, all expansion evidence comes from company-published case studies, and
              the degree of multi-product adoption (e.g., combined CNSF + DCF + HPE uptake) is not independently
              verified.

              Customer concentration risk is unknown. The public reference base is dominated by Global 2000 accounts;
              whether one or several of these represent a disproportionate revenue share is impossible to determine from
              public data. The partner channel (AWS Marketplace, Azure Marketplace, Equinix, WWT, Presidio) adds buying
