      - number: '7.2'
        title: Security and Technical Risks
        blocks:
          - type: paragraph
            body: >
              CVE-2024-50603, a CVSS 10.0 unauthenticated remote code execution flaw in the Aviatrix Controller, was
              disclosed in January 2025 and immediately weaponised in the wild. Wiz tracked multiple active incidents,
              finding approximately 3% of cloud enterprise environments run Aviatrix Controller and that 65% of those
              have a lateral movement path to administrative cloud control plane permissions. Active exploitation
              deployed XMRig cryptocurrency miners and the Sliver command-and-control framework, with researchers noting
              likely data exfiltration via enumerated cloud permissions. CISA added the vulnerability to its Known
              Exploited Vulnerabilities (KEV) catalog on January 16, 2025, requiring Federal Civilian Executive Branch
              agencies to patch by February 6, 2025. A public proof-of-concept was available upon disclosure. Aviatrix
              issued a hot patch in early November 2024 and permanent fixes for supported Controller versions 7.1 and
              7.2 on December 19, 2024; customers on unsupported versions were exposed for the full window.

              Beyond the specific CVE, the Controller's central role in policy enforcement creates an inherent
              single-point-of-failure risk: compromise or downtime of the Controller affects policy enforcement and
              visibility for all managed workloads and clouds. AWS Cloud environments have been documented as allowing
              Aviatrix Controller privilege escalation by default, which amplifies the blast radius of any future
              Controller compromise. The platform's agentless architecture—while an operational strength— relies
              entirely on hyperscaler API stability; provider-side API changes, deprecations, or quota restrictions can
              silently break connectivity or enforcement policies. The steep implementation complexity documented in G2
              and TrustRadius customer reviews increases the probability of operational misconfiguration that could open
              lateral movement paths or policy gaps.
