  - id: FP003
    title: Aviatrix Competitive Moat and Readiness KPIs
    type: kpi
    layout: standard
    summary: >
      Qualitative assessment of Aviatrix's competitive moat dimensions, rated on a three-level scale (Strong / Moderate
      / Weak) based on available evidence.
    data:
      items:
        - label: Cloud-neutral control plane stickiness
          value: Strong
          description: >
            High switching cost once multicloud topology is deployed; competitors must offer migration tooling to
            displace
        - label: Partner NGFW ecosystem breadth
          value: Moderate
          description: |
            Integration with Palo Alto, Fortinet, Check Point is an advantage; risk if partner builds competing transit
        - label: Distribution / channel power
          value: Weak
          description: |
            Cisco, Palo Alto, Fortinet have deeper incumbent account relationships and bundling leverage than Aviatrix
        - label: Multicloud breadth (AWS + Azure + GCP + OCI)
          value: Strong
          description: >
            Broadest supported cloud footprint among pure-play peers; differentiates from hyperscaler-native
            alternatives
        - label: SASE and ZTNA native capability
          value: Weak
          description: >
            Relies on partner integrations for ZTNA; vulnerable if buyers consolidate on a single SASE platform that
            includes transit
        - label: CoPilot observability and ops workflow lock-in
          value: Moderate
          description: >
            Operational dashboards and troubleshooting workflows create process-level stickiness; needs continued
            differentiation vs. native cloud tools
        - label: Pricing competitiveness vs. hyperscaler-native
