  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and ARR Trajectory
        blocks:
          - type: paragraph
            body: >
              Aviatrix operates a B2B SaaS model built on annual enterprise subscriptions for its multicloud networking
              and cloud network security platform. Revenue accrues primarily through gateway software licenses sold on a
              subscription basis, augmented by professional services, premium support, and training revenue from its
              Aviatrix Certified Engineer (ACE) program. The platform is deployed as software-defined gateways in
              customer cloud environments rather than as a managed service, which limits Aviatrix's hosting cost
              exposure and supports software-like gross margins in theory, though actual margins remain undisclosed.

              Third-party data from Latka estimates Aviatrix's ARR at approximately $63.9M as of October 2024, up from
              roughly $35.3M in November 2023 and $15.7M in early 2021. This represents compound annual growth of
              approximately 66% from 2021 to 2024 and a single-year acceleration of roughly 81% from 2023 to 2024. These
              figures are Latka's compiled estimates and have not been publicly confirmed by Aviatrix. Revenue quality
              indicators are positive: multi-year enterprise contracts, a customer base of 500+ enterprises including
              roughly 10% of the Fortune 500, and four consecutive Deloitte Technology Fast 500 rankings (2022–2025)
              measured on fiscal-year revenue growth from 2021 to 2024. A third-party site (Growjo) extrapolates current
              ARR at approximately $135M, but this algorithmic projection carries high uncertainty and should be treated
              as an upper-bound estimate only.

              The company's pivot in 2024–2025 from pure multicloud networking to a cloud network security position —
              anchored by the Cloud Native Security Fabric (CNSF) and Zero Trust for Workloads — may affect revenue
              recognition patterns if bundling or rebundling occurs, but no evidence of a material revenue recognition
              change has been identified. Revenue appears to be recognized ratably over the contract term per standard
              SaaS accounting.
