  - id: TV002
    title: Thesis / Anti-Thesis Table
    columns:
      - Argument Type
      - Argument
      - What Would Change the View
    rows:
      - - Thesis
        - >-
          Cloud-agnostic multicloud networking/security architecture is defensible: enterprises with 3+ cloud
          environments need a vendor-neutral control plane that hyperscalers cannot neutralize.
        - >-
          Hyperscalers expand native cross-cloud management with comparable Aviatrix feature parity at lower cost, or a
          major security vendor acquires the category.
      - - Thesis
        - >-
          Aviatrix's pivot to cloud network security aligns with the fastest-growing segment of enterprise security
          spend, potentially expanding TAM and justifying higher multiples.
        - >-
          Pivot stalls: ARR growth decelerates below 15%, indicating the networking-to-security transition is not
          resonating with buyers.
      - - Anti-Thesis
        - >-
          The $2B Series E valuation embedded assumptions of hyperscale ARR growth that have not materialized at the
          expected rate; the preference overhang makes common equity nearly worthless at any realistic near-term exit.
        - New primary round at $2B+ pre-money, or confirmed $200M+ ARR at strong margins, would force a reassessment.
      - - Anti-Thesis
        - >-
          SaaS sector multiple compression — exacerbated by AI existential risk narratives in Q1 2026 — creates a
          structural headwind: even strong ARR growth will not restore ZIRP-era multiples, and Aviatrix needs those
          multiples to justify its last primary mark.
        - >-
          Sector re-rating (ZS/CRWD multiples return to 15x+), combined with demonstrated profitability and ARR scale,
          would make the $2B a recoverable mark over a 5–7 year horizon.
