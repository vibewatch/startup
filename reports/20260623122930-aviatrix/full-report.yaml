      - number: '5.4'
        title: Trust, Compliance, and Security Controls
        blocks:
          - type: paragraph
            body: >
              Aviatrix's Trust Center (trust.aviatrix.com) lists five audits and certifications: SOC 2 (document
              available), ISO 27001, TISAX, GDPR compliance, and CCPA compliance. An additional 30 documents cover
              policies (15), pentest reports (2), HR practices (6), and other categories. The platform's product-level
              claims include support for HIPAA 2025, PCI DSS 4.0, DORA, NIS2, and CISA Zero Trust Maturity Model (ZTMM)
              2.0 through audit-ready compliance telemetry generated by CoPilot and enforced by HPE.

              The most material security risk is CVE-2024-50603, a CVSS 10.0 unauthenticated remote code execution
              vulnerability in the Aviatrix Controller API, discovered by Jakub Korepta at Securing and first disclosed
              in late October 2024. The vulnerability resulted from API endpoints failing to sanitize user-supplied
              input, allowing OS command injection. Wiz reported that 3% of cloud enterprise environments had the
              Aviatrix Controller deployed, and 65% of those environments had a lateral movement path to administrative
              cloud control plane permissions by default on AWS. Active exploitation was observed in January 2025,
              deploying XMRig cryptocurrency miners and the Sliver C2 framework. CISA added CVE-2024-50603 to the Known
              Exploited Vulnerabilities catalog on January 16, 2025, requiring federal agencies to patch by February 6,
              2025. Aviatrix issued a hot patch in early November 2024 for versions down to 6.7 (including some
              end-of-support releases) and permanent fixes for supported trains 7.1 (v7.1.4191) and 7.2 (v7.2.4996) on
              December 19, 2024—prior to the public PoC exploit's availability. The company ran targeted customer
              outreach campaigns and pushed in-product banners to maximize patch coverage before public disclosure on
              January 7, 2025.

              The Controller-as-single-orchestration-point architecture is a structural risk: a compromised Controller
              could affect policy enforcement across an entire enterprise multi-cloud estate. Aviatrix supports
              Controller HA configurations, and the spoke gateways continue to enforce last-known-good policy when
              disconnected from the Controller, but the CVE-2024-50603 incident underscores the need for rigorous
              Controller access hardening.
            claimRefs:
