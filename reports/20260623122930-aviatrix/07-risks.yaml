  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: financial-opacity
      missingEvidence: >
        Aviatrix ARR, burn rate, gross margin, cash position, and capital runway as of
        June 2026 — none are publicly disclosed for this private-undisclosed company.
      whyItMatters: >
        Without financial data, it is impossible to assess whether the $2B 2021 valuation
        is still valid, whether the company has adequate runway to complete the security
        pivot, or whether near-term capital needs could trigger a dilutive event.
      diligencePath: >
        Request audited financial statements and board-approved financial projections in
        formal diligence; cross-check with investor letters of intent and term sheets
        for the Series E and any bridge rounds.
      relatedQuestionRefs:
        - QR014
        - QR019

    - type: private-evidence-only
      severity: material
      topic: customer-concentration
      missingEvidence: >
        Revenue breakdown by customer, vertical, or geography; top-10 customer revenue
        concentration; NRR and GRR by cohort — none publicly available.
      whyItMatters: >
        Undisclosed concentration could mean the ARR is highly dependent on a handful of
        Fortune 500 accounts, amplifying churn and renewal risk materially beyond what the
        500+ headline count implies.
      diligencePath: >
        Request customer ARR waterfall, top-10 customer concentration, NRR/GRR by vintage
        cohort, and renewal pipeline in formal diligence.
      relatedQuestionRefs:
        - QR024

    - type: private-evidence-only
      severity: material
      topic: valuation-secondary-market
      missingEvidence: >
        Secondary market pricing for Aviatrix equity since the 2021 Series E; no
        confirmed Forge Global, Carta secondary, or tender offer pricing is publicly
        accessible.
      whyItMatters: >
        Secondary market pricing is the most direct real-time signal of investor
        sentiment on private valuations; its absence means the $2B anchor is the only
        valuation reference available.
      diligencePath: >
        Contact secondary market brokers (Forge, Nasdaq Private Market) for indicative
        price levels; review investor cap table for any secondary transactions.
      relatedQuestionRefs:
        - QR018

    - type: missing-source
      severity: minor
      topic: channel-program-performance
      missingEvidence: >
        Public metrics on Aviatrix's new channel partner program — partner count, pipeline
        contribution, partner-sourced ARR, or certifications — since Ken Horner's appointment.
      whyItMatters: >
        The new CRO's channel program is a primary lever for revenue diversification; its
        performance is a leading indicator of the GTM pivot's success.
      diligencePath: >
        Request partner program data pack during formal diligence; review partner portal
        activity and reseller win rates with channel head.
      relatedQuestionRefs:
        - QR028

    - type: stale
      severity: minor
      topic: patch-coverage-attestation
      missingEvidence: >
        Customer patch coverage rate for CVE-2024-50603 as of June 2026 — no Aviatrix
        public attestation of percentage of installed base patched to supported versions.
      whyItMatters: >
        Unpatched customer deployments remain exposed and could result in additional
        exploitation incidents that damage customer relationships and brand trust.
      diligencePath: >
        Request patch coverage telemetry from Aviatrix support team; review customer
        contract retention rates post-January 2025 exploitation window.
      relatedQuestionRefs:
        - QR004
      relatedTableRefs:
        - TR001
