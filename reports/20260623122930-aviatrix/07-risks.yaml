  - id: regulatory-legal-risks
    title: Regulatory, Legal, and Compliance Risks
    body: >
      Aviatrix navigates an increasingly demanding regulatory environment across three
      primary vectors. First, CISA's Known Exploited Vulnerabilities catalog placed
      CVE-2024-50603 on the federal patch mandate list, requiring FCEB agencies to remediate
      by February 6, 2025—exposing Aviatrix to potential loss of federal enterprise
      relationships if customers on supported versions were not patched in time. Second,
      Aviatrix's customers in regulated verticals (financial services, government, healthcare)
      increasingly require NIST SP 800-207 Zero Trust Architecture alignment, FedRAMP
      authorization for government cloud deployments, and EU GDPR/NIS2 compliance for
      European operations. Aviatrix's trust center claims SOC 2 compliance but does not
      publicly surface the audit scope or Type II attestation report, creating a transparency
      gap that enterprise procurement teams must close through direct inquiry. Third, the
      CSA Cloud Controls Matrix defines security requirements that cloud service providers
      must demonstrate to enterprise customers—Aviatrix's competitive position depends on
      continuous alignment with evolving CCM versions. No known regulatory enforcement
      actions, IP litigation, or class-action filings have been identified against Aviatrix
      as of June 2026, but the CVE exploitation campaign creates latent liability risk if
      customers can demonstrate that delayed disclosure or insufficient patch notification
      contributed to damages. Aviatrix's SEC Form D (2019) shows Delaware incorporation
      with a Santa Clara, CA headquarters—standard for a venture-backed company—but the
      absence of any publicly filed follow-on funding documents after the $200M Series E
      limits regulatory and investor transparency.
    claimRefs:
