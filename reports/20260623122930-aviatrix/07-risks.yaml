  - id: TR005
    title: Mitigation and Kill Criteria
    columns:
      - Risk
      - Monitorable Trigger
      - Threshold / Event
      - Action Implication
    rows:
      - - Controller security CVE (repeat)
        - CISA KEV catalog additions for Aviatrix products
        - Second CVSS ≥ 9.0 Aviatrix CVE added to KEV within 18 months of CVE-2024-50603
        - Thesis break — structural security design flaw; reassess investment position
      - - Hyperscaler feature parity
        - AWS / Azure public announcements of native multicloud firewall or zero-trust networking
        - AWS or Azure GA of zero-trust workload enforcement equivalent to Aviatrix DCF at no incremental cost
        - Thesis stress — accelerate evaluation of Aviatrix differentiation and pricing power
      - - Strategic pivot failure
        - ARR growth and win/loss rate in security vs. networking use cases
        - ARR growth below 30% YoY for two consecutive quarters, or security ACV below 50% of new bookings
        - Reassess whether pivot is succeeding before next capital event
      - - Leadership attrition
        - Public announcements of departures for CEO, CRO, or CPO within 12 months of hire
        - Two or more C-suite or VP departures within one year of appointment
        - Governance concern — request board-level explanation and succession plan
      - - Financial runway shortfall
        - Fundraising announcements, bridge rounds, or down-round press coverage
        - Any public indication of down round or capital constraint
        - Immediate diligence on cash position, ARR, and investor covenants
    notes: >
      Kill criteria are analyst-defined thresholds based on publicly observable signals.
      Aviatrix does not publish ARR, win/loss ratios, or financial disclosures. Thresholds
      should be calibrated with Aviatrix management during formal diligence.
