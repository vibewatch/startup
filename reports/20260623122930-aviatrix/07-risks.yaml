callouts:
  - calloutType: risk
    title: CVE-2024-50603 Sets a Structural Trust Baseline Risk
    body: >
      A CVSS 10.0 unauthenticated RCE in the Aviatrix Controller was actively exploited
      in the wild before broad customer patching was complete, with 65% of affected
      environments having lateral movement paths to cloud admin planes. CISA's KEV listing
      signals federal-agency-level severity. Investors should treat this not merely as a
      past incident but as evidence of Controller design risk that must be structurally
      addressed before the next capital event.
    claimRefs:
      - CR007
      - CR008
      - CR009
      - CR013

  - calloutType: risk
    title: Financial Opacity Creates an Unquantifiable Valuation Anchor
    body: >
      Aviatrix's $2B valuation is five years old, set in a peak-multiple environment,
      and has never been publicly reconfirmed. With no ARR disclosures, no audited
      financials, and only a 2019 SEC Form D as the sole regulatory anchor, any prospective
      investor is underwriting the thesis largely on qualitative signals and third-party
      analyst estimates. The combination of private-company opacity with a CEO-led pivot
      and restructured leadership team makes financial due diligence a prerequisite—not
      an optional step—before any capital commitment.
    claimRefs:
      - CR019
      - CR020
      - CR021
      - CR022
      - CR023

