  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: retention-gap
      missingEvidence: >-
        Audited NRR, GRR, logo churn rate, and cohort-level retention data for Aviatrix's
        enterprise customer base.
      whyItMatters: >-
        Without NRR/GRR data, it is impossible to confirm whether 500+ customer count
        reflects a durable, growing base or new-logo growth offsetting meaningful churn.
        This is the single most material diligence gap for estimating durable ARR trajectory.
      diligencePath: >-
        Request 8-quarter NRR and GRR cohort data from CFO/investor dataroom; triangulate
        against COGS-per-customer and ARR-per-customer trends if available.
      relatedQuestionRefs:
        - QU016

    - type: private-evidence-only
      severity: blocking
      topic: concentration-gap
      missingEvidence: >-
        Top-10 customer ARR concentration data; share of total ARR held by largest 1, 5,
        and 10 customers.
      whyItMatters: >-
        Named customer base skews heavily toward Global 2000 accounts. High concentration
        in a few large accounts creates significant revenue risk if any top-tier account
        churns or renegotiates.
      diligencePath: >-
        Request customer revenue concentration schedule from dataroom; confirm whether any
        single customer exceeds 10% of ARR.
      relatedQuestionRefs:
        - QU024

    - type: missing-source
      severity: material
      topic: review-coverage
      missingEvidence: >-
        Full Gartner Peer Insights review data for Aviatrix; G2 review count and rating
        (site blocked by CAPTCHA/JavaScript during research).
      whyItMatters: >-
        G2 and Gartner Peer Insights are the highest-reputation enterprise review platforms;
        blocked access prevents a complete independent sentiment picture.
      diligencePath: >-
        Pull Aviatrix's Gartner Peer Insights profile through a Gartner subscription; access
        G2 via authenticated session or analyst data export.
      relatedQuestionRefs:
        - QU019

    - type: missing-source
      severity: material
      topic: competitive-comparison
      missingEvidence: >-
        Independent head-to-head comparison data between Aviatrix and competitors such as
        Alkira, Cisco ACI, or Megaport from enterprise buyers who evaluated multiple vendors.
      whyItMatters: >-
        Without comparative data, it is not possible to assess whether Aviatrix's review
        scores (PeerSpot 8.0/10, TrustRadius 7.1/10) are competitive with alternatives
        or whether customer segments are at risk of switching to lower-cost options.
      diligencePath: >-
        Request win/loss analysis from Aviatrix sales team; review Gartner Peer Insights
        competitive comparison reports; conduct reference calls with competitive evaluation
        context included.
      relatedQuestionRefs:
        - QU006

    - type: enumeration-incomplete
      severity: material
      topic: named-customer-coverage
