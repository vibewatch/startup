  - id: review-sentiment-friction
    title: Review Site Sentiment and Adoption Friction
    body: >-
      Independent review platforms present a moderately positive but friction-aware picture.
      PeerSpot gives Aviatrix an 8.0/10 aggregate rating from nine in-depth reviews, with
      large enterprise buyers (500+ employee organizations) disproportionately represented.
      Recurring praise themes are multi-cloud provider support, centralized topology and
      visibility, VPN high-throughput bundling, CIDR overlap resolution, and Terraform module
      consistency. TrustRadius yields a lower 7.1/10 from nine reviews, with reviewers
      specifically citing missing VPN admin-down controls, limited IPS customization, alert
      flooding, and manual update overhead.

      Pricing is the most consistent friction point across all platforms. Multiple PeerSpot
      reviewers describe Aviatrix as "a pretty expensive solution" and note the mandatory
      bundling of support with the license ("you can't buy the product without support").
      Vendr data corroborates this: median ACV of $194K puts Aviatrix well above typical SMB
      and mid-market networking software spend. The consumption-based model creates budget
      unpredictability for customers scaling gateway counts rapidly.

      Onboarding complexity and a steep learning curve are the second most common friction
      source: reviewers note that users unfamiliar with multi-cloud networking concepts require
      dedicated training before realizing value. This is consistent with the ACE program's
      existence as a formal prerequisites-building track. GCC regional support is cited as
      inadequate by at least one PeerSpot reviewer based in the UAE, who found no local
      Aviatrix staff for in-person technical guidance. A January 2025 critical CVE
      (CVE-2024-50603) in the Aviatrix Controller was actively exploited in the wild by
      attackers deploying cryptominers and backdoors — creating a material customer patching
      burden and a credibility risk during the company's zero trust marketing push.
    claimRefs:
      - CU029
      - CU030
      - CU031
      - CU032
      - CU033
      - CU034
    tableRefs:
      - TU004

  - id: retention-expansion-concentration
    title: Retention, Expansion, and Concentration Risks
    body: >-
      Aviatrix has not disclosed any public NRR, GRR, churn, cohort, or contract-renewal
      metrics. This is the single largest diligence gap in the customer analysis. Without NRR
      data, it is impossible to verify whether the reported 500+ customer count represents
      healthy durable relationships or a combination of new-logo growth masking elevated churn.
      The 81% ARR growth estimate (Latka, 2024) is consistent with a high-growth trajectory
      but provides no signal on net retention vs. new-logo composition.

      The land-and-expand model is evidenced qualitatively: Aegon expanded from basic VPC
      connectivity to enterprise-grade distributed firewalling; IHG extended from AWS to GCP
      and added Equinix edge fabric; AB InBev continuously uncovered new use cases ("as the AB
      InBev team explored additional Aviatrix capabilities, the team continued to uncover
      additional use-cases"). The ACE certification program with 8,366 community members also
      functions as a retention moat — engineers certified on the platform have meaningful
      switching costs. However, all expansion evidence comes from company-published case
      studies, and the degree of multi-product adoption (e.g., combined CNSF + DCF + HPE
      uptake) is not independently verified.

      Customer concentration risk is unknown. The public reference base is dominated by Global
      2000 accounts; whether one or several of these represent a disproportionate revenue share
      is impossible to determine from public data. The partner channel (AWS Marketplace, Azure
      Marketplace, Equinix, WWT, Presidio) adds buying pathways but also introduces dependency
      on cloud provider committed-spend programs that could shift under contract renegotiation.
      Geographic concentration toward North America and Europe, with limited Middle East and
      APAC field coverage, constrains expansion into high-growth cloud markets.
    claimRefs:
      - CU035
      - CU036
      - CU037
      - CU038
      - CU039
      - CU040
      - CU041
