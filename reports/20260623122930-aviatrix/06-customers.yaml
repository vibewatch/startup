  - id: adoption-trajectory
    title: Adoption Trajectory and Growth Evidence
    body: >-
      Aviatrix self-reports 500+ enterprise customers across its website and press materials, a
      figure cited consistently since at least mid-2024 and confirmed in the May 2024 "Building
      an Iconic Business" press release and the 2025 Deloitte Technology Fast 500 announcement.
      No precise customer count update was found for 2026, leaving the 500+ figure as the most
      recent public data point. Third-party estimates by Latka place ARR at approximately
      $63.9M as of October 2024, growing roughly 81% year-over-year from $35.3M in 2023, which
      is consistent with a customer base expanding at double-digit pace. Aviatrix has been named
      to the Deloitte Technology Fast 500 for four consecutive years (2022–2025), corroborating
      sustained revenue growth rather than a one-year spike.

      Vendr procurement data shows a median annual contract value (ACV) of approximately
      $194,034, with a range of $153,513 to $798,362, reflecting the consumption-based model
      where spend scales with gateway counts and cloud resource usage. Monthly list pricing
      ranges from $2,500 to $15,000 depending on tier. These ACVs indicate a mid-to-large
      enterprise buying pattern consistent with six-to-twelve-month procurement cycles and
      multi-stakeholder sign-off.

      Community growth signals complement the revenue trajectory. The Aviatrix community
      (community.aviatrix.com) shows 8,366 registered members, 969 topics, and 1,355 replies,
      with ACE certifications continuing to be awarded at a visible pace. The ACE program is
      described by the company as "the industry's leading multicloud networking and security
      certification," and it functions both as a demand-generation motion and as a retention
      lever by building deep platform expertise inside customer engineering teams. Aviatrix's
      Azure Marketplace listing and prior AWS Marketplace presence extend procurement
      optionality through cloud provider committed-spend programs, reducing friction for
      cloud-native buyers.
    claimRefs:
      - CU001
      - CU003
      - CU004
      - CU013
      - CU014
      - CU015
      - CU016
    tableRefs:
      - TU002

  - id: named-customer-proof
    title: Named Customer Proof and Case Studies
    body: >-
      Aviatrix publishes at least 14 named case studies on its website as of the run date,
      covering a broad range of industries, geographies, and use cases. All cited deployments
      are described as production environments rather than pilots. The evidence quality is
      moderate: outcomes include quantified metrics for a subset of customers (Republic Airways
      reduced MTTR from days to under one hour; Aegon reduced tunnel setup from hours to
      seconds; HAPEV deploys new workloads in under one hour via IaC) while many other case
      studies offer qualitative outcomes only. Customer executives are named and quoted in all
      cases, providing reference quality above a logo-only claim.

      The case studies are published by Aviatrix and carry company-controlled framing; no
      independent third-party audit of outcomes was found. Review site data from PeerSpot and
      TrustRadius provides some corroboration through uncontrolled enterprise user reviews, with
      PeerSpot yielding an 8.0/10 consensus across large-enterprise users. The newest case
      study identified (Across AI, an agentic AI startup) was published in 2026 and concerns
      AI workload security — a freshness signal consistent with the company's strategic pivot
      toward the "Containment Era" and AI security use cases.

      The named customer set skews toward Global 2000 and Fortune 500 organizations:
      AB InBev is the world's largest brewer with 80% of infrastructure in the cloud;
      IHG operates 6,000+ hotels in 100+ countries; Aegon holds $882B in revenue and
      31.7M customers worldwide; Amundi manages more than €2 trillion in assets. This
      reference base strengthens the enterprise narrative but leaves the SMB and mid-market
      segments underdocumented. There are no public case studies from North American
      telecom, federal government, or major tech-sector buyers, which are potential
      concentration or coverage gaps.
