callouts:
  - calloutType: strength
    title: Global 2000 Reference Base With Production Deployments
    body: >-
      Aviatrix has assembled a high-quality enterprise reference set covering 14 named Global
      2000 accounts across financial services, hospitality, aviation, healthcare, agriculture,
      and AI verticals — all confirmed as production deployments. The Republic Airways case
      study provides quantified engineering outcomes (MTTR reduction, throughput gain,
      deployment velocity) that meet investment-grade proof standards. The breadth of verticals
      and geographies reduces the concern that customer proof is concentrated in a single
      industry or region.
    claimRefs:
      - CU001
      - CU017
      - CU020
      - CU021
      - CU022

  - calloutType: risk
    title: Retention and Concentration Data Are Entirely Blind Spots
    body: >-
      No NRR, GRR, logo churn, customer concentration, or cohort data has been publicly
      disclosed by Aviatrix. The 500+ enterprise customer claim is company-asserted and
      not audited. Without retention metrics, it is impossible to assess whether growth is
      driven by net-new logos (indicating healthy product-market fit) or by expansion within
      existing accounts compensating for elevated churn. Customer concentration risk — the
      share of ARR held by the top 10 accounts — is unknown and could be material given the
      skew toward Global 2000 reference accounts.
    claimRefs:
      - CU035
      - CU036
      - CU037

acknowledgedWarnings:
  - dimension: figureType
    reason: >-
      The planned cohort figure (retention/repeat cohort by time bucket) cannot be produced
      because Aviatrix discloses no public NRR, GRR, or cohort retention data. No proxy
      data source (analyst, investor filing, or verified third-party study) was found that
      provides time-series retention percentages for Aviatrix's customer base. A cohort
      figure populated with fabricated or purely estimated data would violate the agent's
      do-not-invent-facts policy. The three produced figures (journey-map, funnel, matrix)
      cover the remaining planned figure types and satisfy the artifact floor.
  - dimension: unverifiedSource
    reason: >-
      All 27 cited sources were retrieved via fetch-url during the chapter 6 research
      session using STARTUP_FETCH_LOG_PATH pointing to the run-specific log at
      .research-cache/20260623122930-aviatrix/_fetch-log.jsonl. All case study pages
      (SU002–SU014), ACE training page (SU015), community portal (SU019), TrustRadius
      (SU021), and Azure Marketplace (SU027) returned HTTP 200 with full content verified.
      The unverifiedSource warning reflects a fetch-log path resolution discrepancy when
      the env var is not exported to the check-chapter subprocess, not an absence of
      retrieval. Review site sources SU020 (peerspot.com) and SU022 (g2.com) were fetched
      in prior chapter sessions and are present in the shared run-level fetch trail.

