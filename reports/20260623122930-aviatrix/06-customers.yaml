company:
  name: Aviatrix
chapter:
  number: 6
  title: Customers
  summary: >-
    Aviatrix reports 500+ enterprise customers globally, including 10% of the Fortune 500, with
    named production deployments across financial services, hospitality, aviation, healthcare,
    agriculture, and AI-native verticals. Fourteen public case studies confirm production use at
    organizations including AB InBev, IHG Hotels, Republic Airways, Better, Aegon, Amundi, and
    others. Review-site sentiment is positive but mixed: PeerSpot rates the platform 8.0/10 and
    TrustRadius 7.1/10, with recurring criticism of high pricing, steep onboarding complexity,
    and inconsistent regional support. Retention metrics (NRR, GRR, churn) and customer
    concentration data are entirely undisclosed, representing the most material diligence gap for
    investors evaluating durability of the revenue base.

sections:
  - id: customer-profile-segmentation
    title: Customer Profile and Market Segmentation
    body: >-
      Aviatrix's buyer profile is concentrated in large and mid-market enterprises undergoing
      multi-cloud or hybrid-cloud migrations. According to PeerSpot research data, the large
      enterprise segment accounts for approximately 50% of researchers evaluating Aviatrix, with
      financial services firms representing 16% of all product views — the single largest
      industry vertical. Manufacturing, outsourcing, retail, construction, healthcare,
      telecommunications, and insurance round out the secondary verticals. The company targets
      cloud architects, senior network engineers, DevOps leads, and security teams in
      organizations managing connectivity across two or more cloud providers.

      The core buyer persona is an enterprise IT leader responsible for multi-cloud
      infrastructure who needs a vendor-neutral control plane that abstracts AWS, Azure, GCP,
      and OCI networking differences. Use cases span multi-cloud transit networking (the
      foundational entry point), zero trust network segmentation, egress cost optimization,
      FQDN-based firewall policy, M&A infrastructure integration, FAA/HIPAA/PCI-DSS compliance
      workloads, and AI workload isolation. Regulated industries — financial services,
      healthcare, aviation, and insurance — disproportionately appear in Aviatrix's public
      reference base, likely because compliance requirements create strong pull toward a
      vendor-neutral, auditable networking layer.

      Aviatrix claims 10% of Fortune 500 companies as customers, a figure cited on its
      financial services solutions page. Geographic coverage spans North America, Europe (GN in
      Denmark, HAPEV in Germany, Aegon in the Netherlands, Amundi in France), Asia-Pacific
      (Yara global, IHG global), and the Middle East — though reviewers note limited in-country
      support staff in the GCC region. The ACE (Aviatrix Certified Engineer) certification
      program acts as a pipeline builder, with 8,366 registered community members as of the
      run date, creating a practitioner base that evangelizes the platform internally within
      prospective enterprise accounts.
    claimRefs:
