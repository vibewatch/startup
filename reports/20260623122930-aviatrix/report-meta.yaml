companyProfile:
  summary: "Aviatrix is a private Santa Clara-based cloud network security company founded in 2014 that evolved from multicloud networking into a Cloud Native Security Fabric platform spanning distributed firewalling, multicloud transit, workload-level zero trust, and emerging AI-runtime controls. Public evidence supports meaningful enterprise adoption—500+ customers, named reference accounts, and repeated Deloitte Fast 500 recognition—but not current profitability, NRR, or current-period revenue disclosure. The company remains strategically relevant because multicloud enforcement is hard, yet its private-market story now sits between a verified 2021 $2B Series E anchor and a much lower, thin-liquidity 2026 secondary signal."
  foundedDate: "2014-01-01"
  foundingLocation: "Santa Clara, California, USA"
  headquarters: "Santa Clara, California, USA"
  productSummary: "Cloud Native Security Fabric providing multicloud networking, distributed cloud firewalling, workload segmentation, zero-trust enforcement, and AI-related runtime security controls across AWS, Azure, GCP, Kubernetes, and hybrid environments."
  customerFocus: "Large enterprises and regulated organizations operating complex multicloud and hybrid-cloud environments."
  businessModel: "Enterprise subscription software with custom-priced tiers, implementation services, training, and channel-assisted deployment."
