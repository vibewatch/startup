  name: Aviatrix

chapter:
  number: 4
  title: Financials
  summary: >
    Aviatrix is a private B2B SaaS company with no obligation to publish operating financials. Third-party estimates
    place ARR at approximately $63.9M as of October 2024 (Latka), growing roughly 81% year-over-year from $35.3M in
    2023. Four consecutive Deloitte Technology Fast 500 inclusions corroborate sustained growth, but gross margin,
    NRR, burn rate, CAC, and cash position are all undisclosed. The $2B Series E valuation from September 2021 is
    structurally stale; Forge secondary market data implies an approximately $411M market value as of June 2026 — a
    roughly 79% markdown — consistent with post-2021 SaaS multiple compression. No new primary capital has been
    raised in over four years. Enterprise pricing ranges from $2,500 to $15,000 per month with a median ACV of
    ~$194K. Material diligence blockers include the absence of audited gross margin, NRR, burn, and runway data.

sections:
  - id: revenue-model-trajectory
    title: Revenue Model and ARR Trajectory
    body: >
      Aviatrix operates a B2B SaaS model built on annual enterprise subscriptions for its multicloud networking and
      cloud network security platform. Revenue accrues primarily through gateway software licenses sold on a
      subscription basis, augmented by professional services, premium support, and training revenue from its
      Aviatrix Certified Engineer (ACE) program. The platform is deployed as software-defined gateways in customer
      cloud environments rather than as a managed service, which limits Aviatrix's hosting cost exposure and
      supports software-like gross margins in theory, though actual margins remain undisclosed.

      Third-party data from Latka estimates Aviatrix's ARR at approximately $63.9M as of October 2024, up from
      roughly $35.3M in November 2023 and $15.7M in early 2021. This represents compound annual growth of
      approximately 66% from 2021 to 2024 and a single-year acceleration of roughly 81% from 2023 to 2024. These
      figures are Latka's compiled estimates and have not been publicly confirmed by Aviatrix. Revenue quality
      indicators are positive: multi-year enterprise contracts, a customer base of 500+ enterprises including roughly
      10% of the Fortune 500, and four consecutive Deloitte Technology Fast 500 rankings (2022–2025) measured on
      fiscal-year revenue growth from 2021 to 2024. A third-party site (Growjo) extrapolates current ARR at
      approximately $135M, but this algorithmic projection carries high uncertainty and should be treated as an
      upper-bound estimate only.

      The company's pivot in 2024–2025 from pure multicloud networking to a cloud network security position — anchored
      by the Cloud Native Security Fabric (CNSF) and Zero Trust for Workloads — may affect revenue recognition
      patterns if bundling or rebundling occurs, but no evidence of a material revenue recognition change has been
      identified. Revenue appears to be recognized ratably over the contract term per standard SaaS accounting.
    claimRefs:
