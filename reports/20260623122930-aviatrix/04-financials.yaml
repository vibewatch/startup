    title: Stale $2B Valuation vs. Forge Secondary Mark of ~$411M
    body: >
      The last confirmed valuation is $2B from September 2021. The Forge secondary market implied price as
      of June 22, 2026 ($3.48/share) suggests a market capitalization of approximately $411M — a ~79%
      markdown. This compression is consistent with the broader SaaS multiple contraction since 2022
      (public SaaS medians fell from 15–20x ARR to 6–7x). Any new investment must reconcile the entry
      price against this secondary market signal and the absence of a new primary round in 4+ years.
    claimRefs:
