  - id: financial-verdict
    title: Financial Gaps, Disclosure Quality, and Verdict
    body: >
      Aviatrix is a private company headquartered in Santa Clara, California, incorporated in Delaware (confirmed
      by SEC Form D filing, accession 0001792033-19-000002, filed November 4, 2019), with no obligation to publish
      audited financials. The resulting disclosure gap is substantial. All ARR figures are third-party estimates
      (Latka, Growjo) that Aviatrix has neither confirmed nor denied publicly. Gross margin, NRR, burn rate, CAC,
      and runway cannot be determined from public sources. The only reliable financial anchors are: (1) confirmed
      funding rounds totaling approximately $346M, (2) the $2B Series E valuation from September 2021 (now stale),
      (3) Forge secondary market data suggesting a current implied valuation near $411M, and (4) Deloitte Fast 500
      eligibility criteria that require at least $5M in current-year revenues and 50%+ growth — confirming that
      Aviatrix exceeded these thresholds in the measurement period (2021–2024).

      The financial verdict on current evidence: Aviatrix demonstrates strong revenue growth and enterprise
      traction, but the critical unit economics — gross margin trajectory, NRR, burn, and CAC efficiency — remain
      behind private disclosure walls. The $2B valuation is a 2021 artifact; the Forge secondary market data
      implies a significantly more modest mark-to-market. Four years without a primary raise introduces ambiguity:
      the company may be capital-efficient and near profitability, or may be conserving equity rather than accepting
      a down round. The appointment of a new CFO in late 2025 and continued Deloitte Fast 500 inclusion suggest
      operational stability, but these are qualitative signals, not financial proof. Primary diligence must obtain
      audited P&L, ARR schedule, cohort NRR, and runway projections before any investment judgment can be made.
    claimRefs:
      - CI044
      - CI045
      - CI046
      - CI047
      - CI048
