  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: ARR
      missingEvidence: >
        Audited or management-confirmed ARR schedule, including quarterly and annual ARR with
        reconciliation to GAAP recognized revenue.
      whyItMatters: >
        All available ARR figures are third-party estimates. Without confirmed ARR, no revenue-based
        valuation or growth rate can be underwritten.
      diligencePath: >
        Request audited P&L or management-confirmed ARR schedule in data room; cross-reference against
        invoicing, deferred revenue, and bookings ledger; reconcile Latka estimates against actuals.
      relatedQuestionRefs:
        - QI022

    - type: private-evidence-only
      severity: blocking
      topic: gross margin
      missingEvidence: >
        GAAP gross profit and gross margin percentage by product line (software, services, support).
      whyItMatters: >
        Gross margin is the primary driver of enterprise value for SaaS companies; without it, unit
        economics and LTV modeling are impossible.
      diligencePath: >
        Request GAAP P&L; compute gross profit / total revenue; segment by product line; benchmark
        against Zscaler (81%) and Cloudflare (77%) for context.
      relatedQuestionRefs:
        - QI023
        - QI026

    - type: private-evidence-only
      severity: blocking
      topic: NRR
      missingEvidence: >
        Net revenue retention (NRR) or gross revenue retention (GRR) by customer cohort.
      whyItMatters: >
        NRR determines whether ARR growth is driven by new logos (expensive) or expansion of existing
        accounts (efficient); values below 100% indicate churn that would suppress LTV.
      diligencePath: >
        Request cohort-level NRR data by vintage year; segment by customer tier; compare to enterprise
        security SaaS benchmark of 110–130%.
      relatedQuestionRefs:
        - QI024

    - type: private-evidence-only
      severity: material
      topic: capital adequacy
      missingEvidence: >
        Current cash balance, monthly burn rate, projected runway, and any debt or credit facility.
      whyItMatters: >
        Without burn and runway, the risk of an imminent capital raise — potentially dilutive or at
        a down-round valuation — cannot be assessed. Four years without a primary raise amplifies this gap.
      diligencePath: >
        Request monthly cash flow statements for the last 24 months; confirm existence of any
        revolving credit, convertible notes, or venture debt; compute runway under base and stress cases.
      relatedQuestionRefs:
        - QI025

acknowledgedWarnings:
  - dimension: tableNotes
    reason: >
      TI001 (Revenue Streams Analysis) and TI004 (Capital Adequacy Snapshot) contain notes cells
      that provide source attribution and methodology disclosure; some cells carry inherent caveats
      about estimated vs. confirmed data already addressed in the table notes fields, making
      additional row-level notes redundant.
