  - id: leadership-founders-governance
    title: Leadership, Founders, and Governance
    body: >
      Aviatrix's founding story centers on a female entrepreneur whose vision is embedded in the
      company name. The company's About page explicitly states the name honors "our female founder,"
      but no fetched public source names the founder directly. Prior industry context names Sherry
      Wei as co-founder, consistent with the About page narrative, but this was not independently
      verified from fetched sources and is carried as an evidence gap. Steve Mullaney—former CEO
      of Nicira (acquired by VMware in 2012) and a Palo Alto Networks executive—joined Aviatrix as
      CEO in 2019, four years before the leadership transition. Mullaney described his own leadership
      sweet spot as the $1M–$100M growth stage and acknowledged that Doug Merritt's skills were
      better suited for the $100M–$1B stage, facilitating an organized CEO succession effective
      July 6, 2023. Mullaney's tenure coincided with the company's Series E funding at a $2 billion
      valuation and the launch of the Distributed Cloud Firewall product.

      Doug Merritt became CEO and President of Aviatrix in July 2023, following his six-year tenure
      as CEO of Splunk (2015–2021) during which Splunk's ARR grew from approximately $100 million
      to nearly $3 billion. Since joining Aviatrix, Merritt has undertaken an aggressive bench-
      building initiative, recruiting executives with deep cybersecurity and cloud credentials from
      Cloudflare (CRO Ken Horner), Google (VP Engineering Murali Damisetti), Cisco (Chief Network
      Architect Satish Mahadevan), Walmart (Chief Architect Georgi Khomeriki), and SAP (CMO Scott
      Leatherman). Chris McHenry serves as Chief Product Officer, as confirmed in the June 2026
      Microsoft ACS announcement. Nick Sturiale, Managing Partner of Ignition Partners (an early
      investor), holds a board seat. Key-person dependency on Merritt is assessed as high: he owns
      strategic vision, GTM, and product roadmap transformation, and his exit would create
      substantial leadership discontinuity. Board composition and governance rights for other
      investors remain opaque due to the company's private status.
