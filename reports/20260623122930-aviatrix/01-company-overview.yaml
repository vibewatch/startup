  - id: funding-valuation-capital
    title: Funding, Valuation, and Capital Stack
    body: >
      Aviatrix's most recent and largest financing round was a $200 million Series E closed in
      September 2021, led by TCV (Technology Crossover Ventures), at a $2 billion post-money
      valuation—achieving unicorn status. The CRN coverage of the 2023 CEO transition explicitly
      confirms TCV's lead role. Earlier rounds included at minimum a Series B and Series C;
      Ignition Partners participated in earlier rounds, as evidenced by founding-era board member
      Nick Sturiale (Ignition Managing Partner) featured on the company's About page. Cumulative
      capital raised is commonly cited as approximately $340 million in analyst and media accounts,
      but this figure was not independently confirmed from a primary source during this research
      run and is carried as an evidence gap.

      No new financing round or IPO announcement has been publicly made since the 2021 Series E as
      of the research date of June 23, 2026. The company remains private with no public financial
      disclosures. TCV's investor page for Aviatrix returned a 404 during fetching, and TechCrunch's
      original Series E coverage was also unavailable, reducing independent corroboration. Any
      updated valuation—whether through secondary transactions, down-round exposure, or new
      fundraising—is unknown. Diligence must independently obtain the capitalization table, confirm
      investor rights (including liquidation preferences, pro-rata, and anti-dilution provisions),
      identify any debt facilities, and determine whether secondary transactions occurred between
      2021 and the present. The Stakeholder/Investor Map table that follows enumerates known
      economic stakeholders and outstanding diligence asks.
    claimRefs:
      - CO007
      - CO008
      - CO009
      - CO019
