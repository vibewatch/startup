chapter:
  number: 1
  title: Company Overview
  summary: >
    Aviatrix is a Santa Clara, CA-based cloud network security company founded in 2014 and last
    valued at $2 billion following a $200 million Series E led by TCV in September 2021. Under CEO
    Doug Merritt (effective July 2023), the company repositioned from cloud networking to the Cloud
    Native Security Fabric (CNSF) platform, serving 500+ enterprise customers. Revenue, current
    headcount, and post-2021 valuation remain undisclosed. A July 2025 analyst interview confirms
    that the strategic pivot to security was driven by customer feedback rather than proactive market
    strategy—a dynamic warranting close diligence scrutiny.

sections:
  - id: company-identity-product
    title: Company Identity and Product Focus
    body: >
      Aviatrix Systems, Inc.—marketed as Aviatrix®—is a cloud network security company headquartered
      at 2901 Tasman Drive, Santa Clara, California 95054. The name "Aviatrix," meaning "female
      pilot," honors the company's female founder and its spirit of innovation in the cloud era.
      Founded in 2014, Aviatrix initially developed a cloud networking abstraction layer offering
      multicloud connectivity and advanced routing across AWS, Azure, Google Cloud, and Oracle Cloud.
      By 2024–2026, management repositioned the company around the Cloud Native Security Fabric
      (CNSF)—an embedded enforcement platform that governs workload-to-workload communication at
      the network layer rather than at a central perimeter chokepoint. The company describes this
      architectural distinction as "containment architecture" versus legacy "chokepoint security,"
      arguing that 92% of organizations running multi-cloud environments require enforcement at each
      workload, not at a shared transit firewall.

      Aviatrix's current flagship offering, the Cloud Native Security Fabric, unifies cloud
      networking and security across public clouds and Kubernetes environments. Key products include
      the Distributed Cloud Firewall (DCF, launched 2023), Agentguard for AI workload protection,
      and a June 2026 Microsoft Agent Control Specification integration enabling single-policy-file
      governance of AI agents across AWS, Azure, Google Cloud, and on-premises Kubernetes. The
      company also operates the Aviatrix Certified Engineer (ACE) program, described as the
      industry's leading multicloud networking and security certification. As of June 2026, Aviatrix
      operates a Threat Research Center including an interactive Cloud Threat Command Center, and
      is actively positioning itself in the agentic AI security category through its "Containment
      Era" thought-leadership series. Revenue and pricing remain private. The Snapshot KPI table
      and Summary KPI figure that follow summarize the key cover metrics; the Company Snapshot flow
      shows how identity, product, customers, and capital connect.
