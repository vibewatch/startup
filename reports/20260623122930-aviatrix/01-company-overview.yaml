  - id: scale-metrics-market-presence
    title: Scale Metrics and Market Presence
    body: >
      Aviatrix publicly claims 500+ enterprise customers globally as of 2025–2026, with the customer
      base reportedly including approximately 10% of the Fortune 500. Named reference customers
      visible on the company's customers page include Anheuser-Busch InBev, IHG Hotels and Resorts,
      Republic Airways, and Better (a financial services firm), spanning financial services,
      hospitality, transportation, and manufacturing verticals. The company targets large enterprises
      managing multicloud infrastructure—primarily cloud security teams, cloud architects, network
      engineering teams, and FinOps practitioners—in regulated industries. Its ACE certification
      program reinforces practitioner loyalty and positions Aviatrix as an educational standard in
      multicloud networking.

      The most recent publicly disclosed employee count was approximately 350 as of mid-2023 during
      the CEO transition. No updated 2024 or 2026 headcount figure was available from fetched
      sources; the company operates a remote-first culture globally. The GitHub organization
      AviatrixSystems maintained 39+ public repositories as of June 2026—including active Terraform
      providers, ACE lab guides, Kubernetes firewall charts, and a Splunk integration—indicating a
      substantial developer and partner ecosystem. Revenue, ARR, gross margin, NRR, and burn rate
      remain undisclosed. Aviatrix operates on a subscription software model with professional
      services; exact pricing is private. The Company Snapshot flow figure below visualizes how
      identity, product, customers, capital, and ecosystem dependencies connect structurally.
