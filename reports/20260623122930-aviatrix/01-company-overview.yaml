    body: >
      Aviatrix reached a $2 billion valuation in 2021 with TCV as lead investor, placing it among
      a select group of private cloud security companies with unicorn status. TCV's track record
      with scale-up investments and Doug Merritt's Splunk execution record provide credibility for
      the current growth ambitions.
