  - calloutType: risk
    title: Strategic Pivot Was Reactive, Not Proactive
    body: >
      A July 2025 analyst interview with CEO Merritt reveals that customers were already choosing
      Aviatrix primarily for security rather than networking—suggesting the company's pivot from
      networking to Cloud Native Security Fabric was reactive to customer demand rather than
      proactive category creation. This undermines claims of category leadership and raises
      questions about whether Aviatrix is pioneering a new market or riding existing demand from
      adjacent security buyers.
    claimRefs:
      - CO027
      - CO028

  - calloutType: risk
    title: Revenue and Post-2021 Valuation Entirely Undisclosed
    body: >
      Aviatrix has not disclosed revenue, ARR, gross margin, or any updated valuation since its
      September 2021 Series E. The $2 billion valuation is nearly five years old. As a private
      company, Aviatrix is not obligated to disclose financials, but diligence cannot assess
      investability or fair value without obtaining at minimum current ARR, gross margin, NRR, and
      customer acquisition cost data directly from the company.
    claimRefs:
      - CO007
      - CO008

