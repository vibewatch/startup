  - id: milestones-strategic-evolution
    title: Milestones and Strategic Evolution
    body: >
      Aviatrix's strategic evolution tracks three distinct phases. Phase One (2014–2019) was the
      founding and early product phase, establishing the company's multicloud networking abstraction
      layer. Phase Two (2019–2023), under Steve Mullaney, drove rapid scale to unicorn status
      through the 2021 Series E and initial positioning as the "cloud networking expert." The 2023
      Distributed Cloud Firewall launch marked the beginning of a security pivot. Phase Three
      (2023–present), under Doug Merritt, executes a deliberate repositioning from networking to
      a security-first platform—the Cloud Native Security Fabric—aligned with the "Containment Era"
      thesis that prevention and detection are insufficient and containment at the workload level
      is the necessary architectural answer.

      A materially adverse data point shapes this pivot narrative: a July 2025 BankInfoSecurity
      interview with Merritt reveals that customers were already choosing Aviatrix primarily for
      security capabilities, not networking. This suggests the pivot was reactive to customer
      revelation rather than proactive category creation—a distinction with important implications
      for Aviatrix's competitive moat and category ownership. The June 2026 Microsoft Agent Control
      Specification integration, Microsoft Security Store partnership, and OISF membership
      demonstrate sustained partnering momentum. The Milestone table and Company Timeline figure
      below provide a full chronological record of financing, product, governance, and partnership
      events; milestone items without independent confirmation are noted with evidence gaps.
