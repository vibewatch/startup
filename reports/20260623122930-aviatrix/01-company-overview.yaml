  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: revenue
      missingEvidence: "Aviatrix ARR, revenue run rate, gross margin, NRR, and burn rate"
      whyItMatters: "Without financial metrics, investability and fair valuation cannot be assessed; key financial KPIs in KPI table must be left null"
      diligencePath: "Request current ARR, gross margin, NRR, CAC, and LTV directly from Aviatrix management; ask for audited or reviewed financials for the last two fiscal years"
      relatedQuestionRefs: [QO012, QO028]

    - type: stale
      severity: material
      topic: valuation
      missingEvidence: "Post-2021 valuation data: secondary market pricing, updated enterprise value, or new financing round terms"
      whyItMatters: "The $2B valuation is from September 2021; market conditions and company performance over five years may have materially changed the company's fair value"
      diligencePath: "Obtain any secondary transaction data; request updated capitalization table and any investor communications on valuation; check secondary market platforms (Forge Global, EquityZen)"
      relatedQuestionRefs: [QO007]

    - type: private-evidence-only
      severity: blocking
      topic: funding
      missingEvidence: "Full capitalization table including all investor names, ownership percentages, liquidation preference stacking, anti-dilution provisions, and any debt or credit facilities"
      whyItMatters: "Without the cap table, the economic exposure and investor governance rights cannot be assessed; any liquidation preference stacking above $340M could materially impact equity value"
      diligencePath: "Request cap table directly from Aviatrix CFO or legal counsel; obtain most recent 409A valuation if available; require investor rights agreement"
      relatedQuestionRefs: [QO008, QO009]

    - type: missing-source
