  topStrengths:
    - >-
      Aviatrix addresses a real multicloud security problem with a differentiated workload-level enforcement
      architecture instead of central chokepoint firewalls.
    - >-
      Public customer proof is better than many private security peers: the company claims 500+ enterprises, roughly 10%
      of the Fortune 500, and several named reference accounts.
    - >-
      Third-party ARR estimates imply rapid 2023-2024 growth, and the company has sustained strong market visibility
      through CNSF, Microsoft, Wiz, and Deloitte recognition.
  topRisks:
    - >-
      Hyperscaler-native networking and firewall products from AWS, Azure, and Google increasingly compress Aviatrix's
      original transit-networking wedge.
    - >-
      Aviatrix has not publicly disclosed current ARR, gross margin, NRR, burn, or current headcount, making
      quality-of-revenue and durability impossible to verify from public data.
    - >-
      The 2021 $2B Series E anchor appears difficult to defend against 2026 secondary-market and comparable-multiple
      evidence, raising recapitalization or down-round risk.
  unresolvedGaps:
    - >-
      Current ARR, revenue, gross margin, and burn remain undisclosed; public numbers are third-party estimates rather
      than company filings.
    - Net revenue retention, gross revenue retention, churn, and customer concentration are not publicly available.
    - >-
      Cap-table details, liquidation preferences, and the extent of any secondary transactions after Series E are not
      public.
