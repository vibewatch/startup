summary:
  headline: >-
    Aviatrix has credible multicloud security technology and real enterprise proof points, but opaque financials, a
    difficult competitive landscape, and a sharp gap between its 2021 primary valuation and 2026 secondary signal keep
    the stock in track-not-buy territory.
