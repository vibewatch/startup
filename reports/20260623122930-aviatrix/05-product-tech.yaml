chapter:
  number: 5
  title: Product & Technology
  summary: >
    Aviatrix's Cloud Native Security Fabric (CNSF) is an agentless, software-defined
    platform comprising Distributed Cloud Firewall (DCF) for inline workload enforcement,
    High Performance Encryption (HPE) for cloud-scale traffic encryption, Workload Threat
    Visibility for cross-cloud egress telemetry, and the early-access AgentGuard product
    for AI agent governance. June 2026 milestones include OISF consortium membership
    (embedding 556 AI-specific Suricata rules) and the first multicloud network-layer
    implementation of the Microsoft Agent Control Specification. Technical strengths—
    identity-based SmartGroups, policy-as-code, patented parallel encryption tunnels—are
    confirmed by official documentation, while external risks center on CVE-2024-50603
    (CVSS 10.0, CISA KEV-listed, exploited Jan 2025) and unverified performance claims.

sections:
  - id: platform-architecture
    title: Platform Architecture — The Cloud Native Security Fabric
    body: >
      Aviatrix positions the Cloud Native Security Fabric (CNSF) as its flagship platform
      umbrella, organized into two product lines: Zero Trust for Workloads (runtime enforcement
      at cloud workloads) and Zero Trust for Networking (encrypted connectivity across cloud
      networks). The two lines share a common control plane—the Aviatrix Controller—that
      interfaces with cloud provider APIs across AWS, Azure, GCP, and OCI to auto-inventory
      workloads, distribute policies, and orchestrate gateway lifecycle. CNSF operates
      agentlessly: no SDK changes, no kernel modules, and no application rewrites are required.
      Spoke gateways are deployed as software instances within each VPC or VNet and perform
      inline L4-L7 inspection at the first hop, eliminating the hairpin routing latency of
      centralized firewall appliances.

      The architecture's central organizing principle is "Containment Architecture" as
      distinct from "Chokepoint Security." In the chokepoint model (legacy NGFW or transit
      firewall), only traffic routed through the inspection point is governed; east-west VPC
      traffic, Kubernetes pod egress, and newly deployed workloads can all bypass it. In
      Containment Architecture, policy is auto-propagated to every workload at deploy time
      across all supported clouds, enforcing one-to-one communication governance at the
      workload boundary rather than at a shared egress point. Aviatrix CoPilot provides
      a unified cross-cloud visibility, monitoring, and compliance-reporting layer on top
      of this distributed enforcement fabric. The platform documentation is hosted at
      docs.aviatrix.com and as of June 2026 the production version is 9.0.
