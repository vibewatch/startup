callouts:
  - calloutType: strength
    title: Agentless Containment Architecture at Cloud Scale
    body: >
      CNSF enforces policy at every workload without agents, SDKs, or application changes.
      DCF SmartGroups and inline spoke gateway enforcement give security teams unilateral
      control over workload communication governance—independently of developer workflows or
      runtime trust. This is structurally superior to SDK-based guardrails for AI agents and
      to IP-based native cloud security groups for east-west governance.
    claimRefs:
      - CE003
      - CE008
      - CE009

  - calloutType: risk
    title: Controller as Critical Blast-Radius Risk
    body: >
      CVE-2024-50603 (CVSS 10.0, CISA KEV, exploited Jan 2025) demonstrated that the
      Aviatrix Controller—the single policy orchestration point for all clouds—is an
      attractive, high-impact attack target. With 65% of Controller-deployed AWS environments
      having a default lateral-movement path to admin cloud control plane permissions, a
      Controller compromise can cascade to cloud-estate takeover. Aviatrix patched rapidly
      and proactively, but this architecture risk is structural and must be disclosed to buyers.
    claimRefs:
      - CE030
      - CE031
      - CE032

  - calloutType: recommendation
    title: Validate AgentGuard and ACS Integration Before Relying on AI Security Roadmap
    body: >
      AgentGuard's Deep AI Observability and Advanced AI Guardrails—the two capabilities that
      close the gap with in-process AI security tools—are Q3 2026 roadmap items. The ACS
      integration is in early access with limited production deployments. Buyers whose AI
      security requirements are current rather than aspirational should evaluate the product
      at GA, request reference customers running AgentGuard Network Enforcement in production,
      and confirm independent validation of the 15-minute shadow AI discovery claim.
    claimRefs:
      - CE019
      - CE022
      - CE023

  - calloutType: insight
    title: Microsoft ACS First-Mover Advantage Creates Standards-Driven Positioning
    body: >
      By becoming one of the first multicloud network-layer enforcement substrates for
      Microsoft's Agent Control Specification—an open standard released at Microsoft Build
      2026—Aviatrix positions CNSF as the network-enforcement complement to the Microsoft
      ecosystem for AI agent governance. If ACS achieves the cross-vendor adoption Microsoft
      intends, Aviatrix holds a first-mover advantage in the enforcement substrate market.
      The risk is that ACS competes with or fragments against other emerging AI governance
      standards (OWASP Agentic AI Top 10, CISA AI guidelines), reducing the value of any
      single standard.
    claimRefs:
      - CE023
      - CE024
      - CE025

