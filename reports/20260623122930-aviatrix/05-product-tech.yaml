  - id: product-modules
    title: Core Product Modules
    body: >
      **Distributed Cloud Firewall (DCF)** is the primary workload enforcement product.
      DCF discovers every workload across AWS, Azure, and GCP using Cloud Asset Inventory
      (CAI) and groups them into identity-based SmartGroups, allowing policies to be authored
      once and enforced consistently across clouds without IP-address rules or per-cloud tools.
      Inline enforcement at spoke gateways drops unauthorized connections at the first hop
      (L4-L7), preventing lateral movement before it propagates. North-south internet egress
      is controlled via WebGroups supporting FQDN and full URL-path filtering. ExternalGroups
      govern policy for external destinations. All DCF policies are managed as code through
      Terraform and CI/CD pipelines, enabling version control, peer review, and automated
      deployment. The Aviatrix Controller and CoPilot provide the single rule engine and
      unified visibility layer.

      **High Performance Encryption (HPE)** is built on a patented multi-tunnel,
      multi-core architecture that breaks past the single-core VPN bottleneck—a standard
      AWS or Azure VPN gateway tops out near 1.25 Gbps per tunnel. HPE achieves 100+ Gbps
      hybrid throughput and up to 1 Tbps+ cloud-to-cloud using parallel tunnels and ECMP.
      All encryption is software-defined, scaling with cloud compute without hardware
      appliances. HPE includes a Crypto-Agility Engine designed for seamless algorithm
      upgrades including post-quantum cryptography (PQC) readiness.

      **Workload Threat Visibility (WTV)** transforms Aviatrix NAT Gateways into
      intelligent security sensors, providing unified cross-cloud outbound visibility into
      workload connections—exposing malicious egress destinations and reducing NAT cost and
      complexity. WTV feeds compliance-ready telemetry for DORA, NIS2, and PCI DSS 4.0.

      **CoPilot** serves as the centralized visibility, monitoring, and analytics layer.
      It provides a single-pane view of traffic flows, threat events, policy status, and
      compliance posture across all clouds.
