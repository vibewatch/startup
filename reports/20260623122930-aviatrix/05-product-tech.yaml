  - id: deployment-integrations-differentiation
    title: Deployment, Integrations, and Differentiation
    body: >
      CNSF is deployed as software-defined overlays. Spoke gateways are provisioned inside
      customer-owned VPCs and VNets as cloud compute instances (no hardware appliances,
      no network re-architecture). The Aviatrix Controller automates provisioning, tunnel
      orchestration, policy enforcement, and lifecycle operations including centralized key
      management. A single Terraform provider (AviatrixSystems/aviatrix on
      registry.terraform.io) enables full infrastructure-as-code integration, combining
      network and application CI/CD pipelines. The platform is available on AWS Marketplace
      and Azure Marketplace; a 30-day free trial of Aviatrix Enterprise is available on
      both. A free Workload Attack Path Assessment tool provides breach-chain visualization
      and risk discovery without requiring deployment. Peerspot reviews (2026) confirm customer
      use across multicloud enterprise environments.

      The core differentiation versus native cloud controls (AWS Network Firewall, Azure
      Firewall, GCP VPC Firewall) is policy consistency: native tools are per-cloud,
      per-region, IP-based, and require separate management. Aviatrix CNSF defines policy
      once and enforces across clouds without per-cloud tooling or manual coordination.
      Versus traditional chokepoint firewalls (Palo Alto Networks Prisma, Cisco Multicloud
      Defense), Aviatrix avoids hairpin routing by enforcing at the workload boundary.
      Versus Illumio (micro-segmentation with endpoint agents), Aviatrix operates agentlessly
      and extends into networking and encryption. Versus Zscaler (SASE/ZTNA, user-to-app
      focus), Aviatrix addresses workload-to-workload communication that ZTNA architectures
      do not govern.

      The weakest differentiation claim is AgentGuard: the product is pre-GA, the Advanced
      AI Guardrails and Deep AI Observability capabilities are roadmap items, and the 15-minute
      discovery claim and blast-radius quantification have not been independently verified.
      The Microsoft ACS integration was released June 2026 and is also in early access, so
      production track record is limited. HPE's 100+ Gbps and 1 Tbps+ performance figures
      are company-claimed and have not been validated by independent benchmarks.
