  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: HPE performance
      missingEvidence: "Independent third-party benchmark confirming 100+ Gbps hybrid and 1 Tbps+ cloud-to-cloud throughput figures"
      whyItMatters: "HPE performance is a key differentiator claim; without independent validation, buyers cannot confirm these figures hold in production at their traffic mix and instance types"
      diligencePath: "Request Aviatrix to provide reference customer performance data under NDA; commission independent proof-of-concept test on representative AWS or Azure instance types"
      relatedQuestionRefs: [QE003, QE017]

    - type: private-evidence-only
      severity: material
      topic: AgentGuard pre-GA
      missingEvidence: "Production deployment evidence for AgentGuard: number of customer environments using Shadow AI Discovery, false positive rates, and GA timeline confirmation"
      whyItMatters: "AgentGuard is the core AI security story and is pre-GA; the 15-minute discovery claim and blast radius quantification are unverified; Q3 2026 roadmap dates are not contractually binding"
      diligencePath: "Request Aviatrix for early access reference customers and documented outcomes; re-evaluate at AgentGuard GA (est. H2 2026)"
      relatedQuestionRefs: [QE018, QE022]

    - type: private-evidence-only
      severity: material
      topic: compliance certifications
      missingEvidence: "Full SOC 2 report (Type I or II), ISO 27001 certificate with scope and certifying body, and QSA/third-party validation for PCI DSS 4.0 and HIPAA 2025 alignment claims"
      whyItMatters: "Buyers in regulated industries need third-party attestation, not self-certified alignment; the distinction between 'product-aligned' and 'formally assessed' affects procurement decisions"
      diligencePath: "Request SOC 2 Type II report under NDA; ask for ISO 27001 certificate with accredited body name; engage a PCI QSA to evaluate CNSF in the buyer's cardholder data environment"
      relatedQuestionRefs: [QE020, QE027]

    - type: enumeration-incomplete
      severity: minor
