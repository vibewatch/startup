  - id: TM004
    title: Growth drivers and constraints table
    type: data
    summary: >-
      Structural demand drivers and adoption constraints for the cloud network security market,
      with implications for Aviatrix's go-to-market timing and deal friction.
    columns:
      - Driver / constraint
      - Direction
      - Timing
      - Implication
      - Diligence ask
    rows:
      - - Multi-cloud adoption saturation (89% of enterprises)
        - Positive
        - Current / 2024-2026
        - Near-universal multi-cloud creates structural demand for cross-cloud network governance tools
        - Verify Aviatrix win rate in multi-cloud accounts vs. single-cloud customers
      - - Identity-based attack surge (89% of IR investigations involve identity weakness, 65% of initial access)
        - Positive
        - Current / 2026
        - Escalating threat severity creates urgency for zero trust network enforcement platforms
        - Assess whether Aviatrix's containment architecture addresses identity-to-network lateral movement specifically
      - - U.S. federal ZTA mandate (OMB M-22-09, CISA ZTMM, NIST SP 800-207)
        - Positive
        - 2022-2025 mandate horizon
        - Creates a bounded compliance-driven demand pool among federal agencies and regulated contractors
        - Confirm Aviatrix's FedRAMP status and federal pipeline size
      - - Cloud budget scrutiny (top challenge two consecutive years; 29%+ spend >USD 12M annually)
        - Negative
        - Current / 2024-2026
        - Budget friction in discretionary security tooling purchases; longer sales cycles
        - Obtain average sales cycle length and win/loss data vs. hyperscaler-native alternatives
      - - Hyperscaler-native tool improvement and competitive response
        - Negative
        - Ongoing / accelerating
        - AWS, Azure, and GCP continuously improve native networking and security services, raising the substitute ceiling
        - Assess feature gap between Aviatrix and AWS Network Firewall, Azure Firewall in customer evaluations
      - - Post-quantum cryptography migration requirement
        - Negative (long-horizon)
        - 2027-2035
        - Traditional network security protocols will require full re-architecture; creates both risk (disruption) and opportunity (new procurement cycle)
        - Confirm Aviatrix product roadmap for post-quantum protocol support
    notes: >-
      The six rows mix current (2026) market dynamics with longer-horizon structural shifts.
      The positive drivers are sourced from Flexera, Unit 42, and government mandate records;
      the negative constraints are inferred from Flexera spending data, industry analyst commentary,
      and Cisco's network security horizon analysis. All drivers and constraints apply at the
      category level; company-specific capture will depend on Aviatrix's competitive positioning.
