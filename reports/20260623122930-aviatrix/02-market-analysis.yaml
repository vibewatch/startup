  - id: sizing-lenses
    title: Multiple Sizing Lenses — TAM Context and the Convergence Layer
    body: >-
      No single analyst estimate cleanly represents Aviatrix's serviceable addressable market
      because the company straddles multiple adjacent categories. The broadest proxy is the global
      cloud security market: MarketsandMarkets pegs it at USD 34.37 billion in 2026 growing to
      USD 59.34 billion by 2031 at 11.5% CAGR, while Grand View Research estimates USD 35.84
      billion in 2024 growing to USD 75.26 billion by 2030 at 13.3% CAGR. These figures are
      not directly comparable — GVR's 2024 baseline of USD 35.84 billion already exceeds MnM's
      2026 estimate of USD 34.37 billion, implying scope differences of more than 30% at roughly
      the same horizon when GVR's trajectory is extrapolated forward. The broader network security
      market provides outer-bound context at USD 84.50 billion in 2025 (MnM). For Aviatrix's
      specific convergence of cloud networking and security, the SASE market (USD 19.19 billion in
      2026 growing to USD 68.06 billion by 2030 at 28.8% CAGR) and the narrower multi-cloud
      networking segment (USD 7.6 billion by 2027 at 22.5% CAGR) are more proximate sizing
      references. The Zero Trust Security market (USD 78.7 billion by 2029 at 16.6% CAGR) and
      Zero Trust Architecture segment (USD 38.5 billion by 2028 at 17.3% CAGR) provide
      demand-side context for the security posture shift driving cloud networking adoption. Within
      cloud security, the CNAPP segment shows the highest sub-category CAGR at 14.6% through 2031
      (MnM), mirroring Aviatrix's CNSF thesis that workload-level enforcement is the next
      architecture generation. No analyst firm publishes a standalone report for a distributed
      cloud firewall or cloud network security enforcement market that directly matches Aviatrix's
      precise product boundary; a company-specific SAM must be estimated bottom-up from the SASE
      intersection and the multi-cloud networking layer.
