  - id: buyer-segmentation
    title: Buyer, User, and Payer Segmentation with Adoption Path
    body: >-
      Aviatrix's addressable buyer population sits within enterprises that operate multi-cloud
      infrastructure and require centralized, programmable enforcement of network security policy.
      Three primary buyer types are evidenced from public sources. First are large enterprises
      (10,000+ employees) operating across two or more hyperscalers, primarily in financial
      services, healthcare, and government — segments that Grand View Research identifies as the
      highest-spend cloud security verticals. Large enterprises account for more than 74% of cloud
      security market revenue in 2024 (GVR). In these organizations, cloud security teams and
      cloud architects are the champion users, and budget authority typically resides at the CISO,
      VP of Cloud Infrastructure, or Chief Network Architect level. Second are mid-market
      organizations undergoing active cloud migration, where platform engineering and FinOps teams
      own the tool evaluation; Flexera's finding that managing cloud spending is the top challenge
      two consecutive years is a deal-friction signal for this segment, with over 29% of
      organizations spending more than USD 12 million annually on public cloud. Third are U.S.
      federal agencies and regulated-sector organizations compelled by OMB M-22-09 to adopt zero
      trust architecture by defined deadlines. More than two-thirds of organizations surveyed in a
      2024 TechTarget Enterprise Strategy Group report stated they are implementing zero trust
      policies (IBM citing ESG 2024). The adoption path in all segments follows: multi-cloud
      deployment onset, followed by policy fragmentation pain (IP exhaustion, Azure NAT gateway
      changes), then active evaluation and proof-of-concept, followed by enterprise-wide deployment
      with expanding use cases. Aviatrix's CMO cited IP exhaustion, Azure NAT gateway policy
      changes, and infrastructure modernization as primary adoption triggers in a February 2025
      press release, consistent with the company's reported 500+ enterprise customer base
      including 10% of the Fortune 500.
