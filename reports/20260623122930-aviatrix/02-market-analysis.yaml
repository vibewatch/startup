tables:
  - id: TM001
    title: Market definition table
    type: data
    summary: >-
      Included and excluded spend for Aviatrix's market boundary, with relevant buyer and payer
      groups. Coverage is partial because a single agreed definition for cloud network security
      enforcement does not exist in the analyst literature.
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - Cloud network security enforcement
        - Distributed cloud firewalls, workload-to-workload policy, network segmentation, east-west traffic enforcement, Kubernetes network policies
        - Endpoint security, SIEM, SaaS email security, single-cloud native controls used in isolation
        - Cloud security team, cloud architects, CISO; IT security or cloud infrastructure budget
        - Core product layer for Aviatrix CNSF and Distributed Cloud Firewall
      - - Multi-cloud networking infrastructure
        - Transit gateways, cloud routing, SD-WAN for cloud, multi-cloud connectivity orchestration, visibility tooling
        - Physical WAN/LAN equipment, on-premises switching/routing
        - Cloud architects, network engineers; infrastructure platform budget
        - Core infrastructure layer aligned to Aviatrix's networking heritage
      - - Zero Trust Network Access (ZTNA)
        - Application-layer access enforcement, identity-based east-west/north-south access, ZTNA overlay for workloads
        - Pure IdP/SSO software, endpoint agents in isolation, identity management unrelated to network enforcement
        - CISO, network security team; security budget
        - Adjacent security layer; part of SASE/SSE spend partially overlapping Aviatrix's posture
      - - SASE / Secure Access Service Edge
        - SD-WAN plus SSE convergence layer, FWaaS, CASB, SWG where network and security converge
        - Pure email security, pure endpoint DLP, non-network security spend
        - CISO, network, cloud teams; converged network and security budget
        - Broader category into which Aviatrix competes for convergence-platform budget
      - - Cloud-native application security (adjacent)
        - CNAPP, CWPP, CSPM when the policy surface overlaps with network enforcement
        - SAST, DAST, code scanning, code repositories, non-network layers
        - DevSecOps, cloud security; engineering security budget
        - Adjacency where Aviatrix's CNSF intersects with cloud workload security platforms
    notes: >-
      Boundary definitions differ across analyst firms; MnM and GVR include different sub-categories
      under cloud security, contributing to the 30%+ scope discrepancy noted in the sizing section.
      Status-quo substitutes (hyperscaler-native tools, SASE incumbents) are excluded from included
      spend because they represent buyer alternatives, not the spend Aviatrix is capturing.
