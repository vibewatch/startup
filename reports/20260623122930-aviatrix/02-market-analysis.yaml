chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Aviatrix's relevant market spans the intersection of multi-cloud networking infrastructure
    and cloud-native security enforcement, a category without a single clean analyst boundary.
    MarketsandMarkets sizes the proximate cloud security market at USD 34.37 billion in 2026
    (growing to USD 59.34 billion by 2031 at 11.5% CAGR), while the most relevant convergence
    proxy — the SASE market — stands at USD 19.19 billion in 2026 growing at 28.8% CAGR to
    USD 68.06 billion by 2030. Structural demand drivers are strong: 89% of organizations run
    multi-cloud (Flexera 2024), identity-based attacks drove 65% of initial access events in
    2026 (Unit 42), and federal mandates under OMB M-22-09 compel zero trust architecture
    adoption. The key sizing gap is that no analyst firm publishes a standalone report for
    Aviatrix's exact distributed-cloud-firewall-plus-multicloud-networking boundary; the three
    nearest proxies — cloud security, SASE, and multi-cloud networking — are non-comparable.
    Contradictory cloud security estimates (MnM USD 34.37B vs. GVR implied ~USD 46B in 2026)
    reflect definitional differences, not consensus, and must be preserved as methodological gaps.

sections:
  - id: market-boundary
    title: Market Boundary, Included Spend, and Status-Quo Substitutes
    body: >-
      Aviatrix competes at the intersection of multi-cloud networking infrastructure and
      cloud-native security enforcement, a category that does not map cleanly onto any single
      analyst definition. Included spend encompasses workload-to-workload traffic enforcement
      across multi-cloud and hybrid-cloud environments (east-west and north-south flows),
      distributed cloud firewall policy management, multi-cloud network visibility and analytics,
      zero trust network access (ZTNA) for both user-to-application and workload-to-workload
      traffic, cloud networking operations tooling including transit gateways and route management,
      and Kubernetes network security policy enforcement. Excluded spend includes endpoint
      detection and response (EDR), email security gateways, SIEM/SOAR platforms, single-cloud
      native controls (AWS Security Groups, Azure NSGs) used in isolation without cross-cloud
      policy, physical network appliances, and data loss prevention tooling unrelated to network
      enforcement. Status-quo substitutes include cloud-native networking and firewall services
      from hyperscalers (AWS Network Firewall, Azure Firewall, Google Cloud Firewall), traditional
      network security vendors extending to cloud (Palo Alto Prisma, Cisco Multicloud Defense),
      SASE platforms with competing cloud networking capabilities (Zscaler, Netskope, Cloudflare
      One), and in-house custom multi-cloud networking built on open-source transit or routing
      tools. The market sits at the structural convergence of cloud security — estimated at
      USD 34.37 billion in 2026 by MarketsandMarkets and USD 35.84 billion in 2024 by Grand View
      Research — and the broader enterprise network security category projected at USD 84.50
      billion in 2025 (MarketsandMarkets). Defining the boundary precisely before any sizing
      exercise is essential: Aviatrix's value proposition spans both categories but does not
      capture the full spend of either.
    claimRefs:
      - CM001
      - CM002
      - CM005
      - CM009
