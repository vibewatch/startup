  evidenceGaps:
    - type: missing-source
      severity: material
      topic: aviatrix-sam-som
      missingEvidence: >-
        No analyst firm publishes a standalone "cloud network security enforcement" or
        "distributed cloud firewall" market report that maps cleanly to Aviatrix's product
        boundary; the three nearest proxies (cloud security, SASE, multi-cloud networking)
        cover different scope boundaries and time horizons.
      whyItMatters: >-
        Without a company-specific SAM, any revenue projection must rely on bottom-up
        estimation combining market share assumptions against non-comparable proxies,
        creating model fragility that could overstate or understate Aviatrix's opportunity.
      diligencePath: >-
        Request Aviatrix management's own market sizing assumptions and supporting analyst
        reports; separately commission or obtain a primary analyst view of the distributed
        cloud firewall and multi-cloud networking security sub-segment.
      relatedQuestionRefs:
        - QM024
        - QM025
      relatedTableRefs:
        - TM002

    - type: conflicting-data
      severity: material
      topic: analyst-estimate-scope-divergence
      missingEvidence: >-
        MarketsandMarkets and Grand View Research cite materially different cloud security
        market baselines at roughly the same horizon (MnM USD 34.37B in 2026 vs. GVR
        USD 35.84B in 2024, which extrapolates to approximately USD 46B in 2026 at 13.3%
        CAGR), a difference of more than 30% that neither firm explains publicly.
      whyItMatters: >-
        Collapsing these into a single TAM overstates confidence and masks how different
        sub-category inclusions (e.g., whether SASE is inside cloud security) change the
        denominator used for market share calculations.
      diligencePath: >-
        Obtain detailed scope and methodology notes from both reports; rebuild the market
        model from consistent first-principles scope definitions that match Aviatrix's actual
        product boundary.
      relatedQuestionRefs:
        - QM026
      relatedTableRefs:
        - TM002

    - type: private-evidence-only
      severity: material
      topic: aviatrix-financials-market-share
      missingEvidence: >-
        Aviatrix has not disclosed ARR, revenue per customer, gross margin, net revenue
        retention, or any post-2021 valuation data that would allow calculation of current
        market share against any of the sizing lenses.
      whyItMatters: >-
        Without revenue or ARR, the 500+ customer count and 10% Fortune 500 penetration
        are useful directional signals but cannot be used to assess whether Aviatrix is
        capturing 0.1% or 1% of its proximate market, which is a critical valuation input.
      diligencePath: >-
        Obtain trailing twelve-month ARR, customer count by segment, average contract value,
        net revenue retention, and post-2021 equity valuation from Aviatrix management;
        benchmark against public comps in SASE and cloud security.
      relatedQuestionRefs:
        - QM027
        - QM028

