  - id: scenario-analysis
    title: Scenario Analysis and Valuation Ranges
    body: >
      Three scenarios are modeled using ARR as the primary value driver and EV/ARR as the
      multiple. All scenarios use third-party-estimated ARR inputs and should be treated as
      analytical constructs, not confirmed projections. The bull case reflects successful
      execution of the cloud security pivot, strong ARR growth to ~$95M by mid-2026, and a
      premium 8–10x multiple driven by sector re-rating and scarcity value as a private cloud
      security pure-play. This implies a valuation of $760M–$950M. Achieving this scenario
      requires sustained 25%+ growth, margin improvement, and improved market sentiment toward
      cloud security multiples. The base case — most likely given available evidence — assumes
      $85M ARR (in-line with conservative extrapolation from Latka) and a 5–7x multiple
      reflecting current SaaS capital market conditions, yielding $425M–$595M. This range
      brackets the Forge-implied $411M, which represents the lower bound given illiquidity
      discounts. The bear case assumes ARR growth deceleration to $70M (potentially reflecting
      disruption from AI-native networking tools, hyperscaler feature encroachment, or execution
      risk during the security pivot) and further multiple compression to 3–4x, yielding
      $210M–$280M. This scenario is triggered by competitive displacement or market conditions
      continuing to deteriorate. Sensitivity analysis reveals that multiple is the dominant
      driver: moving from 4x to 8x at $85M ARR shifts valuation from $340M to $680M.
      ARR uncertainty is secondary but material: a $20M ARR miss at 6x multiple costs $120M
      in value. The investment return profile is unfavorable at any price near the $2B Series E:
      Series E investors would need a $10B+ exit (5× return) to achieve institutional hurdle
      rates, requiring Aviatrix to reach $1B+ ARR at 8–10x multiples — a multi-decade
      trajectory under current growth assumptions. Secondary buyers at $411M face more realistic
      return math but remain exposed to preference-stack dilution.
