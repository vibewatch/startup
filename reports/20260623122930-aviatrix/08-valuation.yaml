callouts:
  - calloutType: risk
    title: Financial Opacity Creates Material Valuation Uncertainty
    body: >
      Aviatrix has not publicly disclosed ARR, revenue, gross margin, or any other financial
      metric. All figures used in this analysis are third-party estimates (Latka, Growjo,
      Sacra). The spread between the most reliable estimate ($64M Latka, Oct 2024) and the
      highest estimate ($135M Growjo) is a 2x range — a difference that shifts the base-case
      enterprise value by $425M–$675M. Investors must treat all valuation scenarios as
      wide-confidence-interval estimates until primary financial disclosure is obtained.
    claimRefs:
      - CV030
      - CV031
      - CV032
      - CV033

  - calloutType: recommendation
    title: Hold/Watch — Not Actionable Near Series E Mark
    body: >
      At the $2B Series E valuation, Aviatrix would require $250–333M ARR at current market
      multiples — approximately 3–5x its third-party-estimated current ARR. Secondary
      purchases below $500M are more defensible on a base-case basis, but require: (1) confirmed
      ARR ≥ $80M, (2) NRR > 110%, (3) a clear exit catalyst (IPO or M&A), and (4) cap table
      diligence on the preference stack. Until these conditions are met, the stance is Hold/Watch.
    claimRefs:
      - CV034
      - CV036
      - CV038
      - CV041

