  - id: investment-stance-diligence-and-triggers
    title: Investment Stance, Diligence Asks, and Thesis-Break Triggers
    body: >
      The investment stance on Aviatrix is Hold/Watch — not actionable as a new investment at
      any price near the Series E mark, and requiring significant evidence accumulation before
      a secondary purchase at the ~$411M level becomes compelling. The thesis rests on genuine
      product differentiation in cloud-agnostic multicloud networking/security, a large addressable
      market, and a strong early customer base (550+ enterprises). The anti-thesis centers on
      the $2B preference overhang, unconfirmed financials, sector multiple compression, and
      execution risk from a mid-stage product strategy pivot. The recommendation logic flows
      from five factors: (1) Market/Proof — the cloud security market is large and growing,
      Aviatrix has verifiable customer proof, but scale remains unconfirmed; (2) Product/Moat —
      multicloud-native architecture is defensible but increasingly challenged by PANW, Cisco,
      and hyperscalers; (3) Financials — ARR estimates suggest moderate growth but the $200M
      raise with limited financial transparency is a red flag; (4) Risks — competitive,
      execution, and preference-overhang risks are high; (5) Valuation — secondary at $411M
      is consistent with base case but not a discount, and the $2B entry is undefendable.
      The final diligence asks center on confirming ARR ($80–100M target range), gross margin
      (should be 70%+ for SaaS), net retention rate (>110% for strong SaaS), preference stack
      details, board composition, and any M&A approaches or strategic process. Thesis-break
      triggers include ARR below $60M (suggesting growth reversal), confirmed hyperscaler
      feature encroachment displacing core Aviatrix use cases, or a down-round primary raise
      below $500M pre-money. Exit readiness is low: Aviatrix lacks the $150M+ ARR scale, public
      comparable margins, and clean preference waterfall structure necessary for an imminent IPO.
      A 2027–2028 IPO window is possible if growth continues and markets recover, but relies on
      multiple favorable conditions. M&A remains the more likely exit path in the 2026–2028
      horizon, at $400M–$700M unless scale substantially improves.
