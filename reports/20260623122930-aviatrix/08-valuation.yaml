  - id: private-market-signals-and-arr-framework
    title: Private Market Signals, ARR Framework, and Uncertainty Disclosure
    body: >
      Two structural challenges define this valuation analysis: (1) Aviatrix does not publicly
      disclose financial results, making all ARR and revenue figures third-party estimates; and
      (2) the secondary market for Aviatrix shares is illiquid, making secondary prices unreliable
      as a precision valuation tool. These limitations are material and must be front-of-mind
      when interpreting any scenario range. The best available ARR anchor is Latka's $63.9M
      estimate for October 2024 (with a prior point of $35.3M in November 2023, implying ~81%
      YoY growth). Growjo's $135M algorithmic estimate is likely upward-biased. Using the Latka
      trajectory and applying a more conservative 25–35% growth rate to mid-2026 yields an
      estimated ARR of $85–97M. Aviatrix's strategic pivot from multicloud networking to cloud
      network security introduces additional uncertainty: ARR recognition patterns may shift as
      product packaging changes. The SaaS Capital Index (SCI) provides important market context.
      Its Q1 2026 analysis confirmed decade-plus lows in ARR multiples as AI existential-risk
      narratives dominated market sentiment, with ARRG multiples (ARR multiple divided by growth
      rate) still above prior lows, suggesting further vulnerability if growth decelerates. Private
      SaaS companies typically trade at a 20–35% discount to public comparables of similar
      growth and scale, reflecting liquidity premium, information asymmetry, and preference
      overhang. Applying this to the public comp EV/revenue range of 6–10x (for similar-profile
      peers) yields a private-market-comparable range of approximately 4–8x ARR for Aviatrix.
      The Forge/Yahoo secondary price ($3.48/share → $411M) is broadly consistent with the base
      scenario, but the absence of recent matched trades signals extreme illiquidity. Secondary
      prices for companies with heavy preference stacks (Series E at $2B) can be structurally
      misleading: preferred shareholders with liquidation preferences may extract most of the
      enterprise value at any exit below $2B, leaving secondary markets to price common/junior
      preferred in a structurally disadvantaged position.
