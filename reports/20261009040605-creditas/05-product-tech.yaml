callouts:
  - calloutType: "strength"
    title: "Structural Moat in Verticalized Collateral Management"
    body: "Creditas's transition from an uncollateralized loan broker to an end-to-end verticalized originator and servicer creates a formidable operational barrier. By integrating digital document validation with property registries, vehicle liens, and corporate payroll systems, Creditas delivers lower borrower APRs and longer loan maturities than uncollateralized consumer lenders."
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE008"
  - calloutType: "risk"
    title: "Technical Integration and Architectural Transparency Gaps"
    body: "The acquisition of Banco Andbank Brasil introduces significant core banking integration complexity, requiring the alignment of legacy banking systems with modern digital fintech APIs. Furthermore, the absence of public developer APIs, technical whitepapers, or independent architecture audits makes it impossible to verify the true scalability, automation rate, and proprietary sophistication of Creditas's underwriting platform from external evidence."
    claimRefs:
      - "CE004"
      - "CE012"
      - "CE014"
