      - number: '5.2'
        title: Banking License Acquisition & Enterprise Operating Model
        blocks:
          - type: paragraph
            body: >-
              In December 2025, Creditas completed the strategic acquisition of Banco Andbank Brasil, concluding a
              formal regulatory transaction originally initiated in 2022 [CE003]. The integration of Andbank Brasil
              added a collateralized loan portfolio of R$2 billion and transferred a regulated Brazilian banking license
              directly to Creditas [CE003, CE004]. This banking license provides a transformative structural upgrade to
              Creditas's operating model, allowing the fintech to transition from exclusive reliance on securitization
              conduits—such as credit rights investment funds (FIDCs)—to operating directly as a fully licensed
              financial institution with direct access to central bank settlement infrastructure, treasury facilities,
              and regulated deposit-taking capabilities [CE004].


              Concurrently with the banking license acquisition, Creditas established a strategic wealth alliance with
              the European private banking institution Andbank Group to expand Andbank Wealth in Brazil [CE005]. As part
              of this comprehensive transaction, Andbank Group led Creditas's Series G funding round with an initial
              equity closing of US$108 million, valuing the combined fintech at US$3.3 billion [CE004, CE007]. Long-term
              institutional backers, including Sweden-based investment firm VEF AB (publ), reiterated their strategic
              support for the platform's verticalized banking consolidation [CE011]. To govern the integrated banking,
              technology, and operations architecture, Creditas appointed former BBVA global CIO and CHRO Ricardo
              Forcano as Chief Technology & Operations Officer (CTO/COO), centralizing IT infrastructure, platform
              engineering, and operational workflows under unified executive leadership [CE006].
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
              - CE007
              - CE011
