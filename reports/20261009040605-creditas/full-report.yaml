  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and disclosed traction
        blocks:
          - type: paragraph
            body: >-
              Creditas is an asset-backed lender rather than a subscription software company, so quarterly lending
              revenue should not be labeled ARR. Its Q1 2026 release reported R$1.1 billion of originations, a R$7.6
              billion portfolio, and R$633.0 million of revenue. Public materials identify Auto Equity, Home Equity,
