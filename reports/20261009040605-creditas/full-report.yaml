      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The strongest current sizing lens is Creditas's own operating footprint, not a top-down market forecast.
              Creditas reported a Q2 2026 portfolio of R$8.1 billion, quarterly origination of R$1.14 billion, and a
              company-calculated annualized origination run rate above R$4.5 billion. It also reported approximately 22%
              coverage of its addressable private-sector employee population for payroll loans, up from 12.5% in Q1.
              These measures establish scale and product-level headroom, but they use different periods and
              denominators: portfolio is a balance, origination is a flow, revenue is accounting income, and coverage is
              a company-defined population percentage. None should be relabeled as TAM, SAM, SOM, or market share
              without an independently sourced market denominator.
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM016
