      - number: '5.3'
        title: Technology Stack, Governance & Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Creditas's technological infrastructure combines commercial cloud services with proprietary data analytics
              and automated credit decisioning workflows [CE008, CE009]. The external technology stack leverages Amazon
              Web Services (AWS) for cloud computing and data storage, complemented by Adobe Analytics and Google
              marketing tools for customer acquisition tracking, and Freshworks Freshdesk, Intercom, and WhatsApp
              Business for customer communication and digital loan servicing [CE009]. Operational workflows are executed
              by an estimated workforce of 2,100 employees spanning software engineering, credit underwriting, legal
              asset documentation, and customer collections [CE010].


              Despite these operational capabilities, significant technical and governance risks persist that require
              confirmatory diligence. First, the technical consolidation of Banco Andbank Brasil's legacy banking core
              with Creditas's digital microservices architecture introduces core banking migration risk, data
              reconciliation hurdles, and regulatory reporting complexity [CE012]. Second, Creditas maintains strict
              opacity regarding its proprietary automated valuation models (AVMs), algorithmic credit risk scoring, and
              default recovery prediction engines, preventing external verification of underwriting robustness across
              economic down-cycles [CE013]. Finally, because Creditas operates as a closed enterprise platform without
              public developer APIs, open-source repositories, or published technical benchmarks, independent validation
              of its software architecture, deployment velocity, and infrastructure resilience remains unverified
              [CE014].
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE012
              - CE013
              - CE014
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Structural Moat in Verticalized Collateral Management
            body: >-
              Creditas's transition from an uncollateralized loan broker to an end-to-end verticalized originator and
              servicer creates a formidable operational barrier. By integrating digital document validation with
              property registries, vehicle liens, and corporate payroll systems, Creditas delivers lower borrower APRs
              and longer loan maturities than uncollateralized consumer lenders.
            calloutType: strength
            claimRefs:
              - CE001
              - CE002
              - CE008
          - type: callout
            title: Technical Integration and Architectural Transparency Gaps
            body: >-
              The acquisition of Banco Andbank Brasil introduces significant core banking integration complexity,
              requiring the alignment of legacy banking systems with modern digital fintech APIs. Furthermore, the
              absence of public developer APIs, technical whitepapers, or independent architecture audits makes it
              impossible to verify the true scalability, automation rate, and proprietary sophistication of Creditas's
              underwriting platform from external evidence.
            calloutType: risk
            claimRefs:
              - CE004
              - CE012
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Segmentation and Asset-Backed Buyer Profiles
        blocks:
          - type: paragraph
            body: >-
              Creditas structures its addressable consumer base around major personal asset categories rather than
              uncollateralized consumer credit tiers [CU001, CU003]. The company targets three primary retail and
              workplace demographics in Brazil: individual vehicle owners seeking liquidity through auto equity loans
              [CU003], homeowners requiring larger ticket sizes with extended amortization horizons via home equity
              contracts [CU003, CU007], and formally employed corporate workers accessing payroll-deducted personal
              loans (e-Consignado) and employee benefits [CU001, CU003, CU008]. Unlike unsecured credit models in Brazil
              where annualized consumer borrowing rates historically exceeded 100%, Creditas positions its secured model
              to deliver substantially cheaper liquidity and longer maturities by requiring real estate, automobile, or
              payroll liens [CU007, CU008]. However, geographic concentration remains heavily indexed to Brazil, with
              international operations in Mexico and Spain remaining secondary in overall scale [CU007].
            claimRefs:
              - CU001
              - CU003
              - CU007
              - CU008
              - CU013
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU007
              - CU008
              - CU013
      - number: '6.2'
        title: Adoption Trajectory, Origination Velocity, and Scale Dynamics
        blocks:
          - type: paragraph
            body: >-
              Creditas has expanded its loan portfolio under management to R$7.6bn as of Q1-26, reflecting a 22.4%
              year-over-year increase supported by record quarterly origination of R$1.1bn [CU001, CU002]. This marks
              sustained volume acceleration from R$5.8bn in managed portfolio and R$815.4mn in quarterly origination
              recorded in Q3-24 [CU003, CU004]. Customer adoption is heavily anchored by Auto Equity and Home Equity,
              both of which achieved all-time-high quarterly origination volumes in Q1-26, while e-Consignado payroll
              lending steadily regained momentum under tighter risk-reward criteria [CU001, CU003]. While Creditas
              reports that newer cohorts are replacing legacy lower-priced portfolios to yield 40.0% gross profit
              margins, management does not disclose the underlying count of active borrowing accounts, unique customer
              numbers, or repeat borrowing rates, leaving the exact volume of discrete borrowers unverified [CU001,
              CU003].
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU002
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
      - number: '6.3'
        title: Customer Journey Architecture, Conversational Funnels, and Enterprise Deployments
        blocks:
          - type: paragraph
            body: >-
              To manage customer acquisition and ongoing relationship servicing across fragmented consumer channels,
              Creditas implemented an integrated data and conversational customer journey utilizing Twilio Segment,
              Twilio Flex, and WhatsApp Business API [CU005, CU006]. The operational deployment unified disparate
              business touchpoints into a real-time customer data layer, deploying AI-supported chatbot flows and
              Copilot AI for human consultants [CU005]. Verified operational outcomes include a 15% structural reduction
              in customer acquisition cost (CAC), a 16% increase in conversion rates for calibrated campaigns, and an
              average wait time reduction from 52 minutes to 2 minutes [CU005, CU006]. Furthermore, external
              organizational case studies from Cloudflare and Team Topologies reveal that Creditas supported over 3,000
              to 5,000 internal personnel across remote operations and restructured payments and product tribes to curb
              customer-facing account creation and transaction friction [CU007, CU008]. Despite these workflow
              efficiencies, external multi-product expansion suffered from development friction, microservice coupling,
              and reliance on outside consultants [CU008].
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU005
              - CU006
              - CU007
      - number: '6.4'
        title: Retention, Cross-Sell Ecosystem, and Concentration Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              Creditas pursues a cross-asset expansion strategy aimed at capturing multiple financial needs of each
              customer throughout their asset lifecycle, combining secured credit with auto insurance brokerage (via
              Minuto Seguros), vehicle marketplace transactions, and corporate benefits cards [CU003, CU007]. Management
              cites customer stickiness as a critical buffer allowing higher financial margin realization without
              deteriorating customer conversion or credit quality [CU003]. Nevertheless, Creditas maintains strict
              opacity regarding cohort-level net revenue retention (NRR), gross revenue retention (GRR), and cross-sell
              penetration rates across its borrower base [CU001, CU003]. Furthermore, reliance on corporate HR
              partnerships for e-Consignado distribution introduces institutional gatekeeper friction, while
              macroeconomic rate persistence in Brazil exposes borrowers to refinancing sensitivity and debt-service
              constraints [CU001, CU008].
            claimRefs:
              - CU001
              - CU003
              - CU007
              - CU008
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Conversational Automation Drives Front-End CAC Efficiency
            body: >-
              Creditas' integration of Twilio Segment and WhatsApp Business API has transformed customer acquisition in
              secured lending, reducing average wait times from 52 minutes to 2 minutes and trimming customer
              acquisition costs by 15%. This front-end digital efficiency allows Creditas to scale origination rapidly
              while bypassing traditional bank branch operating overhead [CU005, CU006].
            calloutType: insight
            claimRefs:
              - CU005
              - CU006
          - type: callout
            title: Persistent Customer Count and Retention Opacity
            body: >-
              Despite reporting record credit portfolio figures of R$7.6bn in Q1-26, Creditas does not publish active
              customer counts, borrower churn, or cohort delinquency curves by product vertical. Investors must treat
              reported commercial traction as an aggregated balance-sheet metric rather than verified proof of
              customer-level retention or expansion [CU001, CU003].
            calloutType: risk
            claimRefs:
              - CU001
              - CU003
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Prudential Supervision Risks
        blocks:
          - type: paragraph
            body: >-
              Creditas operates under the oversight of Banco Central do Brasil (BCB), where the acquisition and
              consolidation of Banco Andbank Brasil fundamentally transforms its regulatory risk profile. Historically
              regulated primarily as a lightweight direct credit company (Sociedade de Crédito Direto or Creditas SCD),
              the absorption of a full banking license subjects the Group to significantly more rigorous prudential
              requirements [CR002]. Under BCB rules, the consolidated financial institution must comply with heightened
              capital adequacy standards, liquidity coverage ratios under Basel III frameworks, and expanded periodic
              regulatory reporting across financial, operational, and risk management domains [CR002]. Any operational
              inability or systems deficiency in satisfying these elevated prudential requirements could trigger
              administrative penalties, operational restrictions, or revocation of banking authorizations [CR002].
              Concurrently, legislative initiatives such as Bill of Law No. 5,473/2025 propose increasing the Social
              Contribution on Net Income (CSLL) applicable to SCDs from 9% to 15%, aligning fintech direct lenders with
              traditional financial institutions and threatening net margins [CR006]. Furthermore, Brazil's
              comprehensive value-added tax (VAT) reform introduces a dual VAT regime (IBS and CBS) that begins phased
              implementation in 2026 and 2027, creating ongoing uncertainty regarding the net effective tax burden on
              financial intermediation and fee-based revenues [CR006]. Outside Brazil, operations in Mexico via LGF
              Occidente S.A. de C.V. SOFOM remain subject to potential shifts in local consumer finance oversight
              [CR008]. On the consumer protection front, Creditas is bound by the Brazilian Consumer Defense Code
              (Código de Defesa do Consumidor), exposing the firm to administrative sanctions, municipal consumer agency
              audits, and public civil actions regarding contractual transparency, collection practices, and loan
              pricing disputes [CR009]. Labor litigation represents another persistent compliance drain, with
              approximately 200 ongoing labor lawsuits in Brazil covering overtime and wage parity claims [CR007].
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR008
              - CR009
          - type: table
            tableRef: TR001
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR008
              - CR009
              - CR015
      - number: '7.2'
        title: Operational, Underwriting, and Credit Quality Vulnerabilities
        blocks:
          - type: paragraph
            body: >-
              As a secured consumer lender, Creditas is structurally exposed to the repayment capacity of Brazilian
              borrowers and the recovery efficacy of underlying collateral pools. In its official regulatory
              disclosures, Creditas estimated that approximately 12 percent of the total lent amount in recent
              originations would not be repaid by borrowers [CR001]. The platform's core underwriting model depends on
              machine learning algorithms and proprietary artificial intelligence solutions that ingest third-party
              credit bureau data to estimate default probabilities and price risk [CR005]. These algorithms are
              vulnerable to training data bias, model drift, and macroeconomic dislocations where historical default
              correlations break down during economic stress [CR005]. When defaults occur, Creditas acts as the
              servicing agent for its securitization funds, executing extrajudicial repossessions or judicial
              foreclosures against vehicles and real estate properties [CR004]. Depreciating collateral values in
              secondary markets and protracted legal timelines in Brazilian courts directly impair recovery yields,
              eroding the excess spread that accrues to the subordinated fund quotas retained by the company [CR004].
              Operationally, the platform depends heavily on specialized third-party data providers including Serasa,
              Boa Vista, TransUnion, ClearSale, Neoway, and WhatsApp Business for KYC verification, credit scoring,
              fraud prevention, and customer communication [CR010]. Disruptions, API outages, or contractual
              terminations with these vendors impair origination throughput and elevate fraud vulnerabilities [CR010].
              Cloud infrastructure hosted across Amazon Web Services and Google Cloud remains subject to cybersecurity
              attacks, data leakage risks under CMN Resolution 4,893 and the LGPD, and potential open-source software
              licensing challenges [CR011]. Human capital retention poses an additional dependency, centered around
              founder and Chief Executive Officer Sergio Furio, whose personal leadership remains critical to capital
              markets relationships and strategic execution [CR012].
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR010
              - CR011
              - CR012
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR010
              - CR013
      - number: '7.3'
        title: Financial Leverage, Securitization Architecture, and Refinancing Exposure
        blocks:
          - type: paragraph
            body: >-
              Creditas relies on a dual-track funding architecture that segregates corporate operating capital from loan
              portfolio funding. Portfolio originations are predominantly financed off-balance-sheet through
              non-recourse true-sale securitizations, specifically Fundos de Investimentos em Direitos Creditórios
              (FIDCs) and Certificados de Recebíveis Imobiliários (CRIs), alongside bank deposits sourced via Andbank
              [CR003]. Securitization structures represent approximately 55 percent of total group liabilities, which
              reached R$7,015 million against equity of R$4.6 million as of September 2025 [CR003]. Because Creditas
              holds the subordinated equity quotas of these vehicles to capture the portfolio excess spread, higher
              customer defaults, elevated funding benchmark rates (Selic), or rising investor discount margins directly
              depress cash flow directed to the parent company [CR003]. At the corporate level, Creditas has repeatedly
              accessed international debt capital markets by issuing USD-denominated senior unsecured bonds on Nasdaq
              Stockholm, including USD 50 million issued in October 2025 and USD 27.5 million in July 2026 with a fixed
              coupon of 10.50% maturing in April 2029 [CR013, CR014]. Because the vast majority of operating assets and
              loan collections are denominated in Brazilian Reais, this creates foreign currency exchange risk and debt
              service dependency on cross-border cash remittances [CR013]. Although parent company guarantees on
              warehouse credit lines were removed to mitigate direct operational encumbrance, covenants governing bond
              frameworks and securitization vehicles impose strict equity ratio and asset-at-risk limits [CR015, CR016].
              Macroeconomic cyclicality, elevated domestic interest rates, and capital market volatility constitute
              material threats to liquidity, credit costs, and refinancing capacity at bond maturity [CR013, CR014].
            claimRefs:
              - CR003
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR010
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Prudential Upgrading and Credit Shock Vulnerability
            body: >-
              The simultaneous convergence of elevated Selic benchmark interest rates, an off-balance-sheet
              securitization funding engine comprising 55% of total liabilities, and supervisory upgrading to full bank
              status under Banco Central do Brasil represents Creditas's central operational vulnerability. While
              operational breakeven provides core resilience, failure to navigate Basel III compliance or an abrupt
              capital market disruption would immediately threaten excess spread cash flows and debt refinancing
              capabilities.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Operating Framework
        blocks:
          - type: paragraph
            body: >-
              Creditas operates as a scaled digital lending platform focused on secured consumer credit in Brazil. By
              collateralizing lending products with real estate, automobiles, and payroll deductions, the company
              structurally reduces credit default losses compared to unsecured personal lending competitors. Founded as
              BankFacil in 2012 by Sergio Furio, the company transitioned in 2017 to verticalize the entire lending
              origination and loan servicing lifecycle. Backed by major international growth investors including
              SoftBank Vision Fund, VEF Ltd., Kaszek Ventures, and Amadeus Capital, Creditas established an early
              leadership position in Brazilian secured credit. However, secured lending in an emerging market
              environment presents unique operating complexities. While collateralization dampens gross loss rates,
              asset recovery cycles in Brazil involve intricate judicial and extrajudicial execution processes, creating
              operational carrying costs. Evaluating Creditas's investment thesis requires balancing its proven
              origination capacity and superior credit underwriting against the macro headwinds of high domestic
              benchmark interest rates and asset-heavy balance sheet requirements.
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV011
      - number: '8.2'
        title: Financing History, Cap Table Dynamics, and Valuation Marks
        blocks:
          - type: paragraph
            body: >-
              Creditas's capital structure reflects an extensive venture and growth funding trajectory spanning multiple
              market cycles. The company raised $231 million in its July 2019 Series D round led by SoftBank, followed
              by a $255 million Series E round in December 2020 at a post-money valuation of $1.75 billion, bringing
              total funding at that juncture to $570 million. In January 2022, Creditas secured a Series F financing
              round that priced the business at a peak valuation of $4.8 billion. To bolster its capital foundation and
              regulatory architecture, Creditas completed a $50 million Series F extension in July 2022 alongside
              acquiring the Brazilian banking license of Andbank for $95 million and securing $150 million in
              convertible debt. Market intelligence indicates cumulative capital raised across 14 equity and debt rounds
              reached approximately $1.2 billion through December 2025. This multi-layered funding history introduces
              potential liquidation preference overhang across Series D, E, F, and G share classes, creating valuation
              asymmetry for subsequent institutional investors.
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV009
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV009
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV011
              - CV013
      - number: '8.3'
        title: Scenario Valuation, Peer Analysis, and Return Asymmetry
        blocks:
          - type: paragraph
            body: >-
              Assessing Creditas's valuation requires scenario-based modeling that accounts for public fintech multiple
              compression and elevated domestic interest rates. Under a bull scenario (20% probability), Creditas
              successfully leverages its banking license to scale retail deposits, reducing its blended cost of funds
              below CDI and justifying a valuation between $3.5 billion and $4.5 billion at a projected 2028 public
              listing. In the base case (55% probability), the platform maintains steady loan volume growth while
              grappling with elevated securitization costs, supporting a fair value range between $2.0 billion and $2.8
              billion (equivalent to 2.0x to 2.5x estimated revenue). In the bear scenario (25% probability), persistent
              double-digit Brazilian benchmark rates dampen origination demand and compress vehicle collateral
              valuations, triggering structured down-round refinancing between $1.0 billion and $1.5 billion. Public
              comps in regional emerging-market digital banking highlight that private marks set during the 2021-2022
              peak require substantial haircut adjustments to reflect realistic exit economics.
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV010
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV013
      - number: '8.4'
        title: Recommendation, Exit Horizon, and Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              Synthesizing operating scale against capital structure and liquidity risks yields an overall diligence
              recommendation of track and an entry valuation stance of stretched. Creditas has demonstrated commendable
              execution in verticalized secured lending, but CEO Sergio Furio's public determination to rule out an
              initial public offering before 2028 eliminates near-term public market liquidity. Early employees and
              secondary investors currently access partial liquidity through platforms such as EquityZen, but
              institutional growth investors face an illiquid multi-year holding period. Before committing new growth
              equity or participating in secondary transactions, prospective investors must resolve critical diligence
              gaps: first, obtaining cap table transparency regarding senior liquidation preferences across historical
              rounds; second, reviewing vintage-level 90+ day delinquency curves across auto and home equity books; and
              third, verifying that the integration of Andbank's banking license is generating tangible deposit funding
              efficiencies.
            claimRefs:
              - CV002
              - CV008
              - CV011
              - CV013
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: 'Diligence Recommendation: Track'
            body: >-
              Given management's public confirmation that an IPO is ruled out before 2028 and lack of granular
              disclosure on preferred equity liquidation rights, new institutional capital should adopt a disciplined
              'track' posture rather than paying premium multiples based on the historical $4.8B mark.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV008
              - CV011
          - type: callout
            title: Liquidity Lockup and Cap Table Preference Overhang
            body: >-
              With over $1.2B in cumulative funding raised across equity and convertible debt, later-stage investors
              likely hold senior liquidation preferences that create substantial downside dilution risk for common
              shareholders in any down-round or delayed liquidity scenario.
            calloutType: risk
            claimRefs:
              - CV007
              - CV009
              - CV013
          - type: callout
            title: Secured Asset Moat vs. Funding Cost Compression
            body: >-
              Creditas's proprietary collateral valuation algorithms and secured origination engine provide durable
              credit risk advantages over unsecured fintech lenders, but returns remain acutely sensitive to domestic
              interbank CDI rates and institutional warehouse debt costs.
            calloutType: insight
            claimRefs:
              - CV004
              - CV006
              - CV012
