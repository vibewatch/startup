  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture & Collateralized Lending Solutions
        blocks:
          - type: paragraph
            body: >-
              Creditas operates an integrated Brazilian digital financial services platform centered on asset-backed
              lending, insurance distribution, and workplace financial solutions [CE001]. Originally launched as a loan
              search and origination broker under the name BankFacil in 2012, the company initiated an extensive
              operational verticalization process in 2017 to manage the complete lending lifecycle internally [CE002].
              Rather than functioning as a pure lead-generation intermediary, Creditas took direct ownership of
              proprietary borrower onboarding, formal asset appraisal, digital title registration, and ongoing loan
              servicing.


              The core of Creditas's lending architecture consists of three principal collateralized credit products
              designed to mitigate unsecured consumer credit risks in Brazil [CE001]: home equity loans (Creditas
              Imóvel), auto equity loans (Creditas Auto), and consigned payroll-deducted credit (Creditas Benefícios).
              In the home equity segment, borrowers pledge residential or commercial real estate as first-lien
              collateral, enabling extended amortization periods of up to 240 months and substantially lower annual
              percentage rates compared to traditional uncollateralized overdrafts or personal loans. The vehicle equity
              module allows car owners to refinance vehicle equity or secure consumer liquidity through digital vehicle
              valuation benchmarks and electronic state registry liens. Meanwhile, the payroll credit module integrates
              directly with private enterprise and public-sector payroll systems, facilitating automated salary
              deductions that minimize default and collection friction [CE001, CE008].
            claimRefs:
              - CE001
              - CE002
              - CE008
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE005
          - type: table
            tableRef: TE002
            claimRefs:
