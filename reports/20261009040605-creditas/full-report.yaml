        title: Financial verdict and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The disclosed direction is constructive: revenue and gross profit grew, expenses declined sequentially,
              and the operating loss narrowed. The quality of that improvement remains difficult to underwrite because
              all current operating metrics are company-issued or repeated by an investor, while the two independent
              data providers in the pool focus on financing estimates rather than audited performance. The core decision
              blockers are current cash and debt capacity, product-level net interest margin after credit losses,
              delinquency and recovery vintages, realized customer pricing, CAC and payback, and the bridge from the
              R$34.9 million operating loss to the R$75.9 million net loss. Until management provides those schedules,
