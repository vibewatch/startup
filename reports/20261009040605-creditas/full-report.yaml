            - Central Bank (BACEN) Settlement & Reserve Operations
            - Andbank Wealth Multi-Family Office Platform Interface
        - label: Capital Markets & Securitization Funding Layer
          detail: Capital structures, structured receivables funds (FIDCs), and European institutional capital integration.
          items:
            - FIDC Securitization & Structured Credit Issuance
            - Andbank Strategic Funding & Treasury Diversification
            - Multi-Source Debt Facilities & Institutional Capital Lines
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      End-to-end customer journey map illustrating touchpoints, operational interfaces, conversion mechanics, and
      expansion loops across Creditas' asset-backed lending ecosystem.
    data:
      items:
        - label: Discovery & Digital Simulation
          stage: Discovery
          touchpoints: Website lead form, Google Ads, social marketing campaigns
          friction: High user skepticism of predatory debt models; reluctance to pledge physical assets
        - label: Conversational Screening & Onboarding
          stage: Onboarding
          touchpoints: WhatsApp Business API, Twilio Studio chatbot, automated lead forms
          friction: Document collection delays for vehicle registrations and real estate deeds
        - label: Remote Collateral Valuation
          stage: Underwriting
          touchpoints: Mobile phone virtual car inspection, remote real estate appraisal
          friction: Valuation discrepancies between user expectations and appraisal algorithms
        - label: Credit Approval & Disbursal
          stage: Closing
          touchpoints: Digital contract execution, Open Finance data linkage, bank disbursement
          friction: Registry office notarization and lien recording administrative bottlenecks
        - label: Servicing & Relationship Management
          stage: Servicing
          touchpoints: Twilio Flex advisor communications, Creditas mobile app, monthly payment alerts
          friction: Customer payment adjustments under high SELIC macro interest rate environments
        - label: Ecosystem Cross-Sell & Expansion
          stage: Expansion
          touchpoints: Minuto Seguros auto insurance, employee benefits card, salary advances
          friction: Uncoordinated multi-product touchpoints risking user fatigue and app fragmentation
    approximationNotes: Stages and touchpoints derived from Twilio case study disclosures and Q3-24 operational review.
    claimRefs:
      - CU003
      - CU005
      - CU006
      - CU007
