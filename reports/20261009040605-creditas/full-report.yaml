    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and business model
        blocks:
          - type: paragraph
            body: >-
              Creditas is the Brazilian company Creditas Soluções Financeiras Ltda., not the similarly named Czech bank,
              Czech holding group, or Indian collections-software provider returned by several assigned searches. The
              company says Sergio Furio founded it as BankFacil in 2012. Its core model is digitally originated secured
              credit: technology and data analytics support distribution and operations, while real estate, automobiles,
              and payroll provide collateral. IDB Invest described the result as lower rates, longer maturities, and
              larger ticket sizes than unsecured alternatives. The evidence supports São Paulo as headquarters and
              Brazil as the original secured-lending market, but it does not establish a complete current product or
              geographic footprint.
