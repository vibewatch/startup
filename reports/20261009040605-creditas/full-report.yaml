  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and economic buyer
        blocks:
          - type: paragraph
            body: >-
              Creditas's relevant market is narrower than all Brazilian consumer finance: the assigned sources identify
              home equity, auto equity, private payroll-deducted loans, vehicle financing, and insurance rather than a
              general unsecured-credit proposition. Collateral and payroll deduction are central to the boundary because
              they change underwriting, loan pricing, maturity, and ticket size. IDB Invest described the model as
              combining technology, collateral and multiple funding sources to offer lower rates, longer maturities and
              larger tickets. The economic buyer and payer are therefore primarily households or employees seeking
              liquidity or asset acquisition; employers and dealers can enable distribution or repayment workflows, but
              the available evidence does not establish an enterprise software budget. Status-quo substitutes include
              bank credit, unsecured personal loans, dealer finance, and not borrowing against an asset.
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM008
              - CM009
