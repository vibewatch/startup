            - Direct Salary Deduction & Bank Clearing Engine
            - Automated Customer Support & Servicing (Freshdesk/Intercom)
        - label: Banking License & Wealth Infrastructure Layer
          detail: >-
            Regulated banking capabilities acquired via Banco Andbank Brasil, treasury management, and private banking
            platform integration.
          items:
