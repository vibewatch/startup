      - number: '2.3'
        title: Adoption drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              Adoption is supported by a clear borrower value proposition and operational throughput. Collateral can
              support lower rates and larger, longer-duration loans, while Creditas says automation has reduced
              acquisition cost intensity and accelerated underwriting. The same model carries constraints: the company
              reported a higher-for-longer SELIC backdrop, adapted its private-payroll product to regulatory
              interest-rate caps, and refinanced unsecured debt in July 2026 at a 10.50% fixed coupon. Creditas also
              internalizes technology, collections and sales, and its earlier verticalization moved it beyond pure lead
              origination. That control may improve conversion and unit economics, but Euromoney's characterization of
              some fintechs as needing bricks-and-mortar activity highlights execution and capital intensity that a
              purely digital-market narrative would miss.
