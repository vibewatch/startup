      - number: '4.3'
        title: Capital adequacy and financing dependency
        blocks:
          - type: paragraph
            body: >-
              The public record shows multiple funding channels but does not establish current liquidity. IDB Invest
              described an up-to-US$30 million loan in 2020, and a 2025 company release described an R$800 million auto
              FIDC that attracted R$2.3 billion of demand. These facilities demonstrate access to institutional funding;
              they do not reveal unrestricted cash, present warehouse utilization, covenant headroom, or the amount
              available for new originations. Management's statement that Q1 2026 maintained a neutral cash-flow
              position is also not a disclosed cash-flow statement and should not be equated with zero burn or a
              quantified runway. Funding raised is likewise not cash available: Tracxn and LeadIQ publish materially
              different cumulative and latest- round figures, so neither estimate is suitable as a liquidity balance
              without cap-table and treasury confirmation.
