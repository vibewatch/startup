    title: Creditas End-to-End Technology & Operating Architecture Stack
    type: stack
    summary: >-
      Six-layer architectural stack spanning consumer touchpoints, automated underwriting, collateral appraisal, core
      banking, funding vehicles, and enterprise infrastructure.
    approximationNotes: >-
      Architectural layers reflect public operational models and corporate disclosures; proprietary internal
      microservice topologies remain undisclosed by the company.
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE008
      - CE009
    data:
      layers:
        - label: Client Interaction & Engagement Layer
          detail: >-
            Omnichannel customer touchpoints across consumer web portal, native mobile applications, employer HR
            benefits portals, and WhatsApp Business channels.
          items:
            - Consumer Web & Mobile Application Portal
            - Corporate HR Benefits Platform (Creditas Benefícios)
            - Conversational Onboarding via WhatsApp & Intercom
        - label: Identity, Fraud & Regulatory KYC Layer
          detail: Automated identity proofing, document OCR, biometric verification, and anti-money laundering screening.
          items:
            - Automated Document Capture & Optical Character Recognition
            - Biometric Facial Recognition & Identity Verification
            - Anti-Money Laundering (AML) & Sanctions Screening
        - label: Collateral Valuation & Risk Scoring Engine
          detail: >-
            Automated appraisal engines connecting to vehicle pricing benchmarks, real-estate title records, and credit
            bureau scoring.
          items:
            - Vehicle Benchmark Pricing & Condition Assessment (FIPE)
            - Real Estate Registry (Cartório) & Municipal Title Ingestion
            - Proprietary Behavioral Scoring & Credit Bureau Integration
        - label: Loan Servicing & Verticalized Lifecycle Engine
          detail: >-
            In-house contract execution, lien registration, automated payment collection, and direct payroll deduction
            orchestration.
          items:
