        - Multi-vendor routing and fallback data providers
        - Temporary increase in manual underwriting delays and potential fraud vulnerability
      - - International Corporate Bond Refinancing
        - Nordic and European Debt Investors
        - Holders of USD 77.5M senior unsecured bonds due 2029
        - Moderate
        - Inability to refinance bonds at maturity or currency devaluation impairing repayment
        - High
        - Early redemption buyback tenders, refinancing track record, and operational breakeven
        - USD currency mismatch against Brazilian Real cash generation
    notes: >-
      Risk mapping based on funding liabilities, vendor dependencies, and capital market debt instruments disclosed in
      2025/2026 bond documents.
