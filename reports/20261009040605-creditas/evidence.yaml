evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: current-scale
    missingEvidence: >-
      Audited or management-reported current revenue, exact headcount, active customer count, equity valuation, and
      financing stage.
    whyItMatters: >-
      These are core scale and valuation inputs; historical figures and broad third-party bands cannot substitute for
      current denominators.
    diligencePath: >-
      Request the latest board pack, audited financials, HR roster, customer cohort schedule, and cap-table valuation
      bridge.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: leadership
    missingEvidence: Complete current executive team, board roster, committee assignments, succession plan, and founder voting rights.
    whyItMatters: The public record shows founder continuity but cannot quantify key-person dependence or governance checks.
    diligencePath: Obtain the current organization chart, board minutes, governance documents, and succession plan.
    relatedQuestionRefs:
      - QO003
      - QO007
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: ownership
    missingEvidence: >-
      Current fully diluted ownership, liquidation preferences, investor rights, debt covenants, and outstanding
      balances.
    whyItMatters: >-
      Named historical stakeholders do not reveal present control, dilution, preference overhang, or refinancing
      headroom.
    diligencePath: >-
      Review the current cap table, shareholder agreements, bond terms, covenant certificates, and debt maturity
      schedule.
    relatedQuestionRefs:
      - QO004
      - QO005
      - QO007
    relatedTableRefs:
      - TO003
  - type: conflicting-data
    severity: material
    topic: conflicting-data
    missingEvidence: >-
      A reconciled financing history that ties every equity and debt event to closing evidence and current outstanding
      balances.
    whyItMatters: >-
      The independent funding database omits the documented 2019 round, so its US$879 million total cannot be used
      without reconciliation.
    diligencePath: Reconcile company ledgers, investor confirmations, regulatory filings, and bank statements event by event.
    relatedQuestionRefs:
      - QO004
      - QO008
  - type: missing-source
    severity: minor
    topic: milestones
    missingEvidence: Verified post-2020 product, geographic, regulatory, partnership, and adverse-event milestones.
    whyItMatters: >-
      The available timeline is capital-heavy and does not establish the current operating footprint or product
      evolution.
    diligencePath: >-
      Request a dated corporate chronology and corroborate each material event against filings, regulators, partners,
      and independent reporting.
    relatedQuestionRefs:
      - QO009
  - type: missing-source
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Independent Brazilian outstanding balances and annual originations for home equity, auto equity, private payroll
      lending and vehicle finance, plus eligible borrower and collateral denominators.
    whyItMatters: >-
      Without segment-level denominators, Creditas's portfolio, flow and coverage disclosures cannot be converted into
      defensible TAM, SAM, SOM or market-share estimates.
    diligencePath: >-
      Obtain current Banco Central do Brasil or recognized industry-series data by product, reconcile category
      definitions to Creditas's products, and request the denominator behind the company's private-employee coverage
      metric.
    relatedQuestionRefs:
      - QM007
      - QM008
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: adoption-economics
    missingEvidence: >-
      Segment-level application funnel, approval rate, acquisition cost, repeat usage, loss rate, and cohort retention
      by product and channel.
    whyItMatters: >-
      Company-level growth does not reveal whether each segment's adoption is durable, economical, or constrained by
      adverse selection.
    diligencePath: >-
      Request monthly cohort and channel data for 2025-2026, including applications, approvals, funded loans, repeat
      borrowing, CAC, delinquency and recovery.
    relatedQuestionRefs:
      - QM004
      - QM005
  - type: enumeration-incomplete
    severity: material
    topic: direct-peer-set
    missingEvidence: >-
      A verified list of Brazilian same-job secured-lending peers, incumbents, adjacent entrants, and their current
      product scope.
    whyItMatters: Without a defensible peer set, market share, differentiation, and displacement risk cannot be ranked.
    diligencePath: >-
      Use Central Bank of Brazil institution and credit-product data, then verify each candidate through current product
      disclosures and sampled borrower journeys.
    relatedQuestionRefs:
      - QP001
      - QP002
    relatedTableRefs:
      - TP001
  - type: private-evidence-only
    severity: material
    topic: matched-pricing
    missingEvidence: >-
      Current matched APRs, fees, LTV bands, approval times, realized discounts, and loss rates for Creditas and
      same-risk peers.
    whyItMatters: Directional claims about lower rates do not quantify customer value or margin durability.
    diligencePath: >-
      Collect matched offers and anonymized contracts for identical borrower risk, collateral, tenor, geography, and
      channel.
    relatedQuestionRefs:
      - QP004
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: minor
    topic: third-party-scale-verification
    missingEvidence: Independent verification of Q2 2026 portfolio, revenue, and product-level growth metrics.
    whyItMatters: The current scale exhibit relies on a company-issued release and cannot establish peer-relative performance.
    diligencePath: Reconcile the release to audited statements, regulatory portfolio data, and lender or securitization disclosures.
    relatedQuestionRefs:
      - QP007
      - QP008
  - type: private-evidence-only
    severity: material
    topic: product-pricing-and-unit-economics
    missingEvidence: >-
      Realized pricing, revenue mix, cost of funds, credit losses, CAC, payback, and contribution margin by product and
      acquisition channel.
    whyItMatters: Aggregate growth and gross margin do not show which products or channels create durable risk-adjusted value.
    diligencePath: >-
      Request product and channel P&Ls, loan-tape extracts, pricing schedules, CAC cohorts, loss vintages, and
      contribution-margin reconciliations.
    relatedQuestionRefs:
      - QI003
    relatedTableRefs:
      - TI001
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: liquidity-and-financing-headroom
    missingEvidence: >-
      Current unrestricted cash, monthly cash burn, runway, debt balances, facility availability, covenant headroom, and
      next-round triggers.
    whyItMatters: >-
      Historical funding and a management cash-flow characterization cannot establish current capital adequacy or
      refinancing risk.
    diligencePath: >-
      Obtain bank statements, a 24-month treasury forecast, debt and securitization schedules, covenant certificates,
      and board-approved financing plans.
    relatedQuestionRefs:
      - QI006
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: funding-estimate
    missingEvidence: >-
      A company-approved cap table and round-closing schedule reconciling cumulative proceeds and the December 2025
      Series G amount.
    whyItMatters: >-
      Third-party totals and latest-round amounts disagree, and funding raised cannot be used as a proxy for cash
      available.
    diligencePath: >-
      Reconcile signed financing documents, cash receipts, secondary components, currency conversions, and
      debt-versus-equity classification.
    relatedQuestionRefs:
      - QI008
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      Public developer platform documentation, developer SDKs, public GitHub repository activity, or system architecture
      whitepapers for Creditas.
    whyItMatters: >-
      As a regulated financial services and credit platform, Creditas does not maintain an open developer ecosystem,
      preventing arms-length practitioner verification of technical reliability, scalability, and code quality.
    diligencePath: >-
      Request confidential architecture diagrams, SOC 2 compliance reports, penetration testing summaries, and
      engineering team structure during confirmatory technical diligence.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: underwriting-algorithms
    missingEvidence: >-
      Granular documentation of proprietary credit scoring algorithms, asset valuation models, and automated
      underwriting decision engines.
    whyItMatters: >-
      Collateralized credit performance depends directly on the accuracy of vehicle and real estate valuation models and
      underwriting loss predictors, which are private.
    diligencePath: >-
      Underwrite historical backtesting reports, loan-to-value (LTV) migration models, and default recovery curves
      across different collateral vintages.
    relatedQuestionRefs:
      - QE008
  - type: enumeration-incomplete
    severity: minor
    topic: banking-integration
    missingEvidence: >-
      Detailed technical roadmap and API migration schedule for integrating Banco Andbank Brasil's core banking and
      custody systems into Creditas's modern microservices stack.
    whyItMatters: >-
      Legacy banking license transitions often entail protracted core banking integrations, dual-system overhead, and
      operational friction.
    diligencePath: >-
      Review technical integration milestones, system cutover schedules, and IT capital expenditure forecasts with the
      office of the CTO/COO.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: borrower-cohort-retention-and-nrr
    missingEvidence: >-
      Disaggregated active borrower account counts, repeat origination rates, customer churn, and cohort-level net
      revenue retention (NRR) percentages.
    whyItMatters: >-
      Without customer retention or repeat transaction data, investors cannot separate structural customer stickiness
      from balance-sheet expansion driven by continuous marketing spend.
    diligencePath: >-
      Request confidential cohort retention tables and vintage delinquency performance matrices during private
      diligence.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU002
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-reference-depth
    missingEvidence: >-
      Direct enterprise references for corporate payroll partners (e-Consignado sponsors) and verifiable enterprise
      customer identities.
    whyItMatters: >-
      Public customer evidence relies primarily on representative consumer personas and technology vendor co-marketing
      rather than corporate borrower references.
    diligencePath: Interview corporate HR benefit administrators utilizing Creditas' payroll lending and benefits platforms.
    relatedTableRefs:
      - TU003
  - type: private-evidence-only
    severity: material
    topic: collateral-recovery-curves
    missingEvidence: >-
      Granular historical recovery curves, auction discount realizations, and repossession timelines segmented between
      auto and real estate collateral.
    whyItMatters: >-
      Collateral recovery efficiency directly governs the net loss rate on defaulted loans and determines whether excess
      spread on subordinated FIDC quotas is preserved.
    diligencePath: >-
      Request private servicer performance reports, static pool loss curves, and FIDC administrator quarterly audit
      schedules during investment due diligence.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: liquidation-preferences
    missingEvidence: >-
      Audited cap table disclosing senior liquidation preferences, participation rights, and ratchet provisions across
      Series D, E, F, and G share classes.
    whyItMatters: >-
      Without senior preference stack visibility, net equity distributions to common and junior preferred holders cannot
      be modeled accurately under moderate exit scenarios.
    diligencePath: Request the full company capitalization table and investor rights agreements during confirmatory legal diligence.
    relatedQuestionRefs:
      - QV008
    relatedTableRefs:
      - TV002
