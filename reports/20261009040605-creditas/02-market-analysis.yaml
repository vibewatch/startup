chapter:
  number: 2
  title: "Market Analysis"
  summary: "Creditas operates across Brazilian asset-backed and payroll-linked consumer credit, with insurance as an adjacency. Company-reported Q2 2026 portfolio and origination growth demonstrate operating scale, but the assigned evidence does not provide a denominator-consistent independent TAM/SAM/SOM, so valuation should use disclosed portfolio and penetration proxies rather than a broad market estimate."
sections:
  - id: "market-boundary-and-buyers"
    title: "Market boundary and economic buyer"
    body: >-
      Creditas's relevant market is narrower than all Brazilian consumer finance: the assigned sources identify home equity, auto equity, private payroll-deducted loans, vehicle financing, and insurance rather than a general unsecured-credit proposition. Collateral and payroll deduction are central to the boundary because they change underwriting, loan pricing, maturity, and ticket size. IDB Invest described the model as combining technology, collateral and multiple funding sources to offer lower rates, longer maturities and larger tickets. The economic buyer and payer are therefore primarily households or employees seeking liquidity or asset acquisition; employers and dealers can enable distribution or repayment workflows, but the available evidence does not establish an enterprise software budget. Status-quo substitutes include bank credit, unsecured personal loans, dealer finance, and not borrowing against an asset.
    claimRefs: ["CM001", "CM002"]
    tableRefs: ["TM001", "TM003"]
  - id: "evidence-constrained-sizing"
    title: "Evidence-constrained sizing"
    body: >-
      The strongest current sizing lens is Creditas's own operating footprint, not a top-down market forecast. Creditas reported a Q2 2026 portfolio of R$8.1 billion, quarterly origination of R$1.14 billion, and a company-calculated annualized origination run rate above R$4.5 billion. It also reported approximately 22% coverage of its addressable private-sector employee population for payroll loans, up from 12.5% in Q1. These measures establish scale and product-level headroom, but they use different periods and denominators: portfolio is a balance, origination is a flow, revenue is accounting income, and coverage is a company-defined population percentage. None should be relabeled as TAM, SAM, SOM, or market share without an independently sourced market denominator.
    claimRefs: ["CM003", "CM004", "CM006", "CM016"]
    tableRefs: ["TM002"]
  - id: "drivers-and-constraints"
    title: "Adoption drivers and constraints"
    body: >-
      Adoption is supported by a clear borrower value proposition and operational throughput. Collateral can support lower rates and larger, longer-duration loans, while Creditas says automation has reduced acquisition cost intensity and accelerated underwriting. The same model carries constraints: the company reported a higher-for-longer SELIC backdrop, adapted its private-payroll product to regulatory interest-rate caps, and refinanced unsecured debt in July 2026 at a 10.50% fixed coupon. Creditas also internalizes technology, collections and sales, and its earlier verticalization moved it beyond pure lead origination. That control may improve conversion and unit economics, but Euromoney's characterization of some fintechs as needing bricks-and-mortar activity highlights execution and capital intensity that a purely digital-market narrative would miss.
    claimRefs: ["CM002", "CM010", "CM011", "CM012", "CM013", "CM015"]
    figureRefs: ["FM001"]
  - id: "segment-momentum-and-diligence"
    title: "Segment momentum and diligence implications"
    body: >-
      Q2 2026 growth was uneven across products: Creditas reported 51.3% year-over-year growth in Auto Finance, 31.6% in Home Equity, and 19.8% in Auto Equity. That dispersion supports a segment-by-segment adoption model rather than one blended market-growth assumption. The closed acquisition of Andbank Brazil adds banking infrastructure to the operating model, but the assigned evidence does not quantify how it changes funding cost, approval capacity, distribution, or addressable demand. A valuation case should therefore separate demonstrated company growth from market size and require external Brazilian balances and origination volumes by collateral class, eligible-borrower counts, competitor volumes, and a documented denominator for the company's private-employee coverage before assigning TAM-based upside.
    claimRefs: ["CM007", "CM008", "CM009", "CM014", "CM016"]
