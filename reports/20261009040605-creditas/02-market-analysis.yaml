      - ["Insurance", "Online insurance brokerage and cross-sell", "Direct carrier purchase and offline brokerage", "Policyholder / premium payer", "Adjacency to the lending customer base, not credit TAM"]
    notes: "Analytical boundary based on the product categories in assigned sources; rows do not represent market-size estimates, and excluded spend is a status-quo map rather than an exhaustive enumeration."
    claimRefs: ["CM001", "CM002", "CM006", "CM007", "CM008", "CM009"]
  - id: "TM002"
    title: "Available sizing and penetration lenses"
    columns: ["Lens", "Period", "Geography", "Value", "Method", "Confidence / limitation"]
    rows:
      - ["Creditas loan portfolio", "Q2 2026", "Primarily Brazil", "R$8.1bn", "Company-reported closing portfolio balance", "Current company footprint; not market size"]
      - ["Quarterly origination", "Q2 2026", "Primarily Brazil", "R$1.14bn", "Company-reported quarterly flow", "Flow cannot be compared directly with portfolio balance"]
      - ["Annualized origination", "Q2 2026 run rate", "Primarily Brazil", ">R$4.5bn", "Company annualization of second-quarter performance", "Run-rate extrapolation, not a forecast or TAM"]
      - ["Projected year-end portfolio", "2026 outlook", "Primarily Brazil", "R$8.8bn", "Company projection from Q2 performance", "Forward company estimate; not independently corroborated"]
      - ["Private-employee coverage", "Q2 2026", "Brazil", "Approximately 22%", "Company-defined coverage of addressable private employees", "Population denominator and loan-value opportunity are undisclosed"]
    notes: "Partial, evidence-constrained sizing only. Currency, balance, flow, forecast and population-percentage measures are intentionally kept separate; no conversion to TAM/SAM/SOM is supportable from the assigned pool."
    claimRefs: ["CM003", "CM004", "CM006", "CM016"]
  - id: "TM003"
    title: "Buyer, user and adoption map"
    columns: ["Segment", "Buyer / user", "Payer", "Workflow or channel", "Adoption trigger", "Primary constraint"]
    rows:
      - ["Auto Equity", "Vehicle owner seeking liquidity", "Borrower", "Direct digital origination with collateral underwriting", "Lower-cost liquidity against an existing asset", "Vehicle eligibility, valuation, credit quality and funding cost"]
      - ["Home Equity", "Property owner seeking larger-ticket credit", "Borrower", "Direct and affiliate acquisition with property and legal review", "Longer maturity and larger ticket than unsecured credit", "Longer closing process, collateral review and borrower trust"]
      - ["Private payroll loans", "Eligible private-sector employee", "Borrower through payroll deduction", "Employer-linked deduction and regulated pricing", "Repayment convenience and potentially lower credit risk", "Regulatory rate caps and incomplete eligible-population denominator"]
      - ["Auto Finance", "Vehicle purchaser", "Borrower", "Dealer-assisted and digital credit decisioning", "Vehicle purchase at point of sale", "Dealer reactivation, underwriting and time to close"]
      - ["Insurance", "Existing or prospective policyholder", "Policyholder", "Online brokerage and lending-ecosystem cross-sell", "Protection need or cross-sell from a lending relationship", "No assigned evidence on premium pool, conversion or retention"]
    notes: "Representative segment map, not an exhaustive channel inventory. Buyer and payer labels reflect consumer-finance economics; the assigned evidence does not establish enterprise budget ownership."
    claimRefs: ["CM001", "CM002", "CM006", "CM010", "CM011"]
