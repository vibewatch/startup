company:
  name: "Creditas"
chapter:
  number: 3
  title: "Competitors"
  summary: "Creditas has a differentiated secured-credit product set and a credible funding-diversification strategy, but the assigned evidence does not establish a defensible direct-peer ranking or comparable pricing benchmark. Current operating momentum is company-reported, while independent evidence highlights historical valuation pressure and a disputed 2022 workforce reduction."
sections:
  - id: "landscape-and-evidence-boundary"
    title: "Landscape and Evidence Boundary"
    body: >-
      Creditas competes for borrowers who can pledge homes, vehicles, or payroll-linked
      cash flows, rather than across the whole financial-services-software category.
      Its own 2019 release identifies home-equity and auto-secured loans, while IDB
      Invest describes collateralization using real estate, automobiles, and payroll.
      The retained third-party comparison evidence is too weak to name a verified
      direct peer set: Latka labels Intapp, Razorpay, and WorldRemit as the closest
      alternatives even though its taxonomy is broad financial-services software.
      Two other search results resolve to unrelated namesakes—an Indian collections
      software provider and a Czech banking group—not the Brazilian lender. The
      landscape table therefore separates supported alternatives from categories that
      remain unverified, including status quo, internal build, and likely entrants,
      rather than presenting search-result collisions as competitors.
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP014"
      - "CP015"
      - "CP016"
    tableRefs:
      - "TP001"
  - id: "capability-and-distribution"
    title: "Capability and Distribution"
    body: >-
      The strongest supported differentiation is structural rather than a feature-count
      lead. IDB Invest reported that Creditas combines technology and analytics with
      collateral and multiple funding sources to offer lower rates, longer maturities,
      and larger tickets. Its 2020 financing was intended to support lending to MSMEs
      and vulnerable borrowers, showing that the platform addressed both consumer and
      small-business liquidity needs at that time. The Andbank transaction added a
      potential deposit-funding route alongside capital-market funding; management
      framed the bank licence as a way to improve funding efficiency, margins, and
      customer cost. These mechanisms can raise switching costs through underwriting
      data and funding access, but no retained source quantifies borrower retention,
      multi-homing, partner exclusivity, or channel concentration.
    claimRefs:
      - "CP002"
      - "CP003"
      - "CP004"
    tableRefs:
      - "TP002"
  - id: "scale-and-strategic-direction"
    title: "Scale and Strategic Direction"
    body: >-
      Company-issued Q2 2026 results indicate meaningful scale and broad product
      momentum: a R$8.1 billion portfolio, R$722.9 million of quarterly revenue, and
      year-over-year portfolio growth across Auto Equity, Home Equity, private payroll
      loans, and Auto Finance. Auto Finance had the fastest disclosed product growth at
      51.3%, while Home Equity grew 31.6%. This breadth supports a multi-product
      distribution thesis, but the metrics are not a competitive benchmark because the
      source provides no like-for-like peer denominators. The KPI exhibit retains the
      issuer's metric names, periods, and units; it does not convert quarterly revenue
      into ARR or infer share. Independent verification of these operating figures was
      not present in the assigned pool.
    claimRefs:
      - "CP005"
      - "CP006"
      - "CP007"
      - "CP008"
      - "CP009"
      - "CP010"
    figureRefs:
      - "FP001"
  - id: "durability-pricing-and-adverse-signals"
    title: "Durability, Pricing, and Adverse Signals"
    body: >-
      Moat durability depends on whether lower funding cost and collateral expertise
      survive incumbent response. The assigned evidence supports a direction of travel,
      not a quantified price advantage: IDB Invest described lower rates, longer
      maturities, and larger tickets, while Creditas management said deposits could
      improve funding efficiency and reduce customer cost. No retained source provides
      current APRs, fees, loan-to-value bands, approval times, or matched peer offers.
      Historical adverse signals also temper the scale narrative. Bloomberg Linea
      reported that a 2022 extension kept the $4.8 billion valuation unchanged in a
      tighter venture market, and cited a sharp discrepancy between Creditas's reported
      11 layoffs and accounts of 300–400 dismissals. Finally, third-party scale data
      remain inconsistent and methodologically opaque, reinforcing the need for primary
      peer and pricing diligence before underwriting a durable moat.
    claimRefs:
      - "CP002"
      - "CP004"
      - "CP011"
      - "CP012"
      - "CP013"
    tableRefs:
      - "TP003"
