  - id: "TV001"
    title: "Recommendation summary table"
    columns:
      - "Evaluation Dimension"
      - "Rating / Stance"
      - "Diligence Finding"
      - "Decision Implication"
    rows:
      - - "Investment Recommendation"
        - "Track"
        - "Secured origination scale is proven but public liquidity is deferred beyond 2028 with potential cap table overhang"
        - "Refrain from paying growth-stage equity premiums until exit roadmap is clarified"
      - - "Confidence Level"
        - "Medium"
        - "Historical equity rounds ($1.75B Series E, $4.8B Series F) documented; detailed NPL cohort data and cap table preferences remain private"
        - "Require confirmatory access to preferred waterfall models and vintage loss curves"
      - - "Risk Rating"
        - "High"
        - "Heavy macro rate sensitivity to Brazilian CDI, refinancing cycles, and high capital intensity in collateral operations"
        - "Underwrite assuming continued elevated domestic cost of capital through 2027"
      - - "Valuation Stance"
        - "Stretched"
        - "Historical $4.8B mark implies unsupportable revenue multiples under current public peer benchmarks"
        - "Seek structured downside protections or secondary liquidity discounts (>40%)"
    notes: "Ratings synthesize private round marks ($1.75B Series E, $4.8B Series F), total funding of $1.2B, and executive statements deferring public listing to 2028 or later."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV003"
      - "CV007"
      - "CV011"

  - id: "TV002"
    title: "Thesis / anti-thesis table"
    columns:
      - "Pillar"
      - "Core Thesis Argument"
      - "Anti-Thesis Counterpoint"
      - "View-Break Trigger"
    rows:
      - - "Credit Quality & Moat"
        - "Secured collateralization across real estate and payroll significantly reduces ultimate credit default loss compared to unsecured fintechs"
        - "Collateral repossession in Brazil entails extended legal time horizons and significant operational carrying overhead"
        - "Vintage NPL ratio exceeding 6.5% or liquidation recovery timeline stretching past 24 months"
      - - "Capital Structure & Growth"
        - "Cumulative $1.2B raised across 14 rounds demonstrates institutional investor confidence and deep funding access"
        - "Substantial preferred equity and convertible debt stack creates senior liquidation preferences that dilute common equity"
        - "Down-round equity repricing or severe liquidation preference overhang surfacing in secondary transfers"
      - - "Banking License & Cost of Funds"
        - "Acquisition of Andbank's Brazilian banking license creates direct deposit-gathering optionality to lower funding expense"
        - "Regulatory integration and compliance overhead offset cost savings; bank deposit scale remains modest relative to loan book"
        - "Regulatory non-approval of license transfer or persistent warehouse reliance above 115% CDI"
      - - "Exit Horizon & Liquidity"
        - "Extended private operating runway allows business to compound net interest income toward durable profitability before public scrutiny"
        - "Ruling out IPO prior to 2028 locks in illiquidity for late-stage funds and subjects valuation to prolonged private market discounts"
        - "Accelerated M&A exit, strategic consolidation offer, or unexpected pre-2028 listing filing"
    notes: "Thesis points contrast asset-backed fintech differentiation against capital structure complexity, interest rate cycles, and delayed listing horizon."
    claimRefs:
      - "CV002"
      - "CV004"
      - "CV007"
      - "CV009"
      - "CV012"

  - id: "TV003"
    title: "Bull / base / bear scenario table"
    columns:
      - "Scenario"
      - "Probability Weight"
      - "Implied Valuation Range"
      - "Operating Assumptions"
      - "Key Downside Trigger"
    rows:
      - - "Bull Case"
        - "20%"
        - "$3.5B - $4.5B"
        - "Successful deposit conversion via Andbank license, gross margin expansion above 45%, and IPO execution in 2028 at >4.0x revenue"
        - "Brazilian SELIC policy rate staying elevated above 12% stalling credit demand"
      - - "Base Case"
        - "55%"
        - "$2.0B - $2.8B"
        - "Steady credit volume growth, gradual NPL stabilization, private structured refinancing at 2.0x-2.5x revenue multiple, exit in 2028-2029"
        - "Inability to secure low-cost debt facilities forcing reliance on expensive securitizations"
      - - "Bear Case"
        - "25%"
        - "$1.0B - $1.5B"
        - "Protracted high-interest-rate environment, rising delinquency in vehicle loans, down-round refinancing with senior preference wipeout"
        - "Senior creditor debt covenants breached or secondary market trading discount widening beyond 60%"
    notes: "Scenario valuations assume revenue multiples between 1.5x and 4.0x based on historical marks ($1.75B Series E to $4.8B Series F) and public fintech comps."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV007"
      - "CV013"

