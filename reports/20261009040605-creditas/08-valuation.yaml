callouts:
  - calloutType: "recommendation"
    title: "Diligence Recommendation: Track"
    body: "Given management's public confirmation that an IPO is ruled out before 2028 and lack of granular disclosure on preferred equity liquidation rights, new institutional capital should adopt a disciplined 'track' posture rather than paying premium multiples based on the historical $4.8B mark."
    claimRefs:
      - "CV002"
      - "CV008"
      - "CV011"

  - calloutType: "risk"
    title: "Liquidity Lockup and Cap Table Preference Overhang"
    body: "With over $1.2B in cumulative funding raised across equity and convertible debt, later-stage investors likely hold senior liquidation preferences that create substantial downside dilution risk for common shareholders in any down-round or delayed liquidity scenario."
    claimRefs:
      - "CV007"
      - "CV009"
      - "CV013"

  - calloutType: "insight"
    title: "Secured Asset Moat vs. Funding Cost Compression"
    body: "Creditas's proprietary collateral valuation algorithms and secured origination engine provide durable credit risk advantages over unsecured fintech lenders, but returns remain acutely sensitive to domestic interbank CDI rates and institutional warehouse debt costs."
    claimRefs:
      - "CV004"
      - "CV006"
      - "CV012"

