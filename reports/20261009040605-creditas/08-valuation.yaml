company:
  name: "Creditas"
chapter:
  number: 8
  title: "Valuation"
  summary: "Creditas presents a polarized valuation profile as a scaled Brazilian secured-credit originator, where historical equity rounds reached $1.75B (Series E, 2020) and $4.8B (Series F, 2022) with $1.2B in cumulative capital raised across 14 rounds through December 2025. While secured collateralization across real estate and payroll mitigates gross credit loss, management's public decision to rule out an IPO before 2028 and persistent opacity around preferred liquidation stack preferences warrant an entry valuation stance of stretched and an overall recommendation of track."

sections:
  - id: "investment-thesis-and-framework"
    title: "Investment Thesis and Operating Framework"
    body: "Creditas operates as a scaled digital lending platform focused on secured consumer credit in Brazil. By collateralizing lending products with real estate, automobiles, and payroll deductions, the company structurally reduces credit default losses compared to unsecured personal lending competitors. Founded as BankFacil in 2012 by Sergio Furio, the company transitioned in 2017 to verticalize the entire lending origination and loan servicing lifecycle. Backed by major international growth investors including SoftBank Vision Fund, VEF Ltd., Kaszek Ventures, and Amadeus Capital, Creditas established an early leadership position in Brazilian secured credit. However, secured lending in an emerging market environment presents unique operating complexities. While collateralization dampens gross loss rates, asset recovery cycles in Brazil involve intricate judicial and extrajudicial execution processes, creating operational carrying costs. Evaluating Creditas's investment thesis requires balancing its proven origination capacity and superior credit underwriting against the macro headwinds of high domestic benchmark interest rates and asset-heavy balance sheet requirements."
    claimRefs:
      - "CV001"
      - "CV004"
      - "CV005"
      - "CV006"
      - "CV012"
    tableRefs:
      - "TV001"

  - id: "financing-history-and-valuation-marks"
    title: "Financing History, Cap Table Dynamics, and Valuation Marks"
    body: "Creditas's capital structure reflects an extensive venture and growth funding trajectory spanning multiple market cycles. The company raised $231 million in its July 2019 Series D round led by SoftBank, followed by a $255 million Series E round in December 2020 at a post-money valuation of $1.75 billion, bringing total funding at that juncture to $570 million. In January 2022, Creditas secured a Series F financing round that priced the business at a peak valuation of $4.8 billion. To bolster its capital foundation and regulatory architecture, Creditas completed a $50 million Series F extension in July 2022 alongside acquiring the Brazilian banking license of Andbank for $95 million and securing $150 million in convertible debt. Market intelligence indicates cumulative capital raised across 14 equity and debt rounds reached approximately $1.2 billion through December 2025. This multi-layered funding history introduces potential liquidation preference overhang across Series D, E, F, and G share classes, creating valuation asymmetry for subsequent institutional investors."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV005"
      - "CV007"
      - "CV009"
      - "CV014"
    tableRefs:
      - "TV002"
    figureRefs:
      - "FV001"

  - id: "valuation-scenarios-and-comparables"
    title: "Scenario Valuation, Peer Analysis, and Return Asymmetry"
    body: "Assessing Creditas's valuation requires scenario-based modeling that accounts for public fintech multiple compression and elevated domestic interest rates. Under a bull scenario (20% probability), Creditas successfully leverages its banking license to scale retail deposits, reducing its blended cost of funds below CDI and justifying a valuation between $3.5 billion and $4.5 billion at a projected 2028 public listing. In the base case (55% probability), the platform maintains steady loan volume growth while grappling with elevated securitization costs, supporting a fair value range between $2.0 billion and $2.8 billion (equivalent to 2.0x to 2.5x estimated revenue). In the bear scenario (25% probability), persistent double-digit Brazilian benchmark rates dampen origination demand and compress vehicle collateral valuations, triggering structured down-round refinancing between $1.0 billion and $1.5 billion. Public comps in regional emerging-market digital banking highlight that private marks set during the 2021-2022 peak require substantial haircut adjustments to reflect realistic exit economics."
    claimRefs:
      - "CV001"
      - "CV003"
      - "CV007"
      - "CV010"
      - "CV013"
    tableRefs:
      - "TV003"

  - id: "recommendation-exit-readiness-and-diligence"
    title: "Recommendation, Exit Horizon, and Diligence Asks"
    body: "Synthesizing operating scale against capital structure and liquidity risks yields an overall diligence recommendation of track and an entry valuation stance of stretched. Creditas has demonstrated commendable execution in verticalized secured lending, but CEO Sergio Furio's public determination to rule out an initial public offering before 2028 eliminates near-term public market liquidity. Early employees and secondary investors currently access partial liquidity through platforms such as EquityZen, but institutional growth investors face an illiquid multi-year holding period. Before committing new growth equity or participating in secondary transactions, prospective investors must resolve critical diligence gaps: first, obtaining cap table transparency regarding senior liquidation preferences across historical rounds; second, reviewing vintage-level 90+ day delinquency curves across auto and home equity books; and third, verifying that the integration of Andbank's banking license is generating tangible deposit funding efficiencies."
    claimRefs:
      - "CV002"
      - "CV008"
      - "CV011"
      - "CV013"

