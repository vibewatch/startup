company:
  name: "Creditas"
chapter:
  number: 4
  title: "Financials"
  summary: "Creditas reported Q1 2026 revenue of R$633.0 million and a 40.0% gross profit margin while narrowing its operating loss to R$34.9 million. The trajectory is improving, but public evidence does not disclose cash on hand, cash burn, product-level economics, or current financing headroom, and third-party funding totals conflict."
sections:
  - id: "revenue-model-and-quality"
    title: "Revenue model and disclosed traction"
    body: >-
      Creditas is an asset-backed lender rather than a subscription software company, so
      quarterly lending revenue should not be labeled ARR. Its Q1 2026 release reported
      R$1.1 billion of originations, a R$7.6 billion portfolio, and R$633.0 million of
      revenue. Public materials identify Auto Equity, Home Equity, private-employee payroll
      loans, Auto Finance, and insurance as active business lines, but they do not disclose
      recognized revenue or gross profit by line. The revenue-stream assessment therefore
      separates the observable product set from inferred monetization mechanics and leaves
      realized pricing, fee take rates, and mix as diligence gaps. Historical company
      material also describes a shift from pure origination toward managing the lending
      process through completion, which implies a broader operating and funding burden than
      a referral-only model.
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI011"
      - "CI014"
    tableRefs:
      - "TI001"
    figureRefs:
      - "FI001"
  - id: "margin-and-unit-economics"
    title: "Margin path, costs, and unit-economics proxies"
    body: >-
      Q1 2026 gross profit was R$253.5 million at a 40.0% margin, while operating costs
      and expenses were R$288.4 million. That left a R$34.9 million operating loss and a
      R$75.9 million net loss. Management says reported margins are converging toward
      40%-45% cohort profitability as front-loaded IFRS provisioning eases and interest-rate
      conditions normalize; this is a company outlook, not independently verified cohort
      evidence. Revenue per employee reached an annualized R$1.4 million, up from R$1.1
      million six months earlier, which is a useful operating-leverage proxy but not a CAC
      or payback measure. No public product-level acquisition cost, loss curve, cost of
      funds, contribution margin, or payback period was available in the assigned evidence,
      so the pricing and unit-economics tables preserve nulls rather than manufacturing
      precision.
    claimRefs:
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI009"
      - "CI010"
    tableRefs:
      - "TI002"
      - "TI003"
  - id: "capital-adequacy"
    title: "Capital adequacy and financing dependency"
    body: >-
      The public record shows multiple funding channels but does not establish current
      liquidity. IDB Invest described an up-to-US$30 million loan in 2020, and a 2025
      company release described an R$800 million auto FIDC that attracted R$2.3 billion
      of demand. These facilities demonstrate access to institutional funding; they do not
      reveal unrestricted cash, present warehouse utilization, covenant headroom, or the
      amount available for new originations. Management's statement that Q1 2026 maintained
      a neutral cash-flow position is also not a disclosed cash-flow statement and should
      not be equated with zero burn or a quantified runway. Funding raised is likewise not
      cash available: Tracxn and LeadIQ publish materially different cumulative and latest-
      round figures, so neither estimate is suitable as a liquidity balance without cap-table
      and treasury confirmation.
    claimRefs:
      - "CI008"
      - "CI012"
      - "CI013"
      - "CI015"
      - "CI016"
  - id: "financial-verdict"
    title: "Financial verdict and underwriting blockers"
    body: >-
      The disclosed direction is constructive: revenue and gross profit grew, expenses
      declined sequentially, and the operating loss narrowed. The quality of that improvement
      remains difficult to underwrite because all current operating metrics are company-issued
      or repeated by an investor, while the two independent data providers in the pool focus
      on financing estimates rather than audited performance. The core decision blockers are
      current cash and debt capacity, product-level net interest margin after credit losses,
      delinquency and recovery vintages, realized customer pricing, CAC and payback, and the
      bridge from the R$34.9 million operating loss to the R$75.9 million net loss. Until
      management provides those schedules, the evidence supports an improving accounting
      trajectory but not a firm conclusion on sustainable cash generation, runway, or
      capital self-sufficiency.
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI007"
      - "CI008"
      - "CI010"
      - "CI016"
