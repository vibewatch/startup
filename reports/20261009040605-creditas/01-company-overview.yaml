company:
  name: Creditas
chapter:
  number: 1
  title: Company Overview
  summary: Creditas is a São Paulo-based secured-lending platform founded by Sergio Furio in 2012, with official evidence of a US$231 million equity round in 2019, an IDB Invest loan signed in 2020, and a US$27.5 million bond financing priced in July 2026. Current valuation, exact headcount, customer count, revenue, and the complete ownership and governance structure remain unverified in the assigned public evidence.
sections:
  - id: identity-and-business-model
    title: Identity and business model
    body: >-
      Creditas is the Brazilian company Creditas Soluções Financeiras Ltda., not the
      similarly named Czech bank, Czech holding group, or Indian collections-software
      provider returned by several assigned searches. The company says Sergio Furio
      founded it as BankFacil in 2012. Its core model is digitally originated secured
      credit: technology and data analytics support distribution and operations, while
      real estate, automobiles, and payroll provide collateral. IDB Invest described
      the result as lower rates, longer maturities, and larger ticket sizes than
      unsecured alternatives. The evidence supports São Paulo as headquarters and
      Brazil as the original secured-lending market, but it does not establish a
      complete current product or geographic footprint.
    claimRefs: [CO001, CO002, CO003, CO014]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Sergio Furio is the only founder and continuing executive independently visible
      across the retained historical and current materials: the 2019 company release
      identifies him as founder and CEO, while the July 2026 bond announcement again
      names him as CEO. That continuity is useful, but it also makes founder dependence
      a live diligence issue because the assigned evidence does not provide a complete
      current executive roster, board list, succession plan, or voting-control map.
      Erica Stols appears as VP of DCM and Treasury in the 2026 financing notice.
      SoftBank representatives were expected to join the board after the 2019 round,
      but the evidence does not verify whether those seats remain occupied.
    claimRefs: [CO001, CO007, CO010]
    tableRefs: [TO002]
  - id: capital-and-stakeholders
    title: Capital history and stakeholder map
    body: >-
      The capital record shows repeated use of both equity and debt. Creditas announced
      a US$231 million SoftBank-led investment in July 2019, with Vostok Emerging
      Finance, Santander InnoVentures, and Amadeus Capital participating. IDB Invest
      later approved and signed BRL-denominated financing reported as US$28.6681
      million. In July 2026, the company priced US$27.5 million of senior unsecured
      bonds at 98.50% of face value with a 10.50% fixed coupon and April 2029 maturity;
      proceeds were earmarked for a buyback, full refinancing of the remaining
      2023/2026 bonds, and general corporate purposes. These terms show access to debt
      capital, but the double-digit coupon is also a material cost-of-capital signal.
    claimRefs: [CO004, CO005, CO008, CO009]
    tableRefs: [TO003]
    figureRefs: [FO001]
  - id: scale-and-evidence-quality
    title: Scale signals, conflicts, and unresolved metrics
    body: >-
      Historical operating claims are substantial but stale: Creditas reported a
      700-person team and fivefold revenue growth in 2018. A current third-party signal
      page places the company in a broad 1,001-5,000 employee band, but that is not an
      exact verified headcount. The assigned evidence does not support a current
      customer count, revenue or run-rate, equity valuation, or financing stage.
      Moreover, an independent funding database says the latest disclosed round was
      Series C in January 2018, directly conflicting with the company's documented
      2019 round. Search results also mixed in three unrelated CREDITAS businesses.
      These conflicts make primary-document reconciliation essential and preclude
      treating aggregator figures as cover metrics.
    claimRefs: [CO006, CO011, CO012, CO013, CO014, CO015, CO016]
callouts:
  - calloutType: risk
    title: Public scale data is not decision-grade
    body: >-
      Current valuation, revenue, exact headcount, customer count, cap-table ownership,
      and board composition are not verified by the assigned evidence. A financing
      database also misses the official 2019 round, while name collisions introduce
      unrelated Czech and Indian companies into search results.
    claimRefs: [CO013, CO014, CO015, CO016]
