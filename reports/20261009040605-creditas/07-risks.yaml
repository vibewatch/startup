chapter:
  number: 7
  title: "Risks"
  summary: "Creditas faces structural credit, liquidity, and regulatory vulnerabilities stemming from its high-interest Brazilian consumer credit exposure, heavy reliance on asset-backed securitization (FIDC/CRI) funding, and supervisory upgrading under Banco Central do Brasil following the acquisition of Banco Andbank Brasil. While the Group achieved operational breakeven in late 2023, its high debt leverage, foreign exchange exposure on USD bonds, and sensitivity to Selic rate cycles create material residual risks requiring ongoing underwriting discipline and capital replenishment."
sections:
  - id: "regulatory-legal-risk"
    title: "Regulatory, Legal, and Prudential Supervision Risks"
    body: "Creditas operates under the oversight of Banco Central do Brasil (BCB), where the acquisition and consolidation of Banco Andbank Brasil fundamentally transforms its regulatory risk profile. Historically regulated primarily as a lightweight direct credit company (Sociedade de Crédito Direto or Creditas SCD), the absorption of a full banking license subjects the Group to significantly more rigorous prudential requirements [CR002]. Under BCB rules, the consolidated financial institution must comply with heightened capital adequacy standards, liquidity coverage ratios under Basel III frameworks, and expanded periodic regulatory reporting across financial, operational, and risk management domains [CR002]. Any operational inability or systems deficiency in satisfying these elevated prudential requirements could trigger administrative penalties, operational restrictions, or revocation of banking authorizations [CR002]. Concurrently, legislative initiatives such as Bill of Law No. 5,473/2025 propose increasing the Social Contribution on Net Income (CSLL) applicable to SCDs from 9% to 15%, aligning fintech direct lenders with traditional financial institutions and threatening net margins [CR006]. Furthermore, Brazil's comprehensive value-added tax (VAT) reform introduces a dual VAT regime (IBS and CBS) that begins phased implementation in 2026 and 2027, creating ongoing uncertainty regarding the net effective tax burden on financial intermediation and fee-based revenues [CR006]. Outside Brazil, operations in Mexico via LGF Occidente S.A. de C.V. SOFOM remain subject to potential shifts in local consumer finance oversight [CR008]. On the consumer protection front, Creditas is bound by the Brazilian Consumer Defense Code (Código de Defesa do Consumidor), exposing the firm to administrative sanctions, municipal consumer agency audits, and public civil actions regarding contractual transparency, collection practices, and loan pricing disputes [CR009]. Labor litigation represents another persistent compliance drain, with approximately 200 ongoing labor lawsuits in Brazil covering overtime and wage parity claims [CR007]."
    claimRefs:
      - "CR002"
      - "CR006"
      - "CR007"
      - "CR008"
      - "CR009"
    tableRefs:
      - "TR001"
  - id: "operational-technology-credit-risk"
    title: "Operational, Underwriting, and Credit Quality Vulnerabilities"
    body: "As a secured consumer lender, Creditas is structurally exposed to the repayment capacity of Brazilian borrowers and the recovery efficacy of underlying collateral pools. In its official regulatory disclosures, Creditas estimated that approximately 12 percent of the total lent amount in recent originations would not be repaid by borrowers [CR001]. The platform's core underwriting model depends on machine learning algorithms and proprietary artificial intelligence solutions that ingest third-party credit bureau data to estimate default probabilities and price risk [CR005]. These algorithms are vulnerable to training data bias, model drift, and macroeconomic dislocations where historical default correlations break down during economic stress [CR005]. When defaults occur, Creditas acts as the servicing agent for its securitization funds, executing extrajudicial repossessions or judicial foreclosures against vehicles and real estate properties [CR004]. Depreciating collateral values in secondary markets and protracted legal timelines in Brazilian courts directly impair recovery yields, eroding the excess spread that accrues to the subordinated fund quotas retained by the company [CR004]. Operationally, the platform depends heavily on specialized third-party data providers including Serasa, Boa Vista, TransUnion, ClearSale, Neoway, and WhatsApp Business for KYC verification, credit scoring, fraud prevention, and customer communication [CR010]. Disruptions, API outages, or contractual terminations with these vendors impair origination throughput and elevate fraud vulnerabilities [CR010]. Cloud infrastructure hosted across Amazon Web Services and Google Cloud remains subject to cybersecurity attacks, data leakage risks under CMN Resolution 4,893 and the LGPD, and potential open-source software licensing challenges [CR011]. Human capital retention poses an additional dependency, centered around founder and Chief Executive Officer Sergio Furio, whose personal leadership remains critical to capital markets relationships and strategic execution [CR012]."
    claimRefs:
      - "CR001"
      - "CR004"
      - "CR005"
      - "CR010"
      - "CR011"
      - "CR012"
    tableRefs:
      - "TR002"
    figureRefs:
      - "FR001"
  - id: "financial-counterparty-model-risk"
    title: "Financial Leverage, Securitization Architecture, and Refinancing Exposure"
    body: "Creditas relies on a dual-track funding architecture that segregates corporate operating capital from loan portfolio funding. Portfolio originations are predominantly financed off-balance-sheet through non-recourse true-sale securitizations, specifically Fundos de Investimentos em Direitos Creditórios (FIDCs) and Certificados de Recebíveis Imobiliários (CRIs), alongside bank deposits sourced via Andbank [CR003]. Securitization structures represent approximately 55 percent of total group liabilities, which reached R$7,015 million against equity of R$4.6 million as of September 2025 [CR003]. Because Creditas holds the subordinated equity quotas of these vehicles to capture the portfolio excess spread, higher customer defaults, elevated funding benchmark rates (Selic), or rising investor discount margins directly depress cash flow directed to the parent company [CR003]. At the corporate level, Creditas has repeatedly accessed international debt capital markets by issuing USD-denominated senior unsecured bonds on Nasdaq Stockholm, including USD 50 million issued in October 2025 and USD 27.5 million in July 2026 with a fixed coupon of 10.50% maturing in April 2029 [CR013, CR014]. Because the vast majority of operating assets and loan collections are denominated in Brazilian Reais, this creates foreign currency exchange risk and debt service dependency on cross-border cash remittances [CR013]. Although parent company guarantees on warehouse credit lines were removed to mitigate direct operational encumbrance, covenants governing bond frameworks and securitization vehicles impose strict equity ratio and asset-at-risk limits [CR015, CR016]. Macroeconomic cyclicality, elevated domestic interest rates, and capital market volatility constitute material threats to liquidity, credit costs, and refinancing capacity at bond maturity [CR013, CR014]."
    claimRefs:
      - "CR003"
      - "CR013"
      - "CR014"
      - "CR015"
      - "CR016"
    tableRefs:
      - "TR003"
