    body: "The simultaneous convergence of elevated Selic benchmark interest rates, an off-balance-sheet securitization funding engine comprising 55% of total liabilities, and supervisory upgrading to full bank status under Banco Central do Brasil represents Creditas's central operational vulnerability. While operational breakeven provides core resilience, failure to navigate Basel III compliance or an abrupt capital market disruption would immediately threaten excess spread cash flows and debt refinancing capabilities."
