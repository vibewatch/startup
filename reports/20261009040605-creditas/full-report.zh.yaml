        - 25%
        - $1.0B - $1.5B
        - 高利率环境持续，车贷逾期率上升，下轮再融资导致高级优先权被清零
        - 违反高级债权人债务契约，或二级市场交易折价扩大至 60% 以上
    notes: 情景估值假设收入倍数在 1.5x 至 4.0x 之间，依据是历史估值（$1.75B E 轮至 $4.8B F 轮）及公开金融科技可比公司。
    claimRefs:
      - CV001
      - CV003
      - CV007
      - CV013
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Creditas 从 2012 年的有担保贷款初创公司发展为股权与债务混合融资平台，最近观察到的资本事件发生于 2026 年 7 月。
    data:
      items:
        - date: '2012'
          label: 以 BankFacil 名义成立
          detail: Sergio Furio 创立了后来成为 Creditas 的公司。
          tone: neutral
        - date: '2017'
          label: 开始垂直整合放贷流程
          detail: Creditas 称，公司开始从贷款发放转向管理完整放贷流程。
          tone: positive
        - date: '2018'
          label: 历史规模口径
          detail: 公司报告称团队有 700 人，且当年收入增长至五倍。
          tone: positive
        - date: '2019-07-10'
          label: 宣布 US$231m 投资
          detail: SoftBank 领投的股权融资已宣布，但仍取决于授权与交割条件。
          tone: positive
        - date: '2020-11-24'
          label: IDB Invest 融资获批
          detail: IDB Invest 记录了对巴西有担保贷款平台融资的批准。
          tone: neutral
        - date: '2020-12-31'
          label: IDB Invest 融资签署
          detail: 项目页面记录的签署金额为 US$28.6681m，以 BRL 计价。
          tone: neutral
        - date: '2026-07-07'
          label: 新债券定价
          detail: Creditas 为 US$27.5m、票面利率 10.50%、2029 年 4 月到期的高级无担保债券定价。
          tone: warning
        - date: '2026-07-14'
          label: 预计新债券交割
          detail: 预计发行交割及 US$4m 回购将在该日期完成。
          tone: neutral
        - date: '2026-07-22'
          label: 安排提前赎回
          detail: 剩余 2023/2026 年债券计划按 101.30% 有条件提前赎回。
          tone: neutral
    approximationNotes: 日期均非估计值；2026 年交割与赎回条目保留公告中的预计及有条件状态。
