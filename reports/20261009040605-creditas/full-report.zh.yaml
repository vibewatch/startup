      - number: '7.2'
        title: 运营、授信与信贷质量脆弱性
        blocks:
          - type: paragraph
            body: >-
              作为抵押消费贷款机构，Creditas 在结构上暴露于巴西借款人的偿付能力和抵押资产池的回收效率。Creditas 在官方监管披露中估计，近期发放贷款的总金额中约有 12 percent 不会由借款人偿还
              [CR001]。平台核心授信模型依赖机器学习算法和自有人工智能方案，吸收第三方征信数据来估计违约概率并定价风险
              [CR005]。在经济压力下，历史违约相关性可能失效，使这些算法容易受到训练数据偏差、模型漂移和宏观经济错位影响 [CR005]。发生违约时，Creditas
              作为证券化基金的服务代理人，对车辆和房地产执行庭外收回或司法止赎 [CR004]。二级市场抵押物贬值以及巴西法院冗长的法律流程会直接损害回收收益，侵蚀归属于公司持有次级基金份额的超额利差
              [CR004]。运营上，平台高度依赖 Serasa、Boa Vista、TransUnion、ClearSale、Neoway 和 WhatsApp Business 等专业第三方数据供应商，用于 KYC
              核验、信用评分、反欺诈和客户沟通 [CR010]。与这些供应商的中断、API 故障或合同终止会损害发放吞吐并提高欺诈脆弱性 [CR010]。部署在 Amazon Web Services 和 Google
              Cloud 上的云基础设施仍面临网络攻击、CMN 第 4,893 号决议及 LGPD 下的数据泄露风险，以及开源软件许可挑战 [CR011]。人力资本留存也是依赖因素，核心是创始人兼 CEO Sergio
              Furio，其个人领导力仍对资本市场关系和战略执行至关重要 [CR012]。
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR010
              - CR011
              - CR012
