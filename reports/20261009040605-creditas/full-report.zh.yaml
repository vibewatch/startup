      - number: '5.3'
        title: 技术栈、治理与尽调障碍
        blocks:
          - type: paragraph
            body: >-
              Creditas 的技术基础设施结合商业云服务、自研数据分析和自动化授信工作流 [CE008, CE009]。外部技术栈使用 Amazon Web Services（AWS）提供云计算和数据存储，并以 Adobe
              Analytics 和 Google 营销工具追踪获客；Freshworks Freshdesk、Intercom 和 WhatsApp Business 则用于客户沟通和数字贷款服务
              [CE009]。据估计，运营工作由约 2,100 名员工执行，覆盖软件工程、信贷审批、资产法律文件和客户催收 [CE010]。

              尽管有这些运营能力，仍有重大技术和治理风险需要确认性尽调。第一，Banco Andbank Brasil 的旧银行核心与 Creditas
              数字微服务架构进行技术整合，会带来核心银行迁移风险、数据对账障碍和监管报告复杂性 [CE012]。第二，Creditas
              对自有自动估值模型（AVM）、算法信贷风险评分和违约回收预测引擎保持严格不透明，外部无法验证其在经济下行周期中的授信稳健性 [CE013]。最后，Creditas 是封闭的企业平台，没有公开开发者
              API、开源代码库或技术基准，因此无法从外部证据验证其软件架构、部署速度和基础设施韧性 [CE014]。
            claimRefs:
              - CE008
              - CE009
              - CE010
              - CE012
              - CE013
              - CE014
