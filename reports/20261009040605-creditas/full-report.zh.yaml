              - CO015
      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Sergio Furio 是留存历史和当前材料中唯一独立可见的创始人及持续任职高管：2019 年公司公告称其为创始人兼 CEO，2026 年 7 月债券公告再次称其为
              CEO。这种连续性有助于判断管理层，但也使创始人依赖成为现实的尽调问题，因为指定证据没有提供完整的现任高管名单、董事会名单、继任计划或投票控制图。2026 年融资通知中，Erica Stols 的职务为 DCM
              和资金部 VP。2019 年融资后，SoftBank 代表原计划加入董事会，但证据无法确认这些席位是否仍有人担任。
            claimRefs:
              - CO001
