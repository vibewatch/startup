  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与经济买方
        blocks:
          - type: paragraph
            body: >-
              Creditas
              所处市场比整个巴西消费金融更窄：指定来源识别的是房屋净值、汽车净值、私人部门工资扣款贷款、车辆融资和保险，而非一般无抵押信贷。抵押物和工资扣款决定了边界，因为它们会改变授信、贷款定价、期限和额度。IDB
              Invest
              称，该模式把技术、抵押物和多种资金来源结合起来，提供更低利率、更长期限和更大额度。因此，经济买方和付款方主要是需要流动性或购买资产的家庭或员工；雇主和经销商可以支持分销或还款流程，但现有证据无法证明存在企业软件预算。现状替代方案包括银行信贷、无抵押个人贷款、经销商融资，以及不以资产借款。
            claimRefs:
              - CM001
              - CM002
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM006
              - CM007
              - CM008
              - CM009
          - type: table
            tableRef: TM003
            claimRefs:
