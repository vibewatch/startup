        blocks:
          - type: paragraph
            body: >-
              资本记录显示，公司反复使用股权和债务融资。Creditas 于 2019 年 7 月宣布获得 SoftBank 牵头的 US$231 million 投资，Vostok Emerging
              Finance、Santander InnoVentures 和 Amadeus Capital 参与。之后，IDB Invest 批准并签署了以 BRL 计价、报道金额为 US$28.6681 million
              的融资。2026 年 7 月，公司以面值 98.50% 的价格定价发行 US$27.5 million 优先无担保债券，固定票息 10.50%，2029 年 4 月到期；所得资金指定用于回购、全额再融资剩余的
              2023/2026 债券及一般公司用途。这些条款说明公司仍能获得债务资本，但两位数票息也发出了资本成本较高的信号。
