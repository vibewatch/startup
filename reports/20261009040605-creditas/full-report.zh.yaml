            title: 技术整合与架构透明度缺口
            body: >-
              收购 Banco Andbank Brasil 带来重大核心银行整合复杂性，需要让旧银行系统与现代数字金融科技 API 对齐。此外，由于没有公开开发者 API、技术白皮书或独立架构审计，外部证据无法验证
              Creditas 授信平台真实的可扩展性、自动化率和自有技术成熟度。
            calloutType: risk
            claimRefs:
