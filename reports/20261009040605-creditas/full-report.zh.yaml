      - number: '4.2'
        title: 利润率路径、成本与单位经济代理指标
        blocks:
          - type: paragraph
            body: >-
              2026 年第一季度毛利为 R$253.5 million，毛利率 40.0%，运营成本和费用为 R$288.4 million。因此经营亏损为 R$34.9 million，净亏损为 R$75.9
              million。管理层称，随着前置 IFRS 拨备压力缓解、利率环境正常化，报告毛利率正向 40%-45% 的队列盈利能力靠拢；这是公司展望，不是独立核实的队列证据。每位员工收入达到年化 R$1.4
              million，高于六个月前的 R$1.1 million，是有用的经营杠杆代理指标，但不是 CAC 或回本周期。指定证据没有公开的产品级获客成本、损失曲线、资金成本、贡献利润或回本周期，因此定价和单位经济表保留
              null，而不是制造虚假精确度。
