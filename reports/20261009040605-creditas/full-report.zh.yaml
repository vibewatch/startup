  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律与审慎监管风险
        blocks:
          - type: paragraph
            body: >-
              Creditas 受 Banco Central do Brasil（BCB）监管；收购并整合 Banco Andbank Brasil
              后，其监管风险画像发生根本变化。历史上公司主要作为轻型直接信贷公司（Sociedade de Crédito Direto 或 Creditas SCD）接受监管；吸收完整银行牌照后，集团将承担更严格的审慎要求
              [CR002]。根据 BCB 规则，合并金融机构必须满足更高资本充足率标准、巴塞尔 III 框架下的流动性覆盖率，以及涵盖财务、运营和风险管理的扩展定期监管报告要求
              [CR002]。若运营能力或系统无法满足这些更高要求，可能触发行政处罚、运营限制或银行授权撤销 [CR002]。与此同时，第 5,473/2025 号法案等立法计划拟将适用于 SCD
              的净利润社会贡献（CSLL）从 9% 提高至 15%，使金融科技直接贷款机构与传统金融机构接轨并威胁净利润率 [CR006]。巴西综合增值税改革引入双重 VAT 制度（IBS 和 CBS），于 2026 年和
              2027 年分阶段实施，持续增加金融中介和收费收入有效税负的不确定性 [CR006]。在巴西以外，通过 LGF Occidente S.A. de C.V. SOFOM
              开展的墨西哥业务仍可能受到当地消费金融监管变化影响 [CR008]。消费者保护上，Creditas 受《巴西消费者保护法典》（Código de Defesa do
              Consumidor）约束，可能因合同透明度、催收实践和贷款定价争议面临行政制裁、市级消费者机构审计和公益民事诉讼 [CR009]。劳动诉讼也是持续的合规负担：巴西约有 200
              起在审劳动案件，涉及加班和同工同酬索赔主张 [CR007]。
            claimRefs:
              - CR002
              - CR006
              - CR007
              - CR008
              - CR009
