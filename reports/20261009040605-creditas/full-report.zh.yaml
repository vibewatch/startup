  - id: FE001
    title: Creditas 端到端技术与运营架构栈
    type: stack
    summary: 六层架构栈覆盖消费者触点、自动化信用评估、抵押品估值、核心银行、融资载体与企业基础设施。
    approximationNotes: 架构层反映公开运营模型与公司披露；内部自研微服务拓扑仍未由公司披露。
    claimRefs:
      - CE001
      - CE004
      - CE006
      - CE008
      - CE009
    data:
      layers:
        - label: 客户互动与参与层
          detail: 覆盖消费者网页门户、原生移动应用、雇主 HR 福利门户与 WhatsApp Business 渠道的全渠道客户触点。
          items:
            - 消费者网页与移动应用门户
            - 企业 HR 福利平台（Creditas Benefícios）
            - 通过 WhatsApp 与 Intercom 对话式引导
        - label: 身份、欺诈与监管 KYC 层
          detail: 自动身份核验、文件 OCR、生物识别验证与反洗钱筛查。
          items:
            - 自动文件采集与光学字符识别
            - 生物识别人脸识别与身份验证
            - 反洗钱（AML）与制裁筛查
        - label: 抵押品估值与风险评分引擎
          detail: 自动估值引擎连接车辆定价基准、房地产产权记录与征信评分。
          items:
            - 车辆基准定价与车况评估（FIPE）
            - 房地产登记处（Cartório）与市政产权数据接入
            - 自研行为评分与征信整合
        - label: 贷款服务与垂直化生命周期引擎
          detail: 自研合同执行、留置权登记、自动收款与工资直接扣款编排。
          items:
            - 数字合同签署与留置权正式登记
            - 工资直接扣款与银行清算引擎
            - 自动化客户支持与服务（Freshdesk/Intercom）
        - label: 银行牌照与财富基础设施层
          detail: 通过 Banco Andbank Brasil 获得的受监管银行能力、资金管理与私人银行平台整合。
          items:
            - Banco Andbank Brasil 受监管银行牌照
            - 央行（BACEN）清算与准备金业务
            - Andbank Wealth 多家族办公室平台接口
        - label: 资本市场与证券化融资层
          detail: 资本结构、结构化应收账款基金（FIDC）与欧洲机构资本整合。
          items:
            - FIDC 证券化与结构化信贷发行
            - Andbank 战略融资与资金多元化
            - 多来源债务工具与机构资本额度
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 端到端客户旅程图，展示 Creditas 资产支持型放贷生态中的触点、运营接口、转化机制与扩张循环。
    data:
      items:
        - label: 发现与数字模拟
          stage: 发现
          touchpoints: Website lead form, Google Ads, social marketing campaigns
          friction: High user skepticism of predatory debt models; reluctance to pledge physical assets
        - label: 对话式筛选与引导
          stage: 引导
          touchpoints: WhatsApp Business API, Twilio Studio chatbot, automated lead forms
          friction: Document collection delays for vehicle registrations and real estate deeds
        - label: 远程抵押品估值
          stage: 信用评估
          touchpoints: Mobile phone virtual car inspection, remote real estate appraisal
          friction: Valuation discrepancies between user expectations and appraisal algorithms
        - label: 信贷审批与放款
          stage: 交割
          touchpoints: Digital contract execution, Open Finance data linkage, bank disbursement
          friction: Registry office notarization and lien recording administrative bottlenecks
        - label: 服务与关系管理
          stage: 服务
          touchpoints: Twilio Flex advisor communications, Creditas mobile app, monthly payment alerts
          friction: Customer payment adjustments under high SELIC macro interest rate environments
        - label: 生态交叉销售与扩张
          stage: 扩张
          touchpoints: Minuto Seguros auto insurance, employee benefits card, salary advances
          friction: Uncoordinated multi-product touchpoints risking user fatigue and app fragmentation
    approximationNotes: 阶段与触点源自 Twilio 案例研究披露及 Q3-24 运营审查。
    claimRefs:
      - CU003
      - CU005
      - CU006
      - CU007
  - id: FR001
    title: 风险严重程度与缓释成熟度矩阵
    type: matrix
    summary: 对关键组织、财务与监管风险进行跨维度评估，将残余严重程度与缓释成熟度对应起来。
    data:
      columns:
        - 残余严重程度
        - 缓释成熟度
        - 可能性
        - 监测指标
      rows:
        - label: 信用违约与回收不足
          values:
            - label: 关键
            - label: 已建立
            - label: 高
            - label: NPL 超过 90 天的比率及收回抵押品后的清算回收率
        - label: 证券化融资冻结
          values:
            - label: 关键
            - label: 发展中
            - label: 中
            - label: FIDC/CRI 高级份额配售利差及二级市场流动性
        - label: Andbank 巴塞尔 III 审慎过渡
          values:
            - label: 高
            - label: 发展中
            - label: 中
            - label: BCB 监管检查发现及监管资本缓冲
        - label: USD 债务币种与再融资风险
          values:
            - label: 高
            - label: 已建立
            - label: 中
            - label: USD/BRL 外汇汇率及 Nasdaq Stockholm 交易收益率
        - label: 第三方数据与云平台中断
          values:
            - label: 中
            - label: 已建立
            - label: 中
            - label: API 延迟及多云可用区运行时间报告
        - label: 税制改革与 CSLL 上调
          values:
            - label: 中
            - label: 发展中
            - label: 高
            - label: 5,473/2025 号法案的立法进展及有效税率变化
    approximationNotes: 评估反映作者截至 2026 年对已披露风险因素、资产负债表杠杆及缓释框架的分析。
    claimRefs:
      - CR001
      - CR002
      - CR003
      - CR006
      - CR010
      - CR013
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 将运营规模、结构性风险、估值压顶与尽调触发条件逐步串联到观察建议的决策路径。
    claimRefs:
      - CV002
      - CV004
      - CV007
      - CV011
      - CV013
    data:
      nodes:
        - id: scale
          label: 运营规模与抵押化
          description: 领先的数字化有担保贷款机构，累计融资超过 $1.2B，并拥有资产支持型信贷账簿
          tone: positive
        - id: margin
          label: 单位经济与利润率画像
          description: 采用工资与房屋净值担保的信用评估，单位贡献为正
          tone: positive
        - id: liquidity-risk
          label: 退出期限与流动性延迟
          description: 管理层排除了 2028 年前 IPO 的可能性，现有投资人的公开市场流动性因此被冻结
          tone: warning
        - id: overhang
          label: 高级优先权与上限溢出
          description: 多轮私募融资（Series D 至 G）可能累积清算优先权压力
          tone: warning
        - id: valuation-mark
          label: 估值立场：偏高
          description: 此前的 $4.8B 估值缺乏当前公开市场倍数和宏观利率的支撑
          tone: warning
        - id: decision
          label: 最终建议：观察
          description: 投资前持续关注 NPL 迁移、证券化空间和老股交易定价
          tone: neutral
      edges:
        - from: scale
          to: margin
          label: 支持
        - from: margin
          to: liquidity-risk
          label: 抵消
        - from: liquidity-risk
          to: overhang
          label: 叠加
        - from: overhang
          to: valuation-mark
          label: 施压
        - from: valuation-mark
          to: decision
          label: 驱动
