      - number: '6.2'
        title: 采用轨迹、发放速度与规模动态
        blocks:
          - type: paragraph
            body: >-
              截至 Q1-26，Creditas 管理的贷款组合扩大到 R$7.6bn，同比增长 22.4%，并由创纪录的季度发放额 R$1.1bn 支撑 [CU001, CU002]。这延续了 Q3-24 管理贷款组合
              R$5.8bn、季度发放额 R$815.4mn 带来的放量加速 [CU003, CU004]。汽车净值和房屋净值均在 Q1-26
              实现历史最高季度发放额，客户采用主要由这两项业务支撑；在更严格的风险回报标准下，e-Consignado 工资贷款也逐步恢复动能 [CU001, CU003]。Creditas
              称新队列正在替代价格较低的旧组合，使毛利率达到 40.0%，但管理层没有披露活跃借款账户数、独立客户数或重复借款率，离散借款人的确切规模仍未核实 [CU001, CU003]。
