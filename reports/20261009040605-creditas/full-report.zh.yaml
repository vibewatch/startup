            body: >-
              Creditas 推行跨资产扩张策略，试图在客户整个资产生命周期内满足其多种金融需求，将抵押信贷与汽车保险经纪（通过 Minuto Seguros）、车辆交易市场和企业福利卡结合起来 [CU003,
              CU007]。管理层称客户黏性是关键缓冲，使公司可以在不损害客户转化或信贷质量的情况下实现更高金融利润率 [CU003]。但 Creditas
              对借款人群体的队列净收入留存率（NRR）、总收入留存率（GRR）和交叉销售渗透率仍严格不透明 [CU001, CU003]。此外，依赖企业 HR 合作伙伴分销 e-Consignado
              会产生机构守门人摩擦；巴西宏观利率持续高企，则使借款人暴露于再融资敏感性和偿债约束 [CU001, CU008]。
