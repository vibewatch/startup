            body: >-
              Creditas 将 Twilio Segment 与 WhatsApp Business API 整合到抵押贷款获客流程中，使平均等待时间从 52 分钟降至 2 分钟，并将获客成本削减
              15%。这种前端数字效率让 Creditas 能快速扩大贷款发放，同时绕开传统银行网点的运营开销 [CU005, CU006]。
