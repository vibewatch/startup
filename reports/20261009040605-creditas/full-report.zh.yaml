chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与商业模式
        blocks:
          - type: paragraph
            body: >-
              Creditas 的巴西实体是 Creditas Soluções Financeiras Ltda.，并非多次指定搜索返回的同名捷克银行、捷克控股集团或印度催收软件供应商。公司称 Sergio Furio 于
              2012 年以 BankFacil 创立了它。核心模式是数字化发放抵押信贷：技术和数据分析支持分销与运营，房地产、汽车和工资收入提供抵押物。IDB Invest
              称，这一模式相比无抵押替代方案能提供更低利率、更长期限和更大额度。证据支持圣保罗为总部、巴西为最初的抵押贷款市场，但不足以确认当前完整的产品或地域覆盖。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO014
