  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与抵押贷款解决方案
        blocks:
          - type: paragraph
            body: >-
              Creditas 运营一个整合式巴西数字金融服务平台，核心是资产支持型贷款、保险分销和职场金融解决方案 [CE001]。公司最初以 BankFacil 为名，于 2012 年作为贷款搜索和发放经纪商成立，并在
              2017 年启动大规模运营纵向整合，将完整贷款生命周期收归内部管理 [CE002]。Creditas 不再只是线索生成中介，而是直接负责借款人准入、资产正式评估、产权数字登记和持续贷款服务。

              Creditas 贷款架构的核心是三类抵押信贷产品，用于降低巴西无抵押消费信贷风险 [CE001]：房屋净值贷款（Creditas Imóvel）、汽车净值贷款（Creditas
              Auto）和工资代扣信贷（Creditas Benefícios）。在房屋净值业务中，借款人以住宅或商业房地产作第一顺位抵押，摊还期限最长可达 240
              个月，相比传统无抵押透支或个人贷款，年化利率显著更低。汽车净值模块通过数字化车辆估值基准和州登记系统电子留置权，让车主再融资车辆净值或获得消费流动性。工资信贷模块直接接入私营企业和公共部门工资系统，自动扣薪可减少违约及催收摩擦
              [CE001, CE008]。
            claimRefs:
              - CE001
              - CE002
              - CE008
