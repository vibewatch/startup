      - number: '4.3'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公开记录显示有多个资金渠道，但无法证明当前流动性。IDB Invest 描述了 2020 年最高 US$30 million 的贷款；公司 2025 年公告称，一只 R$800 million 的汽车 FIDC
              吸引了 R$2.3 billion 需求。这些工具证明公司能获得机构资金，但没有揭示不受限现金、当前仓储额度使用率、契约余量或可用于新发放的金额。管理层称 2026
              年第一季度维持现金流中性，也不是披露的现金流量表，不应等同于零烧钱或可量化的现金跑道。累计融资同样不等于可用现金：Tracxn 和 LeadIQ
              发布的累计及最近一轮数字差异很大，在没有股权表和资金部门确认前，任何估算都不适合作为流动性余额。
            claimRefs:
              - CI008
              - CI012
              - CI013
              - CI015
              - CI016
      - number: '4.4'
        title: 财务结论与投资判断障碍
        blocks:
          - type: paragraph
            body: >-
              已披露方向较为积极：收入和毛利增长，费用环比下降，经营亏损收窄。但改善质量仍难以纳入投资判断，因为当前所有经营指标都由公司发布或经投资方转述，而资料中的两家独立数据供应商关注的是融资估算，不是经审计的经营表现。核心障碍包括当前现金和债务能力、扣除信贷损失后的产品级净息差、逾期和回收
              vintage、实际客户定价、CAC 与回本周期，以及从 R$34.9 million 经营亏损到 R$75.9 million
              净亏损的桥接。在管理层提供这些明细前，证据只支持会计轨迹改善，不能坚定判断可持续现金创造、现金跑道或资本自给能力。
