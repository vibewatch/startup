      - number: '7.3'
        title: 财务杠杆、证券化架构与再融资敞口
        blocks:
          - type: paragraph
            body: >-
              Creditas 依靠双轨融资架构，将公司运营资本与贷款组合资金分开。贷款组合发放主要通过表外、无追索权的真实出售证券化融资，具体包括信用权利投资基金（FIDC）和房地产应收凭证（CRI），同时辅以
              Andbank 吸收的银行存款 [CR003]。截至 2025 年 9 月，证券化结构约占集团总负债的 55%，总负债为 R$7,015 million，而股东权益为 R$4.6 million
              [CR003]。由于 Creditas 持有这些工具的次级股权份额以获取组合超额利差，客户违约上升、基准融资利率（Selic）升高或投资者折价利差扩大，都会直接压低流向母公司的现金流
              [CR003]。Creditas 多次在 Nasdaq Stockholm 发行美元计价优先无担保债券，进入国际债务资本市场，包括 2025 年 10 月发行的 USD 50 million，以及 2026 年
              7 月发行的 USD 27.5 million；后者固定票息 10.50%，2029 年 4 月到期 [CR013,
              CR014]。由于绝大多数运营资产和贷款回款以巴西雷亚尔计价，这会产生外汇风险，并使偿债依赖跨境现金汇款
              [CR013]。尽管公司取消了仓储信贷额度的母公司担保，以减轻直接运营负担，但债券框架和证券化工具中的契约仍对股权比率和风险资产上限施加严格限制 [CR015,
              CR016]。宏观经济周期、国内利率高企和资本市场波动，都会在债券到期时对流动性、信贷成本和再融资能力构成重大威胁 [CR013, CR014]。
            claimRefs:
              - CR003
              - CR013
              - CR014
              - CR015
              - CR016
          - type: table
            tableRef: TR003
            claimRefs:
              - CR003
              - CR010
              - CR013
              - CR014
              - CR015
      - number: '7.4'
        title: 展示项
        blocks:
          - type: callout
            title: 审慎监管升级与信贷冲击脆弱性
            body: >-
              Selic 基准利率高企、占总负债 55% 的表外证券化融资引擎，以及 Banco Central do Brasil 将监管升级至完整银行状态同时发生，构成 Creditas
              的核心运营脆弱性。虽然运营盈亏平衡提供了基础韧性，但无法通过巴塞尔 III 合规或资本市场突然中断，将立即威胁超额利差现金流和债务再融资能力。
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与经营框架
        blocks:
          - type: paragraph
            body: >-
              Creditas 是一家规模化数字贷款平台，专注于巴西抵押消费信贷。公司以房地产、汽车和工资扣款为贷款产品提供抵押，相比无抵押个人贷款竞争者，结构性降低了信贷违约损失。公司由 Sergio Furio 于
              2012 年以 BankFacil 创立，2017 年转向纵向整合完整的贷款发放和服务生命周期。在 SoftBank Vision Fund、VEF Ltd.、Kaszek Ventures 和 Amadeus
              Capital 等主要国际成长型投资者支持下，Creditas
              在巴西抵押信贷领域建立了早期领先地位。但新兴市场环境下的抵押贷款运营复杂性独特：抵押物虽能压低毛损率，巴西资产回收却涉及复杂的司法和庭外执行流程，带来运营持有成本。评估 Creditas
              的投资逻辑，需要在其已证明的发放能力和较强授信能力，与国内基准利率高企及资产密集型资产负债表要求之间取得平衡。
            claimRefs:
              - CV001
              - CV004
              - CV005
              - CV006
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV007
              - CV011
      - number: '8.2'
        title: 融资历史、股权结构表变化与估值标记
        blocks:
          - type: paragraph
            body: >-
              Creditas 的资本结构反映了跨越多个市场周期的风险投资和成长融资轨迹。公司在 2019 年 7 月由 SoftBank 牵头的 Series D 轮融资中筹得 $231 million，随后于 2020 年
              12 月完成 $255 million 的 Series E 轮融资，投后估值 $1.75 billion；当时累计融资达到 $570 million。              2022 年 1
              月，Creditas 获得 Series F 融资，估值达到 $4.8 billion 的峰值。为夯实资本基础和监管架构，Creditas 于 2022 年 7 月完成 $50 million 的 Series
              F 延展轮，同时以 $95 million 收购 Andbank 的巴西银行牌照，并获得 $150 million 可转债。市场情报显示，截至 2025 年 12 月，14 轮股权和债务融资累计筹资约 $1.2
              billion。这段多层次融资历史可能使 Series D、E、F 和 G 股份类别存在清算优先权悬置，对后续机构投资者造成估值不对称。
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV007
              - CV009
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV009
              - CV012
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV004
              - CV007
              - CV011
              - CV013
      - number: '8.3'
        title: 情景估值、同行分析与回报不对称
        blocks:
          - type: paragraph
            body: >-
              评估 Creditas 的估值，需要把公开金融科技倍数压缩和国内利率高企纳入情景模型。在乐观情景（20% 概率）下，Creditas 成功利用银行牌照扩大零售存款，将混合资金成本降至 CDI 以下，并在预计
              2028 年上市时支持 $3.5 billion 至 $4.5 billion 的估值。在基准情景（55% 概率）下，平台保持贷款量稳定增长，同时应对证券化成本高企，支持 $2.0 billion 至 $2.8
              billion 的合理价值区间（相当于预计收入的 2.0x 至 2.5x）。在悲观情景（25% 概率）下，巴西基准利率持续维持两位数，压低贷款发放需求并压缩车辆抵押品估值，触发 $1.0 billion 至
              $1.5 billion 的结构化下轮再融资。区域新兴市场数字银行的公开可比公司表明，2021-2022 年高峰期设定的私募估值需要大幅折价调整，才能反映现实退出经济。
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV010
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV003
              - CV007
              - CV013
      - number: '8.4'
        title: 建议、退出期限与尽调要求
        blocks:
          - type: paragraph
            body: >-
              综合经营规模、资本结构和流动性风险后，整体尽调建议为观察，入场估值判断为偏高。Creditas 整合抵押贷款纵向业务的执行力可圈可点，但 CEO Sergio Furio 公开表示 2028
              年前排除首次公开募股，消除了近期公开市场流动性。早期员工和老股投资者目前可以通过 EquityZen
              等平台获得部分流动性，但机构成长型投资者将面对多年无法退出的持有期。在承诺新增成长股权或参与老股交易前，潜在投资者必须解决关键尽调缺口：第一，获取历史轮次中高级清算优先权的股权结构表透明度；第二，审阅汽车和房屋净值贷款账簿按
              vintage 划分的 90+ 天逾期曲线；第三，核实 Andbank 银行牌照整合是否带来了切实的存款融资效率。
            claimRefs:
              - CV002
              - CV008
              - CV011
              - CV013
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 尽调建议：观察
            body: 鉴于管理层已公开确认 2028 年前不会 IPO，且尚未细致披露优先股清算权，新机构资本应采取纪律严明的“观察”态度，而不是基于历史 $4.8B 估值支付溢价倍数。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV008
              - CV011
          - type: callout
            title: 流动性锁定与股权结构表优先权悬置
            body: 累计股权及可转债融资已超过 $1.2B，后期投资者可能持有高级清算优先权；一旦出现折价融资或流动性延迟，普通股股东将面临显著的下行稀释风险。
            calloutType: risk
            claimRefs:
              - CV007
              - CV009
              - CV013
          - type: callout
            title: 抵押资产护城河与融资成本压缩
            body: Creditas 自研的抵押物估值算法和担保贷款发放引擎，相比无担保金融科技贷款方提供了持久的信用风险优势；但回报仍高度敏感于国内银行间 CDI 利率及机构仓储债务成本。
            calloutType: insight
            claimRefs:
              - CV004
              - CV006
              - CV012
