      - number: '5.2'
        title: 银行牌照收购与企业运营模式
        blocks:
          - type: paragraph
            body: >-
              2025 年 12 月，Creditas 完成对 Banco Andbank Brasil 的战略收购，结束了始于 2022 年的正式监管交易 [CE003]。Andbank Brasil 的整合带来 R$2
              billion 抵押贷款组合，并把受监管的巴西银行牌照直接转入 Creditas [CE003,
              CE004]。这张牌照使运营模式发生结构性升级：金融科技公司可从只依赖证券化通道——例如信用权利投资基金（FIDC）——转为直接运营的持牌金融机构，直接接入央行结算基础设施、资金部门工具和受监管吸收存款能力
              [CE004]。

              在收购银行牌照的同时，Creditas 与欧洲私人银行机构 Andbank Group 建立战略财富联盟，以拓展 Andbank Wealth 在巴西的业务 [CE005]。作为完整交易的一部分，Andbank
              Group 牵头 Creditas 的 Series G 融资，首轮股权交割额为 US$108 million，对合并后的金融科技公司估值 US$3.3 billion [CE004,
              CE007]。包括瑞典投资公司 VEF AB (publ) 在内的长期机构支持者，再次表达了对平台银行纵向整合战略的支持 [CE011]。为管理整合后的银行、技术和运营架构，Creditas 任命前 BBVA
              全球 CIO 和 CHRO Ricardo Forcano 为首席技术与运营官（CTO/COO），将 IT 基础设施、平台工程和运营工作流集中到统一的高管体系下 [CE006]。
            claimRefs:
              - CE003
              - CE004
              - CE005
              - CE006
