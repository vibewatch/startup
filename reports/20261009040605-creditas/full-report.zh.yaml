              - CM010
              - CM011
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              当前最有力的规模视角是 Creditas 自身的经营覆盖，而不是自上而下的市场预测。Creditas 报告称，2026 年第二季度贷款组合为 R$8.1 billion，季度发放额为 R$1.14
              billion，公司计算的年化发放运行率超过 R$4.5 billion。公司还称，工资贷款覆盖了约 22% 的可服务私营部门员工群体，高于第一季度的
              12.5%。这些指标说明了业务规模和产品级空间，但使用了不同期间和分母：贷款组合是存量，发放额是流量，收入是会计收入，覆盖率则是公司定义的人群百分比。除非有独立来源的市场分母，否则不应把它们改称
              TAM、SAM、SOM 或市场份额。
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM016
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM016
      - number: '2.3'
        title: 采用驱动因素与约束
        blocks:
          - type: paragraph
            body: >-
              清晰的借款人价值主张和运营吞吐量支持采用。抵押物可以支撑更低利率及更大、期限更长的贷款；Creditas 称自动化降低了获客成本强度并加快授信。同一模式也带来约束：公司报告 SELIC
              在高位维持更久，按监管利率上限调整了私人部门工资贷款产品，并于 2026 年 7 月以 10.50% 固定票息再融资无担保债务。Creditas
              还把技术、催收和销售内置于公司，早期纵向整合使其超越纯线索发放。这样的控制可能改善转化和单位经济，但 Euromoney 将部分金融科技公司描述为需要实体运营，这提醒我们注意纯数字市场叙事忽略的执行和资本密集度。
            claimRefs:
              - CM002
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
      - number: '2.4'
        title: 分部动能与尽调含义
        blocks:
          - type: paragraph
            body: >-
              2026 年第二季度各产品增长不均：Creditas 报告汽车金融同比增长 51.3%，房屋净值增长 31.6%，汽车净值增长 19.8%。这种分化支持按分部建立采用模型，而不是采用单一混合市场增长假设。已完成的
              Andbank Brazil 收购为经营模式增加了银行基础设施，但指定证据没有量化其对资金成本、审批能力、分销或可服务需求的影响。因此，估值模型应将已证明的公司增长与市场规模分开，并在赋予基于 TAM
              的上行空间前，要求提供巴西外部来源的各抵押物类别余额和发放量、合格借款人数、竞争对手规模，以及公司私营员工覆盖率的书面分母。
            claimRefs:
              - CM007
              - CM008
              - CM009
              - CM014
              - CM016
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 不要把未经支持的 TAM 资本化
            body: 指定资料支持公司规模和工资覆盖率代理指标，但不支持分母一致、独立的巴西 TAM/SAM/SOM。宽泛的消费信贷估算会夸大相关抵押物、资格、定价和渠道边界。
            calloutType: risk
            claimRefs:
              - CM016
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局与证据边界
        blocks:
          - type: paragraph
            body: >-
              Creditas 争夺的是能够以房屋、车辆或工资相关现金流作抵押的借款人，而不是整个金融服务软件类别。公司 2019 年公告提到房屋净值和汽车抵押贷款；IDB Invest
              则描述了以房地产、汽车和工资为抵押。留存的第三方比较证据过弱，无法列出经过核实的直接同行：Latka 把 Intapp、Razorpay 和 WorldRemit
              标为最接近的替代者，尽管其分类属于宽泛的金融服务软件。另有两个搜索结果指向无关的同名企业——印度催收软件供应商和捷克银行集团——而非巴西贷款机构。因此，竞争格局表将有支持的替代方案与仍未核实的类别分开，包括现状、内部自建和潜在进入者，不把搜索结果冲突包装成竞争对手。
            claimRefs:
              - CP001
              - CP002
              - CP014
              - CP015
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP005
              - CP014
              - CP015
              - CP016
      - number: '3.2'
        title: 能力与分销
        blocks:
          - type: paragraph
            body: >-
              最有支持的差异化来自结构，而非功能数量领先。IDB Invest 报告称，Creditas 将技术和分析与抵押物及多种资金来源结合，提供更低利率、更长期限和更大额度。2020
              年融资原计划支持向中小微企业和脆弱借款人放贷，说明平台当时同时服务消费和小企业流动性需求。Andbank
              交易在资本市场融资之外增加了潜在的存款资金渠道；管理层称银行牌照可提升融资效率、利润率并降低客户成本。这些机制可能凭借授信数据和资金渠道提高切换成本，但没有留存来源量化借款人留存、多平台使用、合作伙伴排他性或渠道集中度。
            claimRefs:
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP004
              - CP007
              - CP009
              - CP010
      - number: '3.3'
        title: 规模与战略方向
        blocks:
          - type: paragraph
            body: >-
              公司发布的 2026 年第二季度业绩显示出可观规模和广泛的产品动能：贷款组合 R$8.1 billion，季度收入 R$722.9
              million，汽车净值、房屋净值、私人工资贷款和汽车金融的贷款组合均同比增长。汽车金融是披露增长最快的产品，达到 51.3%；房屋净值增长
              31.6%。这种广度支持多产品分销逻辑，但由于来源没有同口径同行分母，这些指标不能作为竞争基准。KPI 展示项保留发行方的指标名称、期间和单位，不把季度收入换算成
              ARR，也不推断份额。指定资料中没有独立核实这些经营数据。
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP010
      - number: '3.4'
        title: 持久性、定价与反向信号
        blocks:
          - type: paragraph
            body: >-
              护城河能否持久，取决于更低资金成本和抵押专业能力能否经受既有机构的反击。指定证据支持的是方向，而非量化价格优势：IDB Invest 描述了更低利率、更长期限和更大额度；Creditas
              管理层称存款可以改善融资效率并降低客户成本。留存来源没有提供当前 APR、费用、贷款价值比区间、审批时长或可比同行报价。历史反向信号也削弱规模叙事。Bloomberg Linea 报道称，2022
              年延期融资在风险投资市场趋紧时维持 $4.8 billion 估值，并指出 Creditas 报告的 11 人裁员与外界所称的 300–400
              人解雇之间存在明显差异。最后，第三方规模数据仍不一致且方法不透明，强化了在判断持久护城河前核查一手同行和定价资料的必要性。
            claimRefs:
              - CP002
              - CP004
              - CP011
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP002
              - CP004
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 直接同行证据尚不足以支持决策
            body: 指定资料没有经过核实的同职能同行定价、损失率、审批时长或留存数据。宽泛的软件分类和无关同名企业不能支持竞争排名。
            calloutType: risk
            claimRefs:
              - CP014
              - CP015
              - CP016
          - type: callout
            title: 融资架构可能是更持久的差异化因素
            body: 抵押专业能力可以复制，但如果 Creditas 能证明存款实质性降低产品级资金成本，将多种资金来源与银行牌照结合起来可能改善定价灵活性。
            calloutType: insight
            claimRefs:
              - CP002
