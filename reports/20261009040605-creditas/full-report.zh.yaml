        title: 展示项
        blocks:
          - type: callout
            title: 纵向整合抵押物管理形成结构性护城河
            body: >-
              Creditas 从无抵押贷款经纪商转为端到端纵向整合的发放及服务商，形成了强大的运营壁垒。通过把数字文件验证与产权登记、车辆留置权和企业工资系统整合，Creditas 能为借款人提供比无抵押消费贷款机构更低的
