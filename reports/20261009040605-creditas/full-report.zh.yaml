  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户分层与资产支持型买方画像
        blocks:
          - type: paragraph
            body: >-
              Creditas 按主要个人资产类别，而不是无抵押消费信贷层级，构建可服务消费人群 [CU001, CU003]。公司在巴西主要面向三类零售及职场人群：希望通过汽车净值贷款获得流动性的个人车主
              [CU003]；需要更大额度、通过房屋净值合同延长摊还期限的房主 [CU003, CU007]；以及使用工资扣款个人贷款（e-Consignado）和员工福利的正式受雇企业员工 [CU001, CU003,
              CU008]。与巴西历史年化消费借款利率超过 100% 的无抵押模式不同，Creditas 要求房地产、汽车或工资留置权，定位其抵押模式以提供明显更便宜的流动性和更长期限 [CU007,
              CU008]。不过，地域仍高度集中在巴西；墨西哥和西班牙的国际业务总体规模仍属次要 [CU007]。
            claimRefs:
