  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与已披露进展
        blocks:
          - type: paragraph
            body: >-
              Creditas 是资产支持型贷款机构，而非订阅软件公司，因此季度贷款收入不应标为 ARR。公司 2026 年第一季度公告称，贷款发放额为 R$1.1 billion，贷款组合为 R$7.6
              billion，收入为 R$633.0
              million。公开材料将汽车净值、房屋净值、私人员工工资贷款、汽车金融和保险列为活跃业务线，但没有披露各业务线的确认收入或毛利。收入流分析因此把可观察产品与推断出的变现机制分开，并将实际定价、费用抽成和收入组合留作尽调缺口。历史公司材料还称，公司从纯发放转向管理完整贷款流程；相比只做转介，这会带来更广泛的运营和资金压力。
            claimRefs:
