chapter:
  number: 2
  title: Market Analysis
  summary: Morpho’s real market is not “all lending” but the subset of global credit that can migrate onto stablecoins, liquid crypto collateral, and compliant tokenized assets. The strongest positives are the size and growth of stablecoins, the rapid expansion of RWAs, and visible buyer demand from exchanges, wallets, and treasury platforms that want embedded yield or borrow products. The main constraints are that DeFi remains a niche share of crypto overall, regulation still leaves perimeter questions unresolved, and isolated markets require distribution and curation to solve liquidity fragmentation.
sections:
- id: market-boundary-and-sizing-lenses
  title: Market boundary and sizing lenses
  body: Morpho’s relevant market should not be underwritten using the entire global credit universe. The practical market today is the overlap between onchain dollar liquidity, overcollateralized borrowing demand, risk-managed vault products, and tokenized collateral that institutions or retail platforms are actually willing to distribute. That is still a large opportunity, but it is much narrower and more investable than generic “finance onchain” rhetoric. The cleanest retained lenses are DeFi lending TVL, stablecoin float, and tokenized-RWA growth. EBA and ESMA still describe DeFi as niche relative to the wider crypto market, which is important discipline against overstatement. At the same time, DefiLlama shows lending is already one of crypto’s largest application categories, and the stablecoin base above $300 billion provides a meaningful capital pool that can be routed into lending products. Morpho benefits if those pools keep compounding, but the sizing case should remain layered and
    conditional rather than anchored to one enormous TAM slide.
  claimRefs:
