- id: buyers-users-and-distribution-model
  title: Buyers, users, and the embedded-distribution model
  body: Morpho is not selling first to anonymous borrowers. The most important buyers are platforms that already control users, balances, and trust. Exchanges want to add DeFi-like lending yields without building proprietary lending books. Treasury and custody platforms want capital-efficiency features inside existing approval workflows. Wallets want to turn passive balances into yield without forcing users through a raw protocol UI. Mainstream fintechs want a borrow or earn backend that feels native to their app. This is why the partner evidence from Kraken, Fireblocks, Robinhood, and Morpho’s curator stories matters more than vanity app metrics. In this market, distribution is as important as protocol design. Morpho’s edge is that it can sit under many product shells while curators such as Steakhouse or Gauntlet handle parameterization and risk packaging. That embedded model is attractive, but it also means Morpho’s commercial outcome depends heavily on partner execution and continued
    willingness to route assets through open rather than captive balance-sheet rails.
  claimRefs:
