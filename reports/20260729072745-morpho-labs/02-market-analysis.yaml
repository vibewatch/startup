- id: TM005
  title: Stablecoin and collateral substrate table
  columns:
  - Substrate
  - What it contributes
  - Why it matters to Morpho
  - Limitation
  rows:
  - - USDC / major stablecoins
    - Dollar-denominated lendable balances
    - Core funding leg for most embedded earn and borrow products
    - Issuer and jurisdiction risk remain material.
  - - BTC / ETH collateral
    - Large liquid collateral base
    - Supports overcollateralized borrowing products with broad user demand
    - Price volatility drives liquidation risk.
  - - Yield-bearing stablecoins
    - Managed-dollar wrappers with built-in yield logic
    - Increase demand for programmable balance-sheet management
    - Complexity and counterparty stacks can increase.
  - - Tokenized treasuries and RWAs
    - Potential higher-quality collateral and institutional bridge
    - Could broaden borrower base and compliance comfort
    - Legal and technical standards are still forming.
  notes: Morpho’s medium-term market expansion depends on collateral quality and dollar liquidity becoming more institutionally acceptable, not only larger.
