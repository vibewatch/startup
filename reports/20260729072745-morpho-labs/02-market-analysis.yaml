- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence note
  rows:
  - - Stablecoin supply growth
    - Positive
    - Current
    - Larger lendable dollar base for earn and borrow products
    - Need quality-adjusted mix, not just gross supply.
  - - RWA collateral growth
    - Positive
    - Near- to mid-term
    - Expands collateral types and institutional relevance
    - Legal enforceability still varies by asset class.
  - - Embedded distribution by exchanges and wallets
    - Positive
    - Current
    - Simplifies adoption and can accelerate assets routed onchain
    - Creates partner concentration risk.
  - - MiCA clarity with open perimeter questions
    - Mixed
    - Current
    - Helps compliant wrappers but does not fully settle DeFi treatment
    - Monitor EU review outcomes closely.
  - - Liquidity fragmentation in isolated markets
    - Negative
    - Current
    - New markets need depth and curation to scale safely
    - Distribution and curator quality are critical.
  - - Crime, hacks, and compliance concerns
    - Negative
    - Persistent
    - Raises onboarding and risk-management burden for institutions
    - Protocol architecture alone cannot solve compliance.
  notes: Morpho’s market grows when distribution and collateral breadth outpace the drag from regulation, liquidity fragmentation, and trust concerns.
