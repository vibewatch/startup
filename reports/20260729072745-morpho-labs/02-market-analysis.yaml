- id: TM006
  title: Regulatory and adoption evidence table
  columns:
  - Evidence point
  - What it says
  - Implication for Morpho
  - Caution
  rows:
  - - EBA / ESMA joint report
    - DeFi is niche but subject to leverage, ML/TF, and disclosure risks
    - Regulators are paying attention to DeFi lending specifically
    - Supervision may intensify as adoption grows.
  - - MiCA implementation guides
    - Europe now has clearer token and CASP rules
    - Institutional wrappers have more defined paths to market
    - DeFi perimeter still unresolved.
  - - Kraken and Fireblocks product pages
    - Large distributors want simplified access to onchain yields
    - Demand exists for embedded distribution rather than raw protocols
    - Commercial durability depends on product uptake.
  - - Robinhood Earn disclosure
    - Mainstream apps must heavily disclose smart-contract and liquidity risks
    - Retail adoption can happen, but only with strong risk framing
    - Risk language may slow usage or increase churn.
  notes: Adoption evidence is strongest where distribution partners already control trust and workflow, but risk and disclosure obligations remain substantial.
