companyProfile:
  summary: Morpho Labs is a Paris-founded private DeFi infrastructure company building configurable onchain lending rails. Its stack centers on Morpho Blue, an immutable lending primitive with permissionless market creation, and MetaMorpho, a vault layer that lets curators package risk-managed credit products. Morpho has become a backend for partner-led lending and yield experiences across exchanges, wallets, and treasury platforms including Coinbase, Robinhood, Kraken, Fireblocks, Ledger, and Trust Wallet. Public evidence supports unicorn status via a $175M 2026 round at up to a $2B valuation and an $11B+ deposits narrative, while leaving revenue capture, partner concentration, and token/equity structure only partially disclosed.
