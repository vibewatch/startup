        title: Final judgment and diligence asks
        blocks:
          - type: paragraph
            body: >-
              The public record supports a positive but conditional recommendation. Morpho looks worthy of serious
              diligence because it has high-quality investors, a growing role in embedded onchain credit, and product
              design choices that align with institutional requirements better than many earlier DeFi lenders. However,
              the valuation case should be framed as “promising infrastructure with incomplete monetization visibility,”
              not as “fully proven compounding software platform.” A disciplined investor could justify engaging at the
              current tier only if private diligence closes the most important gaps: fee capture, partner concentration,
              token-versus-equity economics, governance rights, downside protections, and incident resilience. Without
              that evidence, the right stance is not to reject Morpho outright, but to resist paying for perfection
              based on TVL and prestige alone. A disciplined process would treat the round as a serious invitation to
              diligence, not as sufficient diligence in itself.
            claimRefs:
              - CV029
              - CV030
