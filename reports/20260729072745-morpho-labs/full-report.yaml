      - CR029
  - id: FR002
    title: Risk transmission map
    type: flow
    layout: wide
    summary: >-
      A shock can travel from collateral, oracle, or policy change through markets and partners into user losses and
      brand damage.
    data:
      nodes:
        - id: r1
          label: External shock
          detail: Collateral volatility, regulatory action, exploit, or sanctions event.
        - id: r2
          label: Market / vault stress
          detail: Oracle distortions, bad debt, liquidity tightening, or curator reallocation.
        - id: r3
          label: Partner UX impact
          detail: Withdrawals slow, disclosures intensify, or product access narrows.
        - id: r4
          label: User trust impact
          detail: Users question safety and capital availability.
        - id: r5
          label: Franchise effect
          detail: Volume, integrations, and valuation narrative weaken.
      edges:
        - from: r1
          to: r2
          label: triggers
        - from: r2
          to: r3
          label: surfaces in
        - from: r3
          to: r4
          label: reduces
        - from: r4
          to: r5
          label: feeds
    claimRefs:
      - CR011
      - CR014
      - CR020
      - CR026
      - CR035
  - id: FR003
    title: Dependency map
    type: stack
    layout: wide
    summary: >-
      Risk sits across a stack of code, oracles, curators, partners, and legal environment rather than only in the
      protocol core.
    data:
      layers:
        - label: Policy and legal layer
          detail: MiCAR follow-on treatment, sanctions, consumer-disclosure expectations.
        - label: Partner shell layer
          detail: Robinhood, Fireblocks, wallets, and exchanges own the user relationship.
        - label: Curator / governance layer
          detail: Curators, allocators, sentinels, and owners can alter user outcomes within defined powers.
        - label: Oracle and collateral layer
          detail: Asset governance and oracle quality shape liquidation and bad-debt outcomes.
        - label: Protocol core layer
          detail: Immutable contracts, audits, and formal verification bound but do not erase code risk.
    claimRefs:
      - CR003
      - CR006
      - CR018
      - CR021
      - CR028
  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: The recommendation improves as Morpho converts strategic relevance into verified economic capture.
    data:
      nodes:
        - id: v1
          label: Funding + investor quality
          detail: Unicorn round and elite syndicate establish credibility.
        - id: v2
          label: Usage + integrations
          detail: Deposits and partner launches show real market pull.
        - id: v3
          label: Monetization proof
          detail: Need evidence of fee capture, concentration, and retention.
        - id: v4
          label: Recommendation
          detail: Proceed only with pricing discipline and private diligence.
      edges:
        - from: v1
          to: v2
          label: supports
        - from: v2
          to: v3
          label: must translate into
        - from: v3
          to: v4
          label: determines
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV029
  - id: FV002
    title: Valuation sensitivity
    type: range
    layout: wide
    summary: >-
      Valuation outcome is most sensitive to monetization, concentration, and regulatory durability rather than to TVL
      alone.
    data:
      items:
        - label: Monetization visibility
          low: 2
          mid: 3
          high: 4
          displayValue: Low
          detail: Weak public revenue disclosure is the biggest valuation constraint.
          tone: warning
        - label: Partner durability
          low: 4
          mid: 6
          high: 8
          displayValue: Medium
          detail: Outcome depends on whether major distributors stay engaged.
          tone: neutral
        - label: Regulatory resilience
          low: 3
          mid: 5
          high: 7
          displayValue: Medium-Low
          detail: Policy overhang could compress upside or distribution.
          tone: warning
        - label: Infrastructure premium
          low: 6
          mid: 8
          high: 9
          displayValue: High
          detail: If Morpho becomes a core rail, premium valuation can persist.
          tone: positive
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
    approximationNotes: These 1-10 ranges score sensitivity, not enterprise value directly.
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      Return expectations depend more on what percentage of protocol value accrues to Morpho than on raw deposit growth
      alone.
    data:
      items:
        - label: Economic capture potential
          low: 3
          mid: 5
          high: 8
          displayValue: Medium
          detail: Take rate and layer economics determine upside.
          tone: neutral
        - label: Distribution durability
          low: 4
          mid: 6
          high: 8
          displayValue: Medium
          detail: Stable partners improve return potential.
          tone: positive
        - label: Downside protection
          low: 2
          mid: 4
          high: 6
          displayValue: Low-Medium
          detail: Public downside protections are not yet visible.
          tone: warning
        - label: RWA / institutional optionality
          low: 4
          mid: 6
          high: 9
          displayValue: Medium-High
          detail: Optionality exists if monetization follows.
          tone: positive
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
    approximationNotes: These 1-10 ranges summarize directional return drivers rather than a priced target.
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: The public KPI set is strong on usage and financing, weak on direct company economics.
    data:
      items:
        - label: Round
          value: $175M
        - label: Valuation
          value: Up to $2B
        - label: Reported deposits
          value: $11B+
        - label: DefiLlama TVL lens
          value: ~$6.6B-$7.6B range
        - label: Public revenue disclosure
          value: Not disclosed
    claimRefs:
      - CV001
      - CV003
      - CV010
      - CV036
