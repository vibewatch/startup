  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lenses
        blocks:
          - type: paragraph
            body: >-
              Morpho’s relevant market should not be underwritten using the entire global credit universe. The practical
              market today is the overlap between onchain dollar liquidity, overcollateralized borrowing demand,
              risk-managed vault products, and tokenized collateral that institutions or retail platforms are actually
              willing to distribute. That is still a large opportunity, but it is much narrower and more investable than
              generic “finance onchain” rhetoric. The cleanest retained lenses are DeFi lending TVL, stablecoin float,
              and tokenized-RWA growth. EBA and ESMA still describe DeFi as niche relative to the wider crypto market,
              which is important discipline against overstatement. At the same time, DefiLlama shows lending is already
              one of crypto’s largest application categories, and the stablecoin base above $300 billion provides a
              meaningful capital pool that can be routed into lending products. Morpho benefits if those pools keep
              compounding, but the sizing case should remain layered and conditional rather than anchored to one
              enormous TAM slide.
