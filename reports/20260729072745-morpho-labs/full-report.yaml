      - number: '3.3'
        title: Distribution and curation as the real battlefield
        blocks:
          - type: paragraph
            body: >-
              The clearest signs of competitive advantage come from who is willing to ship products on top of Morpho.
              Coinbase uses Morpho in consumer-facing borrow and lend flows. Kraken abstracts Morpho into DeFi Earn.
              Fireblocks lets institutions access Morpho and Aave side by side inside a governed treasury interface.
              Morpho’s own stories add Binance, Safe, Ledger, Trust Wallet, Flowdesk, and others to the picture. That
              evidence matters because credit infrastructure only compounds when someone else is willing to distribute
              it. In practice, curators and distributors are part of the moat: they decide whether a raw protocol
              becomes a product. Morpho benefits when those partners want configurable risk boundaries and noncustodial
              structures. The flip side is dependence. If distributors decide Aave liquidity is enough, or if they build
              captive books, Morpho loses. Competitive assessment therefore has to weight relationships and packaging
              just as heavily as protocol code.
