      - number: '2.3'
        title: Growth drivers, collateral expansion, and regulatory shape
        blocks:
          - type: paragraph
            body: >-
              The most important growth driver is the rising stock of onchain dollars. DWF Labs’ retained analysis and
              DefiLlama’s stablecoin dashboard both point to a much larger stablecoin base than in prior cycles, while
              CoinGecko and RWA-oriented market data show tokenized treasuries and other real-world assets becoming much
              more credible as collateral and balance-sheet tools. That matters for Morpho because its architecture is
              most valuable when users want customizable risk profiles across different collateral types and borrower
              cohorts. Regulation is a double-edged factor. MiCA and the DLT Pilot Regime make Europe more navigable for
              compliant firms, but the EBA, ESMA, and the European Commission’s ongoing review process all show that
              DeFi treatment, lending perimeter questions, and stablecoin obligations remain live issues rather than
              settled law. The practical implication is that Morpho’s market is opening, but it is opening through
              wrappers, curators, and institutional interfaces, not through a frictionless free-for-all.
