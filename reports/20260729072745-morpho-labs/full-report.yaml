  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core product stack
        blocks:
          - type: paragraph
            body: >-
              Morpho’s stack is easiest to understand as layers. Morpho Blue is the immutable primitive that defines
              isolated lending markets. MetaMorpho is the vault layer that lets curators package those markets for
              passive lenders. Above that sit interfaces, partner shells, and workflow abstractions that make the
              protocol usable for exchanges, wallets, and institutions. This layered approach matters because it lets
              Morpho keep the core lending logic simple while shifting product complexity into configurable modules
              above it. The retained materials are unusually explicit on this point: Morpho does not appear to think one
              protocol surface should serve every risk profile. Instead, it wants the primitive to stay fixed while
              curators and distributors construct differentiated credit products on top. That architecture is
              strategically important because it is what makes Morpho fit both enterprise wrappers such as Fireblocks
              and consumer flows such as Coinbase or partner wallets without forcing the core protocol to mutate every
              time a new use case emerges.
