      - number: '2.4'
        title: Constraints and why Morpho thinks isolation wins
        blocks:
          - type: paragraph
            body: >-
              The bear case on Morpho’s market is not that there is no demand for onchain credit; the bear case is that
              the market is still early, fragmented, and trust-sensitive. EBA and ESMA still call DeFi niche.
              Chainalysis continues to document fraud and illicit-finance concerns across crypto. Robinhood’s user
              disclosures read like a reminder that even simplified wrappers still expose users to smart-contract,
              liquidity, stablecoin, and downstream-protocol risk. Morpho’s own answer is architectural: isolate credit
              risk by market, externalize curation, and let distributors choose the risk profile they are willing to
              expose. That is a compelling theory, but it does not eliminate the hard parts of market building. Isolated
              markets need liquidity concentration, curators need credibility, and distribution partners need enough
              confidence to keep routing balances onchain through market stress. The market therefore looks real and
              expanding, but still dependent on execution quality and trust scaffolding rather than inevitable network
              effects alone.
