              blind spots. There is no retained public revenue figure, no clear headcount disclosure, no public board
              roster, and no cap-table detail beyond investor names. Partner-authored materials also carry real risk
              language: Robinhood explicitly tells users that funds are lent through third-party smart contracts with no
              bank-like guarantees, while Fireblocks emphasizes smart-contract, liquidity, and market-volatility risk.
              Those adverse disclosures do not invalidate Morpho’s growth story, but they do remind investors that the
              protocol’s commercial momentum still sits on top of inherently high-risk DeFi infrastructure.
