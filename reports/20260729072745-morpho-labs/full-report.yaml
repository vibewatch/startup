  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis for Morpho is straightforward. It sits at the intersection of three powerful trends:
              institutional interest in onchain credit, partner demand for configurable lending infrastructure, and user
              appetite for noncustodial earn or borrow products embedded inside familiar consumer and treasury
              applications. The $175 million 2026 round at up to a $2 billion valuation, plus visible usage across
              Coinbase, Robinhood, Kraken, Fireblocks, Ledger, and other channels, supports the idea that Morpho is
              emerging as a strategic rail rather than a niche app. The anti-thesis is just as clear. Morpho does not
              publicly disclose the conventional financial metrics that make late-stage valuation easier to underwrite.
              Deposits and TVL are not revenue. Protocol fees are not necessarily company revenue. Distribution partners
              and curators may capture a meaningful share of the economics. That means the public record can support a
              strong strategic case, but only a conditional pricing case.
