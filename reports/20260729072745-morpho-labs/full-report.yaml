      - number: '4.2'
        title: What is publicly visible about the business model
        blocks:
          - type: paragraph
            body: >-
              The business model is visible in structure even where reported revenue is not. Morpho is not a
              balance-sheet lender in the traditional sense. It provides the protocol rails, vault infrastructure, and
              developer surfaces through which lenders, borrowers, curators, and distribution partners interact. That
              suggests economics can accrue at several layers: protocol fees, curator fees, partner distribution
              economics, and potentially token incentives or software-like platform value from integrations. The
              developer tooling around the API, SDK, and contract registry supports the view that Morpho wants to be
              embedded infrastructure. Coinbase, Fireblocks, and Robinhood then show how that infrastructure becomes
              monetizable product packaging in the real world. The key caveat is that public materials do not reveal
              where most of the economics sit. A partner product can generate substantial end-user value while leaving
              only a thin economics layer at the protocol owner level. That uncertainty is the main obstacle to treating
              Morpho’s financial model like a transparent SaaS platform.
