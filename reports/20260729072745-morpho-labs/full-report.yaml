chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, mission, and current scope
        blocks:
          - type: paragraph
            body: >-
              Morpho’s public positioning has become much sharper in 2026. The company no longer markets itself merely
              as a DeFi protocol for crypto-native users; it frames itself as shared credit infrastructure that banks,
              exchanges, fintechs, asset managers, and wallets can build on. That framing is visible on the homepage, in
              the “Why Morpho exists” manifesto, and in the June 2026 financing announcement. Across those sources,
              Morpho describes itself as an open credit network that connects lenders and borrowers globally while
              remaining invisible to end users who interact through brands such as Coinbase, Kraken, Robinhood,
              Fireblocks, or Ledger. The important diligence takeaway is that Morpho is pitching infrastructure rather
              than a single destination app. That matters because infrastructure narratives can support broader
              distribution and stronger network effects, but they also raise the bar on security, partner reliability,
              and regulatory fit. Morpho’s public materials make the ambition explicit: it wants to be a neutral backend
              for onchain credit products, not a direct replacement for incumbent financial institutions.
