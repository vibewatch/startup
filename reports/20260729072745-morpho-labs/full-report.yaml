        title: Customer base segmentation
        blocks:
          - type: paragraph
            body: >-
              Morpho does not sell to one homogeneous buyer. The retained corpus shows at least four meaningful customer
              layers. First are end-users who lend, borrow, or earn through wrapped partner experiences such as
              Coinbase, Robinhood, Kraken, Trust Wallet, Ledger, Lemon, and SafePal. Second are institutions and
              treasury operators using shells such as Fireblocks or Safe. Third are distributors and exchanges that use
              Morpho as the yield or lending engine behind their own product surfaces. Fourth are curators such as
              Sentora and Gauntlet that package vaults, set risk frameworks, and influence which end customers can
              actually use Morpho safely. That segmentation matters because Morpho’s adoption is distribution-led: many
              of the visible customers are not buying a standalone software seat, they are embedding Morpho into a
              broader consumer or treasury workflow.
