  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Protocol and security risks
        blocks:
          - type: paragraph
            body: >-
              Morpho’s public materials are unusually explicit that using Morpho and Morpho Vaults involves real
              smart-contract, oracle, liquidation, bad-debt, and liquidity risk. That candor is a positive because it
              suggests the team is not pretending DeFi lending can be made risk-free by branding alone. The strongest
              technical mitigants are immutability of core contracts, a minimalist design philosophy, formal
              verification, multiple audits, fuzzing, testing, and public bug-bounty or contest activity. But those
              mitigants only reduce risk; they do not eliminate it. Morpho’s own risk documentation says faulty oracles
              can cause asset loss, lenders can be exposed to bad debt, and liquidity can disappear for periods of time.
              The protocol therefore looks more safety-conscious than many DeFi projects, yet it still operates inside a
              threat model where a single overlooked edge case, oracle failure, or market-structure shock can damage
              users and reputation quickly.
