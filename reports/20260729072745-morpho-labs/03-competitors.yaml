- id: where-morpho-is-different
  title: Where Morpho is genuinely different
  body: Morpho’s competitive narrative rests on architecture more than branding. Morpho Blue externalizes risk management from the immutable core, while MetaMorpho packages the primitive into vault-based products that curators and partners can tune for distinct user cohorts. That combination lets Morpho pitch itself as an infrastructure layer for many different credit products instead of a single shared pool. Aave and Compound still matter because they already aggregate large, reliable liquidity, but their pooled or governance-defined market structures are different operating models. Spark’s balance-sheet-rich stablecoin approach is powerful, yet more tied to a single liquidity engine. Euler’s modular design overlaps most closely with Morpho’s technical thesis, which makes Euler strategically important even if it is not the liquidity leader. The main question for investors is whether configurability and isolated risk are strong enough differentiators to outweigh incumbent depth. Today, public
    evidence suggests the answer is “sometimes yes” in embedded-distribution contexts, but not universally across every lending use case.
  claimRefs:
  - CP002
  - CP003
  - CP009
  - CP011
  - CP018
  - CP029
  - CP030
  - CP031
