  title: Pricing / packaging comparison
  columns:
  - Platform / wrapper
  - User-facing package
  - How economics appear publicly
  - Who shapes risk
  - Competitive implication
  rows:
  - - Morpho + curator partner
    - Vault or integrated borrow / earn flow
    - Variable lending rates plus possible partner incentives
    - Curator and distributor
    - Highly flexible but partner-dependent.
  - - Aave direct / Fireblocks wrapper
    - Protocol markets or treasury wrapper
    - Variable market rates and protocol revenue share
    - Protocol parameters plus wrapper controls
    - Deeper liquidity, less bespoke per market.
  - - Kraken DeFi Earn on Morpho
    - Exchange-native earn product
    - Up to 8% APY at one retained point in time
    - Kraken / Veda / Sentora stack
    - Shows Morpho can be packaged simply.
  - - Coinbase lending on Morpho
    - In-app lend and BTC-backed borrow
    - Rates vary by vault type and market conditions
    - Coinbase-selected vaults and protocol logic
    - Validates consumer distribution route.
  - - Fireblocks Earn
    - Institutional treasury yield wrapper across Aave and Morpho
    - No simple posted fixed price; protocol-dependent returns
    - Fireblocks plus underlying strategy providers
    - Backend protocols compete inside governance-first UX.
  - - Centralized exchange yield products
    - Custodial earn account or structured product
    - Operator-set blended economics
    - Exchange risk desk
    - Still strong substitute when UX or trust dominates protocol openness.
  notes: Public pricing is mostly dynamic and packaging-driven, so competitive economics are best understood as distribution-plus-rate design rather than fixed price lists.
