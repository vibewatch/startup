chapter:
  number: 3
  title: Competitors
  summary: Morpho competes less as a simple lender and more as modular credit infrastructure against both DeFi incumbents and distribution-layer wrappers. The strongest positives are Morpho’s isolated-market architecture, vault-layer flexibility, and visible adoption by exchanges, wallets, and treasury platforms. The main competitive risks are Aave’s liquidity scale, the copyability of smart-contract primitives, and the fact that large distributors can always compare Morpho against deeper incumbent markets.
sections:
- id: who-actually-competes-with-morpho
  title: Who actually competes with Morpho
  body: Morpho’s true competitor set is broader than a token leaderboard but narrower than “all fintech.” The most relevant DeFi protocol competitors are Aave, Compound, Spark, and Euler because each addresses some combination of onchain lending, collateral management, or modular money-market design. Aave remains the headline incumbent because it has the deepest public liquidity footprint and broad market recognition. Compound matters as the governance-heavy, base-asset-oriented reference design. Spark matters because it shows how stablecoin-rich balance sheets can be routed into money markets. Euler matters because it overlaps more closely with Morpho on modularity and market creation. The right diligence lens is not simply who has the largest TVL today, but which systems best match the needs of distributors and curators building consumer or institutional credit products. On that measure, Morpho’s flexibility compares well, but it still competes from a smaller liquidity base than Aave and
    from a less mature distribution history than some centralized finance alternatives.
  claimRefs:
  - CP001
  - CP004
  - CP005
  - CP006
  - CP007
  - CP008
