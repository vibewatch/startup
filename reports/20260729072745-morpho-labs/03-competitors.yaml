- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Core model
  - Public strength
  - Public weakness
  - Why it matters to Morpho
  rows:
  - - Aave
    - Largest non-custodial pooled lending incumbent
    - Deep liquidity and broad brand recognition
    - Shared-pool complexity and lower configurability than isolated markets
    - Primary scale benchmark and default alternative.
  - - Compound III
    - Base-asset-oriented governance-controlled markets
    - Simple collateral-to-base-asset design and long protocol history
    - Less visible embedded-distribution narrative than Morpho
    - Reference for governance-heavy lending design.
  - - Spark
    - Stablecoin-liquidity layer tied to Sky ecosystem
    - Large stablecoin balance-sheet backing and savings orientation
    - More coupled to one ecosystem’s capital source
    - Competitor for stablecoin credit and yield distribution.
  - - Euler
    - Modular permissionless lending stack
    - Technical overlap with modular market creation
    - Smaller distribution footprint in retained source set
    - Closest architectural analogue.
  - - Centralized wrappers / offchain programs
    - Yield and borrow products inside apps or exchanges
    - Control user distribution and UX directly
    - Counterparty and transparency tradeoffs
    - Can choose or replace protocol backends.
  - - Morpho
    - Isolated markets plus curator vaults
    - Configurable risk, strong embedded-distribution story
    - Smaller liquidity base than Aave and limited public financial disclosure
    - Flexible challenger positioned as infrastructure.
  notes: The most relevant competitive set mixes protocol incumbents with the distribution-layer wrappers that decide how end users access onchain credit.
