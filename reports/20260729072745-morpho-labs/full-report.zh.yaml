      - CR004
      - CR005
      - CR010
      - CR019
      - CR029
  - id: FR002
    title: 风险传导图
    type: flow
    layout: wide
    summary: 一次冲击可能从抵押品、预言机或政策变化出发，经由市场和合作伙伴传导为用户损失和品牌受损。
    data:
      nodes:
        - id: r1
          label: 外部冲击
          detail: 抵押品波动、监管行动、漏洞利用或制裁事件。
        - id: r2
          label: 市场 / 金库压力
          detail: 预言机失真、坏账、流动性收紧，或策展方重新分配。
        - id: r3
          label: 合作伙伴 UX 影响
          detail: 提现变慢、披露加码，或产品入口收窄。
        - id: r4
          label: 用户信任影响
          detail: 用户质疑安全性和资金可用性。
        - id: r5
          label: 业务基本盘影响
          detail: 交易量、集成和估值叙事走弱。
      edges:
        - from: r1
          to: r2
          label: 触发
        - from: r2
          to: r3
          label: 体现为
        - from: r3
          to: r4
          label: 削弱
        - from: r4
          to: r5
          label: 传导至
    claimRefs:
      - CR011
      - CR014
      - CR020
      - CR026
      - CR035
  - id: FR003
    title: 依赖图
    type: stack
    layout: wide
    summary: 风险分布在代码、预言机、策展方、合作伙伴和法律环境组成的栈里，并不只在协议核心。
    data:
      layers:
        - label: 政策与法律层
          detail: MiCAR 后续规则、制裁、消费者披露预期。
        - label: 合作伙伴前台层
          detail: Robinhood、Fireblocks、钱包和交易所掌握用户关系。
        - label: 策展方 / 治理层
          detail: 策展方、分配者、哨兵和所有者可在既定权限内改变用户结果。
        - label: 预言机与抵押品层
          detail: 资产治理和预言机质量会左右清算和坏账结果。
        - label: 协议核心层
          detail: 不可变合约、审计和形式化验证能约束代码风险，但抹不掉风险。
    claimRefs:
      - CR003
      - CR006
      - CR018
      - CR021
      - CR028
  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: wide
    summary: Morpho 越能把战略相关性转化为经验证的价值捕获，推荐结论越会改善。
    data:
      nodes:
        - id: v1
          label: 融资与投资人质量
          detail: 独角兽轮次和顶级投资人组合撑起可信度。
        - id: v2
          label: 使用量与集成
          detail: 存款规模和合作伙伴上线，证明市场拉力真实存在。
        - id: v3
          label: 变现证明
          detail: 需要证明收费能力、集中度和留存。
        - id: v4
          label: 推荐结论
          detail: 只有定价守住纪律、私下尽调跑透，才应推进。
      edges:
        - from: v1
          to: v2
          label: 支撑
        - from: v2
          to: v3
          label: 必须转化为
        - from: v3
          to: v4
          label: 决定
    claimRefs:
      - CV001
      - CV002
      - CV006
      - CV029
  - id: FV002
    title: 估值敏感性
    type: range
    layout: wide
    summary: 估值结果对变现、集中度和监管耐久性的敏感度最高，而不是只看 TVL。
    data:
      items:
        - label: 变现可见度
          low: 2
          mid: 3
          high: 4
          displayValue: Low
          detail: 公开收入披露薄弱，是最大的估值约束。
          tone: warning
        - label: 合作伙伴耐久性
          low: 4
          mid: 6
          high: 8
          displayValue: Medium
          detail: 结果取决于主要分销方是否持续投入。
          tone: neutral
        - label: 监管韧性
          low: 3
          mid: 5
          high: 7
          displayValue: Medium-Low
          detail: 政策悬而未决，可能压缩上行空间或分发能力。
          tone: warning
        - label: 基础设施溢价
          low: 6
          mid: 8
          high: 9
          displayValue: High
          detail: 如果 Morpho 成为核心轨道，估值溢价可以延续。
          tone: positive
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
    approximationNotes: 这些 1-10 区间衡量敏感度，不直接对应企业价值。
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 回报预期更多取决于协议价值有多少比例沉淀到 Morpho，而不只是单纯存款增长。
    data:
      items:
        - label: 价值捕获潜力
          low: 3
          mid: 5
          high: 8
          displayValue: Medium
          detail: 抽成率和层级经济性决定上行空间。
          tone: neutral
        - label: 分发耐久性
          low: 4
          mid: 6
          high: 8
          displayValue: Medium
          detail: 合作伙伴稳定，回报潜力更高。
          tone: positive
        - label: 下行保护
          low: 2
          mid: 4
          high: 6
          displayValue: Low-Medium
          detail: 公开材料里还看不到下行保护。
          tone: warning
        - label: RWA / 机构可选性
          low: 4
          mid: 6
          high: 9
          displayValue: Medium-High
          detail: 如果变现跟上，可选性存在。
          tone: positive
    claimRefs:
      - CV024
      - CV025
      - CV026
      - CV027
    approximationNotes: 这些 1-10 区间概括方向性的回报驱动因素，而不是给出定价目标。
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 公开 KPI 组合在使用量和融资上较强，在公司直接经济性上较弱。
    data:
      items:
        - label: 融资轮次
          value: $175M
        - label: 估值
          value: Up to $2B
        - label: 披露存款
          value: $11B+
        - label: DefiLlama TVL 视角
          value: ~$6.6B-$7.6B range
        - label: 公开收入披露
          value: Not disclosed
    claimRefs:
      - CV001
      - CV003
      - CV010
      - CV036
