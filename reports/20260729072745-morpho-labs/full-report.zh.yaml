      - number: '3.4'
        title: 什么会打破护城河
        blocks:
          - type: paragraph
            body: >-
              Morpho 的护城河真实存在，但脆弱点也很可预期。Aave
              的流动性深度仍是最明显的竞争威胁，因为市场规模会影响利率、借款需求和合作伙伴信心。智能合约模块化也可以被复制；一个差异化原语可能变成品类标准，或被竞争对手仿成一个功能。治理复杂性有利有弊：Morpho
              可以说隔离市场和有边界的信任假设更适合机构，但更大的既有玩家可以用更深的监控系统和更长的实盘记录反击。DeFi
              原生借贷之外也有替代产品，包括中心化交易所收益计划、财资包装器和货币市场式产品。因此，正确综合判断应保持平衡：Morpho
              看起来比许多既有玩家更适合分发、架构上也更可配置，但还不是不可绕开的默认选择。投资者应把嵌入式采用视为真实优势证据，同时仍要为既有玩家流动性、合作伙伴集中度，以及技术概念在开源市场中扩散的容易程度打折。
