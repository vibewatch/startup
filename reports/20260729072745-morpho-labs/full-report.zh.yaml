      - number: '8.2'
        title: 定价背景与可比口径
        blocks:
          - type: paragraph
            body: >-
              最干净的公开估值锚点就是融资本身：顶级投资人愿意以最高 $2B 估值投资
              Morpho。这是私募市场信心的强证据，但不能证明今天新投资人的公允价值。公开可比公司只能提供部分指引。Coinbase、Robinhood 和 SoFi
              是规模化金融平台，直接拥有客户并披露收入；它们的市值收入比显示资本市场如何给增长、分发和受监管金融基础设施定价，但这些业务比 Morpho 成熟得多，也透明得多。Aave 作为 DeFi
              借贷基准，在战略上更接近；但代币市场估值不同于私营公司股权估值。因此，可比分析的正确用法是给方向：如果 Morpho
              拥有关键链上信贷轨道，它应获得基础设施溢价；但在收入获取和集中度更清楚之前，也应承受透明度折价。换句话说，可比分析能告诉投资者 $2B
              结果在抽象层面是否可能；没有私下变现数据时，它不能告诉投资者这个具体入场点是否有吸引力。
