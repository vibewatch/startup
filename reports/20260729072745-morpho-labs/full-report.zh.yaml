  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 残余风险最高的部分集中在智能合约边界情形、外部输入、合作伙伴集中度和监管上，而不是单一故障模式。
    data:
      columns:
        - 可能性
        - 影响
        - 缓释成熟度
      rows:
        - label: 智能合约 / 漏洞
          values:
            - 中
            - 高
            - 高
        - label: 预言机 / 抵押品失效
          values:
            - 中
            - 高
            - 中
        - label: 流动性 / 挤兑动态
          values:
            - 中
            - 高
            - 中
        - label: 合作伙伴集中
          values:
            - 中高
            - 中高
            - 低中
        - label: 监管 / 合规冲击
          values:
            - 中
            - 高
            - 低中
        - label: 执行 / 治理失效
          values:
            - 中
            - 中高
            - 中
    claimRefs:
