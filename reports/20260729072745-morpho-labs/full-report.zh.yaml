            body: >-
              协议指标真实且亮眼。DefiLlama 的留存快照显示，TVL 约 $7.6B，活跃贷款约 $4.1B，30 天费用超过 $26M。Morpho 自己的融资文章另称存款超过 $11B；即使具体会计口径不同于即期
              TVL，这也与一个规模大且增长中的信贷网络方向一致。稳定币市场规模在财务上也重要，因为超过 $300B 的链上美元基础，是许多由 Morpho
              驱动的信贷产品吸收供给的底层。但协议指标不会自动转化为公司经济收益。TVL 不是收入。费用不一定是股权所有者收入。活跃贷款很少说明获客、毛利率或留存。正确读法是，Morpho
              有强证据证明资产负债表流量和市场相关性，但它所创造的价值有多少归属于公司或投资者支持的协会，证据仍有限。
