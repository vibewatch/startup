        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >-
              Morpho 并不是卖给一个同质化买方。留存语料显示，至少有四个有意义的客户层。第一层是终端用户，他们通过 Coinbase、Robinhood、Kraken、Trust
              Wallet、Ledger、Lemon、SafePal 等包装后的合作伙伴体验进行出借、借款或赚取收益。第二层是使用 Fireblocks 或 Safe 等外壳的机构和财资运营方。第三层是把 Morpho
              用作自家产品界面背后收益或借贷引擎的分发方和交易所。第四层是 Sentora、Gauntlet 等策展方，它们打包金库、设定风险框架，并影响哪些终端客户可以安全使用 Morpho。这种分层很重要，因为
              Morpho 的采用由分发驱动：许多可见客户买的不是独立软件席位，而是把 Morpho 嵌入更广的消费者或财资工作流。
