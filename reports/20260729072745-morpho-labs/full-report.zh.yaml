      - number: '2.3'
        title: 增长驱动、抵押品扩展与监管形态
        blocks:
          - type: paragraph
            body: >-
              最重要的增长驱动，是链上美元存量上升。DWF Labs 的留存分析和 DefiLlama 稳定币仪表盘都指向一个比前几个周期大得多的稳定币基础；CoinGecko 和 RWA
              相关市场数据则显示，代币化国债和其他现实世界资产作为抵押品和资产负债表工具，可信度正在明显提升。这对 Morpho
              很关键，因为当用户想在不同抵押品类型和借款人群之间定制风险画像时，其架构最有价值。监管是一把双刃剑。MiCA 和 DLT Pilot Regime 让欧洲对合规企业更可导航，但 EBA、ESMA 以及
              European Commission 持续评估流程都表明，DeFi 待遇、借贷边界问题和稳定币义务仍是活议题，不是已经定案的法律。实际含义是，Morpho
              的市场正在打开，但打开方式是包装器、策展方和机构接口，而不是无摩擦的自由放任。
