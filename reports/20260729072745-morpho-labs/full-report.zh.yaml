      - number: '6.3'
        title: 具名客户证明与耐久性代理指标
        blocks:
          - type: paragraph
            body: >-
              具名客户证明真实存在，但耐久性更多是代理推断，而不是直接披露。留存来源支持 Morpho 与 Coinbase、Robinhood、Kraken、Fireblocks、Ledger、Trust
              Wallet、Safe、Lemon、SafePal、Gemini、Binance、World 以及 Sentora、Gauntlet
              等策展分发方存在活跃关系。其中几个关系看起来更像生产级，而非实验性：Coinbase 记录了与 Morpho 相关的借款和 cbBTC 工作流，Robinhood 通过自托管钱包把 USDG 借贷导向
              Morpho，Fireblocks 在机构治理工作流中暴露 Morpho 金库。但公开记录很少给出续约条款、队列留存、NRR 或合作伙伴层面经济性。正确读法是，Morpho
              有广泛上线证明，也有一些深度嵌入迹象，但公开耐久性证据仍不完整。换句话说，Morpho
              公开证明了严肃分发方愿意信任这套基础设施，并把它暴露给自家用户；但公开披露还不足以量化上线月新鲜感消退后，这些用户到底有多粘。
