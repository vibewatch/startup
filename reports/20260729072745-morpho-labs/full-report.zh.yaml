        blocks:
          - type: paragraph
            body: >-
              对一家私营加密公司来说，Morpho 的里程碑图谱异常连贯。留存来源支持这样一条线：2021 年创立，随后进入 Optimizer 阶段，2023 年推出 Morpho Blue 和 MetaMorpho，再到
              2026 年的商业化节点，包括 $175M 融资以及 Robinhood、Fireblocks 公告。安全也是公开叙事中的真实资产。Morpho
              文档和安全框架材料强调形式化验证、审计、竞赛、模糊测试和代码极简主义，把它们作为机构信任案例的一部分。话虽如此，公开披露仍有明显盲点：没有留存公开收入数据，没有清晰员工数披露，没有公开董事会名单，也没有投资者名单之外的股权结构细节。合作伙伴撰写的材料也带有真实风险提示：Robinhood
              明确告诉用户，资金通过第三方智能合约出借，没有类似银行的保障；Fireblocks 则强调智能合约、流动性和市场波动风险。这些负面披露不会推翻 Morpho
              的增长故事，但提醒投资者：协议的商业动能仍建立在天然高风险的 DeFi 基础设施之上。
