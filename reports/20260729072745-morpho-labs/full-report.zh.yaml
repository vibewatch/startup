      - number: '2.4'
        title: 约束，以及 Morpho 为什么相信隔离会赢
        blocks:
          - type: paragraph
            body: >-
              Morpho 市场的空头论点不是链上信贷没有需求，而是市场仍早期、碎片化，并且高度依赖信任。EBA 和 ESMA 仍称 DeFi 是小众领域。Chainalysis
              持续记录加密领域的欺诈和非法金融担忧。Robinhood 的用户披露像是在提醒市场：即使经过简化包装，用户仍会暴露在智能合约、流动性、稳定币和下游协议风险之下。Morpho
              自己的答案是架构：按市场隔离信贷风险，外置策展，让分发方选择自己愿意暴露的风险画像。这是一个有说服力的理论，但不能消除市场建设里的难题。隔离市场需要流动性集中，策展方需要可信度，分发伙伴也需要足够信心，在市场压力中继续把余额导入链上。因此，市场看起来真实且在扩张，但仍依赖执行质量和信任脚手架，而不是单靠必然发生的网络效应。
