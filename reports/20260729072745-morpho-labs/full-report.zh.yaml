      - number: '6.4'
        title: 扩张、集中度与判断
        blocks:
          - type: paragraph
            body: >-
              Morpho 的扩张路径有吸引力，因为一个协议可以通过许多品牌界面、资产和地区被再次分发，而不需要 Morpho 拥有每一个终端用户关系。Kraken 从稳定币延伸到 BTC 收益。Ledger 从 USDC 和
              USDT 起步，并计划增加链和资产。Trust Wallet 覆盖多种稳定币和链。World 把 Morpho 放进移动优先的 mini-app 场景，Fireblocks
              则暴露财资和嵌入式钱包用例。另一面是集中度风险。交易所、钱包和策展方拥有用户界面，控制商品陈列，也可以把流量转向替代协议或金库结构。因此，公开证据足以支持「真实客户采用，并且有多条扩张路径」，但不足以排除合作伙伴集中度或留存风险。这种不对称是客户章节的核心：Morpho
              似乎受益于合作伙伴广度，但仍可能对需求质量、定价权，或产品在第三方应用内被多突出地展示，控制力有限。公开披露仍落后于使用量。
