              Cantina 相关材料进一步强化了一点：安全不是一次性清单项，而是产品故事的一部分。这很有价值，因为 Morpho
              卖给的是深度关心隐藏基础设施风险的用户。同时，公开记录并不均衡。智能合约保障描述得相对充分；企业运营控制则没有。除了智能合约领域之外，留存公开证据很少谈到支持
