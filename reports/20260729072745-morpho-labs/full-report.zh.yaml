      - - 预言机和抵押资产
        - 更广泛的市场支持
        - 价格失效或治理俘获
        - 协议上游的输入项也可能失效。
      - - 链部署和跨链桥
        - 更多触达和资产
        - 新的技术和运营攻击面
        - 扩张会放大依赖项数量。
      - - 竞争协议
        - 基准参照和生态增长
        - 流动性迁移到既有巨头
        - Aave 的深度仍是真实威胁。
    notes: Morpho 的模块化技术栈提高灵活性，但关键风险也可能落在不可变核心之外。
    claimRefs:
      - CR017
      - CR018
      - CR019
      - CR020
      - CR021
      - CR022
      - CR023
      - CR024
  - id: TR004
    title: 人员 / 执行风险登记表
    columns:
      - 风险
      - 证据
      - 为什么重要
      - 当前判断
    rows:
      - - 创始人 / 架构师集中
        - 公开叙事仍由团队和设计牵引
        - 执行质量与小核心团队高度绑定
        - 中等风险。
      - - 企业级控制不透明
        - 保险、SLA 或 SOC 式控制的公开证据很少
        - 机构尽调不能止步于代码审查
        - 明显尽调缺口。
      - - GTM 协同复杂度
        - 伙伴、策展方和协议必须保持一致
        - 跨方摩擦会损害增长或信任
        - 持续执行风险。
      - - 安全计划维护
        - 审计和竞赛需要持续更新
        - 节奏放慢后，安全态势可能衰减
        - 留意过期安全背书。
      - - 压力下的事件响应
        - 公开的事后流程有限
        - 危机处理质量可能决定业务韧性
        - 重要但披露不足。
    notes: 执行风险位于协议之上，可能决定技术质量能否转化为持久信任。
    claimRefs:
      - CR029
      - CR030
      - CR031
      - CR032
      - CR033
  - id: TR005
    title: 缓释措施和否决标准表
    columns:
      - 风险领域
      - 缓释信号
      - 否决触发
      - 尽调要求
    rows:
      - - 智能合约安全
        - 最新审计、形式化验证、赏金覆盖
        - 未解决的关键漏洞利用，或上线后严重漏洞
        - 要求提供完整审计台账和事件历史。
      - - 预言机和流动性管理
        - 保守市场参数和策展方纪律
        - 坏账、提现冻结或预言机事件反复发生
        - 要求提供坏账历史和压力测试。
      - - 监管姿态
        - 强披露，并按司法辖区差异推进产品铺开
        - 重大执法或被迫关停产品
        - 要求提供法律备忘录和合规工作流。
      - - 伙伴集中度
        - 分发方和策展方组合多元
        - 一两家伙伴主导余额或增长
        - 要求提供伙伴集中度和流失数据。
      - - 运营就绪度
        - 有文档化响应预案和治理分层
        - 无法解释控制权归属或应急流程
        - 要求提供事件响应、访问控制和保险细节。
    notes: 否决标准应聚焦可重复的结构性失败，而不是单条吓人的标题新闻。
    claimRefs:
      - CR034
      - CR035
  - id: TV001
    title: 投资建议摘要表
    columns:
      - 字段
      - 评估
      - 原因
    rows:
      - - 建议
        - 在纪律化尽调下继续推进
        - 战略上行空间真实存在，但公开资料对变现能见度很弱。
      - - 置信度
        - 中
        - 规模和融资证据强，收入和留存证据弱。
      - - 风险评级
        - 高
        - DeFi 信贷、伙伴集中和监管带来真实下行。
      - - 估值立场
        - 可以辩护，但估得很满
        - 这一轮可信，但仅凭公开证据看并不明显便宜。
      - - 最适合投资人
        - 长周期基础设施投资人或加密金融专家
        - 需要能接受 token / 股权和市场结构复杂性。
    notes: 本建议假设私人尽调能比公开记录更好回答变现和集中度问题。
    claimRefs:
      - CV029
      - CV030
      - CV031
      - CV036
  - id: TV002
    title: 正反投资论点表
    columns:
      - 视角
      - 看多解读
      - 怀疑解读
      - 净效应
    rows:
      - - 市场地位
        - Morpho 正在成为核心链上信贷轨道
        - 拿下轨道位置，不等于拿到经济收益
        - 正面但有条件
      - - 融资
        - 顶级投资人按独角兽规模投资了公司
        - 明星投资人无法消除执行风险
        - 正面
      - - 使用
        - 存款和集成显示真实需求
        - 使用量不揭示收入捕获
        - 偏正面但混合
      - - 架构
        - 可配置借贷契合机构要求
        - 额外层级制造伙伴和策展方依赖
        - 混合
      - - 透明度
        - DeFi 采用的公开证据异常丰富
        - 财务披露对估值工作仍然偏薄
        - 谨慎
    notes: 战略重要性与经济捕获之间的落差，是 Morpho 估值的核心争议。
    claimRefs:
      - CV001
      - CV002
      - CV004
      - CV006
      - CV018
      - CV024
  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 发生什么
      - 估值影响
      - 概率信号
    rows:
      - - 乐观
        - Morpho 成为主要分发方和策展方默认嵌入的信贷轨道
        - 相对当前轮次的溢价可以成立
        - 需要真实费用捕获和低流失的证据。
      - - 基准
        - Morpho 仍重要，但经济收益与伙伴和策展方分享
        - 当前轮次可以成立，但上行更温和
        - 最符合当前公开证据。
      - - 悲观
        - 监管、流动性冲击或流失表明 TVL 不如假设中耐久
        - 当前轮次显得偏贵
        - 使用波动或集中度指标偏弱会发出信号。
      - - 期权价值加成
        - RWA 和机构抵押品加深网络效应
        - 若变现跟上，可增强溢价情景
        - 需要具体产品和费用证据。
      - - 下行缓冲
        - 高质量背书方和真实集成支撑业务价值底盘
        - 不保证进入价格有吸引力
        - 有用，但单独看不够。
    notes: 做情景分析，比假装能从公开证据推导出单一精确倍数更诚实。
    claimRefs:
      - CV020
      - CV021
      - CV022
      - CV023
      - CV024
      - CV025
  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司 / 资产
      - 公开标尺
      - 说明什么
      - 为什么不完美
    rows:
      - - Coinbase
        - 市值 ~$44.23B，TTM 收入 ~$6.56B（~6.7x）
        - 大型、可信的加密金融平台可以支撑可观价值
        - 拥有客户，并直接披露收入。
      - - Robinhood
        - 市值 ~$83.53B，TTM 收入 ~$4.61B（~18.1x）
        - 分发能力和消费者金融参与度可支撑溢价倍数
        - 业务组合和监管姿态差异很大。
      - - SoFi
        - 市值 ~$21.47B，TTM 收入 ~$3.94B（~5.4x）
        - 数字金融平台可在中个位数收入倍数附近交易
        - 传统金融科技组合不同于 DeFi 基础设施。
      - - Aave
        - DefiLlama 和 CoinMarketCap 跟踪的公开 DeFi 借贷基准
        - 最接近链上借贷心智份额的战略可比
        - token 市值不等于私募股权价值。
      - - Morpho 私募轮
        - $175M 融资时估值 $2B
        - 表明私募投资者看见平台级上行空间
        - 没有可直接对比的公开收入基数。
    notes: 可比估值测算只能作方向参考；Morpho 缺少公开收入，代币可比对象也难以完全映射到股权。
    claimRefs:
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
      - CV015
      - CV016
      - CV017
    enumerationScope:
      coverage: sample
      basis: >-
        Representative comparable set chosen to show the range between DeFi lending, crypto-financial distribution, and
        digital-finance platform multiples.
  - id: TV005
    title: 投资逻辑破裂 / 终止触发项表
    columns:
      - 触发项
      - 重要性
      - 会如何改变判断
    rows:
      - - 重大漏洞或反复坏账
        - 会直接损害市场对底层轨道的信任
        - 会迅速把判断推向熊案。
      - - 伙伴集中度被证实极高
        - 会削弱议价能力和收入韧性
        - 会证明透明度折价合理。
      - - 监管叫停关键产品
        - 会伤害分发驱动增长
        - 会明显压低溢价情景。
      - - 代币与股权经济性被证实错配
        - 即使协议成功，股权也可能只拿到很少价值
        - 会降低出价意愿。
      - - 尽调后变现证据仍弱
        - 会说明规模没有转化为经济收益
        - 会让本轮显得估值已满甚至偏贵。
    notes: 最强的熊案触发项来自结构，而不是叙事。
    claimRefs:
      - CV026
      - CV027
      - CV032
      - CV033
      - CV038
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 尽调问题
      - 为什么需要
      - 对决策的影响
    rows:
      - - 各层收入与费用捕获
        - 需要弄清价值如何在协议、伙伴和策展方之间分配
        - 最重要的定价变量。
      - - 伙伴集中度与留存
        - 需要弄清活动是否由少数关系驱动
        - 关键韧性变量。
      - - 代币购买与股权的相互作用
        - 需要弄清稀释、权利和错配风险
        - 关键结构变量。
      - - 治理与下行保护
        - 需要评估控制权和投资者保护
        - 关键交易质量变量。
      - - 事故历史与风险管理
        - 需要评估压力下的韧性
        - 关键生存变量。
    notes: 公开信息给出正面判断，应转化为实质尽调流程，而不是自动背书估值。
    claimRefs:
      - CV034
      - CV035
      - CV036
