  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 协议与安全风险
        blocks:
          - type: paragraph
            body: >-
              Morpho 的公开材料异常明确地说明，使用 Morpho 和 Morpho Vaults 会涉及真实的智能合约、预言机、清算、坏账和流动性风险。这种坦诚是正面的，因为它说明团队没有假装 DeFi
              借贷只靠品牌就能无风险。最强的技术缓释包括核心合约不可变、极简主义设计理念、形式化验证、多轮审计、模糊测试、测试以及公开漏洞赏金或竞赛活动。但这些缓释只能降低风险，不能消除风险。Morpho
              自己的风险文档称，故障预言机可能造成资产损失，出借人可能暴露于坏账，流动性也可能在一段时间内消失。因此，协议看起来比许多 DeFi
              项目更重视安全，但它仍运行在这样一个威胁模型中：一个被忽视的边缘情况、预言机失效或市场结构冲击，都可能迅速损害用户和声誉。
