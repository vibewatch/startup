  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算口径
        blocks:
          - type: paragraph
            body: >-
              Morpho
              的相关市场不应按整个全球信贷宇宙来承保。今天真正可操作的市场，是链上美元流动性、超额抵押借款需求、风险管理型金库产品，以及机构或零售平台真正愿意分发的代币化抵押品之间的交集。这仍是一个大机会，但比泛泛的「金融上链」叙事窄得多，也更适合投资分析。最干净的留存口径是
              DeFi 借贷 TVL、稳定币流通量和代币化 RWA 增长。EBA 和 ESMA 仍把 DeFi 描述为相对整体加密市场的小众领域，这能约束过度拔高。同时，DefiLlama
              显示借贷已经是加密里最大的应用类别之一，超过 $300B 的稳定币基础也提供了一个可导入借贷产品的有意义资金池。如果这些资金池继续复利，Morpho 会受益；但规模测算应保持分层和有条件，而不是锚定一页巨大的
              TAM 幻灯片。
