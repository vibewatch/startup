      - number: '7.4'
        title: 人员、治理与终止条件
        blocks:
          - type: paragraph
            body: >-
              人员和治理风险更隐蔽，但同样重要。Morpho 的架构强调不可变性和有边界控制，降低了一部分 admin-key
              风险；但金库治理仍把有意义的权力交给所有者、策展方、分配者和哨兵。即便他们无法重写核心协议，一个被攻陷或鲁莽的参与者仍可能在允许范围内改变参数、限制流动或移动资金。公开记录对企业控制细节也仍很薄，例如事件响应
              SLA、内部控制框架、保险和事后恢复流程。在公司层面，Morpho
              仍像是创始人主导、对执行敏感；大量外部信任似乎绑定在一个相对小的团队身上，由他们设计协议规则、合作伙伴框架和风险姿态。对投资者来说，正确问题不是风险是否存在——它显然存在——而是缓释措施是否足够成熟、足够分散、足够透明，能让糟糕市场事件变成可承受冲击，而不是摧毁特许经营权。投资者应假设这套控制栈需要持续验证，而不是一次性安心。
