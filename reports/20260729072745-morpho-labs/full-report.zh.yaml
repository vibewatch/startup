      - number: '2.2'
        title: 买方、用户与嵌入式分发模式
        blocks:
          - type: paragraph
            body: >-
              Morpho 首先卖给的不是匿名借款人。最重要的买方，是已经掌握用户、余额和信任的平台。交易所想增加类似 DeFi
              的借贷收益，但不想自建专有贷款账簿；财资和托管平台想把资本效率功能放进既有审批流程；钱包想把闲置余额变成收益，但不想让用户穿过原始协议 UI；主流金融科技公司想要一个像自家应用一样顺手的借款或收益后端。这也是
              Kraken、Fireblocks、Robinhood 以及 Morpho 策展方案例的合作伙伴证据，比虚荣应用指标更重要的原因。在这个市场里，分发和协议设计一样重要。Morpho
              的优势在于，它可以藏在许多产品外壳之下，由 Steakhouse、Gauntlet 等策展方处理参数化和风险打包。这个嵌入式模式很有吸引力，但也意味着 Morpho
              的商业结果高度依赖合作伙伴执行，以及他们是否持续愿意把资产导入开放轨道，而不是自有资产负债表轨道。
