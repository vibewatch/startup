      - number: '3.3'
        title: 分发和策展才是真战场
        blocks:
          - type: paragraph
            body: >-
              竞争优势最清楚的信号，来自谁愿意在 Morpho 之上推出产品。Coinbase 在面向消费者的借款和出借流程中使用 Morpho。Kraken 把 Morpho 抽象进 DeFi Earn。Fireblocks
              让机构在受治理的财资界面里并排访问 Morpho 和 Aave。Morpho 自己的案例还把 Binance、Safe、Ledger、Trust Wallet、Flowdesk
              等纳入画面。这些证据重要，因为只有别人愿意分发，信贷基础设施才会复利。实践中，策展方和分发方本身就是护城河的一部分：他们决定一个原始协议能否变成产品。当合作伙伴需要可配置的风险边界和非托管结构时，Morpho
              受益。另一面则是依赖。如果分发方认为 Aave 的流动性已经够用，或者自己搭建封闭账簿，Morpho 就会失分。因此，竞争评估必须把关系和打包能力放到与协议代码同等重要的位置。
