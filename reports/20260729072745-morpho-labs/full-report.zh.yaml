  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Morpho 的投资论点很直接。它站在三股强趋势的交汇处：机构对链上信贷的兴趣、合作伙伴对可配置借贷基础设施的需求，以及用户希望在熟悉的消费者和财资应用里使用非托管收益或借款产品。2026 年 $175M
              融资、估值最高 $2B，再加上 Coinbase、Robinhood、Kraken、Fireblocks、Ledger 等渠道中的可见使用，支持这样一个判断：Morpho
              正在从小众应用变成战略轨道。反论点同样清楚。Morpho 没有公开披露那些让后期估值更容易承保的传统财务指标。存款和 TVL
              不是收入。协议费用不一定是公司收入。分发伙伴和策展方可能捕获相当一部分经济性。这意味着公开记录可以支撑强战略案例，但只能支撑有条件的定价案例。
