  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 谁真正与 Morpho 竞争
        blocks:
          - type: paragraph
            body: >-
              Morpho 真正的竞争集合，比代币排行榜更宽，但比「所有金融科技」更窄。最相关的 DeFi 协议竞争对手是 Aave、Compound、Spark 和
              Euler，因为它们各自覆盖链上借贷、抵押品管理或模块化货币市场设计中的一部分。Aave 仍是头号既有玩家，因为它拥有最深的公开流动性足迹和广泛市场认知。Compound
              的重要性在于，它是治理权重较高、以基础资产为核心的参考设计。Spark 重要，是因为它展示了稳定币充裕的资产负债表如何被导入货币市场。Euler 重要，是因为它在模块化和市场创建上与 Morpho
              更接近。正确的尽调视角不是简单看今天谁的 TVL 最大，而是谁最匹配分发方和策展方在搭建消费者或机构信贷产品时的需求。按这个尺度，Morpho 的灵活性表现不错，但它的流动性基础仍小于
              Aave，分发历史也不如某些中心化金融替代方案成熟。
