      - number: '7.2'
        title: 监管与市场结构风险
        blocks:
          - type: paragraph
            body: >-
              监管和生态系统层面的风险仍然重大，因为 Morpho 位于加密借贷、稳定币和无许可资本市场之中，而不是置身其外。EBA 和 ESMA 明确指出 DeFi 和加密借贷中的杠杆、信息不对称、抵押品链条传染以及
              ML/TF 担忧，即便它们同时表示当前 EU 金融稳定风险看起来有限。Chainalysis 提供了另一个角度：2025 年加密犯罪规模大幅上升，稳定币占非法交易量的大部分，与 North Korea
              有关的盗窃仍然巨大。这些都不意味着 Morpho 涉及不当行为；它意味着任何链上信贷网络都生活在更高的政策、合规和声誉审视之下。市场结构层还增加了一项风险：如果 DeFi 借贷需求集中到少数协议或抵押品类型，即使
              Morpho 架构优雅，也可能把心智份额或流动性输给 Aave 这样的更深既有玩家。这种审视会抬高合规成本，拖慢产品推出，并迫使合作伙伴施加更严格的用户限制，即便 Morpho 本身没有直接失误。
