      - number: '7.3'
        title: 合作伙伴、客户与运营风险
        blocks:
          - type: paragraph
            body: >-
              Morpho 的合作伙伴主导模式也会带来自身的运营脆弱性。许多终端用户通过 Coinbase、Robinhood、Kraken、Fireblocks、Trust Wallet、Ledger 等包装器接触
              Morpho。这会加速采用，但也意味着 Morpho 不能完全控制用户旅程、披露、支持体验或产品定位。合作伙伴可以限流分发、替换风险管理人、偏向竞争协议，或判断法律 / 声誉风险超过收益需求。Morpho
              自己和合作伙伴撰写的材料还显示，流动性时点、抵押品冲击和智能合约依赖仍是终端用户体验的一部分。策展方再增加一层运营结构：他们可以改善风险管理，但也会成为集中点，激励不一致、配置不佳或治理失败都可能外溢成用户损失或品牌损害。简言之，Morpho
              的运营韧性不只是代码问题；它是界面、策展方、预言机和合作伙伴政策之间的协调问题。
