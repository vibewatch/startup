      - CU003
      - CU006
      - CU007
      - CU008
      - CU029
  - id: FU002
    title: 客户证明矩阵
    type: matrix
    layout: wide
    summary: 不同客群的公开证明强度不同：发布 / 采用证据最强，留存经济性证据最弱。
    data:
