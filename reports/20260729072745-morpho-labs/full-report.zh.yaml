  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 核心产品栈
        blocks:
          - type: paragraph
            body: >-
              Morpho 的技术栈按层理解最容易。Morpho Blue 是定义隔离借贷市场的不可变原语。MetaMorpho
              是金库层，让策展方把这些市场打包给被动出借人。再往上，是界面、合作伙伴外壳和工作流抽象，让协议可以被交易所、钱包和机构使用。这种分层很关键，因为 Morpho
              能把核心借贷逻辑保持简单，同时把产品复杂度上移到可配置模块。留存材料在这一点上异常明确：Morpho
              似乎并不认为一个协议界面应该服务所有风险画像。相反，它希望原语保持固定，由策展方和分发方在其之上构建差异化信贷产品。这个架构具有战略重要性，因为它让 Morpho 既能适配 Fireblocks
              这样的企业包装器，也能适配 Coinbase 或合作伙伴钱包这样的消费者流程，而不必每出现一个新用例就改动核心协议。
