        blocks:
          - type: paragraph
            body: >-
              最强的公开采用信号来自具名合作伙伴结果，而不是单一公司层面的 MAU 或 ARR 指标。Kraken 报告 DeFi Earn 存款超过 $300M，总用户超过 15M；Ledger 报告上线以来存入超过
              $100M。Trust Wallet 称 Stablecoin Earn 位于一个受超过 200M 用户信任的钱包内，首月存款超过 $50M。Lemon 报告独立存款人超过 70,000，存款超过
              $16M，其中超过 70% 为稳定币。这些数字无法整齐映射到 Morpho 公司收入，但它们说明 Morpho
              并不局限于点击原始协议界面的加密原生高级用户。重要的是，这些证据来自不同用户类型：交易所客户、自托管钱包持有人和新兴市场储蓄者。这种组合降低了 Morpho
              可见牵引力只是一次促销合作或一个窄收益活动的概率，也说明协议可以在多个外壳内同时支撑供给方和借款方需求。
