  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 资本基础与融资结构
        blocks:
          - type: paragraph
            body: >-
              Morpho 的公开财务故事从资本开始，而不是从利润表披露开始。2026 年 6 月融资是主锚：公司以约 $2B 估值融资 $175M，投资者阵容由 Paradigm、a16z crypto 和 Ribbit
              Capital 领衔，Apollo Funds、Circle Ventures、VanEck、SBI Group、Bpifrance
              等战略方加入。投资者质量很重要，因为它同时提供跑道和背书。但融资结构也很重要。多篇留存报道把这一轮描述为代币挂钩交易，而不是普通股权发行，这会让稀释、优先权和股权所有权等常规问题变得更复杂。Morpho
              称这轮是其自 2021 年以来第四次机构融资，因此资本连续性清楚；但公开材料仍没有从资金库到跑道的桥接。投资者可以说 Morpho
              资本充足；但还不能说这笔资本正以多高效率转化成经常性经济收益。登记和法律通知来源至少确认 Morpho 通过具名法国实体运营，但仍无法解决估值承保缺口。
