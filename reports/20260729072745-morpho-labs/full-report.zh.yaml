          detail: 用户和机构把可出借余额和抵押品带到链上。
        - id: n2
          label: Morpho 市场与金库轨道
          detail: 协议市场和金库基础设施把资金路由给借款人。
        - id: n3
          label: 借款需求与利息流
          detail: 借款人为获得资金和流动性付费。
        - id: n4
          label: 策展方打包层
          detail: Sentora、Gauntlet、Steakhouse 等打包风险画像。
        - id: n5
          label: 分发方产品外壳
          detail: Coinbase、Robinhood、Fireblocks 等应用掌握用户分发。
        - id: n6
          label: Morpho 经济捕获
          detail: 价值可能通过协议费用、平台杠杆和栈内战略位置沉淀到 Morpho。
      edges:
        - from: n1
          to: n2
          label: 供给资金
        - from: n2
          to: n3
          label: 启用
        - from: n3
          to: n4
          label: 输入
        - from: n4
          to: n5
          label: 打包
        - from: n5
          to: n6
          label: 可能向其分享价值
        - from: n2
          to: n6
          label: 直接协议经济性
    claimRefs:
      - CI006
      - CI007
      - CI014
      - CI015
      - CI016
      - CI017
      - CI024
      - CI027
      - CI032
  - id: FI002
    title: 财务估算区间
    type: range
    layout: wide
    summary: 没有私人收入披露时，如何解读公开财务记录的情景框架。
    approximationNotes: 这些是对财务可信度的解释性区间，不是已观察到的公司收入预测。
    data:
      items:
        - label: 资本信心
          low: 7
          mid: 8
          high: 9
          displayValue: High
          detail: 投资者质量和融资规模带来强资本信心
          tone: positive
        - label: 协议规模信心
          low: 7
          mid: 8
          high: 9
          displayValue: High
          detail: TVL、贷款和费用指向真实经济活动
          tone: positive
        - label: 收入可见度
          low: 1
          mid: 2
          high: 3
          displayValue: Low
          detail: 没有公开收入或 ARR 披露
          tone: warning
        - label: 抽成率可见度
          low: 1
          mid: 2
          high: 3
          displayValue: Low
          detail: 经济性分散在协议、策展方和分发方各层
          tone: warning
        - label: 伙伴变现上行
          low: 5
          mid: 7
          high: 9
          displayValue: Medium-High
          detail: 如果抽成率健康，大型分发方可能带来显著流量
          tone: positive
        - label: 投资分析完整度
          low: 2
          mid: 3
          high: 4
          displayValue: Low-Medium
          detail: 完整模型仍需要私人尽调材料
          tone: warning
    claimRefs:
      - CI020
      - CI026
      - CI028
      - CI029
      - CI030
      - CI031
      - CI033
      - CI035
  - id: FE001
    title: 产品架构图
    type: stack
    layout: wide
    summary: Morpho 的分层架构：从不可变市场，到策展方和伙伴产品外壳。
    data:
      layers:
        - label: 伙伴与界面层
          detail: Coinbase、Fireblocks、钱包和其他品牌产品外壳掌握分发与 UX。
        - label: 策展方与金库层
          detail: MetaMorpho 金库和策展逻辑打包经过风险管理的借贷产品。
        - label: 基础市场原语层
          detail: Morpho Blue 运行隔离借贷市场，并指定借款资产、抵押品、LLTV 和预言机。
        - label: 安全与治理层
          detail: 不可变性、形式化验证、审计和风险提示共同塑造信任假设。
        - label: 开发者层
          detail: 代码仓库、合约文档和地址注册表让第三方接入这套技术栈。
        - label: 抵押品与流动性底座
          detail: 稳定币、ETH、stETH、cbBTC 和其他支持资产提供资产负债表底座。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE009
      - CE017
      - CE031
      - CE035
  - id: FE002
    title: 客户工作流 / 运营流
    type: flow
    layout: wide
    summary: Morpho 如何从基础市场创建走向封装后的伙伴产品。
    data:
      nodes:
        - id: n1
          label: 创建隔离市场
          detail: 基础市场由借款资产、抵押品、预言机和 LLTV 定义。
        - id: n2
          label: 添加金库策展
          detail: 策展方定义配置、上限和风险画像。
        - id: n3
          label: 用界面封装
          detail: 伙伴或 Morpho 界面呈现面向用户的产品。
        - id: n4
          label: 分发给用户
          detail: 零售或机构用户进入收益或借款流程。
        - id: n5
          label: 呈现风险控制
          detail: 警示、披露和治理边界保持可见。
        - id: n6
          label: 监控并再平衡
          detail: 核心保持不变，策展方和伙伴维护产品质量。
      edges:
        - from: n1
          to: n2
          label: 输入
        - from: n2
          to: n3
          label: 打包
        - from: n3
          to: n4
          label: 交付
        - from: n3
          to: n5
          label: 必须包含
        - from: n4
          to: n6
          label: 产生需求
        - from: n6
          to: n2
          label: 在原语之上更新
    claimRefs:
      - CE004
      - CE006
      - CE013
      - CE021
      - CE022
      - CE029
      - CE030
      - CE035
  - id: FU001
    title: 客户旅程地图
    type: flow
    layout: wide
    summary: Morpho 并不只靠直接协议使用触达终端用户，而是借助分发方、策展方和财库外壳。
    data:
      nodes:
        - id: n1
          label: 底层用户
          detail: 零售出借人、借款人、财库和自托管钱包持有人需要收益或信贷。
        - id: n2
          label: 伙伴外壳
          detail: Coinbase、Robinhood、Kraken、Ledger、Trust Wallet、Fireblocks 等掌握前端。
        - id: n3
          label: 策展方 / 风险层
          detail: Sentora、Gauntlet、Steakhouse 等参与方打包金库策略和政策。
        - id: n4
          label: Morpho 市场与金库
          detail: Morpho Blue 和金库基础设施把存款和借款活动路由到链上。
        - id: n5
          label: 结果
          detail: 用户更简单地获得收益或信贷；伙伴加深参与度和变现。
      edges:
        - from: n1
          to: n2
          label: 经由进入
        - from: n2
          to: n3
          label: 选择 / 打包
        - from: n3
          to: n4
          label: 配置至
        - from: n4
          to: n5
          label: 产出
    claimRefs:
