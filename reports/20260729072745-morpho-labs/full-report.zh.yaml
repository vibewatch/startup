companyProfile:
  summary: >-
    Morpho Labs 是一家起步于巴黎的私营 DeFi 基础设施公司，正在搭建可配置的链上借贷轨道。其技术栈以 Morpho Blue 为中心：这是一个不可变借贷原语，允许无许可创建市场；MetaMorpho
    则是金库层，让策展方把风险管理后的信贷产品打包出来。Morpho 已经成为 Coinbase、Robinhood、Kraken、Fireblocks、Ledger、Trust Wallet
    等交易所、钱包和财资平台背后，由合作伙伴主导的借贷与收益体验底座。公开证据显示，公司在 2026 年完成 $175M 融资、估值最高 $2B，并讲出 $11B+ 存款的规模叙事，足以支撑独角兽状态；但收入获取、合作伙伴集中度、代币
    / 股权结构仍只披露了一部分。
