chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与当前范围
        blocks:
          - type: paragraph
            body: >-
              2026 年，Morpho 的公开定位明显更清晰。公司不再只把自己包装成服务加密原生用户的 DeFi
              协议，而是把自己定义为银行、交易所、金融科技公司、资产管理人和钱包都能接入的共享信贷基础设施。这个定位出现在官网、「Why Morpho exists」宣言和 2026 年 6
              月融资公告中。综合这些来源，Morpho 把自己描述成一个开放信贷网络，连接全球出借人与借款人，同时对终端用户保持隐形——用户实际接触的是 Coinbase、Kraken、Robinhood、Fireblocks
              或 Ledger 这样的品牌。尽调里的关键结论是，Morpho
              推的是基础设施，而不是单一目的地应用。这很重要：基础设施叙事可以支撑更广分发和更强网络效应，但也把安全、合作伙伴可靠性和监管适配的门槛拉高。Morpho
              的公开材料把野心讲得很直接：它想成为链上信贷产品的中立后端，而不是直接替代既有金融机构。
