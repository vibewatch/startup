  - id: FU003
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: 可见客户证明从伙伴发布走向终端用户存入；越接近留存和经济性，公开披露越薄。
    data:
      nodes:
        - id: a1
          label: 伙伴发布
          detail: 交易所、钱包或财库平台上线由 Morpho 驱动的功能。
        - id: a2
          label: 用户引导
          detail: 现有伙伴用户通过简化流程选择收益或借贷。
        - id: a3
          label: 存入 / 借款激活
          detail: 余额进入 Morpho 金库或市场，并开始产生活动。
        - id: a4
          label: 重复使用
          detail: 用户保持资金部署、追加资产，或提款后回流。
        - id: a5
          label: 持续经济性
          detail: 伙伴和 Morpho 从持续活动中捕获经常性价值。
