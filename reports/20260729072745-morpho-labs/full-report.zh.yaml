  - id: TP001
    title: 竞品画像表
    columns:
      - 竞争对手
      - 核心模式
      - 公开可见优势
      - 公开可见短板
      - 对 Morpho 的意义
    rows:
      - - Aave
        - 最大的非托管池化借贷既有玩家
        - 流动性深，品牌认知广
        - 共享资金池复杂，配置灵活度低于隔离市场
        - 核心规模标尺，也是默认替代方案。
      - - Compound III
        - 以基础资产为中心、由治理控制的市场
        - 抵押品到基础资产的设计简单，协议历史长
        - 嵌入式分发叙事不如 Morpho 显眼
        - 治理重型借贷设计的参照。
      - - Spark
        - 绑定 Sky 生态的稳定币流动性层
        - 稳定币资产负债表支持大，储蓄导向明确
        - 更依赖单一生态的资金来源
        - 在稳定币信贷和收益分发上构成竞争。
      - - Euler
        - 模块化、无许可借贷栈
        - 与模块化市场创建有技术重叠
        - 保留来源中，分发足迹较小
        - 架构上最接近的参照。
      - - 中心化封装 / 链下项目
        - App 或交易所内置的收益和借款产品
        - 直接控制用户分发和 UX
        - 需要在对手方风险和透明度之间取舍
        - 可以选择或替换协议后端。
      - - Morpho
        - 隔离市场 + 策展人金库
        - 风险可配置，嵌入式分发叙事强
