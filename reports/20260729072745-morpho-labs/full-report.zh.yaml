      - number: '8.3'
        title: 情景逻辑与回报纪律
        blocks:
          - type: paragraph
            body: >-
              因为公开收入缺失，情景分析比点估值精确度更有信息量。多头情景中，Morpho
              把协议规模、机构集成和抵押品扩展转化为持久费用捕获，并成为链上金融默认信贷轨道之一。基准情景中，它仍具战略重要性且广泛集成，但协议之上的分发方和策展方获得相当一部分经济性，削弱单靠原始存款增长带来的股权上行。空头情景中，监管、流动性冲击或合作伙伴流失压缩使用量，并证明协议相关性不必然等于变现能力。因此，投资者应少把
              Morpho 当作传统 SaaS 公司承保，多把它看作高潜力基础设施层；市场结构和议价能力决定规模能否变成价值捕获。这也是为什么回报纪律应写成情景和门槛，而不是在缺失输入上搭一个假精确 DCF。
