- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Why it matters
  - What would change the case
  rows:
  - - Critical exploit or repeated bad debt
    - Would directly damage trust in the rail
    - Would move case toward bear quickly.
  - - Partner concentration proves extreme
    - Would weaken bargaining power and revenue durability
    - Would justify transparency discount.
  - - Regulatory shutdown of key products
    - Would impair distribution-led growth
    - Would reduce premium case materially.
  - - Token/equity economics prove misaligned
    - Could leave equity with thin capture despite protocol success
    - Would cut willingness to pay.
  - - Monetization evidence remains weak after diligence
    - Would show scale is not translating into economics
    - Would make round look full or rich.
  notes: The strongest bear-case triggers are structural rather than narrative.
  claimRefs:
  - CV026
  - CV027
  - CV032
  - CV033
  - CV038
- id: TV006
  title: Final diligence asks table
  columns:
  - Ask
  - Why it is needed
  - Decision impact
  rows:
  - - Revenue and fee capture by layer
    - Need to know how value is divided among protocol, partner, and curator
    - Most important pricing variable.
  - - Partner concentration and retention
    - Need to know whether a few relationships drive activity
    - Key durability variable.
  - - Token purchase and equity interaction
    - Need to understand dilution, rights, and misalignment risk
    - Key structure variable.
  - - Governance and downside protections
    - Need to assess control rights and investor protection
    - Key deal-quality variable.
  - - Incident history and risk management
    - Need to assess resilience under stress
    - Key survival variable.
  notes: A positive public view should translate into a live diligence process, not an automatic valuation endorsement.
