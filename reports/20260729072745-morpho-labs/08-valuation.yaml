- id: pricing-context-and-comparable-lenses
  title: Pricing context and comparable lenses
  body: 'The cleanest public valuation anchor is the financing itself: elite investors were willing to fund Morpho at a valuation up to $2 billion. That is strong evidence of private-market confidence but not proof of fair value for a new investor today. Public comparables give only partial guidance. Coinbase, Robinhood, and SoFi trade as scaled financial platforms with direct customer ownership and reported revenue; their market-cap-to-revenue ratios show how capital markets price growth, distribution, and regulated financial infrastructure, but those businesses are much more mature and more transparent than Morpho. Aave is closer strategically as a DeFi lending benchmark, yet token-market valuation is not the same thing as private-company equity valuation. The right use of comparables is therefore directional: Morpho deserves an infrastructure premium if it owns critical credit rails, but it also deserves a transparency discount until revenue capture and concentration are clearer. Put
    differently, comp work can tell an investor whether a $2 billion outcome is plausible in the abstract; it cannot tell the investor whether this exact entry point is attractive without private monetization data.'
  claimRefs:
  - CV010
  - CV011
  - CV012
  - CV013
  - CV014
