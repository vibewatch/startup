company:
  name: Morpho Labs
chapter:
  number: 8
  title: Valuation
summary: Public evidence supports Morpho as a credible, strategically important DeFi credit-infrastructure company with unicorn status, but not as a fully transparent revenue business. The 2026 $175 million round at up to a $2 billion valuation is directionally defensible if Morpho truly becomes a core rail for exchange, wallet, and institutional credit products. The caution is that public evidence still says far more about deposits, integrations, and strategic relevance than about revenue capture, margin structure, or downside protection, so entry discipline matters more than the headline valuation alone.
sections:
- id: thesis-and-anti-thesis
  title: Thesis and anti-thesis
  body: 'The thesis for Morpho is straightforward. It sits at the intersection of three powerful trends: institutional interest in onchain credit, partner demand for configurable lending infrastructure, and user appetite for noncustodial earn or borrow products embedded inside familiar consumer and treasury applications. The $175 million 2026 round at up to a $2 billion valuation, plus visible usage across Coinbase, Robinhood, Kraken, Fireblocks, Ledger, and other channels, supports the idea that Morpho is emerging as a strategic rail rather than a niche app. The anti-thesis is just as clear. Morpho does not publicly disclose the conventional financial metrics that make late-stage valuation easier to underwrite. Deposits and TVL are not revenue. Protocol fees are not necessarily company revenue. Distribution partners and curators may capture a meaningful share of the economics. That means the public record can support a strong strategic case, but only a conditional pricing case.'
  claimRefs:
  - CV001
  - CV002
  - CV003
  - CV004
  - CV005
  - CV006
  - CV007
  - CV008
  - CV009
  tableRefs:
