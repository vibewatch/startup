- id: scenario-logic-and-return-discipline
  title: Scenario logic and return discipline
  body: Scenario analysis is more informative than point-estimate precision because public revenue is absent. In the bull case, Morpho translates protocol scale, institutional integrations, and collateral expansion into durable fee capture and becomes one of the default credit rails for onchain finance. In the base case, it remains strategically important and widely integrated, but a meaningful share of economics accrues to distributors and curators above the protocol, muting equity upside from raw deposit growth alone. In the bear case, regulation, liquidity shocks, or partner churn compress usage and demonstrate that protocol relevance does not necessarily equal monetization power. Investors should therefore underwrite Morpho less like a conventional SaaS name and more like a high-potential infrastructure layer where market structure and bargaining power determine whether scale becomes value capture. That is why return discipline should be expressed as scenarios and thresholds, not as
    a faux-precise DCF built on missing inputs.
  claimRefs:
  - CV020
  - CV021
  - CV022
  - CV023
  - CV024
  - CV025
  - CV026
  - CV027
  - CV028
