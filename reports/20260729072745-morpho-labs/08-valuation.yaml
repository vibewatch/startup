- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Public marker
  - What it shows
  - Why it is imperfect
  rows:
  - - Coinbase
    - ~$44.23B market cap on ~$6.56B TTM revenue (~6.7x)
    - Large, trusted crypto-financial platform can command sizable value
    - Owns customers and reports revenue directly.
  - - Robinhood
    - ~$83.53B market cap on ~$4.61B TTM revenue (~18.1x)
    - Distribution and consumer financial engagement command premium multiples
    - Very different business mix and regulatory posture.
  - - SoFi
    - ~$21.47B market cap on ~$3.94B TTM revenue (~5.4x)
    - Digital financial platforms can trade around mid-single-digit revenue multiples
    - Traditional-fintech mix differs from DeFi infrastructure.
  - - Aave
    - Public DeFi lending benchmark tracked by DefiLlama and CoinMarketCap
    - Closest strategic comp for onchain lending mindshare
    - Token market cap is not private equity value.
  - - Morpho private round
    - $2B valuation at $175M raise
    - Shows private investors see platform-scale optionality
    - No public revenue base to compare directly.
  notes: Comparable math is directional only; Morpho lacks public revenue, and token comps map imperfectly to equity.
