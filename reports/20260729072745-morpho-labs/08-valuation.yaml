- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - What happens
  - Valuation implication
  - Probability signal
  rows:
  - - Bull
    - Morpho becomes default embedded credit rail across major distributors and curators
    - Premium to current round can be justified
    - Needs evidence of real fee capture and low churn.
  - - Base
    - Morpho stays important, but economics are shared with partners and curators
    - Current round can be justified but upside is more moderate
    - Most consistent with current public evidence.
  - - Bear
    - Regulation, liquidity shocks, or churn show that TVL is less durable than assumed
    - Current round looks rich
    - Would be signaled by usage volatility or weak concentration metrics.
  - - Optionality kicker
    - RWAs and institutional collateral deepen network effects
    - Improves premium case if monetization follows
    - Needs tangible product and fee evidence.
  - - Downside buffer
    - High-quality backers and real integrations support franchise value
    - Does not guarantee attractive entry price
    - Useful but insufficient alone.
  notes: Scenario work is more honest than pretending a single precise multiple can be derived from public evidence.
