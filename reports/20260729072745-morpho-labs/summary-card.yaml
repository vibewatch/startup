  topStrengths:
    - >-
      Morpho has strong public partner proof across Coinbase, Robinhood, Kraken, Fireblocks, Ledger, Trust Wallet, and
      other channels.
    - The 2026 $175M financing at up to a $2B valuation confirms elite investor conviction and unicorn status.
    - >-
      Product architecture is differentiated around configurable risk, isolated markets, and partner-ready vault
      packaging.
    - >-
      Public security posture is stronger than average for DeFi, with immutability, formal verification, audits, and
      contest activity all visible.
    - Institutional and RWA optionality could expand Morpho's role if economic capture follows adoption.
  topRisks:
    - >-
      Public evidence still does not show how much protocol value accrues economically to Morpho versus curators and
      distributors.
    - >-
      Partner concentration could become material because exchanges, wallets, and treasury platforms own the end-user
      relationship.
    - >-
      DeFi credit remains exposed to smart-contract, oracle, liquidity, and regulatory shocks even with strong
      mitigations.
    - >-
      The 2026 financing used a token-purchase structure, which complicates straightforward equity-style valuation
      comparisons.
    - Public revenue, margin, burn, retention, and downside-protection data remain undisclosed.
  unresolvedGaps:
    - Revenue by line, fee capture after partners/curators, and margin structure are not publicly disclosed.
    - Partner concentration, renewal, and retention metrics are not publicly disclosed.
    - Token-versus-equity rights, dilution mechanics, and governance protections remain opaque in public materials.
    - Current burn, runway, and headcount are not publicly disclosed.
    - Full incident history, insurance, and enterprise operating controls remain under-documented publicly.
