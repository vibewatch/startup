    - Not publicly disclosed
    - Request current ARR, revenue by line, and historical growth.
  - - Gross margin / take rate
    - Needed to understand platform economics
    - Not publicly disclosed
    - Request fee capture by protocol, curator, and partner channel.
  - - Burn / runway
    - Needed to test capital adequacy
    - Not publicly disclosed
    - Request cash balance, burn, and fundraising runway plan.
  - - Partner concentration
    - Needed to assess dependence on a few distributors
    - Not publicly disclosed
    - Request balance and revenue concentration by partner and vault.
  - - Headcount / operating structure
    - Needed to link cost base to scale ambitions
    - Not publicly disclosed
    - Request current headcount and functional cost allocation.
  notes: These gaps are the main reason Morpho cannot yet be underwritten like a transparent late-stage software or fintech issuer.
