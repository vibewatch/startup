- id: protocol-metrics-and-what-they-do-not-prove
  title: Protocol metrics and what they do not prove
  body: The protocol metrics are real and impressive. DefiLlama’s retained snapshot shows roughly $7.6 billion in TVL, about $4.1 billion in active loans, and over $26 million in 30-day fees. Morpho’s own funding post separately claims more than $11 billion in deposits, which is directionally consistent with a large and growing credit network even if the exact accounting basis differs from spot TVL. Stablecoin market size also matters financially, because a $300 billion-plus onchain dollar base is the substrate from which many Morpho-powered credit products draw supply. However, protocol metrics do not translate automatically into company economics. TVL is not revenue. Fees are not necessarily equity-owner revenue. Active loans say little about customer acquisition, gross margin, or retention. The right reading is that Morpho has strong evidence of balance-sheet flow and market relevance, but only limited evidence on how much of that value accrues to the company or association that investors
    back.
  claimRefs:
