  rows:
  - - Protocol fee / market fee
    - Economics tied to lending activity across markets
    - DefiLlama fees snapshot; protocol docs and product descriptions
    - Most direct route from usage to monetization.
  - - Curator / vault-layer fees
    - Curators package markets into differentiated vault products
    - Fireblocks page plus curator stories
    - Part of total economics may sit above the primitive.
  - - Partner distribution economics
    - Exchange, wallet, and fintech wrappers monetize user relationships
    - Coinbase, Robinhood, Fireblocks product pages
    - Morpho wins if it participates enough in partner-led economics.
  - - Token incentives / ecosystem rewards
    - Some user economics may include MORPHO or partner incentives
    - Coinbase lending introduction
    - Can accelerate adoption but may obscure clean recurring revenue.
  - - Developer-platform value
    - API, SDK, and integration surfaces create software-platform leverage
    - Morpho docs pages
    - Supports infrastructure-style rather than app-only valuation logic.
  notes: These streams are visible structurally, but the public record does not disclose exact take rates, splits, or revenue contribution by line.
