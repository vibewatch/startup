  - - Robinhood Earn
    - Variable USDG lending yield via Morpho vault
    - Robinhood, Steakhouse, Morpho
    - Risk disclosures visible, economics opaque.
  - - Fireblocks Earn
    - Institutional vault yields and treasury workflows
    - Fireblocks, strategy providers, Morpho
    - Workflow clear, revenue split undisclosed.
  - - Direct protocol usage
    - Borrower interest and supplier yield on markets
    - Protocol participants and fee recipient
    - Onchain activity visible, company capture unclear.
  - - Curated vault products
    - Risk packaging and allocation services around Morpho
    - Curators plus protocol rails
    - Likely important but poorly disclosed publicly.
  notes: Public pricing is dynamic and market-based rather than a posted SaaS schedule, so monetization must be inferred from how value is shared across the stack.
