chapter:
  number: 4
  title: Financials
  summary: Morpho’s public financial case is strongest at the capital, protocol-scale, and partner-adoption layers, not at the P&L layer. The strongest positives are the $175 million June 2026 financing at roughly a $2 billion valuation, protocol metrics that show billions in TVL and active loans, and a partner set that suggests real institutional willingness to route balances through Morpho-powered products. The main cautions are that revenue, ARR, margin, burn, and take-rate visibility remain effectively undisclosed, so valuation discipline still depends on inference rather than conventional software or fintech reporting.
sections:
- id: capital-base-and-funding-structure
  title: Capital base and funding structure
  body: 'Morpho’s public financial story begins with capital rather than income statement disclosure. The June 2026 financing is the dominant anchor: $175 million raised at roughly a $2 billion valuation, with a blue-chip investor syndicate led by Paradigm, a16z crypto, and Ribbit Capital and joined by strategic names such as Apollo Funds, Circle Ventures, VanEck, SBI Group, and Bpifrance. That investor quality matters because it supplies both runway and validation. But the financing structure also matters. Multiple retained reports describe the round as token-linked rather than a plain equity issuance, which complicates the usual questions about dilution, preferences, and equity ownership. Morpho says the round was its fourth institutional fundraise since 2021, so there is clear capital continuity, but there is still no public treasury-runway bridge. Investors can say Morpho is well capitalized; they cannot yet say how efficiently that capital is being converted into recurring economics.
    The registry and legal-notice sources at least confirm that Morpho operates through named French entities, but they still do not solve the valuation-underwriting gap.'
