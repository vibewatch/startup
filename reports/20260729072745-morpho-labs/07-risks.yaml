chapter:
  number: 7
  title: Risks
summary: 'Morpho’s risk profile is the classic double-edged profile of high-growth DeFi infrastructure: the design choices that make it flexible and distribution-friendly also create multiple layers of technical, governance, partner, liquidity, and regulatory exposure. Public evidence shows Morpho has thought seriously about code risk, immutability, formal verification, audits, and interface warnings, which is a real strength. The main caution is that permissionless market creation, curator-controlled vaults, partner-owned front ends, and an unsettled regulatory environment mean users and investors still face meaningful residual risk even if the core protocol is comparatively well engineered.'
sections:
- id: protocol-and-security-risks
  title: Protocol and security risks
  body: Morpho’s public materials are unusually explicit that using Morpho and Morpho Vaults involves real smart-contract, oracle, liquidation, bad-debt, and liquidity risk. That candor is a positive because it suggests the team is not pretending DeFi lending can be made risk-free by branding alone. The strongest technical mitigants are immutability of core contracts, a minimalist design philosophy, formal verification, multiple audits, fuzzing, testing, and public bug-bounty or contest activity. But those mitigants only reduce risk; they do not eliminate it. Morpho’s own risk documentation says faulty oracles can cause asset loss, lenders can be exposed to bad debt, and liquidity can disappear for periods of time. The protocol therefore looks more safety-conscious than many DeFi projects, yet it still operates inside a threat model where a single overlooked edge case, oracle failure, or market-structure shock can damage users and reputation quickly.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
