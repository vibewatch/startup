- id: TR003
  title: Partner / dependency risk register
  columns:
  - Dependency
  - Upside
  - Risk
  - Why it matters
  rows:
  - - Large distributors
    - Rapid user acquisition and credibility
    - Concentration and bargaining power
    - Partners own the front end.
  - - Curators / risk managers
    - Better packaged yield products
    - Misallocation, fee capture, governance errors
    - Curators shape actual product quality.
  - - Oracles and collateral assets
    - Broader market support
    - Price failure or governance capture
    - Inputs can fail above the protocol.
  - - Chain deployments and bridges
    - More reach and assets
    - New technical and operational attack surface
    - Expansion multiplies dependency count.
  - - Competing protocols
    - Benchmarking and ecosystem growth
    - Liquidity migration to incumbents
    - Aave depth remains a real threat.
  notes: Morpho’s modular stack improves flexibility but also means critical risk can sit outside the immutable core.
