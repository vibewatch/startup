tables:
- id: TR001
  title: Regulatory / legal risk register
  columns:
  - Risk
  - Evidence
  - Why it matters
  - Current read
  rows:
  - - ML/TF and sanctions scrutiny
    - EBA/ESMA DeFi report; Chainalysis crime report
    - Onchain credit networks operate under rising compliance scrutiny
    - Material structural risk, not currently existential.
  - - Consumer disclosure risk
    - EBA/ESMA note information asymmetries; Robinhood and Bitpanda use strong warnings
    - Poor disclosure can trigger regulatory or reputational blowback
    - Needs careful partner implementation.
  - - Stablecoin and collateral treatment
    - Stablecoins dominate flows and illicit volume; wrapped collateral carries its own rules
    - Collateral or stablecoin policy shifts can directly hit activity
    - Persistent medium-high risk.
  - - Entity / legal-surface opacity
    - French entity records and legal notice are public but limited
    - Investors still need clearer ownership and control mapping
    - Moderate diligence gap.
  - - DeFi-specific future rulemaking
    - MiCAR follow-on work continues around DeFi and lending
    - A stricter regime could slow or reshape distribution
    - Policy overhang remains open.
  notes: Morpho is not uniquely exposed to these risks, but DeFi-lending infrastructure cannot avoid them.
  claimRefs:
