- id: regulatory-and-market-structure-risks
  title: Regulatory and market-structure risks
  body: 'Regulatory and ecosystem-wide risks remain material because Morpho sits inside crypto lending, stablecoins, and permissionless capital markets rather than outside them. EBA and ESMA explicitly identify leverage, information asymmetry, collateral-chain contagion, and ML/TF concerns in DeFi and crypto lending, even while saying current EU financial-stability risks appear limited. Chainalysis adds a different angle: 2025 crypto crime volumes rose sharply, stablecoins accounted for most illicit transaction volume, and North Korea-linked theft remained enormous. None of that means Morpho is implicated in wrongdoing; it does mean any onchain credit network lives under heightened policy, compliance, and reputational scrutiny. The market-structure layer adds another risk: if DeFi lending demand concentrates around a few protocols or collateral types, Morpho can still lose mindshare or liquidity to deeper incumbents such as Aave even if its architecture is elegant. That scrutiny can raise
    compliance costs, slow product rollouts, and force partners to apply harsher user restrictions even without a direct Morpho failure.'
  claimRefs:
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
