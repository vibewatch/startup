- id: FR003
  title: Dependency map
  type: stack
  layout: wide
  summary: Risk sits across a stack of code, oracles, curators, partners, and legal environment rather than only in the protocol core.
  data:
    layers:
    - label: Policy and legal layer
      detail: MiCAR follow-on treatment, sanctions, consumer-disclosure expectations.
    - label: Partner shell layer
      detail: Robinhood, Fireblocks, wallets, and exchanges own the user relationship.
    - label: Curator / governance layer
      detail: Curators, allocators, sentinels, and owners can alter user outcomes within defined powers.
    - label: Oracle and collateral layer
      detail: Asset governance and oracle quality shape liquidation and bad-debt outcomes.
    - label: Protocol core layer
      detail: Immutable contracts, audits, and formal verification bound but do not erase code risk.
