- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk area
  - Mitigation signal
  - Kill trigger
  - Diligence ask
  rows:
  - - Smart-contract safety
    - Fresh audits, formal verification, bounty coverage
    - Critical unresolved exploit or severe post-launch bug
    - Request full audit register and incident history.
  - - Oracle and liquidity management
    - Conservative market parameters and curator discipline
    - Repeated bad debt, withdrawal freezes, or oracle incidents
    - Request bad-debt history and stress testing.
  - - Regulatory posture
    - Strong disclosures and jurisdiction-aware rollout
    - Material enforcement or forced product shutdown
    - Request legal memos and compliance workflows.
  - - Partner concentration
    - Diverse distributor and curator mix
    - One or two partners dominate balances or growth
    - Request partner concentration and churn data.
  - - Operational readiness
    - Documented response playbooks and governance segmentation
    - Inability to explain control ownership or emergency process
    - Request incident response, access control, and insurance detail.
  notes: Kill criteria should focus on repeatable structural failures, not single scary headlines alone.
  claimRefs:
  - CR034
  - CR035
