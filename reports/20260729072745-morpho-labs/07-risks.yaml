- id: people-governance-and-kill-criteria
  title: People, governance, and kill criteria
  body: The people and governance risks are subtler but still important. Morpho’s architecture reduces some admin-key risk by emphasizing immutability and bounded control, yet vault governance still gives meaningful power to owners, curators, allocators, and sentinels. A compromised or reckless actor can change parameters, gate flows, or move funds within allowed limits even if they cannot rewrite the core protocol. The public record also remains thin on enterprise-control details such as incident-response SLAs, internal control frameworks, insurance, and post-incident recovery processes. At the company level, Morpho still looks founder-led and execution-sensitive; a lot of external trust appears tied to the judgment of a relatively small team designing protocol rules, partner frameworks, and risk posture. For investors, the right question is not whether risk exists — it clearly does — but whether the mitigations are mature enough, diversified enough, and transparent enough that a bad market
    event would be survivable rather than franchise-breaking. Investors should assume this control stack needs continual verification, not one-time comfort.
  claimRefs:
  - CR028
  - CR029
  - CR030
  - CR031
  - CR032
  - CR033
  - CR034
  - CR035
