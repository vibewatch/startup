  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: incident-response-and-enterprise-controls
    missingEvidence: Insurance coverage, incident-response playbooks, access-control matrices, support SLAs, historical incident log, and partner concentration by balances or revenue.
    whyItMatters: A public crypto protocol can look robust on code quality yet still fail institutionally if crisis handling, control ownership, and partner dependencies are underdeveloped or opaque.
    diligencePath: Request security-program cadence, incident postmortems, control matrices, insurance and indemnity details, and concentration reporting by partner and curator.
