- id: partner-customer-and-operational-risks
  title: Partner, customer, and operational risks
  body: 'Morpho’s partner-led model creates its own operational fragility. Many end users encounter Morpho through Coinbase, Robinhood, Kraken, Fireblocks, Trust Wallet, Ledger, and similar wrappers. That accelerates adoption, but it means Morpho does not fully control the user journey, disclosures, support experience, or product positioning. Partners can throttle distribution, swap risk managers, favor competing protocols, or decide that legal or reputational risk outweighs yield demand. Morpho’s own and partner-authored materials also show that liquidity timing, collateral shocks, and smart-contract dependencies remain part of the end-user experience. Curators add one more operational layer: they can improve risk management, but they also become concentrated points where misaligned incentives, poor allocations, or governance failures can spill into user losses or brand damage. In short, operational resilience for Morpho is not just a code question; it is a coordination question across
    interfaces, curators, oracles, and partner policies.'
  claimRefs:
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  - CR025
  - CR026
  - CR027
