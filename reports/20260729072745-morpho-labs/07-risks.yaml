  enumerationScope:
    coverage: sample
    basis: Representative public regulatory and legal risks selected from the retained corpus rather than a complete legal memo.
- id: TR002
  title: Operational / quality / security risk register
  columns:
  - Risk
  - Public mitigant
  - Residual exposure
  - Investor implication
  rows:
  - - Smart contract bug
    - Audits, formal verification, fuzzing, contests, bug bounty
    - A severe bug can still bypass controls
    - Core risk remains fundamental.
  - - Oracle failure or manipulation
    - Oracle due-diligence guidance and isolated-market design
    - Bad oracle data can still cause liquidations or bad debt
    - Need oracle-by-oracle review.
  - - Bad debt / liquidation failure
    - Isolated markets and LLTV discipline
    - Fast moves can still leave losses
    - Stress scenarios matter.
  - - Liquidity lock-up
    - Interest-rate model and disclosures on withdrawal timing
    - Users can still face delayed withdrawals
    - Can create reputational stress in downturns.
  - - Interface or market misconfiguration
    - Risk warnings, recognized lists, blacklisting logic
    - Permissionless market creation still increases unsafe surface area
    - UI safety is necessary but not sufficient.
  notes: The protocol appears better defended than average, but the underlying categories of DeFi risk remain unavoidable.
