- id: TR004
  title: People / execution risk register
  columns:
  - Risk
  - Evidence
  - Why it matters
  - Current read
  rows:
  - - Founder / architect concentration
    - Public narrative remains team- and design-led
    - Execution quality is tightly linked to a small core group
    - Moderate risk.
  - - Enterprise-control opacity
    - Little public evidence on insurance, SLA, or SOC-style controls
    - Institutional diligence cannot stop at code reviews
    - Meaningful diligence gap.
  - - Go-to-market coordination complexity
    - Partners, curators, and protocol must stay aligned
    - Cross-party friction can impair growth or trust
    - Ongoing execution risk.
  - - Security-program upkeep
    - Audits and contests need continuous renewal
    - Security posture can decay if cadence slips
    - Watch for stale assurance.
  - - Incident response under stress
    - Public post-incident processes are limited
    - Crisis handling quality may determine franchise resilience
    - Material but under-disclosed.
  notes: Execution risk sits above the protocol and may determine whether technical quality converts into lasting trust.
