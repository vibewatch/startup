- id: milestones-security-and-remaining-disclosure-gaps
  title: Milestones, security posture, and remaining disclosure gaps
  body: 'Morpho’s milestone map is unusually coherent for a private crypto company. The retained sources support a sequence from the 2021 founding, to the Optimizer period, to the 2023 launches of Morpho Blue and MetaMorpho, and then to 2026 commercialization milestones such as the $175 million raise and the Robinhood and Fireblocks announcements. Security is also a real asset in the public narrative. Morpho’s docs and security-framework materials emphasize formal verification, audits, contests, fuzzing, and code minimalism as part of the trust case for institutions. That said, the public disclosure set still has meaningful blind spots. There is no retained public revenue figure, no clear headcount disclosure, no public board roster, and no cap-table detail beyond investor names. Partner-authored materials also carry real risk language: Robinhood explicitly tells users that funds are lent through third-party smart contracts with no bank-like guarantees, while Fireblocks emphasizes smart-contract,
    liquidity, and market-volatility risk. Those adverse disclosures do not invalidate Morpho’s growth story, but they do remind investors that the protocol’s commercial momentum still sits on top of inherently high-risk DeFi infrastructure.'
