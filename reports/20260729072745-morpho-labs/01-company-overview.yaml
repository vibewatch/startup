- id: capital-base-scale-and-institutional-adoption
  title: Capital base, scale, and institutional adoption
  body: 'The strongest public validation event is the June 2026 financing. Morpho announced a $175 million round co-led by Paradigm, a16z crypto, and Ribbit Capital, with strategic participation from Apollo Funds, Circle Ventures, VanEck, Ledger Cathay, SBI Group, Bpifrance, and others. Independent news reports place the valuation at roughly $2 billion and note that the structure was a token-linked purchase rather than a traditional equity round. The company also says the raise was its fourth institutional fundraise since 2021. On scale, the headline number management emphasizes is $11B+ in deposits, while DefiLlama’s retained snapshot shows about $7.6 billion in TVL and just over $4 billion in active loans on the access date. Those are not contradictory if deposits are cumulative or broader than spot TVL, but the difference means later chapters should treat each metric carefully and avoid mixing them. More encouragingly, the named-customer list is not limited to crypto-native apps: Morpho
    and partner materials point to Coinbase, Kraken, Binance, Robinhood, Fireblocks, Ledger, Bitpanda, Bitwise, Galaxy, and Anchorage as evidence that the protocol is becoming embedded distribution infrastructure.'
