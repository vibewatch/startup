- id: founders-governance-and-evolution
  title: Founders, governance surface, and product evolution
  body: The company is consistently anchored around cofounder Paul Frambot, who is the voice quoted in the 2026 fundraising release and the clearest current executive face in retained sources. Third-party coverage also names Merlin Egalite and Julien Thomas as cofounders, with at least one article additionally mentioning Mathis Gontier Delaunay, which suggests that the public founder record is directionally clear but not perfectly harmonized. The product history is clearer than the governance history. Morpho first built the Morpho Optimizer on top of Aave and Compound, then pivoted toward Morpho Blue in 2023 to create an immutable lending primitive with permissionless market creation and externalized risk management. MetaMorpho followed as the vault layer that lets curators package Morpho Blue into lender-facing products. That evolution is central to the investment story because it shows Morpho moving from an efficiency layer on top of incumbents to a base layer that others can build on.
    By contrast, the public record remains thin on board composition, ownership, and regular operating disclosures, which is a meaningful governance gap for private-market diligence.
