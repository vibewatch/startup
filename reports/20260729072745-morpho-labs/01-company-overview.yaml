company:
  name: Morpho Labs
chapter:
  number: 1
  title: Company Overview
  summary: Morpho is a Paris-founded onchain lending infrastructure company that has evolved from the Morpho Optimizer into a modular stack centered on Morpho Blue and MetaMorpho. The strongest public positives are the $175 million June 2026 raise at about a $2 billion valuation, the protocol’s $11B+ deposits narrative, and visible integrations with Coinbase, Kraken, Robinhood, Fireblocks, Ledger, and other institutional or retail distribution platforms. The main cautions are thin public disclosure on governance, revenue, and headcount, plus the fact that much of the customer proof still comes through Morpho- or partner-authored materials rather than audited company filings.
sections:
- id: identity-and-current-scope
  title: Identity, mission, and current scope
  body: 'Morpho’s public positioning has become much sharper in 2026. The company no longer markets itself merely as a DeFi protocol for crypto-native users; it frames itself as shared credit infrastructure that banks, exchanges, fintechs, asset managers, and wallets can build on. That framing is visible on the homepage, in the “Why Morpho exists” manifesto, and in the June 2026 financing announcement. Across those sources, Morpho describes itself as an open credit network that connects lenders and borrowers globally while remaining invisible to end users who interact through brands such as Coinbase, Kraken, Robinhood, Fireblocks, or Ledger. The important diligence takeaway is that Morpho is pitching infrastructure rather than a single destination app. That matters because infrastructure narratives can support broader distribution and stronger network effects, but they also raise the bar on security, partner reliability, and regulatory fit. Morpho’s public materials make the ambition explicit:
    it wants to be a neutral backend for onchain credit products, not a direct replacement for incumbent financial institutions.'
