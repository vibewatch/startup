    - Control and downside governance cannot be fully underwritten publicly.
  - - Financial disclosure
    - $175M raise and valuation headline; protocol metrics from public dashboards
    - Revenue, margin, burn, treasury runway, audited statements
    - Valuation discipline remains inference-heavy.
  - - Operating scale
    - Named partners and institutional users; protocol deposits and TVL metrics
    - Headcount, office footprint, customer concentration, net retention
    - Execution durability is harder to judge than adoption narrative.
  - - Partner economics
    - Visible integrations with Coinbase, Kraken, Robinhood, Fireblocks, Ledger, and Safe
    - Commercial terms, fee splits, minimum commitments, churn data
    - Distribution strength may be concentrated or low-margin.
