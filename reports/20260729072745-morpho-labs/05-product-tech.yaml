chapter:
  number: 5
  title: Product & Technology
  summary: Morpho’s product stack is built around an immutable lending primitive, a curator-led vault layer, and partner-facing integration surfaces. The strongest positives are the clarity of the modular design, visible developer and deployment surfaces, and a security narrative built around formal verification, minimalism, and external review. The main cautions are that isolated markets and curator-led packaging add operational complexity, and public evidence remains much stronger on smart-contract design than on enterprise support, certification, and non-code operating controls.
sections:
- id: core-product-stack
  title: Core product stack
  body: 'Morpho’s stack is easiest to understand as layers. Morpho Blue is the immutable primitive that defines isolated lending markets. MetaMorpho is the vault layer that lets curators package those markets for passive lenders. Above that sit interfaces, partner shells, and workflow abstractions that make the protocol usable for exchanges, wallets, and institutions. This layered approach matters because it lets Morpho keep the core lending logic simple while shifting product complexity into configurable modules above it. The retained materials are unusually explicit on this point: Morpho does not appear to think one protocol surface should serve every risk profile. Instead, it wants the primitive to stay fixed while curators and distributors construct differentiated credit products on top. That architecture is strategically important because it is what makes Morpho fit both enterprise wrappers such as Fireblocks and consumer flows such as Coinbase or partner wallets without forcing the
    core protocol to mutate every time a new use case emerges.'
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE021
  - CE029
  - CE035
  tableRefs:
  - TE001
  - TE002
  figureRefs:
