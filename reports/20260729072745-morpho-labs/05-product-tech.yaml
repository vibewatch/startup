- id: TE004
  title: Trust / quality / compliance table
  columns:
  - Control area
  - What is public
  - What is not public
  - Implication
  rows:
  - - Formal verification
    - Certora-based materials for Morpho Blue and MetaMorpho
    - Full continuous verification scope and update cadence
    - Strong smart-contract trust signal.
  - - External review / contests
    - Cantina-hosted competition and public security framework
    - Complete consolidated audit register in retained corpus
    - Shows seriousness, but buyers still need the complete package.
  - - Risk surfacing
    - Interface risk warnings and legal notice are public
    - Detailed user-behavior analytics or support playbooks
    - Good sign that UI risk is being addressed.
  - - Entity / administrative surface
    - Association registry and legal notice are public
    - Detailed organizational controls and ownership map
    - Confirms named entities but not full enterprise-readiness picture.
  - - Operational certifications
    - Not clearly visible in retained sources
    - SOC, ISO, support SLAs, incident metrics
    - Major diligence gap for enterprise buyers.
  notes: Morpho’s public trust surface is strongest on code and weakest on non-code enterprise operating controls.
