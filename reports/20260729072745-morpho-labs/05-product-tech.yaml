  summary: Morpho’s layered architecture from immutable markets up through curator and partner product shells.
  data:
    layers:
    - label: Partner and interface layer
      detail: Coinbase, Fireblocks, wallets, and other branded product shells own distribution and UX.
    - label: Curator and vault layer
      detail: MetaMorpho vaults and curator logic package risk-managed lending products.
    - label: Primitive market layer
      detail: Morpho Blue runs isolated lending markets with chosen loan asset, collateral, LLTV, and oracle.
    - label: Security and governance layer
      detail: Immutability, formal verification, audits, and risk warnings shape trust assumptions.
    - label: Developer layer
      detail: Repos, contract docs, and address registries let third parties integrate the stack.
