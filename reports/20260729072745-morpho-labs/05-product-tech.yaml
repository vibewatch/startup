- id: TE007
  title: Comparison and dependency table
  columns:
  - Dependency or comparator
  - Why it matters
  - Morpho implication
  - Risk
  rows:
  - - Aave / Compound
    - Incumbent pooled-lending reference designs
    - Clarifies Morpho’s modular differentiation
    - Incumbent liquidity can still dominate.
  - - Spark
    - Stablecoin-liquidity competitor tied to one ecosystem
    - Highlights Morpho’s neutrality
    - Shows focused competitors can still win specific verticals.
  - - Euler
    - Modular lending analogue
    - Confirms modularity is not unique
    - Commercial execution becomes differentiator.
  - - Curators and oracles
    - Shape actual user risk and product quality
    - Critical for Morpho’s higher layers
    - Operational failures can sit above the primitive.
  - - Partner distributors
    - Own the user relationship and route balances
    - Essential to scale beyond crypto-native usage
    - Concentration and churn risk.
  notes: Morpho’s technical edge exists, but it is tightly linked to dependencies above the primitive and comparisons below the product shell.
