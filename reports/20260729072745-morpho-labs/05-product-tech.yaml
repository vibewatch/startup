- id: architecture-and-developer-surface
  title: Architecture and developer surface
  body: 'The retained product materials portray Morpho as a real developer platform rather than a closed lending app. Contract documentation, address registries, repositories, and the public GitHub organization all point to a stack meant to be integrated into other systems. The design choice that underpins this platform posture is externalization: Morpho Blue intentionally omits some of the protocol-level complexity that pooled incumbents handle centrally, and pushes risk packaging upward into curators, partners, and application layers. That makes the primitive lighter and more adaptable, but it also means real product quality depends on the actors above the primitive. The main technical trade-off is therefore clear. Morpho gains configurability, lower attack surface, and integration flexibility, but the surrounding operating model becomes more dependent on high-quality curators, oracles, interfaces, and partner workflows. For sophisticated builders that can be a feature. For less sophisticated
    buyers it can become an adoption hurdle that requires documentation, support, and explicit risk framing.'
  claimRefs:
  - CE005
  - CE006
  - CE008
  - CE009
