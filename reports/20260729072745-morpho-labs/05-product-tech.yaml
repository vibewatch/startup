- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer
  - Role
  - Key dependency
  - Trade-off
  rows:
  - - Immutable core contract
    - Runs isolated markets
    - Smart-contract security and oracle inputs
    - Low attack surface but less centralized rescue flexibility.
  - - Vault / curation layer
    - Allocates across markets and sets risk profile
    - Curator quality and governance
    - More customization but more operational dependence.
  - - Interface layer
    - Surfaces products and warnings to users
    - Partner UX and disclosure discipline
    - Can simplify adoption but may obscure risk if poorly designed.
  - - Developer layer
    - Docs, SDKs, repos, and addresses for integrators
    - Documentation quality and upkeep
    - Enables scale through partners rather than only direct usage.
  - - Distribution shell
    - Coinbase, Fireblocks, wallets, exchanges
    - Partner willingness to ship and market products
    - Creates reach but adds concentration risk.
  notes: Morpho’s architecture is deliberately layered so the primitive stays simple while higher layers own packaging, integration, and curation.
