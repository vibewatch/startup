  - TE006
- id: roadmap-dependencies-and-comparative-positioning
  title: Roadmap, dependencies, and comparative positioning
  body: 'Morpho’s roadmap is less about adding random features and more about extending collateral breadth, partner packaging, and distribution channels on top of a stable primitive. The stETH and cbBTC examples show how new collateral types can broaden product relevance, while Fireblocks and Coinbase illustrate how the same architecture can serve enterprise and consumer shells. Dependencies remain meaningful: oracles, curators, distributors, chain deployments, and partner UX all shape the product outcome. Compared with Aave and Compound, Morpho looks more modular and more packaging-friendly. Compared with Spark, it looks more neutral. Compared with Euler, it looks more commercially focused on curator-led distribution in the retained corpus. Those are attractive attributes, but they do not remove dependency risk. Morpho’s product-tech advantage will hold only if curators, partners, and users continue to believe the complexity above the primitive is worth the flexibility the primitive creates.'
  claimRefs:
