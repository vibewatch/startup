evidenceGaps:
  - type: missing-source
    severity: material
    topic: leadership-disclosure
    missingEvidence: Current executive roster, formal CEO title, and board composition.
    whyItMatters: Control and key-person risk cannot be fully assessed from the retained public record alone.
    diligencePath: Request an organization chart, board list, and governance rights summary from management.
    relatedQuestionRefs:
      - QO018
      - QO024
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure
    missingEvidence: Revenue, margin, burn, runway, and customer concentration disclosures.
    whyItMatters: The $2B valuation cannot be tested rigorously against operating performance without private financial data.
    diligencePath: Request monthly financials, cohort concentration, and treasury runway materials in the data room.
    relatedQuestionRefs:
      - QO019
      - QO024
    relatedTableRefs:
      - TO005
      - TO003
  - type: missing-source
    severity: minor
    topic: morpho-sam
    missingEvidence: Customer-level segmentation of deposits, partner balances, and jurisdiction mix specific to Morpho.
    whyItMatters: Without partner and user segmentation, the practical SAM and concentration profile remain approximate.
    diligencePath: Request partner balance breakdowns, geography mix, and vault-level user segmentation from management.
    relatedQuestionRefs:
      - QM025
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: minor
    topic: competitive-economics
    missingEvidence: Partner-specific fee splits, take rates, and cohort retention by distributor.
    whyItMatters: >-
      Competitive superiority cannot be fully proven without knowing whether embedded distribution converts into durable
      economics.
    diligencePath: Request partner economics, vault fee schedules, and retention by product channel from management.
    relatedQuestionRefs:
      - QP012
      - QP022
    relatedTableRefs:
      - TP003
      - TP004
  - type: private-evidence-only
    severity: material
    topic: financial-model-underwriting
    missingEvidence: Revenue, ARR, take rate, gross margin, burn, runway, and partner concentration by vault or channel.
    whyItMatters: >-
      Without private financials, investors cannot test whether Morpho’s protocol scale converts into durable
      equity-owner economics.
    diligencePath: >-
      Request a data-room package with monthly financials, vault economics, partner concentration, treasury cash, and
      forecast assumptions.
    relatedQuestionRefs:
      - QI014
      - QI016
      - QI023
      - QI025
    relatedTableRefs:
      - TI005
      - TI007
  - type: private-evidence-only
    severity: material
    topic: enterprise-operating-controls
    missingEvidence: SOC / ISO certifications, support SLAs, incident response metrics, and enterprise onboarding controls.
    whyItMatters: >-
      A bank, wallet, or treasury buyer needs more than smart-contract assurance before treating Morpho as
      production-grade infrastructure.
    diligencePath: >-
      Request audit inventory, security program detail, support commitments, and enterprise implementation documentation
      directly from Morpho or partners.
    relatedQuestionRefs:
      - QE017
      - QE024
      - QE025
    relatedTableRefs:
      - TE004
      - TE006
  - type: private-evidence-only
    severity: material
    topic: sampled-named-customer-proof-tu003-and-retention-concentration
    missingEvidence: >-
      Partner-level retention, renewal dates, revenue contribution, NRR/GRR, churn, and top-partner concentration by
      balances or revenue.
    whyItMatters: >-
      Morpho’s public customer proof is strong on launches and balances but weak on durability and concentration, which
      are central to underwriting a distribution-led infrastructure company.
    diligencePath: >-
      Request partner cohort metrics, contract renewal schedules, customer concentration by balances and revenue, and
      gross / net retention by partner channel.
    relatedQuestionRefs:
      - QU014
      - QU015
      - QU021
      - QU024
      - QU025
    relatedTableRefs:
      - TU003
      - TU004
      - TU005
  - type: private-evidence-only
    severity: material
    topic: incident-response-and-enterprise-controls
    missingEvidence: >-
      Insurance coverage, incident-response playbooks, access-control matrices, support SLAs, historical incident log,
      and partner concentration by balances or revenue.
    whyItMatters: >-
      A public crypto protocol can look robust on code quality yet still fail institutionally if crisis handling,
      control ownership, and partner dependencies are underdeveloped or opaque.
    diligencePath: >-
      Request security-program cadence, incident postmortems, control matrices, insurance and indemnity details, and
      concentration reporting by partner and curator.
    relatedQuestionRefs:
      - QR018
      - QR019
      - QR022
      - QR025
    relatedTableRefs:
      - TR001
      - TR003
      - TR004
      - TR005
  - type: private-evidence-only
    severity: material
    topic: valuation-underwriting-gaps
    missingEvidence: >-
      Revenue by line, fee capture after curators and partners, concentration by partner, token-versus-equity rights,
      margins, burn, and downside protections.
    whyItMatters: >-
      The central question in Morpho valuation is not whether the protocol matters, but how much of that importance
      accrues economically and contractually to the company or association investors are actually funding.
    diligencePath: >-
      Request full monetization bridge, partner concentration tables, legal structure memo, governance-rights package,
      and current financial plan with runway.
    relatedQuestionRefs:
      - QV008
      - QV017
      - QV024
      - QV029
      - QV030
    relatedTableRefs:
      - TV001
      - TV004
      - TV005
      - TV006
