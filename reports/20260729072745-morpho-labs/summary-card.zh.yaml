  topStrengths:
    - Morpho 在 Coinbase、Robinhood、Kraken、Fireblocks、Ledger、Trust Wallet 等渠道拿到了强公开合作伙伴验证。
    - 2026 年 $175M 融资最高对应 $2B 估值，确认了顶级投资人的信心和独角兽状态。
    - 产品架构围绕可配置风险、隔离市场和面向合作伙伴的 vault 打包形成差异化。
    - 公开安全姿态强于 DeFi 平均水平，不可变性、形式化验证、审计和竞赛活动都可见。
    - 如果经济捕获能跟上采用，机构和 RWA 可选性可能扩大 Morpho 的角色。
  topRisks:
    - 公开证据仍看不出协议价值有多少在经济上流向 Morpho，而不是流向策展人和分销方。
    - 交易所、钱包和资金管理平台掌握终端用户关系，合作伙伴集中度可能变得实质性。
    - 即便缓释措施较强，DeFi 信贷仍暴露在智能合约、预言机、流动性和监管冲击下。
    - 2026 年融资采用代币购买结构，直接用股权式估值比较会变复杂。
    - 公开收入、利润率、烧钱速度、留存和下行保护数据仍未披露。
  unresolvedGaps:
    - 按业务线拆分的收入、扣除合作伙伴 / 策展人后的费用捕获和利润率结构未公开披露。
    - 合作伙伴集中度、续约和留存指标未公开披露。
    - 代币与股权权利差异、稀释机制和治理保护在公开材料中仍不透明。
    - 当前烧钱速度、现金跑道和员工数未公开披露。
    - 完整事故历史、保险和企业级运营控制在公开层面记录不足。
