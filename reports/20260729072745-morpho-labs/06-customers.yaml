- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Retention lens
  - What is public
  - Proxy signal
  - Gap
  rows:
  - - Renewal / contract length
    - Not publicly disclosed
    - Repeated product expansion by Kraken, Ledger, and wallets implies continued engagement
    - No contract dates or renewal rates.
  - - Cohort retention / churn
    - Not publicly disclosed
    - Persistent deposits and multi-asset expansion suggest some repeat behavior
    - No GRR, NRR, or churn disclosed.
  - - Satisfaction / product fit
    - Executive quotes and product expansions are positive
    - Partners keep integrating Morpho into core app surfaces
    - Quotes are promotional and not survey-based.
  - - Withdrawal / liquidity behavior
    - Robinhood and Kraken disclose variable liquidity timing and redemption conditions
    - Operational transparency reduces surprise risk
    - No actual redemption statistics disclosed.
  - - Cross-sell / expansion
    - Wallets and exchanges add new assets, chains, or vaults
    - Suggests land-and-expand potential
    - Economics of expansion are not public.
  notes: Durability must be inferred from product embedding and follow-on expansion because classic retention metrics are absent from the public record.
  claimRefs:
