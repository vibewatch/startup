chapter:
  number: 6
  title: Customers
summary: Morpho’s customer evidence is strongest where large exchanges, wallets, and treasury platforms have embedded Morpho-powered earn or lending flows for existing user bases. The retained proof shows real adoption across retail, prosumer, and institutional channels, with especially strong public metrics from Kraken, Ledger, Lemon, and Trust Wallet. The main caution is that public evidence remains far better at proving launch momentum and breadth of distribution than at proving classic SaaS-style retention, contract durability, or revenue concentration by partner.
sections:
- id: customer-base-segmentation
  title: Customer base segmentation
  body: 'Morpho does not sell to one homogeneous buyer. The retained corpus shows at least four meaningful customer layers. First are end-users who lend, borrow, or earn through wrapped partner experiences such as Coinbase, Robinhood, Kraken, Trust Wallet, Ledger, Lemon, and SafePal. Second are institutions and treasury operators using shells such as Fireblocks or Safe. Third are distributors and exchanges that use Morpho as the yield or lending engine behind their own product surfaces. Fourth are curators such as Sentora and Gauntlet that package vaults, set risk frameworks, and influence which end customers can actually use Morpho safely. That segmentation matters because Morpho’s adoption is distribution-led: many of the visible customers are not buying a standalone software seat, they are embedding Morpho into a broader consumer or treasury workflow.'
  claimRefs:
  - CU001
  - CU002
  - CU003
  - CU004
  - CU005
  - CU006
  - CU007
  - CU008
  tableRefs:
  - TU001
