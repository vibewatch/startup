- id: adoption-and-growth-proof
  title: Adoption and growth proof
  body: 'The strongest public adoption signals come from named partner outcomes rather than from a single company-level MAU or ARR metric. Kraken reports more than $300 million in DeFi Earn deposits and 15 million-plus total users, while Ledger reports more than $100 million deposited since launch. Trust Wallet says Stablecoin Earn sits inside a wallet trusted by over 200 million users and that deposits exceeded $50 million in the first month. Lemon reports 70,000-plus unique depositors and more than $16 million deposited, with over 70% of deposits in stablecoins. Those figures do not map neatly to Morpho company revenue, but they do show that Morpho is not limited to crypto-native power users clicking through raw protocol screens. Importantly, these proofs come from different user archetypes: exchange customers, self-custody wallet holders, and emerging-market savers. That mix reduces the chance that Morpho’s visible traction is just one promotional partnership or one narrow yield campaign.
    It also suggests the protocol can support both supplier and borrower demand inside multiple shells.'
  claimRefs:
  - CU009
  - CU010
  - CU011
  - CU012
  - CU013
  - CU014
  - CU015
  - CU016
  - CU017
  - CU018
