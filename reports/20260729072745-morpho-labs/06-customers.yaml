    - Binance, Gemini, Kraken, World, Lemon
    - Branded product packaging and user acquisition
    - Morpho scales by piggybacking on large installed bases.
  notes: Morpho’s customer map includes both direct protocol participants and partner-controlled end-user channels, so buyer, operator, and beneficiary are often different parties.
