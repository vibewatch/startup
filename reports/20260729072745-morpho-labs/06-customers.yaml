- id: named-customer-proof-and-durability
  title: Named customer proof and durability proxies
  body: 'Named-customer proof is real, but durability is mostly proxied rather than directly disclosed. The retained sources support active relationships with Coinbase, Robinhood, Kraken, Fireblocks, Ledger, Trust Wallet, Safe, Lemon, SafePal, Gemini, Binance, World, and curator-distributors such as Sentora and Gauntlet. Several of those relationships appear production-grade rather than experimental: Coinbase documents Morpho-linked borrow and cbBTC workflows, Robinhood routes USDG lending through Morpho via a self-custody wallet, and Fireblocks exposes Morpho vaults inside institutional governance workflows. Yet the public record rarely gives renewal terms, cohort retention, NRR, or partner-level economics. The right reading is that Morpho has broad launch proof and some signs of deep embedding, but public durability evidence is still incomplete. In other words, Morpho has public proof that serious distributors trust the infrastructure enough to expose it to their own users, but not enough
    public disclosure to quantify how sticky those users are after launch-month novelty fades.'
  claimRefs:
  - CU019
  - CU020
  - CU021
  - CU022
  - CU023
  - CU024
  - CU025
  - CU026
  - CU027
  - CU028
