- id: expansion-concentration-and-judgment
  title: Expansion, concentration, and judgment
  body: 'Morpho’s expansion path looks attractive because a single protocol can be redistributed through many branded surfaces, assets, and geographies without Morpho owning every end-user relationship. Kraken extends from stablecoins into BTC yield. Ledger started with USDC and USDT and plans additional chains and assets. Trust Wallet spans multiple stablecoins and chains. World positions Morpho inside a mobile-first mini-app context, and Fireblocks exposes treasury and embedded-wallet use cases. The flip side is concentration risk. Exchanges, wallets, and curators own the user interface, control merchandising, and can shift traffic to alternative protocols or vault constructions. Public evidence is therefore sufficient to support “real customer adoption with multiple expansion vectors,” but not sufficient to dismiss partner concentration or retention risk. That asymmetry is central to the customer chapter: Morpho appears to benefit from partner breadth, yet still may have limited control
    over demand quality, pricing power, or how prominently its products are surfaced inside third-party apps. Public disclosure still trails usage.'
  claimRefs:
