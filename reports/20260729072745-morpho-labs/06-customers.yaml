- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Driver
  - Upside
  - Risk
  - Investor read
  rows:
  - - Large distribution partners
    - Rapid access to millions of users without direct retail CAC
    - A few interfaces may control most end demand
    - Attractive if partner set stays diversified.
  - - Curator ecosystem
    - More vaults and use cases can unlock new asset classes
    - Curators may capture economics or create dependency
    - Need curator concentration data.
  - - Geographic spread
    - LATAM, Europe, U.S., and global wallet channels widen reach
    - Regulatory fragmentation may constrain rollout
    - Distribution breadth is a hedge, not a cure.
  - - Asset expansion
    - BTC-, stablecoin-, and RWA-adjacent flows broaden relevance
    - Liquidity shocks or collateral issues can impair adoption
    - Expansion should be evaluated asset by asset.
  - - Embedded UX
    - Simplified onchain access can drive mainstream use
    - End users may not know Morpho and can churn with the wrapper
    - Brand power sits mostly with partners.
  notes: Morpho’s GTM advantage is embedded distribution, but embedded distribution also concentrates bargaining power outside Morpho.
  claimRefs:
  - CU030
  - CU031
  - CU032
  - CU033
  - CU034
  - CU035
- id: TU006
  title: Partner operating model table
  columns:
  - Channel
  - What partner controls
  - What Morpho controls
  - Implication
  rows:
  - - Exchange wrapper
    - Onboarding, merchandising, wallet/account UX
    - Underlying credit rails and vault access
    - High distribution upside but weaker brand ownership for Morpho.
  - - Wallet earn tab
    - Self-custody UX, asset menu, chain exposure
    - Yield source and vault infrastructure
    - Good fit for sticky usage, but wallet can reroute to alternatives.
  - - Treasury / institutional shell
    - Governance, approval workflows, reporting surface
    - Protocol markets and vault framework
    - Institutional readiness depends on both parties, not Morpho alone.
  - - Curator-led vault
    - Risk selection, allocations, fee policy
    - Core market infrastructure
    - Curator quality can accelerate or damage end-customer trust.
  - - Direct protocol app
    - More of the user relationship stays with Morpho
    - Core rails plus some interface ownership
    - Potentially better control, but smaller built-in audience.
  notes: This operating-model lens clarifies why adoption can scale while pricing power and customer ownership remain partially externalized.
