evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial-gaps
    missingEvidence: >-
      Audited GAAP financial statements, detailed gross margin breakdown, net revenue retention (NRR), and exact cash
      burn.
    whyItMatters: >-
      Without audited gross-to-net financial reporting, Garner Health's $200M ARR claim and $2.74B valuation cannot be
      reconciled to sustainable unit economics.
    diligencePath: >-
      Request audited 2024-2026 financial statements, TTM income statements, and customer cohort retention schedules
      under NDA.
    relatedQuestionRefs:
      - QO009
  - type: enumeration-incomplete
    severity: minor
    topic: governance
    missingEvidence: >-
      Complete executive leadership roster, equity ownership breakdown, and board committee structures beyond disclosed
      directors.
    whyItMatters: >-
      Complete assessment of organizational depth and key-person risk requires visibility into the full vice president
      and departmental leadership tier.
    diligencePath: Review internal organizational charts, management incentive plans, and corporate registry filings in New York.
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: investors
    missingEvidence: >-
      Comprehensive cap table detailing share classes, liquidation preferences, option pools, and secondary tender
      participation terms.
    whyItMatters: >-
      Series E preferred terms and senior liquidation preferences could materially dilute common shareholders and affect
      employee equity value.
    diligencePath: >-
      Inspect certificate of incorporation amendments, series preference cascades, and capitalization schedules in
      diligence dataroom.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: >-
      An independent estimate of U.S. care-navigation category spend, eligible employer and payer counts, and a
      definition narrow enough to calculate Garner's TAM, SAM, SOM, and penetration.
    whyItMatters: >-
      Company reach and gross ARR demonstrate scale but cannot establish market share, remaining runway, or a valuation
      multiple against a clearly bounded market.
    diligencePath: >-
      Obtain a current independent benefits-market dataset with vendor-category definitions, buyer counts, category
      spend, and a bridge from employer medical spend to navigation fees.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: roi-validation
    missingEvidence: >-
      Independently audited matched-cohort savings, engagement denominators, fees, incentive payouts, retention, and
      renewal results across multiple customer cohorts.
    whyItMatters: >-
      The 12% savings and engagement metrics are company claims, and valuation sensitivity depends on repeatable net
      savings after fees and incentives rather than gross program activity.
    diligencePath: >-
      Request cohort-level actuarial studies, contract definitions, customer references, and renewal analyses that
      reconcile gross claims, fees, incentives, case mix, and trend assumptions.
    relatedQuestionRefs:
      - QM009
  - type: conflicting-data
    severity: minor
    topic: methodology-disclosure
    missingEvidence: >-
      A dated methodology change log reconciling the February 2026 reference to 700 ranking metrics with current
      disclosures of 550-plus metrics across more than 80 specialties.
    whyItMatters: >-
      Metric-count changes may reflect different definitions or product evolution, but public materials do not explain
      the basis well enough to compare coverage over time.
    diligencePath: >-
      Request versioned methodology documentation defining metrics, specialty coverage, exclusions, validation, and
      change control.
    relatedQuestionRefs:
      - QM007
  - type: missing-source
    severity: material
    topic: competitor-win-rates
    missingEvidence: >-
      Audited head-to-head win-loss data and displacement rates between Garner, Accolade, Included Health, and
      carrier-native navigation tools.
    whyItMatters: >-
      Without objective RFP win/loss metrics, durability against bundled carrier alternatives cannot be independently
      quantified.
    diligencePath: >-
      Request broker consultant evaluation scorecards and customer RFP selection post-mortems from recent mid-market and
      enterprise renewals.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: minor
    topic: guarantee-payout-history
    missingEvidence: Historical data on Garner fee clawbacks or penalty payouts under its 100% to 300% performance guarantee contracts.
    whyItMatters: >-
      Verifying whether Garner has ever missed savings targets and refunded PEPM fees determines true financial exposure
      and underwriting risk.
    diligencePath: >-
      Review historical annual customer reconciliation statements and reserve allocations for performance guarantee
      shortfalls.
    relatedQuestionRefs: []
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: underwriting-gaps
    missingEvidence: >-
      Audited financial statements detailing gross GAAP revenue, net revenue retention (NRR), customer acquisition cost
      (CAC), and exact gross margin.
    whyItMatters: >-
      Without audited gross margins and customer cohort retention data, investors cannot verify the true software
      profitability versus administrative and incentive delivery costs.
    diligencePath: >-
      Request audited financial statements, historical GAAP revenue bridge, cohort retention analysis, and detailed COGS
      schedule during late-stage underwriting.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: pricing-guarantees
    missingEvidence: >-
      Actuarial reconciliation of historical performance guarantee payouts and reserve accounting across Garner's client
      base.
    whyItMatters: >-
      Guarantees of up to 300% of PEPM fees create substantial contingent liabilities if claims savings fail to achieve
      the contractual net trend targets.
    diligencePath: >-
      Request historical guarantee claim records, audit trail of fees returned to clients, and third-party actuarial
      methodology reports.
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: provider-ranking-auditability
    missingEvidence: >-
      Access to Garner's internal provider evaluation rubrics, statistical risk-adjustment validation studies, and
      physician appeal mechanisms.
    whyItMatters: >-
      Without independent auditing or transparent provider dispute mechanisms, physicians and health systems cannot
      contest potentially erroneous quality scores or network designations.
    diligencePath: >-
      Request Garner's clinical methodology white papers, peer-reviewed validation studies, and standard operating
      procedures for handling physician inquiries or directory corrections.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE001
  - type: missing-source
    severity: minor
    topic: app-reliability-and-reimbursement-friction
    missingEvidence: Detailed system reliability logs, mobile crash telemetry, and first-pass reimbursement adjudication error rates.
    whyItMatters: >-
      User review complaints regarding app login loops and reimbursement eligibility confusion indicate potential
      friction in user activation and HRA processing.
    diligencePath: >-
      Review vendor customer support SLA reports, mobile crash statistics, and average claims reimbursement turnaround
      time metrics.
    relatedQuestionRefs:
      - QE008
    relatedTableRefs:
      - TE002
  - type: private-evidence-only
    severity: material
    topic: retention-and-concentration
    missingEvidence: >-
      Customer-level NRR, GRR, logo churn, renewal rates, contract duration, cohort retention, top-customer revenue
      share, and broker or channel concentration.
    whyItMatters: >-
      Reach and engagement do not establish durable recurring revenue, renewal quality, or resilience to the loss of a
      large customer or distribution partner.
    diligencePath: >-
      Request a quarterly customer cohort file for the last three years, reconcile it to billed revenue, and review the
      top 20 customers and channels by ARR, renewal date, gross retention, and expansion.
    relatedQuestionRefs:
      - QU004
  - type: enumeration-incomplete
    severity: material
    topic: named-customers
    missingEvidence: >-
      Deployment dates, eligible populations, production status, utilization, measured outcomes, and renewal status for
      named customer references.
    whyItMatters: >-
      Company-issued names establish relationship existence but do not prove scaled production use, customer-level ROI,
      or durability.
    diligencePath: >-
      Obtain three reference calls selected from the full customer list, including one recent implementation, one
      renewal, and one underperforming cohort, with claims-based outcome readouts.
    relatedQuestionRefs:
      - QU003
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: customer-metric-validation
    missingEvidence: >-
      Independent validation of the nearly 800-organization count, 2.5 million member reach, 46% engagement, 12%
      savings, and 80% out-of-pocket reduction using disclosed cohorts and definitions.
    whyItMatters: >-
      The principal scale and outcome evidence is company-issued or repeated from company disclosures, limiting
      confidence in comparability and representativeness.
    diligencePath: >-
      Review customer contracts, eligibility and utilization extracts, third-party actuarial studies, and
      customer-specific claims analyses with clear baselines, fees, incentives, and confidence intervals.
    relatedQuestionRefs:
      - QU002
      - QU008
  - type: private-evidence-only
    severity: material
    topic: contract-durability-and-thesis-breaks
    missingEvidence: Audited multi-year employer retention cohorts, logo churn statistics, and downside guarantee payout history.
    whyItMatters: >-
      Without historical fee refund data or contract renewal rates, the underwriting risk of Garner's 300% fee guarantee
      model cannot be independently quantified.
    diligencePath: >-
      Review Garner's actuarial risk reserves, underwriting loss ratios, and client contract renewal exhibits during
      management diligence.
    relatedQuestionRefs:
      - QR009
    relatedTableRefs:
      - TR002
  - type: missing-source
    severity: material
    topic: claims-data-feed-continuity
    missingEvidence: >-
      Contractual agreements between self-insured employers, TPAs, and Garner governing proprietary claims feed
      continuity.
    whyItMatters: >-
      If national health plans restrict claims file exports or impose prohibitive fees, Garner's analytics pipeline
      could face operational disruption.
    diligencePath: >-
      Inspect standard business associate agreements (BAAs) and third-party administrator data sharing contracts across
      top client accounts.
    relatedQuestionRefs:
      - QR005
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited gross-to-net revenue bridge, gross margin, operating cash burn, guarantee accruals, and historical
      guarantee payouts.
    whyItMatters: >-
      These inputs determine whether gross ARR converts into durable retained economics and whether performance
      guarantees create material cash exposure.
    diligencePath: >-
      Review audited statements, revenue-recognition policy, incentive pass-through accounting, and guarantee-payment
      history by customer cohort.
    relatedQuestionRefs:
      - QV007
      - QV009
  - type: private-evidence-only
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Fully diluted cap table, liquidation preferences, anti-dilution rights, employee tender price, participation, and
      secondary-versus-primary allocation.
    whyItMatters: >-
      Headline valuation does not reveal new-money economics, dilution, preference overhang, or proceeds available to
      fund operations.
