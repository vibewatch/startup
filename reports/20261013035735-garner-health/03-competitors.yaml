callouts:
  - calloutType: "insight"
    title: "The Financial Incentive Wedge"
    body: "Garner's key architectural advantage over legacy care navigation platforms is the alignment of patient self-interest through HRA deductible coverage. Where traditional navigation platforms rely on passive employee education, Garner eliminates financial friction to steer volume to high-quality providers."
    claimRefs:
      - "CP002"
      - "CP003"
  - calloutType: "risk"
    title: "Distribution Dependency and Incumbent Response"
    body: "Because Garner operates as a non-disruptive overlay atop existing medical carriers, it remains vulnerable to carrier pushback, directory restrictions, or native carrier feature parity. Maintaining broker mindshare and demonstrated net trend reduction is vital to defend against bundled carrier alternatives."
    claimRefs:
      - "CP001"
      - "CP009"
      - "CP012"
