  topStrengths:
    - 商业规模清晰：雇主客户接近 800 家，会员达到 2.5 million。
    - 差异化的叠加式模式无需替换现有健康险网络，也有望改善患者对医疗服务提供方的选择引导。
    - 融资渠道稳健，加上一线创投支持，能为持续扩张提供支撑。
  topRisks:
    - 毛收入到净收入的桥接、利润率、留存率和资产负债表负债仍未披露。
    - 按公司披露的毛 ARR 计算，表面估值已隐含偏高的倍数。
    - 客户和会员指标仍主要来自公司自报，独立验证有限。
  unresolvedGaps:
    - 精确的毛收入到净收入桥接、经审计的利润率画像和现金消耗。
    - 资本表优先股堆叠、要约收购机制，以及表面估值是否能清晰对应新资金的经济权益。
    - 留存率、群组表现、NRR/GRR、客户 logo 流失，以及客户或经纪人集中度。
    - 医疗服务提供方排名、目录准确性、申诉和 AI 辅助工作流的模型治理证据。
    - 经核实的员工人数，以及客户、雇主、合作伙伴和其他交易对手之间更清晰的划分。
