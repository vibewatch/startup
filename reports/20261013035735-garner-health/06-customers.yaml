      - [Employer healthcare-spend reduction, "Average 12%", "First year; reiterated 2026-05-28", Garner, Medium, "Baseline, fees, incentives, customer distribution, and independent validation"]
    notes: "All operating metrics originate with Garner; independent coverage repeats rather than audits the figures. Values retain the source periods and should not be treated as cohort-comparable."
    claimRefs: [CU004, CU008, CU009, CU011]
