      - [Health plans, Health-plan product and underwriting teams, Plan members, Add navigation and steerage to existing plans and networks, "Garner markets fully insured, self-funded, and level-funded compatibility", "Number of live plan clients and plan-level renewal evidence are undisclosed"]
      - [Health systems and provider organizations, Provider or system leadership, Referral teams and clinicians, Provider-quality analytics and specialist referral support, "Company names Mercy, Atlantic Health, Teladoc, and Marathon Health as partners", "Commercial scope, deployment status, and contribution to customer count are unclear"]
      - [Brokers and benefits marketplaces, Broker and HR teams, Employer prospects and employees, "Distribution, education, and benefit packaging", "Brite lists Garner as a high-ROI add-on for 700+ employers", "Channel-sourced bookings and broker concentration are undisclosed"]
