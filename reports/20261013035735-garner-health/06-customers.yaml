figures:
  - id: FU001
    title: Customer journey and expansion surfaces
    type: journey-map
    summary: Garner connects employer or health-plan sponsorship to member steerage, reimbursement, reporting, and potential renewal or channel expansion.
    data:
      items:
        - label: Sponsor
          detail: Employer or health plan selects Garner as a navigation and incentive layer over existing coverage.
          touchpoints: [Benefits evaluation, Plan-design selection, Savings-target negotiation]
        - label: Eligibility
          detail: The program is made available through an employer-sponsored health plan without a carrier or network switch.
          touchpoints: [Eligibility setup, Employee communication, App access]
        - label: Search and support
          detail: Members use the app or Concierge to find ranked in-network providers.
          touchpoints: [Provider search, Concierge, Appointment support]
        - label: Selection
          detail: Financial incentives encourage members to add and visit a Garner Top Provider.
          touchpoints: [Care Team, Provider verification, Incentive design]
        - label: Care and reimbursement
          detail: Qualifying out-of-pocket costs are reimbursed under the employer's configured benefit rules.
          touchpoints: [Visit, Claim, Reimbursement]
        - label: Reporting and expansion
          detail: Engagement and estimated savings reporting inform renewal, richer incentive design, and expansion through plans or partners.
          touchpoints: [Engagement reporting, Savings target, Renewal decision]
    approximationNotes: "Conceptual operating journey based on retained public descriptions; it does not imply observed conversion rates between stages."
    claimRefs: [CU001, CU003, CU014]
