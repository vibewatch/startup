company:
  name: Garner Health
chapter:
  number: 6
  title: Customers
  summary: Garner reports nearly 800 customer and partner relationships reaching 2.5 million members, with a 46% eligible-member engagement rate and named employer references. The evidence supports broad employer and health-plan applicability, but most scale and outcome metrics remain company-reported, while retention, renewal, concentration, and deployment-level outcomes are not publicly disclosed.
sections:
  - id: customer-architecture
    title: A multi-sided buyer, user, and channel structure
    body: >-
      Garner is sold primarily as an employer-sponsored benefit: employers fund the program, employees and dependents use the app and Concierge, and existing carriers and provider networks remain in place. The company also markets directly to health plans, which can add Garner to existing products to lower claims costs and improve renewal competitiveness, and to providers that may use its analytics and referral tools. This produces a multi-sided customer architecture rather than a single logo count. A benefits-marketplace listing adds a broker and HR distribution surface, describing Garner as an add-on for employers ranging from 50-life groups to Fortune 50 companies. The breadth is strategically useful, but the public count combines customers, clients, and partners, so it cannot be interpreted as a clean employer-logo denominator.
    claimRefs: [CU001, CU002, CU003, CU007]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-and-economic-proof
    title: Scale is visible, but adoption evidence is vendor-led
    body: >-
      The freshest public scale evidence is directionally consistent across Garner's May 2026 announcement and independent coverage: nearly 800 organizations and 2.5 million members. Garner further reports that 46% of eligible members use the platform, that the share of employees seeing top-performing providers nearly doubles from 23% to 43% in the first year for its first-dollar HSA model, and that employers average a 12% first-year reduction in healthcare spend. Those figures suggest meaningful activation beyond passive eligibility and a plausible land-and-expand story through richer incentive design. They are not independently audited in the retained evidence, however, and the sources do not disclose the eligible-member denominator by customer, cohort construction, implementation vintage, or distribution of outcomes.
    claimRefs: [CU004, CU008, CU009, CU010, CU011]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named references establish relevance, not deployment durability
    body: >-
      Garner's company-issued financing release names USA Today, Paylocity, the University of Oklahoma, and ADM. ADM's benefits executive describes Garner as helping employees connect to eligible high-quality providers, which is stronger evidence than an unexplained logo, but the release does not disclose deployment dates, eligible populations, utilization, savings, renewal status, or whether each relationship is in full production. The named set spans media, benefits software, higher education, and a large global employer, supporting horizontal employer relevance. It does not establish representative outcomes across the reported customer base. The table therefore treats the list as a partial, press-release-derived sample and avoids assigning unreported results or production status.
    claimRefs: [CU005, CU006]
    tableRefs: [TU003]
  - id: durability-and-friction
    title: Retention and concentration remain the decisive diligence gaps
    body: >-
      Public evidence does not disclose NRR, GRR, logo churn, contract length, renewal rates, cohort retention, broker concentration, or revenue concentration by customer or channel. Garner says its PEPM fee includes administration and incentive payouts, is tied to an agreed savings target, and places up to 300% of fees at risk for groups with 500 to 5,000 enrolled and up to 100% for larger groups. That alignment may support renewals, but it is not retention evidence. Friction also remains visible: Garner tells members to verify network status before service, while an independent procurement synthesis reports recurring concerns about provider availability, reimbursement eligibility confusion, rankings that conflict with local reputation, and app login or account-setup failures. These issues should be tested against customer cohorts because they can suppress engagement and weaken savings realization.
    claimRefs: [CU012, CU013, CU014]
callouts:
  - calloutType: risk
    title: Scale claims do not resolve customer durability
    body: Garner's public customer and member counts are credible indicators of reach, but the retained evidence provides no renewal, churn, cohort, or concentration data and identifies member-access friction that could impair utilization.
    claimRefs: [CU004, CU012, CU013]
