  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention-and-concentration
      missingEvidence: Customer-level NRR, GRR, logo churn, renewal rates, contract duration, cohort retention, top-customer revenue share, and broker or channel concentration.
      whyItMatters: Reach and engagement do not establish durable recurring revenue, renewal quality, or resilience to the loss of a large customer or distribution partner.
      diligencePath: Request a quarterly customer cohort file for the last three years, reconcile it to billed revenue, and review the top 20 customers and channels by ARR, renewal date, gross retention, and expansion.
      relatedQuestionRefs: [QU004]
    - type: enumeration-incomplete
      severity: material
      topic: named-customers
      missingEvidence: Deployment dates, eligible populations, production status, utilization, measured outcomes, and renewal status for named customer references.
      whyItMatters: Company-issued names establish relationship existence but do not prove scaled production use, customer-level ROI, or durability.
      diligencePath: Obtain three reference calls selected from the full customer list, including one recent implementation, one renewal, and one underperforming cohort, with claims-based outcome readouts.
      relatedQuestionRefs: [QU003]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: customer-metric-validation
      missingEvidence: Independent validation of the nearly 800-organization count, 2.5 million member reach, 46% engagement, 12% savings, and 80% out-of-pocket reduction using disclosed cohorts and definitions.
