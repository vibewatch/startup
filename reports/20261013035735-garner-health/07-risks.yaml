callouts:
  - calloutType: "risk"
    title: "Downside Fee Guarantees Create Balance-Sheet Exposure"
    body: "Garner offers fee guarantees backing its net trend targets by up to 300% of collected fees for mid-market employer groups with 500 to 5,000 enrolled members. While this structure aligns vendor incentives with employer savings, it concentrates underwriting risk on Garner's balance sheet if steerage fails to offset incentive payouts during adverse utilization cycles."
    claimRefs:
      - "CR013"
      - "CR014"
  - calloutType: "risk"
    title: "Competitive Squeeze from Consolidated Navigation Incumbents"
    body: "As legacy navigation vendors like Transcarent, Accolade, and Included Health bundle clinical advocacy with virtual primary care and surgery centers, Garner faces competitive pressure to prove that an algorithm-and-incentive overlay can defend long-term contract renewals against comprehensive benefits platforms."
    claimRefs:
      - "CR011"
      - "CR012"
