      - number: '4.2'
        title: 上市经济性、渠道分销与成本结构驱动因素
        blocks:
          - type: paragraph
            body: >-
              Garner 的上市主要依赖员工福利顾问、保险经纪商和商业健康计划分销渠道，而非昂贵的直面消费者销售引擎。经纪商把 Garner 定位为无需扰动网络或更换承保方的管理附加服务，使覆盖 50-life 小型团体至
              Fortune 50 企业的雇主能够在标准 60 天实施周期内部署福利。经纪商薪酬直接纳入 PEPM 费用结构，对雇主不会形成显眼的单项附加费，从而强化渠道协同。Garner 的服务交付结构与纯 SaaS
              企业明显不同：运营支出包括持续摄取和清洗 60 billion 条医疗记录、结合机器学习与电话呼叫中心确认的自然语言目录核验流程（维持 92%
              的目录准确率），以及协助会员预约和处理自付报销申请的礼宾导航团队。此外，Garner 还必须管理与 WEX、Optum 和 HealthEquity
              等管理机构合作的补充健康报销安排（HRA）和首美元健康储蓄账户（HSA）资金的营运资金节奏；报销支出是持续的现金流流出，与订阅计费周期不同。
