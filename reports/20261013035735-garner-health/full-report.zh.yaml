  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              相关市场是连接福利管理与医疗服务的、面向员工的指导层，涵盖医生搜索、福利指引、护理协调、理赔或账单支持，以及影响会员就医选择的激励。它不包括直接临床服务、特定疾病治疗项目，也不包括承保方内部的利用管理职能，即便这些产品也提供导航功能。Garner
              更窄的切入口是医生引导：产品叠加在雇主现有计划和网络之上，并针对选定医生附带雇主出资的报销机制。因此，保险公司目录、承保方病例管理项目、单点方案和虚拟医疗服务商属于相邻替代方案，而不是一个同质化的竞争集合。随着供应商越来越多地把导航与临床服务或特定疾病服务打包，品类边界仍在变化。
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              现有资料无法提供可信的美国年度医疗导航支出、符合条件的雇主数量或 Garner 专属可服务市场的独立估算，因此不能支持传统 TAM/SAM/SOM 或市场份额百分比。可用的规模证据是公司自身规模：Fierce
              Healthcare 在 2026 年 2 月报道 700 家组织和 2.5 million 名会员；Garner 2026 年 5 月的发布则称近 800 家客户、超过 2.5 million 人，以及约
              $200 million 的总 ARR。这些标签和日期必须分开看待。组织不一定等于客户，触达人数也不是买方分母，总 ARR 既不是市场收入，也不是现金。证据支持增长势头和商业覆盖面的下限，而非整个市场的价值。
