            title: 表外理赔资金与绩效保证造成隐藏的投资判断波动
            body: >-
              采购分析指出，HRA 报销的理赔资金是持续的现金流负债，与软件 PEPM 费用不同。此外，激进的绩效保证要求中型团体针对净趋势目标承担最高相当于费用 300%
              的承诺；如果患者引导或与第三方承保方的理赔数据整合失灵，供应商毛利率就会暴露在显著波动之下。
