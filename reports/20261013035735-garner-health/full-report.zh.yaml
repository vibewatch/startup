        title: 图表与展品
        blocks:
          - type: callout
            title: 财务激励切入口
            body: Garner 相比传统护理导航平台的关键架构优势，是通过 HRA 免赔额覆盖让患者自身利益与引导目标一致。传统导航平台依赖被动的员工教育，而 Garner 消除了财务摩擦，把就诊量引向高质量医生。
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
          - type: callout
            title: 分销依赖与在位者回应
            body: Garner 作为叠加在现有医疗承保方之上的非扰动式方案，仍容易受到承保方反制、目录限制或原生功能追平的影响。要抵御承保方打包替代方案，必须守住经纪商心智份额，并证明净趋势下降。
            calloutType: risk
            claimRefs:
