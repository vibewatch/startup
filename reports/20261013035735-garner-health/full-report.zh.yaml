  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价架构与合同机制
        blocks:
          - type: paragraph
            body: >-
              Garner Health 主要通过直接向雇主计划发起方收取按员工按月（PEPM）订阅费，将数字护理导航平台变现。不同于分别收取导航软件、临床倡导呼叫中心和第三方管理费的传统医疗导航平台，Garner
              将平台访问、礼宾支持、经纪商佣金和会员激励支付打包为一项合同费用。作为交换，Garner 承诺合同净趋势目标，并用自有资产负债表为节省目标兜底：对于 500 至 5,000 名在册员工的中型雇主团体，Garner
              针对约定的理赔成本降低目标提供最高相当于费用 300% 的保证；在册会员超过 5,000 人的团体则获得最高相当于费用 100%
              的保证。超过约定目标的全部额外节省返还给计划发起方，形成结构化的风险分担区间，把会员引导风险转移给供应商。Garner
              不发布现成的公开价目表，而是根据每个雇主的精算风险画像定制定价；福利采购谈判的公开会议纪要则列出约 $5 PEPM 的示例报价。这套架构的财务关键，在于 Garner
              无需改变底层承保方网络或重新申报计划，就能持续引导会员，从而让自保和全额保险雇主立即获得医疗趋势下降。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
