  - id: FI001
    title: Garner Health 收入与现金流转化周期
    type: flow
    summary: 展示雇主签约和会员医疗决策如何转化为供应商收入及理赔成本下降的运营与财务流程。
    data:
      nodes:
        - id: employer-contract
          label: 1. 雇主合同与 PEPM 计费
          description: 雇主按捆绑 PEPM 费用结构签约，费用覆盖软件、礼宾导航、经纪商佣金和激励额度。
        - id: data-ingestion
          label: 2. 理赔摄取与目录评分
          description: 平台摄取 60B+ 条理赔记录，根据 550+ 项临床指标为网络内医生评分，并核实 92% 的目录准确率。
        - id: member-navigation
          label: 3. 会员搜索与头部医生引导
          description: 46% 的符合条件会员通过移动应用或礼宾服务参与，从 80+ 个医疗专科中选择经验证的 Top Providers。
        - id: care-delivery
          label: 4. 临床护理交付与质量结果
          description: 患者接受循证护理，并实现并发症 / 死亡率降低 75% 以及不必要手术减少。
        - id: incentive-payout
          label: 5. HRA / HSA 激励管理
          description: Garner 通过补充 HRA 或首美元 HSA 资金报销会员自付费用（患者平均节省 80%）。
        - id: net-savings-realization
          label: 6. 雇主节省与趋势核对
          description: 雇主实现医疗总支出平均下降 12%，验证净趋势目标并释放留存的供应商费用。
      edges:
        - from: employer-contract
          to: data-ingestion
          label: 招募人群
        - from: data-ingestion
          to: member-navigation
          label: 呈现头部医生
        - from: member-navigation
          to: care-delivery
          label: 引导预约
        - from: care-delivery
          to: incentive-payout
          label: 生成合资格理赔
        - from: incentive-payout
          to: net-savings-realization
          label: 交付成本节省
    claimRefs:
      - CI001
      - CI002
      - CI005
      - CI009
      - CI011
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 六层架构栈驱动 Garner Health，从原始医疗理赔摄取一直延伸到会员和企业参与界面。
    data:
      layers:
        - label: 第 1 层：外部医疗数据摄取
          detail: 摄取来自 320M 名患者的 60B+ 条去标识化商业、Medicare 和 Medicaid 理赔，以及医院和付款方价格透明度数据集。
        - label: 第 2 层：数据标准化与风险调整
          detail: 标准化患者纵向病史，排除波动较大的高复杂度离群值，并针对患者合并症和人口统计因素进行风险调整。
        - label: 第 3 层：临床质量与 Research Agent 引擎
          detail: 在 80+ 个临床领域应用 550+ 项专科指标，Garner Research Agent 持续扫描医学文献以寻找更新后的指南。
        - label: 第 4 层：医生评分与目录服务
          detail: 计算 Top Provider 排名（前 20% 层级），维护准确率为 92% 的全国医生联系、机构和预约可用性目录。
        - label: 第 5 层：激励与 HRA 账户规则引擎
          detail: 配置雇主专属福利设计，执行符合 IRS 要求的首美元 HSA/HRA 规则，并自动判断会员自付费用报销资格。
        - label: 第 6 层：参与和企业 API 接口
          detail: >-
            通过 api.getgarner.com 提供面向会员的移动应用和 Garner Assistant，以及合作伙伴 REST API（Facilities、Professionals、Provider
            Annotations）。
    approximationNotes: 架构层综合自公司技术概览、APIs.io 合同和 Series E 基础设施披露；专有后端托管细节仍属私有信息。
    claimRefs:
      - CE002
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
  - id: FU001
    title: 客户旅程与扩张触点
    type: journey-map
    summary: Garner 将雇主或健康计划赞助连接到会员引导、报销、报告，以及潜在续约或渠道扩张。
    data:
      items:
        - label: 赞助方
          detail: 雇主或健康计划选择 Garner，在现有保障之上叠加导航和激励层。
          touchpoints:
            - 福利评估
            - 计划设计选择
            - 节省目标谈判
        - label: 资格
          detail: 该计划通过雇主赞助的健康计划提供，不更换承运人或医疗网络。
          touchpoints:
            - 资格设置
            - 员工沟通
            - 应用访问
        - label: 搜索与支持
          detail: 会员使用应用或 Concierge 查找排名靠前的网络内医生。
          touchpoints:
            - 医生搜索
            - Concierge
            - 预约支持
        - label: 选择
          detail: 财务激励鼓励会员添加并就诊于 Garner Top Provider。
          touchpoints:
            - 护理团队
            - 医生验证
            - 激励设计
        - label: 护理与报销
          detail: 符合条件的自付费用按雇主配置的福利规则报销。
          touchpoints:
            - 就诊
            - 理赔
            - 报销
        - label: 报告与扩张
          detail: 参与度和预计节省报告为续约、更丰富的激励设计，以及通过计划或合作伙伴扩张提供依据。
          touchpoints:
            - 参与度报告
            - 节省目标
            - 续约决定
    approximationNotes: 基于留存公开描述的概念性运营旅程；不代表已观测到各阶段之间的转化率。
    claimRefs:
      - CU001
      - CU003
      - CU014
