      - number: '5.4'
        title: 部署、集成界面、合规与尽调风险
        blocks:
          - type: paragraph
            body: >-
              Garner Health 的主要运营优势之一，是不扰动现有体系的部署模式。平台作为软件和 HRA
              叠加层，直接整合到自保、全额保险和定额融资安排的现有雇主福利包中。实施无需重新设计网络、无需更换承保方，也无需向州保险监管机构重新申报医疗计划。为遵守国税局规定并处理税收优惠账户，Garner 与
              WEX、Optum 和 HealthEquity 等主要托管机构合作支持首美元 HSA 模式，确保雇主出资不影响会员 HSA 资格，同时奖励使用 Top Provider。从信任和安全角度看，Garner 维持
              SOC 2 Type II 认证，并通过去标识化流程处理理赔数据，以按照 HIPAA 标准保护受保护健康信息。

              尽管具备这些技术优势，尽调仍发现第三方评价和用户反馈反映出的运营摩擦。会员报告移动应用间歇性登录循环；在手术过程中就诊于未排名的辅助医生时，会员也会困惑于 HRA 报销资格；在人口密度较低的地区，Top
              Provider 的可用性受限。此外，由于医生评分依赖滚动的多月理赔历史，医生质量评级的更新会滞后于实时临床实践变化。
