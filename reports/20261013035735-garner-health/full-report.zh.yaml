chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 执行摘要与公司身份
        blocks:
          - type: paragraph
            body: >-
              Garner Health 于 2019 年由首席执行官 Nick Reber 在纽约市创立，目标是通过引导患者选择网络内高绩效医生，改造医疗服务的经济模式。Garner
              没有搭建受限的窄网络健康计划或自有临床服务中心，而是作为叠加福利运行在现有商业医疗保险计划之上。公司把面向会员的移动应用和礼宾式导航服务，与雇主出资的健康报销安排（HRA）结合起来；员工选择指定的 Top
              Providers 后，挂号费、影像检查和手术费用等医疗自付支出可被免除。

              平台的医生引导机制由自有的大型理赔评估引擎驱动。Garner 称其数据库收录了超过 60 billion 条医疗理赔记录，覆盖 320 million 次患者就医历程，约占全国全部理赔的 75
              percent。公司在 80 个医生专科中应用超过 550 项临床质量和效率指标，从诊断准确性、遵循循证医疗指南和避免并发症等维度对医生排名。截至 2026 年末，公司服务近 800 家雇主客户，客户范围从
              50-life 的中型市场团体到 Fortune 50 企业，并拥有企业健康计划合作伙伴和经纪商分销渠道。
            claimRefs:
