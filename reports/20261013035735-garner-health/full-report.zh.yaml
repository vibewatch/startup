      - number: '5.3'
        title: 技术架构、质量评分引擎与 AI 基础设施
        blocks:
          - type: paragraph
            body: >-
              Garner 的底层技术架构以自有理赔数据仓库为核心，包含超过 60 billion 条去标识化医疗记录，覆盖全国 320 million 个纵向患者档案。该仓库整合商业保险理赔、Medicare 和
              Medicaid 记录，以及医院价格透明度数据，估计覆盖美国全部医疗理赔的 75%。为客观评估医生表现，Garner 用超过 550
              项专科临床质量和成本效率指标衡量每位医生。评分流程首先滤除无法进行统计风险调整的极端临床复杂病例，再根据患者合并症、病史和人口统计因素对剩余病例进行标准化。为使临床评分跟上医学科学演进，Garner 部署
              Garner Research Agent 这一 AI 引擎，系统解析同行评审医学期刊，把新发布的临床实践指南转换为算法评分参数。在用户侧，新推出的 Garner Assistant
              作为对话式入口，帮助会员解决福利问题并导航护理路径。端到端架构以异步六层堆栈运行，覆盖数据摄取、标准化、算法化指南解析、Top Provider 目录评级、HRA 财务裁决和多渠道客户端应用。
