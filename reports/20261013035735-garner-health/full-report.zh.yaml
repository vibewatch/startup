      - number: '1.3'
        title: 资本结构、投资人联合体与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              Garner Health 已筹集大量机构资本，用于支持快速商业扩张和数据平台基础设施。2026 年 5 月，公司完成由 Index Ventures 领投、投后估值 $2.74 billion 的 $100
              million Series E 融资。此前不久，公司于 2026 年 2 月宣布完成 $118 million 的 Series D。投资人联合体包括 Kleiner Perkins、Redpoint
              Ventures、Thrive Capital、Sequoia Capital、Founders Fund 和 Kaiser Permanente Ventures 等知名科技及医疗风投机构。Series E
              完成的同时，Garner 还执行了第二次员工要约收购，为资深团队成员提供二级流动性。

              尽管收入顶部增长强劲，Garner 面向潜在投资人的公开财务披露仍存在重大信息缺口。公司在 Series E 同期宣布约 $200 million 的总年度经常性收入（ARR），并声称收入连续五年同比增长
              100%+。但公司没有披露经审计的 GAAP 损益表、毛利率、获客成本或净收入留存指标。根据 Venture Capital Tracker 记录，已披露的累计股权资本约为 $218
              million；但详细的资本结构优先级、优先清算权和员工期权池规模仍属于私营公司保密数据，需要现场数据室核验。
