  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 以客户工作流定义核心平台与服务
        blocks:
          - type: paragraph
            body: >-
              Garner Health 是面向雇主的医疗导航平台和财务激励叠加层，旨在引导计划会员选择表现更好的医生，无需改变底层承保方网络或健康计划设计。客户工作流从员工或受保家属访问 Garner
              移动应用或网页门户开始，用户可在 80 多个医疗和外科专科中搜索网络内医生。平台不展示静态目录或主观患者星级，而是呈现排名靠前的 Top
              Providers——即在所在地区市场和保险网络内，临床质量及操作效率得分位于前 20% 的医生。为克服员工惯性并推动主动参与，Garner 将临床引导与雇主出资的健康报销安排（HRA）或符合 IRS
              规定的首美元 HSA 激励模式结合。会员与指定 Top Provider 完成预约或治疗后，平台报销共付额、诊断检查费和手术免赔额等符合条件的自付费用，使会员自付成本平均下降
              80%。客观临床排名与直接财务减负结合，形成清晰的行为激励；Garner 报告会员参与率达到 46%，而行业标准导航基准为 10% 至 20%。
            claimRefs:
              - CE001
              - CE003
              - CE007
              - CE011
              - CE013
              - CE014
