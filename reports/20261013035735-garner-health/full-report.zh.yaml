      - number: '1.4'
        title: 里程碑演进与运营风险画像
        blocks:
          - type: paragraph
            body: >-
              Garner Health 自 2019 年成立以来经历了不同发展阶段，从早期算法排名概念演变为规模化企业导航平台。早期里程碑集中在汇编全国医疗理赔数据和部署基础 HRA 报销架构。到 2024
              年，公司已在数百家企业雇主中建立商业牵引力，并报告平均每年降低医疗支出 12 percent。2026 年，公司同时加快资本积累和产品能力建设，连续完成 Series D 和 Series E，推出 Garner
              Assistant 导航工具，并为生育和更年期护理引入定制化专科临床路径。

              但第三方供应商评估和用户反馈也指出了具体的运营风险与摩擦点。RFP.wiki 的供应商评估记录强调，会员参与度容易受到 HRA
              理赔报销规则和申报截止时间混乱的影响；如果员工没有在移动应用中提前配置就诊医生，可能会意外承担医疗账单。用户评论还反复提到应用登录循环和新用户引导摩擦；Garner
              也没有公开可验证的服务级别协议（SLA）或正常运行时间面板。当算法指定的 Top Providers 与当地社区口碑冲突，或近期预约名额有限时，医生引导的效果也会受到定性阻力。
