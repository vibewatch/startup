      - number: '3.3'
        title: 定价模式、产品打包与切换动态
        blocks:
          - type: paragraph
            body: >-
              医疗导航的商业打包通常采取按员工按月（PEPM）收费、按节省额分成，或捆绑式平台保留费。Garner 向雇主收取 PEPM
              费用，既包含管理，也包含会员激励支付所需的资本，确保高使用率期间不会出现隐藏收费。为降低采用门槛并降低投资风险，Garner 围绕净理赔趋势目标设计绩效保证：中型雇主团体（500 至 5,000
              名参保人）的风险敞口最高为费用的 300%，大型企业最高为 100%。

              该市场的切换成本较为复杂。Garner 运行在现有医疗承保方和第三方管理机构之上，不要求更换网络或重新申报医疗计划，因此初始部署摩擦很小，通常不到 60 天。但上线后，会员对 HRA 报销流程的习惯，以及历史
              Care Team 指定，会带来明显的流程切换摩擦。雇主不愿移除直接覆盖员工免赔额的福利，因此即使 Garner 没有嵌入基础设施，运营黏性仍属中等。
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: 护城河持久性与不利竞争风险
        blocks:
          - type: paragraph
            body: >-
              尽管 Garner 的商业规模快速增长至近 800 家客户组织、$200 million 总
              ARR，其长期竞争耐久性仍面临多项战略和运营威胁。首要脆弱点是不被中介化的风险：大型健康保险承保方拥有自有理赔数据，理论上可以推出原生首美元报销账户并配套自有网络引导层，把第三方叠加方案挤出自保福利组合。不过，承保方的激励往往与激进引导不一致，而
              Garner 覆盖全国 75% 理赔的跨承保方数据集，比任何单一承保方的可见范围更广。

              运营上，Garner 面临会员摩擦和医生目录准确性的执行风险。如果员工在就医前没有在应用中添加 Top
              Provider，报销申请就会被拒绝，进而引发员工不满和管理支持负担。此外，整合度较高的大都市市场中的医疗系统，可能反对惩罚高成本专科医生的外部引导模式。Garner 试图通过与 Mercy、Atlantic
              Health 等医疗系统建立合作伙伴关系来缓解摩擦，把潜在的医生对手转化为战略转诊伙伴。
            claimRefs:
              - CP004
              - CP005
              - CP012
              - CP013
              - CP014
