companyProfile:
  summary: >-
    Garner Health 是一家总部位于纽约、面向雇主提供医疗导航的公司，由 Nick Reber 于 2019
    年创立。平台叠加在现有健康计划之上，结合医生质量分析、会员导航和雇主出资的激励账户，引导会员选择网络内表现更好的医疗服务。Garner 称其服务近 800 家雇主客户和 250 万名会员，并于 2026 年 5 月完成 $100
    million 的 Series E 融资，估值达到 $2.74 billion；但利润率、留存和股权结构经济性的公开披露仍然有限。
