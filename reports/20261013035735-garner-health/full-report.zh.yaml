      - number: '4.3'
        title: 商业规模、公开牵引力与单位经济性承销缺口
        blocks:
          - type: paragraph
            body: >-
              Garner Health 已在企业数字医疗生态中实现快速商业规模，报告总年度经常性收入（ARR）约 $200 million，并声称连续五个期间收入同比增长超过一倍。平台目前服务近 800 家雇主组织，覆盖约
              2.5 million 名在册会员，主要自保雇主客户包括 Archer-Daniels-Midland、Paylocity 和 University of Oklahoma，显示出较强的商业采用。Garner
              报告称，其个性化医生推荐和现金报销激励使符合条件的会员平均参与率达到 46%，第一年雇主医疗理赔支出平均下降 12%，选择 Top Providers 的会员自付支出平均节省
              80%。然而，从机构尽调角度看，关键单位经济指标仍完全属于未披露的私有数据：Garner 没有公布 GAAP
              净收入、经审计毛利率、净收入留存（NRR）、总收入留存（GRR）、获客成本（CAC）或平均回本周期。没有经审计的总额到净额调节表，承销方无法判断其报告的 $200M 总 ARR
              中有多少直接作为激励报销支付给会员，又有多少保留为高毛利。
            claimRefs:
              - CI007
