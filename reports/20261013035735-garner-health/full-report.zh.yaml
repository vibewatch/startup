  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与市场替代方案
        blocks:
          - type: paragraph
            body: >-
              面向员工的医疗指导和导航市场包含多个不同的供应商类别，它们共同争夺雇主福利预算。传统医疗导航方案位于福利管理和临床服务之间，试图引导会员理解保障范围、护理选择和账单问题。该领域的历史竞争者包括综合临床倡导平台
              Included Health（由 Grand Rounds 与 Doctor On Demand 合并而成）和 Accolade，后者常与 Transcarent
              等以虚拟医疗为先的护理和倡导生态结合。这些老牌玩家通常强调专属临床顾问、第二诊疗意见服务，以及覆盖复杂就医历程的综合护理协调。

              相比之下，嵌入承保方的工具和数字透明度门户由 Castlight Health（现为 Apree Health 的一部分）等方案以及 Optum、Anthem 和 Blue Cross Blue Shield
              的原生支付方应用历史性推动，主要聚焦计划透明度、价格查询和网络内医生目录。最后，单点远程医疗供应商和专业数字诊所提供直接医疗服务，却缺少长期、在地的专科质量引导。Garner Health
              通过严格作为医生分析和财务引导叠加层运行，在无需更换承保方或扰动网络的情况下，与这些替代方案形成差异化定位。
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP008
              - CP014
      - number: '3.2'
        title: 差异化与能力比较
        blocks:
          - type: paragraph
            body: >-
              Garner
              的核心差异化在于解决第一代透明度工具最主要的失效原因：会员惰性。传统的“找医生”应用提供评分或成本估算，却难以改变患者行为，因为员工通常看不懂复杂的临床质量分数，而且无论选择哪位网络内医生，都要面对相同的自付共付额或免赔额。Garner
              通过财务设计绕过这一障碍，由雇主出资建立专门的健康报销安排（HRA）或首美元 HSA 激励结构。

              会员选择由 Garner 基于 60 billion 条医疗理赔、320 million 名患者分析指定的 Top Provider 后，雇主会报销全部或大部分自付费用。通过在就医时消除患者分摊成本，Garner
              报告会员参与率超过 40%，远高于通常停留在个位数采用率的传统透明度工具。综合倡导平台能为复杂慢性病历程提供更深入的人类礼宾支持；Garner
              则专注于把就诊量导向高效率、遵循指南的医生，以快速产生可衡量的理赔节省。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
