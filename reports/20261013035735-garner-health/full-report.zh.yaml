      - number: '1.2'
        title: 领导层、治理与关键人物架构
        blocks:
          - type: paragraph
            body: >-
              Garner Health 由创始人兼首席执行官 Nick Reber 领导。Reber 处理复杂诊断和慢性背痛的个人经历，成为他在 2019 年创办公司的行动催化剂。在创办 Garner 前，他曾在
              Bridgewater Associates 担任运营和管理高管，把结构化的量化系统思维带入医疗导航。Reber 仍是公司主要的公开代表、战略设计者和文化支柱，形成了成长型创始人公司常见的较高关键人物依赖。

              公司治理把执行层领导与一流医疗和科技风险投资机构的机构监督结合起来。Index Ventures 合伙人、Series E 首席董事 Jahanvi Sardana 在该公司领投 $100 million
              Series E 融资后，继续负责董事会治理协调。包括生殖内分泌学家 Dr. Asima Ahmad 在内的临床顾问专家，支持临床质量治理以及向高成本疾病路径拓展。Garner
              已在数据平台工程和企业客户成功等部门扩大管理团队，但更广泛的副总裁梯队和执行委员会投票权，仍未对外详细披露。
            claimRefs:
              - CO001
              - CO003
              - CO006
