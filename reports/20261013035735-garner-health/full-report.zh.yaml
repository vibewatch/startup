      - number: '2.3'
        title: 买方、用户、支付方与采用路径
        blocks:
          - type: paragraph
            body: >-
              留存证据中最清晰的买方群体是自保雇主、多雇主信托，以及在现有福利基础设施上增加导航层的健康计划或支付方。员工及其家属是用户，雇主则按照适用的计划设计为 Garner HRA 或与 HSA
              关联的激励出资。由于具体采购职位和预算科目尚未披露，买方地图不擅自指定未获支持的高管负责人。经纪商、TPA、承保方、资格系统和福利管理平台都是重要的分销或实施伙伴，因为数据和工作流兼容性会影响上线和衡量。Garner
              称其按每位员工每月定价，将管理费和最高激励支付额打包进该费用，并把费用与约定节省目标挂钩；独立采购页面称具体价目表仍未公开，且按客户定制。
            claimRefs:
              - CM003
              - CM012
              - CM013
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM012
              - CM013
              - CM014
              - CM015
      - number: '2.4'
        title: 采用驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              采用取决于能否把医生差异转化为可衡量的节省，同时不迫使客户更换网络。在一篇 U.S. News 采访中，Garner CEO 称，同一城市的大多数手术中，最高四分位与最低四分位医生的并发症率相差超过
              400%，常见手术成本相差超过 300%；这些是经编辑采访传递的公司论断，并非独立基准。Garner 还声称雇主第一年平均支出减少 12%，符合条件的会员平台使用率超过
              46%。分母很关键：另一份公司声明称，寻求医疗服务的员工中使用率超过 60%，这不能与全部符合条件的会员相比。约束包括 ROI
              衡量所需的理赔数据流配合、定制定价、报销资格规则、会员更换医生的意愿，以及排名方法披露中不一致的公开指标数量。相较宽泛的市场标题，经过独立审计的队列节省和续约留存更与估值相关。
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
              - CM015
              - CM016
