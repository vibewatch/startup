  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 多边买方、用户与渠道结构
        blocks:
          - type: paragraph
            body: >-
              Garner 主要作为雇主赞助的福利出售：雇主为项目出资，员工和家属使用应用及 Concierge，现有承保方和医生网络保持不变。公司也直接面向健康计划营销，后者可以把 Garner
              加入现有产品以降低理赔成本并提升续约竞争力；医生也可能使用其分析和转诊工具。因此，客户架构是多边的，不能只看单一品牌标识数量。福利市场平台的一个列表增加了经纪商和 HR 分销界面，把 Garner 描述为从
              50-life 团体到 Fortune 50 公司都可采用的附加服务。其覆盖广度具有战略价值，但公开数量把客户、顾客和合作伙伴混在一起，不能当作干净的雇主品牌标识分母。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU007
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU014
      - number: '6.2'
        title: 规模可见，但采用证据由供应商主导
        blocks:
          - type: paragraph
            body: >-
              最新公开规模证据在 Garner 2026 年 5 月公告和独立报道之间方向一致：近 800 家组织和 2.5 million 名会员。Garner 进一步报告，46% 的符合条件会员使用平台；在首美元 HSA
              模式下，第一年使用高绩效医生的员工占比从 23% 近乎翻倍至 43%；雇主第一年医疗支出平均下降 12%。             
              这些数字显示激励设计更丰富后，激活度明显超出被动具备资格的水平，也支持一种可信的落地扩张路径。不过，留存证据中的数据没有经过独立审计，来源也没有披露各客户符合条件会员的分母、队列构成、实施年份或结果分布。
            claimRefs:
              - CU004
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
              - CU008
              - CU009
              - CU011
      - number: '6.3'
        title: 点名客户证明相关性，不证明部署耐久性
        blocks:
          - type: paragraph
            body: >-
              Garner 发布的融资公告点名 USA Today、Paylocity、University of Oklahoma 和 ADM。ADM 福利高管称 Garner
              帮助员工连接到符合条件的高质量医生，这比一个没有解释的品牌标识更有力；但公告没有披露部署日期、符合条件的人群、使用率、节省、续约状态，也没有说明每段关系是否已全面投入生产。点名客户横跨媒体、福利软件、高等教育和大型全球雇主，支持其对不同雇主的横向相关性，却不能证明报告客户群的代表性结果。因此，表格把这份名单视为部分的、源自新闻稿的样本，不为其赋予未报告的结果或生产状态。
            claimRefs:
              - CU005
              - CU006
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU006
      - number: '6.4'
        title: 留存与集中度仍是决定性尽调缺口
        blocks:
          - type: paragraph
            body: >-
              公开证据没有披露 NRR、GRR、客户 logo 流失、合同期限、续约率、队列留存、经纪商集中度，或按客户和渠道划分的收入集中度。Garner 称其 PEPM 费用包含管理和激励支付，与约定节省目标挂钩；对于
              500 至 5,000 名在册人员的团体，费用最高有 300% 的风险敞口，大型团体最高有 100%。这种对齐可能支持续约，但不是留存证据。摩擦仍然可见：Garner
              要求会员在服务前确认网络状态，而独立采购综合报告反复提到医生可用性、报销资格混乱、排名与当地口碑冲突，以及应用登录或账户设置失败。应结合客户队列验证这些问题，因为它们可能压低参与度并削弱节省兑现。
            claimRefs:
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: 图表与展品
        blocks:
          - type: callout
            title: 规模论断无法解决客户耐久性
            body: Garner 公开的客户和会员数量是可信的触达指标，但留存证据没有提供续约、流失、队列或集中度数据，并指出可能损害使用率的会员访问摩擦。
            calloutType: risk
            claimRefs:
              - CU004
              - CU012
              - CU013
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律合规风险
        blocks:
          - type: paragraph
            body: >-
              Garner Health 以雇主赞助的健康报销安排（HRA）运行，而不是保险承保方或承担风险的医疗服务商，因此不受州保险牌照和医疗承保要求约束。但这种结构使 Garner 受到
              ERISA、劳工部福利规则和国税局规定等复杂联邦监管框架的约束。由于 Garner 把引导激励与健康储蓄账户（HSA）和高免赔额健康计划（HDHP）结合，必须谨慎设计雇主出资，以按联邦规则保留员工 HSA
              的税收优惠资格，同时处理加州、新泽西等对 HSA 存款征收州所得税的司法辖区差异。此外，Garner 处理超过 60 billion 条医疗记录，覆盖 320 million
              名患者；虽然数据已去标识化，但联邦隐私解释、州数据隐私法规或医疗算法问责规则的任何变化，都可能直接影响数据摄取管道和医生评分工作流。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
      - number: '7.2'
        title: 运营可靠性、医生排名与算法风险
        blocks:
          - type: paragraph
            body: >-
              Garner 的运营执行核心在于临床评分算法和医生目录的完整性与时效性。Garner 使用基于理赔的临床质量指标，而非主观患者评价，对 80 个子专科的医生排名。但商业医疗理赔数据通常会比临床就诊滞后 60 至
              90 天，因此员工预约时，医生绩效评分或网络内参与状态可能已经过时。Garner 通过预约 API 和人工外呼核验目录细节，报告目录准确率达到
              92%；但医生状态差异或未核实的执业关系变化，可能引发会员摩擦和理赔争议。此外，Garner 最近部署的 AI 工具——例如自动解析医学文献的 Garner Research Agent，以及为会员提供导航的
              Garner Assistant——也带来了自动化决策支持风险。如果引导算法误读临床指南，或未能考虑复杂患者的风险因素，Garner 可能因排名透明度问题遭遇声誉损害或医生反制。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR007
      - number: '7.3'
        title: 交易对手依赖与竞争市场摩擦
        blocks:
          - type: paragraph
            body: >-
              Garner 是叠加在第三方医疗基础设施之上的编排层，完全依赖雇主、健康计划、福利经纪人、第三方管理机构（TPA）和 HSA 托管方。公司的市场进入模式高度依赖 Brite Benefits
              等福利市场，以及经纪分销渠道，以触达自保雇主。Garner 无需改动计划设计或网络，但接入仍要求雇主健康计划或 TPA
              持续提供资格数据，并共享理赔数据。如果大型健康计划或竞争性的导航传统厂商限制理赔数据访问，或开发自有的竞争性引导产品，Garner
              的数据接入可能受限。与此同时，医疗导航行业正经历激烈整合；Transcarent（并入 Accolade）、Quantum Health 和 Included Health
              等资本充足的传统厂商，正凭借长期企业关系和更广的临床服务组合，抵御专业分析叠加层的市场竞争。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR011
      - number: '7.4'
        title: 财务合同风险、下行担保与论点失效
        blocks:
          - type: paragraph
            body: >-
              Garner 通过按每名员工每月收取（PEPM）的管理费变现，这笔费用同时覆盖运营和会员自付激励报销。为赢得商业合同，Garner 提供与净趋势目标挂钩的绩效担保，并用自有资本为承诺兜底。对于拥有 500 至
              5,000 名参保成员的中型市场团体，担保金额最高可达已收费用的 300%，因此一旦引导率低于目标，或会员激励支出超过计划理赔节省，Garner 就会承受资产负债表下行风险。在完成 1 亿美元 Series
              E、估值 27.4 亿美元后，年度经常性收入约达 2 亿美元；要维持收入快速增长，公司还必须让近 800 家客户组织的会员参与率保持在
              46%。雇主续约率明显下滑、担保赔付过高，或监管机构审查供应商排名方法，都是需要严密监测的关键论点失效触发点。
            claimRefs:
              - CR013
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: 展示
        blocks:
          - type: callout
            title: 下行费用担保带来资产负债表敞口
            body: >-
              对拥有 500 至 5,000 名参保成员的中型雇主团体，Garner 为净趋势目标提供最高相当于已收费用 300%
              的费用担保。该结构虽让供应商激励与雇主节省额一致，但在使用率周期不利、引导效果无法抵消激励赔付时，会把承保风险集中到 Garner 的资产负债表上。
            calloutType: risk
            claimRefs:
              - CR013
              - CR014
          - type: callout
            title: 导航行业整合型 incumbent 带来的竞争挤压
            body: >-
              Transcarent、Accolade 和 Included Health 等传统导航供应商把临床协助、虚拟初级护理和手术中心打包在一起，Garner
              面临的竞争压力是：证明算法与激励叠加层能够对抗综合福利平台，守住长期合同续约。
            calloutType: risk
            claimRefs:
              - CR011
              - CR012
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 对价格敏感的建议
        blocks:
          - type: paragraph
            body: >-
              Garner 于 2026 年 5 月宣布完成 1 亿美元 Series E，估值 27.4 亿美元；Fierce Healthcare 也独立报道了相同的轮次金额和估值。以 Garner 公司披露的约 2
              亿美元毛 ARR 计算，表面估值约为毛 ARR 的 13.7
              倍；这是计算结果，不是可比公司倍数，也不是经审计的收入倍数。公开证据支持“继续研究”、中等信心、高风险和估值偏高的判断。若要建议买入，必须先核实毛收入到净收入的桥接、留存是否持久、利润率和现金消耗证据，以及能带来充分回报路径的投资者条款，不能只依赖表面估值。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV010
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV014
              - CV016
      - number: '8.2'
        title: 正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              正向论点由规模、可量化的买方价值和低摩擦部署组成。Garner 称服务近 800 家客户、覆盖超过 250 万人；其产品页面则称产品叠加在现有健康计划之上，而非替换网络。公司还声称每年可降低 12%
              的医疗支出。反向论点是，这些说法大多来自公司自身，而公开客户分母并不一致：Brite 称有 700 多家雇主，Garner 称有近 800 家客户，但两者没有共同日期或定义。该模式还让 Garner
              暴露于绩效担保风险；会员 FAQ 提醒用户在接受服务前核实供应商网络状态。
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: 不制造虚假精确度的乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              指定证据不包含经审计的预测、上市公司交易数据、相关收购倍数、二级市场估值或优先权条款，因此无法给出站得住脚的美元估值区间。乐观情景要求经审计证据证明毛 ARR
              能转化为有吸引力的留存收入和利润率，客户群保持稳定，且担保不会造成重大赔付。基准情景承认商业规模仍在扩大，但在这些测试通过前，将入场纪律设在未经支持的表面倍数之下。悲观情景则结合毛收入到净收入转化疲弱、担保赔付、客户定义滑移或网络准确性摩擦。这些是决策情景和概率信号，不是概率估计或预测。
            claimRefs:
              - CV005
              - CV009
              - CV010
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV009
              - CV010
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: 融资背景、退出准备度与论点失效测试
        blocks:
          - type: paragraph
            body: >-
              FundedIQ 记录两轮融资共募资 $218 million；Fierce 报道称，$100 million Series E 比 $118 million Series D 晚三个月完成。Garner
              还披露了第二次员工要约收购，但已审阅来源均未说明价格、参与情况、优先权处理方式或其对完全摊薄持股的影响。Modern Healthcare 的 6 月 2
              日时间戳提供了新的独立报道信号，但预取文本没有更多可用交易细节。因此，退出准备度无法转化为目标回报或持有期。尽调应取得经审计报表、客户群留存、担保赔付历史、完全摊薄股权结构表、融资文件、要约材料，以及可信的公开市场或并购可比数据；其中任何一项出现重大缺口，都应重新审视价格和下行保护。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV015
              - CV016
      - number: '8.5'
        title: 展示
        blocks:
          - type: callout
            title: 定价前继续研究
            body: 证据支持这是一家可信的运营公司，但不足以确定精确入场价值。在设定价格、持股比例、目标回报或持有期之前，应取得经审计的经营数据、客户群留存、担保历史、融资条款、要约细节以及相关交易或市场交易参考。
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV008
              - CV010
              - CV016
