      - number: '5.2'
        title: 产品组合、SKU 结构与医疗数据资产
        blocks:
          - type: paragraph
            body: >-
              Garner 的商业产品组合包含三类核心运营资产，分别服务会员、企业计划发起方和医疗服务机构。面向员工，Garner Navigation App 和 Garner Assistant
              对话代理是主要消费者界面，支持医生搜索、自动预约、健康计划保障范围翻译，以及实时理赔报销状态追踪。面向自保企业和商业健康计划，Garner 提供管理仪表板、HRA
              激励账户规则配置和理赔报告基础设施，用于量化临床并发症下降和雇主医疗趋势节省，使第一年医疗支出净额平均下降 12%。面向医生市场，Garner 提供 DataPro 企业数据和分析方案，让
              Mercy、Atlantic Health、Teladoc Health 和 Marathon Health 等医疗系统及医生网络评估内部诊疗模式，并把专科转诊导向高质量临床医生。在开发者和集成侧，Garner
              在 api.getgarner.com 提供公共 API，涵盖 Facilities、Professionals 和 Provider Annotations 端点，并通过 OAuth 2.0
              客户端凭证认证。不过，面向医生的产品访问严格单向：个体临床医生无法查看、审计或申诉自己的具体质量指标。这既保留了 Garner 独立的理赔衍生方法，也造成限制医生自我补救的信息不对称。
