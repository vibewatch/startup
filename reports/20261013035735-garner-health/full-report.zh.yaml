            title: 捆绑式 PEPM 架构让直接消费者激励与可衡量雇主 ROI 对齐
            body: >-
              Garner 将订阅 PEPM 管理费与雇主出资的自付报销结合，避开被动透明度方案的陷阱。通过为选择 Top Providers 的患者吸收免赔额摩擦，Garner 实现 46% 的参与率和第一年平均 12%
              的医疗支出下降，并以最高相当于费用 300% 的绩效趋势保证支撑商业可行性。
