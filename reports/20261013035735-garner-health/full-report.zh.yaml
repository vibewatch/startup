  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 决策链条将已证明的规模，与支撑 Series E 价格所需的私有证据区分开来。
    data:
      nodes:
        - id: scale
          label: 规模信号
          detail: 近 800 个客户、超过 2.5M 人，以及约 $200M 的毛 ARR 均由公司披露。
        - id: model
          label: 商业模式测试
          detail: PEPM 费用包含管理和激励部分，并与节省目标挂钩。
        - id: risk
          label: 下行测试
          detail: 对某些中型团体，担保金额最高可达费用的 300%。
        - id: price
          label: 价格测试
          detail: $2.74B 约等于已披露毛 ARR 的 13.7 倍。
        - id: gap
          label: 证据缺口
          detail: 经审计的经济数据、留存率、烧钱、股权表条款和可比公司数据，在本次指定证据中均未公开。
        - id: decision
          label: 决策
          detail: 继续研究；中等置信度、高风险、估值偏高。
      edges:
        - from: scale
          to: model
          relationship: 需要审查经济数据
        - from: model
          to: risk
          relationship: 造成或有风险敞口
        - from: risk
          to: price
          relationship: 提高回报门槛
        - from: price
          to: gap
          relationship: 需要验证
        - from: gap
          to: decision
          relationship: 支持
    approximationNotes: 唯一的计算是标题所示约 13.7 倍估值 / 毛 ARR 比率；该流程不设定预测概率或估值区间。
    claimRefs:
      - CV003
      - CV004
      - CV009
      - CV010
      - CV014
      - CV016
