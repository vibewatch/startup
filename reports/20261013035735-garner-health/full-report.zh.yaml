        - 按队列展示目录准确率服务水平、申诉和实际引导效果。
      - - 收入匹配度
        - 费用与节省目标挂钩，并包含管理费和激励。
        - 对于参保人数为 500 至 5,000 人的群体，保障金额最高可达费用的 300%。
        - 披露保障计提、赔付、排除项以及收入毛转净处理方式。
    notes: 客户规模和节省数据属于公司或合作伙伴的声明；分母、数据年份、独立验证和保障赔付历史仍需尽调。
    claimRefs:
      - CV003
      - CV004
      - CV009
      - CV010
      - CV011
      - CV012
      - CV013
      - CV014
  - id: TV003
    title: 乐观、基准与悲观决策情景
    columns:
      - 情景
      - 明确假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - 经审计的净收入、利润率和留存验证毛 ARR 叙事；保障赔付仍不重要。
        - 只有持久增长和退出路径能够支撑所需回报时，表面倍数才可能站得住。
        - 公司发布的指标未通过独立验证，或优先权条款吞噬上行空间。
        - 只有私人证据填补所有核心缺口后，才出现上行信号。
      - - 基准
        - 商业规模保持不变，但经济性和股权表条款仍只得到部分验证。
        - 在确认留存收入和退出假设前，按低于表面 13.7 倍毛 ARR 比率的水平评估。
        - 倍数压缩、增长放缓或稀释会降低回报潜力。
        - 当前公开证据不足以给出数值概率。
      - - 悲观
        - 毛转净转化疲弱、保障赔付重大、客户定义滑移或网络准确性摩擦出现。
        - 要求大幅折价和合同下行保护；公开信息无法支持精确底价。
        - 现金消耗、不利融资条款和采用放缓相互叠加。
        - 财务、队列、保障或股权表尽调失败时触发。
    notes: 指定来源没有提供经审计预测、相关公开交易倍数、并购参考、二级市场估值或优先权条款；情景有意避开无依据的估值区间和概率。
    claimRefs:
      - CV005
      - CV009
      - CV010
      - CV013
      - CV014
      - CV016
figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: Garner Health 从 2019 年成立到 2026 年 Series E 融资及产品扩张的时间顺序。
    approximationNotes: null
    data:
      items:
        - date: '2019-01-01'
          label: 公司成立
          detail: Nick Reber 在纽约创立公司，利用理赔分析改善医生质量透明度。
          tone: positive
        - date: '2021-10-01'
          label: 初始福利层部署
          detail: 部署第一代 HRA 报销引擎，并配套医生质量排名。
          tone: neutral
        - date: '2024-05-01'
          label: 企业客户取得进展
          detail: 合作雇主超过 700 家，覆盖 50 人规模的小组至《财富》50 强企业。
          tone: positive
        - date: '2025-04-01'
          label: 高管与平台扩张
          detail: 扩充数据科学和客户成功运营领域的管理与技术团队。
          tone: neutral
        - date: '2026-02-01'
          label: Series D 融资（$118M）
          detail: 宣布 $118M Series D 股权融资，用于扩大医疗服务提供者分析和客户拓展。
          tone: positive
        - date: '2026-05-28'
          label: Series E 融资（估值 $2.74B，融资 $100M）
          detail: 完成由 Index Ventures 领投的 $100M Series E，Garner Health 估值达到 $2.74B。
          tone: positive
        - date: '2026-05-29'
          label: 二级流动性要约
          detail: 在 Series E 融资同期完成第二次员工要约收购。
          tone: neutral
        - date: '2026-07-25'
          label: 理赔数据库扩展至 60B+ 条记录
          detail: 将数据壁垒扩展至全国 320M 名患者的 60B 条医疗记录。
          tone: positive
        - date: '2026-09-15'
          label: Garner Assistant 与专科护理上线
          detail: 推出 Garner Assistant AI 工具，以及生育和更年期护理专科路径。
          tone: positive
        - date: '2026-10-01'
          label: 运营风险与 SLA 透明度审计
          detail: 第三方评估指出会员 HRA 摩擦、应用登录循环，以及缺少公开正常运行时间 SLA。
          tone: negative
