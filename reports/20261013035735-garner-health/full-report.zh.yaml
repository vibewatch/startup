  - id: FP001
    title: 竞争定位图
    type: quadrant
    summary: 按医生质量评分深度和财务引导机制强度，对医疗导航替代方案进行战略定位。
    data:
      points:
        - label: Garner Health
          x: 8.5
          'y': 9
          description: 医生理赔评分与员工 HRA 自付费用报销相结合
        - label: Included Health（Grand Rounds）
          x: 4.5
          'y': 8
          description: 高接触式临床倡导和虚拟医疗，不提供患者现金奖励
        - label: Accolade / Transcarent
          x: 4
          'y': 7
          description: 将医疗导航和倡导整合进自保雇主福利管理
        - label: Castlight Health（Apree）
          x: 5
          'y': 3.5
          description: 聚焦成本透明度和计划导航的数字福利门户
        - label: 承运人原生门户（Optum / Anthem）
          x: 2
          'y': 3
          description: 与承运人网络层级绑定的标准目录搜索，不提供患者现金奖励
        - label: 纯远程医疗服务商
          x: 3
