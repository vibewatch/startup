      - number: '4.4'
        title: 资本充足性、资产负债表依赖与尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              Garner Health 通过近期一级和二级流动性事件保持了强劲的表面资本充足性，但公开记录仍留下关键资产负债表问题。除融资活动外，Garner
              还执行了第二次员工流动性要约收购，显示内部股权机制成熟，也显示投资人对最终上市的强烈兴趣。不过，前瞻性投资判断必须正视重大财务风险：Garner 对费用绩效保证承担较高资产负债表敞口，保证范围为费用的 100%
              至 300%；如果无法证明相对于波动的承保方基准实现净理赔下降，可能触发大额费用追回。此外，会员报销的理赔资金安排要求严密的流动性管理。尽管 Garner
              的收入增速和一流投资人支持提供了较长跑道，但缺少经审计损益表、毛利率不透明，以及未经验证的客户队列流失，构成阻止无保留买入判断的明确尽调阻断点。
            claimRefs:
              - CI003
              - CI012
              - CI013
              - CI014
      - number: '4.5'
        title: 图表与展品
        blocks:
