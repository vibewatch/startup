company:
  name: "Garner Health"
chapter:
  number: 8
  title: "Valuation"
  summary: "Garner Health's May 2026 Series E set a $2.74 billion headline valuation against company-reported gross ARR of approximately $200 million, an implied 13.7x ratio. The operating evidence is promising, but public materials do not disclose the audited gross-to-net bridge, margins, retention, cash burn, preference stack, or tender economics needed for a priced investment decision, supporting a research-more recommendation and stretched valuation stance."
sections:
  - id: "price-sensitive-recommendation"
    title: "Price-Sensitive Recommendation"
    body: "Garner announced a $100 million Series E at a $2.74 billion valuation in May 2026, and Fierce Healthcare independently reported the same round amount and valuation. Against Garner's company-reported gross ARR of approximately $200 million, the headline mark equals about 13.7x gross ARR; that is a calculation, not a comparable-company multiple or an audited revenue multiple. The public evidence supports research-more, medium confidence, high risk, and a stretched valuation stance. A buy call would require a verified gross-to-net revenue bridge, durable retention, margin and cash-burn evidence, and investor terms that provide an adequate return path rather than relying on the headline mark alone."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV005"
      - "CV016"
    tableRefs:
      - "TV001"
    figureRefs:
      - "FV001"
  - id: "thesis-and-anti-thesis"
    title: "Thesis and Anti-Thesis"
    body: "The thesis combines scale, measurable buyer value, and low-friction deployment. Garner says it serves almost 800 customers and more than 2.5 million people, while its product pages describe an overlay on existing health plans rather than a network replacement. The company also claims a 12% reduction in annual healthcare spend. The anti-thesis is that these claims remain largely company-issued, while public customer denominators are inconsistent: Brite describes 700-plus employers and Garner describes almost 800 customers without a shared date or definition. The model also exposes Garner to performance guarantees, and the member FAQ warns that users should verify provider network status before service."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
    tableRefs:
      - "TV002"
  - id: "scenario-discipline"
    title: "Bull, Base, and Bear Cases Without False Precision"
    body: "The assigned evidence does not include audited projections, public-company trading data, relevant acquisition multiples, secondary marks, or preference terms, so a defensible dollar valuation range cannot be produced. The bull case requires audited evidence that gross ARR converts into attractive retained revenue and margins, customer cohorts remain durable, and guarantees do not create material payouts. The base case recognizes continued commercial scale but applies entry discipline below the unsupported headline multiple until those tests clear. The bear case combines weak gross-to-net conversion, guarantee payouts, customer-definition slippage, or network-accuracy friction. These are decision scenarios and probability signals, not probability estimates or forecasts."
    claimRefs:
      - "CV005"
      - "CV009"
      - "CV010"
      - "CV013"
      - "CV014"
      - "CV016"
    tableRefs:
      - "TV003"
  - id: "financing-exit-and-diligence"
    title: "Financing Context, Exit Readiness, and Thesis-Break Tests"
    body: "FundedIQ records $218 million raised across two rounds, while Fierce reports that the $100 million Series E followed a $118 million Series D by three months. Garner also disclosed a second employee tender offer, but no reviewed source states its price, participation, preference treatment, or effect on fully diluted ownership. Modern Healthcare's June 2 timestamp provides a fresh independent coverage signal but no additional usable transaction detail in the prefetched text. Exit readiness therefore cannot be translated into a target return or hold period. Diligence should obtain audited statements, cohort retention, guarantee-payment history, a fully diluted cap table, financing documents, tender materials, and credible public or M&A comparables; material failure on any of those items should reopen price and downside protection."
    claimRefs:
      - "CV006"
      - "CV007"
      - "CV008"
      - "CV015"
      - "CV016"
tables:
  - id: "TV001"
    title: "Recommendation Summary"
    columns:
      - "Decision dimension"
      - "Current assessment"
      - "Evidence basis"
      - "Decision implication"
    rows:
      - - "Recommendation"
        - "research-more"
        - "$2.74B headline valuation and approximately $200M company-reported gross ARR"
        - "Do not make a priced buy decision before private financial and cap-table diligence."
      - - "Confidence"
        - "medium"
        - "Round terms and gross ARR are public; audited economics are not."
        - "Confidence can rise only after gross-to-net, margin, retention, and cash evidence is verified."
      - - "Risk rating"
        - "high"
        - "Performance guarantees coexist with limited public financial disclosure."
        - "Require downside protection and visibility into historical guarantee payouts."
      - - "Valuation stance"
        - "stretched"
        - "Headline valuation equals approximately 13.7x reported gross ARR."
        - "Treat the ratio as a screening flag, not as a validated revenue multiple."
      - - "Entry discipline"
        - "No supportable public range"
        - "No audited forecasts, relevant trading comps, M&A multiples, or preference terms are in the assigned evidence."
        - "Set price and target return only after the missing inputs are obtained."
    notes: "The 13.7x figure is a direct calculation of the $2.74B headline valuation divided by approximately $200M company-reported gross ARR; it is not an audited net-revenue multiple or a comparable-company benchmark."
    claimRefs:
      - "CV001"
      - "CV002"
      - "CV005"
      - "CV010"
      - "CV016"
  - id: "TV002"
    title: "Thesis and Anti-Thesis"
    columns:
      - "Argument"
      - "Evidence supporting the view"
      - "Anti-thesis or uncertainty"
      - "What would change the view"
    rows:
      - - "Commercial scale"
        - "Garner reports almost 800 customers and more than 2.5M people served."
        - "Brite reports 700+ employers, with no common date or denominator."
        - "Reconcile active paying employers, covered lives, partners, and customers by period."
      - - "Buyer economics"
        - "Garner claims an average 12% annual healthcare-spend reduction."
        - "The reviewed evidence does not independently validate cohort-level savings."
        - "Provide claims-based savings studies with matched controls and renewal outcomes."
      - - "Deployment fit"
        - "Garner and Brite describe an overlay on existing plans without network replacement."
        - "Members are still told to verify that recommended providers remain in network."
        - "Show directory-accuracy service levels, appeals, and realized steerage by cohort."
      - - "Revenue alignment"
        - "Fees are tied to savings targets and include administration and incentives."
        - "Guarantees can reach 300% of fees for groups with 500 to 5,000 enrolled."
        - "Disclose guarantee accruals, payouts, exclusions, and gross-to-net revenue treatment."
    notes: "Customer scale and savings are company or partner claims; denominator, vintage, independent validation, and guarantee-payment history remain diligence items."
    claimRefs:
      - "CV003"
      - "CV004"
      - "CV009"
      - "CV010"
      - "CV011"
      - "CV012"
      - "CV013"
      - "CV014"
  - id: "TV003"
    title: "Bull, Base, and Bear Decision Scenarios"
    columns:
      - "Scenario"
      - "Explicit assumptions"
      - "Valuation / return logic"
      - "Key risks"
      - "Probability signal"
    rows:
      - - "Bull"
        - "Audited net revenue, margins, and retention validate the gross ARR narrative; guarantee payouts remain immaterial."
        - "The headline multiple may be defensible only if durable growth and an exit path support the required return."
        - "Company-issued metrics fail independent verification or preference terms absorb upside."
        - "Upside signal only after private evidence clears all core gaps."
      - - "Base"
        - "Commercial scale persists, but economics and cap-table terms remain only partly verified."
        - "Underwrite below the headline 13.7x gross-ARR ratio until retained revenue and exit assumptions are established."
        - "Multiple compression, slower growth, or dilution reduces return potential."
        - "Current public evidence; insufficient for a numeric probability."
      - - "Bear"
        - "Weak gross-to-net conversion, material guarantee payouts, customer-definition slippage, or network-accuracy friction emerges."
        - "Require a material discount and contractual downside protection; no precise floor is supportable publicly."
        - "Cash consumption, adverse financing terms, and slower adoption compound."
        - "Triggered by failed financial, cohort, guarantee, or cap-table diligence."
    notes: "The assigned sources do not provide audited forecasts, relevant public trading multiples, M&A references, secondary marks, or preference terms; scenarios intentionally avoid unsupported valuation ranges and probabilities."
    claimRefs:
      - "CV005"
      - "CV009"
      - "CV010"
      - "CV013"
      - "CV014"
      - "CV016"
