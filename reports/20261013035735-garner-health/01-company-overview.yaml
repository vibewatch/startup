company:
  name: Garner Health
chapter:
  number: 1
  title: Company Overview
  summary: Garner Health is a New York-based care navigation platform that couples physician quality analytics across 60 billion medical claims with employer-funded incentive accounts. In May 2026, the company raised a $100 million Series E round at a $2.74 billion valuation led by Index Ventures, reporting $200 million in gross ARR while serving nearly 800 employers.
sections:
  - id: corporate-identity-and-market-position
    title: Executive Summary & Corporate Identity
    body: |-
      Garner Health was founded in 2019 in New York City by Chief Executive Officer Nick Reber to reform healthcare delivery economics by guiding patients to high-performing in-network physicians. Rather than building restrictive narrow network health plans or proprietary clinical delivery centers, Garner operates as an overlay benefit across existing commercial health insurance plans. The company pairs a member-facing mobile application and concierge navigation service with an employer-funded Health Reimbursement Arrangement (HRA) that eliminates member out-of-pocket medical expenses, such as copays, diagnostic imaging, and surgical fees, when employees choose designated Top Providers.

      The platform's provider steering mechanism is driven by an extensive proprietary claims evaluation engine. Garner reports compiling a database of over 60 billion medical claims records spanning 320 million patient journeys and covering approximately 75 percent of all national claims. By applying over 550 clinical quality and efficiency metrics across 80 physician specialties, Garner ranks doctors on diagnostic accuracy, adherence to evidence-based medical guidelines, and complication avoidance. As of late 2026, the company serves nearly 800 employer clients ranging from 50-life mid-market groups to Fortune 50 enterprises, alongside enterprise health plan partnerships and broker distribution channels.
    claimRefs:
      - CO001
      - CO002
      - CO007
      - CO008
    tableRefs:
      - TO001
    figureRefs: []
  - id: leadership-architecture-and-governance
    title: Leadership, Governance & Key-Person Architecture
    body: |-
      Garner Health is directed by founder and Chief Executive Officer Nick Reber, whose personal experience navigating complex medical diagnoses and chronic back pain served as the operational catalyst for founding the company in 2019. Prior to establishing Garner, Reber held senior operational and management roles at Bridgewater Associates, bringing structured quantitative systems thinking to healthcare navigation. Reber remains the primary public representative, strategic architect, and cultural anchor of the business, creating substantial key-person dependence typical of founder-led growth companies.

      The company's corporate governance structure combines executive leadership with institutional oversight from premier healthcare and technology venture capital firms. Lead Series E director Jahanvi Sardana, partner at Index Ventures, maintains board governance alignment following the firm's leadership of the $100 million Series E financing. Specialized clinical leadership, including advisory specialists such as reproductive endocrinologist Dr. Asima Ahmad, supports clinical quality governance and specialty care expansion into high-cost condition pathways. While Garner has expanded departmental management across data platform engineering and enterprise client success, detailed public disclosure regarding the broader vice president bench and executive committee voting power remains private.
    claimRefs:
      - CO001
      - CO003
      - CO006
    tableRefs:
      - TO002
    figureRefs: []
  - id: capitalization-investors-and-financial-gaps
    title: Capitalization, Investor Syndicates & Diligence Gaps
    body: |-
      Garner Health has raised substantial institutional capital to support its rapid commercial expansion and data platform infrastructure. In May 2026, the company finalized a $100 million Series E funding round led by Index Ventures at a post-money valuation of $2.74 billion. The Series E followed closely on the heels of a $118 million Series D financing announced in February 2026. The syndicate features prominent technology and healthcare venture capital firms, including Kleiner Perkins, Redpoint Ventures, Thrive Capital, Sequoia Capital, Founders Fund, and Kaiser Permanente Ventures. Alongside the Series E closing, Garner executed a second employee tender offer to provide secondary liquidity to tenured team members.

      Despite strong top-line momentum, Garner's public financial disclosures present material information gaps for prospective investors. Garner announced gross annual recurring revenue (ARR) of approximately $200 million alongside its Series E, asserting five consecutive years of 100%+ year-over-year revenue expansion. However, the company does not disclose audited GAAP income statements, gross margin profiles, customer acquisition costs, or net revenue retention metrics. Disclosed lifetime equity capital stands at approximately $218 million according to Venture Capital Tracker records, but detailed capitalization table priorities, senior liquidation preferences, and employee option pool sizing remain confidential private company data that require on-site dataroom verification.
    claimRefs:
      - CO004
      - CO005
      - CO006
      - CO009
      - CO010
      - CO014
    tableRefs:
      - TO003
    figureRefs: []
  - id: milestone-evolution-and-operational-risks
    title: Milestone Evolution & Operational Risk Profile
    body: |-
      Since its inception in 2019, Garner Health has progressed through distinct development phases, evolving from an early algorithmic ranking concept into a scaled enterprise navigation platform. Early milestones focused on compiling national medical claims data and deploying the foundational HRA reimbursement architecture. By 2024, the business established commercial traction across hundreds of enterprise employers, demonstrating reported average annual healthcare spend reductions of 12 percent. In 2026, the company accelerated both capital accumulation and product capabilities, closing sequential Series D and Series E rounds, launching the Garner Assistant navigation tool, and introducing tailored specialty clinical pathways for fertility and menopause care.

      However, third-party vendor assessments and user feedback highlight tangible operational risks and friction points. RFP.wiki vendor evaluation records emphasize that member engagement is vulnerable to confusion regarding HRA claim reimbursement rules and filing deadlines, which can leave employees unexpectedly responsible for medical bills if provider visits were not pre-configured in the mobile app. In addition, user reviews cite recurring app login loops and onboarding friction, while Garner lacks a publicly verified service-level agreement (SLA) or published uptime dashboard. Steering efficacy also faces qualitative resistance when algorithmically designated Top Providers conflict with local community reputations or suffer from limited near-term appointment availability.
    claimRefs:
      - CO002
