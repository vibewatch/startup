  topStrengths:
    - Clear commercial scale with nearly 800 employer customers and 2.5 million members.
    - Differentiated overlay model that can improve provider steerage without replacing existing health-plan networks.
    - Strong funding access and top-tier venture backing support continued expansion.
  topRisks:
    - Gross-to-net revenue, margins, retention, and balance-sheet liabilities remain undisclosed.
    - The headline valuation already implies a rich multiple against company-reported gross ARR.
    - Customer and member metrics are still mostly company-reported, with limited independent verification.
  unresolvedGaps:
    - Exact gross-to-net revenue bridge, audited margin profile, and cash burn.
    - >-
      Cap-table preference stack, tender mechanics, and whether the headline valuation maps cleanly to new-money
      economics.
    - Retention, cohort behavior, NRR/GRR, logo churn, and customer or broker concentration.
    - Model-governance evidence for provider rankings, directory accuracy, appeals, and AI-assisted workflows.
    - Verified headcount and a cleaner split between customers, employers, partners, and other counterparties.
