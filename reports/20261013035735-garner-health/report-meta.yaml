companyProfile:
  summary: >-
    Garner Health is a New York-based employer-sponsored healthcare navigation company founded in 2019 by Nick Reber.
    The platform overlays existing health plans with physician-quality analytics, member navigation, and employer-funded
    incentive accounts to steer members toward higher-performing in-network care. Garner says it serves nearly 800
    employer customers and 2.5 million members, and it closed a $100 million Series E in May 2026 at a $2.74 billion
    valuation, but public disclosure on margins, retention, and cap-table economics remains limited.
  founders:
    - name: Nick Reber
      role: Founder & Chief Executive Officer
      background: >-
        Former Bridgewater Associates senior leader; founded Garner after navigating his own chronic back pain and
        care-friction experience.
      claimRefs:
        - CO001
        - CO003
  foundingLocation: New York City
  headquarters: New York, New York, United States
  productSummary: >-
    Employer-sponsored healthcare navigation and incentive overlay that identifies higher-quality in-network physicians,
    supports members through the care journey, and reimburses qualifying out-of-pocket costs.
  customerFocus: >-
    Self-funded and fully insured employers, with members and dependents as end users and health plans as adjacent
    distribution partners.
  businessModel: >-
    Per-employee-per-month subscription fees plus incentive administration and savings-guarantee economics layered over
    employer health benefits.
  stage: Late-stage private (Series E)
  fundingStatus: >-
    May 2026 $100 million Series E led by Index Ventures at a $2.74 billion valuation; total disclosed equity funding
    approximately $218 million.
