    title: "Garner Health Revenue and Cash Flow Conversion Cycle"
    type: "flow"
    summary: "Sequential operational and financial flow showing how employer contracting and member care decisions convert into vendor revenue and claims cost reductions."
    data:
      nodes:
        - id: "employer-contract"
          label: "1. Employer Contract & PEPM Billing"
          description: "Employer contracts on a bundled PEPM fee structure covering software, concierge navigation, broker commissions, and incentive allowances."
        - id: "data-ingestion"
          label: "2. Claims Ingestion & Directory Scoring"
          description: "Platform ingests 60B+ claims records to score in-network physicians on 550+ clinical metrics and verify 92% directory accuracy."
        - id: "member-navigation"
