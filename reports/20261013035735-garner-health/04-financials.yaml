chapter:
  number: 4
  title: "Financials"
  summary: "Garner Health operates an employer care navigation model generating approximately $200M in gross ARR that monetizes through bundled per-employee-per-month (PEPM) fees and performance-backed net trend guarantees. While capitalized by a $100M Series E at a $2.74B valuation, institutional underwriting remains constrained by undisclosed gross margins, private customer cohort retention data, and balance-sheet contingent liabilities from aggressive savings guarantees."
sections:
  - id: "revenue-model-and-pricing-architecture"
    title: "Revenue Model, Pricing Architecture, and Contracting Mechanics"
    body: "Garner Health monetizes its digital care navigation platform primarily through a per-employee-per-month (PEPM) subscription fee charged directly to employer plan sponsors. Unlike legacy healthcare navigation platforms that bill separately for navigation software, clinical advocacy call centers, and third-party administration fees, Garner's commercial structure bundles platform access, concierge support, broker compensation, and member incentive payouts into a single contracted charge. In exchange, Garner commits to a contractual net trend target and backs that savings target with its own balance sheet: for mid-market employer groups with 500 to 5,000 enrolled employees, Garner guarantees up to 300% of its fees against agreed claims cost reduction targets, while groups above 5,000 enrolled members receive guarantees of up to 100% of fees. Any surplus savings generated above the agreed target is returned entirely to the plan sponsor, creating a structured risk-sharing corridor that shifts member steerage risk to the vendor. While Garner does not publish an off-the-shelf public rate card and models pricing custom to each employer's actuarial risk profile, public meeting minutes from benefits procurement negotiations cite illustrative quotes around $5 PEPM. The financial linchpin of this architecture is Garner's ability to drive sustained member steerage without altering underlying carrier networks or requiring plan refilings, enabling self-funded and fully insured employers to capture immediate medical trend reductions."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI004"
    tableRefs:
      - "TI001"
  - id: "gtm-motion-and-cost-structure"
    title: "Go-to-Market Economics, Channel Distribution, and Cost Structure Drivers"
    body: "Garner's go-to-market motion relies heavily on employee benefits advisors, insurance brokers, and commercial health plan distribution channels rather than an expensive direct-to-consumer sales engine. Brokers position Garner as an administrative add-on that requires zero network disruption or carrier changes, allowing employers spanning 50-life small groups to Fortune 50 enterprises to deploy the benefit inside standard 60-day implementation windows. Broker compensation is built directly into the PEPM fee structure, creating strong channel alignment without visible line-item surcharges for the employer. On the operational cost side, Garner's service-delivery cost structure differs significantly from pure SaaS businesses: operating expenditures include continuous claims ingestion and data cleaning across 60 billion medical records, natural-language directory verification workflows that combine machine learning with telephonic call-center confirmation to maintain 92% directory accuracy, and dedicated concierge navigation teams that assist members with scheduling and out-of-pocket reimbursement claims. Furthermore, Garner must manage the working capital cadence of supplemental Health Reimbursement Arrangement (HRA) and first-dollar Health Savings Account (HSA) funding partnerships with administrators like WEX, Optum, and HealthEquity, where reimbursement disbursements represent ongoing cash flow outlays distinct from subscription billing cycles."
    claimRefs:
      - "CI005"
      - "CI006"
      - "CI009"
      - "CI011"
    tableRefs:
      - "TI002"
    figureRefs:
      - "FI001"
  - id: "public-traction-and-unit-economics-gaps"
    title: "Commercial Scale, Public Traction, and Unit Economics Underwriting Gaps"
    body: "Garner Health has achieved rapid commercial scale within the enterprise digital health ecosystem, reporting approximately $200 million in gross annual recurring revenue (ARR) and claiming to have more than doubled revenue year-over-year for five consecutive periods. The platform currently serves nearly 800 employer organizations and covers approximately 2.5 million enrolled members, demonstrating strong commercial adoption among major self-insured employers including Archer-Daniels-Midland, Paylocity, and the University of Oklahoma. Garner reports that its personalized physician recommendations and cash reimbursement incentives achieve an average eligible member engagement rate of 46%, yielding an average 12% reduction in employer healthcare claims spend in year one alongside an 80% out-of-pocket savings for members seeing Top Providers. However, from an institutional diligence perspective, critical unit economics metrics remain completely undisclosed private data: Garner does not publish GAAP net revenue, audited gross margins, net revenue retention (NRR), gross revenue retention (GRR), customer acquisition costs (CAC), or average payback periods. Without an audited gross-to-net reconciliation, underwriters cannot determine how much of Garner's reported $200M gross ARR is disbursed directly to members as incentive reimbursements versus retained as high-margin gross profit."
    claimRefs:
      - "CI007"
      - "CI008"
      - "CI011"
      - "CI012"
    tableRefs:
      - "TI003"
  - id: "capital-adequacy-and-forward-verdict"
    title: "Capital Adequacy, Balance Sheet Dependency, and Diligence Blockers"
    body: "Garner Health maintains strong headline capital adequacy through recent primary and secondary liquidity events, but the public record still leaves key balance-sheet questions open. Alongside its financing activity, Garner executed a second tender offer for employee liquidity, indicating mature internal equity mechanics and strong investor appetite ahead of an eventual public offering. Nevertheless, forward underwriting must confront meaningful financial risks: Garner carries substantial balance-sheet exposure through its 100% to 300% fee performance guarantees, where failure to demonstrate net claims reductions against volatile carrier baselines could trigger material fee clawbacks. Furthermore, claims funding for member reimbursements demands tight liquidity management. While Garner's revenue velocity and blue-chip backing provide substantial runway, the lack of audited income statements, opaque gross margins, and unverified customer cohort churn represent definitive diligence blockers that prevent an unqualified buy verdict."
    claimRefs:
      - "CI003"
      - "CI012"
      - "CI013"
      - "CI014"
