callouts:
  - calloutType: "strength"
    title: "Bundled PEPM Architecture Aligns Direct Consumer Incentives With Measurable Employer ROI"
    body: "Garner's monetization model avoids the passive transparency pitfall by coupling subscription PEPM administration with employer-funded out-of-pocket reimbursements. By absorbing deductible friction for patients seeing Top Providers, Garner achieves a 46% engagement rate and an average 12% first-year medical spend reduction, backing commercial viability with performance trend guarantees of up to 300% of fees."
    claimRefs:
      - "CI001"
      - "CI002"
      - "CI003"
      - "CI011"
  - calloutType: "risk"
    title: "Off-Balance-Sheet Claims Funding and Performance Guarantees Create Hidden Underwriting Volatility"
    body: "Procurement analysis highlights that claims funding for HRA reimbursements represents an ongoing cash flow liability distinct from software PEPM fees. Furthermore, aggressive performance guarantees—under which Garner pledges up to 300% of fees against net trend targets for mid-sized groups—expose vendor gross margins to substantial volatility if patient steerage or claims data integration with third-party carriers falters."
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI014"
