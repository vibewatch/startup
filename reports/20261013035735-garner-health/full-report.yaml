chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Executive Summary & Corporate Identity
        blocks:
          - type: paragraph
            body: >-
              Garner Health was founded in 2019 in New York City by Chief Executive Officer Nick Reber to reform
              healthcare delivery economics by guiding patients to high-performing in-network physicians. Rather than
              building restrictive narrow network health plans or proprietary clinical delivery centers, Garner operates
              as an overlay benefit across existing commercial health insurance plans. The company pairs a member-facing
              mobile application and concierge navigation service with an employer-funded Health Reimbursement
              Arrangement (HRA) that eliminates member out-of-pocket medical expenses, such as copays, diagnostic
              imaging, and surgical fees, when employees choose designated Top Providers.


              The platform's provider steering mechanism is driven by an extensive proprietary claims evaluation engine.
              Garner reports compiling a database of over 60 billion medical claims records spanning 320 million patient
              journeys and covering approximately 75 percent of all national claims. By applying over 550 clinical
              quality and efficiency metrics across 80 physician specialties, Garner ranks doctors on diagnostic
              accuracy, adherence to evidence-based medical guidelines, and complication avoidance. As of late 2026, the
              company serves nearly 800 employer clients ranging from 50-life mid-market groups to Fortune 50
              enterprises, alongside enterprise health plan partnerships and broker distribution channels.
            claimRefs:
              - CO001
              - CO002
              - CO007
              - CO008
          - type: table
            tableRef: TO001
            claimRefs:
