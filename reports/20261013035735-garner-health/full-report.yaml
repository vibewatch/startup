  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape and Market Alternatives
        blocks:
          - type: paragraph
            body: >-
              The employee healthcare guidance and navigation market comprises multiple distinct vendor classes
              competing for employer benefit budgets. Traditional healthcare navigation solutions sit between benefits
              administration and clinical delivery, seeking to guide members through coverage, care options, and billing
              questions. Historical competitors in this space include comprehensive clinical advocacy platforms such as
              Included Health (formed through the merger of Grand Rounds and Doctor On Demand) and Accolade (often
              coupled with virtual-first care and advocacy ecosystems like Transcarent). These legacy players generally
              emphasize dedicated clinical advocates, second opinion services, and comprehensive care coordination
              across complex medical journeys.


              In contrast, carrier-embedded tools and digital transparency portals, historically pioneered by solutions
              such as Castlight Health (now part of Apree Health) and native payer applications from Optum, Anthem, and
              Blue Cross Blue Shield, focus primarily on plan transparency, price lookups, and in-network provider
              directories. Finally, point-solution telehealth vendors and specialized digital clinics offer direct care
              delivery but lack longitudinal local specialist quality steerage. Garner Health carves out a distinct
              position against these alternatives by operating strictly as a provider analytics and financial steerage
              overlay that requires no carrier replacement or network disruption.
            claimRefs:
              - CP001
              - CP002
              - CP007
              - CP008
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP005
              - CP007
              - CP008
              - CP014
      - number: '3.2'
        title: Differentiation and Capability Comparisons
        blocks:
          - type: paragraph
            body: >-
              Garner's core differentiation centers on overcoming the primary failure mode of first-generation
              transparency tools: member inertia. Traditional 'doctor finder' applications provide ratings or cost
              estimates but fail to change patient behavior because employees rarely understand complex clinical quality
              scores and face the same out-of-pocket copays or deductibles regardless of which in-network physician they
              choose. Garner circumvents this hurdle through financial engineering, creating a dedicated Health
              Reimbursement Arrangement (HRA) or first-dollar HSA incentive structure funded by the employer.


              When a member selects a Garner-designated 'Top Provider' identified via Garner's analysis of 60 billion
              medical claims across 320 million patients, the employer reimburses all or most out-of-pocket expenses. By
              eliminating patient cost-sharing at the point of care, Garner achieves reported member engagement rates
              exceeding 40%, far outpacing legacy transparency tools that often linger in single-digit adoption. While
              comprehensive advocacy platforms provide deeper human concierge support for complex chronic journeys,
              Garner focuses tightly on routing episode volume to high-efficiency, guideline-adherent physicians to
              generate rapid, measurable claims savings.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP008
      - number: '3.3'
        title: Pricing Models, Packaging, and Switching Dynamics
        blocks:
          - type: paragraph
            body: >-
              Commercial packaging in health navigation generally takes the form of per-employee-per-month (PEPM) fees,
              percentage-of-savings shares, or bundled platform retainers. Garner bills employers a PEPM fee that
              incorporates both administration and the capital required to fund member incentive payouts, ensuring no
              hidden charges emerge for employers during high utilization periods. To lower adoption barriers and derisk
              the investment, Garner structures performance guarantees against net claims trend targets, putting up to
              300% of fees at risk for mid-size employer groups (500 to 5,000 enrolled) and up to 100% for larger
              enterprises.


              Switching costs in this market are nuanced. Because Garner operates on top of existing medical carriers
              and third-party administrators without requiring network changes or medical plan refilings, initial
              deployment friction is minimal, typically taking under 60 days. However, once implemented, member
              habituation to the HRA reimbursement process and historical Care Team designations creates meaningful
              procedural switching friction. Employers hesitate to remove a benefit that directly covers employee
              deductibles, giving Garner moderate operational stickiness despite its non-embedded infrastructure.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP010
              - CP011
              - CP012
              - CP013
      - number: '3.4'
        title: Moat Durability and Adverse Competitive Risks
        blocks:
          - type: paragraph
            body: >-
              Despite Garner's rapid commercial growth to nearly 800 client organizations and $200 million in gross ARR,
              its long-term competitive durability faces several strategic and operational threats. The primary
              vulnerability stems from disintermediation risk: major health insurance carriers possess proprietary
              claims datasets and could theoretically introduce native first-dollar reimbursement accounts paired with
              their own network steerage tiers, squeezing third-party overlays out of self-insured benefit stacks.
              However, carrier incentives are frequently misaligned with aggressive steerage, and Garner's cross-carrier
              dataset spanning 75% of national claims offers wider breadth than any single carrier's visibility.


              Operationally, Garner faces execution risks around member friction and provider directory accuracy. If
              employees fail to add a Top Provider in the application prior to receiving care, reimbursement requests
              are denied, generating employee dissatisfaction and administrative support burden. Furthermore, health
              systems in consolidated metropolitan markets may push back against external steerage models that penalize
              high-cost specialists. Garner has sought to mitigate this friction by establishing collaborative
              partnerships with health systems such as Mercy and Atlantic Health, converting potential provider
              adversaries into strategic referral partners.
            claimRefs:
              - CP004
              - CP005
              - CP012
              - CP013
              - CP014
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Financial Incentive Wedge
            body: >-
              Garner's key architectural advantage over legacy care navigation platforms is the alignment of patient
              self-interest through HRA deductible coverage. Where traditional navigation platforms rely on passive
              employee education, Garner eliminates financial friction to steer volume to high-quality providers.
            calloutType: insight
            claimRefs:
              - CP002
              - CP003
          - type: callout
            title: Distribution Dependency and Incumbent Response
            body: >-
              Because Garner operates as a non-disruptive overlay atop existing medical carriers, it remains vulnerable
              to carrier pushback, directory restrictions, or native carrier feature parity. Maintaining broker
              mindshare and demonstrated net trend reduction is vital to defend against bundled carrier alternatives.
            calloutType: risk
            claimRefs:
              - CP001
              - CP009
              - CP012
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Architecture, and Contracting Mechanics
        blocks:
          - type: paragraph
            body: >-
              Garner Health monetizes its digital care navigation platform primarily through a per-employee-per-month
              (PEPM) subscription fee charged directly to employer plan sponsors. Unlike legacy healthcare navigation
              platforms that bill separately for navigation software, clinical advocacy call centers, and third-party
              administration fees, Garner's commercial structure bundles platform access, concierge support, broker
              compensation, and member incentive payouts into a single contracted charge. In exchange, Garner commits to
              a contractual net trend target and backs that savings target with its own balance sheet: for mid-market
              employer groups with 500 to 5,000 enrolled employees, Garner guarantees up to 300% of its fees against
              agreed claims cost reduction targets, while groups above 5,000 enrolled members receive guarantees of up
              to 100% of fees. Any surplus savings generated above the agreed target is returned entirely to the plan
              sponsor, creating a structured risk-sharing corridor that shifts member steerage risk to the vendor. While
              Garner does not publish an off-the-shelf public rate card and models pricing custom to each employer's
              actuarial risk profile, public meeting minutes from benefits procurement negotiations cite illustrative
              quotes around $5 PEPM. The financial linchpin of this architecture is Garner's ability to drive sustained
              member steerage without altering underlying carrier networks or requiring plan refilings, enabling
              self-funded and fully insured employers to capture immediate medical trend reductions.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: table
            tableRef: TI001
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
      - number: '4.2'
        title: Go-to-Market Economics, Channel Distribution, and Cost Structure Drivers
        blocks:
          - type: paragraph
            body: >-
              Garner's go-to-market motion relies heavily on employee benefits advisors, insurance brokers, and
              commercial health plan distribution channels rather than an expensive direct-to-consumer sales engine.
              Brokers position Garner as an administrative add-on that requires zero network disruption or carrier
              changes, allowing employers spanning 50-life small groups to Fortune 50 enterprises to deploy the benefit
              inside standard 60-day implementation windows. Broker compensation is built directly into the PEPM fee
              structure, creating strong channel alignment without visible line-item surcharges for the employer. On the
              operational cost side, Garner's service-delivery cost structure differs significantly from pure SaaS
              businesses: operating expenditures include continuous claims ingestion and data cleaning across 60 billion
              medical records, natural-language directory verification workflows that combine machine learning with
              telephonic call-center confirmation to maintain 92% directory accuracy, and dedicated concierge navigation
              teams that assist members with scheduling and out-of-pocket reimbursement claims. Furthermore, Garner must
              manage the working capital cadence of supplemental Health Reimbursement Arrangement (HRA) and first-dollar
              Health Savings Account (HSA) funding partnerships with administrators like WEX, Optum, and HealthEquity,
              where reimbursement disbursements represent ongoing cash flow outlays distinct from subscription billing
              cycles.
            claimRefs:
              - CI005
              - CI006
              - CI009
              - CI011
          - type: table
            tableRef: TI002
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
          - type: figure
            figureRef: FI001
            claimRefs:
