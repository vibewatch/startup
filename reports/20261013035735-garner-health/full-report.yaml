      - number: '4.3'
        title: Commercial Scale, Public Traction, and Unit Economics Underwriting Gaps
        blocks:
          - type: paragraph
            body: >-
              Garner Health has achieved rapid commercial scale within the enterprise digital health ecosystem,
              reporting approximately $200 million in gross annual recurring revenue (ARR) and claiming to have more
              than doubled revenue year-over-year for five consecutive periods. The platform currently serves nearly 800
              employer organizations and covers approximately 2.5 million enrolled members, demonstrating strong
              commercial adoption among major self-insured employers including Archer-Daniels-Midland, Paylocity, and
              the University of Oklahoma. Garner reports that its personalized physician recommendations and cash
              reimbursement incentives achieve an average eligible member engagement rate of 46%, yielding an average
              12% reduction in employer healthcare claims spend in year one alongside an 80% out-of-pocket savings for
              members seeing Top Providers. However, from an institutional diligence perspective, critical unit
              economics metrics remain completely undisclosed private data: Garner does not publish GAAP net revenue,
              audited gross margins, net revenue retention (NRR), gross revenue retention (GRR), customer acquisition
              costs (CAC), or average payback periods. Without an audited gross-to-net reconciliation, underwriters
              cannot determine how much of Garner's reported $200M gross ARR is disbursed directly to members as
              incentive reimbursements versus retained as high-margin gross profit.
            claimRefs:
              - CI007
              - CI008
              - CI011
              - CI012
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI008
              - CI011
              - CI012
      - number: '4.4'
        title: Capital Adequacy, Balance Sheet Dependency, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Garner Health maintains strong headline capital adequacy through recent primary and secondary liquidity
              events, but the public record still leaves key balance-sheet questions open. Alongside its financing
              activity, Garner executed a second tender offer for employee liquidity, indicating mature internal equity
              mechanics and strong investor appetite ahead of an eventual public offering. Nevertheless, forward
              underwriting must confront meaningful financial risks: Garner carries substantial balance-sheet exposure
              through its 100% to 300% fee performance guarantees, where failure to demonstrate net claims reductions
              against volatile carrier baselines could trigger material fee clawbacks. Furthermore, claims funding for
              member reimbursements demands tight liquidity management. While Garner's revenue velocity and blue-chip
              backing provide substantial runway, the lack of audited income statements, opaque gross margins, and
              unverified customer cohort churn represent definitive diligence blockers that prevent an unqualified buy
              verdict.
            claimRefs:
              - CI003
              - CI012
              - CI013
              - CI014
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Bundled PEPM Architecture Aligns Direct Consumer Incentives With Measurable Employer ROI
            body: >-
              Garner's monetization model avoids the passive transparency pitfall by coupling subscription PEPM
              administration with employer-funded out-of-pocket reimbursements. By absorbing deductible friction for
              patients seeing Top Providers, Garner achieves a 46% engagement rate and an average 12% first-year medical
              spend reduction, backing commercial viability with performance trend guarantees of up to 300% of fees.
            calloutType: strength
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI011
          - type: callout
            title: Off-Balance-Sheet Claims Funding and Performance Guarantees Create Hidden Underwriting Volatility
            body: >-
              Procurement analysis highlights that claims funding for HRA reimbursements represents an ongoing cash flow
              liability distinct from software PEPM fees. Furthermore, aggressive performance guarantees—under which
              Garner pledges up to 300% of fees against net trend targets for mid-sized groups—expose vendor gross
              margins to substantial volatility if patient steerage or claims data integration with third-party carriers
              falters.
            calloutType: risk
            claimRefs:
              - CI003
              - CI004
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Core Platform and Service Definition in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >
              Garner Health operates as an employer-sponsored healthcare navigation platform and financial incentive
              overlay designed to guide plan members toward higher-performing doctors without requiring changes to
              underlying carrier networks or health plan designs. The customer workflow begins when an employee or
              covered dependent accesses the Garner mobile application or web portal to search for an in-network medical
              provider across more than 80 medical and surgical specialties. Rather than presenting static directory
              lists or subjective patient star ratings, the platform surfaces ranked Top Providers—physicians identified
              as scoring in the top 20% of clinical quality and procedural efficiency within their geographic market and
              insurance network. To overcome conventional employee inertia and drive active engagement, Garner couples
              clinical steerage with an employer-funded Health Reimbursement Arrangement (HRA) or IRS-compliant
              first-dollar HSA incentive model. When members complete an appointment or procedure with a designated Top
              Provider, the platform reimburses eligible out-of-pocket expenses such as copayments, diagnostic testing
              fees, and surgical deductibles, reducing member out-of-pocket costs by an average of 80%. This combination
              of objective clinical ranking and direct financial relief creates a clear behavioral incentive, achieving
              a reported 46% member engagement rate compared to standard industry navigation benchmarks of 10% to 20%.
            claimRefs:
              - CE001
              - CE003
              - CE007
              - CE011
              - CE013
              - CE014
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE003
              - CE007
              - CE011
              - CE013
              - CE014
      - number: '5.2'
        title: Product Portfolio, SKU Structure, and Healthcare Data Assets
        blocks:
          - type: paragraph
            body: >
              Garner's commercial product portfolio spans three core operational assets serving members, enterprise plan
              sponsors, and healthcare provider organizations. For employees, the Garner Navigation App and Garner
              Assistant conversational agent serve as the primary consumer interfaces, supporting provider searches,
              automated appointment scheduling, health plan coverage translation, and real-time claim reimbursement
              status tracking. For self-insured corporations and commercial health plans, Garner provides administrative
              dashboards, HRA incentive account rule configuration, and claims reporting infrastructure that quantifies
              clinical complication reductions and employer healthcare trend savings, delivering an average 12%
              first-year net reduction in medical spend. In the provider market, Garner offers DataPro, an enterprise
              data and analytics solution that allows health systems and physician networks—including Mercy, Atlantic
              Health, Teladoc Health, and Marathon Health—to evaluate internal practice patterns and optimize specialist
              referral routing toward high-quality clinicians. On the developer and integration side, Garner maintains a
              public API surface on api.getgarner.com with contracts covering Facilities, Professionals, and Provider
              Annotations endpoints authenticated via OAuth 2.0 client credentials. However, provider-facing product
              access remains strictly one-directional: individual clinicians cannot view, audit, or appeal their
              specific quality metrics, preserving Garner's independent claims-derived methodology while creating an
              information asymmetry that limits provider self-remediation.
            claimRefs:
              - CE001
              - CE002
              - CE004
              - CE006
              - CE008
              - CE010
              - CE012
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE004
              - CE006
              - CE007
              - CE008
              - CE010
              - CE012
      - number: '5.3'
        title: Technical Architecture, Quality Scoring Engine, and AI Infrastructure
        blocks:
          - type: paragraph
            body: >
              Garner's underlying technical architecture is anchored on a proprietary claims data warehouse comprising
              more than 60 billion de-identified medical records spanning 320 million longitudinal patient profiles
              nationwide. This repository integrates commercial insurance claims, Medicare and Medicaid records, and
              hospital price transparency data, covering an estimated 75% of all healthcare claims in the United States.
              To evaluate provider performance objectively, Garner measures each physician against more than 550
              specialty-specific clinical quality and cost-efficiency metrics. The scoring pipeline first filters out
              extreme clinical complexities that cannot be statistically risk-adjusted, then normalizes remaining cases
              across patient comorbidities, clinical histories, and demographic factors. To keep clinical scoring
              synchronized with evolving medical science, Garner deploys the Garner Research Agent, an AI engine that
              systematically parses peer-reviewed medical journals and translates newly published clinical practice
              guidelines into algorithmic scoring parameters. On the user-facing side, the newly introduced Garner
              Assistant acts as a conversational front door that helps members resolve benefit inquiries and navigate
              care pathways. The end-to-end architecture operates as an asynchronous six-layer stack—spanning data
              ingestion, normalization, algorithmic guideline parsing, Top Provider directory scoring, HRA financial
              adjudication, and multi-channel client applications.
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE003
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
              - CE008
              - CE009
          - type: figure
            figureRef: FE001
            claimRefs:
              - CE002
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
      - number: '5.4'
        title: Deployment, Integration Surfaces, Compliance, and Diligence Risks
        blocks:
          - type: paragraph
            body: >
              A primary operational advantage of Garner Health is its non-disruptive deployment model. The platform
              functions as a software and HRA overlay that integrates directly into existing employer benefit packages
              across self-insured, fully insured, and level-funded arrangements. Implementation requires no network
              redesign, no carrier replacement, and no medical plan refiling with state insurance regulators. To handle
              tax-advantaged accounts in compliance with Internal Revenue Service regulations, Garner supports
              first-dollar HSA models in partnership with major custodians including WEX, Optum, and HealthEquity,
              ensuring employer contributions preserve member HSA eligibility while rewarding Top Provider utilization.
              From a trust and security standpoint, Garner maintains SOC 2 Type II certification and processes claims
              data through de-identified pipelines to protect protected health information under HIPAA standards.
              Despite these technical strengths, diligence reveals operational friction points reflected in third-party
              reviews and user feedback. Members report intermittent mobile application login loops, confusion
              surrounding HRA reimbursement eligibility when seeing non-ranked ancillary providers during surgical
              episodes, and restricted Top Provider availability in less dense geographic markets. Furthermore, because
              provider scoring relies on rolling multi-month claims histories, updates to physician quality designations
              lag behind real-time clinical practice changes.
            claimRefs:
              - CE003
              - CE005
              - CE008
              - CE009
              - CE011
              - CE012
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Divergence Between Claims-Based Scoring and Consumer Reviews
            body: >-
              Garner's core architectural thesis is that consumer star ratings and physician credentialing fail to
              predict clinical outcomes. By grounding physician rankings in 60 billion claims records across 550
              specialty metrics, Garner decouples provider quality assessment from subjective patient popularity.
            calloutType: insight
            claimRefs:
              - CE002
              - CE004
              - CE014
          - type: callout
            title: Black-Box Provider Scoring and Physician Auditability Deficits
            body: >-
              Because Garner does not permit physicians to directly access, inspect, or appeal their individual
              performance scores, the platform faces provider skepticism and potential legal or operational pushback if
              steerage decisions adversely impact physician practice volumes.
            calloutType: risk
            claimRefs:
              - CE005
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: A multi-sided buyer, user, and channel structure
        blocks:
          - type: paragraph
            body: >-
              Garner is sold primarily as an employer-sponsored benefit: employers fund the program, employees and
              dependents use the app and Concierge, and existing carriers and provider networks remain in place. The
              company also markets directly to health plans, which can add Garner to existing products to lower claims
              costs and improve renewal competitiveness, and to providers that may use its analytics and referral tools.
              This produces a multi-sided customer architecture rather than a single logo count. A benefits-marketplace
              listing adds a broker and HR distribution surface, describing Garner as an add-on for employers ranging
              from 50-life groups to Fortune 50 companies. The breadth is strategically useful, but the public count
              combines customers, clients, and partners, so it cannot be interpreted as a clean employer-logo
              denominator.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU007
          - type: table
