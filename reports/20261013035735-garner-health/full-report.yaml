  - id: TV002
    title: Thesis and Anti-Thesis
    columns:
      - Argument
      - Evidence supporting the view
      - Anti-thesis or uncertainty
      - What would change the view
    rows:
      - - Commercial scale
        - Garner reports almost 800 customers and more than 2.5M people served.
        - Brite reports 700+ employers, with no common date or denominator.
        - Reconcile active paying employers, covered lives, partners, and customers by period.
      - - Buyer economics
        - Garner claims an average 12% annual healthcare-spend reduction.
        - The reviewed evidence does not independently validate cohort-level savings.
        - Provide claims-based savings studies with matched controls and renewal outcomes.
      - - Deployment fit
        - Garner and Brite describe an overlay on existing plans without network replacement.
        - Members are still told to verify that recommended providers remain in network.
        - Show directory-accuracy service levels, appeals, and realized steerage by cohort.
      - - Revenue alignment
        - Fees are tied to savings targets and include administration and incentives.
        - Guarantees can reach 300% of fees for groups with 500 to 5,000 enrolled.
        - Disclose guarantee accruals, payouts, exclusions, and gross-to-net revenue treatment.
    notes: >-
      Customer scale and savings are company or partner claims; denominator, vintage, independent validation, and
      guarantee-payment history remain diligence items.
    claimRefs:
      - CV003
