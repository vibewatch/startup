            body: >-
              Garner Health avoids the common friction of narrow network health plans by overlaying existing insurance
              carrier networks with claims-based quality rankings and an employer-funded Health Reimbursement
              Arrangement that eliminates out-of-pocket costs when employees select Top Providers.
