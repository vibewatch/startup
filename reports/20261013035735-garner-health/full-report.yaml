      - number: '2.3'
        title: Buyers, Users, Payers, and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The clearest buyer groups in the retained evidence are self-insured employers, multi-employer trusts, and
              health plans or payers adding a navigation layer to existing benefits infrastructure. Employees and
              dependents are the users, while the employer funds the Garner HRA or HSA-linked incentive under the
              applicable plan design. Exact procurement titles and budget lines are not disclosed, so the buyer map
              avoids assigning unsupported executive owners. Brokers, TPAs, carriers, eligibility systems, and
              benefits-administration platforms are important distribution or implementation counterparts because data
              and workflow compatibility affect launch and measurement. Garner says it prices per employee per month,
              bundles administration and the maximum incentive payout into that fee, and ties fees to an agreed savings
              target; an independent procurement page says the exact rate card remains unpublished and custom.
            claimRefs:
