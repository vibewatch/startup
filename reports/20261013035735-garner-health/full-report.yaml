              - CU009
              - CU011
      - number: '6.3'
        title: Named references establish relevance, not deployment durability
        blocks:
          - type: paragraph
            body: >-
              Garner's company-issued financing release names USA Today, Paylocity, the University of Oklahoma, and ADM.
              ADM's benefits executive describes Garner as helping employees connect to eligible high-quality providers,
              which is stronger evidence than an unexplained logo, but the release does not disclose deployment dates,
              eligible populations, utilization, savings, renewal status, or whether each relationship is in full
              production. The named set spans media, benefits software, higher education, and a large global employer,
              supporting horizontal employer relevance. It does not establish representative outcomes across the
              reported customer base. The table therefore treats the list as a partial, press-release-derived sample and
              avoids assigning unreported results or production status.
            claimRefs:
              - CU005
              - CU006
          - type: table
            tableRef: TU003
            claimRefs:
              - CU004
              - CU005
              - CU006
      - number: '6.4'
        title: Retention and concentration remain the decisive diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Public evidence does not disclose NRR, GRR, logo churn, contract length, renewal rates, cohort retention,
              broker concentration, or revenue concentration by customer or channel. Garner says its PEPM fee includes
              administration and incentive payouts, is tied to an agreed savings target, and places up to 300% of fees
              at risk for groups with 500 to 5,000 enrolled and up to 100% for larger groups. That alignment may support
              renewals, but it is not retention evidence. Friction also remains visible: Garner tells members to verify
              network status before service, while an independent procurement synthesis reports recurring concerns about
              provider availability, reimbursement eligibility confusion, rankings that conflict with local reputation,
              and app login or account-setup failures. These issues should be tested against customer cohorts because
              they can suppress engagement and weaken savings realization.
            claimRefs:
              - CU012
              - CU013
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Scale claims do not resolve customer durability
            body: >-
              Garner's public customer and member counts are credible indicators of reach, but the retained evidence
              provides no renewal, churn, cohort, or concentration data and identifies member-access friction that could
              impair utilization.
            calloutType: risk
            claimRefs:
              - CU004
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Compliance Risks
        blocks:
          - type: paragraph
            body: >-
              Garner Health operates as an employer-sponsored health reimbursement arrangement (HRA) rather than an
              insurance carrier or risk-bearing provider, positioning the company outside state insurance licensing and
              medical underwriting mandates. However, this structure subjects Garner to complex federal regulatory
              frameworks under ERISA, Department of Labor benefit rules, and IRS regulations. Because Garner pairs its
              steerage incentives with health savings accounts (HSAs) and high-deductible health plans (HDHPs), it must
              carefully structure employer contributions to preserve employee HSA tax-advantaged status under federal
              rules, while navigating state income tax nuances across jurisdictions such as California and New Jersey
              that tax HSA deposits. Furthermore, Garner processes over 60 billion medical records across 320 million
              patient lives; while data is de-identified, any changes in federal privacy interpretations, state data
              privacy statutes, or healthcare algorithmic accountability rules could directly affect its data ingestion
              pipelines and provider scoring workflows.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR003
      - number: '7.2'
        title: Operational Reliability, Provider Ranking, and Algorithmic Risks
        blocks:
          - type: paragraph
            body: >-
              Operational execution at Garner centers on the integrity and timeliness of its clinical scoring algorithms
              and provider directory. Garner ranks providers across 80 sub-specialties using claims-based clinical
              quality metrics rather than subjective patient reviews. However, commercial medical claims data typically
              lags clinical encounters by 60 to 90 days, creating the risk that physician performance ratings or
              in-network participation statuses are outdated when an employee books care. While Garner verifies
              directory details through booking APIs and manual outreach to achieve a reported 92% directory accuracy,
              discrepancies in provider status or unverified changes in physician practice affiliations can lead to
              member friction and claims disputes. In addition, Garner's recent deployment of AI tools—such as the
              Garner Research Agent for automated medical literature parsing and the Garner Assistant for member
              navigation—introduces automated decision-support risks. Should steerage algorithms misinterpret clinical
              guidelines or fail to account for complex patient risk factors, Garner could face reputation damage or
              provider pushback regarding ranking transparency.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR007
      - number: '7.3'
        title: Counterparty Dependencies and Competitive Market Friction
        blocks:
          - type: paragraph
            body: >-
              Garner operates as an orchestration overlay that depends entirely on third-party healthcare
              infrastructure, including employers, health plans, benefits brokers, third-party administrators (TPAs),
              and HSA custodians. The company's go-to-market model relies heavily on benefits marketplaces such as Brite
              Benefits and brokerage distribution channels to access self-insured employers. Although Garner requires no
              plan design changes or network alterations, its integration requires ongoing eligibility data feeds and
              claims data sharing from employer health plans or TPAs. If major health plans or competing navigation
              incumbents restrict claims data access or develop competing proprietary steerage products, Garner's data
              intake could be constrained. Furthermore, the healthcare navigation sector is undergoing aggressive
              consolidation, with well-capitalized incumbents like Transcarent (incorporating Accolade), Quantum Health,
              and Included Health leveraging long-standing enterprise relationships and broader clinical service suites
              to defend market share against specialized analytics overlays.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR011
      - number: '7.4'
        title: Financial Contract Risks, Downside Guarantees, and Thesis Breaks
        blocks:
          - type: paragraph
            body: >-
              Garner's business model monetizes through a per-employee-per-month (PEPM) administrative fee that funds
              both operations and member out-of-pocket incentive reimbursements. To win commercial contracts, Garner
              offers performance guarantees that tie fees to a net trend target, backing these commitments with its own
              capital. For mid-market groups with 500 to 5,000 enrolled members, up to 300% of collected fees are
              guaranteed against performance targets, exposing Garner to balance-sheet downside if steerage rates fall
              short of targets or if member incentive payouts outpace plan claims savings. With annual recurring revenue
              reaching approximately $200 million following its $100 million Series E round at a $2.74 billion
              valuation, maintaining rapid revenue expansion requires sustaining a 46% member engagement rate across
              nearly 800 client organizations. A material breakdown in employer renewal rates, excessive guarantee
              payouts, or regulatory scrutiny over provider ranking methodologies represents key thesis-break triggers
              requiring rigorous monitoring.
            claimRefs:
              - CR013
              - CR014
              - CR015
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR013
              - CR014
              - CR015
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Downside Fee Guarantees Create Balance-Sheet Exposure
            body: >-
              Garner offers fee guarantees backing its net trend targets by up to 300% of collected fees for mid-market
              employer groups with 500 to 5,000 enrolled members. While this structure aligns vendor incentives with
              employer savings, it concentrates underwriting risk on Garner's balance sheet if steerage fails to offset
              incentive payouts during adverse utilization cycles.
            calloutType: risk
            claimRefs:
              - CR013
              - CR014
          - type: callout
            title: Competitive Squeeze from Consolidated Navigation Incumbents
            body: >-
              As legacy navigation vendors like Transcarent, Accolade, and Included Health bundle clinical advocacy with
              virtual primary care and surgery centers, Garner faces competitive pressure to prove that an
              algorithm-and-incentive overlay can defend long-term contract renewals against comprehensive benefits
              platforms.
            calloutType: risk
            claimRefs:
              - CR011
              - CR012
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Price-Sensitive Recommendation
        blocks:
          - type: paragraph
            body: >-
              Garner announced a $100 million Series E at a $2.74 billion valuation in May 2026, and Fierce Healthcare
              independently reported the same round amount and valuation. Against Garner's company-reported gross ARR of
              approximately $200 million, the headline mark equals about 13.7x gross ARR; that is a calculation, not a
              comparable-company multiple or an audited revenue multiple. The public evidence supports research-more,
              medium confidence, high risk, and a stretched valuation stance. A buy call would require a verified
              gross-to-net revenue bridge, durable retention, margin and cash-burn evidence, and investor terms that
              provide an adequate return path rather than relying on the headline mark alone.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV016
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV010
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV014
              - CV016
      - number: '8.2'
        title: Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis combines scale, measurable buyer value, and low-friction deployment. Garner says it serves
              almost 800 customers and more than 2.5 million people, while its product pages describe an overlay on
              existing health plans rather than a network replacement. The company also claims a 12% reduction in annual
              healthcare spend. The anti-thesis is that these claims remain largely company-issued, while public
              customer denominators are inconsistent: Brite describes 700-plus employers and Garner describes almost 800
              customers without a shared date or definition. The model also exposes Garner to performance guarantees,
              and the member FAQ warns that users should verify provider network status before service.
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV004
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
      - number: '8.3'
        title: Bull, Base, and Bear Cases Without False Precision
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not include audited projections, public-company trading data, relevant
              acquisition multiples, secondary marks, or preference terms, so a defensible dollar valuation range cannot
              be produced. The bull case requires audited evidence that gross ARR converts into attractive retained
              revenue and margins, customer cohorts remain durable, and guarantees do not create material payouts. The
              base case recognizes continued commercial scale but applies entry discipline below the unsupported
              headline multiple until those tests clear. The bear case combines weak gross-to-net conversion, guarantee
              payouts, customer-definition slippage, or network-accuracy friction. These are decision scenarios and
              probability signals, not probability estimates or forecasts.
            claimRefs:
              - CV005
              - CV009
              - CV010
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV009
              - CV010
              - CV013
              - CV014
              - CV016
      - number: '8.4'
        title: Financing Context, Exit Readiness, and Thesis-Break Tests
        blocks:
          - type: paragraph
            body: >-
              FundedIQ records $218 million raised across two rounds, while Fierce reports that the $100 million Series
              E followed a $118 million Series D by three months. Garner also disclosed a second employee tender offer,
              but no reviewed source states its price, participation, preference treatment, or effect on fully diluted
              ownership. Modern Healthcare's June 2 timestamp provides a fresh independent coverage signal but no
              additional usable transaction detail in the prefetched text. Exit readiness therefore cannot be translated
              into a target return or hold period. Diligence should obtain audited statements, cohort retention,
              guarantee-payment history, a fully diluted cap table, financing documents, tender materials, and credible
              public or M&A comparables; material failure on any of those items should reopen price and downside
              protection.
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Research More Before Pricing
            body: >-
              The evidence supports a credible operating company, but not a precise entry value. Obtain audited
              economics, cohort retention, guarantee history, financing terms, tender details, and relevant transaction
              or trading references before setting price, ownership, target return, or hold period.
            calloutType: recommendation
            claimRefs:
              - CV005
              - CV008
              - CV010
              - CV016
