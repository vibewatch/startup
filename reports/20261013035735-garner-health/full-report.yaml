  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The relevant market is the employee-facing guidance layer between benefits administration and care
              delivery. It includes provider search, benefits guidance, care coordination, claims or billing support,
              and incentives that influence where members seek care. It excludes direct clinical delivery,
              condition-specific treatment programs, and the carrier's internal utilization-management function, even
              when those products share navigation features. Garner's narrower wedge is provider steerage: its product
              is presented as an overlay on an employer's existing plan and network, with an employer-funded
              reimbursement mechanism attached to selected providers. That positioning makes carrier directories,
              carrier case-management programs, point solutions, and virtual-care providers adjacent substitutes rather
              than a single homogeneous competitor set. Category boundaries are still fluid because vendors increasingly
              bundle navigation with care delivery or condition-specific services.
            claimRefs:
              - CM001
              - CM002
              - CM003
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
