            title: Market traction is visible, but penetration is not
            body: >-
              Nearly 800 company-reported customers and approximately $200 million of gross ARR demonstrate commercial
              scale, but no retained source supplies the buyer or spend denominator needed to calculate penetration or
              market share.
            calloutType: insight
