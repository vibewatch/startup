        title: Evidence-Constrained Market Sizing
        blocks:
          - type: paragraph
            body: >-
              The assigned pool does not provide a defensible independent estimate of annual U.S. care-navigation spend,
              eligible employer counts, or a Garner-specific serviceable market. It therefore cannot support a
              conventional TAM/SAM/SOM or a market-share percentage. The usable sizing evidence is company scale: Fierce
              Healthcare reported 700 organizations and 2.5 million members in February 2026, while Garner's May 2026
              release described almost 800 customers, more than 2.5 million people, and approximately $200 million of
              gross annual recurring revenue. Those labels and dates must remain separate. Organizations are not
              necessarily equivalent to customers, people reached is not a buyer denominator, and gross ARR is neither
              market revenue nor cash. The evidence supports momentum and a lower-bound commercial footprint, not a
              total market value.
