              - CU004
              - CU007
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU003
              - CU014
      - number: '6.2'
        title: Scale is visible, but adoption evidence is vendor-led
        blocks:
          - type: paragraph
            body: >-
              The freshest public scale evidence is directionally consistent across Garner's May 2026 announcement and
              independent coverage: nearly 800 organizations and 2.5 million members. Garner further reports that 46% of
              eligible members use the platform, that the share of employees seeing top-performing providers nearly
              doubles from 23% to 43% in the first year for its first-dollar HSA model, and that employers average a 12%
              first-year reduction in healthcare spend. Those figures suggest meaningful activation beyond passive
              eligibility and a plausible land-and-expand story through richer incentive design. They are not
              independently audited in the retained evidence, however, and the sources do not disclose the
              eligible-member denominator by customer, cohort construction, implementation vintage, or distribution of
              outcomes.
            claimRefs:
              - CU004
              - CU008
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU004
