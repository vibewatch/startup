      - number: '2.4'
        title: Adoption Drivers, Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              Adoption depends on whether provider variation can be converted into measurable savings without forcing a
              network change. In a U.S. News interview, Garner's CEO said that, for most procedures within one city,
              complication rates differ by more than 400% between top- and bottom-quartile providers and
              common-procedure costs differ by more than 300%; these are company assertions carried through an editorial
              interview, not an independent benchmark. Garner also claims average first-year employer spend reduction of
              12% and more than 46% eligible-member platform use. The denominator matters: another company statement
              cited more than 60% usage among employees seeking care, which is not comparable to all eligible members.
              Constraints include claims-feed cooperation for ROI measurement, custom pricing, reimbursement eligibility
              rules, member willingness to change providers, and inconsistent public metric counts for the ranking
              methodology. These conditions make independently audited cohort savings and renewal retention more
              valuation-relevant than a broad market headline.
            claimRefs:
              - CM008
              - CM009
              - CM010
              - CM011
              - CM014
              - CM015
              - CM016
