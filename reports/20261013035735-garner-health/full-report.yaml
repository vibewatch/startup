            title: ROI proof depends on definitions and data access
            body: >-
              Garner's savings and engagement figures are company claims with differing denominators, while procurement
              evidence says claims-feed quality affects savings visibility. Diligence should require matched-cohort
              methodology, fee and incentive treatment, and renewal-level results.
            calloutType: risk
