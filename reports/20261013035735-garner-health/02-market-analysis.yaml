  evidenceGaps:
    - type: missing-source
      severity: material
      topic: market-sizing
      missingEvidence: >-
        An independent estimate of U.S. care-navigation category spend, eligible employer and payer counts, and a definition
        narrow enough to calculate Garner's TAM, SAM, SOM, and penetration.
      whyItMatters: >-
        Company reach and gross ARR demonstrate scale but cannot establish market share, remaining runway, or a valuation
        multiple against a clearly bounded market.
      diligencePath: >-
        Obtain a current independent benefits-market dataset with vendor-category definitions, buyer counts, category spend,
        and a bridge from employer medical spend to navigation fees.
      relatedQuestionRefs:
        - QM009
      relatedTableRefs:
        - TM002
    - type: private-evidence-only
      severity: material
      topic: roi-validation
      missingEvidence: >-
        Independently audited matched-cohort savings, engagement denominators, fees, incentive payouts, retention, and renewal
        results across multiple customer cohorts.
      whyItMatters: >-
        The 12% savings and engagement metrics are company claims, and valuation sensitivity depends on repeatable net savings
        after fees and incentives rather than gross program activity.
      diligencePath: >-
        Request cohort-level actuarial studies, contract definitions, customer references, and renewal analyses that reconcile
        gross claims, fees, incentives, case mix, and trend assumptions.
      relatedQuestionRefs:
        - QM009
    - type: conflicting-data
      severity: minor
      topic: methodology-disclosure
      missingEvidence: >-
        A dated methodology change log reconciling the February 2026 reference to 700 ranking metrics with current disclosures
        of 550-plus metrics across more than 80 specialties.
      whyItMatters: >-
        Metric-count changes may reflect different definitions or product evolution, but public materials do not explain the
        basis well enough to compare coverage over time.
      diligencePath: >-
        Request versioned methodology documentation defining metrics, specialty coverage, exclusions, validation, and change
        control.
      relatedQuestionRefs:
        - QM007
