company:
  name: Garner Health
chapter:
  number: 2
  title: Market Analysis
  summary: >-
    Garner addresses employer-sponsored care navigation through an overlay that combines provider-quality guidance with
    employer-funded incentives, rather than replacing the underlying carrier or network. The assigned evidence demonstrates
    commercial reach but does not establish an independent TAM, SAM, or SOM, so market sizing is constrained to dated company
    scale disclosures and explicit diligence gaps.
sections:
  - id: market-boundary-and-substitutes
    title: Market Boundary and Status-Quo Substitutes
    body: >-
      The relevant market is the employee-facing guidance layer between benefits administration and care delivery. It includes
      provider search, benefits guidance, care coordination, claims or billing support, and incentives that influence where
      members seek care. It excludes direct clinical delivery, condition-specific treatment programs, and the carrier's
      internal utilization-management function, even when those products share navigation features. Garner's narrower wedge
      is provider steerage: its product is presented as an overlay on an employer's existing plan and network, with an
      employer-funded reimbursement mechanism attached to selected providers. That positioning makes carrier directories,
      carrier case-management programs, point solutions, and virtual-care providers adjacent substitutes rather than a single
      homogeneous competitor set. Category boundaries are still fluid because vendors increasingly bundle navigation with
      care delivery or condition-specific services.
    claimRefs:
      - CM001
      - CM002
      - CM003
    tableRefs:
      - TM001
  - id: evidence-constrained-sizing
    title: Evidence-Constrained Market Sizing
    body: >-
      The assigned pool does not provide a defensible independent estimate of annual U.S. care-navigation spend, eligible
      employer counts, or a Garner-specific serviceable market. It therefore cannot support a conventional TAM/SAM/SOM or a
      market-share percentage. The usable sizing evidence is company scale: Fierce Healthcare reported 700 organizations and
      2.5 million members in February 2026, while Garner's May 2026 release described almost 800 customers, more than 2.5
      million people, and approximately $200 million of gross annual recurring revenue. Those labels and dates must remain
      separate. Organizations are not necessarily equivalent to customers, people reached is not a buyer denominator, and
      gross ARR is neither market revenue nor cash. The evidence supports momentum and a lower-bound commercial footprint,
      not a total market value.
    claimRefs:
      - CM004
      - CM005
      - CM006
      - CM007
    tableRefs:
      - TM002
    figureRefs:
      - FM001
  - id: buyers-users-and-budget-path
    title: Buyers, Users, Payers, and Adoption Path
    body: >-
      The clearest buyer groups in the retained evidence are self-insured employers, multi-employer trusts, and health plans
      or payers adding a navigation layer to existing benefits infrastructure. Employees and dependents are the users, while
      the employer funds the Garner HRA or HSA-linked incentive under the applicable plan design. Exact procurement titles and
      budget lines are not disclosed, so the buyer map avoids assigning unsupported executive owners. Brokers, TPAs, carriers,
      eligibility systems, and benefits-administration platforms are important distribution or implementation counterparts
      because data and workflow compatibility affect launch and measurement. Garner says it prices per employee per month,
      bundles administration and the maximum incentive payout into that fee, and ties fees to an agreed savings target; an
      independent procurement page says the exact rate card remains unpublished and custom.
    claimRefs:
      - CM003
      - CM012
      - CM013
    tableRefs:
      - TM003
  - id: drivers-constraints-and-valuation-relevance
    title: Adoption Drivers, Constraints, and Valuation Relevance
    body: >-
      Adoption depends on whether provider variation can be converted into measurable savings without forcing a network
      change. In a U.S. News interview, Garner's CEO said that, for most procedures within one city, complication rates differ
      by more than 400% between top- and bottom-quartile providers and common-procedure costs differ by more than 300%; these
      are company assertions carried through an editorial interview, not an independent benchmark. Garner also claims average
      first-year employer spend reduction of 12% and more than 46% eligible-member platform use. The denominator matters:
      another company statement cited more than 60% usage among employees seeking care, which is not comparable to all eligible
      members. Constraints include claims-feed cooperation for ROI measurement, custom pricing, reimbursement eligibility
      rules, member willingness to change providers, and inconsistent public metric counts for the ranking methodology. These
      conditions make independently audited cohort savings and renewal retention more valuation-relevant than a broad market
      headline.
    claimRefs:
      - CM008
      - CM009
      - CM010
      - CM011
      - CM014
      - CM015
      - CM016
