    title: Evidence Ladder from Market Boundary to Garner Scale
    type: pyramid
    summary: >-
      The retained evidence narrows from unquantified category layers to disclosed Garner scale without presenting a false
      proportional TAM/SAM/SOM.
    data:
      items:
        - label: U.S. employer healthcare spend
          value: Not established
          detail: The assigned pool does not quantify the broad spending boundary.
          tone: neutral
          claimRefs:
            - CM007
        - label: U.S. care-navigation category spend
          value: Not established
          detail: No retained independent category-spend estimate supports a TAM.
          tone: neutral
          claimRefs:
            - CM001
            - CM007
        - label: Eligible Garner buyer population
          value: Not established
          detail: Employer, trust, and payer buyer classes are identified, but their count is not.
          tone: neutral
          claimRefs:
            - CM003
            - CM007
        - label: Garner customer reach
          value: Almost 800
          unit: customers
          valueNote: Company disclosure from May 2026
          detail: The company did not define customer or provide a market denominator.
          tone: opportunity
          claimRefs:
            - CM005
        - label: Garner covered-person reach
          value: More than 2.5 million
          unit: people
          valueNote: Company disclosure from May 2026
          detail: Covered people are not equivalent to active users or paying customers.
          tone: opportunity
          claimRefs:
            - CM005
        - label: Garner gross ARR
          value: Approximately $200 million
          unit: gross annual recurring revenue
          valueNote: Company disclosure from May 2026
          detail: Gross ARR is not recognized revenue, cash, or market size.
          tone: opportunity
          claimRefs:
            - CM006
    approximationNotes: >-
      Items use different units and are not scale-comparable or proportional; the pyramid is an evidence-availability ladder,
      not a funnel or a quantitative TAM/SAM/SOM transformation.
    claimRefs:
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
callouts:
  - calloutType: insight
    title: Market traction is visible, but penetration is not
    body: >-
      Nearly 800 company-reported customers and approximately $200 million of gross ARR demonstrate commercial scale, but no
      retained source supplies the buyer or spend denominator needed to calculate penetration or market share.
    claimRefs:
      - CM005
      - CM006
      - CM007
  - calloutType: risk
    title: ROI proof depends on definitions and data access
    body: >-
      Garner's savings and engagement figures are company claims with differing denominators, while procurement evidence says
      claims-feed quality affects savings visibility. Diligence should require matched-cohort methodology, fee and incentive
      treatment, and renewal-level results.
    claimRefs:
      - CM010
      - CM011
      - CM014
