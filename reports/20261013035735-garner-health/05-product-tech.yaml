chapter:
  number: 5
  title: "Product & Technology"
  summary: "Garner Health delivers an employer-sponsored care navigation and claims steerage platform that identifies top-performing in-network clinicians using 60 billion medical records and reimburses member out-of-pocket costs via custom HRAs. The platform pairs a claims analytics scoring engine and LLM-assisted Research Agent with conversational member navigation tools, operating as a zero-refiling overlay across self-funded and fully insured health plans. Key technical diligence risks center on black-box provider score auditability, app login and claims adjudication friction, and upstream transparency data dependencies."
sections:
  - id: "core-workflow-and-platform-definition"
    title: "Core Platform and Service Definition in Customer Workflow Terms"
    claimRefs:
      - "CE001"
      - "CE003"
      - "CE007"
      - "CE011"
      - "CE013"
      - "CE014"
    tableRefs:
      - "TE002"
    body: >
      Garner Health operates as an employer-sponsored healthcare navigation platform and financial incentive overlay designed to guide plan members toward higher-performing doctors without requiring changes to underlying carrier networks or health plan designs. The customer workflow begins when an employee or covered dependent accesses the Garner mobile application or web portal to search for an in-network medical provider across more than 80 medical and surgical specialties. Rather than presenting static directory lists or subjective patient star ratings, the platform surfaces ranked Top Providers—physicians identified as scoring in the top 20% of clinical quality and procedural efficiency within their geographic market and insurance network. To overcome conventional employee inertia and drive active engagement, Garner couples clinical steerage with an employer-funded Health Reimbursement Arrangement (HRA) or IRS-compliant first-dollar HSA incentive model. When members complete an appointment or procedure with a designated Top Provider, the platform reimburses eligible out-of-pocket expenses such as copayments, diagnostic testing fees, and surgical deductibles, reducing member out-of-pocket costs by an average of 80%. This combination of objective clinical ranking and direct financial relief creates a clear behavioral incentive, achieving a reported 46% member engagement rate compared to standard industry navigation benchmarks of 10% to 20%.
  - id: "product-line-and-data-asset-map"
    title: "Product Portfolio, SKU Structure, and Healthcare Data Assets"
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE004"
      - "CE006"
      - "CE008"
      - "CE010"
      - "CE012"
    tableRefs:
      - "TE001"
    body: >
      Garner's commercial product portfolio spans three core operational assets serving members, enterprise plan sponsors, and healthcare provider organizations. For employees, the Garner Navigation App and Garner Assistant conversational agent serve as the primary consumer interfaces, supporting provider searches, automated appointment scheduling, health plan coverage translation, and real-time claim reimbursement status tracking. For self-insured corporations and commercial health plans, Garner provides administrative dashboards, HRA incentive account rule configuration, and claims reporting infrastructure that quantifies clinical complication reductions and employer healthcare trend savings, delivering an average 12% first-year net reduction in medical spend. In the provider market, Garner offers DataPro, an enterprise data and analytics solution that allows health systems and physician networks—including Mercy, Atlantic Health, Teladoc Health, and Marathon Health—to evaluate internal practice patterns and optimize specialist referral routing toward high-quality clinicians. On the developer and integration side, Garner maintains a public API surface on api.getgarner.com with contracts covering Facilities, Professionals, and Provider Annotations endpoints authenticated via OAuth 2.0 client credentials. However, provider-facing product access remains strictly one-directional: individual clinicians cannot view, audit, or appeal their specific quality metrics, preserving Garner's independent claims-derived methodology while creating an information asymmetry that limits provider self-remediation.
  - id: "technical-architecture-and-ai-infrastructure"
    title: "Technical Architecture, Quality Scoring Engine, and AI Infrastructure"
    claimRefs:
      - "CE002"
      - "CE004"
      - "CE005"
      - "CE006"
      - "CE007"
      - "CE008"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"
    body: >
      Garner's underlying technical architecture is anchored on a proprietary claims data warehouse comprising more than 60 billion de-identified medical records spanning 320 million longitudinal patient profiles nationwide. This repository integrates commercial insurance claims, Medicare and Medicaid records, and hospital price transparency data, covering an estimated 75% of all healthcare claims in the United States. To evaluate provider performance objectively, Garner measures each physician against more than 550 specialty-specific clinical quality and cost-efficiency metrics. The scoring pipeline first filters out extreme clinical complexities that cannot be statistically risk-adjusted, then normalizes remaining cases across patient comorbidities, clinical histories, and demographic factors. To keep clinical scoring synchronized with evolving medical science, Garner deploys the Garner Research Agent, an AI engine that systematically parses peer-reviewed medical journals and translates newly published clinical practice guidelines into algorithmic scoring parameters. On the user-facing side, the newly introduced Garner Assistant acts as a conversational front door that helps members resolve benefit inquiries and navigate care pathways. The end-to-end architecture operates as an asynchronous six-layer stack—spanning data ingestion, normalization, algorithmic guideline parsing, Top Provider directory scoring, HRA financial adjudication, and multi-channel client applications.
  - id: "deployment-integrations-and-governance"
    title: "Deployment, Integration Surfaces, Compliance, and Diligence Risks"
    claimRefs:
      - "CE003"
      - "CE005"
      - "CE008"
      - "CE009"
      - "CE011"
      - "CE012"
    body: >
      A primary operational advantage of Garner Health is its non-disruptive deployment model. The platform functions as a software and HRA overlay that integrates directly into existing employer benefit packages across self-insured, fully insured, and level-funded arrangements. Implementation requires no network redesign, no carrier replacement, and no medical plan refiling with state insurance regulators. To handle tax-advantaged accounts in compliance with Internal Revenue Service regulations, Garner supports first-dollar HSA models in partnership with major custodians including WEX, Optum, and HealthEquity, ensuring employer contributions preserve member HSA eligibility while rewarding Top Provider utilization. From a trust and security standpoint, Garner maintains SOC 2 Type II certification and processes claims data through de-identified pipelines to protect protected health information under HIPAA standards. Despite these technical strengths, diligence reveals operational friction points reflected in third-party reviews and user feedback. Members report intermittent mobile application login loops, confusion surrounding HRA reimbursement eligibility when seeing non-ranked ancillary providers during surgical episodes, and restricted Top Provider availability in less dense geographic markets. Furthermore, because provider scoring relies on rolling multi-month claims histories, updates to physician quality designations lag behind real-time clinical practice changes.
