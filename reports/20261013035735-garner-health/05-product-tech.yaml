figures:
  - id: "FE001"
    title: "Product architecture map"
    type: "stack"
    summary: "Six-layer architectural stack powering Garner Health from raw healthcare claims ingestion to member and enterprise engagement interfaces."
    data:
      layers:
        - label: "Layer 1: External Healthcare Data Ingestion"
          detail: "Ingests 60B+ de-identified commercial, Medicare, and Medicaid claims from 320M patients plus hospital and payer price transparency datasets."
        - label: "Layer 2: Data Normalization & Risk Adjustment"
          detail: "Normalizes longitudinal patient histories, excludes volatile high-complexity outliers, and risk-adjusts for patient comorbidities and demographic factors."
        - label: "Layer 3: Clinical Quality & Research Agent Engine"
          detail: "Applies 550+ specialty metrics across 80+ clinical areas, with the Garner Research Agent continuously scanning medical literature for updated guidelines."
        - label: "Layer 4: Provider Scoring & Directory Service"
          detail: "Calculates Top Provider rankings (top 20% tier) and maintains 92% accurate national physician contact, facility, and scheduling availability directories."
        - label: "Layer 5: Incentive & HRA Account Rules Engine"
          detail: "Configures employer-specific benefit designs, enforces IRS-compliant first-dollar HSA/HRA rules, and automates member out-of-pocket reimbursement eligibility."
        - label: "Layer 6: Engagement & Enterprise API Surfaces"
          detail: "Delivers member-facing mobile apps and Garner Assistant alongside partner REST APIs (Facilities, Professionals, Provider Annotations) via api.getgarner.com."
    approximationNotes: "Architecture layers synthesized from company technical overviews, APIs.io contracts, and Series E infrastructure disclosures; proprietary backend hosting details remain private."
    claimRefs:
      - "CE002"
      - "CE004"
      - "CE005"
