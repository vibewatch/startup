      - "CE007"
      - "CE008"
callouts:
  - calloutType: "insight"
    title: "Divergence Between Claims-Based Scoring and Consumer Reviews"
    body: "Garner's core architectural thesis is that consumer star ratings and physician credentialing fail to predict clinical outcomes. By grounding physician rankings in 60 billion claims records across 550 specialty metrics, Garner decouples provider quality assessment from subjective patient popularity."
    claimRefs:
      - "CE002"
      - "CE004"
      - "CE014"
  - calloutType: "risk"
    title: "Black-Box Provider Scoring and Physician Auditability Deficits"
    body: "Because Garner does not permit physicians to directly access, inspect, or appeal their individual performance scores, the platform faces provider skepticism and potential legal or operational pushback if steerage decisions adversely impact physician practice volumes."
    claimRefs:
      - "CE005"
      - "CE011"
      - "CE012"
