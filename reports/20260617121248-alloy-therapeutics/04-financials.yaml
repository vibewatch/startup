- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Best public proxy
  - What remains unknown
  - Exact diligence path
  rows:
  - - Recognized revenue by stream
    - Needed to judge scale, diversification, and quarter-to-quarter quality
    - Only contract structures and partner counts are public
    - Revenue contribution from services, subscriptions, upfronts, milestones, and royalties
    - Request audited 2024-2026 revenue bridge by stream and top 20 accounts
  - - Gross margin by business line
    - Needed to test whether breadth creates leverage or hides service-heavy cost burden
    - Product pages imply meaningful wet-lab and services content
    - Margin by discovery, platform access, pharmacology, development consulting, and cell-therapy support
    - Request gross-margin waterfall and fully loaded delivery-cost model
  - - Current cash, monthly burn, and runway
    - Core capital-adequacy question
    - Series E amount is public but cash is not
    - How much runway the company actually has after April 2026 financing
    - Obtain latest board materials or monthly finance pack
  - - Realized pricing and contract terms
    - Separates compelling packaging from actual monetization power
    - AbbVie/Biogen deal structures and subscription references
    - Price realization, discounting, payment milestones, and cancellation terms
    - Review representative contracts across each revenue stream
  - - Active paying-customer and renewal cohorts
    - Partner count is not the same as durable paying demand
    - 200+ partners and 100+ programs are public optics only
    - Number of active paying accounts, follow-on projects, churn, and concentration
    - Request customer cohort table with revenue, tenure, and next-step expansion rates
  - - Deferred revenue, backlog, and milestone probability
    - Needed to normalize lumpy collaboration economics
    - Public peers disclose more explicit revenue-recognition context
    - Signed but unrecognized value, weighted milestone expectations, and backlog burn-down
    - Build a booked-versus-recognized revenue schedule with probability weighting
  - - Working capital and vendor obligations
    - Important if Alloy is pushing further into downstream development and manufacturing handoff
    - Cell-therapy and pharmacology pages suggest external vendor coordination
    - DSO, contract liabilities, prepaid vendor commitments, lease burden, and minimum purchase obligations
    - Review monthly working-capital dashboard and major vendor agreements
  notes: Unresolved gaps are evidence gaps, not model omissions. The chapter can explain how Alloy probably makes money, but it cannot public-source the exact economics that decide underwriting.
