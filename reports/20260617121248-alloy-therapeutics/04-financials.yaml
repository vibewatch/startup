tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Mechanism
  - Public evidence
  - Quality / caveat
  - Diligence ask
  rows:
  - - Discovery services
    - Project-based antibody, bispecific, pharmacology, and development work
    - Official product pages and case studies repeatedly market integrated discovery and downstream support
    - Mechanism is clear, but no campaign pricing, win rates, or revenue share are disclosed
    - Request revenue by service line, average project value, and repeat-program rate
  - - Platform licenses or subscriptions
    - Technology access through licenses and flat-fee subscription packaging
    - Spannerwerks acquisition text references discovery-service access or flat-fee Innovation Subscriptions; news index lists multiple license-model announcements
    - Public sources confirm packaging exists but not list prices, renewal terms, or customer count
    - Request subscription price book, renewal cohorts, and share of revenue that is periodic rather than one-time
  - - Collaboration upfront and delivery fees
    - Platform-development agreements with early cash payments tied to access or delivery
    - AbbVie agreement discloses upfront payment plus additional payment on platform delivery
    - Visible for specific deals only; aggregate contribution to revenue is undisclosed
    - Request contract schedule for upfronts, delivery fees, and recognition timing
  - - Milestones and royalties
    - Back-ended economics tied to partner program progress or product success
    - Biogen collaboration discloses milestone eligibility and tiered royalties; official news lists other license agreements
    - Potentially high-value but inherently uncertain and lumpy
    - Request probability-adjusted milestone tree, realized receipts, and royalty-bearing programs in force
  - - Development and manufacturing-adjacent services
    - Pharmacology, cell-therapy development, IND support, consulting, and CDMO handoff
    - Pharmacology and cell-therapy pages plus Spannerwerks acquisition show development-support monetization beyond discovery
    - Likely labor and vendor intensive; no gross-margin disclosure
    - Request service gross margin by line and vendor pass-through policy
  - - Company creation or ecosystem monetization
    - Preferred partner offerings, venture-studio relationships, and ecosystem bundling may create indirect economics
    - News index references Wheeler Bio preferred services and multiple ecosystem collaborations
    - Economic capture is implied rather than quantified in public sources
    - Request whether Alloy earns equity, referral economics, or milestone participation through ecosystem partners
  notes: This table separates observed revenue mechanisms from inferred economics. Public sources show that the company monetizes through multiple contract forms, but they do not disclose stream-level revenue mix, deferred revenue, concentration, or renewal behavior.
