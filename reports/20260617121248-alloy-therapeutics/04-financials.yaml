  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: realized-pricing
    missingEvidence: List pricing, realized pricing, discounting, and payment schedules by revenue stream.
    whyItMatters: Packaging can be observed publicly, but pricing power and cash timing cannot be underwritten without actual contract economics.
    diligencePath: Review representative service, subscription, license, and collaboration contracts plus the latest quote-to-cash dashboard.
    relatedQuestionRefs:
    - QI003
    - QI005
    - QI025
    relatedTableRefs:
    - TI002
  - type: missing-source
    severity: material
    topic: sales-efficiency-cohorts
    missingEvidence: Active paying-account count, renewal rates, follow-on programs per account, and customer concentration.
    whyItMatters: Partner and program counts can overstate durable demand if many relationships are shallow, non-paying, or one-off.
    diligencePath: Request cohort analysis of customers by first-sale date, revenue, follow-on programs, and next renewal or milestone date.
    relatedQuestionRefs:
    - QI007
    - QI014
    - QI025
    relatedTableRefs:
    - TI001
    - TI005
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin by business line, fully loaded scientist cost, assay and compute cost, utilization, and vendor pass-through structure.
    whyItMatters: Without unit economics, investors cannot tell whether Alloy’s breadth creates leverage or hides a service-heavy cost base.
    diligencePath: Obtain management reporting for gross margin and utilization by discovery services, platform access, pharmacology, development support, and cell-therapy work.
    relatedQuestionRefs:
    - QI015
    - QI016
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: blocking
    topic: cash-burn-runway
    missingEvidence: Current cash, monthly burn, board-approved runway, and any debt or covenant schedule.
    whyItMatters: Capital adequacy cannot be responsibly judged from the Series E amount alone.
    diligencePath: Review latest monthly finance pack, cash forecast, debt schedule, and board materials prepared after the Series E close.
    relatedQuestionRefs:
    - QI018
    - QI019
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: revenue-recognition-backlog
    missingEvidence: Revenue by stream, deferred revenue, backlog, and milestone probability weighting.
    whyItMatters: A mixed model of services, upfronts, milestones, and royalties can look healthier or weaker than reality depending on recognition timing.
    diligencePath: Build a booked-versus-recognized revenue bridge for the last eight quarters with milestone status and backlog aging.
    relatedQuestionRefs:
    - QI014
    - QI022
    - QI026
    relatedTableRefs:
    - TI001
    - TI005
