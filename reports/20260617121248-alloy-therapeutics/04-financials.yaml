- id: TI002
  title: Pricing / monetization table
  columns:
  - Commercial element
  - Publicly visible term
  - What is still missing
  - Analytical implication
  rows:
  - - Innovation Subscriptions
    - Flat-fee access is publicly referenced
    - Actual subscription fee, scope, renewal cadence, and customer count
    - Supports recurring-potential narrative but not recurring-revenue proof
  - - Discovery-service projects
    - No public price card
    - Campaign fees, discounts, change-order dynamics, and realization vs quote
    - Likely bespoke pricing keeps comparability low and revenue lumpy
  - - AbbVie antibody-platform agreement
    - Upfront payment plus additional payment on platform delivery
    - Magnitude of payments, exclusivity, and follow-on milestone structure
    - Confirms near-term cash plus milestone-style packaging
  - - Biogen AntiClastic collaboration
    - Upfront payment, milestones, and tiered royalties
    - Target count economics, duration, and expected revenue timing
    - Confirms back-ended optionality alongside upfront cash
  - - Idea-to-human-data message
    - Company claims programs can move from idea to human data for less than $10M
    - Whether this is a buyer budget proxy, Alloy revenue proxy, or total program cost proxy
    - Useful commercial positioning signal, not a recognized pricing metric
  - - Cell-therapy and development services
    - Integrated discovery-to-manufacturing support with preferred CDMO or partner tech transfer
    - Service package pricing, CMC pass-throughs, and margin split with external vendors
    - Suggests larger contract values but higher delivery-cost complexity
  notes: Alloy publicly discloses contract structures more often than prices. The chapter therefore treats packaging as an observed fact and realized pricing as a private diligence item.
