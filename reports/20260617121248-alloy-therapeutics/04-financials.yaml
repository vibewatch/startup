company:
  name: Alloy Therapeutics
chapter:
  number: 4
  title: Financials
  summary: Alloy Therapeutics presents a diversified monetization architecture spanning discovery services, platform licenses or subscriptions, upfront collaboration fees, downstream milestones and royalties, and development-support services, but the reviewed public pack does not disclose revenue, ARR, gross margin, burn, cash, runway, or retention. The clearest public financial fact is the April 2026 $40 million Series E at a $1 billion valuation, plus stated use of funds across discovery, downstream services, and the AI or data layer. Relative to public peers such as Generate, Recursion, AbCellera, Schrödinger, and Evotec, Alloy looks commercially broad but financially under-disclosed, so underwriting still depends on private evidence rather than public numbers.
sections:
- id: revenue-model-and-monetization
  title: Revenue model and monetization architecture
  body: 'Alloy’s public materials support a multi-surface monetization model rather than a single SKU. The company sells AI-enabled discovery platforms and wet or dry lab services to large biopharma, smaller biotech, academics, entrepreneurs, nonprofits, and venture-backed builders. The public record shows several distinct commercial mechanisms: discovery service relationships, flat-fee Innovation Subscriptions, platform licenses, collaboration agreements that include upfront and delivery-linked payments, and downstream milestone or royalty participation. Product pages extend that model into pharmacology, cell-therapy development, antibody optimization, bispecific discovery, and genetic-medicines work, implying that Alloy can capture revenue both at early discovery and later development handoff points. What remains absent is the mix: public sources do not say how much revenue comes from services versus licenses, how subscription pricing works in practice, or what portion of the base is one-time
    project work versus repeat or recurring demand. That mix uncertainty matters because the same breadth that strengthens strategic positioning can also mask a lumpy, custom-services P&L.'
