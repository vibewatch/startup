- id: capital-adequacy-and-peer-disclosure-context
  title: Capital adequacy and peer disclosure context
  body: 'The best-supported capital datapoint is the April 2026 Series E: $40 million at a $1 billion valuation, with stated uses in core discovery modalities, downstream preclinical and clinical services, and the AI or data layer. That is enough to show investor support and strategic expansion intent, but not enough to prove runway. Reviewed public materials do not disclose current cash, monthly burn, runway, debt facilities, covenant load, or next-round triggers. An archived Crunchbase page indicates Alloy’s prior last funding type was Series D, confirming an earlier financing history without giving a public cumulative-capital bridge. Public peers highlight the disclosure gap. Generate discloses quarterly revenue, cash, operating cash burn, and runway. Recursion discloses annual revenue, cash, cash operating expense, and milestone receipts. AbCellera separates research fees from milestone and licensing revenue. Schrödinger discloses software revenue, ACV, gross margin, retention, and cash.
    Evotec publishes segment revenue, liquidity, EBITDA, and even a public IR publications archive. Those disclosures do not tell us Alloy’s numbers, but they do show the minimum financial transparency available in adjacent public models. Against that standard, Alloy is still a thesis about monetization mechanisms and capital access, not about demonstrated public conversion economics.'
