- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Revenue / ARR
    - Not publicly disclosed
    - Low
    - Prevents basic scale and operating-leverage analysis
    - Obtain 2024-2026 recognized revenue by stream and current annualized run rate
  - - Gross margin / contribution margin
    - Not publicly disclosed
    - Low
    - Determines whether Alloy behaves like a software-plus-data model or a service-heavy CRO model
    - Provide gross margin by discovery services, platform access, and downstream development services
  - - Average contract value / realized pricing
    - Not publicly disclosed
    - Low
    - Needed to distinguish many small projects from a smaller number of strategic accounts
    - Share ACV or average program value by contract type
  - - Cycle-time proxy
    - Mediar says Alloy moved candidates downstream six months earlier than expected; Alloy claims < $10M from idea to human data
    - Medium
    - Speed is one of the few public ROI signals
    - Show time-to-hit, time-to-lead, IND timeline, and budget outcomes across customer cohorts
  - - Primary cost drivers
    - Wet-lab scientists, assay throughput, AI/compute, pharmacology execution, development consulting, and partner-vendor handoff
    - Medium
    - Helps frame whether margins should expand mainly from software leverage or from utilization discipline
    - Provide fully loaded scientist cost, assay cost, cloud/compute cost, and vendor pass-throughs
  - - Capital intensity
    - Moderate at discovery layer, higher where services extend into development or manufacturing-adjacent work
    - Medium
    - Determines cash conversion and need for further financing
    - Break out capex, software/data spend, and external manufacturing obligations
  - - Revenue-mix sensitivity
    - Likely a blend of steadier services/subscriptions and lumpy upfront or milestone economics
    - Medium
    - Lumpy mix can distort quarters and mask underlying retention
    - Show trailing eight-quarter revenue by stream and deferred-revenue or backlog bridges
  - - Working capital / cash conversion
    - Not publicly disclosed
    - Low
    - Important for runway and near-term financing dependence
    - Provide DSO, contract liabilities, prepaid vendor commitments, and cash conversion cycle
  notes: Every null-equivalent field is intentional. The reviewed public pack provides mechanism-level evidence but almost no numeric unit-economics disclosure for Alloy itself.
  claimRefs:
  - CI013
  - CI014
  - CI017
  - CI018
  - CI019
  - CI041
- id: TI004
  title: Capital adequacy table
  columns:
  - Item
  - Public status
  - Evidence
  - Implication
  - Diligence ask
  rows:
  - - Latest financing
    - $40M Series E at $1B valuation
    - Official April 2026 financing release
    - Supports continued investor access and late-stage private-market credibility
    - Confirm close date, gross-to-net proceeds, and post-close cash on hand
  - - Use of funds
    - Discovery expansion, downstream services, AI/ML and data layer
    - Official Series E release
    - Capital is being spread across both core discovery and more operationally heavy downstream services
    - Request 24-month budget allocation by business line
  - - Prior financing history
    - Earlier rounds existed; archived Crunchbase listed Series D as prior last funding type
    - Archived third-party profile
    - Confirms Series E is not first institutional capital, but cumulative total remains opaque
    - Request full round-by-round capitalization table
  - - Cash on hand
    - Not publicly disclosed
    - No reviewed source gives current cash balance
    - Runway cannot be underwritten from public materials
    - Provide latest month-end cash and restricted-cash balances
  - - Burn / runway
    - Not publicly disclosed
    - No reviewed source gives monthly burn or runway months
    - Cannot test whether $40M is bridge capital or multi-year runway
    - Provide 12-month burn bridge and board-approved runway scenario
  - - Debt / project-finance obligations
    - No public debt facility or project-finance obligation found in reviewed pack
    - Absence across official financing and news materials
    - Good if truly absent, but covenant risk cannot be ruled out from public sources
    - Confirm debt, venture lending, equipment leases, and minimum-commitment obligations
  - - Capital intensity direction
    - Rising with development support, CDMO interfaces, and broader service scope
    - Product pages and Spannerwerks expansion
    - Downstream expansion may require more working capital and lower margins than discovery-only services
    - Provide capex, vendor-prepay, and headcount plans by expansion area
  - - Peer disclosure benchmark
    - Public peers disclose cash, burn/runway, segment revenue, or gross-margin proxies
    - Generate, Recursion, AbCellera, Schrödinger, and Evotec disclosures
    - Alloy is well below public-peer transparency standards
    - Prepare management package mirroring peer disclosure categories even if kept private
  notes: 'This table is intentionally conservative: it treats the Series E as fact, the lack of cash and burn disclosure as a real blocker, and peer disclosures only as context rather than as substitutes for Alloy’s own numbers.'
