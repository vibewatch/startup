- id: pricing-packaging-and-unit-economics
  title: Pricing, packaging, and unit-economics signals
  body: 'Public pricing transparency is thin. Alloy’s strongest public commercial signals are structural, not numeric: its Spannerwerks acquisition text says partners can access technology through discovery services or a flat-fee Innovation Subscriptions offering; the AbbVie agreement discloses upfront and delivery-linked payments; the Biogen agreement discloses upfronts, milestones, and tiered royalties; and Alloy Insights claims teams can move from idea to human data for less than $10 million. That last figure is useful as a marketing anchor for customer value, but it is not a price list, a recognized-revenue figure, or a disclosed gross-margin outcome. The Mediar case study is similarly helpful but incomplete: moving candidates six months faster than expected is a real speed proxy, yet it still does not reveal realized ASPs, campaign profitability, or renewal behavior. Cost structure can only be inferred. Product pages repeatedly emphasize AI models paired with wet-lab validation, pharmacology
    execution, manufacturing handoff, IND support, and development consulting, which suggests a business with meaningful scientist, assay, vendor, and program-management costs rather than software-like marginal economics. That makes Alloy’s undisclosed gross margin and contribution margin central diligence gaps.'
