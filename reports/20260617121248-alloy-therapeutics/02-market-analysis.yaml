        - { id: friction, label: "Friction: data quality, IP, validation, switching cost" }
        - { id: mission, label: "Adjacency: venture-studio or mission-partner program" }
      edges:
        - { from: need, to: pilot, label: "outsource vs build decision" }
        - { from: pilot, to: data, label: "prove model + biology" }
        - { from: data, to: expansion, label: "trust increases" }
        - { from: expansion, to: ind, label: "workflow extends downstream" }
        - { from: ind, to: economics, label: "revenue conversion" }
        - { from: pilot, to: friction, label: "pilot trap risk" }
        - { from: friction, to: mission, label: "selective alternate use cases" }
        - { from: expansion, to: mission, label: "newco / preparedness optionality" }
    approximationNotes: >-
      The map is qualitative and is meant to show conversion logic rather than a measured funnel with
      disclosed Alloy stage-by-stage win rates.
    claimRefs: [CM024, CM026, CM028, CM029, CM030, CM031, CM039, CM040, CM045]
callouts:
  - calloutType: insight
    title: Broad TAM is directionally useful but not underwritable alone
    body: >-
      The decisive market question is not whether AI in drug discovery is large. It is how much of
      the narrower outsourced biologics-infrastructure spend Alloy can actually convert into repeatable
      collaboration revenue.
    claimRefs: [CM012, CM013, CM017, CM022, CM047, CM048]
  - calloutType: strength
    title: Alloy is selling a workflow, not only a model
    body: >-
      Alloy's positioning is strongest where buyers want AI paired with wet-lab validation,
      pharmacology, and discovery-to-IND support rather than a standalone software layer.
    claimRefs: [CM002, CM003, CM010, CM031, CM033, CM039]
  - calloutType: risk
    title: Trust, data quality, and capital intensity still cap adoption
    body: >-
      Public peers and current reviews show that integrated AI-drug-discovery platforms still face
      real validation friction, selective buyer demand, and sustained cash burn even when the market
      narrative is attractive.
    claimRefs: [CM037, CM038, CM040, CM041, CM042, CM043]
