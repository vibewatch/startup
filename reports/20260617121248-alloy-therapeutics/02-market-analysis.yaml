  - id: FM004
    title: Adoption funnel or value-chain map
    type: flow
    layout: wide
    summary: >-
      Typical adoption path from buyer problem to expanded Alloy engagement, showing where trust,
      data, and handoff constraints can stop conversion.
    data:
