        - { id: need, label: "Buyer need: faster, cheaper, de-risked discovery" }
        - { id: pilot, label: "Initial platform / service pilot" }
        - { id: data, label: "Wet-lab validation + decision-quality data" }
        - { id: expansion, label: "Expanded modality or multi-program scope" }
        - { id: ind, label: "Preclinical / IND support and CMC handoff" }
