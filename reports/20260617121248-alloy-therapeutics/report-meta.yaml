companyProfile:
  summary: >-
    Alloy Therapeutics is a Waltham, Massachusetts biotech-infrastructure company that publicly
    positions itself as an AI-enabled, multi-modality drug discovery and development ecosystem.
    Public materials consistently cite a 2017 founding, though the original brief carried 2018.
    Founder, CEO, and chairman Errik Anderson leads a business that serves pharma, biotech,
    academics, and venture-backed builders through collaborative platform access, scientific
    services, downstream development support, and company-creation capabilities rather than a
    single internal therapeutic asset. By April 2026 the company reported 200+ partners, 100+
    licensed therapeutic programs, and 22 clinical programs while remaining materially
    under-disclosed on revenue, cumulative capital raised, and total headcount.
  foundedDate: "2017-01-01"
  founders:
    - name: Errik Anderson
      role: Founder, CEO & Chairman
      claimRefs: [CO007]
  foundingLocation: Waltham, Massachusetts, US
  headquarters: Waltham, Massachusetts, US
  productSummary: >-
    Alloy sells an integrated biotech infrastructure stack spanning antibody and bispecific
    discovery, TCRm discovery, genetic medicines, cell-therapy infrastructure, pharmacology,
    AI/ML-enabled discovery tools, and downstream development or manufacturing-adjacent support.
  customerFocus: >-
    Large biopharma, small and mid-sized biotech, academics, nonprofits, entrepreneurs,
    virtual biotechs, and VC-backed builders seeking outsourced discovery and development
    infrastructure.
  businessModel: >-
    Discovery services, platform licenses or subscriptions, collaboration upfronts, milestones,
    royalties, downstream development support, and company-creation or ecosystem monetization.
  stage: Series E / late-stage private biotech-infrastructure company
  fundingStatus: >-
    Latest public financing was a $40M Series E announced on 2026-04-15 at a $1.0B valuation;
    prior financing history exists, but cumulative capital raised remains under-disclosed in the
    reviewed public source set.
  disclosureProfile: private-undisclosed
  claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO015, CO022, CO023, CE001, CE027, CI015]
summary:
  headline: >-
    Alloy Therapeutics looks strategically relevant and partner-rich, but the current $1.0B mark
    already assumes durable economics that public disclosures do not yet substantiate.
