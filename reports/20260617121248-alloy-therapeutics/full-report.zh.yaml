      - CU011
      - CU016
      - CU019
      - CU021
      - CU023
      - CU031
      - CU035
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 比较 Alloy 主要风险类别在发生可能性、影响、缓释成熟度和剩余敞口上的差异。
    data:
      columns:
        - 发生可能性
        - 影响
        - 缓释成熟度
        - 剩余敞口
      rows:
        - label: AI / 转化
          values:
            - 高
            - 严重
            - 中等
            - 高
        - label: 监管 / 法律
          values:
            - 中
            - 高
            - 早期
            - 高
        - label: 安全 / 隐私
          values:
            - 中
            - 高
            - 早期
            - 高
        - label: 合作伙伴 / 集中度
          values:
            - 中高
            - 高
            - 中等
            - 高
        - label: 人员 / 执行
          values:
            - 中
            - 高
            - 中等
            - 中高
        - label: 估值 / 融资
          values:
            - 中
            - 中高
            - 早期
            - 中高
    approximationNotes: 单元格是有序投资判断，不是经验概率。剩余敞口只假设公开材料中可见的缓释措施，不包含未披露的 NDA 信息。
    claimRefs:
