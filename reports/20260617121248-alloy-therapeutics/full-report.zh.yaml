      - number: '2.3'
        title: 买方分群、预算所有者与采用路径
        blocks:
          - type: paragraph
            body: >-
              Alloy
              自己的合作页面点出了实际买方范围：大型生物制药公司、中小型生物技术公司、创业者、VC、非营利组织和学术机构。大型药企是当前最清晰的预算所有者，因为分析师市场数据仍显示药企和生物技术公司是最大终端用户分群，Generate、Schrödinger、AbCellera
              等平台供应商也都指向合作密集模式，靠外部 R&D 预算而非商业 P&L 变现。新兴生物技术公司和虚拟生物技术买方可能从单一资产或模态起步，购买 Alloy
              是为了提高现金效率、获得灵活执行能力，并在不搭建完整内部发现栈的情况下拿到可决策数据。学术机构和非营利组织既是发现平台的直接用户，也是未来转化项目的来源。Venture studio 和 newco
              尤其相关，因为 Alloy 的生态盟友模式从发现延伸到临床前、监管和 CMC 交接。政府和生物安全买方目前是新兴相邻市场，而非已经验证的核心收入流：Alloy 的 Vigilance 部门明确面向 mission
              partners；AbCellera 和 Evotec 等同行则显示，当快速响应或韧性供应链重要时，公共卫生和准备型买方可以为平台基础设施买单。
