        - id: n5
          label: 无公开收入 / 利润率 / 现金消耗
        - id: n6
          label: 有收入的公开可比公司交易区间相同
        - id: n7
          label: 业务质量 > 价格清晰度
        - id: n8
          label: 推荐：继续研究
      edges:
        - from: n1
          to: n7
          label: 支撑
        - from: n2
          to: n7
          label: 支撑
        - from: n3
          to: n7
          label: 支撑
        - from: n4
          to: n8
          label: 入场锚点
        - from: n5
          to: n8
          label: 阻碍投资判断
        - from: n6
          to: n8
          label: 限制上行
        - from: n7
          to: n8
          label: 价格敏感结论
    approximationNotes: 节点表达的是分析链条，不是公司披露的流程图。
    claimRefs:
      - CV003
      - CV004
      - CV009
      - CV025
      - CV029
      - CV041
