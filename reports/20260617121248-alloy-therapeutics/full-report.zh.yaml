      - number: '5.2'
        title: 运营工作流与架构
        blocks:
          - type: paragraph
            body: >-
              最清晰的公开工作流从伙伴的目标产品画像或生物学问题开始，再按模态分支进入发现引擎；Alloy 声称这些引擎由 AI 和共享湿实验室执行串在一起。在抗体领域，项目从转基因小鼠启动，经过免疫、B
              细胞富集、测序、repertoire mining，再进入高通量表达、表征和功能测试。同一架构横向延伸：Keyway 为 TCRm 项目加入 peptide-MHC 特异性发现和脱靶测试；AntiClastic
              为寡核苷酸资产加入 AI 引导 RNA 设计、体外和体内测试及迭代；药理学加入 TPP 主导的实验设计和人源化模型读数；细胞治疗加入 iPSC 工程、制造交接和 IND 支持。运营上，Alloy
              卖的不是孤立算法，而是一串决策关口，把设计、筛选、优化、转化测试和外部开发接口组合起来。这个架构吸引精简生物技术团队，因为它降低内部搭建要求；但执行质量也更依赖跨地点湿实验室
              throughput、伙伴数据质量和伙伴 - 供应商协调，而不是只靠软件。
