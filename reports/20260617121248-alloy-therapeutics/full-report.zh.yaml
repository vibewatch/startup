              留存是本章最不透明的部分。Alloy 没有披露 NRR、GRR、流失、续约率、按分群划分的客户数或大客户收入占比，因此没有基础声称 SaaS 式耐久指标。可用证据是定性的。Biogen 2026 年 ASO
