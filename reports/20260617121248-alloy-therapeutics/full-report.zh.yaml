        - 2026 年官方融资中具名
        - 可能是有意义的后期优先股持有人
        - 确认董事会或观察员权利及持股 %
      - - JIC Venture Growth Investments
        - 新 Series E 投资人
        - 2026 年官方融资中具名
        - 增加日本生态系统和政策关联信誉
        - 确认投资金额和地理战略条款
      - - Echo Capital
        - 新 Series E 投资人
        - 2026 年官方融资中具名
        - 新资金财团的一部分
        - 确认票据规模和后续投资权
      - - Mubadala Capital
        - 既有投资人
        - 在 Series E 中被列为回归投资人
        - 释放内部投资人持续支持信号
        - 确认进入轮次、持股和治理权利
      - - Founders Fund / Thiel Capital
        - 既有投资人
        - 在 Series E 中被列为回归投资人
        - 高品牌股权结构表信号；潜在网络价值
        - 拆分实体层面的持股和影响力
      - - Alexandria Venture Investments
        - 既有投资人
        - 在 Series E 中被列为回归投资人
        - 战略生命科学网络价值
        - 确认关系是否超出股权
