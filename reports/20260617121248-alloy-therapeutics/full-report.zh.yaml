  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Alloy 的公开材料始终把公司描述为生物药发现与开发中的 AI
              驱动合作伙伴，而不是单资产治疗公司。因此，应纳入的支出是从靶点想法到可入临床候选物之间的外包或合作型基础设施预算：抗体和双特异性抗体发现、转基因平台访问、TCRm 发现、AI
              引导的先导物设计、药理学、遗传药物序列设计、细胞治疗赋能，以及相邻的发现到 IND 支持。边界应窄于整体药企 R&D，因为大型药企仍保留有意义的内部发现能力；也应窄于广义 CRO 或 CDMO 市场，因为
              Alloy 页面强调候选物创造、验证和交接，而不是常规下游服务或商业化制造。最接近的现状替代方案包括内部发现团队，Adimab 和 AbCellera 等生物药专业合作伙伴，Schrödinger
              等软件优先平台，以及 Evotec 等更广泛的整合 R&D 提供商。这一框定很关键：从自上而下的 AI 视角看，市场会显得很大；但落到 Alloy 能现实获取的支出子集，市场要小得多。
