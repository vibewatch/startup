      - - Generate Biomedicines
        - 2025 年收入 $31.89M；2026 年 6 月市值约 $1.71B；2026 年 2 月 IPO 融资 $400M。
        - 公开 AI 生物科技平台，交易水平远高于收入，但披露完整。
        - 展示一个新上市 AI 生物科技故事，在 IPO 现金和财务报表加持下能拿到什么定价。
        - 公司已上市、处于临床阶段，与 Alloy 的服务加平台组合不可直接相比。
      - - AbCellera
        - 2025 年收入 $75.1M；2026 年 6 月市值约 $1.55B；流动性约 $700M。
        - 平台型 biotech，披露收入、现金，并持续亏损。
        - 可作为公开生物制剂赋能业务的参照，且财务可见度真实。
        - 模态重点不同，公开公司披露体系也更成熟。
      - - Recursion
        - 2025 年收入约 $74.7M；2026 年 6 月市值约 $1.68B；现金约 $754M。
        - AI 原生 techbio 平台，现金充足但亏损很重。
        - 有助于参照公开投资者愿意为一个拥有真实资产和烧钱披露的 AI 驱动发现故事支付什么价格。
        - Recursion 偏小分子和临床管线，而不是优先生物制剂基础设施。
      - - Schrödinger
        - 2025 年收入 $255.9M；2026 年 6 月市值约 $1.11B；披露软件 ACV 和留存。
        - 更像软件的发现平台，但估值接近 Alloy 定价。
        - 说明 KPI 透明度和软件经济性在今天并不会自动换来巨大溢价。
        - 业务结构更偏软件和计算化学，不同于 Alloy 的湿实验基础设施模型。
      - - Evotec
        - 2025 年收入 €788.4M；2026 年 6 月市值约 $0.95B。
        - 规模化服务和合作开发平台，公开市场给出的价值偏冷。
        - 当平台故事看起来服务占比很高时，公开市场愿意支付什么价格，Evotec 是有用警示。
        - 规模大得多，公司历史也不同。
      - - insitro
        - 私有可比公司；Tracxn 快照显示已融资 $643M，仍处 Series C。
        - 高质量背景可比公司，但没有干净的公开估值证据。
        - 有助于校准 ML 优先药物发现的业务质量和私募市场热情。
        - 没有公开收入或当前估值锚。
      - - Adimab
        - 140+ 合作关系、675+ 已启动项目、90+ 临床项目、6 个商业化产品。
        - 成熟生物制剂基础设施可比公司，用于产出参照，而不是定价。
        - 展示规模化抗体赋能平台的产出上限。
        - 没有公开估值或财务披露。
    notes: 表格只是列出部分对决策有用的公开和私有参照，并不是说任何一个倍数可以直接套用到 Alloy。
