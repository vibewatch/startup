      - number: '1.4'
        title: 规模、布局与服务宽度
        blocks:
          - type: paragraph
            body: >-
              Alloy 公开披露的规模主要用合作伙伴、项目和科研能力来表达，而不是收入或客户数。Series E 材料称，公司服务超过 200 家合作伙伴，拥有 100+ 已授权治疗项目，并已有 22
              个项目进入临床开发，其中包括两个 Phase 3 资产。2026 年 2 月 Mediar 新闻稿用了略有差异的口径——超过 100 个活跃药物项目和 20+ IND 申报——指向相近规模，但不同公告之间 KPI
              并未完全标准化。官网关于页面补充了 100+ 科学家的人员信号，但已审阅公开来源没有披露总员工数、收入、ARR 或客户集中度。技术上，Alloy
              覆盖抗体、双特异性抗体、TCRm、遗传药物、细胞治疗、药物递送和药理学，同时强调在大型自有实验数据上训练 AI/ML 模型，并与全球湿实验室执行配套。这样的宽度支撑管理层把 Alloy
              定位为全栈生物技术基础设施层，而不是狭窄的平台许可方。
