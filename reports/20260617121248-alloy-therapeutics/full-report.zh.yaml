      - number: '8.4'
        title: 可比公司、方法选择与价格为何偏满
        blocks:
          - type: paragraph
            body: >-
              没有单一可比公司能完全匹配 Alloy。Generate 是最接近的公开 AI 生物科技平台，刚进入市场定价发现，但它是临床阶段上市公司，带有 IPO 现金和可见损益表。AbCellera 和 Recursion
              有参考价值，因为两者在仍承受平台生物科技亏损的同时，披露了有意义的现金余额和收入。Schrödinger 最能说明一个更像软件的发现平台在披露 ACV、留存和毛利率后可以长什么样。Evotec
              则是警示性端点：当发现和开发能力变成规模化、服务较重的运营模型时，收入可以很大，股权价值却保持低迷。insitro 和 Adimab 等私有同行有助于理解业务质量背景，但因透明度低得多，不能用于精确定价。


              因此，正确方法是三角校准，而不是套单一倍数。公开市场实际在说：AI 生物科技平台即便披露收入，只要还没证明差异化经济性、耐久软件属性或异常战略性资产，也可能只在一二十亿美元附近交易。因此，并不需要 Alloy
              是一家差公司，当前估值才会显得偏满；它只需要是一家好公司，但披露还不足以支撑相对已展示真实收入、资产负债表强度和 KPI
              透明度的公开公司获得大幅溢价。这就是为什么建议是价格敏感，而不是论点为负：可比组支持尊重这门业务，但不支持从已知入场点承销重大上行。
