  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集群与 Alloy 的相对位置
        blocks:
          - type: paragraph
            body: >-
              分析 Alloy 时，应把它放进四个重叠的竞争集群，而不是一个简单同业组。第一类是直接抗体发现专家，以 Adimab 和 AbCellera
              为代表；买方在可信生物药伙伴之间选择，用于抗体生成、优化和入临床准备。第二类是 Recursion、Generate、insitro、Schrödinger 等 AI
              原生平台生物技术公司，它们争夺同一战略叙事——数据加模型加更快发现——但通常通过内部管线创造、软件合同或里程碑密集合作变现，而不是开放式外部服务。第三类是外包发现与开发基础设施，Evotec
              的工业化规模和下游宽度远超多数 TechBio 同行。第四类是专业模态合作者，其中一部分更像补充而非替代，因为它们可以和 Alloy 一起放进买方栈。Alloy 的差异化位置在于混合形态：比管线优先的 AI
              生物技术公司更开放给伙伴使用，比只做抗体的专家更宽，又比 Evotec 的工业平台更聚焦生物药发现到交接。
