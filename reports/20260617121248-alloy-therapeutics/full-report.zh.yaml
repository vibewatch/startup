  - id: TP004
    title: 护城河耐久性 / 竞争风险台账
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 证据
      - 缓释 / 尽调问题
    rows:
      - - 伙伴优先的多模态基础设施
        - 当买方更看重同类最佳抗体深度、而不是广度时，专家型公司胜出
        - 高
        - Adimab 和 AbCellera 都向市场展示了比 Alloy 更强的抗体专项证明点
        - 按模态索取赢 / 输数据，并追问 Alloy 在纯科学深度上输在哪里
      - - AI 加湿实验室反馈闭环
        - AI 工具商品化速度快于专有湿实验室数据积累
        - 高
        - 公开 AI 平台可比公司仍靠数据护城河叙事支撑，但市值仍被压缩
        - 检验 Alloy 的闭环数据是否能在客户 cohort 中提升命中质量或缩短周期
      - - 从发现到交付的连续性
        - Evotec 等捆绑型服务商能以更大规模提供更宽的下游执行能力
        - 中
        - Evotec 覆盖独立服务、整合式 R&D，以及 Just-Evotec Biologics 制造
        - 验证 Alloy 的合作伙伴体验是否足够好，能抵消 Evotec 的规模优势
      - - 面向精简 biotech 的资本高效外部平台
        - 大型 pharma 可以把战略性 AI 赋能发现工作内化
        - 中
        - 全行业 AI 原生和大规模平台投资，让内部自建成为合理应对
        - 询问哪些客户把 Alloy 当作长期层，哪些只把它当作内部能力成熟前的过渡桥梁
      - - 多伙伴、多项目带来的网络效应
        - 如果合作关系浅或不付费，伙伴数量可能夸大经济深度
        - 高
        - Alloy 披露伙伴和项目数量，但未披露活跃付费客户或续约指标
        - 审阅活跃客户、后续项目和集中度的 cohort 数据
      - - 宽模态叙事
        - 广度可能稀释品类最佳声誉，弱于更聚焦的单一模态品牌
        - 中
        - Generate、Recursion 和 insitro 的 AI 原生品牌更强，Adimab 的抗体专业化更锋利
        - 检验 Alloy 的 GTM 信息在客户眼中是差异化能力，还是捆绑后的复杂度
      - - 私营公司灵活性
        - 公开市场可比公司显示，缺少持久证据时，投资者对平台故事的耐心有限
        - 中
        - AbCellera、Recursion、Schrödinger 和 Evotec 的交易市值均远低于早前峰值
        - 承销 Alloy 时应看转化经济性和临床证据，而不是行业叙事倍数
    notes: 严重度反映这些风险对 Alloy 未来三年的竞争相关性，而不是所有情景下的生存风险。几类风险彼此耦合：定价不透明会放大一个核心不确定性——广度究竟在转化为持久经济性，还是只是在制造更宽的营销表面。
