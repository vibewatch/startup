      - number: '7.4'
        title: 人才与执行风险
        blocks:
          - type: paragraph
            body: >-
              人才风险从创始人集中开始。Errik Anderson 仍是 Alloy 战略、融资故事和生态系统模式最可见的设计者，公开资料没有披露继任计划。反方观点是，Alloy
              已在遗传学、细胞治疗、Vigilance、洞察、法务、财务、战略合作、日本、英国和下游药物开发等方向搭起了有分量的运营班底。这个班底有帮助，但也证明组织内部现在要整合的工作量有多大。Alloy
              已不只是维护一个平台小鼠业务或一小组发现服务。它要把新事业部、新模态、地域扩张和开发阶段执行缝成一个叙事。Spannerwerks 收购、IPI 文库、Tahoe JV、Vigilance
              业务线和区域扩张，同时扩大了管理半径。因此，执行速度、人才留存和运营权责清晰度，与科学质量同样重要。
