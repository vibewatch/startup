        title: 信任、质量、路线图与技术风险
        blocks:
          - type: paragraph
            body: >-
              公开可见的信任和质量信号存在，但多数停留在工作流层面，而非系统层面。Alloy 描述了 TCRm 工作的特异性控制、抗体的可开发性和 liability 筛查、遗传药物的已验证化学和 QC、人源化模型与 TPP
              主导药理学，以及 γδTCR 使用和无 feeder 制造等安全导向细胞治疗设计选择。这些都是真实技术质量信号，伙伴案例研究也显示它们在实践中重要。问题在披露深度。已审阅材料中，Alloy 没有发布
              benchmark 数据集、可重复性包、逐版本产品指标、公开安全文档或明确认证清单，外部投资人无法独立给这套栈的运营质量打分。路线图也更多从公告推断，而不是来自产品 changelog：时间线显示公司从许可和
              mAbForge 稳步扩展到细胞治疗、Spannerwerks、Vigilance、IPI 和全栈基础设施主张，但没有透明的模块采用节奏或性能 delta。综述文献还给出最后一层提醒：AI
              驱动发现仍面对数据质量、可解释性、转化和 ADME/Tox 瓶颈。对 Alloy 而言，技术 thesis 可信，但公开 benchmark 深度还不够，不能把营销表面等同于可重复的平台证据。
