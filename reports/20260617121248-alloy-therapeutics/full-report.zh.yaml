              最保守的财务结论是，Alloy 很可能有多条变现杠杆，但公开披露不足，无法有把握地承销收入质量、利润率路径或资本充足性。账面正面很清楚：公司有多元商业触点、强合作伙伴数量观感、新近 $40 million
              后期轮融资，以及预付款、里程碑、特许权使用费、服务和许可经济的公开案例。谨慎面同样清楚：AI
              驱动药物发现仍面对数据质量、可解释性、流失和转化瓶颈；与此同时，公开平台生物技术公司的估值即便在披露越来越细之后仍然波动。对 Alloy
              来说，下一步尽调不是外推同行倍数或假设软件式经济性，而是拿到私有证据：实际定价、活跃付费账户、按流派确认收入、按服务线划分毛利率、当前现金和烧钱，以及合作伙伴项目转化为重复或下游经济的比例。在这些数据产出前，本章支持的判断是
              Alloy 具备战略可信度，但财务披露不足。
