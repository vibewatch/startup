      - CE046
      - CE049
  - id: FU001
    title: 客户旅程图——从首次接触到平台扩展
    type: journey-map
    layout: wide
    summary: 展示 Alloy 通常如何拿下发现工作、证明价值，再把关系扩展到更多模态、开发服务或公司孵化。
    data:
      items:
        - label: 发现
          detail: 大型生物制药公司、生物技术创始人、学术机构和非营利组织，通常通过 Alloy 的平台生态、创投网络或科学合作伙伴转介绍接触到 Alloy。
        - label: 评估匹配
          detail: 交易对手会选择某个模态切入点，例如 ATX-Gx、AntiClastic、VHH 库、细胞疗法，或计算发现支持。
        - label: 初始合同
          detail: 关系通常从发现服务项目、机构许可、多靶点合作，或共同注资的新公司结构开始。
        - label: 产出证明
          detail: Alloy 与交易对手会争取拿出可见证明，例如结合物、靶点验证、更好的可开发性，或更快推进到 IND 支持工作。
        - label: 扩大范围
          detail: 交易对手满意后，可以追加新模态、开发咨询、制造交接或更多靶点，而不是更换供应商。
        - label: 放大上行
          detail: 最深的关系会走向重复项目、广泛机构准入，或 82VS 式公司孵化，而不是停留在单个项目。
    approximationNotes: 这张图根据 Scripps、Mediar、Biogen、Tahoe、IPI、Spannerwerks 和 Wheeler 等具名关系结构推断而来。它是一条概括性旅程，不是 Alloy 发布的漏斗。
    claimRefs:
      - CU007
      - CU017
      - CU025
      - CU026
      - CU033
      - CU036
      - CU037
  - id: FU002
    title: 采用与证明漏斗——从宽口径关系数到少量具名证据
    type: funnel
    layout: standard
    summary: 对比 Alloy 宽口径的漏斗顶部关系主张、较少的公开具名交易对手，以及更少的带具体结果证明的样本。
    data:
      items:
        - label: 公司声称的合作伙伴范围
          value: 200
          note: 截至 2026 年 4 月，合作伙伴 / 协作者超过 200 个
        - label: 已许可治疗项目
          value: 100
          note: 合作伙伴基础贡献的已许可项目超过 100 个
        - label: 临床阶段合作伙伴项目
          value: 22
          note: Alloy 称已进入临床开发的项目
        - label: 本章公开具名交易对手
          value: 7
          note: Scripps、Biogen、AbbVie、Mediar、Tahoe、IPI 与 Swiss Rockets/Torpedo
        - label: 有具体结果或重复信号的具名关系
          value: 4
          note: Scripps、Mediar、Tahoe 和 Biogen 展现出最清晰的机构、结果或重复使用信号
        - label: 数据足以推断经济性的具名关系
          value: 3
          note: Biogen、AbbVie 和 Tahoe 披露了部分结构，但价值并不完整
    approximationNotes: 具名交易对手以上阶段的数值来自公司主张。更低阶段是分析师基于所引公开披露统计的数量，因此反映的是公开证明密度，不一定等于 Alloy 真实的内部客户基础。
    claimRefs:
      - CU001
      - CU002
      - CU016
      - CU019
      - CU021
      - CU030
      - CU031
  - id: FU003
    title: 客户证明矩阵——关系深度与证据质量
    type: matrix
    layout: wide
    summary: 按结果具体程度、经济性可见度和留存证据多少，映射主要交易对手类别。
    data:
      columns:
        - 结果具体性
        - 经济性可见度
        - 留存可见度
        - 部署成熟度
        - 证据独立性
      rows:
        - label: 学术 / 非营利（Scripps、IPI）
          values:
            - label: 中到高
              tone: positive
            - label: 低
              tone: warning
            - label: 低
              tone: negative
            - label: 广泛平台部署 / 主动建设
              tone: positive
            - label: 中
              tone: neutral
        - label: 大型生物制药（Biogen、AbbVie）
          values:
            - label: 低到中
              tone: warning
            - label: 中
              tone: neutral
            - label: 低
              tone: negative
            - label: 活跃合作
              tone: neutral
            - label: 中
              tone: neutral
        - label: 临床阶段生物技术（Mediar）
          values:
            - label: 高
              tone: positive
            - label: 低
              tone: warning
            - label: 中
              tone: neutral
            - label: 已完成发现 / 重复合作
              tone: positive
            - label: 中到高
              tone: positive
        - label: 创投 / 新公司渠道（Tahoe / 82VS）
          values:
            - label: 中
              tone: neutral
            - label: 低到中
              tone: warning
            - label: 低
              tone: negative
            - label: 临床前新公司组建
              tone: neutral
            - label: 中
              tone: neutral
        - label: 模态扩展伙伴（Swiss Rockets）
          values:
            - label: 低到中
              tone: warning
            - label: 低
              tone: negative
            - label: 低
              tone: negative
            - label: 早期合作
              tone: neutral
            - label: 中
              tone: neutral
    approximationNotes: 这个矩阵是定性判断。它不同于具名证明表，关注证据质量和关系深度评分，而不是罗列交易对手事实。
