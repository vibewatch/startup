      - 集群
      - 规模 / 融资信号
      - 目标客群
      - 差异化
      - 局限
    rows:
      - - Alloy Therapeutics
        - 伙伴优先的生物药基础设施
        - 估值 $1B；200+ 伙伴；100+ 授权项目；22 个临床项目
        - 大型生物制药、精简生物技术公司、学术机构、创业者、VC 支持的 newco
        - 组合 AI 赋能发现、转基因资产、多种生物药模态和下游交接
        - 收入、定价和复购经济性仍未公开
      - - Adimab
        - 抗体发现专家
        - 140+ 合作；675+ 项目；90+ 临床启动；6 个商业化产品
        - 需要专业抗体发现和工程能力的生物制药团队
        - 抗体领域可信度深，且无内部管线，伙伴利益更一致
        - 模态广度窄于 Alloy，下游基础设施广度也不如 Alloy 明显
      - - AbCellera
        - 抗体平台加垂直整合
        - 2025 年收入 $75.1M；104 个伙伴启动项目；19 个分子进入临床；市值约 $1.55B
        - 希望抗体发现叠加开发与制造相邻能力的生物制药买方
        - 单细胞抗体平台，加转化、开发和制造能力
        - 因为也在推进内部管线，伙伴开放度不如 Alloy 明显
      - - Recursion
        - AI 原生平台生物技术公司
        - 2025 年收入 $74.7M；现金 $753.9M；市值约 $1.68B
        - 大型药企合作，以及优先看重多模态数据和 AI 原生工作流的买方
        - 大规模专有数据护城河和里程碑支持的伙伴关系
        - 商业模式更偏平台加管线经济，而不是开放外部服务
      - - Schrödinger
        - 软件优先的 AI 药物发现
        - 2025 年软件收入 $199.5M；ACV $198.5M；市值约 $1.11B
        - 购买软件、托管计算和精选合作的药企与生物技术团队
        - 包装最透明，软件分发强，具备基于物理的建模能力
        - 湿实验室和生物药基础设施广度不及 Alloy 或 Evotec
      - - Evotec
        - 打包外包 R&D 基础设施
        - 2025 年 D&PD 收入 €528.9M；JEB 收入 €259.4M；4,500+ 专家；市值约 $0.95B
        - 寻求大规模外包的头部药企和生物技术买方
        - 从发现到生物药开发和制造的产业广度
        - 比 Alloy 更宽、更重；并不只聚焦 Alloy 的生物药伙伴切口
      - - Generate Biomedicines
        - AI 原生生成式生物学公司
        - IPO 募资总额 $400M；2026 Q1 现金 $516.6M；2026 Q1 收入 $7.2M
        - 寻求新型蛋白生成能力和管线上行空间的伙伴与投资者
        - 生成式蛋白设计，跨模态拥有临床阶段项目
        - 商业模式和定价以合作为中心；相较热度，收入仍低
      - - insitro
        - 私有 AI 原生平台生物技术公司
        - 已融资 $643M；私有 Series C；收入未披露
        - 优先看重人类数据关联 ML 发现的大型药企伙伴和投资者
        - 整合细胞与临床数据的疾病特异性 ML 平台
        - 私有公司不透明，规模、定价和商业耐久性难以对标
    notes: 同行集合横跨私有公司、公开软件平台公司和大型外包 R&D 服务商，因此规模信号混合了估值、收入、现金和伙伴指标。各行强调买方最接近的待办任务，而不是把不可比的商业模式硬塞进同一个指标。
