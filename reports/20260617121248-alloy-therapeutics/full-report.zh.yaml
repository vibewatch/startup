  - id: TE002
    title: 工作流 / 用例表
    columns:
      - 用户任务
      - 当前工作流瓶颈
      - Alloy 方案
      - 可见收益
      - 限制
    rows:
      - - 为困难靶点定义抗体 campaign
        - 标准发现流程在多样性、特异性或可开发性上可能表现不足
        - ATX-Gx 小鼠品系，叠加定制免疫和 B 细胞工作流
        - 以类人 repertoire 带来更宽的序列和表位覆盖
        - 公开材料未量化相对命中率提升
      - - 免疫后挖掘候选 repertoire
        - 人工下筛速度慢，也可能漏掉有用变体
        - 深度测序，加上 AI/ML repertoire 挖掘和 mAbForge 关联筛选
        - 缩短周期，并更早过滤 liability
        - 模型训练数据和假阳性率未披露
      - - 工程化可制造双特异性分子
        - 格式选择、方向和 assay 负担拖慢迭代
        - ATX-CLC 或 VHH 输入、模块化臂和高通量功能 assay
        - 快速比较价数、方向和靶点组合
        - 从候选组合到临床就绪先导物的成功率没有公开基准
      - - 用抗体攻击细胞内靶点
        - 传统抗体无法直接触达细胞内抗原
        - Keyway TCRm 工作流采用 pMHC 文库和转化测试
        - 为进入细胞内生物学增加一条路径，并明确做特异性检查
        - 公开证明仍偏重工作流，缺少结果
      - - 针对难处理序列设计 RNA 疗法
        - 序列搜索空间巨大，效力与安全性存在取舍
        - AntiClastic 环状格式，加上 AI 驱动的 Sequence Design Studio 和迭代湿实验测试
        - 快速收窄候选，并争取更好的效力或治疗指数
        - 公开视野里独立基准和临床验证仍有限
      - - 生成可支撑决策的临床前数据
        - 发现团队常缺少贴合用途的药理学产能
        - 以 TPP 牵引药理学，用人源化模型、免疫分析和全球执行
        - 不必自建完整药理团队，也能拿到可支撑决策的数据
        - 周转时间或可重复性没有公开服务级指标
      - - 从发现桥接到 IND 或剥离项目
        - 精简团队常缺少 CMC、毒理、监管或公司搭建基础设施
        - Spannerwerks、优选 CDMO 路径、IND 支持、Wheeler 式生态条款和 82VS
        - 降低交接摩擦，支持资本效率更高的开发或公司创建
        - Alloy 到底亲自交付多少、编排合作伙伴多少，并不总是清楚
    notes: 本表总结了各模态中观察到的运营流程；它不是 Alloy 披露的一套标准化 SOP。
