  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 抗体与双特异性发现
        - 转基因平台使用、抗体发现服务、双特异性工程、可开发性工作流
        - 商业化制造、成品药商业化、无关的后期临床运营
        - 大型药企生物药 R&D、新兴生物科技 CEO / CSO
        - 通过 ATX-Gx、发现服务和 AI 辅助优化形成 Alloy 核心切入点
      - - TCRm 与细胞内靶点生物药
        - TCRm 发现、pMHC 特异性筛选、转化测试
        - 与发现项目无关的细胞治疗制造
        - 肿瘤学平台团队、免疫肿瘤生物科技买方
        - 现有选项有限的核心差异化子细分
      - - 遗传药物平台服务
        - AI 驱动序列设计、体外 / 体内精修、候选选择数据包
        - 广义基因治疗制造或完全内部化平台建设
        - 药企创新团队、生物科技项目、学术实验室
        - 将 Alloy 从抗体拓宽出去的核心增长邻接
      - - 细胞治疗赋能
        - iCAR-T 发现、药理学、IND 支持、优选 CDMO 转移
        - 常规商业化细胞治疗供应或医院交付经济
        - 细胞治疗生物科技和药企模态团队
        - 核心到邻接；吸引力在于把发现与开发交接连起来
      - - 临床前药理学与转化支持
        - 按目的定制的药理学、免疫表型分析、TPP 关联研究设计、监管顾问网络
        - 与候选选择或临床前决策无关的一般 CRO 工作
        - 项目负责人、转化负责人、CSO
        - 把平台产出转化为可投资数据的重要变现层
      - - 创业工作室 / 生物安全邻接
        - 新公司创建支持、使命合作伙伴响应项目、面向韧性的平台招商用例
        - 单资产企业价值或广义主权生物科技政策支出
        - 创业工作室、政府、慈善和应急准备买方
        - 可扩大市场的新兴邻接，但尚未被证明是核心收入
    notes: 边界逻辑来自 Alloy 的模态和服务页面，以及竞争对手定位。纳入支出跟踪从靶点概念到临床就绪候选物之间的工作；排除支出剔除药企内部 R&D、下游商业化制造和无关 CRO 量。
    claimRefs:
      - CM001
      - CM002
      - CM003
      - CM004
      - CM005
      - CM006
      - CM007
      - CM008
      - CM009
      - CM010
      - CM011
  - id: TM002
    title: TAM / SAM / SOM 或规模测算视角表
    columns:
      - 视角
      - 发布方 / 来源
      - 年份
      - 数值
      - CAGR / 增长
      - 方法
      - 置信度
      - 局限
    rows:
      - - 广义 TAM
        - Mordor Intelligence
        - '2026'
        - $3.25B 全球 AI 药物发现市场
        - 到 2031 年 CAGR 25.94%
        - 自上而下 + 供应商汇总市场模型
        - 中
        - 包含软件、小分子，以及超出 Alloy 实际边界的广泛工作流类别
      - - 服务切片 / SAM 代理
        - Mordor Intelligence
        - '2026'
        - $0.79B AI 药物发现服务
        - 到 2031 年 CAGR 27.54%
        - 广义市场模型中的组件细分
        - 中
        - 仍覆盖比外包生物药基础设施更宽的 AI 服务市场
      - - 生物药增长模态视角
        - Mordor Intelligence
        - '2026'
        - $0.33B 基因和细胞治疗 AI 切片；生物药占 2025 年 32% 份额
        - 基因 / 细胞最快，CAGR 25.32%
        - 药物类型细分
        - 中
        - 非买方特定，且仍包含 Alloy 变现模型之外的供应商
      - - 广义范围矛盾检查
        - Global Market Insights（研究机构）
        - '2026'
        - 公开落地页未展示市场价值
        - 预测销售到 2035 年
        - 付费市场研究的范围预览
        - 低
        - 主要价值在于它明确包含 CRO、软件和宽应用桶；若直接使用，会高估 Alloy 的可触达市场
      - - 可观察公开可比底线
        - AbCellera + Schrödinger + Generate（公开可比）
        - 2025 / Q1 2026
        - $160.3M = $75.1M + $56.4M + ~$28.8M 年化
        - 当前披露收入，不是预测 CAGR
        - 披露的相邻公开收入合计，Generate 用单季年化
        - 中
        - 低估私有供应商，排除 Alloy 收入，且混合不同商业模式
      - - 更广外包基础设施邻接
        - Evotec
        - '2025'
        - €528.9M D&PD 和 €259.4M JEB
        - JEB 同比 +39%；D&PD 同比 -13.5%
        - 更宽口径的综合型服务商披露分部收入
        - 中
        - 会高估与 Alloy 的重叠，因为其中包括非生物药、更宽服务范围以及制造相关收入
    notes: 市场判断的关键不是给出一个激进 TAM，而是看边界有多敏感。自上而下的 AI 市场报告明显高于可直接比较的合作型平台公开收入下限；Evotec 也说明，一旦把一体化 R&D 和生物药基础设施打包，相邻市场会被拉宽很多。
    claimRefs:
      - CM012
      - CM013
      - CM014
      - CM015
      - CM016
      - CM017
      - CM018
      - CM019
      - CM020
      - CM021
      - CM022
  - id: TM003
    title: 细分市场 / 买方地图
    columns:
      - 细分市场
      - 买方
      - 用户
      - 付款方 / 预算负责人
      - 工作流
      - 采用触发点
    rows:
      - - 大型生物制药
        - 生物药 R&D 中的治疗领域负责人或平台负责人
        - 发现科学家、计算生物学家、转化团队
        - 外部创新或发现项目预算
        - 试点靶点 / 模态合作 -> 验证数据 -> 多项目扩张
        - 需要压缩周期、拓展模态覆盖，或接入外部数据 / 平台能力
      - - 新兴生物技术公司 / 虚拟生物技术公司
        - CEO、CSO 或兼职 R&D 负责人
        - 借助外部湿实验室和 AI 工作流的小型项目团队
        - 风投资助的 R&D 预算
        - 单一资产或模态合作 -> 外包发现和临床前包 -> 后续开发支持
        - 需要提升现金效率，避免自建完整内部发现体系
      - - 学术机构 / 非营利组织
        - PI、转化中心主任，或有技术转让支持的实验室
        - 研究科学家和博士后
        - 资助、慈善或赞助研究预算
        - 平台接入 / 合作 -> 证明数据 -> 许可或分拆创业过渡
        - 需要专业平台入口，或需要实验室能力之外的转化路径
      - - 创业工作室 / newco
        - 创业工作室合伙人和新上任的公司管理层
        - 兼职科学团队加外部平台运营方
        - 组建资本 / SPV 预算
        - 机会发现 -> 资产设计 -> 借外部执行快速推进价值拐点
        - 能用最少固定基础设施创建以资产为中心的公司
      - - 政府 / 生物安全任务伙伴
        - 项目经理、应急准备负责人，或公私合营联盟赞助方
        - 面向任务的科学和转化团队
        - 合同、资助或任务预算
        - 威胁或韧性用例 -> 快速响应合作 -> 对策 / 供应链项目
        - 采用动因不是经典商业 ROI，而是速度、韧性以及本土 / 盟友能力需求
    notes: Alloy 未公开具体签字人头衔和采购机制。因此，这张地图把 Alloy 明确点名的目标客群、相邻公开平台公司的合作变现方式，以及 Alloy 从发现到 IND 支持的销售方式放在一起交叉推断。
    claimRefs:
      - CM023
      - CM024
      - CM025
      - CM026
      - CM027
      - CM028
      - CM029
      - CM030
      - CM031
  - id: TM004
    title: 增长驱动与约束表
    columns:
      - 驱动 / 约束
      - 方向
      - 时点
      - 含义
      - 尽调问题
    rows:
      - - 药物发现成本与周期压力
        - 驱动
        - 结构性 / 持续
        - 能更早砍掉坏想法、更快推进好项目的平台更占优
        - 要求 Alloy 给出项目层证据，证明它缩短的是周期或总支出，而不只是模型延迟
      - - 湿实验室验证 AI 的需求
        - 驱动
        - 当前
        - 模型加实验执行的一体化服务商受益
        - 检验 Alloy 的赢单率是否依赖一体化执行，而不是单纯平台许可
      - - 预算受限 biotech 的自建 / 外购取舍
        - 驱动
        - 当前
        - 支撑交钥匙式外包发现和临床前包
        - 确认早期 biotech 客户结构和复购行为
      - - 云和托管基础设施
        - 驱动
        - 当前至中期
        - 降低进入门槛，让外部平台更容易被采用
        - 询问 Alloy 交付中平台化占比有多高，专家服务占比有多重
      - - 基因 / 细胞治疗增长
        - 驱动
        - 中期
        - 支撑 Alloy 在细胞治疗和遗传药物上的相邻业务
        - 核实这些模态今天带来商业需求，还是主要支撑战略叙事
      - - 数据质量和患者异质性
        - 约束
        - 结构性
        - 限制模型迁移能力，并增加湿实验室再验证负担
        - 按模态要求外部验证率、数据集来源和失败案例
      - - 监管可解释性和审计轨迹
        - 约束
        - 当前至中期
        - 增加文档负担，拖慢其进入受监管决策的部署
        - 要求 SOP、模型谱系控制，以及面向监管的数据包案例
