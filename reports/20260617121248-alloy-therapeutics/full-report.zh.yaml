      - number: '8.3'
        title: 牛市、基准与熊市情景区间
        blocks:
          - type: paragraph
            body: >-
              用有纪律的情景框架，比虚假的精确更有用。熊市情景给 Alloy 约 $0.4-0.7 billion 的估值。如果下一轮融资暴露令人失望的收入质量，如果 AI 生物科技和服务平台的公开倍数进一步压缩，或如果
              Alloy 的组合被证明比乐观叙事暗示的更偏服务、更不像软件，就会走向这个结果。降价轮今天不是基准预期，但是真实风险，因为已有披露收入的公开可比公司，交易区间已经与 Alloy 的私人估值大致重合。


              基准情景约为 $0.8-1.1 billion。它假设 2026 年 4 月融资大体公允，合作伙伴动能和临床推进继续，Alloy
              仍具战略相关性；但也假设在经济数据披露前，不会出现大的估值上跳。在这个框架下，当前估值没有坏掉，但已经承担了大部分工作。牛市情景达到约 $1.3-1.8
              billion，要求不只是继续发新闻稿。它需要披露收入、重复企业或合作伙伴支出的证据、发现宽度能转化为有吸引力混合经济性的证明，以及让 Alloy
              更像买方难以复制的基础设施资产的战略稀缺价值。敏感性结论很简单：下一段上行对财务披露的敏感度，远高于对另一条泛泛平台公告的敏感度。
