        - 战略平台合作伙伴
        - 2026 年 3 月抗体平台协议
        - 大型生物制药带来的商业验证
        - 审查排他性、里程碑经济性和 IP 所有权
      - - Biogen
        - 战略授权 / 合作伙伴
        - 2026 年 4 月 AntiClastic 交易
        - 首付款 + 里程碑 + 版税创造下游经济敞口
        - 审查靶点范围、经济条款和终止权
    notes: 已审阅资料支持 2026 年具名投资人和若干战略合作伙伴，但不支持完整 cap table、董事会权利安排或历史持股轨迹。因此，行项目混合了股权和战略利益相关方，适合商业模式概览，但不能替代正式资本结构分析。
    enumerationScope:
