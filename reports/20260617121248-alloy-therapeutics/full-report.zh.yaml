        title: 增长驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              增长逻辑从药物发现本身的经济性开始。第三方综述仍描述 10–15 年开发周期、约 $2.6 billion 平均开发成本和持续存在的临床失败率，因此更早预测、更快终止错误项目价值很高。AI
              驱动外包伙伴若能把模型与真实湿实验室验证、自有数据和转化支持结合起来，就会受益。云和托管交付、预算受限的生物技术团队务实选择自建还是购买，以及与 Alloy
              模态组合匹配的基因和细胞治疗子分群更快增长，也进一步拉动需求。约束同样重要。综述继续指出数据质量、患者异质性、模型可解释性和实验验证是真实瓶颈。监管方越来越期待审计轨迹和模型谱系。买方担心
              IP、数据共享和工作流切换成本。人才仍稀缺，整合型湿实验室平台业务仍然资本密集，公开同行持续亏损已经说明这一点。即便外包市场也不是全面繁荣：Evotec 披露 2025
              年早期药物发现走弱，说明买方仍在筛选，平台供应商必须证明 AI 品牌之外的 ROI。
