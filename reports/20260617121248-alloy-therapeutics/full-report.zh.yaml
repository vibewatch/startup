      - number: '7.2'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >-
              从运营看，Alloy
              要让投资人相信一个很宽的执行故事：用大型内部实验数据集训练的专有模型、全球湿实验室引擎、多种生物药模态、下游开发支持，以及制造相邻交付。这种宽度可能很有力量，但比狭窄的发现授权模式多出更多失败点。外部评审在这里仍是有用约束。2026
              年同行评议综述仍把 AI 药物发现的限制归结为数据质量、过度自信、可解释性差、患者异质性，以及外部或实验验证需求。这些并非 Alloy
              的抽象问题，因为公司明确销售速度、预测质量和降低下游风险。公开证据也让安全尽调保持开放。Alloy
              的隐私政策描述了合理保障措施和若干第三方数据或分析供应商，但已审阅材料没有披露独立安全认证、事故历史或面向合作伙伴的正常运行时间承诺。对一家越来越多居中处理敏感合作伙伴数据和转化执行的公司来说，这些缺口和湿实验室质量体系一样重要。
