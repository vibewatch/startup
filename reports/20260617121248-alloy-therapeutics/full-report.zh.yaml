companyProfile:
  summary: >-
    Alloy Therapeutics 位于马萨诸塞州 Waltham，是一家生物技术基础设施公司，公开定位为 AI 驱动、多模态药物发现与开发生态。公开材料一致提到公司成立于 2017 年，但原始简报写的是 2018
    年。创始人、CEO 兼董事长 Errik Anderson 领导公司，服务对象覆盖药企、生物技术公司、学术机构和风投支持的创业团队；公司提供协作式平台访问、科研服务、下游开发支持和公司孵化能力，而不是押注单一内部治疗资产。截至
    2026 年 4 月，公司披露拥有 200+ 合作伙伴、100+ 已授权治疗项目和 22 个临床项目，但收入、累计融资额和总员工数仍严重披露不足。
