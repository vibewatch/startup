        - IND 支持、CMC、监管规划、CDMO 转移和项目管理
        - Spannerwerks、Wheeler 式生态伙伴、外部 CDMO 和内部监管领导力
        - Alloy 往往是编排这一层，而不是完全控制
      - - 公司创建与战略延伸
        - 82VS 剥离项目和 Vigilance 式使命项目，把价值捕获从单个发现项目拓宽
