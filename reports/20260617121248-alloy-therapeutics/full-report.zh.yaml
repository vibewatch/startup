  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、置信度与价格立场
        blocks:
          - type: paragraph
            body: >-
              Alloy Therapeutics 同时像一个公司质量真实的故事，也像一个可投资性受限的故事。公司现在已确认达到 $1.0 billion 投后估值，已从抗体发现起点扩展为多模态生物科技基础设施平台，并能指向
              200 多个合作伙伴、100 多个授权项目和 22 个临床开发项目。相比许多私有 AI
              生物科技叙事，这给出了更强的运营证明。但公开记录仍缺少定价承销最关键的指标：收入、毛利率、烧钱速度、现金续航期、留存、集中度，以及平台费、服务、里程碑、版税和分拆公司经济之间的组合。


              这个错配很重要，因为当前估值已经落在若干公开 AI 生物科技和药物发现平台的大致估值区间内，而这些公司披露了真实收入，有些还披露现金、留存和利润率数据。Generate Biomedicines 在 2026 年
              IPO 后交易市值约 $1.7 billion，但 2025 年收入只有约 $31.9 million；AbCellera 和 Recursion 市值约 $1.5-1.7 billion，各自年收入约 $75
              million；Schrödinger 市值约 $1.1 billion，2025 年收入约 $256 million，并披露软件 KPI；Evotec 2025 年收入接近 €0.8
              billion，股权价值却低于 $1.0 billion。在这个背景下，Alloy 的业务可能有战略吸引力，但价格并不明显便宜。合适结论是继续研究，置信度中等，风险高，估值偏满。
