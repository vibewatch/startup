      - - AntiClastic 遗传药物
        - 优化 ASO、siRNA、sgRNA 或编辑 payload 的 RNA therapeutics 团队
        - 快速扩张模块，已有 2026 年 Biogen 交易和专门事业部领导层
        - 瞬态环状架构、AI 指导序列设计、效力和治疗指数定位
        - 需要独立效力基准、生物分布数据和特定模态临床证据
      - - 药理
        - 需要转化、体外、体内和免疫表型支持的项目
        - 有直接工作流描述的运营服务线
        - TPP 牵引设计、人源化模型、18 色免疫 profiling、全球执行
