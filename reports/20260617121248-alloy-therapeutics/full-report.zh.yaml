  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、阶段与商业模式
        blocks:
          - type: paragraph
            body: >-
              Alloy Therapeutics 总部位于马萨诸塞州 Waltham，自称是生物技术生态公司，靠 AI 驱动平台、整合服务和公司孵化能力推动药物发现与开发。公开公司材料和一份存档 Crunchbase
              档案一致指向 2017 年成立，而本尽调简报写的是 2018 年；已审阅材料里没有章程文件或州备案，这一差异应继续作为开放问题，而不是靠假设消解。截至 2026 年 4 月融资，Alloy 处于 Series E
              阶段，定位为虚拟生物技术公司、药企伙伴、学术机构和创始人的基础设施提供商，靠发现服务、许可、合作和创业孵化变现，而不是靠单一自有治疗资产。运营足迹不止 Waltham，还包括 Georgia 州
              Athens、英国 Cambridge、瑞士 Basel 和日本 Fujisawa 的具名团队；管理层也强调公司在美国、日本、中东和新兴创新市场设有卓越中心。
