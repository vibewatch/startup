        - 人源化转基因品系、免疫能力、序列和表位多样性
        - 需要相对同行的胜率、可复现性和 campaign 基准数据
      - - mAbForge + Alloy Insights AI/ML（筛选与分析）
        - 需要 repertoire 挖掘、可开发性预测和高通量表征的团队
