      - number: '8.5'
        title: 退出路径、论点击穿触发器与最终尽调要求
        blocks:
          - type: paragraph
            body: >-
              最可能的退出路径是战略出售或之后的公开上市流程，但两者都需要比今天更多的披露。战略买方可能因合作伙伴触达、生物药基础设施、AI 驱动的湿实验室整合，或拥有更广生态系统的期权价值而给 Alloy
              定价。但战略逻辑不能替代对当前收入组合、客户集中度，以及未来价值中服务、里程碑、版税或 newco 股权各占多少的理解。公开上市路径要求更高：收入可见性、利润率形状，以及一个能在公开市场与
              Generate、Schrödinger、Recursion、AbCellera 和 Evotec 对比后仍站得住的叙事。


              论点击穿触发器是可衡量的。未来融资若低于 2026 年 4
              月估值，就会迫使重估。如果到下一轮融资仍持续拒绝或无法披露基本经济指标，股票故事会继续困在叙事估值里。合作伙伴流失或重复合作疲弱的证据会削弱平台论点。如果业务组合继续扩展到执行较重的开发服务，却没有展示类似软件的杠杆，估值应向低倍数服务可比公司下行收敛。因此，阻断性尽调要求很直接：按产品线和交易类型拆分的收入、各线毛利率、重复预订或留存、现金消耗和续航期、客户集中度、优先权堆栈细节，以及
              82VS 或合资企业经济性。没有这些，建议就应保持观望，而不是兴奋。
