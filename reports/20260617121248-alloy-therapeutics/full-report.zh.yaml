      - number: '5.3'
        title: 依赖、差异化与成熟度
        blocks:
          - type: paragraph
            body: >-
              Alloy 的差异化逻辑建立在平台访问和执行能力的组合上，而不是单纯软件或单纯生物学。公开可见的最强护城河元素包括转基因小鼠基础、公司声称的内部实验数据、按模态沉淀的工作流
              know-how，以及把发现连接到药理学、开发咨询和公司孵化的能力。伙伴证据强化了这一 thesis。Scripps 将 ATX-Gx 访问制度化；Mediar 和 Tahoe 验证不同类型的下游伙伴价值；IPI
              用合成 VHH 库延伸 Alloy 抗体栈；Spannerwerks 把操作系统扩展到 tox、CMC、监管和临床执行。但 Alloy 的依赖也很重。公开工作流仍依赖自有数据集，其规模和 benchmark
              方法只披露了一部分；还依赖多个地域的专业湿实验室站点、伙伴靶点和生物学语境，以及外部开发或制造关系，在这些关系中 Alloy
              往往是编排者而非唯一运营者。竞争对手披露也给护城河叙事降温。AbCellera、Recursion 和 Schrödinger 至少在一个维度发布了更明确的平台规模或系统证据，因此 Alloy
              的公开成熟度信号在打包生物药执行上最强，在外部 benchmark 数据或平台透明度上较弱。
