            body: >-
              近期时间线密集且大多正面：2024 年 10 月获得 Scripps 机构许可；2025 年 1 月与 Swiss Rockets 开展放射性配体合作；2025 年 10 月收购
              Spannerwerks；2026 年 1 月成立 Tahoe 合资公司并任命 Cobaugh；2026 年 2 月至 4 月陆续发布 Mediar、AbbVie、Vigilance、Biogen 和
              Series E 公告；2026 年 5 月宣布 IPI 合作。合在一起看，这些里程碑显示 Alloy
              正从抗体发现向更广泛的开发服务、创业孵化和生物安全导向工作下沉。本章的主要负面信号不是法律或临床失败，而是披露和执行风险：公开材料没有证实累计融资额、收入、总员工数或完整董事会构成；2026 年关于 AI
              驱动药物发现的同行评议综述仍警告，数据质量、可解释性、患者异质性和实验验证依然是临床转化的真实瓶颈。Alloy 的 AI 加湿实验室配套模式或许能缓解部分风险，但不能替代对经济性、治理和可重复性的更深入尽调。
