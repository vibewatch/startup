      - CR011
      - CR016
      - CR037
      - CR046
      - CR050
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 展示 Alloy 的主要风险触发点如何传导到客户结果、收入节奏和估值。
    data:
      nodes:
        - id: weak-models
          label: 模型可信度弱
          detail: AI 输出过度自信，或验证不足
        - id: quality-slip
          label: 质量 / 监管滑坡
          detail: CMC、HCT/P 或特定模态执行失败
        - id: partner-delay
          label: 合作伙伴项目延迟
          detail: 迭代更多、补救更多、推进更慢
        - id: lower-renewal
          label: 续约下降 / 新项目减少
          detail: 客户信任下降，转化变弱
        - id: revenue-pushout
          label: 收入和里程碑后移
          detail: 服务、里程碑和新公司节奏延后
        - id: talent-strain
          label: 人才和管理承压
          detail: 领导层和跨职能团队负荷上升
        - id: valuation-hit
          label: 估值压缩
          detail: 溢价倍数更难守住
      edges:
        - from: weak-models
          to: partner-delay
          label: 需要更多湿实验验证
        - from: quality-slip
          to: partner-delay
          label: IND 或交接返工
        - from: partner-delay
          to: lower-renewal
          label: 信任和紧迫感下降
        - from: partner-delay
          to: revenue-pushout
          label: 里程碑右移
        - from: lower-renewal
          to: revenue-pushout
          label: 重复需求减少
        - from: revenue-pushout
          to: talent-strain
          label: 资源压力上升
        - from: talent-strain
          to: valuation-hit
          label: 执行溢价被侵蚀
        - from: revenue-pushout
          to: valuation-hit
          label: 增长故事变弱
    approximationNotes: 这张 DAG 是分析师对可能业务传导路径的综合判断，不是公司披露的内部风险模型。
    claimRefs:
      - CR011
      - CR012
      - CR026
      - CR052
      - CR053
  - id: FR003
    title: 依赖图谱
    type: dag
    layout: wide
    summary: 映射 Alloy 核心平台周边的外部依赖，并说明业务宽度为何可能变成协调负担。
    data:
      nodes:
        - id: alloy-core
          label: Alloy 核心平台
          detail: AI + 湿实验室 + 发现服务
        - id: big-pharma
          label: 大型药企伙伴
          detail: Biogen、AbbVie 及类似客户
        - id: emerging-biotech
          label: 新兴生物技术 / 虚拟生物技术
          detail: Mediar、Tahoe 类型建设者
        - id: newcos
          label: 82VS / 新公司
          detail: JV 和公司孵化结构
        - id: downstream
          label: 下游开发 / CDMO
          detail: Spannerwerks 加优选或伙伴选择的 CDMO
        - id: regulators
          label: 监管机构
          detail: FDA AI、基因疗法和 HCT/P 框架
        - id: mission
          label: 使命伙伴
          detail: 通过 Vigilance 连接的政府或慈善交易对手
      edges:
        - from: big-pharma
          to: alloy-core
          label: 平台费 / 里程碑
        - from: emerging-biotech
          to: alloy-core
          label: 服务需求 / 外包发现
        - from: newcos
          to: alloy-core
          label: 价值捕获绑定融资和执行
        - from: downstream
          to: alloy-core
          label: 交接塑造全栈可信度
        - from: regulators
          to: alloy-core
          label: 质量和 AI 证据预期
        - from: mission
          to: alloy-core
          label: 生物安全和主权约束
    approximationNotes: 这张图突出重大依赖类别，而不是列出每一段关系。它意在展示集中度表面和协调负担，不是法律所有权比例。
    claimRefs:
      - CR003
      - CR017
      - CR018
      - CR026
      - CR042
      - CR046
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: 展示为什么商业叙事很强，但在当前价格下仍只能给出继续研究的判断。
    data:
      nodes:
        - id: n1
          label: 200+ 合作伙伴 / 22 个临床项目
        - id: n2
