            body: >-
              最重要的未决输入不是市场整体，而是公司自身。公开材料没有披露 Alloy
              的收入、定价、模态组合、客户集中度、续约行为，也没有拆分服务、许可、里程碑和下游经济。也就是说，本章可以界定边界、买方和相互矛盾的市场视角，但无法仅凭公开证据干净推导 SAM 或
              SOM。承销含义是，估值不应依赖通用的数十亿美元 AI 药物发现 headline。更应该检验 Alloy
              能把多大比例的更窄外包生物药基础设施支出转化为可重复收入，其数据加湿实验室整合到底多有防御性，以及合作伙伴数量是否能转化为持久经济性，而不只是营销宽度。换句话说，市场叙事支撑战略相关性，但采用节奏和估值将由收入转化、买方信任和项目级执行证据决定；这些证据公开来源仍没有给出。
