        title: 收入模式与变现架构
        blocks:
          - type: paragraph
            body: >-
              Alloy 的公开材料支撑的是多触点变现模型，而不是单一 SKU。公司向大型生物制药公司、较小生物技术公司、学术机构、创业者、非营利组织和风投支持团队销售 AI
              驱动发现平台，以及湿实验室或干实验室服务。公开记录显示出几种不同商业机制：发现服务关系、固定费用 Innovation
              Subscriptions、平台许可、包含预付款和交付挂钩付款的合作协议，以及下游里程碑或特许权使用费分成。产品页面把该模型延伸到药理学、细胞治疗开发、抗体优化、双特异性抗体发现和遗传药物工作，意味着 Alloy
              既能在早期发现阶段收钱，也能在后续开发交接点捕获收入。缺失的是组合结构：公开来源没有说明服务与许可各贡献多少收入，订阅定价实际如何运作，收入基础中一次性项目和重复或经常性需求各占多少。这种组合不确定性很重要，因为同样的业务宽度既强化战略定位，也可能掩盖波动的定制服务
