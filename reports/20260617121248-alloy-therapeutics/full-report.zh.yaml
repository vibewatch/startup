      - 公开商业模式信号
      - 公开价格 / 合同指标
      - 可见包含内容
      - 含义
    rows:
      - - Alloy Therapeutics
        - 定制伙伴关系、服务、技术访问、下游经济权益
        - 无公开客户价格表；公司称从想法到人体数据成本 < $10M
        - 发现平台、AI/ML、模态服务、开发交接
        - 包装很宽，但定价尽调必须依赖私有合同
      - - Adimab
        - 资助型发现和灵活的伙伴对齐合作
        - 未披露公开价格表
        - 抗体发现、工程、可开发性、定制合作
        - 信任位置强，但公开资料无法对标单次发现项目经济性
      - - AbCellera
        - 伙伴发现加下游能力和内部管线能力
        - 仅公开收入；未披露单项目价格
        - 抗体发现、转化科学、开发、制造
        - 经济上行很可能与里程碑和版税挂钩，但客户定价仍不透明
      - - Recursion
        - 合作收入加里程碑付款
        - 2025 年收入 $74.7M；迄今里程碑 >$500M；Sanofi 入账 $134M，Roche/Genentech 入账 $213M
        - 平台访问嵌入伙伴发现和项目包
        - 买方评估的是战略合作经济性，而不是标准服务菜单
      - - Schrödinger
        - 软件许可 / 托管合同加合作
        - 2025 年 ACV $198.5M；27 个客户 ACV 超过 $1M；NDR 100%
        - 托管或本地软件访问，加药物发现合作
        - 最接近的公开可比项，用来观察可复用包装和续约行为
      - - Evotec
        - 从单项服务到一体化长期伙伴关系
        - 披露分部收入；无公开标价
        - 发现、临床前开发、生物药开发、制造相关服务
        - 规模和灵活性可见，但价格对标仍需审查私有交易
      - - Generate Biomedicines
        - 合作收入加公开市场融资
        - IPO 价格 $16；IPO 募资总额 $400M；2026 Q1 收入 $7.2M
        - 平台合作和内部 / 伙伴临床项目
        - 公开融资可见，但客户包装仍按合作定制
      - - insitro
        - 私有平台伙伴关系
        - 无公开收入或价格披露；融资由第三方追踪机构披露
        - ML 平台和伙伴管线开发
        - 核心结论是不透明：公开资料无法对标定价和变现
    notes: 这张表刻意把定价和包装拆开，因为多数同行只披露后者，不披露前者。公开指标本来就不可直接横比——ACV、合作收入、公开市场融资和里程碑现金都能暴露合同结构，但都不能替代干净的单次发现项目价格比较。
