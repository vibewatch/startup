      - number: '7.3'
        title: 合作伙伴、依赖与融资风险
        blocks:
          - type: paragraph
            body: >-
              Alloy 的商业模式天生依赖协作，依赖风险也就不是偶然项，而是内生项。公司公开瞄准大型生物制药、小型生物科技、学术机构、创业者和风险支持的建设者，并称目前拥有 200
              多个合作伙伴。但可观察证据仍集中在少数具名关系上，例如 Biogen、AbbVie、Mediar、Tahoe、IPI、Swiss Rockets 和 Scripps。这些合作的公开经济条款也不均衡：Biogen
              和 AbbVie 只披露了部分结构，Tahoe 则引入 newco 和融资依赖，而不是简单的服务费确定性。Series E 叙事进一步提高了对生物科技融资周期的敏感度，因为 Alloy
              明确在推资本效率更高的虚拟生物科技和精简团队。行业先例放大了融资风险。公开 techbio
              和平台可比公司即便已经扩大合作伙伴和临床阶段资产，仍显示亏损、重组或长期里程碑依赖。因此，合作伙伴集中度和商业模式耐久性是核心尽调问题，不是边缘问题。
