  - id: TV005
    title: 论点破裂与终止触发表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - 降价融资
        - 新一轮新发行融资低于 2026 年 4 月 $1.0B 定价。
        - 会说明最新私募定价不耐久，并迫使上行假设全面重置。
        - 从下行情景重新承销，并检查优先权条款。
      - - 经济性不透明延续
        - 到下一轮融资或重大流动性事件，仍未披露收入、利润率、烧钱速度或留存。
        - 估值会继续困在叙事区间，阻断基于可比公司的重估。
        - 维持继续研究立场，避免追高。
      - - 合作伙伴质量转弱
        - 出现流失、重复参与度弱，或推进中的具名高质量项目减少等证据。
        - 削弱生态密度论点，并质疑商业耐久性。
        - 降低信心，重新审视基准区间。
      - - 服务压过杠杆
        - 披露结构显示，大部分价值来自重人工开发服务，而不是可规模化平台经济。
        - 合适可比公司集合会被压向低倍数服务同业。
        - 如果价格不调整，将立场从偏高切换到昂贵。
      - - 监管质量负担上升快于控制披露
        - AI 和细胞疗法质量要求，比 Alloy 的控制披露更显眼。
        - 推高执行风险，并降低对溢价估值的信心。
        - 在超越观察状态前，要求完成质量 / 合规尽调。
    notes: 这些触发项可以从未来融资、披露和合作伙伴行为中跟踪，而不是依赖抽象情绪。
    claimRefs:
      - CV026
      - CV035
      - CV036
      - CV039
      - CV041
      - CV046
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人或尽调路径
    rows:
      - - 收入结构
        - 平台访问、服务、里程碑、版税和新公司经济之间的收入拆分。
        - 没有结构，投资者无法判断 Alloy 应获得软件式溢价，还是服务占比高的倍数。
        - 管理层尽调包或未来融资材料。
      - - 毛利率和经营杠杆
        - 各业务线利润率，以及 AI 和湿实验成本结构如何随规模变化。
        - 决定全栈模型会复利增长，还是变得运营沉重。
        - 管理层披露、经审计报表，或 NDA 下的董事会材料。
      - - 重复预订 / 留存
        - 关键合作伙伴队列的续约率、重复支出和项目扩张行为。
        - 仅有合作伙伴数量，无法证明需求耐久。
        - 客户队列分析和合同审查。
      - - 现金消耗、跑道和融资依赖
        - 当前现金余额、烧钱速度，以及未来增长需要多少外部资本。
        - 这是判断下一轮融资是选择还是必要的前提。
        - 财务尽调和股权结构审查。
      - - 优先权结构和 JV 经济性
        - 清算优先权、投资者权利，以及 82VS 或合资公司所有权经济。
        - 如果优先权或新公司结构先吸收上行，私募定价就不等于普通股价值。
        - 法律尽调、章程文件和附函审查。
    notes: 这些问题会阻断可投资估值判断，不是增量好奇心。
    claimRefs:
      - CV025
      - CV026
      - CV030
      - CV031
      - CV032
      - CV047
