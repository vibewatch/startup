            body: >-
              Alloy 的护城河在买方需要伙伴优先的生物药引擎时最强：这套引擎能覆盖抗体发现、AI 引导的 hit
              mining、模态扩展和下游开发交接，而不强迫客户搭建完整内部栈。这是面对狭窄专家和纯软件工具的真实切入口。但护城河并非牢不可破。公开 AI
              平台可比公司经历过明显估值压缩，说明投资人会折价平台故事，直到它转化为持久临床证据或现金流证据。大型药企也可以把更多 AI 驱动发现能力内化，尤其是在数据控制和工作流所有权重要的战略项目上。另一边，Adimab
              等专家在买方更看重品类最佳抗体深度而非模态宽度时仍能持续获胜；客户想要工业化规模和更宽外包伞时，Evotec 也能获胜。因此核心承销问题是 Alloy 混合模型的耐久性：它能否在具体模态里保持
              best-in-class，同时又足够宽，成为精简生物技术团队和创新密集药企团队偏好的外部基础设施层？
