  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 以 IC 风格对当前公开证据集打 1-5 分。
    data:
      items:
        - label: 市场机会
          value: 4
          note: 大品类，增长叙事强。
        - label: 平台宽度
          value: 4
          note: 从发现到开发的覆盖范围是真实的。
        - label: 转化证明
          value: 3
          note: 有一些具体合作伙伴证明，但缺少宽队列经济性。
        - label: 经济性可见度
          value: 1
          note: 公开财务披露极少。
        - label: 当前价格的可比公司支撑
          value: 2
          note: 公开交易区间显示估值标记已经偏满。
        - label: 执行复杂度
          value: 2
          note: 宽度抬高整合和服务风险。
        - label: 证据质量
          value: 2
          note: 公司证明强，投资证明弱。
    approximationNotes: 分数只是作者基于公开证据的判断；低分不代表公司弱，只代表估值材料不完整。
    claimRefs:
