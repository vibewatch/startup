      - number: '1.2'
        title: 创始人、领导层与治理
        blocks:
          - type: paragraph
            body: >-
              Errik Anderson 仍是 Alloy 治理中的核心人物，身份是创始人、首席执行官和董事长，也是融资、合作和战略公告中的公开发言人。公开的日常高管团队包括总裁 Piotr Bobrowicz、CFO
              Jeff Swenson、CSO Mike Schmidt，以及多个事业部或业务线负责人：Genetic Medicines 的 Christian Cobaugh、Insights 的 Simon
              Friedensohn、Antibody Powered 的 Richard Shimkets、Cell Therapies 和日本业务的 Victor Stone、Spannerwerks 的 Dara
              Lockert、Vigilance 的 Alexander Titus、Sovereign Innovation 的 Alasdair Thong，另有首席战略顾问 Ron Adner。2025–2026
              年的重大领导层变化偏扩张而非补救：Spannerwerks CEO Dara Lockert 随 2025 年 10 月收购加入，Cobaugh 于 2026 年 1 月获任命，Titus 于 2026 年 4
              月加入并搭建新的 Vigilance 部门。公开治理披露仍很浅：已审阅来源确认 Anderson
              为董事长并列出管理层履历，但没有发布完整董事会名单、股权结构或投资人控制图，因此关键人风险和治理集中度仍是活跃尽调问题。
