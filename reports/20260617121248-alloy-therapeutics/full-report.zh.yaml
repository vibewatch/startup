      - number: '1.3'
        title: 融资、投资人与资本结构
        blocks:
          - type: paragraph
            body: >-
              Alloy 最清晰的公开融资数据点是 2026 年 4 月 15 日的 Series E：融资 $40 million，估值 $1 billion。具名参与方包括新投资人 8VC、JIC Venture
              Growth Investments、Echo Capital 和多个家族办公室，以及既有投资方 Mubadala Capital、Presight Capital、Thiel Capital、Founders
              Fund、Alexandria Venture Investments、Gaingels 和 Ulysses Diversified Holdings。明显不透明的是历史融资目录：一份存档 Crunchbase
              档案显示，截至 2024 年底 Alloy 的上一轮融资类型是 Series D，证实 Series E
              前已有机构融资，但已审阅来源未可靠披露这些轮次的金额、日期、投后估值、持股比例或累计融资总额。已审阅来源也没有出现与 2026
              年融资相关的二级股份出售、债务融资或授信额度证据。实际结果是：估值有支撑，投资人名单有部分支撑，但资本结构深度和历史稀释仍是开放尽调事项。
