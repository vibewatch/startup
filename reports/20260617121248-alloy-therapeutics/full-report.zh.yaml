  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              在已审阅来源中，没有发现针对 Alloy 的直接公开执法行动或诉讼，因此主要承销问题不是丑闻，而是结构。Alloy 现在对外销售 AI
              驱动的发现、遗传药物、细胞治疗、下游开发支持、制造相邻执行，以及新的生物安全业务线。每加一层，合规负担都不同。FDA 2025 年 AI
              指南草案提高了门槛：只要模型生成信息被用于支持安全性、有效性或质量决策，就可能触发更高要求。人类基因治疗项目需要扎实的 CMC 包，而细胞治疗工作又落在单独的 HCT/P 框架内。与此同时，Alloy
              自己的隐私政策披露了跨境传输、分析供应商和多个关联站点，隐私治理义务也随之扩大。官网可见的法律条款也仅限公共网站使用；它没有说明合作伙伴数据集、模型训练权利或主权健康限制究竟如何治理。因此，监管质量、隐私和合同架构仍是尽调事项，而不是已经排除的风险。
