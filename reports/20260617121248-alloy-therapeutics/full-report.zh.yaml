  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 打包平台与模块地图
        blocks:
          - type: paragraph
            body: >-
              Alloy 的公开记录支撑一种技术定位：它比标准抗体工具公司更宽，但比完全自给自足的药企更窄。公司营销的是多模态基础设施层，把 AI 驱动发现软件、自有实验数据集、转基因小鼠和筛选平台，以及跨抗体、TCRm
              抗体、遗传药物、细胞治疗、药理学和下游项目支持的湿实验室服务交付组合起来。最成熟、证据最充分的模块仍是抗体发现：ATX-Gx 家族、mAbForge 筛选、in vivo-to-in silico
              mining，以及明确的合作伙伴牵引指标主导了公开材料。AntiClastic、Keyway、iPSC 衍生 iCAR-T 引擎和 Vigilance
              生物安全计划等较新业务面扩大了商业和技术足迹，但公开证据更不标准化，也更依赖公告。这意味着产品地图应被理解为分层栈：核心发现基础设施已有可见伙伴使用；扩展模态 add-ons
              具备可信差异化；不断增长的服务生态则把 Alloy 进一步推向开发、制造交接，甚至公司孵化。
