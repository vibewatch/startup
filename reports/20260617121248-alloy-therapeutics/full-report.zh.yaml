      - number: '8.2'
        title: 当前估值捕捉了什么、没有捕捉什么
        blocks:
          - type: paragraph
            body: >-
              2026 年 4 月 Series E 给了一个清晰锚点：融资 $40 million，估值 $1.0 billion，新老投资人共同支持。这确认外部资本愿意按独角兽身份融资
              Alloy，但并不自动证明估值保守。公司自己的材料讲出了一个对论点有利且连贯的故事：全栈发现到开发基础设施模型、广泛模态覆盖、全球科学足迹、AI 和数据基础设施与湿实验室执行结合，以及
              Biogen、AbbVie、Mediar、Tahoe、IPI 和 Spannerwerks 带来的下游工作等反复出现的合作参与案例。尤其是 Mediar，给 Alloy 提供了一个公开案例研究：合作伙伴称
              Alloy 加快了进入临床的时间线。


              反论点不在于 Alloy 是否真实，而在于公众能否给它估值。Alloy 关于 AI
              驱动降本提速的说法仍是公司说法，不是经审计的单位经济。合作公告披露部分关系包含首付款、里程碑和版税，但很少披露合同价值、期限，或经常性收入与事件驱动收入的占比。Tahoe 和 82VS
              又增加一层复杂性：部分价值捕获可能落在长期分拆公司股权，而非近期服务收入。Spannerwerks
              扩大了可触达的钱包份额，但也把业务组合推向执行较重的服务；公开市场给这类服务的倍数历来低于纯软件或轻资产平台。简言之，当前估值捕捉了战略野心和部分相关性证明，但公开证据仍无法把耐久经济性与叙事宽度分开。
