      - number: '2.2'
        title: 规模测算视角与边界敏感的矛盾
        blocks:
          - type: paragraph
            body: >-
              最宽的开源自上而下视角是 Mordor Intelligence 的 AI 药物发现市场，估计 2026 年支出为 $3.25 billion，并指向 2031 年前的快速增长。这个口径对 Alloy
              不能直接使用，因为同一报告混合了软件、服务、小分子、靶点识别、从头设计和多个终端用户类别；GMI 的范围预览还更进一步，明确纳入 CRO 终端用户和宽泛应用桶。更相关的中间口径是 Mordor 的 2026 年
              $0.79 billion 服务切片，但它对 Alloy 仍偏宽，因为涵盖跨模态和跨供应商的 turnkey AI 发现工作。更窄、受证据约束的底线来自公开可比公司的收入：AbCellera 2025 年收入
              $75.1 million，Schrödinger 2025 年药物发现收入 $56.4 million，Generate 2026 年 Q1 合作收入 $7.2 million；若持平，年化约 $28.8
              million。这个组合给相邻合作平台需求的一个子集拼出约 $160 million 的可观察底线。矛盾不是错误，而是本章的核心市场结论。通用 AI TAM 对战略叙事有方向性价值，但 Alloy
              可服务需求落在公开可比收入和宽口径 AI 服务切片之间，不在完整市场 headline 上。
