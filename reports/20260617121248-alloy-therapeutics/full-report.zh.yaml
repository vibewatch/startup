        - 中等上行空间，偏推测
        - 可能把终端市场从传统生物制药分散出去
        - 询问具名机构、试点、赠款或采购历史
      - - 具名证明集中
        - 公开证明集中在少数 2026 年旗舰关系
        - 高风险
        - 如果 200+ 客户宇宙大多未披露，营销证明可能夸大广度
        - 索取前 20 大交易方和分细分市场账户数量
      - - 经济不透明风险
        - 未披露交易金额和头部客户收入占比
        - 关键信息缺口
        - 公开证据无法量化集中度风险
        - 按头部账户、细分市场和模态索取收入
      - - AI 验证风险
        - 2026 年独立评述仍提示数据质量、可解释性和验证问题
        - 中等风险
        - 如果平台主张跑在湿实验室证据前面，客户转化可能放慢
        - 索取赢单 / 输单数据、基准研究和外部验证案例
