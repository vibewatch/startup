  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户模型与分群
        blocks:
          - type: paragraph
            body: >-
              Alloy 最适合被理解为生物技术基础设施提供商；它的客户通常是合作者、被许可方和共同孵化公司的交易对手，而不是传统 SaaS 订阅者。公司自己的合作语言覆盖大型生物制药公司、中小型生物技术公司、创业者、VC
              支持团队、非营利组织和学术机构；2026 年 Series E
              信息还明确吸引想使用而非拥有发现和开发基础设施的虚拟生物技术公司和精简开发团队。公开证据也显示多条变现路径：发现服务关系、固定费用访问、多靶点许可、预付款加里程碑结构，以及共同创建
              newco。这种宽度是优势，但也意味着 200+ 合作伙伴 headline 不应被解读为 200+ 已披露付费客户。已验证足迹是全球性的，但客户地理仍只通过运营枢纽和少量具名 logo
              部分披露，而不是完整账户名单。公开披露到此为止。
