- id: adoption-and-proof
  title: Adoption Trajectory and Named Customer Proof
  body: The strongest adoption evidence is a trajectory, not a single metric. In October 2024, Alloy said ATX-Gx alone had been used by 170+ partners; by April 2026 the company said it had 200+ partners overall, 100+ licensed therapeutic programs, and 22 programs in the clinic, including two in Phase 3. That is meaningful breadth, but the more diligence-relevant question is which named counterparties show real deployment and observable outcomes. Here the public record is strongest for Scripps, Mediar, Tahoe, IPI, Biogen, AbbVie, and Swiss Rockets/Torpedo. Scripps provides broad institutional deployment proof, Mediar provides outcome-specific case-study evidence, Tahoe provides a two-program ADC newco, and IPI shows concrete platform asset creation. Biogen and AbbVie validate interest from top-tier pharma, though their disclosed outcomes remain less specific than the biotech and academic examples. The result is credible customer proof, but only for a narrow subset of the claimed partner universe.
