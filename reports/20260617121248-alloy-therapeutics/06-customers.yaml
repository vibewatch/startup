  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: paying-customer-count
    missingEvidence: A count of paying customer accounts separated from the broader 200+ collaborator and partner figure, ideally broken out by discovery service, license, and co-build relationship type.
    whyItMatters: Without a paid-account denominator, the headline partner count overstates what can be concluded about active monetized customer breadth.
    diligencePath: Request a current customer segmentation bridge from total relationships to active paid accounts, plus revenue concentration by segment.
    relatedQuestionRefs:
    - QU002
    - QU020
    relatedTableRefs:
    - TU001
    - TU006
  - type: private-evidence-only
    severity: material
    topic: retention-metrics
    missingEvidence: NRR, GRR, logo retention, renewal timing, and satisfaction data for the customer base or at least for the largest segments.
    whyItMatters: Repeat-engagement anecdotes are not enough to underwrite durability or expansion economics.
    diligencePath: Request cohort retention, renewal rates, and any NPS or customer-survey materials by segment.
    relatedQuestionRefs:
    - QU017
    - QU024
    relatedTableRefs:
    - TU004
    - TU005
  - type: enumeration-incomplete
    severity: material
    topic: named-customer-universe
    missingEvidence: A fuller roster of named customers, especially among the 200+ relationships that are not publicly described with enough detail for diligence.
    whyItMatters: The named proof set may not be representative of the broader partner base, creating selection bias in public traction signals.
    diligencePath: Request a top-20 counterparty list with segment, modality, stage, and whether the relationship is paid, licensed, or co-built.
    relatedQuestionRefs:
    - QU009
    - QU025
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: concentration-exposure
    missingEvidence: Top-customer revenue share, spend by named account, and modality-level revenue concentration.
    whyItMatters: Public sources show marquee names but do not reveal whether one or two accounts dominate economics.
    diligencePath: Request customer revenue concentration schedules, pipeline mix by counterparty, and deal-value bands for major accounts.
    relatedQuestionRefs:
    - QU020
    - QU024
    relatedTableRefs:
    - TU006
  - type: missing-source
    severity: minor
    topic: vigilance-customers
    missingEvidence: Named government, philanthropic, or national-security buyers for the Vigilance division.
    whyItMatters: Mission-partner diversification could matter strategically, but today it is a thesis rather than verified customer traction.
    diligencePath: Ask for named pilots, grants, procurement vehicles, or letters of intent tied to Vigilance.
    relatedQuestionRefs:
    - QU022
    relatedTableRefs:
    - TU001
    - TU006
