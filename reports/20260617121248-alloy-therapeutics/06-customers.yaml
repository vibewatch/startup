- id: TU006
  title: Expansion drivers and concentration risks
  columns:
  - Expansion driver / risk
  - Evidence
  - Impact
  - Why it matters
  - Diligence path
  rows:
  - - Large-pharma platform deals
    - Biogen and AbbVie both signed 2026 platform agreements
    - High upside
    - Validates demand from sophisticated buyers and can seed follow-on programs
    - Ask for number of targets, duration, and downstream economics by program
  - - Academic / nonprofit funnel
    - Scripps and IPI show institution-scale and nonprofit proof
    - Medium upside
    - Academic and nonprofit channels can create broad user exposure and new modality assets
    - Request usage depth, publication output, and conversion into commercial programs
  - - Downstream services attach
    - Spannerwerks and Wheeler extend Alloy from discovery to IND support
    - High upside
    - Raises switching costs and can turn one campaign into a broader account
    - Ask for attach rate and revenue contribution from expansion services
  - - Venture / newco formation
    - Tahoe JV and 82VS company creation model
    - High upside, higher risk
    - Lets Alloy capture asset-level upside instead of only service revenue
    - Review ownership, governance, and follow-on financing commitments
  - - Mission-partner channel
    - Vigilance is targeting government and philanthropic partners
    - Medium upside, speculative
    - Could diversify end markets beyond classic biopharma
    - Ask for named agencies, pilots, grants, or procurement history
  - - Named-proof concentration
    - Public proof is concentrated in a handful of flagship 2026 relationships
    - High risk
    - Marketing proof can overstate breadth if most of the 200+ universe is undisclosed
    - Request top-20 counterparties and segment-level account counts
  - - Economic-opacity risk
    - Deal values and top-customer revenue shares are not disclosed
    - Critical information gap
    - Makes concentration risk impossible to quantify from public evidence
    - Request revenue by top account, by segment, and by modality
  - - AI-validation risk
    - Independent 2026 reviews still flag data-quality, interpretability, and validation problems
    - Medium risk
    - Could slow customer conversion if platform claims outrun wet-lab proof
    - Request win/loss data, benchmark studies, and external validation examples
  notes: Impact ratings are analytical judgments. The core issue is not that concentration is proven to be bad, but that public disclosures are too thin to measure it precisely.
