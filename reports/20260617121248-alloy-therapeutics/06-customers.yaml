  - Production vs pilot / stage
  - Observable outcome
  - Limitation
  rows:
  - - Scripps Research
    - Academic / nonprofit
    - Institutional ATX-Gx license for antibody and vaccine discovery
    - Production-like institutional deployment
    - Non-exclusive license enables all Scripps scientists to use the platform
    - No disclosed economics, program count, or utilization by lab
  - - Biogen
    - Large biopharma
    - AntiClastic multi-target collaboration and license for antisense targets
    - Active platform collaboration
    - Upfront, milestones, and royalties disclosed in structure; deal builds on prior platform use
    - Targets, program count, and value remain undisclosed
  - - AbbVie
    - Large biopharma
    - Multi-year antibody platform development agreement
    - Active platform-development relationship
    - Upfront plus delivery-linked payment disclosed in structure
    - No public outcome data or downstream program economics
  - - Mediar Therapeutics
    - Clinical-stage biotech
    - Antibody discovery for fibrosis targets
    - Completed discovery collaboration with repeat engagement
    - Case study says candidates moved six months earlier than expected and prior work informed MTX-463 now in Phase 2
    - No standalone revenue disclosure or attribution of later Mediar value
  - - Tahoe Therapeutics / ADC newco
    - Venture / biotech
    - Jointly seeded company around two first-in-class ADC programs
    - Newco formation; preclinical development
    - Two-program spinout built around Tahoe targets and Alloy ADC capabilities
    - No clinical results or financing terms disclosed
  - - Institute for Protein Innovation
    - Nonprofit technology collaborator
    - Creation of bespoke VHH libraries for bispecific and multispecific discovery
    - Active platform build
    - Two synthetic humanized libraries and explicit outsourcing proposition for biotech and pharma
    - Commercial uptake and program conversion not yet disclosed
  - - Swiss Rockets / Torpedo
    - Biotech collaborator
    - Multi-target oncology radioligand collaboration under master research agreement
    - Active discovery collaboration
    - Extends Alloy into radioligand therapeutics and translational development
    - No program count, milestones, or customer economics disclosed
  notes: Rows describe the highest-confidence named counterparties with specific use cases. Production-like here means broad operational deployment of a licensed platform, not commercial product sales to end patients.
