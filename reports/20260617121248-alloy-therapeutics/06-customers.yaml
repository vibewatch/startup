figures:
- id: FU001
  title: Customer journey map — From first engagement to platform expansion
  type: journey-map
  layout: wide
  summary: Shows how Alloy typically lands discovery work, proves value, and then widens the relationship into additional modalities, development services, or company creation.
  data:
    items:
    - label: Discover
      detail: Large biopharma, biotech founders, academics, and nonprofits encounter Alloy through its platform ecosystem, venture networks, or scientific partner referrals.
    - label: Evaluate fit
      detail: Counterparty chooses a modality-specific entry point such as ATX-Gx, AntiClastic, VHH libraries, cell therapies, or computational discovery support.
    - label: Initial contract
      detail: Relationship starts as a discovery-service campaign, institutional license, multi-target collaboration, or jointly seeded newco structure.
    - label: Generate proof
      detail: Alloy and the counterparty aim to show tangible proof such as binders, target validation, better developability, or faster advancement into IND-enabling work.
    - label: Expand scope
      detail: Satisfied counterparties can add new modalities, development consulting, manufacturing handoffs, or additional targets rather than switch vendors.
    - label: Scale upside
      detail: Highest-depth relationships move toward repeat programs, broad institutional access, or 82VS-style company creation instead of a single campaign.
  approximationNotes: This map is inferred from named relationship structures across Scripps, Mediar, Biogen, Tahoe, IPI, Spannerwerks, and Wheeler. It is a generalized journey rather than a published funnel from Alloy.
