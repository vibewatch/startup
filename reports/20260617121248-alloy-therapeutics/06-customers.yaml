- id: TU003
  title: Named customer proof table
  enumerationScope:
    coverage: partial
    basis: Publicly named counterparties with enough detail to classify deployment or collaboration status as of 2026-06-17. The population is partial because Alloy discloses 200+ partners but only a small subset is described with enough specificity for inclusion.
  columns:
  - Counterparty
  - Segment
