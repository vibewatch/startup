company:
  name: Alloy Therapeutics
chapter:
  number: 6
  title: Customers
  summary: Alloy shows broad collaborator demand, but the public proof base is relationship-heavy rather than recurring-customer-heavy. Named evidence spans academic, large-pharma, biotech, and venture/newco counterparties, with the clearest operational outcome proof coming from Scripps, Mediar, Tahoe, and IPI. Retention and concentration remain opaque because the company discloses 200+ partners and 100+ programs but not paying-customer counts, renewal cohorts, or top-account revenue share.
sections:
- id: customer-model
  title: Customer Model and Segmentation
  body: 'Alloy is best understood as a biotech infrastructure provider whose customers are usually collaborators, licensees, and venture-building counterparties rather than conventional SaaS subscribers. Its own partnering language spans large biopharma, small and mid-sized biotech, entrepreneurs, VC-backed builders, nonprofits, and academics, while the 2026 Series E messaging explicitly courts virtual biotechs and lean development teams that want discovery and development infrastructure without owning it. Public proof also shows multiple monetization paths: discovery-service relationships, flat-fee access, multi-target licensing, upfront-plus-milestone structures, and co-built newcos. That breadth is a strength, but it also means the headline 200+ partner count should not be read as 200+ disclosed paying customers. The verified footprint is global, but customer geography remains only partially disclosed through operating hubs and a small named-logo set rather than a full account roster.
    Publicly.'
  claimRefs:
  - CU001
  - CU004
  - CU005
  - CU006
  - CU007
