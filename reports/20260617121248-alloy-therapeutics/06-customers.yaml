  rows:
  - - Large biopharma
    - Platform-licensee and research payer
    - Biogen; AbbVie
    - Multi-target antibody or ASO discovery against undisclosed targets
    - Two 2026 named deals with upfront economics; program specifics mostly undisclosed
    - No account count, contract values, or downstream performance data
  - - Clinical-stage biotech collaborators
    - Program sponsor and development partner
    - Mediar; Tahoe; Swiss Rockets / Torpedo
    - Discovery campaign execution, target validation, ADC or radioligand development
    - 'Strongest outcome proof: Mediar case study; Tahoe two-program newco; Swiss Rockets modality expansion'
    - Public proof set is narrow and economics are mostly undisclosed
  - - Academic / nonprofit institutions
    - Institutional licensee or technology co-developer
    - Scripps Research; Institute for Protein Innovation
    - Broad platform access, vaccine and antibody discovery, VHH library creation
    - Scripps covers all scientists; IPI created two humanized libraries
    - No disclosed revenue or usage intensity by lab/team
  - - Virtual biotech / founder-build channel
    - Company-creation beneficiary and co-build partner
    - 82VS-backed Tahoe newco; entrepreneurs and VC-backed builders in partnering pages
    - Spin out assets, co-build therapeutics, access infrastructure without owning it
    - Series E materials explicitly target capital-efficient builders
    - No public count of active venture-studio companies using Alloy
  - - Downstream ecosystem services
    - Expansion add-on for existing customers
    - Spannerwerks; Wheeler Bio
    - IND support, CMC, regulatory, clinical operations, manufacturing handoff
    - Supports land-and-expand beyond discovery into development execution
    - No disclosed attach rate from discovery customers into downstream services
  - - Mission / biosecurity counterparties
    - Potential government, philanthropic, or national-security buyer
    - Vigilance division partners (unnamed)
    - Rapid therapeutic response, supply-chain resilience, and countermeasure development
    - New division announced in 2026
    - No named government customers or signed contract disclosures
  notes: Segmentation is based on named public counterparties and Alloy’s own partnering language. The table mixes customers, licensees, collaborators, and co-build channels because public disclosures do not separate them cleanly.
