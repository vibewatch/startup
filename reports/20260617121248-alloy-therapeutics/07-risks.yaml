- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - AI credibility and translation risk
    - Programs entering IND-enabling or clinical stages from Alloy-linked work
    - Headline program counts stall for 12 months or new case studies lose outcome specificity
    - Re-underwrite the AI-enabled differentiation and downgrade the infrastructure-premium thesis.
  - - Regulatory-quality risk in new modalities
    - Partner audit findings, IND delays, or repeat CMC remediation requests
    - Two or more material quality or regulatory slips in gene or cell programs within 12 months
    - Treat full-stack expansion as a liability and revisit the development-services strategy.
  - - Security and data-governance risk
    - Independent control evidence, DPA disclosures, or incident notices
    - Management cannot provide third-party attestations or disclose a clean recent incident log under NDA
    - Pause underwriting until security and privacy controls are proven.
  - - Partner concentration and economics opacity
    - Top-partner revenue share and renewal data
    - Any single partner exceeds 20% of revenue or flagship partners are non-renewed without offsetting wins
    - Assume narrative concentration is real and haircut growth and margin assumptions.
  - - Execution and platform-sprawl risk
    - Org simplification, new-line milestones, and integration cadence
    - Multiple new lines miss milestones simultaneously or leadership turnover hits core divisions
    - Shift from platform premium to conglomerate discount framing.
  - - Valuation / sector-mark risk
    - Public comp trading marks and profitability trajectory
    - Platform comps remain sub-scale in valuation and structurally loss-making while Alloy seeks richer marks
    - Demand steeper entry discipline and proof of superior economics before underwriting a premium.
  notes: These kill criteria are designed to be monitorable rather than rhetorical. Each is tied to a concrete operating, regulatory, customer, or financing signal that would force a material re-rating of the investment thesis.
