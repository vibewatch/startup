  evidenceGaps:
  - type: missing-source
    severity: material
    topic: security-attestation
    missingEvidence: Independent evidence of SOC2, ISO 27001, GxP quality-system scope, uptime SLAs, and incident-response procedures covering Alloy’s partner-facing infrastructure.
    whyItMatters: Without third-party control evidence, investors cannot distinguish a well-governed bioinformatics platform from a marketing-layer data-security story.
    diligencePath: Request SOC2 or ISO reports, recent penetration-test summaries, DPA templates, and a list of named security/compliance owners under NDA.
    relatedQuestionRefs:
    - QR013
    - QR014
    relatedTableRefs:
    - TR002
  - type: private-evidence-only
    severity: material
    topic: partner-concentration
    missingEvidence: Revenue share by top partner, renewal cohorts, milestone timing, and exposure to any single pharma, biotech, or newco relationship.
    whyItMatters: The public proof set is narrow relative to the 200+ partner headline, so concentration could be much higher than the marketing surface suggests.
    diligencePath: Request cohort revenue, top-10 partner exposure, backlog, renewal cadence, and named program economics by segment.
    relatedQuestionRefs:
    - QR016
    - QR017
    - QR018
    relatedTableRefs:
    - TR003
  - type: private-evidence-only
    severity: material
    topic: succession-and-retention
    missingEvidence: Formal succession planning, retention packages for modality leaders, and attrition data across newly added divisions and acquired teams.
    whyItMatters: Execution risk rises sharply when a founder-led platform broadens into multiple operating lines without visible succession controls.
    diligencePath: Review board-approved succession materials, org charts, and 12-month attrition by critical function under NDA.
    relatedQuestionRefs:
    - QR021
    - QR022
    relatedTableRefs:
    - TR004
  - type: missing-source
    severity: material
    topic: biosecurity-and-mission-line
    missingEvidence: Contract structure, customer identity, and compliance framework for Vigilance or other sovereign-health engagements.
    whyItMatters: Mission-oriented counterparties can impose export-control, data-localization, and procurement restrictions that differ from standard biotech collaborations.
    diligencePath: Request a sample mission-partner contract, export-control counsel memo, and data-segregation architecture for sovereign or government work.
    relatedQuestionRefs:
    - QR020
    - QR030
    relatedTableRefs:
    - TR003
  - type: conflicting-data
    severity: minor
    topic: litigation-and-incidents
    missingEvidence: A comprehensive legal and cybersecurity diligence sweep rather than absence-of-public-disclosure inference.
    whyItMatters: Public web search and company pages can miss sealed disputes, customer notices, or quietly settled incidents.
    diligencePath: Run litigation, UCC, and cyber-breach database checks through counsel and ask management for a claims-and-incidents schedule.
    relatedQuestionRefs:
    - QR014
    relatedTableRefs:
    - TR001
    - TR002
