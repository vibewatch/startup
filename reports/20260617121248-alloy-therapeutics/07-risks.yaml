- id: partner-dependency-and-financing-risk
  title: Partner, Dependency, and Financing Risk
  body: 'Alloy’s business model is collaborative by design, which means dependency risk is intrinsic rather than incidental. The company publicly targets large biopharma, smaller biotech, academics, entrepreneurs, and venture-backed builders, and it now claims more than 200 partners. Yet the observable proof base remains concentrated in a small set of named relationships such as Biogen, AbbVie, Mediar, Tahoe, IPI, Swiss Rockets, and Scripps. Public economics for those collaborations are also uneven: Biogen and AbbVie disclose only partial structure, while Tahoe introduces newco and financing dependence instead of simple fee-for-service certainty. The Series E narrative further increases sensitivity to biotech funding cycles because Alloy is explicitly pitching capital-efficient virtual biotechs and lean teams. Financing risk is amplified by sector precedent. Public techbio and platform comps still show losses, restructuring, or long-dated milestone dependence even when they have scaled partnerships
    and clinic-stage assets. That makes partner concentration and business-model durability central diligence questions, not peripheral ones.'
