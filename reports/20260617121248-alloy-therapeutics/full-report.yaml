  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization architecture
        blocks:
          - type: paragraph
            body: >-
              Alloy’s public materials support a multi-surface monetization model rather than a single SKU. The company
              sells AI-enabled discovery platforms and wet or dry lab services to large biopharma, smaller biotech,
              academics, entrepreneurs, nonprofits, and venture-backed builders. The public record shows several
              distinct commercial mechanisms: discovery service relationships, flat-fee Innovation Subscriptions,
              platform licenses, collaboration agreements that include upfront and delivery-linked payments, and
              downstream milestone or royalty participation. Product pages extend that model into pharmacology,
              cell-therapy development, antibody optimization, bispecific discovery, and genetic-medicines work,
              implying that Alloy can capture revenue both at early discovery and later development handoff points. What
              remains absent is the mix: public sources do not say how much revenue comes from services versus licenses,
              how subscription pricing works in practice, or what portion of the base is one-time project work versus
              repeat or recurring demand. That mix uncertainty matters because the same breadth that strengthens
              strategic positioning can also mask a lumpy, custom-services P&L.
