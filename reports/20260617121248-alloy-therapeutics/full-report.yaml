      - number: '5.3'
        title: Dependencies, differentiation, and maturity
        blocks:
          - type: paragraph
            body: >-
              Alloy’s differentiation case rests on combining platform access with execution, rather than on raw
              software or raw biology alone. The strongest public moat elements are the transgenic-mouse base, the
              company’s in-house experimental data claims, modality-specific workflow know-how, and the ability to
              connect discovery to pharmacology, development consulting, and company creation. Partner proofs reinforce
              that thesis. Scripps institutionalized ATX-Gx access; Mediar and Tahoe validate different kinds of
              downstream partner value; IPI extends Alloy’s antibody stack with synthetic VHH libraries; and
              Spannerwerks broadens the operating system into tox, CMC, regulatory, and clinical execution. But Alloy’s
              dependencies are substantial. The public workflow still relies on proprietary datasets whose size and
              benchmark methodology are only partially disclosed, specialized wet-lab sites across multiple geographies,
              partner targets and biological context, and outside development or manufacturing relationships where Alloy
              is often the orchestrator rather than the sole operator. Competitor disclosures also temper the moat
              narrative. AbCellera, Recursion, and Schrödinger each publish more explicit platform-scale or systems
              evidence in at least one dimension, so Alloy’s public maturity signal is strongest in bundled biologics
              execution and weaker in externally benchmarked data or platform transparency.
