      - number: '7.4'
        title: People and Execution Risk
        blocks:
          - type: paragraph
            body: >-
              People risk starts with founder concentration. Errik Anderson remains the most visible architect of
              Alloy’s strategy, financing story, and ecosystem model, and no public succession plan is disclosed. The
              counter-argument is that Alloy has built a meaningful operating bench across genetics, cell therapy,
              vigilance, insights, legal, finance, strategic collaborations, Japan, the UK, and downstream drug
              development. That bench helps, but it also proves how much integration work now sits inside the
              organization. Alloy is no longer just maintaining a platform mouse franchise or a small set of discovery
              services. It is stitching together new divisions, new modalities, geographic expansion, and
              development-stage execution into one narrative. The Spannerwerks acquisition, the IPI libraries, the Tahoe
              JV, the Vigilance line, and regional expansion all add management surface area at once. That makes
              execution speed, talent retention, and clarity of operating ownership as important as scientific quality.
