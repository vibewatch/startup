companyProfile:
  summary: >-
    Alloy Therapeutics is a Waltham, Massachusetts biotech-infrastructure company that publicly positions itself as an
    AI-enabled, multi-modality drug discovery and development ecosystem. Public materials consistently cite a 2017
    founding, though the original brief carried 2018. Founder, CEO, and chairman Errik Anderson leads a business that
    serves pharma, biotech, academics, and venture-backed builders through collaborative platform access, scientific
    services, downstream development support, and company-creation capabilities rather than a single internal
    therapeutic asset. By April 2026 the company reported 200+ partners, 100+ licensed therapeutic programs, and 22
    clinical programs while remaining materially under-disclosed on revenue, cumulative capital raised, and total
    headcount.
