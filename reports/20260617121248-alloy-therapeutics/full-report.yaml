      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >-
              The growth case starts with the economics of drug discovery itself. Third-party reviews still describe a
              10-15 year development cycle, roughly $2.6 billion average development cost, and persistent clinical
              failure rates that make earlier prediction and faster kill decisions highly valuable. That favors
              AI-enabled outsourced partners when they can combine models with real wet lab validation, proprietary
              data, and translational support. Demand is further helped by cloud and hosted delivery, by
              budget-constrained biotech teams choosing make-versus-buy pragmatically, and by the faster growth of gene
              and cell therapy subsegments that align with Alloy's modality mix. The constraints are just as material.
              Reviews continue to flag data quality, patient heterogeneity, model interpretability, and experimental
              validation as real bottlenecks. Regulators increasingly expect audit trails and model lineage. Buyers
              worry about IP, data-sharing, and workflow switching costs. Talent remains scarce, and integrated wet-lab
              platform businesses are still capital intensive, as shown by persistent losses at public peers. Even the
              outsourced market is not uniformly booming: Evotec reported softness in early drug discovery during 2025,
              suggesting buyers are still selective and that platform vendors must prove ROI beyond AI branding.
            claimRefs:
