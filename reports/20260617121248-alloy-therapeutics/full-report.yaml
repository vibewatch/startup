      - number: '4.4'
        title: Financial verdict and diligence blockers
        blocks:
          - type: paragraph
            body: >-
              The most conservative financial conclusion is that Alloy likely has multiple monetization levers but
              insufficient public disclosure to underwrite revenue quality, margin path, or capital adequacy with
              conviction. The positive side of the ledger is clear: the company has diversified commercial surfaces,
              strong partner count optics, a fresh $40 million late-stage round, and public examples of upfront,
              milestone, royalty, services, and licensing economics. The cautionary side is equally clear: AI-enabled
              drug discovery still faces data-quality, interpretability, attrition, and translational bottlenecks, while
              public platform-biotech valuations remain volatile despite increasingly detailed disclosures from peers.
              For Alloy, that means the next diligence step is not to extrapolate peer multiples or assume software-like
              economics. It is to obtain private evidence on realized pricing, active paying accounts, revenue
              recognition by stream, gross margin by service line, current cash and burn, and the share of partner
              programs that convert into repeat or downstream economics. Until those data are produced, the chapter
              supports a view of Alloy as strategically credible but financially under-disclosed.
