      - number: '5.2'
        title: Operating workflow and architecture
        blocks:
          - type: paragraph
            body: >-
              The clearest public workflow starts with a partner’s target product profile or biology problem, then
              branches by modality into discovery engines that Alloy claims are stitched together by AI and shared
              wet-lab execution. In antibodies, campaigns begin with transgenic mice, proceed through immunization,
              B-cell enrichment, sequencing, repertoire mining, and then move into high-throughput expression,
              characterization, and functional testing. The same architecture extends laterally: Keyway adds
              peptide-MHC-specific discovery and off-target testing for TCRm programs; AntiClastic adds AI-guided RNA
              design, in vitro and in vivo testing, and refinement for oligonucleotide assets; pharmacology adds TPP-led
              experimental design and humanized-model readouts; and cell therapies add iPSC engineering, manufacturing
              handoff, and IND support. Operationally, Alloy is not selling isolated algorithms. It is selling a
              sequence of decision gates that combine design, screening, optimization, translational testing, and
              external development interfaces. That architecture is attractive to lean biotech teams because it reduces
              internal build requirements, but it also makes execution quality dependent on cross-site wet-lab
              throughput, partner data quality, and partner-vendor coordination rather than on software alone.
