  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold
      - Transmission to thesis
      - Action implication
    rows:
      - - Down-round financing
        - A new primary round below the April 2026 $1.0B mark.
        - Would show the latest private mark was not durable and force a full reset of upside assumptions.
        - Re-underwrite from downside range and inspect preference terms.
      - - Economic opacity persists
        - Still no revenue, margin, burn, or retention disclosure by the next financing or major liquidity event.
        - Keeps valuation trapped in narrative territory and blocks comp-based rerating.
        - Maintain research-more stance and avoid paying up.
      - - Partner quality weakens
        - Evidence of churn, weak repeat engagement, or fewer named high-quality programs progressing.
        - Undermines the ecosystem-density thesis and questions commercial durability.
        - Reduce confidence and revisit base-case range.
      - - Services overwhelm leverage
        - >-
          Disclosed mix shows most value comes from labor-heavy development services rather than scalable platform
          economics.
        - Would compress the appropriate comp set toward lower-multiple services peers.
        - Shift stance from stretched to expensive if price does not adjust.
      - - Regulatory-quality burden rises faster than controls
        - AI and cell-therapy quality requirements become more visible than Alloy’s control disclosures.
        - Raises execution risk and lowers confidence in premium valuation.
        - Require quality/compliance diligence before moving beyond watch status.
    notes: >-
      These triggers are designed to be monitorable from future financings, disclosures, and partner behavior rather
      than from abstract sentiment.
    claimRefs:
      - CV026
      - CV035
      - CV036
      - CV039
      - CV041
      - CV046
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner or diligence path
    rows:
      - - Revenue mix
        - Revenue split across platform access, services, milestones, royalties, and newco economics.
        - >-
          Without mix, investors cannot know whether Alloy deserves a software-like premium or a services-heavy
          multiple.
        - Management diligence pack or future financing materials.
      - - Gross margin and operating leverage
        - Margin by line of business plus how AI and wet-lab cost structure scales.
        - Determines whether the full-stack model compounds or becomes operationally heavy.
        - Management disclosure, audited statements, or board materials under NDA.
      - - Repeat bookings / retention
        - Renewal rates, repeat spend, and program expansion behavior for key partner cohorts.
        - Partner count alone does not prove durable demand.
        - Customer cohort analysis and contract review.
      - - Cash burn, runway, and financing dependence
        - Current cash balance, burn, and how much of future growth requires external capital.
        - Needed to know whether the next round is a choice or a necessity.
        - Finance diligence and cap table review.
      - - Preference stack and JV economics
        - Liquidation preferences, investor rights, and 82VS or joint-venture ownership economics.
        - A private mark is not the same as common-equity value if preferences or newco structures absorb upside first.
        - Legal diligence, charter documents, and side-letter review.
    notes: These asks are blocking for an investable valuation view, not incremental curiosities.
    claimRefs:
      - CV025
      - CV026
      - CV030
      - CV031
      - CV032
      - CV047
