      - number: '3.3'
        title: Pricing, packaging, and buyer switching behavior
        blocks:
          - type: paragraph
            body: >-
              Public pricing transparency is poor across the entire competitor set, which is itself an analytical
              finding. Direct biologics-platform peers do not publish price cards for discovery campaigns, licensing
              fees, or milestone ladders. What is public are packaging clues. Alloy, Adimab, and AbCellera market
              bespoke partnership structures and downstream economics. Recursion and Generate disclose collaboration
              revenue and milestone payments, which signals platform-plus- asset economics rather than clean
              external-service list pricing. Schrödinger is the only peer in this set that publicly reports software
              ACV, customer cohorts above $1 million ACV, hosted- license transition, and retention, making it the
              closest thing to a transparent packaging model. Evotec publishes segment revenue and describes flexible
              partnering models, but not customer-level price points. These gaps matter because switching costs are
              likely driven by embedded data, wet-lab workflows, transgenic assets, and transfer paths—not by a
              transparent catalog that lets buyers compare vendors line by line. The likely result is a market where
              multi-homing is common early, but deeper process integration can lock a buyer into a preferred platform
              over time.
