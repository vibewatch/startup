        title: Scale, Footprint, and Service Breadth
        blocks:
          - type: paragraph
            body: >-
              Alloy's publicly reported scale is framed primarily through partners, programs, and scientific capability
              rather than revenue or customer counts. Series E materials say the company works with more than 200
              partners, has over 100 licensed therapeutic programs, and has seen 22 programs reach clinical development
              including two Phase 3 assets. The February 2026 Mediar release used slightly different language—over 100
              active drug programs and more than 20 IND filings—suggesting similar scale but not a perfectly
              standardized KPI set across announcements. The about page adds a people signal of 100+ scientists, but
              reviewed public sources do not disclose total headcount, revenue, ARR, or customer concentration.
              Technically, Alloy spans antibodies, bispecifics, TCRms, genetic medicines, cell therapies, drug delivery,
              and pharmacology, while emphasizing AI/ML models trained on large proprietary experimental data and paired
              with global wet-lab execution. This breadth supports management's positioning of Alloy as a full-stack
              biotech infrastructure layer rather than a narrow platform licensor.
