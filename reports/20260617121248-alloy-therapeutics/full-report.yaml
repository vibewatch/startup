      - number: '6.4'
        title: Expansion Dynamics and Concentration Risk
        blocks:
          - type: paragraph
            body: >-
              Alloy’s expansion logic is compelling on paper. The company is trying to land discovery work, then widen
              the relationship through genetic medicines, cell therapies, development consulting, IND support,
              manufacturing, and 82VS-led company creation. Spannerwerks and Wheeler add downstream development
              leverage, while Vigilance introduces a possible mission-partner segment in biosecurity. The problem is
              that public disclosures still over-concentrate around a few flagship names, especially Biogen, AbbVie,
              Mediar, Tahoe, and IPI, while most of the 200+ relationship base remains undisclosed. Because public
              materials omit contract values and revenue mix, concentration cannot be quantified. Independent 2026
              AI-drug-discovery reviews also warn that data quality, interpretability, and validation gaps still limit
              broad translation, which matters because Alloy sells AI-enabled discovery as part of its infrastructure
              story. The company therefore has credible expansion vectors, but investors should treat customer
              durability and concentration as under-disclosed rather than resolved. A further diligence point is whether
              named wins are concentrated in one modality at a time, because modality-level cyclicality could compress
              repeat bookings even if logo count appears diversified.
