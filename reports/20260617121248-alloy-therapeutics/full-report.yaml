  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Bundled platform and module map
        blocks:
          - type: paragraph
            body: >-
              Alloy’s public record supports a technical positioning that is broader than a standard antibody tools
              company and narrower than a fully self-contained pharma. The company markets a multi-modality
              infrastructure layer that combines AI-enabled discovery software, proprietary experimental datasets,
              transgenic-mouse and screening platforms, and wet-lab service delivery across antibodies, TCRm antibodies,
              genetic medicines, cell therapies, pharmacology, and downstream program support. The most mature and
              best-evidenced module is still antibody discovery: the ATX-Gx family, mAbForge screening, in vivo-to-in
              silico mining, and explicit partner traction metrics dominate the public pack. Newer surfaces such as
              AntiClastic, Keyway, the iPSC-derived iCAR-T engine, and the Vigilance biosecurity initiative broaden the
              commercial and technical footprint, but public proof is less standardized and more announcement-driven.
              This means the product map should be read as a tiered stack: core discovery infrastructure with visible
              partner usage; expanding modality add-ons with plausible differentiation; and a growing services ecosystem
              that extends Alloy further into development, manufacturing handoff, and even company creation.
