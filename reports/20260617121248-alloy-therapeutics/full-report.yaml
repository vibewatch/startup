      - number: '1.3'
        title: Funding, Investors, and Capitalization
        blocks:
          - type: paragraph
            body: >-
              Alloy's clearest public financing datapoint is the April 15, 2026 Series E: $40 million at a $1 billion
              valuation. Named participants included new investors 8VC, JIC Venture Growth Investments, Echo Capital,
              and multiple family offices, alongside existing backers Mubadala Capital, Presight Capital, Thiel Capital,
              Founders Fund, Alexandria Venture Investments, Gaingels, and Ulysses Diversified Holdings. What remains
              notably opaque is the back catalog: an archived Crunchbase profile indicates that by late 2024 Alloy's
              last funding type was Series D, which confirms earlier institutional financings before the Series E, but
              the reviewed source set does not reliably disclose those round amounts, dates, post-money valuations,
              ownership percentages, or a cumulative total raised figure. No reviewed source surfaced evidence of
              secondary share sales, debt facilities, or credit lines linked to the 2026 round. The practical result is
              that valuation is supportable, investor names are partly supportable, but capitalization depth and
              historical dilution remain open diligence asks.
