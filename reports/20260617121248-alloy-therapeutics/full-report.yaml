    title: Moat durability / competitive risk register
    columns:
      - Moat claim
      - Threat
      - Severity
      - Evidence
      - Mitigation / diligence ask
    rows:
      - - Partner-first multi-modality infrastructure
        - Specialists win when buyers prefer best-in-class antibody depth over breadth
        - High
        - Adimab and AbCellera both market stronger antibody-specific proof points than Alloy
        - Request win/loss data by modality and ask where Alloy loses on pure scientific depth
      - - AI plus wet-lab feedback loop
        - AI tooling commoditizes faster than proprietary wet-lab data accrues
        - High
        - Public AI-platform comparables still rely on data-moat narratives while market caps remain compressed
        - Test whether Alloy's closed-loop data improves hit quality or cycle time in customer cohorts
      - - Discovery-to-handoff continuity
        - Bundled providers such as Evotec can offer broader downstream execution at greater scale
        - Medium
        - Evotec spans standalone services, integrated R&D, and Just-Evotec Biologics manufacturing
        - Validate whether Alloy's partner experience is better enough to overcome Evotec's scale
      - - Capital-efficient external platform for lean biotech
        - Large pharma can internalize strategic AI-enabled discovery work
        - Medium
        - AI-native and large-scale platform investment across the sector makes internal build a plausible response
        - Ask which accounts use Alloy as a permanent layer versus a bridge until internal capabilities mature
      - - Network effects from many partners and programs
        - Partner counts may overstate economic depth if relationships are shallow or non-paying
        - High
        - Alloy discloses partner and program counts but not active-paying-customer or renewal metrics
        - Review cohort data on active customers, follow-on programs, and concentration
      - - Broad modality story
        - Breadth can dilute category-best reputation versus sharper single-modality brands
        - Medium
        - >-
          Generate, Recursion, and insitro own stronger AI-native brands, while Adimab owns sharper antibody
          specialization
        - Test whether Alloy's GTM message lands as differentiated capability or as bundled complexity
      - - Private-company flexibility
        - Public-market comparables show investor patience is limited for platform stories without durable proof
        - Medium
        - AbCellera, Recursion, Schrödinger, and Evotec all trade far below earlier peak market caps
