  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              Alloy's public materials consistently frame the company as an AI-enabled partner across biologics
              discovery and development rather than a single-asset therapeutics company. The included spend is therefore
              the set of outsourced or partnered infrastructure budgets that sit between target idea and clinic-ready
              candidate: antibody and bispecific discovery, transgenic platform access, TCRm discovery, AI-guided lead
              design, pharmacology, genetic-medicines sequence design, cell-therapy enablement, and adjacent
              discovery-to-IND support. The boundary should stay narrower than total pharma R&D because large pharma
              still keeps meaningful in-house discovery capacity, and narrower than broad CRO or CDMO markets because
              Alloy's pages emphasize candidate creation, validation, and handoff rather than routine downstream
              services or commercial manufacturing. The closest status-quo substitutes are internal discovery teams,
              biologics-specialist partners such as Adimab and AbCellera, software-first platforms such as Schrödinger,
              and broader integrated R&D providers such as Evotec. That framing matters because the market can look very
              large from a top-down AI lens while remaining much smaller at the subset of spend Alloy can realistically
              capture.
