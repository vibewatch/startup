      - number: '2.3'
        title: Buyer Segments, Budget Owners, and Adoption Paths
        blocks:
          - type: paragraph
            body: >-
              Alloy's own partnering page names the practical buyer universe: large biopharma, small and medium biotech,
              entrepreneurs, VC, non-profits, and academics. Large pharma is the clearest current budget owner because
              analyst market data still shows pharma and biotech as the largest end-user segment, and platform vendors
              such as Generate, Schrödinger, and AbCellera all point to collaboration-heavy models that monetize
              external R&D budgets rather than commercial P&Ls. Emerging biotech and virtual-biotech buyers likely start
              with a single asset or modality and buy Alloy for cash efficiency, flexible execution, and the ability to
              reach decision-ready data without building a full internal discovery stack. Academics and nonprofits
              matter both as direct users of discovery platforms and as feeders into future translational programs.
              Venture studios and newcos are especially relevant because Alloy's ecosystem-allies model extends from
              discovery into preclinical, regulatory, and CMC handoff. Government and biosecurity buyers are an emerging
              adjacency rather than a proven core revenue stream today: Alloy's Vigilance division is explicitly aimed
              at mission partners, while peers such as AbCellera and Evotec show that public-health and preparedness
              buyers can fund platform infrastructure when rapid response or resilient supply chains matter.
