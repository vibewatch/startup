      - number: '8.5'
        title: Exit Paths, Thesis-Break Triggers, and Final Diligence Asks
        blocks:
          - type: paragraph
            body: >-
              The most plausible exit paths are a strategic sale or a later public-listing process, but both require
              more disclosure than exists today. Strategic buyers could value Alloy for partner access, biologics
              infrastructure, AI-enabled wet-lab integration, or the option value of owning a broader ecosystem. But
              strategic logic does not remove the need to understand current revenue mix, customer concentration, and
              what portion of future value sits in services, milestones, royalties, or newco equity. A public-listing
              route would require even more: revenue visibility, margin shape, and a narrative that can survive
              comparison with Generate, Schrödinger, Recursion, AbCellera, and Evotec in public markets.


              The thesis-break triggers are measurable. A future down-round below the April 2026 mark would force a
              reset. Continued refusal or inability to disclose basic economic metrics into the next financing would
              keep the stock-story trapped as a narrative mark. Evidence of partner churn or weak repeat engagement
              would undermine the platform thesis. And if the business mix keeps broadening into execution-heavy
              development services without showing software-like leverage, valuation should converge downward toward
              lower-multiple service comps. The blocking diligence asks are therefore straightforward: revenue by
              product line and deal type, gross margin by line, repeat-bookings or retention, cash burn and runway,
              customer concentration, preference-stack details, and 82VS or joint-venture economics. Without those, the
              recommendation should remain watchful rather than enthusiastic.
