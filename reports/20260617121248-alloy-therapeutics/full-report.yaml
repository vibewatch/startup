      - number: '3.4'
        title: Moat durability and competitive risks
        blocks:
          - type: paragraph
            body: >-
              Alloy's moat looks strongest where buyers need a partner-first biologics engine that can span antibody
              discovery, AI-guided hit mining, modality expansion, and downstream development handoff without forcing
              the customer to build a full internal stack. That is a real wedge against narrow specialists and against
              software-only tools. But the moat is not unbreakable. Public AI- platform comparables have seen material
              valuation compression, suggesting that investors discount platform stories until they convert into durable
              clinical or cash-flow proof. Large pharma can also respond by internalizing more AI-enabled discovery
              capability, especially for strategic programs where data control and workflow ownership matter. On the
              other side, specialists such as Adimab can keep winning when buyers value category-best antibody depth
              more than modality breadth, while Evotec can win when a customer wants industrial scale and a broader
              outsourcing umbrella. The core underwriting question is therefore durability of Alloy's hybrid model: can
              it stay best-in-class in specific modalities while also remaining broad enough to be the preferred
              external infrastructure layer for lean biotechs and innovation-heavy pharma teams?
