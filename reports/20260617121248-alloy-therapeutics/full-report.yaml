        blocks:
          - type: paragraph
            body: >-
              Errik Anderson remains the central figure in Alloy's governance as founder, chief executive officer, and
              chairman, and he is the public spokesperson across financing, partnership, and strategic announcements.
              Day-to-day senior leadership publicly includes Piotr Bobrowicz as president, Jeff Swenson as CFO, and Mike
              Schmidt as CSO, alongside division or business-line leaders such as Christian Cobaugh in Genetic
              Medicines, Simon Friedensohn in Insights, Richard Shimkets in Antibody Powered, Victor Stone in Cell
              Therapies and Japan, Dara Lockert at Spannerwerks, Alexander Titus at Vigilance, and Alasdair Thong in
              Sovereign Innovation, plus Ron Adner as chief strategy advisor. Material 2025-2026 leadership changes were
              expansionary rather than remedial: Spannerwerks CEO Dara Lockert joined through the October 2025
              acquisition, Cobaugh was appointed in January 2026, and Titus joined in April 2026 to stand up the new
              Vigilance division. Public governance disclosure is still shallow: reviewed sources identify Anderson as
              chairman and list leadership biographies, but do not publish a complete board roster, ownership breakdown,
              or investor-control map, leaving key-person and governance concentration as a live diligence issue.
