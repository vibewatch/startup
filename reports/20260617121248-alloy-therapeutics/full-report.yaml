        title: Customer Model and Segmentation
        blocks:
          - type: paragraph
            body: >-
              Alloy is best understood as a biotech infrastructure provider whose customers are usually collaborators,
              licensees, and venture-building counterparties rather than conventional SaaS subscribers. Its own
              partnering language spans large biopharma, small and mid-sized biotech, entrepreneurs, VC-backed builders,
              nonprofits, and academics, while the 2026 Series E messaging explicitly courts virtual biotechs and lean
              development teams that want discovery and development infrastructure without owning it. Public proof also
              shows multiple monetization paths: discovery-service relationships, flat-fee access, multi-target
              licensing, upfront-plus-milestone structures, and co-built newcos. That breadth is a strength, but it also
              means the headline 200+ partner count should not be read as 200+ disclosed paying customers. The verified
              footprint is global, but customer geography remains only partially disclosed through operating hubs and a
              small named-logo set rather than a full account roster. Publicly.
