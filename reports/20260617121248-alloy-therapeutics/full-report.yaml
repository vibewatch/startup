  - id: FE001
    title: Product architecture map
    type: stack
    layout: standard
    summary: >-
      Publicly visible architecture runs from partner problem definition into AI/data, discovery engines, screening,
      translational work, and development handoff.
    data:
      layers:
        - label: Partner access layer
          detail: >-
            Large biopharma, biotech, academics, nonprofits, and venture builders access Alloy through discovery
            services, platform licenses, subscriptions, or joint-development structures.
        - label: Data and AI layer
          detail: >-
            Proprietary experimental datasets, repertoire mining, protein language models, diffusion models, Bayesian
            optimization, and sequence-design tooling.
        - label: Discovery engine layer
          detail: >-
            ATX-Gx transgenic mice, genetic immunization, pMHC display libraries, AntiClastic sequence design, and VHH
            or multispecific library inputs.
        - label: Screening and optimization layer
          detail: >-
            mAbForge high-throughput characterization, functional assay cascades, developability filters, deep
            sequencing, and liability removal workflows.
        - label: Translational layer
          detail: >-
            In vitro and in vivo functional testing, pharmacology, immune profiling, humanized models, and
            target-product-profile-driven study design.
        - label: Development extension layer
          detail: >-
            Spannerwerks, IND support, CDMO or tech-transfer interfaces, Wheeler-style CMC access, 82VS company
            creation, and mission-driven Vigilance programs.
    approximationNotes: >-
      This stack abstracts repeated module descriptions across public pages and partner releases; Alloy does not publish
      a single canonical architecture schematic.
    claimRefs:
      - CE001
      - CE006
      - CE014
      - CE015
      - CE017
      - CE020
      - CE022
      - CE026
      - CE028
      - CE035
      - CE048
  - id: FE002
    title: Customer workflow / operating flow
    type: flow
    layout: wide
    summary: The public workflow is a modular target-to-development path rather than a standalone software loop.
    data:
      nodes:
        - id: w1
          label: Partner defines target, TPP, and modality need
          detail: Campaign begins with biological problem framing and selection of antibody, TCRm, RNA, or cell-therapy route.
        - id: w2
          label: Alloy selects discovery engine
          detail: ATX-Gx, Keyway, AntiClastic, iCAR-T, or assay-led pharmacology workflow is matched to the use case.
        - id: w3
          label: Generate candidate diversity
          detail: Immunization, library creation, or large sequence-space narrowing creates a workable candidate pool.
        - id: w4
          label: AI and repertoire mining prioritize leads
          detail: In-house datasets and models rank variants, remove liabilities, and guide design iterations.
        - id: w5
          label: High-throughput screening and characterization
          detail: mAbForge and other assay systems test affinity, specificity, developability, and function.
        - id: w6
          label: Translational and pharmacology validation
          detail: In vitro and in vivo studies, immune phenotyping, and humanized models generate decision-quality data.
        - id: w7
          label: Development handoff or extension
          detail: Programs move into IND support, CDMO transfer, Spannerwerks-led execution, or partner downstream work.
        - id: w8
          label: Asset or company outcome
          detail: Endpoints can include licensed programs, joint ventures, or venture-studio spinouts.
      edges:
        - from: w1
          to: w2
          label: scope and modality selection
        - from: w2
          to: w3
          label: choose biological engine
        - from: w3
          to: w4
          label: generate candidate pool
        - from: w4
          to: w5
          label: rank and test
        - from: w5
          to: w6
          label: nominate lead set
        - from: w6
          to: w7
          label: decision package
        - from: w7
          to: w8
          label: partner development or spinout
    approximationNotes: >-
      The flow synthesizes multiple public modality pages and partner cases into one operating map; it is not a
      disclosed single-program SOP.
