              realized ASPs, campaign profitability, or renewal behavior. Cost structure can only be inferred. Product
              pages repeatedly emphasize AI models paired with wet-lab validation, pharmacology execution, manufacturing
              handoff, IND support, and development consulting, which suggests a business with meaningful scientist,
