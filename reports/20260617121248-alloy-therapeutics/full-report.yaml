      - number: '3.2'
        title: Capability breadth, proof, and commercial models
        blocks:
          - type: paragraph
            body: >-
              The most important buying distinction is not "who uses AI" but what the buyer is actually purchasing.
              Adimab sells specialist antibody discovery and engineering with a no-internal- pipeline alignment story.
              AbCellera adds more vertical breadth, including translational, development, and manufacturing
              capabilities, plus a track record of partner-initiated programs and molecules reaching the clinic.
              Recursion, Generate, and insitro compete more on proprietary data, AI-native operating systems, and
              internal or partnered pipeline creation than on openly catalogued fee-for-service discovery. Schrödinger
              is still the clearest software-first comparable because it discloses software ACV, hosted-license
              transition, and recurring commercial customers. Evotec is the broadest bundled alternative, spanning
              standalone services, integrated R&D programs, and biologics manufacturing through Just-Evotec Biologics.
              Relative to that set, Alloy's claim is that it combines partner openness, multi-modality breadth, and wet-
              lab execution in a form that smaller biotechs can consume without building internal discovery,
              translational, regulatory, and transfer infrastructure themselves.
