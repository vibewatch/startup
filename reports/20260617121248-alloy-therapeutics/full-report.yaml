      - number: '6.3'
        title: Retention, Repeat Usage, and Satisfaction Visibility
        blocks:
          - type: paragraph
            body: >-
              Retention is the least transparent part of the chapter. Alloy does not disclose NRR, GRR, churn, renewal
              rates, customer counts by segment, or top-customer revenue shares, so there is no basis for claiming
              SaaS-style durability metrics. The available evidence is qualitative. Biogen’s 2026 ASO deal explicitly
              builds on prior work, Mediar’s latest campaign followed earlier work that informed a Phase 2 asset, and
              Scripps’ license extends to all scientists rather than a single project. Tahoe goes further by moving into
              a jointly seeded company, which suggests deeper alignment than a one-off campaign. Even so, none of these
              signals reveal spending levels, renewal timing, or economic retention. Public satisfaction proof is also
              thin: there are favorable partner quotes and a Mediar case study, but no third-party customer-review
              corpus, reference set, or survey data. The right conclusion is that repeat-engagement signals exist, but
              retention remains mostly an evidence gap rather than a published KPI.
