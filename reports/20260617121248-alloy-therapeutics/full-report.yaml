      - number: '8.4'
        title: Comparable Set, Method Choice, and Why the Price Looks Full
        blocks:
          - type: paragraph
            body: >-
              No single comp matches Alloy. Generate is the closest public AI-biotech platform newly exposed to market
              price discovery, but it is a clinical-stage public company with IPO cash and visible income statements.
              AbCellera and Recursion are useful because both disclose meaningful cash balances and revenue while still
              carrying platform-biotech losses. Schrödinger is the most informative on what a more software-like
              discovery platform can look like when it discloses ACV, retention, and gross margin. Evotec is the
              cautionary bookend for what happens when discovery and development capability becomes a scaled
              services-heavy operating model: revenue can be large while equity value stays muted. Private peers such as
              insitro and Adimab help on business-quality context but not on precise pricing because they are far less
              transparent.


              That means the right method is triangulation, not a single multiple. The public market is effectively
              saying that AI-biotech platforms with disclosed revenue can still trade around one to two billion dollars
              unless they prove differentiated economics, durable software characteristics, or unusually strategic
              assets. Alloy therefore does not need to be a bad company for the current mark to feel full. It only needs
              to be a good company that has not yet disclosed enough to deserve a large premium over public names that
              already show real revenue, balance-sheet strength, and KPI transparency. This is why the recommendation is
              price-sensitive rather than thesis-negative: the comp set supports respect for the business, but it does
              not support underwriting major upside from the known entry point.
            claimRefs:
