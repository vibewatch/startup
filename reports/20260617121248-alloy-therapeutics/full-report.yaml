  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitor clusters and Alloy's relative position
        blocks:
          - type: paragraph
            body: >-
              Alloy should be analyzed against four overlapping competitive clusters rather than one simple peer set.
              First are direct antibody-discovery specialists, led by Adimab and AbCellera, where buyers are choosing
              between trusted biologics partners for antibody generation, optimization, and clinic-readiness. Second are
              AI-native platform biotechs such as Recursion, Generate, insitro, and Schrödinger, which compete for the
              same strategic narrative—data plus models plus faster discovery—but often monetize through internal
              pipeline creation, software contracts, or milestone-heavy collaborations rather than open-ended external
              services. Third is outsourced discovery and development infrastructure, where Evotec competes with far
              more industrial scale and downstream breadth than most TechBio peers. Fourth are specialized modality
              collaborators, some of which are complements more than substitutes because they can sit alongside Alloy in
              a buyer's stack. Alloy's differentiating position is the hybrid: more open to partner use than
              pipeline-first AI biotechs, broader than antibody-only specialists, and more focused on biologics
              discovery-to-handoff than Evotec's industrial platform.
