  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation, Confidence, and Price Stance
        blocks:
          - type: paragraph
            body: >-
              Alloy Therapeutics looks like a real company-quality story and a limited investability story at the same
              time. The company has now reached a confirmed $1.0 billion post-money valuation, has broadened from an
              antibody discovery origin into a multi-modality biotech infrastructure platform, and can point to 200-plus
              partners, 100-plus licensed programs, and 22 programs in clinical development. That is stronger
              operational proof than many private AI-biotech narratives can offer. But the public record still omits the
              metrics that matter most for underwriting price: revenue, gross margin, burn, cash runway, retention,
              concentration, and the mix between platform fees, services, milestones, royalties, and spinout economics.


              That mismatch matters because the current mark already sits inside the same broad valuation neighborhood
              as several public AI-biotech and drug-discovery platforms that disclose real revenue and, in some cases,
              cash, retention, and margin data. Generate Biomedicines trades around $1.7 billion after a 2026 IPO but
              has only about $31.9 million of 2025 revenue; AbCellera and Recursion sit near $1.5-1.7 billion with
              roughly $75 million of annual revenue each; Schrödinger trades around $1.1 billion with roughly $256
              million of 2025 revenue and disclosed software KPIs; Evotec trades below $1.0 billion despite nearly €0.8
              billion of 2025 revenue. On that backdrop, Alloy’s business may be strategically attractive, but its price
              is not obviously cheap. The appropriate call is research-more, with medium confidence, high risk, and a
              stretched valuation stance.
            claimRefs:
              - CV001
              - CV003
              - CV004
