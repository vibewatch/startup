              Public pricing transparency is thin. Alloy’s strongest public commercial signals are structural, not
              numeric: its Spannerwerks acquisition text says partners can access technology through discovery services
              or a flat-fee Innovation Subscriptions offering; the AbbVie agreement discloses upfront and
              delivery-linked payments; the Biogen agreement discloses upfronts, milestones, and tiered royalties; and
