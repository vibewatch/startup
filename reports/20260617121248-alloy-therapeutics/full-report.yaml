      - number: '7.5'
        title: Mitigations, Kill Criteria, and What Would Break the Thesis
        blocks:
          - type: paragraph
            body: >-
              Alloy does have real mitigants. The company shows broad modality coverage, a credible wet-lab backbone,
              repeated partner formation, and some concrete outcome proof through Mediar, Scripps, Biogen, Tahoe, and
              IPI. The regulatory burden is also partly offset by the fact that Alloy is usually an enabler or
              collaborator rather than the ultimate sponsor of every downstream asset. But those mitigants only matter
              if they show up as evidence of controlled execution. The right kill criteria are therefore operationally
              monitorable: whether AI-enabled programs continue to reach the clinic rather than stall in validation
              loops; whether the company can disclose credible security and quality controls; whether named
              relationships turn into repeat, economically visible engagement; and whether the organization can widen
              into full-stack infrastructure without drifting into perpetual complexity. If those signals deteriorate,
              Alloy stops looking like a leverageable ecosystem and starts looking like an under-disclosed collection of
              ambitious business lines.
