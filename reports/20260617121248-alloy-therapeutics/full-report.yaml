  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >-
              No direct public enforcement action or lawsuit against Alloy surfaced in the reviewed source set, so the
              main underwriting issue is structural rather than scandal-driven. Alloy now markets AI-enabled discovery,
              genetic medicines, cell therapies, downstream development support, manufacturing-adjacent execution, and a
              new biosecurity line. Each layer adds a different compliance burden. FDA’s 2025 AI draft guidance raises
              the bar if any model-generated information is ever used to support safety, effectiveness, or quality
              decisions. Human gene-therapy programs require robust CMC packages, while cell-therapy work sits inside a
              separate HCT/P framework. At the same time, Alloy’s own privacy policy discloses cross-border transfers,
              analytics vendors, and multiple affiliated sites, which expands privacy-governance obligations. The legal
              terms visible on the public website are also limited to public-site use; they do not disclose how partner
              datasets, model-training rights, or sovereign-health restrictions are actually governed. That leaves
              regulatory quality, privacy, and contract architecture as diligence items rather than cleared risks.
            claimRefs:
