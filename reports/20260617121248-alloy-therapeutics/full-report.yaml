      - number: '1.5'
        title: Milestones and Open Risks
        blocks:
          - type: paragraph
            body: >-
              The recent chronology is dense and mostly positive: an institutional Scripps license in October 2024; a
              radioligand collaboration with Swiss Rockets in January 2025; the Spannerwerks acquisition in October
              2025; the Tahoe joint venture and Cobaugh appointment in January 2026; Mediar, AbbVie, Vigilance, Biogen,
              and Series E announcements across February through April 2026; and the IPI collaboration in May 2026.
              Collectively these milestones show Alloy moving downstream from antibody discovery toward broader
              development services, venture creation, and biosecurity-oriented work. The main adverse signals in this
              chapter are not legal or clinical failures but disclosure and execution risk: public materials do not
              substantiate cumulative capital raised, revenue, total headcount, or full board composition, and 2026
              peer-reviewed reviews of AI-enabled drug discovery continue to warn that data quality, interpretability,
              patient heterogeneity, and experimental validation remain real bottlenecks to clinical translation.
              Alloy's paired AI-plus-wet-lab model may mitigate some of that risk, but it does not eliminate the need
              for deeper diligence on economics, governance, and reproducibility.
