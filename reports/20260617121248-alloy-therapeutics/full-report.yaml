      - Limitation
    rows:
      - - Define an antibody campaign against a hard target
        - Standard discovery can underperform on diversity, specificity, or developability
        - ATX-Gx mouse strains plus tailored immunization and B-cell workflows
        - Broad sequence and epitopic coverage with human-like repertoires
        - Public pack does not quantify comparative hit-rate uplift
      - - Mine candidate repertoires after immunization
        - Manual down-selection is slow and can miss useful variants
        - Deep sequencing plus AI/ML repertoire mining and mAbForge-linked screening
        - Shorter cycle times and earlier liability filtering
        - Model-training data and false-positive rates are undisclosed
      - - Engineer a manufacturable bispecific
        - Format choice, orientation, and assay burden create iteration drag
        - ATX-CLC or VHH inputs, modular arms, and high-throughput functional assays
        - Rapid comparison of valency, orientation, and target combinations
        - No public benchmark on success rate from panel to clinic-ready lead
      - - Attack intracellular targets with antibodies
        - Traditional antibodies cannot directly reach intracellular antigens
        - Keyway TCRm workflow using pMHC libraries and translational testing
        - Adds a route into intracellular biology with explicit specificity checks
        - Public proof remains workflow-heavy and outcome-light
      - - Design RNA therapeutics against difficult sequences
        - Huge sequence search space and potency or safety tradeoffs
        - AntiClastic cyclic formats plus AI-enabled Sequence Design Studio and iterative wet-lab testing
        - Narrows candidates quickly and positions for better potency or therapeutic index
        - Independent benchmark and clinical validation remain limited in public view
      - - Generate decision-quality preclinical data
        - Discovery teams often lack fit-for-purpose pharmacology bandwidth
        - TPP-led pharmacology with humanized models, immune profiling, and global execution
        - Decision-ready data without building full internal pharmacology
        - No public service-level metrics on turnaround or reproducibility
      - - Bridge from discovery to IND or spinout
        - Lean teams often lack CMC, tox, regulatory, or company-building infrastructure
        - Spannerwerks, preferred CDMO paths, IND support, Wheeler-style ecosystem terms, and 82VS
        - Reduces handoff friction and supports capital-efficient development or company creation
        - Alloy’s exact ownership of delivery versus partner orchestration is not always clear
