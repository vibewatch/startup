      - number: '8.2'
        title: What the Current Mark Does and Does Not Capture
        blocks:
          - type: paragraph
            body: >-
              The April 2026 Series E gives a clean anchor: $40 million raised at a $1.0 billion valuation, backed by
              both new and returning investors. That confirms external willingness to finance Alloy at unicorn status,
              but it does not by itself prove the mark is conservative. The company’s own materials tell a coherent
              thesis-positive story: a full-stack discovery-to-development infrastructure model, broad modality
              coverage, a global scientific footprint, AI and data infrastructure married to wet-lab execution, and
              repeated examples of partner engagement across Biogen, AbbVie, Mediar, Tahoe, IPI, and
              Spannerwerks-enabled downstream work. Mediar, in particular, gives Alloy a public case study where a
              partner credits Alloy with accelerating timeline-to-clinic.


              The anti-thesis is less about whether Alloy is real and more about whether the public can value it.
              Alloy’s AI-enabled cost and speed claims are still company claims, not audited unit economics. Partner
              announcements disclose that some relationships include upfronts, milestones, and royalties, but they
              rarely reveal contract value, duration, or the share of revenue that is recurring versus event-driven.
              Tahoe and 82VS add another wrinkle: part of value capture may sit in long-dated spinout equity rather than
              near-term service revenue. Spannerwerks increases addressable wallet share but also nudges the business
              mix toward execution-heavy services, where public markets have historically paid lower multiples than
              investors award to pure software or asset-light platforms. In short, the current mark captures strategic
              ambition and some proof of relevance, but public evidence still cannot separate durable economics from
              narrative breadth.
            claimRefs:
