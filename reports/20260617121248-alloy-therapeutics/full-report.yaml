      - number: '2.2'
        title: Sizing Lenses and Boundary-Sensitive Contradictions
        blocks:
          - type: paragraph
            body: >-
              The broadest open-source top-down lens is Mordor Intelligence's AI-in-drug-discovery market, which places
              2026 spend at $3.25 billion and points to rapid growth through 2031. That is too broad to use directly for
              Alloy because the same report mixes software, services, small molecules, target identification, de novo
              design, and multiple end-user classes, while the GMI scope preview goes further by explicitly including
              CRO end users and wide application buckets. A more relevant middle lens is Mordor's $0.79 billion 2026
              services slice, which is still broader than Alloy because it includes turnkey AI discovery work across
              modalities and vendors. A narrower evidence-constrained floor comes from public comparable revenue:
              AbCellera reported $75.1 million of 2025 revenue, Schrödinger reported $56.4 million of 2025 drug
              discovery revenue, and Generate reported $7.2 million of Q1 2026 collaboration revenue, or roughly $28.8
              million annualized if flat. That stack produces an observable floor of about $160 million for a subset of
              adjacent partnered-platform demand. The contradiction is not an error; it is the core market lesson.
              Generic AI TAMs can be directionally useful for strategic narrative, but serviceable demand for Alloy sits
              somewhere between public comparable revenue and the broad AI-services slice, not at the full market
              headline.
