      - number: '2.5'
        title: Evidence Gaps and Valuation Implications
        blocks:
          - type: paragraph
            body: >-
              The most important unresolved inputs are company-specific rather than marketwide. Public materials do not
              disclose Alloy revenue, pricing, modality mix, customer concentration, renewal behavior, or the split
              between services, licenses, milestones, and downstream economics. That means the chapter can define
              boundary, buyers, and contradictory market lenses, but it cannot cleanly derive SAM or SOM from public
              evidence alone. The underwriting implication is that valuation should not lean on a generic
              multi-billion-dollar AI-drug-discovery headline. It should instead test how much of the narrower
              outsourced biologics-infrastructure spend Alloy can convert into repeatable revenue, how defensible its
              data-and-wet-lab integration really is, and whether partner counts translate into durable economics rather
              than marketing breadth. In other words, market narrative supports strategic relevance, but adoption timing
              and valuation will be set by revenue conversion, buyer trust, and program-level execution evidence that
              public sources still do not provide.
            claimRefs:
              - CM022
              - CM045
              - CM046
              - CM047
              - CM048
