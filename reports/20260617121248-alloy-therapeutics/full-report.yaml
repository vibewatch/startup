        title: Trust, quality, roadmap, and technology risks
        blocks:
          - type: paragraph
            body: >-
              Publicly visible trust and quality signals exist, but they are mostly workflow-level rather than
              system-level. Alloy describes specificity controls for TCRm work, developability and liability screening
              for antibodies, validated chemistries and QC for genetic medicines, humanized models and TPP-led
              pharmacology, and safety-oriented cell-therapy design choices such as γδTCR usage and feeder-free
              manufacturing. These are real technical quality signals, and partner case studies suggest they matter in
              practice. The problem is disclosure depth. Across the reviewed pack, Alloy does not publish the kind of
              benchmark datasets, reproducibility packs, release-by-release product metrics, public security
              documentation, or explicit certification inventory that would let an external investor independently grade
              the stack’s operating quality. The roadmap is also inferred more from announcements than from a product
              changelog: the chronology shows steady module expansion from licensing and mAbForge into cell therapies,
              Spannerwerks, Vigilance, IPI, and full-stack infrastructure claims, but not a transparent cadence of
              module adoption or performance deltas. Review literature adds a final caution: AI-enabled discovery still
              faces data-quality, interpretability, translational, and ADME/Tox bottlenecks. For Alloy, that means the
              technical thesis is credible, but not yet publicly benchmarked deeply enough to treat the marketing
              surface as equivalent to reproducible platform proof.
