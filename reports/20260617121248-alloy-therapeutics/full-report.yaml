      - number: '8.3'
        title: Bull, Base, and Bear Scenario Ranges
        blocks:
          - type: paragraph
            body: >-
              A disciplined scenario frame is more useful than false precision. The bear case values Alloy at roughly
              $0.4-0.7 billion. That outcome would follow if the next financing exposes disappointing revenue quality,
              if public multiples for AI-biotech and services platforms compress further, or if Alloy’s mix proves more
              service-heavy and less software-like than optimistic narratives imply. A down-round is not the base
              expectation today, but it is a real risk because public comps with disclosed revenue already trade in the
              same general band as Alloy’s private mark.


              The base case is roughly $0.8-1.1 billion. This assumes the April 2026 financing was broadly fair, that
              partner momentum and clinical progression continue, and that Alloy remains strategically relevant, but it
              also assumes no large valuation step-up until economics are disclosed. In this frame, the current mark is
              not broken, but it is already doing most of the work. The bull case reaches roughly $1.3-1.8 billion and
              requires more than continuing press-release cadence. It needs disclosed revenue, evidence of repeat
              enterprise or partner spending, proof that discovery breadth converts into attractive blended economics,
              and strategic scarcity value that makes Alloy look more like an infrastructure asset a buyer cannot easily
              replicate. The sensitivity conclusion is simple: the next leg up is much more sensitive to financial
              disclosure than to another generic platform announcement.
