        - 2025 revenue €788.4M; June 2026 market cap about $0.95B.
        - Scaled services and partnered-development platform trading at a muted public value.
        - Useful warning for what public markets pay when platform stories look services-heavy.
        - Much larger scale and different corporate history.
      - - insitro
        - Private peer; Tracxn snapshot says $643M raised and still Series C.
        - High-quality context peer without clean public valuation evidence.
        - Helps calibrate business quality and private-market enthusiasm around ML-first drug discovery.
        - No public revenue or current valuation anchor.
      - - Adimab
        - 140+ partnerships, 675+ programs initiated, 90+ clinical programs, six commercial products.
        - Mature biologics infrastructure peer used for output context, not for pricing.
        - Shows the output ceiling of a scaled antibody-enabling platform.
        - No public valuation or financial disclosure.
    notes: >-
      The table is a partial enumeration of decision-useful public and private analogs, not a claim that any one
      multiple can be ported directly to Alloy.
    enumerationScope:
      coverage: partial
      basis: >-
