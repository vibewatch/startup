      - number: '7.2'
        title: Operational, Quality, and Security Risk
        blocks:
          - type: paragraph
            body: >-
              Operationally, Alloy is asking investors to believe a broad execution story: proprietary models trained on
              large in-house experimental datasets, a global wet-lab engine, multiple biologic modalities, downstream
              development support, and manufacturing-adjacent delivery. That breadth can be powerful, but it creates
              more points of failure than a narrow discovery-license model. External reviews remain useful discipline
              here. Peer-reviewed 2026 surveys still describe AI drug discovery as limited by data quality,
              overconfidence, poor interpretability, patient heterogeneity, and the need for external or experimental
              validation. Those are not abstract concerns for Alloy because the company explicitly sells speed,
              prediction quality, and reduced downstream risk. Public evidence also leaves security diligence open.
              Alloy’s privacy policy describes reasonable safeguards and several third-party data or analytics vendors,
              but the reviewed materials do not disclose independent security certifications, incident history, or
              partner-facing uptime commitments. For a company that increasingly intermediates sensitive partner data
              and translational execution, those omissions matter as much as wet-lab quality systems.
