        - Less obviously partner-open than Alloy because it is also advancing an internal pipeline
      - - Recursion
        - AI-native platform biotech
        - $74.7M 2025 revenue; $753.9M cash; ~$1.68B market cap
        - Large pharma collaborations and buyers prioritizing multimodal data and AI-native workflows
        - Large proprietary data moat and milestone-backed partnerships
        - Commercial model leans toward platform-plus-pipeline economics rather than open external services
      - - Schrödinger
        - Software-first AI drug discovery
        - $199.5M 2025 software revenue; $198.5M ACV; ~$1.11B market cap
