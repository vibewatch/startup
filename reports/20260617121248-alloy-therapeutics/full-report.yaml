        - Narrower modality breadth than Alloy and less obvious downstream infrastructure breadth
      - - AbCellera
        - Antibody platform plus vertical integration
        - $75.1M 2025 revenue; 104 partner starts; 19 molecules in clinic; ~$1.55B market cap
        - Biopharma buyers wanting antibody discovery plus development and manufacturing adjacency
