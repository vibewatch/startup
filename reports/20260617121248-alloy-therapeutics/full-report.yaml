chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Stage, and Business Model
        blocks:
          - type: paragraph
            body: >-
              Alloy Therapeutics is headquartered in Waltham, Massachusetts and describes itself as a biotechnology
              ecosystem company powering drug discovery and development through AI-powered platforms, integrated
              services, and company-creation capabilities. Public company materials and an archived Crunchbase profile
              consistently point to a 2017 founding, while this diligence brief carried a 2018 date; absent charter
              documents or state filings in the reviewed set, that discrepancy should remain open rather than resolved
              by assumption. As of the April 2026 financing, Alloy is operating at the Series E stage and positioning
              itself as an infrastructure provider for virtual biotechs, pharma partners, academics, and founders,
              monetizing through discovery services, licenses, collaborations, and venture creation rather than a single
              in-house therapeutic asset. The operating footprint extends beyond Waltham to named teams in Athens,
              Georgia; Cambridge, UK; Basel, Switzerland; and Fujisawa, Japan, with management also highlighting centers
              of excellence across the U.S., Japan, the Middle East, and emerging innovation markets.
