    - 累计融资、历史稀释、优先股堆叠细节和更广泛的股权治理信息没有公开
    - 除披露的 100+ 科学家信号外，公司总员工数和组织控制可见度仍弱
    - 82VS、Tahoe 式合资公司和下游开发服务的经济贡献及所有权结构未被公开量化
    - 公开证据尚未回答队列留存、重复支出深度，或合作伙伴数据安全和质量体系成熟度
