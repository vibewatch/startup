slug: alloy-therapeutics
runDate: "2026-06-17"
company:
  name: Alloy Therapeutics
chapter:
  number: 3
  title: Competitors
  summary: >-
    Alloy competes most directly with specialist antibody-discovery partners such as Adimab and
    AbCellera, more indirectly with AI-native platform biotechs such as Recursion, Generate,
    insitro, and Schrödinger, and adjacently with bundled R&D providers such as Evotec. The
    strongest part of Alloy's position is its partner-first, multi-modality, wet-lab-backed model;
    the weakest part is that public evidence on price, win rates, and repeat-purchase economics is
    far thinner than the marketing breadth of the platform story.
sections:
  - id: competitor-clusters-and-relative-positioning
    title: Competitor clusters and Alloy's relative position
    body: >-
      Alloy should be analyzed against four overlapping competitive clusters rather than one simple
      peer set. First are direct antibody-discovery specialists, led by Adimab and AbCellera, where
      buyers are choosing between trusted biologics partners for antibody generation, optimization,
      and clinic-readiness. Second are AI-native platform biotechs such as Recursion, Generate,
      insitro, and Schrödinger, which compete for the same strategic narrative—data plus models plus
      faster discovery—but often monetize through internal pipeline creation, software contracts, or
      milestone-heavy collaborations rather than open-ended external services. Third is outsourced
      discovery and development infrastructure, where Evotec competes with far more industrial scale
      and downstream breadth than most TechBio peers. Fourth are specialized modality collaborators,
      some of which are complements more than substitutes because they can sit alongside Alloy in a
      buyer's stack. Alloy's differentiating position is the hybrid: more open to partner use than
      pipeline-first AI biotechs, broader than antibody-only specialists, and more focused on
      biologics discovery-to-handoff than Evotec's industrial platform.
    claimRefs: [CP001, CP004, CP005, CP009, CP011, CP015, CP020, CP024, CP028, CP032, CP034, CP035, CP036]
    tableRefs: [TP001]
    figureRefs: [FP001]
  - id: capability-breadth-proof-and-commercial-models
    title: Capability breadth, proof, and commercial models
    body: >-
      The most important buying distinction is not "who uses AI" but what the buyer is actually
      purchasing. Adimab sells specialist antibody discovery and engineering with a no-internal-
      pipeline alignment story. AbCellera adds more vertical breadth, including translational,
      development, and manufacturing capabilities, plus a track record of partner-initiated programs
      and molecules reaching the clinic. Recursion, Generate, and insitro compete more on proprietary
      data, AI-native operating systems, and internal or partnered pipeline creation than on openly
      catalogued fee-for-service discovery. Schrödinger is still the clearest software-first
      comparable because it discloses software ACV, hosted-license transition, and recurring
      commercial customers. Evotec is the broadest bundled alternative, spanning standalone services,
      integrated R&D programs, and biologics manufacturing through Just-Evotec Biologics. Relative to
      that set, Alloy's claim is that it combines partner openness, multi-modality breadth, and wet-
      lab execution in a form that smaller biotechs can consume without building internal discovery,
      translational, regulatory, and transfer infrastructure themselves.
    claimRefs: [CP001, CP005, CP006, CP008, CP010, CP011, CP013, CP015, CP016, CP020, CP021, CP022, CP024, CP026, CP028, CP032, CP035, CP036, CP037]
    tableRefs: [TP002]
    figureRefs: [FP002]
  - id: pricing-packaging-and-buyer-switching
    title: Pricing, packaging, and buyer switching behavior
    body: >-
      Public pricing transparency is poor across the entire competitor set, which is itself an
      analytical finding. Direct biologics-platform peers do not publish price cards for discovery
      campaigns, licensing fees, or milestone ladders. What is public are packaging clues. Alloy,
      Adimab, and AbCellera market bespoke partnership structures and downstream economics. Recursion
      and Generate disclose collaboration revenue and milestone payments, which signals platform-plus-
      asset economics rather than clean external-service list pricing. Schrödinger is the only peer in
      this set that publicly reports software ACV, customer cohorts above $1 million ACV, hosted-
      license transition, and retention, making it the closest thing to a transparent packaging model.
      Evotec publishes segment revenue and describes flexible partnering models, but not customer-level
      price points. These gaps matter because switching costs are likely driven by embedded data,
      wet-lab workflows, transgenic assets, and transfer paths—not by a transparent catalog that lets
      buyers compare vendors line by line. The likely result is a market where multi-homing is common
      early, but deeper process integration can lock a buyer into a preferred platform over time.
    claimRefs: [CP003, CP007, CP008, CP010, CP012, CP017, CP018, CP021, CP022, CP025, CP029, CP030, CP031, CP037, CP038, CP039]
    tableRefs: [TP003]
  - id: moat-durability-and-competitive-risks
    title: Moat durability and competitive risks
    body: >-
      Alloy's moat looks strongest where buyers need a partner-first biologics engine that can span
      antibody discovery, AI-guided hit mining, modality expansion, and downstream development handoff
      without forcing the customer to build a full internal stack. That is a real wedge against
      narrow specialists and against software-only tools. But the moat is not unbreakable. Public AI-
      platform comparables have seen material valuation compression, suggesting that investors discount
      platform stories until they convert into durable clinical or cash-flow proof. Large pharma can
      also respond by internalizing more AI-enabled discovery capability, especially for strategic
      programs where data control and workflow ownership matter. On the other side, specialists such as
      Adimab can keep winning when buyers value category-best antibody depth more than modality
      breadth, while Evotec can win when a customer wants industrial scale and a broader outsourcing
      umbrella. The core underwriting question is therefore durability of Alloy's hybrid model: can it
      stay best-in-class in specific modalities while also remaining broad enough to be the preferred
      external infrastructure layer for lean biotechs and innovation-heavy pharma teams?
    claimRefs: [CP002, CP004, CP014, CP019, CP023, CP025, CP027, CP031, CP035, CP036, CP039, CP040]
    tableRefs: [TP004]
    figureRefs: [FP003]
