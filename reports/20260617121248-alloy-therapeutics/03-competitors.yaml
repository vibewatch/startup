callouts:
  - calloutType: strength
    title: "Alloy's best wedge is partner-first biologics infrastructure, not generic AI"
    body: >-
      Alloy's most defensible position is the combination of partner openness, biologics specialization,
      and wet-lab-backed discovery-to-handoff execution. That is harder to substitute with pure software
      and more flexible for lean biotech buyers than building a full internal platform.
    claimRefs: [CP001, CP005, CP006, CP008, CP039, CP040]
  - calloutType: risk
    title: "Pricing opacity is the biggest blocker to a hard-edged competitive underwriting view"
    body: >-
      Public evidence lets the chapter map competitor capabilities and scale, but it does not show what
      Alloy charges, what peers charge, how campaigns expand, or whether partner breadth translates into
      repeatable revenue quality. Any IC-grade diligence should request price ladders, pilot-to-expansion
      cohorts, and win-loss detail by modality.
    claimRefs: [CP003, CP037, CP038]
  - calloutType: insight
    title: "Specialist versus bundled is the core tradeoff buyers are actually making"
    body: >-
      Alloy sits between Adimab's specialist antibody excellence and Evotec's industrial bundled scale.
      That middle position can be powerful if buyers want one external biologics engine, but it becomes
      vulnerable if customers split work among best-of-breed specialists or move strategic capabilities
      back in-house.
    claimRefs: [CP024, CP035, CP036, CP040]
