- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Argument
  - Side
  - What would change the view
  rows:
  - - Broad full-stack platform spanning discovery, development support, multiple modalities, and AI-enabled wet-lab execution.
    - thesis
    - Disclose segment economics that show breadth creates leverage rather than complexity.
  - - 200+ partners, 100+ licensed programs, and 22 clinical programs imply real ecosystem relevance rather than pure concept-stage positioning.
    - thesis
    - Show that partner density converts into repeatable revenue and not just headline count.
  - - Mediar, Biogen, AbbVie, Tahoe, and IPI provide concrete examples of partner demand across modalities and business models.
    - thesis
    - Provide contract values, repeat spend, and renewal evidence to prove economics match activity.
  - - No public revenue, gross margin, burn, retention, or cash balance is disclosed, so the $1.0B mark cannot be underwritten on fundamentals.
    - anti-thesis
    - Release audited or management-grade operating metrics.
  - - Public comps with disclosed revenue still trade around Alloy’s private mark, limiting evidence for immediate upside.
    - anti-thesis
    - Demonstrate software-like margin, retention, or scarcity economics that justify a premium.
  - - Platform breadth may mask a services-heavy model and long-dated spinout value capture rather than near-term recurring revenue.
    - anti-thesis
    - Show line-item revenue mix, contribution margins, and value capture from 82VS or JV structures.
  notes: Rows separate company-quality arguments from investability arguments; the key debate is not whether Alloy matters, but whether the current price leaves enough room for new investors.
