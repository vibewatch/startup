- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - Trigger
  - Threshold
  - Transmission to thesis
  - Action implication
  rows:
  - - Down-round financing
    - A new primary round below the April 2026 $1.0B mark.
    - Would show the latest private mark was not durable and force a full reset of upside assumptions.
    - Re-underwrite from downside range and inspect preference terms.
  - - Economic opacity persists
    - Still no revenue, margin, burn, or retention disclosure by the next financing or major liquidity event.
    - Keeps valuation trapped in narrative territory and blocks comp-based rerating.
    - Maintain research-more stance and avoid paying up.
  - - Partner quality weakens
    - Evidence of churn, weak repeat engagement, or fewer named high-quality programs progressing.
    - Undermines the ecosystem-density thesis and questions commercial durability.
    - Reduce confidence and revisit base-case range.
  - - Services overwhelm leverage
    - Disclosed mix shows most value comes from labor-heavy development services rather than scalable platform economics.
    - Would compress the appropriate comp set toward lower-multiple services peers.
    - Shift stance from stretched to expensive if price does not adjust.
  - - Regulatory-quality burden rises faster than controls
    - AI and cell-therapy quality requirements become more visible than Alloy’s control disclosures.
    - Raises execution risk and lowers confidence in premium valuation.
    - Require quality/compliance diligence before moving beyond watch status.
  notes: These triggers are designed to be monitorable from future financings, disclosures, and partner behavior rather than from abstract sentiment.
