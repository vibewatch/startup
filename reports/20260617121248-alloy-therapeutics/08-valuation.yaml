    - $1.3B-$1.8B valuation range; upside depends on economics catching up with the narrative, not on more generic partnership press alone.
    - Requires disclosure, retention proof, and credible margin shape.
    - Possible but evidence-light today.
  - - Base
    - Series E mark was broadly fair; clinical and partner progress continue; economics remain mostly private.
