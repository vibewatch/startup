- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Metric
  - Multiple / valuation / status
  - Relevance
  - Limitation
  rows:
  - - Generate Biomedicines
    - 2025 revenue $31.89M; June 2026 market cap about $1.71B; Feb 2026 IPO raised $400M.
    - Public AI-biotech platform trading well above revenue but with full disclosure.
    - Shows what a newly public AI-biotech story can command with IPO cash and financial statements.
    - Public, clinical-stage, and not directly comparable to Alloy’s services-plus-platform mix.
  - - AbCellera
    - 2025 revenue $75.1M; June 2026 market cap about $1.55B; liquidity about $700M.
    - Platform biotech with disclosed revenue, cash, and continuing losses.
    - Useful benchmark for a public biologics-enabling business with real financial visibility.
    - Different modality focus and more mature public-company disclosure stack.
  - - Recursion
    - 2025 revenue about $74.7M; June 2026 market cap about $1.68B; cash about $754M.
    - AI-native techbio platform with significant cash and heavy losses.
    - Useful benchmark for what public investors pay for an AI-driven discovery story with real assets and burn disclosure.
    - Recursion is small-molecule and clinical-pipeline heavy rather than biologics infrastructure first.
  - - Schrödinger
    - 2025 revenue $255.9M; June 2026 market cap about $1.11B; software ACV and retention disclosed.
    - More software-like discovery platform but valued near Alloy’s mark.
    - Shows that KPI transparency and software economics do not automatically command a huge premium today.
    - Business mix is more software and computational chemistry than Alloy’s wet-lab infrastructure model.
  - - Evotec
    - 2025 revenue €788.4M; June 2026 market cap about $0.95B.
    - Scaled services and partnered-development platform trading at a muted public value.
    - Useful warning for what public markets pay when platform stories look services-heavy.
    - Much larger scale and different corporate history.
  - - insitro
    - Private peer; Tracxn snapshot says $643M raised and still Series C.
    - High-quality context peer without clean public valuation evidence.
    - Helps calibrate business quality and private-market enthusiasm around ML-first drug discovery.
    - No public revenue or current valuation anchor.
  - - Adimab
    - 140+ partnerships, 675+ programs initiated, 90+ clinical programs, six commercial products.
    - Mature biologics infrastructure peer used for output context, not for pricing.
    - Shows the output ceiling of a scaled antibody-enabling platform.
    - No public valuation or financial disclosure.
  notes: The table is a partial enumeration of decision-useful public and private analogs, not a claim that any one multiple can be ported directly to Alloy.
  enumerationScope:
    coverage: partial
    basis: Covers the most decision-useful public AI-biotech, platform-software, and services-heavy analogs plus select private context peers as of June 2026; excludes many opaque private transactions because they do not disclose enough revenue or valuation detail.
