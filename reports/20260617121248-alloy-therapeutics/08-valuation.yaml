  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: alloy-financial-opacity
    missingEvidence: Audited or management-grade revenue, gross margin, burn, cash runway, and partner retention disclosures.
    whyItMatters: These are the minimum inputs needed to test whether the $1.0B mark is fair, stretched, or cheap.
    diligencePath: Request financing materials, board decks, or audited statements under NDA.
    relatedQuestionRefs:
    - QV005
    - QV017
    - QV022
  - type: private-evidence-only
    severity: material
    topic: preference-stack
    missingEvidence: Cap-table preferences, liquidation rights, and any side-letter protections for the April 2026 and earlier investors.
    whyItMatters: A private post-money valuation can diverge materially from common-equity value once preferences and downside protections are modeled.
    diligencePath: Review charter, financing docs, and investor rights agreements with counsel.
    relatedQuestionRefs:
    - QV027
    - QV030
  - type: private-evidence-only
    severity: material
    topic: newco-economics
    missingEvidence: Economic ownership, milestone rights, and accounting treatment for 82VS or joint-venture structures such as Tahoe.
    whyItMatters: Without this, investors cannot know how much of Alloy’s upside sits on balance sheet versus in long-dated external vehicles.
    diligencePath: Obtain JV documentation and value-capture memos from management.
    relatedQuestionRefs:
    - QV025
    - QV028
  - type: enumeration-incomplete
    severity: minor
    topic: comparable-valuation-table
    missingEvidence: More private-peer valuation points with current revenue context for companies such as insitro, Adimab, and other biologics-enabling platforms.
    whyItMatters: The comparable set is decision-useful but incomplete because private peers remain opaque; more data could shift the base-case range.
    diligencePath: Use paid databases, secondary-market data, or direct company disclosures when available.
    relatedQuestionRefs:
    - QV007
    - QV013
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: exit-readiness
    missingEvidence: Board-approved exit priorities, banker conversations, or any internal thresholds for IPO-readiness versus strategic sale.
    whyItMatters: Exit path influences the right comparable set and how much strategic premium investors can reasonably underwrite today.
    diligencePath: Ask management and lead investors directly in diligence sessions.
    relatedQuestionRefs:
    - QV025
