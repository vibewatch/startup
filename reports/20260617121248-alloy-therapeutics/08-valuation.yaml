  - CV035
  - CV036
  - CV039
  - CV041
  - CV046
- id: TV006
  title: Final diligence asks table
  columns:
  - Topic
  - Missing evidence
  - Why it matters
  - Owner or diligence path
  rows:
  - - Revenue mix
    - Revenue split across platform access, services, milestones, royalties, and newco economics.
    - Without mix, investors cannot know whether Alloy deserves a software-like premium or a services-heavy multiple.
    - Management diligence pack or future financing materials.
  - - Gross margin and operating leverage
    - Margin by line of business plus how AI and wet-lab cost structure scales.
    - Determines whether the full-stack model compounds or becomes operationally heavy.
    - Management disclosure, audited statements, or board materials under NDA.
  - - Repeat bookings / retention
    - Renewal rates, repeat spend, and program expansion behavior for key partner cohorts.
    - Partner count alone does not prove durable demand.
    - Customer cohort analysis and contract review.
  - - Cash burn, runway, and financing dependence
    - Current cash balance, burn, and how much of future growth requires external capital.
    - Needed to know whether the next round is a choice or a necessity.
    - Finance diligence and cap table review.
  - - Preference stack and JV economics
    - Liquidation preferences, investor rights, and 82VS or joint-venture ownership economics.
    - A private mark is not the same as common-equity value if preferences or newco structures absorb upside first.
    - Legal diligence, charter documents, and side-letter review.
  notes: These asks are blocking for an investable valuation view, not incremental curiosities.
