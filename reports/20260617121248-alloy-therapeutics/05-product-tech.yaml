callouts:
  - calloutType: strength
    title: Antibody infrastructure is the most evidenced part of the stack
    body: >-
      ATX-Gx, mAbForge, and the antibody workflow have the strongest public combination of module
      detail, partner count, clinical-program optics, and customer outcome examples.
    claimRefs: [CE004, CE005, CE006, CE029, CE032, CE046]
  - calloutType: risk
    title: Public proof is richer on workflow descriptions than on reproducible platform metrics
    body: >-
      Alloy repeatedly describes AI models, quality screens, and integrated execution, but the
      reviewed pack does not provide benchmark datasets, model-comparison protocols, public release
      metrics, or explicit certification inventories to independently verify those claims.
    claimRefs: [CE014, CE038, CE039, CE049]
  - calloutType: insight
    title: The stack is increasingly end-to-end but also increasingly interdependent
    body: >-
      As Alloy expands into pharmacology, cell therapies, development support, and company creation,
      its technical story strengthens strategically while becoming more dependent on partner biology,
      global lab execution, and outside development or manufacturing interfaces.
    claimRefs: [CE026, CE027, CE028, CE033, CE047, CE048]
