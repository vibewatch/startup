  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: benchmark-transparency
      missingEvidence: External model-benchmark pack, dataset-size disclosure, blinded validation protocol, and workflow-level false-positive or false-negative rates for Alloy’s AI screens.
      whyItMatters: The AI layer is central to Alloy’s differentiation claim, but public evidence does not yet let an investor separate genuine predictive edge from marketing narrative.
      diligencePath: Review internal benchmark decks, retrospective campaign studies, and any third-party validation or customer-side comparison data.
      relatedQuestionRefs: [QE014, QE025]
      relatedTableRefs: [TE003, TE004]
    - type: private-evidence-only
      severity: material
      topic: quality-governance
      missingEvidence: Formal QA-system description, certification inventory, data-governance controls, security architecture, incident history, and vendor-quality framework.
      whyItMatters: Alloy positions AI, data, and cross-partner execution as connective tissue across programs, so governance quality affects both trust and scale.
      diligencePath: Request the quality manual, security overview, vendor-qualification SOPs, audit summaries, and any GxP or ISO certification records.
      relatedQuestionRefs: [QE019, QE020, QE025]
      relatedTableRefs: [TE004]
    - type: access-blocked
      severity: minor
      topic: practitioner-signal
      missingEvidence: A readable practitioner-community or recruiting proxy showing public technical hiring or developer engagement.
      whyItMatters: The required developer-signal category is only weakly satisfied by an access-blocked recruiting proxy, so outside observers cannot easily gauge community pull.
      diligencePath: Re-fetch a working recruiting or engineering-community source, or obtain direct hiring-plan and open-role evidence from management.
      relatedQuestionRefs: [QE024]
      relatedTableRefs: [TE004]
    - type: missing-source
      severity: material
      topic: release-cadence
      missingEvidence: Dated module-level release history, customer adoption metrics, and measured performance deltas for new platform additions such as mAbForge, Vigilance, and downstream-service modules.
      whyItMatters: The public roadmap is mostly announcement-based, which obscures whether launches are translating into sustained usage and technical improvement.
      diligencePath: Request an internal release timeline with adoption, utilization, and partner-conversion metrics by module.
      relatedQuestionRefs: [QE017, QE025]
      relatedTableRefs: [TE005]
