company:
  name: Alloy Therapeutics
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Alloy sells a bundled drug-discovery and development stack rather than a single software product:
    antibody discovery centered on ATX-Gx and mAbForge, AI/ML-assisted repertoire mining and
    optimization, Keyway TCRm discovery, AntiClastic genetic medicines, iCAR-T cell-therapy
    infrastructure, pharmacology, and downstream development support. Public evidence is strongest
    on the antibody workflow, partner announcements, and service breadth, with weaker disclosure on
    reproducibility benchmarks, dataset validation, release cadence, and formal quality or security
    systems. The stack looks increasingly end-to-end, but its maturity remains uneven across modules
    and still depends heavily on proprietary data, wet-lab execution, partner biology, and outside
    development or manufacturing interfaces.
sections:
  - id: bundled-platform-and-module-map
    title: Bundled platform and module map
    body: >-
      Alloy’s public record supports a technical positioning that is broader than a standard antibody
      tools company and narrower than a fully self-contained pharma. The company markets a
      multi-modality infrastructure layer that combines AI-enabled discovery software, proprietary
      experimental datasets, transgenic-mouse and screening platforms, and wet-lab service delivery
      across antibodies, TCRm antibodies, genetic medicines, cell therapies, pharmacology, and
      downstream program support. The most mature and best-evidenced module is still antibody
      discovery: the ATX-Gx family, mAbForge screening, in vivo-to-in silico mining, and explicit
      partner traction metrics dominate the public pack. Newer surfaces such as AntiClastic, Keyway,
      the iPSC-derived iCAR-T engine, and the Vigilance biosecurity initiative broaden the commercial
      and technical footprint, but public proof is less standardized and more announcement-driven.
      This means the product map should be read as a tiered stack: core discovery infrastructure with
      visible partner usage; expanding modality add-ons with plausible differentiation; and a growing
      services ecosystem that extends Alloy further into development, manufacturing handoff, and even
      company creation.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE017, CE019, CE024, CE027, CE035, CE036, CE046]
    tableRefs: [TE001]
    figureRefs: [FE001]
  - id: operating-workflow-and-architecture
    title: Operating workflow and architecture
    body: >-
      The clearest public workflow starts with a partner’s target product profile or biology problem,
      then branches by modality into discovery engines that Alloy claims are stitched together by AI
      and shared wet-lab execution. In antibodies, campaigns begin with transgenic mice, proceed
      through immunization, B-cell enrichment, sequencing, repertoire mining, and then move into
      high-throughput expression, characterization, and functional testing. The same architecture
      extends laterally: Keyway adds peptide-MHC-specific discovery and off-target testing for TCRm
      programs; AntiClastic adds AI-guided RNA design, in vitro and in vivo testing, and refinement
      for oligonucleotide assets; pharmacology adds TPP-led experimental design and humanized-model
      readouts; and cell therapies add iPSC engineering, manufacturing handoff, and IND support.
      Operationally, Alloy is not selling isolated algorithms. It is selling a sequence of decision
      gates that combine design, screening, optimization, translational testing, and external
      development interfaces. That architecture is attractive to lean biotech teams because it reduces
      internal build requirements, but it also makes execution quality dependent on cross-site wet-lab
      throughput, partner data quality, and partner-vendor coordination rather than on software alone.
    claimRefs: [CE007, CE008, CE009, CE010, CE011, CE012, CE013, CE015, CE017, CE018, CE020, CE021, CE022, CE023, CE025, CE026, CE048]
    tableRefs: [TE002]
    figureRefs: [FE002]
  - id: dependencies-differentiation-and-maturity
    title: Dependencies, differentiation, and maturity
    body: >-
      Alloy’s differentiation case rests on combining platform access with execution, rather than on
      raw software or raw biology alone. The strongest public moat elements are the transgenic-mouse
      base, the company’s in-house experimental data claims, modality-specific workflow know-how, and
      the ability to connect discovery to pharmacology, development consulting, and company creation.
      Partner proofs reinforce that thesis. Scripps institutionalized ATX-Gx access; Mediar and
      Tahoe validate different kinds of downstream partner value; IPI extends Alloy’s antibody stack
      with synthetic VHH libraries; and Spannerwerks broadens the operating system into tox, CMC,
      regulatory, and clinical execution. But Alloy’s dependencies are substantial. The public
      workflow still relies on proprietary datasets whose size and benchmark methodology are only
      partially disclosed, specialized wet-lab sites across multiple geographies, partner targets and
      biological context, and outside development or manufacturing relationships where Alloy is often
      the orchestrator rather than the sole operator. Competitor disclosures also temper the moat
      narrative. AbCellera, Recursion, and Schrödinger each publish more explicit platform-scale or
      systems evidence in at least one dimension, so Alloy’s public maturity signal is strongest in
      bundled biologics execution and weaker in externally benchmarked data or platform transparency.
    claimRefs: [CE002, CE003, CE014, CE015, CE027, CE028, CE029, CE030, CE031, CE032, CE033, CE034, CE036, CE042, CE043, CE044, CE047]
    tableRefs: [TE003]
    figureRefs: [FE003]
  - id: trust-quality-roadmap-and-technology-risks
    title: Trust, quality, roadmap, and technology risks
    body: >-
      Publicly visible trust and quality signals exist, but they are mostly workflow-level rather than
      system-level. Alloy describes specificity controls for TCRm work, developability and liability
      screening for antibodies, validated chemistries and QC for genetic medicines, humanized models
      and TPP-led pharmacology, and safety-oriented cell-therapy design choices such as γδTCR usage
      and feeder-free manufacturing. These are real technical quality signals, and partner case studies
      suggest they matter in practice. The problem is disclosure depth. Across the reviewed pack,
      Alloy does not publish the kind of benchmark datasets, reproducibility packs, release-by-release
      product metrics, public security documentation, or explicit certification inventory that would
      let an external investor independently grade the stack’s operating quality. The roadmap is also
      inferred more from announcements than from a product changelog: the chronology shows steady
      module expansion from licensing and mAbForge into cell therapies, Spannerwerks, Vigilance, IPI,
      and full-stack infrastructure claims, but not a transparent cadence of module adoption or
      performance deltas. Review literature adds a final caution: AI-enabled discovery still faces
      data-quality, interpretability, translational, and ADME/Tox bottlenecks. For Alloy, that means
      the technical thesis is credible, but not yet publicly benchmarked deeply enough to treat the
      marketing surface as equivalent to reproducible platform proof.
    claimRefs: [CE012, CE013, CE016, CE017, CE022, CE025, CE026, CE032, CE035, CE037, CE038, CE039, CE040, CE041, CE045, CE049]
    tableRefs: [TE004, TE005]
    figureRefs: [FE004]
