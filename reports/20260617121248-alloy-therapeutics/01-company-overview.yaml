callouts:
  - calloutType: strength
    title: Broad platform breadth with partner density
    body: >-
      Alloy combines multiple therapeutic modalities, AI-enabled design, wet-lab execution, and
      company-creation capacity while claiming 200+ partners and 100+ licensed programs. That is a
      broader operating stack than a typical single-platform biotech.
    claimRefs: [CO022, CO027, CO028, CO029]
  - calloutType: risk
    title: Disclosure opacity is still material
    body: >-
      Public materials support valuation and partner/program counts, but not cumulative capital
      raised, revenue, total headcount, or a full board roster. That limits confidence in economic
      quality and governance assessment at chapter 1 stage.
    claimRefs: [CO017, CO019, CO039, CO040, CO041]
  - calloutType: insight
    title: Alloy is moving downstream from discovery into infrastructure
    body: >-
      Spannerwerks, Pharmacology, Tahoe's joint venture, Vigilance, and the AbbVie/Biogen/IPI
      collaborations all point to a strategy of owning more of the path from target idea to
      clinic-ready asset, not merely licensing antibody mice.
    claimRefs: [CO032, CO033, CO035, CO036, CO037, CO038]
