company:
  name: Alloy Therapeutics
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Alloy Therapeutics is a Waltham, Massachusetts biotech-infrastructure company that publicly
    presents itself as an AI-enabled, multi-modality drug discovery and development ecosystem.
    In April 2026 it announced a $40M Series E at a $1B valuation and cited 200+ partners, 100+
    licensed programs, and 22 clinical programs, but cumulative capital raised, exact founding
    date, full board composition, revenue, and total headcount remain only partially disclosed.
sections:
  - id: identity-stage-business-model
    title: Identity, Stage, and Business Model
    body: >-
      Alloy Therapeutics is headquartered in Waltham, Massachusetts and describes itself as a
      biotechnology ecosystem company powering drug discovery and development through AI-powered
      platforms, integrated services, and company-creation capabilities. Public company materials
      and an archived Crunchbase profile consistently point to a 2017 founding, while this
      diligence brief carried a 2018 date; absent charter documents or state filings in the
      reviewed set, that discrepancy should remain open rather than resolved by assumption. As of
      the April 2026 financing, Alloy is operating at the Series E stage and positioning itself as
      an infrastructure provider for virtual biotechs, pharma partners, academics, and founders,
      monetizing through discovery services, licenses, collaborations, and venture creation rather
      than a single in-house therapeutic asset. The operating footprint extends beyond Waltham to
      named teams in Athens, Georgia; Cambridge, UK; Basel, Switzerland; and Fujisawa, Japan, with
      management also highlighting centers of excellence across the U.S., Japan, the Middle East,
      and emerging innovation markets.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO025, CO026, CO027, CO028, CO029]
    figureRefs: [FO002]
  - id: founders-leadership-governance
    title: Founders, Leadership, and Governance
    body: >-
      Errik Anderson remains the central figure in Alloy's governance as founder, chief executive
      officer, and chairman, and he is the public spokesperson across financing, partnership, and
      strategic announcements. Day-to-day senior leadership publicly includes Piotr Bobrowicz as
      president, Jeff Swenson as CFO, and Mike Schmidt as CSO, alongside division or business-line
      leaders such as Christian Cobaugh in Genetic Medicines, Simon Friedensohn in Insights,
      Richard Shimkets in Antibody Powered, Victor Stone in Cell Therapies and Japan, Dara Lockert
      at Spannerwerks, Alexander Titus at Vigilance, and Alasdair Thong in Sovereign Innovation,
      plus Ron Adner as chief strategy advisor. Material 2025-2026 leadership changes were
      expansionary rather than remedial: Spannerwerks CEO Dara Lockert joined through the October
      2025 acquisition, Cobaugh was appointed in January 2026, and Titus joined in April 2026 to
      stand up the new Vigilance division. Public governance disclosure is still shallow: reviewed
      sources identify Anderson as chairman and list leadership biographies, but do not publish a
      complete board roster, ownership breakdown, or investor-control map, leaving key-person and
      governance concentration as a live diligence issue.
    claimRefs: [CO007, CO008, CO009, CO010, CO011, CO012, CO013, CO014]
    tableRefs: [TO002]
  - id: funding-investors-capitalization
    title: Funding, Investors, and Capitalization
    body: >-
      Alloy's clearest public financing datapoint is the April 15, 2026 Series E: $40 million at a
      $1 billion valuation. Named participants included new investors 8VC, JIC Venture Growth
      Investments, Echo Capital, and multiple family offices, alongside existing backers Mubadala
      Capital, Presight Capital, Thiel Capital, Founders Fund, Alexandria Venture Investments,
      Gaingels, and Ulysses Diversified Holdings. What remains notably opaque is the back catalog:
      an archived Crunchbase profile indicates that by late 2024 Alloy's last funding type was
      Series D, which confirms earlier institutional financings before the Series E, but the
      reviewed source set does not reliably disclose those round amounts, dates, post-money
      valuations, ownership percentages, or a cumulative total raised figure. No reviewed source
      surfaced evidence of secondary share sales, debt facilities, or credit lines linked to the
      2026 round. The practical result is that valuation is supportable, investor names are partly
      supportable, but capitalization depth and historical dilution remain open diligence asks.
    claimRefs: [CO015, CO016, CO017, CO018, CO019, CO020]
    tableRefs: [TO003]
  - id: scale-footprint-and-services
    title: Scale, Footprint, and Service Breadth
    body: >-
      Alloy's publicly reported scale is framed primarily through partners, programs, and scientific
      capability rather than revenue or customer counts. Series E materials say the company works
      with more than 200 partners, has over 100 licensed therapeutic programs, and has seen 22
      programs reach clinical development including two Phase 3 assets. The February 2026 Mediar
      release used slightly different language—over 100 active drug programs and more than 20 IND
      filings—suggesting similar scale but not a perfectly standardized KPI set across announcements.
      The about page adds a people signal of 100+ scientists, but reviewed public sources do not
      disclose total headcount, revenue, ARR, or customer concentration. Technically, Alloy spans
      antibodies, bispecifics, TCRms, genetic medicines, cell therapies, drug delivery, and
      pharmacology, while emphasizing AI/ML models trained on large proprietary experimental data
      and paired with global wet-lab execution. This breadth supports management's positioning of
      Alloy as a full-stack biotech infrastructure layer rather than a narrow platform licensor.
    claimRefs: [CO021, CO022, CO023, CO024, CO025, CO026, CO027, CO028, CO029, CO039, CO040, CO041]
    tableRefs: [TO001]
    figureRefs: [FO003]
  - id: milestones-and-open-risks
    title: Milestones and Open Risks
    body: >-
      The recent chronology is dense and mostly positive: an institutional Scripps license in
      October 2024; a radioligand collaboration with Swiss Rockets in January 2025; the Spannerwerks
      acquisition in October 2025; the Tahoe joint venture and Cobaugh appointment in January 2026;
      Mediar, AbbVie, Vigilance, Biogen, and Series E announcements across February through April
      2026; and the IPI collaboration in May 2026. Collectively these milestones show Alloy moving
      downstream from antibody discovery toward broader development services, venture creation, and
      biosecurity-oriented work. The main adverse signals in this chapter are not legal or clinical
      failures but disclosure and execution risk: public materials do not substantiate cumulative
      capital raised, revenue, total headcount, or full board composition, and 2026 peer-reviewed
      reviews of AI-enabled drug discovery continue to warn that data quality, interpretability,
      patient heterogeneity, and experimental validation remain real bottlenecks to clinical
      translation. Alloy's paired AI-plus-wet-lab model may mitigate some of that risk, but it does
      not eliminate the need for deeper diligence on economics, governance, and reproducibility.
    claimRefs: [CO030, CO031, CO032, CO033, CO034, CO035, CO036, CO037, CO038, CO042]
    tableRefs: [TO004]
    figureRefs: [FO001]
