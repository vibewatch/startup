chapter:
  number: 7
  title: Risks
  summary: Tongdun's most material evidenced risk is data-governance and privacy exposure, while public financing, revenue, staffing, and customer disclosures remain inconsistent and largely unaudited. The resulting case is manageable only with explicit legal-status, security-control, concentration, and cash-generation diligence before relying on the company's scale claims.
sections:
  - id: legal-regulatory
    title: Legal and regulatory exposure
    body: >-
      Tongdun's principal evidenced risk is the use of large-scale personal data in automated risk control. An OECD AI Incident and Hazard Monitor entry says the company and several executives face criminal and civil lawsuits for allegedly infringing citizens' personal information, and it frames the concern as a privacy and public-interest harm. The entry itself carries an important qualification: the displayed information is not the official view of the OECD or its members, and portions are marked AI generated. That makes the record a serious adverse diligence lead rather than a final adjudication. The company’s own historical description also says that its systems combine first-party and third-party data, fingerprints, IP portraits, and internet behavior across pre-loan, during-loan, and post-loan workflows. This combination increases the importance of lawful basis, purpose limitation, retention, model governance, cross-border transfer, and customer allocation of regulatory responsibility. No current public source in this pool confirms the case disposition, applicable judgment, remediation, or current licensing status, so legal clearance should be treated as unresolved rather than inferred from the absence of a newer public notice.
    claimRefs: [CR001, CR002, CR003, CR004]
    tableRefs: [TR001]
  - id: operational-and-financial
    title: Operational, security, and financial-model risk
    body: >-
      Tongdun's operating model is exposed to model quality, data quality, service reliability, and disclosure risk. The historical product account describes customized and standardized services, machine-learning systems trained with client data, and deployment across multiple loan-life-cycle scenarios; those features create failure modes around drift, false positives, explainability, data lineage, and customer-specific configuration. A 2019 financing report described a 600-strong team serving more than 7,000 Chinese companies, while a 2025 profile reports 416 employees and $110.4M annual revenue but says the revenue source was not recorded. These figures are not directly comparable and do not establish current productivity, margin, cash generation, or runway. An anonymous or community employment discussion also contains allegations about sales pressure and legal changes, but it is anecdotal and should not be treated as representative. The practical control response is to require incident history, uptime and model-performance evidence, customer-loss allocation, audited financial statements, and a reconciliation of current headcount and customer definitions before underwriting scale.
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR010, CR011]
    tableRefs: [TR002]
  - id: dependencies-and-thesis-breaks
    title: Dependency, concentration, and thesis-break conditions
    body: >-
      Tongdun's commercial and valuation risk is amplified by dependence on regulated financial and enterprise buyers, data and cloud/platform inputs, and the credibility of private-market marks. Historical reporting describes customers across internet finance, banks, insurers, e-commerce, and social platforms, while another profile describes a B2B model spanning usage-based SaaS, subscription SaaS, and services and consulting. That breadth can diversify demand, but public evidence does not disclose revenue by customer, vertical, geography, contract duration, renewal, or channel. Private-market pages also show materially different valuation references: $1.3B in June 2019 on one profile, $1.5B in September 2018 on another, and an estimated $2.0B based on funding-round data on Caplight; none is a current tradable price. The thesis should break or move to a no-underwrite posture if a regulator confirms material liability without remediation, if a security or privacy incident creates unallocated customer losses, if audited cash runway or margins fail diligence, or if customer concentration and renewal evidence cannot support the claimed scale.
    claimRefs: [CR006, CR007, CR012, CR013, CR014]
    tableRefs: [TR003]
    figureRefs: [FR001]
