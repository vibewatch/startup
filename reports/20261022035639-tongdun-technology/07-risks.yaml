callouts:
  - calloutType: risk
    title: Highest-priority risk
    body: >-
      The OECD incident record is a material privacy and legal diligence trigger, but its AI-generated portions and lack of disposition details require primary court and regulator documents before assigning a confirmed liability amount or final legal conclusion.
    claimRefs: [CR001, CR002]
  - calloutType: assumption
    title: Evidence limitation
    body: >-
      Public figures for revenue, employees, customers, funding, and valuation are publisher-reported, differently dated, and not reconciled to audited statements; scale should therefore not be treated as proof of cash generation or retention.
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR010, CR011, CR012, CR013]
  - calloutType: recommendation
    title: Underwriting condition
    body: >-
      Advance only after receiving primary legal-status records, security and model-control evidence, audited financials, customer concentration and renewal cohorts, and current cap-table and preference terms.
    claimRefs: [CR001, CR003, CR008, CR012, CR014]
