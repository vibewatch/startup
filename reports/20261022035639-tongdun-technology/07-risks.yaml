  - id: TR002
    title: Operational / quality / security risk register
    columns: [Failure mode, Likelihood, Severity, Mitigation maturity, Residual exposure, Unresolved gap]
    rows:
      - [Privacy or security incident in risk-data pipelines, "Medium", "Critical", "Unverified", "High", "Current incident history, control attestations, and customer-loss allocation"]
      - ["Model drift, false positives, or opaque decisions", "Medium", "High", "Partial", "Medium-high", "Out-of-time validation, drift monitoring, explainability, and human-override metrics"]
      - [Service reliability or customer-specific implementation failure, "Medium", "High", "Unverified", "High", "Uptime, recovery objectives, change controls, and named customer references"]
      - ["Margin, cash, or staffing deterioration masked by inconsistent public metrics", "Medium", "High", "Unverified", "High", "Audited revenue, gross margin, cash, runway, headcount reconciliation, and customer denominator"]
    notes: "Likelihood and severity are diligence ratings anchored to the cited failure mechanisms; they are not incident frequencies. Revenue, employee, and customer figures come from different periods and publishers and are not reconciled."
    claimRefs: [CR005, CR006, CR007, CR008, CR009, CR010, CR011]
  - id: TR003
    title: Partner / dependency risk register
    columns: [Dependency, Counterparty or role, Concentration signal, Failure scenario, Severity, Mitigation, Residual exposure]
    rows:
      - [Regulated financial and enterprise buyers, "Banks, insurers, internet finance, e-commerce, and other enterprise customers", "Revenue mix and top-customer share undisclosed", "Procurement, regulatory, or budget changes reduce deployments", "High", "Diversify verticals and prove renewal by cohort", "High"]
      - [Client and third-party data inputs, "Customers and data providers", "Data sources and permissions not publicly enumerated", "Permission loss or poor data quality degrades decisions", "Critical", "Contractual provenance, lineage, fallback data, and monitoring", "High"]
      - ["Cloud, model, and implementation partners", "Platform and services ecosystem", "Partner revenue and dependency not disclosed", "Availability, pricing, or integration change interrupts service", "High", "Multi-region resilience, portability, SLAs, and exit tests", "Medium-high"]
      - [Private financing and valuation references, "Investors and secondary-market participants", "No public market price; historical marks differ", "Down-round, liquidity, or preference overhang impairs returns", "High", "Obtain cap table, preferences, latest transaction terms, and independent mark", "High"]
    notes: "The public record identifies dependency categories but does not quantify concentration. Treat each residual exposure as unresolved until contracts, customer cohorts, infrastructure topology, and cap-table terms are reviewed."
    claimRefs: [CR006, CR007, CR012, CR013, CR014]
