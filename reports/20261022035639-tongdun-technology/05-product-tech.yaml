  name: Tongdun Technology
chapter:
  number: 5
  title: Product & Technology
  summary: Tongdun appears to sell a B2B risk-decision stack spanning device and behavioral signals, transaction monitoring, credit decisioning, and privacy-aware analytics. Public evidence supports the workflow and product categories, but not an independently benchmarked architecture, security-control set, reliability record, or current roadmap.
sections:
  - id: delivered-risk-workflows
    title: Delivered risk workflows
    body: >-
      The clearest public product description is a decisioning service embedded in a
      financial institution's lending and transaction workflow. EqualOcean describes
      Tongdun's AaaS model as connecting problem scenarios on top of SaaS and applying
      data analysis and algorithms to specific scenarios; it identifies pre-loan,
      during-loan, and post-loan use cases. A 2019 BPI announcement provides a named
      customer deployment: Tongdun was to automate SME lending and optimize a credit
      scoring model, with BPI saying the partnership would unlock financial products
      and services. RECATOOLS, a 2026 third-party review, describes the current
      category as device fingerprinting, behavioral-biometric fraud signals,
      transaction risk scoring, credit-risk decisioning, account protection,
      application fraud, and chargeback prevention. These sources establish a
      coherent workflow, not a complete product catalog or proof that every listed
      module remains sold today. Public pricing is not published, and the available
      review says the product is sales-led rather than self-serve.
    claimRefs: [CE001, CE002, CE003, CE004]
    tableRefs: [TE001, TE002]
  - id: operating-architecture-and-maturity
    title: Operating architecture and maturity
    body: >-
      The disclosed operating model is a layered combination of first-party and
      third-party data, device and network signals, machine-learning models, graph or
      decision computation, and scenario-specific outputs. EqualOcean reports that
      Tongdun used client data to train machine learning and applied process
      calculation, models, and graph computing across scenarios; it also says the
      company offered both standardized products and customized analysis services.
      A company-profile listing identifies two named platforms, Zhibang for
      privacy-computing shared intelligence and Zhice for AI decision intelligence,
      while describing financial, security, and government-governance risk as the
      focus. The evidence is descriptive rather than technical: no public API
      specification, architecture diagram, benchmark methodology, model-card
      package, or reproducible uptime history was found in the assigned pool.
      RECATOOLS repeats a sub-20ms decisioning claim but explicitly says the latency,
      accuracy, and client-count assertions were not independently audited. That
      makes the product direction credible but leaves implementation and scale
      diligence open.
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
    tableRefs: [TE003]
    figureRefs: [FE001]
  - id: trust-controls-and-diligence
    title: Trust, controls, and diligence gaps
    body: >-
      Risk decisioning is a high-consequence product, so the absence of public
      control evidence matters as much as the feature list. The assigned sources
      identify privacy computing, device fingerprinting, IP and behavioral signals,
      and AI scoring, but do not provide a current security attestation, privacy
      impact assessment, model-governance policy, false-positive and false-negative
      rates, incident history, service-level commitments, or independent penetration
      testing. RECATOOLS says public documentation is thin and independent review
      coverage is essentially absent; its own listing is a desk-research review, not
      a hands-on test. A Zhihu thread supplies anecdotal employee and customer
      commentary, but it is not a control audit. The technology case therefore rests
      on category experience and a named bank workflow rather than independently
      verified reliability or safety evidence. A buyer should require a controlled
      pilot, data-processing terms, model-change controls, explainability and
      adverse-action procedures, resilience metrics, and current certification
      evidence before treating the stack as production-ready for a critical path.
    claimRefs: [CE010, CE011, CE012, CE013]
    tableRefs: []
  - id: exhibits
    title: Exhibits
    body: >-
      The architecture exhibit is intentionally a product-flow abstraction rather
      than a claim that the vendor exposes these layers as separately deployable
      services. It preserves the distinction between documented capabilities,
      third-party descriptions, and items that remain unverified. The exhibit should
      therefore be read as an underwriting map: each layer identifies a dependency
      that a buyer would test, rather than a promise that the public materials
      establish an implementation detail, service boundary, or control objective.
    claimRefs: []
    tableRefs: []
    figureRefs: []
