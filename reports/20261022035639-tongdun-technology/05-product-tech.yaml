      - ["Manage delinquency", "Prioritize overdue accounts and contact", "Intelligent collection and scorecard-based sorting", "EqualOcean describes lower-cost standardized collection methods", "No recovery-rate, compliance, or outcome evidence"]
      - ["Operate across verticals", "Adapt decisions to finance, insurance, commerce, and travel/gaming", "Scenarioized models and customized services", "Broad vertical coverage is described by third parties", "Current module boundaries and implementation effort are unclear"]
    notes: "Benefits are source-described or vendor-claimed; null outcome metrics are deliberate gaps rather than zero values."
    claimRefs: [CE002, CE003, CE004, CE007, CE009]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer or process, Role, Dependency, Risk]
    rows:
      - ["Data and signal ingestion", "Combines client, first-party, third-party, device, IP, and behavioral data", "Customer data quality and lawful data access", "Coverage bias, privacy obligations, and data drift"]
      - ["Analytics and machine learning", "Trains models and analyzes text, images, voice, and scenario data", "Historical labels and customer data", "Model drift, explainability, and unverified performance"]
      - ["Graph and decision computation", "Applies models and rules to loan and transaction scenarios", "Cloud compute and scenario configuration", "Opaque decision paths and uncertain latency under peak load"]
      - ["Workflow products", "Delivers pre-loan, during-loan, post-loan, fraud, and collection outputs", "Integration into lender and enterprise systems", "Implementation burden and change-management risk"]
      - ["Privacy and shared intelligence", "Zhibang is described as privacy-computing shared intelligence", "Legal basis, cryptographic design, and participant governance", "Cannot assess isolation or re-identification risk from public material"]
      - ["International delivery", "TrustDecision is described with Singapore, Malaysia, Indonesia, and UAE presence", "Regional operations and local compliance", "Residency, support, and regulatory coverage are not documented"]
    notes: "This is an evidence-bounded operating model assembled from descriptive sources; it is not an independently verified reference architecture."
    claimRefs: [CE005, CE006, CE007, CE008, CE009]
