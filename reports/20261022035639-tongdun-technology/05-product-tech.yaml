  evidenceGaps:
    - type: missing-source
      severity: material
      topic: controls
      missingEvidence: Current SOC 2, ISO 27001, penetration-test, privacy-impact, and model-risk-governance evidence for the deployed services.
      whyItMatters: Risk decisions affect credit access and fraud controls, so buyers need evidence that data handling and model changes are governed and auditable.
      diligencePath: Request current attestations, control reports, subprocessors, data-retention terms, model-change logs, and independent test summaries under NDA.
      relatedQuestionRefs: [QE006]
    - type: missing-source
      severity: material
      topic: performance
      missingEvidence: Reproducible latency, availability, accuracy, false-positive, and false-negative measurements by workflow and traffic tier.
      whyItMatters: A vendor-stated response time does not establish decision quality or resilience on a bank's production workload.
      diligencePath: Run a time-boxed production-like pilot with agreed test data, baseline comparisons, peak-load tests, and outcome reporting.
      relatedQuestionRefs: [QE004, QE008]
    - type: stale
      severity: material
      topic: roadmap
      missingEvidence: Current 2026 product documentation, API/integration specification, release history, and roadmap commitments.
      whyItMatters: Much of the detailed architecture evidence dates from 2018-2019, while the current third-party listing says documentation remains thin.
      diligencePath: Obtain a current product catalog, API documentation, release notes, supported regions, deprecation policy, and named product owners.
      relatedQuestionRefs: [QE002, QE008]
