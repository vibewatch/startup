callouts:
  - calloutType: strength
    title: Named workflow proof
    body: The BPI announcement is stronger than generic category marketing because it names a bank deployment and a defined SME-lending automation use case, although it does not disclose outcomes.
    claimRefs: [CE002, CE003]
  - calloutType: risk
    title: Production controls are not public
    body: The public record does not establish current security attestations, model-governance controls, resilience metrics, or independently audited latency and accuracy.
    claimRefs: [CE009, CE010, CE011, CE012]
