callouts:
  - calloutType: insight
    title: Market opportunity is real but not numerically underwritten
    body: >-
      The evidence supports a multi-segment enterprise market for risk decisioning
      and fraud-control workflows, with a concrete bank deployment and multiple
      adjacent verticals. It does not support a current numerical TAM, SAM, SOM,
      market share, or growth rate; those should remain diligence asks.
    claimRefs: [CM003, CM004, CM008]
  - calloutType: risk
    title: Adoption proof is older than the refresh date
    body: >-
      The clearest customer and commercial evidence is from 2018–2019, while
      current retention, pricing, buyer mix, and deployment economics remain
      undisclosed.
    claimRefs: [CM011, CM012]
