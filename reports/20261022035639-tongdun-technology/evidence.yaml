    whyItMatters: Public evidence supplies one named reference and several broad categories but no auditable deployment outcomes.
    diligencePath: >-
      Obtain customer permission for reference calls and anonymized contracts or case studies identifying deployment
      scope, duration, and outcomes.
    relatedQuestionRefs:
      - QU005
      - QU006
      - QU010
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: adverse-customer-evidence
    missingEvidence: Independent evidence on churn, failed pilots, complaints, procurement blocks, or customer incidents.
    whyItMatters: >-
      The assigned pool contains no robust adverse customer source, limiting the ability to test reference quality and
      durability.
    diligencePath: >-
      Search customer review platforms, procurement records, litigation databases, and former-customer references for
      documented failures or complaints.
    relatedQuestionRefs:
      - QU009
      - QU010
  - type: missing-source
    severity: blocking
    topic: privacy
    missingEvidence: Primary pleadings, judgments, regulator notices, and remediation evidence for the personal-information matter.
    whyItMatters: >-
      The retained adverse record is serious but does not establish disposition, liability, damages, or current
