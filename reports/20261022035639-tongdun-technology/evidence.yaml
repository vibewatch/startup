    diligencePath: >-
      Obtain authenticated court and regulator records from the relevant jurisdictions and obtain management's
      remediation chronology.
    relatedQuestionRefs:
      - QR001
      - QR002
    relatedTableRefs:
      - TR001
  - type: private-evidence-only
    severity: material
    topic: disclosure
    missingEvidence: >-
      Audited revenue, gross margin, cash, runway, current headcount, and customer denominator reconciled to one
      reporting period.
    whyItMatters: >-
      Publisher-reported figures differ in date and definition, so they cannot establish unit economics or financial
