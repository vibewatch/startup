    relatedQuestionRefs:
      - QR005
      - QR006
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: valuation
    missingEvidence: >-
      Current cap table, preference stack, transfer restrictions, latest transaction terms, and an independent current
