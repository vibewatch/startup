evidenceGaps:
  - type: missing-source
    severity: material
    topic: governance
    missingEvidence: A current primary-source executive roster, board composition, ownership table, and governance rights.
    whyItMatters: Leadership concentration and investor control cannot be assessed from the partial public roster.
    diligencePath: Request the latest cap table, board minutes or consent rights, and signed executive roster under NDA.
    relatedQuestionRefs:
      - QO002
      - QO008
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: scale
    missingEvidence: >-
      A current, consistently defined customer count, employee count, revenue statement, and reconciliation of
      historical funding totals.
    whyItMatters: >-
      The reported 415 versus 600 employees and 7,000 versus 10,000 customers materially affect scale and operating
      leverage.
    diligencePath: >-
      Obtain audited financial statements, current HR data, active-customer definitions, cohort schedules, and a
      financing ledger.
    relatedQuestionRefs:
      - QO003
      - QO004
      - QO007
  - type: access-blocked
    severity: material
    topic: adverse
    missingEvidence: Primary court, regulator, or company-compliance records resolving the 2019 personal-information allegations.
    whyItMatters: The allegation bears directly on legal, regulatory, reputational, and data-governance risk.
    diligencePath: >-
      Commission local counsel and request regulator correspondence, litigation searches, remediation evidence, and
      data-provenance controls.
    relatedQuestionRefs:
      - QO006
      - QO008
  - type: missing-source
    severity: material
    topic: market-sizing
    missingEvidence: Current independent market size, growth, and segment data with a transparent methodology.
    whyItMatters: A broad AI or fintech category cannot be used as Tongdun's addressable market without scope reconciliation.
    diligencePath: >-
      Commission a market study that separates risk decisioning, fraud prevention, identity, and adjacent workflow
      spend.
    relatedQuestionRefs:
      - QM002
      - QM005
  - type: private-evidence-only
    severity: material
    topic: adoption
    missingEvidence: Current buyer mix, renewal, pricing, and implementation evidence.
    whyItMatters: Historical customer examples establish use cases but not repeatable growth or budget durability.
    diligencePath: Request anonymized cohort metrics, representative contracts, and customer references by segment.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: missing-source
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Comparable current list prices, implementation fees, discounting, and contract structures for Tongdun and named
      competitors.
    whyItMatters: Pricing and implementation economics determine whether breadth creates pricing power or merely adds services cost.
    diligencePath: >-
      Request current proposals, standard order forms, implementation statements of work, and competitor quotes for the
      same buyer workflow.
    relatedQuestionRefs:
      - QP004
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: moat-gap
    missingEvidence: >-
      Independently verified model lift, false-positive reduction, renewal cohorts, customer concentration, and
      switching costs by competitor.
    whyItMatters: Without comparable outcome and retention data, the claimed data and workflow moat cannot be underwritten.
    diligencePath: >-
      Obtain anonymized cohort retention, pilot-to-production conversion, benchmark methodology, and customer reference
      calls.
    relatedQuestionRefs:
      - QP006
      - QP008
  - type: enumeration-incomplete
    severity: minor
    topic: competitors
    missingEvidence: A complete current competitor census across China and Tongdun's international markets.
    whyItMatters: >-
      The assigned source pool identifies named alternatives but cannot establish market exhaustiveness or recent
      entrants.
    diligencePath: Run a buyer-interview and procurement-led competitor scan by financial-risk workflow and geography.
    relatedQuestionRefs:
      - QP001
    relatedTableRefs:
      - TP001
  - type: stale
    severity: material
    topic: historical-scale
    missingEvidence: >-
      Current independently verified competitor and Tongdun scale, distribution, and product-launch data as of
      2026-10-22.
    whyItMatters: Several detailed competitive facts are historical or profile-reported and may not reflect current positioning.
    diligencePath: >-
      Request current product sheets, customer references, pricing, and partner/channel disclosures, then rerun
      benchmark comparisons.
    relatedQuestionRefs:
      - QP003
      - QP006
      - QP008
  - type: private-evidence-only
    severity: blocking
    topic: revenue-disclosure
    missingEvidence: >-
      Audited revenue by product, customer cohort, geography, and accounting period, including recognized revenue versus
      recurring contract value.
    whyItMatters: >-
      The only public revenue figure is an external estimate, so revenue quality, growth, and annualization cannot be
      underwritten.
    diligencePath: >-
      Request audited financial statements and a revenue bridge from contracts, invoices, deferred revenue, and
      recognized revenue.
    relatedQuestionRefs:
      - QI002
      - QI005
    relatedTableRefs:
      - TI001
      - TI003
  - type: private-evidence-only
    severity: blocking
    topic: capital-adequacy
    missingEvidence: Current cash, monthly burn, runway, debt, covenants, committed financing, and planned use of funds.
    whyItMatters: Historical funding totals do not establish liquidity or financing dependency.
    diligencePath: Request the latest balance sheet, cash-flow statement, debt schedule, budget, and board-approved financing plan.
    relatedQuestionRefs:
      - QI005
      - QI007
    relatedTableRefs:
      - TI003
  - type: conflicting-data
    severity: material
    topic: valuation
    missingEvidence: >-
      A dated, transaction-supported valuation or current secondary-market evidence reconciling the $1.5B and $2.0B
      observations.
    whyItMatters: Conflicting historical marks materially affect return expectations and cannot be treated as current fair value.
    diligencePath: Request latest preferred-share financing documents, cap table, option terms, and any independent valuation report.
    relatedQuestionRefs:
      - QI008
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin by product, CAC and payback, retention cohorts, implementation effort, and customer concentration.
    whyItMatters: A mixed SaaS and consulting model can have materially different margins and renewal quality.
    diligencePath: Request product-level P&L, sales funnel cohorts, renewal data, and top-customer revenue shares.
    relatedQuestionRefs:
      - QI003
      - QI004
      - QI005
    relatedTableRefs:
      - TI002
      - TI003
  - type: missing-source
    severity: material
    topic: controls
    missingEvidence: >-
      Current SOC 2, ISO 27001, penetration-test, privacy-impact, and model-risk-governance evidence for the deployed
      services.
    whyItMatters: >-
      Risk decisions affect credit access and fraud controls, so buyers need evidence that data handling and model
      changes are governed and auditable.
    diligencePath: >-
      Request current attestations, control reports, subprocessors, data-retention terms, model-change logs, and
      independent test summaries under NDA.
    relatedQuestionRefs:
      - QE006
  - type: missing-source
    severity: material
    topic: performance
    missingEvidence: >-
      Reproducible latency, availability, accuracy, false-positive, and false-negative measurements by workflow and
      traffic tier.
    whyItMatters: A vendor-stated response time does not establish decision quality or resilience on a bank's production workload.
    diligencePath: >-
      Run a time-boxed production-like pilot with agreed test data, baseline comparisons, peak-load tests, and outcome
      reporting.
    relatedQuestionRefs:
      - QE004
      - QE008
  - type: stale
    severity: material
    topic: roadmap
    missingEvidence: Current 2026 product documentation, API/integration specification, release history, and roadmap commitments.
    whyItMatters: >-
      Much of the detailed architecture evidence dates from 2018-2019, while the current third-party listing says
      documentation remains thin.
    diligencePath: >-
      Obtain a current product catalog, API documentation, release notes, supported regions, deprecation policy, and
      named product owners.
    relatedQuestionRefs:
      - QE002
      - QE008
  - type: stale
    severity: blocking
    topic: customer-count
    missingEvidence: >-
      A current customer master and usage schedule with definitions for contracted, active, deployed, and paying
      accounts.
    whyItMatters: >-
      The available customer-count statements are historical, anecdotal, or definitionally unclear, so they cannot
      establish present commercial scale.
    diligencePath: >-
      Request a signed customer schedule as of 2026-10-22 with product, geography, deployment status, usage, revenue,
      and renewal fields.
    relatedQuestionRefs:
      - QU003
      - QU004
    relatedTableRefs:
      - TU002
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: Cohort retention, renewal, churn, contract duration, expansion, and concentration metrics.
    whyItMatters: Customer breadth does not establish durability, expansion economics, or exposure to a few accounts or channels.
    diligencePath: >-
      Reconcile 24 months of account-level bookings, usage, renewals, churn reasons, and top-10 customer revenue share
      under NDA.
    relatedQuestionRefs:
      - QU007
      - QU008
      - QU009
