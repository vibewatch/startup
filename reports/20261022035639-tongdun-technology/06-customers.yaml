company:
  name: Tongdun Technology
chapter:
  number: 6
  title: Customers
  summary: Public evidence supports a broad B2B customer footprint in financial services and adjacent digital sectors, but the strongest quantified adoption statements are historical and company- or third-party-reported. Named deployment, retention, renewal, and concentration evidence remains limited, so customer durability and present scale require direct diligence.
sections:
  - id: buyer-and-use-case-segmentation
    title: Buyer and use-case segmentation
    body: >-
      Tongdun's public customer story is primarily enterprise and institutional rather than
      self-serve. The available descriptions place financial institutions at the center, while
      also identifying internet finance, insurance, e-commerce, travel, O2O, government, and
      other enterprise use cases. The historical operating model combines standardized products
      with customized, scenario-specific analysis, implying different procurement and delivery
      motions by segment. This supports a segmentation hypothesis, not a verified current revenue
      mix: the sources do not disclose contract values, payer versus end-user roles, geographic
      revenue, or the share of customers using each product family.
    claimRefs: [CU001, CU002, CU003, CU004, CU005, CU008]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and commercial signals
    body: >-
      The public adoption record shows scale signals but not a clean current time series. A
      2018 industry article attributed almost 1,000 employees and services to almost 10,000
      companies, while a 2019 financing announcement described a 600-person team and more than
      7,000 Chinese companies served over the prior four years. A 2021 user discussion repeated
      the 10,000-client figure and described companies signing products, but it is anecdotal and
      not a customer registry. These statements are not directly comparable because their dates,
      definitions, and denominators differ. No assigned source provides active-account counts,
      usage volumes, repeat purchase, deployment locations, or a reconciled 2026 customer base.
    claimRefs: [CU009, CU010, CU011]
    tableRefs: [TU002]
  - id: named-proof-and-reference-quality
    title: Named customer proof and reference quality
    body: >-
      Named proof is uneven. A user-generated answer mentions SF Express in connection with a
      financing-related cooperation, but does not establish production status, contract scope,
      duration, or outcome. Other sources identify customer categories rather than customer
      names, including banks, insurers, internet finance companies, e-commerce companies, and
      social platforms. The evidence therefore supports market presence and referenceable
      categories more strongly than it supports durable, measurable deployments. The customer
      list below is intentionally partial; logos or broad category statements are not treated as
      evidence of renewal, expansion, or successful implementation.
    claimRefs: [CU006, CU007, CU011, CU012]
    tableRefs: [TU003]
  - id: retention-expansion-and-concentration
    title: Retention, expansion, and concentration gaps
    body: >-
      The assigned evidence does not disclose NRR, GRR, churn, renewal rates, contract length,
      cohort behavior, satisfaction scores, or top-customer concentration. Tongdun's described
      combination of standardized services and customized models could support land-and-expand
      economics, but no source quantifies expansion from one risk scenario into additional
      products or geographies. The customer journey figure is consequently an analytical map of
      evidence-backed workflow stages, not a measured conversion funnel. The principal diligence
      requirement is a customer-level revenue and usage schedule that separates contracted,
      active, pilot, and dormant accounts and identifies renewal and concentration exposure.
    claimRefs: [CU004, CU013, CU014]
    figureRefs: [FU001]
callouts:
  - calloutType: strength
    title: Broad institutional applicability
    body: Public descriptions span financial institutions and multiple adjacent digital sectors, giving Tongdun a potentially diversified enterprise use-case surface.
    claimRefs: [CU005, CU008]
  - calloutType: risk
    title: Durability is unverified
    body: Historical customer counts and anecdotal signing references do not establish current active usage, retention, expansion, or concentration.
    claimRefs: [CU009, CU010, CU011, CU014]
  - calloutType: recommendation
    title: Request account-level cohort evidence
    body: Obtain a dated customer schedule with payer, user, product, deployment status, annual recurring or usage revenue, renewal date, and top-account share.
    claimRefs: [CU013, CU014]
