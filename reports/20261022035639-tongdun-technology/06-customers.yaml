    rows:
      - ["Companies served", "Almost 10,000", "2018 speech; published 2018-12-19", "EqualOcean transcript of a Tongdun co-founder; medium confidence", "Indicates substantial historical reach", "Active versus cumulative accounts and customer definition"]
      - ["Employees", "Almost 1,000; more than 70% in R&D", "2018 speech; published 2018-12-19", "EqualOcean transcript of a Tongdun co-founder; medium confidence", "Suggests delivery and product capacity at that time", "Current headcount and customer-support capacity"]
      - ["Chinese companies served", "More than 7,000 over four years", "2019-04-25", "Taihecap partner announcement; medium confidence", "Provides a dated commercial scale signal", "Active, paying, deployed, and retained accounts"]
      - ["Cooperating clients", "Over 10,000 repeated in a user discussion", "2021-09-22", "Zhihu answer; low confidence, anecdotal", "Corroborates awareness of a large footprint but not a registry", "Source population, current status, and independent verification"]
    notes: "Values are retained as reported rather than reconciled; the dates, populations, and definitions differ, so this is not a continuous growth series and does not imply a 2026 customer count."
    claimRefs: [CU009, CU010, CU011]
  - id: TU003
    title: Named customer proof table
    columns: [Customer or category, Segment, Deployment/use case, Production vs pilot, Outcome, Limitation]
    enumerationScope:
      coverage: partial
      basis: "Public assigned sources covering named references and customer categories in historical English-language pages"
    rows:
      - ["SF Express", "Logistics / enterprise", "A Zhihu answer says Tongdun cooperated with SF Express in a financing-related context", "Unclear", "No measured outcome is reported", "User-generated statement; cooperation scope and current status require confirmation"]
      - ["Banks", "Financial institutions", "User answers say many banks signed Tongdun products", "Unclear", "No named bank, metric, or outcome is supplied", "Category-level corroboration is not named-deployment proof"]
      - ["Internet finance, traditional banks, insurers, e-commerce, social platforms", "Financial and digital enterprise", "Taihecap describes these as customer categories for risk-control solutions", "Unclear", "No customer-level outcome is supplied", "Broad categories do not establish production deployment or retention"]
    notes: "Partial enumeration of public references, not a complete customer list; the evidence does not establish production status, contract duration, outcomes, or renewal for any row."
    claimRefs: [CU006, CU007, CU011, CU012]
