company:
  name: Tongdun Technology
chapter:
  number: 4
  title: Financials
  summary: Tongdun has a B2B risk-management model combining standardized and customized analytics services, but public evidence does not disclose current audited revenue, margins, cash, or runway. Historical funding and third-party estimates indicate material capital formation, while pricing realization, customer concentration, and unit economics remain underwriting gaps.
sections:
  - id: monetization-and-revenue-quality
    title: Monetization and revenue quality
    body: Tongdun describes an Analytics-as-a-Service model layered on SaaS, with standardized products and customized, scenario-specific analysis. The 2018 account says the offering covered marketing analytics, pre-loan, in-loan, post-loan, fraud, collection, and online-business risk use cases, which supports a recurring or usage-linked software-and-services hypothesis rather than a single product sale. Caplight classifies the business model as B2B and lists usage-based SaaS, subscription SaaS, and services and consulting. Those labels are useful mechanism evidence, not proof of realized revenue mix. Owler estimates annual revenue at $5.0–25M, but marks it as an estimate and does not provide audited support. Official list pricing, realized pricing, contract duration, discounting, gross retention, and renewal cohorts are not publicly evidenced. The underwriting conclusion is therefore that the mechanism is plausible and diversified across workflows, while revenue quality and conversion from customer activity to recognized revenue remain only partially observable.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]
  - id: cost-structure-and-operating-leverage
    title: Cost structure and operating leverage
    body: Public descriptions imply a cost base combining research and development, data and model operations, implementation, and customer-specific service delivery. EqualOcean reported almost 1,000 employees in 2018, with more than 70% in R&D, while Taihecap reported a 600-person team in April 2019; the differing dates and counts should not be treated as a clean growth series. The same materials describe machine-learning systems trained with client data, customized conjunctive models, and standardized products, suggesting a possible operating-leverage path if reusable models and cloud infrastructure dominate incremental delivery. Conversely, customer-specific analysis and regulated financial workflows may keep implementation, compliance, support, and data costs material. No source in the assigned pool reports gross margin, R&D expense, cloud spend, sales efficiency, CAC, payback, working capital, capex, or service-delivery margin. The financial model should therefore use scenarios and explicitly separate company-reported facts from estimates and unavailable private inputs.
    claimRefs: [CI006, CI007, CI008, CI009]
    tableRefs: [TI003]
    figureRefs: [FI001]
  - id: capital-adequacy-and-diligence-verdict
    title: Capital adequacy and diligence verdict
    body: >-
      Tongdun has credible historical financing evidence but no current public cash position or runway disclosure in the assigned pool. Taihecap reported a $100M round in April 2019 and described prior seed, Series A, Series B, and Series C financing; Caplight records a Series D and extension through June 2019 and reports total funding of $245.8M, while Owler reports $244.8M. These totals are broadly consistent as third-party historical aggregates but are not cash-on-hand figures and should not be substituted for liquidity. Caplight estimates a $2B valuation based on funding-round data and identifies the company as private; another profile lists $1.5B in September 2018. The differing valuation observations are historical and source-dependent, not a current fair-value mark. No assigned source establishes debt, project finance, burn, next-round trigger, planned use of funds, or current financing dependency. The financial verdict is research-more: the business model has plausible recurring and service components, but valuation, margin path, capital adequacy, and customer concentration cannot be underwritten without management accounts, cohort data, cash-flow statements, and financing documents.
    claimRefs: [CI010, CI011, CI012, CI013, CI014]

