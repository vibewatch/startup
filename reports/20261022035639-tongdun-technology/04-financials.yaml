callouts:
  - calloutType: insight
    title: Plausible recurring mechanism, weak disclosure
    body: Tongdun's described product mix can support usage, subscription, and service revenue, but the assigned evidence does not establish realized mix, pricing, retention, or margins.
    claimRefs: [CI001, CI002, CI004, CI005]
  - calloutType: risk
    title: Funding is not liquidity
    body: Historical funding totals and valuation estimates provide financing context, not evidence of current cash, runway, profitability, or capital adequacy.
    claimRefs: [CI010, CI011, CI012, CI013]
  - calloutType: recommendation
    title: Request primary financial evidence
    body: Underwriting should remain research-more until management provides audited revenue and margin history, customer cohorts, cash-flow statements, debt terms, and current financing requirements.
    claimRefs: [CI004, CI008, CI009, CI014]

