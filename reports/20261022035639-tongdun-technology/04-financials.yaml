      - [Gross margin, null, low, Determines software versus service leverage, Obtain gross-margin history by product]
      - [CAC and payback, null, low, Tests sales efficiency, Obtain cohort-level sales and marketing spend]
      - [Net retention, null, low, Tests renewal and expansion quality, Obtain logo and dollar retention cohorts]
      - [Cash and runway, null, low, Tests financing dependency, Obtain latest balance sheet and monthly cash burn]
      - [Customer concentration, null, low, Tests revenue fragility, Obtain top-customer revenue shares]
    notes: "Null means not disclosed in the assigned public evidence; the revenue band is an Owler estimate and is not equivalent to ARR, cash, or recognized revenue."
    claimRefs: [CI004, CI012, CI014]

