    claimRefs: [CP001, CP003, CP005, CP009, CP012]
callouts:
  - calloutType: insight
    title: Breadth is the differentiator, not yet a proven moat
    body: Tongdun's modular lifecycle coverage and scenario-specific analytics may reduce the need to assemble multiple tools, but public evidence does not prove superior model lift, retention, or pricing power.
    claimRefs: [CP005, CP009, CP010]
  - calloutType: risk
    title: Comparator data are unusually thin
    body: Current competitor pricing, win rates, implementation costs, and common benchmark results are not disclosed in the assigned evidence, limiting confidence in any relative valuation or moat conclusion.
    claimRefs: [CP007, CP008, CP012]
