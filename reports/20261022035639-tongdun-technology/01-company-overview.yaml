company:
  name: Tongdun Technology
chapter:
  number: 1
  title: Company Overview
  summary: Tongdun Technology is a Hangzhou-based private provider of AI-enabled risk management and decision-intelligence services. The evidence supports a 2013 founding, Jiang Tao leadership, substantial historical venture funding, and broad claimed customer reach, but current financial disclosure, governance, and the resolution of historical data-governance allegations remain limited.
sections:
  - id: identity-and-business
    title: Identity, product scope, and operating footprint
    body: >-
      Tongdun Technology is consistently described as a Hangzhou-based Chinese
      technology company founded in 2013 by Jiang Tao, although one third-party
      account gives 2012 as an alternative founding year. Tracxn describes the
      company as a Series D provider of an AI-powered decision-intelligence
      platform for risk and security management, while company-issued profile
      material reposted on a jobs site identifies financial risk, security
      risk, and government governance risk as its principal areas. The product description is
      broader than a single fraud score: sources describe risk control,
      fraud detection, decision intelligence, privacy computing, standardized
      indicators, and data processing.       A 2018 EqualOcean article reproducing co-founder Zhu Wei's presentation
      says Tongdun framed its delivery model as Analytics-as-a-Service,
      combining scenario data, algorithms, and machine learning with
      standardized and customized services. Company-issued profile material claims more than 10,000
      clients across 22 industries and 118 sub-sectors, while a 2019 funding
      announcement reported more than 7,000 Chinese companies and a 600-strong
      team. These figures are company or contemporaneous reported claims rather
      than current audited operating metrics. The evidence supports a B2B
      model serving financial institutions and enterprises, with no public
      listing confirmed in the assigned sources.
    claimRefs: [CO001, CO002, CO003, CO004]
    tableRefs: [TO001]
    figureRefs: [FO001]
  - id: leadership-and-capital
    title: Leadership, funding, and scale signals
    body: >-
      Jiang Tao is identified as founder and chief executive across the
      Tracxn, Silicon Valley Invest Club, and company-profile sources. EqualOcean
      identifies Zhu Wei as co-founder and vice president in its account of a
      2018 industry presentation, adding a second leadership signal but not a
      complete current executive or board roster. Historical funding evidence
      is comparatively detailed: Edgepedia's synthesis lists an angel round in
      2013, Series A in 2014, Series B in 2015, a 2016 extension, Series C in
      2017, and a $100 million Series D announcement in April 2019. Tracxn aggregates
      seven rounds and $246 million of funding, while Caplight reports $245.8
      million and a June 2019 Series D extension. The same sources disagree on
      valuation: Tracxn records $1 billion as of June 2019, Caplight estimates
      $2 billion from round data, and Silicon Valley Invest Club lists $1.5
      billion in September 2018. These are dated private-market indicators,
      not a current mark. The gap between the 2019 funding evidence and the
      2026 refresh date makes current capitalization, ownership, debt, and
      runway unresolved.
    claimRefs: [CO005, CO006, CO007, CO008, CO009, CO012]
    tableRefs: [TO002, TO003]
  - id: milestones-and-risk-context
    title: Milestones, disclosure quality, and unresolved diligence
    body: >-
      The operating history shows a progression from founding and early venture
      rounds to a 2017 Temasek-backed Series C, a reported $100 million 2019
      Series D, and later private-company profiles that still describe Tongdun
      as private and Series D-stage. Product positioning expanded from
      financial risk and anti-fraud use cases into privacy computing, security
      risk, and government governance. The assigned evidence also contains an
      important adverse context: Edgepedia summarizes a 2019 Caixin report that
      alleged Tongdun was involved in selling illegally acquired personal
      information to predatory online lenders; the same summary says no
      enforcement outcome, penalty, or subsequent compliance change is
      documented in the retained material. A 2021 Zhihu answer alleges
      mandatory weekly sales meetings and daily reporting, but its anonymous,
      user-generated nature prevents assessing prevalence or present relevance.
      The present-day diligence case therefore depends on obtaining audited
      financials, a current cap table and executive roster, verified customer
      and headcount data, and primary documentation resolving the historical
      data-governance allegations. The absence of a recorded outcome in these
      sources is not proof that no action occurred.
    claimRefs: [CO010, CO011, CO012, CO013, CO014, CO015]
    tableRefs: []
    figureRefs: []
