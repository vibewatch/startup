      - number: '5.2'
        title: Operating architecture and maturity
        blocks:
          - type: paragraph
            body: >-
              The disclosed operating model is a layered combination of first-party and third-party data, device and
              network signals, machine-learning models, graph or decision computation, and scenario-specific outputs.
              EqualOcean reports that Tongdun used client data to train machine learning and applied process
              calculation, models, and graph computing across scenarios; it also says the company offered both
              standardized products and customized analysis services. A company-profile listing identifies two named
              platforms, Zhibang for privacy-computing shared intelligence and Zhice for AI decision intelligence, while
              describing financial, security, and government-governance risk as the focus. The evidence is descriptive
              rather than technical: no public API specification, architecture diagram, benchmark methodology,
              model-card package, or reproducible uptime history was found in the assigned pool. RECATOOLS repeats a
              sub-20ms decisioning claim but explicitly says the latency, accuracy, and client-count assertions were not
              independently audited. That makes the product direction credible but leaves implementation and scale
              diligence open.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
