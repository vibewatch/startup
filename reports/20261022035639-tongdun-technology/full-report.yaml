  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered risk workflows
        blocks:
          - type: paragraph
            body: >-
              The clearest public product description is a decisioning service embedded in a financial institution's
              lending and transaction workflow. EqualOcean describes Tongdun's AaaS model as connecting problem
              scenarios on top of SaaS and applying data analysis and algorithms to specific scenarios; it identifies
              pre-loan, during-loan, and post-loan use cases. A 2019 BPI announcement provides a named customer
              deployment: Tongdun was to automate SME lending and optimize a credit scoring model, with BPI saying the
              partnership would unlock financial products and services. RECATOOLS, a 2026 third-party review, describes
              the current category as device fingerprinting, behavioral-biometric fraud signals, transaction risk
              scoring, credit-risk decisioning, account protection, application fraud, and chargeback prevention. These
              sources establish a coherent workflow, not a complete product catalog or proof that every listed module
              remains sold today. Public pricing is not published, and the available review says the product is
              sales-led rather than self-serve.
            claimRefs:
              - CE001
