  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              Tongdun's job-to-be-done is broader than a single fraud score. Its described offer spans identity,
              behavioral analytics, graph computing, federated learning, credit risk, anti-money-laundering, and
              decisioning across onboarding, pre-loan, transaction, and post-loan workflows. That scope puts it against
              direct risk-decisioning peers such as Feedzai and DataVisor, specialist compliance and identity vendors
              such as ComplyAdvantage, and large incumbent data-and-score platforms such as FICO, Experian, and
              LexisNexis Risk Solutions. The 2018 company presentation also describes standardized products plus
              customized scenario services, which broadens the competitive set to systems integrators and internal bank
              risk teams. A buyer can therefore substitute a single specialist, assemble several APIs, retain a legacy
              rules engine, or build models internally; the economic comparison depends on deployment speed, local data
              access, regulatory controls, and the cost of maintaining models. A third-party registry's September 2018
              valuation of $1.5 billion indicates historical capitalization scale, but it does not establish product
              quality, current enterprise value, or present competitive strength.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP016
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP009
              - CP016
      - number: '3.2'
        title: Capability, distribution, and commercial comparison
        blocks:
          - type: paragraph
            body: >-
              The evidence points to a differentiated positioning around scenario-specific analytics rather than a
              transparent commodity price. EqualOcean records Tongdun's AaaS framing as connecting problem scenarios to
              SaaS and applying data analysis and algorithms to pre-loan, during-loan, and post-loan use cases.
              InsurTech List describes API and cloud deployment across the customer lifecycle, while Caplight classifies
              the business as B2B with usage-based SaaS, subscription SaaS, and services-and-consulting elements. Those
              features can support multi-product expansion and local workflow fit, but they also create implementation
              and services dependencies. Competitors with stronger global brands, public benchmarks, or embedded
              distribution may win where procurement requires standardized controls. No retained source provides
              comparable list prices, implementation fees, model-performance benchmarks, or customer-level win rates, so
              unknown cells should remain unknown rather than being scored as parity.
            claimRefs:
              - CP005
              - CP006
              - CP007
              - CP008
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP005
              - CP006
