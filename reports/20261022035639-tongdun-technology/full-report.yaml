              - CP010
          - type: table
            tableRef: TP003
            claimRefs:
              - CP006
              - CP007
              - CP008
              - CP012
      - number: '3.3'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Tongdun's potential moat is cumulative workflow integration, customer data feedback, domain-specific
              models, and the switching cost of replacing risk decisions embedded across a loan or transaction
              lifecycle. The 2018 account says customer data was used to train machine-learning systems and improve
              decision analysis, while the company profile describes federated learning, graph computing, and modular
              deployment. These are plausible sources of operational lock-in, but they are company- or profile-level
              assertions rather than independent proof of superior accuracy or retention. Displacement risk is material:
              large incumbents can bundle data and compliance, specialist vendors can focus on a narrow high-value fraud
              problem, and internal teams can keep proprietary data and rules in-house. The retained evidence also
              contains negative employee commentary and inconsistent historical scale metrics, which increase execution
              and disclosure uncertainty. A durable advantage therefore requires current, independently verified
              renewal, model lift, false-positive reduction, and customer concentration data that are not public here.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP009
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Breadth is the differentiator, not yet a proven moat
            body: >-
              Tongdun's modular lifecycle coverage and scenario-specific analytics may reduce the need to assemble
              multiple tools, but public evidence does not prove superior model lift, retention, or pricing power.
            calloutType: insight
            claimRefs:
              - CP005
