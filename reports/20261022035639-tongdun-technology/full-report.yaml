      - number: '4.3'
        title: Capital adequacy and diligence verdict
        blocks:
          - type: paragraph
            body: >-
              Tongdun has credible historical financing evidence but no current public cash position or runway
              disclosure in the assigned pool. Taihecap reported a $100M round in April 2019 and described prior seed,
              Series A, Series B, and Series C financing; Caplight records a Series D and extension through June 2019
              and reports total funding of $245.8M, while Owler reports $244.8M. These totals are broadly consistent as
              third-party historical aggregates but are not cash-on-hand figures and should not be substituted for
              liquidity. Caplight estimates a $2B valuation based on funding-round data and identifies the company as
              private; another profile lists $1.5B in September 2018. The differing valuation observations are
              historical and source-dependent, not a current fair-value mark. No assigned source establishes debt,
              project finance, burn, next-round trigger, planned use of funds, or current financing dependency. The
              financial verdict is research-more: the business model has plausible recurring and service components, but
              valuation, margin path, capital adequacy, and customer concentration cannot be underwritten without
              management accounts, cohort data, cash-flow statements, and financing documents.
            claimRefs:
              - CI010
              - CI011
              - CI012
              - CI013
              - CI014
