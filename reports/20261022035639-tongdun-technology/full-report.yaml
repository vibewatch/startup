  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and status quo
        blocks:
          - type: paragraph
            body: >-
              The relevant market is decision intelligence and risk-control software and services used to prevent fraud,
              assess credit and other financial risk, and automate operational decisions for regulated and digitally
              distributed businesses. Tongdun's described product scope includes databases, decision intelligence
              platforms, AI-powered risk-control systems, and AI-powered anti-fraud systems, applied to financial,
              security, and government-governance risk. A 2018 company-contributed account describes an
              Analytics-as-a-Service model that connects scenario-specific data analysis and algorithms to software
              infrastructure rather than selling generic cloud infrastructure alone. The boundary therefore includes
              risk decisioning, fraud and identity signals, credit scoring, and related workflow automation; it excludes
              general-purpose cloud, core banking, generic data warehousing, and customers' internal controls except
              where they are direct substitutes. The status quo is a mix of internal analytics and rules engines, bank
              process teams, point solutions, and manual review. A 2019 BPI deployment illustrates the buying problem:
              automated lending and an optimized SME credit-scoring model were intended to make loan evaluation faster.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
      - number: '2.2'
        title: Sizing through multiple lenses
        blocks:
          - type: paragraph
            body: >-
              Public sources provide several market lenses but not a clean, current TAM/SAM/SOM bridge. The company
              profile in Bloomberg describes products spanning financial, security, and government-governance risk,
              while the 2018 company-contributed source describes pre-loan, during-loan, post-loan, marketing,
              e-commerce, O2O, and travel scenarios. These are different addressable pools, so adding them would risk
              double counting. The most defensible sizing statement is consequently constrained: the addressable
              opportunity is the spend of regulated financial institutions and other enterprises on risk decisioning,
              fraud prevention, and adjacent workflow automation, narrowed by geography, data access, procurement
              eligibility, and implementation capacity. Caplight classifies the business as B2B with usage-based and
              subscription SaaS plus services and consulting models, which supports a recurring-software lens but does
              not disclose market revenue. No assigned source supplies a current, auditable market value or a
              company-specific SOM; those remain diligence gaps rather than estimates.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM005
              - CM008
      - number: '2.3'
        title: Buyers, users, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is typically a bank, lender, insurer, fintech, commerce platform, or other enterprise
              with a measurable loss, approval, compliance, or operating-efficiency problem. The user may be a risk,
              credit, fraud, compliance, data, or operations team; the payer is the business unit that owns loss
              reduction, approval throughput, or customer-acquisition economics. The BPI example shows a bank-level
              purchase with SME lending as the workflow and faster loan evaluation as the operational trigger. The 2018
              account describes both standardized products and customized scenario services, implying an adoption path
              from a defined workflow or pilot to broader lifecycle coverage. A 2019 financing-advisor account reports
              customers across internet finance, traditional banking, insurance, e-commerce, and social networking, but
              its customer count and employee figures are historical, company-related claims rather than current
              independent market measurements. Adoption is therefore likely strongest where data connectivity, model
              governance, and a quantified fraud or credit-loss problem already exist; long procurement, validation, and
              integration cycles constrain smaller or less regulated buyers.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
      - number: '2.4'
        title: Growth drivers and constraints
        blocks:
          - type: paragraph
            body: >-
              Demand drivers include digitization of lending and payments, expansion of online channels, pressure to
              serve previously underbanked customers, and the need to evaluate risk faster without scaling manual
              review. GMA reports that Tongdun and BPI framed the engagement around digitizing lending and financial
              inclusion, while EqualOcean describes online-business fraud, pre-loan and post-loan workflows, and
              model-based analysis as the operating problem. Constraints are equally material: the solution depends on
              access to relevant first- and third-party data, model and workflow integration, regulatory acceptance, and
              buyer trust. The public record also leaves current revenue, market share, retention, pricing, and
              geography-specific adoption unresolved. Historical private-market profiles report different valuation
              figures—$1.5B in September 2018 from Silicon Valley Invest Club and $2.0B based on funding-round data from
              Caplight—but these are valuation signals, not market-size measures. Valuation relevance therefore depends
              on proving durable, repeatable enterprise adoption rather than extrapolating from a broad AI or fintech
              category.
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Market opportunity is real but not numerically underwritten
            body: >-
              The evidence supports a multi-segment enterprise market for risk decisioning and fraud-control workflows,
              with a concrete bank deployment and multiple adjacent verticals. It does not support a current numerical
              TAM, SAM, SOM, market share, or growth rate; those should remain diligence asks.
            calloutType: insight
            claimRefs:
