      - number: '1.2'
        title: Leadership, funding, and scale signals
        blocks:
          - type: paragraph
            body: >-
              Jiang Tao is identified as founder and chief executive across the Tracxn, Silicon Valley Invest Club, and
              company-profile sources. EqualOcean identifies Zhu Wei as co-founder and vice president in its account of
              a 2018 industry presentation, adding a second leadership signal but not a complete current executive or
              board roster. Historical funding evidence is comparatively detailed: Edgepedia's synthesis lists an angel
              round in 2013, Series A in 2014, Series B in 2015, a 2016 extension, Series C in 2017, and a $100 million
