  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Monetization and revenue quality
        blocks:
          - type: paragraph
            body: >-
              Tongdun describes an Analytics-as-a-Service model layered on SaaS, with standardized products and
              customized, scenario-specific analysis. The 2018 account says the offering covered marketing analytics,
              pre-loan, in-loan, post-loan, fraud, collection, and online-business risk use cases, which supports a
              recurring or usage-linked software-and-services hypothesis rather than a single product sale. Caplight
              classifies the business model as B2B and lists usage-based SaaS, subscription SaaS, and services and
              consulting. Those labels are useful mechanism evidence, not proof of realized revenue mix. Owler estimates
              annual revenue at $5.0–25M, but marks it as an estimate and does not provide audited support. Official
              list pricing, realized pricing, contract duration, discounting, gross retention, and renewal cohorts are
              not publicly evidenced. The underwriting conclusion is therefore that the mechanism is plausible and
              diversified across workflows, while revenue quality and conversion from customer activity to recognized
              revenue remain only partially observable.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
              - CI005
