      - number: '1.3'
        title: Milestones, disclosure quality, and unresolved diligence
        blocks:
          - type: paragraph
            body: >-
              The operating history shows a progression from founding and early venture rounds to a 2017 Temasek-backed
              Series C, a reported $100 million 2019 Series D, and later private-company profiles that still describe
              Tongdun as private and Series D-stage. Product positioning expanded from financial risk and anti-fraud use
              cases into privacy computing, security risk, and government governance. The assigned evidence also
              contains an important adverse context: Edgepedia summarizes a 2019 Caixin report that alleged Tongdun was
              involved in selling illegally acquired personal information to predatory online lenders; the same summary
              says no enforcement outcome, penalty, or subsequent compliance change is documented in the retained
              material. A 2021 Zhihu answer alleges mandatory weekly sales meetings and daily reporting, but its
              anonymous, user-generated nature prevents assessing prevalence or present relevance. The present-day
              diligence case therefore depends on obtaining audited financials, a current cap table and executive
              roster, verified customer and headcount data, and primary documentation resolving the historical
              data-governance allegations. The absence of a recorded outcome in these sources is not proof that no
              action occurred.
