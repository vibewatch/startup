      - number: '4.2'
        title: Cost structure and operating leverage
        blocks:
          - type: paragraph
            body: >-
              Public descriptions imply a cost base combining research and development, data and model operations,
              implementation, and customer-specific service delivery. EqualOcean reported almost 1,000 employees in
              2018, with more than 70% in R&D, while Taihecap reported a 600-person team in April 2019; the differing
              dates and counts should not be treated as a clean growth series. The same materials describe
              machine-learning systems trained with client data, customized conjunctive models, and standardized
              products, suggesting a possible operating-leverage path if reusable models and cloud infrastructure
              dominate incremental delivery. Conversely, customer-specific analysis and regulated financial workflows
              may keep implementation, compliance, support, and data costs material. No source in the assigned pool
              reports gross margin, R&D expense, cloud spend, sales efficiency, CAC, payback, working capital, capex, or
              service-delivery margin. The financial model should therefore use scenarios and explicitly separate
              company-reported facts from estimates and unavailable private inputs.
            claimRefs:
