chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and operating footprint
        blocks:
          - type: paragraph
            body: >-
              Tongdun Technology is consistently described as a Hangzhou-based Chinese technology company founded in
              2013 by Jiang Tao, although one third-party account gives 2012 as an alternative founding year. Tracxn
              describes the company as a Series D provider of an AI-powered decision-intelligence platform for risk and
              security management, while company-issued profile material reposted on a jobs site identifies financial
              risk, security risk, and government governance risk as its principal areas. The product description is
              broader than a single fraud score: sources describe risk control, fraud detection, decision intelligence,
              privacy computing, standardized indicators, and data processing.       A 2018 EqualOcean article
              reproducing co-founder Zhu Wei's presentation says Tongdun framed its delivery model as
              Analytics-as-a-Service, combining scenario data, algorithms, and machine learning with standardized and
              customized services. Company-issued profile material claims more than 10,000 clients across 22 industries
              and 118 sub-sectors, while a 2019 funding announcement reported more than 7,000 Chinese companies and a
              600-strong team. These figures are company or contemporaneous reported claims rather than current audited
              operating metrics. The evidence supports a B2B model serving financial institutions and enterprises, with
              no public listing confirmed in the assigned sources.
