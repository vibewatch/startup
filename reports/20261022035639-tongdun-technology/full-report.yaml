      - number: '5.3'
        title: Trust, controls, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              Risk decisioning is a high-consequence product, so the absence of public control evidence matters as much
              as the feature list. The assigned sources identify privacy computing, device fingerprinting, IP and
              behavioral signals, and AI scoring, but do not provide a current security attestation, privacy impact
              assessment, model-governance policy, false-positive and false-negative rates, incident history,
              service-level commitments, or independent penetration testing. RECATOOLS says public documentation is thin
              and independent review coverage is essentially absent; its own listing is a desk-research review, not a
              hands-on test. A Zhihu thread supplies anecdotal employee and customer commentary, but it is not a control
              audit. The technology case therefore rests on category experience and a named bank workflow rather than
              independently verified reliability or safety evidence. A buyer should require a controlled pilot,
              data-processing terms, model-change controls, explainability and adverse-action procedures, resilience
              metrics, and current certification evidence before treating the stack as production-ready for a critical
              path.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
      - number: '5.4'
        title: Exhibits
        blocks:
          - type: paragraph
            body: >-
              The architecture exhibit is intentionally a product-flow abstraction rather than a claim that the vendor
              exposes these layers as separately deployable services. It preserves the distinction between documented
              capabilities, third-party descriptions, and items that remain unverified. The exhibit should therefore be
              read as an underwriting map: each layer identifies a dependency that a buyer would test, rather than a
              promise that the public materials establish an implementation detail, service boundary, or control
              objective.
            claimRefs: []
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Named workflow proof
            body: >-
              The BPI announcement is stronger than generic category marketing because it names a bank deployment and a
              defined SME-lending automation use case, although it does not disclose outcomes.
            calloutType: strength
            claimRefs:
              - CE002
              - CE003
          - type: callout
            title: Production controls are not public
            body: >-
              The public record does not establish current security attestations, model-governance controls, resilience
              metrics, or independently audited latency and accuracy.
            calloutType: risk
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Buyer and use-case segmentation
        blocks:
          - type: paragraph
            body: >-
              Tongdun's public customer story is primarily enterprise and institutional rather than self-serve. The
              available descriptions place financial institutions at the center, while also identifying internet
              finance, insurance, e-commerce, travel, O2O, government, and other enterprise use cases. The historical
              operating model combines standardized products with customized, scenario-specific analysis, implying
              different procurement and delivery motions by segment. This supports a segmentation hypothesis, not a
              verified current revenue mix: the sources do not disclose contract values, payer versus end-user roles,
              geographic revenue, or the share of customers using each product family.
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU005
              - CU008
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU008
              - CU009
      - number: '6.2'
        title: Adoption trajectory and commercial signals
        blocks:
          - type: paragraph
            body: >-
              The public adoption record shows scale signals but not a clean current time series. A 2018 industry
              article attributed almost 1,000 employees and services to almost 10,000 companies, while a 2019 financing
              announcement described a 600-person team and more than 7,000 Chinese companies served over the prior four
              years. A 2021 user discussion repeated the 10,000-client figure and described companies signing products,
              but it is anecdotal and not a customer registry. These statements are not directly comparable because
              their dates, definitions, and denominators differ. No assigned source provides active-account counts,
              usage volumes, repeat purchase, deployment locations, or a reconciled 2026 customer base.
            claimRefs:
              - CU009
              - CU010
              - CU011
          - type: table
            tableRef: TU002
            claimRefs:
              - CU009
              - CU010
              - CU011
      - number: '6.3'
        title: Named customer proof and reference quality
        blocks:
          - type: paragraph
            body: >-
              Named proof is uneven. A user-generated answer mentions SF Express in connection with a financing-related
              cooperation, but does not establish production status, contract scope, duration, or outcome. Other sources
              identify customer categories rather than customer names, including banks, insurers, internet finance
              companies, e-commerce companies, and social platforms. The evidence therefore supports market presence and
              referenceable categories more strongly than it supports durable, measurable deployments. The customer list
              below is intentionally partial; logos or broad category statements are not treated as evidence of renewal,
              expansion, or successful implementation.
            claimRefs:
              - CU006
              - CU007
              - CU011
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU006
              - CU007
              - CU011
              - CU012
      - number: '6.4'
        title: Retention, expansion, and concentration gaps
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not disclose NRR, GRR, churn, renewal rates, contract length, cohort behavior,
              satisfaction scores, or top-customer concentration. Tongdun's described combination of standardized
              services and customized models could support land-and-expand economics, but no source quantifies expansion
              from one risk scenario into additional products or geographies. The customer journey figure is
              consequently an analytical map of evidence-backed workflow stages, not a measured conversion funnel. The
              principal diligence requirement is a customer-level revenue and usage schedule that separates contracted,
              active, pilot, and dormant accounts and identifies renewal and concentration exposure.
            claimRefs:
              - CU004
              - CU013
              - CU014
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU003
              - CU004
              - CU015
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Broad institutional applicability
            body: >-
              Public descriptions span financial institutions and multiple adjacent digital sectors, giving Tongdun a
              potentially diversified enterprise use-case surface.
            calloutType: strength
            claimRefs:
              - CU005
              - CU008
          - type: callout
            title: Durability is unverified
            body: >-
              Historical customer counts and anecdotal signing references do not establish current active usage,
              retention, expansion, or concentration.
            calloutType: risk
            claimRefs:
              - CU009
              - CU010
              - CU011
              - CU014
          - type: callout
            title: Request account-level cohort evidence
            body: >-
              Obtain a dated customer schedule with payer, user, product, deployment status, annual recurring or usage
              revenue, renewal date, and top-account share.
            calloutType: recommendation
            claimRefs:
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Legal and regulatory exposure
        blocks:
          - type: paragraph
            body: >-
              Tongdun's principal evidenced risk is the use of large-scale personal data in automated risk control. An
              OECD AI Incident and Hazard Monitor entry says the company and several executives face criminal and civil
              lawsuits for allegedly infringing citizens' personal information, and it frames the concern as a privacy
              and public-interest harm. The entry itself carries an important qualification: the displayed information
              is not the official view of the OECD or its members, and portions are marked AI generated. That makes the
              record a serious adverse diligence lead rather than a final adjudication. The company’s own historical
              description also says that its systems combine first-party and third-party data, fingerprints, IP
              portraits, and internet behavior across pre-loan, during-loan, and post-loan workflows. This combination
              increases the importance of lawful basis, purpose limitation, retention, model governance, cross-border
              transfer, and customer allocation of regulatory responsibility. No current public source in this pool
              confirms the case disposition, applicable judgment, remediation, or current licensing status, so legal
              clearance should be treated as unresolved rather than inferred from the absence of a newer public notice.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
      - number: '7.2'
        title: Operational, security, and financial-model risk
        blocks:
          - type: paragraph
            body: >-
              Tongdun's operating model is exposed to model quality, data quality, service reliability, and disclosure
              risk. The historical product account describes customized and standardized services, machine-learning
              systems trained with client data, and deployment across multiple loan-life-cycle scenarios; those features
              create failure modes around drift, false positives, explainability, data lineage, and customer-specific
              configuration. A 2019 financing report described a 600-strong team serving more than 7,000 Chinese
              companies, while a 2025 profile reports 416 employees and $110.4M annual revenue but says the revenue
              source was not recorded. These figures are not directly comparable and do not establish current
              productivity, margin, cash generation, or runway. An anonymous or community employment discussion also
              contains allegations about sales pressure and legal changes, but it is anecdotal and should not be treated
              as representative. The practical control response is to require incident history, uptime and
              model-performance evidence, customer-loss allocation, audited financial statements, and a reconciliation
              of current headcount and customer definitions before underwriting scale.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
      - number: '7.3'
        title: Dependency, concentration, and thesis-break conditions
        blocks:
          - type: paragraph
            body: >-
              Tongdun's commercial and valuation risk is amplified by dependence on regulated financial and enterprise
              buyers, data and cloud/platform inputs, and the credibility of private-market marks. Historical reporting
              describes customers across internet finance, banks, insurers, e-commerce, and social platforms, while
              another profile describes a B2B model spanning usage-based SaaS, subscription SaaS, and services and
              consulting. That breadth can diversify demand, but public evidence does not disclose revenue by customer,
              vertical, geography, contract duration, renewal, or channel. Private-market pages also show materially
              different valuation references: $1.3B in June 2019 on one profile, $1.5B in September 2018 on another, and
              an estimated $2.0B based on funding-round data on Caplight; none is a current tradable price. The thesis
              should break or move to a no-underwrite posture if a regulator confirms material liability without
              remediation, if a security or privacy incident creates unallocated customer losses, if audited cash runway
              or margins fail diligence, or if customer concentration and renewal evidence cannot support the claimed
              scale.
            claimRefs:
              - CR006
              - CR007
              - CR012
              - CR013
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR012
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR003
              - CR005
              - CR008
              - CR012
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Highest-priority risk
            body: >-
              The OECD incident record is a material privacy and legal diligence trigger, but its AI-generated portions
              and lack of disposition details require primary court and regulator documents before assigning a confirmed
              liability amount or final legal conclusion.
            calloutType: risk
            claimRefs:
              - CR001
              - CR002
          - type: callout
            title: Evidence limitation
            body: >-
              Public figures for revenue, employees, customers, funding, and valuation are publisher-reported,
              differently dated, and not reconciled to audited statements; scale should therefore not be treated as
              proof of cash generation or retention.
            calloutType: assumption
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
          - type: callout
            title: Underwriting condition
            body: >-
              Advance only after receiving primary legal-status records, security and model-control evidence, audited
              financials, customer concentration and renewal cohorts, and current cap-table and preference terms.
            calloutType: recommendation
            claimRefs:
              - CR001
              - CR003
              - CR008
              - CR012
              - CR014
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Financing evidence and entry discipline
        blocks:
          - type: paragraph
            body: >-
              Tongdun is a private company, so there is no public stock price against which to mark an entry. The
              retained record shows a $100 million financing announced in April 2019, a Series D extension involving
              AVIC Capital and other investors in June 2019, a $72.8 million Series C in 2017, and a $32 million Series
              B+ financing in 2016. Caplight reports $245.8 million of total funding and an estimated $2.0 billion
              valuation based on funding-round data, while another registry reports a $1.5 billion valuation for
              September 2018. Those figures are historical estimates or financing context, not a current independently
              verified mark. The public evidence also does not disclose revenue, EBITDA, cash, debt, preference stack,
              dilution, or the terms attached to the latest round. Entry discipline therefore requires a current cap
              table, the latest preferred-share price and rights, audited or management revenue and margin data, and a
              reconciliation of the conflicting valuation estimates before a price-sensitive recommendation can be made.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV002
              - CV007
              - CV008
              - CV009
              - CV015
              - CV017
              - CV018
      - number: '8.2'
        title: Investment thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The positive thesis is that Tongdun has operated for years in a mission-critical risk-control category,
              has reported thousands of enterprise customers, and has attracted repeated financing from strategic and
              institutional investors. Its described B2B model combines usage-based or subscription software with
              services, which could support recurring or embedded workflow revenue if retention and gross margins are
              strong. The anti-thesis is equally material: the evidence is mostly historical, several customer and scale
              figures are company statements or secondary summaries, and current operating performance is not public. A
              private secondary-market profile says pricing charts require institutional access and reports no announced
              IPO plan; this limits liquidity and makes exit timing uncertain. The valuation case can improve only if
              current cohorts, margins, concentration, governance, and transaction terms corroborate the strategic
              narrative rather than merely repeating old fundraising milestones.
            claimRefs:
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV017
              - CV018
          - type: table
            tableRef: TV002
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV013
              - CV017
              - CV018
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV007
              - CV008
              - CV009
              - CV011
              - CV012
              - CV015
              - CV017
              - CV018
      - number: '8.3'
        title: Scenarios, recommendation, and diligence gates
        blocks:
          - type: paragraph
            body: >-
              A scenario approach is more defensible than a single point valuation because the public record lacks the
              revenue and margin denominator needed for a conventional SaaS multiple. In a bull case, verified recurring
              revenue growth, durable retention, improving margins, and clean preference terms could support the upper
              end of a negotiated range or a buy decision at a disciplined price. The base case is a track or
              research-more outcome: the business remains strategically relevant, but historical financing marks are not
              enough to prove present fair value. The bear case combines flat or declining cohorts, customer
              concentration, regulatory or data-use constraints, preference overhang, and a down-round or illiquid exit;
              those facts would require a material price reset or a pass. The immediate diligence gate is current
              financial and cap-table evidence, followed by customer retention and concentration data, legal and
              regulatory status, and a documented exit pathway.
            claimRefs:
              - CV008
              - CV015
              - CV017
              - CV018
          - type: table
            tableRef: TV003
            claimRefs:
              - CV008
              - CV015
              - CV017
              - CV018
      - number: '8.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Research-more pending price discovery
            body: >-
              Historical fundraising supports strategic relevance but does not establish a current fair value. Do not
              issue a buy recommendation until current financials, cap-table terms, and a defendable entry price are
              verified.
            calloutType: recommendation
            claimRefs:
              - CV008
              - CV015
          - type: callout
            title: Valuation and liquidity uncertainty
            body: >-
              Public estimates range from $1.5 billion to $2.0 billion, while current secondary pricing, preference
              rights, and exit timing remain unresolved.
            calloutType: risk
            claimRefs:
              - CV008
              - CV009
              - CV017
              - CV018
