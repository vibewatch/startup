company:
  name: Tongdun Technology
chapter:
  number: 8
  title: Valuation
  summary: Tongdun has a substantial historical financing record and a credible financial-risk software position, but the retained evidence does not establish a current price, audited revenue base, margin profile, or transaction terms. The appropriate stance is research-more until current financials, cap-table preferences, and a defendable entry price are obtained.
sections:
  - id: valuation-evidence
    title: Financing evidence and entry discipline
    body: >-
      Tongdun is a private company, so there is no public stock price against which to
      mark an entry. The retained record shows a $100 million financing announced in
      April 2019, a Series D extension involving AVIC Capital and other investors in
      June 2019, a $72.8 million Series C in 2017, and a $32 million Series B+
      financing in 2016. Caplight reports $245.8 million of total funding and an
      estimated $2.0 billion valuation based on funding-round data, while another
      registry reports a $1.5 billion valuation for September 2018. Those figures are
      historical estimates or financing context, not a current independently verified
      mark. The public evidence also does not disclose revenue, EBITDA, cash, debt,
      preference stack, dilution, or the terms attached to the latest round. Entry
      discipline therefore requires a current cap table, the latest preferred-share
      price and rights, audited or management revenue and margin data, and a
      reconciliation of the conflicting valuation estimates before a price-sensitive
      recommendation can be made.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV015]
    tableRefs: [TV001]
  - id: thesis-antithesis
    title: Investment thesis and anti-thesis
    body: >-
      The positive thesis is that Tongdun has operated for years in a mission-critical
      risk-control category, has reported thousands of enterprise customers, and has
      attracted repeated financing from strategic and institutional investors. Its
      described B2B model combines usage-based or subscription software with services,
      which could support recurring or embedded workflow revenue if retention and
      gross margins are strong. The anti-thesis is equally material: the evidence is
      mostly historical, several customer and scale figures are company statements or
      secondary summaries, and current operating performance is not public. A private
      secondary-market profile says pricing charts require institutional access and
      reports no announced IPO plan; this limits liquidity and makes exit timing
      uncertain. The valuation case can improve only if current cohorts, margins,
      concentration, governance, and transaction terms corroborate the strategic
      narrative rather than merely repeating old fundraising milestones.
    claimRefs: [CV009, CV010, CV011, CV012, CV013, CV017, CV018]
    tableRefs: [TV002]
    figureRefs: [FV001]
  - id: scenarios-and-decision
    title: Scenarios, recommendation, and diligence gates
    body: >-
      A scenario approach is more defensible than a single point valuation because the
      public record lacks the revenue and margin denominator needed for a conventional
      SaaS multiple. In a bull case, verified recurring revenue growth, durable
      retention, improving margins, and clean preference terms could support the upper
      end of a negotiated range or a buy decision at a disciplined price. The base
      case is a track or research-more outcome: the business remains strategically
      relevant, but historical financing marks are not enough to prove present fair
      value. The bear case combines flat or declining cohorts, customer concentration,
      regulatory or data-use constraints, preference overhang, and a down-round or
      illiquid exit; those facts would require a material price reset or a pass. The
      immediate diligence gate is current financial and cap-table evidence, followed
      by customer retention and concentration data, legal and regulatory status, and
      a documented exit pathway.
    claimRefs: [CV008, CV015, CV017, CV018]
    tableRefs: [TV003]
callouts:
  - calloutType: recommendation
    title: Research-more pending price discovery
    body: Historical fundraising supports strategic relevance but does not establish a current fair value. Do not issue a buy recommendation until current financials, cap-table terms, and a defendable entry price are verified.
    claimRefs: [CV008, CV015]
  - calloutType: risk
    title: Valuation and liquidity uncertainty
    body: Public estimates range from $1.5 billion to $2.0 billion, while current secondary pricing, preference rights, and exit timing remain unresolved.
    claimRefs: [CV008, CV009, CV017, CV018]
tables:
  - id: TV001
    title: Recommendation summary
    columns: [Dimension, Assessment, Evidence basis, Decision implication]
    rows:
      - ["Recommendation", "research-more", "Historical financing is substantial but current price and operating denominator are not verified", "Obtain current data before investing"]
      - ["Confidence", "medium", "Financing history is corroborated across multiple retained sources", "Current financial disclosure is incomplete; keep the call conditional"]
      - ["Risk rating", "high", "Private-company liquidity, valuation conflict, and unknown preference or regulatory exposure", "Require downside protections"]
      - ["Valuation stance", "unknown", "$1.5B and $2.0B historical estimates use different sources and are not current marks", "Do not underwrite to either estimate"]
    notes: Historical financing and registry estimates are not a current fair-value appraisal; null or undisclosed operating inputs are not treated as zero.
    claimRefs: [CV002, CV007, CV008, CV009, CV015, CV017, CV018]
  - id: TV002
    title: Thesis and anti-thesis
    columns: [Argument, Supporting evidence, What would change the view, Investment implication]
    rows:
      - ["Mission-critical risk-control software", "AI and big-data anti-fraud and risk-control offerings are described for financial and enterprise users", "Verified retention and gross margin by product and cohort", "Strategic relevance supports further diligence"]
      - ["Repeat financing and institutional backing", "2016, 2017, and 2019 rounds involve multiple institutional or strategic investors", "Current investor references and latest preferred-share terms", "Historical validation is not a price signal"]
      - ["Commercial scale may support recurring revenue", "Sources report 7000 to 10000 customers and B2B usage or subscription models", "Audited revenue mix, ARR definition, renewal, and customer concentration", "Could support a higher-quality valuation method"]
      - ["Opaque valuation and liquidity are the anti-thesis", "Registry estimates conflict and no public stock price or IPO plan is reported", "Independent transaction evidence, cap table, exit plan, and governance review", "Maintain research-more or pass until resolved"]
    notes: Customer counts and business-model descriptions are historical or company-reported in the cited sources; they do not establish current ARR, retention, or profitability.
    claimRefs: [CV002, CV003, CV004, CV005, CV006, CV008, CV009, CV010, CV011, CV012, CV013, CV017, CV018]
  - id: TV003
    title: Bull / base / bear scenario table
    columns: [Scenario, Assumptions, Valuation or return logic, Key risks, Probability signal]
    rows:
      - ["Bull", "Current recurring revenue grows, retention is durable, margins improve, and preferences are clean", "Underwrite only after verified revenue and a negotiated entry price; upper end of a defensible range", "Data or terms fail verification", "Conditional upside case"]
      - ["Base", "Strategic relevance persists but current financials and price remain opaque", "Track or research-more rather than assign a point valuation", "Disclosure remains incomplete and liquidity is limited", "Most supportable public-evidence case"]
      - ["Bear", "Cohorts weaken, concentration or compliance costs rise, and preference or financing pressure creates a down-round", "Require a material price reset or pass; avoid relying on old marks", "Down-round, regulatory, and exit risks compound", "Material downside case"]
      - ["Diligence gate", "Obtain audited or management accounts, cap table, preference stack, cohort data, and exit plan", "Replace scenario bands with a revenue or comparable-company method after verification", "Missing evidence remains a blocker", "Required before an investable recommendation"]
    notes: No numeric valuation range is invented because current revenue, margin, share terms, and comparable-company inputs are not disclosed in the retained evidence.
    claimRefs: [CV008, CV015, CV017, CV018]
