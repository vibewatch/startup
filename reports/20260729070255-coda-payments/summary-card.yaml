summary:
  headline: >-
    Coda is a strategically differentiated gaming-native payments and commerce platform with real scale and useful
    post-Recharge optionality, but the stale US$2.5 billion anchor is only investable with pricing discipline because
    public disclosure on combined economics remains thin.
