  topStrengths:
    - >-
      Real strategic position at the intersection of gaming payments, merchant-of-record infrastructure,
      direct-to-consumer monetization, and localized checkout in difficult emerging markets.
    - >-
      Significant operating reach supported by 200M+ paying users, broad payment-channel coverage, and post-Recharge
      presence across 180+ markets.
    - Strong external validation from the 2022 US$690 million financing and continued unicorn-status tracking in 2025.
    - >-
      Recharge adds profitable prepaid scale, broader geographic coverage, and a more diversified digital- value product
      mix.
    - >-
      Regulatory and operational credibility improved through Singapore MPI licensing, ISO/IEC 27001, and a broader
      post-acquisition leadership bench.
  topRisks:
    - >-
      The valuation anchor is stale and unsupported by a fresh public financing event, making pricing highly sensitive
      to current but undisclosed economics.
    - >-
      Standalone 2024 public financials showed softer revenue and negative operating cash flow, while the combined
      group's pro forma is still missing.
    - >-
      Customer concentration, retention, product-level margins, and take rates remain publicly undisclosed, limiting
      confidence in moat and durability.
    - >-
      Policy, platform, and regulatory shifts around off-app monetization and payments licensing can change growth and
      compliance economics materially.
    - >-
      Recharge broadens the opportunity set but also increases integration, governance, and execution risk across
      products, jurisdictions, and legal entities.
  unresolvedGaps:
    - Combined 2025/2026 pro forma revenue, EBITDA, cash-flow, liquidity, and balance-sheet bridge after Recharge.
    - Product-level take rates, gross margins, and unit economics across Codapay, Codashop, webstores, and Recharge.
    - Top-customer concentration, renewal / churn behavior, and cohort quality by geography and product.
    - Current primary or secondary investor pricing that would confirm or reset the stale US$2.5 billion anchor.
    - Detailed regulatory-capital, legal-entity, and compliance map for the expanded combined group.
