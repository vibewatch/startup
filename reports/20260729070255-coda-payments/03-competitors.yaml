- id: switching-costs-multi-homing-and-moat-durability
  title: Switching costs, multi-homing, and moat durability
  body: Coda’s durability depends more on operational embed than on pure technical lock-in. A publisher that already relies on Coda for local payment routing, tax handling, fraud, customer support, and webstore or marketplace distribution will face real switching cost because it must rebuild compliance and checkout logic market by market. Yet this is still a multi-homing market. Stripe’s page openly frames processor pluralism as normal at scale, Xsolla argues publishers will combine traditional app stores with D2C, and Coda itself presents multiple integration models depending on buyer needs. That suggests the competitive equilibrium is not winner-take-all. Coda can be highly sticky when it becomes the operating layer for difficult markets, but publishers may still keep several processors, separate marketplace routes, or internal web assets. The moat is therefore strongest in emerging-market complexity, existing top-up traffic, and merchant-of-record execution discipline; it is weakest where
    a buyer only needs a generic checkout and enough engineering talent to assemble alternatives.
