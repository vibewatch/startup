- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Player
  - Public packaging signal
  - What buyer likely buys
  - Commercial strength
  - Commercial caveat
  rows:
  - - Coda
    - Custom partner sales plus public consumer pricing by market/game
    - MoR, localized checkout, webstores, marketplace reach, or distribution
    - Can bundle several monetization routes into one vendor
    - Enterprise pricing is not publicly transparent
  - - Xsolla
    - Solution modules such as Pay Station, Web Shop, Subscriptions, Rewards, Publishing Suite
    - Gaming payments and D2C commerce modules
    - Modular gaming-focused packaging
    - Public pricing not exposed on reviewed pages
  - - Stripe
    - Pay-as-you-go pricing starts at 2.9% + 30¢ per successful charge for standard online payments
    - Generic online payments and optimization tooling
    - Transparent entry pricing and strong developer adoption
    - Does not price the broader gaming operating burden Coda claims to absorb
  - - PayPal
    - Contact sales and platform-based checkout options
    - Checkout, wallets, installments, POS, invoices
    - Consumer trust and broad payment choice
    - Pricing and product fit depend on merchant configuration
  - - Global Payments
    - Solution-led sales across verticals
    - Enterprise acquiring and software
    - Scale and vertical coverage
    - Less legible for gaming-specific monetization needs
  - - Regional top-up peers
    - Transactional consumer pricing by game or voucher
    - Top-ups, vouchers, wallet value, or marketplace access
    - Easy consumer understanding and local familiarity
    - Publisher-side economics and operating responsibilities are less transparent
  notes: Because most gaming-monetization providers sell custom contracts, public packaging signals matter more than list-price precision.
