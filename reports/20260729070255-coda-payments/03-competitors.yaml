tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Category
  - Public scale / scope signal
  - Target customer
  - Key differentiation
  - Key limitation vs Coda
  rows:
  - - Coda Payments
    - Reference company
    - 400+ payment methods, 70+ markets in Codapay, 200M+ paying users, 300+ publishers
    - Game and digital-content publishers
    - Combines MoR, localized payments, webstores, marketplace demand, and distribution
    - Private-company disclosure is thinner than larger public processors
  - - Xsolla
    - Direct gaming-commerce peer
    - Payments, anti-fraud, web shops, subscriptions, rewards, cloud gaming, publishing suite
    - Game developers and publishers
    - Broadest like-for-like public product breadth in gaming D2C commerce
    - Less obvious owned consumer top-up brand in emerging markets than Codashop
  - - UniPin
    - Regional top-up and distribution peer
    - Game-voucher and digital-content top-up specialist
    - Publishers and consumers in Asia-led markets
    - Consumer top-up familiarity and regional gaming focus
    - Public evidence here is thinner on MoR depth and enterprise operating stack
  - - Razer Gold
    - Gaming wallet / prepaid ecosystem
    - Wallet and recharge brand tied to games and entertainment
    - Consumers and publishers in gaming ecosystem
    - Strong gamer brand and prepaid affinity
    - Less visibly positioned as a full merchant-of-record and publisher operating layer
  - - Garena / Sea
    - Ecosystem incumbent
    - Garena says it has a footprint across 160+ markets; Sea also operates digital finance
    - Gamers, communities, and ecosystem partners
    - Owns games, community, and adjacent financial-services rails within one group
    - Not a pure third-party monetization platform for all publishers
  - - SEAGM
    - Voucher and top-up marketplace
    - Broad catalog of vouchers, gift cards, and game credits with 24/7 support
    - Consumers seeking prepaid/top-up access
    - Marketplace breadth and voucher familiarity
    - Thinner publisher-side infrastructure story
  - - Itemku
    - Marketplace substitute
    - Large game-key, item, account, and gift-card marketplace in Indonesia
    - Consumers and merchants
    - Local marketplace liquidity and broad virtual-goods assortment
    - Marketplace model differs from enterprise monetization infrastructure
  - - Stripe
    - Horizontal PSP substitute
    - 100+ payment methods, 195+ countries, AI fraud and optimization
    - Merchants and platforms globally
    - Developer tooling, conversion optimization, enterprise scale
    - Not gaming-native and does not bundle marketplace/distribution surfaces
  - - PayPal
    - Horizontal network substitute
    - 400M users, 200+ markets, broad checkout and fraud tooling
    - Merchants and enterprise sellers
    - Massive consumer network and trust
    - No gaming-specific MoR/webstore/distribution narrative in reviewed surface
  - - Global Payments
    - Enterprise processor substitute
    - 100+ countries, 73B transactions yearly, 5M merchant accounts
    - Merchants, partners, and enterprises
    - Operational scale and acquiring infrastructure
    - Generic vertical coverage rather than gaming-specific monetization stack
  notes: The table separates like-for-like gaming-commerce peers from consumer wallet ecosystems and horizontal payment substitutes.
