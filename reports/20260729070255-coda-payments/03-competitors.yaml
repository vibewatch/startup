- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat or risk
  - Current direction
  - Public evidence
  - Implication for Coda
  - Diligence ask
  rows:
  - - Localized APM and MoR execution
    - Potential strength
    - Coda APAC/LATAM materials and Codapay positioning
    - Can be sticky in hard markets where local entities, tax, and FX matter
    - What share of volume depends on entity/licensing or tax infrastructure unique to Coda?
  - - Codashop demand surface
    - Potential strength
    - Codashop, Distribution, EA, and CODM materials
    - Marketplace traffic can differentiate Coda from pure processors
    - How much GMV or user acquisition actually comes from Codashop versus pure checkout routing?
  - - Xsolla D2C breadth
    - Risk
    - Xsolla solutions and D2C report
    - Direct peer already markets many of the same D2C building blocks
    - Where does Coda win deals head-to-head versus Xsolla and why?
  - - Horizontal processor scale
    - Risk
    - Stripe, PayPal, Global Payments official pages
    - Larger balance sheets and developer ecosystems can absorb simpler use cases
    - How often does Coda lose to “Stripe plus in-house build” rather than to a gaming-native rival?
  - - Regional top-up familiarity
    - Risk and validation
    - UniPin, Razer, SEAGM, Itemku surfaces
    - Shows consumers are comfortable buying outside app stores, but also fragments attention
    - Does Codashop have stronger repeat behavior than peer marketplaces in core countries?
  - - Multi-homing by publishers
    - Persistent risk
    - Coda, Xsolla, and Stripe all imply modular adoption
    - Even successful vendors may own only part of the stack
    - What percentage of top publishers use Coda as primary provider versus one rail among several?
  - - Ecosystem incumbents
    - Risk
    - Garena / Sea footprint and digital-finance adjacency
    - Some publishers may prefer ecosystems with built-in distribution and community
    - How often must Coda partner with, rather than displace, large gaming ecosystems?
  - - Disclosure gap
    - Risk
    - Private company metrics are selective and sometimes inconsistent
    - Makes true share, win rate, and retention harder to underwrite
    - Request head-to-head win/loss, NRR, and geography-level market-share data
  notes: The durability question is less about whether Coda has differentiation and more about whether that differentiation is large enough to resist modular substitution.
