  topStrengths:
    - Coda 卡在游戏支付、merchant-of-record 基础设施、DTC 变现和复杂新兴市场本地化结账的交汇处，战略位置真实。
    - 200M+ 付费用户、广泛支付渠道覆盖，以及收购 Recharge 后进入 180+ 市场，支撑了可观运营触达。
    - 2022 年 US$690 million 融资和 2025 年仍被追踪为独角兽，提供了强外部验证。
    - Recharge 带来盈利的预付规模、更广地理覆盖和更多元的数字价值产品组合。
    - Singapore MPI 牌照、ISO/IEC 27001 和收购后更厚的管理层梯队，提升了监管与运营可信度。
  topRisks:
    - 估值锚已经过时，又缺少新的公开融资事件支撑，因此定价高度依赖当前但未披露的经济性。
    - 独立口径 2024 年公开财务显示收入走弱、经营现金流为负，而合并集团备考口径仍缺位。
    - 客户集中度、留存、产品级利润率和抽佣率仍未公开，压低了对护城河和持续性的信心。
    - 围绕应用外变现和支付牌照的政策、平台与监管变化，可能实质改变增长和合规经济性。
    - Recharge 扩大了机会集，也让跨产品、司法辖区和法律实体的整合、治理与执行风险上升。
  unresolvedGaps:
    - 收购 Recharge 后合并口径 2025/2026 年备考收入、EBITDA、现金流、流动性和资产负债表桥接。
    - Codapay、Codashop、webstores 和 Recharge 的产品级抽佣率、毛利率和单位经济性。
    - 按地区和产品拆分的大客户集中度、续约 / 流失行为和队列质量。
    - 能确认或重置 US$2.5 billion 旧估值锚的当前一级或二级投资人定价。
    - 扩大后合并集团的详细监管资本、法律实体和合规地图。
