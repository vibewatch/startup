  headline: Coda 是战略差异化的游戏原生支付与商业平台，已跑出真实规模，并在收购 Recharge 后多了可选增长路径；但 US$2.5 billion 的旧估值锚只有在定价纪律足够强时才可投，因为合并后经济性公开披露仍薄。
