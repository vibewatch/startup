company:
  name: Coda Payments
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Coda is a Singapore-headquartered digital-content monetization and payments platform that started in
    Indonesia in 2011 and has since expanded from gaming top-ups into a broader merchant-of-record,
    webstore, and distribution stack. The strongest public positives are the company’s scale
    (300+ publishers, 200M+ users, 180+ markets after Recharge), the 2025 Recharge acquisition, and
    2026 Singapore MPI licensing; the main cautions are inconsistent public metrics across sources,
    thin direct disclosure on private valuation after 2022, and evidence from ACRA-based coverage that
    2024 revenue softened even as losses narrowed.
sections:
  - id: identity-origin-and-scale
    title: Identity, origin story, and present-day scale
    body: >-
      Coda’s official narrative is unusually consistent on the company’s original problem statement. The
      business says it began in Indonesia in 2011 because digital content purchases were effectively
      constrained to credit-card users even though card penetration was below 1% of the population.
      Founders Neil Davidson and Paul Leishman built a local-payments bridge to connect consumers to
      global online content, and the official story repeatedly frames that early emerging-markets pain
      point as the root of the company’s current product design. Over time the company extended that
      logic from game vouchers into Codapay, Codashop, Custom Commerce webstores, and distribution.
      Official 2025–2026 materials now describe Coda as a global out-of-app monetization and digital
      content distribution platform trusted by 300+ publishers, serving more than 200 million paying
      users, spanning more than 400 payment channels, and — after Recharge — operating across 180+
      markets. The caution is not whether the company has scale, but which exact scale number is most
      current: official pages variously cite 120M+ active users in 2024, 200M+ paying users, 2B+
      processed transactions, 400+ to 600+ employees, and 70+ or 80+ markets depending on product and
      date. That pattern suggests a fast-changing business with real growth, but one whose public metric
      surface is not perfectly harmonized across pages.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008, CO009, CO010, CO011, CO012]
    tableRefs: [TO001]
    figureRefs: [FO003]
  - id: leadership-governance-and-operating-bench
    title: Leadership transition, governance visibility, and operating bench
    body: >-
      Public materials make clear that Shane Happach is the current chief executive officer, while Neil
      Davidson remains a central founder figure and public strategic voice. The 2026 leadership update
      also shows the company still reworking its post-Recharge operating model: long-time CFO Abhi
      Sharma moved into a broader COO remit covering operations, payments, fraud, legal, compliance, and
      corporate development, while former Recharge CFO Freddy Dijkman became group CFO from Amsterdam.
      Those appointments are meaningful because they show Coda trying to integrate a more regulated,
      geographically broader business rather than merely bolting on a consumer asset. The public bench is
      therefore stronger than a simple gaming-payments startup archetype would suggest. At the same time,
      governance visibility is limited. Official surfaces do not publish a full board map, ownership
      percentages, or a complete historical leadership timeline, and at least one third-party tracker
      still names Neil Davidson as CEO despite official evidence that Shane Happach leads the company.
      That discrepancy is not fatal, but it is a useful reminder that private-company databases around
      Coda lag the company’s current state and should be treated as secondary rather than canonical.
    claimRefs: [CO013, CO014, CO015, CO016, CO017, CO018, CO019, CO020, CO021, CO022]
    tableRefs: [TO002]
    figureRefs: [FO002]
  - id: capital-base-financial-disclosure-and-regulatory-credibility
    title: Capital base, disclosure quality, and regulatory credibility
    body: >-
      The most concrete public capital marker remains the April 2022 minority-stake transaction, where
      Smash Capital, Insight Partners, and GIC invested US$690 million and existing investor Apis
      retained equity. Third-party trackers still peg that round at roughly a US$2.5 billion valuation,
      which is directionally consistent with Coda’s continuing inclusion in 2025 unicorn rankings, but
      the company itself does not publicly restate a post-2022 valuation. The newer and more decision-
      useful evidence is operational and regulatory. In May 2026, Coda announced that its Singapore
      entity secured a full Major Payment Institution licence, allowing merchant acquisition plus domestic
      and cross-border transfers under the Payment Services Act. In late 2025, it also announced
      ISO/IEC 27001 certification and a BSI Mark of Trust. Those milestones strengthen the case that Coda
      is evolving from a growth-stage gaming enabler into a more institutionally credible regulated
      payments platform. The adverse counterweight comes from 2024 ACRA-based financial coverage: revenue
      slipped modestly, losses narrowed but remained negative, and operating cash burn increased. That
      does not undermine the platform, but it does mean the public record supports “scaled but still
      tightening economics” more than “fully mature cash machine.”
    claimRefs: [CO023, CO024, CO025, CO026, CO027, CO028, CO029, CO030, CO031, CO032, CO033, CO034]
    tableRefs: [TO003]
  - id: milestone-map-and-strategic-trajectory
    title: Strategic milestones and what changed after Recharge
    body: >-
      Coda’s strategic trajectory has three visible phases. First came the emerging-markets payments
      bridge: the 2011 Indonesia founding story, Codashop’s later launch, and Codapay’s API-led
      expansion. Second came scale-up and institutionalization: the 2022 US$690 million growth round,
      broader merchant-of-record positioning, and continuing publisher penetration across gaming. Third
      came diversification and consolidation: the 2025 Recharge acquisition, post-deal executive changes,
      and 2026 expansion of regulatory and security credentials. Recharge matters because it pulled Coda
      beyond core gaming into prepaid value distribution, gift cards, and European consumer storefronts,
      while adding a profitable direct-to-consumer business with 16,000+ products and 1,000+ brands.
      Partnerships with Unity and Digital Garage then extended the story further into game-developer
      tooling and Japanese distribution infrastructure. The bullish reading is that Coda is using gaming
      as a wedge into a larger digital-commerce and prepaid ecosystem. The cautious reading is that the
      business now spans more products, more jurisdictions, and more execution surfaces than its earlier
      story implied, which raises the burden on integration, compliance, and capital discipline.
    claimRefs: [CO035, CO036, CO037, CO038, CO039, CO040, CO041, CO042, CO043, CO044, CO045]
    tableRefs: [TO004]
    figureRefs: [FO001]
