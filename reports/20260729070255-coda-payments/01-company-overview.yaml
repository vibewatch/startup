          detail: Coda handles payments, tax, fraud, compliance, and support.
        - id: n3
          label: Publisher monetization products
          detail: Codapay, Codashop, Custom Commerce, and Distribution create multiple routes to revenue.
        - id: n4
          label: Consumer demand engine
          detail: Millions of gamers and 200M+ paying users create reach and repeat purchase potential.
        - id: n5
