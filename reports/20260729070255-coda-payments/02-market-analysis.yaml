- id: TM003
  title: Segment / buyer map
  columns:
  - Segment
  - Budget owner
  - User / payer pattern
  - Why localization matters
  - Adoption path
  rows:
  - - Mobile game publishers
    - Monetization, payments, and live-ops leaders
    - Players pay via wallets, bank transfers, cards, carrier billing, and app stores
    - Mobile-first markets often prefer APMs over cards
    - Start with marketplace or hosted checkout, then expand to D2C webstore
  - - PC / cross-platform publishers
    - Commerce and payments teams
    - Players buy direct bundles, subscriptions, or top-ups outside app stores
    - Need multicurrency pricing and local methods for global web traffic
    - Often pair owned storefronts with PSP / MoR support
  - - Live-service and creator-economy platforms
    - Revenue, partnerships, and payout teams
    - Two-sided flows include top-ups, subscriptions, and sometimes payouts
    - Need local pay-ins, fraud control, and faster settlements
    - Adoption rises as off-app channels become strategically important
  - - Prepaid brands and gift-card distributors
    - Business-development and channel leaders
    - Consumers redeem or purchase stored value using local payment methods
    - Distribution and compliance vary by country and brand
    - Recharge-style platforms add B2C and B2B prepaid routes
  - - Players in APAC, LATAM, and MENA
    - Consumers themselves drive method choice
    - Wallets, bank transfers, cash-linked rails, and local habits vary sharply by region
    - Wrong method mix depresses conversion and trust
    - Demand appears only when a trusted local flow is surfaced
  notes: The buyer is usually the publisher, but the user-side payment habit determines conversion and therefore vendor selection.
  claimRefs:
  - CM010
  - CM011
  - CM020
  - CM021
  - CM023
  - CM029
  - CM033
- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Factor
  - Type
  - Evidence
  - Why it matters
  - Constraint / diligence implication
  rows:
  - - App-store disintermediation
    - driver
    - BCG, Epic-v-Google, and Apple DMA materials
    - Creates room for owned-channel commerce and better margin capture
    - Timing remains jurisdiction-specific and policy-led
  - - Localized APM demand
    - driver
    - Coda APAC/LATAM and payment-processing guides
    - Improves conversion where cards are not dominant
    - Requires many integrations and localized support
  - - D2C economics
    - driver
    - Xsolla and Coda MoR materials
    - 10%-20% net savings and richer customer ownership can justify off-app investment
    - Publishers still absorb ops complexity if they build alone
  - - Emerging-market gaming growth
    - driver
    - Coda APAC/LATAM guides and BCG market work
    - Fast-growing player bases expand the pool of monetizable users
    - Growth is paired with FX, tax, and fraud risk
  - - Fraud escalation
    - constraint
    - Coda fraud, APAC, and LATAM materials
    - Raises the need for ML-based screening and chargeback management
    - Execution quality matters as much as payment breadth
  - - Regulatory fragmentation
    - constraint
    - Coda APAC/LATAM and global-expansion guides
    - Creates demand for MoR structures and local entity coverage
    - Also raises compliance cost and failure risk
  - - Currency / settlement complexity
    - constraint
    - Coda APAC and fastest-growing-economies materials
    - Affects repatriation, payout timing, and margin quality
    - Can trap earnings or require local entities
  - - Horizontal PSP substitution
    - constraint
    - Stripe and PayPal official product surfaces
    - Generic processors can satisfy simpler merchants
    - Coda must prove gaming-specific ROI beyond commodity acceptance
  notes: The same frictions that create demand for merchant-of-record platforms also limit adoption speed and compress execution quality for weaker vendors.
