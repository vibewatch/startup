- id: constraints-why-this-market-is-attractive-but-operationally-hard
  title: 'Constraints: regulation, fraud, FX, and policy timing keep the market hard'
  body: 'The market is attractive precisely because it is operationally messy. Coda’s APAC and LATAM guides emphasize constantly shifting tax and licensing requirements, domestic-currency settlement hurdles, and fragmented local payment preferences. The same materials frame fraud as a material cost center: APAC fraud rose 24% from 2022 to 2023 in Coda’s cited framing, while Brazil alone saw digital fraud rise 65% in 2023 according to the LATAM guide. BCG’s market work adds a macro caution: more than 75% of surveyed gamers say prices affect purchase choices, and cloud gaming still has a usage-concentration gap even though trial and satisfaction are high. Policy also opens unevenly. App-store rulings and DMA-related changes create more room for off-app checkout, but they do not eliminate the need for local legal, tax, and payment execution. Horizontal processors such as Stripe and PayPal remain important substitutes, yet Coda’s market pitch is that gaming publishers still need a heavier operating
    layer than a generic PSP usually provides. For diligence, the implication is clear: the addressable market is real, but winning it requires regulatory execution and anti-fraud competence, not just more payment rails.'
