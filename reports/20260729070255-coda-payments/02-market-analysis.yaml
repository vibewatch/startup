company:
  name: Coda Payments
chapter:
  number: 2
  title: Market Analysis
  summary: 'Coda operates at the intersection of gaming monetization, merchant-of-record infrastructure, alternative payment methods, and prepaid digital-value distribution. The attractive part of the market is structural: mobile gaming remains half of global gaming revenue, D2C revenue is outgrowing the broader mobile market, and emerging regions such as APAC and LATAM still require localized payment and compliance tooling. The caution is that this is not a clean single TAM; adoption depends on regulation, fraud control, FX and tax operations, and the slow opening of app-store rules.'
sections:
- id: market-boundary-and-where-coda-sits
  title: 'Market boundary: Coda is not “all gaming,” but the commerce layer around global digital spend'
  body: 'Coda’s relevant market is narrower than global gaming content spend and broader than a simple payment-gateway niche. The company sits inside the commerce infrastructure layer that helps publishers monetize digital goods through local payment methods, merchant-of-record services, direct-to-consumer webstores, and marketplace/distribution channels. Its own product pages frame Codapay as payment-method access, Codashop as existing marketplace demand, Custom Webstore as a D2C storefront product, and Distribution as another route to user reach. That means the practical budget Coda competes for comes from publisher payments, monetization, tax/compliance, fraud, and app-store-margin optimization budgets rather than from game-development budgets themselves. The adjacent market became materially broader after Recharge, because prepaid gift cards, top-ups, and stored-value distribution add another consumer-payments and digital-value lane beyond core game credits. This boundary matters for
    diligence: a headline such as “global gaming revenue” is only an outer demand pool, while Coda’s true addressable opportunity depends on which publishers need localized checkout, regulatory cover, and owned-channel monetization rather than pure PSP processing.'
