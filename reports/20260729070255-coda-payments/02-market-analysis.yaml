tables:
- id: TM001
  title: Market definition table
  columns:
  - Segment / category
  - Included spend
  - Excluded spend
  - Buyer / payer
  - Relevance
  rows:
  - - Gaming D2C / webstore commerce
    - Digital goods sold through publisher-owned or Coda-built storefronts, including top-ups, passes, and event bundles
    - Game development budgets, console hardware, ad-only monetization
    - Game publishers; end players pay
    - Core wedge for Custom Webstore and Unity-enabled owned-channel commerce
  - - Merchant-of-record for digital goods
    - Payment processing plus tax, compliance, fraud, chargebacks, FX, settlement, and support
    - Generic PSP-only acceptance without operational assumption of seller duties
    - Publishers and digital merchants
    - Core value proposition where Coda says it removes cross-border operating burden
  - - Localized payment-method aggregation
    - Cards, wallets, bank transfers, carrier billing, and local APM coverage in gaming checkouts
    - Offline cash retail networks not digitally integrated, or pure bank acquiring without gaming context
    - Publishers and players
    - Drives conversion in fragmented payment markets
  - - Marketplace / distribution demand
    - Codashop and distribution traffic that gives publishers discovery and reach in local markets
    - Broader game discovery through app stores or media buys
    - Publishers; players pay via marketplace
    - Useful for fast market entry when a publisher lacks its own local presence
  - - Prepaid digital-value distribution
    - Gift cards, mobile top-up, prepaid payment cards, and digital stored-value products via Recharge
    - Physical retail distribution unrelated to digital checkout
    - Brands, service providers, and consumers
    - Adjacency that broadened Coda beyond pure gaming payments after Recharge
  - - Status-quo substitute stack
    - App-store billing, internal build, horizontal PSPs, and competitor gaming-commerce vendors
    - Game-engine spend and content production costs
    - Publishers already funding incumbent payment workflows
    - Defines what Coda must displace to win budgets
  notes: Rows define adjacent budget pools and substitutes; they are not additive TAM categories.
