  - id: TP004
    title: 护城河耐久性 / 竞争风险台账
    columns:
      - 护城河或风险
      - 当前方向
      - 公开证据
      - 对 Coda 的含义
      - 尽调问题
    rows:
      - - 本地化 APM 与 MoR 执行
        - 潜在优势
        - Coda APAC/LATAM 材料和 Codapay 定位
        - 在本地实体、税务和外汇都关键的困难市场，可能具备粘性
        - 有多少交易量依赖 Coda 独有的实体 / 牌照或税务基础设施？
      - - Codashop 需求触点
        - 潜在优势
        - Codashop、Distribution、EA 和 CODM 材料
        - 市场流量能让 Coda 区别于纯处理商
        - GMV 或获客中，究竟有多少来自 Codashop，而不是单纯结账路由？
      - - Xsolla D2C 宽度
        - 风险
        - Xsolla 解决方案和 D2C 报告
        - 直接同业已经营销许多相同的 D2C 组件
        - Coda 在哪些场景正面赢下 Xsolla，为什么？
      - - 横向处理商规模
        - 风险
        - Stripe、PayPal、Global Payments 官方页面
        - 更大资产负债表和开发者生态能吸收更简单用例
        - Coda 有多常输给「Stripe 加自建」，而不是输给游戏原生竞争对手？
      - - 区域充值熟悉度
        - 风险和验证
        - UniPin、Razer、SEAGM、Itemku 页面
        - 说明消费者习惯在应用商店外购买，但也分散注意力
        - 在核心国家，Codashop 的复购行为是否强于同业市场？
      - - 发行商多宿主
        - 持续风险
        - Coda、Xsolla 和 Stripe 都暗示模块化采用
        - 即便供应商成功，也可能只拥有栈的一部分
        - 头部发行商中，有多少比例把 Coda 作为主要供应商，而不是多条通道之一？
      - - 生态既有玩家
        - 风险
        - Garena / Sea 足迹和数字金融相邻业务
        - 有些发行商可能偏好内置分销和社区的生态
        - Coda 有多常需要与大型游戏生态合作，而不是取代它们？
      - - 披露缺口
        - 风险
        - 私营公司指标选择性披露，有时不一致
        - 真实份额、赢率和留存更难支撑投资判断
        - 要求提供正面对决胜负记录、NRR 和地理市场份额数据
    notes: 耐久性问题不在于 Coda 是否有差异化，而在于差异化是否足够大，能顶住模块化替代。
