      - number: '3.2'
        title: Coda 强于通用处理商的地方
        blocks:
          - type: paragraph
            body: >-
              Coda 最强的定位围绕游戏专属复杂度。其材料反复把 Codapay、Codashop、Custom Webstore、Distribution 和商户记录方职责连在一起；APAC 与 LATAM
              指南则强调本地实体、税款代缴、外汇、欺诈和替代支付方式。这个主张比 Stripe、PayPal 或 Global Payments 官方产品页面更重；后者强调的是通用商务中的收款广度、转化和企业规模。Stripe
              在开发者体验、优化和全球触达上尤其强，PayPal 也因消费者网络和品牌信任而难以撼动。但本报告审阅的公开页面没有显示这些公司把应用外游戏店铺、充值市场和发行商分发引擎包装成一个品类叙事。因此，Coda
              的竞争方式是降低游戏发行商的编排负担，而不是声称自己拥有全球最广的企业支付平台。
