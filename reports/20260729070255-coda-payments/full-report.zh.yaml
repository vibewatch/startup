            body: >-
              基于本报告保留的证据，最公平的立场是建设性但有条件。Coda 比商品化 PSP 更有战略差异，比典型独角兽故事更有商业证明，也因 Recharge
              而比收购前更有意思。但缺少干净的合并备考报表、集中度数据、队列指标和合同经济性，意味着投资人不应为公司最佳叙事所暗示的任何价格买单。合理做法是盯住 2022-2025
              年私有锚，再从披露缺口出发谈判，而不是从头条用户数出发。因此，建议是中等置信、估值敏感：如果入场价不高于可辩护基准情景，就继续尽调；但不要追逐一个假设整合完美、经济性达到公开市场质量却没有数据证明的溢价。换句话说，只有价格为缺失答案留出空间时，才值得向这个名字倾斜；如果管理层能补上披露缺口，上行仍可信，但在那之前，举证责任留在卖方。
