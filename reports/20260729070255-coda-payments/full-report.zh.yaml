  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑和反向逻辑取决于规模与披露质量的取舍
        blocks:
          - type: paragraph
            body: >-
              Coda 的乐观情景很直接。公开证据显示，公司解决了游戏和数字商务中的真实痛点，扩展到数百家发行商和数亿用户，完成 2022 年大型成长轮，在 2025 年追踪中维持独角兽地位，并在 2025 年加入
              Recharge 的盈利预付费平台。悲观情景同样直接：公开中最硬的财务数字仍显示，独立公司 2024 年收入小幅下滑、经营现金流为负，且费率、集中度或交割后整合经济性透明度有限。这意味着 Coda
              既不是概念型投机公司，也不是披露充分的可比上市公司。它处在中间：战略上有吸引力，商业上已被证明，但估值敏感，因为信心必须跨过大量缺失细节。这个中间状态影响估值机制：投资人同时承销业务质量和报告风险，因此合理入场价与过高入场价之间的价差，会比一家同等规模的上市公司更宽。
