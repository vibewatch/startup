      - number: '1.3'
        title: 资本基础、披露质量与监管可信度
        blocks:
          - type: paragraph
            body: >-
              最具体的公开资本标记仍是 2022 年 4 月的少数股权交易，Smash Capital、Insight Partners 和 GIC 投入 US$690 million，存量投资者 Apis
              保留股权。第三方追踪仍把该轮估值锚定在约 US$2.5 billion，与 Coda 继续进入 2025 年独角兽榜单的方向一致，但公司本身没有公开重述 2022
              年后的估值。更新、更有决策价值的证据来自运营和监管。2026 年 5 月，Coda 宣布其新加坡实体取得完整 Major Payment Institution 牌照，可在 Payment Services
              Act 下开展商户收单以及境内和跨境转账。2025 年末，公司还宣布通过 ISO/IEC 27001 认证并获得 BSI Mark of Trust。这些里程碑强化了一点：Coda
              正从成长期游戏赋能平台，演进为更具机构可信度的受监管支付平台。反向砝码来自 2024 年基于 ACRA
              的财务报道：收入小幅下滑，亏损收窄但仍为负，经营现金消耗增加。这不削弱平台本身，但意味着公开记录更支持“规模已成、经济性仍在收紧”，而不是“完全成熟的现金机器”。
