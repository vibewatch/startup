        - 玩家、社区和生态合作伙伴
        - 一个集团内拥有游戏、社区和相邻金融服务通道
        - 不是面向所有发行商的纯第三方变现平台
      - - SEAGM
        - 券码和充值市场
        - 有广泛券码、礼品卡和游戏点数目录，并提供 24/7 支持
        - 寻求预付 / 充值入口的消费者
        - 市场宽度和券码认知
        - 发行商侧基础设施叙事较薄
      - - Itemku
        - 市场替代方案
        - 印尼大型游戏密钥、道具、账号和礼品卡市场
        - 消费者和商户
        - 本地市场流动性和广泛虚拟商品供给
        - 市场模式不同于企业级变现基础设施
      - - Stripe
        - 横向 PSP 替代
        - 100+ 支付方式、195+ 国家，AI 欺诈与优化
        - 全球商户和平台
        - 开发者工具、转化优化、企业规模
        - 非游戏原生，也不打包市场 / 分销界面
      - - PayPal
        - 横向网络替代
