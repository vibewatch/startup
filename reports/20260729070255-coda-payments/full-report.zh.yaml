  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：Coda 不是“全部游戏市场”，而是全球数字消费周边的商务层
        blocks:
          - type: paragraph
            body: >-
              Coda 的相关市场窄于全球游戏内容支出，也宽于单一支付网关利基。公司位于商务基础设施层，帮助发行商用本地支付方式、商户记录方服务、D2C 网页商店和市场 / 分发渠道，将数字商品变现。Coda 自己的产品页面把
              Codapay 定位为支付方式接入，把 Codashop 定位为既有市场需求，把 Custom Webstore 定位为 D2C 店铺产品，把 Distribution 定位为另一条触达用户的路径。这意味着
              Coda 实际竞争的预算，来自发行商的支付、变现、税务 / 合规、欺诈和应用商店抽成优化预算，而不是游戏开发预算本身。Recharge
              之后，相邻市场明显变宽，因为预付礼品卡、充值和储值分发，在核心游戏点数之外又增加了一条消费者支付和数字价值通道。这个边界对尽调很重要：“全球游戏收入”这样的标题只是外围需求池，Coda
              真正可触达的机会，取决于哪些发行商需要本地化结账、监管覆盖和自有渠道变现，而不只是纯 PSP 处理。
