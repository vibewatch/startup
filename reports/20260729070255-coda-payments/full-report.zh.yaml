      - number: '2.3'
        title: 买方和用户动态有利于本地化、合规外包与自有渠道
        blocks:
          - type: paragraph
            body: >-
              核心企业买方是游戏或数字内容发行商，他们要在速度、控制权和利润率之间取舍。Coda
              的材料反复强调，发行商不只是需要收款；他们需要本地支付方式覆盖、结账优化、税务处理、欺诈工具和更快上市路径。用户侧动态也随地区变化。Coda 认为在
              APAC，替代支付方式占主导，因为东南亚大量人群没有银行账户或银行服务不足，钱包使用又很普遍。在 LATAM，PIX、OXXO、PSE、Mercado Pago 和本地税务流程形成类似的本地化模式。Coda
              自己基于交易的区域快照称，电子钱包主导亚洲和 MENA，银行转账主导美洲和欧洲，运营商代扣在亚洲保留小众优势。因此 D2C
              商务具有战略意义：发行商如果能把自有店铺和本地化支付结合起来，就能保留更多经济性，直接获得玩家数据，也不用等待单一平台账单栈把每个地区都同等解决。市场因此奖励把买方简单性和用户本地相关性合在一起的平台。
