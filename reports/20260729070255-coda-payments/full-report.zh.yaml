      - number: '5.4'
        title: 路线图、依赖项与复杂度可能断裂的地方
        blocks:
          - type: paragraph
            body: >-
              近期发布显示，Coda 正更深切入应用外变现、订阅、经常性支付和监管变化驱动的商务。Unity 集成、Google Play 政策更新、Apple DMA
              更新和经常性支付博客都指向一条路线图：外部平台政策变化与内部功能构想同样塑造产品。这在战略上有吸引力，因为应用商店开放可以扩大 Coda 的界面；它也是依赖项，因为政策落地会因地区和平台而不同。Recharge
              的新平台架构和支付机构申请，又在预付费侧增加复杂度。公开层面，Coda 把这些描述为动能；但尽调应看到整合负担：目录同步、认证、重定向、沙盒 /
              生产环境隔离、提供商路由规则、本地支付方式维护、法律页面维护和支持运营，都必须一起跑稳。产品之所以有价值，正是因为它吸收了这些复杂度；风险则在于，如果管理不够紧，这些复杂度也会侵蚀利润率或可靠性。对投资人而言，产品问题不只是功能迭代速度，而是随着范围扩大，技术栈能否让政策适配、支持质量和本地化可靠性保持同步。
