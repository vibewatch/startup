      - number: '2.2'
        title: 规模测算显示需求有吸引力，但各口径不能相加
        blocks:
          - type: paragraph
            body: >-
              保留的公开资料支持几个有用的市场视角，但不能拼出一个可辩护的单一数字 TAM 来代表游戏商户记录方平台。BCG 2026 年游戏报告称，移动端占全球游戏收入的 50%，云游戏收入可能从 2025 年约
              US$1.4 billion 增至 2030 年约 US$18.3 billion，Fortnite 和 Roblox 两个平台的 UGC 分成在 2025 年应超过 US$1.5 billion。Xsolla
              给出一个更偏变现的视角：2025 年整体移动游戏增长只有 0.2%，但 D2C 收入增长 26%，前 100 大移动游戏的 D2C 收益同比增长 38%。Coda 自己的区域材料称，APAC 2023 年贡献超过
              US$84 billion 游戏收入、拥有 1.48 billion 玩家；其 LATAM 指南则引用到 2030 年 US$16 billion 的市场和超过 619 million 人口基数。Recharge
              又贡献了相邻的预付费分发视角：16,000+ 产品、1,000+ 品牌，并覆盖 180+ 国家。合在一起，这些数字支持“庞大且结构性扩张的商务机会”，但应把它们看作分层需求指标，而不是相加成一个虚假精确数字。
