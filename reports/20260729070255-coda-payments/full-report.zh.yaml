            body: >-
              Recharge 实质改变了合并集团的财务形态。其 2025 年 6 月披露称，2024 年总销售额增长 39% 至 €695 million，净收入增长 32% 至 €73.6 million，EBITDA
              翻倍至 €8.1 million，净利润达到 €7.5 million。2025 年 1 月的一份公告称，Recharge 还从 ABN AMRO 获得 €45 million 授信，并瞄准 2025 年超过
              €1 billion 的销售额。这些事实重要，因为它们补上了 Coda 独立 2024 年记录无法完全证明的三件事：有利润的规模、用于 M&A 的明确外部融资能力，以及从核心游戏点卡走向更广预付费产品和 B2B
              奖励的相邻性。风险在于，不能简单把 Coda 2024 年数字和 Recharge 2024
              年数字相加，然后称为一个口径统一的备考报表；来源使用的定义、币种和时间点不同。即便如此，如果整合执行到位，这笔收购在收入组合质量上看起来具有财务增厚性。
