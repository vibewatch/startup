            body: >-
              公开可比集合显示，支付行业估值区间可以很宽。截至 2026 年 7 月下旬，PayPal 和 Adyen 的市值远大于 Coda 最后的私有估值锚；Shift4 和 Payoneer
              更接近低个位数十亿美元，Paysafe 则低得多。这些企业不是完美可比对象——有些是更广的处理商，有些软件属性更强，有些拥有更强消费者网络，有些增长更低或承受更重公开市场怀疑。但它们建立了一条有用边界：Coda
              的 US$2.5 billion 私有参考值，已经高于部分上市支付平台、低于规模化龙头，这意味着举证责任很高。若投资人相信 Coda 的新兴市场游戏专精、D2C 可选性和 Recharge
              组合切换，会带来优于落后上市可比公司的增长或利润率形态，私有溢价可以成立。它不能只靠具名客户数量或市场数量成立。
