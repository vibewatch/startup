  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险是核心问题，不是附带事项
        blocks:
          - type: paragraph
            body: >-
              Coda 在新加坡取得大型支付机构地位，并且把自身定位为商户记录方，使监管成为核心业务风险，而不是背景里的法律脚注。Payment Services Act
              覆盖支付服务提供商牌照、商业行为、大型支付机构、审计和支付系统监督。MAS 对该法的公开解释强调七类受监管支付服务，包括商户收单以及境内和跨境汇款。这很重要，因为 Coda
              的价值主张明确触及商户收单、跨境结算和本地化支付。公开来源还显示，公司持续跟踪外部平台规则，例如 Google Play 应用外支付变化和 Apple DMA 驱动更新。风险不只是违规；随着 Coda
              扩大产品界面和司法辖区，监管范围、资本要求、KYC/AML 预期、应用商店政策和客户救济责任都会扩张。因此，投资人应把监管解释视为不断变化的运营参数，而不是管理层一次性打勾的事项。
