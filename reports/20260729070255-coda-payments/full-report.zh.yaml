      - number: '1.4'
        title: 战略里程碑与 Recharge 后发生的变化
        blocks:
          - type: paragraph
            body: >-
              Coda 的战略轨迹有三个清晰阶段。第一阶段是新兴市场支付桥梁：2011 年印度尼西亚创立故事、Codashop 后续上线，以及 Codapay 以 API 带动扩张。第二阶段是扩规模和机构化：2022 年
              US$690 million 成长轮、更广的商户记录方定位，以及在游戏发行商中的持续渗透。第三阶段是多元化和整合：2025 年收购 Recharge、交易后高管调整，以及 2026
              年监管和安全资质扩展。Recharge 重要，是因为它把 Coda 从核心游戏带入预付价值分发、礼品卡和欧洲消费者店铺，同时加入一个有利润的 D2C 业务，拥有 16,000+ 产品和 1,000+ 品牌。与
              Unity 和 Digital Garage 的合作又把故事延伸到游戏开发者工具和日本分发基础设施。乐观解读是，Coda
              正把游戏作为楔子，切入更大的数字商务和预付费生态。谨慎解读是，业务现在覆盖更多产品、更多司法辖区和更多执行界面，超出了早期故事的复杂度，也提高了整合、合规和资本纪律的要求。
