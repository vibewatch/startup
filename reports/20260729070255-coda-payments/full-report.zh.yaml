        - 玩家通过钱包、银行转账、银行卡、运营商计费和应用商店付款
        - 移动优先市场往往更偏好 APM，而不是银行卡
        - 先用市场平台或托管结账，再扩展到 D2C 网店
      - - PC / 跨平台发行商
        - 商务和支付团队
        - 玩家在应用商店外直接购买礼包、订阅或充值
        - 全球网页流量需要多币种定价和本地支付方式
        - 通常把自有店面与 PSP / MoR 支持配套使用
      - - 长线运营和创作者经济平台
        - 收入、合作伙伴和分账团队
        - 双边资金流包括充值、订阅，有时还包括分账
        - 需要本地收款、欺诈控制和更快结算
        - 应用外渠道具备战略价值后，采用率会上升
      - - 预付品牌和礼品卡分销商
        - 商务拓展和渠道负责人
        - 消费者用本地支付方式兑换或购买储值
        - 分销和合规因国家、品牌而异
        - Recharge 这类平台增加 B2C 和 B2B 预付路径
      - - APAC、LATAM 和 MENA 玩家
        - 支付方式由消费者自己决定
        - 钱包、银行转账、现金关联支付通道和本地习惯按地区高度分化
        - 支付方式组合选错，会压低转化和信任
        - 只有露出可信的本地流程，需求才会出现
    notes: 买方通常是发行商，但用户侧支付习惯决定转化，因此也决定供应商选择。
