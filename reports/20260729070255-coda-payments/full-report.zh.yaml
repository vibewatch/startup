      - number: '2.4'
        title: 约束：监管、欺诈、外汇和政策节奏让市场始终难做
        blocks:
          - type: paragraph
            body: >-
              这个市场有吸引力，恰恰因为运营上很乱。Coda 的 APAC 和 LATAM 指南强调，税务和牌照要求不断变化，本币结算有障碍，本地支付偏好也很碎片化。同一批材料把欺诈描述为重要成本中心：按 Coda
              引用的口径，APAC 欺诈从 2022 到 2023 年上升 24%；LATAM 指南称，仅巴西 2023 年数字欺诈就上升 65%。BCG 的市场研究又加入宏观提醒：超过 75%
              受访玩家称价格会影响购买选择；云游戏虽然试用率和满意度高，但仍存在使用集中度缺口。政策开放也不均匀。应用商店判决和 DMA
              相关变化为应用外结账创造更多空间，但并没有消除本地法律、税务和支付执行需求。Stripe、PayPal 等横向处理商仍是重要替代品，但 Coda 的市场主张是：游戏发行商通常需要比通用 PSP
              更重的运营层。对尽调而言，含义很清楚：可触达市场真实存在，但赢下来靠监管执行和反欺诈能力，而不只是更多支付轨道。
