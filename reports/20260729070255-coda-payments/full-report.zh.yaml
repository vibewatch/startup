  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局：Coda 面对直接同行、钱包生态和横向处理商
        blocks:
          - type: paragraph
            body: >-
              Coda 周边的竞争集合可分三层。第一层是最接近的游戏商务同行，尤其是 Xsolla，其次是 UniPin，因为它们同样把游戏专用收款与 D2C 店铺工具、面向发行商的市场拓展支持结合起来。第二层是 Razer
              Gold、SEAGM、Itemku 以及 Garena 相邻分发模式等游戏钱包和充值生态。它们未必提供同样的商户记录方技术栈，却会争夺消费者支付注意力和发行商分发预算。第三层是
              Stripe、PayPal、Global
              Payments，以及许多商户栈背后的收单合作伙伴等横向处理商。这些处理商不是游戏原生，但凭借广度、规模、开发者工具和全球触达，对于只需要收款和欺诈工具、不需要完整商务运营层的发行商，仍是可信替代。也就是说，Coda
              很少靠单一功能取胜；只有当发行商看重本地支付覆盖、应用外商务、合规外包和既有玩家需求界面的一体化打包时，Coda 才能胜出。
