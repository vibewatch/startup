            body: >-
              最强的具名客户证据来自案例研究和上线公告。EA 的 FC Mobile 网页商店上线显示，Coda 支撑了一个覆盖 60 个市场的商店，随后又扩展到一长串国家。Call of Duty Mobile
              网页商店公告展示了类似逻辑：独家优惠、奖励点数，以及面向一款全球大作的替代购买目的地。Lumen Pixel 提供了中型发行商侧的证明：Codapay
              在韩国和东南亚扩大支付覆盖，据报道数周内完成接入。Worldpay 客户故事则给出另一角度，点名 Coda 是商户记录方客户，服务 Activision 和 EA 等发行商。Impact
              案例研究增加了需求生成层，显示合作渠道显著提高了来自新用户和回流用户的收入。合在一起，这些来源支持一个判断：Coda 的客户证明并非假设，也不陈旧；它可见、具名，并横跨 AAA 和新兴发行商。
