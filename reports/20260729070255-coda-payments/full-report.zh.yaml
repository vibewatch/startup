  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型：佣金、点卡和变现服务，而不是单一软件线
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Coda 变现的是多个商务层，而不是一个清晰的订阅产品。Coda 的产品页面把 Codapay 描述为支付方式和商户记录方基础设施，把 Codashop 描述为市场或需求界面，把 Webstore
              描述为托管式 D2C 店铺，把 Distribution 描述为另一条发行商触达渠道。最具体的收入拆分来自 2024 年基于 ACRA 的报道：数字内容变现产生 US$105.2 million，点卡代码销售产生
              US$63.8 million。这个拆分重要，因为它意味着业务混合了接触更深的商户和变现服务，以及更底层的储值或点卡流。Worldpay 的客户故事也强化了同一模型：它把 Coda
              描述为商户记录方客户，在扩展网页商店时寻求授权改善、外汇支持和欺诈工具。换句话说，公开模型更像交易型变现加增值运营服务，而不是经典 SaaS ARR 业务。开放问题是 Codapay、Codashop、网页商店和
              Recharge 后预付费分发之间，费率或利润率差异有多大。
