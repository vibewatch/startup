        title: 2024 年独立 Coda 财务显示有规模，但成熟度不清晰
        blocks:
          - type: paragraph
            body: >-
              Recharge 之前，保留下来的最好公开数字来自 Fintech News Singapore 基于 ACRA 的报道。该文称，2024 年集团收入从 2023 年的 US$169.3 million 小幅降至
              US$167.8 million；净亏损从 US$17.95 million 改善到 US$11.8 million。毛利下降 9.5% 至 US$43.4 million，员工成本保持在 US$36.8
              million，经营现金流出扩大到 US$9.4 million。年末现金仍有 US$96.8 million，规模不小，但已从 US$112.4 million
              下降。方向性解读是：公司足够大，可以吸收真实成本线并继续投入；但在收购前，并未明显达到自我融资的成熟度。这个结论比精确同比增长率更重要：Coda
              商业上真实、运营面很宽，但还不像一家拥有充足自由现金流的高利润率软件企业。因此，它更像支付运营业务，而非纯软件特许经营；这会影响投资人对利润率天花板和营运资本需求的判断。
