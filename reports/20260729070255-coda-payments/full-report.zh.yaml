chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、起源故事与当前规模
        blocks:
          - type: paragraph
            body: >-
              Coda 的官方叙事在公司最初要解决的问题上异常一致。公司称，业务 2011 年从印度尼西亚起步，是因为当时数字内容购买几乎只服务信用卡用户，而信用卡渗透率不到人口的 1%。创始人 Neil Davidson 和
              Paul Leishman 搭建本地支付桥梁，把消费者接入全球在线内容；官方故事也反复把这个早期新兴市场痛点，视为公司当前产品设计的根。此后，公司把这套逻辑从游戏点卡延伸到
              Codapay、Codashop、Custom Commerce 网页商店和分发。官方 2025–2026 年材料现在把 Coda 描述为全球应用外变现和数字内容分发平台：受 300+ 发行商信任，服务超过
              200 million 付费用户，覆盖 400+ 支付渠道，并且在 Recharge 之后进入 180+ 市场。需要谨慎的不是公司有没有规模，而是哪一个规模数字最新：官方页面按产品和日期不同，分别引用 2024
              年 120M+ 活跃用户、200M+ 付费用户、2B+ 已处理交易、400+ 到 600+ 员工，以及 70+ 或 80+ 市场。这个模式说明业务变化快、增长真实，但公开指标口径在各页面之间并未完全统一。
