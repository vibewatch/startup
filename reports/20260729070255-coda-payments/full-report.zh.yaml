      - number: '1.2'
        title: 领导层交接、治理能见度与运营班底
        blocks:
          - type: paragraph
            body: >-
              公开材料明确显示 Shane Happach 是现任首席执行官，Neil Davidson 仍是核心创始人形象和公开战略声音。2026 年领导层更新也显示，公司仍在重塑 Recharge 之后的运营模型：长期
              CFO Abhi Sharma 转任更宽的 COO 职责，覆盖运营、支付、欺诈、法务、合规和企业发展；前 Recharge CFO Freddy Dijkman 则在阿姆斯特丹出任集团
              CFO。这些任命有意义，因为它们说明 Coda
              试图整合一个监管更重、地域更广的业务，而不是简单挂上一块消费者资产。因此，公开班底强于普通游戏支付创业公司的刻板印象。但治理能见度有限。官方页面没有发布完整董事会图谱、持股比例或完整历史领导层时间线；至少一家第三方追踪机构仍把
              Neil Davidson 列为 CEO，尽管官方证据显示 Shane Happach 领导公司。这个差异不致命，却提醒投资人：围绕 Coda 的私营公司数据库滞后于公司现状，应当作为二级来源，而不是权威口径。
