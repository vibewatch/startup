        - 驱动因素
        - Xsolla 和 Coda MoR 材料
        - 10%-20% 净节省和更强客户归属权，足以支撑应用外投入
        - 如果自己搭建，发行商仍要扛运营复杂度
      - - 新兴市场游戏增长
        - 驱动因素
        - Coda APAC/LATAM 指南和 BCG 市场研究
        - 高速增长的玩家基数扩大可变现用户池
        - 增长伴随外汇、税务和欺诈风险
      - - 欺诈升级
        - 约束
        - Coda 欺诈、APAC 和 LATAM 材料
        - 抬高对机器学习筛查和拒付管理的需求
        - 执行质量和支付覆盖宽度一样重要
      - - 监管碎片化
        - 约束
        - Coda APAC/LATAM 和全球扩张指南
        - 催生对 MoR 结构和本地实体覆盖的需求
        - 也抬高合规成本和失败风险
      - - 货币 / 结算复杂度
        - 约束
        - Coda APAC 和增长最快经济体材料
        - 影响汇回、付款时点和利润质量
        - 可能困住收益，或要求设立本地实体
      - - 横向 PSP 替代
        - 约束
        - Stripe 和 PayPal 官方产品页面
        - 通用处理商能满足更简单的商户
        - Coda 必须证明，游戏场景 ROI 超过商品化收单本身
    notes: 这些摩擦一边催生对记录商户平台的需求，一边也限制采用速度，并压缩弱供应商的执行质量。
