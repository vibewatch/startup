              市场。这些差异很可能反映日期和产品界面不同，而不是造假，但仍让客户分析不够精确。好消息是方向清楚：市场更多、产品更多，具名发行商也随时间增加。不那么舒服的事实是，公开没有
              NRR、GRR、队列留存、客均支出、头部客户集中度或续约率披露。因此，投资人有采用广度和市场扩张的证据，却没有判断最佳客户是加深支出、还是只是让交易量流过系统所需的干净纵向数据。
