      - number: '3.3'
        title: 直接与区域同行给 Coda 施压的地方
        blocks:
          - type: paragraph
            body: >-
              最接近的战略压力来自已经扎根游戏行为的平台。Xsolla 的解决方案栈和 2026 年 D2C 报告显示，它正成熟推进网页商店、跨平台支付、订阅、奖励和 DMA
              时代移动端变现。UniPin、SEAGM、Itemku 和 Razer Gold 的重要性不同：它们更接近消费者充值、点卡和钱包生态，但证明 Coda 核心地区的玩家已经习惯替代店铺和预付费路径。Garena 和
              Sea 更像生态现有者，而不是一对一供应商；Garena 覆盖 160+ 市场，位于一个拥有数字金融业务的更大集团内，这意味着一些发行商可能更愿意留在流量、社区和支付已经共存的更大区域生态中。因此，Coda
              的护城河真实但并非绝对。许多竞争者能复制技术栈的一两根支柱，有些还控制更强的消费者品牌或大得多的资产负债表。这也意味着，当发行商比较供应商时，买方教育、忠诚度机制和本地促销几乎可以和纯支付收款同样重要。
