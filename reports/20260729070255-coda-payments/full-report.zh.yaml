  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层：发行商买方、玩家付款方和区域需求池
        blocks:
          - type: paragraph
            body: >-
              Coda 的客户界面有两个明显层次：购买变现基础设施的发行商客户，以及实际使用购买流程的消费者玩家。企业侧，公开来源反复强调游戏和数字内容发行商，具名客户包括 EA、Activision
              Blizzard、Riot Games、Zynga、Bigo 等。消费者侧，Codashop、网页商店和市场流面向需要本地支付选项的玩家和数字内容买家。地域是分层的核心。Coda
              材料强调东南亚、韩国、日本、LATAM、MENA，以及其他新兴或本地支付偏好较强的市场；这些地区的结账偏好与西方信用卡主导模式差异很大。Recharge
              通过增加预付费买家和品牌拓宽图景，但核心公开证明仍以游戏最强。实际含义是，经济买方通常是发行商或平台团队，而真正驱动转化的是消费者对本地支付方式和商店体验的信任。
