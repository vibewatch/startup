            body: >-
              最好的公开技术证据来自 Unity 围绕支付提供商的文档和社区教程。Unity 材料称，Stripe 和 Coda 等第三方提供商可在 IAP 5.4+ 内连接，流程包括外部
              OAuth、目录部署、环境隔离、重定向 URL，以及结账后的深链返回。这很关键，因为它让 Coda 进入游戏实际运营流，而不只是线下商务拓展关系。Unity
              讨论也显示，路由规则可以把不同平台或地区导向不同提供商，这与 Coda 解决本地化支付、而非普遍替代所有商店流的主张吻合。Coda
              自己的集成和处理博客也强化了同一系统视角：发行商按控制权需求，在托管页面、嵌入式组件或更深的 API 主导所有权之间选择。实际运行中，Coda 的架构似乎位于商户 UI、支付提供商选择、合规逻辑和履约确认之间。
