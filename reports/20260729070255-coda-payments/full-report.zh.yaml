  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品栈：多个变现模块绑定同一个游戏商务工作流
        blocks:
          - type: paragraph
            body: >-
              Coda 的产品架构表面模块化，意图上却是一体的。Codapay 是支付和商户记录方层，Codashop 是既有市场和充值界面，Custom Webstore 是托管式 D2C 店铺，Distribution
              通过合作网络扩大触达。Recharge 又加入预付费产品、礼品卡和 B2B
              数字奖励，成为相邻的数字价值轨道。因此，产品价值主张不是一个结账小组件，而是一组路径：发行商借此触达用户、提供本地支付方式，同时把税务、欺诈、合规和运营开销外包出去。保留的公开材料反复强调市场碎片化，这意味着真正的“技术”是路由、编排和地区适配的组合，而不是某个新的支付算法。案例研究也支持这个判断：Lumen
              Pixel、EA 的 FC Mobile 网页商店和 Worldpay 客户故事，都更多描述运营简化和转化支持，而不是单独的开发者工具。
