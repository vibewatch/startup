            body: >-
              相比公开支付公司，Coda 的披露仍然很薄。Payoneer、Shift4、Paysafe、Adyen 和 PayPal
              的公开文件和年报页面清楚显示，上市同行通常会披露季度或年度文件、审计报告、股东委托书材料和投资者更新。相比之下，Coda 的公开证据来自产品页面、新闻稿，以及第三方对私营公司账目的报道。这个差异本身不代表
              Coda 更弱，但会显著限制投资人对收入质量、营运资本动态、费率、客户集中度、债务和收购后整合成本的信心。对尽调而言，核心财务问题不只是“收入有多大？”，而是“Recharge
              之后，合并毛利率和现金转换画像是什么？现在有多少营运资本或监管资本被锁在模型里？”在管理层披露更干净的桥接之前，投资人应把当前公开图景视为有规模证据，但会计质量缺口仍未解决。
