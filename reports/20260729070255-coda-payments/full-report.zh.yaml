        title: 客户耐久度取决于扩张，而不只是客户名单
        blocks:
          - type: paragraph
            body: >-
              Coda 的公开证明显示出一种先落地、再扩张的动作，混合更好的本地化、更广的支付接入和更丰富的自有渠道体验。FC Mobile 网页商店、Lumen Pixel 案例和 8x8
              故事都暗示，当发行商希望区域扩张、又不想拼装大量本地集成时，Coda
              会变得更有价值。这可以形成真实粘性。但同一批公开证据也暗示集中度和平台风险。游戏仍是主导垂直，大客户证明明显偏游戏，公司最强引用往往围绕旗舰标题或大型发行商。如果少数标杆客户或关键品类改变支付策略，商业影响可能很明显。换句话说，客户故事有吸引力，但不能只靠客户名单密度完全承销其耐久度。投资人需要集中度、续约、队列和合同期限数据，才能把
              Coda 的已安装基础视为深度嵌入。缺少合同和队列数据意味着，即便轶事满意度很强，也只能把它看作方向性信号，而不是可持续收入质量的确定证明。
