            body: >-
              公开估值引用仍集中在 2022 年融资锚。2022 年少数股权交易带来 US$690 million，Hurun 和追踪型数据库在 2025-2026 年仍把 Coda 放在约 US$2.5 billion
              区间。这有用，但只能作为锚，而不是按市价重估的真相。此后两件事发生变化：第一，独立 2024 年公开财务显示收入偏软且亏损持续；第二，Recharge 加入有利润规模、有授信支持的 M&A
              姿态和更广预付费产品基础。两者对估值方向相反。因此，陈旧锚仍有信息量，恰恰因为没有新的公开上轮或下轮融资取代它。投资人应把它视为先验，再判断相对这个先验应给予多少整合上行，或扣除多少披露折价。
