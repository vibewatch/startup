            body: >-
              Coda 的产品生来就是集成式的，这意味着依赖风险结构性偏高。Unity 的提供商模型显示，应用外商务依赖游戏引擎集成、提供商路由、认证和深链。Worldpay
              故事显示，公司依赖外部收单、外汇和授权合作伙伴。8x8 案例揭示，安全交易闭环依赖通信基础设施。Apple 和 Google 政策文件，加上 Coda 自己的政策解读，显示可触达机会多大程度取决于 Coda
              无法控制的平台规则。商业侧，Coda 最强的公开客户证明围绕高知名度游戏和发行商关系，因此即便具体比例未披露，客户集中度和平台议价权也是真实风险。Recharge 以及 Digital
              Garage、Itemmania 等合作绑定扩大了机会，但也增加了更多外部节点，必须在运营和经济性上对齐。由于这些依赖贴近用户交易，宕机或政策变化很快就会被客户看见。
