  summary: >-
    Coda Payments 是一家总部位于新加坡的私营游戏支付和数字商务平台，2011 年从印度尼西亚起步，随后扩展为覆盖商户记录方、本地支付、网页商店和预付费分销的更广泛技术栈。公司通过
    Codapay、Codashop、Custom Commerce，以及 2025 年收购 Recharge 后扩大的预付费和礼品卡网络，服务数字内容发行商和玩家 /
    消费者终端用户。公开证据支持其具备可观规模、在新兴市场有战略相关性，且仍保有被认可的独角兽估值锚；但当前财务和客户质量披露明显低于公开市场标准。
