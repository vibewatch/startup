- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - Scenario
  - Indicative valuation range
  - Core assumptions
  - Probability signal
  - Downside / upside trigger
  rows:
  - - Bear
    - US$1.4B–$1.9B
    - Public-market discipline dominates, integration friction persists, and standalone softness proves more structural
    - If margins or cash conversion do not improve post-Recharge
    - Evidence of customer concentration, policy drag, or slower D2C uptake
  - - Base
    - US$2.1B–$2.7B
    - 2022-2025 private anchor remains broadly fair, Recharge is mix-accretive, and growth remains credible but not fully proven
    - Most consistent with current mixed evidence
    - Needs stable integration and at least acceptable post-close economics
  - - Bull
    - US$2.9B–$3.6B
    - Recharge materially improves quality, policy openings accelerate D2C, and Coda proves strong retention and cross-sell
    - Requires successful disclosure upgrade and superior growth quality
    - Would need evidence that current private anchor still understates quality
  notes: Scenario ranges are analytical estimates anchored to public valuation references, public financials, and public-comp context; they are not market quotes.
