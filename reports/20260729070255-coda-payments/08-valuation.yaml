  - - Return logic
    - Upside if Recharge mix and D2C scale compound
    - Can re-rate with cleaner disclosure and stronger economics
    - Downside if integration or policy risk bites
  - - Best next step
    - Deep-dive diligence before price commitment
    - Main open issues are quantifiable with internal data
    - Management disclosure quality becomes decisive
  notes: This summary converts the public evidence into an investability stance rather than a precise target price.
