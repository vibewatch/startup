company:
  name: Coda Payments
chapter:
  number: 8
  title: Valuation
  summary: 'The public record supports Coda as a real, scaled, and strategically attractive gaming-commerce and payments platform, but not yet a transparently underwritable one. The strongest positive anchor is that private-market references still cluster around the US$2.5B valuation set in the 2022 financing and carried through Hurun-era unicorn tracking, while Recharge added profitable prepaid scale and Coda kept expanding market reach. The key caution is that public disclosure still lags the ambition: standalone 2024 results showed softer revenue and negative operating cash flow, and there is no clean post-Recharge pro forma. The investment case is therefore attractive only with valuation discipline and a diligence-heavy posture.'
sections:
- id: thesis-and-antithesis-turn-on-scale-vs-disclosure
  title: Thesis and anti-thesis turn on scale versus disclosure quality
  body: 'The bullish case for Coda is straightforward. Public evidence shows a business that solved a real pain point in gaming and digital commerce, scaled across hundreds of publishers and hundreds of millions of users, raised a major 2022 growth round, maintained unicorn status in 2025 tracking, and then added Recharge’s profitable prepaid platform in 2025. The bearish case is equally straightforward: the best hard financial numbers in public still show a standalone company with slightly declining 2024 revenue, negative operating cash flow, and little transparent disclosure on take rates, concentration, or post-close integration economics. That means Coda is neither a speculative concept company nor a fully disclosed comp set member. It sits in the middle: strategically compelling, commercially proven, but valuation-sensitive because confidence must bridge a lot of missing detail. That in-between status matters for valuation mechanics: investors are underwriting both business quality
    and reporting risk at the same time, so the spread between a fair and an overpaying entry price is wider than it would be for a public company with comparable scale.'
  claimRefs:
