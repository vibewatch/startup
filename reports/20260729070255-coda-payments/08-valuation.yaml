- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Dimension
  - Bull thesis
  - Anti-thesis
  - What would decide it
  rows:
  - - Market position
    - Coda is a rare gaming-native MoR and D2C platform with emerging-market depth
    - Much of the stack is modular and can be replicated or multi-homed
    - Win/loss data and customer share of wallet
  - - Financial shape
    - Recharge adds profitable scale and broader digital-value economics
    - Standalone Coda still showed softer revenue and cash burn pre-close
    - Pro forma 2025/2026 EBITDA and cash-flow bridge
  - - Growth durability
    - Off-app policy shifts and local payments can expand wallet share
    - Policy openings are uneven and publisher concentration may be high
    - Geography and cohort-level revenue data
  - - Moat quality
    - Marketplace, payments, compliance, and distribution together create stickiness
    - Only parts of the moat may be durable; others are orchestration-heavy
    - Net retention and churn by product and market
  - - Private valuation
    - US$2.5B anchor held through later tracking and no public reset broke it
    - Stale anchor may overstate value if public-market discipline dominates
    - Current primary or secondary transaction data
  - - Exit path
    - Could support a strategic or public-markets story with more transparency
    - Disclosure quality today is below public-market expectations
    - Evidence of improving reporting and governance
  notes: The decision hinges less on category belief and more on whether Coda can evidence durable quality at a disciplined price.
