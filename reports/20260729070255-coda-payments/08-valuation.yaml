    - Strategic quality is real and scale is credible
    - Disclosure gap is too large for an unconstrained bid
  - - Confidence
    - Moderate
    - Many core facts are corroborated, but pro forma visibility is weak
    - Missing retention, concentration, and margin data
  - - Risk rating
