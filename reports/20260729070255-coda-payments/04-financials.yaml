company:
  name: Coda Payments
chapter:
  number: 4
  title: Financials
  summary: Coda’s public financial picture is incomplete but directionally useful. The strongest hard numbers come from ACRA-based reporting on 2024 standalone results and from Recharge’s official 2024 disclosures. Those show a company with meaningful revenue, mixed revenue streams, narrowing losses, and still-negative operating cash flow before the Recharge close, plus an acquired prepaid platform that arrived with profitability and external financing capacity. The underwriting issue is not whether there is a business; it is how much of the combined model is recurring, what gross economics look like by product, and whether post-acquisition capital intensity is improving or worsening.
sections:
- id: revenue-model-and-what-gets-monetized
  title: 'Revenue model: commissions, vouchers, and monetization services rather than one software line'
  body: 'The public evidence suggests Coda monetizes several commerce layers rather than one clean subscription product. Coda’s product pages frame Codapay as payment-method and merchant-of-record infrastructure, Codashop as a marketplace or demand surface, Webstore as a managed D2C storefront, and Distribution as another publisher reach channel. The most concrete revenue split comes from 2024 ACRA-based reporting: digital-content monetization generated US$105.2 million while voucher-code sales generated US$63.8 million. That split matters because it implies the business blends higher-touch merchant and monetization services with lower-level stored-value or voucher flows. Worldpay’s customer story reinforces the same model by describing Coda as a merchant-of-record customer seeking authorization improvements, FX support, and fraud tooling while scaling webstores. Put differently, the public model looks like transaction-based monetization plus value-added operating services, not a classic
    SaaS ARR business. The open question is how much take rate or margin varies between Codapay, Codashop, webstores, and post-Recharge prepaid distribution.'
