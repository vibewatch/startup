- id: 2024-standalone-coda-financials-show-scale-without-clean-maturity
  title: 2024 standalone Coda financials show scale without clean maturity
  body: 'The best retained public numbers for pre-Recharge Coda come from Fintech News Singapore’s ACRA-based reporting. That article says 2024 group revenue slipped to US$167.8 million from US$169.3 million in 2023 while net loss improved to US$11.8 million from US$17.95 million. Gross profit fell 9.5% to US$43.4 million, employee costs stayed at US$36.8 million, and operating cash outflow widened to US$9.4 million. Year-end cash remained meaningful at US$96.8 million, but it declined from US$112.4 million. The directional read is a company that is large enough to absorb real cost lines and still fund investment, yet not one that had obviously reached self-financing maturity before the acquisition. That conclusion matters more than the exact year-over-year growth rate: Coda looked commercially real and operationally broad, but not yet like a high-margin software business with abundant free cash flow. The picture is therefore more payments-operations business than pure software franchise,
    and that matters for how investors should think about margin ceilings and working-capital needs.'
