- id: underwriting-gaps-what-public-comparable-disclosure-does-and-does-not-tell-us
  title: 'Underwriting gaps: what public comparable disclosure does and does not tell us'
  body: Relative to public payment companies, Coda’s disclosure remains thin. Public filings and annual-report pages for Payoneer, Shift4, Paysafe, Adyen, and PayPal make clear that listed peers routinely expose quarterly or annual filings, audited reports, proxy materials, and investor updates. By contrast, Coda’s public evidence arrives through product pages, press releases, and third-party reporting on private-company accounts. That difference does not by itself make Coda weaker, but it sharply limits confidence around revenue quality, working-capital dynamics, take rates, customer concentration, debt, and post-acquisition integration cost. For diligence, the main financial question is not just “how big is revenue?” but “what is the combined gross-margin and cash-conversion profile after Recharge, and how much working capital or regulatory capital is now tied up in the model?” Until management discloses a cleaner bridge, investors should treat the current public picture as evidence of
    scale with unresolved accounting-quality gaps.
