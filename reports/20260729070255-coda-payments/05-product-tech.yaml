  title: Product module / asset matrix
  columns:
  - Module / asset
  - User or buyer job
  - Public functional role
  - Why it matters
  - Key dependency
  rows:
  - - Codapay
    - Accept localized payments and outsource payments operations
    - 400+ methods across many markets; handles compliance and checkout complexity
    - Core monetization rail for publishers
    - Payment routing, compliance, fraud, and local-method upkeep
  - - Codashop
    - Give players an existing top-up and purchase destination
    - Marketplace / direct top-up brand trusted by millions of users
    - Adds demand surface and alternative-store reach
    - Catalog quality, fulfillment accuracy, local trust
  - - Custom Webstore
    - Launch owned D2C storefronts quickly
    - White-label store with global payments and liveops control
    - Helps publishers capture direct channel economics
    - Storefront operations, promotion logic, legal and payment pages
  - - Distribution
    - Reach more paying customers through partner networks
    - Extends visibility and routes to purchase
    - Supports faster market entry
    - Partner network quality and attribution
  - - Recharge platform
    - Sell prepaid products, gift cards, and rewards
    - Adds digital-value distribution beyond core game top-ups
    - Diversifies the product stack
    - Prepaid catalog, brand relationships, compliance and settlement
  - - Support and legal surfaces
    - Keep player flows and obligations clear
    - Codashop support center and webstore legal pages
    - Operational trust layer around products
    - Documentation freshness and issue-resolution workflow
  notes: Coda’s products are modular in buying motion but interdependent in operation.
