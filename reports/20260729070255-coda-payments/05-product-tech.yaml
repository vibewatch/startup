- id: how-the-stack-works-in-practice-from-unity-to-checkout-to-fulfillment
  title: 'How the stack works in practice: from Unity and external checkout to fulfillment'
  body: 'The best public technical evidence comes from Unity’s documentation and community tutorial around payment providers. Unity’s materials say third-party providers such as Stripe and Coda can be connected inside IAP 5.4+, with external OAuth, catalog deployment, environment separation, redirect URLs, and deep-link return flows after checkout. That matters because it makes Coda part of the actual operating flow of a game rather than merely an offline business-development relationship. The Unity discussion also shows how routing rules can steer different platforms or geographies toward different providers, which fits Coda’s claim of solving localized payments rather than replacing all store flows universally. Coda’s own integration and processing blogs reinforce the same system view: publishers choose between hosted pages, embedded components, or deeper API-led ownership depending on how much control they want. In practice, Coda’s architecture appears to sit between merchant UI, payment-provider
    selection, compliance logic, and fulfillment confirmation.'
  claimRefs:
