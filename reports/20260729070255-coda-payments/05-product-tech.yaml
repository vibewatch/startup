company:
  name: Coda Payments
chapter:
  number: 5
  title: Product & Technology
  summary: 'Coda’s product stack is best understood as a commerce operating system for digital publishers: localized payments via Codapay, marketplace demand via Codashop, managed owned-channel storefronts via Custom Webstore, and wider reach via Distribution, now complemented by Recharge’s prepaid platform. The technical thesis is not frontier algorithmics but orchestration—payment routing, compliance, fraud control, fulfillment, and partner integrations at market level. The main product risk is complexity: the more surfaces Coda adds, the more it must coordinate storefront UX, payment-provider rules, compliance, anti-fraud, support, and post-purchase fulfillment across many markets.'
sections:
- id: product-stack-and-what-each-module-does
  title: 'Product stack: multiple monetization modules tied to one gaming-commerce workflow'
  body: 'Coda’s product architecture is modular on the surface but cohesive in intent. Codapay is the payments and merchant-of-record layer, Codashop is the existing marketplace and top-up surface, Custom Webstore is the managed direct-to-consumer storefront, and Distribution extends reach through partner networks. Recharge then adds prepaid products, gift cards, and B2B digital rewards as a neighboring digital-value rail. The product value proposition is therefore not one checkout widget; it is a set of routes by which a publisher can reach users, offer local payment methods, and still outsource tax, fraud, compliance, and operational overhead. The retained public material repeatedly emphasizes market fragmentation, meaning the real “technology” is a combination of routing, orchestration, and region-specific adaptation rather than one novel payment algorithm. That interpretation fits the case studies as well: Lumen Pixel, EA’s FC Mobile webstore, and the Worldpay customer story all describe
    operational simplification and conversion support more than a standalone developer tool.'
