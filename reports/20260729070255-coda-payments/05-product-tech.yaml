- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer
  - Public evidence
  - What it does
  - Why it is technically important
  - Diligence question
  rows:
  - - Catalog and product configuration
    - Unity tutorial and UGS references
    - Deploys and updates purchasable items remotely
    - Separates content changes from app releases
    - How often do catalog mismatches cause support issues?
  - - Authentication and identity
    - Unity tutorial on player authentication and redirects
    - Ensures items reach the correct account after web checkout
    - Critical for off-app fulfillment integrity
    - What identity providers and fraud controls are mandatory by market?
  - - Provider connection / OAuth
    - Unity docs and Coda provider setup
    - Links game stack to payment provider account securely
    - Avoids manual credential handling inside game client
    - How resilient is provider-connection management at scale?
  - - Checkout routing
    - Unity rules and Coda integration options
    - Routes payment flows by provider, platform, or implementation model
    - Key to localization and economics optimization
    - How dynamic are routing rules by geography and risk?
  - - Merchant-of-record operations
    - Coda product and MOR blogs
    - Handles tax, compliance, support, disputes, and settlement
    - Turns payments into an operating platform
    - Which parts are fully automated vs manual by market?
  - - Fulfillment, notification, and support
    - 8x8 and Codashop support surfaces
    - Confirms, secures, and supports transactions after purchase
    - Important for fraud control and customer trust
    - What is the SLA for failed delivery, OTP delay, or dispute handling?
  notes: The public technical stack looks like workflow orchestration across identity, provider routing, compliance, and fulfillment.
