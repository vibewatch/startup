- id: TE002
  title: Workflow / use-case table
  columns:
  - Use case
  - Best-fit Coda product path
  - Primary benefit
  - Observed proof
  - Implementation trade-off
  rows:
  - - Fast market entry for a publisher
    - Codashop or hosted Codapay flow
    - Speed and immediate local payment reach
    - Lumen Pixel and product blogs
    - Less control over direct brand experience
  - - Owned-channel D2C commerce
    - Custom Webstore plus MoR services
    - Higher control and potential margin improvement
    - EA FC Mobile webstore and Unity integration
    - Requires deeper store operations and promotion logic
  - - Localized checkout without full store build
    - Codapay embedded or hosted options
    - A single integration for local methods
    - Integration and processing blogs
    - Control level depends on integration model
  - - Alternative-store monetization for mobile games
    - Unity IAP + Coda provider routing
    - Supports external web purchase loop
    - Unity docs/community plus Coda Unity press
    - Needs redirects, deep links, and sandbox/live environment handling
  - - Digital prepaid and rewards expansion
    - Recharge platform and Giftcloud-adjacent capabilities
    - Adds brands, gift cards, and B2B use cases
    - Recharge growth disclosures
    - Brings new compliance and integration burden
  - - Secure post-purchase communication
    - OTP and notification layer via SMS and support flows
    - Reduces fraud and improves delivery assurance
    - 8x8 customer story
    - Adds vendor dependency and workflow complexity
  notes: Use cases map to different deployment depths; Coda’s advantage is optionality across them.
