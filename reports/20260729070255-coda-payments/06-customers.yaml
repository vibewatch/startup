- id: TU004
  title: Retention / repeat usage / satisfaction table
  columns:
  - Durability lens
  - Public evidence
  - Positive read
  - What is missing
  - Investor implication
  rows:
  - - Repeat purchase behavior
    - Codashop and webstore framing around top-ups and returning users
    - Top-up models naturally lend themselves to repeat use
    - No cohort or repeat-rate disclosure
    - Retention could be strong but is not auditable publicly
  - - Customer satisfaction / friction reduction
    - Lumen Pixel and 8x8 quotes about simpler payments and fewer delivery issues
    - Operational simplification likely supports stickiness
    - No NPS, CSAT, or renewal survey data
    - Anecdotes help but are not enough
  - - Growth from new vs returning users
    - Impact case study
    - 9x revenue growth from new users and 11x from returning users
    - Applies to channel program, not whole company cohort
    - Suggests repeat-user monetization exists
  - - Support and complaint handling
    - Support center and OTP stories
    - Public attention to support implies real operational process
    - No ticket-volume or resolution-time metrics
    - Support quality could be a moat or a cost center
  - - Renewal / contract duration
    - No direct public disclosure
    - n/a
    - No NRR, GRR, term length, or churn data
    - Main durability blocker for underwriting
  notes: Public durability evidence is anecdotal and operational, not cohort-based.
