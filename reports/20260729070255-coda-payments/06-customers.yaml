- id: adoption-trajectory-and-expansion-signal-are-stronger-than-retention-disclosure
  title: Adoption trajectory and expansion signal are stronger than retention disclosure
  body: 'Public sources show clear scale and expansion signals but much weaker durability metrics. Coda cites 200M+ paying users, 300+ publishers, and 180+ markets after Recharge, while older and third-party profiles reference 10M+ or 11M+ monthly gamers on Codashop, 90M+ monthly visits, and 65 or 70+ markets at earlier stages. The variations likely reflect different dates and product surfaces rather than fabrication, but they still make customer analysis less precise. The good news is that the direction of travel is clear: more markets, more products, and more named publishers over time. The less comfortable truth is that there is no public NRR, GRR, cohort retention, average spend per customer, top-customer concentration, or renewal-rate disclosure. Investors therefore have evidence of adoption breadth and market expansion, but not the clean longitudinal data needed to judge whether the best customers deepen spend or merely pass volume through the system.'
