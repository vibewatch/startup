- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Risk or lever
  - Public evidence
  - Why it matters
  - Upside case
  - Downside case
  rows:
  - - Gaming concentration
    - Most named proofs are gaming titles or gaming publishers
    - Vertical focus creates category expertise
    - Deep specialization can improve conversion and GTM fit
    - Cyclicality or publisher pullbacks can hit volume
  - - Marquee-customer dependence
    - High-profile names such as EA and Activision dominate the public story
    - Large logos anchor credibility
    - Can accelerate new-customer acquisition
    - Could mask customer concentration
  - - Geographic diversification
    - SEA, South Korea, Japan, LATAM, MENA, and 180+ markets cited
    - Reduces dependence on one country
    - Multiple growth pockets support resilience
    - Adds support and compliance complexity
  - - Land-and-expand via more products
    - Webstores, Codapay, Distribution, Recharge adjacency
    - More modules can deepen account value
    - Sticky cross-sell motion possible
    - Cross-sell complexity may strain execution
  - - Platform-policy dependence
    - Out-of-app commerce tied to policy openings
    - Can expand TAM and user choice
    - Supports higher-margin owned channels
    - Policy reversals or uneven rollout can slow expansion
  notes: The public customer base looks broad and strategically interesting, but concentration cannot be ruled out without direct disclosures.
