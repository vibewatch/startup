company:
  name: Coda Payments
chapter:
  number: 6
  title: Customers
  summary: 'Coda’s customer proof is strongest at the intersection of large game publishers and mass-market player demand. Public sources show named enterprise customers and partners such as Electronic Arts, Call of Duty Mobile, Activision, Riot Games, and Zynga, plus case studies demonstrating localized-payment expansion and partner-driven revenue growth. What remains weak is durability disclosure: there is no public NRR, GRR, churn, or concentration data, so investors can see customer logos and growth anecdotes but not the full quality of the installed base.'
sections:
- id: customer-base-segmentation-publisher-buyer-and-player-payer
  title: 'Customer base segmentation: publisher buyers, player payers, and regional demand pools'
  body: 'Coda’s customer surface has two obvious layers: publisher customers that buy monetization infrastructure and consumer players that actually use the resulting purchase flows. On the enterprise side, public sources repeatedly emphasize gaming and digital-content publishers, with named logos including EA, Activision Blizzard, Riot Games, Zynga, Bigo, and others. On the consumer side, Codashop, webstores, and marketplace flows are aimed at gamers and digital-content buyers who need local payment options. Geography is central to the segmentation. Coda’s materials emphasize Southeast Asia, South Korea, Japan, LATAM, MENA, and other emerging or localized-payment-heavy markets where checkout preferences differ sharply from card-led Western norms. Recharge broadens the picture by adding prepaid buyers and brands, but the core public proof remains strongest in gaming. The practical implication is that the economic buyer is usually a publisher or platform team, while the actual conversion
    driver is consumer trust in localized payment methods and store experiences.'
