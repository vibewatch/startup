- id: customer-durability-depends-on-expansion-not-just-logos
  title: Customer durability depends on expansion, not just logos
  body: Coda’s public proof suggests a land-and-expand motion that mixes better localization, broader payment access, and richer owned-channel experiences. The FC Mobile webstore, Lumen Pixel case, and 8x8 story all imply that Coda becomes more valuable when a publisher wants to expand regionally without assembling many local integrations. That can create real stickiness. But the same public evidence also implies concentration and platform risk. Gaming remains the dominant vertical, large-name proofs are disproportionately games-focused, and the company’s best references often revolve around flagship titles or major publishers. If a few marquee customers or key genres changed payment strategy, the commercial effect could be meaningful. In other words, the customer story is attractive, but durability cannot be fully underwritten from logo density alone. Investors need concentration, renewal, cohort, and contract-length data before treating Coda’s installed base as deeply entrenched. The absence
    of contract and cohort data means even strong anecdotal satisfaction should be treated as directional rather than definitive proof of durable revenue quality.
