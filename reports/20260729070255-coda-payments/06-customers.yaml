- id: named-customer-proof-is-real-and-freshest-in-webstore-and-checkout-cases
  title: Named customer proof is real and freshest in webstore and checkout cases
  body: 'The strongest named-customer evidence comes from case studies and launch announcements. EA’s FC Mobile webstore launch shows Coda powering a store in 60 markets, then broader availability across a long list of countries. The Call of Duty Mobile webstore announcement shows similar logic: exclusive deals, bonus points, and an alternative purchase destination for a major global title. Lumen Pixel offers proof from the mid-market publisher side, where Codapay expanded payment coverage in South Korea and Southeast Asia and reportedly onboarded within weeks. Worldpay’s customer story gives a different angle by naming Coda as a merchant-of-record customer serving publishers such as Activision and EA. The Impact case study adds a demand-generation layer, showing that partnership channels materially increased revenue from new and returning users. Taken together, these sources support the claim that Coda’s customer proof is not hypothetical or stale. It is visible, named, and spread across
    both AAA and emerging publishers.'
  claimRefs:
