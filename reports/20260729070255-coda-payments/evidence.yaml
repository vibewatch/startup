evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: founders
    missingEvidence: A canonical official founder roster including whether Bobby Choi remains formally recognized by the company.
    whyItMatters: Founder attribution affects governance history and helps resolve inconsistent database records.
    diligencePath: Request a current corporate fact sheet or archived about-page material explicitly listing all founders.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: valuation
    missingEvidence: A post-2022 valuation or latest financing mark directly disclosed by the company or investors.
    whyItMatters: The last public valuation anchor is old relative to major business changes and the Recharge acquisition.
    diligencePath: >-
      Request current cap table, most recent financing documents, and any board-approved 409A or internal valuation
      work.
    relatedQuestionRefs:
      - QO013
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: private-evidence-only
    severity: material
