  - - Platform dependency
    - Policy monitoring and multi-channel strategy
    - Apple/Google rule changes; share of off-app volume
    - Large policy rollback that invalidates major roadmap assumptions
    - Request off-app exposure by geography
  - - Integration / execution
    - Leadership redesign and partner expansion
    - Missed launches, support backlog, partner churn
    - Repeated delays or service issues after Recharge integration
    - Request integration milestone dashboard
  - - Customer durability
    - Broad publisher base and market reach
    - Top-customer share, NRR, GRR, renewals
    - Evidence that growth depends on a few fragile relationships
    - Request cohort and concentration data
  - - Capital intensity
    - Historical funding plus Recharge facility
    - Cash burn, covenant headroom, regulatory capital needs
    - Need for capital before growth proves durable economics
    - Request post-close liquidity and debt bridge
  notes: Kill criteria focus on thesis-breaking events rather than ordinary operating friction.
