  figureRefs:
  - FR001
- id: operational-security-and-quality-risks-scale-with-each-new-market
  title: Operational, security, and quality risks scale with each new market
  body: Operational complexity is the price of Coda’s global-local model. Public materials describe a stack that must coordinate local payment methods, fraud controls, redirects, deep links, customer support, legal pages, OTPs, and transaction fulfillment. The security page and ISO/BSI announcement strengthen confidence that the company takes controls seriously, while the 8x8 story shows operational safeguards such as OTPs and notifications in 30 countries. Yet those same sources underscore how many moving parts the user experience depends on. A failure in provider routing, fraud scoring, notification delivery, or store legality can quickly become a customer or regulator issue. The APAC and LATAM guides are explicit that fast-changing tax rules, FX complexity, and high fraud rates are structural, not occasional nuisances. The result is a business with genuine process capability but also many points of failure where support burden, false declines, or payout delays could erode trust and margin
    simultaneously.
  claimRefs:
  - CR009
  - CR010
  - CR011
  - CR012
  - CR013
  - CR014
  - CR015
  - CR016
  tableRefs:
  - TR002
  figureRefs:
  - FR002
- id: partner-and-platform-dependency-risk-is-strategically-important
  title: Partner and platform dependency risk is strategically important
  body: Coda’s product is integrative by design, which means dependency risk is structurally high. Unity’s provider model shows that off-app commerce depends on game-engine integrations, provider routing, authentication, and deep links. Worldpay’s story shows dependency on external acquiring, FX, and authorization partners. The 8x8 case reveals reliance on communications infrastructure for secure transaction loops. Apple and Google policy documents, plus Coda’s own policy explainers, show how much the addressable opportunity depends on platform rules outside Coda’s control. On the commercial side, Coda’s strongest public customer proof revolves around high-profile games and publisher relationships, making customer concentration and platform bargaining power real risks even if exact percentages are not disclosed. Recharge and partner tie-ins such as Digital Garage or Itemmania extend opportunity, but they also add more external nodes that must align operationally and economically. Because
    these dependencies sit close to the user transaction, outages or policy changes can become customer-visible very quickly.
  claimRefs:
  - CR017
  - CR018
  - CR019
  - CR020
  - CR021
  - CR022
  - CR023
  - CR024
  tableRefs:
  - TR003
  figureRefs:
  - FR003
- id: financial-model-and-execution-risk-remain-meaningful
  title: Financial-model and execution risk remain meaningful
  body: 'Financial risk in Coda’s case is not just about cash burn; it is about whether a complex, cross-border operating model can keep converting scale into durable economics. Standalone 2024 public reporting showed narrowing losses but still-negative operating cash flow, while Recharge brought profitability and a €45 million facility but also integration work and broader regulated scope. That creates a mixed picture: Coda appears well-capitalized enough to operate, but still reliant on careful execution rather than obvious self-funding maturity. People risk also matters. Leadership changes in 2026, the absorption of former Recharge executives, and the broadening of COO responsibilities all suggest a company redesigning itself in motion. The core execution question is therefore whether management can integrate new geographies, products, and compliance obligations without letting support complexity, fraud cost, or capital intensity outrun revenue quality. That makes monitoring discipline
    and incident response at least as important as topline growth claims.'
  claimRefs:
  - CR025
  - CR026
