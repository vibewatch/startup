  title: Partner / dependency risk register
  columns:
  - Dependency
  - Why it matters
  - Public evidence
  - Failure mode
  - Diligence ask
  rows:
  - - App stores and platform policy
    - Gate off-app monetization surfaces
    - Google Play / Apple DMA materials
    - Opportunity shrinks or rollouts fragment by geography
    - Request geography-by-geography policy sensitivity analysis
  - - Unity and developer workflow integrations
    - Shapes technical adoption path for some publishers
    - Unity docs and community tutorial
    - Broken provider setup or routing reduces adoption
    - Request live integration success and failure metrics
  - - Acquiring / FX / fraud partners
    - Underpin authorization and settlement quality
    - Worldpay customer story
    - Partner underperformance hits conversion and economics
    - Request partner concentration and redundancy map
  - - OTP / communications provider
    - Secures transactions and delivery messaging
    - 8x8 customer story
    - Notification outages harm trust and resolution time
    - Request communications redundancy and fallback plans
  - - Local-market partners
    - Extend access in Japan / South Korea and elsewhere
    - Digital Garage and Itemmania announcements
    - Partner economics or execution may disappoint
    - Request partner contribution to GMV and retention
  - - Large publishers / flagship titles
    - Anchor public credibility and likely meaningful volume
    - EA, CODM, Activision references
    - Loss of a flagship customer could materially hurt growth signal
    - Request top-customer concentration and renewal terms
  notes: The dependency map shows Coda as an orchestrator whose value also depends on third-party health and incentives.
