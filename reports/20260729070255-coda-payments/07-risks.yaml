company:
  name: Coda Payments
chapter:
  number: 7
  title: Risks
  summary: Coda’s risk profile is the inevitable mirror image of its value proposition. Because the company solves localized payments, compliance, fraud, and off-app monetization complexity for publishers, it inherits regulatory, operational, partner, and financial-model risks across many markets. The good news is that the public record shows Coda actively building controls—MPI licensing, ISO certification, OTP workflows, and policy monitoring. The caution is that the business remains exposed to app-store rule changes, cross-border compliance drift, gaming concentration, and post-Recharge integration complexity.
sections:
- id: regulatory-and-legal-risk-is-core-not-incidental
  title: Regulatory and legal risk is core, not incidental
  body: Coda’s move into major payment institution status in Singapore and its broader merchant-of-record positioning make regulation a central business risk rather than a background legal footnote. The Payment Services Act covers licensing of payment service providers, business conduct, major payment institutions, audits, and oversight of payment systems. MAS’s own public explanation of the Act highlights seven regulated payment services, including merchant acquisition and domestic and cross-border money transfer. That matters because Coda’s value proposition explicitly touches merchant acquisition, cross-border settlement, and localized payments. Public sources also show the company tracking external platform rules, such as Google Play out-of-app payment changes and Apple DMA-driven updates. The risk is not simply noncompliance; it is that regulatory scope, capital requirements, KYC/AML expectations, app-store policies, and customer redress duties all expand as Coda broadens product surfaces
    and jurisdictions. Investors should therefore treat regulatory interpretation as a changing operating parameter, not as a one-time box-checking exercise for management.
  claimRefs:
  - CR001
  - CR002
  - CR003
  - CR004
  - CR005
  - CR006
  - CR007
  - CR008
  - CR041
  - CR042
  tableRefs:
