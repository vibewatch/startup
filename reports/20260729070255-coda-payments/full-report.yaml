      - number: '8.3'
        title: Public-comp context supports discipline, not complacency
        blocks:
          - type: paragraph
            body: >-
              The public comparable set shows how wide the payments sector valuation range can be. As of late July 2026,
              PayPal and Adyen commanded much larger market capitalizations than Coda’s last private anchor, while
              Shift4 and Payoneer sat closer to the low-single-digit billions and Paysafe much lower still. These
              businesses are not perfect comparables—some are broader processors, some are software-heavy, some have
              stronger consumer networks, and some operate with lower growth or heavier public-market skepticism. But
              they establish a useful boundary: Coda’s US$2.5 billion private reference already places it above some
              listed payment platforms and below scaled leaders, which means the burden of proof is high. A private
              premium can be justified if investors believe Coda’s emerging-market gaming specialization, D2C
              optionality, and Recharge mix shift will drive better growth or better margin shape than lagging public
              comps. It cannot be justified on logo count or market count alone.
