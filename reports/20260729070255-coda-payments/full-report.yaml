  - id: TM003
    title: Segment / buyer map
    columns:
      - Segment
      - Budget owner
      - User / payer pattern
      - Why localization matters
      - Adoption path
    rows:
      - - Mobile game publishers
        - Monetization, payments, and live-ops leaders
        - Players pay via wallets, bank transfers, cards, carrier billing, and app stores
        - Mobile-first markets often prefer APMs over cards
        - Start with marketplace or hosted checkout, then expand to D2C webstore
      - - PC / cross-platform publishers
        - Commerce and payments teams
        - Players buy direct bundles, subscriptions, or top-ups outside app stores
        - Need multicurrency pricing and local methods for global web traffic
        - Often pair owned storefronts with PSP / MoR support
      - - Live-service and creator-economy platforms
        - Revenue, partnerships, and payout teams
        - Two-sided flows include top-ups, subscriptions, and sometimes payouts
        - Need local pay-ins, fraud control, and faster settlements
        - Adoption rises as off-app channels become strategically important
      - - Prepaid brands and gift-card distributors
        - Business-development and channel leaders
        - Consumers redeem or purchase stored value using local payment methods
        - Distribution and compliance vary by country and brand
        - Recharge-style platforms add B2C and B2B prepaid routes
      - - Players in APAC, LATAM, and MENA
        - Consumers themselves drive method choice
        - Wallets, bank transfers, cash-linked rails, and local habits vary sharply by region
        - Wrong method mix depresses conversion and trust
        - Demand appears only when a trusted local flow is surfaced
    notes: >-
      The buyer is usually the publisher, but the user-side payment habit determines conversion and therefore vendor
      selection.
