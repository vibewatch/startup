      - number: '3.3'
        title: Where direct and regional peers pressure Coda
        blocks:
          - type: paragraph
            body: >-
              The closest strategic pressure comes from platforms already rooted in gaming behavior. Xsolla’s solution
              stack and 2026 D2C report show a mature push into web shops, cross-platform payments, subscriptions,
              rewards, and DMA-era mobile monetization. UniPin, SEAGM, Itemku, and Razer Gold matter differently: they
              are closer to consumer top-up, voucher, and wallet ecosystems, but they prove that gamers in Coda’s core
              regions are accustomed to alternative storefronts and prepaid routes. Garena and Sea matter as ecosystem
              incumbents rather than like-for-like vendors; Garena operates across 160+ markets and sits inside a
              broader group with a digital-finance arm, which means some publishers may prefer to stay inside larger
              regional ecosystems where traffic, community, and payments already coexist. This is why Coda’s moat is
              real but not absolute. Many competitors can replicate one or two pillars of the stack, and some control
              stronger consumer brands or much larger balance sheets. It also means buyer education, loyalty mechanics,
              and local promotions can matter almost as much as pure payment acceptance when publishers compare vendors.
