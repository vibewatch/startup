      - number: '1.4'
        title: Strategic milestones and what changed after Recharge
        blocks:
          - type: paragraph
            body: >-
              Coda’s strategic trajectory has three visible phases. First came the emerging-markets payments bridge: the
              2011 Indonesia founding story, Codashop’s later launch, and Codapay’s API-led expansion. Second came
              scale-up and institutionalization: the 2022 US$690 million growth round, broader merchant-of-record
              positioning, and continuing publisher penetration across gaming. Third came diversification and
              consolidation: the 2025 Recharge acquisition, post-deal executive changes, and 2026 expansion of
              regulatory and security credentials. Recharge matters because it pulled Coda beyond core gaming into
              prepaid value distribution, gift cards, and European consumer storefronts, while adding a profitable
              direct-to-consumer business with 16,000+ products and 1,000+ brands. Partnerships with Unity and Digital
              Garage then extended the story further into game-developer tooling and Japanese distribution
              infrastructure. The bullish reading is that Coda is using gaming as a wedge into a larger digital-commerce
              and prepaid ecosystem. The cautious reading is that the business now spans more products, more
              jurisdictions, and more execution surfaces than its earlier story implied, which raises the burden on
              integration, compliance, and capital discipline.
