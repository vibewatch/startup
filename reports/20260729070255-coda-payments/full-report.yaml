              and consumer players that actually use the resulting purchase flows. On the enterprise side, public
              sources repeatedly emphasize gaming and digital-content publishers, with named logos including EA,
              Activision Blizzard, Riot Games, Zynga, Bigo, and others. On the consumer side, Codashop, webstores, and
