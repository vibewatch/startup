        title: Recharge added profitability, prepaid scale, and more balance-sheet flexibility
        blocks:
          - type: paragraph
            body: >-
              Recharge materially changes the financial shape of the combined group. Its June 2025 disclosure says 2024
              total sales rose 39% to €695 million, net revenue rose 32% to €73.6 million, EBITDA doubled to €8.1
              million, and net profit reached €7.5 million. A January 2025 release says Recharge also secured a €45
              million facility from ABN AMRO and targeted more than €1 billion of sales in 2025. Those facts matter
              because they add three things Coda’s standalone 2024 record could not fully prove: profitable scale,
              explicit external financing capacity for M&A, and adjacency outside core gaming vouchers into broader
              prepaid products and B2B rewards. The risk is that one should not simply add Coda’s 2024 numbers to
              Recharge’s 2024 numbers and call it one harmonized pro forma; the sources use different definitions,
