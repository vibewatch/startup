  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: 'Product stack: multiple monetization modules tied to one gaming-commerce workflow'
        blocks:
          - type: paragraph
            body: >-
              Coda’s product architecture is modular on the surface but cohesive in intent. Codapay is the payments and
              merchant-of-record layer, Codashop is the existing marketplace and top-up surface, Custom Webstore is the
              managed direct-to-consumer storefront, and Distribution extends reach through partner networks. Recharge
              then adds prepaid products, gift cards, and B2B digital rewards as a neighboring digital-value rail. The
              product value proposition is therefore not one checkout widget; it is a set of routes by which a publisher
              can reach users, offer local payment methods, and still outsource tax, fraud, compliance, and operational
              overhead. The retained public material repeatedly emphasizes market fragmentation, meaning the real
              “technology” is a combination of routing, orchestration, and region-specific adaptation rather than one
              novel payment algorithm. That interpretation fits the case studies as well: Lumen Pixel, EA’s FC Mobile
              webstore, and the Worldpay customer story all describe operational simplification and conversion support
              more than a standalone developer tool.
