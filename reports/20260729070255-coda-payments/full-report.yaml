  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: 'Revenue model: commissions, vouchers, and monetization services rather than one software line'
        blocks:
          - type: paragraph
            body: >-
              The public evidence suggests Coda monetizes several commerce layers rather than one clean subscription
              product. Coda’s product pages frame Codapay as payment-method and merchant-of-record infrastructure,
              Codashop as a marketplace or demand surface, Webstore as a managed D2C storefront, and Distribution as
              another publisher reach channel. The most concrete revenue split comes from 2024 ACRA-based reporting:
              digital-content monetization generated US$105.2 million while voucher-code sales generated US$63.8
              million. That split matters because it implies the business blends higher-touch merchant and monetization
              services with lower-level stored-value or voucher flows. Worldpay’s customer story reinforces the same
