      - number: '1.3'
        title: Capital base, disclosure quality, and regulatory credibility
        blocks:
          - type: paragraph
            body: >-
              The most concrete public capital marker remains the April 2022 minority-stake transaction, where Smash
              Capital, Insight Partners, and GIC invested US$690 million and existing investor Apis retained equity.
              Third-party trackers still peg that round at roughly a US$2.5 billion valuation, which is directionally
              consistent with Coda’s continuing inclusion in 2025 unicorn rankings, but the company itself does not
              publicly restate a post-2022 valuation. The newer and more decision- useful evidence is operational and
              regulatory. In May 2026, Coda announced that its Singapore entity secured a full Major Payment Institution
              licence, allowing merchant acquisition plus domestic and cross-border transfers under the Payment Services
              Act. In late 2025, it also announced ISO/IEC 27001 certification and a BSI Mark of Trust. Those milestones
              strengthen the case that Coda is evolving from a growth-stage gaming enabler into a more institutionally
              credible regulated payments platform. The adverse counterweight comes from 2024 ACRA-based financial
              coverage: revenue slipped modestly, losses narrowed but remained negative, and operating cash burn
              increased. That does not undermine the platform, but it does mean the public record supports “scaled but
              still tightening economics” more than “fully mature cash machine.”
