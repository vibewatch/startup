companyProfile:
  summary: >-
    Coda Payments is a private Singapore-headquartered gaming-payments and digital-commerce platform that began in
    Indonesia in 2011 and expanded into a broader merchant-of-record, local-payments, webstore, and prepaid-distribution
    stack. The company serves digital-content publishers and player/consumer end users through Codapay, Codashop, Custom
    Commerce, and—after the 2025 Recharge acquisition—a broader prepaid and gift-card network. Public evidence supports
    meaningful scale, strategic relevance in emerging markets, and a still-recognized unicorn valuation anchor, but
    current financial and customer- quality disclosure remains materially below public-market standards.
