      - number: '1.2'
        title: Leadership transition, governance visibility, and operating bench
        blocks:
          - type: paragraph
            body: >-
              Public materials make clear that Shane Happach is the current chief executive officer, while Neil Davidson
              remains a central founder figure and public strategic voice. The 2026 leadership update also shows the
              company still reworking its post-Recharge operating model: long-time CFO Abhi Sharma moved into a broader
              COO remit covering operations, payments, fraud, legal, compliance, and corporate development, while former
              Recharge CFO Freddy Dijkman became group CFO from Amsterdam. Those appointments are meaningful because
              they show Coda trying to integrate a more regulated, geographically broader business rather than merely
              bolting on a consumer asset. The public bench is therefore stronger than a simple gaming-payments startup
              archetype would suggest. At the same time, governance visibility is limited. Official surfaces do not
              publish a full board map, ownership percentages, or a complete historical leadership timeline, and at
              least one third-party tracker still names Neil Davidson as CEO despite official evidence that Shane
              Happach leads the company. That discrepancy is not fatal, but it is a useful reminder that private-company
              databases around Coda lag the company’s current state and should be treated as secondary rather than
              canonical.
