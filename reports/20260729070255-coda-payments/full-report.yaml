chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, origin story, and present-day scale
        blocks:
          - type: paragraph
            body: >-
              Coda’s official narrative is unusually consistent on the company’s original problem statement. The
              business says it began in Indonesia in 2011 because digital content purchases were effectively constrained
              to credit-card users even though card penetration was below 1% of the population. Founders Neil Davidson
              and Paul Leishman built a local-payments bridge to connect consumers to global online content, and the
              official story repeatedly frames that early emerging-markets pain point as the root of the company’s
              current product design. Over time the company extended that logic from game vouchers into Codapay,
              Codashop, Custom Commerce webstores, and distribution. Official 2025–2026 materials now describe Coda as a
              global out-of-app monetization and digital content distribution platform trusted by 300+ publishers,
              serving more than 200 million paying users, spanning more than 400 payment channels, and — after Recharge
              — operating across 180+ markets. The caution is not whether the company has scale, but which exact scale
              number is most current: official pages variously cite 120M+ active users in 2024, 200M+ paying users, 2B+
              processed transactions, 400+ to 600+ employees, and 70+ or 80+ markets depending on product and date. That
              pattern suggests a fast-changing business with real growth, but one whose public metric surface is not
              perfectly harmonized across pages.
