  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Thesis and anti-thesis turn on scale versus disclosure quality
        blocks:
          - type: paragraph
            body: >-
              The bullish case for Coda is straightforward. Public evidence shows a business that solved a real pain
              point in gaming and digital commerce, scaled across hundreds of publishers and hundreds of millions of
              users, raised a major 2022 growth round, maintained unicorn status in 2025 tracking, and then added
              Recharge’s profitable prepaid platform in 2025. The bearish case is equally straightforward: the best hard
              financial numbers in public still show a standalone company with slightly declining 2024 revenue, negative
              operating cash flow, and little transparent disclosure on take rates, concentration, or post-close
              integration economics. That means Coda is neither a speculative concept company nor a fully disclosed comp
              set member. It sits in the middle: strategically compelling, commercially proven, but valuation-sensitive
              because confidence must bridge a lot of missing detail. That in-between status matters for valuation
              mechanics: investors are underwriting both business quality and reporting risk at the same time, so the
              spread between a fair and an overpaying entry price is wider than it would be for a public company with
              comparable scale.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
