      - number: '8.4'
        title: Recommendation should be positive but price-sensitive
        blocks:
          - type: paragraph
            body: >-
              On the evidence retained here, the fairest stance is constructive but conditional. Coda looks more
              strategically differentiated than a commodity PSP, more commercially proven than a typical unicorn story,
              and more interesting after Recharge than before it. But the absence of a clean combined pro forma,
              concentration data, cohort metrics, and contract economics means investors should not pay any price
              implied by the company’s best narrative. A sensible approach is to keep the 2022-2025 private anchor in
              view, then negotiate from the disclosure gap rather than from the headline user count. That leads to a
              moderate-confidence, valuation-sensitive recommendation: pursue further diligence if entry pricing is at
              or below a defensible base case, but avoid chasing a premium that assumes flawless integration and
              public-market-quality economics without the data to prove either. Put differently, this is a name to lean
              into only when pricing leaves room for the missing answers; if management can close the disclosure gap,
              upside remains credible, but until then the burden of proof stays with the seller.
