              is central to the segmentation. Coda’s materials emphasize Southeast Asia, South Korea, Japan, LATAM,
              MENA, and other emerging or localized-payment-heavy markets where checkout preferences differ sharply from
              card-led Western norms. Recharge broadens the picture by adding prepaid buyers and brands, but the core
              public proof remains strongest in gaming. The practical implication is that the economic buyer is usually
