      - number: '3.2'
        title: Where Coda looks stronger than generic processors
        blocks:
          - type: paragraph
            body: >-
              Coda’s strongest positioning is around gaming-specific complexity. Its materials repeatedly join together
              Codapay, Codashop, Custom Webstore, Distribution, and merchant-of-record responsibilities, while the APAC
              and LATAM guides emphasize local entities, tax remittance, FX, fraud, and alternative payment methods.
              That is a heavier proposition than the official product surfaces for Stripe, PayPal, or Global Payments,
              which emphasize acceptance breadth, conversion, and enterprise scale for general commerce. Stripe is
              particularly strong on developer experience, optimization, and global reach, and PayPal remains formidable
              because of its consumer network and brand trust. But the public surfaces reviewed here do not show those
              firms packaging an out-of-app gaming storefront, top-up marketplace, and publisher distribution engine as
              one category narrative. Coda therefore competes by lowering orchestration burden for game publishers, not
              by claiming it has the broadest corporate payments platform in the world.
