  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: Coda is not “all gaming,” but the commerce layer around global digital spend'
        blocks:
          - type: paragraph
            body: >-
              Coda’s relevant market is narrower than global gaming content spend and broader than a simple
              payment-gateway niche. The company sits inside the commerce infrastructure layer that helps publishers
              monetize digital goods through local payment methods, merchant-of-record services, direct-to-consumer
              webstores, and marketplace/distribution channels. Its own product pages frame Codapay as payment-method
              access, Codashop as existing marketplace demand, Custom Webstore as a D2C storefront product, and
              Distribution as another route to user reach. That means the practical budget Coda competes for comes from
              publisher payments, monetization, tax/compliance, fraud, and app-store-margin optimization budgets rather
              than from game-development budgets themselves. The adjacent market became materially broader after
              Recharge, because prepaid gift cards, top-ups, and stored-value distribution add another consumer-payments
              and digital-value lane beyond core game credits. This boundary matters for diligence: a headline such as
              “global gaming revenue” is only an outer demand pool, while Coda’s true addressable opportunity depends on
              which publishers need localized checkout, regulatory cover, and owned-channel monetization rather than
              pure PSP processing.
