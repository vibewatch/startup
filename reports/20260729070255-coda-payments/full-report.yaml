        title: Roadmap, dependencies, and where complexity can break
        blocks:
          - type: paragraph
            body: >-
              Recent releases suggest Coda is pushing deeper into out-of-app monetization, subscriptions, recurring
              payments, and regulatory-change-driven commerce. The Unity integration, Google Play policy update, Apple
              DMA update, and recurring-payments blog all point toward a product roadmap shaped by external
              platform-policy change as much as by internal feature ideation. That is strategically attractive because
              app-store openness can expand Coda’s surface area; it is also a dependency because policy rollouts differ
              by geography and platform. Recharge’s new platform architecture and payment-institution application add
              further complexity on the prepaid side. Publicly, Coda presents this as momentum, but diligence should
              recognize the integration burden: catalog sync, authentication, redirects, sandbox/live environment
              separation, provider routing rules, local method maintenance, legal-page upkeep, and support operations
              all have to keep working together. The product appears valuable precisely because it absorbs this
              complexity; the risk is that complexity is also what can erode margins or reliability if not managed
              tightly. For investors, the product question is therefore not just feature velocity but whether the stack
              can keep policy adaptation, support quality, and localized reliability synchronized as scope expands.
