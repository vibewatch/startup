      - number: '2.2'
        title: Sizing lenses show attractive demand, but the lenses are non-additive
        blocks:
          - type: paragraph
            body: >-
              The retained public corpus supports several useful market lenses, but not one defensible single-number TAM
              for gaming merchant-of-record platforms. BCG’s 2026 gaming report says mobile represents 50% of global
              gaming revenues, that cloud-gaming revenues could expand from about US$1.4 billion in 2025 to roughly
              US$18.3 billion in 2030, and that UGC payouts from Fortnite and Roblox alone should exceed US$1.5 billion
              in 2025. Xsolla adds a monetization-specific lens: overall mobile-gaming growth was only 0.2% in 2025,
              while D2C revenue grew 26% and the top 100 mobile titles grew D2C earnings by 38% year over year. Coda’s
              own regional material says APAC generated more than US$84 billion of gaming revenue in 2023 with 1.48
              billion gamers, while its LATAM guide cites a US$16 billion market by 2030 across a population base of
              more than 619 million. Recharge then contributes a neighboring prepaid-distribution lens with 16,000+
              products, 1,000+ brands, and reach across 180+ countries. Taken together, these figures support “large and
              structurally expanding commerce opportunity,” but they should be treated as layered demand indicators, not
              summed into one false precision number.
