  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape: Coda faces direct peers, wallet ecosystems, and horizontal processors'
        blocks:
          - type: paragraph
            body: >-
              The competitive set around Coda breaks into three layers. First are the closest gaming-commerce peers,
              especially Xsolla and to a lesser extent UniPin, because they also combine gaming-specialized payment
              acceptance with direct-to-consumer storefront tooling and publisher-facing go-to-market support. Second
              are gaming-wallet and top-up ecosystems such as Razer Gold, SEAGM, Itemku, and Garena-adjacent
              distribution patterns, which may not offer the same merchant-of-record stack but do compete for consumer
              payment attention and publisher distribution budgets. Third are horizontal processors such as Stripe,
              PayPal, Global Payments, and the acquiring partners behind many merchant stacks. Those processors are not
              gaming-native, yet their breadth, scale, developer tooling, and global reach make them credible
              substitutes for publishers that only need acceptance and fraud tooling rather than a full commerce
              operating layer. This means Coda rarely wins on one feature alone; it wins if a publisher values local
              payment coverage, off-app commerce, compliance outsourcing, and an existing gamer demand surface in one
              package.
