      - number: '8.2'
        title: The last clear public price anchor is stale, but not obviously broken
        blocks:
          - type: paragraph
            body: >-
              Public valuation references still cluster around the 2022 financing anchor. The 2022 minority-stake
              transaction brought in US$690 million, while Hurun and tracker-style databases continued to keep Coda in
              the roughly US$2.5 billion range through 2025-2026. That is useful, but only as an anchor, not a
              mark-to-market truth. Since then, two things changed: first, standalone 2024 public financials showed
              softer revenue and continued losses; second, Recharge added profitable scale, a facility-backed M&A
              posture, and a broader prepaid product base. Both push in opposite directions for valuation. The stale
              anchor therefore remains informative precisely because no public up-round or down-round reset has replaced
              it. Investors should treat it as a prior, then judge how much integration upside or disclosure discount to
              apply relative to that prior.
            claimRefs:
              - CV009
              - CV010
              - CV011
