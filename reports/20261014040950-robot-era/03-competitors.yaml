        - Simple dual-paddle grippers for tote transfer
        - Fixed vacuum or 2-finger pneumatic grippers
      - - Locomotion & Terrain Flexibility
        - Bipedal (stairs, gravel, snow) & wheeled upper-body M7
        - Bipedal high-speed locomotion (H1/H2 bipedal platform)
        - Bipedal backwards-walking gait tuned for flat warehouse floors
        - Wheeled ground transport limited to level warehouse floors
      - - Component Vertical Integration
        - Over 95% in-house motors, reducers, joints, and hands
        - High in-house mechanical actuation and motor production
        - Proprietary leg linkages; standard commercial sensors
        - Standard industrial automation component supply chain
      - - AI Model & Control Stack
        - ERA-42 end-to-end VLA model and Ctrl-World generative model
        - Nvidia Isaac GR00T and Jetson Thor onboard Blackwell GPU
        - Proprietary autonomy stack integrated with fleet management
        - Deterministic rule-based warehouse execution systems (WES)
    notes: Feature capabilities reflect documented technical specifications and verified enterprise pilot configurations; non-humanoid AMR substitutes represent status-quo benchmarks.
