  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Competitor / Solution
      - Commercial Model
      - Contract / Unit Terms
      - Included Capabilities
      - Enterprise Implication
    rows:
      - - Robot Era
        - Modular hardware sale + software platform license
        - Enterprise contracts up to RMB 50M; volume thousand-unit tier
        - Full humanoid L7 or upper-body M7 with XHAND and ERA-42 VLA
        - High initial commitment mitigated by strategic automotive/logistics backer co-investment
      - - Unitree Robotics
        - Off-the-shelf unit pricing + research developer bundles
        - Published list hardware prices; research developer packages
        - H2 humanoid with Nvidia Thor runtime and Isaac simulation tools
        - Accessible developer entry point creates rapid academic ecosystem adoption
      - - Agility Robotics
        - Robotics-as-a-Service (RaaS) + warehouse integration fee
        - Multi-year enterprise lease tied to shift replacement targets
        - Digit robot fleet, charging docks, and cloud fleet director
        - Lower upfront capital expenditure appeals to traditional logistics operators
      - - Specialized AMR Sorters
        - Capital equipment purchase or operational lease
        - Standardized modular cell pricing with predictable maintenance SLA
        - Conveyors, autonomous mobile lifters, cross-belt sorters
        - Proven low-risk status quo with established multi-year payback benchmarks
    notes: Pricing structures reflect disclosed contract arrangements and standard robotics commercialization practices; custom enterprise integration costs vary by deployment facility.
