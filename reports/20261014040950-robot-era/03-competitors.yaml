callouts:
  - calloutType: strength
    title: In-House Component Integration Shields Gross Margins and Agility
    body: By developing over 95% of its core mechanical components internally—including motors, reducers, and direct-drive dexterous hands—Robot Era insulates itself from supplier markups and component bottlenecks that challenge peers relying on third-party dexterous hand modules. This vertical electromechanical integration enables tighter coordination between its ERA-42 vision-language-action model and physical actuators.
    claimRefs:
      - CP004
      - CP005
  - calloutType: risk
    title: Nvidia Ecosystem Standardization May Tilt the Global Developer Moat
    body: Nvidia's selection of Unitree as its primary hardware reference partner for the Isaac GR00T and Jetson Thor platform establishes a formidable competitive moat in academic and frontier research institutions. If global robotics software developers converge on Unitree's hardware as the default benchmark platform, Robot Era could face headwinds in maintaining developer mindshare and third-party software compatibility outside its domestic industrial investor network.
    claimRefs:
      - CP007
      - CP008
