              - CU011
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Commercial Validation Through Lead Logistics Deployments
            body: >-
              Robot Era has successfully moved beyond academic prototyping into multi-facility commercial deployment
              across more than 10 express logistics centers with anchor partners SF Express and China Post. The company
              reported achieving 85% of human worker sorting productivity while initiating thousand-unit hardware
              deliveries in the second quarter of 2026, marking a tangible milestone in real-world embodied robotics
              commercialization.
            calloutType: strength
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: callout
            title: Partner Concentration and Industrial Adoption Headwinds
            body: >-
              Commercial traction remains disproportionately concentrated in parcel logistics with strategic lead
              investor SF Express, leaving broader industrial adoption in automotive and electronics unproven.
              Furthermore, persistent hardware bottlenecks—specifically 2 to 3 hour battery runtimes, 30% to 40% initial
              worker efficiency in complex assembly, and completely undisclosed customer retention and contract renewal
              metrics—represent significant friction for enterprise scaling.
            calloutType: risk
            claimRefs:
              - CU008
