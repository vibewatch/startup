              - CI007
              - CI013
      - number: '4.2'
        title: Pricing Mechanics, Monetization Structure, and Market Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Robot Era does not publish an open commercial price catalog for its flagship humanoid models, relying
              instead on negotiated enterprise contracts that bundle hardware units with customized systems engineering
              and deployment support. In the broader Chinese robotics landscape, pricing benchmarks reflect sharp
              tiering across capability levels. Direct competitor Unitree listed its programmable G1 EDU humanoid
              between $43,900 and $83,900 across dealer configurators as of October 2026, while offering an entry-level
              consumer and demonstration unit at $17,990. Industry estimates place full-scale bipedal industrial systems
              like Robot Era's L7 in the $50,000 to $80,000 range per unit before customer-specific systems integration
              and facility calibration fees. Robot Era claims competitive cost advantages stemming from internal
              development of over 95% of its core mechanical and actuation components. Nevertheless, as China's Ministry
              of Industry and Information Technology recorded over 140 domestic manufacturers and 330 humanoid models
              following the 2025 production surge, intensifying domestic competition creates significant downward
              pricing pressure on hardware list rates, necessitating proof of realized contract realizations.
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI010
          - type: table
            tableRef: TI002
            claimRefs:
              - CI007
              - CI008
              - CI009
              - CI013
      - number: '4.3'
        title: Cost Structure, Manufacturing Integration, and Unit Economics
        blocks:
          - type: paragraph
            body: >-
              The cost structure of Robot Era's hardware platform is anchored by its vertical integration strategy, with
              the company claiming in-house development of over 95% of core components including proprietary
              direct-drive dexterous hands, motors, actuators, and structural humanoid frames. This high degree of
              component insourcing theoretically shields gross margins from supplier markups and reduces direct
              bill-of-materials costs compared to assemblers relying on off-the-shelf third-party robotic joints.
              However, unit-level profitability remains heavily constrained by non-recurring engineering expenses,
              specialized assembly labor, and bespoke site integration required for parcel sorting environments. The
              company has not released verified gross margin figures or detailed manufacturing bill-of-materials
              breakdowns. As physical deployment scales toward claimed thousand-unit delivery volumes, capital intensity
              shifts from lab prototyping toward working capital requirements for inventory procurement, field warranty
              support, and on-site maintenance staffing.
            claimRefs:
              - CI004
              - CI007
              - CI012
              - CI014
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI005
              - CI007
