      - number: '5.3'
        title: Operating Architecture and Technology Stack
        blocks:
          - type: paragraph
            body: >-
              Robot Era's technical differentiation rests on its integrated 'body plus brain' operating architecture and
              high degree of component self-sufficiency. The company claims that over 95 percent of core hardware
              elements, including high-torque joint actuators and structural linkages, are engineered and manufactured
              in-house. On the cognitive and algorithmic tier, Robot Era deploys ERA-42, an end-to-end
              vision-language-action foundation model that maps multimodal perception inputs to real-time trajectory
              execution. Mobility control builds on perceptive reinforcement learning algorithms, as showcased when the
              predecessor XBot-L navigated unassisted across weathered stone steps and uneven obstacles on the Great
              Wall. In manipulation, the XHAND 1 replaces conventional cable-driven tendons with a 12-DoF direct-drive
              linkage to maximize durability and positioning accuracy, attracting exploratory research adoption from
              leading global technology organizations including Nvidia, Apple, and Boston Dynamics.
            claimRefs:
              - CE009
              - CE010
              - CE011
              - CE012
