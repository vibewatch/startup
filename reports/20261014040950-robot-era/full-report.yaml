              - CI014
      - number: '4.4'
        title: Capital Adequacy, Financing Dependency, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Robot Era demonstrated extraordinary capital formation velocity across the first half of 2026, amassing
              over $340 million within a two-month window. This financing streak culminated in an April 2026 strategic
              round raising over CNY 1.4 billion led by express logistics titan S.F. Holding with top financial sponsors
              HongShan, IDG Capital, and CICC Capital, followed by a $137.5 million state-backed round led by Chengtong
              Fund that lifted the company's valuation past $1.38 billion. This substantial capital influx provides
              Robot Era with robust multi-year cash runway to fund ongoing research, tooling, and commercial deployments
              without immediate financing distress. Nevertheless, severe underwriting blockers persist. Geopolitical
              headwinds, highlighted by proposed U.S. congressional legislation seeking to exclude Chinese-made robotic
              systems from federal supply chains, threaten to constrain Robot Era's addressable market primarily to
              domestic Chinese and allied industrial networks. Furthermore, the absence of disclosed revenue run-rates,
              cash burn figures, and realized unit margins means that underwriting Robot Era rests on narrative
              financing momentum rather than audited commercial fundamentals.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI005
              - CI011
              - CI012
              - CI013
