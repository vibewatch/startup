        title: Exhibits
        blocks:
          - type: callout
            title: Capital Abundance Masking Commercial Unit Economics
            body: >-
              Robot Era's rapid accumulation of over $340 million across early 2026 provides a comfortable multi-year
              cash buffer, yet state-backed and strategic funding risks obscuring unproven commercial unit economics and
              undisclosed gross margins.
