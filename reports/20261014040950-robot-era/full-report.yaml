      - number: '1.2'
        title: Financing and Stakeholders
        blocks:
          - type: paragraph
            body: >-
              Financing evidence confirms rapid private-market revaluation but does not yield a reliable
              cumulative-capital figure. Caixin reported a nearly RMB 1 billion Series A+ round in November 2025 and a
              further RMB 1 billion strategic round in March 2026 at a valuation above RMB 10 billion, while Crunchbase
              described the March event as $145 million at a $1.5 billion valuation. In May, company-derived
              announcements reported another round of more than $200 million led by SF Group. A separate tear sheet
              displays two incompatible total-funding figures, $547 million and more than $1.5 billion, so neither is
              used as a verified total. Round sequencing, dilution, debt, secondaries, and investor protections require
              cap-table review.
