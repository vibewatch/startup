chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Robot Era is a young Beijing-based humanoid-robotics developer founded in August 2023 by Chen Jianyu, whom
              Caixin identifies as a Tsinghua University assistant professor. Its public product story combines humanoid
              platforms, dexterous manipulation hardware, and embodied-AI models for logistics, industrial, and service
              workflows. The available evidence therefore points to a hardware-led deployment model supported by
              proprietary components and software rather than a disclosed recurring-software model. No retained source
              provides audited revenue mix, pricing, recurring revenue, gross margin, or customer-count definitions, so
              those metrics are treated as diligence gaps instead of inferred scale.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
