  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition and Modular Hardware Lineup
        blocks:
          - type: paragraph
            body: >-
              Robot Era structures its commercial offering around a tiered hardware portfolio designed to span
              industrial logistics, manufacturing manipulation, commercial services, and academic research. Incubated at
              Tsinghua University's Institute for Interdisciplinary Information Sciences, the company has transitioned
              from laboratory demonstrations to modular commercial platforms. The flagship ROBOTERA L7 is a 171 cm
              full-sized bipedal humanoid engineered with a 20 kg dual-arm payload and a top running speed of 4 meters
              per second, aimed at combining dynamic bipedal locomotion with fine tool manipulation. Alongside the full
              bipedal system, Robot Era offers the M7 upper-body manipulator for stationary or conveyor-side induction,
              the Q5 wheeled platform for structured service and healthcare environments, and the standalone XHAND 1
              dexterous robotic hand. This modular segmentation allows the enterprise to monetize distinct hardware
              tiers while addressing varied operational environments.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.2'
        title: Workflow Integration and Industrial Deployment
        blocks:
          - type: paragraph
            body: >-
              Industrial adoption of Robot Era's humanoid hardware is centered primarily on express logistics hubs and
              structured warehousing workflows. Through commercial partnerships with major logistics operators China
              Post and SF Group, the company has deployed its M7 upper-body systems across more than 10 distribution
              centers, executing small parcel induction and barcode scanning. Commercial momentum accelerated following
              reports of 200 units shipped during 2025 and the initiation of thousand-unit deliveries in the second
              quarter of 2026. However, real-world productivity benchmarks across China's humanoid robotics sector
              demonstrate that current platforms achieve approximately 30 to 40 percent of human worker throughput.
              Furthermore, persistent battery endurance ceilings of two to three hours per charge necessitate structured
              battery-swapping or frequent recharging intervals, constraining continuous multi-shift autonomous
              operation without human supervision.
