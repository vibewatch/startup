  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Operating Assumptions
      - Valuation / Return Logic
      - Key Downside Risks
      - Probability Signal
    rows:
      - - Bull Case
        - >-
          Rapid scale-up of thousand-unit deliveries; ASP stays above $50k; logistics expansion converts to high-margin
          recurring service contracts
        - >-
          Valuation expands toward top-tier embodied AI comps ($5B-$10B+ range), delivering >3x MOIC on strategic round
          pricing
        - >-
          Execution bottlenecks in multi-province deployments; international trade frictions restricting global
          expansion
        - 20% probability (requires sustained volume scaling and unassisted industrial autonomy)
      - - Base Case
        - >-
          Delivery growth stabilizes around logistics and light manufacturing; component cost advantages offset margin
          pressure; gross margins reach 25-30%
        - >-
          Valuation marks track public robotics peer benchmarks (1.0x-2.0x invested capital, comparable to UBTECH at
          $4.35B market cap)
        - Customer concentration in SF Group and China Post; slower conversion to commercial recurring contracts
        - 55% probability (reflects solid industrial adoption constrained by capital intensity)
      - - Bear Case
        - >-
          Pilot churn increases; high hardware warranty and deployment support costs wipe out gross profit; capital
          needs trigger down-round
        - >-
          Valuation contracts sharply below last round post-money; severe dilution or preference overhang for common
          holders
        - >-
          Multiple compression mirroring historical consumer/industrial robotics declines (e.g., iRobot revenue decay);
          funding drought
        - 25% probability (elevated by capital intensity and lack of disclosed unit economics)
    notes: Scenario model calibrated against public peer valuation drawdown and private round fundraising benchmarks.
