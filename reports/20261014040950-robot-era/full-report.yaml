      - number: '1.3'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              Chen Jianyu is the only named operating leader consistently visible in the assigned evidence. Caixin
              supplies the founder and academic affiliation, while the independent tear sheet lists him under
              leadership. That supports founder-market-fit around embodied intelligence, but it does not establish the
              composition of the executive team, board, audit oversight, or succession plan. The absence of those
              records is not proof that governance mechanisms are absent; it means public evidence is insufficient to
              assess them. Given the company's short history and founder-centered public identity, management diligence
              should test decision concentration, technical succession, and investor control rights.
