        title: Milestones, Scale Signals, and Risk
        blocks:
          - type: paragraph
            body: >-
              Product and deployment milestones show movement beyond laboratory demonstrations, but the strongest scale
              claims remain company-issued. A syndicated announcement and a release-derived article say Robot Era is
              deployed in more than ten logistics centers with China Post and SF Group, began thousand-unit deliveries
