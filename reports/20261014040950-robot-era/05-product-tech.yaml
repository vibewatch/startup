callouts:
  - calloutType: "risk"
    title: "Industrial Battery Bottleneck and Geopolitical Supply Chain Scrutiny"
    body: "While Robot Era has demonstrated rapid mechanical prototyping and high component vertical integration, its field viability faces two acute headwinds: bipedal operating endurance remains constrained to 2–3 hours per charge, and prospective Western customer deployments face mounting friction under emerging United States procurement restrictions such as the American Security Robotics Act."
    claimRefs:
      - "CE008"
      - "CE013"
  - calloutType: "insight"
    title: "Direct-Drive Manipulation Strategy"
    body: "By developing its XHAND series with a full direct-drive architecture across 12 active degrees of freedom, Robot Era bypasses the maintenance vulnerabilities and tendon elasticity typical of cable-driven humanoid hands, creating a more durable manipulation subsystem tailored for repetitive logistics parcel induction."
    claimRefs:
      - "CE005"
      - "CE010"
