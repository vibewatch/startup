evidenceGaps:
  - type: enumeration-incomplete
    severity: material
    topic: governance
    missingEvidence: >-
      Complete executive roster, board composition, committee mandates, voting control, succession coverage, and
      material leadership changes.
    whyItMatters: Founder concentration and investor control cannot be assessed from the single publicly named leader.
    diligencePath: >-
      Request the organization chart, board minutes, shareholder agreement, biographies, and executive departure
      history.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: >-
      Audited revenue by stream, recognized backlog, realized pricing, gross margin, customer count, headcount, cash
      burn, and runway.
    whyItMatters: >-
      Deployment sites, delivery language, and funding raised do not establish recurring demand, profitability, or cash
      available.
    diligencePath: >-
      Review audited statements, bank records, customer-level invoices, acceptance certificates, payroll files, and the
      current operating plan.
    relatedQuestionRefs:
      - QO010
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A reconciled financing schedule with gross proceeds, debt, secondaries, security classes, and post-money ownership
      for every round.
    whyItMatters: The retained tear sheet's incompatible totals prevent a defensible cumulative-raised figure or dilution analysis.
    diligencePath: >-
      Reconcile signed financing documents, capitalization ledgers, bank receipts, and investor confirmations against
      each announced round.
    relatedTableRefs:
      - TO001
      - TO003
  - type: missing-source
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Audited realized average selling prices (ASP), gross margins, and recurring software support fees for Robot Era L7
      and M7 humanoid shipments.
    whyItMatters: >-
      Essential to model unit contribution margins and establish whether physical delivery volume translates into
      positive gross profit or accelerates hardware cash burn.
    diligencePath: >-
      Review commercial customer contracts, delivery receipts, and billing schedules from SF Group and China Post
      partner hubs.
    relatedQuestionRefs:
      - QM008
  - type: conflicting-data
    severity: material
    topic: commercial-adoption
    missingEvidence: >-
      Independent verification of robot operational uptime, mean time between failures (MTBF), and sorting error rates
      under actual logistics shift conditions.
    whyItMatters: >-
      Determines whether deployed humanoids achieve positive operational ROI compared to traditional automated sorting
      conveyors or human parcel handlers.
    diligencePath: Request telemetry logs, maintenance incident logs, and SLA fulfillment reports from enterprise field pilots.
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing-and-unit-margins
    missingEvidence: >-
      Audited bill-of-materials cost breakdown, realized average selling price (ASP), and gross margin performance for
      production L7 and M7 humanoid units compared to Unitree H2.
    whyItMatters: >-
      Without realized unit economics, assessing whether Robot Era's 95% component integration translates into
      sustainable cost leadership or cash burn remains impossible.
    diligencePath: >-
      Obtain customer contract invoices, supplier component pricing agreements, and audited manufacturing cost
      accounting during on-site operational diligence.
    relatedQuestionRefs:
      - QP005
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: long-term-fleet-reliability-metrics
    missingEvidence: >-
      Independent Mean Time Between Failures (MTBF) and maintenance cost logs across multi-month production deployments
      in SF Group and China Post facilities.
    whyItMatters: >-
      Enterprise buyers require proven hardware reliability and service uptime before expanding from pilot trials into
      multi-thousand unit fleet rollouts.
    diligencePath: >-
      Request unredacted telemetry logs, warranty failure rate records, and preventative maintenance schedules from
      enterprise customer site managers.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: financial-disclosure-gaps
    missingEvidence: >-
      Audited financial statements detailing revenue breakdown by product line (L7 vs M7 vs Q5 vs XHAND), realized
      average selling prices (ASPs), gross margins, and monthly cash burn.
    whyItMatters: >-
      Without audited revenue splits and realized gross margins, investors cannot underwrite whether Robot Era's
      thousand-unit delivery milestone represents profitable recurring deployments or subsidized pilot testing.
    diligencePath: >-
      Request audited 2025-2026 income statements, customer-level contract ledgers, realized billing schedules, and unit
      BOM schedules under NDA during confirmatory due diligence.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: developer-signal-and-software-transparency
    missingEvidence: >-
      Public open-source code repositories, model weights or Hugging Face cards for ERA-42, public developer SDKs, and
      third-party developer community traffic.
    whyItMatters: >-
      Without developer-facing code repositories or independent benchmark submissions, practitioner adoption and
      software maturity cannot be verified independently of corporate announcements.
    diligencePath: >-
      Request access to developer SDK documentation, API endpoints, sim-to-real benchmarking logs, and customer codebase
      integration references under NDA.
    relatedQuestionRefs:
      - QE009
  - type: private-evidence-only
    severity: material
    topic: industrial-uptime-and-battery-endurance
    missingEvidence: >-
      Audited mean time between failures (MTBF), multi-shift battery depletion and charging logs, and maintenance
      incident records from enterprise logistics pilots.
    whyItMatters: >-
      Broad industry evidence demonstrates that 2-3 hour battery runtimes and mechanical joint wear severely constrain
      multi-shift automated deployment viability.
    diligencePath: >-
      Review continuous shift telematics logs and battery degradation reports from China Post and SF Group operational
      facilities.
  - type: private-evidence-only
    severity: material
    topic: customer-retention-and-nrr
    missingEvidence: >-
      Audited net revenue retention, gross retention rate, contract duration, and cohort renewal figures across
      commercial enterprise deployments.
    whyItMatters: >-
      Without verifiable contract retention and renewal history, long-term commercial durability and lifetime customer
      value cannot be confirmed.
    diligencePath: >-
      Request confidential enterprise customer cohort retention schedules and multi-year contract renewals during
      private diligence review.
    relatedQuestionRefs:
      - QU009
  - type: enumeration-incomplete
    severity: minor
    topic: named-customer-proof-table
    missingEvidence: >-
      Comprehensive site-level inventory of all non-public customer deployment facilities, unit counts per facility, and
      operational acceptance sign-offs.
    whyItMatters: >-
      Public disclosure highlights marquee anchor partners (SF Express, China Post) and research adopters, while broader
      fleet distribution remains opaque.
    diligencePath: >-
      Review master service agreements and site delivery confirmation receipts across all 10+ operational logistics
      centers.
    relatedTableRefs:
