      - number: '4.2'
        title: 定价机制、变现结构与市场基准
        blocks:
          - type: paragraph
            body: >-
              Robot Era 没有公开旗舰人形模型的商业价目表，而是依靠把硬件与定制系统工程、部署支持打包的议价式企业合同。在更广泛的中国机器人市场，不同能力层级的价格分层明显。截至 2026 年 10 月，直接竞争者
              Unitree 在经销商配置器中将可编程 G1 EDU 人形机器人定价为 $43,900 至 $83,900，同时提供 $17,990 的入门消费及演示机。行业估计，Robot Era L7
              这类全尺寸双足工业系统，在客户定制系统集成和场地校准费用之前，单台约为 $50,000 至 $80,000。Robot Era 声称，自研超过 95%
              的核心机械及驱动部件带来成本优势。然而，中国工信部记录显示，2025 年产量激增后国内已有超过 140 家制造商和 330 款人形模型，国内竞争加剧会显著压低硬件挂牌价，必须以实际合同成交情况证明其定价。
