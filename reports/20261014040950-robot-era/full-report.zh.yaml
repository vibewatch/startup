            body: >-
              融资证据确认公司在私募市场快速重估，但无法得出可靠的累计资本额。财新报道，2025 年 11 月公司完成接近 RMB 1b 的 A+ 轮融资，2026 年 3 月又完成 RMB 1b 战略轮，估值超过 RMB
              10b；Crunchbase 则将 3 月交易记为 $145m、估值 $1.5b。5 月，公司相关公告称又完成一轮超过 $200m、由 SF Group 领投的融资。另一份融资摘要同时列出 $547m 和超过
              $1.5b 两个互不相容的累计融资额，因此二者都不作为已验证总额。轮次顺序、稀释、债务、老股转让和投资人保护条款仍需核查资本结构表。
            claimRefs:
