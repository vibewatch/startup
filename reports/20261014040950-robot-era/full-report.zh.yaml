        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              在指定证据中，陈建宇是唯一持续出现的具名运营负责人。财新提供了创始人及学术任职信息，独立融资摘要也把他列入领导层。这支持公司在具身智能方向具备创始人—市场匹配，但不能证明高管团队、董事会、审计监督或继任计划的构成。缺少这些记录不等于治理机制不存在，而是公开证据不足以评估。鉴于公司历史较短、公开身份高度围绕创始人，管理层尽调应重点测试决策集中度、技术继任和投资人控制权。
            claimRefs:
              - CO001
              - CO002
          - type: table
