  - id: FE001
    title: Robot Era 产品架构图
    type: stack
    summary: 覆盖认知模型、执行硬件与部署场景的多层具身机器人架构。
    data:
      layers:
        - label: 应用与部署场景
          detail: 物流包裹分拣、工厂装配检查、科研与教育实验室部署
          modules:
            - 快递物流包裹上件
            - 工厂装配拧螺丝
            - 学术研究实验
        - label: 具身 AI 与认知基础
          detail: ERA-42 端到端视觉-语言-动作（VLA）模型及从仿真到现实的感知强化学习
          modules:
            - ERA-42 多模态基础模型
            - 仿真到现实的域随机化
            - 任务分解规划器
        - label: 感知与运动规划栈
          detail: 实时避障、视觉地形映射、动态平衡与步态适应算法
          modules:
            - 视觉地形映射管线
            - 动态双足平衡控制器
            - 实时轨迹生成器
        - label: 灵巧操作子系统
          detail: 用于工具操作与包裹抓取的 XHAND 1、XHAND 1 Lite 12 自由度直驱机械手
          modules:
            - 12 自由度直驱电机
            - 触觉接触感知模块
            - 自适应抓取原语
        - label: 关节驱动与运动学控制
          detail: 专有高扭矩关节执行器、电机驱动器与闭环运动学控制回路
          modules:
            - 高扭矩无框力矩电机
            - 集成谐波 / 行星减速器
            - 高带宽磁场定向控制
        - label: 底盘、结构与动力核心
          detail: 171 cm 双足框架、轮式底座选项（Q5）、碳纤维 / 合金结构连杆与电池模块
          modules:
            - 171 cm 双足骨架底盘
            - 2-3 小时锂电动力模块
            - 模块化上半身支架（M7/L7）
