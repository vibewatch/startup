  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、分类与结构性邻接
        blocks:
          - type: paragraph
            body: >-
              评估 Robot Era
              的可服务市场，首先要把通用具身人形机器人与专业工业自动化的存量体系严格分开。传统仓储机器人依赖固定式龙门分拣机、自动存取系统（ASRS）以及轮式自动导引车（AGV）或自主移动机器人（AMR）。这些传统系统运营可靠性高，却缺少非结构化流程所需的自适应双手操作、空间感知和灵巧抓取。Robot
              Era 通过全尺寸双足人形 L7、轮式服务人形 Q5、上半身人形 M7 及独立的 XHAND 多自由度灵巧手，切入灵活劳动力替代市场。2026
              年博鳌亚洲论坛上，机器人企业高管强调，人形机器人正从戏剧化演示转向制造、汽车套件装配和快递物流中的真实工业价值，这一结构性转向早就该发生。Robot Era
              正好把平台放在这一运营交叉点，避开投机性的家庭消费场景，瞄准重复性人工任务明确、需求清晰的结构化包裹分拣和物流枢纽。
            claimRefs:
              - CM003
              - CM004
              - CM005
          - type: table
            tableRef: TM001
            claimRefs:
              - CM003
              - CM004
              - CM005
      - number: '2.2'
        title: 可服务市场规模口径与实证收入锚点
        blocks:
          - type: paragraph
            body: >-
              当前具身人形机器人市场规模估算，在宏观物理 AI 预测与实际生产之间差异极大。Barclays 发布的主题研究估计，全球人形机器人市场在 2025–2026 年为 $2 billion 至 $3
              billion，并预测随着部署从首轮工业自动化扩展到商业服务和医疗，到 2035 年将加速增长至 $200
              billion。科技巨头和投资分析师提出的长期概念估算，则把未来十年的可服务机会推到数万亿美元。中国是当前硬件采用的中心，约占全球人形机器人安装量的 85%，平均制造成本约
              $50,000，约为西方同类产品的一半。但机构尽调必须以已验证收入为锚，而非自上而下的可服务支出。最成熟的公开基准 UBTECH Robotics 报告称，2025 年全尺寸人形机器人收入为 RMB 820.6
              million（约 $115 million），同比激增 2,203.7%，成为其最大单项收入。Robot Era 宣布向 China Post 和 SF Group 分批交付 1,000
              台，说明物理规模已出现；但由于实际成交价未披露，机构估值仍应把近期收入视为未经验证。
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM008
              - CM014
          - type: table
            tableRef: TM002
            claimRefs:
              - CM001
              - CM002
              - CM005
              - CM007
              - CM008
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM001
              - CM002
              - CM007
              - CM014
      - number: '2.3'
        title: 企业买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              企业采用 Robot Era 系统，呈现出采购负责人、运营流程和经济门槛各不相同的多层客户结构。首个商业突破口是由 SF Group 和 China Post 代表的快递及 3PL
              物流。在这些场景，采购通常由供应链和物流工程副总裁推动，他们会把机器人与旺季加班工资、员工流失和 24/7 分拣吞吐目标比较。汽车制造是相邻的高价值层级，Geely、BAIC 等 OEM
              探索用双足及上半身平台完成零件套料、子装配搬运和产线末端检测，以减少混线生产的换装成本。第三层市场涵盖商业设施和公共接待场所，轮式 Q5 在营销及设施管理预算下承担访客接待和信息引导。SF Group
              和国有产业基金主导的战略轮融资表明，早期客户采用与战略股权绑定高度相关。这种结构性支持加快了进入包裹分拣中心的试点，但也暂时掩盖了企业买方是否真正作出完全独立的商业采购承诺。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM010
      - number: '2.4'
        title: 采用驱动、运营约束与商业尽调缺口
        blocks:
          - type: paragraph
            body: >-
              人形机器人扩张受到制造业劳动力短缺和工业中心工资持续上涨等人口结构压力推动。但技术与经济约束仍严重卡住大规模商业部署。CB Insights
              和多家风投机构的独立分析警告，人形硬件在实时推理延迟、精细触觉灵巧度、物理耐久性和总拥有成本方面都面临高门槛。因此实际部署仍限于可预测、任务集受限的环境。与此同时，中国经济规划部门警告，风投估值可能脱离可验证生产率而形成资本泡沫。训练具身基础模型还需要高维、多模态的物理交互数据集，这类数据远比网页抓取文本稀缺，也更耗资本。尽管风投热潮催生了大量
              AI 独角兽，并把 Robot Era 估值推过 RMB 10b，关键尽调缺口仍在。Robot Era
              尚未披露实际平均售价、毛利率结构、客户集中度或保修准备金。在经审计的商业单位经济性证明实际交付量之前，市场规模必须纳入大幅风险折扣。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
              - CM015
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 物流包裹入料是实证突破口
            body: >-
              Robot Era 在 China Post 和 SF Group
              的包裹分拣商业进展，聚焦结构化工业物流；重复性双手操作能带来明确的劳动力替代收益，这是务实的切入点。但要确认千台级交付究竟对应有经常性收入的商业合同，还是获得补贴的试点，仍是潜在投资人必须完成的尽调检查。
            calloutType: insight
            claimRefs:
              - CM003
              - CM005
          - type: callout
            title: 风投资金溢价高于未经审计的商业经济性
            body: >-
              风投热潮把 Robot Era 估值推过 RMB
              10b（$1.4b），但宏观和监管警告凸显了尚未产生收入的硬件初创公司的脆弱性。在单位经济性、毛利率和客户留存数据都未验证前，市场叙事可能提前为投机性的长期潜力定价，而不是工业现实。
            calloutType: risk
            claimRefs:
              - CM006
              - CM010
              - CM011
              - CM015
  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览与同业分层
        blocks:
          - type: paragraph
            body: >-
              具身智能和通用机器人行业正快速分化为大众平台商、专业工业操作设备商和现有自动化设备。Robot Era 既直接对标全尺寸人形开发商，也要防守根深蒂固的工业自动化替代方案。主要国内对手 Unitree
              Robotics 专注高量双足运动；Agility Robotics、1X Technologies
              等西方竞争者则瞄准特定物料搬运闭环和消费辅助试点。与此同时，传统自动导引车和移动分拣机仍是强力替代品，能提供可预测的回收周期，避开双足机械的可靠性风险。Robot Era
              的定位，是缩小双足灵活性与工业包裹精细操作之间的差距。
            claimRefs:
              - CP001
              - CP002
              - CP006
              - CP014
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP006
      - number: '3.2'
        title: 硬件差异化与灵巧操作能力
        blocks:
          - type: paragraph
            body: >-
              Robot Era 的主要技术护城河来自深度机电垂直整合和专用直驱操作架构。不同于用第三方伺服电机及现成末端执行器组装商业人形机器人的竞争者，公司自研超过 95%
              的核心机械部件，包括驱动系统、关节减速器和机器人手。旗舰 XHand 架构采用全直驱机械，拥有 12 个主动自由度，在物流分拣任务中的操作效率约达到人类水平的 70%。结合清华孵化的 ERA-42
              视觉—语言—动作模型，这种机械精度支持可靠的包裹入料和部件装配，是传统多连杆夹爪难以复制的。
            claimRefs:
              - CP004
              - CP005
              - CP013
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP008
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP004
              - CP015
      - number: '3.3'
        title: 商业规模、部署证明与合同打包
        blocks:
          - type: paragraph
            body: >-
              人形机器人市场的商业牵引力，取决于运营部署证明，而不是实验室舞台演示。Robot Era 2025 年已获得超过 RMB 500m 商业订单，并与 China Post、SF Group
              合作，在十多个物流枢纽实地部署，领先许多早期同业。2026 年第二季度，公司开始千台级交付，增长超过 300%。Robot Era 不只销售硬件，还把模块化 L7 双足和 M7
              上半身系统打包成标准化物流及工业解决方案，拿下单笔合同金额接近 RMB 50m 的大型企业客户。
            claimRefs:
              - CP003
              - CP009
              - CP010
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: 差异化持久性、转换成本与平台风险
        blocks:
          - type: paragraph
            body: >-
              Robot Era 受益于与 Geely、BAIC、SF Group 等工业股东形成的黏性企业集成，但长期差异化面临严峻生态压力。Nvidia 正式选定 Unitree H2 人形机器人作为 Jetson
              Thor 和 Isaac GR00T 机器人栈的主要参考平台，给 Unitree 在全球学术及企业开发者中建立了先发优势。更广泛的商业化也受非结构化环境的物理约束，大多数商业部署仍局限在结构化物流通道。Robot
              Era 必须迅速把汽车和邮政领域的专有合作转化为持续运营锁定，赶在标准化算力平台把双足硬件商品化之前完成这一点。
            claimRefs:
              - CP007
              - CP008
              - CP011
              - CP014
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: 自研部件整合保护毛利与灵活性
            body: >-
              Robot Era 自研超过 95% 的核心机械部件——包括电机、减速器和直驱灵巧手——因此能避开供应商加价及部件瓶颈，而依赖第三方灵巧手模块的同业正受其困扰。这种机电垂直整合，也让 ERA-42
              视觉—语言—动作模型与物理执行器之间的协同更紧。
            calloutType: strength
            claimRefs:
              - CP004
              - CP005
          - type: callout
            title: Nvidia 生态标准化可能改变全球开发者护城河
            body: >-
              Nvidia 选择 Unitree 作为 Isaac GR00T 和 Jetson Thor 平台的主要硬件参考伙伴，在学术和前沿研究机构中构筑了强大的竞争壁垒。若全球机器人软件开发者把 Unitree
              硬件收敛为默认基准平台，Robot Era 在本土工业投资人网络之外维持开发者心智和第三方软件兼容性时，可能遇到阻力。
            calloutType: risk
            claimRefs:
              - CP007
              - CP008
