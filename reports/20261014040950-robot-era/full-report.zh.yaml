        title: 差异化、质量控制与地缘政治风险
        blocks:
          - type: paragraph
            body: >-
              尽管技术成果突出、资本支持充足，Robot Era 仍面临信任、软件验证和监管壁垒。2026 年 7 月，公司获得由 CCT Fund Management 领投的 1 billion CNY 风投资金；此前 5
              月由 SF Group 领投完成 200 million USD 轮，为产能扩张提供充足资金。但公开软件文档、开源 SDK 和第三方基准评估仍无法获取，外部难以独立验证 ERA-42
              的自主性。国际运营环境也明显收紧。《United States American Security Robotics Act》等立法倡议拟禁止中国地面机器人及人形机器人进入联邦采购和关键基础设施，可能把
              Robot Era 隔绝在西方企业供应链之外，使其近期商业化局限于中国国内及非结盟市场。
