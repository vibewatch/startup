      - number: '1.4'
        title: 里程碑、规模信号与风险
        blocks:
          - type: paragraph
            body: >-
              产品和部署里程碑显示公司已走出实验室演示阶段，但最强的规模说法仍来自公司自身。一则联合发布的公告及一篇据发布稿撰写的文章称，Robot Era 已与 China Post 和 SF Group
              在十多个物流中心部署，2026 年第二季度开始交付千台级产品，增长超过
              300%；这些说法不等同于经审计的出货量、客户验收数量或确认收入。同一批来源还称公司实现了广泛垂直整合并获得大型科技公司的采用。独立行业报道仍较谨慎：人形机器人部署仍集中在结构化任务，数据、安全、隐私、需求和利润率压力限制了更广泛的采用。Unitree
              证据仅用于行业方向性背景，不作为 Robot Era 的独立基准。
