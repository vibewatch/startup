            body: >-
              Robot Era 人形硬件的工业采用，主要落在快递物流枢纽和结构化仓储流程。公司通过与 China Post、SF Group 等大型物流运营商合作，在十多个配送中心部署 M7
              上半身系统，执行小包裹入料和条码扫描。行业报道显示，公司 2025 年已发运 200 台，2026
              年第二季度启动千台级交付，商业势头随之加速。但中国人形机器人行业的真实生产率基准表明，现有平台约达到人类工人吞吐量的 30 至
              40%。此外，每次充电仅能持续两到三小时，迫使场地换电或频繁充电；没有人工监督，就难以连续运行多个班次。
