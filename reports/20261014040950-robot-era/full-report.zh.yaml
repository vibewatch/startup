    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Robot Era 是一家成立于 2023 年 8 月、总部位于北京的年轻人形机器人开发商。财新称其创始人陈建宇为清华大学助理教授。公司公开的产品叙事把人形平台、灵巧操作硬件和具身 AI
              模型结合起来，面向物流、工业及服务流程。现有证据更支持一种由硬件主导、靠自研部件和软件支撑的部署模式，而非已披露的经常性软件模式。现有资料没有给出经审计的收入结构、定价、经常性收入、毛利率或客户数口径，因此这些指标只能作为尽调缺口，不能据此推断规模。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
