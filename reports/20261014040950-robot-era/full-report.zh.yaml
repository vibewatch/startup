      - - 乐观情景
        - 千台级交付快速放量；ASP 保持在 $50k 以上；物流扩张转化为高毛利经常性服务合同
        - 估值向顶级具身 AI 同业靠拢（$5B-$10B+ 区间），按战略轮价格实现 >3x MOIC
        - 多省部署出现执行瓶颈；国际贸易摩擦限制全球扩张
        - 20% 概率（需要持续放量及无需辅助的工业自主能力）
      - - 基准情景
        - 交付增长稳定在物流与轻制造领域；部件成本优势抵消利润率压力；毛利率达到 25-30%
        - 估值按上市机器人同业基准调整（投入资本的 1.0x-2.0x，相当于市值 $4.35B 的 UBTECH）
        - 客户集中于 SF Group 与 China Post；转化为商业经常性合同的速度较慢
        - 55% 概率（反映工业采用扎实，但受资本强度制约）
      - - 悲观情景
        - 试点流失加剧；高昂的硬件保修与部署支持成本吞噬毛利；资金需求触发下轮融资
        - 估值大幅跌破上一轮投后水平；普通股股东面临严重稀释或优先权悬念
        - 倍数收缩重演消费/工业机器人历史下跌（如 iRobot 收入衰退）；融资枯竭
        - 25% 概率（资本强度高且未披露单位经济模型，概率上升）
    notes: 情景模型参考上市同业估值回撤与私募轮融资基准校准。
    claimRefs:
      - CV002
      - CV003
      - CV004
      - CV013
      - CV014
