  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管与法律风险架构
        blocks:
          - type: paragraph
            body: >-
              人形机器人正从投机性技术演示进入监管严格的工业环境。2026 年 2
              月，中国工信部建立人形机器人和具身智能国家标准体系，要求国内平台遵守统一的行为安全和最低风险状态协议。与此同时，全球部署带来跨司法辖区责任。在美国，截至 2026 年 1 月已有 20
              个州执行综合数据隐私法规，原告也越来越多地通过中心辐射式诉讼追究第三方技术和基础设施供应商。部署在企业场所、传感器丰富的移动人形平台，在《California Invasion of Privacy
              Act》等监控规则下暴露出严重法定风险，必须严格隔离边缘数据并验证合规。
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR006
      - number: '7.2'
        title: 运营安全与灵巧操作漏洞
        blocks:
          - type: paragraph
            body: >-
              与人类并肩部署时，物理安全是人形机器人不受约束应用的最大障碍。工业制造设施的历史机器人事故表明，意外启动执行器和机械故障模式可能造成灾难性伤害。尽管 Robot Era 已在内部整合超过 95%
              的核心硬件部件，整个机器人行业缺少标准化触觉传感，仍是灵巧操作的严重瓶颈。复杂操作任务约 80%
              依赖触觉反馈；没有经过认证的限力机制，灵巧手可能夹碎物体或造成工作区事故。满足连接中断时冻结或下垂肢体等强制失效安全要求，是避免停机和责任方面索赔主张的必要条件。
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR007
              - CR010
      - number: '7.3'
        title: 商业依赖与资本集中
        blocks:
          - type: paragraph
            body: >-
              Robot Era 早期商业采用高度依赖少数伙伴。公司在十多个物流中心的部署几乎完全依靠战略主要投资人 SF Group 和 China Post。该安排提供了封闭式部署环境，并在 2026 年 3 月 RMB
              1b 战略轮之后，促成 5 月超过 200m 美元的融资，但也形成关键交易对手依赖。若主要物流伙伴缩减自动化投资、改变运营要求或推迟采购，Robot Era
              眼前可替代的收入来源有限。要降低客户集中度并确保长期收入持久性，公司必须拓展汽车和商业服务客户。
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR012
      - number: '7.4'
        title: 具身智能阻力与竞争动态
        blocks:
          - type: paragraph
            body: >-
              长期市场预测认为到 2035 年人形机器人将扩展为 200 billion dollar 行业，但当前商业市场仍只有 2 to 3 billion
              dollars，尚处早期。中国制造商虽然拥有全球安装份额和成本优势，具身智能模型却受物理交互数据及现实世界泛化能力的根本限制。北美竞争平台正在结构化汽车设施推进 Robots-as-a-Service
              商业协议，设定了很高的企业安全和可用性门槛。Robot Era 必须在资本密集型制造爬坡的同时，面对资金充裕的国内外对手；若基础模型能力跑在其专有硬件栈之前，公司将承受毛利率压缩和技术过时风险。
            claimRefs:
              - CR011
              - CR012
              - CR013
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR011
              - CR013
              - CR014
      - number: '7.5'
        title: 论点破坏触发器与尽调验证路径
        blocks:
          - type: paragraph
            body: >-
              评估 Robot Era 的投资人必须设定清晰的量化止损标准和尽调里程碑。关键论点破坏触发器包括：无法解决的 MIIT HEIS 标准安全认证失败、部署物流枢纽发生严重人身伤害事故，或 SF
              Group、China Post
              客户流失。尽调必须审计未删节的安全事故日志，核验千台级交付批次的平均无故障时间，并检查机载感知遥测的第三方渗透测试报告。此外，投资承诺应以核心快递物流之外的客户多元化得到验证，以及跨境数据隐私和出口管制合规获得正式法律许可为条件。
            claimRefs:
              - CR009
              - CR014
      - number: '7.6'
        title: 展示项
        blocks:
          - type: callout
            title: SF Group 与 China Post 的客户集中度风险
            body: 在十多个物流中心的部署验证了早期产品—市场匹配，但商业牵引力高度集中于股权共同投资人。SF Group 或 China Post 若改变资本开支或自动化战略，单位交付目标和收入动能都会立即受到威胁。
            calloutType: risk
            claimRefs:
              - CR008
              - CR009
          - type: callout
            title: 物理安全基线是决定性规模瓶颈
            body: 中国 2026 年 2 月的 MIIT 标准，标志着全球从投机性人形机器人演示转向严格工业安全合规。在标准化触觉传感器和经认证的最低风险失效安全机制投入生产并验证之前，企业采用仍会受严重工伤责任限制。
            calloutType: insight
            claimRefs:
              - CR001
              - CR002
              - CR007
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点与反论点
        blocks:
          - type: paragraph
            body: >-
              Robot Era 的核心投资论点建立在工业和物流环境中已展示的部署速度，以及头部国资和战略资本支持之上。2026 年 5 月，公司获得 SF Group 领投的超过 $200m 融资，此前 2026 年 3
              月完成 RMB 1b（约 $143m）战略轮 [CV001, CV005]。这两轮资本为公司提供了充足流动性，也验证了中国最大快递物流网络的商业兴趣。运营上，Robot Era 报告 2026
              年第二季度启动千台级交付，季度交付增长超过 300%，并与 China Post、SF Group 在十多个物流枢纽部署人形平台 [CV006,
              CV007]。其技术差异化依托内部硬件架构：包括驱动机构和直驱灵巧手在内，超过 95% 的核心部件由公司自研 [CV008]。NVIDIA、Apple、Boston Dynamics
              等全球领先研究和计算机构采用其产品，也为平台技术可信度提供支持 [CV009]。

              反论点则指出早期具身 AI 商业化共有的结构性脆弱点。首要问题是客户集中和股东依赖：SF Group
              同时是主要股权投资人、董事会成员来源和主要商业部署客户，因此当前部署究竟代表无补贴、独立交易的商业需求，还是补贴型试用机群，仍有疑问。全面垂直整合硬件意味着在高量连续生产实现规模经济之前，公司要承担大额资本开支和固定制造费用吸收压力。此外，单位计费、实际毛利或经常性软件服务附加率均没有披露任何财务数据，投资者热情可能超过可持续的运营现金创造能力。
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
      - number: '8.2'
        title: 融资背景与估值基准
        blocks:
          - type: paragraph
            body: >-
              Robot Era 在 2026 年的资本化水平位于私人具身智能融资的上四分位，但更广泛的机器人市场估值倍数分化加剧，公开市场也在大幅下调估值。美国人形机器人同行 Figure AI 在 2025 年 9 月的
              C 轮融资中获得了 $39 billion 的私人估值 [CV003]；与此同时，初期炒作撞上漫长的商业化周期，公开市场机器人股票的估值倍数明显压缩。尤其值得注意的是，港股上市的人形机器人先行者 UBTECH
              Robotics 在 2026 年市值缩水 38.6%，从 2025 年收盘时的 $7.09 billion 降至 2026 年 10 月的 $4.35 billion
              [CV002]。这轮修正说明，公开市场正在把硬件机器人估值倍数重新定价到更接近工业设备基本面的水平。

              消费级和企业级机器人先行者的历史案例，也进一步说明估值需要克制。例如，iRobot 的收入从 2021 年的峰值 $1.565 billion 大幅降至 2024 年的 $682
              million，说明硬件价格竞争、利润率下滑和周期性客户需求会损害高倍数商业模式 [CV004]。中国虽然主导全球人形机器人制造——占全球安装量的 85%，单位成本约为 $50,000，约为西方同类产品的一半
              [CV010]——但硬件单位成本低，并不能单独保证软件式的毛利率。在基准和悲观估值情景下，如果非稀释性商业续约没有兑现，建立在风险投资热潮峰值之上的私人估值可能面临显著的下轮融资压力 [CV013,
              CV014]。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV010
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV002
              - CV003
              - CV004
              - CV013
              - CV014
      - number: '8.3'
        title: 投资建议、风险评级与估值判断
        blocks:
          - type: paragraph
            body: >-
              综合运营进展、商业部署证据和市场可比公司后，投资结论应保持克制：建议“继续研究”，风险评级为“高”，信心为“中”，估值判断为“偏高” [CV012]。Robot Era 的硬件能力、超过 95%
              的零部件垂直整合率，以及千台级物流交付里程碑，使其成为中国具身 AI 的头部候选者 [CV001,
              CV011]；但在尚未看清单位经济性是否成立的情况下，按当前私人估值投入成长资本，会违背入场价格纪律。中国的结构性成本优势——人形机器人生产成本约为 $50,000 [CV010]——构成强劲的国内顺风，但
              UBTECH 等公开市场可比公司表明，估值倍数压缩仍是轮后投资者需要正视的风险 [CV002]。

              决策框架要求投资者把技术试点验证与经济现金流的持久性分开看。Robot Era 已通过与 China Post 和 SF Group
              展开多枢纽部署，基本越过早期技术门槛；但合同期限、实际平均售价（ASP）、保修计提和客户续约历史都尚未得到验证，因此还不能直接给出“买入”评级。投资者应跟踪后续季度交付，等经审计的单位毛利证明单机层面的贡献能够持续，再建立股权敞口。
            claimRefs:
              - CV001
              - CV002
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV001
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV014
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV008
              - CV012
      - number: '8.4'
        title: 退出准备、尽调问题与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              Robot Era 的流动性和退出时间表取决于国内上市要求与资本密集度。Dongfeng Asset、ICBC Capital、China Unicom
              基金等国资关联产业基金，以及中国头部资产管理机构的高参与度，指向其最终可能在上海科创板或香港交易所上市。但中国上市监管机构对盈利能力、收入规模和关联交易审查都有严格要求。鉴于 SF Group
              同时担任领投方和主要部署客户 [CV001, CV005, CV007]，Robot Era 必须证明收入已超越股东网络实现多元化，才能满足监管上市标准并获得有吸引力的公开市场交易倍数 [CV012,
              CV014]。

              机构尽调在投入资本前必须回答五个问题：第一，交付收入中来自独立第三方、而非股东合作伙伴的准确比例；第二，L7、M7 和 Q5
              每台设备经审计的物料清单成本与实际毛利率；第三，活跃物流中心的车队在线率、平均故障间隔时间（MTBF）和经常性维护保修费用；第四，客户合同条款，尤其是试点转化率和经常性软件服务费安排；第五，2026
              年战略轮和融资轮的股权结构表清算优先权。任何 SF Group 或 China Post 枢纽取消试点、将价格压到单位制造成本以下，或核心机器人操控架构师离职，都属于必须给出“回避”评级的明确论点失效触发器。
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV012
              - CV014
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: “克制炒作：为什么 Robot Era 值得继续研究，而不是直接买入”
            body: >-
              Robot Era 已在 SF Group 和 China Post 聚集了可观的产业资本与真实部署伙伴，但在尚无经审计收入、单位 ASP
              实现情况和毛利率清晰度的情况下，按当前私人市场表面估值投资，会让投资者暴露于严重的估值倍数压缩风险。
            calloutType: recommendation
            claimRefs:
              - CV010
              - CV011
              - CV012
          - type: callout
            title: 私人人形机器人估值面临公开市场下调压力
            body: >-
              公开市场对机器人硬件盈利能力表现出明显怀疑，UBTECH 在 2026 年估值收缩 38.6% 至 $4.35B，以及 iRobot
              收入长期恶化，都说明了这一点。私人市场入场估值必须计入足够的安全边际，以抵御硬件商品化。
            calloutType: risk
            claimRefs:
              - CV002
              - CV004
              - CV013
