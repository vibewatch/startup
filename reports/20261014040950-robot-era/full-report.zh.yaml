              Robot Era 硬件平台的成本结构由垂直整合战略支撑，公司声称核心部件超过 95%
              自研，包括专有直驱灵巧手、电机、执行器和人形结构框架。理论上，这种高度内制可减少相较于采用第三方现成机器人关节的组装商的直接物料成本，并保护毛利不受供应商加价影响。但单台盈利能力仍受一次性工程费用、专业装配人工和包裹分拣场景所需的定制现场集成严重约束。公司尚未发布经验证的毛利率或详细制造物料清单。随着实体部署向声称的千台级交付量扩张，资本强度会从实验室原型转向库存采购、现场保修支持和驻场维护人员所需的营运资金。
