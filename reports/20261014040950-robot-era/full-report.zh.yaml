  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品定义与模块化硬件阵容
        blocks:
          - type: paragraph
            body: >-
              Robot Era 以分层硬件组合构建商业产品，覆盖工业物流、制造操作、商业服务和学术研究。公司在清华大学交叉信息研究院孵化，已从实验室演示转向模块化商业平台。旗舰 ROBOTERA L7 是一台身高 171
              cm 的全尺寸双足人形机器人，双臂负载 20 kg，最高奔跑速度 4 meters per second，旨在把动态双足运动与精细工具操作结合起来。除全双足系统外，公司还提供用于固定工位或输送线旁入料的 M7
              上半身操作机、用于结构化服务及医疗环境的轮式 Q5，以及独立的 XHAND 1 灵巧机器人手。这种模块化分层让公司可以变现不同硬件层级，同时覆盖不同运营环境。
