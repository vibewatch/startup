            body: >-
              Robot Era 通过工业硬件交付、商业服务部署和部件销售组合，将具身智能及人形机器人平台变现。2026 年初，公司称第二季度开始千台级交付，实际硬件数量迎来拐点，声称出货增长超过
              300%。主要商业牵引来自结构化物流设施：公司已与 China Post、SF Group 合作，在十多个运营分拣中心部署人形系统。与此同时，Robot Era 把双足 L7、轮式 Q5 和 XHAND
