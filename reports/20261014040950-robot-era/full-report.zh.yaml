              Robot Era 在 2026 年上半年展现出极快的募资速度，两个月内筹集超过 $340 million。融资高潮是 2026 年 4 月一轮超过 CNY 1.4 billion 的战略轮，由快递物流巨头
              S.F. Holding 领投，HongShan、IDG Capital 和 CICC Capital 等顶级财务投资人参与；随后 Chengtong Fund 领投一轮 $137.5 million
