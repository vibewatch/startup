company:
  name: "Robot Era"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Robot Era is a Beijing humanoid-robotics company founded in August 2023 by Tsinghua assistant professor Chen Jianyu. Independent reporting supports a March 2026 unicorn valuation and company-issued releases describe a subsequent financing and logistics deployments, but cumulative funding, governance, revenue, customer count, headcount, and unit economics remain unresolved."
sections:
  - id: "identity-and-operating-model"
    title: "Identity and Operating Model"
    body: >-
      Robot Era is a young Beijing-based humanoid-robotics developer founded in
      August 2023 by Chen Jianyu, whom Caixin identifies as a Tsinghua University
      assistant professor. Its public product story combines humanoid platforms,
      dexterous manipulation hardware, and embodied-AI models for logistics,
      industrial, and service workflows. The available evidence therefore points
      to a hardware-led deployment model supported by proprietary components and
      software rather than a disclosed recurring-software model. No retained
      source provides audited revenue mix, pricing, recurring revenue, gross
      margin, or customer-count definitions, so those metrics are treated as
      diligence gaps instead of inferred scale.
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"
  - id: "financing-and-stakeholders"
    title: "Financing and Stakeholders"
    body: >-
      Financing evidence confirms rapid private-market revaluation but does not
      yield a reliable cumulative-capital figure. Caixin reported a nearly RMB 1
      billion Series A+ round in November 2025 and a further RMB 1 billion
      strategic round in March 2026 at a valuation above RMB 10 billion, while
      Crunchbase described the March event as $145 million at a $1.5 billion
      valuation. In May, company-derived announcements reported another round of
      more than $200 million led by SF Group. A separate tear sheet displays two
      incompatible total-funding figures, $547 million and more than $1.5
      billion, so neither is used as a verified total. Round sequencing, dilution,
      debt, secondaries, and investor protections require cap-table review.
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
      - "CO009"
      - "CO015"
    tableRefs:
      - "TO003"
  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: >-
      Chen Jianyu is the only named operating leader consistently visible in the
      assigned evidence. Caixin supplies the founder and academic affiliation,
      while the independent tear sheet lists him under leadership. That supports
      founder-market-fit around embodied intelligence, but it does not establish
      the composition of the executive team, board, audit oversight, or
      succession plan. The absence of those records is not proof that governance
      mechanisms are absent; it means public evidence is insufficient to assess
      them. Given the company's short history and founder-centered public
      identity, management diligence should test decision concentration,
      technical succession, and investor control rights.
    claimRefs:
      - "CO001"
      - "CO002"
    tableRefs:
      - "TO002"
  - id: "milestones-scale-and-risk"
    title: "Milestones, Scale Signals, and Risk"
    body: >-
      Product and deployment milestones show movement beyond laboratory
      demonstrations, but the strongest scale claims remain company-issued. A
      syndicated announcement and a release-derived article say Robot Era is
      deployed in more than ten logistics centers with China Post and SF Group,
      began thousand-unit deliveries in the second quarter of 2026, and exceeded
      300% growth; those statements are not equivalent to audited shipments,
      accepted customer units, or recognized revenue. The same sources claim
      extensive vertical integration and adoption by major technology companies.
      Independent sector reporting remains cautionary: humanoid deployments are
      still concentrated in structured tasks, while data, safety, privacy, demand,
      and margin pressure constrain broader adoption. Unitree evidence is used
      only as directional sector context, not as an independent benchmark for
      Robot Era.
    claimRefs:
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
      - "CO014"
      - "CO016"
    figureRefs:
      - "FO001"
