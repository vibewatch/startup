company:
  name: Robot Era
chapter:
  number: 6
  title: Customers
  summary: Robot Era has successfully transitioned from academic prototyping into active commercial deployment across more than 10 logistics centers led by SF Express and China Post, initiating thousand-unit deliveries in mid-2026. However, commercial adoption remains heavily concentrated in express parcel handling, while industrial scaling faces 2-to-3-hour battery endurance limits, 30% to 40% initial worker efficiency hurdles, and completely undisclosed contract renewal metrics.
sections:
  - id: customer-base-segmentation
    title: Customer Base Segmentation and Buyer Profiles
    body: 'Robot Era commercialization strategy targets three core enterprise segments: express parcel logistics operators, industrial manufacturing corporations, and frontier technology research institutions. In the express parcel logistics segment, enterprise buyers are Chief Operating Officers and logistics automation directors at national delivery giants, including lead strategic backer SF Express and state-owned postal operator China Post. These customers deploy humanoid platforms for small parcel induction, package sorting, and transport across high-throughput sorting hubs. In the industrial manufacturing domain, strategic industrial partners such as KENGIC, Dongfeng Asset Investment, and China Unicom-affiliated funds serve as both capital backers and deployment conduits, exploring material handling and assembly line automation. Concurrently, premier global technology corporations and research laboratories, including Apple, NVIDIA, and Boston Dynamics, purchase Robot Era hardware systems and direct-drive dexterous hands for embodied AI model benchmarking and advanced robotics engineering. This commercial landscape develops against an expanding global industrial robotics market, where worldwide installation value reached an all-time high of $16.7 billion in 2026.'
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU013
    tableRefs:
      - TU001
  - id: adoption-trajectory-and-fleet-deliveries
    title: Adoption Trajectory and Fleet Delivery Milestones
    body: Commercial adoption for Robot Era accelerated substantially in mid-2026 following the closing of an over $200 million financing round led by SF Express. Rather than confining its machines to laboratory demonstrations or theatrical exhibitions, the company demonstrated tangible operational footprint expansion by deploying humanoid robots across more than 10 commercial logistics facilities in China. Operational metrics reported in industry coverage indicate that Robot Era machines achieved approximately 85% of human worker productivity during parcel induction and sorting routines, establishing a workable operational threshold for structured logistics tasks. Building upon this pilot traction, Robot Era initiated thousand-unit commercial deliveries in the second quarter of 2026, claiming volume shipment expansion exceeding 300% over prior periods. While these milestones reflect notable production scaling in a nascent embodied intelligence market, public disclosures lack the underlying baseline denominators, such as cumulative lifetime deliveries or firm delivery backlog conversion rates, requiring cautious diligence interpretation.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
    tableRefs:
      - TU002
  - id: named-customer-proof-and-enterprise-outcomes
    title: Named Customer Proof and Production Deployments
    body: 'Publicly verifiable customer evidence for Robot Era centers primarily on large-scale logistics pilots and premier research hardware placements. The marquee commercial deployment partner is SF Express, which integrated Robot Era humanoid platforms into regional logistics distribution centers to execute small parcel induction and handling. China Post represents a second major operational partner, testing automated mail and parcel sorting in commercial processing facilities. Beyond domestic logistics infrastructure, Robot Era achieved notable international credibility by placing its robotic systems and dexterous manipulation hardware with leading global technology institutions, specifically Boston Dynamics, NVIDIA, and Apple. However, an essential diligence distinction exists between commercial production rollouts and research placements: while SF Express and China Post represent active commercial pilot workflows, deployments at Apple and NVIDIA remain restricted to internal research laboratories. Furthermore, detailed contract durations, annual recurring revenue commitments, and unit economics across deployed hubs remain private.'
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
    tableRefs:
      - TU003
  - id: customer-journey-retention-and-concentration-risks
    title: Customer Journey, Retention Durability, and Concentration Risks
    body: 'The enterprise customer adoption pathway for Robot Era follows a structured six-stage progression, advancing from initial bench validation and pilot deployment into multi-center logistics scaling and subsequent industrial manufacturing expansion. Nevertheless, the commercial durability of this trajectory is constrained by meaningful operational friction and partner concentration risks. First, the company exhibits high customer concentration, with initial commercial revenues and facility access heavily tied to lead shareholder SF Express. Second, broader industrial adoption faces severe technical bottlenecks documented across China humanoid robotics sector: contemporary commercial humanoid robots generally operate for only two to three hours per charge, while general industrial worker productivity averages just 30% to 40% of human output during initial factory deployments. Industrial return on investment modeling indicates that mass commercial adoption requires robot hardware prices to decline to approximately 300,000 yuan. Finally, Robot Era has disclosed no verifiable data regarding customer churn, contract renewal rates, or net revenue retention, and international deployments must navigate evolving 2026 AI transparency compliance frameworks.'
    claimRefs:
      - CU008
      - CU009
      - CU010
      - CU011
      - CU012
      - CU014
      - CU015
    figureRefs:
      - FU001
