  - calloutType: risk
    title: Partner Concentration and Industrial Adoption Headwinds
    body: Commercial traction remains disproportionately concentrated in parcel logistics with strategic lead investor SF Express, leaving broader industrial adoption in automotive and electronics unproven. Furthermore, persistent hardware bottlenecks—specifically 2 to 3 hour battery runtimes, 30% to 40% initial worker efficiency in complex assembly, and completely undisclosed customer retention and contract renewal metrics—represent significant friction for enterprise scaling.
