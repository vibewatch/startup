callouts:
  - calloutType: insight
    title: Logistics Parcel Induction as the Empirical Beachhead
    body: >-
      Robot Era commercial progression in parcel sorting across China Post and SF Group represents a pragmatic focus on
      structured industrial logistics where repetitive bimanual manipulation delivers clear labor substitution benefits.
      However, validating whether thousand-unit deliveries constitute commercial contracts with recurring revenues
      rather than subsidized pilot trials remains an essential diligence check for prospective investors.
    claimRefs:
      - CM003
      - CM005
  - calloutType: risk
    title: Venture Capital Valuation Premiums vs. Unaudited Commercial Economics
    body: >-
      While venture funding frenzies have propelled Robot Era valuation above RMB 10 billion ($1.4 billion),
      macroeconomic and regulatory warnings highlight the severe vulnerability of pre-revenue hardware startups. Without
      verified unit economics, gross margins, and customer retention data, the market narrative risks pricing in
      speculative long-term potential ahead of industrial reality.
    claimRefs:
      - CM006
      - CM010
      - CM011
      - CM015
