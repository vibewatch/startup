      - ["Sovereign deployment posture", "Official material emphasizes systems developed, deployed, and governed in India", "Foreign-provider route remains external to Indian sovereign infrastructure claims", "Krutrim pursues a domestic stack; HCLTech can wrap mixed-model offerings for enterprise buyers", "Sovereign or regulated buyers may shortlist domestic stacks first"]
      - ["Distribution and procurement reach", "AWS Marketplace and Circle partners extend procurement access", "Global vendors benefit from existing cloud and developer distribution", "HCLTech, Thoughtworks, IBM, HP, and other incumbents have deep enterprise delivery reach", "Channel power can narrow the advantage of raw model differentiation"]
      - ["Implementation and workflow integration", "Sarvam combines forward-deployed teams with Circle integrators", "Global models often require partner-led enterprise integration anyway", "Systems integrators and OEMs can absorb custom integration work into larger programs", "Switching costs may sit in delivery relationships as much as in the model layer"]
    notes: >-
      Unsupported cells are described conservatively from this pool's evidence; blank comparative detail should
      be treated as unproven rather than as inferior.
    claimRefs: [CP002, CP003, CP004, CP006, CP011]
  - id: TP003
    title: Pricing / packaging comparison
    columns:
      - Offer / route
      - Public price or support signal
      - Included capabilities
      - Unknowns
      - Implication
    rows:
      - ["Sarvam Bulbul V3 voice", "₹1 per minute for enterprise voice interactions", "Indian-language text-to-speech within a broader speech stack", "Realized enterprise discounts, bundles, and minimum commits are not disclosed here", "Sarvam is publicly anchoring price as a local-language alternative rather than only a quality story"]
      - ["Sarvam sovereign-model buildout", "₹246.72 crore IndiaAI Mission support; state-backed compute and deployment programs", "Foundational-model development plus public-sector and enterprise deployment", "Government support is not customer list pricing and does not show steady-state unit economics", "State support can improve affordability and trust for regulated deployments"]
      - ["Incumbent / global-model route", "No comparable list pricing is disclosed in this assigned pool", "General-purpose model access plus SI- or cloud-led delivery", "Contract terms, Indian-language unit economics, and discounting are not visible here", "Precise undercut analysis remains incomplete even though channel competition is clearly active"]
    notes: >-
      This table mixes list-price signals with public subsidy signals because the assigned pool does not expose
      normalized realized contract pricing across rival routes.
    claimRefs: [CP005, CP008, CP009, CP010]
figures:
  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: Ordinal positioning from the assigned evidence favors Sarvam on India-specific fit, while incumbent channels still dominate delivery reach.
    data:
      xAxis:
        label: India-specific fit (1=generic, 5=India-native)
        min: 1
        max: 5
      yAxis:
        label: Distribution / delivery reach (1=narrow, 5=incumbent-scale)
        min: 1
        max: 5
      points:
        - label: Sarvam AI
          x: 5
          y: 4
          tone: high
          note: Full-stack India-built position with partner-led enterprise and public-sector reach.
        - label: Krutrim
          x: 4
          y: 2
          tone: medium
          note: Domestic sovereign-AI peer, but this pool shows less distribution proof than Sarvam.
        - label: OpenAI / ChatGPT
          x: 2
          y: 4
          tone: risk
          note: Strong ecosystem presence, but this pool does not show India-native deployment posture.
        - label: Google / Gemini
          x: 2
          y: 4
          tone: risk
          note: Strong cloud distribution, but weaker localized OCR result in the cited comparison.
        - label: HCLTech-led mixed stack
          x: 3
          y: 5
          tone: risk
          note: Massive enterprise reach and optionality across Sarvam, OpenAI, and Google Cloud.
        - label: Internal build
          x: 3
          y: 1
          tone: warning
          note: Flexible for large buyers, but delivery and tuning burden remain internalized.
    approximationNotes: >-
      Axes use evidence-backed ordinal scoring rather than source-authored coordinates; scores summarize the
      relative localization and distribution signals visible in this assigned pool.
    claimRefs: [CP012, CP013]
callouts:
  - calloutType: strength
    title: Where Sarvam is hardest to substitute
    body: >-
      The assigned evidence is most convincing where Indian-language speech, OCR, sovereign deployment, and
      public-sector adoption are part of the buying criterion, because Sarvam has both localized product proof
      and state-linked deployment references in those categories.
    claimRefs: [CP008, CP010, CP011, CP012]
  - calloutType: risk
    title: Channel partners can also be alternative sellers
    body: >-
      Sarvam's go-to-market breadth depends on partners whose own incentives are not exclusive. HCLTech's
      simultaneous OpenAI, Google Cloud, and Sarvam relationships illustrate how buyer access can expand
      without creating durable channel lock-in.
    claimRefs: [CP004, CP006, CP013]
