  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: pricing-durability
      missingEvidence: Realized enterprise contract pricing, bundle structure, discounting, and minimum-commit economics by product line.
      whyItMatters: Public list-price anchors do not show whether Sarvam can defend margin or pricing power once rivals and channel partners compete for the same accounts.
      diligencePath: Request customer contracts, renewal quotes, and marketplace-versus-direct pricing splits for voice, OCR, and agent products.
      relatedQuestionRefs: [QP008]
      relatedTableRefs: [TP003]
    - type: private-evidence-only
      severity: material
      topic: switching-costs
      missingEvidence: Customer-level retention, churn, migration effort, and multi-homing behavior across regulated and enterprise deployments.
      whyItMatters: Distribution breadth alone does not prove durable lock-in; underwriting requires evidence on whether buyers can swap models or vendors without major workflow disruption.
      diligencePath: Interview reference customers and review deployment statements of work, renewal cohorts, and implementation timelines by channel partner.
      relatedQuestionRefs: [QP008]
      relatedTableRefs: [TP002]
