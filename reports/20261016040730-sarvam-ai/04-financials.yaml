company:
  name: "Sarvam AI"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Sarvam's public financial picture shows a credible monetization surface across APIs,
    enterprise deployments, and government-linked work, plus unusually strong strategic
    support from IndiaAI Mission compute and the June 2026 Series B first close. But the
    assigned evidence still does not disclose realized pricing, revenue, margins, cash, or
    runway, so revenue quality and capital adequacy remain proxy-driven rather than
    underwritten.
sections:
  - id: "revenue-model"
    title: "Revenue model is visible at the channel level, not at the booked-revenue level"
    body: >-
      The assigned sources consistently describe Sarvam as a full-stack sovereign-AI vendor
      selling into enterprises, governments, and developers through APIs, platform products,
      and customized deployments rather than through a consumer-subscription model.
      Independent coverage adds useful deployment proxies: TechTimes reports 10 million API
      calls, more than 2 million daily interactions, a 45 million-policyholder insurance
      renewal program, and 35 million processed document pages. Those metrics support the
      case that Sarvam has real usage and implementation activity, but they do not reveal
      realized pricing, recurring revenue mix, or how much of delivery is software versus
      services-heavy work.
    claimRefs: ["CI001", "CI002", "CI003", "CI004", "CI005", "CI012"]
    tableRefs: ["TI001", "TI002"]
    figureRefs: ["FI001"]
  - id: "capital-intensity"
    title: "Government-backed compute lowers near-term infrastructure burden but not financing dependency"
    body: >-
      Public evidence points to a capital structure that is stronger than most young frontier
      AI startups but still funding-dependent. Sarvam disclosed a $41 million Series A in
      December 2023, then reached a $234 million Series B first close at a $1.5 billion
      valuation in June 2026, with reporting that the company is still targeting a $300
      million round size. At the same time, third-party profiles repeatedly credit IndiaAI
      Mission compute support and roughly Rs99 crore of subsidy with reducing near-term model
      training cash needs. That support improves runway quality, but it does not substitute
      for disclosed cash balances, burn, debt, or committed economics on new large-scale
      infrastructure initiatives.
    claimRefs: ["CI006", "CI007", "CI008", "CI009", "CI010", "CI015"]
    tableRefs: ["TI003"]
  - id: "verdict"
    title: "Financial diligence still hinges on undisclosed unit economics and next-round terms"
    body: >-
      The public record is enough to conclude that Sarvam has strategic demand signals,
      meaningful institutional distribution, and a financing base that can support continued
      frontier-model investment in India today. It is not enough to underwrite software revenue quality,
      margin durability, or self-funded scale. The most decision-relevant missing inputs are
      realized API and enterprise pricing, revenue mix between product and services, gross
      margin by workload, customer concentration, cash on hand, and monthly burn. Until those
      numbers are disclosed directly, the prudent financial view is that commercialization is
      promising but unproven and that future financing remains part of the operating model.
    claimRefs: ["CI011", "CI013", "CI014", "CI015"]
tables:
  - id: "TI001"
    title: "Revenue streams table"
    columns:
      ["Stream", "Mechanism", "Unit", "Current value/status", "Quality", "Diligence ask"]
    rows:
      - ["API and model access", "Usage-based access to LLM, speech, vision, and agent products", "API calls / credits", "10M API calls and 2M+ daily interactions reported publicly; paid conversion undisclosed", "Usage traction is visible, but monetization rate is not", "Provide booked API revenue, paid developer count, and product-level gross margin"]
      - ["Enterprise deployments", "Contracted deployments for insurers, banks, and other institutions", "Contract / deployment", "45M policyholders and 35M processed pages cited publicly; ACV and renewal data undisclosed", "Real deployments are visible, but software-versus-services mix is unclear", "Provide ACV, implementation scope, renewal rates, and contract duration by segment"]
      - ["Government-linked work", "IndiaAI Mission projects and state partnerships", "Program / milestone funding", "Strategic validation and compute support are public; contract economics are not", "Potentially important channel, but concentration and subsidy dependency are opaque", "Provide contract terms, subsidy mechanics, receivable profile, and concentration by public-sector buyer"]
      - ["Hardware / adjacent devices", "Potential device plus software monetization from Kaze and related products", "Device + subscription", "Forward-looking only in the assigned pool", "Too early to underwrite as a meaningful revenue contributor", "Provide launch timing, BOM, channel plan, attach rates, and support economics"]
    notes: >-
      Public sources separate channel descriptions from disclosed financial performance. The
      table distinguishes observed deployment proxies from undisclosed revenue realization.
    claimRefs: ["CI001", "CI003", "CI004", "CI005", "CI008", "CI012", "CI014"]
  - id: "TI002"
    title: "Pricing / monetization table"
    columns:
      ["Offer / channel", "Public pricing evidence", "Contract model", "Realized pricing status", "Source"]
    rows:
      - ["API platform", "Official materials and third-party profiles describe INR-oriented APIs, but the assigned pool does not include a full price sheet", "Usage-based self-serve plus enterprise expansion", "Realized price, discounts, and contribution margin unknown", "Official site; BusinessOutreach; ValueForStartups"]
      - ["Enterprise deployments", "No list pricing disclosed in the assigned pool", "Contracted deployment and workflow integration", "Discounting, services content, and renewal economics unknown", "BusinessOutreach; TechTimes; ValueForStartups"]
      - ["Government programs", "No public unit pricing or subsidy conversion disclosed", "Tender, partnership, or subsidized program economics", "Commercial terms opaque", "Sarvam partnership post; TechTimes; ValueForStartups"]
      - ["Startup ecosystem credits", "Free API-credit programs are disclosed publicly", "Promotional credits to seed adoption", "Deliberately dilutive to near-term monetization", "GK365; ValueForStartups"]
    notes: >-
      This is a monetization-structure table, not a realized-pricing table. Official or
      third-party mentions of APIs and credits should not be read as evidence of net revenue
      yield, discount discipline, or margin.
    claimRefs: ["CI001", "CI012", "CI014"]
  - id: "TI003"
    title: "Unit economics table"
    columns:
      ["Metric", "Value / status", "Confidence", "Why it matters", "Diligence ask"]
    rows:
      - ["Revenue / ARR", null, "Low", "No disclosed booked revenue or ARR means valuation cannot be anchored to software scale", "Provide monthly recurring revenue, non-recurring revenue share, and segment mix"]
      - ["Gross margin", null, "Low", "Compute, inference, and solution-delivery costs determine whether Sarvam behaves like software or deep-tech services", "Provide gross margin by API, enterprise deployment, and public-sector workload"]
      - ["CAC / payback", null, "Low", "Institutional distribution can be efficient or services-heavy; public deployments alone do not show sales efficiency", "Provide pipeline conversion, average sales cycle, and payback by segment"]
      - ["Cash / runway", null, "Low", "Series B funding and subsidies help, but remaining fundraising and expansion plans leave runway opaque", "Provide cash balance, monthly burn, subsidy drawdown schedule, and debt obligations"]
    notes: >-
      Nulls here mean unavailable in the assigned public evidence, not zero. Each missing
      field is material to underwriting and requires direct company disclosure.
    claimRefs: ["CI007", "CI010", "CI011", "CI012", "CI013"]
