callouts:
  - calloutType: "insight"
    title: "Traction is public; revenue quality is not"
    body: >-
      Sarvam has enough disclosed deployments to support a serious commercialization story,
      but the visible metrics are activity proxies rather than finance metrics. That makes
      distribution strength easier to verify than recurring-software quality.
    claimRefs: ["CI003", "CI004", "CI005", "CI012"]
  - calloutType: "risk"
    title: "Fresh capital reduces pressure, but does not close the underwriting loop"
    body: >-
      The June 2026 financing and government-backed compute support are meaningful cushions,
      yet they do not replace missing data on burn, margin, or contract economics. Reported
      top-up fundraising keeps next-round dependency squarely in scope.
    claimRefs: ["CI006", "CI007", "CI008", "CI010", "CI011", "CI013"]
