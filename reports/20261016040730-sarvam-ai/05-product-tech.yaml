  evidenceGaps:
    - type: missing-source
      severity: material
      topic: trust-and-reliability-gap
      missingEvidence: Independent uptime history, SLA commitments, incident logs, and architecture-level security documentation for production services.
      whyItMatters: Buyers in BFSI, government, and other regulated environments need evidence that the platform is reliable and controlled beyond product-page marketing.
      diligencePath: Request SOC 2 scope, ISO certificate details, security architecture, incident history, and customer-facing SLA terms in diligence.
      relatedQuestionRefs: ["QE006", "QE008"]
    - type: missing-source
      severity: material
      topic: benchmark-methodology
      missingEvidence: Third-party benchmark methodology and reproducible evaluation detail for latency, OCR accuracy, speech quality, and ROI claims.
      whyItMatters: Product differentiation depends heavily on quality and economics claims that are difficult to underwrite without method and comparator transparency.
      diligencePath: Obtain benchmark decks, test-set definitions, independent eval reports, and customer acceptance criteria for the promoted metrics.
      relatedQuestionRefs: ["QE007", "QE008"]
    - type: private-evidence-only
      severity: material
      topic: module-maturity
      missingEvidence: Named production references by module, including deployment dates, workflow scope, and ongoing usage volume.
      whyItMatters: Public materials show breadth, but product underwriting still needs proof that each surface is durable beyond flagship narratives.
      diligencePath: Ask for a module-level customer reference list separating pilots, production deployments, and public-sector rollouts.
      relatedQuestionRefs: ["QE008"]
