      Architecture table distinguishes what public sources explicitly describe from dependencies
      and risks inferred from the same materials.
    claimRefs: ["CE006", "CE008", "CE009", "CE011", "CE012", "CE013"]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Sarvam's public stack runs from sovereign compute and frontier-model training through APIs,
      packaged workflow products, and public-sector deployment surfaces.
    data:
      layers:
        - label: Sovereign compute and mission layer
          detail: Public backing and planned domestic compute infrastructure anchor the stack.
          modules:
            - IndiaAI Mission support cited at Rs 246.72 crore
            - Odisha 50MW AI-optimized facility (planned)
            - Tamil Nadu Digital Sangam 20MW AI data center (planned)
          outputs:
            - Domestic compute access
            - Public-sector deployment path
        - label: Frontier model and tokenizer layer
          detail: Model disclosures emphasize MoE efficiency and Indic language economics.
          modules:
            - Sarvam 30B (32K context)
            - Sarvam 105B (128K context)
            - Indic-optimized tokenizer
          outputs:
            - Speech, chat, and document base models
        - label: API primitives
          detail: Developer surfaces expose low-level building blocks for integration.
          modules:
            - REST / WebSocket / batch endpoints
            - Python and JavaScript SDKs
            - STT, TTS, translation, chat, document extraction
          outputs:
            - Integratable model services
        - label: Workflow products
          detail: Higher-level applications package the models into business workflows.
          modules:
            - Voice Agents
            - Doc Agents
            - Content Studio
            - Cowork and Coding Agent
          outputs:
            - Contact-center automation
            - Document workflows
            - Localization workflows
        - label: Deployment and channel layer
          detail: Public materials describe multiple delivery paths for regulated buyers and builders.
          modules:
            - Managed cloud
            - Private cloud / VPC
            - Air-gapped on-premise
            - Startup program and builder onboarding
          outputs:
            - Enterprise deployment flexibility
            - External builder ecosystem
        - label: Proof points and dependencies
          detail: Public maturity proof comes mostly from partners, government users, and company narratives.
          modules:
            - UIDAI / Aadhaar use case
            - Tata Capital and Infosys references
            - NVIDIA and Yotta infrastructure dependency
          outputs:
            - Production traction signal
            - Concentration and verification risk
    approximationNotes: >-
      This figure is a synthesized architecture view built from public disclosures rather than an
      internal system diagram.
    claimRefs: ["CE005", "CE006", "CE008", "CE009", "CE010", "CE012"]
callouts:
  - calloutType: insight
    title: Breadth is already visible
    body: >-
      Sarvam's public surface is broader than a single model launch: the same stack now spans
      model APIs, packaged workflow tools, startup enablement, and sovereign deployment narratives.
    claimRefs: ["CE001", "CE003", "CE004", "CE005"]
  - calloutType: risk
    title: Independent validation still trails the narrative
    body: >-
      The biggest remaining technical diligence gap is not whether Sarvam has products; it is
      whether public evidence can independently validate uptime, security control scope, and the
      benchmark methodology behind promoted latency and quality claims.
    claimRefs: ["CE007", "CE011", "CE013"]
