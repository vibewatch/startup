      - ["Developer API layer", "Exposes REST, WebSocket, batch endpoints, and SDKs for integration", "Stable orchestration, monitoring, and support operations", "Public docs do not disclose SLA history or failure rates"]
      - ["Workflow and deployment layer", "Packages models into agents, document workflows, and sovereign deployment options", "Customer implementation partners, enterprise support, and secure deployment controls", "Public evidence does not independently verify control scope, incident handling, or deployment durability"]
