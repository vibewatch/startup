              - CO012
              - CO013
              - CO014
              - CO016
      - number: '1.2'
        title: Founders, governance shape, and key-person dependence
        blocks:
          - type: paragraph
            body: >-
              The company identity is tightly bound to its two founders. Retained independent profiles trace both
              founders back to AI4Bharat and IIT Madras, with Vivek Raghavan additionally associated with Aadhaar
              biometrics work and Pratyush Kumar with IBM and Microsoft research experience. That founder-market fit
              helps explain both the speed of early capital formation and Sarvam's credibility with public-sector
              stakeholders. It also creates visible key-person dependence: the assigned evidence identifies the
              founders, IndiaAI support, and strategic investors, but does not surface a current board roster, formal
              governance allocations, or clearly documented leadership-bench depth beyond the founders.
            claimRefs:
              - CO003
              - CO005
              - CO006
              - CO011
              - CO015
          - type: table
            tableRef: TO002
            claimRefs:
              - CO003
              - CO015
      - number: '1.3'
        title: Funding history, stakeholder leverage, and disclosed scale
        blocks:
          - type: paragraph
            body: >-
              Sarvam's funding path is compressed and unusually strategic. Within roughly five months of founding it had
              raised a $41 million Series A, and by June 2026 it announced a $234 million first close of a $300 million
              Series B at a $1.5 billion post-money valuation. HCLTech's $150 million strategic lead gives the round
              distribution implications beyond capital alone, while Bessemer, Khosla, and Peak XV preserve venture
              continuity. Public company materials also point to meaningful usage proxies—daily interactions, API calls,
              digitized pages, and audio volume—but those are operating metrics, not substitutes for disclosed revenue
              quality, contract durability, or customer concentration.
            claimRefs:
              - CO004
              - CO010
              - CO011
              - CO012
              - CO013
              - CO016
          - type: table
            tableRef: TO003
            claimRefs:
              - CO004
              - CO005
              - CO006
              - CO010
              - CO011
      - number: '1.4'
        title: Milestones, public-sector momentum, and unresolved diligence asks
        blocks:
          - type: paragraph
            body: >-
              The milestone pattern matters because Sarvam's current narrative depends on more than one funding event.
              The April 2025 IndiaAI selection, the February 2026 model launches, the Odisha and Tamil Nadu partnership
              push, and the June 2026 Series B together show a company moving from research credibility into nationally
              framed infrastructure and deployment claims. At the same time, the strongest independent caution comes
              from execution risk rather than technical irrelevance: product depth is still emerging, frontier
              competition remains stronger on general-purpose performance, and the ecosystem around Sarvam is still
              early. The main diligence asks are still governance detail, verified software economics, and independent
              proof of customer quality beyond usage proxies and company-issued logos.
            claimRefs:
              - CO005
