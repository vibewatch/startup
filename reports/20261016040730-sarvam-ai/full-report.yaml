  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer base is segmented across governments, enterprises, and developers
        blocks:
          - type: paragraph
            body: >-
              The retained sources consistently describe Sarvam as serving three overlapping audiences: government
              institutions that need sovereign infrastructure, enterprise buyers in regulated or language-sensitive
              workflows, and developers who build on Sarvam APIs and open models. Public evidence is strongest on where
              Sarvam wants to sell rather than how much each segment already contributes. The official site frames the
              company around enterprise, government, and developer usage; the 2024 launch announcement expands that into
              sector-specific workflows such as financial services and legal; and later third-party coverage adds BFSI,
              insurance, healthcare, and public-service deployment as disclosed demand centers. That mix suggests Sarvam
              is not a single-product SaaS vendor but a multi-motion infrastructure company whose buyer map spans direct
              contracts, partner-led distribution, and self-serve developer adoption.
