  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and workflow coverage
        blocks:
          - type: paragraph
            body: >-
              Sarvam's public docs show a wide product surface anchored on one account and one API key rather than a
              single flagship app. The official developer surface includes speech-to-text, text-to-speech, chat
              completion, translation, document translation, and document AI, then layers higher-level products such as
              Voice Agents, Doc Agents, Content Studio, Cowork, and a Coding Agent on top. That breadth matters because
              it suggests Sarvam is trying to own both the developer primitive and the packaged workflow for
              Indian-language use cases. Public onboarding also extends beyond enterprise sales: the startup program
              advertises credits, production APIs, and direct engineering support, which is a practical signal that
              Sarvam wants external builders using the platform instead of keeping the stack fully bespoke.
            claimRefs:
