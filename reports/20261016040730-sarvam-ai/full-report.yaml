      - number: '6.3'
        title: Durability and concentration remain the key unresolved customer questions
        blocks:
          - type: paragraph
            body: >-
              Sarvam's public narrative implies meaningful customer momentum, but the retained evidence still leaves the
              durability layer mostly unproven. There is no disclosed NRR, GRR, churn, renewal cadence, or
              contract-length dataset in the assigned pool, and the named proof set is concentrated in government-linked
              initiatives and partner-mediated enterprise expansion rather than a diversified base of independently
              referenced production customers. That matters because government programs, sovereign-compute subsidies,
              and one or two strategic distribution relationships may accelerate early adoption without proving
              repeatable software economics. Until Sarvam discloses named enterprise deployments, concentration
              exposure, and renewal-quality metrics, the chapter's customer thesis remains promising but incomplete.
            claimRefs:
