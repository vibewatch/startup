        title: Exhibits
        blocks:
          - type: callout
            title: Primary thesis-break trigger
            body: >-
              If Odisha, Tamil Nadu, and HCLTech-backed programs do not convert into auditable production deployments
              with diversified enterprise revenue, the current sovereign-AI premium is likely ahead of commercialization
              reality.
            calloutType: risk
            claimRefs:
              - CR002
              - CR003
              - CR005
              - CR004
          - type: callout
            title: What diligence must close quickly
            body: >-
              Before underwriting regulated-workload upside, request security and privacy assurance artifacts, signed
              financing terms, and customer-level concentration data rather than relying on sovereignty messaging alone.
            calloutType: assumption
