      - number: '6.2'
        title: Named proof is real, but the best-documented deployments are still public-sector led
        blocks:
          - type: paragraph
            body: >-
              The clearest named customer proof in the retained pool is in Indian state partnerships rather than
              enterprise logos with production metrics. Sarvam's state-partnership announcement documents a signed
              Odisha MOU and a Tamil Nadu buildout anchored around Digital Sangam and citizen-service applications,
              while outside coverage supports that Sarvam is also pursuing enterprise and government vertical expansion
              at the same time. Investor and press coverage reinforce that commercial deployments exist and that
              enterprise usage is already broad enough to justify a distribution strategy with HCLTech, but those
              sources still stop short of disclosing customer counts, contract sizes, renewals, or named enterprise
              reference accounts. The result is credible adoption evidence, but not yet the kind of audited customer
              cohort view that would prove durability.
