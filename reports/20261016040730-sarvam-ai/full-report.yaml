  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk posture
        blocks:
          - type: paragraph
            body: >-
              The highest residual risks are not legal incidents already on the record, but the combination of
              policy-linked concentration, frontier execution stretch, and missing public trust disclosures relative to
              the valuation step-up. Sarvam has real strengths: IndiaAI backing validates the sovereign-AI thesis, state
              partnerships give it unusually visible reference projects, and HCLTech provides a meaningful enterprise
              channel. The problem is that the same evidence also concentrates the story. Public proof of
              commercialization still leans heavily on government-linked deployments and one strategic distribution
              partner, while the June 2026 first close priced Sarvam as a unicorn before public evidence fully
              demonstrated independent benchmark leadership, diversified production revenue, or mature
              regulated-workload assurance.
            claimRefs:
              - CR001
              - CR004
              - CR005
              - CR011
              - CR014
      - number: '7.2'
        title: Regulatory and policy dependence
        blocks:
          - type: paragraph
            body: >-
              Sarvam’s strongest public wedge is sovereignty for India-specific and regulated workloads, so policy and
              procurement dependence are inseparable from its legal and regulatory risk. PIB and company materials show
              that Sarvam’s IndiaAI selection, Odisha compute-hub plan, and Tamil Nadu partnership are central proof
              points for why the company matters. That is helpful, but it also means investors are underwriting
              execution inside slow-moving public systems where contracting friction, localization requirements, and
              political sponsorship matter. The source pool also does not close the compliance-proof gap: public
              materials stress secure, locally governed deployment, yet they do not surface the concrete assurance
              artifacts a regulated buyer or investor would usually want before treating sovereign positioning as a
              substitute for operational trust.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR014
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR006
              - CR008
              - CR014
      - number: '7.3'
        title: Operational and technical execution
        blocks:
          - type: paragraph
            body: >-
              Operationally, Sarvam now has to prove that sovereign-AI ambition translates into reliable products, not
              just symbolic independence. TechTimes’ reporting is useful because it names the real stretch: Sarvam is
              trying to fund frontier model research, compute expansion, and vertical solution rollout at the same time,
              while also moving into agentic AI, coding, and cybersecurity. That creates a classic execution trap where
              each frontier program can absorb capital and leadership attention before benchmark leadership or
              production quality is independently validated. The provenance critique around Sarvam-M is partly answered
              by 2026’s from-scratch releases, but benchmark credibility still matters because public model scores
              remained largely self-reported as of mid-2026. Against that backdrop, cheaper or easier-to-integrate
              foreign models remain a practical substitution risk even when Sarvam’s India-specific product fit is
              strategically better.
            claimRefs:
              - CR008
              - CR009
              - CR010
              - CR011
              - CR013
