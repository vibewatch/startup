chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, product scope, and current stage
        blocks:
          - type: paragraph
            body: >-
              Sarvam AI presents itself as an Indian full-stack sovereign AI company building models, infrastructure,
              and deployed applications inside India, with a commercial scope that spans enterprise software,
              developers, and public-sector workflows. Independent profiles align on the core identity: the company is
              headquartered in Bengaluru, was founded in August 2023, and is now operating from a post-Series B stage
              rather than as a pre-seed research lab. What is still less transparent is the commercial conversion of
              that platform breadth into recurring software economics, because public materials emphasize strategic
              positioning and product breadth more than audited revenue, customer-count, or margin disclosure.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO010
              - CO013
              - CO016
          - type: table
            tableRef: TO001
            claimRefs:
