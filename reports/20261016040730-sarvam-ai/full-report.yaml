  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: sovereign AI infrastructure for Indian-language workflows'
        blocks:
          - type: paragraph
            body: >-
              Public evidence defines Sarvam's addressable market more narrowly than "enterprise AI" or consumer
              assistants. Sarvam's own positioning and the PIB backgrounder both frame the company as a full-stack
              platform built, deployed, and governed in India for enterprises, governments, and developers, which puts
              the core market in India-hosted language, speech, document, and workflow automation rather than generic
              English-first model access. The demand logic is also country specific: third-party coverage repeatedly
              ties the opportunity to India's 22 official languages, population-scale digital services, and buyers that
              cannot easily route sensitive workloads through foreign APIs. That boundary also clarifies the main
              substitutes. The status quo is not no software; it is foreign frontier-model APIs and incumbent
              IT-services-led AI implementations competing for the same enterprise and public-sector budgets, especially
              where local language quality, data residency, and workflow integration matter.
            claimRefs:
              - CM001
              - CM002
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM010
              - CM011
      - number: '2.2'
        title: 'Sizing lenses: public budgets, planned compute, and deployed workload'
        blocks:
          - type: paragraph
            body: >-
              The public record supports multiple sizing lenses, but not a clean TAM/SAM/SOM stack. At the broadest
              level, TechTimes ties Sarvam's opportunity to the IndiaAI Mission's Rs 10,372 crore budget, while the PIB
              backgrounder adds that Sarvam itself is one of 12 selected organizations and has Rs 246.72 crore of
              financial and compute support. That is not equivalent to Sarvam revenue, but it does show sovereign-AI
              infrastructure is backed by an explicit public spending envelope. Below that, the Odisha and Tamil Nadu
              partnerships create narrower deployment and capacity lenses: a planned 50MW Odisha compute hub, a planned
              20MW Digital Sangam data center, and an announced target of serving 79 lakh farm households through a
              Tamil Nadu assistant. On the usage side, TechTimes cites 10 million daily API calls and a voice campaign
              supporting 45 million policyholders, which shows real throughput but still stops short of disclosing
              contract values. Even the supply lens has unresolved ambiguity, because public sources disagree on whether
              Sarvam received 4,086 or 4,096 H100 GPUs under IndiaAI Mission support. The right conclusion is that the
              market looks material and infrastructure-led, but the public evidence is still better at proving demand
              vectors than at proving Sarvam's capture rate.
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
              - CM012
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
              - CM012
      - number: '2.3'
        title: Buyer map, budget ownership, and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              The current buyer map spans three visible channels. First, state and central public-sector programs appear
              to buy or sponsor infrastructure and citizen-service deployments, with digital-governance and sector
              departments acting as budget owners. Second, regulated enterprises such as insurers, banks, and
              financial-services firms appear in public customer references, which implies budgets can come from CIO,
              digital-transformation, customer-service, and operations teams rather than a pure innovation budget.
              Third, developers and startups can trial the stack with rupee-denominated API pricing and free credits,
              which lowers procurement friction for experimentation. The main adoption drivers are clear: India-language
              coverage, local hosting, and the ability to embed AI into citizen-facing and regulated workflows. The main
              constraints are equally clear. Public evidence does not isolate Sarvam's standalone SAM, deal sizes, or
              mix between government, enterprise, developer, and any device channels, so investors still cannot convert
              deployment proof into a reliable revenue bridge. Independent contract economics are also sparse, and the
              conflicting GPU figures show that even basic supply-side inputs are not yet perfectly disclosed.
            claimRefs:
              - CM004
              - CM006
              - CM009
              - CM010
              - CM011
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM003
              - CM004
              - CM006
              - CM009
              - CM010
              - CM011
      - number: '2.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The market wedge is infrastructure-led, not chatbot-led
            body: >-
              The strongest evidence is not a consumer AI story; it is a sovereign stack story where compute, language
              coverage, and public-service integration create the first credible budget pools.
            calloutType: insight
            claimRefs:
              - CM001
              - CM003
              - CM004
              - CM005
              - CM012
          - type: callout
            title: Demand visibility is ahead of monetization visibility
            body: >-
              Public sources show real throughput and named customers, but they still do not disclose enough contract
              economics to convert usage proof into a defensible standalone SAM or revenue bridge.
            calloutType: risk
            claimRefs:
              - CM007
              - CM008
              - CM011
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitor set is wider than frontier-model peers
        blocks:
          - type: paragraph
            body: >-
              Sarvam does compete with named frontier-model vendors, but the public evidence in this pool points to a
              wider landscape than a single "Indian ChatGPT" frame. Official company material says Sarvam is building a
              full-stack platform developed, deployed, and governed in India, spanning conversational AI, document
              intelligence, content transformation, coding and work agents, and speech and vision models. That puts its
              buyer alternatives into at least four buckets: global frontier-model vendors such as ChatGPT and Gemini,
              domestic sovereign-AI peers such as Krutrim, services-led incumbents that can package AI into enterprise
              programs, and internal-build routes assembled on cloud, OEM, and SI relationships. For a buyer whose core
              problem is multilingual speech, OCR, or regulated deployment, Sarvam's overlap with those categories is
              real even when the competing "product" is a bundled service or an internally orchestrated stack rather
              than a single model API.
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP007
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
      - number: '3.2'
        title: Distribution power sits partly with partners, not only with model quality
        blocks:
          - type: paragraph
            body: >-
              Sarvam's August 2026 Circle launch makes distribution strategy central to the competitive picture. Sarvam
              explicitly organized its go-to-market around cloud providers, OEMs, consulting firms, system integrators,
              enterprise software platforms, and investors, then named AWS, HCLTech, Thoughtworks, IBM, HP, and MoEngage
              as example partners. That expands procurement reach and implementation capacity, but it also means parts
              of the buying journey are mediated by channels that can present alternatives. The HCLTech case is the
              clearest example: TechTimes says HCLTech simultaneously took a 10.46% equity stake in Sarvam and
              maintained strategic AI partnerships with OpenAI and Google Cloud. For enterprise buyers, that creates a
              competitive dynamic where Sarvam can benefit from incumbent distribution without fully owning the account,
              making multi-homing and solution bundling more likely than clean platform lock-in.
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP011
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP006
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP012
              - CP013
      - number: '3.3'
        title: Public proof is strongest on localized performance and weakest on durable pricing control
        blocks:
          - type: paragraph
            body: >-
              The clearest head-to-head evidence in this assigned pool comes from localized workload performance, not
              from full commercial parity tables. AI Funding Tracker reports Sarvam Vision at 84.3% on the cited
              English-only olmOCR-Bench subset, ahead of Gemini 3 Pro at 80.2% and ChatGPT at 69.8%, and says Bulbul V3
              is positioned at ₹1 per minute for enterprise voice interactions as a lower-cost alternative to ElevenLabs
              for Indian-language use cases. Those claims support a differentiated wedge in OCR, speech, and
              India-specific deployment contexts. They do not yet prove broad category lock-in. This pool still lacks
              realized enterprise contract terms, discounting behavior, and retention data, so the main durability
              question is whether benchmark wins plus sovereign positioning are enough to defend pricing once large
              channel partners and global-model vendors push into the same accounts.
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP008
              - CP009
              - CP010
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Where Sarvam is hardest to substitute
            body: >-
              The assigned evidence is most convincing where Indian-language speech, OCR, sovereign deployment, and
              public-sector adoption are part of the buying criterion, because Sarvam has both localized product proof
              and state-linked deployment references in those categories.
            calloutType: strength
            claimRefs:
              - CP008
              - CP010
              - CP011
              - CP012
          - type: callout
            title: Channel partners can also be alternative sellers
            body: >-
              Sarvam's go-to-market breadth depends on partners whose own incentives are not exclusive. HCLTech's
              simultaneous OpenAI, Google Cloud, and Sarvam relationships illustrate how buyer access can expand without
              creating durable channel lock-in.
            calloutType: risk
            claimRefs:
              - CP004
              - CP006
              - CP013
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model is visible at the channel level, not at the booked-revenue level
        blocks:
          - type: paragraph
            body: >-
              The assigned sources consistently describe Sarvam as a full-stack sovereign-AI vendor selling into
              enterprises, governments, and developers through APIs, platform products, and customized deployments
              rather than through a consumer-subscription model. Independent coverage adds useful deployment proxies:
              TechTimes reports 10 million API calls, more than 2 million daily interactions, a 45 million-policyholder
              insurance renewal program, and 35 million processed document pages. Those metrics support the case that
              Sarvam has real usage and implementation activity, but they do not reveal realized pricing, recurring
              revenue mix, or how much of delivery is software versus services-heavy work.
