      - number: '5.3'
        title: Differentiation, maturity signals, and unresolved technical risk
        blocks:
          - type: paragraph
            body: >-
              Sarvam's clearest differentiation is not generic frontier performance; it is the combination of Indic
              language specialization, sovereign deployment positioning, and workflow products built for voice,
              document, and public-service contexts. The public evidence is directionally strong on technical ambition
              and adoption narratives, but much of the proof still comes from company, partner, or government-issued
              material. The same gap shows up in trust and maturity: public pages do not disclose independent uptime
              history, detailed security architecture, or third-party benchmark methodology for several promoted claims.
              The earlier criticism of Sarvam-M also matters because it shows how closely credibility is tied to whether
              Sarvam can keep proving first-principles model development instead of relying on adapted foreign bases.
