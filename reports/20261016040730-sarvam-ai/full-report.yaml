      - number: '4.2'
        title: Government-backed compute lowers near-term infrastructure burden but not financing dependency
        blocks:
          - type: paragraph
            body: >-
              Public evidence points to a capital structure that is stronger than most young frontier AI startups but
              still funding-dependent. Sarvam disclosed a $41 million Series A in December 2023, then reached a $234
              million Series B first close at a $1.5 billion valuation in June 2026, with reporting that the company is
              still targeting a $300 million round size. At the same time, third-party profiles repeatedly credit
              IndiaAI Mission compute support and roughly Rs99 crore of subsidy with reducing near-term model training
              cash needs. That support improves runway quality, but it does not substitute for disclosed cash balances,
              burn, debt, or committed economics on new large-scale infrastructure initiatives.
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI009
              - CI010
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI007
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.3'
        title: Financial diligence still hinges on undisclosed unit economics and next-round terms
        blocks:
          - type: paragraph
            body: >-
              The public record is enough to conclude that Sarvam has strategic demand signals, meaningful institutional
              distribution, and a financing base that can support continued frontier-model investment in India today. It
              is not enough to underwrite software revenue quality, margin durability, or self-funded scale. The most
              decision-relevant missing inputs are realized API and enterprise pricing, revenue mix between product and
              services, gross margin by workload, customer concentration, cash on hand, and monthly burn. Until those
              numbers are disclosed directly, the prudent financial view is that commercialization is promising but
              unproven and that future financing remains part of the operating model.
            claimRefs:
              - CI011
              - CI013
              - CI014
              - CI015
      - number: '4.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Traction is public; revenue quality is not
            body: >-
              Sarvam has enough disclosed deployments to support a serious commercialization story, but the visible
              metrics are activity proxies rather than finance metrics. That makes distribution strength easier to
              verify than recurring-software quality.
            calloutType: insight
            claimRefs:
              - CI003
              - CI004
              - CI005
              - CI012
          - type: callout
            title: Fresh capital reduces pressure, but does not close the underwriting loop
            body: >-
              The June 2026 financing and government-backed compute support are meaningful cushions, yet they do not
              replace missing data on burn, margin, or contract economics. Reported top-up fundraising keeps next-round
              dependency squarely in scope.
            calloutType: risk
            claimRefs:
              - CI006
              - CI007
              - CI008
              - CI010
              - CI011
