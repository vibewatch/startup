  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      Sarvam's public stack runs from sovereign compute and frontier-model training through APIs, packaged workflow
      products, and public-sector deployment surfaces.
    data:
      layers:
        - label: Sovereign compute and mission layer
          detail: Public backing and planned domestic compute infrastructure anchor the stack.
          modules:
            - IndiaAI Mission support cited at Rs 246.72 crore
            - Odisha 50MW AI-optimized facility (planned)
            - Tamil Nadu Digital Sangam 20MW AI data center (planned)
          outputs:
            - Domestic compute access
            - Public-sector deployment path
        - label: Frontier model and tokenizer layer
          detail: Model disclosures emphasize MoE efficiency and Indic language economics.
          modules:
            - Sarvam 30B (32K context)
            - Sarvam 105B (128K context)
            - Indic-optimized tokenizer
          outputs:
            - Speech, chat, and document base models
        - label: API primitives
          detail: Developer surfaces expose low-level building blocks for integration.
          modules:
            - REST / WebSocket / batch endpoints
            - Python and JavaScript SDKs
            - STT, TTS, translation, chat, document extraction
          outputs:
            - Integratable model services
        - label: Workflow products
          detail: Higher-level applications package the models into business workflows.
          modules:
            - Voice Agents
            - Doc Agents
            - Content Studio
            - Cowork and Coding Agent
          outputs:
            - Contact-center automation
            - Document workflows
            - Localization workflows
        - label: Deployment and channel layer
          detail: Public materials describe multiple delivery paths for regulated buyers and builders.
          modules:
            - Managed cloud
            - Private cloud / VPC
            - Air-gapped on-premise
            - Startup program and builder onboarding
          outputs:
            - Enterprise deployment flexibility
            - External builder ecosystem
        - label: Proof points and dependencies
          detail: Public maturity proof comes mostly from partners, government users, and company narratives.
          modules:
            - UIDAI / Aadhaar use case
            - Tata Capital and Infosys references
            - NVIDIA and Yotta infrastructure dependency
          outputs:
            - Production traction signal
            - Concentration and verification risk
    approximationNotes: >-
      This figure is a synthesized architecture view built from public disclosures rather than an internal system
      diagram.
    claimRefs:
      - CE005
      - CE006
      - CE008
      - CE009
      - CE010
      - CE012
  - id: FU001
    title: Customer journey map
    type: journey-map
    summary: >-
      Public evidence points to a multi-motion go-to-market that begins with developers and sovereign infrastructure,
      then expands through enterprise and public-service deployments.
    data:
      items:
        - label: Developer and startup discovery
          actor: Developers and startup builders
          stage: Trial and build
          touchpoints:
            - Open models
            - Model APIs
            - Startup credits
          note: Ecosystem seeding precedes proof of paid retention.
          tone: positive
        - label: Workflow integration
          actor: Enterprise product and operations teams
          stage: Prototype to deployment
          touchpoints:
            - Voice agents
            - Document AI
            - Business-system integrations
          note: The platform is positioned for workflow automation in Indian-language environments.
          tone: positive
        - label: Regulated-sector deployment
          actor: BFSI, insurance, healthcare, legal, and other regulated sectors
          stage: Production use cases
          touchpoints:
            - Customer-facing workflows
            - Back-office workflows
            - Private-data fine-tuning
          note: Sector breadth is disclosed more clearly than named enterprise logos.
          tone: neutral
        - label: State procurement
          actor: State governments and public institutions
          stage: Infrastructure and service design
          touchpoints:
            - Sovereign compute
            - Public-service assistants
            - Industrial safety and skilling
          note: Named public-sector programs supply the clearest disclosed customer proof.
          tone: positive
        - label: Population-scale service delivery
          actor: Citizens and field users
          stage: Scaled usage target
          touchpoints:
            - Farm advisory
            - Citizen helplines
            - Multilingual voice interfaces
          note: Reach claims are ambitious, but active-usage evidence is still limited.
          tone: neutral
        - label: Expansion through channels
          actor: HCLTech and other strategic partners
          stage: Enterprise expansion
          touchpoints:
            - Industry-specific solutions
            - Global enterprise client access
            - Government account leverage
          note: Channel expansion could be powerful, but disclosed concentration exposure is still unclear.
          tone: warning
    approximationNotes: The sequence represents the disclosed adoption path, not a measured conversion funnel.
