  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The investable question is not whether Sarvam matters strategically; it is whether the public record is
              already strong enough to justify paying up at or above the latest private mark. The answer remains no.
              Multiple sources line up around a June 2026 Series B first close of $234 million at a $1.5 billion
              valuation, with HCLTech contributing $150 million and taking a 10.46% stake. That validates strategic
              importance and distribution potential, but it does not disclose the software-economics evidence usually
              needed to underwrite a clean buy call. With public reports now discussing a possible top-up that could
              push valuation toward $3 billion, entry discipline matters more than narrative momentum.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV012
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV010
              - CV011
              - CV012
              - CV015
      - number: '8.2'
        title: What supports the thesis and what still blocks conviction
        blocks:
          - type: paragraph
            body: >-
              The thesis is easy to understand. Sarvam says it has built a full-stack AI platform governed in India, is
              deepening sovereign-AI partnerships with Indian states, and now has HCLTech as both a strategic investor
              and go-to-market amplifier. Independent reporting adds deployment proof: more than 2 million daily
              interactions, 10 million API calls, and named customers across Indian financial services. The anti-thesis
              is equally important. A detailed company profile still describes the business as primarily pre-revenue at
              scale, while outside coverage stresses that sovereign AI still depends on foreign chips, cloud providers,
              and open-source research. That mix supports strategic demand, but not yet durable pricing power or
              underwriting-grade visibility on margins.
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV011
              - CV013
              - CV014
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV007
              - CV008
              - CV010
              - CV011
              - CV013
              - CV016
      - number: '8.3'
        title: Scenario framing and valuation stance
        blocks:
          - type: paragraph
            body: >-
              The base case should anchor on execution rather than on policy prestige alone. Sarvam is trying to convert
              a sovereign-AI position into commercial scale across enterprise software, public-sector deployments, and
              continued frontier model development. The proceeds plan targets inferencing, agentic AI, and larger-model
              training, while outside reporting notes that the round still had capital left to close and that
              simultaneous pushes into coding, cybersecurity, and multiple verticals are a central execution risk. That
              makes a stretched stance more appropriate than a bullish one: upside exists if the HCLTech channel and
              public-sector footprint turn into repeatable revenue, but the current mark already prices in a lot of that
              success before audited operating proof is public.
            claimRefs:
              - CV001
              - CV009
              - CV010
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV007
              - CV010
              - CV012
              - CV015
              - CV016
      - number: '8.4'
        title: Final diligence asks and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The next diligence step is not a new story about India-first AI; it is a more specific proof pack. The
              main blockers are the same ones that keep this chapter at research-more: current cap-table and preference
              details, audited revenue quality, and better evidence on how much of the reported deployment footprint is
              recurring software versus services, pilots, or subsidized adoption. A thesis break would be a top-up or
              follow-on priced materially above the current mark without corresponding disclosure on margins, retention,
              or customer concentration, because that would increase valuation risk faster than it increases proof.
              Conversely, transparent software economics or a more conservative entry point would improve the
              recommendation quickly.
            claimRefs:
              - CV010
              - CV012
              - CV015
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Current call
            body: >-
              Research more rather than buy: strategic relevance is clear, but public economics and financing terms are
              still too thin for price-insensitive underwriting at the latest mark.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV012
              - CV015
          - type: callout
            title: Main valuation risk
            body: >-
              The biggest risk is that sovereign-AI prestige and financing momentum move faster than disclosed
              recurring-revenue quality, leaving later investors exposed to compression if commercialization lags.
            calloutType: risk
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV015
