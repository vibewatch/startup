  - id: FP001
    title: Competitive positioning map
    type: quadrant
    summary: >-
      Ordinal positioning from the assigned evidence favors Sarvam on India-specific fit, while incumbent channels still
      dominate delivery reach.
    data:
      xAxis:
        label: India-specific fit (1=generic, 5=India-native)
        min: 1
        max: 5
      yAxis:
        label: Distribution / delivery reach (1=narrow, 5=incumbent-scale)
        min: 1
        max: 5
      points:
        - label: Sarvam AI
          x: 5
          'y': 4
          tone: high
          note: Full-stack India-built position with partner-led enterprise and public-sector reach.
        - label: Krutrim
          x: 4
          'y': 2
          tone: medium
          note: Domestic sovereign-AI peer, but this pool shows less distribution proof than Sarvam.
        - label: OpenAI / ChatGPT
          x: 2
          'y': 4
          tone: risk
          note: Strong ecosystem presence, but this pool does not show India-native deployment posture.
        - label: Google / Gemini
          x: 2
          'y': 4
          tone: risk
          note: Strong cloud distribution, but weaker localized OCR result in the cited comparison.
        - label: HCLTech-led mixed stack
          x: 3
          'y': 5
          tone: risk
          note: Massive enterprise reach and optionality across Sarvam, OpenAI, and Google Cloud.
        - label: Internal build
          x: 3
          'y': 1
          tone: warning
          note: Flexible for large buyers, but delivery and tuning burden remain internalized.
    approximationNotes: >-
      Axes use evidence-backed ordinal scoring rather than source-authored coordinates; scores summarize the relative
      localization and distribution signals visible in this assigned pool.
    claimRefs:
