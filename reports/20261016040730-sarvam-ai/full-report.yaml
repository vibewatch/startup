              - CR014
      - number: '7.4'
        title: Partner, financial, and kill criteria
        blocks:
          - type: paragraph
            body: >-
              HCLTech is the most important mitigation in the public record because it improves Sarvam’s channel
              credibility with large buyers and reduces the chance that sovereign-AI positioning stays trapped in
              public-sector rhetoric. It is not a full de-risker. The same relationship can become a concentration point
              if route-to-market, pricing power, or product roadmap decisions become overly shaped by one partner’s
              sales motion. The financing headline also remains ahead of public underwriting detail: investors can see
              the first-close valuation, but not the complete preference stack, remaining-close status, or
              compute-financing obligations. The cleanest kill criteria are therefore measurable: if state-linked
              reference projects do not turn into auditable production deployments, if HCLTech-led distribution does not
              diversify into repeatable non-state revenue, or if trust artifacts still remain undisclosed after the
              round, the valuation premium becomes hard to defend.
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR010
              - CR012
              - CR014
