      - CP013
  - id: FI001
    title: Revenue model bridge
    type: flow
    summary: >-
      Public evidence shows how subsidized model capacity feeds distribution and deployments, but not how usage converts
      into booked margin.
    data:
      nodes:
        - id: subsidized-compute
          label: Subsidized compute base
          detail: IndiaAI Mission compute support and subsidy lower near-term model-training cash needs.
          tone: positive
        - id: product-surface
          label: API and platform surface
          detail: Sarvam is publicly described as selling models, speech, vision, and agent capabilities.
          tone: neutral
        - id: institutional-distribution
          label: Institutional distribution
          detail: Official materials focus on enterprises, governments, developers, and state-linked deployments.
          tone: neutral
        - id: usage-traction
          label: Usage and deployment proxies
          detail: API calls, policyholder campaigns, and processed pages show activity without showing realized revenue.
          tone: positive
        - id: monetization-gap
          label: Monetization-quality gap
          detail: Public evidence does not disclose realized pricing, revenue mix, or gross margin.
          tone: risk
        - id: financing-dependence
          label: Financing dependence
          detail: Series B proceeds and reported top-up plans suggest continued external capital remains relevant.
          tone: risk
      edges:
        - from: subsidized-compute
          to: product-surface
          label: supports model training and product availability
        - from: product-surface
          to: institutional-distribution
          label: sold into enterprise, developer, and public-sector channels
        - from: institutional-distribution
          to: usage-traction
          label: creates observable deployment volume
        - from: usage-traction
          to: monetization-gap
          label: usage does not reveal yield or margin
        - from: monetization-gap
          to: financing-dependence
          label: opaque economics keep future funding material
