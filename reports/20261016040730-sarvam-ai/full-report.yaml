        title: Architecture, deployment, and operating dependencies
        blocks:
          - type: paragraph
            body: >-
              The public architecture story is a full-stack sovereign-AI stack with meaningful external dependencies
              rather than a fully vertically integrated system. Government collateral and partner narratives tie
              Sarvam's product layer to IndiaAI-backed compute, large-model training, and deployment through NVIDIA and
              Yotta infrastructure. The product and public sector narratives also extend the stack into infrastructure
              projects such as Odisha's planned 50MW capacity hub and Tamil Nadu's planned 20MW Digital Sangam data
              center, which broadens the story from software APIs to national-scale delivery. That makes the technical
              moat partly about local-language models and workflow packaging, but partly about privileged access to
              compute, public-sector distribution, and integration partners.
