      - number: '8.4'
        title: 最终尽调问题与论点破坏触发点
        blocks:
          - type: paragraph
            body: >-
              下一步尽调不是再讲一个印度优先 AI
              的故事，而是索取更具体的证明包。使本章仍停留在继续研究的主要阻碍也没有变化：当前股权结构表和优先股堆叠、经审计的收入质量，以及更好的证据来说明已报告部署足迹中有多少是经常性软件，而非服务、试点或补贴推动的采用。
              如果追加融资或后续融资定价显著高于当前估值，却没有同步披露利润率、留存或客户集中度，就会让估值风险增长快于证明力度，构成论点破坏。 反过来，透明的软件经济性或更保守的入场价格，都能迅速改善建议。
            claimRefs:
              - CV010
              - CV012
              - CV015
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 当前判断
            body: 继续研究而非买入：战略相关性明确，但在最新估值下，公开经济性和融资条款仍不足以支持不考虑价格的投资判断。
