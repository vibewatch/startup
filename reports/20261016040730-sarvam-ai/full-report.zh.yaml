        title: 展示项
        blocks:
          - type: callout
            title: 市场切口由基础设施驱动，而非聊天机器人驱动
            body: 最有力的证据不是消费级 AI 故事，而是主权技术栈故事：算力、语言覆盖和公共服务集成共同形成了首批可信的预算池。
