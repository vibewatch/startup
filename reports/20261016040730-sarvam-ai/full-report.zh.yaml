          outputs:
            - 语音、聊天和文档基础模型
        - label: API 基础组件
          detail: 开发者入口提供用于集成的底层构件。
          modules:
            - REST / WebSocket / 批处理端点
            - Python 和 JavaScript SDK
            - STT、TTS、翻译、聊天、文档提取
          outputs:
            - 可集成的模型服务
        - label: 工作流产品
          detail: 更高层的应用把模型封装进业务工作流。
          modules:
            - Voice Agents
            - Doc Agents
            - Content Studio
            - Cowork 与 Coding Agent
          outputs:
            - 联络中心自动化
            - 文档工作流
            - 本地化工作流
        - label: 部署与渠道层
          detail: 公开材料描述了面向受监管买家和构建者的多条交付路径。
          modules:
            - 托管云
            - 私有云 / VPC
            - 物理隔离的本地部署
            - 初创项目与构建者入驻
          outputs:
            - 企业部署灵活性
            - 外部构建者生态
        - label: 证明点与依赖
          detail: 公开成熟度证明主要来自合作伙伴、政府用户和公司叙事。
          modules:
            - UIDAI / Aadhaar 用例
            - Tata Capital 和 Infosys 引用
            - NVIDIA 和 Yotta 基础设施依赖
          outputs:
            - 生产落地牵引信号
            - 集中度和验证风险
    approximationNotes: 这张图是根据公开披露综合出的架构视图，不是内部系统图。
    claimRefs:
      - CE005
      - CE006
      - CE008
      - CE009
      - CE010
      - CE012
  - id: FU001
    title: 客户旅程图
    type: journey-map
    summary: 公开证据显示，这是一条多线并行的市场进入路径：先从开发者和主权基础设施切入，再扩展到企业和公共服务部署。
    data:
      items:
        - label: 开发者与初创公司发现
          actor: 开发者和初创公司构建者
          stage: 试用与构建
          touchpoints:
            - 开放模型
            - 模型 API
            - 初创公司额度
          note: 生态播种先于付费留存证明。
          tone: positive
        - label: 工作流集成
          actor: 企业产品和运营团队
          stage: 从原型到部署
          touchpoints:
            - 语音智能体
            - 文档 AI
            - 业务系统集成
          note: 平台定位于印度语言环境下的工作流自动化。
          tone: positive
        - label: 受监管行业部署
          actor: BFSI、保险、医疗、法律及其他受监管行业
          stage: 生产用例
          touchpoints:
            - 面向客户的工作流
            - 后台工作流
            - 私有数据微调
          note: 披露的行业覆盖比点名的企业 Logo 更清楚。
          tone: neutral
        - label: 州政府采购
          actor: 州政府和公共机构
          stage: 基础设施与服务设计
          touchpoints:
            - 主权算力
            - 公共服务助手
            - 工业安全与技能培训
          note: 点名的公共部门项目提供了最清晰的客户证明。
          tone: positive
        - label: 大规模人口服务交付
          actor: 公民和一线用户
          stage: 规模化使用目标
          touchpoints:
            - 农业咨询
            - 公民服务热线
            - 多语言语音界面
          note: 覆盖触达的说法很进取，但活跃使用证据仍然有限。
          tone: neutral
        - label: 通过渠道扩张
          actor: HCLTech 和其他战略合作伙伴
          stage: 企业扩张
          touchpoints:
            - 行业特定解决方案
            - 全球企业客户接入
            - 政府客户杠杆
          note: 渠道扩张可能很有力，但已披露的集中度敞口仍不清楚。
          tone: warning
    approximationNotes: 该顺序代表已披露的采用路径，而不是经过测量的转化漏斗。
    claimRefs:
      - CU001
      - CU002
      - CU006
      - CU009
      - CU011
      - CU012
      - CU014
  - id: FR001
    title: 风险热力图
    type: matrix
    summary: 最高的剩余风险集中在与政府关联的集中度、执行跨度以及缺少公开保证证据这几个方面。
    data:
      columns:
        - label: 低概率
          detail: 未来 12 个月内的概率
        - label: 中概率
          detail: 未来 12 个月内的概率
        - label: 高概率
          detail: 未来 12 个月内的概率
      rows:
        - label: 严重影响
          note: 会实质性削弱投资逻辑或延迟规模化
          values:
            - null
            - null
            - label: 对国家 / IndiaAI 的依赖 + 前沿研发执行跨度
              note: 当前证明点和研发路线图都集中在少数难以执行的项目上。
              tone: critical
        - label: 高影响
          note: 会显著降低大型买家的信心
          values:
            - null
            - label: HCLTech 渠道集中度
              note: 合作伙伴很有帮助，但一个战略分销商仍然占据不成比例的重要性。
              tone: warning
            - label: 合规证明缺口
              note: 保留的材料中仍缺少公开审计、DPA 和事件披露。
              tone: warning
        - label: 中高影响
          note: 会放慢企业转化或拉长尽调
          values:
            - null
            - label: 项目摩擦拖累
              note: 协议延迟或采购进度拖延可能推迟商业化时间。
              tone: warning
            - label: 更便宜的全球模型赢得工作流
              note: 主权属性未必能永远抵消价格、速度或集成优势。
              tone: warning
        - label: 中等影响
          note: 会降低对技术主张的信心
          values:
            - null
            - label: 基准独立性缺口
              note: 对质量的主张仍需针对受监管用例进行更深入的第三方验证。
              tone: warning
            - null
        - label: 中低影响
          note: 可以修复，但仍会削弱投资判断的严谨性
          values:
            - null
            - label: Series B 条款不透明
              note: 优先股堆叠和剩余交割细节会影响投资判断的严谨性。
              tone: neutral
            - null
        - label: 低影响
          note: 只要核心商业化证明落地，就是可管理的问题
          values:
            - null
            - label: 多细分市场进入复杂度
              note: 同时服务企业、政府和开发者，可能模糊优先级和销售重点。
              tone: neutral
            - null
    approximationNotes: 热力图位置是对公开证据的分析综合，而不是统计评分模型。
    claimRefs:
      - CR006
      - CR009
      - CR011
      - CR012
      - CR013
      - CR014
  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 战略需求和融资证明确实存在，但经济性缺口和执行范围过宽，使建议仍停留在继续研究。
