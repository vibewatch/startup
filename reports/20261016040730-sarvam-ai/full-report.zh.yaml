      - number: '8.3'
        title: 情景框架与估值立场
        blocks:
          - type: paragraph
            body: >-
              基准情景应锚定执行，而不是只锚定政策声望。Sarvam 正试图把主权 AI 定位转化为企业软件、公共部门部署和持续前沿模型开发上的商业规模。 募资用途计划投向推理、智能体 AI
              和更大模型训练；外部报道则指出，该轮仍有资金待交割，同时公司同时推进编程、网络安全和多个垂直领域，这构成核心执行风险。 因此，采取偏谨慎的立场比看多更合适：如果 HCLTech
              渠道和公共部门足迹转化为可重复收入，仍有上行空间；但在经审计的运营证明公开之前，当前估值已经计入了其中很大一部分成功。
