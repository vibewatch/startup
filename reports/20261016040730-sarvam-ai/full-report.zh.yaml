  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争集合不止前沿模型同行
        blocks:
          - type: paragraph
            body: >-
              Sarvam 确实与具名的前沿模型厂商竞争，但这批公开证据所呈现的格局，比单一的“印度版 ChatGPT”框架更广。 公司官方材料称，Sarvam 正在构建一套在印度开发、部署和治理的全栈平台，覆盖对话式
              AI、文档智能、内容转换、编程和工作智能体，以及语音和视觉模型。 因此买方替代方案至少分为四类：ChatGPT 和 Gemini 等全球前沿模型厂商，Krutrim 等本地主权 AI 同行，能把 AI
              打包进企业项目的服务型传统厂商，以及基于云、OEM 和 SI 关系搭建的内部开发路径。 核心问题是多语种语音、OCR 或受监管部署的买家，确实会遇到 Sarvam
              与这些类别的重叠；即使竞争产品是捆绑服务或内部编排的技术栈，而不是单一模型 API。
            claimRefs:
              - CP001
              - CP002
              - CP005
              - CP007
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP005
              - CP006
              - CP007
              - CP008
              - CP010
      - number: '3.2'
        title: 分销能力部分掌握在合作伙伴手中，而不只取决于模型质量
        blocks:
          - type: paragraph
            body: >-
              Sarvam 于 2026 年 8 月发布 Circle，使分销策略成为竞争格局的核心。Sarvam 明确围绕云服务商、OEM、咨询公司、系统集成商、企业软件平台和投资者组织上市策略，并列出
              AWS、HCLTech、Thoughtworks、IBM、HP 和 MoEngage 作为示例伙伴。 这扩大了采购触达和实施能力，但也意味着买方旅程的一部分由可能展示替代方案的渠道中介。 HCLTech
              是最清晰的例子：TechTimes 称，HCLTech 一方面持有 Sarvam 10.46% 的股权，另一方面仍与 OpenAI 和 Google Cloud 保持战略 AI 合作。
              对企业买家而言，这形成一种竞争动态：Sarvam 可以借助传统厂商分销，却不完全掌握客户账户，因此多重采购和方案捆绑可能性高于纯粹的平台锁定。
            claimRefs:
              - CP003
              - CP004
              - CP005
              - CP006
              - CP011
              - CP013
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP004
              - CP006
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP012
              - CP013
      - number: '3.3'
        title: 公开证明在本地化性能上最强，在持久定价控制上最弱
        blocks:
          - type: paragraph
            body: >-
              这批指定资料中最清晰的正面对比来自本地化工作负载性能，而不是完整的商业对等表。AI Funding Tracker 报告称，在引用的仅英语 olmOCR-Bench 子集上，Sarvam Vision 得分
              84.3%，领先 Gemini 3 Pro 的 80.2% 和 ChatGPT 的 69.8%；同时称 Bulbul V3 面向企业语音交互的定价为每分钟 ₹1，作为印度语种场景下 ElevenLabs
              的低成本替代方案。 这些主张支持其在 OCR、语音和印度特定部署场景中的差异化切口，但还不能证明广泛的品类锁定。
              这批资料仍缺少实际企业合同条款、折扣行为和留存数据，因此持久性问题在于：当大型渠道伙伴和全球模型厂商进入同一批账户后，基准测试优势加主权定位是否足以守住价格。
            claimRefs:
              - CP008
              - CP009
              - CP010
              - CP012
              - CP013
          - type: table
            tableRef: TP003
            claimRefs:
