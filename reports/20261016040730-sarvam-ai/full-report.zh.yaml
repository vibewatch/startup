chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、产品范围与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Sarvam AI 将自己定位为一家印度全栈主权 AI 公司，在印度境内构建模型、基础设施和已部署应用，商业范围覆盖企业软件、开发者及公共部门工作流。 独立资料对其核心身份的描述基本一致：总部位于班加罗尔，成立于
              2023 年 8 月，如今已处于 B 轮之后的阶段，不再是种子前研究实验室。 目前仍不够透明的是，平台覆盖面如何转化为可持续的软件经济性；公开材料更强调战略定位和产品广度，而不是经审计收入、客户数量或利润率。
            claimRefs:
