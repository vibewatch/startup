      - number: '1.2'
        title: 创始人、治理形态与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              公司身份与两位创始人紧密相连。留存的独立资料显示，两位创始人都来自 AI4Bharat 和 IIT Madras；Vivek Raghavan 还参与过 Aadhaar 生物识别工作，Pratyush Kumar
              则有 IBM 和 Microsoft 的研究经历。 这种创始人与市场的匹配，部分解释了早期资本形成的速度以及 Sarvam 在公共部门利益相关者中的可信度。
              但这也带来明显的关键人物依赖：现有证据确认了创始人、IndiaAI 支持和战略投资者，却没有呈现当前董事会名单、正式治理分工，或创始人之外清晰的管理梯队深度。
