      - number: '1.3'
        title: 融资历史、利益相关者影响力与已披露规模
        blocks:
          - type: paragraph
            body: >-
              Sarvam 的融资路径紧凑且战略色彩异常浓厚。成立约五个月后，公司便完成 $41M A 轮融资；到 2026 年 6 月，又宣布 $300M B 轮的 $234M 首轮交割，投后估值 $1.5B。
              HCLTech 投入 $150M 的战略领投，带来的不只是资本，还有分销层面的影响；Bessemer、Khosla 和 Peak XV 则延续了风险投资支持。 公司公开材料还展示了日交互量、API
              调用、数字化页面和音频量等使用代理指标，但这些是运营指标，不能替代收入质量、合同持久性或客户集中度披露。
