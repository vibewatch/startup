  summary: >-
    Sarvam AI 是一家总部位于班加罗尔的主权 AI 公司，面向印度语言及公共部门和企业场景，构建语言、语音、文档和智能体平台。 公司以印度优先的定位为基础，获得 HCLTech 的战略支持，乘上 IndiaAI 的势头，并于
    2026 年 6 月完成 B 轮首轮交割；但公开证据对其收入质量、股权结构表和利润率状况仍只有部分披露。
