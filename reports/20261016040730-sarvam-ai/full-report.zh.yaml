  - id: TV002
    title: 正方 / 反方论点表
    columns:
      - 视角
      - 论点
      - 哪些变化会改变判断
    rows:
      - - 正方
        - HCLTech 的 $150 million 领投及其明确的企业平台意图，为 Sarvam 这家印度 AI 初创公司带来了少见的战略分销杠杆。
        - 若能证明 HCLTech 渠道带来可重复的收入转化，并有具名企业部署，判断会更有底气。
      - - 正方
        - Sarvam 以印度优先定位、邦政府合作和已报道的部署规模，公开证明了其与主权 AI 的相关性。
        - 若有独立证据证明这些部署是可持续的付费软件，而非补贴项目或试点，正方论点会明显增强。
      - - 反方
        - 公开材料仍将该业务描述为规模化收入前阶段，也未披露经审计的软件经济性。
        - 董事会级别的收入组合、毛利率和续约数据，能直接降低估值不确定性。
      - - 反方
        - 即使是较为支持 Sarvam 的外部分析也认为主权 AI 不等于完全独立；同时覆盖模型、编程、网络安全和垂直行业，会放大执行复杂度风险。
        - 更聚焦的里程碑顺序或更清晰的资本配置证据，可能降低对执行风险的假设。
    notes: 论点结合了公司发布的信息和独立证据；本表旨在把战略叙事与可用于投资判断的商业证明分开。
