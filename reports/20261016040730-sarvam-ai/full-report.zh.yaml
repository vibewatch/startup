  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：面向印度语种工作流的主权 AI 基础设施
        blocks:
          - type: paragraph
            body: >-
              公开证据所界定的 Sarvam 可服务市场，比“企业 AI”或消费级助手更窄。Sarvam 的自我定位及 PIB 背景材料都将其描述为一个在印度构建、部署并治理的全栈平台，服务企业、政府和开发者。
              因此核心市场是印度托管的语言、语音、文档和工作流自动化，而不是通用的英语优先模型访问。需求逻辑也具有明显的国家特征：第三方报道反复将机会与印度 22 种官方语言、人口规模的数字服务，以及不易把敏感工作负载交给外国
              API 的买家联系起来。 这一边界也厘清了主要替代方案。现状不是没有软件，而是外国前沿模型 API 和由传统 IT 服务商主导的 AI
              实施方案，正在争夺同一批企业和公共部门预算，尤其是在本地语言质量、数据驻留和工作流集成重要的场景。
            claimRefs:
              - CM001
              - CM002
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM009
              - CM010
              - CM011
      - number: '2.2'
        title: 规模化视角：公共预算、规划算力与已部署工作负载
        blocks:
          - type: paragraph
            body: >-
              公开记录支持多个规模化视角，但还不足以构建干净的 TAM/SAM/SOM 框架。最宽口径上，TechTimes 将 Sarvam 的机会与 IndiaAI Mission 的 Rs 10,372 crore
              预算联系起来；PIB 背景材料补充称，Sarvam 是 12 家入选机构之一，并获得 Rs 246.72 crore 的资金和算力支持。 这不等同于 Sarvam 的收入，但说明主权 AI
              基础设施背后有明确的公共支出额度。再往下看，Odisha 和 Tamil Nadu 合作提供了更窄的部署和产能视角：规划中的 Odisha 50MW 算力中心、规划中的 20MW Digital Sangam
              数据中心，以及 Tamil Nadu 助手服务 79 lakh 个农户家庭的目标。 使用端方面，TechTimes 引用日均 1,000 万次 API 调用，以及一项覆盖 4,500
              万保单持有人的语音活动，显示出真实吞吐量，但仍没有合同金额披露。 即便供给端也有未解歧义，因为公开来源对 Sarvam 在 IndiaAI Mission 支持下获得 4,086 还是 4,096 张 H100
              GPU 说法不一。 正确结论是：市场看起来规模可观且由基础设施驱动，但公开证据更擅长证明需求向量，而不是证明 Sarvam 的市场捕获率。
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
              - CM012
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM008
              - CM012
      - number: '2.3'
        title: 买家地图、预算归属与采用约束
        blocks:
          - type: paragraph
            body: >-
              当前买家地图有三条清晰渠道。第一，州级和中央公共部门项目似乎会购买或资助基础设施及公民服务部署，数字治理和行业部门是预算归属方。
              第二，保险公司、银行和金融服务企业等受监管企业出现在公开客户参考中，意味着预算可能来自 CIO、数字化转型、客户服务和运营团队，而非纯创新预算。 第三，开发者和初创企业可以用卢比计价的 API
              和免费额度试用这套技术栈，降低了实验阶段的采购摩擦。 主要采用驱动因素很清楚：印度语种覆盖、本地托管，以及把 AI 嵌入面向公民和受监管工作流的能力。 约束同样清楚。公开证据没有拆分 Sarvam 的独立
              SAM、交易规模，或政府、企业、开发者和任何设备渠道之间的构成，因此投资者仍无法把部署证明转化为可靠的收入桥接。 独立合同经济性也很稀缺，而 GPU 数量的冲突说明即便是基础供给端输入也尚未完全披露。
            claimRefs:
