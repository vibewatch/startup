  - id: TV003
    title: 乐观 / 基准 / 悲观情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 主要风险
      - 概率信号
    rows:
      - - 乐观
        - HCLTech 分销转化为可重复的企业赢单，公共部门部署扩大，Sarvam 以接近或高于已报道补充融资路径的估值完成额外融资。
        - 要支撑下一轮 >$3.0 billion 估值，已披露商业指标必须追上部署规模。
        - 政策项目无法变现，或企业渠道转化不足。
        - 需要新增经常性收入质量披露，以及具名客户持续扩大的证据。
      - - 基准
        - Sarvam 保持战略势头，但商业披露只逐步改善，投资人仍主要按平台相关性给公司定价。
        - 当前 $1.5 billion 估值可以维持，但显著上行空间应等待收入质量足以支撑软件公司倍数的证据。
        - 估值由叙事主导的时间超过预期，限制有吸引力的入场点。
        - 持续的客户扩张、利润率证明和更清晰的融资完成情况，将验证这一路径。
      - - 悲观
        - 在收入透明度改善前，公司就推进补充融资或后续融资；与此同时，执行复杂度维持高位，主权 AI 依赖只得到部分缓解。
        - 如果商业化追不上当前估值，持平、结构化或低于当前估值的结果都可能出现。
        - 倍数压缩、融资未完成、客户集中或资本结构悬置，都可能进一步放大下行。
        - 若价格更高，却没有相匹配的软件经济性或优先权条款披露，将是负面信号。
    notes: 区间只锚定材料中已有的公开融资参考点：当前 $1.5 billion 估值，以及 Economic Times 报道的可能达到 $3 billion 的补充融资路径。
    claimRefs:
      - CV001
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
      - CV012
      - CV015
