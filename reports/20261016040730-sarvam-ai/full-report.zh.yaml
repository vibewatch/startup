        title: 里程碑、公共部门势头与未解决的尽调问题
        blocks:
          - type: paragraph
            body: >-
              里程碑模式重要，是因为 Sarvam 当前叙事不只依赖一笔融资。2025 年 4 月入选 IndiaAI、2026 年 2 月发布模型、推进 Odisha 和 Tamil Nadu 合作，以及 2026 年 6
              月完成 B 轮，这些共同显示公司正从研究信誉走向具有国家叙事色彩的基础设施和部署主张。 但最强的独立谨慎意见来自执行风险，而不是技术无关性：产品深度仍在形成，前沿模型在通用性能上仍占优，围绕 Sarvam
              的生态也仍处早期。 当前最重要的尽调问题仍是治理细节、经核实的软件经济性，以及除使用代理指标和公司发布的客户 logo 之外，对客户质量的独立证明。
