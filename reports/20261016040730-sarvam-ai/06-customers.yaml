company:
  name: Sarvam AI
chapter:
  number: 6
  title: Customers
  summary: >-
    Sarvam's public customer evidence points to three core constituencies—governments,
    regulated enterprises, and developers—but the strongest named proof is still concentrated
    in public-sector buildouts rather than mature enterprise references. The company has
    credible adoption surfaces and channel leverage, yet retention, customer concentration,
    and named production-account depth remain materially under-disclosed.
sections:
  - id: customer-segmentation
    title: Customer base is segmented across governments, enterprises, and developers
    body: >-
      The retained sources consistently describe Sarvam as serving three overlapping audiences:
      government institutions that need sovereign infrastructure, enterprise buyers in regulated
      or language-sensitive workflows, and developers who build on Sarvam APIs and open models.
      Public evidence is strongest on where Sarvam wants to sell rather than how much each segment
      already contributes. The official site frames the company around enterprise, government, and
      developer usage; the 2024 launch announcement expands that into sector-specific workflows such
      as financial services and legal; and later third-party coverage adds BFSI, insurance, healthcare,
      and public-service deployment as disclosed demand centers. That mix suggests Sarvam is not a
      single-product SaaS vendor but a multi-motion infrastructure company whose buyer map spans direct
      contracts, partner-led distribution, and self-serve developer adoption.
    claimRefs: [CU001, CU002, CU003, CU012]
    tableRefs: [TU001]
    figureRefs: [FU001]
  - id: adoption-proof
    title: Named proof is real, but the best-documented deployments are still public-sector led
    body: >-
      The clearest named customer proof in the retained pool is in Indian state partnerships rather
      than enterprise logos with production metrics. Sarvam's state-partnership announcement documents
      a signed Odisha MOU and a Tamil Nadu buildout anchored around Digital Sangam and citizen-service
      applications, while outside coverage supports that Sarvam is also pursuing enterprise and government
      vertical expansion at the same time. Investor and press coverage reinforce that commercial deployments
      exist and that enterprise usage is already broad enough to justify a distribution strategy with HCLTech,
      but those sources still stop short of disclosing customer counts, contract sizes, renewals, or named
      enterprise reference accounts. The result is credible adoption evidence, but not yet the kind of audited
      customer cohort view that would prove durability.
    claimRefs: [CU004, CU005, CU006, CU007, CU008, CU009, CU010, CU011]
    tableRefs: [TU002]
  - id: durability-and-concentration
    title: Durability and concentration remain the key unresolved customer questions
    body: >-
      Sarvam's public narrative implies meaningful customer momentum, but the retained evidence still leaves
      the durability layer mostly unproven. There is no disclosed NRR, GRR, churn, renewal cadence, or contract-length
      dataset in the assigned pool, and the named proof set is concentrated in government-linked initiatives and
      partner-mediated enterprise expansion rather than a diversified base of independently referenced production
      customers. That matters because government programs, sovereign-compute subsidies, and one or two strategic
      distribution relationships may accelerate early adoption without proving repeatable software economics. Until
      Sarvam discloses named enterprise deployments, concentration exposure, and renewal-quality metrics, the chapter's
      customer thesis remains promising but incomplete.
    claimRefs: [CU013, CU014, CU015]
    tableRefs: [TU003]
