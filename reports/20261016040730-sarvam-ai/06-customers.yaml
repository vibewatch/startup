  evidenceGaps:
    - type: missing-source
      severity: material
      topic: retention-disclosure-gap
      missingEvidence: Board-grade retention, renewal, churn, contract-duration, and cohort data for enterprise and government accounts.
      whyItMatters: Without durability metrics, customer quality cannot be separated from one-time pilot or launch momentum.
      diligencePath: Request cohort tables, renewal dashboards, and top-20 account histories segmented by government, enterprise, and developer-led revenue.
      relatedQuestionRefs: [QU005, QU007]
    - type: private-evidence-only
      severity: material
      topic: named-proof-gap
      missingEvidence: A named list of enterprise production customers with deployment status, use case, contract owner, and referenceability.
      whyItMatters: Public proof is concentrated in state-led initiatives, so enterprise production depth remains largely unverified.
      diligencePath: Obtain customer-reference calls, signed case studies, or procurement records for at least three non-government production accounts.
      relatedQuestionRefs: [QU003, QU008]
      relatedTableRefs: [TU003]
    - type: missing-source
      severity: material
      topic: concentration-risk
      missingEvidence: Revenue concentration by top customer, top channel partner, and government-linked programs, including exposure to HCLTech and IndiaAI-related projects.
      whyItMatters: The investment case changes materially if a small number of public-sector or partner relationships drive most disclosed demand.
      diligencePath: Request account-level revenue concentration, channel-sourced pipeline splits, and public/private customer mix by ARR or bookings.
      relatedQuestionRefs: [QU007]
