      - ["Government of Tamil Nadu", "Public sector citizen services", "Vivasāya Nanban assistant and unified citizen helpline for welfare and public services", "Planned population-scale deployment", "Provides the clearest disclosed end-user reach statement in the pool", "Reach target is forward-looking and does not prove sustained engagement or renewal"]
