    title: Customer journey map
    type: journey-map
    summary: Public evidence points to a multi-motion go-to-market that begins with developers and sovereign infrastructure, then expands through enterprise and public-service deployments.
    data:
      items:
        - label: Developer and startup discovery
          actor: Developers and startup builders
          stage: Trial and build
          touchpoints:
            - Open models
            - Model APIs
            - Startup credits
          note: Ecosystem seeding precedes proof of paid retention.
          tone: positive
        - label: Workflow integration
          actor: Enterprise product and operations teams
          stage: Prototype to deployment
          touchpoints:
            - Voice agents
            - Document AI
            - Business-system integrations
          note: The platform is positioned for workflow automation in Indian-language environments.
          tone: positive
        - label: Regulated-sector deployment
          actor: BFSI, insurance, healthcare, legal, and other regulated sectors
          stage: Production use cases
          touchpoints:
            - Customer-facing workflows
            - Back-office workflows
            - Private-data fine-tuning
          note: Sector breadth is disclosed more clearly than named enterprise logos.
          tone: neutral
        - label: State procurement
          actor: State governments and public institutions
          stage: Infrastructure and service design
          touchpoints:
            - Sovereign compute
            - Public-service assistants
            - Industrial safety and skilling
          note: Named public-sector programs supply the clearest disclosed customer proof.
          tone: positive
        - label: Population-scale service delivery
          actor: Citizens and field users
          stage: Scaled usage target
          touchpoints:
            - Farm advisory
            - Citizen helplines
            - Multilingual voice interfaces
          note: Reach claims are ambitious, but active-usage evidence is still limited.
          tone: neutral
        - label: Expansion through channels
          actor: HCLTech and other strategic partners
          stage: Enterprise expansion
          touchpoints:
            - Industry-specific solutions
            - Global enterprise client access
            - Government account leverage
          note: Channel expansion could be powerful, but disclosed concentration exposure is still unclear.
          tone: warning
    approximationNotes: "The sequence represents the disclosed adoption path, not a measured conversion funnel."
    claimRefs: [CU001, CU002, CU006, CU009, CU011, CU012, CU014]
callouts:
  - calloutType: insight
    title: Customer proof is strongest in sovereign and public-service contexts
    body: Named, current evidence is concentrated in state partnerships and public-service use cases rather than independently documented enterprise reference accounts.
    claimRefs: [CU006, CU008, CU009, CU013]
  - calloutType: risk
    title: Durability evidence lags the demand narrative
    body: The retained public sources support broad adoption surfaces, but they do not disclose renewal, churn, contract duration, or top-customer concentration.
    claimRefs: [CU013, CU014, CU015]
