callouts:
  - calloutType: "insight"
    title: "The market wedge is infrastructure-led, not chatbot-led"
    body: "The strongest evidence is not a consumer AI story; it is a sovereign stack story where compute, language coverage, and public-service integration create the first credible budget pools."
    claimRefs: [CM001, CM003, CM004, CM005, CM012]
  - calloutType: "risk"
    title: "Demand visibility is ahead of monetization visibility"
    body: "Public sources show real throughput and named customers, but they still do not disclose enough contract economics to convert usage proof into a defensible standalone SAM or revenue bridge."
    claimRefs: [CM007, CM008, CM011, CM015]
