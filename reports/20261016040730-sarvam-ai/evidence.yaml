evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Current board roster, voting/control rights, preference stack, investor side letters, and any Series B secondary
      mechanics.
    whyItMatters: >-
      The chapter can identify strategic backers but cannot assess actual control, downside protection, or governance
      leverage without transaction documents.
    diligencePath: >-
      Request the current cap table, shareholder agreement, board-observer list, and the signed Series B term sheet or
      definitive documents.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: software-economics
    missingEvidence: Board-grade revenue, ARR, gross margin, renewal, services-versus-usage mix, and cohort retention metrics.
    whyItMatters: >-
      Public usage proxies and valuation do not establish whether Sarvam's software business is commercially durable or
      capital efficient.
    diligencePath: >-
      Obtain the latest board pack or audited management accounts with segmented revenue, margin, and retention
      disclosures.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: customer-quality
    missingEvidence: >-
      Verified active-customer count, concentration, contract duration, and independent case studies for enterprise
      deployments.
    whyItMatters: >-
      Customer logos and usage stories do not reveal how concentrated revenue is or how repeatable the enterprise motion
      will be.
    diligencePath: >-
      Request a customer schedule with ARR by account, contract term, renewal status, and at least three independently
      referenceable customer calls.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: commercial-sizing-gap
    missingEvidence: >-
      Channel-level revenue, ACV, renewal, and contract-duration data by government, enterprise, developer, and any
      device-related products.
    whyItMatters: >-
      Without contract economics, the public record cannot convert deployment proof into a defendable SAM, SOM, or
      valuation bridge.
    diligencePath: >-
      Request board-grade bookings and revenue segmentation by product line, customer class, and deployment model for
      FY26 and the latest trailing quarter.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
      - TM003
  - type: conflicting-data
    severity: minor
    topic: compute-allocation
    missingEvidence: A reconciled primary disclosure confirming whether Sarvam received 4,086 or 4,096 H100 GPUs.
    whyItMatters: >-
      Compute availability affects supply-side capacity and the credibility of market-share assumptions built on
      sovereign infrastructure.
    diligencePath: >-
      Verify the GPU allocation directly from MeitY, IndiaAI Mission documentation, or Sarvam management materials used
      in the financing process.
    relatedQuestionRefs:
      - QM008
  - type: missing-source
    severity: material
    topic: enterprise-customers
    missingEvidence: Independent procurement or contract-value evidence for named insurers, banks, and state deployments.
    whyItMatters: >-
      Named logos establish category fit, but they do not show budget magnitude, channel concentration, or repeatability
      across the buyer base.
    diligencePath: >-
      Collect customer references, public tenders, contract announcements, or diligence-room extracts showing scope,
      duration, and pricing for representative deployments.
    relatedQuestionRefs:
      - QM004
      - QM006
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: pricing-durability
    missingEvidence: Realized enterprise contract pricing, bundle structure, discounting, and minimum-commit economics by product line.
    whyItMatters: >-
      Public list-price anchors do not show whether Sarvam can defend margin or pricing power once rivals and channel
      partners compete for the same accounts.
    diligencePath: >-
      Request customer contracts, renewal quotes, and marketplace-versus-direct pricing splits for voice, OCR, and agent
      products.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: switching-costs
    missingEvidence: >-
      Customer-level retention, churn, migration effort, and multi-homing behavior across regulated and enterprise
      deployments.
    whyItMatters: >-
      Distribution breadth alone does not prove durable lock-in; underwriting requires evidence on whether buyers can
      swap models or vendors without major workflow disruption.
    diligencePath: >-
      Interview reference customers and review deployment statements of work, renewal cohorts, and implementation
      timelines by channel partner.
    relatedQuestionRefs:
      - QP008
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: financial-disclosure-gap
    missingEvidence: Board-grade revenue breakdown by product, services share, and gross margin.
    whyItMatters: Without realized revenue and margin data, valuation and scalability cannot be tied to software economics.
    diligencePath: >-
      Request management reporting that splits API, enterprise deployment, and public-sector revenue with corresponding
      gross margin.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Customer concentration, contract duration, discounting, CAC, and payback by segment.
    whyItMatters: Institutional deployments can hide services intensity or concentration risk even when usage metrics look strong.
    diligencePath: >-
      Request cohort-level booking, pipeline-conversion, contract-duration, and renewal schedules for enterprise and
      government accounts.
    relatedQuestionRefs:
      - QI004
      - QI008
    relatedTableRefs:
      - TI002
      - TI003
  - type: conflicting-data
    severity: minor
    topic: next-round-funding
    missingEvidence: Confirmed terms for any post-Series-B top-up financing and its use of proceeds.
    whyItMatters: >-
      Reported top-up discussions could materially change runway, dilution, and how much external capital remains
      embedded in the model.
    diligencePath: >-
      Verify cap table, new-money amount, secondaries, and post-close cash position directly from management or signed
      financing documents.
    relatedQuestionRefs:
      - QI006
      - QI007
  - type: missing-source
    severity: material
    topic: trust-and-reliability-gap
    missingEvidence: >-
      Independent uptime history, SLA commitments, incident logs, and architecture-level security documentation for
      production services.
    whyItMatters: >-
      Buyers in BFSI, government, and other regulated environments need evidence that the platform is reliable and
      controlled beyond product-page marketing.
    diligencePath: >-
      Request SOC 2 scope, ISO certificate details, security architecture, incident history, and customer-facing SLA
      terms in diligence.
    relatedQuestionRefs:
      - QE006
      - QE008
  - type: missing-source
    severity: material
    topic: benchmark-methodology
    missingEvidence: >-
      Third-party benchmark methodology and reproducible evaluation detail for latency, OCR accuracy, speech quality,
      and ROI claims.
    whyItMatters: >-
      Product differentiation depends heavily on quality and economics claims that are difficult to underwrite without
      method and comparator transparency.
    diligencePath: >-
      Obtain benchmark decks, test-set definitions, independent eval reports, and customer acceptance criteria for the
      promoted metrics.
    relatedQuestionRefs:
      - QE007
      - QE008
  - type: private-evidence-only
    severity: material
    topic: module-maturity
    missingEvidence: Named production references by module, including deployment dates, workflow scope, and ongoing usage volume.
    whyItMatters: >-
      Public materials show breadth, but product underwriting still needs proof that each surface is durable beyond
      flagship narratives.
    diligencePath: >-
      Ask for a module-level customer reference list separating pilots, production deployments, and public-sector
      rollouts.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: retention-disclosure-gap
    missingEvidence: Board-grade retention, renewal, churn, contract-duration, and cohort data for enterprise and government accounts.
    whyItMatters: Without durability metrics, customer quality cannot be separated from one-time pilot or launch momentum.
    diligencePath: >-
      Request cohort tables, renewal dashboards, and top-20 account histories segmented by government, enterprise, and
      developer-led revenue.
    relatedQuestionRefs:
      - QU005
      - QU007
  - type: private-evidence-only
    severity: material
    topic: named-proof-gap
    missingEvidence: >-
      A named list of enterprise production customers with deployment status, use case, contract owner, and
      referenceability.
    whyItMatters: Public proof is concentrated in state-led initiatives, so enterprise production depth remains largely unverified.
    diligencePath: >-
      Obtain customer-reference calls, signed case studies, or procurement records for at least three non-government
      production accounts.
    relatedQuestionRefs:
      - QU003
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: concentration-risk
    missingEvidence: >-
      Revenue concentration by top customer, top channel partner, and government-linked programs, including exposure to
      HCLTech and IndiaAI-related projects.
    whyItMatters: >-
      The investment case changes materially if a small number of public-sector or partner relationships drive most
      disclosed demand.
    diligencePath: >-
      Request account-level revenue concentration, channel-sourced pipeline splits, and public/private customer mix by
      ARR or bookings.
    relatedQuestionRefs:
      - QU007
  - type: missing-source
    severity: material
    topic: trust-and-compliance
    missingEvidence: >-
      Public or diligence-room evidence of security certifications, DPA terms, incident-response history,
      model-governance controls, and uptime SLAs for regulated deployments.
    whyItMatters: >-
      Sovereign positioning is strongest in regulated workloads, so missing trust artifacts directly limits underwriting
      confidence and procurement-readiness assessment.
    diligencePath: >-
      Request the latest security pack, customer DPAs, incident-response policy, red-team summaries, and any SOC / ISO
      audit outputs.
    relatedQuestionRefs:
      - QR007
    relatedTableRefs:
      - TR001
      - TR002
  - type: private-evidence-only
    severity: material
    topic: customer-and-partner-concentration
    missingEvidence: >-
      Revenue mix, contract duration, SLA commitments, renewal data, and customer concentration for Odisha, Tamil Nadu,
      HCLTech-linked accounts, and other enterprise deployments.
    whyItMatters: >-
      Current public evidence shows reference relationships, but not whether they convert into durable, diversified
      production revenue.
    diligencePath: >-
      Request customer-by-customer pipeline and renewal data, production status, live SLA commitments, and
      state-versus-enterprise revenue contribution.
    relatedQuestionRefs:
      - QR002
      - QR005
    relatedTableRefs:
      - TR003
  - type: missing-source
    severity: material
    topic: capital-structure
    missingEvidence: >-
      Board-grade disclosure of the remaining Series B close, preference stack, investor rights, and any
      compute-financing or cloud-commitment obligations.
    whyItMatters: >-
      A $1.5 billion first-close headline can outrun actual capital availability and downside protection, which affects
      dilution, runway, and strategic flexibility.
    diligencePath: >-
      Review signed financing documents, cap table, side letters, and any infrastructure-financing commitments tied to
      the round.
    relatedQuestionRefs:
      - QR004
    relatedTableRefs:
      - TR003
  - type: private-evidence-only
    severity: material
    topic: cap-table-overhang
    missingEvidence: >-
      Current cap table, liquidation preferences, secondary components, and any investor-rights terms for the 2026
      Series B and any top-up.
    whyItMatters: Preference overhang and structured terms can make the headline valuation a poor proxy for true entry economics.
    diligencePath: >-
      Request the latest cap table, signed financing documents, and board financing deck before underwriting entry
      price.
    relatedQuestionRefs:
      - QV008
  - type: private-evidence-only
    severity: material
    topic: revenue-quality
    missingEvidence: >-
      Audited or board-grade breakdown of recurring revenue, services revenue, gross margin, renewal rates, and customer
      concentration.
    whyItMatters: >-
      Without software-economics proof, investors cannot judge whether deployment traction supports software-style
      valuation durability.
    diligencePath: >-
      Obtain monthly recurring revenue cohorts, gross-margin bridge, and top-customer concentration from management or
      the data room.
    relatedQuestionRefs:
      - QV008
  - type: stale
    severity: minor
    topic: round-completion
    missingEvidence: >-
      Confirmation of whether the remaining Series B capital or reported top-up was actually closed, and at what price
      and terms.
    whyItMatters: >-
      The next financing event will be the clearest external signal on whether valuation momentum is being sustained or
      repriced.
    diligencePath: >-
      Re-check the cap table, transaction documents, and lead-investor announcements before making a final price
      decision.
    relatedQuestionRefs:
      - QV006
