company:
  name: "Sarvam AI"
chapter:
  number: 1
  title: "Company Overview"
  summary: >-
    Sarvam AI is a Bengaluru-based sovereign AI startup founded in August 2023 by
    Vivek Raghavan and Pratyush Kumar, and by June 2026 it had announced a $234
    million first close of a $300 million Series B at a $1.5 billion post-money
    valuation. The retained evidence shows unusually strong state and strategic
    backing through IndiaAI and HCLTech, but still leaves material gaps around
    board composition, software economics, and customer concentration.
sections:
  - id: "identity-stage"
    title: "Identity, product scope, and current stage"
    body: >-
      Sarvam AI presents itself as an Indian full-stack sovereign AI company
      building models, infrastructure, and deployed applications inside India,
      with a commercial scope that spans enterprise software, developers, and
      public-sector workflows. Independent profiles align on the core identity:
      the company is headquartered in Bengaluru, was founded in August 2023, and
      is now operating from a post-Series B stage rather than as a pre-seed
      research lab. What is still less transparent is the commercial conversion
      of that platform breadth into recurring software economics, because public
      materials emphasize strategic positioning and product breadth more than
      audited revenue, customer-count, or margin disclosure.
    claimRefs: [CO001, CO002, CO003, CO010, CO013, CO016]
    tableRefs: [TO001]
  - id: "leadership-governance"
    title: "Founders, governance shape, and key-person dependence"
    body: >-
      The company identity is tightly bound to its two founders. Retained
      independent profiles trace both founders back to AI4Bharat and IIT Madras,
      with Vivek Raghavan additionally associated with Aadhaar biometrics work
      and Pratyush Kumar with IBM and Microsoft research experience. That
      founder-market fit helps explain both the speed of early capital formation
      and Sarvam's credibility with public-sector stakeholders. It also creates
      visible key-person dependence: the assigned evidence identifies the
      founders, IndiaAI support, and strategic investors, but does not surface a
      current board roster, formal governance allocations, or clearly documented
      leadership-bench depth beyond the founders.
    claimRefs: [CO003, CO005, CO006, CO011, CO015]
    tableRefs: [TO002]
  - id: "capitalization-scale"
    title: "Funding history, stakeholder leverage, and disclosed scale"
    body: >-
      Sarvam's funding path is compressed and unusually strategic. Within roughly
      five months of founding it had raised a $41 million Series A, and by June
      2026 it announced a $234 million first close of a $300 million Series B at
      a $1.5 billion post-money valuation. HCLTech's $150 million strategic lead
      gives the round distribution implications beyond capital alone, while
      Bessemer, Khosla, and Peak XV preserve venture continuity. Public company
      materials also point to meaningful usage proxies—daily interactions, API
      calls, digitized pages, and audio volume—but those are operating metrics,
      not substitutes for disclosed revenue quality, contract durability, or
      customer concentration.
    claimRefs: [CO004, CO010, CO011, CO012, CO013, CO016]
    tableRefs: [TO003]
  - id: "milestones-and-open-asks"
    title: "Milestones, public-sector momentum, and unresolved diligence asks"
    body: >-
      The milestone pattern matters because Sarvam's current narrative depends on
      more than one funding event. The April 2025 IndiaAI selection, the
      February 2026 model launches, the Odisha and Tamil Nadu partnership push,
      and the June 2026 Series B together show a company moving from research
      credibility into nationally framed infrastructure and deployment claims.
      At the same time, the strongest independent caution comes from execution
      risk rather than technical irrelevance: product depth is still emerging,
      frontier competition remains stronger on general-purpose performance, and
      the ecosystem around Sarvam is still early. The main diligence asks are
      still governance detail, verified software economics, and independent proof
      of customer quality beyond usage proxies and company-issued logos.
    claimRefs: [CO005, CO007, CO008, CO009, CO012, CO015]
    figureRefs: [FO001]
