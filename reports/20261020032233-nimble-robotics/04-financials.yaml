    title: Revenue model bridge from merchant demand to undisclosed contract revenue
    type: flow
    summary: >-
      The operating workflow is visible, but public evidence does not disclose the
      billing unit or the conversion from handled activity to recognized revenue.
    data:
      nodes:
        - id: merchant
          label: E-commerce merchant
          detail: Brand outsources fulfillment activity to Nimble.
        - id: inventory
          label: Inventory in fulfillment network
          detail: Nimble operates the automated warehouse environment.
        - id: pick
          label: Robotic picking
          detail: AI robotics perform the core picking function.
        - id: pack
          label: Packing and handling
          detail: Public pages describe picking, packing, and handling millions of items.
        - id: ship
          label: Order shipment
          detail: The 3PL service ships e-commerce orders for brands.
        - id: revenue
          label: Contract revenue
          detail: Billing unit, realized price, discounts, and gross profit are not publicly disclosed.
    approximationNotes: >-
      Ordered operating sequence only; it does not imply a conversion rate, price,
      volume, or margin at any stage.
    claimRefs: [CI001, CI002]
