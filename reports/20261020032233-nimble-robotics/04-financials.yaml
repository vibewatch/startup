schemaVersion: "report-v2"
artifact: financials
slug: nimble-robotics
runDate: 2026-10-20
company:
  name: Nimble Robotics
chapter:
  number: 4
  title: Financials
  summary: >-
    Nimble's public evidence supports an operated robotic-3PL model with meaningful
    activity and strategic distribution through FedEx, but it does not expose
    realized pricing, audited revenue, gross margin, cash, burn, or runway. The
    financial case therefore rests on unverified operating leverage and requires
    private-data diligence before it can be underwritten.
sections:
  - id: revenue-model
    title: Revenue model and monetization
    body: >-
      Nimble is best understood as an operator of robotic third-party fulfillment,
      not as a disclosed-price robotics vendor. TechCrunch reported that the company
      shifted from retrofitting customer warehouses toward outsourcing fulfillment
      through Nimble-operated automated facilities. Nimble's own site says its
      technology has picked, packed, and handled millions of items and describes its
      economics only as low cost per unit. That language indicates an activity-linked
      service proposition, but it does not establish whether contracts charge per
      order, item, shipment, storage position, reserved capacity, or a bundled minimum.
      A separate company white-paper page claims 40% lower fulfillment costs; this is
      a customer-savings assertion, not a price card, realized revenue, or gross-margin
      disclosure. Revenue quality cannot be judged until contracts, billing units,
      minimums, surcharges, and revenue recognition are reviewed.
    claimRefs: [CI001, CI002, CI003, CI004]
    tableRefs: [TI001, TI002]
    figureRefs: [FI001]
  - id: traction-and-distribution
    title: Public traction and commercial distribution
    body: >-
      Public traction is visible but not financially reconciled. Nimble says it has
      handled millions of items, while CompWorth labels $87.2 million as a current
      yearly revenue estimate; the latter is not company-reported accounting revenue
      and provides no basis for treating it as ARR. Supply Chain Dive reported in
      September 2024 that FedEx could use Nimble facilities to expand FedEx Fulfillment
      and that six Nimble centers were open or planned for launch by the following year.
      The same report said FedEx's investment amount was undisclosed. PhysicalState,
      meanwhile, lists one verified deployment and explicitly defines that count as
      registry-confirmed sites rather than the manufacturer's total footprint. These
      metrics use different denominators and dates, so none establishes current
      utilization, customer concentration, renewal quality, or revenue scale.
    claimRefs: [CI002, CI005, CI006, CI007, CI011, CI012]
  - id: cost-structure
    title: Cost structure and unit-economics path
    body: >-
      The plausible margin thesis is labor and space substitution, but the available
      evidence is claim-heavy and incomplete. In a 2024 interview, a Nimble executive
      said its warehouse eliminated the picker role, which normally represented one
      third to two thirds of building headcount. TechCrunch had reported in 2023 that
      manual operations still remained and that the company had not yet reached a
      fully lights-out warehouse. A competing fulfillment provider also highlights
      substantial upfront robotics, maintenance, and facility-adaptation costs; that
      source is adverse competitor commentary rather than an independent benchmark.
      Together, the evidence identifies the economic variables but does not quantify
      robot depreciation, maintenance, energy, exception labor, occupancy, freight,
      implementation, working capital, utilization, or site-level contribution margin.
    claimRefs: [CI008, CI009, CI010, CI016]
    tableRefs: [TI003]
  - id: capital-adequacy
    title: Capital adequacy and underwriting verdict
    body: >-
      Public financing totals cannot be converted into current liquidity. FundedIQ
      records $156 million across two rounds, whereas PhysicalState reports about
      $221 million of disclosed funding. The difference appears to reflect tracker
      coverage, and neither figure measures cash remaining after facilities, robots,
      payroll, inventory handling, or network expansion. No retained source discloses
      cash on hand, monthly burn, debt or project-finance obligations, runway, a
      next-round trigger, gross margin, CAC, payback, realized pricing, or utilization.
      The financial verdict is therefore conditional: an operated robotic network
      could capture labor and density leverage, but it also places capital and
      utilization risk on Nimble's balance sheet. Underwriting should remain blocked
      on a facility-level cohort, contracted-versus-used capacity, customer gross
      margin, consolidated cash bridge, and financing schedule.
    claimRefs: [CI013, CI014, CI015, CI016]
callouts:
  - calloutType: risk
    title: Funding raised is not cash available
    body: >-
      Public trackers disagree on cumulative disclosed funding, and neither provides
      current cash, burn, debt, or runway. Capital adequacy requires a management cash
      bridge rather than inference from historical financing totals.
    claimRefs: [CI013, CI014, CI015, CI016]
tables:
  - id: TI001
    title: Revenue streams and commercial mechanisms
    columns:
      - Stream
      - Mechanism
      - Unit
      - Public status
      - Revenue quality
      - Diligence ask
    rows:
      - [Robotic 3PL fulfillment, "Nimble operates fulfillment centers that pick, pack, and ship for brands", Not disclosed, Active company offering, "Recurring potential but contract structure is unavailable", "Provide MSA, rate card, minimums, surcharges, and revenue-recognition policy"]
      - [FedEx-enabled fulfillment, "FedEx may use Nimble centers to serve e-commerce merchants", Not disclosed, "Alliance reported in September 2024", "Potential distribution leverage; investment and economics undisclosed", "Provide contracted volume, take rate, exclusivity, term, and margin split"]
      - [Warehouse automation retrofit, "Robotics installed into customer warehouse workflows", Not disclosed, "TechCrunch reported this model was being de-emphasized in 2023", "Legacy or residual contribution cannot be quantified", "Separate product or installation revenue from operated-3PL revenue"]
      - [Future autonomous supply-chain modules, "Sortation and broader autonomy described as in development", Not disclosed, Development-stage commentary, "Not established as current revenue", "Provide roadmap, signed pilots, pricing, capex owner, and launch criteria"]
    notes: >-
      Public-source synthesis as of 2026-10-20; no retained source provides realized
      contract pricing, revenue mix, or revenue-recognition terms.
    claimRefs: [CI001, CI005, CI007, CI009]
  - id: TI002
    title: Pricing and monetization evidence
    columns:
      - Evidence item
      - Published value
      - What it measures
      - What it does not establish
    rows:
      - [Official pricing, Not published, "No rate card in the retained official pages", "Realized price, minimum commitment, discount, surcharge, or contract duration"]
      - [Official unit-cost language, "Industry low costs per unit", "Company positioning", "The billed unit, price level, or gross profit per unit"]
      - [Official savings claim, "40% lower costs", "Company-claimed customer fulfillment-cost reduction", "List price, audited savings, revenue, or margin"]
      - [Third-party revenue estimate, "$87.2M current yearly revenue estimate", "CompWorth model output with an unspecified period", "Reported revenue, ARR, cash collection, or segment mix"]
    notes: >-
      Values preserve the publishers' labels; the $87.2M figure is an estimate, and
      the 40% figure is a company cost-savings claim rather than pricing or revenue.
    claimRefs: [CI003, CI004, CI011, CI016]
  - id: TI003
    title: Unit economics and capital adequacy
    columns:
      - Metric
      - Public value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - [Gross margin, Not disclosed, Low, "Tests whether automation savings survive facility and service-delivery costs", "Monthly gross margin by facility and customer cohort"]
      - [Utilization and throughput economics, Not disclosed, Low, "Fixed robots and facilities require sustained volume absorption", "Orders, items, picks, uptime, capacity, and contribution margin by site"]
      - [CAC and payback, Not disclosed, Low, "Long enterprise sales and integrations may delay cash recovery", "Fully loaded CAC, implementation cost, sales cycle, and payback by segment"]
      - [Cash burn and runway, Not disclosed, Low, "Network expansion can consume capital before sites mature", "Cash balance, monthly burn, debt schedule, committed capex, and downside runway"]
    notes: >-
      Every null is a public-evidence gap rather than a zero; historical funding raised
      is excluded because it is not a measure of current cash available.
    claimRefs: [CI008, CI009, CI010, CI015, CI016]
figures:
