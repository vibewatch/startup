  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "switching-cost"
      missingEvidence: >-
        Customer contracts, implementation plans, migration timelines, data-portability terms,
        multi-homing behavior, renewal rates, and exit-assistance obligations.
      whyItMatters: >-
        These inputs determine whether the operated-network model creates durable lock-in or merely
        adds migration friction that causes buyers to prefer modular automation.
      diligencePath: >-
        Review three current customer contracts and interview two migrated or churned customers,
        tracing integration effort, parallel-provider use, renewal terms, and exit costs.
      relatedQuestionRefs: [QP007]
      relatedTableRefs: [TP002]
    - type: "missing-source"
      severity: "material"
      topic: "pricing-gap"
      missingEvidence: >-
        Realized per-order rates, storage and exception charges, minimum volume commitments,
        implementation fees, discount schedules, contract terms, and normalized competitor bids.
      whyItMatters: >-
        Without a common scope and denominator, the company-reported savings claim cannot establish
        pricing advantage or customer return on investment.
      diligencePath: >-
        Obtain redacted Nimble invoices and two competing proposals for the same order profile, then
        normalize total cost by shipped order, item, storage day, exception, and service level.
      relatedQuestionRefs: [QP009]
      relatedTableRefs: [TP003]
    - type: "missing-source"
      severity: "material"
      topic: "benchmark-gap"
      missingEvidence: >-
        Independent tests of throughput, pick success, damage rate, uptime, intervention rate, and
        total labor across a representative shared SKU and order set.
      whyItMatters: >-
        Business-model breadth does not establish technical superiority or durable unit-cost advantage
        against modular vendors, internal automation, or incumbent 3PL operations.
      diligencePath: >-
        Commission a blinded benchmark across representative soft, rigid, fragile, and irregular items
        and reconcile results with production logs from at least two operating sites.
      relatedQuestionRefs: [QP006, QP010]
      relatedTableRefs: [TP001, TP002]
