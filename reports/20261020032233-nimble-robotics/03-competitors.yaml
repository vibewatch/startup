figures:
  - id: "FP001"
    title: "Competitive positioning by solution breadth and buyer control"
    type: "quadrant"
    summary: >-
      Ordinal map separates an operated fulfillment service from modular vendors, internal build, and
      the status quo; it is a structural lens rather than a performance ranking.
    data:
      xAxis:
        label: "Solution breadth: point tool (1) to operated fulfillment network (5)"
        min: 1
        max: 5
      yAxis:
        label: "Buyer operating control: outsourced (1) to internally controlled (5)"
        min: 1
        max: 5
      points:
        - label: "Nimble"
          x: 5
          y: 2
          note: "Operated robotic-3PL model shifts execution to Nimble."
        - label: "GreyOrange"
          x: 3
          y: 4
          note: "Automation vendor used within operator facilities."
        - label: "Symbotic"
          x: 4
          y: 4
          note: "Integrated automation with reported large-retail deployments."
        - label: "RightHand Robotics"
          x: 2
          y: 4
          note: "Piece-picking specialist integrated into broader systems."
        - label: "Amazon / internal build"
          x: 5
          y: 5
          note: "Broad internally owned automation and operations."
        - label: "Legacy 3PL / manual"
          x: 3
          y: 1
          note: "Outsourced or labor-led status quo with limited buyer control."
    approximationNotes: >-
      Values are ordinal analyst assessments derived from described business models, not measured
      performance, market share, or benchmark scores; one-point differences are not significant.
    claimRefs: [CP001, CP004, CP005, CP006, CP007, CP008, CP009, CP014, CP015]
callouts:
  - calloutType: "strength"
    title: "Differentiation is the operating model"
    body: >-
      Nimble's strongest distinction is combining robotics with fulfillment execution; public evidence
      does not yet prove that this model outperforms modular automation on normalized economics.
    claimRefs: [CP001, CP011, CP015]
  - calloutType: "risk"
    title: "Comparison remains under-benchmarked"
    body: >-
      Without common-order-set testing, current site metrics, and realized contract pricing, apparent
      capability breadth cannot be converted into a defensible performance or value ranking.
    claimRefs: [CP011, CP016]
