company:
  name: Nimble Robotics
chapter:
  number: 8
  title: Valuation
  summary: >-
    Public evidence supports strategic interest and a meaningful capital base, but it does not
    support a defensible revenue multiple, target return, or exit value. Reported valuation
    anchors conflict at $1.0 billion and $1.1 billion, so the recommendation is research-more
    with high risk and an unknown valuation stance until financing terms and unit economics are verified.
sections:
  - id: recommendation-and-price-discipline
    title: Recommendation and price discipline
    body: >-
      The recommendation is research-more, with medium confidence, high risk, and an unknown
      valuation stance. Nimble has credible strategic signals: FedEx invested, entered an
      alliance that can use Nimble fulfillment centers, and independent reporting described six
      centers open or planned in 2024. The company also says its systems have handled millions of
      items. Those signals establish relevance, not investability at a particular price. The
      retained public record provides no revenue, gross margin, burn, cash balance, preference
      stack, fully diluted ownership, or verified site-level return data. Entry discipline should
      therefore require a reconciled current financing anchor and a data-room model before any
      price endorsement. A $1.0 billion or $1.1 billion headline should be treated as an
      unverified reference point, not as fair value or proof of current enterprise value.
    claimRefs: [CV003, CV005, CV008, CV014, CV015, CV016]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: financing-context-and-evidence-quality
    title: Financing context and evidence quality
    body: >-
      Clay reports a $106 million Series C in October 2024 at a $1.0 billion valuation and total
      funding of $221 million. A lower-reputation industry blog instead dates a $106 million
      Series C to December 2025 and states a $1.1 billion valuation. The records may reflect a
      later mark, a repeated announcement, or a reporting error; the retained sources do not
      resolve which interpretation is correct. Earlier independent reporting provides a cleaner
      historical checkpoint: TechCrunch reported a $65 million Series B in March 2023 and total
      funding of about $110 million. FedEx's separate strategic investment amount was not
      disclosed. The capital history demonstrates access to financing, but funding raised is not
      cash available, and none of these sources discloses liquidation preferences, debt, dilution,
      secondary pricing, or the post-money capitalization needed to model investor ownership.
    claimRefs: [CV001, CV002, CV003, CV004, CV005, CV006]
    tableRefs: [TV002]
  - id: scenarios-without-false-precision
    title: Bull, base, and bear cases without false precision
    body: >-
      The bull case requires independent confirmation that customer demand, utilization, uptime,
      and contribution margin scale faster than network capital needs. Company materials claim
      millions of handled items and up to 40% lower costs, while TechCrunch reported company
      claims of up to 75% less warehouse space, more than 96% population coverage within one to
      two days, and up to 40% savings. These are useful diligence hypotheses, not audited valuation
      inputs. The base case is to defer a price view while verifying economics. The bear case is
      that greenfield infrastructure, maintenance, and operational concentration absorb the
      advertised savings; a competitor-authored review explicitly flags substantial initial and
      infrastructure costs. No numeric bull, base, or bear valuation range is defensible from the
      assigned evidence, and no probability percentages are assigned.
    claimRefs: [CV008, CV009, CV010, CV011, CV013, CV015]
    tableRefs: [TV003]
  - id: exit-readiness-and-thesis-breaks
    title: Exit readiness, diligence asks, and thesis-break triggers
    body: >-
      Nimble remains privately held, and the retained evidence contains no secondary-market mark,
      acquisition precedent, public-company multiple set, expected exit date, or disclosed IPO
      preparation. Exit readiness is therefore unproven. Before investment, obtain the current
      capitalization table, financing documents, preference waterfall, debt schedule, monthly
      revenue and gross margin by facility, customer concentration and renewals, facility
      utilization, uptime, intervention rates, and cohort-level payback. The view would improve if
      audited unit economics reconcile the claimed savings and demonstrate repeatable utilization
      across multiple facilities. Thesis-break triggers are a down round on unchanged milestones,
      persistent negative contribution margin at mature sites, material FedEx deployment
      retrenchment, or inability to reconcile the 2024 and 2025 valuation accounts. Without those
      disclosures, neither a target return nor a hold or exit period is supportable.
    claimRefs: [CV003, CV005, CV007, CV011, CV012, CV013, CV015, CV016]
