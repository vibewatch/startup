      - Evidence type
      - Current read
      - What would change the view
    rows:
      - ["Strategic channel validation", "Independent reporting on FedEx alliance and investment", "Supports commercial relevance", "Disclosed deployment scope, economics, and renewal commitments"]
      - ["Operational scale signal", "Company claim of millions of handled items", "Promising but unaudited", "Facility-level item volume, uptime, and error-rate cohorts"]
      - ["Network growth", "Independent report of six centers open or planned in 2024", "Expansion intent is visible", "Current active-site count and mature-site utilization"]
      - ["Capital access", "$221M total funding reported by Clay", "Financing capacity is meaningful", "Cash balance, burn, debt, and remaining runway"]
      - ["Infrastructure burden", "Competitor-authored review flags substantial initial and infrastructure costs", "Downside remains plausible", "Audited site payback and positive contribution margin"]
    notes: "The table separates issuer relationship from hosting domain; company claims and competitor comparisons are not treated as independent benchmarks."
    claimRefs: [CV004, CV005, CV008, CV011, CV014]
  - id: TV003
    title: Bull, base, and bear scenarios
    columns:
      - Case
      - Required assumptions
      - Valuation and return logic
      - Probability signal
      - Downside trigger
    rows:
      - [Bull, "Verified repeatable savings, strong utilization, durable renewals, and scalable facility margins", "A premium to the cited financing anchor could be considered only after a supported operating model; no range is assigned", "FedEx alliance and claimed item scale are positive but incomplete signals", "Independent verification fails to reproduce savings or utilization"]
      - [Base, "Strategic demand continues but economics and capitalization remain undisclosed", "Defer price endorsement and target-return modeling", "Best fit with the current mixed evidence", "Financing terms worsen before operating proof improves"]
      - [Bear, "Infrastructure and maintenance absorb savings while deployments remain concentrated", "Down-round and multiple-compression exposure cannot be quantified from public data", "Competitor critique and limited verified deployment footprint support the downside", "Persistent negative mature-site contribution margin or partner retrenchment"]
    notes: "Cases are qualitative because the assigned sources do not disclose revenue, margins, cash burn, cap-table terms, or comparable transaction multiples; probability percentages would be false precision."
    claimRefs: [CV005, CV008, CV009, CV010, CV011, CV013, CV015]
figures:
  - id: FV001
    title: Recommendation logic
    type: flow
    summary: "The evidence chain ends in a research-more decision because strategic proof is not yet linked to verified economics or a reconciled price."
    data:
      nodes:
        - id: reported-price
          label: "Reported $1.0B / $1.1B valuation anchors"
        - id: capital
          label: "$221M total funding reported"
        - id: strategic-proof
          label: "FedEx investment and fulfillment alliance"
        - id: operating-proof
          label: "Millions of items claimed; deployment evidence remains limited"
        - id: missing-model
          label: "Revenue, margin, burn, cap table, and preferences undisclosed"
        - id: decision
          label: "Research more; high risk; valuation stance unknown"
      edges:
        - from: reported-price
          to: missing-model
        - from: capital
          to: strategic-proof
        - from: strategic-proof
          to: operating-proof
        - from: operating-proof
          to: missing-model
        - from: missing-model
          to: decision
    approximationNotes: "This is a qualitative decision chain; node order does not encode probability, magnitude, or conversion."
    claimRefs: [CV003, CV004, CV005, CV008, CV013, CV015, CV016]
callouts:
  - calloutType: recommendation
    title: Decision
    body: >-
      Research more rather than buy or avoid: require verified unit economics, current financing
      terms, and ownership outcomes before converting strategic promise into a price.
    claimRefs: [CV003, CV015, CV016]
  - calloutType: risk
    title: Headline valuation is not fair value
    body: >-
      The retained sources disagree on both the timing and amount of the latest valuation, and
      neither discloses the capitalization or operating model needed to price an entry.
    claimRefs: [CV001, CV002, CV003, CV015]
