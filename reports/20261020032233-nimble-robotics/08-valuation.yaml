      - [Valuation stance, "Conflicting $1.0B and $1.1B reported anchors", Unknown, "Do not convert headlines into fair value", "Reconciled post-money valuation and fully diluted capitalization"]
      - [Exit readiness, "Private company with no retained exit or secondary evidence", Unproven, "No target return or exit date is supportable", "Comparable transactions, secondary marks, and a credible exit plan"]
    notes: "Judgments are analytical conclusions from the retained public evidence; no revenue multiple, target return, or implied valuation is estimated."
    claimRefs: [CV003, CV005, CV013, CV015, CV016]
  - id: TV002
    title: Thesis and anti-thesis
    columns:
