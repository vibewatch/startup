        - "United States / Mexico operations; certifications and breach history not established"
        - Medium
        - High
        - "Unverified; competitor commentary identifies malfunction and cyber disruption risk"
        - "High; review SOC reports, penetration tests, recovery objectives, data flows, and contractual cyber liability"
      - - Patent position, freedom to operate, and litigation
        - "United States; registry reports five granted patents, but no primary patent or court evidence was allocated"
        - Low / unknown
        - Medium
        - "Early public signal only"
        - "Medium; commission USPTO chain-of-title, claims mapping, freedom-to-operate, and litigation searches"
    notes: >-
      Partial public-evidence register ordered by severity; likelihood and residual exposure are analyst assessments,
      and no absence-of-incident or absence-of-litigation conclusion is inferred from the source pool.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly visible legal, safety, and security categories supported or left unresolved by the assigned fetched
        evidence as of the run date.
    claimRefs: [CR007, CR008, CR009, CR016]
  - id: TR002
    title: Operational, quality, and security risk register
    columns:
      - Failure mode
      - Likelihood
      - Severity
      - Public mitigation evidence
      - Mitigation maturity
      - Residual exposure / trigger
    rows:
      - - Facility rollout or multi-site operating execution falls behind plan
        - Medium-high
        - High
        - "Six facilities were reported open or planned by 2025; actual current completion and utilization are not established"
        - Developing
        - "High; trigger on repeated launch delays, low utilization, or persistent facility-level losses"
      - - Picking accuracy or item-handling performance misses customer SLAs
        - Medium
        - High
        - "Company claimed 99.9% production accuracy and broad item coverage in 2021"
        - Demonstrated only by historical company claims
        - "High; require current error taxonomy, intervention rate, uptime, and peak-period SLA attainment"
      - - Integration fails across WMS, WCS, carriers, or customer workflows
        - Medium
        - High
        - "Company claimed one-day, zero-code integration in 2021"
        - Demonstrated only by historical company claims
        - "Medium-high; trigger on implementation overruns, custom-code dependence, or failed production cutovers"
      - - Cyberattack, software outage, or equipment malfunction interrupts fulfillment
        - Medium
        - High
        - "No public control or recovery evidence in the pool; competitor review identifies the exposure"
        - Unverified
        - "High; require tested recovery objectives, redundancy design, incident history, and customer remedies"
    notes: >-
      Severity, likelihood, and mitigation maturity are analyst classifications; public company metrics are preserved
      as claims rather than treated as audited performance.
    claimRefs: [CR001, CR002, CR003, CR004, CR007, CR008, CR010, CR013]
  - id: TR003
    title: Partner and dependency risk register
    columns:
      - Dependency
      - Counterparty / role
      - Concentration evidence
      - Failure scenario
      - Severity
      - Mitigation and residual exposure
    rows:
      - - Strategic distribution and fulfillment demand
        - "FedEx; investor, alliance partner, and user of Nimble centers"
        - "Commercial share and investment amount are undisclosed"
        - "FedEx delays expansion, renegotiates economics, or terminates access"
        - High
        - "Alliance validates demand, but residual exposure is high until contracts, minimums, and concentration are reviewed"
      - - Facility financing and fixed-cost absorption
        - "Equity and strategic capital providers; Nimble-operated fulfillment network"
        - "Burn, cash, committed capex, and site utilization are undisclosed"
        - "Launch obligations consume cash before centers reach efficient volume"
        - High
        - "Stage-gated rollout may limit exposure; require site cohorts, capex schedules, and downside liquidity plan"
      - - Warehouse and software integration ecosystem
        - "WMS/WCS environments and systems integrators"
        - "2021 release named multiple integrators but did not disclose dependency shares"
        - "A key integration, component, or implementation partner becomes a bottleneck"
        - Medium-high
        - "Claimed no-code integration mitigates risk, but current implementation evidence is missing"
      - - Customer renewal and demand concentration
        - "Named retail and e-commerce customers"
        - "Only stale company claims of 100% retention and repeat use are public in this pool"
        - "A large deployment fails to renew or order volumes underfill a facility"
        - High
        - "Named deployments show use; residual exposure remains high pending top-customer share, cohorts, and renewal data"
    notes: >-
      The register distinguishes funding raised from cash available and does not infer customer or partner
      concentration percentages where contract-level denominators are absent.
    claimRefs: [CR003, CR005, CR006, CR011, CR012, CR013, CR014]
figures:
