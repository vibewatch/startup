    title: Residual risk heatmap
    type: matrix
    summary: >-
      Categorical assessment of likelihood, impact, mitigation maturity, and residual severity based on the retained
      public evidence; labels are analytical judgments, not company-disclosed probabilities.
    data:
      columns:
        - Likelihood
        - Impact
        - Mitigation maturity
        - Residual severity
      rows:
        - label: Fulfillment-network execution
          values: [Medium-high, High, Developing, High]
        - label: Reliability and SLA performance
          values: [Medium, High, Historical company proof, High]
        - label: Cybersecurity and system continuity
          values: [Medium, High, Unverified, High]
        - label: FedEx and commercial concentration
          values: [Medium, High, Developing, High]
        - label: Workplace safety and labor transition
          values: [Medium, Medium-high, Unverified, Medium-high]
        - label: Patent and litigation exposure
          values: [Low / unknown, Medium, Early public signal, Medium]
    approximationNotes: >-
      Categorical placements synthesize cited public evidence and gaps; they are not statistically estimated
      probabilities and should be replaced with diligence data where available.
    claimRefs: [CR006, CR008, CR009, CR010, CR012, CR013, CR015, CR016]
