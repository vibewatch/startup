callouts:
  - calloutType: strength
    title: An integrated service, not a point robot
    body: >-
      Nimble combines robotic picking with facility operations and a multi-client fulfillment model, shifting integration and operating responsibility away from the brand.
    claimRefs: [CE002, CE004]
  - calloutType: risk
    title: Automation maturity is not lights-out maturity
    body: >-
      Management confirmed that manual operations remained in 2023, and the assigned evidence does not disclose current intervention rates, uptime, or recovery performance.
    claimRefs: [CE003, CE016]
