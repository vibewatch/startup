      - ["Cloud logistics orchestration", "Coordinate inventory and fulfillment work", "Software must connect customer demand to facility execution", "No public architecture, availability history, access-control model, or recovery objective"]
      - ["Robotic manipulation", "Pick and handle individual items", "Six-axis robots, sensing, force control, grippers, and mobile platforms", "SKU edge cases, perception errors, gripper wear, and intervention demand"]
      - ["Facility execution", "Store, retrieve, pack, sort, and ship goods", "Robot-oriented building layout plus residual manual operations", "Site outages, maintenance staffing, worker safety, and exception queues"]
      - ["Network and carrier handoff", "Place inventory near demand and transfer parcels to carriers", "Warehouse location, sortation capability, and carrier performance", "Node concentration, carrier dependency, peak capacity, and unverified roadmap timing"]
    notes: "This is an evidence-bounded operating model assembled from disclosed components; undocumented interfaces and control mechanisms are identified as gaps, not inferred."
    claimRefs: [CE005, CE006, CE007, CE011, CE012, CE016]
