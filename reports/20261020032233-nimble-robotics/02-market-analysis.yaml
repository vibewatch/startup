      - ["Monetary TAM / SAM / SOM", null, "Current evidence pool", "Evidence gap", "Low", "Pricing, shipment volume, capacity, and utilization are unavailable"]
    notes: "Values are separate sizing lenses with different denominators and vintages; they must not be added, converted into a funnel, or treated as a monetary market estimate."
    claimRefs: [CM005, CM006, CM007, CM008, CM014, CM015]
  - id: "TM003"
    title: "Segment and buyer map"
    columns: ["Segment", "Economic buyer", "Primary user", "Payer", "Workflow and adoption trigger", "Principal constraint"]
    rows:
      - ["Midmarket e-commerce brands", "Head of operations or supply chain", "Merchant operations team", "Fulfillment or logistics budget", "Outsource pick-pack operations to avoid automation capital", "Migration, integration, and provider dependence"]
      - ["Large omnichannel brands", "Supply-chain executive", "Network and fulfillment teams", "Enterprise logistics budget", "Add scalable capacity and later shipping cutoffs", "Reliability, governance, and concentration risk"]
      - ["Merchants with seasonal peaks", "E-commerce or operations leader", "Planning and fulfillment teams", "Variable fulfillment budget", "Absorb demand spikes without temporary picker hiring", "Need evidence of peak throughput and recovery"]
      - ["Customer-operated warehouses", "Warehouse engineering leader", "Site operations and maintenance teams", "Capital and maintenance budgets", "Layer task automation onto retained facilities", "Outside Nimble's clearest outsourced-network fit"]
    notes: "Buyer roles and triggers are inferred from the cited outsourced-fulfillment model and industry accounts; allocated sources do not disclose Nimble's actual procurement personas or contract approval process."
    claimRefs: [CM004, CM009, CM010, CM011, CM012, CM013]
