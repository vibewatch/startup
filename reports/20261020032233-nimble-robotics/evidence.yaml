evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: identity
    missingEvidence: >-
      Authoritative formation date and current principal-office documentation resolving the 2017 versus 2019 and San
      Francisco versus San Jose conflicts.
    whyItMatters: >-
      Basic corporate identity must be stable before relying on the chapter as ground truth for legal, governance, or
      operating diligence.
    diligencePath: >-
      Obtain the certificate of incorporation, current statement of information, and management-confirmed corporate
      chronology.
    relatedQuestionRefs:
      - QO001
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: scale
    missingEvidence: >-
      Current revenue, revenue run-rate, customer count and concentration, live-site utilization, headcount, gross
      margin, burn rate, and cash runway.
    whyItMatters: >-
      Funding raised and marketing activity measures do not establish commercial scale, capital efficiency, or
      liquidity.
    diligencePath: >-
      Request audited financials, monthly management accounts, bank balances, payroll records, site-level operating
      dashboards, and customer-level cohort data.
    relatedQuestionRefs:
      - QO006
      - QO010
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      Fully diluted capitalization, voting control, liquidation preferences, investor consent rights, board committees,
      and succession plans.
    whyItMatters: >-
      Named directors and investors do not reveal practical control, downside allocation, or resilience to founder
      departure.
    diligencePath: >-
      Review the charter, bylaws, voting agreements, investor-rights agreements, board minutes, committee charters, and
      founder succession plan.
    relatedQuestionRefs:
      - QO003
      - QO010
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: adverse-history
    missingEvidence: >-
      A comprehensive legal, regulatory, safety-incident, outage, recall, and leadership-change history from
      authoritative records.
    whyItMatters: >-
      The absence of a complete public record in the assigned evidence cannot establish that no material adverse event
      occurred.
    diligencePath: >-
      Run jurisdiction-specific court, regulator, OSHA, recall, insurance-claim, and executive-employment checks using
      the verified legal entity.
    relatedQuestionRefs:
      - QO008
  - type: private-evidence-only
    severity: material
    topic: market-sizing-gap
    missingEvidence: >-
      Current pricing, contracted shipment volume, live capacity, utilization, merchant spend, and renewal data needed
      for a bottom-up monetary TAM, SAM, and SOM.
    whyItMatters: >-
      Without common units and denominators, broad warehouse-automation forecasts cannot be converted into Nimble's
      serviceable or obtainable market.
    diligencePath: >-
      Request site-level capacity and utilization, active contract values, shipment volumes, pricing schedules, and
      merchant cohort data, then build a bottom-up model by eligible geography and SKU profile.
    relatedQuestionRefs:
      - QM004
    relatedTableRefs:
      - TM002
  - type: conflicting-data
    severity: material
    topic: operating-footprint
    missingEvidence: A reconciled list of live sites, robot counts, customer deployments, opening dates, capacity, and service areas.
    whyItMatters: >-
      Three named company-operated locations, one independently tracked deployment, and a broad two-day reach claim use
      different definitions and cannot establish current operating scale.
    diligencePath: >-
      Obtain a management-certified site and deployment schedule and verify a sample through customer references,
      facility records, and carrier service maps.
    relatedQuestionRefs:
      - QM005
      - QM010
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Audited or customer-verified baselines for the 40% cost reduction claim and the claimed labor displacement.
    whyItMatters: Unverified savings and labor claims are central to buyer ROI, adoption speed, gross margin, and valuation.
    diligencePath: >-
      Request cohort-level before-and-after cost, throughput, accuracy, uptime, exception-rate, and labor data with
      contract scope and measurement periods.
    relatedQuestionRefs:
      - QM010
  - type: private-evidence-only
    severity: material
    topic: switching-cost
    missingEvidence: >-
      Customer contracts, implementation plans, migration timelines, data-portability terms, multi-homing behavior,
      renewal rates, and exit-assistance obligations.
    whyItMatters: >-
      These inputs determine whether the operated-network model creates durable lock-in or merely adds migration
      friction that causes buyers to prefer modular automation.
    diligencePath: >-
      Review three current customer contracts and interview two migrated or churned customers, tracing integration
      effort, parallel-provider use, renewal terms, and exit costs.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Realized per-order rates, storage and exception charges, minimum volume commitments, implementation fees, discount
      schedules, contract terms, and normalized competitor bids.
    whyItMatters: >-
      Without a common scope and denominator, the company-reported savings claim cannot establish pricing advantage or
      customer return on investment.
    diligencePath: >-
      Obtain redacted Nimble invoices and two competing proposals for the same order profile, then normalize total cost
      by shipped order, item, storage day, exception, and service level.
    relatedQuestionRefs:
      - QP009
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: benchmark-gap
    missingEvidence: >-
      Independent tests of throughput, pick success, damage rate, uptime, intervention rate, and total labor across a
      representative shared SKU and order set.
    whyItMatters: >-
      Business-model breadth does not establish technical superiority or durable unit-cost advantage against modular
      vendors, internal automation, or incumbent 3PL operations.
    diligencePath: >-
      Commission a blinded benchmark across representative soft, rigid, fragile, and irregular items and reconcile
      results with production logs from at least two operating sites.
    relatedQuestionRefs:
      - QP006
      - QP010
    relatedTableRefs:
      - TP001
      - TP002
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Customer contracts, rate cards, minimum commitments, surcharges, discounts, renewal terms, and revenue-recognition
      policy.
    whyItMatters: Without contract economics, activity cannot be translated into durable revenue quality or gross profit.
    diligencePath: >-
      Review executed MSAs and invoices for the ten largest customers and reconcile billed units to recognized revenue
      for the last twelve months.
    relatedQuestionRefs:
      - QI002
    relatedTableRefs:
      - TI001
      - TI002
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Facility-level throughput, utilization, uptime, variable cost, depreciation, exception labor, occupancy, freight,
      and contribution margin.
    whyItMatters: >-
      The automation thesis depends on fixed-cost absorption and cannot be tested from company savings claims or
      registry deployment counts.
    diligencePath: >-
      Obtain monthly site cohorts from commissioning through maturity, including contracted capacity, used capacity,
      gross margin, and maintenance capex.
    relatedQuestionRefs:
      - QI005
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current cash, monthly burn, debt and project-finance obligations, committed capex, restricted cash, and
      management's next-round trigger.
    whyItMatters: >-
      Historical funding raised cannot show whether Nimble can finance network expansion through facility ramp and
      customer-volume volatility.
    diligencePath: >-
      Reconcile bank balances to the general ledger and review a 24-month base, downside, and expansion cash forecast
