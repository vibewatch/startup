companyProfile:
  summary: >-
    Nimble Robotics operates an integrated robotic-fulfillment platform rather than selling only warehouse equipment.
    Its general-purpose warehouse robots, company-operated fulfillment centers, transportation relationships, and cloud
    logistics layer serve e-commerce brands, while a strategic FedEx alliance provides commercial validation. Public
    evidence does not resolve the company's founding chronology or headquarters and remains too limited to verify
    current financial scale or facility-level economics.
