      - number: '3.2'
        title: Capability, integration, and distribution
        blocks:
          - type: paragraph
            body: >-
              Nimble's differentiator is system breadth: its own site describes picking, packing, and handling across
              several merchandise categories, while a fulfillment directory describes robots that can transition among
              storage, picking, packing, and sorting tasks. The New Warehouse interview adds an important boundary. A
              Nimble executive said the pick function had been eliminated in the discussed warehouse, but robotic
              sortation was still in development and end-to-end autonomy remained an objective. TechCrunch likewise
              reported in 2023 that manual operations remained even though picking was automated. This supports a
              stronger claim about vertically integrated workflow control than about lights-out autonomy. Distribution
              is potentially reinforced by operating the fulfillment service itself, yet public material does not
              quantify switching costs, migration time, multi-homing, or customer dependence on Nimble's network.
            claimRefs:
              - CP002
              - CP003
              - CP008
              - CP009
              - CP010
              - CP011
