      - number: '1.4'
        title: Scale, milestones, and diligence boundary
        blocks:
          - type: paragraph
            body: >-
              Nimble's live website displays two useful but company-controlled scale indicators: 15 customers with more
              than $100 million in sales and more than one million SKUs handled. These are not a total customer count,
              revenue measure, or utilization metric. The company also advertises a 40% fulfillment-cost reduction on a
              white-paper landing page, but the assigned evidence does not expose the underlying cases or denominator.
              The historical adoption path contains a disconfirming signal: in an April 2024 interview, a Nimble
              executive said finding the first large-scale automation customer was difficult and that Nimble became its
              own first client. A competitor-authored review separately flags capital, infrastructure, technology, and
              cyber risks. These points do not negate the FedEx alliance, but they make current revenue, live-site
              utilization, customer concentration, headcount, and cash runway essential diligence items.
