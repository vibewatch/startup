      - number: '4.2'
        title: Public traction and commercial distribution
        blocks:
          - type: paragraph
            body: >-
              Public traction is visible but not financially reconciled. Nimble says it has handled millions of items,
              while CompWorth labels $87.2 million as a current yearly revenue estimate; the latter is not
              company-reported accounting revenue and provides no basis for treating it as ARR. Supply Chain Dive
              reported in September 2024 that FedEx could use Nimble facilities to expand FedEx Fulfillment and that six
              Nimble centers were open or planned for launch by the following year. The same report said FedEx's
              investment amount was undisclosed. PhysicalState, meanwhile, lists one verified deployment and explicitly
              defines that count as registry-confirmed sites rather than the manufacturer's total footprint. These
              metrics use different denominators and dates, so none establishes current utilization, customer
              concentration, renewal quality, or revenue scale.
            claimRefs:
              - CI002
              - CI005
              - CI006
              - CI007
              - CI011
              - CI012
      - number: '4.3'
        title: Cost structure and unit-economics path
        blocks:
          - type: paragraph
            body: >-
              The plausible margin thesis is labor and space substitution, but the available evidence is claim-heavy and
              incomplete. In a 2024 interview, a Nimble executive said its warehouse eliminated the picker role, which
              normally represented one third to two thirds of building headcount. TechCrunch had reported in 2023 that
              manual operations still remained and that the company had not yet reached a fully lights-out warehouse. A
              competing fulfillment provider also highlights substantial upfront robotics, maintenance, and
              facility-adaptation costs; that source is adverse competitor commentary rather than an independent
              benchmark. Together, the evidence identifies the economic variables but does not quantify robot
              depreciation, maintenance, energy, exception labor, occupancy, freight, implementation, working capital,
              utilization, or site-level contribution margin.
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI016
          - type: table
            tableRef: TI003
            claimRefs:
              - CI008
              - CI009
              - CI010
              - CI015
              - CI016
      - number: '4.4'
        title: Capital adequacy and underwriting verdict
        blocks:
          - type: paragraph
            body: >-
              Public financing totals cannot be converted into current liquidity. FundedIQ records $156 million across
              two rounds, whereas PhysicalState reports about $221 million of disclosed funding. The difference appears
              to reflect tracker coverage, and neither figure measures cash remaining after facilities, robots, payroll,
              inventory handling, or network expansion. No retained source discloses cash on hand, monthly burn, debt or
              project-finance obligations, runway, a next-round trigger, gross margin, CAC, payback, realized pricing,
              or utilization. The financial verdict is therefore conditional: an operated robotic network could capture
              labor and density leverage, but it also places capital and utilization risk on Nimble's balance sheet.
              Underwriting should remain blocked on a facility-level cohort, contracted-versus-used capacity, customer
              gross margin, consolidated cash bridge, and financing schedule.
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
