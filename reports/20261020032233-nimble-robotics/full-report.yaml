      - number: '1.3'
        title: Financing and strategic stakeholders
        blocks:
          - type: paragraph
            body: >-
              The financing record culminates in Nimble's October 2024 announcement of a $106 million Series C at a $1
              billion valuation, led by FedEx and co-led by Cedar Pine. Physical State reports earlier $50 million and
              $65 million rounds and approximately $221 million of total disclosed funding; because that registry is not
              a financing filing, the aggregate should be treated as approximate rather than cash currently available.
              Nimble said the new capital would fund robot manufacturing, deployments, and research and development.
              FedEx is more than a financial name: both Nimble and Supply Chain Dive describe a commercial alliance
              through which FedEx can use Nimble fulfillment centers. The investment amount and contractual economics
              were not disclosed, leaving strategic validation stronger than the evidence for revenue durability or
              governance influence.
