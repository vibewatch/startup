      - number: '5.2'
        title: Architecture, deployment, and maturity
        blocks:
          - type: paragraph
            body: >-
              The disclosed architecture combines customer order and inventory interfaces, software orchestration,
              six-axis robotic manipulation, and a warehouse network designed around robots rather than conventional
              human-centered racks and aisles. An industry interview attributes vision, touch, and force control to the
              robotic layer, while a practitioner registry describes a soft-gripper robot integrated with autonomous
              mobile robot platforms. Maturity is uneven across layers: automated picking is operating, one New Jersey
              deployment is independently catalogued, and robotic sortation was still described as in development in
              2024. A competitor-authored profile also asserts broad commerce and warehouse-management integrations, but
              no public technical documentation in the assigned evidence verifies supported systems, implementation
              effort, exception handling, or service reliability.
            claimRefs:
              - CE003
              - CE005
              - CE006
              - CE007
              - CE011
              - CE013
