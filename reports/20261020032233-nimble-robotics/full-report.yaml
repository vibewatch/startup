              - CP012
      - number: '3.3'
        title: Commercial model, pricing, and buyer economics
        blocks:
          - type: paragraph
            body: >-
              The commercial comparison is structurally uneven. Robotics.press describes Nimble as selling fulfilled
              orders through a robotic-3PL service rather than selling arms to warehouse operators, while the company
              markets low per-unit costs and a gated white paper claims a 40% cost reduction. Neither company material
              nor the assigned independent sources discloses a list rate, realized price per order, minimum volume,
              implementation charge, discount schedule, or contract duration. Hardware and software vendors may instead
              impose equipment, subscription, integration, or maintenance economics, while internal build retains
              operational control but requires implementation resources. Speed Commerce, a competing fulfillment
              provider rather than an independent benchmark, highlights high initial automation and infrastructure
              costs. The useful underwriting conclusion is therefore about contract-model differences, not a numerical
              winner on price.
            claimRefs:
              - CP001
              - CP002
              - CP012
              - CP013
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP001
              - CP012
              - CP013
              - CP015
              - CP016
      - number: '3.4'
        title: Moat durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              Vertical integration can produce a defensible feedback loop if operating volume improves robotic behavior,
              facility design, and fulfillment reliability together. It can also make Nimble harder to adopt than a
              modular point product because the company bears facility, carrier, exception-handling, and capital
              responsibilities that asset-light vendors leave with customers or integrators. Robotics.press explicitly
              says that no independent benchmark against competing piece-picking systems is publicly available, and
              TechCrunch documented that full lights-out operation had not been achieved in 2023. Incumbents can respond
              through modular automation, national warehouse footprints, or internal robotics investment, while
              customers may multi-home across 3PLs to reduce concentration. The moat case is consequently plausible but
              unproven: durability depends on independently verified throughput, error rates, uptime, migration effort,
              contract retention, and per-order economics across multiple sites.
            claimRefs:
              - CP008
              - CP011
              - CP012
              - CP014
              - CP015
              - CP016
      - number: '3.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Differentiation is the operating model
            body: >-
              Nimble's strongest distinction is combining robotics with fulfillment execution; public evidence does not
              yet prove that this model outperforms modular automation on normalized economics.
            calloutType: strength
            claimRefs:
              - CP001
              - CP011
              - CP015
          - type: callout
            title: Comparison remains under-benchmarked
            body: >-
              Without common-order-set testing, current site metrics, and realized contract pricing, apparent capability
              breadth cannot be converted into a defensible performance or value ranking.
            calloutType: risk
            claimRefs:
              - CP011
              - CP016
  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model and monetization
        blocks:
          - type: paragraph
            body: >-
              Nimble is best understood as an operator of robotic third-party fulfillment, not as a disclosed-price
              robotics vendor. TechCrunch reported that the company shifted from retrofitting customer warehouses toward
              outsourcing fulfillment through Nimble-operated automated facilities. Nimble's own site says its
              technology has picked, packed, and handled millions of items and describes its economics only as low cost
              per unit. That language indicates an activity-linked service proposition, but it does not establish
              whether contracts charge per order, item, shipment, storage position, reserved capacity, or a bundled
              minimum. A separate company white-paper page claims 40% lower fulfillment costs; this is a
              customer-savings assertion, not a price card, realized revenue, or gross-margin disclosure. Revenue
              quality cannot be judged until contracts, billing units, minimums, surcharges, and revenue recognition are
              reviewed.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI004
