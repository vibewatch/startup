      - number: '1.2'
        title: Leadership and governance
        blocks:
          - type: paragraph
            body: >-
              Founder and CEO Simon Kalouche is the central operating and technical figure in the available record.
              Nimble's website attributes robotics training at Carnegie Mellon, work at NASA JPL, and Stanford AI Lab
              study to him, while the independent registry also identifies him as founder and CEO. The disclosed board
              brings unusually strong robotics and AI credentials through Fei-Fei Li, Marc Raibert, and Sebastian Thrun.
              That is meaningful technical and reputational coverage, but public biographies do not disclose voting
              control, investor protective provisions, committee assignments, succession depth, or whether operating
              authority is distributed beyond the founder. Diligence should therefore distinguish a high-caliber named
              board from evidence of mature governance processes.
            claimRefs:
