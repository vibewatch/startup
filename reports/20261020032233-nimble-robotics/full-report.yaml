chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and operating model
        blocks:
          - type: paragraph
            body: >-
              Nimble's current website describes an integrated fulfillment offer rather than a standalone robot vendor:
              general-purpose warehouse robots operate fulfillment centers, while transportation partners and a cloud
              logistics platform extend the service from inventory placement to delivery. An independent
              commercial-services page characterizes the company as an AI-powered e-commerce fulfillment technology
              provider, but basic identity fields are not fully settled in public evidence. Speed Commerce reports a
              2017 founding and a San Francisco base; the Physical State registry separately reports a 2019 founding and
              San Jose headquarters. Those discrepancies should remain explicit until corporate formation records,
              current principal-office documentation, or management confirmation resolves them. The latest disclosed
              financing evidence supports describing Nimble as a private, growth-stage Series C company, not as a
              business with independently verified current operating scale.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
              - CO005
              - CO008
