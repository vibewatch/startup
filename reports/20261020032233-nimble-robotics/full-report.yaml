  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >-
              Nimble is best evaluated as an autonomous fulfillment-network operator, not as a pure warehouse-robot
              vendor. Its offer combines a general-purpose mobile manipulator with company-operated fulfillment centers
              and cloud logistics, so the relevant spend boundary includes outsourced storage, retrieval, picking,
              packing, sorting, kitting, and associated orchestration for e-commerce and omnichannel merchants. It
              excludes automation purchased for customer-operated warehouses, upstream manufacturing, freight line-haul,
              and last-mile delivery unless Nimble expands into those layers. The practical substitutes are a
              conventional 3PL, internal manual fulfillment, incremental automation layered onto existing facilities,
              and specialized task-specific machines. That boundary makes the addressable opportunity smaller than
              generic global warehouse-automation forecasts, but more directly tied to fulfillment budgets and service
              levels.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM009
              - CM010
      - number: '2.2'
        title: Evidence-constrained sizing
        blocks:
          - type: paragraph
            body: >-
              The assigned evidence does not disclose the merchant shipment volume, contract value, capacity
              utilization, number of live customer sites, or pricing needed to calculate monetary TAM, SAM, or SOM.
              Public footprint signals instead provide a constrained lens: one 2026 profile names facilities in the Bay
              Area, Dallas, and Trenton, while a registry reports only one verified deployment and explicitly warns that
              its count is not a manufacturer unit total. A secondary 2024 account repeats a claim that the network
              could reach 96% of the U.S. population within two days, but does not disclose the calculation. These
              figures are not comparable market-size stages. They show the gap between a broad serviceable geography and
              independently visible operating evidence, which should cap confidence in any SOM estimate.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
          - type: table
            tableRef: TM002
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM014
              - CM015
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM005
              - CM006
              - CM007
      - number: '2.3'
        title: Buyer, user, payer, and adoption path
        blocks:
          - type: paragraph
            body: >-
              The economic buyer is likely the merchant's supply-chain, operations, or e-commerce leader, with logistics
              or fulfillment budgets paying Nimble as an outsourced service; warehouse operations teams and end
              customers are the principal users and beneficiaries. The clearest fit is a midmarket or larger brand with
              diverse SKUs, material pick-pack labor, seasonal peaks, and a need for faster delivery without funding a
              robotics deployment itself. Adoption can begin as an outsourcing decision rather than an equipment
              purchase, shifting upfront automation capital to the provider. That lowers one barrier but introduces
              inventory migration, systems integration, service-level, concentration, and switching risks. Small
              merchants or operators seeking to retain their own warehouses may prefer conventional 3PL or incremental
              automation.
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: Growth drivers, constraints, and valuation relevance
        blocks:
          - type: paragraph
            body: >-
              Labor availability, repetitive-task ergonomics, peak-volume volatility, and pressure for rapid shipping
              support automation demand. OSHA's Amazon settlement shows that ergonomic risk remains an industry-level
              operating issue requiring assessments, controls, training, and monitoring across fulfillment facilities.
              Nimble also claims that its system has handled millions of items across several product categories and
              that robotic fulfillment can lower costs by 40%, but the allocated evidence does not expose the baseline,
              contract cohort, uptime, or audited savings methodology. Adoption is constrained by digital integration,
              operational dependence on automation, cybersecurity and outage exposure, and the limited public deployment
              record. Valuation should therefore depend on verified site economics, throughput, uptime, retention, and
              capacity utilization rather than a broad warehouse-automation market headline.
            claimRefs:
              - CM003
              - CM006
              - CM013
              - CM014
              - CM015
              - CM016
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Do not convert broad demand into a monetary SOM
            body: >-
              The public pool lacks pricing, contracted volume, utilization, and verified customer-site counts; a
              precise SOM would be false precision rather than a source-supported estimate.
            calloutType: risk
            claimRefs:
              - CM005
              - CM015
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and buyer alternatives
        blocks:
          - type: paragraph
            body: >-
              The relevant landscape is broader than warehouse picking robots. Nimble operates fulfillment centers and
              sells an outsourced fulfillment outcome, so a buyer can compare it with automation vendors such as
              GreyOrange, Symbotic, and RightHand Robotics; with internal automation using platforms associated with
              Amazon, Locus Robotics, Boston Dynamics, or other integrators; with incumbent 3PL capacity; or with
              continued manual operations. Robotics.press characterizes GreyOrange as a large-distribution-center
              vendor, Symbotic as a public company with Walmart-scale deployments, and RightHand as a piece-picking
              specialist that can plug into a broader ecosystem. Physical State separately lists Amazon, Boston
              Dynamics, Locus Robotics, and Robotphoenix as same-form-factor peers. These sources establish categories
              and named alternatives, not an exhaustive market ranking. The positioning map therefore uses explicit
              ordinal analyst assessments and preserves uncertainty rather than presenting unsupported performance
              scores.
