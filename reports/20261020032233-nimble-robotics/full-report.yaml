        title: Exhibits
        blocks:
          - type: callout
            title: Funding raised is not cash available
            body: >-
              Public trackers disagree on cumulative disclosed funding, and neither provides current cash, burn, debt,
              or runway. Capital adequacy requires a management cash bridge rather than inference from historical
              financing totals.
            calloutType: risk
            claimRefs:
              - CI013
              - CI014
              - CI015
              - CI016
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered product and customer workflow
        blocks:
          - type: paragraph
            body: >-
              Nimble's customer-facing product is an outsourced robotic fulfillment service, not merely a robot sale.
              Orders and inventory enter a fulfillment operation in which robotic systems are described as picking,
              packing, sorting, and shipping goods; Nimble's own site says its technology has handled millions of items
              across several merchandise categories. The model reduces the customer's need to buy and integrate
              automation directly because Nimble operates multi-client fulfillment centers. That operating model matters
              for underwriting: the buyer is purchasing fulfillment outcomes and service levels, while Nimble retains
              responsibility for the robotics, facilities, and operating execution. Public evidence nevertheless
              distinguishes automated picking from a fully autonomous facility, because management acknowledged in 2023
              that manual operations remained.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
