        title: 成本结构与单位经济性路径
        blocks:
          - type: paragraph
            body: >-
              合理的利润率逻辑是用机器人替代人工和空间，但现有证据充满公司口径且不完整。2024 年访谈中，Nimble 高管称其仓库取消了拣选员岗位，而该岗位通常占楼内员工数的三分之一至三分之二。TechCrunch 于
              2023
              年报道仍存在人工运营，公司尚未达到完全无人值守仓库。竞争性履约服务商还强调了前期机器人、维护和设施改造成本；这属于不利的竞争对手评论，而非独立基准。综合来看，证据指出了经济变量，却没有量化机器人折旧、维护、能源、异常处理人工、占用、货运、实施、营运资金、利用率或站点级贡献利润。
