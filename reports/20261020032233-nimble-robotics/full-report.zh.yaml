            body: >-
              公开证据没有证明 Nimble 特有的正常运行时间、恢复时间、网络安全认证、隐私控制或事故响应表现。Physical State
              报告没有追踪到事故，但明确警告这不是安全保证，且其已验证部署足迹有限。更广泛的运营环境仍要求保留人工安全控制：OSHA 与 Amazon
              的和解要求在履约站点持续进行人体工学风险评估、培训、员工报告和监测。这是行业基准，不是 Nimble
              违规的证据。因此，尽调应同时测试机器安全和剩余人工工作，包括维护、异常处理、打包、装载和业务连续性流程，不能把自动化拣选当作无人值守或低风险运营的证明。
