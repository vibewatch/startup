              Nimble 与 Dexterity、GreyOrange 和 Fabric 归为一组，但这种相似性模型不是性能基准。最强的量化收益仍是发行方声称的结果：仓库面积最多减少 75%、一至两天覆盖美国 96%
              或以上人口，以及履约成本降低 40%。分配到的独立来源都没有提供这些数字的分母、测量周期、基线配置或经审计的对比。
