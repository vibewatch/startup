      - number: '3.4'
        title: 护城河持久性与替代风险
        blocks:
          - type: paragraph
            body: >-
              如果运营量能同步改善机器人行为、设施设计和履约可靠性，垂直整合可以形成可守的反馈回路。但它也可能比模块化单点产品更难采用，因为设施、承运商、异常处理和资本责任都由 Nimble
              承担，而轻资产供应商会把这些责任留给客户或集成商。Robotics.press 明确称公开资料没有独立的竞争性拣选系统基准，TechCrunch 也记录了 2023
              年尚未实现完全无人值守运营。既有企业可以用模块化自动化、全国仓储网络或内部机器人投资回应；客户也可以在多个 3PL
              之间同时使用，以降低集中度。护城河逻辑因此合理但尚未证实：持久性取决于多个站点经独立验证的吞吐量、错误率、正常运行时间、迁移难度、合同留存和每单经济性。
