      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              分配到的证据没有披露商户发货量、合同金额、产能利用率、在运营客户站点数量或计算货币化 TAM、SAM、SOM 所需的定价。公开足迹只能提供一个受限视角：一份 2026
              年资料称其在湾区、达拉斯和特伦顿设有设施；一份登记则只报告一个已验证部署，并明确警告该数量不是制造商设备总数。另一则 2024 年二手报道重复了网络可在两天内覆盖美国 96%
              人口的说法，但没有披露计算方法。这些数字不能当作可比的市场规模阶段。它们揭示了广泛可服务地理范围与独立可见运营证据之间的差距，也因此应限制任何 SOM 估算的置信度。
