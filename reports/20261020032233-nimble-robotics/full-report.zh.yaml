      - number: '1.4'
        title: 规模、里程碑与尽调边界
        blocks:
          - type: paragraph
            body: >-
              Nimble 的实时网站展示了两个有参考价值、但由公司控制的规模指标：15 家销售额超过 $100 million 的客户，以及处理超过 one million
              SKUs。这些不是客户数、收入指标或利用率指标。公司还在白皮书落地页宣传履约成本降低 40%，但分配到的证据没有披露底层案例或分母。历史采用路径中有一个反向信号：2024 年 4 月的一次访谈中，Nimble
              高管称找到第一个大规模自动化客户很难，Nimble 最终成为自己的第一个客户。竞争对手撰写的评测还单独指出资本、基础设施、技术和网络安全风险。这些信息并不否定 FedEx
              联盟，但使当前收入、在运营站点利用率、客户集中度、员工数和现金跑道成为必须核查的尽调事项。
