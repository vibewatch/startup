              - CV015
              - CV016
      - number: '8.2'
        title: 融资背景与证据质量
        blocks:
          - type: paragraph
            body: >-
              Clay 报告 2024 年 10 月完成 $106 million Series C，估值 $1.0 billion，累计融资 $221 million。信誉较低的行业博客则将 $106 million
              Series C 定在 2025 年 12 月，并称估值 $1.1
              billion。这些记录可能反映后续估值、重复公告或报道错误；留存来源无法解决哪种解释正确。更早的独立报道提供了更清晰的历史节点：TechCrunch 报道 2023 年 3 月完成 $65 million
              Series B，累计融资约 $110 million。FedEx
              的独立战略投资金额未披露。资本历史证明公司能够获得融资，但筹得融资不等于可用现金，这些来源也都没有披露清算优先权、债务、稀释、老股定价或建立投资人持股模型所需的投后资本结构。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV006
          - type: table
            tableRef: TV002
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV011
              - CV014
      - number: '8.3'
        title: 没有假精确的乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >-
              乐观情景要求独立确认客户需求、利用率、正常运行时间和贡献利润的增长速度快于网络资本需求。公司材料声称处理数百万件商品、成本最多降低 40%；TechCrunch 则报道公司声称仓储空间最多减少
              75%、一至两天覆盖超过 96% 人口、节省最多
              40%。这些是有用的尽调假设，不是经审计的估值输入。基准情景是在核实经济性前暂缓价格判断。悲观情景是全新基础设施、维护和运营集中度吞噬宣传的节省；竞争对手评测明确指出了大量初始和基础设施成本。分配到的证据无法支持任何数值化的乐观、基准或悲观估值区间，也没有赋予概率百分比。
            claimRefs:
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
          - type: table
            tableRef: TV003
            claimRefs:
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV013
              - CV015
      - number: '8.4'
        title: 退出准备度、尽调要求与投资逻辑破坏触发点
        blocks:
          - type: paragraph
            body: >-
              Nimble 仍是私有公司，留存证据没有二级市场估值、收购先例、上市公司可比倍数、预期退出日期或已披露的 IPO
              准备。退出准备度因此尚未证实。投资前应取得当前资本结构表、融资文件、优先权瀑布、债务计划、按设施拆分的月度收入和毛利率、客户集中度和续约、设施利用率、正常运行时间、干预率及队列级回本周期。如果经审计的单位经济性能够对上所称节省，并证明多个设施可重复实现利用率，判断会改善。触发投资逻辑破坏的因素包括里程碑不变却发生下轮融资、成熟站点持续贡献利润为负、FedEx
              大幅收缩部署，或无法核对 2024 年与 2025 年估值记录。没有这些披露，目标回报、持有期或退出周期都无法得到支持。
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV011
              - CV012
              - CV013
              - CV015
              - CV016
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 决策
            body: 继续研究，不要直接买入或回避：在把战略潜力转化为价格前，先要求经验证的单位经济性、当前融资条款和持股结果。
            calloutType: recommendation
            claimRefs:
