            - 中小企业商户
        - label: 生产运营
          detail: 公开证据包括处理货物的自述和点名报道，但没有经过核对的在运营站点数量。
          touchpoints:
            - 订单量
            - 服务水平表现
        - label: 扩张或续约
          detail: 客户扩张、续约、留存和集中度指标仍未披露。
          touchpoints:
            - 续约审查
            - 新增站点或订单量
    approximationNotes: 这是分析型客户路径，不是实测漏斗；没有可用的转化率或阶段人数。
