      - CV003
      - CV005
      - CV013
      - CV015
      - CV016
  - id: TV002
    title: 论点与反论点
    columns:
      - 论点
      - 证据类型
      - 当前判断
      - 哪些信息会改变判断
    rows:
      - - 战略渠道验证
        - 独立报道的 FedEx 联盟与投资
        - 支持商业相关性
        - 披露部署范围、经济性与续约承诺
      - - 运营规模信号
        - 公司声称已处理数百万件货物
        - 前景可期，但未经审计
        - 按设施披露的货物量、正常运行时间与错误率队列
      - - 网络扩张
        - 独立报道 2024 年已有或计划开设六个中心
        - 扩张意图清晰可见
        - 当前运营站点数与成熟站点利用率
      - - 资本获取
        - Clay 报道的 $221M 总融资额
        - 融资能力不容忽视
        - 现金余额、烧钱速度、债务与剩余现金跑道
      - - 基础设施负担
        - 竞争对手撰写的评述指出前期投入和基础设施成本高昂
        - 下行情景仍然成立
        - 经审计的站点回本周期与正贡献利润率
    notes: 本表将发行方关系与托管领域分开；公司自述和竞争对手比较不作为独立基准。
    claimRefs:
      - CV004
      - CV005
      - CV008
      - CV011
      - CV014
  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 必要假设
      - 估值与回报逻辑
      - 概率信号
      - 下行触发因素
    rows:
      - - 乐观
        - 节省可验证且可重复、利用率高、续约持久、设施利润率可规模化
        - 只有在有充分依据的运营模型出现后，才可考虑相对已披露融资锚点的溢价；不设定区间
        - FedEx 联盟和声称的货物规模是积极信号，但并不完整
        - 独立验证无法复现节省额或利用率
      - - 基准
        - 战略需求延续，但经济性与资本结构仍未披露
        - 暂缓认可价格，也不建模目标回报
        - 与当前混合证据最为匹配
        - 运营证明改善前，融资条件先恶化
      - - 悲观
        - 基础设施和维护成本吞噬节省额，而部署仍然集中
        - 仅凭公开数据无法量化折价轮融资和估值倍数压缩风险
        - 竞争对手批评与有限的已验证部署足迹支持下行判断
        - 成熟站点贡献利润率持续为负，或合作伙伴收缩
    notes: 这些情景是定性的，因为指定来源未披露收入、利润率、现金消耗、股权表条款或可比交易倍数；给出概率百分比会制造虚假的精确度。
    claimRefs:
