        title: 资本充足性与投资判断
        blocks:
          - type: paragraph
            body: >-
              公开融资总额不能换算成当前流动性。FundedIQ 记录两轮融资合计 $156 million，PhysicalState 则报告披露融资约 $221
              million。差异可能来自追踪范围，且两者都无法衡量设施、机器人、工资、库存处理或网络扩张后的剩余现金。留存来源没有披露现金余额、月度烧钱速度、债务或项目融资义务、现金跑道、下一轮触发点、毛利率、CAC、回本周期、实际定价或利用率。因此，财务判断是有条件的：运营机器人网络可能捕获人工和密度杠杆，但也把资本和利用率风险放在
              Nimble 资产负债表上。在设施级客户队列、已签约与实际使用产能、客户毛利、合并现金桥和融资计划得到核实前，不应作出投资判断。
