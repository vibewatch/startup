  - id: TV001
    title: 建议摘要
    columns:
      - 决策因素
      - 证据
      - 当前判断
      - 决策含义
      - 哪些信息会改变判断
    rows:
      - - 建议
        - 战略验证成立，但没有可投资的公开模型
        - Research-more
        - 暂不认可任何价格
        - 已验证的数据室经济性和当前融资条款
      - - 置信度
        - 多份独立报道，加上重大披露缺口
        - 中
        - 将结论视为暂定
        - 经审计的财务和运营客户群数据
      - - 风险评级
        - 资本密集型网络，且已验证部署证据有限
        - 高
        - 要求下行保护和里程碑闸门
        - 各设施可重复实现正贡献毛利
      - - 估值立场
        - 报道中的 $1.0B 和 $1.1B 锚点相互冲突
        - Unknown
        - 不要把新闻标题换算成公允价值
        - 经协调的投后估值和完全稀释后股本
      - - 退出准备度
        - 私营公司，没有保留的退出或二级交易证据
        - 未证明
        - 无法支持目标回报或退出日期
        - 可比交易、二级市场估值和可信退出方案
    notes: 这些判断是根据保留的公开证据得出的分析结论；没有估算收入倍数、目标回报或隐含估值。
