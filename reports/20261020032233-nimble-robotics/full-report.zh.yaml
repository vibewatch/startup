      - number: '3.2'
        title: 能力、集成与分销
        blocks:
          - type: paragraph
            body: >-
              Nimble 的差异化在于系统覆盖面：其网站描述了多个商品类别中的拣选、打包和处理，履约目录则称机器人可以在存储、拣选、打包和分拣任务之间切换。The New Warehouse
              的访谈补充了一个重要边界。Nimble 高管称讨论中的仓库已经取消拣选职能，但机器人分拣仍在开发，端到端自主化仍是目标。TechCrunch 同样在 2023
              年报道，即便拣选已经自动化，人工运营仍然存在。这支持对垂直整合工作流控制提出更强判断，但不支持宣称已经实现无人值守自主运营。自营履约服务可能强化分销，但公开资料没有量化切换成本、迁移时间、多重供应商使用或客户对
              Nimble 网络的依赖。
            claimRefs:
              - CP002
              - CP003
              - CP008
              - CP009
              - CP010
              - CP011
          - type: table
            tableRef: TP002
            claimRefs:
