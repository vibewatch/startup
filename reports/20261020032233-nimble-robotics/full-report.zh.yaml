            body: >-
              公开牵引力已经出现，但没有财务上的统一口径。Nimble 称其处理过数百万件商品，而 CompWorth 将 $87.2 million 标为当前年度收入估计；后者不是公司报告的会计收入，也没有依据把它当作
              ARR。Supply Chain Dive 于 2024 年 9 月报道，FedEx 可以使用 Nimble 设施来扩展 FedEx Fulfillment，且到次年将有六个 Nimble
              中心开放或计划启动。报道同时称 FedEx 的投资金额未披露。PhysicalState
              则列出一个已验证部署，并明确将其定义为登记确认的站点，而非制造商的总足迹。这些指标的分母和日期不同，因此没有一个能证明当前利用率、客户集中度、续约质量或收入规模。
