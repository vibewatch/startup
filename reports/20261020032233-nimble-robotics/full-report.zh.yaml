  - id: FV001
    title: 推荐逻辑
    type: flow
    summary: 证据链最终指向“继续研究”：战略验证尚未与已验证的经济性或核对过的价格挂钩。
    data:
      nodes:
        - id: reported-price
          label: 报道的 $1.0B / $1.1B 估值锚点
        - id: capital
          label: 报道的 $221M 总融资额
        - id: strategic-proof
          label: FedEx 投资与履约联盟
        - id: operating-proof
          label: 声称已处理数百万件货物；部署证据仍有限
        - id: missing-model
          label: 收入、利润率、烧钱速度、股权结构表和优先权未披露
        - id: decision
          label: 继续研究；高风险；估值立场未知
      edges:
        - from: reported-price
          to: missing-model
        - from: capital
          to: strategic-proof
        - from: strategic-proof
          to: operating-proof
        - from: operating-proof
          to: missing-model
        - from: missing-model
          to: decision
    approximationNotes: 这是定性决策链；节点顺序不代表概率、规模或转化。
    claimRefs:
