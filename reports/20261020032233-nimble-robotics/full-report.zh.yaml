        title: 展示材料
        blocks:
          - type: callout
            title: 不要把广泛需求换算成货币化 SOM
            body: 公开资料缺少定价、合同量、利用率和经验证的客户站点数；精确的 SOM 会是假精确，而不是有来源支持的估算。
            calloutType: risk
            claimRefs:
              - CM005
              - CM015
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争格局与买方替代方案
        blocks:
          - type: paragraph
            body: >-
              相关竞争范围比仓储拣选机器人更广。Nimble 运营履约中心，出售的是外包履约结果，因此买方可以将其与 GreyOrange、Symbotic、RightHand Robotics
              等自动化供应商比较；也可以选择使用 Amazon、Locus Robotics、Boston Dynamics 或其他集成商相关平台的内部自动化、既有 3PL 产能，或继续人工运营。Robotics.press
              将 GreyOrange 描述为大型配送中心供应商，将 Symbotic 描述为在 Walmart 规模部署的上市公司，将 RightHand 描述为可接入更大生态的拣选专家。Physical State
              则单独将 Amazon、Boston Dynamics、Locus Robotics 和 Robotphoenix
              列为同形态同行。这些来源证明了类别和具名替代方案，并非完整的市场排名。因此，定位图采用明确的序数分析师判断并保留不确定性，而不是呈现无依据的性能分数。
            claimRefs:
