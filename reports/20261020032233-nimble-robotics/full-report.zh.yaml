      - number: '3.3'
        title: 商业模式、定价与买方经济性
        blocks:
          - type: paragraph
            body: >-
              商业比较在结构上并不对称。Robotics.press 称 Nimble 依托机器人 3PL 服务销售已完成履约的订单，而不是向仓库运营商出售机械臂；公司则营销低单位成本，门控白皮书声称成本下降
              40%。公司材料和分配到的独立来源都没有披露目录价、每单实际价格、最低量、实施费、折扣表或合同期限。硬件和软件供应商可能改为收取设备、订阅、集成或维护费用；内部自建保留运营控制，但需要投入实施资源。竞争性履约服务商
              Speed Commerce 并非独立基准，却强调了高昂的初始自动化和基础设施成本。因此，有用的投资判断应落在合同模式差异，而不是在价格上给出数值赢家。
            claimRefs:
              - CP001
              - CP002
              - CP012
              - CP013
              - CP015
