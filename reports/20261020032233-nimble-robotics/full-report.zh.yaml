  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              建议为继续研究，置信度中等，风险高，估值立场未知。Nimble 有可信的战略信号：FedEx 进行了投资，建立了可使用 Nimble 履约中心的联盟，独立报道还称 2024
              年有六个中心开放或计划启动。公司也称其系统已处理数百万件商品。这些信号证明了相关性，而不是某个价格下的可投资性。留存公开记录没有收入、毛利率、烧钱速度、现金余额、优先股堆叠、完全稀释后持股或经验证的站点回报数据。因此，任何价格背书前都应要求经过核对的当前融资锚点和数据室模型。$1.0
              billion 或 $1.1 billion 的标题估值应视为未经验证的参考点，而不是公允价值或当前企业价值的证明。
            claimRefs:
              - CV003
              - CV005
              - CV008
              - CV014
              - CV015
              - CV016
