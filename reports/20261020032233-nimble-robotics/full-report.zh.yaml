        title: 管理层与治理
        blocks:
          - type: paragraph
            body: >-
              创始人兼 CEO Simon Kalouche 是现有记录中的核心运营和技术人物。Nimble 网站称其接受过卡内基梅隆大学机器人学训练、曾在 NASA JPL 工作并在斯坦福 AI
              实验室学习，独立登记也将其列为创始人兼 CEO。已披露董事会由 Fei-Fei Li、Marc Raibert 和 Sebastian Thrun 组成，机器人和 AI
              履历异常强。这个阵容带来有意义的技术与声誉背书，但公开简介没有披露投票控制权、投资人保护条款、委员会分工、继任梯队，或运营权是否已经分散到创始人之外。因此，尽调应区分高资历的具名董事会与成熟治理流程的证据。
            claimRefs:
              - CO006
              - CO007
          - type: table
            tableRef: TO002
            claimRefs:
              - CO006
              - CO007
      - number: '1.3'
        title: 融资与战略利益相关方
        blocks:
          - type: paragraph
            body: >-
              融资记录最终落在 Nimble 于 2024 年 10 月宣布的 $106 million Series C，估值 $1 billion，由 FedEx 领投、Cedar Pine 联合领投。Physical
              State 记录了此前的 $50 million 和 $65 million 融资轮，并称累计披露融资约 $221
              million；由于该登记并非融资申报文件，这一总额应视为近似值，而不是当前可用现金。Nimble 称新资金将用于机器人制造、部署和研发。FedEx 不只是一个财务名称：Nimble 和 Supply Chain
              Dive 都描述了商业联盟，FedEx 可以借助 Nimble 履约中心。投资金额和合同经济性未披露，因此战略验证强于收入持续性或治理影响的证据。
