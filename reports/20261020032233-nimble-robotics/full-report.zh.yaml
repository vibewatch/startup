      - 集中度证据
      - 失败情景
      - 严重性
      - 缓解措施与剩余暴露
    rows:
      - - 战略分销与履约需求
        - FedEx；投资方、联盟合作伙伴和 Nimble 中心用户
        - 商业份额和投资金额未披露
        - FedEx 延迟扩张、重新谈判经济条件或终止接入
        - 高
        - 联盟验证了需求，但在审阅合同、最低承诺和集中度前，剩余暴露仍高
      - - 设施融资与固定成本摊薄
        - 股权及战略资本提供方；Nimble 运营的履约网络
        - 消耗、现金、已承诺资本开支和站点利用率未披露
        - 上线义务在中心达到有效业务量前消耗现金
        - 高
        - 分阶段、设门槛的铺开可能限制暴露；要求提供站点群、资本开支计划和下行情景流动性方案
      - - 仓库与软件集成生态
        - WMS/WCS 环境和系统集成商
        - 2021 年发布列出多个集成商，但未披露依赖份额
        - 关键集成、组件或实施合作伙伴成为瓶颈
        - 中高
        - 声称的零代码集成可缓解风险，但当前实施证据缺失
      - - 客户续约与需求集中度
        - 已命名的零售和电商客户
        - 本来源池中公开的只有过时的公司声明：留存率和重复使用率均为 100%
        - 大型部署未续约，或订单量不足以填满设施
        - 高
        - 已命名部署显示存在使用；在获得头部客户占比、客户群和续约数据前，剩余暴露仍高
    notes: 该登记表区分已募集资金与可用现金；合同层面分母缺失时，不推断客户或合作伙伴集中度百分比。
