      - number: '2.3'
        title: 买方、使用者、付款方与采用路径
        blocks:
          - type: paragraph
            body: >-
              经济买方可能是商户的供应链、运营或电商负责人，物流或履约预算支付 Nimble 的外包服务；仓库运营团队和终端客户是主要使用者和受益者。最匹配的客户是中型或更大的品牌：SKU
              多样、拣选打包人工成本高、存在季节性峰值，同时需要更快配送却不想自行投入机器人部署。采用可以先从外包决策开始，而不是购买设备，把前期自动化资本支出转移给服务商。这会降低一道门槛，但也引入库存迁移、系统集成、服务水平、集中度和切换风险。希望保留自有仓库的小商户或运营商，可能更偏好传统
              3PL 或增量自动化。
            claimRefs:
              - CM009
              - CM010
              - CM011
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM004
              - CM009
              - CM010
              - CM011
              - CM012
              - CM013
      - number: '2.4'
        title: 增长驱动、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              劳动力供给、重复任务的人体工学风险、峰值订单波动和快速发货压力，都支持自动化需求。OSHA 与 Amazon 的和解说明，人体工学风险仍是行业运营问题，需要在履约设施内持续评估、控制、培训和监测。Nimble
              还声称其系统已在多个产品类别中处理数百万件商品，机器人履约可降低 40%
              成本，但分配到的证据没有披露基准、合同队列、正常运行时间或经审计的节省方法。数字化集成、对自动化的运营依赖、网络安全和宕机暴露，以及公开部署记录有限，都会约束采用。因此，估值应依赖经验证的站点经济性、吞吐量、正常运行时间、留存和产能利用率，而不是泛化的仓储自动化市场标题。
            claimRefs:
              - CM003
              - CM006
              - CM013
              - CM014
              - CM015
              - CM016
