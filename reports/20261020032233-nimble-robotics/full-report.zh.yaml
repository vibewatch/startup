      - number: '7.4'
        title: 依赖与财务风险需要合同层面的证据
        blocks:
          - type: paragraph
            body: >-
              FedEx 可以根据 2024 年联盟使用 Nimble 中心，登记也将这段关系描述为在运营，但投资金额、商业最低量、终止权、排他性和收入贡献均未披露。更早的具名客户证据也已过时：2021 年公告称 iHerb
              拥有超过 20 台机器人，并引用管理层称客户留存率和复购率为 100%，但没有队列定义或当前续约数据。Nimble 还宣传行业领先的 SLA 和成本降低
              40%，但抓取页面没有提供计算方法。投资逻辑的破坏触发点应包括反复错过 SLA、重大安全事件、FedEx
              丧失或大幅缩减部署、无法在惩罚性稀释之外为承诺站点融资，或经审计单位经济性无法证明从毛利到站点级现金回报的可信路径。
            claimRefs:
