    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份与运营模式
        blocks:
          - type: paragraph
            body: >-
              Nimble 的现网站描述的是一体化履约服务，而非单独的机器人供应商：通用仓储机器人在履约中心运行，运输伙伴和云物流平台则把服务从库存上架延伸到配送。独立商业服务页面将公司称为 AI
              驱动的电商履约技术提供商，但公开证据尚未完全厘清基本身份信息。Speed Commerce 称公司成立于 2017 年、总部在旧金山；Physical State 登记则分别称其成立于 2019
              年、总部在圣何塞。在公司注册记录、当前主要办公地址文件或管理层确认解决这些矛盾前，应明确保留差异。最近披露的融资证据支持将 Nimble 描述为一家私有、成长阶段的 Series C
              公司，而不是一家当前运营规模已获独立验证的企业。
