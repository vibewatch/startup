              - CV016
          - type: callout
            title: 标题估值不是公允价值
            body: 留存来源对最近估值的时间和金额都存在分歧，也没有一个来源披露定价进入所需的资本结构或运营模型。
            calloutType: risk
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV015
