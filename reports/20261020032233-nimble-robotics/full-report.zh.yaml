      - - WMS、WCS、承运商或客户工作流之间的集成失败
        - 中
        - 高
        - 公司声称 2021 年可在一天内完成零代码集成
        - 仅由历史公司声明证明
        - 中高；若实施超支、依赖定制代码或生产切换失败则触发
      - - 网络攻击、软件中断或设备故障打断履约
        - 中
        - 高
        - 来源池中没有公开控制或恢复证据；竞争对手评述指出该暴露
        - 未验证
        - 高；要求提供经过测试的恢复目标、冗余设计、事故历史和客户补救措施
    notes: 严重性、可能性和缓解措施成熟度是分析师分类；公开公司指标保留为声明，不能视为经审计的表现。
