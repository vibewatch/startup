  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >-
              评估 评估 Nimble
              时，最好把它看作自主履约网络运营商，而不是纯仓储机器人供应商。它把通用移动操作机器人、公司运营的履约中心和云物流结合起来，因此相关支出边界应包括为电商和全渠道商户提供的外包仓储、取货、拣选、打包、分拣、组套及相关编排。客户自营仓库采购的自动化、上游制造、干线货运和最后一公里配送不在边界内，除非
              Nimble 向这些层延伸。实际替代方案包括传统 3PL、内部人工履约、叠加在现有设施上的增量自动化，以及专用任务机器。这一边界使可触达机会小于泛化的全球仓储自动化预测，但与履约预算和服务水平的联系更直接。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
