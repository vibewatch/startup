  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式与变现
        blocks:
          - type: paragraph
            body: >-
              Nimble 更适合被理解为机器人第三方履约运营商，而不是一个公开定价的机器人供应商。TechCrunch 报道，公司已从改造客户仓库转向通过 Nimble 自营自动化设施外包履约。Nimble
              网站称其技术已拣选、打包和处理数百万件商品，只将其经济性描述为低单位成本。因此，服务与活动量挂钩，但不能确定合同按订单、商品、发货、存储位置、预留产能还是打包最低量收费。公司另一白皮书页面声称履约成本降低
              40%；这是客户节省的公司口径，不是价目表、实际收入或毛利率披露。只有审阅合同、计费单位、最低量、附加费和收入确认后，才能判断收入质量。
