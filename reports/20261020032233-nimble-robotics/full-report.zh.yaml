              年有六个中心开放或计划启动。这一战略可以创造运营杠杆，但也把失败面从机器人性能扩大到设施开业、库存处理、劳动力转换、运输协调和客户服务。FedEx
              联盟是有意义的商业缓冲，但也形成战略依赖，其经济性、排他性和集中度均不公开。因此，热力图把网络执行和系统连续性排在较窄的知识产权风险之前；其可能性和剩余严重性标签是基于所引运营模式证据的分析师判断，不是公司披露的概率。
