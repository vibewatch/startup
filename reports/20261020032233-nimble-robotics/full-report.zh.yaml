            body: >-
              Nimble 面向客户的产品是外包机器人履约服务，而不只是卖机器人。订单和库存进入履约运营，机器人系统负责拣选、打包、分拣和发货；Nimble 网站称其技术已在多个商品类别中处理数百万件商品。由于 Nimble
              运营多客户履约中心，这种模式降低了客户自行购买和集成自动化的需要。投资判断中，运营模式很关键：买方购买的是履约结果和服务水平，Nimble
              则继续承担机器人、设施和运营执行责任。不过，公开证据仍区分了自动化拣选与完全自主设施，因为管理层在 2023 年承认仍存在人工运营。
