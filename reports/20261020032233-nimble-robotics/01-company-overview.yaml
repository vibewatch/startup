    - type: private-evidence-only
      severity: material
      topic: governance
      missingEvidence: "Fully diluted capitalization, voting control, liquidation preferences, investor consent rights, board committees, and succession plans."
      whyItMatters: "Named directors and investors do not reveal practical control, downside allocation, or resilience to founder departure."
      diligencePath: "Review the charter, bylaws, voting agreements, investor-rights agreements, board minutes, committee charters, and founder succession plan."
