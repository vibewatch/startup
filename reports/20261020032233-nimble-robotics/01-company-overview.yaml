    - type: conflicting-data
      severity: material
      topic: identity
      missingEvidence: "Authoritative formation date and current principal-office documentation resolving the 2017 versus 2019 and San Francisco versus San Jose conflicts."
      whyItMatters: "Basic corporate identity must be stable before relying on the chapter as ground truth for legal, governance, or operating diligence."
      diligencePath: "Obtain the certificate of incorporation, current statement of information, and management-confirmed corporate chronology."
      relatedQuestionRefs: [QO001]
      relatedTableRefs: [TO001]
    - type: private-evidence-only
      severity: material
      topic: scale
      missingEvidence: "Current revenue, revenue run-rate, customer count and concentration, live-site utilization, headcount, gross margin, burn rate, and cash runway."
      whyItMatters: "Funding raised and marketing activity measures do not establish commercial scale, capital efficiency, or liquidity."
      diligencePath: "Request audited financials, monthly management accounts, bank balances, payroll records, site-level operating dashboards, and customer-level cohort data."
      relatedQuestionRefs: [QO006, QO010]
