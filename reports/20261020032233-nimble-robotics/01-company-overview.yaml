slug: nimble-robotics
runDate: 2026-10-20
company:
  name: Nimble Robotics
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Nimble Robotics presents itself as an autonomous fulfillment platform spanning robotic
    warehouses, transportation, and cloud logistics, with a $106 million Series C announced at
    a $1 billion transaction valuation in October 2024. The evidence supports a strategically
    important FedEx relationship, but public sources conflict on basic corporate chronology and
    headquarters while current revenue, headcount, ownership rights, and cash runway remain
    unavailable.
sections:
  - id: identity-and-operating-model
    title: Identity and operating model
    body: >-
      Nimble's current website describes an integrated fulfillment offer rather than a standalone
      robot vendor: general-purpose warehouse robots operate fulfillment centers, while
      transportation partners and a cloud logistics platform extend the service from inventory
      placement to delivery. An independent commercial-services page characterizes the company as
      an AI-powered e-commerce fulfillment technology provider, but basic identity fields are not
      fully settled in public evidence. Speed Commerce reports a 2017 founding and a San Francisco
      base; the Physical State registry separately reports a 2019 founding and San Jose
      headquarters. Those discrepancies should remain explicit until corporate formation records,
      current principal-office documentation, or management confirmation resolves them. The latest
      disclosed financing evidence supports describing Nimble as a private, growth-stage Series C
      company, not as a business with independently verified current operating scale.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO008]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership and governance
    body: >-
      Founder and CEO Simon Kalouche is the central operating and technical figure in the available
      record. Nimble's website attributes robotics training at Carnegie Mellon, work at NASA JPL,
      and Stanford AI Lab study to him, while the independent registry also identifies him as
      founder and CEO. The disclosed board brings unusually strong robotics and AI credentials
      through Fei-Fei Li, Marc Raibert, and Sebastian Thrun. That is meaningful technical and
      reputational coverage, but public biographies do not disclose voting control, investor
      protective provisions, committee assignments, succession depth, or whether operating
      authority is distributed beyond the founder. Diligence should therefore distinguish a
      high-caliber named board from evidence of mature governance processes.
    claimRefs: [CO006, CO007]
    tableRefs: [TO002]
  - id: financing-and-strategic-stakeholders
    title: Financing and strategic stakeholders
    body: >-
      The financing record culminates in Nimble's October 2024 announcement of a $106 million
      Series C at a $1 billion valuation, led by FedEx and co-led by Cedar Pine. Physical State
      reports earlier $50 million and $65 million rounds and approximately $221 million of total
      disclosed funding; because that registry is not a financing filing, the aggregate should be
      treated as approximate rather than cash currently available. Nimble said the new capital
      would fund robot manufacturing, deployments, and research and development. FedEx is more than
      a financial name: both Nimble and Supply Chain Dive describe a commercial alliance through
      which FedEx can use Nimble fulfillment centers. The investment amount and contractual
      economics were not disclosed, leaving strategic validation stronger than the evidence for
      revenue durability or governance influence.
    claimRefs: [CO008, CO009, CO010, CO011]
    tableRefs: [TO003]
  - id: scale-milestones-and-diligence-boundary
    title: Scale, milestones, and diligence boundary
    body: >-
      Nimble's live website displays two useful but company-controlled scale indicators: 15
      customers with more than $100 million in sales and more than one million SKUs handled. These
      are not a total customer count, revenue measure, or utilization metric. The company also
      advertises a 40% fulfillment-cost reduction on a white-paper landing page, but the assigned
      evidence does not expose the underlying cases or denominator. The historical adoption path
      contains a disconfirming signal: in an April 2024 interview, a Nimble executive said finding
      the first large-scale automation customer was difficult and that Nimble became its own first
      client. A competitor-authored review separately flags capital, infrastructure, technology,
      and cyber risks. These points do not negate the FedEx alliance, but they make current revenue,
      live-site utilization, customer concentration, headcount, and cash runway essential
      diligence items.
    claimRefs: [CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
