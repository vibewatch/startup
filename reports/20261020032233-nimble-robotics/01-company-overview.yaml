callouts:
  - calloutType: risk
    title: Public scale evidence remains incomplete
    body: >-
      The assigned sources do not disclose current revenue, headcount, cash runway, customer
      concentration, live-site utilization, or contract economics; transaction funding and
      marketing metrics cannot substitute for those operating measures.
    claimRefs: [CO009, CO012, CO014, CO015, CO016]
