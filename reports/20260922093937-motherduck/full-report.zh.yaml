      - number: '2.2'
        title: 多个规模视角，而不是单一 TAM
        blocks:
          - type: paragraph
            body: >
              公开来源还撑不起一个干净的供应商专属 TAM，因此应保留多个测算视角。最窄的是精益初创数仓切口：服务数据量中小、需要快速迭代、平台开销很低的团队。第二个视角是相邻的智能体分析和运行时市场；MotherDuck
              正把用例从查询服务拓宽到自然语言流水线创建与监控。第三个视角是企业部门级切口；DuckLake
              式对象存储部署可以服务大型组织里的特定团队，而不替换核心数仓。合在一起，证据指向一个市场：先从初创分析起步，再延伸到更广的数据应用基础设施；但这里的公开来源无法拆出可信的支出数字。这一不确定性应保持可见，不能藏进一页雄心勃勃的
              TAM 幻灯片。
