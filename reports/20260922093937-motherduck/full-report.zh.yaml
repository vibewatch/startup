  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与替代类别
        blocks:
          - type: paragraph
            body: >-
              MotherDuck 的实际竞争集合比直接的 DuckDB 同类更宽。公司自己把产品描述为基于 DuckDB 的无服务器云数仓，而官方对比材料把 SQLite 定位为嵌入式事务型替代品，把 Turso /
              SQLite Cloud 定位为云化 SQLite 路径。这意味着买方不仅会拿 MotherDuck 与其他托管分析工具比较，也会拿它与继续使用嵌入式引擎、继续使用 Postgres
              加副本，或让团队保留本地优先工作流、只在需要时增加云端共享相比较。公开材料最强的结论是，MotherDuck 竞争的不只是原始查询执行，也同样是工作流形态。
