    type: quadrant
    summary: MotherDuck 位于高便利、高分析专精的角落；DuckDB 和云端 SQLite 替代方案，则在托管工作流深度、简单性和本地控制之间取舍。
    data:
      points:
        - label: MotherDuck
          x: 5
          'y': 5
          tone: positive
          detail: 本地 / 云端混合执行加协作，把产品推向便利性和专业化的右上角。
        - label: DuckDB 自建
          x: 4
          'y': 3
          tone: neutral
          detail: 分析引擎很强，但编排、共享和服务体验都由买方自己承担。
        - label: SQLite / 云端 SQLite
          x: 2
          'y': 2
          tone: warning
          detail: 交易型或嵌入式负载足够简单，但复杂分析能力较弱。
        - label: 传统数据仓库
          x: 4
          'y': 4
          tone: neutral
          detail: 仓库能力和治理覆盖广，但运维与定价负担更重。
        - label: Postgres + 副本
          x: 3
          'y': 2
          tone: warning
          detail: 许多团队熟悉的现状方案，但不是为云分析工作流打造。
        - label: DuckDB + DBCode
          x: 4
          'y': 4
          tone: opportunity
          detail: 由 IDE 牵头的工作流能改善开发者体验，但托管服务的负担仍然留给买方。
    approximationNotes: 坐标轴是基于公开定位的序数评分，不是实测基准；x 越高，分析取向越专门化，y 越高，买方获得的托管工作流越顺滑。
