  - id: TV003
    title: 乐观 / 基准 / 悲观情景
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 乐观
        - 企业支持跑出规模、智能体优先用法增长，当前私募估值从天花板变成地板。
        - 如果公司能把产品拉力转成可衡量经常性收入，倍数仍可扩张。
        - 竞品模仿，或企业转化慢于预期。
        - 需要当前 ARR 和留存验证。
      - - 基准
        - 公司继续增加用户和用例，但公开指标仍稀缺。
        - 当前 $400M 中段估值大致符合私募市场情绪。
        - 如果披露缺口持续，估值可能停滞。
        - 最符合今天的公开记录。
      - - 悲观
        - 使用深度确实存在，但收入质量和利润率弱于产品故事。
        - 如果增长不能转化为更好经济性，下轮降估值或平轮风险会上升。
        - 用户向耐久收入转化较弱。
        - 财务披露差或融资意愿减弱会触发这一情景。
      - - 上行催化
        - 新披露指标显示高效增长，企业参考账户也在扩大。
        - 会支撑更高价格纪律和更激进的入场。
        - 仍需要证明市场愿意为平台付费。
        - 需要管理层披露或融资更新。
      - - 下行触发点
        - 下一轮尽调仍无法确认 ARR、利润率或留存。
        - 价格支撑仍由情绪驱动，而非基本面驱动。
        - 一旦更硬的指标浮出水面，市场可能很快重估公司。
        - 这就是当前公开证据的状态。
    notes: 情景概率是判断性、示例性的。它们反映的是估值纪律，而非校准后的财务模型。
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV009
      - CV012
