      - number: '6.3'
        title: 耐久性、扩张与未解缺口
        blocks:
          - type: paragraph
            body: >-
              耐久性是公开记录最弱的一环。可见材料支持真实部署和部分扩张，但没有披露 NRR、GRR、流失或集中度表，因此本章无法区分广泛采用和少数热情 logo。公开批评也呈现混合状态：一个 Reddit
              帖子质疑生产就绪度，而公司自己的条款和客户故事又暗示真实客户工作流确实涉及客户数据和第三方集成。两边相抵，公司看起来确实有人在用，但粘性故事仍未解决。这很重要，因为可见需求仍可能建立在续约可见度差或客户基础集中的上面。使用信号值得相信，但不足以承销持久的客户经济性。
            claimRefs:
              - CU012
              - CU013
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险摘要
        blocks:
          - type: paragraph
            body: >-
              与典型监管爆雷相比，MotherDuck
              更暴露在一组普通但仍有意义的控制、依赖和证明风险之下。公开条款允许公司广泛处理客户和使用数据、修改或停止服务，并否认大多数下游平台风险。产品故事有吸引力，因为它把隔离计算和混合本地 -
              云端执行结合起来；但同样的设计也意味着，可靠性、查询正确性和客户信任高度依赖 MotherDuck
              托管基础设施，以及多数买方不会直接检查的事务日志抽象。融资和用户数披露令人鼓舞，但公开记录仍没有回答生产采用深度、集中度、事故和安全姿态等问题。
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR012
              - CR013
      - number: '7.2'
        title: 法律、监管与合同敞口
        blocks:
          - type: paragraph
            body: >-
              已审阅的法律界面很直接，但偏向供应商。使用条款赋予 MotherDuck 处理客户数据和使用数据的广泛权利，对客户侧的法律合规施加强保证，并把责任上限限定为象征性金额。条款还允许 MotherDuck
              修改、暂停或终止服务，并把第三方平台、凭据和客户权限的大部分责任放在用户身上。这种结构在 SaaS
              中常见，但在这里更重要，因为产品本身就是数据处理层；如果服务中断，客户的合同杠杆可能有限，除了支持或切换成本之外几乎没有补救。对承销来说，关键尽调问题不是条款是否存在，而是企业客户是否谈到了更强合同，还是标准合同就是实际常态。
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: 运营与平台可靠性风险
        blocks:
          - type: paragraph
            body: >-
              MotherDuck 的架构减轻了一些经典数仓痛点，但也让运营质量更难从外部观察。公司强调每个用户或智能体都有隔离的 DuckDB 实例，这应能限制吵闹邻居问题；它还用事务日志管理文件级变更，而不是原地修改
              parquet。这个做法高效，但也意味着正确性取决于日志被一致应用，以及用户不会把原始文件内容和逻辑表视图混淆。因此，平台的失效模式不像一次灾难性宕机，更像一组细微的正确性、时效性和状态管理问题。这类问题通常只有在生产负载和复杂数据操作进入后才会显现。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR010
      - number: '7.4'
        title: 依赖、市场与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              剩余风险混合了依赖和市场规模不确定性。MotherDuck 建在 DuckDB
              之上，必须让兼容性、性能和开发者信任与这个开源基础保持一致。与此同时，公司公开定位偏向轻量、成本敏感的分析，而不是最宽泛的数仓市场；这有利于清晰度，但也可能收窄漏斗。公开的采用证据是正面的，但仍不等同于清晰看到客户集中度、续约强度、事故历史或正式安全姿态。正确的尽调反应是要证据，而不是假设：当前可用性和事故披露、企业合同条款、认证状态，以及更清楚地区分多少使用仍是探索性、多少已经嵌入生产。
            claimRefs:
              - CR007
              - CR008
              - CR011
              - CR012
              - CR013
