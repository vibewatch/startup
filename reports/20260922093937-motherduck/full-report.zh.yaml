              单元附加包。由此足以看出，客户如何低成本进入、扩展到付费层级，并在使用增长后产生超额用量或附加支出。它没有揭示的是已实现定价、各层级利润率，或仍停留在推广额度上的客户占比。因此，正确的财务解读是：变现机制清楚，但已实现经济性不透明；不是一份干净的订阅披露。
