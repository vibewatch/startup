  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与替代方案
        blocks:
          - type: paragraph
            body: >
              不应把 MotherDuck 看成通用数据仓库的克隆。它自己的定位结合了云数据仓库、每个用户和智能体的专用计算，以及可从本地 DuckDB
              转向云端执行的开发者工作流。因此，实际市场边界包括小型产品、数据和工程团队购买的分析运行时与仓库层，也包括决定查询能否按时送达的相邻栈层：摄取、轻量编排和智能体工具。现状替代仍是大型云数仓和
              Lakehouse，但对许多初创公司来说，真正的替代方案根本不是换供应商，而是电子表格、CSV、事务型 SQL，或 BI 与 ETL
              工具拼成的补丁栈。因此，市场应围绕待完成任务来定义——低运维、快速拿到答案——而不是围绕某个命名的数据库品类。
            claimRefs:
              - CM010
              - CM012
              - CM013
