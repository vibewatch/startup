        blocks:
          - type: paragraph
            body: >-
              公开融资轨迹足够一致，能确认 MotherDuck 确实融到了真钱，但仅凭公开数据还无法搭出完全当前的估值桥。公司自己的公告称，2023 年 Series B 金额为 $52.5M，累计融资为
              $100M；独立追踪机构大体认可 $100M 基础，之后的研究覆盖把总额推高到约 $133M，并给出 2025 年 Series B+ 估计。Tracxn 还报告截至 8 月下旬有 160
