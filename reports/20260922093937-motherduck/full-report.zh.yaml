            body: >-
              最大的财务阻断项不是 MotherDuck 能否吸引资本，而是公开证据是否足以判断公司实际需要多少资本。使用条款赋予公司处理客户和使用数据的广泛权利，保留修改或停止服务的权利，并把责任上限限定为
              $100；因此，合同和法律风险在现金流问题之前就已经进入财务图景。但承销最关键的输入——现金余额、烧钱速度、跑道和债务义务——并未在预取来源包中披露。在这些数字可得之前，最负责的结论是：MotherDuck
              具备可信融资基础和可行变现路径，但仍缺少足以支撑资本充足性判断的披露。
