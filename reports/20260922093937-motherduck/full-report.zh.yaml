      - number: '6.2'
        title: 采用信号与具名证明
        blocks:
          - type: paragraph
            body: >-
              最强的采用信号，是公司自报使用指标和具名客户结果的组合。MotherDuck 称，全面开放发布时已有 2,000 名用户在查询产品，超过 100 名用户提供反馈；duckfooding
              演讲还补充了一个内部工作负载：约 40 个计划任务每天运行约 6,000 次查询。案例页随后给出具体客户故事：AheadComputing、Together AI、GoodShip、Hazel
              等显示，采用正在从评估走向生产或接近生产使用，结果包括更快上手、更短的仪表盘周转时间，以及亚秒级查询。
