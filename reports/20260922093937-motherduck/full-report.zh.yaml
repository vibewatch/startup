  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品界面与客户工作流
        blocks:
          - type: paragraph
            body: >-
              MotherDuck 的公开定位很直接：它是基于 DuckDB 的无服务器分析平台，客户需要更简单的 SQL 分析、直接查询文件，或为数据应用提供后端时，它可以替代云数仓。公开文案里最强的模式不是单一
              SKU，而是一层工作流。分析师获得类似 notebook 的 SQL
              界面，工程师获得能连接本地和远程数据的云服务，团队则获得一个把同一引擎从笔记本电脑带入共享云环境的故事。这让产品容易定义、却不易跑基准：用例宽度清楚，但公开记录没有发布硬性的规模上限、价格区间或性能阈值。
