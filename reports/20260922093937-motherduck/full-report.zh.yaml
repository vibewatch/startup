        title: 信任、治理与成熟度信号
        blocks:
          - type: paragraph
            body: >-
              法律和信任叙事比可靠性叙事更明确。MotherDuck
              的使用条款授权其广泛处理客户数据和使用数据，包括查询、提示和输出；条款还规定，客户未经事先书面同意不得对服务做安全测试。这是托管服务常见姿态，但也意味着，如果工作流涉及敏感数据或定制集成，买方必须仔细读合同。外部成熟度信号正面但仍不完整：围绕
              OHDSI 的社区讨论显示，实践者正在评估把 MotherDuck 用于共享演示和自动化测试；公开融资追踪也表明，公司真实存在且背后有可观资本。仍缺失的是已发布
              SLA、安全认证或基准集，这些才能让尽调团队把产品承诺和已验证的运营可靠性区分开。
            claimRefs:
              - CE007
              - CE008
              - CE009
              - CE012
  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 公开客户细分与工作流契合度
        blocks:
          - type: paragraph
            body: >-
              MotherDuck 的公开客户叙事集中在三个反复出现的细分：把分析嵌入 SaaS 体验的技术前沿产品团队；替换较慢数仓或事务型模式的数据 /
              分析团队；以及把产品用作自助分析层的内部团队。官网和案例页都指向生产应用、面向客户的分析和内部洞察；独立的 codecentric
              文章则解释了为什么这些工作负载看重亚秒级响应、租户隔离和更低运营负担。这个组合让用例变得清晰，但它仍只是公开样本，不是完整客户普查。
            claimRefs:
              - CU001
              - CU002
              - CU005
              - CU006
              - CU015
