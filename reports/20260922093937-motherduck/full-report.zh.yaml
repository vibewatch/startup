      - number: '2.3'
        title: 买方路径与采用约束
        blocks:
          - type: paragraph
            body: >
              最可能的买方，是离分析摩擦最近的人：构建仪表盘、面向客户分析或 AI
              辅助数据工作流的分析工程师、数据工程师或全栈开发者。预算权通常在初创公司的工程或数据负责人手里，而用户往往是一个小团队，想要本地开发连续性、可预测成本，以及从注册到首次查询的短路径。最强的采用驱动力不是原始规模，而是去掉集群容量规划、基础设施维护、本地与云环境切换这些隐性税负。主要约束也同样清楚。大型分布式负载、重治理和成熟
              Lakehouse 生态仍有利于既有平台。随着 MotherDuck 推进智能体化摄取，市场会扩大，但也会继承新的集成负担：买方会判断，组合后的栈是否真的比自己拼接 Fivetran、dbt、BI 和 AI
              智能体层更简单。
