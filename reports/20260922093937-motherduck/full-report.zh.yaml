      - number: '5.2'
        title: 架构、隔离与运营模型
        blocks:
          - type: paragraph
            body: >-
              运营模型是主要差异点。MotherDuck 称，每个人、每个仪表盘和每个智能体会话都会获得自己的隔离 DuckDB
              实例，并且这些隔离实例可以快速拉起；这是公司对共享分析系统中「吵闹邻居」问题的回答。同一批公开材料还描述了混合执行，即查询规划器可以在本地和云端数据之间拆分工作，而不是强制所有内容穿过同一个存储或计算层。这个架构有鲜明取舍，但很轻量：它依赖
              DuckDB 语义、对常见分析文件格式的直接访问，以及一个能协调共享、又不把底层编排细节暴露给用户的服务层。
