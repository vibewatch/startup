    title: 收入模型桥接
    type: flow
    summary: MotherDuck 似乎靠一条递进路径变现：用户先从免费入口和推广额度进入，再升级到付费套餐，之后由超额用量和 AI Units 消耗贡献收入。
    data:
      nodes:
        - id: free-entry
          label: 免费入口
          description: 低摩擦自助访问和试用用量。
        - id: startup-program
          label: 创业公司计划
          description: 面向符合条件创业公司的推广额度和费用减免。
        - id: paid-tiers
          label: 付费套餐
          description: Lite 和 Business 标价套餐。
        - id: usage-overages
          label: 超额用量
          description: 超出基础额度后的额外计算和存储支出。
        - id: ai-units
          label: AI Units
          description: AI 功能单独变现。
        - id: revenue-capture
          label: 收入兑现
          description: 客户扩张时，经常性和按用量计费的变现收入会持续累积。
      edges:
        - from: free-entry
          to: paid-tiers
        - from: startup-program
          to: paid-tiers
        - from: paid-tiers
          to: usage-overages
        - from: paid-tiers
          to: ai-units
        - from: usage-overages
          to: revenue-capture
        - from: ai-units
          to: revenue-capture
    claimRefs:
      - CI002
      - CI003
      - CI005
      - CI006
      - CI007
      - CI014
  - id: FE001
    title: 产品架构图谱
    type: stack
    summary: 公开资料把 MotherDuck 描述成一个分层系统：上层是 notebook 和智能体入口，中层负责混合执行，下层运行隔离的 DuckDB 计算，数据和治理控制包在边缘。
    approximationNotes: 层级顺序来自公开营销文案和合同语言的综合，并非供应商官方架构图。
    data:
      layers:
        - label: 客户端入口
          detail: Notebook UI、SQL 编写和智能体入口
          tone: neutral
          modules:
            - 网页 UI
            - 智能体工作流
          outputs:
            - 查询提交
        - label: 混合执行
          detail: 规划器拆分本地与云端任务
          tone: opportunity
          modules:
            - DuckDB 引擎
            - 查询规划器
          outputs:
            - 优化后的 SQL 执行
        - label: 协作与共享
          detail: 共享目录和组织级访问
          tone: neutral
          modules:
            - 数据目录
            - 共享资产
          outputs:
            - 团队访问
        - label: 隔离 ducklings
          detail: 每个用户和每个仪表盘配独立计算
          tone: positive
          modules:
            - 每会话 DuckDB 实例
          outputs:
            - 并发工作负载
        - label: 存储与文件格式
          detail: Parquet、Iceberg 和 CSV 作为查询目标
          tone: neutral
          modules:
            - Parquet
            - Iceberg
            - CSV
          outputs:
            - 就地分析
        - label: 数据与治理
          detail: 文件、共享、集成和合同控制
          tone: risk
          modules:
            - Parquet
            - Iceberg
            - CSV
            - 第三方平台
          outputs:
            - 托管分析
