      - number: '2.3'
        title: Buyer path and adoption constraints
        blocks:
          - type: paragraph
            body: >
              The likely buyer is the person closest to analytics friction: an analytics engineer, data engineer, or
              full-stack developer building dashboards, customer-facing analytics, or AI-assisted data workflows. Budget
              authority usually sits with the startup’s engineering or data leader, while the user is often a small team
              that wants local-dev continuity, predictable cost, and a short path from sign-up to first query. The
              strongest adoption driver is not raw scale; it is the chance to remove the hidden tax of cluster sizing,
              infrastructure maintenance, and context switching between local and cloud environments. The main
              constraints are equally clear. Large distributed workloads, heavy governance, and a mature lakehouse
              ecosystem still favor incumbent platforms. And as MotherDuck pushes into agentic ingestion, the market
              expands, but it also inherits a new integration burden: buyers will judge whether the combined stack is
              simpler than stitching together Fivetran, dbt, BI, and an AI agent layer themselves.
            claimRefs:
