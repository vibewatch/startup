  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive landscape and substitute classes
        blocks:
          - type: paragraph
            body: >-
              MotherDuck's practical competitive set is broader than direct DuckDB peers. The company itself frames the
              product as a serverless cloud warehouse built on DuckDB, while the official comparison material positions
              SQLite as the embedded transactional alternative and Turso / SQLite Cloud as the cloudified SQLite path.
              That means buyers can compare MotherDuck not only against other managed analytics tools, but also against
              staying on embedded engines, staying on Postgres plus replicas, or letting teams keep a local-first
              workflow and adding cloud sharing only where needed. The strongest takeaway from the public material is
              that MotherDuck is competing on workflow shape as much as on raw query execution.
