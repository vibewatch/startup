      - number: '2.2'
        title: Sizing lenses, not a single TAM
        blocks:
          - type: paragraph
            body: >
              The source set does not support a clean vendor-specific TAM, so the right move is to preserve multiple
              sizing lenses. The narrowest lens is the lean startup warehouse wedge: teams with small-to-mid data
              volumes, a need for rapid iteration, and minimal platform overhead. A second lens is the adjacent agentic
              analytics and runtime market, where MotherDuck is broadening the use case from query serving to
              natural-language pipeline creation and monitoring. A third lens is the enterprise departmental wedge,
              where DuckLake-style object-storage deployments can support selected teams inside larger organizations
              without replacing their core warehouse. Taken together, the evidence suggests a market that expands from
              startup analytics into broader data-app infrastructure, but the public sources here do not isolate a
              trustworthy spend number. That uncertainty should stay visible rather than being hidden behind a single
              aspirational TAM slide.
            claimRefs:
              - CM008
              - CM009
              - CM011
