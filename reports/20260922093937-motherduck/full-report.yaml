    title: Competitive positioning map
    type: quadrant
    summary: >-
      MotherDuck sits in the high-convenience, high-analytics-specialization corner, while DuckDB and cloud SQLite
      alternatives trade off managed workflow depth against simplicity or local control.
    data:
      points:
        - label: MotherDuck
          x: 5
          'y': 5
          tone: positive
          detail: >-
            Hybrid local-cloud execution plus collaboration pushes the product toward the top-right on convenience and
            specialization.
        - label: DuckDB self-build
          x: 4
          'y': 3
          tone: neutral
          detail: Strong analytics engine, but the buyer owns orchestration, sharing, and service ergonomics.
        - label: SQLite / cloud SQLite
          x: 2
          'y': 2
          tone: warning
          detail: Excellent simplicity for transactional or embedded workloads, but weaker for complex analytics.
        - label: Traditional warehouse
          x: 4
          'y': 4
          tone: neutral
          detail: Broad warehouse capability and governance, but a heavier operational and pricing footprint.
        - label: Postgres + replicas
          x: 3
          'y': 2
          tone: warning
          detail: Familiar status quo for many teams, yet not purpose-built for cloud analytics workflows.
        - label: DuckDB + DBCode
          x: 4
          'y': 4
          tone: opportunity
          detail: >-
            An IDE-led workflow can improve developer ergonomics, but it still leaves the buyer with the managed-service
            burden.
