        title: Identity and product position
        blocks:
          - type: paragraph
            body: >-
              MotherDuck presents itself as a cloud data warehouse built on DuckDB, with a strong emphasis on speed,
              isolation, and developer ergonomics. The company’s own materials frame the product around internal BI,
              customer-facing analytics, and agent-native workflows, which positions it closer to a modern analytics
              control plane than a generic warehouse. That positioning matters because it explains both the early
              product story and the company’s current go-to-market posture. Public sources are consistent on the DuckDB
              foundation, while the exact commercial scale of the business remains opaque.
