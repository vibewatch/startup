      - number: '4.3'
        title: Capital adequacy and underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              The biggest financial blocker is not whether MotherDuck can attract capital; it is whether the public
              evidence is sufficient to judge how much capital the company actually needs. The terms of use give the
              company broad rights to process customer and usage data, reserve the right to modify or discontinue the
              service, and cap liability at $100, which makes contract and legal risk part of the financial picture even
              before cash-flow questions. But the crucial inputs for underwriting -- cash balance, burn, runway, and
              debt obligations -- are not disclosed in the prefetched source pack. Until those figures are available,
              the most responsible conclusion is that MotherDuck has a credible funding base and a plausible
              monetization path, but still lacks the disclosure required for a confident capital-adequacy call.
