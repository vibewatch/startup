        title: Revenue model and pricing surfaces
        blocks:
          - type: paragraph
            body: >-
              MotherDuck looks much closer to a consumption-led analytics platform than a classic seat-based SaaS
              business. The official site and launch announcement describe serverless analytics with hybrid local/cloud
