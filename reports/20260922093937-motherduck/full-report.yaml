      - number: '5.2'
        title: Architecture, isolation, and operating model
        blocks:
          - type: paragraph
            body: >-
              The operating model is the main differentiator. MotherDuck says every person, dashboard, and agent session
              gets its own isolated DuckDB instance and that those isolated instances are spun up quickly, which is the
              company’s answer to noisy-neighbor problems in shared analytics systems. The same public materials also
              describe hybrid execution, meaning the planner can split work between local and cloud data instead of
              forcing everything through one storage or compute tier. That architecture is opinionated but lightweight:
              it depends on DuckDB semantics, on direct access to common analytical file formats, and on a service layer
              that can coordinate sharing without exposing the user to the underlying orchestration details.
