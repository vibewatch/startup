  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and customer workflows
        blocks:
          - type: paragraph
            body: >-
              MotherDuck's public positioning is straightforward: it is a serverless analytics platform built on DuckDB
              that is meant to stand in for a cloud warehouse when customers want simpler SQL analytics, direct query
              access to files, or a backend for data apps. The strongest pattern in the public copy is not a single SKU
              but a workflow layer. Analysts get a notebook-like SQL surface, engineers get a cloud service that can
              connect to local and remote data, and teams get a story about taking the same engine from a laptop into a
              shared cloud context. That makes the product easier to frame than to benchmark: the use-case breadth is
              clear, but the public record does not publish hard sizing limits, pricing bands, or performance
              thresholds.
