        title: Traction and funding signals
        blocks:
          - type: paragraph
            body: >-
              The public funding trail is consistent enough to establish that MotherDuck has raised real capital, but
              not enough to produce a fully current valuation bridge from public data alone. The company’s own
              announcement put the 2023 Series B at $52.5M and total capital raised at $100M; independent trackers
              broadly agree on the $100M base and later research coverage pushes the total higher to roughly $133M with
