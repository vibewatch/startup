      - number: '5.3'
        title: Trust, governance, and maturity signals
        blocks:
          - type: paragraph
            body: >-
              The legal and trust story is more explicit than the reliability story. MotherDuck's Terms of Use authorize
              broad processing of customer data and usage data, including queries, prompts, and outputs, and they also
              say customers may not security-test the service without prior written consent. That is a normal
              managed-service posture, but it also means the buyer has to read the contract carefully if the workflow
              involves sensitive data or custom integrations. External maturity signals are positive but still
              incomplete: the community discussion around OHDSI shows practitioners evaluating MotherDuck for shared
              demos and automated tests, and public funding trackers indicate a real company with meaningful capital
              behind it. What remains missing is the kind of published SLA, security certification, or benchmark set
              that would let a diligence team separate product promise from verified operating reliability.
            claimRefs:
