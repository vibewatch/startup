  - id: TV002
    title: Thesis / anti-thesis
    columns:
      - Argument
      - What would change the view
    rows:
      - - >-
          Differentiated product posture: serverless DuckDB, isolated compute, and hybrid local/cloud execution are
          meaningfully sharper than generic warehouse software.
        - A competing product with similar simplicity and better disclosed unit economics would weaken the premium.
      - - Funding marks show investors continue to value the company in the mid-$400M range.
        - A materially lower mark, or no new capital support, would imply weaker conviction.
      - - >-
          MotherDuck is already talking about enterprise support and real service depth, suggesting the platform is
          beyond hobbyist usage.
        - If enterprise support remains anecdotal and no revenue quality is disclosed, the moat looks thinner.
      - - >-
          The legal and contractual surface is normal for a SaaS platform, but still exposes customer-data and liability
          risk.
        - >-
          Stronger enterprise contracting, higher liability coverage, and clearer data controls would reduce the
          downside case.
      - - The startup program shows a low-friction adoption wedge among small teams.
        - A broader enterprise pipeline and more public reference customers would justify a higher multiple.
    notes: >-
      This is a qualitative synthesis table. The rows are not meant to sum to a formal model; they separate the core
      bullish argument from the conditions that would falsify it.
    claimRefs:
      - CV001
      - CV002
      - CV003
      - CV007
      - CV008
      - CV009
      - CV010
      - CV011
  - id: TV003
    title: Bull / base / bear scenario
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - >-
          Enterprise support scales, agent-first usage grows, and the current private mark becomes a floor rather than a
          ceiling.
        - Multiple can expand if the company turns product pull into measurable recurring revenue.
        - Competitive imitation or slower enterprise conversion than expected.
        - Needs current ARR and retention to validate.
      - - Base
        - The company keeps adding users and use cases, but keeps public metrics sparse.
        - The current mid-$400M mark remains roughly in line with private-market sentiment.
        - The valuation can stagnate if the disclosure gap persists.
        - Most consistent with today's public record.
      - - Bear
        - Usage depth proves real, but revenue quality and margin are weaker than the product story implies.
        - Down-round or flat-round risk rises if growth does not translate into better economics.
        - A weak conversion from users to durable revenue.
        - Triggered by poor financial disclosure or weaker funding appetite.
      - - Upside catalyst
        - Fresh disclosed metrics show efficient growth and broadening enterprise reference accounts.
        - Would support a higher price discipline and a more aggressive entry.
        - Still needs proof that the market is willing to pay for the platform.
        - Needs management disclosure or a financing update.
      - - Downside trigger
        - The next diligence pass still cannot confirm ARR, margin, or retention.
        - Price support remains sentiment-driven rather than fundamentals-driven.
        - The market could re-rate the company quickly once harder metrics surface.
        - This is the present state of the public evidence.
    notes: >-
      Scenario probabilities are judgmental and illustrative. They reflect valuation discipline rather than a calibrated
      financial model.
    claimRefs:
      - CV003
      - CV004
      - CV007
      - CV009
      - CV012
