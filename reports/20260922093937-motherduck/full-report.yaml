  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Risk summary
        blocks:
          - type: paragraph
            body: >-
              MotherDuck looks less exposed to classic regulatory blowups than to a more ordinary but still meaningful
              set of control, dependency, and proof risks. Its public terms let the company process customer and usage
              data broadly, change or discontinue service, and disclaim most downstream platform risk. The product story
              is attractive because it combines isolated compute with hybrid local-cloud execution, but that same design
              means reliability, query correctness, and customer trust depend heavily on MotherDuck-managed
              infrastructure and on a transaction-log abstraction most buyers will not inspect directly. The funding and
              user-count disclosures are encouraging, yet the public record still leaves unanswered questions about the
              depth of production adoption, concentration, incidents, and security posture.
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR007
              - CR008
              - CR012
              - CR013
      - number: '7.2'
        title: Legal, regulatory, and contractual exposure
        blocks:
          - type: paragraph
            body: >-
              The reviewed legal surface is straightforward but vendor-favorable. The terms of use give MotherDuck broad
              rights to process customer data and usage data, impose strong customer-side warranties around legal
              compliance, and cap liability at a nominal amount. They also let MotherDuck modify, suspend, or terminate
              the service and place most responsibility for third-party platforms, credentials, and customer permissions
              on the user. That structure is common for SaaS, but it matters more here because the product is itself a
              data-processing layer; if the service is interrupted, the customer may have limited contractual leverage
              and little recourse beyond support or switching costs. For underwriting, the key diligence question is not
              whether the terms exist, but whether enterprise customers have negotiated stronger paper or whether the
              standard contract is the practical norm.
            claimRefs:
              - CR004
              - CR005
              - CR006
          - type: table
            tableRef: TR001
            claimRefs:
              - CR004
              - CR005
              - CR006
              - CR007
      - number: '7.3'
        title: Operational and platform reliability risk
        blocks:
          - type: paragraph
            body: >-
              MotherDuck's architecture reduces some classic warehouse pain, but it also makes operational quality
              harder to observe from the outside. The company emphasizes isolated DuckDB instances per user or agent,
              which should limit noisy-neighbor issues, and it uses a transaction log to manage file-level changes
              rather than mutating parquet in place. That is efficient, but it also means correctness depends on the log
              being applied consistently and on users not confusing raw file contents with the logical table view. The
              platform therefore has a failure mode that looks less like a single catastrophic outage and more like a
              set of subtle correctness, freshness, and state-management issues. Those are the kinds of problems that
              usually show up only after production load and complicated data operations arrive.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR010
          - type: table
            tableRef: TR002
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR009
              - CR010
      - number: '7.4'
        title: Dependency, market, and diligence gaps
        blocks:
          - type: paragraph
            body: >-
              The remaining risk is a mix of dependency and market-size uncertainty. MotherDuck sits on top of DuckDB
              and must keep compatibility, performance, and developer trust aligned with that open-source base. At the
              same time, the company's public positioning favors lightweight, cost-sensitive analytics rather than the
              broadest possible warehouse market, which is good for clarity but can narrow the funnel. The public
              evidence of adoption is positive, but it is still not the same as a clean view of customer concentration,
              renewal strength, incident history, or formal security posture. The right diligence response is to ask for
              proof, not assume it: current uptime and incident disclosures, enterprise contract terms, certification
              status, and a clearer view of how much usage is still exploratory versus embedded in production.
