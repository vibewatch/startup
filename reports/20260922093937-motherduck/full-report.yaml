      - number: '6.3'
        title: Durability, expansion, and unresolved gaps
        blocks:
          - type: paragraph
            body: >-
              Durability is the weakest part of the public record. The visible materials support real deployment and
              some expansion, but they do not disclose NRR, GRR, churn, or a concentration schedule, so the chapter
              cannot separate broad adoption from a few enthusiastic logos. The public criticism is also mixed: a Reddit
              thread questions production readiness, while the company's own terms and customer stories imply that real
              customer workflows involve customer data and third-party integrations. Netting those together, the company
              looks genuinely used, but the stickiness story remains unresolved. That matters because visible demand can
              still sit on top of poor renewal visibility or a concentrated customer base. It is enough to trust the
              usage signal, but not enough to underwrite durable customer economics.
