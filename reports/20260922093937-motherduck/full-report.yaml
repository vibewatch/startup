      - number: '3.3'
        title: Differentiation durability and displacement risk
        blocks:
          - type: paragraph
            body: >-
              MotherDuck's moat appears to rest on convenience and a coherent workflow, not on a unique data engine. The
              strongest risk is commoditization from the bottom: DuckDB can absorb more of the analytic workload itself,
              while cloud SQLite and generic warehouse products can keep improving their managed layers. The strongest
              counterweight is the company's hybrid execution model, which is hard to copy perfectly because it blends
              local and cloud compute, sharing, and user-friendly collaboration. Even so, the public evidence does not
              show an exclusive distribution channel, a hard switching cost moat, or a clear regulatory wedge; the
              product is differentiated, but not obviously insulated.
