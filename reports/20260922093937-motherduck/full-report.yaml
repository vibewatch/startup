  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and substitutes
        blocks:
          - type: paragraph
            body: >
              MotherDuck is not best thought of as a generic warehouse clone. Its own positioning combines a cloud data
              warehouse, dedicated compute per user and agent, and a developer workflow that can move from local DuckDB
              to cloud execution. The practical market boundary therefore includes the analytics runtime and warehouse
              layer bought by small product, data, and engineering teams, plus the adjacent stack layers that determine
              whether queries arrive on time: ingestion, lightweight orchestration, and agent tooling. The status quo
              substitutes are still the large cloud warehouses and lakehouses, but for many startups the real
              alternative is not a new vendor at all; it is spreadsheets, CSVs, transactional SQL, or a patchwork of BI
              and ETL tools. This is why the market should be framed around the job to be done - fast answers with low
              ops - rather than around a single named database category.
            claimRefs:
              - CM010
              - CM012
              - CM013
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
