      - ["Third-party clouds and integrations", "Storage and external platforms", "Medium", "Interoperability or availability failures outside MotherDuck's control", "Medium to High", "Integration validation and contract mapping", "Medium to High", "Obtain dependency inventory and responsibility split"]
