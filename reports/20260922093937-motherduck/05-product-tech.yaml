chapter:
  number: 5
  title: "Product & Technology"
  summary: >-
    MotherDuck presents itself as a DuckDB-based, serverless analytics layer
    for warehouse, lake-query, and data-app workflows, with public materials
    emphasizing hybrid local/cloud execution and per-session isolation. The
    public record also shows a broad but still partly marketing-led integration
    surface, while leaving unresolved details around independently published
    uptime, certification, and benchmark evidence.
sections:
  - id: "product-surface"
    title: "Product surface and customer workflows"
    body: >-
      MotherDuck's public positioning is straightforward: it is a serverless
      analytics platform built on DuckDB that is meant to stand in for a cloud
      warehouse when customers want simpler SQL analytics, direct query access to
      files, or a backend for data apps. The strongest pattern in the public
      copy is not a single SKU but a workflow layer. Analysts get a notebook-like
      SQL surface, engineers get a cloud service that can connect to local and
      remote data, and teams get a story about taking the same engine from a
      laptop into a shared cloud context. That makes the product easier to frame
      than to benchmark: the use-case breadth is clear, but the public record
      does not publish hard sizing limits, pricing bands, or performance
      thresholds.
    claimRefs:
      - "CE001"
      - "CE002"
      - "CE005"
      - "CE006"
    tableRefs:
      - "TE001"
      - "TE002"

  - id: "architecture-and-dependencies"
    title: "Architecture, isolation, and operating model"
    body: >-
      The operating model is the main differentiator. MotherDuck says every
      person, dashboard, and agent session gets its own isolated DuckDB instance
      and that those isolated instances are spun up quickly, which is the
      company’s answer to noisy-neighbor problems in shared analytics systems.
      The same public materials also describe hybrid execution, meaning the
      planner can split work between local and cloud data instead of forcing
      everything through one storage or compute tier. That architecture is
      opinionated but lightweight: it depends on DuckDB semantics, on direct
      access to common analytical file formats, and on a service layer that can
      coordinate sharing without exposing the user to the underlying orchestration
      details.
    claimRefs:
      - "CE003"
      - "CE004"
      - "CE010"
      - "CE011"
    tableRefs:
      - "TE003"
    figureRefs:
      - "FE001"

  - id: "trust-governance-maturity"
    title: "Trust, governance, and maturity signals"
    body: >-
      The legal and trust story is more explicit than the reliability story.
      MotherDuck's Terms of Use authorize broad processing of customer data and
      usage data, including queries, prompts, and outputs, and they also say
      customers may not security-test the service without prior written consent.
      That is a normal managed-service posture, but it also means the buyer has
      to read the contract carefully if the workflow involves sensitive data or
      custom integrations. External maturity signals are positive but still
      incomplete: the community discussion around OHDSI shows practitioners
      evaluating MotherDuck for shared demos and automated tests, and public
      funding trackers indicate a real company with meaningful capital behind it.
      What remains missing is the kind of published SLA, security certification,
      or benchmark set that would let a diligence team separate product promise
      from verified operating reliability.
    claimRefs:
      - "CE007"
      - "CE008"
      - "CE009"
      - "CE012"

