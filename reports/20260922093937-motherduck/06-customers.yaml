schemaVersion: "report-v2"
artifact: customers
slug: motherduck
runDate: 2026-09-22
company:
  name: MotherDuck
chapter:
  number: 6
  title: Customers
  summary: >-
    MotherDuck's public customer evidence centers on production apps,
    customer-facing analytics, and internal analytics workflows, with multiple
    named case studies and a small but real adoption signal from launch and
    dogfooding. The main constraint is opacity: public materials show breadth
    more clearly than retention, concentration, or churn.
sections:
  - id: public-customer-segments
    title: Public customer segments and workflow fit
    body: >-
      MotherDuck's public customer story clusters around three recurring
      segments: tech-forward product teams embedding analytics into SaaS
      experiences, data/analytics teams replacing slower warehouse or
      transactional patterns, and internal teams using the product as a
      self-serve analysis layer. The official home page and case-study page
      both point to production apps, customer-facing analytics, and internal
      insights, while the independent codecentric article explains why those
      workloads value sub-second response, tenant isolation, and lower
      operational overhead. That combination makes the use case legible, but it
      is still a public sample rather than a full customer census.
    claimRefs:
      - CU001
      - CU002
      - CU005
      - CU006
      - CU015
    tableRefs:
      - TU001
    figureRefs:
      - FU001

  - id: adoption-signals
    title: Adoption signals and named proof
    body: >-
      The strongest adoption signals are a mix of company-reported usage
      metrics and named customer outcomes. MotherDuck said it had 2,000 users
      querying the product and more than 100 users providing feedback at
      open-for-all launch, and the duckfooding talk adds an internal workload of
      roughly 6,000 queries a day across 40 scheduled jobs. The case-study page
      then supplies concrete customer stories: AheadComputing, Together AI,
      GoodShip, Hazel, and others show adoption moving from evaluation into
      production or near-production use, with outcomes such as faster
      onboarding, shorter dashboard turnaround, and sub-second queries.
    claimRefs:
      - CU003
      - CU004
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU014
    tableRefs:
      - TU002
      - TU003

  - id: durability-and-gaps
    title: Durability, expansion, and unresolved gaps
    body: >-
      Durability is the weakest part of the public record. The visible materials
      support real deployment and some expansion, but they do not disclose NRR,
      GRR, churn, or a concentration schedule, so the chapter cannot separate
      broad adoption from a few enthusiastic logos. The public criticism is also
      mixed: a Reddit thread questions production readiness, while the company's
      own terms and customer stories imply that real customer workflows involve
      customer data and third-party integrations. Netting those together, the
      company looks genuinely used, but the stickiness story remains unresolved.
      That matters because visible demand can still sit on top of poor renewal
      visibility or a concentrated customer base. It is enough to trust the
      usage signal, but not enough to underwrite durable customer economics.
    claimRefs:
      - CU012
      - CU013
    acknowledgedWarnings: []
tables:
  - id: TU001
    title: Customer segmentation table
    columns:
      - segment
      - buyer / user / payer
      - use case
      - scale signal
      - revenue or strategic value
      - gap
    rows:
      - - Data / analytics teams at tech-forward companies
        - analytics leaders, data engineers, product teams
        - customer-facing analytics, internal BI, and agentic workflows
        - named stories show production and near-production usage
        - helps teams ship analytics features without OLTP overload
        - no public customer census or segment revenue split
      - - Embedded analytics / SaaS teams
        - product and platform teams
        - tenant-isolated dashboards and queries for end customers
        - homepage plus independent commentary align on this pattern
        - improves customer experience while reducing ops burden
        - public retention and expansion metrics are not disclosed
      - - AI / agentic data teams
        - platform, ML, and applied-AI teams
        - remote MCP, hybrid local-cloud querying, and agent workflows
        - case studies and dogfooding show real usage
        - positions MotherDuck for emerging agent-led analytics
        - sample is vendor-heavy and likely incomplete
      - - Internal self-serve BI / dogfooding
        - internal analysts and product ops
        - self-service exploration and scheduled workloads
        - about 6,000 queries daily across 40 jobs internally
        - de-risks product maturity and surfaces edge cases early
        - internal use is not the same as external retention
    notes: >-
      Segment rows are a sampled read of public evidence, not a complete
      customer census. Missing fields reflect public opacity rather than
      absence of any commercial usage.
    claimRefs:
      - CU001
      - CU002
      - CU004
      - CU005
      - CU006
      - CU015

