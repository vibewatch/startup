        - 2026-09-22 access
        - Duckfooding talk
        - medium
        - product is used in a real internal production-like loop
        - whether this is one system or several
      - - AheadComputing onboarding
        - 74% of engineers onboarded in the first weeks
        - public case-study page
        - MotherDuck case studies
        - medium
        - strong team adoption velocity
        - team size and prior baseline
      - - AheadComputing dashboard turnaround
        - 3 months -> 1.5 hours
        - public case-study page
        - MotherDuck case studies
        - medium
        - material workflow acceleration
        - request volume and workload shape
      - - Together AI active user count
        - 128 unique Hex users
        - public case-study page
        - MotherDuck case studies
        - medium
        - multi-team adoption
        - total company headcount and active usage denominator
      - - Together AI concurrency support
        - 40 read-scaling replicas
        - public case-study page
        - MotherDuck case studies
        - medium
        - supported concurrent analytics and agent workloads
        - data volume and concurrency baseline
      - - GoodShip deployment speed
        - analytics agent built in under a week
        - public case-study page
        - MotherDuck case studies
        - medium
        - fast path from idea to deployment
        - whether the deployment was a pilot or production rollout
    notes: >-
      The table mixes launch, internal, and customer-case metrics. Values are
      directional and are not normalized to a common cohort or time window.
    claimRefs:
      - CU003
      - CU004
      - CU007
      - CU008
      - CU009
      - CU010
      - CU011
      - CU014

  - id: TU003
    title: Named customer proof table
    columns:
      - customer
      - segment
      - deployment / use case
      - production vs pilot
      - outcome
      - limitation
    rows:
      - - AheadComputing
        - data / analytics team
        - building a data platform for the agent era
        - public case study says "1 week to production"
        - 74% of engineers onboarded within the first weeks; dashboard requests fell from months to hours
        - public proof is vendor-authored and lacks third-party audit
      - - Together AI
        - AI / platform team
        - scaling a data platform while scaling the company
        - appears production-facing from the case-study framing
        - 128 unique Hex users and 40 read-scaling replicas
        - no public customer-by-customer retention view
      - - GoodShip
        - logistics analytics team
        - analytics agent built on MotherDuck's remote MCP
        - public page frames it as a shipped workflow, not a lab demo
        - built in under a week; sub-second queries where Postgres timed out
        - the page does not give a denominator or full rollout scope
      - - Hazel
        - e-commerce / AI co-worker team
        - hundreds of dbt models on a central MotherDuck warehouse
        - production intent is implied but not quantified
        - strong architecture fit for customer-facing analytics
        - no explicit production date or adoption denominator
    notes: >-
      Sampled from the public case-study page only. The row set is illustrative
      and intentionally omits logos without a concrete named outcome.
    enumerationScope:
      coverage: sample
      basis: Publicly visible MotherDuck case-study and customer-story pages fetched on 2026-09-22.
