company:
  name: MotherDuck
chapter:
  number: 4
  title: Financials
  summary: MotherDuck’s public monetization story is a mix of usage-based compute/storage, paid tiers, AI-unit add-ons, and startup-program promotions layered on top of a mostly self-serve funnel. The public record shows credible funding progression and early usage traction, but it still does not disclose cash on hand, burn, or runway, so underwriting remains constrained by private-financial opacity.
sections:
  - id: revenue-model-and-pricing
    title: Revenue model and pricing surfaces
    body: >-
      MotherDuck looks much closer to a consumption-led analytics platform than a classic seat-based SaaS business. The official site and launch announcement describe serverless analytics with hybrid local/cloud execution, while the pricing and startup-program pages expose the public monetization surfaces: free access, list-price tiers, usage credits, and AI-unit add-ons. That is enough to see how customers can enter cheaply, expand into paid tiers, and then incur overages or add-on spend as usage grows. What it does not reveal is realized pricing, margin by tier, or the share of customers still sitting on promotional credit. For that reason, the right financial read is a clear monetization mechanism with opaque realized economics, not a clean subscription disclosure.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI007
      - CI014
      - CI015
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001
  - id: traction-and-funding-signals
    title: Traction and funding signals
    body: >-
      The public funding trail is consistent enough to establish that MotherDuck has raised real capital, but not enough to produce a fully current valuation bridge from public data alone. The company’s own announcement put the 2023 Series B at $52.5M and total capital raised at $100M; independent trackers broadly agree on the $100M base and later research coverage pushes the total higher to roughly $133M with a 2025 Series B+ estimate. Tracxn also reports 160 employees as of late August, which gives a rough scale proxy, while the launch blog said the product had 2,000 users querying it and feedback from over 100 users. The traction story is therefore real, but the public record still stops short of verified customer-count, revenue, or recurring-revenue disclosure.
    claimRefs:
      - CI001
      - CI008
      - CI009
      - CI010
      - CI013
      - CI014
      - CI015
  - id: capital-adequacy-and-blockers
    title: Capital adequacy and underwriting blockers
    body: >-
      The biggest financial blocker is not whether MotherDuck can attract capital; it is whether the public evidence is sufficient to judge how much capital the company actually needs. The terms of use give the company broad rights to process customer and usage data, reserve the right to modify or discontinue the service, and cap liability at $100, which makes contract and legal risk part of the financial picture even before cash-flow questions. But the crucial inputs for underwriting -- cash balance, burn, runway, and debt obligations -- are not disclosed in the prefetched source pack. Until those figures are available, the most responsible conclusion is that MotherDuck has a credible funding base and a plausible monetization path, but still lacks the disclosure required for a confident capital-adequacy call.
    claimRefs:
      - CI007
      - CI009
      - CI011
      - CI012
      - CI013
    tableRefs:
      - TI003
tables:
  - id: TI001
    title: Revenue streams table
    columns:
      - Stream
      - Mechanism
      - Unit
      - Current value / status
      - Quality
      - Diligence ask
    rows:
      - - Free entry tier
        - Self-serve product access that lowers adoption friction and can convert into later paid usage
        - User / organization
        - Publicly visible
        - Useful top-of-funnel, but not a revenue figure
        - Request free-to-paid conversion and activation rate
      - - Paid compute / storage usage
        - Consumption billing for serverless analytics capacity
        - Compute credits and storage usage
        - List pricing disclosed; realized mix undisclosed
        - Core monetization surface, but margin not public
        - Request realized pricing and tier mix by cohort
      - - AI functions
        - AI-powered SQL / embedding features billed separately in AI Units
        - AI Units
        - Publicly described
        - Upside add-on, but usage intensity unknown
        - Request attach rate and margin by workload type
      - - Startup program
        - Promotional annual commitment with bundled credits and fee waiver
        - Annual commitment / credits
        - Publicly visible promotional offer
        - Likely acquisition tool rather than steady-state ARPU
        - Request net retention after promo expiry
    notes: List pricing and promotional offers are public; realized revenue share, take rates, and margin by stream are not disclosed in the prefetched sources.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI014
  - id: TI002
    title: Pricing / monetization table
    columns:
      - Plan or offer
      - Public price / terms
      - Included value
      - Discount or unknowns
      - Source
    rows:
      - - Free
        - Free to use until billing begins
        - Entry access to the product and product-led usage
        - Duration of the free window and later conversion are not public
        - Official blog announcement
      - - Lite
        - $25 per organization per month
        - Base paid tier with compute / storage credits
        - Realized discounting and annualized revenue not disclosed
        - Sacra research page
      - - Business
        - $100 per organization per month
        - Higher paid tier with larger included usage
        - Realized contract mix not disclosed
        - Sacra research page
      - - Startup program
        - $8,000 annual commitment for $16,000 of value; $13,000 in consumption credits plus $3,000 annual platform fee waived
        - Promotional growth offer for qualifying startups
        - Excludes existing paying customers and larger funded startups
        - Official startup-program page
    notes: These are list prices and promotional terms, not realized revenue; the company does not disclose contract-level take rates or customer-specific discounting in the prefetched pack.
    claimRefs:
      - CI002
      - CI003
      - CI004
      - CI005
      - CI006
      - CI014
  - id: TI003
    title: Unit economics table
    columns:
      - Metric
      - Value
      - Confidence
      - Why it matters
      - Diligence ask
    rows:
      - - Gross margin
        - null
        - low
        - Needed to judge whether serverless execution and storage economics scale profitably
        - Request product-family gross margin bridge
      - - CAC / payback
        - null
        - low
        - Determines whether self-serve and startup incentives convert efficiently
        - Request cohort CAC and payback by acquisition channel
      - - Cash on hand
        - null
        - low
        - Core capital-adequacy input
        - Request current cash balance and monthly roll-forward
      - - Burn rate
        - null
        - low
        - Shows how quickly capital is consumed while scaling
        - Request monthly burn bridge and headcount plan
      - - Runway
        - null
        - low
        - Drives next-round dependency and financing risk
        - Request runway under base / downside cases
      - - Net revenue retention
        - null
        - low
        - Reveals expansion versus churn quality
        - Request cohort NRR by plan and segment
    notes: Nulls mean the prefetched evidence does not disclose the metric; they are diligence asks, not zero values.
    claimRefs:
      - CI008
      - CI009
      - CI010
      - CI011
      - CI012
      - CI013
