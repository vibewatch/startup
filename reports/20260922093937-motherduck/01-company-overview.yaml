schemaVersion: "report-v2"
artifact: "company-overview"
slug: "motherduck"
runDate: "2026-09-22"
company:
  name: "MotherDuck"
chapter:
  number: 1
  title: "Company Overview"
  summary: "MotherDuck is a Seattle-based DuckDB cloud analytics company that has raised $100M+ and built a product around fast, isolated, serverless SQL for analysts, engineers, and agent workflows. Public materials show strong launch momentum and investor backing, but revenue, current customer scale, and governance detail remain only partially disclosed."
sections:
  - id: "identity-and-product"
    title: "Identity and product position"
    body: "MotherDuck presents itself as a cloud data warehouse built on DuckDB, with a strong emphasis on speed, isolation, and developer ergonomics. The company’s own materials frame the product around internal BI, customer-facing analytics, and agent-native workflows, which positions it closer to a modern analytics control plane than a generic warehouse. That positioning matters because it explains both the early product story and the company’s current go-to-market posture. Public sources are consistent on the DuckDB foundation, while the exact commercial scale of the business remains opaque."
    claimRefs: ["CO001", "CO002", "CO003", "CO004", "CO005", "CO006", "CO007", "CO016"]
    tableRefs: ["TO001"]

  - id: "leadership-and-governance"
    title: "Leadership, founders, and governance"
    body: "The public leadership picture centers on CEO and co-founder Jordan Tigani, whose BigQuery background gives MotherDuck direct category credibility. A third-party profile also describes Antony Courtney and Boaz Leskes as founding engineers with deep infrastructure pedigrees, which reinforces the team’s database experience even though the public governance picture is incomplete. No reviewed source exposed a board roster or voting control detail, so the company appears founder-led but not fully governance-transparent from the outside."
    claimRefs: ["CO008", "CO009", "CO010"]
    tableRefs: ["TO002"]

  - id: "capitalization-and-investors"
    title: "Funding history and investor base"
    body: "MotherDuck’s financing story is unusually clean for a private startup: an initial raise in late 2022, a 2023 launch with $47.5M already disclosed, and then a Series B that pushed total capital raised to $100M. The company’s own blog says the Series B added Felicis as lead and kept a broad syndicate of prior backers in place, which is a useful signal for diligence because it suggests continuing investor confidence rather than a forced reset. Reported valuation data is still third-party sourced, so it should be treated as directional rather than definitive."
    claimRefs: ["CO011", "CO012", "CO013", "CO014", "CO015"]
    tableRefs: ["TO003"]

  - id: "milestones-and-watchouts"
    title: "Milestones, traction, and watch-outs"
    body: "The milestone arc is clear: a 2023 launch, public traction claims measured in thousands of users, later product maturation, and then expansion signals such as a dedicated EU region and updated commercial terms. That arc supports a narrative of continued execution, but the public record also surfaces a cautionary note: independent commentary highlights pricing pressure and a narrower competitive position against larger incumbents. Taken together, the company looks real and active, yet still dependent on a narrow niche and a few public leadership signals."
    claimRefs: ["CO003", "CO004", "CO005", "CO006", "CO015", "CO016"]
    figureRefs: ["FO001"]
