evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: Formal board roster, voting control, and current governance rights
    whyItMatters: The public record does not show who controls the company or how governance is structured.
    diligencePath: Request a current governance memo or investor deck with board seats and control rights.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: operating-metrics
    missingEvidence: Current revenue/run-rate, current customer count, and exact headcount
    whyItMatters: The public sources reviewed give launch-era or proxy metrics but not current operating scale.
    diligencePath: Obtain a management KPI pack or investor update dated to runDate.
    relatedQuestionRefs:
      - QO001
      - QO004
      - QO008
  - type: enumeration-incomplete
    severity: minor
    topic: investors
    missingEvidence: Current cap table and ownership percentages for the named investor syndicate
    whyItMatters: The investor map is limited to public naming rights and does not show control or economics.
    diligencePath: Review the current cap table or a management update with ownership splits.
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing
    missingEvidence: >-
      A public market report or dataset that isolates spend for lean serverless warehouses versus traditional warehouses
      and lakehouses.
    whyItMatters: Without a segmented spend source, any exact TAM or SAM for MotherDuck would be more narrative than measurable.
    diligencePath: >-
      Build a bottom-up model from startup analytics-team counts, warehouse spend benchmarks, and usage pricing, then
      compare it with at least one analyst estimate.
    relatedQuestionRefs:
      - QM008
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: pricing
    missingEvidence: >-
      A public or customer-supplied example of realized enterprise pricing, discounting, or renewal terms for
      MotherDuck.
    whyItMatters: Public list pricing and startup credits are not enough to judge real switching economics or margin pressure.
    diligencePath: Collect a signed contract, sales quote, or anonymized invoice from a current customer or partner.
    relatedQuestionRefs:
      - QP003
  - type: private-evidence-only
    severity: blocking
    topic: runway
    missingEvidence: Current cash balance, burn rate, and runway from management accounts or a financing memo
    whyItMatters: >-
      Without those inputs, capital adequacy and next-round dependency cannot be underwritten from public evidence
      alone.
    diligencePath: Request a management data room pack with a cash roll-forward, monthly burn bridge, and debt schedule.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: trust-and-reliability
    missingEvidence: Public SLA, uptime, security certification, or benchmark documentation for MotherDuck's production service.
    whyItMatters: >-
      The product story is compelling, but diligence still needs independent proof of reliability, controls, and
      performance at scale.
    diligencePath: Check for a status page, SOC 2 / ISO certification listing, or a published benchmark or SLA document.
    relatedQuestionRefs:
      - QE008
  - type: missing-source
    severity: material
    topic: retention-and-concentration
    missingEvidence: Public NRR, GRR, churn cohorts, or top-customer concentration disclosure.
    whyItMatters: >-
      Without those data, the chapter cannot tell whether adoption is broad and durable or concentrated in a handful of
      logos.
    diligencePath: Request a retention dashboard, renewal cohort view, or customer concentration schedule from management.
    relatedQuestionRefs:
      - QU008
    relatedTableRefs:
      - TU003
  - type: missing-source
    severity: material
    topic: incidents-security
    missingEvidence: A current uptime history, incident log, or security certification matrix for MotherDuck.
    whyItMatters: >-
      Without that record, reliability and security exposure remain based on inference rather than verified operating
      history.
    diligencePath: Request a trust center, SOC2 or equivalent certification status, and any public incident or postmortem archive.
    relatedQuestionRefs:
      - QR006
  - type: access-blocked
    severity: material
    topic: community-skepticism
    missingEvidence: The underlying Reddit discussion and any substantive comments on MotherDuck adoption risk.
    whyItMatters: >-
      A skeptical community thread could surface failure modes or buyer objections that do not appear in company
      materials.
    diligencePath: >-
