  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: post-launch mobility, not launch economics'
        blocks:
          - type: paragraph
            body: >-
              Impulse Space should be analyzed against post-launch orbital logistics rather than against the whole
              launch market or the even broader "space economy." Its public product stack is explicit about that
              boundary. Mira is marketed as a high-thrust spacecraft for hosting, deployment, and maneuver across LEO,
              MEO, GEO, cislunar space, and beyond, while Helios is a kick stage for high-energy transfers to MEO, GTO,
              GEO, translunar injection, and Earth escape. The rideshare page then turns those capabilities into access
              products: Mira host-and-deploy missions for payloads that need custom orbital placement, Helios shared and
              dedicated missions for higher-energy insertion, and a Caravan program for annual GEO rideshare beginning
              in 2027. That means the included spend is not rocket manufacturing or launch services themselves, but the
              layer after launch: moving payloads from parking orbit to operational orbit, hosting payloads after
              insertion, supporting rendezvous-and-proximity operations, and supplying propulsion or subsystem
              capability to third-party orbital platforms.


              That boundary matters because the substitutes and economics change once launch is excluded. For a GEO
              operator, the substitute is scarce heavy-lift direct insertion or a slower electric-propulsion orbit
              raise. For a rideshare constellation customer, the substitute is accepting the launch provider's drop-off
              orbit or buying a different OTV/OMV service. For a station developer, the substitute may be to integrate
              propulsion internally or source a subsystem vendor rather than a free-flying tug. For lunar buyers, the
              relevant path is even more indirect: NASA is already buying lunar delivery services through CLPS, but the
              prime contract holder is the lander operator, not necessarily the transfer-layer supplier. The chapter
              therefore treats Impulse as playing in orbital transfer, hosted payload mobility, station
              propulsion/logistics subsystems, and future lunar transfer adjacencies—while excluding launch revenue and
              downstream satellite-service revenue that Impulse does not itself sell.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
