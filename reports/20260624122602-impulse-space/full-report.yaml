            title: The right market frame is "post-launch mobility"
            body: >-
              Impulse looks much more investable when framed as the mobility layer after launch—bridging rideshare
              drop-off, high-energy orbit raising, hosted payload operations, and orbital subsystems—than when
              benchmarked against rockets or the total space economy.
            calloutType: insight
