      - argument
      - what would change the view
    rows:
      - - thesis
        - >-
          Impulse has already assembled a rare combination of mission heritage, named customers, and billion-dollar
          financing support for an in-space mobility platform.
        - If partner announcements unwind or the mission cadence stalls, this proof set weakens quickly.
      - - thesis
        - Commercial anchors such as SES and Astranis suggest Helios demand is not purely theoretical.
        - If those anchor programs defer, cancel, or fail to convert into repeat business, demand breadth is overstated.
      - - thesis
        - >-
          Government programs such as STRATFI and the SSC/DIU award show that national-security buyers view mobility
          after launch as strategically relevant.
        - >-
          If follow-on tasking does not materialize, investors may have mistaken pilot interest for durable budget line
          support.
      - - anti-thesis
        - The public record still does not disclose revenue, gross margin, burn, or the exact Series D preference stack.
        - A data room showing healthy revenue conversion and clean terms would materially improve conviction.
      - - anti-thesis
        - The fetched public set corroborates the $500M raise but not the exact reported $4.26B post-money figure.
        - >-
          Verification of the actual round price and price per share from signed financing documents would allow real
          return math.
      - - anti-thesis
        - >-
          Capital intensity is already high, so a future down-round or structured insider financing could impair
          new-money economics even if the company keeps executing technically.
        - >-
          A strong on-time Helios ramp plus transparent financial disclosure would reduce that financing risk
          materially.
