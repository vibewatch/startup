  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model, Pricing Surfaces, and Public Traction Gap
        blocks:
          - type: paragraph
            body: >-
              Public evidence is sufficient to identify what Impulse sells, but not how much it charges. The revenue
              model has four visible surfaces. First, Helios is marketed as a dedicated high-energy transport service
              for payloads that need to move from LEO to MEO, GEO, cislunar, or escape trajectories quickly. Second,
              Mira is sold as a hosting, deployment, and maneuvering spacecraft for payload operators that need orbital
              mobility or proximity operations. Third, Caravan and the GEO rideshare program aggregate smaller payloads
              into shared higher-energy missions. Fourth, government work adds a separate contract revenue stream
              through SBIR, STRATFI, and mission-support awards. What is missing is a public price card: no reviewed
              source disclosed per-mission tariffs, minimum contract value, payload-slot pricing, or standardized list
              versus realized pricing.


              Instead, the company sells economics through mission outcomes. SES emphasizes quicker service activation
              and lower satellite mass by reaching GEO within hours rather than months. Astranis emphasizes avoiding
              long electric-propulsion transfer risk. Space Network Services emphasizes access to GEO at a fraction of
              dedicated-launch cost with manifest flexibility. Those are real monetization signals, but they are
              value-proposition signals, not revenue-recognition disclosures. Investors can map the product catalog and
              the buyer pain point; they still cannot benchmark ACV, services mix, discounting discipline, or whether
              revenue is primarily milestone-based, mission-based, or recurring by contracted fleet service.
            claimRefs:
