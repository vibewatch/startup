      - number: '2.4'
        title: 'Adoption drivers and constraints: more launches help, but network economics still have to clear'
        blocks:
          - type: paragraph
            body: >-
              The bullish case starts with volume and policy. NASA reports that spacecraft launched in 2025 rose nearly
              60% year over year to 4,577, with heavier SmallSat classes also rising. That matters because more
              rideshare and dedicated-launch activity expands the pool of missions that may need last-mile orbital
              placement after drop-off. NASA also records that rideshare has become a popular model and highlights that
              OTVs are becoming more common for deployment and hosted operations. On the buyer side, Mordor's market
              lens shows government and military customers still account for almost half of current spend, while
              commercial operators are projected to grow faster. That profile matches Impulse's public mix: commercial
              GEO buyers, station developers, and commercial rideshare payloads sit on top of a near-term government
              anchor in tactically responsive space and future depot-style logistics. The Space Force strengthens that
              driver further by openly planning for refueling, space tugs, and eventually an on-orbit logistics
              architecture.


              The constraints are just as important. NASA makes clear that rideshare users inherit schedule and orbit
              coupling, must secure their own licensing, and face "do no harm" restrictions on transmissions,
              deployments, and hazardous materials. Dedicated launch solves some of that precision problem but at higher
              cost and lower cadence. SSC's own challenge statement shows that operational logistics still need
              validated fuel handling, refueling interfaces, long-duration storage, and accurate propellant accounting
              before depot-style networks can work at scale. Mordor adds the startup-economics constraint: an
              orbital-servicing craft may cost roughly $50 million to $200 million before supporting infrastructure and
              insurance are layered in. Taken together, the result is a market with real demand pull but a
              still-emerging operating system: more launches and stronger defense doctrine make Impulse more relevant,
              yet interoperability, capital intensity, and mission-design friction can still keep actual adoption below
              headline TAMs.
            claimRefs:
