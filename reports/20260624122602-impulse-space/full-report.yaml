      - number: '7.2'
        title: Launch-provider, mission-reliability, and manufacturing scale-up risk remain acute
        blocks:
          - type: paragraph
            body: >-
              The single most important operating risk is that Impulse’s commercial promise still depends on a narrow
              launch and hardware chain. Publicly disclosed near-term missions are heavily Falcon 9-dependent: Impulse
              says it signed for three Falcon 9 launches beginning in 2026, its first orbital mission used SpaceX
              Transporter-9, Astranis’ 2027 direct-inject GEO mission also starts on Falcon 9, and SES’s first announced
              mission starts with a medium-lift launch to LEO before Helios takes over. That is a strategically rational
              architecture, but it means Falcon 9 availability, rideshare timing, or any launch-provider grounding can
              propagate directly into Helios customer delivery dates.


              Helios itself is the second gating risk. The company markets more than five tons from LEO to GEO in less
              than a day using a single Deneb engine, but public evidence still points to an inaugural-flight phase
              rather than a recurring on-orbit service phase. That makes reliability and qualification risk real, not
              theoretical. Mira has stronger public heritage: Impulse labels it flight-proven, cites LEO Express 1 and
              LEO Express 2 collision-avoidance evidence, and Starfish’s Remora mission demonstrates close-proximity
              operations on Mira hardware. Still, hosted payloads, refueling, and RPO are all complexity multipliers
              because they compress schedule and safety tolerance.


              Manufacturing risk is the third leg. Impulse says much of the vehicle is made in house and it now has
              Mojave propulsion test capacity plus a Colorado hardware facility, but vertical integration can shift
              rather than remove bottlenecks. If Deneb, Saiph, avionics, or tankage remain effectively single-source
              inside the company, schedule slips will show up as test or production delays long before they appear as
              customer churn.
