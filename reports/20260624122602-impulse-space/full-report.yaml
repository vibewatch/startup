      - number: '4.2'
        title: GTM Motion and Sales-Efficiency Proxies
        blocks:
          - type: paragraph
            body: >-
              The public GTM picture is stronger than the public pricing picture. By June 2025, Impulse said it had
              signed more than 30 contracts totaling nearly $200 million, and by June 2026 it said customer contracts
              had moved into the hundreds of millions. The named demand set spans defense, commercial GEO operators,
              hosted payload customers, and civil work. That breadth matters because it implies the company is not
              relying on a single experimental demo program: it is trying to sell dedicated Helios transport, GEO
              rideshare, hosted missions, and government mission responsiveness into different procurement channels.


              The sales motion also looks unmistakably high-touch. SES, Astranis, and Space Network Services are all
              negotiated mission agreements rather than self-serve platform customers. U.S. Space Force and SpaceWERX
              awards require program capture, contracting, and milestone management. The careers page adds another
              proxy: current roles span business development, government affairs, finance, legal, manufacturing, and
              mission operations, which is not what a commodity launch-broker model would look like. What remains absent
              are the metrics investors usually use to test efficiency. No reviewed source disclosed CAC, payback,
              sales-cycle length, channel split, average initial contract value, or expansion cadence. Publicly, GTM
              quality is proven by logos and contract count, not by conversion math.
