  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: standard
    summary: >-
      Public comp dispersion is extreme, which is why missing revenue disclosure matters more than small changes in
      spreadsheet assumptions.
    data:
      items:
        - label: Rocket Lab sales multiple
          value: 81
          unit: x TTM revenue
          detail: Premium ceiling comp supported by real scale and backlog.
          tone: positive
        - label: Planet sales multiple
          value: 30.3
          unit: x TTM revenue
          detail: Sentiment-rich software/data premium, not a direct operating analog.
          tone: warning
        - label: Momentus sales multiple
          value: 33
          unit: x TTM revenue
          detail: Looks high mathematically only because the revenue base is tiny.
          tone: negative
        - label: Redwire sales multiple
          value: 6.5
          unit: x TTM revenue
          detail: Most grounded public hardware-services floor comp in the set.
          tone: neutral
    approximationNotes: >-
      Multiples are simple market-cap-to-TTM-revenue bridges from fetched June 2026 market-data pages; they are intended
      as boundary markers, not full enterprise-value adjustments.
    claimRefs:
      - CV030
      - CV033
      - CV036
      - CV039
      - CV042
  - id: FV003
    title: Valuation / return range
    type: range
    layout: wide
    summary: >-
      The range is wide because the biggest missing variable is not market appetite but whether Impulse can show
      disclosed revenue and clean financing terms against its mission momentum.
    data:
      items:
        - label: Bear case
          low: 800
          mid: 1400
          high: 2000
          displayValue: $0.8B–$2.0B
          detail: Triggered by Helios slippage, anchor-program weakness, or financing repair terms.
          tone: negative
        - label: Base case
          low: 2500
          mid: 3200
          high: 4000
          displayValue: $2.5B–$4.0B
          detail: On-time Helios start, durable customer signal, but still only partial disclosure.
          tone: warning
        - label: Bull case
          low: 5000
          mid: 6000
          high: 7000
          displayValue: $5.0B–$7.0B
          detail: On-time ramp, repeat commercial demand, and diligence that reveals strong revenue conversion.
          tone: positive
    approximationNotes: >-
      Ranges are author estimates anchored on fetched public contracts, product milestones, public comp dispersion, and
      disclosure limits; they are not management guidance and intentionally avoid treating the exact prompt-referenced
      post-money as verified fact.
    claimRefs:
      - CV053
      - CV054
      - CV055
      - CV061
      - CV062
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: standard
    summary: >-
      Impulse scores well on mission proof and customer signal, but weakly on economics visibility and valuation
      verifiability.
    data:
      items:
        - label: Mission proof
          value: 8
          note: Three missions flown, plus partner-validated RPO evidence from Starfish.
        - label: Customer proof
          value: 8
          note: SES, Astranis, Vast, Anduril, and other named relationships show real demand signal.
        - label: Government validation
          value: 8
          note: STRATFI plus SSC/DIU contract demonstrate official demand for post-launch mobility.
        - label: Economics visibility
          value: 2
          note: No public revenue, gross margin, cash burn, or customer-concentration disclosure.
        - label: Capital intensity
          value: 4
          note: >-
            More than $1.0B of disclosed private capital before proven Helios commercial ramp suggests a heavy funding
            requirement.
        - label: Valuation support quality
          value: 3
          note: Public evidence supports the raise and momentum, but not a precise investable round price.
    approximationNotes: >-
      Scores are author judgments on a 1–10 scale using only the fetched public evidence set; 10 means best-in-class
      observable proof.
    claimRefs:
      - CV008
      - CV011
      - CV019
      - CV020
      - CV024
      - CV025
      - CV043
      - CV049
      - CV050
      - CV051
      - CV052
