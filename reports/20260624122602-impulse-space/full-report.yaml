      - number: '3.4'
        title: Durability, switching costs, and where Impulse is actually differentiated
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a real but still vulnerable position for Impulse. The best differentiation signal
              is breadth across multiple mission layers rather than one killer feature. Partner announcements show Mira
              acting as an autonomy-demonstration host for Starfish, a refueling host for Orbit Fab, a non-Earth-imaging
              host for HEO, and a future GEO-delivery enabler for Infinite Orbits. That is broader than what most peers
              publicly show. But breadth is not the same as lock-in. Buyers can still substitute direct insertion,
              onboard propulsion, slower orbit-raising, or subsystem integration into their own platforms. Public
              pricing remains mostly opaque, so there is little evidence that customers are locked by economics rather
              than by mission fit and schedule. The moat picture is therefore mixed. D-Orbit appears to have the best
              disclosed cadence. Starfish looks strongest in autonomy-first servicing. Orbit Fab is most transparent on
              future fuel economics. Astroscale and Northrop own more incumbent servicing credibility. Impulse’s edge is
              speed and flexibility across several architectures, especially where high thrust and fast maneuvering
              matter. The risk is that, without proprietary interface control or disclosed long-term contracts, the
              company still operates in a category where adjacent specialists can enter the transport layer and vehicle
              operators can be commoditized by standards, depots, or prime-contractor bundles.
