  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: 'Landscape boundary: direct tug peers, servicing incumbents, and status-quo substitutes'
        blocks:
          - type: paragraph
            body: >-
              Impulse should not be benchmarked against one undifferentiated “space logistics” basket. The retained
              evidence breaks the field into at least five layers. First are direct post-launch mobility peers that sell
              orbit-change or hosted-payload capacity on their own vehicles: D-Orbit and Momentus are the clearest
              public analogs, with Starfish adjacent when missions require autonomous servicing rather than only
              deployment. Second are GEO life-extension and servicing specialists such as Infinite Orbits, Astroscale,
              and Northrop SpaceLogistics. Third are infrastructure players such as Orbit Fab that can become
              complements today and bargaining-power centers tomorrow if refueling standards become common. Fourth are
              adjacent feature providers such as HEO and ThinkOrbital that can be bundled into servicing architectures
              without yet being standalone tug vendors. Fifth is the status quo: direct insertion, onboard electric
              propulsion, slower orbit-raising, or building propulsion and servicing functions into a prime contractor’s
              own spacecraft. That taxonomy matters because Impulse’s strongest direct overlap is still the tug layer,
              while the densest long-term crowding sits around GEO servicing, inspection, and refueling. Buyers can
              still mix and match these layers rather than lock into one vertically integrated network, which keeps
              multi-homing realistic and weakens any claim that the category is already winner-take-most.
            claimRefs:
              - CP033
              - CP034
              - CP038
              - CP040
              - CP044
