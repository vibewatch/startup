      - number: '4.3'
        title: Cost Structure and Capital Intensity
        blocks:
          - type: paragraph
            body: >-
              Impulse does not look like a light-asset software company. Official materials repeatedly stress vertical
              integration: the company says it designs, builds, and tests the majority of its vehicles in-house, and its
              funding updates point to in-house propulsion, avionics, and manufacturing as a source of schedule control.
              That choice likely improves delivery reliability, but it also implies heavier fixed costs than a brokered
              launch or software-only business. Public evidence for those fixed costs is concrete. The 2024 Series B
              release described a 60,000-square-foot Redondo Beach headquarters plus Mojave test facilities. In March
              2026 the company said it added a 20,000-square-foot Colorado manufacturing site with CNC and
              valve-production capability. The Falcon 9 launch announcement added another clue: the inaugural Helios
              mission alone requires up to 14 tons of cryogenic propellant and dedicated Florida integration.


              Hiring data reinforces the same conclusion. The company’s careers page showed 152 open roles on the run
              date, while the Series D announcement said headcount more than doubled over the prior year and that more
              than 200 roles were open or planned. That is what a scale-up capital structure looks like: facilities,
              tooling, integration, propulsion hardware, manufacturing labor, and mission operations all consume cash
              before any public proof of gross margin appears. Public sources allow a clear map of cost buckets, but not
              a margin model.
