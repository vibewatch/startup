            body: >-
              Named customer proof is strongest where the evidence shows an exact payload, mission, and operational
              milestone. On LEO Express-1, Mira deployed TrustPoint’s 3U CubeSat. On LEO Express-2, Mira deployed
              FOSSA’s TAT-0 satellite, inserted SatRev’s Bluebon CubeSat for RIDE!’s Deep Blue Mission, hosted HEO’s
