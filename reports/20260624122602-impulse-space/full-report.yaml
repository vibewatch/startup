            title: Helios is the company’s largest value driver and largest execution risk
            body: >-
              The funding story assumes Helios can graduate from a strong concept into a reliable high-energy service.
              Yet public materials moved the first-flight target from 2026 to 2027, and LEO Express 3 disclosed a real
              mission anomaly on Mira. If Helios slips further, commercial GEO demand and government responsiveness use
              cases could both take longer to monetize than the current valuation implies.
