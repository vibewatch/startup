      - number: '1.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Rare combination of flight heritage and capital access
            body: >-
              Impulse has an unusual chapter-one profile for a space infrastructure startup: three flown Mira missions,
              anchor commercial and government counterparties, and more than $1 billion of disclosed capital by June
              2026. That combination gives it more real operating proof than many orbital-transfer peers that still rely
              primarily on concept art, slideware, or single-mission plans.
