      - number: '5.5'
        title: Trust, reliability, compliance, and key dependencies
        blocks:
          - type: paragraph
            body: >-
              The trust story is currently a blend of strong engineering signals and unresolved diligence items. On the
              positive side, Impulse discloses single-fault tolerance on Mira, responsible collision-avoidance
              positioning, graveyard-orbit disposal for the GEO RPO mission, and a national-security configuration that
              claims Type 1 cryptography and CNSSP-12 alignment. Government traction through VADR and TacRS missions
              suggests buyers view the company as serious enough for operational experiments. But investors should
              separate public claims from public proof. There is no third-party evidence in the reviewed set for cyber
              accreditation scope, no public integrated-test data for Deneb beyond design disclosures, and no public
              supplier map for cryogenic hardware, arrays, or tanks. The LEO Express 3 propellant loss is the most
              concrete reliability datapoint and shows that even with an otherwise recoverable mission, commissioning
              anomalies can materially reduce capability. Combined with dependence on launch partners such as SpaceX and
              Terran R, that makes Impulse a credible but still execution-sensitive product company rather than a fully
              de-risked infrastructure utility.
