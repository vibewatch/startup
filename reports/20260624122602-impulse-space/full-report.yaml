      - number: '8.4'
        title: 'Diligence asks and exact thesis-break triggers: what must be true before new money is sensible'
        blocks:
          - type: paragraph
            body: >-
              The path from interesting company to investable price runs through a small set of non-negotiable diligence
              items. Management needs to show current recognized revenue, gross margin, monthly cash burn, and the
              bridge from announced contract value to backlog and revenue conversion. The company also needs to show the
              exact Series D preference stack and any shareholder protections that could reshape exit outcomes for a new
              investor. Without that information, even a strong operational story remains impossible to underwrite with
              discipline. The thesis-break triggers should therefore be exact and monitorable rather than generic. If
              Helios has not completed its first commercial high-energy mission by mid-2028, the near-term platform
              thesis has failed on schedule. If no additional commercial Helios customer appears before the next
              financing event, demand breadth is still too narrow. If the next financing is a down-round or needs
              ratchets or pay-to-play terms, the public market equivalent of the thesis has already broken. And if
              management still will not disclose revenue, gross margin, and burn during the next financing or secondary
              process, the investment remains un-underwritable regardless of technical progress.
            claimRefs:
              - CV043
              - CV044
              - CV048
              - CV049
              - CV050
              - CV051
              - CV052
              - CV056
              - CV057
              - CV058
