      - number: '6.3'
        title: Government Customers and Demand Conversion
        blocks:
          - type: paragraph
            body: >-
              Government customer traction is real, but the quality of proof varies materially by program. The cleanest
              public evidence is Space Systems Command’s VICTUS SURGO and VICTUS SALO award: Impulse and SpaceNews both
              describe a $34.5 million contract supporting two 2026 responsive-space missions, one of which pairs Helios
              and Mira while the other uses a future SpaceX rideshare to LEO. That is stronger proof than HALO, VADR, or
              BALISTA because it is tied to named missions and planned launch timing rather than just pool eligibility.


              By contrast, HALO puts Impulse into a vendor pool for future Space Development Agency prototype orders,
              NASA’s VADR adds Impulse to a provider pool through February 2027, and BALISTA lets NRO evaluate
              technologies of interest. Those are useful doors into future revenue, but they should not be conflated
              with deployed customer utilization. The broader defense market is also still forming. SSC’s 2026
              orbital-logistics challenge explicitly seeks orbital transfer vehicles, depots, refueling, and inspection
              concepts, while independent coverage notes the Space Force is still working through force-design questions
              and has not yet built a fully scaled budget line around orbital logistics. The conclusion is positive but
              qualified: government demand is validating the product category, yet much of today’s public traction
              remains pre-program-of-record and therefore less durable than a multi-mission commercial customer.
