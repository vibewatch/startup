  - id: FV001
    title: Recommendation logic
    type: flow
    layout: wide
    summary: >-
      The current investment call flows from a strong proof-of-demand and proof-of-mission story colliding with an
      incomplete economic disclosure set.
    data:
      nodes:
        - id: funding
          label: $500M Series D / >$1B capital
          detail: Investor demand and financing capacity are clearly established.
          tone: positive
        - id: mission
          label: Three flown missions
          detail: Mira has real flight history and partner-backed RPO evidence.
          tone: positive
        - id: customers
          label: Named anchors
          detail: SES, Astranis, Vast, Anduril, and Starfish create real demand signal.
          tone: positive
        - id: helios
          label: 2027 Helios ramp
          detail: Schedule is the main value unlock for higher-energy transport economics.
          tone: warning
        - id: econ-gap
          label: No public revenue / margin / burn
          detail: The public record still lacks the economic data needed to validate price.
          tone: negative
        - id: round-gap
          label: Exact post-money unverified
          detail: Fetched public sources corroborate the round size but not the precise prompt-referenced post-money.
          tone: warning
        - id: decision
          label: Research-more
          detail: Track aggressively, but require a data room before underwriting new money.
          tone: neutral
      edges:
        - from: funding
          to: decision
        - from: mission
          to: decision
        - from: customers
          to: decision
        - from: helios
          to: decision
        - from: econ-gap
          to: decision
        - from: round-gap
          to: decision
    approximationNotes: null
    claimRefs:
