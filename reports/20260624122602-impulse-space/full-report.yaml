      - number: '7.4'
        title: People concentration and explicit kill criteria should govern diligence
        blocks:
          - type: paragraph
            body: >-
              Impulse’s people risk is not merely generic founder dependence. The company explicitly markets around Tom
              Mueller’s propulsion reputation, and its public bench remains compact: Mueller, Eric Romo, and a handful
              of senior functional leaders. That can be a strength early in a company’s life, but it becomes a scaling
              risk when the same small group must simultaneously recruit, qualify new propulsion hardware, expand
              manufacturing, close government and commercial programs, and convert mission demonstrations into a
              repeatable service business. TechCrunch’s report that the Series D supports as many as 200 hires
              reinforces that the organization is still in an intense buildout phase rather than steady-state execution.


              For investors, the right frame is kill criteria, not generic caution. First, Helios must actually fly on
              time and prove the value proposition that customers cite: faster and cheaper access to GEO than the
              heavy-lift-or-electric-propulsion alternatives. Second, payload approval, export-control, and insurance
              workflows must be shown in concrete mission files, not just framework pages. Third, the public pipeline
              must broaden beyond SES, Astranis, and government prototypes; otherwise the company may remain a bespoke
              mission integrator instead of a scaled mobility platform. Fourth, management must prove that manufacturing
              growth and hiring are translating into cadence rather than simply into higher burn.


              The public record does not show burn, supplier mix, litigation posture, or contract economics in enough
              depth to close those questions. That means the prudent posture is not to reject the company’s technical
              promise, but to require proof on schedule, approvals, recurring demand, and organizational depth before
              assuming the current narrative compounds cleanly into durable economics.
