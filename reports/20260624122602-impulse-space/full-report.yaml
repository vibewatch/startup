      - number: '7.3'
        title: Customer, partner, and capital concentration tie upside to a narrow visible pipeline
        blocks:
          - type: paragraph
            body: >-
              The visible commercial pipeline is real, but narrow. SES and Astranis are the two clearest public GEO
              anchor customers, each with announced 2027 missions and mission logic explicitly tied to rapid LEO-to-GEO
              transfer. Orbit Fab adds a technically interesting refueling demonstration, but it is still a
              demonstration. On the government side, the company has the $34.5 million Space Force TacRS award, a $60
              million STRATFI, and an NRO BALISTA contract. Those programs validate relevance, yet they also show how
              much of the disclosed backlog sits inside government-sponsored or defense-adjacent use cases rather than
              scaled recurring commercial service.


              The disconfirming evidence is important here. SpaceNews’ March 2026 reporting argues that commercial
              procurement models do not automatically produce broad business opportunities, and quotes Impulse
              leadership saying some high-performance military space vehicles have little or no commercial demand. That
              is not a thesis killer on its own, but it does challenge the assumption that every government mission
              automatically de-risks the broader platform. It may only de-risk a specialized subset of the product line.


              Capital intensity amplifies this concentration. SpaceNews and Payload reported that Impulse has now raised
              more than $1 billion cumulatively, and TechCrunch says the new money funds up to 200 hires plus more
              build-and-test capacity. That is a lot of fuel, but it also implies substantial fixed-cost ambition before
              recurring mission cadence is proven in public. If Falcon/Helios timing slips, or if SES and Astranis do
              not convert into repeatable demand, the company could still face a classic space-startup problem: large
              capital raised, high technical credibility, but a thinner-than-expected recurring commercial revenue base.
