      - number: '2.5'
        title: What remains unresolved for diligence
        blocks:
          - type: paragraph
            body: >-
              The central diligence issue is not whether Impulse addresses a live market. It clearly does. The
              unresolved issue is how much of that market converts into repeatable, disclosed revenue on a timeframe
              that matters for underwriting. None of the reviewed public sources disclose standard pricing, utilization
              assumptions, or backlog by vehicle for Mira or Helios, and none publish a bottoms-up SAM/SOM by orbit or
              customer segment. That leaves the commercial case dependent on directional evidence—product breadth,
              reference customers, defense contracts, and analyst TAMs—rather than on a public bridge from market size
              to booked revenue.


              The second unresolved issue is interoperability. Defense and analyst sources are explicit that depots,
              refueling, and reusable OTV networks are attractive, but public evidence still does not show shared
              interfaces or broad multi-provider operating standards. Lunar demand is also only partially convertible
              today: CLPS proves a real NASA buyer, but it does not yet prove how much of that spend accrues to
              transfer-layer providers rather than to lander primes. For diligence purposes, the correct conclusion is
              therefore constrained but constructive: Impulse is pointed at several credible orbital-logistics demand
              pools, especially defense mobility and higher-energy commercial transfer, but public data still do not
              support a clean public SOM or a mature network-economics model.
            claimRefs:
              - CM010
              - CM014
              - CM027
              - CM028
              - CM041
              - CM042
