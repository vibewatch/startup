      - number: '3.2'
        title: 'Direct transport peers: D-Orbit has cadence, Momentus has public stress, and Starfish has autonomy'
        blocks:
          - type: paragraph
            body: >-
              Among the companies with visible flight products, D-Orbit is the most operationally mature private
              smallsat OTV peer in the retained pack. Its site publicly discloses 22 orbital transportation missions, 79
              hosted payloads, and 141 satellites deployed, and its March 2026 Wayfinder mission alone carried four
              satellites and two hosted-payload demonstrations. Momentus is the most directly comparable listed rival in
              last-mile delivery and hosted payload services, but the public financial picture is weak: the 2025 10-K
              showed only $1.11 million of revenue, $12.8 million of year-end cash, a going-concern discussion, and 35
              employees as of March 2026, followed by a June 2026 $25 million equity raise. Starfish is different again.
              It is less of a generic tug and more of an autonomy-first servicing startup: Otter is framed as an
              electric-propulsion servicing vehicle, and the Remora mission with Impulse validated autonomous RPO
              software in orbit. Exotrail belongs in the same landscape but, from the reviewed public material, looks
              more like a mobility and electric-propulsion platform company than a disclosed repeated-tug operator with
              comparable cadence. For Impulse, the lesson is that the “direct competitor” bucket is small but
              heterogeneous: one peer wins on cadence, one remains financially fragile, and one emphasizes software-led
              servicing rather than high-thrust transfer speed.
