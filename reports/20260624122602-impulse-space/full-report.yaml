      - number: '8.2'
        title: 'Financing and operating proof: the company has earned attention, but disclosure still lags capital intake'
        blocks:
          - type: paragraph
            body: >-
              The financing history is unusually strong for a still-private in-space mobility company. Official company
              announcements disclose a path from a $20 million seed round to a $10 million extension, a $45 million
              Series A, a $150 million Series B, a $300 million Series C, and then the $500 million Series D. That gets
              to at least $1.025 billion of announced private capital before considering non-dilutive or hybrid award
              programs. If the disclosed $60 million STRATFI award is included in the broader financing context, the
              supportable public total rises above $1.08 billion, but that should not be conflated with straight equity
              capital because the award includes government, matching, and private components. Just as importantly, the
              operating evidence is not fabricated by PR alone. Impulse says it has flown three missions and has
              hundreds of millions of dollars in customer contracts, while external coverage and partner releases
              corroborate specific agreements across SES, Vast, Anduril, Starfish, and Astranis. That is enough to
              support a view that demand exists. It is not enough to support a clean valuation multiple, because the
              company still does not disclose how much of those contracts are recognized as revenue, what the margin
              structure looks like, or how quickly the ramp consumes cash.
