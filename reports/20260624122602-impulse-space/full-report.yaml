  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: 'Recommendation: real proof of demand, but public evidence still cannot underwrite the price'
        blocks:
          - type: paragraph
            body: >-
              Impulse is no longer a pure concept company. By June 2026 it had announced a $500 million Series D, more
              than $1 billion of cumulative capital, three flown missions, multiple named commercial customers,
              national-security partnerships, and a roadmap that extends from LEO maneuvering into GEO transfer. That
              combination matters because the company has already crossed the threshold from inspirational founder story
              into a business with visible customer pull. The investment problem is not whether there is signal; it is
              whether the public record supports the round price. On that question, the answer is still no. The fetched
              primary and mainstream sources corroborate the raise size and strategic momentum, but they do not disclose
              recognized revenue, gross margin, monthly burn, the conversion of signed contracts into revenue, or the
              exact Series D preference stack. Those missing inputs are the ones that determine whether a premium
              private mark is justified or merely tolerated. As a result, the appropriate stance is research-more, not
              because Impulse lacks technical or customer proof, but because public evidence proves bookings and
              missions far better than economics and shareholder outcomes.
