- id: TV004
  title: Comparable valuation table
  enumerationScope:
    coverage: partial
    basis: This table covers the most decision-relevant public or quasi-public reference points available in fetched June 2026 evidence. No listed company is a clean one-for-one match for Impulse’s business mix, so the set intentionally combines ceiling, floor, premium, and downside stress analogs.
  columns:
  - comparable
  - metric
  - multiple / valuation / status
  - relevance
  - limitation
  rows:
  - - Rocket Lab
    - Market cap / TTM revenue / backlog
    - ~81x sales; $55.06B market cap; $679.58M TTM revenue; $2.22B backlog
    - Premium ceiling comp for a vertically integrated space platform with real revenue and backlog.
    - Far larger scale, public liquidity, and broader business mix than Impulse.
  - - Redwire
    - Market cap / TTM revenue / Q1 margins
    - ~6.5x sales; $2.42B market cap; $370.96M TTM revenue; 27% gross margin
    - Useful hardware-services floor comp for capital-intensive space infrastructure.
    - Different acquisition history and less direct transfer-platform exposure than Impulse.
  - - Planet Labs
    - Market cap / TTM revenue / remaining performance obligations
    - ~30.3x sales; $10.17B market cap; $335.61M TTM revenue; $816M RPO
    - Shows how strongly public markets can value space companies when software/data narratives are strong.
    - Earth-observation data company, not a transfer-vehicle or in-space mobility operator.
  - - Momentus
    - Market cap / TTM revenue / Q1 revenue
    - ~33x sales; $133.45M market cap; $4.00M TTM revenue; $3.2M Q1 revenue
    - Stress comp showing that mobility narratives can still produce tiny revenues and financing dependence.
    - Too small and distressed to serve as a pricing anchor; more useful as a downside warning than as a fair-value benchmark.
  - - SpaceX (context only)
    - Revenue / valuation narrative
    - Analysts described its IPO framing as vision-driven despite ~$18.7B 2025 revenue and large losses
    - Useful context for how even elite space narratives can outrun normal multiples when TAM stories dominate.
    - Private megacap with a radically different business scope; contextual only, not a direct comp.
  notes: The comparable set is directional. It bounds valuation logic but cannot validate a premium private price without Impulse revenue and term-sheet disclosure.
