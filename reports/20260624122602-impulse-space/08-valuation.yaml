- id: section-comparables
  title: 'Comparable and scenario framing: the right conclusion is a range, not false precision'
  body: 'There is no clean public comparable for Impulse because no listed company combines orbital transfer, high-energy kick-stage transport, and this exact mix of commercial and defense partner demand. The comp exercise therefore has to be used as a bounding exercise rather than a pricing formula. Rocket Lab is the premium ceiling reference because it shows how far investors will stretch for a vertically integrated space platform with real revenue and backlog. Redwire is the more grounded hardware-and-services floor because it is public, capital-intensive, and much closer to conventional aerospace economics. Planet is not an operating analog, but it remains useful as evidence that public markets sometimes pay high sales multiples for space companies when software and data narratives are strong. Momentus is the downside stress case because it shows how little protection a nominally interesting mobility thesis has when revenue stays tiny and capital dependence persists. The consequence
    is straightforward: public comp dispersion is so wide that it cannot validate a 2026 private price without Impulse disclosing the underlying revenue base. That is why the chapter uses bull, base, and bear valuation ranges and refuses to convert the reported June 2026 mark into a deterministic return model from public evidence alone.'
