callouts:
- calloutType: recommendation
  title: Recommendation stays at research-more until economics catch up with narrative strength
  body: Impulse has already earned a place on an active watchlist because the mission proof and customer proof are substantially better than most space startups at comparable age. But the company has not yet earned price-insensitive underwriting from public evidence. Treat the 2026 Series D as proof of investor appetite, not proof of fair value.
  claimRefs:
  - CV001
  - CV011
  - CV044
  - CV049
  - CV050
  - CV052
- calloutType: risk
  title: 'Critical unknown: the exact Series D stack and the revenue base beneath it'
  body: The central diligence risk is not technological imagination; it is shareholder economics. Without the term sheet, cap table, revenue bridge, margin profile, and burn rate, a reported premium private valuation can be directionally interesting and still completely unusable for new-money underwriting.
  claimRefs:
  - CV010
  - CV043
  - CV044
  - CV060
  - CV061
  - CV062
- calloutType: insight
  title: Helios timing is the cleanest single variable in the whole chapter
  body: Many diligence debates here are fuzzy, but the Helios timetable is not. If commercial high-energy missions happen on time, the company’s narrative becomes much easier to defend. If they slip meaningfully, financing leverage and valuation credibility both deteriorate at once.
