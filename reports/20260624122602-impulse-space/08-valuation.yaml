company:
  name: Impulse Space
chapter:
  number: 8
  title: Valuation
  summary: Impulse Space’s public evidence base is strong on financing momentum, mission proof, and customer validation, but weak on the inputs that actually underwrite a June 2026 entry price. Fetched sources corroborate the $500 million Series D and more than $1 billion of cumulative capital, yet do not independently verify the exact reported $4.26 billion post-money figure or disclose revenue, gross margin, burn, or preference terms, so the supportable call is research-more with medium confidence, high risk, and an unknown valuation stance.
sections:
- id: section-recommendation
  title: 'Recommendation: real proof of demand, but public evidence still cannot underwrite the price'
  body: Impulse is no longer a pure concept company. By June 2026 it had announced a $500 million Series D, more than $1 billion of cumulative capital, three flown missions, multiple named commercial customers, national-security partnerships, and a roadmap that extends from LEO maneuvering into GEO transfer. That combination matters because the company has already crossed the threshold from inspirational founder story into a business with visible customer pull. The investment problem is not whether there is signal; it is whether the public record supports the round price. On that question, the answer is still no. The fetched primary and mainstream sources corroborate the raise size and strategic momentum, but they do not disclose recognized revenue, gross margin, monthly burn, the conversion of signed contracts into revenue, or the exact Series D preference stack. Those missing inputs are the ones that determine whether a premium private mark is justified or merely tolerated. As a result,
    the appropriate stance is research-more, not because Impulse lacks technical or customer proof, but because public evidence proves bookings and missions far better than economics and shareholder outcomes.
  claimRefs:
