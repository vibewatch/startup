- id: TV003
  title: Bull / base / bear scenario table
  columns:
  - scenario
  - key assumptions
  - valuation / return logic
  - key risks
  - probability signal
  rows:
  - - Bull
    - Helios flies in 2027, SES and Astranis convert into repeat missions, government tasking expands, and diligence shows strong bookings-to-revenue conversion with acceptable gross margins.
    - $5.0B–$7.0B valuation range is defensible if disclosure reveals real revenue leverage and customer breadth widens before the next financing.
    - Requires simultaneous execution on schedule, conversion, and disclosure; a miss on any one leg compresses the upside.
    - low-medium
  - - Base
    - Helios enters service broadly on time, partner programs remain live, and demand stays real, but public disclosure remains partial and revenue conversion is only moderate.
    - $2.5B–$4.0B range is plausible if the company keeps momentum but does not yet prove public-company-style economics.
    - This is the flat-to-middling-outcome risk zone for a premium 2026 private entry.
    - medium
  - - Bear
    - Helios slips materially, one or more anchor programs defer, and the next financing must repair the cap table or reset valuation.
    - $0.8B–$2.0B range captures what happens when demand exists but timing, margins, and financing structure turn against the story.
    - Down-round risk, schedule slippage, or missing disclosure can re-rate the company quickly.
    - medium
  notes: Scenario ranges are valuation constructs, not company guidance. They intentionally avoid false precision around the exact reported June 2026 post-money figure.
