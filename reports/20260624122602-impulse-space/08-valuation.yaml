  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: series-d-post-money-and-preferences
    missingEvidence: Exact Series D post-money valuation, price per share, liquidation preferences, anti-dilution terms, and any ratchets or pay-to-play provisions.
    whyItMatters: These terms determine whether the reported 2026 round price is actually investable for a new investor or only flattering on paper.
    diligencePath: Request the Series D term sheet, stock purchase agreement, and current cap table from management or lead counsel.
    relatedQuestionRefs:
    - QV002
    - QV028
  - type: private-evidence-only
    severity: material
    topic: recognized-revenue-and-burn
    missingEvidence: Current recognized revenue, gross margin, monthly cash burn, and current net cash position.
    whyItMatters: Without these metrics, no conventional EV/revenue, runway, or dilution analysis can be defended from public evidence.
    diligencePath: Request the latest board deck, management accounts, and cash forecast from the CFO.
    relatedQuestionRefs:
    - QV029
  - type: private-evidence-only
    severity: material
    topic: bookings-to-revenue-bridge
    missingEvidence: A bridge from announced contract value and partner agreements to firm backlog, task-order funding, and recognized revenue by quarter.
    whyItMatters: Bookings and mission announcements can support momentum but they do not prove cash conversion, margin, or repeatability.
    diligencePath: Request bookings, backlog, revenue-recognition, and customer-concentration schedules for the last eight quarters.
    relatedQuestionRefs:
    - QV030
  - type: enumeration-incomplete
    severity: minor
    topic: valuation-comparables
    missingEvidence: A clean disclosed public comp for private in-space mobility that combines orbital transfer, high-energy kick-stage economics, and partner-backed defense demand.
    whyItMatters: The comparable table necessarily mixes ceiling, floor, and stress comps because no single listed company matches Impulse’s business mix.
    diligencePath: Supplement public comps with private secondary marks, lead-investor memos, and any 2026 tender or 409A materials.
    relatedQuestionRefs:
    - QV014
    - QV016
    relatedTableRefs:
    - TV004
