- id: TV005
  title: Thesis-break and kill triggers table
  columns:
  - trigger
  - threshold
  - transmission to thesis
  - action implication
  rows:
  - - Helios commercial schedule break
    - No completed commercial high-energy mission by 2028-06-30.
    - The near-term orbital-mobility platform thesis fails on timing, and premium private pricing loses its core catalyst.
    - Pause new money and rebuild the case only from actual revenue evidence, not roadmap narratives.
  - - Demand breadth break
    - No additional disclosed commercial Helios customer beyond SES and Astranis before the next financing event.
    - Customer demand remains too narrow to justify platform-style scarcity pricing.
    - Treat the company as a bespoke-project story, not a scaled mobility platform.
  - - Financing-terms break
    - Next financing is a down-round or uses ratchets, pay-to-play, or other structure to repair prior pricing.
    - Valuation support has already failed in the private market even if technical execution continues.
    - Avoid new money until the waterfall and governance implications are fully modeled.
  - - Disclosure break
    - Management still will not disclose revenue, gross margin, and net cash burn in the next financing or secondary process.
    - The company remains un-underwritable on economics regardless of missions or press momentum.
    - Maintain research-only status and do not translate any private mark into expected returns.
  - - Anchor-program break
    - SES, Astranis, or a comparable Helios customer defers, cancels, or meaningfully shrinks a flagship mission before Helios ramps.
    - Commercial proof shifts from platform adoption to isolated pilots.
    - Re-cut bull/base assumptions immediately and assume weaker bargaining power in the next raise.
  notes: These triggers are designed to be monitorable from specific operating, financing, and disclosure events rather than vague sentiment shifts.
  claimRefs:
  - CV056
  - CV057
  - CV058
  - CV059
- id: TV006
  title: Final diligence asks table
  columns:
  - topic
  - missing evidence
  - why it matters
  - owner or diligence path
  rows:
  - - Series D term sheet
    - Exact post-money, price per share, liquidation stack, anti-dilution protections, and any ratchets.
    - A premium headline valuation can still be a poor new-money entry if the stack or protections are unfavorable.
    - Management, lead investor, or financing counsel data room.
  - - Revenue and margin quality
    - Current recognized revenue, gross margin by product line, and customer concentration.
    - These are the minimum inputs required to test any private round mark against public comps.
    - CFO package and latest board materials.
  - - Bookings-to-revenue bridge
    - Contract value by customer, funded versus unfunded portions, cancellation rights, and revenue-recognition timing.
    - Public announcements prove momentum, but only conversion data proves economics.
    - Commercial operations review plus contract schedule.
  - - Burn and runway
    - Monthly cash burn, capex needs for Helios ramp, and cash balance after Series D close.
    - Capital intensity determines dilution risk even if the company keeps hitting milestones.
    - Treasury model and monthly cash-flow statement.
  - - Helios mission readiness
    - Manufacturing cadence, test completion, launch integration schedule, and customer-readiness gates for the first commercial missions.
    - Schedule is the single biggest valuation unlock and the cleanest thesis-break trigger.
    - Program review with engineering, operations, and launch-partner interfaces.
  notes: These asks are the minimum set needed to turn a strong public narrative into an investable price-sensitive underwriting file.
