    - Technical and demand proof are real; valuation support is incomplete.
  - - Risk rating
    - high
    - Helios schedule, contract conversion, and disclosure quality each sit on the critical path.
  - - Valuation stance
    - unknown
    - Fetched public sources do not independently verify the exact June 2026 post-money or disclose revenue against which to test it.
  - - Hold horizon
    - 3–5 years
    - Commercial Helios ramp is 2027 onward, so any underwriting must assume a multiyear execution window.
  - - Price discipline
    - No blind acceptance of reported 2026 mark
    - Require revenue, gross margin, burn, and cap-table disclosure before translating round price into expected returns.
  notes: This summary is price-sensitive rather than company-quality-sensitive; it reflects what the public record can support today.
