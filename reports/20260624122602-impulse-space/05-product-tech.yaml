    {
      "id": "mira-architecture",
      "title": "Mira architecture and demonstrated maneuvering stack",
      "body": "Mira is the company's proven vehicle and the clearest evidence that the technical team can design, launch, operate, and iterate spacecraft quickly. Public materials describe a chemically propelled vehicle with eight Saiph thrusters, cold-gas attitude-control thrusters, in-house reaction wheels, and radios sized for hosted payload operations rather than bare transfer. The baseline vehicle already supports meaningful payload mass and fine-pointing needs, while the upgraded GEO-oriented version adds radiation-tolerant avionics, deployable and gimbaled arrays, more delta-v, and software-defined reconfiguration on orbit. The strongest technical proof is not the brochure; it is the flight record. LEO Express 2 showed repeated burns, hosted payload operations, and the Remora autonomous rendezvous mission. LEO Express 3 added payload activity and Helios-avionics heritage, but also exposed a star-tracker commissioning problem that forced an alternate attitude-control mode and consumed most of the nitrous budget. That mix of demonstrated agility and visible anomaly handling makes Mira credible, but not yet routine, for higher-energy missions.",
