    {
      "id": "manufacturing-and-developer-signal",
      "title": "Manufacturing, integration, and developer-signal proxy",
      "body": "Because Impulse has no public software repository or developer platform, the best developer-signal proxy is the hiring and facility surface. That proxy is still useful. Public careers pages show a large open-role footprint across software, propulsion, autonomy, avionics, quality, mission management, supply chain, and assembly/test. The Boulder expansion adds more specificity by showing where GNC, valve machining, Deneb pump work, and full-stack testbeds sit inside the organization. This matters because the product promise depends on vertical integration across hardware, flight software, and mission ops: Mira and Helios are not standalone buses, but tightly coupled systems that need propulsion, GNC, avionics, and payload integration to work together on compressed timelines. The same evidence also reveals concentrated execution risk. Manufacturing depth is becoming a moat, but it is also a dependency: if valve production, GNC test capacity, or launch integration slips, the whole product roadmap can slip with it because Impulse owns so much of the stack itself.",
      "claimRefs": [
        "CE003",
