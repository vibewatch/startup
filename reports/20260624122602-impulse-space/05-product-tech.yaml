    {
      "id": "helios-expansion",
      "title": "Helios, GEO access, and service-envelope expansion",
      "body": "Helios is the vehicle that turns Impulse from a LEO maneuvering specialist into a higher-orbit logistics platform. The proposition is simple: use a medium-lift launcher for cadence and cost, then ignite a large chemical kick stage to finish the transfer in hours instead of spending six to nine months on electric orbit raising or paying for scarce heavy-lift direct insertion. Public specifications show a LOX-methane Deneb engine, restart capability, and multi-configuration mission packaging, with enough payload mass to appeal to telecom, SDA, and scientific operators. The SES agreement is the clearest commercial validation because it turns the schedule-compression pitch into a named 2027 mission with a four-ton-class payload and direct LEO-to-GEO transfer. GEO rideshare, Exolaunch-enabled sales, and Mars-adjacent messaging with Relativity broaden the narrative, but they also underscore that Helios still has to convert promising architecture into recurring flight operations. The gap between early 2024 first-flight targets and 2026 material that now points to 2027 is the key roadmap caution.",
