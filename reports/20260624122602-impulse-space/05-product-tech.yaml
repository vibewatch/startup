  "chapter": {
    "number": 5,
    "title": "Product & Technology",
    "summary": "Impulse Space sells post-launch mobility rather than a single spacecraft: Mira handles last-mile hosting, deployment, and responsive maneuvering, while Helios aims to compress LEO-to-high-energy transfers from months to hours. The product story is technically credible because Mira has real flight heritage and partner integrations, but Helios still carries launch-cadence, Deneb qualification, and upgraded-Mira reliability risk as the company stretches from LEO demos into GEO and Mars-adjacent missions."
  },
  "sections": [
    {
      "id": "product-scope",
      "title": "Product scope in customer-workflow terms",
      "body": "Impulse Space positions itself as infrastructure that starts after a launch provider has delivered a payload to an initial orbit. In customer terms, the workflow is: choose a lower-cost or higher-cadence launch, ride to LEO, use Helios for rapid transport to MEO, GEO, or farther destinations, and then use Mira for the last-mile tasks that matter on orbit: deployment, hosted operations, repositioning, or rendezvous and proximity operations. That workflow is already visible in customer examples. Mira has hosted non-Earth-imaging payloads, deployed CubeSats, and supported autonomous rendezvous software; SES has signed up for a dedicated Helios mission to shorten time to GEO; and NASA selected Impulse as a VADR provider for science-oriented launch opportunities. The product stack therefore spans commercial, civil, and defense use cases, but its revenue logic still depends on proving that customers will pay for schedule compression, maneuverability, and hosted operations as separate services rather than as bundled launch capacity.",
