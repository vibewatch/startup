companyProfile:
  summary: >-
    Impulse Space is a Redondo Beach orbital-mobility company founded in 2021 by former SpaceX propulsion leader Tom Mueller. The company sells post-launch transportation services through its smaller Mira vehicle and larger Helios high-energy transfer stage, aiming to move commercial, civil, and defense payloads between orbits after launch rather than sell launch itself. Public evidence shows real flight heritage through three Mira missions, growing government and commercial demand, and repeated backing from top-tier venture investors, but the company remains private and under-discloses core financial conversion metrics.
