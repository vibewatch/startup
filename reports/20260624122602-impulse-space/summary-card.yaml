  topStrengths:
    - >-
      Real in-orbit execution proof via three Mira missions and multiple named customer outcomes, which is unusual among
      orbital-transfer startups.
    - >-
      Founder-market fit is exceptional, with Tom Mueller's SpaceX propulsion background and a deep current leadership
      bench across propulsion, manufacturing, autonomy, and government affairs.
    - >-
      Commercial and government demand is visible through SES, Astranis, Vast, Starfish, Space Force VICTUS work, and
      more than $1 billion of cumulative capital backing.
    - >-
      The business model addresses a real post-launch mobility pain point as rideshare launches continue pushing
      payloads into non-final orbits.
  topRisks:
    - >-
      Public sources do not disclose recognized revenue, gross margin, cash burn, runway, or preference-stack details,
      so the economics behind the valuation cannot be underwritten.
    - >-
      Helios remains pre-revenue and schedule-sensitive; public materials moved the first-flight expectation from 2026
      to 2027.
    - >-
      Customer concentration and launch-channel concentration appear material because SpaceX is the only publicly
      documented flown launch path and several flagship programs remain forward-booked rather than delivered.
    - >-
      Mission execution risk is real: LEO Express 3 completed customer operations but suffered a star-tracker issue that
      prevented main-thruster burns.
  unresolvedGaps:
    - Exact recognized revenue, gross margin, bookings-to-revenue conversion, and cash burn remain undisclosed.
    - >-
      The exact Series D post-money valuation, share price, liquidation preferences, and any ratchets are not confirmed
      by primary public evidence.
    - Customer concentration, renewal behavior, and top-account exposure are still not publicly quantified.
    - Helios first commercial service timing and post-2027 mission readiness remain critical diligence items.
