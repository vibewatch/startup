summary:
  headline: >-
    Impulse Space has unusually strong public proof for a private orbital-logistics startup—three flown Mira missions,
    credible commercial and government backlog, and founder-market fit—but opaque revenue, burn, and preference terms
    plus Helios execution risk make research-more the disciplined call.
