company:
  name: Impulse Space
chapter:
  number: 7
  title: Risks
  summary: Impulse Space’s highest residual risks are concentrated in Falcon 9 and inaugural-Helios launch dependence, mission-approval and insurance burden across FAA/export/debris regimes, and a still-narrow publicly visible customer pipeline anchored by a handful of GEO and defense missions. Public evidence supports strong technical ambition and early mission proof, but the thesis remains vulnerable to schedule slip, regulatory friction, and failure to convert prototype-rich demand into recurring commercial cadence.
sections:
- id: regulatory-legal-and-debris-risk
  title: Regulatory, legal, export, and debris rules can delay every mission
  body: >-
    Impulse does not face a single binary license the way a launch company does; instead it sits inside a multi-agency chain that can still delay or block missions. The FAA says Commercial Space Transportation authorizes launch and reentry operations, site operations, and safety element approvals, while FAA payload review under 14 CFR 450.43 requires that a payload owner or launch applicant obtain all required licenses, authorizations, and permits and demonstrate that the mission does not jeopardize public safety, property, national security, foreign policy interests, or international obligations. FAA and the underlying regulation also say that aspects regulated by the FCC or Department of Commerce sit outside the FAA determination, which means Impulse missions can inherit dependency on communications, export, and payload-specific clearances that are not visible in public mission marketing.


    Financial responsibility is a second regulatory drag. FAA guidance and 14 CFR 440.9 make clear that licensed operators must carry insurance or escrow sized to maximum probable loss, and that real losses can exceed the modeled estimate. That matters because Impulse is building a business around high-value customer payloads, GEO transfer, hosted payloads, refueling, and RPO-adjacent missions that can expand consequence severity even if mission frequency is still low. Environmental review is another gating layer: the FAA states that NEPA review can require an EA or EIS before federal decisions are made.


    Space-debris and safety obligations are the most under-disclosed mission-specific risk. NASA’s debris-mitigation materials and NASA-STD-8719.14 emphasize debris prevention, collision avoidance, debris assessment, and postmission disposal. Mira’s maneuverability helps, but public pages do not show Impulse’s specific disposal plans, conjunction procedures, or hosted-payload safety cases. That is why regulatory risk is not “check the box”; it is an execution-time dependency that can slow schedule, raise cost, or narrow addressable customer classes.
