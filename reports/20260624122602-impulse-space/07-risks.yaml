  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: launch-liability
    missingEvidence: Mission-specific maximum probable loss determinations, insurance limits, and contractual indemnity caps for Falcon 9, Helios, and customer payload stacks.
    whyItMatters: Public framework pages establish that insurance is required, but not the actual retained downside or margin burden for Impulse missions.
    diligencePath: Request FAA MPL determinations, broker quotes, launch-services indemnity schedules, and any customer risk-sharing matrices.
    relatedQuestionRefs:
    - QR019
    - QR032
    relatedTableRefs:
    - TR001
    - TR005
  - type: missing-source
    severity: material
    topic: supplier-concentration
    missingEvidence: A long-lead component map for engines, avionics, valves, tanks, methane and oxygen operations, and dual-source coverage for critical subsystems.
    whyItMatters: Vertical integration reduces some dependence but does not reveal whether Deneb, Saiph, avionics, or propellant-support items still have single-source choke points.
    diligencePath: Obtain approved-vendor lists, long-lead bill of materials, inventory coverage, and any alternate-source qualification plans.
    relatedQuestionRefs:
    - QR006
    - QR032
    relatedTableRefs:
    - TR002
    - TR003
  - type: missing-source
    severity: material
    topic: litigation-ip
    missingEvidence: A docket-level litigation memo, patent-family map, and any threatened or settled IP disputes involving propulsion, RPO, or customer contracts.
    whyItMatters: Public marketing and press pages do not establish whether unfiled disputes, patent challenges, or indemnity obligations could impair execution.
    diligencePath: Run counsel-led federal/state court, Delaware, and patent diligence and reconcile the results with management representations.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR001
    - TR004
  - type: private-evidence-only
    severity: material
    topic: backlog-visibility
    missingEvidence: Contract value, option structure, renewal terms, exclusivity rights, and cancellation clauses for SES, Astranis, Space Force, NRO, and Orbit Fab programs.
    whyItMatters: Named missions prove interest but do not prove recurring platform demand, backlog quality, or revenue durability.
    diligencePath: Request a booked-backlog bridge, customer concentration model, and contract-rights summary by mission.
    relatedQuestionRefs:
    - QR025
    - QR026
    - QR031
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: material
    topic: debris-disposal
    missingEvidence: Mission-specific debris assessments, conjunction procedures, and end-of-life disposal plans for Mira, Helios, and hosted payload missions.
    whyItMatters: General NASA guidance exists, but the public record does not show how Impulse operationalizes disposal and collision-avoidance obligations on each mission profile.
    diligencePath: Request debris-assessment reports, disposal timelines, conjunction decision rules, and any customer-facing safety case documents.
    relatedQuestionRefs:
    - QR022
    - QR023
    relatedTableRefs:
    - TR001
    - TR002
