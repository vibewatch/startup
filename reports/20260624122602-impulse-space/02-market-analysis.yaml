  - direction
  - timing
  - implication
  - diligence ask
  rows:
  - - Higher rideshare and spacecraft volumes
    - driver
    - now
    - More missions create more parking-orbit-to-final-orbit work for OTVs and hosted payload platforms.
    - Request pipeline split between rideshare-driven and dedicated missions by vehicle.
  - - Government mobility doctrine
    - driver
    - now-to-midterm
    - Space Force demand for maneuver, refueling, tugs, and depots makes government the most tangible anchor customer set.
    - Map current government contracts and follow-on decision points through FY2027.
  - - Commercial GEO lifetime economics
    - driver
    - midterm
    - If Helios can shorten transfer and preserve satellite mass for service life, operators have a clear ROI reason to buy the tug layer.
    - Request operator-side pricing comparisons versus electric orbit raising and heavy-lift direct insertion.
  - - Rideshare scheduling, licensing, and “do no harm” rules
    - constraint
    - now
    - Multi-customer manifests reduce orbit and schedule control and add integration friction for small operators.
    - Obtain standard mission-planning assumptions for rideshare constraints by launch provider.
  - - Refueling/interface standards and depot readiness
    - constraint
    - midterm
    - Networked logistics architectures remain conceptually attractive but operationally immature without validated interfaces and propellant-handling standards.
    - Request interface strategy, refuelability assumptions, and partner roadmap for depot compatibility.
  - - Capital intensity and network scale-up cost
    - constraint
    - now-to-midterm
    - A multi-vehicle logistics fleet requires significant hardware, infrastructure, insurance, and working capital before utilization is proven.
    - Request capex, production cadence, and margin targets for Mira and Helios at scaled manufacturing rates.
  notes: Rows mix demand drivers and gating constraints because the key diligence task is judging when market pull overcomes mission-design friction and capital requirements.
