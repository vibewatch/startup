- id: sizing-lenses
  title: 'Sizing lenses: real market, weak consensus, no clean public SOM'
  body: |-
    Public market-sizing evidence supports the existence of a real in-space transportation market, but it does not support one clean headline TAM. The narrowest lens is the pure orbital transfer vehicle market. On that definition, The Business Research Company places 2026 market size at $2.03 billion after $1.79 billion in 2025, while Fortune Business Insights places the same year closer to $1.21 billion after valuing 2025 at $1.01 billion. Even before moving to broader categories, there is already a meaningful disagreement about what "OTV market" includes. A second lens widens the frame to in-space manufacturing, servicing, and transportation; TBRC places that category at $2.6 billion in 2026. A third lens widens again to overall space logistics; Mordor Intelligence places that at $8.82 billion in 2026 and $20.9 billion by 2031. Global Market Insights widens the boundary further by explicitly including earth-to-orbit logistics, orbital transportation, OSAM, end-of-life services, mission support, four orbit classes, and four end-user groups. These lenses should be preserved, not blended.

    The practical sizing implication is that Impulse's addressable market should be modeled as a ladder, not a stack. The broadest layer is all space logistics. A narrower layer is in-space manufacturing, servicing, and transportation. Narrower again is pure OTV demand for last-mile delivery and orbit-raising. Inside that sits the company's actual public opportunity set: GEO and MEO operator transfers, constellation deployment after rideshare drop-off, defense maneuver missions, station propulsion subsystems, and future lunar-adjacent transfer work. What is missing is the final commercial bridge: none of the reviewed public sources disclose Mira or Helios pricing, backlog by vehicle, standard mission cadence, or a bottoms-up SAM/SOM by orbit and customer vertical. That is why the chapter uses constrained sizing lenses rather than pretending to know Impulse's public SOM.
