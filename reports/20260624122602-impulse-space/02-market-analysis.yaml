  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: pricing-and-backlog
    missingEvidence: Standard price cards, backlog by vehicle, annual mission cadence, and utilization assumptions for Mira and Helios.
    whyItMatters: Without unit economics and backlog visibility, public TAM lenses cannot be translated into a defensible revenue bridge or SOM estimate.
    diligencePath: Request customer pipeline, standard mission pricing, average gross-margin assumptions, and booked backlog split by vehicle and orbit class.
    relatedQuestionRefs:
    - QM022
    relatedTableRefs:
    - TM002
  - type: missing-source
    severity: material
    topic: interoperability-standards
    missingEvidence: Public evidence of shared refueling interfaces, docking standards, propellant-transfer protocols, and cross-provider compatibility for depot-style networks.
    whyItMatters: If interoperability remains bespoke, orbital logistics may stay a set of isolated demos rather than a networked market with repeatable utilization.
    diligencePath: Request interface-control documents, partner MOUs, or government standards work that shows how Impulse expects to interoperate with depots and refuelers.
    relatedQuestionRefs:
    - QM023
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: material
    topic: lunar-accessible-som
    missingEvidence: A quantified view of what share of CLPS-like lunar spend is actually accessible to an orbit-transfer supplier rather than to the prime lander or launch provider.
    whyItMatters: Lunar logistics is strategically attractive, but without role-level economics it is easy to over-allocate prime-contract value to transfer-layer vendors.
    diligencePath: Map CLPS and commercial lunar missions into role-level spend buckets and identify where transfer, staging, or orbital mobility spend sits in the value chain.
    relatedQuestionRefs:
    - QM024
    relatedTableRefs:
    - TM002
    - TM003
