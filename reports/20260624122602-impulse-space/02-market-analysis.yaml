  rows:
  - - Last-mile deployment after rideshare or launch drop-off
    - Orbit changes, inclination changes, phasing, deployment to target slots, hosted operations immediately after insertion
    - Launch vehicle manufacturing and primary launch service revenue
    - Constellation operators, Earth-observation operators, research payload owners
    - This is the core Mira wedge and the cleanest OTV category.
  - - High-energy orbit raising to MEO/GEO/cislunar
    - LEO-to-MEO/GEO transfer, rapid orbit raising, high-energy insertion services
    - Downstream satcom service revenue after the spacecraft reaches its operational slot
    - GEO/MEO satellite operators and sovereign operators
    - This is the commercial Helios wedge validated by the SES deal.
  - - Hosted payload and RPO operations
    - Payload hosting, on-orbit maneuver support, SDA-adjacent payload positioning, proximity operations
    - Standalone analytics software or downstream data-service revenue
    - Defense users, commercial hosted-payload customers, technology demonstrators
    - This widens Impulse beyond simple delivery into persistent mobility.
  - - Station propulsion and orbital subsystem supply
    - Propulsion packages, attitude-control support, deorbit systems, orbital logistics subsystems for stations or platforms
    - Full station ownership, crew transport, or life-support operations
    - Commercial station developers and future habitat builders
    - Vast shows Impulse can monetize the market as a subsystem vendor, not only as a tug operator.
  - - Lunar-adjacent transfer and logistics support
    - Transfer-layer services to cislunar space, subcontracted delivery support, future depot-linked movement beyond GEO
    - Prime lunar lander revenue and surface-operations revenue
    - NASA-funded lunar-delivery primes and future commercial lunar operators
    - Real buyer demand exists, but Impulse would likely enter through prime contractors rather than as the top-level NASA vendor.
  notes: Rows are market-boundary buckets rather than additive TAM slices; launch revenue and downstream satellite-service revenue are intentionally excluded.
