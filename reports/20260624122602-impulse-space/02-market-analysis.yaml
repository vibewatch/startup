- id: buyers-and-adoption-path
  title: Buyer, user, payer, and adoption path vary sharply by orbit
  body: |-
    Impulse does not have one universal buyer journey. In the commercial GEO and MEO segment, the buyer and payer are satellite operators such as SES that care about lifetime extension, revenue acceleration, and avoiding the opportunity cost of slow electric orbit-raising. In that case, the end user is the satellite network operator, but the economic decision is made by a fleet owner optimizing launch, mass, and time-to-service. In the commercial-station segment, the customer can be a station developer buying propulsion as a subsystem rather than a transport mission; Vast's selection of Impulse for Haven-1 shows that the relevant budget owner may sit inside station design and integration, not only in a launch manifest office. In the defense segment, the buyer and payer are government organizations using appropriated budgets for tactically responsive space, space domain awareness, refueling, and on-orbit logistics concepts. Impulse's $34.5 million Victus Surgo and Victus Salo work, plus SSC's explicit call for reusable refuelable OTVs, show that government demand is already concrete enough to fund mission demonstrations.

    The adoption path is also institutional rather than consumer-led. NASA's documentation explains that rideshare has become a popular access model for small spacecraft and that OTVs occupy the last-mile layer between approximate drop-off orbit and operational orbit. That is a natural wedge for Impulse: rideshare to parking orbit, tug to target orbit, then hosted operations or deployment. But the path is gated by procurement structure. A GEO operator needs a mission architecture that beats the status quo on time and lifetime. A defense buyer needs proof that maneuverability and prepositioned assets improve tactical responsiveness. A lunar buyer usually sits behind a prime, as CLPS shows. And a standardized product story matters: Impulse's own rideshare menu and repeated Mira use cases suggest a transition from one-off engineering projects toward repeatable access products, but public evidence still stops short of showing scaled, disclosed backlog and utilization data.
