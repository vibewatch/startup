      - number: '4.3'
        title: 成本结构与资本强度
        blocks:
          - type: paragraph
            body: >-
              Impulse
              不像轻资产软件公司。官方材料反复强调垂直整合：公司称其大部分飞行器由内部设计、制造和测试，融资更新也把内部推进、航电和制造视为控制排期的来源。这个选择可能改善交付可靠性，但也意味着固定成本重于经纪式发射或纯软件业务。关于这些固定成本，公开证据很具体。2024
              年 Series B 新闻稿描述了 60,000-square-foot 的 Redondo Beach 总部和 Mojave 测试设施。2026 年 3 月，公司称新增一处 20,000-square-foot
              的 Colorado 制造基地，具备 CNC 和阀门生产能力。Falcon 9 发射公告又给出一条线索：Helios 首次任务单次就需要多达 14 tons 低温推进剂和专用 Florida 集成。


              招聘数据强化了同一结论。运行日期公司招聘页面显示 152 个开放岗位，Series D 公告称前一年员工数翻倍以上，并且已有或计划开放超过 200
              个岗位。这就是规模化公司的资本结构：设施、工装、集成、推进硬件、制造劳动力和任务运营，都会在任何公开毛利率证明出现前消耗现金。公开来源可以清晰梳理成本桶，但无法建立利润率模型。
