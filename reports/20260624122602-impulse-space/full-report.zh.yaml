      - number: '3.2'
        title: 直接运输同行：D-Orbit 有节奏，Momentus 承压公开，Starfish 有自主性
        blocks:
          - type: paragraph
            body: >-
              在拥有可见飞行产品的公司中，D-Orbit 是保留样本里运营最成熟的私营 smallsat OTV 同行。其网站公开披露 22 次轨道运输任务、79 个托管载荷和 141 颗已部署卫星；仅 2026 年 3 月
              Wayfinder 任务就搭载了四颗卫星和两个托管载荷演示。Momentus 是最后一公里递送和托管载荷服务中最直接可比的上市竞争对手，但公开财务图景较弱：2025 年 10-K 显示收入仅 $1.11
              million、年末现金 $12.8 million、持续经营讨论，以及截至 2026 年 3 月 35 名员工，随后在 2026 年 6 月完成 $25 million 股权融资。Starfish
              又不同。它不像通用拖船，更像一家自主优先的服务创业公司：Otter 被定位为电推进服务飞行器，Remora 与 Impulse 的任务在轨验证了自主 RPO 软件。Exotrail
              属于同一格局，但从已审阅公开材料看，它更像机动和电推进平台公司，而不是披露了可比节奏的重复拖船运营商。对 Impulse
              来说，经验是“直接竞争者”篮子很小但异质：一个同行赢在节奏，一个仍财务脆弱，一个强调软件驱动服务而非高推力转移速度。
