      - number: '8.2'
        title: 融资与运营证明：公司值得关注，但披露仍落后于资本流入
        blocks:
          - type: paragraph
            body: >-
              对一家仍未上市的在轨机动公司来说，这段融资史异常强。公司官方公告披露的路径从 $20 million 种子轮到 $10 million 延展轮、$45 million Series A、$150 million
              Series B、$300 million Series C，再到 $500 million Series D。即便不计非稀释或混合型奖项项目，已公布私募资本也至少达到 $1.025
              billion。如果把已披露的 $60 million STRATFI 奖项纳入更广融资语境，公开可支持总额会超过 $1.08
              billion，但不能把它与直接股权资本混为一谈，因为该奖项包括政府、配套和私人组成部分。同样重要的是，运营证据不是只靠 PR 编出来的。Impulse
              称已执行三次任务，并拥有数亿美元客户合同；外部报道和伙伴公告也证实了 SES、Vast、Anduril、Starfish 和 Astranis
              等具体协议。这足以支持“需求存在”的判断。但它不足以支持干净的估值倍数，因为公司仍未披露这些合同中有多少已确认为收入、毛利结构是什么样、爬坡多快消耗现金。
            claimRefs:
