      - number: '7.3'
        title: 客户、伙伴与资本集中把上行空间绑在狭窄可见管线上
        blocks:
          - type: paragraph
            body: >-
              可见商业管线是真实的，但很窄。SES 和 Astranis 是两个最清晰的公开 GEO 锚定客户，各自公布了 2027 年任务，任务逻辑都明确绑定快速 LEO-to-GEO 转移。Orbit Fab
              增加了一个技术上有意思的加注演示，但它仍是演示。政府侧，公司有 $34.5 million Space Force TacRS 奖项、$60 million STRATFI 和一份 NRO BALISTA
              合同。这些项目验证了相关性，但也显示已披露积压订单有相当部分落在政府资助或国防相邻用例里，而不是规模化经常性商业服务。


              反证在这里很重要。SpaceNews 2026 年 3 月报道认为，商业采购模式不会自动带来广泛商业机会，并引用 Impulse
              领导层说法：部分高性能军用航天器商业需求很少或没有。这本身不会推翻投资论点，但它挑战了一个假设：每个政府任务都会自动降低更广泛平台的风险。它可能只给产品线里的某个专业子集降风险。


              资本强度放大了这种集中度。SpaceNews 和 Payload 报道称 Impulse 累计融资已超过 $1 billion，TechCrunch 称新资金用于最多 200
              人招聘和更多建造测试能力。弹药很足，但也意味着在公开证明经常性任务节奏之前，公司已经立下很高的固定成本目标。如果 Falcon/Helios 时点滑坡，或 SES 和 Astranis
              没能转化为可重复需求，公司仍可能面对典型太空初创问题：募资规模大、技术可信度高，但经常性商业收入基础比预期薄。
