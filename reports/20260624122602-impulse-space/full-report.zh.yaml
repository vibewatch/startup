      - number: '3.3'
        title: 服务、加注与 GEO 邻近机会挤满更高轨道机会集
        blocks:
          - type: paragraph
            body: >-
              更高轨道机会集比纯最后一公里拖船层更拥挤。Orbit Fab 是最清晰的例子：它今天不是直接 OTV 竞争对手，但如果加注成为标准，就可能具备战略权力。它已经公开给出向 GEO 递送 100 kilograms
              肼燃料需 $20 million 的基准，销售 RAFTI 接口，并把自己定位为 depot 和燃料摆渡网络。Infinite Orbits 更接近未来重叠竞争者，因为它出售 GEO 寿命延长服务，并已与
              Impulse 合作，从 2027 年开始进行 Caravan 递送。Astroscale 和 Northrop 在检查、碎片、加注和大型卫星服务方面拥有最强的公开可信度。Astroscale
              列出主要机构客户，并称 Provisioner 将在 2026 年为 USSF 资产加注；Northrop 的 SpaceLogistics 产品栈则明确包括 MEV、MRV 和 MEP。HEO 和
              ThinkOrbital 重要的原因不同：它们显示检查、SDA 成像、机器人工具和建造功能如何进入与拖船服务相同的架构。因此，Impulse
              面对的竞争前沿是：有些公司现在是补充方，有些现在是合作伙伴，还有几家公司会随着客户围绕 GEO 和防务任务要求更完整的在轨服务组合，迁移到正面竞争。
