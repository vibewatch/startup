      - number: '2.2'
        title: 规模测算视角：市场真实、共识薄弱、没有干净的公开 SOM
        blocks:
          - type: paragraph
            body: >-
              公开市场规模证据支持在轨运输市场真实存在，但不支持一个干净的标题式 TAM。最窄视角是纯轨道转移飞行器市场。按这一定义，The Business Research Company 估算 2026 年市场规模为
              $2.03 billion，高于 2025 年的 $1.79 billion；Fortune Business Insights 则把同一年放在约 $1.21 billion，此前其 2025 年估值为
              $1.01 billion。即便还未扩展到更宽类别，市场对“OTV market”包含什么已经存在明显分歧。第二个视角把框架扩大到在轨制造、服务和运输；TBRC 把该类别 2026 年规模放在 $2.6
              billion。第三个视角再次扩展到整体太空物流；Mordor Intelligence 估算 2026 年为 $8.82 billion，2031 年为 $20.9 billion。Global Market
              Insights 进一步放宽边界，明确纳入地面至轨道物流、轨道运输、OSAM、寿命终止服务、任务支持、四类轨道和四类终端用户。这些视角应被保留，而不是混在一起。


              对 Impulse 的实用规模测算，应建成阶梯，而不是堆栈。最宽一层是全部太空物流。更窄一层是在轨制造、服务和运输。再窄一层是用于最后一公里递送和变轨的纯 OTV 需求。里面才是公司实际公开机会集：GEO 和
              MEO 运营商转移、拼车释放后的星座部署、防务机动任务、空间站推进子系统，以及未来月球邻近转移工作。缺失的是最后一座商业桥：本次审阅的公开来源都没有披露 Mira 或 Helios
              定价、按飞行器划分的订单积压、标准任务节奏，或按轨道和客户垂直自下而上的 SAM/SOM。因此，本章采用受约束的规模视角，而不是假装知道 Impulse 的公开 SOM。
