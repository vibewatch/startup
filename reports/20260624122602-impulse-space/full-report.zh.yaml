  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管、法律、出口和碎片规则可能拖慢每个任务
        blocks:
          - type: paragraph
            body: >-
              Impulse 面对的不是像发射公司那样单一的二元许可证；它嵌在多机构链条里，任务仍可能被拖延或拦住。FAA 表示，Commercial Space Transportation
              授权发射和再入运行、场址运行以及安全要素批准；14 CFR 450.43 下的 FAA
              载荷审查要求载荷所有者或发射申请人取得所有必要许可、授权和批准，并证明任务不会危及公共安全、财产、国家安全、外交政策利益或国际义务。FAA 和底层法规还说明，FCC 或 Department of
              Commerce 监管的事项不属于 FAA 判定范围，这意味着 Impulse 任务可能继承通信、出口和载荷特定许可依赖，而这些在公开任务营销中不可见。


              财务责任是第二个监管拖累。FAA 指引和 14 CFR 440.9 明确，持证运营方必须按最大可能损失规模购买保险或托管资金，实际损失也可能超过模型估计。这很关键，因为 Impulse
              正在围绕高价值客户载荷、GEO 转移、托管载荷、加注和接近 RPO 的任务搭业务，即使任务频率仍低，也可能放大后果严重性。环境审查是另一道闸门：FAA 称，NEPA 审查可能要求在联邦决策前完成 EA 或
              EIS。


              空间碎片和安全义务是披露最不足的任务级风险。NASA 碎片缓解材料和 NASA-STD-8719.14 强调碎片预防、避碰、碎片评估和任务后处置。Mira 的机动性有帮助，但公开页面没有展示 Impulse
              的具体处置计划、交会程序或托管载荷安全论证。因此，监管风险不是“打勾项”；它是执行中的依赖，可能拖慢排期、抬高成本或缩窄可触达客户类别。
