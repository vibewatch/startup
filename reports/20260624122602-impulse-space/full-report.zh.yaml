            body: >-
              Helios 把 Impulse 从 LEO 机动专家变成更高轨道物流平台。主张很简单：用中型运载火箭获得频次和成本优势，再点燃大型化学 kick
              stage，在数小时内完成转移，而不是花六到九个月电推进变轨，或为稀缺重型火箭直接入轨付费。公开规格显示，Helios 采用 LOX-methane Deneb
              发动机、具备重启能力和多配置任务打包，载荷质量足以吸引电信、SDA 和科学运营商。SES 协议是最清晰的商业验证，因为它把排期压缩卖点变成了一个具名的 2027 年任务，搭载四吨级载荷，并直接从 LEO 转移至
              GEO。GEO 拼车、Exolaunch 启用的销售，以及与 Relativity 相关的火星邻近叙事拓宽了故事，但也凸显 Helios 仍需把有前景的架构转化为重复飞行运营。2024 年初首飞目标与 2026
              年材料如今指向 2027 年之间的差距，是关键路线图警示。
