  - id: TV004
    title: 可比估值表
    enumerationScope:
      coverage: partial
      basis: >-
        This table covers the most decision-relevant public or quasi-public reference points available in fetched June
        2026 evidence. No listed company is a clean one-for-one match for Impulse’s business mix, so the set
        intentionally combines ceiling, floor, premium, and downside stress analogs.
    columns:
      - 可比公司
      - 指标
      - 倍数 / 估值 / 状态
      - 相关性
      - 局限性
    rows:
      - - Rocket Lab
        - 市值 / TTM 收入 / 积压
        - ~81x 收入；$55.06B 市值；$679.58M TTM 收入；$2.22B 积压
        - 对一家有真实收入和积压的垂直整合航天平台而言，这是高溢价天花板可比。
        - 规模、公开流动性和业务组合都远大于 Impulse。
      - - Redwire
        - 市值 / TTM 收入 / Q1 利润率
        - ~6.5x 收入；$2.42B 市值；$370.96M TTM 收入；27% 毛利率
        - 对资本密集型航天基础设施而言，是有用的硬件服务底部可比。
        - 收购历史不同，转移平台敞口也不如 Impulse 直接。
      - - Planet Labs
        - 市值 / TTM 收入 / 剩余履约义务
        - ~30.3x 收入；$10.17B 市值；$335.61M TTM 收入；$816M RPO
        - 显示软件 / 数据叙事强时，公开市场可以给航天公司多高估值。
        - 地球观测数据公司，不是转移飞行器或在轨机动运营商。
      - - Momentus
        - 市值 / TTM 收入 / Q1 收入
        - ~33x 收入；$133.45M 市值；$4.00M TTM 收入；$3.2M Q1 收入
        - 压力可比：机动叙事仍可能只对应极小收入和融资依赖。
        - 规模太小且已陷困境，不能作为定价锚；作为下行警示比作为公允价值基准更有用。
      - - SpaceX（仅作背景）
        - 收入 / 估值叙事
        - 分析师称，尽管其 2025 年收入约 $18.7B 且亏损较大，IPO 框架仍由愿景驱动
        - 有助于理解：TAM 叙事占主导时，即便顶级航天叙事也可能跑赢常规倍数。
        - 私有巨型公司，业务范围截然不同；仅作背景，不是直接可比。
    notes: 可比公司组合只提供方向。它能框定估值逻辑，但在 Impulse 披露收入和投资条款前，无法验证高溢价私募价格。
