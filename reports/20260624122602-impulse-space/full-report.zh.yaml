          detail: 运营商、空间站开发商或政府用户需要特定轨道、托管运行或机动能力。
        - id: launch
          label: 选择发射路径
          detail: 买方选择拼车、中型运载火箭，或由主承包商牵头的任务架构。
        - id: parking
          label: 到达停车轨道
          detail: 发射服务商交付的是近似轨道，而不是最终运行状态。
        - id: transfer
          label: Impulse 机动层
          detail: Mira 或 Helios 执行转移、部署、托管，或由子系统支撑的机动任务。
        - id: ops
          label: 运行轨道或平台使用
          detail: 载荷进入服务轨道，托管任务启动，或空间站子系统投入服务。
        - id: repeat
          label: 重复需求
          detail: 成功结果可能带来后续发射、星队标准化，或更多政府任务派单。
      edges:
        - from: need
