              由于 Impulse 没有公开软件仓库或开发者平台，最好的开发者信号代理是招聘和设施面。这个代理仍有用。公开招聘页面显示，开放岗位广泛覆盖软件、推进、自主、航电、质量、任务管理、供应链和装配 /
              测试。Boulder 扩张提供了更多具体性，展示 GNC、阀门加工、Deneb 泵工作和全栈测试台位于组织内部何处。这很重要，因为产品承诺依赖硬件、飞行软件和任务运营的垂直整合：Mira 和 Helios
              不是独立 bus，而是紧耦合系统，需要推进、GNC、航电和载荷集成在压缩时间线上协同工作。同一证据也揭示了集中的执行风险。制造深度正在成为护城河，但也是依赖项：如果阀门生产、GNC
              测试能力或发射集成延误，整个产品路线图都会随之延误，因为 Impulse 自己拥有太多栈。
