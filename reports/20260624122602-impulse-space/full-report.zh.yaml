  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 客户分层与渠道结构
        blocks:
          - type: paragraph
            body: >-
              Impulse 公开客户大致分成四类：（1）在低地球轨道搭乘 Mira 的托管载荷和部署客户；（2）未来购买 Helios 抵达 GEO 或 MEO 的高能量交付客户；（3）用 Mira 或 Helios
              执行特定子系统、加注或自主任务的空间基础设施与在轨服务伙伴；（4）测试响应式航天和轨道物流概念的美国政府买方或采购渠道。目前最强的公开证据来自第一类，因为这些客户绑定到已经飞行的 Transporter
              任务，并有具名载荷结果。TrustPoint、FOSSA Systems、SatRev/RIDE!、HEO、Starfish、Samara 和 Zenno 都有与 Mira 运行挂钩的任务级证据，而不是 logo
              墙营销。


              第二类商业意义不小，但大多仍是前置预订。SES 和 Astranis 都签了 2027 年 Helios 任务；SES 交易明确是首个专用商业 Helios 任务，Astranis 协议则围绕 24
              小时内直接注入 GEO。交易对手很强，但仍是依赖排期的积压订单，不是已部署服务。第三类包括 Vast、Orbit Fab、Lodestar 和 Anduril 等项目，Impulse
              提供推进、托管或机动能力。这些证明买方把 Mira/Helios 当作基础设施来用，但不少仍处在演示或集成阶段。四类客户合起来看，公开记录呈现出清晰的上市路径：Impulse 的发射和任务交付渠道高度围绕
              SpaceX；离已飞行的 Mira 载荷越远、越接近未来 Helios 积压订单和政府合同渠道，客户变现质量就越不透明。
