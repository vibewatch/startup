            body: >-
              Impulse Space 把自己定位为基础设施，起点是发射服务商已经把载荷送到初始轨道之后。按客户语言，工作流是：选择成本更低或频次更高的发射，搭乘至 LEO，使用 Helios 快速转移到 MEO、GEO
              或更远目的地，再用 Mira 完成在轨最后一公里任务：部署、托管运营、重新定位，或交会与近距离操作。这套工作流已在客户案例中可见。Mira 托管过非地球成像载荷，部署过 CubeSat，并支持自主交会软件；SES
              签下专用 Helios 任务以缩短到 GEO 的时间；NASA 选择 Impulse 作为面向科学发射机会的 VADR
              供应商。因此，产品栈横跨商业、民用和防务用例，但其收入逻辑仍取决于能否证明客户愿意为排期压缩、机动能力和托管运营单独付费，而不是把这些能力当作发射容量的打包附属。
