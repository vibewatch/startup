          - type: callout
            title: Helios 时点是整章最清晰的单一变量
            body: 这里很多尽调争论都模糊，但 Helios 时间表不模糊。如果商业高能量任务按时发生，公司的叙事会更容易捍卫。如果明显滑坡，融资议价能力和估值可信度会同时恶化。
            calloutType: insight
