      - number: '8.5'
        title: 图表
        blocks:
          - type: callout
            title: 在经济性追上叙事强度之前，建议仍是继续研究
            body: >-
              Impulse 已经值得进入主动观察名单，因为任务证明和客户证明显著强于大多数同年龄太空初创公司。但公开证据还不足以支持对价格不敏感的承销。应把 2026 年 Series D
              视为投资人胃口的证明，而不是公允价值的证明。
            calloutType: recommendation
            claimRefs:
              - CV001
