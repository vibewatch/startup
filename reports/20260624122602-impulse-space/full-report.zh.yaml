        - 这把 Impulse 从简单交付拓宽到持续机动。
      - - 空间站推进和轨道子系统供应
        - 推进包、姿态控制支持、离轨系统、面向空间站或平台的轨道物流子系统
        - 完整空间站所有权、乘员运输或生命保障运行
        - 商业空间站开发方和未来栖息地建造方
        - Vast 表明 Impulse 不只作为拖船运营商，也能以子系统供应商身份变现市场。
      - - 月球相邻转移和物流支持
        - 到地月空间的转移层服务、分包交付支持、未来与补给站挂钩的 GEO 之外移动
        - 主承包月球着陆器收入和月面运营收入
        - NASA 资助的月球交付主承包商和未来商业月球运营商
        - 真实买方需求存在，但 Impulse 可能通过主承包商进入，而不是作为 NASA 顶层供应商。
    notes: 行项目是市场边界桶，而不是可相加的 TAM 切片；发射收入和下游卫星服务收入被有意排除。
