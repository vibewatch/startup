    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、使命与商业模式
        blocks:
          - type: paragraph
            body: >-
              Impulse Space 由 Tom Mueller 于 2021
              年创立，瞄准的是发射之后才开始的问题：火箭把载荷送入初始轨道后，客户仍需要快速、精准地移动到真正产生任务价值的轨道。公司官方材料一贯把业务定义为在轨机动，而不是发射；Mira
              负责托管、部署和机动任务，Helios 则面向更高能量轨道的更快转移。公司也强调垂直整合——大部分核心硬件由内部设计、制造和测试——以压缩开发周期并控制任务可靠性。这套运营模式落在 California 的
              Redondo Beach：Impulse 称总部和主要生产基地都在那里，同时配有 Mojave 测试设施，之后又扩展到 Colorado 和
              Washington。当前商业叙事很宽：向商业、民用和防务客户出售发射后物流、托管载荷服务和高 delta-v 转移能力。到 2026 年 6 月 Series D
              新闻稿时，公司还声称已完成三次飞行任务，并拥有数亿美元客户合同；即便收入仍未披露，公司概览也有了可用的运营基线。
