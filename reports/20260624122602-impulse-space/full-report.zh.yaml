        title: 里程碑、合作伙伴与不利信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录足以证明真实执行力，但还不足以消除项目风险。官方时间线显示，公司从 2021 年成立，走到 2022 年种子轮融资，2023 年 Series A 和迁入 Redondo Beach 总部，2024 年
              Series B 和重要政府牵引，2025 年 Series C 以及 LEO Express 2、LEO Express 3，再到 2026 年 Series D、Colorado 扩张和
              Washington, D.C. 办公室。商业验证也在加强：SES 成为第一个专用 Helios 客户，NASA 选择 Impulse
              参与轨道转移研究，美国防务机构为战术响应航天工作提供资金。不过，本章不应夸大成熟度。LEO Express 3 披露过真实飞行异常：星跟踪器噪声消耗了飞行器大部分推进剂余量；官方材料也在一年内把 Helios
              首飞预期从 2026 年推到 2027 年。市场层面，可机动航天器业务还处在更严峻的政策环境里，轨道拥堵、碎片缓解和自主性审查都在上升。TIME 和 Nature 的材料并非专门不利于
              Impulse，但它们不利于许多机动公司隐含依赖的宽松运营假设。尽调的正面结论是罕见的飞行履历；谨慎点在于，扩张到 GEO 和防务相关 RPO 工作，会比在 LEO 证明三次 Mira 任务困难得多。
