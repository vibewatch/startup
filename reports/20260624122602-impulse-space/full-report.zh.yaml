    title: 推荐逻辑
    type: flow
    layout: wide
    summary: 当前投资判断来自两条线的碰撞：需求证明和任务证明很强，但经济披露仍不完整。
    data:
      nodes:
        - id: funding
          label: $500M Series D / >$1B 资本
          detail: 投资人需求和融资能力已经清楚成立。
          tone: positive
        - id: mission
          label: 三次已飞任务
          detail: Mira 有真实飞行历史，也有合作伙伴背书的 RPO 证据。
          tone: positive
        - id: customers
          label: 具名锚定客户
          detail: SES、Astranis、Vast、Anduril 和 Starfish 给出真实需求信号。
          tone: positive
        - id: helios
          label: 2027 年 Helios 爬坡
          detail: 排期是更高能量运输经济性的主要价值释放点。
          tone: warning
        - id: econ-gap
          label: 无公开收入 / 毛利 / 烧钱
          detail: 公开记录仍缺少验证价格所需的经济数据。
          tone: negative
        - id: round-gap
          label: 精确投后估值未核实
          detail: 已抓取公开来源能印证融资规模，但不能印证提示中提到的精确投后估值。
          tone: warning
        - id: decision
          label: 继续研究
          detail: 积极跟踪，但在承销新资金前必须拿到资料室。
          tone: neutral
      edges:
        - from: funding
          to: decision
        - from: mission
          to: decision
        - from: customers
          to: decision
        - from: helios
          to: decision
        - from: econ-gap
          to: decision
        - from: round-gap
          to: decision
    approximationNotes: null
    claimRefs:
      - CV001
      - CV008
      - CV011
      - CV024
      - CV025
      - CV043
      - CV049
      - CV061
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 公开可比公司的分化极大，因此缺失收入披露比电子表格假设的小幅调整更重要。
    data:
      items:
        - label: Rocket Lab 销售倍数
          value: 81
          unit: x TTM revenue
          detail: 有真实规模和积压订单支撑的高端天花板可比公司。
          tone: positive
        - label: Planet 销售倍数
          value: 30.3
          unit: x TTM revenue
          detail: 带有情绪溢价的软件 / 数据公司，不是直接运营类比。
          tone: warning
        - label: Momentus 销售倍数
          value: 33
          unit: x TTM revenue
          detail: 数学上看起来高，只是因为收入基数很小。
          tone: negative
        - label: Redwire 销售倍数
          value: 6.5
          unit: x TTM revenue
          detail: 这一组中最接地气的公开硬件服务底部可比公司。
          tone: neutral
    approximationNotes: 倍数是从 2026 年 6 月抓取的市场数据页面搭出的市值对 TTM 收入简化桥；它们是边界标记，不是完整企业价值调整。
    claimRefs:
      - CV030
      - CV033
      - CV036
      - CV039
      - CV042
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: wide
    summary: 区间很宽，因为最大的缺失变量不是市场胃口，而是 Impulse 能否在任务势头之上拿出披露收入和干净融资条款。
    data:
      items:
        - label: 熊市情景
          low: 800
          mid: 1400
          high: 2000
          displayValue: $0.8B–$2.0B
          detail: Helios 延误、锚定项目走弱，或融资修复条款会触发该情景。
          tone: negative
        - label: 基准情景
          low: 2500
          mid: 3200
          high: 4000
          displayValue: $2.5B–$4.0B
          detail: Helios 按时启动，客户信号耐久，但披露仍只有一部分。
          tone: warning
        - label: 牛市情景
          low: 5000
          mid: 6000
          high: 7000
          displayValue: $5.0B–$7.0B
          detail: 按时爬坡、商业复购需求出现，且尽调揭示强收入转化。
          tone: positive
    approximationNotes: 区间是作者估计，锚定已抓取的公开合同、产品里程碑、公开可比公司分化和披露限制；不是管理层指引，也刻意不把提示中提到的精确投后估值当成已验证事实。
    claimRefs:
      - CV053
      - CV054
      - CV055
      - CV061
      - CV062
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: Impulse 在任务证明和客户信号上得分较好，但经济可见度和估值可验证性偏弱。
    data:
      items:
        - label: 任务证明
          value: 8
          note: 三次任务已飞，加上 Starfish 给出的合作伙伴验证 RPO 证据。
        - label: 客户证明
          value: 8
          note: SES、Astranis、Vast、Anduril 和其他具名关系显示真实需求信号。
        - label: 政府验证
          value: 8
          note: STRATFI 加上 SSC/DIU 合同证明官方存在发射后机动需求。
        - label: 经济可见度
          value: 2
          note: 没有公开收入、毛利率、现金消耗或客户集中度披露。
        - label: 资本强度
          value: 4
          note: 在 Helios 商业爬坡得到验证前，已披露私人资本超过 $1.0B，说明资金需求很重。
        - label: 估值支撑质量
          value: 3
          note: 公开证据支持融资和势头，但不支持可投资轮次的精确价格。
    approximationNotes: 分数是作者仅用已抓取公开证据集按 1–10 分作出的判断；10 表示可观察证明达到同类最佳。
    claimRefs:
