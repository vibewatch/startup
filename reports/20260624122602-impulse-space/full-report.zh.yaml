      - number: '4.4'
        title: 资本充足性与融资依赖
        blocks:
          - type: paragraph
            body: >-
              公司概览应承载完整融资轮次。对财务承销来说，更重要的是公开资本底线已经足够大，值得认真对待。本次审阅的 Form D 文件显示，2022 年约 $20.0 million，2023 年 $45 million
              发行中售出 $38.75 million，2025 年 $299.83 million 发行中售出 $294.53 million，2026 年 $500.00 million 发行中售出 $499.83
              million。把这些已售金额与 2024 年官方宣布的 $150 million Series B 合并，在不计入 2023 年和 2025 年未售余额的保守公开口径下，资本底线约为 $1.003
              billion。官方叙事如今把它四舍五入为融资超过 $1 billion。


              这笔资本基础支持真实的规模活动：Helios 和 Mira 生产、设施扩张、招聘、发射承诺和政府任务执行。它也与合同需求并行，后者从 2025 年 6 月近 $200 million 移至 2026 年 6
              月数亿美元。问题在于，资本充足性仍无法按传统方式建模，因为公开来源没有披露手头现金、月度消耗、资金跑道、债务、项目融资或营运资本机制。公开层面，相比许多同行，公司看起来资金充足；公开层面，它仍无法承销到具体流动性期限。
