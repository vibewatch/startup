      - number: '8.4'
        title: 尽调问题与精确论点失效触发器：新资金合理投入前必须成立什么
        blocks:
          - type: paragraph
            body: >-
              从有意思的公司走到可投资价格，路径取决于少数不可谈判的尽调事项。管理层需要展示当前已确认收入、毛利率、月度现金烧钱，以及从已宣布合同价值到积压订单和收入转化的桥。公司还需要展示 Series D
              的确切优先权结构，以及任何可能改写新投资人退出结果的股东保护。没有这些信息，即便运营故事很强，也无法有纪律地承销。论点失效触发器因此应当精确、可监控，而不是泛泛而谈。如果 Helios 到 2028
              年中仍未完成首次商业高能量任务，近端平台论点就在排期上失败。如果下一次融资事件前没有新增商业 Helios 客户，需求宽度仍太窄。如果下一轮融资是 down-round，或需要
              ratchet、pay-to-play 条款，公开市场等价的论点已经破裂。如果管理层在下一次融资或二级交易流程中仍不披露收入、毛利率和烧钱，不论技术进展如何，这笔投资仍无法承销。
