      - number: '6.3'
        title: 政府客户与需求转化
        blocks:
          - type: paragraph
            body: >-
              政府客户牵引确实存在，但证据质量因项目差异很大。最干净的公开证据是 Space Systems Command 的 VICTUS SURGO 和 VICTUS SALO 奖项：Impulse 和
              SpaceNews 都称这是一份 $34.5 million 合同，支持两个 2026 年响应式航天任务，其中一个结合 Helios 与 Mira，另一个使用未来 SpaceX 拼车发射进入 LEO。它比
              HALO、VADR 或 BALISTA 更强，因为证据绑定了具名任务和计划发射时间，而不只是池内资格。


              相比之下，HALO 让 Impulse 进入 Space Development Agency 未来原型订单的供应商池，NASA 的 VADR 把 Impulse 纳入截至 2027 年 2
              月的供应商池，BALISTA 则让 NRO 评估感兴趣技术。这些都是通往未来收入的有用入口，但不能等同于已部署客户使用。更大的国防市场也仍在成形。SSC 的 2026
              年轨道物流挑战明确寻求轨道转移飞行器、补给站、加注和检查概念；独立报道则指出 Space Force
              仍在梳理兵力设计问题，尚未围绕轨道物流建立完全规模化预算线。结论偏正面，但有条件：政府需求正在验证产品类别，但今天公开牵引大多仍处在正式项目立项之前，因此不如多任务商业客户耐久。
