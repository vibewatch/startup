        title: 具名客户证据与部署质量
        blocks:
          - type: paragraph
            body: >-
              证据能指向确切载荷、任务和运行里程碑时，具名客户证明最强。LEO Express-1 上，Mira 部署了 TrustPoint 的 3U CubeSat。LEO Express-2 上，Mira 部署了
              FOSSA 的 TAT-0 卫星，把 SatRev 的 Bluebon CubeSat 送入 RIDE! 的 Deep Blue Mission，托管 HEO 的 Holmes-007 相机并取得首张图像，还与
              Starfish 完成 Remora 自主 RPO 演示。LEO Express-3 上，Impulse 公开确认回头客 FOSSA Systems 和 HEO，随后报告三颗 FOSSA CubeSat
              全部部署，以及 HEO 的 Holmes Mk2 完成 first-light。这些案例满足部署证据要求，而不只是品牌露出：它们写清了航天器、任务场景和在轨结果。


              商业 Helios 客户证据可信，但大多尚未飞行。SES 签了多次发射协议，首个任务被描述为 2027 年专用 Helios 运输，把 4 吨级载荷在 8 小时内送往 GEO。Astranis 签署了 2027
              年 Falcon 9 加 Helios 任务，24 小时内直接注入 GEO，并确认 Astranis 是主载荷。Vast 在 2023 年选择 Impulse 为 Haven-1 提供推进，但客户自己在 2026
              年更新中把 Haven-1 准备时间推到 2027 年第一季度，因此这段关系仍是已预订的集成工作，不是在轨服务。Lodestar 的 MITHRIL 工作和 Anduril 的 GEO RPO
              任务进一步证明买方想要 Impulse 的可机动平台，但两者仍处在演示阶段，而不是重复生产式服务。
