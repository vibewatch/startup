      - number: '4.2'
        title: GTM 动作与销售效率代理指标
        blocks:
          - type: paragraph
            body: >-
              公开 GTM 图景强于公开定价图景。到 2025 年 6 月，Impulse 称已签署超过 30 份合同，总额近 $200 million；到 2026 年 6
              月，公司称客户合同已进入数亿美元规模。具名需求集覆盖防务、商业 GEO 运营商、托管载荷客户和民用工作。这种宽度很重要，因为它意味着公司并不依赖单个实验性演示项目：它正试图把专用 Helios 运输、GEO
              拼车、托管任务和政府任务响应性卖进不同采购渠道。


              销售动作也明显是高触达。SES、Astranis 和 Space Network Services 都是协商式任务协议，而非自助平台客户。U.S. Space Force 和 SpaceWERX
              奖项需要项目捕获、合同签署和里程碑管理。招聘页面还提供了另一个代理指标：当前岗位覆盖业务拓展、政府事务、财务、法务、制造和任务运营，这不像商品化发射经纪模式。缺失的是投资人通常用来测试效率的指标。没有审阅来源披露
