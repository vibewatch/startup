        - label: 载荷集成层
          detail: CubeSat 部署器、托管传感器、SDA 载荷、科学载荷和伙伴自主软件包，通过任务专用接口接入。
        - label: 任务软件与自主层
          detail: 地面运营、软件定义重构、伙伴自主软件和客户任务派发，把硬件转成服务流程。
    claimRefs:
