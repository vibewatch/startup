  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：发射后机动，而非发射经济
        blocks:
          - type: paragraph
            body: >-
              分析 Impulse Space，应把它放在发射后的轨道物流里，而不是整个发射市场，或更宽泛的“太空经济”。公司的公开产品栈清楚划出了这条边界。Mira 被营销为高推力航天器，覆盖
              LEO、MEO、GEO、地月空间及更远区域的托管、部署和机动；Helios 则是面向 MEO、GTO、GEO、地月转移注入和地球逃逸等高能转移的 kick stage。拼车页面随后把这些能力产品化：Mira
              为需要定制轨道投放的载荷提供托管与部署任务，Helios 提供共享和专用的高能入轨任务，Caravan 项目则从 2027 年开始提供年度 GEO
              拼车。这意味着纳入的支出不是火箭制造或发射服务本身，而是发射之后的一层：把载荷从停泊轨道移到工作轨道，入轨后托管载荷，支持交会与近距离操作，并向第三方轨道平台提供推进或子系统能力。


              这条边界很重要，因为排除发射之后，替代方案和经济性都会改变。对 GEO 运营商而言，替代方案是稀缺的重型火箭直接入轨，或速度更慢的电推进变轨。对拼车星座客户而言，替代方案是接受发射服务商的释放轨道，或购买不同的
              OTV/OMV 服务。对空间站开发商而言，替代方案可能是内部集成推进系统，或采购子系统供应商，而不是自由飞行拖船。对月球买家而言，相关路径更间接：NASA 已经通过 CLPS
              采购月球递送服务，但主合同持有人是着陆器运营商，不一定是转移层供应商。因此，本章把 Impulse 视为参与轨道转移、托管载荷机动、空间站推进 / 物流子系统，以及未来月球转移邻近机会；同时排除发射收入和
              Impulse 自身并不出售的下游卫星服务收入。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
              - CM006
