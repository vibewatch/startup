      - number: '3.4'
        title: 持久性、切换成本，以及 Impulse 真正差异化之处
        blocks:
          - type: paragraph
            body: >-
              公开证据支持 Impulse 拥有真实但仍脆弱的位置。最好的差异化信号不是某个杀手级功能，而是覆盖多个任务层的宽度。合作公告显示，Mira 既是 Starfish 的自主演示载体，也是 Orbit Fab
              的加注托管概念载体、HEO 的非地球成像载荷托管平台，并将为 Infinite Orbits 启用未来 GEO
              递送。这比多数同行公开展示的范围更广。但宽度不等于锁定。买方仍可用直接入轨、星上推进、较慢变轨，或把子系统集成进自有平台来替代。公开定价大多不透明，因此很少有证据表明客户被经济性锁定，而不是被任务匹配和排期锁定。护城河图景因此混合。D-Orbit
              看起来拥有最佳已披露节奏。Starfish 在自主优先服务上最强。Orbit Fab 对未来燃料经济性最透明。Astroscale 和 Northrop 拥有更多既有服务可信度。Impulse
              的优势在于跨多种架构的速度和灵活性，尤其是在高推力和快速机动重要的场景。风险在于，如果没有专有接口控制或已披露的长期合同，公司仍处在一个邻近专家可以进入运输层、飞行器运营商也可能被标准、depot
              或主承包商打包商品化的类别里。
