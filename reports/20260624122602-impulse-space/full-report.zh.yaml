  - id: TM004
    title: 增长驱动因素与约束表
    columns:
      - 驱动 / 约束
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 拼车和航天器数量增加
        - 驱动
        - 当前
        - 任务越多，OTV 和托管载荷平台需要处理的从停泊轨道到最终轨道的工作越多。
        - 要求按飞行器拆分由拼车驱动的任务和专属任务管线。
      - - 政府机动条令
        - 驱动
        - 当前至中期
        - Space Force 对机动、加注、拖船和仓库的需求，让政府成为最具体的锚定客户群。
        - 梳理现有政府合同，以及截至 FY2027 的后续决策节点。
      - - 商业 GEO 寿命经济性
        - 驱动
        - 中期
        - 如果 Helios 能缩短转移时间，并为服役寿命保住卫星质量，运营商就有明确的 ROI 理由购买拖船层。
        - 要求提供运营商侧定价比较，对标电推进轨道提升和重型火箭直接入轨。
      - - 拼车排期、许可和“不造成损害”规则
        - 约束
        - 当前
        - 多客户发射清单会削弱轨道和排期控制，也给小型运营商增加集成摩擦。
        - 获取各发射商拼车约束下的标准任务规划假设。
      - - 加注 / 接口标准与仓库成熟度
        - 约束
        - 中期
        - 网络化物流架构在概念上仍有吸引力，但没有经过验证的接口和推进剂处理标准，运营上仍不成熟。
        - 要求提供接口策略、可加注假设，以及面向仓库兼容性的合作伙伴路线图。
      - - 资本强度与网络扩张成本
        - 约束
        - 当前至中期
        - 多飞行器物流舰队在利用率被证明之前，就需要大量硬件、基础设施、保险和营运资本。
        - 要求提供 Mira 和 Helios 在规模化制造产能下的资本开支、生产节奏和利润率目标。
    notes: 各行同时包含需求驱动和卡点约束，因为尽调核心是判断市场拉力何时能压过任务设计摩擦和资本要求。
