companyProfile:
  summary: >-
    Impulse Space 是一家位于 Redondo Beach 的轨道机动公司，由前 SpaceX 推进负责人 Tom Mueller 于 2021 年创立。公司不卖发射本身，而是靠小型 Mira 飞行器和更大的 Helios
    高能转移级，向商业、民用和防务载荷出售发射后的轨道间运输服务。公开证据显示，公司已经通过三次 Mira 任务积累真实飞行履历，政府和商业需求在增长，也反复获得顶级风险投资支持；但公司仍是私营企业，核心财务转化指标披露不足。
