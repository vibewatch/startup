  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式、定价面与公开牵引缺口
        blocks:
          - type: paragraph
            body: >-
              公开证据足以识别 Impulse 卖什么，但不足以知道它收多少钱。收入模式有四个可见面。第一，Helios 被营销为专用高能运输服务，面向需要从 LEO 快速移至
              MEO、GEO、地月或逃逸轨道的载荷。第二，Mira 作为托管、部署和机动航天器出售给需要轨道机动或近距离操作的载荷运营商。第三，Caravan 和 GEO
              拼车项目把较小载荷聚合进共享高能任务。第四，政府工作通过 SBIR、STRATFI
              和任务支持奖项，增加一条独立合同收入流。缺失的是公开价目表：本次审阅的来源没有披露按任务收费、最低合同价值、载荷舱位定价，或标准标价与实际成交价。


              公司转而通过任务结果来出售经济性。SES 强调在数小时而非数月内到达 GEO，可更快启用服务并降低卫星质量。Astranis 强调避免长时间电推进转移风险。Space Network Services
              强调以专用发射成本的一小部分进入 GEO，并保留清单灵活性。这些都是真实的变现信号，但它们是价值主张信号，不是收入确认披露。投资人能梳理产品目录和买方痛点；但仍无法对标
              ACV、服务组合、折扣纪律，或收入主要按里程碑、按任务，还是按签约舰队服务周期性确认。
