          - type: callout
            title: 关键未知：Series D 确切结构及其下方收入基础
            body: 核心尽调风险不是技术想象力，而是股东经济性。没有条款清单、股权结构表、收入桥、毛利状况和烧钱率，报道中的溢价私募估值可以在方向上有参考价值，但对新资金承销仍完全不可用。
            calloutType: risk
            claimRefs:
              - CV010
