  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议：需求已有真实证明，但公开证据仍无法支撑价格
        blocks:
          - type: paragraph
            body: >-
              Impulse 已不再是纯概念公司。到 2026 年 6 月，它已宣布 $500 million Series D、累计资本超过 $1 billion、三次已飞任务、多个具名商业客户、国家安全伙伴关系，以及一条从
              LEO 机动延伸到 GEO
              转移的路线图。这组组合很重要，因为公司已经越过了从鼓舞人心的创始人故事到具备可见客户拉力业务的门槛。投资问题不在于有没有信号，而在于公开记录能否支撑本轮价格。在这个问题上，答案仍是否定的。已抓取的一级来源和主流来源证实了融资规模和战略势能，但没有披露已确认收入、毛利率、月度烧钱、签约合同转化为收入的情况，或
              Series D 的确切优先权结构。这些缺失输入才决定溢价私募标记是合理还是仅仅被容忍。因此，合适立场是继续研究；不是因为 Impulse
              缺乏技术或客户证明，而是因为公开证据对订单和任务的证明远强于对经济性和股东结果的证明。
