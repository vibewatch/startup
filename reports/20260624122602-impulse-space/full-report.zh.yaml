      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >-
              正面情景并不难看见。Impulse
              有真实产品面、重复任务历史、具名商业客户、政府奖项，以及按保守公开阅读已跨过十亿美元门槛的融资基础。这明显好于一家发射前或单次任务创业公司拿概念去卖。公司也已经展示了足够公开牵引，说明在轨机动是一个商业类别，而不是科学项目：SES、Astranis、Space
              Network Services 和 Space Force 都证明，只要系统表现达标，买方会为速度、机动性或响应性付费。


              负面情景同样清楚。已审阅记录仍未披露收入、ARR、毛利率、CAC、回本期、现金、消耗、资金跑道、营运资本条款或客户集中度。LEO Express 3
              也说明执行风险仍然重要：公司披露星跟踪器问题阻止了该任务的主发动机点火，即便客户运营仍在继续。New Space Economy
              的批评方向上是对的：一家垂直整合的机动业务必须持续证明硬件和运营，同时建设一个仍未完全标准化的市场。因此，投资结论是平衡但不完整的：资本充足性方向上强，收入质量看起来合理，公开财务透明度仍太薄，无法硬承销。
