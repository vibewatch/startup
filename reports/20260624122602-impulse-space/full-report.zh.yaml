      - number: '2.3'
        title: 买方、用户、付款方和采用路径因轨道而大幅不同
        blocks:
          - type: paragraph
            body: >-
              Impulse 没有一条通用买方旅程。在商业 GEO 和 MEO 细分里，买方和付款方是 SES
              这样的卫星运营商，它们关心寿命延长、收入加速，以及避免缓慢电推进变轨带来的机会成本。在这种情况下，最终用户是卫星网络运营商，但经济决策由优化发射、质量和投入服务时间的舰队所有者做出。在商业空间站细分里，客户可以是购买推进子系统而非运输任务的空间站开发商；Vast
              选择 Impulse 用于 Haven-1
              表明，相关预算负责人可能坐在空间站设计和集成环节，而不只是在发射清单办公室。在防务细分里，买方和付款方是使用拨款预算推进战术响应航天、空间态势感知、加注和在轨物流概念的政府机构。Impulse 的 $34.5
              million Victus Surgo 和 Victus Salo 工作，加上 SSC 对可重复使用、可加注 OTV 的明确征集，说明政府需求已经具体到足以资助任务演示。


              采用路径同样是机构驱动，而非消费者驱动。NASA 文件解释，拼车已经成为小型航天器的热门进入模式，OTV 占据了近似释放轨道与工作轨道之间的最后一公里层。这天然适合 Impulse
              切入：拼车到停泊轨道，拖船转移到目标轨道，然后进行托管运营或部署。但路径受采购结构约束。GEO
              运营商需要一套在时间和寿命上胜过现状的任务架构。防务买家需要证明机动性和预置资产能提高战术响应能力。月球买家通常位于主承包商之后，CLPS 已经说明这一点。标准化产品叙事也很重要：Impulse
              自己的拼车菜单和反复出现的 Mira 用例，暗示公司正从一次性工程项目转向可重复的进入产品；但公开证据仍未展示规模化、已披露的订单积压和利用率数据。
