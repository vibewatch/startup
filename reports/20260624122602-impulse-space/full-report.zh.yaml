  - id: FE002
    title: 客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 从选择发射服务到最终在轨服务交付的典型运营商工作流。
    data:
      nodes:
        - id: n1
          label: 载荷列入发射清单
          detail: 客户根据质量、目的地和进度，选择专属、共享或拼车接入。
          type: step
        - id: n2
          label: 发射至 LEO
          detail: 中型运载火箭执行任务中成本最低或最可得的第一段。
          type: step
        - id: n3
          label: 转移至目标轨域
          detail: 需要时，Helios 在 LEO 入轨后点火，快速转移至 GEO、MEO、月球转移轨道或逃逸级轨道。
          type: step
        - id: n4
          label: Mira 部署 / 托管 / 重新定位
          detail: Mira 处理最后一程投放、托管运行、载荷任务派发或响应式机动。
          type: step
        - id: n5
          label: 运行载荷任务
          detail: 客户载荷执行成像、SDA、演示或通信任务，同时由 Mira 或托管软件管理空间站运行。
          type: step
        - id: n6
          label: 重新派发或处置
          detail: 任务可增加重新定位、RPO，或针对 GEO 任务执行墓地轨道退役等负责任处置。
          type: step
    claimRefs:
      - CE001
      - CE005
      - CE026
      - CE030
      - CE032
      - CE035
    approximationNotes: 流程从 SES、TacRS、GEO RPO 和 LEO Express 用例泛化而来；实际任务序列会随载荷和轨道变化。
  - id: FE003
    title: 关键依赖地图
    type: dag
    layout: wide
    summary: 将产品执行与发射、设施和伙伴就绪度绑定在一起的关键依赖。
    data:
      nodes:
        - id: d1
          label: 发射伙伴
          detail: SpaceX 和其他中型运载服务商，是 Mira 拼车任务和 Helios 转移任务都需要的条件。
          type: dependency
        - id: d2
          label: Boulder GNC 与阀门制造
          detail: Colorado 场地承载 GNC 领导团队、测试台、CNC 加工，以及 Helios 阀门 / Deneb 泵组件工作。
          type: dependency
        - id: d3
          label: Mojave 推进测试环境
          detail: Deneb 研发和发动机测试进展，绑定在 Impulse 的推进基础设施上。
          type: dependency
        - id: d4
          label: 伙伴集成层
          detail: Exolaunch、SES、Starfish、Anduril、HEO 和其他载荷伙伴提供市场进入路径和任务内容。
          type: dependency
        - id: d5
          label: 政府任务拉动
          detail: TacRS、VADR 和其他公共部门项目，是关键需求与验证渠道。
          type: dependency
        - id: d6
          label: Terran R / 未来重型运载选项
          detail: 火星和 LEO 以外邻近机会，依赖非 Impulse 发射进度和就绪度。
          type: dependency
      edges:
        - from: d1
          to: d4
          label: 发射时间约束客户交付
        - from: d2
          to: d3
          label: 内部硬件与推进研发相互强化
        - from: d2
          to: d5
          label: 政府任务依赖 GNC 和质量成熟度
        - from: d3
          to: d1
          label: Deneb 就绪度卡住 Helios 发射活动
        - from: d4
          to: d5
          label: 伙伴载荷帮助把演示转化为运行需求
        - from: d6
          to: d4
          label: 火星和 LEO 以外邻近机会依赖发射器就绪
    claimRefs:
      - CE003
      - CE038
      - CE039
      - CE040
      - CE041
