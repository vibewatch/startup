  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 对 Impulse 的影响
      - 尽调问题
    rows:
      - - 高推力、多角色舰队宽度
        - 相邻专业公司增加运输能力，或主承包商把机动内化
        - 高
        - 宽度当下有帮助，但打包风险会侵蚀差异化
        - 要求按任务类型提供客户赢单 / 输单数据，以及买方为何选择 Impulse 而非内部自建
      - - 快速转移和机动性
        - D-Orbit 和 Momentus 提升节奏或定价；Starfish 证明自主服务“够用”
        - 中
        - Impulse 可能需要让速度在经济上成立，而不只是技术上成立
        - 要求提供任务时间线、变轨性能，以及按客户原型划分的到达运营价值时间
      - - 合作伙伴生态入口
        - Orbit Fab、HEO 或 Infinite Orbits 等合作伙伴建立足够品牌和接口后，可能把 Impulse 压成运输劳动力
        - 中高
        - 合作伙伴带来的宽度可能反转为平台依赖
        - 要求提供排他性、接口所有权和后续经济性的合同条款
      - - 未来加注网络效应
        - Orbit Fab 或其他接口所有者标准化仓库，并掌握定价权
        - 高
        - 运输飞行器可能围绕他人的燃料标准被商品化
        - 要求提供 Impulse 原生加注路线图、接口策略和仓库互操作性
      - - GEO 信誉扩张
        - Astroscale、Northrop、Infinite Orbits 和 Starfish 在 Helios 扩大规模之前抢占 GEO 服务叙事
        - 高
