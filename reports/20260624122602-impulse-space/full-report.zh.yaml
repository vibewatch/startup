  - id: TV005
    title: 论点破裂与否决触发项表
    columns:
      - 触发项
      - 阈值
      - 对论点的传导
      - 行动含义
    rows:
      - - Helios 商业进度破裂
        - 到 2028-06-30 仍未完成商业高能任务。
        - 近端轨道机动平台论点在时间上失效，高溢价私募定价失去核心催化剂。
        - 暂停新资金，只基于实际收入证据重建投资案例，而不是路线图叙事。
      - - 需求宽度破裂
        - 下一次融资事件前，SES 和 Astranis 之外没有披露新的商业 Helios 客户。
        - 客户需求仍过窄，无法支撑平台式稀缺性定价。
        - 把公司视作定制项目故事，而不是规模化机动平台。
      - - 融资条款破裂
        - 下一轮融资是降价轮，或使用 ratchet、pay-to-play 等结构来修补此前定价。
        - 即便技术执行还在继续，估值支撑已经在私人市场失效。
        - 在完全建模清算瀑布和治理影响前，避免投入新资金。
      - - 披露破裂
        - 管理层在下一次融资或二级交易流程中仍不披露收入、毛利率和净现金消耗。
        - 无论任务或媒体声量如何，公司在经济性上仍无法承销。
        - 维持只研究状态，不把任何私人估值标记转化为预期回报。
      - - 锚定项目破裂
        - Helios 爬坡前，SES、Astranis 或可比 Helios 客户推迟、取消或明显缩小旗舰任务。
        - 商业验证从平台采用变成孤立试点。
        - 立即重切牛市 / 基准假设，并假设下一轮融资议价能力更弱。
    notes: 这些触发项设计为可从具体运营、融资和披露事件中监测，而不是依赖模糊情绪变化。
