      - number: '1.3'
        title: 融资历史、投资方与规模
        blocks:
          - type: paragraph
            body: >-
              Impulse 的融资方式更像一家资本密集型基础设施公司，而不是狭窄的软件创业公司。公开披露轮次始于 2022 年 3 月由 Founders Fund 领投的 $20 million 种子轮，2022 年 6
              月又加入 Lux Capital 的 $10 million 延展融资，随后依次完成 2023 年 RTX Ventures 领投的 $45 million Series A、2024 年 Founders
              Fund 领投的 $150 million Series B、2025 年 Linse Capital 领投的 $300 million Series C，以及 2026 年 6 月的 $500 million
              Series D。按公司自身口径，这条路径让累计融资从 2022 年的 $30 million 增至 2026 年中超过 $1
              billion。投资方组合也随时间从前沿技术投资者扩展到更大的财团，纳入防务相关和后期成长投资者。官方材料把这种融资强度归因于合同动能和制造规模：Helios 和 Mira
              都需要推进测试、航电集成和产能建设，而客户管线横跨民用、商业和国家安全任务。本节最大的保留项是估值透明度。二级报道把 Series D 估值放在约 $4.26 billion，但 Impulse
              没有在自己的新闻稿中给出该数字，因此估值应被视为报道估算，而非公司确认事实。
