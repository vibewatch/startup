      - number: '7.4'
        title: 人员集中与明确 kill criteria 应主导尽调
        blocks:
          - type: paragraph
            body: >-
              Impulse 的人员风险不只是泛泛的创始人依赖。公司明确围绕 Tom Mueller 的推进声誉做市场传播，公开班底仍很紧凑：Mueller、Eric Romo
              和少数高级职能负责人。创业早期这可以是优势，但当同一小团队必须同时招聘、验证新推进硬件、扩张制造、拿下政府和商业项目，并把任务演示转成可重复服务业务时，它会变成扩张风险。TechCrunch 报道 Series
              D 支持多达 200 人招聘，也强化了一个判断：组织仍处在高强度建设期，而不是稳态执行期。


              投资人该看的不是泛泛谨慎，而是 kill criteria。第一，Helios 必须按时真正飞起来，并证明客户所引用的价值主张：比重型发射或电推进替代方案更快、更便宜地抵达
              GEO。第二，载荷审批、出口管制和保险流程必须在具体任务文件中体现，而不只是框架页面。第三，公开管线必须突破 SES、Astranis
              和政府原型项目；否则公司可能仍是定制任务集成商，而不是规模化机动平台。第四，管理层必须证明制造扩张和招聘正在转化为节奏，而不只是更高烧钱。


              公开记录没有足够深入地展示烧钱、供应商组合、诉讼状态或合同经济性，无法关闭这些问题。因此，审慎姿态不是否定公司的技术承诺，而是在假设当前叙事能顺畅复利成耐久经济性之前，要求公司先证明排期、审批、经常性需求和组织深度。
