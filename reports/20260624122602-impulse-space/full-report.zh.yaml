      - number: '2.5'
        title: 尽调仍未解决的问题
        blocks:
          - type: paragraph
            body: >-
              核心尽调问题不是 Impulse 是否面对一个活跃市场。答案显然是肯定的。未解决的问题是，这个市场有多少会在对承销有意义的时间框架内转化为可重复、已披露的收入。本次审阅的公开来源都没有披露 Mira 或
              Helios 的标准定价、利用率假设或按飞行器划分的订单积压，也没有发布按轨道或客户细分自下而上的 SAM/SOM。这使商业论证依赖方向性证据——产品宽度、参考客户、防务合同和分析师
              TAM——而不是从市场规模到已签收入的公开桥梁。


              第二个未解决问题是可互操作性。防务和分析师来源明确表示，depot、加注和可重复使用 OTV 网络很有吸引力，但公开证据仍未显示共享接口或广泛的多供应商运营标准。月球需求今天也只能部分转化：CLPS 证明
              NASA 是真实买家，但还没有证明这笔支出有多少流向转移层供应商，而不是着陆器主承包商。因此，尽调的正确结论是受约束但建设性的：Impulse
              指向几个可信的轨道物流需求池，尤其是防务机动和更高能量商业转移；但公开数据仍不支持干净的公开 SOM，也不支持成熟的网络经济模型。
            claimRefs:
              - CM010
              - CM014
              - CM027
              - CM028
              - CM041
