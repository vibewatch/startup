      - number: '7.2'
        title: 发射供应商、任务可靠性和制造扩产风险仍然尖锐
        blocks:
          - type: paragraph
            body: >-
              最重要的运营风险是，Impulse 的商业承诺仍依赖一条狭窄的发射和硬件链。公开披露的近端任务高度依赖 Falcon 9：Impulse 称已签署从 2026 年开始的三次 Falcon 9
              发射，首个轨道任务使用 SpaceX Transporter-9，Astranis 的 2027 年直接注入 GEO 任务也从 Falcon 9 开始，SES 首个公布任务则先由中型运力发射到 LEO，再由
              Helios 接手。这套架构在战略上合理，但意味着 Falcon 9 可用性、拼车时点或任何发射供应商停飞，都可能直接传导到 Helios 客户交付日期。


              Helios 本身是第二道闸门。公司宣传用一台 Deneb 发动机在不到一天内把超过 5 吨从 LEO 送到
              GEO，但公开证据仍指向首飞阶段，而不是经常性在轨服务阶段。因此可靠性和取证风险是真实的，不是理论上的。Mira 的公开履历更强：Impulse 称其已飞行验证，引用 LEO Express 1 和 LEO
              Express 2 的避碰证据，Starfish 的 Remora 任务也证明 Mira 硬件能支持近距离运行。不过，托管载荷、加注和 RPO 都会成倍增加复杂度，因为它们压缩排期和安全容忍度。


              制造风险是第三条腿。Impulse 称飞行器很大一部分自制，现在拥有 Mojave 推进测试能力和 Colorado 硬件设施，但垂直整合可能只是转移瓶颈，而不是消除瓶颈。如果
              Deneb、Saiph、航电或贮箱在公司内部实际上仍是单一来源，排期滑坡会先表现为测试或生产延误，远早于客户流失。
