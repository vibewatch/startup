      - number: '6.4'
        title: 留存、扩张与集中度风险
        blocks:
          - type: paragraph
            body: >-
              公开耐久性证据不是零，但仍不完整。HEO 是最清晰的复购案例：它在 2024 年把与 Impulse 的关系描述为长期伙伴关系的第一步，随后在 LEO Express-2 搭载 Holmes-007，又在 LEO
              Express-3 带着 Holmes Mk2 回来。FOSSA Systems 是次强复购信号，从 LEO Express-2 已部署的 TAT-0 载荷，发展到 LEO Express-3 上的另外三颗
              CubeSat。SES 也给出扩张信号，因为其协议明确允许首个专用 Helios 飞行之外的更多任务。这些早期指标不错，说明任务跑通后客户会回来。


              但公开记录距离完整留存证明还差很远。所审阅来源没有披露 NRR、GRR、续约率、流失率、合同期限或头部客户集中度。这一点很重要，因为几项最大的头条胜利——SES、Astranis、VICTUS
              SURGO、VICTUS SALO、STRATFI 支持的 Helios 工作——仍是前瞻性的，并且经济上可能集中。SpaceX 渠道依赖进一步放大风险：迄今每次公开飞行都使用 SpaceX
              Transporter 任务，公开 Helios 管线也提到 Falcon 9 或未来 SpaceX 拼车。最后，LEO Express-3 的推进短缺和 LEO Express-1
              的避碰机动证明了真实飞行履历存在，但也提醒投资人，高机动任务的运行难度很高。正确表述不是客户牵引弱，而是部署证明在已经飞过的 Mira 上最强，复现能力、收入集中度和发射伙伴韧性仍披露不足。
