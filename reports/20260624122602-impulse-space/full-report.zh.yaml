      - number: '8.3'
        title: 可比公司与情景框架：正确结论是区间，不是假精确
        blocks:
          - type: paragraph
            body: >-
              Impulse 没有干净的公开可比公司，因为没有上市公司同时具备轨道转移、高能量 kick-stage 运输，以及这套商业和国防伙伴需求组合。因此，可比练习只能用来框定边界，而不是定价公式。Rocket Lab
              是溢价上限参考，因为它展示了投资人愿意为拥有真实收入和积压订单的垂直整合空间平台拉伸到什么程度。Redwire 是更接地气的硬件与服务底部，因为它已上市、资本密集，并且更接近传统航空航天经济性。Planet
              不是运营类比，但它仍有用：当软件和数据叙事很强时，公开市场有时会给太空公司高销售倍数。Momentus
              是下行情景压力案例，因为它说明，当收入很小且资本依赖持续存在时，一个名义上有意思的机动论点几乎没有保护。结果很直接：公开可比分散度太宽，除非 Impulse 披露底层收入基础，否则无法验证 2026
              年私募价格。因此，本章使用牛市、基准和熊市估值区间，并拒绝仅凭公开证据把报道的 2026 年 6 月标记转换成确定性回报模型。
