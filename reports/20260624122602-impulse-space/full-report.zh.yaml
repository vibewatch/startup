  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 为什么重要
      - 负责人或尽调路径
    rows:
      - - Series D 条款清单
        - 确切投后估值、每股价格、清算优先权结构、反稀释保护，以及任何 ratchet。
        - 如果优先权结构或保护条款不利，高溢价头部估值仍可能是糟糕的新资金入口。
        - 管理层、领投方或融资律师数据室。
      - - 收入和利润率质量
        - 当前已确认收入、按产品线划分的毛利率，以及客户集中度。
        - 这些是用公开可比公司检验任何私募轮次标记所需的最低输入。
        - CFO 材料包和最新董事会材料。
      - - 订单到收入桥接
        - 按客户划分的合同价值、已获资金与未获资金部分、取消权，以及收入确认时点。
        - 公开公告证明势头，但只有转化数据能证明经济性。
        - 商业运营审查加合同排期。
      - - 烧钱和资金续航
        - 月度现金消耗、Helios 爬坡的资本开支需求，以及 Series D 交割后的现金余额。
        - 即便公司持续达成里程碑，资本强度也决定稀释风险。
        - 资金模型和月度现金流量表。
      - - Helios 任务就绪
        - 首批商业任务的制造节奏、测试完成度、发射集成计划和客户就绪关口。
        - 进度是最大的单一估值解锁点，也是最干净的论点破裂触发项。
        - 与工程、运营和发射伙伴接口一起做项目审查。
    notes: 这些问题是把强劲公开叙事转成可投资、价格敏感承销文件所需的最低集合。
    claimRefs:
      - CV043
      - CV044
      - CV048
      - CV056
      - CV060
      - CV061
      - CV062
