  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 格局边界：直接拖船同行、服务既有玩家与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              不应把 Impulse 放进一个无差别的“太空物流”篮子里对标。保留证据至少把这一领域拆成五层。第一层是直接的发射后机动同行，它们用自有飞行器出售变轨或托管载荷能力：D-Orbit 和 Momentus
              是最清晰的公开类比；当任务需要自主服务而不只是部署时，Starfish 也相邻。第二层是 GEO 寿命延长和服务专家，如 Infinite Orbits、Astroscale 和 Northrop
              SpaceLogistics。第三层是 Orbit Fab 这样的基础设施玩家：如果加注标准变得通用，它今天可以是补充方，明天可以成为议价权中心。第四层是 HEO 和 ThinkOrbital
              这样的邻近功能提供商，它们可以被打包进服务架构，但尚不是独立拖船供应商。第五层是现状：直接入轨、星上电推进、较慢变轨，或把推进和服务功能内置到主承包商自有航天器中。这套分类很重要，因为 Impulse
              最强的直接重叠仍在拖船层，而长期最拥挤的区域围绕 GEO 服务、检查和加注。买方仍可混合搭配这些层，而不是锁定一个垂直整合网络；这让多归属仍然现实，也削弱了“该类别已经赢家通吃大半”的说法。
