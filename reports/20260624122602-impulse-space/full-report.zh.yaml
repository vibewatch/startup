        title: Mira 架构与已演示的机动栈
        blocks:
          - type: paragraph
            body: >-
              Mira 是公司已验证的飞行器，也是技术团队能快速设计、发射、运营并迭代航天器的最清晰证据。公开材料描述了一种化学推进飞行器，配有八台 Saiph
              推进器、冷气姿控推进器、内部反作用轮，以及为托管载荷运营而非裸转移配置的无线电。基线飞行器已支持有意义的载荷质量和精指向需求；面向 GEO 的升级版则加入抗辐射航电、可展开和万向阵列、更多
              delta-v，以及在轨软件定义重构。最强技术证明不是宣传册，而是飞行记录。LEO Express 2 展示了重复点火、托管载荷运营和 Remora 自主交会任务。LEO Express 3 增加了载荷活动和
              Helios 航电履历，但也暴露了星跟踪器调试问题，迫使任务转入替代姿态控制模式，并消耗了大部分一氧化二氮预算。这种已证明敏捷性与可见异常处理的组合，让 Mira 对更高能量任务显得可信，但还未常态化。
