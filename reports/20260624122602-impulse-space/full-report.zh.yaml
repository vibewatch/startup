        - from: parking
          to: transfer
          label: Impulse 靠最后一程轨道机动或子系统支持创造价值
        - from: transfer
          to: ops
          label: 轨道或飞行器状态修正后，载荷进入运行使用
        - from: ops
          to: repeat
          label: 运行价值被证明后，支撑重复任务或产品化
