      - number: '1.2'
        title: 领导层、治理与团队规模信号
        blocks:
          - type: paragraph
            body: >-
              领导层高度围绕创始人展开。凭借 SpaceX 推进系统背景，Tom Mueller 仍是公司的公众面孔、技术起源叙事和创始人-市场匹配的核心来源；Eric Romo 则在当前官方材料和独立报道中都被列为
              President and COO。公开领导层页面显示，公司的职能深度超过“两个人物叙事”：工程、航电、航天器项目、财务、自主系统、制造、业务拓展、法务和政府事务都有具名负责人。这种宽度很重要，因为
              Impulse 正在扩张一门重硬件业务，需要同时拿到政策入口、客户集成能力和制造纪律。治理可见度弱于运营可见度。公司在 2024 年 2 月公开宣布 General John W. Raymond
              加入董事会，但本次审阅的官方来源没有发布更完整的董事会名单。这本身不代表治理薄弱，却让外部投资人看不清董事会独立性、委员会结构或创始人控制权。团队规模可见度也参差：访问日招聘页面显示 152
              个开放职位，Series D 新闻稿称过去一年员工数翻倍以上，SpaceNews 报道约 500 名员工。因此，精确员工数仍只能部分验证。
