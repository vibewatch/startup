      - number: '2.4'
        title: 采用驱动与约束：更多发射有帮助，但网络经济性仍要算得过账
        blocks:
          - type: paragraph
            body: >-
              乐观情景从发射量和政策开始。NASA 报告称，2025 年发射的航天器同比增长近 60%，达到 4,577，较重的 SmallSat
              类别也在增长。这很重要，因为更多拼车和专用发射活动扩大了可能需要释放后最后一公里轨道投放的任务池。NASA 还记录到，拼车已成为热门模式，并强调 OTV 在部署和托管运营中越来越常见。买方侧，Mordor
              的市场视角显示，政府和军方客户仍占当前支出近一半，而商业运营商预计增长更快。这一画像与 Impulse 的公开组合相匹配：商业 GEO 买家、空间站开发商和商业拼车载荷，叠加近期以战术响应航天和未来 depot
              式物流为锚的政府需求。Space Force 公开规划加注、太空拖船以及最终的在轨物流架构，进一步强化了这一驱动。


              约束同样重要。NASA 明确指出，拼车用户会继承排期和轨道耦合，必须自行取得许可，并在通信、部署和危险材料方面受到“do no harm”限制。专用发射解决部分精度问题，但成本更高、频次更低。SSC
              自己的挑战陈述显示，depot 式网络要规模化运转，还需要验证燃料处理、加注接口、长期储存和准确推进剂计量。Mordor 又加入了创业公司经济性的约束：一艘轨道服务航天器在配套基础设施和保险叠加前，成本可能约
              $50 million 到 $200 million。合在一起，结论是市场有真实需求拉动，但操作系统仍在形成：更多发射和更强防务条令让 Impulse
              更相关，可互操作性、资本强度和任务设计摩擦仍可能让实际采用低于标题 TAM。
