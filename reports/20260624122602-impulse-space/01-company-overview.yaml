- id: funding-capitalization
  title: Funding History, Investors, and Scale
  body: 'Impulse has financed itself like a capital-intensive infrastructure company rather than a narrow software startup. Publicly disclosed rounds started with a $20 million Founders Fund-led seed in March 2022, added a $10 million Lux Capital extension in June 2022, and then stepped through a $45 million RTX Ventures-led Series A in 2023, a $150 million Founders Fund-led Series B in 2024, a $300 million Linse Capital-led Series C in 2025, and a $500 million Series D in June 2026. On the company’s own figures, that path took total capital raised from $30 million in 2022 to more than $1 billion by mid-2026. The investor mix also widened over time from frontier-technology backers into a larger syndicate including defense-adjacent and later-stage growth investors. Official materials highlight contract momentum and manufacturing scale as the reason for that financing intensity: Helios and Mira both require propulsion testing, avionics integration, and production buildout, while the customer
    pipeline spans civil, commercial, and national-security missions. The biggest caveat in this section is valuation transparency. Secondary reporting placed the Series D valuation near $4.26 billion, but Impulse did not state that figure in its own release, so valuation should be treated as a reported estimate rather than a company-confirmed fact.'
