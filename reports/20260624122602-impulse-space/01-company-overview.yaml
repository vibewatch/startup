- id: leadership-governance
  title: Leadership, Governance, and Team Scale Signals
  body: 'Leadership is highly founder-centered. Tom Mueller remains the public face, technical origin story, and core source of founder-market fit thanks to his SpaceX propulsion pedigree, while Eric Romo is the named President and COO in both current official materials and independent coverage. Publicly available leadership pages show broader functional depth than a two-person narrative would imply: engineering, avionics, spacecraft programs, finance, autonomous systems, manufacturing, business development, legal, and government affairs all have named leaders. That breadth matters because Impulse is scaling a hardware-heavy business that needs policy access, customer integration, and manufacturing discipline at the same time. Governance visibility is thinner than operating visibility. The company publicly announced General John W. Raymond joining its board in February 2024, but the reviewed official sources did not publish a fuller board roster. That does not imply weak governance by itself,
    yet it leaves outside investors without a clear picture of board independence, committee structure, or founder control. Team-size visibility is also mixed: the careers page showed 152 open positions on the access date, the Series D release said headcount more than doubled over the past year, and SpaceNews reported about 500 employees. The exact employee count therefore remains only partially verified.'
