callouts:
- calloutType: strength
  title: Rare combination of flight heritage and capital access
  body: 'Impulse has an unusual chapter-one profile for a space infrastructure startup: three flown Mira missions, anchor commercial and government counterparties, and more than $1 billion of disclosed capital by June 2026. That combination gives it more real operating proof than many orbital-transfer peers that still rely primarily on concept art, slideware, or single-mission plans.'
  claimRefs:
  - CO023
  - CO026
  - CO034
  - CO036
  - CO037
- calloutType: risk
  title: Helios is the company’s largest value driver and largest execution risk
  body: The funding story assumes Helios can graduate from a strong concept into a reliable high-energy service. Yet public materials moved the first-flight target from 2026 to 2027, and LEO Express 3 disclosed a real mission anomaly on Mira. If Helios slips further, commercial GEO demand and government responsiveness use cases could both take longer to monetize than the current valuation implies.
  claimRefs:
  - CO029
  - CO031
  - CO032
  - CO033
- calloutType: insight
  title: Disclosure quality lags funding scale
  body: Impulse is easy to map on financing, product messaging, and mission chronology, but harder to map on exact board composition, exact employee count, and revenue conversion of its contract base. For a company already reported at a multibillion-dollar valuation, those missing data points should be treated as normal private-company opacity, not as solved diligence items.
  claimRefs:
  - CO012
  - CO015
  - CO025
  - CO044
