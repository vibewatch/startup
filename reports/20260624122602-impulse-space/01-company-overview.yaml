- id: milestones-partnerships-risks
  title: Milestones, Partnerships, and Adverse Signals
  body: 'The milestone record is strong enough to show real execution, but not clean enough to remove program risk. Official timeline materials show the company moving from founding in 2021 to seed funding in 2022, Series A and a Redondo Beach headquarters move in 2023, Series B and major government traction in 2024, Series C plus LEO Express 2 and LEO Express 3 in 2025, and then a Series D, Colorado expansion, and a Washington, D.C. office in 2026. Commercial validation also improved: SES became the first dedicated Helios customer, NASA selected Impulse for orbital-transfer studies, and U.S. defense agencies funded tactically responsive space work. Still, this chapter should not overstate maturity. LEO Express 3 disclosed a real flight anomaly when noisy star trackers consumed most of the vehicle’s propellant margin, and official materials shifted Helios’ first-flight expectation from 2026 to 2027 over the course of a year. At the market level, maneuverable-spacecraft businesses also sit
    inside a tougher policy environment as orbital congestion, debris mitigation, and autonomy scrutiny all rise. TIME and Nature are not adverse to Impulse specifically, but they are adverse to the permissive operating assumptions that many mobility companies implicitly depend on. For diligence, the positive takeaway is rare flight heritage; the caution is that scaling into GEO and defense-adjacent RPO work will be a much harder test than proving three Mira missions in LEO.'
