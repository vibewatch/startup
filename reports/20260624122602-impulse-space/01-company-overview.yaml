company:
  name: Impulse Space
chapter:
  number: 1
  title: Company Overview
  summary: Impulse Space is a 2021-founded Redondo Beach in-space mobility company built around Tom Mueller’s propulsion pedigree, three flown Mira missions, and more than $1 billion of disclosed capital by June 2026. The company shows unusually strong fundraising and government/commercial traction for a mobility startup, but Helios schedule slip, incomplete public governance disclosure, and rising orbital-sustainability scrutiny remain important chapter-one risks.
sections:
- id: identity-business-model
  title: Identity, Mission, and Business Model
  body: 'Impulse Space was founded in 2021 by Tom Mueller to solve a problem that begins after launch: once rockets drop payloads into an initial orbit, customers still need fast, precise mobility to the orbit where the mission creates value. Official company materials consistently frame the business as in-space mobility rather than launch, with Mira handling hosting, deployment, and maneuvering missions and Helios designed for faster transfer to higher-energy orbits. The company also emphasizes vertical integration — designing, building, and testing most core hardware in house — as a way to compress development cycles and control mission reliability. That operating model is anchored in Redondo Beach, California, where Impulse says its headquarters and main production footprint sit, alongside Mojave test infrastructure and later Colorado and Washington expansions. The current commercial message is broad: sell post-launch logistics, hosted payload services, and high-delta-v transfer capability
    across commercial, civil, and defense customers. By the June 2026 Series D release, the company was also claiming three flown missions and hundreds of millions of dollars in customer contracts, which gives the overview chapter a usable operating baseline even if revenue remains undisclosed.'
