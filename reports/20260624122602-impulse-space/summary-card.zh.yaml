  topStrengths:
    - 三次 Mira 任务和多个具名客户结果提供了真实在轨执行证据，这在轨道转移创业公司中并不常见。
    - 创始人与市场匹配度很突出：Tom Mueller 拥有 SpaceX 推进背景，现任领导层也覆盖推进、制造、自主系统和政府事务。
    - SES、Astranis、Vast、Starfish、Space Force VICTUS 项目，以及累计超过 $1 billion 的资本支持，让商业和政府需求可见。
    - 拼车发射持续把载荷送入非最终轨道，商业模式切中的正是发射后机动这个真实痛点。
  topRisks:
    - 公开来源没有披露确认收入、毛利率、现金消耗、跑道或优先权堆栈细节，估值背后的经济性无法承销。
    - Helios 仍处于收入前阶段，且对进度敏感；公开材料已把首飞预期从 2026 年推到 2027 年。
    - 客户集中度和发射渠道集中度看起来很重：SpaceX 是唯一有公开记录的已飞行发射路径，多个旗舰项目仍是未来预订而非已交付。
    - 任务执行风险是真实存在的：LEO Express 3 完成了客户作业，但星跟踪器问题阻止了主推进器点火。
  unresolvedGaps:
    - 精确确认收入、毛利率、订单到收入转化率和现金消耗仍未披露。
    - Series D 的精确投后估值、股价、清算优先权和任何棘轮条款，尚未由一手公开证据确认。
    - 客户集中度、续约行为和头部账户敞口仍没有公开量化。
    - Helios 首次商业服务时间和 2027 年之后的任务准备度，仍是关键尽调项。
