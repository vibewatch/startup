- id: retention-expansion-and-concentration
  title: Retention, Expansion, and Concentration Risk
  body: |-
    Public durability evidence is better than zero but still incomplete. HEO is the clearest repeat case: it described the Impulse relationship in 2024 as the first step in a long-term partnership, then flew Holmes-007 on LEO Express-2 and returned with Holmes Mk2 on LEO Express-3. FOSSA Systems is the next-best repeat signal, moving from a deployed TAT-0 payload on LEO Express-2 to three more CubeSats on LEO Express-3. SES also provides an expansion signal because its agreement explicitly allows additional missions beyond the first dedicated Helios flight. Those are good early indicators that customers will come back when a mission works.

    However, the public record stops well short of full retention proof. None of the reviewed sources disclose NRR, GRR, renewal rates, churn, contract length, or top-customer concentration. That matters because several of the biggest headline wins — SES, Astranis, VICTUS SURGO, VICTUS SALO, STRATFI-supported Helios work — are still forward-looking and may be economically concentrated. SpaceX channel dependence compounds that risk: every public flight to date used a SpaceX Transporter mission, and the public Helios pipeline also references Falcon 9 or future SpaceX rideshares. Finally, LEO Express-3’s propulsion shortfall and LEO Express-1’s collision-avoidance maneuver demonstrate that real flight heritage exists, but they also remind investors that high-maneuver missions are operationally demanding. The right framing is not that customer traction is weak; it is that deployment proof is strongest where Mira has already flown, while repeatability, revenue concentration, and launch-partner resilience remain under-disclosed.
