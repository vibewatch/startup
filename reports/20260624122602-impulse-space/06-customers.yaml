chapter:
  number: 6
  title: Customers
  summary: Impulse Space has credible customer proof on flown Mira missions and a growing queue of named 2027 Helios customers, but most high-value Helios revenue is still forward-booked rather than delivered. Repeat proof exists for HEO and FOSSA, while government traction is strongest in SSC’s VICTUS missions; concentration and partner-dependence risk remain hard to size because SpaceX is the dominant channel and Impulse does not disclose renewal or top-customer mix.
sections:
- id: segmentation-and-channel
  title: Customer Segmentation and Channel Structure
  body: |-
    Impulse’s public customer base breaks into four practical buckets: (1) hosted-payload and deployment customers flying on Mira in low Earth orbit; (2) future high-energy delivery customers buying Helios access to GEO or MEO; (3) space-infrastructure and servicing partners using Mira or Helios for a specific subsystem, refueling, or autonomy mission; and (4) U.S. government buyers or procurement vehicles testing responsive-space and orbital-logistics concepts. The strongest public proof today comes from the first bucket, because those customers are attached to flown Transporter missions with named payload outcomes. TrustPoint, FOSSA Systems, SatRev/RIDE!, HEO, Starfish, Samara, and Zenno all have mission-specific evidence tied to Mira operations rather than logo-wall marketing.

    The second bucket is commercially meaningful but still largely forward-booked. SES and Astranis both signed 2027 Helios missions; SES’s deal is explicitly the first dedicated commercial Helios mission, and Astranis’ agreement is framed around direct-inject GEO delivery in under 24 hours. Those are strong counterparties, but they are still schedule-dependent backlog, not deployed service. The third bucket contains programs such as Vast, Orbit Fab, Lodestar, and Anduril, where Impulse is supplying propulsion, hosting, or maneuver capability. These prove buyer interest in Mira/Helios as infrastructure, but several remain demo or integration-stage. Across all four buckets, the public record shows a clear go-to-market pattern: Impulse’s launch and mission-delivery channel is heavily centered on SpaceX, while customer monetization quality becomes less visible the farther one moves from flown Mira payloads toward future Helios backlog and government contract vehicles.
