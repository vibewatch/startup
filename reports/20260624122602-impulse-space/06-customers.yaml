  - type: missing-source
    severity: material
    topic: retention-gaps
    missingEvidence: NRR, GRR, logo churn, renewal-rate, and contract-length data by customer cohort.
    whyItMatters: Without cohort durability metrics, repeat payload anecdotes cannot be translated into predictable recurring revenue quality.
    diligencePath: Request board materials or customer analytics showing renewals, gross/net retention, and contract tenure by mission family.
    relatedQuestionRefs:
