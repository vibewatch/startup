    - label: 2. Channel selected
      detail: Customer is routed either into a Mira / SpaceX rideshare flow or into a future dedicated/shared Helios mission
      tone: neutral
    - label: 3. Integration and contracting
      detail: Payload interface, hosted-payload services, launch timing, and procurement vehicle are defined; this stage is strongest for named Mira payloads and weakest for broad government pools
      tone: neutral
    - label: 4. Initial mission execution
      detail: Mira deploys, hosts, or maneuvers for the customer; examples include TrustPoint, FOSSA, RIDE!/SatRev, HEO, and Starfish
      tone: positive
    - label: 5. On-orbit proof or service activation
      detail: Customer gets a deployment, first-light image, autonomous RPO result, or booked GEO transfer window
      tone: positive
