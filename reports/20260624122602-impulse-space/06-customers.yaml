  title: Best proof is now tied to flown Mira missions
  body: Impulse has moved beyond logo-only customer proof. TrustPoint, FOSSA, RIDE!/SatRev, HEO, Starfish, Samara, and Zenno are connected to exact missions, payloads, or on-orbit outcomes, and HEO plus FOSSA already provide repeat-customer evidence across multiple Mira flights.
