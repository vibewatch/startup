- id: named-proof-and-deployment
  title: Named Customer Proof and Deployment Quality
  body: |-
    Named customer proof is strongest where the evidence shows an exact payload, mission, and operational milestone. On LEO Express-1, Mira deployed TrustPoint’s 3U CubeSat. On LEO Express-2, Mira deployed FOSSA’s TAT-0 satellite, inserted SatRev’s Bluebon CubeSat for RIDE!’s Deep Blue Mission, hosted HEO’s Holmes-007 camera to first image, and completed the Remora autonomous RPO demo with Starfish. On LEO Express-3, Impulse publicly identified returning customers FOSSA Systems and HEO, then reported deployment of all three FOSSA CubeSats and first-light for HEO’s Holmes Mk2. Those examples satisfy the requirement for proof of deployment rather than simple branding: they specify spacecraft, mission context, and an on-orbit outcome.

    Commercial Helios customer proof is credible but mostly preflight. SES signed a multi-launch agreement, with the first mission described as a dedicated 2027 Helios transport of a 4-ton-class payload to GEO within eight hours. Astranis signed for a 2027 Falcon 9 plus Helios mission with direct-inject GEO delivery in under 24 hours and identified Astranis as the primary payload. Vast selected Impulse for Haven-1 propulsion in 2023, but the customer’s own 2026 update moved Haven-1 readiness to Q1 2027, so that relationship remains booked integration work rather than on-orbit service. Lodestar’s MITHRIL work and Anduril’s GEO RPO mission add more proof that buyers want Impulse’s maneuverable platform, but both are still demonstration-stage rather than repeat production service.
