  - type: missing-source
    severity: material
    topic: concentration-gaps
    missingEvidence: Top-customer revenue share and commercial-versus-government backlog mix.
    whyItMatters: Concentration risk cannot be sized if the public record only shows named logos and contract vehicles without revenue weighting.
    diligencePath: Request signed backlog by customer, government/commercial split, and top-five customer exposure by booked revenue.
