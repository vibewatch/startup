- calloutType: risk
  title: Channel concentration and forward-booked Helios backlog are the key customer risks
  body: The strongest commercial logos for Helios — SES and Astranis — are still 2027 missions, while every public flight and several future missions route through SpaceX. That means customer quality is improving faster than delivery diversification, and public sources still do not reveal NRR, churn, or top-customer exposure.
  claimRefs:
  - CU020
  - CU022
  - CU036
  - CU037
  - CU038
  - CU044
- calloutType: insight
  title: Government traction validates the category, but not yet recurring utilization
  body: VICTUS provides real mission proof, but HALO, VADR, BALISTA, and the broader orbital-logistics challenge mostly show access to future opportunities. Investors should value these programs as pipeline validators, not as proof that defense demand has already converted into durable, repeat customer revenue.
