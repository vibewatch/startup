  rows:
  - - D-Orbit
    - Direct OTV / orbital logistics
    - 22 missions, 79 hosted payloads, 141 satellites deployed publicly disclosed
    - LEO deployment, hosted payloads, mission operations
    - Most visible private mission cadence in retained pack
    - Public materials emphasize LEO logistics more than fast GEO transfer
  - - Momentus
    - Direct OTV / hosted payload rival
    - Public company (MNTS); 2025 revenue $1.11M; 35 employees; June 2026 $25M raise
    - LEO last-mile delivery, hosted payloads, in-orbit services
    - Only close public-market comp with disclosed financials
    - Weak public balance-sheet profile and going-concern discussion
  - - Starfish Space
    - Autonomous servicing startup
    - '>$50M raised per company press release'
    - Life extension, disposal, docking, RPOD-enabled servicing
    - Strong autonomy/software story; validated with Remora mission
    - Less evidence of broad transport cadence or high-thrust transfer capacity
  - - Exotrail
    - Adjacent mobility / propulsion platform
    - Funding not disclosed in retained official pages
    - Electric propulsion and broad orbital services users
    - Propulsion-led mobility positioning with sustainability narrative
    - Reviewed sources do not show repeated free-flying tug cadence
  - - Infinite Orbits
    - GEO life-extension servicer
    - Funding not disclosed in retained official pages
    - Sovereign, government, and commercial GEO operators
    - 'Autonomous vision-based GEO servicing; Orbit Guard #1 in GEO'
    - Depends on launch and transfer partners for delivery today
  - - Orbit Fab
    - Refueling infrastructure / adjacent platform
    - Trusted by government programs and 100+ commercial spacecraft; public GEO fuel price posted
    - Satellite operators and servicers needing propellant access
    - Most transparent public price signal; interface standard play via RAFTI
    - Not a broad tug operator today
  - - Astroscale
    - Incumbent servicing / inspection / refueling competitor
    - Global customer list across agencies and operators; U.S. refueling mission in 2026
    - Government and commercial operators needing debris, inspection, refueling, EOL services
    - Institutional credibility across inspection, debris, and refueling
    - Public posture is servicing-heavy rather than rapid tug transport
  - - Northrop SpaceLogistics
    - Large incumbent GEO servicer
    - Backed by Northrop Grumman; MEV/MRV/MEP product stack
    - High-value GEO mission extension and robotic servicing
    - Strong incumbent credibility and product depth in servicing
    - Not the closest smallsat-tug analogue to Impulse
  - - ThinkOrbital
    - Adjacent construction / robotics player
    - Funding not disclosed in retained official pages
    - Defense, SDA, and in-space construction users
    - Robotic arm, inspection, and in-space construction toolkits
    - Not disclosed as a broad transport service
  - - HEO
    - Adjacent inspection / SDA player
    - Funding not disclosed in retained official pages
    - Government, defense, and commercial customers needing non-Earth imagery
    - Satellite monitoring and anomaly-attribution data layer
    - Inspection product, not a standalone tug network
  - - Status quo substitutes
    - Substitute
    - N/A
    - Operators optimizing around launch and spacecraft design
    - Direct insertion, onboard EP, slower orbit-raising, prime-led mission design
    - Often cheaper or simpler than adding a new logistics provider
  - - Internal build / prime integration
    - Substitute
    - N/A
    - Station developers and larger spacecraft primes
    - Can absorb propulsion, hosting, or servicing functions into their own stack
    - Reduces addressable share for third-party mobility vendors
  notes: Scale/funding reflects only what the retained pack disclosed publicly; “not disclosed” means unavailable in reviewed evidence, not absent in reality.
