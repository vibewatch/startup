company:
  name: Impulse Space
chapter:
  number: 3
  title: Competitors
  summary: Impulse Space competes in a fragmented orbital-logistics stack rather than against one clean peer set. The most relevant direct tug comparables are D-Orbit and Momentus, while Starfish, Orbit Fab, Infinite Orbits, Astroscale, and Northrop crowd the adjacent servicing, refueling, and GEO-life-extension layers. Public evidence suggests Impulse is unusually broad and high-thrust for a startup, but the landscape remains moat-light because pricing is opaque, switching costs are still moderate, and several adjacent players can become direct competitors as standards and mission architectures mature.
sections:
- id: landscape-boundary
  title: 'Landscape boundary: direct tug peers, servicing incumbents, and status-quo substitutes'
  body: 'Impulse should not be benchmarked against one undifferentiated “space logistics” basket. The retained evidence breaks the field into at least five layers. First are direct post-launch mobility peers that sell orbit-change or hosted-payload capacity on their own vehicles: D-Orbit and Momentus are the clearest public analogs, with Starfish adjacent when missions require autonomous servicing rather than only deployment. Second are GEO life-extension and servicing specialists such as Infinite Orbits, Astroscale, and Northrop SpaceLogistics. Third are infrastructure players such as Orbit Fab that can become complements today and bargaining-power centers tomorrow if refueling standards become common. Fourth are adjacent feature providers such as HEO and ThinkOrbital that can be bundled into servicing architectures without yet being standalone tug vendors. Fifth is the status quo: direct insertion, onboard electric propulsion, slower orbit-raising, or building propulsion and servicing
    functions into a prime contractor’s own spacecraft. That taxonomy matters because Impulse’s strongest direct overlap is still the tug layer, while the densest long-term crowding sits around GEO servicing, inspection, and refueling. Buyers can still mix and match these layers rather than lock into one vertically integrated network, which keeps multi-homing realistic and weakens any claim that the category is already winner-take-most.'
