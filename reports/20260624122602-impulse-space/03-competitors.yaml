- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - moat claim
  - threat
  - severity
  - implication for Impulse
  - diligence ask
  rows:
  - - High-thrust multi-role fleet breadth
    - Adjacent specialists add transport capability or primes internalize mobility
    - High
    - Breadth helps today, but bundle risk can erode differentiation
    - Request customer win/loss data by mission type and why buyers chose Impulse over internal build
  - - Fast transfer and maneuverability
    - D-Orbit and Momentus improve cadence or pricing; Starfish proves autonomy-led servicing can be “good enough”
    - Medium
    - Impulse may need speed to matter economically, not just technically
    - Request mission timelines, orbit-change performance, and time-to-operational-value by customer archetype
  - - Partner ecosystem access
    - Partners such as Orbit Fab, HEO, or Infinite Orbits build enough brand and interfaces to reduce Impulse to transport labor
    - Medium-High
    - Partner-enabled breadth could flip into platform dependency
    - Request contract terms on exclusivity, interface ownership, and follow-on economics
  - - Future refueling network effects
    - Orbit Fab or another interface owner standardizes depots and captures price-setting power
    - High
    - Transport vehicles could be commoditized around someone else’s fuel standard
    - Request roadmap for Impulse-native refueling, interface strategy, and depot interoperability
  - - GEO credibility expansion
    - Astroscale, Northrop, Infinite Orbits, and Starfish crowd the GEO servicing narrative before Helios scales
    - High
    - Impulse risks arriving into a more mature servicing stack owned by others
    - Request signed GEO backlog, Helios readiness evidence, and customer reasons for choosing transport over incumbent servicing
  - - Opaque public pricing protects margins
    - Price opacity also prevents proof that Impulse wins on economics rather than on narrative or founder brand
    - Medium
    - Investors cannot yet underwrite a durable cost moat
    - Request realized pricing, gross-margin targets, and repeat-purchase behavior by program
  notes: Severity ratings are inferred from retained public evidence and reflect competitive importance for Impulse rather than objective market probabilities.
