- id: servicing-refueling-adjacencies
  title: Servicing, refueling, and GEO adjacencies crowd the higher-orbit opportunity set
  body: 'The higher-orbit opportunity set is more crowded than the pure last-mile tug layer. Orbit Fab is the clearest example of a company that is not a direct OTV rival today but could become strategically powerful if refueling becomes standard: it already posts a public benchmark of $20 million to deliver 100 kilograms of hydrazine to GEO, sells the RAFTI interface, and positions itself as a network of depots and fuel shuttles. Infinite Orbits is closer to a future overlapping competitor because it sells GEO life-extension services and already partnered with Impulse for Caravan deliveries beginning in 2027. Astroscale and Northrop are the strongest incumbents in public credibility for inspection, debris, refueling, and large-satellite servicing. Astroscale lists major institutional customers and says Provisioner will refuel a USSF asset in 2026, while Northrop’s SpaceLogistics product stack explicitly includes MEV, MRV, and MEP. HEO and ThinkOrbital matter for a different reason: they
    show how inspection, SDA imaging, robotic tooling, and construction features can move into the same architecture as tug services. Impulse therefore faces a competitive frontier where some companies are current complements, some are current partners, and several can migrate toward head-to-head rivalry as customers demand more complete in-orbit service bundles around GEO and defense missions.'
