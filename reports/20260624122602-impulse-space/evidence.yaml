evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: investor-map
    missingEvidence: >-
      Board seats, ownership percentages, protective provisions, and liquidation preferences for the major investors
      named in the stakeholder map.
    whyItMatters: >-
      The public funding chronology identifies who invested, but not who controls governance levers or economic downside
      protection after multiple large rounds.
    diligencePath: >-
      Request the latest cap table, financing summaries, and investor-rights agreements, then map each major investor to
      control, information, and liquidity rights.
    relatedQuestionRefs:
      - QO016
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: minor
    topic: milestone-table
    missingEvidence: >-
      Any dated litigation, regulator investigation, or comparable adverse event directly naming Impulse Space in public
      records.
    whyItMatters: >-
      The chronology is supportable on founding, funding, launch, and partnership events, but direct legal or
      enforcement negatives would materially change the chapter’s risk framing if they surface later.
    diligencePath: >-
      Refresh legal, sanctions, and regulatory-source searches in the next report cycle and ask management to disclose
      any threatened or pending disputes.
    relatedQuestionRefs:
      - QO023
    relatedTableRefs:
      - TO004
  - type: enumeration-incomplete
    severity: material
    topic: board-governance
    missingEvidence: >-
      A complete current board roster, committee structure, and indication of independent versus investor or management
      seats.
    whyItMatters: >-
      Governance concentration and board independence shape control, oversight quality, and the founder-dependency
      profile for a hardware company raising late-stage capital.
    diligencePath: >-
      Request the latest board deck, corporate governance summary, or cap-table side letter package from the company and
      confirm the board roster directly with counsel.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO002
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: >-
      An exact employee count by location and function as of the run date, rather than open-role and secondary-report
      proxies.
    whyItMatters: >-
      Hiring pace, burn, manufacturing readiness, and program-delivery capacity depend on whether the organization is
      closer to ~500 employees or materially below that level.
    diligencePath: >-
      Request an HR census or org chart export dated within the last 30 days and reconcile it against open requisitions
      and facility expansion plans.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: revenue
    missingEvidence: Recognized revenue, bookings, backlog conversion, gross margin profile, and customer concentration by program.
    whyItMatters: >-
      The company’s valuation and funding momentum can only be judged properly if contract count and contract value are
      translated into actual revenue quality and timing.
    diligencePath: >-
      Request audited financial statements, board-approved operating plan, and a bookings-to-revenue waterfall by
      mission program.
    relatedQuestionRefs:
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: pricing-and-backlog
    missingEvidence: Standard price cards, backlog by vehicle, annual mission cadence, and utilization assumptions for Mira and Helios.
    whyItMatters: >-
      Without unit economics and backlog visibility, public TAM lenses cannot be translated into a defensible revenue
      bridge or SOM estimate.
    diligencePath: >-
      Request customer pipeline, standard mission pricing, average gross-margin assumptions, and booked backlog split by
      vehicle and orbit class.
    relatedQuestionRefs:
      - QM022
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: interoperability-standards
    missingEvidence: >-
      Public evidence of shared refueling interfaces, docking standards, propellant-transfer protocols, and
      cross-provider compatibility for depot-style networks.
    whyItMatters: >-
      If interoperability remains bespoke, orbital logistics may stay a set of isolated demos rather than a networked
      market with repeatable utilization.
    diligencePath: >-
      Request interface-control documents, partner MOUs, or government standards work that shows how Impulse expects to
      interoperate with depots and refuelers.
    relatedQuestionRefs:
      - QM023
    relatedTableRefs:
      - TM004
  - type: missing-source
    severity: material
    topic: lunar-accessible-som
    missingEvidence: >-
      A quantified view of what share of CLPS-like lunar spend is actually accessible to an orbit-transfer supplier
      rather than to the prime lander or launch provider.
    whyItMatters: >-
      Lunar logistics is strategically attractive, but without role-level economics it is easy to over-allocate
      prime-contract value to transfer-layer vendors.
    diligencePath: >-
      Map CLPS and commercial lunar missions into role-level spend buckets and identify where transfer, staging, or
      orbital mobility spend sits in the value chain.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM002
      - TM003
