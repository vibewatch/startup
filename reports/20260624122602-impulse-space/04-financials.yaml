- id: financial-verdict-and-diligence-blockers
  title: Financial Verdict and Diligence Blockers
  body: |-
    The positive case is not hard to see. Impulse has real product surfaces, repeat mission history, named commercial customers, government awards, and a funding base that now clears the billion-dollar mark on a conservative public reading. That is meaningfully better than a pre-launch or single-mission startup trying to sell a concept. The company has also shown enough public traction to argue that in-space mobility is a commercial category rather than a science project: SES, Astranis, Space Network Services, and Space Force are all evidence that buyers will pay for speed, mobility, or responsiveness if the system performs.

    The negative case is equally clear. The reviewed record still does not disclose revenue, ARR, gross margin, CAC, payback, cash, burn, runway, working-capital terms, or customer concentration. LEO Express 3 also shows why execution risk still matters: the company disclosed a star-tracker problem that prevented main-thruster burns on that mission, even though customer operations continued. New Space Economy’s critique is directionally right: a vertically integrated mobility business must keep proving hardware and operations while building a market that is still not fully standardized. The investment conclusion is therefore balanced but incomplete: capital adequacy looks directionally strong, revenue quality looks plausible, and public financial transparency remains too thin for hard underwriting.
