  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: revenue-disclosure
    missingEvidence: Recognized revenue, booked backlog, ARR if any, and a product-level revenue bridge.
    whyItMatters: Without topline and mix disclosure, valuation discipline and revenue-quality analysis remain narrative rather than underwritten.
    diligencePath: Request monthly management accounts with booked-versus-recognized revenue by Helios, Mira, rideshare, and government contracts.
    relatedQuestionRefs:
    - QI001
    - QI004
    - QI016
    - QI025
  - type: private-evidence-only
    severity: material
    topic: gross-margin-unit-economics
    missingEvidence: Gross margin, contribution margin, services attach rate, CAC, payback, and sales-cycle metrics.
    whyItMatters: The business could be attractive or merely busy depending on whether vertical integration and custom mission support produce scalable margins.
    diligencePath: Request cohort-level unit economics and last-twelve-month sales-efficiency metrics split by commercial versus government segment.
    relatedQuestionRefs:
    - QI014
    - QI015
    - QI016
    - QI025
  - type: private-evidence-only
    severity: material
    topic: liquidity-runway
    missingEvidence: Cash on hand, monthly burn, runway, debt schedules, and contingency liquidity sources.
    whyItMatters: A billion-dollar historical funding stack does not answer whether current liquidity is sufficient to reach Helios and rideshare scale milestones.
    diligencePath: Request treasury reports, runway model, debt schedule, and board-approved downside plan tied to Helios execution milestones.
    relatedQuestionRefs:
    - QI017
    - QI018
    - QI024
    - QI025
  - type: missing-source
    severity: material
    topic: working-capital
    missingEvidence: Contract billing schedules, customer deposits, deferred revenue, and receivable days by mission type.
    whyItMatters: Mission businesses can consume or release cash depending on prepayment structure; public sources do not show which side Impulse is on.
    diligencePath: Review sample customer contracts and aging schedules for receivables, deferred revenue, and launch-deposit obligations.
    relatedQuestionRefs:
    - QI023
    - QI025
  - type: missing-source
    severity: material
    topic: customer-concentration
    missingEvidence: Backlog by customer, end-market, delivery year, and cancellation risk.
    whyItMatters: Named logos are useful, but financial quality depends on concentration, conversion timing, and dependence on a small number of large programs.
    diligencePath: Request top-customer concentration, backlog aging, and scenario analysis for any single-program delay in commercial or defense channels.
    relatedQuestionRefs:
    - QI004
    - QI021
    - QI022
    - QI025
