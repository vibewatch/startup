- id: TI003
  title: Unit economics table
  columns:
  - Metric
  - Value or status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Signed contracts / backlog proxy
    - 30+ contracts / nearly $200M by Jun 2025; hundreds of millions by Jun 2026
    - medium
    - Shows demand and some future revenue coverage even without disclosed recognized revenue
    - Request backlog waterfall by customer, probability, delivery year, and booked-to-revenue conversion
  - - Revenue / ARR
    - null
    - low
    - Without topline disclosure investors cannot anchor scale, valuation discipline, or growth rate
    - Request trailing twelve-month revenue, booked backlog, ARR if applicable, and recognized-vs-booked bridge
  - - Gross margin / contribution margin
    - null
    - low
    - Vertical integration, launch integration, and mission ops could produce very different margins by product line
    - Request gross margin by Helios, Mira, rideshare, and services-heavy mission cohorts
  - - CAC / payback / sales cycle
    - null
    - low
    - Named logos and contract count do not reveal whether the enterprise motion is capital efficient
    - Request sales-cycle duration, CAC, payback, and proposal win-rate by commercial versus government segment
  - - Capital-intensity proxy
    - 60k sq ft HQ, 20k sq ft Colorado facility, cryogenic Helios integration, three Falcon 9 launches
    - medium
    - Facilities and launch commitments imply significant fixed and working capital needs before revenue turns into free cash flow
    - Request annual capex, tooling spend, launch deposits, and facility lease or ownership obligations
  - - Hiring load
    - 152 open roles on careers page; Series D says 200+ open or planned roles
    - medium
    - Fast hiring expands capability but also raises payroll burn and management complexity
    - Request headcount by function, fully loaded payroll burn, and hiring-plan pacing versus funded runway
  notes: Null means the metric is not publicly disclosed in reviewed sources, not that the value is zero or immaterial.
