- id: TI002
  title: Pricing / monetization table
  columns:
  - Offer / mechanism
  - List vs realized pricing
  - Public evidence
  - Unknowns / caveat
  - Implication
  rows:
  - - Public list-price availability
    - No public list pricing found
    - Reviewed product, company, and update pages show capability descriptions but no tariff sheet
    - No public ACV floor, slot rate, or payload-kg price benchmark
    - Benchmarking buyer willingness to pay requires private data
  - - Helios dedicated missions
    - Realized pricing undisclosed
    - SES and Astranis focus on faster GEO access, lower mission complexity, and time-to-service
    - Unknown whether pricing is fixed, milestone-based, launch-pass-through, or value-based
    - Mission economics could be attractive, but public evidence cannot prove unit margin
  - - Caravan / GEO rideshare
    - Capacity disclosed; price undisclosed
    - Rideshare page lists 300 kg and 700 kg included capacity bands
    - No public per-port or per-manifest rate
    - The public surface is enough to infer packaging, not enough to infer monetization quality
  - - Mira hosted / maneuvering missions
    - Realized pricing undisclosed
    - Mira capability, mission history, and customer outcomes are public
    - Unknown whether pricing is by hosted payload, platform lease, maneuver package, or full mission
    - Difficult to separate recurring platform value from one-off mission engineering
  - - Government awards
    - Contract value sometimes public; recognition basis undisclosed
    - SSC contract value and STRATFI structure are public
    - Unknown profit profile, milestone timing, and whether cash support is recognized as revenue or development funding
    - Government mix diversifies demand but does not reveal revenue quality by itself
  notes: Capacity, schedule, and cost-savings claims are public. Realized pricing, discounting, and revenue-recognition mechanics are not.
