- id: TI004
  title: Capital adequacy table
  columns:
  - Metric
  - Public value / status
  - Confidence
  - Why it matters
  - Diligence ask
  rows:
  - - Public capital floor
    - ≈$1.003B from disclosed sold amounts and round announcements; company says >$1B raised
    - medium
    - Anchors the minimum equity base available to fund facilities, launch commitments, and product scale-up
    - Reconcile treasury cash received by round, fees, and restricted cash balance
  - - Cash on hand
    - null
    - low
    - Absolute liquidity is the main missing variable for runway underwriting
    - Request latest month-end cash, restricted cash, and available liquidity schedule
  - - Monthly burn
    - null
    - low
    - The company is scaling facilities and headcount quickly, so burn rate determines how much of the capital stack is truly available
    - Request last twelve months of net burn and burn by payroll, capex, launch, and R&D buckets
  - - Runway months
    - null
    - low
    - Runway determines whether Helios milestones can be reached without another financing event
    - Request base-case, downside, and milestone-based runway model
  - - Planned use of funds
    - Hiring, manufacturing growth, production scale-up, R&D, and mission operations support
    - medium
    - Use-of-proceeds discipline matters because the company is simultaneously scaling products, facilities, and launch cadence
    - Request board-approved use-of-proceeds plan and milestone gating by round
  - - Next-round trigger
    - Not publicly disclosed; public milestones emphasize Helios execution, backlog conversion, and footprint expansion
    - low
    - Without an explicit trigger, dilution timing remains opaque even with a large capital base
    - Request internal financing plan, covenant or runway trigger, and milestones required before the next raise
  - - Debt / project finance obligations
    - No public debt or project-finance package identified in reviewed sources
    - medium
    - Hidden leverage would change runway math and downside protection
    - Request debt schedule, launch-payment obligations, letters of credit, and any project-level financing arrangements
  notes: Null fields reflect absent public disclosure. The capital floor is conservative and based only on disclosed sold amounts plus the announced Series B.
