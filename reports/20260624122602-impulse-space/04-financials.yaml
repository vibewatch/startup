- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Current public evidence
  - Underwriting impact
  - Exact diligence path
  rows:
  - - Revenue / ARR / growth
    - No reviewed source discloses topline or growth rate
    - Prevents valuation discipline, penetration analysis, and backlog-conversion assessment
    - Request audited or board-level monthly revenue bridge by product and customer sector
  - - Gross margin and services mix
    - Facilities, propulsion, and integration costs are visible, but margins are not
    - Prevents analysis of whether hardware complexity is creating an attractive or weak contribution profile
    - Request product-line gross margin, services attach rate, and recurring-versus-project revenue split
  - - Cash / burn / runway
    - Large funding history is public; current liquidity is not
    - Prevents any credible runway or financing-dependency model
    - Request treasury schedule, last-twelve-month burn, capex forecast, and downside runway case
  - - Working capital / billing mechanics
    - No public disclosure on milestone billing, customer prepayments, or receivables
    - Blocks assessment of whether growth is cash-generative or cash-absorptive before delivery
    - Request sample contract billing schedules plus DSO, deferred revenue, and deposit balances
  - - Customer concentration / backlog conversion
    - Named customers are public, but exposure by account and delivery year is not
    - Prevents analysis of cancellation risk, sector dependence, and revenue timing concentration
    - Request top-10 customer exposure, backlog aging, and quarterly delivery schedule by program
  notes: This table is the handoff list for private diligence; each missing field directly blocks financial underwriting rather than merely adding nice-to-have context.
