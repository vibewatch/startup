tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Dedicated Helios transport missions
    - Single-customer transport from LEO to MEO/GEO/cislunar destinations
    - Per mission / payload campaign
    - Visible through SES and Astranis agreements; pricing undisclosed
    - Medium-High if missions repeat and payload operators value time-to-service
    - Request last five proposals, contract structure, and milestone-to-cash schedule
  - - Mira hosting, deployment, and RPO missions
    - Hosted payloads, deployment, maneuvering, and responsive on-orbit operations
    - Per mission / hosted payload package
    - Flight-proven across three missions, but no public price or ACV
    - Medium because capability is proven but economics are opaque
    - Request customer mix, hosted-payload pricing, and gross margin by mission type
  - - Caravan / GEO rideshare payload slots
    - Shared access to high-energy orbits via aggregated payload manifests
    - Per slot / per interface / per manifested mission
    - Program publicly marketed for 2027 with capacity bands but no public tariff
    - Medium if manifests can be filled at disciplined pricing
    - Request payload-slot price book, manifest utilization history, and cancellation terms
  - - Government mission and development contracts
    - SSC, STRATFI, NASA studies, and related dual-use mission work
    - Contract value / milestone draw
    - Public contract values exist for SSC and STRATFI structures
    - Medium because award dollars are visible, but margin and renewal dynamics are not
    - Request revenue recognition policy for fixed-price, SBIR, and milestone-based contracts
  - - Custom integration and mission engineering
    - Payload integration, launch preparation, and mission-specific engineering effort
    - Statement of work / bundled service
    - Implicit in dedicated missions and high-touch deployment requirements; not separately priced
    - Unknown because service labor may help land accounts but compress blended margin
    - Request services attach rate, change-order economics, and labor capitalization policy
  notes: Public evidence maps monetization surfaces but does not reveal realized pricing, software-versus-services mix, or the split between milestone and mission revenue.
