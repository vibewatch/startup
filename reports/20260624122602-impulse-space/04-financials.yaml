- id: capital-adequacy-and-financing-dependency
  title: Capital Adequacy and Financing Dependency
  body: |-
    Company Overview should carry the full round chronology. For financial underwriting, the more important point is that the public capital floor is now large enough to matter. The reviewed Form D filings show about $20.0 million in 2022, $38.75 million sold against a $45 million 2023 offering, $294.53 million sold against a $299.83 million 2025 offering, and $499.83 million sold against a $500.00 million 2026 offering. Pair those sold amounts with the officially announced $150 million Series B in 2024 and the conservative public floor is about $1.003 billion before giving any credit for unsold remainder in the open 2023 and 2025 offerings. Official messaging now rounds that to over $1 billion raised.

    That capital base supports real scale activity: Helios and Mira production, expanded facilities, hiring, launch commitments, and government mission execution. It also sits alongside contracted demand that moved from nearly $200 million in June 2025 to hundreds of millions by June 2026. The problem is that capital adequacy still cannot be modeled in the conventional sense because public sources do not disclose cash on hand, monthly burn, runway, debt, project finance, or working-capital mechanics. Publicly, the company looks well funded relative to many peers. Publicly, it still cannot be underwritten to a liquidity horizon.
