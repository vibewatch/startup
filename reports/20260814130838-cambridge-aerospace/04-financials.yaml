callouts:
  - calloutType: strength
    title: Deep capital base and top-tier syndicate
    body: >
      With roughly $636 million raised and a fresh $300 million Series C, Cambridge Aerospace has a multi-year
      cash cushion and a marquee investor group (DFJ Growth, Lux, Accel, Spark, Elad Gil). Capital adequacy is
      the strongest element of the financial profile and de-risks the manufacturing scale-up.
    claimRefs:
      - CI019
      - CI020

  - calloutType: risk
    title: Essentially zero public financial disclosure
    body: >
      No revenue, margin, burn, backlog or contract value is public, and UK filings do not yet expose meaningful
      financials. The $3.4 billion valuation cannot be benchmarked on any financial multiple, so underwriting
      depends entirely on private data-room access.
    claimRefs:
      - CI016
      - CI025
      - CI026

  - calloutType: assumption
    title: High capital intensity is a deliberate strategic bet
    body: >
      Vertical integration into solid-rocket-motor production via Nightstar raises capital intensity and
      execution risk relative to an asset-light integrator, but is intended to secure supply and margin. The bet
      only pays off if the facility delivers on cost, timeline and yield.
    claimRefs:
      - CI013
      - CI014

