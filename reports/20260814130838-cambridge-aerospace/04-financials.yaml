slug: cambridge-aerospace
runDate: "2026-08-14"
company:
  name: Cambridge Aerospace
chapter:
  number: 4
  title: Financials
  summary: >
    Cambridge Aerospace is a private, pre-disclosure defence-hardware company: it reports no public revenue,
    ARR, gross margin or burn, and UK filings do not yet expose meaningful financials. What is knowable is the
    financing picture — roughly $636 million raised across four rounds, a fresh $300 million Series C in
    August 2026, and a $3.4 billion valuation — and the shape of the model: government interceptor supply and
    support contracts priced around $27,000-$40,000 per Skyhammer round, with heavy capital intensity from the
    Nightstar solid-rocket-motor facility and a second production site. Revenue quality cannot be underwritten
    from public data, so the financial verdict rests on capital adequacy and a large slate of diligence asks.

sections:
  - id: revenue-model
    title: Revenue Streams, Pricing, and Mix
    body: >
      Cambridge Aerospace's revenue model is government defence contracting rather than recurring software.
      The primary stream is munitions supply — selling Skyhammer interceptors, and eventually Starhammer, to
      national armed forces — complemented by launcher and fire-control integration, technical support, spares,
      and training bundled into the same contracts. The first material contract is the UK Ministry of Defence's
      "multi-million-pound" Skyhammer order, with first deliveries in May 2026, followed by selection for the UK
      LEAP programme; the US Army's Project Bullfrog developmental test and Jordan/Gulf trials represent
      potential future streams rather than booked revenue. Pricing is anchored to an estimated $27,000-$40,000
      per Skyhammer round, an order of magnitude below legacy interceptors, but the realised contract price,
      quantities and margin are not disclosed. A prospective future stream is third-party solid-rocket-motor
      supply from Nightstar, which could sell propulsion into other missile programmes. The revenue mix today is
      therefore almost entirely UK-government-weighted and lumpy — characteristic of early defence primes — with
      no public split between hardware, integration and sustainment. Revenue recognition for multi-year defence
      contracts (milestone versus delivery) is unknown and material to any quality assessment.
    claimRefs:
      - CI001
      - CI002
      - CI003
      - CI004
      - CI005
    tableRefs:
      - TI001
      - TI002
    figureRefs:
      - FI001

  - id: gtm-efficiency
    title: Go-to-Market Motion and Sales-Efficiency Proxies
    body: >
      There are no disclosed CAC, payback or sales-efficiency metrics, so we reason from the motion. Cambridge
      Aerospace sells through a direct, relationship-led government motion: a small number of very large,
      slow-moving procurement decisions rather than a high-volume funnel. The company deliberately engineered
      sales efficiency through credibility rather than marketing spend — recruiting an ex-Anduril EMEA director
      as Chief Commercial Officer and, initially, a former UK Defence Secretary as chair — which compressed the
      time from founding to a national contract to under eighteen months, an extraordinarily short defence sales
      cycle. The proxy for sales efficiency is thus milestone velocity: DSEI demonstration in September 2025, a
      Series B and MoD contract in April 2026, LEAP selection and US developmental testing by mid-2026. Against
      that, government sales carry long tails, political dependency and concentration: a handful of relationships
      drive the entire pipeline, and the loss of the chair to an ACOBA conflict shows how fragile
      credibility-based go-to-market can be. Channel economics are effectively nil today — sales are direct — but
      export via foreign military sales would introduce partner and licensing intermediaries with their own take.
    claimRefs:
      - CI006
      - CI007
      - CI008
      - CI009
    figureRefs:
      - FI002

  - id: cost-capex
    title: Cost Structure, Gross Margin Drivers, Working Capital, and Capex
    body: >
      As a hardware manufacturer, Cambridge Aerospace's economics are capital- and inventory-intensive, the
      opposite of software. Gross margin depends on the bill-of-materials cost of a Skyhammer round versus its
      contract price; the company's entire thesis is that mass production and design-for-cost can hold a low unit
      cost while still leaving a margin, but no bill-of-materials or gross-margin figure is public. Working
      capital is a real drag: defence contracts often require building inventory and tooling ahead of milestone
      payments, and scaling output from the "low hundreds" of units per year toward thousands demands upfront
      cash. The largest capex commitment is the Nightstar solid-rocket-motor facility in Norfolk plus a second
      UK production site being outfitted in 2026 — both are multi-year, capital-heavy builds whose cost, timeline
      and yield are undisclosed. Vertical integration into SRM production is strategically defensive but raises
      capital intensity and execution risk relative to an asset-light integrator. Service-delivery costs
      (integration, training, sustainment) are bundled and unquantified. The key margin questions — unit BOM
      cost, factory utilisation, Nightstar yield, and inventory turns — are precisely the ones public data cannot
      answer.
    claimRefs:
      - CI010
      - CI011
      - CI012
      - CI013
      - CI014
    tableRefs:
      - TI003
    figureRefs:
      - FI004

  - id: traction-gaps
    title: Public Traction Versus Private-Metric Gaps
    body: >
      Public traction is expressed in contracts and milestones, not financial metrics. The verifiable traction
      points are: the UK MoD production contract with deliveries begun in May 2026; LEAP programme selection;
      US Army Project Bullfrog developmental testing; completed Jordan trials; headcount above 250 across six
      countries; and production ramping toward thousands of rounds per year. What is entirely missing is the
      financial substance behind these: no revenue, ARR-equivalent backlog value, unit deliveries, gross margin,
      burn rate, or contract duration is public. UK company filings for a company this young typically lag and,
      as of the run date, do not expose meaningful financial statements, so even the statutory route to numbers is
      closed for now. This gap is the defining feature of the financial diligence: the company has strong
      operational traction signals but essentially zero public financial disclosure, meaning the $3.4 billion
      valuation cannot be benchmarked on any revenue or margin multiple. Every quantitative underwriting input
      must be obtained privately in a data room.
    claimRefs:
      - CI015
      - CI016
      - CI017
      - CI018
    tableRefs:
      - TI005

  - id: capital-adequacy
    title: Capital Adequacy, Burn, Runway, and Use of Funds
    body: >
      Capital adequacy is the one area where the picture is genuinely strong. Cambridge Aerospace has raised
      approximately $636 million across seed, Series A, Series B and Series C, with a fresh $300 million Series C
      closing on 10 August 2026 (this chapter mints its own financing claims rather than reusing the Company
      Overview chronology). That fresh capital, on top of prior rounds, gives the company a substantial cash
      cushion. Burn is not disclosed, but for a 250-plus-person hardware company scaling manufacturing and
      building two facilities, a monthly burn in the high-single-digit to low-double-digit millions is a
      reasonable estimate — implying a runway measured in multiple years even under aggressive scale-up, and a
      next-round trigger likely tied to Nightstar completion, Starhammer development, or a major new programme
      rather than imminent cash need. Stated and implied use of funds is: scaling Skyhammer production, building
      Nightstar SRM capacity, developing Starhammer for 2027, and expanding the European/allied commercial
      footprint. No debt or project-finance obligations are publicly disclosed, though a capital-intensive SRM
      facility is a plausible candidate for future project finance and a diligence ask.
    claimRefs:
      - CI019
      - CI020
      - CI021
      - CI022
      - CI023
      - CI024
    tableRefs:
      - TI004
    figureRefs:
      - FI003

  - id: verdict
    title: Financial Verdict — Revenue Quality, Margin Path, and Diligence Blockers
    body: >
      The financial verdict is that Cambridge Aerospace is well-capitalised but financially opaque. On the
      positive side, the funding base is deep, the investor syndicate is top-tier, the revenue model is anchored
      to real government contracts, and the cost thesis (cheap, mass-produced interceptors) is credible and
      strategically differentiated. On the negative side, essentially every metric a lender or equity underwriter
      needs — revenue, backlog value, gross margin, burn, runway, unit economics, contract duration and
      recognition policy — is private, and the valuation is therefore an act of faith in future scale rather than
      a multiple of demonstrated financials. The principal diligence blockers are: obtaining the income statement
      and backlog; verifying Skyhammer unit BOM cost and gross margin; understanding Nightstar capex and financing;
      and confirming customer concentration and contract terms. Until these are answered privately, the financial
      profile should be read as "strong balance sheet, unproven income statement" — an appropriate posture for a
      two-year-old hardware company priced at $3.4 billion. An adverse read notes the valuation leans on
      comparison to Anduril rather than its own numbers.
    claimRefs:
      - CI025
      - CI026
      - CI027
      - CI028

