callouts:
  - calloutType: strength
    title: A genuine order-of-magnitude cost wedge
    body: >
      Cambridge Aerospace's clearest competitive advantage is price: a $27,000-$40,000 interceptor against
      incumbents costing $100,000 to over $1 million. In a market defined by magazine depth against cheap
      drones, cost-per-kill is the buying criterion that matters most, and no established prime currently
      matches it on a fielded kinetic system.
    claimRefs:
      - CP015
      - CP016

  - calloutType: risk
    title: The moat is thin on any single airframe
    body: >
      By the company's own admission, missile designs get copied and improved. If Anduril or an incumbent
      chooses to field a comparably cheap interceptor, or Helsing-class software commoditises the autonomy
      layer, Cambridge's edge narrows to manufacturing scale and SRM supply — advantages that are still
      unproven at scale.
    claimRefs:
      - CP025
      - CP026
      - CP029

  - calloutType: insight
    title: Nightstar could convert a shared weakness into a proprietary moat
    body: >
      The solid-rocket-motor shortage constrains every competitor's production. If Nightstar delivers, Cambridge
      Aerospace turns an industry-wide bottleneck into a supply advantage — potentially even selling propulsion
      to rivals — which is far harder to replicate than any airframe.
    claimRefs:
      - CP022
      - CP027

