      - number: '3.4'
        title: Switching Costs, Distribution Power, and Supply Access
        blocks:
          - type: paragraph
            body: >
              Defence markets have high switching costs once a system is designed into a national air-defence
              architecture: interfaces to radars and command-and-control, training, logistics tails, and sustainment
              contracts create multi-year lock-in that favours whoever wins the first programme of record. This cuts
              both ways for Cambridge Aerospace — winning the UK MoD contract and LEAP selection begins to build its own
              lock-in, but incumbents already hold most of these positions across NATO. Distribution power is
              concentrated in a few government procurement channels and prime-contractor relationships; Anduril and the
              primes have far more of this reach than Cambridge Aerospace does today. The most distinctive element of
              Cambridge's competitive position is supply access: by building the Nightstar solid-rocket-motor facility,
              it targets the single biggest bottleneck constraining interceptor production across the alliance,
              potentially turning a supply weakness shared by competitors into a proprietary advantage — and even a
              supply relationship to rivals. Multi-homing is common in defence (buyers field several effectors), which
              limits winner-take-all dynamics but also means Cambridge need not displace incumbents entirely to build a
              franchise.
            claimRefs:
              - CP020
              - CP021
              - CP022
              - CP023
              - CP024
