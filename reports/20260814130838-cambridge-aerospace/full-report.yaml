      - number: '7.4'
        title: Partner and Dependency Risk
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace's viability rests on a small set of concentrated dependencies, each a potential single
              point of failure. The most important is customer concentration: the UK MoD is the dominant customer and
              payer, so the company's revenue, reference credibility and even political access are tied to one
              government's budget, procurement policy and electoral cycle. A second dependency is capital providers: the
              company has raised roughly $636 million from a syndicate including DFJ Growth, Lux, Accel, Spark and Elad
              Gil, and future scale-up depends on continued access to capital on favourable terms — a risk if
              defence-tech sentiment or the threat environment shifts. A third is the supply base: scarce solid-rocket
              motors, seeker electronics and energetic materials come from a limited set of suppliers subject to their
              own constraints and export controls. A fourth is the extended, multi-country workforce and subsidiary
              footprint (UK, Germany, Poland, Norway, Ukraine, Australia), which concentrates key-person and
              operational-continuity risk, notably any staff in Ukraine. Finally, export partners and
              foreign-military-sales intermediaries sit outside the company's direct control. The risk transmission map
              below shows how a shock in any one dependency — a lost MoD contract, an SRM shortage, a capital-market
              freeze — propagates into revenue, production and valuation.
