      - number: '7.5'
        title: Financial, Model, and People/Execution Risk
        blocks:
          - type: paragraph
            body: >
              On the financial and model side, the dominant risk is capital intensity paired with opacity. Cambridge
              Aerospace is a hardware manufacturer building two facilities and vertically integrating SRM production, so
              its burn is structurally high, its working-capital needs (inventory ahead of milestone payments) are real,
              and yet no revenue, gross margin, burn or runway figure is public — meaning the market is underwriting a
              $3.4 billion valuation with essentially no visible financial fundamentals. Margin-compression risk is
              genuine because the product's whole promise is low price, which caps pricing power, while input costs
              (energetic materials, precision electronics) can rise. A specific model risk is that the valuation appears
              anchored to comparison with Anduril rather than to Cambridge's own numbers, so a re-rating of the
              defence-tech cohort would hit the mark hard. People and execution risk is equally central: the company's
              edge is its team and tempo, so the loss of key founders (CEO Barrett, CCO Sylvan) or an inability to hire
              fast enough across six countries would blunt the advantage, and the governance gap after Shapps compounds
              execution oversight risk. Rapid headcount growth past 250 also strains culture, controls and quality
              systems. These financial and people risks are less about imminent insolvency — the balance sheet is strong
              — and more about the fragility of a premium valuation resting on continued flawless execution.
            claimRefs:
