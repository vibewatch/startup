  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace competes in the kinetic counter-unmanned-aircraft-system (C-UAS) segment of the
              air-defence market: hardware and munitions purchased by armed forces and, secondarily, by
              critical-infrastructure and homeland-security agencies to detect, track and physically destroy hostile
              drones and low-flying cruise missiles. The included spend is interceptor missiles, launchers, radar and
              fire-control integration, and the sustainment contracts around them. Excluded from the addressable
              boundary are pure electronic-warfare/jamming systems (a distinct non-kinetic segment led by firms such as
              DroneShield), directed-energy weapons that remain largely pre-production, the broader manned air-defence
              missile market (Patriot, SAMP/T), and civilian counter-drone products for airports and prisons. The most
              important status-quo substitutes are not other startups but legacy interceptors — million-dollar-class
              surface-to-air missiles and gun systems — and simply absorbing drone attacks. Cambridge Aerospace's entire
              thesis is that the status quo is economically unsustainable: a $1M+ interceptor fired at a $20,000-$50,000
              Shahed loses the exchange-ratio war, and Cambridge's $27,000-$40,000 Skyhammer reframes the boundary
              around cost-per-kill rather than raw performance. The relevant market is therefore best defined as
              "low-cost kinetic C-UAS effectors for state air defence," an adjacency of both the missile market and the
              loitering-munition/drone market rather than a clean subset of either.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM005
