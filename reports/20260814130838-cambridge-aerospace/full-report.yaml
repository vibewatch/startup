  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer Base Segmentation
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace sells exclusively into the government defence segment, and within it the buyer, user
              and payer roles are distinct but all governmental. The buyer/payer is a national defence ministry or
              armed-service procurement authority — the UK MoD is the anchor — while the user is the operational
              air-defence unit that fields Skyhammer. Segmenting by geography, the base is UK-first (MoD, British Army
              air defence), with a US developmental customer (US Army 52nd Air Defense Artillery Brigade via Project
              Bullfrog), a Middle East trial customer (Jordan), and referenced Gulf partners. By vertical, every
              customer is short-range air defence / counter-UAS; there is no commercial or civil segment, which both
              focuses the company and caps its addressable buyer count. By size, these are large, high-credit,
              slow-moving institutional buyers whose procurement is driven by threat environment and national budget
              rather than by product-led growth. The practical implication is a very small number of very large
              accounts: winning or losing a single ministry materially changes the revenue trajectory, and the sales
              motion is government-relationship-led rather than volume-funnel-led. This concentration is typical of an
              early defence prime but is a structural risk that recurs throughout the customer analysis.
