      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The demand tailwinds are unusually strong and mutually reinforcing. First, active drone warfare in Ukraine
              and the Middle East has proven both the threat and the cost-asymmetry problem, converting a theoretical
              requirement into urgent procurement. Second, European rearmament — with EU and NATO members lifting
              defence spending materially and initiatives such as the European Sky Shield Initiative pooling air-defence
              demand — expands the budget envelope. Third, the UK government has explicitly prioritised low-cost
              effectors and autonomous systems, fast-tracking domestic suppliers through programmes like LEAP. Against
              these drivers sit real constraints. Procurement cycles are long and politicised; certification, safety and
              export-control approvals gate deployment; solid-rocket-motor and precision-component supply is a systemic
              bottleneck across NATO; and switching costs favour incumbents already integrated into national
              fire-control architectures. The single largest structural risk is that demand is partly
              conflict-dependent: a durable de-escalation would slow the urgency that currently compresses procurement
              timelines, even if the long-run counter-drone requirement persists. Trust and sovereignty considerations
              cut both ways — they favour domestic UK/European suppliers over US primes for European buyers, but they
              also raise national-security-investment scrutiny of Cambridge's own foreign capital.
            claimRefs:
              - CM018
              - CM019
              - CM020
              - CM021
              - CM022
              - CM023
