            body: >
              Retention and durability cannot be measured from public data, and this is a genuine gap rather than a
              formatting nicety. There is no disclosed net revenue retention, gross retention, churn, renewal rate or
              contract length; the company is young enough that most contracts have not reached a renewal decision. What
              can be inferred is structural rather than empirical: defence procurement, once a platform is fielded and
              integrated, tends to be sticky because of certification, training, integration and sustainment lock-in,
              and because switching interceptors mid-programme is costly and slow. The UK MoD relationship, if it
              converts from initial order to a standing framework and LEAP program-of-record, would be highly durable.
              Against that, the durability is unproven: a two-year-old supplier has no track record of renewals, the
              demand is partly conflict-dependent, and a single procurement policy change or budget shift could stall
              re-orders. Reference quality is high for the UK (named, production, government-backed) and moderate
