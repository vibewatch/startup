      - number: '3.3'
        title: Capability, Pricing, and Go-to-Market Comparisons
        blocks:
          - type: paragraph
            body: >
              On capability, Cambridge Aerospace's Skyhammer is mid-tier: a subsonic (Mach 0.7), 30km-range,
              radar-guided interceptor optimised against Shahed-class drones, less capable at the high end than MBDA's
              or RTX's systems but purpose-built for the most common threat. Its decisive edge is price: an estimated
              $27,000-$40,000 per round versus interceptors costing hundreds of thousands to millions of dollars, an
              order-of-magnitude advantage that reframes the buying criterion from performance to cost-per-kill and
              magazine depth. On go-to-market, incumbents win through entrenched national fire-control integration and
              framework contracts, while Anduril wins through a Silicon-Valley commercial playbook and US scale.
              Cambridge Aerospace mirrors the Anduril playbook in Europe — it hired Anduril's former EMEA director as
              CCO — and leans on UK sovereignty and speed. On trust and regulatory posture, all players operate under
              export controls and national-security review; incumbents carry decades of certification and safety
              pedigree that a two-year-old challenger cannot yet match, which is a genuine disadvantage in risk-averse
              procurement. DroneShield and Helsing compete on a different axis entirely (non-kinetic defeat and
              software), so head-to-head comparison understates how much they can erode the same budget.
            claimRefs:
