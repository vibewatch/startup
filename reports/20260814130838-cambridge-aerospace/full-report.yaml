      - number: '6.2'
        title: Adoption Trajectory
        blocks:
          - type: paragraph
            body: >
              The adoption trajectory is unusually steep for the sector. Within roughly eighteen months of founding,
              Cambridge Aerospace moved from prototype to a fielded UK MoD contract with first deliveries in May 2026,
              then to selection for the UK LEAP programme in July 2026, alongside US Army developmental live-fire
              testing and completed Jordan trials. That progression — demonstration, contract, delivery, program
              expansion, and allied testing — represents real deployment rather than letters of intent. The clearest
              adoption signal is that Skyhammer is in production and being delivered, and that production is scaling
              from the low hundreds toward thousands of rounds per year, implying repeat manufacturing pull from at
              least the anchor customer. However, "adoption" in defence is lumpy and milestone-based: a single framework
              contract can account for the entire trajectory, and developmental testing (Project Bullfrog) is not yet a
              program of record. The trajectory is therefore best read as strong early traction with one confirmed
              operational customer and a pipeline of trialing customers, not as a broad, diversified adoption curve.
              Quantified deployment counts, units fielded per customer, and re-order cadence are not disclosed, limiting
              how precisely the trajectory can be measured.
