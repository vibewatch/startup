      - number: '7.3'
        title: Operational, Quality, and Security Risk
        blocks:
          - type: paragraph
            body: >
              Operationally, Cambridge Aerospace faces the classic hardware-scaling risks amplified by the criticality
              of its product. Manufacturing scale-up is the headline: moving from prototype-scale to mass production of
              a precision guided missile demands tooling, quality control, workforce and supply-chain maturity that
              two-year- old companies rarely possess, and any slip directly threatens contract delivery. The single most
              systemic operational dependency is solid-rocket-motor supply: SRMs are in structural shortage across NATO,
              which is precisely why Cambridge is building Nightstar — but that facility is itself a multi-year
              construction, certification and yield risk, and until it is online the company depends on scarce external
              propulsion. Quality and reliability risk is acute for a lethal effector: an interceptor that misfires or
              fails to intercept has consequences far beyond a software bug, yet no public reliability data exists.
              Security risk spans both cyber (guidance and autonomy software are attractive attack targets, and
              supply-chain compromise is a recognised threat vector) and physical (handling live warheads and energetic
              materials). Component dependencies — X-band seeker electronics, microelectronics, energetic materials —
              are also subject to their own export controls and shortages. The dependency map below traces how these
              operational inputs gate production, and the register enumerates the specific operational, quality and
              security exposures.
