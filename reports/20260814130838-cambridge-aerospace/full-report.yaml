          - type: callout
            title: The moat is thin on any single airframe
            body: >
              By the company's own admission, missile designs get copied and improved. If Anduril or an incumbent
              chooses to field a comparably cheap interceptor, or Helsing-class software commoditises the autonomy
              layer, Cambridge's edge narrows to manufacturing scale and SRM supply — advantages that are still unproven
              at scale.
            calloutType: risk
            claimRefs:
