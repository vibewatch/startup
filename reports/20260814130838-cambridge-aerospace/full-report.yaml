      - number: '4.3'
        title: Cost Structure, Gross Margin Drivers, Working Capital, and Capex
        blocks:
          - type: paragraph
            body: >
              As a hardware manufacturer, Cambridge Aerospace's economics are capital- and inventory-intensive, the
              opposite of software. Gross margin depends on the bill-of-materials cost of a Skyhammer round versus its
              contract price; the company's entire thesis is that mass production and design-for-cost can hold a low
              unit cost while still leaving a margin, but no bill-of-materials or gross-margin figure is public. Working
              capital is a real drag: defence contracts often require building inventory and tooling ahead of milestone
              payments, and scaling output from the "low hundreds" of units per year toward thousands demands upfront
              cash. The largest capex commitment is the Nightstar solid-rocket-motor facility in Norfolk plus a second
              UK production site being outfitted in 2026 — both are multi-year, capital-heavy builds whose cost,
              timeline and yield are undisclosed. Vertical integration into SRM production is strategically defensive
              but raises capital intensity and execution risk relative to an asset-light integrator. Service-delivery
              costs (integration, training, sustainment) are bundled and unquantified. The key margin questions — unit
              BOM cost, factory utilisation, Nightstar yield, and inventory turns — are precisely the ones public data
              cannot answer.
