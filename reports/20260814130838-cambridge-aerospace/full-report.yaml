      - number: '8.4'
        title: Bull, Base, and Bear Cases
        blocks:
          - type: paragraph
            body: >
              Three scenarios bracket the outcome. In the bull case, Cambridge Aerospace becomes the European Anduril of
              air defence: Skyhammer scales to thousands of units across the UK, US, Jordan, Gulf and wider Europe,
              Nightstar cures the propulsion bottleneck and adds a supply business, Starhammer opens a higher-value
              segment, and the company grows into and past its valuation toward a $10 billion-plus outcome over several
              years — assumptions: sustained conflict-driven demand, flawless manufacturing scale-up, and export
              success. In the base case, it is a strong but narrower niche leader: a durable UK-anchored franchise with
              gradual allied expansion, sustaining roughly the current $3.4 billion valuation with modest appreciation
              and an eventual strategic exit — assumptions: steady but not explosive demand, competent execution, some
              concentration persisting. In the bear case, execution or demand disappoints: a manufacturing or Nightstar
              slip, loss or non-renewal of the anchor MoD contract, a defence-tech re-rating, or a durable de-escalation
              triggers a down round toward or below $1 billion — assumptions: any one major risk crystallises. The
              probability signals favour the base case, with a meaningful bull tail given category momentum and a
              non-trivial bear tail given concentration and opacity. The valuation-sensitivity figure shows how the
              outcome swings with revenue-scale and multiple assumptions.
