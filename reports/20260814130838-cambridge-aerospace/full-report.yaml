      - number: '1.3'
        title: Funding History and Investor Base
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace has raised approximately $636 million in total funding across four rounds in under two
              years, one of the fastest capital formation trajectories in European defence-technology history. The seed
              round of $36 million was led by Never Lift in 2024. A $100 million Series A closed in September 2025 at a
              $400 million valuation, led by Spark Capital and Lakestar with participation from Lux Capital, Accel, D3
              Venture Capital, Never Lift, Expeditions Fund, and MW Group. A $200 million Series B closed in April 2026
              at a $1.3 billion valuation, co-led by Elad Gil & Co and Spark Capital. Four months later, on 10 August
              2026, the company closed a $300 million Series C at a $3.4 billion post-money valuation, led by DFJ Growth
              with participation from Lux Capital, Accel, Lakestar, Never Lift, Ora Global, and Elad Gil & Co. The 2.6×
              step-up in valuation between Series B (April 2026) and Series C (August 2026) was driven by rapid MoD
              contract wins, including the LEAP programme selection in July 2026. DFJ Growth founder Randy Glein stated
              that his firm "surveyed the global landscape and identified Cambridge as having the best team and
              technology to build the most advanced and modern air defence infrastructure for Europe and its allies."
              The investor base spans US venture capital (DFJ Growth, Spark Capital, Accel, Elad Gil & Co) and European
              growth funds (Lakestar, Ora Global), with Never Lift maintaining a presence across all rounds.
