        title: Key Milestones Chronology
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace achieved what its industry peers described as one of the fastest development tempos in
              postwar European defence: from founding in late 2024 to an MoD contract in seven months, and from founding
