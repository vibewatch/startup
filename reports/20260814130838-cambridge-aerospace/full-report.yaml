      - number: '1.4'
        title: Operating Scale, Geography, and Customer Base
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace employs more than 250 people across operations in the United Kingdom, Germany, Poland,
              Norway, Ukraine, and Australia. The UK headcount has grown from approximately 125 employees at the time of
              the April 2026 MoD contract announcement to over 250 by the Series C close. The company operates at least
