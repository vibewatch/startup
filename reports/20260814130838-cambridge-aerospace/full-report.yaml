      - number: '2.2'
        title: Sizing the Counter-Drone Opportunity Across Multiple Lenses
        blocks:
          - type: paragraph
            body: >
              No single number captures this market, so we triangulate across independent analyst lenses. Bottom-up
              C-UAS system studies cluster around $3-4 billion of global spend in 2026: MarketsandMarkets sizes the
              counter-UAS systems market on a path to roughly $29.7 billion by 2031 at a 26.5% CAGR, Fortune Business
              Insights and The Business Research Company place the anti-drone market in the low-single-digit billions
              today growing above 20% annually, and Grand View Research and Mordor Intelligence corroborate a 21-27%
              CAGR band. A demand-side lens frames the ceiling differently: European rearmament is lifting defence
              budgets by roughly a fifth, the UK's June 2026 Defence Investment Plan earmarks more than £5 billion for
              drones and autonomous systems within a ~£62 billion annual defence budget, and SIPRI data shows sustained
              double-digit growth in European military expenditure. A threat-volume lens is the most bullish: if Russia
              and other actors launch tens of thousands of Shahed-class drones per year and each requires one or more
              interceptors priced in the tens of thousands, the interceptor consumption market alone could run into the
              billions annually. We treat the analyst C-UAS figures as the defensible TAM, the European kinetic-effector
              share as the SAM, and the UK/allied near-term procurement pipeline as the obtainable SOM, while preserving
              the wide dispersion between these estimates as a diligence gap.
            claimRefs:
