      - number: '7.2'
        title: Regulatory and Legal Risk
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace operates in one of the most heavily regulated sectors in existence. Its products are
              dual-use, export-controlled weapons: UK exports are governed by the Export Control Act 2002 and the Export
              Control Joint Unit licensing regime, while any US-origin technology or sales invoke US International
              Traffic in Arms Regulations and the Arms Export Control Act. Every foreign sale to Jordan, the Gulf or
              other allies requires licences that can be delayed or refused on foreign-policy grounds, directly gating
              the export pipeline. A distinct and live legal exposure is inbound investment screening: the UK National
              Security and Investment Act 2021 gives the government call-in powers over acquisitions of sensitive
              defence assets, and the provenance of late-stage investors — notably the Ora Global LP — raises questions
              about whether any stake triggered or should have triggered notification. Governance-adjacent legal risk
              crystallised publicly with the Grant Shapps affair: the Advisory Committee on Business Appointments
              (ACOBA) polices former ministers' business appointments, and the conflict around Shapps's chairmanship led
              to his May 2026 resignation, an on-the-record adverse event. Additional latent exposures include
              intellectual-property disputes over guidance technology, munitions-safety and environmental regulation of
              solid-rocket-motor production, and employment/subsidiary compliance across six countries. Specific
              licences, filings and any enforcement contacts are not public, leaving a diligence gap.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
