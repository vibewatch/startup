  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Investment Thesis and Anti-Thesis
        blocks:
          - type: paragraph
            body: >
              The bull thesis ties together every prior chapter. On market, Cambridge Aerospace sits in the
              fastest-growing pocket of defence — counter-drone air defence, a roughly $3-3.5 billion 2026 market
              compounding above 20% on the back of European rearmament. On product, Skyhammer is a fielded, radar-guided
              interceptor priced an order of magnitude below legacy systems, solving a real cost-exchange problem. On
              customers, it has a production UK MoD contract, US Army developmental testing and allied trials — rare
              validation for a two-year-old firm. On competition, it is one of the few pure-play low-cost-interceptor
              specialists with a solid-rocket-motor moat via Nightstar. On financials, it is deeply capitalised (~$636
              million raised) with a top-tier syndicate. The anti-thesis is equally coherent: the valuation rests on no
              disclosed revenue or margin and appears anchored to comparison with Anduril rather than Cambridge's own
              numbers; demand is partly conflict-dependent and could ease; the customer base is dangerously concentrated
              on the UK MoD; governance is thin after the Shapps ACOBA resignation; and execution risk — scaling
              manufacturing and Nightstar — is high. The investment question is therefore not whether Cambridge
              Aerospace is a good company (it is credibly excellent) but whether $3.4 billion is a defensible entry
              price for an asset whose fundamentals are still almost entirely private.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
