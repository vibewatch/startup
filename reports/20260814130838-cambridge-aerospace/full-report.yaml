      - number: '5.4'
        title: Deployment, Integration, Reliability, and Roadmap
        blocks:
          - type: paragraph
            body: >
              On deployment, Skyhammer has crossed the hardest threshold for a defence product: it entered UK Ministry
              of Defence service with first deliveries in May 2026 and has been fired in developmental testing with the
              US Army under Project Bullfrog, with trials completed in Jordan. That real-world usage, plus selection for
              the UK LEAP programme, is stronger integration evidence than most two-year-old hardware companies can
              show. Integration-wise, the product is designed to attach to existing sensors and command-and-control
              rather than require a bespoke stack, lowering adoption friction for allied militaries. Reliability,
              hit-rate and failure data are not public, which is a material gap: for a kinetic interceptor, intercept
              probability and round reliability are the metrics that matter most, and none are disclosed. The roadmap is
              clear in direction if not in dates: scale Skyhammer production, bring Nightstar SRM capacity online, and
              deliver Starhammer for 2027 to address faster threats. Each roadmap item carries execution risk —
              manufacturing scale-up, facility construction, and a Mach 2 development programme respectively — and the
              maturity of each differs sharply, from fielded (Skyhammer) to under-construction (Nightstar) to
              pre-production (Starhammer).
