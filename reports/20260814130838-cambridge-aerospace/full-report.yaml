              - CV005
      - number: '8.2'
        title: Recommendation, Confidence, and Risk Rating
        blocks:
          - type: paragraph
            body: >
              The recommendation is TRACK with medium confidence and a high risk rating, reflecting a genuinely
              high-quality franchise priced for near-flawless execution. This is not a pass — the company's product,
              traction and team are strong enough that a passive dismissal would be a mistake — but it is not a
              conviction buy at $3.4 billion either, because the price already embeds a large share of the upside while
              the downside (concentration, demand cyclicality, governance, execution) is real and only partially
              mitigated. The valuation stance is therefore "stretched": justifiable only under the bull scenario and
              vulnerable to a defence-tech cohort re-rating. On target return and hold, the appropriate posture for a
              growth investor is a milestone-gated position — enter or add only on evidence of diversified revenue,
              disclosed unit economics and Nightstar progress — with a multi-year hold to a strategic acquisition or IPO
              exit. For an investor already in prior rounds, the read is to hold and monitor rather than mark up
              further. The recommendation logic figure traces how the six diligence dimensions (market, product,
              customers, competition, financials, risk) combine into this verdict, and the investment-KPI figure
              summarises the headline numbers — $3.4 billion valuation, ~$636 million raised, 2.6x step-up, 250-plus
              headcount — that frame the decision.
