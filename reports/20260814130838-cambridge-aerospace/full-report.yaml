            title: Vertical SRM integration is the structural bet
            body: >
              Owning solid-rocket-motor production via Nightstar is intended to convert a scarce, export-controlled
              input into a moat. The thesis only holds if the Norfolk facility delivers on construction, yield and
              munitions-safety certification.
            calloutType: assumption
