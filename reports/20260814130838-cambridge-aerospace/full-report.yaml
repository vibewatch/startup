      - number: '1.2'
        title: Leadership, Founders, and Governance
        blocks:
          - type: paragraph
            body: >
              The founding leadership of Cambridge Aerospace combines academic aerospace engineering depth with
              defence-industry commercial experience. CEO Steven Barrett is a professor of aerospace engineering who
              held positions at both the Massachusetts Institute of Technology and the University of Cambridge; he is
              widely credited for leading the first demonstration of a solid-state ion-drive aircraft in 2018. Chief
              Commercial Officer Chris Sylvan served more than a decade in the Royal Marines before becoming Anduril's
              director for Europe, the Middle East, and Africa—the first time a European defence-tech founder had
              assembled the Anduril commercial playbook inside a startup. Co-founder Junaid Hussain is a serial
              defence-technology entrepreneur. Together they built a team of more than 250 employees, with roughly
              two-thirds in technical or engineering roles. The chairman was initially the Rt Hon Grant Shapps, former
              UK Secretary of State for Defence. In May 2026 Shapps resigned following public scrutiny from the UK's
              Advisory Committee on Business Appointments (ACOBA), which raised concerns that his engagement in defence
              matters at Cambridge Aerospace conflicted with restrictions placed on him upon leaving government. The
              episode illustrates a governance vulnerability for a company that deliberately assembled political
              credibility as a founding asset. No replacement chair had been named publicly by the report runDate.
