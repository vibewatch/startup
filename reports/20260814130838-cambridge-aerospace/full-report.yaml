      - number: '8.3'
        title: Financing Context, Entry Discipline, and Dilution
        blocks:
          - type: paragraph
            body: >
              The financing context is the crux of the entry-discipline question. Cambridge Aerospace has raised across
              four rounds in under two years: a $36 million seed (2024), a $100 million Series A at roughly $400 million
              (September 2025), a $200 million Series B at $1.3 billion (April 2026), and a $300 million Series C at
              $3.4 billion (August 2026). The most striking feature is velocity and step-up: the valuation rose 2.6x in
              four months from Series B to Series C, far faster than underlying fundamentals could have changed, which
              is a classic sign of momentum-driven pricing in a hot category. Entry discipline at $3.4 billion is
              difficult to exercise because there are no revenue or margin anchors — the price is set by scarcity of
              comparable assets and investor competition, not by a multiple. Dilution and preference overhang matter:
              four priced rounds with tier-one investors (DFJ Growth, Lux, Accel, Spark, Elad Gil, Never Lift, Ora
              Global) imply a stacked liquidation-preference structure that a new common or late equity investor must
              weigh, though exact terms are private. A disciplined entry would demand either a structured instrument
              (preference, ratchet) or a lower effective basis via secondary. The valuation-and-return range figure
              below frames plausible outcomes against the $3.4 billion entry, underscoring that discipline here is
              mostly about instrument and timing, not headline price.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: figure
