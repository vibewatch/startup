  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Definition in Customer Workflow Terms
        blocks:
          - type: paragraph
            body: >
              In the customer's workflow, Cambridge Aerospace sells the "effector" at the end of a short-range
              air-defence kill chain: a low-cost interceptor that a military uses to physically destroy incoming one-way
              attack drones and, in time, faster threats. The operational problem it solves is cost-exchange asymmetry —
              a Shahed-class drone costs roughly $20,000-$50,000, while legacy interceptors cost $1 million or more, so
              defenders lose the economic battle even when they win the engagement. Skyhammer is designed to sit inside
              an existing sensor and command-and-control loop: a radar or other sensor detects and tracks the threat, an
              operator or automated fire-control system authorises engagement, and the tube-launched Skyhammer flies out
              under radar guidance to intercept. From the buyer's perspective the product is therefore not a standalone
              gadget but a magazine of affordable rounds that plugs into layered air defence, complementing guns,
              jammers and higher-end missiles. The company frames Skyhammer as the mass-producible kinetic layer that
              makes sustained drone defence financially viable, which is the workflow gap it is built to fill.
              Starhammer extends the same workflow to higher-speed cruise-missile-class threats.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE002
