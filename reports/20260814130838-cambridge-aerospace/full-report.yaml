      - number: '6.5'
        title: Expansion, Concentration, and Channel Risk
        blocks:
          - type: paragraph
            body: >
              Expansion potential and concentration risk are two sides of the same coin. On expansion, the
              land-and-expand logic is real: an initial UK order can expand into LEAP program-of-record volume,
              additional munitions types (Starhammer), sustainment revenue, and — via foreign military sales — allied
              export to the US, Jordan and Gulf partners. Each existing trial is a potential future account, and the
              counter-drone threat environment is pushing multiple NATO and allied buyers toward exactly this category.
              On concentration, the risk is acute: the UK MoD is the dominant single customer, so top-customer
              concentration is very high and revenue is exposed to one government's budget, procurement policy and
              political cycle. Channel risk compounds this — export sales depend on government-to-government
              foreign-military-sales processes and licensing, introducing intermediaries and approval risk outside the
              company's control. An adverse reading notes that concentrated, conflict-driven, politically-mediated
              demand is fragile: the same forces that produced explosive adoption could reverse if the threat
              environment eases or a key relationship (as with the Shapps-linked political access) is disrupted.
