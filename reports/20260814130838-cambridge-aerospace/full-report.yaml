  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Severity-Ranked Risk Overview
        blocks:
          - type: paragraph
            body: >
              Ranking Cambridge Aerospace's risks by the product of likelihood and impact, five clusters stand out.
              First, execution and manufacturing scale-up: the entire thesis depends on producing cheap interceptors at
              volume, and scaling from the low hundreds toward thousands of rounds per year — while simultaneously
              building the Nightstar solid-rocket-motor facility amid a systemic NATO propulsion shortage — is
              high-likelihood, high-impact and only partially mitigated. Second, customer concentration: with the UK MoD
              as the dominant buyer, a single procurement or budget decision can swing the revenue trajectory. Third,
              governance: the Grant Shapps ACOBA conflict and his May 2026 resignation left a chair vacancy and reduced
              visible board oversight. Fourth, regulatory and export-control exposure: dual-use munitions are tightly
              licensed under UK and US regimes, and late-stage investor provenance (Ora Global) raises
              national-security-investment questions. Fifth, demand durability: procurement urgency is partly
              conflict-dependent and could ease. Financial and model risk (high capital intensity, undisclosed burn) and
              Starhammer development risk round out the register. The heatmap below scores each on likelihood, impact
              and residual exposure after existing mitigations, and the remainder of the chapter details each cluster,
              its transmission into the business, and the mitigations, monitoring indicators and thesis-break triggers
              that would change the assessment.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
