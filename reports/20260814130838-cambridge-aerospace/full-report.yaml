              - CV029
      - number: '8.7'
        title: Exhibits
        blocks:
          - type: callout
            title: A genuinely excellent company
            body: >
              Fielded product, real UK MoD and US Army traction, a differentiated solid-rocket-motor moat, deep funding
              and a world-class team make Cambridge Aerospace the most credible low-cost drone-interceptor franchise in
              Europe. The quality of the asset is not in doubt.
            calloutType: strength
            claimRefs:
              - CV002
              - CV003
          - type: callout
            title: A momentum-priced entry at $3.4B
            body: >
              A 2.6x step-up in four months with no disclosed revenue, anchored to comparison with Anduril, means the
              price embeds substantial future success while the downside is real. Entry discipline is about instrument
              and timing, not headline price.
            calloutType: risk
            claimRefs:
              - CV012
              - CV020
          - type: callout
            title: TRACK, pending disclosure
            body: >
              The recommendation is to track and re-underwrite on evidence of diversified revenue, disclosed unit
              economics and Nightstar progress. Disclosed healthy margins would justify a BUY; a major risk
              crystallising would justify a PASS.
            calloutType: assumption
            claimRefs:
