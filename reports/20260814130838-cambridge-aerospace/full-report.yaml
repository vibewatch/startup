      - number: '5.2'
        title: Product Line, Module, and Facility Map
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace's portfolio spans two missile product lines plus an enabling manufacturing asset.
              Skyhammer is the in-production flagship: an ~18 kg, ~700 km/h, ~30 km-range interceptor with an X-band
              radar seeker, priced around $27,000-$40,000. Starhammer is the in-development second product: a heavier
              (~90 kg), Mach 2, solid-rocket-motor-powered interceptor aimed at faster threats, targeted for 2027. The
              Nightstar facility in Norfolk is the critical enabling asset — an in-house solid-rocket-motor
              manufacturing programme intended to secure propulsion supply for both missiles and, potentially, third
              parties. Around these sit the constituent modules of any interceptor: airframe and propulsion, seeker and
              guidance electronics, warhead and fuzing, flight-control software and autonomy, and the launcher and
              fire-control integration that ties the round to the customer's sensors. The company's engineering
              footprint is distributed across the UK, Germany, Poland, Norway, Ukraine and Australia, with roughly
              two-thirds of its 250-plus staff in technical roles, indicating a genuine multi-disciplinary hardware and
              software organisation rather than a single-site prototype shop. This module and facility map defines where
              value, IP and execution risk concentrate.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
