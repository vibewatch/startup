      - number: '2.5'
        title: Sizing Diligence Gaps and Contradictory Estimates
        blocks:
          - type: paragraph
            body: >
              The market case is compelling but rests on wide, sometimes contradictory estimates that a buyer must not
              collapse into a single headline number. Analyst C-UAS market sizes vary by more than an order of magnitude
              at the 2030-2031 horizon depending on whether electronic-warfare, detection and civilian segments are
              included, and none isolate the specific low-cost kinetic-interceptor niche Cambridge occupies. The
              threat-volume lens that makes the market look enormous is inherently conflict-dependent and therefore
              volatile. The obtainable near-term revenue is gated by undisclosed contract values — the UK MoD deal is
              only described as "multi-million-pound" — so the SOM cannot be sized precisely from public data.
              Penetration assumptions for a two-year-old supplier displacing entrenched primes are unproven at scale. We
              preserve these as explicit diligence gaps rather than resolving them: the market is clearly large and
              growing fast, but the spread between the bear case (a peace-driven demand normalisation) and the bull case
              (sustained attritable-drone warfare) is the central uncertainty that the later valuation chapter must
              price.
            claimRefs:
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: The market is real and fast-growing, but the addressable slice is narrower than the headlines
            body: >
              Every analyst agrees the counter-drone market is expanding above 20% annually, but the widely quoted
              $7.5-30 billion figures bundle detection, jamming and civilian segments. Cambridge Aerospace's true
              addressable market is the narrower low-cost kinetic-effector niche, where it is a first mover but where
              the absolute revenue pool is smaller and gated by state procurement.
            calloutType: insight
            claimRefs:
              - CM006
              - CM007
              - CM009
          - type: callout
            title: Demand is partly conflict-dependent
            body: >
              The most bullish sizing lens rests on tens of thousands of attack drones being launched each year. A
              durable de-escalation would not eliminate the counter-drone requirement, but it would remove the urgency
              that currently compresses procurement timelines and inflates near-term reorder assumptions.
            calloutType: risk
            claimRefs:
              - CM022
              - CM025
          - type: callout
            title: European sovereignty tailwind favours a UK challenger
            body: >
              Rearmament plus a political preference for domestic and European suppliers over US primes creates an
              opening a two-year-old UK company can exploit — the same LEAP and Sky Shield dynamics that expand the
              budget also bias it toward local low-cost effectors.
            calloutType: strength
            claimRefs:
              - CM019
              - CM020
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: The Competitive Landscape Across Direct, Incumbent, Adjacent, and Substitute Layers
        blocks:
          - type: paragraph
            body: >
              The counter-drone competitive landscape is unusually crowded because the problem sits at the intersection
              of missiles, drones, radar and software. Direct peers are other venture-backed defence-tech firms building
              kinetic or full-stack counter-drone systems: Anduril, whose Anvil interceptor and Lattice autonomy stack
              make it the benchmark and the best-capitalised competitor at a reported $61 billion valuation; US kinetic
              counter-drone systems such as Raytheon's (RTX) Coyote; and smaller European entrants such as Alta Ares.
              Incumbent missile primes are the second layer: MBDA, whose DEFENDAir effector is being integrated with the
              Rheinmetall Skyranger 30, and larger primes including Lockheed Martin, Thales, Saab, Kongsberg and
              Leonardo that hold the national fire-control relationships Cambridge Aerospace must displace or integrate
              with. Rafael's Drone Dome and Israel's broader air-defence ecosystem form an export-competitive third
              layer. Adjacent and substitute players attack the same buyer budget without a kinetic interceptor:
              DroneShield and other electronic-warfare/jamming vendors defeat drones by disrupting their links, while
              Helsing sells the AI and software layer that could commoditise the autonomy Cambridge builds in-house.
              Finally, the status quo — expensive legacy interceptors and internal government build programmes — remains
              the largest single alternative. Cambridge Aerospace's positioning is to be the cheapest credible kinetic
              effector in this field.
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
