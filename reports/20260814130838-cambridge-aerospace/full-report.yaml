      - number: '3.2'
        title: Competitor Profiles — Scale, Funding, and Strategic Direction
        blocks:
          - type: paragraph
            body: >
              Anduril is the defining competitor: founded in 2017, US-based, reportedly valued around $61 billion in
              2026, with a full-stack model spanning autonomy software (Lattice), sensors and effectors including the
              Anvil counter-drone interceptor. Its scale, balance sheet and US government relationships dwarf Cambridge
              Aerospace, though its interceptors are not primarily positioned on ultra-low unit cost. MBDA is the
              European missile incumbent, a Airbus/BAE/Leonardo joint venture with deep national relationships and the
              DEFENDAir interceptor for the Skyranger 30 short-range air-defence system; it competes on integration and
              sovereignty rather than price or speed. RTX's Coyote and Rafael's Drone Dome bring proven, fielded kinetic
              and layered systems but at incumbent cost structures. DroneShield, an ASX-listed Australian company, leads
              the non-kinetic electronic-warfare niche and is profitable and scaling, but does not physically destroy
              targets, making it a complement as much as a competitor. Helsing, an Anglo-German AI/software defence
              company valued in the billions, competes for the autonomy and targeting layer. Cambridge Aerospace's own
              scale — roughly $636 million raised and a $3.4 billion valuation in under two years — is large for its age
              but a fraction of Anduril's and MBDA's resources; its strategic direction is speed, low cost, and SRM
              vertical integration.
