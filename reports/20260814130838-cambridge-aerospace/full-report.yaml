      - number: '8.5'
        title: Comparable Set
        blocks:
          - type: paragraph
            body: >
              Comparables must be read with care because Cambridge Aerospace has no disclosed revenue to multiply. The
              most cited private reference is Anduril, valued around $61 billion in 2026 as the full-stack autonomy
              leader whose success underpins investor enthusiasm for defence-tech — but Anduril is far larger and more
              diversified, so it is an aspirational, not a like-for-like, comp. Helsing, the European AI-defence peer at
              roughly $12 billion, is a closer geographic and stage analogue though software-centric. Among public
              comparables, Palantir, Kratos Defense, BAE Systems and Northrop Grumman anchor the range on
              demonstrated-revenue multiples: high-growth defence-software names trade at rich multiples while primes
              trade at low-teens EBITDA multiples, bracketing where a hardware-heavy Cambridge might eventually sit.
              Private-round references — Cambridge's own Series A/B/C progression — show the category's momentum
              pricing. The comparable table below enumerates a representative set with valuation, business model and
              relevance; it is deliberately a sample, not an exhaustive comp universe, because no revenue-based multiple
              can be computed for Cambridge itself. The honest conclusion is that the $3.4 billion mark is a
              scarcity-and-momentum price triangulated from private defence-tech comps, not a fundamentals-derived
              value, and the comparison to Anduril in particular flatters it.
