      - number: '5.3'
        title: Architecture and Operating Model
        blocks:
          - type: paragraph
            body: >
              Architecturally, Skyhammer is a conventional radar-guided interceptor optimised for cost and
              manufacturability rather than exotic performance. The seeker is an X-band radar seeker, well suited to
              acquiring small, slow, low-signature drone targets; guidance couples that seeker to onboard flight-control
              electronics and software that steer the airframe to intercept, likely terminating with a warhead and
              proximity fuzing appropriate to a drone-sized target. The propulsion for Skyhammer enables ~700 km/h
              flight, while Starhammer moves to a solid rocket motor for Mach 2. The operating model's defining choice
              is design-for-mass-production: the company reportedly took Skyhammer from concept to flight test in
              roughly six weeks and is scaling output from the low hundreds toward thousands of rounds per year, which
              only works if the design deliberately uses producible, lower-cost components and automated assembly.
              Vertical integration of solid-rocket-motor production via Nightstar is the other structural bet,
              converting a scarce, export-controlled input into an in-house capability. The architecture is therefore
              best understood as a systems-integration and manufacturing play — combining a proven guidance approach
              with aggressive design-to-cost and supply-chain control — rather than a breakthrough in any single
              subsystem.
            claimRefs:
              - CE010
              - CE011
              - CE012
              - CE013
              - CE014
