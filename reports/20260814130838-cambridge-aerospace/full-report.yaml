      - number: '5.5'
        title: Differentiation — Technology, Know-How, Supply, and Approvals
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace's differentiation is not a single patented breakthrough but a stack of hard-to-copy
              advantages. First is development tempo: taking an interceptor from concept to flight in weeks and to a
              national contract in under two years demonstrates an engineering and decision-making velocity that legacy
              primes structurally lack. Second is design-for-cost manufacturing know-how — building a radar-guided
              missile that can sell for tens of thousands rather than hundreds of thousands of dollars is itself the
              moat, because it requires component, tooling and assembly choices that are difficult to reverse-engineer.
              Third is supply-chain access via Nightstar: owning solid-rocket-motor production addresses a systemic NATO
              propulsion shortage and would let Cambridge Aerospace supply itself (and possibly others) while
              competitors queue for scarce motors. Fourth is regulatory and customer position: active UK MoD contracts
              and US developmental testing confer trust, clearances and reference credibility that are slow to earn. The
              founding team — an aerospace professor who led the first ion-drive aircraft, an ex-Anduril EMEA director,
              and a serial defence entrepreneur — combines academic depth with a proven commercial defence playbook. The
              differentiation is real but imitable over time, especially as well-funded rivals target the same
              low-cost-interceptor niche.
            claimRefs:
              - CE020
              - CE021
              - CE022
              - CE023
              - CE024
      - number: '5.6'
        title: Trust, Safety, Security, and Quality Controls
        blocks:
          - type: paragraph
            body: >
              Building lethal munitions imposes trust, safety, security and compliance obligations far beyond a typical
              software startup. On the regulatory side, Cambridge Aerospace's products are dual-use, export-controlled
              weapons subject to UK and US arms-control regimes, meaning every foreign sale requires licences and every
              component supply is scrutinised; the provenance of some late-stage investors (for example Ora Global)
              raises national-security-investment questions that bear on trust. On safety and quality, manufacturing
              solid rocket motors and live warheads demands rigorous handling, storage, munitions-safety certification
              and quality management — precisely the disciplines the Nightstar facility must institutionalise, and
              precisely where a young company scaling fast carries risk. Security of the design, software and supply
              chain is critical because an interceptor's guidance and autonomy are attractive targets for adversary
              interference. None of Cambridge Aerospace's specific certifications, munitions-safety approvals, quality
              accreditations or cyber controls are publicly detailed, which is expected for a defence firm but leaves an
              evidence gap for diligence. The governance dimension of trust was also dented by the Grant Shapps ACOBA
              conflict and his May 2026 resignation, leaving the board's compliance oversight less visible. Trust here
              is underwritten mostly by customer validation rather than disclosed controls.
            claimRefs:
              - CE025
              - CE026
              - CE027
              - CE028
