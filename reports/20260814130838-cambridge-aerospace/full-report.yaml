      - number: '7.6'
        title: Mitigations, Monitoring, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >
              Each major risk has partial mitigations, monitorable indicators, and a threshold that would break the
              thesis. Execution risk is mitigated by deep funding, an experienced team and vertical SRM integration; the
              monitoring indicators are delivered-unit counts, Nightstar construction milestones and on-time MoD
              deliveries, and the thesis-break trigger is a material production slip or Nightstar failure. Concentration
              risk is mitigated by an expanding pipeline (US, Jordan, Gulf, wider Europe); the indicator is the share of
              revenue outside the UK MoD, and the trigger is loss or non-renewal of the anchor contract. Governance risk
              is mitigated only partially — the Shapps departure removed the conflict but left a vacancy; the indicator
              is appointment of a credible independent chair and disclosed board, and the trigger is continued
              governance opacity or a further compliance event. Regulatory risk is mitigated by operating within
              licensing regimes; the indicators are clean export-licence approvals and the absence of an NSI call-in,
              and the trigger is a blocked export or a national-security intervention over investor provenance. Demand
              risk is mitigated by structural European rearmament; the indicator is sustained defence-budget commitment,
              and the trigger is a durable de-escalation that removes procurement urgency. The kill-criteria table
              consolidates these triggers and the priority diligence asks — financials, contracts, board composition,
              licences and Nightstar status — that would resolve the largest uncertainties. Overall, the risk rating is
              high but not disqualifying, contingent on execution.
