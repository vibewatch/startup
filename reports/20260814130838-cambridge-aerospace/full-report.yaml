              Army's 52nd Air Defense Artillery Brigade began Project Bullfrog—a developmental test of Skyhammer in
              Europe—in 2026, with a fuller operational assessment of Starhammer as a counter-cruise-missile tool
              planned for the summer of 2026. Cambridge Aerospace also completed successful Skyhammer trials in Jordan
              in 2026. The Defence Secretary's announcement specifically referenced "Gulf partners" alongside UK Armed
              Forces, confirming active export pipeline engagement.
