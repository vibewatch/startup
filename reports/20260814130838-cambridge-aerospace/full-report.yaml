            title: A genuine order-of-magnitude cost wedge
            body: >
              Cambridge Aerospace's clearest competitive advantage is price: a $27,000-$40,000 interceptor against
              incumbents costing $100,000 to over $1 million. In a market defined by magazine depth against cheap
              drones, cost-per-kill is the buying criterion that matters most, and no established prime currently
              matches it on a fielded kinetic system.
            calloutType: strength
            claimRefs:
              - CP015
