      - number: '4.6'
        title: Financial Verdict — Revenue Quality, Margin Path, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >
              The financial verdict is that Cambridge Aerospace is well-capitalised but financially opaque. On the
              positive side, the funding base is deep, the investor syndicate is top-tier, the revenue model is anchored
              to real government contracts, and the cost thesis (cheap, mass-produced interceptors) is credible and
              strategically differentiated. On the negative side, essentially every metric a lender or equity
              underwriter needs — revenue, backlog value, gross margin, burn, runway, unit economics, contract duration
              and recognition policy — is private, and the valuation is therefore an act of faith in future scale rather
              than a multiple of demonstrated financials. The principal diligence blockers are: obtaining the income
              statement and backlog; verifying Skyhammer unit BOM cost and gross margin; understanding Nightstar capex
              and financing; and confirming customer concentration and contract terms. Until these are answered
              privately, the financial profile should be read as "strong balance sheet, unproven income statement" — an
              appropriate posture for a two-year-old hardware company priced at $3.4 billion. An adverse read notes the
