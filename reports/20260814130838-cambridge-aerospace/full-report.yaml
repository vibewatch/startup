  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams, Pricing, and Mix
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace's revenue model is government defence contracting rather than recurring software. The
              primary stream is munitions supply — selling Skyhammer interceptors, and eventually Starhammer, to
              national armed forces — complemented by launcher and fire-control integration, technical support, spares,
              and training bundled into the same contracts. The first material contract is the UK Ministry of Defence's
              "multi-million-pound" Skyhammer order, with first deliveries in May 2026, followed by selection for the UK
              LEAP programme; the US Army's Project Bullfrog developmental test and Jordan/Gulf trials represent
              potential future streams rather than booked revenue. Pricing is anchored to an estimated $27,000-$40,000
              per Skyhammer round, an order of magnitude below legacy interceptors, but the realised contract price,
              quantities and margin are not disclosed. A prospective future stream is third-party solid-rocket-motor
              supply from Nightstar, which could sell propulsion into other missile programmes. The revenue mix today is
              therefore almost entirely UK-government-weighted and lumpy — characteristic of early defence primes — with
              no public split between hardware, integration and sustainment. Revenue recognition for multi-year defence
              contracts (milestone versus delivery) is unknown and material to any quality assessment.
