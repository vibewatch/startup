      - number: '8.6'
        title: Exit Readiness, Diligence Asks, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >
              On exit readiness, Cambridge Aerospace is plausibly a strategic-acquisition or IPO candidate over a
              multi-year horizon: a US or European prime, or a large defence-tech platform, would find a fielded
              low-cost interceptor and a solid-rocket-motor facility strategically valuable, and the category momentum
              keeps an IPO window conceivable if it scales revenue. But it is not exit-ready today — it is too early,
              too private and too concentrated. The final-diligence asks that would most move the underwriting are, in
              priority order: audited or management financials (revenue, backlog, gross margin, burn, runway); the MoD
              and other contract terms (value, duration, exclusivity, renewal); board composition and the post-Shapps
              governance structure; Nightstar status (capex, timeline, certification, yield) and Skyhammer unit
              economics; and export-licence and NSI-Act status including the Ora Global provenance. The thesis-break
              triggers that would flip the recommendation from TRACK to PASS are a material production or Nightstar
              failure, loss or non-renewal of the anchor MoD contract, evidence of weak unit economics or excessive
              burn, a blocked export or national-security intervention, or a durable de-escalation removing procurement
              urgency. Conversely, disclosed diversified revenue with healthy margins plus Nightstar delivery would
              justify moving to a BUY. The kill-criteria and diligence-ask tables below consolidate these, closing the
              report on a clear, monitorable decision framework.
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
