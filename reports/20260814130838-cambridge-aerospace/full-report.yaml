      - number: '2.3'
        title: Buyers, Users, Payers, and the Adoption Path
        blocks:
          - type: paragraph
            body: >
              In defence markets the buyer, user and payer diverge in ways that shape adoption. The economic buyer is a
              national defence ministry's procurement arm — for Cambridge Aerospace today the UK Ministry of Defence,
              with the US Army, Jordan and Gulf partners in the pipeline. The user is the front-line air-defence unit
              (for example the US Army's 52nd Air Defense Artillery Brigade running Project Bullfrog), and the payer is
              ultimately the national treasury operating within multi-year defence budgets. Budget ownership sits with
              capability sponsors inside ministries who trade off cost-per-engagement, magazine depth, and integration
              with existing radars and command systems. The adoption path runs from trials and demonstrations (DSEI,
              Jordan trials, Project Bullfrog) to a first production contract, to programme-of-record status such as the
              UK LEAP selection, to sustained reorder and export. This path is slow and relationship-driven, which is
              why Cambridge deliberately hired an ex-Anduril commercial leader and, initially, a former Defence
              Secretary as chair. Secondary segments — critical-national-infrastructure protection, border and maritime
              security, and allied foreign military sales — widen the payer base but remain smaller and later. The
              concentration of budget authority in a handful of ministries is both the opportunity (few doors to open)
              and the risk (customer concentration and political exposure).
            claimRefs:
              - CM013
              - CM014
              - CM015
              - CM016
              - CM017
