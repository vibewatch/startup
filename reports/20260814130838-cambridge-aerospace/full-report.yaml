          - type: callout
            title: Nightstar could convert a shared weakness into a proprietary moat
            body: >
              The solid-rocket-motor shortage constrains every competitor's production. If Nightstar delivers, Cambridge
              Aerospace turns an industry-wide bottleneck into a supply advantage — potentially even selling propulsion
              to rivals — which is far harder to replicate than any airframe.
