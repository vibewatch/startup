      - number: '3.5'
        title: Moat Durability, Commoditisation Risk, and Adverse Competitor Evidence
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace itself concedes that no single missile is a durable asset — designs get copied and
              improved. The company's defensibility therefore rests on compounding advantages: manufacturing scale and
              cost leadership, SRM vertical integration via Nightstar, accumulated programme relationships, and
              development tempo. Each is contestable. Cost leadership can be eroded if a better-capitalised competitor
              such as Anduril decides to field a comparably cheap interceptor, or if incumbents cut price under
              political pressure to build magazine depth. Commoditisation risk is real: the autonomy and seeker
              technology is available to many, and Helsing-class software could standardise the targeting layer.
              Displacement risk runs the other way too — a two-year-old firm can be out-scaled by primes if a peace
              scenario removes the urgency that currently privileges speed over pedigree. Adverse evidence includes the
              reality that Cambridge Aerospace's $3.4 billion valuation is partly benchmarked to Anduril's success
              rather than its own proven scale, and that its lower-tier speed and range leave the high-end threat space
              to better-resourced rivals. The durable questions are whether Nightstar delivers a true supply moat and
              whether cost leadership survives incumbent response.
            claimRefs:
              - CP025
              - CP026
              - CP027
              - CP028
