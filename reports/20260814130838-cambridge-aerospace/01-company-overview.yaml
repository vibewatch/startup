company:
  name: Cambridge Aerospace
chapter:
  number: 1
  title: Company Overview
  summary: >
    Cambridge Aerospace is a Cambridge, UK-based defence-technology company founded in late 2024 that
    designs and manufactures low-cost interceptor missiles to counter cheap attack drones. Its flagship
    Skyhammer interceptor entered UK Ministry of Defence service in May 2026, and a $300 million Series C
    at a $3.4 billion valuation closed on 10 August 2026, bringing total funding to approximately $636 million
    in under two years.

sections:
  - id: identity-and-product
    title: Company Identity and Product Model
    body: >
      Cambridge Aerospace was founded in Cambridge, UK, in late 2024 with an explicit mission to solve the
      cost asymmetry in modern air defence. Cheap one-way attack drones such as the Iranian-designed
      Shahed-136—purchased by Russia in large quantities—cost roughly $20,000–$50,000 each yet are routinely
      destroyed by interceptors priced above $1 million, creating an economically unsustainable exchange
      ratio for the defender. The company's answer is a family of tube-launched, radar-guided interceptors
      designed to be priced in the "tens of thousands" of dollars, affordable enough to be fielded in mass
      and to maintain favourable kill-cost economics against swarms of cheap drones.
      The company's product roadmap spans two interceptor tiers. Skyhammer, now in production, is a
      turbojet-powered system weighing approximately 18 kg and measuring under one metre, with a top speed
      of around 700 km/h (Mach 0.7), a range exceeding 30 km, and an X-band active radar seeker for
      all-weather autonomous targeting. Its blast-fragmentation warhead is designed against Shahed-class
      drones and subsonic cruise missiles. The estimated unit cost is $27,000–$40,000, an order of magnitude
      below traditional interceptors. Starhammer, targeted for 2027, is a heavier (~90 kg), faster (Mach 2),
      solid-rocket-motor-powered system for high-speed cruise missiles and eventually near-ballistic threats.
      The company is constructing a dedicated solid-rocket-motor manufacturing facility in Norfolk
      (programme name: Nightstar) to supply Starhammer and eventually to sell propulsion to other missile
      programmes, addressing a structural NATO shortage in solid rocket motor production.
    claimRefs:
      - CO001
      - CO002
      - CO003
      - CO004
