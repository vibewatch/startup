  - id: operating-scale
    title: Operating Scale, Geography, and Customer Base
    body: >
      Cambridge Aerospace employs more than 250 people across operations in the United Kingdom, Germany,
      Poland, Norway, Ukraine, and Australia. The UK headcount has grown from approximately 125 employees at
      the time of the April 2026 MoD contract announcement to over 250 by the Series C close. The company
      operates at least two UK manufacturing facilities; a second production site was being outfitted in
      early 2026 to increase throughput from the "low hundreds" of Skyhammer units annually to thousands
      of rounds per year. The Norfolk Nightstar facility for solid rocket motor production was under
      construction as of August 2026.
      The primary current customer is the UK Ministry of Defence, which signed a "multi-million-pound"
      contract in April 2026 covering Skyhammer missiles, launchers, integration, technical support, and
      training. The US Army's 52nd Air Defense Artillery Brigade began Project Bullfrog—a developmental
      test of Skyhammer in Europe—in 2026, with a fuller operational assessment of Starhammer as a
      counter-cruise-missile tool planned for the summer of 2026. Cambridge Aerospace also completed
      successful Skyhammer trials in Jordan in 2026. The Defence Secretary's announcement specifically
      referenced "Gulf partners" alongside UK Armed Forces, confirming active export pipeline engagement.
    claimRefs:
      - CO027
