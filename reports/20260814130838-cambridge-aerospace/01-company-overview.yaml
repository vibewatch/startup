  - id: milestones
    title: Key Milestones Chronology
    body: >
      Cambridge Aerospace achieved what its industry peers described as one of the fastest development
      tempos in postwar European defence: from founding in late 2024 to an MoD contract in seven months,
      and from founding to a $3.4 billion valuation in under two years. The company started Skyhammer
      development in January 2025 and completed initial flight testing within six weeks. By September 2025
      the company exhibited two working Skyhammer interceptors at DSEI, Europe's largest defence trade
      show. A seed-to-Series-C progression in under 24 months is matched only by a handful of US defence
      unicorns. The Grant Shapps governance incident in May 2026, while resolved without formal regulatory
      penalty, was the most significant adverse event in the reporting period.
    claimRefs:
      - CO033
      - CO034
      - CO035
