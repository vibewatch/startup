callouts:
  - calloutType: strength
    title: Unprecedented speed from founding to unicorn and MoD contract
    body: >
      No European defence-technology hardware company in the post-Cold War era has moved from founding to
      deployed government contracts and a $3 billion+ valuation in under two years. The combination of an
      experienced aerospace engineering CEO, a commercialist CCO from Anduril, and a genuinely urgent
      threat environment created extraordinary early momentum.
    claimRefs:
      - CO033
      - CO035
      - CO011
      - CO012

  - calloutType: risk
    title: Governance gap following chair resignation
    body: >
      Grant Shapps's resignation in May 2026 amid ACOBA conflict-of-interest scrutiny removed the
      company's most visible political credibility asset without a named replacement. The episode
      also raises the question of whether other board members or advisors face similar revolving-door
      restrictions that could limit their engagement in active defence procurements.
    claimRefs:
      - CO017
      - CO018

  - calloutType: insight
    title: Nightstar SRM facility is a strategic moat layer
    body: >
      The decision to build an in-house solid-rocket-motor manufacturing facility in Norfolk is
      strategically significant beyond Starhammer. NATO faces a documented structural shortage in
      solid-rocket-motor supply, which caps missile production across the alliance. By owning this
      capability, Cambridge Aerospace positions itself as a critical-infrastructure supplier to the
      broader European defence industrial base—a moat that is far harder to replicate than any
      single missile airframe.
    claimRefs:
      - CO007
      - CO008
      - CO009

