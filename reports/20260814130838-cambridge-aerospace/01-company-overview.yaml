  - id: leadership-and-team
    title: Leadership, Founders, and Governance
    body: >
      The founding leadership of Cambridge Aerospace combines academic aerospace engineering depth with
      defence-industry commercial experience. CEO Steven Barrett is a professor of aerospace engineering
      who held positions at both the Massachusetts Institute of Technology and the University of Cambridge;
      he is widely credited for leading the first demonstration of a solid-state ion-drive aircraft in 2018.
      Chief Commercial Officer Chris Sylvan served more than a decade in the Royal Marines before becoming
      Anduril's director for Europe, the Middle East, and Africa—the first time a European defence-tech
      founder had assembled the Anduril commercial playbook inside a startup. Co-founder Junaid Hussain is
      a serial defence-technology entrepreneur. Together they built a team of more than 250 employees, with
      roughly two-thirds in technical or engineering roles.
      The chairman was initially the Rt Hon Grant Shapps, former UK Secretary of State for Defence.
      In May 2026 Shapps resigned following public scrutiny from the UK's Advisory Committee on Business
      Appointments (ACOBA), which raised concerns that his engagement in defence matters at Cambridge
      Aerospace conflicted with restrictions placed on him upon leaving government. The episode illustrates
      a governance vulnerability for a company that deliberately assembled political credibility as a
      founding asset. No replacement chair had been named publicly by the report runDate.
    claimRefs:
      - CO011
      - CO012
      - CO013
      - CO014
      - CO015
      - CO016
      - CO017
      - CO018
    tableRefs:
      - TO002

  - id: funding-and-investors
    title: Funding History and Investor Base
    body: >
      Cambridge Aerospace has raised approximately $636 million in total funding across four rounds in under
      two years, one of the fastest capital formation trajectories in European defence-technology history.
      The seed round of $36 million was led by Never Lift in 2024. A $100 million Series A closed in September
      2025 at a $400 million valuation, led by Spark Capital and Lakestar with participation from Lux Capital,
      Accel, D3 Venture Capital, Never Lift, Expeditions Fund, and MW Group. A $200 million Series B closed in
      April 2026 at a $1.3 billion valuation, co-led by Elad Gil & Co and Spark Capital. Four months later,
      on 10 August 2026, the company closed a $300 million Series C at a $3.4 billion post-money valuation,
      led by DFJ Growth with participation from Lux Capital, Accel, Lakestar, Never Lift, Ora Global, and
      Elad Gil & Co. The 2.6× step-up in valuation between Series B (April 2026) and Series C (August 2026)
      was driven by rapid MoD contract wins, including the LEAP programme selection in July 2026.
      DFJ Growth founder Randy Glein stated that his firm "surveyed the global landscape and identified
      Cambridge as having the best team and technology to build the most advanced and modern air defence
      infrastructure for Europe and its allies." The investor base spans US venture capital (DFJ Growth,
      Spark Capital, Accel, Elad Gil & Co) and European growth funds (Lakestar, Ora Global), with Never Lift
      maintaining a presence across all rounds.
    claimRefs:
      - CO019
