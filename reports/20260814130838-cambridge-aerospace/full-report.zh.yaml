  - id: FO001
    title: Skyhammer 拦截弹价值链
    type: flow
    layout: standard
    summary: Skyhammer 系统如何把无人机威胁转化成高性价比拦截，成本仅为传统导弹的一小部分。
    data:
      nodes:
        - id: threat
          label: 无人机威胁
          detail: Shahed-136 级；每枚 $20k–$50k；蜂群发射
          type: input
        - id: detect
          label: 探测层
          detail: 雷达网络；威胁识别和跟踪
          type: process
        - id: launch
          label: 筒式发射器
          detail: 固定或机动平台；从威胁探测到发射只需数秒
          type: process
        - id: skyhammer
          label: Skyhammer 拦截弹
          detail: 18 kg；700 km/h；30+ km 射程；X-band 雷达导引头；单枚成本 $27k–$40k
          type: process
        - id: intercept
          label: 自主拦截
          detail: 爆破破片战斗部；交战时无需人工制导
          type: output
        - id: economics
          label: 交换比
          detail: ~$30k 拦截弹 vs $30–50k 威胁：可持续 1:1 或更优成本比
          type: output
      edges:
        - from: threat
          to: detect
          label: 探测
        - from: detect
          to: launch
          label: 跟踪 + 火控
        - from: launch
          to: skyhammer
          label: 筒式发射
        - from: skyhammer
          to: intercept
          label: 自主末段制导
        - from: intercept
          to: economics
          label: 成本测算
