      - number: '6.5'
        title: 扩张、集中度与渠道风险
        blocks:
          - type: paragraph
            body: >
              扩张潜力和集中度风险是一枚硬币两面。扩张上，先落地再扩张的逻辑真实存在：一笔英国初始订单可以扩成 LEAP 正式项目量、其他弹药类型（Starhammer）、保障收入，并通过外国军售出口给美国、约旦
              和海湾合作伙伴。现有每项试验都可能变成未来账户；反无人机威胁也在把多个 NATO 和盟国买家推向这个品类。集中度上，风险很尖锐：UK MoD
              是占主导的单一客户，因此头部客户集中度很高，收入暴露在一个政府的预算、采购政策和政治周期下。渠道风险进一步叠加——出口销售依赖政府对政府的外国军售流程和许可，把中间方和审批风险引入公司控制之外。反向读法会指出，集中、冲突驱动、政治中介化的需求很脆弱：带来爆发式采用的同一组力量，如果威胁环境缓和或关键关系（例如与
              Shapps 相关的政治通道）受扰，也可能反向。锚定客户之外的多元化，是接下来最重要的商业任务。
