      - number: '7.6'
        title: 缓释、监测与打破投资逻辑的触发条件
        blocks:
          - type: paragraph
            body: >
              每项主要风险都有部分缓释、可监测指标和打破投资逻辑的阈值。执行风险由深厚资金、经验团队和 SRM 纵向整合部分缓释；监测指标是交付单位数、Nightstar 建设里程碑和 MoD
              准时交付，触发条件是重大生产滑坡或 Nightstar 失败。集中度风险由扩大的管线（美国、约旦、海湾、更广泛欧洲）缓释；指标是 UK MoD
              之外收入占比，触发条件是锚定合同丢失或不续约。治理风险只被部分缓释——Shapps
              离开移除了冲突，但留下空缺；指标是任命可信的独立董事长并披露董事会，触发条件是治理继续不透明或再次发生合规事件。监管风险由在许可制度内运营缓释；指标是出口许可证顺利获批、没有 NSI
              介入，触发条件是出口被阻断或因投资者出处出现国家安全干预。需求风险由欧洲结构性重新武装缓释；指标是国防预算承诺持续，触发条件是持续缓和导致采购紧迫性消失。否决标准表汇总这些触发条件和优先尽调问题——财务、合同、董事会构成、许可证和
              Nightstar 状态——以解决最大不确定性。总体看，风险评级高，但并非否决项，前提是执行到位。
