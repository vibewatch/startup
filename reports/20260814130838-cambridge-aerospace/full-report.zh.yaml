      - number: '8.7'
        title: 证据摘要
        blocks:
          - type: callout
            title: 一家确实优秀的公司
            body: |
              已列装产品、真实的 UK MoD 和美国陆军牵引、差异化的固体火箭发动机护城河、深厚资金和世界级团队，让 Cambridge Aerospace 成为欧洲最可信的低成本无人机拦截弹业务。资产质量没有疑问。
            calloutType: strength
            claimRefs:
              - CV002
              - CV003
          - type: callout
            title: $3.4B 入场价由动量定价
            body: |
              四个月内 2.6x 跳升、没有披露收入、锚定 Anduril 对比，意味着价格已嵌入大量未来成功，而下行真实存在。入场纪律在工具和时点，不在名义价格。
            calloutType: risk
            claimRefs:
              - CV012
              - CV020
          - type: callout
            title: 观察，等待披露
            body: |
              建议是观察，并在收入多元化、单位经济披露、Nightstar 进展有证据时重新承销。披露健康利润率可以支持买入；重大风险结晶则支持放弃。
            calloutType: assumption
            claimRefs:
              - CV009
              - CV028
