      - number: '3.2'
        title: 竞争对手画像——规模、融资与战略方向
        blocks:
          - type: paragraph
            body: >
              Anduril 是定义性竞争对手：2017 年创立，总部在美国，据报道 2026 年估值约 $61 billion，采用全栈模式，覆盖自主软件（Lattice）、传感器，以及包括 Anvil
              反无人机拦截器在内的效应器。它的规模、资金实力和美国政府关系远大于 Cambridge Aerospace，不过其拦截器主要不打超低单价。MBDA 是欧洲导弹在位者，由 Airbus/BAE/Leonardo
              合资组建，拥有深厚国家关系，并为 Skyranger 30 短程防空系统提供 DEFENDAir 拦截器；它靠集成和主权叙事竞争，而不是价格或速度。RTX 的 Coyote 和 Rafael 的 Drone
              Dome 带来已验证、已部署的动能和分层系统，但成本结构仍是传统在位者水平。DroneShield 是 ASX
              上市的澳大利亚公司，主导非动能电子战细分，已经盈利并在放量，但不物理摧毁目标，因此既是补充也是竞争者。Helsing 是估值数十亿美元的英德 AI / 软件防务公司，争夺自主和瞄准层。Cambridge
              Aerospace 自身规模——约 $636 million 融资、不到两年达到 $3.4 billion 估值——按年龄看很大，但只是 Anduril 和 MBDA
              资源的一小部分；它的战略方向是速度、低成本和固体火箭发动机垂直整合。
