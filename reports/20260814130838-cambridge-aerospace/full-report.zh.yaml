      - number: '5.4'
        title: 部署、集成、可靠性与路线图
        blocks:
          - type: paragraph
            body: >
              部署层面，Skyhammer 已跨过国防产品最难的一道门槛：2026 年 5 月随首批交付进入英国国防部服役，也在美国陆军 Project Bullfrog
              开发测试中完成实弹发射，并完成约旦试验。真实使用，再加上入选英国 LEAP
              项目，是多数成立两年的硬件公司拿不出的集成证据。集成上，产品接入既有传感器和指挥控制系统，而不是要求另起一套定制栈，因此降低盟军采用阻力。可靠性、命中率和故障数据没有公开，这是实质性缺口：动能拦截弹最关键的是拦截概率和弹体可靠性，但公司均未披露。路线图方向清楚，日期不清：扩大
              Skyhammer 产能、让 Nightstar 固体火箭发动机产能上线，并在 2027 年交付 Starhammer 以应对更快威胁。三项各有执行风险，分别是制造爬坡、设施建设和 Mach 2
              研发；成熟度也差异很大，从已列装的 Skyhammer，到在建的 Nightstar，再到量产前的 Starhammer。
            claimRefs:
              - CE015
