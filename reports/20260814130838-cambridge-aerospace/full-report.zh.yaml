              Cambridge Aerospace 累计融资约 $636 million，刚完成 $300 million C 轮，拥有多年现金垫和明星投资人组合（DFJ
              Growth、Lux、Accel、Spark、Elad Gil）。资本充足性是财务画像里最强的一环，也降低了制造扩产风险。
