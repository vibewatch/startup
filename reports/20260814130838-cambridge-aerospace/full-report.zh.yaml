  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入流、定价与结构
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace 的收入模式是政府防务合同，不是经常性软件收入。主收入流是弹药供应——向国家武装力量销售 Skyhammer 拦截弹，未来还包括
              Starhammer；发射器与火控集成、技术支持、备件和训练作为配套打包进同一合同。第一份实质性合同是英国国防部的“数百万英镑级”Skyhammer 订单，2026 年 5 月开始首批交付，随后公司入选英国
              LEAP 项目；美国陆军 Project Bullfrog 开发测试和 Jordan / 海湾试验代表潜在未来收入流，而不是已入账收入。定价锚定在每枚 Skyhammer 估计
              $27,000-$40,000，较传统拦截弹低一个数量级，但实际合同价格、数量和利润率均未披露。未来可能出现的收入流是 Nightstar
              向第三方供应固体火箭发动机，把推进系统卖进其他导弹项目。因此，今天的收入结构几乎完全押在英国政府，且项目型波动大——这是早期防务主承包商的典型状态——硬件、集成和维保之间没有公开拆分。多年期防务合同按里程碑还是按交付确认收入，目前未知，并且会实质影响任何质量评估。
