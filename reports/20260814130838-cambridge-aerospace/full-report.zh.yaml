      - number: '1.4'
        title: 运营规模、地理布局与客户基础
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace 员工超过 250 人，业务覆盖英国、德国、波兰、挪威、乌克兰和澳大利亚。英国员工数从 2026 年 4 月 MoD 合同公布时的约 125 人，增长到 C 轮交割时的
              250 多人。公司在英国至少运营两处制造设施；2026 年初，第二个生产基地正在装配，以把 Skyhammer 年产能从“低数百枚”提升到每年数千枚。截至 2026 年 8 月，用于固体火箭发动机生产的
              Norfolk Nightstar 设施仍在建设中。当前主要客户是英国国防部，双方在 2026 年 4 月签署了一份“数百万英镑级”合同，覆盖 Skyhammer 导弹、发射器、集成、技术支持和训练。2026
              年，美国陆军第 52 防空炮兵旅在欧洲启动 Project Bullfrog，对 Skyhammer 进行开发测试；作为反巡航导弹工具，Starhammer 更完整的作战评估计划在 2026
              年夏季进行。Cambridge Aerospace 也在 2026 年完成了 Jordan 的 Skyhammer
              成功试验。英国国防大臣的公告特别提到，在英国武装部队之外还有“海湾伙伴”，确认公司正在推进出口管线。
