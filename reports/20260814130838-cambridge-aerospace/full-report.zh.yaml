  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 用客户工作流定义产品
        blocks:
          - type: paragraph
            body: >
              在客户工作流里，Cambridge Aerospace 卖的是短程防空杀伤链末端的“效应器”：一种低成本拦截弹，军方用它物理摧毁来袭单向攻击无人机，并在未来应对更快威胁。它解决的作战问题是成本交换不对称——一架
              Shahed 级无人机大约 $20,000-$50,000，而传统拦截弹成本 $1 million 以上，所以防守方即便打赢交战，也输掉经济账。Skyhammer
              设计成嵌入既有传感器和指挥控制闭环：雷达或其他传感器发现并跟踪威胁，操作员或自动火控系统授权交战，筒射 Skyhammer
              在雷达制导下飞出并拦截。从买方视角看，产品不是孤立装备，而是一组可负担弹药，能接入分层防空，并补足火炮、干扰器和高端导弹。公司把 Skyhammer
              定位为可量产的动能层，让持续无人机防御在财务上可行；它正是为填补这个工作流缺口而生。Starhammer 把同一工作流延伸到更高速的巡航导弹级威胁。
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE002
            claimRefs:
              - CE001
              - CE002
              - CE003
      - number: '5.2'
        title: 产品线、模块与设施地图
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace 的产品组合覆盖两条导弹产品线，以及一个支撑性制造资产。Skyhammer 是已投产旗舰：约 18 kg、约 700 km/h、约 30 km 射程，配备 X
              波段雷达导引头，定价约 $27,000-$40,000。Starhammer 是正在开发的第二款产品：更重（约 90 kg）、Mach 2、采用固体火箭发动机，瞄准更快威胁，目标 2027 年推出。Norfolk
              的 Nightstar
              设施是关键支撑资产——公司自建固体火箭发动机制造计划，用来保障两款导弹的推进系统供应，并可能服务第三方。围绕这些产品，还有任何拦截弹都需要的组成模块：机体和推进、导引头和制导电子、战斗部和引信、飞控软件和自主能力，以及把弹体接入客户传感器的发射器与火控集成。公司的工程足迹分布在英国、德国、波兰、挪威、乌克兰和澳大利亚，250
              多名员工中约三分之二在技术岗位，说明这是一家真正的多学科硬件与软件组织，而不是单一地点的原型作坊。这张模块和设施地图，也标出了价值、IP 和执行风险集中在哪里。
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
          - type: table
            tableRef: TE001
