      - number: '2.3'
        title: 采购方、使用方、付款方与采纳路径
        blocks:
          - type: paragraph
            body: >
              防务市场里，采购方、使用方和付款方会分离，并直接塑造采纳路径。经济买方是国家国防部的采购部门——Cambridge Aerospace 今天对应的是英国国防部，管线里还有美国陆军、Jordan
              和海湾伙伴。使用方是一线防空部队（例如运行 Project Bullfrog 的美国陆军第 52
              防空炮兵旅），付款方最终是受多年防务预算约束的国家财政。预算所有权在国防部内部的能力条线负责人手里，他们要在单次交战成本、弹药储备深度，以及与既有雷达和指挥系统的集成之间取舍。采纳路径从试验和演示（DSEI、Jordan
              试验、Project Bullfrog）走向第一份生产合同，再走向 UK LEAP 这类正式项目地位，最后才是持续复购和出口。这条路慢、靠关系，所以 Cambridge 有意招来前 Anduril
              商业负责人，并在最初请前国防大臣担任董事长。次级分段——关键国家基础设施防护、边境与海上安全、盟友对外军售——会扩大付款方基础，但规模更小、也更靠后。预算权集中在少数部门手里，一面是机会（要打开的门不多），另一面是风险（客户集中和政治暴露）。
