chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 公司定位与产品模式
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace 于 2024 年底在英国 Cambridge 成立，目标很直接：解决现代防空里的成本不对称。Shahed-136
              这类伊朗设计的廉价单向攻击无人机——俄罗斯大批采购——单价大约 $20,000–$50,000，却常被 $1 million
              以上拦截弹击落，防守方的交换比在经济上撑不住。公司的解法是一族筒射、雷达制导拦截弹，设计单价落在“数万美元”，便宜到足以大规模部署，并在廉价无人机蜂群面前守住有利的杀伤成本。公司的产品路线图覆盖两个拦截层级。Skyhammer
              已经投产，采用涡喷动力，重约 18 kg，长度不到一米，最高速度约 700 km/h（Mach 0.7），射程超过 30 km，并配备 X 波段主动雷达导引头，可在全天候下自主瞄准。杀爆战斗部面向 Shahed
              级无人机和亚音速巡航导弹设计。估计单枚成本为 $27,000–$40,000，比传统拦截弹低一个数量级。Starhammer 计划 2027 年推出，更重（约 90 kg）、更快（Mach
              2），采用固体火箭发动机，目标是高速巡航导弹，最终覆盖近弹道威胁。公司正在 Norfolk 建专用固体火箭发动机制造设施（项目名：Nightstar），为 Starhammer
              供货，并最终向其他导弹项目销售推进系统，直击 NATO 固体火箭发动机产能的结构性短缺。
