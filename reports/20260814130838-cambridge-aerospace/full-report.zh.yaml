  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资逻辑与反向逻辑
        blocks:
          - type: paragraph
            body: >
              乐观逻辑串起前面所有章节。市场上，Cambridge Aerospace 位于国防增长最快的口袋——反无人机防空，2026 年市场约 $3-3.5 billion，并在欧洲重新武装带动下以 20%
              以上复合增长。产品上，Skyhammer 已列装、雷达制导，价格比传统系统低一个数量级，解决真实的成本交换问题。客户上，公司有量产 UK MoD
              合同、美国陆军开发测试和盟国试验——对一家成立两年的公司很罕见。竞争上，公司是少数专注低成本拦截弹的专家之一，并通过 Nightstar 构建固体火箭发动机护城河。财务上，资本很厚（已融资约 $636
              million），投资者财团顶级。反向逻辑同样完整：公司未披露收入或毛利率，估值似乎锚定 Anduril 对比，而不是 Cambridge 自身数字；需求部分依赖冲突，可能缓和；客户群危险地集中在 UK
              MoD；Shapps ACOBA 辞职后治理偏薄；制造爬坡和 Nightstar 执行风险高。因此，投资问题不是 Cambridge Aerospace 是不是好公司（它可信地很优秀），而是 $3.4
              billion 对一家基本面仍几乎全在私域内的资产来说，是否是可辩护的入场价。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
      - number: '8.2'
        title: 建议、置信度与风险评级
        blocks:
          - type: paragraph
            body: >
              建议为观察，置信度中等、风险评级高；这反映出它是真正高质量的业务，但定价已要求近乎无瑕疵执行。这不是放弃——公司产品、牵引和团队足够强，消极否定会是错误——但在 $3.4 billion
              也不是有把握的买入，因为价格已嵌入很大一部分上行，而下行（集中度、需求周期、治理、执行）真实存在且只被部分缓释。因此估值立场是“偏高”：只有在乐观情景下才说得通，也容易受到国防科技同类公司重新定价冲击。目标回报与持有上，成长投资者合适姿态是里程碑闸门式仓位——只有在收入多元化、单位经济披露和
              Nightstar 进展有证据时进入或加仓——并以多年持有等待战略收购或 IPO
              退出。对于已在前轮进入的投资者，解读是持有并监测，而不是继续上调估值。建议逻辑图追踪六个尽调维度（市场、产品、客户、竞争、财务、风险）如何合成这个结论；投资 KPI 图则汇总决策框架中的头部数字——$3.4
              billion 估值、约 $636 million 融资、2.6x 跳升、250+ 员工。
            claimRefs:
              - CV006
              - CV007
              - CV008
              - CV009
