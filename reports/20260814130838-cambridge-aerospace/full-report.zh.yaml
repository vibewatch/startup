      - number: '2.5'
        title: 市场测算尽调缺口与相互矛盾的估算
        blocks:
          - type: paragraph
            body: >
              市场逻辑有吸引力，但建立在分歧很大、甚至彼此矛盾的估算上，买方不能把它们压成一个标题数字。到 2030-2031 年，分析师给出的 C-UAS
              市场规模相差超过一个数量级，取决于是否纳入电子战、探测和民用分段；也没有任何一家单独切出 Cambridge
              所处的低成本动能拦截器细分。把市场看得很大的威胁数量视角，天然依赖冲突，因此波动很大。可获取的近期收入又被未披露的合同金额卡住——英国 MoD
              交易只被描述为“数百万英镑级”——所以无法用公开数据精确测算可获取市场（SOM）。一家成立两年的供应商要替换根深蒂固的主承包商，市占假设还没有在规模上被证明。我们把这些作为明确尽调缺口保留，而不是强行解答：市场显然很大、增长很快，但悲观情景（和平推动需求正常化）和乐观情景（可消耗无人机战争持续）之间的跨度，是后续估值章节必须定价的核心不确定性。
            claimRefs:
              - CM024
              - CM025
              - CM026
              - CM027
              - CM028
