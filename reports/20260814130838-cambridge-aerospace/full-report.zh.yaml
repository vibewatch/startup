      - number: '5.5'
        title: 差异化 —— 技术、工艺能力、供应与审批
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace
              的差异化不是某个专利突破，而是一组难复制优势叠加起来。第一是研发速度：几周内把拦截弹从概念推到飞行，两年内拿到国家级合同，说明工程和决策速度是传统主承包商结构性缺失的。第二是低成本制造工艺能力：把雷达制导导弹做成数万美元售价，而不是数十万美元，这本身就是护城河，因为背后需要一整套难以逆向的组件、工装和装配选择。第三是通过
              Nightstar 获得供应链入口：自有固体火箭发动机生产可以回应 NATO 系统性推进短缺，让 Cambridge Aerospace
              在竞争对手排队等稀缺发动机时先供自己，甚至可能外供。第四是监管与客户位置：活跃的 UK MoD
              合同和美国开发测试带来信任、安全许可和参考背书，这些都很慢才能积累。创始团队——主导首架离子驱动飞机的航空航天教授、前 Anduril EMEA
              总监、一位连续国防创业者——把学术深度和已验证的国防商业化打法放在一起。差异化真实存在，但会随时间被模仿，尤其资金充足的对手也在打同一个低成本拦截弹细分市场。
            claimRefs:
              - CE020
              - CE021
              - CE022
              - CE023
              - CE024
      - number: '5.6'
        title: 信任、安全、安保与质量控制
        blocks:
          - type: paragraph
            body: >
              生产致命弹药，对信任、安全、安保和合规的要求远超普通软件初创公司。监管上，Cambridge Aerospace
              的产品是军民两用、受出口管制的武器，受英国和美国军控体系约束；每笔对外销售都需要许可证，每个组件供应都会被审查，部分后期投资者的资金出处（例如 Ora
              Global）也引出国家安全投资问题，直接影响信任。安全与质量上，制造固体火箭发动机和实战弹头，需要严密的搬运、储存、弹药安全认证和质量管理——这正是 Nightstar
              设施必须制度化的能力，也正是年轻公司高速扩张时最容易出风险的地方。设计、软件和供应链安全同样关键，因为拦截弹的制导和自主能力会吸引对手干预。Cambridge Aerospace
              未公开任何具体认证、弹药安全批准、质量资质或网络控制细节；这对国防公司可以理解，但给尽调留下证据缺口。Grant Shapps 的 ACOBA 冲突及其 2026 年 5
              月辞职，也削弱了治理层面的信任，让董事会合规监督更不透明。这里的信任主要由客户验证托底，而不是由披露的控制体系支撑。
            claimRefs:
              - CE025
              - CE026
              - CE027
              - CE028
