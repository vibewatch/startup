      - number: '8.3'
        title: 融资背景、入场纪律与稀释
        blocks:
          - type: paragraph
            body: >
              融资背景是入场纪律问题的核心。Cambridge Aerospace 在不到两年内完成四轮融资：$36 million 种子轮（2024）、估值约 $400 million 的 $100 million
              Series A（2025 年 9 月）、估值 $1.3 billion 的 $200 million Series B（2026 年 4 月），以及估值 $3.4 billion 的 $300 million
              Series C（2026 年 8 月）。最醒目的是速度和跳升：估值从 Series B 到 Series C 四个月涨 2.6x，远快于底层基本面可能变化的速度，这是热门品类中动量定价的典型信号。在 $3.4
              billion 入场很难守纪律，因为没有收入或毛利锚点——价格由可比资产稀缺和投资者竞争决定，而不是由倍数决定。稀释和优先权负担也重要：四轮定价融资且投资者为 DFJ
              Growth、Lux、Accel、Spark、Elad Gil、Never Lift、Ora Global
              等一线机构，意味着清算优先权堆叠，新普通股或后期股权投资者必须权衡，尽管具体条款不公开。纪律化入场要么要求结构化工具（优先权、反稀释棘轮），要么通过老股交易获得更低有效成本。下方估值与回报区间图把 $3.4
              billion 入场价放在可能结果中比较，强调这里的纪律主要在工具和时点，而不是名义价格。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV013
              - CV014
          - type: figure
            figureRef: FV003
            claimRefs:
              - CV016
              - CV018
      - number: '8.4'
        title: 乐观、基准与悲观情景
        blocks:
          - type: paragraph
            body: >
              三种情景框定结果。乐观情景中，Cambridge Aerospace 成为欧洲防空领域的 Anduril：Skyhammer 在英国、美国、约旦、海湾 和更广泛欧洲扩到数千枚，Nightstar
              治好推进瓶颈并增加供应业务，Starhammer 打开更高价值细分市场，公司在数年内消化并超过当前估值，走向 超过 $10 billion
              的结果——假设是冲突驱动需求持续、制造爬坡无瑕疵、出口成功。基准情景中，它是强但更窄的利基领导者：一个以英国为锚、逐步向盟国扩张的耐久业务，大致支撑当前 $3.4 billion
              估值，温和增值，最终战略退出——假设是需求稳定但不爆发、执行称职、一定集中度持续存在。悲观情景中，执行或需求不及预期：制造或 Nightstar 滑坡、锚定 MoD
              合同丢失或不续约、国防科技重新定价，或持续缓和，触发降价融资至 $1 billion
              附近或以下——假设是任一重大风险结晶。概率信号偏向基准情景；但品类动量带来有意义的乐观尾部，集中度和不透明也带来不可忽视的悲观尾部。估值敏感性图展示结果如何随收入规模和倍数假设摆动。
            claimRefs:
              - CV015
              - CV016
              - CV017
              - CV018
              - CV019
