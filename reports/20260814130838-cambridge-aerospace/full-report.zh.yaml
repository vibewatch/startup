  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 覆盖直接、在位、相邻和替代层的竞争版图
        blocks:
          - type: paragraph
            body: >
              反无人机竞争格局异常拥挤，因为问题落在导弹、无人机、雷达和软件的交汇处。直接同业是其他有风险资本支持、在做动能或全栈反无人机系统的防务科技公司：Anduril 是基准，也是资本最充足的竞争对手，其 Anvil
              拦截器和 Lattice 自主栈支撑了据报道 $61 billion 的估值；美国动能反无人机系统包括 Raytheon（RTX）的 Coyote；欧洲还有 Alta Ares
              等较小进入者。第二层是传统导弹主承包商：MBDA 的 DEFENDAir 效应器正在与 Rheinmetall Skyranger 30 集成；Lockheed
              Martin、Thales、Saab、Kongsberg 和 Leonardo 等大型主承包商握有 Cambridge Aerospace 必须替代或接入的国家火控关系。Rafael 的 Drone Dome
              和以色列更广泛的防空生态，构成具备出口竞争力的第三层。相邻和替代玩家不使用动能拦截器，却抢同一笔买方预算：DroneShield 和其他电子战 / 干扰供应商靠切断链路压制无人机，Helsing 则出售 AI
              和软件层，可能把 Cambridge 自研的自主层商品化。最后，现状——昂贵传统拦截弹和政府内部自建项目——仍是最大的单一替代方案。Cambridge Aerospace
              的定位，是成为这个领域最便宜且可信的动能效应器。
