      - number: '4.4'
        title: 公开牵引力与私有指标缺口
        blocks:
          - type: paragraph
            body: >
              公开牵引力体现在合同和里程碑上，而不是财务指标。可验证的牵引力包括：英国 MoD 生产合同已于 2026 年 5 月开始交付；入选 LEAP 项目；美国陆军 Project Bullfrog 开发测试；完成
              Jordan 试验；员工数超过 250、分布在六个国家；产量正向每年数千枚爬坡。完全缺失的是这些背后的财务实质：没有公开收入、类 ARR
              的在手订单价值、单枚交付量、毛利率、烧钱速度或合同期限。对这样年轻的英国公司，公司登记文件通常滞后；截至
              runDate，法定路径也无法拿到有意义的财务报表。因此，公开财务披露几乎为零，成为财务尽调的定义性特征：公司有强运营牵引信号，但 $3.4 billion
              估值无法用任何收入或利润率倍数对标。所有量化承销输入都必须在私有数据室取得。
            claimRefs:
              - CI015
