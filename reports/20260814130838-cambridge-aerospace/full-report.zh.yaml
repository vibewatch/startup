      - number: '7.2'
        title: 监管与法律风险
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace 身处监管最重的行业之一。产品是军民两用、受出口管制的武器：英国出口受《2002
              年出口管制法》和出口管制联合署许可制度约束；任何美国来源技术或销售则触发美国《国际武器贸易条例》和《武器出口管制法》。每笔面向
              约旦、海湾或其他盟国的对外销售都需要许可证，可能因外交政策理由被拖延或拒绝，直接卡住出口管线。另一个独立且现实的法律暴露是入境投资审查：《2021
              年英国国家安全与投资法》赋予政府对敏感国防资产收购的介入权，后期投资者出处——尤其 Ora Global LP——引发某些持股是否已经或本应触发申报的问题。与治理相邻的法律风险在 Grant Shapps
              事件中公开结晶：Advisory Committee on Business Appointments（ACOBA）监管前部长商业任命；围绕 Shapps 董事长职位的冲突导致其 2026 年 5
              月辞职，这是公开记录中的反向事件。其他潜在暴露包括制导技术知识产权纠纷、固体火箭发动机生产的弹药安全和环境监管，以及六个国家的雇佣 / 子公司合规。具体许可证、申报和任何执法接触均未公开，留下尽调缺口。
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR011
          - type: table
            tableRef: TR001
            claimRefs:
              - CR006
