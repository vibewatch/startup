      - number: '1.3'
        title: 融资历史与投资人基础
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace 不到两年完成四轮融资，累计约 $636 million，是欧洲防务科技史上资本形成速度最快的公司之一。2024 年，Never Lift 领投 $36 million
              种子轮。2025 年 9 月，公司以 $400 million 估值完成 $100 million A 轮，由 Spark Capital 和 Lakestar 领投，Lux Capital、Accel、D3
              Venture Capital、Never Lift、Expeditions Fund 和 MW Group 参投。2026 年 4 月，公司以 $1.3 billion 估值完成 $200 million B
              轮，Elad Gil & Co 和 Spark Capital 共同领投。四个月后，2026 年 8 月 10 日，公司以 $3.4 billion 投后估值完成 $300 million C 轮，DFJ
              Growth 领投，Lux Capital、Accel、Lakestar、Never Lift、Ora Global 和 Elad Gil & Co 参投。B 轮（2026 年 4 月）到 C 轮（2026 年
              8 月）估值跳升 2.6×，靠的是 MoD 合同快速落地，包括 2026 年 7 月入选 LEAP 项目。DFJ Growth 创始人 Randy Glein 表示，他的公司“调研全球格局后，认定
              Cambridge 拥有最好的团队和技术，能够为欧洲及其盟友建设最先进、最现代化的防空基础设施”。投资人横跨美国风险资本（DFJ Growth、Spark Capital、Accel、Elad Gil &
              Co）和欧洲成长基金（Lakestar、Ora Global），Never Lift 则贯穿所有轮次。
