        title: 证据摘要
        blocks:
          - type: callout
            title: 已列装产品，有真实客户验证
            body: |
              Skyhammer 不是原型：它已在 2026 年 5 月进入英国国防部服役，在美国陆军开发测试中完成实弹发射，并完成约旦试验。已列装状态加上低成本制造设计，是技术故事中最强的一环。
            calloutType: strength
            claimRefs:
              - CE015
              - CE016
          - type: callout
            title: 没有公开可靠性或拦截概率数据
            body: |
              对动能拦截弹来说，命中率和弹体可靠性是决定性指标，但公司均未披露。再叠加未披露的认证，产品核心性能与质量无法从公开来源验证。
            calloutType: risk
            claimRefs:
              - CE018
              - CE027
          - type: callout
            title: SRM 纵向整合是结构性押注
            body: |
              通过 Nightstar 自有固体火箭发动机生产，意在把稀缺且受出口管制的投入变成护城河。只有 Norfolk 设施在建设、良率和弹药安全认证上兑现，这一逻辑才成立。
            calloutType: assumption
            claimRefs:
              - CE013
              - CE022
  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace 只卖给政府国防部门，而且买方、使用方、付款方都是政府体系内的不同角色。买方 / 付款方是国家国防部或军种采购机关——UK MoD 是锚点——使用方则是列装
              Skyhammer 的作战防空部队。按地域看，客户基础从英国起步（MoD、英国陆军防空），同时有一个美国开发客户（通过 Project Bullfrog 的美国陆军 52nd Air Defense
              Artillery Brigade）、一个中东试验客户（约旦），以及被提及的海湾合作伙伴。按垂直领域看，所有客户都属于短程防空 /
              反无人机；没有商业或民用分部，这让公司更聚焦，也限制了可触达买家数量。按规模看，这些都是大型、高信用、行动慢的机构买家，采购由威胁环境和国家预算驱动，而不是产品驱动增长。实际含义是，账户数量很少，但单个账户极大：赢下或失去一个国防部都会实质改变收入轨迹，销售动作靠政府关系，而不是靠批量线索漏斗。这种集中度符合早期国防主承包商特征，但也是贯穿客户分析的结构性风险。
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU002
              - CU003
      - number: '6.2'
        title: 采用轨迹
        blocks:
          - type: paragraph
            body: >
              这个行业里，Cambridge Aerospace 的采用轨迹异常陡峭。成立大约 18 个月内，公司从原型走到已列装的 UK MoD 合同，2026 年 5 月首批交付，又在 2026 年 7 月入选英国
              LEAP 项目，同时完成美国陆军开发性实弹测试和约旦试验。这条路径——演示、合同、交付、项目扩展、盟国测试——代表真实部署，而不是意向书。最清晰的采用信号是 Skyhammer
              已投产并交付，产量正从低数百枚向每年数千枚扩张，意味着至少锚定客户在持续拉动制造。不过，国防领域的“采用”是跳跃式、按里程碑推进的：单个框架合同就可能构成整条轨迹，开发测试（Project
              Bullfrog）还不是正式采购项目。因此，更合理的读法是：一个已确认作战客户带来强劲早期牵引，并有一批试验客户在管线里；这还不是广泛、多元的采用曲线。各客户部署数量、列装单位数、复购节奏均未披露，限制了对轨迹的精确测量。
            claimRefs:
              - CU005
              - CU006
              - CU007
              - CU008
          - type: table
            tableRef: TU002
            claimRefs:
              - CU005
              - CU006
              - CU007
          - type: figure
            figureRef: FU002
            claimRefs:
              - CU007
              - CU008
              - CU013
      - number: '6.3'
        title: 具名客户验证
        blocks:
          - type: paragraph
            body: >
              具名客户验证是 Cambridge Aerospace 商业故事中广度最强的一部分，尽管金额不透明。英国国防部是旗舰背书：已确认数百万英镑生产合同、2026 年 5 月首批交付、入选 LEAP
              项目，使其成为量产级、公开承认的客户。美国陆军——具体是与 Project Bullfrog 相关的防空单位——是开展实弹评估的开发客户，背书可信，但仍在量产前。Jordan
              是已完成评估的试验客户，海湾合作伙伴则属于潜在管线。这些背书质量差异很大：英国是量产且有公开记录；美国是开发阶段；约旦是试验阶段；海湾
              是管线。关键是，除了“数百万英镑”外，合同金额、期限、单位数量和独占条款都未公开，因此连旗舰客户也无法定量。下方枚举覆盖截至本报告生成日所有可公开识别的客户；名单接近完整，但每个名字背后的商业实质仅部分披露，这是任何客户尽调的核心保留意见。
