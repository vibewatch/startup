      - number: '6.4'
        title: 留存、耐久性与背书质量
        blocks:
          - type: paragraph
            body: >
              留存和耐久性无法从公开数据衡量，这是真缺口，不是格式细节。公司未披露净收入留存、总留存、流失率、续约率或合同期限；公司太年轻，多数合同还没走到续约决策。能推断的是结构，而不是实证：国防采购中，平台一旦列装并集成，通常因为认证、训练、集成和保障锁定而具备黏性；中途切换拦截弹成本高、速度慢。如果
              UK MoD 关系从初始订单转为常设框架和 LEAP
              正式项目，耐久性会很高。反面是，耐久性尚未被证明：成立两年的供应商没有续约记录，需求部分依赖冲突，单一采购政策或预算变化就可能让复购停摆。英国背书质量高（具名、量产、政府支持），其他地区中等（开发或试验）。因此，下方留存队列图明确是示意、基于假设，并标为证据缺口，因为没有真实队列留存数据可填入。
