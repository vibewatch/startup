      - number: '5.3'
        title: 架构与运营模式
        blocks:
          - type: paragraph
            body: >
              从架构看，Skyhammer 是一款传统雷达制导拦截弹，优化目标是成本和可制造性，而不是炫技性能。导引头采用 X
              波段雷达，适合捕获小型、慢速、低特征无人机目标；制导把导引头连接到机载飞控电子和软件，驱动机体完成拦截，末端很可能由适合无人机尺寸目标的战斗部和近炸引信收尾。Skyhammer 的推进系统支持约 700 km/h
              飞行，Starhammer 则切换到固体火箭发动机以达到 Mach 2。运营模式的核心取舍是面向量产设计：据报道，公司把 Skyhammer
              从概念推进到飞行测试只用了约六周，并把产量从低数百枚向每年数千枚爬坡；只有在设计上有意采用可生产、低成本部件和自动化装配，这才跑得通。通过 Nightstar
              垂直整合固体火箭发动机生产，是另一项结构性下注，把稀缺且受出口管制的投入变成内部能力。因此，架构最好理解为系统集成和制造打法——把已验证的制导路径，与激进按成本设计和供应链控制结合起来——而不是某个单一子系统的突破。
