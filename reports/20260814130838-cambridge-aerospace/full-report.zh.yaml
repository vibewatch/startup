      - number: '3.3'
        title: 能力、定价与市场进入对比
        blocks:
          - type: paragraph
            body: >
              从能力看，Cambridge Aerospace 的 Skyhammer 属于中档：亚音速（Mach 0.7）、30km 射程、雷达制导，针对 Shahed 级无人机优化；高端能力不如 MBDA 或 RTX
              系统，但专门为最常见威胁打造。决定性优势是价格：单枚估计
              $27,000-$40,000，而在位拦截器成本从数十万美元到数百万美元不等，低一个数量级的优势把买方标准从性能改写为杀伤成本和弹药储备深度。市场进入上，在位者靠深植的国家火控集成和框架合同获胜，Anduril
              则靠硅谷商业打法和美国规模取胜。Cambridge Aerospace 在欧洲复刻 Anduril 打法——聘请 Anduril 前 EMEA 董事担任
              CCO——同时押注英国主权和速度。信任与监管姿态上，所有玩家都受出口管制和国家安全审查约束；在位者拥有数十年的认证和安全履历，成立两年的挑战者还无法匹配，这在避险采购中是真劣势。DroneShield 和
              Helsing 在完全不同的轴线上竞争（非动能压制和软件），所以正面对比会低估它们侵蚀同一预算的能力。
