companyProfile:
  summary: >
    Cambridge Aerospace 设计并制造低成本防空拦截导弹，应对 Shahed-136 这类廉价单向攻击无人机的扩散。公司的 Skyhammer 拦截弹单价为 $27,000–$40,000，传统系统则超过
    $1M；Skyhammer 从概念到飞行测试只用了六周，并在 2026 年 5 月进入英国国防部服役。Cambridge Aerospace 由航空航天教授 Steven Barrett、前 Anduril 主管 Chris
    Sylvan 和创业者 Junaid Hussain 于 2024 年底创立，不到两年完成四轮融资，累计约 $636 million，是欧洲融资速度最快的防务硬件创业公司之一。第二款产品 Starhammer 面向 Mach 2
    高速威胁，计划 2027 年推出。Norfolk 的 Nightstar 固体火箭发动机设施支撑 Cambridge Aerospace 长期供应链自主权的野心。
