      - number: '4.5'
        title: 资本充足性、烧钱速度、现金跑道与资金用途
        blocks:
          - type: paragraph
            body: >
              资本充足性是图景里真正强的一块。Cambridge Aerospace 已经通过种子轮、A 轮、B 轮和 C 轮融资约 $636 million，并在 2026 年 8 月 10 日刚完成 $300
              million C 轮（本章自行生成融资论据，而不是复用公司概况时间线）。这笔新资金叠加此前轮次，给公司带来可观现金垫。烧钱速度未披露，但对一家 250
              多人、正在扩大制造并建设两处设施的硬件公司来说，月烧钱处于高个位数到低双位数百万美元级是合理估计——这意味着即便激进扩产，现金跑道也以多年计，下一轮触发点更可能绑定 Nightstar 完工、Starhammer
              开发或重大新项目，而不是迫近的现金需求。公司明示和暗示的资金用途包括：扩大 Skyhammer 产量、建设 Nightstar 固体火箭发动机产能、开发 2027 年 Starhammer，并扩大欧洲 /
              盟军商业覆盖。公司没有公开披露债务或项目融资义务，不过重资本的固体火箭发动机设施很可能未来需要项目融资，也应成为尽调问题。
            claimRefs:
