      - number: '7.4'
        title: 伙伴与依赖风险
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace 的可行性压在少数高度集中的依赖上，每一个都可能成为单点故障。最重要的是客户集中度：UK MoD
              是主导客户和付款方，所以公司的收入、参考可信度甚至政治通道都与一个政府的预算、采购政策和选举周期绑定。第二是资本提供方：公司已从包含 DFJ Growth、Lux、Accel、Spark 和 Elad Gil
              的财团融资约 $636 million，未来爬坡依赖继续以有利条款获得资本；如果国防科技
              情绪或威胁环境转向，这就是风险。第三是供应基座：稀缺固体火箭发动机、导引头电子件和含能材料来自有限供应商，而这些供应商也受自身限制和出口管制约束。第四是横跨多国的员工和子公司布局（英国、德国、波兰、挪威、乌克兰、澳大利亚），集中了关键人物和运营连续性风险，尤其是任何在乌克兰的员工。最后，出口伙伴和外国军售中介不在公司直接控制之内。下方风险传导图展示任一依赖发生冲击——丢失
              MoD 合同、SRM 短缺、资本市场冻结——如何传导到收入、生产和估值。
            claimRefs:
              - CR018
