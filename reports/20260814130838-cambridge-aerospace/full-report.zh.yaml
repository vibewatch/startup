      - number: '8.5'
        title: 可比公司集合
        blocks:
          - type: paragraph
            body: >
              必须谨慎看待可比对象，因为 Cambridge Aerospace 没有可用于乘倍数的公开收入。最常被引用的私营参照是 Anduril，2026 年估值约 $61
              billion，作为全栈自主系统领导者，其成功支撑了投资者对国防科技的热情；但 Anduril 规模大得多、也更多元，所以它是愿景参照，不是逐项可比。Helsing 估值约 $12 billion，是欧洲 AI
              国防同业，地理和阶段更接近，但偏软件。公共可比中，Palantir、Kratos Defense、BAE Systems 和 Northrop Grumman
              用已验证收入倍数锚定区间：高增长国防软件公司倍数很高，传统主承包商按十出头 EBITDA 倍数交易，大致框住硬件更重的 Cambridge 未来可能落位。私募轮次参照——Cambridge 自己的 Series
              A/B/C 进展——显示品类的动量定价。下方可比表列出一组代表性对象及估值、商业模式和相关性；它刻意只是样本，不是穷尽的可比宇宙，因为 Cambridge 自身无法计算基于收入的倍数。诚实结论是，$3.4
              billion 估值是由私营国防科技 可比对象三角定位出的稀缺与动量价格，不是基本面推导出的价值；尤其与 Anduril 相比，会美化它。
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
          - type: table
            tableRef: TV004
            claimRefs:
              - CV020
              - CV021
              - CV022
              - CV023
      - number: '8.6'
        title: 退出准备度、尽调待问与打破投资逻辑的触发条件
        blocks:
          - type: paragraph
            body: >
              退出准备度上，Cambridge Aerospace 在多年周期内有可能成为战略收购或 IPO 候选：美国或欧洲主承包商，或大型国防科技
              平台，会认为已列装低成本拦截弹和固体火箭发动机设施有战略价值；如果收入规模跑出来，品类动量也让 IPO
              窗口有想象空间。但今天它还没准备好退出——太早、太私密、太集中。最能改变承销判断的最终尽调问题，按优先级是：审计或管理层财务（收入、积压订单、毛利率、烧钱速度、现金跑道）；MoD
              和其他合同条款（金额、期限、独占性、续约）；董事会构成和 Shapps 之后的治理结构；Nightstar 状态（资本开支、时间表、认证、良率）和 Skyhammer 单位经济；以及出口许可证和 NSI Act
              状态，包括 Ora Global 资金出处。会把建议从观察翻到放弃的触发条件是：重大生产或 Nightstar 失败、锚定 MoD
              合同丢失或不续约、单位经济弱或烧钱过高的证据、出口被阻断或国家安全干预、或持续缓和导致采购紧迫性消失。反过来，如果披露多元收入、健康利润率并交付
              Nightstar，则足以转为买入。下方否决标准和尽调问题表汇总这些内容，以清晰、可监测的决策框架收尾。
            claimRefs:
              - CV025
              - CV026
              - CV027
              - CV028
              - CV029
