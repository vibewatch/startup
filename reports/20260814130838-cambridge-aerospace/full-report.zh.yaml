      - number: '2.2'
        title: 用多重视角测算反无人机机会
        blocks:
          - type: paragraph
            body: >
              这个市场没有单一数字能说清，因此我们用几个独立分析视角交叉定位。自下而上的 C-UAS 系统研究，把 2026 年全球支出集中在 $3-4 billion 左右：MarketsandMarkets 预计反 UAS
              系统市场到 2031 年约达 $29.7 billion，CAGR 为 26.5%；Fortune Business Insights 和 The Business Research Company
              认为当前反无人机市场在数十亿美元低段，年增速超过 20%；Grand View Research 和 Mordor Intelligence 也支持 21-27% 的 CAGR
              区间。需求侧视角给出的天花板不同：欧洲重新武装正把防务预算大约抬高五分之一，英国 2026 年 6 月《国防投资计划》在约 £62 billion 年防务预算中为无人机和自主系统划拨超过 £5
              billion，SIPRI 数据也显示欧洲军费支出持续双位数增长。威胁数量视角最乐观：如果俄罗斯和其他行为体每年发射数万架 Shahed
              级无人机，每架都需要一枚或多枚数万美元级拦截弹，仅拦截弹消耗市场每年就可能达到数十亿美元。我们把分析师的 C-UAS 数字视作可辩护的总可用市场（TAM），把欧洲动能效应器份额视作可服务市场（SAM），把英国 /
              盟军近期采购管线视作可获取市场（SOM），同时把这些估算之间的巨大分歧保留下来，作为尽调缺口。
