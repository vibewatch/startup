      - number: '7.5'
        title: 财务、模型与人员 / 执行风险
        blocks:
          - type: paragraph
            body: >
              财务和模型侧，最大风险是资本强度与不透明并存。Cambridge Aerospace 是硬件制造商，正在建设两座设施并纵向整合 SRM
              生产，因此烧钱速度结构性偏高，营运资本需求（里程碑付款前的库存）真实存在；但收入、毛利率、烧钱速度和现金跑道均未公开，也就是说市场几乎在没有可见财务基本面的情况下承销 $3.4 billion
              估值。利润率压缩风险真实存在，因为产品承诺就是低价，定价权被封顶，而投入成本（含能材料、精密电子）可能上涨。一个具体模型风险是，估值似乎锚定与 Anduril 的比较，而不是 Cambridge
              自身数字；国防科技同类公司一旦重新定价，账面估值会被重击。人员和执行风险同样核心：公司的优势在团队和速度，关键创始人（CEO Barrett、CCO
              Sylvan）流失，或无法在六个国家足够快招聘，都会削弱优势；Shapps 之后的治理缺口又放大执行监督风险。员工数快速突破
              250，也会拉扯文化、控制和质量体系。这些财务与人员风险不太是短期破产风险——资产负债表很强——更多是高估值对持续无瑕疵执行的脆弱依赖。
            claimRefs:
