      - number: '7.3'
        title: 运营、质量与安全风险
        blocks:
          - type: paragraph
            body: >
              运营上，Cambridge Aerospace
              面临经典硬件爬坡风险，而产品的关键性把这些风险放大。制造爬坡是主线：从原型规模转向精确制导导弹量产，需要工装、质量控制、员工队伍和供应链成熟度；成立两年的公司很少具备这些能力，任何延误都会直接威胁合同交付。最系统性的运营依赖是固体火箭发动机供应：SRM
              在 NATO 内部结构性短缺，这正是 Cambridge 建设 Nightstar
              的原因——但该设施本身又是多年建设、认证和良率风险；上线前，公司仍依赖稀缺外部推进供应。质量与可靠性风险很尖锐：致命效应器一旦误发或拦截失败，后果远超软件
              bug，但公开可靠性数据不存在。安全风险横跨网络（制导和自主软件是诱人攻击目标，供应链受损也是公认威胁向量）和物理（处理实战弹头和含能材料）。组件依赖——X-band
              导引头电子件、微电子、含能材料——也受各自出口管制和短缺约束。下方依赖图追踪这些运营输入如何卡住生产，风险清单则列出具体的运营、质量和安全暴露。
