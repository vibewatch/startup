      - number: '3.4'
        title: 切换成本、分销权力与供应准入
        blocks:
          - type: paragraph
            body: >
              防务市场切换成本很高。一旦某个系统被设计进国家防空架构，雷达和指挥控制接口、训练、后勤尾巴以及维保合同都会形成多年锁定效应，谁先拿下第一个正式项目，谁就占优。这对 Cambridge Aerospace
              利弊同源——赢下英国 MoD 合同和 LEAP 入选，开始建立自己的锁定效应；但在 NATO 范围内，在位者已经占住了大多数位置。分销权力集中在少数政府采购通道和主承包商关系里；Anduril
              和主承包商今天的触达远大于 Cambridge Aerospace。Cambridge 竞争位置里最有辨识度的是供应准入：通过建设 Nightstar
              固体火箭发动机设施，公司瞄准限制联盟拦截弹生产的最大瓶颈，可能把竞争者共同面对的供应短板，变成自有优势——甚至变成向竞争对手供货的关系。防务领域常见多效应器并用（买方同时部署几种效应器），这限制了赢家通吃，但也意味着
              Cambridge 不必完全替代在位者，也能建立自己的业务版图。
            claimRefs:
              - CP020
