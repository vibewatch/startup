      - number: '2.4'
        title: 增长驱动与采纳约束
        blocks:
          - type: paragraph
            body: >
              需求顺风异常强，而且彼此强化。第一，乌克兰和中东的现役无人机战争同时证明了威胁和成本不对称，把理论需求变成紧急采购。第二，欧洲重新武装——EU 和 NATO 成员显著提高防务支出，European Sky
              Shield Initiative 等倡议把防空需求集中起来——扩大了预算池。第三，英国政府明确优先支持低成本效应器和自主系统，并通过 LEAP
              等项目为本土供应商开快车道。与这些驱动相对的是真实约束。采购周期长且政治化；认证、安全和出口管制审批把住部署闸门；固体火箭发动机和精密部件供应是 NATO
              内部的系统性瓶颈；切换成本偏向已经接入国家火控架构的在位者。最大的结构性风险是需求部分依赖冲突：如果出现持久降级，当前压缩采购时间线的紧迫感会降温，即便长期反无人机需求仍会存在。信任和主权考量是一体两面——它们让欧洲买家更偏向英国
              / 欧洲本土供应商而非美国主承包商，但也会提高对 Cambridge 自身外资的国家安全投资审查强度。
            claimRefs:
