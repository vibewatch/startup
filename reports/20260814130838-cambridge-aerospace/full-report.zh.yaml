  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代品
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace
              所在的是防空市场里的动能反无人机系统（C-UAS）分段：武装部队购买硬件和弹药，关键基础设施与国土安全机构次级购买，用来探测、跟踪并物理摧毁敌方无人机和低空巡航导弹。纳入支出口径的是拦截导弹、发射器、雷达与火控集成，以及围绕这些系统的维保合同。不纳入口径的是纯电子战
              / 干扰系统（这是由 DroneShield
              等公司主导的非动能分段）、大多仍未量产的定向能武器、更广义的有人防空导弹市场（Patriot、SAMP/T），以及机场和监狱使用的民用反无人机产品。最重要的现状替代品不是其他创业公司，而是传统拦截弹——百万美元级地空导弹和火炮系统——以及硬扛无人机攻击。Cambridge
              Aerospace 的整套逻辑是：现状在经济上撑不住。用 $1M+ 拦截弹打 $20,000-$50,000 的 Shahed，会输掉交换比；Cambridge 的 $27,000-$40,000
              Skyhammer 则把边界从纸面性能改写为单次击杀成本。因此，最合适的市场定义是“面向国家防空的低成本动能 C-UAS 效应器”，它既贴近导弹市场，也贴近巡飞弹 / 无人机市场，而不是其中任一市场的干净子集。
