            title: 执行和推进供应是约束瓶颈
            body: |
              在 NATO 系统性推进短缺中，一边扩大拦截弹制造，一边建设 Nightstar SRM 设施，可能性高、影响高，且只被部分缓释。重大生产滑坡或 Nightstar 失败，是最清晰的打破投资逻辑触发条件。
