      - number: '4.6'
        title: 财务结论——收入质量、利润率路径与尽调阻断点
        blocks:
          - type: paragraph
            body: >
              财务结论是：Cambridge Aerospace
              资本充足，但财务不透明。正面看，资金基础深，投资人联盟一线，收入模式锚定真实政府合同，低价量产拦截弹的成本逻辑可信且具备战略差异化。负面看，贷款人或股权承销人需要的几乎所有指标——收入、在手订单价值、毛利率、烧钱速度、现金跑道、单位经济、合同期限和收入确认政策——都在私域里；因此，估值不是已验证财务的倍数，而是对未来规模的押注。主要尽调阻断点包括：取得利润表和在手订单；验证
              Skyhammer 单枚 BOM 成本和毛利率；理解 Nightstar
              资本开支和融资；确认客户集中度和合同条款。在这些问题通过私有材料回答前，财务画像应读作“资产负债表强，利润表未验证”——这也是一家成立两年、估值 $3.4 billion
              的硬件公司应有的姿态。反向解读是，估值更多借力 Anduril 对比，而不是自身数字。
            claimRefs:
              - CI025
              - CI026
              - CI027
              - CI028
