            body: >
              所有分析师都同意反无人机市场年增长超过 20%，但被广泛引用的 $7.5-30 billion 数字，把探测、干扰和民用分段打包在一起。Cambridge Aerospace
              真正可触达的是更窄的低成本动能效应器细分，它是先行者，但绝对收入池更小，并受国家采购节奏限制。
