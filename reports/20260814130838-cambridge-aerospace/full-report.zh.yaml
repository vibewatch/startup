      - number: '3.5'
        title: 护城河耐久性、商品化风险与反向竞争证据
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace 自己也承认，任何单一导弹都不是持久资产——设计会被复制和改进。因此，公司的防御性要靠复合优势：制造规模和成本领导、通过 Nightstar
              实现固体火箭发动机垂直整合、累积项目关系，以及开发节奏。每一项都可能被挑战。如果 Anduril
              这类资本更厚的竞争对手决定推出同样便宜的拦截器，或者在位者在政治压力下压价以增加弹药储备深度，成本领导就会被侵蚀。商品化风险真实存在：自主和导引头技术许多玩家都能拿到，Helsing
              级软件也可能把瞄准层标准化。另一侧的被挤出风险同样存在——如果和平情景拿掉当前让速度压过资历的紧迫感，一家两岁的公司可能被主承包商用规模压过去。反向证据包括：Cambridge Aerospace 的 $3.4
              billion 估值部分对标的是 Anduril 成功，而不是自身已验证规模；其较低档的速度和航程也把高端威胁空间留给资源更强的对手。长期问题是，Nightstar
              是否能交付真正的供应护城河，以及成本领导能否顶住在位者反击。
