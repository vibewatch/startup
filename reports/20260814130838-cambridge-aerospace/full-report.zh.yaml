      - number: '1.2'
        title: 管理层、创始人与治理
        blocks:
          - type: paragraph
            body: >
              Cambridge Aerospace 的创始管理层把深厚航空航天工程能力和防务行业商业经验拼在一起。CEO Steven Barrett 是航空航天工程教授，曾在 Massachusetts Institute
              of Technology 和 University of Cambridge 任职；外界普遍认为他牵头完成了 2018 年首架固态离子驱动飞机演示。首席商务官 Chris Sylvan 曾在 Royal
              Marines 服役十多年，之后担任 Anduril 欧洲、中东和非洲董事——这是欧洲防务科技创业公司首次把 Anduril 的商业打法装进一家创业公司。联合创始人 Junaid Hussain
              是连续防务科技创业者。三人共同组建了 250 多人的团队，其中约三分之二在技术或工程岗位。公司最初由英国前国防大臣 Rt Hon Grant Shapps 担任董事长。2026 年 5 月，Shapps
              在英国商业任命咨询委员会（ACOBA）公开审查后辞任；ACOBA 担心他在 Cambridge Aerospace
              参与防务事务，与其离开政府时受到的限制冲突。这件事暴露了一家有意把政治可信度作为创始资产的公司在治理上的软肋。截至本报告 runDate，公司尚未公开任命继任董事长。
