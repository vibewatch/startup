      - number: '4.3'
        title: 成本结构、毛利率驱动、营运资本与资本开支
        blocks:
          - type: paragraph
            body: >
              作为硬件制造商，Cambridge Aerospace 的经济模型吃资本、吃库存，与软件相反。毛利率取决于一枚 Skyhammer
              的物料清单（BOM）成本和合同价格之间的差额；公司的整套逻辑是，大规模生产和按成本设计可以压住低单价，同时仍留下利润，但公开资料没有披露 BOM
              或毛利率。营运资本是真拖累：防务合同往往要求在里程碑付款前先建立库存和工装；把年产能从“低数百枚”拉到数千枚，需要前置现金。最大的资本开支承诺是 Norfolk 的 Nightstar 固体火箭发动机设施，以及
              2026
              年正在装配的第二个英国生产基地——二者都是多年期、重资本建设，成本、时间线和良率均未披露。向固体火箭发动机生产垂直整合，在战略上有防御性，但相比轻资产集成商会提高资本强度和执行风险。集成、训练、维保等服务交付成本被打包且未量化。关键毛利问题——单枚
              BOM 成本、工厂利用率、Nightstar 良率和库存周转——恰恰都是公开数据回答不了的问题。
