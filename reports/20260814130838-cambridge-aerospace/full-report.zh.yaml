      - number: '4.2'
        title: 市场进入动作与销售效率替代指标
        blocks:
          - type: paragraph
            body: >
              公司没有披露获客成本（CAC）、回本周期或销售效率指标，只能从销售动作推断。Cambridge Aerospace
              采用直接、关系驱动的政府销售：少量、极大、推进缓慢的采购决策，而不是高容量漏斗。公司有意靠可信度而不是营销投入设计销售效率——招来前 Anduril EMEA
              董事担任首席商务官，并在最初请英国前国防大臣担任董事长——把从创立到国家合同的时间压到不到十八个月，这是极短的防务销售周期。因此，销售效率的替代指标是里程碑速度：2025 年 9 月 DSEI 演示，2026 年
              4 月完成 B 轮并拿到 MoD 合同，2026 年中入选 LEAP 并启动美国开发测试。反过来，政府销售尾巴长、依赖政治、集中度高：少数关系驱动整条管线，董事长因 ACOBA
              冲突离开，也说明靠可信度驱动的市场进入有多脆弱。渠道经济性今天几乎为零——销售是直销——但通过对外军售出口，会引入合作伙伴和许可中介，并让它们分走一部分价值。
