  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 按严重程度排序的风险概览
        blocks:
          - type: paragraph
            body: >
              按可能性和影响的乘积排序，Cambridge Aerospace 有五组突出风险。第一，执行与制造爬坡：全部投资逻辑依赖低价拦截弹能大规模生产；公司要从低数百枚扩到每年数千枚，同时在 NATO
              系统性推进短缺中建设 Nightstar 固体火箭发动机设施，可能性高、影响高，且只被部分缓释。第二，客户集中度：UK MoD 是主导买家，一个采购或预算决定就能改变收入轨迹。第三，治理：Grant Shapps
              ACOBA 冲突和 2026 年 5 月辞职留下董事长空缺，也削弱了可见董事会监督。第四，监管与出口管制暴露：军民两用弹药在英国和美国制度下受到严格许可，后期投资者出处（Ora
              Global）引出国家安全投资问题。第五，需求耐久性：采购紧迫性部分依赖冲突，可能缓和。财务和模型风险（资本强度高、烧钱速度未披露）以及 Starhammer
              研发风险补足了风险清单。下方热力图按可能性、影响和现有缓释后的残余暴露打分；本章其余部分拆解每个风险簇如何传导到业务，以及会改变判断的缓释措施、监测指标和打破投资逻辑的触发条件。
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
