callouts:
  - calloutType: strength
    title: Production-grade anchor reference in the UK MoD
    body: >
      A named, on-the-record UK Ministry of Defence production contract with May 2026 deliveries and LEAP-programme
      selection is a rare, high-quality reference for a two-year-old defence firm and validates real operational
      adoption.
    claimRefs:
      - CU009
      - CU006

  - calloutType: risk
    title: Severe single-customer concentration
    body: >
      The UK MoD dominates the customer base, and no contract values, durations or retention metrics are public.
      Revenue is exposed to one government's budget and procurement policy, making diversification the most important
      commercial priority.
    claimRefs:
      - CU018
      - CU015

  - calloutType: assumption
    title: Retention is inferred, not measured
    body: >
      Defence platforms are structurally sticky once fielded, but Cambridge Aerospace has no renewal track record.
      The retention cohort shown is illustrative and assumption-based, and durability remains unproven.
    claimRefs:
      - CU014
      - CU017

