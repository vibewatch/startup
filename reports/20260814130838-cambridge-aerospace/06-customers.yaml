runDate: "2026-08-14"
company:
  name: Cambridge Aerospace
chapter:
  number: 6
  title: Customers
  summary: >
    Cambridge Aerospace's customer base is a small set of state defence buyers led decisively by the UK Ministry
    of Defence, which placed a multi-million-pound Skyhammer production order with first deliveries in May 2026 and
    selected the company for the LEAP programme. Beyond the UK, the US Army is running developmental live-fire
    testing under Project Bullfrog, Jordan has completed trials, and Gulf partners are referenced as pipeline.
    Adoption is genuine and fast for a two-year-old firm, but it is highly concentrated: one anchor customer
    dominates, contract values and durations are undisclosed, and there is no public retention, renewal or
    repeat-purchase data. The named-customer proof is strong on breadth of interest but thin on durable, quantified
    commercial commitment.

sections:
  - id: segmentation
    title: Customer Base Segmentation
    body: >
      Cambridge Aerospace sells exclusively into the government defence segment, and within it the buyer, user and
      payer roles are distinct but all governmental. The buyer/payer is a national defence ministry or armed-service
      procurement authority — the UK MoD is the anchor — while the user is the operational air-defence unit that
      fields Skyhammer. Segmenting by geography, the base is UK-first (MoD, British Army air defence), with a US
      developmental customer (US Army 52nd Air Defense Artillery Brigade via Project Bullfrog), a Middle East trial
      customer (Jordan), and referenced Gulf partners. By vertical, every customer is short-range air defence /
      counter-UAS; there is no commercial or civil segment, which both focuses the company and caps its addressable
      buyer count. By size, these are large, high-credit, slow-moving institutional buyers whose procurement is
      driven by threat environment and national budget rather than by product-led growth. The practical implication
      is a very small number of very large accounts: winning or losing a single ministry materially changes the
      revenue trajectory, and the sales motion is government-relationship-led rather than volume-funnel-led. This
      concentration is typical of an early defence prime but is a structural risk that recurs throughout the
      customer analysis.
    claimRefs:
      - CU001
      - CU002
      - CU003
      - CU004
    tableRefs:
      - TU001

  - id: adoption
    title: Adoption Trajectory
    body: >
      The adoption trajectory is unusually steep for the sector. Within roughly eighteen months of founding,
      Cambridge Aerospace moved from prototype to a fielded UK MoD contract with first deliveries in May 2026,
      then to selection for the UK LEAP programme in July 2026, alongside US Army developmental live-fire testing
      and completed Jordan trials. That progression — demonstration, contract, delivery, program expansion, and
      allied testing — represents real deployment rather than letters of intent. The clearest adoption signal is
      that Skyhammer is in production and being delivered, and that production is scaling from the low hundreds
      toward thousands of rounds per year, implying repeat manufacturing pull from at least the anchor customer.
      However, "adoption" in defence is lumpy and milestone-based: a single framework contract can account for the
      entire trajectory, and developmental testing (Project Bullfrog) is not yet a program of record. The trajectory
      is therefore best read as strong early traction with one confirmed operational customer and a pipeline of
      trialing customers, not as a broad, diversified adoption curve. Quantified deployment counts, units fielded
      per customer, and re-order cadence are not disclosed, limiting how precisely the trajectory can be measured.
    claimRefs:
      - CU005
      - CU006
      - CU007
      - CU008
    tableRefs:
      - TU002
    figureRefs:
      - FU002

  - id: named-proof
    title: Named Customer Proof
    body: >
      Named-customer proof is the strongest part of Cambridge Aerospace's commercial story on breadth, if not on
      disclosed value. The UK Ministry of Defence is the flagship reference: a confirmed multi-million-pound
      production contract, first deliveries in May 2026, and LEAP-programme selection make it a production-grade,
      publicly acknowledged customer. The US Army — specifically air-defence units associated with Project Bullfrog
      — is a developmental customer conducting live-fire evaluation, a credible but pre-production reference. Jordan
      is a trial customer with completed evaluations, and Gulf partners are referenced as prospective. The quality
      of these references varies sharply: the UK is production and on-the-record; the US is developmental; Jordan is
      trial-stage; the Gulf is pipeline. Crucially, none of the contract values (beyond "multi-million-pound"),
      durations, unit quantities or exclusivity terms are public, so even the flagship reference cannot be sized.
      The enumeration below covers all publicly identifiable customers as of the run date; it is a near-complete
      public list, but the underlying commercial substance behind each name is only partially disclosed, which is
      the central caveat for any customer diligence.
    claimRefs:
      - CU009
      - CU010
      - CU011
      - CU012
      - CU013
    tableRefs:
      - TU003
    figureRefs:
      - FU001
      - FU003

  - id: retention
    title: Retention, Durability, and Reference Quality
    body: >
      Retention and durability cannot be measured from public data, and this is a genuine gap rather than a
      formatting nicety. There is no disclosed net revenue retention, gross retention, churn, renewal rate or
      contract length; the company is young enough that most contracts have not reached a renewal decision. What
      can be inferred is structural rather than empirical: defence procurement, once a platform is fielded and
      integrated, tends to be sticky because of certification, training, integration and sustainment lock-in, and
      because switching interceptors mid-programme is costly and slow. The UK MoD relationship, if it converts from
      initial order to a standing framework and LEAP program-of-record, would be highly durable. Against that, the
      durability is unproven: a two-year-old supplier has no track record of renewals, the demand is partly
      conflict-dependent, and a single procurement policy change or budget shift could stall re-orders. Reference
      quality is high for the UK (named, production, government-backed) and moderate elsewhere (developmental or
      trial). The retention cohort figure below is therefore explicitly illustrative and assumption-based, flagged
      as an evidence gap, because no actual cohort retention data exists to populate it.
    claimRefs:
      - CU014
      - CU015
      - CU016
      - CU017
    tableRefs:
      - TU004
    figureRefs:
      - FU004

  - id: concentration
    title: Expansion, Concentration, and Channel Risk
    body: >
      Expansion potential and concentration risk are two sides of the same coin. On expansion, the land-and-expand
      logic is real: an initial UK order can expand into LEAP program-of-record volume, additional munitions types
      (Starhammer), sustainment revenue, and — via foreign military sales — allied export to the US, Jordan and Gulf
      partners. Each existing trial is a potential future account, and the counter-drone threat environment is
      pushing multiple NATO and allied buyers toward exactly this category. On concentration, the risk is acute:
      the UK MoD is the dominant single customer, so top-customer concentration is very high and revenue is exposed
      to one government's budget, procurement policy and political cycle. Channel risk compounds this — export sales
      depend on government-to-government foreign-military-sales processes and licensing, introducing intermediaries
      and approval risk outside the company's control. An adverse reading notes that concentrated, conflict-driven,
      politically-mediated demand is fragile: the same forces that produced explosive adoption could reverse if the
      threat environment eases or a key relationship (as with the Shapps-linked political access) is disrupted.
      Diversifying beyond the anchor customer is the single most important commercial task ahead.
    claimRefs:
      - CU018
      - CU019
      - CU020
      - CU021
      - CU022
    tableRefs:
      - TU005

