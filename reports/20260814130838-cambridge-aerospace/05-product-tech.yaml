callouts:
  - calloutType: strength
    title: Fielded product with real customer validation
    body: >
      Skyhammer is not a prototype: it entered UK MoD service in May 2026, has been fired in US Army developmental
      testing, and completed Jordan trials. Fielded status plus design-for-cost manufacturing is the strongest
      element of the technology story.
    claimRefs:
      - CE015
      - CE016

  - calloutType: risk
    title: No public reliability or intercept-probability data
    body: >
      For a kinetic interceptor, hit-rate and round reliability are the decisive metrics, yet none are disclosed.
      Combined with undisclosed certifications, this leaves the core performance and quality of the product
      unverifiable from public sources.
    claimRefs:
      - CE018
      - CE027

  - calloutType: assumption
    title: Vertical SRM integration is the structural bet
    body: >
      Owning solid-rocket-motor production via Nightstar is intended to convert a scarce, export-controlled input
      into a moat. The thesis only holds if the Norfolk facility delivers on construction, yield and munitions-safety
      certification.
    claimRefs:
      - CE013
      - CE022

