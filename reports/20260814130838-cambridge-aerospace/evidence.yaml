evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: financial metrics
    missingEvidence: Revenue, ARR, gross margin, and customer contract values
    whyItMatters: Without revenue data, the $3.4 billion valuation cannot be benchmarked on traditional revenue multiples
    diligencePath: Request income statement and backlog schedule in Series C data room
    relatedQuestionRefs:
      - QO025
  - type: missing-source
    severity: minor
    topic: governance
    missingEvidence: Named replacement for Grant Shapps as board chair
    whyItMatters: The board chair vacancy is a residual governance risk after the ACOBA controversy
    diligencePath: Request current board composition and charter from management
    relatedQuestionRefs:
      - QO017
      - QO021
