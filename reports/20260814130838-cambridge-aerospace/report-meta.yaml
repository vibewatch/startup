companyProfile:
  summary: >
    Cambridge Aerospace designs and manufactures low-cost air-defence interceptor missiles to counter
    the proliferation of cheap one-way attack drones such as the Shahed-136. The company's Skyhammer
    interceptor — priced at $27,000–$40,000 vs. $1M+ for traditional systems — was developed from
    concept to flight test in six weeks and entered UK Ministry of Defence service in May 2026.
    Founded in late 2024 by aerospace professor Steven Barrett, ex-Anduril director Chris Sylvan,
    and entrepreneur Junaid Hussain, Cambridge Aerospace has raised approximately $636 million
    across four rounds in under two years, making it one of Europe's fastest-capitalising
    defence hardware startups. A second product, Starhammer, targeting higher-speed threats
    at Mach 2, is in development for 2027. The Nightstar solid-rocket-motor facility in Norfolk
    underpins Cambridge Aerospace's long-term supply-chain sovereignty ambitions.
