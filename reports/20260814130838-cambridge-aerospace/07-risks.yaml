callouts:
  - calloutType: risk
    title: Execution and propulsion supply are the binding constraints
    body: >
      Scaling interceptor manufacturing while building the Nightstar SRM facility amid a systemic NATO propulsion
      shortage is high-likelihood, high-impact and only partially mitigated. A material production slip or Nightstar
      failure is the clearest thesis-break trigger.
    claimRefs:
      - CR012
      - CR013

  - calloutType: risk
    title: Governance gap and investor provenance
    body: >
      The Grant Shapps ACOBA conflict forced his May 2026 resignation and left an unfilled chair, while the
      provenance of the Ora Global LP raises National Security and Investment Act questions. Both are on-the-record
      governance and regulatory exposures.
    claimRefs:
      - CR008
      - CR009

  - calloutType: assumption
    title: A high but survivable risk rating
    body: >
      The balance sheet is strong and no single risk is currently disqualifying, but several are high-severity and
      only partially mitigated. The premium valuation leaves little margin for any of them to crystallise, so the
      rating is high, contingent on continued execution.
    claimRefs:
      - CR027
      - CR034

