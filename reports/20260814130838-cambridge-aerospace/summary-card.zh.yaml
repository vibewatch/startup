  topStrengths:
    - 欧洲防务硬件里最快的产品开发节奏（6 周从概念到试飞）
    - UK MoD 在执行合同、美国陆军开发测试，共同验证产品已接近可用
    - Nightstar 带来可防守的 SRM 护城河：切中 NATO 固体火箭发动机系统性短缺
    - 顶尖创始团队兼具航空航天学术纵深和 Anduril 商业打法
    - 投资人阵容强，包含 DFJ Growth、Lux Capital、Accel、Spark Capital 和 Elad Gil
  topRisks:
    - 执行风险：制造规模能否从每年数百套拉到数千套，尚未验证
    - 客户集中：UK MoD 是压倒性单一客户，续约条款未公开
    - 治理缺口：ACOBA 冲突后，Shapps 的董事长接替者未点名，董事会构成也未披露
    - Starhammer 开发风险：Mach 2 固体火箭发动机系统尚未量产
    - 需求依赖冲突：活跃无人机战减少，采购紧迫性就会下降
  unresolvedGaps:
    - 收入和毛利率数据缺失——估值无法按收入倍数校准
    - 董事会构成和 Shapps 离任后的治理架构未公开
    - Ora Global LP 资金来源，以及是否触发 UK National Security and Investment Act 通知
    - MoD 合同的准确金额和期限仍未披露
    - Starhammer 开发时间表、技术成熟度和预算均未确认
