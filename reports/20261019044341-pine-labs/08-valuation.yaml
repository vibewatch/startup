    title: Recommendation logic
    type: flow
    summary: The recommendation follows the chain from operating proof to valuation discipline and remaining proof points.
    data:
      nodes:
        - id: scale
          label: Scale proof
          value: "$194bn GTV; 11 lakh+ merchants"
          note: FY2025-26 annual report metrics.
          tone: positive
        - id: monetisation
          label: Monetisation proof
          value: "INR 2,711 crore revenue; INR 559 crore adj. EBITDA; INR 113 crore PAT"
          note: First full year of profitability in the retained filing.
          tone: positive
        - id: moat
          label: Platform moat
          value: "Integrated payments + prepaid + acquiring + API stack"
          note: Supported by official site, annual report, and TNGlobal.
          tone: positive
        - id: valuation
          label: Current public valuation
          value: "INR 18,909 crore market cap; 113x P/E"
          note: Public quote already capitalizes the proof-of-scale story.
          tone: neutral
        - id: overhang
          label: Open risks
          value: "Low ROE, capital intensity, incomplete overhang/cycle detail"
          note: Key reasons not to upgrade directly to buy.
          tone: risk
        - id: decision
          label: Recommendation
          value: "Track / fair / high risk / medium confidence"
          note: Buy case improves only with more proof or a better price.
          tone: neutral
      edges:
        - from: scale
          to: monetisation
          label: Scale is finally converting into profit and cash.
        - from: monetisation
          to: moat
          label: The integrated stack explains why monetization can deepen further.
        - from: moat
          to: valuation
          label: Market already prices a significant part of that platform narrative.
        - from: valuation
          to: overhang
          label: Richer pricing makes disclosure and execution gaps matter more.
        - from: overhang
          to: decision
          label: Maintain a track stance until proof points tighten.
    approximationNotes: "The flow is analytical sequencing, not a proportional or statistical model."
    claimRefs: [CV001, CV002, CV004, CV006, CV010, CV014, CV016]
callouts:
  - calloutType: recommendation
    title: Track at current levels
    body: >-
      Pine Labs has earned a better quality label after FY2025-26, but the public quote
      still looks like fair value for an execution story rather than an obvious bargain.
    claimRefs: [CV001, CV006, CV016]
  - calloutType: strength
    title: The best part of the case is the stack
    body: >-
      Integrated payments, prepaid, acquiring, customer engagement, and API tooling
      create more monetization angles than a single-product PSP model.
    claimRefs: [CV004, CV010, CV011, CV012, CV014]
  - calloutType: risk
    title: The market can still re-rate downward
    body: >-
      Low ROE, current multiple, and capital-intensity risk leave the stock vulnerable if
      cash generation or regional execution disappoints.
    claimRefs: [CV006, CV013, CV014, CV016]
