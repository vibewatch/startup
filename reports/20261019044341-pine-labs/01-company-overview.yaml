    title: Leadership and founder table
    columns:
      - Person
      - Role
      - Background
      - Founder-market fit / functional coverage
      - Key-person dependency
    rows:
      - ["Rajul Garg", "Co-founder", "Tracxn and FounderNation both list Garg as a founder; FounderNation also says he later co-founded GlobalLogic.", "Helps root the company in long-cycle enterprise and merchant technology.", "Current operating role is not visible in the assigned pool."]
      - ["Tarun Upadhyay", "Co-founder", "Tracxn lists Upadhyay as a founder and links him to later ventures such as GlobalLogic, hCentive, and Routespring.", "Adds product and technology depth to the founding set.", "Current operating role is not visible in the assigned pool."]
      - ["Lokvir Kapoor", "Co-founder; Executive Chairman", "FounderNation says Kapoor continues as Executive Chairman and highlights engineering and management training.", "Provides founding continuity and strategic oversight across the platform's long pivot from retail automation into fintech.", "Leadership continuity still appears concentrated in Kapoor and CEO Amrish Rau."]
      - ["Amrish Rau", "CEO", "CNBC's post-IPO interview and FounderNation both identify Rau as the current CEO.", "Owns public-market narrative, expansion messaging, and execution credibility after listing.", "High, because the assigned pool reveals more about Rau than about the broader executive bench."]
    notes: >-
      Background fields are limited to what the assigned pool states explicitly and do
      not claim a complete executive roster.
    enumerationScope:
      coverage: partial
      basis: >-
        Publicly named founders plus the current CEO visible in the assigned evidence;
        this is not a full management-team roster.
    claimRefs: [CO005, CO006]
  - id: TO003
    title: Stakeholder or investor map
    columns:
      - Stakeholder
      - Role
      - Control / economic importance
      - Diligence ask
    rows:
      - ["Merchants", "Primary users and transaction base", "FY26 materials cite 11.0 lakh merchants, but an independent IPO explainer cites more than 150,000 merchants, so the economic base is directionally clear but methodologically unresolved.", "Obtain the latest primary-source merchant-definition bridge before later chapters reuse a single customer count."]
      - ["Consumer brands", "Affordability-network counterparties", "The FY26 results package cites 450+ brands, making brands a visible distribution and product-adoption lever.", "Request concentration by top brands and retention of major commercial programs."]
      - ["Issuers and banking partners", "Credit, issuing, and acquiring enablers", "The FY26 results package cites 40+ issuers and names Wio Bank and GCash among FY26 wins, implying bank and enterprise partnerships are core to product reach.", "Clarify partner concentration, exclusivity, and economics by major issuer or bank relationship."]
      - ["Public equity holders", "Current listed-company owners", "Listing status is confirmed, but the assigned pool does not show current free float, sponsor stakes, or public-shareholder concentration.", "Review the latest shareholding disclosures and any lockup or overhang commentary."]
      - ["Legacy venture and strategic backers", "Pre-IPO capital providers", "Tracxn records $1.23B raised across 14 rounds and names Vitruvian, PayPal, Actis, Temasek, and Peak XV in the March 2022 round.", "Map which pre-IPO backers still own material stakes after listing and whether exits could pressure supply."]
    notes: >-
      This map separates current operating stakeholders from capital providers; it does
      not infer control percentages that are not disclosed in the assigned pool.
    enumerationScope:
      coverage: partial
      basis: >-
        Visible stakeholders and backers explicitly named in the assigned evidence,
        rather than a full cap table or commercial counterparty list.
    claimRefs: [CO001, CO009, CO012, CO013, CO015, CO016]
