schemaVersion: report-v2
artifact: company-overview
slug: pine-labs
runDate: 2026-10-19
company:
  name: Pine Labs
chapter:
  number: 1
  title: Company Overview
  summary: >-
    Pine Labs enters this refresh as a listed Indian merchant-commerce platform with
    audited FY26 profitability, a long operating history, and a broad product stack
    spanning payments, issuing, affordability, and merchant software. The assigned
    pool is strong on identity, leadership, funding history, and FY26 scale, but it
    still leaves unresolved gaps on post-IPO ownership concentration, headcount, and
    the exact customer-count definition later chapters should reuse.
sections:
  - id: identity-and-footprint
    title: Identity, product perimeter, and operating footprint
    body: >-
      Pine Labs still presents itself first as commerce infrastructure rather than as a
      single-product payments company. The official investor and product surfaces
      describe a cloud-based platform serving merchants, consumer brands, enterprises,
      and financial institutions, with emphasis on digital payments, issuing, open APIs,
      and software-led integration. Third-party summaries consistently place the company
      in Noida, while the FY26 results booklet uses a Gurugram registered office,
      suggesting that later chapters should distinguish operating headquarters from the
      statutory address instead of collapsing them into one location field. Scale also
      needs care: the FY26 shareholder letter presents a much larger merchant base than
      one independent IPO explainer, so the report should carry customer-count gaps
      forward rather than presenting a single unqualified figure.
    claimRefs: [CO001, CO002, CO003, CO004, CO015, CO016]
    tableRefs: [TO001]
  - id: leadership-and-governance
    title: Leadership continuity, governance surface, and key-person dependency
    body: >-
      The leadership story is anchored by continuity at the top rather than by a broad
      public executive bench. CNBC and FounderNation both identify Amrish Rau as the
      CEO after the November 2025 listing, while FounderNation says co-founder Lokvir
      Kapoor remains Executive Chairman and Tracxn still names Rajul Garg, Tarun
      Upadhyay, and Kapoor as founders. That combination gives Pine Labs credible
      founder-market fit in merchant technology and a visible public-company spokesperson,
      but it also increases key-person dependence because the assigned evidence says much
      more about Rau and Kapoor than about the wider operating team. Governance
      disclosure is similarly narrow in this pool: Tracxn's board summary names Sumit
      Chopra and independent director Tanya Mohan Naik, which is useful context but not
      a substitute for a current primary-source board or committee roster.
    claimRefs: [CO005, CO006, CO009]
    tableRefs: [TO002, TO003]
  - id: funding-stage-and-milestones
    title: Funding path, public-market transition, and milestone readout
    body: >-
      The strongest current hard data comes from the FY26 results package and Tracxn's
      funding chronology. Pine Labs reported ₹2,711 crore of FY26 revenue from
      operations, ₹559 crore of adjusted EBITDA, ₹113 crore of profit after tax, and
      ₹395 crore of operating cash flow, which means this refresh starts from a more
      defensible profitability position than many late-stage fintech peers. Tracxn's
      history still points to a heavily financed pre-IPO period, including the 2022
      Series F rounds around the $5 billion private valuation mark, while Capital.com
      preserves an important caution signal: Pine Labs had already withdrawn a prior US
      IPO attempt and the source still framed a bear case around competition and delayed
      profitability. The company therefore looks scaled and more mature, but not yet
      free of post-listing scrutiny on valuation support and execution consistency.
    claimRefs: [CO007, CO008, CO010, CO011, CO012, CO013, CO014, CO015, CO016]
    figureRefs: [FO001]
