    claimRefs: [CO002, CO005, CO007, CO008, CO009, CO010, CO011, CO013, CO014, CO015]
callouts:
  - calloutType: risk
    title: Public-market transition still carries material diligence gaps
    body: >-
      The assigned pool is strong enough to anchor Pine Labs' listing status, FY26
      financial profile, and major pre-IPO funding markers, but it is still too thin to
      settle current ownership concentration, reconcile merchant-count definitions, or
      support a primary-source headcount. Those gaps should stay explicit, because later
      market, customer, and valuation chapters will otherwise inherit soft scale
      assumptions from overview materials.
    claimRefs: [CO009, CO015, CO016]
