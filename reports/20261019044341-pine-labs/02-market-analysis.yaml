callouts:
  - calloutType: strength
    title: Multi-rail exposure matters more than one generic TAM number
    body: >-
      Pine Labs benefits if merchant digitization expands across several connected rails at
      once: checkout acceptance, online payments, affordability, prepaid programs, and
      fintech-infrastructure workflows.
    claimRefs: [CM001, CM003, CM004, CM005, CM006, CM007]
  - calloutType: risk
    title: Public market sizing is broad, but monetization still hinges on policy and trust
    body: >-
      The available public numbers are overlapping category lenses rather than a clean
      bottom-up SAM, and near-term economics can move with compliance burden, merchant
      integration friction, and MDR policy choices.
    claimRefs: [CM008, CM014, CM015]
