      - ["SMEs and mid-market merchants", "Owner-manager or merchant acquirer relationship team", "Frontline staff and merchant owners", "Merchant, sometimes through rental/subscription model", "Simple digital acceptance, billing, and self-service operations", "Owner / finance manager", "Low current penetration of digital checkout points and need for faster onboarding"]
      - ["Brands and corporates", "Loyalty, treasury, or partnerships teams", "Marketing, customer-retention, and prepaid-program managers", "Brand or enterprise sponsor", "Gift cards, prepaid, offers, and customer engagement rails", "CMO / loyalty / treasury", "Need to hold customer value and improve repeat spend"]
      - ["Banks, issuers, and fintech platforms", "Product or partnerships teams", "Operations, risk, engineering, and distribution teams", "Financial institution or fintech platform", "Issuing, bill pay, account aggregation, onboarding, and API-led transaction infrastructure", "Product / partnerships / technology", "Need to keep merchant relationships while embedding payment and data rails into their own products"]
    notes: "Buyer, user, and payer roles vary by rail; public sources describe the roles qualitatively but do not disclose segment-by-segment budget sizes."
    claimRefs: [CM009, CM010, CM011, CM012]
