      - ["Redseer", "FY2019 to FY2029P", "India", "P2M digital payments: ₹17.8T in FY2019; ₹86.8T in FY2024; ₹244-265T by FY2029P", "~37% FY2019-24; 23-25% FY2024-29P", "Transaction-value lens for merchant digital payments", "Medium", "Broad category overlaps with online and UPI subsegments"]
      - ["Redseer", "FY2019 to FY2029P", "India", "Online payments: ~₹40T in FY2024; ₹120-135T by FY2029P", "25-27% FY2024-29P", "Transaction-value lens for online merchant payments", "Medium", "Subset rail, not a total company addressable market"]
      - ["Redseer", "FY2019 to FY2029P", "India", "UPI P2M: ₹50.6T in FY2024; ₹160-175T by FY2029P", "~123% FY2019-24; 26-28% FY2024-29P", "Transaction-value lens for UPI merchant payments", "Medium", "One payment rail inside the broader merchant-payments pool"]
      - ["Redseer", "FY2024 to FY2029P", "India", "Retail consumption loans: ~₹48T in FY2024; ₹95-120T by FY2029P", "15-20%", "Affordability / point-of-purchase credit lens", "Medium", "Credit market lens, not pure payments TPV"]
      - ["Redseer", "FY2024", "India", "Retail market size: ~₹79T", "10% to FY2029P", "Adjacency lens for underlying commerce spend", "Medium", "Useful for context, but not directly Pine Labs revenue or TPV"]
    notes: "All figures come from the Pine Labs-hosted June 2025 Redseer report; the numbers are useful sizing lenses but overlap and should not be summed into one headline TAM."
