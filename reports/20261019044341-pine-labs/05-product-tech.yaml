    title: Workflow / use-case table
    columns:
      - User job
      - Current workflow
      - Pine Labs solution
      - Measurable benefit
      - Limitation
    rows:
      - ["Enterprise omnichannel merchant acceptance", "Unify in-store and online acceptance while reconciling multiple acquirers", "Single cloud-based billing/ERP integration plus routing, settlement, and reconciliation", "One integration can replace multiple acquirer relationships according to the annual report", "Assigned evidence has no independent uptime or authorization benchmark by merchant segment"]
      - ["Mid-market / high-street merchant operations", "Adopt digital checkout without enterprise-scale custom builds", "Right-sized device, billing, and affordability formats", "Company says segment-specific formats widen checkout coverage beyond premium retail", "No disclosed churn or support-cost data for this cohort"]
      - ["D2C checkout conversion", "Accept payments, offers, refunds, and payouts through web or app flows", "Plural plus Shopflo, payment links, payouts, and recurring payments", "Company says API go-live can be as little as one week and FY26 included 20+ new online solutions", "No independent evidence on conversion uplift or retained merchant economics"]
      - ["Bank / fintech embedded-finance rails", "Onboard users, move money, verify identity, and read consented data", "Setu APIs, Bharat Connect or UPI workflows, Account Aggregator, and SignalIQ", "Developer-first APIs are designed to let partners go live within weeks", "No public repository, package, or forum telemetry confirms external developer adoption"]
      - ["Brand / enterprise stored-value and loyalty programs", "Issue gift, refund, reward, or allowance instruments tied to business rules", "Pine Labs Prepaid, Woohoo distribution, Brand Wallet, and Credit+", "Closed-loop, semi-closed-loop, and open-loop constructs enable targeted redemption and usage control", "No disclosed breakage, redemption, or fraud-loss metrics by program type"]
    notes: >-
      Benefits are limited to supported company disclosures such as integration consolidation and
      stated go-live timing; no unsupported ROI uplift has been inserted.
    claimRefs: [CE002, CE003, CE004, CE005, CE006, CE014]
  - id: TE003
    title: Technology / operating architecture table
    columns:
      - Layer / process
      - Role
      - Key dependency
      - Risk
    rows:
      - ["Cloud infrastructure", "Elastic, multi-AZ base supporting in-store, online, and issuing workloads", "Reliable cloud operations and deployment discipline", "Assigned pool does not independently validate uptime or failover performance"]
      - ["Core platform", "Payments, issuing, settlements, and reconciliation engine", "Correct transaction processing across geographies and products", "Complexity rises as more modules and countries share the same control plane"]
      - ["API ecosystem", "Setu, SDK, developer console, and merchant integrations expose platform capabilities", "Partner engineering capacity and integration governance", "Public developer-signal is thin relative to the company's developer-first positioning"]
      - ["Intelligence layer", "AI or ML, analytics, fraud, smart routing, anomaly detection, and SignalIQ monitoring", "Clean event data and model governance", "External evidence does not benchmark model performance or false-positive rates"]
      - ["Security and compliance", "PCI-DSS, ISO 27001, SOC 2, P2PE, KYC or AML and related controls protect regulated flows", "Successful audits and scope upkeep across products", "Incident history and control effectiveness are only partially visible from assigned public sources"]
    notes: >-
      Uses the annual report's explicit layering and public certification disclosures; risks focus
      on what the assigned evidence cannot independently validate.
    claimRefs: [CE005, CE007, CE008, CE009]
figures:
  - id: FE001
    title: Product architecture map
    type: stack
    summary: Pine Labs layers merchant checkout surfaces over orchestration, fintech APIs, issuing, and compliance controls.
    data:
      layers:
        - label: Merchant checkout surfaces
          detail: In-store, online, and omnichannel acceptance endpoints that merchants and consumers directly use.
          modules:
            - "Plutus Smart PoS / Mosambee"
            - "Plural gateway"
            - "Payment links and payouts"
            - "Checkout EMI and offers"
          outputs:
            - "Cards, UPI, wallets, prepaid, pay-by-points"
        - label: Merchant orchestration
          detail: Workflow layer that connects acceptance to settlement, reconciliation, and merchant operations.
          modules:
            - "Routing and adaptive retry"
            - "Settlement and reconciliation"
            - "Billing / ERP integrations"
            - "Analytics and loyalty"
          outputs:
            - "Unified merchant interface"
            - "Multi-acquirer operations"
        - label: Fintech infrastructure
          detail: API-led payment, identity, and consented-data services for banks and fintechs.
          modules:
            - "UPI / Bharat Connect rails"
            - "Aadhaar / PAN / bank verification"
            - "Account Aggregator gateway"
            - "SignalIQ monitoring"
          outputs:
            - "Partner go-live in weeks"
        - label: Issuing and engagement
          detail: Stored-value, rewards, and card-issuance modules that extend the platform beyond acceptance.
          modules:
            - "Qwikcilver / Woohoo"
            - "Brand Wallet"
            - "Credit+"
            - "Program management"
          outputs:
            - "Closed-loop, semi-closed-loop, open-loop instruments"
        - label: Intelligence, security, and compliance
          detail: Shared data, fraud, AI, and control stack underpinning the other layers.
          modules:
            - "AI/ML and analytics"
            - "Fraud and anomaly detection"
            - "PCI-DSS / ISO 27001 / SOC 2"
            - "P2PE and KYC or AML controls"
          outputs:
            - "Developer-first but regulated operating model"
        - label: Merchant operations and support
          detail: Operational tooling keeps large installed device and payment fleets functioning after deployment.
          modules:
            - "Fleet health monitoring"
            - "Remote configuration and troubleshooting"
            - "Merchant management lifecycle"
            - "Reconciliation and dispute operations"
          outputs:
            - "Lower manual operations at scale"
    approximationNotes: >-
      Layering is synthesized from company disclosures and independent module descriptions rather
      than from a published engineering diagram with exact service boundaries.
    claimRefs: [CE001, CE005, CE007, CE009, CE010]
callouts:
  - calloutType: strength
    title: Integration depth appears to be the real moat
    body: >-
      The assigned evidence repeatedly points to routing, reconciliation, ERP or billing
      integration, and checkout affordability as Pine Labs' defensible layer; the hardware itself
      looks replaceable, but the merchant workflow is harder to unwind.
    claimRefs: [CE002, CE007, CE008, CE011]
  - calloutType: risk
    title: Commodity acceptance is the weakest part of the story
    body: >-
      External commentary suggests Pine Labs is strongest when checkout complexity is high and
      weakest when the merchant only needs low-cost acceptance, especially as QR and soundbox
      models keep moving down-market.
    claimRefs: [CE011, CE012]
