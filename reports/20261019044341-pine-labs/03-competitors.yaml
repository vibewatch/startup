      checkout or distribution control on the vertical axis.
    data:
      points:
        - label: Pine Labs
          x: 5
          y: 5
          note: Full-stack merchant infrastructure with physical, online, affordability, prepaid, and bank-facing layers
        - label: Online-first gateways
          x: 3
          y: 3
          note: Strong online checkout and APIs with less assigned evidence for physical-commerce breadth
        - label: Consumer-UPI ecosystems
          x: 3
          y: 4
          note: Strong consumer distribution and merchant reach on shared payment rails
        - label: Banks and acquirers
          x: 2
          y: 4
          note: Existing merchant relationships and regulated payment infrastructure with more fragmented orchestration
        - label: Internal or assembled stack
          x: 2
          y: 2
          note: Configurable point solutions with lower control across a unified merchant workflow
        - label: Specialist point tools
          x: 2
          y: 1
          note: Narrow capability with lower control across the full merchant workflow
    approximationNotes: >-
      Positions are 1-to-5 ordinal analyst judgments derived only from assigned
      evidence; they are not market-share, revenue, or customer-satisfaction
      measurements.
    claimRefs:
      - CP001
      - CP002
      - CP003
      - CP014
callouts:
  - calloutType: strength
    title: Integration depth is more defensible than feature breadth alone
    body: >-
      Pine Labs' strongest evidence-backed edge is the combination of settlement,
      ERP, reconciliation, affordability, prepaid, and bank-facing infrastructure
      inside merchant workflows, not any single acceptance feature.
    claimRefs:
