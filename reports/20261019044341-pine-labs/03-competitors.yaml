  - id: TP002
    title: Feature, pricing, and distribution comparison
    columns:
      - Buying criterion
      - Pine Labs evidence
      - Rival evidence in assigned pool
      - Status-quo alternative
      - Underwriting conclusion
    rows:
      - - Omnichannel acceptance
        - In-store and online acceptance with routing, settlement, and reconciliation
        - Multiple rivals offer online acceptance; some have merchant or offline distribution
        - Merchants can retain multiple acquirers and channel-specific providers
        - Pine Labs breadth is supported, but relative performance is not measured
      - - Affordability
        - 40+ credit partners, 450+ brands, and 80,000+ monthly transacting stores
        - Retained comparisons do not quantify rival network breadth
        - Merchants can integrate lenders or other orchestration providers separately
        - Plausible network effect; independent conversion proof is missing
      - - Prepaid and stored value
        - Issuing, processing, distribution, and program-management capabilities
        - Rival capability is not compared consistently in the pool
        - Merchants can use a specialist issuer or program manager
        - Scope advantage is supported; exclusivity is not
      - - Pricing
        - Transaction-value, transaction-count, subscription, hybrid, and integration fees
        - No matched current enterprise contracts or net take rates
        - Procurement can assemble lower-priced point solutions
        - No price-leadership conclusion is supportable
      - - Security and compliance
        - Licences plus PCI, ISO, SOC 2, RBI, CERT-In, and scheme controls
        - Mature rivals are also described as compliant and secure
        - Banks or regulated providers can supply compliant components
        - Trust is a buying prerequisite, not a standalone unique moat
      - - Distribution
        - 20.3 lakh checkout points, 11 lakh+ merchants, direct and bank-led routes
        - Consumer ecosystems and gateways have alternate distribution
        - Banks can retain direct merchant ownership
        - Reach is supported; channel economics and exclusivity are not
    notes: >-
      Comparison is limited to capabilities and commercial mechanics visible in
      the assigned pool; unknown rival details are not inferred from general
      market reputation.
    claimRefs:
      - CP003
      - CP004
      - CP007
      - CP009
      - CP010
      - CP011
      - CP013
  - id: TP003
    title: Switching-cost and lock-in mechanism analysis
    columns:
      - Mechanism
      - Supporting evidence
      - Strongest affected cohort
      - Durability assessment
      - Counterpressure or missing proof
    rows:
      - - System-of-record integration
        - Settlement, ERP, routing, processing, and reconciliation are integrated
        - Enterprise merchants and banks
        - High relative to point solutions
        - Migration time, cost, downtime, and churn are not disclosed
      - - Affordability network
        - 40+ credit partners and 450+ brands connect through the platform
        - Omnichannel merchants using financed offers
        - Medium to high
        - No neutral offer-coverage, exclusivity, or conversion benchmark
      - - Licences and certifications
        - Regulatory permissions and scheme or security compliance
        - Banks, regulated partners, and large enterprises
        - Medium
        - Mature competitors also carry compliance credentials
      - - Distribution footprint
        - 20.3 lakh checkout points and more than 11 lakh merchants
        - In-store and mid-market merchants
        - Medium
        - No partner-sourced pipeline, CAC, or exclusive transaction-share data
      - - Payment links and modular checkout
        - Pine Labs supports low-infrastructure remote collection
        - Small and online-first merchants
        - Low
        - Broad availability makes multi-homing and substitution easier
    notes: >-
      Durability is a qualitative assessment from the cited mechanisms, not a
      measured retention score; the table separates supported integration depth
      from unavailable customer-behaviour evidence.
    claimRefs:
      - CP005
      - CP006
      - CP008
      - CP009
      - CP012
      - CP013
