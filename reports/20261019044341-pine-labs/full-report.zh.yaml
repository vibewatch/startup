      - number: '2.2'
        title: 市场规模与买方分层应视为相互重叠的观察镜头
        blocks:
          - type: paragraph
            body: >-
              本轮材料中最好的公开规模来源是 Pine Labs 托管的 2025 年 6 月 Redseer 行业报告，应把它看作委托研究视角，而非独立基准。该报告估算 Pine Labs 在印度 FY2024 面临 ₹91
              trillion 的机会，FY2029 增长至 ₹255-280 trillion，同时拆分出 P2M 数字支付、线上支付、UPI P2M
              和零售消费贷款等相邻基础设施。这些数字说明品类足够宽、增长空间也大，但并不是一个整齐的加总漏斗，因为同一商户可能同时使用多条基础设施。买方侧则呈现多边市场：企业零售商和中小企业购买受理及工作流工具，品牌购买礼品卡、预付卡和忠诚度基础设施，银行和金融科技公司购买发卡、API
              与交易基础设施，终端用户主要作为信贷、奖励和更顺畅结账的间接受益者出现。
