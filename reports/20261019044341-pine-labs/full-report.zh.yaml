            tableRef: TV001
            claimRefs:
              - CV001
              - CV005
              - CV006
              - CV007
              - CV016
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV006
              - CV010
              - CV014
              - CV016
      - number: '8.2'
        title: 正向论点与反向论点
        blocks:
          - type: paragraph
            body: >-
              看多论点是，Pine Labs 已拼出一个难以复制的密集商户商业技术栈。年报描述了覆盖印度、马来西亚和新加坡的牌照，公司网站和 TNGlobal 都强调集成支付、收单、分期、预付卡和客户互动。Bastion
              补充称，该平台已经覆盖印度主要商户群，并贡献了有意义的海外收入；Teaserclub 对 2026 年 Shopflo 的报道则说明 Pine Labs
              仍在扩张线上结账覆盖。反向论点是，规模本身未必带来超额股权回报：Bastion 强调大型终端基础带来的折旧负担，Screener 标出历史 ROE
              低和应收账款天数高，而当前公开倍数仍几乎不给执行失误留下空间。这种组合支持继续跟踪持久质量证据，而不是仅因覆盖面广就高价买入。
            claimRefs:
              - CV002
              - CV004
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV014
              - CV015
              - CV016
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV004
              - CV006
              - CV008
              - CV010
              - CV012
              - CV013
              - CV014
              - CV016
      - number: '8.3'
        title: 估值背景与情景
        blocks:
          - type: paragraph
            body: >-
              公开估值背景正在改善，但还没有明显错价。Clay 的融资档案估算累计私募融资为 $832 million，最后一轮私募估值在 2022 年 3 月超过 $5 billion，早于 2025 年 11 月
              IPO。FY2025-26 文件称 IPO 包括 INR 2,080 crore 新发行和 INR 1,819.9 crore 老股出售；上市既为公司融资，也扩大了股东基础。但如今可用的公开锚点是
              Screener 的 INR 18,909 crore
              市值；历史美元私募估值只是背景，不能直接拿来计算同口径折价。本轮材料也缺少干净的公开同行或交易可比组，因此给出精确目标区间会制造虚假精确。基准情景应是围绕当前价格持有，等待公司证明 FY2025-26
              盈利、现金转化和以新加坡为核心的区域组合能够持续，同时不再被资本强度拖累。
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
              - CV007
              - CV010
              - CV013
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV006
              - CV010
              - CV013
              - CV014
              - CV015
              - CV016
      - number: '8.4'
        title: 最终尽调要求与投资逻辑破坏因素
        blocks:
          - type: paragraph
            body: >-
              要重新给出积极投资判断，需要从三个方面获得更清晰的证据。第一，投资者需要更透明地了解 IPO
              后股权集中度、锁定期或发起人悬压，以及可能影响流动性或资本配置纪律的优先权或治理遗留事项。第二，管理层需要证明盈利拐点不是一年行情，方法是持续交付
              PAT、经营现金流和国际变现，同时不依赖不透明的盈利质量项目。第三，Pine Labs
              应按细分市场提供更清晰的商户质量和客户群证据，让市场判断其集成技术栈是否真的支持更高价值的交叉销售，而不只是更广的分发。可辩护的目标回报、持有期限或退出倍数，还需要当前同行组和投资者特定的回报门槛，而现有证据没有提供这些。投资逻辑破坏因素包括现金生成反转、新加坡和东南亚组合逻辑停滞，或估值溢价重新扩大却没有相匹配的披露和
              ROE 改善。
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV008
              - CV010
              - CV013
              - CV014
              - CV016
      - number: '8.5'
        title: 展品
        blocks:
          - type: callout
            title: 维持当前水平跟踪
            body: Pine Labs 在 FY2025-26 之后获得了更高的质量评价，但公开报价看起来仍只是对执行力叙事的合理定价，而非显而易见的便宜货。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV006
              - CV016
          - type: callout
            title: 这套业务栈是案例中最扎实的部分
            body: 集成支付、预付卡、收单、客户互动和 API 工具，相比单一产品 PSP 模式提供了更多变现路径。
            calloutType: strength
            claimRefs:
              - CV004
              - CV010
              - CV011
              - CV012
              - CV014
          - type: callout
            title: 市场重估仍可能向下
            body: ROE 偏低、当前估值倍数不低，加上资本密集型风险；一旦现金创造能力或区域执行不及预期，股价就容易承压。
            calloutType: risk
            claimRefs:
              - CV006
              - CV013
              - CV014
              - CV016
