        title: 领导层连续性、治理信息与关键人物依赖
        blocks:
          - type: paragraph
            body: >-
              公司的领导层故事靠顶层连续性支撑，而不是靠一支公开信息完整的高管团队。CNBC 和 FounderNation 都确认 Amrish Rau 在 2025 年 11 月上市后担任
              CEO；FounderNation 称联合创始人 Lokvir Kapoor 仍任执行主席，Tracxn 仍将 Rajul Garg、Tarun Upadhyay 和 Kapoor 列为创始人。这一组合让
              Pine Labs 在商户技术领域具备可信的创始人—市场匹配，也有一位面向公众的上市公司发言人，但关键人物依赖也更高，因为现有证据对 Rau 和 Kapoor
              的描述远多于对整个运营团队的描述。本轮材料中的治理披露同样有限：Tracxn 的董事会摘要列出 Sumit Chopra 和独立董事 Tanya Mohan
              Naik，这能提供背景，但不能替代当前的一手董事会或委员会名册。
