        - 跟踪
        - FY2025-26 的盈利拐点是真实的，但上行空间仍需要更多证明。
        - 以观察为主，不要按今天的价格激进加仓。
      - - 信心
        - 中
        - 公开申报和当前市场数据较强，但客户群经济性和悬而未决事项的细节仍不完整。
        - 等待进一步披露后再提高确信度。
      - - 风险评级
        - 高
        - 尽管恢复 PAT 盈利，执行、披露和估值倍数压缩风险仍然重要。
        - 只有在严格控制下行风险的前提下进行投资判断。
      - - 估值立场
        - 公允至偏高
        - 市值为 INR 18,909 crore，约为 FY2025-26 收入的 7.0 倍，页面显示 P/E 为 113 倍；2022 年私人市场估值不可直接比较。
        - 更好的入场点要么需要更低价格，要么需要更强的验证点。
      - - 目标回报 / 持有 / 退出
        - 指定证据不足以支持
        - 没有干净的可比公司组合、投资者回报门槛或有依据的退出倍数。
        - 不要捏造目标；先补上估值模型缺口。
    notes: 分析师综合当前公开市场指标、FY2025-26 文件和保留的独立来源得出。
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV016
  - id: TV002
    title: 正论 / 反论表
    columns:
      - 论点
      - 证据
      - 哪些变化会改变判断
    rows:
      - - 一体化堆栈与监管深度
        - 覆盖印度、马来西亚和新加坡的牌照，加上安全 / 合规资质，支撑平台信任和合作伙伴广度。
        - 如果披露显示这些能力提升了 ROE 和现金转换，而不仅仅是扩大范围，则上调判断。
      - - 规模到盈利的拐点
        - FY2025-26 文件显示，收入、EBITDA、PAT 和经营现金流均有实质改善。
        - 如果 PAT 和现金流在下一报告周期仍保持正值，则上调判断。
      - - 资本密集度拖累
        - 独立研究仍强调终端网络带来的高额折旧以及持续刷新设备的负担。
        - 如果利润率改善逆转，或 DCP 刷新再次压低 PAT 和现金流，则下调判断。
      - - 估值与披露纪律
        - 相对于盈利，当前公开估值仍然偏高；悬而未决事项和客户群细节也仍不完整。
        - 只有在股权持有 / 资本配置披露更严格，或入场价格更优之后，才上调判断。
    notes: 各行将看多逻辑最有力的支持与会改变立场的具体证据配对。
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV008
      - CV010
      - CV012
      - CV013
      - CV014
      - CV016
  - id: TV003
    title: 牛市 / 基准 / 熊市情景表
    columns:
      - 情景
      - 假设
      - 估值 / 回报逻辑
      - 关键风险
      - 概率信号
    rows:
      - - 牛市
        - FY2025-26 盈利持续，新加坡主导的捆绑销售扩大，且并购新增资产加深线上变现。
        - 盈利增长会在股价不压缩的情况下压低当前 113 倍 P/E；在获得干净的可比公司组合前，无法支持绝对目标区间。
        - 盈利被证明只是暂时的，或跨境扩张消耗资本的速度超过预期。
        - 至少还需要两个干净的报告周期，以及更好的悬而未决事项披露。
      - - 基准
        - 收入增长和变现延续，但 ROE 仅逐步改善，披露缺口仍在。
        - 运营改善被 INR 164 当前报价附近的估值倍数正常化所吸收，因此入场点公允，但谈不上明显有吸引力。
        - 如果市场要求更清晰的回报指标，估值倍数压缩可能抵消运营进展。
        - 与当前证据最为一致。
      - - 熊市
        - PAT 或现金生成下滑，或市场重新聚焦于低 ROE、应收账款周转天数和资本密集度风险。
        - 113 倍 P/E 压缩，股价跌破 INR 164 当前报价；指定证据不支持精确的下行底线。
        - 市场对盈利拐点失去信心，或出现治理 / 悬而未决事项方面的意外。
        - 如果后续文件显示现金转换或区域表现走弱，熊市情景的可能性会提高。
    notes: 情景采用 2026 年 10 月 19 日公开报价和运营信号；由于保留证据池缺少干净的可比公司材料包，精确估值区间仍是已记录的缺口。
    claimRefs:
      - CV001
      - CV006
      - CV010
      - CV013
      - CV014
      - CV015
      - CV016
