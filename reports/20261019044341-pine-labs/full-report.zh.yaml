      - number: '4.2'
        title: 利润率结构与交付经济性
        blocks:
          - type: paragraph
            body: >-
              FY26 是 Pine Labs 的规模首次明确转化为报告盈利的一年：收入增长 19%，调整后 EBITDA 增长 57% 至 ₹559 crore，PAT 从上年亏损转为 ₹113
              crore。年报把这一拐点归因于经营杠杆，单位经济性表也支持这一方向：整体贡献毛利率保持在约 75%，DITP 明显高于分发更重的发卡与收单业务。即便如此，Q1 FY27
              快照说明投资者为何不应在缺乏谨慎的情况下把 FY26 盈利转折年化。收入同比仍增长 20%，但调整后 EBITDA 利润率只有
              17.1%；独立业绩摘要还指出，低毛利业务占比上升、云和网络支出增加、抽成率下降，且公司没有给出具体 FY27 EBITDA 指引。公开 GTM 代理指标也显示投入前置：Pine Labs 在六个月内增加约
              500 名销售人员，管理层称这些员工通常需要 6 到 12 个月才能达到完整生产力。这说明公司仍在购买增长和交叉销售深度，而不是收割一个完全成熟的收入基础。
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.3'
        title: 资本充足性与剩余投资判断障碍
        blocks:
          - type: paragraph
            body: >-
              账面流动性看起来很大，但并非全部可自由支配。截至 2026 年 3 月 31 日，Pine Labs 报告现金及现金等价物 ₹1,393.08 crore、指定用途银行余额 ₹5,569.74
              crore、较长期银行存款 ₹1,339.27 crore；文件称指定账户用于商户结算，不能用于一般用途。公司还获得 ₹2,080 crore 的 IPO 新发行资金，并称稳态营运资金应维持在收入的
              13-15%。对一家规模化上市运营商而言，这可控但仍然重要，因为结算时点和受限余额是支付业务流动性的核心。更深层的障碍是盈利质量，而不是账面流动性。Pine Labs 根据历史兑换模式估算 breakage
              收入；在 GST Council 澄清后，一项围绕 ₹13.37 crore breakage 相关服务税追缴的上诉程序仍未结束。再加上缺少公开 CAC/回本期、客户群留存、客户集中度和 IPO
              后余额释放细节，本章的判断只能是“可信，但尚未完全完成投资验证”。
            claimRefs:
              - CI004
              - CI014
              - CI015
