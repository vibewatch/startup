  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与构成
        blocks:
          - type: paragraph
            body: >-
              在公开记录中，Pine Labs
              已不只是终端供应商。官方和第三方画像来源一致把它描述为覆盖店内和线上支付、预付卡及礼品产品、金融科技基础设施的商户商业平台，这一点很重要，因为如今收入栈同时包含类似订阅的设备收入、与交易挂钩的费用和预付卡经济性。FY26
              的收入构成仍偏向 Digital Infrastructure and Transaction Platform（DITP），约占营业收入的 68%；但发卡与收单侧已经占
              32%，说明公司既从商户变现，也从品牌和金融机构变现。公开变现证据更多说明收费机制，而不是价目表：店内收入与 DCP
              订阅和相关服务挂钩，流量、分期优惠、处理、金融科技基础设施以及发卡与收单则都与活动量单位挂钩。这支持收入结构在底层更好，但缺少公开的实际定价和折扣披露，仍限制了外部投资者评估收入质量的深度。
