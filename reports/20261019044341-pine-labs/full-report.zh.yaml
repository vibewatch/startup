        - 要求披露头部品牌集中度，以及主要商业项目的留存情况。
      - - 发卡机构与银行合作伙伴
        - 信贷、发卡和收单的赋能方
        - FY26 业绩材料引用 40+ 家发卡机构，并将 Wio Bank 和 GCash 列为 FY26 的新增成果，说明银行和企业合作是产品触达的核心。
        - 明确主要发卡机构或银行关系的合作伙伴集中度、排他性和经济贡献。
      - - 公开市场股东
        - 当前上市公司所有者
        - 上市状态已确认，但指定证据池没有显示当前自由流通股、发起人持股或公众股东集中度。
        - 查阅最新持股披露，以及任何锁定期或抛压评论。
      - - 老牌风险投资人与战略支持者
