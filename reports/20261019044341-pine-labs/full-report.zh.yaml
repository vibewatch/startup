  - id: FE001
    title: 产品架构图
    type: stack
    summary: Pine Labs 在编排、金融科技 API、发卡和合规控制之上叠加商户结账触点。
    data:
      layers:
        - label: 商户结账触点
          detail: 商户和消费者直接使用的店内、线上和全渠道受理端点。
          modules:
            - Plutus Smart PoS / Mosambee
            - Plural 网关
            - 支付链接和打款
            - 结账 EMI 和优惠
          outputs:
            - 卡、UPI、钱包、预付、积分支付
        - label: 商户编排
          detail: 将受理连接到结算、对账和商户运营的工作流层。
          modules:
            - 路由和自适应重试
            - 结算和对账
            - 计费 / ERP 集成
            - 分析和忠诚度
          outputs:
            - 统一商户界面
            - 多收单机构运营
        - label: 金融科技基础设施
          detail: 面向银行和金融科技公司的 API 驱动支付、身份和经同意的数据服务。
          modules:
            - UPI / Bharat Connect 轨道
            - Aadhaar / PAN / 银行验证
            - Account Aggregator 网关
            - SignalIQ 监控
          outputs:
            - 合作伙伴数周内上线
        - label: 发卡与用户互动
          detail: 将平台能力扩展到受理之外的储值、奖励和发卡模块。
          modules:
            - Qwikcilver / Woohoo
            - Brand Wallet
            - Credit+
            - 项目管理
          outputs:
            - 闭环、半闭环、开环工具
        - label: 智能、安全与合规
          detail: 支撑其他层的共享数据、反欺诈、AI 和控制堆栈。
          modules:
            - AI/ML 和分析
            - 欺诈和异常检测
            - PCI-DSS / ISO 27001 / SOC 2
            - P2PE 和 KYC 或 AML 控制
          outputs:
            - 开发者优先但受监管的运营模式
        - label: 商户运营与支持
          detail: 部署后，运营工具维持庞大的已安装设备和支付机队正常运行。
          modules:
            - 机队健康监控
            - 远程配置和故障排查
            - 商户管理生命周期
            - 对账与争议处理
          outputs:
            - 在规模化运营中减少人工操作
    approximationNotes: 分层是根据公司披露和独立模块描述综合整理而来，并非来自一张标明精确服务边界的公开工程图。
