  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界：商业基础设施，而不只是终端
        blocks:
          - type: paragraph
            body: >-
              Pine Labs 所处的相关市场远不止线下刷卡硬件。公司在 2025-26
              年报中称，业务起步于支付受理，随后增加了分期与优惠、EMI、优惠活动、忠诚度、发卡、预付卡、线上支付、交易处理和金融科技基础设施；TechCrunch 则单独描述称，约 70%
              的收入已经来自数字基础设施和交易服务，而不是发卡与收单层。 因此，本章应把 Pine Labs
              视为服务商户、银行、品牌和金融科技流程的商户商业基础设施平台，同时排除不依赖其支付和商业基础设施的通用商户软件及纯消费金融类别。
            claimRefs:
