        - label: 通过银行、品牌和大型商户获客
          actor: 金融机构、消费品牌和核心商户
          touchpoints:
            - 机构和企业关系为商户拓展打下基础。
            - 已点名的当前或持续性案例包括 Croma 和与 Amazon 相关的发卡业务。
        - label: 接入结账和后台工作流
          actor: 商户运营与财务团队
          touchpoints:
            - 支付受理接入计费、ERP、CRM、对账和订单工作流。
            - 开放 API 和商户应用进一步提高运营依赖。
        - label: 规模化处理线下和线上交易
          actor: 商户和终端客户
          touchpoints:
            - 超过 11 lakh 个商户和 20 lakh+ 个结账点支撑日常使用。
            - 交易结构高度偏向 UPI，说明客户频繁复用，而不只是试点使用。
        - label: 交叉销售分期、预付和客户互动产品
