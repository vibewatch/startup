      - number: '3.3'
        title: 转换成本、锁定与多归属风险
        blocks:
          - type: paragraph
            body: >-
              Pine Labs 深度嵌入核心基础设施的场景，转换成本看起来最高。管理层称银行和商户都运行在其系统上，更换供应商可能需要迁移整个系统记录层（CP005）。同一份文件还称，一次账单或 ERP
              集成就能替代多个收单关系，同时处理路由、处理、结算和对账。一名独立分析师则认为，长期终端关系和集成复杂度让企业替换在运营上具有风险（CP005）。公司和第三方证据合在一起，支持一个高置信度结论：对深度集成的企业或银行部署而言，替换
              Pine Labs 明显比替换一个商户使用的普通结账功能更难。

              锁定程度取决于细分市场。小型线上商户可以启用支付链接或另一家网关，而不必替换完整的 ERP、收单和对账栈。支付链接既被描述为行业通用的低基础设施方案，也被描述为 Pine Labs
              的能力（CP006、CP012）。商户还可以把不同交易类型分配给不同供应商。因此，即使 Pine Labs
              仍是店内、预付卡或分期优惠的主要供应商，线上结账和小商户群的多归属仍是可信的反向压力。本轮材料没有量化单归属商户数量、交易路由如何分配，或折扣是否能让商户在不更换主要部署的情况下转移交易量。

              分期优惠网络可以形成第二种黏性来源，因为一次商户集成能接入多个品牌和放款方的优惠（CP008）。但现有证据不能证明排他性：放款方和品牌可以与多家编排服务商合作，商户也能保留另一家网关或收单机构。因此，护城河更适合理解为不断提高集成和协调成本，而不是合同性排他。TP003
              将每种拟议的转换机制、支持它的证据和可能削弱它的反向压力分开列示。这一区分很重要：已安装的终端可以带来分发优势，却不能保证独占交易份额。
