  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争框架与同行类别
        blocks:
          - type: paragraph
            body: >-
              Pine Labs 面对的不是一组边界清晰的同行。其产品覆盖面与 Razorpay、PayU、Cashfree、Stripe 和 Instamojo 等线上网关及商户支付平台重叠，也与 Paytm、PhonePe
              等消费者主导的支付生态重叠；银行、收单机构、处理商和软件伙伴也能拼出竞争性的商户技术栈。两份独立比较页面描述了一个已有多家竞争者提供广泛支付方式覆盖、开发者集成、定期付款、支付链接和商户工具的市场（CP001）。一份较早的生态概览列出了同一大类网关替代者，但没有提供可匹配的运营基准（CP001）。这能证明商户有选择，不代表某一家供应商已经赢下所有细分市场。

              这些比较也暴露出一个重要的方法限制。Value For Startups 给 Stripe、Razorpay、PayU、Cashfree、PhonePe、Paytm 和 Instamojo
              打出较高的主观可扩展性分数，但其表格没有按同一维度给 Pine Labs 评分（CP002）。Markhub24 则单独把 Pine Labs
              描述为商户解决方案组合最广的平台，但没有用共同商户群、合同价格、实施投入或实际支付成功率检验这一说法（CP002）。因此，证据支持的是差异化覆盖面，不是总体排名。

              实际分层应按购买问题来做。线上优先商户可以优先考虑 API 质量、支付方式覆盖、启用速度和透明的网关费用。消费者生态竞争者可以借助钱包或 UPI
              分发进入商户受理。企业零售商和银行则可能需要在一次部署中同时获得设备管理、收单连接、结算、对账、分期活动、储值和监管基础设施。与其做一张总榜，Pine Labs 更适合按产品和客户群逐一对比竞争者。TP001
              列出了保留的独立比较中出现的每个竞争者及内部自建替代方案，FP001 则明确了本章的定性定位假设。
            claimRefs:
              - CP001
              - CP002
              - CP003
