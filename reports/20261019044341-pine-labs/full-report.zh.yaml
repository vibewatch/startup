          - type: paragraph
            body: >
              Pine Labs 的客户关系看起来有黏性，因为公司嵌入商户账单、对账、ERP、CRM 和优惠工作流，当前材料也强调一旦成为系统记录层，迁移就会产生摩擦。不过，现有证据没有公布
              NRR、GRR、续约率、合同期限或按细分市场拆分的流失率，因此韧性仍是从工作流深度推断，而不是直接测量。年报也说明客户基础在经济和地域上都较为分散，但没有针对本章范围公布头部客户收入集中度。因此，风险信号仍是定性的：公司披露了客户不满和投诉带来的声誉风险，也称存在日常经营中的诉讼和程序，但这些不能替代硬性的客户群数据。
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 风险排序
        blocks:
          - type: paragraph
            body: >-
              公开证据中置信度最高的下行风险是外部规则暴露，而不是市场需求崩塌。Pine Labs 已面临一项已披露的 GST
              追缴，并在印度、新加坡和马来西亚运营着密集的牌照体系，因此即使商户需求保持健康，监管摩擦也可能影响现金、治理观感和产品推进速度。第二大风险是对合作伙伴经济性的依赖：管理层把 Pine Labs
              定位为嵌入银行、商户和品牌工作流的基础设施，这有助于留存，但也让变现暴露于卡组织、银行和 UPI
              的定价决策。第三，近期盈利是真实的，但还没有经过充分时间验证；独立摘要和市场数据页面仍指向应收账款和借款成本压力，因此一个好年份还不能等同于模型已经去风险。
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR010
              - CR011
              - CR012
