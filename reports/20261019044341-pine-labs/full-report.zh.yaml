      - number: '2.3'
        title: 低渗透率有利于采用，但变现仍取决于信任与监管
        blocks:
          - type: paragraph
            body: >-
              公开证据仍支持印度商户数字化有较长增长跑道。Redseer 称，FY2024 只有约 11% 的商户使用数字结账点，尽管约 75% 已具备数字化能力；ET BFSI 表示，Pine Labs
              新增部署越来越偏向支付渗透率仍较低的中小商户。这对需求是积极信号，尤其是在 UPI、线上结账和分期优惠继续扩张的情况下。反面因素是，这个市场奖励可信赖的系统记录型基础设施，也会随政策变化。Pine Labs
              年报和合规页面强调牌照、认证和面向商户的安全能力；ET BFSI 则指出，符合条件的 P2M 交易若收取 0.4%
              MDR，将有助于变现。换句话说，如果监管、合规成本或工作流集成摩擦朝不利方向变化，采用速度可能快于经济效益改善。
            claimRefs:
              - CM012
              - CM013
              - CM014
              - CM015
