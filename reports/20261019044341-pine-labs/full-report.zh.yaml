  - id: FV001
    title: 投资建议逻辑
    type: flow
    summary: 该建议沿着“运营证明—估值纪律—剩余待验证事项”的链条展开。
    data:
      nodes:
        - id: scale
          label: 规模证明
          value: $194bn GTV; 11 lakh+ merchants
          note: FY2025-26 年报指标。
          tone: positive
        - id: monetisation
          label: 变现证明
          value: INR 2,711 crore revenue; INR 559 crore adj. EBITDA; INR 113 crore PAT
          note: 留存申报文件显示的首个完整盈利年度。
          tone: positive
        - id: moat
          label: 平台护城河
          value: Integrated payments + prepaid + acquiring + API stack
          note: 官方网站、年报和 TNGlobal 均提供支持。
          tone: positive
        - id: valuation
          label: 当前公开估值
          value: INR 18,909 crore market cap; 113x P/E
          note: 公开报价已经计入规模证明带来的故事。
          tone: neutral
        - id: overhang
          label: 未解风险
          value: Low ROE, capital intensity, incomplete overhang/cycle detail
          note: 目前不宜直接上调至“买入”的关键原因。
          tone: risk
        - id: decision
          label: 投资建议
          value: Track / fair / high risk / medium confidence
          note: 只有拿出更多证明或出现更好的价格，买入逻辑才会改善。
          tone: neutral
      edges:
        - from: scale
          to: monetisation
          label: 规模终于转化为利润和现金。
        - from: monetisation
          to: moat
          label: 集成式技术栈解释了变现为何还能进一步深化。
        - from: moat
          to: valuation
          label: 市场已经为这套平台叙事的一大部分定价。
        - from: valuation
          to: overhang
          label: 更高的定价让披露和执行缺口变得更加重要。
        - from: overhang
          to: decision
          label: 在待验证事项收紧前，维持跟踪评级。
    approximationNotes: 该流程是分析顺序，不是比例或统计模型。
