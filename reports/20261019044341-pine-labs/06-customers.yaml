chapter:
  number: 6
  title: "Customers"
  summary: "Pine Labs has real scaled customer reach across merchants, brands, and financial institutions, with FY2025-26 disclosures pointing to roughly 11 lakh merchants and more than 20 lakh digital checkout points. The strongest adoption proof is platform breadth and a few durable named relationships such as Croma and Amazon-linked issuing, while the weakest area is durability transparency: public materials still do not disclose retention cohorts, renewal rates, or customer concentration by revenue."
sections:
  - id: "customer-base-mix"
    title: "Customer base spans merchants, brands, and financial institutions"
    body: >
      Pine Labs' retained current evidence supports a broad three-sided customer base rather than a single
      merchant-only motion. The FY2025-26 annual report and current broker coverage both frame the platform as
      serving merchants on acceptance and software workflows, brands and enterprises on affordability, prepaid,
      and engagement programs, and financial institutions on issuing, acquiring, and infrastructure rails. The
      key implication is that customer value is partly strategic rather than purely transactional: Pine Labs is
      trying to be embedded into systems of record and daily checkout workflows, not just to process a one-off
      payment event. That said, public disclosures remain much stronger on aggregate counts than on revenue mix
      or cohort economics by segment, so the segmentation is directionally credible but not yet fully
      monetization-attributed.
    claimRefs:
      - "CU001"
      - "CU002"
      - "CU003"
      - "CU004"
      - "CU005"
    tableRefs:
      - "TU001"
    figureRefs:
      - "FU001"
  - id: "adoption-and-expansion"
    title: "Adoption proof is scale plus visible expansion into new channels"
    body: >
      The best proof of real adoption is recent operating scale, not customer logos alone. Pine Labs'
      FY2025-26 annual report said the platform served more than 11 lakh merchants and over 20 lakh digital
      checkout points, while a later quarterly update cited by Storyboard18 raised those figures to 11.5 lakh
      merchants and 21.7 lakh checkout points and said more than 70% of transactions were already flowing
      through UPI. Expansion is also visible in channel mix: the company said it broadened merchant reach across
      D2C, government, SMB, and quick-commerce, while Storyboard18 reported more than 40 online merchants added
      in the quarter plus meaningful Shopflo checkout volume. The caveat is that none of the retained sources
      disclose how many of these merchants are high-volume production accounts versus smaller or newer
      deployments.
    claimRefs:
      - "CU001"
      - "CU005"
      - "CU006"
      - "CU007"
      - "CU015"
    tableRefs:
      - "TU002"
  - id: "named-proof-and-reference-quality"
    title: "Named account proof exists, but current independent references are still thin"
    body: >
      Pine Labs has some usable named-customer proof, but it is uneven in freshness and quality. Motilal Oswal
      gives the cleanest recent named evidence by pointing to decade-long affordability relationships with
      Croma, LG, and HDFC Bank, and to Amazon-linked issuing partnerships in international markets. Historical
      ecosystem accounts from A Junior VC and Bastion Research add Shoppers Stop to the customer picture, but
      those examples are narrative and backward-looking rather than current deployment disclosures with dated
      outcome metrics. The result is enough evidence to support production-grade customer breadth, but not
      enough to prove renewal quality or account-level expansion economics with high precision.
    claimRefs:
      - "CU008"
      - "CU009"
      - "CU010"
    tableRefs:
      - "TU003"
  - id: "durability-and-concentration"
    title: "Durability is plausible, but public retention and concentration data remain a gap"
    body: >
      Pine Labs' customer relationships appear sticky because the company integrates into merchant billing,
      reconciliation, ERP, CRM, and offer workflows, and current materials emphasize migration friction once it
      becomes a system-of-record layer. Even so, the current retained evidence stops short of publishing NRR,
      GRR, renewal rates, contract duration, or churn by segment, which means durability is still inferred from
      workflow depth rather than directly measured. The annual report helps on concentration by stating the
      customer base is widely distributed economically and geographically, but it does not publish top-customer
      revenue concentration for this chapter's scope. Risk signals are therefore qualitative: the company
      discloses reputation exposure from customer dissatisfaction and complaints, and it says ordinary-course
      lawsuits and proceedings exist, but these do not substitute for hard cohort data.
    claimRefs:
      - "CU011"
      - "CU012"
      - "CU013"
      - "CU014"
