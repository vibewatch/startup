  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "retention-disclosure-gap"
      missingEvidence: "Segmented retention evidence such as NRR, GRR, logo churn, contract duration, renewal rates, or cohort curves by merchant and institutional account type."
      whyItMatters: "Without cohort data, durability is inferred from workflow depth and installed base rather than directly proven, which weakens underwriting of lifetime value and expansion assumptions."
      diligencePath: "Request a board-style customer metrics pack with retention cohorts by merchant size, online/offline channel, and institutional partner program."
      relatedQuestionRefs:
        - "QU007"
    - type: "enumeration-incomplete"
      severity: "material"
      topic: "named-customer-proof"
      missingEvidence: "Fresh independent customer references with go-live dates, production scope, and measurable outcomes for current flagship accounts."
      whyItMatters: "Named customer proof is one of the cleanest ways to separate marketing logos from live production deployment and durable reference quality."
      diligencePath: "Obtain three to five current customer references across merchant, brand, and financial-institution cohorts plus recent public procurement or case-study support."
      relatedTableRefs:
        - "TU003"
    - type: "missing-source"
      severity: "material"
      topic: "customer-concentration"
      missingEvidence: "Top-customer and top-partner concentration by revenue, GTV, or gross profit, including any exposure to specific banks, brands, or large retail chains."
      whyItMatters: "Breadth of account count does not prove breadth of economic dependence, so concentration risk could still be meaningful even with a large installed merchant base."
      diligencePath: "Request internal concentration schedules and compare them against partner, segment, and geography growth plans before underwriting long-term durability."
