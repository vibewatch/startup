  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product surface and module map
        blocks:
          - type: paragraph
            body: >-
              Pine Labs' current product surface is broad enough that the company is better described as a
              merchant-commerce operating system than as a single POS provider. In its FY2025-26 annual report,
              management explicitly groups the stack into in-store and online infrastructure, affordability and
              transaction processing, fintech infrastructure, and issuing and acquiring. Independent summaries in the
              assigned pool line up with that framing and add the practical module map: Plutus Smart PoS and Mosambee
              for offline acceptance, Plural for online checkout, Qwikcilver and Fave for gift, rewards, and engagement,
              Setu for API-led infrastructure, QFix for digital collections, and Credit+ for issuing and acquiring. That
              breadth matters because Pine Labs can stay inside the same merchant or banking relationship across
              acceptance, settlement, rewards, financing, and issuance rather than monetizing only the first device
              installation.
            claimRefs:
              - CE001
              - CE005
              - CE006
              - CE010
              - CE013
