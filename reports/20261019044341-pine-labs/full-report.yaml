      - number: '4.2'
        title: Margin structure and delivery economics
        blocks:
          - type: paragraph
            body: >-
              FY26 was the first year Pine Labs' scale clearly translated into reported profitability: revenue grew 19%,
              adjusted EBITDA rose 57% to ₹559 crore, and PAT swung to ₹113 crore from a prior-year loss. The annual
              report frames that inflection as operating leverage, and the unit economics table supports that direction:
              overall contribution margin stayed around 75%, with DITP much richer than the more distribution-heavy
              issuing/acquiring business. Even so, the Q1 FY27 snapshot shows why investors should not annualize the
              FY26 profit turn without caution. Revenue still grew 20% year on year, but adjusted EBITDA margin was only
              17.1%, and independent earnings summaries pointed to lower-margin segment mix, higher cloud/network spend,
              declining take rates, and the absence of specific FY27 EBITDA guidance. Public GTM proxies also show
              front-loaded investment: Pine Labs added about 500 salespeople over six months, with management saying
              those hires typically take 6 to 12 months to reach full productivity. That is consistent with a company
              still buying growth and cross-sell depth rather than harvesting a fully mature revenue base.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI009
              - CI010
              - CI011
              - CI012
              - CI013
      - number: '4.3'
        title: Capital adequacy and remaining underwriting blockers
        blocks:
          - type: paragraph
            body: >-
              Headline balance-sheet liquidity looks large, but not all of it is discretionary. Pine Labs reported
              ₹1,393.08 crore of cash and cash equivalents, ₹5,569.74 crore of earmarked bank balances, and ₹1,339.27
              crore of longer-duration bank deposits as of 31 March 2026; the filing says the earmarked accounts fund
              merchant settlements and cannot be used for general purposes. The company also received ₹2,080 crore of
              fresh IPO proceeds and said steady-state working capital should run in the 13-15% range of revenue. That
              is manageable for a scaled listed operator but still meaningful because settlement timing and restricted
              balances are central to liquidity in a payments business. The deeper blocker is earnings quality rather
              than headline liquidity. Pine Labs estimates breakage revenue from historical redemption patterns, and an
              appellate process remains open around a ₹13.37 crore breakage-related service-tax demand after GST Council
              clarification. Combined with the lack of public CAC/payback, cohort retention, customer concentration, and
              post-IPO balance-release detail, that leaves this chapter at a "credible but not yet fully underwritable"
              verdict.
