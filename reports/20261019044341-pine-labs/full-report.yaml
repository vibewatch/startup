  - id: TR003
    title: Partner / dependency risk register
    columns:
      - Dependency
      - Public evidence
      - Concentration signal
      - Failure scenario
      - Severity
      - Mitigation
      - Residual exposure
    rows:
      - - Banks, schemes, and regulated money-movement rails
        - Company language frames Pine Labs as system-of-record infrastructure inside bank and merchant flows
        - Structural
        - Partner, scheme, or rule changes slow processing or reduce take-rates
        - High
        - Embedded workflows and multiple licences create switching friction
        - Economics and approvals still sit partly outside Pine Labs' control
      - - Lender and promotional-offer ecosystem
        - Affordability growth depends on lender participation and offer economics even if Pine takes no credit risk
        - Moderate
        - Lender pullback or weaker consumer demand reduces cross-sell and checkout conversion
        - Medium
        - No direct consumer credit exposure limits balance-sheet downside
        - Volume and monetisation can still fall if partners retrench
      - - International localisation and local partners
        - More than 22 countries requires local compliance, distribution, and operating partners
        - Moderate
        - Rollouts underperform or consume capital without matching margin contribution
        - Medium
        - Existing multi-market footprint and product breadth
        - Cross-border growth is not yet proven as consistently high-return
      - - Working-capital and external-capital discipline
        - Independent market-data page flags 156 debtor days and high borrowing cost
        - Moderate
        - Cash conversion stays weak even if accounting profit improves
        - Medium
        - Recent profitability and no direct consumer credit risk
        - Public disclosures do not yet show business-line receivables quality or cost-of-funds sensitivity
    notes: >-
      Counterparty, distribution, and capital-provider rows are ranked from the public evidence available in the
      assigned pool; partner concentration is not quantified publicly.
