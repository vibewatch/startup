  - id: FE001
    title: Product architecture map
    type: stack
    summary: Pine Labs layers merchant checkout surfaces over orchestration, fintech APIs, issuing, and compliance controls.
    data:
      layers:
        - label: Merchant checkout surfaces
          detail: In-store, online, and omnichannel acceptance endpoints that merchants and consumers directly use.
          modules:
            - Plutus Smart PoS / Mosambee
            - Plural gateway
            - Payment links and payouts
            - Checkout EMI and offers
          outputs:
            - Cards, UPI, wallets, prepaid, pay-by-points
        - label: Merchant orchestration
          detail: Workflow layer that connects acceptance to settlement, reconciliation, and merchant operations.
          modules:
            - Routing and adaptive retry
            - Settlement and reconciliation
            - Billing / ERP integrations
            - Analytics and loyalty
          outputs:
            - Unified merchant interface
            - Multi-acquirer operations
        - label: Fintech infrastructure
          detail: API-led payment, identity, and consented-data services for banks and fintechs.
          modules:
            - UPI / Bharat Connect rails
            - Aadhaar / PAN / bank verification
            - Account Aggregator gateway
            - SignalIQ monitoring
          outputs:
            - Partner go-live in weeks
        - label: Issuing and engagement
          detail: Stored-value, rewards, and card-issuance modules that extend the platform beyond acceptance.
          modules:
            - Qwikcilver / Woohoo
            - Brand Wallet
            - Credit+
            - Program management
          outputs:
            - Closed-loop, semi-closed-loop, open-loop instruments
        - label: Intelligence, security, and compliance
          detail: Shared data, fraud, AI, and control stack underpinning the other layers.
          modules:
            - AI/ML and analytics
            - Fraud and anomaly detection
            - PCI-DSS / ISO 27001 / SOC 2
            - P2PE and KYC or AML controls
          outputs:
            - Developer-first but regulated operating model
        - label: Merchant operations and support
          detail: Operational tooling keeps large installed device and payment fleets functioning after deployment.
          modules:
            - Fleet health monitoring
            - Remote configuration and troubleshooting
            - Merchant management lifecycle
            - Reconciliation and dispute operations
          outputs:
            - Lower manual operations at scale
    approximationNotes: >-
      Layering is synthesized from company disclosures and independent module descriptions rather than from a published
      engineering diagram with exact service boundaries.
