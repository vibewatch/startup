      - number: '2.2'
        title: Sizing and buyer segmentation are best read as overlapping lenses
        blocks:
          - type: paragraph
            body: >-
              The best public sizing source in the assigned pool is a Pine Labs-hosted June 2025 Redseer industry
              report, and it should be read as a commissioned lens rather than an independent benchmark. That report
              estimates a ₹91 trillion FY2024 India opportunity for Pine Labs, with growth to ₹255-280 trillion by
              FY2029, while also breaking out adjacent rails such as P2M digital payments, online payments, UPI P2M, and
              retail consumption lending. These figures show real category breadth and growth, but they do not form a
              neat additive funnel because the same merchant may use multiple rails at once. On the buyer side, Pine
              Labs' own materials and third-party summaries point to a multi-sided market: enterprise retailers and SMEs
              buy acceptance and workflow tools, brands buy gift/prepaid and loyalty rails, banks and fintechs buy
              issuing, APIs, and transaction infrastructure, and end users show up mostly as indirect beneficiaries of
              credit, rewards, and smoother checkout.
            claimRefs:
