      - number: '2.3'
        title: Adoption should benefit from underpenetration, but monetization still depends on trust and regulation
        blocks:
          - type: paragraph
            body: >-
              Public evidence still supports long runway in Indian merchant digitization. Redseer says only about 11% of
              merchants used digital checkout points in FY2024 even though roughly 75% were already digitally enabled,
              and ET BFSI says Pine Labs' incremental deployment is increasingly skewing toward small and mid-sized
              merchants where payment penetration remains relatively low. That is constructive for demand, especially as
              UPI, online checkout, and affordability continue to expand. The counterweight is that this market rewards
              trusted system-of-record infrastructure and can change with policy. Pine Labs' annual report and
              compliance pages emphasize licences, certifications, and merchant-facing security posture, while ET BFSI
              notes that a 0.4% MDR on eligible P2M transactions would help monetization. In other words, adoption can
              grow faster than economics if regulation, compliance cost, or workflow-integration friction move the wrong
              way.
