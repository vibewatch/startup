  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: 'Market boundary: commerce infrastructure, not just terminals'
        blocks:
          - type: paragraph
            body: >-
              Pine Labs' relevant market is broader than offline card-acceptance hardware. In its 2025-26 annual report,
              the company says it started with payments acceptance and then added affordability, EMI, offers, loyalty,
              issuing, prepaid, online payments, transaction processing, and fintech infrastructure, while TechCrunch
              separately described about 70% of revenue as already coming from digital infrastructure and transaction
              services rather than the issuing-and-acquiring layer. That means the chapter should treat Pine Labs as a
              merchant-commerce infrastructure platform serving merchants, banks, brands, and fintech workflows, while
              excluding unrelated generic merchant software and pure consumer-finance categories that do not rely on its
              payment and commerce rails.
            claimRefs:
              - CM001
              - CM002
              - CM016
