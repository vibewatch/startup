      - CR005
      - CR006
      - CR009
      - CR011
  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Current read
      - Evidence anchor
      - Decision implication
    rows:
      - - Recommendation
        - track
        - FY2025-26 profitability inflection is real, but upside still depends on more proof.
        - Monitor rather than add aggressively at today's price.
      - - Confidence
        - medium
        - Public filings and current market data are strong, but cohort economics and overhang detail remain incomplete.
        - Wait for further disclosure before upgrading conviction.
      - - Risk rating
        - high
        - Execution, disclosure, and multiple-compression risk remain material despite the return to PAT profitability.
        - Underwrite only with downside discipline.
      - - Valuation stance
        - fair-to-demanding
        - >-
          INR 18,909 crore market cap is roughly 7.0x FY2025-26 revenue and the page shows a 113x P/E; the 2022 private
          mark is not directly comparable.
        - A better entry would need either a lower price or stronger proof points.
      - - Target return / hold / exit
        - Not supportable from the assigned evidence
        - No clean peer-comps set, investor return hurdle, or supportable exit multiple is available.
        - Do not manufacture a target; close the valuation-model gap first.
    notes: Analyst synthesis using current public-market markers, the FY2025-26 filing, and retained independent sources.
    claimRefs:
      - CV001
      - CV005
      - CV006
      - CV007
      - CV016
  - id: TV002
    title: Thesis / anti-thesis table
    columns:
      - Argument
      - Evidence
      - What would change the view
    rows:
      - - Integrated stack and regulatory depth
        - >-
          Licenses across India, Malaysia, and Singapore plus security/compliance credentials support platform trust and
          partner breadth.
        - >-
          Upgrade if disclosures show those capabilities lifting ROE and cash conversion rather than only expanding
          scope.
      - - Scale-to-profit inflection
        - FY2025-26 revenue, EBITDA, PAT, and operating cash flow all improved materially in the filing.
        - Upgrade if PAT and cash flow stay positive through the next reporting cycle.
      - - Capital-intensity drag
        - Independent research still highlights heavy depreciation from the terminal network and ongoing refresh burden.
        - Downgrade if margin gains reverse or DCP refresh again suppresses PAT and cash flow.
      - - Valuation and disclosure discipline
        - >-
          Current public valuation remains demanding relative to earnings, while overhang and cohort detail are still
          incomplete.
        - Upgrade only after tighter shareholding/capital-allocation disclosure or a better entry price.
    notes: Rows pair the strongest support for the long case with the specific evidence that would move the stance.
    claimRefs:
      - CV001
      - CV004
      - CV006
      - CV008
      - CV010
      - CV012
      - CV013
      - CV014
      - CV016
  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Assumptions
      - Valuation / return logic
      - Key risks
      - Probability signal
    rows:
      - - Bull
        - FY2025-26 profitability sustains, Singapore-led bundling scales, and M&A additions deepen online monetization.
        - >-
          Earnings growth lowers the current 113x P/E without price compression; no absolute target range is supportable
          until a clean comps set is obtained.
        - Profitability proves temporary, or cross-border expansion consumes capital faster than expected.
        - Needs at least two more clean reporting periods plus better overhang disclosure.
      - - Base
        - Revenue growth and monetization continue, but ROE improves only gradually and disclosure gaps remain.
        - >-
          Operating gains are absorbed by multiple normalization around the INR 164 current quote, supporting a fair
          rather than clearly attractive entry stance.
        - Multiple compression can offset operating progress if the market wants clearer return metrics.
        - Most consistent with current evidence.
      - - Bear
        - PAT or cash generation slips, or the market re-focuses on low ROE, debtor days, and capital-intensity risk.
        - >-
          The 113x P/E compresses and the price falls below the INR 164 current quote; the assigned evidence does not
          support a precise downside floor.
        - Loss of confidence in the profit inflection or governance/overhang surprises.
        - Would become more likely if upcoming filings weaken cash conversion or regional traction.
    notes: >-
      Scenarios use the 19 October 2026 public quote and operating signals; precise valuation ranges remain a documented
      gap because the retained pool lacks a clean peer-comps pack.
    claimRefs:
      - CV001
      - CV006
      - CV010
      - CV013
      - CV014
      - CV015
      - CV016
