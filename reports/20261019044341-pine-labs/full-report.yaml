            claimRefs:
              - CU008
              - CU009
              - CU010
      - number: '6.4'
        title: Durability is plausible, but public retention and concentration data remain a gap
        blocks:
          - type: paragraph
            body: >
              Pine Labs' customer relationships appear sticky because the company integrates into merchant billing,
              reconciliation, ERP, CRM, and offer workflows, and current materials emphasize migration friction once it
              becomes a system-of-record layer. Even so, the current retained evidence stops short of publishing NRR,
              GRR, renewal rates, contract duration, or churn by segment, which means durability is still inferred from
              workflow depth rather than directly measured. The annual report helps on concentration by stating the
              customer base is widely distributed economically and geographically, but it does not publish top-customer
              revenue concentration for this chapter's scope. Risk signals are therefore qualitative: the company
              discloses reputation exposure from customer dissatisfaction and complaints, and it says ordinary-course
              lawsuits and proceedings exist, but these do not substitute for hard cohort data.
            claimRefs:
              - CU011
              - CU012
              - CU013
              - CU014
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Ranked risk view
        blocks:
          - type: paragraph
            body: >-
              The highest-confidence downside in public evidence is external-rule exposure rather than market-demand
              collapse. Pine Labs already faces a disclosed GST demand and operates across a dense licence stack in
              India, Singapore, and Malaysia, so regulatory friction can affect cash, governance perception, and product
              velocity even if merchant demand remains healthy. The second major risk is partner-economics dependence:
              management positions Pine Labs as infrastructure inside bank, merchant, and brand workflows, which helps
              retention but also leaves monetisation exposed to card-scheme, bank, and UPI pricing decisions. Third,
              recent profitability is real but not yet seasoned; independent summaries and market-data pages still point
              to receivables and borrowing-cost pressure, which means one good year is not yet the same thing as a
              de-risked model.
            claimRefs:
              - CR001
              - CR002
              - CR004
              - CR010
              - CR011
              - CR012
