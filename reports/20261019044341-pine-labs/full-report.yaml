      - number: '5.2'
        title: Architecture, deployment, and workflow integration
        blocks:
          - type: paragraph
            body: >-
              The best-supported technical claim is not proprietary hardware but workflow integration. Pine Labs says a
              single cloud-based integration into billing and ERP software can replace multiple acquirer relationships
              and manage routing, processing, settlement, and reconciliation across cards, UPI, wallets, prepaid
              instruments, and loyalty balances. The annual report's platform section then shows how that operating
              model scales: a cloud-native foundation feeds core payments, issuing, settlements, and reconciliation,
              with Setu, SDK, and developer-console layers on top, and AI, fraud, analytics, and compliance layers above
              that. The company also discloses 1,100+ billing-system integrations, 400+ third-party app integrations,
              remote fleet management, and MCP-based go-live acceleration, which together indicate that implementation
              velocity and interoperability are central to the product proposition.
            claimRefs:
              - CE002
              - CE003
              - CE005
              - CE007
              - CE008
              - CE014
