      - number: '6.2'
        title: Adoption proof is scale plus visible expansion into new channels
        blocks:
          - type: paragraph
            body: >
              The best proof of real adoption is recent operating scale, not customer logos alone. Pine Labs' FY2025-26
              annual report said the platform served more than 11 lakh merchants and over 20 lakh digital checkout
              points, while a later quarterly update cited by Storyboard18 raised those figures to 11.5 lakh merchants
              and 21.7 lakh checkout points and said more than 70% of transactions were already flowing through UPI.
              Expansion is also visible in channel mix: the company said it broadened merchant reach across D2C,
              government, SMB, and quick-commerce, while Storyboard18 reported more than 40 online merchants added in
              the quarter plus meaningful Shopflo checkout volume. The caveat is that none of the retained sources
              disclose how many of these merchants are high-volume production accounts versus smaller or newer
              deployments.
            claimRefs:
              - CU001
              - CU005
              - CU006
              - CU007
              - CU015
          - type: table
