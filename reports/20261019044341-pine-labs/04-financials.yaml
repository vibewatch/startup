    - type: private-evidence-only
      severity: material
      topic: pricing-realization
      missingEvidence: Realized pricing waterfalls, discounting, and take-rate splits for subscriptions, processing, prepaid distribution, and fintech infrastructure.
      whyItMatters: Blended monetization units show that the model works, but they do not show how much revenue quality comes from durable pricing power versus product or customer mix.
      diligencePath: Request product-by-product realized pricing, margin waterfalls, and the share of revenue under contracted versus variable pricing terms.
      relatedTableRefs: [TI002]
    - type: missing-source
      severity: material
