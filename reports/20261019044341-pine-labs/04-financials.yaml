      missingEvidence: Reconciliation of cash and non-earmarked deposits into unrestricted corporate liquidity, settlement-float obligations, working-capital-facility usage, and subsequent deployment of IPO proceeds.
      whyItMatters: Headline liquidity looks strong, but payments businesses can carry operationally restricted cash that is less useful for discretionary reinvestment or downside protection.
      diligencePath: Reconcile bank-balance categories, settlement obligations, and debt/facility utilisation from treasury schedules and quarterly filings.
