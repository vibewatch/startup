evidenceGaps:
  - type: missing-source
    severity: material
    topic: shareholding-concentration
    missingEvidence: >-
      Current post-IPO shareholding disclosures showing free float, sponsor stakes, and any remaining strategic or PE
      concentration.
    whyItMatters: >-
      Ownership concentration and overhang risk affect governance leverage, valuation support, and any near-term exit
      pressure.
    diligencePath: >-
      Review the latest annual report, exchange shareholding filings, and registrar disclosures for current holder
      concentrations.
    relatedQuestionRefs:
      - QO009
    relatedTableRefs:
      - TO002
      - TO003
  - type: conflicting-data
    severity: material
    topic: merchant-scale
    missingEvidence: >-
      A primary-source bridge reconciling the merchant definition used in the FY26 results with the lower scale figure
      used by Capital.com.
    whyItMatters: Customer-count consistency is a core cover metric that later market, customer, and valuation chapters will reuse.
    diligencePath: >-
      Tie the latest annual-report glossary and KPI notes to management commentary before carrying forward one
      merchant-count figure.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
      - TO003
  - type: conflicting-data
    severity: minor
    topic: headcount
    missingEvidence: A current primary-source employee count from Pine Labs' post-IPO disclosures.
    whyItMatters: Headcount is a core cover metric and a useful operating-leverage cross-check against FY26 profitability.
    diligencePath: >-
      Pull headcount from the latest annual report or another current statutory filing instead of relying on third-party
      snapshots.
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: debt-and-credit
    missingEvidence: Current debt, borrowing, and credit-facility detail by instrument after the listing.
    whyItMatters: >-
      Capital-structure obligations shape valuation downside and determine how much FY26 cash generation is actually
      discretionary.
    diligencePath: Review FY26 annual-report debt notes, IPO-proceeds deployment disclosures, and any lender-specific filings.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: market-sizing
    missingEvidence: Pine Labs does not publicly break out a clean current SAM or SOM by rail, segment, and geography.
    whyItMatters: >-
      A valuation case can look stronger or weaker depending on whether investors underwrite one additive TAM or several
      overlapping rails.
    diligencePath: >-
      Request DRHP or management disclosures that isolate revenue, TPV, and customer mix by acceptance, affordability,
      prepaid, issuing, and fintech infrastructure.
    relatedQuestionRefs:
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: minor
    topic: buyer-budget-owner
    missingEvidence: >-
      Public sources describe buyer, user, and payer roles qualitatively but do not quantify budget ownership by
      merchant segment.
    whyItMatters: >-
      Sales-cycle length and adoption timing differ if the budget sits with merchant owners, payments operations,
      product teams, or brand marketers.
    diligencePath: >-
      Ask management or channel partners for segment-level ACV, contract-owner, and deployment-cycle data across
      enterprise, SMB, issuer, and brand accounts.
    relatedQuestionRefs:
      - QM003
      - QM008
  - type: private-evidence-only
    severity: material
    topic: competitor-pricing
    missingEvidence: >-
      Matched merchant contracts, renewal quotes, net effective take rates, discount schedules, and implementation
      charges for Pine Labs and its principal rivals.
    whyItMatters: Without matched commercial terms, price leadership, bundling value, and margin durability cannot be underwritten.
    diligencePath: >-
      Obtain anonymised current contracts and renewal proposals for at least three comparable enterprise and mid-market
      merchants.
    relatedQuestionRefs:
      - QP002
      - QP003
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: merchant-retention
    missingEvidence: >-
      Merchant churn, gross revenue retention, product attach, multi-homing, transaction-share, and win-loss data by
      merchant cohort.
    whyItMatters: >-
      The economic strength of claimed switching and network effects cannot be quantified without observed customer
      behaviour.
    diligencePath: >-
      Request eight quarters of cohort retention, products per merchant, routing share, renewal history, and reasons for
      churn.
    relatedQuestionRefs:
      - QP004
      - QP006
    relatedTableRefs:
      - TP003
  - type: missing-source
    severity: material
    topic: customer-proof
    missingEvidence: >-
      Merchant, bank, brand, and former-customer references comparing implementation, reconciliation, support,
      affordability conversion, and switching friction.
    whyItMatters: Company-issued integration claims and secondary market maps lack customer-side confirmation.
    diligencePath: >-
      Conduct at least five reference calls spanning enterprise retail, online commerce, a bank partner, a brand, and a
      former customer.
    relatedQuestionRefs:
      - QP002
      - QP004
      - QP005
  - type: missing-source
    severity: material
    topic: performance-benchmark
    missingEvidence: >-
      A neutral matched-cohort benchmark of payment-success rates, uptime, settlement accuracy, support resolution, and
      migration cost.
    whyItMatters: Reliability and service differentiation remain asserted rather than measured against alternatives.
    diligencePath: >-
      Commission or obtain a benchmark using the same payment modes, geographies, merchant sizes, and observation
      period.
    relatedQuestionRefs:
      - QP002
      - QP006
    relatedTableRefs:
      - TP002
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Public CAC, payback, quota attainment, and cohort retention by offline, online, and bank-partner sales motions.
    whyItMatters: >-
      Without these metrics, investors cannot test whether new sales hiring or cross-sell depth is compounding value
      faster than margin dilution and take-rate pressure.
    diligencePath: Request cohort CAC/payback, merchant retention, attach rates, and sales-ramp dashboards from management.
    relatedQuestionRefs:
      - QI008
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing-realization
    missingEvidence: >-
      Realized pricing waterfalls, discounting, and take-rate splits for subscriptions, processing, prepaid
      distribution, and fintech infrastructure.
    whyItMatters: >-
      Blended monetization units show that the model works, but they do not show how much revenue quality comes from
      durable pricing power versus product or customer mix.
    diligencePath: >-
      Request product-by-product realized pricing, margin waterfalls, and the share of revenue under contracted versus
      variable pricing terms.
    relatedTableRefs:
      - TI002
  - type: missing-source
    severity: material
    topic: balance-sheet-usage
    missingEvidence: >-
      Reconciliation of cash and non-earmarked deposits into unrestricted corporate liquidity, settlement-float
      obligations, working-capital-facility usage, and subsequent deployment of IPO proceeds.
    whyItMatters: >-
      Headline liquidity looks strong, but payments businesses can carry operationally restricted cash that is less
      useful for discretionary reinvestment or downside protection.
    diligencePath: >-
      Reconcile bank-balance categories, settlement obligations, and debt/facility utilisation from treasury schedules
      and quarterly filings.
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: Public GitHub, package-registry, API forum, or engineering-community telemetry tied to Pine Labs, Setu, or Plural.
