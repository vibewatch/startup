      sales-led deployments and acquired distribution.
    diligencePath: >-
      Request developer-portal analytics, named reference integrations, release history, and any public SDK or package
      telemetry from engineering leadership.
    relatedQuestionRefs:
      - QE008
  - type: private-evidence-only
    severity: material
    topic: reliability-benchmarks
    missingEvidence: External uptime, authorization-rate, incident, and fraud-loss metrics by module or merchant cohort.
