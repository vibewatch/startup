    topic: comparable-valuation-set
    missingEvidence: >-
      A current, like-for-like public-company or transaction-comps set with matched revenue, earnings, growth, and
      enterprise-value definitions.
    whyItMatters: >-
      Without comparable denominators and forecast periods, an absolute valuation range, target return, hold period, and
      exit multiple would be false precision.
    diligencePath: >-
      Build a current peer set from exchange filings and consensus estimates, reconcile enterprise value and earnings
      definitions, and apply an investor-specific return hurdle.
