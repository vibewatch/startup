evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: governance
    missingEvidence: >-
      A current board roster with committee structure, observer rights, and any side-letter governance terms for major
      investors.
    whyItMatters: >-
      The filing makes founder voting control visible, but public sources still do not fully show how operating
      governance and minority-investor protections work in practice.
    diligencePath: >-
      Request the latest board and committee roster, shareholder-rights summary, and any investor-information-rights
      schedules from management or lead investors.
    relatedQuestionRefs:
      - QO005
      - QO007
      - QO025
    relatedTableRefs:
      - TO002
      - TO003
  - type: private-evidence-only
    severity: material
    topic: headcount
    missingEvidence: A clean current total employee count, geography split, and post-IPO hiring plan by function.
    whyItMatters: >-
      The filing reveals R&D headcount and percentage share, but not a simple company-wide current headcount that can be
      compared cleanly with peers or prior media claims.
    diligencePath: Request an employee census or HR summary by region and function as of the latest month-end.
    relatedQuestionRefs:
      - QO017
      - QO025
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: customer-count-definition
    missingEvidence: >-
      A reconciled explanation of how the filing's 800-plus contracted customers relates to the year-end recap's
      1,200-plus customer count.
    whyItMatters: >-
      A headline customer number affects judgments about market penetration, channel leverage, and repeatability, but
      the public record appears to mix at least two scopes.
    diligencePath: >-
      Ask management to define contracted customers, end-customer sites, and broader customer ecosystem counts using one
      dated KPI bridge.
    relatedQuestionRefs:
      - QO016
      - QO025
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: valuation-pricing
    missingEvidence: >-
      A current cap table, the exact Series E or pre-IPO valuation history, and any formal IPO price range or
      cornerstone process details.
    whyItMatters: >-
      Late-stage media gives a useful valuation signal, but final underwriting needs the actual private marks and the
      public listing range rather than a single narrative number.
    diligencePath: >-
      Request financing history by round and instrument plus the latest IPO draft materials or banker guidance, then
      reconcile those with the application proof.
    relatedQuestionRefs:
      - QO011
      - QO012
      - QO025
    relatedTableRefs:
      - TO001
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: TO004-milestones
    missingEvidence: >-
      A company-verified complete chronology of financing-close dates, regional office openings, and every major
      product-release day-level timestamp.
    whyItMatters: >-
      The milestone table is intentionally partial and month-level in places, so readers should not treat it as an
      exhaustive legal chronology of record.
    diligencePath: >-
      Request a dated corporate milestone log from management or the IPO data room and reconcile it to the public filing
      and press archive.
    relatedQuestionRefs:
      - QO022
      - QO025
    relatedTableRefs:
      - TO004
  - type: private-evidence-only
    severity: material
    topic: forward-som-model
    missingEvidence: >-
      Comparable current contract pricing, ASPs, or commercial terms by deployment type across Hai and the main
      substitute architectures.
    whyItMatters: >-
      Without pricing or unit-economics evidence, any forward SOM forecast would look more precise than the public
      evidence allows.
    diligencePath: >-
      Request customer proposals or integrator quotes for 2025-2026 ACR, cube-storage, and robots-to-goods deployments,
      then rebuild the SOM lens with current pricing.
    relatedQuestionRefs:
      - QM024
      - QM025
  - type: missing-source
    severity: material
    topic: vertical-sam-split
    missingEvidence: A public split of Hai's bookings, installed base, or ASP by apparel, 3PL, retail, healthcare, and manufacturing.
    whyItMatters: >-
      The vertical fit thesis is strong, but the chapter cannot quantify how much of Hai's current or near-term revenue
      opportunity sits in each segment.
    diligencePath: >-
      Obtain management disclosure, integrator pipeline detail, or customer-reference counts by vertical to convert the
      segment map into a weighted SAM view.
    relatedQuestionRefs:
      - QM024
    relatedTableRefs:
      - TM003
      - TM005
  - type: missing-source
    severity: material
    topic: pricing-opacity
    missingEvidence: >-
      Apples-to-apples realized project pricing, discount ladders, financing terms, and payback ranges across Hai,
      AutoStore, Geek+, GreyOrange, Locus, and Quicktron.
    whyItMatters: >-
      Without realized economics, a differentiated architecture can still lose on hidden price, financing, or integrator
      discounting.
    diligencePath: >-
      Collect recent customer quotes or SI proposals by warehouse profile and normalize them into one TCO and payback
      model.
    relatedQuestionRefs:
      - QP018
      - QP025
    relatedTableRefs:
      - TP004
  - type: private-evidence-only
    severity: material
    topic: private-capital-disclosure
    missingEvidence: Current funding, balance-sheet capacity, and cash runway disclosures for GreyOrange, Locus, and Quicktron.
    whyItMatters: >-
      Competitive durability depends partly on how long rivals can subsidize deployment, service, and international
      expansion.
    diligencePath: >-
      Request management's current competitor intelligence pack or obtain direct market-database access for latest
      private funding and debt signals.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP002
  - type: missing-source
    severity: minor
    topic: deployment-benchmarking
    missingEvidence: >-
      Standardized deployment-time and disruption benchmarks by brownfield and greenfield facility type across the main
      vendor set.
    whyItMatters: >-
      Switching-cost and time-to-value comparisons remain partly inferred until deployment evidence is normalized across
      similar warehouse profiles.
    diligencePath: >-
      Build a benchmark from comparable case studies or customer references segmented by SKU profile, building height,
      and workflow complexity.
    relatedQuestionRefs:
      - QP025
    relatedTableRefs:
      - TP005
  - type: private-evidence-only
    severity: material
    topic: recurring-revenue-mix
    missingEvidence: >-
      Standalone software revenue, recurring support revenue, maintenance attach rate, renewal retention, and any
      ARR-equivalent disclosure.
    whyItMatters: >-
      Without recurring-mix disclosure, investors cannot tell how much of Hai's margin path comes from repeat support
      and software rather than fresh hardware projects.
    diligencePath: >-
      Request revenue segmentation by initial deployment, software, maintenance, and operational support for 2023, 2024,
      9M25, and latest available YTD.
    relatedQuestionRefs:
      - QI001
      - QI002
      - QI007
      - QI025
    relatedTableRefs:
