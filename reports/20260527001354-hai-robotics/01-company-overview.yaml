    {
      "id": "capital-formation-scale-and-traction",
      "title": "Capital formation, scale signals, and current traction",
      "body": "Hai Robotics is already operating at a materially larger scale than many private warehouse-automation peers, but the scale story mixes very strong operating signals with real underwriting cautions. The HKEX filing gives the cleanest current numbers: RMB807.0 million revenue in 2023, RMB1.36 billion in 2024, and RMB1.263 billion for the first nine months of 2025; gross margin rising from 16.0% to 26.3% to 28.9%; and more than 800 contracted customers globally by September 30, 2025. It also shows more than 1,300 projects delivered, 516 R&D staff representing nearly 36% of employees, and 2,394 patent applications. That package supports a genuine large-scale hardware-plus-software business, not a pilot-stage robotics vendor.\n\nCapital formation, however, is best read through multiple lenses. TechCrunch and PR Newswire document the 2021 B+ plus simultaneous C and D rounds totaling roughly $200 million, with backing from 5Y Capital, Sequoia China, Source Code Capital, Capital Today, and others. The 36Kr pre-IPO profile adds later-stage context, describing 15 rounds and cumulative financing of about RMB4.133 billion, plus a post-Series-E valuation around RMB10.9 billion. That valuation figure is informative but still lower confidence than the operating metrics because it comes from late-stage media synthesis rather than the filing itself. The filing's own quality of revenue is also double-edged: by 9M25 the top five customers represented 48.2% of revenue and the largest single customer 30.4%, showing that Hai has landed large strategic accounts but has not eliminated concentration risk. Investors can therefore credibly view Hai as an established unicorn-scale ACR company, while still demanding more clarity on the final IPO pricing, current private-to-public mark, and how repeatable large-customer wins remain across cycles.",
