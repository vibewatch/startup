  "sections": [
    {
      "id": "customer-base-segmentation-and-buyer-mix",
      "title": "Customer base segmentation and who actually buys Hai",
      "body": "The filing is clear that Hai Robotics sells into a broader buyer universe than a simple list of end-user warehouse logos. As of September 30, 2025, the company said it had entered into contracts with over 800 customers globally, but that count explicitly includes both direct customers and channel partners. The same filing also reports 402 customers in the first nine months of 2025 in its order-intake table, which is better read as an in-period contracting-account count rather than a complete installed-base or site count. That distinction matters because it means the top-line customer story blends integrators, direct enterprise buyers, and end-user projects. Hai says the buyer mix spans warehouse operators, logistics service providers, retail conglomerates, and manufacturing enterprises across apparel and fashion, e-commerce and retail, F&B, 3PL, pharmaceutical, 3C electronics, and automotive. Enterprise quality is meaningful on paper: the filing says the customer base includes over 70 companies that have appeared on Fortune Global 500 lists since 2021, plus seven of the top 10 apparel and fashion companies and six of the top 10 3PL companies globally by 2024 revenue. The customer lens is also increasingly international. Non-domestic markets generated more than half of order intake in 9M25 and 39.6% of revenue, while the named case-study corpus now spans the United States, Spain, Singapore, Brazil, South Korea, and China. Partner pages from Hy-Tek, FORTNA, Conveyco, and Zion reinforce this mix by framing Hai as a channel-ready goods-to-person and ASRS option for verticals such as apparel, 3PL, healthcare, e-commerce, electronics, and spare parts. The right segmentation view, then, is not a single customer type but a stack: direct enterprise accounts, integrator-led programs, and channel-assisted international deployments.",
