    "number": 6,
    "title": "Customers",
    "summary": "Hai Robotics has credible evidence of real production adoption across retail/apparel, 3PL, healthcare, pharmaceutical distribution, electronics, and omnichannel fulfillment, with the strongest proof coming from quantified case studies, the HKEX filing, and a smaller set of partner or third-party corroborations. The customer story is therefore real but not clean: repeat-purchase and phased expansion signals are present, yet the public record still mixes direct customers with channel partners, leaves classic retention metrics undisclosed, and shows materially worsening concentration into the IPO window."
