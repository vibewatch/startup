    {
      "id": "repeat-usage-expansion-and-retention-limits",
      "title": "Repeat usage, expansion signals, and the limits of public retention evidence",
      "body": "Durability evidence exists, but it is mostly proxy evidence rather than a clean recurring-revenue or renewal-cohort disclosure set. The strongest disclosed metric is the filing’s customer repurchase rate, which improved from 68% in 2023 to 80% in 2024. That is directionally encouraging, especially when combined with case-study evidence of phased or repeat expansion. Boot Barn reportedly expanded three times in one year, Scalpers is explicitly structured as a two-phase rollout from 12 robots and 20,000 active locations to 26 robots and 100,000 planned locations, and JD Logistics’ Honeywell case shows the same installed system flexing into peak season rather than behaving like a one-off pilot. These are real land-and-expand signals. But the caveat is important: the filing defines repurchase rate using direct contracting customers and channel partners, not a pure set of end-user sites or a SaaS-like cohort definition. Public materials do not disclose gross revenue retention, net revenue retention, churn, average contract length, or renewal rates. Nor do they separate how much repeat activity comes from the same warehouse, multi-site rollouts, new project phases, or partner-resold follow-on orders. Partner pages nevertheless matter here because they show the surfaces through which repeat demand can compound. Hy-Tek, FORTNA, Conveyco, and Zion all market Hai as a modular system that can be installed in brownfield facilities and expanded over time, which is consistent with the broader operational story. The result is a credible but incomplete durability picture: repeat behavior is visible, yet public evidence is still far better at proving expansion potential than at proving cohort retention quality.",
