    {
      "id": "concentration-risk-and-confidence-limits",
      "title": "Concentration risk and how much confidence the public record really supports",
      "body": "The hardest customer question is not whether Hai has real customers; it is whether the quality of those relationships offsets concentration and disclosure gaps. On that score the filing is sober. Revenue from the five largest customers rose from 32.1% in 2023 to 36.7% in 2024 and 48.2% in 9M25, while the single largest customer rose to 30.4% of revenue in 9M25. Key-account concentration also climbed, with KA customers contributing 75.8% of order intake in 9M25. That does not negate the operating momentum, but it does mean public durability evidence must be weighed against meaningful dependency risk. Bamboo Works makes the same point from an adverse angle, flagging concentration as a real IPO vulnerability rather than a footnote. Another limit is evidentiary. The public named-proof set is now much broader than the five case pages used in earlier chapters because Hai’s cases index and download center surface a larger menu of customers and case assets. Even so, open-source proof still names only a thin subset of the 800-plus contracted customers in the filing or the broader 1,200-plus ecosystem claim used in Hai’s year-end marketing. Most of the visible proof is company-hosted or partner-hosted, not customer-authored disclosure. That means confidence should be highest in the existence of real deployments and lowest in the universality of the outcome claims. Investors can therefore underwrite a genuine installed base, real international reach, and some repeat expansion, but they should not overstate what public evidence proves about long-term retention durability or concentration resilience.",
