      - number: '5.2'
        title: 架构、编排和性能
        blocks:
          - type: paragraph
            body: >-
              最强的公开技术证据，来自编排加模块化硬件的组合。HaiQ 被描述为数字大脑，把上游 ERP、WMS 和 MES 系统连接到仓库执行、设备调度、数据、仿真和算法层。公开文案不止是泛泛的软件营销：WES
              明确覆盖入库、出库、库存合流和库存检查；ESS 集成机器人、输送线、拣选指示灯设备、急停和防护门；算法平台则从订单分配、任务指派、路径规划和充电逻辑来描述。文件补充了最关键的规模主张，称 HaiQ
              可在单一站点协调最多 6,000 台不同类型机器人，并且软件有意标准化，而不是每个项目从零定制。


              性能主张方向上亮眼，但仍需谨慎标注。递表文件和官方页面支撑一套连贯叙事：高密度、较短周转箱配送时间、12 到 15 米垂直触达、快速吞吐和高准确率。但其中大多数数字来自公司或 CIC
              主张，而不是独立基准测试结果。正确尽调姿态不是怀疑系统是否有效——硬件、工作流和编排都是真实的——而是谨慎对待每个峰值指标是否普遍可实现。公开证据最强之处在于说明系统如何运作、适合在哪些地方发光：高密度料箱搬运、存量场地适配、原包装流程和混合机器人协调；较弱之处在于独立测量的边界场景性能、能效和相对故障表现。
