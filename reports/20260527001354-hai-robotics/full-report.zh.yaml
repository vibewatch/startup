  - number: 6
    title: 客户情况
    sections:
      - number: '6.1'
        title: 客户基础分层，以及谁真正购买 Hai
        blocks:
          - type: paragraph
            body: >-
              监管文件说得很清楚：Hai Robotics 面向的买方范围，远不止一串终端仓库客户标识。截至 2025 年 9 月 30 日，公司称已在全球与超过 800
              个客户签约，但这个数字明确同时包括直接客户和渠道合作伙伴。同一份文件还在订单获取表中披露，2025 年前九个月有 402
              个客户；更合理的读法是期内签约账户数，而不是完整装机基础或站点数。这个区别很重要，因为它意味着客户叙事把集成商、直接企业买方和终端用户项目混在了一起。Hai
              称买方组合覆盖仓库运营方、物流服务商、零售集团，以及服装时尚、电商和零售、餐饮、3PL、医药、3C 电子、汽车等制造企业。纸面上的企业客户质量有分量：文件称客户基础包括 70 多家自 2021 年以来登上
              Fortune Global 500 榜单的公司，以及按 2024 年收入计算的全球前 10 大服装时尚公司中的 7 家、前 10 大 3PL 公司中的 6 家。客户视角也越来越国际化。2025
              年前九个月，非本土市场贡献了超过一半的新接订单和 39.6% 的收入；具名案例语料如今覆盖美国、西班牙、新加坡、巴西、韩国和中国。Hy-Tek、FORTNA、Conveyco 和 Zion
              的合作伙伴页面也强化了这种组合：它们把 Hai 定位成适合服装、3PL、医疗、电商、电子和备件等垂直行业的渠道就绪型货到人和 ASRS
              选项。因此，正确的分层不是单一客户类型，而是一组堆叠：直接企业账户、集成商主导项目，以及渠道协助的国际部署。
