      - number: '6.2'
        title: 具名部署证据：生产成熟度最强的地方
        blocks:
          - type: paragraph
            body: >-
              最强的采用证据不是头部客户数量，而是具名生产案例的深度。若干官方案例页现在给出了足够多的运营细节，已经不只是标识营销。St. Luke’s 和 Equipment Depot 是较干净的一组证明，因为 Hai
              官方页面和外部合作伙伴公告都描述了同一个医疗供应内包项目，包括 28 台机器人、14,000 平方英尺自动化面积，以及从依赖 3PL 转向自营配送的战略目标。JD Logistics 也强于典型营销案例，因为
              Hai 自己的页面和 Honeywell 托管的 PDF 都描述了一个已上线的加州部署：60 台 ACR、42,028 个周转箱库位、管理 100,000 多个
              SKU、可衡量的吞吐提升，以及黑色星期五无需额外临时用工的弹性。RD Saúde、Zuellig Pharma、Mettler Toledo、Maersk Logistics 和 Scalpers
              又把深度扩展到医药零售、临床试验物流、电子分销、时尚 3PL 和全渠道服装。这些案例展示了真实机器人数量、库位数量、吞吐量主张，有时还展示分阶段扩张。与此同时，证据质量并不均衡。Boot Barn、CEVA 和
              Avenue Shops 给出的结果很吸引人，但公开记录仍主要由公司撰写。Umall 和 Li-Ning 更偏方向性：它们支持真实使用判断，但量化证据没有同样扎实。平衡后的结论是，Hai
              已有足够多具名生产参考，能证明产品在多个细分市场的真实运营中被使用；但结果证据的精确度仍因客户而明显不同。
