      - number: '6.4'
        title: 集中度风险，以及公开记录到底能支撑多少信心
        blocks:
          - type: paragraph
            body: >-
              最难的客户问题不是 Hai 有没有真实客户，而是这些关系的质量能否抵消集中度和披露缺口。在这一点上，监管文件很克制。前五大客户收入占比从 2023 年的 32.1% 升至 2024 年的 36.7%，并在
              2025 年前九个月达到 48.2%；单一最大客户同期升至收入的 30.4%。大客户集中度也在上行，KA 客户贡献了 2025 年前九个月 75.8%
              的订单获取额。这并不否定经营动能，但意味着必须把公开耐久性证据与实质性依赖风险一起权衡。Bamboo Works 从反向角度提出同一点，把集中度标成真实 IPO
              脆弱点，而不是脚注。另一个限制在证据层面。如今公开具名证据集远宽于早期章节使用的五个案例页，因为 Hai 的案例索引和下载中心呈现了更多客户和案例资产。即便如此，开源证据仍只点名了监管文件中 800
              多个签约客户的一小部分，也只覆盖 Hai 年终营销中 1,200
              多个生态客户说法的一小部分。大多数可见证据由公司或合作伙伴托管，而不是客户自主披露。这意味着，最高信心应该放在真实部署存在；最低信心则应放在结果主张是否普遍成立。投资人因此可以承认真实装机基础、真实国际触达和部分重复扩张，但不应夸大公开证据对长期留存耐久性或集中度韧性的证明力。
