      - number: '2.3'
        title: 保守 TAM、SAM 和已观察 SOM 视角
        blocks:
          - type: paragraph
            body: >-
              对 Hai 做可辩护的市场测算，应使用多个视角并清楚标注限制，而不是假装一个通用数字很精确。最宽的 TAM 来自公开仓储自动化报告：Mordor 和 TBRC 给出的 2026 年规模大约为 USD 34.2
              billion 到 USD 36.4 billion。更相关的中间层来自 Hai 递表文件，引用 CIC 的仓储拣选自动化市场，2026E 为 RMB 232.6 billion。更窄的产品品类层来自同一文件对
              ACR 的估算，2026E 为 RMB 9.8 billion。这三层不能互换，但合在一起说明 Hai 卖进了一个真实且扩张中的自动化市场，同时其直接细分赛道仍远小于仓储自动化 TAM 标题数字可能暗示的范围。


              本章的 SAM 代理值有意保守。与其把每个可能行业都换算成伪精确数字，不如用 Mordor 的功能和所有权份额来展示相关预算池的大致量级：以拣选和包装作为功能代理，以 3PL
              所有权作为渠道代理，以零售或电商所有权作为需求代理。SOM 视角更受限制。公开数据不足以按地域、定价模型或垂直组合做可信的前瞻市占率预测。能支撑的是一个已观察历史锚点：Hai 2024 年收入大致对应 CIC
              2024 年 ACR 市场规模的约三分之一，与文件中超过 30% 的份额主张一致。这是有用背景，但不能承诺当品类扩大、竞争加剧时，Hai 会保持同样份额。
