      - number: '3.2'
        title: 直接竞品画像和重叠真正出现的地方
        blocks:
          - type: paragraph
            body: >-
              最重要的直接重叠，仍是 Hai 与其他高密度、拣选聚焦系统之间的重叠，而不是与每个仓储机器人品牌的重叠。Hai 的公开优势来自垂直触达、存量场地适配和料箱搬运这三个要素的组合。文件称，HaiPick Climb
              在改造和新建场地可达到 15 米；2025 年升级和欧洲部署则给出具体运营故事：每 1,000 平方米 45,000 个周转箱、每小时 4,000
              次配送，以及无需人工拆零的原箱流程。对空间昂贵、设施无法从零重建的服装、零售、医疗和 3PL 环境来说，这是有吸引力的组合。


              对手以不同方式与 Hai 重叠。AutoStore 是最成熟的高密度替代方案，并通过 CarouselAI、VersaPort 和 AI 软件超越单纯料箱取回。公开证据下，Geek+ 看起来比 Hai
              更宽，因为它在一套模块化套件下覆盖货架、料箱、托盘、厂内物流和机械臂拣选，公开份额主张也指向其在货架到人中的真实规模。GreyOrange
              不是押一个明星机器人，而是更想掌控连接人、机器人和系统的编排层。Locus Array 是最清晰的自主拣选威胁，因为它把机器人直接带到货物旁，在巷道内完成工作，而不只是到工作站。Quicktron
              重要，是因为它把中国移动机器人经济性与更模块化、多场景架构结合，能够覆盖料箱、货架、托盘和物料搬运工作流。因此战场拥挤，但拥挤方向不同：Hai 仍有差异化，只是并非无人挑战。
