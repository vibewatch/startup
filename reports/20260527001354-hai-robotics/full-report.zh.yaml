      - number: '6.3'
        title: 重复使用、扩张信号，以及公开留存证据的边界
        blocks:
          - type: paragraph
            body: >-
              耐久性证据存在，但主要是代理证据，而不是干净的经常性收入或续约队列披露。披露中最强的指标是监管文件里的客户复购率，从 2023 年的 68% 提升到 2024 年的
              80%。这个方向值得鼓励，尤其是与案例中分阶段或重复扩张的证据放在一起看。Boot Barn 据称一年内扩张三次；Scalpers 明确设计成两阶段落地，从 12 台机器人和 20,000 个活跃库位，扩展到
              26 台机器人和 100,000 个规划库位；JD Logistics 的 Honeywell
              案例显示，同一套已安装系统可以撑住旺季，而不是一次性试点。这些都是真实的落地后扩张信号。但限制同样重要：文件用直接签约客户和渠道合作伙伴来定义复购率，而不是纯粹的终端用户站点集合，也不是类似 SaaS
              的队列定义。公开材料没有披露总留存率（GRR）、净留存率（NRR）、流失率、平均合同期或续约率，也没有拆分重复活动有多少来自同一仓库、多站点铺开、新项目阶段，或合作伙伴转售的后续订单。尽管如此，合作伙伴页面在这里仍有意义，因为它们展示了重复需求可以复利的触点。Hy-Tek、FORTNA、Conveyco
              和 Zion 都把 Hai
              作为可安装在棕地设施、并可随时间扩容的模块化系统来销售，这与更宽的运营叙事一致。结果是一幅可信但不完整的耐久性图景：重复行为看得见，但公开证据更擅长证明扩张潜力，而不是证明队列留存质量。
