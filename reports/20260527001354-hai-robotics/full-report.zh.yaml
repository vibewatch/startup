  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模型和定价不透明
        blocks:
          - type: paragraph
            body: >-
              已观察证据对架构很强，对具体变现深度很弱。HKEX 申请版本明确说，Hai 的大部分收入来自一次性项目交付和部署；系统上线后，再从维护包、软件、运营和技术支持中赚取经常性收入。这让本章可以把 Hai 描述为硬件
              + 软件 + 服务的混合业务，而不是纯设备卖家。公开来源也支持两条线的销售动议：对战略和 KA
              客户直销，同时渠道伙伴贡献了有意义收入，占比大约在四分之一到五分之二之间。官方伙伴页进一步说明，这不是很薄的转介绍模型；Hai 正在投入伙伴培训、售前仿真和联合市场管理。


              公开记录没有揭示的内容同样重要。留存来源中，没有任何一个拆出经常性收入占比、软件收入、维护绑定率或类似 ARR 的指标。官方产品页解释了 HaiQ、HaiCharger
              和模块化系统，但仍不公布标价或折扣区间。即便是 Hai 的 RaaS 博客也应谨慎处理：它说明公司在概念上讨论租赁式运营开支模型，而不是把该模型报告为当前已披露收入线。清醒结论因此应基于观察而非推断：Hai
              确有服务和软件长尾，但公开记录不足以给这条长尾定价，也无法判断毛利率改善中有多少来自经常性变现，而不是更好的项目组合。
