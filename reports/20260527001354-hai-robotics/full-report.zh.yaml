  - id: TV005
    title: 投资逻辑破裂与否决触发表
    columns:
      - 触发项
      - 阈值 / 信号
      - 重要性
      - 对投资逻辑的传导
      - 行动含义
    rows:
      - - IPO 条款持续不透明
        - 下一次重大披露仍没有最终价格区间、股权结构桥接或清晰募资用途细节
        - 入场经济性仍不可知
        - 把“观察”变成“等待”，而不是“买入”
        - 条款公开前，不增加信心
      - - 最大客户依赖仍极端
        - 最大客户仍接近当前 9M25 水平，或前五大集中度再次恶化
        - 一个账户就能撬动整个股权故事
        - 公开市场倍数应压缩，而不是扩张
        - 将估值区间向悲观情景打折
      - - 现金生成未改善
        - 尽管增长和利润率改善，经营现金流仍明显为负
        - 说明规模尚未转化为融资独立性
        - 削弱私募标记在基准情景中的支撑
        - 视私募标记为过于慷慨
      - - 经常性组合披露仍缺席
        - 没有硬件 / 软件 / 服务拆分，也没有续约数据
        - 可比公司选择仍薄弱，收入质量仍不透明
        - 阻断溢价倍数论证
        - 建议维持观察 / 继续研究
      - - 合作伙伴主导执行出现外流
        - 支持负担上升，却没有利润率或 SLA 质量证据
        - 国际扩张的价值可能低于表面观感
        - 降低为海外叙事付费的意愿
        - 对可比公司推导区间追加折价
      - - 未来 IPO 在证据不足时索要溢价
        - 拟议估值达到或超过后期私募倍数，但披露质量没有改善
        - 投资者是在为未解决风险加价
        - 把偏高转为昂贵
        - 除非条款重置，否则拒绝或推迟
    notes: 这些是具体否决触发项，不是泛泛担忧。每一项都点名一个可监测事实模式，一旦出现，会迫使估值逻辑下调，而不只是压低热情。
