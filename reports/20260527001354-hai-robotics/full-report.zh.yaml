  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 股权结构表和摊薄
        - 完全摊薄股数、优先权、转换条款，以及从上一轮私募到拟议公开定价的桥接
        - 把后期私募信号转成真实入场经济性
        - 任何定价决定前，向 CFO / 法务尽调室索取
      - - IPO 定价包
        - 价格区间、目标市值、基石条款和详细募资用途
        - 判断公开市场投资人是否要因不透明而打折，还是要为其支付溢价
        - 更新版招股书或聆讯资料包审阅
      - - 经常性收入与软件占比
        - 硬件、软件、维护和支持收入拆分，以及各收入流毛利率
        - 判断 Hai 应按硬件、软件还是混合公司可比口径处理
        - 财务分部包和产品 P&L 审阅
      - - 客户集中度质量
        - 前十客户桥接表、积压订单、付款条款，以及直销与合作伙伴渠道的流失 / 续约模式
        - 检验集中度是在缓解，还是只是被增长掩盖
        - 商业尽调，配合队列表和客户访谈
      - - 海外支持经济性
        - SLA 结构、本地支持人员、备件义务，以及按区域或渠道拆分的毛利率
        - 验证海外增长应享有估值溢价还是折价
        - 关键区域运营和服务质量尽调
      - - 最接近上市可比公司的口径调整
        - Geekplus 最新财务数据、稳定的当前报价来源，以及任何更干净的香港仓储机器人 倍数
        - 收窄最贴近上市地的公开市场偏好基准
        - 拿到直接当前来源后，刷新可比公司分析
    notes: 要把严格的公开证据章节推进成可投资承销备忘录，至少需要上述追问。
