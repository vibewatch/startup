      - number: '7.3'
        title: 客户、财务与竞争风险
        blocks:
          - type: paragraph
            body: >-
              财务上最实质的风险堆栈由集中度和流动性主导，而不是需求缺失。文件显示，前五大客户收入占比从 2023 年的 32.1% 升至 2025 年前九个月的 48.2%，单一最大客户达到收入的 30.4%，KA
              客户同期贡献了 75.8% 的订单获取额。这些不是柔和的预警灯。它们意味着，一个客户关系、一条项目时间线或一次采购重置，都能实质性撬动集团层面结果。与此同时，Hai 仍在亏损。文件记录了 2023 年、2024
              年和 2025 年前九个月的大额亏损、与交付义务相关的合同负债上升，以及截至 2025 年 9 月接近 RMB3.9 billion 的净流动负债。Bamboo Works、Benzinga 和
              Longbridge
              都从反向角度强调了同样的资产负债表和现金流压力。因此，公开证据支持一组具体财务风险排序：集中度和流动性是已观察到的高风险；亏损和交付义务风险是已观察到的中高风险；准确现金跑道和服务利润率下行空间仍披露不足。


              竞争压力也更像已观察到的现实，而不是猜测。AsiaTechDaily 认为，随着市场拥挤，Hai
              正进入一个定价、部署速度和客户获取更重要的阶段。这一立场与更宽的证据集一致：仓库自动化足够大，仍会吸引可信竞争者；买方也越来越可以把料箱处理系统与更宽的 AS/RS 和 AMR 替代方案比较，而不只是与另一家
              ACR 厂商比较。Hai 自身海外增长会加剧这个问题，因为非本土订单如今占新接订单的一半以上，这扩大了市场机会，但也迫使公司在更多司法辖区守住价格、支持质量和本地合规。对估值来说，这意味着投资人不应把 Hai
              当成干净的软件式增长故事来承销。更现实的视角是，公司可以因品类领导地位和毛利率改善获得信用，但在集中度缓解、经营性现金生成改善，以及合作伙伴主导的扩张证明自己可以不漏掉利润率或质量地规模化之前，公开市场估值倍数上限应继续受限。
