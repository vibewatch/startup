  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 治理、监管与法律风险
        blocks:
          - type: paragraph
            body: >-
              Hai 最清晰的治理风险不是假设，而是写在监管文件里。公司计划以加权投票权架构上市，申请版本明确警示，WVR
              受益人的利益可能与全体股东并不完全一致。文件自己的风险因素表述更进一步，称集中的投票权可能延迟或阻止控制权变更结果，并压低普通股价格。这很重要，因为这不是一个建立在成熟公开运营历史之上的创始人控制结构；它是在公司仍处于申请版本阶段、公开市场纪律尚未在实际报告周期中被检验时引入的。HKEX
              第 8A 章提供了真实防护，包括 10:1 投票上限、非 WVR
              持有人最低投票权，以及受益人离开董事会或转让相关权益时的终止触发。但这些规则降低的是尾部风险，并没有消除一个现实：公众投资人可能在相当长时间里被锁进管理层的战略选择。


              法律和监管风险同样喜忧参半。Hai
              网站隐私政策显示，公司收集范围很宽的用户和营销数据，并可能跨司法辖区转移个人数据，包括中国和其他国家；一家向全球销售联网系统的公司因此会有真实合规暴露。其使用条款也偏防御：内容按原样提供，广泛排除保证，并限制逆向工程、漏洞扫描等技术检查行为。在网络安全监管上，Hai
              释放了建设性信号，包括 RED 第 3.3(d) 条合规信息和 IEC 62443-4-1
              认证。这些是正向项。但证据仍停留在公开公告和高层级监管解读，而不是透明的证书范围、监督节奏或事件历史。因此，合适的判断应当分层：WVR
              治理风险已被观察到且较高；隐私和网络合规义务已被观察到，处于中高；未披露诉讼暴露仍是明确的证据缺口，而不是已排除的问题。
