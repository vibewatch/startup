      - number: '4.4'
        title: 财务结论和证据缺口
        blocks:
          - type: paragraph
            body: >-
              因此，财务结论是混合的，但并不混乱。已观察证据支持这样一家公司：拥有真实工业收入、毛利率在改善，并且商业模式可以通过软件、维护、支持和站点扩展复用客户关系。已观察证据也支持一个仍然沉重的资本强度画像：大额会计亏损、经营现金流为负、负债上升、客户集中，并持续依赖外部融资和预收款。Bamboo
              Works 及 Bamboo 作者在 Benzinga 的转载负面报道，在这些点上与递表文件方向一致；Pandaily 和 Sahm 等更新的 IPO 摘要，则大多复述文件，未填补重要尽调缺口。


              实操结论是避免过度精确。公开证据不足以支持关于 ARR、产品级毛利率、CAC、烧钱倍数或现金跑道月份的精确主张，也不足以支持对已实现定价或渠道经济性的自信假设。它能支持的是更窄、更可辩护的一句话：Hai
              的经济性在改善，但它仍是一家资本密集型仓储自动化公司，要达到公开市场质量，仍取决于组合、执行和披露追上规模。这让第四章本质上同时关乎进展和缺失数据，而不只是进展。
