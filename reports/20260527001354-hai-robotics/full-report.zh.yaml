  - id: TM005
    title: Hai 为什么能赢下目标垂直领域
    columns:
      - 垂直领域
      - 痛点为何尖锐
      - Hai 为何适配
      - 公开证据点
      - 主要但书
    rows:
      - - 服装 / 时尚
        - SKU 多、季节波动大，还要承受当日 / 次日达压力
        - 高密度存储加货到人拣选减少走动，也帮助高峰扩容
        - Boot Barn 密度翻倍、效率提升 250%；Avenue Shops 月发货订单翻倍
        - 软商品买方仍可考虑货架到人或立方体仓储替代方案
      - - 3PL
        - 需要能跨多种客户画像和高峰复用的灵活基础设施
        - 模块化部署和高密度存储帮助 3PL 在不同合同间复用产能
        - CEVA 在 1,700 平方米内容纳 24,000+ 个库位和 35 台机器人
        - 3PL 预算仍受合同期限和客户集中度影响
      - - 零售 / 杂货全渠道
        - 场地受限，还要快速补货和履约
        - 适合改造的高密度方案和 G2P 流程能塞进既有面积
        - Umall 强调更高密度、更快履约和更低人工依赖
        - AutoStore 和其他 G2P 替代方案也在强攻这个用例
      - - 医疗 / 医药
        - 需要准确、洁净、服务连续和可追溯控制
        - 高密度自动化存储加标准化料箱处理，支撑受控配送
        - St. Luke's 建成 14,000 sq. ft. 自动化 CSC，拥有 18,600+ 个库位，出库能力 653 个料箱/小时
        - 验证和安全要求可能拉长实施周期
      - - 制造
        - 需要线边配送、混合类型处理和流程协同
        - System 2 和 System 1 支持托盘化、拆零拣选和线边配送
        - 虽然收入以配送场景为主，Hai 监管文件仍把制造列为核心应用领域
        - 制造具备战略相关性，但在当前收入结构中小于配送
    notes: 本表总结公开用例模式，而不是量化垂直收入拆分；Hai 并未详细披露后者。
