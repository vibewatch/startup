      - number: '8.3'
        title: 情景区间与决策触发项
        blocks:
          - type: paragraph
            body: >-
              给 Hai 定价的正确方式是看情景，而不是制造虚假精确。悲观情景从一个简单事实开始：发行仍有条件，且在亏损、集中度和披露缺口仍如此可见时，公众投资人未必愿意承认后期私募估值。在这种情况下，Hai
              可能相对私募信号折价交易，尤其是在现金生成或集中度恶化时。基准情景更平衡：Hai
              继续增长，利润率继续改善，海外组合继续支撑，公司因软件、服务和重复部署获得部分认可，但投资人仍拒绝为不透明支付溢价。乐观情景可能存在，但它要求的不只是延续当前叙事。Hai
              需要证明自己能把品类领导地位转化为更干净的经常性经济性，以及更适合公开市场的风险画像。


              因此，下面的区间应被解读为有纪律的决策带，而不是实时承销建议。它们告诉投资人，哪些证据可以证明付更高或更低价格合理，也展示当前后期私募信号处在这张地图的哪个位置。若集中度仍极端，若下一次更新没有改善现金生成质量，或若未来发行价区间要求投资人在不弥合披露缺口的情况下按或高于私募倍数付费，投资逻辑应削弱，而不是加强。反过来，如果
              Hai 拿出更干净的招股书，继续显示组合改善，并给投资人更多收入耐久性可见度，更高区间就更容易辩护。
