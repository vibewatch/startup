      - number: '2.4'
        title: 增长驱动、采用约束和承销真正要看的问题
        blocks:
          - type: paragraph
            body: >-
              增长驱动的证据基础很强。Mordor 将劳动力短缺、工资通胀、更快交付预期和存储密度压力描述为结构性顺风。Hai
              自己的产品和伙伴材料也从一线强化同一点：买家想要能够快速上线、围绕现有货架适配、并且不迫使仓库停摆就能扩展的系统。Hy-Tek 和 Conveyco 等集成商渠道重要，因为它们拓宽了 Hai
              进入企业预算的路径，尤其是那些通过既有系统集成商而不是直接向机器人 OEM 采购解决方案的运营方。竞品信息也支持一个判断：软件和编排在价值捕获中越来越核心，这让 HaiQ 具备战略意义，即使 Hai
              仍是一家硬件前置的公司。


              约束同样真实。市场增长不能消除资本开支摩擦、集成风险或宏观周期性。Hai 文件反复提示，客户预算、漫长商业化周期、供应商限制、安全要求和标准变化都可能拖慢采用。竞争替代方案也在快速进步：AutoStore
              销售高密度立方体存储 G2P，Locus 推动快速部署的货到机器人，GreyOrange 强调跨异构车队编排，Geekplus 在相邻 AMR 品类中仍很强。这个组合意味着第二章应以平衡的承销视角收束。Hai
              对准了真实市场需求，尤其是在高密度、改造重、SKU 高的运营场景；但关键尽调问题是，当仍然很小的 ACR 楔形市场变得更主流、更具价格竞争时，它能否守住利润率和部署经济性。
