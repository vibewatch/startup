        - 多场景适配灵活，西方市场推进在增强
        - 料箱、货架、托盘和工厂物流混合场景
        - 西方市场公开证据仍较薄
      - - 现状 / 局部自动化
        - 人工拣选、流程重设计、输送线
        - 人到货，用人工或有限硬件补瓶颈
        - 前期结构性扰动低
        - 优先控制短期资本开支的运营方
        - 人工依赖更高，长期可扩展性更弱
