  - id: FE001
    title: Hai 部署的客户工作流 / 运营流程
    type: flow
    layout: wide
    summary: 公开运营模型从企业订单释放进入 HaiQ 编排，再经过机器人执行、充电、工作站和反馈回路， 而不是单一孤立机器人层。
    data:
      nodes:
        - id: erp
          label: ERP / WMS / MES
          detail: 客户系统提供订单、库存状态和执行上下文。
        - id: wes
          label: HaiQ WES
          detail: 处理入库、出库、库存、合单和工作站规则。
        - id: ess
          label: HaiQ ESS
          detail: 在同一控制层调度机器人和连接设备。
        - id: algorithms
          label: 算法 + 仿真
          detail: 订单分配、任务指派、路径规划、充电和售前仿真调优运营。
        - id: robots
          label: ACR / 爬升机器人 / AMR
          detail: 执行存储、取回、运输和混合容器处理。
        - id: charging
          label: 充电 + 可用性控制
          detail: HaiCharger 和充电逻辑帮助保持机队可用。
        - id: racking
          label: 标准货架 + 容器
          detail: 本地结构层支撑存量场地适配和混合包装。
        - id: stations
          label: 工作站 + HaiVest
          detail: 人机交互层用于拣选、托盘处理和安全维护通道。
        - id: lineside
          label: 包装 / 输送线 / 线边交接
          detail: 出库、补货或制造相邻流程在这里收尾。
        - id: feedback
          label: 遥测 + 支持
          detail: 本地团队、备件和日志支撑调优、排障和服务。
      edges:
        - from: erp
          to: wes
          label: 订单 + 库存
        - from: wes
          to: ess
          label: 执行指令
        - from: wes
          to: algorithms
          label: 规则 + 场景
        - from: algorithms
          to: ess
          label: 优化任务
        - from: ess
          to: robots
          label: 调度
        - from: robots
          to: racking
          label: 存储 / 取回
        - from: racking
          to: robots
          label: 库存访问
        - from: robots
          to: stations
          label: 交付料箱 / 纸箱
        - from: robots
          to: charging
          label: 充电周期
        - from: stations
          to: lineside
          label: 拣选 / 交接
        - from: robots
          to: feedback
          label: 日志 + 遥测
        - from: feedback
          to: algorithms
          label: 调优 + 支持
    approximationNotes: 流程抽象了公开语料中反复出现的控制和物理步骤。它是运营逻辑图，不是字面软件时序图。
    claimRefs:
      - CE011
      - CE012
      - CE013
      - CE016
      - CE017
      - CE019
      - CE020
      - CE031
      - CE032
  - id: FU001
    title: 客户证据矩阵
    type: matrix
    layout: wide
    summary: 最强客户背书同时具备明确生产状态、量化运营成果和至少部分外部佐证；较弱背书仍有用， 但营销味更重。
    data:
      columns:
        - 生产成熟度
        - 成果具体性
        - 扩张可见度
        - 独立佐证
      rows:
        - label: St. Luke's
          values:
            - 高
            - 高
            - 中
            - 中
        - label: JD Logistics
