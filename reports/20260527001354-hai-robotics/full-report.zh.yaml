chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、品类创建和商业模式
        blocks:
          - type: paragraph
            body: >-
              理解 Hai Robotics，首先应把它看作定义仓储自动化品类的厂商，而不是普通移动机器人初创公司。公司在 2026 年 2
              月香港申请版本中称，它聚焦仓库拣选这一劳动最密集的环节，并且按收入和出货量计算，2024 年都是全球最大自主料箱搬运机器人供应商，市占率超过 30%。同一份文件把 Hai 定位为一体化 ACR
              解决方案的发明者，产品演进从 2017 年首次推出 HaiPick，一直延伸到 2025 年发布 HaiPick Climb。TechCrunch 2021 年融资报道和后续公司材料也支撑这条脉络：Hai
              选择了料箱搬运架构，只取需要的周转箱或纸箱，而不是搬动整排货架；围绕高密度存储、订单暂存、合流和整箱搬运，公司持续扩展产品套件。


              这套商业模式不只是一次性卖机器人。文件称，仓库系统交付和部署时，Hai 会确认可观的初始项目收入；上线后，再通过售后维护包、软件以及技术和运营支持形成经常性收入。这一点重要，因为公司本质上是硬件 + 软件 +
              服务的混合供应商，长期经济性取决于重复部署、持续服务绑定和渠道关系，而不只是最初的硬件出货。文件还显示，公司有意把业务组合转向分销场景和非本土市场；官方产品页则强调标准化 HaiQ
              控制层和模块化系统架构。简言之，本章可以把 Hai Robotics 视为一家全球 ACR 平台公司，部署成熟度真实，并带有服务长尾；但后续章节仍需检验，这套模式在公开市场审视下能否变得持久且盈利。
