        - 驱动因素
        - 当前至中期
        - 抬高 HaiQ 和集成深度的战略价值
        - 每个部署项目里嵌入了多少经常性软件收入？
      - - 集成商主导的国际化
        - 驱动因素
        - 中期
        - 拓宽 Hai 触达中国以外企业预算的路径
        - 哪些伙伴实质影响管线和赢率？
      - - 前期资本开支高、回本有风险
        - 约束因素
