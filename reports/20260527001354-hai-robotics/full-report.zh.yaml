      - number: '1.2'
        title: 创始人、治理和领导梯队
        blocks:
          - type: paragraph
            body: >-
              研究过程中，用户提供的创始人背景需要校正。已审阅材料中最权威的公开来源是 HKEX 申请版本，文件称 Hai Robotics 于 2016 年 12
              月由陈宇奇、许胜东和方兵创立。陈任董事长兼首席执行官，许任首席技术官，方任首席运营官。文件中的履历让创始人—市场匹配故事站得住：陈此前从事光调制器控制器研发，后来成为面向公司的战略负责人和融资人；许拥有 ETH
              Zurich 机器人训练背景，负责核心产品研发；方掌管运营、供应链和量产。这个创始三人组在运营上仍然重要，因为公司采用了与三名创始人绑定的加权投票权结构，计划赴港上市后仍保留增强控制权。


              随着 Hai 推进海外扩张，创始三人组之外的领导层厚度明显增加。申请版本列明曾虹霓为 CFO；2025 年官方公告显示，美国团队更厚了：Adrian Stoch 在 Target 和 GXO 担任高管后，于
              2025 年 8 月 18 日出任 Americas CEO；Hai 还提拔了 Hunter Senn 和 Andrew
              Tolman，并在美国新增客户支持、软件和战略合作负责人。这些动作符合公司转向非本土订单和本地支持义务的方向。代价是治理仍不透明。即便有递表文件，公开来源对日常董事会流程、委员会实践，以及创始人与后期投资者之间控制权精确平衡的披露，仍明显少于商业里程碑。本概览因此把领导梯队视为优势，同时仍把治理细节和
              IPO 后最终控制权动态视为仅部分披露。
