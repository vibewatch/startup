  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司 / 锚点
      - 状态
      - 已披露收入或规模信号
      - 估值 / 倍数信号
      - 对 Hai 的意义
      - 局限
    rows:
      - - Hai Robotics 后期私募信号
        - 私募方向性锚点
        - 申报文件披露 2024 年收入 RMB1,360.4M
        - 36Kr 报道 Series E 后估值约 RMB10.9B；隐含约 2024 年销售额的 8.0x
        - IPO 前最后一轮私募成交水平的最佳公开线索
        - 媒体报道数值；没有公开优先股堆叠、摊薄桥接或最终 IPO 区间
      - - AutoStore
        - 公开可比公司
        - LTM 收入约 $618.5M；持续发布投资者报告
        - 市值约 $4.79B；追踪 P/S 约 7.4x
        - 一个披露充分的 AS/RS 平台，有公开市场价格发现和成熟报告
        - 架构、地域和成熟度不同；倍数不应机械套用
      - - Symbotic
        - 公开可比公司
        - LTM 收入约 $2.52B，且继续增长
        - 市值约 $31.87-$31.91B；P/S 约 12.66x；EV/Sales 约 11.87x
        - 显示公开市场愿为披露更强、规模化自动化平台支付的上沿
        - 规模和战略背景都远大于 Hai；不是同口径可比公司
      - - Geekplus
        - 方向性公开上市类比
        - 仍持续披露的 HKEX 仓储机器人同业，并声称 2024 年 AMR 领先
        - IPO 募资总额约 HK$2.71B；对判断市场胃口和上市地点有用，但保留来源不能给出规范化当前倍数
        - 最接近的香港投资者胃口类比，适用于仓储机器人发行人
        - 本处保留来源更能证明上市可行性，而不是当前规范化估值
    notes: 本表混合了公开可比公司和方向性锚点。币种和方法不同，因此目的在于划定区间和保持纪律，而不是追求单点精确。
