      - number: '1.4'
        title: 全球扩张、里程碑和核心概览风险
        blocks:
          - type: paragraph
            body: >-
              从运营上看，Hai Robotics 现在呈现为一家总部位于深圳的全球公司，而不是只做中国出口的机器人公司。文件称，其足迹覆盖 40 多个国家和地区，2025 年前九个月非本土订单额超过总订单额
              50%，非本土收入接近总收入 40%。官方公司发布进一步强化了这个方向：2025 年和 2026 年公告显示，公司通过 FORTNA、TGW Logistics、Hy-Tek、Conveyco 等集成商关系和
              Americas 领导层扩充，持续推进本地市场。案例研究页也展示了零售、医疗、3PL 和商超场景，包括 Boot Barn、St. Luke's、Avenue Shops、CEVA Logistics 和
              Umall。年终回顾把规模叙事推得更远，称已有或正在投入运营的机器人 29,000 台、客户 1,200 多家，2025 年交付机器人 7,000 台。


              同一组来源也划出了概览风险。IPO 前文件以及 Bamboo Works、Benzinga、Longbridge 和 AsiaTechDaily 的负面评论都指向同样的压力点：按会计口径，Hai
              仍深度亏损；负债显著上升；客户集中度提高；即将到来的 IPO 会把公司从私营市场的品类创建叙事，推入公开市场对利润率、治理和执行的检验。部分官方营销说法还使用 1,200
              多家客户等更宽的生态口径，而文件采用较窄的「超过 800 家签约客户」定义，因此读者不应把这些数字压平成一个精确客户数。第一章合适的结论不是质疑 Hai
              是否真的做出了东西——它显然做到了——而是承认下一阶段取决于强劲海外增长、产品标准化和创始人控制，能否转化为持久的公开公司经济性。
