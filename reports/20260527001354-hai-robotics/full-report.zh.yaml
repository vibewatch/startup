      - number: '8.2'
        title: 私募估值与公开市场纪律
        blocks:
          - type: paragraph
            body: >-
              Hai 最清晰的公开可见估值信号，是 36Kr 关于 E 轮后约 RMB10.9 billion 估值、累计融资约 RMB4.133 billion 的说法。这个信号有用，但不能自证合理。若与 Hai 披露的
              2024 年收入配对，它意味着约 8.0x 的过去 12 个月销售额；这还没有调整清算优先权、稀释或 IPO
              折价。对一家有真实增长和品类领导地位的自动化公司来说，这不是荒唐数字；但当监管文件同时显示大额亏损、经营性现金流为负、负债沉重和客户集中度恶化时，它也并不显得便宜。私募叙事和公开估值纪律不是一回事。


              公开可比公司让这一点更尖锐。AutoStore 约为 7.4x 过去 12 个月销售额，并有已披露的报告节奏、实时公开价格发现和成熟产品包装。Symbotic 更贵，约 12.7x 过去 12
              个月销售额、11.9x 企业价值 / 销售额（EV/sales），但它也有更大规模和公开市场披露。Geekplus 的意义不在于归一化倍数，而更像市场读数：它是一个已上市的香港仓库机器人标的，带有 WVR 和真实
              IPO 募资，说明该品类存在投资人胃口。正确结论不是 Hai 可以类比获得其中某个数字，而是 Hai 目前夹在一个可信的后期私募信号和更硬的公开可比组之间；质量足以留在名单上，但干净程度还不足以默认获得溢价入场。
