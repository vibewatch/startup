      - number: '5.4'
        title: 信任、合规和残余技术风险
        blocks:
          - type: paragraph
            body: >-
              在留存的 2025-2026 年语料中，信任证据明显改善。Hai 官方宣布获得 IEC 62443-4-1 认证，并描述了风险评估、测试、漏洞管理和协同更新等安全开发控制。行业报道也复述了公司关于通过 TÜV
              SÜD 验证符合 EU RED Article 3.3(d)，以及与 ISO 27001 和 TISAX 对齐的说法。官方 HaiQ
              文案还增加了更多运营控制，包括机器人通信加密、故障自动切换、负载均衡和灾害预防功能。系统页还提到 CE 和 NRTL 认证工作站，以及用于维护期间人员进入的 HaiVest
              安全方案。这足以说明，信任、网络安全和安全性现在已经是公开产品故事的一部分，而不是事后补充。


              缺失的内容同样重要。文件仍警示，网络攻击、网络过载、断电和通信故障可能中断 ACR 可用性，并另外提示对半导体、传感器和控制系统的依赖。公开认证新闻尚未给出证书 ID、范围细节、事故披露历史、CVE
              处理记录或质保经济性。同样，留存来源没有给出第三方独立基准，来比较故障模式、能耗或相对具名同行的服务水平表现。实际结论应是平衡而非二元：Hai
              现在有了有意义的公开信任信号，但最关乎承销的证明，仍取决于尽调资料室文件和客户访谈，而不是开放语料中可见的内容。
