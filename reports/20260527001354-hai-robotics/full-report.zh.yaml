      - number: '4.3'
        title: 流动性、负债和资本强度
        blocks:
          - type: paragraph
            body: >-
              已观察流动性数据指向谨慎，而不是恐慌。截至 2025 年 9 月，Hai 持有现金及现金等价物 RMB757.5 million；随后披露，2025 年 12 月融资后，2026 年 1 月 5
              日现金及现金等价物为 RMB1.876 billion。这是有意义的改善。同一份文件也说明为什么资本强度仍是现实问题：所有披露期经营现金流均为负；到 2025 年 9 月，总负债升至 RMB6.60
              billion；净流动负债恶化至 RMB3.90 billion。客户预付款和供应商账期有很大帮助——合同负债升至 RMB1.1375
              billion，甚至超过已发出商品加合同成本——但这些优势是为履约融资，不能抹去底层烧钱或执行风险。


              融资格局同样应区分已观察和推断。已观察事实：2024 年和 9M25 都包含系列股份所得款和新增借款，管理层称自文件日期起至少 12 个月营运资金充足。推断部分：由于该充足性声明明确假设了被遮盖的 IPO
              所得款，外部投资者仍无法仅凭公开数据建模真实现金跑道。历史融资背景在这里只是背景，不是重复第一章。TechCrunch、PR Newswire 和 36Kr 合在一起说明，Hai
              已吸收大量私募资本。清醒的资本强度评估是：Hai 规模真实、营运资本优势真实、也有新融资支持，但尚未证明能够自我融资。
