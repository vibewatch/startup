  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 当前判断
      - 重要性
      - 决策含义
    rows:
      - - 建议
        - 观察 / 继续研究
        - 业务可信，但公开记录仍未给出清晰的入场价格或股权结构桥接。
        - 继续跟踪，但不要用不完整的价格证据强行建立信心。
      - - 信心
        - 中
        - 核心经营事实扎实且得到交叉印证，但多项定价输入仍未公开或被遮盖。
        - 采用宽区间；升级判断前，坚持补充尽调。
      - - 风险评级
        - 高
        - 客户集中、负现金流、WVR 治理以及依赖合作伙伴的执行，都可能压缩公开市场倍数。
        - 按下行不对称配置敞口，而不是按表面市场增长配置。
      - - 估值立场
        - 偏高
        - 后期私募信号并非明显离谱，但已经要求投资者穿透可见的财务和披露风险。
        - 应要求不透明折价，而不是为叙事连续性付费。
      - - 继续跟踪的支撑
        - 真实收入规模、利润率改善、软件 / 服务层和客户验证
        - Hai 已跨过许多机器人发行人始终迈不过的技术存在性和产品市场匹配门槛。
        - 把 Hai 留在主动观察名单里，不应把它当成投机泡影直接排除。
      - - 更强判断的阻碍
        - 尚无最终 IPO 价格，摊薄结构不清，也没有干净的经常性收入组合披露
        - 这些缺口让私募标记无法干净转化为可投资的入场经济性。
        - 这些事实出现前，不要从观察转向买入。
      - - 改善判断的因素
        - 更清晰的招股说明书、更好的现金转化、更低集中度，以及分拆的经常性经济性
        - 这些项目会把真实经营故事转成更站得住的公开市场故事。
        - 只有经营验证和定价验证同步改善时才升级。
    notes: 本表把保留的公开证据转成截至 2026-05-27 的当前估值判断；它不能替代实时发行条款或股权结构表尽调。
