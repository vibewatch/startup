  - id: TR006
    title: 缓释与否决标准表
    columns:
      - 风险
      - 可监测触发项
      - 阈值 / 事件
      - 行动含义
    rows:
      - - WVR 治理风险
        - 治理披露和关联方行为
        - 出现任何对少数股东不友好的决议模式、独立董事制衡乏力，或规则相关警示
        - 加大治理折价或暂停
      - - 客户集中
        - 最大客户和前五大客户集中度
        - 最大客户仍接近 ~30%，或前五大占比仍接近 ~50%，且没有多元化证据
        - 维持高风险评级，避免倍数扩张
      - - 流动性和亏损
        - 经营现金流和负债趋势
        - 经营现金流继续为负，净流动负债仍处在结构性高位
        - 把资本强度风险视为投资逻辑关键项
      - - 支持和在线率风险
        - SLA / 事故披露
        - 装机基数扩张后，仍没有可信的在线率、MTTR 或服务抵扣证据
        - 不承销高端支持利润率或粘性
      - - 合作伙伴依赖风险
        - 合作伙伴框架证据
        - 主要集成商流失、合作伙伴覆盖薄弱，或保修 / 责任条款不清
        - 假设海外扩张更慢、服务外流更高
      - - 网络安全 / 监管保证风险
        - 认证范围和事故姿态
        - 认证主张停留在营销层面，缺少范围细节或事故透明度
        - 把合规信息视为必要但不充分
      - - 竞争压力
        - 定价和胜率评论
        - 利润率明显压缩，或客户叙事转向最低成本投标
        - 降低估值容忍度，并要求更清晰的产品差异化
    notes: 否决标准刻意设成可衡量项，这样本章每轮更新时可以用更硬的证据刷新，而不是从头重写。
