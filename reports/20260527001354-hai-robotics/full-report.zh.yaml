      - number: '2.2'
        title: 买方分层、工作流以及 Hai 为何在最佳垂直领域胜出
        blocks:
          - type: paragraph
            body: >-
              即便仓库任务相似，购买动议也按垂直行业变化。运营和供应链负责人通常拥有商业论证，因为他们最先感受到用工短缺、拥堵和服务水平压力；但 IT 和仓库系统团队会决定项目能否嵌入现有 WMS 或 MES
              栈，财务最终审核回本。Hai 最适合的场景，是这些利益相关方想要高密度存储、存量场地部署、快速吞吐和料箱级灵活性，而不是整套新建输送线重建。也因此，最稳定的公开案例集中在服装、零售、3PL、医疗和混合制造。


              案例语料把这种模式具体化。Boot Barn 和 Avenue Shops 展示了服装和零售价值：不增加行走，也能提高存储密度并加快发货。CEVA 说明 3PL
              为何喜欢在受限面积内获得灵活、适合全渠道的产能。St. Luke's 说明医疗买家为何看重准确性、清洁度、控制和服务连续性。制造业目前对 Hai 来说收入域更小，但产品组合仍可通过线边配送、托盘 +
              单件拣选，以及 ERP/WMS/MES 集成来支持。跨这些细分市场，Hai 的优势不是某个神奇机器人指标，而是货到人人机工学、适合改造部署、混合容器搬运和编排软件的组合，能降低繁忙设施采用自动化时的扰动。
