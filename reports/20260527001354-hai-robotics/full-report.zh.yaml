      - number: '1.3'
        title: 资本形成、规模信号和当前牵引力
        blocks:
          - type: paragraph
            body: >-
              与许多私营仓储自动化同行相比，Hai Robotics 已经在明显更大的规模上运营；但规模叙事同时包含很强的运营信号和真实的承销保留。HKEX 文件给出最干净的当前数字：2023 年收入 RMB807.0
              million，2024 年 RMB1.36 billion，2025 年前九个月 RMB1.263 billion；毛利率从 16.0% 升至 26.3% 和 28.9%；截至 2025 年 9 月 30
              日，全球签约客户超过 800 家。文件还显示，公司已交付超过 1,300 个项目，研发人员 516 人、接近员工总数 36%，并有 2,394 项专利申请。整组数据支撑一家真正的大规模硬件 +
              软件公司，而不是仍在试点阶段的机器人厂商。


              资本形成则最好从多重视角读。TechCrunch 和 PR Newswire 记录了 2021 年 B+ 轮以及同步 C、D 轮合计约 $200 million，投资方包括 5Y Capital、Sequoia
              China、Source Code Capital、Capital Today 等。36Kr 的 IPO 前画像补充了后期背景，称公司经历 15 轮融资，累计融资约 RMB4.133 billion，Series
              E 后估值约 RMB10.9 billion。这个估值数字有信息量，但置信度仍低于运营指标，因为它来自后期媒体综合，而不是递表文件本身。文件披露的收入质量也有两面性：到 9M25，前五大客户占收入
              48.2%，最大单一客户占 30.4%，说明 Hai 已拿下大型战略客户，但尚未消除集中度风险。因此，投资者可以可信地把 Hai 视为已站上独角兽规模的 ACR 公司，同时仍要求公司进一步说明最终 IPO
              定价、当前私募到公开市场的估值标记，以及大客户胜利在周期中能否重复。
