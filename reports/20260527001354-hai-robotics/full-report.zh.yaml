      - number: '4.2'
        title: 经营表现和单位经济性代理指标
        blocks:
          - type: paragraph
            body: >-
              已观察经营规模不再是猜测。文件报告，收入从 2023 年 RMB807.0 million 升至 2024 年 RMB1.36 billion，2025 年前九个月为 RMB1.263 billion；毛利率从
              16.0% 改善至 26.3% 和
              28.9%。这个趋势方向上令人鼓舞，文件将其归因于更好的业务组合：更多非本土业务、更大项目规模、更高服务内容、更强定价条款，以及更好的制造领域项目选择。但路径仍未完成。净亏损依然沉重，销售、研发和行政费用即便收入占比下降，绝对
              RMB 金额仍然很大。


              因此，公开单位经济性只能作为代理指标处理，不能当作完整模型。最强的已观察代理包括负现金转换周期、回购率上升、每客户订单额，以及分部利润率差异。客户案例研究也有帮助，但要谨慎使用。Boot Barn、CEVA 和
              St. Luke's 提供了可信证据，说明 Hai 系统可以提高存储密度、吞吐、准确性，甚至内部控制；但这些是运营结果，不是 Hai
              自身披露的回本测算。正确的承销姿态，是把已观察和推断分开：收入规模和毛利率改善是已观察事实；CAC、回本周期、渠道利润分成和真实软件经济性在公开来源中仍未观察到。
