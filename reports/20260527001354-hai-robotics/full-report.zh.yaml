companyProfile:
  summary: >-
    Hai Robotics 是一家起步于深圳的仓储自动化公司，开创了自主料箱搬运机器人，并把一体化 HaiPick 系统、HaiPick Climb、HaiQ
    编排软件及相关服务卖给全球零售、3PL、医疗、制造和电商仓库。公开证据显示，它已是一家真正的工业公司：监管文件支持的 2024 年收入为 RMB 1.36 billion，截至 2025 年 9 月签约客户超过 800
    家，国际收入占比可观，并在 ACR 品类领先。但承销层面也有实质保留：会计亏损沉重、大客户集中、加权投票权治理，以及经常性收入占比、股权结构经济性和最终 IPO 定价披露不完整。
