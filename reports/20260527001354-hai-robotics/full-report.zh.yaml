      - number: '7.2'
        title: 运营、支持与合作伙伴依赖风险
        blocks:
          - type: paragraph
            body: >-
              对一家自动化公司来说，这份监管文件对运营脆弱性的表述异常直接。Hai
              称其技术基础设施可能遭遇系统故障、中断、不足、安全漏洞、网络攻击、网络过载、电信故障和断电，并明确把这些事件与可用性损失、客户不满、未来收入下降和监管审查联系起来。这一点重要，因为公司呈现的不是一件简单的仓库硬件，而是一套实时控制栈，依赖机器人、控制系统、软件和联网网络在真实世界的可用性预期下协同运转。公司自己的
              IEC 62443
              解读也强化了这一点：仓库机器人和控制系统正越来越多地与企业平台、云系统和合作伙伴网络集成。因此，网络安全叙事两面都有：可见的合规工作和安全开发主张是真实缓释项，但集成表面也很宽，而且公开材料中看不到事件台账或可用性
              SLA。


              执行复杂度会放大这种技术风险。Hai 现有现场和工程岗位要求固件工作、WMS 与 PLC 集成、验收测试、现场检查、网络搭建、安全规划、LiDAR
              和摄像头校准，以及根因分析。这种交付画像一方面靠实操经验打出护城河，另一方面也带来扩张风险：如果经验丰富的人太少，却要支撑太多上线站点，问题会被放大。合作伙伴依赖是第二个放大器。文件称渠道合作伙伴仍贡献了有意义的收入份额，并且在非本土市场至关重要；它们往往负责初始售后支持、安装协调、维修和索赔处理。文件还警示，合作伙伴可能不遵守法律或协议，可能优先服务竞争对手，也可能因不当行为伤害
              Hai。与 TGW 和 Dematic 的官方合作显示了真实商业杠杆和合同缓释——培训、质量、备件、保修和责任框架都看得见——但它们也确认了核心依赖：海外规模是通过 Hai 无法完全控制的生态系统实现的。
