      - number: '8.4'
        title: 退出就绪度与最终尽调问题
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，Hai
              还没有达到退出就绪，但已经足够接近，值得做聚焦尽调，而不是被动关注。公司有足够商业证据，能越过“这是否真实”的门槛。官方客户和合作伙伴材料展示了生产部署、企业用例和国际渠道规模。市场报告显示，这个品类仍有结构性顺风。这些都是继续跟踪的理由。但缺失项恰好是决定入场价格和下行的东西。公开来源仍没有给出干净的股权结构表桥接、清算优先权地图、最终价格区间，也没有给出可让投资人把
              Hai 与已披露公开同行归一化比较的经常性收入和队列披露。


              因此，最有用的尽调问题应直接指向那些真正会改变建议的内容。第一，拿到股权结构表，以及从最后一轮私募到任何拟议公开定价的桥接。第二，要求拆分硬件、软件、维护和支持经济性。第三，测试集中度是在缓解，还是只是被增长掩盖。第四，验证海外支持经济性，而不是假设它理应获得溢价。在这一整套信息可得之前，Hai
              仍是一家值得监控、具备真实战略价值但定价不完整的公司。这让当前立场既明确又有证据基础：观察 / 继续研究，不是因为业务弱，而是因为最重要的估值输入仍只有部分公开。
