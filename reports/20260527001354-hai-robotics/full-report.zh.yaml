      - number: '7.4'
        title: 缓释、杀伤条件与开放证据缺口
        blocks:
          - type: paragraph
            body: >-
              Hai 并非无视这些风险。公开记录显示了几项具体缓释：HKEX 的 WVR 规则手册施加结构性护栏；公司已经展示 RED 和 IEC 网络合规工作；与 Dematic 和 TGW
              的合作伙伴框架明确提到培训、保修、备件和责任；Hai 还在 2026
              年新增美国领导层，负责客户支持、软件和合作伙伴发展。这些信号有意义，因为它们直接对应最重要的失效模式。但缓释成熟度并不均衡。可见公开来源没有披露面向客户的 SLA
              经济性、事件率、供应商集中度、保修索赔频率或诉讼清单。换句话说，公司显然在搭建缓释脚手架，但公众投资人仍无法判断这套脚手架是过度建设、建设不足，还是经济上高效。


              因此，本章最有用的杀伤条件应该具体且可监控，而不是修辞化。若下一披露期里最大客户占比仍接近当前极端水平，若经营性现金生成没有令人信服地转正，若支持仍依赖不透明的合作伙伴交接且缺少可见 SLA
              证据，或若网络与监管保障仍停留在营销层面的认证声明，风险判断就应变硬，而不是变软。反过来，如果 Hai 证明集中度缓解、流动性更干净、支持和保修经济性的披露更好，并证明 WVR
              治理靠克制运作而不只是靠规则要求，投资逻辑就会改善。本章最终判断因此很克制：Hai 的许多最高风险已经可观察、可排序；若干缓释看得见；剩余未知足够具体，可以转成尽调清单，而不是泛泛的不安。
