  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与估值框架
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics 更容易被尊重，却不容易被定价。业务显然真实：HKEX 申请版本显示，公司已有工业级收入、明显改善的毛利率、超过 800
              个签约客户，以及可见的重复部署行为。官方产品和客户来源也显示，Hai
              不是简单把机器人运进仓库；它有软件层、客户特定的部署证据，以及足以支撑国际扩张的合作伙伴基础设施。这些要素让公司值得跟踪，而不是被忽视。这也是本章不会以“回避”收尾的原因。


              但证据仍不够干净，无法支撑买入式建议。文件仍是申请版本，没有最终公开发行价区间；后期私募估值信号来自媒体报道，而不是已签发的投资条款书；公司也仍在亏损、烧钱，并高度集中于大客户。这个组合很重要，因为公开市场估值不只看工业进展，也看披露质量、进入纪律和下行保护。基于当前记录，决定性判断因此是观察
              / 继续研究：中等信心、高风险；若从报道的后期私募估值出发，估值立场偏高。正确问题不是 Hai 有没有做出有意义的东西。它显然做到了。正确问题是，今天能否用公开证据干净地承销这个价格。答案仍是否定的。
