      - CU029
      - CU040
  - id: FU002
    title: 采用 / 部署漏斗
    type: flow
    layout: wide
    summary: Hai 的客户动作看起来是从渠道辅助或直销的企业级拓客进入具体站点部署，再进入生产使用、峰值验证和 选择性分阶段扩张，而不是进入干净的订阅续约循环。
    data:
      nodes:
        - id: discover
          label: 直销 + 渠道拓客
          detail: Hai 通过直销以及 Hy-Tek、FORTNA、Conveyco、Zion、Equipment Depot 等集成商触达 潜在客户。
        - id: design
          label: 按场地定制方案设计
          detail: 项目围绕仓库画像、货架、作业流和集成需求来工程化交付，而不是当作自助式软件售卖。
        - id: deploy
          label: 初始部署
          detail: 系统上线后，已投产案例通常会披露机器人数量、存储位或设施面积。
        - id: prove
          label: 运营验证
          detail: 客户在真实运营中用吞吐、密度、用工或准确率结果来验证价值。
        - id: expand
          label: 扩张 / 复购
          detail: 最有说服力的公开复购信号来自分阶段扩建、复购率改善和旺季弹性。
        - id: risk
          label: 集中度核查
          detail: 大客户成功也可能抬高依赖度，因为头部客户在收入中的占比会变大。
      edges:
        - from: discover
          to: design
          label: 合作伙伴验证的需求
        - from: design
          to: deploy
          label: 项目合同
        - from: deploy
          to: prove
          label: 上线结果
        - from: prove
          to: expand
          label: 重复阶段或后续订单
        - from: expand
          to: risk
          label: 拿下标杆客户可能推高企业客户集中度
    approximationNotes: 流程抽象自监管文件和具名案例研究中的常见模式，并非披露的内部漏斗转化模型。
    claimRefs:
      - CU012
      - CU013
      - CU016
      - CU029
      - CU032
      - CU033
      - CU037
      - CU038
      - CU041
  - id: FR001
    title: 风险热力图
    type: matrix
    layout: wide
    summary: 最高的剩余风险来自治理控制、客户集中度、流动性以及运营 / 合作伙伴执行，而不是单纯的市场需求。
    data:
      columns:
        - 发生概率
        - 影响
        - 缓释成熟度
        - 剩余严重性
      rows:
        - label: WVR 治理
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 客户集中度
          values:
            - 高
            - 高
            - 低
            - 高
        - label: 流动性 / 亏损
          values:
            - 高
            - 高
            - 中
            - 高
        - label: 合作伙伴治理
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 运营中断
          values:
            - 中
            - 高
            - 中
            - 高
        - label: 供应商 / 出口管制
          values:
            - 中
            - 中
            - 低
            - 中
        - label: 竞争性定价压力
          values:
            - 中
            - 中
            - 中
            - 中
        - label: 隐私 / 监管变化
          values:
            - 中
            - 中
            - 中
            - 中
    approximationNotes: 定性评级按当前公开证据集排序，而不是任何内部企业风险模型。
    claimRefs:
      - CR002
      - CR012
      - CR024
      - CR033
      - CR036
      - CR038
      - CR040
      - CR046
  - id: FR002
    title: 风险传导图
    type: dag
    layout: wide
    summary: 最大的下行路径会沿合作伙伴执行、中断事件和客户集中度，传导到利润率、现金生成和估值。
    data:
      nodes:
        - id: wvr
          label: WVR 控制
          detail: 创始人投票控制权可能限制外部对战略及控制权变更结果的影响力。
        - id: partner
          label: 合作伙伴依赖
          detail: 集成商和渠道伙伴把销售、服务和本地化延伸出去。
        - id: support
          label: 支持质量
          detail: 现场执行、备件和响应时间决定上线后的客户信任。
        - id: outage
          label: 中断 / 网络安全事件
          detail: 网络、电力、电信或网络安全故障会打断仓库运营。
        - id: concentration
          label: 客户集中度
          detail: 少数客户贡献很大一部分收入和订单获取。
        - id: margin
          label: 利润率压力
          detail: 定价让步、服务漏损或返工会压缩经济性。
        - id: cash
          label: 现金生成
          detail: 持续亏损和交付义务挤压流动性。
        - id: valuation
          label: 估值上限
          detail: 治理、集中度和现金风险限制公开市场对倍数的容忍度。
        - id: trust
          label: 客户信任
          detail: 可靠性和合规证据影响续约，也影响合作伙伴推广 Hai 的意愿。
        - id: growth
          label: 国际增长
          detail: 海外规模扩大既放大机会，也拉高执行和合规负担。
      edges:
        - from: wvr
          to: valuation
          label: 治理折价
        - from: partner
          to: support
          label: 服务交接
        - from: partner
          to: growth
          label: 市场触达
        - from: growth
          to: partner
          label: 本地化能力需求
        - from: support
          to: trust
          label: 场地表现
        - from: outage
          to: trust
          label: 可用性冲击
        - from: trust
          to: concentration
          label: 续约 / 多元化
        - from: concentration
          to: margin
          label: 客户议价能力
        - from: margin
          to: cash
          label: 盈利能力下降
        - from: cash
          to: valuation
          label: 融资风险
        - from: outage
          to: cash
          label: 返工和收入流失
        - from: partner
          to: valuation
          label: 执行依赖
    approximationNotes: 图中逻辑综合了已保留来源中的因果线索，不是内部预测模型。
    claimRefs:
      - CR003
      - CR012
      - CR024
      - CR025
      - CR033
      - CR036
      - CR038
      - CR040
      - CR041
      - CR047
  - id: FV001
    title: 建议逻辑
    type: flow
    layout: wide
    summary: Hai 值得继续观察，因为运营验证真实存在；但定价证据不完整、风险可见，本章还不足以给出买入建议。
    data:
      nodes:
        - id: n1
          label: 真实收入规模 + 毛利率改善
        - id: n2
          label: 软件、服务与客户验证
        - id: n3
          label: 后期私募信号存在
        - id: n4
          label: 亏损 + 集中度 + WVR 风险
        - id: n5
          label: 没有最终 IPO 定价或股权结构桥接
        - id: n6
          label: 建议：观察 / 继续研究
      edges:
        - from: n1
          to: n6
          label: 支撑 Hai 的可信度
        - from: n2
          to: n6
          label: 支持继续跟进
        - from: n3
          to: n6
          label: 锚定区间
        - from: n4
          to: n6
          label: 让风险保持高位
        - from: n5
          to: n6
          label: 挡住更干净的买入逻辑
    claimRefs:
      - CV001
      - CV004
      - CV010
      - CV023
      - CV034
      - CV036
      - CV039
      - CV044
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: standard
    summary: 用公开可比公司和 Hai 可见的私募信号作为方向锚，做示意性销售倍数敏感性分析。
    data:
      items:
        - label: 悲观公开市场风格销售倍数
          value: 4
          note: 如果集中度、烧钱和不透明度主导叙事，示意性打折。
        - label: 基准公开市场风格销售倍数
          value: 6
          note: 如果增长和毛利率改善延续，但不透明度拿不到溢价，示意性取中点。
        - label: Hai 推算的后期私募倍数
          value: 8
          note: 大约为 10.9B RMB 除以 2024 年收入 1.3604B RMB。
        - label: AutoStore 公开 P/S
          value: 7.38
          note: 由公开市值和 LTM 收入推导。
        - label: Symbotic 公开 P/S
          value: 12.66
          note: 由公开市值和 LTM 收入推导。
    approximationNotes: 敏感性分析混合使用 Hai 的示意性情景倍数，以及 AutoStore 和 Symbotic 的公开滚动销售倍数。目的在于约束敏感性，而不是精确套用可比估值。
    claimRefs:
      - CV017
      - CV019
      - CV023
      - CV024
      - CV037
      - CV049
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 基于公开证据情景假设给出 Hai 的悲观、基准和乐观股权价值区间，并把后期私募信号作为参考锚。
    data:
      items:
        - label: 悲观情景股权价值
          low: 6
          base: 7
          high: 8.5
          unit: RMB B
          note: IPO 草案、集中度和现金消耗折价占主导。
        - label: 基准情景股权价值
          low: 9
          base: 10.5
          high: 12
          unit: RMB B
          note: 增长和毛利率改善延续，但不透明度压住溢价。
        - label: 乐观情景股权价值
          low: 12
          base: 13.5
          high: 15
          unit: RMB B
          note: 披露更清晰、经常性质量证据更强，支撑更高区间。
        - label: 后期私募信号锚
          low: 10
          base: 10.9
          high: 11.5
          unit: RMB B
          note: 围绕 36Kr 报道的 Series E 后估值给出的方向性区间。
    approximationNotes: Hai 的所有区间都是基于公开证据的分析师判断，不应误读为市场报价或最终 IPO 区间预测。
    claimRefs:
      - CV002
      - CV023
      - CV030
      - CV031
      - CV032
      - CV033
      - CV049
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: standard
    summary: 以 IC 视角给最关键维度打分，判断 Hai 的商业验证能否转化为估值信心。
    data:
      items:
        - label: 市场顺风
          value: 8
          note: 仓储自动化需求仍有结构性支撑。
        - label: 产品验证
          value: 8
          note: 官方客户和合作伙伴证据显示，真实部署已经越过试点阶段。
        - label: 客户耐久性
          value: 6
          note: 复购和重复部署信号真实存在，但集中度太高。
        - label: 经济性轨迹
          value: 5
          note: 收入规模和毛利率在改善，但现金生成仍弱。
        - label: 风险 / 治理
          value: 3
          note: WVR、集中度和执行依赖让风险堆栈维持高位。
        - label: 估值清晰度
          value: 3
          note: 最终 IPO 定价区间或股权结构桥接尚未公开。
        - label: 证据质量
          value: 6
          note: 证据足以支撑观察判断，但还不足以支撑带价格信心的判断。
    claimRefs:
      - CV014
      - CV035
      - CV036
      - CV038
      - CV039
      - CV046
      - CV051
