  - id: TV002
    title: 投资逻辑 / 反向逻辑表
    columns:
      - 视角
      - 投资逻辑
      - 反向逻辑
      - 什么会改变判断
    rows:
      - - 市场和品类
        - 仓储自动化仍是结构性增长品类，真实需求驱动仍在。
        - 品类增长挡不住拥挤赛道里的价格压力或倍数压缩。
        - 展示持续定价权或更清晰的市占经济性，而不只是扩大 TAM。
      - - 产品和软件
        - Hai 有软件层，也有企业工作流验证，价值不只来自硬件出货。
        - 公开证据仍未量化软件组合、续约质量或分业务利润率。
        - 披露经常性收入组合、附加率和分业务利润率。
      - - 客户质量
        - Hai 已有规模、重复部署，以及全球超过 800 家签约客户。
        - 同一份申报也显示，大客户集中度极高，且客户数混入合作伙伴口径。
        - 降低最大客户依赖，并在混合合作伙伴账户之外证明队列韧性。
      - - 海外增长
        - 海外占比和官方合作伙伴扩张，可以支撑更高质量的增长叙事。
        - 国际增长也会增加支持成本、执行负担和利润外流风险。
        - 用披露的 KPI 证明海外支持经济性和服务质量。
      - - 私募估值信号
        - 36Kr 报道的后期标记有方向性支撑，因为公司有真实收入和品类领导地位。
        - 定价、摊薄和优先权未披露时，媒体报道的后期标记并不等于公开市场公允价值。
        - 公布从私募轮经济性到拟议公开估值的真实桥接。
      - - 公开退出路径
        - Geekplus 和其他机器人上市案例显示，市场能为仓储自动化龙头提供资金。
        - 公开市场投资者已经可以买到披露充分的同业，Hai 不能只依赖品类热情。
        - 要么提供更干净的披露，要么给出相对公开可比公司的明确折价入场点。
    notes: 反向逻辑刻意聚焦经济性，而不是话术：问题不在 Hai 是否真实，而在当前公开证据能否让价格可信。
