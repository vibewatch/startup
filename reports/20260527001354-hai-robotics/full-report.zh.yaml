  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品栈和工作流适配
        blocks:
          - type: paragraph
            body: >-
              与其把 Hai Robotics 的公开产品故事讲成一串机器人型号，不如讲成一套工作流栈。递表文件和官方解决方案页把 HaiPick Systems
              呈现为模块化家族，覆盖三个反复出现的仓库任务——高密度存储、订单暂存与合流、整箱搬运——再加上面向更高密度攀爬取货的新 HaiPick Climb 架构。System 1 是基础货到人配置；System 2
              加入重载 AMR，处理大件和托盘；System 3 加入高速转运配套 AMR、链式拣选存储，并更明确支持托盘、纸箱和原包装。围绕这些系统的是
              HaiQ、多种工作站形态、自有充电器，以及更宽的硬件目录，包括伸缩式、抓钩式和叉举式 ACR 变体。


              这套栈重要，因为它解释了 Hai
              为何能够可信覆盖零售、服装、3PL、医疗和部分制造场景，而不必公开展示每个垂直行业都有完全不同的软件或硬件栈。官方下载中心列出面向制造的材料，系统页也提到线边配送和成套配料，但最强的公开证明仍在仓库拣选、料箱搬运和改造重的履约场景。换句话说，制造看起来是同一模块化料箱搬运平台的延伸，而不是一条单独有充分文件证明的产品家族。因此，公开语料对模块可见性很强，对制造延伸在实践中能走多远则较弱。
