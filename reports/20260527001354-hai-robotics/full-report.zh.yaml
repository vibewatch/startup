  - id: TM001
    title: 市场定义表
    columns:
      - 品类
      - 纳入支出
      - 排除支出
      - 典型买方 / 付款方
      - 与 Hai 的关系
    rows:
      - - 仓库自动化
        - 仓库和配送中心内部的机器人、输送线、分拣、WMS/WES、控制软件和实施服务
        - 仓储之外的工厂车间自动化、干线运输、包裹最后一公里，以及纯非仓库软件
        - 供应链、运营、IT、财务
        - 可作为 TAM 上限，但过宽，不能称为 Hai 的直接市场
      - - 仓库机器人
        - AS/RS 机器人、AMR、AGV、机器人拣选、存储和取回设备
        - 没有机器人元素的纯输送线或纯软件项目
        - 运营和工程
        - 更接近 Hai，但仍包含 Hai 不直接销售的架构
      - - 货到人（G2P）
        - 将料箱、周转箱、纸箱或箱件送到固定工作站用于拣选或补货的系统
        - 手推车人工拣选、没有工作站交付的纯运输机器人，以及非拣选自动化
        - 履约运营
        - Hai 最常竞争的核心作业族群
      - - ACR 解决方案
        - 箱级取货机器人、配套货架、工作站、软件，以及与 ACR 部署绑定的实施和支持
        - 货架到人 AMR、搬运整箱料箱的立方体仓储系统，以及不直接拣选箱件的重型固定式 AS/RS
        - 运营和自动化负责人
        - Hai 自称领先的直接品类
      - - 维持现状的替代项
        - 人工拣选、叉车、局部输送线改造、只靠增派临时工应对高峰
        - 不计入正式自动化总可用市场（TAM）
        - 仓库经理和财务
        - 仍然重要，因为买方拿 Hai 比的不只是竞品机器人，也包括少做自动化
    notes: 该表把宽口径市场表述和 Hai 更窄的直接品类分开。更适合投资测算的口径接近拣选密集型 G2P 和 ACR，而不是全部仓储自动化开支。
