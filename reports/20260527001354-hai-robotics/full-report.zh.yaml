      - number: '3.3'
        title: 定价可见度、渠道权力和切换成本
        blocks:
          - type: paragraph
            body: >-
              仓储自动化的竞争结果，受打包方式和渠道影响不亚于机器人规格。Hai 文件显示，渠道伙伴仍贡献可观收入，公司已与全球十大系统集成商中的六家建立合作。这是真优势，因为它扩大了本地交付能力，也让 Hai
              在大型复杂项目中更有可信度。但这不是垄断机制。Geek+ 同样谈认证本地伙伴，AutoStore 拥有长期形成的伙伴生态，Quicktron 也明确在为国际市场搭建渠道和模块化打法。集成商帮助 Hai
              扩张，但也可以把多种竞争架构摆到买家面前。


              公开定价证据比架构证据薄得多。AutoStore 通过 Pio 的订阅式入口和面向投资者的披露界面，提供了最清晰的打包信号。除此之外，公开来源大多展示项目框架、模块化主张和定性 ROI
              语言，而不是已实现的价格曲线。这一点重要，因为切换成本和多供应商并用取决于买家实际承诺了什么。立方体系统和高密度货架系统可能形成很深的物理锁定。AMR
              叠加层和厂商中立的编排层，则为混合车队、分阶段推出和后续替换供应商留下更多空间。Hai
              处在两端之间：系统一旦安装，就会产生有意义的物理和软件切换摩擦；但其存量场地友好的设计和重渠道动议，仍让它没有专有立方体网格那么绝对。买家因此必须同时评估架构和生态，而不只是机器人速度。
