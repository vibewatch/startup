        - 约束因素
        - 当前
        - 项目成败取决于实施质量，不只是机器人性能
        - 每个部署项目需要多少定制？
      - - 宏观周期性和客户预算敏感度
        - 约束因素
        - 当前至中期
        - 即便品类长期增长强，也可能拖慢采购
