      - number: '3.4'
        title: 护城河耐久性和拥挤问题
        blocks:
          - type: paragraph
            body: >-
              合适的审慎视角是：Hai
              的护城河真实，但很具体。它真实，是因为公司拥有许多运营方确实需要的一组工作流能力：高密度改造部署、垂直触达、料箱或纸箱搬运，以及覆盖存储、暂存和履约的软件驱动编排。公开来源足以支持这个楔形市场的重要性。问题在于，大多数强竞品已经不再讲狭窄的单机器人故事。AutoStore
              在高密度装机基础上增加 AI 驱动拣选和更灵活的工作站。Geek+ 以大规模 AMR 为基础，组合货架、料箱、托盘和机械臂模块。GreyOrange 推动跨大型装机网络的厂商中立编排。Locus
              试图围绕货到机器人和自主巷道内订单完成重新定义前沿。Quicktron 则迈向同一设施中包含料箱和托盘模块的一平台多场景自动化。


              市场结构也强化了这种谨慎。Mordor 的 2026 年观点称，移动机器人已占仓储自动化支出的较大份额，单件拣选是增长最快的子细分领域。与此同时，TBRC
              的主要玩家名单显示，即便架构不同，仍有许多规模不小的厂商能可信地进入同一买方对话。这意味着 Hai 同时暴露在两条战线：产品趋同和披露审查。随着 Hai
              走向公开市场，投资者会把它的定价、单位经济性和护城河主张，与 AutoStore 和 Geek+ 等披露更多的公开同行比较，而不只是与私营市场营销叙事比较。结论是，Hai
              的优势应被承销为拥挤市场中的工作流专属护城河，而不是无争议的平台垄断。
