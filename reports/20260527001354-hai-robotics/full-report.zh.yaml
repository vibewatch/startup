  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和品类定义
        blocks:
          - type: paragraph
            body: >-
              分析 Hai Robotics
              的正确起点，不是整个仓储自动化预算，而是仓库工作中更窄的一块：料箱级拣选、存储密度和减少操作员行走最关键的场景。公开市场报告通常把仓储自动化放得很宽，把机器人、输送线、分拣、软件和服务都并入其中。Hai
              自己的递表文件划线更紧：它聚焦仓库拣选，把 ACR 定义为只从货架取出所需料箱的机器人，并明确将这种架构与在地面搬动整排货架的货架式 AMR 区分开。这个差别重要，因为比较 Hai
              的买家通常是在不同拣选和补货自动化路径之间选择，而不是一次性决定是否自动化整个仓库功能。


              做市场规模时，广义仓储自动化仍可作为天花板视角：Mordor 和 TBRC 都描述了 2026 年全球市场约在 USD-30 billions 中段，并保持双位数增长。但 Hai 的直接战场更接近 CIC
              经由递表文件测算的仓储拣选自动化楔形市场，2026E 规模为 RMB 232.6 billion；再窄一层，是该楔形中的 ACR 部分，2026E 为 RMB 9.8
              billion。因此，定义层级应从仓储自动化，到仓储机器人，到货到人，最后到 ACR。第二章应把这些层次分开，因为把完整仓储自动化 TAM 称作 Hai 的直接市场，会夸大其当前产品组合和购买动议实际覆盖的范围。
