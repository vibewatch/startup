      - number: '5.3'
        title: 部署、制造和渠道依赖
        blocks:
          - type: paragraph
            body: >-
              Hai 的模块化故事一部分是产品护城河，一部分是实施模型。官方页面称，Hai
              掌握智能设备层——机器人、工作站、安全设备和充电器——同时允许货架、周转箱、输送线和围栏等结构件本地采购。这对存量场地经济性和贸易摩擦韧性都重要。它可以减少必须跨境运输的专有基础设施数量，也解释了为什么
              FORTNA、Hy-Tek、Conveyco 和 Zion Solutions Group 等伙伴能把 Hai 打包进更大的集成项目。公开伙伴页一贯把 Hai 定位为更宽运营设计、WES/WCS
              和生命周期服务中的可配置货到人引擎。


              同一组证据也说明执行风险为何仍有意义。公开工程岗位提到固件设置、WMS 和 PLC 集成、网络、现场检查、DM-code 安装、LiDAR
              和深度相机校准、路径规划调参和根因分析。这不是玩具自动化叠加层的特征，而是真实企业系统的特征，调试和支持需求不低。好处是，这种专有经验很难快速复制。坏处是，在现场条件、伙伴质量和客户流程纪律开始起作用之前，标准化能走的距离有限。因此，Hai
              的产品技术护城河不只是机器人设计，而是模块化硬件、编排软件和交付打法的组合，让公司及其集成商能够把异质站点做得像可重复部署。
