  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争范式和 Hai 周围的真实格局
        blocks:
          - type: paragraph
            body: >-
              给 Hai Robotics 设定竞争框架时，不能把每家仓储自动化厂商都拉进来，而要看买家自动化同一类重拣选任务时，有哪些可信路径可选。Hai 自己的递表文件和产品页把公司放在 ACR
              与料箱搬运车道：机器人从货架取出特定料箱或纸箱，送到工作站，并越来越多地把存储、暂存、合流和整箱工作流放进同一套栈。这让 AutoStore
              成为高密度货到人存储上的近似替代，但不是完全同类可比；AutoStore 的立方体模型优化专有网格内的料箱，而 Hai
              的公开证据最强处，是运营方想改造现有建筑、向上利用高度，并保留纸箱或单件原包装的场景。Geek+ 从另一个方向拓宽战场，覆盖货架到人、料箱到人、托盘到人和机械臂拣选。GreyOrange
              通过可位于混合车队之上的控制层竞争，Locus 和 Quicktron 则把市场边界推向自主巷道拣选和模块化多工作流系统。


              这很重要，因为竞争压力按架构变化。Hai 最强的公开证明点是密度、改造适配，以及受限仓库中的料箱或纸箱搬运。AutoStore 对绝对立方体密度和成熟软件支撑的吞吐讲出了最强故事；Geek+
              带来广度和货架到人规模；GreyOrange 从编排和异构车队控制切入；Locus 推动单件拣选自主化和巷道内完成；Quicktron
              则在统一控制栈下组合料箱、货架、托盘和物料搬运。现状替代也仍然存在。当扰动风险或回本不确定性较高时，买家仍可选择人工拣选、流程重设计或较小型输送线改造。因此，竞争章节必须比较范式，而不只是比较公司标识。
