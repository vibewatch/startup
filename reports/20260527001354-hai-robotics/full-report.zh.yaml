        - 高 SKU 零售、3PL 和补货流程
        - 对箱件或纸箱处理的直接优化较少
      - - 厂商中立编排加 GTP
        - GreyOrange
        - 软件在混合环境中协调机器人、人员和系统
        - 可灵活适配存量系统和混合车队
        - 多站点网络优化和异构自动化
        - 差异化很大程度取决于编排证据
      - - 机器人到货位 / 巷道内自主拣选
        - Locus Array
        - 机器人到达货位，并在巷道内完成作业
        - 避开固定工作站，也能跨楼层扩展
        - 自主拆零拣选和减少人工
        - 商业化阶段更早，执行风险更高
