    rows:
      - - 初始项目交付和部署
        - 特定仓库项目交付并部署时收取一次性费用
        - 监管文件明确披露其为重要收入来源
        - 已观察且披露清楚；具体占比未公开
        - 该收入存在的能见度高，但收入结构集中度让经常性占比不透明
        - 按地区、领域、新项目 vs 扩张项目拆分部署收入
      - - 售后维护包
        - 上线后付费支持
        - 监管文件称经常性收入包括售后维护包
        - 经常性尾部已确认；附加率和续约率未公开
        - 支持尾部存在，但质量和利润率没有公开分拆
        - 提供保修转付费维护的转化率和续约队列
      - - 软件 / HaiQ
        - 随部署附加的仓库执行、编排和集成软件
        - 监管文件把软件列入经常性收入；HaiQ 页面展示 ERP/WMS/MES 集成和编排
        - 软件层明确存在；独立软件收入未公开
        - 可能是有吸引力的结构驱动项，但独立经济性未披露
        - 披露软件收入、附加率和独立毛利率
      - - 运营和技术支持
        - 实施后持续技术指导和运营支持
        - 监管文件把运营和技术支持列入经常性收入
        - 已观察为经常性模式的一部分；没有单独收入项
        - 支持看起来有意义，但变现深度不清楚
        - 展示人工结构、备件附加和付费支持利润率
      - - 扩张和重复部署
        - 初次成功后，客户在既有站点增加机器人，或启动新站点
        - 监管文件引用 68% 到 80% 的复购率提升；Boot Barn 一年内扩张三次
        - 已观察到重复需求信号，但扩张收入占比未公开
        - 只要利润率守住，重复部署能支撑收入质量
        - 把订单流入和收入拆为首站、扩张站点和多站点队列
      - - 渠道牵引项目
        - 集成商或渠道合作伙伴销售，并常管理项目生命周期的一部分
        - 监管文件称，渠道合作伙伴在 2023、2024 和 9M25 分别贡献收入的 36.3%、39.5% 和 25.9%
        - 渠道仍然重要，尤其对国际扩张
        - 有利于触达，但伙伴经济性和利润分成仍不透明
        - 披露渠道毛利率、实施责任和伙伴激励
    notes: 基于监管文件加官方产品和伙伴页面；本表把已确认的收入机制与缺失的结构披露分开，而不是估算未披露份额。
