      "calloutType": "insight",
      "title": "Working-capital structure helps without solving capital intensity",
      "body": "Customer advances and a deeply negative cash conversion cycle are genuine positives, yet they should not be mistaken for a self-funding model. They soften the burn profile but do not remove the need to manage financing, liabilities, and delivery execution tightly.",
