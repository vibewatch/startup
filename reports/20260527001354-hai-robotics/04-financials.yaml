  "sections": [
    {
      "id": "revenue-model-and-pricing-opacity",
      "title": "Revenue model and pricing opacity",
      "body": "Observed evidence is strong on architecture and weak on exact monetization depth. The HKEX application proof is explicit that Hai books a significant portion of revenue from one-time project delivery and deployment, then earns recurring revenue from maintenance packages, software, and operational and technical support once systems are live. That lets this chapter describe Hai as a blended hardware-plus-software-plus-services business rather than a pure equipment seller. Public sources also support a two-lane go-to-market motion: direct sales for strategic and KA customers, plus a meaningful channel partner contribution that has ranged from about one-quarter to two-fifths of revenue. Official partner pages reinforce that this is not a thin referral model; Hai is investing in partner training, pre-sales simulation, and joint market management.\n\nWhat the public record does not reveal is just as important. No retained source breaks out recurring mix, software revenue, maintenance attach, or ARR-like metrics. Official product pages explain HaiQ, HaiCharger, and modular systems, but they still do not publish list pricing or discount bands. Even Hai's RaaS blog should be treated carefully: it shows the company discussing a leasing-style opex model conceptually, not reporting that model as a current disclosed revenue line. The sober takeaway is therefore observed rather than inferred: Hai has a real service and software tail, but the public record is not detailed enough to price that tail or determine how much of gross-margin improvement comes from recurring monetization versus better project mix.",
