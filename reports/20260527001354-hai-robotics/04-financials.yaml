    "title": "Financials",
    "summary": "Hai Robotics enters the IPO process with real industrial scale—RMB1.36 billion of 2024 revenue, improving gross margin, and a disclosed blend of project revenue plus recurring support and software—but public evidence still leaves crucial underwriting inputs opaque. The filing shows persistent losses, negative operating cash flow, rising liabilities, and meaningful customer concentration, while January 2026 cash improved after fresh financing. The resulting financial read is sober: economics are improving, yet capital intensity and disclosure gaps remain material."
