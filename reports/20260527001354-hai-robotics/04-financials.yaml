    {
      "id": "financial-verdict-and-evidence-gaps",
      "title": "Financial verdict and evidence gaps",
      "body": "The financial verdict is therefore mixed but not confused. Observed evidence supports a company with real industrial revenue, improving gross margins, and a business model that can reuse customer relationships through software, maintenance, support, and site expansion. Observed evidence also supports a still-heavy capital-intensity profile: large accounting losses, negative operating cash flow, rising liabilities, customer concentration, and continued dependence on external financing and prepayments. Adverse coverage from Bamboo Works and the Bamboo-authored Benzinga cross-post is directionally consistent with the filing on those points, while newer IPO summaries such as Pandaily and Sahm mostly restate the filing rather than closing the important diligence gaps.\n\nThe practical conclusion is to avoid over-precision. Public evidence does not support exact claims about ARR, product-level gross margin, CAC, burn multiple, or runway months. Nor does it support confident assumptions about realized pricing or channel economics. What it does support is a narrower and more defensible statement: Hai is improving economically, but it remains a capital-intensive warehouse-automation company whose path to public-market quality still depends on mix, execution, and disclosure catching up with scale. That makes Chapter 4 fundamentally a chapter about both progress and missing data, not just progress.",
