      - number: '7.2'
        title: Operational, support, and partner-dependency risk
        blocks:
          - type: paragraph
            body: >-
              The filing is unusually direct about operational fragility for an automation business. Hai says its
              technology infrastructure may suffer system failures, interruptions, inadequacy, security breaches,
              cyber-attacks, network overload, telecommunication failures, and power loss, and it explicitly links those
              events to lost availability, customer dissatisfaction, lower future revenue, and regulatory scrutiny. This
              is important because the company is not presenting a simple piece of warehouse hardware; it is presenting
              a live control stack that depends on robots, control systems, software, and connected networks operating
              together under real-world uptime expectations. The company’s own IEC 62443 explainer reinforces that point
              by describing warehouse robots and control systems as increasingly integrated with enterprise platforms,
              cloud systems, and partner networks. The cyber story therefore cuts both ways: visible compliance work and
              secure-development claims are real mitigants, but the integration surface is also wide, and no public
              incident ledger or uptime SLA is visible.


              Execution complexity compounds that technical risk. Hai’s current field and engineering roles require
              firmware work, WMS and PLC integration, acceptance testing, site inspection, network setup, safety
              planning, LiDAR and camera calibration, and root-cause analysis. That is exactly the kind of delivery
              profile that creates moat through know-how while also creating a scaling risk if too few experienced
              people have to support too many live sites. Partner dependence is the second amplifier. The filing says
              channel partners still account for a meaningful share of revenue and are essential in non-domestic
              markets, where they often own initial after-sales support, installation coordination, repairs, and claims
              handling. The filing also warns that partners may fail to comply with laws or agreements, may prioritize
              competitors, and may damage Hai through misconduct. Official partnerships with TGW and Dematic show real
              commercial leverage and contractual mitigation—training, quality, spare-parts, warranty, and liability
              frameworks are all visible—but they also confirm the core dependency: overseas scale is being achieved
              through ecosystems Hai does not fully control.
