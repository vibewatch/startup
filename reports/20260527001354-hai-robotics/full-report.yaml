      - number: '1.2'
        title: Founders, governance, and leadership bench
        blocks:
          - type: paragraph
            body: >-
              The user-supplied founder background needed correction during research. The most authoritative public
              source in the reviewed corpus is the HKEX application proof, which states that Hai Robotics was founded in
              December 2016 by Chen Yuqi, Xu Shengdong, and Fang Bing. Chen serves as chairman and chief executive
              officer, Xu as chief technology officer, and Fang as chief operating officer. The filing biographies make
              the founder-market-fit story credible: Chen previously worked on optical-modulator controller R&D and
              became the company-facing strategist and fundraiser; Xu leads core product R&D with robotics training from
              ETH Zurich; Fang owns operations, supply chain, and mass production. This founder trio still matters
              operationally because the company adopted a weighted-voting-rights structure tied to the three founders,
              preserving enhanced control into the planned Hong Kong listing.


              Leadership breadth outside the founder trio has expanded materially as Hai pushed overseas. The
              application proof identifies Zeng Hongni as CFO, and 2025 official announcements show a thicker U.S.
              bench: Adrian Stoch became CEO Americas effective August 18, 2025 after senior roles at Target and GXO,
              while Hai also promoted Hunter Senn and Andrew Tolman and added U.S.-based leaders for customer support,
              software, and strategic partnerships. Those moves fit the company's shift toward non-domestic orders and
              local support obligations. The tradeoff is governance opacity. Even with the filing, public sources remain
              thinner on day-to-day board processes, committee practice, and the precise balance of control between
              founders and late-stage investors than they are on commercial milestones. The overview therefore supports
              the leadership bench as a strength, while still treating governance detail and ultimate post-IPO control
              dynamics as only partially disclosed.
