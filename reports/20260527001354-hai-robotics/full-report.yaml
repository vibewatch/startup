  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and category definitions
        blocks:
          - type: paragraph
            body: >-
              The right starting point for Hai Robotics is not the entire warehouse-automation budget but the narrower
              slice of warehouse work where case-level picking, storage density, and operator travel elimination matter
              most. Public market reports treat warehouse automation broadly, folding together robotics, conveyors,
              sortation, software, and services. Hai's own filing draws a much tighter line: it focuses on warehouse
              picking, defines ACRs as robots that retrieve only the required case from a rack, and explicitly contrasts
              that architecture with shelf-based AMRs that move full shelves at ground level. That distinction matters
              because buyers comparing Hai are usually deciding among different ways to automate picking and
              replenishment, not whether to automate every warehouse function at once.


              For market sizing, broad warehouse automation is still useful as a ceiling lens: Mordor and TBRC both
              describe a 2026 global market in the mid-USD-30 billions and double-digit growth. But Hai's direct arena
              is closer to the warehousing-picking-automation wedge that CIC, via the filing, sizes at RMB 232.6 billion
              in 2026E, and narrower still to the ACR slice of that wedge at RMB 9.8 billion in 2026E. The definitional
              hierarchy therefore runs from warehouse automation to warehouse robotics to goods-to-person and finally to
              ACR. Chapter 2 should keep those layers separate, because calling the full warehouse-automation TAM Hai's
              direct market would overstate what its current product set and buying motion actually address.
