    columns:
      - Lens
      - Thesis
      - Anti-thesis
      - What would change the view
    rows:
      - - Market and category
        - Warehouse automation remains a structurally growing category with real demand drivers.
        - Category growth does not prevent price pressure or multiple compression in a crowded field.
        - Show sustained pricing power or cleaner market-share economics rather than only TAM expansion.
      - - Product and software
        - Hai has a software layer and enterprise workflow proof, so value is not limited to hardware shipments.
        - Public evidence still does not quantify software mix, renewal quality, or margins by stream.
        - Disclose recurring mix, attach rates, and stream-level margins.
      - - Customer quality
        - Hai has scale, repeat deployments, and more than 800 contracted customers globally.
        - The same filing shows extreme large-customer concentration and partner-blended customer counts.
        - Reduce largest-customer dependency and show cohort durability beyond blended partner accounts.
      - - Overseas growth
        - Overseas mix and official partner expansion can support a higher-quality growth narrative.
        - International growth also adds support cost, execution burden, and margin leakage risk.
        - Prove overseas support economics and service quality with disclosed KPIs.
      - - Private valuation signal
        - >-
          The 36Kr late-stage mark is directionally supportive because the company has real revenue and category
          leadership.
        - >-
          A media-reported late-stage mark is not public fair value when pricing, dilution, and preferences are
          undisclosed.
        - Publish the actual bridge from private round economics to proposed public valuation.
      - - Public exit path
        - Geekplus and other robotics listings show the market can fund warehouse-automation leaders.
        - Public investors can already buy disclosed peers, so Hai cannot rely on category enthusiasm alone.
        - Offer either cleaner disclosure or a clearly discounted entry point versus public comps.
    notes: >-
      The anti-thesis is intentionally economic rather than rhetorical: the problem is not whether Hai is real, but
      whether the current public evidence makes the price trustworthy.
