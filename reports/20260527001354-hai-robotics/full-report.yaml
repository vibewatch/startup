      - number: '4.2'
        title: Operating performance and unit-economics proxies
        blocks:
          - type: paragraph
            body: >-
              Observed operating scale is no longer speculative. The filing reports revenue rising from RMB807.0 million
              in 2023 to RMB1.36 billion in 2024, with RMB1.263 billion in the first nine months of 2025, while gross
              margin improved from 16.0% to 26.3% to 28.9%. That trend is directionally encouraging, and the filing ties
              it to better business mix: more non-domestic work, larger project sizes, higher service content, and
              stronger pricing terms, plus better manufacturing-domain project selection. But the path is still
              incomplete. Net losses remained heavy, and selling, R&D, and administrative expenses all stayed large in
              absolute RMB terms even as their percentages of revenue declined.


              Public unit economics therefore have to be handled as proxies, not as a complete model. The strongest
              observed proxies are the negative cash conversion cycle, the rising repurchase rate, order intake per
              customer, and segment margin differences. Customer case studies also help, but only cautiously. Boot Barn,
              CEVA, and St. Luke's provide credible evidence that Hai systems can improve storage density, throughput,
              accuracy, and even in-house control, yet those are operating outcomes, not disclosed payback calculations
              for Hai itself. The right underwriting stance is to separate observed from inferred: revenue scale and
              margin improvement are observed; CAC, payback, channel margin sharing, and true software economics remain
              unobserved in public sources.
