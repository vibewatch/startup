      - number: '3.4'
        title: Moat durability and the crowding problem
        blocks:
          - type: paragraph
            body: >-
              The right cautionary lens is that Hai's moat looks real but specific. It is real because the company has a
              workflow bundle that many operators actually need: dense retrofit deployment, vertical reach, case or
              carton handling, and software-driven orchestration across storage, staging, and fulfillment. Public
              sources support that wedge well enough to matter. The problem is that most serious competitors are no
              longer telling a narrow single-robot story. AutoStore is adding AI-driven picking and more flexible
              workstations on top of its dense installed base. Geek+ combines shelf, tote, pallet, and robot-arm modules
              at large AMR scale. GreyOrange pushes vendor-agnostic orchestration across very large installed networks.
              Locus is trying to redefine the frontier around robots-to-goods and autonomous in-aisle order completion.
              Quicktron is moving toward one-platform multi-scenario automation with tote and pallet modules in the same
              facility.


              Market structure reinforces the caution. Mordor's 2026 view says mobile robots already hold a large share
              of warehouse-automation spend and that piece-picking is the fastest-growing subsegment. TBRC's
              major-player list, meanwhile, shows how many sizable vendors can credibly sell into the same buyer
              conversation even if they use different architectures. That means Hai is exposed on two fronts at once:
              product convergence and disclosure scrutiny. As Hai heads toward public markets, investors will compare
              its pricing, unit economics, and moat claims against more disclosed public peers such as AutoStore and
              Geek+, not just against private marketing narratives. The bottom line is that Hai's edge should be
              underwritten as a workflow-specific moat inside a crowded market, not as an uncontested platform monopoly.
