  - id: TV001
    title: Recommendation summary table
    columns:
      - Dimension
      - Current read
      - Why it matters
      - Decision implication
    rows:
      - - Recommendation
        - track / research-more
        - >-
          The business is credible, but the public record still does not disclose a clean entry price or cap-table
          bridge.
        - Stay engaged, but do not force conviction from incomplete price evidence.
      - - Confidence
        - medium
        - Core operating facts are strong and corroborated, but several price-setting inputs remain private or redacted.
        - Use wide ranges and insist on incremental diligence before upgrading the call.
      - - Risk rating
        - high
        - >-
          Customer concentration, negative cash flow, WVR governance, and partner-mediated execution can all compress a
          public multiple.
        - Size exposure for downside asymmetry, not headline market growth.
      - - Valuation stance
        - stretched
        - >-
          The late-stage private signal is not obviously absurd, but it already asks investors to look through visible
          financial and disclosure risk.
        - Demand a discount to opacity rather than paying for narrative continuity.
      - - What supports staying engaged
        - Real revenue scale, improving margin, software/service layer, and customer proof
        - >-
          Hai has already crossed the technology-existence and product-market-fit thresholds that many robotics issuers
          never clear.
        - Keep Hai on the active watchlist instead of dismissing it as speculative vapor.
      - - What blocks a stronger call
        - No final IPO price, unclear dilution stack, and no clean recurring-mix disclosure
        - Those gaps prevent a clean translation from private mark to investable entry economics.
        - Do not move from track to buy until those facts are available.
      - - What would improve the call
        - Cleaner prospectus, better cash conversion, lower concentration, and segmented recurring economics
        - Those items would convert a real operating story into a more defensible public-market one.
        - Upgrade only when operating proof and pricing proof improve together.
    notes: >-
      This table converts retained public evidence into a present-tense valuation call as of 2026-05-27; it is not a
