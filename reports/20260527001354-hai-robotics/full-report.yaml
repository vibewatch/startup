      - number: '4.3'
        title: Liquidity, liabilities, and capital intensity
        blocks:
          - type: paragraph
            body: >-
              Observed liquidity data argues for caution rather than panic. Hai ended September 2025 with RMB757.5
              million of cash and cash equivalents, then disclosed RMB1.876 billion of cash and cash equivalents on
              January 5, 2026 after a December 2025 financing. That is a meaningful improvement. The same filing also
              shows why capital intensity remains a live issue: operating cash flow was negative in every disclosed
              period, total liabilities rose to RMB6.60 billion by September 2025, and net current liabilities worsened
              to RMB3.90 billion. Customer advances and supplier terms help materially—contract liabilities rose to
              RMB1.1375 billion and even exceeded dispatched goods plus contract costs—but those advantages help fund
              fulfillment; they do not erase underlying burn or execution risk.


              The financing picture should likewise be separated into what is observed and what is inferred. Observed:
              2024 and 9M25 both included series-share proceeds and fresh borrowings, and management says working
              capital is sufficient for at least 12 months from the document date. Inferred: because that sufficiency
              statement explicitly assumes redacted IPO proceeds, outside investors still cannot model true runway from
              public data alone. Historical funding context matters here only as background, not as a rehash of Chapter
              1. TechCrunch, PR Newswire, and 36Kr together show Hai has already absorbed substantial private capital.
              The sober capital-intensity assessment is that Hai has real scale, genuine working-capital advantages, and
              fresh financing support, but it is still not demonstrably self-funding.
