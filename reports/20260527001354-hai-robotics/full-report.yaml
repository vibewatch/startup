      - number: '5.2'
        title: Architecture, orchestration and performance
        blocks:
          - type: paragraph
            body: >-
              The strongest public technical evidence sits in the combination of orchestration plus modular hardware.
              HaiQ is described as the digital brain that links upstream ERP, WMS and MES systems to warehouse
              execution, equipment scheduling, data, simulation and algorithm layers. Public copy goes beyond generic
              software marketing: the WES explicitly covers inbound, outbound, stock consolidation and inventory checks;
              the ESS integrates robots, conveyors, pick-to-light equipment, emergency stops and guard doors; and the
              algorithm platform is described in terms of order allocation, task assignment, path planning and charging
              logic. The filing adds the most consequential scale claim, stating that HaiQ can coordinate up to 6,000
              robots of different types at one site and that the software is intentionally standardized rather than
              custom-built from scratch for each project.


              Performance claims are directionally impressive but still need careful labeling. The filing and official
              pages support a coherent story around high density, short tote-delivery times, 12 to 15 meter vertical
              reach, fast throughput and strong accuracy. But most of those numbers are company or CIC claims rather
              than independent benchmark outputs. The right diligence posture is therefore not skepticism about whether
              the system works—the hardware, workflows and orchestration are real—but caution about taking every peak
              metric as universally realized. Public evidence is strongest on how the system works and where it should
              shine: dense case handling, brownfield adaptation, original-packaging flows, and mixed robot coordination.
              It is weaker on independently measured edge-case performance, energy efficiency and comparative failure
              behavior.
