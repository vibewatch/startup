      - number: '8.2'
        title: Private mark versus public-market discipline
        blocks:
          - type: paragraph
            body: >-
              The clearest publicly visible valuation signal for Hai is the 36Kr account of a roughly RMB10.9 billion
              post-Series-E mark after about RMB4.133 billion of cumulative financing. That signal is useful, but it is
              not self-validating. When paired with Hai’s disclosed 2024 revenue, it implies about 8.0x trailing sales
              before any adjustment for liquidation preferences, dilution, or IPO discount. That is not an absurd number
              for an automation company with real growth and category leadership, but it also is not obviously cheap
              when the filing simultaneously shows large losses, negative operating cash flow, heavy liabilities, and
              worsening customer concentration. Private narrative and public valuation discipline are not the same
              thing.


              Public comps sharpen that point. AutoStore screens around 7.4x trailing sales with a disclosed reporting
              cadence, live public price discovery, and mature product packaging. Symbotic screens far richer at roughly
              12.7x trailing sales and 11.9x EV/sales, but it also has much greater scale and public-market disclosure.
              Geekplus matters less as a normalized multiple and more as a market-read: it is a live Hong Kong
              warehouse-robotics listing with WVR and real IPO proceeds, suggesting investor appetite exists for the
              category. The right conclusion is not that Hai deserves one of those numbers by analogy. It is that Hai
              currently sits between a credible private late-stage signal and a harder public comp set, with enough
              quality to stay on the list but not enough cleanliness to deserve a premium entry by default.
