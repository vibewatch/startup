      - number: '6.2'
        title: 'Named deployment proof: where production maturity is strongest'
        blocks:
          - type: paragraph
            body: >-
              The strongest adoption evidence is not the headline customer count but the depth of the named production
              examples. Several official case pages now show enough operational detail to move beyond logo marketing.
              St. Luke’s and Equipment Depot provide one of the cleaner proofs because the official Hai page and an
              external partner announcement both describe the same healthcare insourcing project, including 28 robots, a
              14,000 square foot automated footprint, and the strategic objective of bringing distribution in-house from
              3PL dependence. JD Logistics is also stronger than a typical marketing case because Hai’s own page and a
              Honeywell-hosted PDF both describe a live California deployment with 60 ACRs, 42,028 tote locations,
              100,000-plus managed SKUs, measurable throughput gains, and Black Friday flex without extra temporary
              labor. RD Saúde, Zuellig Pharma, Mettler Toledo, Maersk Logistics, and Scalpers add depth across
              pharmaceutical retail, clinical-trial logistics, electronics distribution, fashion 3PL, and omnichannel
              apparel. These examples show real robot counts, storage-location counts, throughput claims, and sometimes
              phased expansion. At the same time, proof quality is uneven. Boot Barn, CEVA, and Avenue Shops provide
              attractive outcomes, but the public record there remains mostly company-written. Umall and Li-Ning are
              more directional still: they support real usage, but not with the same level of quantified evidence. The
              balanced conclusion is that Hai has enough named production references to show the product is used in live
              operations across multiple segments, while the precision of the outcome evidence still varies materially
              by customer.
