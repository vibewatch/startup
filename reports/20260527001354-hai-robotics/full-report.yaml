  - id: TI005
    title: Public financial gaps table
    columns:
      - Missing metric
      - What public sources reveal
      - Why it matters
      - Impact on underwriting
      - Exact diligence path
    rows:
      - - Recurring revenue mix / ARR
        - Recurring support and software exist, but no public source splits revenue by stream or provides ARR
        - Tests durability of the service tail and software monetization
        - Limits conviction on margin quality and valuation framework
        - Request revenue segmentation by deployment, maintenance, support, and software
      - - Realized pricing and discounts
        - No public list pricing or discount ladders found
        - Needed to model gross margin and channel economics
        - Forces investors to rely on qualitative value claims instead of realized economics
        - Collect current quotes or signed order forms by project archetype
      - - CAC, sales cycle, and payback
        - Public evidence offers proxies like repurchase rate and case-study ROI, not true CAC/payback
        - Critical for scaling efficiency and capital intensity
        - Prevents clean land-to-expand and channel-efficiency underwriting
        - Request sales-cohort dashboards and pipeline-conversion metrics
      - - Product and service gross-margin split
        - Public data shows total and some segment margins only
        - Needed to tell whether software/support offsets hardware intensity
        - Blurs the quality of future profitability
        - Request gross margin by geography, product family, and support attach
      - - Monthly burn and exact runway
        - Operating cash outflows are public, but monthly burn and runway months are not
        - Needed for downside liquidity testing
        - Makes the January 2026 cash step-up hard to translate into survival time
        - Request a month-by-month liquidity bridge and downside scenario
      - - Non-redacted IPO use of proceeds
        - Filing says working-capital sufficiency assumes redacted net IPO proceeds
        - Needed to know what the IPO will actually fund
        - Keeps capital-allocation analysis incomplete
        - Request the latest prospectus or management budget with use-of-funds detail
    notes: >-
