      - number: '5.3'
        title: Deployment, manufacturing and channel dependencies
        blocks:
          - type: paragraph
            body: >-
              Hai’s modularity story is partly a product moat and partly an implementation model. The official pages say
              Hai owns the intelligent equipment layer—robots, workstations, safety equipment and chargers—while
              allowing structural elements such as racking, totes, conveyors and fencing to be sourced locally. That
              matters for both brownfield economics and trade-friction resilience. It can reduce the amount of
              proprietary infrastructure that must cross borders, and it helps explain why partners such as FORTNA,
              Hy-Tek, Conveyco and Zion Solutions Group can package Hai inside larger integration programs. Public
              partner pages consistently position Hai as a configurable goods-to-person engine inside broader
              operational-design, WES/WCS and lifecycle-service offerings.


              The same evidence also shows why execution risk remains meaningful. Public engineering roles reference
              firmware setup, WMS and PLC integration, networking, site inspection, DM-code installation, LiDAR and
              depth-camera calibration, path-planning tuning and root-cause analysis. That is not the signature of a toy
              automation overlay; it is the signature of a real enterprise system with non-trivial commissioning and
              support demands. The upside is that this know-how is hard to replicate quickly. The downside is that
              standardization can only go so far before site-specific conditions, partner quality and customer process
              discipline start to matter. Hai’s product-tech moat is therefore not just robot design. It is the
              combination of modular hardware, orchestration software, and delivery playbooks that let the company and
              its integrators make heterogeneous sites behave like repeatable deployments.
