      - number: '2.2'
        title: Buyer segments, workflows, and why Hai wins in its best verticals
        blocks:
          - type: paragraph
            body: >-
              The buying motion is vertical-specific even when the warehouse job is similar. Operations and supply-chain
              leaders usually own the business case because they feel labor scarcity, congestion, and service-level pain
              first, but IT and warehouse-systems teams shape whether a project is feasible inside an existing WMS or
              MES stack, and finance ultimately underwrites payback. Hai's fit is strongest where those stakeholders
              want dense storage, brownfield deployment, fast throughput, and case-level flexibility rather than a full
              greenfield conveyor rebuild. That is why the most consistent public use cases cluster in apparel, retail,
              3PL, healthcare, and mixed manufacturing.


              The case corpus makes that pattern concrete. Boot Barn and Avenue Shops show apparel and retail value in
              the form of denser storage and faster shipping without extra walking. CEVA shows why 3PLs like flexible,
              omnichannel-ready capacity inside a constrained footprint. St. Luke's shows why healthcare buyers value
              accuracy, cleanliness, control, and service continuity. Manufacturing is a smaller revenue domain for Hai
              today, but the product set still supports it through lineside delivery, pallet-plus-each picking, and
              ERP/WMS/MES integration. Across those segments, Hai's advantage is not one magic robot metric; it is the
              combination of goods-to-person ergonomics, retrofit-friendly deployment, mixed-container handling, and
              orchestration software that reduces the disruption of adopting automation in an already-busy facility.
