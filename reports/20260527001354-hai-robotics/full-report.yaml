      - number: '8.4'
        title: Exit readiness and final diligence asks
        blocks:
          - type: paragraph
            body: >-
              Hai is not exit-ready on a public-evidence basis yet, but it is close enough to justify focused diligence
              rather than passive interest. The company has enough commercial proof to clear the “is this real?” hurdle.
              Official customer and partner materials show production deployments, enterprise use cases, and
              international channel scale. Market reports show that the category still has structural tailwinds. Those
              are the reasons to stay engaged. But the missing items are exactly the ones that govern entry price and
              downside. Public sources still do not provide a clean cap-table bridge, liquidation-preference map, final
              price range, or the recurring-revenue and cohort disclosures that would let an investor normalize Hai
              against disclosed public peers.


              The most useful diligence asks therefore target what would actually change the recommendation. First, get
              the cap table and the bridge from the last private round to any proposed public pricing. Second, demand
              segmentation of hardware, software, maintenance, and support economics. Third, test whether concentration
              is easing or merely being hidden inside growth. Fourth, verify overseas support economics rather than
              assuming they deserve a premium. Until that package is available, Hai remains a monitor-worthy company
              with genuine strategic value but incomplete priceability. That makes the current stance decisive but
              evidence-based: track / research-more, not because the business is weak, but because the valuation inputs
              that matter most remain only partially public.
            claimRefs:
              - CV011
