  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive paradigms and the real landscape around Hai
        blocks:
          - type: paragraph
            body: >-
              The right competitive frame for Hai Robotics is not every warehouse-automation vendor, but every credible
              way a buyer can automate the same picking-heavy job. Hai's own filing and product pages place the company
              in an ACR and case-handling lane: robots retrieve specific cases or cartons from racks, move them to
              workstations, and increasingly combine storage, staging, consolidation, and full-case workflows inside one
              stack. That makes AutoStore a close substitute on dense goods-to-person storage, but not a perfect
              like-for-like peer; AutoStore's cube model optimizes bins in a proprietary grid, while Hai's public proof
              is strongest where operators want to retrofit existing buildings, push vertically, and keep cartons or
              eaches in native packaging. Geek+ broadens the field from another direction by spanning shelf-to-person,
              tote-to-person, pallet-to-person, and robot-arm picking. GreyOrange competes through a control layer that
              can sit above mixed fleets, while Locus and Quicktron widen the edge of the market toward autonomous
              in-aisle picking and modular multi-workflow systems.


              This matters because competitive pressure is architecture-specific. Hai's best public proof points are
              density, retrofit fit, and case or carton handling in constrained warehouses. AutoStore makes the
              strongest case for absolute cube density and mature software-backed throughput; Geek+ brings breadth and
              shelf-to-person scale; GreyOrange attacks from orchestration and heterogeneous-fleet control; Locus pushes
              piece-picking autonomy and in-aisle completion; Quicktron combines tote, shelf, pallet, and material
              handling under a unified control stack. Status-quo substitutes also remain real. Buyers can still choose
              manual picking, process redesign, or smaller conveyor retrofits when disruption risk or payback
              uncertainty is high. The competitive chapter therefore has to compare paradigms as much as company logos.
