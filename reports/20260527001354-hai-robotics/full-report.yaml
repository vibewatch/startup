companyProfile:
  summary: >-
    Hai Robotics is a Shenzhen-founded warehouse-automation company that pioneered autonomous case-handling robots and
    now sells integrated HaiPick systems, HaiPick Climb, HaiQ orchestration software, and related services into retail,
    3PL, healthcare, manufacturing, and e-commerce warehouses worldwide. Public evidence shows a real industrial
    business with filing-backed 2024 revenue of RMB 1.36 billion, more than 800 contracted customers by September 2025,
    substantial international mix, and category leadership in ACRs, but also material underwriting caveats: heavy
    accounting losses, large-customer concentration, weighted-voting-rights governance, and incomplete public disclosure
    on recurring-revenue mix, cap-table economics, and final IPO pricing.
