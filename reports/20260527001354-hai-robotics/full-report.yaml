  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product stack and workflow fit
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics’ public product story is clearer when explained as a workflow stack rather than as a list of
              robot model numbers. The filing and official solution pages present HaiPick Systems as a modular family
              that covers three recurring warehouse jobs—dense storage, order staging and consolidation, and full-case
              handling—plus the newer HaiPick Climb architecture for higher-density climbing retrieval. System 1 is the
              baseline goods-to-person configuration; System 2 adds heavy-duty AMRs for bulk and palletized handling;
              System 3 adds fast-transit companion AMRs, chain-pick storage, and more explicit support for trays,
              cartons and original packaging. Around those systems sit HaiQ, multiple workstation formats, proprietary
              chargers, and a wider hardware catalog that includes telescopic, grappling-hook and fork-lifting ACR
              variants.


              That stack matters because it explains why Hai can credibly span retail, apparel, 3PL, healthcare and
              parts of manufacturing without publicly showing a completely different software or hardware stack for each
              vertical. The official download center lists manufacturing-oriented collateral, and the system pages
              mention lineside delivery and kitting, but the strongest public proof still sits in warehouse picking,
              case handling and retrofit-heavy fulfillment. In other words, manufacturing appears to be an extension of
              the same modular case-handling platform, not a separately documented product family. The public corpus is
              therefore strong on module visibility and weaker on how far the manufacturing extension goes in practice.
            claimRefs:
