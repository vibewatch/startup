  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / signal
      - Why it matters
      - Transmission to thesis
      - Action implication
    rows:
      - - IPO terms stay opaque
        - No final price range, cap-table bridge, or clear use-of-proceeds detail in the next major disclosure
        - Entry economics remain unknowable
        - Turns “track” into “wait” rather than “buy”
        - Do not add conviction until terms are public
      - - Largest-customer dependence stays extreme
        - Largest customer remains near current 9M25 levels or top-five concentration worsens again
        - One account can move the whole equity story
        - Public multiple should compress, not expand
        - Haircut valuation range toward bear case
      - - Cash generation fails to improve
        - Operating cash flow remains clearly negative despite growth and margin gains
        - Shows scale is not yet converting into financing independence
        - Undermines base-case support for the private mark
        - Treat private mark as too generous
      - - Recurring-mix disclosure still absent
        - No hardware/software/service split or renewal data emerges
        - Comp selection remains weak and quality of revenue stays opaque
        - Prevents a premium-multiple argument
        - Keep recommendation at track / research-more
      - - Partner-led execution shows leakage
        - Support burden rises without evidence of margin or SLA quality
        - International expansion may be less valuable than it looks
        - Reduces willingness to pay for overseas narrative
        - Apply additional discount to comp-derived range
      - - Future IPO asks for premium without better proof
        - Proposed valuation meets or exceeds late-stage private multiple while disclosure quality stays unchanged
        - Investors would be paying up for unresolved risk
        - Converts stretched into expensive
        - Decline or defer unless terms reset
    notes: >-
      These are concrete kill triggers rather than generic worries. Each one names a monitorable fact pattern that would
      force the valuation case down rather than merely slowing enthusiasm.
