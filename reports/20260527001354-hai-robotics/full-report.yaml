      - number: '3.3'
        title: Pricing visibility, channel power, and switching costs
        blocks:
          - type: paragraph
            body: >-
              Competitive outcome in warehouse automation is shaped as much by packaging and channels as by robot
              specifications. Hai's filing shows that channel partners still contribute a meaningful share of revenue
              and that the company has already partnered with six of the world's top ten system integrators. That is a
              real advantage because it expands local delivery capacity and gives Hai credibility inside large, complex
              projects. But it is not a monopoly mechanism. Geek+ also talks about certified local partners, AutoStore
              has a long-established partner ecosystem, and Quicktron is explicitly building a channel and
              modular-playbook for international markets. Integrators help Hai scale, yet they can also place multiple
              competing architectures in front of buyers.


              Public pricing evidence is thinner than architecture evidence. AutoStore provides the cleanest packaging
              signal through Pio's subscription-style access path and through its investor-facing disclosure surface.
              Beyond that, public sources mostly show project framing, modularity claims, and qualitative ROI language
              rather than realized price curves. That matters because switching cost and multi-homing depend on what the
              buyer actually commits to. Cube systems and dense rack systems can create deep physical lock-in. AMR
              overlays and vendor-agnostic orchestration layers leave more room for mixed fleets, phased rollouts, and
              later supplier substitution. Hai sits between those poles: its systems create meaningful physical and
              software switching friction once installed, but its brownfield-friendly design and channel-heavy motion
              still make it less absolute than a proprietary cube grid. Buyers therefore have to underwrite architecture
              plus ecosystem, not only robot speed.
