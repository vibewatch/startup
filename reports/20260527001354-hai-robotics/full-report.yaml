    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Cap table and dilution
        - >-
          Fully diluted share count, preferences, conversion terms, and bridge from last private round to proposed
          public pricing
        - Converts the late-stage private signal into real entry economics
        - CFO / legal data-room request before any pricing decision
      - - IPO pricing package
        - Price range, target market cap, cornerstone terms, and detailed use of proceeds
        - Determines whether public investors are being asked to pay a discount or a premium for opacity
        - Updated prospectus or hearing package review
      - - Recurring and software mix
        - Hardware, software, maintenance, and support revenue split plus gross margin by stream
        - Determines whether Hai deserves hardware, software, or hybrid comp treatment
        - Finance segmentation pack and product P&L review
      - - Customer concentration quality
        - Top-10 customer bridge, backlog, payment terms, and churn / renewal patterns by direct vs partner motion
        - Tests whether concentration is easing or merely being masked by growth
        - Commercial diligence with cohort tables and customer interviews
      - - Overseas support economics
        - SLA structure, local support headcount, spare-parts obligations, and gross margin by region or channel
        - Validates whether overseas growth deserves a valuation premium or a discount
        - Operations and service-quality diligence in key regions
      - - Closest public-peer normalization
        - >-
          Latest Geekplus financials and a stable current quote source, plus any cleaner Hong Kong warehouse-robotics
          multiple
        - Sharpens the most venue-relevant public appetite benchmark
        - Refresh peer work when direct current-source access is available
    notes: >-
