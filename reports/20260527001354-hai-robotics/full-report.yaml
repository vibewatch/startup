      - number: '2.3'
        title: Conservative TAM, SAM, and observed SOM lenses
        blocks:
          - type: paragraph
            body: >-
              A defensible market-sizing method for Hai uses multiple lenses with clear caveats instead of pretending
              that one generic number is precise. The broadest TAM comes from public warehouse-automation reports:
              roughly USD 34.2 billion to USD 36.4 billion in 2026 across Mordor and TBRC. A more relevant middle layer
              comes from Hai's filing, which cites CIC's warehousing-picking-automation market at RMB 232.6 billion in
              2026E. A narrower product-category layer comes from the same filing's ACR estimate of RMB 9.8 billion in
              2026E. Those three layers are not interchangeable, but together they show that Hai sells into a real and
              expanding automation market while still operating in a much smaller direct niche than a headline
              warehouse-automation TAM might suggest.


              The SAM proxies in this chapter are intentionally conservative. Rather than convert every possible sector
              into faux precision, the chapter uses function and ownership shares from Mordor to illustrate the order of
              magnitude of relevant budget pools: picking and packing as a functional proxy, 3PL ownership as a channel
              proxy, and retail or e-commerce ownership as a demand proxy. The SOM lens is even more constrained. Public
              data do not support a credible forward market-share forecast by geography, pricing model, or vertical mix.
              What is supportable is an observed historical anchor: Hai's 2024 revenue is roughly consistent with about
              one-third of CIC's 2024 ACR market size, which aligns with the filing's over-30% share claim. That is
              useful context, but it is not a promise that Hai will keep the same share as the category broadens and
              competition intensifies.
