      - number: '1.4'
        title: Global expansion, milestones, and the core overview risks
        blocks:
          - type: paragraph
            body: >-
              Operationally, Hai Robotics now presents as a global company headquartered in Shenzhen rather than a
              China-only robotics exporter. The filing says its footprint spans more than 40 countries and regions, with
              non-domestic order intake above 50% of total order intake in the first nine months of 2025 and
              non-domestic revenue approaching 40% of total revenue. Official company releases reinforce that direction:
              2025 and 2026 announcements show a stream of integrator relationships and local-market moves through
              FORTNA, TGW Logistics, Hy-Tek, Conveyco, and expanded Americas leadership. Case-study pages also show use
              cases across retail, healthcare, 3PL, and grocery, including Boot Barn, St. Luke's, Avenue Shops, CEVA
              Logistics, and Umall. The year-end recap pushes the scale narrative even further with 29,000 robots in
              operation or underway, 1,200-plus customers, and 7,000 robots delivered in 2025.


              Those same sources also frame the overview risks. The pre-IPO filing and adverse commentary from Bamboo
              Works, Benzinga, Longbridge, and AsiaTechDaily all point to the same pressure points: Hai remains deeply
              loss-making under accounting metrics; liabilities have risen materially; customer concentration has
              increased; and the coming IPO shifts the company from a private narrative of category creation to a public
              test of margins, governance, and execution. Some official marketing claims also use broader ecosystem
              counts such as 1,200-plus customers, while the filing uses a narrower "over 800 contracted customers"
              definition, so readers should avoid flattening those figures into a single precise customer count. The
              right chapter-one conclusion is therefore not skepticism about whether Hai has built something real—it
              clearly has—but rather recognition that the next phase hinges on whether strong overseas growth, product
              standardization, and founder control translate into durable public-company economics.
