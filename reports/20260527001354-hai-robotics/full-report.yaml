      - number: '7.4'
        title: Mitigations, kill criteria, and open evidence gaps
        blocks:
          - type: paragraph
            body: >-
              Hai is not ignoring these risks. The public record shows several concrete mitigations: HKEX’s WVR rulebook
              imposes structural guardrails; the company has surfaced RED and IEC cyber-compliance work; partner
              frameworks with Dematic and TGW explicitly reference training, warranties, spare parts, and liability; and
              Hai has added 2026 U.S. leadership for customer support, software, and partner development. Those are
              meaningful signals because they tie directly to the most important failure modes. But the mitigation
              maturity is uneven. None of the visible public sources disclose customer-facing SLA economics, incident
              rates, supplier concentration, warranty claim frequency, or a litigation schedule. In other words, the
              company is clearly building mitigation scaffolding, yet public investors still cannot tell whether the
              scaffolding is overbuilt, underbuilt, or economically efficient.


              That is why the most useful kill criteria in this chapter are concrete and monitorable rather than
              rhetorical. If the next disclosed period keeps the largest-customer share near current extremes, if
              operating cash generation does not turn convincingly positive, if support remains dependent on opaque
              partner handoffs without visible SLA evidence, or if cyber and regulatory assurance remains limited to
              marketing-level certification statements, the risk case should harden rather than soften. Conversely, the
              thesis improves if Hai demonstrates concentration relief, cleaner liquidity, better disclosure on support
              and warranty economics, and evidence that WVR governance works with restraint rather than simply because
              rules require it. The chapter’s final judgment is therefore disciplined: many of Hai’s top risks are
              already observed and rankable, several mitigations are visible, and the remaining unknowns are specific
              enough to turn into a diligence checklist rather than generic unease.
