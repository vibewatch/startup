chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, category creation, and business model
        blocks:
          - type: paragraph
            body: >-
              Hai Robotics should be understood first as a category-defining warehouse-automation vendor rather than as
              a generic mobile-robotics startup. In its February 2026 Hong Kong application proof, the company says it
              focuses on warehouse picking, the most labor-intensive warehouse task, and that it ranked as the world's
              largest autonomous case-handling robot provider in 2024 by both revenue and shipment volume, with market
              share above 30%. The same filing positions Hai as the inventor of integrated ACR solutions, tracing
              product evolution from the first HaiPick launch in 2017 to the 2025 HaiPick Climb release. TechCrunch's
              2021 funding coverage and later company materials support that lineage: Hai chose a case-handling
              architecture that retrieves only needed totes or cartons rather than moving entire shelves, and it has
              kept building the product suite around dense storage, order staging, consolidation, and full-case
              handling.


              The business model is more robust than a one-off robot sale. The filing says Hai books meaningful initial
              project revenue when a warehouse system is delivered and deployed, then generates recurring revenue from
              after-sales maintenance packages, software, and technical and operational support. That matters because it
              makes the company a blended hardware-plus-software-plus-services provider whose long-term economics depend
              on repeat deployments, ongoing service attach, and channel relationships, not just initial hardware
              shipments. The filing also shows a deliberate mix shift toward distribution use cases and non-domestic
              markets, while official product pages emphasize the standardized HaiQ control layer and modular system
              architecture. In short, the overview chapter can treat Hai Robotics as a global ACR platform company with
              real deployment maturity and a service tail, even though later chapters still need to test how durable and
              profitable that model becomes under public-market scrutiny.
