      "id": "trust-compliance-and-residual-risk",
      "title": "Trust, compliance and residual technical risk",
      "body": "Trust evidence improved materially in the retained 2025-2026 corpus. Hai officially announced IEC 62443-4-1 certification and described secure-development controls such as risk assessment, testing, vulnerability management and coordinated updates. Trade coverage also repeated company claims around TÜV SÜD validation of EU RED Article 3.3(d) compliance and alignment with ISO 27001 and TISAX. Official HaiQ copy adds more operational controls, including encrypted robot communications, automatic switching on failure, load balancing and disaster-prevention features. System pages also mention CE and NRTL-certified workstations and the HaiVest safety approach for human access during maintenance. This is enough to say that trust, cyber and safety are now part of the public product story, not an afterthought.\n\nWhat remains missing is equally important. The filing still warns that cyber-attacks, network overload, power loss and telecommunication failures can interrupt ACR availability, and it separately flags dependence on semiconductors, sensors and control systems. Public certification news does not yet provide certificate IDs, scope detail, incident-disclosure history, CVE handling records, or warranty economics. Likewise, no retained source gives independent third-party benchmarking on failure modes, energy use or service-level performance against named peers. The practical conclusion is balanced rather than binary: Hai now has meaningful public trust signals, but the most underwriting-relevant proof still depends on diligence-room artifacts and reference calls rather than what is visible in the open corpus.",
