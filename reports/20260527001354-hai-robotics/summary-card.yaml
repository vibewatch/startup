summary:
  headline: >-
    Hai Robotics is a real category leader in ACR-based warehouse automation, but the public record still supports
    tracking rather than buying because pricing, dilution, and recurring-economics disclosure remain incomplete while
    losses and concentration stay material.
  overallScore: 6
  recommendation: track
  confidence: medium
  riskRating: high
  valuationStance: stretched
