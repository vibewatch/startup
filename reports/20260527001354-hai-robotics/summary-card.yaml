  topStrengths:
    - >-
      According to the HKEX filing, Hai was the world's largest ACR provider in 2024 by revenue and shipment volume with
      market share above 30%.
    - >-
      The company has filing-backed industrial scale: RMB 1.36 billion of 2024 revenue, improving gross margin, and more
      than 800 contracted customers by September 2025.
    - >-
      Hai appears to have a real product moat in case handling, high-density storage, retrofit-friendly deployment, and
      multi-robot orchestration rather than a single-feature robot pitch.
    - >-
      International growth and partner expansion create a plausible path to better mix and broader market reach if
      execution holds.
  topRisks:
    - The business remains deeply loss-making and operating cash flow is still negative despite margin improvement.
    - >-
      Customer concentration is high, with the top five customers representing 48.2% of 9M25 revenue and the largest
      customer 30.4%.
    - >-
      The current public record still lacks a final IPO price range, clean cap-table bridge, and clear recurring-revenue
      / software-mix disclosure.
    - >-
      Founder-weighted voting control and incomplete governance detail reduce outside investors' visibility into control
      and downside protection.
    - >-
      Competitive pressure from Geek+, AutoStore, GreyOrange, Locus, Quicktron, and other automation vendors can
      compress pricing and moat durability.
  unresolvedGaps:
    - >-
      Final IPO price range, dilution bridge, and any liquidation-preference or cornerstone allocations are not public
      in the retained corpus.
    - Public sources do not cleanly break out hardware, software, maintenance, and support revenue or margin by stream.
    - >-
      A single reconciled customer-count definition is still missing because the filing's 800+ contracted-customer
      metric and broader 1,200+ marketing count appear to use different scopes.
    - >-
      A simple current total headcount and regional staffing split are not cleanly disclosed in the retained public
      record.
    - Retention, GRR/NRR, contract-term, and warranty/SLA economics remain under-disclosed for public underwriting.
