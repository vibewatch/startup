    {
      "id": "customer-financial-and-competitive-risk",
      "title": "Customer, financial, and competitive risk",
      "body": "The financially material risk stack is dominated by concentration and liquidity rather than by a lack of demand. The filing shows the five largest customers rising from 32.1% of revenue in 2023 to 48.2% in 9M25, with the single largest customer reaching 30.4% of revenue and KA customers contributing 75.8% of order intake in the same period. Those are not soft warning lights. They mean one customer relationship, one project timetable, or one procurement reset can move group-level outcomes materially. At the same time, Hai remains loss-making. The filing records large losses in 2023, 2024, and 9M25, rising contract liabilities tied to delivery obligations, and net current liabilities of nearly RMB3.9 billion by September 2025. Bamboo Works, Benzinga, and Longbridge all highlight the same balance-sheet and cash-flow pressure from an adverse angle. The public evidence therefore supports a specific financial risk ranking: concentration and liquidity are observed high risks; losses and delivery-obligation risk are observed medium-to-high risks; exact runway and service-margin downside remain under-disclosed.\n\nCompetitive pressure is also more observed than speculative. AsiaTechDaily argues that Hai is moving into a phase where pricing, deployment speed, and customer acquisition matter more as the market crowds. That stance is consistent with the broader evidence set: warehouse automation is large enough to keep attracting credible competitors, and buyers can increasingly compare case-handling systems against broader AS/RS and AMR alternatives, not just against another ACR vendor. Hai’s own overseas growth intensifies this issue because non-domestic orders now make up more than half of order intake, which improves market opportunity but also forces the company to defend price, support quality, and local compliance in more jurisdictions. For valuation, that means investors should not underwrite Hai as a clean software-like growth story. A more realistic lens is that the company may deserve credit for category leadership and improving gross margin, but the public multiple ceiling should stay constrained until concentration eases, operating cash generation improves, and partner-led expansion proves it can scale without leaking margin or quality.",
