    "number": 7,
    "title": "Risks",
    "summary": "Hai Robotics’ risk profile is led by observed rather than hypothetical issues: WVR governance control, customer concentration, persistent losses with elevated liabilities, and partner-mediated overseas execution all appear directly in the filing or current public materials. Operational and cyber risk are real but partially mitigated by visible compliance work, partner frameworks, and new support hiring; the residual problem is that uptime economics, litigation exposure, supplier concentration, and full certification scope remain under-disclosed. The result is a chapter that ranks real risks high, recognizes visible mitigations, and turns the remaining unknowns into explicit kill criteria and diligence asks."
  },
  "sections": [
    {
      "id": "governance-regulatory-and-legal",
      "title": "Governance, regulatory, and legal risk",
      "body": "The cleanest governance risk in Hai’s case is not hypothetical; it is written into the filing. The company plans to list with weighted voting rights, and the application proof explicitly warns that the WVR beneficiaries may have interests that are not fully aligned with those of shareholders as a whole. The filing’s own risk-factor language goes further, stating that concentrated voting power could delay or prevent change-of-control outcomes and depress the ordinary-share price. That matters because this is not a founder-control structure attached to a mature public operating history; it is being introduced while the company is still in application-proof stage, before public-market discipline has been tested in live reporting cycles. HKEX Chapter 8A provides real safeguards, including a 10:1 voting cap, minimum voting rights for non-WVR holders, and cessation triggers if a beneficiary leaves the board or transfers the relevant stake. But those rules reduce the tail risk; they do not remove the practical reality that public investors could be locked into management’s strategic choices for an extended period.\n\nLegal and regulatory risk is similarly mixed. Hai’s website privacy policy shows that the company collects broad categories of user and marketing data and may transfer personal data across jurisdictions, including China and other countries, which creates real compliance surface area for a company selling connected systems globally. Its terms of use are also defensive: content is provided as-is, warranties are broadly disclaimed, and technical inspection behaviors such as reverse engineering and vulnerability scanning are restricted. On cybersecurity regulation, Hai has surfaced constructive signals, including RED Article 3.3(d) compliance messaging and IEC 62443-4-1 certification. Those are positives. But the evidence still stops at public announcements and high-level regulatory explainers rather than transparent certificate scope, surveillance cadence, or incident history. The right judgment is therefore a ranked one: WVR governance risk is observed and high; privacy and cyber-compliance obligations are observed and medium-to-high; undisclosed litigation exposure remains an explicit evidence gap rather than a cleared issue.",
