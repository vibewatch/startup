    {
      "id": "scenario-range-and-decision-triggers",
      "title": "Scenario range and decision triggers",
      "body": "The right way to frame Hai’s value is through scenarios, not through fake precision. A bear case starts with the simple fact that the offering is still conditional and that public investors may not be willing to honor a late-stage private mark when losses, concentration, and disclosure gaps remain so visible. In that case, Hai would likely trade at a discount to the private signal, especially if cash generation or concentration worsens. The base case is more balanced: Hai keeps growing, margins keep improving, overseas mix stays supportive, and investors give some credit for software, services, and repeat deployments, but they still refuse to pay a premium for opacity. The bull case is possible, but it requires more than continuing the current narrative. It needs evidence that Hai can translate category leadership into cleaner recurring economics and a more public-ready risk profile.\n\nThat is why the ranges below should be read as disciplined decision bands, not as live underwriting advice. They tell the investor what evidence would justify paying more or less, and they show where the current late-stage private signal sits inside that map. If concentration remains extreme, if the next update does not improve cash-generation quality, or if a future price range asks investors to pay at or above the private multiple without closing the disclosure gaps, the thesis should weaken, not strengthen. Conversely, if Hai brings out a cleaner prospectus, shows continuing mix improvement, and gives investors more visibility into revenue durability, a higher range becomes easier to defend.",
