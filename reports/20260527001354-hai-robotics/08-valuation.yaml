    "title": "Valuation",
    "summary": "Hai Robotics has enough operating proof to justify active monitoring, but not enough public pricing clarity to justify a buy-style call. The best visible private signal implies a multiple that is plausible, yet already demanding, once losses, concentration, WVR governance, and incomplete disclosure are taken seriously. Recommendation: track / research-more with medium confidence, high risk, and a stretched valuation stance until entry terms and recurring-economics evidence improve."
  },
  "sections": [
    {
      "id": "recommendation-and-valuation-framing",
      "title": "Recommendation and valuation framing",
      "body": "Hai Robotics is easier to respect than to price. The business is clearly real: the HKEX application proof shows industrial-scale revenue, materially better gross margin, more than 800 contracted customers, and visible repeat-deployment behavior. Official product and customer sources also show that Hai is not simply shipping robots into warehouses; it has a software layer, customer-specific deployment proof, and enough partner infrastructure to support international expansion. Those are the ingredients of a company worth tracking, not dismissing. They are also why this chapter does not end in “avoid.”\n\nBut the evidence is still not clean enough for a buy-style recommendation. The filing remains a draft application proof with no final public price range, the late-stage private valuation signal comes from media coverage rather than an issued term sheet, and the company is still loss-making, cash-burning, and highly concentrated into large customers. That combination matters because public markets do not only value industrial progress; they value disclosure quality, entry discipline, and downside protection. The decisive call from the current record is therefore track / research-more with medium confidence, high risk, and a stretched valuation stance if one starts from the reported late-stage private mark. The right question is not whether Hai has built something meaningful. It clearly has. The right question is whether the price can be underwritten cleanly from public evidence today. The answer is still no.",
