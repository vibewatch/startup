    "title": "Market Analysis",
    "summary": "Hai Robotics sells into a real and fast-growing warehouse-automation market, but the direct market that matters is the smaller picking-intensive goods-to-person and ACR wedge rather than all warehouse automation spend. Public evidence shows strong fit in apparel, 3PL, retail, healthcare, and mixed manufacturing because Hai's systems optimize storage density, retrofits, and case-level workflows. The caveat is that this wedge is still early, capex- and integration-heavy, and increasingly contested by substitute architectures and rising price pressure."
