company:
  name: DevRev

chapter:
  number: 4
  title: Financials
  summary: |
    DevRev has raised $158M across three rounds — $50M seed (Jul 2021), $7.1M bridge (Aug 2022), and
    $100.8M Series A (Aug 2024) — achieving unicorn status at $1.15B post-money valuation. Self-reported
    ARR was ~$100M as of June 2024 (Latka), up from ~$69.9M in July 2023, implying ~43% YoY growth.
    Revenue model is predominantly SaaS subscription (PLuG platform seats) with an emerging
    outcome-based AI resolution component (Computer). No audited P&L, consolidated income statement,
    or gross margin data is publicly available for the US entity. India subsidiary (DEVREV CLOUD INDIA
    PRIVATE LIMITED) ROC filings show FY2024 revenue of ₹100–150 crore (~$12–18M), negative operating
    margins (-3%), and a rapidly growing employee base — consistent with a well-funded, pre-profitable
    growth-stage company. Estimated monthly cash burn of $5–12M implies 12–24 months runway from
    Series A close (Aug 2024), making a 2025–2026 next-round raise likely. Key financial gaps: no
    audited gross margin, no US GAAP income statement, no NRR disclosure, and no disclosed unit
    economics. The valuation-to-ARR multiple (~11.5x in Aug 2024) was at-market for high-growth AI
    SaaS but will require 3–5x ARR growth to justify at IPO-grade multiples.

sections:
  - id: S1
    title: Revenue Model and Streams
    body: |
      DevRev's revenue model spans three primary streams, all centered on enterprise software
      subscriptions and AI-agent resolution services. The core PLuG platform offers seat-based
      subscriptions across engineering issue tracking, customer support, and product management
      functions — the foundational annual contract revenue stream. The Computer AI resolution product
      (launched beta September 2025, GA May 2026) introduces an outcome-based element where resolution
      events are the commercial unit, though public pricing remains opaque. A third revenue stream —
      professional services and implementation onboarding — appears to be present based on customer
      case studies referencing implementation teams, but its scale and margin contribution are not
      publicly disclosed.

      Revenue recognition follows standard SaaS subscription accounting (ASC 606): PLuG ARR is
      recognized pro-rata over the contract period; Computer's outcome-based component, if priced
      per resolution, would be recognized as services are delivered. No GAAP financial statements
      are publicly available for the US holding entity (DevRev, Inc.); all ARR figures are
      self-reported or third-party database estimates, not audited disclosures.

      Revenue concentration risk is material: the India subsidiary (DEVREV CLOUD INDIA PRIVATE LIMITED)
      accounts for a meaningful share of global operations (363+ employees in India as of March 2026)
      and FY2024 revenue of ₹100–150 crore (~$12–18M), per ROC filings. This suggests substantial
      India-based revenue — either from India enterprise customers or from intra-group service
      transfer pricing — but the split between US and India entity revenues is not publicly disclosed.
    claimRefs: [CI001, CI002, CI003, CI004, CI005]
    tableRefs: [TI001, TI002]

  - id: S2
    title: Financial Traction and ARR Growth Profile
    body: |
      DevRev's reported ARR growth is the headline financial metric and the primary investment thesis
      validator. Based on Latka database records (which rely on CEO self-disclosure): ARR was ~$69.9M
      in July 2023 and ~$100M by June 2024, implying ~43% YoY growth. The $100M ARR milestone
      coincided with the August 2024 Series A close. ARR growth from $0 to $69.9M occurred in
      approximately 36 months (founded October 2020, first product GA 2022). This pace is in line
      with top-quartile B2B SaaS growth benchmarks but below hypergrowth thresholds (>100% YoY)
      that typically command 15–20x ARR multiples.

      Customer count grew to 1,000+ organizations as of August 2024 (company disclosure), with
      250+ organizations deploying Computer in production as of May 2026. The disparity between
      1,000+ overall customers and 250+ Computer deployments reflects a two-tier install base:
      legacy PLuG customers not yet migrated to the AI agent layer. This migration rate is a key
      leading indicator of ARR per customer expansion, since Computer's outcome-based pricing or
      premium seat pricing should command higher ACV than PLuG baseline.

      No net revenue retention (NRR) figure is publicly disclosed. NRR is the most important
      durability metric for subscription ARR; top-quartile SaaS companies report NRR >130%. Without
      NRR, the ARR growth trajectory cannot be attributed to expansion vs. net-new customer
      acquisition — a critical distinction for capital efficiency and competitive moat validation.
    claimRefs: [CI006, CI007, CI008, CI009, CI010, CI011]
    figureRefs: [FI001]

  - id: S3
    title: Unit Economics and Cost Structure
    body: |
      DevRev's unit economics cannot be directly observed from public sources, but a framework
      can be constructed from available proxies. On the revenue side, an implied ACV (average contract
      value) can be estimated: at $100M ARR and 1,000+ customers, average ACV is approximately
      $100K — consistent with mid-market enterprise SaaS. Computer deployments may command higher
      ACVs given AI infrastructure costs. On the cost side, with ~850–940 employees at an estimated
      blended fully-loaded cost of $80–120K/year (US-India mix), total payroll runs $68–113M/year.

      Gross margin for AI-native SaaS is structurally below traditional SaaS levels. The a16z "New
      Business of AI" analysis found that AI application companies often operate at 50–65% gross
      margins vs. 70–80% for traditional SaaS, primarily due to LLM inference API costs. DevRev's
      Computer product, which runs large language model inference for autonomous ticket resolution,
      carries meaningful per-resolution AI infrastructure costs. High Alpha 2024 SaaS benchmarks note
      39% of companies with AI products report rising AI costs as a margin pressure. These structural
      factors suggest DevRev's gross margin likely falls in the 60–72% range — lower than pure-software
      SaaS peers but improving as inference costs decline and Computer outcome pricing is optimized.

      India subsidiary ROC filings provide a partial proxy: FY2024 operating margin of -3.06% and
      net margin of -2.65% on ₹100–150 crore revenue, suggesting the India operations are near
      breakeven (or at modest loss) — consistent with a cost-center or hybrid-margin R&D/delivery
      entity rather than a pure profit center. The US entity carries the bulk of sales, marketing,
      and G&A costs, which are expected to run at higher absolute negative margin.
    claimRefs: [CI012, CI013, CI014, CI015, CI016, CI017]
    tableRefs: [TI003]
    figureRefs: [FI002, FI003]

  - id: S4
    title: Capital Adequacy and Runway Analysis
    body: |
      At Series A close (August 2024), DevRev held approximately $100.8M in fresh capital plus any
      remaining balance from prior rounds (net of ~$50M seed cash deployed and ~$7.1M bridge cash
      deployed over the preceding 36 months). Estimating total cumulative cash: $158M total raised
      minus approximately $80–100M estimated cumulative spend from founding to Series A close yields
      a starting cash position at Series A close of approximately $110–130M.

      Monthly burn rate is unconfirmed but can be estimated from headcount and operating model:
      at 850 employees (blended cost $7,500–10,000/month fully-loaded) yields $6.4–8.5M/month
      payroll alone. Adding infrastructure, cloud costs, S&M, and G&A overhead, total monthly
      burn likely falls in the $8–12M range. At the midpoint ($10M/month), and with ~$110–130M
      estimated cash position at Series A, DevRev would reach 11–13 months runway from August 2024
      — a Series B raise by Q3 2025 to Q1 2026. No Series B announcement has been made as of
      June 2026, suggesting either: (a) burn rate is lower than estimated; (b) ARR growth is
      generating positive cash flow progression; or (c) a round is imminent but undisclosed.

      A Forge Global profile listing a "Confidential Filing" for DevRev has been noted in prior
      research, though this is unconfirmed. If DevRev filed an S-1 confidentially, a 2026 IPO or
      late-stage round would be consistent with needing capital before runway expires. DevRev's
      $1.15B valuation-to-$100M ARR multiple of ~11.5x was at-market for high-growth AI SaaS in
      August 2024 but will compress if growth slows below 40% YoY.
    claimRefs: [CI018, CI019, CI020, CI021, CI022]
    tableRefs: [TI004]
    figureRefs: [FI004]

  - id: S5
    title: Financial Verdict and Diligence Blockers
    body: |
      DevRev presents a credible revenue growth profile ($0 to ~$100M ARR in ~4 years) with a
      structurally sound revenue model (subscription + AI outcome hybrid). The $1.15B Series A
      valuation reflects legitimate investor confidence from Khosla Ventures and Mayfield in the
      AI-native enterprise software thesis. However, every key financial quality metric — gross
      margin, NRR, CAC, LTV, payback period — remains undisclosed, making this a thesis-driven
      bet rather than a fundamentals-driven investment at this stage.

      The most material financial risk is capital adequacy: with no confirmed Series B and estimated
      runway of 12–18 months from Series A close (August 2024), DevRev may be approaching a
      fundraising inflection point in 2026. If ARR growth has accelerated (>50% YoY), the next
      round will be favorable. If growth has plateaued at 30–40% on $100M ARR, the next valuation
      step is harder to justify without gross margin and NRR disclosure.

      India subsidiary ROC filings confirm a real operating business with material revenue and
      headcount, but show negative margins — validating both the growth-mode investment thesis
      and the capital dependency risk. A second adverse signal: the absence of any audited financial
      statements in a company with a 5-year history and $1.15B valuation is consistent with
      private company norms but creates information asymmetry that limits outside diligence.
    claimRefs: [CI023, CI024, CI025, CI026, CI027]
    tableRefs: [TI005]

