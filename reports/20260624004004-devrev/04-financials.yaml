callouts:
  - calloutType: risk
    title: No Audited Financials — Thesis-Driven Investment
    body: |
      DevRev's entire investment thesis rests on self-reported ARR ($100M, Latka, June 2024) with
      no corroborating audited financial statements for the US holding entity. Every key quality
      metric — gross margin, NRR, CAC, payback, unit-level profitability — is unknown. Combined
      with an estimated 12–22 month runway from Series A close (August 2024), investors face material
      information asymmetry. This is consistent with norms for pre-IPO Series A stage companies,
      but the $1.15B valuation creates an expectation of more rigorous financial disclosure than
      a typical $50M seed-stage company.
    claimRefs: [CI023, CI024, CI025]

