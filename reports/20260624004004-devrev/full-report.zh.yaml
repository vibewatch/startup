      - number: '5.2'
        title: 工作流覆盖与用例
        blocks:
          - type: paragraph
            body: >
              DevRev 的 GTM 动作围绕两个主要工作流包：（1）面向中型市场科技公司的工程 + 支持统一工作流，工程和支持团队都在 DevRev 上，从而消除 Zendesk 到 Jira
              的工单升级流程；（2）面向希望通过自主解决降低支持量和成本的企业的 Computer AI 部署工作流。


              Pebl 案例显示，Computer 自动解决 85% 工单。BILL（节省 $5M）案例验证了统一平台对财务运营团队的 ROI。Velocity Global、Bolt 和 Descope
              部署确认企业客户采用已超出 SMB/初创公司。


              DevRev 的工作流自动化层包括：自动路由（基于规则和基于 ML）、智能升级（N 小时后将未解决工单升级给工程）、知识库自助服务（Computer 调出文章以拦截工单），以及产品反馈综合（把客户投诉连接到产品
              backlog 项）。


              Computer 客户工作流：（1）客户通过网页、邮件或 PLuG 组件提交支持请求；（2）Computer 取回相关知识图谱上下文（过往解决、工程工单、产品文档、客户历史）；（3）Computer
              生成自主回复，或带着完整上下文转给人工 agent；（4）如果转给工程，系统会自动创建一个关联工程问题，并附上完整客户上下文。
