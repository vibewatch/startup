      - number: '6.4'
        title: 留存信号令人鼓舞，但集中度和持久性仍需管理层尽调
        blocks:
          - type: paragraph
            body: >
              留存证据存在，但多数是轶事化、绑定具体 reference。Bolt 是最明确的案例，称留存改善 25%；BILL 表示满意度保持稳定或改善；Descope 提到快速扩张期间完整遵守
              SLA。独立评论者也报告了有意义的运营 ROI，包括具名部署中的 60% PLuG deflection、30% 生产率提升、20% 成本节省和解决速度快
              50%。这些信号有用：客户上线后确实获得价值，而不是只完成实施。


              问题在于仍未披露的部分。我们审阅的公开来源没有给出 DevRev 全公司的 NRR、GRR、churn 或 renewal 统计。也没有来源量化 top-customer concentration 或
              top-10 revenue mix。这意味着尽调团队可以描述一个合理的 land-and-expand 模式，但还不能像判断采用率那样有信心地承销持久性。评论来源还注入了一个真实反向信号：DevRev
              以开发者为中心的界面可能压垮非技术或 support-first 团队；在某些工作流中，它看起来仍不如成熟 helpdesk incumbents 打磨充分。这不推翻 thesis，但会限制可服务
              segment，除非产品打磨持续改善。
