  - number: 3
    title: 竞争对手
    sections:
      - number: '3.1'
        title: 竞争格局概览
        blocks:
          - type: paragraph
            body: >
              DevRev 进入的市场里，其三根目标支柱各自都有根深蒂固的单点方案领导者。客户支持和 CX 领域，Zendesk（$10.2B 私有化，100K+ 客户）和 Intercom（30,000+
              客户）拥有庞大装机基础和深厚工作流自动化。在工程项目管理领域，Atlassian/Jira（300K+ 客户，$34B 公开市值）和快速增长的 Linear 主导开发者心智。在 CRM 领域，Salesforce
              全球市场份额 20.7%，收入基数 $37B，并通过 Agentforce 激进扩张到 agentic AI。


              竞争格局分成两端：狭窄单点方案厂商与宽平台存量厂商。DevRev 试图占据中间的结构性空隙：一个统一、AI 原生的界面，去掉 Zendesk、Jira 和 Salesforce
              之间的胶水代码。这一定位既是增长向量（对 CIO 有整合吸引力），也是风险向量（存量厂商可通过集成或收购补上缺口）。截至 2026 年中，每个主要竞争者都已推出 AI agent 能力，把 DevRev
              的差异化从「从第一天起就是 AI 原生」压缩为「AI 背后有更丰富的语义数据模型」。


              在 DevRev 当前装机基础中，多栖使用是最常见的竞争结果：企业经常采购 DevRev 来统一工程—支持工作流，同时保留 Salesforce 作为销售 CRM 的记录系统。这验证了 DevRev
              的利基价值，但也限制了总平台替代空间。
