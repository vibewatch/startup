      - number: '4.5'
        title: 财务结论与尽调阻断项
        blocks:
          - type: paragraph
            body: >
              DevRev 呈现出可信的收入增长画像（约 4 年从 $0 到约 $100M ARR），收入模式也结构上成立（订阅 + AI 结果计费混合）。$1.15B Series A 估值反映 Khosla
              Ventures 和 Mayfield 对 AI 原生企业软件逻辑的真实信心。但每一个关键财务质量指标——毛利率、NRR、CAC、LTV、回本周期——都未披露，使现阶段投资更像押注逻辑，而不是基于基本面的投资。


              最重要的财务风险是资本充足性：在没有确认 Series B、且估算 runway 为 Series A 交割后 12–18 个月（2024 年 8 月）的情况下，DevRev 可能在 2026
              年接近融资拐点。如果 ARR 增长已加速（>50% YoY），下一轮会有利；如果增长停在 $100M ARR 上的 30–40%，没有毛利率和 NRR 披露，下一步估值很难证明合理。


              印度子公司 ROC 申报确认公司有真实运营业务，收入和员工规模都不小，但利润率为负——既验证了增长模式投资逻辑，也验证了资本依赖风险。第二个不利信号是：一家有 5 年历史、估值 $1.15B
              的公司没有任何审计财务报表，虽符合私营公司常态，却制造了限制外部尽调的信息不对称。
