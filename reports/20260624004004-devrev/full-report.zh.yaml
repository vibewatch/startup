companyProfile:
  summary: >
    DevRev（DevRev, Inc.）是一家总部位于 Palo Alto 的 AI 原生企业软件公司，2020 年 10 月由 Dheeraj Pandey（Nutanix 前 CEO；Nutanix 2018 年 IPO 融资
    $2.8B）和 Manoj Agarwal（Nutanix
    前工程高级副总裁）创立。公司的核心产品是一套专有语义知识图谱，把客户支持工单、工程任务、产品功能和代码变更原生连进同一个数据模型——Zendesk、Atlassian/Jira、Salesforce
    等存量方案都没有这种结构性差异。在这套知识图谱之上，DevRev 做出三款商业产品：PLuG（工程 + 支持 + PM 统一平台，2022 年 GA）、AgentOS（AI agent 编排层，2024 年）和
    Computer（全自主 AI 客服 agent，2026 年 5 月 GA，声称工单自动解决率 ≥80%）。DevRev 2024 年 8 月完成 Khosla Ventures 领投的 $100.8M Series A，投后估值
    $1.15B，进入独角兽行列。截至 2026 年中，DevRev 拥有 1,000+ 企业客户，250+ 组织在生产环境使用 Computer，自报 ARR 约 $100M。
