      - number: '1.2'
        title: 创始人、管理层与治理
        blocks:
          - type: paragraph
            body: >
              DevRev 由两位曾一起打造 Nutanix 的高管联合创立。Dheeraj Pandey（CEO）2009 年联合创立 Nutanix，从创立起担任 CEO 至 2020 年 12 月，并带领公司完成
              2016 年 NASDAQ IPO（股票代码 NTNX），这是当时规模最大的科技 IPO 之一。Pandey 拥有 IIT Kanpur 计算机科学学士学位（1997）和 University of Texas
              at Austin 硕士学位，目前担任 Adobe 董事。Manoj Agarwal（总裁 / 联合创始人）在联合创立 DevRev 前任 Nutanix 工程高级副总裁。更广泛的高管团队包括 Ahmed
              Bashir（CTO，前 Nutanix 工程负责人）、Michael Machado（产品与品牌 CVP）和 Chandra Nath（财务、战略与投资者关系 CVP）。Khosla Ventures 的
              Vinod Khosla 与 Mayfield Fund 的 Navin Chaddha 是董事会观察员或顾问。关键人风险集中在 Dheeraj Pandey：他的个人品牌和投资者关系是 DevRev
              融资叙事的核心；Pandey 也是少数曾以 CEO 身份带出两家独角兽的印度裔美国创始人之一。创立以来没有公开披露的重大管理层变动。Tracxn 显示董事会成员包括 Manoj Agarwal 和 Dheeraj
              Pandey，且列为独立董事，说明治理结构仍保留显著创始人控制。
