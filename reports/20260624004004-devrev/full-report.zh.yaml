  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: Incumbent AI 投入让份额获取变成与更大平台赛跑
        blocks:
          - type: paragraph
            body: >-
              DevRev 面对的已不再是静态 ticketing tools。市场正在被 incumbents 重画，它们已经把 AI 叠加到巨大的既有分发上。Salesforce 把 Agentforce 包装成接入
              industry clouds、workflows 和 APIs 的 autonomous agents。Zendesk 主推 AI agents、copilots、automation、analytics
              和大型 marketplace。Atlassian 把 Rovo 定位为跨 SaaS applications 的搜索和聊天层，Intercom 则把 Fin 定位为可叠在多个 helpdesks 之上的 AI
              service agent。换句话说，brief 中点名的三家 incumbents 都在投入 AI，相邻 challengers 也一样。


              DevRev 确实有锋利 wedge：它公开把 Zendesk、Salesforce Service Cloud、Intercom 和 Atlassian Jira
              作为替换或共存对象，并把快速迁移作为故事的一部分来销售。这很重要，因为它确认公司不是只想赢 greenfield accounts；它试图替换企业已经信任、用于关键服务运营的系统。问题是，替换不只需要更好的
              demo。它还需要干净迁移、更低感知风险、可信 AI governance，以及足够深的生态，让买家切换后不觉得被困住。


              DevRev 自己材料里能看到策略张力。定价语言覆盖 fast-growing startups 到 100k-employee
              enterprises，商业上有吸引力，运营上却很难。产品既要足够简单，能轻量采用；也要满足大型服务组织对定制、合规和 uptime 的要求。如果 DevRev 低端服务不足，self-serve wedge
              会变弱；如果高端服务不足，incumbent replacement 的故事会在扩张开始前断掉。
