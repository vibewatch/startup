      - number: '4.4'
        title: 资本充足性与 runway 分析
        blocks:
          - type: paragraph
            body: >
              Series A 交割时（2024 年 8 月），DevRev 持有约 $100.8M 新资本，加上此前轮次剩余余额（扣除约 $50M 种子轮现金消耗和此前 36 个月约 $7.1M
              过桥现金消耗）。估算累计现金：$158M 累计融资减去从创立到 Series A 交割约 $80–100M 的累计支出，得到 Series A 交割时约 $110–130M 的起始现金头寸。


              月 burn rate 未确认，但可从员工数和运营模型估算：850 名员工（全负荷混合成本 $7,500–10,000/月）仅薪酬就达 $6.4–8.5M/月。加上基础设施、云成本、S&M 和 G&A 开销，总月
              burn 可能落在 $8–12M 区间。按中点（$10M/月）以及 Series A 时约 $110–130M 估算现金头寸，DevRev 自 2024 年 8 月起 runway 为 11–13 个月——需要在
              2025 年 Q3 到 2026 年 Q1 完成 Series B。截至 2026 年 6 月尚无 Series B 公告，说明可能是：（a）burn rate 低于估算；（b）ARR
              增长带来现金流改善；或（c）一轮融资临近但未披露。


              既往研究注意到 Forge Global 资料将 DevRev 标为「Confidential Filing」，但该信息未经确认。如果 DevRev 已秘密提交 S-1，那么 2026 年 IPO 或后期轮次，与
              runway 到期前补充资本的需求相符。DevRev $1.15B 估值对应 $100M ARR 的倍数约 11.5x，在 2024 年 8 月对高增长 AI SaaS 属于市场水平；若增长放缓至低于 40%
              YoY，倍数将压缩。
