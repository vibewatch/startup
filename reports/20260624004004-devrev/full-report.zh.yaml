    columns:
      - 维度
      - 当前观点
      - 证据基础
      - 什么会改变观点
    rows:
      - - 投资建议
        - 继续研究 / 纪律化跟踪
        - 可比公司组、披露质量和折扣因素支持谨慎，而不是激进承销
        - 只有在 ARR 质量、NRR、毛利率和 AI 准确率经审计验证后，才上调观点
      - - 信心
        - 中
        - 融资历史和市场背景证据充分；当前运营质量不是
        - 当年指标和 cap-table 透明度会提高信心
      - - 估值立场
        - 偏贵
        - 11.5x 高于公开可比公司区间，AI 溢价证据只能部分支撑
        - 如果增长和毛利质量在 AI-native 水平得到验证，估值才算合理
      - - 主要上行路径
        - 战略出售，或以高于 2024 年标记的价格完成后续私募轮
        - Salesforce / ServiceNow 战略逻辑，加上 AI 支持 attach 的上行空间
        - 需要更强证据证明 Computer 能显著扩大账户价值
      - - 主要下行路径
        - 倍数向公开可比公司水平压缩
