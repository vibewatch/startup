  - id: TI003
    title: 单位经济性表
    columns:
      - 指标
      - 估计值
      - 置信度
      - 为什么重要
      - 尽调问题
    rows:
      - - 年度经常性收入（ARR）
        - ~$100M（2024 年 6 月，Latka）
        - 低——自报，未经审计
        - 核心收入规模指标；估值倍数的基准
        - 索取已签约 ARR 明细，按客户逐一拆分；确认定义（GAAP 还是公司自定义）
      - - ARR 增长率（YoY）
        - ~43%（$69.9M 2023 年 7 月 → $100M 2024 年 6 月）
        - 低——两个数据点均为自报
        - 增长率驱动下一轮估值；需要 3+ 年数据确认趋势
        - 索取自成立以来每个季度的月度 ARR 瀑布（新增、扩张、收缩、流失）
      - - 毛利率（估计）
        - 60-72%（AI 原生 SaaS 区间）
        - 极低——按同业基准估算；DevRev 具体数字未知
        - 决定单位盈利能力；LLM 推理成本会压缩传统 SaaS 毛利（70-80%）
        - 索取按产品线拆分的审计毛利率；Computer AI 每张已解决工单的推理成本最关键
      - - 净收入留存（NRR）
        - 未知；多团队企业估计 >100%
        - 极低——未披露
        - 产品市场契合度和竞争护城河的最佳单一指标；顶级 SaaS 通常 >130%
        - 索取 3+ 年月度 cohort NRR，并按客户分层（单团队 vs. 多团队部署）
      - - 平均合同额（ACV）
        - ~$100K（推断：$100M ARR / 1,000+ 客户）
        - 低——推断；客户分母不精确
        - 决定销售效率和 GTM 动作；$100K ACV 指向中端市场企业销售模型
        - 索取按十分位拆分的 ACV 分布；若前 10 大客户 ACV 高度集中，会提示企业客户依赖
      - - 获客成本（CAC）
        - 未知；中端市场交易估计每单 $30-80K
        - 极低——从员工数 / 客户数比率推断
        - 回本期 = ACV × GM / CAC；>24 个月回本是资本效率红旗
        - 索取销售团队规模 + S&M 总费用 + 每年新增客户数；用于计算 CAC 和回本期
      - - 月度现金消耗
        - 估计 $8-12M/month（由员工数 + 运营推断）
        - 极低——无财务披露
        - 决定 runway 和资本依赖时间线
        - 向 CFO 索取最新月度 P&L 和 12 个月运营预算；这是最关键的尽调项
      - - Series A 交割后的 runway（2024 年 8 月）
        - 估计 11-16 个月（至 2025 年 6 月 – 2025 年 12 月），按 $8-12M/month 消耗
        - 极低——取决于未披露消耗和现金余额
        - 如果没有新融资而 runway 已到期，意味着融资已逾期，或增长已能自筹运营资金
        - 确认截至 2026 年 6 月的账上现金和当前月度消耗；如果 runway <6 个月，过桥融资风险很实质
