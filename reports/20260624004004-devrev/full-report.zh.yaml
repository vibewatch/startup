          - type: paragraph
            body: >
              DevRev 的采购流程涉及多方利益相关者。按用例不同，主要预算归属也不同：工程与产品团队（CTO、工程 VP、产品 VP）掌握问题跟踪和路线图管理工具预算；客户体验团队（CCO、客户成功
              VP、支持总监）掌握客户服务平台预算。在整合平台交易中，IT 采购（CIO、IT VP）裁决最终选择。

              按公司规模看，第三方分析显示 DevRev ARR 约 60% 来自企业账户（500+ 员工），30% 来自中型市场（50–500 员工），约 10% 来自更小的 prosumer 或自助账户。AI-first
              初创公司是增长最快的群体，受 LLM 驱动的工单聚类和情绪自动化吸引，采用率约同比增长 45%。

              采用触发点集中在：（1）工具疲劳事件，团队对在 Zendesk、Jira 和 Salesforce 之间切换上下文达到峰值挫败；（2）组织增长事件，员工超过 100–200
              人后，临时多工具组合开始崩塌；（3）C-suite 在竞争压力下发出的 AI 现代化要求。典型路径是从部门试点出发，跨职能扩张，最终走向完整平台整合。Tracxn 识别出邻近类别中 4,284
              家活跃竞争者，HubSpot、Salesforce 和 Zendesk 是主要类别级参照点。
