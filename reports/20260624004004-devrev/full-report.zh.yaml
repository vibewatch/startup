      - number: '2.5'
        title: 规模不确定性与尽调缺口
        blocks:
          - type: paragraph
            body: >
              DevRev 所在类别的市场规模测算很碎片化。最关键的差异是：Mordor Intelligence 估算 2026 年企业 AI 市场为 $114.87B，而 Precedence Research 为
              $30.16B——接近 4 倍差距，反映定义边界不同。MarketsandMarkets（$15.84B CEM，2026）和 TBRC（$14.17B CEM，2025）更一致，指向不含 AI
              基础设施的较窄市场定义。

              DevRev 自称 $50B TAM，但未公布方法论。一个可行构造是把客户支持软件（约 $13B）、CEM（约 $16B）、工程项目管理（约 $8B）和 AI 原生工作流自动化（企业 AI 软件层约
              $15–20B）相加，接近该数字——但 AI 原生自动化细分市场与更广义云基础设施之间边界模糊，使这一主张方向上可辩护，却无法独立验证。

              关键尽调缺口：没有独立分析师覆盖「统一 CX + 工程 AI 平台」这一具体类别；没有针对特定存量厂商的公开胜率数据；没有披露 cohort 层面的扩张收入数据。这些缺口限制了严谨的 SAM/SOM
              推导，也意味着 DevRev 的竞争定位叙事主要来自公司自报。
            claimRefs:
              - CM001
              - CM006
              - CM025
              - CM026
              - CM037
