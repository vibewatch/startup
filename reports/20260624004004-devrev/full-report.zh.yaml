      - number: '7.2'
        title: AI 证明、模型依赖和架构集中是核心技术风险
        blocks:
          - type: paragraph
            body: >-
              DevRev 的上行空间高度依赖 Computer：它必须更像可靠 operator，而不是炫技
              demo。公开材料描述的系统可以用共享记忆和知识图谱，在业务系统间搜索、推理、创建、更新并采取行动。这个设计是差异化核心，但也意味着产品风险高度集中。如果知识图谱在企业规模下变慢、过期、权限错配，或维护成本过高，让
              Computer 特别的同一架构就会变成最大的单点失败域。


              第二个风险是证据质量。DevRev
              传播了很强的结果主张，包括很高的自主解决率和显著客户节省；但公开支撑仍主要是公司出品的案例研究或新闻稿。这不代表主张为假，而是还没有达到受监管或高度风险敏感买家所需的尽调级证明。因此，当前公开记录更接近有说服力的商业化证据，而不是中立验证。


              第三个风险是模型集中。DevRev 的 DPA 承认 AI processing 和 subprocessors，但公开记录没有点名 LLM stack、fallback architecture 或
              rate-card protections。这种不透明很关键，因为模型成本、throughput 或政策条款变化时，AI 应用经济性会很快改写。状态页上 2026 年 6 月的 webhook incident
              也说明，可见的可观测性并不能消除运营脆弱性。一个承诺安全行动和自动化的平台，一旦可靠性失效，会很快传导为客户信任风险。
