      - number: '1.3'
        title: 融资历史、估值与投资者关系
        blocks:
          - type: paragraph
            body: >
              DevRev 三轮合计融资 $158M。首轮是 2021 年 7 月由 Mayfield Fund 和 Khosla Ventures 共同领投的 $50M 种子轮——规模异乎寻常，反映了创始人的 Nutanix
              履历以及早于 DevRev 的投资者关系。2022 年 8 月又完成一轮较小的 $7.1M 融资。$100.8M Series A 于 2024 年 7 月 10 日完成交割（2024 年 8 月 8
              日宣布），投后估值 $1.15B，由 Khosla Ventures 领投，Mayfield Fund 和 Dheeraj Pandey 家族办公室 Param Hansa Values 参投，另有科技 CEO
              与 VC 的加速器和家族办公室加入。Latka 显示，公司 2024 年 6 月 ARR 达到 $100M，高于 2023 年 7 月的 $69.9M ARR，约同比增长 43%。公司确认估值为
              $1.15B，部分二级市场来源称截至 2025 年末为 $1.2B。DevRev 明确表示采用「更小但更频繁融资」的策略，而不是少数大额轮次，并持续扩大投资者基础。截至 2026 年 6 月，没有新的公开融资或
              IPO 公告。Forge Global 将 DevRev 标为「confidential filing」状态——暗示早期 IPO 探索——但没有披露 S-1 或正式 IPO 日期。相对于 $1.15B
              估值，$158M 累计融资意味着所有轮次合计稀释约 11–14%，对独角兽阶段公司而言较为克制。
