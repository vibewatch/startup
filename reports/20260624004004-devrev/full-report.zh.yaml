      - number: '8.2'
        title: 可比公司分析
        blocks:
          - type: paragraph
            body: >-
              最有用的 comparable set 是混合组，而不是 pure-play。Freshworks、Zendesk、Salesforce 和 ServiceNow 框定 customer-support 与
              service workflow 的估值现实；Atlassian 捕捉 DevRev 定位中的 dev-tool 和 workflow 侧；Glean 和 Intercom/Fin 则框定 AI-native
              upside case。按 2026 年 6 月公开市场证据，Freshworks 约以 2.0x enterprise value to trailing revenue 交易，Atlassian 约
              3.3x，Salesforce 约 3.6x，ServiceNow 约 6.7x。Zendesk 2022 年 take-private 以约 6x revenue 完成，尽管当时有 30% growth 和正
              free cash flow，这给出了一个有用的 mature-CX floor。对照这些锚点，DevRev 11.5x 的隐含轮次倍数已经假设其 growth durability 和 AI
              monetization 明显优于成熟 public set。唯一能支持这种溢价的清晰证据来自 Glean 等 AI-native outliers：Glean 在超过 $100M ARR 后达到 $7.2B
              估值，并在 2026 年 5 月扩到 $300M ARR。因此，DevRev 夹在 public-software gravity 与 AI-outlier aspiration 之间。
            claimRefs:
