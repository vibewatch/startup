      - number: '8.4'
        title: DCF 考量与折扣因素
        blocks:
          - type: paragraph
            body: >-
              对 DevRev 做任何 discounted-cash-flow 判断，主导因素都是假设，不是披露。模型的支持侧很直接：AI application software
              仍可快速增长；如果自动化率高，outcome-based support pricing 会有吸引力；如果 Computer 成功 attach 到 installed base，DevRev
              有足够产品宽度在账户内扩张。约束侧在公开证据上更强。a16z 和 High Alpha 都把 AI software 描述为比传统 SaaS 更受 margin 结构影响，因为 inference costs
              落在 cost of goods sold 内；BVP cloud benchmarks 也显示，$100M ARR 左右的企业仍需要强 NRR 和纪律化 burn，才会成为有吸引力的公开市场候选。DevRev
              的印度实体又提供了一个硬负面数据点：来自 Tofler 的 filing data 显示 FY2024 revenue 为 ₹100-150 crore，但 operating margin 为
              -3.06%。公开证据仍未显示 DevRev 的实际 gross margin、CAC、payback 或已验证 AI resolution rate。正因这些缺口，DevRev
              的估值相对更干净的软件发行人应有折扣。
            claimRefs:
              - CV016
              - CV017
              - CV018
              - CV019
              - CV020
              - CV021
              - CV022
              - CV023
              - CV024
              - CV025
              - CV026
