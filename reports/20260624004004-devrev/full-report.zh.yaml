    sections:
      - number: '8.1'
        title: 上轮锚点与隐含倍数
        blocks:
          - type: paragraph
            body: >-
              DevRev 的公开估值锚点仍是 2024 年 8 月 Series A。公司关联报道和独立报道一致把该轮金额放在约 $100.8M，post-money valuation 约
              $1.15B，尽管部分标题四舍五入为 $1.1B 或 $1.2B。Latka 自报收入数据库显示 DevRev 在 2024 年 6 月约 $100M ARR，高于 2023 年 7 月约
              $69.9M，意味着入轮时 ARR 同比增长约 43%。用 $1.15B 锚点对照 $100M ARR，隐含 11.5x ARR multiple。对一家快速增长的 AI application company
              来说，这不明显荒唐；但对一个仍缺公开审计报表、公开 NRR 或披露 gross-margin profile 的企业软件发行人来说，这已经是 premium
              multiple。因此，投资人的第一项任务，是区分这个溢价由真实产品拉力支撑，还是主要由叙事支撑。
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV004
              - CV005
              - CV039
              - CV045
