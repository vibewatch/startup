  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 公开客户足迹广，受监管和支持密集型账户优势可见
        blocks:
          - type: paragraph
            body: >
              与同龄的许多企业软件初创公司相比，DevRev 公开客户证明更多，但证据并不均衡。最强的自上而下规模说法，是公司在 2024 年 8 月发布的声明：平台已有 1,000 多家客户；随后 2026 年 5
              月又称已有 250 多家组织在生产环境中使用 Computer。这些宽口径数字重要，因为它们把具名 reference set 定义为更大客户基础中的样本，而不是完整名录。样本本身覆盖 HR
              tech、fintech、insurance、e-commerce、security、logistics、workforce management 和 software
              infrastructure，支持一个判断：DevRev 并不依赖单一狭窄 niche。


              尽调最该看的可见集群，是受监管、支持负载重的企业工作流。BILL、ICICI Prudential、Bajaj Finserv、Aditya Birla Capital、HDFC Bank 以及其他金融相邻
              reference 都出现在公开线索中；DevRev 同时在 Bengaluru、Chennai 和 Mumbai 设有办公室。这不能证明印度收入集中，但说明印度既是运营基地，也是 reference
