      - number: '7.4'
        title: 资本效率、印度实体可见性和创始人依赖定义商业模式风险
        blocks:
          - type: paragraph
            body: >-
              DevRev 已经融到重资本，但相对于 unicorn 估值暗示的野心，公开财务记录仍很薄。公司宣布 2024 年完成 $100.8M Series A，估值 $1.15B；此前有 $50M seed，以及
              Tracxn 列为 $7.1M 的 2022 年中间轮。这段历史显示投资人反复押注创始人和产品故事，也说明公司很早就需要显著资本。Latka 数据库级 ARR
              数字有助于框定规模，但仍是自报而非审计。公开免费来源没有提供 consolidated P&L、group cash balance 或已验证 gross margin。


              印度实体同时带来安慰和风险。它证明 DevRev 有真实运营足迹；此前 registry snapshots
              指向印度有可观收入、亏损和数百名员工。但当前免费来源无法清晰看到精确经济性，外部投资人仍不能干净判断增长中有多少由健康软件 margins 支撑，多少处在 founder-backed investment
              mode。员工数同样嘈杂：Unify 和 Tracxn 相差数百人。这种不确定性在私营公司中可管理，但会直接削弱对 burn 和 runway 的精确判断。


              人的风险会放大财务风险。Dheeraj Pandey 仍是公司融资、产品愿景和媒体报道中的核心面孔，早期投资人热情也明确连接到创始人的 Nutanix 记录。公开材料确认 Manoj Agarwal
              和全球团队存在，但没有给出足够运营 bench 细节来消除 key-person concern。如果增长放缓或合规工作吃掉领导层注意力，创始人集中会变得更重要。
