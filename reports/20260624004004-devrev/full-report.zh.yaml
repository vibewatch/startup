  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与定义
        blocks:
          - type: paragraph
            body: >
              DevRev 位于三个过去彼此分离的软件类别交汇处：客户体验管理（CEM）、工程项目管理（问题、sprint、路线图）和 AI 原生工作流自动化。其平台定位为统一替代方案，替代那些把 Zendesk 或
              Freshdesk 用于客户支持、Atlassian Jira 或 Linear 用于工程任务跟踪、Salesforce Service Cloud 用于 CRM 的组合栈——这些工具各自演进，缺乏原生数据连通。

              因此，市场边界不是单一分析师类别，而是一个正在形成的 AI 原生企业运营层。相关支出池包括：（1）客户支持软件，2025 年 $12.8B，2034 年增至
              $28.4B（Dataintelo）；（2）CEM，2025 年 $14.17B，2030 年增至 $30.24B，CAGR 16.2%（TBRC）；（3）更广义 CX 平台，2025 年
              $12.95B，2035 年增至 $51.5B，CAGR 14.8%（FMI）。

              DevRev 的一级市场不包括纯销售自动化、核心 DevOps 工具链（CI/CD、代码仓库、基础设施监控）、营销自动化和联络中心电话系统。这些邻近领域会通过集成发生互动，但主要代表由竞争对手控制、DevRev
              初期并不替代的支出。

              DevRev 组合产品的现状替代品，是目标客户当前运行的多供应商栈。BetterCloud 2025 State of SaaS 研究发现，平均每家企业管理 106 个 SaaS 应用——这正是 DevRev
              营销直接引用的碎片化栈问题。从这些根深蒂固的栈切换出来，是 DevRev 获取客户的主要约束。
