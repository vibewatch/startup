  - id: TV004
    title: 估值折扣因素表
    columns:
      - 折扣因素
      - 观察到的证据
      - 为什么影响价值
      - 当前严重性
      - 什么会降低折扣
    rows:
      - - 未审计 ARR 质量
        - $100M ARR 锚点来自 Latka 自报，未经审计，也未与 GAAP 收入调和
        - 如果 ARR 包含已签约但尚未上线的收入，11.5x 倍数就被高估
        - 高
        - 提供 billed ARR / GAAP 收入桥，以及按实施进度调整后的 live ARR
      - - 印度实体运营亏损
        - Tofler 衍生备案数据显示 FY2024 收入 ₹100-150 crore，经营利润率 -3.06%
        - 子公司利润率为负，会削弱对近期合并 FCF 转化的信心
        - 中
        - 展示合并利润率桥，并解释印度实体的转让定价 / 成本中心角色
      - - AI 毛利压力
        - a16z 和 High Alpha 都指出，AI 推理成本相较传统 SaaS 毛利率会带来压力
        - 如果 outcome 定价过薄，更高的可变 COGS 会压缩合理倍数
        - 高
        - 披露混合毛利率和每次 Computer resolution 的单位经济性
      - - 公开定价不透明
        - DevRev 定价页仍把买家导向销售，而不是披露套餐层级
        - 包装不透明让同业对标和利润率建模更难
        - 中
        - 发布更清晰的席位、用量或 credit 定价，并附上假设
      - - AI 解决准确率未验证
        - 公开证据显示 250+ 个组织已生产部署，但没有第三方验证的解决率标杆
        - AI 溢价取决于真实自动化质量，而不只是部署数量
        - 高
        - 提供经审计或客户验证的解决率、分流率和 ROI 指标
      - - Cap-table / 优先权积压未知
        - 没有公开数据披露清算优先权、参与型优先股或二级市场压力
        - 普通股退出估值可能与头条企业价值发生实质偏离
        - 中
        - 在尽调中共享 cap-table 摘要和优先权堆栈
    notes: 这些是估值折扣，而不是推翻 thesis 的因素；多个折扣可以同时存在，而不否定产品质量。问题在于，它们都会扩大公允价值区间。
