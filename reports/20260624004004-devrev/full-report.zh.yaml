      - number: '7.5'
        title: 剩余暴露仍可通过投资管理，但必须设置明确 kill criteria
        blocks:
          - type: paragraph
            body: >-
              合在一起看，DevRev 的风险画像不是简单的「too risky」结论。公司显然有真实客户、严肃 backers 和连贯的产品想法。挑战在于最大风险会互相作用。如果合规工作拖慢大客户
              rollout，usage-based AI economics 可能变差，因为昂贵的模型和支持成本要摊到更少成功扩张上。如果企业账户需要的定制或服务多于预期，统一平台故事可能滑向 labor-heavy
              delivery model，而不是干净的软件复利模型。如果产品对技术团队仍比对 support-first 组织更容易，DevRev 也许能赢得亮眼 references，却无法拓宽到足以支撑估值叙事的范围。


              因此，thesis-break monitoring
              比静态排名更重要。正确问题不是每个风险是否存在；它们显然存在。正确问题是缓释是否比暴露成熟得更快。今天的公开证据显示部分但不完整的缓释：隐私文件存在、trust materials 存在、status
              transparency 存在，迁移 messaging 也强。仍缺的是独立证明：AI 结果、margins、领导层深度和受监管客户控制能一起干净扩张。在证据出现前，投资人应把 DevRev
              视为高上行、高执行风险的平台故事，而不是已去风险的企业软件 compounder。
