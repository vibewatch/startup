      - number: '3.2'
        title: 直接竞争者：客户支持与 CX 层
        blocks:
          - type: paragraph
            body: >
              Zendesk 是 DevRev 在客户支持细分市场最直接的替代竞争者。Permira 和 Hellman & Friedman 2022 年 11 月以 $10.2 billion 将 Zendesk
              私有化；Zendesk 服务全球 100,000+ 客户，并已发布 Zendesk AI（由 Anthropic 驱动），提供自动化和 copilot 功能。其公开价格层级为每 agent 每月 $19 至
              $115+。DevRev 的定位口号——「Zendesk deflects, DevRev resolves」——强调其主张：Zendesk 的反应式工单模型无法提供 DevRev Computer
              产品给出的上下文 AI 解决。Zendesk 深厚的集成生态（1,500+ apps）是锁定向量，抬高了 DevRev 的替换成本。


              Intercom 已激进转向「Fin AI」，按结果计费，起价每次解决 $0.99，瞄准与 DevRev 相同的「AI-first 客户支持」利基。凭借 30,000+ 客户以及 Fin 每周解决 >2M
              对话的验证，Intercom 是最接近的 AI 定位类比。但 Intercom 缺少工程 / 产品管理层。


              Freshdesk（Freshworks，FRSH，约 $650M TTM 收入）以 $19–$89/agent 的价格层级服务 SMB
              和中型市场。其宽产品套件（Freshdesk、Freshservice、Freshsales）制造 CRM+支持捆绑压力。HubSpot Service Hub（300K+ 客户，$3.3B+ TTM 收入）以
              $7–$150/seat 提供 CRM 加支持，吸引偏好单一供应商的 SMB 买方。
