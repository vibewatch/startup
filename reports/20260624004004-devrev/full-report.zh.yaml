      - number: '4.2'
        title: 财务牵引力与 ARR 增长画像
        blocks:
          - type: paragraph
            body: >
              DevRev 披露的 ARR 增长是头号财务指标，也是投资逻辑的主要验证点。基于 Latka 数据库记录（依赖 CEO 自我披露）：2023 年 7 月 ARR 约 $69.9M，2024 年 6 月约
              $100M，意味着约 43% 同比增长。$100M ARR 里程碑与 2024 年 8 月 Series A 交割同步。ARR 从 $0 增至 $69.9M 大约用了 36 个月（2020 年 10
              月创立，首个产品 2022 年 GA）。这一速度符合前四分位 B2B SaaS 增长基准，但低于通常支撑 15–20x ARR 倍数的超高速增长阈值（>100% YoY）。


              截至 2024 年 8 月，客户数增至 1,000+ 组织（公司披露）；截至 2026 年 5 月，250+ 组织在生产环境部署 Computer。1,000+ 总客户与 250+ Computer
              部署之间的差距，反映装机基础分为两层：尚未迁移到 AI agent 层的遗留 PLuG 客户。这一迁移率是每客户 ARR 扩张的关键领先指标，因为 Computer 的结果计费或高端席位定价应高于 PLuG 基线
              ACV。


              公司未公开披露净收入留存（NRR）。NRR 是订阅 ARR 最重要的耐久性指标；前四分位 SaaS 公司报告 NRR >130%。没有 NRR，就无法判断 ARR
              增长来自扩张还是净新客户获取——这对资本效率和竞争护城河验证至关重要。
