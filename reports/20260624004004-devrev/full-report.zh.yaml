      - number: '4.3'
        title: 单位经济与成本结构
        blocks:
          - type: paragraph
            body: >
              DevRev 的单位经济无法从公开来源直接观察，但可以用可得代理搭出框架。收入侧，可估算隐含 ACV（平均合同价值）：$100M ARR、1,000+ 客户，对应平均 ACV 约 $100K——符合中型市场企业
              SaaS。考虑 AI 基础设施成本，Computer 部署可能拿到更高 ACV。成本侧，按约 850–940 名员工、估算混合全负荷成本 $80–120K/年（美国—印度组合），总薪酬为 $68–113M/年。


              AI 原生 SaaS 的毛利率在结构上低于传统 SaaS。a16z「New Business of AI」分析发现，AI 应用公司通常毛利率为 50–65%，而传统 SaaS 为 70–80%，主要因为 LLM
              推理 API 成本。DevRev 的 Computer 产品为自主工单解决运行大语言模型推理，承担有意义的按解决量 AI 基础设施成本。High Alpha 2024 SaaS 基准指出，39% 拥有 AI
              产品的公司称 AI 成本上升形成利润率压力。这些结构性因素意味着 DevRev 毛利率很可能落在 60–72% 区间——低于纯软件 SaaS 同业，但会随着推理成本下降、Computer 结果定价优化而改善。


              印度子公司 ROC 申报提供了部分代理：FY2024 营业利润率 -3.06%、净利率 -2.65%，收入 ₹100–150 crore，说明印度运营接近盈亏平衡（或小幅亏损）——更像成本中心或混合利润率的研发
              / 交付实体，而非纯利润中心。美国实体承担大部分销售、营销和 G&A 成本，预计绝对负利润率更高。
