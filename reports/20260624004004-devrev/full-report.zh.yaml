      - number: '5.3'
        title: 技术架构与基础设施
        blocks:
          - type: paragraph
            body: >
              DevRev 的 API 接口基于 OpenAPI 3.0 规范（公开版和 beta 版），支持基于 PAT 的认证、OAuth 2.0 服务账号、webhook 投递，以及类似 Slack 应用平台的
              Snap-in 自动化框架。Snap-in marketplace 让第三方集成和定制工作流自动化可以接入，无需 fork 代码库。


              API 领域模型包括：代码变更、对话、账户、parts（产品功能）、articles（知识库）、work items（工程问题）、timeline
              entries、vistas（视图）、可观测性事件、调查、自定义对象、认证 token 和网络爬虫任务。这个宽领域模型体现了统一的跨职能数据架构。


              DevRev 运行在 AWS 多区域基础设施上，已确认区域包括 US East（N. Virginia）、APAC Mumbai、APAC Sydney、APAC Singapore 和 EU
              Frankfurt。这一多区域布局帮助 EU（GDPR）和 APAC 客户满足数据驻留合规。状态页（status.devrev.ai）提供 API、认证、support portal、PLuG
              Platform、issue management、marketplace、search、timeline、vistas、conversation/ticket management 和 Computer
              的实时组件级可见性，反映出较成熟的运营可观测性能力。


              AI 层使用 LLM 集成（可能是 OpenAI/Anthropic API 加 DevRev Turing 微调模型），知识图谱承担上下文检索层（RAG 模式）。DevRev Turing 是公司自有的 AI
              开发工具集，可能涵盖基于专有「支持到工程解决」语料训练的领域微调模型。
