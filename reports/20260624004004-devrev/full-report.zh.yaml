              - CV018
              - CV020
              - CV024
              - CV039
              - CV040
              - CV043
      - number: '8.5'
        title: 建议与所需证明
        blocks:
          - type: paragraph
            body: >-
              证据支持下最强的结论是：DevRev 仍具战略吸引力，但对估值敏感。上一轮披露时，公司为自己买到了证明权：它要证明自己更像 AI-native workflow winner，而不是溢价定价但最终常规的
              enterprise application company。今天的公开证据还没有完全闭环。如果 $100M ARR 锚点真实、增长仍接近 40% 区间、Computer 显著拉动账户扩张，且 AI
              support economics 向软件式 margins 收敛，11.5x 隐含轮次倍数可以辩护。但如果 ARR quality 被 contracted-but-not-live revenue
              抬高、Computer penetration 卡在 250 多客户附近，或 burn 因每次 AI interaction 的 gross profit 过薄而持续偏高，这个倍数就很难辩护。因此，审慎姿态应是
              research-more / disciplined tracking，而不是 aggressive underwriting。尽调负担很清楚：在接受上一轮 mark 作为持久 fair value 前，先验证
              ARR quality、gross margin、NRR、current cash burn、liquidation preferences 和真实世界 AI resolution accuracy。
            claimRefs:
              - CV035
              - CV036
              - CV037
              - CV038
          - type: table
            tableRef: TV005
            claimRefs:
              - CV035
              - CV036
              - CV037
              - CV038
          - type: figure
            figureRef: FV004
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
              - CV037
              - CV038
      - number: '8.6'
        title: 图表
        blocks:
          - type: callout
            title: 溢价真实存在，但不是 AI-outlier 溢价
            body: >-
              DevRev 11.5x 的隐含倍数明显高于成熟 public-support comps，但仍远不到 Glean 式 AI outlier 区间。因此，承销问题不在 TAM hype，而在 DevRev
              是否证明自己值得继续高于 software gravity。
            calloutType: insight
            claimRefs:
              - CV005
              - CV006
              - CV012
              - CV043
          - type: callout
            title: ARR 质量是最重要的估值折扣
            body: >-
              如果 $100M ARR 主张中有任何部分只是已签约但未部署，上一轮倍数会机械上升，战略 / IPO 上行区间会变窄。公开证据尚未显示 billed-revenue bridge 或经审计 ARR
              definition。
            calloutType: risk
            claimRefs:
              - CV023
              - CV024
              - CV025
          - type: callout
            title: 密切跟踪，但不要只靠叙事承销 mark
            body: >-
              DevRev 值得持续关注，因为产品和战略收购方逻辑真实存在。但基于公开证据，它还不值得 conviction pricing，因为 growth quality、unit economics 和 AI
              resolution accuracy 仍验证不足。
            calloutType: recommendation
            claimRefs:
              - CV036
              - CV037
              - CV038
