      - number: '6.2'
        title: 案例研究给出具体 ROI，尤其在 DevRev 替换碎片化支持栈时
        blocks:
          - type: paragraph
            body: >
              最好的公开证明不是客户数量标题，而是几份案例研究里对结果细节的披露深度。BILL 是最清晰的旗舰 reference：它评估了 15 个以上替代方案，在 200,000 条查询的 PoC 中验证了 70%
              解决率，15 周完成推出，并称该项目让公司有望超过 $5 million 节省目标，同时保持客户满意度。Pebl 提供了第二个高质量叙事：一家全球 HR 平台把约 900,000 张工单、600 个 macros
              和 350 多名用户迁移到 DevRev，同时提升 SLA 达成率。Bolt 则给出最明确的跨职能故事，把支持、产品和工程连在一起，并披露具体工单量和解决时间改善。


              支撑案例强化了同一模式。Descope 在没有增加支持人手的情况下扩展到每日 300 million participant sessions。ICICI Prudential 据称把问题解决时间缩短
              95%。Bajaj Finserv 用 session intelligence 修复 KYC 摩擦，把完成时间从 20 秒以上缩到 7 秒以下。Skedulo、FOSSA、Uniphore、C-DATA 和
              Aditya Birla Capital 描述的迁移 wedge 也一致：替换碎片化系统，集中上下文，再叠加自动化、搜索和分析。
