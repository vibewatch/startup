      - number: '8.3'
        title: 退出情景及其先决条件
        blocks:
          - type: paragraph
            body: >-
              战略退出逻辑真实存在，但仍有条件。Salesforce 是最清晰的买家 archetype，因为 Agentforce 和 Service Cloud 已经在攻击同一个 AI-enabled support
              workflow 问题；收购 DevRev 可以补上更 developer-native 的数据模型和现代 support-to-product 叙事。ServiceNow 是第二个合理买家，因为其
              Customer Service Management suite 触及同一支持栈，并能用强 public currency 支付战略倍数。Microsoft 通过 Dynamics 365 Customer
              Service 和 Copilot-era service tooling，也是不那么直接但仍可信的防御性 bidder。IPO path 只有在 DevRev 从创始人自报的 $100M ARR
              故事，毕业为可复制的 $200M 到 $300M ARR 公司，并披露更干净的 margin 和 retention 后才成立。没有这些证明，2026 年更现实的姿态不是承销公开上市时间表，而是围绕已验证
              attach、burn 和 gross-profit evidence，映射战略出售和 late-stage private financing 路径。
            claimRefs:
              - CV027
              - CV028
