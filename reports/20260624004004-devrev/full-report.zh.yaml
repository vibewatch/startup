      - number: '2.4'
        title: 增长驱动与采用约束
        blocks:
          - type: paragraph
            body: >
              DevRev 最大的结构性顺风，是 agentic AI 采用拐点。Gartner 2025 年 8 月预测称，拥有任务专用 AI agent 的企业应用少于 5%，到 2026 年底预计达到 40%。IBM
              另引 Gartner 称，33% 的企业软件应用将在 2028 年包含 agentic AI，高于 2024 年的 <1%。TechRepublic 报道，已在生产环境部署 AI agent
              的企业占比在四个月内几乎翻倍（2025 年 8 月 7.2%，2025 年 12 月 13.2%）。这场迁移不利于缺乏原生 agent 编排的遗留工单和 CRM 平台。

              第二个主要驱动是企业 SaaS 整合。ADAPT research（经 SAP 引用）发现，68% CIO 计划整合供应商版图，目标是将供应商数量减少 20%。BetterCloud 2025
              年数据相互印证：企业平均 106 个 SaaS 应用（低于 2023 年的 112 个）；70% IT 团队偏好统一平台。两者都验证了 DevRev 的定位。

              约束侧，企业 AI 采用障碍很重。Writer 2026 Enterprise AI Adoption Survey（n=2,400）发现，79% 组织面临挑战——较 2025 年增加两位数百分点——只有 29%
              从生成式 AI 看到显著 ROI。IBM 将数据质量、治理缺口、技能缺口和集成复杂度列为主要阻碍。从 Zendesk/Jira/Salesforce 切换的成本很高：企业类别替换周期通常为 12–18
              个月。TechRepublic 发现，截至 2025 年中，64% 公司仍卡在 AI 试点阶段。
