      - number: '6.3'
        title: GTM 动作看起来由迁移牵引，再靠 AI 模块和更广工作流所有权扩张
        blocks:
          - type: paragraph
            body: >
              公开证据指向一套可复制的商业 playbook。第一步，DevRev 从痛点明确的支持或服务运营工作流切入：Pebl 的路由高度依赖 spreadsheet，BILL 的知识散落在 Salesforce
              和支持系统里，Bolt 的 Zendesk 自动化脆弱，Skedulo 对 Salesforce Service Cloud 不满意，C-DATA 被 email 和 partner tools
              困住。第二步，AirSync 和一键连接器降低迁移摩擦，让 DevRev 能把自己定位成 legacy service stacks 的快速替代品。第三步，一旦 system of record
              建立，DevRev 扩展到 AI answering、session intelligence、search、analytics 和跨职能工作流，把产品和工程团队拉进同一张 graph。


              定价也强化了这一图景。DevRev 提供免费的 Mini plan 供评估，Pro 和 Max 则进入 contact-sales 的企业级打包，包含更强支持、更多集成、Agent Studio 和嵌入式 AI
              服务。Computer 也先面向 trusted testers 和现有客户推出，再扩大发布范围，说明公司正在把 installed base 作为第一扩张池。如果 attach 和 renewal
