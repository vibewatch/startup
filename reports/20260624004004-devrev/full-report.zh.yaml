        - API 访问控制；用户身份管理
        - Personal Access Token（PAT）；OAuth 2.0 服务账号；SSO（企业）
        - 企业 SSO 的 IdP 供应商（Okta、Azure AD、Google Workspace）
        - SSO 配置错误；客户侧 PAT 密钥管理实践；默认未要求所有 API 访问都启用 MFA
