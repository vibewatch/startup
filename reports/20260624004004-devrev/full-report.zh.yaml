      - number: '3.3'
        title: 开发者工具与工程工作流竞争者
        blocks:
          - type: paragraph
            body: >
              Atlassian/Jira 是占主导地位的工程问题跟踪器，拥有 300,000+ 客户。Jira 定价（Standard $7.91、Premium $14.54/用户/月）显著低于 DevRev
              隐含的企业价格，其 Rovo AI 层（2024 年 4 月推出）在 Jira、Confluence 和 Atlassian Cloud 之间加入对话式 AI、知识图谱和自动化。虽然 Atlassian
              主要聚焦工程工作流，但其生态宽度（200+ 集成）、Confluence 知识库和 Bitbucket 代码托管形成强工作流引力。Atlassian 约 $50–60B+ 的市值给了它激进扩张 AI 能力的资源。


              Linear 是增长最快的工程原生竞争者，已融资 $35M，估值约 $400M（Series B，2021），坚持开发者体验优先的设计哲学，定价 $10–$16/用户/月。Linear
              只专注软件项目管理，不提供客户支持或 CRM；因此它是部分重叠竞争者（DevRev 捕获那些长出狭窄问题跟踪需求的 Linear 客户）。GitHub Issues（Microsoft/GitHub
              生态）提供与代码仓库集成的免费问题跟踪，为早期工程团队制造零切换成本竞争。


              工程工作流细分对 DevRev 当前装机基础的近期替代风险较低（其客户以支持重的中型市场为主），但这是关键扩张护城河：拿下工程团队，可阻止 Jira 扩张到支持，并化解「我们已经有 Jira」的反对意见。
