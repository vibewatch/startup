            - CSAT 持平或提升
            - ~$5M 节省目标有望超额达成
        - label: Pebl
          values:
            - Computer 声称自动解决率达 85%
            - SLA 达成率接近完美
            - 支持团队处理时长下降
            - 90 万张工单、350+ 用户完成迁移
        - label: Descope
          values:
            - AI 应答占比从 32% 升至 40%
            - 提速 54%；22.8 天降至 10.4 天
            - CSAT 提升；SLA 遵守率 100%
