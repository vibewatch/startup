chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、商业模式与产品策略
        blocks:
          - type: paragraph
            body: >
              DevRev 2020 年 10 月创立，使命是打造「地球上最以客户为中心的公司」。公司的核心洞察是，企业软件把组织切成了难以穿透的孤岛——支持工具只和支持对话，CRM
              接不上产品，工程团队则留在自己的世界里。DevRev 的解法是一套统一知识图谱，把结构化数据（CRM 记录、backlog、工单）和非结构化数据（聊天、文档、邮件）连起来，为对话式 AI agent 供能。公司
              2022 年推出首个 GA 产品 PLuG（一款只需 7 行代码的客户沟通工具），随后推出 AgentOS 平台，并在 2025 年 9 月发布「Computer」——全对话式 AI 队友。到 2026 年 5
              月，已有 250 多家组织在生产环境上线 Computer，自 2025 年 9 月以来接入用户超过 1,000
              名。商业模式按消耗计费（基于用量，随采用程度而非员工数扩张），面向初创公司提供免费增值入口，面向大型组织提供企业层级。总部位于 1731 Embarcadero Road, Suite 100, Palo
              Alto, CA 94303，全球八个办公室覆盖 Bengaluru、Chennai、Mumbai、Singapore、Tokyo、Ljubljana、London、Austin 和 Buenos
              Aires。公司把产品策略称为「SaaS 2.0」——从零设计面向对话时代的 AI 原生应用，而不是把 AI 贴到遗留的工单中心工具上。
