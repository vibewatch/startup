        - LLM API 速率限制、延迟和成本上涨可能拖累 Computer 解决率和经济性
      - - 多区域 AWS 基础设施
        - 为所有数据中心提供计算、存储和网络
        - AWS（美国东部北弗吉尼亚、APAC 孟买 / 悉尼 / 新加坡、EU 法兰克福）
        - Amazon Web Services（单一云供应商）；未披露多云策略
        - AWS 全局性故障会影响所有区域；存在单一云供应商集中风险
      - - PLuG Web SDK 和 Mobile SDK
        - 面向客户的组件，用于终端用户支持交互
        - JavaScript（web）、Android SDK、iOS SDK、React Native、Flutter、Cordova 接入
        - 客户部署环境（web、mobile）；客户必须集成 SDK
        - 客户集成质量不一；客户应用里的过时 SDK 版本可能引发支持入口 bug
      - - Snap-in 市场和 webhook
        - 面向第三方工作流自动化的扩展与集成框架
        - 自定义 Snap-in 运行时 + webhook 投递系统
        - 第三方 snap-in 开发者；客户侧 webhook endpoint 可靠性
        - 市场质量不一；恶意或代码质量差的 snap-in 可能引入安全漏洞
