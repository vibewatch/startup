  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 业务影响
      - 精确尽调路径
    rows:
      - - 经审计合并损益表（美国控股实体）
        - 无法验证 ARR、毛利率、运营亏损或现金头寸；整个财务判断都建立在自报和估算数字上
        - 在数据室索取经审计财务报表（FY2022、FY2023、FY2024）；确认审计事务所；若公司已到 IPO 阶段，S-1 申报会提供这些信息
      - - 按 cohort 拆分的净收入留存（NRR）
        - SaaS 耐久度最重要的单一指标；无法区分增长来自扩张，还是被流失掩盖
        - 索取月度 NRR cohort 表（至少 3 年）；要求按分层（初创公司 vs. 企业）和产品（PLuG vs. Computer）拆 NRR
      - - 按产品线拆分的毛利率
        - 无法评估 Computer 盈利能力；AI 推理成本可能让当前规模下的 Computer 毛利低于 50%，甚至负毛利
        - 索取 COGS 拆分：托管 / 基础设施、AI 推理 API 成本、支持成本、专业服务成本；这是建模盈利路径的核心
      - - CAC 和回本期
        - 无法评估销售效率，也无法判断扩张到下一档 ARR 需要多少资本
        - 索取销售团队 OpEx（S&M 总支出）、每季度净新增客户，以及按交易类型拆分的 ACV；用于计算 CAC/回本期
      - - 账上现金和当前月度消耗
        - 无法确认资本充足性；runway 估计高度不确定
        - 索取最新（2026 年 6 月）银行对账单摘要，或 CFO 对账上现金和过去 3 个月消耗率的证明
      - - 按客户分层和地域拆分的 ARR
        - 无法评估增长质量：美国 vs 印度 vs APAC 收入组合，企业 vs SMB，Computer vs PLuG
        - 索取按分层拆分的 ARR 瀑布；印度实体 ROC 申报提供了部分代理指标，但不覆盖整个集团
    enumerationScope:
      coverage: exhaustive
      basis: >-
        Based on comprehensive review of public DevRev disclosures; all key financial metrics absent from public domain
        for US holding entity
    notes: 这张表列的是做定量财务分析所需的最低信息。所有项目都标为仅数据室可得证据。
    claimRefs:
      - CI023
      - CI024
      - CI025
      - CI026
      - CI027
