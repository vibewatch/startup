  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品架构与模块地图
        blocks:
          - type: paragraph
            body: >
              DevRev 的产品架构分为四个相互依赖的层，每一层都在共享语义数据模型之上增加能力。


              底座是 **知识图谱层**——一套专有图数据库，把所有企业对象（客户、支持对话、工程问题、产品功能、代码变更及其关系）建模为一等实体。这是 DevRev
              的核心架构差异：支持和工程之间不需要集成中间件，因为所有对象都共存在同一个语义 schema 中。知识图谱支持跨职能 AI 查询（例如「本月哪些工程提交修复了前 10 个客户 bug 报告？」），这是
              Zendesk + Jira + Salesforce 集成栈做不到的。


              **PLuG 平台**（2022 年 GA）提供面向用户的产品界面：工程问题跟踪器（竞争 Jira/Linear）、客户支持台（竞争 Zendesk/Freshdesk）、产品路线图管理（竞争
              Productboard/Aha!），以及面向客户的 PLuG 组件（JavaScript SDK + Android、iOS、React Native、Flutter、Cordova 移动 SDK）。


              **AgentOS**（2024）是建在知识图谱之上的 AI 编排层。企业可用它为特定工作流定义、部署和管理 AI agent——路由、分诊、升级、自动打标签、知识检索。AgentOS agent
              可组合：可以通过可视化 agent 构建器串联、分支和监控。


              **Computer**（2025 年 9 月 beta、2026 年 5 月 GA）是在 AgentOS + 知识图谱上运行的全自主客服 agent。Computer
              的差异在于它能访问完整知识图谱上下文——工程历史、产品路线图、过往解决方案——而不只是 Zendesk AI 或 Intercom Fin 能访问的支持工单历史。
