      - number: '2.2'
        title: 市场规模——TAM、SAM 与 SOM
        blocks:
          - type: paragraph
            body: >
              评估 DevRev 的 TAM，最好用三组视角：（1）自上而下看 CEM 加客户支持软件市场，（2）把企业 AI 市场视为赋能层，（3）自下而上看 DevRev 的目标账户宇宙。

              自上而下规模测算：把 MarketsandMarkets 的 $15.84B CEM 市场（2026）与 Dataintelo 的 $12.8B 客户支持软件市场相加，再加入估算 $5–8B
              的工程项目管理细分市场，2026 年合计池约 $30–35B。DevRev 声称的 $50B TAM 高于这一重叠区，可能纳入了企业层面的 AI 工作流自动化支出。

              企业 AI 背景：Mordor Intelligence 估算企业 AI 市场 2026 年为 $114.87B，2031 年增至 $273.08B。Precedence Research 给出更窄的 2026
              年 $30.16B——差异来自广义企业 AI 基础设施与纯软件 AI 应用之间定义不同。DevRev 相关的切片是 AI agent 介导的软件层；Gartner 曾预测 2025 年嵌入 AI agent
              的企业应用少于 5%，但到 2026 年底将达到 40%。

              SAM 与 SOM：对 CEM + 支持 + PM 合并支出池施加约 20% 科技公司分段过滤，得到面向 100–5,000 人产品型 SaaS 和科技公司的 $6–10B SAM——这就是 DevRev 的
              ICP。DevRev 披露 2024 年中 ARR 约 $100M，意味着 SAM 渗透率低于 1%。五年内 $500M–$1B 的 SOM 有合理性，但取决于对 Zendesk/Jira
              存量厂商的替代率，以及整合平台被采用的速度。
