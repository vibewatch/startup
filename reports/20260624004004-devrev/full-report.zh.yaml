  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式与收入流
        blocks:
          - type: paragraph
            body: >
              DevRev 的收入模式覆盖三条主要收入流，核心都是企业软件订阅和 AI agent 解决服务。核心 PLuG
              平台提供基于席位的订阅，覆盖工程问题跟踪、客户支持和产品管理功能——这是基础年度合同收入流。Computer AI 解决产品（2025 年 9 月 beta、2026 年 5 月
              GA）引入结果计费元素，解决事件是商业单位，但公开定价仍不透明。第三条收入流——专业服务和实施上线——从客户案例中提及实施团队可见，但规模和利润率贡献未公开披露。


              收入确认遵循标准 SaaS 订阅会计（ASC 606）：PLuG ARR 在合同期内按比例确认；Computer 的结果计费部分若按解决量定价，则在服务交付时确认。美国控股实体（DevRev, Inc.）没有公开
              GAAP 财务报表；所有 ARR 数据都是公司自报或第三方数据库估算，不是审计披露。


              收入集中风险显著：印度子公司（DEVREV CLOUD INDIA PRIVATE LIMITED）承担全球运营的有意义份额（截至 2026 年 3 月印度 363+ 员工），FY2024 收入为
              ₹100–150 crore（约 $12–18M），数据来自 ROC 申报。这说明印度有可观收入——可能来自印度企业客户，也可能来自集团内服务转让定价——但美国与印度实体之间收入拆分未公开披露。
