      - number: '1.5'
        title: 里程碑、不利事件与尽调备注
        blocks:
          - type: paragraph
            body: >
              截至 2026 年 6 月，DevRev 公开记录干净，没有披露监管行动、诉讼、大规模裁员、数据泄露或治理争议。公司的里程碑推进很快：2020 年 10 月注册成立，8 个月内完成 $50M 种子轮（2021 年
              7 月），2022 年首个 GA 产品 PLuG 上线，2023 年中达到 1,000+ 客户和 $69.9M ARR，2024 年 8 月完成 $100.8M Series A、估值 $1.15B，2025 年
              9 月 Computer beta，2026 年 5 月 Computer GA。主要不利观察包括：（1）TechZine 2025 年 9 月指出 DevRev 的主张「极其雄心勃勃」，并把它与
              Cognition Labs/Devin（「首位 AI 软件工程师」）类比，后者「实际结果并不亮眼」——这把 DevRev 的产品叙事框定为可能被过度炒作；（2）不同数据提供方给出的员工估算差异很大（全球 711
              至 1,067 人），显示透明度有限；（3）收入指标（$100M ARR）来自 Latka 自报数据，而非审计财务，必须视为公司口径；（4）估值自 2024 年 Series A
              后未更新，二级市场定价不公开；（5）Forge Global 的「confidential filing」标注未经确认，可能只是标准 IPO 情报跟踪，而非实际 S-1 申报。Dheeraj Pandey
              周围的关键人集中是真实治理风险，因为公司的融资叙事高度个人化。私募定价细节未披露；仅确认了基于消耗的模型结构。
