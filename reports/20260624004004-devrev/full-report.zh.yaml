      - number: '3.4'
        title: 平台整合者与 AI 原生挑战者
        blocks:
          - type: paragraph
            body: >
              Salesforce 是最重要的长期竞争威胁。凭借 150,000+ 客户、$37B 收入和 Agentforce（2024 年推出的 AI agent 平台），Salesforce 正从 CRM
              扩张到自主企业工作流——直接重叠 DevRev 的 Computer 和 AgentOS 定位。Service Cloud（$25–$550/用户/月）原生覆盖客户支持。Salesforce
              的分发能力、企业关系和 $35B+ 年收入基数，使其成为最明确的存量整合者。值得注意的是，许多 DevRev 企业客户仍保留 Salesforce 作为主要 CRM 记录系统，近期对 DevRev
              形成的是共存而非替代的竞争动态。


              ServiceNow（2024 年收入 $11.5B+）已重新定位为企业工作流的 AI Platform，以 IT 服务管理为入口向客户运营横向扩张。其仅联系销售的定价和大型企业聚焦，意味着与 DevRev
              当前中型市场科技细分 ICP 的直接竞争有限，但 ServiceNow 的 AI 工作流扩张路径会与 DevRev 的企业野心相交。


              Glean（企业 AI 搜索，估值 $4.6B，融资 >$260M）以企业 AI 助手身份与 DevRev 的知识图谱竞争，其连接器接入 Zendesk、GitHub、Jira 和
              Salesforce。Glean 定位为中立聚合层，而 DevRev 要求完整平台采用。Monday.com（$1B+ 收入，横向 PM）和 Notion（$10B 估值，知识管理）属于邻近但较弱的竞争者，不在
              DevRev 核心 ICP。
