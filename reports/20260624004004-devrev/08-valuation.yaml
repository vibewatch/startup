- id: dcf-and-discounts
  title: DCF considerations and discount factors
  body: 'Any discounted-cash-flow view of DevRev is dominated by assumptions, not disclosures. The supportive side of the model is straightforward: AI application software can still grow quickly, outcome-based support pricing can be attractive if automation rates are high, and DevRev has enough product breadth to expand within an account if Computer successfully attaches to the installed base. The constraining side is stronger on public evidence. a16z and High Alpha both describe AI software as structurally more margin-sensitive than traditional SaaS because inference costs sit inside cost of goods sold, while BVP''s cloud benchmarks show that businesses around $100M ARR still need strong NRR and disciplined burn to become attractive public candidates. DevRev''s India entity adds a hard negative data point: Tofler-derived filing data show ₹100-150 crore FY2024 revenue but a -3.06% operating margin. Public evidence also still does not show DevRev''s actual gross margin, CAC, payback, or a
    verified AI resolution rate. Those gaps are precisely why the valuation deserves a discount versus cleaner software issuers.'
