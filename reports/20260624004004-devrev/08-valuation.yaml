- id: comparable-set
  title: Comparable company analysis
  body: The most useful comparable set is mixed rather than pure-play. Freshworks, Zendesk, Salesforce, and ServiceNow bracket customer-support and service workflow valuation reality; Atlassian captures the dev-tool and workflow side of DevRev's positioning; Glean and Intercom/Fin frame the AI-native upside case. On June 2026 public-market evidence, Freshworks traded at roughly 2.0x enterprise value to trailing revenue, Atlassian around 3.3x, Salesforce around 3.6x, and ServiceNow around 6.7x. Zendesk's 2022 take-private cleared at roughly 6x revenue despite 30% growth and positive free cash flow, giving a useful mature-CX floor. Against those anchors, DevRev's 11.5x implied round multiple already assumes materially better growth durability and AI monetization than the mature public set. The only clear evidence for that kind of premium comes from AI-native outliers such as Glean, which hit $7.2B valuation after surpassing $100M ARR and then scaled to $300M ARR by May 2026. DevRev therefore
    sits between public-software gravity and AI-outlier aspiration.
