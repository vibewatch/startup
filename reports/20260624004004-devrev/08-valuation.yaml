- id: recommendation
  title: Recommendation and required proof
  body: 'The strongest evidence-supported conclusion is that DevRev remains strategically impressive but valuation-sensitive. At the last disclosed round, the company bought itself the right to prove that it is more like an AI-native workflow winner than a premium-priced but ultimately conventional enterprise application company. Public evidence today does not fully close that loop. The 11.5x implied round multiple can be defended if the $100M ARR anchor is real, if growth has remained near the 40% band, if Computer materially lifts account expansion, and if AI support economics converge toward software-like margins. It becomes hard to defend if ARR quality is inflated by contracted-but-not-live revenue, if Computer penetration stalls near the 250-plus-customer level, or if burn stays high because gross profit per AI interaction is thin. Accordingly, the prudent stance is research-more / disciplined tracking rather than aggressive underwriting. The diligence burden is clear: verify ARR quality,
    gross margin, NRR, current cash burn, liquidation preferences, and real-world AI resolution accuracy before accepting the round mark as a durable fair value.'
