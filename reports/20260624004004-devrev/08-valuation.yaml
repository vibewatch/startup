  - - Primary upside path
    - Strategic sale or later private round above the 2024 mark
    - Salesforce / ServiceNow strategic logic plus AI-support attach upside
    - Needs stronger proof that Computer meaningfully expands account value
  - - Primary downside path
    - Multiple compression toward public comp levels
    - Unaudited ARR, negative India margin, and no public retention / margin proof
    - Downside reduces if management proves live ARR and lower burn
