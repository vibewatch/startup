callouts:
- calloutType: insight
  title: The premium is real, but it is not an AI-outlier premium
  body: DevRev's 11.5x implied multiple is clearly above mature public-support comps, yet it is still nowhere near Glean-style AI outlier territory. That makes the underwriting question less about TAM hype and more about proof that DevRev deserves to remain above software gravity.
  claimRefs:
  - CV005
  - CV006
  - CV012
  - CV043
- calloutType: risk
  title: ARR quality is the single most important valuation discount
  body: If any portion of the $100M ARR claim is contracted but not deployed, the last-round multiple rises mechanically and the strategic / IPO upside range narrows. Public evidence does not yet show a billed-revenue bridge or audited ARR definition.
  claimRefs:
  - CV023
  - CV024
  - CV025
- calloutType: recommendation
  title: Track closely, but do not underwrite the mark on narrative alone
  body: DevRev merits ongoing attention because the product and strategic-acquirer logic are real. It does not yet merit conviction pricing on public evidence because growth quality, unit economics, and AI resolution accuracy remain insufficiently verified.
  claimRefs:
  - CV036
  - CV037
  - CV038
