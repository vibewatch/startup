  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: audited-arr-bridge
    missingEvidence: A billed ARR / GAAP revenue bridge showing live ARR, implementation timing, and any contracted-but-not-deployed revenue as of 2024-2026.
    whyItMatters: This is the single most important input to whether the 11.5x multiple is fair, stretched, or actually understated.
    diligencePath: Request CFO-prepared ARR bridge, audited revenue schedule, and churn-adjusted committed ARR definitions in the data room.
    relatedQuestionRefs:
    - QV004
    - QV005
    - QV018
    - QV024
    - QV030
  - type: private-evidence-only
    severity: material
    topic: current-unit-economics
    missingEvidence: Current gross margin, CAC, payback, NRR, burn, and gross-profit contribution by Computer versus the core platform.
    whyItMatters: DCF and IPO scenarios are not credible without margin and retention quality, especially for AI-native support workloads with variable inference cost.
    diligencePath: Request monthly SaaS KPI deck plus product-level margin and customer-cohort retention tables.
    relatedQuestionRefs:
    - QV016
    - QV017
    - QV024
    - QV029
    - QV030
  - type: missing-source
    severity: material
    topic: cap-table-preferences
    missingEvidence: Cap-table summary with liquidation preferences, participating preferred, secondary sale history, and option-pool refreshes.
    whyItMatters: Headline enterprise-value outcomes can differ materially from common-equity outcomes if the preference stack is heavy.
    diligencePath: Request counsel-approved cap-table summary and last financing term sheet.
    relatedQuestionRefs:
    - QV025
    - QV029
    - QV030
  - type: private-evidence-only
    severity: material
    topic: ai-resolution-accuracy
    missingEvidence: Third-party or customer-verified automation, resolution, deflection, and ROI metrics for Computer in production.
    whyItMatters: The strategic premium depends on real AI-support quality, not just deployment counts or vendor claims.
    diligencePath: Request customer-level Computer KPI snapshots and at least two reference calls with quantified resolution outcomes.
    relatedQuestionRefs:
    - QV012
    - QV023
    - QV029
    - QV030
  - type: conflicting-data
    severity: minor
    topic: valuation-rounding
    missingEvidence: A single authoritative Series A term summary reconciling the $1.1B, $1.15B, and $1.2B headlines.
    whyItMatters: The discrepancy is likely rounding, but a clean term sheet or press release removes ambiguity in downstream multiple math.
    diligencePath: Use the signed Series A close memo or board materials as the canonical reference in diligence.
    relatedQuestionRefs:
    - QV001
    - QV002
    relatedTableRefs:
    - TV001
  - type: enumeration-incomplete
    severity: minor
    topic: TV002 comparable valuation table coverage
    missingEvidence: A fuller private-market comparable set with verified ARR, growth, and round terms for direct AI support peers beyond Glean and the limited Intercom public signals.
    whyItMatters: The current comp table is directionally useful but still mixes public EV/revenue data with sparse private AI-support marks, which widens the fair-value range.
    diligencePath: Expand the private comp set with data-room-quality secondary marks or additional disclosed rounds for direct AI support vendors before underwriting a tighter valuation band.
