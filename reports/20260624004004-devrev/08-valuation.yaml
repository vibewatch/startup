- id: TV004
  title: Valuation discount factor table
  columns:
  - Discount factor
  - Observed evidence
  - Why it matters to value
  - Severity today
  - What would reduce the discount
  rows:
  - - Unaudited ARR quality
    - The $100M ARR anchor is self-reported via Latka, not audited or reconciled to GAAP revenue
    - If ARR includes contracted-but-not-live revenue, the 11.5x multiple is overstated
    - High
    - Provide billed ARR / GAAP revenue bridge and implementation-adjusted live ARR
  - - India entity operating losses
    - Tofler-derived filing data show FY2024 revenue of ₹100-150 crore and -3.06% operating margin
    - Negative subsidiary margin weakens confidence in near-term consolidated FCF conversion
    - Medium
    - Show consolidated margin bridge and explain India entity transfer-pricing / cost-center role
  - - AI gross-margin pressure
    - a16z and High Alpha both point to AI inference cost pressure vs traditional SaaS margins
    - Higher variable COGS can compress the fair multiple if outcome pricing is too thin
    - High
    - Disclose blended gross margin and unit economics per Computer resolution
  - - Opaque public pricing
    - DevRev's pricing page still routes buyers to sales rather than disclosing tiers
    - Opaque packaging makes peer benchmarking and margin modeling harder
    - Medium
    - Publish clearer seat, usage, or credit pricing and attach assumptions
  - - Unverified AI resolution accuracy
    - Public evidence shows 250+ orgs in production but not a third-party validated resolution benchmark
    - The AI premium depends on real automation quality, not just deployment count
    - High
    - Provide audited or customer-verified resolution, deflection, and ROI metrics
  - - Cap-table / preference overhang unknown
    - No public data show liquidation preferences, participating preferred, or secondary pressure
    - Exit valuation to common can diverge materially from headline enterprise value
    - Medium
    - Share cap-table summary and preference stack in diligence
  notes: These are valuation discounts rather than thesis-breaks; several can coexist without negating product quality. The issue is that they all widen the range around fair value.
