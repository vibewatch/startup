company:
  name: DevRev
chapter:
  number: 8
  title: Valuation
  summary: 'DevRev''s last disclosed financing was the August 2024 Series A: $100.8M raised at roughly a $1.15B post-money valuation with Khosla Ventures and Mayfield involved, against self-reported ARR of about $100M. That math implies an 11.5x ARR multiple: richer than the 2026 public customer-support and workflow comp set, but still far below AI-native outliers such as Glean. The key valuation debate is not whether DevRev is strategically interesting; it is whether unaudited ARR, negative India-entity margin, opaque pricing, and unverified AI resolution accuracy justify paying an AI premium before harder operating proof arrives.'
sections:
- id: valuation-anchor
  title: Last round anchor and implied multiple
  body: DevRev's public valuation anchor remains the August 2024 Series A. Company-linked and independent coverage consistently place the round at about $100.8M and the post-money valuation at approximately $1.15B, though some headlines rounded the figure to $1.1B or $1.2B. Latka's self-reported revenue database lists DevRev at about $100M ARR in June 2024 after roughly $69.9M in July 2023, implying about 43% year-over-year ARR growth into the round. Using the $1.15B anchor against the $100M ARR figure yields an implied 11.5x ARR multiple. That is not obviously absurd for a fast-growing AI application company, but it is already a premium multiple for an enterprise software issuer that still lacks public audited statements, public NRR, or a disclosed gross-margin profile. The first task for investors is therefore to distinguish between a premium supported by genuine product pull and a premium supported mostly by narrative.
