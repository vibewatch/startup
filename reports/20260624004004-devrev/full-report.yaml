      - number: '2.4'
        title: Growth Drivers and Adoption Constraints
        blocks:
          - type: paragraph
            body: >
              The largest structural tailwind for DevRev is the agentic AI adoption inflection. Gartner's August 2025
              projections stated <5% of enterprise applications had task-specific AI agents, with 40% expected by end of
              2026. IBM separately cites Gartner: 33% of enterprise software applications will include agentic AI by
              2028, up from <1% in 2024. TechRepublic reports the share of enterprises with AI agents deployed in
              production nearly doubled in four months (7.2% Aug 2025 to 13.2% Dec 2025). This transition disadvantages
              legacy ticketing and CRM platforms lacking native agent orchestration.

              The second major driver is enterprise SaaS consolidation. ADAPT research (via SAP) found 68% of CIOs plan
              vendor landscape consolidation targeting 20% reduction in vendor count. BetterCloud's 2025 data
              corroborated: 106 avg enterprise SaaS apps (down from 112 in 2023); 70% of IT teams prefer a unified
              platform. Both validate DevRev's positioning.

              On the constraint side, enterprise AI adoption barriers are substantial. Writer's 2026 Enterprise AI
              Adoption Survey (n=2,400) found 79% of organizations face challenges — a double-digit increase from 2025 —
              with only 29% seeing significant ROI from generative AI. IBM identifies data quality, governance gaps,
              skills gaps, and integration complexity as primary blockers. Switching costs from Zendesk/Jira/Salesforce
              are high: enterprise category replacement cycles typically run 12–18 months. TechRepublic found 64% of
              companies remained stuck in AI pilot stages as of mid-2025.
            claimRefs:
