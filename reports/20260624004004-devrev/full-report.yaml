      - number: '5.2'
        title: Workflow Coverage and Use Cases
        blocks:
          - type: paragraph
            body: |
              DevRev's GTM motion centers on two primary workflow packages: (1) the Engineering + Support
              Unification workflow for mid-market tech companies where engineering and support teams are
              both on DevRev, eliminating the Zendesk-to-Jira ticket escalation workflow; and (2) the
              Computer AI Deployment workflow for enterprises seeking to reduce support volume and cost
              through autonomous resolution.

              The Pebl case study shows 85% of tickets auto-resolved by Computer. The BILL ($5M savings)
              case study validates the ROI of the unified platform for financial operations teams. Velocity
              Global, Bolt, and Descope deployments confirm enterprise customer adoption beyond SMB/startup.

              DevRev's workflow automation layer includes: auto-routing (rules-based and ML-based), smart
              escalation (escalate unresolved tickets to engineering after N hours), knowledge base
              self-service (articles surfaced by Computer to deflect tickets), and product feedback
              synthesis (linking customer complaints to product backlog items).

              Computer customer workflow: (1) Customer submits support request via web, email, or PLuG
              widget; (2) Computer retrieves relevant knowledge graph context (prior resolutions, engineering
              tickets, product documentation, customer history); (3) Computer generates an autonomous
              response or routes to human agent with full context; (4) If routed to engineering, a linked
              engineering issue is created automatically with full customer context attached.
