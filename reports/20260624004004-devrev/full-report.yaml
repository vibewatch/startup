chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, Business Model, and Product Strategy
        blocks:
          - type: paragraph
            body: >
              DevRev was founded in October 2020 with the mission to build "the earth's most customer-centric
              companies." The company's core insight is that enterprise software has created impenetrable silos—support
              tools speak only to support, CRMs don't connect to product, and engineering stays in its own world.
              DevRev's solution is a unified knowledge graph that connects structured data (CRM records, backlogs,
              tickets) with unstructured data (chats, documents, emails) to power conversational AI agents. The company
              launched its first generally available product, PLuG (a customer communication tool requiring just 7 lines
              of code), in 2022, followed by the AgentOS platform, and in September 2025 launched "Computer"—a fully
              conversational AI teammate. By May 2026, more than 250 organizations had Computer live in production, with
              over 1,000 users onboarded since September 2025. The business model is consumption-based (usage-based
              pricing scaling with adoption rather than headcount), with a freemium entry for startups and enterprise
              tiers for large organizations. Headquarters is at 1731 Embarcadero Road, Suite 100, Palo Alto, CA 94303,
              with eight global offices including Bengaluru, Chennai, Mumbai, Singapore, Tokyo, Ljubljana, London,
              Austin, and Buenos Aires. The company describes its product strategy as "SaaS 2.0"—AI-native applications
              designed from scratch for the conversational age rather than retrofitting AI onto legacy ticket-centric
              tools.
