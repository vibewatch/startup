  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Model and Streams
        blocks:
          - type: paragraph
            body: |
              DevRev's revenue model spans three primary streams, all centered on enterprise software
              subscriptions and AI-agent resolution services. The core PLuG platform offers seat-based
              subscriptions across engineering issue tracking, customer support, and product management
              functions — the foundational annual contract revenue stream. The Computer AI resolution product
              (launched beta September 2025, GA May 2026) introduces an outcome-based element where resolution
              events are the commercial unit, though public pricing remains opaque. A third revenue stream —
              professional services and implementation onboarding — appears to be present based on customer
              case studies referencing implementation teams, but its scale and margin contribution are not
              publicly disclosed.

              Revenue recognition follows standard SaaS subscription accounting (ASC 606): PLuG ARR is
              recognized pro-rata over the contract period; Computer's outcome-based component, if priced
              per resolution, would be recognized as services are delivered. No GAAP financial statements
              are publicly available for the US holding entity (DevRev, Inc.); all ARR figures are
              self-reported or third-party database estimates, not audited disclosures.

              Revenue concentration risk is material: the India subsidiary (DEVREV CLOUD INDIA PRIVATE LIMITED)
              accounts for a meaningful share of global operations (363+ employees in India as of March 2026)
              and FY2024 revenue of ₹100–150 crore (~$12–18M), per ROC filings. This suggests substantial
              India-based revenue — either from India enterprise customers or from intra-group service
              transfer pricing — but the split between US and India entity revenues is not publicly disclosed.
