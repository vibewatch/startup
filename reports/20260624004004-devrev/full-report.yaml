  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Architecture and Module Map
        blocks:
          - type: paragraph
            body: |
              DevRev's product architecture is organized into four interdependent layers, each adding
              capabilities on top of a shared semantic data model.

              At the base is the **Knowledge Graph layer** — a proprietary graph database that models all
              enterprise objects (customers, support conversations, engineering issues, product features,
              code changes, and their relationships) as first-class entities. This is DevRev's core
              architectural differentiation: no integration middleware is required between support and
              engineering because all objects coexist in a single semantic schema. The knowledge graph
              enables cross-functional AI queries (e.g., "which engineering commits fixed the top 10 customer
              bug reports this month?") that are impossible in a Zendesk + Jira + Salesforce integration stack.

              The **PLuG platform** (2022 GA) provides the user-facing product surface: engineering issue
              tracker (competing with Jira/Linear), customer support desk (competing with Zendesk/Freshdesk),
              product roadmap management (competing with Productboard/Aha!), and a customer-facing PLuG
              widget (JavaScript SDK + mobile SDKs for Android, iOS, React Native, Flutter, Cordova).

              **AgentOS** (2024) is the AI orchestration layer built on the knowledge graph. It enables
              enterprises to define, deploy, and manage AI agents for specific workflows — routing, triage,
              escalation, auto-tagging, knowledge retrieval. AgentOS agents are composable: they can be
              chained, branched, and monitored via a visual agent builder.

              **Computer** (beta Sep 2025, GA May 2026) is the fully autonomous customer support agent
              running on AgentOS + the knowledge graph. Computer is differentiated by its access to the
              full knowledge graph context — engineering history, product roadmap, past resolutions — not
              just the support ticket history that Zendesk AI or Intercom Fin can access.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE005
