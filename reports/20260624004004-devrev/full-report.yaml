      - number: '1.2'
        title: Founders, Leadership, and Governance
        blocks:
          - type: paragraph
            body: >
              DevRev was co-founded by two executives who previously built Nutanix together. Dheeraj Pandey (CEO)
              co-founded Nutanix in 2009, served as its CEO from founding through December 2020, and led the company
              through its 2016 NASDAQ IPO (ticker NTNX), which was one of the largest tech IPOs of its era. Pandey holds
              a BS in Computer Science from IIT Kanpur (1997) and an MS from the University of Texas at Austin, and
              currently sits on Adobe's board of directors. Manoj Agarwal (President/Co-founder) served as SVP of
              Engineering at Nutanix before co-founding DevRev. The broader executive team includes Ahmed Bashir (CTO,
              former Nutanix engineering leader), Michael Machado (CVP Product and Brand), and Chandra Nath (CVP
              Finance, Strategy, and Investor Relations). Vinod Khosla of Khosla Ventures and Navin Chaddha of Mayfield
              Fund are board observers or advisors. Key-person risk is concentrated in Dheeraj Pandey, whose brand and
              investor relationships are central to DevRev's fundraising narrative; Pandey is one of the few
              Indian-American founders to have led two unicorns as CEO. There have been no publicly reported material
              leadership changes since founding. The board of directors, per Tracxn, lists Manoj Agarwal and Dheeraj
              Pandey as independent board members, suggesting a governance structure that retains significant founder
              control.
