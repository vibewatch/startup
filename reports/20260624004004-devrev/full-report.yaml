            body: >-
              The strategic-exit logic is real, but still conditional. Salesforce is the clearest buyer archetype
              because Agentforce and Service Cloud already attack the same AI-enabled support workflow problem;
              acquiring DevRev would add a more developer-native data model and a modern support-to-product narrative.
              ServiceNow is a second plausible buyer because its Customer Service Management suite touches the same
              support stack and it can pay strategic multiples with a strong public currency. Microsoft is a less direct
              but still credible defensive bidder through Dynamics 365 Customer Service and Copilot-era service tooling.
              An IPO path exists only if DevRev graduates from a founder-reported $100M ARR story to a repeatable $200M
              to $300M ARR company with cleaner margin and retention disclosure. Without that proof, the more realistic
              2026 posture is not to underwrite a public listing timetable, but to map strategic sale and late-stage
              private financing paths around verified attach, burn, and gross-profit evidence.
            claimRefs:
              - CV027
              - CV028
              - CV029
              - CV030
              - CV031
              - CV032
              - CV033
              - CV034
