      - number: '5.3'
        title: Technical Architecture and Infrastructure
        blocks:
          - type: paragraph
            body: |
              DevRev's API surface is based on OpenAPI 3.0 specification (public and beta versions), with
              PAT-based authentication, OAuth 2.0 service accounts, webhook delivery, and a Snap-in
              automation framework analogous to Slack's app platform. The Snap-in marketplace allows
              third-party integrations and custom workflow automation without forking the codebase.

              The API domain model includes: code changes, conversations, accounts, parts (product features),
              articles (knowledge base), work items (engineering issues), timeline entries, vistas (views),
              observability events, surveys, custom objects, authentication tokens, and web crawler jobs.
              This broad domain model reflects the unified cross-functional data architecture.

              DevRev operates on AWS multi-region infrastructure with confirmed regions in US East (N. Virginia),
              APAC Mumbai, APAC Sydney, APAC Singapore, and EU Frankfurt. This multi-region footprint enables
              data residency compliance for EU (GDPR) and APAC customers. The status page (status.devrev.ai)
              provides real-time component-level visibility for API, authentication, support portal, PLuG
              Platform, issue management, marketplace, search, timeline, vistas, conversation/ticket management,
              and Computer — reflecting a mature operational observability posture.

              The AI layer uses LLM integration (likely OpenAI/Anthropic API plus DevRev Turing fine-tuned
              models) with the knowledge graph providing the context-retrieval layer (RAG pattern). DevRev
              Turing is the company's proprietary AI development toolset, likely encompassing fine-tuned
              domain-specific models trained on the proprietary support-to-engineering resolution corpus.
