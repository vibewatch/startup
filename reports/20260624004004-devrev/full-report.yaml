  - id: TM004
    title: Growth drivers and constraints table
    columns:
      - Driver / Constraint
      - Direction
      - Timing
      - Implication for DevRev
      - Diligence ask
    rows:
      - - 'Agentic AI adoption inflection (Gartner: <5% to 40% of apps by end-2026)'
        - Driver
        - Now – 12 months (rapid)
        - >-
          Structural window to establish AgentOS as the enterprise AI-agent orchestration standard before incumbents
          retrofit; Gartner 2029 prediction of 80% autonomous CS resolution validates DevRev's roadmap direction
        - >-
          What % of DevRev's 2026 new ARR is attributable to Computer/AgentOS vs. legacy PLuG? This validates whether
          the agentic AI tailwind converts to deal velocity.
      - - SaaS vendor consolidation (68% of CIOs targeting 20% vendor reduction)
        - Driver
        - 1–3 years (structural, ongoing)
        - >-
          DevRev's unified platform directly addresses CIO consolidation mandates; creates land (pilot) and expand
          (platform replacement) motion; 70% of IT teams prefer unified platforms over point solutions
        - >-
          Win/loss data: how often does DevRev win a consolidation deal (replacing 2+ tools) vs. greenfield?
          Consolidated wins have higher ACV and better NRR profiles.
      - - Enterprise AI ROI gap (only 29% of orgs see significant ROI from genAI)
        - Constraint
        - Now – 24 months
        - >-
          Slows prospective buyer budgets; DevRev must demonstrate concrete auditable ROI (e.g., $5M savings at BILL,
          85% auto-resolution at Pebl) to overcome CFO skepticism in enterprise sales cycles
        - >-
          Does DevRev have independently audited ROI case studies? How many are third-party verified vs. self-reported
          by the customer?
      - - Switching costs from entrenched Zendesk/Jira/Salesforce stacks
        - Constraint
        - Ongoing (12–18 month sales cycles)
        - >-
          Years of customer data, integrations, and workflow history embedded in incumbents; data migration creates
          buyer hesitation; incumbent AI responses (Zendesk AI, Atlassian AI, Salesforce Agentforce) reduce urgency to
          switch
        - >-
          What is DevRev's average sales cycle length and time-to-value? How many deals stall at data migration
          assessment phase?
      - - 'AI skills gap and change management friction (Deloitte: skills gap is top AI integration barrier)'
        - Constraint
        - 2–4 years
        - >-
          TechRepublic: ~64% of orgs stuck in pilot purgatory as of mid-2025; DevRev's tech-native customer segments
          partially bypass this, but enterprise expansion requires addressing non-technical user adoption
        - >-
          What % of DevRev enterprise customers deploy AI agents beyond initial pilot team? Cohort data on
          organizational rollout breadth vs. departmental-only.
      - - Trust deficit in autonomous AI agents (only 27% trust full autonomy, down from 43%)
        - Constraint
        - 2–3 years
        - >-
          Constrains DevRev's ability to sell full Computer autonomy to risk-averse buyers; human-in-the-loop hybrid is
          the near-term sweet spot; trust recovery requires proven production outcomes at scale
        - >-
          What autonomy level (copilot vs. semi-autonomous vs. fully autonomous) do DevRev enterprise customers actually
          deploy in production?
      - - India and Asia-Pacific enterprise market expansion (APAC fastest-growing at ~19.92% CAGR)
        - Driver
        - 2–5 years
        - >-
