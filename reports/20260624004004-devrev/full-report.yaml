  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Incumbent AI investment makes market-share capture a race against much larger platforms
        blocks:
          - type: paragraph
            body: >-
              DevRev is no longer competing against static ticketing tools. The market is being redrawn by incumbents
              that are already layering AI onto enormous existing distribution. Salesforce markets Agentforce as
              autonomous agents plugged into industry clouds, workflows, and APIs. Zendesk markets AI agents, copilots,
              automation, analytics, and a large marketplace. Atlassian markets Rovo as a search-and-chat layer across
              SaaS applications, while Intercom markets Fin as an AI service agent that can sit on top of multiple
              helpdesks. In other words, the three named incumbents in the brief are all investing in AI, and adjacent
              challengers are doing the same.


              DevRev does have a sharp wedge: it openly pitches replacement or coexistence against Zendesk, Salesforce
              Service Cloud, Intercom, and Atlassian Jira, and it sells fast migration as part of the story. That
              matters because it confirms the company is not trying to win only greenfield accounts; it is trying to
              displace systems that enterprises already trust for mission-critical service operations. The problem is
              that displacement requires more than a better demo. It requires clean migrations, lower perceived risk,
              credible AI governance, and enough ecosystem depth that buyers do not feel stranded after switching.


              The strategy tension is visible in DevRev's own materials. Pricing language spans fast-growing startups
              through 100k-employee enterprises, which is commercially attractive but operationally hard. The product
              must be simple enough for lightweight adoption while also meeting the customization, compliance, and
              uptime needs of large service organizations. If DevRev underserves the low end, the self-serve wedge
              weakens; if it underserves the high end, the incumbent replacement story breaks before expansion starts.
                      
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
