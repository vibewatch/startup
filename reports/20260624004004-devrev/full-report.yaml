      - number: '2.3'
        title: Buyer Segmentation and Acquisition Path
        blocks:
          - type: paragraph
            body: >
              DevRev's buying process is multi-stakeholder. Primary budget ownership varies by use case: engineering and
              product teams (CTO, VP Engineering, VP Product) control tooling budgets for issue tracking and roadmap
              management, while customer experience teams (CCO, VP Customer Success, Director of Support) own the
              customer service platform budget. In consolidated platform deals, IT procurement (CIO, VP IT) adjudicates
              final selection.

              By company size, third-party analysis indicates approximately 60% of DevRev ARR comes from enterprise
              accounts (500+ employees), 30% from mid-market (50–500 employees), and roughly 10% from smaller prosumer
              or self-serve accounts. AI-first startups are the fastest-growing cohort at approximately 45%
              year-over-year adoption growth driven by affinity for LLM-powered ticket clustering and sentiment
              automation.

              Adoption triggers cluster around: (1) tool-fatigue events where teams reach peak frustration with
              context-switching across Zendesk, Jira, and Salesforce; (2) organizational growth events scaling beyond
              100–200 employees where ad hoc multi-tool arrangements break down; and (3) AI modernization mandates from
              C-suite following competitive pressure. The typical path moves from departmental pilot through
              cross-functional expansion and ultimately toward full platform consolidation. Tracxn identifies 4,284
              active competitors in adjacent categories, with HubSpot, Salesforce, and Zendesk as primary category-level
              reference points.
