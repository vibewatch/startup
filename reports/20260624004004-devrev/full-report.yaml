      - number: '3.3'
        title: Developer Tooling and Engineering Workflow Competitors
        blocks:
          - type: paragraph
            body: |
              Atlassian/Jira is the dominant engineering issue tracker with 300,000+ customers. Jira's pricing
              ($7.91 Standard, $14.54 Premium/user/month) is substantially below DevRev's implied enterprise
              pricing and its Rovo AI layer (launched April 2024) adds conversational AI, knowledge graph, and
              automation across Jira, Confluence, and Atlassian Cloud. While Atlassian focuses primarily on
              engineering workflows, its ecosystem breadth (200+ integrations), Confluence knowledge base,
              and Bitbucket code hosting create strong workflow gravity. Atlassian's market cap of ~$50–60B+
              gives it the resources to aggressively expand AI capabilities.

              Linear is the fastest-growing engineering-native competitor, with $35M raised at ~$400M valuation
              (Series B, 2021), a developer-experience-first design philosophy, and $10–$16/user/month pricing.
              Linear focuses exclusively on software project management and does not offer customer support or
              CRM; it is therefore a partial overlap competitor (DevRev captures Linear customers who outgrow
              narrow issue-tracking). GitHub Issues (Microsoft/GitHub ecosystem) offers free issue tracking
              integrated with code repositories, creating zero-switching-cost competition for early-stage
              engineering teams.

              The engineering workflow segment poses lower near-term displacement risk to DevRev's install
              base (which is predominantly support-heavy mid-market customers) but is the critical expansion
              moat: winning engineering teams prevents Jira from expanding into support and neutralizes the
              "we already have Jira" objection.
