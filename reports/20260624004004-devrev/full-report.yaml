        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: |
              DevRev presents a credible revenue growth profile ($0 to ~$100M ARR in ~4 years) with a
              structurally sound revenue model (subscription + AI outcome hybrid). The $1.15B Series A
              valuation reflects legitimate investor confidence from Khosla Ventures and Mayfield in the
              AI-native enterprise software thesis. However, every key financial quality metric — gross
              margin, NRR, CAC, LTV, payback period — remains undisclosed, making this a thesis-driven
              bet rather than a fundamentals-driven investment at this stage.

              The most material financial risk is capital adequacy: with no confirmed Series B and estimated
              runway of 12–18 months from Series A close (August 2024), DevRev may be approaching a
              fundraising inflection point in 2026. If ARR growth has accelerated (>50% YoY), the next
              round will be favorable. If growth has plateaued at 30–40% on $100M ARR, the next valuation
              step is harder to justify without gross margin and NRR disclosure.

              India subsidiary ROC filings confirm a real operating business with material revenue and
              headcount, but show negative margins — validating both the growth-mode investment thesis
              and the capital dependency risk. A second adverse signal: the absence of any audited financial
              statements in a company with a 5-year history and $1.15B valuation is consistent with
              private company norms but creates information asymmetry that limits outside diligence.
