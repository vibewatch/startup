      - number: '2.5'
        title: Sizing Uncertainty and Diligence Gaps
        blocks:
          - type: paragraph
            body: >
              Market sizing for DevRev's categories is fragmented. The most consequential discrepancy: Mordor
              Intelligence estimates the 2026 enterprise AI market at $114.87B versus Precedence Research's $30.16B — a
              near-4x dispersion reflecting definitional scope differences. MarketsandMarkets ($15.84B CEM, 2026) and
              TBRC ($14.17B CEM, 2025) are more consistent, pointing to narrower market definitions excluding AI
              infrastructure.

              DevRev's own $50B TAM lacks published methodology. A plausible construction combining customer support
              software (~$13B), CEM (~$16B), engineering project management (~$8B), and AI-native workflow automation
              (~$15–20B of the enterprise AI software layer) approaches that figure — but the AI-native automation
              segment is poorly delineated from broader cloud infrastructure, making the claim directionally defensible
              but not independently verifiable.

              Key diligence gaps: no independent analyst covers the specific unified CX plus engineering AI platform
              category; no public win-rate data against specific incumbents exists; no cohort-level expansion revenue
              data has been disclosed. These gaps constrain rigorous SAM/SOM derivation and mean DevRev's competitive
              positioning narrative is largely self-reported.
            claimRefs:
              - CM001
              - CM006
              - CM025
              - CM026
              - CM037
      - number: '2.6'
        title: Exhibits
        blocks:
          - type: callout
            title: Agentic AI Tailwind Structurally Favors AI-Native Platforms
            body: >
              Gartner's projection that 40% of enterprise applications will include AI agents by end of 2026 (up from
              <5% in 2025) creates a structural window for AI-native platforms like DevRev that cannot easily be closed
              by incumbents retrofitting AI onto legacy ticketing architectures. The TechRepublic finding that deployed
              agent adoption nearly doubled in four months in late 2025 validates the acceleration pace.
            calloutType: strength
            claimRefs:
              - CM007
              - CM030
          - type: callout
            title: DevRev's $50B TAM Claim Is Unverifiable and Likely Overstated
            body: >
              DevRev's company-stated $50B TAM lacks published methodology. Independent analyst estimates for directly
              relevant markets total approximately $29–35B combined in 2026. The gap requires attributing $15–20B to AI
              workflow automation spend, a poorly delineated category. This overstated TAM may mislead investors about
              the near-term serviceable opportunity.
            calloutType: risk
            claimRefs:
              - CM026
              - CM003
              - CM002
          - type: callout
            title: Enterprise AI ROI Gap and Pilot Purgatory Constrain Near-Term Market Expansion
            body: >
              79% of organizations face AI adoption challenges in 2026 despite high investment, and only 29% see
              significant ROI from generative AI. TechRepublic's finding that 64% of orgs remained stuck in pilot
              purgatory as of mid-2025 suggests the addressable market of production-ready buyers is far smaller than
              the theoretical TAM — a material near-term headwind for DevRev's enterprise deal velocity.
            calloutType: risk
            claimRefs:
              - CM010
              - CM011
              - CM013
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape Overview
        blocks:
          - type: paragraph
            body: |
              DevRev enters a market with well-entrenched point-solution leaders in each of its three target
              pillars. In customer support and CX, Zendesk (10.2B take-private, 100K+ customers) and Intercom
              (30,000+ customers) hold large installed bases with deep workflow automation. In engineering
              project management, Atlassian/Jira (300K+ customers, $34B public market cap) and the fast-growing
              Linear dominate developer mindshare. In CRM, Salesforce holds 20.7% global market share with a
              $37B revenue base and is aggressively expanding into agentic AI via Agentforce.

              The competitive landscape is bifurcated between narrow-point-solution vendors and broad platform
              incumbents. DevRev attempts to occupy the structural gap: a unified, AI-native surface that
              eliminates the glue code between Zendesk, Jira, and Salesforce. This positioning is both a
              growth vector (consolidation appeal to CIOs) and a risk vector (incumbents can integrate or
              acquire to close the gap). As of mid-2026, every major competitor has launched AI agent
              capabilities, narrowing DevRev's differentiation from "AI-native from day one" to "AI with
              a richer semantic data model."

              Multi-homing is the most common competitive outcome in DevRev's current install base: enterprises
              frequently purchase DevRev for engineering-support workflow unification while retaining Salesforce
              as the system of record for sales CRM. This confirms DevRev's niche validation but limits total
              platform displacement.
