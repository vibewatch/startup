      - number: '2.2'
        title: Market Sizing — TAM, SAM, and SOM
        blocks:
          - type: paragraph
            body: >
              DevRev's TAM is best approached through three lenses: (1) top-down CEM plus customer support software
              markets, (2) the enterprise AI market as an enabling layer, and (3) a bottom-up lens across DevRev's
              target account universe.

              Top-down sizing: Combining MarketsandMarkets' $15.84B CEM market (2026) with Dataintelo's $12.8B customer
              support software market and an estimated $5–8B engineering project management segment yields a combined
              pool of roughly $30–35B in 2026. DevRev's stated $50B TAM exceeds this overlap, likely incorporating AI
              workflow automation spend at the enterprise level.

              Enterprise AI context: Mordor Intelligence estimates the enterprise AI market at $114.87B in 2026 growing
              to $273.08B by 2031. Precedence Research provides a narrower $30.16B in 2026 — dispersion reflects
              definitional differences between broad enterprise AI infrastructure and pure-software AI applications.
              DevRev's relevant slice is the AI-agent-mediated software layer, where Gartner projected <5% of enterprise
              applications had embedded AI agents in 2025 but 40% would by end of 2026.

              SAM and SOM: Applying an approximate 20% tech-company segment filter to the combined CEM plus support plus
              PM pool yields a SAM of $6–10B for product-led SaaS and tech companies with 100–5,000 employees — DevRev's
              ICP. DevRev reported approximately $100M ARR in mid-2024, representing sub-1% SAM penetration. An SOM of
              $500M–$1B within five years is plausible but depends on competitive displacement rates from Zendesk/Jira
              incumbents and the pace of consolidated platform adoption.
