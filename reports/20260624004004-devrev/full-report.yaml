      - number: '7.2'
        title: AI-proof, model dependency, and architecture concentration are the core technology risks
        blocks:
          - type: paragraph
            body: >-
              DevRev's upside depends heavily on Computer behaving more like a reliable operator than a flashy demo.
              Public materials describe a system that can search, reason, create, update, and take action across
              business systems using shared memory and a knowledge graph. That design is central to differentiation, but
              it also means product risk is concentrated. If the knowledge graph becomes slow, stale,
              permission-misaligned, or expensive to maintain at enterprise scale, the same architecture that makes
              Computer special becomes the single biggest failure domain.


              The second risk is evidence quality. DevRev circulates strong outcome claims, including high
              autonomous-resolution rates and meaningful customer savings, but the public support for those claims is
              still mostly company-originated case-study or press-release material. That does not mean the claims are
              false; it means they are not yet diligence-grade proof for regulated or highly risk-sensitive buyers. The
              current public record is therefore closer to persuasive commercialization evidence than to neutral
              validation.


              The third risk is model concentration. DevRev's DPA acknowledges AI processing and subprocessors, but the
              public record does not name the LLM stack, fallback architecture, or rate-card protections. That opacity
              matters because AI application economics can change quickly when model costs, throughput, or policy terms
              move. The June 2026 webhook incident on the status page also shows that visible observability does not
              remove operational fragility. For a platform promising safe actions and automation, reliability failures
              propagate quickly into customer trust risk.
                      
            claimRefs:
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
