      - number: '7.3'
        title: Regulation and cross-border data governance can slow expansion before product demand does
        blocks:
          - type: paragraph
            body: >-
              Regulatory risk is not theoretical for DevRev. The EU AI Act is now a real legal framework, and the
              implementation timeline points to 2 August 2026 as a meaningful enforcement milestone for core
              obligations. DevRev may not present itself as a frontline high-risk-AI vendor in every use case, but it
              does market AI systems that search internal data, generate business outputs, and increasingly take action.
              That is enough to make documentation, governance, user transparency, and human-oversight design material
              diligence items rather than optional procurement extras.


              The privacy and transfer stack is directionally better than many startups at the same stage. DevRev
              publishes a detailed privacy notice, names an EU representative and DPO, and says its DPA includes SCCs,
              UK addenda, and AI-processing clauses. That is a real mitigating factor. But the public package stops
              where the hardest diligence starts. The live subprocessor mix, transfer-impact assessments, model-specific
              safeguards, and proof that regulated-customer deployments sit inside the relevant control perimeter remain
              private. Trust-center materials being available "on request" is normal, yet it also means the external
              diligence story still depends on management access.


              This matters especially because DevRev's own customer and PR narrative reaches into banking and other
              regulated workflows. Selling AI support or AI action layers into those environments raises the bar on
              explainability, auditability, and cross-border process discipline. If the company cannot turn its legal
              paperwork into operational proof quickly, enterprise expansion can stall even while product interest
              remains strong.
                      
            claimRefs:
