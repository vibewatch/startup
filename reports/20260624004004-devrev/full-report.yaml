            body: |
              Salesforce is the most significant long-term competitive threat. With 150,000+ customers,
              $37B revenue, and Agentforce (AI agent platform launched 2024), Salesforce is expanding beyond
              CRM into autonomous enterprise workflows — directly overlapping DevRev's Computer and AgentOS
              positioning. Service Cloud ($25–$550/user/month) covers customer support natively. Salesforce's
              distribution strength, enterprise relationships, and $35B+ annual revenue base make it the
              definitive incumbent consolidator. Notably, many DevRev enterprise customers retain Salesforce
              as their primary CRM system of record, creating a co-exist rather than replace competitive
              dynamic for DevRev near-term.

              ServiceNow ($11.5B+ 2024 revenue) has repositioned as an AI Platform for enterprise workflows,
              with IT service management as its entry vector and horizontal expansion into customer operations.
              Its contact-sales-only pricing and large enterprise focus means limited direct competition with
              DevRev's current mid-market tech segment ICP, but ServiceNow's AI workflow expansion path
              intersects with DevRev's enterprise ambitions.

              Glean (enterprise AI search, $4.6B valuation, >$260M raised) competes with DevRev's knowledge
              graph as an enterprise AI assistant with connectors into Zendesk, GitHub, Jira, and Salesforce.
              Glean positions as a neutral aggregation layer, whereas DevRev requires full platform adoption.
              Monday.com ($1B+ revenue, horizontal PM) and Notion ($10B valuation, knowledge management)
              are adjacent but weaker competitors in DevRev's core ICP.
