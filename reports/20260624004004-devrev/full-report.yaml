      - number: '4.2'
        title: Financial Traction and ARR Growth Profile
        blocks:
          - type: paragraph
            body: |
              DevRev's reported ARR growth is the headline financial metric and the primary investment thesis
              validator. Based on Latka database records (which rely on CEO self-disclosure): ARR was ~$69.9M
              in July 2023 and ~$100M by June 2024, implying ~43% YoY growth. The $100M ARR milestone
              coincided with the August 2024 Series A close. ARR growth from $0 to $69.9M occurred in
              approximately 36 months (founded October 2020, first product GA 2022). This pace is in line
              with top-quartile B2B SaaS growth benchmarks but below hypergrowth thresholds (>100% YoY)
              that typically command 15–20x ARR multiples.

              Customer count grew to 1,000+ organizations as of August 2024 (company disclosure), with
              250+ organizations deploying Computer in production as of May 2026. The disparity between
              1,000+ overall customers and 250+ Computer deployments reflects a two-tier install base:
              legacy PLuG customers not yet migrated to the AI agent layer. This migration rate is a key
              leading indicator of ARR per customer expansion, since Computer's outcome-based pricing or
              premium seat pricing should command higher ACV than PLuG baseline.

              No net revenue retention (NRR) figure is publicly disclosed. NRR is the most important
              durability metric for subscription ARR; top-quartile SaaS companies report NRR >130%. Without
              NRR, the ARR growth trajectory cannot be attributed to expansion vs. net-new customer
              acquisition — a critical distinction for capital efficiency and competitive moat validation.
