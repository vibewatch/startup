      - number: '5.4'
        title: Trust, Security, Compliance, and Quality
        blocks:
          - type: paragraph
            body: |
              DevRev's Trust Center (trust.devrev.ai, powered by SafeBase) lists the following certifications
              and compliance frameworks: SOC 2 Type 2, ISO/IEC 27001:2022, HIPAA, CCPA, and AWS Partner
              status. Supporting documentation available on request includes: penetration testing reports,
              vulnerability assessment reports, bridge letters, subprocessor lists, Data Processing Agreements
              (DPA), and privacy policy. This compliance posture is appropriate for mid-market to enterprise
              B2B SaaS and satisfies requirements for financial services customers (ICICI Prudential, HDFC
              Bank, BILL/Bill.com cited in prior research).

              Quality controls include: the real-time status page for operational transparency, multi-region
              redundancy for availability, and Computer's autonomous resolution circuit-breaker (human
              escalation pathway when Computer confidence falls below threshold). DevRev has not disclosed
              SLA uptime commitments publicly; enterprise customers likely negotiate these in contracts.

              Key trust gaps: AI resolution accuracy methodology is not independently audited; the ≥80%
              resolution rate claimed for Computer is vendor-self-reported with no third-party verification.
              The knowledge graph's data lineage and audit trail for AI decisions are undisclosed, which
              is a concern for regulated industries requiring explainability (financial services, healthcare).
