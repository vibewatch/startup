      - number: '1.3'
        title: Funding History, Valuation, and Investor Relationships
        blocks:
          - type: paragraph
            body: >
              DevRev has raised $158M in total across three rounds. The first round was a $50M seed in July 2021 co-led
              by Mayfield Fund and Khosla Ventures—an unusually large seed reflecting the founders' Nutanix track record
              and investor relationships predating DevRev. A smaller $7.1M round closed in August 2022. The Series A of
              $100.8M closed on July 10, 2024 (announced August 8, 2024) at a $1.15B post-money valuation, led by Khosla
              Ventures with participation from Mayfield Fund and Dheeraj Pandey's family office, Param Hansa Values,
              plus additional accelerators and family offices of tech CEOs and VCs. Per Latka, the company hit $100M ARR
              in June 2024, up from $69.9M ARR in July 2023—representing approximately 43% year-over-year growth.
              Valuation is confirmed at $1.15B by the company, with some secondary market sources citing $1.2B as of
              late 2025. DevRev has explicitly stated a strategy of "smaller yet frequent raises" rather than large
              infrequent rounds, continuously expanding its investor base. No new public fundraise or IPO has been
              announced as of June 2026. Forge Global lists DevRev as having a "confidential filing" status—suggesting
              early IPO exploration—but no S-1 or formal IPO date has been disclosed. The $158M total raised against a
              $1.15B valuation implies approximately 11–14% dilution across all rounds, which is lean for a
              unicorn-stage company.
