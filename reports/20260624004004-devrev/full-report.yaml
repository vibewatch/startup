      - number: '7.5'
        title: Residual exposure is still investment-manageable, but only with explicit kill criteria
        blocks:
          - type: paragraph
            body: >-
              Taken together, DevRev's risk profile is not a simple "too risky" conclusion. The company clearly has real
              customers, serious backers, and a coherent product idea. The challenge is that its biggest risks interact
              with one another. If compliance work slows large-account rollouts, usage-based AI economics can look worse
              because expensive model and support costs spread over fewer successful expansions. If enterprise accounts
              demand more customization or services than expected, the unified-platform story can drift toward a
              labor-heavy delivery model rather than a clean software compounding model. And if the product remains
              easier for technical teams than for support-first organizations, DevRev may win impressive references
              without broadening far enough to justify the narrative embedded in the valuation.


              That is why thesis-break monitoring matters more than static ranking. The right question is not whether
              each risk exists; it clearly does. The right question is whether mitigation is maturing faster than
              exposure. Public evidence today suggests partial but incomplete mitigation: privacy paperwork exists,
              trust materials exist, status transparency exists, and migration messaging is strong. What is still
              missing is independent proof that AI outcomes, margins, leadership depth, and regulated-customer controls
              scale cleanly together. Until that evidence appears, investors should treat DevRev as a high-upside,
              high-execution-risk platform story rather than a de-risked enterprise software compounder.
                      
