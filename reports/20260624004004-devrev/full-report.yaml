      - number: '1.5'
        title: Milestones, Adverse Events, and Diligence Notes
        blocks:
          - type: paragraph
            body: >
              DevRev has a clean public record with no disclosed regulatory actions, lawsuits, major layoffs, data
              breaches, or governance controversies as of June 2026. The company's milestone trajectory is rapid:
              incorporated October 2020, $50M seed within eight months (July 2021), first GA product (PLuG) in 2022,
              1,000+ customers and $69.9M ARR by mid-2023, $100.8M Series A at $1.15B valuation in August 2024, Computer
              beta September 2025, Computer GA May 2026. The primary adverse observations are: (1) TechZine noted in
              September 2025 that DevRev's claims are "extremely ambitious" and drew parallels to Cognition Labs/Devin
              ("first AI software engineer") which had "unspectacular practical results"—framing DevRev's product
              narrative as potentially overhyped; (2) Reported headcount estimates vary substantially across data
              providers (711 to 1,067 globally), indicating limited transparency; (3) Revenue metrics ($100M ARR) are
              sourced from Latka's self-reported data, not audited financials, and must be treated as company-claimed;
              (4) Valuation has not been refreshed since the 2024 Series A, and secondary market pricing is not publicly
              available; (5) Forge Global's "confidential filing" notation is unconfirmed and may simply reflect
              standard IPO intelligence tracking rather than an actual S-1 filing. Key-person concentration around
              Dheeraj Pandey is a genuine governance risk given the company's fundraising narrative is heavily
              personalized. Private pricing details are undisclosed; only consumption-based model structure has been
              confirmed.
