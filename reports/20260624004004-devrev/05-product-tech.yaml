  evidenceGaps:
    - type: private-evidence-only
      severity: blocking
      topic: computer-resolution-methodology
      missingEvidence: "No independent audit of Computer's ≥80% autonomous resolution rate exists; the measurement methodology (what counts as resolved, deflected, escalated, false-positive) is not publicly defined"
      whyItMatters: "Investment thesis depends on Computer's claimed resolution efficiency; unaudited self-reported figures are insufficient for enterprise deployment ROI calculations or investor diligence"
      diligencePath: "Request Computer resolution methodology documentation; specify test cohort criteria (ticket types, resolution confidence threshold, escalation conditions); commission independent audit with 3 enterprise customers"
      relatedQuestionRefs: [QE004]

    - type: private-evidence-only
      severity: material
      topic: product-roadmap
      missingEvidence: "No official public roadmap document found; inferred roadmap items are analyst projections based on competitive gaps and customer base requirements"
      whyItMatters: "Without official roadmap, cannot assess whether DevRev will close the enterprise governance gap (AI audit trail, explainability) required for regulated-industry expansion before competitors"
      diligencePath: "Request official product roadmap in data room; ask CPO to walk through 12-month release plan and 24-month strategic direction"
      relatedQuestionRefs: [QE011]

    - type: private-evidence-only
      severity: material
      topic: LLM-dependency
      missingEvidence: "DevRev's specific LLM provider(s) for Computer inference are not publicly confirmed; inference provider dependency and failover strategy are undisclosed"
      whyItMatters: "LLM API pricing changes (OpenAI/Anthropic) directly affect Computer gross margin; single-provider dependency without failover creates platform availability risk"
      diligencePath: "Request LLM provider list from subprocessors disclosure; confirm whether DevRev has negotiated enterprise rate agreements with providers; understand failover strategy"
      relatedQuestionRefs: [QE014]

    - type: private-evidence-only
      severity: material
      topic: SLA-and-uptime
      missingEvidence: "Uptime SLA commitment, historical availability statistics, and incident response SLA not publicly documented"
      whyItMatters: "Enterprise customers require SLA commitments for procurement; absence of published SLA suggests negotiated enterprise contracts with variable commitments — creating inconsistency risk"
      diligencePath: "Request enterprise customer contract SLA schedules; request 24-month uptime statistics by region and component"
      relatedQuestionRefs: [QE016]

    - type: private-evidence-only
      severity: material
      topic: AI-inference-compliance-scope
      missingEvidence: "Whether Computer AI inference processing (LLM API calls with customer data) falls within DevRev's SOC 2 Type 2 scope and is covered by GDPR DPA subprocessor agreements has not been publicly confirmed"
      whyItMatters: "Enterprise customers in regulated industries (finance, healthcare) must confirm that AI inference data flows are covered by contractual data protection agreements and audited compliance certifications before deploying Computer"
      diligencePath: "Request SOC 2 Type 2 audit report and confirm that AI inference (LLM provider data flows) is explicitly in scope; confirm subprocessors list includes LLM inference providers; review DPA template for AI processing provisions"
      relatedQuestionRefs: [QE018]

    - type: private-evidence-only
      severity: material
      topic: turing-architecture
      missingEvidence: "DevRev Turing's architecture, training data volume, fine-tuning methodology, and model evaluation benchmarks are not publicly documented"
      whyItMatters: "Turing's proprietary fine-tuned models are the core AI differentiation claim beyond the knowledge graph; without technical validation, the claim rests entirely on self-reported resolution rates"
      diligencePath: "Request Turing model architecture overview, training corpus size and composition, and internal benchmark comparison vs. base models (GPT-4o, Claude 3.5)"
      relatedQuestionRefs: [QE024]

