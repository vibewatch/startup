callouts:
  - calloutType: risk
    title: AI Resolution Accuracy Is Unaudited
    body: |
      DevRev's claim of ≥80% autonomous ticket resolution for Computer (vs. Intercom Fin's claimed
      ≥50%) is self-reported with no independent third-party audit. The resolution methodology
      (what counts as "resolved" vs. "deflected" vs. "escalated") is not publicly defined.
      Enterprise buyers deploying Computer in regulated environments should require contractual SLA
      on resolution accuracy with defined measurement methodology before go-live.
    claimRefs: [CE006, CE020, CE031]

