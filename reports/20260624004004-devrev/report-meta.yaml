companyProfile:
  summary: |
    DevRev (DevRev, Inc.) is a Palo Alto-headquartered AI-native enterprise software company founded
    in October 2020 by Dheeraj Pandey (former CEO of Nutanix, which raised $2.8B in its 2018 IPO)
    and Manoj Agarwal (former SVP Engineering at Nutanix). The company's core product is a
    proprietary semantic knowledge graph that natively links customer support tickets, engineering
    work items, product features, and code changes in a single data model — a structural
    differentiation absent from all incumbent alternatives (Zendesk, Atlassian/Jira, Salesforce).
    On this knowledge graph, DevRev has built three commercial products: PLuG (unified
    engineering+support+PM platform, GA 2022), AgentOS (AI agent orchestration layer, 2024), and
    Computer (fully autonomous AI customer support agent, GA May 2026, claiming ≥80% ticket
    auto-resolution). DevRev reached unicorn status in August 2024 with a $100.8M Series A led by
    Khosla Ventures at $1.15B post-money valuation. As of mid-2026, DevRev has 1,000+ enterprise
    customers, 250+ organizations using Computer in production, and self-reported ARR of ~$100M.
