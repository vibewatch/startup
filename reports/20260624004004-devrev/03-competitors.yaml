callouts:
  - calloutType: risk
    title: Incumbent AI Convergence
    body: |
      All four primary incumbent platforms (Zendesk, Salesforce, Atlassian, Intercom) now offer
      production-grade AI agent capabilities, having launched their respective AI layers in 2024–2026.
      DevRev's "AI-native" differentiation is compressing to a more nuanced claim: superior AI
      accuracy through a richer semantic data model. This claim requires third-party validation;
      self-reported resolution rates are insufficient for investment-grade diligence.
    claimRefs: [CP025, CP026, CP036]

