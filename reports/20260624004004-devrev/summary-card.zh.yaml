  topStrengths:
    - 创始人履历强：Dheeraj Pandey 联合创办并把 Nutanix 做到 $2.8B IPO，带来企业 SaaS GTM 信用和投资人信任。
    - 产品结构差异明确：自有知识图谱把支持、工程和产品连在一起；截至 2026 年中，在可信替代方案里架构独特。
    - ARR 增长强：公司自报 2024 年 6 月 ARR 约 $100M，高于 2023 年 7 月约 $70M，隐含同比约 43%；对企业软件来说表现强劲。
    - Computer 采用信号清晰：到 2026 年 5 月，250+ 企业组织已经在生产环境运行 Computer，距离 beta 发布仅 8 个月，显示真实市场拉力。
    - 印度市场有支点：ICICI Prudential、HDFC Bank、Bajaj Finserv 部署验证了受监管行业信任度；印度办公室成本结构也压低烧钱速度。
  topRisks:
    - >-
      既有巨头反攻：Salesforce Agentforce、Zendesk AI、Intercom Fin AI 和 Atlassian Rovo 都在 2024-2025 年推出 AI agent 产品；既有厂商拥有 10x+
      分销优势。
    - AI 解决准确率未经审计：Computer 声称 ≥80% 解决率，但这是厂商自报；方法、误报率和基准独立性都未披露，是投资人尽调的关键缺口。
    - 知识图谱没有 IP 保护：资源充足的既有厂商可在 24-36 个月内复制架构；竞争护城河取决于数据飞轮积累速度，而不是法律防御性。
    - 印度实体亏损：DEVREV CLOUD INDIA PRIVATE LIMITED 在 FY2024 经营利润率为 -3.06%；全球盈利时间表未披露。
    - 依赖 LLM 供应商：Computer 核心能力依赖 OpenAI / Anthropic API 定价；若供应商上调企业价格，利润率可能被压缩。
    - 关键人风险：Dheeraj Pandey 是融资、GTM 和品牌的核心；若 CEO 流失，投资人信心会受到实质冲击。
  unresolvedGaps:
    - Computer AI 解决率 —— 需要独立第三方审计 ≥80% 声称，并披露方法。
    - 毛利率和单位经济 —— PLuG 与 Computer 的混合 GM%，以及 LLM 推理成本占 Computer 收入比例。
    - 净收入留存率 —— NRR 未披露；这是评估扩张收入质量的关键指标。
    - 产品路线图 —— 官方 12-18 个月路线图，包括面向受监管行业扩张的 AI 治理功能。
    - DevRev Turing 模型架构 —— 训练语料、微调方法，以及相对基础模型的独立基准。
    - 全球与印度收入拆分 —— 用来评估运营杠杆和地域集中风险。
