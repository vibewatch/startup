callouts:
  - calloutType: strength
    title: "Agentic AI Tailwind Structurally Favors AI-Native Platforms"
    body: >
      Gartner's projection that 40% of enterprise applications will include AI agents by end of 2026 (up from <5% in 2025) creates a structural window for AI-native platforms like DevRev that cannot easily be closed by incumbents retrofitting AI onto legacy ticketing architectures. The TechRepublic finding that deployed agent adoption nearly doubled in four months in late 2025 validates the acceleration pace.
    claimRefs: [CM007, CM030]

  - calloutType: risk
    title: "DevRev's $50B TAM Claim Is Unverifiable and Likely Overstated"
    body: >
      DevRev's company-stated $50B TAM lacks published methodology. Independent analyst estimates for directly relevant markets total approximately $29–35B combined in 2026. The gap requires attributing $15–20B to AI workflow automation spend, a poorly delineated category. This overstated TAM may mislead investors about the near-term serviceable opportunity.
    claimRefs: [CM026, CM003, CM002]

  - calloutType: risk
    title: "Enterprise AI ROI Gap and Pilot Purgatory Constrain Near-Term Market Expansion"
    body: >
      79% of organizations face AI adoption challenges in 2026 despite high investment, and only 29% see significant ROI from generative AI. TechRepublic's finding that 64% of orgs remained stuck in pilot purgatory as of mid-2025 suggests the addressable market of production-ready buyers is far smaller than the theoretical TAM — a material near-term headwind for DevRev's enterprise deal velocity.
    claimRefs: [CM010, CM011, CM013]

