company:
  name: DevRev

chapter:
  number: 1
  title: Company Overview
  summary: >
    DevRev is an AI-native enterprise software company founded in October 2020 by Dheeraj Pandey (former Nutanix CEO/co-founder) and Manoj Agarwal (former Nutanix SVP Engineering), headquartered in Palo Alto, CA with major operations in Bengaluru, India. The company has raised $158M total across a $50M seed (2021), a $7.1M bridge (2022), and a $100.8M Series A (August 2024) at a $1.15B post-money valuation, achieving unicorn status. DevRev's flagship platform—"Computer"—is a conversational enterprise AI built on a proprietary knowledge graph ("Computer Memory") and bidirectional sync engine ("Computer AirSync"), positioning itself to replace siloed CRM, support, and engineering tools like Zendesk, Jira, and Salesforce.

sections:
  - id: identity-and-business-model
    title: Identity, Business Model, and Product Strategy
    body: >
      DevRev was founded in October 2020 with the mission to build "the earth's most customer-centric companies." The company's core insight is that enterprise software has created impenetrable silos—support tools speak only to support, CRMs don't connect to product, and engineering stays in its own world. DevRev's solution is a unified knowledge graph that connects structured data (CRM records, backlogs, tickets) with unstructured data (chats, documents, emails) to power conversational AI agents. The company launched its first generally available product, PLuG (a customer communication tool requiring just 7 lines of code), in 2022, followed by the AgentOS platform, and in September 2025 launched "Computer"—a fully conversational AI teammate. By May 2026, more than 250 organizations had Computer live in production, with over 1,000 users onboarded since September 2025. The business model is consumption-based (usage-based pricing scaling with adoption rather than headcount), with a freemium entry for startups and enterprise tiers for large organizations. Headquarters is at 1731 Embarcadero Road, Suite 100, Palo Alto, CA 94303, with eight global offices including Bengaluru, Chennai, Mumbai, Singapore, Tokyo, Ljubljana, London, Austin, and Buenos Aires. The company describes its product strategy as "SaaS 2.0"—AI-native applications designed from scratch for the conversational age rather than retrofitting AI onto legacy ticket-centric tools.
    claimRefs: [CO001, CO002, CO003, CO004, CO005, CO006, CO007, CO008]
    tableRefs: [TO001]
    figureRefs: [FO002]

  - id: founders-and-leadership
    title: Founders, Leadership, and Governance
    body: >
      DevRev was co-founded by two executives who previously built Nutanix together. Dheeraj Pandey (CEO) co-founded Nutanix in 2009, served as its CEO from founding through December 2020, and led the company through its 2016 NASDAQ IPO (ticker NTNX), which was one of the largest tech IPOs of its era. Pandey holds a BS in Computer Science from IIT Kanpur (1997) and an MS from the University of Texas at Austin, and currently sits on Adobe's board of directors. Manoj Agarwal (President/Co-founder) served as SVP of Engineering at Nutanix before co-founding DevRev. The broader executive team includes Ahmed Bashir (CTO, former Nutanix engineering leader), Michael Machado (CVP Product and Brand), and Chandra Nath (CVP Finance, Strategy, and Investor Relations). Vinod Khosla of Khosla Ventures and Navin Chaddha of Mayfield Fund are board observers or advisors. Key-person risk is concentrated in Dheeraj Pandey, whose brand and investor relationships are central to DevRev's fundraising narrative; Pandey is one of the few Indian-American founders to have led two unicorns as CEO. There have been no publicly reported material leadership changes since founding. The board of directors, per Tracxn, lists Manoj Agarwal and Dheeraj Pandey as independent board members, suggesting a governance structure that retains significant founder control.
    claimRefs: [CO009, CO010, CO011, CO012, CO013, CO014, CO015]
    tableRefs: [TO002]

  - id: funding-and-valuation
    title: Funding History, Valuation, and Investor Relationships
    body: >
      DevRev has raised $158M in total across three rounds. The first round was a $50M seed in July 2021 co-led by Mayfield Fund and Khosla Ventures—an unusually large seed reflecting the founders' Nutanix track record and investor relationships predating DevRev. A smaller $7.1M round closed in August 2022. The Series A of $100.8M closed on July 10, 2024 (announced August 8, 2024) at a $1.15B post-money valuation, led by Khosla Ventures with participation from Mayfield Fund and Dheeraj Pandey's family office, Param Hansa Values, plus additional accelerators and family offices of tech CEOs and VCs. Per Latka, the company hit $100M ARR in June 2024, up from $69.9M ARR in July 2023—representing approximately 43% year-over-year growth. Valuation is confirmed at $1.15B by the company, with some secondary market sources citing $1.2B as of late 2025. DevRev has explicitly stated a strategy of "smaller yet frequent raises" rather than large infrequent rounds, continuously expanding its investor base. No new public fundraise or IPO has been announced as of June 2026. Forge Global lists DevRev as having a "confidential filing" status—suggesting early IPO exploration—but no S-1 or formal IPO date has been disclosed. The $158M total raised against a $1.15B valuation implies approximately 11–14% dilution across all rounds, which is lean for a unicorn-stage company.
    claimRefs: [CO016, CO017, CO018, CO019, CO020, CO021, CO022]
    tableRefs: [TO003]
    figureRefs: [FO003]

  - id: scale-and-customers
    title: Scale, Customer Base, and Global Operations
    body: >
      As of the August 2024 Series A announcement, DevRev reported over 1,000 customers. As of May 2026, 250+ organizations had the new "Computer" platform live in production, with more than 1,000 users onboarded since September 2025—suggesting the broader customer base extends beyond 250 organizations. Key named customers include: Velocity Global (SaaS HR), Bolt (e-commerce checkout/payments), Bill.com (financial operations), Uniphore (conversational AI), ICICI Prudential Life Insurance (95% resolution time reduction), Bajaj Finserv, HDFC Bank, L&T Financial Services, Aditya Birla Capital, Pebl, Descope, Skedulo, 100ms, Rocketium, ShemarooMe, Goodmeetings, Rexera, SingulrAI, Phenom, and Shipsy. Reported customer outcomes include: 85% of support tickets resolved automatically (Pebl, Uniphore); $5M in operational savings (BILL); India's largest airline went from kickoff to production in 14 days (unnamed, selecting Computer over Salesforce Agentforce in a head-to-head evaluation); a retail loyalty customer saving $1.2M annually; FAME saving users 10+ hours/week. Global headcount was reported at ~809–940 employees as of 2025–2026, with 363 employees in the Indian entity (DEVREV CLOUD INDIA PRIVATE LIMITED, per Tracxn, as of March 2026) and offices across eight global locations. India is a major operational center with offices in Bengaluru (HQ for India operations), Chennai, and Mumbai.
    claimRefs: [CO023, CO024, CO025, CO026, CO027, CO028, CO029]
    tableRefs: [TO004]
    figureRefs: [FO001]

  - id: milestones-and-adverse-checks
    title: Milestones, Adverse Events, and Diligence Notes
    body: >
      DevRev has a clean public record with no disclosed regulatory actions, lawsuits, major layoffs, data breaches, or governance controversies as of June 2026. The company's milestone trajectory is rapid: incorporated October 2020, $50M seed within eight months (July 2021), first GA product (PLuG) in 2022, 1,000+ customers and $69.9M ARR by mid-2023, $100.8M Series A at $1.15B valuation in August 2024, Computer beta September 2025, Computer GA May 2026. The primary adverse observations are: (1) TechZine noted in September 2025 that DevRev's claims are "extremely ambitious" and drew parallels to Cognition Labs/Devin ("first AI software engineer") which had "unspectacular practical results"—framing DevRev's product narrative as potentially overhyped; (2) Reported headcount estimates vary substantially across data providers (711 to 1,067 globally), indicating limited transparency; (3) Revenue metrics ($100M ARR) are sourced from Latka's self-reported data, not audited financials, and must be treated as company-claimed; (4) Valuation has not been refreshed since the 2024 Series A, and secondary market pricing is not publicly available; (5) Forge Global's "confidential filing" notation is unconfirmed and may simply reflect standard IPO intelligence tracking rather than an actual S-1 filing. Key-person concentration around Dheeraj Pandey is a genuine governance risk given the company's fundraising narrative is heavily personalized. Private pricing details are undisclosed; only consumption-based model structure has been confirmed.
    claimRefs: [CO030, CO031, CO032, CO033, CO034, CO035]

