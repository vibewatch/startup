callouts:
  - calloutType: strength
    title: "Repeat Unicorn Founders with Deep Investor Relationships"
    body: >
      Dheeraj Pandey and Manoj Agarwal built Nutanix together before founding DevRev, giving them proven operator credibility, the trust of tier-1 VCs (Khosla, Mayfield), and the ability to attract enterprise talent. Vinod Khosla personally backed both companies.
    claimRefs: [CO009, CO010, CO016]

  - calloutType: risk
    title: "Revenue Metrics Are Self-Reported and Unaudited"
    body: >
      DevRev's $100M ARR claim is sourced from Nathan Latka's database, which relies on founder self-reporting with no independent audit. Until the company files publicly or completes an IPO audit, these figures carry material uncertainty.
    claimRefs: [CO020, CO033]

  - calloutType: risk
    title: "Key-Person Concentration Around CEO Dheeraj Pandey"
    body: >
      DevRev's fundraising narrative, investor relationships, and brand are heavily personalized around Pandey. A leadership transition would pose significant continuity risk given the company's stage and the degree to which investor confidence is tied to his track record.
    claimRefs: [CO013, CO034]

