  evidenceGaps:
  - type: missing-source
    severity: material
    topic: llm-dependency
    missingEvidence: Named LLM providers, backup model paths, latency controls, and contractual failover protections for DevRev Computer are not publicly disclosed.
    whyItMatters: Model-vendor concentration can directly affect gross margin, uptime, compliance, and customer trust if a provider changes pricing, policies, or availability.
    diligencePath: Request the subprocessor list, model-provider roster, rate-card protections, and documented failover architecture for Computer.
    relatedQuestionRefs:
    - QR006
  - type: private-evidence-only
    severity: material
    topic: leadership-depth
    missingEvidence: A current executive roster with clear role owners, succession planning, and evidence of operating cadence below the founders is not public.
    whyItMatters: Without visible management depth, founder absence or dilution of founder attention could hit product execution, enterprise selling, and fundraising simultaneously.
    diligencePath: Request the current org chart, executive bios, succession plans, and board materials showing who owns sales, finance, product, security, and customer success.
    relatedQuestionRefs:
    - QR021
    relatedTableRefs:
    - TR001
  - type: private-evidence-only
    severity: material
    topic: TR005 regulatory / legal risk register
