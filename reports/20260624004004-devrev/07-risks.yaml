- id: TR004
  title: Financial risk summary table
  columns:
  - Risk area
  - Observable fact pattern
  - What it implies
  - Severity
  - Mitigation / monitoring
  rows:
  - - Funding history / valuation
    - Seed $50M, 2022 bridge, and 2024 $100.8M Series A at $1.15B
    - Capital access has been strong, but the bridge suggests capital intensity was real before unicorn status
    - Medium-High
    - Watch for new financing terms, pace of customer proof, and whether management offers updated metrics
  - - ARR quality
    - Public ARR figures come from Latka and are self-reported rather than audited
    - Scale may be real, but precision and durability remain unverified externally
    - High
    - Request audited ARR definition, NRR, churn, and cohort expansion data
  - - Burn and margin compression
    - Headcount is large, AI apps face lower gross margins, and no consolidated cash-flow statement is public
    - Runway and profitability can only be modeled, not confirmed
    - High
    - Track cash-balance disclosure, pricing discipline, and gross-margin movement by product line
  - - India entity economics
    - India entity appears meaningful on revenue and employment, with prior registry snapshots pointing to losses / negative margin
    - India is an operating anchor, but not yet a proof point for group profitability
    - Medium-High
    - Request full India-entity financials and intercompany-transfer economics
  - - Headcount uncertainty
    - Unify and Tracxn differ by hundreds of employees in 2026
    - Operating-cost models are directionally useful but not precise
    - Medium
    - Resolve through board deck, payroll counts, and location-level workforce data
  - - Segment and geography mix
    - Public sources show both startup-friendly packaging and large regulated references, but not revenue split
    - Growth quality could differ significantly by segment or region
    - Medium-High
    - Request ARR by segment, region, and module; monitor whether India references convert into global enterprise expansion
  notes: Severity reflects the risk each fact pattern poses to underwriting the next financing and eventual path to profitability. Public evidence is mixed quality and often non-audited.
