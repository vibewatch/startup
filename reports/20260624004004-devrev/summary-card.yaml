  topStrengths:
    - >-
      Founder pedigree: Dheeraj Pandey co-founded and scaled Nutanix to $2.8B IPO; brings enterprise SaaS GTM
      credibility and investor trust
    - >-
      Structural product differentiation: proprietary knowledge graph linking support+engineering+product is
      architecturally unique among all credible alternatives as of mid-2026
    - >-
      Strong ARR growth: ~$100M ARR self-reported (Jun 2024) up from ~$70M (Jul 2023), implying ~43% YoY growth — strong
      for enterprise
    - >-
      Computer adoption signal: 250+ enterprise orgs running Computer in production by May 2026 — 8 months after beta
      launch, indicating real market pull
    - >-
      India market foothold: ICICI Prudential, HDFC Bank, Bajaj Finserv deployments validate regulated-industry
      trustworthiness; India office cost structure reduces burn
  topRisks:
    - >-
      Incumbent counter-attack: Salesforce Agentforce, Zendesk AI, Intercom Fin AI, and Atlassian Rovo all launched AI
      agent products in 2024-2025; incumbents have 10x+ distribution advantage
    - >-
      AI resolution accuracy unaudited: Computer's ≥80% resolution rate claim is vendor-self-reported; methodology,
      false-positive rate, and independence of benchmark are not disclosed — a key investor diligence gap
    - >-
      Knowledge graph is not IP-protected: architecture replicable by well-resourced incumbents over 24-36 months;
      competitive moat depends on data flywheel accumulation speed, not legal defensibility
    - >-
      India entity losses: DEVREV CLOUD INDIA PRIVATE LIMITED shows -3.06% operating margin (FY2024); global
      profitability timeline undisclosed
    - >-
      LLM provider dependency: Computer's core capability depends on OpenAI/Anthropic API pricing; margins could
      compress if providers increase enterprise rates
    - >-
      Key person risk: Dheeraj Pandey is central to fundraising, GTM, and brand; loss of CEO would materially impact
      investor confidence
  unresolvedGaps:
    - Computer AI resolution rate — independent third-party audit of ≥80% claim with disclosed methodology
    - Gross margin and unit economics — blended GM% for PLuG vs. Computer; LLM inference cost as % of Computer revenue
    - Net Revenue Retention — NRR is undisclosed; critical for assessing expansion revenue quality
    - Product roadmap — official 12-18 month roadmap including AI governance features for regulated-industry expansion
    - >-
      DevRev Turing model architecture — training corpus, fine-tuning methodology, and independent benchmarks vs. base
      models
    - Global vs. India revenue split — to assess operational leverage and geographic concentration risk
