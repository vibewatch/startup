    {
      "id": "how-the-multiple-looks",
      "title": "How the multiple looks",
      "body": "If Guardio was indeed worth about $1.5 billion and was heading toward $100 million ARR, the implied forward multiple is around 15x. That number is full, but not obviously crazy. It becomes more intuitive once you remember the reported scale: half a million paying users, rapid ARR growth, and a product category aligned with modern phishing and AI-scam behavior. It becomes less comfortable once you remember the business mix: overwhelmingly consumer revenue, limited disclosed B2B contribution, and no public evidence on churn, CAC, or margin durability. Put differently, the market could plausibly pay 15x for a cyber asset growing fast into a strategic lane, but only if the quality of growth is much better than the average consumer subscription business. The valuation therefore hinges on whether the business behaves more like a durable security subscription with meaningful upsell and low churn, or more like a fear-driven consumer utility that must constantly reacquire conviction from users. Public evidence cannot settle that distinction yet.",
      "claimRefs": [
        "CV004",
        "CV005",
