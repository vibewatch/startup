  "chapter": {
    "number": 8,
    "title": "Valuation",
    "summary": "The best public reading of Guardio’s November 2025 financing is an implied valuation around $1.5 billion, which would place the company at roughly 15x forward ARR if management’s early-2026 $100 million ARR target was credible. That is not clearly unreasonable for a fast-growing cyber asset, but it is full enough that retention quality, margin shape, and platform risk matter as much as top-line momentum."
  },
  "sections": [
    {
      "id": "public-valuation-anchors",
      "title": "Public valuation anchors",
      "body": "Guardio’s valuation work has to start from two hard-ish facts and one strong inference. The first fact is the 2021 Series A, which Calcalist estimated at about $500 million. The second is the 2025 $80 million Series B and management’s guide to exceed $100 million ARR by early 2026. The strong inference comes from TechCrunch’s report that the 2025 valuation was roughly triple the 2021 level, which yields a central estimate around $1.5 billion. That estimate is not official price-per-share disclosure, but it is still the most defensible public anchor. It also fits the profile of a late-stage growth round led by ION Crossover rather than a small opportunistic financing. It is also important that the pricing debate is being anchored by operating scale rather than by a pure user-count narrative. ARR guidance, investor quality, and prior pricing history all point in the same direction, which reduces the odds that the valuation is merely a promotional headline.",
      "claimRefs": [
        "CV001",
