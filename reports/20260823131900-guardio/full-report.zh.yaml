  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与规模测算口径
        blocks:
          - type: paragraph
            body: >-
              评估 Guardio 时，不能不加调整地把它放进整个网络安全市场，甚至也不能直接套用完整消费安全大盘。最宽但仍可信的外部边界来自 Mordor Intelligence：其将消费安全市场规模估为 2026 年
              $47.75 billion、2031 年 $75.25 billion。这个篮子包括杀毒、隐私、身份、家长控制和其他家庭安全服务。第二个有用视角是身份盗窃保护，Fortune Business Insights
              将该市场 2026 年规模估为 $19.45 billion。这个品类与 Guardio 的泄露告警和身份风险信息重叠，但也包含补救、保险和恢复深度，而 Guardio
              今天还没有完全覆盖。最稳妥的结论是：Guardio
              参与的是一个庞大且增长中的市场，但它真正可服务的市场更窄，即围绕浏览器原生防护，处理钓鱼、诈骗、恶意网站、扩展滥用和账号安全问题。这个区分很重要，因为它能避免常见错误：拿一张宽口径 TAM 幻灯片，直接当成
              Guardio 现在就能变现的支出池。公司未来可能拓展到更多可见性和态势管理用例，但当前产品仍最紧地锚定在浏览器和相邻通信流程上。
