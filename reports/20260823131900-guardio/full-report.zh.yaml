      - number: '8.4'
        title: 估值立场与下一步尽调
        blocks:
          - type: paragraph
            body: >-
              眼下最合适的立场是中性偏谨慎。只看公开证据，Guardio
              不像明显高估，因为增长故事、融资信号和战略性浏览器安全叙事彼此能对上。但它也不像明显便宜，因为公开记录缺少支撑溢价所需的增长质量证据。估值下一步应来自非公开经营指标，而不是更多新闻标题。具体来说，投资人需要看到
              ARR 与留存、毛利率、CAC、套餐结构和合作伙伴收入之间的桥。如果这座桥扎实，乐观情景的可信度会显著提高；如果桥很弱，消费者工具的悲观情景可能很快占上风。在此之前，Guardio
              的价格更像是在一个尚未证明耐久性的故事上打了溢价倍数。实际操作上，投资人既不该偷懒式怀疑，也不该偷懒式兴奋。正确姿态是认真对待这个估值，假设成熟投资人确实看到了真实东西，然后检验非公开经营证据能否在更少依赖叙事的情况下支撑同一结论。
