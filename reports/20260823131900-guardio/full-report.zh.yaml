      - number: '1.3'
        title: 融资历史、收入结构与商业形态
        blocks:
          - type: paragraph
            body: >-
              Guardio 的资本故事是公开记录中最清晰的部分之一。公司称前三年基本靠自筹启动，随后在 2021 年 12 月完成 Tiger Global 领投的 $47 million 融资，Calcalist
              当时给出的估值为 $500 million。那时 Guardio 据称约有 100,000 名付费客户，日活用户接近 100 万。四年后，公司完成 ION Crossover Partners 领投的 $80
              million B 轮，Vintage Investment Partners、Union Tech Ventures 和 Emerge 也参投。围绕该轮融资，Guardio 公开称公司已连续三年实现 100%+
              ARR 增长，并有望在 2026 年初突破 $100 million ARR。TechCrunch 补上了最关键的变现数据点：Guardio 称 B 轮时有 500,000
              名付费用户。估值故事略显模糊。TechCrunch 称估值较上一轮增长约三倍；如果 2021 年 $500 million 的估算是正确基线，就意味着约 $1.5
              billion，但公司仍未披露确切价格。收入结构比估值更清楚：Amos Peled 表示 99% 收入仍来自私人客户，因此尽管出现了面向企业的新选项，业务仍高度由消费端驱动。
