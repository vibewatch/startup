      - number: '3.2'
        title: 规模、分发与套件力量
        blocks:
          - type: paragraph
            body: >-
              Guardio 最大的结构性问题不是产品是否站得住，而是规模不对称。Norton 背后的上市母公司 Gen Digital
              披露了数十亿美元收入，以及覆盖直接面向消费者和合作伙伴分发的宽渠道引擎。这很关键，因为即便单点解决方案技术上不错，套件经济性仍可能更强。Norton
              和类似在位者可以在更宽的家庭关系里交叉销售、打折和续费，而这些关系已经包含设备保护和身份监控。相比之下，Guardio 仍高度由消费端和浏览器端驱动。管理层称 99%
              收入来自私人客户，这与一家消费端牵引力显著、但分发多元化有限的公司相符。公司的直营模型让产品市场契合数据更干净，也可能带来更强的告警驱动转化；但它也让 Guardio
              更暴露于上升的获客成本，以及能把营销费用摊到更大套件上的竞争者。换句话说，Guardio 的主张更锋利，但在位者渠道更深，也有更多方式守住每户价格。
