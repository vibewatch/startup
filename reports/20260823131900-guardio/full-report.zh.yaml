              年更宽的家庭阶梯，意味着产品更成熟，也说明公司有意从每个受保护家庭中拿到更多价值。用管理层 >$100 million ARR 目标和 TechCrunch 的 500,000
              名付费用户数据推算，每个付费用户年化收入约 $200；对照公开套餐页，这在方向上可信。话虽如此，单位经济模型仍不透明。浏览器优先模式可能比传统终端套件有更好毛利率，因为它避开了重设备补救；但 Guardio
              仍承担云端情报、告警、身份监控、支持和移动端成本。业务更像带有安全数据成本的消费订阅软件，而不是纯企业 SaaS。
