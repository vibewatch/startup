      - number: '2.4'
        title: Guardio 的市场结论
        blocks:
          - type: paragraph
            body: >-
              市场结论偏建设性，但必须克制。Guardio 所在细分市场真实且扩张中，欺诈和诈骗顺风强劲，尤其当 AI 让仿冒更便宜、更可信时。这给了公司比传统杀毒厂商防守成熟终端产品更好的品类位置。与此同时，Guardio
              真正能变现的切片小于标题级消费安全 TAM
              数字，因为公司仍在变现一个浏览器优先、与消息链路相连的防护层。这足以打造可观的直接面向消费者业务，但不能证明公司无需扩展产品和拿出证据，就能简单吸收身份恢复、终端或企业浏览器预算。后续估值工作应采用的框架，不是“Guardio
              拿下整个消费级网络安全市场”；而是“Guardio 拿下消费端和 SMB 数字安全支出中一个聚焦且增长的切片，其中钓鱼、假网站、品牌仿冒和泄露暴露是关键任务”。公开证据还不支持精确的 Guardio 专属
              TAM、SAM 或转化漏斗，因此本章应把这些保留为明确尽调缺口，而不是假装精确。
