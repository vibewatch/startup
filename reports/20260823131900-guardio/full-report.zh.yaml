      - number: '2.2'
        title: 买方、用户与替代选择
        blocks:
          - type: paragraph
            body: >-
              今天的主要买方仍是家庭，而不是企业安全经理。Guardio 的套餐结构和公开表述指向三类核心用例：想要简单浏览器和诈骗防护的单个用户，需要多席位的家庭或情侣，以及不想运营 IT
              栈、只需要轻量安全的自由职业者或微型企业主。SMB 产品确实存在，但管理层自己仍称 99%
              收入来自私人客户，因此企业渠道应视为相邻机会，而不是核心市场。这个分层也让替代品集合更清晰。消费者可以选择什么都不做，依赖免费浏览器或操作系统默认保护，购买 Norton、Bitdefender 或
              Malwarebytes 这类更宽的安全套件，或选择 Aura 这种更偏身份保护的方案。这些替代品往往捆绑 VPN、保险、密码管理、家长工具或多设备补救，而 Guardio
              还没有完全匹配。当用户对速度、简单性和浏览器原生诈骗防护的重视高于功能广度时，Guardio 能赢；当买方想要一体化套件，或认为原生保护已经够用时，Guardio 会输。
