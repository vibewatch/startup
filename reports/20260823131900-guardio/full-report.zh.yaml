        title: 客户是谁
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Guardio 首先是一家消费公司。管理层表示 99% 收入来自私人客户，最清楚的硬规模标记是公司 1.5M+ 用户，以及 TechCrunch 报道的约 500,000
