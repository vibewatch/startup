        title: 产品是什么，又不是什么
        blocks:
          - type: paragraph
            body: >-
              Guardio
              的公开产品记录非常清楚地展示了它的重心。它不是试图拿下完整终端的传统杀毒套件，而是一个浏览器原生安全层，专为拦截钓鱼、恶意网站、诈骗流程、可疑下载和流氓扩展而建；这些威胁越来越多地出现在浏览器内，以及相邻的消息或链接旅程里。这个聚焦同时解释了产品吸引力和边界。吸引力在于速度和简单。测评反复提到安装快、运行轻，这对消费者采用很重要，因为用户并不想为了一个窄威胁问题去管理笨重的安全代理。边界同样重要：独立测评也一致指出，Guardio
              不是深度设备补救软件，也不提供完整身份、隐私或操作系统覆盖。因此投资人应把产品看成高度契合浏览器时代滥用问题的专家，而不是通用网络安全栈。
