companyProfile:
  summary: >-
    Guardio 是一家 2018 年成立的以色列消费级网络安全公司，围绕浏览器优先防护打造产品，覆盖钓鱼、诈骗、恶意下载、有害扩展和身份暴露。公司到 2025 年末约有 500,000 名付费用户，指引到 2026 年初 ARR
    超过 $100M，并在连续三年 ARR 增长 100%+ 后，由 ION Crossover Partners 领投完成 $80M B 轮。公开证据显示，Guardio 在消费级安全上切入点明确，Safe Browsing
    平台也开始带来可选增长空间；但增长质量、合作伙伴经济性和长期利润率曲线仍基本停留在私有信息里。
