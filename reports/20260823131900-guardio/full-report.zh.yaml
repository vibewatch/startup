chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、定位与规模快照
        blocks:
          - type: paragraph
            body: >-
              Guardio
              现在明确把自己定位为消费级网络安全平台，而不是传统杀毒厂商。官方首页、关于我们页面、定价页和企业页都强调浏览器优先防护、诈骗拦截、泄露监控和账号安全流程；这些能力更接近数字生活防护，而不是重型终端安全。这个定位很关键，因为它解释了
              Guardio 的定价和分发方式：产品要轻、常开、易安装，而不是把企业安全栈重新包装给家庭。公开规模信号有意义，但多数仍来自公司口径。Guardio 称产品用户超过 1.5M+，研究团队每天拦截约 825,000
              个威胁，并每天封锁约 320,000 个恶意网站。这些数字说明触达和运营活动真实存在，但不是经审计的运营披露。独立测评在方向上支持 Guardio
              的浏览器原生覆盖和消费端倾向，同时也提醒投资人：公司覆盖面仍窄于完整设备级杀毒套件。
