  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 范围与平台风险
        blocks:
          - type: paragraph
            body: >-
              Guardio 的第一个重大风险，也正是产品存在的理由：它贴近浏览器。诈骗和钓鱼行为发生在 Chrome 或 Edge 里时，这很有力量，但也会约束产品。测评证据很清楚：Guardio
              不是完整杀毒，也不是完整身份套件。如果原生浏览器保护继续改善，或更大的安全套件持续加入类似浏览器功能，Guardio 的付费定位可能被挤压。Gen Digital 自己的 10-K
              让这个风险更可信，因为即便是大得多的在位者也警告，浏览器和平台所有者可能降低第三方安全工具的价值。换句话说，只要浏览器风险层继续扩张，Guardio
              的窄契合就是优势；但如果原生平台自己吸收了太多这一层，它也可能很快变成负担。
