  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 公开估值锚点
        blocks:
          - type: paragraph
            body: >-
              Guardio 的估值工作必须从两个偏硬事实和一个强推断开始。第一个事实是 2021 年 A 轮，Calcalist 估计约 $500 million。第二个是 2025 年 $80 million B
              轮，以及管理层对 2026 年初超过 $100 million ARR 的指引。强推断来自 TechCrunch 的报道：2025 年估值约为 2021 年三倍，因此中心估计约 $1.5
              billion。这个估计不是官方每股价格披露，但仍是最站得住的公开锚点。它也符合 ION Crossover
              领投的一轮后期成长融资，而不是小型机会型融资。还有一点同样重要：定价争论的锚并非纯用户数叙事，而是运营规模。ARR 指引、投资人质量和历史定价都指向同一方向，降低了估值只是宣传标题的概率。
