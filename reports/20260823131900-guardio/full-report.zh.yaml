      - number: '2.3'
        title: 需求驱动因素与采用约束
        blocks:
          - type: paragraph
            body: >-
              需求侧条件有利。FBI 的 2025 IC3 报告显示，投诉超过 100 万件，损失达 $20.877 billion；钓鱼和仿冒在数量上仍然巨大，网络促成的欺诈占全部损失的 85%。FTC 诈骗报告和
              Guardio 自身 2026 年研究强化了同一点：攻击形式越来越绑在日常消费者流程上，例如短信提醒、包裹配送、报税和虚假服务通知。IBM 和 Cybersecurity Ventures 都把 2026
              年描述为 AI 赋能欺骗加速的时期，这强化了产品需要检查上下文、行为和仿冒，而不只是扫描静态恶意软件签名的论点。但采用并非没有摩擦。Mordor
              明确指出，免费内置保护会抑制高级付费方案采用。独立测评也反复提醒，Guardio 不是完整杀毒或设备加固套件。这意味着 Guardio
              的顺风和约束其实连在一起：市场想要更轻、更懂上下文的保护，但买方只要支付订阅费，仍可能期待更宽的套件。因此 Guardio
              的商业挑战不是证明问题存在，而是证明在免费原生保护和重捆绑的在位者旁边，它这个更窄的产品切片仍值得付费。
