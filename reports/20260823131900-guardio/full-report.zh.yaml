              文章也暗示，付费群体几年前就已经高度偏美国；这与一个产品的销售地区相符：当地诈骗焦虑和无卡欺诈常见，订阅软件也是熟悉的购买形式。企业页和 Lovable 合作值得关注，但不足以推翻基本结论：Guardio
              今天的客户身份是家庭浏览器用户，而不是企业安全买方。
