  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接同业与家庭替代品
        blocks:
          - type: paragraph
            body: >-
              Guardio 真正的竞争对象不是所有网络安全公司，而是消费者在决定是否为个人数字防护付费时会考虑的那一组厂商。因此 Norton、Aura、Bitdefender 和 Malwarebytes
              是最相关的直接比较对象。Norton 靠最大广度竞争，把设备安全、隐私、家长控制和身份保护组合在一起。Aura 从身份和家庭安全角度切入，保险、信用、数据移除和儿童功能都超出 Guardio
              当前范围。Bitdefender 是成熟的跨设备套件，Malwarebytes 则凭可信的恶意软件品牌和浏览器相邻扩展竞争。面对这一组，Guardio
              的关键优势不是广度，而是聚焦。产品设计要在浏览器点击、诈骗消息和高风险扩展层面快速证明价值，不强迫用户安装完整终端代理。这很重要，因为家庭买方往往并不想购买抽象的“安全栈”，他们只想尽快解决一个具体钓鱼或诈骗问题。但这也意味着，只要买方想用一个厂商完成设备清理、VPN、家庭控制或深度身份补救，Guardio
              就会在套件比较中失分。
