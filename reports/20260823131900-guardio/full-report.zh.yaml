      - number: '1.2'
        title: 创始人、领导层可见度与组织成熟度
        blocks:
          - type: paragraph
            body: >-
              已抓取的记录中，创始人故事异常一致。多份 2021 年和 2025 年来源都将 Amos Peled、Daniel Sirota 和 Michael Vainshtein 列为创始三人组，Peled 担任
              CEO，Vainshtein 是近期报道中最常露面的技术发言人。Calcalist 2021
              年融资报道把三人都与精英网络情报背景联系起来，这也解释了公司为何很早就选择浏览器攻击面。公开领导层可见度最强的是创始人，最弱的是正式治理。Seedtable 提到 CFO Meital
              Elazar，这是一个合理信号：Guardio
              已从只有创始人撑台的运营班子，成长为更重视财务的后期公司。但在本轮检索到的公开材料里，更完整的董事名单、委员会结构和控制权安排仍然缺失。招聘信号偏正面，但并不完整。招聘页显示仍有开放岗位，FinTech
              Global 称公司计划在 2025 年融资后继续在以色列招聘。startupim 估计员工约 149 人，这在方向上有用，但仍是模型估计，不是公司正式披露，因此只能作为低置信度的规模代理，不能当作硬事实。
