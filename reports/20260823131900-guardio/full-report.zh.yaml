      - number: '1.4'
        title: 里程碑、扩张信号与仍待披露的缺口
        blocks:
          - type: paragraph
            body: >-
              Guardio 在 2024 年后的轨迹显示，公司正试图从“浏览器扩展”拓宽为更大的数字安全平台。最显眼的证据是 Lovable 合作：Guardio 的引擎被用作 AI
              生成网站上线前的扫描层。官方融资材料也指向一个新的可见性层，更像消费化的 DLP 和 SaaS 态势管理，而不只是简单的恶意链接拦截器。与此同时，公司公开品牌越来越把软件和教育结合起来。Guardio
              围绕税务、银行、品牌仿冒、钓鱼、包裹配送和 AI 驱动滥用持续发布诈骗解释器和威胁研究，这很可能同时帮助获客和产品可信度。未解决的问题不在于公司是否存在，或是否有产品市场契合；问题在披露深度。当前董事会、2025
              年确切估值、所有权集中度、清算条款、已实现净收入留存，以及审计财报都仍缺失。Security.org 给出了最干净的独立提醒：Guardio 对 Chrome
              中心的防护看起来有价值，但仍不是完整设备级杀毒，也不是完整身份保护套装。这个限制具有战略意义，因为它决定 Guardio 能赢在哪里，也决定更大套件仍在哪里保有优势。
