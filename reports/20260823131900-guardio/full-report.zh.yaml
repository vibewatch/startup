        title: 浏览器架构为什么重要
        blocks:
          - type: paragraph
            body: >-
              Guardio
              选择驻留在浏览器内外，并非小事。浏览器原生位置让产品能看到页面上下文、可疑跳转序列、相似登录体验、短链接技巧和扩展行为，而传统终端工具往往把这些视为边缘问题。这也解释了为什么扩展监控会成为真正差异点：浏览器扩展可以访问
              DOM、cookies、表单提交和持久会话，本身就是有意义的风险面。Aikido、Keep Aware 和 Parallels
              的外部浏览器安全研究也支持一个更大命题：浏览器已经变成中心攻击层。与此同时，同一套架构也收窄了 Guardio 的可见性。发生在受支持浏览器之外、或需要全系统清理的威胁，只能被部分处理。同样，公开的
              Guardio for Business 界面与企业浏览器厂商相比仍很浅，后者披露了更多策略、DLP 和管理员控制细节。简言之，浏览器原生架构让产品显得现代，也让产品边界很容易被看见。
