  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 融资历史与资本效率
        blocks:
          - type: paragraph
            body: >-
              对一家声称已经达到显著消费端规模的公司来说，Guardio 的融资历史异常紧凑。业务前三年基本自筹，随后在 2021 年末完成 Tiger Global 领投的 $47 million A
              轮。当时公开报道把公司规模定位在约 100,000 名付费客户、接近 100 万 日活用户，以及估计 $500 million 估值。四年后，Guardio 又完成 ION Crossover Partners
              领投的 $80 million B 轮，现有投资者再次参投。公开数据库和分析师摘要显示累计融资约 $127
              million。按现有证据，这不是很小的资本堆栈，但相对披露的规模轨迹仍算克制。重要含义是：Guardio 看起来不像靠现金堆出来的增长幻象，而像一家公司先证明需求、等消费端牵引力可见后再叠加增长资本。
