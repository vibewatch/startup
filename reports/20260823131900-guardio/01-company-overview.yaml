    {
      "id": "capital-history-and-commercial-shape",
      "title": "Capital history, revenue mix, and commercial shape",
      "body": "Guardio’s capital story is one of the clearest parts of the public record. The company says it bootstrapped for its first three years, then raised a $47 million Tiger Global-led round in December 2021 that Calcalist pegged at a $500 million valuation. At that point, Guardio reportedly had roughly 100,000 paying customers and nearly one million daily users. Four years later, the company raised an $80 million Series B led by ION Crossover Partners, with Vintage Investment Partners, Union Tech Ventures, and Emerge also participating. Around that round, Guardio publicly framed itself as having produced three straight years of 100%+ ARR growth and being on track to surpass $100 million in ARR by early 2026. TechCrunch adds the most important monetization datapoint: Guardio said it had 500,000 paying users at the time of the Series B. The valuation story is slightly murkier. TechCrunch says the valuation tripled from the prior round, which implies roughly $1.5 billion if the $500 million 2021 estimate is the right baseline, but the company still did not disclose an exact price. Revenue mix is clearer than valuation: Amos Peled said 99% of revenue still came from private customers, so the business remains overwhelmingly consumer-led despite new business-facing options.",
