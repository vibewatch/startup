    {
      "id": "founders-leadership-and-org-maturity",
      "title": "Founders, leadership visibility, and organizational maturity",
      "body": "The founder story is unusually consistent across the fetched record. Multiple 2021 and 2025 sources identify Amos Peled, Daniel Sirota, and Michael Vainshtein as the founding trio, with Peled as CEO and Vainshtein as the most visible technical spokesperson in recent coverage. Calcalist’s 2021 round coverage ties all three to elite cyber-intelligence backgrounds, which helps explain why the company chose the browser attack surface early. Public leadership visibility is strongest around founders and weakest around formal governance. Seedtable surfaces a CFO, Meital Elazar, which is a reasonable signal that Guardio has matured from a founder-only operating bench into a more finance-aware late-stage company, but the broader board roster, committee structure, and control rights remain missing from the public materials retrieved in this run. Hiring signals are positive rather than exhaustive. The careers page shows open roles and FinTech Global says the company plans to keep hiring in Israel after the 2025 round. startupim’s headcount estimate of roughly 149 employees is directionally useful, but it is still model-based rather than an official company disclosure, so it should be treated as a low-confidence scale proxy rather than hard fact.",
