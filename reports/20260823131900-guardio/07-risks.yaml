        "statement": "Guardio’s privacy policy confirms it collects anonymized browsing behavior, URLs visited during operation, and—if users enable them—email and SMS content for scanning features.",
        "type": "third-party-reported",
        "topic": "privacy-risk",
        "sourceRefs": [
          "SR001"
        ],
        "confidence": "medium",
        "freshness": "current",
        "answersQuestionRefs": [
          "QR003"
        ]
      },
      {
        "id": "CR005",
        "statement": "That data posture is operationally understandable for the product, but it creates a trust and privacy risk surface that consumer users may not fully appreciate.",
