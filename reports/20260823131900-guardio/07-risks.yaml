    "claims": [
      {
        "id": "CR001",
        "statement": "Guardio’s product scope is concentrated in the browser, which means its protection is materially weaker for threats that bypass supported browsers or require full-device remediation.",
        "type": "inferred",
        "topic": "scope-risk",
        "sourceRefs": [
          "SR022",
          "SR023",
          "SR024",
          "SR025"
