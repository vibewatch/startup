      {
        "id": "CR003",
        "statement": "Gen Digital’s 10-K explicitly warns that platform owners can limit interoperability or make third-party security tools less necessary, making this a credible category risk rather than a theoretical one.",
        "type": "third-party-reported",
        "topic": "platform-risk",
        "sourceRefs": [
          "SR013"
        ],
        "confidence": "medium",
        "freshness": "current",
        "answersQuestionRefs": [
          "QR002"
        ]
      },
      {
