        "answersQuestionRefs": [
          "QR001"
        ]
      },
      {
        "id": "CR002",
        "statement": "Because the product is strongest in Chromium-browser flows, platform changes by browsers or operating systems could erode differentiation over time.",
        "type": "inferred",
        "topic": "platform-risk",
        "sourceRefs": [
          "SR013",
          "SR022",
          "SR024"
        ],
        "confidence": "medium",
        "freshness": "current",
        "answersQuestionRefs": [
