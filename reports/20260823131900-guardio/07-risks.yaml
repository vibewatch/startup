        ]
      },
      {
        "id": "CR006",
        "statement": "The privacy policy also says Guardio stores marketing-exposure metadata and some payment-related information, adding another layer of consumer-data handling obligations.",
        "type": "third-party-reported",
        "topic": "privacy-risk",
        "sourceRefs": [
          "SR001"
        ],
        "confidence": "medium",
