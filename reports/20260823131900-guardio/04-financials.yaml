  "chapter": {
    "number": 4,
    "title": "Financials",
    "summary": "Public financial evidence for Guardio is still sparse, but the available record points to a fast-growing, consumer-subscription business that raised efficiently, remained private through late 2025, and was targeting roughly $100M ARR by early 2026. The main diligence question is no longer whether demand exists; it is how durable revenue, margin, and acquisition efficiency are once hypergrowth normalizes."
  },
  "sections": [
    {
      "id": "funding-history-and-capital-efficiency",
      "title": "Funding history and capital efficiency",
      "body": "Guardio’s financing history is unusually compact for a company that claims to have reached meaningful consumer scale. The business was largely bootstrapped for its first three years, then raised a $47 million Series A in late 2021 led by Tiger Global. At that moment, public reporting pegged the company at roughly 100,000 paying customers, close to one million daily users, and an estimated $500 million valuation. Four years later, Guardio returned with an $80 million Series B led by ION Crossover Partners, again with existing investors participating. Public databases and analyst summaries place total capital raised at about $127 million. On the evidence available, that is not a tiny capital stack, but it is still modest relative to the reported scale trajectory. The important implication is that Guardio does not look like a cash-fueled growth mirage; it looks like a company that proved demand and then layered growth capital behind it once consumer traction was visible.",
      "claimRefs": [
        "CI001",
        "CI005",
        "CI006",
