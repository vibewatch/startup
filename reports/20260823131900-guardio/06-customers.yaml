      ]
    },
    {
      "id": "why-customers-buy",
      "title": "Why customers buy",
      "body": "Customers appear to buy Guardio for a specific kind of reassurance. The product promises to remove the cognitive burden of constantly judging links, pop-ups, extensions, suspicious downloads, and scam pages. That is why both official materials and independent reviews lean so heavily on simplicity, peace of mind, and “always on” language. This is not a product sold as a technical toolkit for experts; it is sold as a practical layer for ordinary users who want to browse, email, and text with less fear. The free or trial-led motion seems important because it gives users a concrete scan or first warning before asking them to pay, which is especially useful in consumer security where trust has to be earned quickly. The household ladder also helps, because once one person believes the product works, the family plan offers a straightforward reason to extend it across a household.",
      "claimRefs": [
        "CU006",
        "CU007",
        "CU010",
        "CU015",
        "CU021",
        "CU026",
        "CU027"
      ],
      "tableRefs": [
        "TU002"
      ],
      "figureRefs": [
        "FU001",
        "FU002"
      ]
    },
    {
      "id": "what-customers-like-and-dislike",
      "title": "What customers like and dislike",
      "body": "Review evidence is relatively consistent. Users and reviewers like easy setup, low perceived friction, and practical phishing or scam protection. PCMag’s perfect phishing-blocking result is not the same as customer satisfaction, but it likely reinforces the product narrative customers experience: visible, concrete protection at the moment of risk. Reviewers also describe decent support and useful first-scan behavior. On the other hand, the complaints are equally consistent. Scope is the main objection. Customers who expect full-device antivirus, VPNs, password managers, or deep identity-remediation features often come away thinking Guardio is too narrow. Price is the second objection. Multiple reviewers think the individual plan is expensive for browser-first coverage, even though the family plan looks more attractive on a per-person basis. Billing friction and cancellation complaints also appear, which suggests Guardio’s support and lifecycle operations deserve as much diligence as the core threat engine.",
      "claimRefs": [
        "CU008",
        "CU009",
