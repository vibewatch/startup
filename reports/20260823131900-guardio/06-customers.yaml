  "chapter": {
    "number": 6,
    "title": "Customers",
    "summary": "Public evidence indicates Guardio serves a large, primarily consumer customer base with limited but emerging SMB use. Customer perception is strongest around easy setup, effective phishing or scam interception, and practical peace of mind; complaints cluster around scope limits, price relative to browser-only protection, and occasional billing or support friction."
  },
  "sections": [
    {
      "id": "who-the-customers-are",
      "title": "Who the customers are",
      "body": "The public evidence says Guardio is first and foremost a consumer company. Management stated that 99% of revenue came from private customers, and the clearest hard scale markers are the company’s 1.5 million-plus users and TechCrunch’s report of roughly 500,000 paying subscribers. Plans are structured around individual, duo, and family use, which reinforces the household framing. The 2021 Calcalist article also suggests the paying base was already heavily U.S.-oriented several years ago, consistent with a product that sells where scam anxiety and card-not-present fraud are common and where subscription software is a familiar purchase. The business page and Lovable partnership matter, but not enough to overturn the basic conclusion: Guardio’s customer identity today is the household browser user, not the enterprise security buyer.",
      "claimRefs": [
        "CU001",
        "CU002",
        "CU003",
        "CU004",
