  topStrengths:
    - 作为浏览器优先的消费者安全产品，Guardio 已有真实货币化规模；公开证据支撑约 500,000 名付费用户，以及 2026 年初 >$100M ARR 目标。
    - 产品紧扣现代钓鱼、诈骗、恶意扩展和 AI 生成网页滥用风险，在消费者网络安全里被忽视的环节占住了清晰专家位。
    - Safe Browsing 引擎和 Lovable 式集成提供了可信的平台期权，叙事有机会跳出单一浏览器扩展。
    - 资本使用看起来相当高效：公司用约 $127M 融资跑到有意义的消费者规模，后期轮还由一位与 breakout 增长公司相关的投资人领投。
  topRisks:
    - 公开证据仍未展示流失、CAC、毛利率或退款动态，因此 Guardio 的增长质量大体还未被证明。
    - 产品仍依赖浏览器层价值和用户信任；原生平台改进、权限反弹，或大型套件把功能商品化，都可能打到它。
    - 收入仍高度集中在消费者端，业务暴露在订阅流失、获客成本压力和性价比质疑之下。
    - 即使以色列科技行业整体展现出韧性，以色列运营集中度仍带来真实的地缘政治和员工连续性考量。
  unresolvedGaps:
    - 公开来源没有提供经审计收入、毛利率、EBITDA、烧钱速度或现金跑道披露。
    - 队列留存、CAC、套餐组合扩张、退款、拒付和重新激活数据均未公开。
    - 合作伙伴或 Safe Browsing 平台收入的经济性、利润率和可重复性仍未披露。
    - 当前地域收入结构，以及美国付费用户的准确集中度，只得到较早新闻和管理层评论的部分支撑。
    - Series B 的确切定价、稀释、清算优先权和董事会治理条款尚未公开。
