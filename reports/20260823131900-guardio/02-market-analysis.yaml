    {
      "id": "buyers-users-and-substitutes",
      "title": "Buyers, users, and substitute choices",
      "body": "The primary buyer today is still the household, not the enterprise security manager. Guardio’s plan structure and public messaging point to three core use cases: a single user who wants easy browser and scam protection, a family or couple that wants multiple seats, and a freelancer or micro-business owner who needs lightweight security without operating an IT stack. The SMB offer exists, but management’s own comments still say 99% of revenue comes from private customers, so the business channel should be treated as an adjacency, not the core market. This segmentation also clarifies the substitute set. Consumers can choose to do nothing, rely on free browser or OS defaults, buy a broader security bundle from Norton, Bitdefender, or Malwarebytes, or choose a more identity-heavy offer such as Aura. Those alternatives often bundle VPN, insurance, password management, parental tools, or multi-device remediation that Guardio does not fully match. Guardio wins when users value speed, simplicity, and browser-native scam protection more than breadth. It loses when buyers want an all-in-one suite or perceive native protection as good enough.",
      "claimRefs": [
