  topStrengths:
    - >-
      Guardio has real monetized scale for a browser-first consumer-security product, with public evidence supporting
      roughly 500,000 paying users and a >$100M ARR target by early 2026.
    - >-
      The product is tightly aligned with modern phishing, scam, malicious-extension, and AI-generated web-abuse risks,
      giving it a clear specialist position in a neglected part of consumer cyber.
    - >-
      The Safe Browsing engine and Lovable-style integrations create credible platform optionality that could widen the
      narrative beyond a simple browser extension.
    - >-
      The capital history appears reasonably efficient, with roughly $127M raised to reach meaningful consumer scale and
      a late-stage round led by an investor associated with breakout growth companies.
  topRisks:
    - >-
      Public evidence still does not show churn, CAC, gross margin, or refund dynamics, so the quality of Guardio's
      growth remains largely unproven.
    - >-
      The product remains dependent on browser-layer relevance and user trust, making it vulnerable to native platform
      improvements, permissions backlash, or feature commoditization by larger suites.
    - >-
      Revenue concentration is still overwhelmingly consumer-focused, leaving the business exposed to subscription
      churn, acquisition-cost pressure, and value-for-money objections.
    - >-
      Israel-based operating concentration adds a real geopolitical and workforce-continuity consideration even if the
      broader Israeli tech sector has shown resilience.
  unresolvedGaps:
    - Public sources do not provide audited revenue, gross margin, EBITDA, burn, or cash-runway disclosure.
    - Cohort retention, CAC, plan-mix expansion, refunds, chargebacks, and reactivation data are not public.
    - The economics, margins, and repeatability of partner or Safe Browsing platform revenue remain undisclosed.
    - >-
      Current geographic revenue mix and the precise U.S. concentration of paying users are only partially supported by
      older press and management commentary.
    - Exact Series B pricing, dilution, liquidation preferences, and board-governance terms are not public.
