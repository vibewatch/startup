  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Direct peers and household substitutes
        blocks:
          - type: paragraph
            body: >-
              Guardio’s real competitive fight is not with every cybersecurity company; it is with the subset of vendors
              consumers consider when deciding whether to pay for personal digital protection. That makes Norton, Aura,
              Bitdefender, and Malwarebytes the most relevant direct comparison points. Norton competes from maximum
              breadth, combining device security, privacy, parental controls, and identity protection. Aura competes
              from an identity- and family-safety angle, with insurance, credit, data-removal, and child features that
              push beyond Guardio’s current scope. Bitdefender competes as a mature cross-device suite, and Malwarebytes
              competes from a trusted malware brand with browser-adjacent extensions. Against this group, Guardio’s key
              advantage is not breadth; it is focus. The product is designed to prove value fast at the browser click,
              scam message, and risky extension level without forcing a full endpoint-agent install. That matters
              because household buyers often care less about buying an abstract “security stack” than about solving a
              specific phishing or scam problem quickly. But it also means Guardio loses the bundle comparison whenever
              buyers want one vendor for device cleanup, VPN, family controls, or deep identity remediation.
