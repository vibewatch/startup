      - number: '3.2'
        title: Scale, distribution, and bundle power
        blocks:
          - type: paragraph
            body: >-
              The biggest structural issue for Guardio is not product legitimacy; it is scale asymmetry. Gen Digital,
              the public parent behind Norton, reports multi-billion-dollar revenue and a broad direct-to-consumer plus
              partner-distribution engine. That matters because bundle economics can outperform point-solution economics
              even when the point solution is technically good. Norton and similar incumbents can cross-sell, discount,
              and renew users inside broader household relationships that already include device protection and identity
              monitoring. Guardio, by contrast, is still overwhelmingly consumer-led and browser-led. Management said
              99% of revenue came from private customers, which is consistent with a company that has meaningful
              consumer traction but limited distribution diversification. The company’s direct model creates cleaner
              product-market fit data and potentially stronger alert-driven conversion, but it also leaves Guardio more
              exposed to rising acquisition costs and to competitors that can amortize marketing over larger bundles.
              Put differently, Guardio has a sharper proposition, but incumbents have deeper channels and more ways to
              preserve price-per-household.
            claimRefs:
