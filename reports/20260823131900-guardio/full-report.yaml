companyProfile:
  summary: >-
    Guardio is a 2018-founded Israeli consumer-cybersecurity company that built a browser-first protection product for
    phishing, scams, malicious downloads, harmful extensions, and identity exposure. The company reached roughly 500,000
    paying users by late 2025, guided to >$100M ARR by early 2026, and raised an $80M Series B led by ION Crossover
    Partners after three consecutive years of 100%+ ARR growth. Public evidence suggests a meaningful consumer-security
    wedge and emerging Safe Browsing platform optionality, but still leaves the quality of growth, partner economics,
    and long-run margin profile largely private.
