      - number: '7.3'
        title: Commercial and operational risk
        blocks:
          - type: paragraph
            body: >-
              Commercially, Guardio is still heavily concentrated. Management said 99% of revenue comes from private
              customers, which means the business is exposed to the classic vulnerabilities of consumer subscription
              software: churn sensitivity, paid-acquisition risk, seasonal behavior, and a constant need to justify
              renewal. The same threat intensity that drives demand can also create operational burden. IBM’s 2026
              threat reporting shows just how quickly identity, supply-chain, and AI-related attacks are evolving. If
              Guardio’s detection is too aggressive, it risks alert fatigue; if it is too conservative, it risks missing
              the attacks customers pay it to stop. Partner expansion adds another layer. A reusable Safe Browsing
              engine is strategically appealing, but once the company becomes part of another platform’s workflow, it
              inherits SLA, misuse, and trusted-integration risk too.
