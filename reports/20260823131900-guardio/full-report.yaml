    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, positioning, and scale snapshot
        blocks:
          - type: paragraph
            body: >-
              Guardio is now clearly marketing itself as a consumer cybersecurity platform rather than a classic
              antivirus vendor. The official homepage, About page, pricing page, and business page all emphasize
              browser-first protection, scam interception, breach monitoring, and account-safety workflows that sit
              closer to digital-life protection than to heavy endpoint security. That framing matters because it
              explains both Guardio’s pricing and its distribution model: the product is designed to feel lightweight,
              always on, and easy to install, not like an enterprise security stack repackaged for households. Public
              scale indicators are meaningful but still mostly company-claimed. Guardio says more than 1.5 million
              people use the product, that its research team intercepts roughly 825,000 threats daily, and that it
              blocks roughly 320,000 malicious sites per day. Those figures support real reach and operating activity,
              but they are not audited operating disclosures. Independent review coverage is directionally consistent on
              Guardio’s browser-native scope and on its consumer tilt, while also reminding investors that the company’s
              surface area remains narrower than a full-device antivirus suite.
