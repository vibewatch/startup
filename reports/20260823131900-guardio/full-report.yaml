  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: What the product is and what it is not
        blocks:
          - type: paragraph
            body: >-
              Guardio’s public product record is unusually clear about its center of gravity. This is not a classic
              antivirus suite trying to own the full endpoint. It is a browser-native security layer built to intercept
              phishing, malicious sites, scam flows, suspicious downloads, and rogue extensions where those threats
              increasingly appear: inside the browser and adjacent messaging or link journeys. That focus explains both
              the product’s appeal and its limits. The appeal is speed and simplicity. Reviews repeatedly describe quick
              setup and lightweight operation, which matters for consumer adoption because people do not want to manage
              heavy security agents for a narrow threat problem. The limit is just as important: independent reviewers
              also consistently note that Guardio is not deep device-remediation software and does not offer complete
              identity, privacy, or operating-system coverage. Investors should therefore think of the product as a
              high-fit specialist for browser-age abuse, not as a universal cyber stack.
