      - number: '7.4'
        title: Geopolitical risk and overall verdict
        blocks:
          - type: paragraph
            body: >-
              Finally, Guardio carries a real but nuanced Israeli operating-risk profile. The company is headquartered
              in Tel Aviv and continues to expand hiring in Israel. 2026 commentary on the Israeli tech ecosystem
              repeatedly emphasizes resilience, but it also makes clear that reserve-duty pressure, regional conflict,
              and capital-market complexity remain embedded operating conditions rather than tail risks. For Guardio,
              that means investors should ask practical questions about business continuity, distributed staffing, and
              crisis management—not because public evidence points to current distress, but because concentration can
              matter when growth depends on speed. Overall, the public risk picture is cumulative rather than singular.
              There is no obvious fatal flaw, but there is a meaningful stack of trust, platform, concentration, and
              operating risks that all ultimately feed back into one question: will Guardio remain indispensable enough
              that users, partners, and investors tolerate that stack over time? It should also push diligence toward
              concrete operating evidence, such as succession coverage for key teams, remote continuity playbooks, and
              how quickly product or support work can shift if local conditions deteriorate.
