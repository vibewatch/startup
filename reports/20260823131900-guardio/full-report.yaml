      - number: '2.3'
        title: Demand drivers and adoption constraints
        blocks:
          - type: paragraph
            body: >-
              Demand-side conditions are favorable. The FBI’s 2025 IC3 report shows more than one million complaints and
              $20.877 billion in losses, with phishing and spoofing still massive in volume and cyber-enabled fraud
              responsible for 85% of all losses. FTC scam reporting and Guardio’s own 2026 research reinforce the same
              point: attack formats are increasingly tied to everyday consumer workflows such as text alerts, package
              delivery, tax filing, and fake service notifications. IBM and Cybersecurity Ventures both frame 2026 as a
              period of escalating AI-enabled deception, which strengthens the argument for products that can inspect
              context, behavior, and impersonation rather than just scan static malware signatures. Yet adoption is not
              frictionless. Mordor explicitly notes that free built-in protections temper premium adoption. Independent
              reviews also repeatedly warn that Guardio is not a full antivirus or device-hardening suite. That means
              Guardio’s tailwind and its constraint are linked: the market wants lighter, more contextual protection,
              but buyers may still expect broader bundles if they are paying a recurring fee. Guardio’s commercial
              challenge is therefore not proving the problem exists; it is proving that its narrower product slice is
              worth paying for alongside free native protections and bundle-heavy incumbents.
