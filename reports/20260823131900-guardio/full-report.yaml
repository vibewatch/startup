      - number: '1.4'
        title: Milestones, expansion signals, and remaining disclosure gaps
        blocks:
          - type: paragraph
            body: >-
              Guardio’s post-2024 trajectory suggests a company trying to widen its category from “browser extension”
              into a broader digital-safety platform. The most visible proof is the Lovable partnership, which turned
              Guardio’s engine into a scanning layer for AI-generated websites before launch. Official funding materials
              also point toward a new visibility layer that looks more like consumerized DLP and SaaS posture management
              than a simple malicious-link blocker. At the same time, the company’s public brand increasingly mixes
              software with education. Guardio is publishing ongoing scam explainers and threat research around taxes,
              banking, brand impersonation, phishing, package delivery, and AI-driven abuse, which likely helps both
              customer acquisition and product credibility. The unresolved issues are not about whether the company
              exists or whether it has product-market fit; they are about disclosure depth. The current board, exact
              2025 valuation, ownership concentration, liquidation terms, realized net revenue retention, and audited
              financial statements are all still missing. Security.org also provides the cleanest independent caution:
              Guardio appears valuable for Chrome-centric protection, but it still is not a full-device antivirus or
              complete identity-protection bundle. That limitation is strategically important because it shapes where
              Guardio can win and where larger suites still hold an advantage.
