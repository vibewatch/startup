  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Scope and platform risk
        blocks:
          - type: paragraph
            body: >-
              Guardio’s first major risk is also the reason the product exists: it lives close to the browser. That is
              powerful when scam and phishing behavior happens inside Chrome or Edge, but it is also constraining.
              Review evidence is unambiguous that Guardio is not a full antivirus or complete identity suite. If native
              browser protections improve, or if larger security bundles keep adding similar browser features, Guardio
              may find its premium position squeezed. Gen Digital’s own 10-K makes this risk more credible, because even
              a much larger incumbent warns that browser and platform owners can reduce the value of third-party
              security tools. In other words, Guardio’s narrow fit is a strength while the browser risk layer keeps
              expanding, but it can become a liability quickly if the native platforms absorb too much of that layer
              themselves.
