  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and sizing lens
        blocks:
          - type: paragraph
            body: >-
              Guardio should not be valued against the entire cybersecurity market or even the full consumer-security
              umbrella without adjustment. The broadest credible outer bound comes from Mordor Intelligence, which sizes
              consumer security at $47.75 billion in 2026 and $75.25 billion by 2031. That bucket includes antivirus,
              privacy, identity, parental controls, and other household safety services. A second useful lens is
              identity theft protection, which Fortune Business Insights sizes at $19.45 billion in 2026. That category
              overlaps with Guardio’s breach alerts and identity-risk messaging, but it also includes remediation,
              insurance, and recovery depth Guardio does not fully match today. The most defensible conclusion is that
              Guardio participates in a large and growing market, but its actual serviceable market is narrower:
              browser-native protection for phishing, scams, malicious sites, extension abuse, and account-security
              issues. That distinction matters because it prevents the common mistake of taking a broad TAM slide and
              treating it as Guardio’s immediately monetizable spend pool. The company may eventually widen into more
              visibility and posture-management use cases, but the current product remains most tightly anchored to the
              browser and adjacent communication flows.
