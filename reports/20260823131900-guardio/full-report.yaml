      - number: '4.2'
        title: Revenue model and operating shape
        blocks:
          - type: paragraph
            body: >-
              The company’s visible business model is straightforward: free or trial-driven acquisition, recurring paid
              subscriptions, and higher-ARPU expansion through duo and family plans. Public pricing is enough to show
              that the business has several levers even without introducing new product lines. The move from roughly $9
              monthly pricing in 2021 to a broader 2026 household ladder implies both product maturation and a
              deliberate attempt to capture more value per protected household. Using management’s >$100 million ARR
              target and TechCrunch’s 500,000-paying-user figure implies around $200 annualized revenue per payer, which
              is directionally credible against the published plans page. That said, the unit-economics shape remains
              opaque. A browser-first model could carry better gross margins than legacy endpoint suites because it
              avoids heavy device remediation, but Guardio still bears cloud intelligence, alerting,
              identity-monitoring, support, and mobile costs. The business likely resembles consumer subscription
              software with security-data costs, not pure enterprise SaaS.
