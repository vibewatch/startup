      - number: '8.4'
        title: Valuation stance and next diligence
        blocks:
          - type: paragraph
            body: >-
              The best current stance is neutral-to-slightly-cautious. Guardio does not look obviously overvalued on
              public evidence alone, because the growth story, financing signal, and strategic browser-security
              narrative are coherent. But the company also does not look obviously cheap, because the public record is
              missing the exact quality-of-growth evidence needed to justify a premium with confidence. The next move in
              valuation should therefore come from private metrics, not from more headlines. Specifically, investors
              need the bridge from ARR to retention, gross margin, CAC, plan mix, and partner revenue. If that bridge is
              strong, the bull case becomes materially more credible. If it is weak, the consumer-utility bear case
              likely wins quickly. Until then, Guardio’s price looks like a premium multiple on a still-unproven
              durability story. In practice, that means an investor should resist both lazy skepticism and lazy
              enthusiasm. The right posture is to take the valuation seriously, assume sophisticated investors saw
              something real, and then test whether the private operating evidence supports the same conclusion with
              less narrative dependence.
            claimRefs:
              - CV023
