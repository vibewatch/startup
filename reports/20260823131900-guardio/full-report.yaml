  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Public valuation anchors
        blocks:
          - type: paragraph
            body: >-
              Guardio’s valuation work has to start from two hard-ish facts and one strong inference. The first fact is
              the 2021 Series A, which Calcalist estimated at about $500 million. The second is the 2025 $80 million
              Series B and management’s guide to exceed $100 million ARR by early 2026. The strong inference comes from
              TechCrunch’s report that the 2025 valuation was roughly triple the 2021 level, which yields a central
              estimate around $1.5 billion. That estimate is not official price-per-share disclosure, but it is still
              the most defensible public anchor. It also fits the profile of a late-stage growth round led by ION
              Crossover rather than a small opportunistic financing. It is also important that the pricing debate is
              being anchored by operating scale rather than by a pure user-count narrative. ARR guidance, investor
              quality, and prior pricing history all point in the same direction, which reduces the odds that the
              valuation is merely a promotional headline.
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV006
              - CV031
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV008
          - type: table
            tableRef: TV004
            claimRefs:
