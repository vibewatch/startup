              - CV002
              - CV003
              - CV004
              - CV036
              - CV037
              - CV039
      - number: '8.2'
        title: How the multiple looks
        blocks:
          - type: paragraph
            body: >-
              If Guardio was indeed worth about $1.5 billion and was heading toward $100 million ARR, the implied
              forward multiple is around 15x. That number is full, but not obviously crazy. It becomes more intuitive
              once you remember the reported scale: half a million paying users, rapid ARR growth, and a product
              category aligned with modern phishing and AI-scam behavior. It becomes less comfortable once you remember
              the business mix: overwhelmingly consumer revenue, limited disclosed B2B contribution, and no public
              evidence on churn, CAC, or margin durability. Put differently, the market could plausibly pay 15x for a
              cyber asset growing fast into a strategic lane, but only if the quality of growth is much better than the
              average consumer subscription business. The valuation therefore hinges on whether the business behaves
              more like a durable security subscription with meaningful upsell and low churn, or more like a fear-driven
              consumer utility that must constantly reacquire conviction from users. Public evidence cannot settle that
              distinction yet.
            claimRefs:
              - CV004
              - CV005
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
              - CV027
          - type: table
            tableRef: TV003
            claimRefs:
              - CV023
              - CV024
              - CV025
              - CV026
              - CV037
      - number: '8.3'
        title: What the comp set says
        blocks:
          - type: paragraph
            body: >-
              The comp set does not give one answer; it gives a spectrum. Gen Digital, the closest scaled public
              consumer-cyber comparator, trades at only about 3.5x revenue. CyberArk trades closer to 15.9x, and Palo
              Alto Networks around 27.5x. Those numbers do not mean Guardio deserves any exact one of those multiples,
              but they show that 2026 cybersecurity valuations vary enormously depending on whether the market sees a
              company as mature consumer protection, focused enterprise security, or a strategic platform. That is why
              category identity matters more than TAM slides. If Guardio is mainly a browser-first consumer utility
              under bundle pressure, 15x already looks ambitious. If it is becoming a reusable safe-browsing
              infrastructure layer for the AI web, 15x looks easier to rationalize. Cloudflare and Zscaler add another
              useful angle: the market will sometimes pay extremely high multiples for trusted security or network
              platforms when it believes they sit deep in the customer workflow. Guardio does not yet have public
              evidence strong enough to claim that identity outright, but the comparison shows why investors are willing
              to stretch if they see infrastructure-like potential.
            claimRefs:
              - CV014
