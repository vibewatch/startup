      - number: '2.4'
        title: Market verdict for Guardio
        blocks:
          - type: paragraph
            body: >-
              The market verdict is constructive but disciplined. Guardio is operating in a real and expanding segment
              with strong fraud and scam tailwinds, especially as AI makes impersonation cheaper and more believable.
              That gives the company a better category setup than a legacy antivirus vendor trying to defend a mature
              endpoint product. At the same time, Guardio’s actual monetizable slice is smaller than headline
              consumer-security TAM figures suggest, because the company is still monetizing a browser-first and
              message-linked protection layer. That is enough to build a substantial direct-to-consumer business, but it
              does not justify assuming the company can simply absorb identity-restoration, endpoint, or
              enterprise-browser budgets without product broadening and proof. The right framing for later valuation
              work is not “Guardio gets the whole consumer-cyber market”; it is “Guardio gets a focused, growing slice
              of consumer and SMB digital-safety spend where phishing, fake sites, brand impersonation, and breach
              exposure are the key jobs to be done.” Public evidence does not support a precise Guardio-specific TAM,
              SAM, or conversion funnel, so the chapter should preserve those as explicit diligence gaps rather than
              pretend to precision.
            claimRefs:
              - CM005
              - CM006
              - CM022
              - CM033
              - CM034
              - CM035
              - CM036
