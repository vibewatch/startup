  evidenceGaps:
  - type: missing-source
    severity: material
    topic: public-assurance-gap
    missingEvidence: Named SOC, ISO, GxP, or equivalent product and lab assurance artifacts for AI Science Factories, plus any public uptime or incident-reporting surface.
    whyItMatters: Buyers and investors need to know whether the autonomous-lab platform meets production-grade security, quality, and regulated-operations expectations.
    diligencePath: Request the trust-center package, external audit reports, quality-system documents, and any public or customer-only status reporting used for factory operations.
    relatedQuestionRefs:
    - QE018
    - QE025
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: commercialization-proof
    missingEvidence: Named first-cohort customers, contract scopes, SLA terms, and customer-side outcome dashboards for Catalyst or Creation programs.
    whyItMatters: Commercial readiness cannot be separated from whether external partners are already using the system in repeatable, production-like workflows.
    diligencePath: Request customer reference calls, anonymized MSAs or SOW structures, deployment scorecards, and retention or expansion metrics for the first cohort.
    relatedQuestionRefs:
    - QE024
    relatedTableRefs:
    - TE005
  - type: private-evidence-only
    severity: material
    topic: factory-hardware
    missingEvidence: Instrument inventory, assay families, robotics vendors, simulation-to-real stack design, and facility utilization data for each AI Science Factory.
    whyItMatters: The technical moat and capex profile depend heavily on what hardware is controlled, how broadly it can run experiments, and how efficiently it is used.
    diligencePath: Request a site visit, automation architecture review, hardware bill of materials, assay coverage matrix, and utilization logs by factory.
    relatedQuestionRefs:
    - QE011
    - QE025
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: minor
    topic: benchmark-validation
    missingEvidence: Methodology, baseline definition, replicate counts, and external validation for the published 900x DNA Design validation claim and related performance metrics.
    whyItMatters: Public benchmark claims shape the maturity assessment, but without methodology they remain marketing-grade rather than diligence-grade evidence.
    diligencePath: Ask for benchmark definitions, experiment design, independent replication data, and any partner or customer corroboration for the published metrics.
    relatedQuestionRefs:
    - QE005
    - QE023
    relatedTableRefs:
    - TE005
