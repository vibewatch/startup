- id: SE002
  title: Domain programs across life sciences, chemistry, and materials
  body: The domain map is broad but coherent around life sciences, chemistry, and materials. Lila's therapeutics pages focus on programmable genetic medicines, delivery vehicles, antibody and ligand engineering, and co-optimization for potency, specificity, durability, safety, and manufacturability. The biotech pages extend that logic into constructs, host systems, expression platforms, formulations, reagents, assays, and commercially relevant production workflows. Chemistry and energy pages push the same operating model into catalyst discovery, reactor selection, electrocatalysts, sorbents, rare-earth-free magnets, fuels, and chemically informed separations. The advanced-materials page adds thin-film coatings and infrastructure components, which reinforces that the same platform is intended to move between biological, chemical, and physical-science problem sets. Official pages consistently emphasize real experiments, verified or human-verified data, and operation under manufacturing or
    commercially aligned conditions, suggesting Lila is aiming to produce deployable assets rather than stop at virtual screening. Public evidence is strongest on workflow categories and technical direction, and weaker on named customer programs or third-party benchmarks inside each vertical.
