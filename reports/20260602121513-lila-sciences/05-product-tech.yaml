- id: TE003
  title: Technology / operating architecture table
  columns:
  - Layer / component
  - Role
  - Dependency
  - Risk
  rows:
  - - Scientific reasoning model (Lila Iris)
    - Generates hypotheses, plans experiments, and interprets results across multiple scientific modalities
    - Depends on continuous inflow of experiment-generated tokens and sufficient frontier compute
    - Model quality is hard to audit externally because architecture and benchmark detail are not public.
  - - Verifiers and scientific tools
    - Ground the agent with reward signals and domain-specific computation
    - Depends on accessible simulators, structure predictors, quantum chemistry solvers, editors, and other specialist tools
    - Toolchain brittleness or weak verification could reduce real-world learning quality.
  - - Autonomous design and workflow orchestration
    - Turns scientific goals into executable multi-step plans
    - Depends on orchestration software, planning logic, and robust lab scheduling
    - Workflow complexity can create hidden failure modes at scale.
  - - AI Science Factory instrument layer
    - Executes physical experiments and returns verified data for the flywheel
    - Depends on robotics, instruments, sensors, consumables, and reliable automation infrastructure
    - Sparse public disclosure on instruments and uptime raises diligence burden on facility maturity.
  - - Simulation and physical-science stack
    - Extends the platform into chemistry and materials through physics-based simulation and multiscale modeling
    - Depends on domain models, experimental data, and scientific leadership in physical sciences
    - Simulation-to-experiment transfer risk remains material without public benchmark detail.
  - - Robotics and simulation environment
    - Supports perception, manipulation, path planning, and sim-to-real iteration
    - Depends on robotics talent, simulation software, and integration with physical equipment
    - Custom hardware integration can be capex-heavy and difficult to replicate across sites.
  - - Commercial and security layer
    - Supports partner access, privacy controls, and AI safety programs as the platform opens to customers
    - Depends on access controls, encryption, monitoring, and organizational safety processes
    - Public assurance artifacts are still thinner than the technical ambition of the platform.
  notes: This table reconstructs the operating architecture from public product pages, leadership bios, job signals, and independent coverage; it is not an internal system diagram.
  enumerationScope:
    coverage: partial
    basis: Seven functional layers synthesized from official technical pages, leadership bios, and job postings because Lila does not publish a full architecture diagram.
