- id: SE003
  title: Robotics, multimodal science, and critical dependencies
  body: 'Lila''s operating model depends on a serious robotics and scientific-computing stack, and the public record gives credible evidence that the company is staffing for it. Julie Shah leads robotics, Milad Abolhasani brings self-driving-lab, multimodal analytics, and robotics expertise into chemistry programs, Rafael Gómez-Bombarelli anchors experimental plus physics-based AI for chemistry and materials, and Kenneth Stanley covers open-ended discovery methods. Hiring signals reinforce that leadership bench: Greenhouse listings span foundation models for life sciences, frontier capabilities, AI safety, protein engineering, and AI data, while CareersInRobotics postings add simulation-to-real, MoveIt, LiDAR, SLAM, dexterous manipulation, and NVIDIA Isaac Sim and Omniverse. That is enough to infer a custom lab-orchestration and simulation environment, but not enough to reconstruct the exact hardware BOM or facility topology. The product is therefore differentiated by the combination of
    scientific reasoning, robotics, and domain expertise, while also depending on scarce instrumentation, compute, and secure operational controls. NVentures backing and Lila''s stated technical-collaboration agenda strengthen the platform ecosystem story further.'
