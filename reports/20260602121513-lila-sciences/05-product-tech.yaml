- id: SE004
  title: Trust surface, roadmap, and diligence gaps
  body: 'Public trust signals exist, but they are still thinner than the ambition of the product narrative. Company materials say Lila is guided by safety, human impact, and scientific rigor, and the current hiring plan includes AI safety roles that span both biological and physical sciences. The candidate privacy notice is also more concrete than the marketing pages, naming role-based permissions, encryption in transit and at rest, anomaly monitoring, and regular security reviews of third-party recruiting tools, while the general privacy policy mentions technical and organizational safeguards with need-based access controls. At the same time, the reviewed public materials do not name product-level certifications, regulated quality systems, public uptime targets, or a public status page for AI Science Factories. Roadmap evidence is stronger on capital and buildout: the company launched with seed funding to build first factories, later added a sizable Series A with NVentures backing, said
    it would put more instruments under AI control, and opened the platform to an initial commercial cohort. The result is a technically differentiated story with material diligence still required on production assurance and customer proof.'
