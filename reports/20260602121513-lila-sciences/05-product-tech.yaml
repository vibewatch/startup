- id: TE002
  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow
  - Lila solution
  - Measurable benefit
  - Limitation
  rows:
  - - Design next-generation genetic medicines
    - Sequential assay design and wet-lab iteration across payload and delivery variables
    - Therapeutics workflows that jointly optimize cargo, formulation, targeting, and manufacturability
    - Official page claims verified real-world data each iteration and optimization across key development variables
    - No named customer program or trial-stage output is public.
  - - Engineer antibody or ligand candidates
    - Protein discovery often alternates between modeling and manual bench validation
    - Autonomous AI design plus experimental testing for binding, specificity, and developability
    - Official page says the workflow co-optimizes stability, solubility, aggregation risk, and expression
    - No public benchmark against incumbent discovery stacks.
  - - Improve bioprocessing or assay workflows
    - Construct and process tuning typically takes many manual cycles
    - Biotech workflows that optimize constructs, host systems, expression platforms, formulations, and methods
    - Official page says cycles can compress from months into weeks
    - No public breakdown by assay class or reproducibility metric.
  - - Discover catalysts or separation materials
    - Chemistry teams often screen large spaces slowly and with sparse device testing
    - Chemical workflows combining molecular design, predictive modeling, high-throughput experimentation, and device-aligned testing
    - Public materials claim higher speed and better commercial alignment than trial-and-error screening
    - Public case studies and customer economics are not disclosed.
  - - Develop coatings or infrastructure materials
    - Materials R&D often requires long design-build-test loops
    - Advanced-materials workflows for thin films, coatings, and other infrastructure components
    - Official pages position the platform as a faster route to materials that do not yet exist
    - No published asset-level maturity or qualification pathway is public.
  - - Open a partner discovery program quickly
    - Standing up custom robotic capacity requires capex and specialist operators
    - Catalyst and Creation offer on-demand platform access or outcome-oriented campaigns
    - Official pages promise more experiments in less time and validated assets for downstream pipelines
    - Pricing, contract structure, and customer references remain private.
  notes: Benefits are limited to source-backed workflow claims and should not be read as independently audited performance outcomes.
