- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / execution risk
  - Impact
  - Diligence path
  rows:
  - - Flagship ecosystem as a first-demand channel
    - Could concentrate early usage inside affiliated programs rather than independent customer proof
    - Good for throughput, weaker for external market validation
    - Request list of Flagship-linked versus third-party active programs
  - - Catalyst platform access
    - May still behave like bespoke services if each engagement requires heavy customization
    - Could limit gross-margin quality and repeatability
    - Request standard unit definitions, pricing logic, and average implementation scope
  - - Creation campaigns and venture launches
    - Creation may generate strategic value but blur customer revenue with venture incubation
    - Makes recurring-software durability harder to read
    - Request revenue split between platform access, services, milestones, and venture economics
  - - Cross-sector expansion beyond biotech
    - Energy and semiconductor demand is cited only as interest, not conversion
    - Could diversify fast if real, or remain a slide-level thesis if not
    - Request named non-biotech accounts and first delivered outcomes
  - - Factory capacity buildout
    - Large lab footprint raises fixed-cost risk if customer utilization ramps slowly
    - Can pressure margins before reference accounts mature
    - Request utilization, rerun, and queue-time metrics by factory
  - - Partner-led downstream commercialization
    - Lila depends on partners to advance outputs into products or trials
    - Upstream value may be real even if downstream economic capture is delayed
    - Request milestone structures, data-rights terms, and downstream participation economics
  notes: The core customer risk is not lack of target markets; it is whether early demand becomes repeatable, productized, and diversified fast enough.
