- id: named-proof-gap
  title: 'Named proof gap: commercialization intent is visible, but named customer proof is still absent'
  body: The strongest public evidence of external demand is still indirect. Reuters reported in October 2025 that Lila planned to open its platform to commercial customers through enterprise software and automated labs, and that it had drawn interest from firms in energy, semiconductors, and drug development. Fierce said the same financing round would help bring in the company’s first customers. Biopharma Dive added that Lila expects to partner with outside biotech companies and other Flagship startups rather than advancing its own therapeutics. Those are meaningful commercialization signals, but they fall short of customer proof in the stricter diligence sense. Across the reviewed set there are no named paying customers, no public case studies, no buyer-side testimonials, no procurement records, no usage metrics, and no disclosed outcomes from a reference account. The closest public counterparts are therefore prospect segments and ecosystem ties, not production-grade customer evidence.
  claimRefs:
  - CU012
  - CU013
  - CU014
  - CU015
  - CU030
  - CU032
  - CU040
  - CU041
  tableRefs:
  - TU003
  figureRefs:
  - FU003
- id: icp-and-commercialization-path
  title: 'ICP and commercialization path: pharma/biotech/materials buyers first, partner-led development downstream'
  body: 'Lila’s ICP is unusually broad but still coherent: it targets scientific problems where discovery speed, experimental throughput, and integration with physical labs matter more than generic software seats. The therapeutics and biotech pages emphasize genetic medicines, antibodies, small molecules, bioprocessing, reagents, and assay workflows. The chemicals, advanced-materials, and energy pages emphasize catalysts, sorbents, coatings, magnets, and industrial testing under commercially aligned conditions. The commercialization path also looks consistent across these sectors. Catalyst gives an existing team direct access to Lila Iris and AI Science Factories so the customer can accelerate a program already on its roadmap. Creation goes one step further by taking in a partner thesis or problem statement and returning validated assets, data packages, IP, and de-risked technical roadmaps. Reuters is explicit that Lila’s partners, not Lila itself, are expected to bring molecules into clinical
    trials or scale new energy breakthroughs. That makes Lila’s revenue model look more like enterprise discovery capacity and upstream scientific infrastructure than downstream product ownership.'
