  evidenceGaps:
  - type: missing-source
    severity: material
    topic: named-customer-proof
    missingEvidence: At least one named paying customer, pilot buyer, or procurement record with deployment scope and commercial terms.
    whyItMatters: Without a named reference account, it is impossible to distinguish slide-level demand from real customer adoption.
    diligencePath: Request current signed-customer roster, at least two reference calls, and any procurement or SOW documents for active accounts.
    relatedQuestionRefs:
    - QU007
    - QU023
    relatedTableRefs:
    - TU003
  - type: private-evidence-only
    severity: material
    topic: retention-and-usage
    missingEvidence: Retention, renewal, active-program, throughput, and customer-satisfaction metrics by cohort or account.
    whyItMatters: Durability cannot be underwritten without knowing whether early engagements repeat, expand, or churn.
    diligencePath: Request cohort tables showing renewals, repeat projects, active-customer count, throughput sold, and customer-reference satisfaction data.
    relatedQuestionRefs:
    - QU015
