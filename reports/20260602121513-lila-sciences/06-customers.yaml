- id: TU001
  title: Customer segmentation table
  columns:
  - Segment
  - Buyer / user / payer
  - Use case
  - Scale
  - Revenue / strategic value
  - Main gap
  rows:
  - - Flagship-linked internal programs and portfolio ventures
    - 'Buyer/payer: Flagship-originated venture builders or affiliated program owners; users: internal scientific teams'
    - Use Lila to accelerate early discovery, asset generation, and new-company formation
    - Most plausible earliest-use surface; no public count
    - Important for early throughput and proof-of-work, but not the same as diversified third-party revenue
    - No named portfolio company publicly confirms usage or payment
  - - External therapeutics and biotech R&D teams
    - 'Buyer: R&D or platform lead; users: discovery scientists; payer: biotech or pharma program budget'
    - Accelerate genetic-medicine, antibody, small-molecule, bioprocessing, reagent, or assay programs
    - ICP clearly marketed; named customers not disclosed
    - Likely the closest fit for first external revenue because Lila already speaks the language of upstream discovery
    - No named account, deployment metric, or outcome case study
  - - Materials, chemicals, and energy enterprises
    - 'Buyer: industrial R&D or advanced-engineering lead; users: materials, chemistry, and process teams; payer: enterprise R&D budget'
    - Catalyst discovery, coatings, sorbents, magnets, and commercially aligned materials testing
    - Interest reported; no public account list
    - Could diversify beyond biotech and shorten feedback loops if customers convert
    - Only sector interest is disclosed; no signed reference customer
  - - Strategic partners or investors using Creation
    - 'Buyer/payer: strategic partner, investor, or venture studio; users: Lila plus partner teams'
    - Present a problem space or thesis and receive validated assets, IP, and a de-risked roadmap
    - Publicly marketed engagement model; launched programs undisclosed
    - Can create high-value bespoke engagements and even new company formation
    - Recurring economics, launched programs, and customer names are not public
  - - Broad self-serve or marketplace users
    - Not evidenced publicly
    - No public self-serve workflow, pricing page, or community adoption surface
    - 0 disclosed
    - None visible
    - Whether any long tail exists remains unverified
  notes: Rows separate likely internal ecosystem demand, target external ICPs, and unproven long-tail demand so the chapter does not overstate customer quality.
