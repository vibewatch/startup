- id: durability-and-concentration-risk
  title: 'Durability and concentration risk: no retention proof, likely concentration, and real productization friction'
  body: Durability is where the public record is weakest. No reviewed source discloses customer count, active deployments, throughput sold, pricing, renewals, NRR, GRR, churn, contract length, or satisfaction metrics. That alone keeps the customer chapter in a pre-proof state. The other major issue is concentration. If early demand comes first from Flagship-linked programs, a handful of bespoke outside-biotech projects, or a small number of enterprise science teams, then the first revenue dollars could be strategically valuable but economically narrow. Adverse coverage sharpens that point. Industry Examiner argues that Lila still has to define productized units of work that procurement teams can actually buy; otherwise the model risks looking like custom consulting wrapped around expensive automated labs. The same analysis notes that the economics are sensitive to utilization, reruns, and excessive custom work. So the customer story is investable as a commercialization path, but not yet
    underwritten as a durable, diversified customer base.
