company:
  name: Lila Sciences
chapter:
  number: 6
  title: Customers
  summary: 'Lila Sciences has a clear target customer map but very limited public adoption proof. The company is still pre-commercial in practice: public materials describe Catalyst and Creation as partner-facing offerings, Reuters/Fierce frame the 2025 buildout around first customers, and no reviewed source names a paying external reference account. The likeliest early users are Flagship-linked programs and a small set of enterprise R&D teams in therapeutics, biotech, chemicals, materials, and energy, but durability, concentration, and repeat-revenue quality remain unproven from public evidence.'
sections:
- id: customer-map-and-segmentation
  title: 'Customer map and segmentation: broad ICP, but no broad installed base yet'
  body: 'As of the 2026-06-02 run date, Lila’s public customer story is still mostly a map of intended buyers rather than a roster of proven accounts. The company markets itself as an operating system for science that can serve “your programs, your scientists, and your most important discovery challenges,” and the solutions pages package that promise into two partner-facing motions: Catalyst for platform access and Lab-as-a-Service, and Creation for end-to-end campaigns that generate validated assets or even new companies. That framing points to enterprise R&D leaders, principal investigators, venture creators, and scientific teams as the real buyers and users. It does not point to a self-serve product or a large, already-deployed installed base. The most plausible earliest users are Flagship-linked internal programs and a small number of bespoke external teams, especially because Biopharma Dive says Lila plans to work with other Flagship startups and outside biotech companies, while Reuters
    later says the company is only beginning to open the platform to commercial customers.'
