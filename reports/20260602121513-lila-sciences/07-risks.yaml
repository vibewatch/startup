  "chapter": {
    "number": 7,
    "title": "Risks",
    "summary": "Lila Sciences carries a high-risk profile for a company founded in 2023 because it is trying to industrialize autonomous science across therapeutics and materials before public benchmark or customer proof is mature. The strongest public evidence points to five linked risks: scientific-validity risk around unverified claims, long commercialization timelines in drug and materials programs, biosecurity/data-governance exposure, competition from narrower AI-science peers, and heavy capital-plus-hiring requirements to scale AI Science Factories safely."
  },
  "sections": [
    {
      "id": "scientific-validity-and-autonomy-risk",
      "title": "Scientific validity and autonomous-scale risk",
      "body": "Lila's central promise is unusually ambitious: one system that generates hypotheses, designs and runs experiments, and learns from new data in real time across multiple scientific domains. That ambition matters because the core failure mode is not a normal software miss; it is the possibility that the platform looks strong in internal loops yet fails to produce reproducible, externally convincing results when exposed to partner workflows, messy biological systems, or long-cycle materials testing. Public evidence today supports the ambition more clearly than the proof. Lila itself claims broad scientific outperformance, but its public surfaces do not provide benchmark tables, blinded comparisons, or replication packs. Fierce Biotech explicitly noted that several marquee technical claims still lacked public supporting data. The scientific-risk question is therefore not whether the concept is interesting; it is whether autonomous experimentation can scale without optimizing toward spurious proxies, lab-specific artifacts, or hidden human scaffolding. That risk is amplified by breadth. Lila is not focused on one narrow assay or one clearly bounded vertical. It is simultaneously talking about therapeutics, chemistry, and advanced materials. Each domain has different validation norms, error costs, and timelines. Automation can accelerate iteration, but it does not erase reproducibility, calibration, or domain-translation risk.",
