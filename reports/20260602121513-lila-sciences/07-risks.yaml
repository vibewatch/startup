    {
      "id": "capital-hiring-and-execution-risk",
      "title": "Capital, hiring, and execution risk",
      "body": "Lila has already raised an unusually large amount of capital for a company this young, but the public evidence suggests that money buys the right to attempt the build, not proof that the build is already operationally de-risked. The company says it is using the funds to expand AI Science Factories, bring in first customers, and add more brilliant minds. The hiring footprint makes clear how wide that effort is: the Greenhouse board still shows open roles in AI safety, protein engineering, frontier capabilities, autonomous science for cell biology, machine-learning research, and technical program management. Those are not edge hires; they are core functions for any company trying to run autonomous science safely at scale. The multi-site footprint across Cambridge, San Francisco, and London compounds management complexity, especially when the company is spanning several scientific end markets at once. This creates a familiar deep-tech risk stack: heavy upfront spend, long proof cycles, and execution bottlenecks that surface through hiring, coordination, safety-review latency, or underutilized physical infrastructure. If Lila cannot convert capital into externally legible scientific and commercial milestones fast enough, the next financing could arrive before the proof does.",
