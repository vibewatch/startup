evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-metrics
    missingEvidence: Revenue, run-rate, customer-count, and contract-value disclosures tied to the current commercial partner program.
    whyItMatters: >-
      Chapter-one cover metrics require a supportable commercialization baseline, but public materials stop at interest
      and first-cohort language.
    diligencePath: >-
      Request board deck KPI pages or investor materials showing booked revenue, customer count, ACV, and first customer
      conversion dates.
    relatedQuestionRefs:
      - QO017
      - QO018
      - QO025
    relatedTableRefs:
      - TO001
  - type: missing-source
    severity: material
    topic: proof-claims
    missingEvidence: >-
