  - type: private-evidence-only
    severity: material
    topic: unit-economics-gap
    missingEvidence: Gross margin, cost-of-revenue split, utilization, rerun rate, CAC, payback, and retention metrics by offering.
    whyItMatters: These metrics determine whether the company behaves like scalable software, premium services, or an asset-heavy capacity business.
    diligencePath: Request board-level KPI reporting for 2025-2026 showing margin, utilization, sales efficiency, and cohort retention by product line.
    relatedQuestionRefs:
    - QI013
    relatedTableRefs:
