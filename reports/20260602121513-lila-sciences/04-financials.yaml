tables:
- id: TI001
  title: Revenue streams table
  columns:
  - Revenue stream
  - Mechanism
  - Unit
  - Current value / status
  - Revenue quality
  - Diligence ask
  rows:
  - - Discovery programs for partner R&D
    - Customers bring a scientific problem and Lila runs AI-guided experimental programs against it
    - Per program / milestone
    - Sacra describes this as the clearest current business model; official sources imply partner work but do not publish contracts
    - Potentially meaningful, but economically closer to high-value services until repeatability is shown
    - Request number of paid programs, ACV, milestone mix, and renewal / expansion pattern
  - - Enterprise software access
    - Reuters says Lila plans to offer access to its AI models and automated labs via enterprise software
    - Per org / seat / platform contract
    - Commercial plan disclosed; no public pricing or customer names
    - Could support recurring revenue if separable from factory work, but bundling risk is unknown
    - Request SKU structure, deployment model, contract minimums, and software-only revenue share
  - - AI Science Factory capacity
    - Automated lab throughput sold as experimental capacity or managed access
    - Per run / slot / usage block
    - Planned model inferred from official factory buildout and Sacra’s lab-as-a-service description
    - Could monetize fixed assets well if standardized and well utilized; poor if heavily bespoke
    - Request billing unit, throughput assumptions, utilization targets, and contribution margin by factory
  - - First-cohort commercial partners
    - Official post says Lila is welcoming its first cohort of customers now
    - Pilot / paid pilot / early contract
    - Commercialization started, but no named customers or reference accounts are public
    - Low until pilots convert into repeatable paid usage with measurable ROI
    - Request named customers, pilot-to-paid conversion, and reference-account economics
  - - Cross-domain scientific partnerships
    - Platform is marketed to life sciences, chemistry, materials, energy, semiconductors, and startups
    - Joint program / enterprise agreement
    - Target sectors are public; booked revenue by sector is not
    - Broader TAM can diversify demand, but each sector may require different sales motion and support
    - Request pipeline, win rates, and revenue mix by sector and contract type
  notes: Rows capture publicly visible monetization paths as of 2026-06-02; they describe mechanisms and disclosure status, not realized revenue mix.
