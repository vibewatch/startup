company:
  name: Lila Sciences
chapter:
  number: 4
  title: Financials
  summary: 'Lila’s public financial story is dominated by capital rather than operating disclosure: the company raised $550M across its 2025 seed and Series A, added a $115M Nvidia-backed extension, and now sits above a $1.3B valuation while only beginning to onboard a first cohort of customers. Public evidence supports a likely hybrid model of enterprise software, discovery programs, and automated-lab capacity, but it still does not disclose revenue, pricing, gross margin, burn, or named customer proof, so underwriting depends on private evidence and on whether expensive AI Science Factories can reach repeatable utilization.'
sections:
- id: revenue-model-pricing-and-commercial-readiness
  title: Revenue model, pricing, and commercial readiness
  body: 'Public evidence suggests Lila will monetize as a hybrid of software access, scientific-program revenue, and paid factory capacity rather than as a pure SaaS vendor. Official materials say the new capital is meant to bring the platform to customers and that a first cohort of commercial partners is being welcomed now. Reuters adds that Lila plans to sell enterprise software access to its AI models and automated labs, while Sacra describes a business model centered on project-based discovery programs with a future lab-as-a-service or usage-based layer. That combination is economically plausible for a company operating robotic wet labs across life sciences, materials, energy, and semiconductors, but it also means revenue quality is not yet proven. No reviewed official or market-data source disclosed list pricing, standard contract terms, ACV, revenue mix, or named paying customers. The result is a credible commercialization path with very weak public monetization disclosure: investors
    can see what Lila hopes to sell, but not yet the terms, customer proof, or repeatability that would let them underwrite recurring revenue quality.'
