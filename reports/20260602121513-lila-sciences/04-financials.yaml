- id: capital-adequacy-and-financing-dependency
  title: Capital adequacy and financing dependency
  body: Capital adequacy is the strongest part of the public record. Flagship unveiled Lila with $200M of committed seed capital in March 2025; the company then disclosed a $235M Series A first close in September and a further $115M extension in October, bringing the round to $350M and total disclosed capital to $550M. Bloomberg pegged the September valuation at roughly $1.23B, Reuters said the extension pushed Lila above $1.3B, and Forge later displayed a $1.42B Series A valuation snapshot. That funding stack substantially reduces near-term rescue-financing risk and gives Lila room to build labs, hire, and test commercialization. It does not, however, eliminate financing dependency. Because public sources do not disclose revenue, cash, burn, gross margin, or customer concentration, investors cannot tell how quickly the company is converting capital into a durable operating base. The SEC and NASAA Form D for AVSF - Lila Sciences 2025, LLC also suggests at least one feeder or syndication
    vehicle was involved in the 2025 financing process, reinforcing that the round was broad and structured rather than simple bilateral venture funding. No reviewed public source disclosed debt facilities or project-finance obligations.
