    - TI005
  - type: private-evidence-only
    severity: blocking
    topic: cash-disclosure-gap
    missingEvidence: Current cash balance, monthly burn, planned capex, and scenario runway after the October 2025 extension.
    whyItMatters: Runway is central to judging whether the $550M raise funds growth comfortably or simply offsets a very expensive operating model.
