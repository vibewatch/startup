- id: TI005
  title: Public financial gaps table
  columns:
  - Missing private metric
  - Why it matters
  - Public substitute
  - Impact on judgment
  - Exact diligence path
  rows:
  - - Named customers and contract value
    - Determines whether first-cohort demand is real, paid, and repeatable
    - Only first-cohort language and unnamed sector interest are public
    - Without reference accounts, commercialization remains prospective
    - Request customer roster, ACV, pilot-to-paid conversion, and three reference calls
  - - Revenue / ARR / revenue mix
    - Needed to test whether valuation is supported by commercial traction
    - Public sources disclose funding and valuation, not operating revenue
    - Prevents any rigorous price-to-revenue or burn-multiple analysis
    - Request monthly revenue bridge by software, program, and capacity revenue
  - - Gross margin and cost of revenue
    - Needed to distinguish scalable software economics from custom-lab services
    - 'Only operating proxies exist: leases, utilities, equipment, and cloud needs'
    - Keeps margin path and long-run profitability speculative
    - Request COGS split, depreciation policy, support cost, and margin by offering
  - - Cash balance, burn, and runway
    - Needed to judge how long the $550M stack lasts under current expansion pace
    - Capital raised is public; cash deployment is not
    - Makes runway and next-round timing impossible to underwrite precisely
    - Request current cash, monthly burn, planned capex, and scenario runway
  - - Capacity utilization and throughput
    - Utilization determines whether factories absorb fixed costs
    - Industry commentary and hiring imply large fixed assets, but no operating metrics are public
    - Leaves factory economics dependent on narrative rather than measured output
    - Request utilization, experiment throughput, rerun rate, cycle time, and backlog
  - - Renewal, retention, and concentration
    - Important if pilots convert into long-duration enterprise or platform contracts
    - No public metrics on renewals, NRR, expansion, or customer concentration
    - Prevents judging durability of revenue quality even if first programs are signed
    - Request renewal cohorts, expansion rates, concentration, and churn reasons
  notes: These are genuine diligence blockers rather than formatting omissions; each missing metric changes the valuation and financing case materially.
