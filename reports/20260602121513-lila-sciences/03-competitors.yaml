company:
  name: Lila Sciences
chapter:
  number: 3
  title: Competitors
  summary: >-
    Lila's closest direct public overlaps are Recursion/Exscientia, Insilico Medicine, and Isomorphic
    Labs because all market AI-enabled therapeutic discovery with some degree of model plus experiment
    integration. Lila still appears differentiated by its broader end-to-end AI science factory claim
    across biology, chemistry, and materials, but the sharpest substitutes may be modular stacks such
    as Benchling plus automation and open models, or internal pharma lab-in-loop programs that keep control
    inside the buyer organization. Adverse evidence suggests autonomy is real but not settled, so moat
    durability depends on proving commercialization, customer adoption, and throughput rather than only
    vertical-integration rhetoric.
sections:
- id: SEC301
  title: Direct integrated rivals to the AI science factory thesis
  body: >-
    Lila’s public pitch is unusually ambitious even inside AI-for-science. The company says it is building
    one general operating system for science that can autonomously generate hypotheses, design experiments,
    run them, and learn from results across life, chemical, and materials science. That makes Recursion
    plus Exscientia, Insilico Medicine, and Isomorphic Labs the closest direct competitor set, but for
    different reasons. Recursion already combines large proprietary biology-and-chemistry datasets, automated
    wet labs, and model-driven design, and the Exscientia transaction adds precision chemistry and automated
    synthesis, pushing it closest to a full-stack small-molecule drug-discovery rival. Insilico is also
    explicitly end-to-end in therapeutics, but its own public framing is still Pharma.ai and pipeline
    creation from A to Z, not a general scientific operating system. Isomorphic is similarly frontier-model
    heavy and well distributed through pharma partnerships, but its public narrative remains digital biology
    and molecule design, not cross-domain experimental autonomy. So the direct-rival map is real, but
    it is still narrower than Lila’s claim: most direct peers sell AI-enabled therapeutic discovery, while
    Lila is claiming an autonomous science factory across multiple scientific domains.
