- id: TP003
  title: Pricing / packaging comparison
  columns:
  - Competitor class
  - Public access or pricing posture
  - Contract / packaging model
  - Included capabilities
  - Unknowns or discount model
  - Implication
  rows:
  - - Lila Sciences
    - No public list pricing retained
    - Likely enterprise, partner, or program access to the science factory
    - General autonomous-science platform plus proprietary lab infrastructure
    - Named customers, price units, and contract structure are not public in retained sources
    - Commercial readiness is less legible than the technology story
  - - Recursion / Exscientia
    - No public software-style price list retained
    - Public-company platform plus partnered programs and milestone economics
    - Scaled biology, precision chemistry, automated synthesis, translation, and pipeline assets
    - Economics are visible mainly through M&A and partnership disclosures, not list pricing
    - Competes as a platform-plus-program company, not as transparent infrastructure software
  - - Insilico Medicine
    - No stable public list pricing retained
    - Platform, pipeline, and collaboration / licensing model
    - AI target discovery, molecule design, automation, and therapeutic programs
    - Public sources emphasize pipeline stages and collaborations rather than standard seats or usage
      fees
    - Best compared as a therapeutics engine, not a SaaS line item
  - - Isomorphic Labs
    - No open platform pricing retained
    - Large-pharma research collaborations with upfront and milestone economics
    - AI-first molecule design and target work against partner-selected programs
    - Lilly deal economics are public, but broader commercial terms are bespoke
    - Distribution is strong, but access is concentrated through partner relationships
  - - Benchling
    - Quote-led enterprise software
    - Implementation-led informatics subscription / platform model
    - Notebook, data model, workflow automation, sample and process management
    - Retained sources show scope and customer proof but not stable list prices
    - Most legible modular substitute for buyers who want infrastructure rather than outsourced science
  - - Open / modular stack
    - Open or component-priced
    - Open-source models/community plus hardware and software purchases
    - Public repos, open collaboration, modular automation hardware, and workflow software
    - Integration costs sit with the buyer and are not standardized across the stack
    - Lower lock-in, but much higher integration burden
  - - Internal pharma build
    - Internal budget line, not external list pricing
    - Capex, compute, software, and scientist time inside existing R&D budgets
    - Lab-in-loop AI, internal data, scientists, and neutral software or compute partners
    - Public spend detail is sparse, and ROI depends on internal adoption and governance
    - Most dangerous substitute for a standalone external factory when pharma has the scale to build
