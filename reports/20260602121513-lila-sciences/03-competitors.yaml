- id: TP004
  title: Moat durability / competitive risk register
  columns:
  - Moat claim
  - Threat
  - Severity
  - Evidence-backed rationale
  - Mitigation / diligence ask
  rows:
  - - One general AI science factory
    - Recursion / Exscientia already looks like a full-stack small-molecule rival
    - High
    - >-
      Recursion's automated biology plus Exscientia's automated chemistry is the closest public full-stack
      therapeutic analogue
    - Request proof that Lila's cross-domain stack creates better outcomes than therapeutic-only verticals
  - - Cross-domain scope is uniquely valuable
    - Buyers may prefer narrow validated stacks for drug discovery, informatics, or materials
    - High
    - >-
      Direct rivals are narrower but more legible, and modular substitutes let buyers only pay for the
      layers they need
    - >-
      Request win-loss data by buyer type and domain to show where cross-domain breadth matters commercially
  - - Autonomous execution creates durable lock-in
    - Leading public literature and researchers still favor human-in-the-loop autonomy
    - Medium
    - >-
      Royal Society says Level-5 full-autonomy systems are not yet realized and UChicago proposes shared
      control
    - Request evidence of unattended cycles, error rates, and when humans must intervene
  - - Closed system is better than open tooling
    - Benchling, Opentrons, and OpenBioML offer anti-lock-in alternatives
    - High
    - >-
      Open integrations, modular automation, and open model communities weaken the case that one vendor
      must own the whole stack
    - Quantify switching cost and integration benefit versus a modular stack
  - - Data flywheel is hard to copy
    - Internal pharma programs already sit on decades of lab and clinical data
    - High
    - >-
      Genentech's lab-in-loop and NVIDIA-backed platform shows buyers with scale can keep data and distribution
      in-house
    - >-
      Request evidence that external customers can benefit from pooled learning that they cannot replicate
      internally
  - - Materials-science autonomy is a clean wedge
    - >-
      Parallel-search platforms like megalibraries may outperform iterative self-driving labs in some
      materials workflows
    - Medium
    - >-
      Northwestern argues megalibraries can generate data and candidates faster than self-driving labs
      for certain materials problems
    - >-
      Benchmark Lila's materials workflows against megalibrary or high-throughput parallel-screen alternatives
  - - Lab OS ownership will consolidate
    - SLAS 2026 evidence points to a crowded orchestration layer with many vendors
    - High
    - >-
      Drug Discovery Trends mapped at least 15 companies competing for the AI-enabled lab operating-system
      layer
    - Show where Lila owns a differentiated layer that survives orchestration commoditization
  notes: >-
    Severity estimates the likely pressure on Lila's competitive position, not certainty of loss. Several
    threats are substitution or distribution risks rather than one-for-one feature replacement risks.
