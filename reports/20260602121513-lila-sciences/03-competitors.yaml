- id: SEC303
  title: Distribution power and the internal pharma build path
  body: >-
    Lila’s hardest competitive battle may be distribution and access, not raw technical ambition. Isomorphic’s
    public evidence shows a partnership-led route through Novartis, Lilly, and Johnson & Johnson, including
    very large milestone economics. Recursion and Exscientia also highlighted a pharma-partnership portfolio
    with major counterparties and milestone potential, which means large biopharma buyers can access AI-enabled
    discovery through established alliance models instead of adopting a new general platform. Benchling’s
    customer evidence adds another path: large R&D organizations can modernize internal science operations
    on neutral software and automation layers without surrendering control to a single science-factory
    vendor. Genentech’s own lab-in-a-loop narrative makes the substitute class even sharper. If big pharma
    can combine proprietary data, internal scientists, wet-lab infrastructure, and external compute or
    software partners, then the distribution advantage sits with embedded programs inside existing R&D
    organizations. Against that backdrop, Lila’s public materials are still comparatively opaque on commercialization,
    external customers, and throughput. That does not invalidate the technology story, but it does make
    the route to market less legible than the partnership-heavy and internal-build alternatives surrounding
    it.
