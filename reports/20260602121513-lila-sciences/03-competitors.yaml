  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: lila-commercial-model
    missingEvidence: >-
      Named customer-facing contract examples, pricing units, or access tiers for external use of Lila's
      platform or autonomous lab services.
    whyItMatters: >-
      Without a public access model it is hard to tell whether Lila competes as software, partnered R&D,
      a company-building engine, or something else entirely.
    diligencePath: >-
      Request sample SOWs, customer deck excerpts, or commercial term sheets that show how external buyers
      actually engage Lila.
    relatedQuestionRefs:
    - QP026
    relatedTableRefs:
    - TP003
  - type: private-evidence-only
    severity: material
    topic: lila-customer-traction
    missingEvidence: >-
      Named external customers, pilots, or recurring partner programs using Lila's science-factory platform.
    whyItMatters: >-
      Competitive differentiation matters only if external buyers are adopting the platform beyond its
      founding and financing narrative.
    diligencePath: Request customer list, active pilot count, and at least one citable external case study.
    relatedQuestionRefs:
    - QP027
  - type: missing-source
    severity: material
    topic: lila-throughput-metrics
    missingEvidence: >-
      Source-backed experiment-throughput, cycle-time, or lab-utilization metrics for Lila's autonomous
      labs.
    whyItMatters: >-
      Public claims about autonomy and scale are hard to benchmark against Recursion or cloud-lab alternatives
      without throughput metrics.
    diligencePath: >-
      Request a public benchmark note or internal dashboard showing experiment counts, unattended run
      time, and cycle-time improvement versus conventional workflows.
    relatedQuestionRefs:
    - QP028
  - type: missing-source
    severity: minor
    topic: internal-pharma-enumeration
    missingEvidence: >-
      A broader, source-backed enumeration of internal pharma AI programs beyond the Genentech example
      and customer-proof proxies.
    whyItMatters: >-
      The internal-build substitute class likely spans multiple large pharmas and could further compress
      demand for an external general platform.
    diligencePath: >-
      Collect additional live official pharma AI pages or annual-report disclosures for Sanofi, Novartis,
      AstraZeneca, and Roche.
    relatedQuestionRefs:
    - QP021
