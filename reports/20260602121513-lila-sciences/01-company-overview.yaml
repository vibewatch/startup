- id: capital-base-investors-and-footprint
  title: Capital base, investors, and operating footprint
  body: 'Lila moved from stealth to major-capital story very quickly. The March 2025 launch carried a $200 million seed round, the September 2025 first-close Series A added $235 million, and the October extension took the Series A to $350 million and total capital to $550 million. Reuters, CNBC, Goodwin, and syndications all place the post-extension valuation above $1.3 billion. The syndicate matters as much as the size: Flagship remained central, Braidwell and Collective Global led the first close, and the extension added NVentures, IQT, Analog Devices, Catalio, and other investors that broaden the company’s AI, defense, and industrial adjacency. The footprint story is similarly ambitious. Reuters and related coverage say Lila signed a 235,500-square-foot Cambridge lease—described as one of Boston’s largest lab leases of 2025—while Flagship and later media point to additional expansion in San Francisco and London. That physical buildout is important because Lila’s thesis depends on owning
    automated experimentation capacity, not merely training larger software models.'
  claimRefs:
