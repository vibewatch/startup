chapter:
  number: 1
  title: Company Overview
  summary: Lila Sciences is a Cambridge-based Flagship-built AI-for-science startup that says it is building scientific superintelligence through AI Science Factories and platform access for external partners. Public evidence supports a rapid funding arc from a $200M March 2025 seed to a $350M Series A and $550M total capital at a valuation above $1.3B, alongside a 235,500-square-foot Cambridge lease that underwrites the physical-lab thesis. The main open question is whether bold scientific-performance claims will be matched by public proof and commercial metrics before the narrative gets too far ahead of evidence.
