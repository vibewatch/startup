callouts:
- calloutType: strength
  title: Flagship lineage plus unusually senior operator bench
  body: For a company that was only publicly unveiled in 2025, Lila already shows a senior bench spanning company creation, AI, robotics, finance, and operations. That lowers execution risk versus an ordinary stealth-to-Series-A story, even if governance remains sponsor-heavy.
  claimRefs:
  - CO010
  - CO011
  - CO012
  - CO014
  - CO016
  - CO040
- calloutType: risk
  title: Proof has not yet caught up with the promotional narrative
  body: Independent coverage explicitly notes that public validation data is still thin, while key commercialization metrics such as revenue, named customers, and headcount remain undisclosed. The valuation now assumes Lila can convert AI-science ambition into externally auditable outcomes.
  claimRefs:
  - CO034
  - CO035
  - CO037
  - CO038
  - CO039
