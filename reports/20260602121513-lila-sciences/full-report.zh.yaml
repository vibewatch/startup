      - number: '4.4'
        title: 财务结论和尽调阻断点
        blocks:
          - type: paragraph
            body: >-
              从财务上看，Lila
              筛选结果是资金异常充足、战略野心很大，但在最关键运营指标上仍处于证据前阶段。上行情景很容易理解：罕见投资者辛迪加已经为建设买单，公司正从生物技术扩展到能源、半导体和材料，并终于从隐身转向首批客户商业化。下行情景同样清晰。Fierce
              指出，Lila
              尚未公开发布支持若干突破主张的数据；怀疑分析认为，只有当工厂吞吐量、标准化和客户转化可被衡量时，该模型才会在经济上成立。由于公开记录缺少收入、实际定价、毛利率、烧钱速度、利用率和参考账户，下一个承销里程碑不是另一则融资公告，而是证明首批客户能转化为可重复付费项目，或带有可接受单位经济的“软件加产能”合同。在证据出现之前，正确的财务立场是看好资本充足性，但对收入质量、利润率路径，以及
              science-factory 叙事变成真实业务的速度保持谨慎。
