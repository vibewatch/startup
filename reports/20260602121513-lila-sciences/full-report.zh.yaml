      - number: '2.4'
        title: 增长驱动因素、采用约束和碎片化竞争
        blocks:
          - type: paragraph
            body: >-
              Lila 所处市场的采用逻辑建立在生产率压力上。高通量筛选、劳动力短缺和减少人工错误的需求，持续把实验室推向自动化工作流。在信息学领域，合规、可审计性和云原生数据处理正在迫使实验室升级记录系统。在 AI
              药物发现领域，买家受发现本身的成本和时间负担驱动：Mordor 强调压缩多年发现周期的压力，并引用商业化一个分子的平均 US$2.6 billion
              成本。但约束同样清晰可见。市场报告和自驱动实验室综述反复指向遗留系统集成、碎片化仪器资产、高前期成本、实施负担和互操作性弱。Bruker/Chemspeed
              发布也从供给侧强化了同一点：异构实验室仍受困于孤立工具和集成缺口。市场还面临可信度风险。STAT 2024 年报道引用 Insitro 的 Daphne Koller
              警告称，人们期待“明天”就有突破，提醒投资者热情可能跑在实际部署之前。竞争格局不是赢家通吃，而是碎片化：实验室自动化由 Thermo、Danaher、Agilent、Tecan 和 Roche 等在位者主导；AI
              发现有自己的软件群体；自驱动实验室创业公司仍在由仪器、信息学和服务定义的更广泛栈内竞争。
