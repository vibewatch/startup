      - number: '7.4'
        title: 资本、招聘和执行风险
        blocks:
          - type: paragraph
            body: >-
              以一家这么年轻的公司而言，Lila 已经融到异常充裕的资本，但公开证据显示，这笔钱买来的是尝试搭建的权利，不是已经在运营上去风险的证明。公司称将用资金扩张 AI Science
              Factories、引入首批客户，并增加更多顶尖人才。招聘版图显示这件事铺得有多宽：Greenhouse 职位页仍在招聘 AI
              安全、蛋白工程、前沿能力、细胞生物学自主科学、机器学习研究和技术项目管理岗位。这些不是边缘岗位；任何想安全规模化运行自主科学的公司，都需要这些核心职能。Cambridge、San Francisco 和
              London
              的多地点布局进一步增加管理复杂度，尤其是公司还同时跨越多个科学终端市场。由此形成一组熟悉的深科技风险：前期投入重、验证周期长，执行瓶颈可能从招聘、协调、安全审查延迟或物理基础设施利用不足中冒出来。如果 Lila
              不能足够快地把资本转化为外部能读懂的科学和商业里程碑，下一轮融资可能会先于证据到来。
