  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 直接挑战 AI science factory 投资逻辑的集成型对手
        blocks:
          - type: paragraph
            body: >-
              即便放在 AI for science 内部，Lila 的公开叙事也异常激进。公司称自己正在为科学构建一个通用操作系统，可自主生成假设、设计实验、运行实验，并在生命、化学和材料科学中从结果学习。这让
              Recursion 加 Exscientia、Insilico Medicine 和 Isomorphic Labs 成为最接近的直接竞争组，但原因各不相同。Recursion
              已经把大型自有生物学和化学数据集、自动化湿实验室和模型驱动设计结合起来，Exscientia 交易又加入精准化学和自动化合成，使其最接近全栈小分子药物发现对手。Insilico
              在疗法领域也明确端到端，但其公开表述仍是 Pharma.ai 和从 A 到 Z 的管线创建，而不是通用科学操作系统。Isomorphic
              同样重前沿模型，并通过制药合作拥有良好分发，但其公开叙事仍是数字生物学和分子设计，而不是跨领域实验自主性。因此，直接对手图谱是真实的，但仍窄于 Lila 的主张：大多数直接同行销售 AI 赋能的疗法发现，而
              Lila 主张跨多个科学领域的自主科学工厂。
