      - number: '3.3'
        title: 分发能力和制药内部自建路径
        blocks:
          - type: paragraph
            body: >-
              Lila 最难的竞争战场可能是分发和访问，而不是原始技术野心。Isomorphic 的公开证据显示，它通过 Novartis、Lilly 和 Johnson & Johnson
              走合作伙伴主导路线，并包含很大的里程碑经济权益。Recursion 和 Exscientia 也强调与主要交易对手组成的制药合作组合及里程碑潜力，这意味着大型生物制药买家可以通过成熟联盟模式获得 AI
              赋能发现，而不必采用新的通用平台。Benchling 的客户证据又提供另一条路：大型研发组织可以在中立软件和自动化层上升级内部科学运营，而不把控制权交给单一 science-factory
              供应商。Genentech 自己的 lab-in-a-loop
              叙事让替代类别更尖锐。如果大型制药公司能组合自有数据、内部科学家、湿实验室基础设施，以及外部计算或软件伙伴，那么分发优势就在现有研发组织内部的嵌入式项目。放在这个背景下，Lila
              的公开材料在商业化、外部客户和吞吐量上仍相对不透明。这并不否定技术故事，但确实让上市路径比周边那些重合作伙伴和内部自建的替代方案更不清晰。
