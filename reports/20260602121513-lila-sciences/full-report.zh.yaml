chapters:
  - number: 1
    title: 公司概况
    sections:
      - number: '1.1'
        title: 身份、使命和商业模式
        blocks:
          - type: paragraph
            body: >-
              Lila Sciences 把自己定义为一家科学超级智能公司，而不是通用 AI 实验室或单一产品型生物技术公司。官方材料反复描述的平台，是一个 AI 系统：它能生成假设、设计实验、通过 AI Science
              Factory 仪器运行实验，并从生命科学、化学和材料问题产生的数据中实时学习。这一点对尽调很重要，因为其商业形态看起来是平台访问：Lila
              正在为外部科学项目搭建自动化实验室和企业软件，而不是传统的内部疗法管线。Reuters 也强化了这一定位，报道称管理层希望 Lila
              平台上的合作伙伴和创业公司把分子、材料或能源突破推进到下游开发。因此，第一章的运营结论是：Lila
              同时像前沿模型公司、机器人实验室运营商和发现基础设施供应商。公开材料有力支持其使命和架构，但尚未给出量化收入、已命名客户或员工数披露；尽管融资故事规模很大，核心商业化指标仍部分不透明。
