    title: Lila 里程碑时间线（2023–2026）
    type: timeline
    summary: Lila 从 Flagship 孵化走向大额融资、并受到更多外部审视的路径时间线。
    data:
      items:
        - date: '2023'
          label: 在 Flagship Labs 创立
          details: Lila 在 Flagship Pioneering 实验室内部成立，由 Geoffrey von Maltzahn 和 Noubar Afeyan 推动。
          tone: positive
          claimRefs:
            - CO005
        - date: Mar 2025
          label: 公开发布
          details: 经过多年孵化后，Flagship 发布 Lila，公司走出隐身状态。
          tone: positive
          claimRefs:
            - CO005
            - CO006
        - date: Mar 2025
          label: $200M 种子轮
