        title: 客户图谱和细分：ICP 很宽，但尚无广泛安装基础
        blocks:
          - type: paragraph
            body: >-
              截至 2026-06-02 运行日期，Lila
              的公开客户故事仍主要是目标买家图谱，而不是已验证账户名单。公司把自己营销为科学操作系统，可服务“你的项目、你的科学家和你最重要的发现挑战”；解决方案页面把这一承诺包装成两个面向合作伙伴的动作：Catalyst
              负责平台访问和 Lab-as-a-Service，Creation
              负责端到端项目，生成已验证资产甚至新公司。这一表述指向企业研发领导者、首席研究员、风险创建者和科学团队这些真实买家与用户。它不指向自助式产品，也不指向已经大规模部署的安装基础。最可能的早期用户是 Flagship
              关联的内部项目和少数定制化外部团队，尤其因为 Biopharma Dive 称 Lila 计划与其他 Flagship 初创公司和外部生物技术公司合作，而 Reuters 后来称公司才刚开始向商业客户开放平台。
