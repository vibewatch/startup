  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 科学有效性和自主规模化风险
        blocks:
          - type: paragraph
            body: >-
              Lila
              的核心承诺异常激进：一个系统横跨多个科学领域，实时生成假设、设计并运行实验，并从新数据中学习。这个雄心很重要，因为核心失败模式不是普通软件失误；而是平台在内部闭环里看起来很强，一旦暴露在合作伙伴工作流、混乱生物系统或长周期材料测试中，却无法产出可重复、能说服外部的结果。今天的公开证据更清楚地支持雄心，而不是证明。Lila
              自身声称广泛的科学超额表现，但其公开界面没有提供基准表、盲测比较或复现实验包。Fierce Biotech
              明确指出，若干标志性技术主张仍缺少公开支撑数据。因此，科学风险问题不是概念是否有趣，而是自主实验在规模化时能否避免优化到虚假代理指标、实验室特定伪影或隐藏的人类脚手架。广度放大了这一风险。Lila
              并不聚焦一个狭窄测定或一个边界清晰的垂直。它同时谈疗法、化学和先进材料。每个领域都有不同的验证规范、错误成本和时间线。自动化能加速迭代，但无法抹去可重复性、校准或领域迁移风险。
