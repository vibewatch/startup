      - number: '1.3'
        title: 资本基础、投资者和运营足迹
        blocks:
          - type: paragraph
            body: >-
              Lila 从隐身状态很快变成大额资本故事。2025 年 3 月发布时带着 $200 million 种子轮，9 月 Series A 首次关闭新增 $235 million，10 月扩展轮把 Series A
              推至 $350 million，累计资本达到 $550 million。Reuters、CNBC、Goodwin 及转载报道均把扩展后的估值置于 $1.3 billion
              以上。辛迪加的重要性不只在规模：Flagship 仍处核心位置，Braidwell 和 Collective Global 领投首次关闭，扩展轮又加入 NVentures、IQT、Analog
              Devices、Catalio 等投资者，拓宽了公司的 AI、国防和工业邻近性。实体足迹同样激进。Reuters 及相关报道称，Lila 签下 235,500 平方英尺的 Cambridge 租约，被描述为
              2025 年 Boston 最大实验室租约之一；Flagship 和后续媒体还指向 San Francisco 与 London 的进一步扩张。实体建设很关键，因为 Lila
              的投资逻辑依赖拥有自动化实验产能，而不只是训练更大的软件模型。
