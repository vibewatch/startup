        - 按组织 / 席位 / 平台合同
        - 商业计划已披露；没有公开定价或客户名称
        - 如果能与工厂工作拆开，可能支撑经常性收入，但捆绑风险未知
        - 要求提供 SKU 结构、部署模型、合同最低额，以及纯软件收入占比
      - - AI Science Factory 产能
        - 将自动化实验室吞吐作为实验产能或托管访问出售
        - 按运行 / 时段 / 使用量块
        - 根据官方工厂建设和 Sacra 的实验室即服务描述推断出的计划模型
        - 如果标准化且利用率高，可能很好地变现固定资产；若高度定制则较差
        - 要求提供计费单位、吞吐假设、利用率目标，以及各工厂贡献利润率
      - - 首批商业合作伙伴
        - 官方文章称 Lila 正在迎接第一批客户
        - 试点 / 付费试点 / 早期合同
        - 商业化已经启动，但没有公开具名客户或参考账户
        - 在试点转为可重复的付费使用并产生可衡量 ROI 前，质量偏低
        - 要求提供具名客户、试点转付费转化率，以及参考账户经济性
      - - 跨领域科学合作
        - 平台面向生命科学、化学、材料、能源、半导体和创业公司营销
        - 联合项目 / 企业协议
        - 目标行业公开；各行业已签收入未公开
        - 更大的 TAM 可分散需求，但每个行业可能需要不同销售动作和支持
        - 要求按行业和合同类型提供管线、胜率和收入结构
