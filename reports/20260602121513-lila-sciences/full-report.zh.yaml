      - number: '8.3'
        title: 乐观、基准和悲观估值框架
        blocks:
          - type: paragraph
            body: >-
              乐观情景取决于 Lila 能否从异常亮眼的融资表象，走向可验证的运营证据。这意味着披露具名付费合作伙伴，展示可复现实验基准或客户成果，并证明自主实验室相较传统团队能实质性提升发现吞吐量。如果这些信号出现，Lila
              有可能拿到下一档高溢价私募估值，大约落在 $2.3 billion 到 $3.0 billion 区间。即便如此，它仍会低于 Isomorphic 已经达到的资本规模，并接近私募 AI
              科学投资人在没有公开市场检验时愿意出资的上沿。


              基准情景更温和，而且重要的是，它离当前估值近得不舒服。在该情景下，Lila 继续吸引强势支持者和有限的合作伙伴试点，但披露的经济性不足以带来决定性重估。只要资本市场保持建设性，$1.1 billion 到
              $1.6 billion 左右的估值区间可以支撑。这个区间意味着相较当前标记几乎没有安全边际，因为今天的价格已经折现了相当多未来证据。


              悲观情景是公开市场重估传导进私募市场：技术主张仍不透明，合作伙伴采用继续模糊，更广泛的 AI 药物发现行业不断提醒投资人，尚无 AI 发现药物获得批准，后期疗效也未被证明。在这种环境里，Lila 可能被迫重估到
              $0.5 billion 到 $0.9 billion，甚至下轮降价。这些情景的概率加权中点接近当前估值，这正是为什么类股票答案不是 Lila 不好，而是价格还不够慷慨。
