  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议、信心和价格纪律
        blocks:
          - type: paragraph
            body: >-
              Lila 已经完成 AI 原生科学领域最强的早期私募融资之一：先完成 $235 million 首次交割，再通过 $115 million 扩展轮把 2025 年 Series A 推至 $350
              million，累计融资达到 $550 million，最新披露估值超过 $1.3 billion。这次资本形成很重要。它说明成熟投资人愿意为 Flagship
              孵化、异常宽的平台野心，以及自主实验室可能在疗法、材料、化学和其他领域复利扩张的可能性付费。单看融资，Lila 已经像一项溢价资产，而不是常规 Series A 公司。


              问题在于，价格更多由财团质量和平台可选性定出来，而不是由公开披露的商业证据支撑。Reuters 称 Lila 计划主要通过合作伙伴商业化，而不是自己推进分子；Fierce
              也指出，公司尚未公开发布数据来支持其最强技术主张。已审阅来源中仍看不到具名付费客户、披露的经常性收入、披露的毛利率或公开股权结构条款。因此，即便当前估值可以理解，也很难称得上有吸引力。


              因此，我的建议是观察，而不是买入。信心为中，风险为高。公开证据支持一个结论：Lila 是高质量融资故事，但还不是有吸引力的价格。当前估值看起来偏高而非非理性：高于普通 Series A 定价，低于最激进的私募
              AI 科学融资；如果证据仍然薄弱，也容易遭遇类似公开市场的重估。
