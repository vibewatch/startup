      - number: '1.2'
        title: 创立故事、领导层和治理
        blocks:
          - type: paragraph
            body: >-
              Lila 的创立叙事与 Flagship Pioneering 绑定得异常紧。PR Newswire 和 Flagship 称，Lila 于 2023 年在 Flagship 实验室成立，并在多年孵化后于
              2025 年 3 月公开发布；公司自己的发布说明称，它在 Flagship 内部幕后搭建了约三年。Geoffrey von Maltzahn 是故事核心：Lila 和 Flagship
              都把他描述为连续公司创建者，履历覆盖 Generate:Biomedicines、Tessera、Indigo、Sana、Seres 及相关企业。治理也仍然高度依赖赞助方，因为 Noubar Afeyan 既是
              Flagship 创始人 / CEO，也是 Lila 联合创始人 / 董事长。围绕 Geoffrey，公开领导团队强于典型刚亮相的平台公司：Andrew Beam 支撑 AI 科学可信度，Jawad Ahsan
              带来规模化财务纪律，Chris Fussell 带来组织和国家安全运营经验，Julie Shah 增加机器人深度，Rafael Gómez-Bombarelli 强化化学 /
              材料覆盖。主要尽调风险不是缺少资深领导者，而是 Flagship 还保留多少实际控制权，以及这种治理结构在后续融资或商业化阶段能维持多久。
