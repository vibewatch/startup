  - id: TP004
    title: 护城河耐久性 / 竞争风险登记表
    columns:
      - 护城河主张
      - 威胁
      - 严重性
      - 证据支持的理由
      - 缓释措施 / 尽调问题
    rows:
      - - 一个通用 AI 科学工厂
        - Recursion / Exscientia 已经像一个全栈小分子对手
        - 高
        - Recursion 的自动化生物学加上 Exscientia 的自动化化学，是公开市场中最接近的全栈疗法类比
        - 要求证明 Lila 的跨领域栈比仅做疗法的垂直方案带来更好结果
      - - 跨领域范围具有独特价值
        - 买方可能更偏好药物发现、信息学或材料领域中更窄但已验证的栈
        - 高
        - 直接对手范围更窄但更清晰，模块化替代品也让买方只为需要的层付费
        - 按买方类型和领域索取赢单 / 输单数据，证明跨领域宽度在哪里具备商业意义
      - - 自主执行创造持久锁定
        - 领先公开文献和研究人员仍偏好人在环自主
        - 中
        - Royal Society 称 Level-5 全自主系统尚未实现，UChicago 提出共享控制
        - 索取无人值守循环、错误率，以及人类必须介入时点的证据
      - - 封闭系统优于开放工具
        - Benchling、Opentrons 和 OpenBioML 提供反锁定替代方案
        - 高
        - 开放集成、模块化自动化和开放模型社区，会削弱“必须由一家供应商拥有全栈”的论证
        - 量化相对模块化栈的切换成本和集成收益
      - - 数据飞轮难以复制
        - 药企内部项目已经沉淀了数十年的实验室和临床数据
        - 高
        - Genentech 的实验室闭环和 NVIDIA 支持的平台表明，有规模的买方可以把数据和分发留在内部
        - 要求证明外部客户能从池化学习中受益，而这种收益是其内部无法复制的
      - - 材料科学自主化是清晰切入口
        - 在部分材料工作流中，巨型库这类并行搜索平台可能优于迭代式自驱实验室
        - 中
        - Northwestern 认为，针对某些材料问题，巨型库能比自驱实验室更快生成数据和候选物
        - 将 Lila 的材料工作流与巨型库或高通量并行筛选替代方案做基准对比
      - - Lab OS 所有权会走向整合
        - SLAS 2026 证据显示，编排层竞争拥挤，供应商众多
        - 高
        - Drug Discovery Trends 梳理出至少 15 家公司在争夺 AI 赋能实验室操作系统层
        - 说明 Lila 拥有哪些差异化层，能在编排商品化后继续存在
    notes: 严重性估计的是 Lila 竞争地位可能承受的压力，而不是损失的确定性。若干威胁属于替代或分发风险，并非一对一功能替换风险。
