  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出和替代栈
        blocks:
          - type: paragraph
            body: >-
              不能用单一通用的“AI for science”总可用市场（TAM）来承销 Lila
              Sciences。公开证据把相关支出拆成相邻层。实验室自动化报告聚焦药物发现、基因组学和诊断中使用的机器人系统、自动化工作站、液体处理、筛选和工作流软件。实验室信息学报告覆盖数据与控制骨干——LIMS、ELN、LES、云交付和合规工具。AI
              药物发现报告描述用于靶点识别、筛选、老药新用、从头设计和临床前优先级排序的软件与服务。自驱动实验室文献又描述了更窄、更早期的编排层，连接自动化仪器、AI 决策引擎和数据系统，形成闭环实验。对 Lila
              而言，纳入支出是这些层被一起采购、用于加速发现或流程优化的重叠部分。排除支出应包括常规诊断运营、通用企业 AI、完整临床开发或 CRO
              服务收入，以及不处在实验闭环内的广义工业自动化。实践中，现状替代方案通常是一套碎片化栈：仪器、信息学、内部脚本、CRO 工作和人工驱动的实验规划，而不是某个直接在位产品。
