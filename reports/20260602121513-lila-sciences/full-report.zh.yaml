      - number: '3.4'
        title: 护城河耐久性和反向证据
        blocks:
          - type: paragraph
            body: >-
              公开反向证据不支持把自主科学类别视为已经定局。SLAS 2026 市场图谱描述至少 15 家公司在争夺实验室操作系统层，这意味着编排、集成和闭环自动化正在许多供应商之间碎片化。Royal Society
              综述更直接：自驱动实验室在某些场景下几乎能自动化完整科学方法，但真正完全自主的 Level-5 AI 科学家尚未实现。UChicago 的 AI-advisor
              表述认为，领先实践者仍希望人类共享控制，而不是从闭环中消失。Northwestern 的 megalibrary
              工作展示了材料领域的另一项特定挑战：对某些发现问题，大规模并行筛选可跑赢迭代式自驱动实验室路径，因此 Lila 的材料投资逻辑可能面对不使用同一工厂模型、但数据丰富的替代方案。含义是，Lila
              的护城河不能只靠声称自己垂直整合或自主。它必须证明，跨领域闭环执行能创造比更窄疗法栈、模块化实验室系统或制药内部项目更好的经济性或更好的发现。在公开客户、吞吐量和结果数据出现之前，护城河耐久性更像战略论点，而不是已证明的市场锁定。
