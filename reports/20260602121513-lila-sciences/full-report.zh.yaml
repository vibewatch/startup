      - number: '1.4'
        title: 里程碑、商业化和怀疑信号
        blocks:
          - type: paragraph
            body: >-
              里程碑记录显示，公司正试图把戏剧性的资本故事转化为可信的平台业务。2025 年 3 月发布确立了种子轮融资和公开使命。9 月 Series A 首次关闭和 10
              月扩展轮随后抬高估值叙事；管理层在官方融资公告中称，Lila 正在欢迎首批客户并向外部合作伙伴开放平台。Reuters 补充称，能源、半导体和药物开发公司已经表现出兴趣，但也表示 Lila
              不计划亲自把产品一路推进到临床开发或大规模工业部署。相较于完全整合的生物技术公司，这让模型更轻资本；但证明也取决于合作伙伴转化和已验证案例研究。两个怀疑来源加深了风险。Fierce Biotech
              指出，公司尚未公开发布支持多项发现主张的数据；CNBC 称，热度可能跑在现实前面，因为许多 AI 平台仍难以稳定跑赢传统研究模型。因此，近期尽调问题在于：在估值叙事进一步跑赢证据之前，Lila
              能否把科学超级智能话术转化为外部可审计结果。
