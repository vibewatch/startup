      - number: '2.5'
        title: 对估值真正重要的规模和采用尽调缺口
        blocks:
          - type: paragraph
            body: >-
              核心承销问题不是市场是否存在，而是 Lila 是否在货币化正确的切片。公开证据不支持自主实验室或 AI science factories 的干净、独立
              TAM。它支持一些相邻且已有资金支持的类别，可被拼接成商业化投资逻辑；其中制药和生物技术是最可辩护的第一切入点，材料发现则是战略上重要但更难量化的第二切入点。这意味着估值工作需要来自 Lila
              的自下而上商业证据，而不是更多自上而下市场报告。关键问题很直接：按客户类型划分的当前
              ACV，软件、自动化与服务的组合，实施周期，续约行为，以及客户是否真的能从一个工作流扩展到更广泛工厂模式的证据。没有这些数据，广义 TAM 可以解释对该类别的兴趣，但不能支撑对 Lila
              份额获取或利润率结构的确信。
            claimRefs:
