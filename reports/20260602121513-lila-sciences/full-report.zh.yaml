    rows:
      - - Lila Sciences
        - 参照公司 / AI 科学工厂
        - 启动时承诺种子轮 $200M；公开愿景覆盖生命、化学和材料科学
        - 寻求一套自主发现栈的研究人员、制药公司和科学项目
        - 通用自主科学平台横跨多个领域，从假设生成一直覆盖到实验执行
        - 公开材料未披露具名客户、通量指标或商业定价
      - - Recursion / Exscientia
        - 直接集成型 TechBio 对手
        - 2024 年二季度合计现金约 $850M；上市公司平台；预计 18 个月内约 10 项临床读数
        - 重视 AI 赋能小分子发现且需要湿实验室规模的生物制药团队
        - 规模化生物学探索，加上 Exscientia 精准化学和自动化合成
        - 公开叙事仍集中在小分子疗法，而不是更广的科学工厂领域
      - - Insilico Medicine
        - 直接 AI 药物发现对手
        - 平台覆盖靶点识别到 II 期；按 2021 年销售额计，与前 20 大药企中的 10 家合作
        - 需要 AI 发现疗法和可合作管线资产的生物制药团队
        - 明确的 A-to-Z AI 药物发现管线，配有自动化和合作验证
        - 公开范围偏疗法，比 Lila 跨领域自主主张更窄
      - - Isomorphic Labs
        - 前沿模型药物设计对手
        - Lilly 预付款 $45M，里程碑最高 $1.7B；2025 年新闻页列出 $600M 外部投资轮
        - 希望借合作获得 AI 优先分子设计能力的大型制药发现团队
        - 源自 AlphaFold 的数字生物学栈，以及顶级药企伙伴准入
        - 合作驱动的商业模式清晰，但公开材料更强调药物设计，而不是自主湿实验室执行
      - - Benchling
        - 邻近 / 基础设施替代品
        - 获 1,200+ 家生物技术组织信任；声称有数千项实施
        - 将发现、临床前和工艺开发工作流数字化的研发组织
        - 深度嵌入的信息学层，带 AI 工具、集成和端到端工作流支持
        - 不声称自主运行科学方法，也不拥有完整湿实验室闭环
      - - Arcadia Science
        - 开放科学替代品
        - 2021 年成立，拥有专门的研究、软件和实验室运营团队
        - 被开放工具、协议和社区导向研究资产吸引的科学家
        - 重新思考研究周期，同时把工具和管线回馈社区
        - 开放科学姿态不等于工业化端到端自主执行
      - - OpenBioML + Opentrons
        - 开放 / 模块化栈替代品
        - OpenBioML 有工业级算力支持；Opentrons 销售可重构自动化硬件
        - 选择开放模型加灵活自动化、而不是单一封闭供应商栈的实验室
        - 开放协作、公开代码库和无锁定的模块化自动化
        - 需要集成工作，也没有呈现统一发现 P&L 或已验证的跨领域工厂
      - - 制药公司内部 AI 项目
        - 现状 / 内部自建替代品
        - Genentech 提到数十年的实验室和临床数据，以及 NVIDIA 支持的生成式 AI；AstraZeneca 引文显示自动化建立在中立基础设施上
        - 更愿意把发现能力留在内部的大型制药研发组织
        - 数据、科学家、预算和分发能力已经嵌在买方组织内部
        - 资本和集成负担高，且不同药企公开细节不均衡
