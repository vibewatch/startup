        blocks:
          - type: paragraph
            body: >-
              资本充足性是公开记录中最强的一块。Flagship 在 2025 年 3 月带着 $200M 已承诺种子资本发布 Lila；公司随后披露 9 月 $235M Series A 首次关闭，并在 10 月进一步扩展
              $115M，使该轮达到 $350M，已披露总资本达到 $550M。Bloomberg 将 9 月估值锚定在约 $1.23B，Reuters 称扩展轮把 Lila 推至 $1.3B 以上，Forge 后来展示了
              $1.42B 的 Series A 估值快照。该融资栈大幅降低近期救援融资风险，也给 Lila
              建实验室、招聘和测试商业化留出空间。但它并未消除融资依赖。由于公开来源未披露收入、现金、烧钱速度、毛利率或客户集中度，投资者无法判断公司正以多快速度把资本转化为耐久运营基础。SEC 和 NASAA 针对 AVSF
              - Lila Sciences 2025, LLC 的 Form D 也显示，2025 年融资过程中至少涉及一个 feeder
              或辛迪加工具，强化了该轮融资广泛且结构化，而不是简单双边风险投资。已审阅公开来源没有披露债务设施或项目融资义务。
