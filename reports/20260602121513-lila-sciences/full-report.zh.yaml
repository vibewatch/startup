      - number: '3.2'
        title: 模块化软件、自动化和开放科学替代方案
        blocks:
          - type: paragraph
            body: >-
              更危险的替代集合不只是直接 AI 药物发现玩家。Benchling、Opentrons、OpenBioML 和 Arcadia 展示了 Lila 集成投资逻辑之外的模块化替代路径。Benchling
              提供企业研发软件、端到端流程跟踪、AI 工具、集成和实施规模，但不声称自主运行科学方法。Opentrons 同样营销可重配置自动化和摆脱封闭系统的明确自由，使其成为湿实验室层替代品，而非
              science-factory 所有者。OpenBioML 在模型和社区层扩展了替代图谱：其开放研究实验室定位、公开代码库和有计算支持的合作显示，生物 AI
              的一部分可以在开放生态中搭建，而不必放进自有垂直栈。Arcadia 则从另一个侧翼发力：把工具、协议和软件管线发布回社区，同时试图重构研究周期。这些努力单独都不能复现 Lila
              的完整主张，但合在一起描述了一条可行的自组装路径：买家组合数据基础设施、自动化硬件，以及开放或伙伴驱动模型，而不是采用一个封闭工厂。
