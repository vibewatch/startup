      - number: '7.2'
        title: 监管、生物安全和数据治理风险
        blocks:
          - type: paragraph
            body: >-
              公开材料显示，Lila 在网站层面的法务卫生做过基本配置，但还看不到与生物领域自主科学敏感度相匹配的产品级治理。这个缺口很关键：平台一旦从泛 AI
              叙事进入生物实验、受监管健康数据使用或合成生物学工作流，问题就不再是“有意思的 AI 公司”，而是“失效模式可能触发隐私、生物安全和双重用途暴露的公司”。NIST、NIH、HHS、EDPS、RAND 和
              Johns Hopkins Center for Health Security 指向同一个方向：触及敏感数据或生物工作流的前沿 AI 系统，需要明确治理、可信控制，并在部分场景下设置隔离或监督程序。Lila
              的隐私政策承认 GDPR、UK-DPA、跨境传输和监管披露义务，条款也搭起了 Massachusetts
              法律和免责声明基础。它有帮助，但不够。这些文件管的是网站，不是部署到合作伙伴项目里的自主科学平台。公开材料没有说明产品级数据隔离、生物安全筛查、红队测试或审计流程。考虑到公司明确关注疗法和生物相邻工作，这一缺口应当被视为真实尽调问题，而不是文书积压。
