      - number: '2.2'
        title: 规模测算视角、矛盾估计和受证据约束的范围
        blocks:
          - type: paragraph
            body: >-
              公开市场证据足以说明类别重要性，但不足以支撑一个头条 TAM。仅实验室自动化一项，2026 年规模估计就从 FMI 的约 US$2.7 billion 到 Business Research Insights 的
              US$12.12 billion 不等，MarketsandMarkets 为 US$6.60 billion，Precedence 为 US$8.91 billion。实验室信息学更窄但同样不一致：Mordor
              估计 2026 年 US$4.05 billion，Business Research Insights 为 US$5.4 billion；Grand View 则把 2025 年该类别定在 US$4.1
              billion，并预计到 2033 年 CAGR 较慢，为 4.9%。AI 药物发现按当前收入看是最小的相邻类别，但增长最快：Mordor 认为 2026 年市场为 US$3.25 billion，到 2031
              年 CAGR 为 25.94%；Global Market Insights 称 2025 年市场已超过 US$3.1 billion，并将在 2035 年前每年增长
              30.5%。这些数字支持一个低十亿美元级别的广义相邻市场包络，但不能干净相加成 TAM，因为同一买家可以同时购买三层。更可信的结论是，Lila
              追逐的是几个已获资金支持类别中的快速增长集成问题，而最内层的自主实验室控制层在公开资料中仍未被量化。
