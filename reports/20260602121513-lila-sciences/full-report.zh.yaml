      - number: '8.2'
        title: 融资背景、可比公司和 Flagship 溢价
        blocks:
          - type: paragraph
            body: >-
              今天给 Lila 估值，最好的办法不是套收入倍数；收入没有公开披露，公司也没有把自己包装成完全一体化的疗法业务。更合适的框架，是对照三个可比集群做概率加权的里程碑定价：高溢价私募 AI 科学轮、Flagship
              平台型同业，以及公开 AI 药物公司的重估。上行参照里，Xaira 的 $1 billion 启动融资，以及 Isomorphic Labs 继 2025 年 $600 million 融资后又在 2026
              年完成 $2.1 billion 融资，说明只要市场相信 AI 平台能成为基础设施，私募市场就会以异常规模资助类别龙头。Generate:Biomedicines 是更接近 Flagship
              风格的参照：同样资本密集，但临床管线更可见，自 2020 年以来已融资近 $700 million。


              下行参照则严酷得多。Recursion 到 2026 年 6 月市值只有约 $2.01 billion，尽管它多年搭建平台、已上市且拥有多项合作；其 10-K
              仍警告公司没有获批产品，并预计还需要大量额外融资。Exscientia 的重估更尖锐：2021 年融资充足地 IPO，随后在 2024 年以约 $688 million 完成合并；BioPharma Dive
              等报道强调，Recursion 和 Exscientia 到那时都已损失大部分价值。这些公开市场结果并不自动说明 Lila 估值过高，但确实限制了投资人该为缺少证据的叙事支付多少。


              相比普通早期公司，Flagship 确实应享有一定溢价，因为它能发起深技术团队、组织战略资本并讲出类别故事。但这个溢价不应无限。没有具名合作伙伴、已发表验证数据或单位经济模型，公开证据还不足以支持按“Lila
              已经把平台承诺转化为耐久、可重复现金流”的方式定价。
