            body: >-
              Lila 的运营模型依赖严肃的机器人和科学计算栈，公开记录也给出了公司正在为此配备人员的可信证据。Julie Shah 领导机器人；Milad Abolhasani
              把自驱动实验室、多模态分析和机器人专长带入化学项目；Rafael Gómez-Bombarelli 支撑化学和材料中的实验加物理基础 AI；Kenneth Stanley
              覆盖开放式发现方法。招聘信号强化了这套领导班底：Greenhouse 岗位覆盖生命科学基础模型、前沿能力、AI 安全、蛋白工程和 AI 数据；CareersInRobotics 招聘又加入
              simulation-to-real、MoveIt、LiDAR、SLAM、灵巧操作，以及 NVIDIA Isaac Sim 和 Omniverse。这足以推断其有定制实验室编排和仿真环境，但不足以重构确切硬件
