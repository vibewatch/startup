            body: >-
              尽管没有 P&L，可能的成本结构已经可见。Lila 正在多个地理区域建设 AI Science Factories，Reuters 称其签下 235,500 平方英尺 Cambridge
              实验室租约，当前招聘材料显示多站点设施领导、大额资本规划、重型设备搬迁、工艺气体、水和空气系统、废水处理以及合规工作。招聘网站同时显示，公司在前沿
              AI、实验室运营、产品、合作伙伴和企业销售上激进招聘。Flagship 与 AWS
              的合作也指向湿实验室资本开支和科学劳动力之外的可观云与计算支出。合在一起，该模型比典型软件创业公司更依赖资本和利用率。已审阅公开来源没有披露毛利率、CAC、回本周期、留存、利用率或收入成本细节，因此投资者无法判断公司会获得类软件贡献利润率，还是落入需要更高固定成本吸收的服务加产能业务。公开可用的主要代理指标是方向性的：如果工厂利用率、重跑率和标准化不能快速改善，租约、设备、计算和专业人员组合可能会重压利润率。
