      - number: '8.4'
        title: 退出准备度、尽调问题和投资逻辑破裂触发点
        blocks:
          - type: paragraph
            body: >-
              从公开证据看，Lila
              还没有准备好退出。如果它成为横跨多个垂直领域的科学发现基础设施层，最终可能支撑一个非常大的结果，但这仍是战略雄心，不是已披露的运营画像。若要明确改变建议，需要看到合作伙伴兴趣转化为付费项目、实验室带来可衡量的生产率提升，并确认当前估值没有藏着会损害未来回报的优先权或稀释悬挂。


              因此，最重要的尽调工作很实际，而非哲学。投资人需要看到是否有客户在付费、这些项目可重复性如何、产出经济性长什么样，以及公司能否把技术主张打包成一组可供怀疑者承销的验证集。投资人还需要资本结构文件：股权结构表、优先股堆叠、期权池和治理权。没有这些，即便顶层估值判断正确，最终回报仍可能错。


              投资逻辑破裂触发点也很清楚。如果 12 到 18 个月过去仍没有客户披露，如果 Lila 仍拿不出可复现技术证据，或公开 AI
              药物可比公司再下一台阶，当前溢价就应压缩。反过来，披露付费合作伙伴、基准数据和更干净的条款，则足以快速重审建议。
