        - 已保留来源未公开具名客户、计价单位和合同结构
        - 商业就绪度比技术故事更不清晰
      - - Recursion / Exscientia
        - 未保留公开软件式价目表
        - 上市公司平台，加合作项目和里程碑经济
        - 规模化生物学、精准化学、自动化合成、转化和管线资产
