      - number: '2.3'
        title: 买家、用户、付款方和初始可服务市场
        blocks:
          - type: paragraph
            body: >-
              最清晰的商业买家群体是制药和生物技术研发。Mordor 称，制药和生物技术公司在 2025 年占实验室信息学支出的 53.14%；Thermo Fisher 的 2024 年收入结构显示，57%
              收入来自制药和生物技术客户。CRO 是下一个最相关的细分，因为它们明确出现在实验室自动化终端用户名单中，也是增长较快的信息学群体之一。学术和政府实验室对技术验证、方法开发和参考账户很重要——NIH 表示，其近
              US$48 billion 预算支持超过 2,500 家机构的近 50,000
              项竞争性资助——但该采购基础分散，通常不太可能支持完整工厂式企业合同。材料、化学和工业研发具有战略意义，因为自驱动实验室文献在这些领域最强，Thermo 和 Agilent
              也都强调先进材料和应用实验室工作流；但公开市场报告没有清晰拆分这些项目。在集成部署中，实际买家通常是平台研发、药物化学、筛选、自动化工程或实验室运营负责人；用户则是台架科学家、自动化工程师和计算科学家。付款方通常是中央研发预算负责人，他们能用吞吐量、周期压缩或可重复性来为自动化支出辩护，而不是只讲
              IT 现代化。
