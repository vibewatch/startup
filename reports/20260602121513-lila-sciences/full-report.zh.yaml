        - 客户带来科学问题，Lila 围绕该问题运行 AI 指导的实验项目
        - 按项目 / 里程碑
        - Sacra 称其为当前最清晰的商业模式；官方来源暗示有合作伙伴项目，但未披露合同
        - 潜在意义较大，但在可重复性得到证明前，经济属性更接近高价值服务
