  - id: TM001
    title: 市场定义表
    columns:
      - 细分市场 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 实验室自动化硬件和工作流系统
        - 发现实验室使用的机械臂、液体处理、工作站、筛选工作流和工作流软件
        - 常规诊断运营、广义医院自动化和通用制造机器人
        - 平台研发、筛选或实验室运营负责人；由中央 R&D 或实验室 capex/opex 预算支付
        - 构成 AI 科学工厂的物理执行层，也是规模最容易估算的相邻类别。
      - - 实验室信息化和数据骨干
        - LIMS、ELN、LES、云交付、审计轨迹、数据采集、工作流配置和互操作层
        - 通用企业数据湖、无关 ERP/CRM 系统和非实验室分析栈
        - 实验室信息化、质量或数字实验室负责人；由 R&D 软件和合规预算支付
        - 关键在于 Lila 需要结构化数据和编排，而不只是机器人。
      - - AI 药物发现软件和服务
        - 靶点识别、分子筛选、再利用、从头设计和临床前优先级排序工具
        - 临床试验软件、商业分析和无关医疗 AI
        - 发现信息化、转化科学或计算化学负责人；由发现项目预算支付
        - 是衡量客户是否愿意为模型驱动科学加速付费的最佳代理。
      - - 自主 / 自驱动实验室编排
        - 跨仪器和数据系统的闭环实验规划、执行、分析和再规划
        - 没有学习循环或编排层的单一用途仪器控制
        - 自动化工程或平台科学领导层；付款方通常是中央 R&D
        - 这是 Lila 最差异化的一层，也是公开报告中独立规模估算最少的一层。
      - - 材料和化学发现自动化
        - 电池、催化剂、聚合物、特种化学品和应用材料中的高循环实验项目
        - R&D 阶段之后的广义工业流程自动化、仅常规 QC 的支出
        - 先进材料、配方或应用研究负责人；由创新预算支付
        - 这是战略上重要的相邻领域，自驱动实验室文献在这里最强。
      - - 现状替代栈
        - 内部脚本、碎片化仪器、CRO 工作、人工实验设计和点状解决方案
        - N/A
        - 科学团队和实验室经理通过人员和供应商碎片化间接吸收支出
        - 这是实际替代目标；Lila 很少替代一个单一的庞大既有厂商。
    notes: 纳入支出要求存在重复实验循环，模型、数据和自动化执行被一起购买；排除支出位于该闭环发现工作流之外。
