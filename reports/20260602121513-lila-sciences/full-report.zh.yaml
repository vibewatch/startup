  - number: 4
    title: 财务情况
    sections:
      - number: '4.1'
        title: 收入模式、定价和商业准备度
        blocks:
          - type: paragraph
            body: >-
              公开证据显示，Lila 的货币化更可能是软件访问、科学项目收入和付费工厂产能的混合，而非纯 SaaS 供应商。官方材料称，新资本将用于把平台带给客户，并且首批商业伙伴正在被接入。Reuters 补充称，Lila
              计划出售面向企业的软件访问权，使客户使用其 AI 模型和自动化实验室；Sacra 则描述了一种以项目制发现项目为核心、未来叠加 lab-as-a-service
              或按使用量计费层的商业模式。对一家在生命科学、材料、能源和半导体领域运营机器人湿实验室的公司而言，这种组合在经济上说得通，但收入质量尚未得到证明。已审阅的官方或市场数据来源没有披露标价、标准合同条款、ACV、收入组合或已命名付费客户。结果是一条可信的商业化路径，但公开货币化披露很弱：投资者能看到
              Lila 想卖什么，却还看不到可用于承销经常性收入质量的条款、客户证据或可重复性。
