companyProfile:
  summary: >-
    Lila Sciences 是 Flagship Pioneering 孵化的创业公司，成立于 2023 年，并在 2025 年 3 月公开亮相，目标是打造其所谓的科学超级智能。其平台把 Lila
    Iris、科学软件、自动化实验、机器人和 AI Science Factories 组合起来，加速疗法、生物技术、化学和材料领域的发现。公开证据还显示，公司早期融资基础异常庞大：先有 $200M 种子轮，再有 $350M
    Series A，累计资本 $550M，并在 Cambridge 拿下重要实验室空间。公开记录同样缺失的内容也很关键：已命名付费客户、收入、利润率，以及科研产出主张能否在规模化下重复的独立验证。
