        - 压缩周期、优先排序实验具备经济价值
        - 要求证明 Lila 能减少迭代周期或提高候选物质量
      - - 云原生数据底座和合规现代化
        - 顺风因素
        - 当前
        - 拉动可支撑编排和模型训练的信息学层需求
        - 检查 Lila 如何接入既有 LIMS/ELN 和受监管数据环境
      - - AI 辅助靶点识别和设计
        - 顺风因素
        - 2026-2031
        - 快速增长的软件预算可能把需求拉向集成湿实验室执行
        - 衡量 Lila 是卖进既有 AI 发现预算，还是需要新增预算科目
      - - 遗留系统集成和异构仪器
        - 逆风因素
        - 当前
        - 推高真实实验室的实施成本，并拖慢见效时间
        - 梳理 Lila 哪些仪器和数据系统开箱即支持
      - - 前期投入高、ROI 不清
        - 逆风因素
        - 当前
        - 没有清晰回报时，小型实验室和部分工业项目可能推迟采用
        - 索取回本周期、利用率指标和部署人工要求
      - - 数据质量、安全和监管信任
