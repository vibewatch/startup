      - number: '6.3'
        title: Named customer proof
        blocks:
          - type: paragraph
            body: >-
              Stanford University, Physical Intelligence, Huawei or Huawei Cloud, Volkswagen, Samsung, ByteDance, Haier,
              and MIT appear across public profiles, with Stanford, Physical Intelligence, and Huawei also named in
              Galaxea AI's own release. Cross-source repetition raises confidence that these organizations have had some
              relationship with Galaxea AI, but it does not establish what each bought, whether use is paid, whether
              deployment is a pilot or production system, or what outcome was achieved. Physical Intelligence is the
              only organization identified as a notable customer by AI Market Watch, yet that source still supplies no
              deployment scope or commercial terms. The named account list is therefore useful as a reference-check
              starting point, not as a verified installed base.
