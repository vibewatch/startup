    title: Company Overview
    sections:
      - number: '1.1'
        title: Corporate Identity, Operating Footprint, and Strategic Mission
        blocks:
          - type: paragraph
            body: >-
              RobotToday describes Galaxea AI, also known as Galaxea Dynamics, as a robotics and embodied-AI company
              founded in September 2023 by researchers from Tsinghua and Stanford. RBTX characterizes the business as a
              full-stack developer that combines AI algorithms with self-designed robotic bodies, while Multiples
              describes a B2B product-sales model. The public location record is inconsistent rather than conclusive:
              Caplight and RobotToday identify Beijing, whereas Multiples and AI Market Watch identify Suzhou. The
              evidence therefore supports a China-based private robotics company with industrial and service ambitions,
              but not a single verified legal headquarters or a complete legal-entity map. Management should supply
              registrations for the operating, IP-owning, and manufacturing entities before location-dependent diligence
              proceeds.
