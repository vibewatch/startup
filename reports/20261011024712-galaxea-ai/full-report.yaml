  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Hardware Portfolio and Modular Robotics Architecture
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI structures its hardware portfolio around proprietary force-controlled manipulators, specialized
              end-effectors, and mobile humanoid bases designed for multi-environment deployment. The company's initial
              flagship manipulator, the A1 robot arm, provides six degrees of freedom (6-DoF) with integrated force
              control engineered for compliant environmental interaction and delicate object handling. In mobile
              manipulation scenarios, Galaxea mounts two A1 arms alongside its G1 tactile gripper onto a three-wheel
              vector chassis to form the R1 wheeled humanoid robot series. The R1 platform delivers an operational
              vertical reach of up to two meters and is segmented into R1, R1 Lite, and R1 Pro models that span list
              prices between $44,500 and $64,000. At the 2026 World Robot Conference (WRC), Galaxea expanded this
              hardware lineup by premiering Nexo, a wheeled dual-arm humanoid system featuring thirty degrees of
              freedom, a 20 kg dual-arm payload capacity, and eight hours of continuous battery runtime targeted at
              factory logistics and retail fulfillment. Complementing its wheeled fleet, the company develops the Kengo
              bipedal humanoid for dynamic locomotion and the Galaxea Lite-T teleoperation module for data collection.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
              - CE010
