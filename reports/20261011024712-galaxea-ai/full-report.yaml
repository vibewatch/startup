  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary, Taxonomy, and Status-Quo Substitutes
        blocks:
          - type: paragraph
            body: >-
              The addressable market for embodied artificial intelligence and robotics encompasses specialized physical
              hardware paired with multimodal foundation models capable of closed-loop perception, reasoning, and
              autonomous physical interaction. Within this landscape, Galaxea AI operates at the intersection of mobile
              humanoid robotics, force-controlled robotic arms, and foundation vision-language-action (VLA)
              architectures. Included market spend spans commercial capital expenditures for programmable robotic
              platforms, dexterous end-effectors, foundation model software subscriptions, and developer training kits
              across manufacturing, logistics, and research institutions. In contrast, standard industrial
              automation—characterized by fixed, single-purpose robotic arms requiring rigid perimeter guarding and
              deterministic programming—remains excluded from embodied AI budgets due to its lack of open-world
              generalization. Current enterprise workflows rely on status-quo substitutes including manual human labor
              in dark-store order fulfillment and assembly, automated guided vehicles (AGVs) restricted to fixed
              magnetic tape or 2D floor paths, and dedicated pick-and-place gantry systems that fail when handling
              variable-dimension deformable items or arbitrary SKU configurations.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
      - number: '2.2'
        title: Market Sizing Lenses, Growth Projections, and Valuation Benchmarks
        blocks:
          - type: paragraph
            body: >-
              Evaluating the commercial opportunity in embodied intelligence requires decomposing spending across
              multiple sizing layers rather than relying on a single top-down total addressable market figure. Long-term
              visionary market projections postulate an ultimate scale of billions of humanoid robots integrated across
              global industry and domestic households, backed by sovereign initiatives such as national artificial
              intelligence and robotics funds in China. In the medium term, industrial service robotics and warehouse
              automation form the serviceable addressable market as commercial operators deploy mobile dual-arm
              platforms for high-mix sorting, assembly, and fulfillment. The near-term serviceable obtainable market is
              constrained to academic research laboratories, corporate frontier AI research groups, and early commercial
              pilot sites willing to procure units priced between $44,500 and $64,000 for data collection, algorithm
              training, and teleoperation. However, near-term commercial revenue generation remains modest across
              early-stage market participants, creating significant tension against private venture capital valuations
              that reached $2.9B in private financing rounds.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM009
              - CM010
