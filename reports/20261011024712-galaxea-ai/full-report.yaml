      - number: '6.4'
        title: Durability, expansion, and concentration
        blocks:
          - type: paragraph
            body: >-
              The public record does not support a retention or durability conclusion. None of the retained sources
              discloses NRR, GRR, churn, renewals, contract length, customer cohorts, satisfaction, revenue
              concentration, or the share of accounts in production. The WRC demonstrations suggest a plausible
              land-and-expand path from evaluation hardware to task validation and then broader SKU or site coverage,
              but they do not show that customers have followed that path. External market-data pages also omit public
              growth metrics and EV-to-revenue data, reinforcing the absence of a measurable commercial adoption
              baseline rather than proving zero commercial activity. Investment diligence should therefore require
