        title: Capitalization History, Investor Base, and Valuation Divergence
        blocks:
          - type: paragraph
            body: >-
              Multiples itemizes four rounds totaling $315M: a $28M seed round in November 2024, $41M and $100M Series A
              rounds in February and July 2025, and a $146M Series B in February 2026. It places the February 2026
              post-money valuation at $1.4B and names Jinding Capital as lead. Caplight then reports a separate $290M
