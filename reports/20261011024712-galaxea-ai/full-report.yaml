      - number: '4.2'
        title: Commercial Traction and Customer Deployment Scale
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI reports enterprise engagements across more than 40 commercial, industrial, and academic
              customers, including major technology and automotive conglomerates such as Huawei Cloud, Volkswagen,
              Samsung, and ByteDance, as well as elite academic institutions including Stanford and MIT. Commercial
              traction remains concentrated in early-stage validation, algorithmic benchmarking, and physical simulation
              data acquisition rather than standardized mass production. At the 2026 World Robot Conference, the company
              showcased an autonomous closed-loop robotic dark-store fulfillment system, completing 900 full-cycle
              orders, 1,775 picks, and 1,560 packing cycles across tens of thousands of random retail inventory SKUs.
              While this operational throughput demonstrates technical stability in complex industrial sorting
              workflows, public conversion metrics from trial deployments to multi-unit recurring commercial contracts
              remain undisclosed by management.
            claimRefs:
              - CI005
              - CI006
              - CI010
      - number: '4.3'
        title: Capitalization and Equity Financing History
        blocks:
          - type: paragraph
            body: >-
              The company has demonstrated exceptional fundraising velocity, securing approximately $563 million in
              cumulative venture capital across five financing rounds since its founding in September 2023. In April
              2026, Galaxea AI closed a landmark Series B+ equity financing round of $290 million to $291 million, which
              elevated its post-money equity valuation to $2.9 billion. The investor syndicate features blue-chip
              institutional venture capital including Hillhouse Capital, Capital Today, IDG Capital, and Meituan Long-Z,
              expanded in the Series B+ round by strategic and state-backed investors such as Beijing Financial Street
              Capital, Puhua Capital, Guoyuan Equity, and Lens Technology. While this substantial liquidity cushion
              insulates the company against near-term macro headwinds, the forward cash runway must sustain heavy
              ongoing hardware tooling expenditures, compute cluster training, and global go-to-market overhead.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI012
      - number: '4.4'
        title: Unit Economics, Cost Structure, and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Evaluating Galaxea AI's financial durability reveals significant structural margin headwinds and severe
              disclosure deficits that impede institutional investment underwriting. In the humanoid hardware segment,
              high-precision force-controlled actuators, custom harmonic gear reducers, multi-modal sensor arrays, and
              onboard compute push estimated unit bill-of-materials costs to $40,000–$60,000. At list pricing of
              $44,500–$64,000, initial unit gross margins are thin or negative before accounting for warranty reserves
              and customer implementation support. Furthermore, 2024 revenue remained completely unrecorded, and the
              company has published no audited financial statements, historical income statements, or cash burn rates.
              Private market trading platforms report that EV/revenue multiples remain entirely uncalculable, making
              definitive valuation underwriting impossible without direct access to internal management accounts and
              audited financial records.
