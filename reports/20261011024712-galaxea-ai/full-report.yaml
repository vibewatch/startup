      - number: '3.3'
        title: Moat Durability, Switching Costs, and Commoditization Risks
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI's long-term competitive moat depends on the durability of its embodied foundation models and
              the defensibility of its software-hardware co-design. While the company envisions household humanoid
              robots performing cooking and cleaning within the next decade, near-term survival requires defending
              industrial pilot accounts against rapid hardware commoditization. Independent tracking by HumanoidMegaHub
              reflects cautious market sentiment, assigning Galaxea AI a subdued hype score of 1.2 out of 10 and
              momentum score of 0.2 out of 10, highlighting the risk that standardized hardware designs are quickly
              replicated by lower-cost Chinese competitors. Furthermore, Tesla Optimus commands structural scale
              advantages, utilizing vertically integrated chip manufacturing, massive simulation fleets, and proprietary
              Dojo supercomputing clusters to accelerate neural network training across thousands of captive factory
              tasks. Incumbent industrial automation vendors also benefit from high switching costs, established safety
              certifications, and deeply entrenched system integrator relationships. To construct a durable competitive
              moat, Galaxea AI must leverage its partnerships with hardware suppliers like Lens Technology and research
              collaborators like Physical Intelligence to achieve superior real-world task generalization, demonstrating
              that its full-stack software stack delivers measurable labor savings that cannot be matched by lower-cost
              commoditized hardware.
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
              - CP013
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP009
              - CP010
              - CP011
              - CP012
      - number: '3.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Hardware Price Compression and Incumbent Scale Asymmetry
            body: >-
              Galaxea AI operates in an intensely competitive Chinese robotics ecosystem where peers like Unitree
              aggressively compress hardware price points toward consumer thresholds, while global incumbents like Tesla
              command unmatched compute infrastructure and captive factory proving grounds. To defend its premium
              pricing, Galaxea AI must prove durable task generalization through its proprietary G0 model rather than
              relying on hardware differentiation alone.
            calloutType: risk
            claimRefs:
              - CP009
              - CP011
