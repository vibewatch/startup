          - type: paragraph
            body: >-
              The public product portfolio spans R1, R1 Lite, and R1 Pro mobile humanoids, A1 force-controlled arms, and
              G1 grippers. RobotToday and RobotsNowhere report R1 pricing of approximately $44,500-$64,000, while
