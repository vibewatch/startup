              Investment Club tear sheet independently reports a rounded $2.9B valuation but leaves the amount and
              participants blank. The later valuation therefore is not inherently inconsistent with the February mark,
              yet its round terms and cap-table effect remain unverified. Provider totals also conflict, because
              Robotico's sparse profile states approximately $400M raised.
