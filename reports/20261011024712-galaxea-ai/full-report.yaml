    title: Financials
    sections:
      - number: '4.1'
        title: Revenue Streams and Pricing Architecture
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI operates an embodied intelligence monetization strategy anchored on direct commercial sales of
              proprietary robotics hardware, supplemented by pilot software platforms and developer tooling. The primary
              revenue vehicle is the R1 humanoid robot platform, marketed between $44,500 and $64,000 per unit across
              Pro and Lite variants, alongside modular A1 six-degree-of-freedom robotic arms and G1 precision grippers.
              While list pricing establishes an identifiable revenue envelope, recognized revenue quality remains
              heavily transactional and capital intensive. Software and algorithmic infrastructure, including the Lemo
              developer platform and G0 foundation models, are currently packaged alongside physical units or licensed
              under non-commercial research frameworks rather than generating predictable recurring annual contract
              value. Long-term commercial expansion relies on transitioning early enterprise deployments into
              fleet-scale deployments and expanding into commercial fulfillment and logistics automation.
