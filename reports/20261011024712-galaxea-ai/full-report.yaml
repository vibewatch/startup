      - number: '6.2'
        title: Adoption trajectory and usage proof
        blocks:
          - type: paragraph
            body: >-
              Two current customer-count narratives coexist. Galaxea AI's August 2026 release says it serves nearly 100
              leading global clients, while a supplier listing reports more than 40 institutional and commercial
              clients; neither provides a definition, denominator, or reconciliation. The most concrete activity metrics
              are 900 full-cycle orders, 1,775 picks, 1,560 packing cycles, and 4,000 stable daily carton-folding cycles
              at the 2026 World Robot Conference. These figures demonstrate event throughput under staged conditions,
              not active accounts, deployed sites, paid utilization, repeat purchases, or customer outcomes. A reported
              intended deployment with JD.com is directionally relevant but remains weaker than a dated customer
              announcement or independently verified production record.
            claimRefs:
