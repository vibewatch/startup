      - "CV003"
      - "CV005"
      - "CV006"
  - calloutType: "risk"
    title: "Downside Exposure: Severe Multiple Compression Risk"
    body: "Trading at an implied multiple exceeding 290x hypothetical 2025 sales creates acute vulnerability to multiple compression. Public robotics peers such as UBtech trade between 9.4x and 15.1x sales. Any delay in enterprise deployment or failure to demonstrate hardware gross margins above 30% could trigger a 50% to 80% down-round reset in subsequent financing."
    claimRefs:
