callouts:
  - calloutType: risk
    title: "Discrepancy Between Stretched Private Valuations and Commercial Delivery Scale"
    body: "Private market capitalizations valuing Galaxea AI at approximately $2.9B in 2026 rely heavily on future market penetration and sovereign technology leadership rather than current commercial cash flows. With hardware unit list pricing of $44,500 to $64,000 and target delivery goals of up to 1,000 units by year-end, the company's run-rate revenue remains in early commercial pilot territory, underscoring substantial valuation risk."
    claimRefs:
      - CM006
      - CM007
      - CM009
      - CM010
  - calloutType: insight
    title: "Data Supply Chain and Domestic Manufacturing as Core Structural Drivers"
    body: "Galaxea AI's executive leadership argues that China's integrated hardware supply chain and dense real-world data collection infrastructure could allow domestic embodied foundation models to surpass Western competitors within three years. This dynamic positions industrial factory floors and dark-store fulfillment centers as critical data-harvesting testbeds for scaling foundation VLA models."
    claimRefs:
      - CM001
      - CM004
      - CM008
      - CM011
