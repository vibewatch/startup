figures:
- id: FE001
  title: Galaxea Full-Stack Embodied Intelligence Architecture
  type: stack
  summary: Six-layer modular architecture bridging physical mechatronics, edge motor control, VLA foundation models, and application deployment workflows.
  claimRefs:
  - CE008
  - CE009
  - CE012
  approximationNotes: Architectural layering reflects the 1+3+N strategy and published technical disclosures; internal bus latency and exact neural model parameter counts are undisclosed.
  data:
    layers:
    - label: Application & Workflow Layer
      detail: Specialized task execution frameworks for retail dark stores, robot-on-robot manufacturing assembly, carton folding, and laboratory research.
      modules:
      - Closed-Loop Dark-Store Engine
      - Robot-on-Robot Assembly System
      - Resilient Carton Folding
      - Academic Teleoperation Suite
      outputs:
      - Autonomous Task Completion
      - Telemetry Logs
      - Cycle Time Metrics
    - label: Simulation & Developer Tooling Layer (Lemo)
      detail: Developer platform providing simulation environments, teleoperation interfaces (Galaxea Lite-T), skill authoring, and robot telepresence tooling.
      modules:
      - Lemo Developer Studio
      - Lite-T Teleoperation Driver
      - Physics Simulation Bridge
      - Skill Demonstration Library
      outputs:
      - Trajectory Datasets
      - Trained Skill Checkpoints
      - ROS Nodes
    - label: Embodied Foundation Model Layer (Galaxea Model)
      detail: Multimodal foundation models incorporating Vision-Language-Action (VLA) architectures and G0 Plus representations for high-level semantic reasoning.
      modules:
      - Multimodal Scene Parser
      - VLA Transformer Backbone
      - Natural Language Prompt Decoder
      - Action Chunking Generator
      outputs:
      - Spatial Action Targets
      - Affordance Maps
      - Semantic Task Plans
    - label: Policy Execution & Trajectory Generation Layer
      detail: Diffusion policies and reinforcement learning models generating high-frequency motor commands with real-time collision avoidance and dynamic recovery.
      modules:
      - Diffusion Policy Network
      - RL Dynamic Controller
      - Force-Feedback Impedance Loop
      - Perturbation Recovery Engine
      outputs:
      - Joint Torque Commands
      - Cartesian Trajectories
      - End-Effector Wrench Targets
    - label: Edge Compute & Embedded Systems Layer
      detail: Onboard neural processing units, real-time operating kernel, low-latency CAN/EtherCAT fieldbus networks, and power distribution subsystems.
      modules:
      - Edge AI Accelerator (NPU)
      - RTOS Kernel & Safety Monitor
      - EtherCAT Motor Bus
      - BMS 8-Hour Power Controller
      outputs:
      - Real-Time Joint Setpoints
      - Diagnostic Status Frames
      - Safety Heartbeats
    - label: Physical Mechatronics & Actuation Layer (Galaxea Dynamics)
      detail: In-house mechanical hardware including 6-DoF A1 arms, G1 grippers, 30-DoF Nexo dual-arm chassis, Kengo bipedal legs, and sensor arrays.
      modules:
      - A1 Lightweight 6-DoF Arm
      - G1 Tactile Gripper
      - 3-Wheel Vector Mobile Base
      - Torque Sensors & Depth Cameras
      outputs:
      - Physical Object Manipulation
      - Locomotion
      - Tactile Sensor Feedback
