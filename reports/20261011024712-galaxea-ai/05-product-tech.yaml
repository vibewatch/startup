  name: Galaxea AI
chapter:
  number: 5
  title: Product & Technology
  summary: Galaxea AI operates a full-stack embodied intelligence model combining proprietary force-controlled hardware (A1 arm, G1 gripper, R1 and Nexo mobile manipulators) with vision-language-action foundation models, though commercial monetization remains constrained by research licensing terms and unverified dark-store volume.
sections:
- id: hardware-portfolio
  title: Hardware Portfolio and Modular Robotics Architecture
  body: Galaxea AI structures its hardware portfolio around proprietary force-controlled manipulators, specialized end-effectors, and mobile humanoid bases designed for multi-environment deployment. The company's initial flagship manipulator, the A1 robot arm, provides six degrees of freedom (6-DoF) with integrated force control engineered for compliant environmental interaction and delicate object handling. In mobile manipulation scenarios, Galaxea mounts two A1 arms alongside its G1 tactile gripper onto a three-wheel vector chassis to form the R1 wheeled humanoid robot series. The R1 platform delivers an operational vertical reach of up to two meters and is segmented into R1, R1 Lite, and R1 Pro models that span list prices between $44,500 and $64,000. At the 2026 World Robot Conference (WRC), Galaxea expanded this hardware lineup by premiering Nexo, a wheeled dual-arm humanoid system featuring thirty degrees of freedom, a 20 kg dual-arm payload capacity, and eight hours of continuous
    battery runtime targeted at factory logistics and retail fulfillment. Complementing its wheeled fleet, the company develops the Kengo bipedal humanoid for dynamic locomotion and the Galaxea Lite-T teleoperation module for data collection.
  claimRefs:
  - CE001
  - CE002
  - CE003
  - CE004
  - CE010
  tableRefs:
  - TE001
- id: embodied-ai-software-stack
  title: Embodied AI Foundation Models and Software Stack
  body: Galaxea AI couples its mechanical actuation systems with an end-to-end embodied artificial intelligence software architecture driven by its '1+3+N' corporate strategy. This operational principle pairs Galaxea Dynamics hardware manufacturing with Galaxea Model foundation intelligence across three core robotic product lines and broad industrial deployments. At the algorithmic core, the software stack integrates Vision-Language-Action (VLA) foundation models with high-frequency diffusion policies and reinforcement learning controllers, enabling robots to parse natural-language instructions and generate closed-loop physical actions without per-task manual recalibration. The foundation model ingests multimodal sensory streams—including stereo depth feeds, joint torque telemetry, and tactile sensor readings—to predict spatial affordance distributions and chunked trajectory setpoints. Downstream diffusion networks map these coarse plans into joint-level impedance trajectories that continuously
    adapt to obstacle disruptions and dynamic object movements.
  claimRefs:
  - CE008
  - CE009
  - CE012
  figureRefs:
  - FE001
- id: industrial-deployment-workflows
  title: Industrial Deployment Workflows and Demonstration Traction
  body: To transition embodied intelligence from controlled research laboratories into commercial production environments, Galaxea AI has highlighted several closed-loop application workflows. At WRC 2026, the company exhibited a fully automated dark-store fulfillment installation processing real-time mini-program retail orders. Operating without task-specific reprogramming, the system successfully managed tens of thousands of stock-keeping units, arbitrary item placements, and deformable-bag grasping challenges, completing 900 full-cycle orders, 1,775 discrete picks, and 1,560 packing cycles under live public exhibition conditions. In precision manufacturing domains, Galaxea demonstrated a dual-arm robot-on-robot assembly workflow that achieved over a 30% speed improvement compared to conventional manual teaching methods for long-cycle industrial fabrication. Additionally, the company validated high-repetition industrial packaging stability through resilient carton-folding demonstrations
    that sustained 4,000 consecutive daily cycles despite intentional positional perturbations, supporting commercial pilot engagements with partners including Huawei, Physical Intelligence, and Stanford University.
  claimRefs:
  - CE005
  - CE006
  - CE007
  - CE011
  tableRefs:
  - TE002
- id: technical-risks-and-dependencies
  title: Operating Dependencies, Supply Chain, and Commercial Execution Risks
  body: While Galaxea AI demonstrates impressive manipulation dexterity and high-profile exhibition throughput, the company faces substantial operational and commercialization hurdles. From a supply chain perspective, the production of precision robotic manipulators requires specialized harmonic reducers, frameless torque motors, and high-bandwidth edge compute modules, exposing the business to potential hardware bill-of-materials inflation where estimated production costs ($40,000–$80,000) rival published list prices ($44,500–$64,000). On the software and IP front, Galaxea's open-weights G0 Plus foundation model family operates under non-commercial research licensing terms, restricting downstream enterprise clients from direct commercial derivative deployment without bespoke proprietary licensing agreements. Furthermore, third-party evaluations must distinguish trade-show exhibition cycle counts from continuous multi-shift production reliability, as audited mean-time-between-failures (MTBF)
    and environmental sensor degradation data remain undisclosed private metrics.
  claimRefs:
  - CE003
  - CE013
  - CE014
  tableRefs:
  - TE003
