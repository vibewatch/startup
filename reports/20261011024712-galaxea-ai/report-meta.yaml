companyProfile:
  summary: >-
    Galaxea AI is a privately held embodied-intelligence robotics company founded in September 2023 by researchers from
    Tsinghua and Stanford. It sells a full-stack mix of humanoid robots, robotic arms, grippers, and VLA
    foundation-model tooling to research, industrial, and early enterprise customers, with the most recent public
    financing pointing to a Series B+ structure and a roughly $2.9B private valuation. The evidence base supports strong
    technical momentum and broad logo traction, but not audited revenue, a reconciled customer count, or a fully
    verified operating footprint.
  foundedDate: '2023-09-01'
