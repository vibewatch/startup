company:
  name: "Galaxea AI"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Galaxea AI is a privately held embodied-intelligence robotics company founded in September 2023 by researchers from Tsinghua and Stanford. Public databases report a $146M Series B at a $1.4B valuation in February 2026 and a subsequent $290M Series B extension at an estimated $2.91B post-money valuation in April 2026, but the assigned evidence does not provide an audited cap table, revenue, cash balance, or current headcount."
sections:
  - id: "corporate-identity-and-mission"
    title: "Corporate Identity, Operating Footprint, and Strategic Mission"
    body: "RobotToday describes Galaxea AI, also known as Galaxea Dynamics, as a robotics and embodied-AI company founded in September 2023 by researchers from Tsinghua and Stanford. RBTX characterizes the business as a full-stack developer that combines AI algorithms with self-designed robotic bodies, while Multiples describes a B2B product-sales model. The public location record is inconsistent rather than conclusive: Caplight and RobotToday identify Beijing, whereas Multiples and AI Market Watch identify Suzhou. The evidence therefore supports a China-based private robotics company with industrial and service ambitions, but not a single verified legal headquarters or a complete legal-entity map. Management should supply registrations for the operating, IP-owning, and manufacturing entities before location-dependent diligence proceeds."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO005"
      - "CO015"
    tableRefs:
      - "TO001"
  - id: "founders-and-leadership"
    title: "Founding Leadership, Technical Governance, and Key-Person Exposure"
    body: "The assigned sources establish an academic and autonomous-driving pedigree but do not provide a complete current organization chart. AI Market Watch profiles Jiyang Gao as holding a USC doctorate in computer vision and having worked at Waymo and Momenta; it does not establish his current executive title. RobotsNowhere identifies Xu Huazhe as a co-founder and co-chief science officer, a Stanford-trained engineer, and a Tsinghua robotics professor. The same article relays the company's claim that it was the only Chinese startup led simultaneously by two AI professors. Those credentials support founder-market fit in perception and manipulation, but the available pool does not identify board members, independent directors, succession coverage, or delegated commercial leadership. Governance and key-person exposure therefore remain diligence questions, not verified conclusions."
    claimRefs:
      - "CO004"
      - "CO006"
      - "CO007"
    tableRefs:
      - "TO002"
  - id: "capitalization-and-valuation"
    title: "Capitalization History, Investor Base, and Valuation Divergence"
    body: "Multiples itemizes four rounds totaling $315M: a $28M seed round in November 2024, $41M and $100M Series A rounds in February and July 2025, and a $146M Series B in February 2026. It places the February 2026 post-money valuation at $1.4B and names Jinding Capital as lead. Caplight then reports a separate $290M Series B extension on April 2, 2026 at a $2.91B post-money valuation; an April 2026 Silicon Valley Investment Club tear sheet independently reports a rounded $2.9B valuation but leaves the amount and participants blank. The later valuation therefore is not inherently inconsistent with the February mark, yet its round terms and cap-table effect remain unverified. Provider totals also conflict, because Robotico's sparse profile states approximately $400M raised."
    claimRefs:
      - "CO008"
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO014"
    tableRefs:
      - "TO003"
    figureRefs:
      - "FO001"
  - id: "commercial-scale-and-ecosystem"
    title: "Product Portfolio, Commercial Scale, and Production Delivery Validation"
    body: "The public product portfolio spans R1, R1 Lite, and R1 Pro mobile humanoids, A1 force-controlled arms, and G1 grippers. RobotToday and RobotsNowhere report R1 pricing of approximately $44,500-$64,000, while Multiples dates the G0 and G0 Plus model releases to August 2025 and January 2026. RobotToday and RobotsNowhere also report more than 40 institutional and commercial clients, including Huawei Cloud, Volkswagen, Haier, Samsung, ByteDance, Physical Intelligence, Stanford, and MIT. That is evidence of trial and research reach, not verified recurring revenue or production acceptance. RobotsNowhere reported a target of up to 1,000 units by the end of 2025; the assigned evidence does not disclose achieved shipments, current paying-customer count, audited revenue, or current workforce."
    claimRefs:
      - "CO012"
      - "CO013"
      - "CO016"
