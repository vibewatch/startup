callouts:
  - calloutType: "risk"
    title: "Financing Progression Is Not a Verified Cap Table"
    body: "Multiples reports a $1.4B post-money valuation in February 2026, while Caplight reports a later $290M extension at $2.91B and an April tear sheet rounds the valuation to $2.9B. The sequence is plausible, but none of the assigned sources supplies subscription documents, fully diluted share counts, preferences, secondary components, or cash remaining; those omissions prevent valuation and dilution verification."
    claimRefs:
      - "CO009"
      - "CO011"
  - calloutType: "insight"
    title: "Academic Pedigree Precedes Delivery Proof"
    body: "The founding record combines Tsinghua and Stanford researchers with Jiyang Gao's reported Waymo and Momenta experience, while the product record spans mobile humanoids, force-controlled arms, and grippers. More than 40 reported clients and a historical 1,000-unit target show reach and ambition, but the sources do not separate paid production deployments from research users or report achieved shipments."
    claimRefs:
      - "CO004"
      - "CO006"
      - "CO012"
      - "CO013"
      - "CO016"
