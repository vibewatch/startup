callouts:
  - calloutType: risk
    title: Hardware Price Compression and Incumbent Scale Asymmetry
    body: Galaxea AI operates in an intensely competitive Chinese robotics ecosystem where peers like Unitree aggressively compress hardware price points toward consumer thresholds, while global incumbents like Tesla command unmatched compute infrastructure and captive factory proving grounds. To defend its premium pricing, Galaxea AI must prove durable task generalization through its proprietary G0 model rather than relying on hardware differentiation alone.
