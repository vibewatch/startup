  - id: TP003
    title: Pricing / Packaging Comparison
    columns:
      - Competitor / Platform
      - Price / Unit Model
      - Included Capabilities
      - Discounts or Unknowns
      - Strategic Diligence Implication
    rows:
      - - Galaxea AI (R1 Series)
        - $44,500–$64,000 hardware purchase
        - Wheeled humanoid base, dual A1 6-DoF arms, G1 grippers, G0 VLA software
        - Commercial software licensing fees and volume discounts undisclosed
        - Pricing sits above commoditized research arms but below heavy industrial manipulators
      - - Unitree Robotics (Humanoid Line)
        - ~$16,000–$90,000 direct sale
        - Bipedal hardware chassis, basic SDK, open developer interfaces
        - Maintenance SLAs, enterprise support contracts unknown
        - Aggressive price floor pressures Galaxea's margins unless software moat commands a premium
      - - AgiBot / Direct Chinese Peers
        - Undisclosed (~$30,000–$50,000 estimated)
        - Wheeled and bipedal embodied platforms for industrial pilot lines
        - Enterprise deployment and customization service fees undisclosed
        - Intensifies competition for domestic Chinese factory pilot budgets and government grants
      - - Status Quo / Traditional Industrial Arms
        - $25,000–$80,000 + integration costs
        - High-precision caged arms (e.g. Fanuc, KUKA, Universal Robots)
        - Integration typically adds 2–3x hardware cost
        - Incumbents offer proven 99.9% reliability; high switching cost for enterprise buyers
    notes: Pricing reflects published list prices and reported estimates as of 2025-2026; enterprise volume discounts, ongoing maintenance contracts, and commercial software licensing terms remain private and undisclosed.
