callouts:
  - calloutType: risk
    title: "Severe Disclosure Deficit Prevents Valuation Diligence"
    body: "Despite commanding a $2.9 billion post-money valuation after its April 2026 Series B+, Galaxea AI provides zero public disclosure regarding audited revenue, gross profit, cash burn, or backlog. Secondary market and private transaction data confirm that EV/revenue multiples remain entirely uncalculable, leaving underwriting dependent on speculative future adoption rather than verified financial performance."
    claimRefs:
      - CI004
      - CI008
      - CI009
      - CI014
  - calloutType: insight
    title: "Hardware BOM Economics Threaten Early Cash Flow"
    body: "With R1 humanoid pricing set between $44,500 and $64,000, estimated hardware component costs ($40,000–$60,000 for precision force-controlled actuators, sensors, and onboard compute) result in thin to negative initial gross margins. Until high-volume manufacturing economies of scale are achieved or software monetization ramps, unit shipments are likely to consume operating cash rather than generate self-sustaining gross profit."
    claimRefs:
      - CI001
      - CI011
      - CI013
