evidenceGaps:
  - type: conflicting-data
    severity: material
    topic: financing-reconciliation
    missingEvidence: >-
      Primary subscription documents and a fully diluted cap table reconciling the $146M February Series B, the reported
      $290M April extension, and provider totals of $315M versus approximately $400M.
    whyItMatters: >-
      The February and April valuations may represent a valid sequence, but round composition, dilution, secondary
      sales, preferences, debt, and cash proceeds cannot be verified from provider summaries.
    diligencePath: >-
      Obtain the shareholder register, Series B and extension subscription agreements, funds-flow schedules, debt
      schedule, and articles of association from management.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: financial-performance
    missingEvidence: >-
      Audited financial statements for 2024–2026 including recognized hardware sales revenue, any recurring software
      revenue, gross margin, operating cash burn, and unrestricted cash.
    whyItMatters: >-
      Without financial disclosures, valuation multiples cannot be anchored to fundamental unit economics or commercial
      run rates.
    diligencePath: Request confidential information memorandum (CIM) and audited financial pack under non-disclosure agreement.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: governance-board
    missingEvidence: Full enumeration of executives, directors, observer seats, committees, and current investor ownership.
    whyItMatters: >-
      Determines voting control, shareholder protections, and governance maturity as the company plans potential public
      listing.
    diligencePath: Review commercial registration filings and corporate charter documents with company counsel.
    relatedQuestionRefs:
      - QO002
      - QO007
    relatedTableRefs:
      - TO002
      - TO003
  - type: missing-source
    severity: material
    topic: delivery-audit
    missingEvidence: >-
      Customer acceptance records or shipping manifests establishing actual deliveries against the historical 1,000-unit
      target and distinguishing paid production units from research systems.
    whyItMatters: >-
      Differentiates genuine industrial deployment and volume commercialization from prototype field testing and
      academic pilot loans.
    diligencePath: Conduct customer reference calls with named industrial clients such as Volkswagen, Haier, and ByteDance.
    relatedQuestionRefs:
      - QO005
      - QO007
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: commercial-revenue
    missingEvidence: Audited commercial revenue figures, annualized contract values, and hardware delivery counts for 2025–2026.
    whyItMatters: >-
      Without verified commercial revenue, the market sizing and $2.9B private valuation cannot be anchored to financial
      fundamentals.
    diligencePath: Review audited income statements, customer sales contracts, and confirmed unit shipment manifests.
    relatedQuestionRefs:
      - QM002
      - QM007
    relatedTableRefs:
      - TM002
  - type: missing-source
    severity: material
    topic: customer-contract-structure
    missingEvidence: >-
      Details on whether customer relationships (e.g. Huawei, Volkswagen) are recurring production deployments or
      one-off evaluation pilot units.
    whyItMatters: >-
      Determines whether enterprise buyer demand represents durable annual recurring revenue or transient experimental
      budgets.
    diligencePath: Obtain customer reference call records, master service agreements, and statements of work.
    relatedQuestionRefs:
      - QM003
      - QM006
    relatedTableRefs:
      - TM003
  - type: missing-source
    severity: material
    topic: commercial-traction
    missingEvidence: >-
      Audited commercial delivery numbers, revenue run-rate, and customer deployment contracts for Galaxea AI and
      private peers like AgiBot and Robot Era.
    whyItMatters: >-
      Without verified commercial revenue or customer contract data, market share claims and competitive differentiation
      rely on pilot demos and list prices rather than commercial win rates.
    diligencePath: >-
      Review commercial customer contracts, delivery receipts, and verified customer testimonials across factory and
