  - id: FE001
    title: Galaxea 全栈具身智能架构
    type: stack
    summary: 六层模块化架构，连接物理机电系统、边缘电机控制、VLA 基础模型与应用部署流程。
    claimRefs:
      - CE008
      - CE009
      - CE012
    approximationNotes: 架构分层体现 1+3+N 战略及已发布的技术披露；内部总线延迟和神经模型确切参数量未披露。
    data:
      layers:
        - label: 应用与工作流层
          detail: 面向零售暗仓、机器人对机器人制造组装、纸箱折叠及实验室研究的专用任务执行框架。
          modules:
            - 闭环暗仓引擎
            - 机器人对机器人组装系统
            - 高韧性纸箱折叠
            - 学术远程操作套件
          outputs:
            - 自主完成任务
            - 遥测日志
            - 周期时间指标
        - label: 仿真与开发者工具层（Lemo）
          detail: 提供仿真环境、远程操作接口（Galaxea Lite-T）、技能编写及机器人远程呈现工具的开发者平台。
          modules:
            - Lemo 开发者工作室
            - Lite-T 远程操作驱动
            - 物理仿真桥
            - 技能示范库
          outputs:
            - 轨迹数据集
            - 训练好的技能检查点
            - ROS 节点
        - label: 具身基础模型层（Galaxea Model）
          detail: 融合视觉-语言-动作（VLA）架构与 G0 Plus 表征的多模态基础模型，用于高层语义推理。
          modules:
            - 多模态场景解析器
            - VLA Transformer 主干
            - 自然语言提示解码器
            - 动作分块生成器
          outputs:
            - 空间动作目标
            - 可供性图
            - 语义任务计划
        - label: 策略执行与轨迹生成层
          detail: 生成高频电机指令的扩散策略与强化学习模型，支持实时避碰和动态恢复。
          modules:
            - 扩散策略网络
            - RL 动态控制器
            - 力反馈阻抗回路
            - 扰动恢复引擎
          outputs:
            - 关节扭矩指令
            - 笛卡尔轨迹
            - 末端执行器力旋量目标
        - label: 边缘计算与嵌入式系统层
          detail: 机载神经处理单元、实时操作内核、低延迟 CAN/EtherCAT 现场总线网络及电源分配子系统。
          modules:
            - 边缘 AI 加速器（NPU）
            - RTOS 内核与安全监控器
            - EtherCAT 电机总线
            - BMS 8 小时电源控制器
          outputs:
            - 实时关节设定值
            - 诊断状态帧
            - 安全心跳
        - label: 物理机电与驱动层（Galaxea Dynamics）
          detail: 自研机械硬件，包括 6 自由度 A1 机械臂、G1 夹爪、30 自由度 Nexo 双臂底盘、Kengo 双足腿及传感器阵列。
          modules:
            - A1 轻量 6 自由度机械臂
            - G1 触觉夹爪
            - 三轮 Vector 移动底座
            - 扭矩传感器与深度摄像头
          outputs:
            - 物理对象操作
            - 移动
            - 触觉传感器反馈
  - id: FU001
    title: 经证据限定的客户采用路径
    type: journey-map
    summary: 公开证据在目标定位、客户点名和事件验证上最充分；到了生产、扩张和续约环节，证据强度逐步下降。
    data:
      nodes:
        - label: 目标细分市场
          detail: 公开描述的细分市场包括研究、开发者、制造、汽车、物流、教育、农业、医疗及家庭。
          touchpoints:
            - Market profiles
            - Supplier directories
        - label: 产品评估
          detail: 机械臂、人形机器人及面向开发者的产品提供多个切入点，但未披露评估客户数量。
          touchpoints:
            - Hardware purchase
            - Developer experimentation
        - label: 公开任务验证
          detail: WRC 演示在预设条件下报告了订单、拣选、包装周期及纸箱折叠周期。
          touchpoints:
            - Conference demonstrations
            - Task perturbations
        - label: 生产部署
          detail: 有报道称计划在 JD.com 部署，但没有客户撰写的上线确认、站点数量、利用率或 SLA 信息。
          touchpoints:
            - Pilot-to-production diligence
            - Customer reference call
        - label: 账户扩张
          detail: SKU、工作流或站点覆盖范围可能扩大，但尚未披露客户群扩张、重复下单或追加销售指标。
          touchpoints:
            - Additional workflows
            - Additional sites
        - label: 续约与持续性
          detail: NRR、GRR、流失率、续约、合同期限、满意度和客户集中度仍缺乏公开证据。
          touchpoints:
