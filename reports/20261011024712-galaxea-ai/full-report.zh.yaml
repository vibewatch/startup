        title: 产品组合、商业规模与生产交付验证
        blocks:
          - type: paragraph
            body: >-
              公开产品组合包括 R1、R1 Lite、R1 Pro 轮式人形机器人、A1 力控机械臂和 G1 夹爪。RobotToday 和 RobotsNowhere 报道 R1 定价约为
              $44,500-$64,000；Multiples 将 G0 和 G0 Plus 的发布时间分别列为 2025 年 8 月和 2026 年 1 月。RobotToday 和 RobotsNowhere
              还称公司拥有 40 多家机构及商业客户，包括 Huawei Cloud、Volkswagen、Haier、Samsung、ByteDance、Physical Intelligence、Stanford 和
