  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、分类与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              具身人工智能和机器人可服务市场包括专用物理硬件与多模态基础模型的组合，模型能够完成闭环感知、推理和自主物理交互。Galaxea AI
              位于轮式人形机器人、力控机械臂和基础视觉—语言—动作（VLA）架构的交叉地带。纳入的市场支出包括面向制造、物流和研究机构的可编程机器人平台、灵巧末端执行器、基础模型软件订阅及开发者训练套件等商业资本开支。相比之下，标准工业自动化依赖固定用途的机械臂、刚性周界防护和确定性编程，缺乏开放世界泛化能力，因此不计入具身
              AI 预算。当前企业工作流的现状替代方案包括暗店订单履约和装配中的人工劳动、受限于固定磁带或二维地面路径的自动导引车（AGV），以及在处理尺寸多变的柔性物品或任意 SKU 配置时容易失效的专用抓取—放置龙门系统。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM008
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
