      - number: '1.3'
        title: 资本化历史、投资者基础与估值分歧
        blocks:
          - type: paragraph
            body: >-
              Multiples 列出四轮融资、合计 $315M：2024 年 11 月 $28M 种子轮，2025 年 2 月和 7 月分别为 $41M 和 $100M 的两轮 A 轮，以及 2026 年 2 月 $146M
              的 B 轮。该来源将 2026 年 2 月投后估值定为 $1.4B，并称 Jinding Capital 领投。随后 Caplight 报道，2026 年 4 月 2 日完成另一笔 $290M 的 B
              轮扩展，投后估值为 $2.91B；2026 年 4 月 Silicon Valley Investment Club 的资料页独立报告了四舍五入后的 $2.9B
              估值，但融资额和参与者留空。因此，后一个估值并不必然与 2 月的估值冲突，但轮次条款及其对股权表的影响仍未验证。不同供应商的总额也冲突：Robotico 的简略档案称累计融资约 $400M。
