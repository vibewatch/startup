  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 具身 AI 格局：直接同业、现有厂商与替代方案
        blocks:
          - type: paragraph
            body: >-
              具身智能和人形机器人竞争正分化为大众硬件制造商与全栈具身 AI 平台开发商。Galaxea AI
              将自己定位为全栈机器人架构供应商，把自有机器人硬件与视觉—语言—动作基础模型配对。在中国本土市场，机器学习嵌入相似度将 Robot Era、AgiBot（Zhiyuan Robotics）和 AI²
              Robotics 识别为最接近的架构对手，它们都在推进双臂和双足具身系统。与此同时，全球科技巨头划定工业自动化和规模化生产的竞争边界：Tesla 的 Optimus 依托庞大的自有汽车工厂产线，Unitree
              Robotics 则通过全球电商渠道专注于高销量、低成本的四足和双足硬件。现有企业厂商 UBTech Robotics 已有企业部署和市政合同，但历史经营亏损显著。Galaxea AI
              凭借大学背景创始人和战略联盟展现出技术深度，包括与 AgiBot 共同投资仿真框架开发商 Current Robotics；但由于缺少经审计的商业市场份额数据，其相对竞争地位仍主要由风险资本化和公开试点演示定义。
            claimRefs:
              - CP004
              - CP005
              - CP007
              - CP008
              - CP013
