        title: 创始领导层、技术治理与关键人物风险
        blocks:
          - type: paragraph
            body: >-
              指定来源证明了公司的学术和自动驾驶背景，但没有提供完整的现任组织架构。AI Market Watch 介绍 Jiyang Gao 拥有 USC 计算机视觉博士学位，曾在 Waymo 和 Momenta
              工作，但未确认其当前高管职务。RobotsNowhere 指出 Xu Huazhe 是联合创始人兼联合首席科学官、Stanford 培养的工程师和清华机器人学教授。同一文章转述公司称其是唯一一家同时由两名 AI
              教授领导的中国初创公司。这些履历支持其在感知和操控领域的创始人—市场匹配，但现有资料未识别董事会成员、独立董事、继任安排或受授权的商业负责人。因此，治理和关键人物风险仍是尽调问题，而非已验证结论。
