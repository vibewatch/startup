              - CR011
      - number: '7.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 双重监管与泛化瓶颈威胁规模化
            body: Galaxea AI 面临不对称风险：公开市场准入受 CSRC 审查趋严和香港上市不确定性限制，实体部署又受困难基准上 48.0% 的泛化成功率以及缺少经验证工业安全认证所阻碍。
            calloutType: risk
