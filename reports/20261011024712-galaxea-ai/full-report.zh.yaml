        title: 展示材料
        blocks:
          - type: callout
            title: 膨胀的私募估值与商业交付规模不匹配
            body: >-
              2026 年约 $2.9B 的 Galaxea AI 私募估值，主要依赖未来市场渗透率和主权技术领导地位，而非当前商业现金流。硬件单台标价 $44,500 至 $64,000，年末最多 1,000
              台的目标交付量，意味着公司收入运行率仍处于早期商业试点阶段，也凸显估值风险。
            calloutType: risk
            claimRefs:
              - CM006
              - CM007
              - CM009
              - CM010
          - type: callout
            title: 数据供应链与本土制造是核心结构性驱动
            body: >-
              Galaxea AI 管理层认为，中国一体化硬件供应链和密集的真实世界数据采集基础设施，可能让本土具身基础模型在三年内超过西方竞争者。这一动力使工业工厂和暗店履约中心成为扩展基础 VLA
              模型的关键数据采集试验场。
            calloutType: insight
            claimRefs:
