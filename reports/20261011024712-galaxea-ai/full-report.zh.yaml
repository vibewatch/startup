      - number: '3.3'
        title: 护城河持久性、转换成本与商品化风险
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI
              的长期竞争护城河取决于具身基础模型的持久性以及软硬件协同设计的可防御性。公司设想未来十年内让家庭人形机器人做饭和清洁，但短期生存仍要求其在硬件快速商品化的情况下守住工业试点客户。HumanoidMegaHub
              的独立跟踪反映了谨慎的市场情绪：Galaxea AI 热度评分仅 1.2 / 10，动量评分为 0.2 / 10，说明标准化硬件可能迅速被成本更低的中国竞争者复制。Tesla Optimus
              还拥有结构性规模优势，利用垂直整合的芯片制造、庞大的仿真集群和自有 Dojo
              超算集群，加速数千项自有工厂任务的神经网络训练。现有工业自动化供应商也受益于高转换成本、成熟安全认证和根深蒂固的系统集成商关系。要建立持久护城河，Galaxea AI 必须借助 Lens Technology
              等硬件供应商和 Physical Intelligence 等研究伙伴，取得更强的真实世界任务泛化能力，证明全栈软件能带来低成本商品化硬件无法匹敌的可量化节省。
