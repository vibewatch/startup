      - number: '7.2'
        title: 运营、泛化与安全瓶颈
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI 虽然报告了受控研究环境中的出色基准分数，但底层技术栈一旦面对任务复杂度和环境变化，就显示出明显的可靠性缺口。在具有挑战性的 LIBERO-PRO 基准套件上，Galaxea AI 的 G0
              和 G0.5 视觉—语言—动作模型成功率只有 48.0%，超过半数测试配置失败，与公司关于真实世界零样本泛化的宣传相矛盾。现场部署仍需要按任务进行劳动密集型微调，至少要 40
              个真实机器人演示样本，从而限制部署速度。此外，公司没有披露经验证的 CE、UL 或 ISO 协同安全认证，这对受监管工业制造环境中的非试点商业部署构成直接运营障碍。
            claimRefs:
              - CR003
              - CR004
              - CR005
          - type: table
            tableRef: TR002
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR010
      - number: '7.3'
        title: 供应链、算力与商业伙伴依赖
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI 在硬件制造和边缘算力子系统上都存在明显的交易对手集中度。公司几乎完全依赖 Lens Technology 作为精密硬件供应链和量产伙伴，使其目标 10,000
              台生产爬坡易受产能分配、良率瓶颈和改造延误影响。在算力层，R1 系列 500 TOPS
              的机载处理平台依赖高性能边缘加速器，而美国出口管制限制趋严，可能威胁未来硬件供应并带来昂贵的架构重设计。此外，公司虽然宣传拥有 40
              多家企业客户，但外部分析显示，这些账户代表研究访问协议和早期试点，而不是有约束力的商业批量合同。
            claimRefs:
              - CR006
              - CR007
              - CR010
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR006
              - CR007
              - CR012
      - number: '7.4'
        title: 财务轨迹、估值悬置与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI 的融资速度超过了商业验证，造成显著的估值悬置。公司在 2026 年 4 月 B+ 轮达到 $2.9B 投后估值，却披露零经审计商业收入；更早期 A1 机械臂价格从 39,800 元降至
              19,800 元，可能说明利润承压和需求阻力。Unitree Robotics 等同业已经实现有确认的商业批量出货，而 Galaxea AI 仍依赖试点测试和行业展会的高曝光演示。投资者的关键论点破坏触发器包括
              CSRC IPO 审批长期受阻、无法取得欧洲部署所需的 CE/UL 安全认证，以及硬件利润率跌破盈亏平衡的单位经济性。
            claimRefs:
              - CR008
              - CR009
              - CR011
              - CR013
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
