    title: 公司概览
    sections:
      - number: '1.1'
        title: 公司身份、运营足迹与战略使命
        blocks:
          - type: paragraph
            body: >-
              RobotToday 将 Galaxea AI（亦称 Galaxea Dynamics）描述为一家由清华和 Stanford 研究人员于 2023 年 9 月创立的机器人及具身 AI 公司。RBTX 称其为把
              AI 算法与自研机器人本体结合起来的全栈开发商，Multiples 则将其描述为 B2B 产品销售模式。公开地点记录互相矛盾，不能据此下定论：Caplight 和 RobotToday
              指向北京，Multiples 和 AI Market Watch
              指向苏州。因此，证据只能支持其为一家立足中国、面向工业和服务场景的私人机器人公司，不能确认唯一的法定总部或完整的法人实体图谱。在继续开展依赖地点的尽调前，管理层应提供运营、知识产权持有和制造实体的注册资料。
            claimRefs:
