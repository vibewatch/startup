      - number: '2.2'
        title: 市场规模视角、增长预测与估值基准
        blocks:
          - type: paragraph
            body: >-
              评估具身智能的商业机会，需要拆分多个市场规模层次，而不能依赖单一自上而下的 TAM
              数字。长期愿景型预测设想，数十亿台人形机器人最终融入全球工业和家庭，并由中国国家人工智能及机器人基金等主权项目支持。中期来看，工业服务机器人和仓储自动化构成可服务市场，商业运营者部署移动双臂平台，用于多品种分拣、装配和履约。短期可获得市场则限于学术实验室、企业前沿
              AI 研究团队和早期商业试点场地；这些买方愿意以 $44,500 至 $64,000 的单价采购设备，用于采集数据、训练算法和远程操作。然而，早期市场参与者的短期商业收入仍然有限，与私募融资轮中达到 $2.9B
              的估值形成明显张力。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM009
              - CM010
