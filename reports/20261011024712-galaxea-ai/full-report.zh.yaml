      - number: '2.3'
        title: 买方分层、预算归属与采用路径
        blocks:
          - type: paragraph
            body: >-
              具身 AI 的采购可分为三个主要买方群体，预算来源、评估周期和运营要求各不相同。最早采用者包括学术机构、企业前沿 AI
              实验室和基础模型开发商；他们用研究拨款、风险探索预算或企业研发资本开支采购硬件，以获取真实世界物理轨迹数据并验证策略模型。第二类是智能制造工厂、汽车装配厂和零售物流运营商，希望自动化长周期装配和高密度暗店履约。工业企业的采用由工厂经理和自动化副总裁预算主导，要求循环时间达到同等水平、传感器扰动下能够恢复错误，并能与仓库管理系统无缝集成。第三类是长期的家庭消费者，考虑到安全限制、形态工学、单位经济性以及消费者付费意愿尚未验证，目前仍属愿景。
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM012
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM002
              - CM004
              - CM005
              - CM008
              - CM012
      - number: '2.4'
        title: 增长驱动、结构性约束与尽调现实
        blocks:
          - type: paragraph
            body: >-
              制造业中心的长期劳动力供给压力、融合视觉—语言—动作策略的基础模型快速进步，以及东亚成熟的硬件供应链，都在加快具身机器人系统的采用。此外，政府战略支持为本土人形机器人生态提供了大量资本。不过，关键结构性约束阻碍近期商业部署。硬件物料清单成本相对初始售价仍然偏高，挤压硬件毛利；企业部署周期还受到漫长概念验证、严格的工厂安全认证和连续多班运行下长期机械可靠性未验证的拖累。更关键的是，公开披露缺少经审计
              ARR、客户集中度和商业硬件部署数量，使市场规模预测高度依赖私营公司的推测性里程碑。
            claimRefs:
              - CM003
              - CM006
              - CM007
              - CM011
              - CM012
