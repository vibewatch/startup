  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资论点、立场与建议框架
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI 形成了学术研究履历与初生商业现实之间的鲜明反差。基础论点建立在清华大学和 Stanford University
              机器人学创始团队、自有视觉—语言—动作基础模型，以及不断扩展的硬件平台组合上，后者覆盖 R1 轮式人形机器人和新发布的 Nexo 双臂机器人。公司已公开披露与 Huawei
              Cloud、Volkswagen、Samsung 等科技龙头的关系。然而，反方论点在于极高估值倍数、未经验证的商业变现和低迷市场牵引，独立机器人市场动量评分仅为 0.2 /
              10。因此，我们综合后的投资建议是跟踪，信心为中等，整体风险为高，估值立场偏高。除非公司证明收入可重复且单位经济性为正，否则应继续暂缓投入资本。
            claimRefs:
              - CV001
              - CV003
              - CV006
              - CV009
              - CV010
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV010
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV003
              - CV006
              - CV009
              - CV010
      - number: '8.2'
        title: 资本化历史、B 轮估值与定价纪律
        blocks:
          - type: paragraph
            body: >-
              Galaxea AI 的资本积累在两年融资周期中显著加速。2024 和 2025 年，公司在早期轮次中筹得约 $100M，据报道估值达到 $700M，是初始早期资本化的三倍。到 2025 年中，累计融资约
              $210M。2026 年 4 月，公司完成 $290M 至 $291M 的大额 B 轮融资，由 Beijing Financial Street Capital Operation Center、Puhua
              Capital 和 Lens Technology 等本土机构领投，使累计融资约 $435M，并建立 $2.9B
              投后估值。值得注意的是，私人机构摘要确认各轮的企业价值/收入倍数均未披露，体现出完全的私募不透明。同时，Galaxea 向外投入资本，押注 Current Robotics 和 Whale Leap Power
              等战略创投项目；在核心硬件现金流尚未验证的情况下，资产负债表仍激进扩张。
            claimRefs:
              - CV001
              - CV002
              - CV004
              - CV012
          - type: table
            tableRef: TV002
            claimRefs:
              - CV005
              - CV006
              - CV009
              - CV010
              - CV013
      - number: '8.3'
        title: 可比倍数与相对估值
        blocks:
          - type: paragraph
            body: >-
              将 Galaxea AI 与机器人及具身智能同业比较，会看到严重的倍数分化。在更广泛的中国和全球人形机器人市场，Terminus Technologies（$2.9B）、AI² Robotics（$15M
              收入对应 $3.0B，或 200x EV/Rev）和 Cowarobot（$140M 收入对应 $3.0B，或 21.4x EV/Rev）提供了直接私募基准。在上市机器人可比公司中，UBtech Robotics
              的历史 EV/收入倍数为 15.1x，滚动十二个月销售倍数为 9.4x；工业协作机器人制造商 ROKAE 的 EV/Rev 为 22.7x，Space42 的销售倍数为 3.4x。相比这些市场基准，Galaxea
              AI 2024 年收入未记录、2025 年销售额未确认，意味着若以 2025 年假设收入 $10M 计算，隐含估值倍数超过
              290x。这相对成熟的硬件和机器人自动化龙头是巨额溢价，几乎没有空间承受运营波动、制造良率问题或客户采用延迟。
            claimRefs:
              - CV005
              - CV007
              - CV008
              - CV010
      - number: '8.4'
        title: 估值情景、回报不对称与论点破坏触发器
        blocks:
          - type: paragraph
            body: >-
              鉴于商业化速度高度不确定，我们采用概率情景框架评估截至 2027 年潜在股东回报的不对称性。20% 的乐观情景下，Galaxea 实现量产，出货超过 1,500 台并产生超过 $45M 的高毛利收入，IPO
              前估值扩张至 $4.5B。50% 的基准情景下，部署维持试点规模，出货 300 至 500 台、收入 $15M，估值倍数收缩至销售额的 20x 至 25x，在平价或小幅下行轮中估值为 $1.5B。30%
              的悲观情景下，本土同业激烈价格竞争和部件成本上升使收入低于 $5M，并在 $600M 估值下进行紧急重组。概率加权结果为 $1.83B 的期望值，较当前 $2.9B 估值折价约
              37%。严格的论点破坏触发器包括：截至 2026 年底仍持续无法披露超过 $10M 的经审计收入、清华核心学术领导流失，或严重的下行轮重置。
            claimRefs:
              - CV011
              - CV013
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV001
              - CV007
              - CV008
              - CV011
              - CV014
      - number: '8.5'
        title: 展示材料
        blocks:
          - type: callout
            title: 投资立场：商业验证完成前持续跟踪
            body: >-
              Galaxea AI 兼具清华顶尖学术背景和全栈具身 AI 软件，但 Series B 投后估值 $2.9 billion 已显拉伸。2024 年收入未有记录，商业化变现尚未验证，外部市场动能仅为满分 10
              分中的 0.2 分；机构投资者不应按当前估值仓促入场，而应跟踪已验证的交付量里程碑。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV003
              - CV005
              - CV006
          - type: callout
            title: 下行风险：估值倍数大幅压缩风险高
            body: >-
              按假设的 2025 年销售额计算，隐含估值倍数超过 290x，极易遭遇倍数压缩。UBtech 等上市机器人同行的销售额倍数为 9.4x–15.1x。企业部署若有任何延迟，或无法证明硬件毛利率高于
              30%，都可能让后续融资估值下调 50%–80%。
            calloutType: risk
            claimRefs:
              - CV004
              - CV007
              - CV008
              - CV010
              - CV011
