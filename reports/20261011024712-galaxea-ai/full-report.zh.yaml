companyProfile:
  summary: >-
    Galaxea AI 是一家成立于 2023 年 9 月的私人具身智能机器人公司，创始团队来自清华和 Stanford。公司向研究机构、工业客户和早期企业客户销售人形机器人、机械臂、夹爪及 VLA
    基础模型工具组成的全栈产品，最近一次公开融资指向 B+ 轮结构，对应约 $2.9B 的私募估值。现有证据支持其技术势头强劲、客户 logo 覆盖面广，但尚不足以证明经审计收入、已核对的客户数或完全验证的运营足迹。
