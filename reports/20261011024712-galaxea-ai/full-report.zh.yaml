      - number: '3.2'
        title: 硬件—软件基准与定价动态
        blocks:
          - type: paragraph
            body: >-
              产品能力和商业定价策略揭示了人形机器人市场的不同取舍。Galaxea AI 将 R1 轮式人形机器人系列定价在 $44,500 至 $64,000，定位为标准化开发者和工业平台，配有 6-DoF 力控 A1
              机械臂及 G1 夹爪。2026 年世界机器人大会上，公司推出 Nexo，这款先进的轮式双臂平台拥有 20 kg 载荷、30 个自由度和 8 小时连续运行时间，面向暗店履约和精密制造。相比之下，Unitree
              Robotics 将入门级人形平台定价约 $16,000，给学术和研究买方建立了激进的价格下限。Fanuc 和 KUKA 等现有厂商的传统笼式工业机械臂则以每台 $25,000 至 $80,000 提供经验证的
              99.9% 正常运行时间，但集成和编程服务经常使总部署成本翻倍或翻三倍。Galaxea AI 以自有 G0
              基础模型和扩散策略实现无需逐任务重编程的包裹、纸箱闭环处理；但商业买方仍需在自主操控能力、长期硬件可靠性未验证和经常性软件授权成本未披露之间权衡。
            claimRefs:
