  - id: FV001
    title: 建议逻辑链
    type: flow
    summary: 展示从学术能力到商业现实、估值张力，再到最终跟踪立场的决策演进。
    data:
      nodes:
        - id: academic-foundation
          label: 学术基础
          detail: 清华与 Stanford 科学家开发专有 VLA 模型
        - id: hardware-breadth
          label: 产品广度
          detail: R1 系列轮式机器人和 Nexo 双臂机器人已在 40+ 家试点客户中推出
        - id: commercial-friction
          label: 商业阻力
          detail: ARR 披露为零、2024 年收入未有记录，市场动能评分为 0.2/10
        - id: valuation-overhang
          label: 估值压力
          detail: $2.9B 的 B 轮投后估值意味着，按 2025 年估算，EV/收入超过 290x
        - id: comparable-tension
          label: 可比倍数
          detail: 同业倍数在 9.4x 至 22.7x 之间，而 Galaxea 的私募估值溢价极高
        - id: scenario-discount
          label: 情景不对称
          detail: 概率加权价值为 $1.83B，意味着相对当前估值下行 37%
        - id: decision-outcome
          label: 建议：跟踪
          detail: 等待经审计财务披露、单机销量证据和估值倍数回归正常
      edges:
        - from: academic-foundation
          to: hardware-breadth
        - from: hardware-breadth
          to: commercial-friction
        - from: commercial-friction
          to: valuation-overhang
        - from: valuation-overhang
          to: comparable-tension
        - from: comparable-tension
          to: scenario-discount
        - from: scenario-discount
          to: decision-outcome
    approximationNotes: 流程图展示将已验证的技术优势与商业及估值风险相连接的定性决策逻辑。
    claimRefs:
      - CV002
      - CV003
      - CV006
      - CV009
      - CV010
