figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 2023 年 9 月至 2026 年间的公司成立、融资、硬件发布及具身 AI 里程碑。
    data:
      items:
        - date: 2023-09
          label: 公司成立
          detail: RobotToday 报道，清华与 Stanford 的研究人员于 2023 年 9 月创立该公司。
          tone: positive
        - date: 2024-11
          label: 种子轮交割
          detail: Multiples 记录了一笔由 Ant Group 和 GL Ventures 领投的 $28M 种子轮融资。
          tone: positive
        - date: 2025-02
          label: A 轮首次交割
          detail: Multiples 记录了一笔由 Ant Group 和 Cathay Capital 领投的 $41M A 轮融资。
          tone: positive
        - date: 2025-07
          label: A 轮扩展
          detail: Multiples 记录了一笔估值 $700M、规模 $100M 的 A 轮融资。
          tone: positive
        - date: 2025-08
          label: G0 模型发布
          detail: Multiples 将 G0 模型发布时间记为 2025 年 8 月。
          tone: neutral
        - date: 2025-09
          label: 商业规模披露
          detail: RobotsNowhere 报道客户超过 40 家，并计划在年末前达到最多 1,000 台。
          tone: warning
        - date: 2026-01
          label: G0 Plus 发布
          detail: Multiples 将 G0 Plus 模型发布时间记为 2026 年 1 月。
          tone: neutral
        - date: 2026-02
          label: B 轮独角兽融资
          detail: Multiples 报道了一笔由 Jinding Capital 领投、估值 $1.4B 的 $146M B 轮融资。
          tone: positive
        - date: 2026-04
          label: B 轮追加融资披露
          detail: Caplight 报道了一笔投后估值 $2.91B 的 $290M 追加融资；4 月数据表给出的估值四舍五入为 $2.9B。
          tone: warning
    approximationNotes: 日期和金额复现第三方数据库记录；4 月估值为供应商估算，所分配的证据不含一手融资文件。
