    title: 具身机器人市场规模与采用约束层
    type: pyramid
    summary: 从宏观政策支持、工业部署、可服务平台定价到当前收入验证的概念性市场机会分层。
    data:
      items:
        - label: 主权战略优先级与宏观资本承诺
          value: $138B national AI and robotics fund deployed across Chinese strategic innovation sectors
          valueNote: 国家支持的宏观基金，为本国人形机器人及 AI 生态基础设施提供支持
        - label: 企业客户目标群体
          value: Manufacturing, automotive, agriculture, healthcare, and education industrial sectors
          valueNote: 已确定用于商业机器人操作部署的目标行业
        - label: 可服务商业自动化市场视角
          value: Over 40 institutional and corporate enterprises piloting embodied robotics platforms
          valueNote: 覆盖汽车、消费电子、互联网及研究实验室的企业客户基础
        - label: 年度硬件交付目标
          value: Target volume of up to 1,000 units delivered by year-end
          valueNote: 公司自称的 R1 系列人形平台在国内及出口市场的交付里程碑
        - label: 可服务硬件平台价格区间（R1 系列）
          value: $44,500 to $64,000 per unit commercial catalog pricing
          valueNote: R1 Lite 与 R1 Pro 配置双臂轮式人形机器人的单台定价
        - label: 近期经验证的商业收入规模
