company:
  name: Galaxea AI
chapter:
  number: 6
  title: Customers
  summary: >-
    Public evidence indicates a broad institutional and industrial target market and names several
    recognizable organizations, but the strongest current adoption metrics come from a company-issued
    conference demonstration rather than customer production records. Retention, renewal, contract
    duration, customer concentration, and customer-level outcomes remain undisclosed.
sections:
  - id: buyer-and-user-segments
    title: Buyer and user segments
    body: >-
      Galaxea AI appears to sell primarily to organizations rather than consumers: Caplight classifies
      the model as B2B hardware sales plus services and consulting, while AI Market Watch identifies
      researchers, developers, and industrial clients as target customers. The public segment map spans
      research institutions, manufacturing and automotive users, e-commerce and logistics operations,
      and longer-range agriculture, education, healthcare, and household applications. This breadth
      should not be mistaken for balanced commercial penetration. The retained evidence names users in
      research and large technology or industrial organizations, but it provides no segment-level
      revenue, account count, payer identity, procurement cycle, or geographic mix. Robotico's sparse
      profile confirms that arms and humanoid robots create multiple adoption surfaces, not that each
      surface has paying or recurring customers.
    claimRefs: [CU005, CU006, CU010, CU013]
    tableRefs: [TU001]
  - id: adoption-trajectory
    title: Adoption trajectory and usage proof
    body: >-
      Two current customer-count narratives coexist. Galaxea AI's August 2026 release says it serves
      nearly 100 leading global clients, while a supplier listing reports more than 40 institutional
      and commercial clients; neither provides a definition, denominator, or reconciliation. The most
      concrete activity metrics are 900 full-cycle orders, 1,775 picks, 1,560 packing cycles, and 4,000
      stable daily carton-folding cycles at the 2026 World Robot Conference. These figures demonstrate
      event throughput under staged conditions, not active accounts, deployed sites, paid utilization,
      repeat purchases, or customer outcomes. A reported intended deployment with JD.com is directionally
      relevant but remains weaker than a dated customer announcement or independently verified
      production record.
    claimRefs: [CU001, CU003, CU007, CU008, CU009, CU011, CU012, CU015]
    tableRefs: [TU002]
  - id: named-customer-proof
    title: Named customer proof
    body: >-
      Stanford University, Physical Intelligence, Huawei or Huawei Cloud, Volkswagen, Samsung, ByteDance,
      Haier, and MIT appear across public profiles, with Stanford, Physical Intelligence, and Huawei
      also named in Galaxea AI's own release. Cross-source repetition raises confidence that these
      organizations have had some relationship with Galaxea AI, but it does not establish what each
      bought, whether use is paid, whether deployment is a pilot or production system, or what outcome
      was achieved. Physical Intelligence is the only organization identified as a notable customer by
      AI Market Watch, yet that source still supplies no deployment scope or commercial terms. The named
      account list is therefore useful as a reference-check starting point, not as a verified installed
      base.
    claimRefs: [CU001, CU002, CU003, CU004, CU010, CU016]
    tableRefs: [TU003]
  - id: durability-expansion-and-concentration
    title: Durability, expansion, and concentration
    body: >-
      The public record does not support a retention or durability conclusion. None of the retained
      sources discloses NRR, GRR, churn, renewals, contract length, customer cohorts, satisfaction,
      revenue concentration, or the share of accounts in production. The WRC demonstrations suggest a
      plausible land-and-expand path from evaluation hardware to task validation and then broader SKU or
      site coverage, but they do not show that customers have followed that path. External market-data
      pages also omit public growth metrics and EV-to-revenue data, reinforcing the absence of a
      measurable commercial adoption baseline rather than proving zero commercial activity. Investment
      diligence should therefore require account-level deployment status, cohort retention, revenue by
      segment, and top-customer exposure before assigning value to the named-logo list.
    claimRefs: [CU011, CU012, CU014, CU015, CU016]
    figureRefs: [FU001]
