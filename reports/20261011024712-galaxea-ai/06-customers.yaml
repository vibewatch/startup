figures:
  - id: FU001
    title: Evidence-qualified customer adoption journey
    type: journey-map
    summary: >-
      Public evidence is strongest at targeting, account naming, and event validation, then becomes
      progressively weaker at production, expansion, and renewal.
    data:
      nodes:
        - label: Target segment
          detail: "Research, developer, manufacturing, automotive, logistics, education, agriculture, healthcare, and household segments are described publicly."
          touchpoints: ["Market profiles", "Supplier directories"]
        - label: Product evaluation
          detail: "Arms, humanoids, and developer-oriented products provide multiple entry points, but evaluation account counts are not disclosed."
          touchpoints: ["Hardware purchase", "Developer experimentation"]
        - label: Public task validation
          detail: "WRC demonstrations report orders, picks, packing cycles, and carton-folding cycles under staged conditions."
          touchpoints: ["Conference demonstrations", "Task perturbations"]
        - label: Production deployment
          detail: "An intended JD.com deployment is reported, but no customer-authored go-live, site count, utilization, or SLA is available."
          touchpoints: ["Pilot-to-production diligence", "Customer reference call"]
        - label: Account expansion
          detail: "Broader SKU, workflow, or site coverage is plausible but no cohort expansion, repeat-order, or upsell metric is disclosed."
          touchpoints: ["Additional workflows", "Additional sites"]
        - label: Renewal and durability
          detail: "NRR, GRR, churn, renewals, contract length, satisfaction, and customer concentration remain public evidence gaps."
          touchpoints: ["Renewal record", "Cohort retention", "Revenue concentration"]
    approximationNotes: "Conceptual evidence map, not a measured conversion funnel; no conversion rates or stage populations are inferred."
    claimRefs: [CU006, CU007, CU009, CU013, CU014, CU015]
callouts:
  - calloutType: risk
    title: Named logos are not production proof
    body: >-
      Multiple public sources repeat recognizable account names, but none supplies customer-authored
      confirmation, paid deployment status, retention, contract value, or measured customer outcomes.
    claimRefs: [CU001, CU002, CU003, CU004, CU016]
