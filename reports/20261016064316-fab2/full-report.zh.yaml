  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界、纳入支出与替代方案
        blocks:
          - type: paragraph
            body: >-
              保留的来源将 Fab2 的市场边界定义为：比纯 EDA 产品更宽，但比整个半导体价值链更窄。Fab2
              被描述为建设紧凑型或软件定义晶圆厂，以及运行这些晶圆厂所需的泵、阀门、气路、光刻系统、真空硬件和基于浏览器的设计软件。因此，相关支出包括一体化晶圆厂设备、工艺硬件、自动化以及配套设计工作流软件。相同来源也明确了这一切不包括什么：Fab2
              并未被描述为高产量、先进制程 300mm 代工产能的直接替代品。现状替代方案是传统晶圆厂建设，或依赖现有代工厂；两者共同构成 Fab2 试图压缩的资本和时间基线。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
          - type: figure
            figureRef: FM001
            claimRefs:
              - CM003
              - CM004
              - CM005
              - CM006
              - CM007
              - CM008
              - CM010
              - CM011
              - CM013
      - number: '2.2'
        title: 多种测算视角指向有意义的切口，而非清晰 TAM
        blocks:
          - type: paragraph
            body: >-
              证据支持多个测算视角，但没有一个能构成完整的 TAM/SAM/SOM 体系。Founderland、AIPressRoom 和 Dealroom
              都将机会放在传统晶圆厂数十亿美元成本和多年建设周期的背景下，这有助于界定痛点，却不能量化市场规模。Multiples 提供了融资和可比公司视角：Fab2 的 2026 年 9 月融资将公司定价为
              $3.7B，资料并将其与收入从数亿美元到数十亿美元不等、硬件占比较高的半导体设备和材料公司比较。这更能说明投资人如何寻找模式，而不是终端市场支出。最稳妥的结论是，紧凑型晶圆厂方向正被按硬件和基础设施市场来评估，但保留的证据池仍缺少能单独拆出
              Fab2 特定品类可触达支出的独立数据集。
            claimRefs:
              - CM003
              - CM007
              - CM008
              - CM009
              - CM010
              - CM011
          - type: table
            tableRef: TM002
            claimRefs:
              - CM003
              - CM009
              - CM010
              - CM011
      - number: '2.3'
        title: 买方路径、采用动力与限制
        blocks:
          - type: paragraph
            body: >-
              Fab2 的买方路径很可能是企业级、项目制，而非自助式。Multiples 将公司归为 B2B
              产品销售模式；保留的招聘证据则显示，机械、电气、嵌入式软件和生产团队之间存在跨职能协作。因此，评估过程会涉及工程和制造负责人，采用动力则可能来自更快的原型开发、更本地化的产能，或低于定制晶圆厂建设的进入成本。相同证据也说明采用为何可能较慢。Fab2
              仍依赖实体场地、许可、工业建设和可信的生产执行，而公开来源仍未披露收入、客户数量、已交付晶圆厂数量或良率。这些缺口意味着，即使完成了 $500M Series A，商业化论证和任何 SAM/SOM
              估算的公开证据仍明显不足。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
              - CM013
              - CM014
              - CM015
          - type: table
            tableRef: TM003
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM008
              - CM012
      - number: '2.4'
        title: 展示项
        blocks:
          - type: callout
            title: 融资验证了兴趣，不是市场规模
            body: $500M Series A 和 $3.7B 估值是保留证据池中最清晰的需求信号，但这仍是投资人定价，不代表紧凑型晶圆厂切口已有经过测量的 TAM 或可重复的商业转化。
            calloutType: insight
            claimRefs:
              - CM010
              - CM011
          - type: callout
            title: 商业证明仍是尽调的门槛
            body: 公开来源描述了产品方向和融资规模，却没有披露已交付晶圆厂数量、客户规模、收入或良率表现，因此市场论证仍跑在运营证明之前。
            calloutType: risk
            claimRefs:
              - CM012
              - CM013
  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 竞争版图与买方替代方案
        blocks:
          - type: paragraph
            body: >
              Fab2 要解决的买方问题不是通用芯片设计软件，而是无需等待稀缺的现有代工厂产能，就能更快完成低批量半导体原型开发。独立报道将 Fab2
              描述为稀缺代工厂时段的更小型、可重复替代方案，也称其希望批量生产紧凑型晶圆厂，而不是再做一家传统芯片设计工具供应商。与此同时，最接近的实际替代方案仍包括 incumbent 300mm foundry
              和自有晶圆厂路径，因为公开报道继续把先进制造放在少数规模玩家周围，例如 TSMC、Samsung、Intel，以及由 ASML 主导的光刻体系。因此，市场可分为原型制造的直接替代方案、规模化制造的
              现有厂商生产路径、相邻微制造平台，以及只攻克一个瓶颈而非 Fab2 全栈的更窄设备专业厂商。
            claimRefs:
              - CP001
              - CP003
              - CP004
              - CP005
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP004
              - CP006
              - CP008
              - CP010
              - CP011
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP012
              - CP016
      - number: '3.2'
        title: 能力广度与封装取舍
        blocks:
          - type: paragraph
            body: >
              Fab2 可见的差异化在于广度。多个来源称，公司把基于浏览器的设计软件、自研晶圆厂工具和紧凑型晶圆厂组装结合起来，比指定证据中的专业化方案更宽。例如，Atomic Machines 被描述为围绕 Matter
              Compiler 技术建设的微制造平台公司，而不是复制完整半导体晶圆厂的项目；Dealroom 的半导体设备挑战者则被定位为押注光刻或代工瓶颈。这种广度可能对重视从设计到原型闭环协同的买方有价值，但也意味着
              Fab2 必须商业化更多产品层，而相邻竞争者只需赢下一层。
            claimRefs:
              - CP002
              - CP006
              - CP007
              - CP010
              - CP012
          - type: table
            tableRef: TP002
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
              - CP009
              - CP010
              - CP012
          - type: table
            tableRef: TP003
            claimRefs:
              - CP004
              - CP006
              - CP010
              - CP013
      - number: '3.3'
        title: 持久性、切换成本与现有厂商压力
        blocks:
          - type: paragraph
            body: >
              Fab2 的护城河论点是：垂直整合的设计、工具和晶圆厂体系，如果客户同时采用 Studio 和 Fab2
              制造的工艺硬件，可能带来协同优势和一定切换成本。公开资料的反面是，公司要求投资人和客户同时评估硬件、设施、工艺可重复性和客户认证。独立报道反复将投资判断系于执行，而不是已经完成的商业基准：2026 年融资让
              Fab2 有能力在披露晶圆开工、良率、客户合同或毛利率之前先行建设，而 Dealroom 的框架仍把现有厂商对比集中在拥有规模、供应链地位和现成设备生态的巨头身上。因此，Fab2
              看起来有差异化，但尚未坚固到足以排除现有厂商或专业厂商替代。
            claimRefs:
              - CP008
              - CP009
              - CP011
              - CP012
              - CP016
      - number: '3.4'
        title: 证据边界与待解问题
        blocks:
          - type: paragraph
            body: >
              公开比较质量仍受限制。指定证据没有提供 Fab2 与替代方案之间可比的价目表、合同结构、已交付晶圆厂数量或客户引用，因此定价能力和切换成本只能从公开材料中部分检验。连基本的公司资料也不完全一致：第三方页面对
              Fab2 应被视为 2022 年还是 2023 年成立存在分歧。这些缺口不会抹去竞争图景，但会让当前分析更接近战略定位判断，而不是经过完整基准比较的商业评分卡。
            claimRefs:
              - CP013
              - CP014
              - CP015
      - number: '3.5'
        title: 展示项
        blocks:
          - type: callout
            title: Fab2 最清晰的战略优势是覆盖范围
            body: 目前证据最充分的差异化，是 Fab2 试图在一个体系内覆盖设计软件、自研晶圆厂工具和紧凑型晶圆厂制造，而不是只攻克一个制造瓶颈。
            calloutType: strength
            claimRefs:
              - CP002
              - CP012
          - type: callout
            title: 现有厂商的规模仍定义上限
            body: 公开证据仍将先进代工和光刻竞争放在具备规模与供应链力量的现有厂商周围，因此 Fab2 的护城河取决于执行，而非已获得结构性保障。
            calloutType: risk
            claimRefs:
              - CP004
              - CP011
          - type: callout
            title: 公开定价证据仍缺失
            body: 比较可以区分封装模式和业务范围，却无法判断实际价格，因为指定来源没有披露 Fab2 或替代方案可比的商业条款。
            calloutType: insight
            claimRefs:
              - CP013
  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式已有描述，但商业化证据仍薄弱
        blocks:
          - type: paragraph
            body: >-
              指定来源池支持若干计划中的变现面，但尚未展示实际商业表现。Simplify 将 Fab2 描述为设计、制造并授权紧凑型模块化晶圆厂，Tracxn 则将硬件组件和基于浏览器的 EDA 工具也纳入其中。Baidu
              的资料进一步强化了小型软件定义晶圆厂的定位。这足以按品类勾勒收入模式，却不足以评估当前收入结构、附着率或确认政策。保留的来源都没有披露已交付晶圆厂数量、客户群、合同条款或实际目录价，因此本章只能区分计划中的收入流，收入质量尚未得到证明。
