chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、模式与当前版图
        blocks:
          - type: paragraph
            body: >-
              Fab2 将自己定位为半导体制造商，而不是纯软件公司。通过 Simplify
              分发的多份公司招聘信息称，公司自行设计制造芯片所需的硬件和软件，并自行建设晶圆厂、工具和组件。第三方摘要也强调其垂直整合定位，并将业务与紧凑型或软件定义晶圆厂联系起来。当前业务版图以得州为中心，多次提到
              Austin、Lockhart 和 San Francisco 的地点；但这只能视为方向性支持，尚未完全核实，因为最有力的独立本地报道也质疑得州设施叙事的部分细节。
            claimRefs:
              - CO001
              - CO004
              - CO005
              - CO012
              - CO014
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO005
              - CO007
              - CO010
              - CO012
              - CO013
      - number: '1.2'
        title: 创始人、领导层与治理透明度
        blocks:
          - type: paragraph
            body: >-
              指定证据池始终将 Fab2 与 Sam Zeloof 和 Jim Keller 联系起来，因此即使其他治理细节仍很少，后续章节至少有稳定的创始人身份。公司招聘页面称两人都是创始人，公开招聘材料称 Sam
              Zeloof 是现任 CEO，Dealroom 也将其列为联合创始人兼首席执行官。Jim Keller 明显带来行业信誉和招聘吸引力，但指定证据也将他与 Tenstorrent
              的领导职位联系起来。因此，投资人应核实他在 Fab2 的正式运营角色、董事会权限和日常投入，而不是默认他持续全职参与。
            claimRefs:
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO002
            claimRefs:
              - CO002
              - CO003
              - CO004
      - number: '1.3'
        title: 融资、估值与规模信号
        blocks:
          - type: paragraph
            body: >-
              相比运营披露，公开融资证据异常充分。Dealroom 报告称，Fab2 于 2026 年 9 月完成由 Protagonist 领投的 $500M Series A，估值 $3.7B；第三方资料还指向此前一轮约
              $15M 的种子融资，由 OpenAI Startup Fund 领投，估值约 $100M。这些融资让 Fab2
              获得了很强的市场信号，但指定证据池仍未披露收入、ARR、良率、已交付晶圆厂数量或客户规模。员工人数也不精确：第三方摘要大多落在 105 至 106 人，公司分发的招聘信息则使用更宽泛的 51-200 人区间。
            claimRefs:
              - CO010
              - CO011
              - CO012
              - CO013
          - type: table
            tableRef: TO003
            claimRefs:
              - CO003
              - CO010
              - CO011
      - number: '1.4'
        title: 里程碑、扩张证据与尽调缺口
        blocks:
          - type: paragraph
            body: >-
              本章的里程碑记录足以确认先后顺序，却不足以消除执行风险。第三方来源称，公司最初名为 Atomic Semi，2023 年完成种子轮，2026 年 7 月更名为 Fab2，随后在 2026 年 9
              月宣布规模大得多的一轮融资。Austin American-Statesman 的独立报道提供了更硬的运营数据点，将 Fab2
              与得州办公及研发空间的建设申报联系起来。但同一报道也是本章最重要的警示信号：它发现，公开资料对部分 Austin 和 Lockhart
              版图细节的支持并不完整。再加上成立日期和员工人数仍有冲突，后续尽调应优先核查文件，而不是顺着叙事势头下结论。
            claimRefs:
              - CO005
              - CO006
              - CO007
              - CO008
              - CO009
              - CO010
              - CO013
