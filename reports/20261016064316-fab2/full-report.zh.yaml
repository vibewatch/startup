        - Fab2 把 $500M 融资转化为可重复的多地点生产、客户部署，以及可信的软件加硬件变现
        - 当前 $3.7B 轮融资成为跳板，因为新增证据支持再进行一轮溢价私募融资，或引发战略退出兴趣
