  - id: FE001
    title: 产品架构图
    type: stack
    summary: 公开产品叙事是在自研组件、精密工具、工艺 / 器件学习闭环和多地点晶圆厂组装之上，叠加基于浏览器的设计软件。
    data:
      layers:
        - label: 设计软件
          detail: Studio 被描述为现代化、基于浏览器的协作式 EDA，目标是匹配晶圆厂的速度。
          items:
            - label: Studio
              note: Named public software surface
            - label: 浏览器协作
              note: Official copy emphasizes in-browser and collaborative workflow
          outputs:
            - 芯片设计工作流
            - 更快的设计到晶圆厂迭代主张
        - label: 组件和精密工具
          detail: Fab2 称，公司会制造芯片所需的晶圆厂硬件，包括其理想晶圆厂所需的组件。
          modules:
            - 泵
            - 阀门
            - 传感器
            - 纳米级精密执行器
            - 电路板
            - 腔室
            - 光刻 / 计量 / 运动系统
          outputs:
            - 对芯片进行图形化、检测和表征
        - label: 工艺和器件工程
          detail: 公开招聘信息描述了配方、新型材料、电气表征以及晶体管架构方面的工作。
          items:
            - 配方开发
            - 新型材料
            - 电气测试（I-V/C-V）
            - 晶体管架构
            - 技术性能模型
          outputs:
            - 工具故障排查和流程改进
        - label: 晶圆厂组装和设施
          detail: 官方文案称，组件变成机器，机器变成晶圆厂；Austin、Lockhart 和 San Francisco 均为运营地点。
          modules:
            - Austin 芯片晶圆厂（120K SQFT）
            - Lockhart 晶圆厂晶圆厂（30K SQFT）
            - San Francisco 车库晶圆厂（25K SQFT）
          outputs:
            - 集成晶圆厂建设
            - 紧凑型晶圆厂量产目标
        - label: 项目和发布治理
          detail: 技术项目管理被描述为协调机械、电气、嵌入式 / 软件和生产工作，直至发布。
          items:
            - 需求定义
            - 跨职能执行
            - 暴露并缓解风险
            - 生产发布
          outputs:
            - 类 NPI 协调层
        - label: 信任和合规界面
          detail: 公开可见的控制措施仅限于出口管制措辞，以及对更强一手质量或安全文件的需求。
          items:
            - 受出口管制的技术岗位
            - QA/QC 证据需求
            - 状态 / 安全文件需求
          outputs:
            - 有合规信号，但没有生产级证据
    approximationNotes: 该图根据官方文案和招聘证据综合架构，并非包含接口、供应商边界或实测吞吐量的公开系统图。
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE011
  - id: FU001
    title: 客户证据旅程图
    type: journey-map
    summary: 公开证据支持早期商业化步骤和买方意向，但后续部署、客户背书和扩张阶段仍缺少具名证据。
    data:
      items:
        - label: 目标账户假设
          touchpoints:
            - 半导体组织是最可能的买方，因为 Fab2 描述的是晶圆厂、工具和设计软件，而非消费产品。
        - label: 技术评估
          touchpoints:
            - 公开描述称，紧凑型、软件定义的晶圆厂能够支持快速原型开发和小规模芯片生产。
        - label: 就绪建设
          touchpoints:
            - 招聘页面聚焦生产发布、材料流转，以及持续或高产量制造支持。
        - label: 客户对话
          touchpoints:
            - 创始人办公室被描述为与投资人、客户和合作伙伴联系的窗口。
        - label: 具名部署证据
          touchpoints:
            - 分配到的来源池中，没有出现具名生产客户、试点或客户引用的结果。
        - label: 续约和扩张证据
          touchpoints:
            - 未见公开 NRR、流失率、多地点扩张或头部客户集中度指标。
    approximationNotes: 该旅程图反映的是公开证据状态，而非测得的转化率；不应将其解读为量化漏斗，或证明后续阶段已经发生。
