      - number: '4.3'
        title: 收入质量、销售效率与 runway 仍是公开数据缺口
        blocks:
          - type: paragraph
            body: >-
              投资判断最大的难题不是缺少故事，而是缺少检验故事所需的指标。Silicon Valley Invest Club 明确称，在其使用的来源集中没有找到公开披露的收入、ARR 或盈利数据；Simplify
              的批判性摘要称，截至 2026 年 9 月，Fab2
              仍未披露收入、良率、客户规模和已交付晶圆厂数量。指定来源也没有披露现金余额、烧钱、债务安排、营运资金、CAC、回本周期或销售周期。因此只能依靠员工人数、招聘措辞和设施支出等较弱的公开代理指标。这些代理指标有助于刻画资本密度，却无法回答公司是否拥有可重复的单位经济模型，或是否有足够流动性走到规模化。
