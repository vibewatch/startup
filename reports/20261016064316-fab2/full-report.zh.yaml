        title: 公开证据指向先建设、资本密集型运营模式
        blocks:
          - type: paragraph
            body: >-
              最强的财务证据集中在资本形成和设施建设，而不是经常性收入。Dealroom 报告称，公司于 2026 年 9 月完成 $500M Series A；Yahoo Finance 报告称，截至 2027 年 2
              月，Austin 约 $3.9M 的仓库改造为办公和研发空间。Technical Program Manager
              职位描述的工作是推动晶圆厂工具和组件从需求到生产发布及爬坡，这与硬件密集型商业化路径一致。这些信息支持一种判断：Fab2
              先在工程能力、设施和制造准备上投入资金。但公开证据仍无法确定这些支出由客户现金流、项目融资，还是仅由风险股权支撑。
