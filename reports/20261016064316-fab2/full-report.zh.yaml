  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管和法律尽调仍主要是准备度问题
        blocks:
          - type: paragraph
            body: >
              指定证据池的公开信息没有显示针对 Fab2 的已确认执法行动、召回或具名诉讼，但也没有关闭法律事项。最清晰的公司特定合规信号来自运营而非声明：Fab2 2026 年 9 月的 Technical Program
              Manager 招聘信息要求录用取决于候选人遵守美国出口管制的能力，这说明至少一个硬件岗位已经涉及视同出口筛查。原因在于，Fab2 建设的是半导体工具、控制系统和制造工艺设备，而不是纯软件产品。


              更大的缺口在许可、工业安全和 IP 状况。多份 2026 年来源描述了 Austin 的研发和生产场地，以及 Lockhart 的“fab
              fab”设施，但保留的证据没有包括环境、危险材料、消防安全或调试记录等底层材料，无法证明这些设施已完全获准实施融资所暗示的生产计划。同样，唯一指定的负面法律结果指向 Law360 的马萨诸塞州新闻索引，而非
              Fab2 特定案卷，因此本章不能把“没有发现事故”当成“没有法律风险”。正确判断是：法律和监管风险尚未核实，而不是不存在。
