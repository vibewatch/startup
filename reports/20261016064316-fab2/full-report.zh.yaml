            body: 在评估规模化之前，应索取设施许可、出口管制控制、阶段门和良率指标、具名生产部署，以及针对 Fab2 和 Atomic Semi 的直接诉讼/IP 检索。
            calloutType: recommendation
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR013
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 投资建议与价格纪律
        blocks:
          - type: paragraph
            body: >-
              估值记录中最强的公开事实就是这轮融资本身：Wilson Sonsini、FundedIQ 和 Venture Capital Tracker 都将 Fab2 的 2026 年 9 月融资锚定在 $3.7B
              估值。这足以把 $3.7B 视为当前公开价格锚点，而不是种子轮时期的旧价格。但这不足以说明价格已经经过完整投资判断。Silicon Valley Invest Club
              称，在其来源集中没有找到公开披露的收入、ARR 或盈利数据；Simplify 的批判性摘要称，截至 2026 年 9 月 Fab2
              仍未披露收入、良率、客户规模或已交付晶圆厂数量。价格有充分支持、运营证明仍稀薄，因此公开证据立场是继续研究：跟踪公司、要求硬运营证据，不要只凭叙事势头支付高于最新一轮的价格。
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV006
              - CV008
              - CV010
              - CV012
              - CV013
      - number: '8.2'
        title: 估值背景与参考点
        blocks:
          - type: paragraph
            body: >-
              公开融资叙事比公开运营叙事更丰富。Wilson Sonsini 列出了 $500M Series A 的投资银团，Dealroom 则补充了此前约 $15M 的种子轮，由 OpenAI Startup Fund
              领投，估值约 $100M，并称最新一步代表不到三年内估值增长近 37 倍。相比之下，FundedIQ 只记录了一轮融资和 $500M 累计融资，这说明第三方目录对 Fab2
              累计融资历史仍有分歧。这种分歧很重要，因为估值背景本已主要依赖私募轮基准，而不是披露的收入倍数。Dealroom 的同行框架也按里程碑展开：它将 Fab2
              与其他获得大量融资的半导体设备和代工挑战者放在一起，而非与经过审计的上市运营可比公司比较。因此，可比公司视角有助于理解投资人兴趣，却不足以证明当前价格便宜。
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
      - number: '8.3'
        title: 情景框架与下行触发因素
        blocks:
          - type: paragraph
            body: >-
              看多、基准和看空情景都受里程碑约束，因为 Fab2 试图建设完整制造系统，而不是轻量软件 SKU。公司关联的岗位页面和 Baidu
              资料一贯描述覆盖工具、组件和紧凑型晶圆厂的自研技术栈，材料管理招聘页面则描述从原型构建走向重复或大批量制造。这样的广度意味着，如果 Fab2
              能把资本转成真实部署，潜在上行空间很大；但也集中放大了执行风险。Simplify 的批判性摘要给出了指定证据池中最清晰的负面框架：$3.7B 估值已计入巨大的执行成就，而竞争性的 300mm
              代工厂和自有晶圆厂可以在得州建设规模化之前投入更多资金。基准情景因此不能假设融资本身证明了商业准备度，而需要公司尚未公开披露的运营证据。
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.4'
        title: 哪些信息会改变判断
        blocks:
          - type: paragraph
            body: >-
              下一步尽调并不复杂，尽管答案未必公开。要让估值判断更积极，需要看到客户集中度、已交付晶圆厂数量、制造良率，以及软件、工具或晶圆厂收入是否具有经常性且能提升毛利率。股权结构表同样重要：公开记录列出了这轮融资和部分投资人，却没有清算优先权、跟投、反稀释条款、债务或项目融资义务。在这些事项明确之前，投资判断应假设价格纪律比品牌势头更重要。最清晰的论题破坏触发因素包括：下轮融资或结构化的内部人主导融资；在建设里程碑之后仍不披露客户和良率证明；或有证据显示
              Fab2 的紧凑型晶圆厂模式无法跨过负面评论所提到的现有厂商成本和规模优势。
            claimRefs:
              - CV006
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 公开建议
            body: Fab2 值得跟踪，因为最新一轮融资真实且规模很大；但指定公开证据仍不足以支持仅凭信念支付高于最新一轮价格的估值。
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV012
              - CV013
          - type: callout
            title: 哪些因素可能击穿论题
            body: 目前投资判断故事最快的失效路径，是结构化或下行后续融资；在建设里程碑之后仍不披露客户和良率证明；或有证据表明 incumbent 能让 Fab2 长期停留在商业规模以下。
            calloutType: risk
            claimRefs:
              - CV006
              - CV010
              - CV014
