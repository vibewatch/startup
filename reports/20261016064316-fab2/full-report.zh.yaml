companyProfile:
  summary: >-
    Fab2 是一家私营半导体初创公司，自称是垂直整合制造商。公司公开材料称，它自行设计制造芯片所需的硬件和软件，并自行建设晶圆厂、工具和组件；第三方报道则将公司与以得州为中心的运营扩张、2026 年从 Atomic Semi 更名为
    Fab2，以及一轮规模极大的据报道 Series A 联系起来。
  founders:
    - name: Sam Zeloof
      role: 联合创始人兼 CEO
      background: 因车库芯片试验和早期半导体工作而为公众所知。
      claimRefs:
        - CO002
        - CO003
    - name: Jim Keller
      role: 联合创始人
      background: 资深芯片架构师，曾与 AMD、Apple、Tesla 和 Tenstorrent 相关。
      claimRefs:
