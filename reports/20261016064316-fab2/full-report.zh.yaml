  - id: FV001
    title: 建议逻辑
    type: flow
    summary: 当前轮次值得关注，但在公开运营证据追上估值前，建议仍保持谨慎。
    data:
      nodes:
        - id: current-price
          label: 当前公开价格锚点
          note: 多个来源相互印证，$500M Series A 估值为 $3.7B
        - id: investor-support
          label: 存在投资人支持
          note: 具名领投方和银团显示投资人对该论点有很强兴趣
        - id: operating-proof
          label: 运营证据仍缺失
          note: 收入、良率、客户数量和已出货晶圆厂数量仍未公开披露
        - id: capital-intensity
          label: 资本密集度高
          note: Fab2 正试图在内部建设工具、组件和紧凑型晶圆厂
        - id: downside-risk
          label: 下行触发因素
          note: 错过里程碑或被现有厂商加大投入，可能迫使后续融资条件转弱
        - id: recommendation
          label: 建议：继续研究
          note: 在获得更强证据前，不要以高于最新轮次的估值进行投资评估
      edges:
        - from: current-price
          to: investor-support
          label: 由……验证
        - from: investor-support
          to: operating-proof
          label: 不能取代
        - from: operating-proof
          to: capital-intensity
          label: 因……而更重要
        - from: capital-intensity
          to: downside-risk
          label: 放大
        - from: downside-risk
          to: recommendation
          label: 驱动
    approximationNotes: 该流程展示从融资证据到建议的分析门槛逻辑，而不是量化预测或概率树。
    claimRefs:
      - CV002
      - CV006
      - CV008
      - CV010
      - CV012
      - CV013
