      - number: '7.2'
        title: 核心运营风险是能否足够快地建成紧凑型晶圆厂平台，以证明这轮融资合理
        blocks:
          - type: paragraph
            body: >
              Fab2 的运营论题要求公司同时完成几件困难的事：自研晶圆厂工具和组件，将它们组装成紧凑型晶圆厂，并借助软件定义制造和基于浏览器的设计软件缩短设计到原型的周期。BigGo 2026 年 7
              月的报道明确了核心技术取舍：当前战场是原型开发、研发和低批量生产，而不是 TSMC、Samsung 或 Intel 的高吞吐 300mm
              经济性。这种定位并非致命问题，但意味着公司仍需证明，紧凑型晶圆厂架构能从有吸引力的制造概念变成可重复的商业系统。


              招聘信号也说明这种转化仍在进行。Fab2 正在招聘 Technical Program
              Manager，负责推动晶圆厂工具和组件从需求定义走向生产发布，维护关键路径，尽早暴露技术风险，并管理从研发构建到生产爬坡的交接。这正是公司在整合、排序和进度风险成为一阶约束时会设置的岗位。得州版图进一步放大了问题：Austin、Lockhart
              和 San Francisco 某种程度上提供了冗余，但制造重心似乎集中在得州建设上，因此任何许可、公用事业、施工或人员延误都可能同时冲击时间表和可信度。
