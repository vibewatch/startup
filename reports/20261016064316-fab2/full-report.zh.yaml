  - id: FI001
    title: 收入模式桥接
    type: flow
    summary: 公开证据显示，股权融资先流向设施和工具开发；目前没有任何公开证据证明已有出货量、实现价格或毛利润。
    data:
      nodes:
        - id: capital
          label: 已募集风险资本
          note: 据报道 2026 年 9 月完成 $500M Series A；部分目录对累计总额的更新仍滞后
        - id: facilities
          label: 设施建设
          note: Austin 仓库翻修及研发空间建设
        - id: tools
          label: 晶圆厂工具和组件
          note: 公开描述的泵、阀门、传感器、执行器及其他设备
        - id: fabs
          label: 紧凑型晶圆厂 / 原型产能
          note: 可大规模生产的紧凑型软件定义晶圆厂概念
        - id: customers
          label: 客户部署和出货
          note: 客户数量、已出货晶圆厂数量和良率均未披露
        - id: revenue
          label: 已确认收入和毛利润
          note: 收入结构、定价和利润率尚无公开披露
      edges:
        - from: capital
          to: facilities
          label: 资金用于建设
        - from: facilities
          to: tools
          label: 支持开发
        - from: tools
          to: fabs
          label: 组装成系统
        - from: fabs
          to: customers
          label: 商业部署
        - from: customers
          to: revenue
          label: 取决于合同
    approximationNotes: 该流程总结的是公开商业化顺序，而不是测得的转化率，因为分配到的来源没有披露出货量、利用率或利润率。
