    notes: "Buyer, payer, and budget-owner rows are inferred from the retained product descriptions, B2B model, and cross-functional hiring evidence rather than from published customer contracts."
    claimRefs: [CM005, CM006, CM007, CM008, CM012]
figures:
  - id: FM001
    title: Market sizing lens
    type: pyramid
    summary: >-
      The retained evidence supports a narrowing market lens from broad fab-capex pain to
      Fab2's compact-fab wedge, but it does not support a clean TAM/SAM/SOM stack.
    data:
      items:
        - label: Incumbent fab barrier
          displayValue: Multi-billion-dollar fab projects
          detail: Conventional leading-edge fabs remain the status-quo substitute that defines the pain point.
          valueNote: Barrier lens, not addressable market size.
          claimRefs: [CM003]
        - label: Integrated tooling stack
          displayValue: Tools, components, automation, and software
          detail: Fab2's wedge spans hardware and software rather than a single product SKU.
          valueNote: Included spend comes from company and profile descriptions.
          claimRefs: [CM001, CM004]
        - label: Prototype and specialty-production use case
          displayValue: Small chips, smaller-than-full-wafer workflows, and faster prototype cycles
          detail: Retained sources repeatedly position the offer around rapid prototyping and flexible capacity.
          valueNote: Use-case lens only; no spend denominator disclosed.
          claimRefs: [CM002, CM007]
        - label: Enterprise buyer path
          displayValue: Cross-functional engineering and production evaluation
          detail: Adoption runs through hardware, software, and production teams rather than a self-serve purchase.
          valueNote: Derived from B2B classification and hiring evidence.
          claimRefs: [CM005, CM006]
        - label: Investor underwriting
          displayValue: $500M Series A at $3.7B valuation
          detail: Capital raised and round pricing show strong investor appetite for the thesis.
          valueNote: Financing signal, not a TAM/SAM/SOM measurement.
          claimRefs: [CM008, CM011]
        - label: Commercial proof gap
          displayValue: Customer, revenue, yield, and shipped-fab metrics not publicly disclosed
          detail: Missing commercialization metrics prevent a credible bottom-up SAM or SOM.
          valueNote: Most important remaining market-sizing diligence item.
          claimRefs: [CM010, CM013]
    approximationNotes: "Ordered as a narrowing lens from broad industry pain to the specific commercial proof still missing; values mix qualitative and quantitative evidence because the retained sources do not support a clean market-size stack."
    claimRefs: [CM003, CM004, CM005, CM006, CM007, CM008, CM010, CM011, CM013]
