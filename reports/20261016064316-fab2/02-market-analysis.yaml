      - ["Specialty or lower-volume manufacturing programs", "Manufacturing or operations leadership", "Process and production teams", "Capital-equipment budget", "Standing up localized or flexible production capacity", "VP Manufacturing or COO", "Need capacity without a full bespoke fab build"]
