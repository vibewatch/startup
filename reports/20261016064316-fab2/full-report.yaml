  - id: FE001
    title: Product architecture map
    type: stack
    summary: >-
      The public product story stacks browser-based design software on top of self-built components, precision tools,
      process/device learning loops, and multi-site fab assembly.
    data:
      layers:
        - label: Design software
          detail: Studio is presented as a modern, in-browser, collaborative EDA built to match the speed of the fab.
          items:
            - label: Studio
              note: Named public software surface
            - label: Browser collaboration
              note: Official copy emphasizes in-browser and collaborative workflow
          outputs:
            - Chip design workflow
            - Faster design-to-fab iteration claim
        - label: Components and precision tools
          detail: Fab2 says it builds the fab hardware needed to make chips, including components that its dream fabs require.
          modules:
            - Pumps
            - Valves
            - Sensors
            - Nanometer precision actuators
            - Boards
            - Chambers
            - Lithography / metrology / motion systems
          outputs:
            - Pattern, inspect, and characterize chips
        - label: Process and device engineering
          detail: >-
            Public recruiting describes recipes, novel materials, electrical characterization, and
            transistor-architecture work.
          items:
            - Recipe development
            - Novel materials
            - Electrical test (I-V/C-V)
            - Transistor architectures
            - Technology performance models
          outputs:
            - Tool troubleshooting and flow improvement
        - label: Fab assembly and facilities
          detail: >-
            Official copy says components become machines and machines become fabs, with Austin, Lockhart, and San
            Francisco operating sites.
          modules:
            - Austin chip fab (120K SQFT)
            - Lockhart fab fab (30K SQFT)
            - San Francisco garage fab (25K SQFT)
          outputs:
            - Integrated fab buildout
            - Mass-production ambition for compact fabs
        - label: Program and release governance
          detail: >-
            Technical program management is described as coordinating mechanical, electrical, embedded/software, and
            production work through release.
          items:
            - Requirements definition
            - Cross-functional execution
            - Risk surfacing and mitigation
            - Production release
          outputs:
            - NPI-style coordination layer
        - label: Trust and compliance surface
          detail: >-
            Publicly visible controls are limited to export-control language and requests for stronger first-party
            quality or security documentation.
          items:
            - Export-controlled technical roles
            - Need for QA/QC evidence
            - Need for status/security documentation
          outputs:
            - Compliance signal without production-grade proof
    approximationNotes: >-
      This figure is an architecture synthesis from official copy and recruiting evidence; it is not a public systems
      diagram with interfaces, vendor boundaries, or measured throughput.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
      - CE005
      - CE006
      - CE007
      - CE008
      - CE011
  - id: FU001
    title: Customer evidence journey map
    type: journey-map
    summary: >-
      Public evidence supports early commercialization steps and buyer intent, but the later deployment, reference, and
      expansion stages still lack named proof.
    data:
      items:
        - label: Target account thesis
          touchpoints:
            - >-
              Semiconductor organizations are the most plausible buyers because Fab2 describes fabs, tools, and design
              software rather than a consumer product.
        - label: Technical evaluation
          touchpoints:
            - >-
              Compact and software-defined fabs are described as enabling rapid prototyping and small-scale chip
              production.
        - label: Readiness buildout
          touchpoints:
            - >-
              Hiring pages focus on production release, materials flow, and recurring or high-volume manufacturing
              support.
        - label: Customer dialogue
          touchpoints:
            - The founders' office is described as a point of contact with investors, customers, and partners.
        - label: Named deployment proof
          touchpoints:
            - No named production customer, pilot, or customer-quoted outcome appears in the assigned pool.
        - label: Renewal and expansion proof
          touchpoints:
            - >-
              No public NRR, churn, multi-site expansion, or top-customer concentration metric appears in the assigned
              pool.
    approximationNotes: >-
      This journey map reflects the state of public evidence rather than measured conversion. It should not be read as a
      quantified funnel or proof that later stages are already occurring.
