        - Down-round risk, preference overhang, and strategic optionality narrowing
        - Explicitly supported by the assigned adverse commentary
    notes: >-
      Scenarios are qualitative because the assigned sources support financing milestones and downside commentary better
      than they support revenue-based or margin-based modeling.
    claimRefs:
      - CV006
      - CV008
      - CV009
      - CV010
      - CV011
      - CV014
