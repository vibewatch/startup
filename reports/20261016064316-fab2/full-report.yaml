  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Public evidence points to industrial semiconductor buyers, not to a documented installed base
        blocks:
          - type: paragraph
            body: >-
              The assigned pool is good enough to outline Fab2's intended customer surface even though it does not prove
              current adoption. Independent profiles and company-syndicated hiring pages consistently describe Fab2 as
              building compact modular fabs, the tools and components that feed those fabs, and supporting design
              software. Baidu's profile adds the clearest use-case framing by describing software-defined fabs that can
              complete prototyping cycles within a few hours. That combination points to semiconductor R&D,
              device-development, and early manufacturing organizations as the most plausible buyer and user set. It
              does not, however, establish how many such accounts are live, paying, or in production.
            claimRefs:
              - CU001
              - CU002
              - CU009
          - type: table
            tableRef: TU001
            claimRefs:
