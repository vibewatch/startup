              - CE006
              - CE007
              - CE008
              - CE010
              - CE011
      - number: '5.3'
        title: Maturity signals are real, but they are staffing and facility signals more than customer-proof
        blocks:
          - type: paragraph
            body: >-
              Public maturity evidence exists, but it is mostly indirect. The official site lists three operating sites
              — a 120K square foot Austin chip fab, a 30K square foot Lockhart "fab fab," and a 25K square foot San
              Francisco garage fab — which suggests a multi-site development and manufacturing footprint. Third-party
              profiles echo a compact or software-defined fab concept and browser-based EDA surface, and recruiting
              materials show the company hiring for precision systems, process/device engineering, robotics software,
              and hardware program management. That combination supports differentiation around vertical integration and
              manufacturing know-how, but it does not yet verify production maturity: the assigned pool does not
              disclose target nodes, yields, throughput, shipped-fab counts, supported design flows, or named customer
              deployments.
            claimRefs:
              - CE002
              - CE004
              - CE008
              - CE009
              - CE011
      - number: '5.4'
        title: Compliance language exists, but public trust and proof surfaces remain thin and noisy
        blocks:
          - type: paragraph
            body: >-
              Trust, safety, and quality control are where the public record is weakest. Multiple recruiting pages state
              that technical roles are subject to U.S. export controls, which is a real compliance signal, but the
              assigned pool does not include a public status page, security documentation, certification surface, or
              published quality metrics. Diligence is also made harder by noisy external discovery: one assigned SEC
              result is actually an Applied Optoelectronics "FAB2 Manufacturing Cleanroom Project," and one third-party
              job aggregator page titled "Fab2" contains Atomic Machines "Matter Compiler" copy. The practical takeaway
              is that investors should trust direct URLs more than keyword-only search results and should ask management
              for first-party reliability, quality, and deployment evidence rather than inferring maturity from
              brand-forward product language.
            claimRefs:
              - CE010
              - CE012
              - CE013
              - CE014
