              - CU002
              - CU003
              - CU009
      - number: '6.2'
        title: The strongest public signals are commercialization readiness proxies rather than deployment proof
        blocks:
          - type: paragraph
            body: >-
              Fab2's visible customer-stage evidence is operational rather than customer-referential. The technical
              program manager and materials-management listings emphasize moving tools and components from R&D builds
              into production release, plus supporting recurring or high-volume manufacturing. The executive-assistant
              role also says the founders' office is a point of contact with investors, customers, and partners, which
              suggests active commercial dialogue. But the same public record still does not disclose customer volume,
              shipped-fab counts, or named deployment outcomes. The result is a chapter where readiness is observable
              but adoption remains largely unverified.
            claimRefs:
              - CU003
              - CU004
              - CU005
              - CU013
