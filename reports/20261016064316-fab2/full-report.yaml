        title: Exhibits
        blocks:
          - type: callout
            title: Vertical integration is the core product thesis
            body: >-
              The strongest supported differentiation is not a single fab or software module; it is the attempt to own
              design software, components, tools, process engineering, and fab assembly as a single operating stack.
            calloutType: insight
            claimRefs:
