          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU002
              - CU003
              - CU004
              - CU007
              - CU012
              - CU013
      - number: '6.3'
        title: Retention, expansion, and concentration are still private-data questions
        blocks:
          - type: paragraph
            body: >-
              The customer-durability layer is mostly missing from the assigned pool. Silicon Valley Invest Club
              explicitly says it could not identify publicly reported revenue, ARR, or profitability figures, and the
              customer-oriented sources in this pool do not add NRR, GRR, churn, renewal, contract length,
              installed-base expansion, or top-customer concentration data. That means there is no public basis for a
              land-and-expand thesis, no denominator for repeat purchasing, and no way to gauge whether one or two
              lighthouse accounts dominate the commercial story. Any investment case that assumes sticky recurring
              demand would still be underwriting management assertions rather than public evidence.
            claimRefs:
              - CU006
              - CU007
              - CU012
          - type: table
            tableRef: TU003
            claimRefs:
              - CU005
              - CU007
              - CU010
              - CU011
              - CU012
              - CU014
      - number: '6.4'
        title: Customer discovery is also impaired by noisy name matches
        blocks:
          - type: paragraph
            body: >-
              A second problem is source quality rather than company performance. Three customer-oriented assigned
              search results were unrelated to Fab2 the startup: a Huawei financial-AI release, a Rockland antibody page
              using the scientific term F(ab')2, and a PebblePad customer-success listing. Those false positives do not
              say anything negative about Fab2's operating execution, but they do make bare-name web discovery
              unreliable for customer diligence. In practice, the chapter needs direct documentary proof such as
              customer case studies, procurement records, conference talks by named users, or customer-quoted press
              releases rather than keyword hits alone.
            claimRefs:
              - CU010
              - CU011
              - CU012
              - CU014
      - number: '6.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public customer-proof gap
            body: >-
              The chapter can identify likely buyer personas and commercialization prep, but it cannot verify a public
              installed base, named deployments, or retention because those artifacts are absent from the assigned pool.
            calloutType: risk
            claimRefs:
              - CU001
              - CU003
              - CU005
              - CU007
              - CU012
          - type: callout
            title: Highest-priority diligence ask
            body: >-
              Request a current customer ledger that shows named accounts, contract type, production versus pilot
              status, order value, repeat purchase history, and top-customer concentration; without that package,
              expansion and durability remain assumptions.
            calloutType: recommendation
            claimRefs:
              - CU006
              - CU007
              - CU012
              - CU013
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory and legal diligence is still mostly a readiness question
        blocks:
          - type: paragraph
            body: >
              Public evidence in the assigned pool does not show a confirmed enforcement action, recall, or named
              lawsuit against Fab2, but it also does not close the legal file. The cleanest company-specific compliance
              signal is operational rather than declarative: Fab2's September 2026 Technical Program Manager listing
              makes any offer contingent on the candidate's ability to comply with U.S. export controls, which means
              deemed-export screening is already relevant to at least one hardware role. That matters because Fab2 is
              building semiconductor tools, controls, and manufacturing process equipment rather than a purely software
              product.


              The harder gap is everything around permits, industrial safety, and IP posture. Multiple 2026 sources
              describe an Austin R&D and production site plus a Lockhart "fab fab" facility, but none of the retained
              evidence includes the underlying environmental, hazardous-material, fire-safety, or commissioning record
              that would prove the facilities are fully cleared for the production plan implied by the raise. Likewise,
              the only assigned adverse legal result resolved to a generic Law360 Massachusetts news index rather than a
              Fab2-specific docket, so the chapter cannot treat "no incident found" as "no legal risk." The right read
              is that legal and regulatory risk is unverified, not absent.
            claimRefs:
              - CR006
              - CR007
              - CR008
              - CR009
              - CR010
              - CR013
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR007
              - CR008
              - CR009
              - CR013
      - number: '7.2'
        title: The core operating risk is building a compact-fab platform fast enough to justify the round
        blocks:
          - type: paragraph
            body: >
              The operating thesis asks Fab2 to do several hard things at once: build fab tools and components in-house,
              assemble them into compact fabs, and shorten design-to-prototype cycles with software-defined
              manufacturing and browser-based design software. BigGo's July 2026 coverage makes the central technical
              trade-off explicit by describing the current battleground as prototype development, R&D, and low-volume
              production rather than the high-throughput 300mm economics of TSMC, Samsung, or Intel. That framing is not
              fatal, but it does mean the business still needs to prove that the compact-fab architecture can translate
              from an intriguing manufacturing concept into a repeatable commercial system.


              Hiring signals reinforce that this translation is still in progress. Fab2 was recruiting a Technical
              Program Manager to move fab tools and components from requirements definition to production release,
              maintain the critical path, surface technical risks early, and manage the handoff from R&D builds into
              production ramp. That is exactly the role a company hires when integration, sequencing, and schedule risk
              are first-order constraints. The issue is amplified by the Texas footprint: Austin, Lockhart, and San
              Francisco provide redundancy of sorts, but the manufacturing center of gravity appears concentrated in the
              Texas buildout, so any permitting, utility, construction, or staffing delay can hit both timeline and
              credibility.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
              - CR005
              - CR008
              - CR011
              - CR014
          - type: table
            tableRef: TR002
            claimRefs:
              - CR002
              - CR003
              - CR004
              - CR008
              - CR014
          - type: table
            tableRef: TR003
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR011
              - CR014
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR003
              - CR004
              - CR005
              - CR006
              - CR009
              - CR010
              - CR011
              - CR012
              - CR013
              - CR014
      - number: '7.3'
        title: Capital, dependency, and thesis-break risk outrun the current public proof set
        blocks:
          - type: paragraph
            body: >
              The September 2026 financing is both a mitigation and a risk amplifier. Raising $500 million gives Fab2
              meaningful time and cash to staff, equip, and test a hardware-heavy strategy, but the same round also set
              a $3.7 billion benchmark before the retained public pool shows basic commercialization proof such as
              disclosed revenue, customer volume, shipped-fab count, or yield metrics. Simplify's public company
              snapshot explicitly says those proof points were still undisclosed as of September 2026, while Silicon
              Valley Invest Club still surfaced only the 2023 seed and roughly $100 million valuation. Even if that
              older profile is stale rather than wrong, the discrepancy itself shows how thin and noisy the external
              disclosure surface remains.


              That combination drives the investment implication. The round cannot be underwritten as "already
              de-risked" simply because the syndicate is strong. Until Fab2 can show permits, throughput or yield
              evidence, named production deployments, and a cleaner legal and corporate record across public data
              providers, the biggest thesis-breakers remain measurable: failure to commission the Texas footprint on
              time, failure to translate prototype positioning into production economics, or a follow-on financing reset
              caused by missing operating milestones against a very high entry price.
            claimRefs:
              - CR005
              - CR006
              - CR010
              - CR011
              - CR012
              - CR014
      - number: '7.4'
        title: Exhibits
        blocks:
          - type: callout
            title: The main risk is not lack of capital; it is lack of public operating proof at a very high price.
            body: >-
              Fab2 has fresh capital, but the assigned evidence pool still lacks disclosed revenue, customer volume,
              shipped-fab counts, and yield data commensurate with a $3.7B September 2026 valuation.
            calloutType: risk
            claimRefs:
              - CR006
              - CR010
              - CR011
              - CR014
          - type: callout
            title: Texas buildout compresses several risks into one execution path.
            body: >-
              Because public 2026 sources place research, production, and the fab-making operation across Austin and
              Lockhart, delays in permitting, staffing, utilities, or commissioning can hit both operational milestones
              and future fundraising optics.
            calloutType: risk
            claimRefs:
              - CR001
              - CR008
              - CR014
          - type: callout
            title: Diligence should force documentary proof, not narrative reassurance.
            body: >-
              Before underwriting scale, request facility permits, export-control controls, stage-gate and yield
              metrics, named production deployments, and direct litigation/IP searches on Fab2 and Atomic Semi.
            calloutType: recommendation
            claimRefs:
              - CR007
              - CR008
              - CR009
              - CR010
              - CR013
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and price discipline
        blocks:
          - type: paragraph
            body: >-
              The strongest public fact in the valuation record is the round itself: Wilson Sonsini, FundedIQ, and
              Venture Capital Tracker all anchor Fab2 around a September 2026 financing at a $3.7 billion valuation.
              That is enough to treat $3.7 billion as the current public price anchor rather than an outdated seed-era
              mark. It is not enough to treat the price as fully underwritten. Silicon Valley Invest Club says no
              publicly reported revenue, ARR, or profitability figures were identified in its source set, and Simplify's
              critical summary says Fab2 still lacks disclosed revenue, yields, customer volume, or shipped-fab counts
              as of September 2026. With price well supported but operating proof still sparse, the public-evidence
              stance is research-more: track the company, demand hard operating evidence, and avoid paying above the
              latest round on the basis of narrative momentum alone.
            claimRefs:
              - CV001
              - CV002
              - CV005
              - CV006
              - CV012
              - CV013
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV006
              - CV012
              - CV013
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV002
              - CV006
              - CV008
              - CV010
              - CV012
              - CV013
      - number: '8.2'
        title: Valuation context and reference points
        blocks:
          - type: paragraph
            body: >-
              The public round narrative is richer than the public operating narrative. Wilson Sonsini names the $500
              million Series A syndicate, while Dealroom adds a prior roughly $15 million seed led by the OpenAI Startup
              Fund at about a $100 million valuation and says the latest step-up represents nearly 37x valuation growth
              in under three years. FundedIQ, by contrast, records only one funding round on record and $500 million
              total raised, which means third-party directories still disagree on Fab2's cumulative capital history.
              That disagreement matters because valuation context is already being carried by private-round benchmarking
              rather than disclosed revenue multiples. Dealroom's peer framing is also milestone-based: it places Fab2
              beside other heavily financed semiconductor-equipment and foundry challengers rather than beside audited
              public operating comps. The comparables lens is therefore useful for understanding investor appetite, but
              weak for proving that the current price is cheap.
            claimRefs:
              - CV001
              - CV003
              - CV004
              - CV005
              - CV010
              - CV011
          - type: table
            tableRef: TV002
            claimRefs:
              - CV001
              - CV005
              - CV007
              - CV008
              - CV010
              - CV011
      - number: '8.3'
        title: Scenario framing and downside triggers
        blocks:
          - type: paragraph
            body: >-
              The bull, base, and bear cases are all milestone-gated because Fab2 is trying to build a full-stack
              manufacturing system, not a lightweight software SKU. Company-linked role pages and Baidu's profile
              consistently describe an in-house stack spanning tools, components, and compact fabs, while the
              materials-management hiring page describes the move from prototype builds toward recurring or high-volume
              manufacturing. That breadth creates upside if Fab2 can turn capital into real deployments, but it also
              concentrates execution risk. Simplify's critical summary is the cleanest adverse framing in the assigned
              pool: the $3.7 billion valuation prices enormous execution, and competing 300mm foundries and captive fabs
              can outspend Fab2 before its Texas buildout scales. The base case therefore cannot assume that the
              financing alone proves commercial readiness; it needs operating evidence that the company has not yet
              disclosed publicly.
            claimRefs:
              - CV007
              - CV008
              - CV009
              - CV010
              - CV011
              - CV012
          - type: table
            tableRef: TV003
            claimRefs:
              - CV006
              - CV008
              - CV009
              - CV010
              - CV011
              - CV014
      - number: '8.4'
        title: What would move the call
        blocks:
          - type: paragraph
            body: >-
              The next diligence steps are straightforward even if the answers are not public. A more constructive
              valuation stance would require evidence on customer concentration, shipped-fab counts, manufacturing
              yields, and whether any software, tool, or fab revenue is recurring and gross-margin accretive. The cap
              table also matters: the public record names the round and some investors, but not liquidation preferences,
              participation, anti-dilution terms, debt, or project-finance obligations. Until those items are known,
              underwriting should assume that price discipline matters more than brand-name momentum. The clearest
              thesis-break triggers are a down-round or structured insider-led financing, continued absence of customer
              and yield disclosure after buildout milestones, or evidence that Fab2's compact-fab model cannot clear the
              incumbent cost and scale advantage cited in the adverse commentary.
            claimRefs:
              - CV006
              - CV010
              - CV012
              - CV013
              - CV014
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Public recommendation
            body: >-
              Fab2 is interesting enough to track because the latest round is real and large, but the assigned public
              evidence still does not justify paying more than the latest round mark on faith alone.
            calloutType: recommendation
            claimRefs:
              - CV001
              - CV002
              - CV012
              - CV013
          - type: callout
            title: What could break the thesis
            body: >-
              The fastest ways to invalidate the current underwriting story are a structured or down-round follow-on,
              continued nondisclosure on customer and yield proof after buildout milestones, or evidence that incumbents
              can keep Fab2 trapped below commercial scale.
            calloutType: risk
            claimRefs:
              - CV006
              - CV010
              - CV014
