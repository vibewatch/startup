      - number: '5.2'
        title: >-
          Public technical evidence points to an in-house stack spanning precision tools, process engineering, and
          device characterization
        blocks:
          - type: paragraph
            body: >-
              The most useful technical detail in the assigned pool comes from engineering job descriptions. A
              mechanical-design posting says Fab2's precision team builds lithography, metrology, and motion systems
              that pattern, inspect, and characterize chips, while the Ashby device role describes an in-house process
              group that simultaneously develops recipes, applies novel materials, characterizes chips, and
              troubleshoots tools. The Technical Program Manager role adds an operating layer above that engineering
              depth by describing cross-functional execution across mechanical, electrical, embedded/software, and
              production teams from requirements to production release. Taken together, the public surface supports a
              real architecture thesis: Fab2 is building software, components, tools, process knowledge, and fab
              assembly as one coordinated system rather than as isolated point products.
            claimRefs:
              - CE001
              - CE003
              - CE005
              - CE006
              - CE007
              - CE008
              - CE011
          - type: table
            tableRef: TE003
            claimRefs:
              - CE003
              - CE004
