          to: investor-support
          label: validated by
        - from: investor-support
          to: operating-proof
          label: does not replace
        - from: operating-proof
          to: capital-intensity
          label: matters more because
        - from: capital-intensity
          to: downside-risk
          label: amplifies
        - from: downside-risk
          to: recommendation
          label: drives
    approximationNotes: >-
