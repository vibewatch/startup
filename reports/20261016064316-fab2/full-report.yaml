              - CI014
              - CI016
      - number: '4.2'
        title: Public evidence points to a buildout-first, capital-intensive operating model
        blocks:
          - type: paragraph
            body: >-
              The strongest financial evidence is on capital formation and facility buildout rather than recurring
              revenue. Dealroom reports a $500 million Series A in September 2026, while Yahoo Finance reports roughly
              $3.9 million of Austin warehouse renovation into office and R&D space through February 2027. The Technical
              Program Manager role is framed around moving fab tools and components from requirements through production
              release and ramp, which is consistent with a hardware-heavy commercialization path. Those inputs support a
              view that Fab2 is funding engineering capacity, facilities, and manufacturing readiness first. Public
              evidence still does not establish whether that spending is supported by customer cash inflows, project
              finance, or only venture equity.
            claimRefs:
              - CI001
              - CI004
              - CI006
              - CI014
              - CI015
          - type: table
            tableRef: TI003
            claimRefs:
              - CI004
              - CI009
              - CI010
              - CI014
              - CI016
      - number: '4.3'
        title: Revenue quality, sales efficiency, and runway remain public-data gaps
        blocks:
          - type: paragraph
            body: >-
              The largest underwriting problem is not the absence of a story; it is the absence of the metrics needed to
              test that story. Silicon Valley Invest Club explicitly says no publicly reported revenue, ARR, or
              profitability figures were identified in the source set it used, and Simplify's critical summary says Fab2
              still lacks disclosed revenue, yields, customer volume, and shipped-fab counts as of September 2026. The
              assigned sources also do not disclose cash balance, burn, debt facilities, working capital, CAC, payback,
              or sales cycle. That leaves only weak public proxies such as employee counts, hiring language, and
              facility spending. Those proxies help frame capital intensity, but they do not answer whether the company
              has repeatable unit economics or enough liquidity to reach scale.
            claimRefs:
              - CI009
              - CI010
              - CI012
              - CI014
              - CI016
      - number: '4.4'
        title: Financial verdict
        blocks:
          - type: paragraph
            body: >-
              The current public record supports a narrow verdict: Fab2 appears able to raise very large equity rounds
              for a semiconductor-manufacturing thesis, and it appears to be converting that capital into facilities and
              production-capability buildout. The same record does not support an underwriting view on realized revenue,
              margin path, customer concentration, or runway. Third-party directories also disagree on cumulative
              capital raised because some profiles still show seed-era totals while others reflect the 2026 Series A,
              which is a reminder that directory data should not be treated as audited. Financial diligence should
              therefore focus on booked orders, shipment history, contract structure, gross margin by program, and an
              up-to-date cash and debt schedule before any valuation case is underwritten.
            claimRefs:
              - CI001
              - CI002
              - CI003
              - CI014
              - CI016
      - number: '4.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Underwriting gap
            body: >-
              Fresh equity and visible site spending do not establish runway, because the public source set still omits
              cash balance, debt, burn, customer volume, and shipped-product evidence.
            calloutType: risk
            claimRefs:
              - CI001
              - CI004
              - CI009
              - CI010
              - CI014
              - CI016
          - type: callout
            title: Buildout-first monetization
            body: >-
              Public evidence is strongest on capital formation and production readiness, while realized pricing and
              revenue-quality signals remain absent.
            calloutType: insight
            claimRefs:
              - CI004
              - CI006
              - CI011
              - CI014
  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Delivered surfaces center on vertically integrated fab infrastructure plus browser-based design software
        blocks:
          - type: paragraph
            body: >-
              Fab2's public product definition is broader than a single chip or software SKU. The official site says the
              company designs the hardware and software needed to make chips and makes the fabs, tools, and components
              itself, while naming two visible surfaces: the "fab fab" that mass-produces fab equipment and Studio, an
              in-browser collaborative EDA environment. Public recruiting and third-party summaries reinforce that the
              company is not just selling software; it is trying to control the design, tool, and factory layers
              together. That matters for diligence because the product promise is a full manufacturing stack, but public
              evidence is still much stronger on product intent than on customer deployments, shipped units, or proven
              economics.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE009
