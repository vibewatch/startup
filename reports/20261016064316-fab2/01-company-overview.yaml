company:
  name: "Fab2"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Fab2 is an Austin-oriented semiconductor startup that says it is vertically integrating the hardware, software, and factory systems needed to mass-produce compact fabs. The strongest public anchors in the assigned pool are the reported September 2026 $500 million Series A at a $3.7 billion valuation, the July 2026 Atomic Semi-to-Fab2 rebrand, and public Texas buildout filings that support some expansion activity while also leaving its claimed facility footprint and key private operating metrics unresolved."
sections:
  - id: "identity-and-positioning"
    title: "Identity, model, and current footprint"
    body: "Fab2 presents itself as a semiconductor manufacturer rather than a pure software company. Across multiple company-issued job listings syndicated through Simplify, the company says it designs the hardware and software needed to make chips and builds the fabs, tools, and components itself. Third-party summaries echo that vertically integrated positioning and tie the business to compact or software-defined fabs. The current footprint is Texas-led, with repeated references to Austin plus Lockhart and San Francisco sites, but that footprint should be treated as directionally supported rather than fully verified because the strongest independent local reporting also questions parts of the Texas facility narrative."
    claimRefs: ["CO001", "CO004", "CO005", "CO012", "CO014"]
    tableRefs: ["TO001"]
  - id: "leadership-and-governance"
    title: "Founders, leadership, and governance visibility"
    body: "The assigned pool consistently links Fab2 to Sam Zeloof and Jim Keller, giving later chapters a stable founder identity even though other governance details remain thin. Company-issued hiring pages name both as founders, while public job materials say Sam Zeloof is the current CEO and Dealroom also identifies him as co-founder and chief executive. Jim Keller clearly contributes industry credibility and recruiting magnetism, but the assigned evidence also ties him to Tenstorrent leadership, which means investors should clarify his formal operating role, board authority, and day-to-day bandwidth instead of assuming continuous full-time involvement at Fab2."
    claimRefs: ["CO002", "CO003", "CO004"]
    tableRefs: ["TO002"]
  - id: "capitalization-and-scale"
    title: "Funding, valuation, and scale signals"
    body: "Public fundraising evidence is unusually strong relative to the operating disclosure. Dealroom reports a September 2026 Series A of $500 million at a $3.7 billion valuation led by Protagonist, while third-party profiles also point to an earlier roughly $15 million seed led by OpenAI Startup Fund at about a $100 million valuation. Those financings give Fab2 substantial signaling power, but the assigned pool still does not disclose revenue, ARR, yields, shipped-fab counts, or customer volume. Headcount is also imprecise: third-party summaries cluster around 105 to 106 employees, whereas company-syndicated listings use a much wider 51-200 band."
    claimRefs: ["CO010", "CO011", "CO012", "CO013"]
    tableRefs: ["TO003"]
  - id: "milestones-and-open-questions"
    title: "Milestones, expansion evidence, and diligence gaps"
    body: "The chapter's milestone record is good enough to establish sequencing but not to settle execution risk. Third-party sources say the company began as Atomic Semi, raised its seed in 2023, rebranded to Fab2 in July 2026, and then announced a much larger September 2026 financing. Independent reporting from the Austin American-Statesman adds a harder operational datapoint by linking Fab2 to Texas buildout filings for office and R&D space. That same reporting is also the chapter's most important caution signal because it found public support for some claimed Austin and Lockhart footprint details was incomplete. Combined with unresolved founding-date and headcount discrepancies, later diligence should prioritize documentary verification over narrative momentum."
    claimRefs: ["CO005", "CO006", "CO007", "CO008", "CO009", "CO010", "CO013"]
    figureRefs: ["FO001"]
