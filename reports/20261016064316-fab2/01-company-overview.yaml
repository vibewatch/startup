    columns: ["Stakeholder", "Role", "Control or economic importance", "Diligence ask"]
    rows:
      - ["Sam Zeloof", "Co-founder / CEO", "Appears to be the clearest operating decision-maker in the assigned pool and likely a key holder of technical and recruiting context.", "Request current title, board seat status, ownership, and succession coverage."]
      - ["Jim Keller", "Co-founder / technical brand anchor", "Adds external credibility and semiconductor network effects, but his outside CEO role implies possible bandwidth limits.", "Clarify formal Fab2 remit, compensation, and decision rights."]
      - ["OpenAI Startup Fund", "Named seed lead investor", "Only explicitly named lead on the early round in the assigned pool; likely shaped early financing and signaling.", "Request seed documents, ownership, pro rata rights, and any governance protections."]
