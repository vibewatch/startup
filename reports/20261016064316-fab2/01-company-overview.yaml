      - ["Headquarters", "Austin, Texas", "2026", "Medium", "Texas HQ positioning is repeated across sources, but independent local reporting questions some facility specifics."]
      - ["Founded", "Conflicting: 2022 or 2023", "2022-2023", "Medium", "Third-party profiles say 2022, while company-syndicated listings and an aggregator profile say 2023."]
      - ["Current stage", "Series A", "2026", "High", "Stage is consistent across job-post metadata and the reported September 2026 financing."]
      - ["Business model", "Vertically integrated compact-fab builder spanning tools, components, fabs, and design software", "2026", "High", "Business-model wording is company-led and not yet benchmarked against shipped customer deployments."]
      - ["Total raised", "$515M publicly traceable ($15M seed + $500M Series A)", "2023-2026", "Medium", "The figure aggregates third-party reported rounds; no company cap table or filing is in the assigned pool."]
      - ["Latest valuation", "$3.7B", "2026-09", "High", "Reported by Dealroom and echoed in company-syndicated summaries, but not confirmed by a filing."]
