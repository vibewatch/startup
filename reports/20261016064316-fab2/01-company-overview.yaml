      - ["Customer / shipment disclosure", null, "2026", "Low", "Assigned sources do not disclose customer count, shipped-fab count, or yield metrics."]
      - ["Operating locations", "Austin, Lockhart, and San Francisco are repeatedly referenced", "2026", "Medium", "Independent verification of the full Texas footprint remains incomplete."]
    notes: "Public-source snapshot as of the run date; null values mark metrics not disclosed in the assigned pool, and conflicting rows preserve unresolved source disagreement rather than forcing a single number."
