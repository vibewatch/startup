      - ["Jim Keller", "Co-founder and semiconductor figurehead", "Veteran chip architect linked in public coverage to AMD, Apple, Tesla, and Tenstorrent.", "Adds credibility with investors, hires, and semiconductor ecosystem contacts.", "High: formal Fab2 operating scope, board role, and time allocation are not fully disclosed."]
    notes: "Publicly named founder/leadership coverage only; the assigned pool does not disclose the full board, observer set, or internal decision-rights map."
