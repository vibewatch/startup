evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: commercial-disclosure
    missingEvidence: >-
      Revenue, ARR, customer count, shipped-fab count, yield, and gross-margin disclosures or equivalent management
      reporting.
    whyItMatters: The reported valuation is hard to judge without commercialization, unit economics, or shipment evidence.
    diligencePath: >-
      Request current board materials or management KPI packs covering bookings, revenue, installed base, and customer
      concentration.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: founding-and-headcount
    missingEvidence: An authoritative incorporation timeline and a dated employee-count snapshot.
    whyItMatters: >-
      Founding-date and headcount disagreements affect maturity, velocity, and valuation narrative comparisons across
      later chapters.
    diligencePath: >-
      Request certificate of incorporation history, rebrand documentation, and a payroll or HRIS headcount export dated
      near the run window.
    relatedQuestionRefs:
      - QO006
    relatedTableRefs:
      - TO001
  - type: enumeration-incomplete
    severity: material
    topic: governance-map
    missingEvidence: Current board seats, observer rights, and formal decision-rights mapping for founders and investors.
    whyItMatters: >-
      Key-person dependency and control risk cannot be assessed cleanly without knowing who actually governs financing,
      strategy, and operating priorities.
    diligencePath: Request the current board deck, cap table, voting agreements, and any investor rights side letters.
    relatedQuestionRefs:
      - QO002
    relatedTableRefs:
      - TO002
  - type: enumeration-incomplete
    severity: material
    topic: investor-economics
    missingEvidence: Detailed ownership, liquidation preferences, secondaries, and any debt or credit facilities.
    whyItMatters: >-
      Public investor names alone do not show dilution, downside protection, or who controls the next financing
      decision.
    diligencePath: Request seed and Series A financing documents, updated cap table, secondary history, and debt schedules.
    relatedQuestionRefs:
      - QO004
    relatedTableRefs:
      - TO003
  - type: missing-source
    severity: material
    topic: sizing-gap
    missingEvidence: >-
      An independent market dataset quantifying compact fabs, prototype fabs, or distributed semiconductor-manufacturing
      spend.
    whyItMatters: >-
      Without a category-specific denominator, valuation and comparable-company signals cannot be converted into a
      defensible TAM, SAM, or SOM.
    diligencePath: >-
      Obtain analyst-market-data, public-company disclosures, or customer procurement evidence that isolates the spend
      category Fab2 is actually targeting.
    relatedQuestionRefs:
      - QM002
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: pricing-gap
    missingEvidence: >-
      Comparable list pricing, contract structure, pilot terms, and throughput-based commercial metrics for Fab2 and the
      alternatives.
    whyItMatters: >-
      Without price and contract evidence, the chapter can compare scope and positioning but cannot test whether Fab2 is
      actually cheaper or easier to adopt.
    diligencePath: >-
      Request customer proposals, pilot contracts, or procurement records showing price per prototype run, equipment
      package, or fab deployment.
    relatedQuestionRefs:
      - QP007
    relatedTableRefs:
      - TP003
  - type: private-evidence-only
    severity: material
    topic: commercial-transparency
    missingEvidence: Shipped-fab counts, yields, utilization, node support, customer references, and renewal or repeat-usage evidence.
    whyItMatters: >-
      Those metrics determine whether Fab2's breadth creates durable switching cost or only an expensive concept
      advantage.
    diligencePath: >-
      Request customer case studies, fab deployment metrics, and operating dashboards tied to the current facility
      footprint.
    relatedQuestionRefs:
      - QP005
      - QP008
  - type: conflicting-data
    severity: minor
    topic: founding-date
    missingEvidence: >-
      A definitive primary record confirming whether external materials should anchor Fab2's founding year to 2022 or
      2023.
    whyItMatters: >-
      The discrepancy is not central to the moat thesis, but it weakens confidence in low-level profile data used for
      competitor context.
    diligencePath: >-
      Confirm incorporation and first operating date from primary corporate records or a company-provided cap-table
      chronology.
    relatedQuestionRefs:
      - QP008
  - type: missing-source
    severity: material
    topic: pricing-transparency
    missingEvidence: Customer contracts or price sheets showing SKU-level pricing, minimum commitments, and discount structure.
    whyItMatters: Without realized pricing evidence, revenue quality and gross-margin assumptions are speculative.
    diligencePath: Request current price lists, executed contract examples, and any evidence of realized ASPs by product line.
    relatedQuestionRefs:
      - QI002
      - QI008
    relatedTableRefs:
      - TI002
  - type: private-evidence-only
    severity: material
    topic: sales-efficiency
    missingEvidence: Funnel, sales-cycle, CAC, payback, and booked-order data by customer type.
    whyItMatters: Public hiring language cannot substitute for evidence that customer acquisition and deployment scale economically.
    diligencePath: Request pipeline conversion metrics, sales-cycle medians, CAC, payback, and order backlog by quarter.
    relatedQuestionRefs:
      - QI003
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: blocking
    topic: liquidity
    missingEvidence: >-
      Current cash balance, monthly burn, debt or project-finance obligations, and minimum liquidity covenant
      information.
    whyItMatters: A fresh financing round does not establish runway or financing dependency without cash and obligation data.
    diligencePath: Request the latest cash waterfall, debt schedule, monthly burn bridge, and board-approved operating plan.
    relatedQuestionRefs:
      - QI006
      - QI008
    relatedTableRefs:
      - TI003
  - type: missing-source
    severity: material
    topic: revenue-quality
    missingEvidence: Shipped-fab counts, customer count, recognized revenue, and gross margin by program or product.
    whyItMatters: These are the core datapoints needed to test whether the manufacturing thesis is becoming an economic business.
    diligencePath: Request shipped-system history, active-customer count, recognized revenue by stream, and gross-margin detail.
    relatedQuestionRefs:
      - QI001
      - QI005
      - QI008
    relatedTableRefs:
      - TI001
      - TI003
  - type: missing-source
    severity: material
    topic: trust-and-documentation
    missingEvidence: Public status, security, certification, QA/QC, or reliability documentation for Fab2's product and factory stack.
