schemaVersion: report-v2
artifact: customers
slug: fab2
runDate: 2026-10-16
company:
  name: Fab2
chapter:
  number: 6
  title: Customers
  summary: >-
    The assigned pool shows who Fab2 likely wants to sell to, but it does not provide public
    proof of a real installed base. Public materials point to semiconductor R&D and
    manufacturing buyers that would value compact fabs, in-house tooling, and rapid prototyping,
    while the strongest counter-signal is that the same source set still lacks disclosed customer
    volume, shipped-fab counts, retention metrics, or named deployment references.
sections:
  - id: customer-surface
    title: Public evidence points to industrial semiconductor buyers, not to a documented installed base
    body: >-
      The assigned pool is good enough to outline Fab2's intended customer surface even though it
      does not prove current adoption. Independent profiles and company-syndicated hiring pages
      consistently describe Fab2 as building compact modular fabs, the tools and components that
      feed those fabs, and supporting design software. Baidu's profile adds the clearest use-case
      framing by describing software-defined fabs that can complete prototyping cycles within a
      few hours. That combination points to semiconductor R&D, device-development, and early
      manufacturing organizations as the most plausible buyer and user set. It does not,
      however, establish how many such accounts are live, paying, or in production.
    claimRefs: [CU001, CU002, CU009]
    tableRefs: [TU001]
  - id: adoption-and-readiness
    title: The strongest public signals are commercialization readiness proxies rather than deployment proof
    body: >-
      Fab2's visible customer-stage evidence is operational rather than customer-referential.
      The technical program manager and materials-management listings emphasize moving tools and
      components from R&D builds into production release, plus supporting recurring or
      high-volume manufacturing. The executive-assistant role also says the founders' office is a
      point of contact with investors, customers, and partners, which suggests active commercial
      dialogue. But the same public record still does not disclose customer volume, shipped-fab
      counts, or named deployment outcomes. The result is a chapter where readiness is observable
      but adoption remains largely unverified.
    claimRefs: [CU003, CU004, CU005, CU013]
    tableRefs: [TU002]
    figureRefs: [FU001]
  - id: durability-expansion-and-concentration
    title: Retention, expansion, and concentration are still private-data questions
    body: >-
      The customer-durability layer is mostly missing from the assigned pool. Silicon Valley
      Invest Club explicitly says it could not identify publicly reported revenue, ARR, or
      profitability figures, and the customer-oriented sources in this pool do not add NRR, GRR,
      churn, renewal, contract length, installed-base expansion, or top-customer concentration
      data. That means there is no public basis for a land-and-expand thesis, no denominator for
      repeat purchasing, and no way to gauge whether one or two lighthouse accounts dominate the
      commercial story. Any investment case that assumes sticky recurring demand would still be
      underwriting management assertions rather than public evidence.
    claimRefs: [CU006, CU007, CU012]
    tableRefs: [TU003]
  - id: evidence-quality
    title: Customer discovery is also impaired by noisy name matches
    body: >-
      A second problem is source quality rather than company performance. Three customer-oriented
      assigned search results were unrelated to Fab2 the startup: a Huawei financial-AI release,
      a Rockland antibody page using the scientific term F(ab')2, and a PebblePad customer-success
      listing. Those false positives do not say anything negative about Fab2's operating
      execution, but they do make bare-name web discovery unreliable for customer diligence. In
      practice, the chapter needs direct documentary proof such as customer case studies,
      procurement records, conference talks by named users, or customer-quoted press releases
      rather than keyword hits alone.
    claimRefs: [CU010, CU011, CU012, CU014]
