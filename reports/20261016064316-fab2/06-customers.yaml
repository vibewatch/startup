  evidenceGaps:
    - type: missing-source
      severity: material
      topic: named-customer-proof
      missingEvidence: Named production or pilot customer references, customer-quoted case studies, procurement records, or public conference talks by identified users.
      whyItMatters: Without direct customer proof, it is not possible to separate buyer intent from deployed adoption.
      diligencePath: Request a current customer list with reference permissions, deployment status, and at least three directly contactable customer references.
      relatedQuestionRefs: [QU003, QU005]
      relatedTableRefs: [TU003]
    - type: private-evidence-only
      severity: material
      topic: retention-and-expansion
      missingEvidence: NRR, GRR, churn, renewal cadence, contract length, repeat purchase history, and multi-site or multi-program expansion data.
      whyItMatters: Durability and land-and-expand assumptions cannot be underwritten without repeat behavior and contract economics.
      diligencePath: Request cohort tables by customer, renewal history, contract term structure, and examples of upsell or repeat orders.
      relatedQuestionRefs: [QU004, QU008]
      relatedTableRefs: [TU002]
    - type: private-evidence-only
      severity: material
      topic: concentration
      missingEvidence: Top-customer share of bookings or revenue, pipeline by stage, and any distributor, partner, or channel dependence.
      whyItMatters: A small number of lighthouse accounts could dominate demand and distort the apparent scale of adoption.
      diligencePath: Request top-10 customer concentration, booked-order history, and channel attribution by account.
      relatedQuestionRefs: [QU006, QU008]
      relatedTableRefs: [TU002, TU003]
