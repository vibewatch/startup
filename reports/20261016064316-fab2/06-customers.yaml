      - ["Chip-design / EDA software", "Buyer/payer likely engineering or design organizations; users likely chip-design teams", "Layout, schematics, simulation, and workflow acceleration around compact fabs", "Only profile-level references in the assigned pool", "Potentially strategic as a higher-frequency customer touchpoint", "No public user count, pricing, or attach-rate evidence"]
    notes: >-
      Public segmentation built only from assigned sources. Buyer, user, and payer roles are
      inferred from the described product surfaces because the pool does not provide named
      customer contracts or organizational charts.
    claimRefs: [CU001, CU002, CU003, CU009]
  - id: TU002
    title: Customer growth / adoption trajectory table
    columns:
      - Metric / proxy
      - Value
      - Date
      - Source
      - Confidence
      - Implication
      - Missing denominator
    rows:
      - ["Production-ramp hiring", "Present across technical program and materials-management roles", "2026", "Simplify job listings", "Medium", "Fab2 is staffing for commercialization readiness and operational scale", "Hiring does not prove paying customers or shipped systems"]
      - ["Founder-office customer interface", "Present", "2026", "HiringCafe executive assistant listing", "Medium", "Management expects direct interaction with customers and partners", "No names, pipeline size, or contract stage disclosed"]
      - ["Public customer volume", null, "2026", "Simplify company summary", "Medium", "Installed-base breadth cannot be underwritten from the assigned pool", "Customer-count denominator is absent"]
      - ["Shipped-fab counts / yields", null, "2026", "Simplify company summary", "Medium", "There is no public deployment-scale proof in the assigned pool", "Shipment and performance denominators are absent"]
      - ["Revenue / ARR / profitability", null, "2026", "Silicon Valley Invest Club", "Medium", "Economic quality and retention durability remain untestable", "No top-line or recurring-revenue denominator is public"]
    notes: >-
      This is a readiness-versus-adoption table. Null values mean the assigned pool does not
      disclose a public metric, not that the company lacks the underlying activity.
    claimRefs: [CU003, CU004, CU005, CU006, CU013]
  - id: TU003
    title: Named customer proof table
    columns:
      - Customer
      - Segment
      - Deployment / use case
      - Production vs pilot
      - Outcome
      - Limitation
    rows:
      - ["No named production customer identified in assigned pool", "Likely semiconductor manufacturing or device-development account", "Undisclosed", "Unverified", "No public production outcome found", "No case study, customer quote, or procurement artifact in the assigned sources"]
      - ["No named pilot or beta customer identified in assigned pool", "Likely prototyping or R&D user", "Rapid-prototyping thesis only", "Unverified", "No pilot outcome found", "Assigned sources describe product intent but not a pilot reference account"]
      - ["No public procurement / review artifact identified in assigned pool", "Enterprise or public-sector buyer, if applicable", "Tender, marketplace review, or third-party deployment artifact absent", "Unverified", "No independent customer validation found", "Customer-oriented search results also include unrelated Fab2 homonyms, reducing search precision"]
    notes: >-
      The table enumerates the public customer-proof artifacts checked in the assigned pool and
      records that they were not found. This is an evidence-status table, not a statement that
      such customers do not exist privately.
    enumerationScope:
      coverage: partial
      basis: Assigned successful prefetched customer-pool URLs checked for named production, pilot, procurement, or customer-quoted deployment evidence as of the run date.
    claimRefs: [CU005, CU007, CU010, CU011, CU012, CU014]
figures:
  - id: FU001
    title: Customer evidence journey map
    type: journey-map
    summary: >-
      Public evidence supports early commercialization steps and buyer intent, but the later
      deployment, reference, and expansion stages still lack named proof.
    data:
      items:
        - label: "Target account thesis"
          touchpoints:
            - "Semiconductor organizations are the most plausible buyers because Fab2 describes fabs, tools, and design software rather than a consumer product."
        - label: "Technical evaluation"
          touchpoints:
            - "Compact and software-defined fabs are described as enabling rapid prototyping and small-scale chip production."
        - label: "Readiness buildout"
          touchpoints:
            - "Hiring pages focus on production release, materials flow, and recurring or high-volume manufacturing support."
        - label: "Customer dialogue"
          touchpoints:
            - "The founders' office is described as a point of contact with investors, customers, and partners."
        - label: "Named deployment proof"
          touchpoints:
            - "No named production customer, pilot, or customer-quoted outcome appears in the assigned pool."
        - label: "Renewal and expansion proof"
          touchpoints:
            - "No public NRR, churn, multi-site expansion, or top-customer concentration metric appears in the assigned pool."
    approximationNotes: >-
      This journey map reflects the state of public evidence rather than measured conversion. It
      should not be read as a quantified funnel or proof that later stages are already occurring.
    claimRefs: [CU001, CU002, CU003, CU004, CU007, CU012, CU013]
callouts:
  - calloutType: risk
    title: Public customer-proof gap
    body: >-
      The chapter can identify likely buyer personas and commercialization prep, but it cannot
      verify a public installed base, named deployments, or retention because those artifacts are
      absent from the assigned pool.
    claimRefs: [CU001, CU003, CU005, CU007, CU012]
  - calloutType: recommendation
    title: Highest-priority diligence ask
    body: >-
      Request a current customer ledger that shows named accounts, contract type, production
      versus pilot status, order value, repeat purchase history, and top-customer concentration;
      without that package, expansion and durability remain assumptions.
    claimRefs: [CU006, CU007, CU012, CU013]
