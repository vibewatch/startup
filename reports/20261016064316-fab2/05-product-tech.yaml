company:
  name: Fab2
chapter:
  number: 5
  title: Product & Technology
  summary: >-
    Fab2's public product story is a vertically integrated semiconductor stack: company-issued
    materials say it builds the components, tools, fabs, and browser-based Studio EDA needed to
    shorten chip-development cycles, and engineering recruiting adds concrete evidence of
    lithography, metrology, motion, process, and device-development work. The same assigned pool
    still lacks independent proof of shipped systems, customer deployments, technical benchmarks,
    or trust/compliance surfaces, and some keyword results for "Fab2" are unrelated semiconductor
    facilities or mismatched aggregations, so the architecture is directionally credible but still
    early and under-documented.
sections:
  - id: delivered-surfaces
    title: Delivered surfaces center on vertically integrated fab infrastructure plus browser-based design software
    body: >-
      Fab2's public product definition is broader than a single chip or software SKU. The official
      site says the company designs the hardware and software needed to make chips and makes the
      fabs, tools, and components itself, while naming two visible surfaces: the "fab fab" that
      mass-produces fab equipment and Studio, an in-browser collaborative EDA environment. Public
      recruiting and third-party summaries reinforce that the company is not just selling software;
      it is trying to control the design, tool, and factory layers together. That matters for
      diligence because the product promise is a full manufacturing stack, but public evidence is
      still much stronger on product intent than on customer deployments, shipped units, or proven
      economics.
    claimRefs: [CE001, CE002, CE003, CE009]
    tableRefs: [TE001, TE002]
    figureRefs: [FE001]
  - id: architecture-and-operating-model
    title: Public technical evidence points to an in-house stack spanning precision tools, process engineering, and device characterization
    body: >-
      The most useful technical detail in the assigned pool comes from engineering job descriptions.
      A mechanical-design posting says Fab2's precision team builds lithography, metrology, and
      motion systems that pattern, inspect, and characterize chips, while the Ashby device role
      describes an in-house process group that simultaneously develops recipes, applies novel
      materials, characterizes chips, and troubleshoots tools. The Technical Program Manager role
      adds an operating layer above that engineering depth by describing cross-functional execution
      across mechanical, electrical, embedded/software, and production teams from requirements to
      production release. Taken together, the public surface supports a real architecture thesis:
      Fab2 is building software, components, tools, process knowledge, and fab assembly as one
      coordinated system rather than as isolated point products.
    claimRefs: [CE001, CE003, CE005, CE006, CE007, CE008, CE011]
    tableRefs: [TE003]
  - id: maturity-deployment-and-differentiation
    title: Maturity signals are real, but they are staffing and facility signals more than customer-proof
    body: >-
      Public maturity evidence exists, but it is mostly indirect. The official site lists three
      operating sites — a 120K square foot Austin chip fab, a 30K square foot Lockhart "fab fab,"
      and a 25K square foot San Francisco garage fab — which suggests a multi-site development and
      manufacturing footprint. Third-party profiles echo a compact or software-defined fab concept
      and browser-based EDA surface, and recruiting materials show the company hiring for precision
      systems, process/device engineering, robotics software, and hardware program management. That
      combination supports differentiation around vertical integration and manufacturing know-how,
      but it does not yet verify production maturity: the assigned pool does not disclose target
      nodes, yields, throughput, shipped-fab counts, supported design flows, or named customer
      deployments.
    claimRefs: [CE002, CE004, CE008, CE009, CE011]
  - id: trust-controls-and-diligence-risk
    title: Compliance language exists, but public trust and proof surfaces remain thin and noisy
    body: >-
      Trust, safety, and quality control are where the public record is weakest. Multiple
      recruiting pages state that technical roles are subject to U.S. export controls, which is a
      real compliance signal, but the assigned pool does not include a public status page, security
      documentation, certification surface, or published quality metrics. Diligence is also made
      harder by noisy external discovery: one assigned SEC result is actually an Applied
      Optoelectronics "FAB2 Manufacturing Cleanroom Project," and one third-party job aggregator
      page titled "Fab2" contains Atomic Machines "Matter Compiler" copy. The practical takeaway
      is that investors should trust direct URLs more than keyword-only search results and should
      ask management for first-party reliability, quality, and deployment evidence rather than
      inferring maturity from brand-forward product language.
    claimRefs: [CE010, CE012, CE013, CE014]
callouts:
  - calloutType: insight
    title: Vertical integration is the core product thesis
    body: >-
      The strongest supported differentiation is not a single fab or software module; it is the
      attempt to own design software, components, tools, process engineering, and fab assembly as a
      single operating stack.
    claimRefs: [CE001, CE002, CE003, CE005, CE006, CE008]
  - calloutType: risk
    title: Public proof is recruiting-heavy
    body: >-
      Most concrete technical detail comes from job descriptions and company copy, while public
      proof of shipped systems, benchmarks, certifications, and named customer deployments remains
      absent from the assigned pool.
    claimRefs: [CE005, CE006, CE007, CE008, CE010]
