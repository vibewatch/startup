      - [Precision/process/device stack, Process and device engineers, Recruiting-supported active development area, "Roles cite lithography, metrology, motion, recipes, novel materials, transistor architectures, and electrical characterization", "No public benchmark, node, reliability, or production-readiness metrics"]
    notes: >-
      Matrix combines official product surfaces with recruiting-derived technical modules; public
      evidence is strong on architecture intent and weak on shipped performance or customer
      validation.
    claimRefs: [CE001, CE002, CE003, CE005, CE006, CE007]
  - id: TE002
    title: Workflow / use-case table
    columns: [User job, Current workflow problem, Company solution, Measurable benefit, Limitation]
    rows:
      - ["Rapid chip design iteration", "Traditional fab cycles are slow and decoupled from design tooling", "Studio is positioned as a modern, in-browser collaborative EDA matched to the fab", "Claimed faster design-to-fab loop", "No public cycle-time benchmark, supported-flow detail, or customer case study"]
      - ["Build missing fab hardware", "Dream-fab components do not exist off the shelf in the needed form", "Fab2 says it builds pumps, valves, sensors, actuators, boards, and related hardware itself", "Potential tighter control over tool iteration and integration", "No public make-vs-buy split, component performance data, or manufacturing yield disclosure"]
      - ["Develop and debug process technology", "Foundry-style process learning is usually fragmented across tooling, recipes, and device test", "Process and device roles combine recipes, novel materials, electrical characterization, and tool troubleshooting", "Potentially faster root-cause learning across the stack", "No public node, defect-density, or reliability outputs"]
      - ["Ramp integrated hardware programs", "Hardware releases can stall across mechanical, electrical, software, and production handoffs", "Technical program management is described from requirements through production release across those functions", "Suggests an NPI-style operating model", "No public evidence of shipped-product ramp, field reliability, or post-release support metrics"]
    notes: >-
      Benefits reflect the company's intended workflow advantages; they should be treated as
      directional until backed by customer deployments, throughput data, or benchmark results.
    claimRefs: [CE001, CE002, CE003, CE006, CE007, CE008]
  - id: TE003
    title: Technology / operating architecture table
    columns: [Layer / process, Role, Dependency, Risk]
    rows:
      - ["Design software", "Studio provides browser-based collaborative EDA intended to move at fab speed", "Usable design environment, process libraries, and workflow integration", "No public PDK, API, documentation, or supported-design-flow evidence"]
      - ["Components and precision tools", "Fab2 says it builds core fab hardware and precision systems including lithography, metrology, and motion", "Precision engineering talent, instrumentation, and hardware supply chain", "Nanometer-scale capability is described but not independently benchmarked"]
      - ["Process and device development", "Teams are described as developing recipes, applying novel materials, characterizing chips, and defining transistor architectures", "Cleanroom/test infrastructure and scarce semiconductor process talent", "No public yield, reliability, or scaling-output disclosure"]
      - ["Fab assembly and facilities", "Components become machines and machines become fabs across Austin, Lockhart, and San Francisco sites", "Multi-site coordination, capex, and production operations", "No public shipped-fab count, status page, or quality-system proof"]
      - ["Compliance and release governance", "Export-controlled roles and program management indicate gated technical operations", "Export-control processes and disciplined release management", "Assigned pool lacks public security, certification, privacy, or formal QA/QC documentation"]
    notes: >-
      This architecture table mixes direct product layers with release/control functions because
      Fab2's public thesis depends on coordinating them as one stack rather than proving each layer
      independently.
    claimRefs: [CE003, CE004, CE005, CE006, CE007, CE008, CE010, CE011]
