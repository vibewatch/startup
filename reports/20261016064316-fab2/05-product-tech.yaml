  evidenceGaps:
    - type: missing-source
      severity: material
      topic: trust-and-documentation
      missingEvidence: Public status, security, certification, QA/QC, or reliability documentation for Fab2's product and factory stack.
      whyItMatters: Without first-party trust and quality surfaces, investors cannot test whether the company has production-grade controls beyond recruiting language and marketing copy.
      diligencePath: Ask management for security/compliance materials, any customer-facing status or support documentation, and internal QA/QC operating procedures.
      relatedQuestionRefs: [QE006, QE008]
      relatedTableRefs: [TE003]
    - type: private-evidence-only
      severity: material
      topic: production-maturity
      missingEvidence: Throughput, yield, supported process node, shipped-fab counts, named customer deployments, and field-reliability outcomes.
      whyItMatters: These metrics determine whether Fab2 is still an engineering program or has crossed into repeatable product delivery.
      diligencePath: Request customer references, shipped-system counts, internal manufacturing KPIs, and any benchmark or reliability data used in board or investor reporting.
      relatedQuestionRefs: [QE004, QE007, QE008]
      relatedTableRefs: [TE001, TE002]
    - type: conflicting-data
      severity: minor
      topic: source-validation
      missingEvidence: Clean identity-matched third-party technical coverage that unambiguously refers to this Fab2 rather than unrelated fabs, projects, or misattributed aggregations.
      whyItMatters: Search-noise and mislabeled aggregators can contaminate diligence with the wrong product claims or facility references if direct URLs are not checked.
      diligencePath: Use company-confirmed URLs and request a canonical product/data-room list before relying on third-party search results for technical or deployment facts.
      relatedQuestionRefs: [QE007, QE008]
