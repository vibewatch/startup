            - "Novel materials"
            - "Electrical test (I-V/C-V)"
            - "Transistor architectures"
            - "Technology performance models"
          outputs:
            - "Tool troubleshooting and flow improvement"
        - label: Fab assembly and facilities
          detail: "Official copy says components become machines and machines become fabs, with Austin, Lockhart, and San Francisco operating sites."
          modules:
            - "Austin chip fab (120K SQFT)"
            - "Lockhart fab fab (30K SQFT)"
            - "San Francisco garage fab (25K SQFT)"
          outputs:
            - "Integrated fab buildout"
            - "Mass-production ambition for compact fabs"
        - label: Program and release governance
          detail: "Technical program management is described as coordinating mechanical, electrical, embedded/software, and production work through release."
          items:
            - Requirements definition
            - Cross-functional execution
            - Risk surfacing and mitigation
            - Production release
          outputs:
            - "NPI-style coordination layer"
        - label: Trust and compliance surface
          detail: "Publicly visible controls are limited to export-control language and requests for stronger first-party quality or security documentation."
          items:
            - "Export-controlled technical roles"
            - "Need for QA/QC evidence"
            - "Need for status/security documentation"
          outputs:
            - "Compliance signal without production-grade proof"
    approximationNotes: >-
      This figure is an architecture synthesis from official copy and recruiting evidence; it is
      not a public systems diagram with interfaces, vendor boundaries, or measured throughput.
    claimRefs: [CE001, CE002, CE003, CE004, CE005, CE006, CE007, CE008, CE011]
