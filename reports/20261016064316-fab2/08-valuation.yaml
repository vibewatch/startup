  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: cap-table-terms
      missingEvidence: Current Series A term sheet, liquidation preference stack, participation rights, anti-dilution terms, and any debt or project-finance obligations.
      whyItMatters: Headline valuation can materially overstate common-equity value if investor protections or debt claims are heavy.
      diligencePath: Request the latest cap table, Series A financing documents, and any credit or equipment-finance agreements.
      relatedQuestionRefs: [QV002, QV008]
    - type: missing-source
      severity: material
      topic: commercialization-proof
      missingEvidence: Revenue, shipped-fab counts, customer count, repeat orders, yield metrics, and gross-margin data.
      whyItMatters: These inputs determine whether the latest round reflects durable operating proof or only financing appetite.
      diligencePath: Request customer pipeline, bookings, shipment history, manufacturing-yield dashboards, and product-level gross-margin reporting.
      relatedQuestionRefs: [QV003, QV006, QV008]
    - type: missing-source
      severity: minor
      topic: comparable-set
      missingEvidence: Audited public-company or transaction comps tied to revenue, margins, or shipped-capacity metrics rather than only private-round narratives.
      whyItMatters: Without operating comps, the valuation case stays pinned to milestone references and round marks.
      diligencePath: Build a comp set from disclosed semiconductor-equipment, foundry-services, and industrial-software peers once Fab2 provides operating baselines.
      relatedQuestionRefs: [QV004]
