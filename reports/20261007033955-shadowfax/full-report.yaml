            title: Capital Adequacy Cannot Be Read From the IPO Headline
            body: >-
              Only the ₹1,000 crore fresh-issue component represented gross new company funding; the roughly ₹907 crore
              offer for sale went to selling shareholders. Current unrestricted cash, debt obligations, and runway still
              require direct verification.
            calloutType: risk
