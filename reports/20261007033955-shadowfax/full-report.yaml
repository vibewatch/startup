  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market Boundary and Status-Quo Alternatives
        blocks:
          - type: paragraph
            body: >-
              Shadowfax participates in the logistics layer that supports Indian digital commerce, not in the full
              retail economy. Its evidenced service boundary covers express forward parcels and returns, hyperlocal
              delivery for quick commerce and food, and adjacent services such as critical logistics and dark-store
              operations. Express generated 73.4% of Q1 FY27 revenue and therefore remains the economic core; hyperlocal
              generated about 20% in the same quarter. D2C and small-merchant shipping expand the buyer set but remain
              uses of the same network rather than a separate retail TAM. The most important substitute is captive
              fulfilment: Meesho's Valmo materially reduced volumes previously sent to external 3PLs, demonstrating that
              digital-commerce growth does not automatically become third-party logistics revenue.
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
              - CM016
      - number: '2.2'
        title: Evidence-Constrained Sizing
        blocks:
          - type: paragraph
            body: >-
              The strongest assigned sizing evidence is a set of market ranges rather than a defensible TAM/SAM/SOM
              calculation. Shadowfax's FY25 annual report reproduces RedSeer estimates that online retail penetration
              could rise from about 7% in FY 2025 to 12-14% by FY 2030; e-commerce shipments excluding grocery could
              rise from 4.9-5.3 billion to 15-16 billion, and quick-commerce shipments from 1.1-1.3 billion to 4.6-6.7
              billion. These are company-published third-party forecasts, not independently reviewed market data in the
              assigned pool. The serviceable aperture is narrower still: management expects quick-commerce outsourcing
              to move from 12-15% of delivery volume to 20-25%, but platform strategy—not consumer demand
              alone—determines whether that pool becomes available to 3PLs.
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM011
              - CM015
