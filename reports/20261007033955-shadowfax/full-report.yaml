  - id: TV003
    title: Bull, base and bear scenarios
    columns:
      - Scenario
      - Explicit assumptions
      - Valuation and return logic
      - Probability signal and downside trigger
    rows:
      - - Bull
        - Growth remains elevated; EBITDA margin expands; concentration falls; merchant products scale.
        - A premium could be supportable only after a primary market-cap bridge; no numeric range is evidenced.
        - 'Signal: sustained margin expansion. Trigger: service deterioration despite growth.'
      - - Base
        - Growth normalises; margin improves gradually; concentration declines slowly.
        - Returns are entry-price dependent, so wait for reconciled price and dilution data.
        - 'Signal: positive cash conversion. Trigger: margin stalls near the FY26 level.'
      - - Bear
        - Pricing pressure, concentration and service failures reverse operating leverage.
        - Multiple compression and earnings disappointment create material downside; no floor is established.
        - 'Signal: weaker service and customer mix. Trigger: EBITDA margin reversal or renewed cash consumption.'
    notes: >-
      Scenario ranges remain qualitative because the allocated source pool lacks a current quote, fully diluted share
      count and comparable current multiples.
    claimRefs:
