    title: Thesis and anti-thesis
    columns:
      - Lens
      - Evidence-based argument
      - What would change the view
    rows:
      - - Thesis
        - FY26 growth, profit, EBITDA and operating cash flow indicate emerging operating leverage.
        - Several periods of durable margin and cash conversion would strengthen the thesis.
      - - Anti-thesis
        - Top-five customer concentration and thin logistics margins leave earnings sensitive to pricing and execution.
        - Lower concentration with stable service and margin would reduce downside.
      - - Commercial option
        - Shadowfax 360 targets SMEs and D2C sellers with a self-serve shipping proposition.
