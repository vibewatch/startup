              - CE005
              - CE007
              - CE012
              - CE013
      - number: '5.3'
        title: Physical Network, Automation, and Maturity
        blocks:
          - type: paragraph
            body: >
              Product maturity depends on the coupling of software with physical logistics infrastructure. ICICI
              Securities reports that facilities and linehaul transportation are leased while Shadowfax owns automation
              and machinery inside sort centers, including cross-belt sorters, telescopic belt conveyors, heavy-load
              sortation units, dimension-weight-scan systems, X-ray machines, and volumetric profilers. ScanX reports a
              later scale marker: the OneNCR automated sortation center covers 2.1 lakh square feet and has stated
              processing capacity of 48,000 shipments per hour. It also reports 4,778 touchpoints, more than 47 lakh
              square feet of operating space, and over 3,500 daily trucks for FY26. These figures demonstrate deployed
              infrastructure, but rated throughput is not the same as sustained utilization, uptime, accuracy, or
              unit-cost performance. ICICI also describes Sort Buddy, TM-VTS, and Saruman as operational tools
              connecting hub workflow, vehicle tracking, and order records.
            claimRefs:
              - CE009
              - CE010
              - CE012
          - type: table
            tableRef: TE003
            claimRefs:
              - CE004
              - CE005
              - CE006
              - CE007
              - CE008
              - CE009
              - CE010
              - CE012
              - CE014
      - number: '5.4'
        title: Trust, Roadmap, and Technical Risk
        blocks:
          - type: paragraph
            body: >
              ICICI Securities describes SF Shield as a supply-chain integrity framework comprising video-based Track &
              Trace, facial-recognition-based SF Eye, and X-ray or image-assisted product verification. Shadowfax's
              official innovation page separately states that delivery-partner safety checks include daily selfie
              verification analyzed by in-house algorithms. These are descriptions of controls, not independent
              assurance: the assigned evidence contains no SOC or ISO certification, privacy-impact assessment,
              biometric false-match data, penetration-test result, incident history, or status-page uptime record. The
              analyst report labels generative-AI integration for forecasting, allocation, and last-mile metrics as a
              future initiative, so it should be treated as roadmap rather than deployed differentiation. It also
              identifies expansion risk across gig-workforce management, node integration, SLA adherence, leakage, and
              fraud. Finally, the assigned developer-signal result resolves only to generic training copy, while an
              academic result is a 2011 GPGPU paper about an unrelated namesake; neither supports Shadowfax
              Technologies' engineering maturity.
            claimRefs:
              - CE011
              - CE013
              - CE014
              - CE015
              - CE016
      - number: '5.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Software and physical operations are tightly coupled
            body: >-
              Shadowfax's differentiation is not a standalone software product; the cited stack connects order intake,
              allocation, address intelligence, partner operations, hub tooling, and company-owned automation within a
              nationwide logistics network.
            calloutType: strength
            claimRefs:
              - CE005
              - CE006
              - CE008
              - CE009
              - CE012
          - type: callout
            title: Public control evidence trails the operational claims
            body: >-
              The assigned sources describe biometric, video, X-ray, and image-based controls, but they do not provide
              independent security certification, privacy governance, false-match data, incident history, or audited
              reliability metrics.
            calloutType: risk
            claimRefs:
              - CE011
              - CE014
  - number: 6
    title: Customers
    sections:
      - number: '6.1'
        title: Customer segments and economic roles
        blocks:
          - type: paragraph
            body: >-
              Shadowfax addresses several distinct buyer groups rather than a single customer archetype. Its own
              Shadowfax 360 page markets a digital shipping platform to online sellers, D2C brands, and marketplaces.
              Outlook Business provides the clearest economic segmentation: the CEO said e-commerce represented roughly
              70% of the business, hyperlocal about 20%, and D2C brands around 25% of revenue in the prior year. Those
              figures are management statements reported by the publication, may use overlapping or different
              classification bases, and therefore should not be summed into a single mix. The same interview describes
              D2C as the fastest-growing customer segment and links its strategic value to willingness to pay for speed
              and reliability. Low-reputation third-party profiles also characterize Shadowfax as a broad national
              logistics network serving e-commerce and quick-commerce demand, but they are directional evidence rather
              than customer-verified proof. The segment map is credible at a category level; payer identity, contract
              structure, and revenue quality within each category remain largely undisclosed.
            claimRefs:
              - CU001
              - CU010
              - CU011
              - CU012
              - CU015
          - type: table
            tableRef: TU001
            claimRefs:
              - CU001
              - CU007
              - CU010
              - CU011
              - CU012
      - number: '6.2'
        title: Adoption trajectory and named-customer proof
        blocks:
          - type: paragraph
            body: >-
              Reported operating volume shows genuine platform use at scale. ScanX, summarizing the audited FY26
              results, reported 72.6 crore orders for FY26, up 66.4% year over year, and 22.6 crore orders in Q4, up
              100.8% year over year and 10.0% sequentially. It also reported a network of 15,656 pin codes and 4,778
              touchpoints. A later company-issued release republished by Realty & More reported 24.7 crore Q1 FY27
              orders and 65% revenue growth to Rs 1,358 crore; these are issuer claims rather than independent customer
              confirmations. Named-account evidence is much thinner. ForgeUp lists Meesho, Flipkart, Zepto, BigBasket,
              and Decathlon as key partners, but the low-reputation article supplies no contracts, customer quotations,
              deployment dates, or outcome measurements. Accordingly, the named-customer exhibit records those names as
              reported relationships only and leaves production-versus-pilot status unverified. Shipment growth proves
              aggregate activity, not customer retention, account breadth, or realized customer ROI.
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU013
          - type: table
            tableRef: TU002
            claimRefs:
              - CU002
              - CU003
              - CU004
              - CU005
              - CU006
              - CU008
          - type: table
            tableRef: TU003
            claimRefs:
              - CU013
              - CU015
      - number: '6.3'
        title: Durability, concentration, and expansion
        blocks:
          - type: paragraph
            body: >-
              Customer concentration is the principal disclosed durability risk. Outlook Business, citing the red
              herring prospectus, reported that the top five clients represented about 75% of total revenue in the six
              months ended September 30. The CEO also said revenue from select customers declined from 88% in FY24 to
              74% in the following year, indicating diversification but leaving the exact definitions, current
              denominator, and individual counterparty exposures unclear. Shadowfax is pursuing a broader acquisition
              funnel: a company-issued release announced a plan for 1,000 channel partners over three years, with
              partners providing assisted onboarding, order management, and credit while Shadowfax handles pickup and
              delivery. This could reduce dependence on large digital accounts, but the plan is forward-looking and does
              not yet demonstrate acquired, retained, or profitable SME cohorts. The assigned official news-page fetch
              exposed only an office address rather than substantive customer evidence, so it cannot close those gaps.
              Investment diligence should prioritize cohort retention, renewal and churn data, top-customer contracts,
              and customer-authored evidence of production outcomes.
            claimRefs:
              - CU007
              - CU008
              - CU009
              - CU014
              - CU016
          - type: figure
            figureRef: FU001
            claimRefs:
              - CU001
              - CU016
      - number: '6.4'
        title: Exhibits
        blocks:
          - type: callout
            title: Concentration remains the central customer risk
            body: >-
              The top five clients represented about 75% of revenue in the disclosed H1 FY26 period. Reported
              diversification is encouraging, but exact account shares, contract duration, renewal terms, and
              termination protections are still unavailable.
            calloutType: risk
            claimRefs:
              - CU008
              - CU009
  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory, Legal, and Compliance Risk Register
        blocks:
          - type: paragraph
            body: >-
              Shadowfax operates in a complex multi-jurisdictional compliance environment spanning transportation,
              labor, consumer protection, and state taxation. As disclosed in the company's January 2026 Prospectus and
              August 2026 Annual Report, Shadowfax is subject to ongoing statutory demands and litigation. Claims
              against the company and Group not acknowledged as debt total ₹2.15 crore in disputed Goods and Services
              Tax (GST) liabilities for the financial years 2020-21 and 2021-22, up from ₹0.94 crore in the preceding
              period. Furthermore, outstanding legal proceedings aggregate across dozens of cases: while the company has
              filed 86 criminal proceedings involving ₹51.91 million primarily to recover stolen assets or dishonored
              cheques, proceedings against the company include 2 criminal actions, 18 tax proceedings, and 1 statutory
              action totaling ₹42.97 million, alongside claims against directors aggregating ₹190.00 million. Operating
              across 14,758 to 15,656 pin codes also exposes the platform to stringent municipal shop-and-establishment
              registrations, labor laws under the Contract Labour Act, and evolving state-level social security
              regulations for gig delivery partners. Non-compliance could prompt operational suspensions, license
              revocations, or material monetary penalties.
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: table
            tableRef: TR001
            claimRefs:
              - CR001
              - CR002
              - CR003
              - CR004
          - type: figure
            figureRef: FR001
            claimRefs:
              - CR001
              - CR005
              - CR006
              - CR007
              - CR009
              - CR011
      - number: '7.2'
        title: Operational Reliability, Service Quality, and Theft Mitigation
        blocks:
          - type: paragraph
            body: >-
              Operational integrity across Shadowfax's last-mile network is constrained by high reliance on 205,864
              quarterly unique gig delivery partners, thousands of leased hubs, and significant cash-on-delivery (COD)
              order volumes. In H1 FY26, COD accounted for 34.46% of total orders delivered (101.46 million orders)
              representing ₹40,375.05 million in order value, with ₹29,969.76 million collected in physical cash. This
              extensive cash float exposes the network to transit robbery, employee theft, and short deposits. The
              company has registered 71 First Information Reports (FIRs) under the Indian Penal Code, CrPC, and
              Bharatiya Nagarik Suraksha Sanhita (BNSS) against hub managers, franchisees, and delivery partners for
              theft of shipments, shipment swapping, and cash robbery totaling approximately ₹32.00 million, alongside
              11 Section 138 negotiable instrument complaints for dishonored cheques. Concurrently, end-consumer
              satisfaction metrics reveal profound operational distress: public consumer feedback on Trustpilot stands
              at an average score of 1.2 out of 5 across 370 reviews, with 89% 1-star ratings driven by repeated
              delivery delays, missed delivery windows, inaccessible local hub addresses, and false tracking updates.
              Although Shadowfax deploys digital pay-with-QR systems and group personal accident insurance for riders,
              retail brand damage and delivery partner turnover remain substantial residual exposures.
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: Partner, Counterparty, and Customer Concentration Dependencies
        blocks:
          - type: paragraph
            body: >-
              Shadowfax's business model exhibits pronounced counterparty dependency across client revenue sources,
              infrastructure leases, and crowdsourced driver supply. Enterprise client concentration represents the
              single largest commercial vulnerability: according to official Prospectus filings, the company's largest
              single client accounted for 48.91% of operating revenue in H1 FY26 (₹8,832.25 million out of ₹18,054.4
              million), 48.00% in FY25 (₹11,929.82 million), and 59.23% in FY24. The top five enterprise clients
              accounted for 74.11% in H1 FY26 (₹13,381.72 million) and top ten clients contributed 84.32%, with Meesho,
              Flipkart, and Zepto together driving over half of all operating income. The loss of any key enterprise
              customer, or internal volume insourcing by Flipkart's eKart or Zepto's captive logistics fleet, would
              severely undermine network capacity utilization. On the operational supply side, all 4,299 touchpoints and
              transport vehicles are non-owned: all sortation and delivery facilities are leased, with short-term lease
              rental expenses reaching ₹239.28 million in H1 FY26 and ₹472.96 million in FY25, subjecting the company to
              periodic renegotiation risk, landlord change-in-land-use (CLU) approval lapses, and sudden facility
              relocation costs.
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: Financial Sustainability, Governance Oversight, and Thesis-Break Triggers
        blocks:
          - type: paragraph
            body: >-
              Following historical net losses of ₹118.82 million in FY24 and ₹1,426.38 million in FY23, Shadowfax
              achieved an operating turnaround, generating consolidated net profit of ₹112 crore on revenue of ₹4,202
              crore in FY26. To institutionalize risk oversight post-IPO, the Board established a dedicated Risk
              Management Committee in 2026 chaired by independent directors, charged with periodic review of internal
              controls, enterprise business continuity, and fraud prevention. Nevertheless, thin operating margins
              (Adjusted EBITDA margin of 3.8% in FY26) leave the business acutely exposed to fuel price shocks, minimum
              wage revisions for contract logistics labor, and price competition against Delhivery, eKart, and Blue
              Dart. Rigorous investment diligence mandates monitoring clear thesis-break kill criteria: (1) any contract
              termination or volume claw-back by Meesho or Flipkart that reduces top-client volume by >20%, (2)
              regulatory reclassification of crowdsourced delivery riders as formal statutory employees mandating
              provident fund and employee state insurance benefits, (3) a drop in consolidated Adjusted EBITDA margin
              below 2.0% over two consecutive quarters, or (4) persistent escalation of uncollected COD cash balances
              exceeding 5% of daily float.
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Anchor Client Concentration Represents an Asymmetric Downside Risk
            body: >-
              With the largest single client accounting for 48.91% of operating revenue in H1 FY26 and the top five
              clients driving 74.11%, Shadowfax's profitability is acutely sensitive to enterprise contract terms. A
              volume loss of even 15-20% from Meesho or Flipkart would depress asset utilization across its 4,299
              facilities and quickly wipe out FY26's consolidated 3.8% Adjusted EBITDA margin.
            calloutType: risk
            claimRefs:
              - CR009
              - CR010
              - CR015
          - type: callout
            title: Operational Friction in Cash Handling and Retail Sentiment
            body: >-
              Handling over ₹160 million in daily physical cash-on-delivery order value creates chronic operational
              vulnerability, resulting in 71 registered criminal FIRs totaling ₹32.00 million for theft and shipment
              tampering. Paired with a 1.2 out of 5 consumer rating on Trustpilot, persistent fulfillment failures
              threaten enterprise customer retention.
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR008
  - number: 8
    title: Valuation
    sections:
      - number: '8.1'
        title: Recommendation and entry discipline
        blocks:
          - type: paragraph
            body: >-
              The evidence supports a track/research-more recommendation rather than a buy call. Shadowfax completed a
              mixed fresh-issue and offer-for-sale IPO at ₹124 per share, and reporting around the offer placed the
              post-money valuation near ₹7,169 crore. That establishes a financing reference, not an attractive entry
              price as of the run date: the assigned evidence does not include a contemporaneous quoted price, a
              reconciled fully diluted share count or a primary cap-table schedule. Entry discipline should therefore
              require a primary-filing valuation bridge and a material margin of safety for a business whose
              profitability is recent and whose logistics economics remain execution-sensitive.
            claimRefs:
              - CV001
              - CV002
              - CV014
              - CV015
          - type: table
            tableRef: TV001
            claimRefs:
              - CV001
              - CV002
              - CV003
              - CV005
              - CV007
              - CV009
              - CV014
              - CV015
          - type: figure
            figureRef: FV001
            claimRefs:
              - CV001
              - CV002
              - CV007
              - CV010
              - CV011
              - CV012
              - CV014
              - CV016
      - number: '8.2'
        title: Thesis and anti-thesis
        blocks:
          - type: paragraph
            body: >-
              The thesis is that network utilisation can convert rapid shipment and revenue growth into durable
              operating leverage. FY26 reporting shows ₹4,202 crore of consolidated revenue, ₹112 crore of net profit, a
              5.0% Ind AS EBITDA margin and ₹350 crore of operating cash flow. Shadowfax 360 also gives management a
              channel to diversify toward SMEs and D2C brands. The anti-thesis is equally material: the margin base
              remains narrow, the top five customers represented about 75% of H1 FY26 revenue, and a non-representative
              review sample contains repeated delivery and support complaints. A valuation premium is defensible only if
              margin gains persist while concentration and service-quality risk decline.
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV013
      - number: '8.3'
        title: Bull, base and bear framework
        blocks:
          - type: paragraph
            body: >-
              Scenario analysis must remain qualitative until the missing market-price and dilution inputs are obtained.
              The bull case requires revenue growth to remain strong, EBITDA margin to expand beyond the reported FY26
              level, and newer merchant products to reduce customer concentration without weakening service. The base
              case assumes growth normalises and margin improvement continues more slowly, making returns highly
              dependent on entry price. The bear case combines multiple compression with stalled margin progress,
              persistent concentration and service failures. No defensible rupee price target or return range can be
              produced from the assigned evidence without inventing a current market value.
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
      - number: '8.4'
        title: Financing history, exit readiness and final diligence
        blocks:
          - type: paragraph
            body: >-
              Public listing improves liquidity and creates an observable exit path, but it does not resolve historical
              financing or dilution. Three independent databases report materially different cumulative funding totals:
              $200 million, $247 million and $567.3 million, with the largest figure including IPO, equity and
              secondary-market activity. Those denominators are not comparable and cannot be treated as cash available
              or preference overhang. Final diligence should reconcile the RHP, post-IPO share capital, option pool,
              selling-holder stakes and any secondary transactions. The investment view should break if operating margin
              reverses, top-five concentration fails to fall, or service-quality indicators deteriorate while valuation
              remains premium.
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.5'
        title: Exhibits
        blocks:
          - type: callout
            title: Price sensitivity is the gating issue
            body: >-
              Public-market status improves exit readiness, but it does not justify a buy without a current market-cap
              and fully diluted share bridge. Preserve optionality by tracking margin, concentration and service quality
              while primary valuation inputs are obtained.
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV007
              - CV009
              - CV014
              - CV015
