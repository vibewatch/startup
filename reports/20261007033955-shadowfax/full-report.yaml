      - number: '2.3'
        title: Buyer Segments and Adoption Path
        blocks:
          - type: paragraph
            body: >-
              The payer is the merchant or platform buying delivery capacity, while operating users sit in fulfilment,
              dispatch, and logistics teams; the assigned public sources do not identify the named budget owner or
              disclose contract-level procurement terms. Large marketplaces and quick-commerce platforms buy scale and
              geographic serviceability, but they also create concentration and insourcing exposure. D2C brands and
              smaller sellers follow a different adoption path: Shadowfax is building dedicated sales capacity, while
              Shadowfax 360 offers self-serve onboarding, flat-rate pricing, zero COD charges, and D+2 COD remittance.
              Management says D2C shipments command a slight pricing premium and better profitability, but audited
              segment margins are unavailable, so that yield claim should remain a diligence hypothesis rather than an
              established market fact.
            claimRefs:
              - CM001
              - CM009
              - CM010
              - CM011
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM009
              - CM010
              - CM011
              - CM016
      - number: '2.4'
        title: Drivers, Constraints, and Valuation Relevance
        blocks:
          - type: paragraph
            body: >-
              Demand growth is supported by low online-retail penetration, rapid shipment forecasts, and operating
              complexity that can favor scaled 3PL networks. Mangal Keshav also identifies Gati Shakti and the National
              Logistics Policy as infrastructure enablers, while FY26 volume growth to 72.6 crore orders shows that
              Shadowfax has already converted part of this demand into throughput. The constraints are equally
              structural. The top five clients represented about 75% of revenue in the six months ended September 2025;
              a platform can redirect volume to its own network, and non-exclusive delivery partners can switch
              platforms or require higher incentives during peaks. Valuation should therefore be tied to verified
              outsourcing share, customer diversification, and unit economics—not to headline digital-commerce growth
              alone.
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: Exhibits
        blocks:
          - type: callout
            title: The Outsourcing Aperture Is the Key Swing Factor
            body: >-
              Quick-commerce demand growth does not translate one-for-one into third-party logistics revenue.
              Management's expected move from 12-15% to 20-25% outsourced delivery volume would expand the contestable
              pool, but Meesho's Valmo demonstrates the opposite path: platforms can internalize fulfilment and remove
              volume from external networks.
            calloutType: risk
            claimRefs:
              - CM004
              - CM011
  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: Competitive Landscape & Market Structure
        blocks:
          - type: paragraph
            body: >-
              India's logistics sector has transitioned from fragmented regional parcel carriers to consolidated
              technology-driven third-party logistics (3PL) platforms and captive captive delivery networks. Shadowfax
              occupies a distinctive competitive posture as a scaled 3PL player operating a unified logistics network
              that spans both e-commerce express parcel delivery and hyperlocal on-demand fulfillment [CP001, CP002].
              Its direct competitors include listed national express carriers like Delhivery, which operates across
              18,700+ pin codes [CP003], and venture-backed shipping aggregator platforms such as Shiprocket that serve
              over 100,000 merchants [CP004, CP005]. In addition, Shadowfax faces structural competition from captive
              e-commerce logistics arms, most notably Flipkart's Ekart Logistics, which operates a massive footprint of
              over 3,800 outlets across India [CP006]. The rise of internal captive platforms—such as Meesho's logistics
              network Valmo—represents a critical structural substitute that can abruptly siphon shipment volume away
              from independent 3PL providers [CP007]. In the intra-city and on-demand segment, specialized platforms
              like Porter provide dedicated mini-truck and two-wheeler freight capacity, challenging Shadowfax's
              hyperlocal merchant offerings [CP008]. To insulate against captive insourcing and margin erosion,
              Shadowfax launched Shadowfax 360, a self-serve digital shipping platform targeting small-and-medium
              enterprises (SMEs) and direct-to-consumer (D2C) brands with flat-rate billing, zero COD charges, and
              AI-powered return-to-origin (RTO) prediction [CP009, CP010].
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
              - CP006
              - CP007
              - CP008
              - CP009
              - CP010
          - type: table
            tableRef: TP001
            claimRefs:
              - CP001
              - CP003
              - CP005
              - CP006
              - CP007
              - CP008
              - CP012
          - type: figure
            figureRef: FP001
            claimRefs:
              - CP001
