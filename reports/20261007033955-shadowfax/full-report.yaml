      - number: '4.3'
        title: Cash Generation and Capital Needs
        blocks:
          - type: paragraph
            body: >-
              ScanX reports FY26 net cash flow from operating activities of ₹350 crore. Outlook Business separately
              relays management's statement that H1 FY26 produced about ₹146 crore of operating cash flow and more than
              ₹80 crore of free cash flow, while planned annual capex was about ₹120 crore for the next three to four
              years and ₹423.4 crore had been earmarked for network infrastructure. The January 2026 IPO created a
              ₹1,000 crore fresh issue, but the approximately ₹907 crore offer-for-sale component went to selling
              shareholders and is not company cash. Funding raised is therefore not the same as cash available. None of
              the assigned sources provides a current unrestricted cash balance, debt schedule, project-finance
              obligations, working-capital facility usage, or management runway bridge, so forward capital adequacy
              cannot be concluded from the offer size alone.
            claimRefs:
              - CI005
              - CI007
              - CI011
              - CI012
              - CI013
              - CI014
      - number: '4.4'
        title: Financial Verdict and Diligence Blockers
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a cautiously positive view of near-term operating leverage, not a complete
              underwriting model. Revenue, net profit, EBITDA, shipment growth, and operating cash flow all improved in
              FY26, yet the top five clients accounted for about 75% of revenue in the six months ended September 30
              according to Outlook Business's prospectus-based account. A sample of early-2026 Trustpilot reviews
              alleges delayed or unattempted deliveries, inaccurate status updates, and weak support; these anecdotes do
              not establish an incident rate, but they identify a service-quality channel that could affect refunds, SLA
              penalties, retention, and realized pricing. The financial verdict is therefore improving scale with thin
              disclosed EBITDA economics, material concentration, ongoing network investment, and unresolved liquidity
              inputs. Management data is required before assigning a durable margin path or financing runway.
            claimRefs:
              - CI003
              - CI004
              - CI008
              - CI010
              - CI016
