chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity and Operating Model
        blocks:
          - type: paragraph
            body: >-
              Shadowfax Technologies Limited was incorporated in Delhi on April 21, 2015, moved its registered office to
              Karnataka in 2021, and now lists its registered and corporate office in Bellandur, Bengaluru. Its core
              identity is a technology-led third-party logistics company serving digital commerce through express
              forward parcels, reverse pickups, exchanges, quick-commerce and on-demand hyperlocal delivery. The
              official site also markets Shadowfax 360 as a digital shipping platform for online sellers and D2C brands,
              so the model combines physical delivery execution with merchant-facing software rather than representing a
              software-only business. At September 30, 2025, the disclosed network reached 14,758 Indian pin codes
              through 4,299 touchpoints. Exact current customer and employee counts are not disclosed in the retained
              evidence; delivery-partner counts should not be relabeled as employee headcount.
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
          - type: table
            tableRef: TO001
            claimRefs:
              - CO001
              - CO002
              - CO004
              - CO010
              - CO012
              - CO014
              - CO015
      - number: '1.2'
        title: Leadership and Governance
        blocks:
          - type: paragraph
            body: >-
              The two promoters remain central to operating control. Abhishek Bansal is Chairman, Managing Director and
              Chief Executive Officer, with responsibility for organizational growth and profitability; Vaibhav
              Khandelwal is a Whole-Time Director and Chief Technology Officer responsible for product development. Both
              are IIT Delhi graduates, have been associated with Shadowfax since incorporation, and are described in the
              prospectus as having more than ten years of logistics experience. The January 2026 prospectus reported an
              eight-member board: four executive directors and four non-executive independent directors, including one
              woman. That formal independent representation broadens oversight, but the filing also identifies
              dependence on the promoters and senior management as a specific risk, making succession depth and
              delegated authority appropriate diligence topics.
            claimRefs:
              - CO005
              - CO006
              - CO007
