              FY26 secondary reporting shows ₹4,202 crore of revenue, ₹212 crore of Ind AS EBITDA, ₹112 crore of net
              profit, and ₹350 crore of operating cash flow. The direction is positive, but direct contribution margin
              and working-capital quality remain undisclosed.
            calloutType: insight
            claimRefs:
