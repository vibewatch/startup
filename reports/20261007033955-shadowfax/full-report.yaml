      - number: '1.3'
        title: Capital History and Ownership
        blocks:
          - type: paragraph
            body: >-
              The retained sources do not support one reconciled lifetime funding number. TechCrunch reported in
              February 2024 that a $100 million TPG NewQuest-led Series E, including secondary transactions, took
              primary and secondary capital raised above $220 million. Indexed.vc now reports $207.5 million across six
              rounds and labels a $95 million January 2026 venture round as the latest event. The different amounts,
              periods and transaction definitions should be preserved as a conflict rather than collapsed into a precise
              total. The subsequent IPO totaled ₹1,907.27 crore: ₹1,000 crore of fresh capital and a ₹907.27 crore offer
              for sale by named institutional shareholders. Outlook Business reported an implied post-money valuation of
              about ₹7,169 crore at the ₹124 upper price-band level, while the issue ultimately closed 2.72 times
              subscribed.
