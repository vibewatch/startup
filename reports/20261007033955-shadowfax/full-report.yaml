        title: Scale, Profitability, and Dependencies
        blocks:
          - type: paragraph
            body: >-
              For FY26, ScanX reported consolidated revenue from operations of ₹4,202 crore, up 69.1% year over year,
              and consolidated net profit of ₹112 crore versus ₹6 crore in FY25. These are accounting results, not ARR
              or cash available, and they should not be converted into an unsupported revenue run rate. The growth and
              profit inflection demonstrate greater scale after the IPO, but concentration remains material: the
              prospectus says the largest client generated 48.91% of revenue from operations in the six months ended
              September 30, 2025. Outlook Business separately reported that the top five clients represented about 75%
              over that period. The company therefore enters public-market reporting with improved profitability but
              significant dependency on a small set of commercial relationships and on founder-led execution.
