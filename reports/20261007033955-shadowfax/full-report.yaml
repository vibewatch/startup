  - number: 5
    title: Product & Technology
    sections:
      - number: '5.1'
        title: Product Surface and Customer Workflow
        blocks:
          - type: paragraph
            body: >
              Shadowfax is delivered as both a logistics service and an operating interface. ICICI Securities describes
              a portfolio spanning forward express parcels, reverse pickup and exchange, same-day and next-day Prime
              delivery, hyperlocal delivery, mobility enablement, critical logistics, unbundled services, and dark-store
              operations. The official site positions Shadowfax 360 as a self-serve digital shipping product for online
              sellers, D2C brands, and marketplaces; ScanX separately reports that the launch targeted SMEs and D2C
              brands and provided access to more than 15,000 pin codes. For larger customers, the analyst report
              describes API integration and a client portal for order placement, bulk shipment tracking, seller-address
              updates, and real-time serviceability checks. An assigned AfterShip page also exposes a structured
              Shadowfax tracking object, which is evidence of a third-party tracking surface, not proof of every API or
              webhook capability advertised in the search snippet.
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
          - type: table
            tableRef: TE001
            claimRefs:
              - CE001
              - CE002
              - CE003
              - CE004
      - number: '5.2'
        title: Software and Allocation Architecture
        blocks:
          - type: paragraph
            body: >
              The strongest architecture detail comes from ICICI Securities, whose report attributes the description to
              company data and the red herring prospectus. It characterizes the stack as an in-house microservices
              platform. The report says the Demand-Supply Allocation Engine accepts or rejects orders within 100
              milliseconds and allocates them to gig partners within 30 seconds using skills, vehicle type, behavioral
              data, and geolocation. Frodo manages partner onboarding, earnings, payouts, and task assignment, with
              reported UIDAI and NSDL integrations. SF Maps is described as an ML-based address-intelligence layer
              trained on millions of historical delivery points for customer mapping, reverse geocoding, and route
              optimization. Shadowfax's own innovation page corroborates the functional direction through claims about
              demand forecasting, misrouting detection, routing, tracking, and geofencing, but neither source provides
              an independent latency benchmark, model-accuracy study, public release history, or production uptime
              series.
            claimRefs:
              - CE005
              - CE006
              - CE007
              - CE008
          - type: table
            tableRef: TE002
            claimRefs:
              - CE003
              - CE006
              - CE008
              - CE009
              - CE010
              - CE011
          - type: figure
            figureRef: FE001
            claimRefs:
