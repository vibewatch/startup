      - number: '4.2'
        title: Scale, Profitability, and Cost Absorption
        blocks:
          - type: paragraph
            body: >-
              ScanX's summary of the audited FY26 result announcement reports consolidated revenue from operations of
              ₹4,202 crore, consolidated net profit of ₹112 crore, and Ind AS EBITDA of ₹212 crore at a 5.0% margin. It
              also reports 72.6 crore orders, up 66.4% year on year, and ₹185 crore invested in network expansion,
              sort-center automation, and capacity. These figures indicate that higher shipment density is absorbing
              fixed network costs, but the evidence does not disclose gross profit, contribution margin per parcel,
              delivery-partner expense per order, or segment-level profitability. Net profit is not cash burn, and the
              reported accounting turnaround does not by itself establish durable unit economics. Underwriting therefore
              depends on reconciling audited statements to operational cohorts and separating working-capital benefits
              from recurring operating margin.
            claimRefs:
              - CI002
              - CI003
              - CI004
              - CI005
              - CI006
              - CI007
