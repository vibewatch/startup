callouts:
  - calloutType: "risk"
    title: "Captive Insourcing Threat Demonstrated by Valmo"
    body: "Customer concentration in Indian 3PL e-commerce represents an existential displacement hazard. In FY25, Shadowfax generated 75% of operating revenue from its top five clients. When major platforms build captive networks—exemplified by Meesho launching Valmo—independent 3PL volume can contract rapidly, compressing yields and stranding sortation center capex."
    claimRefs:
      - "CP001"
      - "CP007"
  - calloutType: "strength"
    title: "Dual Network Synergy Across Express and Hyperlocal"
    body: "Shadowfax is the only scaled logistics player in India effectively combining express parcel linehaul and crowdsourced hyperlocal delivery within a unified operational network. This flexibility allows it to service quick-commerce spikes and reverse logistics pickups using shared rider capacity, driving FY26 IndAS EBITDA margin expansion to 5.0%."
    claimRefs:
      - "CP001"
      - "CP002"
      - "CP012"
