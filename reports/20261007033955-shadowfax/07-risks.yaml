    title: "Anchor Client Concentration Represents an Asymmetric Downside Risk"
    body: "With the largest single client accounting for 48.91% of operating revenue in H1 FY26 and the top five clients driving 74.11%, Shadowfax's profitability is acutely sensitive to enterprise contract terms. A volume loss of even 15-20% from Meesho or Flipkart would depress asset utilization across its 4,299 facilities and quickly wipe out FY26's consolidated 3.8% Adjusted EBITDA margin."
