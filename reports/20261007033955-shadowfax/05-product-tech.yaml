company:
  name: Shadowfax
chapter:
  number: 5
  title: Product & Technology
  summary: Shadowfax combines digital shipping interfaces, proprietary dispatch and address-intelligence systems, gig-partner tooling, and company-owned sortation equipment inside a largely leased logistics network. Public evidence supports a broad operating stack and a scaled automated hub, but external developer proof, independently benchmarked reliability, privacy controls, and certifications remain material diligence gaps.
sections:
  - id: product-and-customer-workflow
    title: Product Surface and Customer Workflow
    body: |
      Shadowfax is delivered as both a logistics service and an operating interface. ICICI Securities describes a portfolio spanning forward express parcels, reverse pickup and exchange, same-day and next-day Prime delivery, hyperlocal delivery, mobility enablement, critical logistics, unbundled services, and dark-store operations. The official site positions Shadowfax 360 as a self-serve digital shipping product for online sellers, D2C brands, and marketplaces; ScanX separately reports that the launch targeted SMEs and D2C brands and provided access to more than 15,000 pin codes. For larger customers, the analyst report describes API integration and a client portal for order placement, bulk shipment tracking, seller-address updates, and real-time serviceability checks. An assigned AfterShip page also exposes a structured Shadowfax tracking object, which is evidence of a third-party tracking surface, not proof of every API or webhook capability advertised in the search snippet.
    claimRefs:
      - CE001
      - CE002
      - CE003
      - CE004
    tableRefs:
      - TE001
  - id: software-and-allocation-architecture
    title: Software and Allocation Architecture
    body: |
      The strongest architecture detail comes from ICICI Securities, whose report attributes the description to company data and the red herring prospectus. It characterizes the stack as an in-house microservices platform. The report says the Demand-Supply Allocation Engine accepts or rejects orders within 100 milliseconds and allocates them to gig partners within 30 seconds using skills, vehicle type, behavioral data, and geolocation. Frodo manages partner onboarding, earnings, payouts, and task assignment, with reported UIDAI and NSDL integrations. SF Maps is described as an ML-based address-intelligence layer trained on millions of historical delivery points for customer mapping, reverse geocoding, and route optimization. Shadowfax's own innovation page corroborates the functional direction through claims about demand forecasting, misrouting detection, routing, tracking, and geofencing, but neither source provides an independent latency benchmark, model-accuracy study, public release history, or production uptime series.
    claimRefs:
      - CE005
      - CE006
      - CE007
      - CE008
    tableRefs:
      - TE002
    figureRefs:
      - FE001
  - id: physical-network-and-maturity
    title: Physical Network, Automation, and Maturity
    body: |
      Product maturity depends on the coupling of software with physical logistics infrastructure. ICICI Securities reports that facilities and linehaul transportation are leased while Shadowfax owns automation and machinery inside sort centers, including cross-belt sorters, telescopic belt conveyors, heavy-load sortation units, dimension-weight-scan systems, X-ray machines, and volumetric profilers. ScanX reports a later scale marker: the OneNCR automated sortation center covers 2.1 lakh square feet and has stated processing capacity of 48,000 shipments per hour. It also reports 4,778 touchpoints, more than 47 lakh square feet of operating space, and over 3,500 daily trucks for FY26. These figures demonstrate deployed infrastructure, but rated throughput is not the same as sustained utilization, uptime, accuracy, or unit-cost performance. ICICI also describes Sort Buddy, TM-VTS, and Saruman as operational tools connecting hub workflow, vehicle tracking, and order records.
    claimRefs:
      - CE009
      - CE010
      - CE012
    tableRefs:
      - TE003
  - id: trust-roadmap-and-evidence-limits
    title: Trust, Roadmap, and Technical Risk
    body: |
      ICICI Securities describes SF Shield as a supply-chain integrity framework comprising video-based Track & Trace, facial-recognition-based SF Eye, and X-ray or image-assisted product verification. Shadowfax's official innovation page separately states that delivery-partner safety checks include daily selfie verification analyzed by in-house algorithms. These are descriptions of controls, not independent assurance: the assigned evidence contains no SOC or ISO certification, privacy-impact assessment, biometric false-match data, penetration-test result, incident history, or status-page uptime record. The analyst report labels generative-AI integration for forecasting, allocation, and last-mile metrics as a future initiative, so it should be treated as roadmap rather than deployed differentiation. It also identifies expansion risk across gig-workforce management, node integration, SLA adherence, leakage, and fraud. Finally, the assigned developer-signal result resolves only to generic training copy, while an academic result is a 2011 GPGPU paper about an unrelated namesake; neither supports Shadowfax Technologies' engineering maturity.
    claimRefs:
      - CE011
      - CE013
      - CE014
      - CE015
      - CE016
