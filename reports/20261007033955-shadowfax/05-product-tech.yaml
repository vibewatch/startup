callouts:
  - calloutType: strength
    title: Software and physical operations are tightly coupled
    body: Shadowfax's differentiation is not a standalone software product; the cited stack connects order intake, allocation, address intelligence, partner operations, hub tooling, and company-owned automation within a nationwide logistics network.
    claimRefs:
      - CE005
      - CE006
      - CE008
      - CE009
      - CE012
  - calloutType: risk
    title: Public control evidence trails the operational claims
    body: The assigned sources describe biometric, video, X-ray, and image-based controls, but they do not provide independent security certification, privacy governance, false-match data, incident history, or audited reliability metrics.
    claimRefs:
      - CE011
