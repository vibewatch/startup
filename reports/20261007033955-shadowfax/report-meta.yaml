companyProfile:
  summary: >-
    Shadowfax is a Bengaluru-based technology-led third-party logistics and shipping platform serving e-commerce, quick
    commerce, D2C brands and SMEs. Founded in 2015 and now public after a January 2026 IPO, it combines parcel-delivery
    execution with Shadowfax 360 software and reported FY26 revenue of ₹4,202 crore and net profit of ₹112 crore. The
    operating story is improving, but concentration, valuation and exact ownership reconciliation remain open diligence
    items.
