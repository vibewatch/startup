  - id: FM001
    title: 地址空间阶梯：需求量、外包与当前位置
    type: pyramid
    summary: 六个有来源支持的点位，将总体市场需求与更窄的外包池及 Shadowfax 当前的即时零售位置区分开来。
    data:
      items:
        - label: 印度不含杂货的电商发货量，FY 2025
          value: 4.9-5.3 Bn
        - label: 印度不含杂货的电商发货量，FY 2030P
          value: 15-16 Bn
        - label: 印度即时零售发货量，FY 2025
          value: 1.1-1.3 Bn
        - label: 印度即时零售发货量，FY 2030P
          value: 4.6-6.7 Bn
        - label: 外包给 3PL 的即时零售配送量，Q1 FY27
          value: 12-15%
        - label: Shadowfax 在外包即时零售 3PL 中的份额，Q1 FY27
          value: '>50%'
    approximationNotes: >-
      这是证据阶梯，不是转化漏斗，也不是算术意义上的 TAM/SAM/SOM。发货量预测来自 Shadowfax 转述的 RedSeer 估计；外包和公司份额数据来自 NDTV Profit
      报道。单位和分母不同，因此不得将层宽和数值解读为成比例或可相加。
