  - id: FI001
    title: 收入模型桥接（非财务核对）
    type: flow
    summary: 公开证据从需求经由发货费追踪到已报告的收入、EBITDA 和经营现金流，但毛利和直接贡献利润率仍未解决。
    data:
      nodes:
        - id: customer-demand
          label: 电商、本地化、D2C 与 SME 需求
          detail: 客户活动创造包裹和合同物流业务量。
        - id: shipment-volume
          label: 72.6 crore 订单
          value: 72.6
          unit: crore orders in FY26
          detail: ScanX 报告发货量同比增长 66.4%。
        - id: fee-events
          label: 单包裹及服务费
          detail: Business Index 描述了快递、本地化、Prime 和 CriticaLog 各项服务的费用。
        - id: operating-revenue
          label: ₹4,202 crore 收入
          value: 4202
          unit: ₹ crore in FY26
          detail: ScanX 报告的合并运营收入。
        - id: gross-profit-gap
          label: 毛利和直接贡献
          detail: 指定证据中未披露；未推断数值。
        - id: indas-ebitda
          label: ₹212 crore Ind AS EBITDA（息税折旧摊销前利润）
          value: 212
          unit: ₹ crore; 5.0% margin in FY26
          detail: 已报告的网络成本吸收后的盈利能力。
        - id: operating-cash-flow
          label: ₹350 crore 经营现金流
          value: 350
          unit: ₹ crore in FY26
          detail: 指定证据中未披露营运资金贡献。
      edges:
        - from: customer-demand
          to: shipment-volume
          label: 创造配送活动
        - from: shipment-volume
          to: fee-events
          label: 触发商业收费
        - from: fee-events
          to: operating-revenue
          label: 确认为物流收入
        - from: operating-revenue
          to: gross-profit-gap
          label: 扣除直接服务交付成本
        - from: gross-profit-gap
          to: indas-ebitda
          label: 扣除运营管理费用
        - from: indas-ebitda
          to: operating-cash-flow
          label: 按现金和营运资金调整
    approximationNotes: 这是机制图而非瀑布图：已报告数值使用不同会计分母，且毛利层未披露，无法进行算术核对。
    claimRefs:
      - CI001
      - CI002
      - CI004
      - CI005
      - CI006
  - id: FE001
    title: 产品架构图
    type: stack
    summary: 产品覆盖客户界面、专有编排、现场执行工具和实体自动化；生成式 AI 仍只是已声明的路线图事项。
    data:
      items:
        - label: Shadowfax 360 和客户门户
          detail: 客户接入层：面向卖家和企业的发货、追踪、地址及服务可用性工作流
        - label: AfterShip 追踪对象
          detail: 客户接入层：第三方结构化追踪界面；更广泛的 API 能力仍未核实
        - label: Allocation Engine 和 SF Maps
          detail: 数字编排层：据报道支持亚秒级服务可用性判断、伙伴匹配、地理编码和路线优化
        - label: Frodo 和 SF Shield
          detail: 数字编排层：伙伴生命周期、身份验证、视频核验和产品验证
        - label: Sort Buddy、TM-VTS 和 Saruman
          detail: 实体执行层：枢纽工作流、车辆遥测和中央发货事件追踪
        - label: 分拣中心和自动化
          detail: 实体执行层：租赁设施内的公司自有分拣机和扫描仪
        - label: 生成式 AI 计划
          detail: 路线图层：未来整合预测、分配和末端指标；没有证据表明已部署
    approximationNotes: 这是对具名系统的分析性归类，不是公司发布的部署图；未推断未记录的连接或基础设施组件。
    claimRefs:
      - CE004
      - CE005
      - CE007
      - CE012
      - CE013
  - id: FU001
    title: Shadowfax 客户获客与服务旅程
    type: journey-map
    summary: 公司正向自助卖家漏斗加入辅助分销，但公开证据尚未覆盖用户群留存、续约和扩张结果。
    data:
      items:
        - label: 商户需求
          detail: 线上卖家、D2C 品牌和平台寻求发货接入。
          touchpoints:
            - Shadowfax 360
        - label: 数字化自助入驻
          detail: 符合条件的卖家可以通过公司运营的数字发货平台进入。
          touchpoints:
            - 自助仪表盘
        - label: 辅助发现
          detail: 计划中的本地渠道伙伴将线下品牌和 SME 带入漏斗。
          touchpoints:
            - 一线和二线渠道伙伴
        - label: 辅助入驻
          detail: 预计渠道伙伴将招募卖家并帮助其使用平台。
          touchpoints:
            - 本地伙伴支持
        - label: 订单与信贷支持
          detail: 预计伙伴将管理订单，并向参与的卖家提供信贷。
          touchpoints:
            - 伙伴门户
            - 营运资金支持
        - label: 揽收与配送
          detail: Shadowfax 继续负责其网络中的实体揽收和配送。
          touchpoints:
            - Shadowfax 物流网络
    approximationNotes: 这是根据公司发布描述整理的定性运营序列，不是量化的漏斗转化；未披露阶段规模、转化率、留存率或扩张率。
    claimRefs:
      - CU001
      - CU016
