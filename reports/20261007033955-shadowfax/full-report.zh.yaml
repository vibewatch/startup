        blocks:
          - type: paragraph
            body: >-
              Shadowfax 末端网络的运营完整性受到对 205,864 名季度独立零工配送伙伴、数千个租赁枢纽以及大量货到付款（COD）订单的高度依赖所限制。H1 FY26，COD 占已配送订单总量的
              34.46%（101.46 million 单），对应订单价值 ₹40,375.05 million，其中 ₹29,969.76 million
              以现金收取。大量现金浮存使网络暴露于途中抢劫、员工盗窃和短缴风险。公司依据《印度刑法》、CrPC 和《Bharatiya Nagarik Suraksha
              Sanhita》（BNSS），已针对枢纽经理、加盟商和配送伙伴登记 71 份第一信息报告（FIR），涉及包裹盗窃、调包和现金抢劫，金额约 ₹32.00 million；另有 11 起因支票退票而提起的第 138
              条可流通票据投诉。与此同时，终端消费者满意度指标显示运营压力严重：Trustpilot 公开反馈在 370 条评价中平均仅 1.2/5，89% 为 1
              星，原因包括反复配送延误、错过配送时间窗、当地枢纽地址无法取得和虚假追踪更新。尽管 Shadowfax 部署二维码支付系统并为骑手购买团体人身意外保险，零售品牌损害和配送伙伴流失仍是重大剩余风险。
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
          - type: table
            tableRef: TR002
            claimRefs:
              - CR005
              - CR006
              - CR007
              - CR008
      - number: '7.3'
        title: 伙伴、交易对手与客户集中度依赖
        blocks:
          - type: paragraph
            body: >-
              Shadowfax 的商业模式在客户收入来源、基础设施租赁和众包司机供给上都高度依赖交易对手。企业客户集中度是最大的商业脆弱点：根据官方 Prospectus 文件，公司最大单一客户在 H1 FY26、FY25
              和 FY24 分别贡献经营收入的 48.91%（₹8,832.25 million / ₹18,054.4 million）、48.00%（₹11,929.82 million）和 59.23%。H1 FY26
              前五大企业客户贡献 74.11%（₹13,381.72 million），前十大客户贡献 84.32%；Meesho、Flipkart 和 Zepto 合计带来超过一半经营收入。任何关键企业客户流失，或
              Flipkart 的 eKart、Zepto 的自营物流车队把业务量内制化，都会严重削弱网络产能利用率。供给侧方面，全部 4,299 个触点和运输车辆均非自有：所有分拣和配送设施都采用租赁，短期租赁费用 H1
              FY26 达 ₹239.28 million，FY25 达 ₹472.96 million，公司因此暴露于定期重新议价、房东土地用途变更（CLU）批准失效和设施突然搬迁成本风险。
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
          - type: table
            tableRef: TR003
            claimRefs:
              - CR009
              - CR010
              - CR011
              - CR012
      - number: '7.4'
        title: 财务可持续性、治理监督与论点失效触发器
        blocks:
          - type: paragraph
            body: >-
              在 FY24 净亏损 ₹118.82 million、FY23 净亏损 ₹1,426.38 million 后，Shadowfax 实现经营扭转，FY26 以 ₹4,202 crore 营收产生 ₹112
              crore 合并净利润。IPO 后，为制度化风险监督，董事会于 2026 年设立由独立董事主持的风险管理委员会，负责定期审查内部控制、企业业务连续性和欺诈防范。然而，FY26 调整后 EBITDA 利润率仅
              3.8%，使业务高度暴露于燃油价格冲击、合同物流劳工最低工资调整，以及面对 Delhivery、eKart 和 Blue Dart 的价格竞争。严格的投资尽调必须监测清晰的论点失效标准：(1) Meesho 或
              Flipkart 终止合同或追回业务量，使头部客户业务量减少 >20%；(2) 监管将众包配送骑手重新归类为法定正式员工，要求缴纳公积金和员工州保险；(3) 合并调整后 EBITDA 利润率连续两个季度低于
              2.0%；或 (4) 未收 COD 现金余额持续上升，超过每日浮存额的 5%。
            claimRefs:
              - CR013
              - CR014
              - CR015
              - CR016
      - number: '7.5'
        title: 展示项
        blocks:
          - type: callout
            title: 锚定客户集中度带来非对称下行风险
            body: >-
              H1 FY26 最大单一客户贡献经营收入的 48.91%，前五大客户贡献 74.11%，因此 Shadowfax 盈利能力对企业合同条款高度敏感。Meesho 或 Flipkart 即使减少 15-20%
              业务量，也会压低其 4,299 个设施的资产利用率，并迅速抹去 FY26 合并 3.8% 的调整后 EBITDA 利润率。
            calloutType: risk
            claimRefs:
              - CR009
              - CR010
              - CR015
          - type: callout
            title: 现金处理和零售口碑中的运营摩擦
            body: >-
              每天处理超过 ₹160 million 的实体 COD 订单价值，带来持续运营脆弱性，并导致 71 份刑事 FIR，涉及盗窃和包裹篡改，合计 ₹32.00 million。再叠加 Trustpilot 上
              1.2/5 的消费者评分，持续的履约失败将威胁企业客户留存。
            calloutType: risk
            claimRefs:
              - CR005
              - CR006
              - CR008
  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 建议与入场纪律
        blocks:
          - type: paragraph
            body: >-
              证据支持跟踪 / 继续研究，而不是买入建议。Shadowfax 以每股 ₹124 完成混合新发行和老股发售 IPO，发行相关报道将投后估值置于约 ₹7,169
              crore。这只是融资参照，并不代表运行日的吸引力入场价格：指定证据没有同期报价、经过勾稽的完全稀释股份数或一级 cap
              table。入场纪律应要求用一级文件搭建估值桥，并为一家盈利尚新、物流经济性仍受执行影响的企业保留足够安全边际。
            claimRefs:
              - CV001
              - CV002
              - CV014
              - CV015
