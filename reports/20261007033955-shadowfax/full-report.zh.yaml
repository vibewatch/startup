      - number: '3.2'
        title: 竞争者画像、规模与战略方向
        blocks:
          - type: paragraph
            body: >-
              对竞争者相对规模和运营深度的比较显示，其网络覆盖、资本资源和目标客户重点存在明显差异。Delhivery 是印度规模最大的上市 3PL 物流独角兽，覆盖超过 18,700
              个邮政编码，重度依靠自动化、综合货运和全国快递枢纽 [CP003, CP011]。相比之下，Shadowfax FY26 覆盖 15,656 个邮政编码、拥有 4,778 个触点和超过 47 lakh
              平方英尺运营空间，并启用每小时处理 48,000 个包裹的 OneNCR 自动分拣中心 [CP012]。Ekart Logistics 是拥有超过 3,800 个网点的成熟自营网络，依靠 Flipkart
              的锚定业务量，同时为加盟商提供较低的进入资本开支（₹1 lakh，对比 Shadowfax 的 ₹10 lakh）[CP006, CP013]。Porter
              聚焦城内按需物流，在两轮车和小货车上提供定制按需及企业车队层级，并开放 API 集成 [CP008, CP014]。新兴 D2C 运输聚合商如
              Shiprocket，则在商户获客层竞争：聚合多家快递伙伴、取消设置费，并提供基于机器学习的 CORE 路由以自动处理异常 [CP005]。Shadowfax
              的优势在于众包末端配送的灵活性和逆向物流，但企业客户敞口较重，需要积极扩大 D2C 多元化以应对竞争壁垒 [CP002, CP015]。
            claimRefs:
              - CP002
              - CP003
              - CP005
              - CP006
              - CP008
              - CP011
              - CP012
              - CP013
              - CP014
              - CP015
          - type: table
            tableRef: TP002
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP005
              - CP008
              - CP009
              - CP012
              - CP014
      - number: '3.3'
        title: 壁垒持久性、切换成本与客户集中度风险
        blocks:
          - type: paragraph
            body: >-
              Shadowfax 的竞争防御力受切换成本、客户多平台使用倾向和平台依赖深刻影响。在电商物流中，Meesho 和 Flipkart 等大型企业市场的切换成本较低；市场平台通常同时使用
              Delhivery、Shadowfax 和自营网络，以比较履约服务水平并压低单包裹价格 [CP001, CP007]。这使 Shadowfax 面临严重客户集中度风险：FY25 最大单一客户贡献经营收入的
              48%，前五大客户贡献 75%，前十大客户贡献 86% [CP007]。Ecom Express 的先例说明了平台迁移的生存性风险：锚定客户 Meesho 启用 Valmo 后，其包裹量大幅下降并遭受严重财务损失
              [CP007]。作为回应，Shadowfax 扩大高收益 D2C 履约，在该领域客户集中度更低，商家更重视配送速度、RTO 降低和快速 COD 汇款，而非绝对最低价格 [CP010,
              CP015]。不过，第三方评价平台上终端消费者反映的运营扩张问题、配送延误和包裹错放，仍暴露出客户满意度脆弱点 [CP016]。要维持壁垒，Shadowfax 需要借助 Shadowfax 360 扩大 SME
              和 D2C 商户基础，并保持优于自营网络和其他 3PL 的单位经济性 [CP009, CP012]。
            claimRefs:
              - CP001
              - CP007
              - CP009
              - CP010
              - CP012
              - CP015
              - CP016
          - type: table
            tableRef: TP003
            claimRefs:
              - CP005
              - CP006
              - CP008
              - CP009
              - CP010
              - CP013
              - CP014
      - number: '3.4'
        title: 展示项
        blocks:
          - type: callout
            title: Valmo 证明了自营化威胁
            body: >-
              印度 3PL 电商中的客户集中度构成生存性迁移风险。FY25，Shadowfax 前五大客户贡献了 75% 的经营收入。当大型平台建设自营网络——例如 Meesho 推出 Valmo——独立 3PL
