chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份与经营模式
        blocks:
          - type: paragraph
            body: >-
              Shadowfax Technologies Limited 于 2015 年 4 月 21 日在德里注册，2021 年将注册办事处迁至卡纳塔克邦，目前将注册办事处和公司办公室列于班加罗尔
              Bellandur。公司的核心定位是技术驱动的第三方物流企业，通过正向快递包裹、逆向取件、换货、即时零售和按需近场配送服务数字商业。官网还将 Shadowfax 360 推介为面向线上卖家和 D2C
              品牌的数字运输平台，因此其模式是把实体配送执行与面向商家的软件结合起来，而非纯软件业务。截至 2025 年 9 月 30 日，披露网络通过 4,299 个触点覆盖印度 14,758
              个邮政编码。留存证据没有披露当前确切客户数和员工数；配送合作伙伴数量不应改称员工人数。
            claimRefs:
              - CO001
              - CO002
              - CO003
              - CO004
