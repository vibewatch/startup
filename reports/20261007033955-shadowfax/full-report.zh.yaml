  - id: TV003
    title: 乐观、基准与悲观情景
    columns:
      - 情景
      - 明确假设
      - 估值与回报逻辑
      - 概率信号与下行触发因素
    rows:
      - - 乐观
        - 增长保持高位；EBITDA 利润率扩大；集中度下降；商户产品规模化。
        - 只有在取得一级市场市值桥接表后，溢价才可能有依据；目前没有证据支持数值区间。
        - 信号：利润率持续扩大。触发因素：增长仍在但服务恶化。
      - - 基准
        - 增长正常化；利润率逐步改善；集中度缓慢下降。
        - 回报取决于入场价格，因此应等待核对后的价格和摊薄数据。
        - 信号：现金转化为正。触发因素：利润率在 FY26 水平附近停滞。
      - - 悲观
        - 定价压力、集中度和服务故障逆转运营杠杆。
        - 估值倍数收缩和盈利失望将造成显著下行；尚未确定底部。
        - 信号：服务和客户结构转弱。触发因素：EBITDA 利润率逆转或现金消耗重新出现。
    notes: 由于分配到的来源池缺少当前报价、完全摊薄股份数和当前可比估值倍数，情景区间仍为定性判断。
    claimRefs:
      - CV003
      - CV005
      - CV006
      - CV007
      - CV008
      - CV009
