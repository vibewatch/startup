      - number: '1.3'
        title: 资本历程与持股
        blocks:
          - type: paragraph
            body: >-
              留存来源无法支持一个经过勾稽的终身融资总额。TechCrunch 在 2024 年 2 月报道，由 TPG NewQuest 领投、包含老股交易的 $100 million Series
              E，使一级和二级融资合计超过 $220 million。Indexed.vc 目前报告六轮融资共 $207.5 million，并将 2026 年 1 月 $95 million 的 venture round
              列为最新事件。金额、期间和交易定义不同，应作为冲突保留，而不能压成一个精确总数。随后 IPO 总额为 ₹1,907.27 crore，其中 ₹1,000 crore 为新发行，₹907.27 crore
              为指定机构股东的老股发售。Outlook Business 报道，在 ₹124 的价格区间上限对应的隐含投后估值约为 ₹7,169 crore，而发行最终获两点七二倍超额认购。
