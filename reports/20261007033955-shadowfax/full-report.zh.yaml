figures:
  - id: FO001
    title: 公司里程碑时间线
    type: timeline
    summary: 按日期排列的里程碑追踪了公司成立、网络扩张、私募融资、IPO 以及 FY26 利润拐点。
    data:
      items:
        - date: '2015-04-21'
          label: 公司成立
          detail: Shadowfax Technologies Private Limited 在德里注册成立。
          tone: neutral
          claimRefs:
            - CO001
        - date: '2021-06-25'
          label: 注册办事处迁至卡纳塔克邦
          detail: 注册办事处从德里迁往卡纳塔克邦，设立班加罗尔基地。
          tone: neutral
          claimRefs:
            - CO002
        - date: '2024-02-27'
          label: 据报道完成 $100 million E 轮融资
          detail: TechCrunch 报道了由 TPG NewQuest 领投、包含老股交易的融资轮。
          tone: positive
          claimRefs:
            - CO009
        - date: '2025-09-30'
          label: 全国网络规模
          detail: 网络覆盖达到 14,758 个邮编区域和 4,299 个触点。
          tone: positive
          claimRefs:
            - CO004
        - date: '2026-01-13'
          label: 红鲱鱼招股说明书日期
          detail: RHP 列明一项 ₹1,907.27 crore 的发行，包含新股发行和 OFS 部分。
          tone: neutral
          claimRefs:
            - CO011
        - date: '2026-01-22'
          label: IPO 竞价结束
          detail: 该发行在获得两点七二倍认购后结束。
          tone: positive
          claimRefs:
            - CO013
        - date: '2026-03-31'
          label: FY26 收入规模
          detail: 合并运营收入达到 ₹4,202 crore，同比上升 69.1%。
