  - id: FV001
    title: 从运营证明到估值纪律的推荐逻辑
    type: flow
    summary: 六项相互关联的测试说明，即使具备公开市场准入和运营改善，结论仍是持续跟踪并进一步研究。
    data:
      nodes:
        - id: scale
          label: 规模
          detail: FY26 收入增长提供了运营层面的证明。
        - id: profitability
          label: 盈利能力
          detail: 正利润、EBITDA 和经营现金流提升了投资可行性。
        - id: concentration
          label: 客户集中度
          detail: 前五大客户敞口使风险维持在高位。
        - id: financing
          label: 融资透明度
          detail: 公开融资总额采用了不一致的分母。
        - id: price
          label: 价格证据
          detail: 当前报价和完全稀释后股数仍然缺失。
        - id: decision
          label: 决策
          detail: 持续跟踪并进一步研究；需要补齐估值桥接和安全边际。
      edges:
        - from: scale
          to: profitability
        - from: profitability
          to: concentration
        - from: concentration
          to: financing
        - from: financing
          to: price
        - from: price
          to: decision
    approximationNotes: 该流程是一套决策顺序，不是量化评分模型。
    claimRefs:
      - CV001
      - CV002
      - CV007
      - CV010
      - CV011
      - CV012
      - CV014
      - CV016
