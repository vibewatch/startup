      - number: '2.3'
        title: 买方分层与采用路径
        blocks:
          - type: paragraph
            body: >-
              付费方是购买配送能力的商家或平台，实际用户则在履约、调度和物流团队；指定公开来源没有指明预算负责人，也没有披露合同层面的采购条款。大型市场平台和即时零售平台购买规模与地域服务能力，但也带来集中度和内制化风险。D2C
              品牌和小卖家走的是另一条采用路径：Shadowfax 正在建设专门销售能力，而 Shadowfax 360 提供自助接入、统一费率、零 COD 费用和 D+2 COD 汇款。管理层称 D2C
              包裹有小幅定价溢价、盈利更好，但没有经审计的分部利润率，因此这项收益说法应保留为尽调假设，而非既定市场事实。
            claimRefs:
              - CM001
              - CM009
              - CM010
              - CM011
              - CM016
          - type: table
            tableRef: TM003
            claimRefs:
              - CM001
              - CM009
              - CM010
              - CM011
              - CM016
      - number: '2.4'
        title: 驱动因素、约束与估值相关性
        blocks:
          - type: paragraph
            body: >-
              低线上零售渗透率、快速增长的包裹预测和有利于规模化 3PL 网络的运营复杂度，共同支撑需求增长。Mangal Keshav 还将 Gati Shakti 和 National Logistics Policy
              视为基础设施推动因素；FY26 包裹量增至 72.6 crore，说明 Shadowfax 已将部分需求转化为吞吐量。约束同样具有结构性：截至 2025 年 9 月的六个月内，前五大客户约占营收
              75%；平台可以把业务转回自有网络，非独家配送伙伴也可能切换平台，或在高峰期要求更高激励。因此，估值应绑定已验证的外包份额、客户多元化和单位经济性，而不是只看数字商业 headline 增长。
            claimRefs:
              - CM004
              - CM005
              - CM006
              - CM009
              - CM012
              - CM013
              - CM014
      - number: '2.5'
        title: 展示项
        blocks:
          - type: callout
            title: 外包空间是关键摆动因素
            body: >-
              即时零售需求增长不会一比一转化为第三方物流收入。管理层预计外包配送量从 12-15% 升至 20-25%，会扩大可争夺市场，但 Meesho 的 Valmo
              展示了相反路径：平台可以把履约内制化，将业务量从外部网络收回。
            calloutType: risk
            claimRefs:
              - CM004
              - CM011
  - number: 3
    title: 竞争者
    sections:
      - number: '3.1'
        title: 竞争格局与市场结构
        blocks:
          - type: paragraph
            body: >-
              印度物流业已从分散的区域包裹承运商，转向整合型、技术驱动的第三方物流（3PL）平台和自营配送网络。Shadowfax 的竞争位置较为独特：它是规模化 3PL，运营统一物流网络，同时覆盖电商快递包裹和近场按需履约
              [CP001, CP002]。直接竞争者包括覆盖 18,700+ 个邮政编码的上市全国快递承运商 Delhivery [CP003]，以及服务超过 100,000 家商户的风险投资支持运输聚合平台
              Shiprocket [CP004, CP005]。此外，Shadowfax 还面临自营电商物流部门的结构性竞争，最突出的是 Flipkart 的 Ekart Logistics，其在印度运营超过 3,800
              个网点 [CP006]。Meesho 的 Valmo 等内部自营平台兴起后，可能突然从独立 3PL 手中抽走包裹量，成为关键结构性替代方案 [CP007]。在城内和按需领域，Porter
              等专业平台提供专门的小货车和两轮车运力，挑战 Shadowfax 的近场商家服务 [CP008]。为抵御自营化和利润率侵蚀，Shadowfax 推出 Shadowfax 360，面向中小企业（SMEs）和 D2C
              品牌，提供统一计费、零 COD 费用及 AI 驱动的退回原寄地（RTO）预测 [CP009, CP010]。
            claimRefs:
              - CP001
              - CP002
              - CP003
              - CP004
              - CP005
