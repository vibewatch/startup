              的披露，Shadowfax 面临持续的法定要求和诉讼。公司及集团未确认为债务的争议性 GST 税务追偿主张包括 FY 2020-21 和 2021-22 合计 ₹2.15 crore，高于前一期间的 ₹0.94
              crore。此外，未决法律程序涉及数十起案件：公司已提起 86 起刑事程序，涉及 ₹51.91 million，主要用于追回被盗资产或退票；针对公司的程序包括 2 起刑事案件、18 起税务程序和 1
              起法定程序，合计 ₹42.97 million；针对董事的法律主张合计 ₹190.00 million。覆盖 14,758 至 15,656
              个邮政编码也使平台面临严格的市政商店和机构登记、《合同劳动法》下的劳动法规，以及不断变化的州级零工配送伙伴社会保障规定。不合规可能导致运营暂停、许可证撤销或重大金钱处罚。
