              - CV012
              - CV014
              - CV016
      - number: '8.2'
        title: 正论点与反论点
        blocks:
          - type: paragraph
            body: >-
              正论点是，网络利用率可以把快速增长的包裹量和营收转化为持久经营杠杆。FY26 报告显示合并营收 ₹4,202 crore、净利润 ₹112 crore、Ind AS EBITDA 利润率 5.0% 和经营现金流
              ₹350 crore。Shadowfax 360 也让管理层有渠道向 SME 和 D2C 品牌多元化。反论点同样重要：利润率基础仍薄，前五大客户约占 H1 FY26 营收
              75%，且非代表性的评价样本包含反复配送和支持投诉。只有当利润率提升持续、集中度和服务质量风险下降时，估值溢价才站得住。
            claimRefs:
              - CV003
              - CV004
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV013
          - type: table
            tableRef: TV002
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV013
      - number: '8.3'
        title: 乐观、基准与悲观框架
        blocks:
          - type: paragraph
            body: >-
              在取得缺失的市场价格和稀释输入前，情景分析必须保持定性。乐观情景要求营收继续强劲增长、EBITDA 利润率超过已报告 FY26
              水平，同时新商家产品降低客户集中度且不损害服务。基准情景假设增长正常化、利润率改善继续但速度放缓，回报高度取决于入场价格。悲观情景将倍数压缩与利润率停滞、集中度持续和服务失误结合起来。若不虚构当前市场价值，无法根据指定证据给出可辩护的卢比目标价或回报区间。
            claimRefs:
              - CV003
              - CV005
              - CV007
              - CV008
              - CV009
              - CV014
          - type: table
            tableRef: TV003
            claimRefs:
              - CV003
              - CV005
              - CV006
              - CV007
              - CV008
              - CV009
              - CV014
      - number: '8.4'
        title: 融资历程、退出准备与最终尽调
        blocks:
          - type: paragraph
            body: >-
              上市改善流动性并创造可观察的退出路径，但没有解决历史融资或稀释问题。三个独立数据库报告的累计融资总额差异很大：$200 million、$247 million 和 $567.3 million，最高数字包含
              IPO、股权和二级市场活动。这些分母不可比，也不能当作可用现金或优先权 overhang。最终尽调应勾稽 RHP、IPO
              后股本、期权池、出售持股和任何二级交易。若经营利润率反转、前五大客户集中度不降，或估值仍有溢价而服务质量指标恶化，投资观点应失效。
            claimRefs:
              - CV010
              - CV011
              - CV012
              - CV015
              - CV016
      - number: '8.5'
        title: 展示项
        blocks:
          - type: callout
            title: 价格敏感度是闸门问题
            body: 公开市场身份提高退出准备度，但没有当前市值和完全稀释股份桥接，就不足以支持买入。取得一级估值输入前，应跟踪利润率、集中度和服务质量，以保留选择权。
            calloutType: recommendation
            claimRefs:
              - CV002
              - CV007
              - CV009
              - CV014
              - CV015
