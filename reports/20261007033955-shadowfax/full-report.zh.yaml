        title: 规模、盈利与依赖
        blocks:
          - type: paragraph
            body: >-
              FY26，ScanX 报告合并经营收入 ₹4,202 crore，同比增 69.1%，合并净利润 ₹112 crore，而 FY25 为 ₹6 crore。这些是会计结果，不是 ARR
              或可用现金，不能据此推导未经支持的收入年化运行率。增长和利润拐点说明 IPO 后规模扩大，但集中度仍很高：招股书称截至 2025 年 9 月 30 日的六个月内，最大客户贡献了经营收入的
              48.91%。Outlook Business 另报同期前五大客户约占 75%。因此，公司进入公开市场报告阶段时盈利改善，但仍高度依赖少数商业关系和创始人主导的执行。
