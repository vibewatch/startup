  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界与现状替代方案
        blocks:
          - type: paragraph
            body: >-
              Shadowfax 参与的是支撑印度数字商业的物流环节，而不是完整的零售经济。已有证据显示其服务边界涵盖正向快递包裹和退货、即时零售及餐饮近场配送，以及关键物流和暗店运营等相邻服务。快递业务贡献 Q1 FY27
              营收的 73.4%，仍是经济核心；同季度近场业务约占 20%。D2C 和小商户运输扩大了买方范围，但仍使用同一网络，并非独立的零售 TAM。最重要的替代方案是自营履约：Meesho 的 Valmo
              大幅减少了此前交给外部 3PL 的业务量，说明数字商业增长不会自动转化为第三方物流收入。
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
          - type: table
            tableRef: TM001
            claimRefs:
              - CM001
              - CM002
              - CM003
              - CM004
              - CM010
              - CM016
      - number: '2.2'
        title: 受证据约束的市场规模
        blocks:
          - type: paragraph
            body: >-
              目前最有力的规模证据是一组市场区间，而不是可辩护的 TAM/SAM/SOM 计算。Shadowfax FY25 年报转载 RedSeer 估计，线上零售渗透率可能从 FY 2025 的约 7% 升至 FY
              2030 的 12-14%；不含杂货的电商包裹量可能从 4.9-5.3 billion 增至 15-16 billion，即时零售包裹量则可能从 1.1-1.3 billion 增至 4.6-6.7
              billion。这些是公司发布的第三方预测，并非受独立审阅的市场数据。可服务空间还要更窄：管理层预计即时零售外包配送量从 12-15% 升至 20-25%，但能否让 3PL
              获得这部分空间，取决于平台策略，而非单纯消费者需求。
            claimRefs:
              - CM005
              - CM006
              - CM007
              - CM011
              - CM015
