      - number: '1.2'
        title: 领导层与治理
        blocks:
          - type: paragraph
            body: >-
              两位发起人仍是经营控制的核心。Abhishek Bansal 担任董事长、董事总经理兼首席执行官，负责组织增长和盈利；Vaibhav Khandelwal 担任全职董事兼首席技术官，负责产品开发。两人均毕业于
              IIT Delhi，自公司成立起便参与 Shadowfax，招股书称其拥有超过十年的物流经验。2026 年 1 月招股书披露董事会有 8 名成员：4 名执行董事和 4 名非执行独立董事，其中包括 1
              名女性。正式的独立董事构成扩大了监督范围，但文件也将对发起人和高级管理层的依赖列为具体风险，因此继任梯队和授权深度应纳入尽调。
            claimRefs:
