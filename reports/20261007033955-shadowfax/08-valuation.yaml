company:
  name: Shadowfax
chapter:
  number: 8
  title: Valuation
  summary: >-
    Shadowfax reached the public market with accelerating FY26 revenue, positive profit and
    operating cash flow, but thin margins, customer concentration and inconsistent public
    financing totals limit confidence in a precise valuation. The appropriate stance is
    track/research-more until the current share price, fully diluted share count and cap-table
    overhang can be reconciled against primary filings.
sections:
  - id: recommendation-and-entry-discipline
    title: Recommendation and entry discipline
    body: >-
      The evidence supports a track/research-more recommendation rather than a buy call.
      Shadowfax completed a mixed fresh-issue and offer-for-sale IPO at ₹124 per share, and
      reporting around the offer placed the post-money valuation near ₹7,169 crore. That
      establishes a financing reference, not an attractive entry price as of the run date:
      the assigned evidence does not include a contemporaneous quoted price, a reconciled fully
      diluted share count or a primary cap-table schedule. Entry discipline should therefore
      require a primary-filing valuation bridge and a material margin of safety for a business
      whose profitability is recent and whose logistics economics remain execution-sensitive.
    claimRefs: [CV001, CV002, CV014, CV015]
    tableRefs: [TV001]
    figureRefs: [FV001]
  - id: thesis-and-anti-thesis
    title: Thesis and anti-thesis
    body: >-
      The thesis is that network utilisation can convert rapid shipment and revenue growth into
      durable operating leverage. FY26 reporting shows ₹4,202 crore of consolidated revenue,
      ₹112 crore of net profit, a 5.0% Ind AS EBITDA margin and ₹350 crore of operating cash
      flow. Shadowfax 360 also gives management a channel to diversify toward SMEs and D2C
      brands. The anti-thesis is equally material: the margin base remains narrow, the top five
      customers represented about 75% of H1 FY26 revenue, and a non-representative review sample
      contains repeated delivery and support complaints. A valuation premium is defensible only
      if margin gains persist while concentration and service-quality risk decline.
    claimRefs: [CV003, CV004, CV005, CV006, CV007, CV008, CV009, CV013]
    tableRefs: [TV002]
  - id: scenario-framework
    title: Bull, base and bear framework
    body: >-
      Scenario analysis must remain qualitative until the missing market-price and dilution
      inputs are obtained. The bull case requires revenue growth to remain strong, EBITDA margin
      to expand beyond the reported FY26 level, and newer merchant products to reduce customer
      concentration without weakening service. The base case assumes growth normalises and
      margin improvement continues more slowly, making returns highly dependent on entry price.
      The bear case combines multiple compression with stalled margin progress, persistent
      concentration and service failures. No defensible rupee price target or return range can
      be produced from the assigned evidence without inventing a current market value.
    claimRefs: [CV003, CV005, CV007, CV008, CV009, CV014]
    tableRefs: [TV003]
  - id: financing-history-and-final-diligence
    title: Financing history, exit readiness and final diligence
    body: >-
      Public listing improves liquidity and creates an observable exit path, but it does not
      resolve historical financing or dilution. Three independent databases report materially
      different cumulative funding totals: $200 million, $247 million and $567.3 million, with
      the largest figure including IPO, equity and secondary-market activity. Those denominators
      are not comparable and cannot be treated as cash available or preference overhang. Final
      diligence should reconcile the RHP, post-IPO share capital, option pool, selling-holder
      stakes and any secondary transactions. The investment view should break if operating
      margin reverses, top-five concentration fails to fall, or service-quality indicators
      deteriorate while valuation remains premium.
    claimRefs: [CV010, CV011, CV012, CV015, CV016]
