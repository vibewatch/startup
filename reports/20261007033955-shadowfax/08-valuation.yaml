callouts:
  - calloutType: recommendation
    title: Price sensitivity is the gating issue
    body: >-
      Public-market status improves exit readiness, but it does not justify a buy without a
      current market-cap and fully diluted share bridge. Preserve optionality by tracking margin,
      concentration and service quality while primary valuation inputs are obtained.
    claimRefs: [CV002, CV007, CV009, CV014, CV015]
