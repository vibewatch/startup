      - CU015
figures:
  - id: FU001
    title: Shadowfax customer acquisition and service journey
    type: journey-map
    summary: >-
      The company is adding assisted distribution to its self-serve seller funnel, but public evidence
      stops before cohort retention, renewal, and expansion outcomes.
    data:
      items:
        - label: Merchant demand
          detail: Online sellers, D2C brands, and marketplaces seek shipping access.
          touchpoints:
            - Shadowfax 360
        - label: Digital self-onboarding
          detail: Eligible sellers can enter through the company-operated digital shipping platform.
          touchpoints:
            - Self-serve dashboard
        - label: Assisted discovery
          detail: Planned local channel partners bring offline brands and SMEs into the funnel.
          touchpoints:
            - Tier 1 and Tier 2 channel partners
        - label: Assisted onboarding
          detail: Channel partners are expected to onboard sellers and help them use the platform.
          touchpoints:
            - Local partner support
        - label: Order and credit support
          detail: Partners are expected to manage orders and extend credit to participating sellers.
          touchpoints:
            - Partner portal
            - Working-capital support
        - label: Pickup and delivery
          detail: Shadowfax retains responsibility for physical pickup and delivery across its network.
          touchpoints:
            - Shadowfax logistics network
    approximationNotes: >-
      This is a qualitative operating sequence from company-issued descriptions, not measured funnel
      conversion; no stage populations, conversion rates, retention rates, or expansion rates were disclosed.
    claimRefs:
      - CU001
      - CU016
callouts:
