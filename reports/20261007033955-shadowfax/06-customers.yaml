schemaVersion: "report-v2"
artifact: customers
slug: shadowfax
runDate: "2026-10-07"
company:
  name: Shadowfax
chapter:
  number: 6
  title: Customers
  summary: >-
    Shadowfax has demonstrated substantial shipment adoption and serves a mix of enterprise
    e-commerce, hyperlocal, D2C, and SME customers, but its disclosed mix remains concentrated:
    Outlook Business reported that the top five clients supplied about 75% of revenue in H1 FY26.
    Public evidence is materially weaker on named production deployments, customer outcomes,
    retention, renewals, and contract durability.
sections:
  - id: customer-segments
    title: Customer segments and economic roles
    body: >-
      Shadowfax addresses several distinct buyer groups rather than a single customer archetype.
      Its own Shadowfax 360 page markets a digital shipping platform to online sellers, D2C brands,
      and marketplaces. Outlook Business provides the clearest economic segmentation: the CEO said
      e-commerce represented roughly 70% of the business, hyperlocal about 20%, and D2C brands
      around 25% of revenue in the prior year. Those figures are management statements reported by
      the publication, may use overlapping or different classification bases, and therefore should
      not be summed into a single mix. The same interview describes D2C as the fastest-growing
      customer segment and links its strategic value to willingness to pay for speed and reliability.
      Low-reputation third-party profiles also characterize Shadowfax as a broad national logistics
      network serving e-commerce and quick-commerce demand, but they are directional evidence rather
      than customer-verified proof. The segment map is credible at a category level; payer identity,
      contract structure, and revenue quality within each category remain largely undisclosed.
    claimRefs:
      - CU001
      - CU010
      - CU011
      - CU012
      - CU015
    tableRefs:
      - TU001
  - id: adoption-and-customer-proof
    title: Adoption trajectory and named-customer proof
    body: >-
      Reported operating volume shows genuine platform use at scale. ScanX, summarizing the audited
      FY26 results, reported 72.6 crore orders for FY26, up 66.4% year over year, and 22.6 crore
      orders in Q4, up 100.8% year over year and 10.0% sequentially. It also reported a network of
      15,656 pin codes and 4,778 touchpoints. A later company-issued release republished by Realty &
      More reported 24.7 crore Q1 FY27 orders and 65% revenue growth to Rs 1,358 crore; these are
      issuer claims rather than independent customer confirmations. Named-account evidence is much
      thinner. ForgeUp lists Meesho, Flipkart, Zepto, BigBasket, and Decathlon as key partners, but
      the low-reputation article supplies no contracts, customer quotations, deployment dates, or
      outcome measurements. Accordingly, the named-customer exhibit records those names as reported
      relationships only and leaves production-versus-pilot status unverified. Shipment growth proves
      aggregate activity, not customer retention, account breadth, or realized customer ROI.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU013
    tableRefs:
      - TU002
      - TU003
  - id: durability-concentration-and-expansion
    title: Durability, concentration, and expansion
    body: >-
      Customer concentration is the principal disclosed durability risk. Outlook Business, citing
      the red herring prospectus, reported that the top five clients represented about 75% of total
      revenue in the six months ended September 30. The CEO also said revenue from select customers
      declined from 88% in FY24 to 74% in the following year, indicating diversification but leaving
      the exact definitions, current denominator, and individual counterparty exposures unclear.
      Shadowfax is pursuing a broader acquisition funnel: a company-issued release announced a plan
      for 1,000 channel partners over three years, with partners providing assisted onboarding, order
      management, and credit while Shadowfax handles pickup and delivery. This could reduce dependence
      on large digital accounts, but the plan is forward-looking and does not yet demonstrate acquired,
      retained, or profitable SME cohorts. The assigned official news-page fetch exposed only an office
      address rather than substantive customer evidence, so it cannot close those gaps. Investment
      diligence should prioritize cohort retention, renewal and churn data, top-customer contracts,
      and customer-authored evidence of production outcomes.
    claimRefs:
      - CU007
      - CU008
      - CU009
      - CU014
      - CU016
    figureRefs:
      - FU001
tables:
  - id: TU001
    title: Customer segmentation and economic role
    columns:
      - Segment
      - Buyer / user / payer
      - Primary use case
      - Scale or strategic signal
      - Revenue / strategic value
      - Evidence gap
    rows:
      - - Enterprise e-commerce
        - Marketplace logistics and operations teams buy and pay; end consumers receive or return parcels
        - Nationwide parcel and reverse-logistics execution
        - Management said the mature e-commerce segment was roughly 70% of the overall business
        - Largest disclosed business component and a major profitability contributor
        - Account-level revenue, tenure, renewal, and service-level terms are undisclosed
      - - Hyperlocal and quick commerce
        - Platform operations teams buy and pay; merchants and consumers use the delivery network
        - Time-sensitive local delivery
        - Management said the segment was about 20% of revenue and growing 75-80% year over year
        - Fast growth, but management said percentage margins remained below e-commerce
        - No customer-level retention, utilization, or profitability data
      - - D2C brands
        - Brand logistics teams buy and pay; digital shoppers receive parcels
        - Same-day, next-day, and direct shipping
        - Management said D2C generated around 25% of revenue in the prior year
        - Reported as the fastest-growing customer segment with premium-service willingness to pay
        - Classification overlap and cohort economics are not reconciled
      - - Online sellers and marketplaces
        - Sellers or marketplace operators self-onboard and pay through Shadowfax 360
        - Digital shipping through one dashboard
        - Officially marketed to online sellers, D2C brands, and marketplaces
        - Broadens acquisition beyond negotiated enterprise relationships
        - Active account count, repeat use, and revenue per seller are unavailable
      - - Offline SMEs and regional sellers
        - Local businesses buy; channel partners assist onboarding and order management
        - Assisted access to nationwide logistics
        - A 1,000-partner rollout is planned over three years, not yet achieved
        - Potential diversification into Tier 2 cities and manufacturing clusters
        - No acquired-customer, retention, credit-loss, or unit-economics evidence
    notes: >-
      Segment shares are management statements reported by Outlook Business and may overlap or use
      different denominators; planned channel scale is company-issued and forward-looking.
    claimRefs:
      - CU001
      - CU007
      - CU010
      - CU011
      - CU012
  - id: TU002
    title: Customer growth and adoption trajectory
    columns:
      - Metric
      - Reported value
      - Period / date
      - Source and attribution
      - Confidence
      - Implication and missing denominator
    rows:
      - - Orders delivered
        - 72.6 crore; 66.4% YoY growth
        - FY26
        - ScanX summary of audited company results
        - Medium
        - Strong aggregate usage; customer and order concentration are not supplied
      - - Quarterly orders
        - 22.6 crore; 100.8% YoY and 10.0% QoQ growth
        - Q4 FY26
        - ScanX summary of company results
        - Medium
        - Accelerating volume; no distinct active-customer denominator
      - - Network reach
        - 15,656 pin codes and 4,778 touchpoints
        - FY26 disclosure
        - ScanX summary of company results
        - Medium
        - Broad serviceability; coverage does not prove recurring customer demand
      - - Quarterly orders
        - 24.7 crore
        - Q1 FY27
        - Shadowfax-issued release republished by Realty & More
        - Medium-low
        - Continued volume scale; independent verification and customer mix are absent
      - - Quarterly revenue
        - Rs 1,358 crore; 65% YoY growth
        - Q1 FY27
        - Shadowfax-issued release republished by Realty & More
        - Medium-low
        - Commercial growth, but not retention or same-customer expansion
      - - Top-five client concentration
        - About 75% of total revenue
        - Six months ended September 30 in FY26 context
        - Outlook Business citing the red herring prospectus
        - Medium-high
        - High concentration; exact client shares and contract protections are unavailable
    notes: >-
      Values preserve each source's period and denominator; crore-denominated order and rupee revenue
      measures are not comparable stages of one funnel, and issuer-reported Q1 FY27 figures are not
      independently verified here.
    claimRefs:
      - CU002
      - CU003
      - CU004
      - CU005
      - CU006
      - CU008
