  evidenceGaps:
    - type: private-evidence-only
      severity: material
      topic: retention
      missingEvidence: >-
        Customer-level NRR, GRR, logo and revenue churn, renewal rates, contract duration, cohort
        curves, and satisfaction measures.
      whyItMatters: >-
        Aggregate order growth cannot distinguish durable recurring demand from new-logo acquisition,
        market growth, pricing changes, or increased usage by a few large accounts.
      diligencePath: >-
        Request audited cohort schedules by segment and customer vintage, the latest board retention
        dashboard, renewal records, and reconciliations to invoiced revenue.
      relatedQuestionRefs:
        - QU004
    - type: missing-source
      severity: material
      topic: named-customers
      missingEvidence: >-
        Customer-authored confirmation of current production deployments, deployment scale, duration,
        service levels, and measured operational or economic outcomes for the reported names.
      whyItMatters: >-
        A third-party partner list does not establish current contracts, production use, customer
        satisfaction, or referenceability.
      diligencePath: >-
        Obtain contracts and invoices for a sample of named accounts, conduct at least three customer
        reference calls, and reconcile customer testimony to operating telemetry.
      relatedQuestionRefs:
        - QU010
      relatedTableRefs:
        - TU003
    - type: enumeration-incomplete
      severity: material
      topic: customer-concentration
      missingEvidence: >-
        A complete current customer roster with revenue share, segment, geography, tenure, contract
        expiry, renewal mechanism, and termination rights.
      whyItMatters: >-
        The disclosed top-five aggregate is high but does not identify single-counterparty exposure
        or the timing and contractual severity of potential churn.
      diligencePath: >-
        Review the top-20 customer schedule, signed master service agreements, renewal calendar, and
        post-period revenue concentration through the latest available month.
    - type: missing-source
      severity: material
      topic: channel-expansion
      missingEvidence: >-
        Actual channel-partner onboarding, merchant acquisition, activation, repeat shipment,
        credit-loss, and contribution-margin cohorts after the September 2026 announcement.
      whyItMatters: >-
        A three-year partner target is a plan rather than evidence that assisted distribution reduces
        concentration or acquires profitable, retained customers.
      diligencePath: >-
        Request monthly funnel and cohort reporting for signed partners and onboarded merchants,
        including activation, 90-day retention, shipments, revenue, credit losses, and payback.
