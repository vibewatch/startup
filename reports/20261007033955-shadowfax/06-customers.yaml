    title: Named customer proof table
    columns:
      - Reported counterparty
      - Segment
      - Reported deployment / use case
      - Production vs pilot
      - Outcome evidence
      - Limitation
    rows:
      - - Meesho
        - E-commerce marketplace
        - Listed by ForgeUp as a key partner
        - Not disclosed
        - No customer-authored quantitative outcome in the assigned evidence
        - A low-reputation third-party list is not contract or production proof
      - - Flipkart
        - E-commerce marketplace
        - Listed by ForgeUp as a key partner
        - Not disclosed
        - No customer-authored quantitative outcome in the assigned evidence
        - Relationship scope, date, and current status are not verified
      - - Zepto
        - Quick commerce
        - Listed by ForgeUp as a key partner
        - Not disclosed
        - No customer-authored quantitative outcome in the assigned evidence
        - A promotional third-party description does not establish service levels
      - - BigBasket
        - Online grocery / quick commerce
        - Listed by ForgeUp as a key partner
        - Not disclosed
        - No customer-authored quantitative outcome in the assigned evidence
        - Relationship scope, date, and current status are not verified
      - - Decathlon
        - Retail / D2C
        - Listed by ForgeUp as a key partner
        - Not disclosed
        - No customer-authored quantitative outcome in the assigned evidence
        - Relationship scope, date, and current status are not verified
    notes: >-
      This is a sample of names appearing in the assigned source pool, not a complete customer roster;
      the only named list comes from a low-reputation third-party article and lacks customer confirmation.
    enumerationScope:
      coverage: sample
      basis: >-
        Named counterparties found in successful prefetched sources assigned to the customers chapter.
