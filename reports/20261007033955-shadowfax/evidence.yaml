evidenceGaps:
  - type: missing-source
    severity: material
    topic: cover-metrics
    missingEvidence: >-
      Exact current customer count and employee headcount, separated from registered users, merchants and gig delivery
      partners.
    whyItMatters: >-
      These denominators are required to assess customer diversification and organizational operating leverage without
      misclassifying non-employees.
    diligencePath: >-
      Request the latest investor presentation, statutory employee disclosure and customer cohort schedule from investor
      relations.
    relatedQuestionRefs:
      - QO007
    relatedTableRefs:
      - TO001
  - type: conflicting-data
    severity: material
    topic: funding
    missingEvidence: >-
      A transaction-level reconciliation of primary capital, secondary sales and IPO proceeds across the
      above-$220-million and $207.5-million reported totals.
    whyItMatters: >-
      Funding raised is not cash available, and incompatible definitions would distort capitalization and
      investor-return analysis.
    diligencePath: Reconcile each private round and secondary transaction against the capitalization table and cash-flow statements.
    relatedQuestionRefs:
      - QO005
    relatedTableRefs:
      - TO001
  - type: private-evidence-only
    severity: material
    topic: post-offer-ownership
    missingEvidence: >-
      Final post-offer fully diluted ownership and residual stakes for promoters and each institutional selling
      shareholder.
    whyItMatters: >-
      The RHP left post-offer percentages blank, preventing a current assessment of control, overhang and remaining
      investor alignment.
    diligencePath: >-
      Obtain the final prospectus, basis-of-allotment filing and latest exchange shareholding pattern, then reconcile
      them to the RHP.
    relatedQuestionRefs:
      - QO008
    relatedTableRefs:
      - TO003
  - type: enumeration-incomplete
    severity: minor
    topic: leadership
    missingEvidence: A current post-IPO roster of all senior management appointments, departures and delegated succession coverage.
    whyItMatters: >-
      The founder table intentionally covers only promoter-founders and cannot establish whether key-person exposure has
      changed since the RHP.
    diligencePath: Compare exchange leadership disclosures and the latest annual report with the January 2026 RHP management roster.
    relatedQuestionRefs:
      - QO003
    relatedTableRefs:
      - TO002
  - type: missing-source
    severity: material
    topic: independent-tam-sam-som
    missingEvidence: >-
      An independently published, methodology-disclosed estimate of Indian third-party last-mile logistics spend that
      separates express, hyperlocal, captive, and outsourced delivery.
    whyItMatters: >-
      Without a spend denominator and outsourcing assumptions, shipment forecasts cannot be converted into a defensible
      TAM, SAM, or SOM for Shadowfax.
    diligencePath: >-
      Obtain the underlying RedSeer study and at least one independent logistics-market dataset, then reconcile shipment
      counts, revenue pools, and captive versus outsourced shares.
    relatedQuestionRefs:
      - QM009
    relatedTableRefs:
      - TM002
  - type: private-evidence-only
    severity: material
    topic: buyer-budget-ownership
    missingEvidence: >-
      Named budget owners, procurement cycles, contract terms, pricing schedules, and renewal data by marketplace,
      quick-commerce, D2C, and enterprise segment.
    whyItMatters: >-
      These details determine sales-cycle length, pricing power, switching cost, concentration durability, and which
      internal buyer controls adoption.
    diligencePath: >-
      Request anonymized contracts, win-loss data, procurement maps, renewal cohorts, and customer reference calls
      segmented by buyer type.
    relatedQuestionRefs:
      - QM010
    relatedTableRefs:
      - TM003
  - type: private-evidence-only
    severity: material
    topic: d2c-segment-economics
    missingEvidence: >-
      Audited D2C segment revenue, contribution margin, retention, and cost-to-serve data that tests management's
      pricing-premium and profitability claims.
    whyItMatters: >-
      D2C diversification improves the market thesis only if its claimed yield survives higher service complexity and
      acquisition costs.
    diligencePath: >-
      Review segment-level management accounts and cohort economics, then compare D2C pricing, return-to-origin rates,
      sales costs, and contribution margins with anchor marketplaces.
  - type: private-evidence-only
    severity: material
    topic: capital-adequacy
    missingEvidence: >-
      Current unrestricted cash, debt and lease obligations, working-capital facilities, covenants, and a monthly runway
      bridge after IPO deployment.
    whyItMatters: >-
      The IPO offer size and accounting profit do not establish cash availability or the duration for which committed
      network investment can be funded.
    diligencePath: >-
      Obtain the latest management accounts, bank confirmations, debt and lease schedules, facility documents, capex
      commitments, and a 24-month cash forecast.
    relatedQuestionRefs:
      - QI007
    relatedTableRefs:
      - TI003
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: >-
      Gross profit, direct contribution margin per order, delivery-partner cost per order, loss and refund rates, CAC,
      sales cycle, payback, churn, and expansion by customer cohort.
    whyItMatters: >-
      Reported revenue, EBITDA, and operating cash flow cannot reveal whether growth creates durable contribution
      economics or depends on mix and working-capital timing.
    diligencePath: >-
      Request monthly cohort economics by service line, client, geography, parcel profile, acquisition channel, and
      delivery outcome, reconciled to audited accounts.
    relatedQuestionRefs:
      - QI009
    relatedTableRefs:
      - TI002
      - TI003
  - type: private-evidence-only
    severity: material
    topic: pricing
    missingEvidence: >-
      Realized enterprise and SME pricing, discount schedules, minimum-volume commitments, escalation clauses, SLA
      deductions, return charges, and customer-level gross margins.
    whyItMatters: >-
      Public Shadowfax 360 terms are list pricing and cannot establish average realized yield or resilience under
      customer renegotiation.
    diligencePath: >-
      Review the top customer contracts and anonymized invoice-level pricing, then reconcile billed yield and deductions
      to service-line revenue.
    relatedTableRefs:
      - TI001
      - TI002
  - type: missing-source
    severity: material
    topic: security-and-privacy-assurance
    missingEvidence: >-
      Independent security certification, privacy governance for facial recognition and delivery data, penetration-test
      results, control false-positive rates, and incident history.
    whyItMatters: >-
      The operating model processes identity, location, shipment, image, and video data across a distributed workforce
      and physical network.
    diligencePath: >-
      Request current ISO or SOC reports, privacy-impact assessments, biometric retention policies, penetration-test
      summaries, and the security-incident register.
    relatedQuestionRefs:
      - QE007
    relatedTableRefs:
      - TE002
      - TE003
  - type: missing-source
    severity: material
    topic: developer-signal
    missingEvidence: >-
      A verified public repository, package registry, API reference, changelog, status page, engineering talk, or
      practitioner-community record tied to Shadowfax Technologies.
    whyItMatters: >-
      The assigned developer and academic results do not independently demonstrate release cadence, developer adoption,
      software quality, or platform reliability.
    diligencePath: >-
      Obtain authenticated API documentation and changelogs, engineering release history, reliability dashboards,
      dependency inventory, and repository contribution metrics.
    relatedQuestionRefs:
      - QE009
    relatedTableRefs:
      - TE001
      - TE003
  - type: private-evidence-only
    severity: material
    topic: reliability-and-performance
    missingEvidence: >-
      Production uptime, peak-load latency distributions, dispatch success rates, routing accuracy, hub utilization,
      system recovery objectives, and customer SLA attainment.
    whyItMatters: >-
      Public design descriptions and rated hub capacity do not establish sustained reliability or economic performance
      under production load.
    diligencePath: >-
      Review twelve months of monitoring dashboards, incident postmortems, disaster-recovery tests, facility utilization
      logs, and customer SLA scorecards.
    relatedQuestionRefs:
      - QE004
      - QE006
    relatedTableRefs:
      - TE002
      - TE003
  - type: private-evidence-only
    severity: material
    topic: retention
    missingEvidence: >-
      Customer-level NRR, GRR, logo and revenue churn, renewal rates, contract duration, cohort curves, and satisfaction
      measures.
    whyItMatters: >-
      Aggregate order growth cannot distinguish durable recurring demand from new-logo acquisition, market growth,
      pricing changes, or increased usage by a few large accounts.
    diligencePath: >-
      Request audited cohort schedules by segment and customer vintage, the latest board retention dashboard, renewal
      records, and reconciliations to invoiced revenue.
    relatedQuestionRefs:
      - QU004
  - type: missing-source
    severity: material
    topic: named-customers
    missingEvidence: >-
      Customer-authored confirmation of current production deployments, deployment scale, duration, service levels, and
      measured operational or economic outcomes for the reported names.
    whyItMatters: >-
      A third-party partner list does not establish current contracts, production use, customer satisfaction, or
      referenceability.
    diligencePath: >-
      Obtain contracts and invoices for a sample of named accounts, conduct at least three customer reference calls, and
      reconcile customer testimony to operating telemetry.
    relatedQuestionRefs:
      - QU010
    relatedTableRefs:
      - TU003
  - type: enumeration-incomplete
    severity: material
    topic: customer-concentration
    missingEvidence: >-
      A complete current customer roster with revenue share, segment, geography, tenure, contract expiry, renewal
      mechanism, and termination rights.
    whyItMatters: >-
      The disclosed top-five aggregate is high but does not identify single-counterparty exposure or the timing and
      contractual severity of potential churn.
    diligencePath: >-
      Review the top-20 customer schedule, signed master service agreements, renewal calendar, and post-period revenue
      concentration through the latest available month.
  - type: missing-source
    severity: material
    topic: channel-expansion
    missingEvidence: >-
      Actual channel-partner onboarding, merchant acquisition, activation, repeat shipment, credit-loss, and
      contribution-margin cohorts after the September 2026 announcement.
    whyItMatters: >-
      A three-year partner target is a plan rather than evidence that assisted distribution reduces concentration or
      acquires profitable, retained customers.
    diligencePath: >-
      Request monthly funnel and cohort reporting for signed partners and onboarded merchants, including activation,
      90-day retention, shipments, revenue, credit losses, and payback.
  - type: missing-source
    severity: material
    topic: regulatory-legal-risk-register-coverage
