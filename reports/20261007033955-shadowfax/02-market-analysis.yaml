callouts:
  - calloutType: "risk"
    title: "The Outsourcing Aperture Is the Key Swing Factor"
    body: "Quick-commerce demand growth does not translate one-for-one into third-party logistics revenue. Management's expected move from 12-15% to 20-25% outsourced delivery volume would expand the contestable pool, but Meesho's Valmo demonstrates the opposite path: platforms can internalize fulfilment and remove volume from external networks."
    claimRefs:
      - "CM004"
      - "CM011"
