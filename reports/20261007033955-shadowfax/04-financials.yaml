company:
  name: "Shadowfax"
chapter:
  number: 4
  title: "Financials"
  summary: >-
    Secondary reporting of Shadowfax's FY26 results shows a sharp scale and profitability
    inflection: ₹4,202 crore of consolidated operating revenue, ₹112 crore of net profit,
    and ₹350 crore of operating cash flow. The underwriting case remains incomplete because
    realized pricing, direct contribution margin, working-capital detail, current unrestricted
    cash, debt obligations, and runway are not disclosed in the assigned public evidence.
sections:
  - id: "revenue-model-and-commercial-quality"
    title: "Revenue Model and Commercial Quality"
    body: >-
      Business Index describes Shadowfax as charging per-parcel delivery fees across express,
      hyperlocal, Prime, Prime Large, and CriticaLog services. The official Shadowfax 360 page
      adds a public list-price layer for online sellers and D2C brands: flat-rate pricing, zero
      COD charges, no extra return-to-origin costs, and D+2 COD remittance. Those are advertised
      terms rather than evidence of realized enterprise pricing, discounts, collections, or
      gross margin. Outlook Business, citing the red herring prospectus and the CEO, reports
      that mature e-commerce represented roughly 70% of the overall business, while hyperlocal
      contributed about 20% of revenue and carried lower margins. This mix supports volume
      density but leaves revenue quality sensitive to contract pricing, service performance,
      and a concentrated set of large clients.
    claimRefs:
      - "CI001"
      - "CI008"
      - "CI009"
      - "CI010"
      - "CI015"
    tableRefs:
      - "TI001"
      - "TI002"
  - id: "scale-profitability-and-cost-absorption"
    title: "Scale, Profitability, and Cost Absorption"
    body: >-
      ScanX's summary of the audited FY26 result announcement reports consolidated revenue from
      operations of ₹4,202 crore, consolidated net profit of ₹112 crore, and Ind AS EBITDA of
      ₹212 crore at a 5.0% margin. It also reports 72.6 crore orders, up 66.4% year on year, and
      ₹185 crore invested in network expansion, sort-center automation, and capacity. These
      figures indicate that higher shipment density is absorbing fixed network costs, but the
      evidence does not disclose gross profit, contribution margin per parcel, delivery-partner
      expense per order, or segment-level profitability. Net profit is not cash burn, and the
      reported accounting turnaround does not by itself establish durable unit economics.
      Underwriting therefore depends on reconciling audited statements to operational cohorts
      and separating working-capital benefits from recurring operating margin.
    claimRefs:
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
      - "CI006"
      - "CI007"
    tableRefs:
      - "TI003"
    figureRefs:
      - "FI001"
  - id: "cash-generation-and-capital-needs"
    title: "Cash Generation and Capital Needs"
    body: >-
      ScanX reports FY26 net cash flow from operating activities of ₹350 crore. Outlook Business
      separately relays management's statement that H1 FY26 produced about ₹146 crore of
      operating cash flow and more than ₹80 crore of free cash flow, while planned annual capex
      was about ₹120 crore for the next three to four years and ₹423.4 crore had been earmarked
      for network infrastructure. The January 2026 IPO created a ₹1,000 crore fresh issue, but
      the approximately ₹907 crore offer-for-sale component went to selling shareholders and
      is not company cash. Funding raised is therefore not the same as cash available. None of
      the assigned sources provides a current unrestricted cash balance, debt schedule,
      project-finance obligations, working-capital facility usage, or management runway bridge,
      so forward capital adequacy cannot be concluded from the offer size alone.
    claimRefs:
      - "CI005"
      - "CI007"
      - "CI011"
      - "CI012"
      - "CI013"
      - "CI014"
  - id: "financial-verdict-and-diligence-blockers"
    title: "Financial Verdict and Diligence Blockers"
    body: >-
      Public evidence supports a cautiously positive view of near-term operating leverage, not
      a complete underwriting model. Revenue, net profit, EBITDA, shipment growth, and operating
      cash flow all improved in FY26, yet the top five clients accounted for about 75% of revenue
      in the six months ended September 30 according to Outlook Business's prospectus-based
      account. A sample of early-2026 Trustpilot reviews alleges delayed or unattempted
      deliveries, inaccurate status updates, and weak support; these anecdotes do not establish
      an incident rate, but they identify a service-quality channel that could affect refunds,
      SLA penalties, retention, and realized pricing. The financial verdict is therefore
      improving scale with thin disclosed EBITDA economics, material concentration, ongoing
      network investment, and unresolved liquidity inputs. Management data is required before
      assigning a durable margin path or financing runway.
    claimRefs:
      - "CI003"
      - "CI004"
      - "CI008"
      - "CI010"
      - "CI016"
