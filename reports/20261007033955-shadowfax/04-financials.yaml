callouts:
  - calloutType: "insight"
    title: "Scale Has Reached Reported Profitability"
    body: >-
      FY26 secondary reporting shows ₹4,202 crore of revenue, ₹212 crore of Ind AS EBITDA,
      ₹112 crore of net profit, and ₹350 crore of operating cash flow. The direction is positive,
      but direct contribution margin and working-capital quality remain undisclosed.
    claimRefs:
      - "CI002"
      - "CI003"
      - "CI004"
      - "CI005"
  - calloutType: "risk"
    title: "Capital Adequacy Cannot Be Read From the IPO Headline"
    body: >-
      Only the ₹1,000 crore fresh-issue component represented gross new company funding; the
      roughly ₹907 crore offer for sale went to selling shareholders. Current unrestricted cash,
      debt obligations, and runway still require direct verification.
    claimRefs:
      - "CI013"
      - "CI014"
