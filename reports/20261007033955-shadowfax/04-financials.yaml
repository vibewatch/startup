  evidenceGaps:
    - type: "private-evidence-only"
      severity: "material"
      topic: "capital-adequacy"
      missingEvidence: >-
        Current unrestricted cash, debt and lease obligations, working-capital facilities,
        covenants, and a monthly runway bridge after IPO deployment.
      whyItMatters: >-
        The IPO offer size and accounting profit do not establish cash availability or the
        duration for which committed network investment can be funded.
      diligencePath: >-
        Obtain the latest management accounts, bank confirmations, debt and lease schedules,
        facility documents, capex commitments, and a 24-month cash forecast.
      relatedQuestionRefs:
        - "QI007"
      relatedTableRefs:
        - "TI003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "unit-economics"
      missingEvidence: >-
        Gross profit, direct contribution margin per order, delivery-partner cost per order,
        loss and refund rates, CAC, sales cycle, payback, churn, and expansion by customer cohort.
      whyItMatters: >-
        Reported revenue, EBITDA, and operating cash flow cannot reveal whether growth creates
        durable contribution economics or depends on mix and working-capital timing.
      diligencePath: >-
        Request monthly cohort economics by service line, client, geography, parcel profile,
        acquisition channel, and delivery outcome, reconciled to audited accounts.
      relatedQuestionRefs:
        - "QI009"
      relatedTableRefs:
        - "TI002"
        - "TI003"
    - type: "private-evidence-only"
      severity: "material"
      topic: "pricing"
      missingEvidence: >-
        Realized enterprise and SME pricing, discount schedules, minimum-volume commitments,
        escalation clauses, SLA deductions, return charges, and customer-level gross margins.
      whyItMatters: >-
        Public Shadowfax 360 terms are list pricing and cannot establish average realized yield
        or resilience under customer renegotiation.
      diligencePath: >-
        Review the top customer contracts and anonymized invoice-level pricing, then reconcile
        billed yield and deductions to service-line revenue.
      relatedTableRefs:
        - "TI001"
        - "TI002"
