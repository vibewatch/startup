company:
  name: "Shadowfax"
chapter:
  number: 1
  title: "Company Overview"
  summary: "Shadowfax is a Bengaluru-based, technology-led third-party logistics operator that progressed from its 2015 incorporation to a completed 2026 IPO and reported ₹4,202 crore of FY26 consolidated revenue. The public evidence also leaves material diligence work around a conflicting cumulative-funding total, post-offer ownership, current customer and employee counts, and a largest client that represented 48.91% of H1 FY26 revenue."
sections:
  - id: "identity-and-operating-model"
    title: "Identity and Operating Model"
    body: "Shadowfax Technologies Limited was incorporated in Delhi on April 21, 2015, moved its registered office to Karnataka in 2021, and now lists its registered and corporate office in Bellandur, Bengaluru. Its core identity is a technology-led third-party logistics company serving digital commerce through express forward parcels, reverse pickups, exchanges, quick-commerce and on-demand hyperlocal delivery. The official site also markets Shadowfax 360 as a digital shipping platform for online sellers and D2C brands, so the model combines physical delivery execution with merchant-facing software rather than representing a software-only business. At September 30, 2025, the disclosed network reached 14,758 Indian pin codes through 4,299 touchpoints. Exact current customer and employee counts are not disclosed in the retained evidence; delivery-partner counts should not be relabeled as employee headcount."
    claimRefs:
      - "CO001"
      - "CO002"
      - "CO003"
      - "CO004"
    tableRefs:
      - "TO001"

  - id: "leadership-and-governance"
    title: "Leadership and Governance"
    body: "The two promoters remain central to operating control. Abhishek Bansal is Chairman, Managing Director and Chief Executive Officer, with responsibility for organizational growth and profitability; Vaibhav Khandelwal is a Whole-Time Director and Chief Technology Officer responsible for product development. Both are IIT Delhi graduates, have been associated with Shadowfax since incorporation, and are described in the prospectus as having more than ten years of logistics experience. The January 2026 prospectus reported an eight-member board: four executive directors and four non-executive independent directors, including one woman. That formal independent representation broadens oversight, but the filing also identifies dependence on the promoters and senior management as a specific risk, making succession depth and delegated authority appropriate diligence topics."
    claimRefs:
      - "CO005"
      - "CO006"
      - "CO007"
      - "CO008"
    tableRefs:
      - "TO002"

  - id: "capital-history-and-ownership"
    title: "Capital History and Ownership"
    body: "The retained sources do not support one reconciled lifetime funding number. TechCrunch reported in February 2024 that a $100 million TPG NewQuest-led Series E, including secondary transactions, took primary and secondary capital raised above $220 million. Indexed.vc now reports $207.5 million across six rounds and labels a $95 million January 2026 venture round as the latest event. The different amounts, periods and transaction definitions should be preserved as a conflict rather than collapsed into a precise total. The subsequent IPO totaled ₹1,907.27 crore: ₹1,000 crore of fresh capital and a ₹907.27 crore offer for sale by named institutional shareholders. Outlook Business reported an implied post-money valuation of about ₹7,169 crore at the ₹124 upper price-band level, while the issue ultimately closed 2.72 times subscribed."
    claimRefs:
      - "CO009"
      - "CO010"
      - "CO011"
      - "CO012"
      - "CO013"
    tableRefs:
      - "TO003"

  - id: "scale-profitability-and-dependencies"
    title: "Scale, Profitability, and Dependencies"
    body: "For FY26, ScanX reported consolidated revenue from operations of ₹4,202 crore, up 69.1% year over year, and consolidated net profit of ₹112 crore versus ₹6 crore in FY25. These are accounting results, not ARR or cash available, and they should not be converted into an unsupported revenue run rate. The growth and profit inflection demonstrate greater scale after the IPO, but concentration remains material: the prospectus says the largest client generated 48.91% of revenue from operations in the six months ended September 30, 2025. Outlook Business separately reported that the top five clients represented about 75% over that period. The company therefore enters public-market reporting with improved profitability but significant dependency on a small set of commercial relationships and on founder-led execution."
    claimRefs:
      - "CO005"
      - "CO008"
      - "CO014"
      - "CO015"
      - "CO016"
    figureRefs:
      - "FO001"

