        - 全球 2m 会员；英国 900k；印度 1.1m+；2025 年 9 月以 $1.5bn 估值融资 $120m+
        - 个体经营者、微型 SME、新公司、成长中的英国 SME、印度 MSME
        - 入门级管理组合强，覆盖账户、开票、会计、储蓄和信贷
        - 不是银行；原生透支、网点支持和重度跨境资金管理更弱
      - - Revolut Business
        - 多实体结构；Business 计划页披露在 Revolut Ltd EMI 许可下，同时英国银行业务已上线
        - 数十万企业；可触达 75m+ Revolut 客户
        - 英国及国际 SME、初创公司、分布式团队
        - 多币种、FX、卡、审批和 API 广度的公开证据最强
        - 付费计划 £10 起；监管 / 实体复杂度仍不如纯英国银行对手简单
      - - Starling Business
        - 持完整牌照的英国银行
        - 全球 6m+ 账户；£12.7bn 存款；FY2026 收入 £887m
        - 以英国为主、想要免费银行服务和强信任信号的 SME
        - 无月费，免费转账，带开票、记账和税务层
        - 跨境主张不如 Revolut 或 Wise 有差异化
      - - ANNA Money
        - PayrNet 电子货币账户；由 Griffin 支撑的储蓄附加账户
        - 私营公司；获取到的一手材料没有可比公开客户数
        - 自行管理税务的个体经营者和小公司董事
        - 对自助用户来说，AI 收据扫描和实时税额预估格外强
        - 主账户没有 FSCS；现金、透支和会计主导工作流较弱
      - - Mettle
        - NatWest 支撑、带 FSCS 保护的银行账户
        - 获取到的页面未披露大型公开企业账户数
        - 个体经营者和小型有限公司
        - 银行背书外壳内包含 FreeAgent、开票和记账
        - 国际、借贷和规模叙事不如大型挑战者清晰
      - - HSBC Small Business / ex-Kinetic（竞品）
        - 持牌传统银行
        - 大型传统银行资产负债表；Kinetic 已对新用户关闭
        - 初创企业、换户企业，以及需要专家或借款的 SME
        - 网点 / 专家接入和更宽的借款工具箱
        - 数字 SME 主张在周期中途调整，比 Tide 更少由管理软件驱动
      - - Monzo Business
        - 持完整牌照的英国银行
        - 消费者端规模品牌强；企业产品面向英国居民实体
        - 主要用 GBP 经营的英国个体经营者和小型有限公司
        - 免费 Lite，加上强 app UX、MTD 准备度和价格不高的 Pro 档
        - 国际业务、现金密集型业务和非英国导向企业匹配度低
      - - Countingup
        - 通过 PPS 提供、受 FCA 监管的电子货币账户
        - 100k+ 英国小企业；已处理 £10bn+ 客户交易
        - 需要账户 + 会计的自雇者和小企业
        - 低入门价内置记账和开票
        - 电子货币保护、与存款挂钩的订阅和桌面端限制，约束更广 SME 使用
      - - Wise Business
        - 受 FCA 监管的电子货币 / 国际账户
        - 全球 700k+ 企业每月转移 $16bn
        - 供应商、承包商或客户跨境的 SME
        - 国际转账和多币种经济性的公开证据最强
        - 不是完整的英国 SME 管理或借贷工具栈
      - - Allica Bank
        - 持牌英国银行
        - 定位成熟企业，采用客户经理模式
        - 余额更高、银行需求更宽的成熟 SME
        - 4.08% AER、现金返还、客户经理和银行级信任
        - 资格和余额门槛让它不太适合最小的早期企业
