  - id: TI005
    title: 公开财务缺口表
    columns:
      - 缺失指标
      - 重要性
      - 当前最佳公开线索
      - 投资判断风险
      - 具体尽调要求
    rows:
      - - 产品级收入结构
        - 用来判断经常性质量和周期性
        - 官方页面展示多条收入线，但没有分部桥
        - 可能掩盖收入集中在低质量或低利润率线
        - 按订阅、手续费、合作伙伴佣金和信贷提供 2024 年与 LTM 收入
      - - 合并现金、烧钱额和现金跑道
        - 用来判断稀释和再融资风险
        - 账目提到充足性和融资额度，但没有现金数字
        - 无法测试下行情景跑道或下一轮融资触发点
        - 提供集团现金、月度烧钱额、12 个月计划和下行情景
      - - 毛利率和净抽成率
        - 用来测试软件与金融业务的利润率耐久性
        - 定价公开；定价背后的经济性不公开
        - 如果合作伙伴和服务成本高，可能高估质量
        - 按产品提供毛利润和合作伙伴成本栈
      - - 信贷表现分批数据
        - 用来判断信贷扩张是增厚收益还是增加风险
        - 申报文件称存在拨备；产品条款和仓储线公开
        - 信贷扩张时，损失可能比手续费收入上升更快
        - 提供批准、逾期、违约、回收和拨备覆盖数据
