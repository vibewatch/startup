      - number: '2.4'
        title: 增长驱动、约束和估值相关性
        blocks:
          - type: paragraph
            body: >-
              增长逻辑真实存在，但并非没有摩擦。开放银行采用率持续上升，OBL 的支付和 VRP 指标指向更深入的日常使用，英国政府的数字采用计划也明确试图降低中小企业在能力、成本和认知上的障碍。Making Tax
              Digital、计划中的电子发票和更广泛的智能数据基础设施，都强化了打包行政平台的逻辑。印度围绕 Udyam 正式化、TReDS 和数字借贷的政策推动，也扩大了当地中期可触达切口。约束同样重要。CASS
              数据显示，小企业切换量相对总切换量仍然很小，说明赢下主企业账户仍比吸引新成立或绿地公司注册更难。Tide 的活期账户主张也仍通过 ClearBank 依赖合作伙伴，因此信任、FSCS
              理解、运营韧性和监管披露仍是转化问题的一部分。竞争强度不是理论问题：Starling 和 Xero 都在相邻层展示出大规模数字分发能力，英国经济数据也仍显示不确定性、投入成本通胀和破产带来的压力。因此，Tide
              2025 年 9 月 TPG 领投、估值 $1.5 billion 的 $120 million 融资，必须放在一家公司已于 2026 年 5 月达到 200 万全球会员、但最新备案年度仍报告 2024 年营业额
              £177.2 million、经营亏损 £11.3 million 的背景下解读。
