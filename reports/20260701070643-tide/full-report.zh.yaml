      - number: '4.3'
        title: 资本支持、融资结构和流动性影响
        blocks:
          - type: paragraph
            body: >-
              Tide 的公开资本故事显示规模在改善，但融资依赖仍清晰。2024 年账目称，公司年内从 Tide Holdings 获得 £6.7 million 股权资金，年后又获得 £7.2
              million。同一份备案称，Tide 在 2024 年 4 月对循环授信再融资，把到期日推至 2025 年 4 月，利率从 10.25% 提至 12.25%，之后又把授信延至 2026 年 7
              月，以维持流动性并支持扩张。Companies House 抵押登记强化了这一点：这不是历史噪音。Triplepoint 的担保权益至少到 2025 年 3 月仍未解除，签署后的账目也明确称 Tide 于
              2025 年 4 月用 TriplePoint Capital LLC 对现有信贷设施再融资。除了企业层面的授信，Fasanara 还宣布一条 £100 million 证券化额度，意在支持超过 £300
              million 的短期 SME 营运资本贷款。随后在 2025 年 9 月，TPG 以 $1.5 billion 估值领投超过 $120 million 的一级和二级融资，Apax
              支持并新增一个董事会席位。账目还称 Tide
              定期审阅管理账目、预测、流动性计划和压力情景，并认为自身资本充足。即便如此，公开材料仍没有披露合并现金、债务约束条款或精确资金续航期，因此可见结论是公司能获得资本，而不是已经具备自我融资独立性。
