      - number: '5.3'
        title: 一体化行政平台差异化
        blocks:
          - type: paragraph
            body: >-
              最强的公开差异化信号不是原始银行深度，而是 Tide 试图把相邻行政工作压进同一条 SME 流程。ClearBank 案例研究很有信息量，因为它把主张定义为活期账户加会计、薪资、开票、费用管理、VAT
              和申报，并声称行政工作减少 48 天。Tide 自己的页面也强化同一逻辑。Xero 有专门连接器，覆盖交易、类别、账单和发票；更广泛的 Open Banking 文档覆盖
              Sage、FreeAgent、KashFlow、Clear Books、Reckon、Coconut 和 Crunch；MTD 流程被定位成 2026 年合规解决方案；公司注册直接滚入账户；薪资被卖成企业主可以在
              Tide 内部操作的功能，而不是必须通过会计师或单独软件。这是对更薄银行应用的可信切口。取舍在于，Tide
              的护城河由集成和流程驱动，而不是由资产负债表驱动，因此它依赖持续的合作伙伴兼容性，以及跨多个模块的良好执行，而不是一个深度自有的银行核心。
