              路线图含义更多通过相邻产品发布和招聘显现，而不是通过精修的公开路线图页面显现。Onfolk 收购解释了为什么薪资现在像一个有意义的嵌入式模块，而不是占位功能；2026 年 4 月的 MTD 截止日期也给 Tide
              面向个体经营者提供了及时的合规钩子。德国和印度显示出可复用的市场进入模式：复用 Tide 控制界面，再嵌入 Adyen 或贷款方面板等本地合作伙伴。公开招聘强化了 Tide 仍在投入平台深度，岗位覆盖
              Accounts Platform、Threat Detection、Internal Tools 和 Ongoing Monitoring。即便如此，主要产品缺口仍是结构性的。Tide
              仍不把自己呈现为完整银行，仍依赖 ClearBank、PPT、Adyen 和合作贷款方提供关键通道，在跨境资金管理广度上也仍窄于围绕本地账户或多币种余额搭建的公司。结果是，Tide 是一个有真实 SME
