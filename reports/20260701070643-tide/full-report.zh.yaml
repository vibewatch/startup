      - number: '3.2'
        title: 定价与能力对比
        blocks:
          - type: paragraph
            body: >-
              只看月费标价，Tide 有竞争力，但并非独一无二。Tide 仍宣传免费层和每月 £12.49、£27.49、£69.99 的付费层；Starling 和 Monzo 保持可信的免费入口；HSBC
              替代小企业账户没有月账户费；ANNA 从按量付费起步；Countingup 试用后从 £3 起；Allica 在余额超过门槛时免月费。也就是说，Tide 的真正优势不是“别人没有低价起点”，而是 Tide
              把入门定价与异常宽的中小企业行政包结合在一起：开票、会计挂钩、薪资软件、储蓄和信贷都出现在同一个生态里。即便如此，优势也有条件。Starling 的会计层现在覆盖记账、开票、税务估算和 VAT 提交；Monzo
              高阶层加入 MTD、税务资金桶和集成；Mettle 包含 FreeAgent；ANNA 在自管税务的个体经营者中赢下狭窄但真实的利基。Tide 在跨境和资金管理重度使用场景上也明显失分：Revolut 和
              Wise 围绕多币种账户、国际转账和外汇经济性构建，而 Tide 不是。最清晰的负面视角很直接：Tide 能赢行政主导的第一账户，但当买方需要银行信任、透支或更深全球资金流动时，它更弱。
