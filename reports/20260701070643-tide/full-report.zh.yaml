  - id: TV004
    title: 可比估值表
    columns:
      - 可比公司
      - 公开估值 / 市值锚点
      - 最新公开类收入指标
      - 粗略倍数或映射
      - 为什么可比
      - 主要局限
    rows:
      - - Tide
        - 2025 年 9 月私募轮，估值 $1.5bn
        - 2024 年 Tide Platform Ltd 营业额 £177.2m
        - 按仅申报营业额口径并做宽口径汇率归一后，约 ~6-7x
        - 最接近标的公司的直接锚点
        - 实体营业额不等于合并集团经常性收入。
      - - Wise
        - 2026 年 7 月市值 $11.71bn
        - FY2026 净收入 $2.50bn
        - ~4.7x 净收入
        - 有透明披露和商业用户的盈利型上市金融科技公司。
        - 消费者和资金流转组合比 Tide 的中小企业工作流聚焦更宽。
      - - BILL
        - 2026 年 7 月市值 $3.60bn
        - FY2025 收入 $1.50bn
        - ~2.4x 收入
        - 中小企业财务运营软件的上市锚点。
        - 美国软件组合和渠道模式不同于 Tide 的银行邻接平台。
      - - Revolut
        - 2025 年 11 月隐含估值 $75bn
        - 2025 年收入 £4.5bn，PBT £1.7bn
        - 溢价异常值；规模和盈利能力明显高于 Tide
        - 显示投资人愿意为全球化、高增长、高盈利平台支付什么价格。
        - 规模、品牌和产品宽度差异很大；不适合作为公平中点锚。
      - - Monzo
        - 2024 年 10 月二级交易估值 $5.9bn
        - FY2026 收入 £1.7bn，调整后 PBT £172.6m
        - 盈利型英国挑战者银行，收入倍数大致中个位数或更低
        - 英国新银行，有当前经济性披露。
        - 估值日期和收入日期不完全对齐；零售组合更宽。
      - - Starling
        - 最新明确公开定价仍可追溯到 2021 年 $1.9bn 融资基准
        - FY2026 收入 £887m，PBT £217m
        - 缺少新近公开定价，无法支撑当前私募倍数；盈利能力是关键映射
        - 作为持牌银行中小企业可比，更适合比较经济性而非新鲜定价。
        - 公开估值标记已过期，因此更多是定性可比，而非定价可比。
      - - Qonto
        - 2022 年 Series D 轮，估值 €4.4bn
        - 2026 年新闻页称 600k+ 中小企业 / 自由职业者，以及 €600m+ 融资
        - 欧洲聚焦中小企业平台有稀缺性溢价，但估值标记已过期
        - 欧洲最贴近的企业银行 / 财务管理战略同行。
        - 保留证据集中没有更新公开估值，也没有当前经审计公开收入。
    notes: 这是用于估值三角定位的精选可比集，不是声称每一行都同样可比。收入数字、币种和日期保留下来，是为了显示精度在哪里失效。
    enumerationScope:
      coverage: sample
      basis: >-
        Rows capture the best-supported public and private comparables retained for this chapter; the set is
        intentionally selective because many fintech peers still lack fresh public pricing or like-for-like revenue
        disclosure.
