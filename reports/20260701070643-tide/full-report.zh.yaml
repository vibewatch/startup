      - number: '8.4'
        title: 下行、基准与上行区间
        blocks:
          - type: paragraph
            body: >-
              给 Tide 定框架，最好从粗略启发式入手，而不是假装精确。按当前公开会员数，2025 年 9 月轮次约等于每个全球会员 $750；如果把全部价值只归因于 900,000 名英国会员，隐含价值升至约每名英国会员
              $1,667。这些启发式本身不是估值方法，但说明这一轮有多依赖国际用户变现和多产品挂载，而不只是英国账户增长。熊市情景是：2024
              年申报文件在比多头预期更长的时间里仍是最佳公开收入分母；支持与合作伙伴摩擦让市场不给溢价倍数；国际规模扩张带来的成本快于变现。在这条路径下，估值可能跌破上一轮。基准情景是：当前估值大体守住，因为英国规模仍强，印度和欧洲继续扩张，Tide
              在行为合规或合作伙伴风险没有急剧恶化的情况下，证明每会员收入改善。牛市情景不能只靠会员增长头条；它需要证据表明 Tide 扩大的产品组合、AI
              投入和新地域能转化为更高质量的经常性收入，并让集团盈利能力明显改善。因此情景跨度仍宽。今天的公开证据支持上一轮有可支撑性，但新投资者若在其上方买入，安全边际有限。
