  - id: TP002
    title: 定价 / 打包对比
    columns:
      - 服务商
      - 入门价格
      - 转账经济性
      - 国际 / FX
      - 有证据支持的管理工具栈
      - 主要注意点
    rows:
      - - Tide
        - 免费；Smart £12.49；Pro £27.49；Max £69.99
        - 免费档每月含 5 笔转账；Smart 30 笔；Pro/Max 不限
        - 仅付费档享 0% FX；SWIFT/CHAPS 限高档计划
        - 开票、会计接口、薪酬软件、储蓄、信贷
        - 对较大余额而言，非银行信任缺口仍是主要反对理由
      - - Revolut Business
        - Basic £10；Grow £30；Scale £90；Enterprise 定制
        - 免手续费本地和国际额度随档位明显上升
        - 25+ 币种、FX 额度、全球 / 本地账户信息
        - 卡、审批、费用、API、商户收单、利息
        - 从第一天起就付费；不为最便宜的纯本土微型 SME 优化
      - - Starling Business
        - 基础账户 £0
        - 英国转账免费；邮局现金存款 0.7%
        - 不是最强的 FX 主导主张
        - 开票加 Starling Accounting；Accounting Plus 至 2027 年 4 月为 £7，之后 £14
        - 跨境广度弱于 Revolut 或 Wise
      - - ANNA Money
        - £0 PAYG；其上为付费计划
        - 评测称 PAYG 含 20 笔免费转账；之后每笔 20p
        - 提供国际支付，但披露的 FX 工具栈并不最深
        - AI 收据扫描、实时 HMRC 预估、开票、公司注册
        - 现金存款贵；主账户是受资金隔离保护的电子货币
      - - Mettle
        - 主账户无月费
        - 银行背书的 SME 活期账户经济性
        - 公开材料较少强调 FX 深度
        - FreeAgent、开票和记账
        - 产品宽度不如 Tide 或 Revolut
      - - HSBC Small Business
        - 无账户月费
        - 英国数字银行免费；其他收费见价目表
        - 传统银行通道，但不是跨境专家定位
        - 借款和专家接入比管理软件更突出
        - Kinetic 已关闭；主张不同于此前 app 主导的定位
      - - Monzo Business
        - Lite £0；Pro £9；Team £25
        - Lite 档英国转账免费
        - 入账 FX 按 1% 转换；对外国际转账经 Wise
        - 全部计划支持 MTD；Pro 增加开票、Tax Pots 和集成
        - 居住地、现金和转账限制降低部分 SME 的匹配度
      - - Countingup
        - 3 个月免费试用；之后 £3/月起
        - 与存款挂钩的订阅和按笔收费
        - 没有重大 FX 优势证据
        - 内置会计、开票、税务计算
        - 不是银行；成本随存款和交易量上升
      - - Wise Business
        - 一次性设置费；之后按使用计费
        - 按用付费的跨境经济性
        - 低成本国际转账和多币种收款的公开证据最强
        - 支付、批量付款、卡、多币种余额
        - 没有完整本土 SME 管理、信贷或薪酬工具栈
      - - Allica Bank
        - 高于余额门槛免月费；低于门槛 £25/月
        - 每月最多 150 笔免费 Faster Payments
        - 面向本土银行业务的定位
