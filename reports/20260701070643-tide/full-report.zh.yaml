      - number: '3.3'
        title: 印度扩张与本地可比公司
        blocks:
          - type: paragraph
            body: >-
              印度比较集合有战略意义，因为它显示 Tide 增长最快的区域并没有收敛成英国 SME 银行的同一结构。Tide 自己 2026 年 5 月披露称印度已经贡献超过 110
              万会员，但最相关的本地可比对象不只是数字活期账户品牌。OPEN 把自己定位成面向财务团队的连接式银行操作系统，提供多银行可见性、审批、应收、应付、ERP 连接和向企业流程延伸的定制定价。RazorpayX
              组合了活期账户、卡、薪资、付款、信贷和集成，并在 2026 年 6 月围绕现金流、收款和付款自动化推出代理式银行功能。HDFC 和 ICICI
              又处在另一条轴上：它们是既有银行，拥有宽广的活期账户菜单、担保、GST 相关支付能力、卡、POS 工具和 Tide 尚未原生复制的其他资产负债表产品。这意味着 Tide
              在印度的切口不在于比本地银行更像银行，而在于拿下想要更简单运营栈的
              MSME，再扩展到注册、支付、借贷和行政。这是一条合理增长路径，但也意味着印度执行风险部分来自与连接更深的财务套件争夺产品复杂度，而不只是与英国式新银行争夺获客。
