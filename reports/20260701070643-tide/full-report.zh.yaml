              公开融资证据从 2025 年末开始最强。TPG 自己的公告，并由 Mint 和 The Economic Times 佐证，称 Tide 在 2025 年 9 月以 $1.5 billion 估值完成超过
              $120 million 融资，Apax Digital Funds 也参与，TPG 合伙人 Yemi Lalude 获得董事会席位。这一轮叠加在快速上升的采用指标之上。Tide 2024 年备案称业务到
              2025 年 6 月已超过 150 万会员；到 2026 年 5 月，City AM 和 The Economic Times 报道 Tide 全球会员突破 200 万，其中英国中小企业 90 万，自 2022
