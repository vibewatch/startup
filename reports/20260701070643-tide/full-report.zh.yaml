companyProfile:
  summary: >-
    Tide 是一家成立于 2015 年、总部在伦敦的未上市中小企业金融平台。它不是银行，而是获 FCA 授权的电子货币机构；在英国旗舰企业账户上，Tide 借助 ClearBank
    提供底层能力，并把产品扩展成覆盖储蓄、卡、开票、会计、税务工具、薪资、公司注册和信贷的一体化财务与行政栈。到 2026 年 5 月，公开及公司关联来源指向 200 万全球会员，其中英国约 90 万、印度超过 110 万；Tide
    Platform Ltd 2024 年备案显示营业额 £177.2m、经营亏损 £11.3m。2025 年 9 月 TPG 领投的一轮融资把估值定在 $1.5
    billion，确认公司已进入独角兽后阶段，但合并集团经济性和累计融资额仍只披露了一部分。
  foundedDate: '2015-05-18'
  founders:
    - name: George Bevis
      role: 创始人
      background: 早期创始人访谈把 Tide 最初切入点与小企业银行服务痛点、以及围绕创业者的问题定义联系起来。
      claimRefs:
        - CO047
  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom
  productSummary: 面向中小企业的金融与行政平台，把英国企业账户、储蓄、卡、开票、会计和 MTD 流程、薪资、公司注册、支付以及合作伙伴主导的信贷组合在一起；在印度，产品主张更偏向 MSME 正式化、支付、费用管理和贷款方接入，而不是照搬英国活期账户。
  customerFocus: 英国个体经营者、自由职业者、有限公司和扩张中的中小企业；在印度，则是正在进入数字化流程的 MSME、店主、手工艺者、自由职业者和女性创业者。
  businessModel: 免费到付费会员计划，加上转账、外汇、卡、储蓄和支付变现，再叠加薪资与软件订阅、会计 / 行政挂载、合作伙伴主导的信贷分发，以及部分与 Tide 相关的放贷敞口。
