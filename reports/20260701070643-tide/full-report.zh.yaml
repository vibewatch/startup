  - number: 6
    title: 客户
    sections:
      - number: '6.1'
        title: 分部和地理足迹
        blocks:
          - type: paragraph
            body: >-
              Tide 的公开客户分层比许多私有金融科技同业清楚得多，但地域之间差异很大。在英国，Tide
              一直面向个体经营者、自由职业者、承包商、有限公司和正在扩张的小企业营销，它们想要低摩擦企业账户，以及会计、开票、团队支出和信贷相邻工具。个体经营者和有限公司页面都把 Tide
              定义为一体化行政界面，而不是狭窄的活期账户包装；移动商店列表页也重复同一目标受众。印度是不同切口：Tide 首页和印度相关报道强调店主、手工艺者、自由职业者、女性创业者，以及小城市里的业主经营者。他们更需要符合
              GST 要求的开票、QR 和账单支付、费用管理和贷款方接入，而不是一比一替代传统 SME
              活期账户。这个差异很重要。英国分层像是企业账户主导的获客漏斗，可扩展到行政和资金管理功能；印度主张则更接近面向进入正式数字流程的欠服务微型企业的企业金融运营层。
