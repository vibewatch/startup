      - number: '6.3'
        title: 满意度、支持和摩擦
        blocks:
          - type: paragraph
            body: >-
              Tide 的满意度信号是真正混合的，而不是一边倒地弱。正面看，Trustpilot 汇总评分在 35,681 条评论中仍有 4.4/5；其 AI
              摘要称，近期评论者常称赞员工有帮助、解释清楚、设置容易、用户体验顺畅。应用商店评分也足够高，说明许多会员确实获得日常价值。但负面证据太持续，不能忽视。Resolver
              投诉页面把客户服务问题、账户暂停、回复延迟或缺失列为常见案例类型。Trustpilot 近期评论页包括账户关闭、付款冻结、回复慢和沟通不清的投诉，而 Tide 自己的回复反复提到例行账户检查。Capterra
              的混合评论方向类似：用户称赞设置速度、员工卡和集成，但也抱怨宕机、20p
              入账转账费，以及在关键发薪时企业账户被扣住数日且无人回复。这个模式不能证明系统性失败，但确实显示围绕合规审查、沟通速度和费用感知存在真实支持风险税。
