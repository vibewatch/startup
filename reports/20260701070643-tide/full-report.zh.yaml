  - id: TV001
    title: 建议摘要表
    columns:
      - 维度
      - 评估
      - 当前为什么重要
      - 什么会改善判断
    rows:
      - - 建议
        - 跟踪
        - 质量和规模真实存在，但公开数据还没有证明相对 2025 年 9 月那轮估值有足够安全垫。
        - 拿到 2026 年合并收入、利润率和客群数据。
      - - 置信度
        - 中
        - 融资轮、申报文件和会员规模都有公开证据，但集团层面的经济性桥接仍不完整。
        - 拿到经审计的集团披露，或类似贷款人会看的管理账。
      - - 风险评级
        - 高
        - 非银行结构、对合作伙伴的依赖、投诉证据，以及仍处亏损的申报实体，都会放大结果分化。
        - 按地区拿出更干净的行为数据和更持久的利润转化。
      - - 估值判断
        - 合理到略偏紧
        - 把这一定价看成稀缺性价格可以成立，但对照最有证据支撑的上市可比锚点，并不算明显便宜。
        - 更低的入场价格，或更强的已披露变现能力，才会形成上行偏斜。
      - - 决策含义
        - 不要追高估值上调轮
        - 现有证据支持保持纪律、谨慎承做，而不是因错失恐惧而追单。
        - 若新披露或二级流动性重置入场价，再重新评估。
    notes: 这张表把证据集转成投委会式决策，而不是泛泛的公司质量评分。
    claimRefs:
      - CV004
      - CV001
      - CV002
      - CV038
      - CV040
