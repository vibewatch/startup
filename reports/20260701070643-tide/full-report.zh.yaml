      - number: '1.4'
        title: 里程碑、控制框架和负面信号
        blocks:
          - type: paragraph
            body: >-
              Tide 的时间线如今同时包含规模里程碑和仍然重要的控制负担。2024 年 Companies House 账目显示，公司增长很快，但尚未完全走出投入期：营业额升至 £177.2 million，经营亏损收窄至
              £11.3 million，同时公司仍依赖母公司股权支持和再融资后的循环授信；该授信后来延至 2026 年 7 月。同一份备案还记录了 2024 年 10 月收购 Onfolk 技术、员工和客户，用于加入薪资和
              HR 功能；这与独立报道一致，后者称 Onfolk 是 HMRC 认可的薪资专门公司，收购金额未披露。ClearBank 的合作伙伴案例研究又加上一层控制视角，显示 Tide
              在英国的主张仍有很大一部分依赖外部基础设施和补助支持的市场建设。负面一侧，Merchant Machine 的 2026 年评论快照引用 4.2/5 的 Trustpilot 评分，但也提到 17%
              一星评论，提醒我们服务和费用透明度即便在采用激增时仍会制造摩擦。结论是，公司执行动能强，但治理集中、合作伙伴依赖和支持质量仍需要直接尽调。
