  - id: TV005
    title: 论点失效和一票否决触发因素表
    columns:
      - 触发因素
      - 阈值 / 证据
      - 为什么击穿论点
      - 行动含义
    rows:
      - - 集团经济性持续不透明
        - 下一次估值事件前，仍没有可信的合并收入和利润率桥接。
        - 战略溢价无法对照经营现实来检验。
        - 拒绝按高于上一轮的价格承做。
      - - 国际变现滞后
        - 会员增长继续，但单会员收入或挂载率没有改善。
        - 平台叙事变成低收益获客故事。
        - 转向熊情景，并寻求更低入场价。
      - - 合作伙伴或行为摩擦恶化
        - 出现更多投诉证据、故障摩擦或合作伙伴限制。
        - 市场可能相对持牌银行或上市同行扩大折扣。
        - 暂停尽调，或要求更强下行保护。
      - - 轮次条款缺乏吸引力
        - 优先权、参与权或二级交易占比过高，限制新资金上行。
        - 名义估值可能夸大普通股经济性。
        - 除非价格或条款改善，否则回避。
    notes: 这些是投资人的实务交易否决条件，不是抽象公司风险。
    claimRefs:
      - CV010
      - CV013
      - CV014
      - CV038
      - CV042
      - CV045
      - CV048
  - id: TV006
    title: 最终尽调问题表
    columns:
      - 主题
      - 缺失证据
      - 重要性
      - 负责人 / 尽调路径
    rows:
      - - 合并集团收入
        - 2025/2026 年按地区和产品拆分的收入，以及与英国申报文件的调节表。
        - 没有这项证据，Tide 看起来便宜还是昂贵，取决于使用哪个分母。
        - 向管理层索取，或在 NDA 下获取投资人材料。
      - - 利润率质量
        - 主要产品线的毛利率、贡献利润率和服务成本。
        - 判断产品宽度是在创造经营杠杆，还是遮住弱变现。
        - 用管理账做财务尽调。
      - - 2025 年轮次条款
        - 优先权栈、反稀释、二级 vs 一级比例，以及员工流动性细节。
        - 普通股上行可能与名义投后估值有实质差异。
        - 法律和股权结构表审查。
      - - 客群质量
        - 按英国、印度和欧洲客群拆分的活跃会员收入、留存和投诉率。
        - 证明新市场是有吸引力地扩张，还是只是在增加表面会员数。
        - 经营指标包和支持数据拉取。
      - - 合作伙伴依赖
        - 与 ClearBank 和其他关键伙伴的商业经济性与连续性规划。
        - 合作伙伴集中度是最清晰的公开倍数压缩风险之一。
        - 如可行，与交易对手做商业、法律和运营尽调。
    notes: 这些问题按最能改变投资判断的程度排序，不按索取难易度排序。
    claimRefs:
      - CV010
      - CV011
      - CV038
      - CV042
      - CV047
      - CV048
