      - number: '4.4'
        title: 敞口、耐久性和尽调阻塞项
        blocks:
          - type: paragraph
            body: >-
              耐久性建立在有用但合作伙伴很重的架构之上。ClearBank-Tide 条款把分工说得很清楚：ClearBank 提供企业活期账户和即时储蓄账户，Tide 拥有界面、卡和会员支持。2024
              年备案补充称，大多数英国资金放在 ClearBank，印度资金位于 Transcorp 托管结构，德国资金放在 Adyen。这让 Tide
              在资产负债表久期风险上更轻，但也意味着跨司法辖区的交易对手、运营和监管韧性依赖第三方。管理层在备案中直接承认这一点，把行为、金融犯罪、信贷与交易对手、监管和信息安全风险列为主要敞口。负面证据并非灾难性，但有意义。两项
              Financial Ombudsman 决定认定，Tide 在通知上不公平，或在封锁 / 关闭账户后扣留资金时间过长；Resolver 的投诉记录和 Statrys
              评论也都指向账户暂停或客户超出低成本国内使用场景时的摩擦。因此，财务判断是混合的：Tide 的模型看起来比许多 SME
              金融科技同业更多元、更偏软件、资本更充足，但亏损状态、有担保授信依赖、合作银行依赖和稀薄的合并披露，仍阻碍对利润率耐久性或下行情景韧性做出高确信判断。
