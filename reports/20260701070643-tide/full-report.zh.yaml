      - number: '8.2'
        title: 可比公司三角校验
        blocks:
          - type: paragraph
            body: >-
              最好的公开锚点分成两组。第一组是上市 fintech 和 SME 软件公司，市值和收入披露清楚。Wise 是这一组里最干净的同币种基准：FY2026 业绩显示净收入 $2.5
              billion，CompaniesMarketCap 显示 2026 年 7 月市值约 $11.7 billion，约为净收入 4.7x。BILL 用公开数据看更便宜，2026 年 7 月市值接近 $3.6
              billion，对应 FY2025 收入 $1.5 billion，约 2.4x。Adyen 和 Xero
              都是已经放大的上市平台，产品深度强，但披露币种和业务组合让本章的纯公开框架难以做干净的倍数归一化。第二组是私营挑战者银行或商业金融同行。Revolut 的 2025 年年报和 2025 年 11
              月流动性事件展示了真正的溢价离群值：£4.5 billion 收入、£1.7 billion 税前利润、767,000 个企业客户，以及隐含 $75 billion 估值。Monzo 和 Starling
              是更相关的英国运营对照，因为两者都披露了有意义的 2026 年盈利能力，而 Tide 最新申报实体仍亏损。Qonto 在战略上相关，因为它同样是聚焦 SME 的欧洲平台，但最有支撑的估值标记仍是 2022 年
              Series D 的 €4.4 billion，因此它更适合作为稀缺性信号，而不是当前市场标记。放在这些可比对象里，Tide
              上一轮并不荒唐，但若投资者不给国际期权价值和交叉销售深度大幅加分，它就比更干净的公开低个位数到中个位数收入倍数锚点更贵。
