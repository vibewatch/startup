      - number: '8.3'
        title: 压缩风险与稀缺性溢价
        blocks:
          - type: paragraph
            body: >-
              两股相反的估值力量同时可见。压缩故事很直白。Tide 的公开申报仍显示亏损；法律披露强调它不是银行；英国账户层依赖 ClearBank 和相关合作伙伴基础设施；正式投诉结果和客户评论渠道里也有负面证据。2025
              年 1 月 ClearBank 案例研究的价值恰恰在于它把合作依赖说得很明白：Tide 的英国账户方案是一套组合式嵌入式银行技术栈，而不是自成一体的银行。Financial Ombudsman
              裁决和评论页面不能证明结构性失败，但足以支持相对更干净、更赚钱、持牌银行或上市 fintech 可比对象给一定折价。稀缺性故事也成立。很少有欧洲平台同时具备 Tide 声称的英国 SME 渗透率、2
              million 全球会员、广泛行政与金融接触面，以及已超过 1.1 million 会员的印度业务。因此 Tide
              落在公开市场常用不同方式定价的两个框之间：它比狭义活期账户工具更有价值，又比牌照齐全的新银行或已盈利上市基础设施商风险更高。所以上一轮最容易被解释成对未来变现宽度的战略溢价；若坚持看今天的公开申报指标和严格的公开倍数纪律，则最难辩护。投资问题不是抽象地判断
              Tide 是否高质量，而是价格里已经包含了多少未来变现。
