      - number: '2.3'
        title: 买方、用户、付费方和采用路径
        blocks:
          - type: paragraph
            body: >-
              Tide 的买方地图不是一个同质的 SME 大筐。个体经营者和自由职业者最敏感于价格，往往买方和用户是同一个人；Tide
              自己的个体经营者文案提到，他们法律上不必持有企业账户，因此采用由便利性、记账和税务分离驱动，而不是由监管驱动。拥有少数员工的微型企业更关注开票、现金流可见性和第一批信贷产品；注册中小企业则会加入董事、财务经理或外包会计师等有影响力的流程参与者。Tide
              会计定价也把个体经营者和有限公司分开，说明付费方部分按法律形式和流程复杂度分层。在印度，用户仍可能是业主经理，但激活路径更受正式化驱动，因为注册、支付和贷款接入都是价值主张的一部分。各分部的采用顺序通常从公司注册或开户开始，扩展到支付和税务行政，之后才进入薪资、储蓄或信贷。这个推进路径对估值很重要，因为会员增长并不自动意味着高软件挂载或高放贷挂载。
