      - number: '5.4'
        title: 安全、隐私和运营韧性
        blocks:
          - type: paragraph
            body: >-
              Tide 的公开信任姿态在控制摘要层面尚可，但在承销细节层面偏薄。公司明确提到新收款人和付款的双因素验证、安全交易限额、即时冻结卡、ISO 27001 认证安全项目、带披露联系人和 PGP key 的公开
              security.txt，以及通过 call 159 或 app 内报告的 24/7 欺诈响应路径。隐私政策补充了真实治理细节：Tide 在 ICO 注册，作为 Tide
              平台数据的数据控制者，并可能在开票、记账、薪资和会计服务中担任数据处理者。状态页也显示 Tide 愿意发布运营事故，包括 2026 年 6 月账户详情可见性问题和 Confirmation of Payee
              问题。缺口在深度。Tide 没有公开提供 DORA 式运营韧性证据、事后复盘细节、供应商控制披露，或对 ClearBank、Adyen、PPT、开放银行合作伙伴事故如何治理和升级的详细说明。
