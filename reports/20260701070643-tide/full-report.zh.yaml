      - number: '2.2'
        title: 英国与印度的规模测算视角
        blocks:
          - type: paragraph
            body: >-
              最干净的公开规模测算起点是实体数量，而不是收入池。DBT 和 House of Commons Library 将 2025 年英国私营部门企业基数定为 570 万，其中微型企业 540 万；ONS 口径更窄的
              VAT 和 / 或 PAYE 注册表只统计 273 万家正式运营企业。这个差异很重要，因为 Tide 可以营销给个体经营者和非正式微型企业，但变现挂载率更可能向更窄的正式、活跃交易基数收敛。UK Finance
              随后提供支出流视角：2026 年 Q1，高街贷款方的 SME 总贷款达到 £5.3 billion，最小企业分部增长尤其强，说明信贷不是装饰性功能，而是有意义的相邻机会。印度提供第二个规模视角：PIB 称截至
              2026 年 2 月，已有 7.83 crore 家企业在 Udyam 或 Udyam Assist 注册，即便不计 Tide 在公开信息中提到的更广泛非正式部门，也已经形成庞大的正在正式化 MSME
              群体。最后，Xero FY26 年报显示行政软件已经是规模化独立类别，全球客户 490 万，英国超过 100 万，这有助于验证 Tide 从账户走向软件的逻辑。
