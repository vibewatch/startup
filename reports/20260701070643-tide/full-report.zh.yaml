      - number: '7.4'
        title: 缓释因素、监控与投资论点破裂触发器
        blocks:
          - type: paragraph
            body: >-
              缓释侧的事实足够扎实，Tide 的风险画像严重，但不必然致命。2024
              年申报文件描述了三道防线模型、专门内审、供应商风险监督、业务连续性和灾难恢复计划、运营韧性情景测试、欺诈模型升级、资本和流动性压力测试，以及交易对手限额和贷款损失拨备监控。Tide 也仍能拿到外部资本；2024
              报告期后，公司既完成估值 $1.5 billion 的轮次，又获得大型 Fasanara 融资额度。但投资者要区分流程性缓释和结构性缓释。Tide 不是银行，英国主要资金流依赖 ClearBank，德国依赖
              Adyen，印度仍取决于牌照选择和合作贷款方，支持质量仍可能把合规审核变成会员可见痛点——这些事实 Tide 无法靠自身流程化解。因此，正确的承销框架应以触发器为核心。Ombudsman
              支持投诉的节奏上升、投诉积压扩大、支付安全工具状态页事故反复出现、APP 赔付显著高于内部压力假设、担保融资无法以可接受条款再融资，或印度牌照长期滑坡，任何一项都说明缓释跟不上复杂度。如果多项同时出现，Tide
              的下行会很快传导到信任、增长、利润率和估值。
