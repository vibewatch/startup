            body: >-
              架构线索指向 Tide：它是横跨多个受监管合作伙伴和支付通道的编排层。在英国，ClearBank 提供活期账户和存款层，而 Tide 条款仍披露部分会员使用 PPT 支持的电子货币模式，并有 Tide 发行的
              Mastercard 卡产品连接到 ClearBank 账户。活期账户条款显示，Tide
              自己的平台在该银行账户上叠加支票影像、开票、会计集成、储蓄转账和第三方访问控制。开放银行开发者门户提供第二个技术表面：Tide 作为 ASPSP 运营，通过 OpenID Connect 流程暴露 AIS、PIS
              和资金确认接口。英国以外，运营模式仍由合作伙伴主导。Tide Germany 称账户由 Adyen 提供，Tide India 则列出一长串合作贷款方，而不是把 Tide
              呈现为直接信贷提供方。这让产品可以跨市场扩展，但也让 Tide 在核心通道、许可和服务连续性上依赖交易对手。
