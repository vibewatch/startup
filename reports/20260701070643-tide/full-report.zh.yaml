  - id: TM001
    title: 市场定义表
    columns:
      - 细分 / 类别
      - 纳入支出
      - 排除支出
      - 买方 / 付款方
      - 相关性
    rows:
      - - 英国 SME 运营账户和核心支付
        - 与经营小企业绑定的商业活期账户、银行卡、转账、账单支付、储蓄和收款
        - 消费者活期账户、个人储蓄、家庭预算工具
        - 业主经理、财务负责人或董事，从企业预算支付
        - 核心切入点，因为 Tide 仍通过开户获取大量会员
      - - 英国记账、开票和税务行政
        - 记账、VAT、Self Assessment、Corporation Tax 准备、发票、现金流可视性和申报工具
        - 大企业 ERP 套件、通用办公生产力工具、消费者税务应用
        - 业主经理加会计或簿记员，通常由企业支付
        - 重要，因为 Tide 营销的是节省行政时间，而不只是银行服务
      - - 薪资和员工行政
        - 小团队的薪资、工资单、薪资相关合规及相邻 HR 行政
        - 企业级 HCM 套件或大公司 HR 系统
        - 创始人、办公室经理或财务经理
        - 相关，因为账户启用后，薪资会提高工作流粘性
      - - 商业信贷和营运资本产品
        - 面向 SME 的无抵押贷款、发票融资、政府支持计划和平台信贷
        - 消费者信用卡、房贷和大型企业司库产品
        - 企业主或财务负责人，由企业现金流提供资金
        - 相关，因为放贷既是变现杠杆，也是信用周期风险
      - - 印度 MSME 正规化和金融栈
        - 面向已注册或正在正规化的 MSME，注册相关金融、支付、贷款和小企业行政
        - 消费者钱包、大企业 ERP、非商业汇款产品
        - 多数情况下，业主经理同时是买方、用户和付款方
        - 重要，因为印度会员增长很大，但变现取决于正规化深度
      - - 排除的相邻领域和现状替代品
        - N/A
        - 消费者银行、大企业 ERP、手工电子表格和作为权宜方案使用的通用个人账户
        - 现有传统银行或内部手工流程
        - 这些是替代品或相邻池，不是 Tide TAM 的增量
    notes: 边界按工作流划定，而不是按机构划定。企业可能在主银行服务之前或同时使用 Tide 软件，但本章排除消费者和大企业支出，即使技术栈看起来相似。
