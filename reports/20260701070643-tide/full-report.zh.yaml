      - 公开证据最强赢家
      - Tide 仍能竞争的原因
      - Tide 输在哪里
    rows:
      - - 银行信任 / 存款保护
        - 中
        - Starling / Monzo / HSBC / Allica
        - Tide 仍可提供由 ClearBank 支撑、并带熟悉 SME 入驻流程的活期账户
        - 它仍是非银行平台，因此资金保障和 FSCS 叙事更复杂
      - - 跨境 FX 与资金管理
        - 弱到中等
        - Revolut Business / Wise Business
        - Tide 可在高档计划覆盖基础国际支付
        - 它缺少 Revolut 或 Wise 原生的多币种深度、额度和 FX 心智
      - - 面向微型 SME 的自助管理 / 税务
        - 强
        - Tide / ANNA / Countingup
        - Tide 把开票、会计接口和相邻管理功能拼成强入门包
        - ANNA 更适合实时税额预估；Countingup 在账户 + 记账的一体化简单性上更深
      - - 持牌银行活期账户经济性
        - 中等
        - Starling / Monzo / Allica
        - 对第一账户或低复杂度用户，Tide 仍有竞争力
        - 持牌银行把信任与低月费或无月费结合起来，部分还给出更好的打包转账
      - - 信贷、关系深度与现金处理
        - 中等
        - HSBC / Allica / HDFC / ICICI
        - Tide 有借贷相邻业务和正在扩展的企业金融工具栈
        - 传统银行或专业银行仍在透支、担保、客户经理和网点时代工作流上胜出
      - - 印度财务运营自动化
        - 起步
        - OPEN / RazorpayX
        - Tide 会员基数增长快，也受益于 MSME 正规化顺风
        - OPEN 和 RazorpayX 已经主打更深的多银行、付款、ERP 和收款编排
    notes: 赢家标签反映各标准下最强公开证据，不是通用排名。不少 SME 会在这些标准之间多平台并用，而不是选一个全能赢家。
