  - number: 4
    title: 财务
    sections:
      - number: '4.1'
        title: 收入模式线索和已报告表现
        blocks:
          - type: paragraph
            body: >-
              Tide 的财务模型看起来比简单的 SME 活期账户订阅更宽，但公开证据仍不足以拼出真正的分部桥。最干净的一手描述来自 2024 年备案：Tide Platform Ltd
              称自己是一家软件与服务业务，运营一个覆盖活期账户、其他金融产品和行政软件的金融平台。这个框架与实际产品界面吻合。官方页面显示，Tide 有免费计划，以及 Smart、Pro 和 Max
              订阅；按使用计价的银行转账和外汇；与计划挂钩的储蓄经济性；付费费用卡；薪资软件；以及大型贷款市场式主张。与此同时，Credit Flex 显示至少部分短期信贷位于 Tide 关联实体内，而不只是推荐收入。2024
              年实体层面报告表现明显改善：营业额从 £113.6 million 升至 £177.2 million，经营亏损从 £33.2 million 收窄至 £11.3 million。到 2026 年 5
              月，City AM 和 The Economic Times 称 Tide 全球会员突破 200 万，包括 90 万英国中小企业、印度超过 110
              万，且多数收入仍来自英国。这支撑了规模，但也意味着承销仍缺少公开的逐产品收入结构，以及从备案实体到更广集团故事的清晰桥。
