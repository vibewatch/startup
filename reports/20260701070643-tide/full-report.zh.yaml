  - number: 2
    title: 市场分析
    sections:
      - number: '2.1'
        title: 市场边界和纳入支出
        blocks:
          - type: paragraph
            body: >-
              不应把 Tide 当作泛消费者新银行，或宽泛的全金融平台来分析。它的实际产品界面明确面向中小企业：活期账户主张结合支付、储蓄和核心账户通道，个体经营者产品强调税务分离和行政简化，会计产品把记账、开票、VAT 和
              Making Tax Digital 流程打包，融资市场则延伸到营运资本和增长融资。City AM 2026 年 5 月的产品描述与 TPG 2025 年 9 月的投资论点都强化了同一定位：Tide
              是商业管理平台，而不是单一银行功能。也就是说，纳入支出边界应是面向个体经营者、自由职业者、微型企业和注册中小企业的企业账户、企业支付、开票、记账、薪资或薪资相邻行政、公司注册和企业信贷。正确的排除项是消费者活期账户、泛个人金融和大型企业
              ERP 套件，因为 Tide 的买方、产品文案和会员指标都围绕小企业运营任务，而不是家庭银行或企业级资源规划。
