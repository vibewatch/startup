      - number: '6.4'
        title: 留存、扩张和客户经济性可见度
        blocks:
          - type: paragraph
            body: >-
              公开证据支持可信的落地后扩张逻辑，但不支持可承销的留存指标。在英国，Tide
              的切换页面和计划阶梯明确试图把会员从免费或首次使用账户转化为更完整的主关系，附带储蓄、卡、会计、支持和团队访问升级。在印度，发票助手、费用卡流程、合作伙伴放贷、账单支付支持和 GST 工具显示同样模式：Tide
              试图在初始注册后拥有更多运营栈。这在战略上有用，因为会员通过 Tide 跑的流程越多，Tide 越难被降级成辅助工具。不过，公开记录仍留下关键耐久性问题。Tide 不披露
              NRR、GRR、churn、合同期限、活跃主账户占比或头部客户集中度；具名客户故事证明使用，但不能证明客群健康度；即便评论平台也不清楚有多大比例的基数经历严重运营摩擦。因此，公开经济性信号只限于定价表面：按量付费转账费、支持和收益更丰富的英国付费层，以及印度
              ₹49 发票助手高级选项。这些定价线索显示变现意图，但不显示 CAC、回本周期、ARPU 或支持服务成本。
            claimRefs:
              - CU008
              - CU009
