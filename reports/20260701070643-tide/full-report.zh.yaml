  - id: TV003
    title: 牛 / 基准 / 熊情景表
    columns:
      - 情景
      - 核心假设
      - 估值解读
      - 概率信号
      - 下行 / 上行触发因素
    rows:
      - - 熊
        - 2024 年申报营业额仍是最好的公开分母；投诉和合作伙伴依赖让折扣维持较宽；国际增长变现较慢。
        - $0.9bn-$1.2bn 等值区间；低于上一轮估值是可能的。
        - 公开证明仍弱于战略故事。
        - 任何变现放缓、行为摩擦升高或合作伙伴经济性转弱的证据。
      - - 基准
        - 英国引擎保持强劲，印度和欧洲继续增加会员，单会员收入改善到足以守住 2025 年估值。
        - ~$1.3bn-$1.6bn；大致在上一轮定价附近。
        - 最符合当前公开证据。
        - 支持服务质量稳定，并披露更好的变现数据。
      - - 牛
        - 国际市场变现顺利，产品挂载加深，集团盈利能力开始更像规模化平台，而不是获客故事。
        - $1.8bn-$2.3bn；上行需要新证明，不能只靠更多会员。
        - 需要超过当前申报层面可见度的证据。
        - 清晰的集团盈利桥接、更强 ARPU，以及更低结构折扣。
    notes: 这些区间是决策区间，不是 DCF 结果。它们反映今天公开证据能支撑什么、不能支撑什么。
