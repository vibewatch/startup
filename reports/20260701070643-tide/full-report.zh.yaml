        - 带英国源产品 DNA 的印度 MSME
        - 合作式金融和管理平台，不是大型传统银行资产负债表
        - 以注册、支付、借贷和管理切入
        - 服务不足的 MSME 和正规化企业
        - 增长证据强，但产品深度仍要跑赢本地平台专家
      - - OPEN
        - 印度企业和中端市场财务团队
        - 跨 40+ 家银行的连接银行，支持自定义工作流
        - 应付、应收、ERP 集成、资金可见度、AI 工作流
        - 面临多银行复杂度的财务团队
        - 更像财务操作系统，而不是简单 SME 活期账户
      - - RazorpayX
        - 印度初创公司和 SME
        - 合作银行活期账户 + 平台自动化
        - 企业银行、付款、薪资、银行卡、信贷、集成、AI 代理
        - 付款和运营强度高的企业
        - 运营自动化和合作银行分销能力很强
      - - HDFC Bank
        - 印度老牌银行的中小企业和活期账户客户
        - 全功能银行活期账户，产品菜单丰富
        - 活期账户变体、银行卡、存款、费用表、更广的银行相邻业务
        - 想要老牌银行广度的企业
        - 竞争点在资产负债表深度和覆盖面，而不是创业公司式的行政简洁体验
      - - ICICI Bank
        - 印度老牌银行的中小企业和贸易 / 支付用户
        - 全功能银行活期账户及关联银行服务
        - 活期账户、POS、GST 支付、银行保函、银行卡
        - 需要更广交易和银行工具箱的中小企业
        - 当资金管理、保函和更广服务比 App 原生简洁体验更重要时，它更有竞争力
    notes: 印度对比组和英国在结构上不同。当地同业分成连接式金融平台和全服务银行两类，因此评估 Tide 的印度切入点，不能只套用英国挑战者银行视角。
