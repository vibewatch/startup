        title: 采用证明和具名客户证据
        blocks:
          - type: paragraph
            body: >-
              最强的采用证明是会员数轨迹。Tide 自己的 2024 年里程碑页面称全球会员达到 100 万；2026 年 5 月里程碑发布和独立转载称平台已翻倍至 200 万全球会员，其中英国 SME 约 90 万，自
              2022 年 12 月上线以来印度会员超过 110 万。这些数字仍来自公司，不应被误当作收入活跃客群，但它们由多个保留来源佐证，并与前文一致。公开使用代理指标也增加权重。Trustpilot
              承载数万条评论，Tide iOS app 有 82k 个评分、评分 4.8/5，应用商店描述仍把自助设置和广泛中小企业定位放在前面。具名客户证明更有选择性，但真实存在：HJL Accountancy
              描述在一家运营中的会计事务所使用 Tide Plus 现金流和与 Xero 连接的流程；Real Eating Company 描述使用 Funding Options by Tide，帮助一家 10
              家门店咖啡连锁再开一家店；Albert & Maurice 则作为业主主导服装品牌的实时会员故事出现。这足以证明 Tide 被多个中小企业原型采用，但不足以证明企业级耐久性或广泛扩张经济性。
