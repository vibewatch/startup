  - id: FV001
    title: 推荐逻辑
    type: flow
    layout: standard
    summary: 推荐结论来自一组权衡：规模证明和战略稀缺性，对冲结构性折价和有限公开披露。
    data:
      nodes:
        - id: n1
          label: 200 万会员和宽产品面
          description: 规模和平台广度说明，Tide 不只是简单的 SME 往来账户外壳，值得认真跟踪。
        - id: n2
          label: 上一轮估值 $1.5bn
          description: TPG 领投轮提供了真实定价的市场锚，而不是传闻估值。
        - id: n3
          label: 2024 年申报文件仍显示亏损
          description: 公开申报营业额大幅改善，但留存实体仍在亏损。
        - id: n4
          label: 非银行且依赖合作伙伴
          description: 由 ClearBank 支撑的英国账户和嵌入式基础设施，说明应给一些结构性折价。
        - id: n5
          label: 仍配得上稀缺性溢价
          description: 欧洲少有 SME 平台能同时具备 Tide 的会员规模、印度可选性和行政财务广度。
        - id: n6
          label: 跟踪 / 合理到略偏紧
          description: 加权结论是密切观察，而不是在上一轮之上激进加价买入。
      edges:
        - from: n1
          to: n2
          label: 支撑溢价
        - from: n2
          to: n6
          label: 设定价格锚
        - from: n3
          to: n6
          label: 限制乐观程度
        - from: n4
          to: n6
          label: 增加折价
        - from: n5
          to: n6
          label: 避免给出明显偏贵结论
        - from: n1
          to: n5
          label: 制造稀缺性
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV038
      - CV041
      - CV042
      - CV047
  - id: FV002
    title: 估值敏感性
    type: bar
    layout: wide
    summary: Tide 的私募估值高于最干净的公开低到中个位数收入倍数锚点，但低于全球高溢价离群值。
    approximationNotes: 公开倍数很粗略，且横跨不同币种、日期和商业模式；该图只展示方向排序，不追求精准 EV/收入可比性。
    data:
      items:
        - label: BILL 公开锚点
          value: 2.4
          unit: x revenue
          note: 2026 年 7 月市值对比 FY2025 收入。
        - label: Wise 公开锚点
          value: 4.7
          unit: x net revenue
          note: 2026 年 7 月市值对比 FY2026 净收入。
        - label: Tide 仅申报口径粗算
          value: 6.5
          unit: x turnover
          note: 按 $1.5bn 对比 2024 年申报营业额估算，并做宽口径 FX 标准化。
        - label: Monzo 私募 / 公开粗略桥接
          value: 3.5
          unit: x revenue-ish
          note: 仅作方向参考，因为估值和收入日期不同，币种也混杂。
        - label: Starling 定性盈利锚点
          value: 3
          unit: x implied-ish
          note: 仅作示意；陈旧的公开估值标记限制精度。
        - label: Revolut 高溢价离群值
          value: 16
          unit: x revenue-ish
          note: 更大、盈利能力更强平台的方向性溢价。
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
  - id: FV003
    title: 估值 / 回报区间
    type: range
    layout: standard
    summary: 公开证据支持围绕上一轮定价的宽但有边界区间，而不是一个有把握的重估判断。
    data:
      items:
        - label: 悲观情景估值（$bn）
          low: 0.9
          mid: 1.05
          high: 1.2
          note: 假设只用申报文件分母、变现放慢，并给更大的结构性折价。
        - label: 基准情景估值（$bn）
          low: 1.3
          mid: 1.45
          high: 1.6
          note: 假设 2025 年 9 月这一轮大体站得住，变现有温和改善。
        - label: 乐观情景估值（$bn）
          low: 1.8
          mid: 2.05
          high: 2.3
          note: 假设集团盈利更清晰、ARPU 更强，国际变现更好。
    approximationNotes: 这些是基于公开证据的决策区间，不是管理层预测或正式 DCF。
    claimRefs:
      - CV043
      - CV044
      - CV045
      - CV046
  - id: FV004
    title: 投资 KPI
    type: kpi
    layout: compact
    summary: 一条紧凑评分带，说明 Tide 值得投资人跟踪，但并非明显错价到需要立刻激进入场。
    approximationNotes: 分数是分析师基于引用证据综合出的判断，不是公司报告的 KPI。
    data:
      items:
        - label: 规模证明
          value: 8
          unit: /10
          note: 200 万会员和宽产品范围给 Tide 带来真实战略分量。
        - label: 经济性证明
          value: 5
          unit: /10
          note: 2024 年申报文件明显改善，但仍显示经营亏损，集团披露也不完整。
        - label: 稀缺性 / 护城河
          value: 7
          unit: /10
          note: 欧洲 SME 平台稀缺性和印度可选性都重要。
        - label: 结构性风险
          value: 4
          unit: /10
          note: 非银行模式、合作伙伴支付通道和投诉证据拉低评分。
        - label: 估值吸引力
          value: 5
          unit: /10
          note: 公开证据指向合理到略偏紧，不是便宜。
        - label: 披露质量
          value: 4
          unit: /10
          note: 缺少合并经济性，是不能更重下注的主因。
    claimRefs:
      - CV004
      - CV001
      - CV002
      - CV007
      - CV008
      - CV041
      - CV042
      - CV047
      - CV048
