        - from: n3
          to: n4
          label: 加深挂载
        - from: n4
          to: n5
          label: 成为主要关系
    approximationNotes: 这条流程强调转化风险。高会员增长有价值，但 Tide 把基础账户采用转成可信任的多产品使用时，估值改善最明显。
