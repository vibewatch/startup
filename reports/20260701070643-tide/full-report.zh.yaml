      - number: '1.2'
        title: 创始人、管理层、治理和运营足迹
        blocks:
          - type: paragraph
            body: >-
              创始人与市场匹配的故事从 George Bevis 开始。2010 年代的一篇创始人访谈仍把他称为 Tide 在英国早期扩张阶段的创始人。不过，当前公开领导层的中心是 Dr. Oliver Prill。Tide
              多次把他 2018 年加入描述为公司扩张成英国领先中小企业平台的起点。Tide 印度介绍页也突出印度 CEO Gurjodhpal Singh，并强调他此前在 PayU 做 MSME 支付和信贷的经验，这与
              Tide 增长最快的区域直接相关。治理信息通过备案比通过精修董事会简介更可见。Companies House 显示 Tide Holdings Limited 是控股 PSC，持有超过 75%
              股份和投票权；备案历史显示董事会仍在活跃刷新，Shaun Stephen Mccabe 于 2024 年末加入董事会，Eliza Haskell 于 2026 年初离任，Martyna Ewa Budzynska
              于 2026 年 2 月加入。运营上，Tide 的公开足迹已经不只是伦敦金融科技核心：印度介绍页列出 Sofia、Hyderabad、Delhi、Berlin 和 Belgrade 办公室，同时还明确在
              Gurugram 招聘。
