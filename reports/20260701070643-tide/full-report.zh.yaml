      - number: '4.2'
        title: 单位经济信号和收入质量
        blocks:
          - type: paragraph
            body: >-
              最好的公开单位经济信号是运营代理指标，而不是真正的 SaaS 或信贷分群指标。ClearBank 案例研究称，ClearBank-Tide 企业银行主张可在约两分钟内开户，并通过覆盖会计、薪资、开票、费用、VAT
              和申报的集成为小企业节省 48 天行政时间。这说明 Tide 的 GTM 动作更依赖自助入驻和流程挂载，而不是高接触销售。变现也刻意分层：免费层仍对转账、ATM
              取款、外汇和额外卡收费，高阶层则打包更多使用量，并通过储蓄、返现、团队工具和薪资提高挂载潜力。放贷侧是拆分的。Tide 更广的贷款市场更像中介经济：80 多家贷款方、软查询和推荐式匹配。Credit Flex
              不同，因为 Tide Capital 发放带个人担保、还款授权和催收权的短期固定贷款。Fasanara
              的授信扩大了这个机制，但公开证据仍停在关键承销数据之前：没有披露毛利率、扣除合作伙伴和合规成本后的净抽佣率、CAC 或回本周期、NRR，也没有公布 Credit Flex
              或合作伙伴发起信贷的损失曲线。因此，收入质量看起来比早期新银行更分散，但如果没有管理层数据，还不足以称为结构性耐久。
