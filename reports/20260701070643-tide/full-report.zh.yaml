      - number: '3.4'
        title: 切换成本和护城河耐久性
        blocks:
          - type: paragraph
            body: >-
              Tide 的护城河真实存在，但仍有条件。最强的耐久元素是流程挂载：一旦中小企业用 Tide 处理账户运营、开票、记账、储蓄、信贷和团队行政，实际切换成本就会高于基础活期账户的低摩擦水平。因此，Tide
              的产品路线图比一次性定价促销更重要。弱点在于，多个竞争者仍能诱导多栖使用，而不是彻底切换。一家公司可以保留 Tide 处理开票或日常行政，同时用 Starling、Monzo、HSBC 或 Allica
              作为更重信任的主银行；也可以用 Wise 或 Revolut 处理国际资金流动，而不完全放弃 Tide。公开评论也持续指向同一批断点：Tide
              对低交易量、重视行政的企业有吸引力，但支付量上升后经济性会恶化；当现金处理、透支、担保、网点接入或高余额安心感重要时，持牌银行竞争者仍有优势。印度也呈现同样模式，OPEN 和 RazorpayX
              试图成为财务记录主系统，而不只是另一个账户。实际尽调结论是：只有管理层能证明主账户使用率、挂载率和分群留存都在上升，Tide
              的护城河才会显得更强；今天的公开材料仍没有展示足以证明对具名对手取得持久份额增长的胜率或变现细节。
