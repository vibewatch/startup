      - number: '7.2'
        title: 行为合规、支持、欺诈与韧性风险
        blocks:
          - type: paragraph
            body: >-
              公开记录里最清楚的负面模式不是资不抵债，也不是头条级执法；而是围绕客服、账户冻结、资金提取延迟和沟通的行为合规摩擦。Tide 投诉页面承诺 3 个工作日内确认并解决、8
              周内给出最终回复，但公开投诉渠道显示这项承诺在实际执行中会失手。Resolver 把客服问题、账户暂停和回复延迟列为反复出现的投诉类型。Ombudsman 材料更重要，因为它给出 Tide
              被衡量的正式标准：公司可以出于合法金融犯罪防控理由限制账户，但必须比例适当、公平沟通，并正确适用自己的通知条款。两项已公布的 FOS 裁决支持了投诉，认为 Tide
              通知不足或扣留资金时间过长，并要求赔偿和返还资金。负面用户来源也呈现同样形态。近期 Trustpilot 条目提到工资发放投诉拖了一个月、付款缺失或进展缓慢、定价争议，以及紧急 BACS
              转账期间的不确定性。Capterra 评论也投诉宕机、工资关键期账户受限、费用摩擦。安全与欺诈风险同样重要。Tide 直接暴露在针对微型企业和其他范围内客户的 APP
              赔付制度下；公司自己的申报文件称，强制赔付生效后 APP 量上升；状态页也显示，即使短暂的 CoP 或账户详情事故，也会影响会员日常运营，并迅速抬高支持压力。
