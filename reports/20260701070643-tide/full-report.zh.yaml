      - - 资本和有担保流动性
        - 再融资或定价恶化
        - 无法为有担保融资额度再融资、定价明显恶化，或股权支持变得更紧迫。
        - 假设资本依赖仍是结构性问题，下行情景应压低估值倍数。
      - - 印度执行 / 牌照
        - 牌照延迟或贷款机构依赖加深
        - 在员工和支出继续快速扩张时，RBI 路径没有清晰进展。
        - 将印度视为增长风险放大器，而不是多元化对冲。
      - - 产品蔓延 / 质量
        - 支持积压和模块级故障
        - 工资、支付或行政工具等新模块反复出现投诉或宕机。
        - 假设交叉销售广度带来的运营负担，已经超过可持续护城河。
    notes: 这些终止标准是为刷新尽调设计的公开监测信号；它们强调可观察恶化，而非私人管理目标。
