  - number: 3
    title: 竞争格局
    sections:
      - number: '3.1'
        title: 英国同业集合与定位
        blocks:
          - type: paragraph
            body: >-
              Tide 的英国同业集合不是一个同质的挑战者银行大筐。最接近的重叠方分为三类。第一类是原生 app 式 SME 账户竞争者，同时也推进行政流程，代表包括 Revolut Business、ANNA、Monzo
              Business、Mettle 和 Countingup。第二类是有牌照的银行，把信任、存款和信贷深度变成分发优势，代表包括 Starling、HSBC 和 Allica。第三类是 Wise Business
              这类相邻方：作为英国 SME 主运营账户吸引力较弱，但对跨境资金和外汇重度用户更有吸引力。Tide 自己的主张仍从强势第一账户切口出发：它受 FCA
              监管但不是银行，能快速开立企业活期账户，并持续围绕这个核心叠加会计、开票、储蓄和信贷选项。City AM 2026 年 5 月侧写和 TPG 2025 年 9 月投资说明显示了这为什么重要：Tide
              已在独角兽后规模运营，拥有 200 万全球会员、90
              万英国中小企业，并围绕“为小企业省时间”而不只是“转移资金”来讲产品故事。但同一组证据也框出核心竞争问题：客户越重视银行级保护、网点或关系支持、大额余额安心感，或更深信贷能力，Tide
              就越会撞上监管姿态更容易解释的持牌银行竞争者。
