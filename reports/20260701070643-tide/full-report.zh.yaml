  - id: TM004
    title: 增长驱动因素与约束因素表
    columns:
      - 驱动因素 / 约束因素
      - 方向
      - 时间
      - 影响
      - 尽调问题
    rows:
      - - 开放银行与智能数据采用
        - 驱动因素
        - 当前 / 多年
        - 扩大现金流、支付和金融数据用例，让打包式 SME 运营工具栈更有价值
        - 询问哪些 Tide 产品直接受益于开放银行发起支付和数据连接
      - - Making Tax Digital 与未来电子发票
        - 驱动因素
        - 当前至 2029 年
        - 推动记账、报税准备和发票工作流进入软件产品，而不是停留在纯银行方案
        - 要求按会员分群提供会计和税务工具附加率
      - - 挑战者银行与专业金融供给
        - 驱动因素
        - 当前
        - 支撑 Tide 的借贷相邻业务，因为 SME 金融市场不再只是传统商业银行的地盘
        - 要求提供 Funding Options by Tide 的分成收入和放款机构组合
      - - 印度正规化、TReDS 和数字借贷基础设施
        - 驱动因素
        - 当前 / 多年
        - 随时间扩大印度 MSME 基础中可变现的子集
        - 询问印度付费转化率和产品组合，不只看会员数
      - - 企业账户切换摩擦
        - 约束因素
        - 当前
        - 小企业换户量仍低，因此拿下存量企业的主账户地位，比签下新企业更慢
        - 衡量新设企业与换户企业获客，以及企业账户流失
      - - 信任、牌照模式与合作伙伴依赖
        - 约束因素
        - 当前 / 结构性
        - Tide 的账户主张依赖合作银行通道，也依赖对资金保障或 FSCS 安排的清晰沟通
        - 要求提供与信任或开户流程挂钩的投诉、故障历史和转化流失
      - - SME 倒闭、宏观压力与信贷周期
        - 约束因素
        - 当前
        - 经济不确定性、破产、更高投入成本和贷款机构谨慎，可能压低附加率和留存
        - 要求提供压力期的分群留存、坏账或审批数据
      - - 来自规模化挑战者和软件既有厂商的竞争
        - 约束因素
        - 当前 / 结构性
        - 资金充足的相邻平台已经拥有数百万账户或软件客户，Tide 不能假设空白市场会自然到手
        - 要求提供相对挑战者银行、Xero/Sage 级软件和传统银行的胜率数据
    notes: 核心争议不是市场是否存在，而是 Tide 能否在竞争对手或宏观压力介入前，把广泛的小企业需求转化为可信的主账户关系，并挂上高价值软件或信贷产品。
