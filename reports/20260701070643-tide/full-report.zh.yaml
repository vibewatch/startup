  - number: 7
    title: 风险
    sections:
      - number: '7.1'
        title: 监管模式、合作伙伴栈和跨司法辖区风险
        blocks:
          - type: paragraph
            body: >-
              承销 Tide 时，首先应把它视为搭在合作伙伴底层通道上的受监管金融平台，而不是垂直一体化银行。Tide 自己的法律和业绩页面都写明：Tide 不是银行，而是受 FCA
              监管的电子货币机构，持有支付发起、账户信息和经纪权限。落到运营上，核心会员结果同时取决于多个交易对手和监管界面：ClearBank 承接大多数英国商业活期账户和 Instant Saver 余额；部分会员仍在
              PPT 电子货币结构下；德国账户由 Adyen 提供；印度则采用平台模式叠加合作伙伴金融分销，而不是本地 Tide
              银行牌照。这个模式能快速放量，但也埋下下行情景：在银行里可能只是运营麻烦的问题——账户审核、合作伙伴宕机、Confirmation of Payee
              失败、资金释放延迟——会很快升级为行为合规、监管和信任事件。2024 年申报文件显示 Tide 知道这一点；公司称已为 FCA 运营韧性落地做准备，保留供应商监督，也在准备 EU
              DORA。但这些只能缓释，不能消除风险：公司仍要同时协调多个法律体系、资金持有结构和外部服务商，并把客户结果守在 Consumer Duty 预期之内。
