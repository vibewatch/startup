      - number: '7.3'
        title: 财务、战略与宏观敞口
        blocks:
          - type: paragraph
            body: >-
              财务上，Tide 已经改善，但风险没有出清。2024 年申报文件显示营业额强劲增长、经营亏损收窄，但该实体仍然亏损，年内和年后仍接受母公司股权注资。公司还对循环贷款再融资并重新定价；Companies House
              抵押登记显示，TriplePoint 担保一直延续到 2025 年。Fasanara 仓储融资为 Credit Flex 和其他营运资本产品增加了有意义的容量，但也加深 Tide
              对信贷表现、欺诈、交易对手质量和外部融资环境的敞口。战略上，风险在于 Tide 同时想做太多事。公司自己的 2026 里程碑发布已覆盖保险、MTD、薪资、信贷、收单、储蓄、建站和国际市场启动；TPG
              的投资逻辑也明确为更多扩张和更多产品开发提供资金。印度是最尖锐的执行摇摆因素。Tide 称印度是增长最快的市场，ET 报道公司新增 5 年 £500 million 承诺和 800 个岗位；但同一报道也称
              Tide 仍没有本地监管牌照，依赖约 25 家非银贷款方，同时评估应申请哪类 RBI 许可。也就是说，增长可以继续，但可能伴随更高固定成本、更多本地化工作和更大监管不确定性。竞争也重要。British
              Business Bank 描述的市场里，中小企业可选的挑战者银行、专业银行和非银方案更多；Tide 自己的公开服务质量基准也把它放在 Starling、Mettle、HSBC、Monzo
              等旁边。宏观环境更紧时，Tide 的微型 SME 客群可能同时更难留住、放贷风险更高、支持成本更贵。
