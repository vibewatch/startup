      - number: '8.5'
        title: 建议、论点破裂项与下一步尽调
        blocks:
          - type: paragraph
            body: >-
              仅凭公开证据，纪律性的结论是跟踪
              Tide，而不是把最新一轮当成显而易见的便宜货。公司有足够规模、客户触达和战略可选性，不能粗暴判定偏贵；但公开市场锚点没有给出足够宽的估值折扣，若没有更多尽调，难以支持激进买入姿态。「合理到略偏满」最贴合证据：如果
              Tide 能证明英国引擎持久，印度和欧洲变现能落到集团经济性上，就是合理；如果最干净的分母仍停留在 2024 年 Tide Platform Ltd
              申报文件，且合作伙伴或行为合规问题让市场不愿支付更高倍数，就是略偏满。眼下尽调重点不是再做一轮泛泛的 TAM
              争论，而是拿到能缩小战略故事与申报数字差距的证据。承销方应要求按地域和产品拆分的合并收入、毛利率和贡献利润率披露、2025
              年轮次的具体优先权和稀释条款，以及按客群分层切分的活跃会员收入、留存和支持质量证据。不做这些工作，Tide 看起来是一个高质量平台故事，价格接近应有水平，而不是清晰的非对称入场点。
