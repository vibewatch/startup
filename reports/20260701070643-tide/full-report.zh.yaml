  - number: 8
    title: 估值
    sections:
      - number: '8.1'
        title: 最近定价轮与公开基准
        blocks:
          - type: paragraph
            body: >-
              对一家私营公司来说，公开估值锚点异常清楚。2025 年 9 月，Tide 宣布 TPG 领投的战略投资超过 $120 million；公司称该轮由新股与老股资金混合组成，并把估值推高到 $1.5
              billion。这一轮之前，公开经营图景仍然有喜有忧。现有最好的审计财务分母是 Tide Platform Ltd 的 2024 年申报文件：营业额 £177.2 million，经营亏损 £11.3
              million。文件显示业务在快速放大，但没有给市场完整的集团合并收入、毛利率或地域盈利桥。到 2026 年 5 月，Tide 全球会员已超过 2 million，其中英国 900,000、印度超过 1.1
              million，这解释了为什么投资者仍愿意支付稀缺性溢价。即便如此，Tide 明确表示自己不是银行，英国旗舰商业账户方案由 ClearBank 提供动力，而不是 Tide
              自有银行牌照。这对估值很重要：这一轮应被看作软件与金融平台的定价，而不是一家牌照齐全、资产负债表厚实的银行定价。换句话说，上一轮确实捕捉到了规模和战略期权价值，但公开申报仍留下足够不透明：同一个价格，在上行运营叙事里看似合理，在只看申报收入的叙事里又显得偏满。
