chapters:
  - number: 1
    title: 公司概览
    sections:
      - number: '1.1'
        title: 身份、平台模式与当前阶段
        blocks:
          - type: paragraph
            body: >-
              Tide 更适合被理解为一家总部在伦敦、搭在受监管合作伙伴基础设施上的中小企业金融平台，而不是资产负债表银行。Companies House 与 Tide 自己的法律披露在法律主体上相互吻合：Tide
              Platform Ltd 是一家成立于 2015 年、注册地为伦敦 66 City Road 的存续私人有限公司。Tide 自己的页面同样说得很清楚：公司不是银行，而是获 FCA
              授权的电子货币机构，并拥有额外的信贷和保险经纪许可。这个结构很关键，因为它解释了为什么 ClearBank 承托英国旗舰活期账户体验，也解释了 Tide
              为什么能从账户继续扩展到相邻的行政软件，而不是追求完整银行牌照。Tide
              首页、功能、定价、会计和公司注册页面展示出一个刻意打包的主张：开户、储蓄、卡、开票、会计、税务工具、薪资、公司注册和信贷都放进同一套中小企业流程。结合 2025 年 9
              月的独角兽融资，公司已呈现后期、独角兽后公司的特征；但在运营上，它仍更像平台公司，而不是吸收存款的银行。
