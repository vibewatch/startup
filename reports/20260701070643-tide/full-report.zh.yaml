  - number: 5
    title: 产品与技术
    sections:
      - number: '5.1'
        title: 产品栈和日常流程
        blocks:
          - type: paragraph
            body: >-
              Tide 当前产品栈最好被理解为包在英国活期账户外的小企业运营控制台，而不是单一账本产品。2026 年公开产品界面从免费企业活期账户开始，加入分层计划、Instant
              Saver、实体卡和仅应用内卡、开票、Payment Links、会计连接器、MTD
              流程、公司注册、薪资和宽广的融资市场。这个广度重要，因为用户旅程被设计成让业主在同一个界面里完成从开户、付供应商、收款、报税到寻找营运资本。可见变现模型也同样分层：计划费、外汇和转账经济性、按座位计价的费用卡、发票和在线支付增值模块、薪资订阅费，以及市场主导式放贷。Tide
              的模块跨度比标准 SME 活期账户应用更宽，但公开证据也显示，许多流程仍落在合作伙伴通道或合作伙伴软件上，而不是垂直整合的银行栈。
