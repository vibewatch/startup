  evidenceGaps:
  - type: missing-source
    severity: material
    topic: dora-resilience
    missingEvidence: Public documentation on DORA-style resilience testing, third-party ICT governance, major-incident reporting practice, or supplier concentration controls beyond generic status/security pages.
    whyItMatters: Tide’s model depends on ClearBank, Adyen, PPT, open-banking connectivity, and multiple software partners, so resilience governance matters to underwriting concentration and outage risk.
    diligencePath: Request the latest security pack, operational-resilience framework, critical-third-party register, incident postmortem examples, and any DORA or equivalent control mapping used for UK/EU operations.
    relatedQuestionRefs:
    - QE026
    relatedTableRefs:
    - TE004
  - type: private-evidence-only
    severity: material
    topic: core-architecture
    missingEvidence: Internal architecture diagrams showing ledger ownership, service boundaries, data stores, recovery design, and failover responsibilities between Tide and partners.
    whyItMatters: Public docs prove the open-banking edge and partner rails, but not the architecture that determines change velocity, outage blast radius, or fraud-control placement.
    diligencePath: Request engineering architecture reviews, ownership maps for core ledgers and payments, and the runbooks for partner or app-layer incidents.
    relatedQuestionRefs:
    - QE027
    relatedTableRefs:
    - TE003
  - type: missing-source
    severity: material
    topic: india-custody-mechanics
    missingEvidence: Exact custody, escrow, nodal-account, repayment-flow, and complaint-escalation mechanics for Tide India’s partner-led credit products.
    whyItMatters: India is a large growth vector, but partner-led credit economics and risk transfer cannot be underwritten cleanly without knowing where funds move, who owns servicing, and who bears customer-money obligations.
    diligencePath: Request India lender agreements, customer T&Cs, repayment flow diagrams, and any RBI-facing disclosures covering fund custody and complaint handling.
    relatedQuestionRefs:
    - QE028
    relatedTableRefs:
    - TE003
  - type: private-evidence-only
    severity: material
    topic: bank-licence-strategy
    missingEvidence: Management or board-level disclosure on whether Tide intends to pursue a full UK banking licence or remain structurally partner-led.
    whyItMatters: The answer changes product breadth, margin structure, capital requirements, and the durability of Tide’s current dependence on ClearBank, PPT, and other third parties.
    diligencePath: Ask management for the medium-term regulatory roadmap, decision gates for pursuing a licence, and the economics of staying on the current partner stack.
    relatedQuestionRefs:
    - QE029
    relatedTableRefs:
    - TE005
