company:
  name: Tide
chapter:
  number: 5
  title: Product & Technology
  summary: 'Tide’s product stack is broad enough to look like an SME operating platform rather than a single banking app: the public 2026 surface spans a ClearBank-powered current account and savings layer, Tide-issued cards, invoicing and Adyen-backed Payment Links, payroll, company formation, accounting and MTD workflows, and a partner-led finance marketplace. The core architectural clue is partner concentration, not a self-owned bank core: ClearBank underpins UK accounts, PPT still appears in legacy e-money disclosures, Adyen powers Germany accounts and UK Payment Links, and India credit is explicitly lender-panel driven. Public trust signals are decent at the summary level—ISO 27001, 159 fraud response, security.txt, status pages, and privacy governance—but Tide still discloses little on internal core architecture, DORA-style resilience controls, or any path to a full UK banking licence. The resulting differentiation is integrated admin workflow breadth, while the main risks remain third-party
    dependency and narrower cross-border depth than treasury-oriented peers.'
sections:
- id: product-stack-and-daily-workflows
  title: Product stack and daily workflows
  body: 'Tide’s current product stack is best understood as a small-business operating console wrapped around a UK current account, not as a single ledger product. The public 2026 surface starts with a free business current account and adds tiered plans, an Instant Saver, physical and app-only cards, invoicing, Payment Links, accounting connectors, MTD workflows, company formation, payroll, and a broad finance marketplace. That breadth matters because the user journey is designed to keep an owner in the same interface from opening an account, to paying suppliers, to getting paid, to filing taxes, to seeking working capital. The visible monetization model is similarly layered: plan fees, FX and transfer economics, seat-priced expense cards, invoice and online-payments add-ons, payroll subscription fees, and marketplace-led lending. Tide’s module spread is wider than a standard SME current-account app, but the public evidence also shows that many of those workflows still sit on partner rails
    or partner software rather than on a vertically integrated bank stack.'
