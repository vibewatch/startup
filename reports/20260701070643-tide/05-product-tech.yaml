- id: rails-partners-and-operating-architecture
  title: Rails, partners, and operating architecture clues
  body: 'The architectural clues point to Tide as an orchestration layer sitting across multiple regulated partners and payment rails. In the UK, ClearBank provides the current-account and deposit layer, while Tide’s terms still disclose a PPT-backed e-money model for some members and Tide-issued Mastercard card products linked into the ClearBank account. The current-account terms show Tide’s own platform adding cheque imaging, invoicing, accounting integrations, savings transfers, and third-party access controls on top of that bank account. The open-banking developer portal adds a second technical surface: Tide operates as an ASPSP exposing AIS, PIS, and funds-confirmation interfaces through OpenID Connect flows. Outside the UK, the operating model stays partner-led. Tide Germany says accounts are provided by Adyen, while Tide India lists a long roster of partner lenders rather than presenting Tide as the direct credit provider. That makes the product expandable across markets, but also
    leaves Tide dependent on counterparties for core rails, permissions, and service continuity.'
