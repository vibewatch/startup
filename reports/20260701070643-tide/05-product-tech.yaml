  title: Workflow / use-case table
  columns:
  - User job
  - Current workflow pain
  - Tide path
  - Public benefit / signal
  - Key limitation
  rows:
  - - Open or switch a business account
    - Incumbent onboarding takes weeks and uses fragmented paperwork
    - Open Tide account, verify, switch in-app
    - ClearBank cites ~2 minute onboarding and CASS integration
    - Speed claim comes from partner case study, not audited cohort data
  - - Manage team spend
    - Shared cards, paper claims, and poor spend visibility
    - Issue expense cards, set limits, upload receipts
    - Up to 50 people per account with receipt and category workflows
    - No public expense-fraud or reimbursement-cycle metrics
  - - Get paid remotely
    - Manual invoicing and slow collections
    - Create invoice, add Payment Link, collect by card or wallet
    - Free invoicing entry point and 1-3 day card settlement
    - Card fees and Adyen dependency make this different from native A2A rails
  - - Keep books and taxes current
    - Manual exports, spreadsheet reconciliations, and filing anxiety
    - Connect Xero or Open Banking software and use MTD tools
    - One-click reconciliation plus direct HMRC filing workflow
    - Connector quality varies by software and public support metrics are thin
  - - Run payroll
    - Separate payroll software and accountant dependency
    - Use Tide Payroll inside the account workflow
    - HMRC-recognised payroll with auto-calculations and filings
    - No public evidence on payroll scale or feature parity vs specialists
  - - Access finance
    - Fragmented lender search and repeated applications
    - Use Funding Options by Tide and partner products
    - 80+ lenders and soft checks lower search friction
    - Most visible credit still appears partner-led rather than Tide-funded
  notes: Workflow rows synthesize the user-facing path described across Tide product pages and ClearBank’s SME banking case study; benefits are public claims, not audited ROI outcomes.
