callouts:
- calloutType: strength
  title: Integrated admin platform is the clearest moat
  body: Tide’s strongest differentiation is not a proprietary bank balance sheet; it is the accumulation of adjacent SME admin workflows in one surface. Formation, current account, savings, cards, invoicing, MTD, payroll, and accounting connectors together create higher switching friction than a standalone business account app.
  claimRefs:
  - CE019
  - CE020
  - CE021
  - CE022
  - CE031
  - CE046
- calloutType: risk
  title: Partner-stack concentration is structural, not incidental
  body: ClearBank, PPT, Adyen, accounting-feed partners, and lender panels all sit inside Tide’s product promise. That lets Tide move quickly and localize cheaply, but it also means outages, pricing changes, or regulatory issues at counterparties can directly affect Tide’s user experience and margin structure.
  claimRefs:
  - CE014
  - CE025
  - CE026
  - CE032
  - CE033
  - CE034
  - CE035
  - CE040
- calloutType: insight
  title: Tide is more than a banking UI but less than a fully disclosed bank core
  body: The company has real product depth—public API docs, active engineering hiring, and multiple admin modules—but the evidence set still stops short of full-bank disclosure on core architecture, resilience governance, and licence strategy. The result is a credible product platform that still needs infrastructure diligence.
  claimRefs:
  - CE023
  - CE028
  - CE042
  - CE048
