- id: security-privacy-and-operational-resilience
  title: Security, privacy, and operational resilience
  body: 'Tide’s public trust posture is decent at the control-summary level and thin at the underwriting-detail level. The company explicitly points to two-factor verification for new payees and payments, safe transaction limits, instant card freeze, an ISO 27001-certified security program, a public security.txt with a disclosure contact and PGP key, and a 24/7 fraud response path through call 159 or in-app reporting. The privacy policy adds real governance detail: Tide is ICO-registered, acts as data controller for Tide-platform data, and may act as data processor for invoicing, bookkeeping, payroll, and accountancy services. The status page also shows Tide is willing to publish operational incidents, including a June 2026 account-details visibility issue and a Confirmation of Payee issue. The gap is depth. Tide does not publicly provide DORA-style operational-resilience evidence, postmortem detail, supplier-control disclosures, or a detailed explanation of how incidents across ClearBank,
    Adyen, PPT, or open-banking partners are governed and escalated.'
  claimRefs:
