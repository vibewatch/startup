- id: roadmap-implications-and-product-gaps
  title: Roadmap implications and product gaps
  body: The roadmap implications are visible more through adjacent product launches and hiring than through a polished public roadmap page. The Onfolk acquisition explains why payroll now looks like a meaningful embedded module rather than a placeholder feature, while the April 2026 MTD deadline gives Tide a timely compliance hook for sole traders. Germany and India show a repeatable market-entry pattern—reuse the Tide control surface, then slot in local partners such as Adyen or a lender panel. Public hiring reinforces that Tide is still investing in platform depth, with roles spanning Accounts Platform, Threat Detection, Internal Tools, and Ongoing Monitoring. Even so, the main product gaps remain structural. Tide still does not present itself as a full bank, still depends on ClearBank, PPT, Adyen, and partner lenders for critical rails, and still looks narrower in cross-border treasury breadth than firms built around local accounts or multi-currency balances. The result is a differentiated
    admin platform with genuine SME workflow advantages, but a partner-concentrated product architecture that should be underwritten as such.
