- id: funding-traction-stakeholders
  title: Funding history, member traction, and the stakeholder map
  body: 'Public financing evidence is strongest from late 2025 onward. TPG’s own announcement, corroborated by Mint and The Economic Times, says Tide raised more than $120 million in September 2025 at a $1.5 billion valuation, with Apax Digital Funds also participating and TPG partner Yemi Lalude taking a board seat. That round sits on top of rapidly rising adoption metrics. Tide’s filing for 2024 said the business had already crossed 1.5 million members by June 2025; by May 2026, City AM and The Economic Times reported that Tide had crossed 2 million members globally, including 900,000 UK SMEs and more than 1.1 million Indian SMEs since the December 2022 India launch. India is therefore no longer a peripheral experiment. External coverage and Tide’s own India pages show it as a core growth engine and hiring base. Stakeholder importance follows the same pattern: Tide Holdings remains the controlling shareholder, TPG and Apax matter for capital and governance, ClearBank remains mission-critical
    for UK regulated rails, and the member base in India increasingly shapes product and operating priorities.'
