- id: founders-leadership-governance
  title: Founders, leadership, governance, and operating footprint
  body: 'The founder-market-fit story starts with George Bevis, whom a 2010s founder interview still identifies as Tide’s founder during the company’s early UK scaling phase. Current public leadership, however, is centered on Dr. Oliver Prill, whose 2018 arrival is repeatedly presented by Tide as the point from which the company scaled into a leading UK SME platform. Tide’s India about page also surfaces Gurjodhpal Singh as India CEO, highlighting prior PayU MSME payments and credit experience that is directly relevant to Tide’s fastest-growing geography. Governance is more visible through filings than through polished board biographies. Companies House shows Tide Holdings Limited as the controlling PSC with more than 75% of shares and voting rights, and filing history shows an active refresh cycle with Shaun Stephen Mccabe joining the board in late 2024, Eliza Haskell departing in early 2026, and Martyna Ewa Budzynska joining in February 2026. Operationally, Tide’s public footprint is broader
    than a London fintech core: the India about page lists offices in Sofia, Hyderabad, Delhi, Berlin, and Belgrade, while also explicitly recruiting in Gurugram.'
