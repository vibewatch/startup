company:
  name: Tide
chapter:
  number: 1
  title: Company Overview
  summary: Tide is a UK-founded SME financial platform that combines FCA-regulated e-money permissions, ClearBank-powered current accounts, and a widening software stack across formation, admin, payments, payroll, and credit. By mid-2026 public sources support post-unicorn scale, with 2 million global members and a strong India growth engine, but still show partner dependence, concentrated control, and a 2024 operating loss that keeps profitability and governance diligence live.
sections:
- id: identity-product-stage
  title: Identity, platform model, and current stage
  body: 'Tide is best understood as a London-headquartered SME financial platform built on regulated partner infrastructure rather than as a balance-sheet bank. Companies House and Tide’s own legal disclosures line up on the legal shell: Tide Platform Ltd is an active private limited company incorporated in 2015 and registered at 66 City Road in London. Tide’s own pages are equally clear that the company is not a bank, but an FCA-authorised e-money institution with additional credit and insurance broking permissions. That structure matters because it explains why ClearBank sits underneath the flagship UK current-account experience and why Tide can keep broadening from accounts into adjacent admin software rather than pursuing a full banking licence. Product evidence across Tide’s homepage, features, pricing, accounting, and company-registration pages shows a deliberately bundled proposition: account opening, savings, cards, invoicing, accounting, tax tooling, payroll, company formation,
    and credit all sit inside one SME workflow. Taken together with the September 2025 unicorn financing, the company looks late-stage and post-unicorn, but still operationally more platform company than deposit-taking bank.'
