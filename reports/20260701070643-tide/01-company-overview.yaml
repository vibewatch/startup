  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: cap-table-governance
    missingEvidence: A current cap table, board committee roster, and any governance-rights side letters for Tide Holdings, TPG, Apax, and other investors.
    whyItMatters: Public sources show control concentration and one new investor board seat, but not the full governance map or economics behind it.
    diligencePath: Request the latest shareholder register, board observer list, and governance-rights summary from management.
    relatedQuestionRefs:
    - QO022
    relatedTableRefs:
    - TO002
    - TO003
  - type: missing-source
    severity: material
    topic: consolidated-headcount
    missingEvidence: A reconciled group employee count as of 2026-07-01 across the UK entity, India build-out, and European offices.
    whyItMatters: Public workforce disclosures range across dates and scopes, making it hard to tie operating scale directly to cost structure and execution capacity.
    diligencePath: Request the latest HR headcount snapshot by geography and legal entity, plus definitions for Tideans versus entity employees.
    relatedQuestionRefs:
    - QO023
    relatedTableRefs:
    - TO001
  - type: enumeration-incomplete
    severity: minor
    topic: public-milestone-coverage
    missingEvidence: A fuller internal chronology for product launches, regulatory approvals, and financing steps that never reached public press channels.
    whyItMatters: The milestone record is strong for major events but still incomplete for operational sequencing and product-release cadence.
    diligencePath: Ask management for an internal corporate timeline or board deck chronology covering 2019-2026.
    relatedQuestionRefs:
    - QO017
    relatedTableRefs:
    - TO004
  - type: enumeration-incomplete
    severity: minor
    topic: leadership-roster
    missingEvidence: A current executive committee roster with named responsibilities beyond the CEO, India CEO, and filing-visible directors.
    whyItMatters: Public diligence can see leadership headlines and board changes, but not the full operating bench needed to test succession depth.
    diligencePath: Request an org chart, board bios, and committee/functional ownership map.
    relatedQuestionRefs:
    - QO007
    - QO022
    relatedTableRefs:
    - TO002
