  rows:
  - - Tide Holdings Limited
    - Parent / controlling PSC
    - Controls >75% of shares and votes; can appoint or remove directors.
    - Companies House PSC filing identifies Tide Holdings as the control center of the cap table.
    - Request the full current cap table and any shareholder agreement protections.
  - - TPG
    - Lead 2025 strategic investor
    - Led the >$120m round at a $1.5bn valuation.
    - TPG press release and follow-on coverage say partner Yemi Lalude joined the board.
    - Review economics, secondary mix, and board-rights package.
  - - Apax Digital Funds
    - Existing investor and follow-on backer
    - Supported the 2025 TPG round and had backed Tide earlier.
    - TPG, Mint, and ET all identify Apax as a continuing capital provider.
    - Clarify ownership percentage and pro-rata rights after the TPG round.
  - - ClearBank
    - Critical infrastructure partner
    - Powers UK current accounts, payment rails, and deposit-protection positioning.
    - ClearBank case study ties Tide’s proposition to embedded banking, grants, and onboarding performance.
    - Test contract concentration, pricing, and contingency options.
  - - India SME member base
    - Growth constituency
    - More than 1.1m Indian members and the largest announced hiring build-out.
    - May 2026 growth coverage and the 2026 India investment plan both place India at the center of scale.
    - Check retention, monetisation, and credit-quality by geography.
  - - Onfolk team / capability
    - Acquired product stakeholder
    - Brought payroll technology, people, and customers into Tide in 2024.
    - Accounts and sector coverage tie the acquisition directly to payroll expansion.
    - Measure integration success, customer retention, and upsell impact.
