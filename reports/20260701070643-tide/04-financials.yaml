- id: unit-economics-and-revenue-quality
  title: Unit-economics signals and revenue quality
  body: 'The best public unit-economics signals are operational proxies rather than true SaaS or credit cohort metrics. ClearBank’s case study says the ClearBank-Tide business banking proposition can open an account in roughly two minutes and save small businesses 48 days of administration through integrations spanning accounting, payroll, invoicing, expenses, VAT, and filings. That suggests Tide’s GTM motion relies on self-serve onboarding and workflow attachment more than on high-touch sales. Monetization also looks intentionally layered: the free tier still charges for transfers, ATM withdrawals, FX, and extra cards, while higher tiers bundle more usage and raise attach potential through savings, cashback, team tools, and payroll. The lending side is split. Tide’s wider loans marketplace resembles intermediation economics: 80-plus lenders, soft checks, and referral-style matching. Credit Flex looks different, because Tide Capital originates a short-term fixed loan with a personal guarantee,
    repayment authority, and collection rights. Fasanara’s facility expands that mechanism, but public evidence still stops before the important underwriting data: no disclosed gross margin, no net take rate after partner and compliance costs, no CAC or payback, no NRR, and no published loss curves for Credit Flex or partner-originated credit. Revenue quality therefore looks more diversified than in early-stage neobanks, but not yet transparent enough to call structurally durable without management data.'
