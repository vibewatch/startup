- id: TI005
  title: Public financial gaps table
  columns:
  - Missing metric
  - Why it matters
  - Best public clue today
  - Underwriting risk
  - Exact diligence request
  rows:
  - - Product-level revenue mix
    - Needed to judge recurring quality and cyclicality
    - Official pages show many revenue lines but no segment bridge
    - Could hide concentration in lower-quality or lower-margin lines
    - Provide 2024 and LTM revenue by subscriptions, fees, partner commissions, and credit
  - - Consolidated cash, burn, and runway
    - Needed to judge dilution and refinancing risk
    - Accounts cite adequacy and facilities but no cash number
    - Impossible to test downside runway or next-round trigger
    - Provide group cash, monthly burn, 12-month plan, and downside case
  - - Gross margin and net take rate
    - Needed to test software-vs-finance margin durability
    - Pricing is public; economics behind pricing are not
    - Could overstate quality if partner and servicing costs are high
    - Provide gross profit by product and partner cost stack
  - - Credit performance vintages
    - Needed to judge whether credit expansion is accretive or risky
    - Filing says provisions exist; product terms and warehouse lines are public
    - Losses could rise faster than fee income as credit scales
    - Provide approval, delinquency, default, recovery, and provision coverage data
  - - Entity-to-group bridge
    - Needed to reconcile filed losses with “profitable UK business” messaging
    - 2024 entity filing and 2025 TPG statement use different lenses
    - Investors could underwrite the wrong perimeter
    - Provide management bridge from Tide Platform Ltd to UK, group, and geography-level profitability
  - - Attach rates and cohort retention
    - Needed to test whether bundled tools truly deepen moat
    - Two-minute onboarding and 48-day admin-saved claims imply attachment but do not quantify it
    - Could mistake a broad catalogue for real wallet share
    - Provide plan mix, active users, attach rates, and retention by cohort
  notes: These are the highest-value missing inputs for underwriting. None are addressable with public web research alone; management or data-room evidence is required.
