- id: TI001
  title: Revenue streams table
  columns:
  - Stream
  - Public evidence
  - Monetization mechanism
  - Current quality
  - 2026 status / scale signal
  - Diligence ask
  rows:
  - - Paid membership plans
    - Free plus Smart/Pro/Max plan ladder
    - Monthly subscription revenue
    - 'High: official pricing is explicit'
    - Paid plans remain live in 2026
    - Request paid-plan mix, churn, and ARPU by cohort
  - - Transfers and transaction fees
    - Free tier includes limited transfers; paid tiers bundle more
    - Usage fees and overage economics
    - High on list pricing, low on realized yield
    - Still active on free and lower plans
    - Request transfer volume mix and overage revenue share
  - - FX, ATM, and cash services
    - Free-plan FX fee, ATM charges, and cash deposit fees remain visible
    - Per-use fee income
    - High on rules, low on utilization
    - Monetizes heavy users even on free tier
    - Request monthly active fee-paying users by product
  - - Savings and balance economics
    - Instant Saver pays plan-linked rates tied to BoE base rate
    - Spread share, platform fee, or partner revenue share
    - 'Medium: public rates visible, economics not'
    - Rates marketed up to 4% intro and 3.75% standard upper tier
    - Request margin retention on savings balances
  - - Payroll and admin software
    - Payroll and accounting tools are packaged alongside accounts
    - Software subscription / attach revenue
    - High on product presence, low on attach rate
    - Payroll priced at £12 + VAT monthly
    - Request attach rate and gross margin for software modules
  - - Marketplace lending and referrals
    - Business-loans hub spans 80+ lenders and many credit types
    - Referral, brokerage, or distribution fees
    - 'Medium: supply scale visible, economics hidden'
    - £1.6bn arranged to 43k businesses claimed
    - Request commission take rate, funded volume, and repeat usage
  - - Tide-linked short-term credit
    - Credit Flex sits inside Tide Capital and Fasanara-funded scale-up
    - Interest income plus credit-loss exposure
    - 'Medium: legal structure visible, profitability hidden'
    - Facility designed to expand all-UK-member access
    - Request approval rates, defaults, recoveries, and funding spread
  notes: List pricing and product presence are public; realized revenue share by stream is not. Savings and credit rows are especially sensitive to partner economics and loss performance.
