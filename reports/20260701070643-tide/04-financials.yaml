  evidenceGaps:
  - type: missing-source
    severity: material
    topic: revenue-mix
    missingEvidence: A management revenue bridge by subscriptions, transaction fees, partner commissions, savings, and credit interest for 2024 and LTM 2025/2026.
    whyItMatters: The public stack is diverse, but without a segment bridge it is impossible to tell whether growth is recurring software revenue or lower-quality fee and credit lines.
    diligencePath: Request a product-line P&L bridge and a monthly revenue mix waterfall for the last 18 months.
    relatedQuestionRefs:
    - QI006
    relatedTableRefs:
    - TI001
  - type: private-evidence-only
    severity: material
    topic: cash-and-runway
    missingEvidence: Current consolidated cash, unrestricted liquidity, monthly burn, covenant headroom, and downside runway assumptions.
    whyItMatters: Visible capital access does not answer whether Tide can fund present expansion internally or how sensitive the business is to a delayed next raise or refinance.
    diligencePath: Request board or investor materials showing cash balance, debt headroom, 12-month plan, and stress-case runway.
    relatedQuestionRefs:
    - QI021
    relatedTableRefs:
    - TI004
  - type: private-evidence-only
    severity: material
    topic: unit-economics
    missingEvidence: Gross margin, net take rate after partner costs, CAC, payback, NRR, and attach-rate data by product line.
    whyItMatters: Without these metrics, the chapter can only infer revenue quality from pricing and product breadth rather than proving efficient, durable monetization.
    diligencePath: Request cohort dashboards and a unit-economics pack for current account, software, marketplace lending, and Credit Flex.
    relatedQuestionRefs:
    - QI011
    - QI012
    - QI025
    relatedTableRefs:
    - TI003
  - type: private-evidence-only
    severity: material
    topic: credit-performance
    missingEvidence: Approval rates, delinquency curves, default vintages, recoveries, provision coverage, and warehouse reserve mechanics for Credit Flex and other credit products.
    whyItMatters: Credit can boost ARPU, but it can also absorb liquidity and create loss volatility that overwhelms headline software or fee growth.
    diligencePath: Request underwriting policy, portfolio-vintage tables, and lender-facility reporting for Tide Capital and partner-led credit products.
    relatedQuestionRefs:
    - QI014
    - QI016
    relatedTableRefs:
    - TI003
    - TI004
  - type: conflicting-data
    severity: material
    topic: entity-group-bridge
    missingEvidence: A reconciled bridge from Tide Platform Ltd statutory results to the UK business, consolidated group, and geographic profitability claims used in later fundraising materials.
    whyItMatters: The difference between a loss-making entity filing and a “profitable UK business” narrative can be benign, but only if investors understand the perimeter, transfer pricing, and intercompany allocations.
    diligencePath: Request the latest management P&L by entity and geography, with notes on intercompany charges and which perimeter underlies public fundraising statements.
    relatedQuestionRefs:
    - QI020
    - QI021
    - QI025
    relatedTableRefs:
    - TI004
    - TI005
