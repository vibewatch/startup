- id: exposures-durability-and-diligence-blockers
  title: Exposures, durability, and diligence blockers
  body: 'Durability rests on a useful but partner-heavy architecture. ClearBank-Tide terms make the split explicit: ClearBank provides the business current account and instant saver, while Tide owns the interface, cards, and member support. The 2024 filing adds that most UK funds sit at ClearBank, India funds sit in a Transcorp escrow structure, and Germany funds sit with Adyen. That keeps Tide lighter on balance-sheet duration risk, but it also means counterparty, operational, and regulatory resilience depend on third parties across jurisdictions. Management acknowledges that directly in the filing, listing conduct, financial crime, credit and counterparty, regulatory, and information-security risks as principal exposures. The adverse evidence is not catastrophic, but it is meaningful. Two Financial Ombudsman decisions found Tide acted unfairly on notice or withheld funds too long after blocking or closing accounts, and Resolver’s complaint log plus a Statrys review both point to friction
    when accounts are suspended or when customers outgrow the low-cost domestic use case. The financial verdict is therefore mixed: Tide’s model appears diversified, software-heavy, and better capitalised than many SME fintech peers, but loss-making status, secured-facility reliance, partner-bank dependence, and thin consolidated disclosure still block a full conviction call on margin durability or downside resilience.'
