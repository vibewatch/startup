      - number: '4.3'
        title: Capital support, funding structure, and liquidity implications
        blocks:
          - type: paragraph
            body: >-
              Tide’s public capital story shows improving scale but still clear financing dependence. The 2024 accounts
              say the company received £6.7 million of equity from Tide Holdings during the year and another £7.2
              million after year-end. The same filing says Tide refinanced its revolving facility in April 2024, pushed
              maturity to April 2025, lifted pricing from 10.25% to 12.25%, and then extended the facility again to July
              2026 to maintain liquidity and support expansion. Companies House charges reinforce that this was not
              legacy noise: Triplepoint security interests remained outstanding through at least March 2025, and the
              signed accounts explicitly say Tide refinanced existing credit facilities with TriplePoint Capital LLC in
              April 2025. Separate from that corporate facility, Fasanara announced a £100 million securitisation line
              intended to back more than £300 million of short-term SME working-capital lending. Then in September 2025
              TPG led an over-$120 million primary-and-secondary round at a $1.5 billion valuation, with Apax support
              and a new board seat. The accounts also say Tide reviews management accounts, forecasts, liquidity plans,
              and stress scenarios regularly and considers itself adequately capitalised. Even so, public materials
              still do not reveal consolidated cash, debt covenants, or precise runway, so the visible conclusion is
              capital access rather than self-funding independence.
