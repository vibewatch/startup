      - number: '2.2'
        title: Sizing lenses across UK and India
        blocks:
          - type: paragraph
            body: >-
              The cleanest public sizing lens starts with entity counts rather than revenue pools. DBT and the House of
              Commons Library put the UK private-sector business base at 5.7 million in 2025, including 5.4 million
              micro businesses, while ONS’s narrower VAT-and-or-PAYE register counts only 2.73 million formal operating
              businesses. That gap matters because Tide can market to sole traders and informal micro firms, but
              monetised attach rates are more likely to converge toward the narrower formal and actively trading base.
              UK Finance then adds a spend-flow lens: gross SME lending by high-street lenders reached £5.3 billion in
              Q1 2026 and the smallest-business segment saw especially strong growth, showing that credit is a
              meaningful adjacency rather than a cosmetic feature. India adds a second scale lens: PIB said 7.83 crore
              enterprises had registered on Udyam or Udyam Assist by February 2026, creating a huge formalising MSME
              universe even before counting the wider informal sector Tide cites in public messaging. Finally, Xero’s
              FY26 annual report shows that admin software is already a stand-alone category at scale, with 4.9 million
              customers globally and more than one million in the UK, which helps validate Tide’s move beyond accounts
              into software.
