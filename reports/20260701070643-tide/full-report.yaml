  - number: 4
    title: Financials
    sections:
      - number: '4.1'
        title: Revenue model clues and reported performance
        blocks:
          - type: paragraph
            body: >-
              Tide’s financial model looks broader than a simple SME current-account subscription, but the public
              evidence still stops short of a true segment bridge. The cleanest primary description is the 2024 filing:
              Tide Platform Ltd says it is a software-and-services business operating a financial platform across
              current accounts, other financial products, and administration software. That framing matches the live
              product surface. Official pages show a free plan plus Smart, Pro, and Max subscriptions; usage-priced bank
              transfers and FX; plan-linked savings economics; paid expense cards; payroll software; and a large
              marketplace-style loans proposition. In parallel, Credit Flex shows that at least some short-term credit
              sits inside Tide-linked entities rather than being only referral revenue. Reported performance improved
              materially at entity level in 2024: turnover rose to £177.2 million from £113.6 million and operating loss
              narrowed to £11.3 million from £33.2 million. By May 2026, City AM and The Economic Times said Tide had
              crossed 2 million members globally, with 900,000 UK SMEs, more than 1.1 million in India, and the majority
              of revenue still coming from the UK. That supports scale, but also means underwriting still lacks a public
              product-by-product revenue mix and a clean bridge from the filed entity to the broader group story.
