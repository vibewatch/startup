      - CV048
  - id: TV006
    title: Final diligence asks table
    columns:
      - Topic
      - Missing evidence
      - Why it matters
      - Owner / diligence path
    rows:
      - - Consolidated group revenue
        - 2025/2026 revenue by geography and product plus reconciliation to the UK filing.
        - Without it, Tide can look cheap or rich depending on which denominator is used.
        - Management request or investor deck under NDA.
      - - Margin quality
        - Gross margin, contribution margin and servicing cost by major product line.
        - Determines whether product breadth creates operating leverage or hides weak monetisation.
        - Finance diligence with management accounts.
      - - 2025 round terms
        - Preference stack, anti-dilution, secondary versus primary split, and employee liquidity details.
        - Common-equity upside can differ materially from the headline post-money valuation.
        - Legal and cap-table review.
      - - Cohort quality
        - Revenue per active member, retention and complaint rates by UK, India and Europe cohorts.
        - Proves whether new markets are scaling attractively or only adding headline members.
        - Operating metrics pack and support data pull.
      - - Partner dependency
        - Commercial economics and continuity planning with ClearBank and other key partners.
        - Partner concentration is one of the clearest public multiple-compression risks.
        - Commercial, legal and operational diligence with counterparties if possible.
    notes: These asks are ordered by what most changes the underwriting conclusion, not by what is easiest to request.
    claimRefs:
      - CV010
      - CV011
      - CV038
      - CV042
      - CV047
      - CV048
