  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom
  productSummary: >-
    SME finance and admin platform combining UK business accounts, savings, cards, invoicing, accounting and MTD
    workflows, payroll, company formation, payments, and partner-led credit; in India the proposition leans more toward
    MSME formalisation, payments, expense management, and lender access than a like-for-like UK current-account clone.
  customerFocus: >-
    UK sole traders, freelancers, limited companies, and scaling SMEs; in India, MSMEs, shopkeepers, artisans,
    freelancers, and women entrepreneurs formalising into digital workflows.
  businessModel: >-
    Free-to-paid membership plans plus transfer, FX, card, savings, and payments monetization, layered with payroll and
    software subscriptions, accounting/admin attach, partner-led credit distribution, and some Tide-linked lending
    exposure.
  stage: post-unicorn private
