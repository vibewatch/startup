  - id: TV005
    title: Thesis-break and kill triggers table
    columns:
      - Trigger
      - Threshold / evidence
      - Why it breaks the thesis
      - Action implication
    rows:
      - - Group economics stay opaque
        - No credible consolidated revenue and margin bridge before the next valuation event.
        - The strategic premium cannot be tested against operating reality.
        - Refuse to underwrite above the last round.
      - - International monetisation lags
        - Member growth continues but revenue per member or attach rates do not improve.
        - The platform narrative becomes a low-yield acquisition story.
        - Shift toward the bear case and seek a lower entry.
      - - Partner or conduct friction worsens
        - More complaint evidence, outage friction, or partner constraints emerge.
        - The market will likely widen the discount versus licensed-bank or listed peers.
        - Pause diligence or demand stronger downside protection.
      - - Round terms are unattractive
        - Preferences, participation rights or secondary-heavy dynamics limit new-money upside.
        - Headline valuation may overstate common-equity economics.
        - Avoid unless price or terms improve.
    notes: These are practical deal-kill conditions for an investor, not abstract company risks.
    claimRefs:
      - CV010
      - CV013
      - CV014
      - CV038
      - CV042
