      - number: '1.4'
        title: Milestones, control framework, and adverse signals
        blocks:
          - type: paragraph
            body: >-
              Tide’s chronology now mixes scale milestones with a still-material control burden. The 2024 Companies
              House accounts show a business that is growing fast but not yet fully out of investment mode: turnover
              rose to £177.2 million while operating loss narrowed to £11.3 million, and the company still relied on
              parent equity support plus a refinanced revolving facility that was later extended to July 2026. The same
              filing also documents the October 2024 acquisition of Onfolk’s technology, employees, and customers to add
              payroll and HR features, which matches independent reporting that Onfolk was an HMRC-recognised payroll
              specialist bought for an undisclosed sum. ClearBank’s partner case study adds another control layer by
              showing how much of Tide’s UK proposition still depends on external infrastructure and grant-backed
              market-building. On the adverse side, Merchant Machine’s 2026 review snapshot cites a 4.2/5 Trustpilot
              rating but also 17% one-star reviews, a reminder that service and fee transparency can still generate
              friction even as adoption surges. The result is a company with strong execution momentum, but one whose
              governance concentration, partner dependence, and support quality still deserve direct diligence.
