  - id: TV003
    title: Bull / base / bear scenario table
    columns:
      - Scenario
      - Core assumptions
      - Valuation read
      - Probability signal
      - Downside / upside trigger
    rows:
      - - Bear
        - >-
          2024 filed turnover remains the best public denominator; complaints and partner dependence keep the discount
          wide; international growth monetises slowly.
        - $0.9bn-$1.2bn equivalent value range; below the last round is plausible.
        - Public proof remains thinner than the strategic story.
        - Any evidence of slower monetisation, higher conduct friction, or weaker partner economics.
      - - Base
        - >-
          UK engine stays strong, India and Europe keep adding members, and revenue per member improves enough to defend
          the 2025 mark.
        - ~$1.3bn-$1.6bn; roughly around the last priced round.
        - Most consistent with current public evidence.
        - Stable support quality and better disclosed monetisation.
      - - Bull
        - >-
          International markets monetize well, product attach deepens, and group profitability begins to look more like
          a scaled platform than an acquiring-customer story.
        - $1.8bn-$2.3bn; upside requires new proof, not just more members.
        - Needs evidence beyond today’s filing-level visibility.
        - Clear group profitability bridge, stronger ARPU, and lower structural discount.
    notes: Ranges are decision ranges, not DCF outputs. They reflect what the public evidence can and cannot support today.
