  - number: 2
    title: Market Analysis
    sections:
      - number: '2.1'
        title: Market boundary and included spend
        blocks:
          - type: paragraph
            body: >-
              Tide should not be analysed as a generic consumer neobank or as a broad all-finance platform. Its live
              product surface is explicitly SME-oriented: the current-account proposition combines payments, savings and
              core account rails, the sole-trader product emphasises tax separation and admin simplicity, the accounting
              product bundles bookkeeping, invoicing, VAT and Making Tax Digital workflows, and the funding marketplace
              extends into working-capital and growth finance. City AM’s May 2026 product description and TPG’s
              September 2025 investment thesis reinforce the same positioning by describing Tide as a
              business-management platform rather than a single banking feature. That means the included spend boundary
              is business accounts, business payments, invoicing, bookkeeping, payroll or payroll-adjacent admin,
              company formation and business credit for sole traders, freelancers, microbusinesses and incorporated
              SMEs. The right exclusions are consumer current accounts, generic personal finance, and large-enterprise
              ERP suites, because Tide’s buyer, product copy and member metrics are built around small-business
              operational jobs rather than household banking or enterprise-wide resource planning.
