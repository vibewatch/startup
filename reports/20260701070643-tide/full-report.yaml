chapters:
  - number: 1
    title: Company Overview
    sections:
      - number: '1.1'
        title: Identity, platform model, and current stage
        blocks:
          - type: paragraph
            body: >-
              Tide is best understood as a London-headquartered SME financial platform built on regulated partner
              infrastructure rather than as a balance-sheet bank. Companies House and Tide’s own legal disclosures line
              up on the legal shell: Tide Platform Ltd is an active private limited company incorporated in 2015 and
              registered at 66 City Road in London. Tide’s own pages are equally clear that the company is not a bank,
              but an FCA-authorised e-money institution with additional credit and insurance broking permissions. That
              structure matters because it explains why ClearBank sits underneath the flagship UK current-account
              experience and why Tide can keep broadening from accounts into adjacent admin software rather than
              pursuing a full banking licence. Product evidence across Tide’s homepage, features, pricing, accounting,
              and company-registration pages shows a deliberately bundled proposition: account opening, savings, cards,
              invoicing, accounting, tax tooling, payroll, company formation, and credit all sit inside one SME
              workflow. Taken together with the September 2025 unicorn financing, the company looks late-stage and
              post-unicorn, but still operationally more platform company than deposit-taking bank.
