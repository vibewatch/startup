  - id: TM001
    title: Market definition table
    columns:
      - Segment / category
      - Included spend
      - Excluded spend
      - Buyer / payer
      - Relevance
    rows:
      - - UK SME operating account and core payments
        - >-
          Business current accounts, cards, transfers, bill payments, savings and payment collection tied to running a
          small business
        - Consumer current accounts, personal savings, household budgeting tools
        - Owner-manager, finance lead or director paying from business budget
        - Core entry wedge because Tide still lands many members through account opening
      - - UK bookkeeping, invoicing and tax admin
        - >-
          Bookkeeping, VAT, Self Assessment, Corporation Tax preparation, invoices, cash-flow visibility and filing
          tools
        - Large-enterprise ERP suites, generic office productivity tools, consumer tax apps
        - Owner-manager plus accountant or bookkeeper, usually paid by the business
        - Important because Tide markets admin-time savings, not just banking
      - - Payroll and workforce admin
        - Payroll, payslips, payroll-linked compliance and adjacent HR admin for small teams
        - Enterprise HCM suites or large-company HR systems
        - Founder, office manager or finance manager
        - Relevant because payroll increases workflow stickiness after the account is live
      - - Business credit and working-capital products
        - Unsecured loans, invoice finance, government-backed schemes and marketplace credit for SMEs
        - Consumer credit cards, mortgages and treasury products for large corporates
        - Business owner or finance lead, funded from business cash flow
        - Relevant because lending is both a monetisation lever and a credit-cycle risk
      - - India MSME formalisation and finance stack
        - Registration-linked finance, payments, lending and small-business admin for registered or formalising MSMEs
        - Consumer wallets, large-enterprise ERP, non-business remittance products
        - Owner-manager as buyer, user and payer in most cases
        - Important because India member growth is large, but monetisation depends on formalisation depth
      - - Excluded adjacencies and status-quo substitutes
        - N/A
        - Consumer banking, large-enterprise ERP, manual spreadsheets and generic personal accounts used as workarounds
        - Existing incumbent banks or internal manual processes
        - These are substitutes or adjacent pools, not additive Tide TAM
    notes: >-
      Boundary is workflow-based rather than institution-based. A business may use Tide for software before or alongside
      primary banking, but the chapter excludes consumer and large-enterprise spend even when the technology stack looks
      similar.
