  - id: FV001
    title: Recommendation logic
    type: flow
    layout: standard
    summary: >-
      The recommendation comes from balancing scale proof and strategic scarcity against structural discounts and
      limited public disclosure.
    data:
      nodes:
        - id: n1
          label: 2m members and broad product surface
          description: Scale and platform breadth justify taking Tide seriously as more than a simple SME current-account wrapper.
        - id: n2
          label: Last round at $1.5bn
          description: The TPG-led round provides a real priced market anchor rather than a rumoured valuation.
        - id: n3
          label: 2024 filing still loss-making
          description: Public filed turnover improved sharply, but the retained entity remained loss-making.
        - id: n4
          label: Non-bank and partner-dependent
          description: ClearBank-powered UK accounts and embedded infrastructure justify some structural discount.
        - id: n5
          label: Scarcity premium still deserved
          description: Few European SME platforms combine Tide’s member scale, India optionality and admin-finance breadth.
        - id: n6
          label: Track / fair-to-slightly-stretched
          description: The weighted conclusion is to watch closely rather than pay aggressively above the last round.
      edges:
        - from: n1
          to: n2
          label: supports premium
        - from: n2
          to: n6
          label: sets price anchor
        - from: n3
          to: n6
          label: caps enthusiasm
        - from: n4
          to: n6
          label: adds discount
        - from: n5
          to: n6
          label: prevents hard stretched verdict
        - from: n1
          to: n5
          label: creates scarcity
    claimRefs:
      - CV007
      - CV008
      - CV009
      - CV010
      - CV038
      - CV041
      - CV042
      - CV047
  - id: FV002
    title: Valuation sensitivity
    type: bar
    layout: wide
    summary: >-
      Tide’s private mark sits above the cleanest public low-to-mid single digit revenue anchors, but below the premium
      global outlier.
    approximationNotes: >-
      Public multiples are rough and mixed across currencies, dates and business models; the figure is meant to show
      directional ranking, not precise EV/revenue comparability.
    data:
      items:
        - label: BILL public anchor
          value: 2.4
          unit: x revenue
          note: July 2026 market cap versus FY2025 revenue.
        - label: Wise public anchor
          value: 4.7
          unit: x net revenue
          note: July 2026 market cap versus FY2026 net revenue.
        - label: Tide filing-only rough cut
          value: 6.5
          unit: x turnover
          note: Estimated from $1.5bn versus 2024 filed turnover with broad FX normalisation.
        - label: Monzo rough private/public bridge
          value: 3.5
          unit: x revenue-ish
          note: Directional only because valuation and revenue dates differ and currencies are mixed.
        - label: Starling qualitative profitability anchor
          value: 3
          unit: x implied-ish
          note: Illustrative only; stale public valuation mark limits precision.
        - label: Revolut premium outlier
          value: 16
          unit: x revenue-ish
          note: Directional premium for a much larger, more profitable platform.
    claimRefs:
      - CV035
      - CV036
      - CV037
      - CV038
      - CV039
      - CV040
  - id: FV003
    title: Valuation / return range
    type: range
    layout: standard
    summary: >-
      Public evidence supports a wide but bounded range around the last priced round rather than a confident re-rating
      call.
    data:
      items:
        - label: Bear case valuation ($bn)
          low: 0.9
          mid: 1.05
          high: 1.2
          note: Assumes filing-only denominator, slower monetisation and wider structural discount.
        - label: Base case valuation ($bn)
          low: 1.3
          mid: 1.45
          high: 1.6
          note: Assumes the September 2025 round broadly holds as monetisation improves modestly.
        - label: Bull case valuation ($bn)
          low: 1.8
          mid: 2.05
          high: 2.3
          note: Assumes clearer group profitability, stronger ARPU and better international monetisation.
    approximationNotes: These are decision ranges anchored on public evidence, not management forecasts or a formal DCF.
    claimRefs:
      - CV043
      - CV044
      - CV045
      - CV046
  - id: FV004
    title: Investment KPIs
    type: kpi
    layout: compact
    summary: >-
      A compact scoring strip showing why Tide is investable to follow, but not obviously mispriced for immediate
      aggressive entry.
    approximationNotes: Scores are analyst judgments synthesized from the cited evidence rather than company-reported KPIs.
    data:
      items:
        - label: Scale proof
          value: 8
          unit: /10
          note: 2m members and broad product scope give Tide genuine strategic weight.
        - label: Economics proof
          value: 5
          unit: /10
          note: 2024 filing improved materially but still showed an operating loss and incomplete group disclosure.
        - label: Scarcity / moat
          value: 7
          unit: /10
          note: European SME-platform scarcity and India optionality matter.
        - label: Structural risk
          value: 4
          unit: /10
          note: Non-bank model, partner rails and complaint evidence pull the score down.
        - label: Valuation attractiveness
          value: 5
          unit: /10
          note: Public evidence says fair-to-slightly-stretched, not cheap.
        - label: Disclosure quality
          value: 4
          unit: /10
          note: Missing consolidated economics is the main reason not to underwrite harder.
    claimRefs:
      - CV004
      - CV001
      - CV002
      - CV007
      - CV008
      - CV041
      - CV042
      - CV047
      - CV048
