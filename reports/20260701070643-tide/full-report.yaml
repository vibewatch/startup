  - number: 7
    title: Risks
    sections:
      - number: '7.1'
        title: Regulatory model, partner stack, and cross-jurisdiction risk
        blocks:
          - type: paragraph
            body: >-
              Tide should be underwritten first as a regulated financial platform layered over partner rails, not as a
              vertically integrated bank. Its own legal and performance pages say Tide is not a bank and instead
              operates as an FCA-regulated electronic money institution with payment-initiation, account-information,
              and broking permissions. In practice that means core member outcomes depend on several counterparties and
              regulatory surfaces at once: ClearBank provides most UK business current accounts and instant-saver
              balances; some members still sit on a PPT e-money structure; Germany account provision runs through Adyen;
              and India combines a platform model with partner finance distribution rather than a local Tide banking
              licence. This model can scale quickly, but it creates a downside pattern where issues that might be
              operational nuisances at a bank—like account reviews, partner outages, Confirmation of Payee failures, or
              delayed funds release—can quickly become conduct, regulatory, and trust events. The 2024 filing shows Tide
              understands this and says it has prepared for FCA operational-resilience implementation, keeps vendor
              oversight, and is preparing for EU DORA. But those are mitigants, not eliminators: the company still has
              to coordinate multiple legal regimes, multiple funds-holding structures, and multiple external providers
              while keeping customer outcomes within Consumer Duty expectations.
