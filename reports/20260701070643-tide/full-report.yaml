  - number: 3
    title: Competitors
    sections:
      - number: '3.1'
        title: UK peer set and positioning
        blocks:
          - type: paragraph
            body: >-
              Tide’s UK peer set is not one homogeneous challenger-bank bucket. The closest overlaps split into three
              camps. First are app-native SME account rivals that also push admin workflows, notably Revolut Business,
              ANNA, Monzo Business, Mettle and Countingup. Second are licensed banks that turn trust, deposits and
              credit depth into a distribution advantage, notably Starling, HSBC and Allica. Third are adjacents such as
              Wise Business that are less compelling as a primary UK SME operating account but more compelling for
              cross-border treasury and FX-heavy users. Tide’s own proposition still starts from a strong first-account
              wedge: it is FCA-regulated but not a bank, it can open a business current account quickly, and it has kept
              layering accounting, invoicing, savings and credit options around that core. City AM’s May 2026 profile
              and TPG’s September 2025 investment note show why that matters: Tide is already operating at post-unicorn
              scale, with 2 million global members, 900,000 UK SMEs and a product story centred on saving small
              businesses time rather than just moving money. But the same evidence also frames the central competitive
              problem: the more a customer values bank-grade protection, branch or relationship support, large-balance
              comfort, or deeper lending capacity, the more Tide runs into licensed-bank rivals whose regulatory posture
              is simpler to explain.
