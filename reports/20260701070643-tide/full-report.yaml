companyProfile:
  summary: >-
    Tide is a private London SME financial platform founded in 2015. It operates as an FCA-authorised electronic money
    institution rather than a bank, uses ClearBank to power its flagship UK business accounts, and has broadened into an
    integrated admin-and-finance stack spanning savings, cards, invoicing, accounting, tax tooling, payroll, company
    formation, and credit. By May 2026 public and company-linked sources pointed to 2 million global members, including
    about 900,000 in the UK and more than 1.1 million in India, while Tide Platform Ltd's 2024 filing showed £177.2m of
    turnover and an £11.3m operating loss. The September 2025 TPG-led round at a $1.5 billion valuation confirms
    post-unicorn scale, but consolidated group economics and lifetime funding remain only partly disclosed.
  foundedDate: '2015-05-18'
  founders:
    - name: George Bevis
      role: Founder
      background: >-
