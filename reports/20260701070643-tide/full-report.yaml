      - number: '7.4'
        title: Mitigants, monitoring, and thesis-break triggers
        blocks:
          - type: paragraph
            body: >-
              The mitigant side of the case is real enough that Tide’s risk profile is serious but not automatically
              fatal. The 2024 filing describes a three-lines-of-defence model, dedicated internal audit, vendor-risk
              oversight, business continuity and disaster recovery plans, scenario testing for operational resilience,
              fraud-model upgrades, stress testing on capital and liquidity, and monitoring of counterparty limits and
              loan-loss provisions. Tide also still has access to external capital, with both a $1.5 billion valuation
              round and a large Fasanara facility arriving after the 2024 reporting period. But investors should
              distinguish procedural mitigants from structural ones. Tide cannot self-mitigate away the fact that it is
              not a bank, that major UK flows depend on ClearBank, that Germany depends on Adyen, that India still
              depends on licensing choices and partner lenders, or that support quality can still turn compliance
              reviews into visible member pain. The right underwriting frame is therefore trigger-based. A rising
              cadence of upheld ombudsman cases, widening complaint backlogs, repeated status-page incidents on
              payment-safety tools, materially higher APP payouts than internal stress assumptions, failure to refinance
              secured facilities on acceptable terms, or prolonged India-licence slippage would each suggest that
              mitigants are not keeping pace with complexity. If several of those appear together, Tide’s downside could
              transmit quickly into trust, growth, margin, and valuation.
