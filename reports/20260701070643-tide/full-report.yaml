            body: >-
              Tide’s satisfaction signal is genuinely mixed rather than uniformly weak. On the positive side,
              Trustpilot’s aggregate score remains strong at 4.4/5 across 35,681 reviews, and its AI summary says recent
              reviewers often praise helpful staff, clear explanations, easy setup, and a smooth user experience.
              App-store ratings are also high enough to suggest that many members do receive day-to-day value. But the
              adverse evidence is too persistent to ignore. Resolver’s complaints page identifies customer-service
              issues, account suspensions, and delayed or absent responses as common case types. Trustpilot’s recent
              review pages include complaints about account shutdowns, payment holds, slow responses, and unclear
              communication, while Tide’s own replies repeatedly invoke routine account checks. Capterra’s mixed reviews
              are directionally similar: users praise setup speed, staff cards, and integrations, but also complain
              about outages, 20p incoming-transfer fees, and a business account being held at a critical payroll moment
              with no response for several days. The pattern does not prove systemic failure, but it does show a real
