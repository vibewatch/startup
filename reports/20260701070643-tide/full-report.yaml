          - type: callout
            title: Scarcity keeps Tide out of the obvious-overvaluation bucket
            body: >-
              Tide’s combination of UK SME scale, India growth and admin-finance breadth is unusual enough that
              investors can justify paying more than narrow public comp screens would imply.
            calloutType: insight
