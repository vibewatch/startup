        title: Exhibits
        blocks:
          - type: callout
            title: The cleanest public denominator still argues for caution
            body: >-
              If the 2024 Tide Platform Ltd filing remains the best revenue denominator, the September 2025 round
              already prices in a lot of future proof.
            calloutType: risk
            claimRefs:
              - CV001
