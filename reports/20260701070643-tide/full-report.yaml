            body: >-
              Tide’s public customer segmentation is materially clearer than many private fintech peers, but it differs
              sharply by geography. In the UK, Tide consistently markets toward sole traders, freelancers, contractors,
              limited companies, and scaling small businesses that want a low-friction business account plus accounting,
              invoicing, team-spend, and credit-adjacent tools. The sole-trader and limited-company pages both frame
              Tide as an all-in-one admin surface rather than a narrow current-account wrapper, and the mobile-store
              listings repeat the same target audience. India is a different wedge: Tide’s homepage and India-focused
              coverage emphasize shopkeepers, artisans, freelancers, women entrepreneurs, and owner-operators in smaller
              towns who need GST-compliant invoicing, QR and bill payments, expense management, and lender access more
              than a like-for-like replacement of a traditional SME current account. That difference matters. UK
              segmentation looks like a business-account-led acquisition funnel that can widen into admin and treasury
              features, while India’s offer is closer to a business-finance operating layer for underserved
