        title: Retention, expansion, and customer-economics visibility
        blocks:
          - type: paragraph
            body: >-
              Public evidence supports a credible land-and-expand logic, but not underwriteable retention metrics. In
              the UK, Tide’s switching pages and plan ladder explicitly try to convert a member from a free or first-use
              account into a fuller primary relationship with savings, card, accounting, support, and team-access
              upgrades. In India, the invoice assistant, expense-card workflows, partner lending, bill-pay support, and
              GST tooling show a similar pattern: Tide is trying to own more of the operating stack after the initial
              signup. That is strategically useful because the more workflows a member runs through Tide, the harder it
              should be to demote Tide into a secondary tool. However, the public record still leaves the key durability
              questions open. Tide does not disclose NRR, GRR, churn, contract lengths, active-primary-account share, or
              top-customer concentration; named customer stories prove use but not cohort health; and even the review
              platforms leave unclear what proportion of the base experiences serious operational friction. Public
              economics signals are therefore limited to pricing surfaces: pay-as-you-go transfer fees, paid UK tiers
              with richer support and yield, and India’s ₹49 invoice-assistant premium option. Those pricing clues show
              monetisation intent, but not CAC, payback, ARPU, or support cost-to-serve.
