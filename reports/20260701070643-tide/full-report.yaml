      - number: '3.2'
        title: Pricing and capability comparison
        blocks:
          - type: paragraph
            body: >-
              On headline monthly fees, Tide is competitive but not uniquely so. Tide still advertises a free tier and
              paid tiers at £12.49, £27.49 and £69.99 a month, while Starling and Monzo keep credible free entry points,
              HSBC’s replacement small-business account has no monthly account fee, ANNA starts at pay-as-you-go,
              Countingup starts from £3 after trial, and Allica waives its monthly fee above its balance threshold. That
              means Tide’s real advantage is not that nobody else offers a low-price start, but that Tide combines entry
              pricing with an unusually broad small-business admin bundle: invoicing, accounting hooks, payroll
              software, savings and credit are all surfaced inside the same ecosystem. Even there, the edge is
              conditional. Starling’s accounting layer now reaches bookkeeping, invoicing, tax estimates and VAT
              submission, Monzo’s higher tiers add MTD, tax pots and integrations, Mettle includes FreeAgent, and ANNA
              wins a narrow but real niche among sole traders who self-manage tax. Tide also loses obvious ground on
              cross-border and treasury-heavy use cases: Revolut and Wise are built around multi-currency accounts,
              international transfers and FX economics in a way Tide is not. The clearest adverse lens is therefore
              straightforward: Tide can win the admin-led first account, but it is weaker when the buyer wants bank
