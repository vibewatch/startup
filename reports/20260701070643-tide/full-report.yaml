              opening an account, to paying suppliers, to getting paid, to filing taxes, to seeking working capital. The
              visible monetization model is similarly layered: plan fees, FX and transfer economics, seat-priced expense
              cards, invoice and online-payments add-ons, payroll subscription fees, and marketplace-led lending. Tide’s
              module spread is wider than a standard SME current-account app, but the public evidence also shows that
