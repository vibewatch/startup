companyProfile:
  summary: >-
    Tide is a private London SME financial platform founded in 2015. It operates as an
    FCA-authorised electronic money institution rather than a bank, uses ClearBank to power
    its flagship UK business accounts, and has broadened into an integrated admin-and-finance
    stack spanning savings, cards, invoicing, accounting, tax tooling, payroll, company
    formation, and credit. By May 2026 public and company-linked sources pointed to 2 million
    global members, including about 900,000 in the UK and more than 1.1 million in India,
    while Tide Platform Ltd's 2024 filing showed £177.2m of turnover and an £11.3m operating
    loss. The September 2025 TPG-led round at a $1.5 billion valuation confirms post-unicorn
    scale, but consolidated group economics and lifetime funding remain only partly disclosed.
  foundedDate: '2015-05-18'
  founders:
    - name: George Bevis
      role: Founder
      background: Early founder interview evidence ties Tide's original wedge to small-business banking pain points and entrepreneurship-focused problem framing.
      claimRefs: [CO047]
  foundingLocation: London, United Kingdom
  headquarters: London, United Kingdom
  productSummary: >-
    SME finance and admin platform combining UK business accounts, savings, cards, invoicing,
    accounting and MTD workflows, payroll, company formation, payments, and partner-led
    credit; in India the proposition leans more toward MSME formalisation, payments, expense
    management, and lender access than a like-for-like UK current-account clone.
  customerFocus: >-
    UK sole traders, freelancers, limited companies, and scaling SMEs; in India, MSMEs,
    shopkeepers, artisans, freelancers, and women entrepreneurs formalising into digital
    workflows.
  businessModel: >-
    Free-to-paid membership plans plus transfer, FX, card, savings, and payments monetization,
    layered with payroll and software subscriptions, accounting/admin attach, partner-led
    credit distribution, and some Tide-linked lending exposure.
  stage: post-unicorn private
  fundingStatus: >-
