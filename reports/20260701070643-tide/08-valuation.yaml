tables:
- id: TV001
  title: Recommendation summary table
  columns:
  - Dimension
  - Assessment
  - Why it matters now
  - What would improve the view
  rows:
  - - Recommendation
    - Track
    - Quality and scale are real, but public data does not show enough margin of safety above the September 2025 round.
    - Get consolidated 2026 revenue, margin and cohort data.
  - - Confidence
    - Medium
    - The round, filing and member scale are public, but the group-level economics bridge is still incomplete.
    - Obtain audited group disclosures or lender-style management accounts.
  - - Risk rating
    - High
    - Non-bank structure, partner dependence, complaint evidence and still-lossmaking filed entity all widen outcome dispersion.
    - Show cleaner conduct data and durable profit conversion by geography.
  - - Valuation stance
    - Fair to slightly stretched
    - The mark is supportable as a scarcity price, but not plainly cheap against the best-supported public comp anchors.
    - A lower entry price or stronger disclosed monetisation would create upside skew.
  - - Decision implication
    - Do not chase up-rounds
    - The evidence supports watchful underwriting discipline, not fear-of-missing-out behaviour.
    - Revisit if new disclosure or secondary liquidity resets the entry.
  notes: This table converts the evidence set into an IC-style decision rather than a generic company-quality score.
