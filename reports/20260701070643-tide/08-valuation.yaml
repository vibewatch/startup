- id: compression-and-scarcity
  title: Compression risks versus scarcity premium
  body: 'Two opposite valuation forces are visible at the same time. The compression story is straightforward. Tide’s public filing still shows losses; its legal disclosures stress that it is not a bank; its UK account layer depends on ClearBank and related partner infrastructure; and adverse evidence exists in both formal complaints outcomes and customer-review channels. A January 2025 ClearBank case study is useful precisely because it makes the partnership dependence explicit: Tide’s UK account proposition is a combined embedded-banking stack rather than a self-contained bank. The Financial Ombudsman decision and review pages do not prove structural failure, but they are enough to justify some discount against cleaner, more profitable, licensed-bank or listed-fintech comparables. The scarcity story is also real. Few European platforms combine Tide’s claimed UK SME penetration, 2 million global members, broad admin-and-finance surface area, and an India business that is already over 1.1
    million members. Tide therefore sits between two boxes that public markets often value differently: it is richer than a narrow current-account utility, yet riskier than a fully licensed neobank or an already-profitable listed infrastructure provider. That is why the last round is easiest to defend as a strategic premium for future monetisation breadth, but hardest to defend if one insists on today’s public filing metrics and a strict public-multiple discipline. The investment question is not whether Tide is high quality in the abstract; it is whether enough of that future monetisation is already in the price.'
