- id: scenario-range
  title: Downside, base, and upside range
  body: 'A useful way to frame Tide is to start from rough heuristics rather than false precision. On the current public member count, the September 2025 round values Tide at about $750 per global member; if one attributes the whole value only to the 900,000 UK members, the implied value rises to roughly $1,667 per UK member. Those heuristics are not valuation methods by themselves, but they show how much of the round depends on monetising international users and multi-product attachment, not just on UK account growth. The bear case is that the 2024 filing remains the best public revenue denominator for longer than bulls expect, support and partner-friction keep the market from awarding a premium multiple, and international scale adds cost faster than monetisation. In that path, the valuation could compress below the last round. The base case is that the current mark broadly holds because UK scale remains strong, India and Europe keep expanding, and Tide demonstrates better revenue per member
    without a sharp deterioration in conduct or partner risk. The bull case requires more than member growth headlines: it needs evidence that Tide’s expanding product set, AI spend, and newer geographies convert into higher-quality recurring revenue and visibly improved group profitability. The scenario spread therefore remains wide. Public evidence today supports a view that the last round is supportable, but only with limited margin of safety for a new investor buying in above it.'
  claimRefs:
