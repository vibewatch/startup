- id: comparable-triangulation
  title: Comparable-set triangulation
  body: 'The best public anchors split into two groups. First are listed fintech and SME-software names with clear market caps and disclosed revenue. Wise is the cleanest same-currency benchmark in the set: its FY2026 results showed $2.5 billion of net revenue and CompaniesMarketCap showed a July 2026 market cap of about $11.7 billion, or roughly 4.7x net revenue. BILL screened even cheaper on public data, with a July 2026 market cap near $3.6 billion against FY2025 revenue of $1.5 billion, or roughly 2.4x. Adyen and Xero both trade as scaled public platforms with strong product depth, but their disclosed currencies and business mix make direct multiple normalisation less clean in this chapter’s public-only framework. Second are private challenger or business-finance peers. Revolut’s 2025 annual report and November 2025 liquidity event show what a true premium outlier looks like: £4.5 billion of revenue, £1.7 billion of profit before tax, 767,000 business customers, and an implied $75 billion
    valuation. Monzo and Starling are more relevant UK operating contrasts because both disclose meaningful 2026 profitability, while Tide’s latest filed entity remained loss-making. Qonto is strategically relevant because it is also an SME-focused European platform, but its best-supported valuation mark is still the 2022 Series D at €4.4 billion, so it is more useful as a scarcity signal than as a current market mark. Across these comparables, Tide’s last round does not look absurd, but it does look richer than the cleaner public low-single-digit and mid-single-digit revenue anchors unless an investor gives substantial credit to international option value and cross-sell depth.'
