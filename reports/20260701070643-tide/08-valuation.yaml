- id: TV004
  title: Comparable valuation table
  columns:
  - Comparable
  - Public valuation / market cap anchor
  - Latest public revenue-like metric
  - Rough multiple or read-through
  - Why relevant
  - Main limitation
  rows:
  - - Tide
    - Sep 2025 private round at $1.5bn
    - 2024 Tide Platform Ltd turnover £177.2m
    - Roughly ~6-7x on a filing-only turnover read after broad FX normalisation
    - Closest direct target company anchor
    - Entity turnover is not the same as consolidated group recurring revenue.
  - - Wise
    - July 2026 market cap $11.71bn
    - FY2026 net revenue $2.50bn
    - ~4.7x net revenue
    - Profitable public fintech with transparent reporting and business usage.
    - Consumer and money-movement mix is broader than Tide’s SME workflow focus.
  - - BILL
    - July 2026 market cap $3.60bn
    - FY2025 revenue $1.50bn
    - ~2.4x revenue
    - SMB finance-operations software public anchor.
    - US software mix and channel model differ from Tide’s bank-adjacent platform.
  - - Revolut
    - Nov 2025 implied valuation $75bn
    - 2025 revenue £4.5bn and PBT £1.7bn
    - Premium outlier; clearly above Tide on scale and profitability
    - Shows what investors pay for a global, fast-growing, highly profitable platform.
    - Very different scale, brand and product breadth; not a fair midpoint anchor.
  - - Monzo
    - Oct 2024 secondary valuation $5.9bn
    - FY2026 revenue £1.7bn and adjusted PBT £172.6m
    - Roughly mid-single-digit or lower revenue multiple on a profitable UK challenger
    - Relevant UK neobank with disclosed current economics.
    - Valuation date and revenue date do not perfectly line up; retail mix is broader.
  - - Starling
    - Latest clearly public mark still traces back to 2021 $1.9bn funding benchmark
    - FY2026 revenue £887m and PBT £217m
    - Current private multiple not supportable from fresh public pricing; profitability is the key read-through
    - Useful licensed-bank SME comparator on economics rather than fresh pricing.
    - Public valuation mark is stale, so it is a qualitative comp more than a pricing comp.
  - - Qonto
    - 2022 Series D at €4.4bn
    - 2026 press page says 600k+ SMEs/freelancers and €600m+ funding
    - Scarcity premium for a Europe-focused SME platform, but the mark is stale
    - Best business-banking / finance-management strategic peer in Europe.
    - No refreshed public mark and no current audited public revenue in the retained set.
  notes: This is a selected comp set for valuation triangulation, not a claim that every row is equally comparable. Revenue numbers, currencies and dates are left visible to show where precision breaks down.
  enumerationScope:
    coverage: sample
    basis: Rows capture the best-supported public and private comparables retained for this chapter; the set is intentionally selective because many fintech peers still lack fresh public pricing or like-for-like revenue disclosure.
