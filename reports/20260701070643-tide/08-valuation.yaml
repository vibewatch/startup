  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: consolidated-group-economics
    missingEvidence: 2025/2026 consolidated revenue, gross margin, contribution margin and geography split for the whole Tide group.
    whyItMatters: The public filing is entity-level and can make the same $1.5bn valuation screen either fair or stretched depending on what sits above it at group level.
    diligencePath: Request the current investor deck, board pack or lender-style management accounts with revenue and margin bridges by market and product.
    relatedQuestionRefs:
    - QV022
    - QV025
    - QV029
    - QV030
  - type: private-evidence-only
    severity: material
    topic: round-terms-and-common-equity-value
    missingEvidence: Preference stack, anti-dilution rights, secondary-versus-primary split and any participation or ratchet terms from the 2025 round.
    whyItMatters: Headline valuation can materially overstate common-equity attractiveness if preferences or secondary-heavy structure absorb upside.
    diligencePath: Request cap-table detail, share-class terms and the round closing memo from counsel or management.
    relatedQuestionRefs:
    - QV002
    - QV029
    - QV030
  - type: private-evidence-only
    severity: material
    topic: cohort-quality-and-monetisation
    missingEvidence: Revenue per active member, retention, complaint rates and product attach by cohort for the UK, India and Europe.
    whyItMatters: Member counts are only valuable if they convert into durable monetisation and manageable support costs.
    diligencePath: Ask management for cohort dashboards and support-quality metrics by geography and customer segment.
    relatedQuestionRefs:
    - QV020
    - QV021
    - QV025
    - QV027
    - QV029
  - type: conflicting-data
    severity: minor
    topic: private-comp-mark-freshness
    missingEvidence: Fresh public valuation marks for private peers such as Starling, Qonto and OPEN that line up with their latest operating metrics.
    whyItMatters: The comp table is directionally useful, but stale marks make it hard to defend precise relative-multiple conclusions.
    diligencePath: Pull secondary-market indications, investor marks or updated financing documents if available under NDA.
    relatedQuestionRefs:
    - QV018
    - QV019
    relatedTableRefs:
    - TV004
  - type: private-evidence-only
    severity: material
    topic: partner-economics-and-resilience
    missingEvidence: Commercial economics, termination protections and contingency planning for ClearBank and other key infrastructure partners.
    whyItMatters: Partner dependence is one of the cleanest public reasons for multiple compression versus licensed-bank or infrastructure peers.
    diligencePath: Review key partner agreements, outage history, concentration metrics and continuity plans during legal and operational diligence.
    relatedQuestionRefs:
    - QV006
    - QV007
    - QV026
    - QV029
