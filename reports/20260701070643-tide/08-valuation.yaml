- id: recommendation-and-diligence
  title: Recommendation, thesis-breakers, and next diligence
  body: 'The disciplined call from public evidence alone is to track Tide rather than treat the latest round as an obvious bargain. The company has enough scale, customer reach, and strategic optionality to avoid a blunt stretched verdict, but the public market anchors do not give a wide enough valuation discount to justify an aggressive buy posture without more diligence. A fair-to-slightly-stretched stance best fits the evidence: fair if Tide can prove that the UK engine is durable and that India and Europe are monetising into group-level economics, slightly stretched if the cleanest denominator stays the 2024 Tide Platform Ltd filing and partner or conduct issues keep the market from paying a richer multiple. The immediate diligence priority is therefore not another generic TAM debate; it is evidence that narrows the gap between the strategic story and the filed numbers. An underwriter should request consolidated revenue by geography and product, gross-margin and contribution-margin disclosure,
    the exact preference and dilution terms of the 2025 round, and evidence on revenue per active member, retention, and support quality by cohort. Absent that work, Tide looks like a high-quality platform story priced close to where it should be, not a clear asymmetric entry.'
