company:
  name: Tide
chapter:
  number: 8
  title: Valuation
  summary: Tide’s September 2025 $1.5 billion post-money valuation looks defensible as a scarcity price for a scaled SME platform, but it is not obviously cheap against the best-supported public and private benchmarks. The cleanest public downside anchor is still Tide Platform Ltd’s 2024 turnover and loss profile, while the upside case depends on international monetisation, deeper product attach, and clearer evidence that Tide can turn 2026 member growth into durable group-level profitability.
sections:
- id: priced-round-anchor
  title: Last priced round and public baseline
  body: 'The public valuation anchor is unusually clear for a private company. In September 2025 Tide announced a TPG-led strategic investment of more than $120 million, described as a mix of primary and secondary capital, that raised the company’s valuation to $1.5 billion. That round followed a still-mixed public operating picture. The best audited financial denominator available is Tide Platform Ltd’s 2024 filing, which reported turnover of £177.2 million and an operating loss of £11.3 million. The filing shows a business scaling quickly, but it does not give the market a full consolidated group revenue, gross margin, or geographic profitability bridge. By May 2026, Tide had crossed 2 million members globally, including 900,000 in the UK and more than 1.1 million in India, which helps explain why investors still paid a scarcity premium. Even so, Tide is explicit that it is not a bank, and its flagship UK current-account proposition is powered by ClearBank rather than by Tide’s own banking
    licence. That matters for valuation because the round has to be judged as a software-and-finance platform mark, not as a fully licensed, balance-sheet-rich bank mark. Put differently: the last round captures real scale and strategic option value, but the public filing still leaves enough opacity that the same price can look fair in an upside operational narrative and stretched in a filing-only revenue narrative.'
