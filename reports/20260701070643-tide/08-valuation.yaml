- id: TV002
  title: Thesis / anti-thesis table
  columns:
  - Lens
  - Bullish read
  - Bearish read
  - What would change the view
  rows:
  - - Scale
    - 2 million members and meaningful UK/India positions create platform optionality.
    - Scale alone does not prove monetisation quality or cohort durability.
    - Show revenue per member and contribution by geography.
  - - Product breadth
    - Tide combines accounts, admin, payroll, savings, lending adjacencies and AI investment.
    - Breadth can hide low attachment or low gross-margin products.
    - Disclose attach rates and product-level gross profit.
  - - Strategic scarcity
    - Few private European SME platforms combine this reach and category focus.
    - Scarcity can cause investors to overpay relative to public market anchors.
    - Compare realised retention and ARPU against the best public peers.
  - - Operating quality
    - Losses narrowed sharply in the 2024 filing and management describes the UK as profitable.
    - The public filing still shows loss-making economics and no full group bridge.
    - Provide consolidated profitability and cash flow by region.
  - - Structural model
    - Partnered infrastructure keeps Tide asset-light and speeds product launch.
    - Non-bank dependence can cap trust, margin and resilience versus licensed banks.
    - Demonstrate lower friction and stronger economics than bank-like peers.
  - - Conduct / reputation
    - Trustpilot score is still high overall and Tide continues to grow.
    - Ombudsman and review evidence justify some multiple discount.
    - Show complaint trend improvement and resolution quality by cohort.
  notes: 'The anti-thesis is intentionally valuation-sensitive: a good company can still be a mediocre entry if the multiple already prices in the next leg of proof.'
