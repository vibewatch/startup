summary:
  headline: Tide 已经搭起覆盖英国和印度的规模化 SME 金融平台，备案财务也在改善；但最新 $1.5B 估值已经押注更强变现、更干净的客服结果和更清晰集团经济性，而公开证据还没证明这些。
