- id: TP005
  title: Moat durability / competitive risk register
  columns:
  - Moat or wedge
  - Threat
  - Evidence
  - Severity
  - Diligence ask
  rows:
  - - Fast-start SME onboarding plus admin bundle
    - Licensed banks erase price gap while keeping trust advantage
    - Starling, Monzo, HSBC and Allica all offer low-friction or low-fee bank alternatives
    - High
    - Request cohort conversion from sign-up to primary-account status versus licensed-bank rivals
  - - Workflow attachment from invoicing, bookkeeping and team admin
    - Users may multi-home instead of fully switching
    - Wise/Revolut can own FX while Starling/Monzo/HSBC own trust-heavy balances
    - High
    - Ask for product attach and monthly active usage by member cohort, not just registered members
  - - India member growth and formalisation thesis
    - OPEN and RazorpayX are pushing deeper finance-ops automation faster
    - Indian peers already market multi-bank, payout, ERP and AI-agent workflows
    - High
    - Request India paid conversion, ARPU and product mix by city tier and cohort
  - - Credit and monetisation adjacency
    - Bank-led rivals have better balance-sheet and relationship depth
    - HSBC, Allica, HDFC and ICICI can pair accounts with broader credit or guarantee products
    - Medium
    - Ask what percentage of Tide members qualify for credit and what share uses Tide as primary bank
  - - Brand and valuation momentum
    - Public narrative may outrun proof of durable share gains
    - Tide’s $1.5bn valuation and 2m-member story are strong, but public win-rate and churn data remain absent
    - Medium
    - Request competitor-specific win/loss data, churn, NPS by segment and UK-versus-India unit economics
  notes: Severity reflects competitive risk to durable monetisation and primary-account ownership, not existential survival risk. Every row names a diligence ask because the public record still leaves underwriting gaps.
