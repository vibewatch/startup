- id: switching-costs-and-moat-durability
  title: Switching costs and moat durability
  body: 'Tide’s moat is real but still conditional. The strongest durable element is workflow attachment: once an SME uses Tide for account operations, invoicing, bookkeeping, savings, credit and team admin, the practical switching cost rises above the low-friction level of a basic current account. That is why Tide’s product roadmap matters more than one-off pricing promotions. The weakness is that several rivals can still invite multi-homing rather than outright switching. A business can keep Tide for invoicing or day-to-day admin while using Starling, Monzo, HSBC or Allica as the trust-heavy primary bank, and it can use Wise or Revolut for international money movement without abandoning Tide entirely. Public reviews also keep pointing to the same breakpoints: Tide is attractive for low-volume, admin-conscious firms, but its economics deteriorate as payment volume rises, while licensed-bank competitors retain an advantage when cash handling, overdrafts, guarantees, branch access or high-balance
    comfort matter. The same pattern holds in India, where OPEN and RazorpayX are trying to become the finance system of record rather than just another account. The practical diligence conclusion is that Tide’s moat will look stronger only if management can show rising primary-account usage, attach rates and retention by cohort, because public materials today still do not show win-rate or monetisation detail at the level needed to prove durable share gains against named rivals.'
