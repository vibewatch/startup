- id: TP003
  title: Capability gap table
  columns:
  - Criterion
  - Tide
  - Best-evidenced winner
  - Why Tide still competes
  - Where Tide loses
  rows:
  - - Bank-trust / deposit protection
    - Medium
    - Starling / Monzo / HSBC / Allica
    - Tide can still offer a ClearBank-powered current account with familiar SME onboarding
    - It remains a non-bank platform, so safeguarding and FSCS narratives are more complex
  - - Cross-border FX and treasury
    - Weak to moderate
    - Revolut Business / Wise Business
    - Tide can cover basic international payments on higher plans
    - It lacks the native multi-currency depth, allowances and FX identity of Revolut or Wise
  - - Self-serve admin / tax for micro SMEs
    - Strong
    - Tide / ANNA / Countingup
    - Tide combines invoicing, accounting hooks and adjacent admin in a strong starter package
    - ANNA is better for live tax estimation; Countingup goes deeper into account-plus-bookkeeping simplicity
  - - Licensed-bank current-account economics
    - Moderate
    - Starling / Monzo / Allica
    - Tide stays competitive for the first account or low-complexity user
    - Licensed banks combine trust with low or no monthly fees and, in some cases, better bundled transfers
  - - Credit, relationship depth and cash handling
    - Moderate
    - HSBC / Allica / HDFC / ICICI
    - Tide has lending adjacency and a growing business-finance stack
    - Incumbent or specialist banks still win on overdrafts, guarantees, relationship managers and branch-era workflows
  - - India finance-ops automation
    - Emerging
    - OPEN / RazorpayX
    - Tide has a fast-growing member base and MSME formalisation tailwinds
    - OPEN and RazorpayX already market deeper multi-bank, payout, ERP and collections orchestration
  notes: Winner labels reflect the strongest public evidence on each criterion, not a universal ranking. Several SMEs will multi-home across these criteria rather than choose one all-purpose winner.
