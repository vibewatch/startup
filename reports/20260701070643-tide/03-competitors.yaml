- id: TP004
  title: India / UK peer map table
  columns:
  - Peer
  - Geography focus
  - Account / rails model
  - Finance stack breadth
  - Segment fit
  - Strategic read
  rows:
  - - Tide India
    - India MSMEs with UK-origin product DNA
    - Partnered finance and admin platform, not a large incumbent bank balance sheet
    - Registration, payments, lending and admin wedge
    - Underserved MSMEs and formalising businesses
    - Strong growth proof, but product depth still has to outrun local platform specialists
  - - OPEN
    - India enterprise and mid-market finance teams
    - Connected banking across 40+ banks with custom workflows
    - Payables, receivables, ERP integrations, treasury visibility, AI workflows
    - Finance teams with multi-bank complexity
    - Closer to a finance operating system than a simple SME current account
  - - RazorpayX
    - India startups and SMEs
    - Partner-bank current accounts plus platform automation
    - Business banking, payouts, payroll, cards, credit, integrations, AI agents
    - Firms with high payout and ops intensity
    - Very strong on operational automation and partner-bank distribution
  - - HDFC Bank
    - India incumbent SME and current-account buyers
    - Full-bank current accounts with large product menu
    - Current-account variants, cards, deposits, fees schedules, broader bank adjacencies
    - Businesses wanting incumbent-bank breadth
    - Competes on balance-sheet depth and coverage rather than startup-style admin simplicity
  - - ICICI Bank
    - India incumbent SME and trade / payment users
    - Full-bank current accounts and linked banking services
    - Current accounts, POS, GST payments, bank guarantees, cards
    - SMEs needing broader transactional and banking toolkit
    - Competes where treasury, guarantees and broader services matter more than app-native simplicity
  notes: The India comparison set is structurally different from the UK one. Local peers are split between connected-finance platforms and full-service banks, so Tide’s India wedge should not be evaluated with a pure UK challenger-bank lens.
