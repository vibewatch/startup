  evidenceGaps:
  - type: private-evidence-only
    severity: material
    topic: win-rates-and-churn
    missingEvidence: Named-competitor win/loss rates, primary-account conversion, and churn by UK segment for Tide versus Starling, Monzo, Revolut, ANNA and HSBC.
    whyItMatters: Without cohort-level win and churn data, it is difficult to tell whether Tide is taking durable share or simply attracting low-friction sign-ups that remain secondary accounts.
    diligencePath: Ask management for acquisition-channel mix, primary-account share, monthly active usage and churn split by sole trader, microbusiness and incorporated SME cohorts, with named competitor win-loss examples.
    relatedQuestionRefs:
    - QP023
  - type: private-evidence-only
    severity: material
    topic: india-unit-economics
    missingEvidence: India revenue, paid conversion, ARPU, attach by product, and retention for Tide’s 1.1m+ India members, plus comparable monetisation data for OPEN and RazorpayX.
    whyItMatters: India is Tide’s fastest-growing market, but member growth alone does not show whether the business is becoming more valuable or simply larger and harder to serve.
    diligencePath: Request India versus UK member monetisation bridges, product attach rates, servicing costs, and management commentary on which India cohorts are profitable or strategically subsidised.
    relatedQuestionRefs:
    - QP024
  - type: missing-source
    severity: minor
    topic: business-segment-scale-disclosure
    missingEvidence: Clean business-account customer counts and current business-segment contribution for Monzo Business, Revolut Business, ANNA and Mettle from primary sources.
    whyItMatters: Public comparisons are strongest when the scale metric is business-account specific rather than consumer-group or marketing-level, but several private competitors disclose only partial signals.
    diligencePath: Request competitor tear sheets or use paid market-intelligence datasets to isolate SME business-account penetration, active customers and product attach for the main UK direct peers.
