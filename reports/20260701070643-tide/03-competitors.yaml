company:
  name: Tide
chapter:
  number: 3
  title: Competitors
  summary: Tide competes best when a UK small business wants a fast-start account plus admin tools, but its non-bank model, lighter balance-sheet depth and weaker international rails leave clear openings for licensed banks and cross-border specialists. In India, the peer set shifts further toward connected-banking and finance-operations suites such as OPEN and RazorpayX, plus full-bank incumbents such as HDFC and ICICI.
sections:
- id: uk-peer-set-and-positioning
  title: UK peer set and positioning
  body: 'Tide’s UK peer set is not one homogeneous challenger-bank bucket. The closest overlaps split into three camps. First are app-native SME account rivals that also push admin workflows, notably Revolut Business, ANNA, Monzo Business, Mettle and Countingup. Second are licensed banks that turn trust, deposits and credit depth into a distribution advantage, notably Starling, HSBC and Allica. Third are adjacents such as Wise Business that are less compelling as a primary UK SME operating account but more compelling for cross-border treasury and FX-heavy users. Tide’s own proposition still starts from a strong first-account wedge: it is FCA-regulated but not a bank, it can open a business current account quickly, and it has kept layering accounting, invoicing, savings and credit options around that core. City AM’s May 2026 profile and TPG’s September 2025 investment note show why that matters: Tide is already operating at post-unicorn scale, with 2 million global members, 900,000 UK SMEs
    and a product story centred on saving small businesses time rather than just moving money. But the same evidence also frames the central competitive problem: the more a customer values bank-grade protection, branch or relationship support, large-balance comfort, or deeper lending capacity, the more Tide runs into licensed-bank rivals whose regulatory posture is simpler to explain.'
