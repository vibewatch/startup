- id: TP002
  title: Pricing / packaging comparison
  columns:
  - Provider
  - Entry price
  - Transfer economics
  - International / FX
  - Admin stack in evidence
  - Notable catch
  rows:
  - - Tide
    - Free; Smart £12.49; Pro £27.49; Max £69.99
    - Free includes 5 transfers/month; Smart 30; Pro/Max unlimited
    - 0% FX only on paid tiers; SWIFT/CHAPS limited to higher plans
    - Invoicing, accounting hooks, payroll software, savings, credit
    - Non-bank trust gap remains the main objection for larger balances
  - - Revolut Business
    - Basic £10; Grow £30; Scale £90; Enterprise custom
    - No-fee local and international allowances rise materially by tier
    - 25+ currencies, FX allowances, global/local account details
    - Cards, approvals, expenses, APIs, merchant acceptance, interest
    - Paid from day one; not optimised for the cheapest domestic-only micro SME
  - - Starling Business
    - £0 base account
    - Free UK transfers; cash deposits 0.7% at Post Office
    - Not the strongest FX-led proposition
    - Invoicing plus Starling Accounting; Accounting Plus £7 until Apr-2027 then £14
    - Cross-border breadth weaker than Revolut or Wise
  - - ANNA Money
    - £0 PAYG; paid plans above it
    - 20 free transfers on PAYG per review; then 20p each
    - International payments offered, but not the deepest disclosed FX stack
    - AI receipt scanning, live HMRC estimate, invoicing, formation
    - Cash deposits expensive; main account is safeguarded e-money
  - - Mettle
    - No monthly fee on main account
    - Bank-backed SME current account economics
    - Limited public emphasis on FX depth
    - FreeAgent, invoicing and bookkeeping
    - Less expansive product breadth than Tide or Revolut
  - - HSBC Small Business
    - No monthly account fee
    - Free UK digital banking; other charges on price list
    - Incumbent bank rails, but not a cross-border specialist pitch
    - Borrowing and specialist access more visible than admin software
    - Kinetic closed; proposition is not the same as the prior app-led pitch
  - - Monzo Business
    - Lite £0; Pro £9; Team £25
    - Free UK transfers on Lite
    - Incoming FX converted at 1%; outbound international via Wise
    - MTD on all plans; Pro adds invoicing, Tax Pots and integrations
    - Residency, cash and transfer limits reduce fit for some SMEs
  - - Countingup
    - 3-month free trial; then from £3/month
    - Deposit-linked subscription and per-transaction fees
    - No evidence of major FX advantage
    - Built-in accounting, invoicing, tax calculations
    - Not a bank; cost scales with deposits and transactions
  - - Wise Business
    - One setup fee; usage-based thereafter
    - Pay-as-you-go cross-border economics
    - Best-evidenced low-cost international transfers and multi-currency receiving
    - Payments, batch payouts, card, multi-currency balances
    - No full domestic SME admin, credit or payroll stack
  - - Allica Bank
    - No fee above balance threshold; £25/month below threshold
    - Up to 150 free Faster Payments per month
    - Domestic-bank-oriented positioning
    - Relationship manager, expense cards, accounting integrations, savings
    - Needs established-business profile and meaningful balances
  notes: This is a 2026 snapshot of entry packaging, not a full fee schedule. Review-based rows are used only where official pages were sparse or product plans were otherwise not readable from public official pages.
