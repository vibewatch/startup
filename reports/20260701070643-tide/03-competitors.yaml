- id: india-expansion-and-local-comparables
  title: India expansion and local comparables
  body: 'The India comparison set is strategically important because it shows that Tide’s fastest-growing geography is not converging on the same structure as UK SME banking. Tide’s own May 2026 disclosures say India already contributes more than 1.1 million members, but the most relevant local comparables are not just digital current-account brands. OPEN positions itself as a connected-banking operating system for finance teams, with multi-bank visibility, approvals, receivables, payables, ERP links and custom pricing that grows into enterprise workflows. RazorpayX combines current accounts, cards, payroll, payouts, credit and integrations, then pushes further with June 2026 agentic-banking releases around cashflow, collections and payout automation. HDFC and ICICI sit on a different axis again: they are incumbent banks with wide current-account menus, guarantees, GST-linked payment capabilities, cards, POS tools and other balance-sheet products that Tide does not yet replicate natively.
    That means Tide’s India wedge is less about beating local banks at being banks and more about landing MSMEs that want a simpler operating stack, then expanding into registration, payments, lending and admin. It is a plausible growth path, but it also means India execution risk is partly a product-complexity race against better-connected finance suites, not only a customer-acquisition race against UK-style neobanks.'
