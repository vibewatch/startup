tables:
- id: TP001
  title: Competitor profile table
  columns:
  - Competitor
  - Licence / rails
  - Scale or funding signal
  - Target segment
  - Differentiation
  - Limitation
  rows:
  - - Tide
    - FCA e-money; ClearBank-powered UK current account
    - 2m global members; 900k UK; 1.1m+ India; $120m+ at $1.5bn in Sep-2025
    - Sole traders, micro SMEs, new companies, growing UK SMEs, India MSMEs
    - Strong entry-level admin bundle spanning account, invoicing, accounting, savings and credit
    - Not a bank; weaker on native overdrafts, branch support and heavy cross-border treasury
  - - Revolut Business
    - Multi-entity structure; Business plan page disclosed under Revolut Ltd EMI permissions while UK bank launch is live
    - Hundreds of thousands of businesses; access to 75m+ Revolut customers
    - UK and international SMEs, startups, distributed teams
    - Best-evidenced multi-currency, FX, cards, approvals and API breadth
    - Paid plans start at £10; regulatory/entity complexity still less simple than pure UK bank rivals
  - - Starling Business
    - Fully licensed UK bank
    - 6m+ accounts worldwide; £12.7bn deposits; £887m revenue in FY2026
    - UK-first SMEs wanting free banking and strong trust signals
    - No monthly fee, free transfers, invoicing, bookkeeping and tax layer
    - Cross-border proposition less differentiated than Revolut or Wise
  - - ANNA Money
    - PayrNet e-money account; Griffin-backed savings sidecar
    - Private; no comparable public customer count in fetched primary materials
    - Sole traders and small directors self-managing tax
    - AI receipt scanning and live tax estimate are unusually strong for self-serve users
    - No FSCS on main account; weaker on cash, overdrafts and accountant-led workflows
  - - Mettle
    - NatWest-backed bank account with FSCS protection
    - No large public business-account count disclosed on fetched page
    - Sole traders and small limited companies
    - FreeAgent inclusion plus invoicing/bookkeeping in a bank-backed wrapper
    - Less visible international, lending and scale narrative than bigger challengers
  - - HSBC Small Business / ex-Kinetic
    - Licensed incumbent bank
    - Large incumbent balance sheet; Kinetic closed to new users
    - Start-ups, switchers and SMEs needing specialists or borrowing
    - Branch / specialist access and broader borrowing toolkit
    - Digital SME proposition has changed mid-cycle and is less admin-software-led than Tide
  - - Monzo Business
    - Fully licensed UK bank
    - Strong consumer-scale brand; business offer geared to UK-resident entities
    - UK sole traders and small limited companies operating mainly in GBP
    - Free Lite plus strong app UX, MTD readiness and affordable Pro tier
    - International, cash-heavy and non-UK-directed businesses fit poorly
  - - Countingup
    - FCA-regulated e-money account via PPS
    - 100k+ UK small businesses; £10bn+ customer transactions processed
    - Self-employed and small firms wanting account-plus-accounting
    - Built-in bookkeeping and invoicing at low entry price
    - E-money protection, deposit-linked subscriptions and desktop limitations constrain broader SME use
  - - Wise Business
    - FCA-regulated e-money / international account
    - 700k+ global businesses moving $16bn per month
    - SMEs with suppliers, contractors or customers across borders
    - Best-evidenced international transfers and multi-currency economics
    - Not a full UK SME admin or lending stack
  - - Allica Bank
    - Licensed UK bank
    - Established-business positioning with relationship-manager model
    - Established SMEs with higher balances and broader banking needs
    - 4.08% AER, cashback, relationship manager and bank-grade trust
    - Eligibility and balance thresholds make it less suited to the smallest early-stage firms
  notes: Profiles combine official product pages, filings and 2026 reviews. Scale fields use the best public signal available and say undisclosed where direct business-account metrics were not available.
