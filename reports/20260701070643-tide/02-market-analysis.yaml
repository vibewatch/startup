- id: TM004
  title: Growth drivers and constraints table
  columns:
  - Driver / constraint
  - Direction
  - Timing
  - Implication
  - Diligence ask
  rows:
  - - Open banking and smart-data adoption
    - Driver
    - Current / multi-year
    - Expands cash-flow, payment and financial-data use cases that make a bundled SME operating stack more valuable
    - Ask which Tide products benefit directly from open-banking initiated payments and data connectivity
  - - Making Tax Digital and future e-invoicing
    - Driver
    - Current through 2029
    - Pushes bookkeeping, tax prep and invoice workflows into software products rather than bank-only propositions
    - Request attach rates for accounting and tax tools by member cohort
  - - Challenger and specialist finance supply
    - Driver
    - Current
    - Supports Tide’s lending adjacency because SME finance markets are no longer only high-street-bank territory
    - Request revenue share and lender mix for Funding Options by Tide
  - - India formalisation, TReDS and digital lending infrastructure
    - Driver
    - Current / multi-year
    - Increases the monetisable subset of India’s MSME base over time
    - Ask for India paid-conversion rates and product mix rather than just member counts
  - - Business-account switching friction
    - Constraint
    - Current
    - Small-business switching volumes remain low, so winning incumbent primacy is slower than signing up new businesses
    - Measure greenfield versus switcher acquisition and business-account churn
  - - Trust, licence model and partner dependence
    - Constraint
    - Current / structural
    - Tide’s account proposition depends on partner banking rails and on clear communication of safeguarding or FSCS arrangements
    - Request complaints, outage history, and conversion drop-off tied to trust or account setup
  - - SME closures, macro pressure and credit cycles
    - Constraint
    - Current
    - Economic uncertainty, insolvencies, higher input costs and lender caution can suppress attach and retention
    - Request retention by cohort and bad-debt or approval data through stress periods
  - - Competition from scaled challengers and software incumbents
    - Constraint
    - Current / structural
    - Well-funded adjacent platforms already have millions of accounts or software customers, so Tide cannot assume whitespace capture
    - Request win-rate data versus challenger banks, Xero-Sage-class software and incumbent banks
  notes: The main debate is not whether the market exists; it is whether Tide can convert broad small-business demand into trusted primary relationships and high-value software or credit attach before competitors or macro stress intervene.
