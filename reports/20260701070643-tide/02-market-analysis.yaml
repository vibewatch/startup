- id: growth-drivers-constraints-and-valuation-relevance
  title: Growth drivers, constraints and valuation relevance
  body: 'The growth case is real, but it is not frictionless. Open banking adoption keeps rising, OBL’s payment and VRP metrics suggest deeper day-to-day usage, and the UK government’s digital-adoption programme is explicitly trying to reduce capability, cost and awareness barriers for SMEs. Making Tax Digital, planned e-invoicing and wider smart-data infrastructure all strengthen the logic for a bundled admin platform. India’s policy push around Udyam formalisation, TReDS and digital lending widens the medium-term addressable wedge there as well. The constraints are just as material. CASS data show that small-business switching volumes remain tiny versus total switching, suggesting that winning primary business accounts is still harder than signing up greenfield or newly formed firms. Tide’s current-account proposition also remains partner-dependent through ClearBank, so trust, FSCS understanding, operational resilience and regulatory disclosures remain part of the conversion problem. Competitive
    intensity is not theoretical: Starling and Xero both show large-scale digital distribution in adjacent layers, while UK economic data still show pressure from uncertainty, input-cost inflation and insolvencies. That is why Tide’s September 2025 $120 million TPG-led round at a $1.5 billion valuation has to be interpreted against a business that reached 2 million global members by May 2026, but was still reporting £177.2 million of 2024 turnover and an £11.3 million operating loss in its latest filed year.'
