  evidenceGaps:
  - type: missing-source
    severity: material
    topic: monetized-uk-sam
    missingEvidence: A public estimate of annual UK SME spend that cleanly combines business accounts, accounting software, payroll and credit into one Tide-relevant revenue pool.
    whyItMatters: Without a monetised spend denominator, entity counts can overstate practical revenue headroom and make valuation comparisons noisy.
    diligencePath: Ask management for UK ARPU, product attach rates, paid software penetration, and the share of members using accounts, accounting, payroll and credit together.
    relatedQuestionRefs:
    - QM007
    - QM025
    relatedTableRefs:
    - TM002
  - type: private-evidence-only
    severity: material
    topic: segment-attach-rates
    missingEvidence: Segment-level attach and retention data for sole traders, microbusinesses, incorporated SMEs and India MSMEs across accounts, software and credit.
    whyItMatters: Member growth is less valuable if higher-spend cohorts are not adopting deeper workflows or if retention differs sharply by legal form and geography.
    diligencePath: Request cohort tables that show members, paying software users, borrowers, churn and contribution margin by segment and geography.
    relatedQuestionRefs:
    - QM022
    - QM025
    relatedTableRefs:
    - TM003
  - type: missing-source
    severity: material
    topic: business-switching-friction
    missingEvidence: Direct Tide migration data showing incumbent-bank switch rates, onboarding fall-off, and the share of acquisitions that come from greenfield formation versus switching.
    whyItMatters: Official CASS statistics suggest business switching is rare, but they do not show how much of Tide’s growth comes from high-friction primary-account conversion.
    diligencePath: Ask for acquisition-channel mix, onboarding completion by source, and primary-account adoption among existing members.
    relatedQuestionRefs:
    - QM013
    - QM024
    relatedTableRefs:
    - TM004
  - type: missing-source
    severity: minor
    topic: india-monetization-definition
    missingEvidence: A public India metric that distinguishes total registered MSMEs from digitally active, paying, or credit-eligible MSMEs relevant to Tide’s monetisation.
    whyItMatters: The raw MSME headline can make India look enormous, but Tide’s monetisable wedge will be narrower if many firms remain lightly formalised or low-engagement.
    diligencePath: Request Tide’s India paid-conversion, engagement and product-mix data and compare it with official registration cohorts or digital-lending usage data.
    relatedQuestionRefs:
    - QM019
    - QM021
    - QM025
    relatedTableRefs:
    - TM002
