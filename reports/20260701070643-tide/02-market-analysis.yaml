- id: buyer-user-payer-segmentation
  title: Buyer, user, payer and adoption path
  body: Tide’s buyer map is not one homogeneous SME blob. Sole traders and freelancers are the most price-sensitive segment and are often both buyer and user; Tide’s own sole-trader copy notes that they are not legally required to hold a business account, which means adoption is driven by convenience, bookkeeping and tax separation rather than regulation. Microbusinesses with a few employees care more about invoicing, cash-flow visibility and first credit products, while incorporated SMEs add directors, finance managers or outsourced accountants as meaningful workflow influencers. Tide’s accounting pricing also separates sole traders from limited companies, showing that the payer is partly segmented by legal form and workflow complexity. In India, the user may still be the owner-manager, but the activation path is more formalisation-led because registration, payments and lending access are part of the value proposition. Across segments, the adoption sequence usually starts with formation
    or account opening, expands into payments and tax admin, and only later broadens into payroll, savings or credit. That progression is important for valuation because member growth does not automatically imply high software or lending attach.
