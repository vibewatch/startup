company:
  name: Tide
chapter:
  number: 2
  title: Market Analysis
  summary: 'Tide’s real market is narrower and more actionable than generic fintech TAM rhetoric: it sits at the intersection of UK SME business accounts, payments, formation, bookkeeping, invoicing, payroll and credit, with India adding a much larger but still partly formalising MSME wedge. Official business counts, lending flows, open-banking adoption and public-company software disclosures support substantial demand, but switching friction, partner dependence, regulation, competitive intensity and SME failure rates all constrain how quickly entity-count TAM can convert into durable revenue.'
sections:
- id: market-boundary-and-included-spend
  title: Market boundary and included spend
  body: 'Tide should not be analysed as a generic consumer neobank or as a broad all-finance platform. Its live product surface is explicitly SME-oriented: the current-account proposition combines payments, savings and core account rails, the sole-trader product emphasises tax separation and admin simplicity, the accounting product bundles bookkeeping, invoicing, VAT and Making Tax Digital workflows, and the funding marketplace extends into working-capital and growth finance. City AM’s May 2026 product description and TPG’s September 2025 investment thesis reinforce the same positioning by describing Tide as a business-management platform rather than a single banking feature. That means the included spend boundary is business accounts, business payments, invoicing, bookkeeping, payroll or payroll-adjacent admin, company formation and business credit for sole traders, freelancers, microbusinesses and incorporated SMEs. The right exclusions are consumer current accounts, generic personal finance,
    and large-enterprise ERP suites, because Tide’s buyer, product copy and member metrics are built around small-business operational jobs rather than household banking or enterprise-wide resource planning.'
  claimRefs:
