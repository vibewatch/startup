figures:
- id: FM001
  title: Market sizing lens
  type: pyramid
  layout: standard
  summary: The entity-count opportunity is broad, but Tide’s serviceable wedge narrows quickly once the lens moves from all businesses to formal operating firms and then to today’s served member base.
  data:
    nodes:
    - id: n1
      label: Broad UK business universe
      description: DBT and Parliament point to 5.7m private-sector businesses, including 5.4m micro businesses.
    - id: n2
      label: Formal operating base
      description: ONS counts 2.73m VAT/PAYE businesses, a narrower base more likely to support monetised financial-admin spend.
    - id: n3
      label: Tide workflow wedge
      description: The relevant wedge is SME accounts plus accounting, tax, invoicing, payroll and credit for sole traders, microbusinesses, incorporated SMEs and formalising India MSMEs.
    - id: n4
      label: Current served base
      description: By May 2026 Tide said it had 2m global members, including 900k UK SMEs and 1.1m+ in India.
  approximationNotes: This pyramid is a boundary filter, not a revenue waterfall. The top two layers are official entity counts, the third is a workflow-defined serviceable wedge, and the bottom is Tide’s current served footprint.
  claimRefs:
  - CM009
  - CM011
  - CM012
  - CM014
  - CM041
- id: FM002
  title: Market estimate range
  type: range
  layout: standard
  summary: Public UK business counts give a credible low-base-high range for the number of entities Tide could plausibly touch, even though they do not convert cleanly into a monetised TAM.
  data:
    items:
    - label: UK addressable business base (millions of entities)
      low: 2.73
      mid: 5.4
      high: 5.7
      note: Low = VAT/PAYE businesses (ONS), mid = micro businesses, high = private-sector businesses and SMEs (DBT and Parliament).
  approximationNotes: This is intentionally a boundary-based entity range rather than a spend estimate. It visualises why Tide’s TAM depends heavily on which legal-form and formality assumptions an analyst uses.
  claimRefs:
  - CM010
  - CM011
  - CM012
  - CM014
  - CM054
- id: FM003
  title: Buyer / segment map
  type: matrix
  layout: wide
  summary: Legal form changes who buys, who pays, and what first persuades a small business to adopt Tide beyond using a personal account or incumbent bank.
  data:
    columns:
    - Budget owner
    - First wedge
    - Key blocker
    - Expansion path
    rows:
    - label: Sole trader / freelancer
      values:
      - Owner-manager
      - Tax separation and invoicing
      - No legal requirement for a business account
      - Accounting, tax tools, then credit if turnover grows
    - label: Microbusiness employer
      values:
      - Founder or finance lead
      - Account plus payments plus cash-flow visibility
      - Switching effort from incumbent bank and spreadsheets
      - Bookkeeping, bills, payroll and savings
    - label: Incorporated SME
      values:
      - Director or finance manager
      - Account plus bookkeeping plus company compliance
      - More complex approvals and multi-user workflows
      - Payroll, credit and accountant-integrated reporting
    - label: New company / formation user
      values:
      - Founder
      - Registration plus account opening
      - Trust in partner model and onboarding completion
      - Invoices, tax setup and first funding products
    - label: India MSME
      values:
      - Owner-manager
      - Formalisation plus payments plus lending access
      - Monetisation depends on formalisation and digital trust
      - Broader admin, credit and workflow usage as business matures
  approximationNotes: This matrix is behavioural rather than quantitative. It is meant to show who controls purchase decisions and where switching friction or compliance burden changes the adoption path.
  claimRefs:
  - CM002
  - CM004
  - CM005
  - CM033
  - CM051
  - CM052
  - CM053
  - CM056
- id: FM004
  title: Adoption funnel or value-chain map
  type: flow
  layout: standard
  summary: Tide’s adoption path usually starts with a narrow operational pain point and only later broadens into a deeper, more valuable financial-admin relationship.
  data:
    nodes:
    - id: n1
      label: Formation or admin pain
      description: A sole trader, new company or small firm wants easier setup, clearer finances or tax separation.
    - id: n2
      label: Account and payments onboarding
      description: The business opens an account or links Tide into its payment workflow, but trust and onboarding completion still matter.
    - id: n3
      label: Accounting and compliance attach
      description: MTD, invoices, VAT and bookkeeping become the first software-led expansion layer.
    - id: n4
      label: Payroll, savings and credit attach
      description: Deeper monetisation comes from additional admin modules and finance products, subject to underwriting and workflow fit.
    - id: n5
      label: Primary operating relationship
      description: The end state is a sticky SME operating stack, but switching friction, partner dependence and competitive pressure can prevent full conversion.
    edges:
    - from: n1
      to: n2
      label: solve setup
    - from: n2
      to: n3
      label: reduce admin
    - from: n3
      to: n4
      label: deepen attach
    - from: n4
      to: n5
      label: become primary
  approximationNotes: The flow emphasises conversion risk. High member growth is valuable, but valuation improves most when Tide turns basic account adoption into trusted multi-product usage.
  claimRefs:
  - CM022
  - CM029
  - CM033
  - CM051
  - CM052
  - CM053
  - CM060
