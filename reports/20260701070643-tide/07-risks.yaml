- id: conduct-support-fraud-and-resilience
  title: Conduct, support, fraud, and resilience risk
  body: 'The clearest adverse pattern in the public record is not insolvency or a headline enforcement action; it is conduct friction around support, blocked accounts, delayed fund access, and communication. Tide’s complaints page promises acknowledgment and resolution within three business days and a final response within eight weeks, but public complaint channels show where that promise can miss in practice. Resolver highlights customer-service issues, account suspension, and delayed responses as recurring complaint types. Ombudsman materials are more important because they show the formal standard Tide is judged against: firms can restrict accounts for legitimate financial-crime reasons, but they must act proportionately, communicate fairly, and apply their own notice terms correctly. Two published FOS decisions upheld complaints that Tide gave too little notice or held back funds too long, ordering compensation and fund return. Adverse user sources echo the same shape. Recent Trustpilot
    entries cite month-long payroll complaint delays, missing or slow-moving payments, pricing disputes, and uncertainty during urgent BACS transfers. Capterra reviews similarly complain about outages, account holds during salary-critical periods, and fee friction. Security and fraud risk also remain material. Tide is directly exposed to the APP reimbursement regime for micro-enterprises and other in-scope customers, its own filing says APP volumes rose after mandatory reimbursement went live, and the status page shows that even short-lived CoP or account-details incidents can affect daily member operations and raise support pressure quickly.'
