- id: financial-strategic-and-macro-exposure
  title: Financial, strategic, and macro exposure
  body: Financially, Tide looks improved but not de-risked. The 2024 filing shows turnover rising strongly and operating losses narrowing, yet the entity was still loss-making and still took parent equity during and after the year. It also refinanced and repriced its revolving facility, while Companies House charges show TriplePoint security remains active into 2025. Fasanara’s warehouse adds meaningful capacity for Credit Flex and other working-capital products, but it also deepens Tide’s exposure to credit performance, fraud, counterparty quality, and external funding conditions. Strategically, the risk is that Tide is trying to do many things at once. The company’s own 2026 milestone release now spans insurance, MTD, payroll, credit, payment acceptance, savings, web-building, and international market launches, while TPG’s investment case explicitly funds more expansion and more product development. India is the sharpest execution swing factor. Tide says India is its fastest-growing market
    and ET reports a new £500 million five-year commitment plus 800 new jobs, but the same coverage says Tide still has no local regulatory licence and relies on around 25 non-bank lenders while evaluating what RBI permission to seek. That means growth can continue, but it may do so with higher fixed costs, more localisation work, and more regulatory uncertainty. Competition also matters. The British Business Bank describes a market with more challenger, specialist-bank, and non-bank options for SMEs, while Tide’s own public service-quality benchmarking sits it beside Starling, Mettle, HSBC, Monzo and others. In a tougher macro environment, Tide’s micro-SME customer base could become simultaneously harder to retain, riskier to lend to, and more expensive to support.
