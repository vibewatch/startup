  evidenceGaps:
  - type: missing-source
    severity: material
    topic: service-quality-ranking
    missingEvidence: The latest Tide-specific score, rank, and trend line in the business-banking service-quality tables versus named peers.
    whyItMatters: Benchmark pressure matters for a conduct-heavy fintech because weak relative rankings can amplify complaint and switching risk even without formal enforcement.
    diligencePath: Pull the latest BVA BDRC or CMA-linked table download and reconcile Tide’s exact ranking, category scores, and six-month movement versus Starling, Mettle, Monzo, and HSBC.
    relatedQuestionRefs:
    - QR014
  - type: private-evidence-only
    severity: material
    topic: credit-loss-metrics
    missingEvidence: Current default, delinquency, approval, recovery, and loan-loss metrics for Credit Flex and other Tide-linked credit books.
    whyItMatters: Without actual credit-performance data, investors cannot tell whether Tide’s growing credit ambition is additive revenue or a future loss amplifier.
    diligencePath: Request board or lender reporting for approval rates, vintage curves, arrears buckets, recoveries, and provisioning by product and geography.
    relatedQuestionRefs:
    - QR024
    relatedTableRefs:
    - TR003
    - TR005
  - type: missing-source
    severity: material
    topic: india-licence-roadmap
    missingEvidence: Management’s chosen RBI licence path, expected timing, dependencies, and fallback plan if licensing is delayed.
    whyItMatters: India is now a major growth engine and cost centre; unclear licensing strategy can cap monetisation, widen compliance risk, and increase partner dependence.
    diligencePath: Ask management for the India regulatory roadmap, regulator engagement status, and product lines that require new permissions versus can stay partner-led.
    relatedQuestionRefs:
    - QR027
    relatedTableRefs:
    - TR001
    - TR004
  - type: private-evidence-only
    severity: material
    topic: partner-slas-and-concentration
    missingEvidence: Partner-level SLAs, concentration thresholds, incident responsibilities, and exit plans for ClearBank, Adyen, PPT, and critical lenders/providers.
    whyItMatters: Tide’s model depends on external rails, so resilience cannot be fully underwritten without knowing how outages, disputes, or exits are contractually handled.
    diligencePath: Review key partner contracts, resilience addenda, concentration dashboards, substitution timelines, and post-incident governance documents.
    relatedQuestionRefs:
    - QR030
    relatedTableRefs:
    - TR001
    - TR003
