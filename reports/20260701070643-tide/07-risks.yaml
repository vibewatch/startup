- id: TR005
  title: Mitigation and kill criteria table
  columns:
  - Risk cluster
  - Monitorable trigger
  - Threshold / event
  - Action implication
  rows:
  - - Conduct / account-freeze risk
    - Formal complaints and upheld FOS cases
    - More upheld blocked-account or notice complaints, or evidence that complaint SLAs are routinely missed.
    - Treat as evidence that Consumer Duty and support operations are not scaling with controls.
  - - Partner-rail resilience
    - Status-page incidents and partner operational events
    - Repeated CoP, account-details, payment, or partner-bank incidents inside a short period.
    - Re-underwrite partner concentration and request incident root-cause / partner-attribution detail.
  - - APP fraud and financial crime
    - Claims and reimbursement burden
    - APP payouts or false-positive review friction rise faster than member growth or management guidance.
    - Assume fraud costs and support drag are eroding unit economics.
  - - Capital and secured liquidity
    - Refinancing or pricing deterioration
    - Failure to refinance secured facilities, materially worse pricing, or equity support becoming more urgent.
    - Assume capital dependence remains structural and downside multiple compression is warranted.
  - - India execution / licensing
    - Licence delay or lender dependence deepening
    - No clear RBI-path progress while headcount and spend continue to scale rapidly.
    - Treat India as a growth-risk amplifier rather than a diversification hedge.
  - - Product sprawl / quality
    - Support backlog and module-level failures
    - Repeated complaints or outages in newer modules like payroll, payments, or admin tools.
    - Assume cross-sell breadth is creating more operational burden than durable moat.
  notes: These kill criteria are public-monitoring signals designed for refresh diligence; they emphasise observable deterioration rather than private management targets.
