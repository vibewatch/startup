- id: TU005
  title: Expansion and concentration risk table
  columns:
  - Expansion driver
  - Concentration / durability risk
  - Impact
  - Diligence path
  rows:
  - - Free-to-paid UK plan ladder with stronger support and savings yield
    - No public attach rate from Free into Smart / Pro / Max tiers
    - If paid-tier conversion is healthy Tide can monetise support-heavy SMBs without losing the free funnel
    - Request plan mix, paid conversion, and churn by plan tier.
  - - Current-account switching via CASS
    - Switch intent does not prove members actually move payroll, receivables, and treasury rails over
    - Primary-account conversion is one of the best indicators that Tide is becoming the operating bank, not just a finance app
    - Request percentage of new members who complete CASS and keep Tide as their main operating account after 6 and 12 months.
  - - Cross-sell from account into invoicing, team spend, credit, and savings
    - Public sources show features, not usage penetration or attach by cohort
    - Multi-product adoption should deepen stickiness and gross margin if members actually use several modules
    - Request attach rates for invoicing, team cards, savings, and credit by customer segment and geography.
  - - India admin-tool bundle for invoicing, bill pay, QR, expense cards, and lending access
    - India may include many members using only one workflow rather than a full primary-finance relationship
    - The upside is broad MSME reach; the risk is shallow monetisation or lower primary-account intensity
    - Request India active members by product, monthly engagement, and revenue-active cohort share.
  - - Named-customer case studies and women-led-business programs
    - Public proof is concentrated in marketing-friendly stories rather than disclosed top-customer revenue concentration
    - The narrative is attractive but does not show concentration, logo retention, or revenue distribution
    - Request top-10 customer concentration, cohort retention, and renewal behaviour by named-reference class.
  notes: Expansion logic is public and credible, but concentration and customer economics remain mostly undisclosed.
